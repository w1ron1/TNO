 DLC_DESCRIPTION_dlc018:0 "Нові дерева національних фокусів і події для Канади, Австралії, Нової Зеландії, Індії та Південної Африки, а також бойовий план «Прорив», який дозволяє втримувати більший контроль над великими оточеннями та пробиванням ворожих ліній."
 DLC_DESCRIPTION_dlc020:0 "Чотири нових дерева фокусів: випробуйте війну зі складних перспектив Угорщини, Румунії, Чехословаччини та Югославії."
 DLC_DESCRIPTION_dlc022:0 "Змінені дерева фокусів для Німеччини та Японії — двох великих членів Осі, котрі тепер мають альтернативні шляхи, як-от переворот проти Гітлера та встановлення комунізму або демократії в Японії."
 DLC_DESCRIPTION_dlc023:0 "Отримайте нові дизайни кораблів, риси та навички для адміралів, морську техніку, а також міни для захисту своїх морів і морських шляхів для уникнення небезпек. Включає нові дерева фокусів для Нідерландів, Сполученого Королівства, Мексики та США."
 DLC_DESCRIPTION_dlc028:0 "La Résistance додає таємних агентів, шпигунські місії та нові можливості для рухів спротиву. Надсилайте агентів у небезпечні території, щоби розшифрувати ворожі секрети або підготувати підґрунтя для Вашого вторгнення, зв'язавшися з колабораціоністами, які будуть раді отримати будь-яку владу."
 DLC_DESCRIPTION_dlc031:0 "Додає окремі дерева національних фокусів для малих держав на березі Чорного й Егейського морів. Болгарія, Греція та Туреччина можуть створити унікальні історичні й альтернативні шляхи, протистоячи намаганням великих держав панувати над стратегічно важливими морськими шляхами на Босфорі й Дарданеллах."
 DLC_DESCRIPTION_dlc034:0 "No Step Back додає більші деталі для багатьох націй у Східній Європі, унікальні ігрові механіки для відображення совєцької політики, а також багато поліпшень військового аспекту гри."
 DLC_DESCRIPTION_dlc036: "Побудуйте нову імперію, чиніть опір іноземній агресії або досліджуйте межі нейтралітету. Доповнення «By Blood Alone» додає нові варіанти альтернативної історії та різноманітність ігрового процесу для Італії, Ефіопії та Швайцарії, а також інші суттєві зміни."
 DLC_DESCRIPTION_dlc038: "Створюйте нові захопливі історії країн Північної Європи, поки провідні держави Європи борються за майбутнє світу. У центрі уваги - нові дерева національних фокусів для Фінляндії, Швеції, Данії та Норвегії. Спеціалізуйте свою оборонну промисловість, щоб підвищити ефективність, а потім продавайте цю зброю на новому міжнародному ринку."
 DLC_DESCRIPTION_dlc040: "У доповненні «Trial of Allegiance» додано масштабні дерева фокусів для Бразилії, Аргентини, Чилі, Уругваю та Парагваю. Стабільність цілого континенту висить на волосині. Відкрийте новий фронт війни, завойовуючи прихильність європейських покровителів за допомогою свого найціннішого ресурсу — вашої вірності."
 DLC_DESCRIPTION_dlc043: "Розробляйте прототипи технологій та зброї для використання проти ворогів. Проводьте рейди з метою знищення науково-дослідних об’єктів, гребель та стратегічно важливих об’єктів ворогів. Нові та оновлені дерева фокусів дадуть вам змогу використовувати «Внутрішнє коло Німеччини» для досягнення своїх цілей, відтворити імперію Габсбургів у ролі Австрії чи Угорщини, а також дослідити динаміку розвитку Бельгії та її колонії — Бельгійського Конґо."
 DLC_DESCRIPTION_dlc046: "У доповнені «Graveyard of Empires» для Ірану, Британського Раджу, Іраку та Афганістану запроваджено унікальні дерева фокусів. Обмежте вплив зовнішніх сил, що лізуть у ваші справи і відродіть втрачену гордість своєї нації, прагнучи до панування на Близькому Сході та в Південній Азії."
 DLC_DESCRIPTION_dlc049: "Прокладіть нові шляхи в історії Японії, Китаю та Філіппін у доповненні «No Compromise, No Surrender». Отримайте більш глибокий контроль над фракціями, розробляйте нові військові доктрини та вирішуйте долю Тихоокеанського регіону та інших територій."
 DLC_DESCRIPTION_dlc051: "Відтворіть Королівство Богемія, створіть союз центральноєвропейських держав, захистіть себе за допомогою укріплень або сформуйте мережу союзників за допомогою нового дерева фокусів для Чехословаччини у доповненні «Peace for Our Time»."
 DLC_DESCRIPTION_dlc052: "Опиніться в самому центрі командування, відправивши своїх генералів на передову та нагородивши медалями найуспішніших капітанів кораблів. Відкиньте японську інвазію в Південно-Східній Азії, граючи за Австралію; створіть нову імперію, граючи за Сіам; і вирішіть долю Індонезії — з голландським пануванням чи без нього."
