 ### Ідеї ###
 BKF_idea_remnant_francophilia: "Залишкова франкофілія"
 BKF_idea_remnant_francophilia_desc: "Верхня Вольта — одна з небагатьох колишніх французьких колоній, яка бачила співпрацю з Францією як єдиний дипломатичний та економічний шлях уперед, а також як єдиний спосіб забезпечити стабільність.\n\nХоча франкофілів поступово витісняють, один за одним, привид французького колоніалізму досі залишається в тіні кожного рішення, що ухвалює уряд Верхньої Вольти."
 BKF_idea_remnant_francophilia_tt: "§YДоля Верхньої Вольти тісно пов'язана з французами, і її майбутнє вирішиться в найближчі роки.§!"
 BKF_idea_relative_democracy: "Відносна демократія"
 BKF_idea_relative_democracy_desc: "Демократична система у Верхній Вольті далека від досконалості, але вона все ще працює хоча б частково і залишається хоча б відносно демократичною.\n\nХоча країна намагається організувати цю систему через логістичні труднощі, вона наразі влаштовує населення Верхньої Вольти. Проте ще належить побачити, чи ця задоволеність триватиме довго."
