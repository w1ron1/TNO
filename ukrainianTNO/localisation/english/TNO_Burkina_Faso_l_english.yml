 ## Опис лідерів ##
 POLITICS_MAURICE_YAMEOGO_DESC: "Щоб зрозуміти, чому Моріс Ямеого так відданий ідеї Франсафрики, настільки, що його прозвали "Месьє Моріс", потрібно знати його минуле. Його зневажала навіть власна родина лише за інтерес до християнства, тому Ямеого покинув своє колишнє життя і вступив у семінарію. Однак його стосунки вийшли далеко за межі церковних норм. Ямеого хотів стати священником, але його також приваблювали жінки та вечірки. У 1939 році він залишив семінарію, не закінчивши навчання, і отримав посаду клерка в адміністрації французької колонії. Це був престижний пост, що означав успіх, безпеку та повагу. Поки в Західній Африці вирувала війна, Ямеого відправили в Абіджан — рай для "цивілізованих" африканців.\n\nВинагороди від Вільної Франції, разом із честолюбством Ямеого, зробили його надзвичайно відданим французькій справі в Західній Африці. Повернувшись на батьківщину, він, здобувши народну підтримку, відновив адміністрацію Верхньої Вольти, але відмовився співпрацювати з іншими африканістськими лідерами, такими як Сенгор. Потім Ямеого усунув усю парламентську опозицію, провів чистку своїх ворогів і запровадив однопартійну систему.\n\nЯмеого стверджує, що Верхня Вольта — це вільна, єдина та демократична республіка, яскравий приклад африканського визволення, але це не може бути далі від істини. Верхня Вольта — це розділена, слабка та деспотична державка, яка повністю залежить від допомоги Франції для захисту від могутніших воєначальників, що межують із країною. Хоча така стратегія працює зараз, якщо підтримка Вільної Франції припиниться, Ямеого швидко залишиться в ізоляції, і хоч він часто зустрічається з де Голлем, щоб зберегти добрі відносини, рано чи пізно він може зробити фатальний крок."

