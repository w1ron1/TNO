 ##### LEADER DESCRIPTIONS #####
 POLITICS_LEGION_ADEODATUS_IOVITA_MANLIUS:0 "Легата було нагороджено трав'яним вінцем за порятунок свого легіону від неминучої загибелі в Галатії багато років тому. Колись це було його гордістю, справжнім знаком честі та символом величі й слави.\n\nТепер же він дедалі важче відчуває вагу вінця на своїй голові, усвідомлюючи, що це був не знак величі, а знак ганьби. Бо саме він прирік свій легіон на вічність.\n\nВін здобув тисячу перемог, тисячу тріумфів і тисячу світів. Безкінечні місця, що не піддавалися поясненню й відмовлялися коритися тому, що колись вважалося законами людства, тепер схилилися перед ним. Ніхто не може стверджувати, що він не є справді великим, що він не є найвеличнішим завойовником за всю вічність.\n\nАле він не Імператор. Він не Цезар. Він не Авґуст. Він не бажає правити володіннями, він хоче знову побачити Рим. Побачити зелені очі, що колись дивилися в його очі, і тих, кого він колись мріяв виховати сильними. Він мріє про день, коли зможе постаріти поруч із цими очима, і коли одного дня зможе знайти спокій.\n\nУ міру того як шепіт стає гучнішим, а темрява безодні, над якою ступає його легіон, стає дедалі чорнішою, з кожним разом, коли він знову постає з того, що, як він молився, було смертю, стає дедалі очевидніше: спокій більше ніколи його не знайде. Він приречений.\n\nІ так само приречені ті, хто постає проти нього."
 
