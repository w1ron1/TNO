RMN_conquest_of_the_realms:0 "Завоювання світів"
RMN_conquest_of_the_realms_desc:0 "Вони йдуть далі й далі. Від світу до світу. Від земель із незкінечними металами та літаючими колісницями до земель, перетворених гнівом богів на попіл і пил. Легіон безсмертних бачив багато світів, бачив багато часів і завоював кожен із них.\n\nЗ кожним завоюванням вони ставали сильнішими, а з кожним підкоренням їхня жага звільнитися від мук перемоги зростала. Однак визволення вислизає від них, і тому вони завойовують. Ідуть далі й далі, аж до кінця всього часу.\n\nАле що ховається в темряві?"