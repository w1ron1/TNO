    # Phase 2

      MAG_DEC_econ_werbell_2_expanded_staff_recruitment: "Розширений набір персоналу"
      MAG_DEC_econ_werbell_2_expanded_staff_recruitment_desc: "Завдяки ширшому охопленню ми зможемо щомісяця залучати до лав більше придатних найманців."
      MAG_DEC_econ_werbell_2_near_waters_exploitation: "Освоєння ближніх вод"
      MAG_DEC_econ_werbell_2_near_waters_exploitation_desc: "Ми відрядимо оперативників прокласти лінію постачання з прилеглими районами, що забезпечить сталий потік ресурсів і їх безпечне перевезення на §nМаґаданську базу§!."
      MAG_DEC_econ_werbell_2_establish_combat_unit_fobs: "Створити передові бази бойових підрозділів"
      MAG_DEC_econ_werbell_2_establish_combat_unit_fobs_desc: "Мережа передових оперативних баз для бойових підрозділів дасть нам змогу розширити найманські операції по всьому світу."
      MAG_DEC_econ_werbell_2_construct_base_development_fobs: "Збудувати передові бази розвитку"
      MAG_DEC_econ_werbell_2_construct_base_development_fobs_desc: "Розширивши об'єкти розвитку бази за межі Маґадана, ми зміцнимо місцеве добування ресурсів. Це сприятиме і військовому, і цивільному виробництву."
      MAG_DEC_econ_werbell_2_expand_and_darken_our_support_operations: "Розширити й затемнити операції забезпечення"
      MAG_DEC_econ_werbell_2_expand_and_darken_our_support_operations_desc: "Не здобувши визнання Вашинґтона, ми й далі працюватимемо в тіні. Граючи розданими картами, збудуємо додаткові бази забезпечення в підконтрольних зонах. Якщо світ відмовляє нам у прибутках від законної торгівлі, ми покриємо нестачу, постачаючи товари, яких можновладці позбавляють інших. Вільна торгівля на Тихому океані буде абсолютною!"
      MAG_DEC_econ_werbell_2_establish_the_free_port_of_magadan: "Заснувати вільний порт Маґадана"
      MAG_DEC_econ_werbell_2_establish_the_free_port_of_magadan_desc: "З офіційною підтримкою Вашинґтона ми можемо перетворити Маґадан на законний торговельний порт, оплот цілковито вільної торгівлі - звісно, з нечисленними формальними правилами задля пристойного вигляду. Зрештою, хіба кожен найманець у душі не підприємець? До того ж операції §nМаґаданської бази§! можна буде приховати за фасадом одного з найкращих у світі імпортно-експортних підприємств."
      MAG_DEC_econ_werbell_2_construct_the_kamchatka_command_fob: "Збудувати командну передову базу на Камчатці"
      MAG_DEC_econ_werbell_2_construct_the_kamchatka_command_fob_desc: "§nМаґаданська база§! досягла межі сталого навантаження. Нам потрібна друга передова командна база, яка поглибить наше проникнення в Тихий океан. Найкращий варіянт - створити належну передову оперативну базу біля узбережжя Камчатки: віддалену, але з добрим повітряним і морським доступом на південь та захід."

      MAG_econ_werbell_dark_economy_modifier: "Темна економіка"
      MAG_econ_werbell_dark_economy_modifier_desc: "Не здобувши американського визнання, ми тепер покладаємося на піратство, контрабанду й убивства."
      MAG_econ_werbell_dark_economy_misc_income_modifier_add_N_tt: "(§YТемна економіка§!)\n  - Інші доходи: [?N|+].\n"
      MAG_econ_werbell_dark_economy_monthly_credit_rating_add_N_tt: "(§YТемна економіка§!)\n  - Щомісячний поступ кредитного рейтингу: [?N|+].\n"
      MAG_econ_werbell_grey_economy_modifier: "Сіра економіка"
      MAG_econ_werbell_grey_economy_modifier_desc: "Завдяки американському визнанню ми тепер маємо законне торговельне підприємство-прикриття, яке надасть чистішого вигляду нашій вільній торгівлі - саме такій, як її задумали батьки-засновники."
      MAG_econ_werbell_grey_economy_trade_opinion_factor_add_N_tt: "(§YСіра економіка§!)\n  - Вплив торговельної думки: [?N|+].\n"
      MAG_econ_werbell_grey_economy_monthly_credit_rating_add_N_tt: "(§YСіра економіка§!)\n  - Щомісячний поступ кредитного рейтингу: [?N|+].\n"

      MAG_econ_werbell_dark_economy_create_tt: "Ми підемо шляхом §R«темної»§! економіки. Зміну відобразить новий національний дух §Y«Темна економіка»§!.\n"
      MAG_econ_werbell_grey_economy_create_tt: "Ми підемо шляхом §s«сірої»§! економіки. Зміну відобразить новий національний дух §Y«Сіра економіка»§!.\n"

      MAG_DEC_econ_werbell_phase_2_to_3: "Завершено §Y5§! рішень цього етапу. Наразі завершено лише [?MAG_econ_werbell_completed_decisions|Y0]."

    # Phase 3

      MAG_DEC_econ_werbell_3_far_waters_exploitation: "Освоєння далеких вод"
      MAG_DEC_econ_werbell_3_far_waters_exploitation_desc: "Ми відрядимо оперативників прокласти лінію постачання з прилеглими районами, що забезпечить сталий потік ресурсів і їх безпечне перевезення на §nМаґаданську базу§!."
      MAG_DEC_econ_werbell_3_pacific_combat_unit_fobs: "Тихоокеанські передові бази бойових підрозділів"
      MAG_DEC_econ_werbell_3_pacific_combat_unit_fobs_desc: "Збільшивши охоплення Тихого океану, ми зможемо розгортати сили глибоко на території Сфери співпроцвітання та Південної Америки й отримувати ще вигідніші найманські контракти."
      MAG_DEC_econ_werbell_3_construct_intel_fobs: "Збудувати передові розвідувальні бази"
      MAG_DEC_econ_werbell_3_construct_intel_fobs_desc: "Зі стратегічної позиції на Камчатці ми зможемо проводити шпигунські операції та польоти по всьому Тихому океану. Зі зростанням розвідувальних можливостей зросте й ціна матеріалів, здатних зацікавити майбутніх клієнтів."
      MAG_DEC_econ_werbell_3_construct_support_fobs: "Збудувати передові бази забезпечення"
      MAG_DEC_econ_werbell_3_construct_support_fobs_desc: "Оскільки на §nМаґаданській базі§! вже не можна розширювати діяльність, не привертаючи зайвої уваги, ми розгорнемо операції забезпечення на Камчатці та довкола неї, щоб усунути вузькі місця постачання."
      MAG_DEC_econ_werbell_3_a_pacific_pirate_armada: "Тихоокеанська піратська армада"
      MAG_DEC_econ_werbell_3_a_pacific_pirate_armada_desc: "Якщо вже відбувати строк, то чому б не скоїти злочин? Світ вирішив поводитися з нами як зі злочинцями - тож заробімо на цьому. Безкрайній Тихий океан уособлює свободу чоловіків і жінок у наших лавах. Під чорним прапором свободи наші катери й літаки подбають, щоб за належну суму кожен отримав бажане. А завдяки чудовій розвідці ми триматимемося досить далеко від інтересів Сфери співпроцвітання й ОВН, аби не розлютити когось, хто здатен дати відсіч."
      MAG_DEC_econ_werbell_3_the_magadan_merchant_fleet: "Маґаданський торговельний флот"
      MAG_DEC_econ_werbell_3_the_magadan_merchant_fleet_desc: "Маґадан прославиться найкращим торговельним флотом на Тихому океані. Його конвої під стягом свободи, яку може дарувати лише Америка, доправлятимуть товари в усі куточки світу. Маючи вдосталь вантажних суден для всього законного краму й криголамів для цілорічної роботи, ми отримаємо неймовірні прибутки."
      MAG_DEC_econ_werbell_3_establish_a_caribbean_command_center_and_hangar: "Створити карибський командний центр і ангар"
      MAG_DEC_econ_werbell_3_establish_a_caribbean_command_center_and_hangar_desc: "Коли Сибір і Тихий океан стануть безпечними для наших операцій, настане час вийти за Панамський канал і розгорнутися по всьому світу. Для цього ми придбаємо об'єкт у міжнародних водах Карибського моря й зробимо його базою операцій в Атлантиці та поза нею. Це буде прихисток СБК за межами Сибіру - наша дочірня база. З опорою в Атлантиці ми працюватимемо ще краще. Непевний переворот проти вотчини Матковского перетворився на щось велике."
      MAG_DEC_econ_werbell_phase_3_to_4: "Завершено §Y5§! рішень цього етапу. Наразі завершено лише [?MAG_econ_werbell_completed_decisions|Y0]."

    # Phase 4

      MAG_DEC_econ_werbell_4_global_recruitment_drive: "Всесвітня вербувальна кампанія"
      MAG_DEC_econ_werbell_4_global_recruitment_drive_desc: "Завдяки радіусу дії карибської бази ми можемо розширити вербувальну кампанію й дістати доступ до потенційних новобранців з Европи та Африки. Колись їх відділяли гори й тисячі кілометрів земель Сфери співпроцвітання та Пакту єдності, а тепер до них лише кілька годин морем."
      MAG_DEC_econ_werbell_4_atlantic_combat_unit_fobs: "Атлантичні передові бази бойових підрозділів"
      MAG_DEC_econ_werbell_4_atlantic_combat_unit_fobs_desc: "Попри величезний масштаб, створення передових баз найманих сил у глибині Атлантики відкриє безліч можливостей і раніше недосяжних ринків. Африка, Близький Схід і навіть Европа жадають професійних солдатів удачі для брудної роботи. Вірні своїй назві, ми діятимемо без жодних кордонів на шляху."
      MAG_DEC_econ_werbell_4_construct_ai_lab: "Збудувати лабораторію ШІ"
      MAG_DEC_econ_werbell_4_construct_ai_lab_desc: "Запропонована незалежними інженерами, що вступили до лав СБК, лабораторія ШІ дасть змогу досліджувати передову військову електроніку та системи озброєнь із досі неймовірним потенціялом."
      MAG_DEC_econ_werbell_4_construct_medical_fob_and_sick_bay: "Збудувати передову медичну базу й лазарет"
      MAG_DEC_econ_werbell_4_construct_medical_fob_and_sick_bay_desc: "Передова медична база з лазаретом дасть змогу лікувати поранених і хворих та допомагати солдатам оговтатися від посттравматичного розладу після служби в бойових підрозділах. Удома користь буде невеликою, проте це зменшить втрати за кордоном і сприятиме розвитку бойової медицини."
      MAG_DEC_econ_werbell_4_the_crimson_corsairs_of_the_caribbean: "Багряні корсари Карибів"
      MAG_DEC_econ_werbell_4_the_crimson_corsairs_of_the_caribbean_desc: "Контрабанда зброї, наркотиків та іншого забороненого краму досі була винятково прибутковою. Тепер, коли нам доступні Африка, Европа й західне узбережжя Америк, очевидний наступний крок - вийти на ці ринки. Як завжди, розвідка не дасть нам встрягнути в конфлікт із кимось, хто здатен дати відсіч. Утім, у цих водах додаткові витрати неминучі. Як то кажуть, §Yдерево свободи час від часу треба освіжати§! §Rкров'ю§! §Wпатріотів§!§B.§!"
      MAG_DEC_econ_werbell_4_a_global_trade_empire: "Всесвітня торговельна імперія"
      MAG_DEC_econ_werbell_4_a_global_trade_empire_desc: "Почавши зі скромного осередку, наша маґаданська мережа виросла у справді всесвітню торговельну імперію. Тепер ми втілюємо американські чесноти вільної торгівлі, вільного підприємництва й вільних людей. Під прапором свободи наші вантажні судна безперешкодно ходять між Тихим та Атлантичним океанами й везуть усе, чого забажає богобоязлива вільнолюбна людина - якщо вистачить грошей на рахунку. §RБоже§!, §Wблагослови§! §BАмерику!§!"

