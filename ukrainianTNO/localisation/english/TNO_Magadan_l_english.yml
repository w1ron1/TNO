 ### Superregional events ###

 #Petlin
 petlin.1.t: "Нова Республіка"
 petlin.1.desc: "Пєтлін поправив окуляри, заходячи до кабінету Матковского в колишній штаб-квартирі РФП у Маґадані. Було видно, що тут жили: стіл колишнього Вождя захаращували чарки з чистим віскі та пляшки горілки, що збирали пил. Матковскій, певно, знав про близький арешт і відповідно підготувався. Пєтлін лише не чекав, що на заході політичної кар'єри той так налягатиме на алкоголь. Надворі вітер завивав і люто бив у шибки. Пєтлін хотів здригнутися, та не від холоду.\n\nВін пам'ятав Матковского, якого охоронці тягли до в'язниці чекати суду: налиті кров'ю очі й бліде обличчя кричали про цілковиту поразку. Колись Пєтлін уважав його до певної міри доброю людиною: спротив чорносорочечникам і звичному для Харбіна дикому варварству був чеснотою. Коли Пєтлін запропонував Сибірський білль про права, старий Вождь наче зрадів новому крокові до політичних реформ. Та кілька років тому саме в цьому кабінеті Матковскій шматував його проєкт, називаючи ідеї «надто ліберальними». Потім вибухнув скандал із Дальстроєм. Матковскій завжди був чудовиськом.\n\n«Більше ніякого Харбіна, - сказав Пєтлін Матковскому. - Ніяких звірств, ніяких ідеологій, що опускають нас до рівня худоби». Він підійшов до улюбленого грамофона Матковского й увімкнув його. Повітря наповнив «Марш сибірських стрільців». Пєтлін підняв порожню чарку за давно полеглих товаришів."
 petlin.1.a: "«За пам'ять про Харбін»."

 petlin.2.t: "Надія для Сибіру?"
 petlin.2.desc: "Від наших контактів у СНР до ЦРУ надійшли обнадійливі звіти. Новий уряд перебрав владу в режиму Міхаїла Матковского й, схоже, має всі ознаки зародження дієвої демократії. Очолюваний Ніколаєм Пєтліним уряд також дуже зацікавлений у зміцненні зв'язків зі США. Відповідні запити вже надійшли до Державного департаменту й чекають нашої відповіді."
 petlin.2.a: "Нові друзі ніколи не завадять."

 petlin.3.t: "Звістка з Вашинґтона"
 petlin.3.desc: "Схоже, наші зусилля зі зміцнення зв'язків зі Сполученими Штатами дали плоди. Американські дипломати повідомили нашому міністерству закордонних справ, що зацікавлені в розширенні економічних і дипломатичних відносин між нашими державами. Лишилося узгодити подробиці, але для міністерства це не має бути складно. Можливо, це початок прекрасних відносин!"
 petlin.3.a: "Чудово."

 petlin.4.t: "Вигнання тіні"
 petlin.4.desc: "«Це безглуздя, Пєтліне! - сказав Алєксандр Павлов у його кабінеті. - Вож... Матковскій, може, й був злочинцем, але скасувати його титул - зрада нашої справи». Павлов зітхнув. «Облишмо це, друже. Ми мусимо берегти спадщину попередників. Матковскій був доброю людиною, і без нього партія не дійшла б до Сибіру. Так, злочинець, але все робив заради слави Батьківщини».\n\n«Я тобі вірю, Павлове, - спокійно відповів Пєтлін. - Але, товаришу, без Матковского не існувало б Дальстрою. Документи... - Пєтлін роздратовано зітхнув. - Документи в Іркутській Президії. Пам'ятаєш? Паперові сліди, які він палив, приховуючи злочини. Совєти нам не союзники, та їхні відомості важливі. Матковскій - злочинець, і я віддам його під суд. У цій - у моїй - партії не лишиться й сліду його впливу. Сподіваюся, ти розумієш».\n\n«Гаразд. Якщо ти не визнаєш його існування, я не визнаю твого уряду». Він указав на Пєтліна. «Слухай, Пєтліне. Я й раніше тебе не любив, а тепер стримуватися нема чого. Ти не мій Вождь, Ніколаю Пєтліне, і трудовики про це дізнаються. Як і ДРУ». Він гнівно вийшов.\n\nПєтліну кортіло кинути навздогін американський вислів. Як він там звучав?"
 petlin.4.a: "«Дивись, щоби двері не дали по сраці»."

 petlin.5.t: "Більше не злочинці"
 petlin.5.desc: "Незвичним було відчуття голих ніг без кайданів. За зв'язки з НКВД Іванова відправили до Дальстрою копати залізниці й виконувати безглузді громадські роботи. День і ніч він надривався на голодному пайку, певний, що ось-ось упаде. Тіло ослабло: руки й плечі - самі кістки, майже без м'язів. Рідка несмачна юшка не давала сил.\n\nА потім до табору ввійшли озброєні солдати СНР і всіх заарештували. Дехто з наглядачів після перестрілки з армією втік у ліси. Іванов чув, що непокірних охоронців схопили й разом із їхнім Вождем віддадуть під суд. Це приголомшило. Правосуддя в глибині російського Далекого Сходу було не малоймовірним - неможливим. Та ось солдати зняли з нього кайдани й вивели з пекла.\n\nТепер турбувала лише потреба знайти роботу. Та президент Пєтлін і прем'єр-міністр напевно подбають про це. Більше ніяких тіней і панування сил, що прагнуть лише влади."
 petlin.5.a: "Лише справедливість."

 petlin.6.t: "Спогади про Харбін"
 petlin.6.desc: "Картина здавалася знайомою. Пєтлін пам'ятав харбінські вечори й ночі на вершині могутности РФП. Свастика - освітлений електрикою гачкуватий хрест - сяяла, мов різдвяна ялинка, у морозних зимових вітрах. Вони стояли, зігріті не вогнем, а лише силою волі. І любов'ю.\n\nЛюбов - найсильніше почуття. Вона повернула їх до Росії. Вона змушувала думати про неї, коли японці й китайці їх ігнорували та зневажали. Але любов породила й одержимість Родзаєвского чистою Росією, виправдала звірства Дальстрою. Пєтлін і маґаданці тримали свічки на згадку про ці трагедії та подвиги волі, заплющували очі й молилися. Хор тихо співав Господу гімни про прощення й каяття. Пєтлін заплющив очі.\n\nВін згадав власне минуле: як організовував людей, чиї голоси колись тепло про нього відгукувалися й дбали про нього. Матковского, Родзаєвского - тоді всі вони були молоді й такі дурні. Такі, такі дурні. Коли він розплющив очі, патріарх повів паству молитвою Господньою. Пєтлін повторював за ним."
 petlin.6.a: "«І прости нам провини наші, як і ми прощаємо винуватцям нашим»."

 petlin.7.t: "Прощання"
 petlin.7.desc: "«Що ж, Лідіє, - сказав Пєтлін дружині в передпокої, - я вирушаю, можливо, надовго. На кілька днів, тижнів - не знаю. Обіцяю скоро повернутися». Він широко всміхнувся. Пєтлін пишався нею: самостійна дисидентка, сильна й діяльна жінка, що вирвалася з пазурів божевільного Родзаєвского. Він здригався, уявляючи, що навіжений Вождь із нею робив, але вона майже не розповідала про Харбін.\n\n«До зустрічі, любий», - сказала Лідія, поправляючи чоловікові краватку. «Куди ти знову їдеш? Я так довго на Маґадані, що майже не знаю Росії».\n\n«До Новосибірска. Міста Сонця, як його називають. Я буду далеко, але це необхідно. Скоро й ти покинеш Маґадан, і ми поїдемо на захід. Не можна керувати державою з такого віддаленого місця».\n\n«А мені тут подобалося».\n\n«Знаю. Ми колись повернемося, коли Росія знову стане цілою. Може, навіть перетнемо протоку й побуваємо в Америці. Побачимо Лос-Анджелес, Сан-Франциско! Може, навіть Веґас».\n\nВона всміхнулася, в очах блиснуло захоплення."
 petlin.7.a: "«Обіцяю, люба»."

 petlin.8.t: "Новосибірські збори"
 petlin.8.desc: "Конференція в Новосибірску відбувалася за зачиненими дверима в старих залах міської Президії. Російські й деякі американські іноземні медії стежили за перебігом. Усі депутати РНТП відмовлялися від коментарів. Пєтлін встиг сісти в автомобіль до того, як його наздогнали журналісти, а охоронці відтіснили натовп. Усе, що просочувалося з дискусій, наче свідчило на користь реформізму, хоча подробиць ніхто не знав.\n\nНарешті одного прохолодного ранку Пєтлін вийшов до трибуни, а за ним стала решта РНТП. «Народе Росії та Сибіру, - почав він, збираючись із силами, щоби звернутися до нації. Або її половини. - Я стою перед вами як очільник СНР, її президент за правом зброї». Він замовк. «Але віднині це не так. Я проголошую: політичні партії дозволено, а уряд шукатиме схвалення народу. Ми присвячуємо себе відновленню демократичної та республіканської Росії». Усі погляди були прикуті до нього. «Це все».\n\nКоли він обернувся до партії, вибухнули овації. Посеред холодної Сибіру забило маленьке джерело тепла. Журналісти цього не помітили, та Пєтлін усміхнувся їхньому захвату."
 petlin.8.a: "Сибірська відлига почалася."

 petlin.9.t: "Сибірська конституція"
 petlin.9.desc: "Після заяви наприкінці Новосибірських зборів Пєтлін скликав незалежних, трудовиків і власне крило партії, щоби обговорити нову конституцію на заміну старому біллю про права. Він додав ґарантії свободи слова, зібрань і політичного об'єднання. Трудовики бурчали й нарікали, та більше не мали одноосібної влади в партії. Незалежні спершу остерігалися Пєтліна, але швидко потеплішали до нього. Після років диктатури нарешті з'явився керівник, готовий їх почути.\n\nСтоячи в залах Новосибірських зборів, Пєтлін згадав, як роками раніше подавав Вождю Матковскому свій білль про права. «Надто ліберально. Підозрюю, що ви соціяліст, Пєтліне». Він засміявся. Як він міг бути таким слабким? Якби той самий Вождь з'явився перед ним у всій славі, Пєтлін не скорився б. Народи Росії мають права, і він їх не відбиратиме. Він поклявся, що ніхто більше не переживе того, що сталося в Харбіні.\n\nДо нього підійшло кілька сибірських депутатів із серпами й молотами на піджаках. Пєтлін насторожився, та вони запросили його на вечерю. Він усміхнувся. Можливо, комуністи зрештою не такі погані, як кажуть."
 petlin.9.a: "Народжується нова демократія."

 petlin.10.t: "Ворог, наставник, протеже, президент"
 petlin.10.desc: "«Ти приходиш лише позловтішатися, Пєтліне?» Матковскій кинув отруйний погляд. «Коли я помираю, ти приходиш до мене. Міністр закордонних справ, заступник, протеже, а понад усе - зрадник наших ідеалів. Зрадник Харбіна!» Він підвівся з ліжка, але одразу впав назад. Коли Пєтлін хотів допомогти, той виставив руку. «Мені не потрібна допомога зрадника». Він закашляв кров'ю. «Я близький до смерти й бачу, як моє бачення Росії палає в мене на очах. Палій стоїть переді мною, а я безсилий».\n\n«Матковскій...» Ім'я дивно звучало з уст Пєтліна. «Невже вірний пам'яті Харбіна дозволив би спрямувати тиск, що колись чинили на нас, проти власного народу? Якщо порядна людина бачить Дальстрой і не засуджує його, чи вірна вона пам'яті про харбінську працю, коли жінки від розпачу продавали себе на вулицях? Скажіть мені, - він затамував подих, - Вождю всіх росіян».\n\n«Ти не маєш права так мене називати! Нікчемний хробак, найнижчий із низьких. Сказати, що я тебе зневажаю, - не сказати нічого, Пєтліне».\n\n«Взаємно, Матковскій». Вони дивилися один на одного, надто розлючені, щоби продовжити. «Довірте мені Росію. Я добре про неї подбаю».\n\nВ очах Матковского спалахнуло співчуття. «Можливо. Пєтліне, якщо ти зазнаєш невдачі, я мучитиму тебе в пеклі. Пам'ятай. А тепер залиш мене, пане президенте»."
 petlin.10.a: "Наставника й протеже примирило спільне бажання."

 petlin.11.t: "Знову вдома"
 petlin.11.desc: "Під різким вітром Віталій повільно, але впевнено йшов до дверей, тремтячи й обхопивши себе руками. Він тут. Справді знову тут. Після всього часу, змарнованого в Дальстрої, усіх молитов про якнайшвидшу смерть. Нарешті він повертався до єдиного місця, що досі мало значення.\n\nДодому.\n\nДивно, наскільки незнайомим стало це слово. Так довго він не смів говорити про дім і лише зрідка дозволяв собі подумати, наче надмірна прив'язаність могла приректи їх на ту саму долю. Їх. Його родину. Боже, родину. Що змінилося? Чи впізнають його? Чи взагалі пам'ятають?\n\nРаз, два, три удари у двері - й рука опустилася в тривожному чеканні. Навіть «іди геть» було б досить: він лише хотів знати, що вони живі. Нарешті, по короткій вічності, двері відчинилися. «Добридень, чим можу...» Жінка охнула й широко розплющила очі, наче побачила привида. Можна й так сказати. Як він скучив за дружиною! Чи Софія досі кохає його так, як він її?\n\nЗа нею підійшли двоє підлітків, не розуміючи метушні: син Валєнтін і донька Анна. Він зустрівся поглядом зі старшим Валєнтіном. Обличчя хлопця моторошно віддзеркалювало його власне: молодість проти старости, цікавість проти обережности, безстрашність проти страху. Чи був він колись таким? Яким було «колись»? Він не пам'ятав.\n\nТож усміхнувся й сказав єдине, що міг."
 petlin.11.a: "«Я вдома»."

 petlin.12.t: "Дорога додому"
 petlin.12.desc: "Краєвид за вікном був прекрасний. Рідкі клапті снігу поступилися молодій зелені ранньої весни, бджоли гули біля шибок, а їхня пісня губилася в брязкоті й гуркоті двигуна. Пєтлін ледь не заснув, хоча до дому було недалеко. Там чекала Лідія. Нарешті, вперше за багато років, вони матимуть спокій. Свободу від тиранів, фальшивих месій і ворогів - тишу після років крику й хаосу.\n\nЛюди махали автомобілю. Дехто плював услід. Вечір клав довгі тіні на паркани й копиці сіна, останні сліди холоду танули під сонним поглядом призахідного сонця. Пєтлін відкинувся на подушки сидіння й поглянув на годинник. Ще кілька хвилин до дому. Він заплющив очі й віддався сну. Автомобіль смикався й трусився, та після робочого дня кращого ліжка не було. Пєтлін усміхнувся думці про вечір: друзі, товариші й дружина біля вогнища, де тепло обіцяє змити холод, що їх поглинув."
 petlin.12.a: "За цей вечір і багато наступних."

 petlin.13.t: "Сибірський спорт"
 petlin.13.desc: "«...погляньте ще й на красноярську хокейну команду, - сказав міністр закордонних справ Юрій Власов американському підприємцеві в маґаданському готелі, показуючи Красноярск на мапі Сибіру. - Так, вони дуже далеко, але міцні й витривалі. За належного вишколу стануть чудовими спортсменами».\n\nПідприємець Джейсон Моррісон дивився на мапу.\n\n«Ви певні, що воно того варте?» - запитав він після довгої паузи.\n\n«Звісно! З американськими грішми команда матиме тренерів і спорядження, потрібні для міжнародної слави! Старостіне, я нічого не забув?» - відповів Власов.\n\nМоррісон поглянув на Старостіна.\n\n«Красноярск переживає тяжкі часи, і спортивна команда теж, - сказав міністр економіки. - Якщо ви вкладетеся навіть у таку ефемерну річ, як спорт, це неабияк допоможе місту знову стати одним із найбільших промислових центрів Сибіру».\n\nЗнову запала пауза: Моррісон обмірковував цінність міста й команди.\n\n«Почнемо зі ста тисяч на місяць. Якщо за три місяці команда покаже поступ, збільшу до двохсот».\n\nУсі схвально загомоніли, а два міністри разом вийшли. Новій сибірській державі було важливо здобути якомога більше могутніх союзників. Спорт може здаватися дрібницею, але готовність підприємців вкладати навіть сюди свідчила: найближчими місяцями зв'язки зі США значно поглибляться."
 petlin.13.a: "А можливо, такі зв'язки підуть на користь і громадянам."

 petlin.14.t: "Старий адмірал"
 petlin.14.desc: "Рано-вранці Іван Стєпановіч Юмашев ішов вулицями Пєтропавловска й спостерігав за людьми. Чоловіки й жінки прямували на фабрики та до крамниць, батьки з дітьми поспішали по харчі, дехто просто сидів на лавках і дивився, як минає день. Побачивши молодого солдата, що відвів налякану дитину до батьків, колишній адмірал усміхнувся.\n\nЧас від часу до нього підходив колишній моряк Тихоокеанського флоту, і вони говорили про життя після темних камчатських днів. Молодші хвалилися вагітними дружинами й новонародженими дітьми, старші - онуками та порівняно легким теперішнім життям. Адмірал завжди знаходив час вислухати їхні біди й перемоги. Коли його людям була потрібна допомога, він робив усе можливе; коли лише співчутливе вухо - охоче слухав.\n\nЗрештою Іван дістався звичного місця: маленької лавки в тіні старої сосни з видом на Тихий океан. Сівши, він згадав давні часи після Великої Вітчизняної війни, коли в Пєтропавловску повільно, але впевнено збирався Тихоокеанський флот. Згадав, як флот - колись гордість Союзу на Сході - мусив полювати на торгові шляхи, щоби вижити.\n\nВін думав про падіння Божественного Мандату перед фашистами Національної Республіки - тієї самої, де тепер жив. Для флоту то були дивні часи: невдовзі фашистів скинув ізсередини нинішній президент. Тепер, дивлячись на океан, він думав, як їм пощастило. Пєтлін із прибічниками усунули Вождя та відновили права народу, відвернувши катастрофу. Походження держави було дивним, але вона виявилася гідною - місцем, яке він по-справжньому вважав домом."
 petlin.14.a: "Дім для загублених."

 #Matkovsky
 matkovsky.1.t: "Новий зимовий світанок"
 matkovsky.1.desc: "Матковскій уже бував тут, у туманні дні, коли Маґадан був усією його територією. Кабінет став чистішим, горілка - дорожчою, а канцелярське приладдя - надійнішим і зручнішим. Та старе харбінське відчуття не полишало. За вікном сніжні пелюстки розкривалися й розпадалися в повітрі, а виття зимового вітру гасло об шибки. Деякі сніжинки прилипали, але сповзали, лишаючи прозорі сліди.\n\nВін повернувся до списку. Аркуші й аркуші імен, закреслених у порядку страти. Нагорі - ворог Ніколай Пєтлін. Ім'я перекреслено, хоча насправді Матковскій не знав, куди той подівся. Краще, однак, уважати цю відсутність постійною. Ніколай Пєтлін мертвий - лише це мало значення.\n\nПомічники входили й виходили, приносячи холод, тремтячи й передаючи Вождю звіти про чистку. «Гей, - сказав Матковскій довготелесому білявому помічникові. - Увімкни грамофон». Гуркіт музики та виття вітру заглушили постріли в сибірській глушині."
 matkovsky.1.a: "Праця Вождя не припиняється ніколи."
 
 matkovsky.2.t: "Оновлений Сибірський білль"
 matkovsky.2.desc: "Колись Вождь росіян доручив вірному послідовникові написати для нього конституцію. Тим міністром був Ніколай Пєтлін - зрадник, винуватець отруйної течії лібералізму в партії Вождя. Його отрута роз'їдала владу Матковского, сичачи на сталі. Вождь був милосердною і поблажливою людиною, та більше ніколи не міг допустити такого - тим паче так близько до вершини.\n\nОтже, треба бути суворим. Він уже довірив росіянам політичні свободи й свободу слова, а вони його зрадили. Цієї ночі, на самоті в освітленій свічкою кімнаті, Матковскій укладе новий Сибірський білль про права - без вад старого. Він мусив. Якщо народ і партійні дисиденти кидають йому виклик, лишається тільки самозахист.\n\nПочати слід зі скорочення. Старий білль був задовгим, багатослівним і важким. Надто багато місця витрачено на непотрібні свободи, що могли загрожувати партії. Матковскій викреслював статтю за статтею.\n\nКоли ранкове світло пролилося на стіл, він підвівся з новим біллем у руці. Вождь усміхнувся: роботу завершено."
 matkovsky.2.a: "Ця помилка не повториться ніколи."
 
 matkovsky.3.t: "Списки виборців"
 matkovsky.3.desc: "Коли в селі оприлюднили нові списки виборців, Айсен зрадів. Можливо, Вождь росіян буде вождем не лише росіян. Та свого імені, як і імен інших місцевих саха, на дошці він не знайшов. Айсен знову й знову переглядав розділ на «А», певний, що сталася помилка. Він був порожній, наче чиновники просто пропустили його.\n\nТож Айсен прийшов скаржитися до виборчої комісії. Він законний громадянин і не дозволить порушувати свої права. У дерев'яній будівлі за тонкою дошкою замість стола сидів кремезний чоловік. У протилежних кутках стояли двоє охоронців із рушницями й пістолетами. Позаду двері вели вглиб контори. «Пане, вибачте, що заважаю, але мого імені немає у списку», - сказав Айсен.\n\nЧоловік усміхнувся. «Ти якут?» Айсен кивнув. «От воно що». Він гаркнув щось російською охоронцеві, і той приніс бланк на п'ять чи шість аркушів. «Заповни й склади іспит. Я вирішу, чи можеш ти голосувати».\n\nАйсен знав російську, але не таку: наукова номенклатура, технічні терміни, безліч незрозумілих речей. Це тест на грамотність, збагнув він. Спосіб ошукати народ саха й позбавити права голосу. Та він вклав у відповіді всі свої знання й віддав бланк.\n\nУдаване розчарування. «Вибач, але не можеш. Може, трохи повчишся - тоді дозволимо. А поки не бачу нічого доброго від твого голосу». Усмішка. «Без образ». Айсен пішов розлючений і принижений."
 matkovsky.3.a: "Партії потрібні компетентні виборці."
 
 matkovsky.4.t: "Звіт про становище"
 matkovsky.4.desc: "На стіл Матковского кинули звіт ДРУ; з нього висипалися аркуші й теки з друкованими доповідями та графіками. На обкладинці стояло: «СТАНОВИЩЕ НА ЗАХОДІ» - зібрані розвіддані давали повний огляд воєначальників і бандитських республік, що билися в Центральному Сибіру. Вождь довго й скептично дивився на папери, а тоді заходився гортати сторінки.\n\nВін вивчав подробиці про кожного большевицького розбійника й деспота-пристосуванця в крижаному краї. Мов звірі, вони билися за крихти їжі та ресурсів на замерзлих рівнинах заходу. Нарешті Вождь дійшов до сторінки зі стратегічними й логістичними планами можливого приєднання та інтеграції краю - і його очі засяяли.\n\nПіджививши авторитарне самолюбство, Матковскій усміхнувся й кинув документ на дерев'яний стіл. Відкинувшись у кріслі, він обмірковував пропозицію й насолоджувався задумами походу на захід."
 matkovsky.4.a: "Це лише початок."
 
 matkovsky.5.t: "В інтересах національної безпеки"
 matkovsky.5.desc: "Установивши контроль над значною частиною Східного Сибіру, Вождь знову звернув увагу на державну безпеку. Адже стабільну республіку, пояснює він, треба захищати зсередини й ззовні. Тому ДРУ отримає значно більшу свободу від правових обмежень і повноваження проводити операції для захисту нації від підривників та революціонерів.\n\nДвері вибивають, будинки обшукують, сотні людей арештовують, зрадників розстрілюють. У питаннях національної безпеки права на помилку немає. Вождь не дозволить цій молодій республіці, цій великій надії Росії, впасти від заколотницького лиходійства з темних кутків східної пустки. Сибірська глушина невблаганна, і за зраду Матковскій також не знає жалю."
 matkovsky.5.a: "Ми не ризикуватимемо."
 
 matkovsky.6.t: "Чесні вибори"
 matkovsky.6.desc: "У бюлетені округу Томск-12 було три імені. Двоє - кандидати РНТП з усією доступною партійною підтримкою: ефіром місцевого радіо, коштами на кампанію й плакатами мало не в кожному томському вікні. Закон про збереження миру встановив суворі ідеологічні вимоги до партій, фактично не допустивши до виборів жоден із томських салонів.\n\nТретім був незалежний кандидат, колишній бастіляр. Він ішов на вибори, добре знаючи про нерівні умови. Старі салони не могли допомогти; радіо й газети відмовляли в інтерв'ю. Давні друзі-бастіляри потай передали трохи грошей, але й це було небезпечно: якби влада дізналася, його звинуватили б у шахрайстві та усунули. Тож він робив те саме, що за бастілярських часів: стояв на розі й намагався образити людей настільки, щоби вони звернули увагу. Інколи вдавалося поговорити; інколи поліція забирала його як «громадського шкідника».\n\nКоли голоси підрахували, результат не здивував: дев'яносто п'ять відсотків дісталися кандидатам РНТП, решта - незалежному."
 matkovsky.6.a: "Без політичної справи не буде й політичного спротиву."
 
 matkovsky.7.t: "Добровільна праця"
 matkovsky.7.desc: "Після праймериз Альоша тинявся Амуром, перебиваючись випадковими роботами. Він витратив статок, щоби вступити до РНТП, та програв відбір. Альоша був лібералом і прагнув реформувати партію зсередини. Тепер без грошей і перспектив дні минали водночас надто повільно й надто швидко, мов свічки, що догоряють.\n\nДРУ швидко його знайшло. Альоша не вмів бути непомітним, і його поведінка привернула увагу. Щойно він зайшов до бару залити горе, його торкнулися за плече двоє - високий худорлявий і низький кремезний. «Пане Альошо? Будь ласка, пройдіть із нами. Ми від партії, треба поговорити».\n\nСпершу він зрадів: може, Вождь розгледів політичний талант і послав їх дати другий шанс. Та фантазії впали під вагою реальности, коли Альоша зрозумів: це, найпевніше, люди ДРУ.\n\nУ тихому провулку вони допитали його про відданість російському народові, а потім запропонували «добровільно» піти до Дальстрою. Він зблід, але вибору майже не мав. «Так, - сказав він. - Так»."
 matkovsky.7.a: "Якщо не можеш служити на політичній арені, можливо, послужиш робітником."
 
 matkovsky.8.t: "Поступки Вождя"
 matkovsky.8.desc: "Сьогодні вранці Міхаїл Матковскій, Вождь СНР, телефоном твердо запевнив нас, що останнім часом значно поліпшив зусилля зі зміцнення своєї вільної республіки. Раніше ми наполягали: якщо вони хочуть чогось від Сполучених Штатів, то й самі мають засвідчити відданість правам людини. Вони належно скоригували курс і взяли на себе зобов'язання.\n\nМатковскій навів докази поліпшення ставлення російської влади до меншин. Нас також запевнили, що держава й правоохоронці по всій країні поважають законні свободи. Наші нечисленні дипломати за Тихим океаном теж дали схвальний знак після подорожі Сибіром у супроводі десятків державних посадовців, які показали величезний потенціял краю й не дали жодної підказки про щось варте критики.\n\nНа наші запитання Матковскій відповідав повільно, але ми віримо, що він дотримає обіцянок. А доти продовжимо дипломатичні місії, щоби більше дізнатися про загадкову східну республіку, яка тепер до нас горнеться."
 matkovsky.8.a: "Пусті слова? Мабуть, американський вислів."
 
 matkovsky.9.t: "Рейнджери ведуть за собою"
 matkovsky.9.desc: "«СТІЙ!»\n\nЛави сибірських рейнджерів зупинилися, і табором прокотився гуркіт синхронного тупоту чобіт. Вони стояли рівними колонами й чекали наступного наказу капітана Олєґа. Новобранці проходили виснажливий вишкіл у сибірській глушині, звикаючи до лютого східного холоду. Підготовка була суворою, офіцери - ще суворішими, та лише такий порядок міг викувати воїнів, гідних служити Вождю.\n\nПопри мороз, вони непорушно стояли, поки капітан Олєґ оглядав кожного. Він дивився чоловікам у вічі й оцінював поставу. Пронизливий і страхітливий погляд сам по собі приборкував будь-яку нелояльність у молодих серцях. Дійшовши до кінця колони, капітан підняв руку, й новобранці водночас узяли рушниці до боку. Стоячи до них спиною, Олєґ почув дружний брязкіт і згадав власні перші дні у війську. Озирнувшись, він побачив, що вони набагато вправніші, ніж він тоді. На мить усміхнувся під пишними вусами й тихо засміявся, а потім знову став холодним і невблаганним."
 matkovsky.9.a: "Жити й померти в снігах."
 
 matkovsky.10.t: "Похмурі звістки"
 matkovsky.10.desc: "Матковскій сидів у кабінеті й пив вино. Нарешті, після стількох років, урожай гідний своєї слави: теплий, солодкий, він приємно п'янив. У кутку гримів харбінський грамофон: ностальгійні пісні, патріотичні марші, гімни, Чайковскій. Солодкі мелодії юности повертали спогади про хлопчину в Східному Парижі. Нарешті всі страждання й біль були недаремні.\n\nСтук у двері порушив ритм. Увійшов лікар, укритий холодним потом. Окуляри тремтіли, він уникав погляду Матковского. «П-пане, - пробелькотів він, клацаючи зубами від страху, - у мене погані новини».\n\nВідкинувшись у пишному кріслі, Матковскій мовив: «Які ще погані новини, лікарю? Не бачиш, Вождь відпочиває? Це не може зачекати? Невже наважишся накликати мій гнів?»\n\n«Н-ні, пане. Не може». Він ковтнув. «Боюся, у вас рак».\n\nМатковскій завмер. Не міг повірити почутому. Рак? У нього? На вершині життя, саме тепер? Брехня! Він спокійно підвівся з келихом у руці й різко жбурнув його в лікаря, забризкавши костюм червоним. Хотілося кричати, але треба зберігати спокій.\n\n«Охорона! Заберіть його!» До кімнати вбігли солдати. «Відправте добровольцем до Дальстрою. Простежте, щоби його належно перевиховали. Зрозуміло?» Кивки. «Вільні». Лікаря винесли, і за ними тягнулося ридання."
 matkovsky.10.a: "Із Вождем усе гаразд. Абсолютно все."

 matkovsky.11.t: "Зимова соната"
 matkovsky.11.desc: "Матковскій дивився на папери перед собою. Тримаючись за бік, він стогнав від кожного руху. Лікар не брехав: у животі пульсував рак, приплив болю, який майже не брали знеболювальні. Нові лікарі радили поїхати до Америки. Хемотерапія, променева терапія - чи яка там нині маячня - могли допомогти. Але не зараз. Вождь росіян має правити з російської землі, а не передавати справи підлеглим, поки розважається з чужинцями на далеких берегах.\n\nВін повернув голову до вікна біля ліжка. Сніг укривав крижане повітря білим плащем. Крупинки кружляли за волею вітру, що порожнім хрипом терся об стіни палацу. Матковскій заплющив очі й слухав. Далеко внизу на кухні голоси служниць у цікавих плітках зливалися в нерозбірливий шепіт, уряди-годи пронизаний верескливим сміхом. Угорі рипіли дошки горища, куди переносили старі речі Матковского: грамофон, пам'ятні дрібнички й стос платівок із російськими маршами, бездоганно збережених.\n\nВін сів. Біль був нестерпний, зуби стиснулися. Спустивши ноги, він приготувався встати. Однією рукою вчепився в бильце й піднявся, долаючи хвилю болю, що виникала наче нізвідки. Та не закричав. Вождь стояв посеред розкішної спальні, коліна підкошувалися під тягарем мук. Матковскій глибоко вдихнув і рушив. Треба випити."
 matkovsky.11.a: "Усе починається знову."

