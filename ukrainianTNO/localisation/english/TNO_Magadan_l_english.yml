 #Mercenary Contract events
 westalaska.100.t: "Держава [MAG.GetName] пропонує найманський контракт"
 westalaska.100.desc: "Наша війна триває, і для перемоги над ворогом потрібна кожна перевага. На щастя, одна така нагода щойно з'явилася.\n\nПредставник держави [MAG.GetName] зробив пропозицію: за певну ціну вони надішлють «приватних оборонних консультантів», які навчатимуть війська або битимуться поруч із ними на передовій. За словами представника, ці найманці чудово володіють воєнним мистецтвом і мають великий досвід із гарячих точок цілого світу.\n\nВони недешеві, та, можливо, саме таких солдатів удачі потребує наша війна?"
 westalaska.100.a: "Передайте, що ми погоджуємося."
 westalaska.100.b: "Ні, їм не можна довіряти."
 
 westalaska.101.t: "Найманський контракт прийнято"
 westalaska.101.desc: "Схоже, нашу щедру пропозицію надіслати найманців державі [FROM.GetName] прийнято. Група «оборонних консультантів» уже прямує туди, щоб надати особливі послуги.\n\nДехто сахається найманої допомоги у війні, але добре, що є люди, готові викласти додаткові гроші й залишити криваву справу професіоналам..."
 westalaska.101.a: "Вони не розчаруються."
 
 westalaska.102.t: "Найманський контракт відхилено"
 westalaska.102.desc: "Із держави [FROM.GetName] надійшли прикрі новини. Вони не хочуть нашої допомоги й прямо відхилили турботливу пропозицію найманського контракту. Це розчаровує, але, може, спробуємо знову, коли вони впадуть у відчай?"
 westalaska.102.a: "Шкода."
 
 ### West Alaska Superregional Events ###
 wa_superregional.1.t: "Король-чарівник Сибіру"
 wa_superregional.1.desc: "Мітчелл Вербелл III оглядав сибірські простори, затиснувши зубами сигару. Чарівник шепітної смерти кутався від далекосхідного холоду у важке хутро, та мороз однаково щипав щоки. Йому було байдуже: нині його день. Центральний Сибір нарешті належав йому, а місцеві невдахи, фанатики й головорізи лежали в могилах. Чорт забирай, чудовий день бути Мітчеллом Вербеллом III.\n\nУнизу, під балконом колишнього царського палацу, мерехтіли вогні Чіти, а вгорі сяяли яскраві сибірські зорі. Вербелла завжди дивувало, які яскраві зорі на Пограниччі.\n\nВін тихо засміявся. Це таки Пограниччя, а Вербелл - ковбой-першопроходець з американськими гарматами й забавками, готовий лишити слід на цій дикій землі. Так він його й назве: своє Пограниччя, свої Сполучені Штати Сибіру.\n\nВажко було повірити, що привело його сюди: дзвінок Вонсяцкого, переворот, наступні війни. Все могло миттю обернутися й каменем потягти Вербелла на дно, але Леді Удача весь час була на його боці.\n\nЧарівник шепітної смерти випустив хмару диму в нічне небо. Смакуючи перемогу, він уже відчував у тютюновій імлі смак майбутніх звитяг."
 wa_superregional.1.a: "Народилося диво історії."
 
 wa_superregional.2.t: "Армія недобитків"
 wa_superregional.2.desc: "Жалюгідне товариство, знав Васілій, але це все, що мала Росія проти американського Чудовиська зі Сходу. Томські солдати, анархісти, силовики, прихильники Рюріка, заколотники й рештки Червоної армії. Спершу їх було щонайбільше двісті, та сутички з найманцями скоротили число до сорока. Останні воїни Центрального Сибіру тулилися до краю лісу й стежили, як ним їде колона так званих Сполучених Штатів Сибіру. Найманці переважали числом, але швидкий удар міг дати потрібні припаси й ще один день опору.\n\nСиловичка Людміла дивилася крізь приціл, чекаючи Васілієвого сигналу. Анархіст Пьотр підняв гранатомет. Нарешті Васілій махнув уперед. Гвинтівка Людміли тріснула, гранатомет Пьотра заревів, ще десяток стволів ударив по колоні. Ракета врізалася у вантажівку, полум'я перевернуло її набік. Куля рознесла мозок водієві першої машини, і вона влетіла в дерево. Скрізь панували смерть і хаос: найманці кричали й цілились, партизани кинулися хапати спорядження.\n\nВасілій перестрибнув мертвого найманця й побіг до кузова підбитої вантажівки. Зірвав брезент і тихо зрадів, побачивши такі потрібні медичні ящики. Раптом у ребра гупнуло. Його вдарили? Васілій обернувся, не розуміючи, чому все пливе. Чорношкірий у темних окулярах із модною американською гвинтівкою вистрілив удруге й підкосив йому коліна. Згасаючим поглядом Васілій бачив, як падали товариші. Останній напад був марний."
 wa_superregional.2.a: "На сорок бандитів менше."
 
 wa_superregional.3.t: "Завжди знайдеться хтось з ідеями"
 wa_superregional.3.desc: "Катя повернулася після роботи в селі. Як же добре знову бути в Маґадані, місті світла й життя, де мешкали всі значні люди, зокрема велика риба для її нової служби. Виїжджала вона агенткою з куратором, а повернулася директоркою Відділу внутрішніх змов у Відділі стратегічних служб. Це звучало добре, звучало... офіційно. У фургоні сиділи новачок на першому завданні й інструктор ЦРУ, що вдавав звичайного американського найманця. Навпроти зібралися студенти, яких підбурював фанатик, а в сусідній будівлі чекали зо двадцять агентів. Катя не довіряла підбурювачеві.\n\n«Сказали щось важливе?» - спитала вона новачка. Той похитав головою. Катя зітхнула: «Схоже, це не працює». Трохи почекала й додала: «Гаразд. Заходимо».\n\nПан ЦРУ ахнув і рубаною російською заперечив: «Ви не можете так робити. Докази!» Катя всміхнулася й звела курок M1911: «Наші Штати - не ваші Штати, ковбою». Новачок пересмикнув затвор трофейної німецької гвинтівки, і троє увірвалися на збори. Юні агітатори прагнули повернути соціалізм, у кутку висів портрет Сабліна, від якого Катю мало не знудило. Невже іншого кумира не знайшли? Ленін хоча б мав гарну бороду. Її чуття не підвело: ватажок зберігав крадену армійську зброю. Вона врятувала цих дурних дітей від смерти.\n\n«Що з ними зробите?» - спитав пан ЦРУ, коли всіх зв'язали. «Ватажкові, мабуть, десять років за крадіжку, - відповіла Катя. - Решту присоромимо, залякаємо й розділимо. Може, поставимо жучки на домашні телефони». Вона пішла до улюбленого бару. Роботу ж закінчено раніше? Час відпочити."
 wa_superregional.3.a: "Чорт, як добре бути офіційною особою."
 
 wa_superregional.4.t: "Люблю зрадників"
 wa_superregional.4.desc: "Анатолій очікував американця чи росіянина, але не африканця заввишки 193 сантиметри, що тепер ходив за ним усюди. Начебто з Конґо, найманець, який утік під час тамтешньої війни. Анатолій не був певен ані в історії, ані в дивному російському акценті чоловіка. Та це не важило: відтепер він був його довічним охоронцем. Анатолій обіймав високу посаду в Новосибірску й, на відміну від усіх колег такого рангу, погодився служити маґаданському божевільному. Друзів це йому не додало: кожен колега вже привітав тимчасового губернатора штату Новосибірск погрозою смерти, пришпиленою ножем до дверей - для переконливости. Розради серед найманців він не знайшов; лише конґолезець був пристойним товаришем по чарці, здебільшого бо мовчав. Решта - галаслива іноземна наволоч, що поважала лише власні кишені!\n\nТа й робота була не надто важлива. Він затверджував накази ремонтувати залізниці, відбудовувати фабрики й переобладнувати старе військове майно для... Яка ж безглузда клята назва! Сполучені Штати Сибіру? Він продав душу не дияволові, а дурневі. Утім, посада давала престиж, чималі гроші та вплив на сенаторів інших штатів, яким він допомагав змащувати бюрократичні колеса. А якщо це ще й допомагало новосибірцям - то краще, чи не так?\n\nПоки він міркував, кілька куль відскочили від вікна. Конґолезець повалив його на підлогу, інші відкрили вогонь. За кілька секунд усе скінчилося без утрат з обох боків. Анатолій сів у крісло, глибоко вдихнув і..."
 wa_superregional.4.a: "...розсміявся так, що зрештою заревів."
 
 wa_superregional.5.t: "Довге резюме"
 wa_superregional.5.desc: "«Я переглянув ваш послужний список, пане Тарасов», - сказав міністр оборони СШС, проходячи повз стіл, за яким сидів Іван. Мерехтливе світло вихоплювало їхні обличчя й сірі бетонні стіни. Івана приволокли сюди годину тому, як він гадав, на допит. Лише це пояснювало, чому його, новосибірського генерала, ще не вбили. Він ніколи не чекав, що допит стане співбесідою.\n\n«Перемога під Кемеровом. Успішна партизанська кампанія на півночі Томська. Запеклий останній бій у руїнах Алтаю. Ще мільйон перемог і гірких, тяжко виборених поразок. Вражає. Ваші хлопці поклали чимало наших», - продовжив міністр.\n\n«І що? Це була моя робота», - відповів Іван, здивований уїдливим додатком.\n\n«Пане Тарасов, ви плутаєте комплімент зі звинуваченням. Нам потрібні такі командири. Наші війська дієві й вправні, як ви бачили, але некеровані. Їм потрібна тверда рука».\n\n«Розумію. Тому я ще живий?»\n\n«Тепер ви збагнули, Тарасов. То що обираєте? Ще десять років тут...» З дірявої стелі на стіл упала крапля. «Або фронт і командування чесними російськими чоловіками... та кількома не такими чесними чужинцями».\n\nІван стиснув зуби й прошипів: «Гаразд»."
 wa_superregional.5.a: "«Чудово. Ласкаво просимо до армії»."
 
 wa_superregional.6.t: "Бувайте й дякуємо за всі гроші"
 wa_superregional.6.desc: "Охайно вдягнених американців колоною виводили просто з Маґадану. Містянам уже остогид образ випещених і ситих іноземних капіталістів. Те, що конвоїри теж були американцями, не важило: вважалося тактовним доручити цей «важкий перехідний період» їхнім землякам.\n\nОдин чоловік зупинився перед капітаном. «Ви не можете цього зробити!» - крикнув він і тицьнув пальцем у камуфляжну куртку. «Ми поставили все на підтримку цього... цього... я навіть не знаю, чи можна це назвати країною!»\n\nКапітан спокійно пропустив скарги повз вуха. Від вуха до вуха застигла не дружня, а моторошна посмішка; зуби скреготіли, на чолі набухла жила. Коли рука потяглася до пістолета, балакучий управлінець замовк.\n\n«Маємо тут брак порозуміння. Ваші вкладення щедро винагороджено, але ви нам більше не потрібні. Громадянство скасовано, робочі візи відкликано, ви виїжджаєте негайно. І не думайте, що компанії, які лишаються, пожертвують собою заради вас. Вони потрібні. Ви - ні. Бувайте». Капітан махнув групі рушати. Він був загартованим найманцем, вони - розпещеними промисловцями. Вони послухалися й назавжди без пригод покинули Сполучені Штати Сибіру."
 wa_superregional.6.a: "«Вам потрібен Вербелл, Америко. А Вербеллові ви більше не потрібні»."
 
 wa_superregional.7.t: "Тубільні легіони"
 wa_superregional.7.desc: "Наймане ядро сибірської армії належало до найдосвідченіших сил світу, але цього не скажеш про місцевих, що складали більшість населення. Саме їх доведеться набрати для великої війни проти Західної Росії. Вербелла раз у раз застерігали не сподіватися багато, тож, дивлячись на парад нової партії новобранців, він готувався до найгіршого.\n\nВін стежив за кожним рухом, кожним збитим кроком і найменшою хибою. Після стількох воєн із різними арміями Вербелл навчився швидко визначати боєздатність підрозділу. Він підрахував помилки й порівняв з очікуваннями, тоді повернувся до генерала праворуч.\n\n«Знаєш, а вони не такі вже й погані!»\n\nГенерал видимо полегшено зітхнув: «І не тому, що ми мало старалися, Мітче. Присягаюся, часом вони навмисне забували, з якої ноги починати марш».\n\n«Тепер уже знають - це головне. З таким матеріалом можна працювати. Як вони дають раду стрілецькій зброї від дядька Сема?»\n\n«Непогано. Більшість влучає з п'ятисот ярдів у усе, на що покажеш. Тільки не проси влучити в певне місце».\n\nВербелл заспокоївся, але трохи насупився: «Значно краще, ніж я боявся, та одне ясно...»"
 wa_superregional.7.a: "«...Роботи ще вистачає»."
 
 wa_superregional.8.t: "До сорокового меридіана або пропадом"
 wa_superregional.8.desc: "«ДОЛЯ ЧЕКАЄ», - проголошував вербувальний плакат, де стріли врізалися в Західну Росію. Вербеллові було дивно бачити на кожному розі плакат, який нещодавно схвалив на столі, але таке життя. Боже, як далеко вони зайшли? Від найманця на службі фашиста до президента половини колишнього Совєтського Союзу. Хай би що сталося, слід він лишив.\n\nТа цього було мало. Якби прагнув лише пам'яті, давно загинув би під амфетамінами на якомусь полі бою. Він хотів більшого: зброї, випивки й слави! Ех, як часом кликали старі часи... але вже й не цього. Тепер Вербелл вірив у Росію. Хотів би піти - ще 1964-го пішов би з багатством. Він щодня сидів за столом, бо вірив у цей задум, хоч би яким божевільним той був.\n\nВербелл глянув на карти й стріли плану вторгнення до Західної Росії - зовсім не такі, як на плакаті. Спершу армія була гуртом професійних бандитів: нападала, щоб забирати потрібне для життя. Тепер квітнули і вони, і Росія. Маґаданський порт щодня повнішав, морська торгівля вдихала життя в Сибір. Росіяни мали добробут, якого не бачили від 1945-го, і знали це. Вербелл пишався. У цій проклятій землі він вирощував щось прекрасне, знане Росії лише на коротку мить: демократію.\n\nРосія матиме свободи, якими американці користуються від 1776 року, а її народ любитиме волю, мов богобоязливі американці вдома. Нехай західні орди збираються на кордоні, думав Вербелл. На його боці доля й найкрутіша армія світу."
 wa_superregional.8.a: "Хай живуть відчайдушні й сміливі!"
 
 wa_superregional.9.t: "Створити прецедент"
 wa_superregional.9.desc: "«Вибачте, пане Накамура, я більше нічого не міг зробити», - сказав літньому чоловікові новий сенатор штату Камчатка Лев Сємьонов. Пан Накамура представляв кількасот айнів його штату. Він похитав головою й повторив промову, сказану вже сто разів. За царя, японців і комуністів айнів раз у раз переслідували. Багатьох стратили під час примусового навернення. А тепер їм відмовляють у власному штаті?\n\nЛев щиро їм співчував. На початку великого задуму Вербелла він воював поряд із двома айнськими найманцями - добрими, лютими чоловіками з витривалої культури. Як сенатор він мав їм допомогти. Та айнів просто було замало для окремого штату.\n\n«Пане Накамура, я запросив вас не лише тому. Після розмови з самим президентом я певен, що ми забезпечимо вашому народові привілейований статус меншини. Те саме отримують інші сибірські народи. Допомагає й те, що така мала громада дала чимало здібних солдатів. Ви ж розумієте, який вплив мають військові в нашій країні?»\n\nЛев вийшов задоволений, знаючи, що під час творення нових штатів відбуваються десятки таких розмов. Він не знав, куди прийде цей державний експеримент і що принесе чужоземний вплив. Але точно знав: тут, у найбіднішому штаті нової федерації, він створить прецедент. Для Лева, колишнього найманця з Маньчжурії, на обрії була надія. Перед виходом старий повернувся й сказав:"
 wa_superregional.9.a: "«Іяйрайкере, сенаторе»."

 wa_superregional.10.t: "Явне призначення здійснено"
 wa_superregional.10.desc: "Келихи дзвеніли, сміх гримів, корки летіли вгору. Свято майже заглушило його думки, але Вербелл хотів бодай мить поміркувати, що привело його сюди, перш ніж потонути в алкоголі й жінках.\n\nВони зробили це. Вони, чорт забирай, справді зробили це. Уся вільна Росія лежала під крилом орла, світло демократії по-американськи розганяло темряву анархії. Від проголошення об'єднання іноземні вкладення зросли вдесятеро. Кожна пристойна корпорація Вільного світу відкрила заклад на російській землі, принісши половину товарів планети людям, які не бачили сучасного радіо. Попит був невситимий, бізнес удома квітнув.\n\nДо речі про бізнес: Сполучені Штати Росії стали головним світовим експортером найманців, що заради золота й слави змінювали перебіг громадянських воєн. Назвою «Держава найманців» зазвичай намагалися образити й заперечити законність СШР, але Вербелл носив її гордо. Такої нації ще не було й більше не буде.\n\nЗвісно, дехто був невдоволений. Та пішли вони. Жоден найманець не зважав на скиглення ліберальних боягузів удома, і Вербелл не виняток. Протести росіян він сприймав серйозніше, але не дуже боявся. Який же культурний шок: за десять років вони перейшли від стрілянини з мосінок до американських автівок і американської свободи. Звикнуть. Він іще зробить із них техасців.\n\nКоли думка завершилася, його увагу привернуло дещо. Точніше, дві речі - чи не найбільші з усіх бачених. Вербелл досі погано говорив російською, але підморгування варте тисячі слів. Жінка досвідченою ходою наближалася, а старий найманець подумав востаннє:"
 wa_superregional.10.a: "Добре бути королем."

 wa_superregional.11.t: "Західноаляскинські діалоги, сторінка 27"
 wa_superregional.11.desc: "Вербелл тверезо дивився на француза й, слухаючи доповідь, відзначив трохи кращий акцент.\n\n«За оцінкою головного командування, ми ніяк не можемо успішно вести наступальну війну проти ворога з такою чисельною перевагою. В обороні інакше, але вони наполегливо радять вам перегля-»\n\n«Як ми сюди дісталися?» - перебив Вербелл.\n\n«Ну, пане, я...»\n\n«Питання риторичне, не відповідай, синку». Стоїчний вираз змінився широкою заразливою посмішкою. «Ми тут, бо надрали всім дупи, маючи вдвічі менше людей і вдвічі більше відваги. Оце й усе. Ми ніколи не мали вдосталь солдатів, зброї чи, хай йому чорт, навіть народної підтримки, а тепер половина цієї чудової пустки під нашим прапором. Розумієш?»\n\nАд'ютант озвався: «Гадаю, я...»\n\n«Риторичне питання, чорт забирай», - Вербелл засміявся й продовжив. «Наша армія воювала й воює в більшій кількості конфліктів, ніж військо будь-якої наддержави. Від Сибіру до Африки й Близького Сходу наші люди б'ються, стікають кров'ю і вмирають. Інші мають більше промисловости, кращі розробки й нескінченних призовників, зате ми маємо досвід, дисципліну та звичку обома гнати переважного ворога, піджавши хвоста. Сибірська армія - найкраща бойова сила по цей бік Московієна, а коли я закінчу - буде найкращою в клятому світі!»\n\nПісля короткої промови старий найманець перевів подих, опанував себе й знову зосередився на співрозмовникові.\n\n«То що ще потрібно армії?»\n\nАд'ютант розтулив рота й знову стулив, витріщившись на президента, мов олень у світлі фар. Незручну тишу можна було торкнутися."
 wa_superregional.11.a: "«Оце питання не було риторичним, чорт забирай!»"

 wa_superregional.12.t: "Візит дядька Сема"
 wa_superregional.12.desc: "Почувши стукіт у двері кабінету, Вербелл відірвав погляд від паперу. Зі скрипом висунув шухляду й сховав туди грубий малюнок гіпотетичної автоматичної гвинтівки. Вирівняв справжні документи без ескізів зброї, сів рівно, вдягнув диявольську посмішку й запросив гостя.\n\nДвері розчинилися, показавши нового ділового знайомого Вербелла - агента ЦРУ Мейсона. Туфлі простукали дерев'яною підлогою. «Доброго ранку, пане Вербелл».\n\n«А-а-а», - докірливо протягнув Вербелл. Мейсон закотив очі й виправився:\n\n«Пане Вербелл, есквайре».\n\n«Дякую, добродію. Про що говоритимемо?»\n\n«Я хотів би запропонувати дальшу співпрацю між вашою й моєю батьківщинами та, е-е... цим місцем».\n\n«Що саме маєш на увазі, друже?»\n\n«Пам'ятаєте, як погодилися бути нашими очима й вухами в Росії?»\n\n«Одне з найкращих рішень моєї президентської кар'єри, так».\n\n«Пропонуємо піти далі. Більше припасів, більше американської діяльности. Допомога дядька Сема - якщо дасте йому трохи... місця й харчів. Розумієте?»\n\n«Інакше й бути не могло. Сідай, Мейсоне...»"
 wa_superregional.12.a: "«...Обговорімо подробиці»."

 wa_superregional.13.t: "Небезпечні мандри"
 wa_superregional.13.desc: "Однієї холодної маґаданської ночі Роже Фольк ішов вулицею, намагаючись очистити думки. Він здавався б звичайною людиною, якби не був очевидно надзвичайним. Щойно почав розслаблятися, побачив дивно знайоме обличчя. «Гей, ви... ми не знайомі?» - спитав недосконалою англійською.\n\nОбличчя іншого теж засяяло від упізнання. «Фольк? Роже Фольк? Це ви!» Він засміявся й обхопив Фолькову руку обома долонями. «Це я, Тадеуш Ковальський! Ми служили разом у Конґо! Радий бачити вас цілим. Як ви?»\n\n«Як і можна сподіватися після всього», - Фольк ледь усміхнувся його запалові. «А ви? Востаннє я чув, що ви прагнули опинитися якомога далі від Польщі».\n\n«Так, ну...» Ковальський сумно знизав плечима. «Боюся, знайома нам Польща втрачена назавжди. Хай би що з нею сталося, я її вже не впізнаю. Так само у вас із Францією, правда? Ви розумієте».\n\n«Так». Фольк безнадійно зітхнув. «Відколи Гіммлер викроїв свою державу... ні, відколи ми програли світову війну, вона втратила все, що робило її моєю батьківщиною. Схоже, ми обидва солдати, яким нікуди повертатися».\n\n«Тоді зробімо все, щоб Росія стала домом для кожного солдата - із живої чи мертвої країни», - рішуче сказав Ковальський, здивувавши Фолька. Поплескав його по плечу й пішов. «Радий був зустрітися, Фольку. Ще не здавайтеся».\n\nФольк приголомшено дивився йому вслід. «Нова батьківщина для таких, як ми...»"
 wa_superregional.13.a: "У гостях добре, а вдома найкраще."

 #### West Alaska Journalist Chain ###
 MAG_WA_journalist.1.t: "Нове завдання"
 MAG_WA_journalist.1.desc: "За роки у «Вашинґтон пост» Патрік Салліван отримував чимало дивних завдань. Та це було найдивнішим. Редактор щойно поклав перед ним теку, а він ледь вірив прочитаному. «Бобе, ну ти й жартівник, - засміявся він. - Але не варто було так морочитися заради розіграшу».\n\n«Це не розіграш, Пате, - відповів редактор. - Схоже, усе в теці правдиве принаймні наполовину».\n\nПатрік ще раз переглянув її. «Тобто якийсь американський найманець подався до Росії й... перебрав владу в зграї російських фашистів? Бобе, це божевілля. Наче з пригодницького роману. Поганого».\n\nБоб знизав плечима. «Може, так, а може, ні. Інші газети теж зацікавилися, тож треба скористатися нагодою. Ми знайшли спосіб доправити тебе до Маґадану. Вирушаєш на початку наступного тижня».\n\nПатрік затнувся: «Е-е, Бобе, це... Та годі, ти ж знаєш, Мері вагітна. Я не можу надовго поїхати».\n\n«Послухай, Патріку, це не так складно. Повернешся, коли захочеш. Ти один із небагатьох тут знаєш російську, нам потрібен саме ти. Гаразд? Ми подбаємо про Мері до твого повернення». Патрік подумав і кивнув. Боб мав рацію: мало хто з них міг працювати журналістом у Росії. Та й припинити відрядження можна будь-коли."
 MAG_WA_journalist.1.a: "«Що ж, до зустрічі, Бобе»."

 MAG_WA_journalist.2.t: "Ласкаво просимо до Росії"
 MAG_WA_journalist.2.desc: "Від біженців і дипломатів він чув про повоєнну Росію - землю бандитів і голодних селян, де армія воєначальника раділа спорядженню, знайомому ще Червоній армії Бухаріна. Але перед ним було щось інше. Вулиці патрулювали чоловіки із сучасною американською, японською та навіть німецькою зброєю, у чепурній формі й із пристойною дисципліною. Народ досі жив до біса бідно, та навіть нечисленні власники такого чужоземного багатства робили Маґадан винятком.\n\nПатрік Салліван зійшов із причалу й опинився перед високим чоловіком у польовій формі з M14 за плечем. «Я шукаю житло», - ламаною російською звернувся він; варто було освіжити знання ще після коледжу.\n\n«Я американець, бовдуре, - англійською відповів солдат. - Ти точно не росіянин, але й не найманець. То хто ти?» Пат похапцем витяг із пальта посвідчення преси. Солдат вихопив його, прочитав і, сміючись, повернув. «То ти журналюга? Не перший, хто сюди приїхав, але, може, останній, хто виїде. Гей, засранці! - гукнув він солдатам, що грали неподалік у карти. - Допоможіть новому репортеру донести речі до готелю!»\n\n«Поцілуй мене в сраку, Дженсене», - відповів один із шотландським акцентом.\n\n«Сам тебе туди поцілую, якщо негайно, бляха, не підійдеш, Маккензі». Поки солдати невдоволено вставали, він ляснув Патріка по спині. «Ага, затримаєшся тут досить довго - матимеш свою довбану історію»."
 MAG_WA_journalist.2.a: "«Історію всього клятого життя»."

 MAG_WA_journalist.3.t: "Він сам"
 MAG_WA_journalist.3.desc: "«Ми знаємо, як ви сюди потрапили й усунули Матковского. Але мене цікавить, чому ви тут?»\n\nВербелл усміхнувся Саллівану. «Я вже казав: була робота, а мене кинули. Треба було взяти щось у відшкодування, і країна мені цілком підійшла».\n\n«Але ви могли взяти щось інше й повернутися додому», - заперечив Салліван. Погляди охоронців дещо тривожили, та Вербелла запитання радше веселили. Він прицілився зі старого Ґаранда, кілька разів вистрілив і озирнувся. «Ти служив на війні?»\n\n«Так. Побув у Бірмі, а більшість війни провів в Австралії на випадок японського вторгнення».\n\n«Тоді знаєш, як цим користуватися», - мовив Вербелл, простягаючи Ґаранд. Салліван завагався, та вирішив підіграти найманцеві. Взяв рушницю, упіймав обойму від охоронця, зарядив і прицілився.\n\nПісля восьми пострілів пролунав солодкий знайомий дзвін викинутої обойми. Вербелл подав підзорну трубу. П'ять влучень у дев'ятку, два - в десятку, одне - в яблучко. Через двадцять років він досі непогано стріляв.\n\n«Добре стріляєш. Приємно?» - спитав Вербелл.\n\n«Так. Так, - засміявся Салліван. - Було чудово!»\n\n«Ось чому ми тут, - сказав Вербелл. - Кожен із нас певною мірою тут, бо почувається саме так. І чесно? Якщо ти теж це відчуваєш...»"
 MAG_WA_journalist.3.a: "«...готовий закластися, що й ти залишишся»."

 MAG_WA_journalist.4.t: "Адреналін"
 MAG_WA_journalist.4.desc: "Першою турботою Патріка Саллівана було те, що під час написання нотаток для «Пост» у ручці скінчилося чорнило. Другою - гупання мінометів, від якого здригнувся весь пост. Третьою, що прийшла одразу, - крик «Ура!» червоноармійців, які штурмували позицію. Найманці хапали рушниці й ставали до кулеметів, а дисципліна руйнувалася під несподіваністю й люттю атаки. Краєм ока він побачив захоплену ділянку траншеї; троє червоних кинулися до укріплення, де лишилися він і ще один найманець. Охоплений панікою, Патрік схопив перше, чим можна було захиститися, - сокиру.\n\nПершим увійшов старший, але недосвідчений солдат: слід було спочатку кинути гранату. Він устиг відхилитися від смертельного удару, та сокира глибоко застрягла в плечі. Він із криком упав. Другий на фатальну мить завагався, а тоді спробував вистрілити в Саллівана замість удару багнетом. Салліван схопив рушницю в мить пострілу, відвівши кулю, і в боротьбі за Мосіна притиснув солдата до стіни. Пат одразу загнав багнет йому в живіт.\n\nТретій, мабуть, не старший за шістнадцять, не хотів поцілити в товариша й тепер занімів, дивлячись, як той помирає. Він почав піднімати рушницю, коли останній найманець вистрілив, розкидавши мозок і кістки.\n\nПатрік обернувся до першого солдата, який плакав від болю й бачив над собою закривавленого чоловіка. Його очі розширилися. «Нєт! Нєт...» - благав він, але Патрік загнав багнет йому в живіт. Той засмикався й востаннє захрипів. Патрік стояв над тілом, важко дихаючи й відчуваючи адреналін. Мимоволі всміхнувся."
 MAG_WA_journalist.4.a: "Уперше після Бірми він почувався живим."

 MAG_WA_journalist.5.t: "Руїни небес"
 MAG_WA_journalist.5.desc: "«Баром» стала колишня омолонська церква. Найманці зібрали її вбогі реліквії для власних потреб і подавали іншим привезений алкоголь або, коли скрутно, причасне вино. Це чудово втілювало дуже... аґресивний підприємницький дух держави Вербелла. Навіть Салліван, який мав писати статтю, приєднався до галасливих найманців. Матеріял почекає: життя коротке, а випивки багато.\n\nВони пили, сміялися, розповідали історії й починали знову, аж поки «бар» не зачинився, а гурт не зібрався колом - хтось уже знепритомнів, інші були близько.\n\n«Як воно?» - спитала австралійська найманка Елізабет «Ліз» Томпсон.\n\n«Чесно? Чудово, - п'яно відповів він. - Як у Бірмі. Уся ця... простота. Знаєш, що робити й що поставлено на карту... У Штатах такого немає». Він зітхнув і знову ковтнув віскі. «Щиро кажучи, іноді боюся повертатися. Та колись мушу й хочу».\n\n«Ти ж казав, що можеш *гик* повернутися коли захочеш», - втрутився напівпритомний Маккензі.\n\n«Ну, так. Там дружина, донька й...» Більше нічого не спадало на думку. Лише це прив'язувало його до дому? Мері й донька, чиє ім'я він ледве пам'ятав? П'яний, із заснулою на плечі Ліз, він не знав, що відчувати."
 MAG_WA_journalist.5.a: "Він знову випив, відганяючи думку."

 MAG_WA_journalist.6.t: "Люба Мері"
 MAG_WA_journalist.6.desc: "«Люба Мері...» Перші слова самотньо висіли на аркуші, поки Салліван намагався написати дружині хоч щось. Він гарячково шукав слова для заплутаного клубка почуттів.\n\nЩо сказати? «Люба Мері, вибач, що покинув тебе»? Чи шкодував він? Тут, в армії Вербелла, йому було краще, ніж будь-коли. У вирі подій він майже не згадував американську родину, а поза боями - лише трохи частіше. «Люба Мері, вибач, що твій чоловік - брехливе, невірне лайно»? Він озирнувся на Ліз, яка пила в ліжку, прикрита лише простирадлом. Це тривало вже давно, а падіння Томска вони святкували затяжним перебуванням у захопленому готелі. Ліз була на десять років старша за Мері, ближча до віку Патріка, і не така звично вродлива, зате знала битву. Разом у траншеї чи ліжку вони дарували одне одному ейфорію, якої Мері ніколи не давала. Чи кохав він дружину? Колись - так. А тепер?\n\n«Хочеш?» - Ліз простягла один зі спеціальних кубиків цукру, які вони привезли на святкування, перервавши думки.\n\n«Ще ні, Ліз», - відповів він і повернувся до листа. «Люба Мері... Люба Мері...» Що можна сказати? Як спокутувати те, що він ледве пам'ятає ім'я доньки - Сара чи Барбара? - і не бачив, як вона росте? Як спокутувати провал як чоловіка? Він відпив води. Ніяк. Йому ніколи не пробачать. Не можуть.\n\nВін крекнув, зім'яв лист і відкинув. Розбереться пізніше, на яснішу голову. Повернувся в ліжко до Ліз. «А тепер дай ту кислоту», - усміхнувся він."
 MAG_WA_journalist.6.a: "«Люба Мері, вибач»."

 MAG_WA_journalist.7.t: "Дім"
 MAG_WA_journalist.7.desc: "«Не верзи мені цієї маячні! - кричала Мері в слухавку. - Навіть не смій! Як ти наважився повернутися майже без жодного слова? Як наважився знову влізти в моє життя!»\n\n«Мері, - зітхнув Салліван, спираючись на стіну телефонної будки. - Я повернувся. Вибач, що мене не...»\n\n«Вибач? Вибач?! За що саме? Що покинув мене? Покинув Кейтлін? Їй майже десять, Патріку, а ти жодного разу її не бачив!»\n\n«То ось як її звати...» - подумав він уголос і лише тоді зрозумів, що сказав.\n\nНа іншому кінці запала тиша, а тоді вона недовірливо засміялася. «Я найму адвоката й заберу її. Не шукай нас. Пішов ти, Патріку». Гудки.\n\nПатріка охопила лють, і він ледве стримався, щоби не розтрощити слухавку. Вийшов і сів на лавку, дивлячись, як пасажири снували аеропортом Сан-Франциско. Десять років тому він був таким самим - сім'янином зі звичайною роботою. Тепер шкодував їх і колишнього себе. Вони ніколи не пізнають того, що зробив він. Не знала й Пулітцерівська комісія, коли поштою надіслала нагороду. Він зітхнув. Як же він ненавидів це місце. Спокій, тишу... усе. Через десять років Росія лишалася Росією - землею зброї, поту й адреналіну, якої ці люди ніколи не знатимуть.\n\nАле він удома. Хіба не цього хотів? Ні, збагнув він. Дім - це Ліз і Маккензі. Траншея і зброярня, віскі й кислота. Небезпека й ейфорія. Не це місце. Лишалися Мері та донька, а тепер не було й їх. Земля під ногами більше нічого не значила. Час повертатися додому.\n\nВін підійшов до стійки й сказав працівниці: «Дайте найближчий квиток до Маґадану»."
 MAG_WA_journalist.7.a: "До свіданія, Мері."

 #### Matkovsky Smuta ####
 matkovsky.smuta.1.t: "Із попелу"
 matkovsky.smuta.1.desc: "З огляду на значення справи для виживання країни Матковскій наполіг особисто перевірити фінанси партії й дві години разом із бухгалтером вивчав надходження та видатки.\n\n«Як бачите, дещо можна скоротити, але головна проблема, - сказав бухгалтер, - у тому, що... цифри просто не сходяться. Це великий дефіцит, пане».\n\nНевдовзі Матковскій відпустив бухгалтера, опустився в крісло й замислився. Він почав просту перевірку без особливих очікувань - принаймні так думав, поки не побачив повної картини й не зрозумів: усе ще гірше, ніж здавалося.\n\nНеважко було передбачити наслідки. Партія стане неплатоспроможною, інші це помітять і накинуться на беззахисного суперника. Або навпаки: хтось нападе, а партія не знайде ресурсів для виживання. Висновок один: продовжувати так - означає спрямувати автомобіль просто з урвища.\n\nЦе було неприйнятно, тож роботи багато. На наступному засіданні Воєнної ради він виб'є партію із самозаспокоєння й зрушить справу. Що швидше, то краще.\n\nЛіниво дивлячись у вікно, він помітив загін солдатів, які крокували в ногу. Підійшов ближче й придивився: так, знайомі сірі папахи. Він згадав, як десятиліття тому такі самі добрі сибірські стрільці билися й гинули проти комуністів за мрію, якої так і не здійснили."
 matkovsky.smuta.1.a: "Але ця мрія не загине, подумав він. Росія знову постане."

 matkovsky.smuta.2.t: "Скликання Воєнної ради"
 matkovsky.smuta.2.desc: "Коли міністри й партійні керівники сідали на місця, у повітрі висіла відчутна напруга. Матковскій прийшов раніше за всіх, і ранні гості побачили на обличчі керівника похмуру рішучість. Члени Воєнної ради вирішили не турбувати його до початку й мовчки чекали поганих новин.\n\nКоли годинник пробив дев'яту, Матковскій одразу заговорив: «Дякую, що зібралися так швидко. Питання потім. Наш корабель тоне, тож зараз потрібні дії, а не слова».\n\n«Становище вкрай тяжке, тому говоритиму прямо. Партія витрачає набагато більше, ніж отримує. Якщо негайно не змінимо курс, невдовзі станемо неплатоспроможними».\n\n«Це погана новина». Деякі генерали видихнули й трохи розслабилися, але Матковскій не дав полегшенню затриматися. «Якщо ви гадаєте, що тепер можна спочивати, наша партія вже мертва».\n\n«Добра новина: усе можна виправити. План такий». Генерали незручно заворушилися. «Спершу розширимо промислові потужності. Мусимо знайти й здобути їх будь-якими засобами. Але цього замало. Доведеться просити американців і використати діяспору для підтримки. Сподіваюся, ми не надто горді просити милостиню».\n\nЗаперечень не було. Матковскій одразу поставив питання на голосування. Воєнна рада одностайно схвалила план і розійшлася, лишивши його самого."
 matkovsky.smuta.2.a: "Тієї ночі ніхто не спав. Робота була надто важлива."

 matkovsky.smuta.3.t: "Від сили до сили"
 matkovsky.smuta.3.desc: "Арсєній не вірив у долю, але перед бруталістською бетонною коробкою замислився, чи немає в цьому правди. Він витратив безліч годин, намагаючись уникнути неминучого. Знайшов брошуру «Як ухилитися від призову» й зачитав тонкі дешеві сторінки до дірок. Відмова за переконаннями, скрутне становище, відстрочка - усе випробував, і все марно.\n\nДорогою він думав про наступні п'ять довгих років служби: нескінченні марші, лютий холод, армію під проводом тиранів. Кожна уявна секунда розтягувалася в болісну вічність. Перед входом він востаннє згадав останні місяці. Зірвав майже розквітлий бузок і поволі, обережно почав відривати пелюстки.\n\nОдна - за велике полювання в тундрі. Хлопці так пишалися впольованим оленем. Тепер це здавалося дрібницею. Друга - за зимовий вечір біля вогню й їхній сміх. Він виразно пам'ятав гостру кислинку брусничного варення. В армії такого буде мало.\n\nТри пелюстки. За батька - капітана й опору. За матір, яка приховувала сльози, відпускаючи сина. І остання - за Наташу, кохання всього життя, споріднену душу. Чи побачить її знову? Він не мав великих надій.\n\nПовітря кусало холодом, довше стояти не можна. Зі штампованими призовними паперами він увійшов у нове життя й став перед армійським офіцером. Той усміхнувся й показав усередину."
 matkovsky.smuta.3.a: "«Ласкаво просимо до армії, синку»."

 matkovsky.smuta.4.t: "Горе переможеним"
 matkovsky.smuta.4.desc: "У пустельній долині серед гір чорний смог огортав самотній будинок, із вікон якого виривався вогонь. Пожежа щойно почалася, а з дверей уже вийшов чоловік, тягнучи скриню. Довкола згаслого символу людського життя люди в чорному вантажили цінності до машин.\n\nПеред будинком стояли дві вантажівки: одна з лавами обабіч, друга - з відкритою платформою, повною речей. Скриню обережно поставили між металевою рамою для картини й жалюгідною скринькою для прикрас. Проходячи повз, солдат зустрів командира загону.\n\nУ виразному офіцерському кашкеті й плащі Станіслав задоволено спостерігав за хаосом. «Пане Станіславе! - відсалютував солдат. - Ми вистежили мешканців у навколишньому лісі й усунули, як ви наказали».\n\nОфіцер задоволено всміхнувся. Комуністичних зрадників знищено, останній наказ у цьому проклятому закутку виконано. Скоро він забереться звідси й більше не мерзнутиме. Станіслав поплескав солдата по плечу.\n\n«Добре. Гаразд, хлопці, кидайте все до машини й повертайтеся. Їдемо до Маґадану!» Вони слухняно виконали наказ, боячись наслідків непокори. Без жодних церемоній рідкісний візит до цього куточка світу закінчився, загубившись серед попередніх."
 matkovsky.smuta.4.a: "Не лишилося майже жодного сліду."

 matkovsky.smuta.5.t: "Цикли"
 matkovsky.smuta.5.desc: "Ф'ю-ю! Свисток пролунав цехом, сповіщаючи кінець зміни. Чоловіки мляво відірвалися від верстатів і вийшли в непроглядну північ. Антон Волков був одним із них і так само, як колеги, плентався порожніми вулицями Маґадану. Невдовзі розрізнені робітники злилися в мовчазно-виснажений натовп.\n\nСтомлена маса брела до квартир під холодною мжичкою. Із блискучої бруківки на них дивилися жалюгідні відображення, сповнені співчуття й розчарування їхнім життям. Вітер свистів над дахами, створюючи гіпнотичний гул, що робив натовп бездумним у звичному поверненні.\n\nБезлику оболонку людей перервав гуркіт автомобіля, а тоді гучний сигнал нещасним робітникам. Решта йшла далі, та Антон прокинувся від рутини й раптом усвідомив своє становище: сон, праця, дім - день за днем без перепочинку. Він цінував оплачувану роботу, але самотність не була варта втрати людяности.\n\nКроки Антона ставали коротшими. Він поволі відстав, аж поки лишився сам. Наодинці дійшов висновку: будь-яка зміна, навіть самотність під дощем, краща за ніщо. А різноманіття тепер було рідкісним товаром."
 matkovsky.smuta.5.a: "Це була лише тимчасова втеча."

 matkovsky.smuta.6.t: "Обриси майбутнього"
 matkovsky.smuta.6.desc: "«Скажу прямо: наші фінанси в біді, і треба щось робити. Негайно!» Матковскій ударив кулаком по столу, додавши напруги. Так почалося останнє партійне засідання, де довкола сидів увесь кабінет.\n\nУ кімнаті панувала тривожна тиша. Усі боялися відповісти невдало й опинитися в закутку Сибіру, холоднішому за прийом президента. На лихо одному з присутніх, у напруженні пролунав його кашель. Усі звернулися до нього в надії на відповідь.\n\n«Е-е, ну... можна й далі просити допомоги в американців. Зброю, вантажівки, машини, усе таке, - нервово пробелькотів він і поспішив додати: - Знаю, це звучить божевільно! Але якщо витягнемо з них досить, вони вже не кинуть свої вкладення».\n\nІнший член партії миттю вибухнув: «Тьху! Ти дурень? Через це ми тут і опинилися! Треба дивитися всередину й забирати багатства землі. Грабунок і реквізиція ресурсів ворогів утримають нас на плаву. Вони ж зрадники й заслужили це».\n\nМатковскій слухав дискусію й кивав. Побачивши терпимість керівника, партійці розпочали суперечку й швидко розділилися на два табори. Обидва варіянти мали сенс, та треба подумати. Партії знати це не обов'язково. «Досить. Гадаю, засідання підказало мені рішення. Усі вільні». Коли вони вийшли, він лишився сам обмірковувати складний вибір."
 matkovsky.smuta.6.a: "Головне - зберегти видимість."

 matkovsky.smuta.7.t: "Втрати й здобутки"
 matkovsky.smuta.7.desc: "«Тут, пане президенте, видно, що наші фінанси стабілізувалися. Величезне поліпшення від останньої зустрічі». Кабінет наповнив шелест паперів. «А на цій круговій діяграмі видно, що становище з іноземною допомогою теж покращилося».\n\nПрезидент повільно кивнув і всміхнувся. «Дуже добре». Гортаючи документи, він бачив, що матеріяльні потреби виробництва забезпечено, а колишні страхи змито теперішнім успіхом.\n\nТа найбільше тішив не звіт, а його наслідки. Фінанси партії впорядковано, тож її стерничий невдовзі зможе повернути захід. Не лише землі комуністів і монархістів на Далекому Сході, а й усе далі.\n\nВін уявляв похід армії через Сибір і за Урал та всю майбутню славу. Навіть вступ до Москви й повернення країни, де він стане очільником возз'єднаної Росії.\n\nМрії перервав знайомий голос. «Перепрошую, пане президенте, з вами все гаразд? Ви вже п'ять хвилин усміхнено дивитеся на стіну».\n\nЩоки Матковского почервоніли. «Так, дякую, все добре. Усе задовільно, ви вільні». Бухгалтер швидко зібрав папери й пішов до дверей, але Матковскій додав:\n\n«І якщо комусь про це скажете, знову опинитеся в моєму кабінеті - з іншої причини». Той швидко кивнув і зачинив двері, лишивши президента наодинці з амбіціями."
 matkovsky.smuta.7.a: "Амбітні цілі амбітної людини."

 matkovsky.smuta.8.t: "Передача РВМ №589"
 matkovsky.smuta.8.desc: "«Ви слухаєте Радіо Вільний Маґадан. Розповідаємо новини, яких від вас приховують комуністичні виродки. Я Васілій...»\n\n«...а я Сєрґєй, і це останні новини Смути, поки наша славна нація визволяє Росію місто за містом».\n\n«Нещодавно малий загін наших солдатів узяв містечко на кордоні з Амуром, визволивши його від нацистолюбного покиддя. Думаю, це варто відсвяткувати!»\n\n«Авжеж, Васілію. Побачивши визволителів, мешканці щедро обсипали солдатів нагородами: від горілки й їжі до прикрас. Які ж милі ці селяни».\n\n«Згоден, Сєрґєю! А ще президент Матковскій оголосив програму відбудови села. Державні кошти й ресурси розподілять серед тих, хто співпрацює з урядом».\n\n«Невже? Чудова підмога для глушини. Зрадники за межами Маґадану на таку щедрість не здатні. На місці чесного селянина я за винагороду сам прибіг би до визволителів із головою Ягоди».\n\n«Можна й так сказати, Васілію. На цьому вечірні новини Радіо Вільний Маґадан завершено. З вами був Сєрґєй...»\n\n«...і Васілій. До зустрічі»."
 matkovsky.smuta.8.a: "«А тепер повертаємося до запланованої музики»."
 
 matkovsky.smuta.9.t: "Від берега до берега, від моря до моря"
 matkovsky.smuta.9.desc: "Стук чобіт по металу лунав кораблем. Почувши, що вони дісталися Росії, юнаки кинулися на палубу. Серед них був Пітер, який завербувався заради обіцяних маґаданським урядом пригод. Нарешті зашнурувавши чоботи, він підвівся й приєднався до добровольців.\n\nНа палубі його зустріло сліпуче світло, та швидко поступилося краєвидові узбережжя: тьмяно-сірі скелі, лише де-не-де розітнуті смугами снігу й криги. Далі виднівся легендарний порт Маґадану - такий самий сірий і понурий, як усе довкола.\n\nПітер приголомшено сперся на поруччя разом з іншими. Брошури обіцяли безмежну природну красу земель, які вони допомагатимуть відвойовувати. Натомість вони отримали пустку, поряд із якою навіть Нунавут здавався барвистим. Серце Пітера падало, поки він усвідомлював, у що вплутався.\n\nКонтейнеровоз причалив, і бідолашні юнаки зійшли на берег. На гнилих маґаданських пірсах судна ламали лід, прокладаючи кораблям шлях утечі зі сніжної тундри - утечі, про яку вони могли лише мріяти. Плентаючись портом, вони нарешті дісталися нового мучителя, гаданого керівника РФП.\n\nТой привітав їх із давно втраченою ними енергією: «А, нарешті зустрілися! Ласкаво просимо до Росії! Сподіваюся, подорож була не надто незручною. Ходімо, вас треба багато до чого підготувати». Гурт пішов за радісним чоловіком, та Пітер та інші досі думали лише про безмежне розчарування."
 matkovsky.smuta.9.a: "Ніхто не дивився їм у вічі."

 matkovsky.smuta.10.t: "Лист з Америки"
 matkovsky.smuta.10.desc: "На конверті, який отримала Ґаліна, стояло ім'я Есфір Кісєльова. Стара не чула його багато років. Востаннє це була маленька дівчинка, яку батьки повезли до Америки понад п'ятнадцять років тому. Тепер у тремтячих руках вона тримала зв'язок із людиною, яку давно вважала втраченою.\n\nНетерпляче розірвавши конверт, Ґаліна знайшла кишеньковий годинник, лист і гроші. Годинник був тонкої роботи. Гроші - американські. Невдалий вибір, подумала стара, але намір добрий, та й у місті їх можна обміняти. Найбільше її цікавив лист.\n\nВона повільно й уважно читала білий аркуш. «Люба бабушко, сподіваюся, цей лист застане тебе в безпеці. Ми давно не бачилися, а мати й батько не любили листуватися, але ось я пишу. В Америці в нас усе добре, зважаючи на обставини.\n\n«Тепер я живу в Нью-Йорку. Тут метушливо й зовсім не так, як у вас у Росії. Стільки автомобілів і будівель. Таймс-сквер іноді здається нереальним через шум мільйонів людей, що проходять нею щодня. Я працюю продавчинею в ювелірній крамниці, тому й змогла дістати годинник. Сподіваюся колись повернутися до тебе, коли стане безпечніше. З любов'ю, Есфір».\n\nҐаліна не вірила прочитаному. Спершу її сповнила радість, та останні слова принесли страх. Вона схопила папір та олівець, але зупинилася, написавши своє ім'я. Східний Сибір був сонним краєм, але відколи тут була онука, дедалі частіше прокидався в тривозі. Ґаліна замислено поглянула у вікно, шукаючи відповідей у землі назовні."
 matkovsky.smuta.10.a: "А вітер тим часом заглушував її розпач."

 #### Werbell Smuta Events ####
 werbellsmuta.1.t: "Що більше все змінюється"
 werbellsmuta.1.desc: "Більшість маґаданців бачила в РФП сварливу зграю головорізів, блазнів і реакціонерів - купку харбінських невдах, нездатних утримати докупи навіть власну партію. Не дивно, що мало хто заперечував проти її падіння.\n\nМаґадан ніколи не був приємним місцем: перевалочний пункт для таборів рабської праці, ще більше затьмарений фашистською плямою. Принаймні НКВД мало подобу дисципліни. А більшість чорносорочечників були вуличними бандитами!\n\nМайже на кожному розі стояв чорносорочечник, чіплявся до містян і нав'язував мінливу партійну лінію. Ніна була на межі. Щодня брела вулицями, опустивши голову й уникаючи поглядів, хоча знала, що на неї все одно кричатимуть. «Дегенератка!» було одним із найчастіших і найдобріших слів. Її постійно розпитували, куди й до кого йде; якщо головорізам щось не подобалося, заганяли додому.\n\nТож коли до Маґадану вдерся загадковий американський еміґрант, вона раділа першою. Тиждень вулиці знову здавалися живими - наскільки може ожити напівзамерзле промислове пекло. Та за кілька днів повернулося знайоме: інша форма, трохи інша лексика, але ті самі люди.\n\nНіну й далі переслідували, допитували та принижували за будь-яке бурмотіння. Люди сперечатимуться, чи стала рука влади легшою. Для когось, може, так. Для Ніни зрештою не змінилося майже нічого."
 werbellsmuta.1.a: "А ще більше лишилося незмінним"

 werbellsmuta.2.t: "Під новим керівництвом"
 werbellsmuta.2.desc: "Більшість маґаданців розгубилася, коли дивакуватий Мітчелл Вербелл III осів у місті. За попередні тижні вулицями почав ходити звіринець не менш дивних постатей, які розмовляли незрозумілими мовами. Намір американця був для більшости таємницею, але його явно швидко втілювали.\n\nКрім раптового напливу іноземних кораблів, найпомітнішою зміною стало зникнення чорносорочечників. Вони були вуличною чумою, тероризували людей і робили замерзле місто-перевалку для в'язнів іще нестерпнішим. Вони охоче чіплялися до всіх, хто відхилявся від мінливої лінії партії, або до будь-кого, на кого конкретний бандит сьогодні мав зуб.\n\nНіна, що опиралася фашистам від їх появи в Маґадані, більше не могла це терпіти. Вона не ходила сама, бо ризикувала, що її повалять або простежать до дому, ловлячи кожне слово й караючи за будь-яку фразу, яку можна витлумачити як загрозу режиму.\n\nТож вона першою зраділа, коли одного дня прокинулася й не побачила на вулицях слуг РФП. Люди пліткували, куди ті поділися. Одні сподівалися, що їх очистили, розстріляли й закопали; інші - що вони втекли. Ніна особливо сподівалася на перше.\n\nБільшість гадала, що новий режим просто навів серед них лад і відправив відвойовувати Батьківщину - точніше, на передову. Хай якою була причина, після цього малого вчинку дехто в Маґадані почав обережно вірити в доброзичливість нового незвичного правителя."
 werbellsmuta.2.a: "У чому підступ?"

 werbellsmuta.3.t: "Спостереження за літаками"
 werbellsmuta.3.desc: "Барнабі милувався летовищем - музеєм від термінала до руліжної доріжки, повним майже всіх відомих йому моделей. Біля смуги стояв «Гокер Гаррікейн», добре знайомий із часів над Ла-Маншем. Трохи далі він упізнав Ju-87, що повернув теплі спогади про польоти над басейном Конґо в Центральній Африці.\n\n«Круто, правда, Феліпе?» - сказав Барнабі другові.\n\n«Востаннє кажу: я Федеріко! - роздратовано зітхнув той. - І ні! Це жах. Тут щонайменше двадцять моделей. Двадцять! Я ледве ремонтую твій «Гокер», не кажучи про оце...» Він показав на бомбардувальник. «Що це за аргентинське страховисько? Звідки ми його взяли?»\n\n«Усе буде добре, Фреде, - упевнено поплескав механіка Барнабі. - Усередині вони, певно, однакові».\n\n«Ні! - закричав Федеріко. - Де, до біса, ми візьмемо деталі для половини? Краще здати все на брухт!»\n\nБарнабі незворушно всміхнувся. «Розберемося, Фреде. Ти завжди розбираєшся».\n\n«Сподівайся, що зможу, - буркнув Федеріко, відкриваючи інструменти перед величезним завданням. - Інакше не пролетиш і п'ятнадцяти метрів!» Барнабі всміхнувся й пішов, востаннє махнувши другові."
 werbellsmuta.3.a: "«Пам'ятай, у нас крайній термін!»"

 werbellsmuta.4.t: "Реліквії в снігу"
 werbellsmuta.4.desc: "«Менший, ніж я гадав, Ісайє. Мені казали, ці “Тигри” щонайменше кілометр завширшки й два заввишки! А це рухома клітка». Аркадій усміхався нікому, затиснувши зубами цигарку. Краще б продавав їх, ніж жував, але полегшення вічно бракувало. У Сибіру сама боротьба за здоровий глузд була війною.\n\n«Ти старий, але не здурів». Голос Ісайї лунав з-під танка. Випрасуваний сірий комбінезон виказував вік. Може, він ним пишався, подумав Аркадій. А може, прасування було єдиним заняттям, крім ремонту й пиття всього, що знаходилося. Байдуже. «Колись ця штука була справжнім жахом. Та не диво-зброєю, еге ж? Як вона опинилася тут, на іншому боці світу?»\n\nАркадій оглянув звалище. Полем були розкидані танки всіх форм і розмірів: Т-34, “Лі”, “Матильди”, навіть новіші незнайомі. Якби не іржаві й поламані спогади про світ у вогні, це було б прекрасно, мов розбита римська статуя в музеї. Рани розповідали власну історію, навіть якщо митець не хотів її розголошувати. Американцям потрібна бронетехніка для походу на захід. Вони її отримають.\n\n«Не знаю, чого американці від цього чекають, - сказав Аркадій. - Зібрати все докупи - певний спосіб усе втратити. Та мені платять за ремонт, тож байдуже. Головне, щоб мене не повісили комуністи або, Боже борони, ті навіжені за Уралом».\n\n«Не ти поведеш їх, Ісайє. Я». Аркадій виплюнув цигарку й розчавив. У кишені пальта намацав старого друга, дістав, перевірив повний магазин і вставив назад. Може, настав час повернути ці старі машини до служби."
 werbellsmuta.4.a: "«Сподіваюся, ти знаєш, що робиш»."

