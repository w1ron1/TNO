 MAG_russia_last_port_of_call_5: "Оплот вільної торгівлі"
 MAG_russia_last_port_of_call_5_desc: "Маґадан не просто останній великий діючий порт Росії - він перетворився на квітучий осередок вільної торгівлі. Під м'яким проводом ринку ми стали економічною силою, з якою рахуються в Тихоокеанському регіоні й далеко за його межами."
