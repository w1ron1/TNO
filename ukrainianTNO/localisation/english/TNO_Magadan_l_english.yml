 ### West Alaska - A Government of Personalities ###
 MAG_WA_a_government_of_personalities_category: "Уряд особистостей"
 MAG_WA_a_government_of_personalities_category_desc: "Західна Аляска має незвичайний лад. Чужинське походження Вербелла та його американські зв'язки дали йому широкий вибір міністрів, здатних допомогти керувати республікою: від контактів у ЦРУ й приятелів-найманців до російських колаборантів і місцевих політиків.\n\nУтім, Президентові слід пильнувати, кого він бере до кабінету: якщо не зважати на всі сторони, декотрі можуть позаздрити чужій владі.\n\n- §OВплив найманців§!: [?MAG_mercenaries_faction_strength] §OСтавлення§!: [?MAG_mercenaries_faction_opinion]\n[?MAG_WA_merc_army_weekly_manpower] Щотижневі людські ресурси, [?MAG_WA_merc_army_army_attack_factor_change]% Атака, [?MAG_WA_merc_army_army_defence_factor_change]% Оборона\n\n- §YВплив колаборантів§!: [?MAG_collabs_faction_strength] §YСтавлення§!: [?MAG_collabs_faction_opinion]\n[?MAG_WA_merc_army_conscription_factor_change_c]% Коефіцієнт військовозобов'язаного населення, [?MAG_WA_merc_army_de_encryption_factor_change]% Шифрування, [?MAG_WA_merc_army_de_encryption_factor_change]% Дешифрування\n\n- §GВплив місцевих§!: [?MAG_locals_faction_strength] §GСтавлення§!: [?MAG_locals_faction_opinion]\n[?MAG_WA_merc_army_conscription_factor_change_l]% Коефіцієнт військовозобов'язаного населення, [?MAG_WA_merc_army_production_factory_max_efficiency_factor_change]% Межа ефективности виробництва"
