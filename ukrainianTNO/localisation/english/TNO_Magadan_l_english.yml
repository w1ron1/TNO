 ### Matty Econ Stuff ###
 MAG_DECCAT_economic_development_my_man_matty: "Дволика Батьківщина"
 MAG_DECCAT_economic_development_my_man_matty_desc: "§MПорт Маґадану§! - наше вікно у світ, завдяки якому ми відбудуємо економіку й дістанемо шанс протистояти дрібним західним князькам, поки визволятимемо Росію з лабет роздроблености. Та способи досягнення цього викликають у партії запеклі суперечки.\n\n§nМіхаїл Матковскій§! виступає за поліпшення торговельних зв'язків з ОВН, але наполягає на розумному протекціонізмі: прямі іноземні інвестиції мають обмежитися кількома економічними районами довкола Маґадану, щоби більшість господарства лишалася всеросійською. Так він прагне захистити російську працю й культуру в глибині Сибіру.\n\n§gНіколай Пєтлін§!, зі свого боку, обстоює тісніші зв'язки зі США, які дозволять американським корпораціям інвестувати й працювати аж до Іркутска та ще далі в міру визволення Росії від дрібних західних правителів. Це дасть ширший доступ до американських грошей, досвіду й ресурсів, але викликає спротив правого крила партії. Обирати слід мудро: наша економічна доктрина матиме далекосяжні наслідки для майбутнього російської нації."

 MAG_russia_last_port_of_call_1: "Останній порт Росії"
 MAG_russia_last_port_of_call_1_desc: "Маґадан - останній діючий порт Росії, не відрізаний непрохідною місцевістю чи німецькими кораблями. Його значення для виживання російської нації неможливо переоцінити, і ми використаємо цю рятівну нитку сповна."
 MAG_russia_last_port_of_call_2: "Останній порт Росії"
 MAG_russia_last_port_of_call_2_desc: "Маґадан - останній діючий порт Росії, не відрізаний непрохідною місцевістю чи німецькими кораблями. Його значення для виживання російської нації неможливо переоцінити, і ми використаємо цю рятівну нитку сповна."
