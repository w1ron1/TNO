 ### West Alaska expansion tree ###
 MAG_WA_the_republic_of_west_alaska: "Республіка Західна Аляска"
 MAG_WA_the_republic_of_west_alaska_desc: "Ми зробили немислиме. Вербелл і його армія найманців скинули з маґаданського трону безгрошового дрібного тирана Матковского. Невдовзі до нього приєднався колишній приятель - Родзаєвскій, Бандитський король Далекого Сходу. Тепер світ затамував подих: Вербелл засновує першу державу солдатів удачі. Відкинувши російські звичаї найменування, він назвав нову батьківщину на честь краю, найближчого до старої: Західна Аляска.\n\nОднак новій Республіці ще треба закріпитися на чужій землі. Найманська армія посилить Амур і Маґадан та викорінить рештки фашистського опору. Вербелл запросить юнаків із сіл і містечок малолюдного Далекого Сходу вступати до Солдатів без кордонів. В історії Росії відкрилася нова сторінка; чи стане вона окремим розділом, а чи лишиться приміткою - ще побачимо."

 MAG_WA_greater_ambitions: "Більші амбіції"
 MAG_WA_greater_ambitions_desc: "Вербелл заснував свою державу. Фашистські заколотники в селах або пристали до нас, або обрали смерть услід за своїми жалюгідними Вождями. Та є ще одна проблема. Точку неповернення пройдено, й тепер ми приречені копати цю пустельну землю, доки не натрапимо на золото або не загинемо. У барабані лишилася одна куля - нею й доведеться поцілити в зорі. Усупереч усьому ми погодилися: гра варта свічок.\n\nВідсуньмо завіси Маґадану й Амура та погляньмо на решту Далекого Сходу. Край малолюдний і спустошений, але гостроокому найманцеві тут є чим поживитися. А хто ми, як не гурт найхитріших у світі покидьків? За царистами на півночі лежить земля молока й меду: кличуть діяманти Якутії та золото Алдану. Це вже більше за звичайну солдатську платню, хіба ні?"

 MAG_WA_bury_the_past: "Поховати минуле"
 MAG_WA_bury_the_past_desc: "Колись ми працювали в Центральній Америці. Один мудак найняв нас розібратися з брудними покидьками, які шантажували його компанію. Ми виконали роботу, а він - повірите? - спробував відмовитися від угоди, урочистої клятви перед людьми й Богом заплатити за наші послуги. Не скажемо, що з ним сталося, але гроші ми отримали, а про нього більше нікому не довелося турбуватися.\n\nТут усе так само: маємо купу ветеранів РФП, які нас ніколи не любили й не хотіли бачити. Вони відкрито збиралися нас ошукати й зрадили ділом або думкою. Час показати ціну зради. До біса користь від співпраці. Покажемо, що ми не заодно з цими дурнями в коричневих сорочках, а справді готові поховати минуле."

 MAG_WA_the_fate_of_the_tsar: "Доля царя"
 MAG_WA_the_fate_of_the_tsar_desc: "Присутність «царя» Міхаїла на Далекому Сході була низкою нещасливих випадковостей. Народжений в Австралії, він прийняв запрошення на вечерю в Сибіру, не знаючи, що з усіх претендентів зголосився лише він. Згодом царисти з подивом з'ясували: Міхаїл насправді не має законних прав на російський престол. Нединастичний шлюб його батька робить його в кращому разі нелегітимним, а в гіршому - узурпатором.\n\nТа ми мусимо вирішити, що з ним робити. Вербелл дозволив собі поводитися з князем великодушно. Хлопець не становить загрози, але ще може придатися. Він із заможної родини, тож можна миттю відправити його назад до Австралії й нашою службою доставки доправити цілим і здоровим. Авжеж, за таке першокласне перевезення належить щось більше за поплескування по плечу. Зателефонуємо родині й попросимо не губитися."

 MAG_WA_the_chita_training_academy: "Чітинська навчальна академія"
 MAG_WA_the_chita_training_academy_desc: "Коли наші війська проходять містами й селами Західного Сибіру, юнаки юрбами благають прийняти їх до війська легендарного найманця Вербелла. Проблема в їхньому досвіді: хтось рибалка, хтось торговець, а дехто зроду не бачив рушниці. З такими знаннями вони стануть лише тягарем у майбутніх боях за Сибір.\n\nНа щастя, завоювання Чіти дало Вербеллові змогу використати небагаті людські ресурси Далекого Сходу. Там він створить навчальну академію для всіх росіян, що прагнуть вступити до його війська. Її укомплектують наші ветерани й старші офіцери, аби жоден новобранець не пішов на війну, не знаючи, яким кінцем рушниці цілитися у ворога."

 MAG_WA_eyeing_yakutsk: "Прицілитися до Якутска"
 MAG_WA_eyeing_yakutsk_desc: "Якутск - невелика прикордонна республіка просто за нашим кордоном. За інших обставин ми не квапилися б нападати, та їхні землі мають дещо цінніше за робітників чи промисловість. Чутки про діяманти й багатство від торгівлі доходять на південь, а зрештою - до вух Вербелла. Коли військо так швидко росте, коштовності допоможуть платити новим найманцям.\n\nНаступний крок очевидний. Ми нападемо на Республіку Якутію не зі злости чи особистої образи, а з прагматичної потреби. Без ідеологічної підтримки, захищена лише місцевими ополченцями та злочинцями, заманеними високою платнею, Якутія не стане великим викликом. Проблема лише в часі: інші сили Далекого Сходу невдовзі теж націляться на ці землі, і якщо ми забаримося, нагоду буде втрачено."

 MAG_WA_foreign_investments: "Іноземні інвестиції"
 MAG_WA_foreign_investments_desc: "Ми нарешті об'єдналися з найближчими сусідами й забезпечили життєво важливу Чіту. Її робітники та обладнання дозволять збільшити військо й підняти платню нинішнім солдатам. Але для американця Вербелла «досить» - замало. Треба витиснути із захоплених ресурсів більше, і він уже має план для Республіки Західна Аляска.\n\nПершим операціям бракувало близьких ринків, здатних поглинути пропозицію. Вербелл це виправить: обдзвонить керівників компаній і знайомих по всій Америці, і вони збіжаться по частку нового багатства. Він запропонує трохи нижчі ціни на найновіше, передове обладнання. Зрештою, тут, у Західній Алясці, ми ведемо бізнес, а не доброчинність."

 MAG_WA_diamonds_from_their_ashes: "Діяманти з їхнього попелу"
 MAG_WA_diamonds_from_their_ashes_desc: "Ми перемогли якутів і тепер успадкували спадок слабких: діяманти Західної Аляски належать нам. Нинішнього видобутку вже вистачить, щоб трохи краще годувати й оплачувати наявні найманські роти. Та людям на кшталт Вербелла «трохи краще» замало; для його амбіцій потрібно, мабуть, у тисячу разів більше.\n\nЗ попелу їхньої недовгої незалежности ми заберемо багатства землі. Наші люди пройдуть селами й містами Західної Аляски, формуючи трудові батальйони з широкооких юнаків, завжди охочих долучитися до нашої маленької справи. Вони працюватимуть у шахтах за тими самими нормами, що й за Республіки Якутії. А якщо покажуть себе добре - може, колись заслужать місце у справжніх найманських ротах."

 MAG_WA_the_guns_of_west_alaska: "Гармати Західної Аляски"
 MAG_WA_the_guns_of_west_alaska_desc: "Кілька місяців тому, ще на платні Матковского в Маґадані, Вербелл казав, що має зв'язки в кримінальному світі й може дешево діставати зброю. Матковскій не знав, що ті зв'язки не обмежуються рушницями. Гармати, однострої, припаси й усе потрібне для війни - назвіть товар, і Вербелл його дістане, ще й дешевше.\n\nЧерез совєцьку занедбаність промисловість Далекого Сходу слабка, тож Вербелл мусить зробити все, аби його військо Солдатів без кордонів було добре споряджене й готове щомиті наступати. Він обдзвонить кожен номер і притисне кожного знайомого - аби Західна Аляска трималася на плаву. Рештки червоних і сили Отця можуть здаватися дрібними, але краще перестрахуватися."

 MAG_WA_firebase_moses: "Вогнева база «Мойсей»"
 MAG_WA_firebase_moses_desc: "Республіка Башаріна, червоні й мітичний Отець на півночі діють у тіні, ведуть війни й зводять рахунки без нашого відома. Без розвідданих будь-який похід на північ і захід був би ризикованим. Поки відпочиваємо й відновлюємося, треба зібрати відомості про ворогів. На щастя, засіб у нас є.\n\nМи спорудимо вогневу базу «Мойсей» - передову оперативну базу на самому краю нашого політичного й фактичного контролю. Звідти війська повідомлятимуть командування про найменші зміни в складі й розміщенні ворожих дивізій. Сунь-цзи казав: половина битви - знати себе, друга - знати ворога. Цим кроком ми ще трохи наблизили перемогу на Далекому Сході."

 MAG_WA_dogs_of_war: "Пси війни"
 MAG_WA_dogs_of_war_desc: "Наші загартовані війська пройшли довгий шлях. Від крижаних пусток навколо портового Маґадану ми дійшли до перемоги над обома фашистськими володарями краю. Наші солдати воювали по всьому світу, але й тут дійшли межі можливостей і перемогли попри нерівність у чисельности, спорядженні та мотивації. Доля обдарувала Вербелла найзагартованішими бійцями світу.\n\nТа просто «добре» нас не цікавить. Вербелл відбере з нинішніх солдатів тих, кого вважає взірцевою елітою, і зведе їх в один підрозділ. Платня буде вища, а єдиною справою - підготовка до війни. Коли настане час, вони підуть далі, ніж здатна будь-яка людина; вони стануть Псами війни."

 MAG_WA_the_world_calls_for_wetwork: "Світ кличе на мокру роботу"
 MAG_WA_the_world_calls_for_wetwork_desc: "Донедавна у світовому підпіллі нас вважали лише дивовижею, скороминущою модою. Та після завоювання Маґадану нашою працею зацікавилося чимало людей. Якщо кинути клич і запросити найманців до наших земель, заявок буде вдосталь. Вербелл так і зробить: приплив свіжої крови забезпечить усі дивізії потрібними людьми."

 MAG_WA_the_siberian_expedition: "Сибірська експедиція"
 MAG_WA_the_siberian_expedition_desc: "Відпочинок скінчився. Сибір чекає. Республіка Західна Аляска не задовольниться чотирма штатами. Після нашого заклику прибули нові найманці, й було б марнотратством тримати їх без діла, поки гроші поволі надходять. Західна Аляска мусить просуватися вглиб Сибіру - на захід і північ. Вербелл не спиниться, доки весь Далекий Схід не буде в його руках.\n\nДля розширення є три шляхи. На заході - червоні; вони сперечаються, хто законний спадкоємець Союзу, але нам байдуже: розіб'ємо обох. На півночі - Отець і його селянське ополчення, з яким наші елітні найманці впораються. Хай який напрям оберемо, поступ Західної Аляски не повинен спинятися."

 MAG_WA_the_reds: "Червоні"
 MAG_WA_the_reds_desc: "На перший погляд розкол між совєцькими рештками в Бурятії та Іркутску схожий на звичайну старосвітську боротьбу за владу. Та все складніше. Буряти на чолі з колишнім комісаром НКВД Валєрієм Сабліном жорстоко посварилися з головою Прєзідіюма Ґєнріхом Яґодою. Сповнений високих ідей, як часто буває з юнаками, Саблін захопив радіовежу в Бурятії та проголосив намір об'єднати Росію й відновити Совєцький Союз. Яґода оголосив його прибічників ревізіоністами.\n\nТа їхній ідеологічний розкол нас не обходить. Заводи Іркутска й мовна мережа Бурятії - цінні активи для народу Західної Аляски. Нам байдуже, хто має рацію - Саблін чи Яґода. Вони сидять на нашій законній землі; не підуть самі - виселимо."

 MAG_WA_operation_thunderbolt: "Операція «Громовиця»"
 MAG_WA_operation_thunderbolt_desc: "Голова Прєзідіюма Вєрховного Совєта Ґєнріх Яґода давно муляє нам очі на кордоні. Його промови, що лунають над нашими землями, дратують командування й деморалізують солдатів російського походження. До того ж він володіє найлюднішими містами Далекого Сходу - ласою ціллю. Позбувшись його й забравши міста, ми розширимо набір до війська та промислову базу для виробництва зброї.\n\nЯґода нічого не передбачить. Ми вдаримо швидко й міцно, розладнаємо його сили, мов блискавка, що розтинає небо. На відміну від інших далекосхідних армій, НКВД - справжні солдати, а не ополченці, тому потрібна раптовість. Ми зробимо те, що вміємо найкраще, і Яґода назавжди залишиться приміткою в підручниках історії."

 MAG_WA_rules_of_nature: "Закони природи"
 MAG_WA_rules_of_nature_desc: "Совєти вигадали цікаву систему урядування. В Іркутску немає капіталізму: держава керує всім і відповідно розподіляє багатство, хоч і не без упереджень. НКВД весь цей час захищав такий лад. Він міг би гарантувати рівність усім учасникам, але придушує розвиток і особисті заслуги. Вербелл не терпить закладеного в ньому застою.\n\nЦе треба змінити. Ми розпустимо всі комуністичні установи Іркутска. Досить комунізму - буде лише капіталізм. Усі мешканці відкриють новий і кращий американський спосіб життя: треба працювати, винаходити й діяти на ринку. На околицях ми дочистимо рештки НКВД, аби вони не повернулися. Після цього народ Іркутска ще подякує Вербеллові за визволення від кайданів минулого."

 MAG_WA_operation_guardian: "Операція «Охоронець»"
 MAG_WA_operation_guardian_desc: "Вербелл чудово розуміє вдачу Сабліна, хоч той його не розуміє. Вони виросли в різних світах: Вербелл - найманець, Саблін - комісар-дисидент НКВД. Вербелл бачить у комунізмі щось неамериканське й прагне його знищити; Саблін бачить наприкінці шляху до влади надію й реформу. Та обох єднає дитячий ідеалізм: Вербелла - щодо солдатської держави, Сабліна - щодо відродження батьківщини.\n\nАле подібність не завадить нам довести, чиї ідеали переможуть. Саблін, як і ми, знає: на Далекому Сході або ти, або тебе. Щоб захистити свої ідеї, треба вдарити першими й здобути перевагу. Вербелл поважає Сабліна, але власне виживання для нього важливіше."

 MAG_WA_lessons_learned: "Засвоєні уроки"
 MAG_WA_lessons_learned_desc: "Вербелл переміг Сабліна. Його землі тепер належать Солдатам без кордонів. Саблін був молодий і, щиро кажучи, вразив Вербелла. У двадцять три роки він правив власною землею, а ідеї та тверда віра довели його так далеко. Народ Бурятії любив Сабліна й був готовий померти за мрію про союз пролетаріяту, що відлунювала часами Лєніна й старої Революції.\n\nТа він створив не націю солдатів, а націю мрійників. Бачення нового, кращого Союзу не справдилося. Цим юнакам не місце при кермі держави. Ми викинемо всі їхні реформи разом з установами на смітник історії. Вербелл по-своєму вшанує Сабліна: власними мозолястими руками збудує систему, яка не зазнає поразки."

 MAG_WA_proclaim_the_soldiers_republic: "Проголосити Солдатську республіку"
 MAG_WA_proclaim_the_soldiers_republic_desc: "Час проголосити основи й ідеї нової держави. Республіка не для народу, не для ідеологій чи ідеалів, а для солдатів; для тих, кого покинули держави, для всіх, хто став непотрібним, - Солдатська республіка. Воїни будь-якої національности зможуть назвати Західну Аляску домом. Кожному, хто вірить в ідеали Вербелла, ми дамо зброю, однострій і життя на полі бою. Більше нас не розділятимуть зовнішні шати національностей та ідей."

 MAG_WA_the_wanderers: "Мандрівники"
 MAG_WA_the_wanderers_desc: "Держава Алдан відкололася від Далекосхідної Совєцької Республіки, спадкоємиці Совєцького Союзу. Місто стоїть на багатих золотих копальнях, а порядок підтримують дрібні найманці, яких наймають берегти спокій і не пускати бешкетників. На лихо мешканців Алдану, ми вирішили забрати їхню хатинку собі, а золото - собі на платню.\n\nМи покажемо алданцям, як працюють справжні найманські компанії. Опору дорогою до міста очікуємо небагато. Як і з Якутском, проблема не в складності, а в часі: треба поспішити, перш ніж червоні чи Отець зазіхнуть на копальні. Після завоювання Алдану продаватимемо золото через діямантові мережі й добре на цьому заробимо."

 MAG_WA_the_faithful: "Вірні"
 MAG_WA_the_faithful_desc: "На півночі постав новий ворог. Отець Алєксандр Мєнь зібрав строкату ватагу селянського ополчення, розчарованих НКВДистів і фашистських солдатів. Схоже, він християнський анархіст і, попри православ'я, має неортодоксальні погляди на християнство. За донесеннями бази «Мойсей», його сила справді велика - можливо, найсильніша на Далекому Сході після червоних Іркутска й Бурятії.\n\nВійна проти нього неодмінно коштуватиме людей і часу. Та перший удар може дати потрібну перевагу. Багатьом у наших лавах неспокійно перед такою численною й умотивованою силою, але ми бачили повстанців по всьому світу - саме тому й маємо перемогти."

 MAG_WA_the_war_for_hearts_and_minds: "Війна за серця й уми"
 MAG_WA_the_war_for_hearts_and_minds_desc: "Відразу видно: Отець спирається на селян і мисливсько-збиральні громади півночі Далекого Сходу. Та під час руху на південь до нього приєдналося багато людей, готових віддати життя за Царство Боже в баченні Алєксандра Мєня. Селяни не навчені, зате численні. Поклавшись на них, Мєнь припустився вирішальної помилки: щоб розбити його опору, досить завоювати їхні серця й уми.\n\nОтже, це війна пропаганди. З маґаданських радіостанцій ми закликатимемо визволити Далекий Схід від тиранії єретика. Солдати проникатимуть на ворожу територію й роздаватимуть харчі в обмін на відомості. Без народної підтримки Отець - ніщо; його картковий будинок завалиться в темряву."

 MAG_WA_efficient_supply_chains: "Ефективні ланцюги постачання"
 MAG_WA_efficient_supply_chains_desc: "Війна проти Отця триває. Наші солдати, зібрані з найкращих найманців світу, за своєї чисельности й обставин тримаються непогано. Та ми воюємо на улюбленій місцевості ворога. Важкий терен і сувора погода ускладнюють постачання серед хаосу фронту, а брак доріг та інфраструктури не дає вантажівкам безпечно пройти сибірськими лісами.\n\nОтець завдає нам відчутних ударів, тому треба забезпечити сталий потік набоїв і зброї на передову. Ми переймемо ворожі методи й пристосуємо їх до нашої війни: швидкі гінці, нові дороги й маршрути та постійні запевнення, що припаси вже йдуть, мають допомогти. Зрештою, для багатьох наших солдатів це далеко не перше родео."

 MAG_WA_shock_and_awe: "Шок і трепет"
 MAG_WA_shock_and_awe_desc: "Лінії постачання захищено, а війна за серця й уми сибірських народів набирає ходу. Та Отець на півночі досі має перевагу в людях, якої нам не зрівняти. Там, де ми тримаємо фронт, ополчення можна стримати. Проблема в іншому: нас замало, щоб не дати селянам прорватися через незахищені ділянки.\n\nЯкщо дозволимо їм діяти далі, вони зітруть нас на порох. Але Вербелл не збирається програвати. Відповідь - зробити протилежне до ворожих очікувань: атакувати. Швидкими рішучими ударами по слабких місцях ми розчавимо їх, ізолюємо підрозділи й знешкодимо загрозу. Селянських зграй багато, але без харчів їм лишиться тільки здатися."

 MAG_WA_face_the_father: "Постати перед Отцем"
 MAG_WA_face_the_father_desc: "Алєксандра Мєня переможено. Отець із півночі, бунтівник, чиє перекручення православної думки завело його так далеко, тепер цілковито в нашій владі. Вербелл не розуміє релігійного галасу й мусить вирішити його долю. Для нього Отець - мов прибулець з іншого світу, що прийшов проповідувати дивну віру.\n\nТа римляни підказують розв'язання: damnatio memoriae - Отця немає й ніколи не було. Наші зв'язки з Церквою слабкі, але якщо натиснути, вона поступиться й оголосить Мєня єретиком. Народ треба відвести від його ідей, хоч би якими гідними здійснення вони були. Після остаточної перемоги ми заволодіємо північчю Сибіру й наблизимося до завершення Західної Аляски як держави."

 MAG_WA_the_best_is_yet_to_come: "Найкраще ще попереду"
 MAG_WA_the_best_is_yet_to_come_desc: "Армії Західної Аляски здолали червоних на сході й Отця на півночі. Вербелл визнає, що досяг набагато більшого, ніж сподівався. З рядового найманця на платні найсварливішого виродка Далекого Сходу він став володарем усього східного узбережжя Росії й тепер дивиться через Беринґову протоку на рідну країну. Він не сумнівався, що старий п'яниця й озлоблений солдат може далеко зайти, але ціла держава в кишені? Божевілля. Чисте божевілля.\n\nТа зараз не час для сентиментів. На заході Росія досі в хаосі й розділена між державами, що змагаються за панування над її землею. Справ безліч. Він дивиться на дім, потім на свої володіння. Роботи вистачає. Найкраще ще попереду."
 
 ### April fools special tree to replace the father tree ###
 MAG_WA_what_on_earth_is_going_on: "Що це в біса коїться"
 MAG_WA_what_on_earth_is_going_on_desc: "Будь ласка не вбивай поні це погано"

 MAG_WA_a_mercenary_and_a_pony: "Найманець проти поні"
 MAG_WA_a_mercenary_and_a_pony_desc: "ніііііііі"

 MAG_WA_harmony_doesnt_bring_money: "Гармонія не приносить грошей"
 MAG_WA_harmony_doesnt_bring_money_desc: "ти погана людина"

 MAG_WA_the_best_is_yet_to_come_v2: "Найкраще ще попереду"
 MAG_WA_the_best_is_yet_to_come_v2_desc: "Армії Західної Аляски здолали червоних на сході й Отця на півночі. Вербелл визнає, що досяг набагато більшого, ніж сподівався. З рядового найманця на платні найсварливішого виродка Далекого Сходу він став володарем усього східного узбережжя Росії й тепер дивиться через Беринґову протоку на рідну країну. Він не сумнівався, що старий п'яниця й озлоблений солдат може далеко зайти, але ціла держава в кишені? Божевілля. Чисте божевілля.\n\nТа зараз не час для сентиментів. На заході Росія досі в хаосі й розділена між державами, що змагаються за панування над її землею. Справ безліч. Він дивиться на дім, потім на свої володіння. Роботи вистачає. Найкраще ще попереду."

 ### West Alaska regional political tree ###
 MAG_WA_in_the_land_of_fortune_and_glory: "У країні удачі та слави"
 MAG_WA_in_the_land_of_fortune_and_glory_desc: "Ніхто не чекав, що звичайний командир найманців захопить значну частину Росії. Навіть фахівці Ленґлі й Вашинґтона не передбачили ланцюга подій, що привів Вербелла до перемоги над фашистами, комуністами й Отцем. Тепер він творить нову державу - притулок для найманців, бездомних громадян світу, яких мир позбавив роботи.\n\nЦі турботи скінчилися: Республіка Західна Аляска дасть працю всім. Позбавлені прав, зраджені й розчаровані знову знайдуть прихисток у світлі свободи. Вітаємо в Західній Алясці, панове. До роботи."
 
 MAG_WA_coopting_the_bureaucracy: "Підпорядкувати бюрократію"
 MAG_WA_coopting_the_bureaucracy_desc: "Перемігши авторитарних тиранів, Вербелл знайшов у кожній державці власну бюрократію. Комуністична й фашистська одержимість порядком лишила скарбницю адміністративних засобів. Марнувати їх шкода. Без союзників Республіка мусить знайти або створити їх; виживання вимагає поступок.\n\nФашисти, нацисти й комуністичні посіпаки досі вірні своїм ідеям, але це тимчасово. Коли зміцніємо, позбудемося попутників і приведемо власних вірних людей."
 
 MAG_WA_enforcing_the_constitution: "Забезпечити виконання конституції"
 MAG_WA_enforcing_the_constitution_desc: "Без конституції Західна Аляска не була б державою громадян. За американським взірцем вона дає права і закордонним найманцям, і місцевим. Без будь-кого з них Республіка відчула б фантомний біль, якого не усуне жоден протез: права й ліва рука мусять діяти разом.\n\nКонституцію вже укладено завдяки далекоглядності Президента - тепер її треба виконувати. Військова поліція припинятиме конфлікти між найманцями й цивільними, а колаборанти, що пристали до нас, отримають важливі посади."
 
 MAG_WA_hotline_america: "Гаряча лінія з Америкою"
 MAG_WA_hotline_america_desc: "Вербелл волів би вважати свою справу незалежною, та вашинґтонські боси думають інакше. Через його давнього товариша з УСС Джона Сінґлауба вони наглядають за урядом і випробовують його відданість. Патріот чи найманець заради вигоди - ще невідомо. Зате залежність Республіки від американської зброї очевидна.\n\nДля поширення свободи нам потрібен зв'язок із Леді Свободою. Її цікавість дратує, але її заводи можуть підтримати сестринську республіку за Беринґовою протокою. Створимо пряму гарячу лінію до американського уряду, щоб дзвонити, коли все піде шкереберть."
 
 MAG_WA_govern_like_a_cincinnatus: "Правити як Цинциннат"
 MAG_WA_govern_like_a_cincinnatus_desc: "Місцеві звинувачують Президента Вербелла в диктаторстві й малюють Цезарем, байдужим до народу. Нісенітниця: він нащадок білого офіцера й прибув навести лад у спустошеній батьківщині. Який патріот не зрадіє відродженню рідної країни?\n\nВербелл не диктує - він править. Подобається це чи ні, росіяни Західної Аляски його піддані, і він про них дбає. Можливо, колись він піде й дозволить гіднішому росіянинові стати Президентом."
 
 MAG_WA_rule_like_a_caesar: "Правити як Цезар"
 MAG_WA_rule_like_a_caesar_desc: "Завдяки впертості й удачі Вербелл відібрав батьківщину у фашистів і комуністів. Багато хто чекав демократії від армії з американською підтримкою, та цього не буде. Влада, яку ніхто не бере, дістанеться комусь іншому - Вербелл не ризикуватиме. Хай плебс глузує: він бере віжки хаосу заради їхнього ж добра.\n\nРеспубліка нічого не обіцятиме місцевим. Нехай глузують і бунтують; хто несе свій хрест, нехай робить це мовчки. Краще день бути левом, ніж вічність вівцею."
 
 MAG_WA_illiberalism_by_necessity: "Неліберальність із необхідности"
 MAG_WA_illiberalism_by_necessity_desc: "Російські обставини не дозволяють американських політичних свобод. Щоб перемогти, Вербелл мусить згуртувати всі політичні верстви й не допускати незгоди. Це прагматично: коли його диктаторський строк скінчиться, Республіка докладе всіх сил до розширення свободи.\n\nПоки що права доведеться обмежити. Державні установи перевірятимуть газети, радіо й інші медія на ознаки невдоволення та заколоту. Лише контроль і стриманість повернуть мир до Росії."
 
 MAG_WA_integrating_the_nkvd: "Інтегрувати НКВД"
 MAG_WA_integrating_the_nkvd_desc: "Згадка про НКВД викликає в росіян стогін. Та їхній досвід авторитарного порядку може допомогти Вербеллові спинити незгоду. Президент не комуніст, але в пустках не до догм. Інша можливість - бандити РФП, яких місцеві ненавидять ще більше.\n\nІнтегрованих НКВДистів перевчать на державну поліцію й доручать їм тил, поки солдати Вербелла воюють. НКВД жорстокий, але менше зло за РФП. Найманець Вербелл заробляє, зокрема, вибираючи менше зло."
 
 MAG_WA_make_use_of_the_blackshirts: "Використати чорносорочечників"
 MAG_WA_make_use_of_the_blackshirts_desc: "Фашистська партія харбінських і маньчжурських емігрантів була першим ворогом Вербелла. Матковскій зник, а його й Родзаєвского люди лишилися без проводиря. У в'язницях Далекого Сходу бандити й чиновники чекають нового наказу. Для порядку вони можуть придатися; альтернатива - НКВД, а це окрема халепа.\n\nПрезидент помилує чорносорочечників і суворо попередить. Поки він об'єднує Росію війною, вони пильнуватимуть порядок удома. Фашизм суперечить ідеалам Республіки, але іноді доводиться обирати менше зло."
 
 MAG_WA_executive_orders: "Виконавчі укази"
 MAG_WA_executive_orders_desc: "Як громадянин США, Вербелл не любить правити указами. Американська демократія тримається обережним використанням влади й прецеденту; кожен його указ може стати зброєю майбутнього диктатора.\n\nТа боягузтву не час. Якщо він не візьме владу, її візьме інший. Росіяни не мають американської розкоші безпечного життя, а в боротьбі за виживання не можна стримуватися. Західна Аляска буде невдоволена, але Цезар рятував римлян не турботою про свободу, а про життя. Розчаровані - зате живі."
 
 MAG_WA_a_velvet_gloved_iron_fist: "Залізний кулак в оксамитовій рукавичці"
 MAG_WA_a_velvet_gloved_iron_fist_desc: "Як добрий правитель, Вербелл воліє любов, а не страх. Та для порядку й захисту влади іноді потрібні крайні заходи. Він прагне, щоб Росія розділяла його перемоги, радість і страждання, але навіть найбільша щедрість не знищить зло в людських серцях.\n\nСтрах - таке саме знаряддя, як любов. Коли захоплення не діє, приходить стримування: суворі кари, проникнення колишніх НКВДистів у громади, усе заради порядку. Уряд воліє, щоб його любили; якщо ні - нехай бояться."
 
 MAG_WA_the_carrot_and_the_stick: "Батіг і пряник"
 MAG_WA_the_carrot_and_the_stick_desc: "На етнічно й культурно строкатому Далекому Сході потрібна гнучкість. Люди вільні коритися нашим наказам або ні: перших нагородимо й підвищимо, других покараємо за кримінальним кодексом.\n\nУряд триматиметься осторонь цивільних. Поліція каратиме, цивільні органи винагороджуватимуть виняткову службу. Не кажіть, що Вербелл невдячний: він віддячує гідним і карає невдах."
 
 MAG_WA_with_us_or_against_us: "З нами чи проти нас"
 MAG_WA_with_us_or_against_us_desc: "Якщо бути Цезарем, треба вчитися на його помилках. У березневі іди вороги закололи його, хоча він вважав їх друзями. Місцеві можуть терпіти чужоземця, але не приймуть цілком. Наші стосунки суто професійні: ви з нами чи проти нас?\n\nМи не служимо їм, як уряд США служить народові. Коли обов'язок - порятунок, місця для компромісу майже немає."
 
 MAG_WA_a_loyal_legislature: "Дієздатна законодавча влада"
 MAG_WA_a_loyal_legislature_desc: "Далекосхідна бюрократія - візантійська клаптикова ковдра законів, що ледве нагадує державу. Фашистські й комуністичні стандарти суперечать один одному: наприклад, імперська система проти метричної.\n\nРеспубліка уніфікує закони й витче з клаптиків нову бюрократію - гладку державну службу, що добре служить людям."
 
 MAG_WA_assign_regional_commanders: "Призначити крайових командирів"
 MAG_WA_assign_regional_commanders_desc: "Західну Аляску поки що забезпечено, але для стабільности й продуктивности її треба управляти. Поділимо державу на краї й призначимо кожному командира.\n\nКомандирів оберемо з найкращих і найвірніших, щоб вони служили цілям держави, а не власним."
 
 MAG_WA_representation_through_service: "Представництво через службу"
 MAG_WA_representation_through_service_desc: "Найманці Президента живуть краще за місцевих: мають достаток, політичні й виборчі права та сталу роботу. Росіяни заздрять, але суворі закони майже не дають піднятися - не по-американськи.\n\nВербелл виправить це й нестачу людей водночас: представництво через службу. Місцеві вступатимуть до війська й отримуватимуть більше прав у міру служби. Якщо вміють стріляти, навіщо перекривати кар'єру?"
 
 MAG_WA_drawing_the_districts: "Накреслити округи"
 MAG_WA_drawing_the_districts_desc: "Демократію тимчасово призупинено, але не назавжди. Цезар чи Цинциннат, Вербелл мусить відповісти, яке місце народ має в Республіці й чи права обмежено навічно.\n\nПочнемо готувати демократію: накреслимо округи, створимо виборчі дільниці й передамо частину влади містам. Завершимо згодом - поки Центральний Сибір готується до війни, перемога важливіша за свободу."
 
 MAG_WA_a_legal_path_to_collaboration: "Законний шлях до співпраці"
 MAG_WA_a_legal_path_to_collaboration_desc: "Без російських колаборантів Республіка не працюватиме: вони тримають бюрократію й поліцію нової держави, та їхній суспільний статус нечіткий.\n\nУзаконьмо їх: приймемо більше росіян на державну службу й закріпимо їхні права. Найманці бурчатимуть, але хіба Республіка не є державою росіян, створеною ними й для них?"
 
 MAG_WA_prioritize_the_mercenary_state: "Надати перевагу Державі найманців"
 MAG_WA_prioritize_the_mercenary_state_desc: "Хто посміє паплюжити найманців, що відгукнулися на заклик Вербелла й були з ним від початку? Без цих хоробрих піонерів не було б Республіки Західна Аляска - маяка свободи серед диктатур.\n\nЗакличемо ще більше бездомних у власних країнах і дамо їм причину жити та воювати. Місцевим і колаборантам не подобається? Як каже Вербелл, до біса їх. Для перемоги компромісів не буде."
 
 MAG_WA_by_the_dawns_early_light: "У ранньому світлі зорі"
 MAG_WA_by_the_dawns_early_light_desc: "Нове сонце сходить над спустошеною Росією. Землі комунізму й фашизму пізнають справедливу, лагідну, але тверду руку. Сполучені Штати Росії та сестринська республіка за протокою рятують російський народ. Демократію принесе людина, якій усі мають дякувати: Мітчелл Вербелл III.\n\nУ маґаданському палаці він весело п'є вино. На заході - Центральний Сибір, сильніший за всіх попередніх ворогів. Та Вербелл не боїться: перед переважною силою крізь віки лунатиме девіз Республіки - libertas vos liberabit."

 ### West Alaska regional economy tree ###
 MAG_WA_funding_our_endeavors: "Фінансування наших починань"
 MAG_WA_funding_our_endeavors_desc: "Наш різношерстий загін найманців і солдатів-невдах здійснив те, що аналітики називали «нездійсненним» і «непрактичним»: тепер російський Далекий Схід наш за правом завоювання. Та президент Вербелл III не збирається спочивати на лаврах і воюватиме, доки вся Росія не стане нашою.\n\nДля цього негайно потрібні гроші. Захоплення величезних територій відкрило безліч способів профінансувати майбутні битви, а незліченні воєнні трофеї досі лежать нічиїми. Так чи інакше, ця занедбана діра сплатить усе до копійки."
 
 MAG_WA_woe_to_the_vanquished: "Горе переможеним"
 MAG_WA_woe_to_the_vanquished_desc: "Наших пихатих ворогів повалено, і тепер їхні скарби наші! Безцінні реліквії Романових, конфісковані статки в колишніх оплотах РФП та експропрійоване майно Комуністичної партії - усе це чекає, коли ми його заберемо.\n\nНаші хлопці знову вирушать по те, що належить їм по праву, - силою, якщо доведеться. А тоді пустимо здобич у діло. Колишнім власникам вона все одно вже ні до чого! Треба ж подбати, щоб усе це не потрапило до чужих рук..."
 
 MAG_WA_open_for_business: "Відкриті для бізнесу"
 MAG_WA_open_for_business_desc: "Від розпаду Совєтського Союзу Росія була величезною чорною плямою на карті. Воєводи не прагнули зв'язків із зовнішнім світом, тож міжнародна торгівля повільно й безславно померла. Президент Вербелл добре знає ціну вільного ринку й вважає, що настав час повернути його до Росії.\n\nЗа прикладом американських партнерів ми запровадимо політику відкритих дверей у міжнародній торгівлі. Іноземним компаніям запропонують оселитися на наших берегах, оживити молоду економіку й створити тисячі робочих місць. Природно, деякі компанії будуть рівнішими за інші."
 
 MAG_WA_seize_the_arsenals: "Захопити арсенали"
 MAG_WA_seize_the_arsenals_desc: "Армія росте й потребує зброї та набоїв. На щастя, нам доступні величезні запаси колишніх далекосхідних воєвод. Зброя припадає пилом на складах і в покинутих арсеналах по всій країні; її треба зібрати, щоб кожен солдат удачі отримав гвинтівку.\n\nЧимало зразків застарілі, але це не страшно. Наші люди звикли обходитися тим, що мають, і не відкинуть гвинтівку без модних витребеньок сучасних армій. Поки що користуватимемося доступним."
 
 MAG_WA_cautious_reinvestment: "Обережне реінвестування"
 MAG_WA_cautious_reinvestment_desc: "Далекий Схід знекровлено, а наші скарбниці переповнені здобиччю, видобутою з кісток переможених ворогів. Тепер нудна частина: вирішити, що з нею робити. Треба діяти розумно й обережно вкладати кошти - та куди саме?\n\nМожна розширити політику «відкритих дверей» з ОВН і запрошувати іноземний капітал. Або ж зосередитися на власних силах: розвивати інфраструктуру й промисловість. Грошей обмаль, тож усидіти на двох стільцях не вийде."
 
 MAG_WA_an_open_door_policy: "Політика відкритих дверей"
 MAG_WA_an_open_door_policy_desc: "Серед усіх потенційних закордонних партнерів найближчі до наших інтересів Сполучені Штати. Президент Вербелл, сам громадянин Америки, має безліч зв'язків в ОВН, тож справедливо надати західним друзям статус привілейованого партнера.\n\nСтарі добрі США не знайдуть охочішого торгового партнера. Від Іркутська до Маґадану американські компанії зможуть освоювати нові ринки, і виграють обидві економіки."
 
 MAG_WA_invite_american_companies: "Запросити американські компанії"
 MAG_WA_invite_american_companies_desc: "Щоб американські компанії вступили в гру, мало просто відчинити двері. Закони треба пристосувати до більш... сприятливого для бізнесу середовища: знизити податки великому бізнесу й скасувати совєтські обмеження, що заважають корпораціям.\n\nПриховані по країні прихильники комуністів здіймуть галас, але переваги варті будь-якої ціни. Американські компанії матимуть карт-бланш вести справи як заманеться - доки ми отримуємо свою частку."
 
 MAG_WA_contracts_and_connections: "Контракти та зв'язки"
 MAG_WA_contracts_and_connections_desc: "Зусилля переконати партнерів з ОВН дали плоди: вони нарешті відкрили справу в Західній Алясці. Тепер треба втримати їх тут. Було б прикро, якби вони передумали після всього витраченого на їхнє залучення.\n\nНа щастя, зв'язків президентові не бракує. Він особисто працюватиме з компаніями, заохочуватиме їхню співпрацю й водночас зв'яже контрактами, що юридично зобов'яжуть вести справи в нашій країні. Тоді пізні сумніви вже нічого не змінять..."
 
 MAG_WA_a_most_dependable_partner: "Найнадійніший партнер"
 MAG_WA_a_most_dependable_partner_desc: "Бізнесмени й капіталісти скрізь однакові: слизькі покидьки, які шукають легкого заробітку й не переймаються, кого обдурять. Та зараз нам треба заохочувати бізнес, а отже - мати з ними справу.\n\nКращого партнера за Західну Аляску вони не знайдуть. Отримають усе, чого попросять, доки уряду ніщо не загрожує. Їхні вкладення поженуть промисловість уперед, а економіку перетворять на нестримну машину. Росія колись боронила сентиментальні ідеали на кшталт соціалізму, але Росія президента Вербелла буде зовсім іншим звіром."
 
 MAG_WA_what_their_laws_forbid_we_shall_give: "Ми дамо те, що забороняють їхні закони"
 MAG_WA_what_their_laws_forbid_we_shall_give_desc: "На жаль, американські керманичі поступилися тискові ледачих і самовдоволених та законами й нормами скували підприємливість найвидатніших людей. Ми запропонуємо землю, де Комісія з цінних паперів далеко, де немає надокучливих адвокатів, а всі правила встановлюють ящик зброї та валіза грошей. Найсміливіші ковбої з Волл-стріт стануть королями - чого ще бажати?"
 
 MAG_WA_a_taste_of_american_capitalism: "Смак американського капіталізму"
 MAG_WA_a_taste_of_american_capitalism_desc: "Росія була домом для безлічі ідеологій і систем: комунізму, соціалізму, фашизму, монархізму, самодержавства й навіть хибної спроби створити Царство Боже на землі. Усіх цих фанатиків і мрійників розчавила дійсність.\n\nМи запровадили систему, здатну вижити в суворих сибірських пустках: чистий капіталізм. На російському Пограниччі, де зазнали краху всі філософії, американський долар встановив свій прапор - так само, як за протокою."
 
 MAG_WA_the_wealth_of_siberia: "Багатства Сибіру"
 MAG_WA_the_wealth_of_siberia_desc: "Чим ми відрізняємося від перших американців? Як і вони, ми покинули осіле життя й відкинули все. Ми шукаємо нового буття в дикій далекій землі, звівши курки пістолетів, мов ковбої до нас. Ми - сини каліфорнійських золотошукачів, поселенців Орегонського шляху, горян Скелястих гір і ветеранів Громадянської війни, що взяли зброю й подалися на Пограниччя. Назад не повернемо.\n\nМи лишаємося в Сибіру. Мусимо заволодіти багатствами цієї неосяжної землі - потом, кров'ю та рукостисканнями."
 
 MAG_WA_putting_the_collaborators_in_charge: "Поставити колаборантів на чолі"
 MAG_WA_putting_the_collaborators_in_charge_desc: "Ми чужинці в чужій землі й не можемо самі правити Сибіром. Без місцевих росіян керувати державою неможливо: їхній досвід і знання краю незамінні. Дозволивши їм керувати економічним розвитком, ми одним пострілом уб'ємо двох зайців: забезпечимо їхню вірність і допомогу в побудові нової економіки.\n\nКолаборанти знають, де найкращі родовища, куди вкладати, чого уникати і як підтримувати все навіть лютої зими. Найманці й американські радники вміють керувати армією та урядом, але не сибірською економікою. Дозволивши росіянам робити те, що вони вміють найкраще, виграємо всі."
 
 MAG_WA_and_the_locals_to_work: "А місцевих - до праці"
 MAG_WA_and_the_locals_to_work_desc: "Населення впадає в апатію. Воно бачить у Вербеллі загарбника, що завойовує Росію заради власної вигоди й експлуатує її землю та людей в американських інтересах. Люди не хочуть працювати на країну, до якої не причетні. Треба показати, як вони помиляються: праця зміцнює державу, держава - Росію, а Росія - їх самих.\n\nЯкщо цього замало, нагадаємо: вони вже не живуть у соціалістичному пеклі, що пестить ледарів. Хочуть їсти - потрібні гроші, а гроші треба заробити. Якщо й це не допоможе, покараємо кількох найзухваліших саботажників для науки іншим. Росіянам час повертатися до роботи."
 
 MAG_WA_informants_on_every_corner: "Інформатори на кожному розі"
 MAG_WA_informants_on_every_corner_desc: "Передбачуваний недолік опори на місцевих - зростання саботажу й опору. Росіяни знають, що потрібні нам, і недоброзичливці спробують цим скористатися. На їхню біду, чимало співвітчизників люблять нас або принаймні готові вдати любов за гроші. Вірність землякам добра, та рахунків не сплатить; інформація - може.\n\nШирока мережа інформаторів і колаборантів дозволить стежити за населенням і виявляти порушників спокою. Більшість - звичайні дисиденти й буркуни, але найнебезпечніших підбурювачів ми помітимо завчасно й належно знешкодимо. Без ватажків саботажники швидко вгамуються."
 
 MAG_WA_information_trade: "Торгівля інформацією"
 MAG_WA_information_trade_desc: "Мережу інформаторів створили заради виживання й придушення назрілого заколоту. Та коли невдоволення спало, а люди повернулися до праці, ми знайшли їй прибутковіше застосування. Доповіді з кожної галузі дають урядові майже неперевершене розуміння економіки: квоти, щоденний випуск, внутрішні зміни - і ми не марнуватимемо цих знань.\n\nОдні галузі важливіші за інші. Інформатори допоможуть збройним заводам і ресурсним компаніям досягти найбільшого випуску. Лояльним власникам інших підприємств теж можна надати інформаційну перевагу над менш надійними конкурентами. Звісно, за певну ціну."
 
 MAG_WA_a_respectable_distance: "На пристойній відстані"
 MAG_WA_a_respectable_distance_desc: "Коли Вербелл обрав розвиток Сибіру замість американських інвестицій, його називали дурнем і божевільним, що будує власне приречене королівство з нічого. Як же вони помилялися! Партнерство уряду Вербелла з лояльними росіянами принесло Сибірові процвітання, і майбутнє світліше, ніж будь-коли.\n\nВід Іркутська до Камчатки Сибір виробляє більше, ніж здавалося можливим. Ресурси пливуть з портів, а багатство - до них. Економіку захищено від ринкових потрясінь і саботажу; далекосхідники продуктивно працюють і поволі визнають, що наше правління не таке вже й погане. Комунізм і фашизм підвели Сибір. Капіталізм приведе його до нової золотої доби."
 
 MAG_WA_connecting_our_outposts: "З'єднати наші застави"
 MAG_WA_connecting_our_outposts_desc: "Росія - велика країна.\n\nНа довгих ґрунтових дорогах Далекого Сходу вантажівка легко зникає: невблаганна природа, бандити, голодні біженці, рештки розбитих ворогів і звичайні поломки раз у раз гублять вантажі.\n\nМи не можемо втрачати зброю для військ або, ще гірше, долари. Тому треба поліпшити інфраструктуру, міцніше охопити край і прокласти мережу зв'язку між розкиданими позиціями."
 
 MAG_WA_from_a_backwater_to_a_hub: "Від глушини до осередку"
 MAG_WA_from_a_backwater_to_a_hub_desc: "Ми контролюємо останній вільний порт Росії, але багатство й інвестиції ззовні течуть лише цівкою. Маґадан, хоч і життєво важливий для Сибіру, у світовому масштабі - селище. Щоб привабити світовий бізнес, потрібен порт, гідний уваги світу. Маґадан може ним стати, але потрібні вкладення.\n\nНевдовзі Маґадан стане воротами до Росії, новим Владивостоком. Кораблі зі США, Канади, Південної Америки й Австралії прибуватимуть торгувати. Перетворити колишній китобійний порт на центр світової торгівлі нелегко й недешево, але це нас ніколи не зупиняло."
 
 MAG_WA_a_brand_new_market: "Цілком новий ринок"
 MAG_WA_a_brand_new_market_desc: "Інвестиції окупилися. Щодня до маґаданської гавані заходить більше кораблів із товарами з усього світу, провіщаючи добу сибірського процвітання. Поки порт розширюється, дедалі більше країн бачить у нас можливість торгівлі й збагачення. Маґадан нарешті стає тим, чим мав бути: головним осередком тихоокеанської торгівлі.\n\nНе можна спочивати на лаврах. Ми торгуємо з Вільним світом Тихоокеанського регіону, але можемо простягнути руку далі. Нас кличуть порти Європи й Африки: від Стокгольма до Кейптауна потенційні партнери чекають, що запропонує Сибір. Треба їм показати."
 
 MAG_WA_back_in_the_game: "Знову в грі"
 MAG_WA_back_in_the_game_desc: "Світ звик вважати Сибір глушиною, крижаною пусткою для совєтських дисидентів. Колись так і було. Ще кілька десятиліть тому Далекий Схід був тисячами кілометрів лісу й тундри, за які билися нікому не потрібні воєводи. Під проводом Вербелла він став краєм розкритих можливостей.\n\nСибірські міста квітнуть уперше за десятиліття, а деякі - взагалі вперше. Країна багатіє завдяки торгівлі, шахтам і фабрикам. Перед нами початок справжнього економічного дива: найбільший і найменш населений край Росії впевнено стає найбагатшим."

 ### West Alaska regional military tree ###
 MAG_WA_in_defence_of_the_republic: "На захист Республіки"
 MAG_WA_in_defence_of_the_republic_desc: "Ми перемогли фашистів, комуністів і фанатиків та опанували російський Далекий Схід, але новій державі досі загрожує небезпека. На заході - решта Росії, чиї правителі прагнуть нас знищити; на півдні - Японія та її маріонетки, занепокоєні нашою відданістю свободі й зв'язками зі США; усередині кордонів - незліченні дисиденти й революціонери. Не можна втрачати пильність.\n\nОдні пропонують армію з лояльних росіян, інші - ще більше спертися на найманців, які привели нас до влади. Та всі згодні: військо треба розширити й удосконалити. Ми вже не володіння воєводи, а справжня нація, і армія має це відображати."
 
 MAG_WA_counter_insurgency_units: "Протиповстанські підрозділи"
 MAG_WA_counter_insurgency_units_desc: "Наше військо завоювало Східний Сибір, але пристосоване до фронту, а не малих партизанських воєн. Комуністичні й фашистські ополчення беруться до зброї, чинять теракти й нападають на гарнізони. Без дій армію може захлеснути ворог, до якого вона не готова.\n\nСуворий сибірський краєвид ідеальний для малих повстанських груп. Треба створити частини, призначені полювати на заколотників і терористів. Найманці, що засвоїли досвід Індонезії та Південної Африки, очолять елітні групи й винищать усіх радикалів, які виступлять проти нас."
 
 MAG_WA_expand_cheryomushki_airbase: "Розширити авіабазу Чєрьомушкі"
 MAG_WA_expand_cheryomushki_airbase_desc: "Найбільша загроза лежить на заході, у промисловому Центральному Сибіру. Новосибірск ще між війнами став осередком російської авіації. Коли край об'єднається й рушить назовні, ми станемо першою ціллю, а наші жалюгідні повітряні сили не готові зустріти очікувану армаду.\n\nСпершу розширимо бази. Найбільші з них - совєтські рештки з кількома недбалими добудовами. Особливий потенціял мають Чєрьомушкі на захід від Чіти: досить далеко від фронту для безпеки, але досить близько, щоб пілоти встигали до бою. Вони стануть новим штабом авіації."
 
 MAG_WA_the_west_alaskan_navy: "Західноаляскинський флот"
 MAG_WA_the_west_alaskan_navy_desc: "У війні за Центральний Сибір флот мало допоможе, але довге узбережжя й морські загрози ігнорувати не можна. Після розпаду Совєтського Союзу Охотське море стало осередком піратства; найгірші часи минули, та декотрі пірати ще діють. На півдні лежить Японська імперія - найсильніша морська держава світу, з якою в нас холодні стосунки. Ми не здолаємо її панування, але й не віддамо море без бою.\n\nСтворимо невеликий, сучасний, боєздатний флот. Узимку він стоятиме в порту, а решту часу переважно патрулюватиме узбережжя, проте стане могутнім символом відродження Росії й нашої рішучости створити державу, здатну себе захистити."
 
 MAG_WA_modernization_and_standardization: "Модернізація та стандартизація"
 MAG_WA_modernization_and_standardization_desc: "Війна змінилася. Часи воєвод, наївних ідеологів і бандитів минули. Далі ми битимемося з досвідченими бійцями й організованими дивізіями, тож армія має стати злагодженою машиною.\n\nРізношерстий гурт найманців, чорносорочечників і шукачів пригод стане сучасними солдатами із сучасною зброєю та спорядженням. Поглиблена підготовка дасть контроль над логістикою, зв'язком, психологією та полем бою. Хто контролює поле бою, той контролює Росію."
 
 MAG_WA_encourage_local_recruitment: "Заохотити місцевий набір"
 MAG_WA_encourage_local_recruitment_desc: "Знайти охочих убивати за гроші неважко; знайти охочих за гроші помирати - зовсім інша річ. А в наступних війнах смертей буде вдосталь.\n\nДехто з наших хлопців збере речі й поїде додому, а ті, хто лишиться, самі не стримають прийдешнього ворога: нас переважають числом, відріжуть і оточать. Найкращі бійці мають навчати місцевих за нашими стандартами й заповнювати прогалини між добірними частинами, а ударні групи битимуть ворога в найболючіше місце."
 
 MAG_WA_heia_safari: "Гайя сафарі!"
 MAG_WA_heia_safari_desc: "Що дає чисельність, коли троє сміливців на джипі женуть цілий взвод місцевих до їхніх хатин? Легкість, із якою ми розтинали їхні сили від першого дня, доводить: це не наші люди. Вони вдають солдатів, але нас не обдурити. Нам потрібні справжні воїни, і ми знаємо, де їх шукати.\n\nВ африканській глушині плоть і кров стають сталлю, а вербувальники знайдуть готових померти за золото. Янкі й німці, бури й британці пліч-о-пліч рушать у криваву сутичку. Гладіатори-мандрівники оголять мечі й стануть до лав Західної Аляски."
 
 MAG_WA_a_russian_national_guard: "Російська Національна гвардія"
 MAG_WA_a_russian_national_guard_desc: "Не зациклюйтеся на книжках. Збагніть зміст слів, тоді вирішуйте. Замість обмежувати себе американською доктриною, ми знайдемо власний план і власне майбутнє.\n\nМи воюємо в чужій землі, ведучи найекзотичніше військо планети. Тут не спрацює модель американської піхотної дивізії з усією промисловістю дядька Сема за спиною й хлопцями з одного мічиганського району. Треба виробити власну думку - сибірський спосіб війни там, де землі вдосталь, а всього іншого бракує."
 
 MAG_WA_american_ingenuity: "Американська винахідливість"
 MAG_WA_american_ingenuity_desc: "Будувати майбутнє й берегти минуле - те саме. Не можна забувати, хто ми й звідки. Усупереч усім шансам нас привели сюди не чудеса й не надприродні сили, а передові технології.\n\nМи воюватимемо по-американськи, спираючись на досвід УСС і ЦРУ та поєднуючи техніку з майстерністю, щоб стати королями Росії."
 
 MAG_WA_a_gateway_to_russia: "Ворота до Росії"
 MAG_WA_a_gateway_to_russia_desc: "Завдяки портові майже апокаліптичний Маґадан став подобою цивілізації серед далекосхідної пустки.\n\nЦі ворота до Росії - один із найцінніших наших ресурсів: через них надходить допомога світу, недоступна багатьом іншим краям. Порт треба використати сповна.\n\nТа Маґадан досі малий і працює лише частину року. Подальше будівництво пришвидшить перевезення спорядження й товарів та забезпечить безперервне постачання."
 
 MAG_WA_the_military_armaments_corporation: "Військова корпорація озброєнь"
 MAG_WA_the_military_armaments_corporation_desc: "Військова корпорація озброєнь, або MAC, - особистий задум Вербелла. В Америці вже є кілька великих збройових компаній, і для ще однієї, влаштованої на його смак, місця немає. У Росії цієї проблеми немає. MAC зможе розкрити потенціял і налагодити впорядковане виробництво якісної військової зброї.\n\nНайбільше Вербелл тішиться новим пістолетом-кулеметом MAC-10, до розробки якого долучився ще до прибуття в Росію і який масово вироблятимуть у Республіці Західна Аляска."
 
 MAG_WA_construct_new_training_centers: "Збудувати нові навчальні центри"
 MAG_WA_construct_new_training_centers_desc: "Щоб прийняти росіян до армії, треба збудувати нові навчальні центри. Вічно покладатися лише на найманців не можна: місцеві росіяни мають стати кістяком війська.\n\nІз селян, мисливців і рибалок викуємо загартованих бійців, кращих за будь-яких інших у Росії. Усі звикнуть до служби вищій справі й захисту Республіки!"
 
 MAG_WA_adapt_and_improvise: "Пристосуватися й імпровізувати"
 MAG_WA_adapt_and_improvise_desc: "Суворі сибірські простори, переважно безлюдні, важкі для бою. Треба вчитися в місцевих пересуватися цією землею й пристосувати тактику. Найманці мусять бути готові воювати в такій пустці.\n\nСолдатів також навчатимуть імпровізувати, коли звичні плани не діють. Разом із підготовкою на суворій місцевості це належно підготує армію до сибірської зими."
 
 MAG_WA_a_haven_of_our_own: "Власний прихисток"
 MAG_WA_a_haven_of_our_own_desc: "Найманці довго були волоцюгами й міжнародними вигнанцями через непопулярний фах. Мало хто обрав цей шлях, а багато хто вже не може з нього зійти. Республіка Західна Аляска - більше, ніж російська держава. Ми вільні від застарілих догм минулого. Бурі XX століття лишили без держави й розкидали незліченних солдатів. Єдиними умовами громадянства стануть особисті заслуги, вишкіл і здібності. Вербелл наймає - назавжди. Нехай це буде домівка бездомним, гнаним бурею - до мене..."

 ### West Alaska regional diplo tree ###
 MAG_WA_the_question_of_recognition: "Питання визнання"
 MAG_WA_the_question_of_recognition_desc: "На подив міжнародної спільноти, Республіка Західна Аляска охопила весь російський Далекий Схід. Щоб вижити в довгій перспективі, нова держава частково залежатиме від міжнародних зв'язків і визнання.\n\nТож пошлемо найкращих дипломатів домагатися визнання світових держав. Сподіваймося, це спрацює."
 
 MAG_WA_contacts_on_the_hill: "Зв'язки на Капітолійському пагорбі"
 MAG_WA_contacts_on_the_hill_desc: "Час відновити стару дружбу. Деякі бойові товариші з часів Бірми й Китаю, що проливали поруч із нами кров, піт і сльози, тепер посідають високі місця на Капітолійському пагорбі.\n\nСпільне минуле допоможе зміцнити становище Республіки у Вашинґтоні. Маючи президента на своєму боці, ми можемо розраховувати на сталий потік американських товарів."
 
 MAG_WA_under_the_table: "Під столом"
 MAG_WA_under_the_table_desc: "Ми не знаряддя американського уряду чи когось іншого!\n\nВоювати ми вміємо, але не є бездумними одноразовими пішаками генералів і вождів у кабінетах із кондиціонерами. Та Пентаґон нас однаково не визнає.\n\nМи діятимемо таємно, без офіційного зв'язку з Ленґлі чи кимось іншим. Платня надходитиме на невідстежувані офшорні рахунки, зброя - від десятка постачальників, а клієнти зможуть цілком заперечувати причетність до наших операцій."
 
 MAG_WA_a_group_above_nations: "Група над націями"
 MAG_WA_a_group_above_nations_desc: "Ми зречемося своїх країн. Полишимо батьківщини й станемо єдині із Землею. Ми над націями, філософіями та ідеологіями. Ідемо туди, де потрібні, і воюємо не за уряд чи країну, а за себе. Причина не потрібна: ми битимемося, бо потрібні. Станемо стримувальною силою для тих, хто готовий платити.\n\nМи - Солдати без кордонів, і наша мета визначена нашою добою. Якщо клієнт накаже, станемо революціонерами, вбивцями, терористами й злочинцями. Так, можливо, всі ми прямуємо до Пекла - але яке місце пасує нам краще?\n\nЦе наш Рай і наше Пекло.\n\nЦе Західна Аляска."
 
 MAG_WA_over_the_table: "Над столом"
 MAG_WA_over_the_table_desc: "Будьмо чесні: ніхто не повірить, що Ленґлі не доклало руки до нашого сходження. «Колишній» агент ЦРУ захоплює шмат Росії? Сюжет фантастичного твору або один із найсміливіших планів Вашинґтона - а може, ми й є таким планом.\n\nВонсяцкій не міг би вільно діяти по всьому Тихому океану, наймати нас і купувати стільки зброї без друзів у Вашинґтоні, що віднаджували ФБР. Вороги однаково нам не повірять, то навіщо ховатися?\n\nМи американці й цього не соромимося."
 
 MAG_WA_from_america_with_love: "З Америки з любов'ю"
 MAG_WA_from_america_with_love_desc: "Наша сестринська республіка, Сполучені Штати Америки, мов любляча сестра, надсилає ресурси для поширення свободи через Беринґову протоку. Чи не кожен корабель у Маґадані несе любі нам Зорі й смуги. Ця допомога тримає молоду республіку на плаву, і ми не заперечуємо проти панування американської торгівлі.\n\nМісцеві росіяни не в захваті й висувають сміховинні заяви: «Російський бізнес гине» або «Ми не дамо себе колонізувати». Вони просто ще не звикли до свободи по-американськи. Згодом звикнуть. Бути на утриманні наймогутнішої наддержави - найкраща можлива угода."
 
 MAG_WA_expanding_our_horizons: "Розширити обрії"
 MAG_WA_expanding_our_horizons_desc: "Сполучені Штати - наш найбільший союзник і люба сестринська республіка, але не єдиний торговий партнер. Нам доступна вся ОВН!\n\nКанада! Нова Зеландія! Австралія! Навіть Англія, якщо її режим привітний. Надішлемо до цих великих демократій достойників укладати вигідні угоди.\n\nЯкщо прагнемо стати сестрою Америки, мусимо дружити з її союзниками. ОВН - останній бастіон свободи в жорстокому світі й взірець для нашої республіки. До того ж усі вони заможні й за добрих стосунків можуть допомогти нам більш... матеріально."
 
 MAG_WA_a_global_reach: "Глобальне охоплення"
 MAG_WA_a_global_reach_desc: "Ми будемо потрібні малим і великим країнам Сходу й Заходу, які ще не мають наших військових спроможностей. Наші групи можуть не лише створити їх, а й застосувати, і нам нічого соромитися брати належну платню.\n\nЗ мережею фінансистів, пілотів, інформаторів і передусім псів війни кожен платоспроможний клієнт може за одну ніч доставити «Лірджетом» загін спецпризначенців у потрібне місце. Західна Аляска стане найбільшим у світі постачальником мандрівної збройної сили."
 MAG_WA_a_global_reach_tt: "Ми зможемо відправляти 2 дивізії найманців у конфлікти по всьому світі!"
 
 MAG_WA_supplying_wetwork: "Постачання мокрих справ"
 MAG_WA_supplying_wetwork_desc: "Є журналіст, якого хочете прибрати, але духу бракує? Він дошкуляє вдень і вночі й доводить до сказу? Маєте проблеми з прем'єр-міністром і зірваною угодою? Він крутить оборудки зі швейцарськими банками, і гроші починають зникати? Маєте проблему, з якою ніхто не впорається? Ви знаєте, де нас знайти.\n\nПідніміть слухавку. Ми завжди вдома. Дзвоніть будь-коли. Ми владнаємо що завгодно: зайдемо й вийдемо, і ніхто не дізнається, що нас найняли ви."
 
 MAG_WA_denouncing_the_enemies_of_freedom: "Засудити ворогів свободи"
 MAG_WA_denouncing_the_enemies_of_freedom_desc: "Співпраця з Німеччиною та Японією не цілком виключена, але ми союзники Америки, а отже маємо обов'язок: обстоювати свободу й боротися з фашизмом у всіх його формах.\n\nНімеччина та Японія - вороги Америки, а отже й свободи. Їхні держави за природою гнобительські. Ми засудимо їх та їхні мерзенні злочини, показавши світові, що воюємо за свободу й справедливість. Це зміцнить нашу репутацію в ОВН і забезпечить її підтримку в боротьбі за майбутнє Росії."
 
 MAG_WA_an_international_redoubt: "Міжнародний оплот"
 MAG_WA_an_international_redoubt_desc: "Республіка Західна Аляска здобула світову репутацію. Для ОВН ми не лише законна держава, а й діловий партнер. Мокрі справи. Кровопролиття. Відверто кажучи - убивства. Наша мережа дозволяє те, про що інші держави й не подумають.\n\nКоли країні потрібна брудна робота чи треба висмикнути болючу скалку, ми будемо поруч. Ми станемо Солдатами без кордонів, militaire sans frontieres - міжнародним редутом, готовим виконати брудну роботу й відбілити репутацію будь-якої країни, якщо вона сплатить ціну."
 MAG_WA_an_international_redoubt_tt: "Ми зможемо відправляти ще 1 дивізію найманців!"

 ### West Alaska superregional tree ###
 MAG_WA_fortis_fortuna_adiuvat: "Fortis Fortuna Adiuvat"
 MAG_WA_fortis_fortuna_adiuvat_desc: "«Фортуна любить сміливих» - гасло, що століттями вело життя найманців. Вони - слабша сторона, що воює за монету в чужих війнах; солдати удачі, яких богиня веде від битви до битви в гонитві за славою й багатством. Вона мінлива: колись найманців цінували як воїнів, на них поставали імперії й гинули нації, аж поки національні армії не зробили їх зайвими. З постанням Сполучених Штатів Сибіру вона, схоже, подарувала своїм послідовникам дім.\n\nЗахідні росіяни тримають війська біля наших кордонів і переважають спорядженням, дивізіями та людьми. Та шанси завжди були проти нас. Фортуна любить сміливих, і Вербелл іще не дограв."

 MAG_WA_pacification_of_the_great_giant: "Упокорення великого велета"
 MAG_WA_pacification_of_the_great_giant_desc: "Центральний Сибір має довгу історію. Імперія колонізувала його століття тому, а Сибірський план перетворив край на новий промисловий центр Росії. Разом із цим розвинулися політичні ідеології, майже невідомі решті західного світу. У Канську досі живий нібито давно мертвий анархізм. Новосибірск і Томск, цілковиті протилежності, лежали за два кроки один від одного. Для історика це цікаво, для адміністратора Республіки - кошмар.\n\nЩоб упокорити Великого Велета, Республіка Західна Аляска застосує батіг і пряник. Нам потрібно багато колаборантів. Хто з нами - приєднається; решта стане повстанцями, яких придушать в ім'я закону й порядку."

 MAG_WA_a_new_siberian_economy: "Нова сибірська економіка"
 MAG_WA_a_new_siberian_economy_desc: "Держави Центрального Сибіру впроваджували різні економічні пляни відповідно до своєї політики й мали різний успіх. Та ніхто не спробував американського капіталізму. Найближче підійшла Новосибірско-Алтайська федерація, але її поклоніння корпораціям обурило б навіть найзавзятішого американського прихильника свободи. Економічна свобода має йти поруч із особистою - для Вербелла це завжди було американським шляхом.\n\nЩоб Сполучені Штати Сибіру процвітали, економіку треба відродити на американських засадах. Сестринська республіка за Беринґовою протокою багато чого нас навчила, а її добробут бачить увесь світ. Розсудливо й природно вчитися в американців."

 MAG_WA_life_liberty_and_the_pursuit_of_happiness: "Життя, свобода і прагнення до щастя"
 MAG_WA_life_liberty_and_the_pursuit_of_happiness_desc: "Це три невідчужні права кожної людини, як проголошує американська конституція. Записані в установчому документі Сполучених Штатів Америки, вони стали приказкою майже кожного американця. Ці права вивели Америку до становища найбільшої світової сили, високо над Німеччиною та Японією: єдиного яскравого світла свободи у світі темряви. Сибірська конституція має спиратися на ті самі принципи.\n\nПерше - життя: право жити має кожен. Друге - свобода: через свободу підприємництва ми дамо особисту свободу кожному сибірцеві на ринку. Третє - прагнення до щастя: захистимо приватну власність і послабимо деякі закони для тих, хто стрімголов женеться за щастям. Так Сполучені Штати Сибіру стануть гідною сестрою країни за Беринґовою протокою."

 MAG_WA_expanding_the_federal_system: "Розширити федеральну систему"
 MAG_WA_expanding_the_federal_system_desc: "Коли наш дорогий провідник одноосібно вирішив федералізувати державу за зразком США, ми зробили крок до радикального, хоч і світлого майбутнього. Але це майбутнє ще далеко, а назва - не те саме, що практика.\n\nЧас формалізувати федералізацію Сполучених Штатів Сибіру. Америка творила штати за географічними й політичними міркуваннями, та Росія інша. Географію ми врахуємо, але Сибір має численні й дуже різні меншини. Тож штати можна будувати також за культурними та етнічними межами; автономія бурятів і якутів лише прихилить їх до нас."

 MAG_WA_spreading_our_network: "Розширити нашу мережу"
 MAG_WA_spreading_our_network_desc: "Попри перемогу над Центральним Сибіром, ми лишаємося чужинцями, що правлять його народом, а спротив нашій владі досі значний. Ми не винуватимо людей: разючі зміни перевернули їхнє життя. Та співчуття не означає, що ми терпітимемо тліюче невдоволення.\n\nЗнову звернімося по натхнення до американських друзів! Вербелл і кабінет створять Відділ стратегічних служб, або ВСС, щоб викорінювати дисидентів і майбутніх заколотників та «відрадити» їх від дій проти уряду. Зрештою, якщо американці можуть робити це в ім'я свободи, то чому не ми?"

 MAG_WA_a_rejuvenated_civil_service: "Відроджена державна служба"
 MAG_WA_a_rejuvenated_civil_service_desc: "Чужоземці, зайди, свавільні найманці - лише кілька назв, якими росіяни кличуть нашу адміністрацію. Їх можна зрозуміти: десятиліття політичного безладу й гноблення породили недовіру до будь-якої нової влади, надто очоленої громадянином Америки.\n\nТа їхня недовіра не означає, що вони нам не потрібні. Більшість наших надійних людей - найманці, солдати в душі, а добрий солдат іще не бюрократ. Серед численних переможених суперників є золота жила здібних адміністраторів, готових до набору в наші Сполучені Штати. А золоту жилу слід розробляти до повного виснаження."

 MAG_WA_the_art_of_living_dangerously: "Мистецтво небезпечного життя"
 MAG_WA_the_art_of_living_dangerously_desc: "Російський Далекий Схід багатий на ресурси й меншою мірою має непогану промислову базу, але йому геть бракує людности. Центральний Сибір трохи кращий, та не зрівняється з величезними масами росіян на заході. Армія з переважно іноземних найманців, не здатна швидко стати масовою, змусила командування гостро відчути хиткість нашого становища.\n\n«Не бійтеся, - запевнив сміливий провідник, - небезпечно жити - теж мистецтво». Вербелл каже, що величезна армія не потрібна. Найманці добре служили досі - чому це має змінитися? Наше військо - маяк елітарности й ефективности серед російської тундри, і на цьому треба зіграти. На Сході не буде кращої та дієвішої бойової сили за сміливців Сполучених Штатів Сибіру."

 MAG_WA_employment_opportunities: "Можливості працевлаштування"
 MAG_WA_employment_opportunities_desc: "Не таємниця, що іноземні найманці в нас живуть як шляхта: кишені повні здобичі й чесної платні. Для пересічного російського пролетаря, який животіє на фабриці чи фермі, вони здаються знаменитостями й мільйонерами. Досі ми покладалися на чужинців, але прийдешня війна на заході вимагатиме більшого.\n\nЯкщо ми можемо зробити елітного солдата з людини з будь-якого краю світу, то чому не з росіянина? Час відкрити місцевим службу у війську - не лише рядовими, а справжніми елітними бійцями нарівні з прибульцями. Ті, хто ледве виживав у сибірських пустках, стануть ядром нової професійної й украй небезпечної армії."

 MAG_WA_a_new_industry_for_a_new_military: "Нова промисловість для нового війська"
 MAG_WA_a_new_industry_for_a_new_military_desc: "Попередні війни ми виграли не випадково - наша армія була найпрофесійнішою в Росії з величезним відривом. Та останнє зіткнення з новим західним суперником буде зовсім не таким. Він, як і ми, пробивався нагору зубами й кігтями. Він має велику промисловість, численне населення та загартовану роками боїв армію.\n\nПокладатися лише на американське постачання вже непрактично. Вербелл, а з ним і вся адміністрація, дійшов висновку: треба використати російську промисловість, щоб угамувати дедалі більший голод війська до зброї та спорядження."

 MAG_WA_towards_a_sovereign_state: "До суверенної держави"
 MAG_WA_towards_a_sovereign_state_desc: "Наша держава дуже залежить від американської допомоги - не лише зброї та військових припасів, а й коштів, промислових субсидій, хай йому грець, навіть туалетного паперу, що прибуває до Маґадану. Але Мітчелл Вербелл III не американська маріонетка й не має поводитися як маріонетка!\n\nКолись допомога скінчиться, і ми лишимося самі. Треба готуватися. Адміністрація вже неофіційно планує економічну й промислову самодостатність; час затвердити плани й діяти.\n\n«Ну ж бо, Філе! Визнай, так залежати від усього цього небезпечно. Деякі іспанські солдати вже шепочуться, що працюють на прикриття ЦРУ! Маємо ресурси й можливості - час іти власним шляхом»."

 MAG_WA_a_call_to_uncle_sam: "Заклик до дядька Сема"
 MAG_WA_a_call_to_uncle_sam_desc: "...але не поспішаймо. Америка ще може нам допомогти! Росіяни часто зневажають слово «товариш», але наші сестринські республіки - Сполучені Штати Америки й Сибіру, об'єднані боротьбою за свободу, - найсправжнісінькі товариші.\n\nЗвернімося до товаришів у Вашинґтоні, Ленґлі й на Західному узбережжі, звідки допомогу відправляють до далекосхідних портів. Нехай вона плине широким і вільним потоком!\n\n«Мітче, слухай, я тебе розумію. Та навіщо кусати руку, яка годує? Нехай допоможуть нам ще трохи. Це добре і для нас, і для них»."

 MAG_WA_from_a_rabble_to_an_army: "Від наброду до армії"
 MAG_WA_from_a_rabble_to_an_army_desc: "Нелегко було привчити нових місцевих та іноземних новобранців до вимог війська Сполучених Штатів Сибіру. Та поступ напрочуд добрий. Навіть із різким напливом добровольців і місцевих очікувана втрата якости заради кількости виявилася значно меншою! Треба скористатися цим, щоб у потрібну мить Сполучені Штати Сибіру могли й хотіли нести демократію та свободу цією приреченою землею!\n\n«Ну ж бо, Мітче, визнай: вони мали непоганий вигляд».\n\n«Тю, непоганий - дзуськи. Бачив би ти моїх хлопців в Америці. Ото було добре. Та не брехатиму, побачене мене вразило. Росіяни, хай їм чорт, точно вміють розвертатися на місці. Може, ще стануть бодай наполовину добрими солдатами»."

 MAG_WA_wagons_westward: "Фургони - на захід!"
 MAG_WA_wagons_westward_desc: "Що може бути американськішим за яблучний пиріг і бейсбол? Явне призначення. Доктрина - ні, основоположна віра - що сам Бог призначив американському народові поширити своє панування на всю Північну Америку.\n\nЯкщо вони заселили американський Захід і цивілізували його в XIX столітті, то ми, хай йому чорт, зможемо зробити те саме в Росії у XX. Чи судилося Богом нашим відважним солдатам рушити на захід, несучи демократію і свободу? Це знає лише Мітчелл Вербелл III.\n\n«План готовий, Геммінґу?»\n\n«Цілком, босе. За вашим наказом рушимо на захід».\n\n«Гаразд, Ґеррі. Іди - поверни свободу до життя в цій темній землі!»"

 ### West Alaska events ###
 westalaska.1.t: "Радіо Вільний Маґадан - випуск 64"
 westalaska.1.desc: "Сьогоднішній радіоефір почався без проблем. Замість російських патріотичних звуків під неосвоєну мелодію й постійний тріск тепер тихо грав клясичний твір - Ноктюрн Шопена, op. 9 № 2, особливо улюблений деякими найманцями з Харбіна. За кілька хвилин остання нота стихла, і її змінив рівний, стриманий баритон. «Добрий вечір, народе Сибіру», - в російській мові чувся англійський акцент. «Це нове Радіо Вільний Маґадан, недавно визволене від фашистів, які жили тут роками. Якщо ви щойно приєдналися, я ваш ведучий Стівен, також відомий французьким товаришам як Ростбіф», - стриманий сміх. «Веселі хлопці. Якщо ви росіянин або, найманською мовою, місцевий, кличте мене Стрєлоком. Просто й дієво».\n\nКашель. «О, перепрошую», - голос відсунувся від мікрофона, хоча покашлювання ще було чути. «Перепрошую за перерву. Завдяки щедрості нашого добродійника, пана Вербелла, есквайра», - він перейшов на шепіт, - «Есквайр - це важливо!» І продовжив: «Якщо маєте замовлення, надсилайте їх до нашої Маґаданської контори поруч зі старим офісом РФП. А зараз», - зашелестіли папери, - «час пісні Surfin' Safari гурту The Beach Boys. З вами був Стрєлок, або Ростбіф».\n\nЗаграв легкий рок."
 westalaska.1.a: "Принаймні вони професіонали."
 
 westalaska.2.t: "Царський викуп"
 westalaska.2.desc: "Колишній цар усіх Росій сидів на голій бетонній підлозі в'язниці. Грубий, потертий одяг не нагадував колишнього; медалі, вилоги й незаслужена велич зникли, розвіяні, мов білі захисники. Принаймні англомовні вартові жартували з ним і приносили найкращу тюремну їжу: квасолевий суп, кілька скибок хліба й воду. Небагато, але досить.\n\nСьогодні Джек звелів з'їсти все якомога швидше: іде поважний гість, якого не варто злити. Міхаїл відразу знав, хто. У тюремній робі й з їжею найнижчого робітника він усе ще мав імператорську кров. Колись було інакше. Він не мав прав на трон, корона йому не пасувала. І все це через погано приготований стейк.\n\nҐрати дзенькнули. У проході стояли Мітчелл Вербелл і перекладач. Міхаїл хитко підвівся назустріч можливому катові чи рятівникові. «Я розмовляю англійською. Перекладач зайвий».\n\nВербелл відпустив помічника. «Отже, російський цар із британським акцентом? Правда таки дивніша за вигадку». Він посадив Міхаїла на скромне ліжко поруч із нужником.\n\n«Я-я не англієць...» - почав Міхаїл і замовк: перебивати Вербелла нерозумно.\n\n«Пане Романов, це ваше ім'я?» Міхаїл кивнув. «Не знаю, навіщо ви тут, але можу відпустити - звісно, за малу ціну. Кажуть, у вашого батька королівські глибокі кишені».\n\n«С-скільки?»\n\n«Пів мільйона долярів - і відправлю вас до Англії, Австралії, куди хочете».\n\n«У мене нема таких грошей!»\n\n«Тоді, чорт забирай, сподівайтеся, що є в батька». Міхаїл поволі кивнув. «Радий, що ми порозумілися». Вербелл пішов, а в'язниця знову зачинилася."
 westalaska.2.a: "Напевно, краще за смерть."
 
 westalaska.3.t: "Звіти з «Мойсея»"
 westalaska.3.desc: "Ненсі Вейк знала шпигунську справу. У колишньому кабінеті зниклого РФПівця Ніколая Пєтліна вона приймала звіти й видавала накази. Її обов'язок павука - плести мережі інформаторів, зв'язків і шпигунів, ловлячи цінні відомості або стукачів. Цього ранку, освіживши розум гіркою кавою, вона отримала звіт із бази «Мойсей», і той не розчарував: у теці лежали соковиті, цінні дані.\n\nТа від документа віяло отрутою. «Мойсей» бачив рух на півночі, але нічого певного. Стежити за ледве відчутним потоком цивільних до безлюдної півночі було марно й виснажливо. У теці - поспішні нотатки, нечіткі світлини й одне повторюване слово: Отець. Ненсі відкинулася й зважила варіянти. Новий телефон стояв поруч; підняття слухавки змусило б дзвонити апарат у Вербеллівському кабінеті.\n\nБез вагань вона простягнула руку."
 westalaska.3.a: "«Це Вейк. Маю новини»."
 
 westalaska.4.t: "Відгук на заклик"
 westalaska.4.desc: "Сміт дивився на жалюгідний Маґаданський порт - кілька гнилих дощок над холодною солонуватою водою Північного Тихого океану. За океаном лежав рай - США, земля волі, свободи, безмежних просторів і грошей. У Блумфонтейні Сміт бачив Америку на обкладинках журналів і невиразних чорно-білих газетних фото. Війна була бізнесом, і бізнес ішов добре, та він не хотів вічно стріляти в тубільців. Він мріяв осісти в Америці й покласти край мандрівному життю.\n\nПоки в уяві мигтіли дешевий блиск, любовні романи й сяйні міста, до нової Вербеллівської авантюри прибував корабель. Його пасажири, мабуть, мріяли про те саме: тихе місце, де можна насолодитися виграшем життя, що раз у раз грало проти долі й перемагало.\n\nСміт волів би бути на передовій, де дні швидші. Та наказ є наказ, і за нього платять. Треба зустріти солдатів, провести до казарм і містом, допомогти звикнути. Він повторив привітання, жарти й відповіді для надто роздутих еґо.\n\nЗапалив цигарку й затягнувся. Діятиме за обставинами, до біса. Майбутні проблеми - клопіт майбутнього Сміта. Нині він смакував малу розкіш, засміявся з особистого жарту й дивився, як судно поволі наближається."
 westalaska.4.a: "Затишшя перед бурею."
 
 westalaska.5.t: "Зірки та смуги"
 westalaska.5.desc: "«Ти з Америки, хлопче?» - Вербелл бавився обрізаним револьвером Сміта-Вессона. Уже годину заряджав і виймав кулі, крутив барабан і грався запобіжником у кріслі. Дев'ятнадцятирічний помічник намагався відмовити його від, як сказав би боягуз, «необдуманих дій». Вербелл був п'яний, але знав, що, бляха, робить.\n\n«Н-ні, сір», - французький акцент присмачував слова вином, хлібом і круасанами. Вербеллівські думки пливли потоком, особливо п'яні. «Але я читав газети й журнали. Думаю, це чесна країна, принаймні поруч із Францією».\n\nВербелл зареготав. Помічник спершу здивувався, потім образився, та револьверний барабан урвав його. «Журнали не показують цілого. Вони нічого не знають про Америку. Земля вільних, свободи й можливостей. Там є майже все, крім веселощів найманського життя». Він ковтнув віскі й нарешті сховав зброю. «Збирай гроші. Збирай, чорт забирай. Ти молодий - двадцять один, так? Може, знайдеш там дівчину мрії й осядеш на гарній техаській фермі».\n\nПомічник лише кивнув. П'яний Вербелл був джерелом мудрости й насильства, і хлопець тільки всміхався його сміховинній екстраваґантності."
 westalaska.5.a: "«Як скажете, сер»."
 
 westalaska.6.t: "Червоні сутінки"
 westalaska.6.desc: "ЗВІТ ПРО РОЗТИН\n\nОБ'ЄКТ: Ґєнріх Яґода, колишній генеральний секретар Вєрховного Совєту.\n\nЕКСПЕРТ: доктор Йоганн «Ножівка» Браун, німець.\n\nПРИЧИНА СМЕРТИ: вогнепальні поранення, дружній вогонь.\n\nЗМІСТ: Об'єкта знайдено з численними ранами груднини, імовірно завданими рядовим із місцевих росіян. Винуватця віддано під військовий суд і покарано за Тимчасовим військовим кодексом Західної Аляски. Подія сталася після суперечки Ґєнріха Яґоди з рекрутом. Останній був виснажений днем «прибирання лайна НКВД». Проживши за Яґодиного режиму, рядовий хотів дізнатися мотиви його «жорстокого, нелюдського» правління. Засмучений утратою володінь на користь «найманих баламутів», колишній голова президії послався на захист кодексу й освіту, виправдовуючи «надмірності соціялізму».\n\nЦе скінчилося погано. Після короткої інтелектуальної суперечки, яка вкрай дратувала втомленого росіянина, той кілька разів вистрілив у Яґоду зі свого нині вилученого M1911. Оскільки всі задоволені - росіянина покарано, Яґоди нема, - рекомендація експерта така:\n\nРЕКОМЕНДАЦІЯ: негайне поховання або кремація."
 westalaska.6.a: "Sic semper tyrannis."
 
 westalaska.7.t: "Хлопчина"
 westalaska.7.desc: "«Вам зручно, пане Саблін?» - перекладач передав слова роботодавця, що сидів навпроти: зухвалого найманця Мітчелла Вербелла III. Кілька днів тому уряд Західної Аляски присудив колишнього комісара НКВД Валєрія Сабліна до смерти. Тепер він сидів із фактичним диктатором, чия сиґара диміла, мов комини перевантажених фабрик.\n\n«Так, - відповів Саблін якнайрозгубленіше. - Навіщо я тут?» Він чекав, що Вербелл поведе його, мов ягня на забій. Натомість перед ним стояли блискуча тарілка, стейк і срібні прибори, а світлу їдальню осявала люстра.\n\n«Просто мирно повечеряємо як чоловік із чоловіком, - сказав Вербелл. - Останнє прощання». Найманець-офіціянт налив вина. «Сиґару, пане Саблін? Хоча, може, ви ще не вмієте їх курити». Посмішка була без злоби - сталева машкара на лихому обличчі. «Ну ж бо, пане НКВД, вино непогане».\n\n«Дякую, не хочу. Волію терпіти приниження в'язниці, ніж ласку ворога соціялізму».\n\nВербелл засміявся. «Хто сказав, що ви житимете? Вам щонайбільше двадцять три. Поживіть трохи». Кашлянув. «Перед смертю. Їжте». Він вечеряв, не звертаючи уваги на комісара, що не торкнувся тарілки. Саблін пішов так само примирений із долею, хоча гадав, ким найманець є насправді."
 westalaska.7.a: "Безперечно, дивна ніч."
 
 westalaska.8.t: "Солдатська конституція"
 westalaska.8.desc: "Вербелл схилився над столом у кріслі, яке щомиті здавалося то замалим, то завеликим. Голову розривало від найгучнішого похмілля людства - не слід було пити. Ручка ковзала, а зв'язок із дійсністю був не кращим. Відклавши її, він хруснув пальцями й потягнувся, розбудивши лавину болю. Кожен рух голови й ока наче ламав реальність.\n\nПеред ним лежала мати всіх документів, які доводилося писати. У кошмарі чорні чорнильні сліди здавалися перлинами мудрости; інша частина мозку називала їх лайном. Та, яка вважала крісло завеликим, погоджувалася з другою. Іноді треба брехати, щоб правда сяяла, - ще одна дурня.\n\nСтук. «Ви закінчили, сер?» - боязкий французький помічник. Вербелл не відповів: пересохле горло породило б звук, якого не витримає смертний. Хотілося теплої води, але «спершу конституція, сер». Кляті французи та їхні конституції; що вони знають про країни? Дві імперії, три республіки й держава в лапах фашизму.\n\nВін бурчав, скаржився й тремтів, та визнав: це однаково доведеться зробити. На великому аркуші він дійшов лише до «Захисту меншин». День буде довгий."
 westalaska.8.a: "Кабінетним щуром він ніколи не був."
 
 westalaska.9.t: "Сповідь найманця"
 westalaska.9.desc: "Йому дозволили чорну рясу й хрест, давали справжню їстівну їжу навіть після смертного вироку. Отець Алєксандр Мєнь приймав усе з недовірою: людські дари не перевершать Господньої ласки. Він змирився з долею, постив і відмовлявся від ряси заради потертої тюремної одежі.\n\nТа сьогодні його майже під дулом змусили вдягтися: огидний найманець Мітчелл Вербелл III хотів зустрітися й сповідатися. Мєнь не знав навіть, чи той хрещений у православ'ї. Про російське походження говорили, але невже? Він міркував, доки його не привели.\n\n«Мені нічого вам сказати, і сумніваюся в чистоті наміру».\n\n«Ну ж бо, отче, - посміхнувся Вербелл. - Я невіруючий. Хочу поговорити, дізнатися, як Божий чоловік бачить мою кар'єру. Може, навіть дістати благословення. Волію думати, що в молодих пошуках був милосердним і працьовитим у мистецтві війни, завзято користувався Господнім даром вирішувати суперечки насильством». Він погладив револьвер. «Я торговець зброєю - не лише рушницями, а людьми, танками, гарматами, всім для сучасної війни. Я багато грішив і не бачу дороги назад. Може, з вашим благословенням...»\n\n«Ні», - урвав Мєнь.\n\nВербелл не здивувався. «Так і думав. Заберіть його, ми закінчили»."
 westalaska.9.a: "Схоже, священники таки мають хребет."
 
 westalaska.10.t: "Що готує майбутнє"
 westalaska.10.desc: "Вербелл і Ненсі ввійшли до містечка, яке кілька днів тому захопили повстанці й перетворили на поле бою. Землю всівали снаряди, цегляні будівлі лежали розбиті. Напівзруйнована церква з порожніми дзвонами височіла вдалині; артилерія влучила у вежу, і оборонці відступили. По руїнах брели вцілілі обох сторін у пошуках лікарів та їжі. Десь пролунав пронизливий крик.\n\n«Який безлад, - сказала Ненсі. - Та ви, мабуть, звикли...» Вербелл курив сиґару, ніби гуляв власним подвір'ям. «Добре, що хоч комусь подобається лісова прогулянка». Жінка в білому носила між наметами медичне приладдя й спирт. Місцеві медики - дякувати Богові. Це була Ненсина ідея. Місія розрослася неймовірно, і її перебування буде довшим, ніж гадалося.\n\nВербелл випустив дим. «Може, так не здається, але ми рятуємо цих людей. Господи, вони навіть себе врятувати не можуть. Пам'ятаєте Німеччину?» Усміхнувся. «Ми ще зробимо з них солдатів. Дамо їм життя, свободу і прагнення до щастя».\n\nМоже, приїзд і вся місія були помилкою. «Сподіваюся, ви маєте рацію. Не хочу, щоб усі ці страждання привели до лиха»."
 westalaska.10.a: "«Я ніколи не помиляюся»."

 westalaska.11.t: "Найманське керівництво"
 westalaska.11.desc: "Мітчелл Вербелл сидів за старим столом, що колись належав фашистові Матковскому. Навіть по стількох роках він досі знаходив у кабінеті сховані пляшки горілки. Утомлений довгим днем адміністративної праці, Вербелл понад усе хотів знову бути зі своїми хлопцями й битися з комуністами чи будь-ким іншим - аби лише вирватися з цієї похмурої рутини. У тилу було не так весело, та хтось мусив цим займатися, і цим кимось був він.\n\n«Пане, вам новий звіт».\n\n«Ще один!» - озвався Вербелл. «Скільки їх я отримуватиму щодня?»\n\n«Це дуже важливо, пане. Ви мусите прочитати».\n\nВін пробіг очима сторінки: здебільшого добрі новини - наскільки вони взагалі могли бути добрими в сибірській пустці. Кілька диверсій зірвано, найважливішу - на Іркутській ГЕС. Та найважливішими були останні сторінки. Найманці закінчувалися. «Наші люди сильні й добре навчені, - сказав помічник. - Але ми так швидко зросли, що військ уже не вистачає ні на охорону кордонів, ні на антипартизанські операції. Треба щось робити: або наймати більше найманців, або брати росіян до наших лав».\n\nВербелл утупився в сторінки, наче вони могли дати відповідь. Можливо, горілка таки знадобиться."
 westalaska.11.a: "Наближається складне рішення."

 westalaska.12.t: "Потрібне складання"
 westalaska.12.desc: "Мітчелл Лівінґстон Вербелл III зберігав незворушне обличчя, та всередині палав від люті. Він не знав, наскільки все погано, і був певен: увесь цей час йому брехала не одна людина. Вони за це заплатять.\n\nВін щойно оглянув свою армію. Точніше, свою «армію», бо інакше назвати її можна було хіба з великою натяжкою. Зброд, який звав себе солдатами, не мав дисципліни й ледве знав основи польової служби. Зброя та інше спорядження були не лише старезними й нестандартними, а ще й у жахливому стані.\n\nВербелл не прожив би так довго й не забезпечив би собі та спільникам владу над Далеким Сходом, якби був недбалим, недисциплінованим, погано оснащеним чи сліпим. Ні, він досяг цього, взявши справу у свої руки. Чесною денною працею - тяжкою та якісною. Як зробив би кожен американець. Або мав би зробити. І тут буде так само.\n\nЗазираючи в очі кожному офіцерові, повз якого проходив, він міркував, чи здогадуються вони, що на них чекає. Щоб привести військо до ладу, доведеться страшенно тяжко працювати.\n\nІ, хай йому Бог допомагає, вони це зроблять."
 westalaska.12.a: "Вишкіл починається негайно."

 westalaska.13.t: "Мовні бар'єри"
 westalaska.13.desc: "Отто дивився на десятьох росіян перед собою: спини прямі, погляди уважні з домішкою гіркої образи, але мундири обшарпані й погано підігнані. Щось бурмочучи німецькою, старий найманець випростався, затягнувся цигаркою й почав вишукувати в туманній пам'яті уроки російської, які брав у п'ятнадцять років. Вочевидь, цього вистачило, щоб доручити йому навчати солдатів.\n\nЛаманою російською він заговорив до новобранців: «Д-добрий день, доброго ранку...» Чорт, як російською «новобранець»? «Учні». Відділення спантеличено витріщилося, але промовчало. Над малим полем біля казарм панувала тиша, порушувана лише свистом сибірського вітру. Серце Отто билося дедалі швидше, поки він марно шукав потрібні для наказів слова. На чолі вже виступив піт, який обпікав морозний вітер, породжуючи те нестерпно недоречне відчуття холодного сонячного дня.\n\nОдин солдат нахилився до товариша: «Ну звісно, ці ідіоти прислали німчуру, що ледве говорить російською, учити нас воювати, аби ми могли вдавати американців». Другий тихо засміявся. Почервонілий від незрозумілих йому кпинів, Отто безпорадно намагався скласти речення, щоб наказати їм заткнути пельки.\n\n«Тихо обличчя! Сьогодні тренуємо бій у відкритій траві. Е-е... у відкритому полі. Бій у відкритому полі». Отто впустив цигарку, затоптав її й тремтячою рукою потягнувся по наступну. Солдати вже ледве стримували істерику, стискаючи губи й утягуючи підборіддя, аби не захихотіти.\n\n«Господи Боже. Просто... просто двадцять круг бігти, так, учні?» Відділення кивнуло й побігло малою гравійною доріжкою, яку викопало напередодні.\n\nОдин новобранець гукнув: «Добре, учителю!» - і побіг, пирскаючи зі свого жарту.\n\nОтто сів і запалив другу за день цигарку."
 westalaska.13.a: "Це буде складно."

 westalaska.14.t: "Радіо Вільний Маґадан - випуск 78"
 westalaska.14.desc: "Радіоприймачі по всьому Далекому Сходу затріщали, коли почався сьогоднішній випуск «Радіо Вільний Маґадан». Слухачів привітав уже знайомий голос ведучого Стівена, або Стрєлока, якого багато найманців і громадян лагідно звали «Ростбіфом».\n\n«Добрий вечір, народе Сибіру! - захоплено почав він. - Ви слухаєте “Радіо Вільний Маґадан”, найкраще джерело розваг у ці мінливі часи. До речі про зміни...»\n\nДесь поза мікрофоном почулися шепіт і характерний тупіт - когось заводили до студії. «Як ви знаєте, в Африці теж усе змінюється; становище стає нестабільнішим, і ми вітаємо нових екзотичних найманців і друзів із далеких земель Конґо! Один із них зараз зі мною в студії. Привітайтеся зі слухачами, пане Калістрат».\n\nКрізь радіоперешкоди залунала ламана російська із сильним румунським акцентом: «Добрий день, мене звати Фернандо Калістрат; дуже вдячний, що прийняли у ваша країна, і чекати служити з ваша армія. Дякую».\n\n«Блискуче, Фернандо. Він та інші знамениті солдати удачі, як-от швед Рой Ларсен, привезли захопливі історії та м'язи на підтримку наших героїчних зусиль у Росії. А тепер - кілька хітів із тієї далекої землі...»"
 westalaska.14.a: "Новини та зброя з далекої землі."

 westalaska.15.t: "Людина з тисячею життів"
 westalaska.15.desc: "Роже Фольк відчув, як заскрипіли дерев'яні причали, коли він зійшов із судна, трохи заточившись, поки звикав до твердої землі. Високо над портовим Маґаданом, куди він досі ніколи не ступав, кричали чайки. Пробираючись причалом крізь юрби мандрівників, моряків і портових робітників, він відчував, як ниють старі рани. Куля в стопі, яку дістав, воюючи за батьківщину проти німчури. Шрами й кульові рани з часів поневірянь Алжиром. Кулі в другій стопі, грудях і плечі, здобуті в боях за німчуру чи якусь іншу брудну силу, що мала досить грошей переконати старого солдата знову стікати кров'ю в африканському пеклі за жменьку райхсмарок і довічний тупий біль. Куля, яка так і лишилася в правій нозі після служби на італійському Близькому Сході, спричиняючи болісну, але майже непомітну кульгавість. Тисячі інших сутичок жили в пам'яті, та жодна не лишила такого сліду, як роки в Північній і Центральній Африці та на Близькому Сході.\n\nУсе ж Роже лише трохи поступався колишньому собі - це вражало працедавців і принесло славу. «Людиною тисячі життів» його називали. Тож коли Роже почув, що якась російська держава наймає найманців, і побачив, як колишні бойові товариші рушили туди знову жити зухвалим життям найманого стрільця, вирішив спробувати.\n\nДивне було відчуття - ходити вулицями Маґадану в пошуках казарми, бюро найму, будь-якого місця, де можна знайти роботу. Здавалося, він шукає не чергове місце праці, а місце, де буде своїм. Його кар'єра, безперечно, була багатою, але вперше він опинився серед безлічі таких самих чоловіків. Усі вони мали особливий погляд - і саме його Роже побачив у натовпі попереду, що обступив будівлю з нерозбірливими вивісками. Схоже, це було саме місце для нього, тож він рушив туди."
 westalaska.15.a: "Тепер тисяча одним."

 westalaska.16.t: "Очі й вуха Америки"
 westalaska.16.desc: "«...А тоді - а тоді - ми знайшли його пикою в клятому багні й зі спущеними до кісточок штанами!» - Сінґлауб зареготав як гієна, а з телефонної слухавки долинув знайомий сміх його давнього друга Вербелла. Той подзвонив поговорити про справи - щось про Східну Росію чи Західну Аляску... щось таке, - але розмова швидко перетворилася на жарти й байки про давні часи в УСС.\n\n«Боже, я цього навіть не пам'ятаю. Мабуть, опіум був міцний, - хихикнув Вербелл і продовжив: - Гаразд, до справи, старий друже. Чув, ти досі працюєш із федералами в Штатах».\n\n«Ага, в Центральному розвідувальному управлінні».\n\n«Точно. До УСС їм далеко, але байдуже. Саме тому я дзвоню - не лише потеревенити».\n\n«Про що ти?»\n\n«Хочу укласти угоду з тобою та ЦРУ в Штатах. Ви присилаєте зброю, набої та інше, а ми приглядаємо за вашими хлопцями тут, у Росії. Триматимемо тебе й ЦРУ в курсі всього, що тут діється».\n\n«Ну... треба погодити із заступником директора. Але, думаю, влаштую. Чекай дзвінка від начальства: вони захочуть усе підтвердити. Та я певен, що зможу скористатися кількома послугами. Радий був поговорити, Мітче»."
 westalaska.16.a: "«І тобі, Джоне»."

 westalaska.17.t: "Трансцендентне партнерство"
 westalaska.17.desc: "Мітчелл Лівінґстон Вербелл III потис руку Ґордонові Інґрему й зрозумів, що зустрів споріднену душу.\n\nЗапрошений заснувати справу на Далекому Сході, Інґрем прибув зовсім недавно, але вже справив неабияке враження. Цей чоловік був новатором у конструюванні зброї й показав Вербеллові кілька проєктів, які збирався розвивати.\n\nЇх обох особливо зацікавили компактні пістолети-кулемети з надзвичайно високим темпом вогню - настільки малі, що їх бодай зовні можна було вважати пістолетами. Військовий і таємний потенціал такої зброї був очевидним, тож Вербелл охоче погодився всіляко сприяти адміністративним потребам підприємства.\n\nВербелл навіть запропонував власні ідеї, передусім щодо застосування цієї зброї з глушниками різних розмірів, і вони дуже зацікавили Інґрема. Обидва не сумнівалися, що попереду ще багато нових конструкцій, які дадуть не лише прибуток, а й користь державним операціям удома та за кордоном.\n\nТак, подумав Вербелл, ще одна перемога капіталізму на Далекому Сході. І хто міг би нарікати?"
 westalaska.17.a: "Як назвати цю зброю?"

 westalaska.18.t: "Новий режим, те саме ремесло"
 westalaska.18.desc: "Алєксандр Павлов багато років був силовиком. За Матковского він керував численними безпековими операціями держави. Тепер, за Вербелла, інспектував нові навчальні центри й стежив за дотриманням стандартів.\n\nРобота була добра, а головне - чудово давала збагачуватися коштом офіцерів, які не відповідали вимогам. Звісно, Павлов знав міру й не накликав на себе лиха. Багатьом колишнім товаришам поталанило менше; декого він сам застрелив, доводячи відданість новому режимові.\n\nЩо подумав би Матковскій про його службу Вербеллові? Той був украй практичним і розумів потребу тяжких рішень - розкол партії та відступ до Маґадану це довели. Може, він зрозумів би Павлова.\n\nТой швидко відкинув думку. За довгі роки в РФП він засвоїв: треба вміти й хотіти змінюватися разом із часом. Він уже зробив це, коли Матковскій порвав із Родзаєвскім, і робив знову. Невідомо, скільки протримається нова дійсність, але доки тримається, Павлов буде її частиною - водночас готуючись до падіння. Може, саме він завдасть Вербеллові вирішального удару.\n\nДо такої дійсности він теж легко пристосується."
 westalaska.18.a: "Опортунізм життєво важливий."

 westalaska.19.t: "Республіка зміцнюється"
 westalaska.19.desc: "Мітчелл Лівінґстон Вербелл III прочитав принесені звіти й усміхнувся. Справи справді йшли на краще.\n\nЗусилля з розбудови та поліпшення збройних сил дали плоди. Завдяки новим навчальним центрам дисципліна помітно зросла, а випадків непокори меншало. Спорядження поволі стандартизували, і партнерство зі зброярськими компаніями виправдовувало себе. Солдати опановували й передавали одне одному польові навички.\n\nМабуть, найважливіше - майже щодня прибували нові люди з-за моря. Загартовані ветерани численних воєн і гарячих точок світу знаходили на Далекому Сході прихисток і нову домівку. Їхня дисципліна та вміння, безперечно, зміцнять усе військо.\n\nДо того ж їхня відданість державі, яку вони могли назвати своєю, створювала запас адміністраторів для величезних майбутніх територій. Поволі, крок за кроком, сонце над новою республікою світило дедалі яскравіше.\n\nА він подбає, щоб так було й надалі."
 westalaska.19.a: "Чудовий день."

 westalaska.20.t: "Вісники поганих новин"
 westalaska.20.desc: "Дмітрій тихо вилаявся, дивлячись із вікна скромної редакції. Навпроти стояло поліційне авто; водій раз у раз поглядав на вивіску, перекидаючись словами з напарником. Позаду цокали машинки й гуркотіли преси, але Дмітрій мовчки стежив за кожним їхнім рухом. Нарешті поліціянти договорили й вийшли. Серце впало, коли вони рушили до дверей.\n\nДзенькнув дзвіночок. Дмітрій натягнув усмішку: «У чому проблема, панове офіцери?»\n\n«Це ви надрукували?» - перший простягнув газету з надто знайомим заголовком: «Тисячі військових без пенсії через приголомшливо некомпетентну нову політику». Та ще гіршим був рядок над ним: «Маґаданське око». Газета Дмітрія.\n\n«Так, але...»\n\n«Закрити. Наказ президента Вербелла, есквайра».\n\n«Але я...»\n\n«Хочете, щоб я вас змусив? Це можна влаштувати».\n\nДмітрій зітхнув: «Ні...»\n\n«Добре. Маєте добу закрити всю справу, інакше ми з напарником повернемося».\n\nКоли поліціянти пішли, Дмітрій зітхнув і рушив до задньої кімнати повідомити працівникам погані новини."
 westalaska.20.a: "Правду змушено замовкнути."

 westalaska.21.t: "Союзи зручности"
 westalaska.21.desc: "Ґурґєн Асерянц бачив, як у морозному повітрі уривчасто й тремтливо здіймається пара від його подиху. Він лежав на крижаній підлозі льоху й уже не знав, скільки переховувався після падіння Вєрховного Совєта перед маґаданськими псами. Він не дурень: комуніст і аґент НКВД тут не виживе. Тож ховався, мов шкідник. Аж поки почув, як біля хатини захрумтів під чобітьми сніг.\n\nЯк вони його знайшли? Кроки наближалися, людей точно було кілька. Раптом двері льоху з глухим рипінням розчахнулися, і темряву розітнуло денне світло. Ґурґєн завмер і заплющив очі.\n\n«Ґурґєн Асерянц?» - пролунав невидимий голос. Він поволі розплющив очі й занімілими руками піднявся. «Не певен, що ви мене чуєте, але маємо пропозицію».\n\nТремтячи, Ґурґєн відповів: «Хто... хто, в біса, ці “ми”?»\n\n«Сполучені Штати Сибіру. Нам знадобляться люди з вашими особливими... миротворчими талантами».\n\nҐурґєн звів брову на безглузду назву, та вирішив не зважати. Краще, ніж замерзнути в запиленому льосі. «Гаразд. Чому я?»\n\n«Ми вже завербували кількох колишніх аґентів НКВД, ще один не завадить. До того ж ваш приятель Ґєнріх Люшков дав блискучу рекомендацію».\n\nПочувши ім'я давнього товариша, Ґурґєн усміхнувся, звівся на закляклі ноги й виліз сходами з льоху на денне світло."
 westalaska.21.a: "Назад до роботи."

 westalaska.22.t: "Співпраця через силу"
 westalaska.22.desc: "Юрій Вітвіцкій прокинувся від грюкоту дверей, звалився з твердого брудного ліжка й гепнувся обличчям на холодну підлогу. «Аух!» - він сів і потер око, що швидко чорніло. За часів у чорносорочечниках Матковского траплялося й гірше, але боліло пекельно. До камери наближався якийсь офіцер. Юрій підхопився, та чоловік підійшов до сусідньої.\n\nПочулася тиха розмова, дзенькіт ключів і металевий скрегіт дверей. «Радий повернутися!» - вигукнув в'язень, виходячи з камери. Офіцер вивів його перед Юрієм: це був Ґєорґій Шехєрєв, ватажок амурських чорносорочечників. Почуття Юрія були суперечливі: Амур довго був заклятим ворогом, але тепер обидва сиділи у в'язниці Вербеллової республіки.\n\n«В'язню Юрію Вітвіцкому, - наче за сценарієм промовив офіцер, - Сполучені Штати Сибіру мають для вас пропозицію».\n\n«І яку ж?»\n\n«Повне помилування вам і кільком іншим чорносорочечникам в обмін на службу Штатам миротворцями».\n\n«Господи, аби лиш вибратися з цієї камери».\n\n«Гаразд». Офіцер дістав інший ключ і з характерним скреготом відчинив двері. Нарешті Юрій покинув крихітну камеру."
 westalaska.22.a: "«Не дочекаюся справжнього ліжка»."

 westalaska.23.t: "Зіткнення з дійсністю"
 westalaska.23.desc: "Вербелл замислено сидів із запаленою кубинською сигарою в роті - для «натхнення». Найманець, що став воєнним правителем, міркував про своє володіння у Східному Сибіру, керувати яким було, відверто кажучи, повним лайном. Понад десятиліття тут панувала політична нестабільність: від комуністичних диктатур до дивовижних режимів на кшталт релігійного мандату Мєня. Не варто забувати й Матковскового посміховиська, що звалося «республікою» та спотворило й без того слабке уявлення місцевих про демократію.\n\nЯк таким непокірним краєм можуть правити його мешканці - чи взагалі будь-хто? Мітчелл не знав. Американські установи тут не приживуться, принаймні не в тому самому вигляді й не за нинішнього становища Західної Аляски. Видихнувши хмару диму, він скривився: мрія про федеративний уряд не мирилася з реальністю. Хай ця думка й була огидною, задля необхідної стабільности доведеться правити указами - поки що.\n\nТа, поволі приймаючи рішення, Вербелл боявся, що такий деспотизм створить прецедент для майбутнього диктатора-наступника."
 westalaska.23.a: "Стабільність через деспотичне правління."

 westalaska.24.t: "Непомітність - теж зброя"
 westalaska.24.desc: "Андрєй озирнувся й уважно оглянув довкола. Дорога була чиста, тож він перебіг засніжене багно до самотньої розбомбленої будівлі. Колись тут була крамниця; випадковий снаряд поховав її разом із власниками, а мародери обібрали труп. Лишилася оболонка з підвалом - ідеальним для нього та друзів.\n\nКоли Андрєй увійшов, Катя всміхнулася: «Я вже думала, ти засциш», - і ляснула його по плечу.\n\n«І пропустити твоє чудове товариство?» - відповів він під загальний сміх. «Гаразд, досить молоти дурниці. До справи». Решту ночі вони говорили про потреби народу. Одних обурювало свавілля найманців, інші хотіли повернути деякі реформи старого Союзу. Нічого радикального - поки що. До радикалізму було недалеко, але наразі гурт вільнодумців тримався ненасильства не з принципу, а через певність, що інакше його знищать.\n\nСаме тому Катя мусила й далі ходити на збори. Вдома вона зв'язалася радіо з куратором. «Ні, поки лише пусті балачки, але цей Андрєй розумний. Може вчинити щось геніальне або дурне - шкоди буде в кожному разі. Побуду тут іще місяць». Вона загасила цигарку, сховала радіо й лягла спати."
 westalaska.24.a: "Наглядатимемо за заколотом у колисці й побачимо, чи він виросте."

 westalaska.25.t: "Два обличчя Західної Аляски"
 westalaska.25.desc: "Арсєній засичав крізь зуби й відсмикнув руку від домни. У пекельній спеці сталеливарні, серед гуркоту молотів та інших знарядь він працював без однієї захисної рукавиці. Тепер незахищена долоня була червона, вкрита плямами, набрякла й пульсувала від болю. Відсахнувшись від печі й мало не збивши чоловіка позаду, він зустрівся поглядом із одним із наглядачів, присланих на завод кілька днів тому. Кривлячись від болю, Арсєній дивився, як той наближається.\n\n«Якого біса ти робиш?»\n\n«Пане, я...»\n\n«Не хочу чути. Тут не потрібні безрозсудні покидьки, які калічаться, торкаючись гарячої печі».\n\n«Пане, моя рукавиця...»\n\n«Що - твоя рукавиця? Звинувачуєш компанію в неналежному спорядженні?»\n\n«...Ні, пане».\n\n«Добре. Іди до клініки й не сподівайся на платню за пропущені години».\n\nКоли Арсєній поплентався геть, наглядач підійшов до іншого робітника, про чию виняткову працю йому доповіли. Кілька хвилин він дивився, як той вправно обробляє розпечений до білого зливок, і дочекався перерви. Робітник обернувся й стривожено скривився. «Я щось зробив не так?»\n\n«Ні, ні... як щодо підвищеної ставки на наступні кілька годин?»"
 westalaska.25.a: "Батіг не завжди найточніше знаряддя."

 westalaska.26.t: "Звіт про стан № 83"
 westalaska.26.desc: "МЕМОРАНДУМ ДЛЯ: ПРЕЗИДЕНТА ВЕРБЕЛЛА III, ЕСКВАЙРА\n\nЧЕРЕЗ: ОСОБИСТУ ПЕРЕДАЧУ З РУК У РУКИ\n\nТЕМА: ВНУТРІШНЄ НЕВДОВОЛЕННЯ У СПОЛУЧЕНИХ ШТАТАХ СИБІРУ\n\n1. Цей меморандум (а) повідомляє про розвиток подій навколо політики «З нами або проти нас» (див. Звіт про стан № 78) та (б) подає кілька рекомендацій щодо подальшої політики.\n\nНаселення зі статусом «З нами» реагує добре та зростає, особливо в ---------, -------- і --------. Підтримку забезпечено; за опитуваннями та спостереженнями аґентів, наше становище чужинців швидко слабшає.\n\n-------- досі «Проти нас», здобуває підтримку серед -------- і --------; відряджені миротворчі групи неохоче застосовують силу. Населення досі проти нас через: зростання кількости найманців-імміґрантів, ставлення мера --------- до свого округу, зростання збройного насильства в -------- через ширшу присутність зброярських компаній.\n\nРЕКОМЕНДАЦІЇ: придушити злочинність у ----------, далі інвестувати в громади «З нами», додатково розмістити аґентів у містах -----------, ------------ і --------."
 westalaska.26.a: "КІНЕЦЬ ЗВІТУ"

 westalaska.27.t: "Чистка установ"
 westalaska.27.desc: "Лада дивилася з вікна квартири в центрі Якутска, неподалік Якутських адміністративних установ. Їх було видно звідси; сонце поволі ховалося за обрієм, заливаючи вулиці вохрою, що переходила в пурпур, а тоді в опівнічну синь. Вулицею проїхало чорне авто з колоною військових вантажівок і зупинилося біля установ.\n\nЗацікавлена Лада висунулася з вікна, вчепившись у підвіконня й намагаючись роздивитися пасажира. Нікого знайомого - точно не кандидата з бюлетенів і не призначенця Совєта. Якийсь високопоставлений військовик. У новостворених СШС вона не розбиралася в одностроях, але почет засвідчував його ранг.\n\nКрихітний, мов мураха, чоловік із кількома солдатами ввійшов до будівлі. За кілька хвилин звідти вийшли інші постаті - не солдати, а службовці. Лада з глибокою тривогою дивилася, як майже весь уряд Якутска виганяють із будівлі, мабуть, щоб замінити чоловіком у пишному кашкеті та обраним ним штатом. Ніч уже стала темною. Вона відійшла, увімкнула лампу, повернулася до вікна, запнула штори й сіла обміркувати мінливі часи."
 westalaska.27.a: "Хунта просто в неї на подвір'ї."

 westalaska.28.t: "Усі ми чимось жертвуємо"
 westalaska.28.desc: "За пів години Андрєй разів п'ятдесят поглянув на годинник у призовному пункті. Вирішивши вступити до армії, він сподівався на коротшу чергу, та прийшов до неймовірно довгої й тепер стояв майже в кінці. Він не розумів, хто при здоровому глузді добровільно піде до цієї парадоксальної армії, але сам стояв тут - інших варіантів не було.\n\nБатькові ставало дедалі гірше, а нікчемної заводської платні не вистачало на лікаря. Відколи старий повернувся з війни на заході, він слабшав щороку. Андрєй не знав причини: може, куля в стегні, може, місяці в багні. Він не міг оплатити ні лікування, ні навіть діягнозу. Уже майже здався, коли почув про нову програму набору: після служби права обіцяли не лише йому, а й родині.\n\nТож він послав старого начальника заводу боєприпасів до біса й прийшов сюди стояти в черзі та щоп'ять хвилин дивитися на годинник. Нарешті чоловік попереду відійшов, і Андрєй опинився перед столом широкоплечого військового.\n\n«Доброго ранку, друже. Ви, певно, вступати?»\n\n«Так», - відповів Андрєй, стримавши саркастичне запитання, навіщо ще він міг сюди прийти.\n\n«Просто підпишіть тут». Він підсунув папір майбутньому новобранцеві.\n\nАндрєй утупився в порожнє місце для підпису. «Воно того варте...» - пробурмотів він і підписав відмову від нинішніх прав у надії на ширші права в майбутньому."
 westalaska.28.a: "Побачимо."

 westalaska.29.t: "Справжній Зимовий палац"
 westalaska.29.desc: "Далеко на заході, неймовірно далеко від Маґадану, лежало історичне місто Пєтра Вєлікого. Та Вербелла цікавила пам'ятка, створена його небогою Анною, - російський Версаль, Зимовий палац. Колись там засідав уряд Кєрєнского, але місце в історії йому забезпечив большевицький штурм 1917 року. Не кажучи про болісну пам'ять його знищення, знятого й показаного всьому світові у фільмах про німецьке вторгнення. А Ґеббельс таки вмів знімати знищення історії...\n\nТа байдуже, подумав Вербелл. Будівництво його Президентського палацу, якомога точнішої копії Зимового палацу з колишнього Санкт-Пєтєрбурга, завершено. Тепер він стояв у Сибіру, справжньому краї криги й снігу. Де ж іще бути Зимовому палацу?\n\nВербелл відзначав подію французьким вином, доправленим сюди аж з Атлантики. Понад десяток пляшок роздали його людям, які святкуватимуть завершення палацу разом із ним - подумки. Цю ніч він хотів провести сам. Він згадав західного суперника, який міг користатися всіма плодами Бухарінового Сибірського плану. Відпив вина, оглянувся й усміхнувся. Він об'єднав довкола себе загублених і забутих. Створив нову націю - не російську, а власного задуму. Він був майстром війни й разом із любими солдатами розчавить кожного, хто стане на шляху. Хіба вагалися б Цезар чи Наполеон? Та до біса цих невдах! Вони були завойовниками, а він - будівничим. Він стане Вашинґтоном. Саме таким його запам'ятає історія. І жодних заперечень не прийме."
 westalaska.29.a: "99 % невдач трапляються через тих, хто шукає виправдання."

 westalaska.30.t: "Що знайшов - те твоє"
 westalaska.30.desc: "«Обережно з пам'ятками, деякі дорожчі за вас усіх!» Курт застогнав від крику начальника, допомагаючи товаришеві витягти скриню конфіскованого золота з розкішної дачі. Колись тут жив цар, тепер Вербеллівські найманці лишали порожню оболонку.\n\nКожен крок давався важче; навіть удвох скриню несли наче Геркулес. «Ну ж бо, Курте, піддай спину! Я тут усе сам роблю!» - хрипів дужий американець.\n\n«Я стараюся, просто...» Скриня захиталася, вони втратили рівновагу, щось випало й розбилося.\n\n«Чорт. Сподіваюся, капітан не бачив. Що це?»\n\nРозбита рамка зі свіжою світлиною старого козака й лисуватого чоловіка в царському вбранні - двоє, чиї вчинки загубилися в сибірському хаосі. Курт обернувся до товариша."
 westalaska.30.a: "«Гадаю, нічого важливого. Ходімо далі»."

 westalaska.31.t: "Перша доставка"
 westalaska.31.desc: "Капітан Френк Стівенсон тремтів у пальті й стискав закляклі кулаки в кишенях, пильно дивлячись, як люди вивантажують чергову скриню автомобільних деталей.\n\nЦе був їхній перший рейс до Сибіру. Вантажне судно ходило світом, але із Західного узбережжя зазвичай до сонячніших місць: Японії, Індонезії, Австралії, Мексики, Гаваїв. Ніколи - до сміховинної «Республіки Західна Аляска» в замерзлій російській дірі. Та після початку відбудови дедалі більше капітанів ішли до Маґадану.\n\nПідійшов легко вдягнений росіянин із тяжким акцентом: «Ви привезли автодеталі?»\n\n«Так. Ви покупець?»\n\n«Ні, просто дивлюся. Усі говорять про американські компанії. Це вантаж “Форда”?»\n\n«Авжеж. Не думав, що везтиму до Росії деталі. Гадав, хіба зброю за контрактом. Зазвичай це лайно возять лайнери». Він пробурмотів: «Дивна країна».\n\nРосіянин почув, помовчав, а потім усміхнувся."
 westalaska.31.a: "«Та мені не кажіть - я мушу тут жити!»"

 westalaska.32.t: "Переможцеві..."
 westalaska.32.desc: "Російський Далекий Схід знекровлено, а кампанію з... повернення цінностей переможених ворогів завершено. Тепер під нашою охороною величезні скарби та пам'ятки, і час вкласти новий капітал у край, придатний до роботи.\n\nМожна розвинути сибірську інфраструктуру й промисловість, створивши справжню воєнну машину, або заохотити щедрі інвестиції друзів за Беринґовою протокою. Обидва шляхи корисні Західній Алясці, та всього одразу не дістанеш.\n\nЩо оберемо?"
 westalaska.32.a: "Час відчинити двері Штатам!"
 westalaska.32.b: "Розбудуймо справжню промисловість."

 westalaska.33.t: "Нова земля"
 westalaska.33.desc: "Джонні Волтон не думав, що його маленька лісозаготівельна компанія стане міжнародною. Канада майже не рахувалася - сусід старих добрих США. А Маґадан виявився американізованішим за очікування: знайомі реклами, безліч американців і навіть наймані патрулі із США, хай вони й присягнули новим Сполученим Штатам.\n\nТут Джонні міг розширити бізнес як ніколи. Вдома кількість дерев і відновлення лісу обмежували його; тут не було ані природоохоронних правил, ані нагляду, ані Великого уряду, що тисне малого підприємця. Він успадкував справу від батька й діда, але ж був робітником, амбітним сучим сином, готовим ризикнути в Сполучених Штатах Сибіру!\n\nПісля підпису уряд дасть десятки тисяч акрів лісу. Інвестори вдома вже сипали гроші, а після першого року їх стане більше; виробництво зростатиме щороку. І Джонні був не один: усі Штати відгукувалися на заклик нового фронтиру. Дикий Захід народився знову."
 westalaska.33.a: "Здавалося, цим картинам мрійливого зачарування не буде кінця."

 westalaska.34.t: "Новий кошмар"
 westalaska.34.desc: "Усе було брехнею - однією великою брехнею на горі менших. Джонні Волтон, директор лісозаготівельної компанії, став рабом. Він прагнув бути першим і випередити конкурентів. Дістав бажане й тепер платив.\n\nСпершу хотів американських робітників, але контракт вимагав місцевих. Потім - кілька таборів, та не було інфраструктури й навіть бензину для вантажівок. Виробництво йшло майже вдесятеро повільніше, інвестори втратили інтерес. Лишалося вийти з угоди, щоб урятувати компанію. Але...\n\nВін не читав дрібного шрифту. Мусив дати певну кількість робочих місць, податків і лісу для відбудови знищених осель.\n\nІ не лише він: усі американські компанії опинилися в пастці щонайменше на десятиліття. Уряд знав, що вони жадібно кинуться розширюватися.\n\nКурячи біля вікна Орегонського дому, який скоро доведеться продати, Джонні крикнув у ніч: «Будь ти проклятий, Вербелле!» Та звинувачувати міг лише себе."
 westalaska.34.a: "Країну завойовують двома способами: мечем або боргом."

 westalaska.35.t: "Геть старе"
 westalaska.35.desc: "Дмітрій ішов Маґаданом бадьоріше. Коли владу взяли чужоземні найманці, він сумнівався. Виховання застерігало від імперіялістів, але Союз давно став спогадом. Американський неон «Coca-Cola» сяяв над містом; імпорт дав йому життя й нові робочі місця. Дмітрія підвищили в порту, грошей і їжі було вдосталь - неймовірно після фашистів. Час святкувати!\n\n«Владіміре, виродку, я приніс горілку! Не змушуй пити самому!»\n\nКрамниця автодеталей мовчала, все було спаковано. Дмітрій побіг до Владімірового дому.\n\n«Американці, - той дивився в підлогу. - Усюди їхні машини. Нікому не потрібне старе двадцятирічне совєцьке лайно. Всі хочуть справжніх авт. Я перевезу родину на південь до сестриної ферми. Вип'ємо, коли закінчимо роботу».\n\nЦя історія повторювалася сотні разів. Американці робили все дешевше й краще. Дмітрія не замінили лише тому, що хтось мусив вивантажувати чуже лайно. Щоранку йти на роботу ставало важче."
 westalaska.35.a: "Не всі можуть перемогти."

 westalaska.36.t: "Солідарности ніколи"
 westalaska.36.desc: "Рев моторів заглушив профспілкові гасла, коли Максім визирнув над страйкарями. Поліційні авта й вантажівки заповнили вулицю біля металургійного заводу, а люди з плакатами й піснями змішалися з водіями, що зиркали на невдоволених робітників.\n\nНа мить усе стихло: навіщо прийшли силовики? Будь-яка відповідь, крім «розігнати нас», була самообманом. Щойно перший чобіт ступив на бруківку, всі побачили десяток людей у спорядженні для заворушень, що сунули до пікету.\n\nГалас наростав, хаос закипав. Тоді хлопнула ґазова ґраната й зашипіла в повітрі. Люди попереду згиналися, ховали обличчя. Ґаз дістався Максіма, видер сльози й затуманив зір. Він вибрався з хмари та впав на бруківку.\n\nМаксім відчайдушно витирав рукавом пекучі сльози.\n\nКрізь крики й кашель офіцер проголосив: «Зібрання офіційно незаконне. Розійдіться, інакше буде застосовано дальшу силу».\n\nЧастина машин від'їхала, та кілька чорних постатей лишилися проти полуденного сонця."
 westalaska.36.a: "Безголосі такими й лишаються."

 westalaska.37.t: "Головне - кого ти знаєш"
 westalaska.37.desc: "Савіну Єґорову було тяжко пережити Революцію. Його родина була вірна цареві й утратила все з приходом совєтів. Батько добре ставився до селян, і Савін намагався бути добрим начальником, працювати з робітниками, які хотіли організуватися. Схоже, доброта стала слабкістю.\n\nПрацівники збройової галузі готувалися до загального страйку. Савін знав це від уряду: божевільний найманський експеримент породив добрих шпигунів, а дружба з американською розвідкою щось таки важила.\n\nЗа тиждень страйк паралізує виробництво, але конкуренти про нього не знають. Савін завжди давав урядові найкращі контракти й найменше сперечався. Якщо швидко замінити робітників, він захопить ринок.\n\nВін узяв телефон біля димної цигарки: «Сєрґєю? Їдь до Маґадану, знайди всіх безробітних - це неважко. За тиждень вони мають бути готові»."
 westalaska.37.a: "Ти або за столом, або в меню."

 westalaska.38.t: "Понад очікування"
 westalaska.38.desc: "Від приходу Вербелла дедалі більше американських компаній цікавили багаті ресурси молодої держави. Метью Ворнер, представник однієї з них у порту Маґадану, дивився перед собою й бурмотів: «Не думав, що через таке місце проходитимуть такі гроші».\n\nВантажне судно приймало скрині з діямантами й золотом Якутських копалень. Портові робітники працювали на Ворнерову американську компанію, яка володіла судном, купила коштовності й напевно продасть їх у США дорого.\n\nТакий краєвид став звичним у далекосхідних портах. За Вербелла він, мабуть, таким і лишиться."
 westalaska.38.a: "У хаосі криється нагода."

 westalaska.39.t: "Від скромного початку"
 westalaska.39.desc: "Лише десятиліття тому Маґадан був скромним китобійним портом, заснованим СССР для розвитку краю, поки Владивосток приймав великі кораблі. Та Владивосток більше не російський. Після років невтомного розширення Маґадан став значним тихоокеанським портом і приваблює торгівлю від Шанхаю до Сан-Франциско. Підприємці й інвестори вивозять неосвоєні багатства Росії через найбезпечніший і найтепліший великий порт під російською, а не німецькою чи японською владою. Він збагачує власників, торговців і звичайних мешканців, а головне - дає Сполученим Штатам Сибіру справжню вагу, силу та вплив у світових справах."
 westalaska.39.a: "Фортуна сприяє сміливим."

 westalaska.40.t: "Знову в грі"
 westalaska.40.desc: "Мітчелл Лівінґстон Вербелл III дивився на Маґадан, думав про великі звершення й усміхався.\n\nРанкові звіти були ясні: республіканська економіка росла майже нечуваними темпами, промисловість стрімко ширилася, видобуток ставав більшим і ефективнішим, а внутрішня й чужоземна торгівля зростала.\n\nУсе це завдяки його урядові та політиці. Комуністи, фашисти й фундаменталісти не використали майже безмежні ресурси Далекого Сходу - він використав.\n\nВін приніс у темну землю стару добру американську винахідливість і підприємництво, світло поступу. Незабаром найбідніший край Росії стане найбагатшим.\n\nДалекий Схід повернувся до гри, і вона ще далеко не скінчилася."
 westalaska.40.a: "Успіх породжує успіх."
 
 westalaska.41.t: "Сполучені Штати Сибіру просять визнання"
 westalaska.41.desc: "Схоже, рівновага сил у Росії знову змінилася. Далекий Схід об'єднано під однією владою, та ніхто не передбачив би якою. Так звані «Сполучені Штати Сибіру» наслідують нашу державу, а очолює їх американець - сумнозвісний найманець і торговець зброєю Мітчелл Вербелл III.\n\nДивний новий претендент у російському багні закономірно просить визнання у свого головного взірця. Зв'язки з дружнім російським режимом стратегічно корисні, але Вербелл і його найманці - вкрай сумнівні люди. Діяти треба обережно."
 westalaska.41.a: "Вони матимуть нашу підтримку."
 westalaska.41.b: "Накажіть цьому психові забиратися!"
 
 westalaska.42.t: "Сполучені Штати прийняли наше звернення"
 westalaska.42.desc: "Наші друзі у Сполучених Штатах очікувано й щиро прийняли прохання про визнання. Легітимність від великої держави корисна, бо навіть у наших кордонах чимало людей підозріло ставляться до, визнаймо, химерного режиму. Тепер ми принаймні справжній гравець у російській грі - та ще й нарешті маємо друзів у світі."
 westalaska.42.a: "Добре, добре!"
 
 westalaska.43.t: "Сполучені Штати відхилили наше звернення!"
 westalaska.43.desc: "Делегація повернулася зі США з прикрими новинами: Сполучені Штати не визнали Західну Аляску законним спадкоємцем зниклої російської держави. Химерний уряд і так породжував сумніви, а відмова великої держави зробить голоси незгодних гучнішими.\n\nГірше того, наші так звані американські друзі вперше кинули нас напризволяще. Сподіваймося, востаннє..."
 westalaska.43.a: "Стривайте, що? Ні!"
 
 westalaska.44.t: "Сполучені Штати Сибіру пропонують торгівлю"
 westalaska.44.desc: "До наших кордонів прибула дивна делегація зі «Сполучених Штатів Сибіру». Попри назву, дипломати були різних національностей - жоден не росіянин і не сибіряк. Вони хотіли відкрити торгівлю й зміцнити економічні та дипломатичні зв'язки.\n\nКористь угоди незаперечна, але ці люди справді підозрілі. Що робити?"
 westalaska.44.a: "Ми погоджуємося."
 westalaska.44.b: "Відішліть їх геть."
 
 westalaska.45.t: "Сполучені Штати Сибіру засудили нас!"
 westalaska.45.desc: "Міністерство закордонних справ отримало люту проклямацію проти Японської Імперії, написану «президентом Мітчеллом Лівінґстоном Вербеллом III». Виявилося, що цей «президент» насправді очолює найманську армію, яка об'єднала російський Далекий Схід.\n\nВербелл звинуватив Японію в безлічі мерзенних злочинів - від скоєного у війні зі США до «думки, що ви кращі за всіх».\n\nНезрозуміло, чому найманець так переймається американськими кривдами, коли його військо зайняте Росією.\n\nТа не варто турбуватися через слова заблукалих солдатів удачі. Ми створили імперію на всю Східну Азію, а вони захопили кілька мерзлих гір у глушині."
 westalaska.45.a: "Хто? Що?"
 
 westalaska.46.t: "Наші доброчинці"
 westalaska.46.desc: "Ще одна туманна сибірська ніч і порожній бар у глушині. Аґент Мейсон звик зустрічати зв'язкових у непримітних місцях: ніхто не підозрював переломних таємних угод, а він мав трохи тиші. Коли ввійшов усміхнений чоловік із охоронцями, перепочинок скінчився.\n\nСамопроголошений президент Західної Аляски засміявся: «Мейсоне! Почув добрі новини від твоїх друзів удома. Тепер можна покласти край виставі, га?»\n\nМейсон приклав палець до губ. «Тихо! Хочеш, щоб знало все місто?»\n\n«У чому проблема? Тепер, коли Західну Аляску офіційно визнано...»\n\n«Це не обов'язково змінює домовленості, Мітче. ОВН готова тісніше співпрацювати, але не раджу поспішати. Не хочеш, щоб місцеві сприйняли все як колонізацію?»\n\nВербелл замислився. Мейсон мав рацію: за хиткої репутації кидатися в обійми ОВН нерозумно. Та повна співпраця була саме його багаторічною метою..."
 westalaska.46.a: "«Маєте рацію. Триматимемо це в таємниці»."
 westalaska.46.b: "«Перепрошую, час покласти край таємним іграм»."
 
 westalaska.47.t: "Холодна зустріч"
 westalaska.47.desc: "Аґент Мейсон випустив дим у вечірнє сибірське небо. Його «партнер» Мітчелл Вербелл III раптово попросив зустрічі, й Мейсон обрав Маґаданський порт, щоб покурити біля крижаного моря.\n\nПозаду різко спинився джип. Роздратований Вербелл вискочив: «ТИ! Пояснюй, приятелю!»\n\n«Тихіше, Мітче!»\n\n«Міністр сказав, що США не визнають нас законною державою! Що це за довбана справа?! Я думав, ми партнери!»\n\nАґент зітхнув. «Угода завжди була... таємною. Офіційного визнання ніхто не ґарантував, але партнерство не змінюється. Колеґи працюватимуть із тобою незалежно від публічних слів Держдепартаменту».\n\nНайманець скреготів зубами. Він чекав допомоги США, та угода виявилася однобокішою, ніж думав."
 westalaska.47.a: "«Це якась маячня»."

 westalaska.48.t: "Останнє прощання"
 westalaska.48.desc: "Вона стояла на Маґаданській пристані й дивилася, як ранкове сонце прориває темні хмари й забарвлює холодне море. Морський вітер крадав потріскування цигарки, але не солодкий запах тютюну. Вона тремтіла в хутрі - подарунку друга, чи вже колишнього друга?\n\nКроки по бруківці змусили руку смикнутися до порожньої кобури. Старі звички. Перед нею був друг - чи колишній? Від нього тхнуло віскі під парфумами. Дивно, особливо перед тим, із ким він сперечався. Може, вони все ще друзі. «Сьогодні ти якийсь інший. Яка нагода?»\n\nВін посміхнувся. «Хотів попрощатися з подругою. Вона сьогодні їде».\n\n«Яка вона? Ви близькі?»\n\n«Мов рідна. Хотів дати їй це». Він торкнувся дерев'яної коробки. «Передаси?»\n\n«Як вона виглядає?»\n\n«Побачиш - упізнаєш. Усередині справжній антикваріят. Не загуби». І пішов.\n\n«Прощавай!» - крикнула вона, та хвилі й вітер украли відповідь."
 westalaska.48.a: "Прощавайте."

 westalaska.49.t: "Знайома й чужа земля"
 westalaska.49.desc: "Відколи Джек Рей ступав у Маґадані, минуло понад сорок років. Тоді п'ятнадцятирічний шмаркач збрехав про вік і пішов за зірками та смугами. Рік в Американському експедиційному корпусі поруч із білими зробив із нього вбивцю й солдата. Тепер йому майже п'ятдесят, і іншого життя він не знав; повернення до нової країни здавалося правильним.\n\nВін не лишився з білими до кінця, натомість воював у Шотландії проти німців. Для Південноафриканської війни був застарий, але Західна Аляска його прийняла. Він привіз зброю й досвід, відгукнувшись на заклик Вербелла разом із чехами, поляками, маньчжурами, французами, шотляндцями, ірляндцями, мексиканцями й арґентинцями. Божевільний Вербелл умів збирати солдатів. За ними йшли ще два кораблі з людьми й матеріялами. Джек нагадував собі, що це справді відбувається.\n\nПіднявши руки, він уривчастою російською крикнув: «Я повернувся, виродки!» Док відповів різношерстим вітанням новому вигнанцеві."
 westalaska.49.a: "Omnia si perdas, famam servare memento."

 westalaska.50.t: "Зброя, що завоювала Росію"
 westalaska.50.desc: "Ви повертаєтеся зі святкової вечері з коханою, діти їдять морозиво на задньому сидінні, все чудово - аж за рогом авто спиняє натовп бунтівних головорізів. Невже старий «Кольт» урятує родину?\n\nНатовп пошкодує про вибір, коли ви дістанете з бардачка ось це:\n\nВійськова корпорація озброєнь представляє M-10 - зброю, що завоювала Росію. Створений геніальним Джоном Інґремом компактний автомат .45 калібру лише трохи більший за пістолет, але потужніший за армійський «мастильний шприц»: 700 слів дружнього переконання за хвилину одним натисканням гачка проженуть увесь натовп.\n\nДля людей дії є оперативний портфель MAC: шкіряний, напівтвердий, він носить янгола-охоронця всюди й одним натисканням кнопки проливає пекельний дощ.\n\nА від надокучливого сусіда, комуністичного аґітатора чи допитливого федерального аґента допоможе справжній глушник SIONICS. Витвір президента Вербелла робить M-10 таким тихим, що можна приязно розмовляти телефоном, поливаючи ціль свинцем.\n\nЯкщо маєте податкову марку, телефонуйте просто зараз - M-10 доставлять із Маґадану до ваших дверей."
 westalaska.50.a: "Цей сегмент оплачено державою [MAG.GetName]."

 westalaska.51.t: "За межами Далекого Сходу"
 westalaska.51.desc: "По радіо в усьому світі чоловік з американським акцентом говорив із запалом продавця вживаних авт.\n\n«Потрібні найманці проти клятих загарбників?»\n\n«Якісь ідіоти захопили країну, й хочете її повернути?»\n\n«Західна Аляска пропонує найкращі наймані сили світу! Оснащений новітніми технологіями Західноаляскинський експедиційний корпус, або ЗАЕК, допоможе битися будь-якому народові!»\n\n«Ви спитаєте: “Фредді, вони нас не зрозуміють або повбивають!” Не бійтеся: сувора дисципліна робить ЗАЕК професійним, а багатонаціональний склад знає майже кожну мову світу!»\n\n«То чого чекаєте? Наймайте ЗАЕК нині! Від африканських джунґлів до британських пагорбів - ми будемо там. Телеграфуйте Міністерству закордонних справ Західної Аляски: обговоримо ціну, навіть дамо фінансування! Наймайте нас, бо не хочете, щоб це зробив ворог!»"
 westalaska.51.a: "Ще трохи - й він заговорить про ґарантію повернення грошей, от побачите."

 westalaska.52.t: "Робити якнайкраще"
 westalaska.52.desc: "Анатолій Собчак тривожно вирівнював олівці на столі. Кабінет і місто ті самі, але прапори інші. Він більше не присягав цареві й не був мером від його імени; тепер виконував ті самі обов'язки для американського найманця-вискочки.\n\nЗелено-білий прапор князівства змінили барви Західної Аляски. Сміховинна назва, та Анатолій не сміявся: посаду він зберігав мовчанням і схиленою головою, коли до міста приходили солдати. Він лише хотів далі захищати людей.\n\nЗатяті білі погрожували вбити його за відмову померти в бою з Вербеллом. Але мертвий Анатолій не допоміг би нікому, а колаборант-мер міг робити найкраще для народу. Він зітхнув і подумав, чи містяни колись пробачать. Сніг тихо падав, а він занурювався в затишну тишу приреченого."
 westalaska.52.a: "Одного дня вони зрозуміють."

 westalaska.53.t: "Чия свиня?"
 westalaska.53.desc: "Російська Джеррі Патріка Геммінґа поволі кращала. Перед ним стояли два брудні бородаті селяни з ділянки під його управлінням і взаємно звинувачували одне одного.\n\n«Отже, Олеже, Пєтр украв вашу свиню?» Олег кивнув. «А Пєтр заперечує?» Той теж кивнув. «Свідків або квитанції нема?»\n\n«Не потрібна квитанція, злодій забрав свиню з мого хліва!»\n\n«Брехун!» - Пєтра стримав охоронець.\n\n«Господи, заспокойтеся! Олеже, ви не доведете, що свиня ваша; Пєтр теж не доведе. Облиште справу, помиріться, а я куплю вам свиню. Всі виграють».\n\nБеззубий Олег усміхнувся: «Я заберу скаргу».\n\n«Мої люди поговорять із вами завтра». Селяни пішли, Геммінґ потер скроні. Він почувався середньовічним графом, а не військовим губернатором. Такою була Західна Аляска."
 westalaska.53.a: "Принаймні ніхто не постраждав."

 westalaska.54.t: "Погані новини"
 westalaska.54.desc: "Пане президенте, із західного кордону надійшли... прикрі новини.\n\nОдин із старших найманців, «Джон Пітерс», посварився з місцевим політиком через «заготівлю» житла для підрозділу. Політик загинув від численних ножових поранень, а Пітерс заявив, цитую: «Цей мудак заслужив, бо був пихатою дупою».\n\nЧерез високе становище Пітерс уникнув кари, але відносини з місцевими помітно погіршилися."
 westalaska.54.a: "Чорт забирай!"

 westalaska.55.t: "Маґаданська група досліджень і спостереження"
 westalaska.55.desc: "Для митників Маґаданського летовища прибулі були просто новими обшарпаними солдатами удачі з усього світу, що шукали багатства в обіцяній землі грабунку й визиску.\n\nСаме цього вони й хотіли: прибували різними рейсами, змінами огляду, з різними легендами. Управління та США не могли відкрито підтримувати нелегітимного воєнного силача, яким уважали Вербелла попри титули. Та його успіх був в інтересах Америки, тому їх прислали.\n\nЗавдання просте. Вербеллівський набрід умів стріляти й грабувати беззбройних цивільних, але майже нічого іншого. Фахівці світових зон війни зроблять із покидьків дієву силу.\n\nВони всміхатимуться, терпляче навчатимуть, ходитимуть на операції радниками й спостерігачами та приховуватимуть огиду до найманців і зрадників, бо так наказано. Так вони забезпечать перемогу американських інтересів.\n\nДля більшости це не вперше: вони вже працювали з такими неприємними людьми й працюватимуть знову."
 westalaska.55.a: "Ще одна пустка для Управління."

 westalaska.56.t: "Багато облич матрьошки"
 westalaska.56.desc: "Вербелл дивився телевізор і чекав власної промови до громадян Сполучених Штатів Сибіру про зростання й суверенітет. Найдивніше - вона була російською, якої Мітчелл зовсім не знав. Та хто сказав, що говорити мусить він? Екран засвітився його обличчям.\n\n«Співвітчизники», - прозвучало ідеальною російською. Губи не відповідали словам: російський найманець озвучив записану англійською промову, щоб народ уважав президента своїм. Вербелл тихо хихикнув.\n\n«Я, президент Вербелл, звертаюся щодо нашої нації. Колись одна з багатьох держав у холодній землі, Республіка тепер охоплює величезну частину Росії. Зросли зайнятість і якість життя. Міцні установи дають усім мир і стабільність; це горда незалежна країна, вільна від чужого впливу. Я вам обіцяю».\n\nОбіцянка була мертва від народження: СШС таємно підтримувало ЦРУ, а президент був американським найманцем із хиткими російськими претензіями. «Добраніч, і хай Бог благословить Сполучені Штати Сибіру».\n\nЕкран згас під ноти «Російського танцю» Стравінського, а Вербеллова посмішка сяяла в темряві."
 westalaska.56.a: "Невидимі впливи ховаються в темряві."

 westalaska.57.t: "Постріл у дипломатію"
 westalaska.57.desc: "Рукостискання, фальшиві посмішки й чарки віскі - три речі, які дипломат має знати для угоди.\n\nНад малим кораблем у далекий Маґадан майорів зоряно-смугастий прапор. На містку стояли добре вбрані чоловіки й дивилися на кремезних вояків у поношених формах, що урочисто чекали в порту.\n\nКоли американці зійшли, один велет швидко потис усім руки, ледве не ламаючи слабкі зап'ястки.\n\n«Вітаю в Західній Алясці, панове. Тут майже як у старих добрих США, тож не сумуватимете. Проведімо вас до кімнат, а за віскі поговоримо й вип'ємо за нову велику дружбу країн, га?»\n\nДипломати приголомшено дивилися на прямоту найманця. Утім, у холодному портовому вітрі віскі звучало привабливо..."
 westalaska.57.a: "Господи, як тут холодно!"

 #Blackbear event chain
 westalaska.58.t: "Табір новобранців"
 westalaska.58.desc: "«Зброю. Дай», - гавкнув голос за спиною Джека Свободи, відриваючи його погляд від пляшок. На мить здалося, ніби ґрізлі навчився ходити: чоловік височів над ним, увесь у хутрі. Лише простягнена рука розвіяла думку, й Джек віддав батьківський револьвер.\n\nТой підлетів - бах-бах-бах. Три кулі сибірським вітром розбили три пляшки. Людина-ведмідь за три секунди зробила те, чого Джек не зміг за тридцять.\n\n«Лікоть зігнутий, ноги зашироко й трусяться, - сказав велет ламаною англійською. - Заплющуй око, коли тиснеш гачок. Рухайся з відбоєм, як трава на вітрі». Він оглянув орнамент. «Револьвер зі слоновою ручкою й гарним малюнком. Непотріб». Не відводячи очей: «Западная Аляска - не місце дитині гратися в солдатика. Звідки?»\n\n«Т-Техас».\n\n«Амеріканскій, га? Думаєш, ковбой полює на індіян у лісі? Стрілятимеш як дєбіл - тутешні самі переріжуть горло пляшкою горілки». Він обернувся до п'ятьох стрільців. «Це всім, хто прибув до Маґадану. Тут не голий татарин із луком, а армія, де зброї й мізків більше, ніж у вас разом. Забудьте Голлівудське дєрьмо. Ви - Blackbear, найкращі солдати удачі світу. Ми навчимо вас битися як вони - або помрете як вони».\n\nКоли росіянин пішов, Джек гукнув: «Стривайте! Моя зброя, е-е, сер?»\n\n«Візьми кращу зі складу. І скажи Трофіму, що Бос послав»."
 westalaska.58.a: "«Пайтон, - сказав Бос, відходячи. - Тепер твоє ім'я, як твоя погана зброя»."

 westalaska.59.t: "Польовий вишкіл"
 westalaska.59.desc: "Одне з неписаних правил Боса: нити можна будь-коли. За десять кілометрів від цивілізації, заритий у морозний сніг, рядовий Джек Свобода мав про що нити: шлунок болів без сніданку, ноги - після вчорашнього маршу, мороз кусав крізь форму. Пів мозку стримувало язик, пів молилося, щоб до заходу в приціл зайшов якийсь дурень.\n\nНаче у відповідь ожило радіо. «Пайтон, - потріскував голос із російським відтінком, - патруль, двоє на північному узліссі, 300 ярдів. Я беру лівого. На три».\n\nНарешті, чорт забирай! «Зрозумів, Бос», - майже крикнув Джек, наводячи «Спринґфілд». Двоє вийшли з дерев, видані чорним металом на арктичному камуфляжі. Навіщо вони тут, утомленому голодному найманцеві байдуже: що швидше помруть, то швидше він повернеться до теплої їжі.\n\nДжек затамував подих, як учив Млинарж, і вирівняв руки. Патруль спинився: товариш Лівого розстібав штани біля сосни. Хрест прицілу поповз до голови - ще мить, і куля рознесе мозок...\n\n«Три». Постріл. Куля .30-06 вдарила в сніг. Голови смикнулися; далекий постріл - і Лівий утратив свою. Його товариш ледве застебнувся, коли третя куля кинула його обличчям у власну сечу.\n\nОтак Джек утратив сьогоднішній талон на пайок."
 westalaska.59.a: "Марні постріли купували лише час на стрільбищі."

 westalaska.60.t: "Патруль відділення"
 westalaska.60.desc: "«Оце я подумав».\n\nСержант «Пайтон» Джек обміркував слова медика, стежачи за темрявою перед табором. Нічні зміни й порожня балаканина добра не приносять. «Ти завжди думаєш, Сонґ. Але кажи».\n\n«Ну... - протягнув Сонґ «Кей» Джон-Гва на ліжку. - Хіба це не як у кіно? Купа найманців збігається в край воєначальників, бере все у власні руки й викроює собі дім. Додай Джона Вейна, Джоан Фонтейн, затертий роман - і бах! Блокбастер року».\n\nНавпроти сидів Казімєж «Каз» Млинарж; жар поблискував у темних окулярах кулеметника. «Як сказав Бос, Кей: Голлівуд лишай у Голлівуді. Якщо це не твоя гарячкова маячня, Західна Аляска тепер наш дім - для тих, хто без дому».\n\n«Бос те, Бос се - скажи хоч раз щось своє! І не я вдягаюся ковбоєм та кручу пістолети. Це Лисий!»\n\nВін показав на Адама «Шашку» Абрамова, що крутив два револьвери. «Ознака доброго смаку, корейський друже. Вона більше говорить про тебе, ніж про мене. Шассер, поясниш юному незайманцю жіночі бажання?»\n\n«Шассер» Мірієль двічі свиснула, досилаючи набій у MAS-36. Хтось був близько. Джек навів гвинтівку на шелест у кущах. Двічі гримнуло, тіло м'яко впало в сніг удалині.\n\nІз лісу з піднятою зброєю вийшло ще десятеро."
 westalaska.60.a: "«Гарний постріл, Пай!» - сказав Кей за мить до того, як свинець наповнив порожню ніч."

 MAG_special_activities_unit_tt: "Вербелл використає §Yзв'язки§!, щоб залучити на місце §Oсправжніх професіоналів§!.\n"
 MAG_junkdogs_tt: "Вербелл використає §Yзв'язки§! на півдні, щоб доправити сюди численних §Oстарих знайомих§!.\n"
 MAG_lgm_tt: "Ці «оборудки» допоможуть нам стати на ноги.\n\nВідновлені зв'язки дадуть змогу спробувати щось §Oсправді амбітне...§!"
 MAG_tanks_tt: "З усіх машин, які вдасться здобути в таких незвичайних умовах, буде сформовано §Oособливий бронетанковий підрозділ§!."
 MAG_amur_attack_werbell: "§OНегайно§! почнеться підготовка до заплянованого Маґаданом удару по Амуру."
 MAG_foxhound_tt: "Буде сформовано групу спеціяльних операцій для ударів у ворожому тилу, що §Oвідкриє нові рішення Смути§!."



