 ##=====| Superregional Trees |=====##
 #####################################

 ### Petlin tree ###
 MAG_a_new_dawn_for_the_republic: "Новий світанок Республіки"
 MAG_a_new_dawn_for_the_republic_desc: "Після кровопролиття, інтриґ і економічної боротьби ми об'єднали майже весь Сибір. Від скромного початку в мерзлому Маґаданському порту минула наче вічність.\n\nТа роботи ще багато: крім походу на захід для об'єднання Росії, треба владнати внутрішні справи. Колишній Вождь, тиран Міхаїл Матковскій, обіцяв широкі реформи лише для заспокоєння народу й американських інвестицій. Його слова були нещирі. Тепер, усунувши його, ми можемо провести справжні змістовні реформи."
 
 MAG_depoliticize_the_armed_forces: "Деполітизувати збройні сили"
 MAG_depoliticize_the_armed_forces_desc: "Попри зусилля, в армії від перших перемог над Родзаєвскім і Чітою зростали корупція та кумівство. Багато офіцерів мають політичні зв'язки, особливо тривожні - з трудовиками Матковского.\n\nЦього не буде. Ми надто багато ризикували, відтісняючи його прихильників, щоб військова підтримка закипіла переворотом. Слід перевірити зв'язки з трудовиками та іншими фракціями, найгірших усунути, інших ізолювати й ґарантувати: військо працює на уряд, а не навпаки."
 
 MAG_cooperative_federalism: "Кооперативний федералізм"
 MAG_cooperative_federalism_desc: "Від урядових залів великих міст до найменших сільських адміністрацій потрібна співпраця, бо всі люди й уряди мають спільні проблеми.\n\nМи запровадимо американську модель кооперативного федералізму: федеральні, регіональні й місцеві органи разом розв'язуватимуть спільні питання. Рівні влади не діятимуть окремо, натомість постане довіра між найвищими урядовцями та людьми, яких вони представляють."
 
 MAG_bond_the_eagles: "Поєднати орлів"
 MAG_bond_the_eagles_desc: "Орел давно символізує США, але представляє й росіян. Це володар птахів і король неба - шляхетний, витривалий, стійкий та могутній. Він уособлює американців і має уособлювати росіян.\n\nДва світові орли не повинні самі входити в темряву міжнародної спільноти. Після справжніх реформ американці неодмінно побачать у нас цінного союзника. Звернімося знову й міцніше зв'яжімося: майбутнє Росії - з ОВН."
 
 MAG_the_shadow_of_the_vozhd: "Тінь Вождя"
 MAG_the_shadow_of_the_vozhd_desc: "Міхаїл Матковскій був тираном і диктатором, але не дурнем і не божевільним. Він був тактовний, розумний і політично вправний, наполегливо творив ядро підтримки, яке, на жаль, пережило його усунення.\n\nТінь Вождя досі висить над адміністрацією, а прихильники в ній заважають потрібним діям. Їх треба викорінити й викрити, трудовиків - обеззброїти та принизити. Дехто навіть твердить, ніби колишнього диктатора ув'язнили несправедливо! Ці люди небезпечні й заслуговують такої самої суворости, як Вождь."
 
 MAG_disband_dalstroy: "Розпустити Дальстрой"
 MAG_disband_dalstroy_desc: "Дальстрой - нібито оплачувана будівельна програма, а насправді надзвичайно ефективна мережа таборів примусової праці - одна з найшкідливіших спадщин Матковского. Величезні комплекси, що справді дали економічну користь, давно стали символом гноблення для росіян усіх переконань.\n\nГоді.\n\nДальстрой буде розпущено, його урядовців судитимуть за новими законами, а в'язнів звільнять працювати де хочуть і повернутися до родин та рідних міст. Невинні більше не працюватимуть у жахливих умовах майже задарма."
 
 MAG_caging_the_corporations: "Посадити корпорації в клітку"
 MAG_caging_the_corporations_desc: "Вождь підпирав владу угодами з російськими й чужоземними корпораціями. Вони щедро давали гроші до його особистих фондів, якими він купував противників, залякував непідкупних і зміцнював владу; натомість діставали преференції.\n\nКорпорації звикли до цієї оборудки й тепер майже відкрито бунтують, бо ми відмовилися її шанувати. Попри їхній вплив в адміністрації, треба викорінити корпоративну спадщину з політики, щоб уряд служив не війську й не приватному секторові, а російській громадськости."
 
 MAG_the_redemption_of_harbin: "Спокута Харбіна"
 MAG_the_redemption_of_harbin_desc: "Харбін у серці Маньчжурії має багато облич, та найпомітніше, на жаль, - спадщина РФП, створеної безглуздим Константіном Родзаєвскім. Через походження партії міжнародна спільнота й сама Росія знають місто як центр організації, що систематично тероризувала ідеологічних противників.\n\nТа Харбін - значно більше: центр російської емігрантської культури, дім багатьох, зокрема нашого дорогого лідера, перехрестя культур. Його не мають пам'ятати лише як батьківщину РФП. Треба зробити спогад про наш скромний початок позитивним, а не ганебним."
 
 MAG_siberian_spring: "Сибірська весна"
 MAG_siberian_spring_desc: "Від завоювання Центрального Сибіру ми тримаємо його лише хиткою хваткою. Треба інтеґрувати землі, розширити адміністрацію на захід і міцно закріпитися. Це збільшить податки, людські резерви й промисловість, що дасть відважним солдатам зброю для об'єднання Росії.\n\nДля цього насамперед слід ґарантувати права й свободу всім росіянам у кордонах та навчити їх цінувати свободу й користь, яку вона разом із нашою владою приносить."
 
 MAG_the_assembly_of_novosibirsk: "Новосибірські збори"
 MAG_the_assembly_of_novosibirsk_desc: "Нові території принесли безліч людей, зокрема політиків колишніх держав. Декого можна реабілітувати для управління Центральним Сибіром, а когось навіть прийняти до партії: хто краще знає місцеву політику?\n\nУ Новосибірску, найбільшому місті краю, ми проведемо конференцію з новими діячами про політичну інтеґрацію та нормалізацію тих, кого можна прийняти до партії."
 
 MAG_a_new_course: "Новий курс"
 MAG_a_new_course_desc: "Останніми роками ми багато перейняли в американців - чому не ще дещо? Всі партійці згодні, що адміністрація має зійти з колії тирана Матковского, але щодо нового курсу точаться суперечки.\n\nНіколай Пєтлін запропонував популярну програму державних громадських робіт, фінансової реформи й регіональної відбудови - подібну до того, що деякі американські політики радять власній країні. Уряд створить відповідальну економіку, здатну оговтатися від дотеперішньої анархії."
 
 MAG_promote_democratic_ideals: "Просувати демократичні ідеали"
 MAG_promote_democratic_ideals_desc: "У Центральному Сибіру повторюється далекосхідна проблема: більшість росіян зовсім не знає, як працює демократія. Тому адміністрація мусить багато часу присвятити поширенню своїх ідеалів.\n\nДемократія, воля й свобода для всіх росіян - наша мета, і народ має в неї повірити й покласти надію. Коли люди приймуть наш заклик, ніщо не завадить створити справді вільну демократичну Росію."
 
 MAG_reform_the_courts: "Реформувати суди"
 MAG_reform_the_courts_desc: "Назвати правосуддя Матковского фарсом було б надто ласкаво. Навіть погано написана підліткова вигадка дала б кращу основу, ніж його показові судилища. Правосуддя не було об'єктивним: Матковскій вершив його через суддів-папуг і присяжних-маріонеток, підлаштовуючи вироки та усуваючи ворогів.\n\nЦе одна з найтемніших плям партійної спадщини й перешкода майбутньому. Судову систему слід докорінно очистити від виконавців Матковского - корупціонерів, фанатиків і боягузів, які не мають права вирішувати провину громадянина."
 
 MAG_drafting_a_constitution: "Написати конституцію"
 MAG_drafting_a_constitution_desc: "Попри Сибірський білль про права, адміністрація Міхаїла Матковского роками відкладала конституцію, нібито народ не готовий до такого поступового документа. Це лише прикривало справжню мету: тиранію, гноблення й підкорення людей його волі.\n\nЦе було неприйнятно тоді й тим більше тепер. Час конституції давно настав. Ми маємо виправити зло Матковского й негайно створити основу республіки на майбутні роки."
 
 MAG_towards_freedom_and_unity: "До свободи та єдности!"
 MAG_towards_freedom_and_unity_desc: "Ми багато зробили для демократії та свободи: виправили темну спадщину так званого Вождя Матковского, забезпечили справедливі суд, економіку й конституцію, що захищатиме права народу та демократію десятиліттями. Ми деполітизували армію, руйнували Матковсківську спадщину й очищали власне походження.\n\nРоботи ще багато. Та на мить можна спинитися й помилуватися зробленим. Ми прямуємо до вільної демократичної країни - Росію буде визволено."

 ### Matkovsky tree ###
 MAG_the_vozhd_marches_on: "Вождь крокує далі"
 MAG_the_vozhd_marches_on_desc: "Сибір нарешті об'єднано під прапором Вождя Міхаїла Матковского. Годі скніти в мерзлій пустці як японські посіпаки, годі дрібних сварок емігрантів за титул спадкоємця Колчака.\n\nДорогою довелося усунути небажані елементи, але це заради найкращої справи - єдности Батьківщини. Русская Національная Трудовая Партія єдина у вірності Вождеві."

 MAG_altering_the_siberian_bill: "Змінити Сибірський білль"
 MAG_altering_the_siberian_bill_desc: "Ніколай Пєтлін був нестерпним у цьому жорстокому світі баламутом - реформістом із безліччю ідей, але без здорового глузду. Його довелося усунути, та не обов'язково стирати з пам'яті. У багатьох плянах було добре насіння, яке досвідченіший державник може виплекати.\n\nСибірський білль - одна з найкращих ідей Пєтліна, основа великої та могутньої Росії. Кілька змін зроблять його сильною заявою для наших громадян і спостерігачів за Тихим океаном."

 MAG_immediate_universal_suffrage: "Негайне загальне виборче право"
 MAG_immediate_universal_suffrage_desc: "Росія мусить наздогнати західні держави, якщо хоче їхньої допомоги. Права голосу тут не бачили від Новгородської республіки, та й тоді воно належало лише шляхті.\n\nНарод буде щиро вдячний, коли ми дамо загальне виборче право не лише чоловікам, а й жінкам; американська преса неодмінно назве нас справжнім союзником демократії."

 MAG_state_department_of_moral_decency: "Державний департамент моральної пристойности"
 MAG_state_department_of_moral_decency_desc: "Ідеї небезпечні, і їх треба контролювати, щоб Росія знову не поринула в темряву. Большевики вирвали російську мораль із корінням, дозволили декаданс, зруйнували традиційну родину й навіть заохочували збочення.\n\nДержавний департамент моральної пристойности стежитиме, щоб усі публікації відповідали стандартам російського народу й містили лише належні політичні погляди. Було б жахливо, якби хтось збився зі шляху."

 MAG_a_peace_preservation_law: "Закон про охорону миру"
 MAG_a_peace_preservation_law_desc: "Держава рухається вперед велетенськими кроками, та успіх не має запаморочити нам голову. Правильний голос у неправильному місці може зруйнувати молоду державу, тож голоси мають діставатися правильним людям.\n\nЗакон про охорону миру дасть державі право вилучати кандидатів із виборчого реєстру заради національної безпеки. Русская Національная Трудовая Партія твердо вірить у систему «одна людина - один голос»: ви маєте один голос і одну людину, за яку можете проголосувати."

 MAG_qualify_votes_and_districts: "Визначити виборців та округи"
 MAG_qualify_votes_and_districts_desc: "Далекий Схід величезний, тому виборчі округи - серйозне питання й могутній засіб контролю над рідко заселеною землею.\n\nНеросійські елементи - саха, буряти й монголи - давно сидять нам скалкою в боці й неодмінно скористаються виборами для галасу. Тому перекроїмо округи так, щоб вони всюди лишалися меншістю."

 MAG_the_ideological_quagmire: "Ідеологічне багно"
 MAG_the_ideological_quagmire_desc: "Центральний Сибір - суцільний безлад. Десятиліттями ним правили комуністичні диктатори, анархістські армії та божевільні королі, створивши політичну ситуацію, яку лише з великої ласки можна назвати нормальною.\n\nЩоб повернути лад, аґенти ДРУ з'ясують, як усталилася місцева ідеологічна ситуація. Дізнавшись, у що люди справді вірять, ми це виправимо - або принаймні ізолюємо їх, щоб ідеї не пустили коріння."

 MAG_the_consciousness_of_law: "Свідомість закону"
 MAG_the_consciousness_of_law_desc: "Іноді батьки мусять приховувати щось від дітей. Хіба вони тоді дозволяють дитині шаленіти, влаштовувати істерику й бешкет? Звісно, ні. Так само й ми маємо приховувати дещо від народу й не дозволяти йому здіймати галас. Право висловлювати думку - не право, а дорогоцінний дар, яким можна користуватися лише з нашого благословення.\n\nНе пускати протестувальників на вулиці - для їхнього ж добра, а не давати їм казати образливі речі - просто добре виховання."

 MAG_integration_of_the_sibplan: "Інтеґрація Сибірського пляну"
 MAG_integration_of_the_sibplan_desc: "Бухарінський Совєцький Союз був лихом для Росії та світу, але кожна хмара має срібну облямівку. Нехтування Росією врівноважує Сибірський плян - комплексна перебудова сибірської промисловости й Транссибірської маґістралі, що безпрецедентно зв'язала неосвоєні простори.\n\nМи вже завершили власні інфраструктурні проєкти, але лише нещодавно просунулися досить далеко на захід, щоб справді долучитися до цієї мережі."

 MAG_politically_conscious_politically_convenient: "Політично свідомо, політично зручно"
 MAG_politically_conscious_politically_convenient_desc: "Наші зусилля вдосконалити демократію дали очевидні плоди. Явка в майже кожному окрузі вражає, а низька явка точно збігається з великим неросійським населенням. Русская Національная Трудовая Партія здобула приголомшливу більшість у кожному окрузі - переважно тому, що інших кандидатів не було.\n\nВождь Міхаїл Матковскій похвалив нову любов росіян до демократії та милостиво прийняв мандат на подальше правління."

 MAG_no_partisanship_no_problem: "Нема партійности - нема проблем"
 MAG_no_partisanship_no_problem_desc: "З установленням раціональної демократії Сибірська Національна Республіка стала мирною. Без опозиції нікому порушувати спокій і поширювати руйнівні схильності.\n\nЄдиний шлях до виборчого успіху пролягає через Русскую Національную Трудовую Партію: кожен шукач голосів мусить пом'якшити погляди під її охолоджувальним впливом або зникнути з бюлетеня."

 MAG_keeping_up_appearances: "Зберігати видимість"
 MAG_keeping_up_appearances_desc: "Сердечні відносини з Організацією Вільних Націй - наріжний камінь нашої стратегії. Колись ми були одним із багатьох режимів, що благали уваги, а тепер пануємо над однією з найбільших країн планети й нас не можна іґнорувати.\n\nЩоб нас колись визнали єдиним законним урядом Росії, треба фінансувати посольства в країнах ОВН. З огляду на інші російські сили, американці не зможуть не висловити довіру."

 MAG_a_reliable_partner: "Надійний партнер"
 MAG_a_reliable_partner_desc: "Так, Сибірська Національна Республіка має дивацтва, але й унікальне становище. Свободи слова менше, ніж в Америці, та хто не може цього сказати? Становище меншин неідеальне, але так само в США. Вождь ближчий до диктатора, ніж президента, зате він доброзичливий диктатор, справжній Цинциннат.\n\nМи недосконалі, але насамперед надійні. Ми хочемо бути добрим сусідом і підемо на все, щоб довести це американським братам."

 MAG_with_us_or_against_us: "З нами чи проти нас"
 MAG_with_us_or_against_us_desc: "Ми хочемо бути добрим сусідом і плідно співпрацювати із союзниками, але не дозволимо собою попихати. Ми вже не дрібна держава воєначальника, а справжня нація з величезними ресурсами, могутньою армією та гордістю. Ми працюємо з чужинцями, але не залежимо від них і підемо з переговорів, якщо нас обдиратимуть. Нехай учаться працювати з нами."

 MAG_sensible_concessions: "Розумні поступки"
 MAG_sensible_concessions_desc: "ОВН завжди вимагає якоїсь дрібниці, і часом варто поступитися, навіть усупереч негайним внутрішнім інтересам. Та вони не мають цілком визначати темп реформ - тому ми маємо список.\n\nМи шукаємо байдужі нам реформи, щоб кидати їх ОВН як паперовий щит. Досить малих змін відверне великі вимоги й покаже нас поступовою Новою Росією.\n\nУсе заради доброї справи."

 MAG_protecting_corporate_interests: "Захищати корпоративні інтереси"
 MAG_protecting_corporate_interests_desc: "Бізнес - життєва кров держави, тож він має працювати без перешкод. Велетенські землі Сибіру й Далекого Сходу майже не освоєні через розміри й мале населення; треба розчистити шлях до прибутку. Що легше тут вести справи, то більше підприємців прийде, а що більше компаній укоріниться, то ближчими ми станемо до ОВН.\n\nЩоб привабити бізнес, права людей не повинні стояти вище за його інтереси."

 MAG_an_army_to_be_proud_of: "Армія, якою варто пишатися"
 MAG_an_army_to_be_proud_of_desc: "Наша армія пройшла довгий шлях: від бандитів на Харбінських вулицях до воєнізованих громил Маґадану. Щоб вижити, ми створили тактику малих підрозділів для захоплення міст і сіл, а у війні з псами Родзаєвского - власні дивізійні стратегії.\n\nЄдність Сходу була лише початком: на заході довелося пристосуватися до повномасштабної війни на велетенському фронті. За одне десятиліття ми створили армію майже західного рівня.\n\nЩе трохи полірування - і ми готові до остаточного повернення Росії."

 MAG_the_struggle_for_the_national_russia: "Боротьба за національну Росію"
 MAG_the_struggle_for_the_national_russia_desc: "Шлях був довгим і тяжким, але Вождь нарешті утвердив владу над Національною Республікою. Від мрії в Харбінських нетрях до однієї з найбільших держав Землі - нас від повного об'єднання Росії та скасування двадцяти років ганьби відділяє один крок.\n\nЛишається підготуватися до останньої боротьби."
 
