 ### Ideas ###
 MAG_fascist_splitters: "Фашистські розкольники"
 MAG_fascist_splitters_desc: "Колись Россійская Фашистская Партія була єдиною організацією, вільною від внутрішньої ворожнечі, що терзає все в Росії. Та єдність тривала недовго. Доктринальні суперечності між двома її очільниками, Константіном Родзаєвскім і Міхаїлом Матковскім, жевріли роками, а може, й десятиліттями. Нарешті вони вибухнули, коли Матковскій захопив портове місто Маґадан для власних потреб. Він обіцяє вільну Росію, розкуту Росію, Росію, звільнену від кайданів страждань і злиднів. Лише час покаже, чи дотримає він обіцянки."
 MAG_gateway_into_russia: "Брама до Росії"
 MAG_gateway_into_russia_desc: "Вождь обрав Маґадан осередком нашої боротьби не лише через збіг обставин. Береги цього крижаного тихоокеанського порту дарують чимало благ. Контрабандисти з Камчатки й Аляски щодня привозять до міста коштовні товари. Уряд Вождя багатіє завдяки цьому осередкові, а разом із ним зростає й наша легітимність."
 MAG_fascist_renewal: "Фашистське відродження"
 MAG_fascist_renewal_desc: "Ми пристосували режим до дійсности, не зрікаючись своїх амбіцій, і здобули підтримку з-за океану - схоже, ризик Матковского виправдався. З новою рішучістю та спорядженням ми більш ніж готові рушити сибірськими пустками й возз'єднати не лише партію, а й усю Батьківщину."
