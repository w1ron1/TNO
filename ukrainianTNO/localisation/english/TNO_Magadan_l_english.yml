 MAG.1.t: "Останні зі справжніх"
 MAG.1.desc: "Матковскій поправив окуляри й поглянув на аркуш із довгими рядами імен - список підозрюваних прибічників Родзаєвского. Кімната була забита книжками з часів Білої армії та старими американськими газетами; у темному кутку припадав пилом грамофон. Побачивши його, Матковскій усміхнувся: старий Харбін, танці й вечірки, а над усім - електрична свастика, що обіцяла майбутнє застряглим там росіянам.\n\nДзвінок вирвав його зі спогадів. Увійшли двоє грубих чоловіків у партійних одностроях - у тісній захаращеній кімнаті вони здавалися майже варварами. Чоботи гупали по дерев'яній підлозі, коли вони незграбно салютували: один худий, зі світлим волоссям з-під кашкета, другий кремезний і череватий.\n\nПісля незручної тиші Матковскій спитав: «Ну?» Тремтячими голосами вони назвали сьогоднішніх жертв чистки. «Дякую. Можете йти». Коли двері зачинилися, він повернувся до списку: Сєрґєй А., Бруно Б., Ніколас В. Густою чорною фарбою він викреслював їх з історії Россійской Фашистской Партії, а тоді поглянув на своє відбиття у віскі й відпив.\n\nМинали години. Дзвінок лунав знову, чоловіки салютували й повідомляли, які імена зникли. Іноді вітер доносив тріск рушничних пострілів із глибини лісу. Вночі список скінчився. Матковскій подякував виконавцям, випровадив їх і замкнув двері. Тоді ввімкнув грамофон і вирішив потанцювати зі спогадами про Харбін."
 MAG.1.a: "На Вождя чекає ще багато роботи."
 
 MAG.2.t: "Радіо Вільний Маґадан - випуск 1"
 MAG.2.desc: "Від початку все пішло не так. Перед розмовною програмою Радіо Вільний Маґадан пустило потріскувану добірку пісень: недосвідчені працівники, фашисти, звиклі лише до бандитизму, переборщили з басами й неправильно виставили високі частоти.\n\nЗвук урвався. Гуп. Ще раз. «Ця штука працює?» - хрипкий голос цмокав просто в мікрофон. «О, працює!»\n\nЗ дальнього кутка озвався плавний баритон: «Ми в етері, що ти, в біса, верзеш?» Три удари по столу. «Читай сценарій». Ніякова пауза. «Ти забув вимкнути мікрофон? Забув?» Зітхання. «Яка ж це клята катастрофа». Мікрофон від'єднали з тріском, а погано зведені пісні знову заторохтіли в першому етері.\n\nЗвук урвався ще раз. Хрипкий голос повернувся, досі надто близько: «Вітаю, росіяни Далекого Сходу. Це перший випуск Радіо Вільний Маґадан. Я Сєрґєй, сьогоднішній ведучий, а зі мною мій друг Васі...» Голос завмер, а за мить він загорлав: «Васілій!»\n\nВасілій гучно сів. «Так, із моїм другом Сєрґєєм ми супроводжуватимемо вас у довгі холодні сибірські ночі». Награне підбадьорення. «Дякуємо панові Матковскому, Вождеві РФП, за підтримку програми». Цокав годинник. «А тепер - музика».\n\nПеред її початком баритон устиг сказати: «Та що з тобою, чорт забира-»"
 MAG.2.a: "Оце так перше враження."
 
 MAG.3.t: "Претендент"
 MAG.3.desc: "«Вельмишановному претендентові на престол Росії, - починався лист, - ми благаємо про допомогу проти спільного ворога, зрадника Константіна Родзаєвского». Ні, надто прямо. Матковскій відклав перо, зітхнув і втупився в порожню сторінку. Поряд пахнув чай, але часу на нього не було.\n\nВін знову поправив окуляри й забарабанив пальцями. Що, як царисти відкинуть угоду або визнають умови неприйнятними? Без співпраці обох сторін проти Родзаєвского наслідки були б страшні. У двері постукали, та Матковскій лише продовжив відбивати ритм.\n\n«Лист ще не готовий. Ідіть геть». Стук стих. Він плеснув у долоні, глибоко вдихнув і сів, крутячи перо та міркуючи, що сказати Міхаїлові.\n\n«Звертаємося в ім'я старої дружби, - написав він, - у Антибольшевицькому фронті. Як усім відомо...» Рука прискорилася. Невдовзі він підведеться й скаже:"
 MAG.3.a: "«Лист готовий. Заходьте»."
 
 MAG.4.t: "Диверсанти завдали удару!"
 MAG.4.desc: "На наших кордонах шириться тривожна тенденція. Зрадники з Маґадану, схоже, домовилися з царистами Чіти. Тимчасове перемир'я? Чи навіть союз? Думки Міхаїла й Матковского, як завжди, затуманені.\n\nСьогодні спостерігачі знайшли прикордонників мертвими, а їхню зброю - зниклою. Це не поодинокий випадок: рейди з обох боків та руйнування решток совєцьких доріг і залізниць частішають. Сил ледве вистачає на один фронт. Коли нападають царисти, зрадники долучаються, змушуючи нас розпорошуватися й втрачати людей, зброю та здобич.\n\nРодзаєвскій сидить у кабінеті й міркує. Пакт став переломним для трьох частин Антибольшевицького фронту. Чи здолають царисти й зрадники Богом благословенного Вождя Росії, чи правда переможе зраду? Покаже час."
 MAG.4.a: "А ми терпляче чекаємо."
 
 MAG.5.t: "Людина в Білому домі"
 MAG.5.desc: "Ніколай Пєтлін поправив краватку - давня звичка з РФП - і поглянув на завдання Матковского. Друкарська машинка серед мотків стрічки була майже розкішшю; писати всі листи від руки він не уявляв. Помічники мало чим допомагали: англійської не знали, а просити Вождя було б недоречно.\n\nВін згадав наказ: «Переконай людину в Білому домі. Це все». Матковскій не терпів зневаги. Часом у ньому ще проступав старий харбінський дух - надія й молитва про новий дім, хоча зима вже виснажила його, лишивши запалі почервонілі щоки.\n\nПід столом лежали майже тисячі аркушів для сенаторів, конґресменів, російських емігрантів та всіх, хто міг підтримати проєкт Матковского. На найдальшій стопці - жовта тека з написом «Сибірський білль про права»: власні ідеї Пєтліна, покликані здобути американську допомогу чи бодай співчуття. Чи знав Матковскій про його справжні симпатії?\n\nПєтлін відігнав думки, поклав пальці на клавіші, і машинка заторохтіла."
 MAG.5.a: "Сподіваймося, це спрацює."
 
 MAG.6.t: "Граф фашизму"
 MAG.6.desc: "«Здарова, брате Матковскій!» - гукнув з причалу худий блідий чоловік. Анастасій Вонсяцкій, «граф російського фашизму», ступив на маґаданський берег і поспішив до свого нібито рівного в старому світі. Затиснувши носа від портового смороду, він здавався дрібним і жалюгідним на тлі дерев'яних рибальських суден.\n\nМатковскій насупився: ніхто не мав права так до нього звертатися. З болісною усмішкою він простягнув руку: «Здравствуйте. Як до вас поставилася Америка?»\n\nВонсяцкій негайно схопив його долоню. «Чудово, брате», - і потягнувся обійматися. Матковскій поступився. Америка змінила гостя: близькі жести, нестриманий запал, надмірна фамільярність. «Це земля вільних. Усе це, - він обвів порт рукою, - для нас замале».\n\n«Ви, здається, забули, навіщо прибули, брате», - холодно відповів Матковскій.\n\n«Ні, ні. Ця людина - мій подарунок вам». Вонсяцкій витяг чорно-білу світлину американця в береті."
 MAG.6.a: "«Розкажіть докладніше»."
 
 MAG.7.t: "Чарівник шепітливої смерти"
 MAG.7.desc: "Легка мжичка накрила маґаданський порт. Сталево-сірі хмари нависли над гаванню, хвилі билися об низькі мури, а дерев'яні рибальські судна тремтіли від вітру. Серед них вирізнялося одне - з металевою палубою й іржавим носом, незворушне перед негодою.\n\nМатковскій з ад'ютантом під парасолею підійшов до корабля. Якщо Вонсяцкій казав правду, власником був Мітчелл Вербелл - легендарний найманець, ветеран тисячі воєн, солдат удачі й Чарівник шепітливої смерти. Та назустріч цій легенді з судна, хитаючись, вивалився чоловік.\n\nЦе справді був Вербелл - зеленіший, ніж на світлинах, із беретом, що ледве тримався на голові. Матковскій поспішив до нього, а найманець видав незграбну усмішку, яку легко було сприйняти за зневагу.\n\n«Ласкаво просимо, - англійською сказав Матковскій. - Ми чекали на вас, пане Вербелл».\n\n«Прівєт, мій товаріщ», - відповів той і далі мішав російську з англійськими словами. Матковскій намагався спинити наругу над мовою, але марно: кілька правильних слів щедро пересипалися лайкою. Червоний від гніву й сорому, Вождь простягнув руку.\n\n«За початок прекрасної дружби», - промовив він крізь усмішку. Вербелл потис руку без вагань і без найменшого розуміння."
 MAG.7.a: "«Да, товаріщ»."
 
 MAG.8.t: "Смерть Вонсяцкого"
 MAG.8.desc: "«Пане Вонсяцкій! Ви там? Вождь чекає!» - Дмітрій гупав у двері.\n\n«Марно, - зітхнув Іван. - Я стукаю вже кілька годин, відповіді немає».\n\nДмітрій вирішив діяти інакше. Став навколішки, дістав відмичку й обережно взявся за замок. Двері мусили якось відчинитися; зламати механізм означало б лише ускладнити справу. Можливо, знадобиться сокира - ця думка його розвеселила. Іван кілька разів хотів заперечити: можна ж попросити запасний ключ, та Дмітрій не слухав.\n\nЗамок клацнув. «Бачиш?» - сказав він до Івана й повернув ручку, але двері не рушили. «Засув ізсередини, чорт забирай!» Він копнув двері. Іван відсунув його, взяв сокиру й кілька разів ударив; тріски розлетілися, і саме коли він майже здався, двері піддалися.\n\n«Пане Вонсяцкій, ви не...» Іван урвався. На підлозі, стискаючи груди, лежав Вонсяцкій - зі скляними очима й блідим обличчям. Мертвий.\n\nУвечері задзвонив телефон у кабінеті Матковского."
 MAG.8.a: "«Відкладаємо нашу платню, друже Матковскій»."
 
 MAG.9.t: "Переворот найманців"
 MAG.9.desc: "Іванові й Борісові не подобалося нове призначення. Напередодні операції їх перевели з політичного крила РФП до війська - інструктор назвав їх «мертвим тягарем». Офіцер видав гвинтівки й наказав триматися в тилу, де найбільше шансів вижити. Навколо було тихо, вітер свистів між сибірськими деревами.\n\n«Думаєш, Вождь прийме нас назад?» - спитав Боріс. Іван, що курив поряд, лише похитав головою й зашикав. Його рука тремтіла - від холоду чи страху перед війною.\n\nНа стежці з'явився найманець. Його видавали камуфляж, автомат, пояс із ґранатами й, понад усе, спокійна хода. Але йому належало бути на передовій, не тут.\n\n«Стій!» - Боріс підняв рушницю, найманець відповів тим самим. Іван теж прицілився. «Назад. Фронт он там».\n\nНайманець мовчки вистрілив. Боріса відкинуло, а Іван поранив нападника в плече.\n\nТакі сутички спалахнули по всій лінії. Операцію панічно скасували. Переворот Вербелла почався."
 MAG.9.a: "Заднім розумом усі мудрі."
 MAG.9.b: "Авантюра найманців удалася!"
 
 MAG.10.t: "Договір про співпрацю"
 MAG.10.desc: "«Ось договір, надісланий царистами, пане», - Пєтлін поклав проєкт на стіл. Він мало не поправив краватку, але суворий погляд Вождя спинив руку. Матковскій уважно читав дрібний шрифт, шукаючи лазівки для царистів або РФП, лише зрідка здіймаючи брову чи киваючи.\n\nВідклавши документ, він звернувся до міністра: «Пєтлін». Той похолов. «Добра робота. Ви перевершили мої сподівання. Перш ніж підписати, - Матковскій покрутив перо, - хочете щось додати?»\n\nПєтлін вдихнув. «Ні. Нічого». Вождь негайно поставив підпис.\n\n«Скінчено. Передайте представникові царистів: Вождь приймає угоду, і смерть Родзаєвскому». Він підвівся й простягнув руку. «Приємно знати, що тут хоча б одна компетентна людина відповідає за справи». На обличчі з'явилася рідкісна усмішка.\n\n«Так, пане. Зроблю, як наказано. Ваша похвала - велика честь для людини мого походження».\n\nМатковскій поплескав його по плечу. «Звичайний робочий день». Пєтлін пішов."
 MAG.10.a: "Смерть Родзаєвскому!"
 
 MAG.11.t: "Біла Миша"
 MAG.11.desc: "Вербелл поглянув на годинник: без двадцяти секунд десята вечора за сибірським часом. Радіо було готове, а всіх людей він вигнав із кімнати. Справа не була таємною, але сьогодні він хотів приватности: мав говорити зі старою подругою - якщо вона теж дотрималася розкладу. Сибірська справа давалася важко, Матковскій виявився не простаком. Вербелл усміхнувся: клятий виродок ще дістане своє.\n\nРівно о десятій він налаштував потрібну частоту. «Біла Мишо, ти там?»\n\n«Ти спізнився, - відповів добрий материнський голос. - Мабуть, роки таки сповільнили тебе». Вона засміялася. Біла Миша була однією з тих британок, що мали дух воювати й робили це добре, та товаришкою з часів, коли Америка впустила смолоскип свободи й скотилася сходами до ганьби. «Рада чути, Чарівнику».\n\n«Навзаєм, Мишо. Як Камчатка? Теж діра?»\n\nВін майже відчув її осуд. «Стеж за мовою, Чарівнику. Але так, тут нічого робити».\n\n«Досі служиш дядькові Сему?»\n\n«Авжеж. Знаю, ти пішов у вільне плавання, але УСС... тобто ЦРУ має пропозицію».\n\n«Забудь». Вербелл любив Ніксона, але не міг пробачити минулого; не тим боягузливим лібералам із їхніми «миром, землею та хлібом». Кляті комуністи. «Я пам'ятаю останню роботу на тих нікчемних...»\n\nМиша спинила його. «Ми врахували твої застереження», - і виклала план. Вербелл широко розплющив очі.\n\n«Оце план, - засміявся він. - Божевільні покидьки»."
 MAG.11.a: "Тіні густішають."
 
 MAG.12.t: "Радіо Вільний Маґадан - випуск 45"
 MAG.12.desc: "Сибірські мисливці сиділи навколо столу з американським батарейним радіо, купленим у підозрілого торговця в маґаданському порту. Полірована поверхня блищала тією особливо американською позолотою, що робить дешеву річ розкішною. Вони налаштували Радіо Вільний Маґадан за записаною частотою.\n\nЦього разу звук був кращий. Мисливці мугикали російські патріотичні пісні, хоч і не знали слів. Перед розмовною програмою радіо не обірвалося, а лише стихло.\n\n«Вітаємо на Радіо Вільний Маґадан! Єдиному джерелі новин Далекого Сходу! Зі мною мій співведучий Васілій!»\n\n«Вітаю. Попереду ще одна холодна ніч, але РВМ нікуди не подінеться. Яка тема, Сєрґєю?»\n\n«У мене геніяльний американський винахід - дезодорант!» Кришка гучно клацнула. «Чуєте запах, пане Васілію?»\n\n«Хм. А що він робить?»\n\n«Блокує запах тіла!» Сєрґєй удав, ніби маститься. «Імпортований з Америки - саме для вас, сибірські дикуни з лісів». Запала тиша. «Пане Васілію, чому ви так на мене диви-»"
 MAG.12.a: "Презентацію ще треба підтягнути."
 
 MAG.13.t: "Сибірські рейнджери"
 MAG.13.desc: "Ішов п'ятий день Олєґового вишколу з виживання. Темний ліс здавався безмежним; перед ним лежали згасле вогнище й учорашня здобич - дві лисиці та кролик. Прокинувшись, він оглянув пістолет, натиснув фіксатор магазина й відтягнув затвор. Набій із дзвоном вилетів угору. Решта була на місці.\n\nЗброя ще не знадобилася. Ведмеді й леопарди не наближалися, а дрібну дичину ловили пастки: постріл зіпсував би м'ясо. Щоб вижити, зрозумів Олєґ, треба вміти не лише застосовувати силу, а й стримувати її.\n\nВін повернув набій у магазин і взявся до щоденного ритуалу. Розібрав пістолет на висушеній кролячій шкурі, обережно вимив кожну деталь, витер насухо й закляклими пальцями зібрав назад. Вставив магазин, пересмикнув затвор. Клац. Олєґ усміхнувся: і сьогодні все добре.\n\nСибірські рейнджери повернуться по нього будь-якого дня."
 MAG.13.a: "Гідний новобранець."
 
 MAG.14.t: "Кінець Бандитського короля"
 MAG.14.desc: "Родзаєвскій у лахмітті вийшов у суворий ранок. Позаду йшли двоє охоронців РФП, цілячись у серце й голову, хоча втечі можна було не боятися: колишній харбінський вогонь у його очах згас. Закутий по руках і ногах, він шкутильгав уперед.\n\nПопереду стояла імпровізована шибениця для колишнього очільника РФП. Бандитський король Амура йшов до смерти, мов найбідніший жебрак Далекого Сходу. За наказом Матковского троє людей стерегли місце, щоб страта лишилася приватною: попри все Родзаєвскій був колишнім членом партії, а вона дбала про своїх.\n\n«Стій, - сказав охоронець біля сходів. - Що Вождь сказав тобі вчора?» Усі чекали відповіді.\n\n«Нічого особливого, - тихо мовив Родзаєвскій. - Може, вже скінчимо?» Слова Матковского він збирався забрати в могилу. Йому накинули зашморг, поставили на табурет і знову наставили гвинтівки.\n\nПотреби не було. За мить охоронець вибив табурет."
 MAG.14.a: "Так помирає божевільний."
 
 MAG.15.t: "Вождя врятовано"
 MAG.15.desc: "Іван ніс Боріса на спині. Він не був лікарем і не знав, чи куля зламала кістку, розірвала вену або влучила в орган; найманець поцілив у плече, тож надія була. Горілкою, шматтям і бинтами з тіла нападника він спинив кров. Боріс стогнав на кожній нерівності, але дихав - отже, жив.\n\nУсю дорогу до табору Іван кричав до хрипоти: «Медика! МЕДИКА!» Та ліс мовчав. Боріс важчав, наче хрест на плечах, його подих коротшав, а дерева не розступалися.\n\n«Недалеко», - повторював Іван на кожному кроці. Каміння й гілки гальмували його, свідомість пливла. Він хотів легенько вколоти палець ножем, але в паніці розсік долоню. Неглибоко - саме щоб не заснути. Перев'язав руку й пішов повільніше.\n\nЗа пів години він знайшов табір порожнім: медики й більшість війська втекли. Уночі Іван поклав друга на землю й тримав за руку, поки дихання слабшало. Якби швидше... Він справді намагався, та доля не дозволила Борісові жити.\n\nЗате дозволила вдача. Загудів клаксон, фари вихопили Івана зі сльозами в очах. «Друг чи ворог? Росіянин чи найманець?»\n\n«Друг. Росіянин. Ви в безпеці. Вождь чекає в Маґадані. Сідайте»."
 MAG.15.a: "Матковскій вижив."

 MAG.16.t: "Розібратися з божевільним"
 MAG.16.desc: "День Родзаєвского не задався. Сонце різало очі, після вироку він не спав усю ніч. У наручниках хруснув пальцями. Його вели далеко в сибірський ліс, геть від цивілізації. Тіло сіпалося, ломка стискала розум, а кістки проймав холод.\n\nКонвоїри говорили чужими мовами й підганяли його дулами. Хтось серед них знав російську, але хто саме - невідомо. Повітря теплішало, тіло вкривав піт.\n\nДумки повернулися до Матковского. Тіла так і не знайшли. Родзаєвскій знав його хитрість, а Сибір був безмежний - для пошуку потрібні тисячі вартових. Диявол! Матковскій був гідним суперником: росіянином, що боровся за владу, а не найманцем за гроші.\n\nНа галявині російськомовний конвоїр зав'язав йому очі - навіть у найманців лишилася крихта людяности. Позаду зашурхотіли кроки, рушниці націлилися. Пролунав наказ, загримів залп. Родзаєвскій упав мертвим."
 MAG.16.a: "Бандитський король мертвий і не повернеться."
 
 MAG.17.t: "Звіт для Ленґлі"
 MAG.17.desc: "Передача 01. Аґент Мейсон, Маґадан.\n\nТема: огляд вишколу й спорядження сил Матковского.\n\nЗміст:\n\nДо нашого прибуття за дорученням Конґресу й Міністерства оборони більшість «збройних сил» Матковского складалася з недосвідченого фашистського ополчення. «Солдати» мали напівнесправні Арісаки й Мосінки часів Великої війни - добрі для воскової музейної армії, але не для Вождевого «тотального хрестового походу за порятунок Росії».\n\nМи негайно почали вишкіл і виявили іншу проблему: в «офіцерському корпусі» панувало кумівство, а люди, що ледве тримали рушницю, носили звання лейтенантів, капітанів і майорів. На нашу вимогу Вождь звільнив їх і дозволив створити офіцерські школи.\n\nФронтові звіти свідчать про добрі наслідки: у прикордонних сутичках ефективність помітно зросла незалежно від перемог чи поразок. Продовжимо спостереження й доповіді. Мейсон, кінець зв'язку."
 MAG.17.a: "Вражаюче зростання."
 
 MAG.18.t: "Солдати бєз ґраніц"
 MAG.18.desc: "Люди Вербелла відразу відрізнялися від ополчення РФП. Вони ходили Маґаданом у дорогому спорядженні, загравали до жінок і не переймалися Росією: це був черговий майданчик, де можна постріляти в місцевих. Сміт, південноафриканець без відомого імені, понад усе прагнув натиснути на гачок і відчути варварський захват бою.\n\nВербелл не збрехав про спорядження. Смітів M16 був найлихішим свинцевим плювачем по цей бік Росії; ополченці отримували лише старі M1 «Ґаранд». Африканські поля, савани й джунґлі випалилися на його мідній шкірі. Вдома він казав, що пішов у найманці «шукати пані», але справжні знайомі знали: його цікавили війна й гроші.\n\nРосіяни заздро дивилися на його спорядження й охайні сигарети; іноді він навіть пригощав. Війна була ремеслом, а справи йшли добре. Сміт сперся на стіну в глухому містечку й закурив.\n\nДля покинутої діри Маґадан був непоганий, хоч не Блумфонтейн. Та серце кликало на захід, до ліній царистів і прибічників Родзаєвского, під кулі й артилерію. Він кинув сигарету й розчавив. Час до бою."
 MAG.18.a: "«Сміт на зв'язку»."

 MAG.19.t: "Людина, що продала Вождя"
 MAG.19.desc: "Свідомість Дмітрія то занурювалася під смерть, то здіймалася над нею. Чужий предмет засів у лівому плечі, біль палав сонцем і віддавав запахом міді. Він ледве пам'ятав події й чекав, що Іван покине його - переведення сталося через Дмітрієву гордість. Та тіло хиталося, не падаючи: Іван ніс його.\n\nНехай Іван був мовчазний, грубий і дурний - другом він був добрим. Зранений розум сумнівався, але серце благало надіятися й відмовлялося вмирати. У міру того як минали години, інстинкт став єдиною ниткою життя, за яку Дмітрій тримався на кожному повороті стежки.\n\nНарешті ноги Івана підкосилися. Дмітрій упав на землю, бинти розірвалися, рана відкрилася. Кроки, зброя, грубі голоси чужими мовами. Втрачаючи свідомість, він почув постріли й побачив спалахи. Усміхнувся: Іван не здавався без бою. А тоді свідомість розсипалася пилом у зимовому лісі."
 MAG.19.a: "Така ціна поразки."

 MAG.20.t: "Власний прихисток"
 MAG.20.desc: "Вербелл п'яним вивалився з дверей. Вони зірвали куш: Матковскій десь ховався, але більше не заважав; Родзаєвскій лежав у землі разом зі своїм безумством. У колишній твердині РФП почалося свято, солдати й місцеві змішалися в юрбі, алкоголь лився від шинків до штабів. Переможцеві - здобич. А Вербеллові - випивка.\n\nЗа стіною радилися офіцери. Крізь дерево долітали уривки слів, але мозок, просочений віскі, не затримував їх. Нічого: цим людям можна було вірити не лише через платню. Зі звичайними найманцями він би вже горлав і стріляв у стелю.\n\nУ чарці чекало віскі. Випити? Краще не ризикувати. Ніч була історична: сусіди творили історію.\n\nДвері рипнули. «Пане? Є важливе питання».\n\n«Кажи вже. Віскі кличе».\n\n«Ми визначили устрій... Республіки. Лишилася назва».\n\nВербелл театрально підвівся. «Ми на захід від Аляски, - вигукнув він, мало не впавши. - Західна АЛЯСКА!»\n\nОфіцер кліпнув. «Чудовий вибір, пане»."
 MAG.20.a: "«А чому б, у біса, й ні?»"
 
 MAG.21.t: "Нові обрії"
 MAG.21.desc: "Матковскій увійшов до кабінету Родзаєвского, наказавши охоронцеві чекати. Тут зберігалися справи майже всіх членів РФП. Він не сподівався від Бандитського короля такої акуратности. На столі перед відчиненим вікном юрмилися алкоголь, наркотики й кава, виблискуючи в слабкому світлі.\n\nЗатиснувши носа, він витяг шухляду: розділ М, Матковскій Міхаїл. На обкладинці - його молоде вродливе фото, усередині - чисті, охайно надруковані сторінки, наче добрий лист. Та довгі фрази сипали прокльонами; особливо впало в око «кошерний фашист». Матковскій усміхнувся: не змінюйся, старий друже.\n\nЛишалося скласти список. Крило Матковского не могло просто прийняти всіх людей Родзаєвского. Одні розділять долю господаря, інші підуть шукати щастя в сибірських пустках, ще інші - заблудлі сини Росії - повернуться до партії. Усі служитимуть Матковскому. За Сибіром чекала сама Росія."
 MAG.21.a: "Справжнє втілення амбіції."
 MAG.21_tt: "І ось РФП знову єдина."
 
 MAG.22.t: "Сибірський білль про права"
 MAG.22.desc: "«Це надто ліберально, Пєтлін. Майже соціялізм», - Матковскій стримував гнів, притискаючи пальцем теку. Як його міністр і майже брат міг таке принести? У Пєтлінових очах осіли страх і покора. Можливо, це справді не був навмисний виклик.\n\n«Пане, дозвольте пояснити. Американці відрізняються від нас. Треба...»\n\n«Я розумію. Але це не те, за що стоїмо ми. Тут є “право на збори”, “свобода слова”. Небезпечні, непридатні для Росії ідеї, від них віє заколотом. Про що ви думали, брате?»\n\nПєтлін випростався. «Мої ідеї ще можуть придатися - переконати не лише американців, а й росіян. Я вірю в силу наших переконань і прошу не сприймати мою некомпетентність за бунт».\n\nМатковскій великодушно розвів руки. «Я б ніколи. Ви з нами від початку, ближчі за канцлера. Допоможіть із цим - вашому братові бракує хисту переконувати американців».\n\n«Т-так. Зроблю, як скажете».\n\n«Добре. Скоротіть. Ми не можемо всього дозволити. Зробіть дірки й лазівки. Вільні». Пєтлін квапливо вийшов."
 MAG.22.a: "Без жертв не обійтися."
 
 MAG.23.t: "Боже, благослови дядька Сема"
 MAG.23.desc: "Мейсон нервував. Американський аґент, навчений книжної й розмовної російської, він досі майже не спілкувався з солдатами, а тим паче не вчив їх користуватися американською зброєю. Іронія: випускник однієї з найвідоміших країн світу почувався таким самим недолугим, як неписьменні російські фашисти перед ним. Холодний ранок домішував до швидкого серцебиття тривогу й захват; полігон був порожній, лише дрібні звірі шастали під ногами.\n\nОфіцер представив його пишними словами про «славетну Америку». Банальності й канцелярщина, але солдати мали спершу заповажати інструктора. Дехто вже задивлявся на привезене спорядження - нічого особливого для аґента, зате диво для них.\n\nПісля кількох тривожних хвилин настав його час. «Вітаю, я Мейсон». Він узяв M1 Garand. «Це Ґаранд. Ти, - показав на солдата, - стріляй у мішень якнайшвидше». Той після кожного пострілу вручну викидав гільзу, часом ляскаючи гвинтівку долонею, щоб вона запрацювала.\n\n«А тепер дивіться». Мейсон випустив вісім куль поспіль, аж магазин дзенькнув. «Оце американська вогнева міць!» - оголосив він приголомшеним фашистам."
 MAG.23.a: "«Питання є?»"

 MAG.24.t: "Маґаданські пустки"
 MAG.24.desc: "Міхаїл Матковскій стояв над великою мапою Маґадану й околиць у конференц-залі. Місто існувало, але майже вся підвладна земля була безлюдна, нерозвинена або й те, й інше - кепська база для уряду, якому конче потрібні люди й промисловість. Коли міністри зібралися, він указав на мапу: «Нинішнє промислове становище неприйнятне. Треба діяти, щоб південні суперники з японською підтримкою нас не зім'яли».\n\nҐольцов відповів: «Роботи буде багато, але я теж про це думав. Підготуємо пропозиції: індустріялізація під прямим наглядом уряду й залучення іноземних інвестицій будь-якими засобами».\n\n«Добре. Я не збираюся просто зрівнятися з Родзаєвскім і білими - я хочу перевершити їхнє виробництво». Усі зрозуміли: Вождь прагнув перетворити Маґадан із перевалочного пункту для таборів і копалень на промислове місто. Нелегко, але якщо він хотів - це буде зроблено. «Тоді до роботи»."
 MAG.24.a: "Роботи непочатий край."

 MAG.25.t: "День інспекції"
 MAG.25.desc: "Сам Вождь прибув до маґаданського гарнізону. Холод не брав його в парадному однострої, та ще здалеку він побачив, наскільки кепські його солдати. Генерали нервово перезиралися.\n\nОдин був затовстий, другий виснажений, третій закороткий, у четвертого неправильно застебнутий однострій. Убрання ніби позичене по шматках, зброя застаріла ще до німецького вторгнення. У найважливіший день ці люди не спромоглися показати бодай крихту професіоналізму: неохайні бороди, старі рушниці, жодної дисципліни. Матковскій знав, що винен передусім брак людей, зброї та офіцерів.\n\nПісля огляду він скликав командування й рідкісно спалахнув: «Що відбувається? Це найкраще, що ви маєте?» Почалися виправдання, але він підняв руку. «Якщо так виглядає охорона столиці, то що на фронті? Як ви здолаєте Родзаєвского, не кажучи про всю Росію? Мені байдуже, яким буде розв'язання. Знайдіть його й доповісте завтра»."
 MAG.25.a: "Та годі, не все аж так погано."

 MAG.26.t: "Є поступ"
 MAG.26.desc: "За місяці після нищівної інспекції становище несподівано покращилося. «Коли зрозуміли, що призовники не годяться, - казав старший офіцер, - купили солдатів за кордоном». Найманці й радники прибували до крижаного порту, поповнювали армію та силоміць привчали її до професіоналізму. Товсті схудли, виснажені зміцніли, з'явився бойовий дух, стару зброю бодай чистили. Простий вишкіл готував до сучасної війни в лісах і болотах Сибіру. Рахунок був довгий, але Матковскій вірив, що платити буде чим.\n\nПісля другого раптового огляду генерали тривожно зібралися. «Хочу подякувати всім, - стримано сказав Вождь. - Завдання було нелегке. До досконалости далеко, але поступ мене тішить. Я не очікував шляху найманців та іноземної підтримки, проте він працює. Радитимуся, як збільшити число й ефективність іноземців. Дякую. Вільні»."
 MAG.26.a: "Оце вже на щось схоже!"

 MAG.27.t: "Радіо Вільний Маґадан - випуск 60"
 MAG.27.desc: "«Васілію, сьогодні покажемо слухачам щось нове, - сказав хрипкий голос. - Вони не бачать студії, тож я опишу... Ой, упустив. Це американський M1911 - подарунок друзів із ЦРУ».\n\n«Не розмахуй ним, Сєрґєю. Він заряджений. Перепрошую, слухачі: мій друг трохи дурень».\n\n«Не будь таким похмурим! Тут є запобіжник. Чуєш?» Клац. Клац. Клац. «Механізм не стріляє! Розумні люди ці американці».\n\n«А чим він кращий за російську зброю?»\n\n«Потужність рушниці в малому зручному корпусі: навіть найгірше озброєний солдат небезпечний!» Пістолет брязнув об стіл. «Зараз підніму й покажу».\n\n«Не розмаху...» У вухах задзвеніло від пострілу. «Що ти, в біса, наро-»"
 MAG.27.a: "Звичайний день у студії РВМ."

 MAG.28.t: "Радіо Вільний Маґадан - перерва на каву"
 MAG.28.desc: "У їдальні РВМ двоє ведучих пили каву, поки техніки стежили за етером. До кави були грінки й американський джем; зв'язки партії зі США матеріалізувалися у Coca-Cola, Lucky Strike та порошковій каві.\n\n«Чув про перемогу на заході?» - спитав Сєрґєй. Васілій кивнув. «Вождь приїде виголошувати велику промову». Він відкусив грінку. «Смачно».\n\n«Кажуть, нам уріжуть платню», - мовив Васілій. «Це правда. Я давно чекав: нині стільки електриків і техніків. Добре, що маю заощадження».\n\n«Які?» - спитав Сєрґєй із повним ротом.\n\n«Усякі. Мій батько був охоронцем Родзаєвского. За роки можна дещо знайти».\n\n«Дивно, що Вождь тебе не розстріляв».\n\nВасілій хихикнув. «Сам дивуюся. Але хто тоді прикривав би твої провали, пане Сєрґєю з РВМ?»\n\n«Мабуть, правда. Без тебе я б пропав», - засміявся той."
 MAG.28.a: "Неймовірна дружба."

 MAG.29.t: "Помінятися обличчями"
 MAG.29.desc: "«Гей! Це ти!»\n\nТом обернувся до п'яного росіянина з пляшкою й ламаною англійською. Його прямота нагадала дім і весело завершувала довгий день.\n\n«Ти помилився, приятелю...»\n\n«Не жартуй зі мною, американцю! Ти Джон... герой у ковбойському капелюсі! Ходімо!»\n\nЧоловік обійняв Тома за плече й повів до центру. Том озирнувся на команду й сумний холодний док, мало не скинув руку, але розслабився. Чому б трохи не побути Джоном Вейном?\n\nУ барі новий товариш Алєксандр вибив двері ногою.\n\n«Браття! Дивіться, який американець прийшов контрабандити до нашого порту! Той самий з кіна!»\n\nПрисутні мовчки дивилися, роздратовані виставою. Том усміхнувся й заговорив карикатурною південною говіркою.\n\n«Ну, здоровенькі були, народе!»\n\nБар вибухнув сміхом і вигуками. П'яні охоче підтримали фантазію, інші просто веселилися. Том грав роль і балакав за пивом до ночі. День таки був добрий."
 MAG.29.a: "Тепла ніч у дуже холодному місці."

 MAG.30.t: "В ім'я дріб'язку"
 MAG.30.desc: "«Більше нічого немає», - гаркнув крамар, оточений бандитами РФП у коричневих одностроях. Вони розгромили крамницю; дрібнички валялися на підлозі, а витрушені з кишень монети лежали на прилавку. Союз не був досконалим, але бодай не ставив над людьми дорослих дітей у фашистській формі.\n\nХудий фашист з істеричним голосом ударив по прилавку. В очі його звали Владом-Босом, поза очі глузували зі зросту й шепотіли про зв'язки в керівництві. «Знаю, що в тебе ще є. Боґдане, заради старої дружби. Не хочеш же втратити все? Я терплячий, а мої друзі - ні. Заплати, і я знову тебе прикрию».\n\nУ Боґдана справді нічого не було. Після падіння Союзу торгівля занепала, та він тримався за крамницю з упертої ностальгії. «Зачекайте». Під столом відкрив родинний сейф: пістолет і прикраси покійної дружини. Рука потяглася до зброї, та завмерла. Не сьогодні. Нерозумно. Він віддав Владові обручку дружини.\n\n«Радий, що ти поступився, - сказав Влад. - Ти ж один із наших улюблених клієнтів»."
 MAG.30.a: "«До зустрічі, Владе»."

 MAG.31.t: "Самотні вогні"
 MAG.31.desc: "Зовні Сєрґєй Дмітрієвіч Соловйов не був небезпечний для РФП: друкарня дотримувалася правил і часом друкувала партійну пропаганду. Та безмісячними ночами при одній гасовій лампі маска спадала. Він ковтнув гидкої горілки з місцевої ґуральні - кращу забирала партія.\n\nЗа столом Сєрґєй переглянув написані листівки. Невдовзі «бригада зі збирання сміття» забере їх і рознесе Маґаданом; за мовчання він трохи платив.\n\nМайже заснувши, він спитав себе: навіщо? Опір був мізерний, люди вірніші грошам, ніж ідеї. Лампа гасла - один вогник проти темряви. Символ був очевидний: за дні, тижні чи рік самого Сєрґєя могли погасити в підвалі. Він відігнав страх.\n\nПостукали. Сєрґєй підвівся відчинити."
 MAG.31.a: "Жарини минулої доби."

 MAG.32.t: "За екранами"
 MAG.32.desc: "Натовп радів - рідкісне видовище в Росії. У «кінотеатрі» не було навіть похилих рядів, і люди штовхалися за погляд на екран. Томас сидів у проєкційній з пляшкою горілки від самого Вождя, що вмостився попереду. Горілка виявилася слабкою й смакувала землею. Жах.\n\nНа екрані зелені плями бігли на чорні. Показували екранізацію американського коміксу про Капітана Америку. Для Томаса, великого знавця кіна, це було сміття, а зображення й звук - ще гірші. Непридатну лінзу він закріпив стрічкою, тож картинка лишалася розмитою, а тріскуче уривчасте аудіо робило перегляд фантастичним.\n\nПопереду сміявся Міхаїл Матковскій, самопроголошений Вождь росіян, харизматичний і майже страхітливий. Кумедно було бачити, як він тішиться тому, що американці назвали б мотлохом. Розум, схоже, не покращує смаку.\n\nГерой кинувся вперед, коричневі плями попадали, натовп загув. Томас нахилився по горілку, перекинув її й залив підлогу. Він зітхнув."
 MAG.32.a: "Це буде довга-довга ніч."

 MAG.33.t: "Погляд мисливця"
 MAG.33.desc: "Нікіта впевнено ввійшов до Маґадану. За спиною висіла рушниця - надійна вага його ремесла, у руках - лосина шкура, гідна харбінського пана. Сьогодні він міг заробити більше, ніж треба на тиждень: на сигарети чи банку порошкової кави. Уявив навіть Вождя в одязі з цієї шкури.\n\nВходи стерегли чиновники й бандити РФП у коричневому, але тепер поряд були нові люди: елегантні, озброєні до зубів, що говорили тисячею мов - Вавилонська вежа на краю Росії. Найманці трималися окремо, росіяни дивилися з вічною підозрою. Нікіту впустили, залишивши рушницю на заставі.\n\nШкуру він продав добре - вистачить на кулі, харчі й ліки. У місті з'явилися дешеві американські товари: кава, сигарети, навіть радіо, хоч надвечір усе розкуповували. Нікіта придбав сигарети й порошкову каву та з усмішкою рушив додому, на сибірську північ."
 MAG.33.a: "Ще один добрий улов."

 MAG.34.t: "Напруження зростає"
 MAG.34.desc: "Усе почалося з блекджеку в барі Алєксєя біля маґаданського порту. Місцеві грали на кілька чарок і сотень рублів та чекали звичайної ночі - порожніх кишень і п'яної ходи додому.\n\nУвійшли троє новоприбулих, люди Вербелла: важко озброєні, щедро оплачені професіонали з різних країн і з надлишком вільного часу. Спершу з місцевими вони просто не спілкувалися - кивки й уривчасті погляди.\n\nПеремир'я скінчилося, коли найманці почали загравати до дівчат за прилавком. Місцеві лаялися незрозумілою їм мовою; солдати витягли пістолети. Один випадково вистрілив і вбив цивільного, якого знайшли лише після заворушень.\n\nПостріли не спинили натовп: люди кинулися з пляшками й стільцями. Прибула підмога найманців, а партійну поліцію зустріли кулі та скло.\n\nПісля десятка вбитих і двох десятків поранених бунт придушили. Трьох найманців негайно засудили. Поліція виконала роботу - через дві години."
 MAG.34.a: "Може, передвістя?"

 MAG.35.t: "Маски"
 MAG.35.desc: "Катєріна побачила батька біля входу до дому. Він стискав скроні, ніби від нестерпного болю, й не помічав її. Так було не вперше: перед входом він завжди затримувався. Помаранчевий захід старив його й без того літнє обличчя. Він вступив до партії ще в Харбіні та воював в Антибольшевицькому фронті.\n\nУ партійному керівництві його насмішкувато звали Владом Високим. Решта - бандитом, злочинцем і грабіжником у формі РФП. Крамарі й рибалки дивилися зі страхом, осудом та огидою, але розбігалися, щойно Влад діставав старий «Намбу», який носив від часів Харбіна.\n\nТа Катєріна не бачила в самотньому силуеті потвори. Поруч із нею батькова маска спадала: крижана відчуженість, жорсткість і холод танули, відкриваючи якщо не порядну людину, то її оболонку.\n\nВона вибігла, схопила його за руку й усміхнулася: «Вечеря готова. Заходь!»"
 MAG.35.a: "Образ людини, написаний різними відтінками."

 MAG.36.t: "Записка з Росії"
 MAG.36.desc: "Президентська довідка про Вільну державу Маґадан\n\nЗміст:\n\nВід кінця Другої світової війни Росія лишається великою невідомою. Після «Барбаросси» й розпаду Совєцького Союзу ЦРУ майже не мало відомостей. Окрім Західноросійської війни п'ятдесятих, країна здавалася осередком кривавих чвар, де німецькі бомбардування не давали місцевим режимам зміцнитися.\n\nТак є принаймні на заході Росії та в Сибіру. На безмежній землі від Балтики до Тихого океану лишилися ділянки, не охоплені хаосом біля Райху. Відомо, що в Центральному Сибіру, головному здобувачеві Сибірського плану Бухаріна, між двома війнами постала й упала Республіка.\n\nДалекий Схід ЦРУ спостерігає давно. Законний совєцький уряд під тимчасовим керівництвом Ґєнріха Яґоди відступив туди після поразки; потім із Маньчжурії та Харбіна прийшов Антибольшевицький фронт, здобув землі й розколовся на Чіту, Маґадан та Амур.\n\nОсобливий інтерес становить Вільна держава Маґадан місцевого фашиста Міхаїла Матковского. Він і міністр Ніколай Пєтлін обіцяють реформи й демократію в обмін на американську підтримку їхнього «великого хрестового походу за Росію» та розвіддані.\n\nРішення належить Президентові. Аґентство застерігає від підтримки фашистів і відзначає Пєтліна як податливішого майбутнього керівника. Хай яке буде рішення, Аґентство його виконає."
 MAG.36.a: "Дамо обережну підтримку в обмін на реформи - розвіддані нам знадобляться."

 MAG.37.t: "Нічні жахіття"
 MAG.37.desc: "Сморід поту. Страх безпорадних «виродженців». Чергове досвітнє вторгнення, чергового комуністичного шпигуна вирвано з харбінської родини. Японці добре платили за живих в'язнів; людям РФП було байдуже, навіщо. Кожен зниклий большевицький покидьок означав більше зброї. Усе для Національної революції.\n\nПєтлінів однострій був бездоганний. Він смакував мить, коли в очах полонених помирала надія. Дехто опирався до передачі японцям, більшість ставала порожньою оболонкою. Їхнє життя було в його руках. Добре бути правою рукою Родзаєвского, суддею всіх, хто не корився російським фа...\n\n«Ні!» Він прокинувся в поті. Він ніколи не ходив на викрадення. Лише чув чутки. Лише...\n\nЛідії не було - мабуть, у вбиральні. Серце калатало. Харбінські спогади були водночас тьмяними й яскравими. Пєтлін знав, що робили найгірші бандити РФП, і нічого не зробив - переважно з байдужости. Тоді він вірив, що Вождь не помиляється. Провина була і його. Можливо, спокути немає. Та спробувати треба."
 MAG.37.a: "Минуле поховано лише наполовину."

 MAG.38.t: "Пропозиція від «поміркованих»"
 MAG.38.desc: "До Чіти несподівано прибув представник крила Міхаїла Матковского в РФП. Він стверджує, що скоро спалахне війна між фашистами Матковского й Родзаєвского, та просить перемир'я з нами, аби зосередитися на ворогові.\n\nДовіряти цим огидним фашистам важко, але Родзаєвскій зараз значно небезпечніший. Звісно, перемир'я триватиме лише до кінця їхньої війни..."
 MAG.38.a: "Гаразд, але ми за ними пильнуватимемо."

 MAG.39.t: "Звичайний робочий день"
 MAG.39.desc: "Алєксандр Павлов мерз у затонкому пальті перед ватажком загону безпеки РФП. «Загін безпеки» звучало надто поважно для погано споряджених бандитів, але вони виконували накази, а грошей у Вождя було мало - доведеться працювати з ними.\n\n«Підготовку завершено?»\n\n«Так, пане. Люди оточили склад і чекають наказу атакувати».\n\nПавлов усміхнувся до складу тією усмішкою, яку всі називали моторошною. Він чудово розумів чому: любив роботу більше, ніж це вважали нормальним, і ніколи не вагався наказувати гасити людські життя, мов нічні свічки. Він розумів - і йому було байдуже. Усе заради фашизму."
 MAG.39.a: "Вогонь на ураження. Полонених не брати."

 MAG.40.t: "Наглядач"
 MAG.40.desc: "Навіть як на Далекий Схід це був паскудний бар: підлога рипіла, пиво смакувало ведмежою сечею, водогону не було. Та Вербелл обрав його для зустрічі. Павлов не був у захваті. Матковскій дбав про образ перед американцями, а тепер американці прийшли й поводилися як свині. Найманці смерділи, пиячили й говорили потворними акцентами. Але перехід Павлова від упорядкованого фашизму до хаотичного світу грошей був тяжкий, і йому конче потрібна робота. Він вирішив вислухати Вербелла.\n\nКапітан найманців спізнився на пів години. Павлов випростався: «Пане Вербелл, радий знайомству. За попереднього уряду я був головним Вождевим фахівцем із внутрішньої безпеки. Якщо довірите мені ці справи, швидко переконаєтеся в моєму професіоналізмі».\n\nВербелл мовчав. Павлов спершу прийняв це за роздуми, а тоді зрозумів: той нічого не втямив і майже не знав російської. Вербелл покликав іншого найманця, і переговори продовжилися через його трохи менш кепський переклад - на диво плідно. Американцям бракувало вірних місцевих, а Павлов охоче заповнював прогалину."
 MAG.40.a: "Колаборант раз - колаборант назавжди."

