 #OG Cabinet/OSS/Intelligence contacts
 MAG_WA_OSS_ministers_effigy: "§BРозвідувальні зв'язки§!"
 MAG_WA_OSS_ministers_effigy_desc: "Керувати важко, особливо коли піддані ненавидять тебе всією душею. На щастя, потрібні зв'язки можуть бодай трохи полегшити справу.\n\nПрезидент Вербелл завжди мав контакти в ЦРУ та давніх друзів із часів служби в Управлінні стратегічних служб. Настав час скористатися цим і знайти охочих вирушити до Росії."
 MAG_WA_OSS_Boris_Pash: "Призначити Боріса Паша"
 MAG_WA_OSS_Serge_Obolensky: "Призначити Сержа Оболенскі"
 MAG_WA_OSS_Chiyoki_Ikeda: "Призначити Чійокі Ікеду"
 MAG_WA_OSS_Bernardo_De_Torres: "Призначити Бернардо де Торреса"
 MAG_WA_OSS_Gordon_Ingram: "Призначити Ґордона Інґрема"

 #Mercenary contacts
 MAG_WA_mercenary_ministers_effigy: "§OЗв'язки з найманцями§!"
 MAG_WA_mercenary_ministers_effigy_desc: "Нині саме найманці втримують нас при владі, і їх ніколи не буває забагато. Віддані грошам більше, ніж будь-якому урядові, вони ідеально годяться для підтримання миру в цій російській пустці.\n\nЗ доброю зброєю вони зможуть бити комуністичні чи фашистські ополчення, поки ми створюємо добірніше військо. Без найманців цієї держави взагалі б не існувало - нехай прибувають і далі!"
 MAG_WA_mercenary_Gerry_Patrick_Hemming: "Призначити Джеррі Патріка Геммінґа"
 MAG_WA_mercenary_John_Peters: "Призначити Джона Пітерса"
 MAG_WA_mercenary_Roger_Faulques: "Призначити Роже Фолька"
 MAG_WA_mercenary_Fernando_Calistrat: "Призначити Фернандо Калістрата"
 MAG_WA_mercenary_Gerry_Moggach: "Призначити Джеррі Моґаха"
 MAG_WA_mercenary_Roy_Larsen: "Призначити Роя Ларсена"

 #Collaborators
 MAG_WA_collaborator_ministers_effigy: "§YРосійські колаборанти§!"
 MAG_WA_collaborator_ministers_effigy_desc: "Ми перемогли харбінську трійцю та НКВД, але це ще не означає, що їх треба назавжди списати. Партизани й повстанці й далі безчинствують у країні, а покласти цьому край можна лише додатковими людськими ресурсами.\n\nЯкщо під рукою є чимало охочих і здібних оперативників, варто їх використати. Поміркованіші з них стануть корисними колаборантами: управлятимуть територіями Республіки та боротимуться з повстанцями, що їй загрожують."
 MAG_WA_collaborator_Nikolay_Kossov: "Призначити Ніколая Коссова"
 MAG_WA_collaborator_Georgy_Dzhakelli: "Призначити Ґєорґія Джакеллі"
 MAG_WA_collaborator_Alexander_Pavlov: "Призначити Алєксандра Павлова"
 MAG_WA_collaborator_Gurgen_Aseryants: "Призначити Ґурґєна Асерянца"
 MAG_WA_collaborator_Genrikh_Lyushkov: "Призначити Ґєнріха Люшкова"
 MAG_WA_collaborator_Andrey_Vrastil: "Призначити Андрєя Врастіла"
 MAG_WA_collaborator_Yuri_Vitvitsky: "Призначити Юрія Вітвіцкого"
 MAG_WA_collaborator_Georgy_Shekherev: "Призначити Ґєорґія Шехєрєва"

 #Locals
 MAG_WA_local_ministers_effigy: "§GМісцеві політики§!"
 MAG_WA_local_ministers_effigy_desc: "Найкорисніші люди в нашому уряді - росіяни: саме вони заспокоюють усіх інших настільки, щоби ті нас слухали. Якщо ми хочемо дієво контролювати країну, нам потрібно більше місцевих політиків, здатних послабити напругу серед уродженців.\n\nМісцевим керівникам також буде набагато легше управляти, тож краще доручити цю працю їм. Знайти відданих буде не надто важко, а будь-що краще за відкрите повстання цілої країни."
 MAG_WA_local_Valentin_Abramov: "Призначити Валєнтіна Абрамова"
 MAG_WA_local_Igor_Kovalchuk_Koval: "Призначити Іґора Ковальчука-Коваля"
 MAG_WA_local_Anatoly_Sobchak: "Призначити Анатолія Собчака"
 MAG_WA_local_Leonid_Chernykh: "Призначити Лєоніда Чєрних"
 MAG_WA_local_Yakov_Malik: "Призначити Якова Маліка"

 #Hotline America
 MAG_WA_USA_market_category: "Наші відносини з дядьком Семом"
 MAG_WA_USA_market_category_desc: "Мітчелл Вербелл III має дуже близькі зв'язки зі Сполученими Штатами та чимало друзів і контактів у Центральному розвідувальному управлінні.\n\nЗавдяки цим цінним зв'язкам Вербелл може доправляти до молодої республіки всіляку зброю та військове спорядження, причому доступне нам устаткування значно краще за звичайне дрантя, яке дядько Сем збуває своїм союзникам.\n\nНині американська підтримка нашого режиму [ROOT.GetMAG_USA_support]."

