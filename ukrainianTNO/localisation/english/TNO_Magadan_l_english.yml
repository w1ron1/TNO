 MAG_russia_last_port_of_call_10: "Оплот корпоративізму"
 MAG_russia_last_port_of_call_10_desc: "Маґадан не просто останній великий діючий порт Росії - він став упізнаваним символом корпоративної могутности нашої нації. Під твердою рукою Всеросійського уряду ми стали економічною силою, з якою рахуються в Тихоокеанському регіоні й далеко за його межами."
 MAG_russia_last_port_of_call_11: "Оплот корпоративізму"
 MAG_russia_last_port_of_call_11_desc: "Маґадан не просто останній великий діючий порт Росії - він став упізнаваним символом корпоративної могутности нашої нації. Під твердою рукою Всеросійського уряду ми стали економічною силою, з якою рахуються в Тихоокеанському регіоні й далеко за його межами."
 MAG_russia_last_port_of_call_12: "Оплот корпоративізму"
 MAG_russia_last_port_of_call_12_desc: "Маґадан не просто останній великий діючий порт Росії - він став упізнаваним символом корпоративної могутности нашої нації. Під твердою рукою Всеросійського уряду ми стали економічною силою, з якою рахуються в Тихоокеанському регіоні й далеко за його межами."
 MAG_russia_last_port_of_call_13: "Оплот корпоративізму"
 MAG_russia_last_port_of_call_13_desc: "Маґадан не просто останній великий діючий порт Росії - він став упізнаваним символом корпоративної могутности нашої нації. Під твердою рукою Всеросійського уряду ми стали економічною силою, з якою рахуються в Тихоокеанському регіоні й далеко за його межами."
 MAG_pmc_presence_1: "Присутність ПВК"
 MAG_pmc_presence_1_desc: "Попри кілька минулих невдач, тепер ми наймаємо приватні військові компанії, щоби збільшити чисельність війська та зміцнити його фаховість."
 MAG_pmc_presence_2: "Присутність ПВК"
 MAG_pmc_presence_2_desc: "Попри кілька минулих невдач, тепер ми наймаємо приватні військові компанії, щоби збільшити чисельність війська та зміцнити його фаховість."
 
 ### Decisions ###
 MAG_DEC_MAT_connect_magadan_with_the_south: "З'єднати Маґадан із півднем"
 MAG_DEC_MAT_connect_magadan_with_the_south_desc: "Хоч ми й володіємо одним із найважливіших стратегічних об'єктів Росії, місто майже не відрізняється від відрізаного від моря, якщо ми не можемо нічого доправити до нього чи вивезти звідти. Ділянка М56, що мала з'єднати Маґадан, - похмура сторінка нашої історії: ця §WДорога кісток§! є ще одним свідченням большевицької жорстокости. Загиблі будували шлях, який вічна мерзлота від самого початку робила майже непридатним, а за роки анархії він іще більше занепав. Ми виправимо помилки минулого: полагодимо пошкодження недавньої війни й цього разу залучимо професійних робітників."
 MAG_DEC_MAT_magadan_amur_highway: "Маґадансько-амурське шосе"
 MAG_DEC_MAT_magadan_amur_highway_desc: "Після поразки колишніх харбінських товаришів доводиться визнати: ті, кого ми колись вважали союзниками, погано дбали про підвладні землі. Прибічники навіженого §WРодзаєвского§! до самого кінця були левами під проводом параноїдального віслюка, а марення їхнього лідера довели державу до занепаду. На заході Чіта носить шрами царя, який не хотів правити, та немічних офіцерів Білої армії, нездатних керувати. Важко сказати, хто гірший, але найбільше економіці шкодять зруйновані дороги. Шосе М58 між Амуром і Чітою відновлять ті, хто раніше ним знехтував."
 MAG_DEC_MAT_make_reds_build_baikal_highway: "Змусити червоних відбудувати Байкальське шосе"
 MAG_DEC_MAT_make_reds_build_baikal_highway_desc: "Деякі найбільші міста Сибіру й досі носять шрами совєцького панування: режим керував звідси після того, як дозволив Росії програти Осі у Другій світовій війні. Занедбаність і некомпетентність як терору Ягоди, так і повстанців-вискочнів, що прагнули його замінити, залишили всю мережу М55 у руїнах. Червоні відправляли незліченних росіян на каторгу заради власних лихих цілей; тепер ми відплатимо тим самим і змусимо їх відбудувати бодай частину зруйнованого."
 MAG_DEC_MAT_magadan_mexican_trade_agreement: "Маґадансько-мексиканська торговельна угода"
 MAG_DEC_MAT_magadan_mexican_trade_agreement_desc: "Завдяки кращим за пересічні зв'язкам з Америками ми можемо запропонувати торговельні угоди країнам континенту, що розвиваються. Нам украй потрібна їжа, а мінералів маємо вдосталь, тож звернемося до Мексики. Ми за справедливою ціною продаватимемо оброблену руду, важливу для її виробництва, а натомість дістанемо харчі, добрива та інші товари для розвитку власного сільського господарства."
 MAG_DEC_MAT_golden_opportunities_in_amur: "Золоті можливості в Амурі"
 MAG_DEC_MAT_golden_opportunities_in_amur_desc: "Попри всю свою несамовиту балаканину наш давній приятель Родзаєвскій часто більше нагадував класичну карикатуру на жида, ніж люди, яких він ненавидів: підступний виродок, що притиснув чоботом горло російського народу, сидячи на горі золота, та навіть не спромігся нічого з ним зробити. Тому амурські копальні мають безмежний потенціял, але геть не розвинені. Одна з найнадійніших будівельних компаній держави візьметься за багаті золоті родовища. Невдовзі золото, якому Родзаєвскій не знайшов застосування, служитиме російській нації та її народові."
 MAG_DEC_MAT_expand_magadans_port_facilities: "Розширити порт Маґадану"
 MAG_DEC_MAT_expand_magadans_port_facilities_tp: "Усі попередні рішення першого етапу мають бути виконані.\n"
 MAG_DEC_MAT_expand_magadans_port_facilities_desc: "Торгівля - життєва кров нашої нації, що допоможе нам піднестися над дрібними західними князьками. Саме доступ до чужоземної їжі, технологій і зброї дав нам стати на ноги й повернути народові цю частину Батьківщини. §gВождь§! вважає: щоби рушити на захід, треба розширити Маґадан і плекати торговельні зв'язки зі світом. Під здоровим наглядом держави та відданих корпорацій ми перетворимо силу капіталу на могутню зброю проти звірів, що кривдили нашу велику націю."
 MAG_DEC_MAT_pmcs_in_magadan: "ПВК у Маґадані"
 MAG_DEC_MAT_pmcs_in_magadan_desc: "Назвати останній дослід із найманцями провалом - нічого не сказати. Та підвів найманий стрілець, а не сама ідея. Тепер наш зміцнілий статус, військова сила й фінансові можливості дозволяють обирати надійніших кандидатів. Окрім невеликого, але сталого припливу людських ресурсів, їхній досвід дасть нам постійний доступ до колишніх елітних офіцерів країн ОВН, які навчатимуть солдатів, сержантів та офіцерів сучасної західної тактики. Попри суперечливість після випадку Вербелла, кожна фракція бачить тут щось корисне. §JПрагматичні трудовики§! вважають це добрим шляхом модернізації війська, §Mреформісти§! підтримують зближення із Заходом, а решта старих §Wтвердолобих із РФП§! просто радіє, що в новій війні за об'єднання перед ворожі кулемети підуть неросіяни."
 MAG_DEC_MAT_upgrade_the_irkutsk_hps: "Модернізувати Іркутську ГЕС"
 MAG_DEC_MAT_upgrade_the_irkutsk_hps_desc: "Іркутська гідроелектростанція сама собою є дивом російської інженерії, але, за оцінкою Міністерства енергетики, її потужности не вистачить для всіх довгострокових економічних планів. Через нестачу запчастин і досвідчених інженерів у роки анархії її майже не обслуговували. Якщо вже тепер потрібні енергетичні пайки, то в день повної індустріялізації весь Східний Сибір порине в темряву. Закупивши американські запчастини й запросивши освічених на Заході інженерів навчити нове покоління працівників, ми нарешті повернемо станції повну потужність."
 MAG_DEC_MAT_stimulate_the_industrial_complex: "Підтримати промислові корпорації"
 MAG_DEC_MAT_stimulate_the_industrial_complex_desc: "Кращий доступ до світу полегшує придбання промислового устаткування. Наші відрізані від моря західні суперники насилу дістають сучасні машини серед ворожих держав, а вихід до моря докорінно змінює наше становище. Після розширення маґаданських потужностей ми можемо імпортувати техніку, потрібну для відродження промисловости з наголосом на експортних товарах, зроблених у Росії росіянами з російського устаткування й ресурсів."
 MAG_DEC_MAT_south_american_trade_mission: "Південноамериканська торговельна місія"
 MAG_DEC_MAT_south_american_trade_mission_desc: "Разом з економікою зростають наші можливості торгувати з іншими країнами, що розвиваються. Оскільки наш головний друг - Америка, найреальніше звернутися до таких держав, як Бразилія. Ми обмінюватимемо мінерали на товари, яких не можемо виробити в Росії: від кави та предметів розкоші до каучуку й стратегічних ресурсів для важкої промисловости."
 MAG_DEC_MAT_the_siberian_minning_economy: "Сибірська гірнича економіка"
 MAG_DEC_MAT_the_siberian_minning_economy_desc: "Під землею Сибіру лежать величезні незаймані багатства. Вугілля, золото, діяманти, залізна руда й безліч цінних мінералів просто під ногами, та нині їх не видобути: за роки анархії чимало копалень занепали. Імпортне устаткування й креслення допоможуть швидко надолужити роки руїни."
 MAG_DEC_MAT_mat_petlin_resolution: "Подальший розвиток призупинено"
 MAG_DEC_MAT_mat_petlin_resolution_tp: "Перш ніж продовжити розвиток, слід розв'язати боротьбу за владу."
 MAG_DEC_MAT_mat_petlin_resolution_desc: ""
 MAG_DEC_MAT_free_trade_port_of_magadan: "Порт вільної торгівлі Маґадану"
 MAG_DEC_MAT_free_trade_port_of_magadan_tp: "Усі попередні рішення другого етапу, крім «ПВК у Маґадані», мають бути виконані.\n"
 MAG_DEC_MAT_free_trade_port_of_magadan_desc: "Зрештою економічне майбутнє Росії визначать §Mреформісти§! на чолі з §gНіколаєм Ніколаєвічем Пєтліном§!. Замість озиратися всередину й у минуле, ми дивитимемося вперед і за кордон. Американська модель вільної торгівлі зробила їхню державу найбагатшою у світі й значно збагатила народ. Тож кожен справжній російський патріот мав би прагнути наслідувати її. Що сильніше розірве з нуждою большевизму й царським кріпацтвом, ніж капіталістична система вільного ринку? І що краще засвідчить любов до російської нації, ніж бажання одного дня дати їй найвищий рівень життя на планеті? Тож порт Маґадану знову розширять і перетворять на великий торговельний порт, який відкриє нам переваги світової вільної торгівлі."
 MAG_DEC_MAT_all_russian_trade_port_of_magadan: "Всеросійський торговельний порт Маґадану"
 MAG_DEC_MAT_all_russian_trade_port_of_magadan_tp: "Усі попередні рішення другого етапу, крім «ПВК у Маґадані», мають бути виконані.\n"
 MAG_DEC_MAT_all_russian_trade_port_of_magadan_desc: "Зрештою перемогу здобули §Mтрудовики§!, послідовники нашого любленого §nВождя Міхаїла Алєксєєвіча Матковского§!. Сила Росії не в грошах, і ми не можемо покладатися на чужу систему. Наша сила - в народі та національному духові. Ми торгуватимемо й шукатимемо добрих відносин із країнами ОВН, але ставитимемося до них як до добрих сусідів і друзів, а не кумирів для наслідування. Протекціонізм захистить російську працю й культуру та збереже російську власність над корпораціями й стратегічними ресурсами; водночас взаємовигідні угоди збагачуватимуть і нас, і друзів Росії. Тож порт Маґадану знову розширять, перетворивши його на справжній торговельний порт, що служитиме національним інтересам Росії."
 MAG_DEC_MAT_corporate_military_investment_program: "Корпоративно-військова інвестиційна програма"
 MAG_DEC_MAT_corporate_military_investment_program_desc: "Захистити наші військові й економічні інтереси можна, розширивши роль корпорацій в оборонному секторі. Державні вливання до збройової промисловости та замовлення відданим російським компаніям значно наростять військове виробництво й загальну зайнятість."
 MAG_DEC_MAT_establish_foreign_investment_incentives: "Запровадити стимули для іноземних інвестицій"
 MAG_DEC_MAT_establish_foreign_investment_incentives_desc: "Ми дотримуватимемося розумного протекціонізму задля національних інтересів, але автаркія й ізоляціонізм ніколи не були нашими цілями. Спираючись на працю Міністерства фінансів, ми створимо програму обмежених іноземних інвестицій у портові міста та розумні правила: компанії мають діяти за російським законом, наймати росіян і по можливості користуватися російськими ресурсами. Так ми зустрінемося посередині: вони дістануть старанних робітників і вигідний клімат, ми дотримаємо обіцянок народові, а багатшими стануть усі."
 MAG_DEC_MAT_expand_the_energy_sector: "Розширити енергетичний сектор"
 MAG_DEC_MAT_expand_the_energy_sector_desc: "Для подальшого зростання російської економіки конче треба заохотити корпоративні інвестиції в енергетику. Наступним кроком стане збільшення видобутку вугілля в Південноякутських басейнах і нафти на заході, щоби зміцнити націю й назавжди покласти край енергетичним пайкам."
 MAG_DEC_MAT_westward_corporate_expansion: "Корпоративна експансія на захід"
 MAG_DEC_MAT_westward_corporate_expansion_tp: "Досягнуто надрегіонального етапу"
 MAG_DEC_MAT_westward_corporate_expansion_tp_2: "Усі попередні рішення третього етапу мають бути виконані.\n"
 MAG_DEC_MAT_westward_corporate_expansion_desc: "Після недавніх перемог на заході настав заключний етап нашого національного проєкту. Великі простори Сибіру знову треба приборкати, і попереду йтимуть корпорації. Швидко інтегрувавши економіку Центрального Сибіру до Сибірської Національної Республіки, а його визволені народи - до нашої нації, ми ще на крок наблизимо повернення всієї Росії."
 MAG_DEC_MAT_coastal_privitization_program: "Програма приватизації узбережжя"
 MAG_DEC_MAT_coastal_privitization_program_desc: "У довгій перспективі ми ширше запровадимо американську модель, але почнемо поволі: дозволимо західним корпораціям прийти до прибережних областей. М'якше регулювання й податкові пільги приваблять їх сюди. Це буде різкий відхід від політики Матковского, тож країна, область за областю пристосовуючись до нової західної моделі, неминуче переживе труднощі зростання."
 MAG_DEC_MAT_an_economic_fortress_against_manchuria: "Економічна фортеця проти Маньчжурії"
 MAG_DEC_MAT_an_economic_fortress_against_manchuria_desc: "Південні суперники не лише окупують наші землі, а й становлять економічну загрозу. Щоби послабити їх і чітко показати, що їхній вплив закінчується на кордоні, ми дамо західним промисловим компаніям податкові пільги для роботи просто біля Маньчжурії. Для маньчжурів та їхніх японських господарів це стане постійним нагадуванням про російську й американську економічну міць."
 MAG_DEC_MAT_american_investments_into_irkutsk_hps: "Американські інвестиції в Іркутську ГЕС"
 MAG_DEC_MAT_american_investments_into_irkutsk_hps_desc: "Кращий доступ до американських науковців та інженерів дозволяє перетворити тимчасовий імпорт для відновлення Іркутської ГЕС на довгострокову угоду. Американські компанії інвестуватимуть у греблю та отримають частку прибутків, а ми - постійний доступ до освічених в Америці фахівців, які зроблять станцію такою ж потужною, як дамба Гувера."
 MAG_DEC_MAT_global_free_trade_port_of_magadan: "Світовий порт вільної торгівлі Маґадану"
 MAG_DEC_MAT_global_free_trade_port_of_magadan_tp: "Досягнуто надрегіонального етапу"
 MAG_DEC_MAT_global_free_trade_port_of_magadan_tp_2: "Усі попередні рішення третього етапу мають бути виконані.\n"
 MAG_DEC_MAT_global_free_trade_port_of_magadan_desc: "Почавши зі скромного місцевого порту, Маґадан став жвавим торговельним осередком світового значення. Американські інвестиції злітають, а на недавно визволеному заході відкриваються нові можливості, тож порт треба знову розширити й перетворити на міжнародний контейнерний вузол. Одного дня він стане одним із найжвавіших портів світу, а його зростання допоможе розвивати Центральний Сибір."
 MAG_DEC_MAT_great_siberian_highway_project: "Проєкт Великого сибірського шосе"
 MAG_DEC_MAT_great_siberian_highway_project_desc: "М53 планували як шосе між Іркутском і Новосибірском. Друга світова війна зупинила проєкт, а готові ділянки занепали під владою дрібних правителів і тепер у жалюгідному стані. Наші економісти вважають, що належні інвестиції втілять давню мрію й сполучать усі великі міста Центрального Сибіру з прибережною столицею. Це стане великим благом для мирної економіки й не меншим - для логістики під час остаточного визволення Росії від західних князьків-бандитів."
 MAG_DEC_MAT_siberias_all_russian_mic: "Всеросійський ВПК Сибіру"
 MAG_DEC_MAT_siberias_all_russian_mic_desc: "Перед новою загрозою війни наші збройові корпорації стрімко виросли з кількох маґаданських майстерень у величезний військово-промисловий комплекс. Російська зброя швидко стає однією з найкращих у світі; тепер слід розвивати промисловість Новосибірска, Кемерова й Красноярска та стати новою військово-промисловою потугою Євразії. З часом російські системи озброєнь вважатимуть одними з найкращих і найбажаніших у світі."
 MAG_DEC_MAT_corporatize_central_siberia: "Корпоратизувати Центральний Сибір"
 MAG_DEC_MAT_corporatize_central_siberia_desc: "Повернувши цю частину Росії, ми маємо дати корпораціям належно закріпитися в регіоні. Швидко перерозподіливши колишні державні й приватні активи на користь корпорацій, ми економічно повернемо ці області до російської нації, по змозі не порушуючи життя російського робітника."
 MAG_DEC_MAT_russo_american_free_trade_agreement: "Російсько-американська угода про вільну торгівлю"
 MAG_DEC_MAT_russo_american_free_trade_agreement_desc: "Обом сторонам стає очевидно: §Mсиній§!, §Wбілий§! і §Rчервоний§! мають тісно співпрацювати з §Rчервоним§!, §Wбілим§! і §Mсинім§!. Наша торгівля вже квітне, тож час піти далі й закріпити зв'язки угодою про вільну торгівлю між великими націями. Невдовзі американські компанії зможуть працювати в Сибіру, а напис «Зроблено в Росії» - російською працею - стане знаком якости американських товарів. Їхня присутність також створить чимало робочих місць і принесе нашій промисловості досвід тісної співпраці з Америкою."
 MAG_DEC_MAT_restore_tomsks_universities: "Відновити університети Томска"
 MAG_DEC_MAT_restore_tomsks_universities_desc: "У Томску склалася велика культура навчання. На жаль, викладали там не завжди корисне для нації, а минула анархія й нинішня напруга тяжко вдарили по закладах. Тим більше причин влити державні кошти, повернути їх до роботи й спрямувати додаткове фінансування так, щоби воно служило довгостроковому розвиткові російської нації."
 
