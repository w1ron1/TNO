  ## Bios ##
  # Leaders
  POLITICS_MIKHAIL_MATKOVSKY_DESC: "Багато в чому Міхаїл Алєксєєвіч Матковскій уособлює форму російського фашизму, протилежну вченню Родзаєвского. Родзаєвскій - догматик, а він - прагматик. Родзаєвскій - вправний полум'яний оратор, а він - перемовник, який тактом і політичною проникливістю схиляє супротивників на свій бік. Родзаєвскій вихваляв антисемітські ініціятиви чорносорочечників, а Матковскій зневажав їхнє бандитство. На коротку мить їхні цілі збіглися. Завдяки співпраці чисельність РФП стрімко зросла й сягнула вершини: дедалі більше російських еміґрантів вабив фашизм.\n\nТа спалахнула Велика Вітчизняна війна. Коли німці повели проти Росії війну на винищення, суперечності між ними закипіли. Попри руйнівні, геноцидні наміри Гітлера, Родзаєвскій шукав його підтримки, мріючи нарешті звільнити Росію від большевизму. Матковскій таких ілюзій не мав. Війна Німеччини проти Совєцького Союзу, а отже й проти Росії, оголила її расову ненависть до росіян. Скільки б прихильників не здобула РФП, нацисти не відводили у своїх планах місця незалежній Росії. Однак Матковскій, вірний своїй обачності, разом зі своїм колом мовчав, чекав слушної нагоди й тим часом нарощував силу.\n\nКоли час настав, вони відібрали в Родзаєвского Маґадан, вигнали його прибічників і офіційно розкололи партію. Тепер, пануючи у власній державі, Матковскій прагне врятувати Росію від загибелі. Засіб до цієї мети лежить за океаном, по той бік Японії: Америка. Та навіть такому досвідченому перемовникові нелегко переконати чужоземну державу; утім, прості сумніви його не спинять."
  POLITICS_MIKHAIL_MATKOVSKY_70S_DESC: "Гудіння грамофона, дзенькіт срібних приборів об тарілки, блиск убраних золотом і сріблом кімнат - усі багатства світу були досяжні Міхаїлові Алєксєєвічу Матковскому. Та він відчував, як усе це вислизає, а напади болю під ребрами нагадували про Харбін. Перед лицем смерти кожна людина злиденна; Вождь Росії не був винятком. Запах вина й зваба морфію нібито притлумлювали напади. Проте щоранку Вождь знову поставав перед своєю приреченістю: повільною, болісною смертю, яку кидком кісток присудили блазні долі й випадку.\n\nХемотерапія, ліки, пігулки, таблетки - він випробував усе, та марно. Американські друзі, що раз у раз виривали його з пащі поразки, могли лише знизати плечима. Матковскій постарів. Саме тепер, на вершині могутности, він опинився на дні свого існування. Жодні політичні зв'язки, інтриґи чи чистки не могли його вилікувати. Горе йому! Якби ж можна було вирвати печінку й покласти цьому край - та ні. Доля Матковского - жити, і він житиме.\n\nКоли смерть не викликає сумніву, лишається не те, що блищить, гуде чи дзвенить, а тиха вага власної спадщини. Тож Матковскій дивиться на захід, крізь колючий дріт, що розмежовує російські й німецькі землі. Саме тут він випалить своє ім'я в літописах історії. Війною чи миром - Вождеві вже байдуже. Спосіб другорядний; мета виправдовує засоби - зрештою, кінець уже близько."
  POLITICS_NIKOLAY_PETLIN_DESC: "На відміну від інших чільних діячів Россійской Фашистской Партії, Ніколай Ніколаєвіч Пєтлін був уродженцем Харбіна, а не еміґрантом. Спершу ця відмінність здавалася лише поверховою. Працюючи в Харбіні драматургом, композитором і письменником, Пєтлін вступив до Россійской Фашистской Партії та уславився талантом політичного організатора. Невдовзі він очолив фашистську молодіжну організацію, а зрештою дістав місце у Вєрховному Совєті Россійской Фашистской Партії Константіна Родзаєвского - несміливий чоловік у затінку Матковского й Родзаєвского.\n\nКоли німці вторглися до Росії, Пєтлін засудив підтримку нацистського вторгнення Родзаєвскім і на знак протесту подав у відставку. Відтоді він зблизився з крилом Матковского в РФП і став його особистим секретарем - цей лад пережив навіть відокремлення Матковского від Родзаєвского. Пєтлін знову пішов угору, й після розколу колишній Вождь росіян призначив його своїм заступником. Під проводом Пєтліна РФП намагалася завоювати прихильність Сполучених Штатів обіцянками реформ, які Матковскій раз у раз підривав.\n\nПєтлін був там, коли Россійская Фашистская Партія стала Русской Національной Трудовой Партією. Був там, коли вони завоювали Сибір і пройшли парадом вулицями Іркутска та Якутска. Був там, коли Матковскій пішов у відставку й був заарештований за злочини Дальстрою. Цього разу, клянеться Пєтлін, він буде там, коли демократія повернеться до Росії під проводом еміґрантів. Його доля - спокутувати Харбін."
  POLITICS_MITCHELL_WERBELL_DESC: "Історія про американського солдата удачі, який самими лише кмітливістю та перевагою у вогневій силі захопив сибірське місто, звучить як така несамовита нісенітниця, що не годиться навіть для найдешевшого бульварного роману. Та часом правда дивніша за вигадку.\n\nМітчелл Лівінґстон Вербелл III був сином російського еміґранта, народженим і вихованим в Америці. Коротка служба в УСС, попереднику ЦРУ, стала для нього трампліном у каламутний і смертоносний світ найманських війн. Його сумнівні завдання простягалися від Куби до Камчатки, однак він зберіг зв'язки з американською промисловою елітою та давніми товаришами свого батька. Особливо з одним - дедалі старішим російсько-американським фашистом Анастасієм Вонсяцкім. Коли режим Міхаїла Матковского в Маґадані сподівався зробити Вонсяцкого брамою до американської допомоги, Вербелл побачив нагоду. Далі сталося щось однаково зухвале й самогубно божевільне, але всупереч усьому він переміг.\n\nПоєднавши дипломатію, послуги давніх друзів і кілька влучних військових рейдів, Вербелл успішно захопив владу в Маґадані та проголосив місто столицею Республіки Західна Аляска. Він сподівається перевернути задум Матковского щодо Вонсяцкого: стати провідником безперервного потоку американських грошей і зброї до своєї молодої сибірської імперії. Проте сусіди Вербелла понад усе хочуть скинути його в море, і це випробування може виявитися йому не до снаги..."
  POLITICS_MITCHELL_WERBELL_70S_DESC: "Усупереч усьому Мітчелл Лівінґстон Вербелл III переміг. Завдяки удачі, майстерності й щедрій американській допомозі Сполучені Штати Росії тепер належать до найбільших держав планети. Сказати, що світ приголомшений, - нічого не сказати. Аналітики досі намагаються збагнути, як його уряд іще не завалився від самої абсурдности свого існування, а тим часом сам Вербелл сидить на справжній горі грошей і регоче дорогою до банку.\n\nТа людина на кшталт Вербелла ніколи по-справжньому не спочиває. Безперестанку перестрибуючи між внутрішніми справами, закордонними зв'язками й особистими клопотами, найманець явно не вдовольняється самим об'єднанням Росії. Його відданість армії без кордонів непохитна, але так само непохитна його підтримка демократії американського зразка в Росії. Як він дасть раду цим суперечностям - ще невідомо, та дехто вже сподівається, що попри всі свої вади Вербелл і справді принесе виснаженому російському народові щось добре.\n\nБагато хто таврує Вербелла американською маріонеткою, тож і Японія, і Німеччина ставляться до його режиму насторожено, якщо не відверто вороже. Вербелл, безперечно, любить свою батьківщину, але його повідець далеко не такий короткий, як дехто боїться чи хотів би. Він - людина з армією та мрією, і світ, затамувавши подих, чекає на його наступний крок."
  MILITARY_ROGER_FAULQUES_DESC: "§LВідомий у всьому найманському світі як «Людина тисячі життів», Роже Фольк воював у майже незліченних війнах - і зазнав майже стільки ж поранень, мало не смертельних.\n\nКолишній боєць французьких сил спеціяльного призначення, Фольк покинув знайому йому державу, бо бачив, як та стрімко занепадає, і натомість вирішив використати набуті навички задля власного багатства та слави. В Африці й деінде нагод не бракувало, й невдовзі він став відомий як умілий і жорстокий боєць, готовий іти просто під ворожий вогонь, аби здобути перемогу.\n\nКоли Вербелл проголосив створення своєї держави, багато хто не сумнівався: Фольк неодмінно прибуде сюди в пошуках ще більшої слави. Так і сталося. Він напевно принесе молодій республіці величезну майстерність і престиж, хоч багато хто й питає, чи не наміриться він із часом усунути нового командира, як уже робив колись.§!"

  # Ministers
  MAG_Vladimir_Kibardin_hog_desc: "§YГолова уряду\nКорпоративізм§!\n--------------\n§LСекретар маґаданської РФП Владімір Владіміровіч Кібардін від самого початку був відданим послідовником Вождя. Вигнання до Харбіна, переправа через Амур, а потім самотність у порту Маґадану - Кібардін залишався поруч із Матковскім у всіх випробуваннях, що їх могли накликати на них Росія й комуністи. Та якщо Матковскій - прагматик РФП, то Кібардін - її догматик: усі поневіряння лише зміцнили його відданість фашизмові. Для Кібардіна ортодоксальний фашизм - єдина надія Росії; жодна еволюція чи деґрадація Родзаєвского цього не змінить.\n\nОднак поклоніння Кібардіна ортодоксальним принципам може означати, що ідеології фашизму він відданіший, ніж самому Вождеві. Одного дня Кібардінові, можливо, доведеться обирати: його Вождь чи його ідеологія?§!"
  MAG_Nikolay_Petlin_for_desc: "§YМіністр закордонних справ\nПатерналізм§!\n--------------\n§LНіколай Ніколаєвіч Пєтлін народився в Харбіні й десятиліттями був видатним діячем РФП. Після розколу він пристав до крила Матковского, та дедалі більше розчаровувався у фашизмі: спершу в Родзаєвскім, а тепер і в Маґадані. Щодня, виходячи з кабінету, Пєтлін бачить співвітчизників, що живуть у страху перед примхами уряду й одного тирана, який цілковито владний над їхнім життям. Фашизм не діє - жодна його форма, - і Пєтлін лише починає усвідомлювати всю правду.\n\nУтім, на посаді головного дипломата партії Пєтлін вважає, що відкрив для Росії новий шлях - американський. Досі контакти з Америкою здебільшого були мізерні. Пєтлін збирається це змінити, і, можливо, одного дня американська модель прийде до Росії та перетворить фашистську державу на щось вільніше - країну, де кожен росіянин зможе жити, не боячись за себе й родину. Минулі гріхи щоночі гризуть Пєтліна, і якщо єдиний шлях до спокути - зробити Росію кращою, він мусить спробувати.§!"
  MAG_Igor_Kovalchuk_Koval_for_desc: "§YМіністр закордонних справ\nЦивільна диктатура§!\n--------------\n§LПісля арешту Пєтліна й утвердження влади трудовиків довелося знайти нового головного дипломата. Посаду віддали Іґорю Константіновічу Ковальчуку-Ковалю, доти малопомітному дипломатові. Довго перебуваючи в тіні попередника, Ковальчук-Коваль готовий нарешті показати світові своє обличчя - точніше, те обличчя, яке схоче показати через нього Матковскій.\n\nРозуміючи своє становище, Ковальчук-Коваль значно охочіше за Пєтліна тримається партійної лінії, та й не бачить у цьому проблеми. Однак дипломати всього світу, а надто американці, помітять різку зміну далекосхідного курсу. Завдання Ковальчука-Коваля - не дати припинитися постачанню зброї, а Вождь цього разу набагато пильніше стежить за головним дипломатом. Тепер Ковальчук-Коваль знає: за його спиною завжди чекає заміна.§!"
  MAG_Vladimir_Goltsov_eco_desc: "§YМіністр економіки\nКорпоративізм§!\n--------------\n§LЗамолоду втікши до Харбіна після арешту матері Совєцьким Союзом, Владімір Єфімовіч Ґольцов став затятим антикомуністом. Ненависть і переконання спонукали його 1937 року покинути навчання в Гірничо-хемічному інституті й вступити до Россійской Фашистской Партії. Спершу захоплюючись Родзаєвскім, під час розколу РФП він натомість пристав до Матковского, бо вважав Родзаєвского надмірним германофілом.\n\nТепер, як вірний послідовник Матковского, Ґольцов готує Маґадан до хрестового походу задля очищення й порятунку Росії. Застосовуючи знання з навчання та досвід залізничника, Ґольцов тісно співпрацює з Вождем, щоби перетворити Маґадан на надійну базу для відвоювання Росії. Та чи зможе він зробити з порожнього порту квітучий промисловий і військовий осередок - ще невідомо.§!"
