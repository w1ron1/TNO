 ### Siberia tree ###
 MAG_the_true_heir_of_harbin: "Справжній спадкоємець Харбіна"
 MAG_the_true_heir_of_harbin_desc: "Россійской Фашистской Партії, якою її знали в Харбіні, більше нема. Давно невдоволені політикою й риторикою Родзаєвского, Матковскій та його крило партії захопили владу в Маґадані й тепер ліплять його під свої потреби. Годі партії борсатися в багнюці, поки страждає вся Росія. Годі бандитизму й риторики ненависти; мати-Росія кличе нас до себе, аби ми врятували її від загибелі.\n\nТа перш ніж Матковскій виконає обов'язок перед Батьківщиною, він має правити сам - без обмежень і зрадників. Він довіряє своєму крилу, але мусить придушити незгоду в лавах. Усіх запідозрених у вірності Родзаєвскому буде вичищено. Утвердивши політичну владу над Маґаданом, Матковскій виконає священний обов'язок, до якого готувався ще з буремних харбінських днів: під його проводом Росія знову постане - єдина, сильна й неперевершена."

 MAG_building_the_wastes: "Забудувати пустку"
 MAG_building_the_wastes_desc: "Із заходу доходять жахливі новини: німецькі терористичні бомбардування, бандитські наскоки, війни росіян проти росіян. На краю далекосхідної Росії Маґадан віддалений і захищений від лих, що терзають решту Батьківщини. Та через цю віддаленість він майже порожній. У найменш заселеному й найбіднішому на ресурси краї Росії мало що придатне для майбутнього визволення та возз'єднання країни.\n\nМатковскій це змінить. Партійні урядовці шукатимуть на вулицях і околицях Маґадану робітників, готових долучитися до його хрестового походу. Вони будуватимуть дороги й телеграфні стовпи, майстерні та мануфактури. Коли над темним тілом Росії, похованим невдачами червоних і злочинами німців, засяє день визволення, їх щедро винагородять за обов'язок і відданість: Матковскій не дасть жодній вірі в нього пропасти намарно."

 MAG_siberian_factories: "Сибірські фабрики"
 MAG_siberian_factories_desc: "Маґадан віддалений та ізольований від решти Росії. Промисловість самого портового міста мала й майже не пристосована до виробництва військової продукції. На щастя, на всьому Далекому Сході так само: промисловий центр Владивостока, розбудований за червоних, тепер утрачено на користь японців і маньчжурів. Словом, усі наші східні вороги в однаково скрутному становищі.\n\nТа Матковскій не змарнує нагоди. На сибірській пустці він збудує фабрики саме для справжньої війни, а не дитячих сутичок. Партія озброїть і навчить Маґаданських вояків бути солдатами, а не бандитами з високим ідеалом. І жоден громадянин під крилом партії не знатиме злиднів чи нестатків: нехай це стане взірцем і видінням майбутньої Росії."

 MAG_siberian_farms: "Сибірські господарства"
 MAG_siberian_farms_desc: "Як сказав відомий китайський стратег, «армія марширує не на ногах, а на шлунку». За часів проклятих Союзу та Імперії портовий Маґадан завжди залежав від імпорту харчів. Відрізані від інших країв Батьківщини, більшість мешканців перебиваються прибережним рибальством. Голод породжує в їхніх серцях таємне бажання: нехай Росія їх урятує.\n\nПартія й Матковскій почують цей поклик. Урядовці зберуть добровольців і призовників для праці на сибірських полях. Далекий Схід неродючий, але чесної російської праці досить для дива. Нам не потрібні переповнені комори - лише досить їжі, щоб пережити суворий клімат і нагодувати людей. Коли Росія постане знову, все це забудеться, мов попіл на вітрі."

 MAG_try_something_else: "Спробувати щось інше"
 MAG_try_something_else_desc: "Заснувавши сибірські фабрики й господарства, партія в Маґадані довела, що здатна діяти та реформувати. На жаль, успіх поки обмежений; хоч Матковскому та його кліці важко це визнати, дієвість заходів покаже лише час. Тим часом лишається питання партійних збройних сил. Наші люди вправні й непогано озброєні, але не призвичаєні битися на крайній півночі.\n\nЧас спробувати щось інше. Матковскій, колись і сам солдат, спостерігатиме, як його генерали й офіцери кують із вояків нову загартовану армію, здатну воювати в мінливу сибірську погоду. Навчання відбуватимуться постійно - і в люту негоду, і в ясні дні. Кожен солдат Маґадану стане вістрям хрестового походу Матковского."

 MAG_acquire_advisors: "Залучити радників"
 MAG_acquire_advisors_desc: "Сибірські землі мають давню історію. Ще до стрімкого розширення Імперії на схід тут мешкали різні народи, витримуючи сувору погоду й знаходячи собі прожиток. Маґаданським військам є чого в них навчитися, а поради щодо виживання в дикій природі можуть означати різницю між життям і смертю в невблаганних умовах Далекого Сходу.\n\nЩоб залучити радників, частина військ із місцевими перекладачами вирушить на північ, до земель довкола Камчатки. Там ми встановимо зв'язки з тубільцями й використаємо їхній тисячолітній досвід для розвитку власної теорії війни. Ми перетворимо солдатів на тих, хто виживає, - на переможців! Вони більше не триматимуться в сибірській глушині на волосині: віднині житимуть без сумнівів і страху перед богами далекосхідних земель."

 MAG_radical_techniques: "Радикальні методи"
 MAG_radical_techniques_desc: "Далекий Схід - дикий край. Навіть за Союзу й Імперії він був рідко заселений, а без цивілізації, що підтримувала російське просування на схід, життя стало нещадним. У сибірських лісах і тундрі війна не така, як на заході. Через майже повну відсутність інфраструктури вона звелася до сутичок дрібних держав за владу над Далеким Сходом. Щоб перемогти в Сибіру, слід відкинути загальні правила війни, яких навчають у Европі.\n\nЗаради нашої справи ми мусимо забути все відоме. Методи війни змінюються разом з епохами. Наші солдати пройдуть радикально новий вишкіл на основі уроків сибірських тубільців. Незабаром ліси й тундри Сибіру стануть для нас наче рівнини Західної Росії, й ніщо не завадить ударити по ворогу - Родзаєвскому, царистах чи навіть червоних."

 MAG_preliminary_arming: "Попереднє озброєння"
 MAG_preliminary_arming_desc: "Настав час зібрати плоди із збудованих сибірських фабрик. Маючи досить робітників і машин, вони можуть запрацювати як слід. Із вулиць Маґадану видно дим із коминів - натяк на те, що виготовляють усередині. Там народжуються гвинтівки, уніформи, кулі, навіть гармати й снаряди. Партія знову перемогла за найскрутніших обставин, і Матковскій задоволений.\n\nЧас озброїти бойове крило партії. З належним спорядженням наші солдати битимуться з червоними, царистами та Родзаєвскім значно сильніше, хоч недооцінювати їх зарано. Ця перевага дасть нагоду об'єднати Далекий Схід, поки Матковскій готується до хрестового походу за визволення Батьківщини від страждань і роз'єднаности."

 MAG_winterized_gear: "Зимове спорядження"
 MAG_winterized_gear_desc: "Найочевидніша з усіх далекосхідних негостинностей - низька температура. Рухатися холодною сибірською зимою важко, а воювати ще важче. Гірше того, наше спорядження часто псується або стає непридатним у люту погоду. Треба знайти розв'язання, бо зимові умови майже постійно непокоять війська. Витриваліше зимове спорядження дасть солдатам ще одну важливу перевагу над ворогами.\n\nМатковскій накаже пристосувати все військове майно до зими. Більшість спорядження не готова до низьких температур, тому процес буде довгим і складним. Та цю боротьбу треба витримати. Майбутнє визволення Росії вимагатиме всього, що ми маємо, а ця мала незручність - ніщо поруч із тим випробуванням; коли Матковскій правитиме Росією, усе це виправдається."

 MAG_sitting_out_the_winter: "Перечекати зиму"
 MAG_sitting_out_the_winter_desc: "Ми зробили все можливе. Фабрики й господарства працюють, їхня продукція доходить і до солдатів, і до цивільних. Тубільні радники загартували наших людей для виживання в негостинному далекосхідному кліматі без втрати боєздатности. Наказ щодо зимового спорядження виконано; продукція мануфактур тепер працює за низьких температур. Ми готові діяти, та наближається зима.\n\nПроти сил природи мало що вдієш. Треба перечекати зиму, поставивши солдатів доглядати телеграфні стовпи й дороги. Патрулі триватимуть, щоб володіння Матковского не знали злочинности й бандитизму, але бойових навчань не буде. Всі частини працюватимуть як звично з поправкою на погоду. А коли зима скінчиться, на нас чекатиме величезне завдання, і Матковскій стоятиме при кермі."

 MAG_desperate_times: "Відчайдушні часи"
 MAG_desperate_times_desc: "Після всього зробленого ми опинилися тут. Харчі закінчуються, зимове спорядження ледве витримує вітер, а господарства й фабрики не працюють. Зима минула, але лишила слід на наших спробах стабілізувати державу й закріпитися в суворих сибірських умовах. Може, настав час поглянути назовні й скористатися плянами Матковского звернутися по підтримку до чужоземних держав та емігрантів.\n\nМаємо три варіянти. Цар у Чіті - у кращому разі вимушений ворог, але, можливо, його кліку вдасться переконати в перемир'ї. Американці на чолі з президентом Ніксоном можуть нас підтримати в обмін на обіцянки реформ. Нарешті, російські емігранти, найпомітніший серед яких впливовий фашист Анастасій Вонсяцкій, можуть вкласти ресурси в нашу справу. Кого б ми не переконали, ясно одне: сама партія не виживе."

 MAG_the_tsar: "Цар"
 MAG_the_tsar_desc: "Чіту від нас відділяють лише мерзенні сили Родзаєвского, і вона має з нами більше спільного, ніж більшість уламкових держав. Режим виріс із різноманітних емігрантських рухів і організацій Харбіна, але спирається не на фашизм, а на царизм. Група білих генералів, що заснувала Чіту, звернулася до Майкла Андрєєвіча, нащадка Романових із сумнівними правами на трон, і захопила частину імперії Яґоди під час її розпаду.\n\nУ нас багато спільного і в ідеології, і серед ворогів, а Міхаїл наразі прагне співпраці та зближення. Через відсутність сухопутного зв'язку це буде непросто, але ми все одно встановимо контакт із новими друзями в Чіті."

 MAG_smuggling_routes: "Шляхи контрабанди"
 MAG_smuggling_routes_desc: "Найбільшою перешкодою для взаємовигідних відносин із державою царя Міхаїла було питання, як до неї дістатися, але ми знайшли розв'язання.\n\nНа Далекому Сході поселення та зв'язки між ними рідкісні. Тож якщо діяти обережно й уважно планувати маршрути та розклад, можна створити один або кілька таємних шляхів до Чіти. Під охороною найкращих людей ними в обох напрямках потечуть зброя й ресурси, а між державами їздитимуть посланці. Якщо зможемо контрабандою доправляти до Чіти й назад усе потрібне, це буде добрим першим кроком до подолання географії та встановлення дипломатичних відносин."

 MAG_put_aside_our_differences: "Відкласти розбіжності"
 MAG_put_aside_our_differences_desc: "У нас із Чітинськими роялістами багато спільного, але чимало й розбіжностей. Ми маємо спільне походження, та вони ведуть рід від старих порядків царської імперії, тоді як наша ідеологія походить із нового руху - російського фашизму. Нас розділяє віра старих російських генералів і політиків у владу монарха, але в цих жахливих умовах примирення можливе.\n\nЩоб спільно протистояти Фашистській партії Родзаєвского, ми засвідчимо дружбу й повагу до Чіти, запропонувавши пакт про співпрацю та ненапад. Якщо вони погодяться, ми зможемо безпечніше вдарити по Амуру."

 MAG_divide_and_conquer: "Розділяй і володарюй"
 MAG_divide_and_conquer_desc: "Від дня розколу з радикалами РФП сили Родзаєвского в Амурі були найбільшою загрозою нашому виживанню. Жоден рубіж не охороняють так сильно, як південний, де прикордонні гарнізони нерідко переходять до рейдів і сутичок. Тепер, знайшовши союзників у Чіті, ми можемо продемонструвати силу й випробувати власні можливості.\n\nМи дочекаємося слушної миті й почнемо наймасштабніший рейд за всю нашу історію. Царисти допоможуть відвернути армію Родзаєвского на сході, а ми, сподіваємося, покращимо позиції в мерзлих землях Східного Сибіру."

 MAG_the_president: "Президент"
 MAG_the_president_desc: "Щоб знайти наймогутнішого можливого покровителя, треба поглянути через Тихий океан на наддержаву Західної півкулі - Сполучені Штати Америки. Це одна з трьох найсильніших держав світу з майже неперевершеною промисловою та військовою міццю. Матковскій прагне здобути хоча б малу частку цієї сили для повернення Росії.\n\nПрезидент Ніксон поки не виявляв бажання втручати Америку в російські справи, і це треба змінити. Для американської підтримки потрібні дві речі: довести, що наш режим - корисний і надійний актив, і показати, що ми відрізняємося від ненависних їм фашистів. Без обох умов заморської допомоги не буде."

 MAG_the_siberian_bill_of_rights: "Сибірський білль про права"
 MAG_the_siberian_bill_of_rights_desc: "Наша ідеологія заважає одержати підтримку з-за Тихого океану: американський уряд вважає нас таким самим гнобительським тоталітарним режимом, як ті, проти яких він бореться. Щоб показати себе в кращому світлі, варто почати реформи - або принаймні створити таке враження. Добрим початком буде ґарантія прав громадян.\n\nМіхаїл Матковскій підпише офіційний документ, що ґарантує всім людям, етнічним росіянам чи ні, базові права: рівне ставлення, свободу слова та свободу зібрань. Чи дотримуватимемося ми букви закону - інше питання, але це покаже готовність до реформ і нашу відмінність від німецьких нацистів, що для США безперечно важливо."

 MAG_promise_to_reform: "Пообіцяти реформи"
 MAG_promise_to_reform_desc: "Заявивши про намір забезпечити свободу громадянам, час звернутися до Сполучених Штатів прямо, без натяків. У промові перед мешканцями Маґадану, зверненій до Білого дому, наш Вождь оголосить: хоч режим і народився з РФП, він відкритий до реформ і не боротиметься з ними, а прийме їх.\n\nМи сподіваємося, що великий заклик до реформ почують конґресмени й сам президент та нарешті змінять думку про Росію і найкращий підхід до неї."

 MAG_operation_intrude: "Операція «Вторгнення»"
 MAG_operation_intrude_desc: "Порт Маґадану - один із найбільших російських флотських об'єктів, іще не окупованих чужими ворогами. Коли дозволяє погода, тут із різних причин регулярно зупиняються російські та іноземні кораблі. Та порт може мати ще одну функцію: приймати американське спорядження й припаси. Тому Матковскій склав плян пропозиції, від якої США не відмовляться.\n\nМаґадан розташований близько до Японських островів, лише за Охотським морем, і місцева радарна станція дала б нашим майбутнім союзникам змогу шпигувати за заклятими ворогами з ближчої відстані. Можливо, вони зрозуміють нашу користь і вирішать допомогти."

 MAG_the_vozhd: "Вождь"
 MAG_the_vozhd_desc: "Анастасій Андрєєвіч Вонсяцкій, або, як він воліє називатися, Вождь Росій, очолює фашистських емігрантів в Америці. Колись близького партнера Россійской Фашистской Партії, його відштовхнула пронімецька риторика Родзаєвского. Очоливши власну політичну організацію білих російських емігрантів - РФО, він здобув значну підтримку серед російських біженців у Сполучених Штатах.\n\nТепер, коли ми відкололися від Родзаєвского, Вонсяцкій може переглянути своє ставлення до РФП. Підтримка закордонної РФО дала б нам джерело доходів, недосяжне для бандитських нападів Родзаєвского та інших. До того ж ходять чутки, що він знає одного з найнебезпечніших людей Америки - колишнього оперативника УСС Мітчелла Вербелла III. Якщо Вождь може звести нас із ним, треба негайно звертатися."

 MAG_welcoming_werbell: "Привітати Вербелла"
 MAG_welcoming_werbell_desc: "Син царського офіцера Білої армії, Мітчелл Вербелл III під час Великої Вітчизняної війни став оперативником УСС. Він служив, зокрема, у тоді британській Бірмі та колишньому Французькому Індокитаї. Після вирішальної перемоги Японії повернувся до Америки на буденну роботу, але збагнув, що його покликання - бій. Відтоді він воював у конфліктах по всьому світу й дістав грізне прізвисько «Чарівник шепітної смерти».\n\nМатковскій вирішив, що партії буде корисно прийняти цього химерного чоловіка до своїх лав. Разом із ним прибуде почет найманців, які воювали по всьому світу й готові виконати будь-яку «мокру справу». Ми привітаємо його та його людей у портовому Маґадані. Тут вони матимуть досхочу роботи - мокрих справ вистачить усім."

 MAG_old_money: "Старі гроші"
 MAG_old_money_desc: "Російська фашистська організація Вонсяцкого об'єднує одних із найбагатших жертводавців російської еміграції. Заручившись його підтримкою, час спрямувати їхні гроші на вищу мету, ніж вечірки й зібрання в землі, яка ніколи не стане їм домом. Російські сини й доньки в Америці більше не бачитимуть, як партійні функціонери марнують гроші на дурниці: тепер вони підтримують справжній рух.\n\nРФО переправлятиме кошти з Америки через Беринґову протоку твердою валютою та спорядженням - військовим чи промисловим. Це неоціненно допоможе у війні з розкольниками й червоними. Незабаром ми підготуємо повернення цих відчужених братів і сестер до Росії, яку вони знали з дитинства: сильної, спроможної та неперевершеної."

 MAG_integrate_the_mercs: "Інтеґрувати найманців"
 MAG_integrate_the_mercs_desc: "Найманці Вербелла на голову вищі за наших солдатів. Інакше й бути не може: пройшовши війни всього світу, вони, мабуть, найелітніша сила Далекого Сходу, краща навіть за рештки Червоної армії. Вони вже довели користь Матковскому, і хай їхня вірність не перевищує платні, своїх грошей вони можуть вартувати.\n\nТа через незалежну вдачу вони діють поза командною структурою, слухають лише власних командирів і співпрацюють хіба за прямим наказом Матковского. Цьому слід покласти край. Ми введемо найманців до строю: вища майстерність не звільняє від підпорядкування начальству. Декому з росіян співпраця з Вербеллом огидна, та день, коли Росія стоятиме власними силами, ще далеко."

 MAG_our_secured_position: "Наша зміцнена позиція"
 MAG_our_secured_position_desc: "Царисти в Чіті погодилися на тимчасове перемир'я й навіть обмежену співпрацю. Американців задовольнили обіцянки реформ і проголошений у Маґадані та надісланий американським установам білль про права. З-за океану прийшла підтримка емігрантів: Вонсяцкій зволив приєднатися до хрестового походу за нашу священну Батьківщину. Позиція міцна; час закріпити переваги, поки ідеї Матковского пускають коріння на Далекому Сході.\n\nПерш ніж партія в Маґадані візьметься до святого завдання, варто зупинитися й дати наслідкам угод визріти. Хай закордонні гроші течуть до партійної скарбниці, а американська підтримка забезпечує стабільний прибуток. Обмежена співпраця з Чітою триватиме, поки ми з двох боків громитимемо послідовників Родзаєвского. Незабаром Матковскій використає здобуте для наступного кроку - сибірської армії."

 MAG_the_siberian_army: "Сибірська армія"
 MAG_the_siberian_army_desc: "Угоди з чужоземними державами, найманцями й царистами виграли нам час і дали перепочинок. Тепер партія може звернутися до головного знаряддя святого завдання - армії. Партія не пацифістська, та її бойове крило досі складається лише з новобранців і ополчення з вулиць та околиць Маґадану, озброєного грубими або несправними рушницями. Для походу на захід їх треба перетворити на професійну армію.\n\nМаємо кілька шляхів. Перший - місцева доктрина, адже росіяни найкраще воюють на російській землі. Другий - американські радники з досвідом світових проксі-війн. Останній - методи Вербелла в комплектуванні сил: його досвід не підведе. Що б ми не обрали, велике завдання триває."

 MAG_a_local_force: "Місцеві сили"
 MAG_a_local_force_desc: "Давно, під час громадянської війни та ненависної Революції, Матковскій був юнкером Білої армії, поки звістка про поразку не вигнала його на південь, до Маньчжурії. Більшість нинішнього штабу має схожу долю: офіцери Білої армії, вигнані з Батьківщини, що шукали прихистку на чужині й планували повернення. Вони переконані, що на російській землі переможуть лише російські тактика й стратегія; Матковскій поділяє цю думку, хоч іще не схвалив її.\n\nОбравши цей шлях, ми більше не проситимемо американської підтримки, крім військового майна, і відкинемо Вербелла, який дбає лише про найманців. Росіяни знають Росію найкраще, а тактика і червоних, і білих об'єднається, щоб підвести Батьківщину з колін. Наш обов'язок важкий і божественний - хрест, який можуть нести лише росіяни."

 MAG_white_army_tactics: "Тактика Білої армії"
 MAG_white_army_tactics_desc: "У майже забутому минулому, яке й сам Матковскій пам'ятає невиразно, Росія поділилася на білих і червоних. Білі билися за збереження богом установленого ладу, червоні - за робітничу утопію. Хоч білі зазнали поразки, їхні тактика й стратегія дали змогу триматися довше. Перейняти їхню доктрину, особливо для Далекого Сходу, - чудова думка.\n\nОфіцери вивчать основи старої Білої армії та застосують їх у підготовці наших сил. Хай спершу вони нагадуватимуть тактику Першої світової, сибірські умови й суворість викують із неї цілісну доктрину. Люди старого ладу дивитимуться з небес: ми не розчаруємо їх ані нині, ані згодом."

 MAG_legacy_of_the_union: "Спадщина Союзу"
 MAG_legacy_of_the_union_desc: "Червоні - наші вороги, це безсумнівно. Та їхня військова доктрина дуже цікавить офіцерів. Вони перемогли білих у громадянській війні. Вони стримували німців, навіть відступаючи до лінії А-А. Якщо західні оповіді правдиві, саме вони відкинули німців і повернули чимало священної землі Батьківщини. Підтримувати їхні ідеали й вивчати тактику - різні речі, і офіцери це добре розуміють.\n\nМи перериємо записи Маґадану й складемо цілісну доктрину з усього врятованого. Поєднання концентрації сили та промислової міці червоних послужить нам від Далекого Сходу до західних країв Росії. Можливо, з часом ми завершимо те, чого не змогли червоні: німці недовго топтатимуть російську землю."

 MAG_the_siberian_school: "Сибірська школа"
 MAG_the_siberian_school_desc: "Після ґрунтовного вивчення доктрин білих і червоних партійна армія Маґадану стала професійною силою, поєднавши їх у справді російську форму та зберігши сибірську спеціялізацію. Без чужої допомоги Матковскій і партія створили військо, здатне битися в сибірському холоді. Розкольники Чіти й Амура та червоні Бурятії й Іркутска навчаться нас боятися.\n\nЧас повести цю армію проти них. Партія її озброїть, офіцерський корпус - укомплектує. Ми володіємо найнебезпечнішою силою Далекого Сходу, і нас ніхто не спинить. За століття співатимуть про великих героїв далекосхідних земель - солдатів Сибірської школи, чий упевнений марш визволив Росію й вивів її на світову сцену."

 MAG_a_foreign_force: "Чужоземні сили"
 MAG_a_foreign_force_desc: "У російському способі ведення війни закорінилися помилки. У Першій світовій російські армії розгромили на Східному фронті, що посіяло насіння революції. У Другій червоні не могли зрівнятися з німцями, які відкинули їх до лінії А-А. Із заходу доходять оповіді про революційний фронт, що майже вигнав німців і повалив райхскомісаріяти, але в останню мить програв через внутрішню роз'єднаність.\n\nУ військовій справі час поглянути назовні - передусім на американських партнерів за Беринґовою протокою. Тісна співпраця дасть змогу вивчити їхній спосіб війни й одного дня опанувати ключ до перемог у конфліктах усього світу. Можливо, доктрина переважної вогневої міці та невпинного натиску проведе Росію крізь найтемніші часи."

 MAG_american_advisors: "Американські радники"
 MAG_american_advisors_desc: "За протокою лежить земля вільних - Америка. Вона захищала свободу в усьому світі, а її сини билися від Першої до Другої світової, від власної громадянської війни до проксі-конфліктів по цілому світу. Десятиліття війни дали їм досвід і різноманітні погляди, потрібні нам для прориву на Далекому Сході. Наші обіцянки й тісні урядові зв'язки дадуть цінні настанови в їхньому способі війни.\n\nМи попросимо американського представника в Маґадані надіслати радників. Прибувши, вони навчатимуть війська американської доктрини переважної вогневої міці й нищівної сили, доки наша армія не зрівняється з їхньою в майстерності тактики та стратегії. Їхня допомога буде незамінною, навчаючи офіцерів не лише битися, а й перемагати."

 MAG_superior_firepower: "Переважна вогнева міць"
 MAG_superior_firepower_desc: "За Другої світової казали: вистрілиш у британця - дістанеш у відповідь град швидкого й точного рушничного вогню. Вистрілиш у німця - він відповість кулеметом. Вистрілиш в американця - він викличе на твою позицію артилерійський удар і по радіо запросить підтримку авіяції. Величезна військова промисловість, живлена конкуренцією та велетенською робочою силою, робить їх страшним ворогом.\n\nНаша інфраструктура не витримає кількости ударів, якої потребує американська доктрина, та зі сталим потоком гармат і снарядів через протоку ми зможемо їх частково наслідувати. Проти різношерстих ворогів Далекого Сходу цього досить. А коли весь край буде наш, зможемо вповні втілити американські пляни й доктрини."

 MAG_maneuver_warfare_focus: "Маневрова війна"
 MAG_maneuver_warfare_focus_desc: "Далекий Схід величезний. Це найменш заселений і найсуворіший край Росії, але він охоплює понад третину її території. Без інфраструктури війни в лісах і тундрі повільні та мляві. Навіть найбільші армії ледве втримують суцільний фронт, не кажучи про розхристані сили Маґадану, Чіти, Родзаєвска чи Іркутска. Відповідь можуть дати американці з їхніми вантажівками та швидкими дорогами.\n\nЇхнє розв'язання? Маневрова війна. Замість безперервного протистояння американські інструктори вчать рухатися швидше за ворога, проходити крізь проміжки й використовувати діри в його лініях. Опинившись у тилу, частини чинитимуть хаос, ізолюватимуть ворога й відрізатимуть підкріплення. Ми ще не готові повністю прийняти цей метод, але вже можемо закласти основу."

 MAG_a_mercenary_force: "Наймані сили"
 MAG_a_mercenary_force_desc: "Поки інші обстоюють національну армію з різними підходами до війни, сумнозвісний найманець Вербелл пропонує, мабуть, найзухваліший плян реформи Маґаданських сил: армію, віддану не нації, а грошам і найвищій платні. Він хоче війська Солдатів без кордонів з усього світу, що битимуться за найвидатнішу справу свободи по цей бік Сибіру - Матковского. Матковскому лестить ця думка, але він має сумніви.\n\nОбравши цей шлях, ми запросимо всіх доступних найманців за живі гроші американських доброчинців. Партія збереже наявні формування, поповнюючи й розширюючи їх новоприбулими. Це, мабуть, найрадикальніший шлях реформи, тож рішення не можна приймати легковажно. Хоч це й потрібно для нашої справи, багато партійців сумніваються в добрих намірах Вербелла."
 
 MAG_soldiers_without_borders: "Солдати без кордонів"
 MAG_soldiers_without_borders_desc: "Матковскій вирішив. Вербелл може здійснювати свою програму армійської реформи: всі партійні частини поза його контролем збережуться, але до них приєднаються найманці з усього світу. Матковскій вірить, що Вербелл виправдає довіру, а армія Солдатів без кордонів швидко стане найсмертоноснішою силою Далекого Сходу.\n\nТим часом Вербелл зробить усе, щоб Далекий Схід став найкращим місцем для найманця. З усіх куточків планети прибуватимуть війська, присягаючи битися в ім'я Матковского - поборника свободи й демократії в Росії. Усі, хто почує заклик, відгукнуться, а світове найманське підпілля запалає ентузіязмом, доки Вербелл роздмухує полум'я."

 MAG_the_best_guns_money_can_buy: "Найкраща зброя за гроші"
 MAG_the_best_guns_money_can_buy_desc: "Нові бійці армії Матковского прибули. На заклик Вербелла до далекосхідної Росії відгукнулася безпрецедентна кількість найманців, готових будувати нову армію. Тепер проблема не в чисельності, а в озброєнні професіоналів. Сибірські фабрики роблять усе можливе, та брак зброї й припасів лишається. На щастя, Вербелл має плян.\n\nМітчелл Вербелл знає злочинний світ, а той знає його. Кілька послуг і підмащених долонь - і легендарний найманець, за його словами, легко подолає дефіцит. Якщо Матковскій погодиться, він обіцяє наповнити арсенали Маґадану не лише неймовірною кількістю зброї, а й найсучаснішими зразками замість дешевих місцевих виробів. Ба більше, він присягає за будь-яку ціну повести армію на об'єднання Росії. Треба простежити, щоб він дотримав слова."

 MAG_the_back_of_the_truck: "Із кузова вантажівки"
 MAG_the_back_of_the_truck_desc: "Обіцянки Вербелла дали плоди. Невідомо звідки з'явилася зброя для справи Матковского за майже неприбутковою ціною. Його мотиви досі загадка, але загрозою він начебто не є - поки що. Дефіцит усе ще існує, тож варто приховати запас на чорний день, а в Сибіру дощить завжди, коли не сніжить.\n\nНаче чарівник, що дістає з капелюха новий трюк, Вербелл пропонує інше розв'язання. Він знає контрабандні шляхи Беринґової протоки, приховані від совєцького залишкового флоту на Камчатці, а на півдні - дороги через Японську Маньчжурію поза оком Імператорської армії. На його думку, їх вистачить, щоб покласти край дефіциту. Нам лишається слухати."

 MAG_ready_at_last: "Нарешті готові"
 MAG_ready_at_last_desc: "Реформу Сибірської армії завершено. Ми готові зустрітися зі старим ворогом Родзаєвскім в Амурі й нарешті загоїти давній розкол РФП. Найдосвідченіші ветерани мріяли про цей день від захоплення Матковскім Маґадану. Після стількох років партія знову стане єдиною.\n\nМатковскій та офіцери негайно накажуть усім бути напоготові до операції проти Амура. Перемога певна, якщо все піде за пляном. Єдина непередбачувана карта - найманець Вербелл, якого привів Вонсяцкій. Сподіваємося, повідець досить короткий, щоб він не втрутився, але дехто бачить його зростаючу силу й сумнівається в наших заходах. Попри це операція має початися."

 MAG_matkovsky_secured: "Матковскій у безпеці"
 MAG_matkovsky_secured_desc: "Матковскій урятований. Наш знайомий найманець Вербелл намагався вбити його через суперечку про платню, але пильні партійні війська зірвали плян. Майбутній лідер Росії з найближчими довіреними людьми повертається до Маґадану. Родзаєвскому пощастило: без зради ми розгромили б його на місці. Та нагода знищити його назавжди скоро повернеться. Тепер Матковскій і партія мають подбати про внутрішню безпеку.\n\nОсновна маса найманців утекла з поля, розпалася на дрібні загони й бреде сибірською пусткою; інші здалися. Бойове крило партії полюватиме на розсіяні частини й даватиме вибір: служити Матковскому або померти. Остаточне рішення за ними - так чи так, Матковскій переміг."

 MAG_the_final_countdown: "Останній відлік"
 MAG_the_final_countdown_desc: "Найманці Вербелла намагалися вбити Матковского. Вони провалилися. Та їхні дії перервали найважливіші партійні операції: наступ на Амур і ліквідацію розколу старої РФП. Армію вже зібрано, навчено й озброєно, тож поступ майже не втрачено. Після замаху дамо війську трохи часу оговтатися.\n\nСолдати ненадовго повернуться до казарм. Американська техніка не вирушить на операцію незаправленою чи неготовою. Усі, від офіцера до рядового, перевірять спорядження. Верховне командування перегляне пляни й вирішить, чи потрібна додаткова підготовка. Наш шлях ясний, і ми йдемо без сумнівів: Родзаєвского буде переможено назавжди."

 MAG_d_day: "День «Д»"
 MAG_d_day_desc: "День настав. Армія з вичищеним і перевіреним спорядженням готова до бою з Родзаєвскім. Гармати націлено на Амурсько-Маґаданський кордон, щоб перші постріли запалили двобій колишніх товаришів. Досить наказу Матковского - і операція почнеться. Ми чекаємо короткої війни, де за кілька тижнів визначиться переможець; час слів минув, тепер лише сила вирішить, яке крило партії переможе.\n\nЗа кілька днів Матковскій особисто підпише наказ про наступ і передасть ведення війни підлеглим. Війська прорвуть тривожний неофіційний кордон із Родзаєвскім. Їх випереджатиме артилерійський вогонь, що розіб'є жалюгідне озброєне ополчення, яке Родзаєвскій сміє називати армією. Війна почнеться, Матковскій переможе, а далі чекатиме решта Росії."

 MAG_reunion: "Возз'єднання"
 MAG_reunion_desc: "Матковскій переміг Родзаєвского, а армія розв'язала їхню суперечку. Більше не буде розколотої партії, одне крило якої сидить в Амурі, а друге - в Маґадані. Та треба вирішити, що робити з рештками послідовників Родзаєвского. Хай вони й заблукали, колись ці люди поділяли ідеали Матковского, а залишивши Харбін, довели рішучість повернути й відродити Батьківщину.\n\nМатковскій буде поблажливий. Одягнувши руку в оксамит, зі свого високого крісла в Маґадані він даруватиме помилування й кари. Гідних милости пощадить і дасть спокутувати провину в бою. Скажених прихильників Родзаєвского зашле в сибірську глушину або стратить за злочини його правління. Коли курява вляжеться, спадщина Харбіна належатиме лише нам."

 MAG_keeping_the_past_alive: "Зберегти минуле живим"
 MAG_keeping_the_past_alive_desc: "Россійская Фашистская Партія знову єдина. Люди, що десятиліттями ворогували, обіймаються в дусі братерства між росіянами. Руки, які колись тяглися до пістолетів, ножів і гвинтівок, тепер сходяться в єдності та дружбі без злоби. Розкол позаду, й усі партійці приєднуються до святого хрестового походу Матковского за визволення Росії від загибелі й страждань.\n\nТа на Далекому Сході ще чекають вороги. Червоні Іркутска й Бурятії владнали свій розкол і готуються повернути колишні території. Далі на схід царисти тримають Чіту й небажаного монарха в позолоченій клітці. А з півночі доходять чутки про Отця та його подвиги. Усі вони впадуть, бо РФП тепер марширує не двома частинами, а єдиним цілим."

 ### WerBell Smuta tree ###

 MAG_merc_tree: "Вербелл - дерево Смути"

 MAG_the_man_who_sold_the_vozhd: "Людина, що продала Вождя"
 MAG_the_man_who_sold_the_vozhd_desc: "Смерть Вонсяцкого була, певною мірою, неминучою. З його відходом РФП утратила фінансову підтримку з-за океану, а найманці стали чужинцями в чужій землі. Не маючи особливого вибору, Мітчелл Вербелл здійняв переворот посеред підготовки до війни з іншим російським фашистом, що засів в Амурі, - Константіном Родзаєвскім. Розігнавши армію Матковского, Вербелл заволодів портовим містом Маґадан. На жаль, Матковскій утік.\n\nМаґадан - не бозна-що, але його гавань досить велика, щоб прийняти всіх солдатів удачі, які відгукнулися на заклик Вербелла. Хоч їх і небагато, найманці прочісуватимуть околиці й патрулюватимуть кордони Маґадану, полюючи на солдатів, що присягнули Матковскому. Полоненим ми дамо два варіянти: битися за Вербелла або померти. Чорт, може, під час довгих пошуків у глибині країни ми навіть знайдемо самого Матковского. Коли він помре, вважатимемо борг сплаченим."

 MAG_taking_back_whats_ours: "Повернути своє"
 MAG_taking_back_whats_ours_desc: "Матковскій, наш первісний наймач, надумав воювати з іншим крилом Россійской Фашистской Партії на чолі з Константіном Родзаєвскім. Нам у цій землі нема чого робити, крім як отримати платню за добре виконану польову роботу. Їхні ідеологічні клопоти, розколи, розбіжності й відгалуження нам ні до чого. Утім, коли тисячі людей благають відправити їх до інших куточків світу, ми можемо запропонувати їм угоду всього життя.\n\nМи підемо війною на Амур. Цей Константін, мабуть, уже гуляє в кабінеті, радіючи, що Матковскій, схоже, зник назавжди, а найманці чинно відпливуть геть. Що ж, на нього чекає сюрприз. Ми перетнемо неофіційний кордон і розтрощимо їх. Нічого особистого, пане Родзаєвскій; на наше виправдання, нам потрібні не ви, а добро у ваших сховищах. Коли ми викинемо його та його послідовників із Сибіру, можливо, настане час поглянути вперед, до чогось іншого, чогось... нового."

 MAG_consolidate_control: "Закріпити владу"
 MAG_consolidate_control_desc: "Настав час останньої війни проти Родзаєвского. Послужний список у нього довжелезний: король бандитів з Амура, засновник РФП і першорядний антисеміт. Вербеллу, втім, начхати і на нього, і на фракційні чвари в РФП. Тепер важить лише виживання. Родзаєвскій стоїть у нас на шляху. Без Амура та його покладів корисних копалин нам не оплатити найманців непривабливим експортом риби й хліба: треба знайти вихід, а в Родзаєвского є те, чого хочемо ми всі.\n\nЧас посилити нашу хватку на Далекому Сході. Родзаєвскому не можна дозволити встояти. Його армія бандитів і фашистів-аматорів не матиме жодного шансу проти сучасної досвідченої армії, озброєної найкращим спорядженням на всьому білому світі. Щойно ми з ним упораємося, почнемо планувати майбутнє. Бог свідок, вибору в нас хоч відбавляй."

 MAG_were_going_even_deeper: "Зариємося ще глибше"
 MAG_were_going_even_deeper_desc: "Після завоювання Амура всі думали, що повернуться додому. Дзуськи. Грошей із скарбниці Родзаєвского заледве вистачить заплатити найманцям, не кажучи вже про те, щоб відправити їх бозна-куди, звідки вони прибули. Не час тікати від проблеми; ми осядемо тут і копнемо трохи глибше. Може, ця земля таки дасть відповідь на наші клопоти.\n\nАле спершу - найголовніше. Наївно вірячи, що втечемо з цієї богом забутої землі, прихопивши «спадщину» Родзаєвского й Матковского, ми навіть не подбали про жодне цивільне управління. Тепер, коли нам судилося затриматися в Сибіру набагато довше, ніж гадалося, саме час навести лад у Маґадані й Амурі. Людям у цих глухих, відсталих містечках, мабуть, уже кортить звідси вибратися: і ми маємо для них ділову пропозицію."

 MAG_building_the_future: "Будувати майбутнє"
 MAG_building_the_future_desc: "Коли за давніх часів Антибольшевицького фронту Матковскій і Родзаєвскій розкололи партію, вони й гадки не мали, що переможцем у боротьбі за владу стане не один із них. Не чекав цього й уродженець Америки Вербелл, який місяцями тупцював сибірською землею з обличчям у багнюці. Та найманці під його проводом виграли сибірську громадянську війну з розмахом, гідним його довгої та славетної кар'єри.\n\nКурява вляглася. Нас досі непокоять платня, спорядження й моральний дух, але наразі ми в безпеці. На захід лежать землі царистів - диваків, які хочуть повернути імператора на чолі Росії. Далі - червоні; їхня сварка скінчилася, та результат і досі неясний. Із півночі наші каравани приносять чутки про Отця та його подвиги. Можливо, відповідь на наші проблеми криється в Якутії та Алдані, чиї копальні повні золота й діямантів. Майбутнє чекає, а найкраще ще попереду."
 
 MAG_WA_diamond_dogs: "Діямантові пси"
 MAG_WA_diamond_dogs_desc: "Що це тут у нас? Що це, бляха, тут у нас? Після стількох років, коли наші найкращі справи замітали під килим виродки з Управління, а писаки-нездари їх іґнорували, схоже, ми таки здобули прихильників. Оце так, трясця, хто б міг подумати?\n\nСлава багато на що годиться, але найкраще - на вербування найліпших і найталановитіших з усього світу. Наступні кілька тижнів ми оббиватимемо пороги ветеранських клубів і дзвонитимемо сумнівним знайомим в Африці, щоб дізнатися, хто з наших шанувальників готовий прославитися в Росії. Їх буде небагато - найкращих завжди мало, - та коли є досвід, кількість нам ні до чого."

 MAG_WA_junkyard_hounds: "Пси зі звалища"
 MAG_WA_junkyard_hounds_desc: "Дзінь-дзелень, угадайте, хто за дверима? Не Френкі Сінатра. І не клятий Річард Ніксон. Це добрий дядечко Мітчелл Вербелл прийшов нагадати про послуги. Посуньтеся, підставте стільці - зараз усе пояснимо.\n\nПам'ятаєте, як ми розважалися в Південній Америці? Як реготали разом із Батістою та Трухільйо? Як із тими мудаками з Управління задумували вторгнення на Гаїті? Ми славно бруднили руки, та настав час іще однієї роботи. Час покликати брехливих найманих покидьків, які вміють битися. Люди можуть бути не в захваті від сучих синів, яких ми привеземо, - не вершки суспільства, м'яко кажучи, - зате їх досить багато, щоб допомогти нам утримати фронт."

 MAG_WA_lawyers_guns_and_money: "Адвокати, зброя і гроші"
 MAG_WA_lawyers_guns_and_money_desc: "Кілька років тому ми виконували одну роботу в Арґентині для «Кока-коли». Бачте, вони мали проблему з місцевими. Якісь банди, справжні брудні виродки, переслідували їхніх керівників. Надсилали паскудні погрози. Намагалися викрасти. Вимагали грошей. Корпоративні покидьки аж у штани наклали й благали нас допомогти. Ми довго торгувалися, поки нарешті не домовилися: вони платять нам мільйон долярів, а ми дбаємо про безпеку.\n\nМораль цієї історії така: в корпоративних шишок грошей хоч греблю гати, треба лише знати, на які кнопки тиснути. Коли Росією швендяє стільки гидких типів і загрожує так званому «законному бізнесу», ми напевно змусимо корпорації розщедритися на гроші й зброю для нашого війська."

 MAG_WA_guns_from_the_patriots: "Зброя від патріотів"
 MAG_WA_guns_from_the_patriots_desc: "Знаєте, у голові ми завжди це чуємо. Далекий гуркіт снарядів. Падіння бомб. Ми й досі чуємо сморід обвуглених тіл, який тягнеться милю за милею, і відчуваємо на смак масний осад від боєприпасів. Росію від Китаю, Бірми чи Центральної Америки відрізняє лише холод. Такий холод, що глушить усі інші чуття.\n\nТа годі цієї довбаної поезії. Суть у тому, що нам потрібна вогнева міць - справжнє першокласне спорядження, до якого ми звикли. Треба подзвонити друзям у «Боїнґ», «Рейтеон» і «Локгід» та спитати, чи дістануть вони нам дорогі передові технології, які є лише в Америки. Їх буде небагато, зате вони далеко перевершуватимуть антикваріят, яким ми користуємося нині."

 MAG_WA_gun_launderers_bounty: "Нагорода збройного відмивача"
 MAG_WA_gun_launderers_bounty_desc: "Знаєте, колись ми думали податися в Голлівуд. Кіностудій, яким потрібна зброя для їхніх лайняних фільмчиків, хоч відбавляй. Їм потрібен хтось, хто дістане стрілецьку зброю й навчить їхніх кволих зірочок стріляти з пістолета. Чорт, ми могли б загребти статки, продаючи пукалки Клінту Іствуду та Джону Вейну.\n\nМи так і не скористалися нагодою, але це не значить, що ми геть вийшли з діла. І не значить, що ми вже не знаємо, де роздобути дешеві гвинтівки й пістолети, якими завалено чорний ринок. Може, вони й не найнадійніші, зате дешеві та їх багато - а нам тільки це й потрібно."

 MAG_WA_project_wingman: "Проєкт WINGMAN"
 MAG_WA_project_wingman_desc: "Колись давно французи завели собі міжнародну бойову силу. Можете повірити, що така дрібненька країна, як Франція, спромоглася на це? Люди з усього світу їдуть битися й помирати за обіцянку братерства, за громадянство. Вони звозять бійців із цілого світу, кажуть їм, що ті стануть «Français par le sang versé», а тоді посилають у черговий конфлікт.\n\nНастав час завести таку й Росії - не лише для армії, а й для повітряних сил. Ми вербуватимемо пілотів і купуватимемо чужоземні літаки, щоб створити найкращі й єдині міжнародні повітряні сили на планеті. Покидьки можуть заперечувати проти такого різношерстого товариства в небі, та збірна солянка краща за цілковиту відсутність авіяції."

 MAG_WA_operation_philanthropist: "Операція «ФІЛЯНТРОП»"
 MAG_WA_operation_philanthropist_desc: "Господь допомагає тим, хто допомагає собі сам. Ми ніколи не були великими книголюбами, та майже певні, що це з Біблії. Десь поруч із віршами про те, як кидати грішників у вогненні озера й не давати прихистку нечестивим.\n\nІ ми якраз маємо плян, що втілить усе це в життя. Називаємо його операцією «ФІЛЯНТРОП». Найближчими днями завеземо досить бронетехніки, щоб створити окремий підрозділ - з безпрецедентним захистом, вогневою міццю та маневровістю. А тоді за допомогою цієї високотехнологічної техніки влаштуємо пекло неброньованим покидькам, які насміляться стати нам на шляху."

 MAG_WA_firebase_zulu: "Вогнева база «Зулу»"
 MAG_WA_firebase_zulu_desc: "Наші останні вороги діють у тіні, ведуть війни й зводять рахунки без нашого відома. Без знань і розвідданих будь-яка спроба прибрати до рук та завоювати північ і захід буде ризикованою. Поки ми відпочиваємо й відновлюємо сили, треба зібрати відомості про супротивників. На щастя, ми знаємо як.\n\nМи збудуємо вогневу базу «Зулу» - передову оперативну базу на самому краю нашої політичної та фактичної влади. Звідти війська сповіщатимуть верховне командування про найменші зміни в складі й розташуванні ворожих дивізій. Половина перемоги - знати себе, казав колись Сунь-цзи, а друга половина - знати ворога. Цим кроком ми ще трохи наблизили свій успіх на Далекому Сході."

 MAG_WA_supply_base_moses: "База постачання «Мойсей»"
 MAG_WA_supply_base_moses_desc: "Проблема номер один нашої Солдатської Республіки - логістика. Та сама проблема була в нас на війні. Солдатів у нас хоч відбавляй, але доставити їм зброю, харчі й спорядження, потрібні для справжнього бою, - довбаний кошмар.\n\nГосподи. Треба якось доставляти матеріяли на передову. І простого способу нема: доведеться створити новий великий вузол постачання, який пришвидшить перевезення вантажів із Маґадану. Поговорімо з хлопцями й подивимося, що вони придумають."

 MAG_WA_making_acquaintances: "Завести знайомства"
 MAG_WA_making_acquaintances_desc: "Після обезголовлювального удару не треба сидіти на довбаній дупі. Треба вводити армію, поки ворог не встиг перегрупуватися й поки якась нова гадюка не об'єднала покидьків та не переконала їх ударити по вас.\n\nСаме це має статися в Маґадані. Матковского більше нема, тож треба ввести сили й закріпити владу над його так званою РФП. Перерізати телефонні лінії. Перекрити дороги. Повісити самозваних наступників і саботажників. Порядок буде - хочуть цього покидьки чи ні."

 MAG_WA_second_chances: "Другий шанс"
 MAG_WA_second_chances_desc: "Усі бюрократи однакові, чорт забирай. Байдуже, чи вони з Вашинґтона, Німеччини або такого жалюгідного фашистського гадючника, як Маґадан. Вони заманюють солдатів фантастичними обіцянками багатства й нагород. А коли настає час платити, намагаються втекти. Ну не абсурд? Жодної поваги. Жодної вірности. А тоді опиняються не з того боку ствола, бо розлютили не тих людей.\n\nМи не повторюватимемо довбаних помилок Матковского. Ні. Солдати знають вірність. Характер. Чесність. Знають свої обов'язки й межі. Хай багато хто з Матковсківських людей - мудаки, зате це наші мудаки. Вони знають, як працює система, і вони нам потрібні, навіть якщо дехто з місцевих хоче їхніх голів."

 MAG_WA_grease_the_palms: "Підмастити долоні"
 MAG_WA_grease_the_palms_desc: "Щойно людина розв'яже одну проблему й уже збирається хвилинку перепочити, як на її місці з'являється інша. Як завжди.\n\nТі задроти з Маґаданської скарбниці кажуть, що наші фінанси - гаплик. Доходів майже нема через відсутність промислової бази. Витрат сила-силенна через усі війни й військові закупівлі. Вони бігають колами й верещать про неминучу фінансову катастрофу, хоча розв'язання очевидне: надрукувати більше грошей. Нам лише потрібен солідний грошовий запас, щоб пом'якшити наслідки військового розширення. Незабаром у нас однаково буде досить ресурсів, щоб підкріпити ці гроші."

 MAG_WA_sog_foxhound: "ГСО «ФОКСГАУНД»"
 MAG_WA_sog_foxhound_desc: "Бувало, що ваш гарнізон днями груз у багнюці через наступ ворога? Бачили, як солдати перебирають вервицю, бо все навкруги - повний пиздець? Армія розв'язує таку проблему спеціальними підрозділами, здатними діяти в тилу ворога. Сили спеціяльних операцій можуть саботувати ворожі лінії постачання, вести розвідку й лишати ворогові всілякі маленькі сюрпризи.\n\nТож так, ми зберемо найкращі кляті сили спеціяльних операцій, які тільки зможемо. А коли фашистські сучі сини побачать наших ретельно відібраних, спеціяльно навчених бійців, ґарантуємо: їхні сорочки будуть не лише коричневими."


 #################################
 ##=====| Matkovsky Trees |=====##
 #################################

 ### Matkovsky Smuta tree ###

 MAG_matkovsky_tree: "Матковскій - дерево Смути"

 MAG_the_march_of_the_siberian_riflemen: "Марш сибірських стрільців"
 MAG_the_march_of_the_siberian_riflemen_desc: "Тепер, коли армія нарешті стала боєздатною, час випробувати її й почати повернення Росії!\n\nПодібно до сибірських стрільців і давньої Білої армії, ми рушимо тайгою на захід, доки наша пісня не залунає в Кремлі. Від Амура до Балтійського моря знову постане вільна й велика Росія. Ми загасимо жарини червоних та інших самозванців, а тоді звернемося проти німецької загрози й назавжди викорінимо цю пошесть.\n\nЩоб здійснити мрію, треба ще багато зробити. Партія поліпшить мережі постачання, логістику, мобілізаційні пляни й усе потрібне для перемоги. Вождь Матковскій вестиме нас, пам'ятаючи славетне минуле й провадячи до кращого майбутнього!"

 MAG_convening_the_war_council: "Скликати Воєнну раду"
 MAG_convening_the_war_council_desc: "Далекий Схід багатий землею, ресурсами й красою, але не людьми. Освічені фахівці тут на вагу золота, а колишні університети заходу далеко. Розпад центрального уряду зруйнував освіту, і це треба виправити.\n\nМи щедро дамо роботу бюрократам і писарям, навченим совєцького рахівництва, якщо вони присвятять себе партії та новій святій Росії. З їхньою підтримкою закладемо основу сучасної держави й досконалої політичної організації, де партія визначає курс нації."

 MAG_gathering_the_remnants: "Зібрати рештки"
 MAG_gathering_the_remnants_desc: "Відколи Матковскій порвав із германофілами Родзаєвского, наші чорносорочечники - збройне крило РФП - животіють без діла. Через вужче, ніж в Амурі, розуміння «виродження» потреби в них майже не було.\n\nУ Харбіні вони були діяльні, навчені й дисципліновані. Тепер валяються п'яницями й громилами на підлогах шинків. Їх треба виправити й викувати в списи, що проб'ють серця ворогів. Вони стануть аванґардом хрестового походу за об'єднання країни - слабкість недопустима."

 MAG_drafting_the_countryside: "Призов на селі"
 MAG_drafting_the_countryside_desc: "Фашистській партії завжди бракувало людей. Бундючна мужність і сила чорносорочечників у Маґаданських барах приваблювали міських рекрутів, але сільського Сибіру ми майже не торкалися.\n\nВіднині це зміниться. Для національної революції відчайдушно потрібні люди, тому служба стане обов'язковою. За націю битимуться мисливці, хлібороби й навіть нікчемні писарі. Амурське крило дихає нам у потилицю, тож для перемоги над ним і возз'єднання партії та Росії потрібен кожен патріот."

 MAG_reinforcing_the_port: "Зміцнити порт"
 MAG_reinforcing_the_port_desc: "За Беринґовою протокою й Тихим океаном американці бачать у партії можливого союзника проти Німецької та Японської імперій. Контролюючи великий порт Маґадану, ми єдина російська держава, куди вони можуть надійно надсилати допомогу. Сюди ж пливуть найманці з усього світу, найняті за купи дзвінкої монети таємничими доброчинцями.\n\nЩоб зберегти перевагу, потік допомоги має тривати. Порт треба ремонтувати й розширювати. Це швидко окупиться, прискоривши постачання до Маґадану й, можливо, ще більше зацікавивши американців."

 MAG_keeping_the_aid_flowing: "Підтримувати потік допомоги"
 MAG_keeping_the_aid_flowing_desc: "Вонсяцкій - дивна людина: щиро вірить у РФП, але рідко працює для неї як слід. Він зрікся Родзаєвского та його нацистської риторики, та американці судили його за співпрацю з німецькими інтересами. Ми заплющуємо на це очі, бо дружина Вонсяцкого - багата спадкоємиця. Інвестиції й зв'язки її батька в американських залізницях дають йому змогу спрямовувати кошти партії; задовольнивши його, дістанемо більше.\n\nАбо ж можна шукати підтримку не лише в однієї людини. Монархісти Чіти зверталися до еміграції, і ця стратегія може спрацювати. Та наш зв'язок із Родзаєвскім багатьом не сподобається. Щоб здобути нефашистських прихильників, ми мусимо здаватися поміркованішими й найкращими кандидатами на визволення Росії."

 MAG_an_arm_of_the_party: "Рука партії"
 MAG_an_arm_of_the_party_desc: "Постало питання про роль партійного воєнізованого крила.\n\nМатковскій вважає, що ці солдати мають лишатися під твердим партійним контролем. Він бачить небезпеку, пам'ятаючи бандитське використання чорносорочечників Родзаєвскім та італійцями. Їхня жорстокість підірвала підтримку РФП і мусить бути стримана. Та вони дають партії й нації більше користи: ця рука сягає поза бюрократію та контролює державні справи й щоденне життя. Пєтлін не згоден, але що він знає? Поміркованість перед війною лише принесе перемогу виродженню."

 MAG_a_tool_of_the_state: "Знаряддя держави"
 MAG_a_tool_of_the_state_desc: "Постало питання про роль партійного воєнізованого крила.\n\nПєтлін хоче впорядкувати партійних вояків в окрему від політичних органів ієрархію. Це стара ідея республіканців 1917 року та багатьох держав, заплямованих Німецьким Райхом. Незалежна структура ухвалення рішень без махінацій невігласів-політиків приваблива. Та випустивши військо з поля зору, партія бодай опосередковано послабить абсолютну владу над громадським і політичним життям. Зазвичай заперечення Матковского закінчило б суперечку; цього разу він віддає рішення Воєнній раді."

 MAG_towards_a_republic_of_toil: "До Республіки Труду"
 MAG_towards_a_republic_of_toil_desc: "Партію та її воєнізовані сили реорганізовано, й Воєнна рада готує повернення Далекого Сходу. Колишні союзники в Чіті й Амурі стали перешкодами на шляху до єдиної Росії. Матковскій відкидає «Азбуку фашизму» Родзаєвского й уявляє нову республіку праці й труду: суспільство, де місце людини визначає піт на чолі, а не жорстка расова ієрархія чи нездарні імператори. Робітникам не треба організовуватися, вести колективні переговори чи приймати соціялістичні ідеали, що розбестили націю. Натомість партія подбає про особисті потреби в обмін на повну відданість російській державі.\n\nЗаради цієї мети ми билися й битимемося далі."
 MAG_towards_a_republic_of_toil_tt: "§GВідкриває можливість подальшого розширення в регіоні.§!\n"

 MAG_the_program_of_survival: "Програма виживання"
 MAG_the_program_of_survival_desc: "Далекий Схід завжди був негостинним, навіть після інтеґрації до Росії та західних інвестицій. Без центрального уряду він поринув у ще глибшу анархію. Якутські алмазні й золоті копальні могли б фінансувати революцію, а комуністи успадкували більшість совєцької бюрократії та перевагу в плянуванні. Партія має не економічний плян, а лише плян виживання.\n\nВоєнна рада це змінить. Вона закладе основу швидкого виробництва й індустріялізації, щоб зброя, уніформи й незліченне військове спорядження безупинно йшли з Маґаданських і заморських фабрик до наших солдатів. Тоді ми нарешті матимемо економічний плян."

 MAG_the_american_suppliers: "Американські постачальники"
 MAG_the_american_suppliers_desc: "Кораблі з контейнерами зброї перетинають Беринґову протоку й заходять до великого порту Маґадану. У них - наша перевага над сибірськими самозванцями: щедра допомога наддержави. Хай ця зброя лише залишки американського війська, вона добре послужить. Якщо далі догоджатимемо американцям, вантажів побільшає. Їхні умови можуть обмежити наш контроль, але без їхньої підтримки не було б чого контролювати, а ця зброя прокладає шлях до єдиної Росії без чужого втручання!"

 MAG_advisors_and_volunteers: "Радники й добровольці"
 MAG_advisors_and_volunteers_desc: "Зброя й припаси допомагають вигравати війни, але нічого не варті без умілого користувача. Попри недавні реформи, нашому війську бракує професійности поруч з арміями об'єднаних держав. Більшість населення була селянами, коли впала Росія, а небагатьох навчали лише японські офіцери в Харбіні чи нездарні совєцькі генерали.\n\nЄдина можливість - нова американська допомога: радники навчать армію передової сучасної тактики. Наші воєнізовані сили здобудуть перевагу над жорстокими фанатиками Родзаєвского й старомодними рештками Білої армії Чіти."

 MAG_eliciting_aid: "Виманити допомогу"
 MAG_eliciting_aid_desc: "Цицерон казав, що нерви війни - нескінченні гроші, і мав цілковиту рацію. Ізольовані й без союзників на Далекому Сході, ми звертаємося до американських друзів. США схвалили Трудову партію новими партіями зброї та набоїв, але Маґадан - голодний звір і вимагає більшого.\n\nМатковскій знає: американці допомагають не з ідеологічної доброти. Це практичність - до нас найлегше дістатися, а Росія Матковского буде дружньою до американських інтересів, тобто корпоративних. Щоб підсолодити угоду капіталістичним друзям, Росія розстелить червону доріжку й засвітить вивіску: «Росія відкрита для бізнесу!»"

 MAG_the_harsh_light_of_freedom: "Суворе світло свободи"
 MAG_the_harsh_light_of_freedom_desc: "Критики нитимуть, що Матковскій і Воєнна рада віддають російські багатства американському бізнесу, але не бачать цілого. Так, більшість Маґаданських грошей пішла до Вашинґтона. Так, росіяни затягують паски. Та ця жертва - інвестиція в майбутнє. Американська зброя, радники й машини повернуть кожну копійку. І справа ніколи не була в грошах: багатства прийдуть пізніше, а нині треба повернути землі, захоплені нацистами, царистами й комуністами.\n\nСьогодні нам скрутно. Завтра здійсниться мрія Трудової партії та вільної Російської Національної Республіки."

 MAG_local_manufactories: "Місцеві мануфактури"
 MAG_local_manufactories_desc: "Ми вдячні за американську підтримку, але мусимо тримати шанобливу відстань. Одного дня Америка має побачити в нас рівного, а не економічного васала. Для цього потрібні власні зброя й матеріяли. Маґадан невеликий, але автаркія має десь початися.\n\nФабрики знову заревуть. Партія сурмитиме про переваги економічної незалежности. Буде важко, й ми не брехатимемо людям, але вони приймуть нашу думку. Коли росіяни повернуть Батьківщину зброєю, викуваною власними руками, ми нарешті прийдемо додому."

 MAG_confiscation: "Конфіскація"
 MAG_confiscation_desc: "Трудовицька справа не заперечує вільного підприємництва як такого, але Маґадан заразила люта форма капіталістичного вірусу. Виробництво нікчемного мотлоху триває від падіння совєтів. Вимога до п'явок проста: перейти на потрібні війні товари або втратити майно на користь Воєнної ради й вирушити в тундру. Як Ісус вигнав міняйл із храму, Матковскій вижене капіталістичних паразитів зі Святої Росії."

 MAG_and_seizure: "...і вилучення"
 MAG_and_seizure_desc: "Землевласники - ще одна пошесть Маґадану. Надто багато жадібних щурів нагромаджують землю й видирають оренду з патріотів. Та земля належить усім росіянам, а від їхнього імені говорить Трудова партія; отже, землевласники - лише самозахопники державної власности. Вони отримають той самий ультиматум: віддати землю або померти. Нам ніколи слухати ниття про звичаї й угоди. Воєнна рада не сперечається з паразитами - вона вимагає покори."

 MAG_vae_victis: "Vae Victis"
 MAG_vae_victis_desc: "Переможених комуністів, якутів і сибіряків тепер мільйони. Вони тремтять перед молотком, який вирішить їхню долю, й глузують зі справедливости Матковсківської справи.\n\nДесятиліттями на харбінських емігрантів дивилися з підозрою та зневагою, як завойовники на нових підданих. Тепер фортуна змінила бік. Тож кажемо: «Vae Victis! Горе переможеним!» За зраду Святої Росії ми надягнемо на них кайдани покаяння й покладемо на спини тягар злочинів. Партія братиме потрібне тоді, коли їй треба."

 MAG_for_a_russia_strong: "За сильну Росію"
 MAG_for_a_russia_strong_desc: "Коли емігранти тікали з Росії через кордон до Харбіна, вони мріяли повернутися в хрестовому поході, що очистить Росію від імперського застою й комуністичного збочення. Коли єдина партія рушила на Далекий Схід, ця мрія палала в їхньому сні. Ті дні наближаються. Американська підтримка й місцеві зусилля разом утілять мрію. Завдання геркулесове, але кожне російське серце нездатне здатися."
 MAG_for_a_russia_strong_and_united_tt: "§YМи утвердили владу над Далеким Сходом. Стане доступне нове дерево фокусів.§!"

 MAG_the_program_of_unity: "Програма єдности"
 MAG_the_program_of_unity_desc: "Між росіянами за кордоном і вдома завжди існував особливий зв'язок. Через порт Маґадану партія поширює заклик до єдности між відчуженою діяспорою та мешканцями Батьківщини. Цей союз - життєва сила РФП: пожертви живлять об'єднання країни, а лобі за кордоном робить чужі уряди прихильнішими та прискорює допомогу.\n\nДля перемоги у війнах за возз'єднання Маґадан мусить зберегти цей зв'язок."

 MAG_the_national_appeal: "Національний заклик"
 MAG_the_national_appeal_desc: "На одному боці - прихильність місцевих росіян. Після двох десятиліть поділу комуністичні, монархічні, ліберальні та інші кліки змагаються за серця мешканців розбитої землі. Ні Амурське крило, ні комуністи, ні Чітинські монархісти не перевершать партію: Матковскій стоїть за звичайного росіянина. Ідеали праці й труду ширитимуться до найтемнішого куточка, а радіо покаже волю партії в її святому поході."

 MAG_aid_from_emigres: "Допомога емігрантів"
 MAG_aid_from_emigres_desc: "У різноманітній російській еміграції наші справи з Вонсяцкім - лише частина картини. Російський трудовий рух чи не найбільше виграє від доброчинної підтримки партійного правління. Розсіяна по світу праведна російська діяспора приходить на допомогу Батьківщині: кров густіша за воду, а всіх єднає російська сутність. Американська допомога надзвичайно щедра, та більше не завадить. Партія має звернутися до громад із колишньої вільної від комунізму Росії й згуртувати їх."
 MAG_aid_from_emigres_tt: "§YМи одержимо допомогу від російської еміграції в Америці; її обсяг залежить від добрих відносин із Вашинґтоном.§!"

 MAG_the_propaganda_front: "Пропаґандистський фронт"
 MAG_the_propaganda_front_desc: "Правду часто важко проковтнути, й дорогою до світлого чистого майбутнього буде чимало гіркоти. Партія вірить у російську здатність терпіти труднощі, але народ нічого не знає про управління. Навіть найкращі пляни не здійсняться без усіх складників; майбутнього не побачити без повноти його митей. Партія подає правду як жертву, аби життя не гинули в затяжному політичному поділі.\n\nНеминуча перемога залежить від готовности росіян витримати довгу боротьбу, й партія мусить завжди готувати їх до маршу."

 MAG_extol_russian_unity: "Звеличити російську єдність"
 MAG_extol_russian_unity_desc: "Німці, а перед ними большевики, розірвали зв'язки між росіянами. Червоні поділили суспільство за класом і нацькували багатих на бідних. Німецькі бомби розбили слабкі шви СССР і російську ідентичність, мов скло. Росіяни ріжуть росіян, а вірні меншини без проводу чинять безлад. Треба нагадати людям, за що стояла країна й чим вона знову стане.\n\nПереконати лише своїх замало - мусимо нагадати всій Росії. Дрібні держави й нелегітимні уряди на кордонах теж повні росіян. Якщо одного дня вони ввійдуть до відроджуваної нації, то теж мають почути наш заклик."

 MAG_for_our_freendom_and_yours: "За нашу і вашу свободу"
 MAG_for_our_freendom_and_yours_desc: "У руках Гітлера й Родзаєвского фашизм здобув жахливу й цілком хибну славу. Ми фашисти й не перепрошуємо, але маємо дбати про образ і відмежуватися від чудовиськ Германії та особливо Амурського бандитизму.\n\n«За нашу і вашу свободу» - сильне гасло РФП. Ми меритократія, так само віддана свободі, як будь-який американець. Ми також трудовики, віддані правам робітника й економічній свободі не менше за будь-якого ліберала. З часом уся Росія матиме свободи, які ми обстоюємо в Маґадані."

 MAG_loyalty_above_all: "Вірність понад усе"
 MAG_loyalty_above_all_desc: "Воля, свобода, громадянські права - прекрасні ідеали нашого руху. Та всьому свій час і місце. Мир і процвітання - родючий ґрунт для дорогих нам свобод, але Росія не має ні миру, ні процвітання.\n\nНині партія просить лише одного: вірности.\n\nВіддані цивільні й герої трудовицької справи зрозуміють. Свобода зачекає, поки ситуація не буде цілком під контролем. Лише червоні аґітатори чи чорносорочечники-шпигуни заперечуватимуть Матковскому й Воєнній раді; вірні приймуть дійсність."

 MAG_liberty_or_death: "Свобода або смерть!"
 MAG_liberty_or_death_desc: "Партія, звісно, підтримує свободу - лише не демократію. Риторична шана республіканству може дати закордонну підтримку емігрантів, які хочуть російської демократії. Це небезпечно: у Матковсківському майбутньому нема плебісцитів. Та наше становище хитке, на лезі ножа. Можна сказати примирливі слова про народний суверенітет і звернутися до мас. Одного дня від нас вимагатимуть виконати обіцянки. РФП утратить частину своєї сутности, але Росія варта будь-якої ціни."

 MAG_for_a_russia_united: "За єдину Росію"
 MAG_for_a_russia_united_desc: "Коли ми покинули Харбін і Маньчжурію, то думали, що повертаємося додому. Нас зустріли голий отруєний ґрунт, нещадні зими й жорстокість інших фашистів. Ніхто не чекав з обіймами чи теплим вогнем. Далекий Схід був і є землею з уяви Дарвіна: слабкі гинули, брат ішов на брата, мрії розбивалися.\n\nМатковскій не плаче - сльози не воскресили б мертвих. Поки крижаний вітер б'є у вікна, Вождь готується до останнього бою з відчуженими братами, усіма синами Харбіна. Коли гвинтівки змовкнуть від Іркутска до Маґадану, ми здобудемо бажану Матковскім єдність."

 ### Matkovsky Regional Political Tree ###
 MAG_from_the_taiga_to_the_seas: "Від тайги до морів"
 MAG_from_the_taiga_to_the_seas_desc: "Далекий Схід об'єднався під владою єдиного правдивого Вождя - Міхаїла Матковского. Маґадан став великою силою в Росії.\n\nТа завойовані землі розрізнені й слабо пов'язані адміністративно та політично. Треба міцніше об'єднати їх, створити справжнє відчуття єдности й ефективніше придушувати повстання. Народ точно знатиме, хто ним править."
 
 MAG_call_the_party_congress: "Скликати партійний з'їзд"
 MAG_call_the_party_congress_desc: "Держава росте й змінюється, отже так само мають змінюватися політична система та управління. Новостворена Русская Національная Трудовая Партія, колишня РФП, скличе з'їзд і визначить потрібні реформи державної структури.\n\nВождь готовий поступитися частиною ідеалів заради стабільнішої та дієвішої держави. Це слід врахувати під час поліпшення уряду."
 
 MAG_establish_the_far_north_construction_fund: "Заснувати Дальстрой"
 MAG_establish_the_far_north_construction_fund_desc: "Хоч Вождь приніс мир і стабільність, багато хто хоче зруйнувати створене нами. За нинішнього політичного клімату страти незручні, тому буде створено ФБКП, або Дальстрой.\n\nОфіційно це трудова програма розвитку інфраструктури, будівництва та видобутку. Насправді - мережа таборів примусової праці для політичних противників і дисидентів. Справді цивілізованіший спосіб із ними впоратися."
 
 MAG_a_fresh_coat_of_paint: "Свіжий шар фарби"
 MAG_a_fresh_coat_of_paint_desc: "Ми нібито відкинули фашистську спадщину, щоб привести Далекий Схід до сучасности - принаймні так волають пропаґандистські млини. Насправді Вождь Матковскій досі міцно тримає партію.\n\nТа після з'їзду сталася велика зміна: партія поділилася на трудовиків Матковского, реформістів міністра Ніколая Пєтліна й стару гвардію, що ще не висунула лідера. З часом вони можуть стати основою нових партій."
 
 MAG_the_seven_ministries: "Усередині міністерств"
 MAG_the_seven_ministries_desc: "Вождь талановитий письменник, мислитель і політик, але навіть він не може сам керувати урядом.\n\nДля Національної Республіки буде створено сім міністерств: закордонних справ, скарбниці, освіти, поліції та юстиції, оборони, народного господарства й праці.\n\nКерівників призначає Вождь, вони мусять виконувати його волю, а він може звільнити їх будь-коли."
 
 MAG_form_the_grand_sobor: "Утворити Великий Собор"
 MAG_form_the_grand_sobor_desc: "Зємскій Собор, або земські збори, був російським парламентом XVI-XVII століть, що радив цареві й допомагав керувати Росією. Часи змінилися, але правитель і досі потребує допомоги.\n\nЗа наполяганням Пєтлінських реформістів буде утворено Великий Собор - парламент при Вождеві, що радитиме й допомагатиме керувати Далеким Сходом, як його попередник багато століть тому."
 
 MAG_a_federalist_model: "Федералістська модель"
 MAG_a_federalist_model_desc: "Обговорюючи управління велетенською Росією, слід розглянути федералізм. Автономія провінцій і територій дає політику, пристосовану до кожного краю.\n\nТака система заохочує громадянську участь і зменшує навантаження на центральний уряд. Вона може послабити Вождя, але водночас закріпити його владу."
 
 MAG_by_the_will_of_the_vozhd: "Волею Вождя"
 MAG_by_the_will_of_the_vozhd_desc: "Вождь став найвищим правителем не тому, що просто ввійшов і сів за найбільший стіл. Для цього знадобилися роки праці, політичні знання й мудрість.\n\nДопомога нижчих людей, особливо нездатних самим здобути владу, йому майже не потрібна. Цим землям досить волі й авторитету Матковского. Думка, ніби він потребує помочі, безглузда й має бути відкинута."
 
 MAG_one_nation_under_god: "Єдина нація під Богом"
 MAG_one_nation_under_god_desc: "Навіть думка про владу когось, крім Вождя, межує зі зрадою. Федерація лише плекатиме сепаратизм і шкодитиме дієвості єдиного уряду.\n\nЧимало наших територій раніше самі собою керували й воювали з нами; люди можуть плекати образи й обирати ворожих урядовців. Якщо місцеві адміністрації захочуть відокремитися, ця загроза паралізує країну. Тому держава лишиться централізованою."
 
 MAG_national_renewal: "Національне оновлення"
 MAG_national_renewal_desc: "Росіяни - один із найвеличніших народів Землі. Ми витримали безприкладні страждання від німецької почвари, що підкорила Европу й зламала всі імперії континенту. Лише росіяни підвелися й знову мобілізувалися проти Райху; ми билися самі, без допомоги й перепочинку.\n\nНавіть у поразці ми завдали нацистському велетню нищівного удару, зруйнувавши економіку й оголивши слабкості. Після десятиліть ганьби й утрат росіяни сильні, й під проводом Вождя світ побачить цю силу."
 
 MAG_look_towards_washington: "Поглянути на Вашинґтон"
 MAG_look_towards_washington_desc: "Росія колись була велетенською й різноманітною землею, як і її народи: від казахів Центральної Азії до українців Східної Европи. Якщо ми об'єднаємо Росію й станемо господарями Европи та Азії, країна мусить бути відкритою людям усіх вір і національностей, як Сполучені Штати. Треба реформувати імміґраційні закони й запросити більше чужоземних робітників."
 
 MAG_the_land_of_opportunity: "Земля можливостей"
 MAG_the_land_of_opportunity_desc: "Найпотужнішою перетворювальною силою світу раз у раз виявлявся вільний ринок. Він перетворив аграрну глушину Сполучених Штатів на промислову наддержаву, здатну поширювати вплив по світу; отже, він може зробити з нашого холодного східного виступу промислово-торговельний центр Росії.\n\nМи дерегулюємо економіку й відкриємо нові галузі приватному секторові. У нашій Росії кожна людина матиме право на піт власного чола."
 
 MAG_return_to_harbin: "Повернутися до Харбіна"
 MAG_return_to_harbin_desc: "РФП не була такою сучасною чи поступовою, як Русская Національная Трудовая Партія, але зробила великі речі для нашої держави й Росії. Попри вади, її фашисти любили Росію та російський народ.\n\nБуло б помилкою сліпо відкидати методи, якими партія привела нас до величі. Замість шукати натхнення в США, тримаймося успішного досвіду й по-своєму здійснюймо мрію про об'єднану Росію."
 
 MAG_the_manifesto_of_national_labor: "Маніфест національного труду"
 MAG_the_manifesto_of_national_labor_desc: "Нещодавно Вождь Матковскій написав політичний маніфест нової ідеології національного синдикалізму, який неодмінно читатимуть у найвищих колах світу. Чотири розділи описують політичні, суспільні, військові й фінансові цілі руху.\n\nСеред них - загальне виборче право, націоналізація збройової промисловости, реорганізація залізниць і транспорту та зниження пенсійного віку з 65 до 55. Дехто порівнює працю Вождя з подібними маніфестами 1930-х, але просто не визнає його природної величі."
 
 MAG_the_stability_of_our_state: "Стабільність нашої держави"
 MAG_the_stability_of_our_state_desc: "Держава багато в чому безпечніша, ніж раніше: кордони чіткіші й легші для оборони, весь Далекий Схід наш, армія сильна як ніколи. Та в інших, можливо важливіших, аспектах вона нестабільніша.\n\nУряд ледве керує територією й населенням, набагато більшими за первісний задум; всюди з'являються ідеологічні повстанці, а вірність Вождеві стає туманною. Можна відповісти політичними змінами або прямим придушенням.\n\nЩо б ми не обрали, діяти треба швидко, щоб зберегти стабільність."
 
 MAG_reform_the_blackshirts: "Реформувати чорносорочечників"
 MAG_reform_the_blackshirts_desc: "Чорносорочечників широко засуджують як насильників і державних громил, багато хто вимагає розпуску. Вождь не прийме такої радикальної міри, але може погодитися перетворити їх на щось інше. Вони численні, вміють застосовувати й стримувати насильство, мають пристойні вимоги до рекрутів і осередки по всій країні.\n\nВідповідь ясна: зробити з них поліцію. Змінивши керівництво й стандарти роботи, за кілька тижнів отримаємо законну й спроможну поліційну силу."
 
 MAG_expand_on_the_bill: "Розширити білль"
 MAG_expand_on_the_bill_desc: "Колись Пєтлін написав Сибірський білль про права, щоб здобути американську допомогу. Матковскій як лідер держави й партії приписав собі авторство та наполіг на численних поправках, аби не послабити владу Вождя.\n\nВождь багато зробив для країни, але краще дати Пєтліну політичними маневрами поліпшити білль і прибрати лазівки. Чого Матковскій не знає, те йому не зашкодить."
 
 MAG_the_long_arm_of_the_sia: "Довга рука ДРУ"
 MAG_the_long_arm_of_the_sia_desc: "Революціонери, радикали й сепаратисти розуміють лише силу. Політичні ігри й права тільки підбадьорять фанатиків. Віднині Державне розвідувальне управління матиме значно більше свободи проти незгодних.\n\nДРУ дістане карт-бланш переслідувати всіх, кого вважатимуть загрозою, будь-якими потрібними засобами. Дисиденти або навчаться жити в нашій країні й системі, або ДРУ навчить їх силоміць."
 
 MAG_the_letter_of_the_law: "Буква закону"
 MAG_the_letter_of_the_law_desc: "У межах реформ і модернізації виконавча канцелярія Вождя дістане право вето на всі закони та реформи партії. Це наблизить Національну Республіку до Німеччини, Японії та США.\n\nЇхні керівники - фюрер, імператор і президент - мають право відхиляти шкідливі рішення. Ми лише йдемо слідами більших і успішніших держав, запроваджуючи власне вето."
 
 MAG_subsidize_radio_free_magadan: "Субсидувати Радіо Вільний Маґадан"
 MAG_subsidize_radio_free_magadan_desc: "Кілька років тому Радіо Вільний Маґадан транслювало наживо передачі й новини для всієї країни. Коли настали тяжкі часи, уряд більше не міг утримувати службу: вона виснажувала бюджет і майже не приносила користи, бо мало хто мав радіо.\n\nТепер Маґадан заможніший, радіоприймачів і державних грошей більше. Варто відновити мовлення, цього разу під суворішим урядовим контролем."
 
 MAG_the_all_russian_council_of_corporations: "Всеросійська рада корпорацій"
 MAG_the_all_russian_council_of_corporations_desc: "Буде створено Всеросійську раду корпорацій. Вона радитиме урядові й оцінюватиме політику, спрямовуючи її на користь економіці. Членів обиратимуть коаліції компаній кожної галузі.\n\nВласних представників матимуть гірництво, виробництво, зв'язок та інші галузі. Сподіваємося, рада збільшить багатство країни й поверне Росію на шлях процвітання."
 
 MAG_the_enduring_will_of_the_people: "Незламна воля народу"
 MAG_the_enduring_will_of_the_people_desc: "Як спадкоємці Харбіна, ми витримали чимало: чвари, крах і війна не припинялися ціле десятиліття. Світ був особливо жорстокий до нашої малої держави.\n\nТа ми вистояли, зубами й кігтями рятували країну та людей, і не лише перемогли, а й принесли мир і стабільність усьому Далекому Сходу. Майбутнє Національної Республіки нарешті світле, можливо навіть світліше за західних сусідів. Наш час настав, і ми повернемо Росію під один прапор за будь-яку ціну."
 
 ### Matkovsky Regional Economy Tree ###
 MAG_form_the_recovery_commission: "Утворити комісію відновлення"
 MAG_form_the_recovery_commission_desc: "Останніми роками економіка розвивалася винятково добре завдяки забезпеченому сільському господарству й торговельним портам, але тяжкі бої залишили чимало руйнувань.\n\nДля відбудови створено Комісію відновлення. Вона наглядатиме за місцевими й загальнодержавними проєктами та координуватиме державні ресурси. Це має скоротити строки й ефективніше доправляти припаси тим, хто їх потребує."
 
 MAG_import_machinery: "Імпортувати устатковання"
 MAG_import_machinery_desc: "Російська промисловість у жалюгідному стані: більшість устатковання - десятилітні залишки совєцьких проєктів, що розвалюються після довгого використання. Старі неефективні машини роблять продукцію дорожчою й менш конкурентною.\n\nЩоб оживити виробництво та привабити покупців, треба підтягнути обладнання до світових стандартів. Ділові знайомі у США охоче нададуть першокласні машини - за належну ціну."
 
 MAG_the_laborers_due: "Належне робітникові"
 MAG_the_laborers_due_desc: "Фабрики працюють удень і вночі для жадібних капіталістів та корпоративістів. Громадяни щодня гнуться під величезним навантаженням, а після довгого дня й короткої ночі отримують жалюгідний мінімум - часом кілька центів за годину.\n\nТяжко працювати за мізерну платню, і нижчі класи гніваються. Необережність віддасть їх харизматичному популістові чи комуністові з обіцянкою спасіння. Щоб цього уникнути й стабілізувати країну, почнімо поліпшувати долю робітника з його платні."
 
 MAG_free_enterprise: "Вільне підприємництво"
 MAG_free_enterprise_desc: "У добу далекосхідних уламкових режимів торгівлю Маґадану суворо обмежили не задля захисту промисловости, а заради безпеки. Аґенти й заколотники легко переходили кордон під виглядом підприємців і торговців. Довідавшись про це, народ вимагав дій, і партія ухвалила суворі торговельні та прикордонні закони.\n\nТепер часи інші. Щоб випустити на волю всю силу капіталізму й вільного ринку, ці закони треба скасувати."
 
 MAG_lessons_from_the_solidarists: "Уроки солідаристів"
 MAG_lessons_from_the_solidarists_desc: "Економіка примхлива: сьогодні біржа росте, завтра падає, й причини важко збагнути. На щастя, національна безпека й оборона простіші.\n\nЗамість гратися торговельними законами та кордонами, уряд має розбудовувати військову промисловість проти західних сусідів. А з економікою хай розбираються корпоративні керівники."
 
 MAG_made_in_russia: "Зроблено в Росії"
 MAG_made_in_russia_desc: "Зусилля з пожвавлення економіки й виробництва дають плоди! Випуск товарів стабільно зростав два квартали, а підприємства принесли рекордні внутрішні та закордонні інвестиції.\n\nЗа прогнозами, темпи зростання наступного року можуть удвічі перевищити нинішні. Національна Республіка впевнено стає розвиненою індустріяльною державою."
 
 MAG_uplift_the_peasants: "Піднести селянство"
 MAG_uplift_the_peasants_desc: "Серед жертв розпаду Совєцького Союзу чи не найбільше постраждало селянство. Ворожі держави билися за їхні землі, а бомбардування, бої й рейди нищили господарства. За нашої влади цього більше не буде.\n\nСеляни дістануть субсидії на відбудову осель і засобів до життя, нове сільськогосподарське обладнання та методи. Сподіваємося, вони далеко перевершать попередні рекорди виробництва."
 
 MAG_establish_the_transbaikal_state_university: "Заснувати Забайкальський державний університет"
 MAG_establish_the_transbaikal_state_university_desc: "Забайкальський державний університет може стати одним із найбільших у країні. СССР почав будувати його під час шалених передкрахових проєктів; передбачалися школи гірництва, права, економіки, будівництва й екології та інші. Великі й відносно добре збережені корпуси легко укомплектувати та долучити до системи вищої освіти."
 
 MAG_research_and_development_facilities: "Науково-дослідні установи"
 MAG_research_and_development_facilities_desc: "Росія не раз переконувалася, наскільки важливо йти в ногу із сучасними технологіями - і військовими, без яких нас розіб'ють модерніші сусіди, і економічними.\n\nНові виробничі методи з'являються постійно. Щоб конкурувати на світових ринках, їх треба творити й переймати. Тому нові науково-дослідні установи - логічна ціль державних інвестицій."
 
 MAG_fund_the_corps_of_engineers: "Фінансувати інженерний корпус"
 MAG_fund_the_corps_of_engineers_desc: "За нинішніх темпів економічного зростання нам скоро бракуватиме інженерів і освічених будівельників. Для подолання нестачі створимо Російський інженерний корпус.\n\nЯк і американський відповідник, він будуватиме й допомагатиме інженерним проєктам по країні. Новобранці дістануть безкоштовні навчання й освіту в обмін на чотири роки служби."
 
 MAG_a_sibplan_of_our_own: "Власний Сибплян"
 MAG_a_sibplan_of_our_own_desc: "Бухарінський Сибірський плян був аґресивною останньою спробою індустріялізувати СССР далеко за фронтом для боротьби з Німеччиною. До усунення Бухаріна він досяг значного поступу й досі є основою сибірської економіки.\n\nНаслідуймо цей успіх. Через велетенські ресурси плян не був таємницею; директори й адміністратори колишнього Союзу його пам'ятають, а ми знайшли приховані документи та креслення. З них можна створити власний Сибірський плян - можливо, Далекосхідний."

 MAG_maintain_the_railway: "Утримувати залізницю"
 MAG_maintain_the_railway_desc: "Транссибірська маґістраль - одна з найважливіших частин інфраструктури й наш єдиний зв'язок із рештою Росії. Після років бомбардувань і боїв багато ділянок лежать у руїнах.\n\nНа щастя, жодна далекосхідна армія не була настільки дурною, щоб цілком знищити цю артерію. Треба підтримувати її для військових перевезень, торгівлі та всіх інших потреб."
 
 MAG_the_industrial_recovery_act: "Акт про промислове відновлення"
 MAG_the_industrial_recovery_act_desc: "Вільний ринок швидко індустріялізує й збагачує край, але інвестиції приходять лише за наявности інфраструктури. Акт про промислове відновлення вкладе мільйони долярів у ремонт старих і будівництво нових фабрик, заохочуючи чужоземні корпорації осісти в Сибірській Національній Республіці.\n\nЯкщо держава забезпечить матеріяли, сировину й транспорт, відкривати фабрики стане дешево й легко - і інвестори прийдуть."
 
 MAG_the_homestead_act: "Гомстед-акт"
 MAG_the_homestead_act_desc: "Великі землі малозаселені, хоча сучасні технології дозволяють більше землеробства й будівництва. Гомстед-акт заохотить людей залишити міста й осісти на вільній півночі. Держава безкоштовно даватиме землю, а хліборобам і поселенцям - надлишкові припаси, передусім будівельні матеріяли, зі значними знижками. Успіх освоїть непродуктивні землі й спричинить демографічний вибух."
 
 MAG_expand_mining_operations: "Розширити видобуток"
 MAG_expand_mining_operations_desc: "Далекий Схід надзвичайно багатий на корисні копалини - якщо їх уміти видобути. Компанії щороку дістають сотні тисяч тонн золота, нікелю, вугілля, заліза й хрому, а належні капітал і робоча сила збільшать це в кілька разів.\n\nДодаткові ресурси збагатять економіку й військову промисловість. Зброя потребує рідкісних цінних мінералів, а їхній імпорт загрожує безпеці; власний видобуток усуне ризик."
 
 MAG_from_the_ashes: "Із попелу"
 MAG_from_the_ashes_desc: "Національна Республіка постає з попелу, мов фенікс! Величезні вкладення капіталу, часу й енерґії посіяли насіння процвітання. Інвестиції у виробництво, освіту, технології й видобуток дали величезні прибутки, бо розвиток кожної галузі підсилює інші. Республіка стає економічною потугою - а незабаром стане й самою Росією."
 
 ### Matkovsky Regional Military Tree ###
 MAG_the_national_republican_armed_forces: "Національно-республіканські збройні сили"
 MAG_the_national_republican_armed_forces_desc: "Збройне крило колишньої РФП добре служило країні й ішло від перемоги до перемоги на Далекому Сході. Та для повернення Росії юрба озброєних громил і волоцюг уже не годиться. Охочих битися досить, але Сибірська Національна Республіка досі не має організованого офіційного війська.\n\nВиправмо це, поки не пізно. Молодій республіці буде створено сухопутні сили - Національно-республіканську армію. НРА має стати добре оснащеною професійною сучасною силою для будь-якого поля бою. Це вимагатиме зусиль, але армія, гідна служити Росії, варта будь-якої ціни."
 
 MAG_tactical_refinement: "Удосконалити тактику"
 MAG_tactical_refinement_desc: "Тактика сил Сибірської Національної Республіки майже не змінилася від доби РФП. Вона дала змогу підкорити Далекий Схід, але, можливо, час перейти до чогось розумнішого за біг на ворога з криками й безладною стріляниною.\n\nМинулі бої довели: теоретично це героїчно, практично - зайві жертви. Нове командування НРА пропонує звичайну тактику відділень, що зменшить утрати й водночас поліпшить дію частин у полі."
 
 MAG_new_training_methods: "Нові методи вишколу"
 MAG_new_training_methods_desc: "Наших солдатів можна милосердно назвати недисциплінованою бандою. Після мінімального вишколу їх кидають у поле без професійности; армія повна скажених псів, схильних до цілком зайвої шкоди цивільним і втечі за першої небезпеки.\n\nСуворий вишкіл перетворить беззаконний набрід на військо. Наш партнер США має одну з найкращих армій планети з неперевершеною дисципліною. Дорога до такої якости починається з перебудови методів перетворення юнаків на солдатів за американським взірцем."
 
 MAG_stock_the_armories: "Наповнити арсенали"
 MAG_stock_the_armories_desc: "Не менш за людей важить їхня зброя. Пляни НРА вимагають різко збільшити військо, а нинішнє виробництво жалюгідно не відповідає майбутньому попиту.\n\nДоведеться працювати з наявним. Молода збройова промисловість цілодобово наповнюватиме арсенали якісною сучасною зброєю. Будь-яке спрощення виробництва негайно впровадять на лініях. Кожен солдат мусить мати заряджену гвинтівку!"
 
 MAG_modernize_the_officer_corps: "Модернізувати офіцерський корпус"
 MAG_modernize_the_officer_corps_desc: "НРА досі не має належного офіцерського корпусу. Як республіканським військам іти в бій без умілих провідників? З нинішніми «офіцерами» важко працювати: більшість - уславлені ватажки банд із кліками відданих головорізів, що рояться довкола, мов підлесливі мухи.\n\nІз тих, кого не цілком поглинула корупція, зробимо професійних офіцерів і доповнимо здібними новобранцями. Талановите командування - основа професійної армії, без якої НРА лишиться різношерстою бандою розбійників."
 
 MAG_praise_the_valiant_soratniki: "Слава відважним соратнікам!"
 MAG_praise_the_valiant_soratniki_desc: "Коли майбутнє Росії здавалося втраченим, а колишній бастіон антибольшевизму роздирали чвари, Вождь і благородні соратнікі дивом переломили хід боротьби та об'єднали Далекий Схід. Війни були неймовірно жорстокі й нелюдські, та відважні хлопці вистояли й перемогли навіть без надії.\n\nЦе гідний історії промінь у темній добі! Та боротьба триває, й героям знадобиться вся допомога для нового об'єднання Росії. Вороги сильніші, ніж будь-коли, і треба вся наша міць, щоб поставити їх навколішки.\n\nВідважні люди Сходу, долучайтеся! Вступайте до Національно-республіканської армії - разом знову ввійдемо в легенду!"

 MAG_the_buryatia_military_complex: "Бурятський військовий комплекс"
 MAG_the_buryatia_military_complex_desc: "У Бурятії розташовані найрозвиненіші військові виробництва російського Далекого Сходу. Збройові центри дуже допоможуть, та їх розірвали большевицькі заколоти й пошкодило наше вторгнення. Для запуску потрібен серйозний ремонт.\n\nКрім відновлення, заплановано широке розширення. Бурятський військовий комплекс далеко перевершить совєцькі можливості й стане ядром військової промисловости Національної Республіки, невтомно даючи армії величезні обсяги майна."
 
 MAG_study_foreign_designs: "Вивчити чужоземні зразки"
 MAG_study_foreign_designs_desc: "Стан спорядження НРА відверто неприйнятний. Поздовжньо-ковзні гвинтівки й пістолети-кулемети були передовими пів століття тому, але нині безнадійно старі. Потрібно багато кращої, бажано стандартизованої сучасної зброї. Та які зразки обрати?\n\nЗавдяки зв'язкам зі США можна дослідити озброєння американського війська - від автоматичних штурмових гвинтівок під проміжний набій до переносних протитанкових систем. Ми надішлемо фахівців до США вивчати їхню зброю й пристосувати її для наших сил."
 
 MAG_projekt_zmey: "Проєкт «Змєй»"
 MAG_projekt_zmey_desc: "НРА майже не має механізованих сил. Навіть моторизоване спорядження рідкісне, більшість обходиться кіньми та саньми. Тим часом у світі механізація стала нормою й не підлягає торгу: нам потрібні БМП і танки.\n\nДослідний відділ почав химерно названий «Проєкт Змєй» для розроблення сучасних бойових машин. Найвищий пріоритет - бронетранспортери й основні бойові танки, основа кожного сучасного війська."
 
 MAG_reorganize_the_branches: "Реорганізувати роди військ"
 MAG_reorganize_the_branches_desc: "Організація НРА просувається добре, й вона швидко стає сучасною силою, яку ми уявляли кілька місяців тому. Та армія не може робити все сама. Для підтримки сухопутних військ украй потрібні окремі повітряні сили.\n\nГірше того, ми не маємо справжнього флоту для захисту важливого порту Маґадану. Наявні судна більше годяться для риболовлі, ніж морської війни. Перш ніж будувати флот відродженої Росії, треба створити окремий морський рід військ."
 
 MAG_the_national_republican_navy: "Національно-республіканський флот"
 MAG_the_national_republican_navy_desc: "Хоч Маґадан - найважливіший порт Росії під російським контролем, республіка не має справжнього флоту. Кілька придатних до служби кораблів неорганізовані й не готові до моря. Сьогодні це зміниться.\n\nНаціонально-республіканський флот охоронятиме російські води, а наявні кораблі буде зведено в належні з'єднання під командою здібних адміралів. Для розширення порт Маґадану треба збільшити далеко понад колишні можливості. Владивостока він не зрівняє, але може стати найкращою заміною."
 
 MAG_salvage_the_fleet: "Урятувати флот"
 MAG_salvage_the_fleet_desc: "Захопивши бази Камчатки, сили Вождя чекали знайти майже неушкоджені кораблі Червоного флоту. Натомість побачили переобладнаний брухт і ржаві корита, ледве придатні до плавання! Тепер у Пєтропавловску-Камчатскому стоїть безкорисний «флот», який лише муляє очі. Невже йому не знайдеться користи?\n\nТорговельному флоту потрібні судна, й частину можна відремонтувати та повернути в море. Цілком безнадійні корита продамо або розберемо на брухт: що одному сміття, іншому скарб."
 
 MAG_the_national_republican_air_force: "Національно-республіканські повітряні сили"
 MAG_the_national_republican_air_force_desc: "Лише дурень думає, що війни виграють тільки на землі! Без сильних повітряних сил нове військо небезпечно вразливе, тому створено Національно-республіканські повітряні сили - цілком сучасні й оснащені найкращими літаками світу.\n\nДо мрії ще далеко, але закласти основу - добрий початок. Дослідний відділ уже вивчає новітні чужоземні зразки для нашої авіяції, і результати обнадійливі. Час здобути небо для Росії!"
 
 MAG_expand_the_airfields: "Розширити летовища"
 MAG_expand_the_airfields_desc: "Повітряні сили ростуть, але не мають належних баз. Нові летовища вимагали б забагато зусиль, а навіщо будувати смугу в глушині, коли готові об'єкти вже є?\n\nКілька колишніх царистських і большевицьких баз пустують після завоювання. Ми відремонтуємо й розширимо їх, щоб умістити ще більше літаків. Вони стануть нервовими центрами НРПС і плацдармами для всіх західних операцій."
 
 MAG_open_the_chita_military_academy: "Відкрити Чітинську військову академію"
 MAG_open_the_chita_military_academy_desc: "Що б ми не думали про царистів, вони мали чудову офіцерську кліку. Багато цих гострих умів тепер служить у нас і пропонує академію для нового покоління офіцерів НРА. Командування прихильне, а будівлю в Чіті вже обрано для Чітинської військової академії.\n\nТам молодих рекрутів зроблять справжніми офіцерами, гідними вести війська до перемоги. Постійний випуск ґарантує солдатам найкраще командування. Для армії, що має об'єднати Росію, менше неприйнятне."
 
 MAG_with_a_song_to_victory: "З піснею до перемоги"
 MAG_with_a_song_to_victory_desc: "Погляньте на стійке братство! Ще недавно це був неорганізований набрід, негідний навіть звання бандитів. Створення НРА перевершило найсміливіші надії: цілком модернізоване професійне військо чекає наказу, а західні сусіди занервують від одного його вигляду.\n\nЧас перевірити теорію практикою. Армія готова, флот дивиться в море, повітряні сили готові нести пекло з небес. Ми нарешті можемо продовжити об'єднання Росії; мить удару на захід близька, й командири певні перемоги.\n\nГотуйтеся, відважні соратнікі республіканських сил: попереду найбільше випробування!"
 
 ### Matkovsky Regional Diplo Tree ###
 MAG_opportunities_abroad: "Можливості за кордоном"
 MAG_opportunities_abroad_desc: "Закріпившись на Далекому Сході, час шукати закордонні можливості та підтримку. Через дії колишніх південних суперників природний союзник Японія навіть не думатиме нам допомагати.\n\nТому поглянемо далі на схід, через Тихий океан, до США. Наймогутніша економіка світу напевно допоможе, якщо ми пообіцяємо розширити символічні реформи Вождя."
 
 MAG_connections_with_the_diaspora: "Зв'язки з діяспорою"
 MAG_connections_with_the_diaspora_desc: "Спираючись на спадщину підтримки Вонсяцкого й відсутність альтернатив, ми можемо переконати російську діяспору, що саме ми найкраще створимо сильну антикомуністичну Росію й поведемо народ у нову еру.\n\nТреба використати залишені Вонсяцкім зв'язки та щедрі пожертви, щоб емігранти в Америці й світі не лише давали гроші, а й поверталися з набутими знаннями та освітою."
 
 MAG_a_free_haven: "Вільний притулок"
 MAG_a_free_haven_desc: "«Повертайся, відважний росіянине! Повертайся до Національної Республіки й допоможи поширити нашу владу на захід задля себе та всіх росіян!»\n\nМіжнародна пропаґанда покаже нас і захисниками дорогих емігрантам традиційних цінностей, і вільним притулком росіян - справжньою вільною й національною «Національною Республікою». Так ми заспокоїмо американських лідерів, здобудемо допомогу й привабимо більше емігрантів до столиці працювати над об'єднанням."
 
 MAG_to_the_city_upon_a_hill: "До міста на пагорбі"
 MAG_to_the_city_upon_a_hill_desc: "Сьогодні [MAG.GetLeader] оголосив по радіо, що особисто вирушить до відомого «міста на пагорбі» - Вашинґтона - просити підтримки США та їхніх союзників в ОВН.\n\nВін прагне зустрітися з найвищими посадовцями, за нагоди з президентом, і попросити офіційної торговельної угоди між США та Національною Республікою. Вона принесе конче потрібні кошти й покаже світові, що Америка підтримує лише нас."
 
 MAG_the_american_siberian_trade_act: "Американо-сибірський торговельний акт"
 MAG_the_american_siberian_trade_act_desc: "Уряд оголосив усьому Далекому Сходу, що [MAG.GetLeader] успішно домовився про Американо-сибірський торговельний акт.\n\nПідписання стане державним святом із коротшим робочим днем. Це великий крок до американського визнання й величезна користь економіці. Зниження мит і офіційні американські маршрути через порт Маґадану негайно піднесуть експорт та прибутки, коли ринки США скуштують неоціненну сировину сибірської тундри."
 
 MAG_on_our_own_two_feet: "Стати на власні ноги"
 MAG_on_our_own_two_feet_desc: "[MAG.GetLeader] повернувся до Маґадану з похмурою звісткою: переговори з американцями провалилися. Спільної основи виявилося замало для Американо-сибірського торговельного акту.\n\nТа надія жива! Після повернення [MAG.GetLeader] виступить по радіо. Замість невдалої угоди Вождь оголосив плян потужного національного розвитку: оновлення інфраструктури, нові робочі місця й розширення чинних програм."
 
 MAG_new_horizons: "Нові обрії"
 MAG_new_horizons_desc: "Незалежно від успіху в США, одного торговельного партнера для нації замало. [MAG.GetLeader] наказав шукати партнерів по світу. Делегації Національної Республіки вирушать до Австралії, Нової Зеляндії, Канади й Мексики.\n\nНові обрії принесуть процвітання й міжнародну увагу, якщо не формальне визнання, та наразі убезпечать майбутнє Республіки."
 
 MAG_sponsor_the_russian_liberation_front: "Підтримати Російський визвольний фронт"
 MAG_sponsor_the_russian_liberation_front_desc: "Підтримавши божевільного короля бандитів і старих царистів, Японія зачинила перед нами багато дверей. Це навіть корисно: ми зрозуміли, що їй не потрібна сильна Росія, а лише визиск Сибіру.\n\nЯпонці також окупують російську Зовнішню Маньчжурію, яку ледве контролюють, і через нездарність дозволяють Російському визвольному фронтові діяти. Ми дамо партизанам гроші й матеріяли, щоб вони били японців і повертали наші землі від південного берега Амура до Владивостока."
 
 MAG_guns_of_the_patriots: "Зброя патріотів"
 MAG_guns_of_the_patriots_desc: "Національна Республіка не сама бореться проти гніту Токіо та його корпорацій. На півдні Російський визвольний фронт роками воює з японцями та маньчжурськими маріонетками за визволення наших земель.\n\nДеморалізована недбала Маньчжурська армія вразлива до постійних малих повстань, але ті давно страждають. [MAG.GetLeader] наказав таємно переправити до Маньчжурії стару непотрібну зброю й набої, щоб зупинити їхнє повільне падіння."
 
 MAG_the_world_beckons: "Світ кличе"
 MAG_the_world_beckons_desc: "Після обіцянок діяспорі, міжнародних торговельних угод і твердої антияпонської політики світ уперше за довгий час дивиться на Росію - і саме на нашу.\n\nНаціональна Республіка далеко відійшла від відчайдушного виживання: знищила старих суперників, рештки Совєцького Союзу та божевільних культістів із загадковим лідером. Утвердившись удома й за кордоном, ми чуємо поклик світу й не вагатимемося рушити вперед."

