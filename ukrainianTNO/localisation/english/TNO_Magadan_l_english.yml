 ### Matkovsky expansion tree events ###
 magexp.1.t: "Маріонетковий цар"
 magexp.1.desc: "«Страва вам до смаку, пане Романов?» - Матковскій відрізав шматок яловичини. Навпроти сидів нібито цар Міхаїл; ще кілька днів тому ці очі бачили спалахи рушниць, коли РФП штурмувала його «палац». Попри царські шати й дзеркальне срібло, він був лише маріонеткою старих білогвардійців. Матковскій скуштував майже просмажений стейк. Не добре й не жахливо.\n\nМіхаїл прожував, витер рота й підняв келих. «Це була, - випростався він, - прийнятна вечеря». Матковскій усміхнувся. Нехай легітимности бракувало, та в Міхаїла було те, чого не мали багато монархістів і фашистів: хребет. «Пане Матковскій, чи дозволите смиренному в'язневі поставити питання?»\n\n«Кажіть, що думаєте, ваша “величносте”».\n\n«Розумію, моє становище в Росії стало... непевним. Хоч воно ніколи й не було добрим». Він знехтував етикетом, відкинувся й зітхнув. «Що тепер зі мною буде?»\n\nМатковскій замислився. «Цар» міг стати небезпечним суперником, але монархісти в РФП стрімко втрачали вагу. Невдовзі ніхто не сприйматиме претензії Міхаїла серйозно, і вигнання далеко від Росії могло бути водночас розумним і порядним рішенням. Матковскій відкрив рота."
 magexp.1.a: "«Ви залишитеся тут»."
 magexp.1.b: "«Ви повернетеся додому»."
 
 magexp.2.t: "Спогади"
 magexp.2.desc: "Матковскій відкинувся в кріслі й затягнувся сигарою - розкішшю серед російського хаосу. Жар освітив кімнату помаранчевим, дим зігрів легені. День був чудовий. Праця Вождя не скінчиться ніколи, але яких висот він досяг: від підручного божевільного до голови нового Антибольшевицького фронту. Життя було абсурдне - і прекрасне.\n\nПеред ним не було алкоголю. Він сп'янів від іншої пристрасти: стіл укривали чорно-білі й кольорові альбоми - від старої РФП у Харбіні до першого походу в Сибір. Ось він поряд із Родзаєвскім і Сємьоновим, ось оглядає війська старого господаря. Тоді він був молодий і щиро вірив. На губах з'явилася сумна усмішка: якби люди не змінювалися. Він шукав на світлинах поворот долі, що міг зберегти братерство, та не знайшов.\n\nМатковскій знову затягнувся й поглянув на запилений грамофон у кутку. Тоді встав, і Вождь вийшов із кімнати."
 magexp.2.a: "Мить тиші серед хаосу."
 
 magexp.3.t: "Доля Дикого Мітча"
 magexp.3.desc: "Був день інспекції. У чорній хутряній шубі Матковскій дивився, як кораблі привозять американські припаси й зброю. Подих білів у повітрі, порт смердів розсолом, гнилою рибою та сіллю. Пєтлін і Павлов ходили причалами, темні постаті в блідому ранку.\n\nРаптом він згадав: тіла Вербелла не знайшли. Скільки людей не розсилав тундрою й лісами - марно. Матковскій зітхнув. Де б найманець не був, це не мало значення. Живий чи мертвий, він більше не заважав. Вождь ступив на причал.\n\n-----------------------------------------------------------------------------------------------------------------\n\nДесь у світі в тропічній кав'ярні над пляжем тихо грав рок. Лисуватий грубий чоловік читав газету, не торкаючись кави, й задовольнявся сигаретами. Нещодавня пригода в екзотичному краї була чудова - шкода, що скінчилася. Кляті фашисти: спершу не заплатили, потім вигнали. Невже чесних працедавців не лишилося?\n\nВін відклав газету й скуштував каву. Багно. Час шукати нові місця й обрії. Залишив гроші з чайовими та вийшов із сигаретою в зубах."
 magexp.3.a: "Куди він вирушить тепер?"
 
 magexp.4.t: "Далекосхідний театр"
 magexp.4.desc: "Передача 02. Аґент Мейсон, Маґадан.\n\nТема: огляд розвитку становища на Далекому Сході.\n\nЗміст:\n\nПісля минулого звіту вишкіл маґаданських сил Матковского йшов добре. Надлишкова американська зброя дала чудові наслідки, офіцерські школи принесли плоди. Без вагань назву Вождеву армію найсучаснішою на Далекому Сході, хоча їй ще є куди рости. Перспективи його «Хрестового походу» - термін він повторює без кінця - світлі.\n\nРФП Маґадану перемогла амурських однопартійців, одразу розірвала перемир'я з царистами Чіти й скинула тамтешнього царя. Одним ударом Матковскій силоміць об'єднав старий Антибольшевицький фронт. Якщо не постануть нові сили, за людьми й промисловістю він тепер найсильніший на сході.\n\nОднак треба додати застереження. Лишаються червоні та радикали РФП, а з півночі Сибіру надходять чутки про релігійного лідера, що збирає племена. Ймовірність перемоги РФП висока, але рекомендуємо пильніше стежити за краєм. Мейсон, кінець зв'язку."
 magexp.4.a: "Попереду ще багато справ."
 
 magexp.5.t: "Уроки минулого"
 magexp.5.desc: "Пєтлін вивчав тьмяну мапу з грубо накресленими кордонами далекосхідних «держав». Значних суперників лишилося двоє: червоні комуністи й відроджена чорно-коричнева РФП. Він поклав пальці на кордон смертельних ворогів і майже відчув жар десятиліть ненависти.\n\nЩось гупнуло - мабуть, помічник перечепився в темряві. Ніч за вікном була місячна, хоч хмари крали світло. За дні, тижні чи місяць настане нове протистояння. Якби існував інший шлях. У двері постукали.\n\n«Кави, пане?» - помічник ніс тацю з паркими чашками.\n\n«Поставте на стіл. Обережно з мапою». Чашка стала на півночі, та, піднімаючи тацю, помічник розлив каву. Він схопив хустинку, але Пєтлін спинив: шкоди вже не виправити.\n\nПомічник пішов, без кінця перепрошуючи. Пляма ширилася мапою, і Пєтлін згадав чутки про північного єретика, що збирає сили визволити Сибір від фашизму й комунізму. Може, це знак."
 magexp.5.a: "Можливо, знак від Господа?"
 
 magexp.6.t: "Перші звіти"
 magexp.6.desc: "Олєґ сперся на дерево й олівцем писав звіт для нового Державного розвідувального управління. Як Сибірського рейнджера, його закономірно відібрали на польову посаду в ДРУ. Треба було не натискати, щоб кора не прорвала тонкого сірого паперу. Записи прості: побачене, погода, географія та настрої місцевих.\n\nОстаннє турбувало найбільше - Олєґ ненавидів розмовляти з людьми й радше поповз би ворожими траншеями під кулеметами, ніж слухав селюка з незрозумілою говіркою. Та дещо записав, навіть поговорив із двома менш нестерпними селянами. Дані могли бути дріб'язковими, але завдання виконано блискуче. Він сховав аркуш і закурив, дозволивши собі відпочити.\n\nОкремі дані для ДРУ були марні, разом - могли вирішити битву. Після цигарки Олєґ надрукує звіт у відділі, зробить висновки й запропонує дії керівництву. Він волів би лишитися рейнджером, але й таке життя було непогане."
 magexp.6.a: "Так оберталися коліщата нових очей і вух Вождя."
 
 magexp.7.t: "Останній вартовий"
 magexp.7.desc: "Вантажівка їхала сибірською глушиною. У кузові сиділи четверо солдатів і п'ятий чоловік - із зав'язаними очима, у лахмітті. Ранок був ранній, сніг лежав грудами обабіч дороги до лісу. На вибоїнах охоронці підтримували полоненого.\n\nНа їхнє полегшення, він мовчав. Голос, що з радіохвиль кликав визволити російських робітників, зламався. Із заплющеними очима та зв'язаними руками він був безсилий; прибічники лежали в полях, спадщина розтане навесні.\n\nНа галявині, позначеній «місцем страти», його обережно висадили й повели невідомо куди. Довічний атеїст сказав, що ні про що не шкодує: йому не потрібен опіюм для народу, його біль належав лише йому.\n\nПов'язку зняли, сонце різонуло очі. Скільки минуло - днів, місяців, років? Він став навколішки й дивився в небо.\n\nЗачитали вирок, рушниці клацнули й націлилися в голову. «Наказом Вождя росіян, Валєрія Міхайловіча Сабліна засуджено...» Він був готовий. «До вигнання!» Саблін розгублено озирнувся. Йому дали револьвер, дві кулі, пальто й чорний хліб, а тоді поїхали.\n\nВін хотів сміятися й навіть хихикнув. Та невдовзі лишилися тільки самотні, виснажені ридання."
 magexp.7.a: "Жорстоке милосердя."
 
 magexp.8.t: "Вождь у радіоетері"
 magexp.8.desc: "Солдати сиділи в їдальні й чекали вечері - густого супу та чорного хліба, небагато, але досить для Сибіру. Зазвичай стояли в черзі, та сьогодні офіцер приніс радіо: Вождь звертався до Далекого Сходу. Чути було лише брязкіт тарілок і хлюпання ополоника. До їжі ніхто не торкався.\n\nКазармою прокотилася патріотична музика, а тоді загримів голос Міхаїла Матковского. «Добрий вечір, народе Росії! Завтра після півночі почнеться нова доба. Червоні, давні зрадники чеснот російського народу, розбиті. Їхні армії лежать у полях, ідеологи, партія, прєзідіюм і претензії на легітимність розвіяні за вітром». У лавах пролунали стримані вигуки, а тарілки далі брязкали між словами.\n\n«Мої вірні войовничі солдати, збройне крило Россійской Фашистской Партії, справжні герої пролетаріяту, пробили темряву, що так довго тримала Росію в клітці. Вони стануть аванґардом нової революції - не породженої потребами нелюдських ідеологій, а революції оновлення й могутньої Росії, що знову посяде місце серед націй!»\n\nОплески злилися в бурю й заглушили решту звуків; окремі вигуки стали громом. Ніч здійснилася."
 magexp.8.a: "Безперечно, жвавий вечір."
 
 magexp.9.t: "Життя Юди"
 magexp.9.desc: "Надвечір Захар завершував роботу в скрипторії при свічці. Дорогим папером Вождь підкреслив велич замовлення - історії християнства на Далекому Сході. Кожен штрих нагадував Захарові, як він потрапив на службу Матковского, - історію, відому лише йому та Богові. Він понесе її до могили. Кожен має свій хрест; його хрест - жити в ганьбі, а не померти з честю.\n\nПеро зупинилося на п'ятдесятих і шістдесятих. Можливо, нащадкам краще не знати злочинів, скоєних заради кращої доби. Окрім загального хаосу, помітних подій нібито не було. Треба знайти в архівах досить переконливу «правду», яку ніхто не поставить під сумнів. Захар відкрив хрещальний реєстр.\n\nВід перших сторінок ішли чорні смуги. Певний Отець - ім'я замазано - хрестив сотні людей у селі, чию назву теж стерто з пам'яти. Захар упізнав свою квапливу руку. Він не міг дозволити, щоб історія монастиря зникла. Колись ніхто не вірив, що проповідник повернеться від північних племен, та він повернувся - не з миром, а з мечем. Захар був його помічником у воєнній раді від початку до кінця.\n\nВін вийшов надвір, де теплі спогади обернулися темрявою. Сміх і сльози дзвеніли у вухах. Перед ним простягалися могили на багато миль, грубі безіменні хрести товаришів. Захар упав навколішки. Можливо, й сьогодні він не витримає свого хреста."
 magexp.9.a: "Ще за кілька срібняків."
 
 magexp.10.t: "Документи НКВД"
 magexp.10.desc: "Дмітрій дивився, як папери з кабінетів Яґоди складають у купи й притискають камінням від сибірського вітру. Сам Яґода загинув або зник; Вождеві було байдуже, хоч він волів би власноруч розстріляти його. Дмітрій потер куксу. Ночами фантомна рука досі хапала уявні речі й торкалася неіснуючих стін.\n\nІван був десь далеко. Мовчазний виродок не прийняв жодної подяки - ні сигарет, ні консервів, ні грошей. Протез лежав поруч у траві. Лікарі ампутували заражену руку в задушливому наметі, морфіну не вистачило, і ту ніч Дмітрій досі боявся згадувати.\n\nОхоронець РФП приніс каністру бензину, інші накрили купу листям і гілками. Папери облили, залишивши пальну доріжку. Сірник спалахнув, вогонь побіг до стосу й лагідно охопив архів.\n\nДмітрій байдуже дивився. Що сталося між Вождем росіян і Ґенеральним секретарем Совєцького Союзу, його не обходило. Жар торкався обличчя; він масажував куксу й спостерігав, як минуле розсипається попелом."
 magexp.10.a: "Майбутнє настало."
 
 magexp.11.t: "Маґаданська хартія"
 magexp.11.desc: "Пєтлін дивився, як Матковскій із кабінетом сідають за круглий стіл на верхньому поверсі будівлі РФП. Він сів праворуч від Вождя - простий посол, піднесений до найближчого помічника, бо був зв'язком між Америкою й партією. Люстра заливала кімнату незвичним нічним світлом.\n\nМатковскій беззвучно спитав: «Усі?» Пєтлін кивнув. Вождь підвівся: «Панове, маю сміливу пропозицію. Наш дорогий Ніколай Пєтлін пропонує радикальну зміну, здатну перетворити саму природу партії. Багато хто з нас служить Росії від заснування партії в Харбіні. Але часи змінилися. Партія мусить, даруйте банальність, іти в ногу з часом».\n\nВін повернувся на місце. «Пропоную відкинути зовнішні ознаки минулого й... вирватися з тіні Родзаєвского. Ми підпишемо Маґаданську хартію. Наш друг Пєтлін люб'язно написав нову конституцію. Усі її читали. Від сьогодні Россійской Фашистской Партії більше немає - відтепер це Русская Національная Трудовая Партія. Хто за - скажіть “так”».\n\nНіхто не заперечив."
 magexp.11.a: "«Так»."

 magexp.12.t: "Вигнання царя"
 magexp.12.desc: "У вогні Революції Бухарін розстріляв царську родину: вона була загрозою й символом старого ладу.\n\nЯкби події на Далекому Сході пішли інакше, Родзаєвскій теж розстріляв би царя - суперника, ворога нового порядку й особисту образу для звіра, що назвав себе Вождем.\n\nСправжній Вождь дивиться через стіл на царя після вечері. Рішення очевидне, а порядність може бути розсудливою. «Міхаїле Романов, ви залишите Росію. Гадаю, розумієте чому».\n\nТой повільно киває; недовіра змінюється полегшенням. «Розумію. Отже, вигнання». Останнє слово майже нечутне.\n\n«Вигнання. Ви покинете батьківщину й не повернетеся. Поїдете до... Австралії, так?»\n\nМіхаїл киває, барабанить пальцями, а тоді зустрічає погляд Матковского. «Дякую. Ви... не мусили».\n\n«Не мусив, - на обличчі Вождя тінь усмішки. - Але зробив».\n\nУ відносному спокої Маґадану, перед довгим шляхом до Москви, Вождь дозволяє собі милосердя. Цар невдовзі стане неважливим."
 magexp.12.a: "Новий Вождь уміє бути великодушним."

 magexp.13.t: "Домашній арешт"
 magexp.13.desc: "Світ на межі, батьківщина стоїть на історичному роздоріжжі, а двоголовий орел у такі часи має певну привабливість. Міхаїл Матковскій мить думає про порядний учинок - і відкидає його. На довгому шляху на захід вистачає претендентів на імперський престол.\n\nВін дивиться колишньому цареві Чіти в очі. «Біля Байкалу є будинок. Вас поселять там із належною охороною».\n\n«Домашній арешт», - приречено констатує Міхаїл. «Та все ж...»\n\n«Це милосердя», - закінчує Вождь. Звір Амура його б розстріляв, як і будь-який комуніст. «З вами добре поводитимуться».\n\n«Дякую». У слові є гіркота, але це природно. У погляді царя змішалися полегшення й приреченість: він не стане виставою, та свободи не матиме.\n\nСвітло здається різким. Розмова переходить до Сибіру, і холодна ввічливість Вождя висушує будь-який протест.\n\nМіхаїл Матковскій сидить з останнім уламком старого ладу й пам'ятає, що той досі здатен надихати. Орла замкнуть у клітці біля Байкалу. Цар залишиться в Росії, доки нова Росія Вождя не втратить віру в його спадщину."
 magexp.13.a: "Вождь милосердний, але не надміру."

 ### Regional events ###
 magreg.1.t: "Записуйся і ставай до строю"
 magreg.1.desc: "Юний Сєрґєй протер очі, прокинувшись від гучномовця за вікном. Вулицею їхала вантажівка, і з установленого на ній гучномовця гримів голос:\n\n«Соратнікі! Ваш Вождь кличе вас до вищої мети! Хай ви й не допомогли здолати фальшивих спадкоємців Харбіна, тепер маєте нагоду здобути куди більшу славу: возз'єднати нашу російську землю! Наші друзі в Америці надіслали вам найкращу зброю та спорядження, але тепер нам потрібні ви!»\n\nСєрґєй обмірковував почуте, спускаючись снідати. Батьки приготували просту кашу, і за їжею він знову почув ту саму вантажівку.\n\n«Наша перемога над зрадниками, підривниками й божевільними - перший крок до тріюмфу над гуном! З вашою допомогою ми зустрінемо Новий рік у Москві! З вашою допомогою відсвяткуємо Різдво в Києві! З вашою допомогою світ знову завмре перед величчю Росії! Вступайте до Національної республіканської армії сьогодні - і завтра наша Батьківщина буде єдиною!»\n\nСєрґєй знав, що батьки не схвалять його рішення, та після сніданку поспішив до міської ради шукати вербувальника. Цього року їм доведеться відсвяткувати його вісімнадцятиріччя без нього."
 magreg.1.a: "До зброї за Росію!"
 
 magreg.2.t: "Мрії наяву"
 magreg.2.desc: "Старі часи минули. Невдачі царистів, комуністів і, так, навіть фашизму. Принаймні його невдалої германофільської версії Родзаєвского. Міхаїл одним широким помахом червоного пензля замалював усі їхні лихі витівки. Далекий Схід був у безпеці, та цього не вистачало.\n\nІ ніколи не вистачить. Маґадан став убогою домівкою еміґрантам, що тікали сюди в надії на нове місце. Новий дім. Нову Росію. І тепер вони зробили крок до цієї мрії. Важко повірити, що все це вже майже в його руках...\n\nЗвісно, праці ще вдосталь. Треба зміцнити контроль, задовольнити американців і забезпечити майбутнє. Але мрія раз у раз поверталася: вільна Росія, не схожа на все попереднє. Нове місце, де все краще. Спокійніше. Де росіяни справді зможуть почуватися вдома - хоч би якою була ціна її створення.\n\nНова земля, сповнена надії. Мир через порядок, порядок через силу. Ось потрібне їм гасло. Сильне. Тверде. Безкомпромісне.\n\nІ скільки б він не поглядав на папери на столі, не міг позбутися думок, що танцювали в голові."
 magreg.2.a: "Майбутнє нікого не чекає. До роботи."
 
 magreg.3.t: "Вільне радіо?"
 magreg.3.desc: "Уряд нарешті погодився субсидувати Радіо Вільний Маґадан, але для радіостанції це рішення не обов'язково буде безплатним.\n\nЧимало трудовиків вимагають докорінної перебудови радіо й заміни ведучих, які - на подив усіх, крім, можливо, Сєрґєя - швидко полюбилися слухачам. Так вони хочуть забезпечити вірність радіо державі й перетворити його на корисний засіб поширення фашистської правди. Звісно, трудовики невисоко ставлять і Сєрґєя, і Васілія, а дехто шепоче, що почуття взаємне, тож обох, певно, доведеться... усунути, аби вони не мстилися саботажем за звільнення.\n\nРеформісти натомість хочуть зберегти популярних ведучих і свободу їхніх матеріялів, щоби радіо відповідало своїй назві; обов'язкові зміни мають стосуватися лише ефективности роботи.\n\nЛишається ухвалити остаточне рішення."
 magreg.3.a: "Без свободи немає вірности."
 magreg.3.b: "Без вірности немає свободи."
 
 magreg.4.t: "Нетипове засідання"
 magreg.4.desc: "Це мало бути звичайне засідання РНТП. Для Вождя в сьогоднішньому порядку денному не було нічого великого, але вигляд мав значення. Міхаїл увійшов, приймаючи привітання кількох трудовиків, погляди реформістів і - здебільшого - мовчання зали. Сьогодні було тихо. Маленьке диво: не доводилося терпіти партійні чвари. Ніколай Пєтлін вийшов до трибуни, а Міхаїл чекав першого питання.\n\n«Перший пункт порядку денного - арешт Міхаїла Матковского», - спокійно промовив Ніколай, і лише криця забриніла в його голосі.\n\nВождь завмер, а тоді кліпнув. Чи правильно він почув? Арешт? Його? На мить вирішив, що це жарт, сухий дотеп людини, яка прагнула його посади. Та ніхто не заперечив. Ніхто не засміявся й не підвищив голосу. Трудовики, яких він щойно вітав, зблідли, а в залі панувала мертва тиша.\n\n«За численні злочини проти Росії та російського народу...» - продовжував Ніколай, але Міхаїл уже не слухав. Як це сталося? Як могло статися? Неможливо. Неможливо. Та поки він стояв приголомшений, з шоком на обличчі, охоронці рушили. Не арештовувати Пєтліна й не застрелити його на місці.\n\n«Зрадник», - тихо прошепотів колишній Вождь, коли його стали хапати. «ЗРАДНИК! ТИ - ВИРОДОК! Ти й твої реформісти, ви всі виродки! Ви не можете...» Руки обвили його руки. Лють, страх і горе злилися в один крик.\n\nНіхто з його прибічників не дивився на нього, коли його волокли геть. Охоронці не зважали на благання. А Ніколай Пєтлін - його безхребетний міністр закордонних справ, підлеглий, наступник - увесь час дивився йому просто у вічі."
 magreg.4.a: "«...так зі мною. Ви не можете... так зі мною...»"
 
 magreg.5.t: "Подзвін"
 magreg.5.desc: "Пєтлін і образно, і буквально сидів на самому краєчку шкіряного крісла у своєму кабінеті. Він уже чув, як грюкали двері, як мотори ревли пекельними псами, що мчали тягти його на останній суд, як солдатські чоботи били землю дорогою до будинку. Він знав, що буде, - знав уже кілька тижнів. Зловісні погляди трудовиків, зникнення союзників і дедалі міцніша хватка Вождя провіщали розплату. Надія на свободу в Маґадані помирала. Та хоч скільки він готувався, мить однаково приголомшила його до глибини душі.\n\nУнизу двері безцеремонно зірвали з петель, і головорізи Матковского вдерлися до оселі. Пєтлін підвівся, чекаючи трьох озброєних чоловіків, що збігли сходами до кабінету. Він підняв руки на знак здачі, та передній солдат, готовий до бою, вдарив його в пояс і збив подих. Приголомшеного болем Пєтліна перевернули на спину, замкнули кайдани на зап'ястках і зачитали обвинувачення.\n\nДержавна зрада. Правдоподібне й очікуване обвинувачення. Та все одно боліло чути, що всі спроби поліпшити країну принесли йому тавро зрадника.\n\nЗрадника витягли на вулицю. Сусіди сиділи по домівках, аби не накликати гніву Вождя, і лише стежили крізь жалюзі, як Пєтліна кинули в кузов безіменної вантажівки. Вона помчала геть і більше сюди не повернеться. Крізь пекучий головний біль у Пєтліна пробилася одна думка."
 magreg.5.a: "«Боже, спаси нас усіх»."

 magreg.6.t: "Роздуми моряка"
 magreg.6.desc: "«Щуки» були старими човнами, колись збудованими підводними вбивцями, але мало які виконували первісну роль. Червоні в Петропавловску переобладнали багато з них для контрабанди: великі ділянки торпедних відсіків позбулися циліндричних боєголовок, а їхнє місце посіли вантажні трюми й додаткові кубрики. У руках Сибірської Національної Республіки процес завершили, знявши з корпусів останні рештки бойових можливостей.\n\nАбрамов оглядав із пів десятка суден, пришвартованих у порту Маґадану, поки синьо-сірі води Охотського моря хлюпали об борти. Він звірив маніфест: більшість човнів контрабандою ходитиме з Петропавловска чи Маґадану до Аляски, забезпечуючи Республіці сталий приплив доходів і твердої валюти. Старші судна законсервують як джерело запчастин, а одне стане навчальним кораблем для нового покоління підводників. Поглянувши на призахідне сонце, Абрамов повернувся до нового кабінету.\n\nНаливши кухоль кави, він згадав наради в Маньчжурії, повернення Далекого Сходу й розпад харбінської трійці. За Вєрховного Совєту Ягоди все було простіше: він примушував усіх триматися однієї лінії. Та суперечності зрештою стали надто глибокими. Абрамова дивувало, що він узагалі пережив ту безжальну політичну боротьбу й устиг приєднатися до Матковского.\n\nПомітивши порожній кухоль, Абрамов пішов долити кави. Спогадів на сьогодні досить - час працювати."
 magreg.6.a: "Правильний вибір, хотілося б думати."

 magreg.7.t: "Національна Республіка і світ"
 magreg.7.desc: "Підготовлено для: Дипломатичного корпусу Національної Республіки\n\nПередмова: Національна Республіка встановила беззаперечний контроль над Східним Сибіром і невдовзі пануватиме над усією національною територією. Повний звіт (див. додаток) докладно розглядає дипломатичні можливості, які Республіка може використати задля економічної чи іншої вигоди на шляху до цієї мети. Нижче подано регіональні висновки.\n\nАзія: головні перспективи - підтримка або фінансування антияпонських організацій у Маньчжурії та деінде. Втручання прояпонських сил дуже ймовірне.\n\nПівнічна Америка: головним напрямком, імовірно, стануть Сполучені Штати з опорою на попередні державні зв'язки. Можлива вигода значна. Другорядні цілі - Канада й Мексика.\n\nПівденна Америка: наразі перспективи обмежені.\n\nЄвропа: наразі перспективи обмежені через панівний німецький вплив.\n\nАфрика: наразі перспективи обмежені.\n\nОкеанія: Австралія й Нова Зеландія є дуже перспективними через спільні інтереси щодо японського впливу. Рекомендовано встановити контакти.\n\nБ. А. Карімов,\nстарший оперативник Державної розвідки"
 magreg.7.a: "Можливостей удосталь. Треба лише ними скористатися."
 
 magreg.8.t: "Батьківщина кличе"
 magreg.8.desc: "Дипломати Сибірської Національної Республіки кілька днів тому прибули до Вашинґтона й зустрілися з представниками різних відомств. Зазвичай посли держав, що змагаються за об'єднання Росії, просять дипломатичного визнання, торговельних угод або зброї - найчастіше всього одразу. Ці люди приїхали з іншою метою. Після об'єднання Східного Сибіру, кажуть вони, почався процес «стабілізації та відбудови Батьківщини». Посилаючись на нову стабільність і тривалу співпрацю зі Сполученими Штатами, вони просять дозволу працювати з російськими еміґрантськими організаціями в Америці. Вони хочуть переконати російських біженців та їхні родини повернутися до Сибіру й «загоїти рани, завдані російському народові нацистами».\n\nЗазвичай ми вагалися б, чи дозволяти представникам чужого уряду переконувати людей покинути США, але обставини незвичайні. Попри авторитарні нахили Сибірська Національна Республіка прагне зближення з ОВН і за правильної гри може стати надійним союзником у життєво важливому регіоні. СНР рішуче протистоїть нацизмові й комунізмові; хоча простіше було б домовитися з японцями, вона залицяється до нас, і нехтувати цим нерозумно. До того ж російська громада в США невелика, й навряд чи багато хто проміняє Каліфорнію чи Нью-Йорк на Сибір. А ті, хто поїде, найімовірніше, однаково повернулися б додому.\n\nПотенційні ризики відмови значно перевищують недоліки згоди, тож ми вирішили їх допустити. Бажаємо успіху. Він їм знадобиться, щоби переконати бодай когось проміняти найвеличнішу країну світу на арктичну тундру."
 magreg.8.a: "Хто захоче покинути край свободи?"

 magreg.9.t: "Відгук на заклик"
 magreg.9.desc: "«Але, тату, я не хочу до Росії!»\n\n«Пробач, Сашо. Знаю, що не хочеш, але обіцяю: тобі там сподобається».\n\n«Але всі мої друзі тут».\n\n«У Росії знайдеш багато нових друзів, сонечко».\n\n«Не хочу дружити зі смердючими російськими дітьми!»\n\nІґор онімів. Доньці було лише сім, і вона не розуміла ваги своїх слів, але саме вони остаточно визначили його рішення. Він росіянин. Його дружина росіянка. Донька народилася в Сакраменто й ніколи не виїжджала зі Сполучених Штатів, та для нього вона теж була росіянкою - а тепер називала росіян смердючими. Це сказали діти в школі? Знаючи їхніх батьків, Іґор не здивувався б. Вони були як усі в цій країні: дивилися на нього й Софію з особливо американською сумішшю жалю та зневаги. Йому набридло. Коли минулого місяця в Російському культурному центрі він почув про Сибірську програму репатріяції, здалося, що молитви про вихід нарешті почуті.\n\n«Чому ми мусимо покинути Америку?»\n\n«Бо Росія знову безпечна, сонечко, і тепер ми маємо допомогти їй знову стати сильною».\n\n«А мені подобається Америка. Мені начхати на Росію».\n\n«Знаю»."
 magreg.9.a: "«Але одного дня тобі буде не байдуже»."
 
 magreg.10.t: "Нарешті вдома"
 magreg.10.desc: "«Тату, ти тут виріс?»\n\n«Ні, Сашо, я виріс у Владивостоку. Це Маґадан».\n\n«У Владивостоку теж так холодно?»\n\n«Ні, сонечко, точно ні».\n\n«То чому ми не можемо поїхати туди?»\n\nІґор дивився з вікна аеропорту на крижані поля й засніжені будівлі. Надворі стояв лютий холод, а теплоізоляція аеропорту була далеко не досконала, та в животі він відчував тепло. Те саме, що й під час зустрічі з Софією після прибуття до Сан-Франциско в далекому 1947-му або коли вперше тримав Сашу на руках у сакраментській лікарні. Невимовна радість охоплювала його від усіх вивісок і написів російською та від того, що він досі міг читати рідною мовою. Навіть гомін інших людей в аеропорту несподівано тішив. Знайомі слова й склади повертали стільки спогадів про кращі часи, доки все не пішло шкереберть.\n\n«Тату?»\n\nСашине питання повернуло Іґора до дійсности. «Пробач, сонечко, що ти сказала?»\n\n«Чому ми не можемо поїхати до Владивостока?»\n\n«Ох». Він на мить завагався. «Його контролюють японці».\n\n«От лихо», - відповіла Саша. Іґор лише кивнув."
 magreg.10.a: "З поверненням, Іґоре. Ласкаво просимо додому, Сашо."

 magreg.11.t: "Повернення додому"
 magreg.11.desc: "Спершу їх майже не помічали: лише кілька наляканих, сповнених надії облич серед натовпу в сибірських портах та аеропортах. Щотижня прибувало ще кілька, вони подавали паспорти й документи митникам, а ті пропускали їх за прискореною процедурою. Спочатку це був струмочок, невдовзі - потік, а потім справжня повінь нових переселенців до Маґадану, Камчатки й Іркутска.\n\nДля більшости це нагода, на яку вони чекали десятиліттями: повернутися на батьківщину, відібрану багато років тому. Для інших - шанс почати заново й збудувати життя в новій країні, де минуле важить лише стільки, скільки вони самі дозволять. Декому випало нарешті побачити Батьківщину з родинних оповідей, яку вони ніколи не наважувалися відвідати. Тепер, коли правителів розбитих держав здолано, а на сході відновлено порядок, вони можуть побачити країну, яку так любили їхні родини.\n\nІмміґрантів щодня більшає, тож найнято нових митників і спрощено візові заяви, аби якомога менше затримувати прибуття та інтеграцію. По всьому світу діти Матері-Росії почули чудову звістку: нація відбудовується, і час усім росіянам виконати свій обов'язок. Щодня до наших берегів прибувають нові люди - відповісти на заклик, почати нове життя або повернути старе."
 magreg.11.a: "Росію не втрачено."
 
 magreg.12.t: "Подорож Вождя"
 magreg.12.desc: "«Ви майже закінчили приготування?» - прошипів Матковскій до двох метушливих помічників - насправді просто членів РНТП, яких за браком кращих справ залучили пакувати невеликий багаж і потрібні папери. Ті поспішно вибачилися й подвоїли зусилля, а Матковскій пирхнув і повернувся до столу, намагаючись завершити бодай частину роботи до від'їзду.\n\nВажко було уявити, що завтра він опиниться в Америці, самопроголошеній країні свободи й - куди важливіше для Матковского - можливому життєво важливому союзникові проти японських псів. З американською допомогою вони ще святкуватимуть у старому великому Владивостоку, і вже це варте спроби налагодити відносини з Вашинґтоном. Поки американці корисні, нехай нав'язують йому безглузді ідеали скільки завгодно, якщо їм від цього легше; зрештою це однаково нічого не змінить.\n\nКоли речі нарешті спакували, Матковскій зітхнув, відклав перо й пішов спати. Думки надто його відволікали, а перед зустріччю треба було відпочити. Якщо все піде добре, Росія матиме могутнього друга, здатного змінити для неї все."
 magreg.12.a: "Мрії Харбіна прямують до Вашинґтона."

 magreg.13.t: "Візит Вождя"
 magreg.13.desc: "У колах зовнішньої політики Вашинґтона гомонять про гостей США: делегацію Сибірської Національної Республіки, невеликої держави, що недавно підкорила найсхідніші землі Росії. Головна постать - так званий «Вождь» Міхаїл Матковскій, знаний серед фахівців із Росії хитрістю й наполегливістю. Та Матковскій суперечливий: критики звинувачують його у фактичній фашистській диктатурі, несумісній із обов'язком американської зовнішньої політики захищати демократію. Менш ідеалістичні діячі національної безпеки наголошують на його прагматизмі й антияпонських настроях: СНР може стати цінним союзником, на якого США зможуть добре вплинути.\n\nВізит Вождя, оголошений незадовго до від'їзду, триватиме кілька днів, а його вершиною стане зустріч із Президентом. Для Матковского та його людей, які довго боролися за життя на морозному Далекому Сході, розкіш Вашинґтона може бути здійсненою мрією. Для ліберальних політиків це знак, що відданість їхньої країни демократії крихкіша, ніж здається; кілька конґресменів-демократів і проґресистів уже висловили заперечення.\n\nЦілі Матковского досі неясні, але загальна думка така: він прагне тіснішої політичної та економічної співпраці зі США, можливо, разом із військовою допомогою. Дехто з американців готовий вислухати його, але лише якщо він справді відкритий до реформ, а не є черговим деспотом на уламках великої держави."
 magreg.13.a: "Пане Матковскій, здається, у нас угода."
 magreg.13.b: "Ми не ведемо перемовин із фашистами."

 magreg.14.t: "Від Маґадану до Національної алеї"
 magreg.14.desc: "У міру того як дрібні російські володіння поступаються справжнім державам, Росія відкривається світові. Однією з перших зупинок кожного правителя уламкової держави в закордонній подорожі стають США, і Ніколай Пєтлін із Сибірської Національної Республіки, за повідомленнями, саме здійснює перший державний візит до Вашинґтона. Його минуле вже здобуло прихильність американського політичного класу: Пєтлін прийшов до влади, поваливши авторитарного володаря регіону Міхаїла Матковского, й пообіцяв подальші демократичні реформи.\n\nНа малолюдному й біднішому за бажане Далекому Сході чужоземна підтримка життєво важлива. Вдома всі стежать за Пєтліном: тісніші зв'язки зі США значно підвищать шанси держави в боротьбі за Росію. Імовірна мета - дипломатичне й економічне зближення; військова допомога лишається далекою найвищою нагородою.\n\nШанси Пєтліна добрі. Крім кількох скептиків, які питають, наскільки далеко СНР відійшла від фашизму, більшість Конґресу відкрита до розширення відносин, а Президент не заперечує. Кілька днів у столиці можуть започаткувати взаємно вигідне партнерство - а поки Пєтлін, можливо, трохи відпочине в порівняно розкішному Вашинґтоні."
 magreg.14.a: "Добрі відносини з демократіями - це по-американськи."
 magreg.14.b: "Не варто марнувати час на дрібноту на кшталт Пєтліна."
 
 magreg.131.t: "Перевести подих"
 magreg.131.desc: "Сівши в номері вашинґтонського готелю, Міхаїл Матковскій відчув, як хвилею зникають болі, про які він навіть не знав. Удома таких диванів не було. Навіть Вождеві важко знайти зручні меблі. Телефон стояв на столику поруч, і він вирішив скористатися вигодами. «Обслуга номерів?» Коротка тиша.\n\n«Що вам потрібно, пане Матковскій?»\n\n«Принесіть рому». Він замислився. «Кубинського».\n\n«Зараз буде, пане». За кілька хвилин він уже відкинувся в кріслі й сьорбав напій, що ще недавно був мрією. Якби Родзаєвскій не помер, він залюбки побачив би його обличчя. Матковскій згадав день. Початок був кепський: на летовищі його зустріли протестувальники з антифашистськими гаслами. Пощастило їм, що це не сталося в нього вдома. Після обіду він зустрівся з Президентом, і перемовини виявилися дуже плідними: від співпраці проти японської агресії до майбутнього розширення економічних зв'язків. На питання про реформи Матковскій розпливчасто обіцяв демократизацію в далекому майбутньому, коли становище стабілізується. Президент - людина розумна й має розуміти делікатність справи. Принаймні Вождь на це сподівався.\n\nВечеря була розкішна, й Матковскому сподобалося грати достойника. Особливо вдало він виголосив тост за світ без тиранії та здобув гучні оплески. Загалом повернення СНР на світову сцену вдалося. Засинаючи, він зробив останню подумну нотатку: дізнатися, де замовити таке крісло до домашнього кабінету."
 magreg.131.a: "Плідний, але клопіткий день."

 magreg.141.t: "Перерва від хвилювань"
 magreg.141.desc: "Пєтлін знесилено відпочивав у кріслі після подій подорожі. Зітхнувши, він міркував, чи добре впорався. Мабуть, краще за Матковского, але це була низька планка й іще не означала успіху. Та, відкинувшись у розкішному кріслі й відчуваючи, як зникають тривоги, він подумав: сама змога насолоджуватися вигодами такого готелю - диво. У Сибіру нічого подібного не було. Американці й гадки не мали, як добре їм живеться.\n\nЇхній прийом зігрів Пєтліна. Російські еміґранти й американські прихильники демократії вітали його на летовищі, й він махав їм із дурнуватою усмішкою. Почувався солдатом, що повернувся з переможної війни. Згодом він зустрівся із самим Президентом, і несподівано продуктивні розмови охопили все - від протидії японським агресорам до розширення економічних зв'язків. На питання про реформи Пєтлін подав конкретний план поступової, але певної демократизації, заспокоївши американців. Зустріч з одним із наймогутніших людей світу лякала, та Президент виявився розсудливим, і тривога швидко вщухла.\n\nНаступна вечеря була найкращою за багато років, а оплески після тосту за світ без тиранії змусили Пєтліна відчути себе героєм. Він був майже певен: Сибірська Національна Республіка гідно вийшла на світову сцену. Засинаючи просто в кріслі, він мріяв про це нове, таке любе почуття героїзму."
 magreg.141.a: "Навіть миша мріє про хоробрість."
 
 magreg.15.t: "Угода вдалася!"
 magreg.15.desc: "Неймовірна звістка заспокоїла нерви наших дипломатів. Перемовини зі Сполученими Штатами завершилися гучним успіхом! Спершу американців відлякувало фашистське минуле СНР, та зрештою вони вирішили, що союзник у Сибіру важливіший за інші міркування. Недавня делегація до Вашинґтона істотно розвіяла їхні страхи, і Президент підписав угоду майже без спротиву уряду.\n\nУгода США і СНР передбачає широку політичну та економічну співпрацю, розширення торгівлі, пряму лінію між керівниками й інші положення для міцного партнерства на прийдешні роки. Серед ворогів ця нагода не могла з'явитися зарано. Після довгої ізоляції ми нарешті маємо рятівну нитку - і просто до наддержави! Сьогодні в Маґадані справді святкуватимуть, а дипломатів майже напевно чекають підвищення."
 magreg.15.a: "Чудова робота, усі молодці."

 magreg.16.t: "Американці відхилили нашу пропозицію"
 magreg.16.desc: "Зі Сполучених Штатів надійшла тяжка звістка: Президент цілковито відхилив недавню угоду, завдавши великого удару прагненням СНР здобути міжнародне визнання. Попри візит делегації до Вашинґтона американці вирішили, що тісніша співпраця їм не вигідна - чи то через походження СНР від Россійской Фашистской Партії, чи то через сумнівну цінність клієнта у віддаленому Сибіру.\n\nМайбутнє нашої зовнішньої політики стало набагато туманнішим. Можливо, американці передумають, коли СНР контролюватиме більшу частину Росії, але поки ми мусимо боротися за її майбутнє самі. Без великого покровителя наші міжнародні позиції значно ослабли, і наслідки можуть бути тяжкими. У Маґадані, де чимало надій пов'язували зі США, панує похмурий настрій, а багатьох дипломатів напевно вже розносять - або й карають гірше."
 magreg.16.a: "Невдача, але не нездоланна."
 
 magreg.17.t: "Американо-сибірський торговельний акт [GetYear] року"
 magreg.17.desc: "Спалах камери, потиск руки - і американці офіційно закріпили відносини з нашою республікою. Невдовзі їхні кораблі причалюватимуть у порту Маґадану з величезними багатствами для освоєння сибірських пусток. Американо-сибірський торговельний акт вимагає дати американцям доступ до ресурсів Сибіру в обмін на незмірні скарби, що їх привезуть цілі флоти. Ознайомившись з умовами, Вождь, кажуть, усміхнувся й зручно вмостився, знаючи, що забезпечив офіційну підтримку Америки.\n\nНевдовзі порт наповнять американські судна з тоннами пального, зброї, припасів і боєприпасів, даючи нам перевагу над східними ворогами. Час збирати їжу й красти в сусідів спорядження під покровом ночі минув; ми вимагаємо від Сибіру процвітання - і матимемо його! Американські друзі профінансують перетворення пусток і нетрів на республіку, гідну назви «Росія»."
 magreg.17.a: "За щедре партнерство!"

 magreg.18.t: "Американо-сибірський торговельний акт [GetYear] року"
 magreg.18.desc: "Зв'язки з молодою східною республікою привели нас до цієї миті: підписання Американо-сибірського торговельного акту скріпило союз двох націй і визнало рішучість російських друзів бути вільними. Цього історичного дня ми укладаємо угоду між волелюбними народами: знизимо тарифи й надамо східній республіці пільги для судноплавства в північній частині Тихого океану, а вона прийме наші гроші та інвестиції у видобуток цінних сибірських ресурсів.\n\nКонґресмени аплодують, американці схвалюють закон, а росіяни за портом Маґадану радіють, знаючи, що в боротьбі за свободу ми з ними серцем. У Сибіру бої тяжкі, а зими холодні, та з американською зброєю й пальним клопотів поменшає. Підпис і потиск руки законодавчо закріпили відносини США та СНР, і майбутнє наших націй веде шляхом свободи проти тиранії, де б вона не постала."
 magreg.18.a: "Початок щедрого партнерства."
 
 magreg.19.t: "Інші шляхи"
 magreg.19.desc: "Попередні перемовини з американцями провалилися, а разом із офіційною підтримкою зник шанс постати перед світом законною владою сибірських пусток. Треба відступити від мрій про міжнародну славу й шукати інших джерел багатства: збирати пограбовані ресурси сусідів чи приваблювати незаконне судноплавство до Маґадану - і невтомно будувати собі ім'я з нуля.\n\nУ Росії, збожеволілій від болю, ми знову мусимо підтримувати республіку контрабандними товарами й зброєю із західних та японських ринків. Вороги з усіх боків, а нездатність здобути американську підтримку проти роздроблености та сибірської глушини показує, наскільки ми самотні в боротьбі за перевагу.\n\nТвердо вирішивши виправити лиху долю, [MAG.GetLeader] звертається до інших місцевих і світових ринків, щоби спрямувати зброю й припаси до нашої держави. Аби витримати жорстокість східних пусток, порт Маґадану - рятівна нитка нашого режиму - не має лишитися без чужоземних товарів."
 magreg.19.a: "Сподіваймося, удача повернеться до нас."

 magreg.20.t: "Можливості в Сибіру"
 magreg.20.desc: "Сибірська Національна Республіка простягнула руку через Тихий океан і запропонувала дипломатичні місії Канаді, Мексиці, Австралії та Новій Зеландії. Посилаючись на суверенітет і свободу від тиранії, східна республіка просить відносин із державами, що протистоять деспотизмові й анархії, та кличе підтримати війну проти роздроблености в сибірських пустках.\n\nЗаклики також запрошують міжнародні судна торгувати в порту Маґадану, наповнюючи ринки чужоземними товарами й зброєю. З пожвавленою економікою та боєздатною армією СНР стане на ноги й боротиметься з хаосом за підтримки міжнародних союзників. Та поки росіяни в Маґадані моляться, щоби заклики не лишилися без відповіді й допомога прийшла раніше, ніж сибірська глушина знищить їхню владу."
 magreg.20.a: "Погодитися на торгівлю."
 magreg.20.b: "Зусилля того не варті."
 
 magreg.21.t: "Нові торговельні можливості"
 magreg.21.desc: "На стіл [MAG.GetLeader] поспішно поклали відповіді з-за Тихого океану: наш заклик про підтримку почули! Демократії вільного світу простягнули руки й погодилися встановити офіційні відносини з республікою; формальний обмін почнеться найближчими тижнями.\n\nДо крижаного порту Маґадану причалюють судна під прапорами чужоземних союзників, привозячи сотні тонн припасів молодій республіці. Потискаючи руки посланцям і міжнародним спостерігачам, ми безперечно заявили про себе всьому світові й знайшли друзів за великим океаном. Стабільність і певність іще далекі, та вільний світ уже бачить наші зусилля впорядкувати Сибір."
 magreg.21.a: "Справи починають налагоджуватися."

 magreg.22.t: "Без відповіді"
 magreg.22.desc: "Крижані сибірські вітри свистіли в тихому порту Маґадану. Металевий брязкіт буйків лунав затокою, змагаючись із гуркотом пінних тихоокеанських хвиль. Крім поодинокого контрабандного судна, що гойдалося біля холодного бетонного причалу, води були порожні - кораблів Вільного світу не видно.\n\n«Волелюбні» народи Заходу проігнорували наші заклики, тож покладатися доводиться лише на себе. Ми звертаємося всередину й виживаємо на обмежених припасах, зібраних у сибірській глушині. Щоби вистояти навіть у найлютіший східний холод, треба знайти власні ресурси для збереження молодої республіки, інакше ми знову скотимося в криваву роздробленість."
 magreg.22.a: "Доведеться якнайкраще використати те, що маємо."
 
 magreg.23.t: "Маньчжурський кандидат"
 magreg.23.desc: "Востаннє переконавшись, що за ним не стежать, Алєксандр зачинив двері самотнього сільського будинку. Глибоко вдихнув, обернувся й сів за стіл у центрі кімнати. Навпроти сидів представник так званої Сибірської Національної Республіки, обабіч - не надто приховано озброєні охоронці. «Отже», - тихо почав представник. Алєксандр його розумів: у боротьбі з японцями навіть стіни мають вуха. «Обговорімо нашу допомогу вам і вашим товаришам?» Алєксандр швидко кивнув. «Ми дамо зброю, припаси, кошти й підготовку - все, що ви просили. Натомість після визволення цих земель вони мають приєднатися до нашої республіки. Ви згодні?»\n\nАлєксандр ковтнув. Він не любив іркутське коло Ягоди, але не набагато більше довіряв сварливим харбінським вигнанцям. Та після нового об'єднання Далекого Сходу кращого часу для удару по японських діях у Маньчжурії годі чекати. Вибору в повстанців майже не було: без зовнішньої підтримки проти могутнього окупанта шансів обмаль.\n\nНехай так. «Домовилися, - нарешті сказав Алєксандр. - Ми об'єднаємо наш народ»."
 magreg.23.a: "Лишається лише доставити припаси."

 magreg.24.t: "У майбутнє й далі"
 magreg.24.desc: "Високопосадовці міністерства закордонних справ СНР зібралися за столом на особливу нараду. Вони перемовлялися, та замовкли, коли міністр прочистив горло. «Панове, - почав він, - останні місяці ви працювали відмінно, й насамперед я хочу привітати кожного».\n\nПосадовці мовчали, не бажаючи перебивати, але настрій поліпшав і на кількох обличчях з'явилися горді усмішки. Давши їм насолодитися похвалою, міністр продовжив.\n\n«Та роботи ще багато. Треба поглибити відносини з Вашинґтоном і ОВН загалом. Повернення Владивостока та інших південно-східних земель лишається пріоритетом уряду. Тож і найближчими місяцями чекаю від вас найкращої праці. Зрозуміло?» Посадовці дружно погодилися. «Добре. Усі вільні»."
 magreg.24.a: "Росія більше не самотня."
 
 magreg.25.t: "Друкар Дальстрою"
 magreg.25.desc: "Сєрґєй Дмітрієвіч Соловйов вилаявся, коли руки зісковзнули з лопати. Його долоні, звиклі до тонкої праці складача, зовсім не годилися до фізичної роботи. Проте він знав: саме це чекатиме на нього ще дуже довго.\n\nВін пам'ятав ту ніч у друкарні. Неминуче зрештою сталося: РФП викрила його маленький акт спротиву. Та, вочевидь, він був недостатньо важливим, аби його безслідно прибирати. Тож опинився тут.\n\nНа папері Дальстрой був програмою громадських робіт. Насправді ж, як він та інші тепер відчували на собі, це був лише спосіб ув'язнювати дисидентів та інших «небажаних», водночас виснажуючи їх каторжною працею. Він упізнавав тих, хто по-своєму повставав проти Партії. Тепер усі вони разом копали траншеї під залізничні шпали.\n\nКолись усе зміниться - він це знав. Мусить змінитися. Але зараз, зустрівши суворий погляд наглядача й не бажаючи повторити долю тих, хто працював надто повільно, він відкинув думки та знову взявся за лопату.\n\nРобота чекала."
 magreg.25.a: "Його здібностям знайшли доречніше застосування."

 magreg.26.t: "Фракційність підводить голову"
 magreg.26.desc: "Нещодавній партійний з'їзд породив досі нечуване в маґаданських коридорах влади явище - фракції. Символічні реформи Матковского розширили можливості висловлювати незгоду всередині РНТП, і чимало політиків вирішили скористатися ними, щоби змінити курс уряду.\n\nОсобиста фракція Матковского - так звані трудовики - лишається найбільшим блоком. Це строката суміш поміркованих фашистів, націонал-консерваторів і особистих прибічників Вождя; крило статус-кво, що виступає за дуже повільні, дозовані політичні реформи в межах однопартійної держави. Хоч опозиція стала помітнішою в державному апараті, на практиці трудовики тримають майже всю владу - саме як хоче Матковскій.\n\nРеформи часто лише посилюють жагу реформ, і Сибір не виняток. Виступаючи проти однопартійного правління, Ніколай Пєтлін створив реформістське крило з прихильників справді демократичного ладу. Зацікавлення Матковского політичними змінами має межі; його недовіра до Пєтліна відома всім, тож реформісти, хоч і галасливі, лишатимуться недопредставленою частиною партії.\n\nУ хвості плететься стара гвардія - майже рудиментарне крило фашистських твердолобів. Населення й політичний клас не прагнуть повернення до екстремізму Родзаєвского, тому радикали ізольовані й безсилі, а складаються переважно з маловідомих та безпорадних постатей. Подейкують, їх тримають лише як невигідне тло для «поміркованого» правління Матковского та цапів-відбувайлів за його найгірші рішення.\n\nНова доба знаменує небачений плюралізм - і небачений конфлікт - усередині партії. Лише час покаже, наскільки це рішення вплине на СНР."
 magreg.26.a: "Відкриваються нові розколи."
 
 magreg.27.t: "Великий Собор"
 magreg.27.desc: "У своєму маґаданському кабінеті Ніколай Пєтлін дозволив собі легку усмішку. Уперше за багато років він мав підстави сподіватися на краще майбутнє. Після місяців обережних маневрів йому вдалося переконати Матковского дозволити створення примітивного законодавчого органу. Великий Собор ледве заслуговував на свою назву, але це був початок.\n\nВождь досі мав у Маґадані найвищу владу й не збирався поступатися чимось більшим за символічний вплив на країну. Насправді домогтися від Матковского навіть тих крихт влади, які отримав Собор, було майже дивом. Та все ж народ Росії здобув перемогу, хай і малу.\n\nПєтлін бачив: Матковскій вважав питання закритим, а дозволені ним символічні реформи - кінцем дискусії. Він гадав, що тепер знову зможе дедалі міцніше стискати російський народ залізним кулаком, але Ніколай у серці знав: усе лише починається. Росіяни страждали надто довго й заслуговують на значно більше, ніж раду, що слухняно штампує укази Вождя Матковского. Це буде важко й дуже небезпечно, та він зробить усе, щоби постала Росія, якою її народ зможе пишатися."
 magreg.27.a: "Крок за кроком."
 
 magreg.28.t: "Волею Вождя"
 magreg.28.desc: "У внутрішньому повідомленні, надісланому сьогодні вранці високопосадовцям уряду, Вождь категорично відкинув пропозицію створити законодавчий орган, підтвердивши намір лишатися єдиною владою - виконавчою та будь-якою іншою - в Національній Республіці.\n\nСтворення національного парламенту, якого домагалося очолюване Ніколаєм Пєтліним так зване «реформістське» крило РНТП і який задумувався як відродження царського Зємского Собору, було однією з головних цілей цієї фракції. Наслідки відмови ще невідомі, але в партії чекають значного резонансу.\n\nРеформісти, як і слід було очікувати, розлючені, але занепокоєння виявили навіть члени власних «трудовиків» Вождя. Безумовно визнаючи абсолютну першість Вождя, вони вважають внутрішньопартійний розкол - особливо такий глибокий, як засвідчила реакція на це рішення, - небезпечною дестабілізувальною тенденцією.\n\nЧимало людей передбачають лише загострення боротьби фракцій за владу, тоді як інші, схоже, марно закликають до єдности перед численними зовнішніми й внутрішніми ворогами Республіки.\n\nДля широкого загалу РНТП досі видається монолітом, та стає очевидно: розбіжності всередині неї глибші, ніж будь-коли."
 magreg.28.a: "Одна нація. Один правитель."

 magreg.29.t: "Що означає бути вільним"
 magreg.29.desc: "«Знову вітаємо на Радіо Вільний Маґадан!» - вигукнув Сєрґєй із захопленою усмішкою. «Певен, любі слухачі, ви дивуєтеся, чого я такий щасливий!» Зітхання. «Наша авдиторія тебе не бачить, Сєрґєю», - пролунав оксамитовий баритон Васілія. «Кажи вже».\n\n«Так, звісно!» - погодився Сєрґєй, радіючи, мов дитина на Різдво. «Я щасливий, слухачі, бо СНР нарешті погодилася нас фінансувати, а наші програми лишаються такими ж вільними. Радіо Вільний Маґадан тепер не лише вільніше, а й багатше!» Сєрґєй радісно зареготав, досі ледь вірячи в це. На обличчі Васілія з'явилася рідкісна усмішка: важко було його винуватити. Вони справді далеко зайшли.\n\n«Тож подякуймо щедрим спонсорам і почнімо передачу з розмови про них. Сєрґєю?» Васілій жестом передав слово співведучому. «Так! Нещодавно я чув, що в Америці людям ґарантовано право на зібрання. Право на зібрання! Можеш повірити, Васілію?» Не чекаючи відповіді, він продовжив: «От думаю, чому нам тут цього не дозволяють. Це могло б дуже допомогти. Погляньте лише, які могутні американці!»\n\nВасілій на мить замислився й повільно кивнув. «Знаєш, Сєрґєю, цього разу ти, мабуть, маєш рацію»."
 magreg.29.a: "Фашизм - минуща мода, радіо - вічне."

 magreg.30.t: "Вільне лише за назвою"
 magreg.30.desc: "Підлітка Ґаліна Алєксандровна, що жила доволі затишним, але звичайним життям у Маґадані, схвильовано підбігла до родинного обіднього столу. Посеред нього стояло радіо, а батьки вже сиділи поруч. Настав час нової передачі Радіо Вільний Маґадан, і останнім часом родина Ґаліни після довгого дня слухала кожен випуск разом. Не те щоб у місті було багато інших сімейних розваг. «Ну, чого ми чекаємо? Вмикай, вмикай!» Батько засміявся з її нетерплячки й послухався.\n\nТа голос був незнайомий і холодний, як сибірська погода. «Добридень усім слухачам. Як ви, певно, вже здогадалися, колишніх ведучих...» Ґаліна чула в голосі чоловіка зневагу. «...більше немає. Їх забрали за підривну діяльність, тому відтепер Радіо Вільний Маґадан безпосередньо керуватиме Россійская Фашистская Партія».\n\nНаче на підтвердження, на задньому плані пролунали два постріли. Після короткої паузи новий ведучий удав, що нічого не сталося, та Ґаліні й без пояснень було зрозуміло, кого вбили. «Новини будуть за мить, а спершу приєднуйтеся до присяги нашому праведному Вождю Матковскому. О Матковскій, Вождю всіх росіян, принеси славу...» Ґаліна не витримала й вимкнула радіо. Батьки стривожено поглянули на неї, але не стали вмикати знову: потреби не було. Неважко здогадатися, з чого відтепер складатиметься кожна передача. Вони були приголомшені так само, як донька. Та вони були звичайними людьми - не могутнішими за мураху під чоботом. Схоже, звичайних людей і надалі чекало те саме, що й у минулому: вічно бути розчавленими чобітьми тиранів."
 magreg.30.a: "Вождь убив зірку радіо."
 
 magreg.31.t: "Короткий проблиск світла"
 magreg.31.desc: "Ніколай Пєтлін уже вп'яте водив виделкою по тарілці, відколи доїв останній шматок м'яса. Заглиблений у думки, він розмазував рештки соусу й жиру. З кожним днем отрута фашизму дедалі глибше проникала в Маґадан, простягала щупальця країною й стискала її. Він відчував гнів, але водночас і надію, змішану з відчаєм. Його обов'язком було очистити Харбін і всю Росію від того, що колись було запобіжним заходом, а тепер стало мерзенною карою. Коли він уже збирався знову шкребнути тарілку, через стіл озвалася дружина.\n\n«Усе вдасться. Я в тебе вірю», - сказала Лідія, добре знаючи, що гризе чоловіка. Це переслідувало і її: кожен закуток Маґадану смердів РФП, а отже, й її покійним колишнім чоловіком Родзаєвскім.\n\n«Чи вдасться? Роботи так багато, Лідіє. Матковскій править як м'ясник, і щодня свобода віддаляється, а фашизм міцнішає», - відповів Ніколай.\n\n«Хтось мусить це зробити, Ніколаю. На щастя, це ти, але ти не сам. Я знаю таких людей - чорт забирай, я була заміжня за одним із них. Вони сильні лише на вигляд. Матковскій править страхом і жорстокістю. Сила свободи завжди повалить такого паперового тигра».\n\n«Дякую», - кивнув Ніколай. Тягар не зник, але слова трохи заспокоїли. Та найбільше він просто хотів урвати цю розмову. Тож, зберігаючи незворушність, поставив тарілку в мийку й пішов до кабінету, а в голові й далі вирувало те саме відьомське вариво почуттів."
 magreg.31.a: "Та навіть крапля надії багато важить."

 magreg.32.t: "Новий початок"
 magreg.32.desc: "Останні кілька днів для Ніколая Пєтліна були вихором розгублености й небезпеки. Тиран Матковскій сидів у кайданах: у мить слабкости його заарештував чоловік, якого він вважав радше комахою, ніж людиною. Прибічники Пєтліна тримали колишнього Вождя в надійній маґаданській камері під пильною охороною. Від неймовірного щастя, потрібного для успіху перевороту, хотілося сміятися.\n\nСпільники ризикнули всім, аби повалити Тирана. Якби Матковскій, за іронією долі, був хоч трохи схожий на ненависного суперника Родзаєвского, він, напевно, придушив би повстання Пєтліна ще до початку. На щастя, пиха засліпила його перед загрозою під самим носом. Але тепер, поки Пєтлін дивився на місто, назрівала схожа біда.\n\nУ новому кабінеті Пєтлін опинився в дуже хиткому становищі. Матковскій був за ґратами, та армія й ДРУ досі широко підтримували маґаданського Тирана. Не дати його прибічникам повернути контроль над урядом буде небезпечно, але необхідно. Заради процвітання росіян тиранія Матковского має опинитися на смітнику історії."
 magreg.32.a: "Нарешті можна почати велику справу."

 magreg.33.t: "Засвоєний урок"
 magreg.33.desc: "Матковскій сидів у кабінеті й читав документи зі списком усіх членів реформістського крила РНТП. Задзвонив телефон, назвали ще одне ім'я - і він викреслив його. Ще одного усунуто. Лишилося двадцять.\n\nВін проклинав себе за те, що недооцінив Пєтліна. Цей зрадник ледь не повалив Вождя! На щастя, дурневі забракло підтримки для безглуздого перевороту. Та Матковского спустошувало усвідомлення, що людина, якій він довіряв і яку вважав майже другом, зайшла так далеко, аби його скинути. Скільки ще Пєтліних чекають у темряві нагоди захопити владу? Чи інші радники теж замишляють його повалення? Матковскій здригнувся. Ще ніколи він не почувався таким слабким і підкопаним. Треба бути обережнішим. Знайти заміну всім очищеним буде важко.\n\nТа цей урок він запам'ятає. Більше ніколи не поступиться владою. Нікому не можна довіряти. І понад усе - він ніколи більше не підпише реформ, що послаблять його керівництво! Лише він, Вождь, приведе Росію до величі. Лише він переможе у хрестовому поході проти зрадників і німців!"
 magreg.33.a: "Хай живе Вождь!"

 magreg.34.t: "Політ до свободи"
 magreg.34.desc: "Пєтлін із легкою усмішкою спостерігав із вікна кабінету за буденним життям маґаданців. Тепер вони були значно щасливішими й повніше жили, особливо порівняно з темними днями після розриву із силами Родзаєвского. Та ті часи давно минули, й Пєтлін волів думати про радісніші теперішні події - наприклад, про близький візит до Вашинґтона.\n\nВажко було повірити, що це справді станеться: він не сподівався, що зможе. Лишалося доробити все можливе, поки найняті помічники пакували валізи й готували документи до завтрашнього від'їзду. Пєтлін міг лише мріяти про красу Вашинґтона - великого міста демократії. Скоро він побачить її на власні очі. А потім повернеться до праці, аби всі росіяни могли насолоджуватися тією ж розкішшю у власній країні. Та наразі він відійшов від вікна, сів за стіл і знову взявся до справ. Мрії почекають, коли можна працювати задля їх здійснення."
 magreg.34.a: "Мрії про демократію."

 magreg.35.t: "Медалі безчестя"
 magreg.35.desc: "Юрій Вітвіцкій сидів на пагорбі над жвавим портом Маґадану й думав, як сильно змінилося його життя. І про рішення, ухвалене сьогодні вранці.\n\nНа схилі літ він вирішив боротися за Росію, за мрію про те, що Батьківщина колись знову стане єдиною. Але так було не завжди. Раніше він служив зовсім іншому господареві - тому, кому тепер протистояв у всьому.\n\nЯпонська імперія колись багато обіцяла, а йому бракувало досвіду, знань і, як він тепер розумів, бажання побачити підступний намір у кожному її кроці. Знадобилося багато часу, щоби не лише зрозуміти, а й прийняти це: як його ошукали, як він насправді сам не хотів бачити.\n\nВін дістав із піджака маленький футляр і відкрив. Медалі - «нагороди» за довгу й сумлінну службу імперії, яка ніколи по-справжньому його не поважала. Він був знаряддям. Але більше не буде.\n\nВостаннє переконавшись у рішенні, Юрій щосили жбурнув футляр. Той перевертався в повітрі, упав у воду й зник під поверхнею. За тим місцем до причалу рухалося велике вантажне судно, без сумніву з матеріалами для возз'єднання держави. Для Юрія цей контраст був промовистим.\n\nУ нього з'явився новий господар. Той, у кого можна вірити. Той, хто покаже старому господареві всю дурість його задумів."
 magreg.35.a: "Час заслужити нові медалі."

 magreg.36.t: "Захищати та служити"
 magreg.36.desc: "Трофім і в найсміливіших мріях не уявляв себе в поліцейській формі.\n\nДавній член РФП, він багато років тікав від поліції різних держав або уникав арешту. Тому, почувши, що чорносорочечників перетворюють на поліцію, спершу подумав, що це жарт. Та швидко збагнув: коли Вождь проголошує зміни, жартів немає.\n\nСпочатку зміна йому не подобалася, хоча він не смів цього казати. У чорносорочечниках він звик робити потрібне, не переймаючись законами. Тепер усе було інакше. І все ж правила дратували його менше, ніж раніше, бо дали те, чого він завжди хотів: визнання.\n\nКоли люди тепер зустрічали його на вулиці - звісно, після початкової недовіри, - то вже не дивилися з постійною підозрою та страхом. Після того як він допоміг упіймати кількох дрібних злочинців, дехто навіть почав вітатися. Йому подобалося це відчуття. Подобалося знати, що певною мірою він допомагає людям, водночас ведучи країну до її природної долі.\n\nЙому це подобалося. І він дякував Вождю за нагоду."
 magreg.36.a: "Несподівана зміна серця."

 magreg.37.t: "Куди вітер віє"
 magreg.37.desc: "Колишній капітан Тихоокеанського флоту Дмітрій Кірлєнко був старим. Юнаком він вступив до совєцького флоту й із невичерпним запалом підіймався по службі. Отримавши звання капітана, він очолив крейсер класу «Риков» «Калінін». Він полюбив цей корабель: то було його перше й останнє командування.\n\nПісля завершення Великої Вітчизняної війни й утечі Президії до Іркутска він гідно бився проти Імператорського флоту Японії в його останньому наступі. Коли адмірал Юмашев повів флот на Камчатку, Дмітрій особисто забезпечив єдність своєї оперативної групи. Падіння флоту перед Отцем і Маґаданом стало останньою краплею для багатьох моряків. Ті, хто не знайшов роботи в нового регіонального гегемона, тинялися без діла й топили горе в горілці.\n\nДивлячись на торгові судна в порту Маґадану, Дмітрій обмірковував своє становище. Нові правителі Далекого Сходу викликали огиду. Заради «Калініна» та його побратимів він робив те, про що шкодував, але навіть він не міг поблажливо ставитися до членів РФП. Вдивляючись у горизонт, він знову думав про втечу: сісти на торгове судно до Америки або податися на захід, углиб колишнього Союзу.\n\nЧи схвалив би старий друг адмірал Юмашев СНР та її засади? Чи дорікнув би йому за втечу з Батьківщини до кращих берегів? Чи підтримав би рішення лишитися? Насправді це не мало значення: зрештою вирішувати мав він сам. Дмітрій востаннє оглянув води рідної землі, вдихнув солоне повітря й послухав докерів. Зі слізьми в куточках очей він пішов до кінця причалу. Там стояло судно, що брало пасажирів до Сполучених Штатів."
 magreg.37.a: "Остання подорож старого моряка."

 magreg.38.t: "Нове життя"
 magreg.38.desc: "За столом у Сан-Франциско підняли келих, і нерозбірливі російські голоси стихли. «Пропоную тост, - оголосив чоловік. - За Америку, визволення Росії, а найбільше - за загибель німців!» Келихи задзвеніли під вигуки, й вечеря спалахнула новою енергією. Матковскій подумав, що його нове життя тут, можливо, не таке вже й погане. Щоправда, світ став би кращим, якби Вербелл якнайшвидше вдавився власною слиною й потрапив до пекла. Та він майже почав насолоджуватися життям у великому американському місті Сан-Франциско. Воно нагадувало Харбін і пробуджувало ностальгію за простішими днями, майже заглушаючи гіркоту примусового вигнання. Майже.\n\nМісцеві еміґранти виявилися приємними й допомогли облаштуватися. За роки після тричі проклятого перевороту Вербелла він став для них своєрідним провідником, влаштовуючи популярні вечірки й свята. На жаль, фашизм майже нікого не приваблював, тож надії відвоювати Маґадан і належно віддячити Вербеллу за зраду швидко розвіялися.\n\nУтім, Америка була непоганою країною, а повага еміґрантів давала хоч подобу колишньої влади. Тому він намагався не думати про розбиті надії й минулі пригоди. Можливо, міркував Матковскій, варто написати книжку й сподіватися, що наступне чи подальше покоління нарешті збагне фашистський ідеал."
 magreg.38.a: "Старий фашист таки знайшов щастя. Певною мірою."

