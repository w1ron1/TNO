# Economic Development
  # WerBell
    MAG_DECCAT_economic_development_werbell: "Власна база"
    MAG_DECCAT_economic_development_werbell_desc: "\n\n\n\n\n\n\nНовий режим, та сама професія, ті самі кляті труднощі з тим, щоб поставити цю країну на ноги. Одним із найбільших трофеїв перевороту Вербелла став §Mпорт Маґадана§!. Відібраний у нездарних ополченців РФП, тепер він є нашим вікном у зовнішній світ і допоможе перетворити молоду республіку на економічну потугу. Зрештою, хто краще за найманця розуміє важливість стабільного прибутку?\n\nТа через незвичну природу нашої держави найманців шлях до цієї мети буде нелегким. Утім, §fМітчелл Лівінґстон Вербелл§! не дурень і розуміє: фінансові проблеми держави найманців звичайними засобами не розв'язати. Належно розбудувавши порт, ми перетворимо його на справжню оперативну базу. Коли наша §nМаґаданська база§! запрацює на повну, вона стане не лише торговельним осередком для потрібних нам і продаваних нами товарів, а й головним у світі пунктом призначення для найманців - і для тих, кому потрібні послуги таких людей, як ми."
    MAG_econ_werbell_staff_recruitment: "Набір персоналу"
    MAG_econ_werbell_staff_recruitment_desc: "§FЩотижневі людські ресурси: [?MAG_econ_staff_recruitment_weekly_manpower|+=0]\n--------------§!\nОскільки ми - наймані сили, значну частину поповнення дає вербування солдатів удачі, а не загальний призов місцевих. Ці загартовані чоловіки й жінки з усього світу належать до найкращих бійців, і щомісяця до наших лав прибуватиме їх сталий потік."
    MAG_econ_werbell_base_combat_unit: "Бойовий підрозділ"
    MAG_econ_werbell_base_combat_unit_desc: "§FЩотижневі людські ресурси: [?MAG_econ_werbell_combat_unit_weekly_manpower|+=0]\nІнші доходи: [?MAG_econ_werbell_combat_unit_misc_income|+]\n--------------§!\nБП - наше головне джерело прибутку. Звідси керують усіма міжнародними операціями наших найманців. Їх виконання забезпечить нам надійний приплив коштів ціною періодичних небойових втрат."
    MAG_econ_werbell_base_development_unit: "Підрозділ розвитку бази"
    MAG_econ_werbell_base_development_unit_desc: "§FЕфективність видобутку ресурсів: [?MAG_econ_werbell_base_development_unit_resource_gain_eff|+=%]\nШвидкість будівництва: [?MAG_econ_werbell_base_development_unit_production_speed_buildings_factor|+=%]\n--------------§!\nБП - наше головне джерело прибутку. Звідси керують усіма міжнародними операціями наших найманців. Їх виконання забезпечить нам надійний приплив коштів ціною періодичних небойових втрат."
    MAG_econ_werbell_intel_unit: "Розвідувальний підрозділ"
    MAG_econ_werbell_intel_unit_desc: "§FМаксимум командного ресурсу: [?MAG_econ_werbell_intel_unit_max_command_power|+=0]\nАрмійська розвідка: [?MAG_econ_werbell_intel_unit_army_intel_factor|%=0+]\nФлотська розвідка: [?MAG_econ_werbell_intel_unit_navy_intel_factor|%=0+]\nІнші доходи: [?MAG_econ_werbell_combat_unit_misc_income|+]\n--------------§!\nРП дасть нам змогу берегти власні таємниці, розкривати чужі й водночас трохи підзаробити на чорному ринку."
    MAG_econ_werbell_support_unit: "Підрозділ забезпечення"
    MAG_econ_werbell_support_unit_desc: "§FОрганізація дивізії: [?MAG_econ_werbell_support_unit_div_org|+=%]\nСпоживання припасів: [?MAG_econ_werbell_support_unit_supply_consumption_factor|+=%]\n--------------§!\nПЗ допоможе підтримувати наші операції вдома й забезпечувати польову логістику."
    MAG_econ_werbell_rd_unit: "Науково-дослідний підрозділ"
    MAG_econ_werbell_rd_unit_desc: "§FШвидкість досліджень: [?MAG_econ_werbell_rd_unit_research_speed|+=%]\n--------------§!\nНауково-дослідний підрозділ дає змогу спрямувати інженерів і вчених на створення досконалішої зброї. Зрештою, лише лишаючись на передньому краї, ми можемо виправдати свої ціни."
    MAG_econ_werbell_medical_unit: "Медичний підрозділ"
    MAG_econ_werbell_medical_unit_desc: "§FЩомісячна зміна політики охорони здоров'я: [?MAG_econ_werbell_medical_unit_healthcare_eff_chg|+=]\n--------------§!\nМП дасть нам змогу лікувати хворих, поранених і контужених найманців, зменшуючи можливі втрати в бою."
    MAG_DEC_econmic_development_werbell_initiate_staff_recruitment: "Розпочати набір персоналу"
    MAG_DEC_econmic_development_werbell_initiate_staff_recruitment_desc: "Ми розгорнемо широке вербування в різних зонах конфліктів поблизу району дій нашої держави найманців. Це забезпечить сталий приплив людських ресурсів."
    MAG_DEC_econmic_development_werbell_establish_combat_platform: "Створити бойову платформу"
    MAG_DEC_econmic_development_werbell_establish_combat_platform_desc: "Одним із наших найвищих пріоритетів має стати спорудження об'єктів, завдяки яким §nМаґаданська база§! допомагатиме проводити найманські операції. Після їх завершення ми нарешті зможемо формувати бойові підрозділи й відряджати їх у зони конфліктів регіону. Це має гарантувати стабільний прибуток за невеликого ризику. Незначних втрат не уникнути, але чоловіки й жінки, які записуються до цих підрозділів, - досвідчені професіонали й добре знають, на що погодилися."
    MAG_DEC_econmic_development_werbell_construct_base_development_platform: "Збудувати платформу розвитку бази"
    MAG_DEC_econmic_development_werbell_construct_base_development_platform_desc: "Цей об'єкт дасть змогу краще переробляти сировину з підконтрольних територій. У довгостроковій перспективі він підвищить нашу здатність виробляти власну зброю й транспорт."
    MAG_DEC_econmic_development_werbell_construct_support_platform: "Збудувати платформу забезпечення"
    MAG_DEC_econmic_development_werbell_construct_support_platform_desc: "Нам потрібен логістичний центр для підтримки польових сил. Крім того, цей об'єкт допоможе зробити наші операції самодостатніми, а згодом стане підмурком торгівлі із зовнішнім світом... Звісно, якщо нас визнають законною державою."
    MAG_DEC_econmic_development_werbell_construct_intel_platform: "Збудувати розвідувальну платформу"
    MAG_DEC_econmic_development_werbell_construct_intel_platform_desc: "Знання - це сила й гроші. Створивши розвідувальний підрозділ, ми краще передбачатимемо кроки ворогів і знаходитимемо вигідні можливості. Звісно, потрібний покупець дорого заплатить за такі таємниці."
    MAG_DEC_econmic_development_werbell_construct_medical_platform: "Збудувати медичну платформу"
    MAG_DEC_econmic_development_werbell_construct_medical_platform_desc: "Щоб наші операції були тривалими, необхідно створити медичні заклади, де солдати ефективно відновлюватимуться між завданнями. Надлишок медичних засобів дістанеться населенню. Авжеж, це гуманітарний жест задля прихильности людей, але й довести, що ми кращі за замінених нами головорізів РФП, не завадить."
    MAG_DEC_econmic_development_werbell_construct_rd_platform: "Збудувати науково-дослідну платформу"
    MAG_DEC_econmic_development_werbell_construct_rd_platform_desc: "Людина багатьох талантів, Вербелл розуміє необхідність самостійно розробляти й виробляти спорядження. Створивши в Маґадані належний військовий науковий центр, ми зможемо значно швидше втілювати новаторські ідеї на полі бою."
    MAG_DEC_econmic_development_werbell_expand_command_platform: "Розширити командну платформу"
    MAG_DEC_econmic_development_werbell_expand_command_platform_desc: "Коли основні структури нашої §nМаґаданської бази§! вже створено, можна розширити командний центр у межах §nМаґаданської бази§! для складніших операцій - таємних і відкритих."
    
    werbell_pp_boost_tt: "Щоденний приріст політичної влади збільшиться на §G+0.15§!\n"

    MAG_DEC_econ_werbell_1_construct_brig: "Збудувати гауптвахту"
    MAG_DEC_econ_werbell_1_construct_brig_desc: "Уже очевидно, що тут доведеться навести лад - і серед наших людей, і серед місцевих. Гауптвахта на §nМаґаданській базі§! дасть змогу швидко затримувати солдатів за дисциплінарні проступки та цивільних, які порушують права наших бійців, і тримати їх під суворим наглядом."

    MAG_econ_werbell_phase_update_tt: "Етап §Mекономічного розвитку§! буде §Gпідвищено§!, стануть §Gдоступні§! §Yнові рішення§!.\n"

