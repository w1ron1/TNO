 MAG_WA_mercenary_contracts_category: "Контракти найманців"
 MAG_WA_mercenary_contracts_category_desc: "\n\n\n\n\n\nДля більшости держав війна - жахлива трагедія, якої слід уникати за будь-яку ціну. Для нас же війна - вигідна нагода заробити на вбивстві в усіх значеннях цього слова.\n\nНаш головний експорт - солдати без домівки й власної справи, а по всьому світу не бракує гарячих точок, де їхні особливі таланти стануть у пригоді - звісно, за певну ціну.[GetMAG_WA_Yemeni_Civil_War][GetMAG_WA_Saudi_War][GetMAG_WA_Egyptian_Civil_War][GetMAG_WA_Sudanese_Civil_War][GetMAG_WA_South_Sudanese_Civil_War][GetMAG_WA_Iraqi_Civil_War][GetMAG_WA_Omani_Civil_War][GetMAG_WA_Iranian_Civil_War][GetMAG_WA_Iberian_Wars][GetMAG_WA_Congolese_Civil_War][GetMAG_WA_Angolan_Civil_War][GetMAG_WA_Mozambique_Civil_War][GetMAG_WA_West_African_War][GetMAG_WA_Beafrikan_War][GetMAG_WA_Mano_Campaign][GetMAG_WA_Indonesian_War][GetMAG_WA_CCW]"

