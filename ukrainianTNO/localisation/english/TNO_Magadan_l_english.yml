 #Regional Factions
 MAG_regional_factions_category: "Усередині партії"
 MAG_regional_factions_category_desc: "За правління Міхаїла Матковского Сибірська Національна Республіка - принаймні на папері - відкинула Россійскую Фашистскую Партію та створила «нову партію без нашого фашистського образу»: Русскую Національную Трудовую Партію. Та навіть коли Вождь росіян святкує народження нової «вільної партії», декому - зокрема й йому самому - стало зрозуміло, що в РНТП виникли розколи.\n\nУ центрі стоїть Вождь із відданими прибічниками - §Oтрудовиками§!.\n\nЛіворуч - Ніколай Пєтлін зі своїм колом, §Mреформісти§!.\n\nПраворуч - §gстара гвардія§!, строкатий беззубий табір фашистів, які вважають Вождя надто «м'яким» і затято борються проти задумів і Пєтліна, і Матковского щодо нової Сибірської Національної Республіки. У великій грі вони не мають значення.\n\nЯкщо одне з головних крил зуміє утвердити владу, майбутнє §YСибірської Національної Республіки§! буде в його руках...\n\nНині найбільший вплив має фракція [ROOT.GetMAG_reformists_vs_labourists].\n"

