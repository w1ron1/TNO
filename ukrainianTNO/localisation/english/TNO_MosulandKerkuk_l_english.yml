 ## Опис лідерів ##
 POLITICS_AHMAD_BARZANI_DESC: "Чи є компроміс між ідеалами єдиним шляхом для курдського народу, щоб досягти мрії про самовизначення, яку раніше вважали неможливою? Здається, що так.\n\nШейх Ахмед Барзані втратив усе ще в молодому віці: його плем'я здійснило заколот проти османської влади в його немовлячому віці, він ще не був дорослим, коли його батька, діда та брата стратили за їхній опір султану Османів. Тільки в 1930-х роках, після короткого вигнання в Туреччині, Ахмед сам очолив різні курдські племена проти іракського уряду та їх британських маріонеток разом зі своїм молодшим братом Мустафою.\n\nЗдавалося б, його війна була безнадійною. Але коли британський мандат в Іраку впав перед могутністю військ Осі, Барзані швидко взяв під контроль свою батьківщину, боровшись на боці турецьких сил і скориставшись своїми зв'язками в турецькому політичному середовищі. Шейх тепер сидить на троні, зробленому з кісток курдських борців за свободу, слухаючи солодку мелодію з Анкари, яка каже йому, як танцювати..."
 POLITICS_SABIHA_GOKCEN_DESC: "Сабіха Гекчен мала лише одну пріоритетну мету, як Генеральний інспектор Мосула та Кіркука, сидячи на чолі Шостої Генеральної Інспекції. Ця мета — інтереси турецької нації на довго-хаотичних землях Мосула та Кіркука, а також збереження радикального кемалізму в межах цих інтересів.\n\nДекілька десятиліть тому пріоритети Гекчен були значно більш звичайними. Усиновлена дочка Ататюрка, вона спочатку мала мало чого турбуватися, окрім того, щоб її літак (як однієї з перших жінок-пілотів в історії Туреччини) працював. Але після бомбардувань Дерсіма і підйому Реджепа Пекера (її близького союзника) та Ісмета Іненю до влади, її швидко підняли на більш високий рівень військової служби, і вона стала героєм війни на фронтах Сирії, Вірменії та Західної Росії.\n\nНавіть після того, як Іненію не вдалося обмежити підйом радикальних кемалістів після смерті Пекера, Гекчен набула великої сили. Хоча вона зближалася з друзями Пекера, вона обережно зберігала мовчання як офіцер армії, поки Іненію, помилково вважаючи її мовчання політичним ортодоксом і, що важливо, довіряючи її досвіду в боротьбі з тероризмом та здатності виконувати справи, призначив її Генеральним інспектором Мосула та Кіркука.\n\nЗбираючи однодумців серед генералів, політиків і бюрократів, та дозволяючи Молоді кемалістів Талаата Айдеміра розгулятися в регіоні, Гекчен розпочала Операцію Альп Арслан, свій план по інтеграції Мосула та Кіркука до Туреччини безповоротно. Використовуючи доходи від нафти, вона перетворила Мосул на індустріальний комплекс і одного з найбільших постачальників турецької армії. І тепер, якщо Гекчен має що сказати з цього приводу, Мосул та Кіркук стануть назавжди невід'ємною частиною Туреччини, незважаючи на те, скільки бомб доведеться скинути на скільки "підривників"."

 ## Опис міністрів ##

 ### Ідеї ###
 BKU_Operation_Alparslan: "Операція Альп Арслан"
 BKU_Operation_Alparslan_desc: "Операція Альп Арслан, названа на честь сельджуцького султана, який відкрив Анатолію для турецького народу своєю перемогою на Битві при Манцикерті, має подібну мету до того, що було задумано його попередником.\n\nЇї мета — засуджена опозицією вдома, UDP та DYP — проста. Успіх означатиме завершення зусиль з 'ліквідації' терористичної діяльності та завершення турецької асиміляції регіону за допомогою багатоступеневих заходів нагляду та освіти в міських центрах, а також знищення терористів та анти-турецького опору в горах і селах."
 BKU_Musul_Kerkuk_Oil_Company: "Мосул та Кіркук Нафтова Компанія"
 BKU_Musul_Kerkuk_Oil_Company_desc: "Мосул та Кіркук Нафтова Компанія, є дочірньою компанією Petrol Ofisi. Її завдання — експлуатація нафтових родовищ Мосула та Кіркука до їхнього повного потенціалу, і вона виконує це завдання з готовністю.\n\nРобота MKPŞ принесла масу вигоди. Ці вигоди наповнюють гаманці армії турецьких бізнесменів, а також привласнену суму Шостої Генеральної Інспекції; останні використовують прибуток для інвестицій у місцеву військову промисловість."
 BKU_Turkey_takes_oil_tt: "§RВсі природні резерви в цьому регіоні адмініструються Туреччиною.§!"
