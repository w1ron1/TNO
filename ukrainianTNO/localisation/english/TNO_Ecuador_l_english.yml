 GAX_Guillermo_Freile_Posso: "Гільєрмо Фрейле Поссо"
 POLITICS_GUILLERMO_FREILE_POSSO_DESC: "Після того як Гандера не зміг приховати свої плани, що призвело до його ув'язнення урядом, Сполучені Штати намагалися максимально віддалитися від ситуації, яка сталася в Еквадорі.\n\nОднак ситуація змінилася з падінням кузенів Аросмен і піднесенням рішуче антипідтримуваного Америкою режиму, що змусило Вашингтон знову намагатися відновити зв'язки з армією, яка все ще мала певну цінність, зокрема Гільєрмою Фрейле Поссо.\n\nПісля служби в Повітряних силах Сполучених Штатів, де він здобув репутацію гонорового аса, він був одним з перших, хто покинув країну після невдалого перевороту, сподіваючись знайти притулок у країні, де він колись служив. Однак на нього чекали більші плани, і, оскільки американці боялися втратити свою стратегічну базу на Галапагоських островах, вони звернулися до нього з пропозицією очолити уряд у вигнанні.\n\nФрейле майже одразу погодився, заявивши себе законним наступником уряду Аросмен і складаючи плани майбутнього захоплення материкової частини. Однак реальність була значно іншою — уряд у вигнанні повністю залежав від допомоги Вашингтона, не маючи майже жодних ресурсів і населення, щоб підтримувати власні зусилля, при цьому мусив підтримувати широку базу підтримки для збереження міжнародної легітимності."
 ECU_idea_a_puppet_in_all_but_name: "Еквадор на ланцюгу"
 ECU_idea_a_puppet_in_all_but_name_desc: "У жалюгідному стані, в якому опинилася Республіка Еквадор після комуністичної революції 1960 року, перуанське вторгнення було неможливо зупинити, і держава швидко колапсувала, коли Веласко втік у вигнання.\n\nТе, що залишилося після нього, стало не більше ніж маріонеткою американських та перуанських інтересів. Армія, що й так була ослаблена, була розгромлена, олігархи, які вже десятиліттями контролювали економіку, отримали ще більше влади, а на місце де-факто диктатури Веласко була встановлена нова "Демократія", яка лише продовжувала його режим без нього на чолі.\n\nПопри найкращі зусилля багатьох у уряді виправити ситуацію, вони виявилися неспроможними врятувати цю жалюгідну державу, або через некомпетентність, або через відсутність ресурсів для досягнення своїх цілей, що призвело до того, що більшість почала відвертатися від режиму і звертатися до більш радикальних партій, які обіцяли відродження нації."
 ECU_idea_communist_underbelly: "Привид Комунізму"
 ECU_idea_communist_underbelly_desc: "Після комуністичної революції 1960 року і наступного вторгнення Перу революціонери змушені були відступити до джунглів Амазонії, де вони перегрупувалися та готувалися до наступного кроку.\n\nОднак майбутнє було обіцяно тим, хто прагнув принести соціалізм в Еквадор. Коли Веласко перебував на іншому континенті, а маріонетковий уряд Перу лише погіршував рівень життя все більшої кількості громадян, революціонери стали символом майбутнього Еквадору та єдиними, хто справді міг протистояти Перу, що дало їм величезну популярність, коли тисячі людей почали приєднуватися до їхніх лав.\n\nКонтролюючи більшість території Еквадору, крім столиці, привид революції постійно нависає над Кіто, наближаючись усе ближче з кожним днем."
 ECU_idea_the_wolves_from_outside: "Вовки зовні..."
 ECU_idea_the_wolves_from_outside_desc: "По всьому континенту стоїть постійне нагадування про минуле Еквадору та загрозу його майбутньому. Після вторгнення Перу, Веласко переніс свій уряд до Іберії, де використав своє знайомство з іспанцями для організації уряду у вигнанні.\n\nТам він змінив свій підхід до політики, звернувшись до перонізму та ще більше загострив популізм. Об'єднавши навколо себе багато політиків, як в еміграції, так і на материковій частині, він став постійною загрозою для будь-якого еквадорського уряду, що не побудований навколо його особи."
 ECU_idea_and_the_wolves_from_within: "...І вовки всередині"
 ECU_idea_and_the_wolves_from_within_desc: "З огляду на численні проблеми Еквадору, можна було б подумати, що жалюгідна армія, яка була на озброєнні країни, не є однією з них, але це було далеко від істини.\n\nЗавдяки жалюгідному стану, в якому опинився уряд, покинутому Перу майже на всіх фронтах, ворожому ставленню до США та підкореному олігархам, слабка армія залишалася тим, що стримувало повний розпад і падіння революціонерів.\n\nОднак це зовсім не означало, що армія підтримує уряд. Навпаки, армія просто зберігала нейтралітет, при цьому ходили чутки про закулісні переговори між нею та американцями щодо підтримки можливого перевороту, і все більше людей починало задаватися питанням, скільки ще протримається ця фарсова республіка."
 ECU_idea_vencir_o_morir: "Венсір о Морір"
 ECU_idea_vencir_o_morir_desc: "Революція проти уряду Аросмен є лише першим кроком для Агірре та його однодумців. З кінцевою метою принести комунізм сусіднім націям, країна готується до гарантованого майбутнього вторгнення Перу.\n\nОб'єднавши майже весь Еквадор проти імперіалізму нації, яка вже двічі розчарувала надії нації за останні 20 років, навіть ті, хто не підтримують революційний уряд, тепер стають на його бік у боротьбі проти Перу."
 ECU_idea_alianza_para_el_progreso: "Альянса для прогресу"
 ECU_idea_alianza_para_el_progreso_desc: "Хоча перша революція в Еквадорі у 44 році принесла необхідні реформи державі, ці реформи були скасовані з часом, коли Веласко відмовився від багатьох своїх обіцянок людям, а будь-які залишки політики були скасовані маріонетковим урядом Перу.\n\nТаким чином, різні революційні партії об'єдналися для організації коаліції, метою якої стало впровадження змін, необхідних для того, щоб люди Еквадору мали майбутнє."
 ECU_idea_true_home_of_the_revolution: "Справжній дім революції"
 ECU_idea_true_home_of_the_revolution_desc: "Куба мала стати домом комунізму в Америці, країною, що експортуватиме соціалістичну революцію на континенти. Натомість Кастро перетворив її на маріонетку інтересів капіталістичних свиней у Вашингтоні, схиляючись перед ними, щоб зберегти владу.\n\nЧерез це мало хто з еквадорських революціонерів підтримував Кубу, вважаючи Кастро не більше ніж ще одним Веласко, який зрадить тих, хто поставив його на владарювання, як тільки він отримає таку можливість.\n\nЦе означало, що революція потребувала нового дому, і Еквадор прийняв цю роль, не схиляючись перед жодними імперіалістами, будь то американці чи японці, просуваючи партії-союзники щоразу, коли була така можливість."
 ECU_idea_a_non_partisan_government: "Непартійний уряд"
 ECU_idea_a_non_partisan_government_desc: "Після перевороту, під виглядом повернення Еквадору до цивільної адміністрації, багато партій пропонували різних кандидатів на посаду урядових міністрів для військових, але всі ці пропозиції були відхилені.\n\nВійськові відмовилися від того, щоб пов'язувати себе з будь-якою конкретною партією чи ідеологією, вибравши замість цього аполітичний підхід до управління країною, щоб гарантувати можливість здійснення всіх необхідних реформ.\n\nОднак цей непартійний підхід вимагає, щоб партії, принаймні, не виступали відкрито проти військового уряду та його дій, що може бути складно при радикальних реформах."
 ECU_idea_shifting_tides: "Змінні хвилі"
 ECU_idea_shifting_tides_desc: "Не секрет, що військовий уряд Гандари був підтриманий Америкою, яка забезпечила та підтримала переворот проти уряду Аросмени.\n\nАле це зовсім не означає, що військові справді хочуть тісно співпрацювати з США. Враховуючи участь Америки в попередньому вторгненні Перу і їх небажання підтримувати претензії Еквадору на втрачену територію, багато хто вважає Вашингтон лише зручним союзником.\n\nЦе найкраще розуміє сам голова хунти, Гандара, який навчався в Італії під час Другої світової війни та в Іберії в кінці 40-х і на початку 50-х років, виступаючи як потужний голос на користь впливу колишніх країн Тріумвірату на Еквадор.\n\nНа даний момент Еквадору необхідні американці, хоча невідомо, як довго це триватиме, особливо якщо в майбутньому може виникнути військовий конфлікт між Еквадором та його південним сусідом."
 ECU_idea_pragmatism_above_all: "Прагматизм понад усе"
 ECU_idea_pragmatism_above_all_desc: "Якщо уряд Аросменів можна було б описати однією фразою, то це було б "жалюгідне бездіяльність перед надмірними труднощами".\n\nПопри те, що багато членів уряду працювали з найкращими намірами для країни, вони не змогли зробити нічого, щоб змінити внизковий спіраль, в якому опинився Еквадор, змушені підкорятися вищим силам.\n\nОднак військові мають єдиного союзника, США, і оскільки ці останні дали зелене світло для численних реформ, необхідних Еквадору, уряд буде прагматично вирішувати всі ці питання та діяти відповідно, щоб забезпечити Еквадору майбутнє, яке він заслуговує."
 ECU_idea_el_plan_quinquenal: "П'ятирічний план"
 ECU_idea_el_plan_quinquenal_desc: "Задушений кредитами та репараціями, Еквадор опинився в повній неспроможності значно інвестувати в свою країну за попереднього уряду, змушений витрачати всі свої обмежені кошти на зовнішніх кредиторів.\n\nХоча були спроби домовитися з американцями та перуанцями, ці переговори призвели до дипломатичних принижень, що ще більше відкинули країну назад.\n\nОднак тепер, з підтримкою США для Гандару та його уряду, були знайдені нові рішення для економічних проблем країни. Виплати боргів були припинені, репарації Перу скорочені, і разом з величезними інвестиціями у вигляді низькопроцентних позик уряд розпочав масові інвестиційні програми в інфраструктуру, щоб спробувати відновити загибаючу економіку.\n\nЦі інвестиції, хоча й мають величезний потенціал для країни, є лише тимчасовими і втілюються в рамках п'ятирічного плану, що робить майбутнє, коли ці інвестиції завершаться, а борги будуть погашені, невизначеним для багатьох."
 ECU_idea_our_iberian_friends: "Наші іберійські друзі"
 ECU_idea_our_iberian_friends_desc: "Після зростаючого іберійського впливу на американські континенти та піднесення ідеї Іспаніїсності серед різних країн, Веласко знайшов союзника для Еквадору в своєму колишньому колоніальному господарю.\n\nІнвестуючи в країну та ставши одним з найбільших торгових партнерів до перевороту 1960 року, Іберія дала притулок Каудільйо та прийняла його прихильників, підтримуючи їх у спробах повернутися до влади на батьківщині.\n\nЦі зусилля окупилися, коли після повернення Веласко до влади Іберія стала найбільшим торговим партнером і інвестором країни, домінуючи в її економіці, коли її компанії заполонили ринок Еквадору дешевими товарами.\n\nХоча це допомогло оживити економіку держави, підвищивши рівень зайнятості та життя, допомога Іберії не є чисто благодійною, а зумовлена її власними інтересами в країні та регіоні, що робить будь-яку відверту залежність від них небезпечною для уряду та країни загалом."
 ECU_idea_populism_and_progressivism: "Популізм та Прогресизм"
 ECU_idea_populism_and_progressivism_desc: "Немає двох кращих слів, які могли б описати Веласко Ібарру краще, ніж Популізм і Прогресизм.\n\nПісля Глоріозної революції 1944 року Веласко став центральною фігурою в еквадорській політиці, правив безперервно більше 15 років завдяки своєму розумному використанню популістських та прогресивних політик, об'єднуючи як консерваторів, так і соціалістів під своїм крилом.\n\nХоча такий підхід до політики не врятував його від зриву в кінцевому підсумку, саме він став причиною його повернення, коли народ визнав його героєм та обрав його як об'єднавчу фігуру для країни, яка розривалася.\n\nОднак, з радикалізацією Лівих після уряду Аросмені та обеззброєнням Правих після захоплення майна олігархів, залишається питання, чи зможе Веласко продовжувати володіти таким великим впливом і вагомістю в майбутньому, або ж він впаде, як будівля, що не витримала під час створення своїх карт."
 ECU_idea_public_enemy_number_one: "Головний ворог №1"
 ECU_idea_public_enemy_number_one_desc: "Еквадор має одного ворога, одну сутність, яка мучить його століттями та принизила двічі за останні 20 років — Перу.\n\nНіхто інший не переслідував колективну свідомість народу Еквадору так, як Перу, з людьми, що дивляться зверхньо та кожного разу знищують меншу сестру-республіку.\n\nАбо принаймні таке наратив просуває Веласко, малюючи Перу як джерело всіх зла в країні, єдиний корупційний елемент, який не дозволив Еквадору стати процвітаючою та великою нацією в Південній Америці.\n\nРозпочавши величезну пропагандистську кампанію для об'єднання народу проти цього спільного ворога, Веласко збільшив фінансування армії, найнявши іберійських та італійських радників для допомоги в її модернізації, все з метою перемогти присяжного ворога своєї нації та відновити честь Еквадору."

