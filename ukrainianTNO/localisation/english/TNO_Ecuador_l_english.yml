 ECU_Otto_Arosemena_Gomez_hog_desc: "§YВіце-президент\nНаціональний консерватизм§!\n--------------\n§LEквадор не є чужим політичним династіям, і Отто Аросмена Гомес є відмінним прикладом цієї історії непотизму, будучи нічим іншим, як двоюрідним братом Президента. Однак посаду Прем'єр-міністра не було надано тільки на цих підставах, його реформістська та модерністська спрямованість робила призначення доцільним.\n\nВіддаючи більше і більше державних ресурсів олігархам, намагаючись здобути їх підтримку для своїх цілей, він значно ослабив економіку країни і збільшив корупцію, що значно погіршило умови життя для більшості населення.\n\nОднак ці жертви, які він примусив робити інших, мали сенс, адже це було заради нації та її майбутнього. Проте це майбутнє було забрано, коли Президент зруйнував переговори між державою та американцями, змушуючи Прем'єр-міністра діяти та зустрітися з перуанцями хоча б для того, щоб забезпечити країні хоч одну перемогу.\n\nОднак, подібно до свого кузена, він зруйнував ці переговори, відмовившись йти на компроміс з Перу, що призвело до скасування переговорів і знищило будь-яку можливість зменшити репарації, які держава змушена була платити, ймовірно, закріпивши її темне майбутнє в камені.§!"
 ECU_Reynaldo_Varea_Donoso_for_desc: "§YМіністр закордонних справ\nДеспотизм§!\n--------------\n§LРейнальдо Вареа Доносо не є дипломатом. Він є не більше, ніж вірним попутником, готовим бути чоловіком, що завжди каже «так», виконуючи накази Президента та Прем'єр-міністра і ставлячи майже нульові питання після цього. Так було і в обох переговорах з американцями та перуанцями, коли двоюрідні брати Аросмена зруйнували будь-яку можливість поліпшити відносини з режимами, а Вареа був звинувачений у невдачах обох.\n\nАле, на відміну від інших, хто б пішов у відставку через це, це мало значення для Міністра закордонних справ, для нього найважливіше було його положення та гроші, що з ним приходили.§!"
 ECU_Jose_Federico_Intriago_Arrata_eco_desc: "§YМіністр економіки та фінансів\nДеспотизм§!\n--------------\n§LБудучи підтримувачем Веласко в минулому, Хосе Федеріко Інтріаго Аррата приєднався до двоюрідних братів Аросмена після того, як залишив свою колишню політичну домівку. Подібно до Прем'єр-міністра, Інтріаго зробив це не з почуття самозбереження, а з бажання покращити життя людей, розчарувавшись у в'ялу політику Веласко.\n\nОднак, він був абсолютно нездатний зробити те, чого прагнув. Завдяки тісному контролю олігархів над економікою через закулісні угоди Прем'єр-міністра, держава не мала можливості для здійснення суттєвих реформ.\n\nНе здавшись, він спробував врятувати державу через переговори з Америкою та Перу, сподіваючись, що перша надасть вкрай необхідне фінансування, а друга зменшить величезні репарації. Однак, на його жаль, переговори з обома виявились неуспішними, і економічне майбутнє Еквадору залишилось сумнівним, м'яко кажучи.§!"
 ECU_Marcos_Gandara_Enriquez_sec_desc: "§YМіністр національної оборони\nПрогресивний консерватизм§!\n--------------\n§LНе призначення за вибором, а скоріше через необхідність, Маркос Гандала Енріке є представником армії в уряді. Постійне нагадування про те, що, незважаючи на надзвичайну слабкість після її нейтралізації перуанцями, інститут все одно потрібно поважати.\n\nПроте це почуття було не взаємним, оскільки майже ніхто в армії не надавав жодної поваги уряду, а Гандала служив лише як формальний візуальний елемент, при цьому відсутність підтримки з боку США і загроза чергової перуанської інтервенції зводили до нуля будь-яке втручання уряду.\n\nНевдалі переговори між американцями та урядом змінили це. Чутки про те, що Вашингтон почав закулісні переговори з армією, надаючи їй підтримку для можливого перевороту, змушують багатьох замислюватись, скільки часу залишилось до моменту, коли армія втрутиться, або чи залишаться ці чутки лише плітками.§!"

