 POLITICS_CARLOS_AROSEMENA_MONROY_DESC: "Carlos Julio Arosemena Monroy народився в політичній еліті Еквадору, але замість того, щоб покладатися на неї, він вирішив боротися проти неї. Приєднавшись до політики на початку 50-х років, підтримуючи Веласко та його популістську партію, він досяг певного політичного успіху, хоча й обмеженого в порівнянні з його амбіціями.\n\nПісля десятиліть відчуження лівих і все більшої залежності від естаблішменту для збереження своєї влади, Веласко став надзвичайно непопулярним серед народу. Тому після Кубинської революції 1959 року соціалістичні революціонери Еквадору розпочали власне повстання в 1960 році, захопивши країну і вигнавши Веласко та його уряд, які знайшли притулок серед іберійців, що підтримували його стільки часу. Однак Революційний уряд не зміг втриматися, оскільки перуанці перетнули кордон і придушили революцію, встановивши маріонетковий уряд.\n\nТі, хто втік в еміграцію, і мало хто з тих, хто залишився після революції, не мали бажання співпрацювати з людьми, які відібрали їхні землі в кровопролитній війні менше ніж за два десятиліття до цього, але Аросмена Монрой не був серед таких людей. Задля захисту себе і своєї країни політик зібрав стільки прихильників, скільки зміг, і представив перуанцям кабінет, який вони були змушені прийняти не через інше, а з чистої необхідності, оскільки Вашингтон почав чинити тиск, щоб повернути регіон до цивільного правління.\n\nОднак його правління було позначене неможливістю здійснити значущі реформи, оскільки він був обмежений олігархами, які розгулялися після десятиліть підтримки з боку Веласко, і тепер ще більше зміцнилися завдяки Лімі. Навіть ті речі, які були під його контролем, призводили до провалів для президента, і його "пияцтво" призвело до катастрофи в дипломатичних переговорах між Кіто та Вашингтоном, що стало національним приниженням, і змусило багатьох запитати, як довго президент зможе залишатися при владі."
 POLITICS_MANUEL_AGUIRRE_DESC: "У очах Мануеля Агостіна Аґірре Ріоса Перша Еквадорська Революція 44' була узурпована контрреволюціонерами-консерваторами, а Веласко служив їхнім лідером, проникаючи в реформи Каудільйо, щоб не дати їм зайти занадто далеко, і тягнув його за собою лише для того, щоб викинути наприкінці. Для Аґірре Веласко був лише сходинкою на шляху до справжньої Еквадорської Революції.\n\nОднак цей погляд не був прийнятий усіма, адже багато хто все ще шанував Каудільйо та його реформи. Це було найкраще видно під час Другої Еквадорської Революції 1960 року, коли люди, обурені усуненням їхнього лідера, об'єдналися навколо Партії Комуністів Еквадору та Рікардо Паредеса Ромеро, щоб повалити олігархів, які зрадили державу за допомогою Че Гевари. Однак, коли почалися внутрішні суперечки через повернення Каудільйо для очолення держави, країну вторглася Перу, судячи та страчуючи Паредеса і прогнавши Гевару.\n\nХоча Аґірре і його Соціалістична революційна партія Еквадору були малими силами перед Другою революцією, вони зайняли центральне місце в відновленні та реорганізації революціонерів, оскільки більша частина його опозиції втекла, щоб приєднатися до Веласко після перуанського вторгнення, повністю прийнявши геваризм і розпочавши партизанську війну як проти Перу, так і проти Еквадору з джунглів Амазонії, чекаючи відповідного моменту для удару.\n\nЗ голодними людьми, розділеною армією і небезпечним урядом після колумбійської кризи біженців і невдалого перевороту в армії, ПСРЕ завдав удару по державі, почавши численні популярні повстання по всій країні і захоплюючи важливі урядові будівлі, в результаті чого оголосили Третю Еквадорську Революцію. Проголошуючи народження Соціалістичної Республіки Еквадор, Аґірре закликає різні революційні партії країни об'єднатися під його проводом та його режимом, готуючись до майбутніх реформ і конфліктів."
 POLITICS_JOSE_IBARRA_DESC: "Ніхто не домінував в Еквадорі так, як Хосе Марія Веласко Ібарра. Від людей до політики, його популізм та персоналізм дозволили йому зайняти центральне місце в країні майже на два десятиліття.\n\nХоча його відкрите звернення до Іберії як альтернативи США було добре сприйнято Вашингтоном, після того, як відносини між двома країнами погіршились, перспективи швидко змінились. Підтримуючи переворот проти Веласко, щоб гарантувати, що країною буде керувати американський союзник, Каудільйо втік до Іберії, де він почав будувати своїх союзників, які втекли разом з ним. Там він зустрівся з іберійськими лідерами та іншими політиками в еміграції, плануючи шляхи для свого повернення та поглиблюючи своє "Веласкізмо".\n\nТому, коли еліти, які ще півдесятиліття тому допомогли скинути його, попросили його повернутися на посаду президента та врятувати країну від колапсу, він погодився без зайвих роздумів. Знову позиціонуючи себе як об'єднуючу фігуру для людей, їхнього рятівника та героя, він повернувся проти тих, хто повернув його до влади, атакуючи еліти, націоналізуючи величезні ділянки землі в Еквадорі та багато їхніх компаній. Викликаючи масовий відтік капіталу від американських компаній, одним швидким кроком він позбувся впливу США, що, на його думку, були найбільшими перепонами на шляху до процвітання країни. Залишаючись залежним від своїх іберійських союзників, Веласко влаштував себе на позицію майже всевладного правителя в Еквадорі, з єдиною загрозою від армії на Галапагоських островах, що гарантує, що його найближче майбутнє буде стабільним, якщо нічого іншого."
 POLITICS_MARCOS_GANDARA_DESC: "Марко Гандера Енрікец, будучи академіком за своєю суттю, спостерігав за політикою Еквадору з боку з моменту після вторгнення Перу, детально описуючи стан країни та її збройних сил протягом років.\n\nЗавоювавши повагу серед міжнародних колег після навчання та роботи з іберійськими, італійськими та американськими військовими, Гандера став помітною фігурою в пізньому уряді Веласко. Однак переворот 1960 року, соціалістична революція та перуанське вторгнення зірвали його плани.\n\nЗмушений сидіти осторонь, спостерігаючи за тим, як уряд приймає одну катастрофічну політику за іншою, а країна розвалюється, він був змушений вжити радикальних заходів. Почавши наближатися до Вашингтона проти своєї волі та готуючи переворот, щоб усунути уряд Аросмен і встановити військовий, який нарешті впорається з усіма проблемами, що мучили Еквадор протягом половини століття.\n\nСкориставшись своїм шансом, коли розпочалася Колумбійська громадянська війна, він захопив контроль над країною і викинув цивільний уряд. Він розпочав здійснення широкомасштабних реформ в державі, одночасно зберігаючи армію незалежною від політики. Однак його справжні наміри йдуть далеко за межі його поточних дій, і його співпраця з американцями та очевидна тимчасовість правління не є тим, чого справді хоче Гандера, а лише тим, що йому дозволено."
