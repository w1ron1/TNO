 ### Ideas ###
 ALB_the_albanian_diarchy: "Албанська діархія"
 ALB_the_albanian_diarchy_desc: "Сучасна політична структура Албанії побудована на двох стовпах: місцевому албанському парламенті на чолі з АФП та прем'єр-міністром Тефіком Мбор'єю і призначеному Італією генерал-лейтенанті Франческо Якемоні.\n\nЦі дві постаті перебувають у майже постійній боротьбі за владу та вплив, кожна намагається нав'язати Албанії своє бачення замість бачення іншої, і реалізованим зрештою може бути лише одне з них."
 
 ALB_lnc_kck: "Партизанська зараза"
 ALB_lnc_kck_desc: "Албанські партизани воюють проти італійців уже майже 25 років. LANÇ Енвера Ходжі очолював рух у перші роки, аж доки не зустрів свою долю в 1953 році. Тепер партизани розділені на три групи: комуністичну LANÇ на чолі з Мислімом Пезою, демократичну KDS на чолі з Джерджем Кокоші та монархічний рух Легалітет на чолі з Есатом Байрактари. Ці партизани завдають дорогих і частих ударів по нашій інфраструктурі. Їх необхідно викорінити якомога швидше."
 
 ALB_the_economic_divide: "Економіка у двох вимірах"
 ALB_the_economic_divide_desc: "Залишок старої османської системи землевласників і кріпаків, албанська економіка й досі залишається глибоко розшарованою. У таких містах, як Тирана, Вльора чи Шкодер, можна знайти багато сучасних галузей промисловості, таких як сталеливарна, на рівні з рештою Італійської імперії. Однак у сільській місцевості економіка цілком аграрна. Механізація не дісталася Албанії, тому селяни працюють зі старими дерев'яними інструментами. Заможні землевласники досі володіють більшістю орних земель, а нижчі верстви сільського суспільства живуть у псевдокріпацтві."
 
 ALB_In_the_Footsteps_of_Enver: "Слідами Енвера"
 ALB_In_the_Footsteps_of_Enver_desc: "Від Італії до Албанії комуністичне повстання надихнуло країни, що так довго страждали під фашистським правлінням. Вийшовши зі своїх печер і лісових схованок, LANÇ Мисліма Пези та Мехмета Шеху взяли країну під свій контроль. Мрія покійного Енвера Ходжі, убитого під час злощасного повстання 1953 року, нарешті здійснилася. Люди виходять на вулиці, вперше відчуваючи смак свободи соціалізму."
 
 ALB_Avenge_Me_Youth: "Помстіться за мене, молодь"
 
 ALB_The_Red_Skanderbeg: "Червоний Скандербег"
 ALB_The_Red_Skanderbeg_desc: "Мехмет Шеху воює з фашистами з 1939 року. Після повалення фашистського генерала Амадео Де Чіа, коли революція охопила Італію, він став лідером незалежної марксистської Албанії. Він амбітна людина і щиро прагне побачити сильну, процвітаючу Албанію зі справжнім самовизначенням, незалежним від Італії. Однак він знає, що для втілення цієї мрії кожного контрреволюціонера необхідно невпинно переслідувати й знищувати."
 
 ALB_The_Two_Eagles_of_Europe: "Два орли Європи"
 ALB_The_Two_Eagles_of_Europe_desc: "Коли більшовицький уряд Італії було змітено переможними арміями Райху, комуністи Албанії впали разом із ним. Німці обрали нового лідера Албанії, і, безперечно, зробили мудрий вибір. Міхал Залларі цілковито відданий Німеччині та прагне знищити будь-який опір їй. Він уклав союз із Баллі Комбетар і розпочав жорстокі терористичні антипартизанські операції, щоб цього досягти."
 
 ALB_The_Puppet_and_the_Puppeteer: "Маріонетка та ляльковод"
 
 ALB_A_Tight_Leash: "На короткому повідку"
 ALB_A_Tight_Leash_desc: "Амадео Де Чіа був амбітною людиною. Відтоді як він врятував Італійську Албанію у 1953 році, генерал-лейтенант не прагнув нічого іншого, крім повного контролю над Албанією. Випередивши Тефіка Мбор'ю в боротьбі за владу, Де Чіа заарештував колишнього прем'єр-міністра, скасував участь албанців у політиці та перетворив країну на Імперський протекторат Албанії, що перебуває під владою Італії. Тепер Де Чіа остаточно закріпив своє становище як беззаперечний лідер."
 
 ALB_Sati_i_Zifes: "Саті і Зіфес"
 ALB_Sati_i_Zifes_desc: "Есат Байрактари воював усе своє життя. Син відомого партизана Мухаррема Байрактари, він узявся за зброю проти фашистів у віці 15 років, воюючи за роялістський Легалітет. Однак тепер фашистів усунуто зсередини, і він виявився призначеним очолити Албанію самою державою, проти якої воював. Албанія залишається в особистій унії з італійською короною, але більше не є колонією Італії, хоча Італія й досі зберігає повне економічне панування."
 
 ALB_The_Albanian_Spring: "Албанська весна"
 ALB_The_Albanian_Spring_desc: "Країна вільна! Після чверті століття фашистського правління Албанія та Італія нарешті демократизувалися. Люди нарешті вільні висловлювати свої думки, а вибори вже призначено. Фашистського прем'єр-міністра Тефіка Мбор'ю було повалено народним натовпом, коли демократичні партизани KDS на чолі з Джерджем Кокоші, Мусіне Кокаларі та Абасом Ерменджі прийшли до влади. Крім того, італійці погодилися надати Албанії більше автономії, зокрема офіційно відокремити країну від Італії."
 
 ALB_The_Zanas_Call_on_Us: "Зани кличуть нас"
 ALB_The_Zanas_Call_on_Us_desc: "У міру того як залізна хватка Паволіні душить Італію, Албанія змушена йти тим самим шляхом. Після того як італійський гарнізон усунув АФП, радикали Баллі Комбетар на чолі з Джафером Дева тепер очолюють державу. Відомі своєю жорстокістю та ультранаціоналізмом ще до приходу до влади, вони тепер спрямовують баллістські ополчення проти меншин Албанії. Народ Албанії зазнав подальшого підкорення італійським монополіям і опинився затиснутим між тиском зсередини та ззовні."

 ALB_The_Triumph_of_the_Old_Guard: "Тріумф старої гвардії"
 ALB_The_Triumph_of_the_Old_Guard_desc: "Будь-які думки про зміни політичної чи соціальної структури Албанії було знищено. Коли Італо Бальбо прийшов до влади як Дуче Італії, він спрямував усю свою владу на підтримку АФП, старої гвардії колабораціоністських фашистів, які керують Албанією з 1939 року. Тепер вони знову панують над державою, а ті, хто загрожував би їхній владі, зазнали остаточної поразки."

 ALB_Death_to_the_Traitors: "Смерть зрадникам"
 ALB_Death_to_the_Traitors_desc: "З появою нового різновиду фашизму в Італії Албанія йде тим самим шляхом. Після приходу до влади в Італії уряду Етторе Муті АФП було усунуто від влади та замінено поміркованою фракцією Баллі Комбетар. Фракцію очолює Хасан Дості, і в усіх аспектах вона дотримується принципів сансеполькризму. Націоналістична, яскрава, революційна та цілковито ворожа до будь-якої форми автономії сербської та грецької меншин в Албанії."

 ALB_KDS_counterrevolution: "Партизани Албанської демократичної коаліції"
