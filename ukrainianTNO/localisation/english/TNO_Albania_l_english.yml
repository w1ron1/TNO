 ### Leader Bios ###
 POLITICS_TEFIK_MBORJA_DESC: "Тефік Селім Мбор'я провів значну частину останніх десятиліть за лаштунками албанської історії, і лише нещодавно, попри свою важливість, зміг вийти на передній план. Народившись у 1888 році, Мбор'я був одним із небагатьох щасливців у країні, чия заможна родина південних землевласників могла дозволити йому здобути вищу освіту — оскільки в Албанії не було університетів, це означало навчання за кордоном. Як і багато його співвітчизників, він обрав Італію, вивчав право в Римі та там познайомився з родиною Чіано. Повернувшись до Албанії, він став депутатом парламенту та частиною дедалі численнішого авангарду албанських політиків, які виступали проти правління короля Зоґа.\n\nКоли режим Зоґа було повалено внаслідок італійського вторгнення, операції, організованої самим графом Чіано, Мбор'я був винагороджений за свою відкриту італофілію призначенням генеральним секретарем новоствореної Албанської фашистської партії, або АФП. Із цієї посади Мбор'я міг чинити вплив на албанський народ, спрямовуючи пропаганду та політику АФП, спрямовані на вступ Албанії в нову, фашистську еру. Постійно маючи справу з обтяжливою присутністю Італії та її посланців, Мбор'я все ж зміг домовитися про певний ступінь автономії Албанії в межах нової Римської імперії.\n\nНасправді Мбор'я та його союзники могли робити не більше, ніж знаходити тимчасові рішення для дуже постійної проблеми Албанії — зруйнованих відносин країни з Італією. Теоретично незалежна держава в коронній унії з Римом, а фактично не більше ніж маріонеткова держава, здатна здобувати поступки та більшу автономію лише перед лицем неминучої катастрофи, представленої дедалі ширшими партизанським рухом і бандитизмом, які, здається, неможливо повністю викорінити. Тепер, коли Мбор'ю призначено прем'єр-міністром за пропозицією Чіано, він, схоже, сповнений рішучості зробити все можливе, щоб нарешті розв'язати нескінченні конфлікти країни — непросте завдання, адже серед розрізнених кланів, класів і територій Землі орлів майже немає єдності."
 
