  # Icon tooltip
TNO_ODF_icon_tt: "§DОПЕРАЦІЯ "ЛЮТИЙ МОРОЗ"§!"
TNO_ODF_icon_tt_delayed: "§WАнтарктида§!. Континент вигнанців. Велика Біла Пустота. Середня температура: §m-21,6 по Цельсію§!. Оточена титанічними скелями, укрита льодовиками, піддана катабатичним вітрам, це найбільш неприязне місце на Землі, повністю непридатне для тривалого людського перебування. Однак з того моменту, як перші дослідники побачили льодові шельфи на її узбережжі: її §Gтаємниці§!, §Bчудеса§! й §Rзагрози§! привертали найвідважніших до її внутрішніх районів. Від прибережних досліджень H.M.S. Erebus і Terror до полярних подорожей §RСкотта§!, §GАмундсена§! та §BШаклтона§!, останнє незвідане місце на Землі кликало безстрашних.\n\nМета цих експедицій завжди полягала в тому, щоб заявити про права на цю пустелю. Єдиний безспірний регіон планети був захоплений примхами геополітики. Перемога §Lсил Осі§! в §RДругій світовій війні§! лише прискорила завоювання §WАнтарктиди§!. Територіальні суперечки на протоці Бігля через острів Снайп між §uЧилі§! й §MАргентиною§! переросли в регіональний конфлікт, що започаткував першу §Rвійну§! в історії §WАнтарктиди§!, та §mперегони за Антарктиду§!.\n\nОскільки великі та малі держави розділяли узбережжя та робили великі заяви щодо внутрішніх територій, сцену було підготовлено для нових §Rконфліктів§! між націями. Американська місія ОВН, §DОперація "Лютий мороз"§!, започаткувала залучення наддержав. Тисячі черевиків ступили на невідомий сніг, за ними йшли ще тисячі з країни-суперників.\n\nІронія того, що держави борються за такий по суті безвартісний шматок землі, не випадає з уваги жодному з учасників, але ніхто не може залишити його, поки інші залишаються, інакше їх престиж буде знищено. Їхнє бажання перемогти одне одного перевищує лише індиферентність континенту до справ §Gлюдини§!. Сильні чи слабкі, багаті чи бідні, коли їжа закінчується і палива залишається мало, є лише §Bтиша§!, §Bхолод§! і §Rнеситний голод, що змушує людей робити неймовірні речі§!.\n\n§WАнтарктида§! чекає..."

####=== The tooltips that are shown when hovering over the menu pictures ===####
