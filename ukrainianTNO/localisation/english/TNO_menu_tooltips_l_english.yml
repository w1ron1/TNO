TNO_ugly_american_icon_tt_delayed: "§F"Suddenly the calm was turned to wind\nThat blew out the last flame in the eyes\nAnd passion was turned to foreboding\nAnd the frozen moment was turned to drama."\n - Vinicius de Moraes\n\n§QCarlos Lacerda§! §Fand§! §hAdhemar de Barros.§! §FThe§! §QCrow§!§F and the§! §hBull.§! Two implacable, determined men diametrically opposed to each other in every sense of the word. The former a right-wing journalist known for his opposition to §VGetúlio Vargas§! and his legacy, and the latter a morally unscrupulous politician who practically rules São Paulo.\n\n§KBrazil§! §Ffinds itself in a turbulent position as 1962 begins - locked in an unending game of chess with neighboring§! §MArgentina,§! §Fthe rest of§! §nSouth America§! §Ffinds itself being forced to pick a side. Should democracy survive the beginning of the decade, then both§! §hAdhemar§! and §QLacerda§! §Fhave the chance to mold the nation in their image.\n\nThe§! §QCrow§! §Fwill swoop down upon the moldering corpse of§! §VVarguism.§! §FHe will peck away at the status quo of the last decade, picking the bones clean and carrying them away to build a new nest - one its chicks can prosper in free from the chains of the past. But fly carefully, bird, and try not to stray too close to the sun -§! §Qeven the greatest of highs§! §xare nothing compared to the lowest of lows.§!\n\n§FThe§! §hBull,§! §Fon the other hand, will charge recklessly onwards. Man, woman, child - nothing and nobody will obstruct his onslaught. He aims to sire a legacy that will last for generations, flattening all who oppose him beneath his hooves. But a§! §Ishadow§! §Ffollows him. One that will force him to play a deadly game, with stakes high enough to make or break everything he has worked for.\n\nThe earth shakes and the sky screams.§! §nSouth America§! §Fwatches and waits, as the§! §QCrow§! §Fand the§! §hBull§! §Ffight for the future.§!"
