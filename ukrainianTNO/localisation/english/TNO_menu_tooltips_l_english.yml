TNO_ugly_american_icon_tt: "§OНовітній Тордесільяс§!"
TNO_ugly_american_icon_tt_delayed: "§FТордесільяський договір§!, укладений у 1494 році, мав на меті поділити Новий Світ між §OІспанією§! та §nПортугалією§!. Благословлені папською санкцією, §OІспанія§! та §nПортугалія§! поділили світ між собою, ставши новими господарями земель, що рясніли багатствами та ресурсами. Однак інші європейські держави жадібно дивилися на нові землі, прагнучи кинути виклик статус-кво та встановити власні сфери впливу. У міру того як удача §nПортугальської§! та §OІспанської§! імперій слабшала протягом наступних десятиліть, §Jанглійці§!, §iфранцузи§! та §uголландці§! залишили договір припадати пилом і привласнили ще більшу частину Америк. Зрештою від колись могутніх §OIбер§!§!nійських§! імперій залишилися самі лише реліквії.\n\nКінець Другої світової війни ознаменував появу нового договору, освяченого атомом і такого, що поділив земну кулю між §mамериканцями§!, §qнімцями§! та §eяпонцями§!, причому кожна наддержава отримала власну сферу впливу. Ці великі держави побоюються підступів своїх суперників і застосовуватимуть усі доступні засоби, щоб перешкоджати їм, навіть коли самі пробираються крізь бурхливі течії сучасності.\n\nУ Латинській Америці, колишньому серці §OІспанської§! та §nПортугальської§! імперій, §mСполучені Штати§! домінують, спираючись на географічну близькість та силу долара. Проте їхня влада над Америками стала хиткою через піднесення ідеологів та путчистів, які, обурені диктатом Вашингтона, поступово послаблюють свої кайдани, можливо, надто охоче прагнучи замінити їх на іншу пару.\n\nЯк і за часів первісного §HТордесільяського договору§!, залишаються держави, які із заздрістю дивляться на цей поділений світ і прагнуть заявити про себе та заволодіти власною гегемонією. Там, де все колись почалося, на §OIбер§!§!nійському§! півострові, залишки старих імперій тепер стоять об'єднаними, прагнучи відродити минуле з його попелу. За морями їхні блудні сини, §KМексика§! та §nБразилія§!, дивляться на сусідів і жадають власного піднесення. 1960-ті стануть історією їхнього зіткнення, піднесення небагатьох із багатьох, адже цей §OСучасний Тордесільяський договір§! може виявитися неефективнішим за свого тезку п'ять століть тому.§!"

