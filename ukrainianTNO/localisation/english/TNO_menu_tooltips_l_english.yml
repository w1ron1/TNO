  # Icon tooltip
  TNO_ODF_icon_tt: "§DОПЕРАЦІЯ «ЛЮТИЙ МОРОЗ»§!"
  TNO_ODF_icon_tt_delayed: "§WАнтарктика§!. Вигнаний континент. Велике Біле Ніщо. Середня температура тут: §m-21,6§! за Цельсієм. Обрамлений титанічними скелями, вкритий льодовиками, який продуваєця катабатичними вітрами, це найнепривітніше місце на Землі, абсолютно непридатне для тривалого проживання людини. Однак з того моменту, як перші дослідники побачили шельфові льодовики на його берегах, його §Gтаємниц§!, §Bчудеса§! і §Rнебезпеки§! вабили найсміливіших вглиб материка. Від прибережних зондів «Еребус» і «Терор» до полярних експедицій §RСкотта§!, §GАмундсена§! і §BШеклтона§!, останнє недосліджене місце на поверхні Землі кликало до себе найвідважніших.\n\nМетою цих експедицій завжди було заявити про свої права на цю пустелю. Єдиний незаперечний регіон планети був підпорядкований примхам геополітики. Тріумф держав §LОсі§! у §RДругій світовій війні§! лише прискорив завоювання §WАнтарктики§!. Територіальні суперечки в протоці Бігль за острів Бекас між §uЧилі§! та §MАргентиною§! переросли в регіональну пожежу, яка ознаменувала першу §Rвійну§! в історії §WАнтарктики§! і §m«Битву за Антарктиду.»§!\n\nПо мірі того, як великі і малі держави ділили узбережжя і висували грандіозні претензії на внутрішні райони, створювалися передумови для нових §Rконфліктів§! між країнами. Місія ОВН під керівництвом США, §Dоперація «лютий мороз»§!, поклала початок залученню наддержав. Тисячі чобіт ступили на незайманий сніг, а за ними ще тисячі з країн-суперників.\n\nІронія у тому, що держави борються за такий за своєю суттю нікчемний шматок землі, що не полишає жодного з учасників, але жоден з них не може піти, поки інші залишаються, щоб не підірвати свій престиж. Їхнє бажання перемогти один одного затьмарює лише байдужість континенту до §Gлюдини§!. Сильний чи слабкий, багатий чи бідний, коли закінчується їжа і паливо, залишається тільки §Bмовчання§!, §Bхолод§! і §Rгризучий голод, який змушує людей робити невимовні речі§!.\n\n§WАнтарктика§! чекає..."

####=== The tooltips that are shown when hovering over the menu pictures ===####
