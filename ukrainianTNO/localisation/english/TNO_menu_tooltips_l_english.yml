# Icon tooltip
TNO_ugly_american_icon_tt: "§QВОРОНА§! §FТА§! §hБИК§!"
TNO_ugly_american_icon_tt_delayed: "§F«Раптом спокій перетворився на вітер,\nщо задув останній вогонь в очах,\nі пристрасть перетворилася на передчуття,\nі мить застигла перетворилася на драму».\n - Вінісіуш де Мораес\n\n§QКарлос Ласерда§! §Fта§! §hАдемар де Баррос.§! §FВорон§ §Fі§! §hБик.§! Двоє непримиренних, рішучих чоловіків, діаметрально протилежних один одному в усіх сенсах цього слова. Перший - правий журналіст, відомий своєю опозицією до §VЖетуліу Варгаса§! та його спадщини, а другий - морально безпринципний політик, який практично керує Сан-Паулу.\n\n§FНа початку 1962 року§! §KБразилія§! §Fопинилася в неспокійному становищі - втягнута в нескінченну шахову партію з сусідньою§! §MАргентиною,§! §Fрешта§! §nПівденної Америки§! §Fзмушена обирати чийсь бік. Якщо демократія переживе початок десятиліття, то і§! §hАдемар,§! і §QЛасерда§! §Fматимуть шанс виліпити націю за своїм образом і подобою.§!\n\n§QВорон§! §Fналетить на гниючий труп§! §Vварґуїзму.§! §FВін викльовуватиме статус-кво останнього десятиліття, визбируючи кістки дочиста і несучи їх геть, щоб збудувати нове гніздо - таке, в якому його пташенята зможуть процвітати, звільнившись від кайданів минулого. Але лети обережно, пташко, і намагайся не триматися надто близько до сонця -§! §Qнавіть найбільші злети не йдуть ні в яке порівняння з найнижчими падіннями.§!\n\n§hБик,§! §Fз іншого боку, буде безоглядно мчати вперед. Чоловік, жінка, дитина - ніхто і ніщо не стане на заваді його наступу. Він прагне залишити спадщину, яка буде тривати поколіннями, розчавивши під своїми копитами всіх, хто протистоїть йому. Але його переслідує§! §Iтінь.§! §FТа, що змусить його зіграти в смертельну гру, ставки в якій досить високі, щоб створити або зруйнувати все, заради чого він працював.\n\nЗемля здригається і небо кричить.§! §nПівденна Америка§! §Fдивиться і чекає, як§! §QВорона§! §Fі§! §hБик§! §Fборються за майбутнє.§!"
####=== The tooltips that are shown when hovering over the menu pictures ===####
