 #ПЕРСОНАЖІ
 ADL_Placido_Fernandez:0 "Пласідо Фернандес Віаґас"
 POLITICS_ADL_PLACIDO_FERNANDEZ_DESC: "Пласідо Фернандес Віаґас народився в Міжнародній зоні Танжера у 1924 році та здобув юридичну освіту в Севільському університеті. За цим послідувала тривала кар'єра в галузі права, зрештою він став суддею Територіального суду Севільї. Однак політично бездіяльним він не був, а також був членом «Демократичної юстиції» — підпільної продемократичної організації, створеної державними службовцями, які зсередини боролися проти режиму Франко.\n\nОднак, коли Союз розколовся через громадянську війну, Фернандес приєднався до Республіки та став членом Міжпровінційної ради Андалусії — організації, створеної Республікою для кращого управління регіоном. Проте багатьом в Андалусії стало зрозуміло, що Міжпровінційна рада не мала достатніх повноважень і автономії, щоб справді робити те, що найкраще для регіону. У міру того як війна продовжувала виснажувати ресурси Андалусії, терпіння регіону до війни досягло межі, і Фернандес був серед тих, хто розробив план відокремлення регіону від Республіки.\n\nТепер Фернандес і Андалусія опинилися в сірій зоні. Вони не проголосили незалежності, але й не визнають Республіку владою над Андалусією. Завдяки своєму тривалому послужному списку Фернандеса було обрано очолити уряд, але залишається лише гадати, як довго буде потрібне його керівництво або якою буде доля регіону після завершення його тривалих переговорів із Республікою."

