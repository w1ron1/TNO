#Національні духи
ADL_unscathed_now:0 "Поки що неушкоджені"
ADL_unscathed_now_desc:0 "За винятком періодичних авіанальотів, Андалусія зазнала незначних руйнувань завдяки своєму розташуванню далеко від лінії фронту. Завдяки практично неушкодженій промисловості вона може швидко мобілізувати економіку для війни, якщо це буде необхідно.\n\nОднак, попри відносну безпеку Південної Іспанії, над урядом і народом нависає відчуття тривоги, що не зникає. Якщо на фронтах станеться великий прорив, може бути лише питанням часу, коли війна прийде до Андалусії."

ADL_pacifism_outburst:0 "Спалах пацифізму"
ADL_pacifism_outburst_desc:0 "Багаті на людські ресурси й торгівлю, андалусці ніколи не були войовничим народом, а після громадянської війни, яка ледве зникла з поля зору, підтримка мобілізації залишається на найнижчому рівні. Коли мир є можливістю, жоден андалусець не бажає знову пережити трагедії, через які вони пройшли лише покоління тому. Так ізоляція стає поширеним настроєм.\n\nТа вороги Іспанської Республіки й далі бачать в Андалусії лише болонку, яку необхідно знищити, попри бажання андалусців не втручатися в північні справи після численних неприємних зіткнень. Щоб зберегти хоч якусь надію на подальший суверенітет, народ мусить пережити ще одне випробування — війну, яка покладе край усім братовбивчим війнам."

 #Дерево
 ADL_enough_already:0 "Досить уже"
 ADL_enough_already_desc:0 "Ця нова громадянська війна в Іспанії безжально триває вже кілька місяців, і ми багато крові пролили заради Республіки. Що ми отримали натомість, окрім порожніх обіцянок та експлуатації?\n\nТепер цьому кінець. Андалусія буде вільною, а свобода Республіки виявилася ненабагато кращою за свободу Каудильйо. Тож нашим єдиним виходом буде створити власну свободу та гарантувати, що наш голос буде почуто."
 ADL_enough_already_tt:0 "§G¡Andaluces, levantaos! ¡Pedid tierra y libertad!§!"

 ADL_restart_the_country:0 "Перезапустити державу"
 ADL_restart_the_country_desc:0 "Передбачувано, багато людей, які входили до попередньої адміністрації Андалусії від імені Республіки, продовжують підтримувати Республіку. Вони масово залишають свої посади, залишаючи великі прогалини в нашому уряді, що може поставити під загрозу нашу здатність функціонувати.\n\nМи присвятимо час і ресурси докорінній перебудові нашої адміністрації, усуваючи стару неефективність і набираючи нових, лояльних державних службовців. Доклавши певних зусиль, ми зможемо перетворити цю проблему на чудову можливість."

 ADL_create_cama:0 "Створити КАМА"
 ADL_create_cama_desc:0 "Після створення нашої нової Республіки ми маємо забезпечити можливість захистити наші кордони від тих, хто спробує відібрати нашу молоду державу. Залишки наших сухопутних сил недостатні для протистояння будь-якому серйозному нападу.\n\nТому ми створимо морське крило наших збройних сил — Cuerpos Auxiliares de Mar — та військово-повітряні сили — Cuerpos Auxiliares del Aire. Разом наші Cuerpos Auxiliares de Mar y Aire зможуть захистити Андалусію, звідки б не з'явилися наші вороги."

 ADL_defend_the_beaches:0 "Захистити узбережжя"
 ADL_defend_the_beaches_desc:0 "Наразі війна, що вирує на всьому півострові, змушує сторони вести виснажливу сухопутну війну. Це означає, що морські бої трапляються рідко через високу вартість бойових кораблів.\n\nОднак ця війна не триватиме вічно. Коли війна закінчиться і переможець зверне увагу на нас, ми маємо враховувати можливість нападу з моря так само, як і з суходолу. Ми створимо низку оборонних споруд, на які наткнеться будь-який морський десант, із жахливими для нього наслідками."

 ADL_swat_those_pesky_planes:0 "Пильнувати небо"
 ADL_swat_those_pesky_planes_desc:0 "Ми не хочемо мати жодного стосунку до цієї війни, але тим, хто воює, начхати на наш нейтралітет. Зокрема, вороги Республіки відмовляються визнавати наше нове становище й час від часу продовжують атакувати нашу територію.\n\nМи інвестуємо в додаткові зенітні установки, щоб гарантувати безпеку наших міст і переконатися, що будь-яким літакам, які атакують нас, буде роз'яснено наше нейтральне становище з максимальною переконливістю."

 ADL_expand_the_ports:0 "Кораблі в портах"
 ADL_expand_the_ports_desc:0 "Ми, можливо, не створюємо величезний флот, однак нам усе ще потрібно відновити втрати нашого торгового флоту та забезпечити можливість обслуговувати наш флот. Зрештою, порти будуть життєво важливими для нашого військового та економічного процвітання в майбутньому. Тому ми виділимо кошти на розширення портів у Кадісі, Севільї та Малазі."
 
 ADL_pump_up_naval_production:0 "Люди на верфях"
 ADL_pump_up_naval_production_desc:0 "Наш нинішній флот, якщо не підбирати кращого слова, недостатній. На щастя, ми маємо одні з найкращих портів на півдні Іберійського півострова. Настав час використати їх для збільшення нашого військово-морського виробництва, щоб ця наша нова республіка могла торгувати як забажає та захищати свої береги."

 ADL_andalusians_in_the_sky:0 "Андалусці в небі"
 ADL_andalusians_in_the_sky_desc:0 "Скільки б зенітних гармат ми не спрямували на північ, неминуче знайдуться літаки, яким вдасться прослизнути крізь наш щит. Щоб уникнути будь-яких трагедій, ми зосередимося на підготовці ядра бойових льотчиків, здатних захищати наше небо. Те, чого їм бракуватиме в чисельності, вони компенсують андалуською майстерністю."

 ADL_from_renfe_to_raf:0 "Постійний перехід"
 ADL_from_renfe_to_raf_desc:0 "Тепер, коли Республіка більше не займає наші землі, ми повинні звернути увагу на покращення нашої інфраструктури. Наша залізнична інфраструктура гостро потребує реорганізації та інвестицій, тому ми створимо «Red Andaluza de Ferrocarriles» — державну компанію, яка забезпечить нам необхідний нагляд. Зосередивши всю нашу мережу під управлінням RAF, ми зможемо ще більше модернізувати нашу молоду країну."

 ADL_create_the_andalusian_bank:0 "Серце нової економіки"
 ADL_create_the_andalusian_bank_desc:0 "Неминуче наше відокремлення від Іспанії спричинило значні фінансові потрясіння як для уряду, так і для наших громадян. Тому ми створимо новий центральний банк Андалусії, щоб почати стабілізувати нашу економіку та якнайшвидше розпочати відновлення."

 ADL_draft_a_constitution:0 "Розробити конституцію"
 ADL_draft_a_constitution_desc:0 "Досі є ті, хто ставить під сумнів легітимність нашої нової держави, тому ми почнемо розробляти нову тимчасову конституцію Андалусії, підкреслюючи як наше право на суверенітет, так і права андалусців. Однак наразі ми створимо більш упорядкований і простий документ.\n\nПро більш всеосяжну Конституцію ми зможемо потурбуватися, коли хаос на півострові почне вщухати."

 ADL_provisional_town_halls:0 "Тимчасове представництво"
 ADL_provisional_town_halls_desc:0 "Проста реальність нашого становища полягає в тому, що вибори неможливі доти, доки внутрішня ситуація та ситуація в Іберії не стабілізується. Однак багато міст по всій Андалусії досі керуються відповідно до законів старої Республіки. Тому ми почнемо замінювати чинних республіканських мерів, радників та всіх тих, хто прагнув би завдати шкоди нашій молодій державі, до проведення виборів.\n\nЦі нові тимчасові місцеві керівники забезпечать нам основу для подальшого розвитку."

 ADL_militant_democracy:0 "Войовнича демократія"
 ADL_militant_democracy_desc:0 "Уся Іберія роками потерпала від тих, хто виступав проти волі народу, і прикро, що деякі люди піддалися впливу такого самодержавства. Навіть тепер, після кровопролиття громадянської війни та нашого відокремлення від Іспанії, є ті, хто виступає проти нашої нової держави та її демократії.\n\nЩоб протистояти цьому, ми повинні дати народу зрозуміти, що саме він є першою лінією оборони проти антидемократичних підривників. Ми проведемо кампанію, закликаючи наших людей завжди бути пильними щодо тих, хто прагне підірвати нашу державу."

 ADL_accomodate_everyone:0 "Знайти місце для всіх"
 ADL_accomodate_everyone_desc:0 "Роками Іберія перебувала в лещатах авторитарів і тих, хто більше цінував владу, ніж людяність. Республіка починалася з благородних ідей, але виявилася ненабагато кращою за тих, хто був до неї. Тепер факел свободи передано нам.\n\nМи повинні зробити так, щоб стати маяком світла, якого наш народ завжди прагнув. В Андалусії раді всім, ми лише просимо їх приєднатися до нас у відданості демократії. Натомість ми створимо державу, де голос кожного андалусця буде почуто."

 ADL_this_is_not_our_war:0 "Це не наша війна"
 ADL_this_is_not_our_war_desc:0 "Багато хто в нашій молодій державі досі не впевнений, якою є наша позиція щодо війни, що охопила півострів. Цій плутанині не сприяє розгортання наших нових збройних сил, через що дехто припускає, що ми готуємося знову вступити у війну.\n\nМи профінансуємо кампанію, яка абсолютно чітко дасть зрозуміти по всій країні: Іспанська війна — не наша війна, і більше жодна андалуська кров не проллється ні за що, крім самої Андалусії."

 ADL_create_faa:0 "Створити FAA"
 ADL_create_faa_desc:0 "Попри наше небажання втручатися в хаос Іспанської війни, було б нерозумно залишатися беззахисними. Зрештою, ми не можемо бути впевнені, що ті, хто бере участь у війні, не мають планів щодо нашої нової держави.\n\nМи реорганізуємо нашу армію в Fuerzas de Autodefensa Andaluzas. Щоб не провокувати наших сусідів, ми зосередимося на оборонній доктрині. Це також дозволить нам гарантувати, що будь-хто, хто спробує відібрати нашу свободу, заплатить високу ціну."

 ADL_not_a_step_forwards:0 "Ні кроку вперед..."
 ADL_not_a_step_forwards_desc:0 "Зрештою здобувши свободу для себе, ми не зацікавлені в підкоренні когось іншого на цьому півострові. Андалуська кров більше не проливатиметься на чужих полях. Наша армія наслідуватиме цей принцип, з новою доктриною, яка надаватиме пріоритет дисципліні та злагодженості перед обличчям агресора, а не агресії."

 ADL_nor_backwards:0 "...ані кроку назад"
 ADL_nor_backwards_desc:0 "Хоча ми не маємо власних імперіалістичних планів, було б нерозумно припускати, що інші думають так само. Наші війська навчатимуться переважно оборонній тактиці та швидкому переміщенню до ослаблених ділянок для посилення оборони, з метою перетворити їх на стіну з людей, стійкішу за будь-яку кам'яну чи металеву перешкоду.\n\nМаючи найпотужнішу оборонну силу на півострові, ми не дамо далеко просунутися жодному агресорові, якщо він знову спробує нас підкорити."

 ADL_recruitment_propaganda:0 "Лише найхоробріші чоловіки..."
 ADL_recruitment_propaganda_desc:0 "Спадщина Іспанської війни та її вимоги щодо призову призвели до того, що багато наших громадян із побоюванням ставляться до вступу до наших нових збройних сил. Однак, хоч ми й не хочемо утримувати велику наступальну армію, навіть нашим оборонним силам потрібні люди.\n\nОскільки повернення до призову було б цілком неприйнятним для нашого народу, ми вкладемо кошти в нову кампанію з набору андалуських добровольців. Наші збройні сили складатимуться лише з тих, хто щиро любить Андалусію та все, за що ми виступаємо."

 ADL_equipment_quality_checks:0 "Лише найкраща зброя..."
 ADL_equipment_quality_checks_desc:0 "Безсумнівно, ми не маємо таких самих промислових можливостей, як більшість інших держав Європи, що є прикрим фактом з огляду як на наш невеликий розмір, так і на молодість нашої держави. Тому, щоб забезпечити належне оснащення наших солдатів, ми повинні гарантувати якомога меншу кількість дефектів в отриманому ними спорядженні. Це має значно зменшити навантаження армії на нашу молоду промисловість, а також втрати під час звичайного технічного обслуговування, дозволивши спрямувати дорогоцінний час і ресурси на інші проєкти."
 
 ADL_we_are_in_dispersive_ground:0 "...Лише за найсправедливішу справу"
 ADL_we_are_in_dispersive_ground_desc:0 "Хоча ми є молодою державою з великими перспективами, ми не можемо забувати про те, що ми малі. Кожна зруйнована будівля та кожна втрачена ділянка землі завдадуть нам болючого удару. Кожен крок назад позбавляє нас дедалі більшої кількості засобів для того, щоб утримуватися.\n\nОднак ми воюємо на власній території. Ми знаємо цю землю. Ми вживатимемо заходів, щоб наші оборонні позиції були міцними, водночас мінімізуючи руйнування, яких будь-який конфлікт завдасть нашій землі."

 # Події 
 ADL_wars.1.t:0 "Диктатор"
 ADL_wars.1.d:0 "Вулиці Севільї палали від вигуків і пісень, коли тисячі людей рушили до мерії. Чоловіки й жінки з усіх верств суспільства, деякі навіть у мундирах республіканської армії чи фабричних робочих халатах. Усі вони йшли маршем, здіймаючи кулаки та голоси, що відлунювали від лабіринту цегляних будівель, між якими вони проходили.\n\n«Влада народу!» — скандували вони. «Більше жодної змарнованої андалуської крові!» — кричали вони.\n\nАлехандро Рохас-Маркос почув їх, попри великий натовп, що зібрався перед його помостом біля мерії. Він усміхнувся — він багато разів бачив цей день у своїх снах протягом останніх років. Він та інші, які мали виступати, спостерігали, як натовпи демонстрантів заповнювали площу, аж поки зрештою учасникам маршу не довелося залишитися на вулицях. Здавалося, прийшла вся Севілья.\n\nАлехандро підвівся та підійшов до підготовленої трибуни, коли вигуки й шум натовпу стихли, залишивши моторошну тишу. Він на мить закарбував у пам'яті образ андалуської солідарності перед собою, а потім підняв руки.\n\n«Друзі, ми всі принесли жертви. Республіка обіцяла нам свободу, але дала нам лише брехню. Вони намагалися залишити нас слугами, поки ми працювали й проливали кров заради не більшого, ніж нового диктатора».\n\nВін замовк, віддаючи хвилину роздумам про тих, кого вони втратили. Він жестом указав на інших на помості.\n\n«Ми почули вас і більше нічого не скажемо. Якщо Республіка хоче вимагати від нас більшого, їй доведеться робити це як рівній андалуській державі!»"
 ADL_wars.1.a:0 "Оплески й вигуки оглушили дітей."

 ADL_wars.2.t:0 "Якби ми тільки могли поговорити"
 ADL_wars.2.d:0 "Я бачив, як проходило багато людей, і, хоч я відчуваю свій вік, я досі спостерігаю за ними.\n\nІноді вони бувають злими й у розпачі проклинають мене. Можливо, вони не замислюються і залишають біля моїх ніг їжу, напої чи бозна-що, забруднюючи мене. Але іноді я бачу їх щасливими: вони обіймають кохану людину, яка входить у їхній світ, або зі сльозами прощаються, коли вона йде. За людьми так цікаво спостерігати.\n\nВони також сильно змінюються. Коли я народився, світ був набагато повільнішим. Я майже ніколи не чув інших мов і не бачив, щоб хтось одягався інакше. Можливо, справа була в усьому тому диму — паровози, які весь час проходили повз, іноді заважали щось розгледіти. Лише зрідка з'являлися автомобілі, а гуркіт натовпу заглушував мене.\n\nПізніше, я пам'ятаю, почалися проблеми. Я пам'ятаю, як крізь мене постійно проходили чоловіки зі зброєю. Я пам'ятаю, як з часом вони ставали такими сумними, аж поки зрештою не прибули чоловіки в новій формі, із суворими обличчями. Старих солдатів я більше не бачив.\n\nЯкийсь час усе здавалося таким, як раніше: я не бачив нікого нового, і мало хто новий, здавалося, приходив. Однак кількість автомобілів почала зростати, а гуркіт натовпу змінився гуркотом транспорту неподалік. Почав змінюватися навіть їхній стиль, поступово стаючи значно витонченішим порівняно зі старими коробками, які я пам'ятав. Останнім часом я навіть чув набагато більше мов і бачив багато дивного одягу. Сонцезахисні окуляри й шорти, міні-спідниці та фотоапарати. Світ, у якому я народився, здавався таким далеким.\n\nАле тепер вони знову пішли. Солдати знову прийшли й пішли, а тепер їх замінює ще одна нова форма. Щодня я тепер думаю: хто наступним скористається потягом?"
 ADL_wars.2.a:0 "Про людство спостерігає залізничний вокзал Севілья-Сан-Бернардо."
 
 ADL_wars.3.t:0 "Мрія здійснилася"
 ADL_wars.3.d:0 "У новій державі все ще залишалися противники Андалусії. «Це штучна держава, не більше ніж перебільшена місцева культура», — нарікали вони, а їхні очі були сповнені спогадів про Іспанію. «Не існує жодної Андалусії, є лише Іспанія», — заявляли вони всім, хто був готовий їх слухати.\n\nЧасто ці заяви лунали з вуличних трибун, на засіданнях місцевих органів влади або в тавернах по всій країні, коли їхні промовці були добряче напідпитку від місцевих напоїв. Їх ставало лише більше в міру того, як поширювалися новини про Конституційний конвент в Антекері. Дехто сприймав цю зміну з певною розвагою: колись саме андалуські націоналісти займали такі місця, зазвичай після чого Цивільна гвардія відвозила їх на ніч до камери.\n\nЯк і раніше, люди вступали з ними в суперечки. У тавернах це майже стало популярною розвагою в найбільш політично розділених районах — спостерігати за п'яними суперечками про реальність Андалусії. Яскраві перекази Федеральної конституції 1883 року, яка обіцяла визнання їхньої ідентичності, або мученицька смерть Бласа Інфанте та його збереження їхньої культури — усе це лунало у відповідь на зневагу іспанців.\n\nДехто ставив під сумнів правдивість деяких із цих історій. Почути про Конституцію 1883 року тепер означало почути історію придушеного народного визволення, правдивість окремих деталей якого дехто ставив під сумнів, але для багатьох це вже не мало значення.\n\nВони були вільні, їхні сини й доньки більше не гинули на невідомих полях. З Антекери надійшла заява, що проголошувала нові цінності андалуської держави. Вони могли дозволити собі трохи фантазії."
 ADL_wars.3.a:0 "Андалусія стала одночасно і мрією, і реальністю."

 ADL_wars.4.t:0 "Підняти прапори"
 ADL_wars.4.d:0 "Попередні тижні були сповнені хвилювання, але для Луїса Урунели кульмінація була вже близько.\n\nДеякий час тому йому запропонували стати тимчасовим мером Севільї — посадою, яка мала значну вагу для цього активіста. Його репутація об'єднувача йшла попереду нього. У минулі роки він був лідером місцевих лівих рухів, одним із небагатьох, кому вдалося здобути повагу як найбільш поміркованого соціал-демократа, так і найбільш затятого комуніста. В останні дні існування Іберії, коли доля франкістів уже була очевидною, саме він заснував Соціалістичну партію Андалусії, якій вдалося об'єднати колись розрізнені соціалістичні сили. Після служби Республіці, у міру того як війна затягувалася, він дедалі голосніше виступав за відокремлення Андалусії, і багато хто його слухав.\n\nВін знав Алехандро Рохаса-Маркоса багато років, будучи його соратником у боротьбі проти франкістів, але все одно був зворушений, коли йому запропонували таку посаду.\n\n«Севільї в ці перші дні потрібен хтось, хто зможе її об'єднати, — сказав йому Алехандро, коли попросив Луїса очолити новий регіональний уряд, — хтось, хто зможе зробити її прикладом для всієї Андалусії». Що стосується Луїса, то якщо його навички могли допомогти його товаришам, він був радий послужити.\n\nСправ було багато. Необхідно було організувати нові вибори, спланувати розподіл виборчих округів і безпечний підрахунок голосів. Скасування воєнних правил, не кажучи вже про нову оцінку стану місцевої економіки. Однак на початку цієї першої сесії Луїс дозволив собі просто замислитися над символом, свідком якого він став. Уся Рада зібралася подивитися, як іспанський прапор, що висів на балконі мерії, знімають. На його місці з'явилися зелений і білий кольори Андалусії."
 ADL_wars.4.a:0 "Новий символ для робітника."
