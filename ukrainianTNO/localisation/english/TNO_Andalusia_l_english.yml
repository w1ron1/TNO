#Міністри
ADL_Alejandro_Rojas_Marcos:0 "Алехандро Рохас-Маркос"
ADL_Alejandro_Rojas_Marcos_hog_desc:0 "§YВіцепрезидент\nСоціал-демократія§!\n--------------\n§LАлехандро Рохас-Маркос уже тривалий час є членом іберійської опозиції. Він розпочав свою опозиційну діяльність як правий монархіст, але зрештою перейшов на політичні ліві позиції. Після кількох невдалих спроб він заснував і очолив Політичний компроміс Андалусії — андалуську регіоналістську опозиційну групу.\n\nЯк один із небагатьох лідерів організованої опозиції в Андалусії, він був обраний віцепрезидентом Ради. Його історія підтримки андалуського регіоналізму також зробила його вправним у мобілізації населення на підтримку нового уряду. Порівняно з Пласідо він є більш непримиренним і хоче, щоб після війни Андалусія отримала більше прав і ресурсів, і не прийме від Республіки відповіді «ні».§!"

ADL_Eugenio_Ales:0 "Еухеніо Алес Перес"
ADL_Eugenio_Ales_for_desc:0 "§YМіністр закордонних справ\nЛіберальна демократія§!\n--------------\n§LЕухеніо Алес Перес був членом провінційної ради Севільї до того, як Андалусія відокремилася від Республіки, а тепер він обіймає посаду радника із закордонних справ у новому уряді. На його плечі лягає робота з Республікою та проведення переговорів щодо майбутньої долі Андалусії після завершення війни. Його завдання — забезпечити, щоб народ Андалусії знову відчував, що його уряд належним чином його представляє.\n\nОднак Алес веде переговори не лише з Республікою та підтримує контакти з іншими регіональними угрупованнями, оскільки вони визнали Андалусію окремим урядом. Проте ці переговори були складними, оскільки їх постійно підривало те, що інші регіоналістські уряди не вважають Андалусію рівною через її небажання по-справжньому проголосити незалежність. Попри це, Алес працює над підтриманням добрих відносин заради майбутнього Андалусії.§!"

ADL_Tomas_Garcia:0 "Томас Гарсія Гарсія"
ADL_Tomas_Garcia_eco_desc:0 "§YМіністр економіки\nКомунізм§!\n--------------\n§LЗдобувши юридичну освіту в університетах Гранади та Мадрида, Томас Гарсія Гарсія з 1933 року має досвід роботи на державній службі. Він також був членом Комуністичної партії з 1931 року та очолював економічну комісію партії з питань досліджень. Після участі в обороні Каталонії Гарсія був змушений піти у вигнання. Він таємно повернувся до Іберії після проголошення Республіки, ставши членом Міжпровінційної ради до відокремлення Андалусії.\n\nТепер Гарсія працює над планом всеосяжної земельної реформи в Андалусії. Він прагне, щоб цей план був включений до переговорів між Андалусією та Республікою, аби після возз'єднання уряд Іспанії не скасував результати роботи Гарсії.§!"

ADL_Carlos_Navarrete:0 "Карлос Наваррете Меріно"
ADL_Carlos_Navarrete_sec_desc:0 "§YМіністр оборони\nСоціал-демократія§!\n--------------\n§LКарлос Мануель Наваррете Меріно був членом провінційної ради Уельви від моменту заснування Республікою війни проти Хунти. Як і багато інших, він бачив, як наступ Республіки зупинився, і відчував, як тягар війни лягає на плечі Андалусії. Коли до нього звернулися однодумці-політики, Наваррете приєднався до нового уряду Андалусії як його радник з питань оборони.\n\nНе маючи військового досвіду, а оскільки потреби в чомусь більшому за сили самооборони не було, він залишає безпосереднє ведення військових справ військовим офіцерам, які стали на бік Андалусії. Натомість Наваррете використовує свій досвід адвоката з трудового права, щоб документувати зловживання, яких зазнали андалуські солдати під час служби в Республіці, для представлення їх під час переговорів. Якщо Андалусія мала мирно возз'єднатися, кожен андалуський солдат, який воював за Республіку, мав отримати повну компенсацію.§!"

