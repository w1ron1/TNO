 ### Ideas ###
 CAM_Dictatorial_Devaraja: "Девараджа-диктатор"
 CAM_Dictatorial_Devaraja_desc: "§D"Без вагань би я сам узяв на себе ініціятиву й пожертвував нею, аби направити націю іншими шляхами, допомогти їй здійснити мирно, без кровопролиття - революцію, яку вона обрала."§!\n§Y- Нородом Сіанук, 1962§!\n\nНаївний виученик буддизму помилково розумітиме Царственність або Девараджу, як посвячення в абсолютну монархію за природного порядку. Праведний вихованець Девараджі діє, як провідник догматів Будди. Династія Нородом, а зокрема король Сіанук, сприймала Девараджу за належне: вважаючи, що їхня політична легітимність вічна, вони бісилися з жиру - допоки їхні піддані страждали.\n\nОсь чому, коли Сон Нґок Тганг зобов'язався позбавити королівську сім'ю влади, його народна підтримка досягла небачених жодним монархом висот. Сьогодні Тганг звертається за силою й філософією до історичної постаті Неай Кана - хороброго воїна, що скинув корумпованого та нечестивого короля, для відновлення порядку на своїй землі. Для Тганга, Кан є тим, хто уособлює Девараджу."
 CAM_The_Unloving_Father: "Нелюблячий батько"
 CAM_The_Unloving_Father_desc: "§D"Немало тайців воювали в складі Кхмер Серай, допомагаючи Кампучії позбутися гніту Франції. Проте навіть якщо вони були тайцями, хорошими кампучійцями їм також вдавалося бути. Кампучію вони любили більше, ніж самі кампучіійці."§!\n§Y- Самніант Кгантгачавана, 1970§!\n\nРеспубліка Кампучія не з'явилася сама по собі. Вона створена своїм батьком - Республікою Таїланд, що стала й зразком для наслідування. Відносини ці несуть в собі не опіку й лестощі, а ножі, від яких молодша Республіка мусить ухилятися.\n\nТрагедія від втрати двох регіонів після війни, Баттамбанґ і Сіемрієп, та практично повна ліквідація існування кампучійської держави в 1949 році, під час Операції Іссара - залишили її заручницею хотінь Банґкока. Уряд Таїланду, на щастя, не надто піклується про кхмерів, поки що залишаючи їх напризволяще."
 CAM_The_North_South_Axis: "Ось Північ-Південь"
 CAM_The_North_South_Axis_desc: "§D"Кампучійська раса - шляхетного походження. Коли йдеться про боротьбу з ворогом, або про порятунок своїх вірувань, чи про визволення своєї батьківщини - вона не лякається смерті. Уся нація слідує буддистському вченню, що підносить смерть вище рабства й релігійних переслідувань."§!\n§Y- Сон Нґок Мін, 1951§!\n\nОсь Північ-Південь є визначенням у народі напруженості в відносинах між різними політичними фракціями Пномпеня й урядом. Ліворуч - молодь галасує про території, відірвані Таїландом від Кампучії, вимагаючи їх повернення своїм пронизливим криком.\n\nПраворуч - рух "Нижня Кампучія", безформне кубло та дітище генерала Лон Нола. Вони виступають за розширення прав кхмерів, які живуть вздовж гирла Меконгу на півдні В'єтнаму, тобто за ультранаціоналістичне повернення до панування кампучійців у регіоні часів 18-го століття. Президенту щастить, що всі ці погляди є гіпобіозними течіями в кхмерській політиці, якщо вони колись і зможуть відродитися за сприятливих обставин і з часом."
 CAM_The_Five_Year_Plan: "П'ятирічний план"
 CAM_The_Five_Year_Plan_desc: "§D"Якщо з будівлі впало каміння,\nМосьє наказує поставити його на попереднє місце.\nМосьє Коммайль, із Франції,\nБере цемент і розмазує його, як на папері, задля укріплення будівлі.\nДе мох заростає настільки густо, що він затуляє огляд,\nМосьє наказує вимести його дочиста."\n§!§Y- Окня Суттантапрія, 1909§!\n\nАю Кеус і Сон Санн отримали повноваження перед президентом і народом, а їхнім наріжним каменем став П'ятирічний план. Перший у своєму роді в Кампучії, його цілями є: повна аграрна реформа, перерозподіл землі, та механізована легка промисловість в Кампоті й Такео - двох провінціях, що мають слугувати взірцем для решти країни.\n\nАби втілити цей план у життя, обидва їм щедро допомагали отримані від японців фінансові, управлінські та технічні навички, які є надзвичайно цінними в умовах бурхливого економічного циклу."
 CAM_Jewel_Of_The_Republic: "Діамант Республіки"
 CAM_Jewel_Of_The_Republic_desc: "§D"Від міста до усіх провінцій.\nЧерез кожен потік і струмок прокладено міст,\nМалі й великі, сотні й тисячі мостів,\nСтійкі, як та брила, машини гудять понад ними\nТисячі слонів можуть топтатися над ними,\nНіколи вони не зламаються."§!\n§Y- Окна Санн, 1928§!\n\nПномпень - ще один французький колоніяльний експеримент, який утілив їхні модерністські та авангардно-експресіоністські вподобання й став випробувальним полем для того, що ж найкраще підійде вже їхнім містам. Відтоді французів випровадили додому, і тепер прапори Японії та Республіки рясним сплеском прикрашають його круговид - поновлюючи його, як один із головних діамантів Азії.\n\nМісто є економічним центром Південно-Східної Азії, приваблюючи сюди туристів, азартні ігри, проституцію й багато чого іншого в показі всього того, що стало сучасним. Паралельно з цим розвитком, у Пномпені також присутня про-тгангістська інтелігенція та молодіжні гуртки, які ставляться до цих проявів із огидою, висловлюючи рішення для викорінення цих спотворень теперішньості в усе більш радикальних тонах."
 CAM_Spilling_The_Masters_Tea: "Проливаючи панський чай"
 CAM_Spilling_The_Masters_Tea_desc: "§D"В'єтнамці закопували кхмерів по шию, і їхні тім'я слугували підставками для вогнища, на які потім ставили кип'ятитися воду для чаю їхнього пана. Жертви хитали головами, страждаючи від опіків унаслідок полум'я. Тоді в'єтнамські катівники казали їм "Обережніше, не пролийте панський чай!"§!\n§Y- Чорна книга, 1978§!\n\nУ Кампучії існує істотне занепокоєння щодо в'єтнамської меншини. Нехай уряд може прикриватися шовінізмом та етнічним націоналізмом - та він зберігає чутливий підхід до кхмерсько-в'єтнамських відносин і приязну атмосферу з урядом Хюе.\n\nОдначе, сьогоднішній уряд повинен обережно переходити мінне поле вчорашніх острахів. Якщо президент сприйматиметься кхмерами, як відсторонений чи нездатний домогтися від в'єтнамських партнерів того, що вони визнають справедливим врегулюванням - ці острахи наберуть всмерть небезпечних масштабів."
 CAM_The_Veal_Thom_War: "Війна Веал Тгом"
 CAM_The_Veal_Thom_War_desc: "На північному кордоні, між Кампучією й Лаосом, є помилка. Принц Нородом Чантараїнґсей, чиї зв'язки з Токіо були вирішальними для успіху сільської реформи Кеуса, повів 12 тисяч солдатів до Стунґ Тренґу, аби захопити цю провінцію в Лаосу. За цим здійнялася веремія: японський капітал утік, утвердилася силою в регіоні Індокитайська комуністична партія, а лаоські війська мобілізувалися разом із розбійниками Дап Чгуона.\n\nСитуація, що склалася, перетворюється в дипломатичне страхіття для Пномпеня."
 CAM_A_Confused_Revolution: "Збентежена революція"
 CAM_A_Confused_Revolution_desc: "Ідеологічне підґрунтя за новоствореною революцією в Кампучії є... у кращому випадку хитким. Хай Сон Нґок Мін і його верхівка можуть бути твердо й чітко віддані комунізму, революційні принципи при меншому рангові падають все нижче.\n\nЗамість того, аби бути аванґардом робітничого класу, Комуністична партія Кампучії є "великим шатром" патріотичних і прогресивних індивідів усередині нації, що налаштовані проти Японії. Незалежності, для більшості з них - достатньо, а питання щодо вирішення проблеми з капіталізмом залишається невизначеним, оскільки дебати про те, потрібен він чи ні, тривають через дещо відстале положення Кампучії."
 CAM_The_Squabbling_Brothers: "Сварливі брати"
 CAM_The_Squabbling_Brothers_desc: "Офіційно, Кампучія й В'єтнам відтепер є братськими народами, об'єднаними вогнем соціялістичної революції. Насправді відносини між ними - набагато складніші.\n\nШовіністичне ставлення до в'єтнамців нікуди не поділося, і багато хто з них ще більше розлютився на свого так званого "визволителя". Почуття ці лишень посилюються чутками щодо того, як в'єтнамці використовують своє вторгнення задля змінення кордонів на свій розсуд, захопивши села, за які вони раніше сперечалися з Кампучією. Вщухне чи посилиться ця зневага? Час покаже."
 CAM_Traditional_Devaraja: "Сакраментальний Девараджа"
 CAM_Traditional_Devaraja_desc: "Ідея Девараджі повернулася з міфів і легенд про Неай Кана, назад до усталених уявлень щодо монархії. Неважливо те, що сам Сіанук відкидає королівські атрибути, із якми й бачать його деякі з прихильників: для багатьох у Кампучії, Сіанук - їхній монарх. Це призвело до цікавої динаміки: інтелігенція Пномпеня розглядає його, як свого президента - а селянство вшановує його, як свого короля."
 CAM_Devaraja_Chained: "Ув'язнений Девараджа"
 CAM_Devaraja_Chained_desc: "Президент Сон Нґок Тганг став занадто великим клопотом для Японії та власного уряду, що змушує прибігти до радикальних заходів. Колись великий боєць, наразі перебуває під домашнім арештом, оскільки уряд Кампучії керується набагато більш поміркованою особистістю, використовуючи президента в якості інструмента своєї потуги, час від часу виводячи його на публіку, як доповнення й прикрасу їхньої влади.\n\nВін залишатиметься в цьому становищі, доки не помре, після чого хтось - більш гідний цього, перейме цю посаду, аби досягти успіху там, де він зазнав невдачі."
 CAM_Dictatorial_Devaraja_Lon_Nol: "Девараджа-диктатор"
 CAM_Dictatorial_Devaraja_Lon_Nol_desc: "Як старий Неай Кан у минулому, історія повторює сама себе, коли Сіанука скинув Сон Нґок Тганг. Але це сталося знову, коли Лон Нол сам скинув президента Сон Нґок Тганга після того, як той не зміг уберегти національну гордість кхмерського народу. Самопроголошений маршал розгулює в військовому вбранні, виголошуючи грандіозні заяви про те, що він є захисником усіх кхмерів. Та належить ще з'ясувати, чи відповідає він статусу Неай Кана."
 CAM_Dictatorial_Devaraja_Lon_Non: "Девараджа-диктатор"
 CAM_Dictatorial_Devaraja_Lon_Non_desc: "І знову, історія повторює сама себе: Лон Нон захопив владу в свого брата. Переворот цей, однак, був здійснений не внаслідок любові до народу - але любові до влади. Тайці дали Лон Нону можливість взяти те, чого він прагнув - і він із радістю її прийняв.\n\nМир його метою не був - лише стороннім впливом жадоби до влади. Але прихильників Лол Нона це задовольняло. Доки він буде здатним задовольняти кхмерів - правління його буде безпечним і надійним. За інакшого випадку Лол Нона спіткає та ж доля, що й його брата."
 CAM_Republican_Revolution: "Республіканська революція"
 CAM_Republican_Revolution_desc: "У Китаї республіканська модель виблискує з досконалістю - чудовий приклад того, як має функціонувати сучасне азійське суспільство. Кампучія, на жаль, успадкувала тайський, імперіалістичний спосіб правління, що завдало їй великої шкоди. Із республіканською революцією Ху Німа це зведеться нанівець.\n\nРеспубліканська молодь наслідуватиме приклад революції Ван Цзінвея, навчаючись на тому, як він поклав на лопатки англійський імперіалізм у Азії. Світло його сяятиме в Кампучії доти, доки триває революція - воно спрямовуватиме їх до політичного стандарту, і просвітлюватиме шляхами того, як їхня нація опиниться в двадцятому столітті."
 CAM_Bubbling_Northern_Tensions: "Закипаюче напруження на півночі"
 CAM_Bubbling_Northern_Tensions_desc: "Раніше вимоги повернення територій, загарбаних Таїландом у Кампучії, супроводжувалися лише зойками та криками кількох наполегливих парубків у Пномпені. Зараз ці молодики керують Кампучією, і їхні голоси тепер на загальнонаціональному рівні. Більше не розділені заздалегідь марною справою "Нижньої Кампучії", вони зосередили свою увагу на тайських імперіалістах, яким більше не коритимуться.\n\nНевдовзі відбудеться розплата, яка вирішить це питання одвіки й навік…"
 CAM_New_Kampuchean_Revolution: "Нова кампучійська революція"
 CAM_New_Kampuchean_Revolution_desc: "Настав прекрасний і новий світанок для Кампучії, початок величного національного відродження. Занадто довго бачення президента Сон Нґок Тганга щодо майбутнього, було обезславлене марним компромісом - пожертвою всього заради нічого. Із оголошенням воєнного стану це змінилося.\n\nУряд починає кхмеризацію економіки, тгангівським шляхом - або ж швидкісним шляхом. Опинилися під загрозою іноземні бізнеси, яким не пощастило не бути японськими - доки вони не виявлять в собі достатню лояльність до кхмерської нації. Це викликає занепокоєння сусідів Кампучії, що шукають спосіб вирішити цю проблему."
 CAM_The_Managerial_State: "Управлінська держава"
 CAM_The_Managerial_State_desc: "Відбудова Кампучії буде довгою й тяжкою, а без жодних важливих політиків, що залишилися на посту, Японії для стабілізації нації довелося обернути свою увагу до представників цивільної служби. Їхні повноваження були значним чином розширеними, і перед цими аполітичними чиновниками поставили задачу планування відновлення Кампучії.\n\nТак чи інакше, Японія стане новим управлінцем Кампучії, оскільки за відсутності будь-яких у наявності ресурсів, вони будуть змушені просити її про фінансову підтримку."
 CAM_The_Second_Five_Year_Plan: "Другий П'ятирічний план"
 CAM_The_Second_Five_Year_Plan_desc: "За керівництва прем'єр-міністра Пач Чгеуна та Сон Санна, новий П'ятирічний план був розроблений після успіху попереднього. Модель аграрної реформи, перерозподіл землі, та побудова механізованої легкої промисловості розширяться на провінції Кампонгспіу, Кандал, Прейвенґ і Свайрієнґ. У Кампучії проходить нова спроба модернізації, а Японія з щедрої руки позичить нам ресурси, що необхідні для втілення цього плану в реальність."
 CAM_The_Third_Five_Year_Plan: "Третій П'ятирічний план"
 CAM_The_Third_Five_Year_Plan_desc: "Новий П'ятирічний план був оформлений внаслідок усе зростаючого впливу лівих на політичне становище в Кампучії, і цей - найбільш амбіційний. Його творцями є Кгеу Сампган і А Січау: вони розширили пробний досвід шести провінцій у попередніх двох планах, на всю країну.\n\nБільше не буде нерівності, селяни володітимуть землею, яку вони взрощують, і кхмери будуть єдиними як ніколи. До тих пір через це доведеться платити за борги, знову позичені в Японії. Але скоро настане той день, коли Кампучія зможе стати на свої ноги, без будь-яких кайданів і зобов'язань."
 CAM_Expansionist_Pariah: "Вигнанець-загарбник"
 CAM_Expansionist_Pariah_desc: "Етнонаціоналістична та реваншистська риторика Лон Нола виявилася настільки обурливою, що справляє враження, буцімто бачення цієї теми в попереднього президента Сон Нґок Тганга було напрочуд поблажливим.\n\nВін знову вдаряє по болючому питанню, наполягаючи щодо "Нижньої Кампучії", цієї багатостраждальної частини країни, та нижніх кхмерів, що перебувають під гнітом в'єтнамських тиранів. Із Республіканською армією, що здійснює провокації на кордонах із В'єтнамом і Таїландом, сусіди Кампучії переконані - аби позбавити себе цього нюансу, щось проти них мусить бути вчинено."

# Opinion modifiers
 CAM_republican_rev: "Кхмерська республіканська революція"
 CAM_new_kampuchean_rev: "Нова кампучійська революція"

 ## Ministers ##
 CAM_Ieu_Koeus_hog_desc: "§YПрем'єр-міністр Республіки Кампучія\nЛівий корпоратизм§!\n--------------\n§LЯкщо Сон Нґок Тганг - це серце, то Аю Кеус - мозок. Вже перебуваючи шанованим політиком і лідером у Національній асамблеї за правління Сіанука, успішні переговори під час завершення "Іссари" підтвердили його репутацію старшого державника нової Кампучійської республіки. У певних колах - вищих і освічених, досвід Кеуса в управлінні приніс йому повагу більшу, ніж у самого Тганга.\n\nТепер у другому терміні на посаді, Кеус зайнятий принесенням процвітання для своєї країни. Поглинутий економічними й промисловими звітами, разом із кредитними виписками з японських та китайських банків, Кеус готує новий п'ятирічний економічний план для кампучійської нації.§!"
 CAM_Son_Sann_eco_desc: "§YМіністр фінансів\nКорпоратизм§!\n--------------\n§LКажуть, недивно, що Сон Санн знається на грошах - як син багатого землевласника, і з освітою в "Hautes Études Commerciales" у Парижі, він народився в достатку й виріс, аби розуміти його. Він виділився на посаді державного службовця в роки Іссари, і виправдав себе достатньо вартісним бюрократом, аби доєднатися до нового уряду в якості міністра фінансів.\n\nАле поза своєю фінансовою ойкуменою - він пов'язує Кампучію з Токіо. Це є його найбільшою силою для уряду Сон Нґок Тганга. Якби не його зв'язки, Кампучія не змогла б дозволити собі водночас покрити витрати на П'ятирічний план і загальне відновлення країни після Операції Іссара.§!"
 CAM_Achar_Sok_for_desc: "§YМіністр зовнішніх справ\nСоціял-націоналізм§!\n--------------\n§LДо 1947 року Ачар Сок був скромним монахом, що вивчав священну мову палі в Ват Уналом. Знаний своєю чуйністю до бідняцької скрути, він побачив у приході Сон Нґок Тганга до влади можливість для її спокутування. Сок проміняв свою касаю на костюм, і вступив до нової КНРА, ставши відповідальним за ліве крило "великого шатра" кабміну Тганга.\n\nНавіть обіймаючи посаду міністра закордонних справ, Сок продовжує надавати свої сили для перерозподілу багатства на користь бідних, використовуючи риторику, яка межує з соціялістичною. Якщо Японія занепокоєна цим, то вона, безсумнівно, з тривогою ставиться до його бачення зовнішньої політики, оскільки Сок відвертається від В'єтнаму й Таїланду, спрямовуючи свій погляд на Індонезію та Азад-Гінд.§!"
 CAM_Dap_Chhuon_sec_desc: "§YМіністр із питань національної безпеки\nВарлордизм§!\n--------------\n§LЄ дні в кабінеті міністрів Сон Нґок Тганга, коли місце міністра з питань національної безпеки залишається порожним. Той, кому належить це місце, перебуває в Сіемріепі, відпочиваючи на березі озера Тонлесап. Мабуть на краще, що це крісло порожніє - адже коли воно зайняте, за тією людиною слідує смерть.\n\nДап Чгуон зберігає свій воєнний псевдонім, бо жодне інше ім'я йому не пасує. Чуан Кгемпет - людини з цим іменем більше не існує, бо залишив він це ім'я в Французько-таїландській війні. А повернувся Дап Чгуон, що перетворився з лідера анти-французьких повстанців на мізерного воєначальника, правлячи на своєму кривавому троні. Незважаючи на нечасту його присутність та силу-силенну трупів, які залишаються після його роботи, Тганг вважає, що люди з подібною жорстокістю потрібні для забезпечення порядку.§!"

 ## Leader Descs ##
 POLITICS_SON_NGOC_THANH_DESC: "У 1949 році прем'єр-міністр Сон Нґок Тганг увійшов до Пномпеня, розтрощивши трон короля Сіанука, і проголосивши створення Республіки Кампучія. Такий результат став неминучим розв'язанням присутніх у ньому численних суперечностей: республіканець, що служив королю; кхмерський націоналіст, який отримав освіту в Франції; і сторонник японського правління, у королівстві збудованому французами. Він обійняв посаду міністра закордонних справ за згодою Токіо, використавши безмежне завзяття молодих радикалів, щоб забезпечити собі місце прем'єр-міністра, і скористався хаосом через Операцію Іссара, аби остаточно знищити династію Нородом.\n\n"Неай Кан сучасності" править, користуючись як широкою серед народу підтримкою, так і залізною хваткою, якою розправляється з усіма незгодними з його політикою. Маючи державу під своїм контролем, Тганг прагне нарощувати її потенціал, виводячи країну з королівського застою в нове та світле майбуття. Проте поступки, яких вимагав результат Іссари - породили опозиційні до нього сили. Помірковані голоси й ліві агітатори продовжують чинити вплив на політику Пномпеня, і закликають до нової влади в Кампучії.\n\nКоли прийде час, їм доведеться пізнати усе його невдоволення."
 POLITICS_SON_NGOC_THANH_CORP_DESC: "Одного разу Тганг був героєм, легендою що здолала декаданс Нородомів. Тепер він марно живе своє життя як "Президент", із таким же беззмістовним титулом, що й "Король". Деколи Тганг замислюється, чи насміхається над ним із того світу Сіанук.\n\nУ своєиу полоні, йому не бракувало часу для переосмислення та визначення точного моменту свого падіння. Усе розпочалося з Лон Нола та правих, відколи він надав йому можливість зайняти посаду прем'єр-міністра. Звичайно це не задовольнило лівих - вони б ніколи не подякували за таке - але він не очікував, що вони вийдуть з КНРА. І точно не очікував того, що вони обернуть проти нього зброю.\n\nЗубожіння! Це єдине слово, яке вони знали - не дивно що селяни вийшли з-під контролю, і аграрна криза стала кривавою. Достатньо було мати озброєних лівих, тоді цей клятий принц із його військом "Кхмер Серай" мусили доєднатися до бійні; він мав повбивати всю ту знать, коли мав нагоду. А тоді вони разом пішли на Пномпень.\n\nІ перемогли… ціною своєї національної гідності. Той обліковець Сон Санн і інші японські підлабузники побіжали плакатися до Токіо за поміччю, ніби Тганг не міг самотужки втриматися, і помістили його під домашній арешт. Віднині він сидить вдома, чекаючи ще однієї дурної врочистості, на яку його виведуть на люди, доки він їм не обридне. Він став тим, кого колись зненавидів: ледачим і безхребетним королем."
 POLITICS_SON_NGOC_THANH_REVNAT_DESC: "Надто довго Сон Нґок Тганг був змушений коритися жалюгідним принципам порозуміння. Із цим покінчено. Тепер, Кампучія стане чистим утіленням його бачення, незайманим лаоськими, тайськими чи в'єтнамськими махінаціями.\n\nПраві прихвостні Таїланду, як от Лон Нол і Яєм Самбоу, насідають йому на п'яти - їхнє вбивство Пач Чгеуна тому останнє свідчення. Але цей день настане. Його сила тільки й росла останнє десятиліття, не співставна з будь-яким королем-марнотратником, і він готовий остаточно розібратися з усіма тими, хто протистояв йому. Коли прибуде цей день, ніхто цього не передбачить.\n\nОдначе ліві довели йому, що варті свого. Яких вони не мали б переконань, вони показали, що є справжніми патріотами. Люди, як Кгеу Сампган - наступне покоління народних революціонерів, готові принести Кампучію до нової доби процвітання. Вони піднесуть Республіку на новий рівень величі, на тілах цих в'єтнамських, лаоських та тайських зрадників.\n\nНатовпи кхмерів із захопленням у очах дивляться на нього, свого улюбленого Президента. Кожен із них - воїн, всі з них - готові померти за нього, і жоден із них не вагається. Зі сльозами на очах Тганг оглядає їх, гордий, що саме він той, хто повернув нації її гідність; саме він та людина, яка надихнула наступне покоління повернути імперію, вкрадену в них."
 POLITICS_SON_NGOC_THANH_MANSTATE_DESC: "Компроміс - страшний вбивця мрій. Тганг думав, що звільнився від нього, коли оголосив військовий стан. Але насправді він потрапив у новий, в якості в'єтнамської маріонетки. Зараз це зробило його вже маріонеткою правих, а конкретно Яєм Самбоу.\n\nСидячи в своєму домі, самотній - його охороняють люди Лон Нола, лише з титулом Президента, Тганг мав досить часу, аби обміркувати свої помилки. Він схильний вважати, що його занепад почався з поразкою в війні Веал Тгом, що відібрала Стунґ Тренґ знову з його рук. Зрозуміло, що ця помилка сягає корінням Операції Іссара. Якби ж він не погодився на жалюгідні вимоги Лаосу за втручання Японії.\n\nЯк скалічений пес, він був змушений прохати про допомогу, обернувшись до в'єтнамців за підтримкою. Із ними вигода була лишень в їхню сторону, щось чого він ніяк не міг помітити. Коли Кен Вансак назвав його зрадником кхмерської нації, він зрозумів, що зайшов із цим надто далеко. Можливо ця доля буття маріонеткою, є саме для такого покидька, як він, навіть якщо в цьому випадку він належить такому псові, як Яєм Самбоу.\n\nПроте в чому полягає усвідомлення цієї епіфанії? Що він був дурнем, коли покладався на інших. Боягузом, який відкинув свою кхмерську честь, аби скинути тягар на народи менші, щоби за першої нагоди вони б зрадили й покинули його, коли він перестав бути потрібен. Принаймні Тганг сподівається, що до влади в Кампучії прийде істинний герой, і покаже цим мерзотникам, з чого справді зроблений кхмерський нарід."
 POLITICS_NORODOM_SIHANOUK_DESC: "Двадцять один рік. Саме стільки чекав Сіанук, аби втілити помсту проти людини, що скинула його зі свого трону; стільки він чекав, аби зробити Кампучію знову своєю.\n\nЯк єдина дитина в королівському подружжі, французи коронували його королем Кампучії в навратливому віці - 19 років, після смерті його дідуся, Сісоватг Монівонґа. Та період "медового місяця" для Сіанука протривав недовго, закінчившись тим, що Тганг наполіг назначити себе прем'єр-міністром. Ласий до влади, він розчавив його трон на шматочки, підкоривши собі лестливі маси.\n\nУ політичному вигнанні, Сіанук проводив свій час набуттям союзників серед тих, кому також перепало від Тганга. Воно закінчилося під час громадянської війни, дозволивши йому пов'язати себе з правими анти-тгангістами, доєднавшись разом із принцом Нородом Чантараїнґсеєм до сил Кхмер Серай. Невдовзі, Сіанук обійшов принца за популярністю, ставши новим обличчям руху.\n\nПроте його кінцева ціль - ні обличчя, позбавлене сили, ані повернення собі трону. Ні, Сіанук пристосувався до цих часів, вивчаючи сучасні способи управління. Його ціллю є той він, кому кампучійці завдячують своєю стабільністю - той він, хто героїчно скінчив громадянську війну, доки зрадник Тганг щосили утікав; і той він, хто формуватиме Кампучію майбутнього - за його образом і подобою."
 POLITICS_LON_NOL_DESC: "Колись Президент Сон Нґок Тганг дав обіцянку, що він буде тією людиною, яка приведе кхмерську націю до величі. Та час йшов, і, як виявилося, він усього лиш був маріонеткою В'єтнаму. Як Лон Нол був змушений скинути правителя-ледаря задля того, аби самотужки очолити народ - історія повторює сама себе.\n\n\Будучи сином "миротворця", Нол перейняв цю сімейну традицію вартового влади, навіть якщо ця влада - колоніальне правління французів. Коли японці надали кхмерам незалежність, Нол швидко інтегрувався з їхнім режимом. А коли проголосили Республіку, Нол переніс втрату короля, служачи кхмерському народові та здіймаючись все вище по військових щаблях.\n\nОпинившись таким чином керманичем Збройних сил Кампучії на початку 1960-х, Нол продовжував виконувати нелегке завдання з відновлення їхнього престижу, який вони втратили після Операції Іссара. Та успіхи його звів нанівець Тганг, що бив чолом перед в'єтнамцями, відкликавши претензії на Нижню Кампучію задля політичної могутності. Використовуючи нагоду під час візиту Президента до Токіо, він здійснив переворот і захопив владу.\n\nТепер будучи Президентом, Лон Нол думає змінити підхід: більше не буде таємницею їхнє прагнення повернути свої землі. Їх більше не візьме страх знову пролити чай в'єтнамцям. Ніяких більше поклонів.\n\nПовстаньте, кхмери!"
 POLITICS_LON_NON_DESC: "Кхмери повставали вже досхочу, і це напрочуд викликало невдоволення в їхніх сусідів. Прихід Лон Нона до влади означатиме, що кхмерам знову доведеться підкоритися й продовжити слугувати підставкою для панського чаю. А втім, такий статус-кво на краще для них.\n\nТа хто ж такий Лон Нон? Крім того, що він є братом Лон Нола та має надзвичайне прагнення до влади, більшість людей зупинилася б на подібній характеристиці. Та все ж таки, ці дві ознаки складали більшість його життя до цього моменту. Супроводжуючи свого брата в армії, завдяки непотизму та підлабузництву він зміг швидко зростати в військових званнях.\n\nА коли Лон Нол став Президентом, Лон Нон неймовірно від цього виграв, і став однією з найвищих осіб у країні тільки через те, що він - його брат. Його тяга до панування, утім, не закінчилася тут, і ним зацікавилися посадовці з Таїланду, шукаючи того, хто задовольнив би їхні інтереси при владі, і аби при цьому ним можна було легко керувати. Скориставшись ними, своєю владою яку він мав та політиками-дисидентами, Нон перехопив управління країною на себе.\n\nКоли діло доходить до правління, Президент Лон Нон у першу чергу переймається проблемами тайців та в'єтнамців, а вже потім - внутрішньою політикою. Його цілі залишаються невідомими поза підтримкою стабільності, навіть для самого себе, бо ідеологія за межами влади здається йому чудернацькою. Тож доки він зможе підтримувати її всіма можливими способами, усе буде чудово."
 POLITICS_SIM_VAR_DESC: "На робочому місці Сім Вара, за стінами, пошматованими кулями та заляпаними кров'ю, новий Президент складає список доручень. Вони надходять звідси до інших державних службовців, і мають чіткі вказівки щодо того, як зібрати докупи їхню зруйновану неньку. Він бажав би бути деінде, та не тут.\n\nВар ніколи не цурався своїх амбіцій, а проте ніколи не сподівався, що опиниться на найголовнішій посаді в Кампучії замість робітника ферми. Доля справді над ним насміхається. Вона й привела до влади поважного для нього націоналіста Сон Нґок Тганга. Не важливо що таких, як він, було безліч, включно з Сім Варом - просто він був призначений для великих справ. Розчарований у цьому, Вар примирився й доєднався до КНРА, аби допомогти своєму приятелеві.\n\nТганг відплатив своєму другові за цю довгу службу справі кампучійського націоналізму - надавши зручне місце посла Кампучії в Японії. Поєднуючи цю роботу з його клопотами всередині країни, Вар добре зарекомендував себе японцям, проводивши все більше й більше часу в Токіо; у місті, в якому він перебував для ведення перемовин про надання допомоги. Аж раптом з'являються новини, що В'єтмінь захопили Пномпень.\n\nКоли Вар повернувся додому й Японія вже звільнила його країну, мало чого залишилося. Більшість - якщо не всіх - високопосадовців було страчено, і доля нарешті надала йому можливість прийти до влади, навіть коли він її більше не кортів. Утім, хтось повинен відбудовувати Кампучію. Шкода, що той хтось, кому це випало - він."
 POLITICS_HU_NIM_DESC: "У 1949-му році, Сон Нґок Тганг скинув нездару Сіанука з трону, і поклав початок республіканській революції в Кампучії. На жаль, лише перша частина цієї заяви є вірною. Так було, допоки двадцять одним роком пізніше, Ху Нім та його вірні мужі увійшли в Пномпень - як переможці.\n\nНародженому серед безмежної бідності, Німу вдалося покинути її завдяки освіті. Скасування монархії Тгангом повпливало на його залучення до політики; та його момент у житті, схожий на "дорогу до Дамаску" настане, коли він отримає змогу навчатися в Нанкіні. Там він довідався про революціонерів Ван Цзінвея й Лінь Байшеня, і що це означає - бути справжнім республіканцем.\n\nПереміщуючись всередині лівих політичних кіл Кампучії, він піднявся щаблями КНРА, працюючи в заздалегідь невдалому уряді Ачар Сока. Тоді Тганг обернув свій погляд на правих, і він зрікся посади, небажаючи докладати рук до зубожіння й нехтування долею селянства. Згодом зречення перейшло в супротив - він і інші молоді люди, невдоволені Республікою, що зазнала невдачі, обернули проти неї зброю.\n\nЗавзята республіканська молодь привела його до влади, і з цим майбутнє Ху Німа стає по-своєму особливим. У межах країни її земля буде повернена народу, що так довго на ній трудився. На міжнародному рівні він із захопленням споглядає Китай, як лідера паназійства, що зможе перевершити навіть Японію. А на національному рівні озирається на вкрадені Таїландом землі… із безумовною люттю."
 POLITICS_SON_NGOC_MINH_DESC: "Не існує в Кампучії жодної людини, яка була б настільки відданою ідеї революції, як Сон Нґок Мін. У його мріях він не бачить порожню риторику, котру мали його попередники, а уявляє істинну, пролетарську революцію, у якій його народ звільниться від усіх проявів імперіалізму.\n\nМаючи батька з Нижньої Кампучії й матір із В'єтнаму, Фам Ван Хуа був покликаний жити буддистським проповідником, доки стежка життя не вивела його на шлях революції, закладений В'єтмінем. Він поєднав імена Сон Нґок Тганга й Хо Ші Міна - що стало його бойовим псевдонімом, і дотримувався настанов останнього, знайшовши націоналістичну риторику першого непідходящою.\n\nРозпочавши свою путь, Мін усіма стараннями наближав кінець Республіки, зчинивши непоправний безлад із військами В'єтміню під час війни Веал Тгом. За межами Кампучії ж він допоміг повалити колабораціоністський режим у В'єтнамі, послабивши його для вирішального наступу В'єтміня. Сон Нґок Мін повторить цей здобуток, коли В'єтнам перейшов до нападу.\n\nОтримавши найбільшу владу в Кампучії, майбутнє Індокитаю видається світлим, оскільки кайдани імперії нарешті було розірвано. Звісно, присутні ризики, що Японія повернеться, не пробачивши подібного вчинку, заподіяного на її периферії. В випадку їхнього повернення, Мін знову піде в підпілля, вдосталь озброєним засобами, що перетворять подальший контроль японців на жахіття."