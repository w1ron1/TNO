 ### Leader Desc ###
 PRC_Aleksandr_Vasilevsky: "Алєксандр Васілєвскій" 
 POLITICS_ALEKSANDER_VASILEVSKY_DESC: "Алєксандр Міхайловіч Васілєвскій був сином російського православного священника. Очікувалося також, що йому випаде наслідувати батька - але потягнуло його на житіє військове, і проміняв він семінарські ризи на воєнну форму. Воював у Російській імператорській армії та піднявся за званням, проте покинув своє місце служби після Жовтневої революції, і провів більшість Громадянської війни в Росії за командуванням військ далеко від ліній зіткнень. У міжвоєнні роки Васілєвскій зарекомендував себе здібним керівником і збратався з видатними офіцерами: Алєксандром Єґоровим, Міхаїлом Тухачєвскім і Ґеорґієм Жуковим. Коли німці вторглися, Васілєвскій служив у генеральному штабі Бухаріна, і його вміння добре працювати під тиском допомогло йому швидко просуватися по службі. Та навіть його навички не змогли завадити евакуації Москви перерости в божевільну тисняву, де солдати, урядовці й мільйони цивільних відчайдушно боролися між собою за такий жаданий безпечний шлях із міста.\n\nПрагнучи врятувати якомога більшу частину Красної армії, Васілєвскій організував більш-менш упорядкований відступ сил, що вирвалися з Можайської лінії оборони, й повів їх на схід, за Урал. Їхньою ціллю була Монгольська Народна Республіка, де вони змогли б перегрупуватися й відновити наступ. Та нагоди не випало: японці та їхня маріонеткова держава Менцзян вже увійшли до Улан-Батора й змусили залишки монгольської армії втекти в степи. Васілєвскій уклав із монголами хиткий союз, і дві армії здобули територію на заході Монголії й у минулій Тувинській Народній Республіці. Там вони були відокремлені від Західноросійської війни, Сибірської війни й падіння Центральносибірської Народної Республіки. Уряд Яґоди в Іркутську вони старанно обходили стороною, побоюючись, що той оголосить їхній відступ боягузтвом і розстріляє за зраду. Але незважаючи на відсутність союзників, Васілєвскій і досі сповнений рішучости знову згуртувати своїх людей, розробити плани подальшої боротьби та вибороти свій шлях додому."

### Ideas ###
PRC_red_army_dynamic_modifier: "Красна армія у вигнанні"
PRC_red_army_dynamic_modifier_desc: "Народно-революційний совєт сформували з розрізнених залишків Далекосхідного Військового округу. Монгольська Народна Республіка, яка перед Вєлікою Отєчествєнною була обмежена до стану совєцької маріонетки, раптово стала притулком підрозділів Красної армії, покинутих без свого командування. Унаслідок повільного та кропіткого процесу уряд Монголії почав поступово інтегруватися з російськими військовими; і зміг, попри вторгнення Менцзяну, вижити, хоч і на краєчку власної ж країни. Після років поневірянь Красна армія пережила японську ширму паназіятства, тоталітаризм Яґоди, і внутрішні чвари між своїми командувачами. Тепер солдати гадають, чи скінчиться колись їхнє одвічне вигнання."

PRC_factionalism: "Суперечки щодо курсу"
PRC_factionalism_desc: "Між провідними діячами Народно-революційного совєту точиться чимало суперечок щодо державної політики та її кінцевої мети. Утім, це очікувано, зважаючи на те, що країна контролюється крихкою коаліцією росіян і монголів, що мають спільне лише в бажанні вижити й у прихильності до доктрини соціялізму; ці чвари часто призводили до сутичок всередині керівництва - вжиття рішучих заходів без накликання гніву однієї чи іншої сторони часто буває складним завданням. Однак якщо Народно-революційний совєт хоче вижити й надалі або навіть і відновити Союз, ці суперечки доведеться владнати."

PRC_democratic_military: "Демократичні війська"
PRC_democratic_military_desc: "Солдати Красної армії самі обирають собі офіцерів - такий механізм уособлює прагнення відійти від реакційної ієрархії, що панує у військах старого зразка. Проте таке рішення несе за собою наслідки. Військові не обиратимуть офіцерів за їх кваліфікацією та вміннями, як не обиратимуть і тих, хто здатен ухвалювати важкі рішення, коли цього вимагає ситуація - вони оберуть офіцерів, які є популярними, які щадитимуть своїх підлеглих. Це означає, що частіше за все посади займатимуть люди, які геть не мають потрібної для цього кваліфікації."

PRC_preparation_for_war: "Готові до війни"
PRC_preparation_for_war_desc: Підготовку держави завершено, а всі сфери економіки налаштовано на постачання й виробництво воєнного часу. Хоч наша економічна база, ймовірно, значно менша за ту, яку матимуть наші майбутні вороги, така повна зосередженість і численні вдосконалення, проведені заради цієї мети, мають дозволити нам залишатися конкурентоспроможними й вести боротьбу на більш рівних умовах."

