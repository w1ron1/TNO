 ### Leader Desc ###
 PRC_Aleksandr_Vasilevsky: "Олександр Василевський" 
 POLITICS_ALEKSANDER_VASILEVSKY_DESC: "Олександр Михайлович Василевський був сином російського православного священника, і від нього очікували, що він піде стопами батька, але його приваблювало військове життя, і він змінив семінарську рясу на солдатську форму. Він воював в Імператорській російській армії та піднявся службовими сходами, але подав у відставку під час Жовтневої революції та значну частину Громадянської війни в Росії провів, командуючи солдатами далеко за лінією фронту. У міжвоєнні роки він проявив себе як вправний організатор і подружився з іншими відомими офіцерами, такими як Олександр Єгоров, Михайло Тухачевський та Георгій Жуков. Коли німці вторглися, Василевський служив у генеральному штабі Бухаріна, а його здатність добре працювати під тиском допомогла йому піднятися службовими сходами. Але навіть його навички не могли запобігти перетворенню евакуації Москви на шалений натовп, коли солдати, бюрократи та мільйони цивільних відчайдушно боролися між собою за омріяний безпечний прохід із міста.\n\nВирішивши допомогти якомога більшій частині Червоної армії вижити, Василевський організував напівупорядкований відступ сил, які прорвалися через Можайську лінію оборони, і вирушив на схід, за Урал. Їхня мета: Монгольська Народна Республіка, де вони могли б перегрупуватися та відновити наступ. Але цієї можливости так і не випало, адже японці та їхня маріонеткова держава Менцзян уже вторглися в Улан-Батор і змусили залишки Монгольської армії відступити в степи. Василевський уклав хиткий союз із монголами, і дві армії заснували володіння на території колишньої Тувинської Народної Республіки. Вони були ізольовані від Західноросійської війни, Сибірської війни та падіння Західносибірської Народної Республіки. Вони охоче уникали уряду Ягоди в Іркутську, побоюючись, що він назве їхній відступ боягузтвом і розстріляє їх за зраду. Але попри відсутність союзників Василевський і досі сповнений рішучости згуртувати своїх людей, скласти плани битв і пробитися назад додому."

### Ideas ###
PRC_red_army_dynamic_modifier: "Червона армія у вигнанні"
PRC_red_army_dynamic_modifier_desc: "Народна революційна рада була сформована з розрізнених залишків Далекосхідного військового округу. Монгольська Народна Республіка, яка до Великої Вітчизняної війни була перетворена на совєцьку маріонетку, раптом опинилася господарем підрозділів Червоної армії, що застрягли тут і втратили свій ланцюг командування. Унаслідок повільного й складного процесу монгольський уряд поступово об'єднався з російськими військовими, і, попри вторгнення Менцзяна, вони вижили на околиці країни. Після років поневірянь Червона армія пережила японську ширму паназіатизму, тоталітаризм Ягоди та внутрішню боротьбу між своїми лідерами. Тепер війська замислюються, чи колись закінчиться їхнє вічне вигнання в Монголії."

PRC_factionalism: "Суперечки щодо напрямку"
PRC_factionalism_desc: "Між провідними діячами Народної революційної ради точиться чимало суперечок щодо політики управління та її кінцевої мети. Втім, цього й слід очікувати, коли нацією керує нещільна коаліція росіян і монголів, яких об'єднують лише прагнення вижити та прихильність до соціялістичної доктрини. Ці розбіжності часто призводили до внутрішньої боротьби в лавах режиму, а рішучі дії можуть бути складними без того, щоб не засмутити одну з фракцій. Однак, якщо Народна революційна рада хоче вижити в майбутньому або навіть відновити Союз, суперечки доведеться вирішити."

PRC_democratic_military: "Демократичні військові сили"
PRC_democratic_military_desc: "Солдати Червоної армії обирають власних офіцерів, щоб відійти від реакційних ієрархій, які панують у старих арміях. Однак це рішення мало наслідки. Солдати не обиратимуть офіцерів за їхньою кваліфікацією та навичками й не обиратимуть офіцерів, які прийматимуть важкі рішення, коли це необхідно. Вони обиратимуть популярних офіцерів, які поблажливо ставляться до своїх людей. Це означає, що людей часто підвищують до посад, для яких вони безумовно не мають належної кваліфікації."

PRC_preparation_for_war: "Готовність до війни"
PRC_preparation_for_war_desc: "Підготовку держави завершено, а всі аспекти її економіки налаштовано на воєнне постачання та виробництво. Хоча її економічна база, ймовірно, значно менша за базу її майбутніх ворогів, ця цілеспрямованість і численні оптимізації, здійснені задля її реалізації, мають дозволити їй залишатися конкурентоспроможною та вести боротьбу на більш рівних умовах."

