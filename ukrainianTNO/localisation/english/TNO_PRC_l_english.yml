 ### Leader Desc ###
 PRC_Aleksandr_Vasilevsky: "Алєксандр Васілєвскій" 
 POLITICS_ALEKSANDER_VASILEVSKY_DESC: "Алєксандр Міхайловіч Васілєвскій був сином російського православного священника. Очікувалося також, що йому випаде наслідувати батька - але потягнуло його на житіє військове, і проміняв він семінарські ризи на воєнну форму. Воював у Російській імператорській армії та піднявся за званням, проте покинув своє місце служби після Жовтневої революції, і провів більшість Громадянської війни в Росії за командуванням військ далеко від ліній зіткнень. У міжвоєнні роки виділився, як досвідчений керівник та збратався з видатними офіцерами: Алєксандром Єґоровим, Міхаїлом Тухачєвскім і Ґеорґієм Жуковим. За вторгнення німців Васілєвскій служив у генеральному штабі Бухаріна, і його здібність добре працювати під тиском допомогла йому просунутися по службі. Та навіть його навички не змогли завадити евакуації Москви призвести до навіженої штурханини - солдати, урядовці й мільйони цивільних відчайдушно боролися між собою за завітний безпечний вихід із міста.\n\nНалаштований допомогти якнайбільшій кількості Червоної Армії вижити настільки, наскільки це можливо - Васілєвскій організував напівупорядкований відступ сил, що обійшли можайську лінію оборони й марширували на схід, крізь Урал. Їхньою ціллю була Монгольська Народна Республіка, де вони змогли б перегрупуватися й відновити наступ. Натомість можливість ніколи не настала: японці й їхня маріонеткова держава Менцзян вже увійшли до Улан-Батору, і змусили залишки монгольської армії втекти в степи. Васілєвскій сформував нестійкий союз із монголами, і дві армії здобули територію на заході Монголії й минулій Тувинській Народній Республіці. Там вони були відокремлені від Західноросійської війни, Сибірської війни й падіння Центральносибірської Народної Республіки. На щастя вони уникнули й уряду Яґоди в Іркутску; боячись за те, що він виставить їхню втечу, як боягузство, і розстріляє їх за зраду. Але незважаючи на відсутність союзників, Васілєвскій все ж рішуче готовий зібрати своїх людей, розробити плани боротьби, і вибороти їхній шлях додому."

### Ideas ###
PRC_red_army_dynamic_modifier: "Червона Армія в вигнанні"
PRC_red_army_dynamic_modifier_desc: "Народно-революційну раду сформували з розкиданих осередків Далекосхідного Військового округу. Монгольська Народна Республіка, яка перед Вєлікою Отєчествєнною була обмежена до совєцької маріонетки, раптово виявилася притулком підрозділів Червоної Армії - покинутих і без свого командування. Через повільний та кропіткий процес, уряд Монголії почав поступово інтегруватися з російськими військовими; і вижив на краю своєї держави, незважаючи на вторгнення з Менцзяну. Після років скрути Червона Армія пережила японський фасад паназіатства, тоталітаризм Яґоди, і внутрішні незгоди між своїми командуючими. Тепер війська гадають, чи їхнє одвічне вигнання в Монголії колись закінчиться."

PRC_factionalism: "Суперечки щодо курсу"
PRC_factionalism_desc: "Є чимало сварок між очільними особами Народно-революційної ради щодо урядових заходів, та якою є їх кінцева мета. Утім, це очікувано - зважаючи на те, коли країна контролюється крихкою коаліцією росіян і монголів, що мають спільного лише в бажанні вижити й прихильності до доктрини соціялізму, ці чвари часто призводили до сутичок всередині режиму, і вжиття рішучих заходів без пригнічення однієї чи іншої сторони буває складним. Але якщо Народно-революційна рада бажає дожити до майбуття, або й навіть відновити Совєцький Союз - суперечки мусять бути вирішені."

PRC_democratic_military: "Демократичні війська"
PRC_democratic_military_desc: "Солдати Червоної Армії обирають власних офіцерів, аби позбавитися реакційних ієрархій, що панували в військах минулого. Проте таке рішення несе за собою наслідки. Військові не обиратимуть офіцерів за їх кваліфікацією та вміннями, що чинитимуть важкі рішення за необхідністю ситуації - вони оберуть офіцерів, які є популярними й щадитимуть своїх підлеглих. Це означає, що частіше всього посади займатимуть люди, які найбільше не мають навичок для них."

PRC_preparation_for_war: "Готові до війни"
PRC_preparation_for_war_desc: Державні приготування було завершено, і всі сфери економіки країни переведено на виробництво та забезпечення на час війни. Нехай економічна база держави набагато менша за її майбутніх ворогів - цей окремий фокус і дуже багато оптимізації при його здійсненні, мусять зробити її конкуретноздатною й протистояти на більш рівних умовах."

