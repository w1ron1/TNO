 ### Leader Descriptions ###
POLITICS_OSKAR_DIRLEWANGER_DESC: "Оскар Дірлеванґер, король бандитів, мабуть, найзнедоленіша - і найстрашніша - людина в Південній Росії. Очолюючи своїх людей, збірку ґвалтівників, убивць і варварів без рівних, він тероризує всіх, кому пощастило жити в Південних Уралах.\n\nВсе життя кримінальний опортуніст, Дірлеванґер був ув'язнений у 1934 році за зґвалтування неповнолітньої дівчини і уникав цієї та інших подальших кримінальних справ завдяки політичним зв'язкам і, у 1939 році, добровільно вступивши на службу в Ваффен-СС. Там його порочність поєднувалася з талантом ефективного, хоч і жорстокого, керівництва, що призвело до його підвищення та командування тим, що стало першою ітерацією так званої 'Бригади Дірлеванґера.'\n\nПід час війни цей підрозділ, прикритий асоціацією з СС, скоїв безліч злочинів на Східному фронті, грабуючи та підпалюючи Польщу та Росію. Ці дії повторилися під час Західно-Російської війни, і наявні свідчення ясно показують, що жорстокість і кримінальність Дірлеванґера лише зростала з часом.\n\nЙого життя радикально змінилося після невдалого перевороту Гіммлера та СС. Відкривши вогонь по підрозділах вермахту, що прибули, щоб роззброїти та ув'язнити їх, Дірлеванґер і його люди втекли в російську зиму, зрештою створивши феод у Південних Уралах, звідки могли задовольняти свої найвищі пристрасті — грабіж і кров.\n\nУ цьому він та його бригада надзвичайно ефективні. Але Дірлеванґер трохи втомився від спустошення безіменних сіл і має на оці два головні трофеї регіону: місто Оренбург і об'єкти на Чорній Горі. Він дуже хоче спалити їх дотла.\n\nЗвісно, після того, як забере все цінне."

POLITICS_FRITZ_SCHMEDES_DESC: "Оскар Дірлеванґер мертвий. Але Бригада, така, як вона є, повільно продовжує існувати під командуванням Фріца Шмедеса, єдиної людини, здатної намагатися її утримати разом.\n\nВигнаний у Бригаду давно після суперечки з Гайнріхом Гіммлером, і хоча спершу він намагався втекти, коли підрозділ перетворився з військового у бандитський, він залишився та адаптувався. Можливо, відчувши темряву, яка завжди була всередині, він швидко став майже таким же монструозним, як його командир, плануючи і виконуючи багато найсміливіших рейдів Бригади.\n\nТепер, коли Дірлеванґер мертвий і Бригада майже в стані анархії, Шмедес веде залишки, що залишилися лояльними, відчайдушно намагаючись зберегти якусь єдність. Проте зростанням дезертирства, формуванням відколотих груп і посиленням каральних експедицій проти нього, здається, його зусилля приречені на невдачу."

POLITICS_STEVE_DESC: "Без прізвища, просто Стів\n\nСтудент коледжу громади з Міннесоти\n\nВін дуже загубився\n\nНе всі, хто мандрує, загублені — але Стів загубився.\n\nСтів дуже загубився\n\n\n\nСтів має гіпотермію."

LEADER_FRITZ_SCHMEDES_DESC: "Фріц Шмедес був хорошим німцем, відданим націонал-соціалістом і щирим прихильником переваги арійської раси. Але все це не мало значення, бо суперечка з Гайнріхом Гіммлером закінчилася його вигнанням у Бригаду Дірлеванґера як покарання. Коли Бригада залишила німецьку справу і вирушила в російську глушину, Шмедес пішов за ними. Коли колись лояльні німецькі солдати грабували та нападали, як бандити, Шмедес боровся поряд з ними. Його киплячий гнів і образа за те, що його сюди надіслали, проявляються у жорстокостях, які він чинить разом з іншими офіцерами та солдатами Бригади. Навіть якщо не за власним вибором, Шмедес більше не вірний син Німеччини. Він монстр, як і решта."

