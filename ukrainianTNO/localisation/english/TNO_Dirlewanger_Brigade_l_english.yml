 ### Ideas ###
 DRL_cornered_dog: "Загнаний пес"
 DRL_cornered_dog_desc: "Відколи Лисенко та Чорна Гора впали перед Уральською Лігою, Бригада справді залишилася сама, звідусіль оточена тими, хто бажає її знищити, немов загнаний у кут пес, якому нікуди тікати. Та загнаний пес надзвичайно небезпечний, адже йому ніщо не заважає битися щосили. А сили в Бригади справді чимало."
 DRL_enemies_on_all_sides: "Вороги з усіх боків"
 DRL_enemies_on_all_sides_desc: "Ми в чужих землях, оточені ворогами з усіх боків. Та вони не знають правди: це не ми опинилися тут у пастці з ними, це вони опинилися тут у пастці з нами. Нехай спробують нам протистояти й побачать, до чого це їх доведе. Солдати Лисенка? Ополченці Ліги? Анархісти Орєнбурґа? Нікому з них не стає духу виступити проти нас, та й воювати нарівні з нами вони не здатні. Поки що вони, може, й приховують свій страх, але вічно так тривати не може."
 DRL_new_raids: "Підготовка до нового рейду"
 DRL_new_raids_desc: "Невдовзі ми вирушимо. На нас чекають кров, вогонь і грабунок, але спершу треба підготуватися. Людей, зброю, вантажівки та все інше слід оглянути й привести в готовність.\n\nТак і буде. А тоді, хто б цього разу не став нашими нещасними жертвами, вони справді зрозуміють, чому Бригади варто боятися."
 DRL_bandit_state_1: "Бандитська держава"
 DRL_bandit_state_1_desc: "Цю «державу» важко так назвати: вона майже нічим не відрізняється від території мандрівної зграї бандитів, які стають табором лише доти, доки не пограбують усе довкола, а тоді рушають далі.\n\nТож функціями, звичайними для справжньої держави, тут здебільшого нехтують. Водночас це означає, що в будь-якій сутичці вони битимуться люто, і недооцінювати їх не слід."
 DRL_bandit_state_2: "Бандитська держава"
 DRL_bandit_state_2_desc: "Цю «державу» важко так назвати: вона майже нічим не відрізняється від території мандрівної зграї бандитів, які стають табором лише доти, доки не пограбують усе довкола, а тоді рушають далі.\n\nТож функціями, звичайними для справжньої держави, тут здебільшого нехтують. Водночас це означає, що в будь-якій сутичці вони битимуться люто, і недооцінювати їх не слід."
 DRL_bandit_state_3: "Бандитська держава"
