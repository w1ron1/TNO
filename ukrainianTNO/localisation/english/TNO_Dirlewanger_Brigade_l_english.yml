 ### Focus Descriptions ###
 DRL_the_black_bandits_of_the_south: "Чорні бандити півдня"
DRL_the_black_bandits_of_the_south_desc: "Оскар Дірлеванґер раз за разом приводив нас до перемоги і збагачення, борючись із сильними і слабкими ворогами. Від нашої «служби» в СС до втечі, коли Вермахт намагався роззброїти нас, до захоплення земель навколо Орська, він завжди вказував нам шлях. Все на Південному Уралі — багатство, жінки, земля — належить нам. Просто це ще не зібрано."

DRL_our_backs_to_the_wall: "Наші спини до стіни"
DRL_our_backs_to_the_wall_desc: "Ці землі можуть належати нам, але не всі це приймають. Уральська Ліга, жалюгідне об'єднання громад під проводом злочинного священика, раз по раз полювала на нас, і хоча ми ухилялися від їхніх загонів або знищували їх, їх завжди з'являлося все більше. \n\nЗ іншого боку, затиснута між божевільними на сході, степами на півдні та комунами на заході, Ліга вважає, що може знищити нас раз і назавжди. Але вони не знають, що ми тримаємо їх там, де нам потрібно. Ми будемо триматися, виснажувати їх, а потім, з часом, завдамо удару у відповідь і захопимо Оренбург. А коли ми це зробимо, вони справді дізнаються, чому Бригада так бояться"

DRL_ready_the_boys: "Готуйте хлопців"
 DRL_ready_the_boys_desc: "Ніхто в Росії, по обидва боки Уралу, не є злішим, жорсткішим або сильнішим за бійців Бригади. Настав час ще раз це довести.\n\nЩоб підбадьорити бійців, буде роздано частину попередньої здобичі. Здобич, алкоголь і жінки, які ще здатні розважати, нагадають їм про те, що їх чекає.\ n\nНаша наступна «експедиція» швидко наближається, і вони повинні бути в захваті від неї!"

DRL_we_ride_or_die: "Ми їдемо або вмираємо»
DRL_we_ride_or_die_desc: «Оточені ворогами, тими, хто хоче зупинити нас або позбавити нас права на грабунок, ми відмовляємося вмирати, як вони так відчайдушно сподіваються! Ми беремо! Ми їдемо!\n\nМи їдемо по будь-якому чоловікові, який настільки дурний, що грається в солдатів, по будь-якому селу, яке настільки дурне, що озброює міліцію, і по будь-кому іншому, хто наважиться спробувати нас зупинити. Ми знайдемо все, що вони намагаються захистити, і завантажимо це на їхні трупи.\n\nГотуйтеся, хлопці! Ми їдемо грабувати!"

 DRL_keep_them_fresh: "Тримайте їх свіжими"
DRL_keep_them_fresh_desc: "Чоловіки з бригади — жорсткі. Але наїдання грабунком, що є їхньою постійною метою, має тривожну тенденцію робити їх м'якими. Ледачий бандит — мертвий бандит, а ми не маємо наміру вмирати.\n\nМи зробимо їхні ліжка твердими, їхні казарми ледь теплими, а їхню частку алкоголю достатньою, але тільки-но достатньою. Ми будемо тримати їх у готовності.\n\nДостатньо готовими, щоб, коли буде дано команду, вони з радістю скористалися можливістю взяти участь в черговій «експедиції»"

 DRL_keep_them_happy: "Тримайте їх щасливими"
DRL_keep_them_happy_desc: "Бригада існує заради задоволення. Задоволення від використання того, що було відібрано силою зброї з холодних, мертвих рук слабших людей. Бос це добре знає, тому здобич буде розподілена, а веселощі заохочуватимуться.\n\nЩасливий бандит завжди мотивований залишатися таким і з радістю виконуватиме будь-які накази, що даються в цьому напрямку"

DRL_prepare_for_the_clash: "Готуйтеся до зіткнення"
DRL_prepare_for_the_clash_desc: "Воно наближається, і скоро.\ n\nНаближається велике протистояння з Уральською лігою, і ми знищимо їх. Ми вб'ємо їхніх людей, зґвалтуємо Оренбург дощенту, всіма можливими способами, і доведемо всім, що ніхто не може зупинити Бригаду!\n\nА після цього? Без Ліги, яка організовує оборону і надає «радників» селам? Ну, ми пограбуємо весь регіон. Хто нас зупинить?"

 DRL_prepare_new_raids: "Підготуйте нові набіги"
DRL_prepare_new_raids_desc: "Багато людей думають, що бійці Бригади — прості бандити, здатні лише на жорстокість у гонитві за грабунком. Більшість цих людей мертві. Набіги потрібно планувати. Здобич потрібно транспортувати. Потрібно управляти втратами. Терор потрібно застосовувати в правильний спосіб.\n\nДірлеванґер і бригада в цілому роблять це вже багато років. І ми будемо продовжувати це робити, готуючись до найбільших набігів за всю історію!"

 DRL_gather_our_loot: "Збираємо нашу здобич"
DRL_gather_our_loot_desc: "Коли бригада вирушає в похід, вона завжди повертається з горами здобичі. Але вона також повертається з проблемою обліку цієї здобичі. Це не можна допускати — кожен отримує свою частку, і розмір цієї частки залежить від багатьох факторів. Необхідно ретельно складати, зберігати та регулярно оновлювати інвентарний список усіх трофеїв.\n\nАдже як інакше ми дізнаємося, коли настав час вирушати за новою здобиччю?"

 DRL_prepare_for_the_spoils: "Підготуйтеся до трофеїв"
DRL_prepare_for_the_spoils_desc: "Хоча це не можна вважати справжньою «проблемою», ми часто стикаємося з труднощами при зберіганні всіх трофеїв, здобутих під час наших численних успішних набігів. n\nЦе створює проблеми — без належних місць для зберігання всього, що ми взяли, нам не тільки доводиться швидко розподіляти або споживати це, що спричиняє проблеми з дисципліною, але ми також помічаємо, що крім того зростає кількість крадіжок.\n\nТому перед нашим наступним рейдом буде побудовано більше складів. Сподіваємося, що вони так само швидко заповняться!"

 DRL_the_black_bandit_on_the_black_mountain: "Чорний бандит на Чорній горі"
DRL_the_black_bandit_on_the_black_mountain_desc: "Навіть для бійців Бригади чутки про божевільні експерименти, які проводить божевільний вчений у Магнітогорську, є достатньою причиною для занепокоєння. Але бос бачить у цьому лише можливість.\n\nХто б він не був, Лисенко точно не є другом Уральської ліги, і він має великі запаси зброї всіх видів. Зброї, яку ми хочемо. Спробуємо домовитися про деяку з неї.\n\nА з часом ми зможемо подивитися, що ще він може мати..."

 DRL_lysenkos_instruction: "Інструкція Лисенка"
DRL_lysenkos_instruction_desc: "Угода з Лисенком вийшла навіть кращою, ніж ми могли сподіватися. Він не тільки мав зброю, але серед солдатів НКВС, які перейшли на його бік, було кілька справжніх бойових інструкторів. n\nЧлени бригади можуть бути досвідченими рейдерами, які вміють оцінити цінність будь-чого, що трапляється їм на шляху, але багато з них, особливо наші нові рекрути, жахливо недотреновані. Тому ми домовилися відправити частину наших людей, щоб вони навчилися основним військовим навичкам у цих інструкторів.\n\nПодивимося, як сподобається це Лізі, коли ми знову з ними зустрінемося!"

 DRL_organize_the_russians: "Організуйте росіян"
DRL_organize_the_russians_desc: "Дірлеванґер може бути старим майстром рейдів, але він також є саме тим: старим. Старим і слабким. Ми дамо зрозуміти це російським членам бригади, які становлять більшість, і будемо працювати над тим, щоб перетягнути їх на наш бік. Ми обіцяємо їм більшу частку, вкрадену здобич і все інше, що буде потрібно.\n\nКоли настане час, Дірлеванґер і ті небагато неросіян, які залишаться йому вірними, опиняться наодинці. І стануть легкою здобиччю"

 DRL_expert_instruction: "Інструктаж експертів"
DRL_expert_instruction_desc: "Радянський Союз, можливо, і програв велику війну проти Рейху, але ті з нас, хто ще пам'ятає ті часи, добре знають, як важко вони воювали і скільки німців вони вбили, перш ніж капітулювати. Тренування, до яких ми тепер маємо доступ завдяки інструкторам Лисенка. І ми маємо намір цим скористатися. Якнайбільше наших бійців буде відправлено, сподіваємося, для вивчення кращих і ефективніших тактик. Якщо ці тактики приведуть до більш успішних рейдів, тим краще"

DRL_soviet_stratagem: "Радянські стратегії"
 DRL_soviet_stratagem_desc: "Радянські війська програли, але, як постійно підкреслюють російські члени бригади, вони були і залишаються майстрами обману. Майстрами маскування. Наші вороги менші за радянських, але вони все одно вороги. Якщо ми зможемо навчитися деяким із цих стратегій обману, модифікувати їх відповідно до наших цілей і застосувати під час наступного рейду, ми зможемо значно підвищити ефективність. Або, принаймні, дати їм менше часу, щоб сховати свої цінності"

 DRL_soviet_arms: "Радянська зброя"
DRL_soviet_arms_desc: "Багато зброї, яку бригада отримала з запасів Лисенка в Магнітогорську, є надзвичайно старовинною. На деяких навіть зображено двоголового російського імперського орла!\n\nАле зброя є зброєю, і доки вона надійно стріляє, вона може бути цінною. Ми роздамо їх бійцям бригади, починаючи з найновіших рекрутів, звільнивши кращу зброю для ветеранів. Якщо вони доведуть свою спроможність і здадуть знахідки для розподілу, як того вимагається, вони зможуть заробити собі кращу зброю. А якщо ні, то завжди є інший рекрут, який чекає на свою чергу"

 DRL_soviet_mastery: "Радянська майстерність"
DRL_soviet_mastery_desc: "Бригада вижила і процвітала завдяки розумінню свого оточення. Коли ми відокремилися від Німеччини, нам довелося адаптувати нашу доктрину, змінивши її відповідно до умов Уралу та наших потреб у проведенні рейдів. n\nЗавдяки новій угоді інструктори Лисенка навчають нас радянській тактиці. Деякі з найрозумніших чоловіків зрозуміли, що поєднання двох речей — радянської сили та дисципліни з неортодоксальністю та непередбачуваністю рейдових маневрів — може дати нам реальну перевагу над тими, хто хоче нас знищити.\n\nТож ми це зробим"

 DRL_lysenkos_promises: "Обіцянки Лисенка"
DRL_lysenkos_promises_desc: "В обмін на свою допомогу Лисенко вимагає від бригади багато чого. В'язнів, яких можна залучити до роботи — на базі або на спині — або іншим чином змусити служити, потрібно передати неушкодженими.\n\nДосі він добре нам за них платив, так, але що ще цей божевільний приховує у своїх лабораторіях? У глибинах Чорної гори?\n\nЧас дізнатися і подивитися, що ще він готовий запропонувати!"

 DRL_spoil_trucks: "Вантажівки з видобутком"
DRL_spoil_trucks_desc: "Наші прохання до Лисенка про «альтернативні» форми оплати принесли плоди. Перша така форма? Вантажівки, безсумнівно, взяті з автопарку формувань, які перейшли на його бік. Хоча походження для нас не має великого значення, ефект має набагато більше значення. Більше вантажівок означає, що більше золота, більше зерна, більше жінок, більше всього можна завантажити і привезти до наших таборів.\n\nЧас знайти якесь сонне село, де їх можна буде використати!"

DRL_the_riches_of_the_mountain: "Багатства гори"
DRL_the_riches_of_the_mountain_desc: " Бригада продовжує передавати цінних полонених Лисенку, і давно настав час нагадати йому, наскільки цінною є наша постійна допомога.\n\nУ Чорній горі є набагато більше, ніж він нам досі показав, набагато більше, і ми хочемо це отримати! Трохи тиску, застосованого в правильний спосіб, має сприяти додатковій співпраці та оплаті.\n\nЯкщо Лисенко знає, що для нього краще, звичайно"

 DRL_the_think_tank: "Аналітичний центр"
DRL_the_think_tank_desc: "Лисенко дав нам вантажівки, зброю та гроші. То чому ж він не повертає нам частину того, що ми йому дали — людей?\n\nУ своїх лабораторіях він тримає всіляких вчених, і деякі з них, мабуть, менш важливі за інших. Чому б йому не відправити їх нам? Він отримає більше в'язнів, а ми отримаємо кілька інтелектуалів, які зможуть проводити «польові дослідження» над в'язнями і, крім того, сприяти нашим власним зусиллям.\n\nЦе занадто вигідна угода, щоб її пропустити. Ми подбаємо про те, щоб Лисенко це зрозумі"

DRL_loot_the_universe: "Граблю Всесвіт"
 DRL_loot_the_universe_desc: "Лисенко досі робив правильний вибір, даючи нам альтернативні та корисні предмети для наших в'язнів, а тепер він ще й збільшує свої звичайні виплати! Остання така виплата вже надійшла — більше гвинтівок і спорядження, включаючи важке озброєння.\n\nЦе хороший матеріал. Час його використовувати!"

DRL_lysenkos_strategy: "Стратегія Лисенка"
DRL_lysenkos_strategy_desc: "Люди. Це все, що цікавить Лисенка.\n\nГроші? Йому байдуже. Територія? Вона йому не потрібна. Жінки? Не такі, як нам хотілося б, це точно. Ні, все, що він хоче, — це багато людей, яких у ланцюгах приведуть до Чорної гори, щоб використовувати в своїх збочених експериментах. Ну, якщо це те, чого він хоче, то він це отримає — за умови, що зможе заплатити.\n\nЯкщо він зможе, то отримає людей, яких хоче, — а ми отримаємо здобич, як від них, так і від нього, яку хочемо!"

DRL_testing_our_enemies: "Випробовуючи наших ворогів"
 DRL_testing_our_enemies_desc: "Бригада оточена ворогами. Але це також означає, що ми оточені можливостями.\n\nУральська ліга, Оренбург і незліченні маленькі села та поселення займають землі навколо нас, всі вони багаті на здобич, яка чекає, коли ми її заберемо. Однак ми повинні бути обережними, оскільки всі вони чекають, коли ми зробимо помилку. Тому спочатку ми перевіримо їхню силу і побачимо, який із наших ворогів пропонує найкращі можливості.\n\nТільки тоді ми вирушимо на грабунок!"

DRL_strike_at_the_urals: "Удар по Уралу"
DRL_strike_at_the_urals_desc: "Уральська ліга — наш найзапекліший ворог.\ n\nХоч ми й ненавидимо їхнє жалюгідне «державне утворення», не можна заперечувати, що їхні ополчення ефективні, а громади добре захищені. У минулому вони навіть кілька разів перемагали нас, і це створює нам проблеми. Ми мусимо довести, що вони не здатні захистити свою територію, що вони, як і всі інші, падають перед нами.\n\nМи мусимо поставити їх на місце. І ми це зробим"

 DRL_strike_at_orenburg: "Удар по Оренбургу"
DRL_strike_at_orenburg_desc: "Комуни Оренбурга дезорганізовані і тримаються разом лише завдяки спільним анархістським ідеалам. Іншими словами, вони є ідеальними цілями.\n\nОднак дотепер вони були об'єктами наших набігів набагато рідше, ніж села та поселення Уральської ліги. Це означає, що, на відміну від місць, які ми грабували раніше, вони, мабуть, переповнені здобиччю.\n\nЧас показати їм, на що здатна Бригада!"

 DRL_strike_at_the_peasantry: "Удар по селянству"
DRL_strike_at_the_peasantry_desc: "Хоча напад на поселення, пов'язані з Лігою або Оренбургом, може принести хорошу здобич, є одна серйозна проблема: вони можуть дати відсіч. Незалежні села, що розкидані по Південному Уралу, можуть і не бути багатими, але вони також не мають реальної оборони. Здобичі буде небагато, але вона буде, а також будуть і жінки.\n\nНаразі цього буде достатнь"

DRL_grab_the_healthy_fit_and_strong: "Захоплюйте здорових, сильних і міцних"
 DRL_grab_the_healthy_fit_and_strong_desc: "Ми грабуємо заради багатства, розваг та з багатьох інших причин, але одна з найцінніших речей, які ми знаходимо, — це плоть. Кожна людина, яку ми беремо в полон під час набігу, може бути використана. Жінок можна використовувати, доки вони не стануть непридатними, а чоловіків можна або поставити на роботу, або, якщо вони достатньо сильні, примусити до служби. Всі можуть служити. І вони будуть служити. Або вони помрут"

DRL_draw_out_the_guard: "Виманити охорону"
DRL_draw_out_the_guard_desc: "На кожному кроці Уральська охорона перешкоджає нашим зусиллям, організовуючи оборону, навчаючи селян військовій справі і навіть нападаючи на наші табори вночі. n\nЯкщо ми хочемо одного дня повністю знищити їх і залишити їхні землі відкритими для грабунку, нам спочатку потрібно підірвати їхні сили, і тактика маскування, яку ми нещодавно вивчили, може в цьому допомогти. Серія невеликих набігів змусить їх задіяти свої основні сили.\n\nІ коли вони це зроблять, ми будемо чекат"

 DRL_the_battle_of_novotroitsk: "Битва під Новотроїцьком"
DRL_the_battle_of_novotroitsk_desc: "Наш хід спрацював!\n\nНаші нальоти на віддалені села Ліги змусили їх вийти з укриття і почати споруджувати оборонні споруди навколо міста Новотроїцьк в очікуванні бою. Але вони все ще думають, що будуть воювати лише з черговою рейдерською силою, і розгорнули свої війська відповідно.\n\nВони навіть не уявляють, що на них чека"

DRL_the_second_phase: "Друга фаза"
DRL_the_second_phase_desc: "Сили Уральської Ліги були розгромлені в Новотроїцьку, втягнуті в нашу пастку, і це дає нам можливість.\ n\nЇхні ополчення виснажені, оборонні лінії прорвані, а фортеці відкриті. Ми, ймовірно, більше не побачимо такої миттєвої слабкості, і ми повинні скористатися цим. Будуть проведені додаткові рейди на ці фортеці, щоб забезпечити їх знищення.\n\nНаближається ще один великий рейд, і коли він відбудеться, Ліга не зможе втрутитися!"

 DRL_lessons_of_the_guard: "Уроки гвардії"
DRL_lessons_of_the_guard_desc: "Ми здобули багато трофеїв з фортець Ліги, але також взяли в полон.
Хоча зазвичай ми б передали їх Лисенку або просто позбулися б їх, ми не повинні забувати, наскільки корисним було навчання, яке раніше отримали наші люди. Ми дамо їм дуже простий вибір: навчити нас, як Ліга тренується і воює, або померти. Безумовно, деякі з них будуть готові дати нам уроки.\n\nІ тоді ми зможемо і будемо використовувати ці уроки проти їхніх колишніх друзі"

DRL_ural_expertise: "Уральська експертиза"
 DRL_ural_expertise_desc: "Полонені Уральської Ліги, принаймні ті, хто був достатньо розумним, щоб прийняти нашу пропозицію, були дуже корисними. \n\nЗемлі Ліги є суворими і гірськими, і вони дали нам кілька корисних вказівок щодо того, як найкраще з ними поводитися. Настільки корисних, що деякі члени Бригади вважають, що їм слід запропонувати залишитися і приєднатися до нас на постійній основі. n\nЗвичайно, вони завжди можуть відмовитися. Це просто означає, що нам доведеться викопати трохи більшу ям"

DRL_homemade_body_armor: "Саморобна броня"
DRL_homemade_body_armor_desc: "Є одна річ, про яку чоловіки просять знову і знову: броня.\ n\nХоча ми не маємо зв'язків чи ресурсів, щоб придбати належний високоякісний захист, нам це й не потрібно. Більшість зброї, яку використовують наші вороги, є застарілою або імпровізованою, тож ми також можемо імпровізувати рішення. У нас є багато металобрухту від старого чи розграбованого обладнання, і ми можемо використати його, щоб виготовити набори примітивного захисту.\n\nЦе буде достатньо. Хоча й виглядатиме трохи дивн"

 DRL_rapid_assault: "Швидкий напад"
DRL_rapid_assault_desc: "У вовків є багато чого поважати. Вони полюють зграями. Вони вибирають найкращі цілі, які нерозумно віддаляються від великого стада. Вони рухаються швидко, досягають своєї мети, а потім відступають, готові повторити процедуру знову. Ми повинні діяти так само, використовуючи наші вантажівки для швидкого переміщення, знищення нашої здобичі та отримання того, що ми хочемо.\n\nНезабаром усі будуть знати Бригаду як Вовків Урал"

DRL_transfer_the_flesh: "Передача плоті"
DRL_transfer_the_flesh_desc: "Наші рейди на Південному Уралі, що стали частішими та масштабнішими, залишили нам набагато більше полонених, ніж зазвичай. \n\nУ нас немає місця, щоб їх утримувати, і ми, звичайно, не хочемо їх годувати. Але, як завжди, Лисенко хоче ще більше, тож ми передамо їх йому. Звичайно, за належну компенсацію.\n\nПодивимося, на що ми можемо натиснути на нього цього раз"

DRL_hand_them_over: "Передати їх"
DRL_hand_them_over_desc: "Як і раніше, Лисенко запропонував надати нам розумну кількість обладнання зі складів Чорної гори в обмін на полонених, яких ми можемо запропонувати.\ n\nХоча деякі члени бригади стверджують, що ми повинні вимагати від нього більше, посилаючись на наше посилення позицій, інші стверджують, що володіння Лисенка не можна порівняти з нашими звичайними цілями, і що немає сенсу вбивати курку, яка несе золоті яйця"

 DRL_good_friends_means_good_money: "Хороші друзі означають хороші гроші"
DRL_good_friends_means_good_money_desc: "Дотримуючись свого слова і у відповідь на наші дії, Лисенко також дотримався угоди. Хоча це не так багато, як деякі стверджують, що ми мали б отримати, це набагато більше, ніж нічого, і може бути негайно використано в наших майбутніх рейдах. Наразі цього має бути достатньо.\n\nАле наступного разу? Хто знає?"

DRL_the_deal_changed: "Угода змінилася"
DRL_the_deal_changed_desc: "Коли ми востаннє укладали велику угоду з Лисенком, ми не були достатньо сильними, щоб змусити його підкоритися. Тепер ситуація змінилася. У нас більше людей, ніж у нього. У нас більше досвіду, ніж у нього. І, зважаючи на всі наші попередні угоди, цілком можливо, що тепер у нас також більше обладнання, ніж у нього. Настав час чітко продемонструвати цю різницю в позиціях. Він може дати більше. Ми йому про це скажемо. n\nІ йому краще це зробит"

DRL_pray_we_dont_alter_it_further: "Молімося, щоб ми не змінювали це далі"
DRL_pray_we_dont_alter_it_further_desc: "Чудова новина — Лисенко усвідомив, що не в змозі торгуватися з бригадою, і відступив, як боягуз, яким ми його знаємо. \n\nВже зараз до наших складів поблизу Орська надходять партії обладнання, набагато більші, ніж ми могли б отримати в іншому випадку. Наші бійці надзвичайно раді отримати його, щоб замінити старе і зношене озброєння, а також екіпірувати наших найновіших рекрутів. Ми вже почали планувати нові рейди, щоб використати це обладнання.\n\nХто сказав, що залякування не може творити чудеса?"

 DRL_a_second_great_raid: "Другий великий рейд"
DRL_a_second_great_raid_desc: "Оскільки Уральська ліга зазнала поразки під Новотроїцьком, настав час планувати черговий великий рейд. Такий, який вони не зможуть зупинити.
Однак спочатку потрібно відповісти на багато питань. Куди націлитись? На якому типі здобичі зосередитися? Коли атакувати? Що робити з полоненими — принаймні після того, як чоловіки з ними розберуться?\n\nОднак ми знайдемо відповіді. До великого вибору можна звикнути!"

DRL_rally_the_lads: "Зберіть хлопців"
DRL_rally_the_lads_desc: "Якщо ми збираємося на рейд, нам потрібно підбадьорити хлопців!\n\nМи скажемо офіцерам, щоб вони пообіцяли їм все, що вони захочуть — гроші, жінок, алкоголь, кров, що завгодно! Чи отримають вони це, залежить від них самих, від того, наскільки вони агресивні, жорстокі та спритні. І, звичайно, коли вони знайдуть такі речі, їм доведеться покласти їх в інвентар, щоб правильно розподілити.\ Але вони отримають свою частку. Частку, на яку вони заслуговуют"

DRL_spread_the_spoils: "Розподіліть здобич"
DRL_spread_the_spoils_desc: "Наш рейд був дуже успішним, і ми отримали навіть більше здобичі, ніж сподівалися!\ n\nНастав час розподілити багатство, і, можливо, цього разу ми трохи збільшимо їхню частку. Дайте їм трохи більше алкоголю, ще кілька золотих монет, одну-дві жінки для задоволення і повну свободу дій щодо деяких інших полонених і предметів.\n\nДеякі з наших офіцерів можуть бути трохи незадоволені, але навіть вони повинні розуміти, що важливо дбати про задоволення бійців"

 DRL_lick_our_wounds: "Злизуємо рани"
DRL_lick_our_wounds_desc: "Наші рейди були успішними, але це не означає, що вони не мали наслідків. \n\nЯк завжди, ми втратили людей. Обладнання зносилося, табори були покинуті тощо. Звичайно, ми скоро знову вирушимо в дорогу, але тільки дурень діє без підготовки. Тому ми зробимо перерву. Ми відпочинемо, відремонтуємо обладнання та визначимо нові цілі.\n\nА потім знову вирушимо в дорогу"

DRL_deep_in_the_west: "Глибоко на заході"
DRL_deep_in_the_west_desc: "На заході лежить Оренбург. Ідеальна ціль. Їхня оборона хаотична і нескоординована, їхні ополчення далеко не такі ефективні, як у Уральської ліги, а їхні поселення переповнені здобиччю, готовою до збору. З такою кількістю факторів на нашу користь, чому б нам не взяти їх наступною ціллю? Ми негайно підготуємо наш рейдовий загін. Час вирушати!"

 DRL_penetrate_the_mountains: "Проникнення в гори"
DRL_penetrate_the_mountains_desc: "Ми знову звертаємо погляд на землі Уральської ліги для нашого наступного рейду.\n\nВони все ще не оговталися від поразки під Новотроїцьком і продовжують чинити нам опір на кожному кроці. Вони залишаються нашими найгрізнішими ворогами, але атмосфера сили, яку вони колись мали, значно розсіялася. Ми знову вдаримо по них, поки вони ще слабкі, і заберемо все, що у них залишилося"

DRL_the_pincer: "Щипці"
 DRL_the_pincer_desc: "Існує третій варіант: атакувати Оренбург і Уральську Лігу одночасно! Такий крок буде складним і, крім того, дуже ризикованим, але якщо ми переможемо, якщо ми розгромимо і розіб'ємо їхні сили, ми отримаємо стільки всякої здобичі, що не знатимемо, що з нею робити. І не тільки це, ми вселимо страх у весь Південний Урал.\n\nБригаду не можна зупинити, і ми це доведемо!"

DRL_reap_the_spoils: "Збирай трофе"
 #DRL_reap_the_spoils:1 "Punish the Failures"
 DRL_reap_the_spoils_desc: "Останнім часом ми захопили все, що не було прибито цвяхами, на Південному Уралі — і навіть деякі речі, що були прибиті! Адже життя — це не тільки грабунки, а й насолода вином і жінками, які супроводжують їх! Не забудьте скористатися цим і ними до кінця!\n\nМи можемо і будемо завжди йти і здобувати ще більше"
 #DRL_reap_the_spoils_desc:1 "We have burned down central Russia, and for what? Failure? Russia is a harsh place, full of hard men. If you can't stand up to that, you're through here. I think it's time for a good old Roman-style decimation, don't you?"

 DRL_honor_the_deal: "Дотримуйся угоди"
DRL_honor_the_deal_desc: "Настав час знову укласти угоду з Лисенком. У нас і без того вистачає ворогів, щоб додавати до них ще й Чорну Гору, і ми дамо зрозуміти, що будемо дотримуватися угод, коли це нам вигідно.\n\nОтож, саме так і зробимо. Ще одна угода. Настільки справедлива, наскільки це можливо на Південному Урал"

 DRL_demand_double: «Подвійна вимога»
DRL_demand_double_desc: "Настав час знову укласти угоду з Лисенком. Більше зброї. Більше тренувань. Більше всього. Чому б і ні? Він, мабуть, має більше, ніж показує, незалежно від того, скільки ми вже витиснули з нього. Подивимося, скільки ми зможемо витягнути з запасів Чорної гори цього разу.\n\nА також подивимося, скільки у нього залишилося, перш ніж він перестане бути корисни"

 DRL_prepare_for_the_final_battle: "Готуйтеся до фінальної битви"
DRL_prepare_for_the_final_battle_desc: "Час настав.
Ми раз за разом наносили удари по Уральській лізі, але вона все ще стоїть на ногах. Вона все ще бореться з нами при кожній нагоді. Вони все ще, до нестями, дають людям надію, що вони можуть протистояти нам. Проти Бригади! Більше ні. Ми підготуємо останній удар, щоб назавжди покінчити з цими боягузами.\n\nІ коли вони зникнуть, люди, які вважали себе в безпеці під їхнім захистом, дізнаються, на що ми насправді здатні!"

DRL_ready_our_men: "Готуйте наших людей"
 DRL_ready_our_men_desc: "Якщо є щось, чим проклята Уральська Ліга володіє в надлишку, то це людські ресурси. Необхідно дотримуватися дисципліни, і кожен чоловік з бригади повинен бути готовий, вирваний з обіймів своєї останньої завоювання або повернутий з будь-яких особистих суперечок, які вони залишили, щоб вирішити.\n\nРозв'язка наближаєтьс"

DRL_gather_our_guns: "Зберіть нашу зброю"
DRL_gather_our_guns_desc: "Будь-яка серйозна битва з Лігою вимагатиме всієї зброї, яка у нас є. Сказати, що бійці бригади жорстко поводяться зі своїм спорядженням, було б величезним заниженням, тому ми повинні переконатися, що кожна одиниця зброї, яка у нас є, працює, приписана до бійця і знаходиться в ідеальному стані. Ми не можемо нічого залишати на волю випадку, коли йдемо на Лігу — у нас буде тільки один шанс"

 DRL_sound_the_horn: "Звук рогу"
DRL_sound_the_horn_desc: "Ми провели роки на цих землях навколо Орська, терплячи атаки з усіх боків.\n\nВід наших колишніх так званих товаришів по Вітчизні. Від наших боягузливих російських сусідів. Від жалюгідних селян, які наважуються давати відсіч. Більше цього не буде. Ми стали сильнішими, а вони ослабли. Час бездіяльності минув. Настав час протрубити в ріг.\n\nНехай почнеться полювання! Вперед!"

DRL_bang_the_drum: "Бий у барабан"
DRL_bang_the_drum_desc: "Ми йдемо за нашими ворогами, і ми повинні дати їм про це знати.\ n\nМи будемо тренувати наших воїнів на очах у тих, хто, як ми знаємо, спостерігає за нами, і дамо зрозуміти, що готуємося до грабежів, вбивств і всього іншого. Ми гордо проголосимо, що збираємося вирушити в похід і що ніщо, що вони роблять, ніщо, що вони кажуть, і ніщо, що вони пропонують, не врятує їх від того, що на них чекає.\n\nВони вже мертві. Просто ще не знають про ц"

 DRL_destroy_the_league: "Знищити Лігу"
DRL_destroy_the_league_desc: "Настав час. Нарешті, після стількох набігів і стількох битв, настав час. \n\nМи дуже довго готувалися до знищення Уральської Ліги, і тепер настав час вирушати в похід. І ми не задовольнимося грабунком брудних сіл, ні, ми не зупинимося, поки всі їхні фортеці не будуть у вогні, всі їхні бійці не будуть мертві або розсіяні, а всі їхні багатства і жінки не будуть зібрані. Ми не зупинимося, поки Ліга не стане лише спогадом.\n\nІ коли вони зникнуть, веселощі можуть по-справжньому початись"

 DRL_a_hollow_victory: "Порожня перемога"
DRL_a_hollow_victory_desc: "Уральська Ліга переможена, а гори охоплені полум'ям, але святкування немає. Хоча деякі члени бригади хочуть негайно помститися за цю образу, ми зараз не в змозі з ним боротися. Ми візьмемо те, що зможемо, і поки що підемо. \n\nАле ми не забудемо. І Лисенко заплатить єдину ціну, яку можна заплатити за те, що відмовив рейдеру в його здобич"

 DRL_loot_and_burn: "Грабуй і пали"
DRL_loot_and_burn_desc: "Ліга розгромлена!\n\nЇхні колишні землі та всі люди, що на них мешкають, відкриті для грабунку. На нашому шляху більше немає нікого, хто міг би нам завадити, і тепер ми можемо розважитися. Забирайте їхні цінності, викрадайте їхніх жінок, вбивайте всіх, хто стоїть або стояв проти нас, і спалюйте їхні села.\n\nСпалюйте все!"

DRL_pillage_the_fortresses: "Розграбуйте фортеці"
DRL_pillage_the_fortresses_desc: "Фортеці Уральської Ліги досі були майже неприступними. Тепер це не так.\ n\nЗ розпадом Ліги їхні колишні фортеці стали відкритими, і, оскільки вони так довго залишалися недоторканими, вони наповнені зброєю, грошима та багато чим іншим. Настав час збирати трофеї.\n\nМи заберемо все, що не прибито цвяхами, а решту спалимо для прикладу!"

DRL_harry_the_stragglers: "Переслідуйте відсталих"
 DRL_harry_the_stragglers_desc: "Люди біжать. Як здобич, якою вони і є.\n\nЗ падінням Ліги тисячі тих, хто раніше перебував під її захистом, намагаються втекти в будь-якому напрямку, несучи з собою все цінне, що мають. Настав час діяти. Вночі ми наскочимо на них. Ми вб'ємо їхніх чоловіків, заберемо їхніх дітей і будемо використовувати їхніх жінок як заманеться. Нехай ті, хто виживе, хоч їх і небагато, поширюють страх далеко і широко.\n\nСтрах перед нами"

DRL_chase_the_scraps: "Переслідуйте залишки"
DRL_chase_the_scraps_desc: "Лисенко, цей виродок, вкрав у нас Урал.\ n\nІ він, і кожен з божевільних «вчених», які йдуть за ним, заплатять за це. Дорого. А до того часу ми зосередимося на тому, що ще можна врятувати від цієї зради. Залишки Ліги все ще присутні, вони або намагаються втекти, або блукають у розгубленості, і ми можемо забрати трохи здобичі з їхніх решток.\n\nАле з часом ми повернемо те, що по праву належить нам"

 DRL_pillage_orenburg: "Розграбування Оренбурга"
DRL_pillage_orenburg_desc: "Оренбург є єдиною перешкодою, що залишилася між Бригадою та великими російськими мисливськими угіддями на заході. Ми нападемо на їхні комуни, зруйнуємо їхні оборонні споруди, вб'ємо всіх, хто чинитиме опір, заберемо все, що вони мають, і використаємо те, що залишиться від їхніх поселень, як бази для подальших набігів на більш віддалені території. Ми так близько до наших цілей, і ми їх досягнемо"

 DRL_when_the_world_stopped_making_sense: "Світ перевернувся з ніг на голову"
DRL_when_the_world_stopped_making_sense_desc: "Ми це зробили!\n\nІдеальний маленький світ, який анархісти будували в Оренбурзі, перевернувся з ніг на голову. Ми це зробили. Ми взяли те, що хотіли. Тут пануємо ми, а не анархісти, демократи чи як там вони себе називають. І ми покажемо їм, що ми про них думаємо — після того, як візьмемо те, що хочемо, ми спалимо їхнє місто дотла.\n\nНехай горить, все дотла!"

 DRL_salt_the_earth: "Посоліть землю"
DRL_salt_the_earth_desc: "Ми забрали все з Оренбурга. Включно з їхнім урожаєм.\n\nІ тепер, коли він у нас, ми можемо переконатися, що вони більше його не отримають. Ми засиплемо сіллю ті поля, які зможемо, а решту спалимо. Без можливості забезпечити себе продовольством вони не тільки ніколи не зможуть знову повстати проти нас, але й будуть змушені прийняти рішення. Вони будуть служити нам. Або будуть голодувати. Вибір за ними"

DRL_take_the_goods: "Забирайте товари"
 DRL_take_the_goods_desc: "Оренбург, його землі та все, що на них є, належать нам. \n\nБригада забере все, що не прикручено, виявить усі жалюгідні спроби приховати щось, вибере жінок, яких ми хочемо забрати, та визначить чоловіків, яких, на нашу думку, можна найняти на службу. \n\nА якщо хтось чинитиме опір? Стріляйте в них"

 DRL_let_all_know_fear: "Нехай усі знають страх"
DRL_let_all_know_fear_desc: "Страх — це така ж потужна зброя, як і будь-яка гвинтівка.\n\nПісля всіх наших завоювань, всіх наших набігів, всіх наших перемог і всіх наших здобутків, страх супроводжує нас, як і має бути. По всій Росії ми — монстри в ночі. Ми — бугимен. Ми — ім'я, обличчя, якого бояться чоловіки і про яке жінки шепочуть дітям, щоб налякати їх.\n\nМи — втілення страху. І всі про це дізнаються"

DRL_one_last_mark: "Останній слід"
DRL_one_last_mark_desc: "Ми розгромили Оренбург. Ми розігнали Уральську лігу. Залишився тільки один ворог: Лисенко. Божевільний з Чорної гори, колишній благодійник, який став зрадником, який думає, що його оборонні споруди, солдати та божевільні експерименти захистять його від нашого гніву. Він помиляється. І ми почнемо готувати засоби, щоб показати йому це"

 DRL_king_of_the_mountain: "Король гори"
DRL_king_of_the_mountain_desc: "Настав час підкорити Чорну гору. Ми розіб'ємо нечисленних солдатів, які все ще йому вірні, знищимо всі прокляті експерименти, які він може на нас наслати, і витягнемо його та інших вчених з їхніх лабораторій у реальний світ. Він не може нам протистояти. Він не може становити великої загрози.\n\nЧи може?"

 DRL_alexander_wept_but_we_will_ride: "Олександр плакав, але ми поїдемо"
DRL_alexander_wept_but_we_will_ride_desc: "Бригада піднялася з групи розбійників до нових македонців.\n\nМи правляємо Орськом. Ми правляємо Уралом. Степ відкритий для нас, і тепер ми їдемо і завойовуємо, як стародавні греки, з нашим власним Олександром, який веде нас вперед до вина, жінок і незліченних багатств!\n\nРепутація, яку ми тут створили, буде тільки зростати, тому що жоден чоловік, жінка чи дитина не будуть у безпеці. Ми спалимо Германію, розграбуємо Нью-Йорк, пограбуємо Токіо і заберемо все, що захочемо, все, що побачимо. Король і його бандити, вперед!"

DRL_kill_the_german_scum: "Вбийте німецьку наволоч"
DRL_kill_the_german_scum_desc: "Занадто довго Дірлеванґер грабував нашу країну. Більше цього не буде. Він грабував наші села, вбивав наших братів і батьків, ґвалтував наших матерів і сестер і приносив лише страждання кожному росіянину, якого зустрічав. Його треба зупинити. І ми будемо працювати над цим"

 # DRL_organize_the_russians_desc: "Surely the Russians have problems with Dirlewanger. After all, it's their country he's been trying to rape." #duplicate loc key

 DRL_organize_the_kazakhs: "Організуйте казахів"
DRL_organize_the_kazakhs_desc: "У бригаді є не тільки німці та росіяни.\n\nДірлеванґер скоїв незліченні звірства проти багатьох етнічних груп, включаючи поляків і казахів. Вони, безсумнівно, прагнуть помсти так само, як і ми. Якщо ми підійдемо до них у правильний спосіб і ретельно пояснимо наш план, вони приєднаються до нас. А Дірлеванґер матиме набагато менше людей, коли настане час"

DRL_pay_the_mercenaries: "Заплатити найманцям"
DRL_pay_the_mercenaries_desc: "Дірлеванґер найняв найманців. Молодець. Але він не врахував одного дуже важливого моменту: якщо людину можна змусити вбивати і грабувати за гроші, то її також можна змусити зрадити тих самих людей, які їй за це платять. Ми запропонуємо найманцям більше — або безпосередньо, або у вигляді здобичі, яку вони зможуть забрати — і забезпечимо їхню лояльність. Таким чином, Дірлеванґер стане ще більш ізольованим, ніж є зараз"

 DRL_poison_the_germans: "Отруїти німців"
DRL_poison_the_germans_desc: "Найбільш відданими Дірлеванґеру є німці, які слідували за ним аж із Рейху.
Вони також відповідальні за найогидніші злочини проти нашого народу, тому з ними треба розібратися. Ми зробимо це обережно, дочекавшись завершення наступного рейду і отруївши весь алкоголь, який вони награбували.\n\nКоли вони будуть помирати в муках, вони не тільки відчують найменшу частину того, що вони заподіяли Росії, але ми також усунемо останню, вирішальну перешкоду на нашому шляху до самого Дірлеванґера"

 DRL_kill_the_scum: "Вбий негідника"
DRL_kill_the_scum_desc: "Настав час Дірлеванґеру померти. Він — легка мішень, як ті, про яких він так часто говорить, що їх потрібно атакувати, щоб отримати легку здобич.\n\nНастав час йому дізнатися, як це — бути на їхньому місці"

#Нижче, здається, застаріле?
DRL_galvanize_soldiers: "Згуртувати солдатів"
DRL_galvanize_soldiers_desc: "Переговори»? Ха! Той млявий комуніст Лисенко краще впаде і помре перед натовпом смердючих селян під своєю маленькою гірською халупою, ніж віддасть нам нашу справедливу частку в чомусь! І яка взагалі користь Рейху від таких виродків, як він? Ми й раніше чудово справлялися самі, особливо без варварів-слов'ян, які нас стримували. n\nЗ іншого боку, кожна додаткова зброя, спрямована на наших хлопців, — це на кілограм менше здобичі з Уралу, і їм доведеться зіткнутися з набагато більшою кількістю ворогів, ніж якби ми мали орду червоних, які б змушували селян озиратися, поки ми атакуємо їхній фронт. Може, варто провести з ними більше навчань, ніж зазвичай, щоб вони знали, чого очікувати, правда?"

 DRL_refocus_strategy: "Переорієнтувати стратегію"
DRL_refocus_strategy_desc: "Ми, як ніхто інший, будемо останніми, хто буде говорити про «порядок», «протокол» та іншу священицьку фігню. Бригада не дбає про це; чорт забирай, багато наших хлопців приєдналися до нас, щоб утекти від цього! І чому ми повинні це робити? Покидьки Дірлеванґера процвітають у кривавому, екстатичному хаосі, що панує на півдні Уралу — втручатися в це було б все одно, що відрізати собі ногу, щоб мати що їсти взимку. Для зграї голодних собак, якою є бригада, важливо мати якийсь спосіб уникнути хаосу і сварок після рейду. Деякі стандарти можуть бути найефективнішими саме тут, якщо ніде більше, тому що всі знають, що отримають свою частку, а вбивати своїх «союзників» означає лише те, що ти не отримаєш свою частку. Це урок, який чоловіки будуть охоче вивчати... або ж інакше"

 DRL_reaffirm_duty: "Підтвердити обов'язок"
DRL_reaffirm_duty_desc: "До нашої уваги потрапило, що деякі з наших людей... ні, це слово занадто лагідне для них. Деякі з цих покидьків, які навіть не гідні бути послідом своїх повій-матерів, дезертирують зі своїх постів. Ми знайшли одного такого, який, за мить до того, як ми вистрілили йому мізки, але після того, як відрізали пальці, розповів нам, що серед рядових солдатів панує загальне невдоволення. Ці невдячні лайдаки незадоволені керівництвом Дірлеванґера та його довірених підлеглих. Вони помруть повільною і публічною смертю, але більша проблема залишається. Ми не можемо вбити всіх, хто в нас сумнівається, хоча це нам би дуже сподобалося. Ні, ми мусимо вдатися до набагато менш цікавої тактики: купувати їхню лояльність. Збільшення частоти наших рейдів збільшить кількість здобичі, яку ми маємо розподілити, і якщо деякі з цих сумнівних Томасів в результаті загинуть, то тим краще"

 DRL_truck_upgrade: "Модернізація вантажівки"
DRL_truck_upgrade_desc: "Як відомо, будь-яка поважаюча себе бандитська група обов'язково повинна мати достатню кількість коней, щоб пересуватися верхи. На жаль для нас, коні просто непрактичні в суворих умовах цих проклятих крижаних гір. Ми знаємо це, бо вже пробували, але без успіху. Проте, якщо звичайні коні не підходять, ми завжди можемо звернутися до чудес техніки, які допоможуть нам! Саме так, наші коні будуть металевими, і замість сіна вони будуть їсти паливо, перевозячи нас від міста до міста в наших веселих маленьких «пригодах». Залишається одна невелика проблема: всі наші вантажівки вже старіють, і ми навіть не можемо їх розводити... Але це не проблема, яку не можна вирішити за допомогою трохи фізичної сили! Так, фізичної сили — яка в цьому випадку є пістолетом, направленим на голову того нещасного бастарда, якому цього місяця доручили технічне обслуговування — і ми в найкоротші терміни будемо мчати по південному Уралу з рекордною швидкістю."

 DRL_raid_harder: "Рейдіть жорстокіше"
DRL_raid_harder_desc: "Що це, блядь, за хрінь!? Ви називаєте себе бандитами, але поводитеся, як старі діви! Якби Ганс не приїхав з підкріпленням, ви, суки, всі б загинули, і ви б заслужили це за своє жалюгідне видовище. Ви думаєте, що така поведінка дає вам право на якусь частину здобичі? Помиляєтеся. Ви, повні ідіоти, заслуговуєте на кулю в свої товсті як лайно черепи, якщо не почнете швидко виправлятися. Ми марнуємо на вас, черв'яки, їжу та боєприпаси, а ви так віддячуєте своїм командирам? Під час наступного рейду я хочу бачити якісь результати, я серйозно. Я хочу бачити хатини, пофарбовані кров'ю і полум'ям, і сиріт, які кричать від страху. Ви думаєте, ми протримаємося місяць, якщо Ліга вирішить, що ми розм'якшилися? Ви думаєте, що той козел у горах продовжить постачати нам хороше лайно, якщо він вирішить, що ми його марнуємо? Мабуть, ви вірите в це і в тисячу інших казок, з огляду на те, наскільки ви здаєтеся дурними. Забирайтеся з моїх очей і наступного разу покажіть якісь результати, чорт забирай!"

 DRL_support_units: "Підрозділи підтримки"
DRL_support_units_desc: "Досі наша здатність розбивати вщент наших звичайних цілей не була обмежена загальною відсутністю тактичної підтримки. Досі. Однак ми вже не дуже зацікавлені в таких дрібних трофеях. Захопити великі міста і навіть міста з реальною обороною буде неможливо з тією розрізненою структурою, в якій зараз організована наша бригада. Нам потрібно розшукати біноклі, медичне обладнання та інженерні інструменти. Наші вороги, природно, будуть нас недооцінювати, думаючи, що ми не маємо можливості протистояти їм на рівних. Ми підготуємо для них неприємний сюрприз"

 DRL_better_guns: "Кращі зброї"
DRL_better_guns_desc: "Тут зброя для чоловіка — найближчий друг, кращий за будь-яку жінку. Ми вірно носили свою зброю з часів Західної Росії, коли нас покинули ці виродки з Германії. Ну, після десятиліття використання тих самих зброї, більшість з яких були застарілими навіть на момент нашого висадження, людина дуже прагне чогось нового і свіжого. Прикро це визнавати, але наша нинішня зброя вже не підходить. Проте вона заслуговує на краще, ніж просто утилізація. Як компромісне рішення, сам Дірлеванґер запропонував залишити наші старі інструменти розваг і захоплення через їхню сентиментальну цінність, а нове обладнання купувати у наших контактів. Єдине, що краще за зброю, — це нова зброя"

DRL_use_the_prisoners: "Використовувати полонених"
DRL_use_the_prisoners_desc: "Наші вороги завжди оббріхують нас, називаючи жорстокими вбивцями та психопатичними м'ясниками, але це просто неправда. Насправді, у нас є цілий лабіринт кліток, повних людей, які цілком живі, щоб це довести. Звичайно, стандартною практикою було страчувати їх для розваги, коли нам не було чого робити, але суть залишається: ми беремо полонених. Насправді, кількість полонених значно зросла з тих пір, як було прийнято рішення уникати марнування боєприпасів під час дрібних рейдів, і це поставило проблему: що, чорт забирай, нам робити з цими людьми. Після ночі пиятики та бурхливих академічних дискусій ми, здається, знайшли рішення. Залучити їх до роботи! Якщо вони можуть звільнити деяких наших хлопців від ручної праці та забезпечити прикриття на полі бою, то чим більше, тим краще, як ми кажемо. Якщо хтось із них виживе кілька тижнів, то їх навіть можна буде офіційно завербувати. Усі виграють!"

 DRL_on_all_sides: "З усіх боків"
DRL_on_all_sides_desc: "Минуло вже близько десяти років, відколи нас підставило вище командування. Якби ми коли-небудь повернулися, що б ми зробили з тими виродками... Але зараз у нас є більш серйозні проблеми, ніж мрії про солодку помсту. Насправді, багато проблем, які тримають нас у клітці під назвою Росія. Будь то слов'янські собаки на півночі чи степові собаки на півдні, у нас є дворняги, які намагаються атакувати нас з усіх боків. Вони добре знають, який біль ми можемо їм заподіяти, тому в основному обмежуються контратаками, хоча вони ніколи не досягали такого успіху, як ми. Наші амбіції в минулому також не були більшими, але останнім часом Дірлеванґер висловлює бажання зробити кілька більших кроків, але це все-таки лише слова. Поки що."

 DRL_reaffirm_dirly_power: "Підтвердити владу Дірлеванґера"
DRL_reaffirm_dirly_power_desc: "Оскар Дірлеванґер — це найближче до бога для членів цієї бригади, без жодних застережень і обмежень. Неважливо, що дехто каже, що він занадто старий, або що він п'яниця, або навіть божевільний. НЕ ставіть під сумнів його авторитет, якщо виживання є пріоритетом. Дехто з нас, здається, забуває це дуже просте правило. Вони думають, що знають краще; вони вважають, що повинні бути керівниками, а Дірлеванґер вже віджив своє. Вони скоро дізнаються правду. Дірлеванґер не вижив би як керівник прославленого штрафного батальйону, що перетворився на бандитську армію, не знаючи, коли потрібно вдарити батогом, і батіг скоро буде вдарити сильно. Ми виберемо найбільш непокірних офіцерів, тих, хто претендує на командування, і витягнемо їх з ліжок з криками, а потім вистрілимо їм мізки, щоб усі знали, до чого може призвести навіть думка про заколот"

 DRL_maintain_order: "Підтримувати порядок"
DRL_maintain_order_desc: "Бригада — це різношерста зграя колишніх злочинців, які стали німецькими солдатами, а потім бандитами, і покидьків з півдня Уралу, яким також нікуди звернутися в «цивілізованому» суспільстві. Коротше кажучи, вони — кляті тварини, і, як тварини, потребують постійного нагляду, щоб не вийшли з-під контролю. Улюблений метод Дірлеванґера — тримати всіх у тонусі: якщо ти швидше загинеш за порушення дисципліни, ніж у бою, то не будеш порушувати дисципліну. Принаймні так стверджує Дірлеванґер, коли він достатньо тверезий, щоб говорити зв'язно. Проте, хтось колись сказав, що медом ловиш більше мух, і, можливо, він мав рацію. Можливо, хлопцям пішли б на користь одна-дві підбадьорливі промови. Розкажіть їм про здобич, наркотики та жінок, які вони отримають, якщо просто залишаться з нами, і, можливо, ми зможемо продовжувати цю справу якомога довше."

 ### Події ###
 DRL.01.t: "Бригада Дірлеванґера"
 DRL.01.desc: "36-та дивізія СС «Ваффен-Гренадієр», більш відома як бригада Дірлеванґера, а зараз як «Чорні бандити», є однією з найвідоміших формувань, що коли-небудь існували. n\nСформована з злочинців, божевільних, колабораціоністів та всіх інших, хто був достатньо жорстоким, щоб приєднатися до неї, вона спочатку була призначена для боротьби з повстанцями, але швидко заробила таку жорстоку репутацію, що навіть інші підрозділи СС не хотіли мати з нею нічого спільного. n\nПісля Західно-Російської війни та провалу спроби державного перевороту Гіммлера під керівництвом СС бригада втекла через східні кордони Рейху, випередивши підрозділи Вермахту, відправлені Шпайделем для їх роззброєння. Оселившись в околицях міста Орськ, бригада створила грабіжницьке «державу» бандитів, яка з того часу тероризує і жорстоко поводиться з населенням Південного Уралу, грабуючи його і використовуючи німецьке спорядження та підготовку, що дають їй вирішальну перевагу. n\nБригада, яку всі навколо бояться і ненавидять, має три основні цілі: здобувати здобич і грабувати навколишніх, утверджувати свою верховенство в регіоні і, зрештою, повністю розграбувати місто Оренбург.\n\nЗ огляду на хаотичний характер Росії в цілому і Південного Уралу зокрема, вони цілком можуть досягти успіху, якщо тільки хтось із їхніх ворогів не придумає спосіб їх зупинити..."
 DRL.01.a: "Російська кров буде проливатися"

 DRL.50.t: «Розграбування Оренбурга»
DRL.50.desc: «Оренбург, нарешті, пав. Масове вбивство майже повне: десятки тисяч людей загинули від наших рук, тисячі інших напевно помруть від холоду або голоду, а ще більше розбіглися по селах і поселеннях, які ще не торкнулися, але це не триватиме довго. \n\nКоли втікаючих захисників переслідують казахські вершники бригади, а ріки крові течуть з розграбованого міста, всі дізнаються про неминучу долю тих, хто заперечує нам нашу здобич! І всі також знатимуть, що ми не зупинимося на цьому. Вся Росія буде кровоточити, поки ми не закінчимо! За грабунок! За бригаду! За Дірлеванґера!
DRL.50.a: «Світ належить нам!»

#Here Lies Old Dirly Death Events 2018-2019
 DRL.162.t: "Зрада Чорної гори"
DRL.162.desc: "Спочатку зустріч із цими гірськими виродками мала оптимістичний характер. Дірлеванґер отримав запрошення, написане особисто Лисенком, накидане поспішним німецьким помаранчевим пергаментом. Звичайно, Дірлеванґер розкусив цю фарсу і вирішив потішити божевільного вченого своєю присутністю. Спочатку зустріч здавалася привітною за уральськими мірками: одинокий стіл посеред тундри і таємниче м'ясо, що коптилося над скромним багаттям. Навіть люди Лисенка були приємними, пропонували розмову і фальшиві посмішки. Однак все змінилося в одну мить, коли скажені собаки Лисенка випустили свою лють на бригаду. Серед стрілянини та хаосу Дірлеванґеру вдалося заскочити в кабіну вантажівки бригади і, під прикриттям вогню своїх товаришів по бригаді, втекти без поранень. Для всієї бригади було великим полегшенням, коли він повернувся як єдиний, хто вижив після цього жахливого обману. Одне можна сказати напевно: відносини між цими божевільними гірськими жителями та нашою бригадою різко погіршилися."
 DRL.162.a: "Знову перехитрили!"

DRL.200.t: "Пропустили декількох"
DRL.200.desc: «Оскар Дірлеванґер, лідер сумнозвісної бригади Дірлеванґера, був вчора вбитий групою партизанів. Коли він прямував на зустріч з Лисенком, невелика група колишніх партизанів НКВС влаштувала засідку на нього та його людей, вбивши самого Дірлеванґера, а також кількох членів бригади. \n\nХоча бригада помстилася селу, де це сталося, без Дірлеванґера на чолі вона практично розпалася. Різні угруповання вже почали відокремлюватися, щоб тероризувати Урал, хоча, ймовірно, вони не знайдуть притулку ніде в Росії».
DRL.200.a: "Гідний кінець для цього божевільного"

DRL.201.t: "Випробовуючи наших ворогів"
 DRL.201.d: "Зусилля Дірлеванґера та старших офіцерів бригади з підготовки до наступного великого рейду були успішними. n\nПерший і найамбітніший варіант — завдати удару по землях навколо Оренбурга, покладаючись на ефект несподіванки та майстерність, щоб подолати їхню оборону та зруйнувати ілюзію їхньої сили. Другий і більш очевидний варіант — поселення, пов'язані з Уральською лігою. Ми майже постійно воюємо з Лігою, і нанесення удару по їхньому моральному духу та ресурсах буде дуже корисним у майбутньому. n\nНарешті, як третій варіант, Лисенко повідомив нас, що його сили не втручатимуться, якщо ми проведемо рейд проти селянських громад на його території, ймовірно вважаючи це можливістю захопити бажаних полонених, не викликаючи при цьому заворушень проти себе. Вони навряд чи чинитимуть реальний опір, але незрозуміло, чи можна буде від них багато чого отримати.\n\nПроте, незалежно від цього, рішення має бути прийнято."
 DRL.201.a: "Хто б ми не вибрали, він загине!"
DRL.202.t: "Удар по Оренбургу"
DRL.202.d: "Дірлеванґер вирішив: бригада вирушає на Оренбург.\n\nНе на саме місто — ми ще не готові до цього — а на містечко, розташоване неподалік від кордону. Напад має на меті не тільки захопити всі багатства і полонених, які може надати місто, але й перевірити загальні оборонні можливості держави в цілому. Очікується, що хоча окремі громади, такі як місто, можуть чинити сильний опір, хаотична природа анархізму не дозволить підкріплення прибути в розумні терміни. Побачимо. У будь-якому разі, обіцянка крові та грабежу збудила всіх чоловіків, які з нетерпінням чекають на майбутню битву та розподіл здобичі, який неодмінно послідує за нею."
DRL.202.a: "Готуйте людей!"

 DRL.203.t: "Удар по Оренбургу — рейд вдався!"
DRL.203.d: "Наш рейд на Оренбург, як і сподівалися, був цілковитим успіхом. Невеликий загін відволікав увагу оборонної міліції і виманював її з укріплених позицій, а коли ця мета була досягнута, наші основні сили під командуванням самого Дірлеванґера напали на них з засідки.\n\nБій був коротким, міліція була швидко розгромлена і знищена, а козаки і казахи з бригади розстріляли тих небагатьох, хто намагався втекти. Потім їхня увага, як і увага решти військ, була спрямована на саме місто. Після цього мешканці, яких вважали занадто старими, молодими, хворими або такими, що не варті зусиль для транспортування, були зібрані в ратуші, яку потім спалили разом з рештою поселення. Всі цілі бригади були досягнуті — грабунок, вбивства, полонені та терор — і з поширенням чуток про цей напад наша страхітлива репутація може тільки зростати."
 DRL.203.a: "Вогонь чи Лисенко — що гірше?"

DRL.204.t: "Удар по Оренбургу — рейд провалився!"
DRL.204.d: "Атака на Оренбург була відома як ризикована, і цього разу ризик виявився занадто великим. Атака бригади провалилася. Повністю. \n\nДесь сталася помилка, через яку комуна якось дізналася про наш майбутній рейд і змогла до нашого прибуття забезпечити собі значне підкріплення. Наші спроби відволікти увагу і влаштувати засідку були повністю невдалими, і коли наші основні сили вийшли з укриття, вони відразу ж потрапили під вогонь з попередньо націлених кулеметів і перехресного вогню. n\nПольовий командир, очевидно охоплений люттю, наказав продовжувати наступ, і хоча наші бійці зрештою подолали зовнішні оборонні споруди комуни, вони зазнали жахливих втрат і незабаром були розгромлені додатковими силами міліції, укріпленими в самому місті. Мабуть, знаючи, що ми приготували для них у разі перемоги, дуже мало хто з наших бійців зміг втекти, більшість з них були застрелені під час втечі. n\nСам Дірлеванґер розлючений і наказав розстріляти командира, який віддав наказ про наступ, а також усіх його старших підлеглих, які вижили.\n\nХоча бригада може з часом відновити свою чисельність і озброєння, поки що невідомо, чи зможемо ми відновити нашу страхітливу репутацію, яка постраждала від цієї поразки."
DRL.204.a: "Поразка, без сумніву"

 DRL.205.t: "Удар по Уральській лізі"
DRL.205.d: "Дірлеванґер вирішив: бригада вирушає на Уральську лігу.
Ліга давно є нашим найзапеклішим ворогом, і багато наших бійців втратили своїх товаришів у боях з нею, що викликає великий ентузіазм щодо будь-яких дій, спрямованих на завдання їй шкоди. Ця шкода незабаром буде завдана, оскільки наші розвідники визначили чудову ціль: окуповану в'язницю, яку Уральська гвардія використовує для навчання нових рекрутів міліції методам оборони села. Хоча гвардія завжди бореться з рішучістю, а інструктори та старші кадри, присутні у в'язниці, безсумнівно, будуть робити це ще більш рішуче, цю можливість не можна ігнорувати. Вбивши їхніх новобранців, ми не тільки підірвемо моральний дух їхніх рядових, але й можемо відрадити інших приєднуватися до них. Крім того, наші власні бійці отримають чудовий бойовий досвід, а також вдосконалять свої техніки атаки укріплень і споруд Ліги. Напад розпочнеться незабаром. До перемоги!"
DRL.205.a: "Ми вриваємося до в'язниці?"
 DRL.206.t: "Удар по Уральській лізі — рейд вдався!"
DRL.206.d: "Багато хто з бригади вважав ідею нападу на в'язницю іронічною, але все одно підійшов до неї з майстерністю і рішучістю, які зробили нас страшними для всього Південного Уралу. n\nГлибокої ночі фахівці з проникнення, колишні члени Ваффен-СС, проникли через каналізаційну систему в'язниці і скоординували свій напад з нашим головним загоном зовні. Піддавшись атаці зсередини і ззовні, Уральська гвардія була швидко розгромлена, багато хто навіть не встиг дістати свою зброю. n\nХоча ми здобули перемогу, здається, що гвардія передбачила навіть такий розвиток подій, оскільки наші бійці, просуваючись у фортецю, виявили покинуті оборонні позиції та сліди існування декількох шляхів відступу. Шляхи відступу, які були використані, коли стало ясно, що ми перемагаємо.\n\nХоча в результаті ми завдали гвардії набагато менше втрат, ніж очікувалося, ми захопили як базу, так і зброярні, що знаходилися в ній. Ми також довели, що навіть найпотужніші фортеці Гвардії не захищені від нас.\n\nПідкреслюючи цей факт, Дірлеванґер наказав зняти шкіру з кількох полонених і повісити їх на стінах, після чого ми підпалили будівлі і відступили з захопленою здобиччю. Ми довели свою правоту.\n\nПоки що."
DRL.206.a: "Гвардія не є непереможною."

 DRL.207.t: "Удар по Уральській лізі — рейд провалився!"
DRL.207.d: "Хоча ми ще не маємо всієї інформації, ситуація зрозуміла: наш удар по Уральській лізі не досяг своєї мети. Повністю. n\nЗа всіма даними, напад спочатку був успішним: колишні фахівці з проникнення Ваффен-СС проникли до в'язниці і координували свій удар по гарнізону з нашим основним нападом. Однак вони не змогли вчасно захопити критично важливі точки, включаючи радіостанцію та зброярню, щоб запобігти зміцненню позицій захисників.\n\nВ результаті напад перетворився на криваву бійню, і кожна позиція була захоплена нашими силами лише після жорстоких боїв у ближньому бою. Хоча технічно ми «виграли», захопивши фортецю після багатьох годин і жахливих втрат, цю перемогу важко назвати такою. \n\nБагато наших найкращих бійців загинули, все цінне було витрачено або знищено в боях, а історія про «хоробрість» гвардії, яка протистояла нашій атаці, вже поширюється і, без сумніву, надихне на жорсткий опір в інших місцях. За цю поразку буде, має бути розплата. \ n\nДірлеванґер подбає про це"
DRL.207.a: "Безсумнівно, буде ще більше смертей"

DRL.208.t: "Удар по селянам"
DRL.208.d: "Дірлеванґер вирішив: бригада вирушить на селянські поселення навколо Магнітогорська. n\nХоча це не особливо небезпечний — або вигідний — ворог, і тому не здатний викликати у наших бійців звичайну агресію та ентузіазм, які зазвичай бажані для рейду, ніхто не може і не наважиться стверджувати, що це не безпечний вибір.\n\nХоча в селах не буде багато чого забрати, крім самих людей, вони принаймні повинні забезпечити хороше розвага і дозволити нам уникнути зайвого планування. Лисенко вже повідомив нас, що його сили не втручатимуться, тож нам доведеться турбуватися лише про жалюгідну міліцію, яку селяни спробують зібрати.\n\nНастав час взятися за криваву, а іноді й монотонну роботу — вбивати тих, хто не може дати відсіч"
DRL.208.a: "Безпечний вибір"

DRL.209.t: "Удар по селянам — рейд вдався!"
DRL.209.d: "Як і очікувалося — альтернатива була смішною навіть для розгляду — наш рейд на селян Магнітогорська був цілковитим успіхом. Бригада накинулася на них, як сарана, часто не більше ніж натовп і без будь-якої реальної тактики, бо вона не була потрібна. Все цінне, хоч і небагато, було захоплено, а мешканці сіл були оброблені. Здорових чоловіків і жінок, або принаймні тих жінок, які залишилися здоровими після того, як наші чоловіки закінчили, завантажили для транспортування до Чорної гори, а тих, кого визнали непридатними, зарізали. Дітей ми залишимо собі, як нових рекрутів, адже ті, хто піддається впливу молоді, завжди потрібні. Хоча ми не можемо назвати цей напад великою перемогою, і він, ймовірно, буде забутий з часом, ми можемо принаймні сказати, що отримали вигоду, а для бригади це завжди є метою"
DRL.209.a: "Саме так, як і очікувалося"

 DRL.210.t: "Strike at the Peasants - The Raid Fails!" ###unused event feel free to use the loc and event number
 DRL.210.d: "We have no idea how this went wrong. We sent in some of the most brutal bastards the world has ever seen against simple peasants in one of the most unremarkable villages in Russia and yet somehow we were beaten back. Our commanders for once are not even bickering about whose fault this was, all in a shock of bafflement about how this happened at all. The only thing we are certain of is that for simple peasants the village was oddly well armed, and certain villagers oddly well trained in uncommon weaponry. This has caused speculation that Lysenko might have violated our agreement and in fact sent aid to the village in some sort of power play against us. With our defeat however we have no evidence of this, and Dirlewanger is unwilling to press his suspicions whilst the Ural League and Orenburg still exist. For now, we must just lick our wounds, and prepare for next time."

 DRL.211.t: "Битва за Новотроїцьк"
DRL.211.d: "Незважаючи на всі наші перемоги над Уральською лігою, її гвардією та іншими організаціями, ми ще не досягли вирішальної перемоги. Щось, що може дати нам перевагу у великому масштабі. Тепер це зміниться. Розвідники бригади повідомили, що Уральська гвардія зосередила великі сили навколо промислового міста Новотроїцьк, безсумнівно, з метою захисту видобутку рідкісних і надзвичайно цінних композитних руд, що знаходяться там. Ці руди, без сумніву, мають вирішальне значення для Ліги, як для її власного військового виробництва, так і для торгівлі з метою придбання того, що вона не може виготовити сама. Ми повинні здобути цю нагороду і, відповідно, позбавити її їх. Це буде кривава і важка битва проти деяких з найкращих бійців Уральської Ліги, але нагорода того варта. Сам Дірлеванґер вірить у це, і це, зрештою, має значення. n\nМи підготуємо наш план, вступимо в бій з гвардією, а коли вона впаде, ми накинемося на Новотроїцьк і заберемо все, що там є!"
DRL.211.a: "Готуйте людей!"

DRL.212.t: "Битва за Новотроїцьк — околиці"
 DRL.212.d: "Битва за Новотроїцьк розпочалася, коли наші формування наблизилися до нього, прикриті ранковим туманом, і почали артилерійський обстріл зовнішніх позицій Уральської гвардії.\n\nЗ огляду на важливість битви, Дірлеванґер дозволив використовувати важку техніку та запаси боєприпасів, до яких зазвичай не було доступу, і тому обстріл, що проводився хвилями, був таким, якого, як ми знали, наші вороги не очікували. Коли через три години обстріл закінчився, стало ясно, що оборона супротивника була значно ослаблена. І тоді наші бійці були відправлені вперед. Зовнішні оборонні споруди були швидко захоплені, але наше просування в передмістя Новотроїцька зустріло більш сильний опір: кулеметний вогонь із заздалегідь підготовлених позицій сповільнював наш наступ. Перебуваючи на полі бою, Дірлеванґер наказав розгорнути димові завіси, а команди з вогнеметами успішно спалили кулеметні гнізда. Хоча для повного закріплення решти околиць знадобилося ще кілька годин, результат був неминучим, і командний пункт бригади був перенесений вперед, в очікуванні наступного наступу, в промислові райони попереду."
DRL.212.a: "Сьогодні буде хороший день"

DRL.213.t: "Битва за Новотроїцьк — промисловий район"
DRL.213.d: "Наступ на промислові райони Новотроїцька був критично важливим, оскільки, як бригада часто дізнавалася на власному гіркому досвіді, Уральська гвардія швидше знищить те, що має, ніж дозволить нам забрати це як трофей. n\nОтже, наш наступ на район розпочався, щойно ми закріпилися на околицях, скориставшись набраним імпульсом. На жаль, швидкої перемоги нам не судилося, і жорстокі бої, часто в ближньому бою, а іноді й у рукопашній сутичці, тривали протягом усього дня і ночі. Поряд з вибухами, які, як ми знали, були справою рук диверсійних груп гвардії. Наступного ранку, коли зійшло сонце, Дірлеванґер, розлючений втратою цінної здобичі, наказав провести тотальний штурм, що призвело до ще одного довгого дня боїв в ближньому бою. День, який, однак, в кінці приніс перемогу. Бригада забезпечила контроль над районом, але ціною великих втрат і значної частини руйнувань. Проте перемога є перемогою, і нею потрібно скористатися. Останньою територією Новотроїцька, яку потрібно взяти, є центр міста, і ми рухаємося, щоб це зробити."
DRL.213.a: "Хлопці отримали величезне задоволення"

DRL.214.t: "Битва за Новотроїцьк — центр міста"
 DRL.214.d: "Діючи з наших позицій у передмістях та промислових зонах, бригада розпочала остаточний наступ на центр міста Новотроїцька, маючи на меті остаточно зламати опір Уральської гвардії разом із сходом сонця. Ця відволікаюча дія також дозволила частинам наблизитися ближче, ніж раніше, під меншим вогнем, і тому, коли почався остаточний штурм, він відбувався з вигідної тактичної позиції. \n\nНезважаючи на це, гвардія чинила запеклий опір, і ближній бій, кімната за кімнатою, став нормою, коли ми наближалися до самої ратуші. Коли боєприпаси закінчилися, гвинтівки та пістолети-кулемети перетворилися на палиці, а уламки стали імпровізованою зброєю. Дійсно, незважаючи на безнадійність позиції гвардії, їхня оборона була настільки рішучою, що для її прориву знадобилося ще два дні. Але прорив все-таки відбувся. З останнім ривком наш ударний загін штурмував командний пункт гвардії в ратуші і вбив офіцерів, що там перебували. Незабаром після цього організована оборона впала, і коли над нею розгорнули прапор бригади, пролунав гучний крик радості. Ми, безсумнівно, заслужили цю перемогу — тепер час насолоджуватися нею!"
DRL.214.a: "Перемога за нами!"

 DRL.215.t: "Битва за Новотроїцьк — перемога"
DRL.215.d: "Битва за Новотроїцьк закінчилася, і бригада знову здобула перемогу. Новотроїцьк, можливо, є більшим населеним пунктом, ніж ті, які бригада звикла грабувати, і в ньому проживає набагато більше людей, але процедура залишається тією самою, і наші бійці мають великий досвід її виконання. \n\nУсі цивільні особи, які допомагали гвардії, були негайно розстріляні разом зі своїми сім'ями. Найсильніших із тих, хто залишився, зібрали разом, готуючи до транспортування в табори примусової праці в самому місті або на інших наших територіях. Будівлі спочатку були розграбовані на все цінне, а потім спалені, щоб послати сигнал. Жінок викрадали цілими групами. У центрі міста сам Дірлеванґер виголосив тріумфальну промову з балкона, з якого відкривався вид на багаття, в яке були кинуті трупи Уральської гвардії. Цінності та ресурси міста стануть великим благом для бригади, але підняття морального духу є потенційно ще більшою нагородою. "
DRL.215.a: "Гвардія повинна була залишитися у своїх фортецях"

DRL.216.t: "Битва за Новотроїцьк — поразка"
DRL.216.d: "Незважаючи на всі наші зусилля в плануванні, підготовці та проведенні атаки на Новотроїцьк, бригада зазнала поразки від Уральської гвардії». n\nНаші бійці билися як одержимі, захопивши більшу частину міста, але опір виявився занадто сильним, і, вичерпавши свої сили, вони стали вразливими для контратаки. Контратака, яку гвардія здійснила, щойно з'явилася така можливість.\n\nДо честі бійців, вони витримали, завдавши важких втрат у жорстокому ближньому бою, але в кінці кінців були змушені відступити, щоб уникнути повного знищення. Однак наша поразка не є повною, адже місто і видобувні підприємства навколо нього практично знищені, що на значний час ускладнить їхні військові дії. \n\nПроте це не та перемога, якої ми прагнули. Перемога, на яку ми заслуговували. І тепер ми мусимо повертатися до Орська в найжахливіших умовах — з порожніми руками."
DRL.216.a: "Кривава і, зрештою, безглузда"

 DRL.217.t: "Друга фаза"
DRL.217.d: "Ми дійсно дуже довго чекали на цей день.
Поразка Уральської гвардії під Новотроїцьком залишила її, принаймні на даний момент, розрізненою і дезорганізованою, нездатною до ефективної оборони або контратаки. Таким чином, землі, які вони заявляють, що захищають, особливо вздовж кордонів, відкриті для грабунку бригадою, і ми будемо грабувати!\n\nОкрім багатств, жінок, полонених та інших цінних речей, Дірлеванґер і його офіцери видали конкретні накази захопити все військове спорядження, яке буде знайдено. Зрештою, нам доведеться зіткнутися з тим божевільним Лисенком, а у фортифікаціях гвардії є багато речей, включаючи важке озброєння та артилерійські знаряддя, які можуть нам допомогти, коли настане той день. Крім того, інші запаси, які можна захопити, особливо продовольство з багатьох ферм, що залишилися без захисту, дозволять нам поповнити наші вичерпані запаси та створити стратегічний резерв. n\nРезерв, який дозволить нам протриматися деякий час. Справи дійсно йдуть на краще"
DRL.217.a: "Забирайте все!"

DRL.218.t: "Другий великий рейд"
DRL.218.d: "Перемога породжує самовдоволення, і це не виняток для бригади. Наші загартовані та досвідчені бійці нудьгують від невеликих рейдів, які ми проводили останніми днями. Нудьгуючі рейдеры небезпечні як для друзів, так і для ворогів, і офіцери це добре розуміють. І, як і раніше, наші офіцери можуть вибрати один із трьох основних варіантів. Оренбург, як завжди, є великою нагородою Уралу, переповненою полоненими, багатствами та всілякими «розвагами». Наші бійці постійно про нього говорять, часто пошепки, і з радістю скористаються нагодою, щоб знову поїхати туди. Друга група цілей знаходиться на землях Уральської ліги. Хоча вони не такі багаті, жодна група в цьому регіоні не викликає у наших людей такої ненависті, як Ліга та її гвардія, і ця жага помсти, без сумніву, спонукає бригаду до нових висот агресії та вбивств. Нарешті, третій варіант є найамбітнішим. Було запропоновано атакувати і Оренбург, і Уральську лігу. Це буде, м'яко кажучи, складно і ризиковано, але нагорода, як у вигляді трофеїв, так і в вигляді страхітливої репутації та слави, буде величезною і, крім того, послабить обох наших ворогів."
DRL.218.a: "Зростає хвилювання"

 DRL.219.t: "Виманити гвардію"
DRL.219.d: "Уральська гвардія, яку селяни південного Уралу і навіть далеко за межами Ліги шанують як героїв, занадто загордилася. Кожного разу, коли наші люди входять на їхню територію, вони виходять проти нас і борються з неймовірною завзятістю. Але настав час показати людям, що гвардія не є непереможною і що ніхто не може захистити їх від нас. Там вони будуть вразливі для атаки. Ми оберемо час і місце, а коли вони будуть саме там, де ми хочемо, ми вдаримо з усіх боків і винищимо їх до останнього. Капітуляція не буде запропонована і не буде прийнята, і коли люди побачать залишені тіла, вони зрозуміють, що вони справді самотні"
DRL.219.a: "Героїзм не має місця на цих землях"

 DRL.220.t: "Вимагають подвійну суму — Лисенко надсилає половину"
DRL.220.d: "Лисенко, цей дивак, отримав нашу вимогу про подвійну оплату за останню групу полонених. І відмовився.\n\nУ відповідному повідомленні, доставленому дуже незадоволеним офіцером НКВС, детально описувалася ця відмова і містилося попередження, що будь-які додаткові спроби «впевнити» його в нашій сильній позиції можуть означати остаточний кінець угоди, яку ми уклали.\n\nВін, принаймні, достатньо розумний, щоб зрозуміти, що залишити нас з порожніми руками було б серйозною помилкою, і надіслав половину від початково узгодженої суми. Лисенко все ще корисний для нас, але він не повинен помилятися, що ми не задоволені. І що ми не забудемо цю образу."
DRL.220.a: "Ми ризикнули і програли"

 DRL.250.t: "Передайте плоть"
DRL.250.d: "Угода між Бригадою та Лисенком, по суті, проста. Ми передаємо якомога більше полонених, захоплених під час наших численних рейдів як основна мета або як додаткова здобич, для будь-яких божевільних експериментів, які він запланував для них. Натомість він передає нашим військам частину передового військового обладнання та інших технологічних див Чорної гори.\n\nХоча не можна сказати, що наші люди чесні, вони, здебільшого, задоволені цією угодою. Дехто, однак, скаржиться. І не без підстав. Вони стверджують, що ми виконуємо всю роботу і несемо всі втрати, а хитрий Лисенко сидить у безпеці на своїй горі зі своїми секретами. Вони кажуть, що ми заслуговуємо на більшу частку пирога і що було б легко переконати його в цьому, незважаючи на ризик, який це може становити для угоди в цілому. Деякі з наших офіцерів починають прислухатися до них. Чи слід нам заохочувати це?"
DRL.250.a: "Рішення, рішення"
 DRL.251.t: "Передайте їх"
DRL.251.d: "Ніхто не може і не хоче заперечувати, що Лисенко — дивна людина. Це не означає, що він дурний, і він забезпечує свою безпеку, з'являючись особисто тільки для того, щоб мати справу з Дірлеванґером. Наших людей, які прибули з останньою групою полонених, зустрів один із таких чиновників, і, враховуючи рішення не вимагати більше від Чорної гори, справа продовжилася як звичайно. Потім полонених відвели, куди б не замислили їх відправити Лисенко та його божевільна зграя, а натомість привезли вантажівки з обладнанням як плату. n\nНа жаль, ми не мали вибору щодо того, що саме обміняти, оскільки Лисенко, очевидно, вже склав і затвердив список. Не все з нього ідеально підходить для наших потреб, але достатньо підходить, і все має достатню якість. \n\nЦе підійде. Поки що."
DRL.251.a: "Серед злодіїв має бути честь"

 DRL.252.t: "Угода змінилася — Лисенко погодився"
DRL.252.d: "Наш чоловік у Чорній Горі повідомив, що Лисенко погодився на наші вимоги щодо збільшення оплати за полонених, яких ми доставляємо. Ми маємо враження, що він аж ніяк не задоволений нашою раптовою зміною думки, але нам байдуже, подобається йому це чи ні. Важливо лише те, що цей божевільний здався, як і личить боягузливій істоті, і відтепер наші хлопці отримуватимуть додаткові запаси"
DRL.252.a: "Рабство — прибутковий бізнес"

 DRL.253.t: "Угода змінилася"
DRL.253.d: "Лисенко, безперечно, досить дивна людина. Він рідко виходить зі своєї лабораторії, більше схожий на боязкого створіння, ніж на людину. Він ніколи не спілкується з кимось із наших, крім самого Дірлеванґера, завжди відправляє одного зі своїх не менш дивних «помічників», щоб той контролював наші угоди. Сьогодні, коли наш рабовласник прибув до Чорної гори з нашою останньою партією полонених, все було як завжди. n\nСтурбовані можливими наслідками, лакеї Лисенка спробували швидко завершити угоду. Але з дозволу Дірлеванґера наш чоловік повідомив їм, що умови угоди змінилися. Ми ризикували, тому хочемо отримати більше, ніж було попередньо домовлено. «Або інакше» не було сказано, але це було чітко зрозуміло. Помічник Лисенка відступив, заявивши, що вимогу може прийняти або відхилити тільки сам божевільний вчений."
DRL.253.a: "Схоже, розум проти сили"

 DRL.254.t: "Угода змінилася — Лисенко стоїть на своєму"
DRL.254.d: "Відправивши нашого рабовласника до Чорної гори, ми очікували, що він повернеться з перемогою та додатковою здобиччю, тож вирішили поставити Лисенка перед фактом щодо вартості наших полонених. Однак ми не очікували, що Лисенко виявиться таким рішучим, коли йому погрожують. n\nСьогодні ми отримали обгорілі тіла охоронців нашого рабовласника, а сам рабовласник, наскільки ми можемо судити, зник з лиця землі. До тіл була додана записка від Лисенка, в якій він стверджував, що група спробувала змінити звичайну угоду, коли прибула, що, на думку Лисенка, «суперечило їхнім наказам, виходячи з наших попередніх домовленостей», і було простим «випадком бандитського здирництва». \n\nЯк покарання, Лисенко «знищив» їх і повідомив нас, що через нашу «нездатність встановити дисципліну серед наших високопосадовців» ми не отримаємо жодної оплати за цю партію полонених, яких ми також не повернемо."
DRL.254.a: "Цього разу ти переміг, виродку"

 DRL.255.t: "Вимагай подвійну суму — Лисенко надішле подвійну суму"
DRL.255.d: "Наш улюблений виродку Лисенко поступився нашим вимогам подвоїти оплату за останню партію полонених, і сьогодні ми нарешті отримали постачання. Очевидно, хоча він і незадоволений нашою спробою вимагання, він вважає, що чим краще ми забезпечені, тим більше наших спільних ворогів ми зможемо вбити. Він не має уявлення, що ми дійсно використаємо це обладнання, щоб вбити наших ворогів, серед яких і сам Лисенко"
DRL.255.a: "Ми добре використаємо це"

DRL.256.t: "Гаррі-відсталий"
 DRL.256.d: "Вогонь наших сердець спалює землі Уральської ліги, стаючи з кожним днем все гарячішим і яскравішим. Тепер їхні люди — біженці, які втікають від нашого наступу так швидко, як тільки можуть їхні маленькі ноги. Протягом дня наші розвідники стежать за їхніми колонами розбитого натовпу, що важко крокує з сумом в очах і поразкою в серцях. Вночі, коли вони шукають трохи перепочинку у сні, наші люди спускаються, щоб пробудити їх до кошмару. Ми вбиваємо їхніх чоловіків з жорстокістю, зганяємо свою фрустрацію на їхніх жінках і забираємо їхніх дітей, щоб вони нам служили. Усі їхні запаси забираються, а потім ми просто спалюємо все дотла. Вночі наші люди вже не орієнтуються за зірками, а за вогнями по всій землі"
 DRL.256.a: "Белорецьк буде нашою північною зіркою"

DRL.257.t: "Світ перевернувся з ніг на голову!"
DRL.257.d: "Це була дурна думка, що всі ці жалюгідні комуни коли-небудь зможуть чинити нам будь-який опір. Вони жили у фантазіях, але ми змусили їх усвідомити правду про їхню утопію. Вони думали, що Уральська гвардія захистить їх, але це була брехня. Вони думали, що їхні лідери захистять їх, але це була брехня. Вони думали, що, принаймні, вони зможуть захистити один одного... але це була брехня. Краєвид заповнений попелястими руїнами цих комун, заваленими трупами і пограбованими з усіх цінних речей. Дуже часто ми виявляємо, що їхні мешканці вирішили померти власноруч, а не від наших рук, коли ми прибуваємо, і ми радіємо цьому, бо вони нарешті побачили нашу правду. Фантазія закінчилася, їхня утопія впала"
DRL.257.a: "Вони належали до дитячої книги, а не до життя"

 DRL.258.t: "Посоліть землю!"
DRL.258.d: "З тих пір, як з'явилися армії, їхні командири зазвичай усвідомлювали, що армія марширує тільки на своєму шлунку. Вони можуть хотіти набагато більше, але їм потрібна їжа. Ми натрапили на безліч полів з урожаєм на землях Оренбурга, яких вистачить, щоб добре нагодувати нашу армію. Вони, безперечно, потребують її, зважаючи на всі зусилля, які докладають, щоб вбити цих нещасних людей. Але так само, як наша армія марширує на своєму шлунку, так само і їхня. Тому ми не залишимо їм нічого!\n\nНаші хлопці взялися за роботу, кидаючи сіль у землю після того, як ми забрали врожай, а також наповнюючи її мінами. Колодязі були отруєні, часто шляхом скидання в них мертвої худоби. Зрошувальні системи та водотоки були знищені. Труби вирвані з землі, дроти зірвані зі стін. Ми забрали трофеї цієї землі, і тепер ніхто ніколи не зможе її використовувати знову"
DRL.258.a: "Ми — кінець світу"

 DRL.259.t: "Нехай усі знають страх..."
DRL.259.d: "Ми дійшли до найприємнішого усвідомлення: ми заподіяли цим людям такий жах і терор, що почали переходити межу міфу. Все почалося зі звіту розвідника про те, що бабуся сказала онукові, що якщо він не буде їсти, Дірлеванґер прийде і забере його. Ми прислухалися і почули набагато більше. \n\nМабуть, наші коні атакують з копитами, що палають вогнем. Дірлеванґер має очі з палаючим вугіллям, гнилу шкіру і козячі ноги. Наші люди мають надлюдську силу і статеві органи коней. Наша зброя була благословенна самим дияволом, щоб завдавати якомога більше болю. Ми беремо наших полонених і приносимо їх в жертву Гітлеру, який після смерті піднявся до божественного статусу. Ми такі могутні, бо маємо здатність воскрешати мертвих після кожної битви, щоб поповнити наші зіпсовані лави.\n\nВсе це дуже цікаво, але, що важливіше, це доказ того, що ми увійдемо в історію як абсолютні лиходії, саме так, як ми і хотіли. Наші імена будуть жити тисячу років!"
DRL.259.a: "Ми ніколи не зможемо бути сторінкою в чиїйсь іншій книзі історії!"

 DRL.260.t: "Започаткування змови..."
DRL.260.d: "Хоч СС і справді жахливі, вони мають одну фатальну слабкість. Як і решта з нас, вони лише люди. З кожним роком, з кожною битвою, все більше і більше оригінальних членів бригади Дірлеванґера гинуть, змушуючи їх приймати все більше і більше місцевих рекрутів. Новобранці, які надто добре знають про жорстокість і жахи, заподіяні їхній країні та їм самим німцями. Настав час помститися, повалити Дірлеванґера і вигнати цю німецьку наволоч з наших земель!"
DRL.260.a: "Настав час, і ми ризикнемо всім"

 DRL.261.t: "Зроблено пропозицію..."
DRL.261.d: "Людину можна тиснути і тиснути, але є межа. Багато росіян у бригаді добровільно приєдналися до Дирлевангера, прагнучи втекти від свого злиденного життя настільки, що були готові укласти угоду з дияволом. Ми вже здійснили жахливі нальоти на російські громади, зробили невимовні речі, не кажучи вже про дії Дірлеванґера під час війни. Але тепер ми чуємо, що він планує безпрецедентні атаки на Уральську лігу та Оренбург, і росіяни нарешті досягли межі терпіння. \n\nМи не знаємо, як вони дізналися, але вони прийшли до нас і повідомили, що хочуть приєднатися до нашого плану вбивства Дірлеванґера. Єдина умова їхньої лояльності — ми також маємо вбити кожного німецького сучого сина навколо..."
DRL.261.a: "...і, звичайно, ми погоджуємося!"

 DRL.262.t: "Наближаючись до Захоплених..."
DRL.262.d: "Перш ніж бригада дісталася Орська, ми пройшли через територію, яка зараз називається «Нова Польща», дуже цікаве місце, населене етнічними казахами та поляками. Результатом стало кілька рейдів, в результаті яких багато біженців були змушені служити в нашій армії майже проти своєї волі. Ці люди так само добре, як і росіяни, знають про звірства, які Дірлеванґер і його німці вчиняли проти невинних людей. \n\nПід час патрулювання наші змовники зустрілися з лідером польсько-казахської фракції в бригаді і попросили їх приєднатися до нас. Чоловік погодився відразу, і ми провели решту патрулювання в лісі, обговорюючи, яку роль вони відіграватимуть у нашому плані. Натомість, окрім чистої втіхи від смерті Дірлеванґера, ми пообіцяли, що після виконання завдання їм буде дозволено вільно повернутися до Нової Польщі."
DRL.262.a: "Минуле наздожене Дірлеванґера, і воно вдарить сильно"

 DRL.263.t: "Найвищому покупцеві..."
 DRL.263.d: "Ми заручилися підтримкою двох найбільших ненімецьких фракцій у бригаді, але є ще одна група, яка може завадити нашим планам, якщо ми не переманемо її на свій бік. До лав Дірлеванґера було залучено низку найманців різного роду, яких привабили обіцянки багатих трофеїв, кровопролиття та жінок. Однак цих людей було куплено, вони не мають жодного інтересу до самого Дірлеванґера. Насправді, ми знаємо, що деякі з них активно його не люблять. Ці люди продаються тому, хто запропонує найвищу ціну, і все, що нам потрібно зробити, це запропонувати вищу ціну. \n\nМи провели таємні зустрічі з найвпливовішими лідерами цих найманців. Як ми і підозрювали, їх можна переконати прийняти кращу пропозицію від нас і покинути Дірлеванґера, але це буде коштувати недешево. Після багатьох ночей переговорів ми дійшли двох угод, які вони готові прийняти. Або ми надаємо їм значну кількість людей з нашої фракції, щоб компенсувати рекрутів, яких вони взяли б у завоюваннях Дірлеванґера, або ми обіцяємо їм майже всі запаси Дірлеванґера. Це важкий вибір, але на що ми погодимося?"
DRL.263.a: "Дати їм їхніх людей"
 DRL.263.b: "Нехай забирають свої багатства і йдуть геть"

DRL.264.t: "Їхня остання трапеза..."
DRL.264.d: "Ми посіяли хаос серед німців у наших лавах, саме так, як і планували. З росіянами, казахами, поляками та найманцями, які приєдналися до нашого задуму, це було просто. Німці просто вважають себе вищими за нас, вищими за найпростіші і «брудні» завдання. В результаті, саме з лав наших змовників були обрані співробітники, які готували їжу. Звідти було просто отруїти їжу якомога більшої кількості німців одного вечора. n\nДо кінця ночі було оголошено, що в таборі швидко поширюється якась епідемія з великою кількістю жертв, включаючи всю елітну гвардію Дірлеванґера. Існує кілька теорій про те, що сталося, але дві основні з них — це те, що Уральська гвардія втрутилася в наші запаси або що Лисенко застосував проти нас нову зброю. n\nДо того часу, як правда стане повністю зрозумілою, майже ніхто з тих, хто пережив це, не буде перейматися тим, що це були ми."
DRL.264.a: "Вода всюди, але ні краплі питної"

DRL.265.t: "Вбивство Оскара Дірлеванґера"
 DRL.265.d: "Вночі сильно сніжило, і вранці, коли Дірлеванґер йшов від туалету до свого намету, було прохолодно. Перший удар ножем пролунав ніби з нізвідки, глибоко врізавшись у його бік. Потім пролунав ще один удар, і ще один, і ще один. Вони наносили удари один за одним, і до того часу, як все закінчилося, Дірлеванґер отримав понад два десятки ножових поранень. Впавши на землю, смертельно поранений, він не міг говорити. З останніх сил він зміг лише накинути на обличчя свій хутряний плащ, щоб приховати свій погляд від зрадників. До полудня більшість банди пішла, зібравши все, що могли, і розійшлася в різні боки, щоб або створити власні банди, або вирушити в наступну пригоду. Залишилися лише порожні намети, що майоріли на вітрі, жар від багаття і бездиханне тіло Дірлеванґера, залишене на снігу."
DRL.265.a: "До побачення, пане Дірлеванґер"

DRL.266.t: "Глибоко на Заході"
 DRL.266.d: "Наші командири тижнями сперечалися про те, як найкраще нанести удар по Оренбургу цього разу, але жоден із запропонованих планів не здавався Дірлеванґеру правильним. Ми хочемо показати цим дурним селянам, що таке справжня свобода, і тому рішення було досить простим, як зрозумів Дірлеванґер. \n\nМи відправимо великий загін наших хлопців глибоко в їхню територію, а потім просто... відпустимо їх. Ми дозволимо їм робити все, що їм заманеться, без жодних наслідків, протягом цілого тижня. Єдині вимоги — вони повинні повернутися до табору після закінчення терміну, не вбивати своїх офіцерів і створювати якомога більше проблем"
DRL.266.a: "Це... це буде дуже весело!"

 DRL.267.t: "Глибоко на Заході — приголомшливий успіх!"
 DRL.267.d: "Минув тиждень, і наші хлопці повертаються з околиць Оренбурга, де їм на деякий час дали волю. Не всі наші люди повернулися, деякі загинули в сутичках з населенням Оренбурга або були вбиті нашими ж людьми через суперечки, які вони нарешті змогли вирішити. Але серед тих, хто повернувся, моральний дух ніколи не був таким високим. n\nНаші офіцери повідомляють, що ми насправді недооцінювали жорстокість, на яку здатні наші хлопці, і коли їм дали тиждень без наслідків, вони показали своє справжнє обличчя.\n\nСела були спалені, худоба забита, старих людей згодували собакам, поля знищені, колодязі отруєні, незліченна кількість людей лінчована, багатства розграбовані, алкоголь зловживаний, а жінок так жорстоко катували, що ніхто в банді більше не може стверджувати, що він невинний у содомії. Це лише невелика частина того, що їм вдалося зробити. Вони привезли з собою багатства і безліч рабів, а також сяючі посмішки, які зігрівають старе серце Дірлеванґера в цих холодних краях"
DRL.267.a: "Оце так чудовий відпустку"

DRL.268.t: "Проникнення в гори"
 DRL.268.d: "Вистава, яку влаштовують ці виродки, швидко набридає. Люди називають їх «рятівниками Уралу», останньою лінією оборони між життям і, ну, нами. Протягом багатьох років ми проводили незліченні рейди на їхню територію з різним успіхом, але цього разу ми відкинемо їх на крок назад, до їхньої могили. Замість чергової звичайної сутички, ми мобілізуємо повномасштабний рейд!\n\nМи проведемо одночасні удари по трьох об'єктах на території Ліги:\n\nСтарий радянський аеродром, перетворений на склад боєприпасів, старий спортивний стадіон, перетворений на табір для біженців, і, нарешті, польовий командний пункт Уральської гвардії.\n\nПоряд з цими ударами, вздовж кордону буде проведено два десятки менших рейдів, щоб відволікти увагу гвардії від наших головних цілей. "
DRL.268.a: "Три — це магічне число"

DRL.269.t: "Проникнення в гори — результати"
DRL.269.d: "Ми прийшли, ми побачили, ми спалили їхній світ! Наш великий рейд проти Уральської Ліги був успішним на всіх фронтах, Гвардія залишилася в шоці від наших атак. n\nНа злітно-посадковій смузі наші сили завдали жорстокого удару по базі в ближньому бою, жорстоко розгромивши непідготовлену загін за допомогою ножів, скла та кастетів, а також куль. Коли кров просочила землю, ми наповнили вантажівки всім, що могли, а потім підірвали залишки складу боєприпасів разом із запасами палива та знищили злітно-посадкову смугу. Ми не знайшли там жодного літака, але краще перестрахуватися, ніж потім шкодувати. На спортивному стадіоні наші хлопці завдали удару вночі. Заблокувавши виходи, вони почали кидати бензинові бомби в табір біженців всередині. Вогонь швидко поширився по наметах, а крики заповнили нічну тишу. Тим, кому пощастило перелізти через стіни, нагородою стали кулі. \n\nНарешті, частина нашого підрозділу Ваффен-СС, що спеціалізується на таємних операціях, напала на командний пункт Уральської гвардії. Десятки людей були вбиті у своїх ліжках, їм перерізали горлянки, а також було вбито трьох старших офіцерів. Все радіообладнання було знищено, а всі документи, що представляли інтерес, вилучено, включаючи кілька карт, які, безсумнівно, стануть у нагоді під час майбутніх атак. \ n\nТри напади в поєднанні з меншими відволікаючими рейдами через кордон викликали широке сум'яття і терор, а також серйозно паралізували Уральську гвардію принаймні на кілька тижнів."
DRL.269.a: "У повітрі витає запах перемоги і плоті"

DRL.270.t: "Щипці"
 DRL.270.d: "Гаразд, давайте зробимо це. Ми не дійшли б до того, що маємо сьогодні, не ризикуючи. Ми тут, бо ми найміцніші та найсміливіші сукини сини, і настав час нагадати про це всім іншим!\n\nДірлеванґер санкціонував одночасні рейди проти Оренбурга та Уральської ліги, розділивши наші сили на дві частини. Буде важко, оскільки ми не зможемо кинути всі сили на жодну з цілей, але нагорода, яку ми можемо отримати, буде славною. \n\nВ Оренбурзі ми відправимо половину наших хлопців глибоко в їхню територію і просто... дамо їм волю. Ми дозволимо їм робити все, що їм заманеться, без жодних наслідків, протягом трьох днів. Єдині вимоги — вони повинні повернутися в табір після закінчення терміну, не вбивати своїх офіцерів і створювати якомога більше проблем. Інша половина наших сил буде відправлена через кордон з Лігою і проведе три одночасні удари по одному з їхніх складів боєприпасів на старому радянському аеродромі, табору біженців, розташованому на базі старого спортивного стадіону, і командному пункту Уральської гвардії. n\nЖоден з рейдів не матиме підкріплення, тож це буде або все, або нічого. Ідеальний шанс для наших хлопців проявити себе"
DRL.270.a: "Це буде наша найграндіозніша наступальна операція!"

 DRL.271.t: "Щипці — успіх в Оренбурзі!"
DRL.271.d: "Минуло три дні, і наші хлопці повертаються з околиць Оренбурга, де їм на деякий час дозволили звільнитися від пут. Не всі наші люди повернулися, деякі загинули в сутичках з населенням Оренбурга або були вбиті нашими ж людьми через суперечки, які вони нарешті змогли вирішити. Але серед тих, хто повернувся, моральний дух ніколи не був таким високим. Наші офіцери повідомляють, що ми насправді недооцінювали жорстокість, на яку здатні наші хлопці, і коли їм дали тиждень без наслідків, вони показали своє справжнє обличчя. Села були спалені, худоба забита, поля знищені, колодязі отруєні, десятки людей лінчовані, багатства розграбовані, алкоголь зловживали, а жінок так жорстоко катували, що ніхто з загону більше не може стверджувати, що він не причетний до содомії. Якби ми дали їм більше часу і відправили всі наші сили, вони могли б досягти набагато більше, ми в цьому впевнені. Але вони привезли з собою багатства і безліч рабів, а також сяючі посмішки, які зігрівають старе серце Дірлеванґера в цих холодних краях"
DRL.271.a: "Оце так чудовий відпустку"

 DRL.272.t: "Щипці — неоднозначні результати в Оренбурзі"
DRL.272.d: "Минуло три дні, і наші хлопці починають повертатися з околиць Оренбурга, де їм на деякий час дали волю. Не можна назвати результат провалом, але й особливим успіхом його теж не назвеш. \n\nРозділивши наші сили навпіл, наші командири тепер вважають, що ми просто не змогли дати нашим хлопцям достатньо часу, щоб вони могли спричинити ті неприємності, які ми хотіли, а також не мали достатньої кількості людей, щоб зробити щось дійсно хороше. n\nУрожай спалено, багатства розграбовано, жінок зґвалтовано, а колодязі отруєно, але нам не вдалося зробити цей напад справді «великим», як ми хотіли, і він, безсумнівно, запам'ятається поряд з усіма іншими нашими нападами"
DRL.272.a: "Сподіваємося, що проти Ліги буде більше успіхів"

DRL.273.t: "Щипці — успіх проти Ліги!"
 DRL.273.d: "Ми прийшли, ми побачили, ми спалили їхній світ! Наш великий напад на Уральську Лігу був успішним на всіх фронтах, гвардія залишилася в шоці від наших атак. Коли кров просочила землю, ми наповнили вантажівки всім, що вони могли вмістити, а потім підірвали те, що залишилося від складу боєприпасів, разом із запасами палива, і знищили злітно-посадкову смугу. Ми не знайшли там жодного літака, але краще перестрахуватися, ніж потім шкодувати. Заблокувавши виходи, вони почали кидати бензинові бомби в табір біженців всередині. Вогонь швидко поширився по наметах, а крики заповнили нічну тишу. Тим, кому пощастило перелізти через стіни, нагородою стали кулі. \n\nНарешті, частина нашого підрозділу Ваффен-СС, що спеціалізується на стелс-атаках, штурмувала командний пункт Уральської гвардії. Десятки людей були вбиті в своїх ліжках, їм перерізали горлянки, а також було вбито трьох старших офіцерів. Все радіообладнання було знищено, а всі цікаві документи вилучено, включаючи кілька карт, які, безсумнівно, стануть у нагоді під час майбутніх атак. Якби ми провели повномасштабний рейд, проігнорувавши Оренбург, ми могли б досягти більшого, але це все одно чудова перемога."
DRL.273.a: "У повітрі витає запах перемоги і крові"

 DRL.274.t: "Щипці — поразка проти Ліги"
DRL.274.d: "Ми досягли успіху в нашому великому нальоті проти Уральської Ліги, але це коштувало нам страшної ціни. n\nНа аеродромі наші війська завдали жорстокого удару по базі в ближньому бою, жорстоко розгромивши непідготовлену гарнізонну частину за допомогою ножів, скла та кастетів, а також куль. Коли кров просочила землю, ми наповнили вантажівки всім, що могли, а потім підірвали залишки складу боєприпасів разом із запасами палива та знищили злітно-посадкову смугу. Ми не знайшли там жодного літака, але краще перестрахуватися, ніж потім шкодувати. На спортивному стадіоні наші хлопці завдали удару вночі. Заблокувавши виходи, вони почали кидати бензинові бомби в табір біженців всередині. Вогонь швидко поширився по наметах, а крики заповнили нічну тишу. Тим, кому пощастило перелізти через стіни, нагородою стали кулі. \n\nНарешті, частина нашого підрозділу Ваффен-СС, що спеціалізується на таємних операціях, напала на командний пункт Уральської гвардії. Десятки людей були вбиті у своїх ліжках, їм перерізали горлянки, а також було вбито трьох старших офіцерів. Все радіообладнання було знищено, а всі цікаві документи вилучено, включаючи кілька карт, які, безсумнівно, стануть у нагоді під час майбутніх атак. \ Однак наші командири стверджували, що нам потрібно також провести численні невеликі рейди вздовж кордону, щоб запобігти організації Уральською гвардією відповідних дій, але це стало неможливим через зобов'язання також відправити людей до Оренбурга. В результаті, після своїх успіхів наші люди зіткнулися з гвардією, перш ніж змогли повернутися на наші землі, і ми зазнали важких втрат, перш ніж їм нарешті вдалося втекти"
 DRL.274.a: "Трагічний кінець чудового досягнення"

DRL.275.t: "Дотримуйся угоди"
DRL.275.d: "Минуло кілька місяців з часу нашого останнього обміну з нашим улюбленим диваком Лисенком. Тепер, після нашого недавнього великого рейду, у нас є свіжі полонені, яких він, без сумніву, буде радий отримати. Хоча в банді все ще є голоси, які стверджують, що ми повинні отримувати все більше і більше винагороди за кожного переданого полоненого, Дірлеванґер вирішив їх ігнорувати. На нас чекають більш нагальні бої проти Уральської ліги та Оренбурга, тому поки що не варто налаштовувати проти себе Чорну гору. Згідно з угодою, ми відправили наших полонених до вчених і отримали натомість наше спорядження»"
 DRL.275.a: "Взагалі-то, непогана угода"

DRL.276.t: "Відмовитися від нацистського вітання?"
DRL.276.d: "Ми вже давно не служимо фюреру, але деякі звички з нашого колишнього життя все ще залишилися. Одним з них є нацистський салют, який часто супроводжується фразою «Зіг хайль». Звичайно, з тих пір, як нас зрадила наша країна, у нас немає нацистської партії; цей жест перейшов у знак поваги та лояльності до Дірлеванґера, особливо серед німців у нашому загоні. n\nЗі зростанням кількості ненімців у бригаді та з огляду на те, що ми більше не служимо Рейху, деякі з наших хлопців задаються питанням, чому ми взагалі продовжуємо робити цей жест. Чи слід нам і надалі пропагувати його використання, чи відмовитися від нього?"
DRL.276.a: "Цей салют — це більше, ніж просто жест, ми повинні його зберегти"
 DRL.276.b: "Ми творимо свою долю без Німеччини, відмовімося від салюту"

DRL.277.t: "Найстарший з нас помер"
DRL.277.d: "Ми маємо мало зв'язків з нашою батьківщиною, коли ми були лише дивізією СС. Окрім деяких уніформ, прапорів та загальних пам'яток, найбільшим з цих зв'язків є оригінальні німецькі члени бригади, які завжди займали особливе місце для Дірлеванґера. Однак наш найстарший член, Карл Вільгельм Мюллер, помер у віці 73 років. Останні кілька років він страждав від погіршення здоров'я, а два дні тому в таборі переніс інсульт, який виявився для нього останнім, і сьогодні вранці він помер. n\nЦя втрата важко переживається іншими членами «старої гвардії» в оркестрі, але, що важливо, вона починає викликати питання про те, що саме станеться, якщо старість набереться сміливості прийти за Дірлеванґером."
DRL.277.a: "Спочивай з миром, старий друже"
 DRL.278.t: "Напруженість у групі"
DRL.278.d: "Наша група веселих маніяків є багато чим, але єдиною вона аж ніяк не є. У наших лавах є німці, австрійці, поляки, казахи, росіяни, українці, а серед них — злочинці, політичні в’язні, садисти, відкинуті суспільством, в’язні концтаборів і божевільні. І це лише частина нашого складу на сьогоднішній день. Як виявляється, всі ці різні групи мають труднощі у взаємодії, і в бригаді існує кілька фракцій. \n\nМи вже деякий час знаємо про ці напруження, оскільки вони іноді спричиняють проблеми на полі бою з виконанням наказів, але вчора ввечері ситуація, здається, досягла апогею. Після надмірного вживання алкоголю дві з цих фракцій зійшлися в бійці, і в центрі табору спалахнула масова бійка, до якої долучилися й інші групи. Цікавий, як це закінчиться, за принципом виживання найсильнішого, Дірлеванґер дозволив бійці тривати до її природного завершення без свого втручання. До ранку вісім осіб загинули, а ще двадцять три отримали поранення. Вижили головні ініціатори були страчені за свою роль у бійці, і на даний момент мир відновився. Але це знову підняло питання про те, що саме станеться одного дня, коли Дірлеванґер помре і зникне об'єднуюча сила банди."
DRL.278.a: "Добре, що вони випустили пар, тепер повертаємося до роботи"

 DRL.279.t: "Збитий пілот Люфтваффе захоплений!"
DRL.279.d: "Вчора банда була вкинута в хаос, коли з нізвідки з'явилася велика снігова буря, яка пронеслася прямо через табір. Сьогодні вранці ми оцінили збитки: найбільше постраждало наше обладнання, а також були розкидані намети і отримані незначні травми. \n\nОднак, коли ми краще роздивилися навколишнє оточення, ми виявили щось набагато цікавіше. Шукаючи розкидане обладнання, наші хлопці виявили збитий винищувач Люфтваффе разом з його пілотом, який був поранений, але живий. Схоже, що пілот виконував завдання з бомбардування Орська, коли снігова буря змусила його здійснити аварійну посадку. Допитавши і ретельно катуючи його, ми дізналися багато чого про нашу колишню батьківщину. Схоже, Гітлер все ще є фюрером, але Німеччина стикається з посиленням внутрішніх заворушень, а між Рейхом і СС виник великий розкол. Кожне слово розривало наші старі рани, і пілота повісили на найближчому дереві"
 DRL.279.a: "Одного дня ми змусимо їх усіх заплатити..."

DRL.280.t: "Пожежа в Орську!"
DRL.280.d: "Хоча наша банда багато пересувається, щоб здійснювати набіги, наша основна база залишається в захопленому місті Орськ, куди ми повертаємося за потреби. Однак ми набагато більше дбаємо про здобич, рабів і кровопролиття, ніж про фактичне управління якимось жалюгідним містом, тому воно в основному позбавлене будь-якої форми адміністрації. \n\nВиявляється, це не завжди йде нам на користь, і відсутність нагляду, а також загальний жалюгідний стан інфраструктури Орська призвели до пожежі. Ми не знаємо, як він почався, але в результаті пожежі було втрачено кілька будівель і життів. На щастя, більша частина нашої здобичі та рабів залишилася неушкодженою, але пожежа знищила частину фабричного району, що вплинуло на нашу невелику промисловість."
 DRL.280.a: "Тоді нам доведеться ще трохи пограбувати!"

DRL.281.t: "Спалах холери!"
DRL.281.d: "Життя на Уралі для нашої веселої компанії є життям крайнощів. Ми надмірно вживаємо алкоголь, але знайти чисту воду поза зимовим періодом — рідкість. Ми ласуємо здобиччю наших набігів, але в скрутні часи їмо зіпсовані та погано приготовлені страви. Ми часто пересуваємося, тому санітарні умови в нас жахливі. З огляду на те, як часто ми маємо справу з мертвими, ризик захворювань є значним. На жаль, така ситуація вже склалася: один із наших небагатьох лікарів повідомив, що в таборі спалахнула холера. Заражено понад шістдесят чоловіків, багато з них у важкому стані, а кількість жертв на сьогодні становить дванадцять. Серед наших полонених і рабів заражені десятки людей через особливо погані умови життя. Через дефіцит медикаментів тут очікується, що цифри будуть зростати і ситуація погіршуватиметься, перш ніж покращиться. Ми мало що можемо зробити, крім як перечекати спалах, поховати наших померлих і рухатися далі"
DRL.281.a: "Наші хлопці заслуговували померти під час набігу, а не так"

 DRL.282.t: "Найнебезпечніша гра"
DRL.282.d: "Останнім часом моральний дух залишається стабільним, але його завжди можна поліпшити, тому Дірлеванґер організував конкурс у бригаді. Усі члени можуть взяти участь, але всі, хто бажає взяти участь, повинні сплатити вступний внесок у розмірі певного відсотка від своїх запасів трофеїв. Переможець отримає всі трофеї, внесені в банк, а також подарунок від самого Дірлеванґера. \n\nГра проста: на світанку кілька наших рабів і полонених будуть звільнені і, не знаючи про це, отримають три години переваги. Потім учасники змагання випускаються на волю, і метою гри є повернутися через дванадцять годин з якомога більшою кількістю голів, переможе той, хто принесе найбільше голів. Змагання має великий успіх, навіть якщо повернулося більше голів, ніж ми насправді відправили."
DRL.282.a: "Ми повинні робити це частіше!"

DRL.283.t: "Захоплений шпигун Уральської ліги"
 DRL.283.d: "Повісьте його!\n\nВбийте цього виродка!\n\nВідріжте йому член і засуньте йому в горло!\n\nЦі крики лунали по всьому табору, коли побитого і закривавленого «гостя» тягли по багнюці до центру табору. Ми виявили його, коли він, як щур, нишпорив серед наших запасів, і після ретельних тортур з'ясувалося, що цей чоловік насправді є шпигуном Уральської ліги.\n\nЦе майже комплімент, що вони вважають боротьбу з нами настільки складною, що хочуть оцінити нашу силу і запаси за допомогою підступів. Адже нам подобається, коли люди ставляться до нас з належною повагою, але це вже занадто.\ n\nШпигуна привели на загальний огляд, прив'язали до багаття і підпалили, а його крики перекривали лише виття вовків. Ми викинемо тіло на кордоні, і нехай воно послужить попередженням.\n\nЯкщо вони хочуть оцінити нашу силу, нехай роблять це, поки ми їх вбиваємо"
DRL.283.a: "Я бачу, моїм маленьким оком..."

 DRL.284.t: "Чи є тут лікар?"
DRL.284.d: "Сьогодні був справді щедрий день. Під час розвідки земель Орська в пошуках цілей, які ми могли б атакувати між великими нападами на наших ворогів, ми виявили діючу лікарню, яка досі залишалася поза нашою увагою.\n\nПринаймні до сьогодні.\ n\nПочувши звіт, Дірлеванґер негайно віддав наказ про напад, і наші хлопці вирушили вниз. Ми зіткнулися лише з незначним опором з боку цивільних сил, який ми з легкістю подолали, а потім взялися за здобич. У частині світу, де ліки важко дістати, медичні препарати, які ми захопили, вартують своєї ваги в золоті і навіть більше. У поєднанні з прекрасними медсестрами, яких ми знайшли, і кількома лікарями, яких ми змусили працювати на нас, це був чудовий день для банди. Усіх пацієнтів, яких ми знайшли в лікарні, було страчено, а саму будівлю підпалено."
DRL.284.a: "Вони будуть служити нам або помруть"

DRL.285.t: "Чудова сцена полювання"
DRL.285.d: "Можна грабувати тільки стільки, скільки можна, і з ростом нашого загону зростає і наша потреба в найнеобхідніших товарах. Потреба в м'ясі, але, що ще важливіше, в хутрі, яке захищає нас від суворих зим, призвела до формування мисливців у наших лавах, які відповідають саме за це, поки решта з нас грабує, відновлює і грабує ще більше. Для наших складів було забезпечено велику кількість хутра вовків, ведмедів та лосів, яке буде розподілено між тими, хто найбільше заслуговує на прихильність Дірлеванґера в нашому загоні. \n\nТрохи конкуренції нікому не зашкодить, а винагорода в такі часи є очевидною"
DRL.285.a: "Тут хороше хутро — це різниця між життям і смертю"

 DRL.286.t: "Зимові втрати"
DRL.286.d: "Незважаючи на нашу підготовку, російські зими, мабуть, не поступаються нам у жорстокості. Часто навіть найсильніші та найсміливіші чоловіки не можуть нічого вдіяти проти лютої холоднечі та суворого ландшафту. Хоча ми, німці, безсумнівно перевершуємо цих росіян, ми не є невразливими та не маємо імунітету до таких температур. Наразі холод забрав життя двадцяти семи наших чоловіків, які зазвичай помирали вночі.\n\nПрикро усвідомлювати нашу вразливість і незначність перед цими суворими випробуваннями природи, але ми знаємо, що коли ми їх подолаємо, це буде ще одним доказом того, що ми найміцніші й найжорстокіші суки, яких коли-небудь бачили ці землі!"
 DRL.286.a: "Холод не може заморозити чисту арійську кров!"

 DRL.287.t: "Заморожені в часі"
DRL.287.d: "З настанням зими ми натрапили на надзвичайно цікаву знахідку. Під снігом і льодом ми виявили невеликий загін танків Т-26 і заморожені останки радянських солдатів. Ми припускаємо, що вони, ймовірно, прямували на фронт під час німецького вторгнення в Радянський Союз багато років тому, але не встигли дістатися місця призначення і загинули від морозу. Техніка не підлягає ремонту, тому ми мусимо залишити її, але пам'ять про те, що люди не єдині вороги, з якими ми стикаємося тут, ще довго не покине нас."
DRL.287.a: "Ми не зазнаємо такої ж долі"

DRL.288.t: "У пошуках уламків"
 DRL.288.d: "Ліга мертва, і шлях до Оренбурга відкритий! Звучить як чудова новина, привід для святкування, коли ми грабуємо жалюгідні володіння Ліги в горах, але в таборах Дірлеванґера немає святкування. Його люди вже почали переслідувати тих небагатьох, хто вижив, але шлях до багатств Уралу для нього залишається закритим. Його люди були занадто повільними, і Лисенко вже захопив більшу частину гори для себе, ігноруючи вимоги Дірлеванґера про його законне грабування. Кожна зброя, складена перед ним, кожен маленький шматочок коштовностей і мізерні залишки здобичі тільки підсилюють його гнів. Як ця сука-вчений сміє так зневажати його? Як він сміє!? ЯК ВІН СМІЄ!?\n\nЗгодом буде справедлива помста. А поки що Дірлеванґер дивиться на Оренбург. А що буде потім, хто знає?"
DRL.288.a: "Ми йдемо, ти, сука в лабораторному халаті"

 DRL.300.t: "Король гори"
DRL.300.d: "Це була довга подорож, довша і кривавіша, ніж будь-хто з нашої групи міг уявити собі багато років тому. Коли ми були просто «Бригадою Дірлеванґера» СС, ніхто не міг уявити, що через двадцять років ми переживемо те, що пережили, і зробимо те, що зробили. А що найкраще? Ми в глибині душі знаємо, що ніхто, ніхто інший не зміг би цього зробити, крім нас. Усі наші зусилля привели нас сюди, до цього моменту, до цього великого завоювання. \n\nБожевільний Лисенко колись був нашим союзником, і до того ж цінним. Але тепер, коли Уральська ліга знищена, а Оренбург повністю розграбований, він нарешті перестав бути нам корисним. Чорна Гора є домом для технологічних і наукових чудес, які вражають уяву і належать скоріше до романів, ніж до реальності. Ми насолоджувалися цими плодами протягом тривалого часу, але навіщо обмежуватися випадковими плодами, коли можна володіти всім деревом? Чорна Гора стане справжньою перлиною в нашій короні, і коли вона стане нашою, нас буде неможливо зупинити"
DRL.300.a: "Настав час, і ми ризикнемо всім"

 DRL.301.t: "Король гори — Чорна Гора захоплена!"
DRL.301.d: "Це було довго і важко, але ми це зробили. Останні захисники впали, і Чорна Гора нарешті стала нашою. Вперше в наших завоюваннях наші люди були відправлені проти професійних військових сил, 22-ї мотострілецької дивізії НКВС Лисенка. Хоча це вже не та сила, якою вона була колись, у поєднанні з огорожами, високими стінами, мінними полями та кулеметними гніздами, що захищали базу на горі, це була нелегка битва. Однак, як тільки ми увірвалися в лабораторії, наші хлопці знову захотіли битися з солдатами. \n\nМи не мали уявлення про масштаби експериментів Лисенка, і наші люди натрапляли на одну пастку за іншою, намагаючись захопити внутрішні приміщення. Електричні пастки, які кип'ятили їхню кров, ударні хвилі, які виривали їм очні яблука, отруйний газ, що розплавляв їхні легені, легіони божевільних експериментальних істот, що атакували брудними ножами та грубою силою. Ті, хто вижив, ніколи не забудуть жахи тих лабораторій, але врешті-решт ми захопили Чорну Гору. Ми захопили безліч цікавого обладнання та революційних досліджень, а також багатьох вчених Лисенка, які працювали на Горі. n\nОднак полонені солдати розповідають нам, що Лисенко був одержимий тим, щоб його робота не потрапила в руки «неосвічених варварів», і тому підірвав вибухівку в багатьох своїх глибоких лабораторіях, де зберігалися його найцінніші експерименти. Невідомо, чи вдалося йому втекти, чи він згорів разом зі своєю роботою, але ніяких слідів, живих чи мертвих, знайдено не було."
DRL.301.a: "Сподіваюся, ми знайшли кілька тих стильних білих халатів"

 DRL.302.t: "Перемога над Уральською лігою!"
DRL.302.d: "Землі, що перебували під «захистом» Уральської ліги, тепер належать нам. Уральська гвардія повністю розгромлена, а її уряд знищений. Пожежі поглинають їхні гулазькі фортеці, а їхні землі тепер відкриті для грабунку. І ми будемо грабувати!\n\nМи так сильно покалічимо цих людей, що вони ніколи не піднімуться знову, ми перетворимо цю землю на попіл і сіль. Нехай те, що відбувається тут, послужить прикладом того, що трапляється, коли ви наважуєтеся протистояти бригаді Дірлеванґера!"
DRL.302.a: "Нехай Ліга зникне в історії"

DRL.303.t: "Перемога над Оренбургом!"
 DRL.303.d: "Оренбург пав, їхні комуни горять, а їхні землі нарешті стали нашими! Так само, як і з Уральською лігою, ми обрушимо на ці землі таку помсту і жах, що росіяни по всьому світу здригатимуться від страху!\n\nНіколи більше не дозволимо існувати їхньому «соціальному експерименту» десь поблизу нас, ми не залишимо ніяких слідів цих дурнів, щоб їх ніхто не знайшов. Ми зробимо цю землю непридатною для життя — це єдине гідне покарання"
DRL.303.a: "Оренбург знищений, і слава Богу"

 DRL.304.t: "Перемога над Лисенком!"
DRL.304.d: "Після захоплення Чорної гори це було лише питанням часу. Зі зникненням останніх сил Лисенка ми забезпечили собі землі Магнітогорська. На цих землях небагато що залишилося, багато людей втекли від Лисенка або загинули від його рук. Але те, що тут немає людей, не означає, що вони не залишили після себе багато трофеїв!\n\nЗавоювання Уральської ліги, Оренбурга, а тепер і Магнітогорська далися взнаки нашим хлопцям, але ми дамо їм повну свободу грабувати, палити і вбивати все, що вони забажають на цих землях.\n\nТепер, коли Урал належить нам, нехай світ знає, що ніхто не може протистояти нам!"
 DRL.304.a: "Твої експерименти нарешті закінчилися, Лисенко"

DRL.305.t: "Кожному за його здібностями"
DRL.305.d: "Один із чоловіків, які супроводжували наш останній напад, сьогодні опинився перед самим Дірлеванґером, оскільки суперечка між ним і його командиром набула розголосу в таборі. Солдат зробив зухвалу заяву, що йому не надають достатньо за все, що він робить для рейдів, і що ті, хто грабує найбільше, відтепер повинні отримувати найбільше. Він продовжує стверджувати, що офіцер відмовляється надавати чоловікам їх справедливу частку, і нахабно заявляє, що власний внесок офіцера блідне в порівнянні з його, що не відображається в нагородах. Не бажаючи, щоб його аргументи були відкинуті, солдат дістає невеликий мішок з «доказами». Мішок з доказами видавав неприємний запах, і після відкриття виявився досить жорстокою здобиччю. Всередині лежало щонайменше десяток пар зв'язаних між собою вух, які, за словами солдата, він відрізав своїм жертвам під час рейдів. Солдат продовжував бурхливо висловлюватися про те, що це є достатнім доказом того, що він заслуговує на значно більшу частку здобичі, ніж йому було надано, і що він вимагає нагороди, яка відповідатиме його значно більшому внеску в справу. Усі погляди були прикуті до Дірлеванґера, який мав створити прецедент на майбутнє."
DRL.305.a: "Застрельте цього негідника, знайдіть його офіцера"
DRL.305.b: "Так, вбийте його, але перевірте його докази"

 DRL.306.t: "Сліпуча некомпетентність"
 DRL.306.d: "Дірлеванґер викроїв час зі свого надзвичайно напруженого графіка, щоб добряче провчити так званого ідіотського офіцера, який розпочав суперечку щодо справедливого розподілу трофеїв між солдатами. Багато хто в таборі вважав, що це останні хвилини життя офіцера, оскільки Дірлеванґер продовжував лаяти його. Офіцера ображали різними способами, від «клятого ідіота» до «кастрації та пониження до людського щита». Лайка та буря, що лилися з вуст Дірлеванґера, були справді вражаючим видовищем для тих, хто був присутній, оскільки словесне знищення чоловіка тривало досить довго. Дірлеванґер був, м'яко кажучи, незадоволений тим, що офіцер спричинив заворушення, які могли порушити стабільність бригади. Невідомо, чи Дірлеванґер взагалі не мав наміру вбивати чоловіка, чи в його серці прокинулося рідкісне почуття милосердя, але офіцер пішов з місця події, маючи лише страх перед кастрацією та постійне відчуття неминучої страти з рук самого Дірлеванґера. Можливо, сувора догана була все, що потрібно цьому чоловікові."
DRL.306.a: "Пляма на вашій репутації, офіцере"
DRL.306.b: "На фронт з вами!"

 DRL.307.t: "Відсутність віри"
 DRL.307.d: "Занепокоєння офіцерів, які раніше були понижені в званні, призвело до того, що група з трьох офіцерів, шукаючи безпеки в чисельності, висловила Дірлеванґеру свої занепокоєння щодо його ставлення до офіцерів, які припускаються так званих «незначних помилок». Трійця офіцерів вважає, що було несправедливо понизити в званні останнього порушника, і заявляє, що Дірлеванґер мав би завершити свої каральні дії стратою зухвалого солдата, який був справжнім винуватцем усього цього безладу. Не обов'язково виступаючи за поновлення цього офіцера на колишній посаді, троє офіцерів замість цього просять гарантій збереження робочих місць у разі так званих незначних промахів, в які вони можуть потрапити. Знову ж таки, прохання до Дірлеванґера ставить його в положення, коли він повинен створити прецедент щодо того, як бригада повинна діяти у випадку помилок і недоліків з боку керівництва. Офіцери ковтають слину і нервово переступають з ноги на ногу, мовчки молячись, щоб Дірлеванґер не підписав їх смертний вирок прямо тут і зараз. Дірлеванґер залишається вирішувати."
DRL.307.a: "Один безкоштовний промах, всім вам"
 DRL.307.b: "Дуже смішно, розстріляйте їх усіх"

DRL.308.t: "Прогресивне робоче середовище"
DRL.308.d: "Зусилля трьох офіцерів, здається, окупилися для офіцерів в цілому, оскільки їхні аргументи змусили Дірлеванґера оцінити їхні дії з трохи меншою злістю, ніж будь-коли раніше. Отримавши трохи більше свободи в своїх діях і значно менше страху бути приниженими та вигнаними, офіцери почали дихати легше. З цим новим полегшенням тягаря на їхніх плечах загальне підвищення морального духу поширилося від самих офіцерів до солдатів під їхнім командуванням, що оцінили в усьому таборі, оскільки всі, здається, мають додаткову енергію в своїх кроках на шляху до грабунку ще одного страшного містечка невинних росіян. Можливо, правління виключно за допомогою страху може привести вас лише до певної межі, думають офіцери, і, можливо, випадкові пільги або крапля свободи є корисними для загальної ефективності ваших військ. У будь-якому разі, з піднесеним моральним духом і поліпшеним ставленням, офіцери можуть командувати трохи ефективніше, прокладаючи кривавий, багатий шлях через Південний Урал і далі."
DRL.308.a: "Дірлеванґер — відомий реформатор"

 DRL.309.t: "Молодіжна некомпетентність"
DRL.309.d: "Можливо, лише деякі з лав бригади Дірлеванґера придатні для керівництва. Оскільки ще троє офіцерів загинули за незгоду з волею Дірлеванґера, їхні вакантні посади поспішно заповнили заміни. Один із цих нових офіцерів, колишній рейдер без досвіду командування, який мав на своєму рахунку лише непогані результати вбивств, спричинив ще більше проблем серед солдатів. Коли цей новий офіцер спробував продемонструвати свою нову посаду, взявши на себе командування рейдом на невелике село, він зазнав повного фіаско. Згідно з повідомленнями, накази цього молодого офіцера містили такі тактично обґрунтовані команди, як «В атаку!» і «Вбийте всіх!». Звичайно, коли селяни виявилися не просто живими опудалами, його командування зазнало ганебної поразки. Тепер, коли скарг настільки багато, що їх не можна вирішити кількома кулями, Дірлеванґер, здається, загнав себе в кут і, на жаль, підірвав силу своєї власної армії. Наразі тільки час покаже, чи це серйозно завадить рейдам бригади або навіть майбутнім військовим діям проти Уральської ліги. А поки що, здається, доведеться розстріляти ще одного офіцера."
 DRL.309.a: "Сире м'ясо псується найшвидше"

 DRL.310.t: "Більшовицький батальйон"
DRL.310.d: "Після страти сміливого солдата, який спричинив заворушення в бригаді, було прийнято рішення посмертно розглянути його «докази», щоб перевірити, чи мали його слова якусь цінність навіть після смерті. Подальше розслідування цих питань виявило дуже тривожну тенденцію, яка не просто зникла разом із смертю цього чоловіка, а заразила багатьох з тих, хто служив у його дивізії. У батальйоні нині покійного солдата панують тривожні, можливо, навіть комуністичні настрої. n\nПоки цей чоловік був живий, його ідеї про більш рівномірний розподіл награбованого проникли в свідомість багатьох солдатів, з якими він воював, і розслідування виявило комуністичні, огидні, більшовицькі, абсолютно протилежні моральним ідеям, що, можливо, солдати повинні отримувати більшу частку того, що вони вручну грабують і крадуть для себе.\n\nЗвичайно, ця тенденція є абсолютно тривожною, якщо не повністю зловісною за своєю природою. На жаль, за таких обставин виникає питання, чому офіцери цього батальйону не вважали за доцільне придушити такі ідеї, особливо з огляду на відносну легкість, з якою були виявлені ці червоні російські ідеї. Два варіанти дій здаються однаково доречними у відповідь; звичайно, простим рішенням було б усунути цю радикальну марксистську думку за допомогою рушниці, але це можна розглядати як марнування людських ресурсів і боєприпасів. Можливо, доцільніше було б з'ясувати, чому саме офіцери ще не подбали про це, і, можливо, знайти джерело проблеми"
DRL.310.a: "Застрельте цих дурнів!"
DRL.310.b: "Хто тут командує!?"

 DRL.311.t: "Червона смуга"
 DRL.311.d: "Рішення допитати офіцерів нововиявленого «більшовицького батальйону» виявилося мудрим, хоча б тому, що привело до жахливого відкриття. Коли офіцерів ізолювали і запитали про тривожні ідеї їхніх підлеглих, вони зрештою проговорилися, що навіть вони дещо зважають на думки своїх підлеглих. Ще гірше, офіцери стверджують, що такі ідеї не є поодинокими для одного батальйону бригади Дірлеванґера, а насправді досить поширені серед усієї армії Дірлеванґера! Офіцери навіть стверджують, що лише вищі ешелони, Дірлеванґер і його найближчі генерали, вважають, що офіцери повинні забирати собі більшу частину трофеїв. n\nЗіткнувшись із такими радикальними, абсурдними ідеями, Дірлеванґер залишається в роздумах, чи це все сміливий хід, щоб зробити ці дисидентські ідеї набагато поширенішими, ніж вони є насправді, чи це реальна проблема, яка закралася в уми тих, хто колись був такими жорстокими, покірними грабіжниками. Зрештою, такий блеф може бути більшовицьким задумом, щоб змусити Дірлеванґера прийняти такі ідеї, які не мають прецеденту в реальності. З іншого боку, зрадницькі офіцери, на жаль, можуть мати рацію, що може поставити під загрозу все майбутнє бригади Дірлеванґера! Якщо бригада Дірлеванґера має продовжувати своє існування, необхідно прийняти рішення, щоб запобігти поширенню екстремістських ідей про розподіл трофеїв. Дірлеванґер, звичайно, повинен прийняти рішення про наступний крок, після того як розтрощить голови цих офіцерів об землю."
DRL.311.a: "Вистежте цих червоних виродків!"
DRL.311.b: "Це абсурд, вони брешуть!"

DRL.312.t: "Вимерла ідеологія"
 DRL.312.d: "Схоже, що наша перша гіпотеза, віра в те, що зрадницькі офіцери збрехали, щоб створити враження, ніби бригада Дірлеванґера повна марксистського непотребу, була правильною. Хоча нам пощастило, офіцери все ж витратили значний час і енергію на пошуки, допити і розстріли, щоб дізнатися правду про ці справи. У будь-якому разі, бригада може бути впевнена, що справді злі ідеї про обмін між нами були раз і назавжди викорінені серед бійців. Доля крайнього лівого батальйону є милосердною, оскільки, щоб зберегти людські ресурси, їх усіх під дулом пістолета змусили відректися від своїх переконань або перетворити на сіру масу. Звичайно, батальйон тепер не становить для нас загрози, їхнє керівництво замінено суворим лоялістом, а їхні прокляті переконання принижені перед усіма ними. Бригада Дірлеванґера, на щастя, вільна від впливу, поширеного дегенеративною колишньою радянською землею, і Дірлеванґер дуже задоволений, що їхні зусилля по вбивству і грабунку всіх на своєму шляху можуть продовжуватися свіжими і безперешкодними."
 DRL.312.a: "Це було справді знищено"

 DRL.313.t: "Червоно-чорна бригада"
DRL.313.d: "Знову було розумно глибше дослідити посмертні характеристики наших бійців. На наш жаль, здається, що офіцери зовсім не брехали про присутність мерзенних комуністів у наших лавах, і їхня кількість досягла такого рівня, що Дірлеванґер і його віддані генерали не можуть просто безжально розстрілювати кожного порушника. Серед більшості наших бійців поширене жахливе переконання, що здобич слід розподіляти відповідно до індивідуальних досягнень нападників, і це переконання міцно вкоренилося в серцях наших бійців. Шок і лють, які відчуває Дірлеванґер, є очевидними, і єдине, що зупиняє його від вбивств, — це необхідність робочої сили для його грандіозних планів пограбувати і розграбувати кожен квадратний сантиметр Південного Уралу і за його межами. Звичайно, він може відмовитися від розслідування і вдавати, що ніколи не дізнавався про такі ганебні ідеї своїх людей. Потім є другий варіант: крок у темряву, яка, здається, огорнула всіх його людей. Можливо, стабільність було б найлегше досягти, якби Дірлеванґер взяв до уваги деякі з їхніх ідей. Хоча це абсолютно огидно, це, ймовірно, підвищило б бойовий дух людей, що могло б покращити ефективність нашого великого завоювання. Просто жаль, що солдати виявили в собі ідіотські нахили, але Дірлеванґер змушений враховувати бажання своєї банди катів."
DRL.313.a: "Ми можемо вислухати, тільки заради морального духу"
DRL.313.b: "Покладіть край цій фарсі"

 DRL.314.t: "Виправданий страх"
DRL.314.d: "Хоча, здається, що офіцер, який створював проблеми, не був кастрований і не перетворився на живий щит, його другий найбільший страх сьогодні збувся, коли Дірлеванґер наказав привести його до себе. Будь-яка жалість, яка, здавалося, була присутня під час їх останньої сутички, більше не була помітна, коли Дірлеванґер наказав кільком рейдерам провести офіцера до центру табору бригади, забезпечивши максимальну видимість для того, що він запланував. Коли офіцера тягли до місця призначення, Дірлеванґер ще раз вилив на нього свою злість, висміюючи його аж до самого кінця. Життя офіцера офіційно стало прикладом для всіх тих, хто, навмисно чи ні, створює проблеми для стабільності та функціонування бригади. На всі питання про те, що станеться з офіцером, було дано відповідь, коли різкий постріл з гвинтівки влучив йому в голову, поклавши край його життю на радість усім присутнім."
DRL.314.a: "Для проблеми — рішення"

 DRL.315.t: "омент для роздумів"
DRL.315.d: "Хоча його життя було майже постійною туманом диявольського хвилювання і всіляких розпуст, одного разу Дірлеванґер знайшов момент відносного спокою, перебуваючи наодинці у своєму наметі. Не маючи чим зайнятися, він оглядав приміщення в пошуках чогось, чим можна було б себе зайняти, коли його погляд зупинився на його надійній гвинтівці. \n\nВона була справді старовинною. Стандартна карабінер 98k, якою він володів ще з часів, коли був на службі у Рейху. Незважаючи на те, що його люди постійно отримували нову зброю під час своїх кривавих набігів, він зберігав і доглядав свою гвинтівку всі ці роки і продовжував використовувати її з летальним ефектом. Сівши з нею на брудні хутряні килимки, які він використовував як ліжко, він почав ретельно полірувати бруд з її зношеної поверхні. Під час роботи його думки блукали в минуле. Він провів пальцем по іржавому спусковому гачку і згадав, як його палець клацав, клацав, клацав перед обличчями зрадників Шпайделя, розриваючи їхні порожні черепи на російському снігу. Він полірував ствол і посміхався, згадуючи, як його люди вперше прибули до Орська, коли він встромив його в горло останнього мера міста і майже задушив його, перш ніж розірвати його нутрощі кулею. Його пальці пробігали по подряпинах на прикладі, і він сміявся над усіма російськими селянами, яких він просто побив до крові цією зброєю. Він тримав перед собою тепер відносно чисту зброю. Для нього дивитися на цю гвинтівку було як дивитися в дзеркало. Вона була з ним стільки, скільки він пам'ятав. Ось чому він тримав її при собі весь цей час. Вона була частиною нього."
DRL.315.a: "Хто б міг подумати, що така смертоносна річ може бути такою красивою"
 DRL.316.t: "Брудна справа"
DRL.316.d: "Коли рейдова група зупинилася на відпочинок у спалених руїнах останнього села, яке зазнало їхнього гніву, Дірлеванґер вискочив зі своєї вантажівки і пішов за чимось із задньої частини. Підійшовши ближче, він помітив, що бруд від недавніх дощів тепер вкривав бічну частину автомобіля. Він озирнувся по селу в пошуках якогось нікчемного п'яниці, на якого можна було б звалити відповідальність за чистку автомобіля, і побачив групу своїх людей, які смажили над вогнем сільських тварин.\n\nЙого погляд зупинився на одному чоловікові, який викликав у нього найбільше невдоволення. Це був казахський рейдер, який нещодавно приєднався до банди, але постійно тримався осторонь під час рейдів, уникаючи небезпеки, але з радістю беручи участь у розподілі здобичі після них. Дірлеванґер спокійно наказав чоловікові підійти. Він посміхнувся, простягнув йому ганчірку і відро і наказав за годину привести вантажівку до ладу. Обличчя боягуза миттєво зблідло, а посмішка Дірлеванґера стала ще ширшою. Кілька інших присутніх почали глузувати з бідолахи, який одразу ж почав люто шкребти бруд з побитого негодою металу. Дірлеванґер посміхнувся і пішов у село шукати здобич або полонених, щоб розважитися, залишивши чоловіка працювати, ніби від цього залежало його життя."
DRL.316.a: "Насправді, від цього і залежить його життя"

DRL.317.t: "Невеличка неприємність"
 DRL.317.d: "Чоловік нервово чекав, поки Дірлеванґер оглядав кожен сантиметр вантажівки. Боковини були тепер повністю очищені від бруду, пил був витертий з лобового скла, і навіть салон був очищений від бруду. Дірлеванґер перевірив все, один, два, три рази. Нарешті він підійшов до чоловіка і подякував йому за те, що він зробив його вантажівку чистішою, ніж вона була за довгий час. n\n«Звичайно, я сказав, що хочу, щоб вона була бездоганною...», — сказав він, і на його обличчі знову з'явилася підступна посмішка. Кров знову зникла з обличчя рейдера, коли Дірлеванґер присів і покликав його підійти і подивитися. Там, прямо під переднім лівим крилом, була маленька залишка бруду. n\nЧоловік встиг випустити з горла лише один ридання, перш ніж Дірлеванґер приставив йому до потилиці рушницю і натиснув на курок. Інші чоловіки, які спостерігали за цим, сміялися, а двоє підійшли, щоб викинути тіло рейдера до інших. Подивившись, як відвозять труп нещасного, Дірлеванґер повернувся до свого автомобіля, але, побачивши кров, що розбризкалася по дверцятах, лише зітхнув з розчаруванням. Він повернувся до чоловіка, який днями пролив на нього алкоголь, і гримнув на нього, щоб той прибрав безлад. \n\nЯк завжди, діяли ті самі правила."
DRL.317.a: "Це вже втретє за цей місяць!"

DRL.318.t: "Загублений син Німеччини"
 DRL.318.d: "Дірлеванґер був у стані сильного алкогольного сп'яніння, коли його перервали кілька його людей, які увірвалися до його намету. Не давши йому можливості вимагати пояснень, вони притягли до нього закривавленого, втомленого і виснаженого хлопчика, якому було не більше п'ятнадцяти років. Його спіймали на околиці табору, де чоловіки побили його, поки він не здивував їх усіх, вигукнувши фразу досконалою німецькою мовою. n\nХлопчик слабко благав Дірлеванґера, представившись Отто Вагнером. Він стверджував, що є сином сім'ї поселенців у Рейхскомісаріаті Московії, де був дрібним злочинцем. Він і група його поплічників втекли на схід після того, як їх спіймали на крадіжці зброї з місцевого гарнізону, але пустки і ворожі місцеві жителі земель, що не підконтрольні Німеччині, не були до них прихильними. Він був єдиним, хто залишився з тієї групи, і врешті-решт знайшов дорогу до Орська, підслухавши розмову групи міліціонерів про групу німецьких бандитів, що базувалася там. Зауваживши, що він, мабуть, є чистокровним арійцем, якщо зміг самотужки дістатися так далеко, Дірлеванґер сказав хлопчикові, що той може залишитися в таборі. Однак він міцно схопив хлопчика і погрожував йому, щоб той ніколи не проявляв неповагу до свого нового господаря. Отто швидко витер сльози, тихо подякував Дірлеванґеру і поспішно вийшов із намету."
DRL.318.a: "Не створюй проблем, хлопче"

 DRL.319.t: "Секретар"
DRL.319.d: "Майже через півроку після прибуття Отто Вагнера до табору він повільно інтегрувався в життя бригади. Він не скаржиться і не багато розмовляє, навіть коли старші чоловіки грубо поводяться з ним і час від часу б'ють його. Зрештою, йому більше нікуди йти, тож здебільшого він мириться з тим, що отримує залишки зі столу і загалом є найменшим у бригаді. Він вирішив, що хотів би мати секретаря, як у великих босів у Німеччині, який би займався всією нудною і виснажливою роботою, а вони могли б проводити час, розбиваючи голови. Мабуть, прагнучи нарешті дати Отто якусь мету, він без церемоній кинув йому в руки стос бухгалтерських книг і зошитів і сказав братися до роботи. Не наважуючись проявити неповагу до Дірлеванґера, новий секретар швидко взявся до своїх обов'язків. Задоволений тим, що хлопець більше не сидів без діла, Дірлеванґер почав шукати ще більш розпусні заняття, якими міг би зайнятися, тепер, коли його обов'язки були делеговані."
DRL.319.a: "Не змарнуй цю нагоду, інакше знаєш, що буде!"

 DRL.320.t: "Перша кров"
DRL.320.d: "Сьогодні вранці до табору привезли групу полонених, призначених для лабораторій Лисенка. Бандити загнали їх у загон, який раніше використовувався для утримання худоби, а місцевого фермера без церемоній проткнули на воротах. Хоча офіційно вони повинні були доставити всіх полонених неушкодженими до божевільного на горі, бандити ніколи не відмовлялися від можливості поглумитися над беззахисними невинними людьми. \n\nСеред сцен розпусти і безпричинного насильства молодий секретар Дірлеванґера Отто підійшов до загону. Він давно знечутлився до витівок бригади і дивився на жахи мертвим поглядом. Саме тоді він помітив невеликий блиск у пальцях одного з полонених. Прагнучи довести свою відданість бандитам і отримати трохи здобичі, Отто підійшов до чоловіка і наказав йому віддати це. На його подив, чоловік відмовився. Він відчайдушно благав Отто дозволити йому залишити це, бо це була його обручка і єдиний спогад, що залишився про його дружину. n\nКоли чоловік впав на підлогу, деякі бандити підбадьорювали його і казали хлопцеві вдарити його ще раз. Він стояв, розмірковуючи, але підбадьорення ставали все гучнішими, тож він вдарив чоловіка ногою в живіт. Він нахилився і вдарив чоловіка ще раз. І ще, і ще. Полонений благав про пощаду, а Отто ставав дедалі лютішим, але все одно відмовлявся віддати свою дорогоцінну обручку. Врешті-решт чоловік лежав холодний і бездиханний на землі. \n\nХлопчик на мить застиг у шоці, дивлячись на труп, а потім нахилився, зняв прикрасу з пальця мертвого чоловіка і підняв її, щоб усі бачили. Зібрані чоловіки радісно вигукнули на честь свого улюбленого сина і його першого вбивства."
DRL.320.a: "Тепер він один з нас"

 DRL.321.t: "Зламаний дух, зламане тіло"
DRL.321.d: "Дірлеванґер прокинувся від гучного галасу, за яким послідували крики і постріли. Вибігши зі свого намету, щоб дізнатися, кого йому доведеться застрелити, щоб припинити цей шум, він натрапив на криваву сцену. Один чоловік лежав мертвий, з вишуканим ножем у шиї, а хлопчик Отто Вагнер лежав на землі, поцяткований кулями і з понівеченою рукою. \n\nДірлеванґер розлючено вимагав пояснень, що сталося, на що один із чоловіків, які зібралися навколо місця події, пояснив, що двоє посварилися через здобич. Обидва хотіли отримати ніж собі, і коли старший чоловік відмовився поступитися, хлопчик жорстоко напав на нього. Почалася боротьба, під час якої чоловік жорстоко порізав Отто руку, перш ніж хлопчик витягнув лезо з власного тіла і завдав смертельного удару. Однак, перш ніж втратити свідомість, старший чоловік встиг дістати свій люгер і кілька разів вистрілити в хлопчика. Він не влучив у груди, але руки і плечі хлопчика були вкриті кулями. Старого негайно застрелили за те, що він поранив свого секретаря, і голосно кричали на чоловіків навколо них, які були абсолютно безпорадними, дозволивши Отто потрапити в таку халепу. Він, безумовно, ніколи більше не буде корисним як секретар, хоча з обмеженими медичними засобами, що були в наявності, його ще можна було врятувати і зробити корисним як кухаря або когось подібного. Але в таких суворих кліматичних умовах і серед таких суворих людей спосіб поводитися з людиною, яка більше не потрібна, часто полягає в швидкій і милосердній смерті. Дірлеванґер подивився на свій пістолет і подумав, що, можливо, варто просто позбавити хлопця від його страждань."
 DRL.321.a: "Мені шкода, малий..."
 DRL.321.b: "Залатайте його і знайдіть йому застосування"

 DRL.322.t: "Поклик дикої природи"
DRL.322.d: "Загін нальотчиків мчить по пагорбах у пошуках здобичі, безсумнівно уявляючи себе подібними до стародавніх монгольських орд. Їхньою ціллю є село російських селян, розташоване за наступним хребтом; воно вижило завдяки чистій удачі та недоглядам з боку бригади — дотепер. Вони не мають багато багатств, але завжди мають повні льохи, багато горілки і час від часу срібні свічники або золоті каблучки, які можна пограбувати. Загалом, це найкращий видобуток, на який може сподіватися грабіжник, не стикаючись з озброєним опором. \n\nРаптом загін зупиняється за сигналом свого ватажка. Він мовчки вказує на неглибоке ущелині, а чоловіки дивляться на нього з подивом. Там, дивлячись на них, стоїть дорослий бурий ведмідь, який саме полює на вечерю. Чоловіки завмерли, відчайдушно сподіваючись не порушити непевну тишу між ними і звіром. Нарешті, командир нахиляється до свого заступника і шепоче: «Я підійду до нього». Його помічник дивиться на нього, ніби у нього виросла друга голова, а потім заряджає патрон у зношений Мосін-Нагант у своїх руках. Краще вбити звіра, перш ніж його бос придумає ще якусь дурну ідею."
DRL.322.b: "Може, він дружній?"
DRL.322.a: "Краще перестрахуватися, ніж потім шкодувати"

DRL.323.t: "Зброя проти ведмежих пазурів"
DRL.323.d: "Не кажучи ні слова, помічник командира піднімає гвинтівку і стріляє ведмедю прямо в очі, перш ніж його начальник встигає придумати ще якусь геніальну ідею. Звір миттєво падає, навіть не скрикнувши, а з його голови на траву повільно стікає червона рідина. Після короткої дискусії охоронці вирішують зняти з нього шкуру і принести її в табір як трофей — це, безсумнівно, унікальна нагорода. n\nНа зворотному шляху до Орська командир вирішує зупинитися в іншому ущелині, сподіваючись дати коням кілька хвилин, щоб відновити сили і знайти воду. Вони не помічають невелику печеру за поворотом, а солдат, який охороняє коней, не помічає трьох дорослих бурих ведмедів, що повільно наближаються до них. Однак він, безумовно, помічає, коли ведмідь кусає його за шию. n\nКоли загін повертається до табору, він складається лише з трьох переляканих і закривавлених солдатів, які їдуть верхи на конях з подряпаними від пазурів спинами. Ні командира, ні його помічника не видно, і ніхто з них не хоче розповідати, що сталося. Все, що хтось каже, це повторює: «Ми не повинні були його вбивати, ми не повинні були його вбивати»...
DRL.323.a: «Факт: ведмеді їдять бандитів"

DRL.324.t: "Перший контакт"
DRL.324.d: "Командир простягає руку вбік, тримаючи рушницю свого помічника спрямованою в землю, не відриваючи погляду від ведмедя. З порожньою рукою, простягнутою вперед, він повільно починає наближатися до звіра, готовий кинутися бігти при перших ознаках небезпеки. Тим часом ведмідь дивиться на нього темними очима, і ні його рухи, ні вираз обличчя не видають, що він може зробити далі.\n\nПісля того, що здається вічністю, командир стоїть за кілька футів від ведмедя, який стоїть нерухомо, як статуя. Він простягає тремтячу руку і, трохи завагавшись, ніжно торкається нею верхньої частини морди ведмедя"
 DRL.324.a: "Він божевільний?!"

DRL.325.t: "Як дресирувати ведмедів"
DRL.325.d: "Це напружений момент: командир залишає руку на морді ведмедя, і ніхто не наважується навіть дихати, боячись розлютити звіра. Але врешті-решт ведмідь нахиляється вперед... і починає тертися об руку командира. \n\nЧоловіки дивляться ошелешені, коли їхній ватажок починає гладити голову ведмедя обома руками, а той чухає боком голови його військову куртку. Щоб перевірити, командир робить крок назад, і ведмідь підходить до нього, щоб залишитися поруч. Він сідає на коня, а ведмідь нетерпляче біжить поруч. «Мабуть, він все-таки дружній!»\n\nКоли вони повертаються до табору зі своїм новим другом, решта бандитів і солдатів істерично сміються, побачивши ведмедя, що біжить поруч, як вірний домашній пес. Тієї ночі, після обговорення з підлеглими (і великої кількості горілки), командир вирішує, що він повинен спробувати залізти на спину ведмедя і їздити на ньому, як на коні. Після кількох спроб командиру все-таки вдалося втриматися на спині звіра, не впавши. Він разом зі своїми людьми сміявся з абсурдності ситуації, а коли пообіцяв, що поїде на ньому під час наступного нальоту, це викликало ще більший вибух сміху!"
DRL.325.a: "Це добре... він серйозно, правда?"

 DRL.326.t: "Негайне каяття"
DRL.326.d: "Це напружений момент, коли командир залишає руку на обличчі ведмедя. Ніхто не наважується навіть дихати, боячись розлютити звіра. Ведмідь навіть здається спокійним, майже покірним... доки раптом не клацає щелепами і не перетворює передпліччя командира на криваву кашу. Він втрачає розум і просто стоїть у шоці, випускаючи крик, що леденить кров, дивлячись на жах, що розгортається перед ним. Крик швидко обривається ударом ведмежих пазурів, які впиваються йому в горло. Всі чоловіки кидаються до своїх коней, кричачи про вбивство і молячись до будь-якого бога, який може їх почути. На жаль, коні розбіглися, почувши звуки бійні, забравши з собою рушниці, і вони бачать ще двох ведмедів, що повільно піднімаються по пагорбу в їхньому напрямку. \n\nКоли загін повертається до табору, він складається лише з трьох переляканих і закривавлених солдатів, що їдуть верхи на пошматованих кігтями конях. Їхній командир і його помічник відсутні, і ніхто з них не хоче розповідати, що з ними сталося. Єдине, що вони можуть витягнути з одного з солдатів, це: «Ми повинні були триматися подалі від нього, далеко...»"
DRL.326.a: "Недобре обманювати Матір-Природу"

DRL.327.t: "Атака ведмежої бригади"
 DRL.327.d: "Після деякого часу тренувань командир загону відчуває себе достатньо впевнено, щоб взяти ведмедя, якого він назвав «Зігфрід», з собою на наступний рейд. Виявляється, що Зігфрід не найшвидший з коней, але він може розвивати пристойну швидкість протягом короткого часу і навіть не здригається від звуку пострілів. Коли чоловіки виїжджають до села, сподіваючись повернутися з здобиччю і славою, інші загони вітають їх гучним сміхом, бачачи, як Зігфрід повільно проїжджає повз них, і жартують, що командир знайшов собі російську жінку. Хоча цей напад, безсумнівно, буде небезпечнішим, ніж звичайне грабування халуп бідних селян, присутність міліції означає, що у них є здобич, яку варто захищати. Командир підганяє Зігфріда, і коні поруч з ним прискорюються з рисі до галопу. Коли загін починає відкривати вогонь, Зігфрід раптово зупиняється і падає на землю. Командир злізає з спини тварини, щоб подивитися, що сталося. На щастя, Зігфрід не постраждав; схоже, він просто спіткнувся об камінь. Хоча командир і відчуває полегшення, це все ж викликає певні побоювання щодо бойової ефективності Зігфріда — адже ведмеді не такі швидкі й спритні, як коні. Вести Зігфріда вперед може бути ризиковано з бойової точки зору, але чи варто це того?"
DRL.327.a: "Не можна зупинятися тут, хлопче. Їдьмо далі!"
 DRL.327.b: "Це занадто ризиковано, залиш його там, де він є!"

DRL.328.t: "Їхнє завдання — діяти і померти"
DRL.328.d: "Зрештою, командир вирішує, що Зігфрід буде більш корисним, беручи участь у нальоті, ніж сидячи без діла. Не гаючи ні хвилини, він знову сідає на спину ведмедя, хльостає імпровізованими віжками і направляє свого скакуна в гущу бою. Кулі свистять навколо, а ополченці відступили за вікна і в провулки свого села. Але бійці бригади Дірлеванґера достатньо досвідчені, щоб успішно протистояти ворогам, і їдуть вулицями, стріляючи у все, що рухається. Попереду ескадрону їде командир, керуючи ревучим Зігфрідом і сіючи хаос на вулицях. \n\nНарешті, чоловіки готуються до штурму останнього оплоту місцевого опору: маленької, напівзруйнованої православної церкви села. Хоча більшість місцевих розбігаються, побачивши більше десятка озброєних до зубів бандитів, що галопують на них, декілька залишаються рішучими до кінця і вистрілюють ще кілька разів з гвинтівок, перш ніж їх застрелять або зарубають. Більшість куль пролітають без шкоди, за винятком однієї. Отримавши кулю в голову, Зігфрід різко зупиняється, а командир падає на землю. Він підбігає до свого вмираючого коня, бере в руки закривавлену голову Зігфріда і востаннє закриває його темні очі. Командир встає, дістає пістолет і з рішучістю в очах підходить до селян, які ховаються в церкві. «Це за Зігфріда»."
DRL.328.a: "На добраніч, милий принце"

 DRL.329.t: "Назад до природи"
DRL.329.d: "З болісним виразом в очах командир вирішує, що краще залишити Зігфріда подалі від боїв і рухатися пішки. Діставши рушницю, він розчісує шерсть на голові ведмедя і починає марш до міста, далеко позаду своїх вершників. \n\nДо моменту його прибуття більша частина боїв вже закінчилася. Місцеві охоронці валяються на вулицях і в провулках, їхня кров просочується в бруд. Більша частина його подальших обов'язків зосереджується на затриманні та страті військовослужбовців призовного віку, розграбуванні зимових запасів продовольства, організації справедливого розподілу військової здобичі між бійцями та спаленні маленької православної церкви, де захисники міста зробили останній опір. Один з його бійців втратив коня під час атаки, але це не мало великого значення в той момент, оскільки бійці ходили від будинку до будинку і хапали все, що потрапляло їм на очі, або кого завгодно. Це місто було досить щедрою нагородою; сам командир отримав позолочений кишеньковий годинник, пляшку бренді, новий пістолет, срібний причастяний потир із церкви та кілька стосів старих радянських рублів (які давно втратили свою грошову цінність, але чудово підходили для розпалювання вогню). Але коли вони наблизилися до місця, де залишили Зігфріда, ведмедя ніде не було видно. Не було ні крові, ні слідів боротьби, але були сліди, що вели в напрямку печери, де вони його вперше знайшли. Зрештою, Зігфрід був диким, і було б нерозумно намагатися утримувати його надто довго. З важким серцем командир наказав своїм людям їхати далі, розуміючи, що це, ймовірно, останній раз, коли вони бачили Зігфріда, кавалерійського ведмедя."
 DRL.329.a: "Якщо ти щось любиш, відпусти це"

DRL.331.t: "Геніальна пропозиція"
DRL.331.d1: "Великий, задумливий розум Оскара Дірлеванґера породив геніальну пропозицію, яка, безсумнівно, була вигідною для його елітної свити: скасувати «Зіг хайль». Дірлеванґер був людиною дії, яка не підходила для незграбної соціальної інженерії римського вітання. Адже цей військовий контингент ніколи не був потрібен для махання прапорами або лестощів начальству; тут кожен був своїм власним господарем, господарем створення долі та спадщини, за якою слідували він і його люди. Страх як форма контролю завжди працював на тих, кого він тероризував, тож логічним висновком було, що він також повинен працювати на його людей, якщо вони відхилять його ідею. У своїй манії божевільний офіцер, який міг би бути успішним ландскнехтом в часи, що були і відмінні, і надто схожі на ці, забув причину, через яку його колишні господарі забезпечили собі повну покірність своїх підлеглих. Регламентація та вишкіл створили солдатів із залізною волею, і навіть якщо вони представляли своїх предків, які з жахливою відданістю грабували Центральну Європу, вірити, що вони здатні вбивати та ґвалтувати з тих самих причин, було абсолютно нерозумно. Кожного разу, коли він збирав своїх людей навколо себе, вони стояли струнко, піднявши руки під сумнозвісним кутом і вигукуючи мантру, деякі навіть з посмішками на обличчях. Ненімці почали приєднуватися до них, тиск оточення засліплюючи їх і не даючи зрозуміти, що вони роблять і яке це має значення для їхніх народів. Ще більш тривожним було те, що деякі старші ветерани його бригади тепер майже не звертали на нього уваги, караючи порушників його верховної волі з підозрілою м'якістю. Але він все ще був незамінним командиром, який приведе своїх людей до слави, тож це було лише незначною перешкодою. Або ж ні? Його старіючий розум грався з ним у жорстокі ігри в моменти ясності, перш ніж туман божевілля знову опускався на нього."
 DRL.331.d2: "Дірлеванґер був ветераном, який служив у Німецькому союзі захисту та оборони народу, потім у SA і NSDAP, а насамкінець у SS. Його дезертирство зі славного Рейху в час його потреби не було спричинене звільненням чи ненавистю до нації; його обурення щодо певних співробітників Вермахту не змінювало його любові та туги за батьківщиною. Тому рішення зберегти традицію «Зіг хайль», що об'єднувала німців у всьому світі, було для нього простим, незважаючи на велику кількість іноземців у його армії. Коли він оголосив про це рішення своїм військам, він був збентежений, виявивши в своїх рядах небажання, апатію і навіть приховану опозицію. Намагаючись підтримати свою залізну владу над бригадою, він підняв свою худу руку і клацнув каблуками з енергією набагато молодшого чоловіка. «ЗІГ ХАЙЛЬ!» — крикнув він, витріщивши очі, а на його сірій лінії волосся майже лопнула вена. На його превеликий жаль і гнів, кілька чоловіків почали хихикати, але більшість тих, хто зібрався навколо його імпровізованої трибуни, продовжували дивитись на нього з чимось, що майже нагадувало цікавість. Заплямований чоловік, наполовину потонулий у божевіллі, забув, ким він тепер керує. Чистий фанатизм перетворився на гіркий цинізм російських пусток, розбавивши бригаду СС, якою вона колись була, людьми, що шукали вигоди та були зневірені. Це були люди, які не мали ані ідеології, ані релігії; група нігілістичних мародерів, які жили з дня на день і не мали мотивації підтримувати традиції, які їх безжально покинули або зневажили. Дірлеванґер мовчки зійшов з трибуни; покарання неминуче. Його тихе бурмотіння загубилося в галасі його військ, які повернулися до того, чим займалися до того, як колишній офіцер СС виголосив свою промову, — до того, у чому вони були гордо вправні, — грабування та ґвалтування маленького зруйнованого російського села."
 DRL.331.a: "Не велика несподіванка" #failed keeping
DRL.331.b: "Принаймні вони все ще виконують накази — поки що" #failed dropping"

 DRL.332.t: "Раковий господар"
DRL.332.d1: "З кожним днем у хаотичних степах Уралу колишнього Радянського Союзу те, що колись було бригадою СС, все більше перетворювалося на просту жорстокість. Їхня моральність розклалася до цинічного нігілізму, який здивував би навіть Ніцше, і вони більше не дотримувалися жодних етичних норм, крім своїх власних. У цій зміні лежало викривлене народження, матір'ю якого була садистська радість від слухання, як загублені душі благають про пощаду, коли їх ґвалтують і катують, а батьком — гострі відчуття від смерті, яка майже щодня стукає у двері. Нескінченне насильство вселило в бригаду ідею відкинути нацизм, безсумнівно, спотворену, дегенеративну ідеологію, але все ж таку, що зберігала певні традиції, які стримували певні бажання і поведінку. Дірлеванґер, незважаючи на глибокі і навіть ніжні зв'язки з викривленою ідеологією, яка привела Німеччину до вершин, якими він скористався, відчував, що його коріння і коріння колишніх членів СС з бригади повільно пересаджуються в родючий ґрунт бандитизму ненімецьких рекрутів. Не дивно, що алкоголік і сексуальний девіант-командир скасував, а точніше забув, «Зіг хайль» — привітання, що було синонімом конформізму і суворої дисципліни. Він не був людиною, яка потребувала плазування і складних ігор влади фюрера, та й це були не часи стабільного, організованого існування; це були часи насолоди, сповненої грабежів. Це були часи смерті і слави."
 DRL.332.d2: "Незважаючи на всі дивовижні, нігілістичні різанини та грабежі, які суворі чоловіки бригади Дірлеванґера спричинили на Уралі, у своїх безжальних серцях вони залишалися вірними крові та землі, за які колись боролися. Певний ступінь поваги, навіть захоплення, був вихований і підтримувався до далекої німецької Vaterland, п'яні співали гучні марші СС, а загартовані ветерани іноді згадували солодкі та гіркі спогади про свої рідні міста, що часто викликало сміх і глузування, які завжди ледь приховували загальну тугу за вигнанням. Росіяни та інші етнічні групи, які приєдналися до бродячих бандитів, часто піддавалися жорстоким утискам з боку німецьких солдатів СС у своїх власних лавах, які впали в старі звички, а потім були несправедливо звинувачені і покарані своїми офіцерами. Було важко позбутися тягаря традицій, що накопичилися на ньому, як ракушки на уламках корабля, таких як вітання «Зіг хайль». Дірлеванґер коротко замислився, чи не вичерпало воно свою функціональність, але вирішив залишити його, до мовчазного розчарування ненімецьких бандитів і великого захоплення «арійців». Воно залишиться разом з багатьма іншими, відверто кажучи, застарілими традиціями, як основа ідентичності бригади."
 DRL.332.a: "Люди без традицій — це лише тварини у великій дикій природі" #успіх збереження
 DRL.332.b: "Не можна заперечувати природу існування" #успіх відмова

 DRL.335.t: "Необхідна компенсація"
 DRL.335.d: "Дірлеванґер прокинувся холодним, спітнілим і дезорієнтованим. Це, звичайно, не був найгірший сон, але точно той, який йому найменше подобався за останній час. Його висміювали найвищі офіцери за те, що він не мав автомобіля, який би відповідав його посаді лідера. Він був збентежений і відчував себе безсилим.\n\nМіж регулярними рейдами та веселими іграми Дірлеванґер мав багато коротких перерв, щоб подумати над вирішенням такої проблеми. Саме під час одного з таких проміжків йому спало на думку рішення. Дірлеванґер дозволив створити велику і потужну вантажівку, яка відповідала його статусу. Названа на честь свого винахідника, «Оскарваген» мала стати моторизованим арсеналом страху і вогневої сили, з гарматою, достатньо великою, щоб перетворити ферму на ліс з трісок. Коли така божественна інспірація спала на Дірлеванґера, він зрозумів, що повинен діяти. Він негайно наказав чотирьом своїм найміцнішим бруталам встановити найбільшу гармату зі свого арсеналу на даху його вантажівки. Дірлеванґер з нетерпінням чекав результатів своєї геніальної ідеї; майже настільки, що відвернув свою увагу від страти кількох селян під час свого останнього рейду."
DRL.335.a: "Оскарваген вирушає!"

 DRL.336.t: "Все готово"
 DRL.336.d: "Після тривалого часу, безумовно довшого, ніж вимагав Дірлеванґер, витраченого на створення шедевра, Оскарваген був завершений. Справжня краса, гідний фронт для бригади, він точно слугуватиме його цілям. Дірлеванґер зобов'язав усіх чоловіків, які в той час не займалися грабунками, бути присутніми на демонстрації та першому випробуванні транспортного засобу. Для чоловіків табору було несподіванкою побачити Дірлеванґера таким захопленим чимось, що не було повністю аморальним, і більшість з них не знали, як до цього ставитися, але зрештою чорна банда виявилася настільки ж захопленою, як і нервовою, перед презентацією великого Оскарвагена, про який їхній лідер так багато говорив. Дірлеванґер наказав встановити кілька старих і поламаних транспортних засобів як мішені для гармати, і з великим напруженням особисто віддав наказ про відкриття вогню з гармати."
 DRL.336.a: "Бум..."

DRL.337.t: "Стрибок гармати"
DRL.337.d: "Жоден із чоловіків, які займалися будівництвом вантажівки, не врахував цього. Коли присутні члени бригади радісно вітали перше випробування, потужний відбій гармати мав інші плани. Постріл з гармати так сильно потряс бідну вантажівку Дірлеванґера, що вона повністю перекинулася, розчавивши двох солдатів, які прийшли подивитися на це зблизька!\n\nЧоловіки раптом замовкли, збентежені і налякані тим, що буде далі. Єдиним звуком, який було чути, був гучний сміх Дірлеванґера, який був вкрай задоволений тим, що двох чоловіків розчавило. Цей сміх повільно стих, коли Дірлеванґер усвідомив, що його Оскарваген був провалом. Веселість переросла в лють, і він негайно зажадав стратити чотирьох чоловіків, яких він привів для її побудови. Деякі чоловіки, які спостерігали за цим, повільно розійшлися, а інші залишилися з поваги і страху, не бажаючи ризикувати наслідками, які могли б настати за те, що вони не підтримали свого оберфюрера."
DRL.337.a: "Посміхайтеся і аплодуйте, хлопці"

 DRL.338.t: "Оскарваген"
DRL.338.d: "Оплески бригади були гучними, але їх заглушило гучне постріл з гармати. Це спрацювало. Дірлеванґер був у захваті, задоволений тим, що нарешті отримав транспортний засіб, з якого він міг керувати і вести великі завоювання, куди завгодно: гори, так зване «велике» місто Оренбург і прославлені в'язні не могли протистояти його новій машині війни. Дірлеванґер був настільки задоволений, що, побачивши успіх першого Оскарвагена, замовив ще один, який мав слугувати запасним і ще однією чудовою машиною знищення для підкріплення його бригади. Задоволення поширилося серед усіх присутніх. Маючи за плечима успішне випробування, Дірлеванґер зажадав очолити наступний рейд. Він особисто збирався стріляти з гармати якомога більше. Дірлеванґер ледве міг дочекатися побудови другого «Оскарвагена»."
DRL.338.a: "Звичайно, це спрацювало!"

 DRL.339.t: "Броньований бойовий автомобіль"
DRL.339.d: "Якщо два Оскарвагена, основний і запасний, можуть руйнувати будинки і знищувати мрії як ніхто інший, то що буде, якщо бригада Дірлеванґера матиме їх ще більше? Яка взагалі користь від звичайних вантажівок, які лише перевозять солдатів з одного місця в інше? Але перевезення — це те, що можуть робити і звичайні солдати, деякі можуть поміститися в вантажівки, а інші можуть бігти за ними. Початкова мотивація, зробити особистий транспортний засіб Дірлеванґера особливим, раптом перестала бути такою важливою. З’явилися нові, славні бачення, коли інші зникли: вантажівки з гарматами, вишикувані як у старі часи, обстрілюють беззахисні села, а потім можуть в’їхати туди і не зустріти опору. Загони по чотири людини, всі охочі й завзяті, бажаючи керувати власним Оскарвагеном у житлові приміщення тих, хто ховав свої цінності. \n\nЙому стало ясно, що Оскарваген, чесно кажучи, був танком, і що він мав стати командиром танка, і він засвітився, уявляючи собі всю здобич, яку принесе йому його план."
DRL.339.a: "Початок чогось нового"

 DRL.340.t: "За Дірлеванґера, вперед!"
DRL.340.d: "Виявилося, що вантажівок, придатних для перевезення гармат, було не так багато, як сподівався генеральний штаб, але деякі вантажівки були переобладнані. 1-й дивізії Оскарваген було надано високий ранг у бойовому порядку, термін, який не відігравав жодної ролі в планах Дірлеванґера, щоб вони могли планувати і здійснювати нальоти без втручання незадоволених офіцерів. Ця дивізія, яка за розміром більше нагадувала велику бригаду, підпорядковувалася лише самому Дірлеванґеру. Дві вантажівки вже зарекомендували себе в рейдах, і завдяки організованій структурі, що оберталася навколо вантажівок, 36-та дивізія була мотивована і очікувала, що скоро з усіх можливих джерел почне надходити здобич!"
DRL.340.a: "Ніщо не може зрівнятися з цим"

 DRL.342.t: "Перекличка"
 DRL.342.d: "У приступі люті, який якось здивував всю бригаду, Оскар Дірлеванґер зажадав провести систематичну перекличку всіх солдатів, розбійників і бандитів під його командуванням. Хоча така переписка вже проводилася два роки тому, вона дала абсолютно марні дані, оскільки бійці бригади були надто непередбачувані, щоб їх можна було відстежити за допомогою простих цифр. Незважаючи на попередню невдачу, Дірлеванґер подвоїв ставки, коли його запитали деякі сміливці, і з тихим риком вигукнув: «Якщо ви не будете їх перераховувати, то я застрелю кожного з моїх людей і сам перерахую трупи».\n\nТакого рівня терміновості ніколи не було під час попередніх перерахунків, і майже кожен бандит має власні припущення щодо того, чому проводиться перерахунок. Сам лідер не дав жодної відповіді, крім того, що назвав це передчуттям, що не додає впевненості в необхідності всього цього тим небагатьом солдатам, які мають адміністративні навички. Однак єдине, чого вони бояться більше, ніж нудної бюрократичної роботи, — це гнів короля бандитів, і хоча всі можуть зволікати, перепис все одно буде проведено найближчим часом. Поки що невідомо, чи має якесь значення дивне передчуття Дірлеванґера."
 DRL.342.a: "Можна було б і перепис скажених собак провести"

DRL.343.t: "300 зниклих безвісти"
DRL.343.d: "Під час переклички виявилося, що не вистачає 300 осіб. Навіть з урахуванням адміністративної некомпетентності, дезертирства, звичайних зникнень, нападів ведмедів, випадкових німецьких бомб, комуністичних рейдів, страт, віспи, обмороження, падінь, самогубств, нещасних випадків біля багаття, суперечок через награбоване, застуди, чорної чуми, грипу, харчового отруєння, отруєння алкоголем, звичайного отруєння, незвичайного отруєння, вбивств, венеричних захворювань, теплового удару, гіпотермії, обвалів, невдалих наукових експериментів, наукові експерименти, що пройшли за планом, викрадення, напади собак, сказ, агресивні олені, жертви рейдів, суперечки через азартні ігри, расові війни, обвали будівель, самозаймання, зіткнення транспортних засобів, промахи під час стрілецьких змагань, стрільба по мішенях, інфіковані рани, випадкові вбивства, набагато частіші вбивства для розваги, ножові поранення, стрілянина, розгул прусської кавалерійської шаблі, розбивання ящиків, лінчування, аневризми мозку, повстання рабів, дуелі та загальна нездатність більшості бандитів у Бригаді рахувати більше, ніж кількість років, які вони прожили, ця статистика все ще є далеко незвичайною. Ми повинні розслідувати це і знайти зниклих людей якомога швидше"
 DRL.343.a: "Приведіть їх до мене, живими чи мертвими. Бажано живими..."

DRL.344.t: "Знайдено 130 зниклих чоловіків"
DRL.344.d: "Після довгих днів пошуків, що минули без результатів, велика група, що становила майже половину зниклих чоловіків, була знайдена на околицях району терору Бригади. Ця група була знайдена в таборі в селі, яке вони нещодавно розграбували, перебираючи залишки і здійснюючи звичні невимовні жорстокості над тими, кого вони захопили. Під час допиту пошуковою групою збентежені лідери серед них стверджували, що це був звичайний рейд, але після найпростішого розслідування стало очевидно, що вони намагалися приховати те, що вони здобули, і не віддавати звичну частку Дірлеванґеру. Намагалися отримати прибуток, не включаючи короля бандитів. Серйозна помилка. Це, очевидно, не могло залишитися без наслідків. Побиті і закривавлені, їх з криками тягли назад до самого Дірлеванґера, і вони не тільки були змушені віддати весь свій заробіток, але й особисто благати про пощаду. Божевільний Вюртембергер пройшов вздовж усієї лінії тремтячих 130 чоловіків, слухаючи їхні ридання і благання, страчуючи декількох, здавалося б, навмання, поки не дійшов до кінця. Тим потенційним дезертирам краще б було винести урок"
DRL.344.a: "Це їм покаже"

 DRL.345.t: "Знайдено п'ятдесят розбійників"
DRL.345.d: "Пошуки зниклих чоловіків знову дали корисні результати: в Казахстані було виявлено ще п'ятдесят розбійників. Схоже, ці розбійники не мали наміру дезертирувати, а просто грабували, коли проводилася перекличка. Вони стежили за караваном казахських селян, який привів їх до майже беззахисного, багатого міста. Вони здобули значну здобич і полонених під час жорстокого грабунку, тому невелике святкування до прибуття пошукової групи було цілком виправданим. Коли їм було наказано повернутися до бригади, спочатку ніхто не скаржився, проте незабаром стало ясно, що вони мали намір залишити всю здобич собі. Це призвело до запеклих суперечок на шляху додому і навіть до досить марного кровопролиття. Після повернення Дірлеванґера було сумлінно поінформовано про їхні злі наміри, і він ледь стримував свою лють. Він вимагав, щоб вони, як зазвичай, віддали належну частку. У незвично зухвалому акті непокори вони відмовилися прямо перед його спотвореним від божевілля обличчям. Маска людяності остаточно злетіла, відкривши кипляче божевілля, і він наказав стратити їх усіх як зрадників, а їхню здобич передати йому особисто. Подальші події були жорстокими і закінчилися тим, що всіх бунтівних бандитів понівечили до такого стану, що навіть їхні матері не впізнали б їх."
DRL.345.a: "Схоже, що кількість людей залишиться на п'ятдесят менше"

 DRL.346.t: "Розгадана давня таємниця"
DRL.346.d: "Коли люди Дірлеванґера проривалися через Чорну гору, вони зустріли кілька знайомих облич. Здається, близько п'ятдесяти чоловіків, які колись були бандитами в бригаді, були заблоковані в катакомбах темної гори, багато з них вже були мертві, інші заблоковані, багато хто перебував на різних стадіях експериментів. Їх жалюгідні благання про смерть були задоволені безжальним пострілом з пістолетів бандитів. Деякі уникнули цієї огидно жорстокої долі і працювали на Лисенка охоронцями, але ці щасливчики були, безумовно, меншістю. Один солдат вирішив перевірити цих чоловіків за списком зниклих безвісти, складеним деякий час тому, і, як і слід було очікувати, ці п'ятдесят були в ньому. Їх нарешті знайшли, хоча для багатьох було вже запізно. Тим, хто ще був живий, здебільшого дозволили повернутися до бригади, і вони розповіли багато жахливих історій про експерименти та божевілля Лисенка. Тих, хто став охоронцями, оголосили зрадниками і взяли в полон, вишикували в рівних рядах і кожного другого розстріляли. Тим, кого пощастило, з обличчями, вкритими сльозами і соплями, довелося тягнути по одному мертвому товаришу в гірські камери, які вони охороняли. Їхня доля, ймовірно, буде нещасливою, оскільки все, чим вони зможуть ласувати, — це тіла своїх колишніх друзів. Щоб зберегти залізну владу, потрібно показувати приклад. Навіть після такої знахідки, що сталася так довго після переклички, у списку все ще є імена, які не вдалося знайти."
 DRL.346.a: "Після всього цього часу..."

DRL.347.t: "Так близько"
DRL.347.d: "Ще двадцять чоловіків, яких не було під час переклички, нарешті були знайдені в ході багатьох різних індивідуальних пошуків. Це були ті, хто дезертирував і приєднався до інших, менших банд. Оскільки деякі з цих груп були знищені або поглинені бригадою Дірлеванґера, зниклих чоловіків було знайдено і покарано за дезертирство. Деякі з цих чоловіків були зниклими протягом багатьох років, і той факт, що їх було знайдено завдяки повній і абсолютній удачі, свідчить про те, що, ймовірно, багато зниклих під час переклички просто дезертирували, а деяких, можливо, ніколи не буде знайдено. Деякі з них, можливо, вже знаходяться за сотні або тисячі кілометрів, грабуючи та мігруючи в інші регіони хаотичної Росії. Однак нам все ж вдалося знайти цих чоловіків, які так довго вважалися зниклими, і це саме по собі вже є досягненням"
DRL.347.a: "Нарешті тебе знайшли!"
 DRL.348.t: "Стара нерозгадана таємниця"
DRL.348.d: "Оскар Дірлеванґер перебирав папери перед собою, шукаючи стару карту Росії, яку він дуже любив. На ній були позначені всі села, які були розграбовані кілька років тому, маленькими хрестиками, намальованими олівцем. Він хотів побачити, які з них встигли відновитися, щоб їх можна було знову атакувати. Під час пошуків його погляд привернула інша стопка старих паперів, що лежала в купі. Він витягнув їх з-під стосику застарілих схем бомб, щоб подивитися, що це таке. Це був список імен, кожне з яких було закреслено чорним або червоним чорнилом. Дірлеванґер посміхнувся. Це був багаторічний список людей, яких не було в списку особового складу. Він прочитав сторінки, дивлячись на кожне ім'я, але його посмішка зникла з обличчя, коли він дійшов до третьої сторінки. Там було кілька імен, які не були закреслені, а обведені колом. Зниклі, яких так і не знайшли. Він порахував імена, які не були обведені, їх було близько п'ятдесяти. Дірлеванґер роздратовано відкинув папери, але, продовжуючи порпатися, він просто не міг зосередитися. Як вони посміли втекти від нього і ще й уникнути покарання! О, якби тільки він міг знати їх точне місцезнаходження, знайти кожного з них, особисто покарати... Він мріяв про повішення, розстріли, тортури, крики про пощаду. Він більше не міг зосередитися на пошуках карти. Він схопив старий список і пішов шукати когось, хто міг би щось з цим зробити. Ці люди ще не були вільні. Ніхто не був вільний від нього."
DRL.348.a: "Але, пане, вони, мабуть, уже всі мертві!"

DRL.349.t: "Інспекція зброї"
 DRL.349.d: "Село було палаючим пеклом. Чоловіки втікали, діти безпорадно кричали, а смердючий запах смерті пронизував весь занепалий рай. Колишні мешканці, незалежно від віку та обставин, були безжально зарізані воїнами темряви, а їхні трупи ретельно обшукували на предмет цінних речей, перш ніж безтурботно викинути їх у попіл того, що колись було «домом». Напад був надзвичайно успішним, і коли божевільні воїни почали насолоджуватися плодами своєї праці, проти померлих були вчинені ще більш жахливі і невимовні акти дегенерації. \n\nЧерез кілька годин після оргії насильства втомлені воїни відпочивали біля входу в село, емоційно і психічно виснажені після денного кровопролиття і дегенерації. До настання ночі в повітрі запанувала дивна тиша, нарешті настав мир. Однак тиша ночі була порушена, коли командир воїнів прибув до колишнього села. Коли оберфюрер Дірлеванґер наблизився до відпочиваючих чоловіків, його божевільне обличчя освітлювало світло смолоскипа, він видав крик, від якого кров застигла в жилах, змусивши своїх людей раптово прокинутися. Коли вони підвелися на ноги, оберфюрер оголосив, що настав час для перевірки зброї, шоковані і втомлені чоловіки швидко зайняли свої місця, і перевірка почалася. \n\nОберфюрер обходив кожного чоловіка, незадоволений, перевіряючи їхню зброю, безперервно лаючи своїх вірних воїнів. Солдати стояли там, заціпенілі від страху, а Дірлеванґер мовчки спостерігав за ними. Після декількох хвилин роздумів він підняв праву руку і вибрав кількох солдатів з ряду. З-за завіси темряви з'явився розстрільний загін, який механічно підняв зброю і націлився на обраних чоловіків. Однак, незважаючи на це, оберфюрер все ще не був задоволений. Він покликав командира рейду і його підлеглого і обмінявся з ними короткими, але напруженими словами, поки Дірлеванґер допитував чоловіків. Незважаючи на те, що обидва чоловіки мали значний талант, Дірлеванґер розмірковував над тим, щоб стратити їх обох, щоб показати приклад тим, кого було врятовано від попередніх страт..."
DRL.349.a: "Вбийте також офіцерів"
 DRL.349.b: "Помилуй їх, вони не зробили нічого поганого"

 DRL.351.t: "Записка"
DRL.351.d: "Боже, пробач мені, я не знаю, хто це знайде. Вони забрали все. Мій дім, моїх людей, моє джерело існування. Мою дружину і дітей. Боже, Маріє, мені так шкода. Хотів би я щось зробити. Якби я був там, коли це сталося... Зараз уже запізно. \n\nЯ не зміг знайти їх усіх. Маленька Міша... вона зникла. Я ніде не можу знайти її тіло. Моя наймолодша дочка. Їй одинадцять. Я навіть не хочу думати про те, чи забрали вони її. Або чому. Або що вони з нею зараз роблять. \n\nТут для мене нічого не залишилося. Село в полум'ї. Я пишу це здалеку, дивлячись, як горить мій дім. У мене залишилася тільки одна рушниця і одна куля, і я знаю, що з ними робити. Я сподіваюся, що наступне життя буде для мене кращим, ніж це. Вибачте. Григорій Арбузов"
DRL.351.a: "Memento Mori"

 DRL.352.t: "Затишшя супрематизму"
DRL.352.d: "Вони напали на маєток опівночі, не звертаючи уваги на таємність, розбиваючи вітражі будівлі, маючи на меті лише вбити біженців, які ховалися всередині, та єдиного радянського генерала, який утримував маєток. Грабуючи кожну кімнату, п'яні нападники з повним байдужістю ставилися до значної колекції мистецтва, що там зберігалася, безжально розбиваючи одну роботу за іншою. Але на мить руйнування припинилося, коли вони побачили літнього чоловіка, що стояв перед одним із полотен, ридаючи і благаючи про пощаду. «Старий виродку, що це таке?» — вигукнув здивований Дірлеванґер. n\nЧоловік впав на коліна, благаючи пощадити шедевр свого батька. Банда дивилася на абстрактну, безглузду композицію, а на їхніх обличчях з'явилися зневажливі посмішки. «Це ж просто чортів чорний квадрат!» — викрикнув бригадир, викликавши бурхливий сміх. Вони приготували свої гвинтівки і почали стріляти сотнями куль у чоловіка і дегенеративне мистецтво, розриваючи фарбу і рвучи полотно. Скажене побоїще тривало, поки вони не закінчили запаленою сірником. \n\nКоли особняк охопило полум'я, один із солдатів побачив щось у димі. Щось, що сильно відрізнялося від решти, привид, який так сильно контрастував із небом, що неможливо було уявити більш досконалу, більш верховну полярність. Коли він обернувся, того вже не було. Світ мрій авангарду зник. Залишилася тільки реальність"
DRL.352.a: "Прощавай, визволене ніщо"

DRL.353.t: "Ніч, яку важко забути"
DRL.353.d: "Після завершення свого останнього нальоту бандити з Бригади ледве могли повірити своєму щастю. У підвалі старої винокурні вони знайшли гігантський запас алкогольних напоїв, який якимось чином не був розграбований за десятиліття після розпаду Росії. Повернувшись додому з горами награбованого і полонених, Дірлеванґер проголосив, що цієї ночі відбудеться найбільша вечірка в історії Росії. \n\nГорілка лилася рікою, а награбоване роздавали направо і наліво. Члени бригади швидко сп'яніли, втративши залишки самоконтролю. З заходом сонця табір занурився в какофонію диких святкувань, безглуздого насильства і невимовних розпуст. Полонені зазнали ще більших знущань, ніж зазвичай, і до ранку мало хто з них залишився живим, а ще менше — щасливим. Ніч швидко перетворилася на ще більший хаос, коли через зменшення запасів алкоголю почалися бійки. Вперше за десятиліття вулиці Орська ожили, хоча і під звуки глузування, криків і смерті. Коли похмуре небо почало світлішати з настанням світанку, бійці бригади прокинулися розпатланими, з похміллям і похмурими. Кров, фекалії та інші рідини були розбризкані по вулицях, а тіла тих, хто загинув або в хаосі ночі, або від простого алкогольного отруєння, валялися тут і там. Було зроблено мінімум зусиль, щоб прибрати це місце, і незабаром бандити просто повернулися до своїх більш згуртованих ролей жорстокості, сподіваючись уникнути гніву Дірлеванґера і його розколюючого головного болю."
 DRL.353.a: "Що відбувається в Орську, залишається в Орську"

 DRL.354.t: "Останній опір"
DRL.354.d: "Дим піднімався вгору вдалині, всього за кілька годин ходьби від нас. Село було сповнене криків і метушні, коли перелякані мешканці збирали все, що могли нести, і поспішали на дорогу, щоб врятуватися. Жінки і діти несли дорогоцінні реліквії, речі, які зберігалися в їхніх родинах протягом десятиліть або навіть століть. \n\nПоки їхні дружини і діти евакуювалися, чоловіки кричали і отримували накази, кидаючи один одному зброю і перевіряючи зброю, яку вони будуть використовувати. Багато з цих зброї були в жалюгідному стані, не використовувалися з часів світової війни і призначалися лише для полювання. Проте зброя є зброєю, і навіть ті, хто мав мисливські рушниці, не скаржилися. Вони просто зарядили свою зброю і нервово поглядали на свій мізерний запас боєприпасів. Їх запас і без того був невеликим, і вони ще мусили зберегти по одній кулі на випадок найгіршого. Чоловіки виглядали похмурими, займаючи свої позиції. В глибині душі всі вони розуміли, що не виживуть. Якщо не станеться божественного втручання, це буде їхня остання битва. Хоча вони не могли врятувати себе, вони все ще могли виграти час для своїх родин. Вони подбають про те, щоб їхня смерть була якомога повільнішою, якщо це означатиме, що вони зможуть ще раз прицілитися і натиснути на курок. \n\nВдалині почало чутися ледь чутне гудіння двигунів. Імпровізовані ополченці замовкли. Було чутно лише важкі транспортні засоби та самотню, сумну пісню одинокої пташки. Чоловіки націлили свої приціли і приготувалися до останнього бою."
DRL.354.a: "Спокійно..."

DRL.5000.t: "Афтершок"
 DRL.5000.d: "Це було майже схоже на помпезне, жахливе зображення пекла. Жадібні язики полум'я тонко простягалися і розгорталися в нічному небі, намагаючись вирватися з жалюгідної землі, з якої вони походили. Метушливі істоти на землі внизу проектували жахливу тіньову гру на засолені пасовища за межами яскраво палаючого села. Колишні елітні солдати СС і безжальні російські бандити тепер були лише жалюгідним віддзеркаленням своєї колишньої сили, що вселяла страх і повагу, але все ще зберігали своє жахливе нехтування будь-якими нормальними моральними стандартами. Жодна бідна душа не залишилася в живих після того, як бандитська чума прокотилася по маленькій сільській громаді в пошуках підходящого місця для своєї загибелі. n\nДеякі з них дезертирували, інших стратили, і тепер залишилися тільки найрішучіші та найвідданіші вбивці, яких могла запропонувати бригада. Незважаючи на це, чоловіки, що зібралися на стратегічно незайманій сільській площі, почали вперше сумніватися в результаті завтрашньої битви. Їхня чисельність зменшилася до рівня, гіршого, ніж будь-коли раніше під час їхнього грабіжницького походу російськими рівнинами. Навіть у повному складі інтенсивна жорстокість їхніх переслідувачів призвела б до піррової кровопролиття, але тепер це могло закінчитися односторонньою різаниною. Проте вони все одно готувалися до своєї загибелі. Втеча від долі більше не була можливою для цих проклятих душ."
DRL.5000.a: "Куди тепер іти?"

 DRL.355.t: "Нова гра"
DRL.355.d: "Бригада Дірлеванґера мала схильність до надмірного вживання алкоголю. Більшість людей знали про це, а найбільше — бідні душі, чиї домівки були розграбовані армією п'яниць, озброєних кулеметами. Навпаки, багато хто з них отримував задоволення від грабежів і зґвалтувань на російських пустках. Але вони робили й інші речі, щоб скоротати час, на велике полегшення навколишніх сіл.\n\nТе, що почалося з ідеї німецького солдата про нову пивну гру та російського контингенту, який постачав вкрадену горілку, стало чудовою новою традицією. Це було щось, що бригада повторювала протягом довгого часу, а в пізніші роки — і безсовісні американські студентські братства. Справжня суть гри зникла в часі, але майбутні інтерпретації загалом сходяться на тому, що в ній брали участь живий голуб, чорнильне перо і мурашник. n\nНезабаром після тієї доленосної першої ночі «ігрова» частина святкування швидко закінчилася і перетворилася на дику, розпусну вечірку, якої не бачили вже багато років. Гучний сміх було чутно за багато кілометрів."
DRL.355.a: "Дай мені склянку, я хочу спробувати..."

 DRL.356.t: "Бій, що закінчився жахливо добре"
DRL.356.d: "Хоробрі бійці бригади Дірлеванґера завжди знайдуть привід для святкування — успішний рейд, день народження товариша, річницю якоїсь попередньої перемоги, вівторок, будь-який привід, який тільки можна знайти. І ці святкування завжди супроводжуються великою кількістю горілки. Сьогодні відбулося ще одне святкування, цього разу з нагоди успішного пограбування загоном місцевої ферми, де вони викрали місячний запас зерна та картоплі, а також срібну рамку для фотографій і золоту пряжку для ременя. Як завжди, ситуація почала виходити з-під контролю. Непристойні жарти про статеві органи інших бандитів та привітність їхніх матерів сприйняли серйозно, і незабаром спалахнула бійка. Двоє бандитів, п'яні, валялися в багнюці, кричачи один одному непристойності та погрози, і швидко стали видовищем для всіх своїх товаришів по зброї того вечора. Раптом ніч розірвав постріл, який раптово припинив веселощі. Один з бійців став на коліна, дивлячись здивовано на револьвер Нагана, який якимось чином опинився в його руках. Його супротивник лежав обличчям донизу, з рота текла струмка крові. Виживший боєць підвівся, похитуючись, і штовхнув свого нещасного суперника носком черевика, невиразно промовивши: «Ваня? Ти в порядку? Тобі треба виспатися?» Не отримавши відповіді, він похитуючись відійшов і знову сів за стіл, повернувшись до своїх друзів і пляшки горілки, які були там до того, як його так грубо перервали.»"
 DRL.356.a: "Він просто дрімає, так?"

DRL.376.t: "Невідомий солдат"
DRL.376.d: "Йорг був втіленням чоловіка з бригади Дірлеванґера. Жорстокий, неохайний і позбавлений будь-яких чеснот, включаючи терпіння. Тож коли він і четверо його товаришів почали відставати від решти рейдерської групи, а їхній п'ятий — казахський рейдер Ершат — зупинився, щоб справити нужду, він погрожував відрізати чоловікові геніталії, якщо той не поквапиться. Саме тоді вони його побачили. У високій траві за п'ятдесят метрів від них стояв один із тих доброчесних уральських гвардійців, який спостерігав за загоном і, ймовірно, рахував їхню кількість, щоб доповісти про це. Побачивши, що його помітили, безіменний солдат швидко, але спокійно вискочив зі своєї позиції і почав відступати за гребінь за собою. Удо, чоловік, який був настільки ж надзвичайно жорстоким, наскільки і розумово затьмареним роками зловживання наркотиками, з радістю заревів, побачивши перспективу легкої здобичі, і кинувся в погоню. Не бажаючи залишатися осторонь кривавого спорту, Йорг та решта швидко побігли за ним. Почалося полювання. Чоловіки були сповнені завзяття і швидко дістали зброю, але солдат був напрочуд спритним, ухиляючись і пробираючись між скелями та деревами. Було зроблено безліч пострілів, але жоден з них не влучив у ціль, що спонукало Ральфа до дурної спроби кинути свою порожню зброю в ціль — безрезультатно. Зрештою, переслідування привело їх до занедбаного радянського військового комплексу. Гюнтер і Марк майже змогли схопити свою здобич біля воротарні, але солдат з вражаючою спритністю перестрибнув зачинені ворота і незабаром зник у хаосі будівель."
 DRL.376.a: "Куди поділася ця сволота?!"

DRL.377.t: "Розділення групи"
DRL.377.d: "Озирнувшись назад, чоловіки швидко зрозуміли, що остаточно втратили решту нападників. Дірлеванґер напевно розправився б з ними, якби вони з'явилися пізніше як прості дезертири, але, можливо, якщо вони приведуть йому живого полоненого солдата з числа його найненависніших ворогів як нову іграшку, то це вгамує гнів боса?\n\nЙоргу вдалося знайти пролом у гнилій огорожі, через який група проникла всередину. Вийшовши на невелике поле поруч зі старими казармами, вони швидко зрозуміли, що опинилися на досить великій території. Їхня ціль могла бути де завгодно, і якщо вони не будуть обережними, вона може просто прослизнути повз них і втекти тим шляхом, яким вони прийшли. Тоді Ральф запропонував розділитися і розійтися по території. Адже чим швидше вони його знайдуть, тим швидше зможуть зібратися разом і добряче його побити. Чоловіки погодилися. Йорг, Марк і Ральф домовилися обшукати бараки, а Гюнтер взяв Удо, щоб обстежити адміністративну будівлю. Коли Ершат рушив за ними, Йорг відштовхнув його і наказав охороняти ворота, щоб їхня здобич не втекла. Якщо він знову спробує вийти через ворота, вони легко знайдуть його за криками казаха. Розподіливши ролі, три групи розійшлися, щоб полювати на безіменного солдата. \n\nЖоден з них не помітив солдата в тіні, який дивився на них зі старої сторожової вежі. Крізь вузьку щілину свого візора він спостерігав, як групи розходяться, відзначаючи їхні шляхи і запам'ятовуючи планування бази зверху. Плануючи вузькі місця. Визначаючи місця для засідки. Плануючи найжахливішу смерть для кожного з них."
DRL.377.a: "Виходь, виходь, де б ти не був..."

 DRL.378.t: "Смерть з неба"
DRL.378.d: "Ершат горів від люті, коли Йорг та інші від'їжджали. Його час у бригаді був сповнений кровожерливих різанин і невимовних задоволень, проте він вічно ненавидів німців та їхню самовпевнену зверхність над ним та іншими казахами. Він майже вирішив залишити їх у їхніх марних пошуках і втекти. Ніхто не повинен знати, що він колись був пов'язаний з бандитами. Він міг поїхати на південь і оселитися у того, хто зараз контролював Казахстан. \n\nЗвичайно, Ершат був боягузом, який тримався за бригаду, бо вважав за краще бути з ними, ніж проти них. Тож він робив те, що йому казали. Як завжди. Раптом його увагу привернув скрип дерева. Обернувшись у бік звуку, він побачив темну постать, яка швидко зникла в маленькій коморі для інструментів, а двері за нею зачинилися. Нарешті, шанс проявити себе! Ершат кинувся до комори, готуючись подолати солдата і представити свою здобич тим гордовитим німцям. Вирвавши двері, він підняв шаблю, готовий завдати удару, і... Сарай був порожній. У ньому не було вікон, і, крім кількох куп старих інструментів, не було де сховатися. Ершат з лютим невіруванням дивився на приміщення, принижений власною дурістю і починаючи замислюватися, чи не мають рації німці. n\nСаме в цей момент він відчув дивне бажання поглянути вгору.\n\nТам, тримаючись всіма чотирма кінцівками за стіни сараю, стояв той пекельний солдат, його замасковане обличчя безвиразно дивилося на нього зверху. Це було останнє, що побачив Ершат, бо постать стрибнула вниз і встромила кинджал йому в череп."
 DRL.378.a: "ААААААА!"

DRL.379.t: "Довге падіння"
DRL.379.d: "Піднімаючись вузькими сходами, Гюнтер розмірковував над тим, як це взагалі можливо, що в цей момент він ненавидить Удо ще більше, ніж зазвичай. У цьому обмеженому просторі сморід немитого бандита був нестерпним. Він був майже марним у пошуках, бо цей божевільний дурень більше задоволений тим, що розбиває випадкові предмети меблів. Гюнтер майже вирішив нарешті вбити його і звинуватити в цьому солдата, якби Удо не був настільки дивно і жорстоко сильним, що міг розірвати його на дві частини. \n\nКоли вони обшукували верхній поверх, Гюнтер глянув у вікно і оглянув табір. Саме тоді він помітив, що Ершат більше не стояв біля воріт. Його поганий настрій поглибився, і він вирішив, що після перегрупування виб'є кілька зубів цьому нікчемному казаху. Саме тоді його вуха вловили ледь чутне тріскання і розколювання дерева зі сходової клітки. Однак його ривок, щоб перевірити, був перерваний, оскільки він ледь не спіткнувся об Удо, який сидів на колінах і хихикав над залишеними оголеними фотографіями. Перед тим, як він нарешті не витримав і не розтрощив голову ідіоту, його погляд кинувся до сходової клітки і зупинився на невідомому солдаті, який дивився на нього без видимих емоцій. Двоє бандитів майже одночасно кинулися до нього, але вони ніколи не дісталися б до нього. З раптовим тріском підлога під ними провалилася, і двоє впали на перший поверх. Удар був настільки сильним, що вони пробили і цю підлогу, впавши купою на першому поверсі. Гюнтер закричав від болю, його рука і нога були зламані в декількох місцях. Удо лежав у судомах, велика тріска від дерева проникла йому в мозок. Гюнтер кричав про допомогу, а солдат спускався сходами, відкинувши пилку, якою він послабив дошки. Гюнтер не міг дістати свою зброю і міг тільки дивитися, як солдат ногами вдавлював скалку глибше в череп Удо, а потім взяв лопату і кілька разів ударив нею Гюнтера по голові."
DRL.379.a: "Ні, зачекайте! Ми можемо...!"

 DRL.380.t: "У каналізацію"
DRL.380.d: "Інші троє бандитів обшукували різні бараки, перевертаючи старі ліжка і розриваючи запилені шафи в пошуках своєї здобичі. Обшукуючи різні будівлі, Ральф натрапив на кілька старих приміщень, зокрема їдальню та загальні душові. Коли він з цікавістю розмірковував, чи душові ще працюють, з іншої частини бази долинув жахливий звук горлових криків і віддалених ударів лопатою. \n\nЙорг і Марк побігли перевірити, що там сталося, але Ральф був упевнений, що вони впораються. Адже це був лише один солдат, що він міг зробити проти німецьких вовків? Увійшовши до вогкого і затхлого душового приміщення, він по черзі перевірив кожну душову кабіну. Розчарування наростало, коли одна за одною всі кабіни не давали обіцяного струменя, аж поки нарешті в одній з них дивом виявилася невелика кількість води. Струмінь був мізерним і дуже холодним, але для бандита, такого брудного і заплямованого своїми гріхами, це було освіжаючим полегшенням. n\nКоли Ральф обмивав обличчя і руки, він не помічав фігуру, яка повільно підкрадалася до нього ззаду. Занадто пізно він побачив тінь на стіні, відкинуту світлом, що проникало через вхідні двері. Тінь меча, піднятого для удару. Він обернувся якраз вчасно, щоб побачити, як лезо впилося йому в груди. Незмінна фігура в масці підняла меч і знову встромила його. І ще раз. І ще раз. Ральф кричав від болю, його слабкий опір ставав все слабкішим з кожним ударом. \n\nКоли він нарешті впав на землю, втрачаючи життя, Ральф дивився, як постать спокійно відвернулася від моторошної сцени і вийшла за двері. Коли остання крапля крові покинула його тіло, останні залишки води змили все в каналізацію."
 DRL.380.a: "Геть, ти, психопат! ААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААААА Для раба бути таким впертим і відмовлятися здаватися переважаючим німецьким воїнам було найтяжчою образою, яку він міг собі уявити. Він уявив, як ловить цього негідника і сміється, коли той благає його про пощаду.\n\nКоли Йорг почав розробляти план, з того місця, звідки вони щойно прийшли, пролунав ще один жахливий крик. Цього разу, вирішивши зловити цього виродка, Марк вибіг з будівлі, а Йорг намагався не відставати від нього. Вони помчали по відкритій галявині, сподіваючись, що прямий і швидкий напад дозволить їм здолати ворога. Без попередження з-за однієї з казарм пролунав постріл, куля просвистіла над головою Йорга і врізалася в траву. Опинившись на відкритій місцевості, двоє відчайдушно сховалися за казармою, а Йорг відкрив вогонь зі свого люгера. Однак Марк не встиг, і куля влучила йому в ногу, збивши його з ніг. Коли Марк закричав від болю, Йорг встиг побачити, як солдат вибіг з бараку і з незвичайною впевненістю попрямував до них. Він підняв пістолет, щоб вистрілити, але прокляв, коли порожній пістолет лише клацнув у його руках. Відступивши за найближчу будівлю, він почав перезаряджати зброю, але зрозумів, що залишив додаткові боєприпаси у запасах рейдерської групи. Марк корчився на підлозі, коли фігура наближалася. Поклавши гвинтівку набік, він дістав з пояса гострий сокиру і приготувався замахнутися. Його жалюгідні благання про пощаду не змогли зупинити сокиру, яка врізалася йому в груди, руку і обличчя."
 DRL.381.a: "Ні! Будь ласка, будь ласка! НІ-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-І-"
 DRL.382.d: "Йорг, який бачив, як його товариша зарізали на його очах, і який витратив усі свої боєприпаси, застиг на місці, відчуваючи почуття, якого не відчував дуже давно. Страх. Постать, на візорі якої застигла кров з понівеченого тіла Марка, повільно підняла погляд, щоб подивитися на нього. Настала мить тиші. Жоден з них не рухався. Солдат кинувся вперед. Йорг втік у паніці. Втікаючи, щоб врятувати своє життя, переслідуваний маніяком з сокирою, він пробіг повз душову і побачив закривавлене тіло Ральфа. Переслідування також привело його повз сарай, де Ершат зустрів свою гірку смерть. Йорг швидко усвідомив справжню небезпеку ситуації, в якій опинився. Шість чоловіків полювали на одного самотнього вовка, але тепер залишився тільки він, і мисливець став жертвою. Наблизившись до огорожі, через яку вони увійшли, він з жахом викрикнув, побачивши, що його переслідувач мав навіть прокляту передбачливість, щоб заблокувати її. Це був не людина, а розважливий демон — або, швидше за все, ангел — посланий покарати його за гріхи. Не маючи куди подітися, він побіг до старого автопарку, де все ще стояло кілька поламаних вантажівок, і спробував загубити переслідувача в завалах."
DRL.382.a: "Що ти таке?!"

 DRL.383.t: "Останній опір"
DRL.383.d: "Причаївшись за старим транспортним засобом, Йорг відчайдушно намагався не дихати. Він чув кроки невідомого солдата, який методично і цілеспрямовано обходив кожну з решти вантажівок, шукаючи свою здобич. Він відчайдушно оглядав місце, шукаючи будь-що, що могло б йому допомогти, коли раптом помітив старий монтажний ключ, що лежав під його схованкою. n\nОбережно взявши його в руки, він повільно підкрався до задньої частини вантажівки, сподіваючись застати свого переслідувача зненацька. Він обережно чекав, поки переслідувач пройде, а потім зібрався з силами. Міцно стискаючи зброю, він різко обернувся навколо вантажівки і...\n\nТам нікого не було.\n\nВін лише на мить заплутався, а потім почув свист повітря за спиною. Йорг встиг ухилитися в останній момент, і сокира пролетіла в декількох сантиметрах від нього, з гучним ударом врізавшись у вікно вантажівки. Він обернувся і з силою вдарив шиномонтажним ключем по голові ворога. Звичайно, він забув, що його супротивник носив товстий шолом гвардії з козирком. Єдиною реакцією солдата було легке бурчання від подиву. Навіть розвага. n\nВідкинувши сокиру, солдат схопив Йорга за шию і почав стискати. Задихаючись, той люто розмахував зброєю, сподіваючись влучити в якесь чутливе місце. На мить він побачив очі солдата крізь козирок і вперше побачив палаючу, злобну ненависть.\n\nМахом ноги він зміг вивести солдата з рівноваги, і вони обоє впали на землю. Тепер, позбавлені зброї, вони вдалися до відчайдушної бійки, кожен з усіх сил б'ючи іншого. Вони кидали один одного, і обидва були залиті кров'ю. \n\nВрешті-решт, тільки один чоловік залишився стояти."
DRL.383.a: "Помри, проклятий!"

DRL.384.t: "Останнє повідомлення"
 DRL.384.d: "Коли Оскар Дірлеванґер прокинувся наступного дня, його підлеглі повідомили, що кілька членів останнього рейду зникли безвісти. Ймовірно, дезертири. Він пообіцяв, що якщо вони коли-небудь повернуться, то їх буде вбито, і на тому все. День продовжувався, Дірлеванґер продовжував жити своїм грішним життям, і зрештою він знову заснув. n\nКоли він прокинувся наступного дня, він вийшов зі свого намету і побачив велике заворушення. Його люди вивели його з табору до моторошної сцени. Шість дерев'яних кілків. На кінцях кожного з них були нанизані голови зниклих чоловіків. Один з кинджалом, встромленим у голову. Один з дерев'яним кілком, встромленим у мозок. Один з розбитою черепною коробкою. Один напрочуд чистий. Один забруднений власною кров'ю.\ n\nА одна була побита, розчавлена і розбита до невпізнання.\n\nДірлеванґер на мить замислився над цією сценою. Потім він знизав плечима і наказав усім повернутися до своїх справ. Він продовжував жити своїм грішним життям і зрештою знову заснув. Голови залишалися на кілках, мовчки пильнуючи табір наступного дня, і наступного, і наступного, поки їхнє м'ясо повільно не згнило.\ n\nВдалині невідомий солдат спостерігав за табором. Він бачив, як Дірлеванґер не звертав уваги на попередження. І тоді він зрозумів, що єдиний спосіб донести до нього це повідомлення — це винищити до останнього члена його орди кошмарів."
DRL.384.a: "Ще один звичайний день у Росії"

 DRL.385.t: "Втеча?"
DRL.385.d: "Йорг забіг до покинутого фермерського будинку і впав на землю, важко дихаючи.\n\nЛедве врятувавшись з військової бази, колись стоїчний і жорстокий бандит тепер лежав, майже плачучи від шоку від того, що сталося. Сім загартованих бійців бригади проти одного чоловіка з жіночної Ліги, і ось який результат? Якщо він повернеться зараз, Дірлеванґер, швидше за все, вб'є його не за дезертирство, а за сором. Він втішав себе тим, що той звіроподібний чоловік, з яким вони боролися, більше не був проблемою. Востаннє він бачив солдата, який лежав на землі, сильно кровоточачи, як розбита людина. Обдумуючи свої наступні кроки, він оглянув фермерський будинок і зазначив, що це чудове місце для проживання. Можливо, він міг би перечекати тут кілька місяців, а потім зустрітися з однією з інших груп розкольників і повернутися до свого життя руйнівника. Йорг ліг на старе ліжко і спробував заснути. Його сон не тривав всю ніч. Йорг прокинувся від того, що чоловік у масці дивився на нього з ліжка. Хоча солдат був укритий вм'ятинами і засохлою кров'ю, він був цілком живий. Йорг закричав, коли невідомий солдат жорстоко бив його тим самим шиномонтажним ключем, який він колись використовував, а потім крики припинилися, і Йорг нарешті заснув назавжди."
DRL.385.a: "Не ти! Чому ти не вмираєш! АААААААААААААААААААААААААААААААААААААААААААААААА"

 DRL.400.t: "Прихильники Лисенка тікають на південь"
DRL.400.d: "Була темна ніч поблизу Орська, коли група таємничих людей прибула до табору бандитів Оскара Дірлеванґера. Ці зневірені душі з виснаженим поглядом і виснаженими тілами розмовляли незрозумілою мовою і нахабно вимагали від охоронців табору дозволити їм зустрітися з самим королем бандитів. Стримуючи себе від того, щоб вбити їх на місці і заволодіти їхніми дивовижними технологічними іграшками, охоронці спочатку не могли зрозуміти, чому хтось наважився висунути такі вимоги найстрашнішим злочинцям Південної Росії. Лише після того, як вони розпізнали деякі словесні підказки, вони зрозуміли, що це були вчені з Магнітогорська, які втекли від своєї долі від своїх колишніх посіпак з НКВС. Ті, хто вижив з лісенківців Магнітогорська, дізнавшись про жахливу долю своїх товаришів в руках НКВС, негайно покинули свої лабораторії та заводи, забравши з собою найцінніші речі в сибірську пустелю. Усвідомлюючи, що за свої жахливі злочини жодна розсудлива громада не прийме їх, вчені спробували знайти притулок у таборах Дірлеванґера, вірячи, що Чорний Бандит знайде застосування їхнім знанням і врятує їх від смерті. n\nДізнавшись про своїх нових гостей, Дірлеванґер негайно наказав своїм людям конфіскувати все майно вчених і розкидати його по табору, а також доручив своїм новим підлеглим розпочати масове виробництво зброї та припасів, ставлячись до своїх нових слуг навіть гірше, ніж до рабів. Безсумнівно, Дірлеванґер отримував садистське задоволення від усього цього процесу, адже тепер під його жорстоким пануванням опинилися ті самі люди, які глузували з нього за те, що він був неписьменним варваром. Для колишніх лісенківських вчених більше нічого не мало значення. Тільки виживання."
DRL.400.a: "Як впали могутні"

#Фактичні події смерті Дірлі
DRL.401.t: "Найприємніша диявольська пастка!"
DRL.401.desc: "Після розриву відносин між Лисенком і бригадою Дірлеванґера відкритий конфлікт був практично неминучим. Однак мало хто очікував, що Дірлеванґер наважиться безпосередньо вторгнутися в Чорну гору, але король бандитів і його люди все ж спробували захопити вершину. Надійшли повідомлення про великі втрати, і хоча бригада зрештою зуміла пробитися до об'єкта, міни-пастки, встановлені роками раніше саме на такий випадок, вбили десятки бандитів. Одним із тих, хто загинув від підступних пристроїв, був сам Дірлеванґер, якого раптово і жорстоко уразило струмом пастка з натискною пластиною на дверній ручці. Його банда, хоча в кінцевому підсумку і досягла успіху в захопленні гори, вже вступила в внутрішню боротьбу за здобич"
DRL.401.a: "Шокуюча смерть"

 DRL.402.t: "На лезі ножа"
DRL.402.desc: "Члени банди бандитів Дірлеванґера прокинулися в шоці, коли їхнього ватажка знайшли мертвим, зарізаним у спину старим багнетом під час сну. Хоча особистість вбивці невідома, багато хто вважає, що це зробив дивний чоловік, який вільно розмовляв німецькою мовою і з'явився поблизу табору за день до того. Багато хто вважає, що цей чоловік був агентом, посланим якимось нацистським чиновником, який бажав смерті Дірлеванґера, щоб взяти контроль над бандою.\n\nХаос швидко охопив бандитів, але незабаром прибули німецькі агенти і запропонували їм роботу, і багато хто з них тепер повертається на захід з новою місією"
DRL.402.a: "Жорстоке життя закінчилося жорстоко"

 DRL.403.t: "Скелястий кінець"
DRL.403.desc: "Здавалося б, неминуче зіткнення між Чорною горою та бригадою Дірлеванґера сьогодні досягло свого апогею. Після розриву відносин Дірлеванґер та його люди напали на Чорну гору, найімовірніше, намагаючись захопити та стратити Лисенка, божевільного вченого, який мешкає в горі, перетвореній на лабораторію. Незабаром після зіткнення з залишками 22-ї мотострілецької дивізії НКВС, яка охороняла Лисенка і його експерименти, було повідомлено, що люди Дірлеванґера штурмували комплекс, що призвело до надзвичайно великих втрат з обох сторін. За хитрим планом, кілька полонених мотострілецької дивізії вказали Дірлеванґеру і його людям на двері, які, за їхніми словами, вели до кімнати, наповненої «всіма багатствами Магнітогорська». Однак у довгому коридорі лабораторії, що вів до зазначених дверей, один із людей Дірлеванґера ненавмисно натиснув на натискну пластину. Пастка, розташована над Дірлеванґером і його особистими охоронцями, швидко відкрилася, і з нізвідки впало кілька важких валунів, які миттєво і жорстоко вбили вторгників. Після повідомлення про смерть їхнього ватажка між членами банди почалася внутрішня боротьба, що дозволило людям Лисенка взяти верх. Після шести годин запеклих боїв бригада Дірлеванґера була змушена відступити з гірського масиву, залишившись лікувати свої рани і поступово розпадатися."

 DRL.403.a: "Дірлеванґер був під кайфом чи що?"
DRL.404.t: "Божевільний герой Сходу" #-charlesthe50th
 DRL.404.desc: "Дірлеванґер нещодавно придбав коня, якого назвав «Завоювання Уралу», або коротко «Урал». Це був найкращий кінь з усіх, на яких натрапив Дірлеванґер, шукаючи здобич на кордоні своєї особистої території. Це був прекрасний чорний жеребець з трикутним знаком на голові. На тлі коричнево-жовтого кольору рівнин він виблискував, немов скелетна краса. Прочитавши стару брошуру про козаків, Дірлеванґер вирішив наслідувати їхні відважні атаки. Сівши на свого жеребця і подарувавши групу поні своїм найкращим підлеглим, Дірлеванґер і його банда поїхали до табору на Уралі. Б'ючи коня батогом з рішучістю перемогти ворогів, навіть захисники були шоковані його швидкістю, враховуючи його вік. Раптом кінь Дірлеванґера почав злісно брикатися. За мить Дірлеванґер впав і покотився по кам'янистій землі. Неважливо, чи кінь загинув від щасливої кулі, чи спіткнувся, чи просто перевтомився. Важливо те, що Дірлеванґер мертвий."
DRL.404.a: "Так само, як загинув Чингіс"

 DRL.405.t: "З широко відкритими очима"
DRL.405.desc: "Після його захоплення членами Уральської ліги, правосуддя для Дірлеванґера було швидким. Після швидкого судового розгляду, що відбувся в одній з багатьох фортець ГУЛАГу на Уралі, бандита витягли назовні і, транслюючи це на старому радіопередавачі по всій Південній Росії, розстріляли. n\nДірлеванґер відмовився від пов'язки на очі і плюнув на розстрільну команду, перш ніж вони вистрілили.\n\nНа звуки пострілів з рушниць натовп по всій Росії, який слухав на старих, знайдених радіоприймачах, одночасно вибухнув оваціями. Навіть кілька лідерів воєначальницьких держав надіслали свої вітання"
DRL.405.a: "Схоже, він нарешті змирився з долею"

 DRL.406.t: "Запитати дорогу» #-переписано ackbar, спрацьовує тільки якщо Дірлеванґер перебуває у стані війни
DRL.406.desc: «Поки його розбійники воювали і гинули, Оскар Дірлеванґер, здається, був більш задоволений тим, що сидів у командному наметі і напивався зі свого особистого запасу алкоголю. Його люди були досвідченими вбивцями, а вороги — купкою прославлених селян з гвинтівками, тож очікувалася швидка перемога. Однак навіть найвидатніші солдати можуть досягти лише обмеженого успіху з некомпетентним командиром, не кажучи вже про п'яного до нестями. \n\nКоли хід битви почав змінюватися на його користь, помічники Дірлеванґера боялися повідомити йому про це, побоюючись, що він застрелить їх у п'яному запалі. Він не помітив цього, поки звуки ворожої стрілянини не стали тривожно близькими до його позиції. Дірлеванґер нервово вихилився з намету, впав на коня і поїхав у неправильному напрямку. Коли він наблизився до ворожих позицій, солдати не могли повірити своїм очам: їх найнебезпечніший ворог мчав прямо на них, бурмочучи німецьку пивну пісню. Коли він був менш ніж за три метри від ворога, він нарешті зрозумів, що щось не так. Він порожньо запитав: «Зачекайте, де я?» — і солдат перед ним відповів, випустивши кулю з пістолета-кулемета в череп Дірлеванґера."
DRL.406.a: "Задавай дурні питання, отримуй дурні відповіді"

 DRL.407.t: "Повідомлення для всіх зацікавлених осіб" #Gunnar Von Pontius#/LordViruscide
 DRL.407.desc: "Комюніке 22.d з офісу товариша Лисенка: Під час бою з силами Чорної гори, які захищали об'єкт, німецький офіцер СС Оскар Дірлеванґер був застрелений у перестрілці. Це суперечить попереднім наказам щодо Дірлеванґера. Всі норми алкоголю припиняються на період не менше (1) одного тижня.\n\nКомуніке закінчено"
DRL.407.a: "Додаток: 36-й підрозділ знищений як функціональна одиниця"

DRL.408.t: "У пастці"
 DRL.408.desc: "Між Лисенком і Дірлеванґером завжди були напружені стосунки, і не дивно, що Дірлеванґер спробував розпочати наступ на Чорну гору. Однак, можливо, йому слід було витратити більше часу на підготовку атаки. Сьогодні він і багато хто з його бригади зазнали жахливої долі після того, як він увійшов до покинутої шахти, яка, як вважалося, вела до серця гори. Коли вони увійшли в шахту, на чолі з самим Дірлеванґером, вхід до шахти обвалився, придавивши кількох членів бригади і заблокувавши більше трьох чвертей всередині. Без запасів вони навряд чи виживуть довго"
DRL.408.a: "Місцеві жителі мали б попередити його... якби тільки він розмовляв російською"

 DRL.409.t: "Той щасливий старий Сонце"
DRL.409.desc: "Коли було оголошено, що легендарна «Сонячна гармата» Герінга впаде на Землю, багато хто відреагував шоком і страхом, побоюючись, що вона може впасти в населеному місті або десь, де може спричинити масові екологічні збитки. Однак, коли її траєкторія попрямувала до Уралу, полегшення було відчутним, оскільки багато хто припустив, що вона впаде десь у зовсім безлюдному місці. \n\nОднак уламки впали на південь, і багато хто в головному «військовому таборі» бригади Дірлеванґера прокинулися в шоці, коли палаючі уламки падали з неба, немов Божий суд. Більшість втекли на конях або на знайдених транспортних засобах, але коли вони повернулися до табору, то виявили, що їхній лідер, Оскар Дірлеванґер, і його особистий транспортний засіб були розчавлені величезною сонячною панеллю з нанесеним на неї свастикою."
DRL.409.a: "Це така річ... наукова річ. Не хвилюйтеся про це"

DRL.410.t: "Пекельне попередження"
DRL.410.desc: "Сильний снігопад минулої ночі вкрив землю білим покривалом. Воно було цілком незайманим, за винятком кількох... слідів. Найманець не переймався цим, оскільки це була стежка, якою майже всі йшли до лісу. Пройшовши близько хвилини, він натрапив на гілки, придатні для багаття. Перш ніж він встиг їх зібрати, його погляд привернув червоний предмет на землі. Піднявши його, він одразу зрозумів, що це було — закривавлений палець. Він швидко відпустив його, але потім побачив краплі крові, що вели далі в ліс. Червоний слід був перекритий кущем, але найманець не зупинився і пробрався крізь нього. Він швидко промокнув кров'ю, якою був просочений кущ, але продовжив йти. На іншому боці куща він знайшов джерело крові. Там, на великому дерев'яному кілку, висіла голова Дірлеванґера, навіть без очей і частини нижньої щелепи. Поруч з головою лежали обгорілі залишки його уніформи, а сморід сечі свідчив про те, що вона була зіпсована ще до спалення. Решта тіла Дірлеванґера була розкидана по галявині, яку приховував кущ. Більша частина його оголеного торсу була грубо прибита до дерева. З дерев звисали кінцівки, а в снігу лежали напівзакопані кишки. Найманець не знав, як реагувати, і єдиною його думкою було те, що він не хоче зазнати такої ж долі. Вибігаючи з галявини, він помітив фотографію. На ній був зображений Дірлеванґер з кількома чоловіками в масках за його спиною, які тримали зброю, націлену на його голову. \n\nУ таборі відсутність командира ставала очевидною, і багато хто вже підозрював, що він мертвий. Тож коли найманець показав фотографію своїм начальникам, швидко почався хаос..."
DRL.410.a: "Такий чоловік наживає собі багато ворогів"

 DRL.411.t: "Лінія"
DRL.411.desc: "Коли Борман доручив своєму новому підрозділу таємних операцій проводити розвідку та надавати тактичну підтримку Уральській лізі, багато хто був засмучений тим, що їхнє завдання не включало вказівки зупинити Дірлеванґера та покласти край воєнним діям його так званої «бригади». «М'ясник Сибіру» занадто довго був ганьбою для арійської раси, і більшість вищого командування вважала, що його смерть необхідна для очищення німецької честі від плями. Команда таємних операцій «Дельта-4», здається, погодилася з цим, оскільки незабаром після свого прибуття вона відокремилася від своїх уральських союзників і розпочала самостійний штурм табору бригади Дірлеванґера. Керівник команди, Мартін Валькер, оголосив, що «вбив цього виродка», і попросив про негайну евакуацію. Існують непідтверджені повідомлення, що вищі ешелони німецького керівництва розлючені тим, що «Тіньова дивізія» відхилилася від наказів, але якщо це правда, то вони, здається, вирішили приховати свої почуття і публічно привітали та вшанували капітана. Цікаво, що смерть Дірлеванґера, здається, викликала невелике виправдання Рейху в очах населення південного Уралу, і кількість місцевих колабораціоністів та інформаторів помітно зросла."
DRL.411.a: "Він, мабуть, відчуває себе героєм"

 DRL.412.t: "Кінець дорожнього воїна"
DRL.412.desc: "З моменту розпаду Радянського Союзу російські пустки стали місцем насильства і хаосу, де небезпека чатує в мільйонах різних форм. Навіть просте дозвілля може бути небезпечним для життя, як показали сьогоднішні події. n\nДірлеванґер і кілька його поплічників сьогодні ганяли на кількох утилізованих автомобілях по околицях його комплексу в змаганні, яке було на одну частину драг-рейсингом, а на п'ять частин — демолішн-дербі. Під час заходу Дірлеванґер сидів на пасажирському сидінні свого власного модифікованого автомобіля, кричав інструкції водієві і стріляв з пістолета в інших учасників, а іноді й у глядачів. Вичерпавши боєприпаси, в приступі люті Дірлеванґер вискочив з кабіни свого автомобіля, намагаючись викрасти машину конкурента. Однак, схоже, він прорахувався зі своїм стрибком, оскільки не влучив у двері автомобіля і був розчавлений його колесами. За повідомленнями, він ще кілька хвилин тримався за життя, а його останніми словами були: «Я не хочу так помирати. Я хочу померти історично». Після його смерті вже почали поширюватися чутки про внутрішні чвари в банді."
DRL.412.a: "Побачте його"

DRL.413.t: "Жах" #-Гуннар, перероблений Акбаром
DRL.413.desc: "Плануючи свій останній напад на периферійні російські села поблизу Орська, Оскар Дірлеванґер висунув нову ідею: замість того, щоб просто їхати або йти туди, вони можуть реквізувати старі пароплави і здійснити напад вздовж річки Урал. Коли настала ніч, Дірлеванґер наполягав на тому, щоб його люди продовжували рух, і його пароплав продовжив рух вгору по річці; він не знав, що решта людей розбили табір на березі річки на ніч. Вони намагалися наздогнати свого ватажка, але їх все більше затримували проблеми з двигуном, негода та переслідування російських партизанів, що тривали тижнями. \n\nКоли вони нарешті знайшли пароплав Дірлеванґера, він був наполовину затонулий біля берега покинутого російського села. Решта екіпажу була мертва, судячи з усього, вбита кулями та багнетами. Єдиним живим у селі був сам Дірлеванґер, який сидів виснажений, в маренні і напівмертвий у хатині. Чоловіки принесли його на один зі своїх пароплавів і негайно попрямували вниз по річці, сподіваючись якнайшвидше повернутися до Орська і отримати належну медичну допомогу. Однак стан Дірлеванґера продовжував погіршуватися, і він нарешті помер менш ніж за добу до Орська. n\nВигляд тіла Дірлеванґера, яке вивантажували в табір бригади, одразу ж викликав хаос, який незабаром переріс у загальну бійню. Схоже, що 36-та бригада як група загинула на річці разом зі своїм лідером."
DRL.413.a: "Герр Дірлеванґер — він мертвий"

 DRL.414.t: "Червоне весілля"
DRL.414.desc: "Непростий союз між Дірлеванґером і Лисенком часто розглядався багатьма як дисфункціональний шлюб, що характеризувався явною неприязню один до одного та глибокою недовірою. Запрошений до Чорної гори для випробування нової зброї, Дірлеванґер із радістю погодився. Він так довго сподівався розкрити таємниці загадкової фортеці на вершині гори, що не пошкодував коштів, щоб взяти з собою своїх найкращих бійців. Після довгих святкувань і милування новою зброєю алкоголь почав литися, як кров із мертвого. Наркотики, алкоголь, жінки — здавалося, що світ, хоча б на хвилину, став справедливим і чистим. Оскар мав би знати, що не варто втрачати пильність, навіть коли його кликала прекрасна ветеранка Західно-Російської війни. Лисенко, за допомогою своєї авангарди, обеззброїв п'яних бійців бригади в найвразливіший момент. З різким криком і опущеною рукою, за якими послідував галас пострілів, весь поверх лежав мертвий. Згідно з повідомленнями, тіло Дірлеванґера пізніше пронесли по околицях, а Лисенко тріумфально вигукнув, що монстр Уралу мертвий."
DRL.414.a: "Гора стала полем битви — ні, м'ясницькою лавкою"

 DRL.415.t: "Розтерзаний"
DRL.415.desc: "Сьогодні вранці Оскар Дірлеванґер спробував прорватися до таємничого комплексу в Магнітогорську. Однак одразу після початку експедиції він був розірваний навпіл на одній із численних мін-пасток Лисенка, які забрали життя ще багатьох членів бригади, перш ніж вони нарешті дісталися до центру. Незважаючи на перемогу, бригада була сильно ослаблена і, ймовірно, більше не становитиме великої загрози"
DRL.415.a: "Бувало й гірше!"

 DRL.416.t: "Макаров"
DRL.416.desc: "З моменту розпаду Радянського Союзу справедливе право і справедливість вважалися міфом, казкою, що давно минула і ніколи не повернеться на спустошені землі Росії. Принаймні, такою була думка більшості людей, що населяли бомбардовані пустки. Однак, схоже, справедливість все ще карає найгірших. n\nЯкимось чином, можливо, завдяки хабарам або просто тому, що рейдеры не сприймали його серйозно, чоловік, який називав себе «Уральським рейнджером», зайшов у військовий табір бригади і кинув виклик Дірлеванґеру на дуель. Закінчивши сміятися, Дірлеванґер прийняв виклик, вірячи, що зможе заробити тридцять шосту позначку на своєму Люгере.\n\nО 11:20 дуель розпочалася. Бригада в повному складі зібралася, щоб подивитися на це видовище, і багато хто вірив, що Уральський рейнджер, якого деякі називали «красивим блятом», ось-ось зустріне смерть. Однак ці очікування були зруйновані, коли рейнджер, озброєний Макаровим, швидко витягнув пістолет і влучно вистрілив у Дірлеванґера. n\nКоли хаос, що виник після смерті ватажка бандитів, переріс у насильство, уральський рейнджер, здавалося, зник, знову ставши частиною безкрайніх пусток Росії, щоб більше ніколи не з'явитися на люди."
DRL.416.a: "Де той рейнджер взагалі сховав Макарова? У стегні?"

 DRL.417.t: "Німецька лінія вогню"
DRL.417.desc: "Застрельте мене зараз або застрельте пізніше, кожен школяр має своє захоплення. Смерть кожному боягузу, я відрікаюся від суду вашого фюрера!» — такі слова промовив зрадник-офіцер СС Оскар Дірлеванґер незадовго до того, як він зустрів свою смерть від рук німецького розстрільного загону. З поверненням Рейху на землі Росії, влада в Німеччині вирішила, що в їхньому новому порядку немає місця для батальйону Дирлевангера, і справедливість, якої так довго не могли домогтися росіяни, яких він і його люди тероризували, була відновлена спеціальною оперативною групою Вермахту. Зі смертю свого лідера і окупацією їхніх земель, бригада Дирлевангера більше не буде створювати проблем для походу Вітчизни на Росію."
 DRL.417.a: "Дивно поетично для збоченого зрадника"

DRL.418.t: "Подарунок Лисенка"
DRL.418.desc: "Після завоювання Чорної гори Магнітогорська Чорний Бандит влаштував для членів своєї бригади грандіозне свято з алкоголем, жінками та піснями. Це був момент святкування для чоловіків, які роками знали тільки війну, і світло та сміх було чутно за багато кілометрів. Коли церемонія була в самому розпалі, сам Оскар Дірлеванґер, король бандитів Уралу, вистрілив зі свого люгера з кузова вантажівки, привернувши увагу натовпу. Але перш ніж він встиг звернутися до своїх послідовників, лідер Терористичної бригади почав кашляти червоною кров'ю. Глядачі не наближалися, коли червона рідина текла по підлозі, боячись заразитися тим самим недугом, що й їхній повалений командир, але їм не пощастило. Незабаром багато членів бригади почали виливати кров зі своїх нутрощів. Мало хто вижив після бенкету Дірлеванґера, і ще менше людей знають, що стало причиною цієї жахливої сцени, але чутки, поширені біженцями, розповідають про зброю, розроблену Лисенком під назвою «Червона смерть», яка викликає подібні симптоми, і ходять чутки, що члени бригади контактували з її випробувальними об'єктами."
 DRL.418.a: "Лисенко приніс подарунок на бенкет"

DRL.419.t: "Причини невідомі" #Lord Viruscide
DRL.419.desc: "Під час звичайного маршу через очищену територію, як стверджується, Оскар Дірлеванґер, керівник 36-ї бригади, раптово впав з сідла і був знайдений мертвим. Причина смерті невідома, через брак кваліфікованих лікарів 36-та бригада могла лише встановити, що він не був отруєний, на його тілі не було виявлено вхідних ран, а шия не була зламана під час падіння. Подальше розслідування зараз неможливе, оскільки 36-та бригада в основному розпалася в результаті боротьби за лідерство..."
DRL.419.a: "Це моя третя найбільша страх — аневризма мозку"

 DRL.420.t: «Чисте божевілля» #-переписано Акбаром
DRL.420.desc: «Коли Оскар Дірлеванґер оглядав своїх солдатів на імпровізованому стрільбищі табору, він раптом схопився за ліву сторону тіла, скаржачись на біль у грудях. Його швидко відвели до медичного намету, де він почав кашляти кров'ю, що одразу ж змусило його охоронців запідозрити, що це не медична надзвичайна ситуація, а навмисний замах на життя їхнього командира. Коли Дірлеванґера готували до операції, його останніми словами перед втратою свідомості були слова до хірургів: «Сподіваюся, ви всі німці». Він більше ніколи не прокинувся. Операція в кінцевому підсумку виявилася невдалою — кров накопичилася в його легенях і задушила його, як сказали лікарі, — але вона виявила причину його смерті: шість пострілів з унікального типу 7,62-міліметрових патронів, що використовуються в револьверах Нагана, випущених в його верхню частину спини з близької відстані. Охоронці обшукали табір, намагаючись знайти когось із відповідною зброєю, і незабаром знайшли винуватця: нового члена на ім'я Іван Билінкін, якого спіймали, коли він намагався втекти з табору верхи на коні. Після короткого допиту він зізнався у злочині, сподіваючись, що залишки Радянського Союзу на півночі Росії зустрінуть його як героя. Серед його нечисленних речей були листи, написані до таких важливих осіб, як генерал Георгій Жуков і відома льотчиця Євдокія Бочарова, в яких він навіть просив руки останньої. Але цього було недостатньо, щоб відновити порядок; Дірлеванґер не призначив собі наступника, і в таборі незабаром спалахнули сутички між лейтенантами.
DRL.420.a: «Це один із способів справити враження на жінку».

 DRL.421.t: "Переслідуваний" #- Чорнобиль/Лорд Вірусцид
DRL.421.desc: "Сьогодні стало відомо, що сумнозвісний командир СС Оскар Дірлеванґер був жорстоко вбитий у своїх казармах на Уралі. За повідомленнями, Чорний Бандит мав звичку замикати в'язнів у маленькій кімнаті з зграєю голодних собак. Судячи з усього, один із в'язнів спробував втекти і першим заштовхнув Дірлеванґера в клітку для собак, зачинивши за собою двері. Собаки, зголоднілі після декількох днів невдалих рейдів без їжі, напали на Дірлеванґера і розірвали його на шматки. Коли через кілька годин це виявили його підлеглі, собак негайно забили, а між бандитами почалася міжусобиця. 36-та дивізія розпалася в результаті жорстоких сутичок"
 DRL.421.a: "Живи мечем, помри від... голодної собаки?"

DRL.422.t: "Простий, але раптовий кінець" #-Палкс
 DRL.422.desc: "Сьогодні з Уралу надійшла звістка про смерть Оскара Дірлеванґера, але не так, як можна було б очікувати від людини з такою страхітливою репутацією, як у нього. Оглянувши село, його врешті-решт знайшли мертвим у багнюці, а неподалік від його тіла лежав камінь.\n\nПісля того, як вони залякали селян, які ще були живі, щоб дізнатися, чи бачили вони, що сталося з їхнім ватажком, вони виявили, що старий чоловік, побачивши, як страшні бандити в'їжджають у село, підняв камінь і кинув його в Дірлеванґера. Цей постріл був влучним, влучивши Дірлеванґеру прямо в голову і миттєво вбивши його. \n\nДізнавшись про це і покинувши село, між бандитами одразу ж спалахнули сутички, і бандитська армія вже починає розпадатися."
 DRL.422.a: "Це був щасливий кидок!"

DRL.423.t: "Передозування" #- Екзокамп
DRL.423.desc: "Хоча деякі повідомлення, що надходять із занедбаних земель Уралу, можуть бути досить неточними, здається, підтвердилося, що Оскар Дірлеванґер мертвий. За загальноприйнятою версією, під час рейду на село Дірлеванґер і його люди виявили схованку з дезоморфіном. Вважаючи це найкращим знахідкою за останні тижні, банда Дірлеванґера жадібно спожила весь запас, причому сам Дірлеванґер взяв більшу частину дезоморфіну, ніж будь-хто інший. Через кілька годин Дірлеванґера знайшли в комі, майже без ознак життя. Незабаром між членами банди почалася бійка, оскільки кожен намагався заволодіти рештою дезоморфіну, який Дірлеванґер сховав."
DRL.423.a: "Тримайтеся подалі від наркотиків, діти Росії"

 DRL.424.t: "Розбитий молотом" #- DanThe#Man
 DRL.424.desc: "Звістки, що надходять з півдня Уралу, свідчать про те, що Оскар Дірлеванґер, страшний Чорний Бандит, загинув жахливою смертю. Під час нальоту на село на околиці Оренбурзької комуни Дірлеванґер загнав у кут, здавалося б, беззахисного селянина в робочу хатину. Побачивши, як його жертва тремтить перед ним, Дірлеванґер замислив найогиднішу смерть для бідного селянина, коли той раптом схопив єдину зброю, яка була у нього під рукою, — кувалду! Селянин з великими зусиллями підняв важкий і незручний інструмент, а Дірлеванґер, здавалося, був надзвичайно розвеселений його кволими спробами. Дозволивши йому зробити кілька незграбних ударів, Дірлеванґер реготав, кілька разів без зусиль ухиляючись від його атак. Він був настільки занурений у власний сміх, що не зреагував, коли селянин нарешті завдав влучного удару, пробивши череп бандиту і поклавши край найнещаснішому чоловікові в Росії. Без Дірлеванґера колись страхітлива банда негідників розпалася і, як очікується, більше не буде турбувати жителів російських степів."
DRL.424.a: "Грандіозний фінал"

DRL.425.t: "Березневі іди" #-DanThe#Man
 DRL.425.desc: "Сьогодні у східній Росії вибухнули святкування, оскільки, за повідомленнями, відомий бандит Оскар Дірлеванґер був убитий, і ніким іншим, як його власною бригадою. Схоже, що дрібна суперечка через здобич набула надмірного розголосу, і багато старших членів бригади гаряче сперечалися між собою, аж до того, що дійшло до бійки. Дирлевангер, який і без того був у гіршому настрої, ніж зазвичай, вибухнув гнівом на своїх людей, назвавши їх «синами повій» та іншими образами, і проголосив, що як їхній ватажок, він отримає всю здобич. \n\nЦе, очевидно, змусило декого з людей остаточно втратити самоконтроль, бо пізніше тієї ночі, коли Дирлевангер вийшов у туалет, на нього напала група з майже десятка осіб і нанесла йому безліч ножових поранень. Коли його життя згасало, Дірлеванґер усвідомив, що це були ті самі люди, яких він образив востаннє лише кілька годин тому, і які, судячи з усього, очолював його заступник Фріц Шмедес. Коли Шмедес радісно підійшов, щоб завдати смертельного удару, все, що Дірлеванґер зміг зробити, перш ніж його світ поринув у темряву, — це слабо проклясти своїх людей за їхню остаточну зраду. n\nШмедес спробував взяти під контроль бригаду, але, на щастя для народу Росії, багато бандитів відмовилися визнати його керівництво, і швидко спалахнуло насильство. Різні фракції всередині бригади розкололися і зникли в глибинах Сибіру, а те, що залишилося, є лише тінню того, що колись було бандою кошмарів."

DRL.425.a: "І ти, Фріц?"
 DRL.426.t: "Помічено Комет!" #- Alexmaths, перероблено Ackbar, стріляє тільки якщо Дірлеванґер переміг Лисенка
DRL.426.desc: "Коли бійці 36-ї бригади після перемоги обшукували руїни Чорної гори, вони знайшли невеликий ангар, в якому, здавалося, був повністю справний винищувач! Після ретельного огляду механіками бригади було підтверджено, що це був ракетний винищувач Komet, ймовірно збитий під час війни на Західній Росії. Схоже, що Лисенко наказав своїм підлеглим витягти уламки, відвезти їх до Чорної гори, розібрати для вивчення, а потім відремонтувати до робочого стану. Ще більш вражаючим було те, що механіки підтвердили, що він повністю працездатний. Звичайно, Дірлеванґер не міг не організувати імпровізоване авіашоу, щоб продемонструвати потужність нової одномісної авіації бригади. Було зібрано достатню кількість палива, колишній російський пілот зголосився добровольцем, а на порожньому полі за межами Магнітогорська було зведено імпровізований оглядовий павільйон. Коли «Комет» з гуркотом злетів, Дірлеванґер та інші командири з радістю спостерігали, як ракетний винищувач виконував основні маневри з блискавичною швидкістю в чистому небі. Але коли пілот спробував продемонструвати свої навички і виконати бочковий переверт, щось пішло не так. З двигуна почав вириватися дим, винищувач втратив контроль і почав стрімко падати на землю. Він врізався в землю зі швидкістю сотні миль на годину, спаливши все під собою, а саме оглядовий павільйон. \n\nКоли чоловіки нервово обшукували димлячі уламки, все, що вони знайшли від свого лідера, — це купки обвуглених кісток і осколків, занадто подрібнених, щоб навіть остаточно ідентифікувати їх як його останки."
DRL.426.a: "Це знак!"

 DRL.427.t: "Ледве вистачить, щоб убити людину"
DRL.427.desc: "Хоча проблема алкоголізму Оскара Дірлеванґера зазвичай не була серйозною проблемою для його бригади, іноді вона створювала досить незручні ситуації. Під час особливо сильних нападів алкогольного сп'яніння командир часто кидав виклик будь-якому чоловікові, який знаходився досить близько, щоб вступити в бій. Зазвичай під час таких сутичок Дірлеванґер наносив дикі удари своєму супротивнику, а той робив вигляд, що бійка зі старим чоловіком є дуже напруженою. Бій закінчувався тим, що солдат робив вигляд, ніби один з ударів Дірлеванґера влучив у ціль і збив його з ніг. Однак цього разу бій пішов не так, як зазвичай, оскільки Дірлеванґер вирішив замість цього притягнути чоловіка до себе. Командир вже був нестійкий на ногах через велику кількість випитого алкоголю, і додаткова вага солдата тільки прискорила його падіння на землю. Це викликало лише обережне хихикання у навколишніх солдатів. Солдат впав коліном прямо на груди Дірлеванґера, що супроводжувалося чітким хрускотом. Командир, здавалося, не зреагував на це і просто похитнувся, піднімаючись на ноги. Хоча солдат знав, що, ймовірно, зламав ребра, він вирішив, що краще просто не згадувати про це і уникнути покарання. Натомість він знову підійшов до Дірлеванґера і поплескав його по спині як жест доброї волі після бійки. Другий удар викликав ще один хрускіт, який зупинив командира бригади на місці. Потім він впав на землю, мертвий."
 DRL.427.a: "Це не могло його вбити!"

DRL.428.t: "Удушення" #- Екзокамп
DRL.428.desc: "У рідкісному випадку хороших новин на території колишнього Радянського Союзу повідомляється, що помер страшний ватажок бандитів і колишній офіцер СС Оскар Дірлеванґер. Хоча подробиці не підтверджені, здається, що ватажок бандитів був задушений у своєму ліжку іншим бандитом, який сподівався отримати всю його здобич. Хоча бандит був швидко покараний жорстокою стратою, порядок у бригаді порушився, і цілком очевидно, що без Дірлеванґера його бригада не протримається довго в пустелях Росії"
DRL.428.a: "Мабуть, Оскар задихнувся, ділячись здобиччю"

DRL.429.t: "Небо в полум'ї" #-Alexmaths
DRL.429.desc: "Була пізня ніч, коли небо раптом спалахнуло. Грім був таким гучним, а спалахи такими яскравими, ніби самі боги відкрили небеса і випустили всю свою лють. Це видовище викликало у бійців бригади Дірлеванґера рівну міру подиву і страху — дві емоції, яких багато хто з них не відчував вже досить давно.\n\nДірлеванґер зібрав своїх головних лейтенантів у своєму наметі. Поки бійці базікали про богів, лідерам бандитів було ясно, що почалася ядерна війна. Залишалося тільки вирішити, як вони будуть реагувати. Раптом хтось викрикнув, що до табору з неба летить щось, схоже на падаючу зірку. Це була не зірка. Дірлеванґер не встиг розгледіти ракету, як вона впала в центрі табору і занурила все в атомне полум'я. Хто запустив бомбу? Про це знають тільки попели, а вони не розмовляють."
 DRL.429.a: "Нічого не залишилося..."

DRL.430.t: "На полі бою" #- Panzer
DRL.430.desc: "Хоча люди Дірлеванґера в кінцевому підсумку досягли успіху в знищенні Уральської ліги, остаточна боротьба за їх останню фортецю-гулаг виявилася його загибеллю. Під час битви снайпер Уральської гвардії в одній із сторожових веж зумів виявити бандита, який керував своїми людьми під час спалення «міста», і влучив кулею в серце бандита.\n\nХоча Ліга все одно програла битву і розбіглася по горах, банда Дірлеванґера незабаром розпалася, розбившись на численні угруповання після смерті свого лідера"
 DRL.430.a: "Досить милосердний кінець для такого чоловіка"

DRL.431.t: "Останній в'язень ГУЛАГу" #- Panzer
DRL.431.desc: "Коли Дірлеванґер і його люди штурмували чергову фортецю Уральської ліги, вторгнення пройшло так само, як і інші. Величезні втрати для бандитів, запеклі захисники Ліги, які відмовлялися поступатися жодним сантиметром землі, гігантська битва за невеликий шматок стародавнього бетону. \n\nОднак, коли Дірлеванґер цього разу увійшов у нижні секції в'язниці, очистивши зі своїми людьми кілька бастіонів опору, він опинився відрізаним. \n\nЗаблукавши в тунелях в'язниці, Дірлеванґер незабаром опинився в камері і, помилково, зачинився в ній. Його люди знайшли його кілька днів по тому мертвим, причина смерті невідома. Залишивши його тіло в камері, вони незабаром вступили в міжусобицю, і бригада Дірлеванґера вже розпадається, не маючи явного лідера."
DRL.431.a: "В'язниця, за яку варто померти"

 DRL.432.t: "Відпустити" #- Panzer
 DRL.432.desc: "Дірлеванґер, спокушений обіцянкою Чорної гори, не зміг втекти. Опинившись всередині підземель і катакомб об'єкта, він не зміг вибратися звідти. Дірлеванґер незабаром загубився у величезній системі тунелів і зрештою помер. Об'єкт, відтворюючи багато звуків, які він чув через стародавні мікрофони, на занедбаних акустичних системах, створив новий голос, який лунав у тунелях разом з іншими, що заповнювали катакомби. Це було результатом забутих пристроїв, які залишалися увімкненими роками, і мало на меті передавати голоси інших. Він набув нового вигляду в Бандиті. Засіб, що дозволяє мертвим почати знову, говорити в темряві, у вічності"
 DRL.432.a: "Потрапити в Чорну гору не складно. Складно відпустити"

DRL.433.t: "Афонос" #- Тінідс
DRL.433.desc: "Двоє чоловіків раніше мали невелику розмову про смерть. Повертаючись з кровопролиття, про яке вже забули, але ще не пробачили, вони обмінялися думками про те, як вони були свідками всіх способів, якими людина може перетворитися на матерію, про те, як безглуздим і рутинним стало те, про що не можна говорити. Вони розмірковували про самого Дірлеванґера. Його смерть була приречена на вогонь в день суду і загибелі всіх безбожних людей. Капітан мертвий, оголосив Шмендес. Немає чого оплакувати. Він наказав групі, яка тепер була лише тінню колишньої себе, рухатися далі. І вони так і зробили, за винятком полковника та офіцера. Вони запитали, що сталося з оберфюрером. «Вам немає чого знати», — відповів він. «Прийде час поховати його». n\nНе переконані, двоє дезертирували з бригади і повернулися на місце бою, де незабаром знайшли одягнені в уніформу трупи тих, хто загинув від рук росіян. На пагорбі лежали уламки автомобіля, який, як відомо, був улюбленим транспортним засобом їхнього командира, і на землі була вражаюче глибока яма. Полковник піднявся на височину, а потім завмер, його обличчя повністю паралізувало видовище ями. n\n«Боже мій». Він ще деякий час дивився в яму, потім моргнув і повернувся, щоб піти, його обличчя спотворилося від гримаси, занадто сильної, щоб її виразити словами.\n\n«Що з ним сталося, Дітріх?» Він не відповів. «Дітріх?» Офіцер повільно піднявся на пагорб і зазирнув у яму.\n\nТрансляція закінчується тут"
 DRL.433.a: "Господи, помилуй"

DRL.434.t: "Потоплення" #- Tinyds
DRL.434.desc: "Бармен методично взяв усі пляшки горілки, які мав, вилив половину з кожної і наповнив їх етанолом. Він не мав можливості дістати отруту, але мав великий запас алкоголю і передбачав наближення лиха. Він знав, за яким схемою діє бригада, і знав, що в центрі геноцидної рутини лежить знецінення будь-якого алкоголю, який вони можуть знайти, а потім нестримне пияцтво, перш ніж починаються найжахливіші злочини. Його план полягав у тому, щоб сп'янити бандитів до такої міри, що вони не змогли б знищити нікого, крім самих себе. Коли почалася буря, він лежав мовчки у своєму підвалі, слухаючи німецькі крики і сміх зверху, які з часом перетворилися на крики, бійки і блювоту. Він не знав цієї мови, але розумів, що вони ставилися до горілки не як до отрути, а як до виклику. Але коли ніч добігала кінця, тремтіння вщухло, і незабаром він заснув, переконаний, що його план провалився і він врятував тільки себе. Прокинувшись наступного ранку, він піднявся зі свого підвалу, очікуючи побачити тільки зруйнований бар і зрівняне з землею місто. Те, що він побачив, залишили його без слів. По всьому пабі були розкидані бездиханні тіла членів групи, які лежали на стільцях, тримаючи в руках порожні пляшки з алкоголем. Сам командир лежав на уламках розбитого скла, його обличчя було майже невпізнанним через понівечення. Всі відвідувачі передозували. Панування терору закінчилося."
DRL.434.a: "А ще кажуть, що росіяни п'ють безвідповідально..."

 DRL.435.t: "Привиди Хатині" #- Tinyds
DRL.435.desc: "У той самий момент, коли загинув зрадник Оберфюрер, самотній вигнанець почув гуркіт грому. Він поглянув на бурхливе зимове небо, а потім знову взявся до роботи на полі. n\nНе минуло й кількох хвилин, як до його поля підбігла молода дівчина і заговорила. Їй було десь менше тринадцяти, але її блакитні очі здавалися втомленими і нескінченно старими. «Все скінчилося», — сказала вона фермеру білоруською мовою. Він дивився на дитину з недовірою. Він не чув жодного слова рідною мовою вже кілька десятиліть. Потім вона побігла назад у хвойний ліс.\ n\nМинуло півгодини. Фермер уже збирався піти додому, коли побачив удалині чоловіка з рушницею в руках, якого не впізнав, але обличчя якого здавалося йому дещо знайомим. «Фльора, мій брате», — прошепотів він, знову своєю мовою. «Підійди і подивися». Фермер не міг повірити, що це не сон. З часу масового вбивства ніхто жодного разу не вимовляв його ім'я. Навіть він сам. Він пішов за чоловіком у пустку. Вони йшли мовчки, поки не натрапили на тіло, над яким сиділи дочка чоловіка та її мати, шукаючи в його чорній уніформі щось, що можна було б врятувати. Кульове поранення пробило йому груди, і кров текла з нього, як зірки з неба на землю. Знову об'єднані товариші не мали потреби впізнавати, хто він був. Стоячи над трупом, двоє товаришів взялися за руки. А потім вони почали співати пісню з їхньої молодості в Хатині. Вони співали пісню про весну."
DRL.435.a: "На Південному Уралі все старше за людину і наповнене таємничістю"

DRL.436.t: "Вибухові результати" #- Екзокамп
DRL.436.desc: "На щастя для навколишнього населення, офіцер СС Оскар Дірлеванґер, як повідомляється, загинув! Під час чергової поїздки з метою грабунку комуни в диких сільських районах Росії, Дірлеванґер, здається, натрапив на нерозірвану німецьку бомбу, скинуту під час одного з численних бомбардувань, що постійно тероризували цей регіон. Побачивши можливість продати її на чорному ринку, Дірлеванґер наказав кільком чоловікам допомогти йому розібрати її. Однак це рішення виявилося серйозною помилкою для ватажка бандитів, оскільки недосвідчені грабіжники розбили бомбу, що спричинило вибухову реакцію, яка вбила Дірлеванґера та його помічників. Повідомляється, що ланцюг командування в бригаді був порушений, і майбутнє 36-ї бригади тепер під питанням"
DRL.436.a: "Вбитий власною некомпетентністю"

 DRL.437.t: "Питання віри" #Лорд Вірусцид
DRL.437.desc: "Церква не мала назви, у ній було лише кілька священиків. Тут мешкали лише згорблені старі та вразливі молоді люди, які шукали чогось більшого, ніж постійна тяжка праця. Тепер у неї не було даху, а полум'я лизало все вище і яскравіше проти темного від бурі неба. Кілька дрібничок, які ще не були віддані полум'ю, були складені в купу для розподілу між бандитами, а найціннішою частиною здобичі був могутній меч, який, як вважалося, був привезений до Святої Землі і назад хрестоносцем-лордом. Чорний Бандит сам із задоволенням стратив дев'ятьох чоловіків, змусивши їх стати на коліна в жахливому світлі їхньої віри, що перетворювалася на попіл. Дев'ятий чоловік здавався змирився зі своєю долею, задовольняючись молитвою, тоді як інші благали і просили про неіснуюче милосердя. Різкий гуркіт пострілів відлунював віддаленим громом. Зупинившись, щоб перезарядити зброю, Дірлеванґер плюнув на дев'ятого чоловіка і через перекладача запитав його: «Чому ти не борешся, як інші?» Дев'ятий чоловік просто відповів: «Бог захистив мене від царя, Бог захистив мене від червоних, Бог захистив мене від німців. Я вірю понад усе, що Бог захистить мене від тебе». Спокійна непокора чоловіка розлютила Дірлеванґера, який відкинув пістолет і взяв меч хрестоносця. Намірившись забити священика до смерті затупленою від часу зброєю, він підняв меч високо над головою. Блискавка влучила в Чорного Бандита, який впав на землю мертвим. 36-й розбігся в страху, розсіявшись під прикриттям бурі. Священик взявся ховати мертвих і присвятив свої зусилля відновленню церкви."
DRL.437.a: "Матвія 20:16: Тож останні будуть першими, а перші останніми..."

 DRL.438.t: "У полум'ї" #- Палкс
DRL.438.desc: "Звіти з Уралу свідчать про те, що ватажок бандитів Оскар Дірлеванґер загинув у результаті раптової аварії. У лабораторії було кілька великих відкритих чанів з невідомою легкозаймистою речовиною, і, за однією з версій, під час відпочинку Дірлеванґер спіткнувся і впав в один із цих чанів, облившись рідиною. Не усвідомлюючи, чим він покритий, він запалив сигарету і відразу ж опинився в полум'ї. Після того, як бандитська група виявила його обгорілі останки, вони швидко розпалися на гіркі внутрішні чвари, і важко уявити, що вони виживуть після трагічної загибелі свого лідера."
 DRL.438.a: "Ось чому не можна палити, діти!"

DRL.439.t: "Володар долі" #- Тімботі
DRL.439.desc: "Бій пішов не так. Якимось чином ці обшарпані росіяни, які захищали своє село, зуміли загнати Дірлеванґера і його найближчих соратників у кут і розривали їх на шматки. Вони сподівалися, що якщо їм вдасться захопити «Бич Уралу», то вони зможуть домогтися пощади для свого села. Боротьба з десятиліттями старими рушницями і навіть іржавими сільськогосподарськими інструментами, селяни прорвалися крізь найстаріших солдатів і офіцерів Оскара Дірлеванґера, поки нарешті не дісталися до самого диявола. Один із його полонених плюнув на нього. «Ми нарешті дістали тебе, сучий сину. Сподіваюся, твої люди відмовляться від переговорів, щоб я міг зробити твою смерть якомога болючішою».\n\nСтарий посміхнувся, показавши огидну посмішку з розбитими зубами і гнилим яснами. «Є тільки одна людина, яка достатньо сильна, щоб вбити мене».\ n\nЗ неймовірною швидкістю старий скелет вихопив свій особистий пістолет і вистрілив собі в голову, розбризкавши мозок по снігу. Він помер з тією ж огидною посмішкою на обличчі. Як тільки його люди дізналися про це, вони почали сваритися між собою за лідерство і здобич, і банда розпалася і почала зникати."
DRL.439.a: "Тільки монстри можуть вбивати монстрів"

 DRL.440.t: "Блідий вершник" #-DanThe#Man
DRL.440.desc: "Тривожні чутки з південного Уралу свідчать, що підлий Оскар Дірлеванґер разом із переважною більшістю своєї жахливої бригади загинули повільною і болісною смертю. Як повідомляється, незабаром після того, як Дірлеванґер і його команда повернулися з далекого рейду, кілька його людей тяжко захворіли. Село, яке вони напали, було дивно тихим, а люди в ньому були переважно хворі і вмирали, і, здається, нападники заразилися тією самою хворобою, яка вразила це нещасне село. Хворі страждали від жахливої лихоманки та спазмів у животі, стаючи надто слабкими, щоб навіть ходити. З кожним днем ті, хто ще не помер, незабаром помирали, оскільки почали страждати від безперервної кровотечі та гангрени, а їхні тіла вкрилися бубонами. Більшість іноземних медичних експертів, які чули ці чутки, сходяться на думці, що симптоми схожі на симптоми Yersinia Pestis — чорної смерті. Не маючи доступу до сучасних ліків, Дірлеванґер незабаром помер кривавою, болісною смертю. Однак хаос почався набагато раніше, коли залишки бригади впали в безлад, оскільки ті, хто залишився в живих, виявилися безпорадними без свого лідера і переслідувані примарою самої смерті. Ті небагато, кому пощастило втекти без зараження, зникли в пустелі, а табір Дірлеванґера тепер стоїть у моторошній тиші, і єдиним свідченням того, що там колись хтось був, є купи гниючих тіл."
DRL.440.a: "Ось, попелястий кінь, і той, хто сидів на ньому, мав ім'я Смерть"

 DRL.441.t: "Чарівна куля" ##Pacifica
DRL.441.desc: "«Тиша» табору Дірлеванґера посеред ночі раптово була порушена пострілом, який відлунням рознісся по наметах і збірних будівлях. До того часу, як найвідданіші люди Дірлеванґера прибули на місце події, Дірлеванґер уже був мертвий: одна куля пробила йому скроню, а чорний капелюх прикривав його скелетоподібне обличчя. \n\nОднак дивна ситуація виникла, коли його лейтенанти вирішили провести офіційне «розслідування», головним чином з метою звинуватити один одного. На стіні намету не було ні кульового отвору, ні слідів проникнення, ні слідів боротьби. Що ще гірше, куля, коли її знайшли, виявилася зовсім іншого калібру, ніж ті, що використовували решта членів бригади. Була проведена остання перевірка, під час якої перевірили зброю самого Дірлеванґера, але виявилося, що вона була розряджена, не стріляла і була в ідеальному стані. n\nУ цій заплутаній ситуації, яка швидко переросла в таємницю, нечувану серед бригади, група розкололася і почала розриватися на частини в приступах страху. Коли ця історія дійшла до Заходу, про «чарівну кулю» стали говорити пошепки... бо хто знає, чи вбивця не вдарить знову?"
 DRL.441.a: "Хто вбив Оскара Дірлеванґера?"

DRL.442.t: "Богеман" #- DanThe#Man
DRL.442.desc: "З Сибіру поширюються чутки, що Оскар Дірлеванґер, Чорний Бандит південного Уралу і бич усіх росіян, нібито зник без сліду. За розповідями, Дірлеванґер і частина його бригади грабували село, розташоване далеко від їхнього головного табору, коли на регіон обрушилася сильна хуртовина. У складних умовах Дірлеванґер і його люди розлучилися, і коли погода нарешті прояснилася, Чорного Бандита ніде не було. Спочатку бригада сподівалася, що він зрештою з'явиться — адже він і його команда пережили подібну ситуацію під час війни на Західному фронті десять років тому, — але з кожним днем, коли Дірлеванґер не повертався до табору, настрої почали загострюватися. Коли нарешті банда дійшла висновку, що він загинув у пустелі, швидко спалахнули внутрішні сутички, і колись грізна банда розбіглася по всіх кутках землі. Втрата Дірлеванґера могла б бути великим полегшенням для більшості, але для забобонних селян, яких його банда тероризувала роками, його зникнення лише додало його страхітливій легенді. З півдня Уралу поширюються чутки про те, що Дірлеванґера бачили в глибині найтемніших лісів, у брудних провулках зруйнованих бомбами міст, на вершинах крижаних Уральських гір і під ліжками неслухняних російських дітей. Навіть якщо ймовірність того, що він з'явиться живим, зводиться до нуля, Дірлеванґер, ймовірно, продовжуватиме жити в кошмарах росіян, ставши ще одним монстром, який поповнить канон російського фольклору."
DRL.442.a: "Поводься добре, інакше Чорний Бандит з'їсть тебе живцем!"

 DRL.443.t: "Ти звільнений" #- Тодд, редагування Тімботі
DRL.443.desc: "Після десятиліть жахів Оскар Дірлеванґер, жах Росії, нарешті помер. Хоча подробиці його смерті, м'яко кажучи, нечіткі, різні люди зібрали досить розрізнені повідомлення, щоб скласти загальне уявлення про події того фатального дня. Судячи з усього, самотній радянський ветеран, використовуючи зброю, яку він зберіг після війни, проник до головного табору бригади, де вбив кожного німця, якого зміг дістати. Російських рабів відпустили, і ті, хто втік, є основним джерелом інформації про вбивство. За їхніми словами, Дірлеванґер помер після того, як його пронизало трубою в покинутій промисловій будівлі. Раби описували невідомого солдата як надзвичайно стоїчного і витривалого, який витримав кілька вогнепальних поранень, хоча це лише чутки і, ймовірно, перебільшення. Хто б він не був, Росія назавжди залишиться в боргу перед ним."
DRL.443.a: "Схоже, Дірлеванґер випустив пару"

 DRL.444.t: "Прозріння" #- Exocamp, переписано Тімоті
DRL.444.desc: "Король бандитів більше не існує. Оскар Дірлеванґер, жорстокий офіцер СС і ватажок бандитів, який занурив південний Урал у десятиліття терору, був визнаний мертвим після того, як, за повідомленнями, він збожеволів. n\nПісля чергового жорстокого нальоту на сільську громаду в Оренбурзі колишній командир 36-ї дивізії почав переживати те, що він назвав «прозрінням». Заявляючи, що «один чоловік зверху контролює все», він нібито белькотів про такі теми, як розбіжні часові лінії, таємні товариства та «легіони німецьких танків, пофарбованих у кольори заходу сонця». Його марення ставали дедалі інтенсивнішими і фанатичнішими, і врешті-решт він напав на одного зі своїх підлеглих. Погрожуючи «вбити всіх, хто загнав мене в це пекло», він виголосив останнє попередження «тому, хто спостерігає, як я вмираю знову і знову», після чого його найближче оточення змушене було його вбити. Хоча решта бригади на мить об'єдналася в розгубленості та жаху, ця єдність, здавалося, не тривала довго, і хоча найближче оточення намагалося зміцнити контроль після вбивства свого лідера, група швидко розпалася."
DRL.444.a: "Бред монстра, чий розум був зруйнований"

 DRL.445.t: "Я люблю оленину з кров'ю" #- переписано Тімботі
DRL.445.desc: "Чорна армія Дірлеванґера, за чутками, ласує всім, від душ до людського м'яса, але цієї ночі вони пожирали кількох оленів, яких виловили в місцевих лісах. Оскару Дірлеванґеру подали тарілку з шматком обвугленого оленячого м'яса, над яким він відчув необхідність посміятися. «Це майже попіл! Я люблю м'ясо свіжим і смачним». Страву швидко кинули собакам, і незабаром Дірлеванґеру подали червоний і соковитий шматок м'яса. Він посміхнувся, оголивши криві гнилі зуби, які все одно не могли б їсти м'ясо, і почав їсти. Наступного ранку стало ясно, що король бандитів був дуже хворий. Він блював і був зелений на обличчі, і з тим невеликим медичним досвідом, який мали його солдати, вони припустили, що він отруївся їжею або чимось подібним. Очікуючи, що він скоро одужає, банда була шокована, коли пізніше того ж дня тремтячий і жахнутий бандит оголосив, що їхній ватажок помер. Після кількох годин переговорів і зростання напруги в таборі запанував хаос, і, здається, бич Уралу більше ніколи не буде тероризувати плачучих жінок або недопечену дичину."
DRL.445.a: "Помста — це страва, яку найкраще подавати рідкою"

 DRL.446.t: "Тринадцять днів, тринадцять ночей" #-Хліб
DRL.446.desc: "Під час рейду головний конвой бригади потрапив у засідку з глибокого снігу. Кулі та вибухівка розірвали вантажівки, залишивши криваві дірки на місці, де колись були люди, і багатьох стогнучих у брудній сльоті. Серед хаосу сам Дірлеванґер зумів втекти і, незважаючи на поранення в стегно, самотужки вибрався з зони бойових дій. Він йшов годинами, навіть коли галас пострілів і вибухів стих, сподіваючись дістатися до табору. Кров, що сочилася з його рани, застигла, не встигнувши згорнутися, змушуючи його кульгати по рівнині. Він харчувався корінням, а коли рослинність стала рідкісною, він збирав черв'яків з пухкого ґрунту. На десятий день рана загноїлася, а ноги стали занадто слабкими, щоб нести його, змушуючи його повзти по землі на животі, як жалюгідний слимак, що чіпляється за життя. На світанку чотирнадцятого дня його агонії він нарешті побачив вогні табору. Вони були так близько, що він майже відчував тепло вогню, коли наближався. Але він більше нічого не відчував, бо його закляклі ноги і крихкі пальці не могли рухатися далі. У своєму затуманеному зорі останнім, що побачив Дірлеванґер, були танцюючі полум'я, занадто далекі, щоб допомогти цьому сумному чоловікові, вкритому снігом."
DRL.446.a: "Всі ці муки, щоб в кінці померти"

 DRL.447.t: "Робіть так, як роблять росіяни" #- Чай-чан, відредаговано Bread
DRL.447.desc: "Кілька тижнів тому всі лідери поселень, що залишилися під окупацією Бригади, отримали дипломатичне повідомлення від, як повідомляється, «дуже підозрілих слов'ян». Повідомлення містило одну літеру, п'ять слів і дату.\nМій табір. Будь там. Дірлеванґер. (Вставте дату смерті Дірлеванґера)\nНа той час це повідомлення збентежило всіх, але ніхто не надав йому особливого значення. Ймовірно, це була афера, невдала спроба вбивства або навіть щось гірше. Мета листа залишалася загадкою — і до цього дня. За повідомленнями, один сміливий російський селянин кинув Дірлеванґеру виклик влаштувати найбільшу горілчану вечірку. Звичайно, селянина одразу ж жорстоко проколювали на палю, але жорстокі слова не виходили з голови командира. Він наказав своїм людям грабувати кожне село, щоб знайти всю горілку, людські черепи та спеції — хоч їх і було небагато. Його люди сумлінно виконали ці накази, звичайно, трохи розважившись при цьому, але вони знали, що справжня розвага ще тільки попереду. Запрошення були надіслані всім великим людям Росії. Вечірка тривала кілька днів, і щодня з пляшок виливали гектолітри горілки. Повідомлялося, що деякі солдати випили стільки алкоголю, що рівень алкоголю в їхній крові досяг 20 проміле — що справді продемонструвало силу арійських генів. Дірлеванґер запропонував своїм підлеглим зіграти в гру «Правда чи виклик» — і що ж, далі були жахливі зізнання і ще більш жахливі виклики. Кажуть, що деякі селяни, які прийшли на вечірку на пізній стадії, страждають від посттравматичного стресового розладу лише від того, що почули «правду», висловлену розбійниками з СС. На жаль, для Дірлеванґера це було занадто. Після того, як йому кинули виклик випити маленьку бочку горілки, змішаної зі спеціями, кістковим порошком і кров'ю, і він насправді виконав це завдання, божевільний командир впав мертвим після того, як викрикнув останнє «Сукаааа папали!». Його товариші, здається, досі шоковані тим, що такий відданий нацист вимовив російською свої останні слова."
DRL.447.a: "Горілка, здається, створює найкращих лінгвістів"

 DRL.448.t: "Правильне місце, неправильний час" #- Тодд, редагування Акбар
DRL.448.desc: "Оскар Дірлеванґер, жах Росії, нарешті помер. Згідно з повідомленнями, під час чергової розправи з російським селом таємничий молодий чоловік у чорній куртці та червоній бандані увійшов до табору і голими руками розправився з членами бригади. Незважаючи на всі зусилля найкращих бійців 36-ї бригади, він без зусиль пробився крізь бандитів, і цей невідомий нападник зрештою опинився віч-на-віч із самим Дірлеванґером. Хоча він не говорив ні німецькою, ні російською, здавалося, що цей чоловік намагався кинути виклик Чорному Бандиту на рукопашний двобій. Дірлеванґер, або занадто розлючений, щоб мислити раціонально, або відмовляючись відступати перед своїми людьми, мовчки кивнув і прийняв виклик, а решта бригади оточила двох бійців. Не дивно, що Дірлеванґер мав важкий старт, і далі було ще гірше. Він мав координацію п'яного боксера, а його ворог бився, наче герой східної легенди. Коли Дірлеванґер лежав на землі, кашляючи кров'ю, його супротивник буркнув щось іноземною мовою, а потім одним ударом розтрощив череп Чорного Бандита. \n\nТі, хто вижив, мовчки розступилися перед чоловіком, який виходив із села, мабуть, виконавши свою роботу. Коли він перейшов наступний пагорб, з неба впала блискавка, хоча небо було абсолютно чистим. Коли чоловіки пішли перевірити, від таємничого вбивці не залишилося ні сліду."
DRL.448.a: "Ой... від нього небагато залишилося, чи не так?"

 DRL.449.t: "Класична казка" #charlesthe50th
DRL.449.desc: "Після недавнього нальоту на сусіднє поселення Дірлеванґер і його люди поверталися до табору. Але під час подорожі Дірлеванґер відстав від групи і незабаром опинився без орієнтирів і напрямку руху. Однак, на щастя, він натрапив на місцеву сільську дівчину, яка йшла до будинку своєї бабусі. Запитавши дорогу, він дізнався місцезнаходження та швидко побіг туди. Коли дівчина прийшла, вона побачила свою бабусю, яка готувала картоплю. Дивно, але з часу їхньої останньої зустрічі у бабусі з'явилася щетина. І вона трохи погладшала. Але найдивніше було те, що у бабусі відросли всі зуби! Тоді дівчина помітила руку, що стирчала з-під ліжка бабусі. Непохитна дівчина відволікла бабусю безглуздими питаннями, а сама схопила рушницю, що лежала поруч. Бабуся посміхнулася, побачивши дівчину з рушницею. «Ну-ну, навіщо тобі це? Такі дівчатка, як ти, не повинні мати рушниць, вони призначені для таких великих чоловіків, як я... тобто для великих чоловіків, як солдати», — сказала бабуся, посміхаючись своїми гострими, гнилим зубами. Молода леді відповіла: «Я просто збиралася потренуватися у стрільбі по мішенях. Ці дороги не часто відвідують такі маленькі дівчатка, як я». Бабуся знову посміхнулася. «Підійди сюди, дівчинко, я приєднаюся до тебе. Я може і стара, але знаю більше, ніж ти можеш уявити». Дівчина підняла рушницю до плеча і націлила її на Дірлеванґера. У той самий момент Дірлеванґер кинувся на неї. Перш ніж його кігті змогли її дістати, він був застрелений."
DRL.449.a: "Де я це вже чув?"

DRL.450.t: "Останнє полювання" #- Panzer
 DRL.450.desc: "Під час таборування зі своїми людьми, бенкетуючи та розгулюючи найрозпуснішим чином, як це було звично для Оскара Дірлеванґера та його людей, сумнозвісний ватажок бандитів оголосив, що вирушає на велике полювання, і заявив, що побачив зграю кабанів, коли вони їхали до свого нового табору. n\nПолювання розпочалося незабаром, і Дірлеванґер та його люди дійсно виявили кабанів. Однак вони не очікували, що їхній ватажок промахнеться з першого пострілу і незабаром буде пошматований одним із цих тварин. Кабана вбили, а Дірлеванґера відтягли до табору, але незабаром стало зрозуміло, що необхідної медичної допомоги він не отримає, і Дірлеванґер незабаром помер від отриманих ран. Його останніми словами, як вважається, були: «SS-Oberführer Оскар Дірлеванґер... вбитий свинею... дайте мені щось від болю і дайте мені померти».\n\nПісля смерті воєначальника вже виникло сім угруповань, які ведуть війну за залишки трофеїв. Бандити, здається, розгромлені"
 DRL.450.a: "Всі люди повинні померти"

DRL.451.t: "Генерал Зима" #-kracc/Virus
DRL.451.desc: "У ніч, настільки холодну, що люди замерзали на місці, Дірлеванґер і його люди продовжували марш. Вони нишпорили по сусідніх селах у пошуках їжі та будь-якого палива, яке могли знайти. Насунулася буря, наче страшне біле козацьке військо, яке вбивало людей з набагато більшою милосердністю, ніж той, за ким вони слідували. Видимість впала до метра, а потім і менше. Дірлеванґер намагався тримати своїх людей разом, але буря була настільки сильною, що заглушила всі крики і вигуки. Незабаром сам Чорний Бандит відокремився від своїх людей і зіткнувся з лихом російської зими, якого бояться всі німці. n\nТіло Дірлеванґера було виявлено наступного ранку, після того як буря вщухла, групою його вцілілих людей. Він замерз у позі ембріона, ніби вирішивши покинути цей світ так само, як і прийшов у нього. Його люди були вдячні за свіжі запаси..."
DRL.451.a: "Достойна смерть"

 DRL.452.t: "Перехід на ядерну зброю" #- Panzer
DRL.452.desc: "Хоча ядерна війна знищила цивілізацію, більша частина Росії залишилася відносно незачепленою. Вся зброя світу була спрямована на великих гравців: нацистів, японців і американців. Однак, на подив багатьох, деяка зброя все-таки потрапила до Росії. Чи то випадково, чи то з чистої, чистої ненависті, німці, здається, запустили кілька міжконтинентальних балістичних ракет прямо в західну Росію в останньому акті непокори Росії. \n\nОднак одна з цих ракет, мабуть, збилася з курсу, оскільки замість того, щоб впасти на місто, вона полетіла прямо до табору бандитського ватажка Оскара Дірлеванґера і стерла всю споруду з лиця Землі. Зараз там залишилися лише відлуння. «#Потрібно, щоб міг стріляти тільки в разі ядерної війни."
DRL.452.a: "Найменш важлива жертва цієї війни"

 DRL.453.t: "Горючий" #- Panzer
 DRL.453.desc: "Світом прокотилася хвиля здивування, коли в пресі з'явилися останні кадри з Росії. На відео показано російського чоловіка, ймовірно одного з бандитів Оскара Дірлеванґера, який експериментує та бавиться з відеокамерою, яку, судячи з усього, він знайшов під час рейду. Під час зйомки на відео видно, як лідер банди, сам Дірлеванґер, марширує і віддає накази, коли раптом спалахує. Різні члени банди намагалися загасити полум'я, але, здається, це було марно, і банда Дірлеванґера вже впала в міжусобиці після його смерті.\n\nВчені, м'яко кажучи, збентежені"
 DRL.453.a: "Можливо, пекло просто забрало його"

DRL.454.t: "Це був просто собака" #- Panzer
DRL.454.desc: "Новини з Росії: невідомий мандрівник, здається, проклав кривавий шлях через Урал, щоб знищити Дірлеванґера і його людей. Кілька вцілілих стверджують, що під час чергового рейду Дірлеванґер знайшов чоловіка з добре збереженим автомобілем і собакою. Коли чоловік образив його, Дірлеванґер вирішив підкрастися до нього, знепритомнити, вбити його собаку, а потім поїхати на автомобілі разом зі своїми людьми. n\nЯк повідомляється, цей чоловік насправді був колишнім членом НКВС і був відомий серед німецьких солдатів як «Буцманн» за свою майже міфічну здатність вбивати і руйнувати. Десятки, а то й сотні бандитів Дірлеванґера були вбиті, перш ніж їхній ватажок був чисто страчений двома пострілами в голову"
 DRL.454.a: "Це була просто клята собака!"

DRL.455.t: "Метеорологічний" #- Panzer
DRL.455.desc: "Кілька членів бригади Дірлеванґера здалися владі сусідніх держав, безперервно бурмочучи про те, що, здається, сам Бог знищив їхній табір. За повідомленнями, все було нормально, коли електроенергія від генераторів табору почала зникати, і раптом метеорит впав у центр табору, знищивши його з лиця Землі, як ядерний вибух. \n\nНавколишні села цього не підтверджують, і більшість просто думає, що бригада нарешті збожеволіла. Єдиною жертвою цієї нібито великої катастрофи був Дірлеванґер, якого знайшли мертвим у своїй кімнаті з вогнепальним пораненням. Спостерігачі намагаються знайти науково прийнятне пояснення того, чому ціла невелика армія стверджує, що метеорит впав на табір, який все ще існував. Більшість звинувачує в цьому масову істерію, але деякі кажуть, що це був план, розроблений членами бригади, щоб вбити Дірлеванґера і вдавати божевільних.
 DRL.455.a: «Сподіваємося, що справжній метеорит знищить їх"

DRL.456.t: "Доведення неправоти принца" #- Акбар, стріляє тільки якщо Дірлі переміг Оренбург
 DRL.456.desc: "Після завоювання Оренбурзької комуни Оскар Дірлеванґер і його бригада спробували встановити щось на зразок цивілізованого правління, створивши нову поліцію. Звичайно, це було не більше ніж бродяча банда п'яних і добре озброєних розбійників, які обшукували будинки, вилучали все цінне і оголошували це податком для нової адміністрації. n\nУ рідкісний момент здорового глузду Дірлеванґер усвідомив, що продовження таких дій призведе до масового повстання тих мешканців міста, що вижили, якому не зможе протистояти навіть уся бригада. Тому він наказав стратити свого начальника поліції, особливо жорстокого козака на ім'я Руслан Орлов, і викинути понівечене тіло на вулицю перед міською ратушею. Схоже, Дірлеванґер намагався скопіювати сторінку з підручника Макіавеллі, де принц призначив жорстокого магістрата, щоб заспокоїти місто; після того, як місто було криваво приборкане, принц стратив магістрата і залишив містян «задоволеними і ошелешеними». Звичайно, Дірлеванґер сильно переоцінив ступінь доброї волі, яку принесе йому страта Орлова, про що він переконався на власному гіркому досвіді, коли знову відвідав Оренбург. Очікуючи приємного натовпу, він замість цього був зустрінутий розлюченим натовпом, який вимагав його голови, і його конвой був швидко розгромлений. Охоронці, побоюючись, що вони зустрінуть долю Орлова за застосування сили проти натовпу, відступили, коли натовп оточив Дірлеванґера і забив його до смерті."
DRL.456.a: "Без сумніву, люди тепер задоволені!"

 DRL.457.t: "Зрадницькі виродки" #- Акбар
DRL.457.desc: "З якихось причин — лінощів, некомпетентності, тиску з боку інших або просто божевілля — Дірлеванґер протягом останніх кількох місяців почав делегувати все більше і більше повноважень у повсякденному управлінні бригадою своїм лейтенантам. Але оскільки ті, хто прагне влади, рідко є тими, хто її заслуговує, вони швидко почали боротися між собою за те, хто в кінцевому підсумку скине Дірлеванґера і стане новим королем бандитів Уралу. І сьогодні, здається, один з них зробив свій хід. Натомість він розпустить бригаду повністю, коли відчує, що є достатньо старим і багатим, щоб безпечно піти на пенсію. Очевидно, це не сподобалося його підлеглим, оскільки один з них дістав ніж і вдарив Дірлеванґера в живіт. Дивлячись, як їхній колишній командир випускає останній подих на залитій кров'ю підлозі командного намету, вони всі погодилися, що правду потрібно приховати від солдатів. Була вигадана поспішна легенда, згідно з якою вчений-лисенкіст проник до намету і отруїв його бренді, і її розповсюдили серед солдатів. Не дивно, що лейтенанти не змінили своєї думки, і підступи та інтриги поновилися ще до того, як тіло Дірлеванґера встигло охолонути. Ті частини бригади, які не перейшли на бік ворога, занадто зайняті боротьбою між собою, щоб продовжувати грабувати навколишні міста. Здається, хмара, що нависла над Уралом, нарешті починає розсіюватися."
DRL.457.a.0: "Отруєний своїми ворогами, еге ж?"

 DRL.458.t: "Пропустили декількох"
DRL.458.desc: "Оскар Дірлеванґер, жах Росії, був вбитий вчора партизанською групою. Коли він прямував на зустріч з Лисенком, невелика група колишніх партизанів НКВС влаштувала засідку на нього та його оточення, вбивши самого Дірлеванґера, а також кількох членів бригади. Хоча партизанська група вже давно зникла, коли прибула бригада, чоловіки змогли вилити свій гнів на найближче село, яке, безсумнівно, допомагало партизанам. \n\nПоки село горіло, було знайдено тіло Оскара Дірлеванґера, і вони справді усвідомили, що і повідець, і батіг мертві. Без Дірлеванґера на чолі бригада розпалася на внутрішні чвари і дезертирство. Різні угруповання вже почали відокремлюватися, щоб тероризувати Урал, хоча, ймовірно, вони не знайдуть притулку ніде в Росії.
DRL.458.a: «Дика їзда Оскара добігла кінця"

DRL.459.t: "Суперечливі повідомлення" #- timbothy
DRL.459.desc: "Оскар Дірлеванґер мертвий. Однак обставини смерті «Бича Уралу» дивно невідомі. Не те, щоб інформації не було, скоріше, її занадто багато. Жодна з двох осіб, присутніх при його смерті, не надала однакової версії того, як він помер. Навіть місце події не збігається! Один чоловік стверджував, що старий вистрілив собі в голову після того, як селяни загнали його в кут під час рейду. Інший сказав, що він зник під час подорожі гірським перевалом. Раб сказав, що він помер після того, як з'їв зіпсоване м'ясо оленя. Сусідній селянин клянеться, що щось впало з неба і знищило весь табір, а інший каже, що бандити були знищені чумою. Один з його солдатів навіть стверджував, що він замерз на смерть і був з'їдений голодними бандитами, що пояснює відсутність трупа. Незважаючи на все це, жодне з цих тверджень не вдалося перевірити. Відомо лише те, що монстр зник, але всі досі задають одне питання:\n\nХто вбив Оскара Дірлеванґера?"
DRL.459.a: "Захоплююча детективна історія про вбивство, а жертва була цілком заслуженою!"

 DRL.460.t: "Таємниця перевала Дятлова" #- Spuddatomic
 DRL.460.desc: "Міжнародна спільнота починає усвідомлювати, що Оскар Дірлеванґер, лідер широко відомих бандитських бригад, мертвий. Згідно з повідомленнями, Дірлеванґер залишив свій табір кілька днів тому, дізнавшись про особливо привабливий запас боєприпасів, що зберігався в гірському комплексі на північний схід від його території. Він взяв із собою невеликий загін своїх найвідданіших людей і легкий рюкзак з найнеобхіднішим спорядженням для кемпінгу. Невідомо для бригади Оскара, коли невеликий конвой зник у сибірській пустелі, це був останній раз, коли їхнього лідера бачили живим. Майже через місяць вони так і не повернулися до табору. Внутрішні чвари загрожували розколоти групу, тому з неохотою було відправлено розвідувальну групу, щоб дізнатися про стан «короля бандитів». Після тижня важкої подорожі розвідувальна місія натрапила на дивну картину в районі, який місцеві жителі називають «Мертвою горою».\n\nТе, що здавалося залишками табору банди, було наполовину засипане снігом. У великому наметі на одній зі стін була значна дірка, ніби прорізана ножем. Коли група пішла слідами легких слідів вниз по схилу до краю сусіднього лісу, вона побачила трупи двох чоловіків, які лежали, притулившись один до одного, біля багаття. Їхні тіла були вкриті кригою і майже такі ж бліді, як сніг, на якому вони лежали. Пройшовши далі в ліс, вони виявили темний предмет, що стирчав із сусіднього снігового замету. Це була рука деформованого трупа Дірлеванґера, майже повністю вкрита камінням і льодом. Перш ніж група встигла повідомити про це залишки бригади, бригада розділилася на ворогуючі угруповання, багато з яких оголосили її «розпущеною»."
DRL.460.a: "Дійсно, загадковий випадок"

 DRL.461.t: "Старість" #- Муппер
DRL.461.desc: "Оскар Дірлеванґер помер мирно уві сні минулої ночі. Хоча деякі з його найвідданіших послідовників стверджують, що це була підступна справа рук росіян, комуністів, євреїв та багатьох інших, немає жодних ознак боротьби чи чогось, що вказувало б на щось неладне. Інші вважають, що Чорний Бандит помер від природних причин, спричинених його похилим віком і суворими умовами російської погоди, або, можливо, хворобою. Ще більш божевільні члени вважають, що Дірлеванґер все ще живий, просто втік з Росії і залишив дублера, що викликало велике збентеження серед інших членів бригади. \n\nОднак, незалежно від причини смерті Дірлеванґера, його бригада розпалася, а її члени розійшлися і втекли в невідомі місця. І хоча Чорний Бандит мертвий, незліченні смерті ніколи не будуть помщені, і він ніколи не постане перед судом, на який заслуговує."
DRL.461.a: "То цей виродок мертвий? Шкода, що ніхто не дістав його першим!"

DRL.462.t: "Смертельна ін'єкція" #- Magnimik
DRL.462.desc: "Старість не щадить нікого, особливо чоловіка, який все життя провів у боях, блукаючи сибірськими пустками і ведучи розпусний спосіб життя. Відчуваючи, що смерть наближається, а здоров'я продовжує погіршуватися, сумнозвісний ватажок бандитів Оскар Дірлеванґер попросив вилікувати його хвороби сільського лікаря, якого він колись шантажував, щоб той дав йому швидкі гроші в обмін на збереження життя йому та всій його родині. Однак замість того, щоб зберегти життя ненависного розбійника, лікар скористався цією нагодою, щоб змусити Дірлеванґера заплатити за все те горе, яке він приніс його родині та всій Росії. Замість того, щоб надати йому належне медичне лікування, лікар ввів Дірлеванґеру препарат, який він назвав «триетилен натрію», доза якого була достатньою, щоб вбити людину. Коли Дірлеванґер це помітив, йому залишалося жити менше десяти секунд. Темна іронія того, що бандит довірив своє життя людині, яку колись погрожував вбити, не пройшла повз увагу поважного лікаря."
DRL.462.a: "Не можу сказати, що це було порушенням клятви Гіппократа"

 DRL.463.t: "Дрібна суперечка" #- Тімботі
DRL.463.desc: "Оскар Дірлеванґер і його найвідданіші послідовники неквапливо прогулювалися серед палаючих полум'я ще одного села, яке вони зруйнували. Все ще було чутно крики і благання про допомогу, коли решта бригади накинулася на цих людей, яким не пощастило потрапити в поле зору бандитів. Близьке оточення Дірлеванґера оточило свого лідера, сміючись, коли вони страчували понівечених чоловіків і жінок, яких зустрічали на своєму шляху. Сам Дірлеванґер мав вираз обличчя холодніший за російську зиму. \n\nПід час блукання Дірлеванґер помітив сліпуче золоте намисто, яке якось пропустили на одному з трупів. Він присів, щоб підібрати його, але його вирвав з його рук на очах один з його розбійників, пошрамований російський хлопець, якому не могло бути більше двадцяти. Обличчя чоловіка, ледь доросліше за дитяче, освітлювало полум'я, тоді як старе обличчя Дірлеванґера було приховане ніччю. Дірлеванґер промовив крижаним тоном, здатним заморозити Атлантичний океан: «Віддай його, хлопче». Російський бандит, через темряву, не впізнав свого власного ватажка. «Відвали, старий».\n\nНе бажаючи більше терпіти це, Дірлеванґер потягнувся за пістолетом. Він сам візьме цю дрібничку. Однак, не встигнувши навіть витягнути зброю, він відчув, як його обличчя спотворилося від болю, коли російський хлопець ударив Оскара прикладом пістолета по голові. Дірлеванґер впав на землю. Хлопця швидко застрелили, але було вже запізно. «Бич Уралу» був кволим чоловіком, і навіть одного удару було достатньо, щоб убити його. Можливо, хлопчик спатиме спокійніше, знаючи, скількох він помстився."
DRL.463.a: "Він ніколи не дізнається, скільки він зробив"

 DRL.464.t: "Споріднена душа" #- Тімботі
DRL.464.desc: "Була пізня ніч у таборі бандитської бригади Оскара Дірлеванґера. Після особливо успішного нальоту багато чоловіків п'яно танцювали і співали навколо багаття. Сам Дірлеванґер, втомившись від веселощів, залишив групу і відійшов трохи вбік, у сусідній ліс, щоб помочитися. \n\nКоли він підтягував штани, він почув шурхіт гілок. Він витягнув пістолет зі швидкістю людини, яка робила це вже десять тисяч разів, і обернувся, щоб вистрілити, але вперше в житті він завагався. У темряві він побачив виснажене, скелетне обличчя, яке дивилося на нього очима, такими ж холодними, як і його власні. У цю мить, наче дзеркальне відображення короля бандитів, стрибнув і повалив Дірлеванґера на землю, притиснувши літнього німця до гострих каменів і сухих соснових голок. Тепер, коли він краще роздивився, Дірлеванґер зрозумів, що це не було відображенням, а просто чоловіком, схожим на нього, який підставив йому підніжку. Він спробував втекти, але було вже запізно. Худорлявий чоловік розтрощив Дірлеванґеру голову, вбивши монстра. Коли його тіло знайшли, взуття, пальто і пістолет Дірлеванґера були викрадені. Вбивця був лише мародером, який не знав, що вбив бича Росії. За такий безсердечний вчинок, як вбивство беззахисного старого, щоб вкрасти його майно, він, ймовірно, був таким же розбещеним, як тиран, якого він несвідомо вбив."
DRL.464.a: "Відповідний вбивця"

 DRL.465.t: "У темряву" #- Тімботі
DRL.465.desc: "Останні хвилини життя Оскара Дірлеванґера були сповнені роздумів. Чоловік, який заподіяв стільки страждань, дивився у двері, бачачи бурхливу снігову бурю і чуючи виття вітру. Він виглядав так, ніби вперше в житті був спокійним. Без попередження він встав, не беручи пальто, відкрив двері і вийшов у заметіль. Його люди швидко помітили це і побігли за ним, але сніг затуляв їм огляд навіть на відстані кількох метрів. Переслідувати свого ватажка було б самогубством. Вони чекали годинами, сподіваючись, що король бандитів повернеться, але він так і не повернувся. Він прийняв свою долю і пішов у темряву, знаючи, що повернення немає. З причин, які, мабуть, ніхто ніколи не дізнається, Оскар Дірлеванґер обрав свою долю і обрав смерть."
DRL.465.a: "Якщо хтось і заслуговував не знайти спокою, то це був він, але він все одно його знайшов"

 DRL.466.t: "Гідний супротивник" #-empona45
DRL.466.desc: "Оскар Дірлеванґер посміхався, дивлячись на хаос навколо себе. Ще один рейд, блискуче виконаний ним, і лише кілька жертв. Його найвідданіші лейтенанти були зайняті задоволенням своїх бажань, а він залишився сам, щоб вдихнути атмосферу страху, яку сам створив. Тому Дірлеванґер дуже розлютився, коли його вигадане блаженство перервали звуки за його спиною. Він обернувся і побачив молодого чоловіка, який намагався підкрастися до нього. «Вважаєш себе рятівником Росії, хлопче?» — сказав Дірлеванґер. Майбутній вбивця лише визирав на нього з викликом. Дірлеванґер направив на нього пістолет. «Зачекай!» — несподівано сказав чоловік німецькою мовою. Дірлеванґер зупинився. «Я можу... Я можу сказати тобі, чому ти все це робиш!» «Про що ти говориш? Я дуже добре знаю, чому я грабую і руйную», — відповів Дірлеванґер, розвеселившись. «Це...» — чоловік перервав його чотирма ледь чутними словами. Дірлеванґер обдумував ці слова в голові. Вони не були такими вже й приголомшливими одкровеннями, як їх намагалися представити. Міркування Дірлеванґера раптово перервав біль у грудях. Цей виродок вистрілив у нього! Пістолет Дірлеванґера впав на землю, а за ним і сам Дірлеванґер. Він востаннє подивився чоловікові в очі, намагаючись зробити щось, що-небудь, щоб вижити. Але все було марно, бо чоловік вистрілив другу кулю, яка влучила Дірлеванґеру в мозок. \n\nЧоловік посміхнувся, коли стало ясно, що Дірлеванґер мертвий. Достатньо було просто відволікти його увагу. Він подумав, що іронічно, що одного з найстрашніших людей у всій Росії вбили чотири прості слова."
 DRL.466.a: "Тобі потрібні були гідні супротивники"

DRL.467.t: "Раптова зупинка"
DRL.467.desc: "Зрештою, Оскара Дірлеванґера вбили не його гріхи чи бойові рани, а найневинніша річ, яку можна знайти в таборі бандитів. Звичайна фермерська драбина стандартного зразка. \n\nПід час огляду рабів, які будували нову сторожову вежу в його таборі, щоб замінити ту, що обвалилася через випадковий мінометний снаряд, Дірлеванґер неуважно піднявся на вершину драбини, намагаючись піднятися на вершину риштування. Однак, за іронією долі, всесвіт вирішив, що цього не має статися. Наступне, що всі почули, був крик, оскільки вага Дірлеванґера на частині драбини, яка не була призначена для дорослого чоловіка, призвела до її перекидання прямо на купу будівельного сміття. Коли з-під уламків піднялася величезна хмара пилу, а Дірлеванґер лежав дивно тихий, раби-робітники відступили, боячись Бандитського Короля, і вдавали, що нічого не сталося, щоб уникнути можливої помсти за гріх, що завадили німцям. n\nЗрештою, через півгодини, під час огляду будівництва, один із рейдерів Дірлеванґера знайшов його тіло з розтрощеним черепом від нещасливо розташованого колоди, а ноги все ще застрягли між сходинками драбини.\n\nЗвичайно, на той час робітники вже давно зникли, а між чоловіками, які знайшли тіло, почалися гарячі суперечки, що поклали початок смерті 36-го."
 DRL.467.a: "Не падіння вбиває"

 DRL.468.t: "Гаряча лінія Орськ" #- Тімботі
DRL.468.desc: "Король бандитів мертвий. Рано вранці Оскар Дірлеванґер, як повідомляється, отримав дивне і дивно невинне повідомлення на своєму особистому радіо, в якому стверджувалося, що буде доставка від когось на ім'я «Яків». Вважаючи це звичайною адміністративною нісенітницею, яка його мало цікавила, Дірлеванґер проігнорував повідомлення і продовжив свій день. Однак увечері він пошкодував, що не перевірив його. Чоловік у масках змії, озброєний пістолетом-кулеметом, влаштував погром у будівлі, де мешкав Дірлеванґер, самотужки вбивши всіх охоронців і пробившись до помешкання Дірлеванґера. Маскований вбивця так і не показав свого обличчя, а просто розтрощив голову Дірлеванґера об бетонну стіну, після чого зник. Під час огляду кімнати було виявлено, що єдине, що залишив після себе маскований вбивця, — це дуже зношена листівка з Америки, на якій було зображено піщаний пляж і пальми."
DRL.468.a: "Яка жорстока різанина!"

 DRL.469.t: "Шалена поїздка" #\\- timbothy
 DRL.469.desc: "Оскар Дірлеванґер мертвий. Після дня пиятики, коли сонце осяяло світ післяобіднім світлом, бич Уралу, як повідомляється, привласнив собі найбільший доступний транспортний засіб і надав кілька інших бандитам, з якими він пив. Разом вони вирушили на післяобідню дорожню бійку, мчачи по зруйнованих вулицях Орська, наказуючи випустити рабів на вулиці, а потім намагаючись їх переїхати, і стріляючи з вікон, радісно сміючись. \n\nНарешті, п'яні до нестями і відчуваючи себе непереможними у своїх машинах, Дірлеванґер кинув виклик розбійникові на гру в «курячу». Той погодився, і вони обоє завели двигуни, а потім кинулися один на одного по занедбаній вулиці. Ні для кого не стало сюрпризом, що жоден з них не звернув убік, і машини зіткнулися лоб в лоб, вбивши обох водіїв і кількох глядачів. Усвідомивши серйозність того, що сталося, інші п'яні бандити сіли в свої машини і втекли далеко, а бригада занурилася в хаос."
 DRL.469.a: "Принаймні Дірлеванґер не був боягузом"

DRL.470.t: "Антиклімакс" #\\- timbothy
DRL.470.desc: "Цей день був одним із найспекотніших за всю історію спостережень. Це було надзвичайно дивно, оскільки лише напередодні була сніжна буря, і очікувалося, що найближчі тижні будуть холодними. Однак сніг вже розтанув, і здавалося, ніби пекло нарешті розмерзлося після замерзання. Оскар Дірлеванґер і його люди практично задихалися від спеки, ледве проходячи кілька метрів. Вони поверталися з рейду, але навіть після того, як деякі з них зняли весь одяг, все одно було занадто спекотно.\n\nСпека була занадто сильною для такого старого і кволого бандитського короля. Пройшовши кілька кілометрів, він знепритомнів і незабаром помер. Недосвідчений медик припустив, що це був тепловий удар або щось подібне. Решта невеликої групи почала сваритися через воду та припаси, а коли ця новина дійшла до великої бригади, конфлікт розширився в сто разів. Незвичайна спека незабаром минула, але її наслідки залишилися.
DRL.470.a: «Можливо, це боже втручання?"

 DRL.471.t: "Король гори" #\\- Pacifica
DRL.471.desc: "Експедиція була такою, яку Дірлеванґер і його люди проводили багато разів — подорож через маловідомий перевал у засніженому Уралі, щоб обійти з флангу багате селянське село, що притулилося до схилу гори на ізольованому плато. Однак ця подорож швидко виявилася не схожою на інші, оскільки вітер шмагав нападників, а сніг загрожував поховати їх живцем.\n\nСлідуючи за криками Дірлеванґера і ліхтарем сержанта попереду, чоловіки почали повертатися до безпечного табору і трохи більш стабільного спуску, звідки вони прийшли.\ n\nЛише на півдорозі вниз вони помітили, що крики Дірлеванґера стихли, і ліхтар був єдиним, що залишалося, щоб вести їх. Однак після щирих спроб знайти свого лідера вони не могли нічого вдіяти. Пригнічені, члени загону, що сварилися між собою, втекли назад до табору, втративши по дорозі ще кількох людей, які впали або потрапили в ями біля дерев. n\nЛише через кілька днів після того, як група почала розпадатися, нарешті знайшли труп Дірлеванґера, замерзлий і наполовину закопаний під сніговим заметом. Уральський гвардієць, який його знайшов, помітив дві речі. Перша — це гниль, яка вже охопила все його тіло, перетворивши потворного, злого чоловіка на ще потворнішу руїну муміфікованого тіла. Друге — його поза, руки, замерзлі перед ним, ніби він захищав себе від чогось, що атакувало його обличчя. Для уральського гвардійця, звичайно, це не мало значення. Після короткої дискусії тіло просто скинули з найближчого обриву і залишили назавжди в невідомості."
DRL.471.a: "Можливо, краще ніколи не знати правди"

 DRL.472.t: "Спірні звіти" #- deathgriffin (Див. примітку нижче)
 DRL.472.desc: "На наступний день після того, як Дірлеванґер відправився до Магнітогорська на запрошення Трофима Лисенка, божевільного вченого, який захопив контроль над Чорною горою, він зник. Протягом декількох днів його доля залишалася загадкою, аж дотепер. Речник Магнітогорська оголосив, що Дірлеванґер повертався до своєї фортеці в Орську, коли його вантажівка з'їхала з дороги і впала з висоти сотень метрів вниз по схилу гори, в результаті чого всі, хто був всередині, загинули від удару. Однак, за чутками, Дірлеванґер не повертався з успішної зустрічі, а намагався втекти. Кажуть, що після зустрічі люди Лисенка намагалися захопити Дірлеванґера і його охоронців живими, але ті втекли з засідки і намагалися повернутися на свою територію, коли їх виявили і змусили з'їхати з дороги, щоб запобігти їхньому поверненню. Колишня бригада Дірлеванґера вже розпадається, оскільки різні банди та угруповання намагаються захопити контроль або відокремитися. Схоже, що терор на півдні Росії не протримається довго після смерті свого лідера."
DRL.472.a: "Ті гірські дороги можуть бути дуже небезпечними"
#(Ця подія повинна відбуватися лише за певних обставин. Для отримання додаткової інформації див. MGN.115)

 DRL.473.t: "Лабораторна щур" #-deathgriffin (див. примітку нижче)
 DRL.473.desc: "Коли Дірлеванґер прийняв запрошення Лисенка до Магнітогорська, він вірив, що буде вести переговори про умови союзу між ними двома проти Уральської ліги. Після розкішного банкету на честь союзу, на якому було багато їжі та алкоголю, король бандитів та його люди пішли спати до своїх тимчасових кімнат, щоб відійти від вечірки. Саме тоді Лисенко завдав удару. Його люди штурмували готель, де зупинилися Дірлеванґер та його свита, заставши їх зненацька та захопивши майже всіх без особливого опору. Коли його виносили з готелю, зв'язаного за зап'ястя і щиколотки, Дірлеванґер кричав і лаявся німецькою мовою на своїх викрадачів, на своїх людей, на шокованих перехожих і на всіх, хто міг його почути. Його доставили до особистої лабораторії Лисенка, що знаходиться глибоко в Чорній горі, де, за чутками, вчений вже запланував кілька експериментів, які він хоче випробувати на своєму новому улюбленому піддослідному. n\nХоча Дірлеванґер технічно може не загинути протягом тижнів або навіть місяців, залежно від того, як довго він зможе протриматися, він у всіх сенсах вже мертвий, зник з цього світу. Без шансів на порятунок і без іншого джерела центрального керівництва, його банда вже розпалася на внутрішні чвари і розбігається назад у пустку, з якої вона з'явилася."
 DRL.473.a: "Досліди Лисенка — це доля, якої я не побажав би нікому, крім Дірлеванґера"
#(Ця подія повинна відбуватися лише за певних обставин. Для отримання додаткової інформації див. MGN.116)

DRL.474.t: "Смертельний стрибок"
 DRL.474.d: "Подорож від добре охоронюваного кордону Уральської ліги пролягає через лісисту місцевість, заповнену старими лісовозними дорогами і позбавлену доступних джерел води. Однак те невелике, що є, не слід недооцінювати. Однак, перетнувши знайоме поле, він помітив, що дерево впало на шлях, яким він зазвичай їхав. Лаючись і повертаючи кермо вбік, Король Бандитів вибрав менш проїжджу дорогу — місцевість, яку він обстежив на випадок, якщо коли-небудь знадобиться її використовувати.\n\nВиїхавши на галявину з рівною, вкритою снігом лісовою підлогою, він зрозумів, що не обстежив її достатньо ретельно. З тривожним ривком земля провалилася під колесами його автомобіля, і під ним почали ламатися шматки льоду. Але ніщо не могло врятувати його від крижаної пелени, що лежала над ним, ув'язнивши його в крижаних глибинах. Дряпаючи крижану поверхню озера, поки його вантажівка тонула на дно, Дірлеванґер нарешті впав, але не в бою, а від задухи."
DRL.474.a: "До морської могили з тобою!"

 DRL.475.t: "Танцюй, поки не впадеш" #\\- Тімботі
DRL.475.desc: "Після чергового дня розпусти та жорстокості Оскар Дірлеванґер та його компанія зібралися навколо багаття, сміючись і роблячи те, що зазвичай робили. Один солдат дістав вишукану та рідкісну скрипку, яку він вкрав, і сказав, що вміє на ній грати. Він почав грати традиційну німецьку народну мелодію, і всі німецькі солдати засміялися, встали і почали танцювати. Через деякий час навіть росіяни та українці приєдналися до них, і на подив усіх, сам Дірлеванґер підскочив і почав рухатися, коли мелодія пришвидшилася. \n\nГрупа танцювала кілька хвилин, і навіть Дірлеванґер весело хихикав. Він стрибав, бігав, танцював вальс і робив все, що спадало йому на думку, коли раптом його ліва нога потрапила в калюжу масла. Він страшенно послизнувся, і його череп з огидним тріском вдарився об землю, немов дві кулі для більярду, що зіткнулися одна з одною. Скрипка відразу замовкла, і його солдати зібралися навколо нього, щоб перевірити, чи все з ним гаразд. Було очевидно, що ні, і після кількох спроб його розбудити стало ясно, що він мертвий. Танець швидко перетворився на паніку, коли гуляки намагалися з'ясувати, що робити далі."
DRL.475.a: "Його рухи були непогані, але йому потрібно було попрацювати над точністю"

DRL.476.t: "Ретельна документація"
 DRL.476.desc: "За «рекомендацією» Лисенка та його вчених, кричущі орди Дірлеванґера напали на село, в якому мешкали кілька колишніх радянських вчених, які відмовилися піти з божевільним вченим на Чорну гору. Особисто розправляючись із селянами, Дірлеванґер натрапив на неприкрашений будинок у дещо заможнішій частині міста. Вдершись всередину прикладом рушниці, перше, що він побачив, був чоловік із мертвими, сліпими очима, який дивився на нього. Сліпий чоловік простягнув руку, щоб зупинити його, і Чорний Бандит без вагань застрелив його. Оглянувши тіло на наявність цінних речей і притуливши труп до стіни, Дірлеванґер обшукав решту будинку в пошуках речей, які можна було б пограбувати. Там не було нічого, крім одного маленького сейфа, вбудованого в стіну. Вистріливши в замок, він легко дістався до вмісту і, як дитина, що відкриває подарунок, дістав... папери. У сейфі не було нічого, крім старих документів з маркуванням Радянського Союзу. Нагорі лежала стопка фотографій, серед яких була фотографія, на якій, здавалося, був сліпий чоловік, що стояв на вершині гори і махав рукою, а за ним були ще гори. На фотографії, яка була надзвичайної якості, розкинувся класичний пейзаж Уралу. Дірлеванґер засміявся і кинув її в калюжу крові. Оскар Дірлеванґер зник уночі через годину після закінчення рейду, не залишивши ніяких слідів, крім відбитків ніг людини, яка рятувалася втечею."
DRL.476.a: "Схоже, деякі речі не призначені для того, щоб їх бачили"

DRL.477.t: "Віспа"
 DRL.477.desc: "Стріляючий і пекучий біль у спині та нижніх кінцівках; параліч; раптова втрата рівноваги; нарешті, психоз і смерть. Для досвідченого медичного ока це були характерні симптоми пізньої стадії нелікованого сифілісу — для Оскара Дірлеванґера, лідера сумнозвісної банди бандитів, що носила його ім'я, це були причини його власної загибелі. Сифіліс, який може залишатися безсимптомним протягом років, а то й десятиліть, і який отримав прізвисько «віспа», є захворюванням, що передається статевим шляхом і забрало життя безлічі жертв з моменту його появи в Старому Світі з Америки в 16 столітті. Іноді симптоми стають помітними вже через кілька днів після зараження, а іноді Treponema pallidum, що викликає захворювання, просто ховається в організмі, а потім раптово проявляється і призводить до загибелі жертви за лічені дні. Дірлеванґер потрапив у другий випадок, і з моменту появи перших симптомів минуло лише кілька днів, перш ніж його люди знайшли його мертвим у викривленому положенні, з обличчям, перетвореним на маску агонії."
 DRL.477.a: "Здається, це гідний кінець"

 DRL.478.t: "Дуель" #- Тімботі
DRL.478.desc: "Оскар Дірлеванґер збирав свою звичайну частку від видобутку бандитів наприкінці рейду, коли один із молодших членів банди попросив більшу частку, ніж зазвичай, через свою виняткову роботу під час рейду. Дірлеванґер підвів погляд і голосно розреготався, перш ніж сказати «ні». Однак молодий бандит не поступався. Він сказав, що має виклик для Дірлеванґера. Вони битимуться на дуелі, і той, хто переможе, отримає всю частку. Дірлеванґер не вбивав нікого без потреби вже два дні, тож погодився. \n\nДвоє стали спиною один до одного і почали відраховувати по десять кроків. Дірлеванґер, звичайно, не мав наміру бути чесним і на сьомому кроці різко обернувся, витягнувши пістолет і приготувавшись стріляти. На жаль для нього, його супротивник обернувся на шостому кроці. Кульовий отвір з'явився прямо в центрі чола Дірлеванґера, і старий впав мертвим. Молодий бандит не зміг довго радіти, оскільки його теж швидко застрелили за вбивство короля бандитів, але шкода вже була завдана. Новина про смерть Дірлеванґера швидко поширилася, і його бригада, ймовірно, не протримається довго."
DRL.478.a: "Єдина людина, яка може перемогти шахрая, — це інший шахрай"

DRL.479.t: "Стукіт у двері"
DRL.479.desc: "Після того, як НКВС Чорної гори знищив свого колишнього господаря, вони не гаяли часу і розгромили Чорних бандитів. Загартовані в боях, але неорганізовані бандитські бригади не могли протистояти добре навченій 22-й мотострілецькій дивізії і швидко втекли з поля бою, зазнавши важких втрат. n\nОднак Дірлеванґер втік досить легко, самостійно втікши на південь, коли його бригада розпалася навколо нього. Оселившись у будинку, покинутому його власниками, Дірлеванґер заснув виснаженим. Страшний стукіт у двері, а потім чотири елітні солдати НКВС увірвалися в його спальню. Не встигнувши вчасно чинити опір, вони затягли Чорного Бандита в одну зі своїх вантажівок і роззброїли його. Потім почалися звинувачення. \n\n«Суд» над Дірлеванґером тривав сорок хвилин і закінчився, природно, визнанням його винним за всіма пунктами звинувачення. Йому заткнули рота ганчіркою, щоб він не міг благати, і комісар загону НКВС вистрілив йому в голову. 22-й мотострілецький полк залишив місце події відразу після того, як облив тіло бензином і підпалив його, залишивши лише труп Дірлеванґера, який тепер згорав до попелу, щоб показати, що вони взагалі там були..."
DRL.479.a: "Ось вони йдуть, щоб забрати ще одного..."
#Стріляти тільки якщо НКВС вбиває Лисенка, а потім б'є Дірлеванґера

 DRL.480.t: "Гордість передує падінню" #- Shibboleth98
 DRL.480.desc: "У пошуках нової здобичі для своїх військ загін бригади натрапив на те, що вони описали як неймовірне багатство і владу, на безплідному пагорбі за три дні на південь від головного табору. Вони повернулися з настільки неймовірними історіями, що вони могли бути тільки правдивими, про зброю, золото та їжу в секретному радянському військовому сховищі. Тож Дірлеванґер вибрав кількох своїх найнадійніших лейтенантів і вирушив наступного ранку, маючи перед очима бачення золота, свинцю та вогню. Було очевидно, що те, що його мотивувало, не було цілком раціональним, якщо, звичайно, він коли-небудь був раціональним. Подорож була важкою навіть для його ветеранів; повзуча лихоманка або божевілля забрали більшу частину команди, багато хто з них поринув у ніч, кричачи про «прокляті бачення», демонічні явища. Але Дірлеванґер бачив лише силу, що сяяла в денному і нічному небі, новий наркотик, що пульсував у його розкладаючійся крові. Не мало значення, скільки часу він витратив — і тепер, коли він про це подумав, чи не минуло сорок днів з того часу, як він вирушив у дорогу? Неважливо. Він знайде це. Він знайде.\n\nПагорб з'явився перед ним, як у видінні; ослаблений голодом і спрагою, він впав самотній на тому безплідному схилі і викрикнув первісні звуки перемоги. Вся його команда загинула, але він був тут — він був тут! Все було неймовірно яскравим. Контури змінювалися. Розмита постать вела його до краю скелі. Він побачив своє дрібне королівство, створене під дулом пістолета і утримуване терором і болем. Звуки, схожі на слова, слабкі, але чіткі. «Ти купив світ і зламав свою душу, Оскаре. Хаос і кров виливаються з твоїх уст. Тепер твоя доля — руйнування, твій живіт — твій бог, а твоя слава стане твоєю ганьбою. Помри, Оскаре, і не знай спокою». Потім він впав, назавжди."
DRL.480.a: "Смерть у цьому житті — справедливість у наступному"

 DRL.481.t: "Відсутність віри" #- Акбар, стріляє тільки якщо Дірлі воює з Уральською гвардією, а УГ контролює Орськ
DRL.481.desc: "Незважаючи на всі зусилля бригади, їм не вдалося зупинити добре навчені війська Уральської гвардії, які наближалися все ближче і ближче до Орська. Коли вони опинилися на околицях табору бригади, Дірлеванґер прийняв рішення евакуюватися з кількома десятками своїх найближчих людей і сховатися в передгір'ях Уралу, залишивши більшу частину своєї здобичі. \n\nНезважаючи на все більш скрутне становище, необхідність постійно тікати від Уральської гвардії, що наближалася, і нестачу запасів, Дірлеванґер сказав своїм людям зберігати віру і залишатися вірними. Він обіцяв, що має план, як повернути їхні нечесно зароблені гроші, помститися Уральській гвардії і втекти на захід, до спасіння в Московії. Однак цей план постійно змінювався і був туманним: одного дня він передбачав розпалювання громадянської війни в Магнітогорську, наступного — напад на золоті запаси в Оренбурзі, а ще наступного — звільнення товаришів з в'язниць Уральської гвардії. Його швидко зменшуваній кількості послідовників здавалося, що Дірлеванґер починає марити або просто говорить те, що його люди хочуть чути, щоб вижити. Один з його людей вирішив зрадити його, повідомивши про місцезнаходження його останнього сховища розвіднику Уральської гвардії. Коли гвардійці наблизилися, люди розбіглися в ніч, залишивши Дірлеванґера самого. Однак Чорний Бандит був знайдений мертвим на дні ущелини, очевидно, покінчивши життя самогубством, щоб уникнути полону"
DRL.481.a: "Його час минув"

 DRL.482.t: "Травянистий пагорб" #- Shibboleth98
DRL.482.desc: "На параді, присвяченому черговому успішному очищенню села і знищенню тих, хто протистояв його правлінню, Дірлеванґер був у переносному і буквальному сенсі на висоті. Адреналін і дивна суміш метамфетамінів, барбітуратів та випадкових племінних препаратів у його крові спричинили б серцевий напад у більшості лікарів, за винятком, можливо, того, хто лікував самого Адольфа Гітлера. Він хитався туди-сюди на задньому сидінні напівзруйнованого Kettenkrad, втративши розум від блаженства, а його люди бродили вулицями міста, регочучи від сміху та п'яності. Вони проникали в будинки парами та четвірками, і незабаром будинки оживають від жахливого шуму або тиші. На другому поверсі будівлі, яка колись була бібліотекою, за сто метрів від них, снайпер методично чистив свою гвинтівку. Його ім'я буде втрачене в часі, але його вчинки — ні. Він в останній раз протер приціл, підняв гвинтівку на підвіконня і прицілився. Агенти НКВС 547b і 547a взяли в руки пістолети і почали йти до головної вулиці. Їхня мета була чітко визначена на інструктажі. У разі невдачі їх чекало знищення. Була лише одна можливість для виконання завдання. Вони дійшли до площі, побачили фігуру, що танцювала на Kettenkrad, і прицілилися. З'явився також самотній стрілець, який проплив крізь вихор пилу і крові, що був Західною Росією; радикалізований комунізмом, він був тим, кого бригада покарала з жахливою люттю в останні години перед своїм розпадом. Він підійшов до жахнутої, застиглої натовпу, дістав пістолет з абсурдно довгим стволом і вистрілив з-під стегна. Кулі досягли Оскара Дірлеванґера і його команди за 4,53 секунди, пробивши їх у 15 різних місцях під різними кутами і відскочивши. Оскар загинув миттєво. Свідки повідомляли, що бачили, як найбільший суцільний шматок його голови відлетів назад і вліво, а потім впав на тротуар, як гниле м'ясо."
DRL.482.a: "Назад і вліво. Назад і вліво"

 DRL.483.t: "Термінальний люмбаго" #-Ackbar
 DRL.483.desc: "Все почалося з невеликої скарги на біль у попереку, з якою він звернувся до табірного лікаря. Однак лікарі не надали цьому значення, вважаючи, що це наслідок неспокійного сну, і що цього можна уникнути, якщо наступної ночі спати на спині. Однак наступного ранку проблема не зникла, незважаючи на дотримання порад лікаря. Проте це не було серйозною проблемою і не заважало йому продовжувати керувати своїми людьми. Але з часом стан Оскара Дірлеванґера продовжував погіршуватися. Біль у спині посилювався, переходячи від легкого дискомфорту до гострого, колючого болю щоразу, коли він ходив або нахилявся. Раніше прості завдання, такі як їзда верхи або стрільба з рушниці, стали нестерпними тортурами. Кожного разу, коли він пробував, він відчував біль, який порівнював з тим, ніби хтось тримає його спину над багаттям. \n\nДірлеванґер незабаром опинився прикутим до ліжка, не в змозі навіть сидіти прямо, не відчуваючи нестерпного болю. Він намагався з усіх сил продовжувати керувати бригадою, незважаючи на те, що лікарі табору закликали його відпочивати і не перенапружуватися. Чесно кажучи, це була єдина порада, яку вони могли дати, оскільки не мали уявлення, що могло бути причиною цієї загадкової хвороби — грижа міжхребцевого диска? Защемлення нерва? Якась форма поліомієліту? Вони не мали жодного уявлення. \n\nВрешті-решт Оскар Дірлеванґер помер одного ранку у своєму ліжку, кричачи від болю. Алкоголь і морфін давали лише короткочасне полегшення страждань, і навіть вони не могли притупити біль, який він відчував наприкінці. Коли його крики нарешті стихли і він знепритомнів, бійці бригади мовчки відчули полегшення, що страждання їхнього повелителя закінчилися. Але коли тіло охололо, всі зрозуміли одну річ: Дірлеванґер, у маренні від болю, так і не призначив собі наступника. Не дивно, що суперечки про керівництво бригадою незабаром переросли в перестрілки, і того ж дня табір занурився в хаос."
 DRL.483.a: "Яка повільна і болісна смерть"

DRL.484.t: "Останнє плавання Барбаросси" #- Magnimik
DRL.484.desc: "Під час одного зі своїх численних набігів на півдні Росії Дірлеванґер почув історію про сільську церкву, в якій зберігаються безцінні ікони, які місцеві жителі вважають священними, але кожен, хто намагається вкрасти їх у селян, гине жахливою смертю. Натхненний бажанням здійснити ще один сатанинський подвиг, Дірлеванґер уклав парі зі своїми поплічниками, що вкраде ці знамениті артефакти і спалить все село, поклавши край цій дурній і дитячій легенді. Оскільки село було ретельно захищене величезною гірською перешкодою, Дірлеванґер зрозумів, що найпростіший шлях до нього лежить через річку, і зібрав кілька човнів для своєї останньої пригоди. Однак у своїй зарозумілості Дірлеванґер сильно переоцінив можливості човна, на якому сидів. Переправившись через половину річки, його човен не витримав тиску сидячої юрби та важких мішків з обладнанням. Тріщачи під таким нестерпним навантаженням, човен зрештою розвалився на дрібні шматочки, залишивши Дірлеванґера і його найближчих людей потонути в замерзлій річці. Оскільки Дірлеванґер швидко помер від серцевого нападу після шоку від холодної води, його люди на інших човнах могли тільки спостерігати за принизливою смертю свого лідера, плануючи зайняти його місце, як тільки дістануться берега. n\nЗі смертю короля бандитів мешканці села тепер можуть спати спокійно, не боячись нападу мародерів, оскільки люди Дірлеванґера обернулися один проти одного, щойно дісталися берега, і тепер не можуть влаштовувати набіги, бо їхні голови будуть підняті на вилах розлючених селян — така доля спіткала тих нещасних, хто не спробував втекти з викраденою здобиччю своїх колишніх бойових товаришів."
 DRL.484.a: "Один раз ветеран Барбаросси — назавжди ветеран Барбаросси"

 DRL.485.t: "Пробудження Родіни" # Lorepapa Saladin
DRL.485.desc: "В глибині душі Дірлеванґер підозрював, що це станеться. Можна грабувати і руйнувати села лише доти, доки цивільне населення не почне думати, що можна дати відсіч. Звичайно, вони вже стикалися з опором раніше, це було очікувано. Але організований опір з боку слабких слов'янських селян вважався неможливим; проте група з них стояла перед особистим загоном Дірлеванґера, вимагаючи, щоб він пішов. \n\nОскар висунувся з вікна вантажівки і почав кричати на них. «Забирайтеся з дороги!» — гримнув він. «Ви хочете закінчити так само, як і всі, хто перейшов мені дорогу?!» Селяни подивилися один на одного, посміхнулися, а потім літній чоловік у смішному капелюсі дістав пістолет із штанів. Він відкрив вогонь по машині, продірявивши водія кулями, а селяни штурмували машину, вбиваючи інших у жорстокому ближньому бою і витягуючи Дірлеванґера з вантажівки. Вони кинули його, який бився і кричав, у середину кола, утвореного селянами. Він встав і озирнувся, побачивши найзліших людей, яких він коли-небудь бачив. Вони дивилися на нього, стискаючи зброю, і він повільно оцінив свою ситуацію. Дірлеванґер ковтнув слину і заплющив очі. «Зробіть це швидко», — пробурмотів він, і вони виконали його прохання."
DRL.485.a: "Як і будь-який король, Король бандитів не любив своїх підданих. І вони теж його не любили"

DRL.486.t: "Червоне свято" #- Шепард
DRL.486.desc: "Після розгрому Уральської ліги бригада Дірлеванґера тріумфально грабувала щойно завойовані території, вбиваючи і ріжучи стільки цивільних, скільки їм заманеться. Коли грабунки закінчилися, Оскар Дірлеванґер і деякі його офіцери пішли на святковий бенкет з Лисенком. Тисячі жінок також супроводжували Лисенка і людей Дірлеванґера, коли вони з'явилися в будівлі капітолію в Магнітогорську. Вечірка була бурхливою і хаотичною, оскільки на бригаду вилили тисячі пляшок горілки. Оскар, звичайно, був у захваті від величезної кількості алкоголю, і незабаром його і без того жахливе алкогольне буйство посилилося, коли він з гордістю розповідав про свою бригаду і почав говорити нісенітниці. Ці нісенітниці були різноманітною сумішшю бажань, від бажання зґвалтувати кожну жінку в Росії до бажання придбати кожну пляшку горілки, яку тільки могла мати його бригада. Його пияцтво супроводжувалося обжерливістю свіжої курки та хліба, які були ідеально приготовані кухарями Лисенка. Він наївся так сильно в своєму п'яному веселощах, що неминуче почав задихатися. Незабаром його люди також почали задихатися, а потім і сам Дірлеванґер, який також не міг дихати. Тоді він підвів погляд у чистому болі та люті і побачив усміхненого Лисенка в кінці обіднього столу, який дістав з кишені маленьку пляшечку з миш'яком. До того, як годинник пробив північ, кожен офіцер бригади був мертвий, вбитий власною обжерливістю та безглуздими бажаннями задоволити себе."
DRL.486.a: "Не бери більше, ніж можеш прожувати"

 DRL.487.t: "Повалений!"
DRL.487.desc: "Сьогодні шокуюча новина: Дірлеванґер був убитий своїми ж людьми. Не отримавши плату у вигляді награбованого та вкраденого майна, різні бандити, найманці та колишні есесівці, що були під його командуванням, очевидно, повалили свого лідера, ув'язнили його, а потім повісили за межами свого старого табору. n\nЗараз у банді панує хаос, і вже утворилося багато розкольницьких угруповань бригади Дірлеванґера, які тероризують пустки. Проте зі смертю Дірлеванґера сила угруповання значно зменшилася, а решта груп, здається, вже розпадаються або відступають глибше в Росію"
DRL.487.a: "Внутрішній ворог"

 DRL.2000.t: "Бригада руйнує гору"
DRL.2000.desc: "Сьогодні Чорної гори більше немає. Нескінченні зали та лабораторії були розграбовані та очищені людьми Дірлеванґера. Деякі з найбільш винахідливих вже синтезують нові ліки з хімікатів, що зберігалися в лабораторіях. Зламані та скуті чоловіки, жінки та діти, які перебували в експериментальних приміщеннях, були в основному звільнені зі своїх камер за наказом Дірлеванґера, хоча це було зроблено лише для того, щоб з ними можна було вчинити у типовий для бригади спосіб. \n\nКілька провідних вчених Лисенка змогли втекти від різанини, але сам Лисенко залишився до останнього і загинув у своєму кабінеті після короткої перестрілки. Мертвого божевільного вченого витягли назовні під вигуки бригадирів і шоковану тишу полонених дослідників, яких ще не стратили. Труп було обезголовлено, а надзвичайно розумну голову Лисенка насадили на спис. Щодо тіла Лисенка, то, за повідомленнями, сам Дірлеванґер сказав: «Залиште його на землі. Це буде його останній внесок у сільське господарство». n\nЗ руїнами Чорної гори і ймовірним скорою розграбуванням бригадою околиць Магнітогорська баланс сил на Уралі безповоротно змінився. Час покаже, чи збереже бригада Дірлеванґера те, що вона тут захопила, але на даний момент одне можна сказати напевно: Урал більше не тремтить від думки про Лисенка. Зараз у нього є набагато більша загроза."
 DRL.2000.a: "Здається, розум не може змагатися з силою..."

DRL.2001.t: "Бригада розгромила Лігу"
DRL.2001.desc: "З падінням останньої фортеці-гулагу Оскар Дірлеванґер оголосив перемогу над Уральською лігою. Сотні уральських солдатів були страчені бандою Дірлеванґера, а села, які колись вважалися безпечними, були розграбовані зростаючою групою бандитів. Не все так райдужно, як заявив Дірлеванґер, оскільки, хоча переважна більшість сил Уральської ліги зараз мертва, є ще ті, хто втік у пустелю і, за повідомленнями, пообіцяв продовжувати боротьбу. Бригада стала ще більш жорстокою після падіння свого найбільшого ворога, і, здається, Південний Урал вступив у нову еру руйнувань і хаосу..."
 DRL.2001.a:"Перемога!"

DRL.2002.t: "Перемога над комуною"
DRL.2002.desc: "Місто Оренбург колись було яскравим, хоч і неефективним, маяком прогресу в пустелях Уралу. Його мешканці були ввічливими і працьовитими, а його лідери були сектантськими, але мали добрі наміри. Тепер все це зникло; війська Дірлеванґера спалили місто дощенту. Його багатства були вивезені солдатами, його жителі були винищені кровожерливими бандитами, а його лідери ув'язнені, піддані тортурам і страчені. Король бандитів сидить на троні мертвих. Міліція Оренбурга була саме тим, чим вона була: міліцією, без підготовки, без стандартного спорядження і без компетентного керівництва. Армія Дірлеванґера кровожерлива і варварська, але ніхто не може заперечити її бойові навички. Солдати СС без проблем розстрілювали бідних людей, які відчайдушно боролися за захист своїх домівок і родин, а втрати, яких вони завдали бригадирам, були рідкісними випадками. Тим, хто втік з Оренбурга, не було куди подітися. Сьогодні ввечері бійці бригади Дірлеванґера добре повечеряють, бо вони це заслужили. Цікаво буде подивитися, як довго триватиме це гарне настрій: чи підживить його ще більше перемог, чи поразка від сильних ворогів спричинить розкол у таборі бандитів."
 DRL.2002.a: "Оренбург, ми ледь знали тебе"

DRL.2003.t: "Остаточна чистка"
DRL.2003.desc: "Була мрія. Мрія про Росію. Про єдину, сильну, соціалістичну, радянську Росію. Було майже іронічно, що бригада Ваффен-СС Чорного Бандита знищила останні залишки НКВС, одна таємна поліцейська організація позбавила іншу від страждань. Незважаючи на всі їхні зусилля, останній бастіон Радянського Союзу загинув, як скажені собаки. Оскар і його бригада стратили останніх виживших після свого рейду, коли сонце сходило над замерзлою пусткою, яка колись була їхнім штабом. n\nСьогодні ця мрія загинула у вогнищі, що тхнуло смертю і дешевими нейлоновими уніформами.\n\nМагнітгорс горить, а разом з ним і остання надія, що хтось в Уральському регіоні зможе зупинити Чорного Бандита і його слід смерті."
DRL.2003.a: "Чорна пляма стає ще чорнішою"

 DRL.2500.t: "Загнаний у кут"
DRL.2500.desc: "Чорна гора Лисенка, фортеця Південного Уралу, впала під натиском найвідданіших комуністів, Уральської ліги. Їхня організація, яка є не більше ніж групою рейдерів, що мріють про щось більше, захопила фортецю і оголосила Магнітогорськ звільненим. Лисенко колись був одним із найвпливовіших лідерів регіону. Він здійснював сміливі набіги на всі сусідні держави і проголошував себе справжнім спадкоємцем радянської наукової програми. Але Уральська ліга перемогла їх, підняла свої брудні прапори над колишньою диктаторською державою і продемонструвала жителям силу своїх солдатів. Звичайно, це визволення — брехня, не більше ніж фасад, який використовується як привід для захоплення влади, але ми мало що можемо вдіяти. Ми — остання сила на Уралі, яка захищає нас від цих щурів; ми не здамося так легко, як банда технократів Лисенка!"
DRL.2500.a: "«Не здаватися!"

 DRL.666.t: "Чорний бандит на Чорній горі"
DRL.666.d: "Двадцять років тому навіть божевільні не сказали б нам, що Оскар Дірлеванґер і Трофим Денисович Лисенко колись зустрінуться як союзники. Але сьогодні написано історію, яка, безсумнівно, визначить майбутнє російського ландшафту. Сьогодні рівно о 08:00 Чорний Бандит прибув із тридцятьма своїми найкращими бійцями до комплексу Лисенка на Чорній Горі, привізши із собою двадцять найкращих полонених, захоплених під час наших останніх рейдів, серед яких був і відомий радянський співак, як подарунок для божевільного вченого. Після прибуття Дірлеванґер приєднався до Лисенка, щоб оглянути 22-гу мотострілецьку дивізію НКВС, а потім оглянути оборонні позиції Чорної гори. Ще більш захоплюючим було те, що після цього відбулася екскурсія по декількох лабораторіях Лисенка та демонстрація технологій і технік. Один експеримент, проведений на молодій польській жінці, викликав особливе захоплення Чорного Бандита. n\nНарешті, день завершився тригодинною зустріччю між Дірлеванґером, Лисенком та їхніми перекладачами. Двоє чоловіків, здається, швидко полюбили один одного, і домовленості між нашими силами та цими вченими про остаточне знищення Уральської ліги значно просунулися вперед. За те, що ми просто передамо населення, яке ми захопимо після нашої неминучої перемоги, ми отримаємо можливість вибрати з незліченних технологічних чудес, які Чорна Гора так довго приховувала."
 DRL.666.a: "Монтекі та Капулетті нарешті об'єдналися"

DRL.1000.t: "Два тижні потому"
DRL.1000.d: "Табір був тихішим, ніж за останні роки. Не було більше шепоту та благань рабів, бо всі вони втекли або були вбиті. Не було чути гудіння двигунів, бо вантажівки або їхнє паливо були вкрадені. Коні не іржали, бо їх зарізали на м'ясо. А чоловіки не розмовляли, бо їх залишилося менше чверті від початкової кількості, і ті, що залишилися, більше не довіряли один одному. Були лише маленькі багаття з гілок і гуми, розкидані навколо, а невеликі групи, які все ще підтримували якусь злочинну дружбу, тулилися одна до одної, підозріло ставлячись до всіх інших груп. Сам Фріц Шмедес спостерігав за цією сценою зі свого вікна і зітхнув. Вони мали швидко перегрупуватися. Він вирішив, що настав час для загальних зборів бригади. Він спустився сходами і вийшов у двері, але щойно він з'явився, пролунав постріл, і куля просвистіла повз його голову. Він миттєво відступив, але скоро зрозумів, що не був єдиною мішенню. Постріл викликав ланцюгову реакцію паніки, і незабаром у таборі розпочалася відкрита перестрілка, де кожен, здавалося, дбав лише про себе. Чому вони воювали і за що вони воювали, вже не мало значення. Важливим було лише виживання, дрібні залишки їжі та боєприпасів. Жалюгідні залишки бригади нарешті розпалися, розірвані власною нестабільністю."
DRL.1000.a: "Ховайтеся!"