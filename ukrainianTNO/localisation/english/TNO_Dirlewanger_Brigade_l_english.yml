 ### Ideas ###
DRL_cornered_dog: "Загнана собака"
DRL_cornered_dog_desc: "Після падіння Лисенка та Чорної гори під контроль Уральської Ліги, Бригада справді залишилася сама, повністю оточена тими, хто прагне її знищити, неначе загнана собака без місця для втечі. Але загнана собака надзвичайно небезпечна, адже немає причин не боротися всією силою. А у Бригади сили справді багато."

DRL_enemies_on_all_sides: "Вороги з усіх боків"
DRL_enemies_on_all_sides_desc: "Ми на чужій землі, оточені ворогами з усіх боків. Але вони не знають правди: Ми тут не з ними в пастці, вони тут з нами. Нехай спробують протистояти нам, і побачать, куди це їх приведе. Солдати Лисенка? Міліції Ліги? Анархісти Оренбурга? Жоден з них не має сміливості протистояти нам і не здатний битися з нами на нашому рівні. Вони можуть приховувати свій страх поки що, але не завжди."

DRL_new_raids: "Підготовка нового рейду"
DRL_new_raids_desc: "Незабаром ми вирушимо вперед. Кров, вогонь і грабіж чекають, але спершу ми повинні підготуватися. Люди, зброя, вантажівки та все інше має бути перевірене і готове.\n\nВоно буде готове. І тоді наші нещасні жертви дізнаються, чому Бригаду варто боятися."

DRL_bandit_state_1: "Бандитська держава"
DRL_bandit_state_1_desc: "Цю 'націю' важко назвати такою, вона складається майже лише з території бродячого загону бандитів, які облаштовують табір лише на час, достатній для пограбування всього навколо, перш ніж рушити далі.\n\nТому функції, що вважаються нормальними для справжньої держави, тут здебільшого ігноруються. Але це також означає, що вони люто б'ються в бою і їх не слід недооцінювати."

DRL_bandit_state_2: "Бандитська держава"
DRL_bandit_state_2_desc: "Цю 'націю' важко назвати такою, вона складається майже лише з території бродячого загону бандитів, які облаштовують табір лише на час, достатній для пограбування всього навколо, перш ніж рушити далі.\n\nТому функції, що вважаються нормальними для справжньої держави, тут здебільшого ігноруються. Але це також означає, що вони люто б'ються в бою і їх не слід недооцінювати."

