DRL_The_Black_Bandits: "Чорні Бандити"
DRL_The_Black_Bandits_desc: "Ми існуємо заради здобичі. Ми існуємо заради сили. І, як завжди, слабші намагаються кинути нам виклик. Щоб перемогти, ми повинні бути добре забезпечені, мати повні загони та демонструвати справжню силу."

 DRL_A_Show_Of_Strength: "Демонстрація Сили"
DRL_A_Show_Of_Strength_desc: "Ті, хто живе на наших землях, повинні знати, кому вони завдячують своїм життям. Хто володіє абсолютною владою над ними. Ми нагадаємо їм про це, показавши силу великої Бригади. Злякані, вони будуть змушені зосередитись на наших подальших цілях."

DRL_Pillage_The_Land: "Грабунок Земель"
DRL_Pillage_The_Land_desc: "Якщо ми хочемо здійснювати рейди, нам потрібна зброя. Жителі наших земель ховають її, і ми знайдемо її, щоб використати за призначенням. Інші цінності, які ми знайдемо, стануть додатковою здобиччю."

DRL_Terror_Is_The_Remedy_For_Resistance: "Терор – Ліки Від Опору"
DRL_Terror_Is_The_Remedy_For_Resistance_desc: "Хоч більшість на наших землях достатньо розумні, щоб дати нам те, що ми хочемо, і не виставляти себе, деякі ні. Повстанці атакували наших людей, і це більше не буде дозволено. Ми покажемо людям, що станеться з такими партизанами, а кампанія жаху змусить усіх боятися підтримувати їх."

DRL_Take_Them_From_There_Homes_Take_Them_From_There_Families: "Від Дому – На Лінію Вогню"
DRL_Take_Them_From_There_Homes_Take_Them_From_There_Families_desc: "Нам потрібні люди для Бригади. На щастя, у нашій території є багато чоловіків, яких можна призвати на службу. Спочатку вони будуть непокірні, але після кількох 'занять' вони стануть такими ж нашими, як і будь-хто інший."

DRL_Raiding: "Рейди"
DRL_Raiding_desc: "Кожен військовий ватажок у Росії грабує сусідів. Вони прикривають це красивими словами, але тільки ми чесні в цьому. Ми грабуємо сусідів і беремо те, що хочемо. Єдине питання – як розподілити здобич."

DRL_dirly_spend_raid_loot_please_officers: "Віддати Найкращим"
DRL_dirly_spend_raid_loot_please_officers_desc: "Найкраща здобич дістанеться офіцерам. Це природньо – вони планували і очолювали рейд, а їхнє задоволення критично важливе для подальшого функціонування Бригади."

DRL_dirly_spend_raid_loot_please_soldiers: "Поділитися Радістю"
DRL_dirly_spend_raid_loot_please_soldiers_desc: "Найкраща здобич дістанеться солдатам. Вони ризикували найбільше та билися на передовій, і їхнє задоволення критично важливе для стабільності та бойового духу Бригади."

DRL_dirly_prepare_raid: "Підготувати Рейд Проти [From.GetName]!"
DRL_dirly_prepare_raid_desc: "Їхні армії надто малі, щоб захистити кожне місто. Ми просто не можемо пропустити таку можливість!"

DRL_dirly_initiate_raid: "Грабуй і Пали!"
DRL_dirly_initiate_raid_desc: "Час настав! Бери все, що хочеш, і спали все, що не хочеш."

DRL_dirly_raid_in_progress: "Рейд триває"
DRL_dirly_raid_in_progress_desc: "Бути бандитом – це прекрасно!"

DRL_Keeping_The_Brigade_Secure: "Збереження Бригади"
DRL_Keeping_The_Brigade_Secure_desc: "Солдати Бригади завжди складалися переважно з вбивць, грабіжників та злочинців різного ґатунку. Це робить їх страшними воїнами, але також схильними до нелояльності. Їх потрібно контролювати через обережні дії та постійну пильність.\n\nСолдати Дірлеванґера – [This.GetDirlewangerBrigadeHappiness]\n\nОфіцери Дірлеванґера – [This.GetDirlewangerOfficersHappiness]\n"

 DRL_purge_the_officer_corps: "Чистка Офіцерського Корпусу"
DRL_purge_the_officer_corps_desc: "Офіцери Бригади ставали надто самостійними, і цей тренд не можна дозволяти далі. Чистка найвпливовіших серед них допоможе виправити ситуацію, незважаючи на затримку, яку це, без сумніву, спричинить у бойових операціях Бригади."

DRL_random_executions: "Випадкові Страті"
DRL_random_executions_desc: "Вибір деяких менш важливих солдатів Бригади для випадкової скороченої страти нагадає іншим про життя, яке вони тепер ведуть, та про вічно потрібну лояльність."

DRL_punishable_by_death: "Смертна Кара"
DRL_punishable_by_death_desc: "Запровадження суворих покарань навіть за найменші порушення покаже нашим людям, що незгода не буде терпітися. Лояльність обов’язкова."

DRL_share_loot_more_equally: "Розподіл Здобичі Більш Рівномірно"
DRL_share_loot_more_equally_desc: "Ми забезпечимо більш рівномірний розподіл здобичі з останніх рейдів серед солдатів. Обіцянка більшої винагороди для рядових безсумнівно підвищить підтримку майбутніх рейдів."

DRL_more_to_the_officers: "Сильно Вигідно Офіцерам"
DRL_more_to_the_officers_desc: "Ми забезпечимо, що більшість здобичі з останніх рейдів дістанеться тим, хто її найбільше заслуговує – офіцерам. Задоволені, їхня підтримка дозволить нам просувати наші конкретні цілі."

DRL_effects_of_the_brigades_organisation: "§gЕфекти"
DRL_effects_of_the_brigades_organisation_desc: "§gНаразі солдати [This.GetDirlewangerBrigadeHappiness].\n\nЧерез це на нас впливатиме наступне:\n[This.GetDirlewangerLocTooltipBrigade]§!§gОфіцери [This.GetDirlewangerOfficersHappiness].\n\nЧерез це на нас впливатиме наступне:\n[This.GetDirlewangerLocTooltipOfficer]"

DRL_Lysenkan_Treaty: "Наш Договір З Лисенком"
DRL_Lysenkan_Treaty_desc: "Наш договір з Лисенком вже приніс нам золото, але нам не потрібні союзники, якщо ми нічого від цього не отримуємо. Цікавіші починання Лисенка довгий час захоплювали Дірлеванґера, а його суперсолдати потребуватимуть чистої дози німецької крові для ефективності!"

DRL_Request_Raiding_Party_Movement: "Запит На Рух Рейдової Групи"
DRL_Request_Raiding_Party_Movement_desc: "Чорна Гора є природною перешкодою для наших рейдів. Але з благословенням Лисенка ми зможемо пройти через Магнітогорськ і далі у незаймані землі. Здобич від таких рейдів безсумнівно буде значною."

DRL_Joint_Training_Excersizes: "Спільні Тренувальні Місії"
DRL_Joint_Training_Excersizes_desc: "Лисенкові люди з НКВД – навчальні військові офіцери. Вони можуть бути прикуті до Чорної Гори, але ми ні, і можемо використати нашу угоду з Лисенком для отримання їхньої експертизи у навчальному процесі."

 DRL_Move_Thru_MGN: "§GМи Зможемо Пересувати Наші Рейдові Групи Через Територію Лисенка!§!"
DRL_dirly_raid_succeeded: "Дірлеванґер Нещодавно Здобув Успіх У Рейді"
DRL_dirly_raid_failed: "Дірлеванґер Нещодавно Зазнав Поразки У Рейді"
DRL_The_Battle_Of_The_Urals: "Битва За Урали"
DRL_bypass_the_mountains: "Обійти Гори"

DRL_Keep_Dirlewanger_Alive: "Довге Життя Чорному Бандиту"
DRL_Keep_Dirlewanger_Alive_desc: "Оскар Дірлеванґер пережив безліч боїв та численні спроби на своє життя — від Германії до Росії і скрізь поміж ними. Але він вижив, і поки він пильний, ми можемо бути впевнені, що він і надалі поведе нас до перемог у майбутніх рейдах незліченну кількість разів!"

DRL_fortify_the_NKVD_border: "Укріпити Кордон НКВД"
DRL_gather_arms_for_the_NKVD_conflict: "Зібрати Зброю Для Конфлікту З НКВД"
DRL_preapare_NKVD_1: "Укріплено Кордон"
DRL_preapare_NKVD_2: "Зібрано Більше Зброї"
DRL_kick_in_the_NKVD: "Удар По НКВД"

DRL_We_Will_Ride: "Ми Будемо Верстати"
DRL_We_Will_Ride_desc: "З нашою владою в Уралі ми ударимо в усі напрямки! Гвардія розбита, Чорна Гора обезголовлена, а Оренбург спалено до тла. Росія на наших колінах. Ми будемо грабувати, ми будемо розоряти, ми будемо винищувати і назавжди станемо найгіршим кошмаром будь-якого жалюгідного воєводи, що нам протистоїть. Дірлеванґер веде і буде вести нас до перемог. Ми будемо вершити рейди вічно!"

 
