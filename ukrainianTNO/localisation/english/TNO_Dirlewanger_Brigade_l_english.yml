 ### Leader Descriptions ###
 POLITICS_OSKAR_DIRLEWANGER_DESC: "Оскар Дірлеванґер, король бандитів, мабуть, найбільш ненависна - і найбільш страхітлива - людина на півдні Росії. На чолі своїх людей, зборища ґвалтівників, убивць і дикунів, рівних якому немає, він тероризує всіх, кому не пощастило називати Південний Урал своєю домівкою.\n\nЗлочинець і пристосуванець усе своє життя, Дірлеванґер 1934 року потрапив до в'язниці за зґвалтування неповнолітньої дівчини й уникнув покарання за цей та інші, пізніші вироки лише завдяки політичним зв'язкам, а 1939 року - добровільно вступивши до Ваффен-СС. Там виявилося, що поряд із розбещеністю він має хист до ефективного, хоч і жорстокого, керівництва, і його підвищили до командира підрозділу, що став першим втіленням так званої «Бригади Дірлеванґера».\n\nПід час війни цей підрозділ, захищений належністю до СС, учинив незліченні звірства у східних кампаніях, прокладаючи собі шлях Польщею та Росією вогнем і грабунком. Це повторилося й у Західноросійській війні, а вцілілі свідчення тих діянь недвозначно показують, що жорстокість і злочинність Дірлеванґера з часом лише зростали.\n\nПроте після невдалого заколоту Гіммлера та СС його життя докорінно змінилося. Відкривши вогонь по частинах Вермахту, які прибули їх роззброїти й ув'язнити, Дірлеванґер зі своїми людьми втік у російську зиму, зрештою викроївши собі володіння на Південному Уралі, звідки вони могли віддаватися своїм найбільшим пристрастям - грабунку та крові.\n\nУ цьому він і його Бригада аж надто вправні. Та Дірлеванґерові вже дещо набридло плюндрувати безіменні села, і він поклав око на дві головні здобичі регіону: місто Орєнбурґ та об'єкти на Чорній Горі. Він гадає, що з превеликим задоволенням спалив би їх дотла.\n\nЗвісно, спершу забравши все цінне."

 POLITICS_FRITZ_SCHMEDES_DESC: "Оскар Дірлеванґер мертвий. Та Бригада, принаймні те, що від неї лишилося, сяк-так животіє під командуванням Фріца Шмедеса, єдиного, хто здатен бодай спробувати втримати її докупи.\n\nДавно засланий до Бригади через суперечку з Гайнріхом Гіммлером, він спочатку всіляко намагався з неї вибратися, але коли вона перетворилася з військового підрозділу на бандитське формування, пішов за нею й пристосувався. Можливо, давши волю темряві, що завжди таїлася в ньому, він невдовзі став майже таким самим чудовиськом, як його командир, плануючи й здійснюючи багато найзухваліших рейдів Бригади.\n\nТепер, коли Дірлеванґер мертвий, а Бригада майже поринула в анархію, Шмедес очолює її скалічені рештки, які ще зберігають вірність, і відчайдушно намагається втримати хоч якусь єдність. Проте дедалі більше людей дезертирує, утворюються відколоті угруповання, а каральні експедиції проти нього вирушають дедалі частіше, тож його зусилля, здається, приречені на невдачу."

 POLITICS_STEVE_DESC: "Без прізвища, просто Стів\n\nСтудент місцевого коледжу з Міннесоти\n\nВін страшенно заблукав\n\nНе кожен, хто мандрує, заблукав - але Стів заблукав.\n\nСтів страшенно заблукав\n\n\n\nУ Стіва переохолодження."

 LEADER_FRITZ_SCHMEDES_DESC: "Фріц Шмедес був добрим німцем, відданим націонал-соціялістом і щиро вірив у вищість арійської раси. Та все це нічого не важило: через суперечку з Гайнріхом Гіммлером його на покарання заслали до Бригади Дірлеванґера. Коли Бригада покинула німецьку справу й рушила в російські нетрі, Шмедес пішов за нею. Коли колись вірні німецькі солдати почали грабувати й чинити набіги, мов ті бандити, проти яких їх колись призвали воювати, Шмедес бився поруч із ними. Кипуча лють та образа за те, що його сюди заслали, виливаються у звірства, які він чинить разом з іншими офіцерами й солдатами Бригади. Нехай і не з власної волі, Шмедес більше не вірний син Німеччини. Він таке саме чудовисько, як і решта."
 
