 decision_cost_manpower_1000_tooltip: "Вартість рішення: [This.GetDecisionCostManpower1000]"
 decision_cost_manpower_2000_tooltip: "Вартість рішення: [This.GetDecisionCostManpower2000]"
 decision_cost_manpower_5000_tooltip: "Вартість рішення: [This.GetDecisionCostManpower5000]"
 decision_cost_manpower_7500_tooltip: "Вартість рішення: [This.GetDecisionCostManpower7500]"
 DRL_The_Black_Bandits: "Чорні бандити"
 DRL_The_Black_Bandits_desc: "Ми існуємо заради грабунку. Ми існуємо заради сили. І, як завжди, слабші люди намагаються кинути нам виклик. Щоб перемогти, ми мусимо подбати про належне постачання, повністю укомплектувати лави й зробити так, щоб нас вважали такими сильними, якими ми є насправді."
 DRL_A_Show_Of_Strength: "Демонстрація сили"
 DRL_A_Show_Of_Strength_desc: "Ті, хто живе на наших землях, мають знати, кому завдячують своїм життям. Хто має над ними абсолютну владу. Ми нагадаємо їм про це, показавши силу всієї Бригади. Залякавши їх таким чином, ми зможемо зосередити більше уваги на наших конкретних подальших цілях."
 DRL_Pillage_The_Land: "Пограбувати землі"
 DRL_Pillage_The_Land_desc: "Для рейдів нам потрібна зброя. Мешканці наших земель напевне її приховують, тож ми шукатимемо її, щоб застосувати для важливішої справи. Інші цінності, які ми неодмінно знайдемо, стануть додатковою винагородою."
 DRL_Terror_Is_The_Remedy_For_Resistance: "Терор - ліки від спротиву"
 DRL_Terror_Is_The_Remedy_For_Resistance_desc: "Більшості мешканців наших земель вистачає розуму віддавати нам бажане й не висовуватися, але декому - ні. Повстанці нападають на наших людей, і більше ми цього не дозволимо. Ми покажемо людям, що трапляється з такими партизанами, а кампанія тотального терору подбає, щоб ніхто не наважився їх підтримати."
 DRL_Take_Them_From_There_Homes_Take_Them_From_There_Families: "З домівок - на передову"
 DRL_Take_Them_From_There_Homes_Take_Them_From_There_Families_desc: "Бригаді потрібні люди. На щастя, на нашій території є багато чоловіків, яких можна призвати й примусити служити. Звісно, вони будуть непокірні, принаймні спочатку, але варто змусити їх кілька разів долучитися до «розваг», і вони стануть нашими не менше за будь-кого іншого."
 DRL_Raiding: "Рейди"
 DRL_Raiding_desc: "Кожен воєначальник у Росії чинить набіги на сусідів. Вони приховують це за туманними словами, та лише ми говоримо про це справді відверто. Ми нападаємо на сусідів і забираємо, що хочемо. Питання лише в тому, як поділити здобич."
 DRL_dirly_spend_raid_loot_please_officers: "Найкраще - найкращим"
 DRL_dirly_spend_raid_loot_please_officers_desc: "Найкраща здобич дістанеться офіцерам. Це цілком природно: вони спланували й очолили рейд, а їхнє вдоволення життєво важливе для подальшої діяльности Бригади."
 DRL_dirly_spend_raid_loot_please_soldiers: "Поділитися радістю"
 DRL_dirly_spend_raid_loot_please_soldiers_desc: "Найкраща здобич дістанеться солдатам. Вони найбільше ризикували й билися з ворогами на передовій, а їхнє вдоволення життєво важливе для стабільности й запалу Бригади."
 DRL_dirly_prepare_raid: "Підготувати рейд проти [From.GetName]!"
 DRL_dirly_prepare_raid_desc: "Армії цих уйобків надто малі, щоб захистити кожне містечко. Просто не можемо проґавити таку нагоду!"
 DRL_dirly_initiate_raid: "Грабувати й палити!"
 DRL_dirly_initiate_raid_desc: "Час настав! Забрати все, що хочемо забрати, і спалити все, чого не хочемо."
 DRL_dirly_raid_in_progress: "Рейд триває"
 DRL_dirly_raid_in_progress_desc: "Добре бути бандитом!"
 DRL_Keeping_The_Brigade_Secure: "Тримати Бригаду під контролем"
 DRL_Keeping_The_Brigade_Secure_desc: "Бригада завжди складалася переважно з убивць, грабіжників і всіляких злочинців. Це робить їх грізними солдатами, але водночас схиляє до зради. Їх слід тримати в покорі обачними діями й невсипущою пильністю.\n\nСолдати Дірлеванґера: [This.GetDirlewangerBrigadeHappiness]\n\nОфіцери Дірлеванґера: [This.GetDirlewangerOfficersHappiness]\n"
 DRL_purge_the_officer_corps: "Чистка офіцерського корпусу"
 DRL_purge_the_officer_corps_desc: "Офіцери Бригади стають аж надто самостійними, і дозволяти цьому тривати далі не можна. Чистка найпомітніших серед них має допомогти це виправити, хоч і неодмінно завадить бойовим операціям Бригади."
 DRL_random_executions: "Страти навмання"
 DRL_random_executions_desc: "Якщо навмання вибрати кількох менш важливих солдатів Бригади й стратити їх без суду, це має нагадати решті, яким життям вони тепер живуть. І якої вірности від них тепер вимагають навіки."
 DRL_punishable_by_death: "Смертна кара"
 DRL_punishable_by_death_desc: "Драконівські покарання навіть за найменші провини мають показати нашим людям, що незгоди не терпітимуть. Вірність обов'язкова."
 DRL_share_loot_more_equally: "Рівномірніше розподілити здобич"
 DRL_share_loot_more_equally_desc: "Ми подбаємо, щоб здобич останніх рейдів рівномірніше ділили між людьми. Обіцянка більшої частки для рядових солдатів неодмінно посилить загальну підтримку майбутніх рейдів."
 DRL_more_to_the_officers: "Віддати перевагу офіцерам"
 DRL_more_to_the_officers_desc: "Ми подбаємо, щоб більшість здобичі останніх рейдів дісталася тим, хто найбільше її заслуговує, - офіцерам. Задобрені таким чином, вони підтримуватимуть нас дужче, дозволяючи нам просуватися до наших конкретних цілей."
 DRL_effects_of_the_brigades_organisation: "§gЕфекти§!"
 DRL_effects_of_the_brigades_organisation_desc: "§gНаразі солдати: [This.GetDirlewangerBrigadeHappiness].\n\nЧерез це на нас діятимуть такі ефекти:\n[This.GetDirlewangerLocTooltipBrigade]§!§gОфіцери: [This.GetDirlewangerOfficersHappiness].\n\nЧерез це на нас діятимуть такі ефекти:\n[This.GetDirlewangerLocTooltipOfficer]§!"
 DRL_Lysenkan_Treaty: "Наш договір із Лисенком"
 DRL_Lysenkan_Treaty_desc: "Договір із Лисенком уже приніс золото до наших кишень, але такі союзники нам не потрібні, якщо ми нічого з цього не матимемо. Цікавіші починання Лисенка давно інтриґують Дірлеванґера, а Лисенковим надсолдатам для справности знадобиться чиста доза німецької крови!"
 DRL_Request_Raiding_Party_Movement: "Запросити прохід рейдерських загонів"
 DRL_Request_Raiding_Party_Movement_desc: "Чорна Гора є природною перепоною для наших рейдів. Та з благословення Лисенка ми зможемо проходити крізь Маґнітоґорск у незаймані землі по той бік. Здобич із таких походів неодмінно буде чималою."
 DRL_Joint_Training_Excersizes: "Спільні навчальні місії"
 DRL_Joint_Training_Excersizes_desc: "Лисенкові люди з НКВД - підготовані військові офіцери. Вони, може, й прикуті до Чорної Гори, але ми - ні, і можемо скористатися домовленістю з Лисенком, щоб вони поділилися своїм досвідом на навчаннях."
 DRL_Move_Thru_MGN: "§GМи зможемо проводити наші рейдерські загони за межі території Лисенка!§!"
 DRL_dirly_raid_succeeded: "Дірлеванґер нещодавно здійснив успішний рейд"
 DRL_dirly_raid_failed: "Дірлеванґер нещодавно зазнав невдачі в рейді"
 DRL_The_Battle_Of_The_Urals: "Битва за Урал"
 DRL_bypass_the_mountains: "Обійти гори"
 DRL_Keep_Dirlewanger_Alive: "Довгих років Чорному Бандиту"
 DRL_Keep_Dirlewanger_Alive_desc: "Оскар Дірлеванґер пережив незліченні битви й незліченні замахи на своє життя - від Ґерманії до Росії та всюди між ними. Та він вижив, і поки зберігатиме пильність, можемо бути певні, що він і далі вестиме нас до перемог у незліченних майбутніх рейдах!"
 DRL_fortify_the_NKVD_border: "Укріпити кордон із НКВД"
 DRL_gather_arms_for_the_NKVD_conflict: "Зібрати зброю для конфлікту з НКВД"
 DRL_preapare_NKVD_1: "Кордон укріплено"
 DRL_preapare_NKVD_2: "Зібрано більше зброї"
 DRL_kick_in_the_NKVD: "Вдарити по НКВД"
 
 DRL_We_Will_Ride: "Ми рушимо"
 DRL_We_Will_Ride_desc: "Пануючи над Уралом, ми вдаримо в усіх напрямках! Гвардію розбито, Чорну Гору обезголовлено, а Орєнбурґ спалено дотла. Росія біля наших ніг. Ми грабуватимемо, ми плюндруватимемо, ми влаштовуватимемо різанини й назавжди лишимося найгіршим кошмаром кожного жалюгідного воєначальника, який стане нам на заваді. Дірлеванґер вів і вестиме нас до перемоги. Ми рушатимемо в рейди повік!"
 
