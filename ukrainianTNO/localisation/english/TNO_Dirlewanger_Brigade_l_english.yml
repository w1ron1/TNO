DRL_bandit_state_4_desc: "Цю 'націю' важко назвати такою, вона складається майже лише з території бродячого загону бандитів, які облаштовують табір лише на час, достатній для пограбування всього навколо, перш ніж рушити далі.\n\nТому функції, що вважаються нормальними для справжньої держави, тут здебільшого ігноруються. Але це також означає, що вони люто б'ються в бою і їх не слід недооцінювати."

DRL_bandit_state_5: "Бандитська держава"
DRL_bandit_state_5_desc: "Цю 'націю' важко назвати такою, вона складається майже лише з території бродячого загону бандитів, які облаштовують табір лише на час, достатній для пограбування всього навколо, перш ніж рушити далі.\n\nТому функції, що вважаються нормальними для справжньої держави, тут здебільшого ігноруються. Але це також означає, що вони люто б'ються в бою і їх не слід недооцінювати."

DRL_to_the_slaughter: "На забій!"
DRL_to_the_slaughter_desc: "Зведені в стан люті обіцянкою здобичі та грабунку, люди Бригади йдуть війною. На атаці мало хто може їм протистояти, навіть підготовлений, а ті, хто не втікає, часто згорають разом із селами, які вони марно захищають.\n\nБудь-яка битва з ними буде жорстокою, а після будь-якої перемоги лунатиме безжалісний сміх."

 DRL_band_exhausted: "Виснажена Бригада"
DRL_band_exhausted_desc: "Після останнього рейду Бригада вичерпана. Добыча має бути належно організована та розподілена, веселощі завершені, а обладнання відремонтоване та впорядковане перед наступними рейдами.\n\nУ такому стані вони, можливо, виглядають вразливими..."

DRL_think_tank_idea: "Аналітичний центр"
DRL_think_tank_idea_desc: "На 'прохання' Бригади Лисенко відправив деяких зі своїх молодших науковців до її таборів.\n\nХоча вони, звісно, абсолютно не пристосовані до будь-яких труднощів і не можуть бути надійними в бою, вони дуже корисні для знаходження рішень проблем, про які Бригада часто не хоче замислюватися. І цього достатньо."

DRL_band_collapsed: "Розгромлена Бригада"
DRL_band_collapsed_desc: "Після смерті Оскара Дірлеванґера залишки його Бригади розпорошені та роздроблені, лише тінь колишньої могутності.\n\nВони більше не здатні до операцій значного масштабу і чекають лише на нову силу, яка зметуть їх і забере Орськ собі."

DRL_recently_raided: "Недавній рейд"
DRL_recently_raided_desc: "Успіх рейду Бригади на землі держави підірвав впевненість у всіх її керівників. Потрібно діяти. Швидко."

DRL_homemade_body_armor_idea: "Саморобна броня"
DRL_homemade_body_armor_idea_desc: "Використовуючи імпровізовані матеріали, Бригада виготовила для своїх людей комплекти саморобної броні. Хоча примітивні, вони дивно ефективні проти застарілої та слабкої зброї, часто знайденої в Південному Уралі."

DRL_Soldiers_Extra_Discontent_Idea: "Військові – некеровані"
DRL_Soldiers_Extra_Discontent_Idea_desc: "Як і можна очікувати від складу бандитської групи, люди Бригади – різношерстий загін. Хоча вони чудові рейдери, дисципліна та організація зазвичай не є їхніми рисами.\n\nАле саме ці якості Бригаді знадобляться, якщо вона хоче завоювати Південний Урал.\n\n§YЩомісячна перевірка військ самим Дірлеванґером оцінить їхню організацію.§!"

DRL_Soldiers_Discontent_Idea: "Військові – неорганізовані"
DRL_Soldiers_Discontent_Idea_desc: "Як і можна очікувати від складу бандитської групи, люди Бригади – різношерстий загін. Хоча вони чудові рейдери, дисципліна та організація зазвичай не є їхніми рисами.\n\nАле саме ці якості Бригаді знадобляться, якщо вона хоче завоювати Південний Урал.\n\n§YЩомісячна перевірка військ самим Дірлеванґером оцінить їхню організацію.§!"

DRL_Soldiers_Okay_Idea: "Військові – відносно організовані"
DRL_Soldiers_Okay_Idea_desc: "Як і можна очікувати від складу бандитської групи, люди Бригади – різношерстий загін. Хоча вони чудові рейдери, дисципліна та організація зазвичай не є їхніми рисами.\n\nАле саме ці якості Бригаді знадобляться, якщо вона хоче завоювати Південний Урал.\n\n§YЩомісячна перевірка військ самим Дірлеванґером оцінить їхню організацію.§!"

DRL_Soldiers_A_Bit_Happy_Idea: "Військові – організовані"

DRL_Soldiers_A_Bit_Happy_Idea_desc: "Як і можна очікувати від складу бандитської групи, люди Бригади – різношерстий загін. Хоча вони чудові рейдери, дисципліна та організація зазвичай не є їхніми рисами.\n\nАле саме ці якості Бригаді знадобляться, якщо вона хоче завоювати Південний Урал.\n\n§YЩомісячна перевірка військ самим Дірлеванґером оцінить їхню організацію.§!"

DRL_Soldiers_Happy_Idea: "Військові – добре організовані"
DRL_Soldiers_Happy_Idea_desc: "Як і можна очікувати від складу бандитської групи, люди Бригади – різношерстий загін. Хоча вони чудові рейдери, дисципліна та організація зазвичай не є їхніми рисами.\n\nАле саме ці якості Бригаді знадобляться, якщо вона хоче завоювати Південний Урал.\n\n§YЩомісячна перевірка військ самим Дірлеванґером оцінить їхню організацію.§!"

DRL_Officers_Normal_Idea: "Офіцери – задоволені Дірлеванґером"
DRL_Officers_Normal_Idea_desc: "Як і їхні підлеглі, офіцери Бригади здебільшого безжальні вбивці, що живуть для здобичі та особистого збагачення.\n\nЦе спонукає їх шукати нові цілі та джерела багатства, але також створює небезпеку – що вони можуть вважати себе більш кваліфікованими для керівництва Бригадою, ніж сам Дірлеванґер. Їхню лояльність потрібно підтримувати.\n\n§YЩомісячна розмова з офіцерами виявить їхнє ставлення.§!"

DRL_Officers_Disloyal_Idea: "Офіцери – нелояльні до Дірлеванґера"
DRL_Officers_Disloyal_Idea_desc: "Як і їхні підлеглі, офіцери Бригади здебільшого безжальні вбивці, що живуть для здобичі та особистого збагачення.\n\nЦе спонукає їх шукати нові цілі та джерела багатства, але також створює небезпеку – що вони можуть вважати себе більш кваліфікованими для керівництва Бригадою, ніж сам Дірлеванґер. Їхню лояльність потрібно підтримувати.\n\n§YЩомісячна розмова з офіцерами виявить їхнє ставлення.§!"

DRL_Officers_Disrespectful_Idea: "Офіцери – зневажають Дірлеванґера"
DRL_Officers_Disrespectful_Idea_desc: "Як і їхні підлеглі, офіцери Бригади здебільшого безжальні вбивці, що живуть для здобичі та особистого збагачення.\n\nЦе спонукає їх шукати нові цілі та джерела багатства, але також створює небезпеку – що вони можуть вважати себе більш кваліфікованими для керівництва Бригадою, ніж сам Дірлеванґер. Їхню лояльність потрібно підтримувати.\n\n§YЩомісячна розмова з офіцерами виявить їхнє ставлення.§!"

DRL_Officers_Respect_Idea: "Офіцери – поважають Дірлеванґера"
DRL_Officers_Respect_Idea_desc: "Як і їхні підлеглі, офіцери Бригади здебільшого безжальні вбивці, що живуть для здобичі та особистого збагачення.\n\nЦе спонукає їх шукати нові цілі та джерела багатства, але також створює небезпеку – що вони можуть вважати себе більш кваліфікованими для керівництва Бригадою, ніж сам Дірлеванґер. Їхню лояльність потрібно підтримувати.\n\n§YЩомісячна розмова з офіцерами виявить їхнє ставлення.§!"

DRL_Officers_Unswayingly_Loyal_Idea: "Офіцери – лояльні до Дірлеванґера"
DRL_Officers_Unswayingly_Loyal_Idea_desc: "Як і їхні підлеглі, офіцери Бригади здебільшого безжальні вбивці, що живуть для здобичі та особистого збагачення.\n\nЦе спонукає їх шукати нові цілі та джерела багатства, але також створює небезпеку – що вони можуть вважати себе більш кваліфікованими для керівництва Бригадою, ніж сам Дірлеванґер. Їхню лояльність потрібно підтримувати.\n\n§YЩомісячна розмова з офіцерами виявить їхнє ставлення.§!"

DRL_Officer_Purge: "Зачистка офіцерів"
DRL_officer_Purge_desc: "Лояльність офіцерів Бригади виявилася недостатньою. Тому їх буде назавжди відсторонено та замінено амбітними – і більш лояльними – підлеглими.\n\nЕфективність Бригади ймовірно деякий час постраждає, але це прийнятна ціна за усунення будь-яких натяків на зраду серед офіцерського складу."


 ### Decisions ###
 DRL_Dirlewanger_intro_event: "Бригада Дірлеванґера – вступна подія"

DRL_Lysenko_Experiments: "Експерименти Лисенка"
DRL_Lysenko_Experiments_desc: "Наш союз з Лисенком дозволив нам покращити наших солдатів за його науковими методами. Надсилання в’язнів для експериментів дасть нам перевагу над оточуючими ворогами."

DRL_Rage_Inducing_Hormones: "Гормони Люті"
DRL_Rage_Inducing_Hormones_desc: "Нові препарати Лисенка підвищать агресію наших людей, перетворюючи їх на безстрашних воїнів Південного Уралу!"

DRL_Steroids: "Стероїди"
DRL_Steroids_desc: "Потужні стероїди підвищать фізичні можливості наших людей, дозволяючи їм ефективніше битися з ворогами!"

DRL_Lysenkan_Goods: "Товари Лисенка"
DRL_Lysenkan_Goods_desc: "Завдяки союзу з Чорною Горою ми маємо нове джерело військових кадрів та обладнання. Скористаємося плодами цієї угоди!"

DRL_Request_Arms: "Запит зброї"
DRL_Request_Arms_desc: "Чорна Гора має величезні запаси зайвої зброї. Наша угода з Лисенком дозволяє отримати частину для використання. Слід це зробити."

DRL_Request_Advisors: "Запит радників"
DRL_Request_Advisors_desc: "Лисенко навчив військових теоретиків. Він повинен позичити нам деяких із них. Ми 'попросимо' його зробити це."

