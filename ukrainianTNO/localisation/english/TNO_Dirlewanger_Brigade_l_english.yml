 DRL_bandit_state_4: "Бандитська держава"
 DRL_bandit_state_4_desc: "Цю «державу» важко так назвати: вона майже нічим не відрізняється від території мандрівної зграї бандитів, які стають табором лише доти, доки не пограбують усе довкола, а тоді рушають далі.\n\nТож функціями, звичайними для справжньої держави, тут здебільшого нехтують. Водночас це означає, що в будь-якій сутичці вони битимуться люто, і недооцінювати їх не слід."
 DRL_bandit_state_5: "Бандитська держава"
 DRL_bandit_state_5_desc: "Цю «державу» важко так назвати: вона майже нічим не відрізняється від території мандрівної зграї бандитів, які стають табором лише доти, доки не пограбують усе довкола, а тоді рушають далі.\n\nТож функціями, звичайними для справжньої держави, тут здебільшого нехтують. Водночас це означає, що в будь-якій сутичці вони битимуться люто, і недооцінювати їх не слід."
 DRL_to_the_slaughter: "На бійню!"
 DRL_to_the_slaughter_desc: "Обіцянка здобичі й грабунку довела людей Бригади до шалу, й вони стали на стежку війни. Коли вони наступають, мало хто здатен їм протистояти, навіть підготувавшись, а тих, хто не тікає, часто спалюють разом із селами, які вони марно захищають.\n\nКожна битва з ними буде лютою різаниною, а кожну здобуту перемогу невідступно супроводжуватиме розгнузданий регіт."
 DRL_band_exhausted: "Виснажена банда"
 DRL_band_exhausted_desc: "Після останнього рейду Бригада виснажена. Перш ніж здійснювати нові рейди, треба як слід упорядкувати й розподілити здобич, завершити гулянки, полагодити та впорядкувати спорядження.\n\nЗа таких обмежень їх, мабуть, можна вважати вразливими..."
 DRL_think_tank_idea: "Аналітичний центр"
 DRL_think_tank_idea_desc: "На «прохання» Бригади Лисенко відрядив до її таборів кількох своїх молодших науковців.\n\nЗвісно, вони зовсім не пристосовані до жодних труднощів і в бою на них годі покластися, зате вони дуже корисні, коли треба розв'язувати проблеми, над якими Бригада часто не хоче й голову сушити. Цього досить."
 DRL_band_collapsed: "Занепала Бригада"
 DRL_band_collapsed_desc: "Після смерти Оскара Дірлеванґера рештки його Бригади розпорошені й роз'єднані, лишень бліда тінь того, чим вони були колись.\n\nБільше не здатні до операцій хоч якогось справжнього масштабу, вони лише чекають, поки інша сила змете їх зі шляху й забере Орск собі."
 DRL_recently_raided: "Нещодавній рейд"
 DRL_recently_raided_desc: "Успішний рейд Бригади на землі держави похитнув загальну довіру до її керівництва. Треба вжити заходів, щоб цьому зарадити. Негайно."
 DRL_homemade_body_armor_idea: "Кустарні бронежилети"
 DRL_homemade_body_armor_idea_desc: "Із підручних матеріялів Бригада виготовила для своїх людей кустарні бронежилети. Хоч і грубо зроблені, вони напрочуд дієві проти застарілої та малопотужної зброї, що часто трапляється на Південному Уралі."
 DRL_Soldiers_Extra_Discontent_Idea: "Солдати - Некеровані"
 DRL_Soldiers_Extra_Discontent_Idea_desc: "Як і можна сподіватися від учасників бандитського угруповання, люди Бригади - строката публіка. Хоч вони й чудові рейдери, дисципліна та організованість зазвичай не належать до чеснот, які їм можна приписати.\n\nТа саме ці якості знадобляться Бригаді, якщо вона хоче підкорити Південний Урал.\n\n§YЩомісячний огляд військ самим Дірлеванґером покаже рівень їхньої організованости.§!"
 DRL_Soldiers_Discontent_Idea: "Солдати - Дезорганізовані"
 DRL_Soldiers_Discontent_Idea_desc: "Як і можна сподіватися від учасників бандитського угруповання, люди Бригади - строката публіка. Хоч вони й чудові рейдери, дисципліна та організованість зазвичай не належать до чеснот, які їм можна приписати.\n\nТа саме ці якості знадобляться Бригаді, якщо вона хоче підкорити Південний Урал.\n\n§YЩомісячний огляд військ самим Дірлеванґером покаже рівень їхньої організованости.§!"
 DRL_Soldiers_Okay_Idea: "Солдати - Дещо організовані"
 DRL_Soldiers_Okay_Idea_desc: "Як і можна сподіватися від учасників бандитського угруповання, люди Бригади - строката публіка. Хоч вони й чудові рейдери, дисципліна та організованість зазвичай не належать до чеснот, які їм можна приписати.\n\nТа саме ці якості знадобляться Бригаді, якщо вона хоче підкорити Південний Урал.\n\n§YЩомісячний огляд військ самим Дірлеванґером покаже рівень їхньої організованости.§!"
 DRL_Soldiers_A_Bit_Happy_Idea: "Солдати - Організовані"
 DRL_Soldiers_A_Bit_Happy_Idea_desc: "Як і можна сподіватися від учасників бандитського угруповання, люди Бригади - строката публіка. Хоч вони й чудові рейдери, дисципліна та організованість зазвичай не належать до чеснот, які їм можна приписати.\n\nТа саме ці якості знадобляться Бригаді, якщо вона хоче підкорити Південний Урал.\n\n§YЩомісячний огляд військ самим Дірлеванґером покаже рівень їхньої організованости.§!"
 DRL_Soldiers_Happy_Idea: "Солдати - Добре організовані"
 DRL_Soldiers_Happy_Idea_desc: "Як і можна сподіватися від учасників бандитського угруповання, люди Бригади - строката публіка. Хоч вони й чудові рейдери, дисципліна та організованість зазвичай не належать до чеснот, які їм можна приписати.\n\nТа саме ці якості знадобляться Бригаді, якщо вона хоче підкорити Південний Урал.\n\n§YЩомісячний огляд військ самим Дірлеванґером покаже рівень їхньої організованости.§!"
 DRL_Officers_Normal_Idea: "Офіцери - Задоволені Дірлеванґером"
 DRL_Officers_Normal_Idea_desc: "Як і їхні солдати, офіцери Бригади здебільшого є безжальними вбивцями, що живуть заради грабунку й особистого збагачення.\n\nЦе спонукає їх шукати нові цілі й нові джерела багатства, але водночас таїть небезпеку: вони можуть вирішити, що більше годяться очолювати Бригаду, ніж сам Дірлеванґер. Їхню вірність необхідно підтримувати.\n\n§YЩомісячна розмова з офіцерами покаже їхні настрої.§!"
 DRL_Officers_Disloyal_Idea: "Офіцери - Нелояльні до Дірлеванґера"
 DRL_Officers_Disloyal_Idea_desc: "Як і їхні солдати, офіцери Бригади здебільшого є безжальними вбивцями, що живуть заради грабунку й особистого збагачення.\n\nЦе спонукає їх шукати нові цілі й нові джерела багатства, але водночас таїть небезпеку: вони можуть вирішити, що більше годяться очолювати Бригаду, ніж сам Дірлеванґер. Їхню вірність необхідно підтримувати.\n\n§YЩомісячна розмова з офіцерами покаже їхні настрої.§!"
 DRL_Officers_Disrespectful_Idea: "Офіцери - Не поважають Дірлеванґера"
 DRL_Officers_Disrespectful_Idea_desc: "Як і їхні солдати, офіцери Бригади здебільшого є безжальними вбивцями, що живуть заради грабунку й особистого збагачення.\n\nЦе спонукає їх шукати нові цілі й нові джерела багатства, але водночас таїть небезпеку: вони можуть вирішити, що більше годяться очолювати Бригаду, ніж сам Дірлеванґер. Їхню вірність необхідно підтримувати.\n\n§YЩомісячна розмова з офіцерами покаже їхні настрої.§!"
 DRL_Officers_Respect_Idea: "Офіцери - Поважають Дірлеванґера"
 DRL_Officers_Respect_Idea_desc: "Як і їхні солдати, офіцери Бригади здебільшого є безжальними вбивцями, що живуть заради грабунку й особистого збагачення.\n\nЦе спонукає їх шукати нові цілі й нові джерела багатства, але водночас таїть небезпеку: вони можуть вирішити, що більше годяться очолювати Бригаду, ніж сам Дірлеванґер. Їхню вірність необхідно підтримувати.\n\n§YЩомісячна розмова з офіцерами покаже їхні настрої.§!"
 DRL_Officers_Unswayingly_Loyal_Idea: "Офіцери - Вірні Дірлеванґеру"
 DRL_Officers_Unswayingly_Loyal_Idea_desc: "Як і їхні солдати, офіцери Бригади здебільшого є безжальними вбивцями, що живуть заради грабунку й особистого збагачення.\n\nЦе спонукає їх шукати нові цілі й нові джерела багатства, але водночас таїть небезпеку: вони можуть вирішити, що більше годяться очолювати Бригаду, ніж сам Дірлеванґер. Їхню вірність необхідно підтримувати.\n\n§YЩомісячна розмова з офіцерами покаже їхні настрої.§!"
 DRL_Officer_Purge: "Чистка серед офіцерів"
 DRL_officer_Purge_desc: "Вірність офіцерів Бригади виявилася недостатньою. Тож їх назавжди відправлять у відставку, а їхнє місце займуть честолюбні - й вірніші - підлеглі.\n\nІмовірно, на якийсь час це позначиться на боєздатності Бригади, але така ціна прийнятна, аби позбутися будь-яких натяків на зраду в офіцерському корпусі."

 ### Decisions ###
 DRL_Dirlewanger_intro_event: "Бригада Дірлеванґера - вступна подія"
 DRL_Lysenko_Experiments: "Експерименти Лисенка"
 DRL_Lysenko_Experiments_desc: "Союз із Лисенком дозволив нам удосконалювати наших солдатів його науковими методами. Надсилаючи йому полонених для експериментів, ми здобудемо перевагу над ворогами, що нас оточують."
 DRL_Rage_Inducing_Hormones: "Гормони, що викликають лють"
 DRL_Rage_Inducing_Hormones_desc: "Нові препарати Лисенка посилять аґресивність наших людей і перетворять їх на розлючених воїнів, рівних яким немає на Південному Уралі!"
 DRL_Steroids: "Стероїди"
 DRL_Steroids_desc: "Потужні стероїди посилять фізичні можливості наших людей, дозволивши їм ще дієвіше битися з нашими ворогами!"
 DRL_Lysenkan_Goods: "Лисенківські припаси"
 DRL_Lysenkan_Goods_desc: "Союз із Чорною Горою дав нам нове джерело військових кадрів і спорядження. Насолодімося плодами цієї домовлености!"
 DRL_Request_Arms: "Запросити зброю"
 DRL_Request_Arms_desc: "Чорна Гора має величезні запаси надлишкової зброї. Угода з Лисенком дозволяє нам отримати частину її для власного вжитку. Варто цим скористатися."
 DRL_Request_Advisors: "Запросити радників"
 DRL_Request_Advisors_desc: "Під командуванням Лисенка є підготовані військові теоретики. Йому слід позичити нам декого з них. Ми його про це «попросимо»."
 decision_cost_manpower_500: "£manpower_icon §Y500§!"
 decision_cost_manpower_1000: "£manpower_icon §Y1000§!"
 decision_cost_manpower_2000: "£manpower_icon §Y2000§!"
 decision_cost_manpower_5000: "£manpower_icon §Y5000§!"
 decision_cost_manpower_7500: "£manpower_icon §Y7500§!"
