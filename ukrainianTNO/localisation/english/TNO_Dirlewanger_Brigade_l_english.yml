 ### Focus Descriptions ###
 DRL_the_black_bandits_of_the_south: "Чорні бандити Півдня"
 DRL_the_black_bandits_of_the_south_desc: "Оскар Дірлеванґер раз у раз приводив нас до перемоги над слабкими й сильними ворогами та до збагачення. Від нашої «служби» в СС до втечі, коли Вермахт спробував нас роззброїти, й до захоплення земель навколо Орска - він завжди вказував нам шлях.\n\nІ цей шлях - забирати. Ми забираємо, що хочемо, а хочемо ми всього. Все на Південному Уралі - багатства, жінки, земля - належить нам. Просто ми ще цього не забрали.\n\nМи це виправимо."

 DRL_our_backs_to_the_wall: "Нас загнали до стіни"
 DRL_our_backs_to_the_wall_desc: "Ці землі, може, й належать нам, але не всі з цим згодні. Уральська Ліга, жалюгідна купка громад на чолі зі злочинцем-священником, раз у раз полювала на нас, і хоч ми уникали її загонів або знищували їх, завжди приходять нові.\n\nОскільки з інших боків нас затисли божевільні на сході, степи на півдні й комуни на заході, Ліга гадає, що зможе знищити нас раз і назавжди. Та вони не знають, що самі опинилися саме там, де нам і треба. Ми встоїмо, знекровимо їх, а тоді, коли прийде час, завдамо удару у відповідь і візьмемо Орєнбурґ.\n\nІ коли це станеться, вони справді зрозуміють, чому Бригади так бояться."

 DRL_ready_the_boys: "Підготувати хлопців"
 DRL_ready_the_boys_desc: "Ніхто в Росії, по жоден бік Уралу, не є лютішим, витривалішим чи сильнішим за людей Бригади. Час знову це довести.\n\nЩоб додати їм завзяття, роздамо частину попередніх трофеїв. Здобич, спиртне та жінки, ще здатні розважати, нагадають їм, що чекає попереду.\n\nНаша наступна «експедиція» стрімко наближається, і вони мусять чекати її з запалом!"

 DRL_we_ride_or_die: "Пан або пропав"
 DRL_we_ride_or_die_desc: "Оточені ворогами, тими, хто надумав зупинити нас або покласти край нашому праву грабувати, ми відмовляємося вмирати, хоч як відчайдушно вони цього бажають! Ми забираємо! Ми рушаємо!\n\nМи пройдемо по кожному, кому стане дурости гратися в солдата, по кожному селу, якому стане дурости озброїти ополчення, й по будь-кому, хто ще наважиться нас зупинити. Ми знайдемо все - і всіх, - що вони намагаються захистити, і вантажитимемо здобич через їхні трупи.\n\nГотуйтеся, хлопці! Рушаємо по здобич!"

 DRL_keep_them_fresh: "Тримати їх у формі"
 DRL_keep_them_fresh_desc: "Люди Бригади загартовані. Та пересичення награбованим, цією незмінною метою, має тривожну здатність розніжувати їх. Ледачий бандит - мертвий бандит, а вмирати ми не збираємося.\n\nЇхні ліжка залишаться твердими, казарми - заледве достатньо теплими, а пайка спиртного - достатньою, але тільки-но. Ми триматимемо їх напоготові.\n\nДостатньо напоготові, щоб за наказом вони з радістю хапалися за нагоду вирушити в чергову «експедицію»."

 DRL_keep_them_happy: "Тримати їх вдоволеними"
 DRL_keep_them_happy_desc: "Бригада існує заради втіхи. Втіхи від користування тим, що силою зброї відібрали з холодних мертвих рук слабших людей.\n\nЩо саме це «те» - вино, жінки, наркотики, ігри, книжки чи будь-що інше, - не має значення. Ватажок чудово це знає, тож здобич роздадуть, а гулянки заохочуватимуть.\n\nЩасливий бандит завжди прагне таким залишитися й радо виконає будь-який наказ задля цього."

 DRL_prepare_for_the_clash: "Готуватися до зіткнення"
 DRL_prepare_for_the_clash_desc: "Воно насувається, і вже скоро.\n\nНаближається велика сутичка з Уральською Лігою, і ми її знищимо. Ми переб'ємо їхніх людей, зґвалтуємо Орєнбурґ дощенту в усіх можливих значеннях і доведемо всім, що ніхто не здатен зупинити Бригаду!\n\nА потім? Коли не буде Ліги, яка організовує оборону й посилає селам «радників»? Що ж, пограбуємо весь регіон. Хто нас зупинить?"

 DRL_prepare_new_raids: "Готуйте нові рейди"
 DRL_prepare_new_raids_desc: "Чимало людей вважають людей Бригади простими бандитами, здатними лише на примітивну жорстокість у гонитві за здобиччю. Більшість тих людей уже мертві.\n\nМи, може, й жорстокі та прагнемо грабувати, але ми не дурні. Рейди треба планувати. Здобич треба перевозити. З втратами треба давати раду. Терор треба застосовувати саме так, як потрібно.\n\nДірлеванґер і вся Бригада роблять це вже роками. І робитимуть далі, готуючись до найбільших рейдів за весь час!"

 DRL_gather_our_loot: "Зібрати нашу здобич"
 DRL_gather_our_loot_desc: "Коли Бригада вирушає в рейд, вона завжди повертається з горами здобичі. Та разом із нею повертається й проблема її обліку.\n\nЧастки треба належно розподіляти, і навіть знаючи про покарання, дехто завжди намагається забрати більше. Далі так тривати не може: кожен отримує частку, а її розмір залежить від багатьох речей. Треба ретельно складати, вести й регулярно оновлювати опис усіх трофеїв.\n\nЗрештою, як інакше ми знатимемо, коли час вирушати по нове?"

 DRL_prepare_for_the_spoils: "Готуйте місця під здобич"
 DRL_prepare_for_the_spoils_desc: "Хоч це й навряд чи можна справді назвати «проблемою», ми часто помічаємо, що нам важко зберігати всі трофеї наших численних успішних рейдів.\n\nЦе завдає клопоту: без належних місць для зберігання всього захопленого доводиться швидко роздавати чи споживати його, що породжує проблеми з дисципліною, та ще й крадіжки частішають.\n\nТому перед наступним рейдом збудуємо нові склади. Сподіваймося, вони заповняться так само швидко!"

 DRL_the_black_bandit_on_the_black_mountain: "Чорний Бандит на Чорній Горі"
 DRL_the_black_bandit_on_the_black_mountain_desc: "Навіть людей Бригади чутки про божевільні експерименти, які проводить шалений науковець у Маґнітоґорску, змушують замислитися. Та ватажок бачить у цьому лише нагоду.\n\nХоч би ким іще був Лисенко, Уральській Лізі він точно не друг, а ще в нього великі запаси всілякої зброї. Зброї, якої ми хочемо. Спробуємо домовитися про частину її.\n\nА з часом можна придивитися, що ще він має..."

 DRL_lysenkos_instruction: "Навчання Лисенка"
 DRL_lysenkos_instruction_desc: "Угода з Лисенком виявилася навіть вигіднішою, ніж ми могли сподіватися. Він не лише мав зброю: серед солдатів НКВД, що перейшли на його бік, було кілька справжніх бойових інструкторів.\n\nЛюди Бригади, може, й вправні рейдери, які вміють оцінити все, що трапиться на очі, але багато з них, особливо новобранці, вкрай погано підготовані. Тож ми домовилися посилати декого з наших людей до тих інструкторів, щоб вони навчили їх основ військової справи.\n\nПобачимо, як це сподобається Лізі, коли наступного разу з нею зіткнемося!"

 DRL_organize_the_russians: "Організувати росіян"
 DRL_organize_the_russians_desc: "Дірлеванґер, може, й старий майстер рейдів, але він ще й просто старий. Старий і слабкий.\n\nСтарі бандити довго не живуть, а коли гинуть, то разом з ними гинуть усі, хто лишився їм вірним. Ми пояснимо це російським членам Бригади - її більшості - й постараємося перетягти їх на наш бік. Пообіцяємо більші частки, вкрадені трофеї та все інше, що знадобиться.\n\nКоли прийде час, Дірлеванґер і ті нечисленні неросіяни, які збережуть йому вірність, опиняться самі. А ще - стануть легкою здобиччю."

 DRL_expert_instruction: "Фахова підготовка"
 DRL_expert_instruction_desc: "Совєти, може, й програли свою велику війну проти Райху, але ті з нас, хто ще жив із тих часів, добре пам'ятають, як завзято вони билися й скількох німців убили, перш ніж капітулювати.\n\nЦього вони досягли суворою, безкомпромісною, а часом і жорстокою підготовкою. Підготовкою, до якої ми тепер маємо доступ завдяки інструкторам Лисенка. І ми маємо намір нею скористатися. Відрядимо якомога більше наших людей, щоб вони, сподіваймося, опанували кращу й дієвішу тактику.\n\nЯкщо ця тактика зробить рейди успішнішими, тим краще."

 DRL_soviet_stratagem: "Совєцькі хитрощі"
 DRL_soviet_stratagem_desc: "Совєти програли, але, як повсякчас наголошують росіяни в Бригаді, вони були й залишаються майстрами обману. Маскіровки.\n\nБагато років тому вони використовували цю майстерність, щоб сіяти сум'яття і серед Вермахту, і серед інших своїх ворогів. Наші вороги дрібніші за тодішніх совєцьких, але від цього вони не перестають бути ворогами. Якщо ми засвоїмо деякі з цих стратегій обману, пристосуємо їх до наших потреб і застосуємо в наступному рейді, то зможемо значно підвищити ефективність.\n\nАбо принаймні дамо їм менше часу поховати цінності."

 DRL_soviet_arms: "Совєцька зброя"
 DRL_soviet_arms_desc: "Серед зброї, отриманої для Бригади з маґнітоґорських запасів Лисенка, чимало неймовірно старої. На деякій навіть є двоголовий орел Російської імперії!\n\nТа зброя є зброя, і поки вона надійно стріляє, з неї може бути користь. Роздамо її людям Бригади, почавши з найновіших рекрутів і вивільнивши кращу зброю для ветеранів. Якщо новобранці покажуть себе й здаватимуть знайдену здобич для розподілу, як і належить, то зможуть заслужити кращу зброю.\n\nА якщо ні, завжди знайдеться інший новобранець."

 DRL_soviet_mastery: "Совєцька майстерність"
 DRL_soviet_mastery_desc: "Бригада вижила - й досягла успіху - завдяки розумінню свого оточення. Коли ми відірвалися від Німеччини, довелося пристосувати нашу доктрину до Уралу й потреб рейдів.\n\nЗа новою угодою інструктори Лисенка навчають нас совєцької тактики. Декотрі кмітливіші люди збагнули, що поєднання цих двох підходів - совєцької сили й дисципліни з нестандартністю та непередбачуваністю рейдерських маневрів - може дати нам справжню перевагу над тими, хто прагне нас знищити.\n\nТож ми так і зробимо."

 DRL_lysenkos_promises: "Обіцянки Лисенка"
 DRL_lysenkos_promises_desc: "За свою допомогу Лисенко багато вимагає від Бригади. Полонених, яких можна було б пустити в роботу - на базі чи на спині - або інакше примусити до служби, доводиться передавати неушкодженими.\n\nДосі він добре за них платив, це так, але що ще той божевільний ховає у своїх лабораторіях? У глибинах Чорної Гори?\n\nЧас дізнатися й побачити, які ще речі він ладен запропонувати!"

 DRL_spoil_trucks: "Вантажівки для здобичі"
 DRL_spoil_trucks_desc: "Наші прохання до Лисенка про «альтернативні» форми оплати дали плоди.\n\nПерша з них? Вантажівки, без сумніву, взяті з автопарків з'єднань, що перейшли на його бік разом із ним. Походження нас мало обходить, зате наслідки важать значно, значно більше. Більше вантажівок означає, що більше золота, більше зерна, більше жінок, більше всього можна завантажити й привезти до наших таборів.\n\nЧас знайти якесь сонне село, де вони стануть у пригоді!"

 DRL_the_riches_of_the_mountain: "Багатства Гори"
 DRL_the_riches_of_the_mountain_desc: "Бригада й далі передає Лисенкові цінних полонених, і вже давно час нагадати йому, чого насправді варта наша подальша допомога.\n\nНа Чорній Горі є більше, ніж він досі з нами ділився, набагато більше, і ми цього хочемо! Трохи тиску, прикладеного саме як треба, має заохотити до тіснішої співпраці й додаткової оплати.\n\nПринаймні якщо Лисенко собі не ворог."

 DRL_the_think_tank: "Аналітичний центр"
 DRL_the_think_tank_desc: "Лисенко дав нам вантажівки, зброю та гроші. То чом би йому не повернути нам трохи того, що ми давали йому, - людей?\n\nУ його лабораторіях ховаються всілякі науковці, і декотрі з них напевне менш важливі за інших. Чому б натомість не надіслати їх нам? Він отримає більше полонених, а ми - кількох яйцеголових, що зможуть і проводити «польові дослідження» на полонених, і долучатися до наших власних починань.\n\nУгода надто добра, щоб від неї відмовлятися. Ми подбаємо, щоб Лисенко це зрозумів."

 DRL_loot_the_universe: "Пограбувати весь світ"
 DRL_loot_the_universe_desc: "Досі Лисенко робив правильний вибір, даючи нам за полонених корисні речі як альтернативну оплату, а тепер ще й збільшує звичайні платежі!\n\nЗдається, він учиться: Бригада радо продає, але оплата - щедра оплата - і обов'язкова, і очікувана. Останній такий платіж уже прибув: нові рушниці та спорядження, зокрема й важче озброєння.\n\nДобрі речі. Час пустити їх у діло!"

 DRL_lysenkos_strategy: "Стратегія Лисенка"
 DRL_lysenkos_strategy_desc: "Люди. Лише вони цікавлять Лисенка.\n\nГроші? Йому байдуже. Території? Вони йому ні до чого. Жінки? Точно не так, як нам. Ні, йому потрібно лише багато людей, яких у кайданах приженуть на Чорну Гору для всіляких збочених експериментів, що він задумав. Що ж, якщо він цього хоче, то це й отримає - аби тільки міг платити.\n\nЯкщо зможе, то матиме бажаних людей, а ми - бажану здобич, і від них, і від нього!"

 DRL_testing_our_enemies: "Випробувати ворогів"
 DRL_testing_our_enemies_desc: "Бригада оточена ворогами. Та це також означає, що нас оточують нагоди.\n\nУральська Ліга, Орєнбурґ і незліченні села та селища займають землі навколо нас, усі багаті на здобич, яка тільки й чекає, щоб ми її забрали. Однак треба бути обачними: усі вони чекають на нашу помилку. Тому спершу випробуємо їхні сили й побачимо, хто з ворогів дає найкращу нагоду.\n\nТоді, і лише тоді, рушимо грабувати!"

 DRL_strike_at_the_urals: "Удар по Уралу"
 DRL_strike_at_the_urals_desc: "Уральська Ліга, наш найзавзятіший ворог.\n\nХоч як ми ненавидимо їхню жалюгідну покручну «державу», не можна заперечувати, що їхні ополченці дієві, а громади добре захищені. У минулому вони навіть кілька разів нас перемагали, і це завдає нам клопоту. Ми мусимо довести, що вони нездатні захистити свої землі, що вони, як і всі інші, падають перед нами.\n\nМусимо поставити їх на місце. І поставимо."

 DRL_strike_at_orenburg: "Удар по Орєнбурґу"
 DRL_strike_at_orenburg_desc: "Комуни Орєнбурґа дезорганізовані й тримаються разом лише завдяки спільним анархістським ідеалам, та й то неміцно. Іншими словами, вони ідеальні цілі.\n\nПроте досі вони значно рідше ставали ціллю наших рейдів, ніж села й селища Уральської Ліги. А отже, на відміну від уже розграбованих нами місць, вони мають аж ломитися від здобичі.\n\nЧас показати їм, на що здатна Бригада!"

 DRL_strike_at_the_peasantry: "Удар по селянах"
 DRL_strike_at_the_peasantry_desc: "Напади на поселення, пов'язані з Лігою чи Орєнбурґом, могли б дати добру здобич, але є одна велика проблема: вони можуть дати відсіч.\n\nЗазвичай це не біда, проте зараз ми воліли б не ризикувати поразкою. Незалежні села, розкидані Південним Уралом, може, й небагаті, але й справжньої оборони не мають. Здобичі буде небагато, та все ж буде, а ще й жінки.\n\nНаразі цього вистачить."

 DRL_grab_the_healthy_fit_and_strong: "Хапати здорових, дужих і міцних"
 DRL_grab_the_healthy_fit_and_strong_desc: "Ми здійснюємо рейди заради багатства, розваг і багатьох інших речей, але одна з найцінніших знахідок - плоть.\n\nКожну людину, взяту в полон під час рейду, можна використати. Жінок можна використовувати, доки вони ще на щось годяться, а чоловіків - поставити до роботи або, якщо досить сильні, примусити служити. Усі можуть служити.\n\nІ служитимуть. Або помруть."

 DRL_draw_out_the_guard: "Виманити Гвардію"
 DRL_draw_out_the_guard_desc: "На кожному кроці Уральська гвардія зриває наші задуми, організовуючи оборону, навчаючи селян ополченської справи й навіть нападаючи на наші табори вночі.\n\nЯкщо ми хочемо колись знищити їх дощенту й відкрити їхні землі для грабунку, треба спершу підточити їхні сили, і тут стане в пригоді нещодавно вивчена тактика маскіровки. Низка малих рейдів має змусити їх кинути в бій основні сили.\n\nІ коли це станеться, ми чекатимемо."

 DRL_the_battle_of_novotroitsk: "Битва за Новотроіцк"
 DRL_the_battle_of_novotroitsk_desc: "Наш задум спрацював!\n\nРейди на віддалені села Ліги виманили її війська: вони рушили зводити оборону навколо Новотроіцка, готуючись до бою. Та вони й досі гадають, що битимуться лише з черговим рейдерським загоном, і розгорнули сили відповідно.\n\nВони й гадки не мають, що на них чекає."

 DRL_the_second_phase: "Другий етап"
 DRL_the_second_phase_desc: "Сили Уральської Ліги, заманені нашим обманом, розбито під Новотроіцком, і це дає нам нагоду.\n\nЇхнє ополчення поріділо, оборонні лінії прорвано, а фортеці оголено. Навряд чи ми ще раз застанемо таку хвилинну слабкість, тож мусимо негайно нею скористатися. Здійснимо додаткові рейди на ці фортеці, щоб забезпечити їхнє знищення.\n\nНаближається ще один великий рейд, і коли він почнеться, Ліга не зможе завадити!"

 DRL_lessons_of_the_guard: "Уроки Гвардії"
 DRL_lessons_of_the_guard_desc: "У фортецях Ліги ми захопили багато здобичі, але також узяли полонених.\n\nЗазвичай ми передали б їх Лисенкові або просто позбулися б їх, та не варто забувати, якою корисною була попередня підготовка наших людей. Дамо їм дуже простий вибір: навчити нас, як Ліга готується й воює, або померти. Напевне, дехто погодиться дати нам уроки.\n\nА тоді ми зможемо - і будемо - застосовувати ці уроки проти їхніх колишніх друзів."

 DRL_ural_expertise: "Уральський досвід"
 DRL_ural_expertise_desc: "Полонені Уральської Ліги, принаймні ті, кому вистачило розуму прийняти нашу пропозицію, дуже допомогли.\n\nЗемлі Ліги гористі й важкопрохідні, і полонені дали нам корисні настанови, як найкраще там діяти. Такі корисні, що дехто в Бригаді вважає, ніби їм варто запропонувати залишитися й приєднатися до нас на постійніше.\n\nЗвісно, вони завжди можуть відмовитися. Це лише означатиме, що треба викопати трохи більшу яму."

 DRL_homemade_body_armor: "Кустарні бронежилети"
 DRL_homemade_body_armor_desc: "Про одну річ наші люди просять знову й знову: бронежилети.\n\nХоч ми й не маємо зв'язків чи ресурсів для придбання справжньої якісної броні, нам це й не потрібно. Більшість ворожої зброї стара або саморобна, тож і ми можемо обійтися підручним розв'язком. Довкола повно металобрухту зі старого чи награбованого спорядження, і з нього можна зробити грубі обладунки.\n\nЦього буде достатньо. Хоч виглядатимуть вони трохи дивно."

 DRL_rapid_assault: "Стрімкий напад"
 DRL_rapid_assault_desc: "У вовків багато чого варто перейняти.\n\nВони полюють зграями. Вибирають найзручніші цілі - тих, хто по дурості відбився від великого стада. Рухаються швидко, досягають мети й відступають, готові повторити все спочатку. Нам слід діяти так само: стрімко пересуватися вантажівками, валити здобич і забирати, що хочемо.\n\nНевдовзі всі знатимуть Бригаду як Вовків Уралу."

 DRL_transfer_the_flesh: "Відправити живий товар"
 DRL_transfer_the_flesh_desc: "Наші рейди на Південному Уралі стали частішими й масштабнішими, тож тепер у нас значно більше полонених, ніж зазвичай.\n\nМи не маємо ні місця, ні бажання їх тримати й точно не хочемо їх годувати. Та Лисенкові, як завжди, потрібно ще більше, тож передамо їх йому. Звісно, за належну винагороду.\n\nПобачимо, що цього разу вдасться з нього витиснути."

 DRL_hand_them_over: "Передати їх"
 DRL_hand_them_over_desc: "Як і раніше, Лисенко запропонував нам пристойну кількість спорядження із запасів Чорної Гори в обмін на полонених, яких ми можемо надати.\n\nДехто в Бригаді каже, що треба вимагати більшого, бо наші позиції міцнішають. Інші ж нагадують, що володіння Лисенка не порівняти з нашими звичайними цілями, та й убивати гуску, що несе золоті яйця, немає особливого сенсу.\n\nУ їхніх словах є рація. Дотримуватимемося угоди. Поки що."

 DRL_good_friends_means_good_money: "Добрі друзі - добрі гроші"
 DRL_good_friends_means_good_money_desc: "Дотримавши слова й відповівши на наші дії, Лисенко теж виконав угоду.\n\nДо наших складів за Орском уже наближаються домовлені вантажі спорядження. Хоч це й менше, ніж, на думку декого, ми мали б отримати, це набагато більше за ніщо, і його можна негайно застосувати в майбутніх рейдах. Наразі цього має вистачити.\n\nА наступного разу? Хто знає?"

 DRL_the_deal_changed: "Умови змінилися"
 DRL_the_deal_changed_desc: "Коли ми востаннє укладали велику угоду з Лисенком, нам бракувало сили, щоб його притиснути. Тепер усе інакше.\n\nУ нас більше людей. У нас більше досвіду. А після всіх попередніх угод цілком можливо, що тепер у нас і спорядження більше. Час виразно показати цю різницю в становищі. Він може дати більше. Ми йому так і скажемо.\n\nІ краще б йому це зробити."

 DRL_pray_we_dont_alter_it_further: "Моліться, щоб ми не змінили їх знову"
 DRL_pray_we_dont_alter_it_further_desc: "Чудові новини: Лисенко збагнув, що не має змоги торгуватися з Бригадою, і відступив, як і личить відомому нам боягузові.\n\nДо наших складів за Орском уже наближаються вантажі спорядження, значно більші, ніж ми могли б отримати інакше. Нашим людям украй кортить узяти його до рук, щоб і замінити стару та зношену зброю, і озброїти найновіших рекрутів. Ми вже почали планувати нові рейди, щоб пустити його в діло.\n\nХто сказав, що залякування не творить чудес?"

 DRL_a_second_great_raid: "Другий великий рейд"
 DRL_a_second_great_raid_desc: "Після розгрому під Новотроіцком Уральська Ліга присмиріла, і час планувати ще один великий рейд. Такий, якому вони не зможуть завадити.\n\nОднак спершу треба відповісти на багато питань. Куди вдарити? На якій здобичі зосередитися? Коли напасти? Що робити з полоненими - принаймні коли наші люди з ними закінчать?\n\nТа відповіді ми знайдемо. До багатого вибору можна звикнути!"

 DRL_rally_the_lads: "Зібрати хлопців"
 DRL_rally_the_lads_desc: "Якщо збираємося в рейд, треба розпалити запал людей!\n\nНакажемо офіцерам обіцяти їм усе, чого забажають: гроші, жінок, спиртне, кров, будь-що! Чи отримають вони це, залежить від них самих, від їхньої аґресивности, жорстокости й пильности. І, звісно, коли щось із цього знайдуть, доведеться здати його на облік для належного розподілу.\n\nАле свою частку вони отримають. Ту частку, якої заслуговують."

 DRL_spread_the_spoils: "Поділитися здобиччю"
 DRL_spread_the_spoils_desc: "Рейд удався на славу, і ми повернулися з іще більшим награбованим, ніж гадали!\n\nЧас поділитися багатством і, може, цього разу трохи збільшити їхню частку. Дати їм трохи більше спиртного, ще кілька золотих, ще одну-дві жінки, яких можна зносити до решти, та волю розпоряджатися частиною інших полонених і речей.\n\nДеякі офіцери, може, будуть трохи невдоволені, але навіть вони мусять розуміти, як важливо тримати людей вдоволеними!"

 DRL_lick_our_wounds: "Зализати рани"
 DRL_lick_our_wounds_desc: "Рейди вдалися, але це не означає, що вони нічого не коштували.\n\nЛюди гинули, як і завжди. Спорядження зношувалося, табори доводилося полишати й таке інше. Звісно, невдовзі ми знову вирушимо, але лише дурень діє без підготовки. Тож зробимо перепочинок. Відпочинемо, полагодимо спорядження й визначимо нові цілі.\n\nА тоді знову рушимо просто туди."

 DRL_deep_in_the_west: "Далеко на заході"
 DRL_deep_in_the_west_desc: "На заході лежить Орєнбурґ. Ідеальна ціль.\n\nЇхня оборона хаотична й неузгоджена, ополченці далеко не такі дієві, як в Уральської Ліги, а поселення переповнені здобиччю, готовою до збору. Коли стільки обставин нам сприяє, чом би не обрати їх наступною ціллю? Негайно підготуємо рейдерський загін.\n\nЧас рушати!"

 DRL_penetrate_the_mountains: "Пробитися в гори"
 DRL_penetrate_the_mountains_desc: "Знову обираємо землі Уральської Ліги для наступного рейду.\n\nВони досі не оговталися повністю від поразки під Новотроіцком і досі протистоять нам на кожному кроці. Вони залишаються нашими найгрізнішими ворогами, але колишній ореол сили значно потьмянів. Ударимо по них знову, поки вони ще не підвелися, і заберемо все, що в них лишилося.\n\nІ доведемо людям Південного Уралу, що Ліга не здатна захистити їх від нас!"

 DRL_the_pincer: "Лещата"
 DRL_the_pincer_desc: "Є й третій варіянт: ударити по Орєнбурґу й Уральській Лізі разом, одночасно!\n\nЦе буде важко, та й ризик великий, але якщо переможемо, якщо розіб'ємо й розпорошимо обидва їхні війська, то матимемо стільки всілякої здобичі, що й не знатимемо, куди її подіти. Ба більше, ми посіємо страх по всьому Південному Уралу.\n\nБригаду неможливо зупинити, і ми це доведемо!"

 DRL_reap_the_spoils: "Пожинати плоди"
 #DRL_reap_the_spoils:1 "Punish the Failures"
 DRL_reap_the_spoils_desc: "Останнім часом ми забирали на Південному Уралі все, що не було прибите цвяхами, - і дещо з того, що було!\n\nЧас трохи зупинитися й насолодитися досягнутим. Зрештою, життя - це не тільки рейди, а й насолода вином і жінками, які вони приносять! Подбайте, щоб і його, і їх використали до останку!\n\nМи завжди можемо - і будемо - йти по нове!"
 #DRL_reap_the_spoils_desc:1 "We have burned down central Russia, and for what? Failure? Russia is a harsh place, full of hard men. If you can't stand up to that, you're through here. I think it's time for a good old Roman-style decimation, don't you?"

 DRL_honor_the_deal: "Дотриматися угоди"
 DRL_honor_the_deal_desc: "Знову настав час укласти чергову угоду з Лисенком.\n\nІ, як раніше, дехто в Бригаді каже, що треба витиснути з божевільного науковця більше. Більше зброї. Більше навчання. Більше всього. Та ми цього не робитимемо. Зараз у нас досить ворогів, щоб додавати до них ще й Чорну Гору, і ми покажемо, що дотримуємося угод, коли це нам вигідно.\n\nТак і вчинимо. Ще одна угода. Настільки чесна, наскільки взагалі можливо на Південному Уралі."

 DRL_demand_double: "Вимагати подвоїти"
 DRL_demand_double_desc: "Знову настав час укласти чергову угоду з Лисенком.\n\nІ, як раніше, дехто в Бригаді каже, що треба витиснути з божевільного науковця більше. Більше зброї. Більше навчання. Більше всього. А чом би й ні? У нього напевне є більше, ніж він показує, хоч скільки ми вже з нього витиснули. Подивимося, скільки цього разу вдасться видобути із запасів Чорної Гори.\n\nА ще подивимося, скільки йому лишилося до тієї миті, коли він перестане бути корисним."

 DRL_prepare_for_the_final_battle: "Готуватися до останньої битви"
 DRL_prepare_for_the_final_battle_desc: "Час настав.\n\nМи били по Уральській Лізі знову й знову, а вона все стоїть. Усе б'ється з нами за кожної нагоди. Усе дає людям надію вистояти проти нас, аж до сказу доводить. Проти Бригади! Годі. Ми підготуємо останній удар, щоб назавжди покінчити з цими боягузами.\n\nІ коли їх не стане, люди, які довго вважали себе в безпеці під їхнім захистом, дізнаються, на що ми справді здатні!"

 DRL_ready_our_men: "Підготувати людей"
 DRL_ready_our_men_desc: "Якщо чогось у проклятої Уральської Ліги й удосталь, то це людей.\n\nБіженці з усього Південного Уралу й з-поза його меж стікаються на землі Ліги, і чимало з них вступає до війська, намагаючись «захистити» свої родини. Якщо ми хочемо перемогти, всі мусять бути готові. Треба утвердити дисципліну й підняти кожного в Бригаді, витягти з-поміж ніг останньої здобичі або повернути з чергового походу зводити особисті порахунки.\n\nВирішальна сутичка наближається."

 DRL_gather_our_guns: "Зібрати всю зброю"
 DRL_gather_our_guns_desc: "У великій битві з Лігою знадобиться кожна одиниця нашої зброї.\n\nСказати, що люди Бригади не щадять спорядження, - це колосально применшити справу, тож мусимо переконатися, що кожна наявна одиниця зброї працює, закріплена за бійцем і перебуває в найкращому стані.\n\nВиступаючи проти Ліги, ми не можемо нічого лишити на волю випадку: матимемо лише один шанс."

 DRL_sound_the_horn: "Засурмити в ріг"
 DRL_sound_the_horn_desc: "Ми роками жили в цих землях довкола Орска, зазнаючи нападів з усіх боків.\n\nВід колишніх так званих товаришів із Фатерлянду. Від боягузливих російських сусідів. Від жалюгідних селян, які насмілюються давати відсіч. Годі. Ми стали сильними, а вони ослабли. Час бездіяльности минув. Час засурмити в ріг.\n\nНехай почнеться полювання! В атаку!"

 DRL_bang_the_drum: "Бити в барабан"
 DRL_bang_the_drum_desc: "Ми йдемо по наших ворогів, і вони мусять це знати.\n\nМи влаштуємо навчання просто на очах у тих, хто, як нам відомо, спостерігає, і ясно покажемо, що готуємося до грабунку, різанини й усього іншого. Гордо проголосимо, що ось-ось рушимо й ніщо з того, що вони зроблять, скажуть чи запропонують, не врятує їх від прийдешнього.\n\nВони вже мертві. Просто ще цього не знають."

 DRL_destroy_the_league: "Знищити Лігу"
 DRL_destroy_the_league_desc: "Час настав. Нарешті, після стількох рейдів і стількох битв, час настав.\n\nМи дуже довго готувалися знищити Уральську Лігу, і тепер час рушати. І ми не вдовольнимося грабунком брудних сіл, ні, ми не зупинимося, доки всі їхні фортеці не запалають, усі бійці не будуть мертві чи розпорошені, а все багатство й усі жінки не будуть зібрані. Не зупинимося, доки від Ліги не лишиться тільки спогад.\n\nА коли її не стане, почнуться справжні розваги."

 DRL_a_hollow_victory: "Марна перемога"
 DRL_a_hollow_victory_desc: "Уральську Лігу розбито, гори охоплені вогнем, але святкування немає.\n\nЛисенко, той зрадливий безумець, оголосив гори своїми й проіґнорував наші вимоги віддати здобич, по праву зароблену вогнем і кров'ю. Хоч дехто в Бригаді хоче негайно помститися за цю образу, зараз ми не можемо з ним воювати. Заберемо, що зможемо, і підемо - поки що.\n\nАле ми не забудемо. І Лисенко заплатить єдину ціну, якою можна заплатити за відмову рейдерові в його здобичі."

 DRL_loot_and_burn: "Грабувати й палити"
 DRL_loot_and_burn_desc: "Лігу розчавлено!\n\nЇї колишні землі та всі люди на них цілком відкриті для грабунку. Більше нікому стати нам на заваді, і тепер можна розважитися. Забирайте цінності, викрадайте жінок, убивайте всіх, хто чинить чи чинив нам опір, і паліть їхні села.\n\nСпаліть усе!"

 DRL_pillage_the_fortresses: "Розграбувати фортеці"
 DRL_pillage_the_fortresses_desc: "Досі фортеці Уральської Ліги були майже неприступними. Тепер - ні.\n\nЛігу розпорошено, її колишні твердині відкриті навстіж, і за такий довгий недоторканний час у них накопичилося повно зброї, грошей і ще багато, багато чого. Час забирати.\n\nВізьмемо все, що не прикручене, а решту спалимо для науки!"

 DRL_harry_the_stragglers: "Полювати на втікачів"
 DRL_harry_the_stragglers_desc: "Люди біжать. Як і личить здобичі.\n\nЛіга впала, і незліченні тисячі тих, хто раніше був під її захистом, намагаються втекти куди тільки можуть, несучи все цінне, що мають. Час ударити. Вночі ми налетимо на них. Ми вб'ємо їхніх чоловіків, заберемо дітей і використовуватимемо жінок як заманеться. Нехай ті нечисленні, хто виживе, рознесуть страх усюди.\n\nСтрах перед нами."

 DRL_chase_the_scraps: "Гнатися за рештками"
 DRL_chase_the_scraps_desc: "Лисенко, той виродок, украв у нас Урал.\n\nІ він, і кожен із божевільних «науковців», що за ним іде, заплатять за це. Дорого. А поки зосередимося на тому, що ще можна врятувати після цієї зради. Рештки Ліги досі тут: хтось намагається втекти, хтось розгублено блукає, і з їхніх залишків можна видобути трохи здобичі.\n\nАле з часом ми повернемо те, що належить нам по праву."

 DRL_pillage_orenburg: "Розграбувати Орєнбурґ"
 DRL_pillage_orenburg_desc: "Орєнбурґ - єдина перепона, що ще відділяє Бригаду від великих російських мисливських угідь на заході.\n\nЧас його знищити. Ми налетимо на їхні комуни, розтрощимо оборону, вб'ємо кожного, хто стане проти нас, заберемо все, що вони мають, а залишки поселень використаємо як бази для подальших рейдів у дальші краї.\n\nМи так близько до наших цілей, і ми їх досягнемо."

 DRL_when_the_world_stopped_making_sense: "Світ перевернувся догори дриґом"
 DRL_when_the_world_stopped_making_sense_desc: "Ми це зробили!\n\nІдеальний маленький світ, який анархісти будували в Орєнбурзі, перевернувся догори дриґом. Завдяки нам. Бо ми забираємо те, що хочемо. Тут неподільно пануємо ми, а не анархісти, демократи чи як вони там себе називали. І ми покажемо, що про них думаємо: забравши все бажане, спалимо їхнє місто дотла.\n\nНехай горить, усе до останку!"

 DRL_salt_the_earth: "Посипати землю сіллю"
 DRL_salt_the_earth_desc: "Ми забрали в Орєнбурґа все. Навіть урожай.\n\nІ тепер, коли він у нас, можна подбати, щоб нового вони не отримали. Поля, які зможемо, посиплемо сіллю, решту спалимо. Без змоги самим добувати їжу вони не лише ніколи більше не зможуть проти нас повстати, а й муситимуть зробити вибір.\n\nСлужитимуть нам. Або голодуватимуть. Вибір за ними."

 DRL_take_the_goods: "Забрати добро"
 DRL_take_the_goods_desc: "Орєнбурґ, його землі та все на них - наші.\n\nБригада забере все, що не прикручене, розкопає всі жалюгідні схованки, вибере жінок, яких захоче забрати, і визначить чоловіків, які, на нашу думку, найбільше годяться для примусової служби.\n\nА якщо хтось опиратиметься? Застрелити."

 DRL_let_all_know_fear: "Нехай усі пізнають страх"
 DRL_let_all_know_fear_desc: "Страх - така сама потужна зброя, як будь-яка рушниця.\n\nПісля всіх наших завоювань, усіх рейдів, усіх перемог і всієї здобутої здобичі страх іде і перед нами, і слідом, як і належить. По всій Росії ми - чудовисько вночі. Ми - бабай. Ми - ім'я й образ, яких бояться чоловіки і про які жінки пошепки розповідають історії, щоб лякати дітей.\n\nМи - втілений страх. І всі це знатимуть."

 DRL_one_last_mark: "Остання ціль"
 DRL_one_last_mark_desc: "Ми розчавили Орєнбурґ. Ми розвіяли Уральську Лігу за вітром. Лишився тільки один ворог: Лисенко.\n\nБезумець із Чорної Гори, колишній благодійник, що став зрадником, гадає, ніби його оборона, солдати й божевільні експерименти захистять його від нашого гніву.\n\nВін помиляється. І ми почнемо готувати засоби, щоб йому це показати."

 DRL_king_of_the_mountain: "Король Гори"
 DRL_king_of_the_mountain_desc: "Настав час рушати на Чорну Гору.\n\nЛисенко гадає, що він у безпеці. Помиляється. Ми розпорошимо тих нечисленних солдатів, які ще йому вірні, знищимо всі прокляті експерименти, які він зможе кинути проти нас, і витягнемо його та інших науковців із лабораторій у справжній світ. Він не здатен нам опиратися. Він не може становити великої загрози.\n\nЧи може?"

 DRL_alexander_wept_but_we_will_ride: "Александр плакав - нам ще є куди йти"
 DRL_alexander_wept_but_we_will_ride_desc: "Бригада піднеслася зі зборища рейдерів до нових македонців.\n\nМи правимо Орском. Ми правимо Уралом. Степ відкритий перед нами, і тепер ми рушаємо й завойовуємо, як давні греки, а наш власний Александр вічно веде нас уперед - до вина, жінок і незліченних багатств!\n\nСлава, яку ми тут здобули, лише зростатиме, бо жоден чоловік, жінка чи дитина не буде в безпеці. Ми спалимо Ґерманію, пограбуємо Нью-Йорк, розоримо Токіо й заберемо все, чого хочемо, все, що бачимо.\n\nКороль зі своїми бандитами рушає!"

 DRL_kill_the_german_scum: "Убити німецьку наволоч"
 DRL_kill_the_german_scum_desc: "Дірлеванґер надто довго грабував нашу країну. Досить.\n\nВін плюндрував наші села, вбивав наших братів і батьків, ґвалтував матерів і сестер та приносив самі лише страждання кожному росіянинові, якого зустрічав. Його треба зупинити.\n\nІ ми працюватимемо над цим."

 DRL_organize_the_kazakhs: "Організувати казахів"
 DRL_organize_the_kazakhs_desc: "У Бригаді є не лише німці й росіяни.\n\nДірлеванґер учинив незліченні звірства проти багатьох народів, зокрема поляків і казахів. Вони напевне прагнуть помсти не менше за нас. Якщо правильно до них підійти й ретельно пояснити план, вони приєднаються.\n\nІ коли настане час, із Дірлеванґером залишиться ще менше людей."

 DRL_pay_the_mercenaries: "Заплатити найманцям"
 DRL_pay_the_mercenaries_desc: "Дірлеванґер купив найманців. Молодець.\n\nТа він не врахував однієї дуже важливої обставини: якщо людину можна грішми змусити вбивати й грабувати, її можна й змусити встромити ніж у спину тим самим людям, що за це платили. Ми запропонуємо найманцям більше - грошима або здобиччю, яку вони зможуть забрати, - й забезпечимо їхню вірність.\n\nА отже, Дірлеванґер опиниться в іще глибшій ізоляції."

 DRL_poison_the_germans: "Отруїти німців"
 DRL_poison_the_germans_desc: "Найвірніші Дірлеванґерові - німці, що йшли за ним аж від самого Райху.\n\nВони ж відповідальні за наймерзенніші злочини проти нашого народу, тож із ними треба розправитися. Зробимо це обережно: дочекаємося завершення наступного рейду й отруїмо все спиртне, яке вони награбують.\n\nПомираючи в муках, вони відчують бодай крихітну частку того, що заподіяли Росії, а ми водночас усунемо останню, вирішальну перепону на шляху до самого Дірлеванґера."

 DRL_kill_the_scum: "Убити наволоч"
 DRL_kill_the_scum_desc: "Час Дірлеванґерові помирати.\n\nРосіяни, казахи й найманці - всі його покинули. Найвірніші німці померли. Ніщо й ніхто його не захищає. Легка ціль, як ті, про напади на які він так часто говорить у гонитві за легкою здобиччю.\n\nЧас йому дізнатися, як це відчувається."

#Below here seem to be deprecated?
 DRL_galvanize_soldiers: "Підбадьорити солдатів"
 DRL_galvanize_soldiers_desc: "«Переговори»? Ха! Той комуніст із млявим хуєм, Лисенко, радше здохне від рук юрби смердючих селян під своєю гірською халупою, ніж дасть нам справедливу частку бодай чогось! Та й нащо Райхові взагалі такі виродки? Ми й раніше чудово давали собі раду, особливо без слов'янських варварів, що плутаються під ногами.\n\nА втім, кожен зайвий ствол, спрямований на наших хлопців, - це на фунт менше здобичі з Уралу, а таких стволів буде значно більше, ніж якби ми мали орду червоних, що змушувала б селян озиратися, поки ми блискавично б'ємо в лоб. То, може, нехай побільше потренуються, ніж зазвичай, щоб знати, чого чекати, га?"

 DRL_refocus_strategy: "Змінити спрямування стратегії"
 DRL_refocus_strategy_desc: "Ми вже точно останні, хто став би теревенити про «порядок», «протокол» і всю ту попівську хуйовину. Бригаді до цього байдуже; та багато наших людей саме від цього й утекли до нас! І з якого дива мало б бути не байдуже? Дірлеванґерові виродки процвітають у кривавому, екстатичному хаосі, що розгулявся на півдні Уралу, - приборкувати його мало б бути все одно що відрубати собі ногу, аби поїсти взимку м'яса.\n\nЗауважте: мало б. Бо ось у чому річ: поводитися як цілковиті звірі теж не надто весело. Орді голодних псів, якою є Бригада, важливо мати спосіб не перетворюватися після рейду на сварливе місиво. Хоч деінде стандарти й безсилі, тут вони можуть дати найбільший ефект: кожен знає, що матиме частку, тож різати своїх «союзників» означає лише лишитися без неї. Цей урок люди охоче засвоять... а ні, то начувайтеся."

 DRL_reaffirm_duty: "Нагадати про обов'язок"
 DRL_reaffirm_duty_desc: "Ми дізналися, що дехто з наших людей... ні, для них це надто добре слово. Деякі з цих шматків бруду, не гідні бути навіть послідом своїх матерів-повій, дезертирують із постів. Ми впіймали одного такого, і за мить до того, як йому винесли мізки, але вже після того, як відрізали пальці, він розповів, що серед частини рядових назріває загальне невдоволення. Ці невдячні гівняні плями незадоволені керівництвом Дірлеванґера та його довірених підлеглих. Вони повільно помиратимуть на очах у всіх, але ширша проблема залишається. Ми не можемо перебити всіх, хто в нас сумнівається, хоч це напевне було б приємніше. Ні, доведеться вдатися до значно менш цікавої тактики: купувати їхню вірність. Частіші рейди дадуть більше здобичі для розподілу, а якщо декотрі з цих Хом невірних при цьому загинуть, то й поготів добре."

 DRL_truck_upgrade: "Удосконалити вантажівки"
 DRL_truck_upgrade_desc: "Як відомо майже кожному, будь-яка банда, що себе поважає, неодмінно мусить мати достатньо скакунів, щоб було на чому їздити. На наше лихо, у суворих умовах цих клятих крижаних гір коні просто непрактичні. Знаємо, бо вже пробували, та без успіху. Але якщо звичайні коні не годяться, завжди можна звернутися по допомогу до чудес техніки! Саме так, наші скакуни будуть металевими й замість сіна їстимуть пальне, возячи нас від містечка до містечка в наших веселих «пригодах». Залишається одна невеличка проблема: усі вантажівки вже старіють, а розводити їх ми теж не вміємо... Втім, це легко виправити, трохи засукавши рукави! Так, засукавши рукави - а в цьому випадку це означає наставити пістолета до голови того нещасного виродка, якого цього місяця призначили на обслуговування, - і невдовзі ми ганятимемо півднем Уралу з рекордною швидкістю."

 DRL_raid_harder: "Лютіші рейди"
 DRL_raid_harder_desc: "ЩО ЦЕ, БЛЯДЬ, БУЛО ЗА ХУЙНЯ!? Називаєте себе бандитами, а поводитеся як йобані старі діви! Якби Ганс не прибув із підкріпленням, ви, сучі сини, усі були б мертві, і за таке жалюгідне видовище ви цього заслужили. Думаєте, після такого маєте право на якусь здобич? Помиляєтеся. Ви, посміховиська, заслуговуєте на кулю у свої товсті, тупі черепи, якщо швидко не візьметеся за розум. Ми витрачаємо на вас, черви, їжу й набої, і так ви віддячуєте командирам? У наступному рейді я краще б побачив, бляха, якісь результати, я серйозно. Хочу бачити хати, розмальовані кров'ю та полум'ям, і сиріт, що верещать від страху. Думаєте, ми проживемо місяць, якщо Ліга вирішить, що ми розніжилися? Думаєте, той хуй у горах і далі постачатиме нам добрий товар, якщо вважатиме, що ми його марнуємо? Мабуть, ви вірите і в це, і ще в тисячу казок, судячи з вашої тупости. Геть із моїх очей, і наступного разу дайте, блядь, результат!"

 DRL_support_units: "Підрозділи підтримки"
 DRL_support_units_desc: "Досі загальний брак тактичної підтримки не заважав нам вибивати все лайно з наших звичних цілей. Досі. Однак такі дрібні призи нас уже не дуже цікавлять. Брати більші містечка й навіть міста зі справжньою обороною за нинішньої розхристаної структури Бригади не вдасться. Треба пошукати й роздобути біноклі, медичне спорядження та інженерні інструменти. Вороги, звісно, недооцінюватимуть нас, думаючи, що ми не здатні битися з ними на рівних. Ми піднесемо їм неприємний сюрприз."

 DRL_better_guns: "Краща зброя"
 DRL_better_guns_desc: "У цих краях зброя - найближча супутниця чоловіка, ближча, ніж будь-яка жінка могла б сподіватися стати. Ми вірно носимо свої рушниці ще від Західноросійської війни, коли ті уйобки з Ґерманії нас покинули. Що ж, десятиліття користування тією самою зброєю, здебільшого застарілою ще тоді, коли нас кинули напризволяще, породжує неабияке бажання чогось нового й свіжого. Боляче визнавати, та нинішня зброя вже не годиться. Проте вона заслуговує кращої долі, ніж брухт. Як компроміс сам Дірлеванґер запропонував залишити старі знаряддя веселощів і втіх на пам'ять, а нове спорядження купити через наші зв'язки. Кращою за зброю може бути лише нова зброя."

 DRL_use_the_prisoners: "Використати полонених"
 DRL_use_the_prisoners_desc: "Вороги завжди обмовляють нас, називаючи жорстокими вбивцями й божевільними різниками, але це просто неправда. Насправді на доказ у нас є цілий лабіринт кліток, повних цілком живих людей. Звісно, зазвичай ми страчували їх для розваги, коли більше не було чого робити, але суть незмінна: ми беремо полонених. Насправді їх стало значно більше, відколи наказали за можливости не марнувати набоїв у дрібних рейдах, і тепер постало питання, що, в біса, робити з цими людьми. Після ночі запійного пияцтва й бурхливих академічних дискусій ми, здається, знайшли розв'язок. Поставити їх до роботи! Якщо вони можуть звільнити декого з наших хлопців від ручної праці й прикривати на полі бою, то що більше їх, то веселіше, кажемо ми. Якщо хтось протримається кілька тижнів, можливо, його навіть буде варто офіційно прийняти до лав. Усі виграють!"

 DRL_on_all_sides: "З усіх боків"
 DRL_on_all_sides_desc: "Минуло близько десяти років, відколи верховне командування нас підло наїбало. Якби ми колись повернулися, що б ми з тими виродками зробили... Та зараз маємо важливіші клопоти, ніж мрії про солодку помсту. Насправді багато клопотів, що тримають нас у клітці під назвою Росія. Чи то слов'янські пси на півночі, чи степові пси на півдні - покручі намагаються вдарити з усіх боків. Щоправда, вони добре знають, якого болю ми здатні завдати, тому здебільшого обмежуються рейдами у відповідь, хоча ніколи й не досягали наших успіхів. Колись наші амбіції теж не сягали далі, але останнім часом Дірлеванґер натякає на бажання взятися за щось більше, та зрештою це ще тільки балачки. Поки що."

 DRL_reaffirm_dirly_power: "Підтвердити владу Дірлеванґера"
 DRL_reaffirm_dirly_power_desc: "Для людей цієї Бригади Оскар Дірлеванґер - найближче до бога, без жодних застережень і обмежень. Байдуже, що хтось каже, ніби він надто старий, п'яниця чи навіть божевільний. НЕ ставте його влади під сумнів, якщо хочете вижити. Дехто серед нас, здається, забуває цей дуже простий закон. Думають, що знають краще; уявляють, ніби керувати мають вони, а найкращі часи Дірлеванґера вже позаду. Вони скоро дізнаються правду. Дірлеванґер не вижив би на чолі розхваленого штрафного батальйону, що став бандитською армією, якби не знав, коли хльоснути батогом, і зараз хльосне сильно. Ми виберемо найнепокірніших офіцерів, людей, яких висувають, так би мовити, претендентами на командування, з криками витягнемо їх із ліжок і повибиваємо мізки, щоб усі знали наслідки навіть самої думки про заколот."

 DRL_maintain_order: "Підтримувати порядок"
 DRL_maintain_order_desc: "Бригада - строкате зборище колишніх каторжників, що стали німецькими солдатами, а потім бандитами, і покидьків півдня Уралу, яким теж немає місця в «цивілізованому» суспільстві. Коротше кажучи, це йобані звірі, і, як звірі, вони потребують постійного нагляду, щоб не зірватися з ланцюга. Дірлеванґер воліє тримати всіх у напрузі: якщо за непослух померти ймовірніше, ніж у бою, то не послухатися ти не наважишся. Принаймні так він каже, коли досить тверезий, щоб узагалі зв'язно говорити. Та хтось колись сказав, що на мед упіймаєш більше мух, і, можливо, мав рацію. Може, хлопцям пішла б на користь одна-дві підбадьорливі промови. Розкажіть про здобич, наркотики й жінок, яких вони матимуть, якщо тільки триматимуться нас, і, може, ми зможемо тягти все це далі якомога довше."

 ### Events ###
 DRL.01.t: "Бригада Дірлеванґера"
 DRL.01.desc: "36-та ваффен-гренадерська дивізія СС, більш відома як Бригада Дірлеванґера, а нині - Чорні бандити, безперечно належить до найлиховісніших формувань, які будь-коли існували.\n\nСформована зі злочинців, божевільних, коляборантів і всіх, хто був настільки нелюдом, щоб приєднатися, вона спочатку призначалася для боротьби з повстанцями й швидко здобула таку варварську репутацію, що навіть інші частини СС воліли не мати з нею справ.\n\nПісля Західноросійської війни та провалу очоленої СС спроби заколоту Гіммлера Бригада втекла за східні кордони Райху, випередивши частини Вермахту, які Шпайдель послав її роззброїти. Осівши довкола Орска, Бригада заснувала хижу бандитську «державу», яка відтоді тероризує й жорстоко мучить людей Південного Уралу заради грабунку, використовуючи німецьке спорядження та вишкіл для здобуття вирішальної переваги.\n\nНенависна й страхітлива для всіх довкола, Бригада має три основні цілі: здобувати здобич і награбоване рейдами на сусідів, утвердити свою зверхність у регіоні та, зрештою, цілковито розорити місто Орєнбурґ.\n\nЗ огляду на хаос у Росії загалом і на Південному Уралі зокрема, їй цілком може це вдатися, якщо тільки хтось із ворогів не знайде способу її зупинити..."
 DRL.01.a: "Russenblut soll spritzen."

 DRL.50.t: "Пограбування Орєнбурґа"
 DRL.50.desc: "Орєнбурґ нарешті впав.\n\nНаші люди лютують на вулицях, грабуючи все, що знаходять, забираючи кожну побачену жінку й убиваючи кожного, хто чинить бодай найменший спротив. Різанина майже тотальна: десятки тисяч загинули від наших рук, ще тисячі напевне помруть від холоду чи голоду, а інші розсіялися селами й селищами, яких ми ще не зачепили, - але ненадовго.\n\nПоки казахські вершники Бригади наздоганяють і топчуть оборонців, що тікають, а з розграбованого міста течуть ріки крови, всі дізнаються неминучу долю тих, хто надумав відмовити нам у трофеях! І всі також знатимуть, що на цьому ми не зупинимося. Уся Росія спливе кров'ю, перш ніж ми закінчимо!\n\nЗа здобич! За Бригаду! За Дірлеванґера!"
 DRL.50.a: "Увесь світ чекає, щоб ми його забрали!"

 #Here Lies Old Dirly Death Events 2018-2019
 DRL.162.t: "Зрада Чорної Гори"
 DRL.162.desc: "Спочатку зустріч із тими гірськими потворами мала оптимістичний тон. Дірлеванґер отримав запрошення, особисто написане Лисенком, нашвидкуруч накарлякане німецькою на пергаменті з бурими плямами. Звісно, Дірлеванґер бачив цей фарс наскрізь і вирішив потішити божевільного науковця своєю присутністю. Спершу зустріч здавалася приязною за уральськими мірками: самотній стіл серед тундри й загадкове м'ясо, що диміло над скромним багаттям. Навіть люди Лисенка були люб'язні, пропонували розмову й удавано всміхалися. Та все змінилося в одну мить, коли скажені Лисенкові пси виплеснули лють на Бригаду. Серед стрілянини й хаосу Дірлеванґер устиг пірнути в кабіну бригадної вантажівки й під прикриттям вогню товаришів утік неушкодженим. Уся Бригада зітхнула з полегшенням, коли він повернувся єдиним, хто пережив цей жахливий акт підступности. Одне ясно: стосунки між тими божевільними горянами й нашою Бригадою різко погіршилися."
 DRL.162.a: "Знову перехитрили!"

 DRL.200.t: "Кількох проґавив"
 DRL.200.desc: "Оскара Дірлеванґера, ватажка сумнозвісної Бригади Дірлеванґера, вчора вбила партизанська група. Коли він їхав на зустріч із Лисенком, невеликий загін партизанів із колишніх енкаведистів влаштував засідку на нього та його людей, убивши самого Дірлеванґера й кількох членів Бригади.\n\nХоч Бригада й помстилася селу, де це сталося, без Дірлеванґера на чолі вона майже розпалася. Різні фракції вже почали відколюватися, щоб тероризувати Урал, хоча навряд чи будь-де в Росії вони знайдуть пощаду."
 DRL.200.a: "Гідний кінець того безумця."

 DRL.201.t: "Випробувати ворогів"
 DRL.201.d: "Зусилля Дірлеванґера та старших офіцерів Бригади з підготовки наступного великого рейду увінчалися успіхом.\n\nСпорядження підготовано, плани складено, людей приведено в готовність, причому внутрішні чвари навмисно заохочували, щоб розпалити лютість і жагу крови. Лишається тільки вирішити, куди вдарити, і на розгляд подано три варіянти.\n\nПерший, найамбітніший, - ударити по землях довкола Орєнбурґа, поклавшись на раптовість і майстерність, щоб подолати оборону й розбити їхню ілюзію сили. Друга, очевидніша ціль - поселення, пов'язані з Уральською Лігою. Ми воюємо з Лігою майже безперервно, і удар по її бойовому духу та ресурсах дуже допоміг би надалі.\n\nНарешті, третій варіянт: Лисенко повідомив, що його сили не втручатимуться, якщо ми здійснимо рейд на селянські громади на його території. Мабуть, він бачить у цьому нагоду отримати бажаних полонених, не викликаючи заворушень проти себе. Навряд чи вони зможуть чинити справжній опір, але незрозуміло, чи багато з них можна взяти.\n\nТа хай там як, рішення треба ухвалити."
 DRL.201.a: "Кого б ми не обрали, він упаде!"

 DRL.202.t: "Удар по Орєнбурґу"
 DRL.202.d: "Дірлеванґер вирішив: Бригада рушає на Орєнбурґ.\n\nНе на саме місто - до цього ми ще не зовсім готові, - а на містечко одразу за кордоном. Мета рейду, звісно, не лише захопити все багатство й полонених, яких містечко може дати, а й перевірити загальну обороноздатність усієї держави.\n\nОчікується, що хоча окрема комуна, як-от це містечко, може чинити сильний спротив, притаманний анархізмові хаос завадить вчасно отримати підкріплення. Побачимо.\n\nХай там як, обіцянка крови й грабунку загалом розпалила людей: вони з нетерпінням чекають майбутньої битви й неминучого поділу здобичі після неї."
 DRL.202.a: "Готуй людей!"

 DRL.203.t: "Удар по Орєнбурґу - рейд удався!"
 DRL.203.d: "Наш рейд на Орєнбурґ, як і сподівалися, увінчався цілковитим успіхом.\n\nПід покровом ночі наші люди підійшли до містечка з кількох боків, створюючи перехресні сектори обстрілу й водночас перекриваючи всі шляхи втечі. Невеликий загін відволік ополченців-оборонців і виманив їх з облаштованих позицій, а коли мети було досягнуто, наші основні сили під командуванням самого Дірлеванґера вдарили із засідки.\n\nБитва була короткою: ополченців швидко здолали й вирізали, а козацькі та казахські вершники Бригади перебили тих нечисленних, хто спробував утекти. Потім і їхня увага, і увага решти війська звернулася на саме містечко.\n\nУсе цінне захопили, взяли багато полонених для торгівлі чи особистих розваг, а також здобули розвіддані про розташування сил інших комун. Закінчивши, тих мешканців, яких визнали надто старими, малими, хворими або з інших причин не вартими клопоту з перевезенням, зігнали до ратуші й підпалили її разом із рештою поселення.\n\nУсіх цілей Бригади досягнуто: здобич, різанина, полонені й терор. Із поширенням звістки про цей рейд наша страхітлива слава лише зростатиме."
 DRL.203.a: "Вогонь чи Лисенко - яка доля гірша?"

 DRL.204.t: "Удар по Орєнбурґу - рейд провалився!"
 DRL.204.d: "Було відомо, що напад на Орєнбурґ ризикований, і цього разу ризик виявився завеликим. Напад Бригади провалився. Цілковито.\n\nДесь сталася помилка, через яку комуна якось довідалася про наш майбутній рейд і ще до нашого прибуття змогла отримати значне підкріплення. Спроби відволікти ворога й улаштувати засідку геть не вдалися, а коли основні сили вийшли з укриття, їх одразу зустріли заздалегідь пристріляні кулемети та перехресний вогонь.\n\nПольовий командир, очевидно охоплений люттю, наказав наступати далі, і хоча наші люди зрештою прорвали зовнішню оборону комуни, вони зазнали жахливих втрат, а невдовзі їх розгромили додаткові сили ополчення, укріплені в самому містечку. Можливо, знаючи, що ми готували їм у разі перемоги, втекти дозволили дуже небагатьом: більшість розстріляли під час відступу.\n\nСам Дірлеванґер розлючений і наказав розстріляти командира, який віддав наказ наступати, разом з усіма його старшими підлеглими, що вижили.\n\nБригада з часом зможе відновити людей і спорядження, та ще невідомо, чи зможемо ми виправити шкоду, якої ця невдача завдала нашій страхітливій славі."
 DRL.204.a: "Безперечна поразка."

 DRL.205.t: "Удар по Уральській Лізі"
 DRL.205.d: "Дірлеванґер вирішив: Бригада рушає на Уральську Лігу.\n\nЛіга давно є нашим найзатятішим ворогом, і чимало наших людей свого часу втрачали товаришів у боях із нею, тож будь-яка дія їй на шкоду викликає великий запал. А шкода вже близько: розвідники знайшли чудову ціль - зайняту в'язницю, де Уральська гвардія навчає новобранців ополчення методів оборони сіл.\n\nГвардія завжди б'ється рішуче, а інструктори й старші кадри у в'язниці, без сумніву, битимуться ще завзятіше, проте такої нагоди не можна іґнорувати. Вбивши новобранців, ми не лише вдаримо по бойовому духу рядових, а й, можливо, відіб'ємо в інших бажання вступати до них. До того ж наші люди і здобудуть чудовий бойовий досвід, і вдосконалять способи штурму укріплень та об'єктів Ліги.\n\nРейд незабаром почнеться. До перемоги!"
 DRL.205.a: "Ми вдиратимемося ДО в'язниці?"

 DRL.206.t: "Удар по Уральській Лізі - рейд удався!"
 DRL.206.d: "Багатьом у Бригаді думка про напад на в'язницю здавалася іронічною, та все ж вони взялися до справи з майстерністю й рішучістю, завдяки яким нас бояться по всьому Південному Уралу.\n\nГлупої ночі фахівці з проникнення, колишні члени Ваффен-СС, увійшли через в'язничну каналізацію й узгодили свій удар із нападом наших основних сил ззовні. Атаковану і зсередини, і ззовні Уральську гвардію швидко здолали; багато хто навіть не встиг дістатися до зброї.\n\nХоч ми й перемогли, схоже, Гвардія передбачила навіть такий випадок: просуваючись у фортецю, наші люди знаходили покинуті оборонні позиції та свідчення існування кількох шляхів утечі. Шляхів, якими скористалися, щойно наша перемога стала очевидною.\n\nУнаслідок цього ми завдали Гвардії значно менших втрат, ніж сподівалися, проте захопили і базу, і розташовані в ній арсенали. Ми також довели, що навіть наймогутніші фортеці Гвардії не захищені від нас.\n\nЩоб це підкреслити, Дірлеванґер наказав здерти шкіру з нечисленних узятих полонених і повісити їх на мурах, після чого ми підпалили будівлі й відступили із захопленими трофеями. Ми довели своє.\n\nПоки що."
 DRL.206.a: "Гвардія не непереможна."

 DRL.207.t: "Удар по Уральській Лізі - рейд провалився!"
 DRL.207.d: "Хоч ми ще не маємо всіх відомостей, ситуація ясна: наш удар по Уральській Лізі не досяг своїх цілей. Цілковито.\n\nЗа всіма свідченнями, спочатку напад удавався: колишні фахівці Ваффен-СС із проникнення увійшли до в'язниці й узгодили свій удар по ґарнізону з нашим основним нападом. Однак вони не встигли захопити ключові пункти, зокрема радіорубку й арсенал, перш ніж оборонці закріпилися.\n\nТому напад перетворився на криваву бійню: кожну позицію наші сили брали лише після жорстокого ближнього бою. Технічно ми таки «перемогли», захопивши фортецю після багатьох годин і жахливих втрат, та навряд чи це можна назвати перемогою.\n\nБагато наших найкращих людей загинуло, все цінне було витрачено чи знищено в бою, а історія про «хоробрість» Гвардії перед нашим нападом уже шириться й, без сумніву, надихне на запеклий спротив деінде. За цей провал буде, мусить бути, розплата.\n\nДірлеванґер про це подбає."
 DRL.207.a: "Нових смертей точно не уникнути."

 DRL.208.t: "Удар по селянах"
 DRL.208.d: "Дірлеванґер вирішив: Бригада рушить на селянські поселення довкола Маґнітоґорска.\n\nЦе не надто небезпечний чи прибутковий ворог, тож звичної для рейду аґресії та завзяття в наших людях не розпалює, проте ніхто не може й не посміє заперечити, що це безпечний вибір.\n\nКрім самих людей, забрати із сіл буде небагато чого, та принаймні вони дадуть непогану розвагу й дозволять обійтися без тривалого планування. Лисенко вже повідомив, що його сили не втручатимуться, тож нам треба буде зважати лише на жалюгідне ополчення, яке села спробують зібрати.\n\nЧас узятися до кривавої, а подекуди й одноманітної роботи - вбивати тих, хто не може дати відсіч."
 DRL.208.a: "Безпечний вибір."

 DRL.209.t: "Удар по селянах - рейд удався!"
 DRL.209.d: "Як і очікувалося - саму думку про інший результат було б смішно розглядати, - наш рейд на маґнітоґорських селян увінчався повним успіхом.\n\nКілька обраних сіл, покинутих їхнім нібито захисником Лисенком, не мали жодного шансу: тих небагатьох чоловіків, яким вистачило сміливости взятися за зброю, вбили майже на місці. Бригада налетіла на них, мов сарана, часто звичайною юрбою й без жодної справжньої тактики, бо та була непотрібна.\n\nУсе цінне, хоч його й було мало, захопили, а мешканців сіл розсортували. Здорових чоловіків і жінок, принаймні тих жінок, що лишилися здоровими після наших людей, повантажили для перевезення на Чорну Гору, а визнаних непридатними вирізали. Дітей залишимо собі: нові рекрути, вразливі до впливу через юний вік, потрібні завжди.\n\nХоч великою перемогою цей рейд не назвеш і згодом про нього, мабуть, забудуть, принаймні можемо сказати, що отримали зиск, а для Бригади це завжди головна мета."
 DRL.209.a: "Саме як очікували."

 DRL.210.t: "Удар по селянах - рейд провалився!" ###unused event feel free to use the loc and event number
 DRL.210.d: "Ми й гадки не маємо, як усе пішло шкереберть. Послали найжорстокіших виродків, яких тільки бачив світ, проти простих селян в одному з найнепримітніших сіл Росії, а нас усе одно якось відбили. Командири вперше навіть не сперечаються, хто винен: усі приголомшені й не розуміють, як це взагалі сталося. Єдине, в чому ми певні: як для простих селян, село було дивно добре озброєне, а декотрі селяни - дивно добре навчені володіти незвичною зброєю. Через це виникли припущення, що Лисенко порушив угоду й справді допоміг селу, намагаючись так показати нам свою силу. Проте після поразки доказів у нас немає, а Дірлеванґер не хоче наполягати на підозрах, поки ще існують Уральська Ліга й Орєнбурґ. Наразі мусимо просто зализати рани й готуватися до наступного разу."

 DRL.211.t: "Битва за Новотроіцк"
 DRL.211.d: "Попри всі перемоги над Уральською Лігою, її Гвардією та іншими організаціями, ми досі не здобули вирішальної перемоги. Такої, що дала б нам перевагу у великому масштабі. Зараз це зміниться.\n\nРозвідники Бригади доповіли, що Уральська гвардія зосередила великі сили навколо промислового містечка Новотроіцк, без сумніву, щоб захищати видобуток тамтешніх рідкісних і надзвичайно цінних комплексних руд. Руд, безперечно життєво важливих для Ліги і у власному військовому виробництві, і в торгівлі задля придбання того, чого вона не може виробляти сама.\n\nМи мусимо отримати цей приз і водночас позбавити його їх. Битва буде кривавою й важкою, проти одних із найкращих бійців Уральської Ліги, але винагорода того варта. Сам Дірлеванґер так вважає, а зрештою саме це й важливо.\n\nМи підготуємо план, вступимо в бій із Гвардією, а коли вона впаде, накинемося на Новотроіцк і заберемо все, що він має!"
 DRL.211.a: "Готуй людей!"

 DRL.212.t: "Битва за Новотроіцк - околиці"
 DRL.212.d: "Битва за Новотроіцк почалася, коли наші формування підійшли під прикриттям ранкового туману й почали артилерійський обстріл зовнішніх позицій Уральської гвардії.\n\nЗ огляду на важливість битви Дірлеванґер дозволив використати важке озброєння й резерви боєприпасів, яких зазвичай не чіпали, тож хвиля за хвилею на ворога обрушувався обстріл, якого він, ми знали, не чекав. Коли за три години він скінчився, стало ясно, що оборонців суттєво ослаблено. І тоді вперед послали наших людей.\n\nЗовнішні оборонні споруди швидко захопили, але наступ на передмістя Новотроіцка зустрів сильніший спротив: кулеметний вогонь із підготованих позицій сповільнив просування. Дірлеванґер, особисто перебуваючи на полі бою, наказав поставити димові завіси, поки вогнеметні групи успішно випалювали кулеметні гнізда.\n\nХоч надійно зайняти решту околиць вдалося лише за кілька годин, результат був неминучий, і командний пункт Бригади перенесли вперед в очікуванні наступного кидка - у промислові райони попереду."
 DRL.212.a: "День обіцяє бути вдалим."

 DRL.213.t: "Битва за Новотроіцк - промисловий район"
 DRL.213.d: "Наступ у промислові райони Новотроіцка був украй важливим: як Бригада часто дізнавалася собі на лють, Уральська гвардія радше знищить своє майно, ніж дозволить нам забрати його як трофеї.\n\nТому, щойно закріпилися на околицях, ми почали просування в район, використовуючи набраний темп. На жаль, швидка перемога нам не дісталася, і жорстокі бої, часто зблизька, а інколи й рукопашні, тривали весь пополудень і до ночі. Поруч лунали вибухи - ми знали, що це працюють диверсійні групи Гвардії.\n\nКоли наступного ранку зійшло сонце, Дірлеванґер, розлючений утратою цінної здобичі, наказав почати загальний штурм, і настав іще один довгий день ближнього бою. Та цей день зрештою приніс перемогу.\n\nБригада захопила район, але дорогою ціною, і велика його частина лежить у руїнах. Та перемога є перемога, і нею треба скористатися. Остання частина Новотроіцка, яку лишилося взяти, - центр, і ми рушаємо туди.\n\nНегайно."
 DRL.213.a: "Хлопці відірвалися на повну."

 DRL.214.t: "Битва за Новотроіцк - центр міста"
 DRL.214.d: "На світанку, діючи зі своїх позицій у передмістях і промислових зонах, Бригада почала останній наступ на центр Новотроіцка, покликаний остаточно зламати спротив Уральської гвардії.\n\nСнайперським і артилерійським вогнем наші сили зривали спроби Гвардії евакуювати цивільних, забезпечуючи майбутніх полонених і водночас створюючи перешкоди самій Гвардії. Це відволікання також дозволило частинам підійти ближче під слабшим вогнем, тож останній штурм почався з вигіднішої тактичної позиції.\n\nПопри це, Гвардія опиралася люто, і ближній бій за кожну кімнату став звичним, поки ми наближалися до самої ратуші. Коли набої вичерпувалися, рушниці й пістолети-кулемети ставали дрюками, а уламки - саморобною зброєю. Попри безнадійне становище Гвардії, оборона була настільки рішучою, що на її злам пішло ще два дні.\n\nТа зламати її вдалося. Останнім ривком наш штурмовий підрозділ увірвався до командного пункту Гвардії в ратуші й перебив офіцерів усередині. Незабаром організована оборона розвалилася, а коли над ратушею розгорнули прапор Бригади, залунали гучні радісні вигуки.\n\nМи безперечно заслужили цю перемогу - тепер час нею насолодитися!"
 DRL.214.a: "Перемога наша!"

 DRL.215.t: "Битва за Новотроіцк - перемога"
 DRL.215.d: "Битва за Новотроіцк скінчилася, і Бригада знову вийшла переможницею.\n\nКоли останні позиції Уральської гвардії захопили, а тих нечисленних дурнів, що спробували здатися, розстріляли на місці, почалася розправа. Новотроіцк, може, й більший за поселення, які Бригада зазвичай грабує, і людей тут значно більше, але порядок дій той самий, а наші люди дуже, дуже досвідчені в його виконанні.\n\nУсіх цивільних, які допомагали Гвардії, негайно розстріляли разом із родинами. Найдужчих із решти зібрали разом, готуючи до перевезення в табори примусової праці - у самому містечку чи на інших наших територіях. У будівлях спочатку перевертали все догори дриґом у пошуках цінностей, а потім спалювали їх для перестороги. Жінок викрадали гуртом.\n\nУ центрі міста сам Дірлеванґер виголосив радісну промову з балкона над багаттям, до якого кидали трупи Уральської гвардії. Цінності й ресурси міста стануть великою підмогою Бригаді, та піднесення бойового духу може виявитися ще більшою винагородою."
 DRL.215.a: "Гвардії слід було сидіти у своїх фортецях."

 DRL.216.t: "Битва за Новотроіцк - поразка"
 DRL.216.d: "Попри всі зусилля з планування, підготовки та проведення нападу на Новотроіцк, Уральська гвардія завдала Бригаді поразки.\n\nНаші люди билися мов одержимі й захопили значну частину міста, та спротив виявився надто сильним, і, виснажившись, вони стали вразливі до контратаки. Контратаки, яку Гвардія провела за першої ж нагоди.\n\nТреба віддати їм належне: люди трималися, завдаючи тяжких втрат у жорстокому ближньому бою, але зрештою мусили відступити, щоб уникнути цілковитого знищення. Проте поразка не тотальна: місто й видобувні споруди навколо майже знищені, що надовго завадить їхнім воєнним зусиллям.\n\nТа це не та перемога, якої ми хотіли. Якої заслужили. І тепер мусимо повертатися до Орска в найжахливішому стані - з порожніми руками."
 DRL.216.a: "Криваво й зрештою безглуздо."

 DRL.217.t: "Другий етап"
 DRL.217.d: "Цього дня ми чекали справді дуже довго.\n\nПоразка Уральської гвардії під Новотроіцком залишила її, принаймні поки що, розпорошеною й дезорганізованою, нездатною до дієвої оборони чи контратаки. Тож землі, які вона нібито захищає, особливо вздовж кордонів, цілком відкриті для грабунку Бригади, і ми їх пограбуємо!\n\nОкрім багатства, жінок, полонених та інших цінностей, Дірлеванґер з офіцерами окремо наказали захоплювати все знайдене військове спорядження. Зрештою нам доведеться зіткнутися з тим безумцем Лисенком, а укріплення Гвардії містять багато всього, зокрема важку зброю та артилерію, що допоможе нам, коли той день настане.\n\nКрім того, інші припаси, які ми захопимо, особливо харчі з численних ферм, що лишилися так само без захисту, дозволять і поповнити виснажені запаси, і створити стратегічний резерв.\n\nРезерв, що підтримуватиме нас певний час. Справи й справді йдуть угору."
 DRL.217.a: "Забирайте все!"

 DRL.218.t: "Другий великий рейд"
 DRL.218.d: "Перемога породжує самовдоволення, і Бригада не виняток. Нашим людям, загартованим і вправним, набридають дрібні рейди останніх днів. Знуджені рейдери небезпечні і для друзів, і для ворогів, і офіцери добре це розуміють.\n\nТому вирішено здійснити другий великий рейд і здобути багато нового награбованого! І, як раніше, офіцери мають обрати з трьох основних варіянтів.\n\nОрєнбурґ, як завжди, - головний приз Уралу, переповнений полоненими, багатством і всілякими «розвагами». Наші люди весь час говорять про нього, часто пошепки, і радо вхопилися б за нагоду знову туди рушити.\n\nДруга група цілей лежить у землях Уральської Ліги. Хоч вони й не такі багаті, жодна сила в регіоні не викликає в наших людей стільки ненависти, як Ліга та її Гвардія, і ця жага помсти неодмінно підштовхне Бригаду до нових вершин аґресії й різанини.\n\nНарешті, третій варіянт, безумовно найамбітніший: запропоновано вдарити і по Орєнбурґу, і по Уральській Лізі. Це було б, м'яко кажучи, важко й дуже ризиковано, але винагорода - і здобиччю, і страхітливою славою та розголосом - була б величезною, та ще й ослабила б обох ворогів."
 DRL.218.a: "Збудження наростає."

 DRL.219.t: "Виманити Гвардію"
 DRL.219.d: "Уральська гвардія, яку селяни по всьому Південному Уралі, навіть далеко за межами Ліги, славлять як героїв, надто вже зазналася. Щоразу, коли наші люди входять на її територію, вона з'являється нам назустріч і б'ється з несхитною завзятістю. Та час показати людям, що Гвардія не непереможна й ніхто не здатен захистити їх від нас.\n\nМи здійснимо низку рейдів на їхні землі, щоб, якщо вони хочуть зберегти славу захисників, виманити їхні боягузливі ґарнізони з фортець на відкриту місцевість. Туди, де вони будуть вразливі до нападу.\n\nВиберемо час і місце, а тоді, коли вони опиняться саме там, де нам треба, вдаримо з усіх боків і виріжемо до останнього. Здатися не запропонуємо й капітуляції не приймемо, а коли люди побачать залишені тіла, то зрозуміють, що вони справді самі."
 DRL.219.a: "Героїзмові не місце в цих землях."

 DRL.220.t: "Вимагати подвоїти - Лисенко надсилає половину"
 DRL.220.d: "Лисенко, той потвора, отримав нашу вимогу подвійної оплати за останню групу полонених. І відмовив.\n\nУ відповіді, доставленій офіцером НКВД із дуже невдоволеним виглядом, докладно викладено відмову й попереджено, що будь-які подальші спроби «донести» до нього силу нашого становища можуть остаточно покласти край установленій домовленості.\n\nПринаймні йому вистачило розуму збагнути, що залишити нас із порожніми руками було б тяжкою помилкою, тож він надіслав половину початково погодженої оплати. Лисенко ще корисний нам, та нехай не сумнівається: ми невдоволені.\n\nІ цієї образи не забудемо."
 DRL.220.a: "Ми ризикнули й програли."

 DRL.250.t: "Відправити живий товар"
 DRL.250.d: "У своїй основі угода між Бригадою та Лисенком проста.\n\nМи передаємо якомога більше полонених, захоплених у численних рейдах як головна мета чи побічний трофей, для всіх божевільних експериментів, які він для них задумав. Натомість він передає нашим силам частину передового військового спорядження й інших технічних чудес Чорної Гори.\n\nЧесними наших людей не назвеш, але більшість цією домовленістю задоволена. Дехто, проте, скаржиться. І не без причини. Кажуть, що всю роботу робимо ми й усіх втрат зазнаємо ми, а хитрий Лисенко сидить на своїй горі в безпеці зі своїми таємницями. Кажуть, що ми заслуговуємо більшого шматка пирога й легко можемо донести до нього це бажання, попри можливий ризик для всієї угоди.\n\nДеякі офіцери починають прислухатися. Чи варто це заохочувати?"
 DRL.250.a: "Рішення, рішення."

 DRL.251.t: "Передати їх"
 DRL.251.d: "Ніхто не міг би й не став би заперечувати, що Лисенко дивак. Та це не означає, що він дурень: задля власної безпеки він особисто з'являється лише для справ із самим Дірлеванґером.\n\nЗа операціями з людьми завжди наглядає хтось із його службовців, і сьогодні не виняток. Наших людей, що прибули з останньою групою захоплених полонених, зустрів один такий службовець, і, з огляду на рішення не витискати з Чорної Гори більшого, справи пішли як завжди. Живий товар повели назустріч долі, яку для нього вигадали Лисенко та його божевільне коло, а на оплату підвезли вантажівки зі спорядженням.\n\nНа жаль, обирати, що саме отримати в обмін, нам не дали: очевидно, Лисенко вже склав і заздалегідь затвердив перелік. Не все якнайкраще пасує до наших потреб, але достатня частина пасує, та й усе належної якости.\n\nЗгодиться. Поки що."
 DRL.251.a: "Має ж бути честь і серед злодіїв."

 DRL.252.t: "Умови змінилися - Лисенко погоджується"
 DRL.252.d: "Наша людина на Чорній Горі повідомила, що Лисенко підкорився вимогам збільшити оплату за полонених, яких ми доставляємо. Складається враження, що наша раптова зміна намірів його аж ніяк не тішить, але нам, власне, байдуже, подобається йому це чи ні. Важливо лише те, що безумець прогнувся, як і личить боягузливій тварюці, і відтепер наші хлопці отримуватимуть додаткові припаси."
 DRL.252.a: "Работоргівля - прибуткова справа."

 DRL.253.t: "Умови змінилися"
 DRL.253.d: "Лисенко, безперечно, доволі дивний тип. Він, схоже, рідко покидає лабораторії, радше полохлива істота, ніж людина. Він ніколи не має справ ні з ким із нашого боку, крім самого Дірлеванґера, завжди посилаючи одного з не менш дивних «помічників» наглядати за оборудками між нами. Сьогодні, коли наш наглядач за рабами прибув на Чорну Гору з останньою партією полонених, усе йшло як завжди.\n\nПринаймні доки один науковець не зауважив, як їх вражає кількість наданих «зразків». Наш чоловік відповів, що це легко, коли маєш стільки людей, готових будь-якої миті битися будь-де й із будь-ким.\n\nСтривожені можливим підтекстом, посіпаки Лисенка спробували швидко завершити оборудку. Та з дозволу Дірлеванґера наш чоловік повідомив: умови змінилися. Ризикували ми, тож хочемо більше за домовлене раніше. Слів «а інакше» не прозвучало, але їх ясно дали зрозуміти.\n\nПомічник Лисенка відступив, заявивши, що прийняти чи відхилити вимогу може лише сам божевільний науковець."
 DRL.253.a: "Схоже, розум проти м'язів."

 DRL.254.t: "Умови змінилися - Лисенко не відступає"
 DRL.254.d: "Пославши наглядача за рабами на Чорну Гору, ми чекали, що він повернеться переможцем із додатковими трофеями, адже ми вирішили поставити Лисенкові питання про вартість наших полонених. Проте ми не очікували, що під погрозами Лисенко насправді виявить характер.\n\nСьогодні нам прислали обгорілі тіла охоронців наглядача; сам він, наскільки можемо судити, зник із лиця землі. До тіл додали записку від Лисенка: мовляв, прибувши, група спробувала змінити звичайну угоду, що, як Лисенко «певен з огляду на попередні домовленості, суперечило їхнім наказам» і було звичайним «бандитським вимаганням».\n\nНа покарання Лисенко їх «винищив» і повідомив, що через нашу «нездатність прищепити дисципліну нашим представникам» ми взагалі не отримаємо оплати за цю партію полонених, яких теж не повернуть."
 DRL.254.a: "Цей раунд за тобою, потворо."

 DRL.255.t: "Вимагати подвоїти - Лисенко надсилає вдвічі більше"
 DRL.255.d: "Наша улюблена потвора Лисенко підкорилася вимогам подвоїти оплату за останню партію полонених, і сьогодні припаси нарешті прибули. Очевидно, хоч наша спроба вимагання йому й не сподобалася, він вважає, що чим краще ми забезпечені, тим більше спільних ворогів зможемо вбити. Він і гадки не має, що цим спорядженням ми справді вбиватимемо наших ворогів, і самого Лисенка серед них."
 DRL.255.a: "Уже ми знайдемо цьому добре застосування."

 DRL.256.t: "Полювати на втікачів"
 DRL.256.d: "Вогонь наших сердець пожирає землі Уральської Ліги, з кожним днем палаючи гарячіше й яскравіше. Тепер її люди - біженці, що тікають від нашого наступу так швидко, як тільки несуть їхні ніжки. Удень наші розвідники вистежують колони зламаної погані, яка плентається вперед зі смутком в очах і поразкою в серцях. Уночі, коли вони шукають бодай короткого перепочинку вві сні, наші люди налітають, щоб розбудити їх у кошмарі. Ми жорстоко вбиваємо їхніх чоловіків, зганяємо роздратування на жінках і забираємо дітей служити нам. Відбираємо всі припаси, а тоді нарешті спалюємо все дотла. Вночі наші люди вже орієнтуються не за зорями, а за пожежами по всьому краю."
 DRL.256.a: "Бєлорєцк стане нашою Полярною зорею."

 DRL.257.t: "Світ перевернувся догори дриґом!"
 DRL.257.d: "Дурною була сама думка, що всі ті жалюгідні комуни зможуть хоч якось оборонятися від нас. Вони жили у вигадці, та ми змусили їх побачити правду їхньої утопії. Думали, Уральська гвардія їх захистить, - це була брехня. Думали, їх захистять вожді, - це була брехня. Думали, принаймні зможуть захистити одне одного... але це була брехня. Край повний обвуглених решток цих комун, усіяних мерцями й позбавлених усіх цінностей. Так часто, прибувши, ми бачимо, що їхні люди воліли померти від власної руки, а не від нашої, і це нас тішить: нарешті вони побачили нашу правду. Вигадці кінець, їхня утопія впала."
 DRL.257.a: "Їм було місце в дитячій книжці, не в житті."

 DRL.258.t: "Посипати землю сіллю!"
 DRL.258.d: "Відколи існують армії, їхні командири зазвичай розуміють, що військо рухається завдяки ситому шлунку. Хотіти воно може значно більшого, але їжа йому потрібна. На землях Орєнбурґа ми знайшли вдосталь засіяних полів, щоб добре нагодувати нашу армію. Їй це точно потрібно після всіх зусиль, витрачених на вбивства цих жалюгідних людей. Та як наша армія потребує ситого шлунка, так і їхня. Тож ми не залишимо їм нічого!\n\nЗабравши врожай, наші хлопці взялися сипати сіль у землю й мінувати поля. Криниці отруєно, часто скиданням усередину мертвої худоби. Зрошувальні системи й водні шляхи зруйновано. Труби вирвано із землі, дроти - зі стін. Ми забрали трофеї цієї землі, і тепер ніхто ніколи більше не зможе нею скористатися."
 DRL.258.a: "Ми - останні часи."

 DRL.259.t: "Нехай усі пізнають страх..."
 DRL.259.d: "Ми дійшли надзвичайно солодкого усвідомлення: ми завдали цим людям стільки жаху й страху, що почали переходити межу між дійсністю та мітом. Усе почалося з донесення розвідника: бабуся сказала онукові, що коли він не їстиме, прийде Дірлеванґер і забере його. Ми нашорошили вуха й почули ще багато чого.\n\nВиявляється, наші коні несуться в атаку на копитах із палючого вогню. У Дірлеванґера замість очей розжарене вугілля, гнила шкіра й цапині ноги. Наші люди мають надлюдську силу й кінські статеві органи. Нашу зброю благословив сам диявол, щоб вона завдавала якнайбільше болю. Ми приносимо полонених у жертву Гітлерові, який після смерти став богом. Ми такі могутні, бо здатні піднімати мертвих після кожної битви й поповнювати ними наші зіпсуті лави.\n\nУсе це дуже розважає, але головне - доводить, що ми увійдемо в історію як цілковиті лиходії, саме як і хотіли. Наші імена житимуть тисячу років!"
 DRL.259.a: "Нам ніколи не бути просто сторінкою в чужому підручнику історії!"

 DRL.260.t: "Змова починається..."
 DRL.260.d: "Хоч які насправді страхітливі есесівці, вони мають одну фатальну слабкість. Як і всі ми, вони лише люди. З кожним роком, з кожною битвою дедалі більше первісних членів Бригади Дірлеванґера гинуло, змушуючи приймати дедалі більше місцевих рекрутів. Рекрутів, які надто добре знають жорстокість і жахіття, заподіяні німцями їхній країні й їм самим. Настав час помститися, повалити Дірлеванґера й вигнати цю німецьку наволоч із наших земель!"
 DRL.260.a: "Час настав, і ми ризикнемо всім."

 DRL.261.t: "Лунає пропозиція..."
 DRL.261.d: "Людину можна гнобити й гнобити, але всьому є межа. Чимало росіян у Бригаді добровільно стали під прапор Дірлеванґера, так прагнучи втекти від злиднів, що були готові задля цього домовитися з дияволом. Ми вже здійснювали жахливі рейди проти російських громад, чинили невимовні речі, не кажучи вже про діяння Дірлеванґера під час війни. Та тепер до нас доходять чутки про його плани безпрецедентних нападів на Уральську Лігу й Орєнбурґ, і росіяни нарешті дійшли до межі.\n\nНе знаємо, як вони довідалися, але вони прийшли до нас і повідомили, що хочуть долучитися до змови з убивства Дірлеванґера. Єдина умова їхньої вірности - щоб ми також убили кожного німецького сучого сина довкола..."
 DRL.261.a: "...і ми, звісно, погоджуємося!"

 DRL.262.t: "Звернутися до поневолених..."
 DRL.262.d: "Перш ніж Бригада дісталася Орска, ми пройшли територією, яка тепер називає себе «Нова Польска», вельми цікавим місцем, де повно етнічних казахів і поляків. Наслідком стала низка рейдів, після яких багатьох біженців примусили служити нам, майже завжди проти їхньої волі. Ці люди не гірше за росіян знають про звірства Дірлеванґера та його німців проти невинних.\n\nПід час патрулювання наші змовники зустрілися з ватажком польсько-казахської фракції Бригади й попросили приєднатися. Він погодився на місці, і решту патрулювання лісом ми обговорювали, яку роль вони відіграватимуть у задумі. Натомість, окрім самої насолоди від смерти Дірлеванґера, ми пообіцяли дозволити їм вільно повернутися до Нової Польскі, коли справу буде зроблено."
 DRL.262.a: "Минуле прийде по Дірлеванґера й ударить сильно."

 DRL.263.t: "Тому, хто дасть найбільше..."
 DRL.263.d: "Ми заручилися підтримкою двох найбільших ненімецьких фракцій Бригади, але є ще одна група, яка може завадити планам, якщо не перетягти її на наш бік. Дірлеванґер найняв різні загони найманців, приваблених обіцянками щедрої здобичі, кровопролиття й жінок. Та цих людей купили, їм байдуже до самого Дірлеванґера. Ми навіть знаємо, що дехто його відверто недолюблює. Вони продаються тому, хто дає найбільше, і нам лише треба запропонувати вищу ціну.\n\nМи провели таємні зустрічі з наймогутнішими ватажками найманців. Як і підозрювали, їх можна переконати прийняти кращу пропозицію від нас і покинути Дірлеванґера, але дешево це не обійдеться. Після багатьох ночей переговорів ми дійшли до двох угод, які вони готові прийняти. Або дамо їм значну кількість людей із нашої фракції, щоб замінити рекрутів, яких вони набрали б у Дірлеванґерових завоюваннях, або пообіцяємо майже всі запаси награбованого Дірлеванґера. Вибір важкий, та на що погодимося?"
 DRL.263.a: "Дайте їм людей."
 DRL.263.b: "Нехай забирають багатства й ідуть геть."

 DRL.264.t: "Їхня остання вечеря..."
 DRL.264.d: "Ми посіяли хаос серед німців у наших лавах, саме як і планували. Коли росіяни, казахи, поляки та найманці долучилися до змови, це стало простою справою. Німці вважають себе вищими за нас, вищими за найпростіші й «брудні» завдання. Тому їжу готують люди з лав наших змовників. Звідси було вже просто одного вечора отруїти страви якомога більшій кількості німців.\n\nДо кінця ночі оголосили, що табором стрімко шириться якась епідемія з великою кількістю жертв, серед яких - уся елітна охорона Дірлеванґера. Поширюється кілька версій події, з яких дві головні: або Уральська гвардія зуміла зіпсувати припаси, або Лисенко застосував проти нас нову зброю.\n\nКоли правду повністю зрозуміють, живих, кому буде не байдуже, що це зробили ми, майже не лишиться."
 DRL.264.a: "Вода, вода повсюди, та й краплі не напитися."

 DRL.265.t: "Убивство Оскара Дірлеванґера."
 DRL.265.d: "Вночі рясно насніжило, і ранок був морозний, коли Дірлеванґер ішов від нужника до свого намету. Перший клинок з'явився наче нізвідки й глибоко врізався в бік. Тоді його дістав другий клинок, і ще один, і ще. Вони підходили по черзі, і коли все скінчилося, Дірлеванґерові завдали понад два десятки ножових ударів. Смертельно поранений, він упав на землю й не міг говорити. Останніми силами спромігся лише підтягти хутряний плащ до обличчя, ховаючи погляд від зрадників.\n\nДо полудня більшість банди пішла: зібрали припаси, які змогли, й розійшлися в усі боки - створювати власні банди чи вирушати в наступну пригоду. Лишилися тільки порожні намети, що тріпотіли на вітрі, жаринки багать і безживне тіло Дірлеванґера, покинуте просто на снігу."
 DRL.265.a: "Auf Wiedersehen, Herr Dirlewanger."

 DRL.266.t: "Далеко на заході"
 DRL.266.d: "Командири тижнями сперечалися, як цього разу найкраще вдарити по Орєнбурґу, та жоден план не здавався Дірлеванґерові правильним. Ми хочемо показати тим дурним селянам, що таке справжня свобода, і Дірлеванґер збагнув доволі простий розв'язок.\n\nПошлемо велику силу наших хлопців углиб їхньої території й просто... спустимо їх із ланцюга. Нехай цілий тиждень ідуть і роблять усе, що заманеться, без жодних наслідків. Єдині вимоги: після спливу часу повернутися до табору, не вбивати своїх офіцерів і накоїти якнайбільше лиха."
 DRL.266.a: "Оце... оце буде ціла купа розваг!"

 DRL.267.t: "Далеко на заході - приголомшливий успіх!"
 DRL.267.d: "Минув тиждень, і наші хлопці повертаються із земель довкола Орєнбурґа, де їх на певний час спустили з ланцюга. Повернулися не всі: дехто загинув у сутичках із місцевими, дехто - від рук наших же людей через суперечки, які нарешті дозволили розв'язати. Та в тих, хто повернувся, бойовий дух ще ніколи не був таким високим.\n\nОфіцери доповідають, що ми насправді недооцінювали жорстокість, на яку здатні хлопці: діставши тиждень безкарности, вони показали своє справжнє обличчя.\n\nСела спалено, худобу перебито, старих згодували псам, поля знищено, криниці отруєно, незліченних людей лінчовано, багатства розграбовано, спиртним зловжито, а жінок катували так, що ніхто в банді вже не може твердити, ніби не винен у содомії. І це лише мала частина того, що вони встигли накоїти.\n\nВони привезли вдосталь багатств і рабів, а ще - сяйливі усмішки, що гріють старе серце Дірлеванґера в цих холодних краях."
 DRL.267.a: "Оце я розумію - звільнення на берег."

 DRL.268.t: "Пробитися в гори"
 DRL.268.d: "Вистава, яку влаштували ці виродки, дуже швидко й добряче набридла. «Рятівники Уралу», називають їх люди, остання лінія оборони між життям і, що ж, нами. За ці роки ми здійснили незліченні рейди на їхню територію з перемінним успіхом, але цього разу відтиснемо їх іще на крок до могили. Замість чергової звичайної сутички влаштуємо повномасштабний рейд!\n\nМи одночасно вдаримо по трьох місцях на території Ліги:\n\nстарій совєцькій злітній смузі, перетвореній на склад боєприпасів, старому спортивному стадіону, переобладнаному в табір біженців, і, нарешті, польовому командному пункту Уральської гвардії.\n\nРазом із цими ударами здійснимо два десятки дрібніших рейдів уздовж кордону, щоб відволікти Гвардію від головних цілей."
 DRL.268.a: "Три - магічне число."

 DRL.269.t: "Пробитися в гори - результати"
 DRL.269.d: "Прийшли, побачили, спалили їхній світ! Наш великий рейд проти Уральської Ліги вдався на всіх напрямках, і Гвардія досі оговтується від ударів.\n\nНа летовищі наші сили люто штурмували базу в ближньому бою, жорстоко долаючи непідготований ґарнізон ножами, склом і кулаками не рідше, ніж кулями. Поки кров просочувала ґрунт, ми навантажили вантажівки до краю, а тоді підірвали залишки складу боєприпасів разом із запасами пального й знищили злітну смугу. Літаків там не знайшли, але краще перестрахуватися, ніж потім шкодувати.\n\nНа спортивному стадіоні хлопці вдарили вночі. Перекривши виходи, вони почали закидати табір біженців усередині пляшками із запальною сумішшю. Вогонь швидко перекинувся на намети, крики поглинули нічну тишу. Кожен, кому пощастило перелізти через мури, одразу отримував у винагороду кулю.\n\nНарешті, частина нашого підрозділу Ваффен-СС, що спеціялізується на прихованих діях, атакувала командний пункт Уральської гвардії. Десяткам людей перерізали горлянки в ліжках, також убили трьох старших офіцерів. Усю радіоапаратуру розтрощили, а цікаві документи забрали, зокрема кілька мап, які неодмінно знадобляться для майбутніх нападів.\n\nТри напади разом із дрібнішими відволікальними рейдами вздовж кордону посіяли повсюдне сум'яття й жах, а також тяжко підкосили Уральську гвардію щонайменше на кілька тижнів."
 DRL.269.a: "У повітрі пахне перемогою й плоттю."

 DRL.270.t: "Лещата"
 DRL.270.d: "Гаразд, берімося. Ми не дійшли б до нинішнього становища, якби не ризикували. Ми тут, бо ми найміцніші, найсміливіші сучі сини довкола, і давно час нагадати про це решті!\n\nДірлеванґер дозволив одночасні рейди на Орєнбурґ та Уральську Лігу, розділивши наші сили надвоє. Нападати, не кидаючи всю силу на жоден напрямок, буде важко, але можлива винагорода - славетна.\n\nВ Орєнбурґу пошлемо половину хлопців углиб території й просто... спустимо їх із ланцюга. Нехай три дні ідуть і роблять усе, що заманеться, без жодних наслідків. Єдині вимоги: після спливу часу повернутися до табору, не вбивати своїх офіцерів і накоїти якнайбільше лиха.\n\nДругу половину сил пошлемо через кордон Ліги, щоб одночасно вдарити по трьох цілях: складу боєприпасів на старому совєцькому летовищі, табору біженців на старому спортивному стадіоні та командному пункту Уральської гвардії.\n\nЖоден рейд не матиме підкріплень, тож або пан, або пропав. Ідеальна нагода хлопцям показати себе."
 DRL.270.a: "Це буде наш найвеличніший наступ!"

 DRL.271.t: "Лещата - успіх в Орєнбурзі!"
 DRL.271.d: "Минуло три дні, і наші хлопці повертаються із земель довкола Орєнбурґа, де їх на певний час спустили з ланцюга. Повернулися не всі: дехто загинув у сутичках із місцевими, дехто - від рук наших же людей через суперечки, які нарешті дозволили розв'язати. Та в тих, хто повернувся, бойовий дух ще ніколи не був таким високим.\n\nОфіцери доповідають, що ми насправді недооцінювали жорстокість, на яку здатні хлопці: діставши тиждень безкарности, вони показали своє справжнє обличчя. Села спалено, худобу перебито, поля знищено, криниці отруєно, десятки людей лінчовано, багатства розграбовано, спиртним зловжито, а жінок катували так, що ніхто в банді вже не може твердити, ніби не винен у содомії.\n\nМи певні: якби дали їм більше часу й послали всі сили, вони досягли б значно більшого. Та вони привезли вдосталь багатств і рабів, а ще - сяйливі усмішки, що гріють старе серце Дірлеванґера в цих холодних краях."
 DRL.271.a: "Оце я розумію - звільнення на берег."

 DRL.272.t: "Лещата - неоднозначні результати в Орєнбурзі"
 DRL.272.d: "Минуло три дні, і наші хлопці починають повертатися із земель довкола Орєнбурґа, де їх на певний час спустили з ланцюга. Назвати результат провалом було б неправильно, але й особливого успіху немає.\n\nРозділивши сили навпіл, командири тепер вважають, що ми просто не дали хлопцям досить часу накоїти бажаного лиха, та й кількости їм бракувало для справді добрих розваг.\n\nУрожай спалено, багатства розграбовано, жінок зґвалтовано содомським способом, криниці отруєно, та зробити рейд справді «великим», як хотілося, не вдалося, і його напевне пам'ятатимуть поряд з усіма іншими."
 DRL.272.a: "Сподіваймося на більший успіх проти Ліги."

 DRL.273.t: "Лещата - успіх проти Ліги!"
 DRL.273.d: "Прийшли, побачили, спалили їхній світ! Наш великий рейд проти Уральської Ліги вдався на всіх напрямках, і Гвардія досі оговтується від ударів.\n\nНа летовищі наші сили люто штурмували базу в ближньому бою, жорстоко долаючи непідготований ґарнізон ножами, склом і кулаками не рідше, ніж кулями. Поки кров просочувала ґрунт, ми навантажили вантажівки до краю, а тоді підірвали залишки складу боєприпасів разом із запасами пального й знищили злітну смугу. Літаків там не знайшли, але краще перестрахуватися, ніж потім шкодувати.\n\nНа спортивному стадіоні хлопці вдарили вночі. Перекривши виходи, вони почали закидати табір біженців усередині пляшками із запальною сумішшю. Вогонь швидко перекинувся на намети, крики поглинули нічну тишу. Кожен, кому пощастило перелізти через мури, одразу отримував у винагороду кулю.\n\nНарешті, частина нашого підрозділу Ваффен-СС, що спеціялізується на прихованих діях, атакувала командний пункт Уральської гвардії. Десяткам людей перерізали горлянки в ліжках, також убили трьох старших офіцерів. Усю радіоапаратуру розтрощили, а цікаві документи забрали, зокрема кілька мап, які неодмінно знадобляться для майбутніх нападів.\n\nЯкби ми здійснили повномасштабний рейд, не зважаючи на Орєнбурґ, то, можливо, змогли б зробити більше, та в будь-якому разі це добра перемога."
 DRL.273.a: "У повітрі пахне перемогою й плоттю."

 DRL.274.t: "Лещата - невдача проти Ліги"
 DRL.274.d: "Наш великий рейд проти Уральської Ліги вдався, але жахливою ціною.\n\nНа летовищі наші сили люто штурмували базу в ближньому бою, жорстоко долаючи непідготований ґарнізон ножами, склом і кулаками не рідше, ніж кулями. Поки кров просочувала ґрунт, ми навантажили вантажівки до краю, а тоді підірвали залишки складу боєприпасів разом із запасами пального й знищили злітну смугу. Літаків там не знайшли, але краще перестрахуватися, ніж потім шкодувати.\n\nНа спортивному стадіоні хлопці вдарили вночі. Перекривши виходи, вони почали закидати табір біженців усередині пляшками із запальною сумішшю. Вогонь швидко перекинувся на намети, крики поглинули нічну тишу. Кожен, кому пощастило перелізти через мури, одразу отримував у винагороду кулю.\n\nНарешті, частина нашого підрозділу Ваффен-СС, що спеціялізується на прихованих діях, атакувала командний пункт Уральської гвардії. Десяткам людей перерізали горлянки в ліжках, також убили трьох старших офіцерів. Усю радіоапаратуру розтрощили, а цікаві документи забрали, зокрема кілька мап, які неодмінно знадобляться для майбутніх нападів.\n\nОднак командири наполягали, що також треба здійснити багато дрібніших рейдів уздовж кордону, щоб не дати Уральській гвардії організувати відповідь, та це стало неможливим через зобов'язання послати людей і до Орєнбурґа.\n\nТож після успішних нападів Гвардія перехопила наших людей, перш ніж вони повернулися на наші землі, і ми зазнали тяжких втрат, доки їм нарешті вдалося вирватися."
 DRL.274.a: "Трагічний кінець чудового досягнення."

 DRL.275.t: "Дотриматися угоди"
 DRL.275.d: "Минуло кілька місяців від останнього обміну з нашою улюбленою потворою Лисенком. Тепер, після недавнього великого рейду, ми маємо свіжих полонених, яких йому неодмінно кортітиме отримати. Хоч у банді досі лунають голоси, що за кожного переданого полоненого треба брати дедалі більшу винагороду, Дірлеванґер вирішив їх іґнорувати. Наближаються нагальніші бої з Уральською Лігою та Орєнбурґом, тож поки що не варто ворогувати з Чорною Горою. Згідно з угодою ми передали полонених науковцям і отримали натомість спорядження."
 DRL.275.a: "Угода добра для всіх."

 DRL.276.t: "Відмовитися від нацистського вітання?"
 DRL.276.d: "Вже давно минули часи нашої славної служби фюрерові, та деякі звичаї колишнього життя лишилися. Один із них - нацистське вітання, яке часто супроводжують слова «Sieg Heil». Звісно, відколи країна нас зрадила, нацистської партії в нас немає; натомість жест став знаком поваги й вірности Дірлеванґерові, особливо серед німців нашої банди.\n\nОскільки ненімців у Бригаді більшає, та й Райхові ми вже не служимо, дехто з хлопців запитує, навіщо ми взагалі досі вітаємося цим жестом. Чи слід і далі заохочувати його, чи дозволити йому відійти в минуле?"
 DRL.276.a: "Це більше, ніж просто жест. Збережемо вітання."
 DRL.276.b: "Ми куємо власну долю без Німеччини. Відмовимося від вітання."

 DRL.277.t: "Найстарший із нас помер"
 DRL.277.d: "Небагато пов'язує нас із батьківщиною, з часами, коли ми були лише дивізією СС. Окрім деяких одностроїв, прапорів і різних пам'яток, найважливіший із цих зв'язків - первісні німецькі члени Бригади, що завжди мали особливе місце в серці Дірлеванґера. Та найстарший із нас, Карл Вільгельм Мюллер, помер у 73 роки. Останніми роками він хворів, два дні тому в таборі переніс інсульт, якого вже не зміг витримати, і сьогодні вранці нарешті відійшов.\n\nІнші члени «старої гвардії» банди тяжко переживають утрату, але головне - вже постає питання, що саме станеться, якщо старості вистачить сміливости прийти по Дірлеванґера."
 DRL.277.a: "Спочивай із миром, старий друже."

 DRL.278.t: "Напруження в банді"
 DRL.278.d: "Нашу банду веселих маніяків можна назвати по-різному, але аж ніяк не згуртованою. У наших лавах німці, австрійці, поляки, казахи, росіяни, українці, а серед них - злочинці, політичні в'язні, садисти, вигнанці, в'язні концтаборів і безумці. І це лише мала частина нашого нинішнього складу. Як з'ясувалося, усім цим різним групам важко вжитися, і в Бригаді існує низка фракцій.\n\nМи давно знали про це напруження через проблеми, які воно часом спричиняло з виконанням наказів у полі, але вчора вночі воно, здається, вихлюпнулося через край. Після зайвої чарки дві фракції зійшлися в кулачному бою, а коли долучилися інші групи, посеред табору спалахнула величезна бійка.\n\nЗацікавлений, чим це закінчиться, - виживання найсильніших і все таке, - Дірлеванґер дозволив бійці дійти природного кінця без свого втручання. На ранок восьмеро були мертві, ще двадцять троє поранені.\n\nГоловних призвідників, які вижили, стратили за участь у бійці, і наразі мир повернувся. Та це знову порушило питання: що саме станеться одного дня, коли Дірлеванґер помре й об'єднавча сила банди зникне?"
 DRL.278.a: "Добре, що випустили пару, а тепер до роботи."

 DRL.279.t: "Захоплено льотчика Люфтваффе зі збитого літака!"
 DRL.279.d: "Учора банда поринула в безлад, коли нібито нізвідки здійнялася велика снігова буря й пройшла просто крізь табір. Сьогодні вранці ми оцінили збитки: найбільше постраждало спорядження, також розкидало намети й було кілька легких поранень.\n\nТа коли довкілля стало краще видно, ми виявили дещо незрівнянно цікавіше. Шукаючи розкидане спорядження, хлопці знайшли розбитий винищувач Люфтваффе та його пілота, пораненого, але живого. Схоже, він виконував терористичне бомбардування Орска, коли снігова буря змусила його розбитися.\n\nРетельно допитавши й закатувавши його, ми довідалися чимало про колишню батьківщину. Здається, Гітлер досі фюрер, але в Німеччині зростають внутрішні заворушення, а між Райхом і СС стався великий розкол. Кожне слово роз'ятрювало старі рани, і пілота повісили на найближчому дереві."
 DRL.279.a: "Колись ми змусимо їх усіх заплатити..."

 DRL.280.t: "Пожежа в Орску!"
 DRL.280.d: "Хоч наша банда багато пересувається задля рейдів, головною базою залишається захоплене місто Орск, куди ми за потреби повертаємося. Однак здобич, раби й кровопролиття нас цікавлять значно більше за справжнє управління якимось жалюгідним містом, тож адміністрації тут здебільшого немає.\n\nПроте виявилося, що це не завжди нам на користь: брак нагляду й загалом паскудний стан інфраструктури Орска спричинили пожежу. Ми не певні, як вона почалася, але вогонь знищив низку будівель і забрав життя.\n\nНа щастя, більшість трофеїв і рабів не постраждала, та вогонь спустошив частину фабричного району, зачепивши ту невелику промисловість, що ми маємо."
 DRL.280.a: "Тоді просто доведеться ще трохи пограбувати!"

 DRL.281.t: "Спалах холери!"
 DRL.281.d: "Для нашої веселої банди життя на Уралі - суцільні крайнощі. Ми надміру п'ємо спиртне, але поза зимою чисту воду рідко знайдеш. Бенкетуємо трофеями рейдів, та в скрутніші часи їмо гнилі й погано приготовані страви. Через часті переходи санітарні умови просто жахливі. А зважаючи, як часто ми маємо справу з мерцями, ризик хвороб значний.\n\nНа жаль, одна така біда й сталася: один із небагатьох наших лікарів повідомив про спалах холери в таборі. Заразилися понад шістдесят людей, багато хто тяжко хворий, дванадцятеро вже померли. Серед полонених і рабів через особливо погані умови життя заразилися десятки.\n\nЗа тутешнього браку медикаментів очікуємо, що число зростатиме й, перш ніж стане краще, погіршає. Майже нічого не лишається, крім перечекати спалах, поховати мертвих і рушати далі."
 DRL.281.a: "Наші хлопці заслужили померти в рейді, а не отак."

 DRL.282.t: "Найнебезпечніша дичина"
 DRL.282.d: "Останнім часом бойовий дух тримається рівно, та його завжди можна підняти, тож Дірлеванґер улаштував змагання в Бригаді. Участь може взяти кожен, але всі охочі мусять сплатити вступний внесок - певний відсоток власних запасів здобичі. Переможець забере всі трофеї, внесені до спільного казана, і ще отримає подарунок від самого Дірлеванґера.\n\nГра проста: на світанку частину рабів і полонених відпустять і, потай від них, дадуть три години фори. Тоді випустять учасників, а мета гри - за дванадцять годин повернутися з якнайбільшою кількістю голів; хто має найбільше, той переміг.\n\nЗмагання мало великий успіх, хоча голів і повернулося більше, ніж ми насправді відпустили."
 DRL.282.a: "Треба робити це частіше!"

 DRL.283.t: "Захоплено шпигуна Уральської Ліги"
 DRL.283.d: "«Повісити його!»\n\n«Убийте виродка!»\n\n«Відріжте йому хуй і запхайте в горлянку!»\n\nТакі крики лунали табором, поки побитого й закривавленого «гостя» тягли багнюкою до центру. Ми виявили, як він шастав серед припасів, наче щур, яким і є, а після ретельного катування з'ясувалося, що це справді шпигун Уральської Ліги.\n\nЦе майже комплімент: думка про бій із нами настільки їх лякає, що вони хочуть потай оцінити наші сили й припаси. Зрештою, ми любимо, коли нам віддають належну повагу, але це вже занадто.\n\nВиведеного перед усіма шпигуна прив'язали до стосу дров і підпалили; його крикам відповідало лише вовче виття. Тіло скинемо на кордоні, нехай буде пересторогою.\n\nЯкщо хочуть оцінити нашу силу, можуть зробити це, поки ми їх убиваємо."
 DRL.283.a: "Бачу, бачу своїм оком..."

 DRL.284.t: "Тут є лікар?"
 DRL.284.d: "Сьогодні день справді щедрий. Розвідуючи землі Орска в пошуках цілей для набігів між великими рейдами на ворогів, ми знайшли діючу лікарню, яка досі вислизала з нашої уваги.\n\nТобто до сьогодні.\n\nПочувши донесення, Дірлеванґер негайно наказав здійснити рейд, і наші хлопці налетіли. Ми зустріли лише слабкий спротив цивільного загону, який легко здолали, а тоді взялися до трофеїв. У краю, де ліки важко роздобути, захоплені медичні припаси варті своєї ваги в золоті й навіть більше. Разом із вродливими медсестрами, яких ми знайшли, та кількома лікарями, яких примусили служити, це був чудовий день для банди. Усіх знайдених у лікарні пацієнтів стратили, а саму будівлю підпалили."
 DRL.284.a: "Вони служитимуть нам або помруть."

 DRL.285.t: "Чудове полювання"
 DRL.285.d: "Кількість того, що можна награбувати, обмежена, а зі зростанням банди зріс і попит на найпростіші товари. Потреба в м'ясі, а ще більше - в хутрі, щоб захиститися від тутешніх лютих зим, привела до появи в наших лавах мисливців, відповідальних саме за це, поки решта грабує, відновлює сили й грабує знову.\n\nСудячи з донесень, цьогорічний мисливський сезон був особливо вдалим. До запасів надійшло багато вовчого, ведмежого та лосиного хутра; його розподілять між тими в банді, хто найбільше заслуговує прихильности Дірлеванґера.\n\nТрохи змагання ще нікому не шкодило, і в такі часи винагорода промовляє сама за себе."
 DRL.285.a: "Тут добре хутро відділяє життя від смерти."

 DRL.286.t: "Зимові втрати"
 DRL.286.d: "Хоч як ми готувалися, російські зими, мабуть, можуть зрівнятися з нами в жорстокості. Так часто навіть найсильніші й найхоробріші нічого не можуть проти лютого холоду й суворої місцевости.\n\nХоч ми, німці, безперечно вищі за цих росіян, ми не невразливі й не маємо імунітету до таких температур. Досі холод забрав життя двадцяти семи наших людей; зазвичай вони тихо йшли від нас уночі.\n\nВласна вразливість і мізерність перед цими лютими проявами природи протвережують, та ми знаємо: коли пройдемо крізь це, воно знову доведе, чому ми найвитриваліші й найлютіші сучі сини, яких бачили ці землі!"
 DRL.286.a: "Холод не заморозить чистої арійської крови!"

 DRL.287.t: "Застиглі в часі"
 DRL.287.d: "Зима триває, і ми натрапили на надзвичайно цікаве видовище. Під снігом і кригою знайшли невеликий загін танків Т-26 та замерзлі скелети кількох совєцьких солдатів. Гадаємо, вони прямували на фронт під час німецького вторгнення до Совєцького Союзу багато років тому, але мороз забрав їх раніше, ніж вони дісталися туди.\n\nЦе прекрасне, хоч і моторошне видовище, нагадування, ким ми були колись і як далеко відтоді зайшли. Техніка вже не підлягає ремонту, тож доведеться її лишити, але нагадування, що люди - не єдиний тутешній ворог, ще довго триматиметься в пам'яті."
 DRL.287.a: "Ми не зазнаємо такої долі."

 DRL.288.t: "Гнатися за рештками"
 DRL.288.d: "Ліга мертва, і шлях на Орєнбурґ відкритий навстіж! Звучить чудово, наче привід святкувати, грабуючи жалюгідні володіння, які Ліга мала в горах, та в таборах Дірлеванґера святкування немає.\n\nПоки біля ніг короля бандитів складають знайдену вбогу здобич, він кипить. Його люди вже почали переслідувати тих небагатьох, хто вижив, але дорога до багатств Уралу досі для нього закрита. Вони були надто повільні, й Лисенко вже забрав більшу частину гір собі, іґноруючи вимоги Дірлеванґера віддати належне награбоване.\n\nКожна рушниця перед ним, кожна дрібна прикраса й убогий клапоть здобичі лише посилюють лють. Як та суча наукова потвора сміє так його відшивати? Як сміє!? ЯК ВІН СМІЄ!?\n\nЗ часом буде праведна помста. Поки що Дірлеванґер дивиться на Орєнбурґ. А потім - хто знає?"
 DRL.288.a: "Ми йдемо, ти, пиздо в лабораторному халаті."

 DRL.300.t: "Король Гори"
 DRL.300.d: "Це був довгий шлях, довший і кривавіший, ніж будь-хто в банді сподівався багато років тому. Коли ми були просто «Бригадою Дірлеванґера» СС, ніхто не здогадався б, що за двадцять років ми витримаємо те, що витримали, і зробимо те, що зробили. А найкраще? У глибині серця ми знаємо, що ніхто, ніхто інший не зміг би цього, лише ми. Усі зусилля привели нас сюди, до цієї миті, до цього великого завоювання.\n\nБезумець Лисенко колись був нашим союзником, ще й цінним. Та тепер, коли Уральську Лігу знищено, а Орєнбурґ ґрунтовно розграбовано, він нарешті вичерпав свою користь. На Чорній Горі є технічні й наукові чудеса, що бентежать розум, яким місце радше в романах, ніж у дійсності. Ми потроху куштували ці плоди, але навіщо задовольнятися випадковим плодом, коли можна забрати все кляте дерево? Чорна Гора стане справжньою перлиною нашої корони, і коли вона буде наша, ми справді станемо нестримними."
 DRL.300.a: "Час настав, і ми ризикнемо всім."

 DRL.301.t: "Король Гори - Чорну Гору взято!"
 DRL.301.d: "Це було довго й важко, але ми впоралися. Останні оборонці зламалися, і Чорна Гора нарешті наша. Вперше за всі завоювання наших людей послали проти професійного війська - 22-ї мотострілецької дивізії НКВД Лисенка. Вона вже не та сила, що колись, але разом з огорожами, високими мурами, мінними полями й вогневими гніздами гірської бази бій був нелегким. Та щойно ми увійшли до лабораторій, як швидко хлопцям захотілося знову битися із солдатами.\n\nМи й гадки не мали про масштаби експериментів Лисенка, і, намагаючись зайняти внутрішні приміщення, наші люди потрапляли в пастку за пасткою. Електричні пастки, що кип'ятили кров, ударні хвилі, що вибивали очі, отруйний газ, що розплавляв легені, леґіони збожеволілих піддослідних, що кидалися з брудними ножами й грубою силою. Ті, хто вижив, ніколи не забудуть жахів лабораторій, та зрештою ми захопили Чорну Гору. Нам дісталося чимало захопливого обладнання й революційних досліджень, а також багато Лисенкових науковців, що працювали на Горі.\n\nТа полонені солдати кажуть, що Лисенко був одержимий думкою не дати своїй праці потрапити до «неосвічених варварських» рук, тож підірвав вибухівку в багатьох глибинних лабораторіях із найціннішими експериментами. Чи втік він, чи згорів разом зі своєю працею, невідомо: ні живого, ні мертвого сліду не знайдено."
 DRL.301.a: "Сподіваюся, ми знайшли кілька тих стильних білих халатів."

 DRL.302.t: "Перемога над Уральською Лігою!"
 DRL.302.d: "Землі під «захистом» Уральської Ліги тепер наші. Уральську гвардію цілковито зламано, а уряд розчавлено. Вогонь пожирає їхні гулагівські фортеці, і землі відкриті навстіж для грабунку. І ми їх пограбуємо!\n\nМи так скалічимо цих людей, що вони ніколи більше не підведуться, перетворимо цей край на попіл і сіль. Нехай те, що тут станеться, покаже, що буває з тими, хто наважується виступити проти Бригади Дірлеванґера!"
 DRL.302.a: "Нехай Ліга згине в історії."

 DRL.303.t: "Перемога над Орєнбурґом!"
 DRL.303.d: "Орєнбурґ упав, комуни палають, і їхні землі нарешті наші! Як і з Уральською Лігою, ми обрушимо на ці землі таку помсту й такий жах, що всіх росіян мороз продере поза шкірою!\n\nБільше ніколи не дозволимо існувати цьому їхньому «соціяльному експериментові» бодай десь поблизу нас; не лишимо й сліду цих дурнів, щоб хтось міг його знайти. Ми зробимо землю непридатною до життя - єдина гідна кара."
 DRL.303.a: "Орєнбурґу кінець, туди йому й дорога."

 DRL.304.t: "Перемога над Лисенком!"
 DRL.304.d: "Після захоплення Чорної Гори це було лише питання часу. Останні сили Лисенка тануть, і ми забрали землі Маґнітоґорска собі. Тут небагато залишилося: чимало людей утекли з Лисенкових пазурів або були ними поглинуті. Та якщо людей немає, це ще не означає, що вони не лишили вдосталь здобичі!\n\nЗавоювання Уральської Ліги, Орєнбурґа, а тепер і Маґнітоґорска виснажили наших хлопців, але ми дамо їм повну волю грабувати, палити й убивати тут скільки заманеться.\n\nТепер, коли Урал наш, нехай увесь світ знає: ніхто не здатен нам протистояти!"
 DRL.304.a: "Твої експерименти нарешті скінчилися, Лисенку."

 DRL.305.t: "Кожному за здібностями"
 DRL.305.d: "Один із учасників останнього рейду сьогодні постав перед самим Дірлеванґером: його суперечка з командиром набула розголосу в таборі. Солдат зухвало заявив, що за всі його заслуги в рейдах йому дають замало й відтепер ті, хто грабує найбільше, мають найбільше отримувати. Далі він твердить, що офіцер відмовляється давати людям справедливу частку, і нахабно заявляє, що внесок самого офіцера блідне поруч із його власним, чого винагороди не відбивають.\n\nНе бажаючи, щоб його доводи відкинули, солдат дістає невеликий мішок із «доказами». Від мішка тхнуло, а коли його відкрили, всередині виявилася доволі жорстока здобич. Там лежало щонайменше з десяток пар вух, зв'язаних докупи: солдат твердив, що відрізав їх у своїх жертв під час рейдів. Він і далі розпинався, що це достатній доказ його права на значно більшу здобич, і вимагав винагороди, співмірної з його незрівнянно більшим внеском у справу. Усі дивилися на Дірлеванґера, який мав установити прецедент на майбутнє."
 DRL.305.a: "Застрельте цього шмаркача, знайдіть його офіцера."
 DRL.305.b: "Так, убийте його, але вивчіть докази."

 DRL.306.t: "Разюча некомпетентність"
 DRL.306.d: "Сьогодні Дірлеванґер знайшов час у своєму надзвичайно щільному розкладі, щоб ущент рознести того так званого офіцера-дурня, через якого почалася суперечка про належні солдатські частки здобичі. Коли Дірлеванґер вибухнув тирадою, чимало людей у таборі гадали, що це останні хвилини офіцера. Його обзивали на всі лади: від «йобаного ідіота» до «кандидата на кастрацію й пониження до живого щита». Лайка й буря, що виривалися з уст Дірлеванґера, були справжнім видовищем для присутніх, а словесне знищення тривало доволі довго. Дірлеванґер був, м'яко кажучи, невдоволений, що офіцер спричинив заворушення, здатні порушити стабільність Бригади. Невідомо, чи він узагалі не збирався його вбивати, чи відчув рідкісний напад милосердя, але офіцер вийшов із цієї пригоди лише зі страхом кастрації та постійним відчуттям неминучої страти від рук самого Дірлеванґера. Можливо, сувора догана - це все, чого він потребував."
 DRL.306.a: "Пляма у вашій службовій справі, офіцере."
 DRL.306.b: "На передову тебе!"

 DRL.307.t: "Брак віри"
 DRL.307.d: "Тривога серед офіцерів через попереднє пониження спонукала трьох із них, що шукали безпеки в гурті, особисто висловити Дірлеванґерові занепокоєння його поводженням з офіцерами за так звані «незначні помилки». Трійця вважає несправедливим пониження останнього винуватця й натомість заявляє, що Дірлеванґерові слід було завершити каральні заходи стратою сповненого бравади солдата - справжнього винуватця всієї колотнечі. Не обов'язково обстоюючи повернення того офіцера на колишню посаду, троє натомість просять ґарантій збереження власних посад у разі так званих дрібних прорахунків, у які вони можуть потрапити. Знову прохання до Дірлеванґера дає йому змогу встановити новий прецедент: як Бригада має ставитися до помилок і вад керівників. Офіцери ковтають слину й ніяково переступають, мовчки молячись, щоб Дірлеванґер не підписав їм смертного вироку просто зараз. Вирішувати йому."
 DRL.307.a: "Кожному з вас - одна помилка без покарання."
 DRL.307.b: "Дуже смішно, розстріляйте всіх."

 DRL.308.t: "Проґресивне робоче середовище"
 DRL.308.d: "Зусилля трьох офіцерів, здається, пішли на користь усьому офіцерству: їхні доводи спонукали Дірлеванґера судити їхні вчинки з дещо меншою злобою, ніж будь-коли раніше. Маючи трохи більше свободи дій і значно менше страху бути пристреленими й усунутими, офіцери почали дихати вільніше. Від цього нового полегшення тягаря на плечах загальне піднесення духу поширилося від самих офіцерів до підлеглих солдатів, що тішить увесь табір: кожен наче бадьоріше крокує грабувати чергове налякане містечко невинних росіян. Можливо, думають офіцери, самий лише страх має межу дієвости, а випадкова пільга чи крихта свободи корисна для загальної ефективности війська. Хай там як, із піднесеним духом і кращим настроєм офіцери можуть трохи дієвіше командувати, прокладаючи кривавий і багатий шлях Південним Уралом і далі."
 DRL.308.a: "Дірлеванґер - відомий реформатор."

 DRL.309.t: "Юнацька невмілість"
 DRL.309.d: "Можливо, серед Бригади Дірлеванґера лише небагато хто здатен командувати. Ще троє офіцерів лежать мертві за незгоду з волею Дірлеванґера, а на спорожнілі посади нашвидкуруч поставили заміну. Один із нових офіцерів, колишній рейдер без командного досвіду, що міг похвалитися лише непоганим послужним списком убивств, спричинив нові проблеми серед солдатів. Коли він вирішив показати вагу нової посади, очоливши рейд на невелике село, то цілковито осоромився. За донесеннями, серед його наказів були такі тактично виважені команди, як «В атаку!» й «Убити всіх!». Звісно, коли селяни виявилися чимось більшим за живі опудала, його командування ганебно розсипалося.\n\nТепер люди знову скаржаться Дірлеванґерові. Безперервна черга страт за найменші заперечення, незгоду й помилки спричинила гострий брак командної майстерности в Бригаді. Тепер, коли скарг так багато, що кількома кулями їх не залагодиш, Дірлеванґер, здається, загнав себе в кут і, на лихо, підірвав силу власної армії. Лише час покаже, чи серйозно це завадить рейдам Бригади або навіть майбутній війні проти Уральської Ліги. А поки, схоже, доведеться розстріляти ще одного офіцера."
 DRL.309.a: "Сире м'ясо псується найшвидше."

 DRL.310.t: "Більшовицький батальйон"
 DRL.310.d: "Після страти зухвалого солдата, який здійняв колотнечу в Бригаді, вирішили посмертно вивчити його «докази»: чи було щось у його словах, навіть після смерти? Подальше розслідування виявило вкрай тривожну тенденцію, яка не померла разом із ним, а заразила багатьох у його дивізії. У батальйоні вже мертвого солдата тепер панують тривожні, можливо навіть комуністичні, настрої.\n\nЩе за його життя думки про рівномірніший поділ награбованого проникли до багатьох його бойових товаришів, і слідство виявило комуністичні, мерзенні, більшовицькі, прямо протилежні моралі ідеї: можливо, солдати мають отримувати більшу частку того, що власноруч грабують і крадуть.\n\nЗвісно, ця тенденція відверто тривожна, якщо не цілковито лиховісна. На жаль, за таких обставин мимоволі питаєш себе, чому офіцери батальйону не вважали за потрібне придушити ці думки, особливо коли виявити такі червоні російські ідеї було порівняно легко. Два способи відповіді здаються однаково доречними: простий розв'язок, звісно, - прибрати цю радикальну марксистську думку рушничними пострілами, та це можуть вважати марнуванням людей і набоїв. Можливо, не менш доцільно з'ясувати, чому саме офіцери досі з цим не впоралися, і знайти джерело проблеми."
 DRL.310.a: "Розстріляйте цих дурнів!"
 DRL.310.b: "Хто тут узагалі командує!?"

 DRL.311.t: "Червона жилка"
 DRL.311.d: "Рішення допитати офіцерів нововиявленого «більшовицького батальйону» виявилося мудрим, хоча б тому, що привело до моторошного відкриття. Коли офіцерів ізолювали й розпитали про тривожні думки їхніх людей, вони зрештою прохопилися, що й самі дещо зважають на ці ідеї. Гірше того, офіцери твердять, що такі думки не обмежені одним батальйоном Бригади Дірлеванґера, а насправді доволі поширені в усій його армії! Вони навіть заявляють, що лише найвище керівництво, Дірлеванґер та найближчі генерали, вважає, ніби офіцери мають забирати більшість трофеїв собі.\n\nЗіткнувшись із такими радикальними, безглуздими думками, Дірлеванґер мусить міркувати: чи це зухвалий виверт, покликаний показати незгодницькі ідеї значно поширенішими, ніж вони є, чи справжня проблема, яка заповзла в голови колись таких жорстоких і слухняних грабіжників? Зрештою, такий блеф може бути більшовицькою змовою, щоб змусити його прийняти ці ідеї, коли в дійсності для них немає підстав. З іншого боку, офіцери-зрадники можуть, на лихо, мати рацію, і це поставить під загрозу все майбутнє Бригади Дірлеванґера! Щоб Бригада існувала далі, доведеться вирішити, як зупинити поширення екстремістських ідей поділу здобичі. Дірлеванґерові належить обрати наступний крок - звісно, спершу розбризкавши голови цих офіцерів по землі."
 DRL.311.a: "Вистежте цих червоних виродків!"
 DRL.311.b: "Це безглуздя, вони брешуть!"

 DRL.312.t: "Вимерла ідеологія"
 DRL.312.d: "Схоже, перше припущення - що офіцери-зрадники збрехали, аби здавалося, ніби Бригада Дірлеванґера повна марксистської наволочі, - було правильним. Це втішно, та офіцери все одно змарнували чимало часу й сил, обшуками, допитами та розстрілами пробиваючись у голови власних людей, щоб дізнатися правду. Хай там як, Бригада може бути певна, що справді лихі думки про поділ між собою раз і назавжди викорінено. До крайньолівого батальйону поставилися милосердно: задля збереження людей усіх під дулами рушниць змусили зректися переконань або перетворитися на місиво сірої речовини. Звісно, тепер батальйон не загрожує нам: його керівництво замінили суворим лоялістом, а прокляті вірування принизили перед усіма. На щастя, Бригада Дірлеванґера вільна від впливу звироднілої колишньої совєцької землі, і Дірлеванґер украй задоволений, що різати й грабувати все на шляху можна зі свіжими силами й без перешкод."
 DRL.312.a: "Її справді викорінено."

 DRL.313.t: "Червоно-чорна Бригада"
 DRL.313.d: "Знову було мудро глибше дослідити посмертні особливості наших людей. На нашу шкоду, схоже, офіцери зовсім не брехали про мерзенних комуністів у лавах, а їхнє поширення сягнуло межі, за якою Дірлеванґер і вірні генерали не можуть просто безжально розстріляти кожного порушника. Серед більшости людей поширене жахливе переконання, що здобич треба ділити за особистими досягненнями рейдерів, і ця думка міцно вкоренилася в їхніх серцях. Шок і лють Дірлеванґера відчутні майже на дотик, і від кривавої розправи його стримує лише потреба в людях для великих планів пограбувати й розорити кожен квадратний дюйм Південного Уралу та земель далі.\n\nНа жаль, це залишає Дірлеванґерові два способи продовжити існування Бригади. Звісно, він може відійти від розслідування й удати, що ніколи не дізнавався про такі ганебні думки своїх людей. А є другий варіянт: крок у темряву, що, здається, огорнула всіх його людей. Можливо, найпростіше досягти стабільности, зваживши на деякі з їхніх ідей. Хоч це й цілком огидно, воно, ймовірно, підніме бойовий дух, а це може поліпшити ефективність нашого великого завоювання. Просто прикро, що люди обзавелися власними дурними мізками, та ось Дірлеванґер стоїть, змушений зважати на побажання своєї банди катів."
 DRL.313.a: "Можемо прислухатися, лише заради бойового духу."
 DRL.313.b: "Покласти край цьому фарсу."

 DRL.314.t: "Виправданий страх"
 DRL.314.d: "Хоч офіцера-баламута, здається, не кастрували й не перетворили на живий щит, сьогодні справдився його другий найбільший страх: Дірлеванґер наказав привести його до себе. Будь-якого милосердя, що нібито було під час минулого зіткнення, вже не видно: Дірлеванґер наказав кільком рейдерам відвести офіцера в середину табору Бригади, щоб усе задумане було якнайкраще видно. Поки офіцера тягли до місця, Дірлеванґер знову взявся його шпетити й висміював аж до зупинки. Життя офіцера офіційно стало прикладом для всіх, хто навмисно чи ненавмисно заважає стабільності й діяльності Бригади. Відповідь на всі питання про його долю дали різкі рушничні постріли: кулі ввійшли в череп, обірвавши життя для втіхи всіх глядачів."
 DRL.314.a: "На проблему - розв'язок."

 DRL.315.t: "Мить для роздумів"
 DRL.315.d: "Хоч його життя майже безперервно минало в тумані диявольського збудження й усілякої розпусти, Дірлеванґер раз знайшов мить відносної тиші на самоті в наметі. Не маючи чим зайнятися, він озирав простір у пошуках заняття, і погляд упав на вірну рушницю.\n\nВона й справді була древня. Звичайний штатний Karabiner 98k, який він мав ще відтоді, коли сидів на ланцюгу Райху. Та хоча його люди постійно добували нову зброю в кривавих рейдах, він усі ці роки зберігав свою рушницю, доглядав її й далі смертоносно застосовував. Сівши з нею на брудні хутряні підстилки, що правили за ліжко, він почав обережно відчищати бруд зі зношеної поверхні.\n\nЗа роботою думки блукали в минулому. Він провів пальцем по іржавому спуску й згадав, як палець клацав, клацав, клацав ним перед обличчями зрадливих Шпайделевих людей, розносячи порожні черепи по російському снігу. Він полірував цівку й криво всміхався, згадуючи перше прибуття до Орска: як запхав її в горлянку останньому міському голові й мало не задушив, перш ніж пошматувати нутрощі кулею. Пальці ковзнули подряпинами на прикладі, і він засміявся, згадавши всіх російських селян, яких просто забив ним у криваве місиво.\n\nВін тримав перед собою тепер уже порівняно чисту зброю. Дивитися на цю рушницю для нього було наче дивитися в дзеркало. Вона була з ним, скільки він себе пам'ятав. Саме тому він увесь цей час і тримав її при собі.\n\nВона була частиною його самого."
 DRL.315.a: "Подумати лишень: таке смертоносне може бути таким прекрасним."

 DRL.316.t: "Брудна справа"
 DRL.316.d: "Коли рейдерський загін зупинився на відпочинок у спалених руїнах чергового села, що відчуло їхню лють, Дірлеванґер вистрибнув із вантажівки й пішов щось узяти ззаду. Підійшовши, він помітив, що борт укритий засохлою багнюкою після недавніх дощів. Озирнувся по селу в пошуках якогось нікчемного п'яниці, на якого можна звалити миття, й побачив гурт своїх людей, що смажили сільських тварин на вогні.\n\nПогляд зупинився на одному, який особливо йому не догодив. Казахський рейдер, що недавно приєднався до банди, але в рейдах постійно тримався позаду, уникаючи небезпеки, а потім усе одно радо брав собі здобич. Дірлеванґер спокійно наказав йому підійти. Всміхнувся, подав ганчірку й відро та наказав за годину вичистити вантажівку так, щоб жодної плями.\n\nБоягуз одразу зблід, а Дірлеванґерова усмішка стала ще ширшою. Дехто з присутніх зареготав із бідолахи, який негайно почав люто зішкрібати багнюку з пошарпаного металу. Дірлеванґер хмикнув і побрів у село шукати здобич або полонених для розваги, залишивши чоловіка працювати так, наче від цього залежало його життя."
 DRL.316.a: "Насправді його життя від цього Й ЗАЛЕЖИТЬ."

 DRL.317.t: "Невелика прикрість"
 DRL.317.d: "Чоловік нервово чекав, поки Дірлеванґер оглядав кожен дюйм вантажівки. Борти були цілком чисті від багнюки, лобове скло відполіроване від пилу, навіть усередині прибрали бруд. Дірлеванґер перевірив усе раз, удруге, втретє. Нарешті підійшов і подякував, що вантажівка стала чистішою, ніж була вже давно.\n\n«Звісно, я сказав, що хочу без жодної плями...» - мовив він, і підступна посмішка повернулася на обличчя. Кров знову відлила від обличчя рейдера, коли Дірлеванґер присів і поманив його поглянути. Там, знизу переднього лівого крила, лишилася крихітна плямка багнюки.\n\nЛише одне схлипування встигло вирватися з горлянки, перш ніж Дірлеванґер приставив рушницю до потилиці й натиснув на спуск. Глядачі засміялися, а двоє підійшли кинути тіло рейдера до решти. Провівши очима труп нещасного, Дірлеванґер повернувся до машини й роздратовано застогнав, побачивши дверцята, тепер забризкані кров'ю. Він обернувся до чоловіка, який днями розлив на нього випивку, й гаркнув прибрати безлад.\n\nПравила, як завжди, ті самі."
 DRL.317.a: "Уже втретє за місяць!"

 DRL.318.t: "Загублений син Німеччини"
 DRL.318.d: "Дірлеванґер добряче напився, коли його перервали кілька людей, увірвавшись до намету. Перш ніж він устиг зажадати пояснень, вони витягли вперед закривавленого, втомленого й виснаженого хлопця не старшого за п'ятнадцять років. Його схопили на краю табору й почали бити, аж доки він усіх не здивував, закричавши вільною німецькою.\n\nХлопець кволо благав Дірлеванґера й назвався Отто Ваґнером. Казав, що він із родини поселенців у Райхскомісаріяті Московієн, де був дрібним бандитом. Він із гуртом таких самих злочинців утік на схід після того, як їх упіймали на крадіжці зброї з місцевого ґарнізону, але пустки й ворожі місцеві мешканці земель поза німецьким контролем не були до них ласкаві. Із загону лишився він один і зрештою дістався Орска, підслухавши розмову ополченців про німецьку банду, що там базується.\n\nЧи зі справжньої цікавости, чи просто тому, що був надто п'яний, аби перейматися, Дірлеванґер вирішив не випускати хлопцеві кишки на землю. Зауваживши, що той, мабуть, доброї арійської породи, раз сам дійшов так далеко, Дірлеванґер дозволив залишитися в таборі. Та притяг хлопця до себе й пригрозив, щоб ніколи не зневажав нового господаря.\n\nОтто швидко витер сльози, тихо подякував Дірлеванґерові й поспіхом вийшов із намету."
 DRL.318.a: "Не завдавай клопоту, хлопче."

 DRL.319.t: "Секретар"
 DRL.319.d: "Минуло майже пів року від прибуття Отто Ваґнера до табору, і він поволі вжився в життя Бригади. Він не скаржиться й мало говорить, навіть коли старші грубо з ним поводяться й часом б'ють. Зрештою, більше йому нікуди йти, тож здебільшого він мириться з недоїдками зі столу й роллю найслабшого в Бригаді.\n\nОстаннім часом Дірлеванґерові набридла щоденна рутина розподілу здобичі й обліку набоїв. Він вирішив, що хотів би мати секретаря, як великі начальники в Німеччині, щоб той робив усю нудну виснажливу роботу, поки вони можуть ходити трощити черепи. Можливо, бажаючи нарешті дати Отто якесь призначення, він без церемоній звалив йому в руки стос облікових книг і записників та наказав працювати.\n\nНе сміючи зневажити Дірлеванґера, новий секретар швидко взявся до обов'язків. Задоволений, що хлопець більше не сидить без користи, Дірлеванґер пішов шукати нових збочених занять, тепер коли обов'язки було передано іншому."
 DRL.319.a: "Не напартач, а то знаєш, що буде!"

 DRL.320.t: "Перша кров"
 DRL.320.d: "Сьогодні рано-вранці до табору привели партію полонених для лабораторій Лисенка. Бандити зігнали їх у загін, де колись тримали худобу, перш ніж місцевого фермера без церемоній посадили на кіл воріт. Хоч офіційно всіх захоплених належало передавати неушкодженими безумцеві на горі, бандити ніколи не пропускали нагоди робити з беззахисними невинними все, що хотіли.\n\nСеред сцен розпусти й безпричинного насильства до загону підійшов юний секретар Дірлеванґера Отто. Він давно вже зачерствів до витівок Бригади й дивився на жах порожніми очима. Тоді помітив слабкий блиск на пальцях одного полоненого. Прагнучи показати себе перед бандитами й узяти трохи здобичі, Отто підійшов і наказав віддати. На його подив, чоловік відмовився. Він відчайдушно благав дозволити залишити її: це його обручка, єдина пам'ять про дружину.\n\nОтто вдарив його кулаком.\n\nКоли чоловік упав, дехто з бандитів почав підбадьорювати хлопця й казати вдарити знову. Він стояв у роздумі, але вигуки посилювалися, тож він ударив чоловіка чоботом у живіт. Нахилився й ударив кулаком іще раз. Знову й знову. Полонений благав про милість, а Отто лютував дедалі дужче, та чоловік усе одно не віддавав дорогоцінної обручки. Зрештою він лежав на землі холодний і безживний.\n\nНа коротку мить хлопець приголомшено втупився в труп, а тоді нахилився, зняв дрібничку з пальця мерця й підняв угору всім напоказ. Зібрані чоловіки заревли від захвату за свого улюбленого сина та його перше вбивство."
 DRL.320.a: "Тепер він один із нас."

 DRL.321.t: "Зламаний дух, скалічене тіло"
 DRL.321.d: "Дірлеванґер прокинувся від гучної метушні, а потім криків і пострілів. Вискочивши з намету з'ясувати, кого треба застрелити, щоб припинити шум, він натрапив на криваве видовище. Один чоловік лежав мертвий із оздобленим ножем у шиї, а хлопець Отто Ваґнер - на землі, зрешечений кулями, зі спотвореною рукою.\n\nДірлеванґер люто зажадав пояснень, і хтось із присутніх розповів, що двоє побилися за здобич. Обидва хотіли ножа собі, а коли старший відмовився поступитися, хлопець жорстоко на нього напав. У сутичці чоловік тяжко порізав Отто руку, але хлопець витяг клинок із власної плоті й завдав смертельного удару. Та перш ніж знепритомніти, старший устиг дістати люґер і кілька разів вистрелити: у груди не влучив, зате руки й плечі хлопця були всюди пробиті кулями. Старого негайно застрелили за те, що скривдив секретаря, а Дірлеванґер голосно обізвав присутніх цілковито нікчемними за те, що дозволили Отто потрапити в таку біду.\n\nЗаспокоївшись, Дірлеванґер звернув увагу на Отто. Хлопець був справді в жалюгідному стані. Руку вже не врятувати, і він швидко стікав кров'ю. Секретарем він точно більше не стане корисним, хоча за наявних обмежених медичних припасів його, можливо, ще можна врятувати й використати кухарем чи кимось подібним. Але в такому суворому краї й серед таких суворих людей із непотрібними часто розправляються швидкою й милосердною смертю. Дірлеванґер глянув на пістолет і подумав, чи не припинити просто хлопцеві муки."
 DRL.321.a: "Пробач, малий..."
 DRL.321.b: "Підлатайте його й знайдіть застосування."

 DRL.322.t: "Поклик пращурів"
 DRL.322.d: "Рейдерський загін їде пагорбами в пошуках здобичі, без сумніву уявляючи себе давніми монгольськими ордами. Ціль - село російських селян за наступним кряжем, що досі вціліло лише завдяки щасливому випадку й недоглядам Бригади. Справжніх багатств вони майже не мають, зате льохи завжди повні, горілки вдосталь, а інколи можна взяти срібний свічник чи золоту каблучку. Загалом найкраща пожива, на яку рейдер може сподіватися без ризику збройного спротиву.\n\nРаптом за сигналом ватажка загін зупиняється. Він мовчки показує на неглибокий яр, а люди дивляться з подивом. Там, посеред полювання на вечерю, на них витріщається дорослий бурий ведмідь. Люди завмерли, відчайдушно сподіваючись не порушити тривожної тиші між ними й звіром. Нарешті командир нахиляється до заступника й шепоче: «Я підійду до нього». Помічник дивиться так, ніби в того виросла друга голова, а тоді досилає набій у потерту рушницю Мосіна-Наґана в руках. Краще пристрелити звіра, перш ніж начальникові спаде на думку ще якась дурниця."
 DRL.322.b: "Може, він дружній?"
 DRL.322.a: "Краще перестрахуватися, ніж потім шкодувати."

 DRL.323.t: "Зброя проти ведмежих пазурів"
 DRL.323.d: "Без жодного слова помічник командира підносить рушницю й стріляє ведмедеві просто межи очі, перш ніж начальникові спаде на думку ще щось блискуче. Звір одразу валиться, навіть не скімнувши, а з голови на траву поволі стікає червона цівка. Після короткої суперечки вартові вирішують здерти шкуру й привезти її до табору як трофей - приз справді незвичайний.\n\nДорогою до Орска командир вирішує зупинитися біля іншого яру, щоб дати коням кілька хвилин відпочити й знайти воду. Вони не помічають невеликої печери за поворотом, а солдат, що стереже коней, - трьох дорослих бурих ведмедів, що суне до них. Проте він таки помічає, коли ведмідь змикає зуби на його шиї.\n\nКоли загін нарешті повертається до табору, в ньому лише троє нажаханих, забризканих кров'ю солдатів на конях, пошматованих пазурами. Ні командира, ні помічника немає, і ніхто не хоче розповідати, що сталося. Один тільки бурмоче знову й знову: «Не треба було його вбивати, не треба було його вбивати»..."
 DRL.323.a: "Факт: ведмеді їдять бандитів."

 DRL.324.t: "Перший контакт"
 DRL.324.d: "Командир простягає руку вбік і втримує рушницю помічника дулом до землі, не відриваючи погляду від ведмедя. Виставивши вперед порожню долоню, він поволі підступає до звіра, готовий чкурнути за першої ознаки біди. А ведмідь дивиться темними очима, і ні рух, ні вираз не видає, що він зробить далі.\n\nПісля, здається, цілої вічности командир стоїть за кілька футів від ведмедя, нерухомого мов статуя. Простягає тремтячу руку й, на мить завагавшись, легенько гладить його по верху морди."
 DRL.324.a: "Він збожеволів?!"

 DRL.325.t: "Як приборкати ведмедя"
 DRL.325.d: "Мить напружена: командир тримає долоню на ведмежій морді, і ніхто не сміє навіть дихнути, щоб не розлютити звіра. Та зрештою ведмідь нахиляється вперед... і починає тертися об командирову долоню.\n\nЛюди ошелешено дивляться, як ватажок обома руками гладить ведмежу голову, а той чухається боком голови об його мундир. Задля перевірки командир відступає на крок, і ведмідь ступає вперед, лишаючись поруч. Командир заскакує на коня, і ведмідь охоче суне біля нього. «Виходить, він таки дружній!»\n\nКоли вони повертаються до табору з новим другом, решта бандитів і солдатів істерично регоче, бачачи ведмедя, що чалапає поруч, мов вірний домашній пес. Тієї ночі, порадившись із людьми й випивши щедро горілки, командир вирішує спробувати залізти ведмедеві на спину й поїхати верхи, як на коні. Знадобилося кілька спроб, але він зрештою втримався на звірі, не звалившись. Разом зі своїми людьми сміявся з усієї безглуздости, а обіцянкою поїхати на ньому в наступний рейд викликав іще гучніший регіт!"
 DRL.325.a: "Гарний жарт... він же серйозно, так?"

 DRL.326.t: "Миттєве каяття"
 DRL.326.d: "Мить напружена: командир тримає долоню на ведмежій морді. Ніхто не сміє навіть дихнути, щоб не розлютити звіра. Ведмідь навіть здається спокійним, майже покірним... аж раптом змикає щелепи й перетворює командирове передпліччя на криваве місиво. Той втрачає розум і лише стоїть приголомшений, видаючи моторошний крик і дивлячись на жах перед собою. Крик швидко обриває удар ведмежих пазурів по горлянці. Люди кидаються до коней, верещать не своїм голосом і вигукують молитви будь-якому богові, що, може, слухає. На жаль, коні розбіглися від звуків різанини, забравши з собою рушниці, а через пагорб до людей суне ще двоє ведмедів.\n\nКоли загін нарешті повертається до табору, в ньому лише троє нажаханих, забризканих кров'ю солдатів на конях, пошматованих пазурами. Командира й помічника немає, і ніхто не хоче казати, що з ними сталося. Єдине, що вдається витягти з одного солдата: «Треба було триматися від нього подалі, якнайдалі...»"
 DRL.326.a: "Недобре дурити матінку-природу."

 DRL.327.t: "Атака ведмежої бригади"
 DRL.327.d: "Після певних тренувань командир загону почувається досить упевнено, щоб узяти ведмедя, названого Зіґфрідом, у наступний рейд. Зіґфрід виявився не найшвидшим скакуном, але ненадовго розганяється до пристойної швидкости й навіть не здригається від пострілів. Коли люди рушають до села, сподіваючись повернутися зі здобиччю й славою, інші загони вітають хрипким реготом Зіґфріда, що суне повз, і щедро жартують, ніби командир знайшов собі російську жінку.\n\nНаблизившись до села, загін чує водночас захопливий і тривожний звук: постріли сільських ополченців. Рейд, звісно, буде небезпечнішим за звичне плюндрування халуп бідних селян, але наявність ополчення означає, що є здобич, варта захисту. Командир підганяє Зіґфріда вперед, коні поруч переходять із рисі в галоп. Щойно загін починає стріляти, Зіґфрід раптом різко зупиняється й валиться на землю. Командир зістрибує зі спини подивитися, що сталося. На щастя, Зіґфрід цілий: схоже, просто спіткнувся об камінь. Командир зітхає з полегшенням, але це викликає сумніви в бойовій дієвості Зіґфріда: ведмеді, зрештою, не такі швидкі й спритні, як коні. Вести його далі, можливо, ризиковано в бою, та чи варто ризикувати?"
 DRL.327.a: "Не можна тут зупинятися, хлопче. Рушай!"
 DRL.327.b: "Надто ризиковано, лишіть його тут!"

 DRL.328.t: "Їм лиш діяти й вмирати"
 DRL.328.d: "Зрештою командир вирішує, що Зіґфрід принесе більше користи в рейді, ніж сидячи без діла. Не гаючи миті, він знову видирається на ведмежу спину, смикає саморобні віжки й жене скакуна в саму гущу бою. Кулі свистять довкола: ополченці відступили за вікна й у провулки села. Та люди Бригади Дірлеванґера досить досвідчені, щоб успішно дати відсіч ворогам, і їдуть вулицями, стріляючи в усе, що рухається. Попереду загону командир веде рикливого Зіґфріда й сіє хаос на вулицях.\n\nНарешті люди готуються атакувати останній осередок місцевого спротиву: крихітну, занедбану православну церкву. Хоч більшість місцевих розбігається, побачивши понад десяток озброєних до зубів бандитів, що мчать до них, кілька людей лишаються рішучими до кінця й встигають зробити ще кілька пострілів, перш ніж їх застрелять або зарубають. Більшість куль пролітає без шкоди - крім однієї. Зіґфрід, уражений у голову, з гуркотом падає, скинувши командира на землю. Той підповзає до вмирущого скакуна, пригортає закривавлену голову й востаннє заплющує темні очі. Командир підводиться, дістає пістолет і з рішучістю в погляді йде до селян, що зіщулилися в церкві.\n\nЦе за Зіґфріда."
 DRL.328.a: "Добраніч, любий принце."

 DRL.329.t: "Назад до природи"
 DRL.329.d: "З болем в очах командир вирішує, що краще лишити Зіґфріда подалі від бою й іти пішки. Діставши рушницю, він куйовдить хутро на ведмежій голові й рушає до містечка, далеко позаду своїх вершників.\n\nКоли він дістається туди, більшість боїв уже скінчилася. Місцеві вартові лежать на вулицях і в провулках, їхня кров просочується в землю. Далі він здебільшого зганяє й страчує полонених призовного віку, грабує зимові запаси їжі, організовує справедливий поділ військової здобичі та спалює крихітну православну церкву, де оборонці міста дали останній бій. Один із його людей утратив коня в атаці, але зараз це мало хвилювало: люди ходили від хати до хати й хапали все й усіх, хто привертав увагу. Містечко стало доволі щедрою винагородою: сам командир отримав позолочений кишеньковий годинник, пляшку бренді, новий пістолет, срібну чашу для причастя з церкви та кілька пачок старих совєцьких рублів, що давно втратили грошову вартість, але чудово годилися для розпалювання вогню.\n\nКоли люди натішилися, почали повертатися до табору. Та наблизившись до місця, де лишили Зіґфріда, ніде його не побачили. Ні крови, ні слідів бою, зате є сліди в напрямку печери, де його вперше знайшли. Зіґфрід, зрештою, дикий, і дурістю було б намагатися втримати його надто довго. З важким серцем командир наказує їхати далі, знаючи, що, мабуть, ніхто з них уже не побачить кавалерійського ведмедя Зіґфріда."
 DRL.329.a: "Якщо любиш - відпусти."

 DRL.331.t: "Блискуча пропозиція"
 DRL.331.d1: "Великий, похмурий розум Оскара Дірлеванґера породив блискучу пропозицію, безперечно корисну для його елітного почту: скасувати «Зіґ гайль». Дірлеванґер був людиною дії, погано пристосованою до незграбної соціяльної інженерії римського салюту. Зрештою, це військо ніколи не знадобиться для розмахування прапорами чи лестощів начальству; тут кожен сам собі господар, творець долі й спадщини для себе та своїх людей. Страх як засіб контролю завжди діяв на тих, кого він тероризував, тож, за логікою, мав подіяти й на його людей, якщо вони відкинуть ідею.\n\nУ своєму маренні божевільний офіцер, який, імовірно, міг би стати успішним ляндскнехтом в іншу й водночас надто подібну добу, забув, чому колишнім господарям удавалося добиватися цілковитої покори підлеглих. Суворий порядок і муштра створили солдатів із залізною волею, і хоча вони з моторошною точністю нагадували предків, які так само плюндрували Центральну Европу, вірити, що вони здатні вбивати й ґвалтувати з тих самих причин, було цілковитою дурістю.\n\nБлискучий стратег видав свій усевладний указ; тепер дивився, як той розсипається. Щоразу, збираючи людей довкола, він бачив, як вони виструнчуються, підносять руки під сумнозвісним кутом і ревуть мантру, дехто навіть із посмішкою. Ненімці теж почали долучатися: тиск товаришів засліплював їх, не даючи усвідомити, що вони роблять і що це означає для їхніх народів. Ще тривожніше: декотрі старші ветерани Бригади наче стали менше зважати на нього, караючи порушників його верховної волі з підозрілою поблажливістю. Та він усе ще незамінний командир, що поведе людей до слави, тож це лише невелика невдача. Чи справді незамінний? Старечий розум жорстоко грався з ним у хвилини ясности, перш ніж знову опускався туман божевілля."
 DRL.331.d2: "Дірлеванґер був ветераном: служив у Німецькому народному союзі захисту й відсічі, потім у СА та НСДАП, зрештою в СС. Він дезертирував зі славетного Райху в годину скрути не через зневагу чи ненависть до нації; образа на декого зі штабу Вермахту не змінила б любови й туги за батьківщиною. Тож зберегти традицію «Зіґ гайль», що єднала німців усього світу, було для нього простим рішенням, попри велику кількість чужинців у війську. Оголошуючи рішення, він стривожено помітив у лавах нехіть, байдужість, навіть прихований спротив. Щоб утвердити залізну владу над Бригадою, він підніс худу руку й клацнув підборами із запалом значно молодшого чоловіка.\n\n«ЗІҐ ГАЙЛЬ!» - вереснув він, витріщивши очі; біля сивої лінії волосся напнулася жилка, от-от лусне. На його прикрість і кипучу лють, дехто захихотів, та більшість зібраних довкола саморобного помосту й далі дивилася з чимось схожим на цікавість. Зіпсутий чоловік, наполовину втоплений у безумстві, забув, кого тепер очолює. Російські пустки перетворили чистий фанатизм на гіркий цинізм, розбавивши колишню бригаду СС пристосуванцями й зневіреними. Це не були люди ідеології чи релігії: зборище нігілістичних грабіжників, що живе одним днем, не мало причин підтримувати традицію, яка їх покинула чи безжально кривдила. Дірлеванґер мовчки зійшов із помосту; за цим мусило настати покарання. Тихе бурмотіння загубилося в гаморі війська, яке поверталося до заняття, перерваного промовою колишнього офіцера СС, до того, що вміло робити з гордістю: грабувати й ґвалтувати в маленькому зруйнованому російському селі."
 DRL.331.a: "Не така вже й несподіванка." #failed keeping
 DRL.331.b: "Принаймні вони ще виконують накази - поки що." #failed dropping

 DRL.332.t: "Уражена раком орда"
 DRL.332.d1: "З кожним днем у хаотичних уральських степах колишнього Совєцького Союзу те, що колись було бригадою СС, дедалі більше скочувалося до простої жорстокости. Мораль розмивалася до цинічного нігілізму, від якого навіть Ніцше підняв би брови, більше не пов'язаного з жодним етичним порядком, крім власного. У цій зміні відбулося збочене народження: матір'ю стала садистська радість чути, як загублені душі благають милосердя під час зґвалтувань і катувань, а батьком - гостре відчуття смерти, що стукала у двері майже щодня. Нескінченне насильство прищепило Бригаді думку відкинути нацизм - безперечно споганену, звироднілу ідеологію, яка, проте, мала традиції, що стримували певні бажання й учинки.\n\nДірлеванґер, попри глибоку й навіть ніжну прив'язаність до збоченої ідеології, що піднесла Німеччину до використаних ним висот, відчував, як його корені й корені колишніх есесівців Бригади поволі пересаджуються в родючий ґрунт бандитизму ненімецьких рекрутів. Цілком очікувано командир-алкоголік і сексуальний збоченець скасував, точніше забув, «Зіґ гайль» - вітання, рівнозначне конформізмові й суворій дисципліні. Він не потребував плазування й хитромудрої гри у владу, як фюрер, та й часи були не для осілого, організованого існування: це були часи грабунку, сповненого втіхи. Часи смерти й слави."
 DRL.332.d2: "Попри все разюче нігілістичне кровопролиття й грабунок, які загартовані люди Бригади Дірлеванґера принесли Уралові, у безжальних серцях вони лишалися вірними крові й ґрунтові, за які колись билися. Певну повагу, навіть захоплення, плекали й зберігали до далекого німецького Фатерлянду, п'яно співали гучні марші СС, а суворі ветерани часом розповідали солодкі й гіркі спогади про рідні міста. Це часто закінчувалося сміхом і кпинами, що завжди ледь приховували спільну тугу вигнанців. Росіяни й представники інших народів, які приєдналися до мандрівних бандитів, часто зазнавали лютих знущань від німецьких есесівців у власних лавах, які поверталися до старих звичок, а потім ще й неправдивих звинувачень та покарань від офіцерів.\n\nТак, старий привид нацизму досі чіплявся за серця й розуми колишніх бійців 36-ї ваффен-гренадерської дивізії. Відірвати його було важко через тягар традицій, що обліпили його, мов морські жолуді затонуле судно, - таких, як салют «Зіґ гайль». Дірлеванґер ненадовго замислився, чи той не втратив користи, але вирішив зберегти, на мовчазне розчарування ненімецьких бандитів і велику радість «арійців». Він залишиться разом із багатьма іншими, відверто кажучи, вже віджилими традиціями основою ідентичности Бригади."
 DRL.332.a: "Люди без традицій - лише звірі у великій дикій природі." #success keeping
 DRL.332.b: "Не можна заперечити природу існування." #success dropping

 DRL.335.t: "Необхідна компенсація"
 DRL.335.d: "Дірлеванґер прокинувся змерзлий, спітнілий і розгублений. Це точно був не найгірший сон, але вже давно жоден так йому не подобався. Найвищі офіцери глузували з нього за брак машини, гідної його становища ватажка. Йому було соромно, і він почувався безсилим.\n\nМіж звичними рейдами й веселими іграми Дірлеванґер мав чимало коротких митей подумати, як розв'язати цю проблему. І в одну таку мить його осяяло: розв'язок знайдено. Дірлеванґер дозволить створити вантажівку, велич і міць якої будуть йому до пари. Названий на честь винахідника Оскарваґен стане моторизованим арсеналом страху й вогневої сили, з гарматою, достатньо великою, щоб перетворити ферму на ліс трісок. Коли це божественне натхнення вразило Дірлеванґера, він зрозумів, що мусить діяти. Негайно наказав чотирьом найдужчим своїм здорованям поставити на його вантажівку найбільшу гармату зі складів. Дірлеванґер нетерпляче чекав на втілення славетної ідеї; майже настільки нетерпляче, щоб відволіктися від страти кількох селян в останньому рейді."
 DRL.335.a: "Оскарваґен рушить!"

 DRL.336.t: "Він готовий"
 DRL.336.d: "Після довгої роботи над шедевром, безперечно довшої, ніж вимагав Дірлеванґер, Оскарваґен завершили. Справжній красень, гідне чільне втілення Бригади, він мав точно слугувати його цілям. Дірлеванґер зобов'язав усіх, хто зараз не грабує, бути на демонстрації й першому випробуванні машини. Людей табору здивувало, що він захопився чимось не цілковито морально збанкрутілим, і більшість не знала, як до цього ставитися. Та зрештою чорна банда водночас і нетерпеливилася, і нервувала перед показом великого Оскарваґена, який ватажок так розхвалював. Дірлеванґер наказав поставити кілька старих розбитих машин за мішені для гармати, і в напруженій тиші особисто віддав наказ вистрелити."
 DRL.336.a: "Бум..."

 DRL.337.t: "Гарматний стрибок"
 DRL.337.d: "Ніхто з тих, кому доручили будувати вантажівку, цього не передбачив. Поки всі присутні люди Бригади вітали перше випробування, величезна віддача гармати мала інші плани. Постріл так струсонув бідолашну вантажівку Дірлеванґера, що вона перекинулася й розчавила двох солдатів, які підійшли подивитися зблизька!\n\nЛюди раптом замовкли, розгублені й налякані тим, що буде далі. Єдиним звуком був шалений регіт Дірлеванґера, якого страшенно потішило розплющення двох людей. Регіт поволі стих, коли він усвідомив провал Оскарваґена. Втіха вибухнула люттю, і він негайно зажадав страти чотирьох будівельників. Дехто з глядачів потихеньку вислизнув, інші лишилися з поваги й страху: не хотіли ризикувати наслідками непідтримки свого оберфюрера."
 DRL.337.a: "Усміхайтесь і махайте, хлопці."

 DRL.338.t: "Оскарваґен"
 DRL.338.d: "Гучні вітальні вигуки Бригади заглушив лютий гарматний постріл. Спрацювало. Дірлеванґер був у захваті: нарешті мав машину, з якої можна командувати й вести великі завоювання де заманеться; ні Гора, ні так зване «велике» місто Орєнбурґ, ні розхвалені в'язні не зрівняються з новим знаряддям війни. Він був такий задоволений, що після успіху першого Оскарваґена замовив іще один - запасний, ще одну чудову машину руйнування на підсилення Бригади. Вдоволений настрій поширився серед усіх присутніх. Після успішного випробування Дірлеванґер зажадав очолити наступний рейд. Він особисто стрілятиме з гармати якомога більше. Йому вже несила було чекати завершення другого Оскарваґена."
 DRL.338.a: "Авжеж, він спрацював!"

 DRL.339.t: "Panzerkampfoskarwagen"
 DRL.339.d: "Два Оскарваґени, основний і запасний, здатні як ніхто руйнувати домівки й трощити мрії, та що, як Бригада Дірлеванґера матиме їх іще більше? Яка взагалі користь зі звичайних вантажівок - тільки й возять солдатів із місця на місце. Але пересуватися можуть і всі звичайні солдати: декотрі вмістяться на вантажівках, інші можуть бігти позаду. Початковий задум - зробити особисту машину Дірлеванґера особливою - раптом уже не здавався таким важливим. Нові славетні видіння приходили на зміну згаслим: вантажівка за вантажівкою з гарматами стають у стрій, як у давнину, засипають вогнем безпорадні села, а тоді можуть просто в'їхати, не зустрівши спротиву. Загони по чотири охочих і завзятих бійці, кожен прагне вести власний Оскарваґен просто в житло тих, хто ховає цінності.\n\nЙого осяяло, що Оскарваґен, чесно кажучи, - танк, а він от-от стане танковим командиром. Він аж засяяв, уявивши всю здобич, яку принесе план."
 DRL.339.a: "Початок чогось нового."

 DRL.340.t: "За Дірлеванґера - в рейд!"
 DRL.340.d: "Виявилося, вантажівок, придатних нести гармати, менше, ніж сподівався генеральний штаб, але деякі переобладнали. 1-ша дивізія Оскарваґенів дістала високе місце в бойовому розписі - поняття, яке не відігравало ролі в Дірлеванґерових планах, - щоб планувати й здійснювати рейди без буркотливих офіцерів, які казатимуть «ні». Ця дивізія, радше розміром із велику бригаду, підпорядковуватиметься лише самому Дірлеванґерові. Дві вантажівки вже показали себе в рейдах, а з організованою структурою навколо машин бійці 36-ї були сповнені запалу й чекали, що здобич невдовзі потече з усіх можливих джерел!"
 DRL.340.a: "Із цим ніщо не зрівняється."

 DRL.342.t: "Перерахунок людей"
 DRL.342.d: "У нападі люті, який якимось чином зумів здивувати всю Бригаду, Оскар Дірлеванґер наказав систематично перерахувати кожного солдата, розбійника й бандита під своїм командуванням. Два роки тому такий перепис уже намагалися провести, але дані виявилися цілком марними: люди Бригади, схоже, надто непосидючі, щоб облікувати їх самими числами. Попри минулу невдачу, коли кілька сміливців поставили наказ під сумнів, Дірлеванґер лише затявся дужче й низько прогарчав: «Не порахуєте їх ви - я сам перестріляю всіх до останнього й порахую трупи».\n\nПопередні перерахунки ніколи не були такими нагальними, і майже кожен бандит має власні здогади, навіщо все це. Сам ватажок не дає певнішої відповіді, ніж називає це передчуттям, що аж ніяк не додає впевнености в необхідності цієї справи тим небагатьом солдатам, які мають адміністративні здібності. Та єдине, чого вони бояться більше за нудну бюрократичну роботу, - гнів короля бандитів, і хоч усі можуть зволікати, перерахунок невдовзі все одно проведуть. Ще побачимо, чи є підстава для дивного Дірлеванґерового передчуття."
 DRL.342.a: "З тим самим успіхом можна переписувати скажених псів."

 DRL.343.t: "300 зниклих людей"
 DRL.343.d: "За підрахунком забракло 300 людей. Навіть з урахуванням адміністративної некомпетентности, дезертирства, звичних зникнень, нападів ведмедів, випадкових німецьких бомб, комуністичних рейдів, страт, віспи, обморожень, спотикань, падінь, самогубств, нещасних випадків біля багать, суперечок за здобич, застуди, чорної чуми, грипу, харчових отруєнь, алкогольних отруєнь, звичайних отруєнь, незвичайних отруєнь, замахів, венеричних хвороб, теплових ударів, переохолодження, каменепадів, невдалих наукових експериментів, наукових експериментів, що вдалися за планом, викрадень, нападів собак, сказу, аґресивних північних оленів, втрат у рейдах, сварок через азартні ігри, расових війн, обвалів будівель, самозаймань, зіткнень машин, випадкових пострілів на змаганнях зі стрільби, навчальних стрільб, заражених ран, рідкісних випадкових убивств, значно частіших убивств задля розваги, ножових поранень, розстрілів, буйств із прусською кавалерійською шаблею, розчавлень ящиками, лінчувань, аневризм мозку, повстань рабів, дуелей та загальної нездатности більшости бандитів Бригади рахувати далі за кількість прожитих років, ця цифра все одно далеко виходить за межі звичного. Доведеться розслідувати це й якнайшвидше знайти зниклих."
 DRL.343.a: "Приведіть їх до мене, живими чи мертвими. Бажано живими..."

 DRL.344.t: "Знайдено 130 зниклих людей"
 DRL.344.d: "Після довгих безрезультатних днів пошуків на околиці зони терору Бригади знайшли великий гурт - трохи менше половини зниклих. Вони таборували в нещодавно розграбованому селі, порпалися в залишках і чинили звичні невимовні жорстокості над полоненими. На запитання пошукового загону їхні розгублені ватажки відповідали, що це був лише звичайний рейд, але вже найпростіша перевірка показала: вони приховували здобуте, щоб не віддавати Дірлеванґерові звичної частки. Намагалися нажитися, оминувши короля бандитів. Тяжка помилка.\n\nЗвісно, цього стерпіти не могли. Побитих і закривавлених, їх із криками волокли назад до самого Дірлеванґера, і не лише змусили віддати все здобуте, а й особисто благати милосердя. Божевільний вюртембержець пройшов уздовж усього ряду зі 130 тремтячих людей, слухаючи ридання й благання та страчуючи декого начебто навмання, аж доки дійшов до кінця. Краще б ці недодезертири засвоїли урок."
 DRL.344.a: "Буде їм наука."

 DRL.345.t: "Знайдено п'ятдесят рейдерів"
 DRL.345.d: "Пошуки зниклих знову дали щось корисне: ще п'ятдесят розбійників знайшли в Казахстані. Схоже, ці й не збиралися дезертирувати, а просто були в рейді під час перерахунку. Вони вистежували караван казахських селян, який привів їх до багатого, майже незахищеного містечка. Жорстоким грабунком здобули значні трофеї й полонених, тож трохи посвяткувати до появи пошукового загону було не зовсім безпідставно. Спочатку на наказ повернутися до Бригади не скаржилися, але невдовзі стало ясно, що всю здобич вони хотіли залишити собі. Це спричинило палкі суперечки дорогою додому й навіть доволі марнотратне кровопролиття. Після повернення Дірлеванґерові справно доповіли про лихі наміри; його лють ледве вдавалося стримати. Він зажадав, як завжди, віддати належну частку. У незвично зухвалому вияві непокори вони відмовили просто в його спотворене безумством обличчя. Тріснута маска людяности нарешті злетіла зовсім, оголивши кипуче божевілля: він наказав стратити всіх як зрадників, а здобич передати йому особисто. Подальше видовище було жорстоким і скінчилося тим, що всіх непокірних бандитів понівечили так, що й матері не впізнали б."
 DRL.345.a: "Схоже, п'ятдесятьох і далі бракуватиме."

 DRL.346.t: "Стару таємницю розгадано"
 DRL.346.d: "Пробиваючись крізь Чорну Гору, люди Дірлеванґера зустріли кілька знайомих облич. Виявилося, близько п'ятдесяти колишніх бандитів Бригади опинилися в катакомбах темної гори: багато хто вже мертвий, інші ув'язнені, багатьох знайшли на різних стадіях експериментів. Їхні жалюгідні благання про смерть задовольнив безсторонній тріск бандитських пострілів. Кільком удалося уникнути цієї огидно жорстокої долі: вони працювали в Лисенка охоронцями, але таких щасливців була виразна меншість. Один солдат здогадався звірити їх зі списком зниклих під час давнього перерахунку, і справді - усі п'ятдесят були в ньому. Їх нарешті знайшли, хоч для багатьох запізно. Більшості живих дозволили повернутися до Бригади, й вони розповідали безліч жахливих історій про експерименти та безумство Лисенка. Тих, хто став охоронцем, оголосили зрадниками й узяли в полон, виставили рівними рядами та розстріляли кожного другого. Помилувані, з обличчями в сльозах і шмарклях, мусили кожен затягти мертвого товариша до гірських камер, які стерегли. Їхня доля, ймовірно, буде нещасливою: їсти зможуть лише тіла колишніх друзів. Щоб тримати всіх залізною рукою, треба подавати приклади. Навіть після цієї знахідки, так давно по перерахунку, в списку ще лишаються незнайдені імена."
 DRL.346.a: "Після стількох років..."

 DRL.347.t: "Так близько"
 DRL.347.d: "Ще двадцятьох людей, яких забракло під час перерахунку, нарешті знайшли в численних окремих випадках. Це ті, хто дезертирував і приєднався до інших, дрібніших банд. Коли декотрі з тих угруповань знищили чи поглинула Бригада Дірлеванґера, зниклих знову виявили й належно покарали за дезертирство. Декого не бачили роками, і те, що їх знайшли цілком випадково, показує: імовірно, багато зниклих просто дезертирували, а декотрих можуть ніколи не знайти. Хтось, можливо, вже за сотні чи тисячі миль звідси, грабуючи й перебираючись в інші регіони хаотичної Росії. Та ми все одно зуміли знайти тих, хто так довго зникав, і це вже саме по собі досягнення."
 DRL.347.a: "Нарешті попалися!"

 DRL.348.t: "Стару таємницю не розгадано"
 DRL.348.d: "Оскар Дірлеванґер порпався в паперах перед собою, шукаючи стару мапу Росії, яка йому подобалася. На ній усі села, пограбовані станом на кілька років тому, були позначені маленькими хрестиками пера. Він хотів подивитися, які вже могли досить оговтатися, щоб напасти знову. Серед пошуків погляд зачепив іншу пачку старих паперів. Він витяг її з-під стосу вкрай застарілих креслень бомб, щоб глянути, що це. Список імен, кожне закреслене чорним чи червоним чорнилом. Дірлеванґер усміхнувся. Давній список тих, кого забракло під час перерахунку. Він переглядав сторінки, вчитуючись у кожне ім'я, та на третій усмішка зникла. Кілька імен були не закреслені, а обведені. Зниклі, яких так і не знайшли. Він порахував необведені імена: їх було близько п'ятдесяти.\n\nДірлеванґер роздратовано відкинув папери, але далі порпаючись уже не міг зосередитися. Як вони посміли втекти від нього й лишитися безкарними! Ох, якби знати точні місця, знайти кожного, покарати власноруч... Він марив повішеннями, розстрілами, катуваннями, криками про милосердя. Зосередитися на пошуках мапи вже не виходило. Схопив старий список і пішов шукати того, хто зможе щось удіяти. Ці люди ще не вільні. Ніхто від нього не вільний."
 DRL.348.a: "Але ж, пане, вони, мабуть, уже всі мертві!"

 DRL.349.t: "Огляд зброї"
 DRL.349.d: "Село було палахким пеклом. Чоловіки тікали, діти безпорадно кричали, і сморід смерти просякав загиблий рай. Колишніх мешканців, незалежно від віку чи обставин, воїни темряви безжально різали, ретельно обшукували тіла на коштовності, а тоді недбало кидали в попіл того, що колись було «домом». Рейд удався приголомшливо, і коли збожеволілі воїни почали тішитися плодами праці, над мерцями вчинили нові жахливі й невимовні збочення.\n\nЗа кілька годин після оргії насильства втомлені воїни відпочивали при в'їзді до села, емоційно й душевно виснажені денним кровопролиттям і розпустою. Надвечір повітря наповнив дивний спокій, нарешті запанував мир. Та нічну тишу розірвало прибуття командира до колишнього села. Коли оберфюрер Дірлеванґер підійшов до відпочивальників, його шалене обличчя освітлювали смолоскипи; він моторошно заверещав, і люди раптом прокинулися. Поки вони, заточуючись, підводилися, оберфюрер оголосив час огляду зброї, і приголомшені, виснажені люди швидко стали на місця.\n\nНевдоволений оберфюрер ішов від одного до іншого, оглядаючи зброю й безперервно лаючи вірних воїнів. Солдати стояли, заціпенілі від неймовірного страху, поки Дірлеванґер мовчки роздивлявся. За кілька хвилин роздумів підняв правицю й вибрав зі строю кількох солдатів. Із завіси темряви вийшла розстрільна команда, механічно піднесла зброю й прицілилася в обраних. Та оберфюрер іще не був задоволений. Покликав командира рейду та його підлеглого й коротко, але напружено розпитав обох. Хоч обидва мали значний хист, Дірлеванґер міркував, чи не стратити й їх, щоб подати ще один приклад тим, кого попередні страти оминули..."
 DRL.349.a: "Убити й офіцерів."
 DRL.349.b: "Змилуйтеся над ними, вони не завдали шкоди."

 DRL.351.t: "Записка"
 DRL.351.d: "Боже, прости мене, я не знаю, хто це знайде.\n\nВони забрали все. Дім, моїх людей, засоби до життя. Дружину й дітей. Боже, Маріє, пробач мені. Якби ж я міг щось зробити. Якби був там, коли це сталося... Тепер уже запізно.\n\nЯ не всіх знайшов. Маленька Міша... її немає. Ніде не можу знайти тіла. Моя наймолодша донечка. Їй одинадцять. Навіть думати не хочу, чи вони її забрали. Чи навіщо. Чи що тепер із нею роблять.\n\nМені тут нічого не лишилося. Село палає. Пишу здалеку й дивлюся, як горить мій дім. Усе, що маю, - одна рушниця й одна куля, і я знаю, що робити з обома.\n\nСподіваюся, наступне життя буде до мене добріше за це. Пробачте.\n\n-Ґріґорій Арбузов"
 DRL.351.a: "Memento Mori."

 DRL.352.t: "Кінець супрематизму"
 DRL.352.d: "На садибу напали опівночі, не дбаючи про скритність: трощили вітражі будівлі з єдиною метою - стратити біженців, що ховалися всередині, та самотнього совєцького генерала, який тримав маєток. Грабуючи кожну кімнату, п'яні рейдери цілковито байдуже ставилися до великої мистецької збірки й нестримно нищили твір за твором. Та на мить руйнування спинилося: перед однією картиною стояв старий, ридаючи й благаючи пощадити її. «Старий виродку, що це таке?» - розгублено гаркнув Дірлеванґер.\n\nЧоловік упав навколішки, благаючи вберегти головний твір батькового життя. Банда дивилася на абстрактну, беззмістовну композицію, гидливо кривлячись. «Та це ж просто йобаний чорний квадрат!» - заволав бригадник, викликавши несамовитий регіт. Вони приготували рушниці й почали випускати сотні куль у чоловіка та дегенеративне мистецтво, шматуючи фарбу й роздираючи полотно. Невдовзі погром продовжився, аж доки його завершив запалений сірник.\n\nКоли особняк охопило полум'я, один солдат побачив щось у диму. Щось, що різко вирізнялося з-поміж решти: примару, яка так сильно контрастувала з небом, що досконалішої, вищої полярности неможливо було й уявити. Коли він озирнувся, вона зникла. Сновидне царство аванґарду розвіялося. Лишається лише дійсність."
 DRL.352.a: "Прощавай, визволене ніщо."

 DRL.353.t: "Незабутня ніч"
 DRL.353.d: "Наприкінці останнього рейду бандити Бригади ледь вірили своїй удачі. У льосі старої ґуральні знайшли величезний запас спиртного, який якось не розграбували за десятиліття від розпаду Росії. Повернувшись із горою здобичі й полонених, Дірлеванґер проголосив, що цієї ночі буде найбільша гулянка в історії Росії.\n\nГорілка лилася рікою, здобич роздавали направо й наліво. Люди Бригади швидко напилися до нестями, втративши рештки стриманости. Із заходом сонця табір поринув у какофонію дикого святкування, безглуздого насильства й невимовної розпусти. Полонених мучили ще жорстокіше, ніж банда звикла, і до ранку мало хто мав лишитися живим, а ще менше - радіти цьому. Невдовзі ніч розчинилася в іще густішому тумані хаосу, коли через вичерпання спиртного почалися бійки. Вперше за десятиліття вулиці Орска ожили, хоча й звуками глузування, криків і смерти.\n\nКоли похмуре небо почало світлішати зі світанком, люди Бригади прокинулися розпатлані, похмільні й похмурі. Кров, випорожнення та інші рідини забризкали вулиці, подекуди валялися тіла загиблих у нічному хаосі чи від простого алкогольного отруєння. Прибирати майже не стали, і невдовзі бандити просто повернулися до звичних, узгодженіших жорстокостей, сподіваючись не накликати гніву Дірлеванґера, в якого розколювалася голова."
 DRL.353.a: "Що сталося в Орску, лишається в Орску."

 DRL.354.t: "Останній бій"
 DRL.354.d: "Удалині здіймався дим, тепер уже всього за кілька годин ходи. Село повнилося криками й метушнею: нажахані мешканці збирали все, що могли нести, й кидалися на дорогу до безпеки. Жінки й діти несли дорогоцінні реліквії, які зберігалися в родинах десятиліттями, а то й століттями.\n\nПоки дружини й діти евакуювалися, чоловіки кричали й отримували накази, перекидали одне одному зброю та оглядали те, чим мали битися. Багато рушниць були в жалюгідному стані, не використовувалися від Світової війни й призначалися лише для полювання. Та зброя є зброя, і навіть власники мисливських рушниць не нарікали. Лише заряджали й нервово дивилися на вбогу пайку набоїв. Запаси й так малі, а ще треба неодмінно залишити одну кулю на найгірший випадок.\n\nЧоловіки похмуро займали позиції. У глибині душі всі знали, що не виживуть. Якщо не станеться божественного втручання, це їхній останній бій. Себе не врятувати, але ще можна виграти час для родин. Вони подбають, щоб власна смерть була якнайповільнішою, якщо це дозволить іще раз прицілитися й натиснути спуск.\n\nУдалині заледве почулося гудіння моторів. Саморобні ополченці разом замовкли. Чути було лише важкі машини й самотню сумну пісню одинокого птаха. Чоловіки припали до прицілів і приготувалися дати останній бій."
 DRL.354.a: "Тримайтеся..."

 DRL.5000.t: "Після удару"
 DRL.5000.d: "Це нагадувало пишномовне, моторошне зображення пекла. Жадібні тонкі язики полум'я простягалися й розгорталися в нічному небі, дряпаючись утекти з жалюгідної землі, що їх породила. Метушливі істоти внизу відкидали жахливий театр тіней на засолені пасовища за яскраво палаючим селом. Колишні добірні есесівці й безжальні російські бандити тепер були жалюгідним відблиском колишньої сили, що вселяла страх і трепет, проте зберегли моторошне заперечення будь-яких звичайних моральних норм. Жодна бідна душа не лишилася живою, коли бандитська пошесть накрила малу сільську громаду в пошуках придатного місця зустріти власну загибель.\n\nДехто дезертирував, інших стратили, і тепер лишилися найрішучіші та найстійкіші вбивці, яких могла дати Бригада. Попри це, люди, що сходилися на завбачливо незачепленій сільській площі, почали вперше сумніватися в результаті завтрашньої битви. Їхні лави поріділи сильніше, ніж будь-коли за хижого розгулу російськими рівнинами. Навіть за повного складу шалена лють переслідувачів обернулася б пірровою кривавою бійнею, а тепер це може стати просто однобічною різаниною. Та вони все одно готувалися до загибелі. Ці прокляті душі вже не могли втекти від долі."
 DRL.5000.a: "Куди тепер?"

 DRL.355.t: "Нова гра"
 DRL.355.d: "Бригада Дірлеванґера мала звичку добряче прикладатися до пляшки. Більшість про це знала, а найкраще - нещасні, чиї домівки грабувала армія п'яниць із кулеметами.\n\nЗвісно, це не означало, що Бригада не любила своєї справи. Навпаки, багато хто смакував грабунок і зґвалтування в російських пустках. Та на велику полегкість сусідніх сіл були й інші способи згаяти час.\n\nОдин німецький солдат вигадав нову питну гру, російська частина забезпечила крадену горілку - й так народилася чудова нова традиція. Бригада повторюватиме її ще довго, а в подальші роки - й безпринципні американські студентські братства. Справжню суть гри час зітре, але майбутні версії загалом зійдуться на тому, що в ній беруть участь живий голуб, перо з чорнилом і мурашник.\n\nНевдовзі тієї першої доленосної ночі «ігрова» частина святкування швидко скінчилася й розчинилася в дикій, розпусній гулянці, якої не бачили роками. Несамовитий регіт було чути за милі."
 DRL.355.a: "Передай чарку, хочу спробувати..."

 DRL.356.t: "Бійка, що жахливо вдалася"
 DRL.356.d: "Хоробрі бійці Бригади Дірлеванґера завжди знайдуть привід святкувати: вдалий рейд, день народження товариша, річниця якоїсь перемоги, вівторок - будь-яке виправдання. І завжди на цих святкуваннях гори горілки. Сьогодні гуляли знову, цього разу за успішне вибивання загоном із місцевої ферми місячного запасу зерна й картоплі, срібної рамки для фото та золотої пряжки. Як завжди, все почало виходити з-під контролю. Непристойні жарти про розміри чужого чоловічого достоїнства й привітність матерів сприйняли серйозно, і невдовзі спалахнула бійка. Двоє бандитів качалися в багнюці, п'яно викрикуючи лайки й погрози, й швидко стали головним видовищем для всіх товаришів того вечора.\n\nРаптом ніч розітнув постріл, урвавши веселощі. Один із бійців стояв навколішки, ошелешено втупившись у револьвер Наґана, що якось опинився в його руках. Суперник лежав долілиць, із рота текла цівка крови. Вцілілий, хитаючись, підвівся й штовхнув нещасного носаком чобота, белькочучи: «Ваню? Ти як? Тобі проспатися треба?» Не почувши відповіді, побрів геть і сів за стіл, повернувшись до друзів і пляшки горілки, від яких його так грубо відірвали."
 DRL.356.a: "Він же просто дрімає, так?"

 DRL.376.t: "Невідомий солдат"
 DRL.376.d: "Йорґ був взірцевим представником Бригади Дірлеванґера. Жорстокий, неохайний і позбавлений будь-яких чеснот, зокрема терпіння. Тож коли він і четверо товаришів почали відставати від решти рейдерів, бо п'ятий - казах Ершат - зупинився справити нужду, Йорґ пригрозив відтяти йому геніталії, якщо не поквапиться. Тоді вони його й побачили.\n\nУ високій траві метрів за п'ятдесят сидів один із тих правильних до нудоти уральських гвардійців, спостерігаючи за загоном і, мабуть, рахуючи людей для донесення. Зрозумівши, що його помітили, безіменний солдат швидко, але спокійно вискочив зі схованки й почав відступати за кряж позаду. Удо, чия надзвичайна жорстокість дорівнювала розумовому потьмаренню від багаторічного зловживання речовинами, радісно заревів, передчуваючи легке вбивство, і кинувся навздогін. Не бажаючи пропустити криваву розвагу, Йорґ і решта швидко рушили слідом.\n\nПолювання почалося.\n\nЛюди палали завзяттям і швидко дістали зброю, та солдат напрочуд спритно пригинався й петляв між скелями й деревами. Стріляли багато, але ніхто не влучив, тож Ральф по-дурному спробував пожбурити порожню рушницю в ціль - марно. Зрештою погоня привела їх до покинутого совєцького військового комплексу.\n\nҐюнтер і Марк майже схопили здобич біля вартівні, та солдат із тривожною спритністю перестрибнув замкнену браму й невдовзі зник у плутанині будівель."
 DRL.376.a: "Куди подівся виродок?!"

 DRL.377.t: "Розділити загін"
 DRL.377.d: "Озирнувшись туди, звідки прийшли, люди швидко зрозуміли, що справді й остаточно загубили решту рейдерів. Дірлеванґер напевне здере з них шкіру, якщо повернуться простими дезертирами, - та, може, живий полонений солдат найненависнішого ворога, нова іграшка для ватажка, вгамує його гнів?\n\nЙорґ знайшов пролом у гнилому паркані, яким гурт і проник усередину. Вийшовши на невелике поле біля старих казарм, вони швидко зрозуміли, що комплекс доволі великий. Ціль може бути будь-де, і, якщо не пильнувати, він просто прослизне повз них і вийде тією ж дорогою. Тоді Ральфові спало на думку розділитися й розійтися комплексом. Зрештою, що швидше знайдуть, то швидше зійдуться й виб'ють із нього душу.\n\nЛюди погодилися. Йорґ, Марк і Ральф вирішили обшукати казарми, а Ґюнтер узяв Удо оглянути адміністративну будівлю. Коли Ершат зібрався за ними, Йорґ відштовхнув його й поставив стерегти браму, щоб здобич не вислизнула там. Якщо солдат знову спробує браму, вони легко знайдуть його за криками казаха. Розподіливши ролі, три групи розійшлися полювати на безіменного солдата.\n\nНіхто не помітив солдата в тіні, що дивився на них зі старої сторожової вежі. Крізь вузьку щілину забрала він спостерігав, як групи розходяться, відзначав їхні шляхи й запам'ятовував згори розташування бази. Продумував вузькі місця. Визначав місця засідок.\n\nЗадумував для кожного наймоторошніший кінець."
 DRL.377.a: "Виходь, виходь, де б ти не ховався..."

 DRL.378.t: "Смерть згори"
 DRL.378.d: "Ершат палав люттю, коли Йорґ та інші пішли. Час у Бригаді був сповнений кровожерних різанин і невимовних утіх, та він повсякчас ненавидів німців і їхнє самовдоволене відчуття вищости над ним та іншими казахами. Майже надумав лишити їх із безглуздою погонею й утекти. Ніхто не мусить знати, що він колись був із бандитами. Можна податися на південь і осісти при тих, хто нині контролює Казахстан.\n\nЗвісно, Ершат був боягузом, який чіплявся за Бригаду, бо волів бути з нею, а не проти неї. Тож зробив, як наказано. Як завжди.\n\nРаптом увагу привернув скрип дерева. Обернувшись на звук, він побачив темну постать, що швидко зникла в невеликому сараї для інструментів; двері зачинилися за нею. Нарешті нагода себе показати! Ершат кинувся до сараю, готуючись здолати солдата й показати здобич пихатим німцям. Вибивши двері, підніс шаблю для удару, і -\n\nСарай був порожній. Вікон не було, а крім кількох куп старих інструментів, ховатися ніде. Ершат люто й недовірливо дивився в порожнечу, принижений власною дурістю, і починав думати, чи не мають німці рації.\n\nСаме тоді відчув найдивніше бажання глянути вгору.\n\nТам, упершись усіма чотирма кінцівками в стіни сараю, завис той пекельний солдат; обличчя в масці безвиразно дивилося згори. Це стало останнім, що побачив Ершат: постать кинулася вниз і встромила йому кинджал крізь череп."
 DRL.378.a: "АААІІІЄЄЄ!"

 DRL.379.t: "Довге падіння"
 DRL.379.d: "Підіймаючись вузькими сходами, Ґюнтер міркував, як узагалі можна зараз ненавидіти Удо ще більше, ніж зазвичай. У тісному просторі сморід немитого бандита був нестерпний. У пошуках той майже не допомагав: дурневі з потьмареними мізками більше подобалося трощити випадкові меблі. Ґюнтер уже майже надумав нарешті вбити його й звалити на солдата, якби Удо не був таким страхітливо й грубо сильним, що міг роздерти його навпіл.\n\nОбшукуючи верхній поверх, Ґюнтер визирнув у вікно й оглянув табір. Тоді помітив, що Ершата біля брами вже немає. Настрій погіршав іще більше: подумки постановив вибити нікчемному казахові кілька зубів, коли зберуться. Саме тоді вловив ледь чутне потріскування й розколювання дерева на сходах. Він кинувся перевірити, але мало не перечепився через Удо, що навколішки хихотів над залишеними фотографіями голих жінок.\n\nПерш ніж остаточно зірватися й розтрощити дурневі голову, він зиркнув на сходи й зустрівся поглядом із невідомим солдатом, який без жодного видимого почуття дивився на нього. Обидва бандити майже одночасно рвонули до нього, та ніколи б не дістали. Раптом щось тріснуло, підлога під ними провалилася, й обоє полетіли на поверх нижче. Удар був таким сильним, що пробили й цю підлогу та купою впали на найнижчому поверсі.\n\nҐюнтер кричав від болю: рука й нога зламані в кількох місцях. Удо лежав у судомах, величезна скалка пробила мозок. Поки Ґюнтер кликав на допомогу, солдат спустився сходами, відкинувши пилку, якою підпиляв дошки. Зброя лежала поза досяжністю, і Ґюнтер міг лише дивитися, як солдат ногою заганяє скалку глибше в Удів череп, а тоді бере лопату й раз у раз б'є Ґюнтера по голові."
 DRL.379.a: "Ні, стій! Ми можемо-!"

 DRL.380.t: "У стік"
 DRL.380.d: "Інші троє бандитів нишпорили казармами, перевертали старі ліжка й роздирали запилені шафи в пошуках утікача. Оглядаючи будівлі, Ральф натрапив на старі приміщення, зокрема їдальню й спільні душові. Коли з цікавістю міркував, чи душі ще працюють, з іншого краю бази долинули жахливі горлові крики й далеке гуп, гуп, гуп лопати.\n\nЙорґ і Марк кинулися на звук, але Ральф був певен, що вони впораються. Зрештою, це лише один солдат, що він зробить проти німецьких вовків? Увійшовши до сирої затхлої душової, він почав випробовувати душі по черзі. Розчарування зростало: жоден не давав обіцяного струменя, аж доки в одному дивом знайшлося трохи води в баку. Цівка була вбога й дуже холодна, але для бандита, вкритого брудом і плямами гріхів, стала освіжливою полегкістю.\n\nРальф умивав обличчя й руки, блаженно не помічаючи постаті, яка поволі підкрадалася ззаду. Надто пізно побачив тінь на стіні, кинуту світлом із дверей. Тінь клинка, піднесеного для удару. Обернувся саме тоді, коли лезо вп'ялося в груди. Невтомна постать у масці знову піднесла клинок і встромила. І ще раз. І ще. Ральф кричав у муках, кволий спротив слабшав із кожним ударом.\n\nНарешті він сповз на підлогу, життя згасало, а Ральф дивився, як постать спокійно відвертається від моторошного видовища й виходить. Останню цівку крови з його тіла останні рештки води понесли у стік."
 DRL.380.a: "Геть від мене, психопате! ААРҐХ-"

 DRL.381.t: "Звести порахунки сокирою"
 DRL.381.d: "Марк заревів від люті, побачивши розмолочені тіла товаришів. Уже не дбав, чи привезе здобич до табору живою, чи кривавими шматками. Щоб слов'янин так упирався й відмовлявся здатися вищим німецьким воїнам - тяжчої образи не уявити. Він уявив, як ловить нещасного й сміється з його благань про милосердя.\n\nПоки Йорґ почав складати план, звідти, звідки вони щойно прийшли, пролунав новий жахливий крик. Рішуче налаштований цього разу впіймати виродка, Марк вибіг із будівлі, Йорґ ледве встигав. Помчали відкритою травою, сподіваючись прямим і стрімким нападом здолати ворога.\n\nЗненацька з-за казарми гримнув постріл: куля просвистіла ледве над Йорґовою головою й урізалася в траву. Застукані на відкритому місці, обоє відчайдушно кинулися за казарму, а Йорґ відповів із люґера. Та Марк не встиг: куля вдарила в ногу й повалила його.\n\nПоки Марк кричав від болю, Йорґ обернувся саме вчасно, щоб побачити солдата, який виходив і з неприродною впевненістю прямував до них. Він підніс люґер, але вилаявся: порожня зброя лише клацнула. Відступивши за найближчу будівлю, заходився перезаряджати й усвідомив, що запасні набої лишив у припасах рейдерського загону.\n\nМарк корчився долі, поки постать наближалася. Відклавши рушницю, солдат дістав із пояса гостру сокиру й приготувався замахнутися. Жалюгідні благання про милосердя не спинили сокири, що врізалася в груди, в руку, в обличчя."
 DRL.381.a: "Ні! Прошу, прошу! НІІІІІ-"

 DRL.382.t: "Мисливець і здобич"
 DRL.382.d: "Товариша порубали в нього на очах, набої скінчилися, і Йорґ завмер, відчувши те, чого не відчував дуже давно.\n\nСтрах.\n\nПостать, чиє забрало спереду тепер було заляпане кров'ю та нутрощами Маркового понівеченого тіла, поволі підняла погляд на нього. Мить нерухомости. Ніхто не ворухнувся.\n\nСолдат кинувся вперед. Йорґ побіг у цілковитому жаху.\n\nРятуючи життя від маніяка із сокирою, що гнався слідом, він проминув душову й краєм ока побачив закривавлений труп Ральфа. Погоня повела й повз сарай, де Ершат зустрів гіркий кінець. Йорґ швидко збагнув справжню небезпеку свого становища. Зграя із шістьох полювала на самотнього вовка, але тепер лишився тільки він, і мисливець став здобиччю.\n\nПідбігши до паркану, яким увійшли, він жахнувся й закричав: переслідувач мав кляту передбачливість перекрити і цей шлях. То не людина, а розважливий демон - чи, ймовірніше, янгол, - посланий покарати його за гріхи.\n\nБільше не маючи куди тікати, він кинувся до старого автопарку з кількома розбитими вантажівками й спробував загубити переслідувача між перешкодами."
 DRL.382.a: "Що ти таке?!"

 DRL.383.t: "Останній опір"
 DRL.383.d: "Присівши за старою транспортною машиною, Йорґ відчайдушно намагався не дихати. Він чув кроки невідомого солдата, який методично й цілеспрямовано обходив кожну вцілілу вантажівку в пошуках здобичі. Відчайдушно озираючись за будь-чим помічним, Йорґ помітив стару монтировку під своїм укриттям.\n\nОбережно взявши її, поволі прокрався за вантажівку, сподіваючись заскочити переслідувача зненацька. Терпляче дочекався, поки той пройде, і зібрався з духом. Стиснувши зброю, рвучко замахнувся з-за вантажівки, і-\n\nТам нікого не було.\n\nМав лише мить розгублености, перш ніж почув свист повітря позаду. Йорґ пригнувся саме вчасно: лезо сокири промайнуло за дюйми й із тріском урізалося у вікно вантажівки. Він обернувся й ударив ворога монтировкою збоку по голові. Звісно, забув, що супротивник носить товстий гвардійський шолом із забралом. Солдат лише тихо хмикнув від подиву. Навіть розваги.\n\nВідкинувши сокиру, солдат схопив Йорґа за шию й почав стискати. Задихаючись, той люто розмахував зброєю, сподіваючись уразити вразливе місце. На коротку мить крізь забрало побачив очі солдата й уперше розгледів палючу, злісну ненависть.\n\nПідсічкою йому вдалося вивести солдата з рівноваги, і обоє повалилися на землю. Тепер без зброї вони відчайдушно билися навкулачки, щосили гамселячи одне одного. Жбурляли й перекидали один одного, і кожен залився кров'ю.\n\nЗрештою на ногах лишиться тільки один."
 DRL.383.a: "Здохни, проклятий!"

 DRL.384.t: "Останнє послання"
 DRL.384.d: "Коли Оскар Дірлеванґер прокинеться наступного дня, підлеглі доповідатимуть про кількох зниклих учасників останнього рейду. Напевне, дезертири. Він поклянеться вирізати їх, якщо повернуться, й на тому все. День мине, Дірлеванґер і далі житиме грішним життям, а зрештою знову засне.\n\nПрокинувшись іще через день, він вийде з намету на гучну метушню. Люди поведуть його за табір до моторошного видовища. Шість дерев'яних кілків. На кінці кожного насаджена голова зниклого. Одна з кинджалом крізь череп. Одна зі скалкою в мозку. Одна з розтрощеним черепом. Одна напрочуд чиста. Одна забруднена власною кров'ю й нутрощами.\n\nІ одна побита, розчавлена й поламана до невпізнання.\n\nДірлеванґер на мить замислиться над цим видовищем. Тоді зниже плечима й накаже всім повернутися до справ. І далі житиме грішним життям, а зрештою знову засне. Голови лишатимуться на кілках, мовчки чатуючи над табором наступного дня, і наступного, і наступного, доки рештки плоті поволі не сповзуть.\n\nУдалині невідомий солдат спостерігатиме за табором. Бачитиме, як мало Дірлеванґер зважає на пересторогу. І тоді знатиме: той зрозуміє послання лише тоді, коли кожного до останнього з його кошмарної орди вистежать і знищать."
 DRL.384.a: "Ще один день у Росії."

 DRL.385.t: "Утеча?"
 DRL.385.d: "Йорґ заточився до покинутої фермерської хати й повалився на підлогу, важко дихаючи.\n\nЛедве втікши живим із військової бази, колись незворушний і жорстокий бандит тепер лежав, майже ридаючи від пережитого потрясіння. Семеро загартованих людей Бригади проти одного чоловіка з жіночної Ліги - і такий результат? Якби він повернувся, Дірлеванґер радше наказав би вбити його просто за ганьбу, ніж за дезертирство.\n\nВтішався простим знанням: чоловік-звір, із яким билися, більше не проблема. Востаннє бачив солдата на землі, де той рясно стікав кров'ю, зламаний уламок людини. Міркуючи про наступні кроки, озирнув хату й зауважив, що це непогане місце для життя. Можна залягти тут на кілька місяців, а потім пристати до однієї з інших відколотих банд і повернутися до життя грабіжника.\n\nЙорґ забрався в старе ліжко й щосили намагався заснути.\n\nСон не триватиме всю ніч.\n\nЙорґ прокинувся й побачив чоловіка в масці, що дивився на нього згори над ліжком. Хоч увесь у вм'ятинах і засохлій крові, солдат був цілком живий.\n\nЙорґ закричав, коли невідомий солдат люто гамселив його тією самою монтировкою, якою він колись ударив сам, аж доки крики стихли й Йорґ нарешті заснув навіки."
 DRL.385.a: "Тільки не ти! Чому ти не здохнеш! АААХ-"

 DRL.400.t: "Прихильники Лисенка тікають на південь"
 DRL.400.d: "Темної ночі під Орском до табору бандитів Оскара Дірлеванґера прийшов гурт загадкових людей. Відчайдушні душі з виснаженими поглядами й голодними тілами говорили незрозумілою мовою та обурливо наполягали, щоб вартові дозволили зустрітися із самим королем бандитів. Стримуючись від бажання відразу вбити їх і забрати вишукані технічні іграшки, охоронці спершу не розуміли, як хтось насмілився щось таке вимагати від найстрахітливіших злочинців півдня Росії. Лише впізнавши деякі слова, збагнули: це маґнітоґорські науковці, що рятуються від долі з рук колишніх своїх посіпак у НКВД.\n\nУцілілі лисенківці Маґнітоґорска, довідавшись про жалюгідну долю товаришів у руках НКВД, негайно покинули лабораторії й заводи, забравши найцінніше в сибірські нетрі. Усвідомлюючи, що за найжахливіші злочини жодна притомна громада не прийме їх, науковці спробували знайти притулок у таборах Дірлеванґера, гадаючи, що Чорний Бандит знайде застосування знанням і пощадить їх.\n\nДізнавшись про гостей, Дірлеванґер негайно наказав забрати все їхнє майно й роздати табором, а нових посіпак змусив налагодити масове виробництво зброї та припасів, поводячись із новими слугами гірше, ніж із рабами. Без сумніву, весь процес давав йому садистську насолоду: під жорстокою владою тепер були ті самі люди, які глузували з нього як із неписьменного варвара. Для самих колишніх лисенківських науковців уже нічого не важило. Лише виживання."
 DRL.400.a: "Як низько впали могутні."

 #Actual Dirly Death Events
 DRL.401.t: "Пречудова диявольська пастка!"
 DRL.401.desc: "Після розриву стосунків Лисенка з Бригадою Дірлеванґера відкритий конфлікт став практично неминучим. Проте мало хто сподівався, що Дірлеванґерові вистачить нахабства вдертися просто на саму Чорну Гору, та король бандитів із людьми все одно спробував захопити вершину. Надійшли повідомлення про величезні втрати, і хоча Бригада зрештою пробилася всередину комплексу, десятки бандитів загинули від пасток, установлених роки тому саме на такий випадок. Серед жертв підступних пристроїв був і Дірлеванґер: пастка з натискною пластиною на дверній ручці раптово вразила його потужним смертельним струмом. Його банда хоч і захопила гору, вже загрузла у внутрішніх чварах за трофеї."
 DRL.401.a: "Шокуюча смерть."

 DRL.402.t: "Вістря ножа"
 DRL.402.desc: "Банда Дірлеванґера прокинулася приголомшеною: ватажка знайшли мертвим - уві сні його закололи старим багнетом у спину. Особа вбивці невідома, та багато хто вважає, що це зробив дивний чоловік, що вільно говорив німецькою, який напередодні з'явився біля табору. Багато хто вважає його аґентом якогось нацистського чиновника, що хотів смерти Дірлеванґера, аби перебрати контроль над бандою.\n\nСеред бандитів швидко запанував хаос, але невдовзі прибули німецькі аґенти й запропонували роботу, і тепер багато хто поволі повертається на захід із новим завданням."
 DRL.402.a: "Насильницьке життя скінчилося насильством."

 DRL.403.t: "Кам'яний кінець"
 DRL.403.desc: "Сьогодні неминуче, здавалося, зіткнення Чорної Гори й Бригади Дірлеванґера сягнуло вершини. Після розриву стосунків Дірлеванґер із людьми штурмував Чорну Гору, найімовірніше прагнучи схопити й стратити Лисенка, божевільного науковця, що живе в горі-лабораторії. Невдовзі після бою із залишками 22-ї мотострілецької дивізії НКВД, яка охороняє Лисенка та його експерименти, повідомили: люди Дірлеванґера прорвалися крізь комплекс із надзвичайно тяжкими втратами з обох боків.\n\nНа лихо Дірлеванґерові, ні він, ні його бандити не знали про численні сховані в комплексі пастки. За хитрим задумом кілька полонених мотострілецької дивізії скерували його з людьми до дверей, нібито за ними була кімната «з усіма багатствами Маґнітоґорска». Та в довгому лабораторному коридорі до тих дверей один бандит ненароком натиснув плиту. Над Дірлеванґером та його особистою охороною швидко відчинився люк, звідки ніби нізвідки впали кілька важких брил, миттєво й моторошно вбивши загарбників.\n\nПісля звістки про смерть ватажка серед рейдерів почалися чвари, що дало людям Лисенка перевагу. Після шести годин запеклих боїв Бригада Дірлеванґера мусила відступити з гірського комплексу, зализувати рани й поволі розпадатися."

 DRL.403.a: "Дірлеванґер що, обдовбався?"
 DRL.404.t: "Божевільний герой Сходу" #-charlesthe50th
 DRL.404.desc: "Дірлеванґер нещодавно роздобув коня й назвав Завоюванням Уралу, або коротко Уралом. Найкращий серед тих, на яких він натрапив, нишпорячи прикордонням власних володінь, це був прекрасний чорний жеребець із трикутною міткою на голові. На тлі буро-жовтих рівнин він виблискував кістлявою красою. Прочитавши стару невелику брошуру про козаків, Дірлеванґер вирішив наслідувати їхні відважні атаки. Осідлав жеребця, роздав найкращим підлеглим поні й разом із почтом поїхав до уральського табору. Так рішуче шмагав коня, прагнучи здолати ворогів, що навіть оборонці здивувалися швидкості з огляду на його вік. Раптом кінь почав роздратовано брикатися. За мить Дірлеванґера скинуло, і він покотився кам'янистою землею. Чи то влучна куля вразила коня, чи він спіткнувся, чи просто перевтомився - не має значення. Важливо те, що Дірлеванґер мертвий."
 DRL.404.a: "Так само пішов Чинґіс."

 DRL.405.t: "Із розплющеними очима"
 DRL.405.desc: "Після полону в Уральської Ліги правосуддя над Дірлеванґером було швидким. Після короткого суду в одній із численних гулагівських фортець Уралу бандита витягли надвір і розстріляли, транслюючи страту старим радіопередавачем на весь південь Росії.\n\nДірлеванґер відмовився від пов'язки на очі й плюнув у розстрільну команду перед пострілами.\n\nКоли пролунали рушничні постріли, юрби по всій Росії, що слухали старі, роздобуті деінде радіоприймачі, разом вибухнули радісними вигуками. Навіть кілька керівників держав воєначальників надіслали вітання."
 DRL.405.a: "Схоже, він нарешті скуштував кулі."

 DRL.406.t: "Спитати дорогу" #-rewritten by ackbar, only fires if Dirlewanger is at war
 DRL.406.desc: "Поки розбійники билися й гинули, Оскар Дірлеванґер, схоже, волів сидіти в командному наметі й напиватися з особистого запасу спиртного. Його люди - досвідчені вбивці, а ворог - купка розхвалених селян із рушницями, тож чекали швидкої перемоги. Та навіть найкращі солдати мало чого досягнуть із некомпетентним командиром, тим паче п'яним до безпам'ятства.\n\nКоли хід битви обернувся проти нього, помічники жахалися сказати про це, боячись кулі від п'яного ватажка. Сам він помітив лише тоді, коли ворожі постріли залунали тривожно близько. Дірлеванґер, хитаючись, вийшов із намету, звалився на коня й поїхав - не в той бік. Коли наблизився до ворожих ліній, солдати ледь вірили очам: найсмертоносніший ворог їде просто до них, белькочучи німецьку застільну пісню. Лише менш ніж за десять футів від ворога нарешті зрозумів, що щось негаразд. Розгублено спитав: «Стривайте, де я?» - і солдат перед ним відповів, випустивши весь пістолет-кулемет йому в череп."
 DRL.406.a: "На дурне питання - дурна відповідь."

 DRL.407.t: "До відома всіх зацікавлених" #Gunnar Von Pontius#/LordViruscide
 DRL.407.desc: "Комюніке 22.d з канцелярії товариша Лисенка: Під час зіткнення із силами Чорної Гори, які захищали Об'єкт, німецького офіцера СС Оскара Дірлеванґера застрелено в перестрілці. Це суперечить попереднім наказам щодо Дірлеванґера. Усі алкогольні пайки скасовано на термін не менше (1) Одного Тижня.\n\nКінець комюніке."
 DRL.407.a: "Додаток: 36-та знищена як дієздатний підрозділ."

 DRL.408.t: "У пастці"
 DRL.408.desc: "Стосунки Лисенка й Дірлеванґера завжди були напружені, тож спроба Дірлеванґера штурмувати Чорну Гору не дивує. Проте, мабуть, йому варто було довше готувати напад. Сьогодні він і багато бійців Бригади зустріли моторошну долю, увійшовши до покинутої шахти, що нібито вела в саме осердя гори. Щойно зайшли, із самим Дірлеванґером попереду, вхід обвалився, розчавивши кількох бригадників і замкнувши всередині понад три чверті загону. Без припасів вони, як очікується, довго не проживуть."
 DRL.408.a: "Місцеві мали б попередити... якби ж він говорив російською."

 DRL.409.t: "Те щасливе старе сонце"
 DRL.409.desc: "Коли оголосили, що славетна сонячна гармата Ґерінґа впаде назад на Землю, багато хто відреаґував шоком і страхом: раптом упаде на людне місто або туди, де завдасть величезної екологічної шкоди. Та коли траєкторія попрямувала до Уралу, полегкість була відчутною: багато хто припустив, що вона впаде десь у цілковитій безлюдній місцевості.\n\nОднак уламки впали на півдні, й багато мешканців головного «воєнного табору» Бригади Дірлеванґера прокинулися приголомшені: палаючі уламки летіли з неба, мов Божий суд. Більшість утекла верхи чи на роздобутих машинах, але після повернення знайшла ватажка Оскара Дірлеванґера та його особистий автомобіль розчавленими величезною сонячною панеллю зі свастикою."
 DRL.409.a: "Це штука... наукова штука. Не переймайся."

 DRL.410.t: "Оце так пересторога"
 DRL.410.desc: "Після вчорашнього рясного снігопаду землю вкрила біла ковдра. Майже незаймана, крім низки... слідів. Найманець не турбувався: цією стежкою майже всі ходили до лісу. За хвилину натрапив на гілля для багаття. Перш ніж зібрати, помітив на землі червоний предмет. Піднявши, одразу зрозумів: закривавлений палець. Швидко кинув, але тоді побачив краплі крови, що вели далі в ліс. Червону стежку перекривав кущ, та найманець не збирався зупинятися й продерся крізь нього. Швидко вимастився кров'ю, якою був просякнутий кущ, але йшов далі. По той бік знайшов джерело. Ось воно, насаджене на великий дерев'яний кіл. Він упізнав голову Дірлеванґера, хоч без очей і шматка нижньої щелепи. Поруч лежали обгорілі рештки однострою; сморід сечі ясно свідчив, що його добряче зіпсували ще до спалення. Решта Дірлеванґерового тіла була розкидана галявиною за кущем. Більшу частину голого тулуба грубо прибили до дерева. З дерев звисали кінцівки, напівпоховані кишки лежали в снігу. Найманець не знав, як реаґувати, й думав лише, що не хоче такої самої долі. Тікаючи з галявини, помітив фотографію. На ній Дірлеванґер, а позаду кілька людей у масках ціляться йому в голову.\n\nУ таборі відсутність командира ставала очевидною, і багато хто вже підозрював, що він мертвий. Тож коли найманець показав світлину начальству, швидко почався хаос..."
 DRL.410.a: "Така людина наживає багато ворогів."

 DRL.411.t: "Межа"
 DRL.411.desc: "Коли Борман доручив новій дивізії таємних операцій розвідку й тактичну підтримку Уральської Ліги, багатьох розчарувало, що мандат не містив наказу зупинити Дірлеванґера й покласти край кривавому походові так званої «бригади». «Сибірський різник» надто довго ганьбив арійську расу, й чимало вищих командирів вважало його смерть необхідною, щоб змити пляму з німецької чести. Група таємних операцій «Дельта-чотири», схоже, погодилася: невдовзі після прибуття відокремилася від уральських союзників і самотужки атакувала табір Бригади Дірлеванґера.\n\nПісля майже трьох днів напружених перестрілок і тяжких втрат з обох боків із табору надійшов єдиний радіосигнал. Командир групи Мартін Валькер заявив, що «вбив виродка», й попросив негайної евакуації.\n\nЗа непідтвердженими повідомленнями, найвищі кола німецького керівництва розлючені відступом Тіньової дивізії від наказів, але якщо це правда, вони, схоже, вирішили приховати почуття й публічно привітали та вшанували капітана. Цікаво, що смерть Дірлеванґера, здається, трохи виправдала Райх в очах населення Південного Уралу, і кількість місцевих коляборантів та інформаторів помітно зросла."
 DRL.411.a: "Мабуть, почувається героєм."

 DRL.412.t: "Кінець воїна дороги"
 DRL.412.desc: "Від розпаду Совєцького Союзу російські пустки стали жорстоким, хаотичним місцем, де небезпека має мільйон різних подоб. Навіть проста розвага може загрожувати життю, як показали сьогоднішні події.\n\nСьогодні Дірлеванґер із кількома посіпаками ганяв на відновлених машинах околицями свого комплексу, змагаючись у суміші однієї частини дреґ-рейсинґу й п'яти частин перегонів на виживання. Дірлеванґер сидів пасажиром у власній переробленій машині, кричав водієві настанови й стріляв із пістолета по інших учасниках, а часом і по глядачах. Витративши набої, у нападі люті вистрибнув із кабіни, намагаючись захопити автомобіль суперника. Проте, схоже, неправильно розрахував стрибок: не влучив у дверцята й потрапив під колеса. Кажуть, він чіплявся за життя ще кілька хвилин, а останніми словами були: «Не хочу так помирати. Хочу померти історично». Після його смерти вже ширяться повідомлення про внутрішні чвари в банді."
 DRL.412.a: "Узріть його!"

 DRL.413.t: "Жах" #-Gunnar, redone by Ackbar
 DRL.413.desc: "Плануючи останній рейд на віддалені російські села біля Орска, Оскар Дірлеванґер вигадав нове: замість просто їхати чи йти можна захопити старі пароплави й грабувати вздовж річки Урал. Із настанням ночі він наполіг рухатися далі, і його пароплав поплив угору за течією; сам він не знав, що решта людей стала на ночівлю на березі. Вони спробували наздогнати ватажка, але тижнями їх дедалі більше затримували несправні двигуни, негода й напади російських партизанів.\n\nКоли нарешті знайшли пароплав Дірлеванґера, він напівзатонув біля покинутого російського села. Решта екіпажу була мертва, вочевидь від куль і багнетів. Єдиною живою людиною в селі був сам Дірлеванґер, який сидів у хатині виснажений, у маренні, напівмертвий. Його перенесли на один зі своїх пароплавів і негайно попливли вниз, сподіваючись якнайшвидше дістатися Орска й належної медичної допомоги. Проте стан Дірлеванґера погіршувався, і зрештою він помер менш ніж за день шляху до Орска.\n\nВигляд тіла, яке вивантажували в табір Бригади, одразу спричинив хаос, що швидко переріс у загальну бійку з кров'ю та смертю. Схоже, 36-та як єдине ціле померла на річці разом із ватажком."
 DRL.413.a: "Герр Дірлеванґер - він мертвий."

 DRL.414.t: "Червоне весілля"
 DRL.414.desc: "Непевний союз Дірлеванґера й Лисенка багато хто часто вважав невдалим шлюбом, позначеним явною взаємною неприязню й згубною недовірою.\n\nТа сьогодні, здавалося, для роз'єднаних партнерів усе могло налагодитися. Запрошений на Чорну Гору випробувати нову зброю, Дірлеванґер охоче погодився. Він так довго сподівався розкрити таємниці загадкової гірської фортеці й не пошкодував нічого, щоб узяти найкращих бійців. Після тривалих святкувань і захопленого розглядання нової зброї спиртне полилося, мов кров із мерця. Наркотики, випивка, жінки - здавалося, світ, бодай на хвилину, справедливий і чистий.\n\nОскарові слід було знати, що не можна втрачати пильности, навіть коли його кличе вродлива ветеранка Західноросійської війни. Лисенко за допомогою передового загону роззброїв п'яних бригадників у найуразливіші миті. Різкий вигук, змах руки, за ним тріск пострілів - і всі на поверсі лежали мертві. За повідомленнями, тіло Дірлеванґера потім возили довколишніми землями, а Лисенко переможно проголошував смерть уральського чудовиська."
 DRL.414.a: "Гора стала полем бою - ні, лігвом різника."

 DRL.415.t: "Пошматований"
 DRL.415.desc: "Сьогодні Оскар Дірлеванґер спробував прорватися до загадкового комплексу в Маґнітоґорску. Та відразу після початку експедиції одна з численних пасток Лисенка розрубала його навпіл на рівні пояса. Вона забрала ще чимало бригадників, перш ніж ті нарешті дісталися осердя. Попри перемогу, Бригада сильно ослабла й навряд чи становитиме велику загрозу."
 DRL.415.a: "Бувало й гірше!"

 DRL.416.t: "Макаров"
 DRL.416.desc: "Від розпаду Совєцького Союзу справедливий закон і правосуддя вважають мітом, давньою казкою, якій не повернутися до спустошених земель Росії. Принаймні так думала більшість мешканців розбомблених пусток. Та, схоже, правосуддя ще наздоганяє найлихіших.\n\nЯкимось чином, можливо завдяки хабарям або просто тому, що рейдери не сприйняли його серйозно, чоловік, який назвався «уральським рейнджером», увійшов до воєнного табору Бригади й викликав Дірлеванґера на дуель. Закінчивши реготати, той погодився, сподіваючись заробити тридцять шосту зарубку на люґері.\n\nОб одинадцятій двадцять дуель почалася. Уся Бригада зібралася на видовище, й багато хто гадав, що уральський рейнджер, якого дехто називав «красунчиком, блядь», от-от зустріне смерть. Та сподівання розбилися, коли рейнджер із Макаровим швидко вихопив пістолет і смертоносно влучно застрелив Дірлеванґера.\n\nКоли хаос після смерти ватажка переріс у насильство, уральський рейнджер наче зник, знову ставши частиною величезних російських пусток, і більше його ніхто не бачив."
 DRL.416.a: "Де той рейнджер узагалі ховав Макарова? У кобурі?"

 DRL.417.t: "Німецький розстрільний стрій"
 DRL.417.desc: "«Стріляй зараз чи пізніше, школяру - своя забава. Смерть усім боягузам, я зрікаюсь вашого фюрерівського двору!/» - ці слова були на вустах бунтівного офіцера СС Оскара Дірлеванґера незадовго до кінця перед німецькою розстрільною командою. Коли Райх великою силою повернувся на російські землі, можновладці Ґерманії вирішили, що непокірному батальйонові немає місця в їхньому новому порядку, і спеціальна оперативна група Вермахту здійснила правосуддя, якого так довго не могли дочекатися тероризовані ним та його людьми росіяни. Ватажок мертвий, землі окуповано, й Бригада Дірлеванґера більше не завдаватиме клопоту походові Фатерлянду в Росію."
 DRL.417.a: "Напрочуд поетично як для збоченого зрадника."

 DRL.418.t: "Подарунок Лисенка"
 DRL.418.desc: "Після завоювання Чорної Гори Маґнітоґорска Чорний Бандит улаштував для Бригади велетенський бенкет із безліччю випивки, жінок і пісень. Це була мить святкування для людей, які роками знали лише війну; світло й сміх доносилися за милі. На самому розпалі церемонії Оскар Дірлеванґер, король бандитів Уралу, вистрелив із люґера з кузова вантажівки, привертаючи увагу юрби. Та перш ніж заговорив до послідовників, ватажок Бригади терору почав кашляти червоною кров'ю. Глядачі не підходили, поки багряна рідина текла підлогою, боячись підхопити недугу поваленого коменданта, але й їх не оминула біда. Невдовзі в багатьох бригадників кров полилася з нутрощів. Небагато пережили бенкет Дірлеванґера, і ще менше знають причину жахливого видовища, та біженці поширюють чутки про зброю, яку розробляв Лисенко, на прізвисько Червона смерть: вона спричиняє подібні симптоми, і, кажуть, бригадники контактували з її піддослідними."
 DRL.418.a: "Лисенко приніс подарунок на бенкет."

 DRL.419.t: "Причини невідомі" #Lord Viruscide
 DRL.419.desc: "За повідомленнями, під час звичного переходу очищеною місцевістю Оскар Дірлеванґер, ватажок 36-ї бригади, раптом упав із сідла, і його знайшли мертвим. Причина смерти невідома: без умілих лікарів 36-та змогла лише встановити, що його не отруїли, вхідних ран на тілі немає, а шия від падіння не зламана. Подальше розслідування тепер неможливе: 36-та здебільшого розпалася в боротьбі за владу..."
 DRL.419.a: "Це мій третій найбільший страх - аневризми мозку."

 DRL.420.t: "Чисте божевілля" #-rewritten by Ackbar
 DRL.420.desc: "Оглядаючи солдатів на саморобному табірному стрільбищі, Оскар Дірлеванґер раптом схопився за лівий бік і поскаржився на біль у грудях. Його швидко повели до медичного намету, де він почав кашляти кров'ю, - охоронці відразу запідозрили не раптову хворобу, а навмисний замах на командира. Коли його готували до операції, останніми словами до хірургів перед непритомністю стали: «Сподіваюся, ви всі німці». Більше він не прокинувся.\n\nОперація зрештою не вдалася - казали, кров зібралася в легенях і задушила його, - але виявила причину смерти: шість пострілів зблизька у верхню частину спини особливими набоями 7.62 мм для револьверів Наґана. Охоронці обшукали табір, шукаючи власника відповідної зброї, і невдовзі знайшли винуватця: новобранця Івана Билінкіна, якого спіймали на спробі втекти верхи. Після короткого допиту він зізнався, сподіваючись, що совєцькі залишки півночі Росії приймуть його героєм. Серед небагатьох речей були чернетки листів до впливових осіб, зокрема генерала Ґєорґія Жукова та відомої летунки Євдокії Бочарової; в останньої навіть просив руки.\n\nНе дивно, що охоронці Дірлеванґера швидко стратили Билінкіна, діставши всю можливу корисну інформацію. Але цього забракло для відновлення порядку: Дірлеванґер не призначив наступника, й невдовзі табір охопили чвари між лейтенантами."
 DRL.420.a: "Один зі способів вразити жінку."

 DRL.421.t: "Зацькований" #- Chernobyl/Lord Viruscide
 DRL.421.desc: "Сьогодні повідомили про жорстоке вбивство сумнозвісного командира СС Оскара Дірлеванґера в його казармі на Уралі. Кажуть, Чорний Бандит завів звичку замикати полонених у маленькій кімнаті зі зграєю голодних собак. Схоже, один полонений спробував утекти й спершу штовхнув Дірлеванґера до собачої клітки, зачинивши за ним двері. Собаки, голодні після багатьох днів невдалих рейдів без їжі, напали на нього й роздерли. Коли за кілька годин це виявили підлеглі, собак негайно перебили, а між бандитами почалися чвари. 36-та дивізія розпалася в запеклому насильстві."
 DRL.421.a: "Хто від меча живе, той від... голодного пса гине?"

 DRL.422.t: "Простий, але раптовий кінець" #-Palks
 DRL.422.desc: "Сьогоднішні звістки з Уралу повідомляють про смерть Оскара Дірлеванґера, але не таку, якої можна чекати від людини з настільки страхітливою репутацією.\n\nПід час рейду на чергове село бандити Дірлеванґера були зайняті грабунком, доки не помітили відсутности ватажка. Обшукавши село, зрештою знайшли його мертвим у багнюці; неподалік трупа лежав камінь.\n\nТероризуючи вцілілих селян, щоб з'ясувати, чи бачили вони долю ватажка, дізналися: старий, побачивши страшних бандитів, які в'їжджали в село, підняв камінь і кинув у Дірлеванґера. Кидок був влучним: камінь ударив просто в голову й миттєво вбив його.\n\nДовідавшись про це й покинувши село, бандити відразу пересварилися, і бандитська армія вже починає розпадатися."
 DRL.422.a: "Оце пощастило з кидком!"

 DRL.423.t: "Передозування" #- Exocamp
 DRL.423.desc: "Хоч звістки з покинутих уральських земель часом доволі непевні, смерть Оскара Дірлеванґера, здається, підтверджена. За загальноприйнятою версією, під час рейду на село Дірлеванґер із людьми знайшов запас дезоморфіну. Визнавши його найкращою знахідкою за тижні, банда шалено взялася споживати, а сам Дірлеванґер прийняв більшу дозу, ніж будь-хто. За кілька годин його, схоже, знайшли в комі, майже без ознак життя. Невдовзі в банді почалася бійка: кожен намагався забрати решту схованого Дірлеванґером дезоморфіну."
 DRL.423.a: "Тримайтеся подалі від наркотиків, діти Росії."

 DRL.424.t: "Розкувалджений" #- DanThe#Man
 DRL.424.desc: "За повідомленнями з Південного Уралу, Оскар Дірлеванґер, страхітливий Чорний Бандит, зустрів моторошний кінець. Грабуючи село на околиці Орєнбурзької комуни, він загнав у майстерню нібито беззахисного селянина. Бачачи, як здобич зіщулилася перед ним, Дірлеванґер замислював наймерзеннішу смерть для бідолахи, аж раптом той схопив єдину доступну зброю - кувалду!\n\nСелянин насилу підіймав важке, незручне знаряддя, а Дірлеванґера неймовірно тішили кволі зусилля. Даючи зробити кілька незграбних замахів, він ревів від сміху й кілька разів легко ухилився. Так захопився веселощами, що не зреаґував, коли селянин нарешті влучив, проламавши бандитові череп і поклавши край наймерзеннішій людині Росії.\n\nХоробрий селянин швидко втік, а рейдери, виявивши смерть ватажка, невдовзі загрузли у сварках і кривавих чварах. Без Дірлеванґера колись жахлива банда негідників розсипалася й, як очікується, більше не турбуватиме людей російських степів."
 DRL.424.a: "Розгромна кінцівка."

 DRL.425.t: "Березневі іди" #-DanThe#Man
 DRL.425.desc: "Сьогодні на сході Росії почалися святкування: повідомляють, що сумнозвісного бандита Оскара Дірлеванґера вбили, і не хто інший, як власна Бригада. Схоже, дрібна суперечка за здобич незмірно розрослася: чимало старших бригадників так гаряче сперечалися, що дійшло до бійки. І без того похмуріший, ніж звичайно, Дірлеванґер вибухнув на людей, назвавши всіх «синами сучок-повій» серед інших добірних образ, і проголосив, що як ватажок забере всю здобич.\n\nЦе явно змусило декого остаточно зірватися: пізніше тієї ночі, коли Дірлеванґер вийшов справити нужду, на нього напало майже з десяток постатей і завдало незліченних ножових ударів. Поки життя згасало, він зрозумів, що це ті самі люди, яких кілька годин тому образив востаннє, вочевидь на чолі з його заступником Фріцом Шмедесом. Коли Шмедес радісно підійшов добити, Дірлеванґер перед остаточним мороком зміг лише кволо проклясти людей за найвищу зраду.\n\nШмедес спробував перебрати Бригаду, але, на щастя для росіян, багато бандитів відмовилися визнати його владу, й швидко почалося насильство. Різні фракції відкололися та зникли в глибинах Сибіру, а рештки - лише тінь колишньої банди кошмарів."

 DRL.425.a: "І ти, Фріце?"
 DRL.426.t: "Помічено «Комету»!" #- Alexmaths, redone by Ackbar, only fires if Dirlewanger has defeated Lysenko
 DRL.426.desc: "Нишпорячи руїнами Чорної Гори після перемоги, люди 36-ї знайшли малий анґар із, здавалося, цілком справним винищувачем! Бригадні механіки придивилися й підтвердили: це ракетний винищувач «Комета», ймовірно збитий у Західноросійській війні. Схоже, Лисенко змусив посіпак забрати уламки, доправити на Чорну Гору, розібрати для вивчення, а потім полагодити до робочого стану. Ще дивовижніше, механіки засвідчили його повну справність.\n\nЗвісно, Дірлеванґер не міг не влаштувати імпровізоване авіашоу, щоб показати міць нових одноосібних повітряних сил Бригади. Зібрали досить пального, колишній російський пілот зголосився добровольцем, а на порожньому полі за Маґнітоґорском звели тимчасовий павільйон для глядачів. «Комета» з ревом злетіла, Дірлеванґер та інші командири радісно спостерігали за простими маневрами ракетного винищувача, який сліпуче швидко перетинав ясне небо. Та коли пілот спробував похизуватися й виконати бочку, щось пішло не так. Із двигуна повалив дим, винищувач закрутився некеровано й з шаленою швидкістю понісся до землі. Врізався в землю на швидкості в сотні миль за годину, спопеливши все під собою - а саме глядацький павільйон.\n\nНервово обшукуючи димні уламки, від ватажка знайшли лише грудки обвуглених кісток, а останки були так розтрощені, що їх навіть не вдалося достеменно опізнати."
 DRL.426.a: "Це знамення!"

 DRL.427.t: "Навряд чи досить, щоб убити"
 DRL.427.desc: "Хоч пияцтво Оскара Дірлеванґера зазвичай не надто турбувало Бригаду, часом воно спричиняло незручніші проблеми. В особливо тяжких запоях командир часто викликав на бій будь-кого, хто був досить близько. Зазвичай він безладно махав кулаками, а суперник удавав, ніби боротьба зі старим справді напружена. Завершувався бій тим, що солдат удавав влучний удар Дірлеванґера й падав. Проте цього разу все пішло шкереберть: Дірлеванґер натомість потягнув чоловіка до себе. Від випитого він і так хитався, а додаткова вага лише прискорила падіння. Присутні солдати обережно захихикали. Солдат упав коліном просто на груди Дірлеванґерові, й виразно хруснуло. Командир наче не зреаґував і просто, хитаючись, звівся. Хоч солдат розумів, що, мабуть, зламав ребра, вирішив краще промовчати й уникнути покарання. Натомість знову підійшов і приязно поплескав Дірлеванґера по спині після бою. Другий плеск спричинив іще один хрускіт, який спинив ватажка на місці. Тоді він упав у бруд, цілком мертвий."
 DRL.427.a: "Це ж ніяк не могло його вбити!"

 DRL.428.t: "Задушення" #- Exocamp
 DRL.428.desc: "У рідкісній добрій звістці із земель колишнього Совєцького Союзу повідомили про смерть страшного бандитського ватажка й колишнього офіцера СС Оскара Дірлеванґера. Подробиці не підтверджені, та, схоже, його задушив у ліжку інший бандит, сподіваючись забрати всю здобич. Хоч убивцю швидко покарали жорстокою стратою, порядок у Бригаді розвалився, і цілком ясно: без Дірлеванґера вона довго не виживе в російських пустках."
 DRL.428.a: "Схоже, Оскар подавився випробуванням на щедрість."

 DRL.429.t: "Небо у вогні" #-Alexmaths
 DRL.429.desc: "Пізньої ночі небо раптом запалало. Грім був такий гучний, спалахи такі яскраві, ніби самі боги розчахнули небеса й випустили всю лють. Видовище вселило людям Бригади Дірлеванґера рівною мірою трепет і страх - два почуття, яких багато хто давно не зазнавав.\n\nДірлеванґер зібрав головних лейтенантів у наметі. Поки люди теревенили про богів, ватажкам було ясно: почалася ядерна війна. Лишалося вирішити, як відповісти. Раптом хтось крикнув: із неба до табору летить щось, мов падуча зірка. То була не зірка.\n\nДірлеванґер навіть не встиг усвідомити ракету, перш ніж вона влучила в центр табору й занурила все в атомне полум'я. Хто надіслав бомбу? Знає лише попіл, а він не говорить."
 DRL.429.a: "Нічого не лишилося..."

 DRL.430.t: "На полі бою" #- Panzer
 DRL.430.desc: "Хоч люди Дірлеванґера зрештою знищили Уральську Лігу, остання боротьба за її останню фортецю-ГУЛАГ стала його погибеллю. Під час битви снайпер Уральської гвардії на сторожовій вежі зумів прицілитися в бандита, який керував спаленням «міста», й пустив кулю просто в серце.\n\nХоч Ліга все одно програла й розсіялася горами, банда Дірлеванґера невдовзі розпалася, розколовшись на численні угруповання після смерти ватажка."
 DRL.430.a: "Доволі милосердний кінець для такої людини."

 DRL.431.t: "Останній в'язень ГУЛАГу" #- Panzer
 DRL.431.desc: "Коли Дірлеванґер із людьми штурмував чергову фортецю Уральської Ліги, напад ішов як усі попередні. Величезні втрати бандитів, запеклі оборонці Ліги, що не віддавали й дюйма, велетенська битва за малий шматок древнього бетону.\n\nОднак цього разу, увійшовши до нижніх відділів в'язниці й зачищаючи з людьми кілька осередків спротиву, Дірлеванґер опинився відрізаним.\n\nЗаблукавши у в'язничних тунелях, він невдовзі потрапив до камери й помилково замкнув себе зсередини. Люди знайшли його за кілька днів мертвим із невідомої причини. Залишивши тіло в камері, невдовзі пересварилися, й Бригада Дірлеванґера вже обвалюється сама в себе без певного ватажка на обрії."
 DRL.431.a: "В'язниця, за яку варто померти."

 DRL.432.t: "Відпустити" #- Panzer
 DRL.432.desc: "Заманений обіцянкою Чорної Гори, Дірлеванґер не зміг утекти. Щойно опинився у сховищах і катакомбах комплексу, той уже не відпускав. Невдовзі Дірлеванґер загубився в неосяжній системі тунелів і зрештою помер. Комплекс, раз у раз відтворюючи крізь занедбані гучномовці численні звуки, почуті старими мікрофонами, створив новий голос для відлуння в тунелях поряд з іншими, що наповнювали катакомби. Це був наслідок забутих пристроїв, роками залишених увімкненими, призначених зберігати голоси інших. У Бандиті він набув нової подоби. Спосіб дозволити мертвим почати знову, промовляючи в темряву, у вічність."
 DRL.432.a: "Потрапити на Чорну Гору неважко. Важко її відпустити."

 DRL.433.t: "Афонос" #- Tinyds
 DRL.433.desc: "Колись ці двоє вже коротко говорили про смерть. Повертаючись верхи від кровопролиття, нині забутого, та ще не прощеного, обмінювалися словами про всі бачені способи перетворення людини на матерію, про те, яким безглуздим і буденним стало невимовне. Міркували про самого Дірлеванґера. Його смерть збережена для вогню на день суду й погибелі всіх безбожних.\n\nФатальний день настав після програної битви; відступаюче військо отримало звістку заледве за кілька акрів. Капітан мертвий, оголосив Шмедес. Нема чого хвалити в надгробній промові. Наказав загонові, тепер лише оболонці себе колишнього, йти далі. Так і зробили, крім полковника й офіцера. Вони спитали, що сталося з оберфюрером. «Вам немає причин знати, - відповів він. - Прийде час поховати».\n\nНе переконані, двоє покинули Бригаду й повернулися на місце бою, невдовзі знайшовши тіла в одностроях тих, хто поліг від росіян. На пагорбі лежали уламки автомобіля, який, як відомо, полюбляв командир, і приголомшливо глибока западина в землі. Полковник піднявся й завмер, обличчя цілковито заціпеніло від виду ями.\n\n«Йобаний Ісусе Христе». Він ще трохи дивився в отвір, тоді кліпнув, обернувся й пішов, обличчя перекосила гримаса, надто сильна, щоб вивергнути її назовні.\n\n«Що з ним сталося, Дітріху?» Він не відповів. «Дітріху?» Офіцер поволі піднявся на пагорб і зазирнув у яму.\n\nПередача тут обривається."
 DRL.433.a: "Ґосподі, помілуй."

 DRL.434.t: "Утоплення" #- Tinyds
 DRL.434.desc: "Шинкар методично взяв усі пляшки горілки, вилив із кожної половину й долив етанолу. Отрути роздобути не міг, зате мав величезний запас спирту й передбачав лихо. Знав, як Бригада нападає, й знав, що осердя винищувальної рутини - спустошити ящики будь-якого знайденого спиртного й нестримно напитися, перш ніж чинити найжахливіші злочини. Планував напоїти бандитів так, щоб вони не могли знищити нікого, крім себе.\n\nКоли почалося шаленство, лежав тихо в льосі, слухаючи, як німецькі крики й сміх угорі з часом обертаються вереском, бійками й блюванням. Мови не знав анітрохи, та розумів, що горілку вони сприйняли не за отруту, а за виклик. Але ніч лютувала далі, здригання стихали, і невдовзі він заснув, певний, що запасний план провалився й урятував він лише себе.\n\nПрокинувшись уранці, піднявся з підвалу, чекаючи лише знищеної корчми й зрівняного із землею міста. Натомість побачене позбавило мови. По всій корчмі на кожному стільці валялися безживні бандити, стискаючи порожні пляшки. Сам командир обм'як на уламках скла, обличчя майже не впізнати від каліцтв. Кожен відвідувач помер від передозування. Царювання терору скінчилося."
 DRL.434.a: "А кажуть, що це росіяни п'ють безвідповідально..."

 DRL.435.t: "Привиди Хатині" #- Tinyds
 DRL.435.desc: "У саму мить смерти бунтівного оберфюрера самотній вигнанець почув грім. Глянув у зимове грозове небо й повернувся доглядати посіви.\n\nМенш ніж за кілька хвилин до поля прибігла дівчинка й заговорила. Їй було менше тринадцяти, та блакитні очі здавалися втомленими й безмежно старими. «Усе скінчилося», - сказала селянинові білоруською. Він недовірливо дивився на дитину. Десятиліттями не чув слова рідною мовою. Тоді вона чкурнула назад у хвойний ліс.\n\nМинуло пів години. Селянин уже збирався додому, аж побачив удалині чоловіка з рушницею, що наближався: постать невпізнанна, а обличчя трохи знайоме. «Фльоро, брате мій, - прошепотів той знову його мовою. - Іди й дивись». Селянин не хотів вірити, що не спить. Від різанини ніхто жодного разу не вимовляв його імени. Навіть він сам. Пішов за чоловіком у нетрі.\n\nІшли мовчки, доки натрапили на тіло; чоловікова донька та її мати схилилися над ним і обшукували чорний однострій на щось придатне. Кульова рана пронизувала груди, і кров текла з неї, немов зорі небесні на землю. Возз'єднаним товаришам не треба було з'ясовувати, хто це. Над трупом двоє взялися за руки. А тоді заспівали пісню юности в Хатині. Пісню весни."
 DRL.435.a: "На Південному Уралі все старіше за людину й гуде таємницею."

 DRL.436.t: "Вибухові результати" #- Exocamp
 DRL.436.desc: "На очевидне щастя довколишніх мешканців, повідомили про смерть офіцера СС Оскара Дірлеванґера! Під час звичного походу грабувати комуну в диких сільських краях Росії він, схоже, натрапив на нерозірвану німецьку бомбу, скинуту в одному з численних постійних терористичних бомбардувань регіону. Побачивши нагоду продати її на чорному ринку, наказав кільком людям допомогти розібрати.\n\nПроте рішення стало тяжкою помилкою: недосвідчені грабіжники почали розбивати бомбу, викликавши вибух, який убив Дірлеванґера й помічників. За повідомленнями, командна вертикаль Бригади розвалилася, і майбутнє 36-ї тепер зависло в повітрі."
 DRL.436.a: "Убитий власною некомпетентністю."

 DRL.437.t: "Питання віри" #Lord Viruscide
 DRL.437.desc: "Церква не мала назви й мала лише кількох священників. Тут жили тільки згорблені старці та вразливі до впливу юнаки, що шукали чогось більшого за нескінченну тяжку працю. Тепер вона не мала даху: полум'я здіймалося вище й яскравіше на тлі потемнілого від грози неба. Нечисленні дрібнички, які ще не віддали вогневі, склали для поділу між бандитами; найкращою здобиччю був могутній меч, який нібито пан-хрестоносець носив до Святої Землі й назад. Сам Чорний Бандит насолоджувався власноручною стратою дев'ятьох чоловіків, змусивши їх стати навколішки в жахливому світлі віри, що оберталася на попіл. Дев'ятий наче змирився з долею й спокійно молився, поки решта благала неіснуючого милосердя. Різкий тріск пострілів відлунював гуркотом далекого грому.\n\nСпинившись перезарядити, Дірлеванґер плюнув у дев'ятого й зажадав через перекладача: «Чому ти не пручаєшся, як інші?» Той просто відповів: «Бог захистив мене від царя, Бог захистив мене від червоних, Бог захистив мене від німців. Над усе я вірю, що Бог захистить мене від тебе». Спокійний спротив розлютив Дірлеванґера, і той покинув пістолет заради хрестоносцевого клинка. Маючи намір забити священника затупленою віком зброєю, підніс меч високо над головою.\n\nНебеса розчахнулися й розкололися. Блискавка вразила Чорного Бандита, який упав мертвий. 36-та розбіглася зі страху, розсіявшись під покровом грози. Священник узявся ховати мертвих, а тоді спрямував працю на відновлення церкви."
 DRL.437.a: "Матвія 20:16: Отак будуть останні першими, а перші останніми..."

 DRL.438.t: "У полум'ї" #- Palks
 DRL.438.desc: "Звістки з Уралу, схоже, свідчать про смерть бандитського ватажка Оскара Дірлеванґера в раптовій аварії.\n\nПісля довгого дня командування боєм у гірському комплексі Лисенка Дірлеванґер, здається, вирішив перепочити в покинутій лабораторії. Там стояли кілька великих відкритих чанів із невідомою легкозаймистою речовиною; припускають, що під час відпочинку він спіткнувся й упав до одного, просякнувши рідиною. Не усвідомлюючи, чим облитий, закурив - і негайно спалахнув.\n\nЗнайшовши обвуглені останки, бандити швидко поринули в запеклі чвари, й важко уявити, що переживуть вогненний кінець ватажка."
 DRL.438.a: "Ось чому не треба курити, діти!"

 DRL.439.t: "Господар долі" #- timbothy
 DRL.439.desc: "Бій пішов кепсько. Якось цим обшарпаним росіянам, що захищали село, вдалося загнати Дірлеванґера з найближчими товаришами в кут і рвати їх на шматки. Сподівалися: схопивши Бича Уралу, виторгують порятунок селу. Десятилітніми рушницями й навіть іржавим реманентом селяни прорубувалися крізь найдавніших солдатів та офіцерів Оскара Дірлеванґера, доки дісталися самого диявола.\n\nДірлеванґер упав навколішки, з усіх боків у голову цілилася зброя. Один із полонителів плюнув на нього. «Нарешті впіймали, сучий ти виродку. Сподіваюся, твої люди відмовляться домовлятися, щоб я міг зробити твою смерть якнайболючішою».\n\nСтарий усміхнувся, оголивши огидний вищир розбитих зубів і гнилих ясен. «На світі лише один чоловік досить сильний, щоб мене вбити».\n\nІз неможливою швидкістю старий кістяк вихопив особистий пістолет і розніс власні мізки по снігу. Помер, усе ще з тією гнилою усмішкою на обличчі. Щойно люди дізналися, почали гризтися за владу й здобич, і тепер банда розкололася й згасає."
 DRL.439.a: "Лише чудовиська можуть убивати чудовиськ."

 DRL.440.t: "Блідий вершник" #-DanThe#Man
 DRL.440.desc: "Тривожні чутки з Південного Уралу свідчать, що підлий Оскар Дірлеванґер разом із переважною більшістю страхітливої Бригади зустрів надзвичайно повільний і болісний кінець. Кажуть, невдовзі після повернення з далекого рейду кілька людей тяжко захворіли. Розграбоване село було дивно тихим, а люди здебільшого хворі й при смерті; схоже, рейдери підхопили ту саму недугу, що вразила нещасне село.\n\nПерш ніж зрозуміли, що коїться, заразилася більшість Бригади, зокрема й сам Дірлеванґер. Хворих збила жахлива гарячка й судоми живота, вони ослабли так, що не могли ходити. З плином днів ті, хто ще не помер, невдовзі мали померти: почалися безперервні кровотечі та ґанґрена, тіла вкрилися бубонами. Більшість закордонних медичних фахівців, які чули чутки, погоджуються: симптоми схожі на Yersinia Pestis - Чорну смерть.\n\nБез сучасної медицини Дірлеванґер невдовзі помер смертю в кривавих муках. Проте хаос почався значно раніше: рештки Бригади розладналися, живі опинилися безпорадними без ватажка, переслідувані привидом самої смерти. Небагато щасливців, що втекли незараженими, зникли в пустках, і табір Дірлеванґера тепер моторошно мовчить; тільки купи гнилих тіл свідчать, що тут хтось був."
 DRL.440.a: "Ось кінь блідий, а той, хто\nсидів на ньому, мав ім'я Смерть."

 DRL.441.t: "Чарівна куля" ##Pacifica
 DRL.441.desc: "Середночі «тишу» табору Дірлеванґера раптом порушив один постріл, що відлунив серед брезентових наметів і збірних будівель. Коли найвірніші прибули на місце, Дірлеванґер уже був мертвий: одна куля пробила скроню, а чорний капелюх укривав кістляве обличчя.\n\nДивина, проте, виявилася, коли лейтенанти вирішили провести офіційне «розслідування», головно щоб звинуватити одне одного. У стінці намету не було кульового отвору, слідів проникнення чи боротьби теж. Гірше того, знайдена куля виявилася зовсім іншого калібру, ніж уживала решта Бригади.\n\nНасамкінець перевірили власну зброю Дірлеванґера - порожня, не стріляла й бездоганно доглянута.\n\nЧерез цей загадковий стан справ і таємницю, якої Бригада ще не знала, банда розкололася й почала роздирати себе в нападах страху. Із поширенням історії на захід про «чарівну кулю» говорять стишеним шепотом... бо хто знає, чи вбивця не вдарить знову?"
 DRL.441.a: "Хто вбив Оскара Дірлеванґера?"

 DRL.442.t: "Бабай" #- DanThe#Man
 DRL.442.desc: "Із Сибіру ширяться чутки, що Оскар Дірлеванґер, Чорний Бандит Південного Уралу й бич усіх росіян, нібито безслідно зник. За розповідями, він із частиною Бригади грабував село далеко від головного табору, коли регіон накрила величезна завірюха. У складних умовах Дірлеванґер із людьми загубили одне одного, і коли погода нарешті прояснилася, Чорного Бандита ніде не було.\n\nСпочатку Бригада чекала, що згодом з'явиться: зрештою, десять років тому в Західноросійській війні він із людьми пережив саме таке. Та дні минали, Дірлеванґер не повертався, й пристрасті розпалювалися. Коли банда нарешті вирішила, що він пропав у пустках, швидко почалися чвари, й колись страхітливе зборище розсипалося на чотири сторони світу.\n\nДля більшости втрата Дірлеванґера могла б стати великою полегкістю, але забобонним селянам, яких роками тероризувала банда, зникнення лише зміцнило жахливу леґенду. На Південному Уралі повно історій, ніби його бачили в глибинах найтемніших лісів, у брудних провулках розбомблених міст, на вершинах крижаних уральських гір і під ліжками неслухняних російських дітей. Навіть коли шанс появи живим стає неможливим, Дірлеванґер, імовірно, й далі житиме в кошмарах росіян, ще одним чудовиськом у каноні російського фольклору."
 DRL.442.a: "Поводься чемно, а то Чорний Бандит з'їсть тебе живцем!"

 DRL.443.t: "Тебе звільнено" #- Todd, edited by timbothy
 DRL.443.desc: "Після десятиліть жаху Оскар Дірлеванґер, страх Росії, нарешті мертвий. Подробиці загибелі, м'яко кажучи, туманні, та різні люди зібрали розрізнені повідомлення й склали загальну картину фатального дня. Очевидно, самотній совєцький ветеран зі зброєю, збереженою після війни, проник до головного табору Бригади й перебив кожного німця, в якого міг влучити. Російських рабів звільнили, і втікачі - головне джерело відомостей про вбивство. За їхніми словами, Дірлеванґер загинув у покинутій промисловій будівлі, насаджений на трубу. Раби описували невідомого солдата як дивовижно незворушного й витривалого, що зносив численні кульові поранення, хоча це лише чутки й, імовірно, перебільшення. Хоч би ким він був, Росія навіки перед ним у боргу."
 DRL.443.a: "Схоже, Дірлеванґер випустив пару."

 DRL.444.t: "Осяяння" #- Exocamp, rewritten by timbothy
 DRL.444.desc: "Короля бандитів більше немає. Підтверджено смерть Оскара Дірлеванґера, жорстокого офіцера СС й бандитського ватажка, який занурив Південний Урал у десятиліття терору, після того як він, за повідомленнями, збожеволів.\n\nПісля чергового жорстокого рейду на сільську комуну Орєнбурґа колишній командир 36-ї почав переживати те, що називав «осяянням». Твердячи, що «одна людина вгорі контролює все», він нібито белькотів про розбіжні часові лінії, таємні товариства й «леґіони німецьких танків у барвах заходу сонця». Марення дедалі посилювалося й ставало фанатичним, аж він повалив одного зі своїх людей.\n\nПогрожуючи «вбити всіх, хто провів мене через це пекло», кинув останню пересторогу «тому, хто дивиться, як я помираю знову й знову», перш ніж найближче коло нарешті мусило його пристрелити. Хоч решта Бригади на мить об'єдналася в розгубленості й жаху, єдність, схоже, не тривала: поки оточення намагалося зміцнити контроль, застреливши власного ватажка, банда швидко розвалилася."
 DRL.444.a: "Марення чудовиська, чий розум зруйновано."

 DRL.445.t: "Я люблю оленину з кров'ю" #- rewritten by timbothy
 DRL.445.desc: "За чутками, чорна армія Дірлеванґера пожирає все - від душ до людської плоті, але тієї ночі їли кількох оленів, упольованих у місцевому лісі. Оскарові Дірлеванґеру подали тарілку з обвугленою олениною, і він відчув потребу покепкувати. «Це майже попіл! Люблю добре свіже м'ясо». Страву швидко кинули собакам і невдовзі подали червоний соковитий шматок. Він усміхнувся, оголивши криві гнилі зуби, якими й так не мав би могти їсти м'яса, і взявся до страви.\n\nНаступного ранку стало ясно: король бандитів тяжко хворий. Блював, позеленів на обличчі, й за своїх мізерних медичних знань солдати припустили харчове отруєння чи щось подібне. Чекали, що скоро одужає, тож банду приголомшило, коли того ж дня тремтячий нажаханий бандит оголосив смерть ватажка. Після кількох годин переговорів і наростання напруги табір поринув у хаос, і, схоже, бич Уралу вже ніколи не тероризуватиме заплаканих жінок чи недосмажену дичину."
 DRL.445.a: "Помста - страва, яку краще подавати з кров'ю."

 DRL.446.t: "Тринадцять днів, тринадцять ночей" #-Bread
 DRL.446.desc: "Під час рейду головна колона Бригади потрапила в засідку з глибокої снігової білини. Кулі й вибухівка шматували вантажівки, лишаючи криваві діри там, де щойно були люди, а багато хто стогнав унизу в брудній сльоті. Серед хаосу самому Дірлеванґерові вдалося втекти, і попри поранення стегна він сам вийшов із зони бою. Ішов годинами, навіть коли гамір стрілянини й вибухів згас, сподіваючись лише дістатися табору. Кров із рани замерзала, не встигаючи згорнутися, сковувала тіло й змушувала кульгати рівнинами. Живився корінням, а коли рослин поменшало, вибирав черв'яків із пухкого ґрунту. На десятий день рана загноїлася, ноги надто ослабли, і він мусив повзти животом, мов жалюгідний слимак, що чіпляється за життя. На світанку чотирнадцятого дня передсмертних мук нарешті побачив вогні табору. Так близько, що майже відчував тепло багаття, підповзаючи.\n\nТа більше нічого не відчує: закляклі ноги й крихкі пальці не могли посунути далі. У затуманеному зорі останнім видовищем Дірлеванґера стали танцюючі язики полум'я, надто далекі, щоб допомогти сумному чоловікові, обліпленому снігом."
 DRL.446.a: "Стільки боротьби, щоб зрештою померти."

 DRL.447.t: "Роби, як росіяни." #- Chai-chan, adjusted by Bread
 DRL.447.desc: "Кілька тижнів тому всі очільники вцілілих поселень під окупацією Бригади отримали дипломатичне комюніке від, як кажуть, «дуже підозрілих слов'ян». Усередині був один лист із п'ятьма словами й датою.\nМій табір. Бути там. Дірлеванґер. (Вставити дату смерти Дірлеванґера)\nТоді послання всіх спантеличило, але ніхто не надав великої ваги. Мабуть, шахрайство, хрінова спроба замаху чи щось іще гірше. Мета листа лишалася таємницею - до сьогодні.\nКажуть, сміливий російський селянин кинув Дірлеванґерові виклик: улаштувати найбільшу горілчану гулянку. Селянина, звісно, відразу жорстоко посадили на кіл, але зухвалі слова не йшли командирові з голови. Він наказав пограбувати кожне село, забравши всю горілку, людські черепи й прянощі, хоч їх було й мало. Люди слухняно виконали наказ, звісно й самі трохи потішившись, але знали: справжні веселощі ще попереду.\nЗапрошення розіслали всім великим людям Росії. Гулянка тривала днями, щодня з пляшок лилися гектолітри горілки. Кажуть, деякі солдати вмістили стільки алкоголю, що дістали 20 проміле в крові - справжня сила арійських генів. Дірлеванґер запропонував гру «Правда чи дія» - далі лунали жахливі зізнання й іще жахливіші завдання. Кажуть, декотрі селяни, що навідалися на пізні стадії гулянки, мають ПТСР від самого слухання «правд» бунтівних есесівців.\nНа жаль, для Дірлеванґера це було занадто. Отримавши завдання випити до дна мале барило горілки з прянощами, кістковим пилом і кров'ю та справді виконавши його, божевільний командир упав мертвий після останнього крику «Сукаааа папали!». Товариші, схоже, досі шоковані, що такий затятий нацист останні слова промовив російською."
 DRL.447.a: "Горілка, здається, творить найкращих лінґвістів."

 DRL.448.t: "Правильне місце, невдалий час" #- Todd, edited by Ackbar
 DRL.448.desc: "Оскар Дірлеванґер, страх Росії, нарешті мертвий. За повідомленнями, під час звичної страти російського села до табору ввійшов загадковий юнак у чорній куртці й червоній бандані, голіруч нищачи бригадників наліво й направо. Попри всі зусилля найкращих бійців 36-ї, він легко пробився крізь бандитів і зрештою став віч-на-віч із самим Дірлеванґером.\n\nХоч не говорив ні німецькою, ні російською, здається, викликав Чорного Бандита на беззбройний двобій. Дірлеванґер, чи надто лютий для розважливости, чи не бажаючи відступати перед людьми, мовчки кивнув і прийняв виклик, а рештки Бригади оточили бійців. Не дивно, початок був кепський і ставав лише гіршим. Координація Дірлеванґера була як у п'яного боксера, а ворог бився наче зі східної леґенди. Коли Дірлеванґер лежав, кашляючи кров'ю, суперник грубо пробурмотів щось чужою мовою й одним ударом кулака розтрощив Чорному Бандитові череп.\n\nУцілілі мовчки розступилися, коли чоловік виходив із села, наче завершивши роботу. Коли перейшов наступний пагорб, з неба вдарила блискавка, хоч воно було цілком ясне. Люди пішли перевірити й не знайшли ані сліду загадкового вбивці."
 DRL.448.a: "Ох... небагато ж від нього лишилося, правда?"

 DRL.449.t: "Класична казка" #charlesthe50th
 DRL.449.desc: "Після недавнього рейду на сусіднє поселення Дірлеванґер із людьми вертався до табору. Та дорогою відокремився й невдовзі зовсім утратив напрямок. На щастя, натрапив на місцеву сільську дівчинку, що йшла до бабусі. Спитав дорогу, довідався місце й швидко помчав геть. Коли дівчинка прийшла, побачила бабусю за варінням картоплі. Дивно: від останньої зустрічі в бабусі виросла щетина. І побільшало ваги. Найдивніше - знову виріс повний набір зубів! Тоді дівчинка помітила руку, що стирчала з-під бабусиного ліжка. Безстрашна дівчинка відволікла бабусю дурними питаннями й тим часом схопила свою зручну рушницю. Побачивши зброю, бабуся всміхнулася. «Ну-ну, нащо тобі це? Таким дівчаткам не слід мати рушниці для великих чоловіків, як я... тобто великих чоловіків, як солдати», - сказала бабуся, усміхаючись гострими гнилими зубами. Дівчина відповіла: «Я лише хотіла потренуватися стріляти. Цими дорогами нечасто ходять такі дівчатка, як я». Бабуся знову всміхнулася. «Ходи сюди, дівчинко, я з тобою. Нехай я стара, та знаю більше, ніж ти думаєш». Дівчина підняла рушницю до плеча й націлила в Дірлеванґера. Тієї ж миті він кинувся вперед. Перш ніж кігті дісталися її, його застрелили."
 DRL.449.a: "Де ж я це вже чув?"

 DRL.450.t: "Останнє полювання" #- Panzer
 DRL.450.desc: "Таборуючи, бенкетуючи й гуляючи в найрозпусніші уявимі способи, як і було звично Оскарові Дірлеванґеру та його людям, сумнозвісний ватажок оголосив велике полювання: мовляв, дорогою до нового табору помітив гурт кабанів.\n\nНевдовзі полювання почалося, і кабанів справді знайшли. Та люди не очікували, що ватажок схибить першим пострілом, а невдовзі один звір його пошматує. Кабана вбили, Дірлеванґера відтягли до табору, але швидко стало ясно, що потрібної медичної допомоги не знайти, і він невдовзі помер від ран. Нібито останніми словами були: «Оберфюрер СС Оскар Дірлеванґер... убитий свинею... дайте щось від болю й дозвольте померти».\n\nПісля смерти воєначальника вже з'явилося сім фракцій, що воюють за рештки трофеїв. Бандити, здається, зламані."
 DRL.450.a: "Усі люди мусять померти."

 DRL.451.t: "Генерал Мороз" #-kracc/Virus
 DRL.451.desc: "Ночі, такої холодної, що люди замерзали на місці, Дірлеванґер із людьми йшов далі. Вони нишпорили, грабуючи сусідні села на їжу й будь-яке пальне. Насунувся фронт негоди, мов жахливе біле козацьке військо, косячи людей помітно милосердніше за того, за ким вони йшли. Видимість упала до метра, потім іще нижче. Дірлеванґер намагався тримати людей докупи, та буря була така сильна, що ковтала всі крики. Невдовзі й сам Чорний Бандит загубив людей, опинившись перед бичем російської зими, якого навчився боятися кожен німець.\n\nНаступного ранку, коли буря вщухла, тіло Дірлеванґера знайшов обшарпаний гурт уцілілих. Він замерз, згорнувшись у позі зародка, наче вирішив покинути світ так само, як прийшов. Люди були вдячні за свіжі припаси..."
 DRL.451.a: "Гідна загибель."

 DRL.452.t: "По-ядерному" #- Panzer
 DRL.452.desc: "Хоч ядерна війна знищила цивілізацію, більшість Росії лишилася порівняно незачепленою. Усю світову зброю приберегли для великих гравців: нацистів, японців і янкі. Та, на подив багатьох, дещо таки долетіло й до Росії. Випадково чи з чистої, чистої лютої ненависти німці, схоже, запустили кілька міжконтинентальних балістичних ракет просто в західну Росію останнім жестом непокори російським державам.\n\nОдна з цих ракет, мабуть, збилася з курсу: замість міста чи містечка полетіла просто до табору бандитського володаря Оскара Дірлеванґера й стерла весь комплекс із лиця Землі. Тепер лишилася тільки луна."#Needs to only be able to fire if nuclear war has happened.
 DRL.452.a: "Найменш важлива жертва цієї війни."

 DRL.453.t: "Займистий" #- Panzer
 DRL.453.desc: "Світ, схоже, спалахнув подивом, коли до преси потрапили свіжі кадри з Росії. На відео росіянин, імовірно один із бандитів Оскара Дірлеванґера, експериментує й бавиться відеокамерою, яку, здається, знайшов у рейді. На зйомці сам Дірлеванґер ходить і віддає накази, аж раптом спалахує. Різні бандити намагалися загасити полум'я, та, схоже, марно, й після його смерти банда вже поринула у внутрішні чвари.\n\nНауковці, м'яко кажучи, спантеличені."
 DRL.453.a: "Може, пекло просто забрало своє."

 DRL.454.t: "Це був лише собака" #- Panzer
 DRL.454.desc: "Новини з Росії: невідомий мандрівник, схоже, проклав кривавий шлях через Урал, щоб покінчити з Дірлеванґером та його людьми. Нечисленні вцілілі твердять, що під час звичного рейду Дірлеванґер натрапив на чоловіка з добре збереженим автомобілем і власним собакою. Коли той його образив, Дірлеванґер вирішив підкрастися, оглушити чоловіка, вбити собаку й поїхати на машині зі своїми людьми.\n\nКажуть, чоловік насправді був колишнім енкаведистом, відомим німецьким солдатам як «Буцеманн» за майже мітологічну здатність убивати й нищити. Десятки, а то й сотні бандитів загинули, перш ніж їхнього ватажка стратили двома точними пострілами у голову."
 DRL.454.a: "Це був лише йобаний собака!"

 DRL.455.t: "Метеорологічне" #- Panzer
 DRL.455.desc: "Кілька бригадників Дірлеванґера здалися владі сусідніх держав, безперестанку белькочучи, що сам Бог, здається, знищив їхній табір. Кажуть, усе було звично, аж електрика від табірних ґенераторів почала згасати, і раптом метеорит урізався в центр табору, стерши його з лиця Землі, мов ядерний вибух.\n\nДовколишні села цього не підтвердили, більшість просто вважає, що Бригада нарешті остаточно збожеволіла. Єдина жертва нібито великого лиха - Дірлеванґер, якого знайшли мертвим у кімнаті з кульовою раною. Спостерігачі намагаються вигадати науково прийнятне пояснення, чому ціле мале військо твердить про удар метеорита в цілком наявний табір. Більшість винуватить масову істерію, але дехто каже, що це план бригадників: убити Дірлеванґера й удавати божевілля."
 DRL.455.a: "Сподіваймося, справжній метеорит їх знищить."

 DRL.456.t: "Спростувати «Державця»" #- Ackbar, only fires if Dirly has defeated Orenburg
 DRL.456.desc: "Завоювавши Орєнбурзьку комуну, Оскар Дірлеванґер із Бригадою спробував запровадити щось схоже на цивілізовану владу, створивши поліцію. Звісно, це була лише мандрівна банда п'яних добре озброєних розбійників, які обшукували будинки, забирали все цінне й оголошували податком новій адміністрації.\n\nУ рідкісну мить здорового глузду Дірлеванґер збагнув: продовження спричинить масове повстання вцілілих містян, якого не подолає й уся Бригада. Тож наказав моторошно стратити начальника поліції, особливо жорстокого козака Руслана Орлова, і викинути понівечене тіло на вулицю перед ратушею. Схоже, намагався запозичити сторінку в Макіявеллі: державець призначив жорстокого урядовця приборкати місто; після кривавого впокорення стратив його й залишив містян «задоволеними й приголомшеними».\n\nЗвісно, Дірлеванґер значно переоцінив прихильність від страти Орлова, як болісно дізнався під час нового візиту до Орєнбурґа. Замість приязної юрби зустрів оскаженілий натовп, що вимагав голови, й швидко зім'яв конвой. Охоронці, боячись Орлової долі за силу проти юрби, відступили, поки натовп поглинув Дірлеванґера й забив до смерти."
 DRL.456.a: "Тепер народ без сумніву задоволений!"

 DRL.457.t: "Зрадливі виродки" #- Ackbar
 DRL.457.desc: "З якоїсь причини - лінощів, некомпетентности, чужого тиску чи простого безумства - останніми місяцями Дірлеванґер передавав лейтенантам дедалі більше впливу в щоденному управлінні Бригадою. Та охочі до влади рідко її заслуговують, і вони швидко почали гризтися, хто зрештою скине Дірлеванґера й стане новим королем бандитів Уралу. Сьогодні, здається, один зробив хід.\n\nНа зустрічі з вищим командуванням Дірлеванґер довірливо повідомив, що не розглядає нікого наступником. Натомість цілком розпустить Бригаду, коли відчує себе досить старим і заможним для безпечного спочинку. Явно це не сподобалося підлеглим: один дістав ножа й ударив Дірлеванґера в живіт. Дивлячись, як колишній командир хапає останні подихи на залитій кров'ю підлозі командного намету, всі погодилися приховати правду від рядових. Нашвидкуруч вигадали й оголосили, ніби лисенківський науковець прокрався й отруїв бренді.\n\nНе дивно, лейтенанти не змінили намірів, і зради та інтриґи поновилися, перш ніж тіло охололо. Ті частини Бригади, які ще не дезертирували відкрито, надто зайняті взаємною боротьбою, щоб грабувати сусідні містечка. Грозова хмара над Уралом, здається, нарешті розсіюється."
 DRL.457.a: "Отруїли вороги, кажете?"

 DRL.458.t: "Кількох проґавив"
 DRL.458.desc: "Оскара Дірлеванґера, страх Росії, вчора вбили партизани. Дорогою на зустріч із Лисенком невеликий загін колишніх енкаведистів влаштував засідку на нього й почет, убивши Дірлеванґера та кількох бригадників. Коли прибула сама Бригада, партизани давно пішли, та люди змогли вилити горе на найближче село, яке напевне мусило їм допомагати.\n\nПоки село горіло, знайшли тіло Оскара Дірлеванґера, і тоді по-справжньому збагнули: померли й повідець, і батіг. Без Дірлеванґера на чолі Бригада розкололася в чварах і дезертирстві. Різні фракції вже відколюються тероризувати Урал, хоча навряд чи будь-де в Росії знайдуть пощаду."
 DRL.458.a: "Шалена поїздка Оскара добігла кінця."

 DRL.459.t: "Суперечливі повідомлення" #- timbothy
 DRL.459.desc: "Оскар Дірлеванґер мертвий.\n\nОднак обставини смерти Бича Уралу дивним чином невідомі. Не тому, що інформації немає, - її забагато. Немає двох присутніх при смерті, які розповіли б однакову історію. Навіть місце не збігається! Один твердить, що старий розніс собі мізки, коли селяни загнали його в кут під час рейду. Інший каже, що зник на гірському перевалі. Раб каже: помер від гнилої оленини. Сусідній селянин клянеться, що щось упало з неба й знищило весь табір, а інший - що бандитів усіх викосила чума. Один солдат навіть твердить, що він замерз, і голодні бандити з'їли його, чим пояснює брак тіла. Попри все, жодного твердження не вдалося підтвердити. Відомо лише, що чудовиська немає, та всі досі ставлять одне питання:\n\nХто вбив Оскара Дірлеванґера?"
 DRL.459.a: "Захоплива таємниця вбивства, ще й із найзаслуженішою жертвою!"

 DRL.460.t: "Таємниця перевалу Дятлова" #- Spuddatomic
 DRL.460.desc: "Міжнародна спільнота усвідомлює, що Оскар Дірлеванґер, ватажок усіма знаної страхітливої бригади бандитів, мертвий. Повідомляють: кілька днів тому покинув табір, почувши про особливо привабливий запас боєприпасів у гірському комплексі трохи на північний схід від своїх земель. Узяв невеликий загін найвірніших і легку поклажу найпростішого табірного спорядження. Бригада не знала: коли мала колона зникла в сибірських нетрях, ватажка востаннє бачили живим. Майже за місяць вони не повернулися. Коли чвари загрожували роздерти гурт, неохоче послали розвідників з'ясувати долю короля бандитів. Після тижня тяжкого шляху вони натрапили на загадкове видовище в місці, яке місцеві називають «Мертвою Горою».\n\nТе, що здавалося рештками табору загону, наполовину засипав сніг. У стінці великого намету зяяла чимала діра, наче прорізана ножем. Ідучи слідами легких кроків униз до узлісся, розвідники побачили тіла двох чоловіків, що скупчилися біля багаття. Вкриті кригою, вони були майже такі бліді, як сніг під ними. Далі в лісі знайшли темний предмет, що стирчав із кучугури. То була рука спотвореного трупа Дірлеванґера, майже цілком укритого камінням і льодом. Перш ніж гурт устиг повернути звістку решткам Бригади, вона розкололася на ворожі кліки, багато з яких оголосили її «розпущеною»."
 DRL.460.a: "І справді загадковий випадок."

 DRL.461.t: "Старість" #- Mupper
 DRL.461.desc: "Минулої ночі Оскар Дірлеванґер мирно помер уві сні. Хоч деякі відданіші послідовники звинувачують у злочині росіян, комуністів, євреїв і багатьох інших, слідів боротьби чи чогось негаразд немає. Інші вважають, що Чорний Бандит помер природною смертю від похилого віку й суворої російської погоди або, можливо, хвороби. Ще божевільніші твердять, ніби він живий, просто втік із Росії й залишив двійника, чим дуже спантеличують решту Бригади.\n\nТа хоч якою була причина смерти, Бригада розкололася, її члени розійшлися й утекли в невідомі краї. І хоч Чорний Бандит мертвий, незліченні смерті ніколи не будуть помщені, а він ніколи не постане перед заслуженим правосуддям."
 DRL.461.a: "То виродок здох? Шкода, що ніхто не дістався до нього раніше!"

 DRL.462.t: "Смертельна ін'єкція" #- Magnimik
 DRL.462.desc: "Старість нікого не щадить, особливо того, хто все життя б'ється, блукає сибірськими пустками й живе розпусно. Відчуваючи наближення смерти й подальше погіршення здоров'я, сумнозвісний ватажок Оскар Дірлеванґер попросив сільського лікаря вилікувати свої недуги, якого колись шантажем змусив швидко дати гроші в обмін на життя його самого й усієї родини. Та замість порятунку ненависного грабіжника лікар скористався нагодою змусити заплатити за всі страждання родини й усієї Росії. Замість належного лікування ввів Дірлеванґерові те, що назвав «триетиленом натрію», у дозі, достатній для вбивства людини. Коли Дірлеванґер зрозумів, що сталося, жити йому лишалося менш ніж десять секунд. Поважний медик не міг не оцінити чорної іронії: бандит віддав життя в руки тому, кого колись погрожував убити."
 DRL.462.a: "Не скажеш, що це порушення Гіппократової присяги."

 DRL.463.t: "Дрібна суперечка" #- timbothy
 DRL.463.desc: "Оскар Дірлеванґер із найвірнішими послідовниками невимушено прогулювався серед полум'я чергового зруйнованого села. Ще лунали крики й благання про допомогу, поки решта Бригади шаленіла над людьми, яким не пощастило потрапити бандитам на очі. Найближче коло оточувало ватажка й сміялося, страчуючи понівечених чоловіків і жінок дорогою. Вираз самого Дірлеванґера був холодніший за російську зиму.\n\nВін помітив сліпуче золоте намисто, чомусь пропущене на одному трупі. Нахилився взяти, але просто перед очима його вихопив бандит - російський хлопець у шрамах, не старший за двадцять. Обличчя, ледь зріліше за дитяче, освітлював вогонь, а древні риси Дірлеванґера вкривала ніч.\n\nДірлеванґер заговорив крижаним тоном, здатним заморозити Атлантику. «Віддай, хлопче».\n\nРосійський бандит у темряві не впізнав ватажка. «Від'їбися, діду».\n\nНе бажаючи більше терпіти, Дірлеванґер потягнувся до пістолета. Забере дрібничку сам. Та перш ніж устиг вихопити, обличчя вибухнуло болем: російський хлопець ударив прикладом у череп. Дірлеванґер упав. Хлопця швидко застрелили, але запізно. Бич Уралу був кволим чоловіком, і одного удару вистачило. Можливо, хлопцеві спочивалося б легше, якби знав, за скількох помстився."
 DRL.463.a: "Він ніколи не дізнається, як багато зробив."

 DRL.464.t: "Споріднена душа" #- timbothy
 DRL.464.desc: "У таборі бандитської Бригади Оскара Дірлеванґера була пізня ніч. Після особливо вдалого рейду чимало людей п'яно танцювали й співали довкола багаття. Сам Дірлеванґер, утомившись від веселощів, відійшов трохи до сусіднього лісу помочитися.\n\nПідтягуючи штани, почув шарудіння гілля. Зі швидкістю того, хто робив це десять тисяч разів, вихопив зброю й обернувся для пострілу, та чи не вперше завагався. У темряві дивилося худе, кістляве обличчя з очима, холодними як його власні.\n\nЦієї короткої миті начебто дзеркальний образ короля бандитів стрибнув і повалив його, притиснувши старого німця до гострого каміння й сухої хвої. Роздивившись краще, Дірлеванґер зрозумів: не віддзеркалення, лише випадкова схожість збила його з пантелику. Спробував вирватися, та запізно. Худий чоловік розтрощив йому голову, залишивши чудовисько мертвим. Коли знайшли труп, взуття, пальта й пістолета вже не було. Убивця був звичайним шукачем поживи й не знав, що вбив бич Росії. За таку безсердечність - убити беззахисного старого заради майна - він, мабуть, був не менш розбещений за тирана, якого несвідомо вбив."
 DRL.464.a: "Гідний убивця."

 DRL.465.t: "У темряву" #- timbothy
 DRL.465.desc: "Останні миті Оскара Дірлеванґера були задумливими. Людина, що спричинила стільки страждань, дивилася в двері на шалену завірюху й слухала вереск вітру. Виглядав так, ніби вперше за все життя спокійний. Без попередження встав і, не взявши пальта, відчинив двері та вийшов у хуртовину. Люди швидко помітили й побігли слідом, але сніг затуляв погляд уже за кілька метрів. Гнатися за ватажком означало самогубство. Чекали годинами, сподіваючись повернення короля бандитів, але він не повернувся. Прийняв долю й пішов у темряву, знаючи, що дороги назад немає. З причин, яких, можливо, ніхто ніколи не дізнається, Оскар Дірлеванґер обрав власну долю й обрав смерть.\n\nТіла так і не знайшли."
 DRL.465.a: "Якщо хтось і не заслуговував спокою, то він, але все одно знайшов його."

 DRL.466.t: "Гідний супротивник" #-empona45
 DRL.466.desc: "Оскар Дірлеванґер усміхався хаосові довкола. Ще один блискуче проведений рейд, і лише кілька втрат. Найвірніші лейтенанти задовольняли бажання, а він лишився сам вдихати створену атмосферу страху. Тому дуже розлютився, коли його витворене блаженство перервали звуки позаду. Обернувся й побачив юнака, що намагався підкрастися.\n\n«Уявив себе рятівником Росії, хлопче?» - спитав Дірлеванґер. Невдалий убивця лише зухвало дивився. Дірлеванґер націлив пістолет.\n\n«Стривай!» - сказав той, на диво, німецькою. Дірлеванґер спинився. «Я мо... можу сказати, чому ти все це робиш!»\n\n«Що ти верзеш? Я чудово знаю, чому грабую й нищу, - потішився Дірлеванґер. - Це-»\n\nЧоловік урвав його чотирма ледь чутними словами. Дірлеванґер обмірковував їх. Не такі вже приголомшливі одкровення, як їх подавали. Роздуми раптом урвав біль у грудях. Виродок вистрелив! Пістолет упав, за ним і сам Дірлеванґер. Востаннє глянув чоловікові в очі, намагаючись зробити щось, будь-що, щоб вижити. Марно: друга куля вп'ялася йому в мозок.\n\nПереконавшись у смерті, чоловік хихотнув. Вистачило простого відволікання. Іронічно, подумав він: щоб покінчити з одним із найстрашніших людей усієї Росії, вистачило чотирьох простих слів."
 DRL.466.a: "Тобі потрібні гідні супротивники."

 DRL.467.t: "Раптова зупинка"
 DRL.467.desc: "Зрештою Оскара Дірлеванґера вбили не гріхи чи бойові рани, а найневинніша, мабуть, річ у бандитському таборі. Звичайна стандартна господарська драбина.\n\nНаглядаючи за рабами, які зводили нову сторожову вежу замість зруйнованої випадковою мінометною міною, він неуважно виліз на самий верх розкладної драбини, намагаючись дістатися верху риштовання. Та примхою долі всесвіт вирішив інакше.\n\nНаступним, що почули, був крик: вага Дірлеванґера на частині драбини, не призначеній для дорослого чоловіка, перекинула її просто на купу будівельних відходів. З уламків здійнялася величезна хмара пилу, а Дірлеванґер лежав дивно тихо. Раби трималися осторонь зі страху перед королем бандитів, удаючи, що нічого не сталося, аби уникнути можливої кари за гріх опинитися на шляху одного з німців.\n\nЗрештою за пів години один рейдер, оглядаючи будівництво, знайшов тіло з черепом, проламаним невдалої форми колодою, і ногами, досі затиснутими між щаблями.\n\nЗвісно, на той час робітники давно зникли, а палкі суперечки між тими, хто знайшов тіло, вже засівали зерна смерти 36-ї."
 DRL.467.a: "Убиває не падіння."

 DRL.468.t: "Хотлайн Орск" #- timbothy
 DRL.468.desc: "Король бандитів мертвий. Кажуть, на початку дня Оскар Дірлеванґер отримав на особисте радіо дивне й напрочуд невинне повідомлення про доставу від когось на ім'я «Яков». Вирішивши, що це звичайна адміністративна нісенітниця, яка його мало обходить, проіґнорував і взявся до справ. Та ввечері пошкодував, що не перевірив. Чоловік у зміїній масці з пістолетом-кулеметом влаштував різанину в будівлі, де жив Дірлеванґер, самотужки вбив усіх охоронців і пробився до його кімнати. Вбивця в масці не показав обличчя й просто розтрощив Дірлеванґерові голову об бетонну стіну, а тоді зник. Оглянувши кімнату, знайшли єдину залишену ним річ: дуже потерту листівку з Америки із піщаним пляжем і пальмами."
 DRL.468.a: "Яка жорстока різанина!"

 DRL.469.t: "Весела поїздка" #\\- timbothy
 DRL.469.desc: "Оскар Дірлеванґер мертвий. Після дня тяжкого пияцтва, коли сонце купало світ у пообідньому світлі, бич Уралу, за повідомленнями, привласнив найбільшу наявну машину й роздав кілька інших товаришам по чарці. Разом улаштували денний шалений автопогром: ганяли зруйнованими вулицями Орска, наказували випускати рабів і намагалися їх переїхати, стріляли з вікон і радісно реготали.\n\nЗрештою, п'яний до нестями й певний нестримности своєї машини, Дірлеванґер викликав бандита на гру «хто злякається». Той прийняв, обидва заревли двигунами й помчали назустріч занедбаною вулицею. Нікого не здивувало, що жоден не звернув: машини зіткнулися лобами, вбивши обох водіїв і кількох глядачів. Зрозумівши тяжкість події, інші п'яні бандити забрали машини й утекли далеко, поки Бригада поринала в хаос."
 DRL.469.a: "Принаймні Дірлеванґер не був боягузом."

 DRL.470.t: "Без кульмінації" #\\- timbothy
 DRL.470.desc: "День був одним із найспекотніших за всю історію спостережень. Надзвичайно дивно: лише напередодні вирувала завірюха, і на наступні тижні чекали холоду. Та сніг уже розтанув, і здавалося, ніби пекло нарешті відтануло після замерзання. Оскар Дірлеванґер із людьми буквально хекав у спеці, ледве долаючи кілька футів. Верталися з рейду, та навіть коли дехто зовсім роздягнувся, було надто гаряче.\n\nДля такого старого й кволого, як король бандитів, спека була нестерпною. Ледве подолавши кілька миль, він упав і невдовзі помер. Недосвідчений медик припустив тепловий удар чи щось подібне. Решта малого загону пересварилася за воду й припаси, а коли звістка дійшла всієї Бригади, конфлікт зріс стократно. Незвична спека невдовзі минула, але наслідки лишилися."
 DRL.470.a: "Може, божественне втручання?"

 DRL.471.t: "Король Гори" #\\- Pacifica
 DRL.471.desc: "Цей похід Дірлеванґер із людьми робив багато разів: маловідомим перевалом засніженого Уралу обходили з флангу багате, соковите селянське село, що тулилося на схилі гори на відокремленому плато. Та ця подорож швидко виявилася несхожою на інші: вітер шмагав рейдерів, а сніг загрожував поховати живцем.\n\nЗа Дірлеванґеровими вигуками й сержантським ліхтарем попереду люди повернули до безпечного табору й дещо надійнішого спуску, звідки прийшли.\n\nЛише на півдорозі вниз помітили, що вигуки стихли, і веде їх тільки ліхтар. Попри щиру спробу знайти ватажка, нічого не могли вдіяти. Пригнічене сварливе зборище втекло до табору, втративши ще кількох через падіння й снігові ями під деревами.\n\nТільки через кілька днів після початку розпаду банди нарешті знайшли труп Дірлеванґера, намертво замерзлий і напівзасипаний заметом. Уральський гвардієць, що знайшов його, помітив дві речі. Перша - гниль, що вже пішла тілом, перетворюючи потворного злого чоловіка на ще потворнішу руїну муміфікованої плоті. Друга - поза: руки застигли попереду, наче захищався від чогось, що нападало на обличчя.\n\nДля Уральської гвардії це, звісно, не мало значення. Коротко порадившись, тіло просто скинули з найближчої кручі й назавжди віддали забуттю."
 DRL.471.a: "Може, краще ніколи не знати правди."

 DRL.472.t: "Спірні повідомлення" #- deathgriffin(See note below)
 DRL.472.desc: "Наступного дня після поїздки до Маґнітоґорска на запрошення Трофіма Лисенка, божевільного науковця, що заволодів Чорною Горою, Дірлеванґер зник. Кілька днів доля була таємницею - донині. Представник Маґнітоґорска оголосив, що Дірлеванґер вертався до твердині в Орску, коли вантажівка з'їхала з дороги й упала на сотні футів униз схилом, убивши всіх при ударі. Та чутки кажуть: він не вертався з успішної зустрічі, а тікав. Мовляв, люди Лисенка спробували захопити його й охоронців живими після зустрічі, та ті вирвалися із засідки й поверталися на свою територію, коли їх виявили й зіштовхнули з дороги, щоб не дати повернутися.\n\nХай якою буде правда, наслідки смерти ватажка вже помітні. Колишня Бригада Дірлеванґера вже тріскається: різні банди й кліки намагаються захопити контроль чи відколотися. Схоже, жахіття півдня Росії ненадовго переживуть ватажка."
 DRL.472.a: "Ті гірські дороги бувають такими небезпечними."
 #(This event should only trigger under specific circumstances. For more info see MGN.115)

 DRL.473.t: "Лабораторний щур" #-deathgriffin (see note below)
 DRL.473.desc: "Прийнявши запрошення Лисенка до Маґнітоґорска, Дірлеванґер гадав, що обговорюватиме умови союзу проти Уральської Ліги. Після пишного бенкету на честь союзу, з щедрою їжею й випивкою, король бандитів із людьми пішов до тимчасових кімнат проспатися. Тоді Лисенко й ударив. Його люди штурмували готель, де зупинився Дірлеванґер із почтом, заскочивши зненацька й захопивши майже всіх без особливого спротиву. Коли зв'язаного за зап'ястки й щиколотки Дірлеванґера виносили, він німецькою кричав і лаяв полонителів, своїх людей, приголомшених свідків і всіх, хто міг чути. Його доправили до особистої лабораторії Лисенка в глибинах Чорної Гори, де, за чутками, науковець уже запланував кілька експериментів на новому улюбленому піддослідному.\n\nХоч технічно Дірлеванґер може не померти ще тижні чи місяці, залежно від витривалости, в усіх сенсах він уже мертвий, пішов зі світу. Без шансів урятувати й без іншого центрального керівництва банда вже поринула в чвари й розсіюється назад у пустки, звідки вийшла."
 DRL.473.a: "Випробувань Лисенка не побажаю нікому, крім Дірлеванґера."
 #(This event should only trigger under specific circumstances. For more info see MGN.116)

 DRL.474.t: "Смертельне занурення"
 DRL.474.d: "Шлях від добре охоронюваного прикордоння Уральської Ліги пролягає лісистою місцевістю, повною старих лісовозних доріг і майже без доступної води. Проте тієї малої, що є, недооцінювати не слід.\n\nТікаючи від кордону після успішного рейду на тамтешні казарми Уральської гвардії, вантажівка Дірлеванґера неслася дорогою, якою він їздив багато разів. Та на знайомій галявині помітив дерево поперек звичного шляху. Вилаявшись і вивернувши кермо, король бандитів обрав менш ходжений шлях - місцевість, яку оглянув на випадок потреби.\n\nВиїхавши на галявину з рівним засніженим лісовим ґрунтом, зрозумів: оглянув недостатньо ретельно. Із тривожним ривком земля провалилася під колесами, а під ним почали ламатися крижані брили.\n\nТреба віддати належне: Чорний Бандит зумів пробитися з кабіни й поплив угору до світла. Та ніщо не врятувало від крижаної завіси над ним, що замкнула в морозній глибині. Дряпаючи замерзлу поверхню озера, поки вантажівка позаду тонула на дно, Дірлеванґер нарешті поліг не в бою, а від задухи."
 DRL.474.a: "На дно, до скрині Дейві Джонза тебе!"

 DRL.475.t: "Танцюй, доки не впадеш" #\\- timbothy
 DRL.475.desc: "Після ще одного дня розпусти й жорстокости Оскар Дірлеванґер із товариством зібрався біля багаття: сміялися й робили звичне. Один солдат дістав вишукану рідкісну крадену скрипку й сказав, що вміє грати. Почав традиційну німецьку народну мелодію, і всі німецькі солдати засміялися, підвелися й затанцювали. Згодом долучилися навіть росіяни й українці, а на загальний подив сам Дірлеванґер підскочив і почав рухатися, коли мелодія прискорилася.\n\nТанцювали кілька хвилин, навіть Дірлеванґер радісно хихотів. Стрибав, підстрибував, вальсував і виконував усі танці, які туманно пригадував, аж раптом лівою ногою втрапив у калюжу мастила. Страшенно послизнувся, череп ударився об землю з нудотним тріском, подібним до удару двох більярдних куль. Скрипка відразу стихла, солдати зібралися перевірити, чи все гаразд. Явно ні, і після кількох тичків стало ясно: мертвий. Танок швидко обернувся панікою, поки гуляки намагалися зрозуміти, що робити далі."
 DRL.475.a: "Рухи були непогані, та над точністю слід попрацювати."

 DRL.476.t: "Ретельна документація"
 DRL.476.desc: "За люб'язною «рекомендацією» Лисенка та його науковців верескливі орди Дірлеванґера накинулися на село, де жили кілька колишніх совєцьких дослідників, які відмовилися йти з безумцем на Чорну Гору. Власноруч прорізаючи шлях крізь селян, Дірлеванґер натрапив на непоказний будинок у трохи заможнішій частині містечка. Вибивши вхід прикладом, насамперед побачив чоловіка з мертвими сліпими очима, зверненими до нього.\n\nСліпий простягнув руку спинити - й Чорний Бандит без роздумів застрелив його.\n\nОбшукавши тіло на цінності й прихиливши до стіни, Дірлеванґер обнишпорив решту будинку. Нічого, крім одного малого сейфа в стіні.\n\nПостріл у замок легко відкрив уміст, і, мов дитина подарунок, він витяг... папери. У сейфі були лише старі документи зі знаками Совєцького Союзу. Зверху причеплено стос світлин: на одній, здається, сліпий стояв на горі й махав рукою, позаду інші гори. Звичний уральський краєвид розгортався на винятково якісній світлині.\n\nДірлеванґер засміявся й кинув її в калюжу крови.\n\nЗа свідченнями банди, це останнє, що він зробив. Оскар Дірлеванґер зник уночі за годину після рейду, лишивши тільки сліди чоловіка, що біг, рятуючи життя."
 DRL.476.a: "Деяких речей, схоже, бачити не слід."

 DRL.477.t: "Пранці"
 DRL.477.desc: "Прострільний і пекучий біль у спині та нижніх кінцівках; параліч; раптова втрата рівноваги; зрештою психоз і смерть. Для досвідченого медика - явні симптоми пізньої стадії нелікованого сифілісу; для Оскара Дірлеванґера, ватажка сумнозвісної орди бандитів, що носила його ім'я, - провісники власної загибелі. Сифіліс, прозваний «пранцями», - венерична хвороба, що може роками, навіть десятиліттями не давати симптомів і забирала безліч жертв від появи в Старому Світі з Америк у XVI столітті. Часом симптоми помітні вже за кілька днів після зараження; інколи збудник Treponema pallidum просто ховається в організмі, перш ніж раптово проявитися й за лічені дні вбити жертву. У Дірлеванґера стався другий випадок: від перших симптомів минуло лише кілька днів, перш ніж люди знайшли його мертвим у скрученій позі, з обличчям-маскою муки."
 DRL.477.a: "Схоже, гідний кінець."

 DRL.478.t: "Дуель" #- timbothy
 DRL.478.desc: "Наприкінці рейду Оскар Дірлеванґер збирав звичну частку бандитської здобичі, коли один молодший попросив більшої за звичайну частки за виняткову роботу. Дірлеванґер підвів очі, зареготав і відмовив. Та юнак теж не поступався. Запропонував виклик: дуель, переможець забере всю частку. Дірлеванґер уже два дні нікого не вбивав без потреби й погодився.\n\nСтали спина до спини й почали відміряти по десять кроків. Звісно, Дірлеванґер не збирався бути чесним: на сьомому обернувся зі зброєю напоготові.\n\nНа його лихо, суперник обернувся на шостому.\n\nПосеред чола Дірлеванґера з'явився кульовий отвір, і старий упав мертвий. Юнак недовго святкував: його теж швидко застрелили за вбивство короля бандитів, але шкоду вже завдано. Звістка швидко поширилася, і Бригаді, ймовірно, недовго лишилося на цьому світі."
 DRL.478.a: "Шахрая може перемогти лише інший шахрай."

 DRL.479.t: "Стукіт у двері"
 DRL.479.desc: "Поваливши колишнього господаря, НКВД Чорної Гори не гаяв часу й розчавив Чорного Бандита. Загартовані, але дезорганізовані бандитські бригади не могли змагатися з добре вишколеною 22-ю мотострілецькою дивізією й швидко втекли з поля з тяжкими втратами.\n\nПроте Дірлеванґер доволі вправно вислизнув і сам подався на південь, поки Бригада розвалювалася. Зупинившись у покинутій господарями хаті, виснажений Чорний Бандит заснув.\n\nТа сон мав урватися. О першій ночі це сталося. Страшний стукіт у двері, і четверо добірних енкаведистів вриваються до спальні. Не давши вчасно опиратися, затягли Чорного Бандита у вантажівку й роззброїли. Тоді почалися звинувачення.\n\nДві тисячі сімсот п'ятдесят вісім убивств, чотириста дев'яносто зґвалтувань, жахливі дії проти Совєцького Союзу, грубий тероризм, пособництво нацистам, політична ненадійність...\n\n«Суд» тривав сорок хвилин і скінчився, природно, визнанням винним за всіма пунктами. У рот запхали ганчірку, щоб припинити благання, і комісар загону НКВД прострелив голову. 22-га мотострілецька негайно пішла, обливши тіло бензином і підпаливши; лише труп Дірлеванґера, що тлів до самого попелу, свідчив про їхню присутність."
 DRL.479.a: "Ось вони йдуть забрати ще одного..."
 #To only fire if the NKVD kills Lysenko and then beats Dirlewanger

 DRL.480.t: "Гордість передує падінню" #- Shibboleth98
 DRL.480.desc: "Шукаючи свіжої здобичі для війська, загін Бригади натрапив на те, що описав як неймовірне багатство й силу, на голому пагорбі за три дні на південь від головного табору. Повернулися з історіями такими неймовірними, що вони могли бути лише правдою: про зброю, золото й їжу в таємному совєцькому військовому схроні. Тож Дірлеванґер вибрав жменьку найвірніших лейтенантів і пішов наступного світанку, а за очима вибухали видіння золота, свинцю й вогню. Ясно було: рушій не цілком розумний, якщо розум у ньому колись узагалі був.\n\nШлях виявився тяжким навіть для ветеранів: повзуча гарячка чи безумство охопили більшість, багато хто зникав уночі, кричачи про «прокляті видіння», демонічні появи. Та Дірлеванґер бачив лише силу, що сяяла в денному й нічному небі, новий наркотик пульсував у занепалих судинах. Байдуже, скільки часу мине; а до речі, чи не сорок днів від виходу? Неважливо. Знайде. Знайде.\n\nПагорб постав перед ним, мов видіння; слабкий від голоду й спраги, він сам упав на голий схил і викрикнув первісні звуки перемоги. Увесь загін відпав, але він тут - він тут! Усе неможливо яскраве. Контури змінювалися. Розмита постать вела до краю кручі. Він побачив дрібне царство, створене під дулами й скріплене терором і болем. Звуки, подібні до слів, слабкі, та безпомилкові. «Ти купив світ і зламав душу, Оскаре. Хаос і кров ллються з твоїх уст. Тепер твоя доля - загибель, твій бог - черево, а слава стане соромом. Помри, Оскаре, й не знайди спокою». Тоді він упав - назавжди."
 DRL.480.a: "Смерть у цьому житті - правосуддя в наступному."

 DRL.481.t: "Брак віри" #- Ackbar, only fires if Dirly is at war with the Ural Guard and UG controls Orsk
 DRL.481.desc: "Попри всі зусилля Бригади, добре вишколені сили Уральської гвардії йшли дедалі ближче до Орска. Коли вони були на околицях табору, Дірлеванґер вирішив евакуюватися з кількома десятками найближчих і сховатися в уральських передгір'ях, покинувши більшість здобичі.\n\nПопри дедалі тяжчі обставини, постійні втечі від невпинно близької Гвардії й убогі припаси, Дірлеванґер велів не втрачати віри й вірности. Обіцяв план повернення награбованих статків, помсти Уральській гвардії й утечі на захід до порятунку в Московієні. Та план був туманним і постійно мінявся: одного дня - розпалити громадянську війну в Маґнітоґорску, наступного - пограбувати золоті запаси Орєнбурґа, тоді - визволити товаришів із в'язниць Гвардії. Послідовникам, яких стрімко меншало, здавалося, що він марить або просто каже бажане, щоб лишитися живим.\n\nНе дивно, зрештою їм урвався терпець. Один вирішив видати його, повідомивши розвідникові Гвардії місце останньої схованки. Коли гвардійці наблизилися, люди розсіялися вночі, лишивши Дірлеванґера самому рятуватися. Проте Чорного Бандита знайшли мертвим на дні яру: схоже, наклав на себе руки, щоб уникнути полону."
 DRL.481.a: "Його час минув."

 DRL.482.t: "Трав'яний пагорб" #- Shibboleth98
 DRL.482.desc: "На параді з нагоди чергової вдалої зачистки села й знищення противників його влади Дірлеванґер був на висоті - буквально й переносно. Адреналін і дивна суміш метамфетамінів, барбітуратів та випадкових племінних витворів у крові спричинили б більшості лікарів зупинку серця, крім, мабуть, того, хто лікував самого Адольфа Гітлера. Він хитався в кузові напіввідновленого «Кеттенкрада», нестямний від блаженства, а люди нишпорили вулицями, виючи від сміху й пияцтва. По двоє й четверо прослизали в хати, і невдовзі ті оживали жахливим шумом або мовчали.\n\nНа другому поверсі колишньої бібліотеки за сотню ярдів снайпер методично й легко чистив рушницю. Ім'я час забуде, а вчинків - ні. Востаннє протер приціл, поклав рушницю на підвіконня й прицілився. Аґенти НКВД 547b і 547a взяли пістолети й пішли до головної вулиці. Мету ясно виклали на інструктажі. За провалом - ліквідація. Для дії буде лише одне вікно можливости. Дісталися площі, побачили постать, що танцювала на «Кеттенкраді», прицілилися. З'явився й самотній стрілець, що приплив виром пилу й крови Західної Росії; радикалізований комунізмом, саме він дістане жахливу кару Бригади в останні години перед її розпадом. Дійшов до нажаханого, витріщеного натовпу, витяг пістолет із безглуздо довгою цівкою, вистрелив від стегна.\n\nКулі дісталися Оскара Дірлеванґера й почту за 4.53 секунди, пробиваючи їх у 15 різних місцях під різними кутами й рикошетячи. Оскар загинув миттєво. Свідки бачили, як найбільший цілий шматок голови впав назад і ліворуч, перш ніж хлюпнути на бруківку купою гнилого м'яса."
 DRL.482.a: "Назад і ліворуч. Назад і ліворуч."

 DRL.483.t: "Смертельний люмбаго" #-Ackbar
 DRL.483.desc: "Усе почалося з невеликої скарги табірному лікареві на біль у попереку. Її відкинули як наслідок незручного сну: наступної ночі спати горілиць, і мине. Та вранці проблема лишилася, попри виконану пораду. Вона не була виснажливою й не заважала вести людей. Але з часом стан Оскара Дірлеванґера гіршав. Біль зростав від слабкої ломоти до гострого, колючого щоразу, як ішов чи нахилявся. Колись прості справи, як їзда верхи чи стрільба, стали нестерпними тортурами. При кожній спробі відчував біль, який порівнював із триманням спини над багаттям.\n\nНевдовзі Дірлеванґер зліг, не здатний навіть сісти без нестерпного болю. Щосили намагався керувати Бригадою, хоча лікарі радили спокій і не перенапружуватися. Власне, іншого й порадити не могли: гадки не мали, що спричиняє загадкову недугу - грижа диска? Затиснутий нерв? Якийсь поліомієліт? Не знали.\n\nНарешті одного ранку Оскар Дірлеванґер помер у ліжку, виючи від болю. Спирт і морфій давали лише короткі перепочинки, і навіть вони не притупили мук наприкінці. Коли крики стихли й він обм'як, люди Бригади мовчки відчули полегкість: страждання володаря скінчилися. Та поки тіло хололо, всі збагнули: Дірлеванґер у больовому маренні так і не призначив наступника. Не дивно, суперечки про керівництво швидко переросли в перестрілки, і того ж дня табір поринув у хаос."
 DRL.483.a: "Яка повільна й болісна смерть."

 DRL.484.t: "Останній заплив Барбаросси" #- Magnimik
 DRL.484.desc: "В одному з численних рейдів на півдні Росії Дірлеванґер почув про сільську церкву з безцінними іконами, які місцеві вважають святими, а кожен, хто пробує їх украсти, помирає жахливою смертю. Натхнений додати до імени ще один сатанинський подвиг, він побився з бандитами об заклад, що вкраде славетні святині й спалить усе село, покінчивши з дурною дитячою леґендою. Величезний гірський бар'єр надійно захищав село, тож Дірлеванґер збагнув: найлегший шлях - через річку, й зібрав кілька човнів для останньої пригоди. Та в гордині значно переоцінив можливості свого човна. На півдорозі той не витримав тиску юрби й товстих торб спорядження. Тріщачи під нестерпною вагою, зрештою розпався на дрібні шматки, лишивши Дірлеванґера з найближчими тонути в крижаній річці. Поки той швидко помирав від серцевого нападу після шоку холодної води, люди в інших човнах могли лише дивитися на принизливу смерть ватажка, плануючи зайняти його місце, щойно дістануться берега.\n\nЗі смертю короля бандитів селяни тепер можуть спокійно спати без страху нападу: його люди кинулися одне на одного відразу на суходолі, ставши нездатними до рейду без ризику побачити власні голови на вилах розлючених селян. Саме це спіткало нещасних, які не спробували втекти з відібраною в колишніх бойових товаришів здобиччю."
 DRL.484.a: "Раз ветеран Барбаросси - назавжди ветеран Барбаросси."

 DRL.485.t: "Родіна пробуджується" # Lorepapa Saladin
 DRL.485.desc: "У глибині душі Дірлеванґер підозрював, що так станеться. Не можна грабувати й плюндрувати безліч сіл, перш ніж цивільні почнуть думати про відсіч. Звісно, опір уже зустрічали, цього й чекали. Та організований бій слабкого слов'янського селянина вважали неможливим - і ось гурт стояв перед особистим загоном Дірлеванґера, вимагаючи піти.\n\nОскар висунувся з вікна вантажівки й закричав: «Геть із дороги, до біса! Хочете скінчити, як усі, хто став мені поперек?!» Селяни перезирнулися, криво посміхаючись, і старший чоловік у кумедному капелюсі витяг пістолет зі штанів. Відкрив вогонь по машині, зрешетив водія, а селяни кинулися на неї, перебили решту в жорстокому ближньому бою й витягли Дірлеванґера.\n\nТого, хто брикався й кричав, кинули посеред селянського кола. Він підвівся й побачив довкола найлютіші обличчя у своєму житті. Вони свердлили поглядом, стискаючи зброю, а він поволі оцінював становище. Дірлеванґер ковтнув і заплющив очі. «Швидше», - пробурмотів, і вони виконали прохання."
 DRL.485.a: "Як кожен король, король бандитів не любив підданих. І вони його теж."

 DRL.486.t: "Червоний бенкет" #- Shepard
 DRL.486.desc: "Після поразки Уральської Ліги Бригада Дірлеванґера тріюмфально грабувала нові землі, ріжучи й убиваючи цивільних скільки заманеться. Коли грабунок припинився, Оскар Дірлеванґер із кількома офіцерами пішов на переможний бенкет із Лисенком. Тисячі жінок також супроводжували людей обох, коли товариство з'явилося біля урядової будівлі в Маґнітоґорску. Гулянка була бурхливою й хаотичною: Бригаду обсипали тисячами й тисячами пляшок горілки. Оскара, звісно, тішило безмежне спиртне, й невдовзі його й так жахливий п'яний розгул посилився: він гордо говорив про Бригаду й верз нісенітниці. Це була строката суміш бажань - від зґвалтувати кожну жінку Росії до здобути кожну пляшку горілки, яку Бригада колись могла б мати. Пияцтво поєднувалося з обжерством свіжою курятиною й хлібом, досконало приготованими кухарями Лисенка. У п'яній радості так напхався, що неминуче почав давитися. Невдовзі почали давитися й люди, а за ними сам Дірлеванґер теж уже не міг дихати. Тоді в чистій агонії й люті підвів очі й побачив усміхненого Лисенка в кінці столу, який діставав із кишені малу пляшечку миш'яку. Перш ніж годинник вибив північ, кожен офіцер Бригади помер від власної ненажерливости й нестримного прагнення втіхи."
 DRL.486.a: "Не відкушуй більше, ніж можеш прожувати."

 DRL.487.t: "Повалено!"
 DRL.487.desc: "Приголомшлива сьогоднішня новина: Дірлеванґера вбили власні люди. Не отримавши від нього платні здобиччю й краденим добром, різні бандити, найманці та колишні есесівці, схоже, повалили ватажка, ув'язнили й зрештою повісили за старим табором.\n\nТепер банда в хаосі, вже утворилося багато відколотих груп Бригади Дірлеванґера, що тероризують пустки. Та зі смертю Дірлеванґера сила угруповання значно зменшилася, й рештки вже, схоже, розвалюються чи відступають углиб Росії."
 DRL.487.a: "Ворог усередині."

 DRL.2000.t: "Бригада ламає Гору"
 DRL.2000.desc: "Сьогодні Чорної Гори більше немає. Нескінченні зали й лабораторії люди Дірлеванґера перевернули догори дриґом і вичистили до останку. Кілька винахідливіших уже синтезують нові наркотики із запасів лабораторних хемікатів. Зламаних, закутих чоловіків, жінок і дітей експериментальних установ здебільшого випустили з камер за наказом Дірлеванґера, але лише щоб повестися з ними у звичний для Бригади спосіб.\n\nКілька провідних науковців утекли від різанини, та сам Лисенко лишився до кінця й помер у кабінеті після короткої перестрілки. Мертвого безумця витягли надвір під радісні вигуки бригадників і приголомшене мовчання полонених дослідників, яких іще не стратили. Труп обезголовили, а таку-аж-розумну голову насадили на піку. Про тіло Дірлеванґер нібито сказав: «Лишіть на землі. Це буде його останній внесок у сільське господарство».\n\nЧорна Гора в руїнах, Бригада, ймовірно, скоро грабуватиме околиці Маґнітоґорска, і співвідношення сил на Уралі змінилося невідворотно. Час покаже, чи втримає Бригада Дірлеванґера захоплене, та наразі ясно одне: Урал більше не тремтить від думки про Лисенка. Тепер має значно більшу загрозу."
 DRL.2000.a: "Розум, схоже, не рівня м'язам..."

 DRL.2001.t: "Бригада розчавлює Лігу"
 DRL.2001.desc: "Із падінням останньої фортеці-ГУЛАГу Оскар Дірлеванґер оголосив перемогу над Уральською Лігою. Його банда стратила сотні уральських солдатів, а села, колись вважані безпечними, розграбувало дедалі більше бандитське зборище.\n\nНа подив багатьох, Дірлеванґер виступив майже перед усією бригадою бандитів, говорячи про перемогу й воєнні трофеї, що спричинило радісні постріли та вигуки. Не все так чудово, як він заявив: хоча переважна більшість сил Ліги вже мертва, дехто втік у нетрі й, за повідомленнями, поклявся воювати далі.\n\nПісля падіння найбільшого ворога Бригада стала ще жорстокішою, і, схоже, Південний Урал увійшов у нову добу руйнування та хаосу..."
 DRL.2001.a: "Перемога!"

 DRL.2002.t: "Перемога над комуною"
 DRL.2002.desc: "Колись Орєнбурґ був сяйливим, хоч і неефективним, маяком поступу в уральських пустках. Люди були ввічливими й працьовитими, керівники - сектантськими, але добромисними. Тепер усе це зникло: сили Дірлеванґера випалили місто до каміння. Багатства вивезли солдати, мешканців вирізали кровожерні бандити, керівників ув'язнили, катували й стратили. Король бандитів сидить на троні з мертвих.\n\nЗвісно, це було не надто важко. Ополчення Орєнбурґа було лише ополченням, без вишколу, стандартного спорядження й компетентного командування. Армія Дірлеванґера кровожерна й варварська, та бойової майстерности ніхто не заперечить. Есесівці легко розстрілювали бідолах, що відчайдушно захищали домівки й родини, а завдані ними втрати бригадникам були рідкісними. Ті, хто втік із Орєнбурґа, мало де знайшли пощаду.\n\nСьогодні ввечері люди Бригади Дірлеванґера вечеряють і їдять добре, бо чесно заслужили. Цікаво буде побачити, як довго триватиме це добре почуття: чи нові перемоги підживлять настрій, чи поразка від здібних ворогів спричинить розколи в бандитському таборі."
 DRL.2002.a: "Орєнбурґу, ми ледь тебе знали."

 DRL.2003.t: "Остання чистка"
 DRL.2003.desc: "Була мрія.\n\nМрія про Росію.\n\nЄдину, сильну, соціялістичну, совєцьку Росію. Майже іронічно, що ваффен-есесівська бригада Чорного Бандита добила останні рештки НКВД: одна таємна поліційна організація припинила муки іншої. Попри всі зусилля, останній бастіон Совєцького Союзу здох, мов скажені пси. Оскар із Бригадою стратили останніх уцілілих жертв рейду, коли сонце сходило над крижаною пусткою, колишнім їхнім штабом.\n\nСьогодні ця мрія померла в багатті, що смерділо смертю й дешевими нейлоновими одностроями.\n\nМаґнітоґорск палає, а з ним - остання надія, що хтось на Уралі зупинить Чорного Бандита та його слід смерти."
 DRL.2003.a: "Чорна пляма чорніє дужче."

 DRL.2500.t: "Загнаний пес"
 DRL.2500.desc: "Чорна Гора Лисенка, фортеця Південного Уралу, впала перед прихованими комуністами - Уральською Лігою. Їхня організація, майже просто рейдерські загони з мріями про більше, захопила фортецю й оголосила Маґнітоґорск визволеним. Лисенко колись був одним із наймогутніших керівників регіону. Вирушав у зухвалі рейди до кожної сусідньої держави, а його люди проголосили себе справжніми наступниками совєцької наукової програми. Та Уральська Ліга їх перемогла, підняла брудні прапори над колишньою диктаторською державою й показала мешканцям міць солдатів. Звісно, це визволення - брехня, лише фасад, вигаданий для захоплення влади, але ми мало що можемо вдіяти.\n\nПоки Уральська Ліга набирає сили, а Мендрикс стає жадібнішим, мусимо перетворити нашу державу на фортецю. Фортецю проти всіх нападів. Фортецю, що збереже свободу наших людей і неволю рабів. Ми остання сила Уралу, яка борониться від цих щурів; не здамося так легко, як Лисенкова банда технократів!"
 DRL.2500.a: "Жодної здачі!"

 DRL.666.t: "Чорний Бандит на Чорній Горі"
 DRL.666.d: "Двадцять років тому навіть божевільні не сказали б нам, що Оскар Дірлеванґер і Трофім Дєнісовіч Лисенко колись зустрінуться союзниками. Та сьогодні написано історію, яка неодмінно визначить майбутнє російського краю. Рівно о 08:00 ранку Чорний Бандит прибув із тридцятьма найкращими людьми до комплексу Лисенка на Чорній Горі, привізши двадцятьох найдобірніших полонених останніх рейдів, зокрема відомого совєцького співака, в дар божевільному науковцеві.\n\nЗустріч була далека від звичайних зустрічей керівників: пишні вечері замінили значно практичнішим використанням часу. Прибувши, Дірлеванґер із Лисенком оглянув 22-гу мотострілецьку дивізію НКВД, а потім оборонні позиції Чорної Гори. Ще захопливішими стали подальша екскурсія кількома лабораторіями та демонстрації техніки й методів. Один експеримент, показаний на молодій польці, особливо потішив Чорного Бандита.\n\nНарешті день завершила тригодинна зустріч Дірлеванґера, Лисенка та їхніх перекладачів. Двоє, схоже, швидко вподобали одне одного, й домовленості між нашими силами та цими науковцями про остаточне знищення Уральської Ліги значно просунулися. Просто передавши населення, яке захопимо після неминучої перемоги, ми зможемо вибрати з незліченних технічних чудес, так довго схованих у Чорній Горі."
 DRL.666.a: "Монтеккі й Капулетті нарешті єднаються."

 DRL.1000.t: "За два тижні"
 DRL.1000.d: "Табір був тихіший, ніж будь-коли за роки. Не чулося бурмотіння й благань рабів, бо всі втекли або загинули. Не гули двигуни, бо вантажівки або пальне вкрали. Коні не іржали, бо їх зарізали на м'ясо. Люди не говорили, бо їх лишилося, мабуть, менше чверті початкового числа, а вцілілі вже не довіряли одне одному.\n\nУ центрі більше не було великого багаття. Лише маленькі вогнища з гілля й гуми розкидані довкола; малі гурти, що ще зберігали якусь злочинну приязнь, тулилися разом, підозріло дивлячись на інших. Сам Фріц Шмедес спостерігав із вікна й зітхав. Треба було швидко перегрупуватися.\n\nВирішив, що час загальнобригадних зборів. Спустився сходами й пройшов двері, та щойно вийшов, гримнув постріл і куля просвистіла біля голови. Миттєво відступив, але невдовзі збагнув: він не єдина ціль. Постріл запустив ланцюгову паніку, і незабаром табір охопила відкрита перестрілка, де кожен, здавалося, сам за себе. Чому й за що билися, вже не важило. Важило лише вижити заради жалюгідних крихт їжі й набоїв. Жалюгідний залишок Бригади нарешті розвалився, роздертий власною нестабільністю."
 DRL.1000.a: "В укриття!"
