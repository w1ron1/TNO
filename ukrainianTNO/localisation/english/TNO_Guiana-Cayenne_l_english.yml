  # Leaders
  GUC_Angelo_Almeida: "Анжело Ноласко де Алмейда"
  POLITICS_Angelo_Nolasco_de_Almeida_DESC: "Адмірал Анжело Ноласко де Алмейда обіймав багато престижних посад протягом своєї довгої кар'єри у Військово-морських силах Бразилії, але він ніколи не очікував стати військовим командувачем Союзної адміністрації Гвіани-Каєни. Його дії під час періоду Естаду Нову, а особливо придушення Конституціоналістської революції 1932 року, зблизили його із самим Жетуліу Варґасом, що призвело до його призначення ад'ютантом Варґаса у 1939 році. Під час війни він служив військовим аташе при бразильських посольствах в Аргентині та Уругваї, а згодом брав участь у вторгненні, яке привело Гвіану-Каєну під бразильську окупацію.\n\nПісля падіння варґасистського режиму Алмейда обіймав багато адміністративних посад у ВМС, завжди підтримуючи конституціоналістську фракцію Збройних сил. У 1961 році президент Лотт вшанував адмірала призначенням на чолі адміністрації Каєни. Колишня французька колонія перебувала в адміністративному підвішеному стані від самого завершення війни, після відокремлення Бразилії від Союзників та наполягання американців залишити її міжнародний статус невизначеним як важіль для майбутнього французького союзника.\n\nОднак Лотт цього не хоче. Президент доручив адміралу Ноласко де Алмейді інтегрувати економіку Каєни до економіки Бразилії, заохочувати імміграцію та створювати нові робочі місця. Адмірал усе своє життя служив бразильській державі й зробить усе, щоб виконати цю місію."
  GUC_OAS_Mandate: "Рада управління Гвіаною"
  POLITICS_GUC_OAS_Mandate_DESC: "Референдум про незалежність Гвіани-Каєни мав назавжди покласти край безладу навколо її національного питання. Натомість хаос навколо майбутнього колишньої французької колонії лише продовжився. Навіть якщо її народ проголосував за розрив із Бразилією, шлях до його здійснення залишається невизначеним.\n\nПісля звинувачень у фальсифікаціях, спалахів насильства та нищівного звіту Організації американських держав втручання стало єдиною картою, що залишилася на столі. Маючи цього століття вже двох іноземних господарів, країна тепер мусить витримати третього: перехідний уряд під наглядом ОАД, яким керуватимуть чиновники з різних держав і відомств, покликані забезпечити країні здійснення її вибору та не допустити нового спалаху насильства.\n\nОднак подвійну місію ОАД не можна виконати двома кроками. Місцевий лідер Жюстен Катайє може, висловлюючись дипломатично, бути неприємною фігурою для значної частини адміністрації, але він, тим не менш, є єдиним, хто може посісти місце майбутнього гвіанського керівництва та поставити молоду державу на ноги. Тож будь-яка спроба створити союзника, дружнього водночас Вашингтону й Бразиліа, вимагатиме як рукостискань, так і бюрократів."
  GUC_Justin_Catayee: "Жюстен Катайє"
  POLITICS_GUC_Justin_Catayee_DESC: "Під час Другої світової війни Жюстен Катайє колись боровся проти тиранії за півсвіту від дому. Він боровся за ідеали свободи й демократії, а коли повернувся додому, люди, які відстоювали ці ідеали за океаном, позбавили його їх. Сьогодні це зміниться.\n\nНароджений у Каєні, Катайє був листком, затиснутим під французьким вітром. Коли почалася Друга світова війна, Бразилія перебрала управління колонією у Франції, дозволивши йому воювати під своїм прапором. Повернувшись додому, він не знайшов свободи — лише бразильський чобіт замість французького. Гвіана-Каєна не приєдналася б до держав світу. Натомість націю було позбавлено права на існування на користь бразильського військового правління та корпоративної жадібности.\n\nКатайє вперше здобув популярність у Народній асамблеї Каєни — беззубій організації, яку він швидко покинув, засудивши її безсилля та відсутність амбіцій. Натомість він заснував Гвіанську соціялістичну партію, швидко перейнявши позицію за незалежність від Бразилії у відповідь на її нехтування. Однак після невдалої спроби вбивства стало очевидно, що нехтування змінилося жорстокістю, а незалежність стала потрібною як ніколи.\n\nАле що далі після незалежности? Як президент, Катайє має переконання й має свої дії. Він вірить у соціялізм, демократію та свободу, але як їх буде втілено в життя? Чи відкине його революція та народжена нею демократія його ідеали? Чи доведеться йому відкинути їх, щоб керувати? Він не знає, але не може дозволити цьому його зупинити."

