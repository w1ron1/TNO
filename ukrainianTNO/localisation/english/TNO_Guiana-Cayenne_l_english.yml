  # Ideas
  GUC_International_Ambiguity: "Французька спадщина"
  GUC_International_Ambiguity_desc: "Спадщина тривалого існування Гвіани як французької каторжної колонії впливає на неї й донині. Через значну кількість французьких вигнанців сутички з корінним населенням і бразильськими окупаційними силами відбуваються регулярно.\n\nВторгнення до Каєни в останні дні Другої світової війни визначило нинішнє становище регіону: Союзною адміністрацією Гвіани-Каєни керують бразильська держава та армія за дипломатичної підтримки США. Однак американці прагнуть зберігати міжнародний статус окупації неоднозначним і розмитим, щоб не накликати французький гнів чи реваншистські претензії. Поки вішистський режим був зв'язаний німцями, а держава де Ґолля була зайнята своїми африканськими справами, бразильська мета інтегрувати Каєну у свою економіку взяла гору."
  GUC_Brazilian_Immigration: "Бразильська імміграція"
  GUC_Brazilian_Immigration_desc: "Хоча імміграція між Бразилією та Французькою Гвіаною завжди відбувалася, її масштаби різко зросли після початку інтеграційної політики Лотта у 1960 році. Губернатор Анжело Ноласко де Алмейда заохочував створення численних робочих місць задля досягнення мети Лотта. Ця імміграція спричинила демографічні зміни, перетворивши бразильців на значну меншину в Гвіані-Каєні, хоча й не без сутичок із французьким та креольським населенням."
  GUC_New_Brazil_Troops: "Нові бразильські війська"

  GUC_ceaseless_riots: "Нескінченні заворушення"

  # Ministers
  GUC_Pauxy_Gentil_Nunes_hog_desc: "У юності Пауші Нунес займався спортом, а в політику прийшов на прохання свого брата Жанарі, першого губернатора території Амапа. Після одного терміну на посаді губернатора з 1958 до 1961 року він отримав запрошення від адмірала Ноласко де Алмейди очолити цивільний уряд адміністрації Каєни.\n\nПопри членство в ПСП, Нунес пообіцяв працювати задля досягнення мети Лотта, вважаючи економічну інтеграцію вигідною для сусідньої території Амапа. Нунес сприяв створенню сільськогосподарських колоній і показових ферм у Гвіані-Каєні, розвиваючи продовольче виробництво регіону."
  GUC_Luis_Mendes_da_Silva_eco_desc: "Військовий, Луїс Мендес да Сілва був обраний адміралом Ноласко де Алмейдою для керівництва процесом економічної інтеграції Каєни. Мендесу да Сілві доручено наглядати за будівництвом шосе, які з'єднають Каєну з територією Амапа, поглиблюючи економічні зв'язки та полегшуючи міграцію.\n\nХоча Мендес да Сілва має зв'язки з Кастелу-Бранку та фракцією Сорбонни у Збройних силах, він готовий працювати задля досягнення мети Лотта щодо інтеграції, навіть якщо це означатиме співпрацю з місцевими французькими елітами."
  GUC_Helio_Pennafort_for_desc: "Еліу Пеннафорт присвятив своє життя своїй кар'єрі. Журналіст, письменник і радіоведучий, Пеннафорт був політичним коментатором в Амапа та важливою постаттю в медійному й культурному житті території.\n\nХоча його призначення до уряду Союзної адміністрації Гвіани-Каєни стало для декого несподіванкою, для нього це лише спосіб дати народу можливість бути почутим, належним чином спілкуватися з бразильським урядом і забезпечити Каєну всіма необхідними ресурсами. Поки що він ефективно виконує цю роботу."
  GUC_Fernando_Belfort_Bethlem_sec_desc: "Фернанду Бельфорт Бетлем має невдячну роботу.\n\nВступивши до військової служби у 1932 році, він став перспективним і стрімко здіймався кар'єрними сходами кавалерійського офіцера ще до війни. Підвищений до капітана під час Другої світової війни, він вирушив разом із Бразильським експедиційним корпусом до Британії. Воюючи разом із Енріке Лоттом проти німецького наступу, Фернанду, попри їхню поразку, за свою хоробрість отримав подальші підвищення. Протягом 50-х років Фернанду продовжував отримувати нові звання, а у 1961 році Енріке Лотт підвищив його до генерала, після чого його негайно відправили до Каєни — місця, де кар'єра всіх бразильських генералів ішла шкереберть.\n\nТепер у Каєні Фернанду намагається підтримувати порядок із обмеженою кількістю кавалерійських військ, які має у своєму розпорядженні, і змушений використовувати бразильський гарнізон для припинення сутичок між корінним французьким, креольським та бразильським іммігрантським населенням. Хоча Фернанду досі підтримував порядок і протримався на посаді довше за деяких інших генералів, він побоюється, що одного дня станеться надто велика для нього та його обмеженого гарнізону битва, яку вони не зможуть виграти."