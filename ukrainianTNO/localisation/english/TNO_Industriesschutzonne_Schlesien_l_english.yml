 ISS_back_to_work:0 "Назад до роботи!"
 ISS_back_to_work_desc:0 "Німецький Райх розпадається, однак люди в Сілезії продовжують своє щоденне робоче життя так, ніби мало що змінилося. На світанку - на завод, сонце зайшло - із заводу. Вихідний у неділю, у понеділок - все наново. Нема часу розбиратися з цими внутрішніми чварами. Треба йти назад до роботи!"
 
 ISS_slave_repression:0 "Репресії рабів"
 ISS_slave_repression_desc:0 "Індустріальні магнати Сілезії надзвичайно налякані подіями в Прусії. Якщо в Сілезії станеться повстання рабів, якщо воно вийде з-під контролю, як у Прусії, тоді все, що ці люди зробили, буде втрачено. Усе, що Ганке побудував, не буде загублено. Раби мусять знати своє місце - під чоботом їхніх заможних німецьких хазяїв. Якщо вони не згідні - вони скоро дізнаються про своє місце - на мушці рушниці."
 
