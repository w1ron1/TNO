 HWL_Karl_Hanke:0 "Карл Ганке"
 POLITICS_Karl_Hanke_DESC:0 "Майстер з золотим чином розтоптав нижчих людей всіх видів та крові, хто пробував повстати. Тепер не лишилося нічого, окрім брязкоту ланцюгів, повороту шестерень і реву диму з фабрик.\n\nСС-ґрупенфюрер Карл Ганке важжає себе людиною честі, справедливою та чесною, але не робить нічого, окрім виконання волі індустріальних магнатів, а також зброї найманцям, котрі готові її виконувати. Звільнений на початку своїх двадцятих черезе те, що приєднався до НСДАП, Ганке прийняв роль оратора та організатора завдяки своєму таланту, через що зміг повільно, але впевнено, підніматися по адміністративних щаблях Райху, навіть пробуючи досягнути відносин із людьми високого рангу, такими як Ервін Роммель, майбутній покійник Йозеф Ґьоббельс і навіть сам Альберт Шпеєр. Тим не менш, коли на горизонті з’явилася надія на перемогу Осі, Ганке жодного разу не дав своїм амбіціям відступити хоча б на крок.\n\nТак почалися славні дні Райху, дні, коли американці відступили, французи та британці були захоплені, росіяни були лише примарною думкою на пагорбах, і світ став рогом достатку, яким Німеччина насолоджувалася. Кат із Бреслау відклав свою рушницю, натомість узяв келих шапманського, шукаючи способи побудувати своє портфоліо таким міцним, наскільки це можливо, а його погляд був звернений на зірки.\n\nАле кожен титан рано чи пізно жахливо падає. Економіка впала, Західноросійська війна поклала багатьох, сам Райх пав, і обіцяна тисяча років піднесення впала всього лише за два десятиліття. Ганке координував свої дії зі своїм добрим другом, Альбертом Шпеєром, намагаючи досягнути виживання якнайбільшої кількості шпеєрівців. Однак, поки постріли гармат лунають угорі, Ганке керує знизу, співпрацюючи з усіма промисловими магнатами в зусиллях забезпечити їхню трудову діяльність, наглядаючи за кожною тінню й кожним кутком, щоби повстання рабів не дістався їхніх кордонів...і за кожним лідером, який може стати союзником цим дегенератам-повстанцям..."

