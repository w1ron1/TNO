 ### Country Leaders ###
 POLITICS_TASHI_NAMGYAL_DESC: "11-й чоґ'ял Сіккіму та перший правитель незалежного Сіккіму, Таші Намґ'ял домінував у своїй країні протягом двадцятого століття, формуючи її шлях від старого до нового.\n\nНароджений у Тибеті, Намґ'ял успадкував королівство після ранньої смерті свого старшого брата після його призначення Далай-ламою наступним чоґ'ялом. Призначений на цю посаду в молодому віці, він керувався своїм двором та пильним оком Британської імперії, щоб підтримувати спокій ізольованого королівства, не підозрюючи про зміни, які мали відбутися.\n\nКоли старий порядок знову втратив свою актуальність, суверенітет над Сіккімом перейшов від імперії до незалежної Індії, яка не бажала вносити жодних суттєвих змін, переживаючи труднощі зростання. Уряд Азад-Гінду продовжив цей статус-кво, при цьому Намґ'ял тісно співпрацював з ними у питаннях модернізації Сіккіму, разом із його особистим прагненням до проведення давно назрілих земельних реформ.\n\nХоча його широко обожнюють бхутія та лепчі — і загалом визнають етнічні непальці — за його щедру підтримку охорони здоров'я, мистецтва та науки, особиста популярність Намґ'яла не позначилася на монархічних інституціях Сіккіму в цілому. З віком чоґ'ял дивиться на своє королівство з сумом, розмірковуючи над одним питанням.\n\n«Що прийде після мене?»"

 ### Ideas ###
 SIK_Darbar_or_Democracy: "Дарбар чи демократія?"
 SIK_Darbar_or_Democracy_desc: "У той час як решта світу відходить від уявлень про шляхетне правління, Сіккім все ще опиняється в пастці дискусії про те, скільки влади має мати його королівський двір. Запеклі роялісти та деякі армійські чиновники відкидають будь-яку ідею реформ як обман, поняття, запозичене з Заходу, непридатне для Сіккіму.\n\nЧоґ'ял має набагато тонший погляд на ці справи. Він справедливо вважає, що хвилю змін не можна стримувати вічно, особливо в ландшафті, що оточує Сіккім, тож він підтримує продумані реформи, зберігаючи при цьому всю повноту влади. Хоча цей посередній підхід досі працює, він не знаходить прихильності ні в консервативних голосів, ні в тих рідкісних фігур при дворі, які бажають просувати реформи та демократизацію."
 SIK_Legacy_of_Tumlong: "Спадщина Тумлонґу"
 SIK_Legacy_of_Tumlong_desc: "З часів Тумлонзького договору 1861 року доля Сіккіму була пов'язана з долею більших держав, перейшовши з лап Британії до Індії після того, як перша втратила статус імперії. Для всіх, окрім найбезрозсудніших, це простий факт життя - знати, що Сіккім ніколи не зможе захистити себе як повністю незалежна сутність.\n\nНаразі він існує як протекторат Азад Гінду, який контролює його оборону та зовнішню політику. Технічна підтримка з боку держави-помічника також відповідає за переважну більшість інфраструктурного розвитку, включаючи дороги, школи та лікарні Сіккіму. Якщо не відбудеться разючих змін, наступні сто років, ймовірно, будуть аналогічними попереднім стам років у питанні залежності Сіккіму."