 SBA_black_army_administration_1: "Адміністрація Чорної Армії - слабка"
 SBA_black_army_administration_1_desc: "Щоб принести Революцію всьому Сибірові й захистити нашу свободу від тих, хто хоче її знищити, ми повинні добре опанувати самооборону. Тому Чорна Армія дбає, аби за кожною травинкою справді стояла гвинтівка, а природні адміністративні вади анархізму компенсує, надаючи командирам міліції та загальному керівництву Чорної Армії певну міру загального контролю."
