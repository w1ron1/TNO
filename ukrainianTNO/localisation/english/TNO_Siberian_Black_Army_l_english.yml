 SBA_second_revolutionary_reconstruction_desc: "Сибірський Совєт пережив те, що багато хто вважав кінцем короткого анархістського експерименту. Ціною десятків тисяч життів ми вибороли незалежність від тирана Яґоди. Та Революція ще не в безпеці: остання війна виснажила армію, а вціліла промисловість не здатна виробляти зброю для поповнення запасів. Ми не відступимо: вже готуються плани визволення Сибіру, а солдати прагнуть поширити революційний анархізм усією Росією. Ні богів, ні панів - лише людина!"
 SBA_second_the_red_mantle_desc: "Сибірський план був велетенською програмою індустріялізації віддалених від німецького фронту районів Росії перед Німецько-совєцькою війною. Ми програли, але створена тоді промисловість дала Совєцькому Союзові змогу протриматися значно довше, ніж хтось сподівався. За іронією, землі Сибірського Совєту майже не були охоплені планом, тому наш промисловий потенціял поступається сусідам. Та наявна промисловість стане міцною основою подальшого розвитку."
 SBA_second_the_peoples_survey_desc: "Для правильного розподілу ресурсів у комунній економіці треба знати, які землі придатні для промисловости, видобутку та сільського господарства. Кордони між режимами воєначальників до того ж непевні й мінливі. Землевпорядне обстеження покаже наші точні володіння й цінні або стратегічні землі, які слід боронити. Тому місцеві громади добровільно проведуть «Народне опитування», обстежуючи свої землі спільно із сусідніми комунами."
 SBA_second_industrial_data_consolidation_desc: "Через нашу незвичайну децентралізовану систему якість і кількість промислового устаткування кожної комуни часто залежать від того, що вона здатна виробити сама. Це спричинило величезну нерівність у промисловій силі, і деякі громади не можуть задовольнити власних потреб. Звівши надані комунами промислові дані, ми визначили громади, яким інвестиції у виробничі можливості принесуть найбільше користи."
 SBA_second_begin_the_redistribution_desc: "Земельну реформу, розпочату під час створення Сибірського Совєту, так і не завершили: виживання у Сибірській війні поглинуло весь час і сили. Тепер ми можемо поновити перерозподіл землі за потребами громад. Через невирішеність питання деякі комуни користувалися чисельністю й робочою силою, витісняючи сусідів із потрібних їм земель. Реформа справедливіше й рівноправніше змінить кордони комун."
 SBA_second_repair_the_transsib_desc: "Одним із небагатьох успіхів старого царського режиму була Транссибірська залізниця, що зв'язала Росію, як ніколи раніше. За Бухаріна нею широко користувалися, а після Другої світової вона стала життєвою артерією Союзу в Совєцько-німецькій війні 1950-х. Після поразки німецькі бомбардувальники майже знищили колію. Тепер, коли вони далеко від російського неба, ми можемо відновити нашу ділянку й повернути їй частину колишнього блиску."
 SBA_second_continue_regional_interconnection_desc: "Подальший розвиток інфраструктури - мета, до якої завжди варто прагнути. Він не лише поліпшує рух ресурсів країною, а й зближує комуни в економічному та політичному сенсі. У міру розширення Сибірського Совєту ці зв'язки зазнаватимуть дедалі важчих випробувань, тому все, що може їх зміцнити, матиме життєве значення. Задля цього ми вкладемо кошти в мережу шляхів, яка простягнеться через увесь Сибірський Совєт і сполучить нас навіть із найвіддаленішими комунами."
 SBA_second_return_to_the_mines_desc: "З відновленням нормальної господарської діяльности й значним стимулом у вигляді громадських відбудовчих проєктів економіка почала стрімко зростати. Попит на мінеральні ресурси збільшився майже вдесятеро, а чимало комун не мають потрібного обладнання, щоб його задовольнити. Тепер, коли зникла загроза знищення великих гірничих підприємств німецькими бомбардувальниками, настав слушний час знову відкрити раніше закриті шахти. Крім того, треба розпочати виробництво нового гірничого обладнання й розподіляти його між комунами, де вже є придатні родовища."
 SBA_second_dedicated_agricultural_production_desc: "Наші комуни більшають щодня. Харчова й економічна безпека, яку вони дають звичайним родинам, помітно підвищила народжуваність. З огляду на це потреба збільшити сільськогосподарське виробництво стає дедалі нагальнішою. Тому ми маємо виготовляти механізовану сільськогосподарську техніку й розподіляти її між комунами, щоб вони могли виробляти більше. Це не лише допоможе селянам збільшити врожаї, а й звільнить робітникам час для інших завдань."
 SBA_second_rural_production_nodes_desc: "Серце анархістського суспільства - не міста чи передмістя, а сільські містечка й місцеві громади. Треба позбавити їх залежности від міст у промислових товарах. Ми заохочуватимемо місцеві майстерні, де комуни вироблятимуть потрібні речі самостійно. Виробництво автоматів Калашнікова просто у себе вдома також дасть їм змогу легше озброюватися."
 SBA_second_the_foundation_laid_desc: "Ми раз у раз доводили перевагу нашої ідеології, утіливши анархістський експеримент, який багато хто вважав неможливим. Не зраджуючи моралі, ми створили економіку на користь усім, а не лише привілейованим власникам засобів виробництва. Економічний фундамент країни всіх народів Росії та для них завершено."
 SBA_second_the_grey_area_desc: "В ідеальному світі анархістське суспільство постало б природно як народна відповідь корумпованим і несправедливим державам, що ставлять багатіїв понад усіх. Та люди виявилися прив'язанішими до держав, ніж ми гадали, а багато держав вороже ставляться до самого нашого існування. Окремі комуни не відоб'ють вторгнення, тому для виживання потрібне централізоване військо. Але хіба воно не суперечить основам анархізму? Хіба центральна рада над усіма комунами, хоч би якою демократичною вона була, не суперечить тим самим ідеалам? Як далеко можна відійти від коріння, не зрадивши ідеологічного ядра? Треба заохотити цю дискусію й точно визначити права комун та особи супроти центральної влади."
 SBA_second_delegate_industrial_administration_desc: "За своєю суттю комунізм - ідеологія, головна мета якої повернути засоби виробництва народові. Передавати контроль над економікою централізованому урядові цілком суперечило б цій ідеї. Щоб підвищити ефективність господарства, краще створити промислову раду з представників кількох комун. Вона складатиме перелік можливих промислових удосконалень і напрямів інвестицій, а потім передаватиме його місцевим радам кожної комуни на розгляд. Крім того, промислова рада отримає визначений обсяг капіталу, щоб допомагати втілювати такі будівельні проєкти в найбідніших комунах."
 SBA_second_the_industrial_security_council_desc: "Складне завдання підвищення промислової ефективности можна виконати лише за допомогою централізованої бюрократії. Окремі комуни не мають засобів для промислового розширення такого масштабу, якого здатен досягти військовий апарат. Ми маємо скористатися наданими нам військовими повноваженнями й створити організацію, що безперервно збиратиме та аналізуватиме промислові дані, укладаючи перелік можливих удосконалень і напрямів розширення. Нова бюрократія зможе обов'язково запроваджувати ці заходи в кожній комуні."
 SBA_second_roads_for_grain_desc: "Будівництво шляхів між комунами набуватиме дедалі більшої ваги, якщо ми хочемо гарантувати їхні процвітання й торгівлю. Задля цього ми створимо зерновий банк, що розподілятиме додаткове зерно між комунами, які прокладають дороги на контрольованих територіях і довкола них. Запаси банку поповнюватимуться добровільними внесками зерна від комун із надлишком. Натомість вони отримуватимуть грошову компенсацію або сировину чи машини такої самої вартости, як надане ними зерно."
 SBA_second_collective_defense_requirements_desc: "Поліпшення інфраструктури є вимогою національної безпеки. Якщо на нас раптово нападуть на напрямку, де майже немає війська, або ми якимось безглуздим чином опинимося у війні на два фронти, треба буде швидко й ефективно перекидати частини туди, де вони потрібні. Щоб розв'язати проблему, військо має запровадити обов'язковий збір на колективну оборону, надходження від якого оплатять розширення інфраструктури. Це може викликати невдоволення комун, але такий податок служитиме спільному благу."
 SBA_second_incentivize_qualified_personnel_desc: "Сибірському Совєтові дедалі важче знаходити кваліфікованих фахівців у важливих галузях, як-от механічна й електрична інженерія. Значною мірою це наслідок зникнення організованої освіти в Росії після розпаду. Найкращий спосіб полегшити становище - заохотити людей обирати ці професії. Ми створимо програму наставництва для чоловіків і жінок, що вступають до відповідних галузей: учень зможе опановувати ремесло під керівництвом підготовленого фахівця й водночас отримуватиме платню від уряду."
 SBA_second_black_army_engineer_brigades_desc: "Нестача кваліфікованих фахівців безпосередньо шкодить нашій здатності захищатися. Скориставшись наявною навчальною системою Чорної Армії, ми призиватимемо людей, придатних до спеціялізованої праці, й навчатимемо їх саме тих дисциплін, яких вимагатиме майбутня робота. Після короткої служби в армії вони повернуться до рідних комун, де застосують набуті вміння на користь громади та розвитку економіки. Від цієї програми виграють усі!"
 SBA_second_assist_village_schools_desc: "Освіта - головний засіб вивести комуни з давнього способу мислення у XX століття. Треба надати їм більше ресурсів для розвитку освітніх послуг, щоб вони могли будувати кращі школи й осередки вищої освіти. У межах програми ми відрядимо з міст кваліфікованіших викладачів, які протягом наступних кількох років допомагатимуть готувати нових учителів. Крім того, слід збільшити кількість учнів у школах і студентів у коледжах, щоб наші люди справді скористалися новими доступними можливостями."
 SBA_second_expand_the_umbrella_desc: "Школи та навчальна програма є життєво важливою частиною національної безпеки. Цілком неприпустимо дозволити людям стати жертвами реакційних і контрреволюційних ідеологій. Треба підпорядкувати освіту військовій адміністрації, щоб гарантувати: реакційна думка не проникне у свідомість нашого народу. До того ж централізована освітня система може принести власні переваги - більшу ефективність і кращу координацію між школами та університетами."
 SBA_second_the_contradictions_settled_desc: "Подібно до Совєцького Союзу до нас, ми нарешті дійшли висновку, доки сягає влада центрального уряду й які права зберігаються за людьми та комунами. Внутрішні суперечності нашої анархістської держави нарешті розв'язано, а разом із ними - низку логістичних і адміністративних проблем, що раніше мучили загальний уряд. Хай який шлях ми обрали, важливо пам'ятати: усе зроблене служило вищому благу та російському народові. Нехай історія згадає нас добрим словом."
 SBA_second_the_black_army_desc: "Чорна Армія стоїть на сторожі Революції та свободи й відіграватиме незамінну роль у визволенні Сибіру з рук тиранів і диктаторів. Сибірська війна тяжко вдарила по наших збройних силах, і в багатьох аспектах ми досі оговтуємося від її наслідків. Навіть у спорядженні та людях - двох галузях, де ми зазвичай випереджали сусідів, - лишається багато надолужити. Треба ретельно оцінити нинішній стан війська й визначити всі напрями, які потребують поліпшення."
 SBA_second_review_the_chain_of_command_desc: "Через нашу незвичну гібридну систему військової демократії армійських офіцерів обирає народ, а не призначає безлике верховне командування. Вибори демократизували військо, що останніми роками фактично виконувало роль централізованого уряду, але водночас відкрили шлях до влади цілковито нездарним недоумкам. Попри це, армія зберігає право усувати виборних офіцерів, якщо ті не здатні виконувати доручені обов'язки. Ми маємо почати перевіряти нинішніх командирів, щоб переконатися: нашими бригадами не керують такі некомпетентні люди."
 SBA_second_learning_from_experience_desc: "Сибірська Чорна Армія має у своєму розпорядженні одних із найкращих генералів усієї Росії. Від Громадянської війни в Росії до нещодавньої Сибірської війни вони бачили все. Треба використати їхній сукупний досвід для створення нової програми підготовки офіцерів. Крім того, слід разом із найдосвідченішими генералами виробити єдину військову доктрину, за якою навчатимуть молодших командирів."
 SBA_second_specialized_unit_roles_desc: "З часом верховному командуванню Чорної Армії ставало дедалі очевидніше: щоб захистити країну й не відстати від інших російських військ, наші сили потребують дальшої спеціялізації. Окремі ролі набуватимуть дедалі більшої ваги в міру перетворення на справді сучасну армію з бронетанковими дивізіями та повітряною підтримкою. Тому ми збільшимо фінансування спеціялізованих підрозділів. До таких напрямів належать важке озброєння, інженерна справа, розвідка й проникнення."
 SBA_second_black_guards_divisions_desc: "Серед найкращих бійців Громадянської війни в Росії були наші тачанки - відважні солдати, які мчали в бій на запряжених кіньми возах із кулеметами. Треба створити підрозділ подібної сили й майстерности. Цю роль виконуватиме новостворена Чорна гвардія. Елітна організація прийматиме лише найкращих бійців Чорної Армії та запровадить випробування, щоб визначати, хто гідний вступу. Зрештою ці важкоозброєні частини зможуть швидко розгортатися по всій країні й облаштовувати оборонні або наступальні позиції всюди, де це буде потрібно."
 SBA_second_enhanced_equipment_channels_desc: "Наша теперішня система координації військових поставок до заводів, що виробляють зброю, і від них не лише неефективна, а й може стати серйозною перешкодою для дальшого зростання та розширення. З огляду на це чимало бюрократів, зайнятих у системі, запропонували реформи, що мають послабити проблеми ланцюга постачання. Серед них - великий відсоток поломок, нездатність відстежувати й контролювати запаси, вузькі місця та багато іншого. В основі всіх цих негараздів лежить недостатній зв'язок. Проклавши телефонні лінії між кожною фабрикою та складом постачання, ми досягнемо небаченого рівня координації й, сподіваємося, поліпшимо промислове становище."
 SBA_second_the_new_tachanka_desc: "У перегонах за об'єднання Росії наші бронетанкові дивізії технологічно відстали дуже далеко. Щоб виправити становище, ми розбираємо й відтворюємо захоплені німецькі, японські та американські танки, що лишилися після Сибірської війни й попередніх конфліктів. Технічні знання, здобуті з цих конструкцій, разом із великим масивом даних про бойову ефективність Т-34 і Т-44 у минулих війнах дали змогу створити цілком нову й оригінальну машину."
 SBA_second_expand_on_the_design_desc: "Розвиток технологій і конструкторської бази нарешті дозволив істотно просунутися в роботі над новим основним бойовим танком. Машина поєднає низку нових технологій: електричний стартер, двоплощинний стабілізатор гармати, базові прилади нічного бачення, боєкомплект із 45 снарядів і чотиритактний однокамерний дизельний двигун із водяним охолодженням. За багатьма параметрами конструкція досі відстає від сучасних танків, а частина нових технологій не надто надійна. Проте ця машина є квантовим стрибком для російської бронетехніки й закладе основу сучасних бронетанкових військ."
 SBA_second_coverage_from_above_desc: "Зусиллями кількох десятків науковців із різних комун ми зібрали докупи уламки кількох збитих німецьких бомбардувальників і кількох винищувачів власної розробки наших сусідів, а тоді взялися їх відтворювати. Деталі та знання з цих літаків допомогли розробити низку нових конструкцій, що поставлять нас на один рівень із сусідами. Вони також дадуть змогу відмовитися від гвинтів минулого й почати опановувати реактивні двигуни майбутнього."
 SBA_second_our_blade_honed_desc: "Після Сибірської війни армія лежала в руїнах, виснажена роками жорстоких боїв майже без постачання й промисловости. Багато хто вже відправив наш малий експеримент на смітник історії. Вони помилилися. Через роки військо відновлене й оновлене, за ним стоять сильна промисловість та відданий народ. Ми нагострили клинок і загартували його вогнем. Тепер Чорна Армія має вдарити: єдиний захист від їхнього нападу - напад на їхній мир."
 SBA_second_the_peoples_justice_desc:0 "Сіуда, досвідчений ветеран і палкий прихильник анархізму, та Стєпанов, менш гарячковий і розважливіший із цієї пари, скликали мітинг у Канску, щоб оголосити нову політику правосуддя у Вільній Території. Навколишні держави засуджують вільний народ Сибіру за жорстокість, але насправді їхні слова означають лише страх: вони бояться, що одного дня люди зруйнують мури їхніх палаців і притягнуть панів до відповіді. Саме народ страждав увесь цей час, тож справедливо, щоб тепер він також насолодився стражданнями реакціонерів."
 SBA_second_martial_tribunals_desc:0 "Вільна Територія розширюється, а разом із нею росте Чорна Армія: ідеалістична молодь приходить до призовних пунктів у пошуках бою й захисту дому. Ми дамо їм це, але не так, як вони гадали. Вони битимуться словами, а не зброєю, і боронитимуть дім від злочинців, вирішуючи, кому місце у в'язниці, а кому - в канаві."

