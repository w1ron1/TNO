 ### Events ###
 SBA.1.t: "Найвеличніший експеримент"
 SBA.1.desc: "\"Ось ми й приїхали\". Пьотр Сіуда зупинив автівку. Його рука на мить зависла над ключами, а тіло раптом полишили і наснага, і сили. Крізь потріскане, засніжене вітрове скло Пьотр бачив, як люди потроху сходилися до будівлі Генеральної Асамблеї. На його обличчі з'явилася усмішка. Це ніколи не переставало його дивувати. Люди - сотні людей, чоловіки й жінки - долучилися до анархістського руху, найвеличнішого експерименту в історії людства. Пьотр сидів і дивився, дивився й дивився. Неначе п'ятимильна поїздка перетворилася на подорож до іншої реальности.\n\n\"Бу!\" Долоня притиснулася до скла й вивела Пьотра із заціпеніння. Він поглянув ліворуч і всміхнувся, мов дитина. Жінка спиралася рукою на вікно й нахилилася, щоб зазирнути всередину. \"Готовий іти?\"\n\nПьотр знизав плечима. Звісно, він був готовий виступити перед людьми: якби за кожну промову йому давали по зернині, одного городу вистачило б нагодувати всю Росію. Та щось було... не так, хоч усе й здавалося звичною справою.\n\n\"Ти знову поринув у думки, - сказала жінка, переминаючись із ноги на ногу. - Якби ти був кимось іншим, я спитала б, що тебе непокоїть. Але я знаю. Знаю\". Вона відвела погляд від Пьотра. Обоє мовчали. Жінка глибоко вдихнула. \"Ходімо, Пьотре, ти потрібен їм усередині\".\n\nПьотр вирішив, що вона має рацію - як і зазвичай. Крекнувши, він підвівся із сидіння, відчинив дверцята й ступив назовні, в анархію."
 SBA.1.a: "\"То не змушуймо їх чекати, Євґєніє\"."

 
 SBA.2.t: "Зібрання Генеральної Асамблеї"
 SBA.2.desc: "Пьотр Сіуда потер руки, намагаючись зігрітися. Обабіч нього велетні-кремезні, порослі такою густою шерстю, що вона могла замінити шубу, утворили захисне кільце. Дорогою до будівлі Євґєнію витіснили з кола. Як же Пьотр хотів, щоб вона лишилася поруч. Замахи на його життя траплялися й раніше, але сама думка про них його не лякала, а майже вабила: загинути за справу, в яку віриш. Та можливість померти, не досягнувши своєї мети, жахала до глибини душі. Хай що він про це думав, Чорна Армія стояла поруч, готова померти на землі під своїми ногами. Він подумки пообіцяв подякувати їм. Навіть якщо їхня служба була цілком добровільною і, як додав би Пьотр, непроханої.\n\nГурт зупинився перед дверима; зсередини долинала невимушена розмова. Пьотр знов усміхнувся. Останнім часом він усміхався дедалі частіше й не переймався, чи не шкодить це його авторитетові керівника, як застерігав його друг Іван Стєпанов. Його тепле обличчя контрастувало з холодними долонями, що театрально розчинили двері й зажадали тиші в залі.\n\nПьотр рушив проходом: тиснув руки людям, які щільно заповнили залу, сміявся й згадував минуле зі знайомими провідниками комун з іншого краю території, а на розповіді сивих, удів і тих, хто втратив дітей, відповідав урочистим кивком.\n\nНарешті Пьотр дістався з одного кінця зали до іншого. Там стояла трибуна й сім стільців. Члени Ради Безпеки вже посідали свої місця, залишивши трибуну вільною для її найчастішого промовця. \"Вільні люди Росії! - вигукнув Пьотр, і цих чотирьох слів вистачило, щоб зібрання вибухнуло оплесками. - Я пообіцяв Іванові, що моя вступна промова буде короткою, а ми всі знаємо, що його ліпше не дратувати!\" Пьотр озирнувся на стільці й показав великого пальця не надто веселому Іванові Стєпанову. \"Тож скажу ось що! Навіть якщо це зібрання нічого не дасть, знайте: кожен день, коли над нами не майорять Вранішнє Сонце, Смолоскип чи Свастика, - це наша перемога!\""
 SBA.2.a: "Визволення - по одному зібранню за раз."


 SBA.3.t: "Старі, що захищають анархію"
 SBA.3.desc: "Марка. Лизнути. Запечатати. Конверт за конвертом Іван Стєпанов повторював цю мантру, щоб не збитися з темпу. Після двадцятого конверта він підлаштувався під ритм платівки, що монотонно грала на задньому плані. Марка на восьму ноту. Лизнути на чверть. Запечатати на половину. Іван цінував закономірності: кажуть, саме здатність їх знаходити робить людей людьми. Приємно час від часу почуватися людиною, коли в перервах ти - прославлена поштова скринька, що приймає відомості від різних загонів Чорної Армії й надсилає відповіді.\n\nІван завмер, тримаючи печатку над конвертом. Щось порушило його ритм. Не платівка - він ретельно оглянув її ще до того, як заплатив бретонцеві. Ні, звук долинав з-за дверей: клацання чобіт по плитці. Стєпанов застогнав, поправив кітель і відклав печатку. Ці кроки він упізнав би за кілометри.\n\n\"Товаришу Стєпанов, час іти\". Ось і він. Ніхто до пуття не розумів, як Андроній Мішурєнко опинився при владі й чому користувався такою повагою та впливом серед людей, але Стєпанов гадав, що той просто найкраще уособлював російський народ. Жовчний, загартований, старий. Він пройшов увесь західний фронт і заслужив відзнаки в боротьбі проти фінів. Коли Союз розпався, зламався і він. У Канску, рідному місті.\n\n\"Інші вже там?\" Стєпанов змахнув рукою конверти зі столу до кошика. \"Валєнтєєв та решта членів Ради Безпеки?\"\n\nСтарий кивнув, заклавши руки за спину. \"Чапаєв запізниться, а отже, прийде разом із Сіудою\". Ці слова викликали в Стєпанова посмішку. У військових справах хлопчисько їм не був потрібен, але Валєнтєєв наполіг."
 SBA.3.a: "Без Ради Безпеки Вільну Територію поглинув би хаос."


 SBA.4.t: "Місто Оз"
 SBA.4.desc: "Надя простягнула руку до хмаринки власного подиху, що зависла перед нею. Вона намагалася замкнути пару у своїх хутряних рукавицях і забрати із собою, та марно. Надя, певна річ, була досить розумною, щоб знати: повітря, яким дихаєш, не спіймати й не сховати на потім. А якби й ні, то її дідусь, який ішов поруч, напевно це знав. Просто в Канску була якась особлива магія, невимовне відчуття: поки вона йшла хідником цього міста, могло статися будь-що.\n\n\"Поглянь сюди, - Албан указав на одну з нескінченних однакових сірих крамниць. - Не знаю, чи вона досі там живе, але була одна жінка...\" Албан знову загубився в одній зі своїх історій. Надя закотила очі: він тільки про минуле й говорив. Кожен камінь нагадував йому іншу людину, та - якусь пригоду, а пригода - битву. Невже він не бачив того, що було просто перед ним? Вони були в Канску! У Канску, місті революції, першій сходинці всесвітнього руху визволення! Неймовірно!\n\n\"Ну, - нарешті милосердно завершив дідусь, - не знаю, що сталося зі Свєтланою. Не пам'ятаю, чи це вона пішла вступати до фашистської партії, чи балотувалася й перемогла в Томску. Пам'ятаю лише, що в її суп треба було плюнути, аби він мав хоч якийсь смак\". Надя захихотіла - більшого їй знати й не треба було.\n\nВона взяла дідуся під руку. Поглянувши на свого опікуна, ветерана багатьох битв, дівчинка замислилася: невже він пройшов крізь усе це заради цієї миті? Заради того, щоб двоє людей могли спокійно йти вулицею - ніхто їх не тривожив, не стежив і не визискував? Албан напевно вбивав людей: вона бачила це з того, як його рука смикалася до пістолета щоразу, коли хтось проходив поруч. Вона, як завжди, підвела на нього очі й усміхнулася. Вони були в безпеці й вільні - та ще й у Канску!"
 SBA.4.a: "Уся кров, пролита в Росії, варта цієї миті."


 SBA.5.t: "День виборів"
 SBA.5.desc: "\"Ім'я?\"\n\n\"Т-товариш Міхаїл Стєпанов, сер... хоча ви, мабуть, і так це знаєте...\" Голос кволого, блідого юнака стих, а очі бігали з місця на місце, аби лиш не зустрітися з батьковими.\n\nІван Стєпанов склав пальці будиночком на лаві перед собою. \"Візьму на себе сміливість припустити, що ти знаєш, навіщо сьогодні сюди прийшов?\" Хлопець хутко кивнув. Стєпанов указав на Сіуду. \"Заради бажання товариша ретельно протоколювати всі засідання дозволю кандидатові в офіцери переказати свою історію\".\n\nОчі Міхаїла широко розплющилися від жаху, рот привідкрився, готовий вивергнути слова, але криниця виявилася сухою. Міхаїл кілька разів глибоко вдихнув і вивергнув підготовлені батьком фрази. \"Я керував постачанням комуни, якій загрожував голод. Становище ставало, е-е, доволі кепським\". Це речення прозвучало радше як запитання: хлопець увесь час шукав батькового схвалення, та бачив лише холодне, нелюбляче обличчя.\n\nА тоді сталося найгірше: посипалися запитання. Першим заговорив Сіуда. \"Як відреагувала громада?\"\n\n\"Е-е, чудово! Вони дуже зраділи! Але село маленьке, тому ніхто з них не зміг приїхати\".\n\nТоді Мішурєнко: \"А за цей час ти помітив диверсантів із республіки? Чи совєтів? Хто там був поблизу\".\n\n\"Так... Ну, я нікого не бачив\". Мішурєнко насупився, й хлопець хутко виправився: \"Але якби побачив, їх розстріляли б на місці!\"\n\nНарешті заговорив Стєпан Валєнтєєв, найстарший член Чорної Армії. \"Отже, товаришу... Міхаїл, так? Що ти насправді зробив?\"\n\nМіхаїл відкрив рота, але батько його перебив. \"Досить запитань від ради, кандидатів сьогодні чимало. Пропоную перейти до голосування\"."
 SBA.5.a: "\"Товариша Міхаїла Стєпанова обрано офіцером\"."


 SBA.6.t: "Довжелезний перелік скарг"
 SBA.6.desc: "У глибині коридорів Генеральної Асамблеї, у майже не використовуваних задніх кімнатах, розлючений чоловік протупотів повз людей, які терпляче чекали своєї черги висловитися.\n\n\"- Зруйновано! Усе, що я добув на полюванні, зникло - і це лише першого дня! А другого якийсь покидьок із півночі пригнав цілу зграю собак на мої кляті поля! Ви бачили, що можуть наробити тридцять вовків? Як мені годувати дітей? Дітей мого сусіда? Мій обов'язок - годувати все кляте село! Павел зі своєю жирною свиноматкою-дружиною не виростять урожаю, навіть якщо самі закопаються в землю! Ми збираємося... Ви взагалі мене слухаєте?\"\n\nПравду кажучи, Аркадій не слухав від самого початку. Та хіба від нього цього чекали? Як завжди, він покиває, вони побурчать про його швидку смерть - і життя триватиме. Принаймні його дружина Міла люб'язно пішла з ним. Хоч і була дурненька. Вона слухала. Кивала, напружено вдивляючись у співрозмовника, зосереджувалася на кожному слові й водночас занотовувала.\n\n\"Ваше становище не просто нестерпне, пане Кузнєцов, - воно огидне. Ви втілюєте прекрасний дух, що огортає цю землю й захищає нас від загрози цілковитого знищення\". Збентежений, але підлещений, балакучий чоловік утратив дар мови.\n\nАркадій тихенько хихикнув. \"Ох, Міло, твоєму золотому язикові немає рівних\". Міла майже не помітила слів чоловіка - її увага була прикута до паперу. Рвучко відірвавши аркуш, вона простягнула його відвідувачеві. \"Віднесіть це Дем'янові, він подбає, щоб зерно перерозподілили на користь вашої громади. Дякую, що повідомили нас про цю проблему: ви вберегли цілісність цієї вільної землі\".\n\n\"Д-дякую, я не сподівався, що ви взагалі щось зробите, а тим паче так швидко\". Задоволений чоловік розвернувся й негайно пішов.\n\n\"Пишаєшся цією промовою, Міло?\" Вона кивнула, досі занурена в нотатки. \"Ще б пак: черга вже простяглася до коридору\"."
 SBA.6.a: "Попереду довга ніч."


 SBA.7.t: "Рахівник Революції"
 SBA.7.desc: "Міхаїл Кільчічаков позіхнув. Що тут іще робити? Який проникливий коментар він міг додати до питання про спадщину Махна? Може, Асамблея попросить Кільчічакова визначити, скільки коштуватимуть кольорові портрети Махна порівняно з фотографіями? Безглуздя.\n\nНетерпляче барабанячи пальцями по товстих теках із матеріалами своїх досліджень, Міхаїл чекав. Кожна комуна мала окрему теку, кожне село - папку, кожна фабрика - сторінку. Усе, звісно, у двох примірниках: недоумки, що керують цією виставою, напевно зіпсують його шедевр. Хоч би матеріали були виготовлені з найкращих у світі діямантів, Рада Безпеки однаково якось примудрилася б порвати й заляпати сторінки.\n\n\"Товаришу Кільчічаков?\" Судячи з голосу, товариш Сіуда вже кликав його кілька разів. Міхаїл підняв брови на знак того, що слухає, але й не подумав перепросити за те, що ігнорував Пьотра. \"Асамблея вже... точніше, давно готова вислухати ваш звіт про економічний прогноз на наступний рік\".\n\nМіхаїл підвівся з теками в руках і рушив проходом між офіцерами та старшими членами Чорної Армії. Роздаючи матеріали, він заговорив: \"Я знаю, що більшість із вас не любить числа так, як я, тому спробую викласти результати зрозумілою мовою\". Кільчічаков поклав останню теку й показав графік. \"На осі Y ви бачите зелену лінію, що підіймається вгору. Вона, товариші, відображає сукупні потреби Чорної Армії та комун - задля простоти ми їх об'єднали - порівняно із загальним обсягом виробництва Вільної Території\". Міхаїл провів пальцем уздовж графіка. \"Навіть без освіти видно, що справи в нас ідуть доволі добре\"."
 SBA.7.a: "\"А тепер перейдемо до наступного пункту...\""


 SBA.8.t: "Перерва на Конгресі"
 SBA.8.desc: "Іван Стєпанов був досвідченим військовим. Служив Союзові, Сибірській Республіці, а тепер був одним із найвпливовіших - якщо не найвпливовішим - діячів Чорної Армії. Він не був найвідомішим і не міг похвалитися найбільшим фронтовим досвідом, але своє відвоював. Утім, за всю службу Стєпанов ніколи не був медиком. Та сьогодні він лікував одразу дві речі: скроні й флягу.\n\nСтєпанов прихилився до стіни біля Генеральної Асамблеї. Сіуда милостиво оголосив перерву після чотирьох годин обговорення офіційної печатки Генеральної Асамблеї, а саме - чи має вінок бути червоним або синім. Іван зробив ковток, спорожняючи залишки контрабандної горілки із заходу. Він смакував кілька останніх хвилин спокою, хай які короткі...\n\n\"Товаришу Стєпанов, сподіваюся, у вашій флязі вода\". Пьотр Сіуда вийшов у коридор і зачинив за собою двері зали. \"Не хотілося б, аби ваші судження затьмарилися: зараз почнеться надзвичайно важливе обговорення\".\n\nСтєпанов пирхнув. \"Повірю вам на слово\".\n\n\"Товаришу Стєпанов, зміни прийдуть до Росії раніше, ніж ви думаєте. Ми вже десять років пліч-о-пліч, разом пережили злети й падіння, але завжди були тут - у Канску. І навіть коли нас не було в Канску, ми однаково були в Канску. Ви розумієте? Колись щось мусить змінитися. Революція має рухатися вперед. Я навряд чи міг би називати себе другом свободи, якби спокійно дивився, як Росія корчиться під чоботом автократів\".\n\nСтєпанов кивав, насправді не слухаючи. Він давно навчився не чути Пьотра, коли той переставав говорити й починав виголошувати промову. Пьотр поплескав друга по плечу. \"Ходімо, Іване, часу гаяти не можна\"."
 SBA.8.a: "Революція не знає перерв."


 SBA.9.t: "Підготовка"
 SBA.9.desc: "Барники, які працювали в маленькому закладі на розі, з усіх сил намагалися вдихнути в нього життя. Яскраве світло й випивка, картини й піяніно, дротики й кості - жодна ціна не була зависокою, аби будівля менше нагадувала заповідник цвілі й більше - місце, де завжди задовольнять потребу в спиртному. Та всі зусилля були марні, бо насправді життя брудному барові надавала розмова.\n\nПавел відкинувся назад у нападі сміху й склав долоні в удаваній молитві. \"Уявіть собі... Ні, ні, ви тільки уявіть!\" Солдат грюкнув рукою по шинквасу, намагаючись утихомирити галасливу юрбу. \"Кілька місяців тому я проїздив Красноярск. Там усі люди ходять отак\". Павел зіскочив із табурета, широко розставив ноги, засунув руки в кишені й почав перевальцем ходити колами.\n\nСолдати навколо закинули голови від реготу. Незабаром вони теж будуть у Красноярску й стрілятимуть у тих, кого зараз передражнювали. Та поки було байдуже, куди вони підуть. Хоч кожен пам'ятав, що ця мить сміху й братерства швидкоплинна. Хоч невисловлена певність, що не всі вони повернуться сюди, висіла в кімнаті, мов хмара диму. Це не мало значення: цієї миті вони жили й сміялися - сміялися з того, як п'яний до нестями двометровий велетень марширував по колу.\n\nПавел із гуркотом плюхнувся на місце й мертвою хваткою вчепився в шинквас, щоб не впасти. Він озирнув двадцятьох солдатів довкола - двадцятьох братів - і вирішив, що готовий померти, аби інші жили, аби інші були такі ж вільні, як двадцять п'яних росіян у барі."
 SBA.9.a: "Сини Мами Анархії не платять у канській корчмі."


 SBA.10.t: "Привид канської початкової школи"
 SBA.10.desc: "Крейда моторошно заскреготіла по дошці. Пан Абрамов вивів коло, під ним тонку риску, над нею трикутник, а завершив витвір двома крапками ліворуч і праворуч від трикутника. Старий обернувся до класу хлопчиків і дівчаток. \"Ну як? Іллю Рєпіна перевершив?\" Клас мовчав. \"Ой, ви, мабуть, ще замалі для такого жарту!\" Старий засміявся. \"Гаразд, гаразд, а тепер?\" Над почварою з геометричних фігур пан Абрамов написав щось схоже на слово «Ніколай». Артрит перетворив його почерк на курячі дряпини. Нарешті малюнок набув сенсу, коли під колом з'явилося прізвище «Бухарін».\n\n\"О! Я знаю цього чоловіка! У мами є його портрет! Він воював із німцями й дав нам великі заводи!\" - один завзятий учень підскочив із місця, гордо демонструючи свої знання.\n\n\"Неправда, Іґорю! Мій тато там був! Він жив у Москві! Він на власні очі бачив таємну поліцію Бухаріна: якщо ти погано поводився, тебе просто забирали з вулиці. Тато називає його «тираном»\".\n\n\"Твій тато дурень! - огризнувся школяр. - Якби мама почула таке в нас удома, змусила б його мити вбиральні!\"\n\nКлас вибухнув суперечкою, діти розділилися на табори через спадщину давно померлого чоловіка. Учителя тішила сама наявність дискусії, але вона вже трохи виходила з-під контролю. \"Гаразд, усі тихо! Обзиваннями ми нічого не досягнемо, правда?\"\n\n\"А ви як думаєте, пане Абрамов? Бухарін був поганим? Чи добрим, як каже моя мама?\"\n\nСтарий почухав щетину й замислився. Учні затихли. Нарешті, коли дітям здалося, що минула ціла вічність, він дійшов висновку."
 SBA.10.a: "А тоді просто знизав плечима."


 SBA.11.t: "Куди спрямувати кошти?"
 SBA.11.desc: "Більшість людей уже давно навчилася поважати Мішурєнка й Валєнтєєва, любити Сіуду й Таратуту та коритися Стєпанову. Та перед Кільчічаковим сиділи дурні. Навіть Іван, найрозумніший серед них, нічого не тямив у тому, що справді важить, коли відкинути риторику й кулі: у грошах.\n\n\"Зараз я міг би наговорити вам купу лайна, - незворушно промовив Кільчічаков, дивлячись просто в очі членам Ради Безпеки. - Повірте, моя дружина сотню разів писала й переписувала промови, аби донести це до вас, але я не бачу в них жодного сенсу\".\n\nСтєпанов підняв брову. Іван умів читати обличчя - це Кільчічаков знав. Іван Стєпанов був актором, не за фахом, а за способом життя. Кільчічаков мав підозри щодо товстого генерала, але не мав переконливих доказів, які можна було б подати Генеральній Асамблеї. \"То яке ж ваше повідомлення, товаришу Кільчічаков?\"\n\nКільчічаков сперся ліктем на лаву Таратути - вирішив, що вона найменше схильна його зігнати. \"Власне, я передумав. З дозволу Ради все ж присиплю промову дрібкою лайна\". Члени Ради Безпеки спантеличено дивилися на нього, але не озвалися - мовчазна згода. \"Чудово. Не втомлюватиму вас усією історією свого життя, бо ненавиджу говорити довше, ніж треба. Я почав працювати з числами, бо вони сталі. Вони не змінюються. А люди змінюються - тому я й не пішов батьковою стежкою проповідника. Я не люблю надмірних змін. Трохи змін потрібно, те, що ми маємо тут, - потрібно, але зміни неможливо прорахувати\".\n\n\"Я не розумію, - сказав Сіуда. - До чого тут бюджет?\"\n\n\"Числа змінилися. Мої початкові прогнози були неточні. Цього разу я проїбався. Ми опинилися на роздоріжжі. Я підготував дві нові економічні моделі: одна віддає перевагу переоснащенню наявних фабрик, друга передбачає будівництво нових. Вибір за вами, я лише рахую числа\"."
 SBA.11.a: "Мусимо дати раду тим, що маємо."
 SBA.11.b: "Застарілі фабрики нас занапастять."

 
 SBA.12.t: "Розбомблені колії"
 SBA.12.desc: "Євґєнія Таратута була письменницею. А коли не писала, любила милуватися величним російським краєвидом. Україну вона майже не пам'ятала. Згадувала, що там було рівно - не те що сибірські пагорби. Вони трохи нагадували їй про роки у Франції, куди її батько, український анархіст, утік від убивств. Природа дарувала їй натхнення й мету, але через занедбану залізницю споглядати далекі куточки Росії ставало дедалі важче.\n\n\"Я хочу полагодити колії, - сказала Таратута. - Я хочу полагодити багато речей. Хочу зцілити цю роздроблену країну, принести свободу кожній пригнобленій людині, але боюся, що без справної залізниці нам доведеться пішки йти до кожного села Росії, аби його визволити\". Таратута зробила паузу, за звичкою входячи в промовницький ритм перед головною думкою. \"Відновлення Транссибірської магістралі до колишньої величі має стати першочерговим обов'язком Генеральної Асамблеї\".\n\n\"Добра ідея, паскудне обґрунтування, - виплюнув Андроній Мішурєнко. - Вас не було під Сєвастополем. У німців була артилерія завбільшки з гори, яку перевозили рейками. Я підтримав би пропозицію, якби головною метою було відтворення цієї досконалої зброї\".\n\nСтєпанов закотив очі. \"Пропозиція добра, Євґєніє. Відновлення залізниці матиме й інші переваги, приміром, можливий прибуток. Дамо їм мотузку, на якій вони самі повісяться, так?\" Позаду Кільчічаков схвально кивав, і в його очах мало не світилися знаки доляра.\n\nПьотр задумливо хитав головою. \"Не знаю, товаришко Таратуто. Хіба з Транссибірською магістраллю не пов'язане тяжке минуле? Може, краще вирвати колії в наших межах і почати з нуля? До того ж це завадить етатистським елементам використовувати тут залізницю у власних цілях\".\n\nТаратута лагідно всміхнулася Пьотрові. Вона цінувала його ідеалізм - саме він робив Сіуду досконалим обличчям анархістського руху. \"Я розумію ваш підхід, товаришу Сіуда. Залишаю рішення за цим органом\"."
 SBA.12.a: "Транссибірська магістраль залишиться!"
 SBA.12.b: "Новій революції - нова залізниця!"


 SBA.13.t: "У полях"
 SBA.13.desc: "\"Будь ласка! Ви мусите мене вислухати!\"\n\n\"Відчепіться від мене, жіночко\". Кільчічаков уставив ключ у замок і повернув. Позаду стояла темноволоса жінка з єдиною веснянкою на носі. Її зовнішність Кільчічаков запам'ятав добре. Більше в ній не було чого помічати: задля тепла вона носила лахміття й ходила босоніж, коли не було снігу, а його не було... ніколи.\n\n\"Мій син і досі там! Ви можете його знайти! Товариш Сіуда сказав, що можете! Він вірить, що мій син живий! Чому ви не вірите?\" - благала жінка, а Кільчічаков уже рушив вулицею.\n\nВін дістав цигарку й запалив. \"Я лише посередник, жіночко. Я не пам'ятаю кожного імени, що проходить через мій стіл\". Вона переслідувала його місяцями. Виявляється, Кільчічаков попросив одну з комун, що потерпала від набігів із півночі, надіслати ще добровольців, і її син пішов першим. Ідучи, він похитав головою: через цих людей починав сумувати за часами Союзу, коли спокійно керував Сибірським планом.\n\nЖінка пришвидшила крок, стала перед ним і схопила за плечі. Кільчічаков хотів її скинути, але зупинився. Їхні обличчя були зовсім близько. Він побачив, як її очі наповнюються сльозами, як вони котяться щоками й зникають унизу. Кільчічаков роздратовано скривився. Рухайся, хай тобі грець. Але не рушив. Він завмер.\n\n\"Будь ласка, - благала вона. - Якщо ви не можете знайти його, не змушуйте інших переживати те саме. Ви знайдете інший вихід, я знаю. Мій син так вірив у цей рух, у нас із вами. Можливо, він віддав за це життя. Він не мусив помирати від рук якогось покидька з Томска\". Кільчічаков пережив цілу низку почуттів - від гніву до співчуття. Шкода, що ця жінка не число, тоді він міг би її зрозуміти."
 SBA.13.a: "\"Мені шкода, але Чорній Армії потрібні люди. А тепер відійдіть\"."
 SBA.13.b: "\"Тоді покличу більше фабричних робітників. Задоволені?\""


 SBA.14.t: "Тривожні думки економіста"
 SBA.14.desc: "Кільчічаков боровся зі своїм біфштексом, шматуючи жорстке, недосмажене м'ясо. Булочки були трохи кращі, хоч від їхньої твердости він мало не втратив зуба. Овочі, мабуть, були найгірші. Їх приготували досконало, та дружина, звісно ж, обрала цибулю. А Міхаїл мав смертельну алергію на цибулю.\n\nЄкатєріна розчаровано поглянула на нього. \"Ти майже не торкнувся їжі, Міхаїле\".\n\n\"Зате вона мене торкнулася, побила й ледь не позбавила зубів і життя\", - відповів Кільчічаков і відкинувся на спинку стільця, визнаючи поразку.\n\nЄкатєріна відклала виделку й промокнула губи серветкою. \"А мені було смачно\". У кімнаті запала тиша. Час змінити тему. \"Як минув твій день?\" Чоловіка було легко змусити говорити про себе - коли ніщо інше не допомагало, це спрацьовувало завжди.\n\nПопри просте запитання Кільчічаков довго дивився в порожнечу. Дружина мовчки спостерігала. \"Ти ж була там? Зустрічалася з Бухаріним, коли він приїздив до Новосібірска?\" Кільчічаков і так знав відповідь: у передпокої стояла фотографія їх утрьох.\n\n\"Звісно, - засміялася дружина. - Не знаю, як ти міг не помітити такого чоловіка: він затьмарював усіх!\"\n\nМіхаїл довго кивав, дослухаючись до відлуння її слів. \"Пам'ятаєш, що про нього казали вже тоді?\"\n\nТа сама мовчанка охопила Єкатєріну. \"Е-е, мабуть, пам'ятаю. Тут про нього ніколи не були доброї думки, правда?\"\n\nМіхаїл раптом схопив дружину за руку, й та охнула. Він пильно подивився їй у вічі. \"А що скажуть про мене, Катю? Коли я помру й моя економічна політика дасть свої останні плоди, мене проклинатимуть так само, як ми проклинаємо його?\""
 SBA.14.a: "Решту вечері вони провели в мовчанні."


 SBA.15.t: "Когнітивний дисонанс"
 SBA.15.desc: "\"Це має бути щось справді важливе, Стєпане\". Свєтлана тремтіла, міцно обхопивши себе руками, щоб не випустити тепло.\n\n\"Ага, - додав Антон, - настільки важливе, щоб розбудити все село заради обговорення\".\n\nСтєпан, кволий блідий чоловік, вів їх дедалі глибше до лісу за межами громади. За ним трималася юрба з пів сотні людей, але не надто близько - ні, до Стєпана ніхто так близько не підходив. І їх не можна було винуватити: він постійно сидів замкнений на горішньому поверсі родинного будинку, самотній, мов викинута іграшка, тільки бібліотека складала йому компанію.\n\nСтєпан підняв руку й завмер. \"Тут. Зробимо це тут\".\n\n\"Що саме зробимо?\" - спитала Свєтлана, якій не пощастило стояти найближче.\n\nСтєпан мовчки задув свічку, й ліс поринув у темряву. Люди дружно запротестували й загомоніли, та ненадовго. Ліс знов осяяло світло, і всі побачили, що сталося. Стєпан ховав у пальті старий пістолет. Тепер дуло було притиснуте до його скроні, а палець завис над спусковим гачком. Юрба приголомшено ахнула, Антон стиха пробурмотів молитву.\n\n\"Я зрадник. Я ворог. Я агент держави. Мене треба покарати, віддати під суд\". Стєпан переминався в снігу.\n\nСвєтлана широко розплющеними очима дивилася, як чоловік плутано розповідає про прочитані книжки й про те, як із часом почав поділяти старі ідеї Бухаріна. Він завершив вимогою: застрельте мене, вбийте зрадника. Селяни ошелешено озиралися одне на одного, шукаючи відповіді. Вона обережно ступила вперед. \"Стєпане, ніхто не хоче твоєї смерти за це. Ти вільний вірити в що завгодно. Твої переконання роблять тебе тим, хто ти є, і ми були б нікчемною громадою, якби змушували тебе змінитися\". Свєтлана ступила ще ближче. \"Опусти зброю, Стєпане. Ходімо додому\"."
 SBA.15.a: "Свобода охоплює думки й учинки."


 SBA.16.t: "Передача влади нагору"
 SBA.16.desc: "Генеральна Асамблея комун зібралася знову. Дехто нарікав, що вона надто часто скликається через питання, які можна залишити регіональним радам. Та слід було зважати на людей: багато хто ніколи не знав демократії й не відчував, що означає бути почутим, тож часті засідання можна було пробачити.\n\n\"Гадаю, дебати завершено?\" - сказав Максім Попов, представник південної комуни, і гамір ущух. Він озирнувся зі свого місця, даючи змогу висунути нові зауваження. \"Нічого? Чудово! Я вже стомився!\" Переповнена зала схвально загомоніла. Ніч була довгою, але безперечно вартою того. Запропоноване рішення мало стати революційним. Воно було необхідне. У ньому втілювалася народна воля!\n\nКанський Конгрес спроєктували так, що Рада Безпеки й Генеральна Асамблея містилися в одній залі. Генеральна Асамблея була лише пишною назвою для непримітних лав - церковних ослонів у храмі анархії - біля дальньої стіни поруч із дверима. Рухаючись уздовж них, людина наближалася до шести крісел Ради Безпеки, що ненавмисне створювало враження, наче Рада дивиться на Асамблею згори вниз. Такого наміру не було, але Іван Стєпанов навчився цим користуватися.\n\n\"Товариші, згідно з нещодавнім рішенням товариша Мішурєнка й моїм, цю пропозицію не можна розглядати в її нинішньому вигляді\", - прогримів Стєпанов, перекриваючи дедалі гучніші вигуки протесту."
 SBA.16.a: "Колись вони зрозуміють, що це було заради їхнього добра."


 SBA.17.t: "Кілька голів краще за одну"
 SBA.17.desc: "Від карти Центрального Сибіру тхнуло пліснявою, краї були подерті, а назви міст за десятиліття під відкритим небом стали нерозбірливими. Та попри все двоголовий орел у кутку лишався величним: його пильний погляд обіцяв не допустити лиха для Росії. Орел дивився на всіх, але рідко хтось дивився на нього - доки в поле його зору не потрапило товсте обличчя Вєніаміна. \"Що це за хуйня? Ми справді користуємося картами часів імперії?\" Він обернувся до товаришів, які так само схилилися над пожовклою картою.\n\n\"Стара, зате надійна. Я приніс ручки\". Чоловік дістав із торби шість ручок. \"Можемо позначити комуни звідси. Почнімо за абеткою. Яке становище в Бєрєжі, Катєріно?\" Відкоркувавши ручку, він відразу закреслив герб дому Романових і назавжди стер птаха.\n\n\"Не найкраще. Комуністи зі сходу сильно нас пошарпали. Час від часу якісь озлоблені старі переходять на наші землі й палять усе дощенту. Чорна Армія обіцяла посилити присутність, але ми нічого не дістали\".\n\nЧоловік кивнув і намалював над комуною череп зі схрещеними кістками. \"Можна перекинути людей із Зєлєноґорска, більшість тамтешньої промисловости вціліла\". Так вони працювали три довгі години: молоді росіяни малювали знаки й смуги, створюючи картину вільної землі, переплетеної стрілами. Товари танцювали мерзлою тундрою, перестрибуючи з місця на місце, а пошуки досконалої рівноваги набирали обертів. Нарешті чоловік відклав ручку й замилувався роботою. Карта була безладною, але добре укладеною. Організований хаос - саме те для Вільної Території."
 SBA.17.a: "Спільними зусиллями можна досягти всього."


 SBA.18.t: "Знову до школи"
 SBA.18.desc: "Андрєя пекло в грудях, коли він щосили тиснув на педалі. Він запізнювався! Гуп! Гуп! Гуп! Холодний вітер шмагав обличчя, але Андрєй за жодних обставин не міг пропустити школу. Мати стільки разів читала йому нотацію, що він знав її напам'ять. \"Слухай мене, засранцю, - казала вона різким, скрипучим голосом. - Ти перший у нашій родині здобудеш справжню освіту. Хлопче, ти можеш стати великою людиною, тож не проїби це!\"\n\nНарешті за обрієм з'явився сліпучо-білий дах школи. Примружившись, він побачив велосипеди інших хлопців, недбало кинуті на землю довкола... чогось. Андрєй не міг розібрати, але воно скидалося на батькову вантажівку. Дивно: мало кого привозили, більшість просто виряджали крізь тундру до найближчого навчального закладу. Під'їхавши ближче, Андрєй пустив велосипед котитися - тепер він думав лише про те, що, в біса, вантажівка робить біля школи.\n\nАндрєй зіскочив і помчав усередину, молячись, аби не запізнитися. \"ВИБАЧТЕ! Я БУВ ІЗ МАМОЮ І...\" У класі щось було не так: учитель, син Дмітрієвіча, а поруч якийсь чоловік із лисою блискучою головою та чорним шарфом на устах.\n\n\"Ласкаво просимо, Андрєю, - просичав учитель. - Сідай\". Присоромлений хлопець зайняв місце й поглянув уперед. \"Як ви вже помітили, до нас приєднався товариш Пьотр. Він деякий час поживе тут\". Андрєй насупився: навіщо Чорна Армія в школі? Зацікавлений, він підняв руку. \"Пане Пьотре, а що ви робитимете тут для нас?\"\n\n\"Стежитиму, щоб до вас не потрапляли погані думки\". Андрєй не знав, що це означає, але нічого доброго воно не віщувало."
 SBA.18.a: "Захищаємо дітей - і тіло, і розум."


 SBA.19.t: "Чому вчитель навчає?"
 SBA.19.desc: "Давати раду неслухняним російським дітям було важко. Давати раду неслухняним російським дітям, яких усе життя вчили, що найважливіше - їхня свобода й незалежність, було майже неможливо. Та Тімофєй не здавався. Точніше, не здавався пан Смірнов. Він і досі не звик, що став «паном». Перше приголомшення від прийняття до вчительського складу ще не минуло, і було незбагненно дивно, що люди тепер дивилися на нього з повагою.\n\nНавчати було важко. Молодий чоловік знайшов прихисток у кріслі в кімнаті відпочинку й помішував чай. Тілом він був тут: дістав ручку й почав складати план завтрашнього уроку. Думками ж повернувся до Генеральної Асамблеї, де сидів серед щільних рядів людей. Там смерділо гнилою деревиною й потом, але відчуття було захопливе. Він нахилився вперед і дивився, як палкий промовець жестикулює за трибуною. Пристрасть сочилася з нього, крапала на підлогу, усотувалася в дошки й розтікалася до натовпу. Невдовзі істота поглинула черевики Тімофєя й уже підбиралася до всього тіла. Промовець ревів в ім'я освіти, захоплюючи Тімофєя своїм запалом.\n\nТімофєй смикнувся в кріслі, а тремтіння вздовж хребта повернуло його до сьогодення. Він озирнув просту кімнатку: лише стіл, два стільці й чай. Йому стало цікаво, чому той чоловік з Асамблеї став учителем, хоча Тімофєй мав здогад. Учитель - це світло, провідник для тих, хто блукає в темряві. А на землі, поглинутій мороком, Бог свідок, усім не завадить трохи світла."
 SBA.19.a: "Свободу нашим синам і дочкам, освіту всім!"


 SBA.20.t: "Без нас - ніщо"
 SBA.20.desc: "\"Ви курите? Здається, я ніколи не питав\". Стєпанов запалив цигарку в зубах, кілька разів затягнувся й знову засунув руки в кишені.\n\nСтарий генерал Мішурєнко дивився вперед, поки вони йшли вулицею до Генеральної Асамблеї. \"Уже ні, - буркнув він. - Востаннє я курив у Москві перед потягом до цього міста. Наступну закурю, коли потягом повернуся звідси до моєї країни - до Москви\".\n\nСтєпанов випустив дим у повітря. \"Ви багато говорите про Німеччину, про Москву. А ми досі тут, боремося за анархістський рух на нашому клаптику Росії. Чому ви ніколи про це не говорите?\"\n\nМішурєнко не сповільнив кроку й не повернувся до Івана. \"Ви мене в чомусь звинувачуєте, товаришу Стєпанов?\"\n\nІван знизав плечима й провів рукою по рештках волосся. \"Хтось назвав би це звинуваченням, а я волію називати надією\".\n\n\"Надією?\"\n\n\"Надією, що ви бачите далі за всі ці балачки про анархію та свободу\". Стєпанов зупинився, змусивши генерала зробити те саме. \"Надією, що ви беззастережно мене підтримаєте\".\n\nОбличчя Мішурєнка скривилося від нерозуміння, та швидко пом'якшало від усвідомлення. Для людей він був героєм, а для Чорної Армії - легендою, ідеалом, людиною, яка ніколи не припиняла боротися. Він не любив політики, та все ж розумів, коли ним намагаються грати як пішаком. Чи був він до цього готовий? Мішурєнко хутко відвернувся від Івана й рушив далі."
 SBA.20.a: "\"Нікому не розповідайте про цю розмову\"."


 SBA.21.t: "Зайдіть до мого кабінету"
 SBA.21.desc: "Офіцер Єґор Скорняк перебирав у руках кашкета, обводячи пальцем вишиті на тканині череп і схрещені кістки. Нічого доброго. Єґор жив далеко від Канска, але сів на потяг до міста, щойно на порозі з'явився лаконічний лист із печаткою Чорної Армії. Поглянувши на годинник, він ковтнув: минуло чотири години. Навмисно, він був певен. Старий покидьок знався на катуванні.\n\n\"Товаришу Скорняк? Товариш Мішурєнко готовий вас прийняти\". Молода жінка в темно-фіолетовій спідниці всміхнулася, вручаючи йому смертний вирок. Єґор глибоко вдихнув і схилив голову. Ще не кінець. Може, підвищення? Може, помилка? Він підвівся, поправив костюм і рівно насадив кашкета. Мішурєнко помилок не робив.\n\n\"Я прибув одразу, як дістав вашого листа, товаришу Мішурєнко\". Стоячи струнко, Єґор стримував бажання витерти спітнілі долоні об штани. \"Я помітив, що ви не зазначили причини мого виклику, товаришу\". Він шукав підтримки в генераловому погляді, та не знайшов. \"Не те щоб вона була потрібна! Я дію від імени тих, кого маю честь називати рівними собі, зокрема вас, товаришу Мішурєнко\".\n\nАндроній Мішурєнко дивився на нього без жодних емоцій. Очі втомлено звисали, уста були прямою рискою. \"Що сталося з росіянами? Коли вони стали такими жалюгідними?\" - подумав він уголос. Єґор відчув знайомі ознаки тривоги; руки зажили власним життям і вчепилися в костюм, шукаючи опори. Мішурєнко підвівся. \"Я багато про вас чув, Єґоре. За інших обставин я б вас пожалів. Та ми живемо в такому світі, який маємо, правда?\" Єґор не відповів. \"Найблискучіші люди мають обіймати найважливіші посади. Наближається війна, а ваше офіцерське місце краще віддати комусь іншому\".\n\nУсупереч здоровому глуздові Єґор запротестував: \"Але, товаришу Мішурєнко, сер, мене обрали офіцером демократично!\""
 SBA.21.a: "\"А я - людина, яка врятує Росію. Тепер геть\"."


 
 SBA.22.t: "Обмін ролями"
 SBA.22.desc: "Лєонід усім тілом тримав двері їдальні, в які врізалася хвиля розлючених чоловіків. \"Візьміть мою зброю! - наказав він переляканим офіцерам позаду. - Візьміть мою кляту зброю!\" Ніхто не ворухнувся. Та пішли ви, недоумки. Лєонід силувався витягти пістолет із кобури. Щойно він обхопив руків'я, нога почала ковзати. Блискавичним рухом Лєонід розвернувся: ще мить тому спиною підпирав двері, а тепер стояв перед ними, націливши пістолет на натовп за порогом.\n\nУ Красноярску вистачало злочинців. Часом визначення ставало таким широким, що в'язниці не могли вмістити всіх, кого Андрєєв визнав гідними ув'язнення. Шериф Лєонід Дроздов уважав благословенням те, що під час окупації Чорною Армією опинився у в'язниці. Аж доки в'язні не почули про наближення анархістів, які напевно принесуть свободу. Тепер іронія була очевидна. Він із невеликим загоном охоронців застряг у вестибюлі: анархісти ззовні й усередині. Він у пастці.\n\nПоки що погроза діяла. Поки Лєонід тримав коридор під прицілом, в'язні не наважувалися рушити. Хотілося полегшено зітхнути, але найменший рух могли сприйняти як слабкість і скористатися нею. \"Сер?\" - зі зграйки позаду просочився наляканий скиглій.\n\n\"Що?\" Лєонід не відводив очей від коридору, тримаючи палець над спуском.\n\n\"Вони тут\". Пояснень не треба було. За спиною чулося, як Чорна Армія підійшла до в'язниці й готувалася до можливої облоги. Лєонід задихав частіше. Що робити? Куди йти? Він озирнув людей позаду, тоді бунтівних в'язнів. Пістолет дзенькнув об підлогу, а Лєонід підняв руки."
 SBA.22.a: "Марно боротися проти вітрів змін."


 SBA.23.t: "Чужинець на знайомій землі"
 SBA.23.desc: "«Де я? Я у своєму домі, у своєму місті, та з вікна бачу цілком чужу землю». Ян записав слова до щоденника. Притиснувши книжку до грудей, він ховався за фіранками у вітальні. Він народився у Красноярску незадовго до падіння Союзу й кілька разів бачив, як місто переходило з рук у руки, але все здавалося вигадкою з книжки. Тепер усе було справжнім. Небезпечним.\n\nЯн вийшов надвір. У глибині міста ще гули двигуни, отже, час був. Ідучи, він зробив новий запис у щоденнику - єдиній речі, яку взяв із собою. «Сьогодні я втечу. Анархісти прорвали оборону й починають наступ на місто, поки я пишу. Якщо це мій останній запис, нехай буде відомо: я був людиною влади й такою помер, коли...»\n\nДалекий артилерійський постріл струснув землю й вибив ручку з його рук. Почалося. Анархісти тут! Ян кинувся до вокзалу, залишивши ручку в місті, якого вже не побачить. Біг і біг, ноги заніміли. До станції лишався квартал. Він завернув за ріг і...\n\nГепнувся на дупу. Перед ним стояли четверо кремезних чоловіків із татуюваннями черепів на руках. Ян заверещав і поповз назад. Вони спантеличено дивилися на купу людини на землі. \"Бачите це, товаришу Дмітрієвіч?\" Один кивнув. \"Я ж казав! Вони всі так кумедно ходять!\" Солдати засміялися з жарту, якого Ян не зрозумів і не хотів розуміти. Один простягнув йому руку. \"Ви місцевий? Ми шукаємо ратушу\".\n\nЯн міцніше притиснув щоденник і широко розплющеними очима переводив погляд між солдатами. \"Ви мене не вб'єте?\""
 SBA.23.a: "Чоловіки засміялися."


 SBA.24.t: "Великий лівий намет"
 SBA.24.desc: "Його розстріляють. Міша знав, що це лише питання часу. Дикуни були розумні, і це його лякало. Але вони лишалися дикунами: не могли організувати спілку, не знали, як вести міжнародну дипломатію, не кажучи вже про внутрішні проблеми з політиками-сильними руками. Вони знали лише ненависть. Свобода стояла на третьому місці. Він переминався: їх уже мали прикінчити. Натомість членів Соціял-демократичної партії Красноярска жорстоко запхали сюди разом. Нарешті на імпровізовану сцену посеред зали, перетвореної на камеру, вийшли люди. Пора, подумав Міша. На його розчарування, це були не офіцери, а представники Генеральної Асамблеї.\n\n\"Вітаю, товариші! Перепрошую, що ми набили вас сюди, але, сподіваюся, ви розумієте: обставини зараз трохи... дивні. Раджу глибоко вдихнути\". Чоловік послухав власної поради, вдихнув сморід поту й плісняви та відразу закашлявся. Дехто мляво наслідував його зі страху, інші лише спантеличено дивилися. \"Це ваш перший вдих без тягаря гноблення на плечах! Дехто з тих, кого ви вважали союзниками й навіть друзями, відповідатиме за свої вчинки, та ми не віримо в невибірне насильство - це метод гнобителів, проти яких ми боремося!\"\n\n\"Тобто ви зігнали нас сюди, щоб сказати, що не вб'єте?\" - уголос здивувався Міша.\n\n\"О ні, усе значно краще! - запевнив доповідач. - Тепер ви маєте обов'язки, як і всі ми. Попри успіх, ми досі проводимо величний експеримент\". Міша пирхнув: добрий «успіх», якщо місто стало ігровим майданчиком Чорної Армії. \"Щоб люди Сибіру, Росії та всього світу дістали нову можливість, ви нам потрібні. Ви знаєте місто краще за нас, люди вам довіряють, і ви довели відданість лівій справі. Найближчими днями ваша партія відповідатиме за перебудову міста в комуну\". Міша задумливо кивнув. Може, вони не такі вже й дикуни."
 SBA.24.a: "Соціял-демократи й анархісти - дивна пара."


 SBA.25.t: "Суд над королем Рюриком"
 SBA.25.desc: "Рюрик стояв навколішки перед занепалим двором. Картини й паростки культури, яку він щойно почав плекати, знімали зі стін. Чоловіки розбивали трон і забирали шматки як трофеї та докази - діти не повірили б, що колись Росією правили королі. Дуло впиралося в жирні складки на його потилиці, не даючи ворухнутися. У палаючій тронній залі його оточили п'ятеро чоловіків і жінка. Одного він упізнав: Сіуду.\n\nСіуда щось вигукнув грабіжникам, але Рюрик не хотів чути. Очі зрадили його: син, якого тягли за плечі. Рюрик глянув на Сіуду. \"Де Лідія?\" Революціонер миттю повернувся до нього. \"Де моя дочка?\" - у голосі з'явився розпач.\n\nСіуда сумно всміхнувся. \"Ніколаю Крилов, від імени Ради Безпеки я мушу перепросити за поспішність цього суду\". Непритомного князя Юрія поклали поруч із королем. \"Попри обставини, вас звинувачено в авторитаризмі, придушенні свободи зібрань і профспілок та реакційному насильстві. Можете виголосити захист\".\n\nРюрик і Ніколай Крилов - двоє чоловіків в одному тілі - востаннє озирнулися й поглянули на Сіуду. \"Де моя дочка?\"\n\nРеволюціонер указав на Юрія. \"З огляду на волю мешканців міста ваш син вільний\". Та де Лідія? \"Ніколаю Крилов, ця рада, за наявности окремої думки, визнає вас винним за всіма обвинуваченнями. Вас доправлять до слідчого ізолятора в місті, яке визначать згодом\". Сіуда не радів цим словам. Дуло відсмикнулося від шиї Рюрика, руки підхопили його попід пахви й підняли. Тоді він побачив її: калюжу крови й трьох бійців біля ніг. Рюрик пронизливо закричав, поки його несли геть."
 SBA.25.a: "Революція не завжди прекрасна."


 SBA.26.t: "Двоє чоловіків, два життя"
 SBA.26.desc: "Стєпан Валєнтєєв був солдатом Червоної Армії. До того, як став товаришем Валєнтєєвим, до того, як Вермахт розтрощив Росію, до того, як усе розпалося, він був солдатом Червоної Армії.\n\nАлєксандр Васілєвскій є солдатом Червоної Армії. До того, як став повстанцем у Монголії, після того, як Вермахт розтрощив Росію, після того, як усе розпалося, він є солдатом Червоної Армії.\n\nІдучи коридором, Валєнтєєв думав про своє минуле й минуле чоловіка поруч. Він не знав, що сказати й чи варто взагалі щось казати. Тишу заповнювало клацання чобіт. Васілєвскій був його в'язнем, полоненим бійцем і нічим більше - принаймні так напишуть у документах. Валєнтєєв здивувався, коли на його столі опинився лист Васілєвского, ще більше - коли всередині побачив вимоги, і вирішив, що збожеволів, коли їх прийняв.\n\nНа щастя, мовчанку порушив Васілєвскій. \"Дякую, товаришу Валєнтєєв\". Стєпан не відповів - не через пиху чи роздратування. Просто не міг. Вони йшли, доки не дісталися дверей.\n\nНадворі чекала вантажівка з накритим кузовом, щоб вантаж не випав дорогою. Васілєвскій обійшов машину, перевіряючи несправності. Валєнтєєв раптом заговорив: \"Що ви робитимете?\" Запитання застало полоненого зненацька. \"Що робитимете, коли дістанетеся туди?\"\n\n\"Коли повернуся до міста, відпочину. Відпочину й сподіватимуся дожити до дня, коли ви самі ввійдете до міста й назавжди проженете німців із нашої країни\"."
 SBA.26.a: "\"Щасти вам, товаришу\"."


 SBA.27.t: "За простого мөрөнця"
 SBA.27.desc: "Як Міша дозволив утягнути себе в це? Іронічно, що він їхав до Мөрөна: треба бути справжнім дурнем, щоб погодитися на таке життя. Йому не так уже й погано жилося під Чорною Армією - краще, ніж за Андрєєва, - але трохи занадто радикально. Соціял-демократична партія була значно ближча. Та чи то через страх наслідків, чи то через приховану віру в можливість величі Міша погодився поїхати до щойно визволеної території.\n\n\"Тут, - наказав він. - Ось це місце\". Монголія ніколи не була промисловим велетом. Міша знав про ханство, яке колись претендувало на всю Євразію, але це не був величний дім Чінґіса. Це була зала номер вісім у будинку для літніх. Міша розчинив двері, а почет увійшов слідом. Побачене викликало в старого буркуна усмішку: серп і молот, троянда, блискуча тканина із зіркою над Сойомбо. Військо, може, й бідувало, зате гурток рукоділля дістав увесь бюджет. У кімнаті юрмилися майже сто чоловіків і жінок, кожен із символікою своєї партії.\n\n\"Вітаю, товариші! - Міша натягнув широку усмішку й пішов за текстом. - Така численна явка свідчить про справжній поступ!\" Він викладався на повну, але байдужий натовп не піддавався. \"А тепер глибоко вдихніть...\" Міша урвався й зітхнув. \"Ох, слухайте. Не морочитиму вам голову цим лайном. Генеральна Асамблея хоче, щоб я виголосив промову про визволення й свободу, але все це лише показуха\". Збентежені люди підняли брови: це жарт?\n\nМіша побачив, що все котиться шкереберть. \"Послухайте, я... е-е, річ у тім...\" Він глибоко вдихнув. \"Річ у тім, що заготовленою промовою не пояснити, як усе працюватиме. Анархію треба відчути самому. Я бачив це на власні очі. Жив у державі, де людей розстрілювали, якщо вони непритомніли від виснаження. Я бачив тиранію й звик до неї, тоді це мене майже не обходило. А тепер побачив альтернативу - справжню співпрацю, і вона прекрасна. Ви можете принести її своїй комуні\". Представники партій перезирнулися, а тоді схвально кивнули Міші."
 SBA.27.a: "Непогано для перевихованого призовника."


 SBA.28.t: "Винюхуючи щурів"
 SBA.28.desc: "Мішурєнко всміхався у своєму кортежі: цієї пори року Монголія була прекрасна. Він і справді об'їздив увесь світ - Україну, Фінляндію, Сибір, а тепер Монголію. Його країна була напрочуд прекрасна. Коли ще існувала. Мішурєнко перестав усміхатися.\n\nВантажівка зупинилася на міському майдані. Мішурєнко чекав, доки солдат з іншої машини відчинить дверцята, а тоді вийшов у свіже повітря визволеного міста. Посеред площі спорудили трибуну - кілька дерев'яних сходинок вели до помосту з мікрофоном. Мішурєнко уникав погляду на натовп. Не хотів, щоб вони його бачили. Не люди - шпигуни. Німці.\n\nСтарий генерал піднявся сходами, суглоби боліли на кожному кроці. Він мусив поглянути на натовп. Примружився, намагаючись добре роздивитися, де вони ховаються. Очевидно, сховалися добре. Він торкнувся мікрофона, й сам рух породив огидний свист. Генерал кривився від болю, доки той не стих.\n\n\"Товариші цієї щойно визволеної землі\". Мішурєнко, як Сіуда, чекав оплесків, але їх не було. Байдуже. \"Ваше визволення оплачене життями борців за свободу Росії. Ми вмирали за вас, обіцяли нагодувати й одягнути вас, обіцяли свободу\". Натовп дивився з такою злобою, що Мішурєнко всміхнувся: вони викривали себе. Лише шпигуни могли так гидувати свободою. \"Ваша боротьба ще не скінчилася! Просто зараз поміж вами німці, які проникли до Червоної Армії під час відступу на схід і передають цю промову господарям у Ґерманії! Завершіть боротьбу! Скиньте з шиї останній чобіт і виженіть шпигунів!\" Тепер Мішурєнко розумів, чому Сіуда так любив промовляти: він захопився!\n\nА люди - ні. Перший кинув образу, другий - сміття, останній - камінь, що ледь не влучив у голову. Солдати миттю оточили його й повели зі сцени до машини. Мішурєнко знову всміхнувся."
 SBA.28.a: "Усі вони зрадники."


 SBA.29.t: "Місто в облозі"
 SBA.29.desc: "Томск тремтів під вагою Сіуди та його товаришів. Стєпанов, Мішурєнко, Валєнтєєв - композитор добре знав їх усіх. Вони навіть дивно його захоплювали. Він стежив за репортерами, які супроводжували наступ Чорної Армії, і відразу читав кожну нову статтю. У житті вони були інакші, менші - принаймні з верхівки радіоцентру. Звідси він бачив їхню ходу, потоки людей, які витікали з фабрик і вливалися до бурхливої ріки маршу на міський майдан.\n\n\"Я ставив на короля, - глузував поет. - Відверто кажучи, анархістів сподівався побачити останніми. Може, саме тому вони й були найімовірнішими\".\n\n\"Замовкни, - просичав науковець. - Та жінка...\"\n\n\"Євґєнія?\" - перебив композитор.\n\n\"Мені байдуже, як її звати. Ми говоримо по радіо. Вона стверджує, що віддана справі освіти, і я схильний їй вірити\".\n\nКомпозитор повернувся до вікна. Через розмову він загубив провідників руху й тепер бачив лише суцільну людську масу, що йшла під анархістськими прапорами. Двері розчинилися, усі троє здивовано озирнулися. На порозі стояв юнак із панікою на обличчі. \"Камов на даху з гелікоптером. Треба йти! Ліхачов організовує контрпротест - може, відверне їх від цієї будівлі!\" Ніхто не рушив. \"Ходімо! Треба тікати!\"\n\nКомпозитор поглянув на поета й науковця. Без слів зрозумів їхній вибір. Шостаковіч простягнув поетові руку. \"Щасти вам обом. Наш експеримент провалився, починається новий\"."
 SBA.29.a: "Композитор накульгуючи пішов геть."


 SBA.30.t: "Правосуддя для всіх"
 SBA.30.desc: "Правосуддя можна здійснити по-різному. Алєксандра перебирала варіянти від миті, коли чоловік із темною плямистою бородою схопив її за зап'ясток біля бару. Поки він тягнув її вглиб провулка, вона уявляла його розтрощену голову й пульсацію серця у відкритому мозку. Коли стояла навколішки й дивилася, як він розстібає ремінь, уявляла ту саму позу перед його безвільним тілом на шибениці. Кинута у смітник після наруги, вона лічила шляхи до справедливости.\n\nУранці Алєксандра визначилася. Убивство не дасть їй справедливости. Намагання забути, як колись зробила мати, теж. Вона відмовлялася нести тягар, покладений незнайомцем - негідником, який уважав себе вищим за інших і присвоїв право вирішувати їхню долю. Він переміг би, якби вона скорилася люті, якби відібрав у неї ту людяність, якої сам не мав. Він не переможе.\n\nСело відгукнулося на її заклик. Не все, звісно. Багато містян досі вважали, що жінка - навіть визволена - має бути домогосподаркою й народжувати дітей. Справжніми революціонерами Алєксандра визнала тих, хто вдерся до будинку ґвалтівника. Тих, хто витяг його з криками й бриками - як її минулої ночі. Чоловіків і жінок, які змінили б Росію. Селяни стали довкола трибуналом і засудили до смерти фашистського мандрівника зі східних земель, не давши йому перемогти. Алєксандра не скорилася люті - вона знайшла справедливість у співчутті народу."
 SBA.30.a: "Око за око."


 SBA.31.t: "Розуміння між рівними"
 SBA.31.desc: "\"Можете привести наступного, товаришу\". Товариш Турґєнєв був військовим до мозку кісток: бився проти білих за большевиків, проти німців за Союз і зрештою проти росіян за Росію. Стріляти навчився раніше, ніж читати. Це було в нього в крові.\n\nЗ подвійних дверей вийшли двоє. Один у лахмітті, босий і нечесаний. Другий виблискував медалями на однострої, засліплюючи всіх на шляху. Товариш Турґєнєв знову перечитав папір. Описана там людина була цілковитим незнайомцем проти жебрака перед ним. Той схуд щонайменше на десять кілограмів. Однострій, мабуть, спалили або залишив собі на згадку майбутній офіцер. Турґєнєв дивився на жалюгідну ходу, доки обидва не зупинилися.\n\n\"Товаришу Турґєнєв, представляю офіцера Червоної Армії. Його звинувачують у заподіянні безпідставних страждань, придушенні корінних народів Монголії та реакційному насильстві\".\n\n\"Дякую, товаришу\". Старий офіцер відпустив супровід і звернувся до в'язня. \"Ви солдат?\" Кивок. \"Добрий?\" Ще один. \"З поваги поставлю пряме запитання. Ви вважаєте себе винним у цих злочинах?\"\n\n\"Ні, - рівно відповів в'язень. - Я воюю за цю країну від народження й воюватиму до смерти\". Турґєнєв розуміюче підняв брову, немов почув власну історію. Він задумливо постукав пальцями по лаві. За службу й сам учинив чимало сумнівного - хто він такий, щоб судити іншого за те саме?"
 SBA.31.a: "\"Я не вважаю вас винним у жодному злочині\"."

 
