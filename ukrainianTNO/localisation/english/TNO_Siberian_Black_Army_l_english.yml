 SBA.36.t: "Пошта!"
 SBA.36.desc: "Сьогодні вранці до нашої столиці надійшов лист із печаткою Чорної Армії. Заволоко спершу вирішив, що це оголошення війни, і остерігався навіть відкривати його. Та після подвійної, потрійної й четверної перевірки лист визнали досить безпечним.\n\nВін був короткий: \"Приїздіть до Канска обговорити об'єднання\". Іван прочитав записку радникам. \"Що робитимемо?\" - спитав старий."
 SBA.36.a: "\"Гадаю, вибору немає\"."
 SBA.36.b: "\"І що вони зроблять - визволять нас?\""

 SBA.37.t: "Очікувана відповідь"
 SBA.37.desc: "Іван Заволоко йшов проходом Генеральної Асамблеї, заклавши руки за спину й оглядаючи будівлю. Вона скидалася на церкву: ряди лав, мов ослони; замість вівтаря - трибуна. Хор не змінився, тільки люди співали іншу пісню. Комуністи знали, що будують, - старий тихо засміявся. Мабуть, не усвідомлювали й не хотіли цього, але Бог був із ними в цій будівлі.\n\nПровідник старовірів шанобливо кивнув членам Ради Безпеки й зморшкуватими руками вчепився у трибуну. Це нагадувало проповідь, але передусім було благанням про мир і зважену інтеграцію.\n\n\"Я росіянин. Був ним від народження й залишуся після смерти. На відміну від багатьох присутніх, я бачив мирну Росію\". Заволоко провів рукою перед собою, охоплюючи Генеральну Асамблею. \"Люди Ойротії голодні, попри всі мої намагання їх нагодувати. Люди Ойротії мерзнуть, попри всі намагання їх одягнути. Я хочу майбутнього для свого народу. Я цілковито вірю в російський народ. Якщо його воля - анархія, нехай так і буде\". Іван наголосив долонею по дереву.\n\n\"Найбільше я хочу миру. Хочу, щоб їхнім дітям, як і мені, пощастило народитися в часи стабільности. Мир і стабільність не приходять із довгого дула рушниці. Навчайте їх. Навчіть мене. Переконайте росіян словами - і вони навіки стануть поруч; переконайте кулями - і вони замислять вашу загибель\". Іван схилив голову й тихо проказав коротку молитву."
 SBA.37.a: "Мудрі слова. Мудрі вчинки."


 SBA.38.t: "Ляпас!"
 SBA.38.desc: "Саша стояв серед тисяч людей біля брами Бійска. Наплічник тиснув на плечі. Він не міг дочекатися, коли їх впустять, як і решта. Бригада мерзла тут, здавалося, цілу вічність, і люди починали галасувати.\n\n\"Якого біса ми чекаємо? - перекричав юрбу один чоловік. - Товариш Валєнтєєв сказав, що ночуватимемо в місті, а ми тут, курва, пальці відморожуємо!\" Дехто підтримав, більшість мовчки дивилася на величезну браму й чекала славної миті, коли вона відчиниться.\n\nМинали години. Брама не відчинялася.\n\nОдин незадоволений перетворився на десяток, десяток - на сотні; обурення зростало, мов снігова куля. Браму намагалися зламати й увірватися силою - марно. \"Це якась хуйня! - завив солдат, сп'янілий від присмаку революції в повітрі. - Це що, хворий жарт? Пригнали нас сюди здихати?\"\n\n\"Хотів би я, щоб це був жарт, - головного болю було б менше\". З міста вийшов Стєпан Валєнтєєв. Бригада миттю затихла. \"Заволоко відмовив у нашій пропозиції інтеграції\". Повага до Валєнтєєва втримала порядок, поки він повідомляв нищівну новину.\n\n\"То що робитимемо, товаришу Валєнтєєв? Розвернемося й підемо додому?\""
 SBA.38.a: "\"Ні, - безрадісно відповів він. - Ми візьмемо місто в облогу\"."

 SBA.39.t: "Посилення контролю Чорної Армії"
 SBA.39.desc: "У міру розширення й модернізації Вільної Території дедалі більше адміністративних посад обіймають представники Чорної Армії. Рух до централізованої бюрократії передав солдатам обов'язки, які колись виконували провідники комун. Зростання кількости арештів і придушення інакодумства ще більше зміцнило владу апарату, покликаного захищати свободу."
 SBA.39.a: "Влада держави зростає..."


 SBA.40.t: "Беремо владу у власні руки"
 SBA.40.desc: "Вільна Територія передає дедалі більше влади комунам, тож Чорна Армія поступилася провідною роллю сибірському народові. На прикрість честолюбним генералам, які прагнуть влади, люди вирішили зберегти вірність ідеалам анархізму, що колись надихнули Революцію."
 SBA.40.a: "Влада народу зростає..."


 #SBA.41.t: "The Ascension of the Security Council"
 #SBA.41.desc: "Ivan Stepanov, the fat bitch. Ivan Stepanov, the operative of the state. Ivan Stepanov, the snake within the garden. In all honesty, he had hoped for a more creative title. Ivan Stepanov, savior of Russia? Ivan Stepanov, bringer of sanity to a land of madmen? Either would've been fine in his book, but those words did not pass the lips of the protesting people.\n\nIvan Stepanov sat in his usual chair, in his usual spot, in his Assembly. Siuda could receive all the fame in glory, shout as loud as his voice would allow, be the father to Mother Anarchy, but what could he do besides that? Could Pyotr Siuda overcome the challenges of a decentralized hierarchy? Would Pyotr Siuda be willing to make sacrifices in the name of succes, of stability? Could Pyotr Siuda stop Ivan Stepanov?\n\nThe idea made him giddy, he felt like a character in a play. Shakespeare was what he pictured, but it felt more like a Pushkin play. Ivan Stepanov may have been the villain in the story but he was a character, a person to be followed by an audience, he had power. His power had only been expanded as he cornered Siuda in his metaphorical game of chess. One motion blocked is worrying, two is cause for concern, but by the third, the Black Army and Stepanov stood atop the corpse of anarchy. There would be no more need for a General Assembly, for a free Russia. Russia was his and it would be shaped in his vision."
 #SBA.41.a: "I win."
 
 SBA.42.t: "Комуну можна переконати"
 SBA.42.desc: "Усі комуни Вільної Території віддані свободі, рівності й демократії, але певні розбіжності природно лишаються. На щастя, спірне питання для комуни, прихильности якої ми домагаємося, відносно незначне. Вони майже цілком на нашому боці, тож потрібно лише трохи переконання, аби вони підтримали пропозицію."
 SBA.42.a: "Поговорімо."
 SBA.42.b: "Не варто."

 SBA.43.t: "Комуна просить підкріплення"
 SBA.43.desc: "Нещодавно ми почали переговори з комуною про підтримку нашої пропозиції в Генеральній Асамблеї. Вона вагається, бо питання її безпеки досі не вирішено. Місцевій міліції буцімто бракує людей, аби ґарантувати безпеку мешканців. Можливо, додаткові бійці дадуть їм досить упевнености, щоб виділити ресурси на нашу підтримку."
 SBA.43.a: "Вільна Територія захищає своїх людей!"
 SBA.43.b: "Напевно, вони впораються самі."

 SBA.44.t: "Комуна просить політичної автономії"
 SBA.44.desc: "У Вільній Території всі комуни мають рівне представництво. Політична автономія - інша річ. Деякі багатші або населеніші комуни вважають, що інші несправедливо їх обмежують, а вони заслуговують більшої свободи - у справжньому дусі анархістської справедливости, як самі кажуть. Одна така комуна попросила розширити свободи, на які, на її думку, має право. Натомість вона готова закликати своїх людей підтримати нашу нинішню пропозицію."
 SBA.44.a: "Що ж, це лише справедливо."
 SBA.44.b: "Ніколи! Ми рівні в усьому!"

 SBA.45.t: "Комуна просить фінансування"
 SBA.45.desc: "Фінансування часто обговорюють у Генеральній Асамблеї. Справедливо й порівну розподілити кошти нелегко, і завжди хтось незадоволений своєю часткою. Зазвичай це можна було б пояснити вадами людської природи, але наші комуни, звісно, вищі за такі дрібниці. Отже, комуна, яка просить економічної допомоги й належного визнання своїх потреб, лише домагається справедливого й необхідного для добробуту людей - принаймні вона так стверджує. Якщо ми засвідчимо добру волю й віру в справедливість, вона охочіше підтримає наші починання."
 SBA.45.a: "Усе заради наших товаришів."
 SBA.45.b: "Це звичайнісінький підкуп!"

 SBA.46.t: "Комуна просить навчити міліцію"
 SBA.46.desc: "Підготовка комунної міліції нікуди не годиться - принаймні так стверджує комуна, з якою ми ведемо переговори. \"Бандити вільно гуляють нашими землями, - кажуть вони. - Люди налякані й недисципліновані. Їм бракує вишколу, щоб захиститися від небезпеки\". Кілька інструкторів із головних сил міліції Вільної Території неабияк поліпшили б безпеку комуни. За таку послугу вони були б дуже вдячні."
 SBA.46.a: "Звісно. Ми мусимо триматися разом."
 SBA.46.b: "Вони вже мають власних інструкторів."

 SBA.47.t: "Комуна просить припасів"
 SBA.47.desc: "Матеріяльні потреби комун численні й різноманітні: ліки, аварійні пайки, будівельне обладнання, інструменти тощо. Усього завжди бракує, і комуни регулярно залишаються без необхідного в найгіршу мить. Одна з них саме потрапила в таке становище. Якщо надішлемо припаси як нагадування про нашу відданість взаємодопомозі, вона напевно відповість послугою на послугу."
 SBA.47.a: "Надішліть усе необхідне."
 SBA.47.b: "Ми не можемо ставитися до когось прихильніше."

 SBA.48.t: "Комуна просить економічної автономії"
 SBA.48.desc: "Попри посткапіталістичний устрій економіка для комун важлива, як і раніше. Ми просунулися до цілковитої економічної рівности людей Вільної Території, але добробут окремих комун досі відрізняється. Це прикро, однак виправити становище важко. Усе ще більше ускладнюють вимоги деяких комун надати їм економічну автономію, яка нібито потрібна, щоб досягти тієї самої рівности. Це суперечить нашим цінностям, але має практичний сенс, а дозвіл може схилити їх до підтримки нашої пропозиції."
 SBA.48.a: "Звісно. Так буде найкраще."
 SBA.48.b: "Неокапіталізм у дії? Ніколи цього не підтримаємо!"

 SBA.49.t: "Комуна просить зброї"
 SBA.49.desc: "Виробництво зброї у Вільній Території завжди йшло справно: кожна комуна діставала не менше рушниць, ніж треба для захисту від бандитів і зазіхань реакціонерів. Проте одна з комун Генеральної Асамблеї стверджує протилежне. Нібито останніми місяцями їй недопостачали зброю, і тепер міліція не може захищати громаду. Доказів немає, та якщо вони мають потребу, її слід задовольнити - принаймні так вони кажуть."
 SBA.49.a: "Вони дістануть потрібну зброю."
 SBA.49.b: "Напевно, вони помилилися. Більше не дістануть."

 SBA.50.t: "Чорна весна"
 SBA.50.desc: "Довкола нас ущухли квітневі дощі. Дерева вкрилися листям, пташенята вчаться літати, а розпутиця добігає кінця. Разом із нею зникають багнисті дороги, що поглинають цілі військові бригади й нищать більше російських вантажівок і танків, ніж будь-яка армія. Літо вже близько, весняне багно висихає, і до осени матимемо коротку пору чистих доріг і доброї погоди.\n\nСкористаймося цим часом і почнімо готуватися до війни - наші сусіди напевно роблять те саме."
 SBA.50.a: "Уперед!"

 SBA.51.t: "Гулянка, як у 1914-му"
 SBA.51.desc: "Пьотр Сіуда високо здійняв келих, і алкоголь вихлюпнувся через край. Він почувався легким, наче плив на хмарі. Ще хлопцем Пьотр пообіцяв собі, що ніколи не піддасться спокусі алкоголізму, який забрав у нього батька. Але сьогодні можна було зробити виняток. Уранці він напевне про це пошкодує і неодмінно вилає Євґєнію за те, що дозволила йому долучитися до, здавалося, невичерпних запасів випивки Стєпанова, здобутих невідомим Пьотрові способом.\n\nТа зараз це не мало значення. Пьотр, усе ще тримаючи келих над головою, заговорив заплітаючись: «Товариші!» До нього обернулися звичні обличчя: Євґєнія, Стєпанов, Валєнтєєв, навіть Мішурєнко прийшов приєднатися. «Я думаю, я думаю...» - Пьотр затих, немов задивившись на щось удалині.\n\n«Невже?» - підколов Стєпанов. «Зараз щось не схоже».\n\nЄвґєнія грайливо ляснула Стєпанова по руці: «Та годі тобі! Він уперше! Дай хлопцеві трохи відсвяткувати - ми ж здобули велику перемогу».\n\nВалєнтєєв підняв келих: «Безперечно». Він одним ковтком осушив гіркий напій. «Ми всі зробили тут щось неймовірне».\n\n«Назад дороги вже немає, - втрутився Мішурєнко, так і не торкнувшись своєї чарки. - Або ми підемо у відставку в Москві героями, або помремо тут, ставши лише сходинкою для наступного режиму, приміткою в історії Росії».\n\nТроє без усмішки глянули на старого генерала. «Не заглядаймо так далеко наперед, - сказала Таратута, обводячи пальцем край келиха. - Сьогодні ми перемогли, і більше ніщо не має значення!»"
 SBA.51.a: "«Будьмо!»"


 SBA.52.t: "Об'єднати анархію"
 SBA.52.desc: "Міхаїл відкинувся на спинку стільця, виснажений довгим днем читання звітів і перемовин із місцевими очільниками комун. За двадцять років провідництва й служби генералом у Чорній Армії він засвоїв одне: управляти територією завжди важче, ніж завойовувати її. Можна було б подумати, що власні права комун і передання їм управлінських обов'язків полегшать йому життя, та виходило навпаки. Кабінет Міхаїла постійно сповнювали запеклі суперечки: він без кінця сперечався з очільниками комун про те, скільки матеріялів зможе їм надати й скільки людей потребує від них. Між ним і комунами, які йому доручили захищати, точилося безперервне перетягування каната.\n\nНа столі лежали карти й теки щодо нещодавно завойованої території, управління якою поклали на нього. Міхаїл зітхнув, випростався і взяв головну карту нових земель. Будувати комуни з нуля завжди було нелегко, а інтегрувати їх до Вільної Території - ще важче. Це означало стоси паперової роботи й, що гірше, ще одного комунного очільника, з яким доведеться гризтися. З іншого боку, в регіоні було повно повстанців, які прагнули відокремитися від Вільної Території. Він міг просто запровадити там воєнний стан і керувати краєм безпосередньо. Вибори в комуні можна провести пізніше, а поки це напевне полегшило б йому роботу. Міхаїл потер очі й замислився, що робити."
 SBA.52.a: "Забагато рішень."

 SBA.53.t: "Анархія на дроті"
 SBA.53.desc: "Вантажівки почали проїжджати через їхнє маленьке містечко три тижні тому. Вадім уперше помітив тих чоловіків одного дня, коли грався в полі: вони приїхали й заговорили з місцевою радою. Згодом з'явилося ще кілька людей із вимірювальними приладами та якимось планом. Вадім навчився остерігатися таких урядовців, коли вони навідувалися. Раніше від них завжди були самі біди. Хлопець здригнувся, згадавши часи, коли тата відправили воювати.\n\nТаких людей легко було помітити. У селищі на п'ятсот мешканців майже всі знали одне одного. Однак ці люди не були схожі на попередніх. Замість зелених військових шинелей вони носили сині комбінезони й, здається, не збиралися нікого забирати. Їх цікавило лише встановлення великих дерев'яних стовпів, з'єднаних довгими чорними кабелями. Вадім нічого не розумів.\n\nЩе дивніше було те, що дорогою додому він побачив чоловіків у синіх комбінезонах, які встановлювали посеред міста велику скриню. Довкола зібралося все місто, поки вони приєднували до неї чорні кабелі. Усі наче чогось чекали, але чого саме - Вадім не знав.\n\nРаптом, коли кабель увійшов у скриню, пролунав клац. Усі затамували подих, а один із чоловіків у синьому комбінезоні підняв слухавку. Лише двома словами він наче підірвав у натовпі петарду. Містяни раділи й обіймалися, а Вадім розгублено дивився, не розуміючи сенсу цих слів. Він покрутив їх на язиці й повторив, ніби так міг краще збагнути."
 SBA.53.a: "«Алло, операторе?»"

 SBA.54.t: "Скульптори минулого"
 SBA.54.desc: "Пьотр Сіуда порпався в шафі з документами. Мало бути на літеру «Н», правда? Він був певен. Він ніколи не визнав би заслуг держави, але чого-чого, а вести облік вона вміла. Ліворуч стояв генерал Іван Стєпанов, праворуч - Міхаїл Кільчічаков, а за дверима Андроній Мішурєнко вимагав дати нарешті роботу всім цим чоловікам, які байдикували. У ситуації було щось комічне: ключові члени Ради Безпеки, люди, відповідальні за піднесення анархізму, нишпорили університетським містечком. Для Пьотра і Стєпанова це було вкрай важливо, але обидва все ж бачили тут гумор.\n\n«Усе те навчання не минуло дарма, Іване? У військовій школі вас учили грабувати університети?» Стєпанов лише пирхнув і далі перебирав теки. Сіуда тихо засміявся й продовжив гортати мільйони папірців у шафі.\n\n«Дещо знайшов», - сказав Кільчічаков, діставши манільську теку. На обкладинці красувався серп і молот. Стєпанов забрав документ у Міхаїла й розгорнув першу сторінку. «Навчальна програма Союзу Совєцьких Соціялістичних Республік», - було надруковано жирними великими літерами. Стєпанов передав документ Сіуді, який принаймні спробував уважно прочитати кожну сторінку, перш ніж Стєпанов забрав теку назад.\n\n«Прочитаєш у вільний час. Ми знайшли потрібне. Разом з усім іншим, що ми взяли з другого університету в цьому місті, цього більш ніж досить, щоб укласти пристойну програму».\n\n«Іване, ти надто легко приймаєш совєцьке вчення. Пошукаймо ще - я певен, тут знайдеться програма, що відповідає народному баченню майбутнього», - сказав Сіуда.\n\nСтєпанов похитав головою: «Я ненавиджу їх не менше за тебе, Пьотре. Гадаю, найкраще не обмежувати знання, а дозволити людям самим обрати найліпше». Пьотр надовго замислився."
 SBA.54.a: "«Що ж, мабуть, це вибір народу»"
 SBA.54.b: "«Ми ніколи не підемо за вченням держави!»"

 SBA.55.t: "Свобода для всіх! Окрім..."
 SBA.55.desc: "«На нас із чоловіком напали». Чоловік витер сльози й насилу вимовив ці слова. Ще один день, ще один виступ перед здебільшого байдужою Радою Безпеки. Ось такі радощі відкритої для всіх Вільної Території. Потреба в таких виступах часто була щонайменше сумнівною, але люди все одно мали право говорити, навіть якщо це ні до чого не призводило. Та сьогодні все було інакше: уважно слухали не звичні двоє членів Ради, а значно більше. Генерал Стєпанов нахилився вперед - у голові в нього явно крутилися думки. Пьотр Сіуда також слухав уважно, і не він один.\n\n«Ми ж нічого не робили! Просто йшли до крамниці, а він... мій чоловік зупинився поглянути на щось у вітрині, власник вийшов і почав кричати. Назвав нас злом і огидним спотворенням образу Господнього. Там була якась дурниця. Той чоловік продавав квіти, а мій чоловік їх дуже любить. Узагалі-то ми тримаємо найбільший сад у нашій комуні. Вибачте, я щось розговорився».\n\nСтєпанов поклав ручку на стіл і похитав головою. «Я не змушуватиму вас продовжувати. Те, що з вами сталося, огидно й ніколи не мало б траплятися ні з ким у цьому вільному суспільстві». Пьотр повільно хитав головою, обмірковуючи пережиту парою травму. Вони мали право жити як хотіли, але ж і той чоловік мав право кричати, чи не так? Зазвичай Пьотр завжди знав, що сказати, але тепер мовчав.\n\nНа щастя, товариш Валєнтєєв заговорив замість нього: «Те, що з вами сталося, жахливо, я не побажав би такого й ворогові. Проте твердо вважаю, що в цьому суспільстві він має право не лише відмовити вам в обслуговуванні, а й висловити свою думку про ваш спосіб життя». Між членами Ради швидко спалахнула сварка. Більшість погоджувалася, що власник крамниці перейшов межу, але розійшлася в тому, чи має він право відмовляти комусь через сексуальність.\n\nНарешті Стєпанов наказав замовкнути. «Товариші, ми маємо бачити в цьому не поодинокий випадок, а ширшу проблему, що загрожує розірвати всю нашу Територію. Пропоную зробити пріоритетом цього органу викорінення несправедливости на всіх рівнях, навіть в особистому житті»."
 SBA.55.a: "Ви так само вільні, як він чи я."
 SBA.55.b: "Мені не подобаються його слова, але я захищатиму його право їх казати."

 SBA.56.t: "Діяти наперед чи у відповідь?"
 SBA.56.desc: "Міхаїл Кільчічаков пробіг очима пропозицію на столі. План, укладений Стєпановим, був цілком у його звичному дусі. Міхаїл мало дбав про анархізм, а про Стєпанова - ще менше. Міхаїл любив числа: у світі, де ніщо не мало сенсу, вони були зрозумілими. Він ніколи не читав Бакуніна й лише побіжно чув про Махна, зате знав, як змусити все працювати, і навіть Пьотр час від часу мусив це визнавати.\n\n«У цій цифрі забагато нулів, Іване, - сказав Міхаїл, дивлячись поверх окулярів. - Не стомлюватиму тебе ідеологічними наслідками твоєї маленької програми проти бідности - чи краще сказати, проти Сіуди. Мене більше цікавить, як ти збираєшся її здійснити, коли я вже спрямовую чималу частину бюджету на те, щоб твої хлопці мали найновішу зброю, яку тільки можна купити».\n\nСтєпанов нахилився вперед і склав руки на столі Міхаїла. «Запевняю вас, товаришу Кільчічаков, моя пропозиція не лише здійсненна, а й необхідна! Ми повинні активно перерозподіляти багатство на користь народу! Подумайте, скільки життів ми врятуємо й поліпшимо цією історичною програмою!»\n\nМіхаїл зітхнув і похитав головою. «Годі молоти лайно, Іване. Я не Пьотр, мене не зворушиш боротьбою народу чи як там ти називаєш цю маячню. Я дивлюся на це суто прагматично - це ж моя робота, так? Я зводжу рахунки, ти стріляєш реакціонерів. Не розумію, навіщо ти взагалі сюди прийшов: нинішня система комунного самоврядування працює чудово. Вони беруть потрібні гроші й витрачають їх як вважають за потрібне. Навіщо нам узагалі втручатися?»\n\nСтєпанов насупився, помітно розлютившись, але ще не бажаючи скидати маску: «Це важливо не лише для мене, Міхаїле, а й для армії. Подумай, чиї родини це врятує. Подумай, що вони скажуть, коли довідаються, що Міхаїл Кільчічаков зарубав цю програму, водночас накопичивши собі немалий статок». Міхаїл люто зиркнув на Стєпанова; між їхніми поглядами розгорнулася запекла битва."
 SBA.56.a: "Кожному за його потребами."
 SBA.56.b: "Скільки треба - стільки й беріть."

 SBA.57.t: "До свіданія"
 SBA.57.desc: "Пьотр швидко проминув гордовиту браму Канська й рушив до Генеральної Асамблеї - можливо, востаннє. Він тремтів на сибірському морозі: навіть кілька шарів одягу майже не захищали від холоду. Та попри стихію, а може, саме через неї, Пьотр раптом завмер. Він вдихнув холодне повітря міста - міста, яке збудував і любив, міста, де все почалося. Пьотр неквапом підійшов до брами, вкритої написами з незліченних походів. Нарешті він усвідомив: усе це насправді. Він, Пьотр Сіуда, пліч-о-пліч із братами по комунах кував нову Росію. Усе здавалося таким... остаточним. Назад дороги не було: він повів у бій забагато армій, загинуло забагато людей. Тепер треба було мчати вперед на повній швидкості - бездіяльність означала б смерть анархістського руху. Пьотр відштовхнувся від брами й продовжив шлях до Генеральної Асамблеї.\n\nРозчинивши двері, Пьотр побачив звичну компанію: Стєпанов щось писав за столом, Валєнтєєв показував на карту з містами, позначеними як дружні й ворожі, а Мішурєнко намагався викреслити всі дружні. Довкола сотні людей гомоніли в залі Асамблеї. Пьотр усміхнувся: строкате було товариство. І це личило носіям смолоскипа анархізму - рух мав об'єднувати багатьох людей із найрізноманітнішим минулим. Пьотр потис руку Валєнтєєву, шанобливо кивнув Мішурєнкові й сів на лаву.\n\n«Пані та панове, поки останні з нас сходяться цього морозного сибірського ранку, я хотів би сказати кілька слів перед початком». Сіуда з благоговінням дивився на натовп, на весь рух. «Те, що ми створили тут, сниться в кошмарах і царям, і фашистам! Ми разом підвелися! Завдяки вірності одне одному ми звільнили наш народ від тиранії держави, та попереду ще стільки всього. Перед нами багато роботи, й запевняю: вона не завжди буде простою чи приємною. Буде важко. За все добре в житті доводиться боротися - його не дарують. Тут ми вибороли свободу, але я не можу спокійно спати, товариші, знаючи, скільки ще лишилося зробити». Пьотр дивився, як зачиняються двері Асамблеї. «Здається, всі вже тут. Прошу сідати - починаймо»."
 SBA.57.a: "Наша робота ніколи не скінчиться."

 SBA.58.t: "Болісне благання"
 SBA.58.desc: "Софія чемно всміхалася, підходячи до трибуни; її підбори цокали по підлозі. Білосніжна хутряна шуба й багряні губи різко вирізнялися серед слухачів, у найкращому разі вдягнених у костюми, а в найгіршому - в лахміття. Вона поправила папери й ніяково всміхнулася Раді Безпеки, ледь не осліпивши багатьох її членів перлинно-білими зубами. Пьотр кивнув, і білявка заговорила.\n\n«Доброго ранку, пані та панове Канська! Мене звати Софія Пєтрова, я була заможною підприємицею з Томська». Вона на мить замовкла, намагаючись оцінити реакцію слухачів. «Моє життя оберталося довкола керування батьковою справою, турботи про двох любих донечок і вечірніх занять, на яких я розширювала свої знання. Усе троє в мене забрали». Усмішка Софії на мить затремтіла, мов полум'я свічки від подиху. «Я прийшла не для того, щоб розповідати добрим людям свою жалісну історію», - сказала жінка, витягла з кишені шовкову хустинку й промокнула кришталево-блакитні очі. «Я прийшла сказати, що у світі є добро. Що не всі в тому місті були лихими. Я всім серцем прийняла, що таке вже життя! Розумієте?» Жінка надто гучно засміялася перед мовчазною авдиторією. Не збившись ні на мить, Софія продовжила: «Я знаю: ви гніваєтеся й прагнете справедливости. Я теж її прагну, але прошу вас про милосердя у вашій справедливості. Томськ розграбували. Ми втратили все. Ми готові не тільки жити на цій землі, а й любити її, прагнемо відчути ваше братерство. Прошу лише про одне, - Софія видушила жалюгідну напівусмішку, - дайте людям самим збудувати рівність, не нав'язуйте її силоміць».\n\nСофія зійшла з трибуни, опустивши голову, й повернулася на місце. Вона схрестила ноги й натягла найширшу усмішку. Вона знала: в деяких комунах її розстріляли б лише за слова про керування підприємством. Лишалося тільки дивитися на членів Ради й чекати їхньої справедливости."
 SBA.58.a: "Перехід під наглядом Армії неодмінно буде мирним."
 SBA.58.b: "Народ має сам вирішити свою долю."

 SBA.59.t: "Якби Бог існував, його слід було б скасувати"
 SBA.59.desc: "У занепаді Росії винне багато що. Найбільше звинувачень зазвичай дістається кепським планам Бухаріна й жадібним до влади генералам, які зім'яли Росію в кулаці й розвіяли її за вітром. Через непохитну відданість Богові надто багато людей забувають про роль Церкви. На перший погляд мало хто назве церкву коренем усього зла, та це було б не так далеко від істини.\n\nВіра в Бога сама собою суперечить анархістському світогляду. Бути слугою Божим - значить сумніватися передусім у силі особистости. Укладачі різних версій Біблії користуються нагодою, щоб підкорити собі волю народу. З плином століть слово Боже, якщо воно взагалі існувало, перекрутили й понівечили до невпізнання. Вільна земля означає свободу від усіх знарядь держави, а церква - лише одне з багатьох.\n\nУтім, пропозиція конфіскувати церковні багатства спричинила запеклі дебати: канський священник кілька годин сперечався із Сіудою про використання церкви на добро і на зло."
 SBA.59.a: "Спалити опіюм народу!"
 SBA.59.b: "Зрештою, Ісус був соціялістом..."

 SBA.60.t: "Наша остання надія"
 SBA.60.desc: "Скільки разів Пьотр Сіуда стояв перед Генеральною Асамблеєю, пліч-о-пліч із товаришами? Скільки разів йому ще судилося тут стояти? Ці питання затьмарювали думки молодого чоловіка, коли він підіймався на балкон канської ратуші. У цьому місті все почалося: тут він уперше протестував проти лицемірства Центральносибірської Республіки, організував повстання, потоваришував з Іваном Стєпановим - людиною, яку колись зневажав би. Мабуть, у цьому й була краса анархії: він не знав, що станеться далі. Він чудово знав, чого хотів би досягти, але чи вдасться? Пьотр не був певен. Надходили звіти і зі сходу, і з заходу, й жоден не віщував добра. Посередині лежала Вільна Територія - безпечний край поміж етатистами. Вони неодмінно пошлють свої літаки й танки, та схиблять у головному - у своєму посланні. Людина не стане фашистом чи соціялістом, хоч скільки в неї стріляй. Людей змінюють слова - унікальна людська здатність.\n\nПобачивши тисячі людей на міському майдані, Сіуда відчув надію: перед ним стояв народ, якому страждань уже вистачило на ціле життя. Саме ці люди вирішать долю Росії, а Пьотр мав допомогти спрямувати їх до добра. «Товариші! Я вітаю і тих, хто сьогодні вперше долучився до нас, і тих, хто йшов із нами від самого початку». Люди зааплодували, дехто скандував його ім'я, і це бентежило Пьотра. Та він продовжив: «Сьогодні найбільша боротьба, що будь-коли точилася в Росії, входить у нову стадію. Перед нами постануть вороги, які захочуть розділити нас, підірвати нашу справу й підмінити її власною. Вони прагнуть нами маніпулювати, знову загнати під чобіт, з-під якого ми виповзли. Товариші, невже ми їм це дозволимо?» Зібрані маси заспівали хором про визволення, ясно висловивши свою волю: державі тут не місце."
 SBA.60.a: "Безпека - наше найважливіше право."
 SBA.60.b: "Анархія - майбутнє."
 
 SBA.61.t: "Погляд усередину"
 SBA.61.desc: "«Проходьте, проходьте. Нам на кінцеву». Пьотр міцно стискав валізу в спітнілих долонях. Транссибірська магістраль була наче сонце - надійна й усюдисуща. Пьотр поправив костюм, потягнувся і встав із місця. Приємно було мати щось, що тримало його в реальності. Він ледве вірив, як усе змінилося: немов потяг мчав рейками з перерізаними гальмами. Колись же колія мала скінчитися, правда? Одного дня люди збагнуть, що вбивати всіх розлюченим натовпом - не розв'язання їхніх проблем. Напевне. Але перевіряти це буде не він. Пьотр зійшов із потяга. Ось він - Бійськ. Пьотр озирнувся в пошуках бодай якихось ознак цивілізації; зрештою, з потяга вийшов він один. Його попереджали, що місто - глушина, і він мав якнайкраще його оцінити: з'ясувати, що вже добре, що можна поліпшити, а що слід повністю відкинути. До краху... усього Пьотр виконував таку саму роботу, тільки зазвичай у супроводі озброєної охорони й за велику платню. Тепер він був сам, посеред анархії, серед вівчарів, і мусив перетворити це місто на метрополію. Пьотр пройшовся «містом», якщо його взагалі можна було так назвати. Сільські жителі Бійська переважно трималися осторонь, тож збирати відомості було важко. Вдалині він помітив бар - у Росії частіше за залізницю траплявся хіба що він. Пьотр зайшов, поставив портфель і почав занотовувати. Раптом хтось торкнув його за плече.\n\n«Гей, незнайомцю, ти хто такий?» - запитала шинкарка.\n\nПьотр прокашлявся: «Я просто обстежую місто! Невелике дослідження для розумників із Новосибірська!» Пьотр ніяково засміявся. Чорт, чому він так незграбно поводився?\n\nЖінка всміхнулася попри його нервозність: «Що ж, Пьотре, сподіваюся, напишете про нас добре. Нам не додають любови». Вона підморгнула й відійшла, лишивши приголомшеного й розгубленого Пьотра самого з нотатками. Він похитав головою й знову глянув на папір, та слова розпливалися. Пьотр озирнувся на шинкарку, що розмовляла з літнім чоловіком. Обоє щиро розсміялися. Пьотр ковтнув, знову взяв ручку й написав просту фразу."
 SBA.61.a: "Дуже людяне."

 SBA.62.t: "Дипломатичний підхід"
 SBA.62.desc: "«Перепрошую, товаришу, чи маєте хвилинку поговорити про те, що можете зробити для Вільної Території?» Даніл саме почав складати відповідь чоловікові у дверях, та нагоди так і не отримав. «Ви здатні допомогти своїй комуні так, як навіть не уявляєте! Нас захищає не лише Чорна Армія, а й люди на фабриках і ті, хто готовий виходити на вулиці та нести наше послання!»\n\nДаніл чемно всміхнувся. Він не зв'язувався з такими людьми. Він не ненавидів місце, де жив, але й не любив його. Як і більшість у Кемерові, Даніл просто намагався перебитися. До шостої працював на сталеливарні, забирав вечерю й повертався додому, щоб переночувати, а вранці повторити все спочатку. Йому не було діла до визволення, народної справедливости, боротьби чи якого там модного слова цього тижня. «Гей, я це ціную, але зі мною все гаразд. Дякую, гарного вам вечора». Даніл почав зачиняти двері, та непроханий гість у буквальному сенсі вставив у них ногу.\n\n«Може, з вами все гаразд, але як ваш сусід? Ваша родина? У містах люди часом стають байдужими, ви ж розумієте?»\n\n«Е-е, так, мабуть, розумію, але...»\n\n«А ось чого ви можете не розуміти, товаришу, то це своєї ваги для спільної справи. Попередні режими бачили у вас лише число, рядок у таблиці. Я не хочу вам докучати чи псувати вечір, перепрошую, якщо так сталося». Чоловік забрав ногу з дверей, перевіряючи, чи Даніл їх зачинить.\n\n«Н-ні, все гаразд. Я просто втомився, знаєте, щойно з роботи й усе таке», - сказав Даніл, залишаючи двері відчиненими. Чоловік скористався нагодою, увійшов із брошурами в руках і почав розповідати про можливості. Даніл пробелькотів якесь заперечення, та гість уже був усередині. Даніл зітхнув: якщо відтепер життя буде таким, варто бодай узяти від нього все можливе."
 SBA.62.a: "Місто настільки сильне, наскільки сильним ви його зробите!"

 SBA.63.t: "Домовилися?"
 SBA.63.desc: "Фаділ поправив комір. Принаймні він хотів мати пристойний вигляд, навіть якщо вони не матимуть. Пьотр повторив йому вказівки до нудоти. Якби не снігова буря, Сіуда приїхав би сам, та не судилося. Байдуже, подумав Фаділ. Він навіть не знав, на які поступки погодитися. Вони жили в анархістському суспільстві - чого хотіли, ще більше свобод? Фаділ відчинив двері переговорної, зітхнув, поставив на стіл папери й каву. «Добридень, панове», - сказав він, відсунув стілець і гепнувся на нього. Вони не були схожі на радикалів, якими їх описували. Просто чоловіки, що працювали з електричними щитками й на фабриках. Утім, коли живеш серед найрадикальніших, ніщо вже не здається незвичним. «Я розумію, ви хочете пра... ні, беру слова назад. Самі скажіть, навіщо прийшли».\n\nОчільник організації почав явно завчену промову: «Ми, робітники Сибіру, ще від першої революції вимагаємо одного: не бути рабами, щоб нас вважали рівними. Саме ми даємо все потрібне для безперебійної роботи суспільства, і якщо ми оголосимо...»\n\nФаділ перебив: «Страйк. Так, я знаю. Я просто не розумію вашої позиції. Що ще ми можемо вам дати, крім повної свободи?»\n\nБригадир похитав головою: «Річ не лише у свободі, а й у представництві. Якщо не хочете повністю зупинити Вільну Територію, то дозволите створити міжкомунний орган профспілок, що матиме право подавати петиції Генеральній Асамблеї коли забажає і страйкувати без страху відплати Чорної Армії».\n\nФаділ трохи обміркував пропозицію. Вимога була немала, але Сіуда навряд чи заперечував би. Фаділ підвівся й простягнув руку: «Гадаю, ми домовилися, пане...» Він глянув на нагрудну табличку бригадира. «Пане Костін»."
 SBA.63.a: "Домовилися."

 SBA.64.t: "Думай. Думай!"
 SBA.64.desc: "У кабінеті Раміля панував безлад. Підлогу вкривали папери, які можна було розрізнити хіба за кольором чорнила. На стінах висіли карти, поцятковані хрестиками й галочками, ніби він був піратом у пошуках загубленого скарбу. Та Раміль шукав не золоті монети й не давно забуті коштовності. Його скарб був дорожчий за будь-який метал - він полював на надію. І геть нічого не знайшов.\n\nРаміль стягнув із полиці важку книгу й із гуркотом поклав її на стіл. Чому для цього обрали саме його? Він гортав сторінки, шукаючи хоч щось, шукаючи свою надію. Книга номер 480 нічим не відрізнялася від попередньої. Раміль відкинувся в кріслі й помасажував скроні. Невже відповідь справді знайдеться у книжці? У якому документі пояснюється різниця між допомогою і шкодою? Хоч скільки він перечитував Сибірський план, так і не міг вирішити, що добре, а що погано, що слід подати Раді Безпеки, а що ні.\n\nТри стуки у двері нарешті розірвали тишу. Раміль кинувся відчиняти. На порозі стояв Пьотр із двома чашками кави. «Уже північ, знаєш?» Раміль протер заспані очі й кивнув. «Ну то впусти мене, може, я зможу допомогти»."
 SBA.64.a: "Попереду довга ніч."

 SBA.65.t: "Очима щура"
 SBA.65.desc: "Фьодор пригнув голову й шмигав ринком. Кишені дзенькали з кожним квапливим кроком. Сьогодні зібралося стільки людей - це було й добре, й погано. З одного боку, відкривалося безліч нових «джерел доходу», як він їх називав. З іншого - значно зростала ймовірність бути спійманим, а народна справедливість навряд чи помилувала б злодія, хоч би яким юним він був.\n\nФьодор плив проти течії тіл, бурмочучи навіть не напівщирі вибачення, поки продирався супроти руху натовпу. Господи, думав він, що могло зігнати сюди стільки народу? Він роками потроху обчищав міський майдан і міг запевнити всіх цих людей: заради жодного місцевого добра сюди не варто було приходити.\n\nФьодор пірнув у провулок, прагнучи вирватися із задушливого людського моря. Він обережно визирнув зі схованки, щоб розгледіти мету натовпу. Велика юрба зібралася біля міського фонтану, довкола постаті, яка стояла на помості з ящиків. Зазвичай Фьодор прораховував кожен крок, але цього разу дозволив цікавості взяти гору й прокрався ближче до промовця.\n\nПідійшовши, він розчув щось про фашистську сутність Сибірського плану. Та більше його непокоїло дедалі більше озброєних чоловіків із нарукавними пов'язками Чорної Армії. Дві групи почали перекрикувати одна одну, вимагаючи покласти край авторитарному курсові економіки Вільної Території. Стоячи серед збитих докупи мас, Фьодор побачив, як назріває сутичка, і поспішив утекти, не забувши дорогою запустити руки в кілька кишень. Вони ж не заперечуватимуть, правда? Що може бути менш авторитарним, ніж віддати свої речі нужденним?"
 SBA.65.a: "Сибірський план - необхідне зло."

 SBA.66.t: "Територія робітників"
 SBA.66.desc: "«Я не знаю, як керувати фабрикою, Алієве! Звичайні люди такого не вміють!» Жінка розпачливо ляснула себе долонями по боках. Вона любила Алієва - він був її першим і єдиним коханням, - але, Господи, як же він часом діяв їй на нерви. Двадцять років із чоловіком кого завгодно до такого доведуть. Її чоловік лише пирхнув і поклав записи з Асамблеї на обідній стіл. Похитавши головою, він рушив до спальні й скинув черевики біля дверей. Вона перехилилася через стіл і пробігла очима нотатки. «Пьотр справді це сказав? Алієве, ти ж розумієш, що для нас це не перемога? У тебе вже півтори дитини!» Вона погладила округлий живіт. Одна річ - чоловік, відповідальний за господарство, а от керувати цілим робітничим кооперативом, покликаним кинути виклик індустріяльній могутності сходу й заходу, було просто неможливо.\n\nАлієв повернувся на кухню, краватка вільно висіла на шиї. «Сибірський план був катастрофою, Анастасіє! Ти досить розумна, щоб це розуміти! Він розтоптав права робітників заради безпеки. Безпеки, яка, до речі, так і не настала. Просто поглянь, де ми тепер».\n\nАнастасія потерла чоло. Чому її чоловік такий упертий? Не все є ідеологічною боротьбою; часом політична сторона рішення важить набагато менше за практичні наслідки. «Алієве... у цьому домі гасатимуть двоє дітей. Я сама не впораюся. Я розумію, що для тебе це все, для мене теж, але не все у світі - битва». Вона підвелася, підійшла до чоловіка й поцілувала його в щоку.\n\nАлієв обміркував її слова, сперечаючись сам із собою. «Анастасіє, кохана, ти ж знаєш, я зроблю для тебе все. Я лише хочу кращого світу для наших дітей». Дружина зітхнула й повернулася на місце. Гаразд, подумала вона, але якщо все вибухне, вона залишає за собою право кепкувати з нього."
 SBA.66.a: "Уперед, разом!"

 SBA.67.t: "Візит ввічливости"
 SBA.67.desc: "У гамірливому Новосибірську люди не бачать людей. Звісно, вони їх бачать, але не такими, якими ті є. Бачать шуби й шапки, а не тих, повз кого проходять. Така вже природа метрополії, навіть в анархістському суспільстві. Тіхомірові це не подобалося. Невже люди від природи ненавидять одне одного? Успіх Вільної Території довів, що людям не байдуже до інших. Так він казав собі, тремтячи біля найжвавішої крамниці міста, яку зміг знайти. Він не зважав на перехожих, поки встановлював свій столик, і не переймався, що ніхто не запитав, навіщо він із плакатом стоїть перед крамницею посеред сніжного вечора. Він знав: щойно ятка буде готова, вулиці заповнять черги охочих допомогти.\n\nМинали години. Тіхомір сьорбав каву, щоб не змерзнути, а люди йшли повз. Він дивився на всіх, намагався їх помічати, щоб побачити, чи помітять вони його. Місто якось зачаровувало людей: вони думали лише про те, куди йдуть і що треба купити. Може, їм просто потрібен невеликий поштовх? Кожній суспільній зміні потрібен поштовх. «Добрий вечір! Я збираю підписи для благодійної справи нашої комуни».\n\nЖінка, явно роздратована, але не охоча до суперечки, всміхнулася. «О, це дуже шляхетно, бажаю успіху». Вона спробувала піти далі, та її зупинила міцна чоловіча рука.\n\n«Розумієте, пані, це місто й багато інших уразила небезпечна хвороба - нехтування та бездіяльність! Поки ми насолоджуємося зручностями мирного життя, чимало наших товаришів борються за життя на фронтирі. Я вважаю нашим обов'язком допомагати братам і сестрам, звідки б вони не походили!» Жінка відсахнулася, очевидно нажахана. Вона озирнулася в пошуках підтримки, когось, хто визволить її з рук чоловіка посеред майдану, але всі й далі байдуже йшли своїми справами. Вона насупилася не через власне становище, а тому, що ніхто його навіть не помітив. Жінка звела брови й знову повернулася до чоловіка за столиком."
 SBA.67.a: "«Чим я можу допомогти?»"

 SBA.68.t: "Читання при свічці"
 SBA.68.desc: "Мати Яні нахилилася до хлопчика й поцілувала його в чоло. Яня, з розкуйовдженим і брудним темно-каштановим волоссям, сяяв від щастя. Він іде до школи! Ну гаразд, не до справжньої школи, куди ходять Міша і Ґлєб. Вони мусили вставати надто рано й зникали майже на цілий день. Яня не міг би ходити до їхньої школи, навіть якби хотів: родині потрібна була його допомога на господарстві. Він же головний годувальник коней! Дуже поважний титул, запевняла мати. Проте з таким важливим титулом далеко в житті не зайдеш - насамперед треба було навчитися читати.\n\nМати відчинила двері, побажала синові успіху й майже виштовхнула його в сибірську пустку. Яня трохи постояв на ґанку, просто дивлячись на зорі. Він хотів більше про них знати. Як вони туди потрапили? Хто розставив їх на небі? Може, сьогодні на уроці він це довідається. Яня йшов селом повз будинки сусідів, чиї діти затишно спали в ліжках. А він не хотів спати: він уже великий хлопчик, і час відбою щойно скасували в ім'я держави! Е-е... чи проти держави? Яня не дуже розумів, що таке держава. Цікаво, чи є держави в зірок і чи мають вони час відбою.\n\nЯня постукав у дубові двері будинку Попових. За кілька секунд вони розчинилися, й на порозі з'явилася пані Попова у фартусі. «Привіт, Яню! Рада, що ти прийшов! Інші хлопці вже в їдальні. Давай зніму твоє пальто». Коли вона розстебнула ґудзики, з-за пазухи випав прямокутний предмет. «Що ти приніс, Яню?»\n\n«Це книжка! Я навчуся читати!» Хлопчик широко всміхнувся літній жінці й помчав до однокласників."
 SBA.68.a: "Щоб вести за собою, спершу треба навчитися читати."

 SBA.69.t: "Що каже етатист?"
 SBA.69.desc: "Учителювання було природним покликанням Ніколая. Багато хто йшов у нього заради статусу або тому, що вчителями були їхні батьки, діди й прадіди. За царських часів дехто стогнав і нарікав, коли заможні батьки обдаровували його привілеєм примусової освіти. Уявіть таке сьогодні: росіянин бореться й лається, бо мусить учитися. Більшість людей убила б за саме вміння читати. Саме тому Ніколай і займався цим: його захоплювали люди та їхня нескінченна жага до знань. Навіть у найгрубішого солдата Чорної Армії були питання - саме вони зберігали в ньому людину, навіть коли він розстрілював ворогів.\n\nКоли Генеральна Асамблея закликала вчителів і всіх охочих ними стати, Ніколай одразу відгукнувся - і так опинився в Канську, місті, що з пульсівного серця Території перетворилося на звичайне місто. Ніколая жахала перспектива, що місто революції загубиться в історії, тому він вирішив зробити його однією з головних тем щоденних уроків.\n\n«Пане Жолдін!» - вигукнули учні, коли він увійшов до класу.\n\nСкромний учитель одразу взявся до справи: підняв крейду й намалював на дошці серп і молот. «Серп і молот. Символ не лише Бухаріна, а й Яґоди. Окремо ці знаряддя нічого не означають, але що вони уособлюють разом? Звичайні знаряддя робітника, об'єднані в одне. На перший погляд це звучить як символ, довкола якого нам варто згуртуватися. Однак...» Ніколай зробив драматичну павзу, змусивши учнів відірватися від нотаток і зустрітися з ним поглядом. «Це яскравий приклад того, чого нам слід остерігатися найбільше. Держава вдягатиме різні шати, щоб обманом перетворити вас на своїх маріонеток. Є лише один символ свободи - народ, що взявся за руки. Іншого немає»."
 SBA.69.a: "Добре їх навчіть - і все буде добре."

 SBA.70.t: "Народна міліція"
 SBA.70.desc: "Товариш Валєнтєєв неохайно поставив підпис на останньому аркуші з купи, що хитко височіла на столі. Схвалення, відмови, запити на поповнення - Валєнтєєв розбирався з усім. Більшість генералів ненавиділа бюрократію, і Валєнтєєв певною мірою теж.\n\nВін стягнув товсту пачку паперів гумкою й хотів кинути її до скрині, яку секретарка забирала наприкінці дня, але скрині не було. Він знизав плечима: байдуже, все одно проходитиме повз її стіл. Підвівшись і затиснувши папери під пахвою, Валєнтєєв вийшов із кімнати. Одразу почувся сміх. Не щось нечуване, та для канцелярії незвичне. Валєнтєєв пішов коридором і повернув ліворуч, уже розбираючи голоси з приймальні. «Бачиш? Шрам. Після кількох кампаній таке буває. Якось я застрелив червоноармійця з трьох кілометрів - доволі вражаюче». На стіл сперся новобранець, що допікав смертельно знудженій секретарці. Було ясно: він робив це вже довго й без найменшого успіху.\n\nВалєнтєєв неквапно підійшов і гепнув папери на прилавок. «Добрий вечір, товаришу. Чув, ви застрелили когось із трьох метрів!» Розгублений новачок забелькотів пояснення, та Валєнтєєв засміявся й підняв руку. «Ні-ні, це надзвичайно вражає! То покажіть цій прекрасній пані свою стрілецьку майстерність». Валєнтєєв вихопив пістолет і сунув хлопцеві в руки. «Стріляй у мене. Впритул». Усмішка зникла, він уп'явся хлопцеві в очі. Той довго стояв і тремтів, а тоді впустив пістолет. Валєнтєєв підняв зброю й повернув у кобуру. «Я так і думав. Слухай, хлопче, в армії не дівчат підчіплюють. Твій обов'язок - захищати свою комуну, і тільки. Я був готовий віддати життя, щоб довести свою думку; те саме присягає зробити кожен чоловік і кожна жінка Чорної Армії. Якщо ти не здатен, раджу зібрати своє лайно й забиратися». Валєнтєєв кивнув секретарці, поправив кашкета й швидко вийшов, лишивши приголомшеного новобранця блідим як смерть."
 SBA.70.a: "Солдат має бути відданим лише своїм братам."

 SBA.71.t: "Лише найкращі з найкращих"
 SBA.71.desc: "Командир, як він любив себе називати, Андроній Мішурєнко міряв кроками навчальний полігон, поки його рота долала Мішурєнкову смугу випробувань. Сам генерал описував її так: «Мета - відсіяти гарматне м'ясо від чоловіків, які на щось згодяться». Одні називали її жорстокою, інші - легкою прогулянкою. Ті ж, хто насправді проходив милю свинячим лайном, мали для неї власне слово: пекло. Мішурєнка це веселило, й він лаяв їх за скарги: вони ж не бачили жахів Вермахту, які бачив він.\n\nМішурєнко придивився до одного новобранця, сина охоронця сумнозвісного короля Рюріка. Хлопець рвався виконати завдання й не осоромити батькової спадщини. Тепер запалу в ньому явно поменшало. Він стояв зігнувшись і намагався віддихатися біля гірської ділянки виснажливого відбору. Старий генерал підняв із землі камінь, потім іще два. Підійшов до хлопця, який, побачивши його, заметушився на стіні; дорогою генерал підкидав камінь у руці. «Подобається перепочинок?» - гукнув він.\n\n«Ні, пане! Я-я не відпочивав! Я просто...» Що б хлопець не сказав, якщо взагалі сказав, слова заглушив глухий удар каменя.\n\n«Тепер ще й брехатимеш мені? Не знаю, яке лайно терпіли у вашій середньовічній казковій країні, але тут начальству не брешуть!» Мішурєнко пожбурив другий камінь, поціливши хлопцеві в ногу.\n\nНовобранець із почервонілим від напруги обличчям скрикнув: «Вибачте, пане! Я лізу, пане!» Побачивши, що в командира ще лишилися набої, хлопець хутко здолав решту перешкоди. Мішурєнко всміхнувся, показавши гнилі зуби. Навчиться. І колись, мабуть, навіть стане добрим солдатом."
 SBA.71.a: "«Так точно, пане!»"

 SBA.72.t: "Даси палець - відкушу руку"
 SBA.72.desc: "Мішурєнко нудьгуючи підпер обличчя долонею. А може, це була не нудьга, а недовіра? Найімовірніше, і те, і те. Він мав важливіші справи, ніж слухати якогось вискочку з вищої ліги, що вважає себе кращим за кожного, хто будь-коли служив. Мішурєнко дивився на нацистів так близько, що бачив білки їхніх очей. Він їв собак. Він бачив жорстокість нацистської воєнної машини. А що знав Валєнтєєв? Воював із фінами - слабким і жалюгідним народом. Від думок Мішурєнка відірвав голос Валєнтєєва.\n\n«Андронію! Ти хоч слово чуєш?» - гаркнув Валєнтєєв і клацнув пальцями просто перед обличчям старого, повертаючи його до тями.\n\nМішурєнко відмахнув руку. «Так! Я вислухав усі твої припущення й теорії! У цих чотирьох стінах твої слова важать багато, але ти так відірвався від поля бою, що тільки й робиш, що будуєш тут здогади!»\n\nВалєнтєєв, щосили стримуючись, прошипів крізь зуби: «Я віддав цій боротьбі все життя. Ми обоє бачили, як у хаосі війни загинуло забагато молодих чоловіків. Я покликав тебе не сваритися, Андронію, а закласти основу, на якій покоління після нас продовжать боротьбу з державою». Він оцінив реакцію співрозмовника й зрозумів, що нікуди не просунувся. Тоді Валєнтєєв, завжди стратег, змінив підхід. Підсунув стілець, сів навпроти старого й зустрівся з ним поглядом. «Жоден із нас не піде, доки ми не визначимо доктрину майбутньої війни. Я напишу на папері одну річ, яку вважаю необхідною, тоді ти зробиш те саме. Коли складемо список, кожен викреслить один пункт іншого». Валєнтєєв почав, записавши потребу в автономії офіцерів. Мішурєнко підозріливо глянув на папір, але зрештою поступився й занотував, що повітряна підтримка обов'язкова. Наступну годину чоловіки по черзі писали все, що вважали необхідним для сучасної доктрини Чорної Армії, аж поки сонце сховалося за пагорбами."
 SBA.72.a: "Дві голови - один план."

 SBA.73.t: "Війна не така вже й славна"
 SBA.73.desc: "«Давай нагору», - гукнув командир відділення, підсаджуючи худорлявого Стєфана на машину. Той видряпався бортом і спробував зазирнути всередину, але дістав чоботом у лице.\n\n«Обережніше!» - гаркнув товариш по відділенню, переступаючи через новобранця на шляху до місця. «Ти що взагалі робиш? З усім цим спорядженням схожий на перекинуту черепаху». І справді, якого біса він тут робив? Це питання не відпускало Стєфана. Йому лише сімнадцять, зброї зроду не тримав, у тактиці нічого не тямив. Та брак військової теорії він надолужував історіями. Хлопець закохався в саму ідею героїзму, а що може бути героїчніше за армію?\n\n«Гей! - знову гукнув той боєць. - Так і тертимешся об борт чи переберешся сюди й даси залізти решті?» Стєфан кивнув і кинувся з одного боку бронемашини на інший, де стояли лавки. «То навіщо ти тут?» - запитав кремезний чоловік.\n\n«Ну, я, е-е...» Стєфан прокашлявся. «Мабуть, просто хотів допомогти?»\n\n«Ну так, допомагаєш ти до біса добре», - глузливо кинув досвідчений солдат. Стєфан мовчки опустив очі. «Та годі, я просто тебе підколюю. Ти звідки?»\n\n«Із Новосибірська. Мій батько...» - Стєфанові перехопило горло. «Коли на місто напали, він намагався підняти робітників своєї фабрики, щоб вони, ну, боролися за щось, а вони просто... застрелили його. Просто там».\n\nЧоловік поруч кивнув: ця історія була йому добре знайома. «Схоже, твій батько був хоробрим». Стєфан кивнув. Солдат поплескав його по спині: «Ти здаєшся добрим хлопцем». Він простяг руку в рукавичці. «Я Дановіч. Допоможу тобі тут освоїтися»."
 SBA.73.a: "Те, чого боїться держава: справжнє товаришування!"

 SBA.74.t: "Чого ми можемо навчитися"
 SBA.74.desc: "«Тут нічого не має сенсу». Пьотр Сіуда гримнув кулаком по столу. Документ із доречною назвою «Об'єктивний аналіз військового устрою Новосибірська» викликав у нього нудоту. Від Мішурєнка такого можна було чекати, але Валєнтєєв? Що найшло на чоловіка, якщо він підписав звіт, який вихваляв Алєксандра Покришкіна? Пьотр недовірливо відкинувся у кріслі. «Серйозно, товариші, невже я мушу пояснювати вам, що цей владолюбний... цей етатист... цей...» Пьотр шукав у голові ще гостріших слів про генерала, але не знайшов. Він тяжко зітхнув. «Просто не можу повірити в усе це».\n\nДвоє чоловіків у його кабінеті перезирнулися. Вони сперечалися на кожному кроці, але однаково оцінили те, що можна було перейняти у воєнної держави Новосибірська й застосувати в сучасному, вільному Новосибірську. Першим заговорив незворушний Мішурєнко: «Товаришу Сіудо, з усією повагою, ви ані чорта не тямите у війні». Валєнтєєв роздратовано ляснув себе по чолу. Боже, ну навіщо.\n\nПьотр нахилився вперед; недовіра швидко перетворювалася на лють. «Перепрошую?»\n\n«Товаришу Сіудо, - боязко втрутився Валєнтєєв, - Пьотре, моя ненависть до тиранії палає так само яскраво, як твоя. Їхні методи огидні й жорстокі». Валєнтєєв замовк, обережно добираючи слова. «Та це не означає, що ми не здатні перетворити погане на добре. Покришкін був військовим до кісток, тож лишив дуже докладні записи про свої улюблені способи ведення війни, особливо про повітряний бій, у якому ми відстаємо».\n\nПьотр обдумав пояснення Валєнтєєва. Двоє військових мовчки стояли перед героєм Вільної Території. Пьотр крижано зиркнув на Мішурєнка. «Якщо ми почнемо наслідувати державу, то чи варто дивуватися, коли самі нею станемо?» Він замовк. «Утім, я розумію вашу думку. Даю зелене світло. А тепер геть»."
 SBA.74.a: "«І спаліть його теж!»"

 SBA.75.t: "Холодна хатина"
 SBA.75.desc: "Композитор поволі сьорбав віскі зі склянки на столі. За вікном простягалася замерзла тундра пекла. Він ніколи не виходив надвір і не вийшов би, навіть якби від цього залежало його життя. Він покрутив склянку. Гіркий скотч. Саме для гіркого старого. Камов пропонував принести щось смачніше, але композитор щоразу відмовляв. Хворобливий чоловік підвівся з місця в їдальні й потягнувся до крижаної, тьмяно освітленої вітальні. Життя у вітальні було небагато: фарба лущилася зі стін, книжки вкривала цвіль. Єдиною живою річчю було фортепіяно, притулене в кутку, ніби воно ховалося від нещастя, що пожирало кімнату. Композитор дошкандибав до лави й сів, нависнувши пальцями над клавішами. Руки опустилися, щоб заграти.\n\nЙого перервав стук у двері. Композитор тихо засміявся. Як доречно. Шкутильгаючи до дверей, він усміхався: відповідати йому не належало, але він усе одно відповість. Тепер він розумів, чому ці люди постійно повстають. Це було приємно.\n\n«Дімітрі, - сказав чоловік на порозі, звертаючись до нього наче до дитини. - Ми знаємо». Упевненість зачепила композитора за живе й викликала усмішку. «Пишається собою?»\n\n«Заходьте». Старий повернувся й пішов у будинок, а гість рушив слідом. Композитор відсунув незнайомцеві стілець і сам сів навпроти.\n\n«Він тут?»\n\n«Хто? Камов?»\n\n«Отже, ви знаєте, навіщо я прийшов».\n\nКомпозитор закинув голову й розреготався. «Звісно, ви прийшли по гелікоптер. Не знаю, чому Камов думав, що зможе приховати таке створіння. Креслення в другій шухляді його тумбочки». Дімітрі схопив незнайомця за руку й зазирнув йому просто в душу."
 SBA.75.a: "«Зробіть щось добре, гаразд?»"

 SBA.76.t: "Знову винайти колесо"
 SBA.76.desc: "«Це не ракетобудування, Алєксєє, - засміялася Юлія, крутячи ключ у руках. - Усе так просто, що навіть якийсь старий українець додумався! Ходи поглянь!» Жінка зіскочила з «Тачанки-2», як Юлія називала цю купу брухту.\n\nАлєксєй похитав головою. «Усе набагато складніше, Юліє. Не можна просто причепити гармату до машини й вирішити, що роботу зроблено! Ти подумала про стабілізацію? Скільки вона проїде на одному баку?» Юлія закотила очі й почала ритися в одній із тисяч шухляд у гаражі. «Це серйозно! У тебе два дні, щоб завершити проєкт і показати його Раді Безпеки! Там не жартують, Юліє! Хтозна, що з тобою зроблять, якщо змарнуєш їхній час!»\n\nЮлія обернулася, стиснувши губи. «На твоє нещастя, ми цього ніколи не довідаємося. Ця штука працює, ясно? Я витратила на неї пів року, і, чесно кажучи, Алєксєє, якщо вона не їде, нехай Валєнтєєв підвісить мене за ноги». Тепер очі закотив Алєксєй, якому жарт подруги здався не таким смішним. «Не віриш? Сідай!» Молода жінка стегном засунула шухляду й зняла ключі зі стіни. «Лови!» Вона кинула їх приголомшеному хлопцеві, який займав усе зручне місце в гаражі, ледь не поціливши йому просто в обличчя.\n\n«Юліє, годі, це ж безглуздя! Я...» Алєксєй глянув на машину, тоді на ключі, а тоді на подругу. На обличчі з'явилася легка усмішка. «Якщо кажеш, що працює. Але якщо я правий, розповім Раді Безпеки всі твої таємниці, щоб вони могли тебе катувати!» Хихикаючи, Алєксєй побіг до пасажирських дверей."
 SBA.76.a: "«Вмикай передачу, Алєксєє!»"

 SBA.77.t: "П'єса на дві дії"
 SBA.77.desc: "Відколи зуби Стєпанова були такі білі? Чи завжди вони були такими? Валєнтєєв не міг сказати. Власне, чи бачив він Стєпанова усміхненим бодай раз? Напевне мав бачити, та хоч скільки перебирав спогади, не міг пригадати навіть тьмяного образу його зубів. Тепер іншого образу вже не знадобиться: читаючи документ, Стєпанов аж сяяв. «Мені подобається. Це ви двоє створили?» Він тицьнув товстим пальцем то у Валєнтєєва, то в Мішурєнка.\n\nПихатий старий покидьок Мішурєнко одразу приписав заслугу собі: «Проєкт склав я. Товариш лише засвідчив його своїм схваленням через звання».\n\nСтєпанов підняв брову й глянув на Валєнтєєва. «Це брехня. Товариш Альцгаймер не знає, про що говорить», - відрубав Валєнтєєв.\n\n«Дуже шляхетно - нападати на людину через її вік. Через її досвід. Я доблесно боровся за свободу проти нацистської тиранії й роблю те саме сьогодні», - похвалився Мішурєнко.\n\nСтєпанов похитав головою й зняв окуляри. «Мені байдуже, хто написав які слова. Важливо, що доктрина міцна. Добра робота - обох чи когось одного». Мішурєнко гордо вийшов із кімнати, його усмішка підняла обвислі щоки. Валєнтєєв спантеличено поглянув на Стєпанова, а той лише знизав плечима."
 SBA.77.a: "Нова доктрина для нової армії."

 SBA.78.t: "Досконала система"
 SBA.78.desc: "Товариш Нєстор нервово стукав ногою у приймальні. Оглянувши кімнату й переконавшись, що нікого немає, він витяг із наплічника маленький кинджал. Зробив на стіні зарубку поруч з іншими двадцятьма сімома - по одній за кожну апеляцію. Так було зручно рахувати, скільки разів корумпована Рада Безпеки його скривдила, а водночас посилати сигнал: люди не терплять урядів, що дбають лише про себе, особливо в цій частині Росії. Нєстор глянув на годинник. Уже будь-якої миті...\n\n«Нєсторе?» Світлошкіра секретарка визирнула з-за товстих білих дверей. «Асамблея готова вас прийняти». Асамблея? Вона обмовилася? Він домовлявся про розгляд апеляції Радою Безпеки, це точно. Так він робив двадцять сім разів, принаймні так йому здавалося. Після десятої вони почали зливатися докупи. Мабуть, секретарка помилилася: установи Ради Безпеки й Генеральної Асамблеї об'єднали під час переїзду до Новосибірська. Задоволений таким поясненням, Нєстор крекчучи підвівся, відчинив двері й увійшов.\n\n«Товаришу Нєсторе». Якщо це була Рада Безпеки, то за ніч вона збільшилася десь на сотню членів. «Сподіваюся, ви чекали недовго». Нєстор щось пробурмотів, відмахнувшись від їхньої турботи. «Отже, це ваша... двадцять сьома апеляція? Правильно?» Нєстор кивнув. «За вашим послужним списком ви цілком відповідаєте вимогам до офіцера. Ви хоробро билися з Червоною Армією в Монголії й відтоді невпинно обстоювали анархізм». Нєстор був приголомшений: його не лише не відкинули відразу - члени Генеральної Асамблеї наче щиро хотіли прийняти його. «Гаразд, тоді ставлю на голосування підвищення товариша Нєстора до офіцерського звання»."
 SBA.78.a: "Ухвалено одностайно!"

 SBA.79.t: "Навчання вчителів"
 SBA.79.desc: "«Оце, - Павєл високо підняв зброю, показуючи класові, - рушниця». Кімната не завмерла в захваті, як він сподівався. «І не просто якась рушниця! Це справжній автомат Калашникова зразка 1947 року, або АК-47. Хто знав, що означає „АК“, до того як я це сказав? Ну ж бо, підніміть руки». Майже всі інженери, митці й науковці неохоче підняли руки. «Годі брехати! Не може бути, щоб усі знали! Гаразд, брехуни, розберімо зброю на основні частини». Інструктор почав розбирати автомат на столі.\n\nУ задньому ряду колишній поет Яромір штовхнув плечем сусіда. «Гей, ти розумієш, навіщо ми тут?» Зосереджений на автоматі чоловік не відповів. «Гей». Яромір штовхнув його сильніше.\n\n«Просто дивися, що він робить», - огризнувся чоловік і далі порався зі зброєю.\n\nБоже, подумав Яромір, що не так із цими людьми? Невже вони так захопилися знаряддями руйнування, що забули про найважливіше - звичайну людську порядність? Він мусить викрити цю несправедливість, хай навіть дрібну. Яромір підвівся й виліз на стіл. «Люди Томська! Складіть зброю! Згадайте, за що ми боролися! За майбутнє! Ці машини вбивства - не знаряддя миру! Повстаньте! Не допомагайте ще глибше занурювати Землю у війну!» Важке дихання Яроміра було єдиним звуком у кімнаті. Присутні дивилися спантеличено й нишком молилися, щоб бідоласі хтось допоміг."
 SBA.79.a: "«Е-е, на чому ми зупинилися?»"

 SBA.80.t: "В оточенні з усіх боків"
 SBA.80.desc: "Євґєнія Таратута порожньо дивилася у вікно великого кабінету Пьотра Сіуди. Величезні багряні штори, акуратно зібрані з обох боків широкої шибки, контрастували з переважно білим оздобленням кімнати. Це пасувало Пьотрові, хоча вона й вважала кабінет трохи... завеликим для нього. За роки поруч із Сіудою Євґєнія добре засвоїла: сам чоловік був безперечно більшим за життя. Її споглядання перервав цокіт чобіт по кахлях. Прийшов Пьотр.\n\n«Вибач, Євґєніє. Затримався на Конгресі. Сподіваюся, ти чекала недовго?» Пьотр зняв пальто й повісив біля столу.\n\n«О ні, Пьотре, не переймайся. Я просто милувалася краєвидом», - відповіла вона, й далі дивлячись на місто.\n\n«Є чим замилуватися, правда?»\n\n«Знаєш, Пьотре, дивлячись звідси за обрій, я дещо розумію. Увесь світ хоче нашої смерти».\n\n«О, Євґєніє, - Сіуда став поруч, - там є не лише ненависть. Є люди, що дістали більше свободи, ніж будь-коли, люди, які не жахаються, а радіють можливості виховувати дитину в новому суспільстві! Водночас стільки людей досі живе під чоботом авторитаризму». У відбитті шибки Євґєнія побачила, як напружилося його обличчя. «Навіть якщо вони хочуть нашої смерти, це лише означає, що ми робимо щось правильне, те, у що віримо».\n\nЄвґєнія всміхнулася й торкнулася його щоки. «Ти добра людина, Пьотре. Ти зробиш багато добра»."
 SBA.80.a: "Попереду ще багато добрих справ."

 SBA.81.t: "Міжнародний рух"
 SBA.81.desc: "Євґєнія поправила спідницю, схрестила ноги й дала Раді Безпеки прочитати свою пропозицію. Більшу частину політичної кар'єри в Росії вона закладала основи цього агентства - свого агентства. Усе життя Євґєнію переслідували сумніви: що вона не здатна керувати, не здатна виконати навіть найпростішого завдання - лише через стать. Це не тільки зробило її однією із засновниць Вільної Території, а й дало незрівнянну далекоглядність. Вороги Росії були не лише за Уралом чи в порту Маґадану. Ворогами анархізму були світові наддержави, що прагнули зберегти статус-кво. Щоб Вільна Територія вистояла, міжнародною загрозою слід зайнятися насамперед.\n\nЧоловіки перед нею перемовлялися й показували ручками на окремі рядки пропозиції. Євґєнія порушила тишу: «Сподіваюся, вас усе влаштовує?»\n\nСтєпанов зняв окуляри. «Дванадцята сторінка особливо мене зацікавила, пані Таратуто. Ви пишете, цитую, що члени цього агентства присягають за всяку ціну захищати продовження революції. Можете пояснити?»\n\n«Я знала, що ви запитаєте, товаришу Стєпанов. Твердо переконана: головним пріоритетом цієї організації має бути допомога нашому хрестовому походові за визволення народів Росії. Це також означає захист уже наявних комун. Найбільшою загрозою, товаришу Стєпанов, з огляду на мій досвід роботи із сусідніми державами, я вважаю міжнародні сили. Вони зроблять усе, щоб знищити цей експеримент і підкорити його своїй волі. Ми мусимо підірвати їх раніше, ніж вони підірвуть нас»."
 SBA.81.a: "«Маєте наше схвалення, Євґєніє. Щасти вам»"

 SBA.82.t: "Боротьба з найпомітнішим ворогом"
 SBA.82.desc: "«Ви бачили, що коїться на сході, товаришу Стєпанов?» Євґєнія прикусила губу, стримуючись. Щойно цей чоловік насмілився сказати, що її проєкт міжнародного агентства, за його словами, «сповнений запалу, та хибно спрямований». Він анітрохи не знав, що відбувається на Далекому Сході, але мав нахабство говорити з нею, наче з неслухняною дитиною. Вона була готова розірвати Стєпанова на шматки, та роки дипломатичного досвіду навчили стриманости.\n\n«Там наші найлютіші вороги, товаришу. Біла армія гарцює на конях і вихваляється якимось царем, якого вони викрали з далекої країни, наче минулого століття не було. Голова Яґода, якого ми всі напевне добре знаємо, влаштувався неподалік від нашої початкової бази в Канську. Не кажучи вже про справжніх фашистів, що намагаються поширити нацистську заразу зі сходу. Казати, що ми повинні спрямувати увагу назовні, товаришу Стєпанов, - образа всього, за що ми боремося. Так, ми досягли значних успіхів, це правда, але все може зникнути з дзенькотом однієї гільзи, якщо ми змарнуємо гроші й ресурси на безплідні авантюри в Америці!» Євґєнія задихалася. Оце так дипломатична підготовка.\n\nНа щастя, перш ніж Стєпанов устиг відповісти повчанням, втрутився Пьотр. «Щиро дякую, Євґєніє. Гадаю, від імени всіх присутніх можу сказати, що ви поставили інтереси сибірського народу на перше місце»."
 SBA.82.a: "Спершу владнаймо проблеми вдома, а тоді звернімося назовні."

 SBA.83.t: "Белла чао"
 SBA.83.desc: "Марія Пєдєнко зійшла з літака, притримуючи величезний червоний капелюх. Блискуча синя помада підкреслювала її бездоганно білі зуби. Вона глибоко вдихнула тепле середземноморське повітря. Як же їй пощастило з цим завданням. Усі ті нічні чаювання з Євґєнією нарешті окупилися. Підбори Марії цокали по летовищу; вона йшла цілеспрямовано, але передусім із запалом. Як тут не покрасуватися? Коли їй іще випаде нагода вдягнути сукню? Марія поклала до рота жувальну ґумку, дістала із сумочки сонцезахисні окуляри й надягла їх. На правій лінзі був маленький знак - літера «А», перекреслена прямою лінією. Їй наказали знайти коло з таким самим символом, чекати там і гортати книжку. Місце вона знайшла миттю й витягла книжку із сумочки.\n\n«Ви тут сама?» - запитав чоловік у шкіряній куртці, тримаючи руки в кишенях.\n\nМарія глянула на нього крізь окуляри. «Ні, я приїхала з матір'ю».\n\n«Радий, що ви дісталися. Сподіваюся, політ минув спокійно. Напевно, щасливі вирватися з тундри?» Марія зняла окуляри й розпустила волосся."
 SBA.83.a: "«Я рада взятися до роботи, Марко»"
 
 SBA.84.t: "Подорож на схід"
 SBA.84.desc: "«Усе взяв?» - Єґор застебнув куртку аж до підборіддя.\n\n«Схожий на надуту повітряну кулю», - глузливо кинув Руслан, закидаючи наплічник на плечі.\n\n«Ой, як смішно. Я міг би перелічити все, на що схожий ти, але найгірше те, що ти схожий на самого себе», - відрубав Єґор.\n\n«Якщо так буде всю місію, я просто штовхну тебе в найближчий замет».\n\n«Це буде неважко, Чіта цієї пори року не тропічний рай». Єґор узяв речі й рушив до дверей. «Та відпочивати нам майже не доведеться. Знаєш, там є справжні царисти? Ось кого нам треба саботувати. Утім, вони вже самі себе саботують, тримаючись за цю мертву ідеологію»."
 SBA.84.a: "Вирушаймо захищати анархію!"

 SBA.85.t: "Малі вогники горять найяскравіше"
 SBA.85.desc: "Яскраво-помаранчевий - ось колір кохання. Одні скажуть, що це темний, пристрасний червоний, інші - глибокий синій, здатний позмагатися з найтемнішими океанськими западинами. Кохання - не веселка кольорів, складена з прожитих років, навчання, нестримних сліз і крику на весь голос. Кохання - не зібрання пережитого. Кохання - іскра, дика й люта істота, що починає битися в людському серці тієї миті, коли людина бачить когось. ТУ саму людину. У ту напружену мить першої зустрічі мозок захоплено, усі відчуття відкинуто геть. Та кому вони взагалі потрібні?\n\nКохання - біль. Побита й зламана істота, яка надто довго страждала у твоєму животі. Вона прагне свободи, дива, втечі з клітки. Та лишається спокійною і слухняною - кохання.\n\nКохання - порушена обіцянка. Ревнива й озлоблена істота, втомлена терпіти неіснуюче лайно. Вона роздирає собі груди, вириває серце, що б'ється, і вимагає від коханої людини розтрощити його об землю й відвернутися, поки уламки розлітаються за вітром.\n\nКохання - прощення. Розкаяна й жалюгідна істота, яка забиває органи вибаченнями, щосили виштовхуючи їх до горла.\n\nКохання - це одна мить. Момент зв'язку між двома людьми, який визначає шлях усього їхнього життя. Вони можуть думати, що знають кохання, та ніхто не відчує його, доки воно саме не дасть про себе знати."
 SBA.85.a: "Понад усе кохання перемагає."

 #SBA.86.t: "A Conflict of Interest"
 #SBA.86.desc: "Stepanov tore the jacket off of himself, it was too damn hot in this room, a sentence seldom said in Siberia. He removed the cap from his head, smoothing his few remaining hairs over. He observed himself in the mirror adjacent to the entrance to his dacha. He grabbed at the fat on his stomach, pulling at it. He dropped his shoulders. He was getting far too old for this. How long had he been fighting? How long had he been acting? How long was he going to wait? The general shook the thoughts from his head, it was a long game worth playing, nobody who ever rushed to power stayed in. As he walked to his bathroom he let out a groan, his knees were giving out on him, too little years spent charging into battle and far too many spent planning them. Ivan turned on the faucet, still hung up on the conundrum that had plagued him for years. On the other hand, those who waited for power did not get long to enjoy it. Stepanov cupped the cool water in his hands and brought it to his face.\n\nThree knocks came from the door. Stepanov sighed, letting his head lean against the wall. What could it be now? Begrudgingly, Stepanov returned to the door and answered it. Before him stood exactly what he pictured, a scruffy kid. Was it so much to ask for just for people to act like people? "What do you need?"\n\n"Good evening Comrade Siuda, I apologize for my tardiness, I just enlisted! I came from out east, still getting myself acquainted." Stepanov raised an eyebrow to the man, he knew naivety, he could see it from kilometers away, taste it in the air. He loved it. The recruit let out a nervous chuckle to fill the awkward silence. "I had a message for you from Comrade Valenteev. He told me to tell you he would have radioed in himself but their only one broke in the middle of their expedition. They have orders to go Tatarsk but-"\n\n"They have orders to go to Lesosibirsk, that's what I told Valenteev," Stepanov interjected, "I am very tired, it's late. You have your orders. Run along now." Stepanov quickly slammed the door on the soldier's face. Well, he thought, maybe it would all pay off in the end."
 #SBA.86.a: "The long game is the one with the largest prize."
 
 #SBA.87.t: "The Shot Heard Around the World"
 #SBA.87.desc: ""I trust you retrieved the information I requested?"\n\nMarko just returned from Novosibirsk, from civilization, finally back to the cold and somber wilderness. He was honoured to be chosen to serve under Comrade Valenteev, even in the frozen huts of the far east, he had heard the stories. Valenteev was uncompromising but passionate, not just bitter like the assholes where he came from. He fought for what he believed in, that was something Marko could look up to in a commander. He was not only willing, but eager, to lay down his life for Valenteev, for his commune. God it felt so good just to have a purpose. Marko did not see combat however, he saw his Comrades set up tents as he climbed in the truck. He had never met Comrade Siuda but his name was unavoidable. When Dimitri gave him the address of the commander of the Black Army, he felt giddy to meet Comrade Siuda, but found him irritable.\n\n"Of course, Comrade Valenteev. We are under orders from Comrade Siuda to go straight to Lesosibirsk."\n\nValenteev furrowed his brow, "Seriously? That's what he said? Well then," Stepanov took the googles from his forehead and pulled them down over his face. "Let's go."\n\nArriving in the commune of Lesosibirsk, Marko could immediately sense something was amiss, the way people poured out of their houses, standing outside and just... staring. Valenteev was visibly uncomfortable. He spoke to one of the members of the commune, something Marko couldn't really hear. He tried to claw his way to the front of the pack to stand next to Comrade Valenteev. Why had they sent so many people? By the time he reached his commander, there was shouting. Whomever Valenteev was speaking to had drawn his weapon. The people on their front lawns holstered weapons of all kinds as well, shotguns, rocks, bottles, whatever. Valenteev began to back away, but the crowd was too rowdy. Someone, in the crowd of Black Army soldiers, or from the commune fired. Marko knew he had to act and charged forward, slamming Valenteev to the ground."
 #SBA.87.a: "It all falls down."
 
 #SBA.88.t: "The Joys of Fine Dining"
 #SBA.88.desc: "The room seemed as if it were alive. Men threw their heads back in laughter, in hysterics at jokes that only friends would understand. Candles adorned the shelves of the walls, giving the room a golden glow, sat nestled awkwardly between the antiques and knick-knacks that occupied the space the other 364 days of the year. The beating heart of the room was found at the center, a wall of men surrounding him, hanging on to his every word. Pyotr Siuda's booming voice was unmistakable.\n\n"So I have Kilchichakov standing beside me, reeks like dead deer and alcohol, I'm trying to not puke up that morning's food, although it would've looked the same as it did as when I ate it when it came out! Am I right? I know you've seen that stuff! Anyways, he's trying to tell me, he says, 'Pyotr, I think I hit a deer on the way here.' and I turn to him and say, keep in mind he stinks like death itself, and I say 'Oh no! That was just Mishuernko wandering out of the mental facility again!'" The table exploded into laughter, save for the man at the head of the table who's mind was fixated on the drink before him.\n\nSuddenly, the door to the tavern threw itself open. "Comrades! Comrades! Where is Pyotr?!"\n\nSiuda pushed his chair back and stood, his demeanor quickly shifting from jovial to serious. "What is it? I am here."\n\n"I don't know. I don't know! I just, I just was out hunting, out northwards you know? I saw the Black Army, t-they were just all in this massive formation in the city square. I didn't think much of it and continued on my way, but I heard shots and men stared falling!" As the exhausted man sturggled to catch his breath, Pyotr turned to his ally Stepanov, hoping for solidarity, but found the man unbothered, smiling as he sipped his drink."
 #SBA.88.a: ""What were you saying, Pyotr?""
 
 #SBA.89.t: "What Can't Be Reclaimed"
 #SBA.89.desc: "The Security Council was seldom as packed as it was. One would imagine that with the sheer amount of people, the room was alive with voices.\n\n"Before you, I have made copies of memorandum 91703. This message, relayed from Mr. Siuda-"\n\n"You'll stop right there Ivan. I've given far too much to sit here and have you badger me! You have no idea how man-"\n\n"People of this territory, I hope you had been paying attention, I had said nothing against Mr. Siuda and yet is he already prepared to blow his top!"\n\n"Don't bullshit me! I know exactly what this is!" Siuda bellowed from his seat.\n\nStepanov carried on, undisturbed. "The message before you never got to Comrade Valenteev. So Valenteev sends a messenger. Mr. Siuda tells the messenger that Valenteev is required in Lesosibirsk. He repeats this multiple times. They must go to Lesosibirsk. And so they do. While there, fighting broke out between the local population and the confused regiment. Eight dead. Countless wounded." The room was silent, but if looks could talk, the room would be unbearably loud. Siuda held his head high, eye level with the people, his brothers and sisters, who had come out in droves to support him. He reminded himself to not look at the seemingly increasing number of soldiers in the room as well. "Before us, we have a hot headed child, not someone fit to lead us into the greatest struggle we will ever face. I cannot, in good faith, allow Mr. Siuda to guide the most important of battles. I beg this body to put the people first and remove Mr. Siuda immediately." The members of the Security Council shared nervous glances between each other, there was not one "people", as Stepanov referred too. The Free Territory had instead split between two increasingly threatening camps; the people and the army."
 #SBA.89.a: "We need calm, rational thinking. I'm sorry young Comrade."
 #SBA.89.b: "The people demand freedom and you offer them a dictatorship, Mr. Stepanov!"
 
 #SBA.90.t: "A Loveable Dictatorship"
 #SBA.90.desc: "Pyotr Siuda wanted to go down kicking and screaming. That's how he always pictured it, there was no alternative. He would either die accompanied with his closest allies for something they believed in, for something good! If not, he would be there when Russia as a whole was liberated from the state. Somewhere deep within his heart, somewhere where even he could not find it, what Pyotr wanted nothing more was to die free, to not share the same fate as his father or his father before him. Siberia was cold and unforgiving, it was something he learned at a young age and kept with him all his life. It was a place that cared little for want or wishes. Siberia delivered.\n\nSiuda, the caged anarchist, paced around in the back of the transport vehicle. Shackles followed him, rattling, reminding him he was enslaved, taunting him, their metallic jingle a cruel laugh. How funny. An anarchist locked in a box. Very funny indeed Ivan. Pyotr was often called an annoyance by his contemporaries, he didn't see it that way. He saw through their posturing. They were scared. Scared of what he had accomplished, something that he had set in motion, even if he would rot in prison, his message had been made and the world would never be the same. However, if his reputation was an annoyance, might as well live up to that. He pounded on the glass separating the rear of the vehicle.\n\nIn response to Pyotr's commotion, the driver simply turned on the radio. Playing was some sort of announcement from Stepanov. "Comrades of the Free Territory! Today, my heart breaks. We have already experienced a turbulent preceding days and further tragedy has befallen our people. The transport vehicle of Pyotr Siuda, while traveling from Novosibirsk to Kansk, was lost." Pyotr's heart stopped. "I do not have all the answers, but I am committed to living up to the legacy of our honoured Comrade." Realization began to set in, prompting Pyotr to scream and continue to pound on the divider between himself and the driver. Between himsef and death."
 #SBA.90.a: "A bright light, extinguished."
 
 #SBA.91.t: "We Offer No Quarter"
 #SBA.91.desc: "It's better to have loved and lost then to have never loved at all, that's how the phrase goes. It's supposed to be inspirational, it's supposed to give a lazy bum the kick in back to do what they were always afraid of. Stepanov wasn't quite sure if he was afraid of the people. There was no confusion, he certainly didn't like them, but was he afraid of them? Did he hate them? That question was more nuanced, and certainly not the one General Ivan Stepanov pictured he'd be thinking as men and women alike kicked at his ribs.\n\nHe couldn't hear much, maybe because his head had been savagely beaten, maybe because he didn't want to. Stepanov built his head like a fortress, locking himself in and others out. For decades, that was how he lived, a constant inner monologue with himself, planning his eventual assault from the fortress. The moment he let the drawbridge down to charge is the moment his castle crumbled. He had waited so long. Put up with so much "Comrade" this and "stateless" that. Who gave a fuck? He certainly didn't. All that preparation all to hear the Security Council utter those simple words. Yet, the only thing Stepanov heard were the chants of the raging crowd before him.\n\nStepanov the general died in the Security Council. Stepanov the schemer died as the people saw through his act. Stepanov the bloody and broken would die at their hands. Siuda was saying something, of course he was, but Stepanov didn't care to listen. He chose to watch. Watch as his men anxiously hovered their hands over their guns, looking at each other for support. Shoot! He screamed at them through his eyes, do something! He felt the rope slither around his neck. His eyes softened, a command to a plea, a plea to scream and a scream to nothing."
 #SBA.91.a: "All that scheming for nothing."

 SBA.92.t: "Чорна сукня"
 SBA.92.desc: "Весілля, давно заплановане й очікуване більшістю гостей, як і личило території Чорної Армії, виявилося анархічною справою.\n\nНаречені прибули першими. Обох відпустили з міліцій їхніх комун, і обидві були в однакових чорних сукнях із символом Армії. Убрання вправно переробили, щоб рушниці було зручно носити на перев'язі.\n\nДругим прийшов «священник» - його ряса була забруднена, а пістолет-кулемет подряпаний після денних навчань з окопування. Третіми з'явилися гості: кожен став позаду нареченої зі своєї комуни й ніс на собі сліди щоденної служби в міліції.\n\nХоч комуни й погоджувалися, що проти зовнішніх ворогів треба діяти разом, між ними панувала велика напруга. Її відклали лише настільки, щоб не зіпсувати особливу мить для їхніх доньок. «Священник» швидко провів церемонію, наречені обмінялися клятвами - Чорній Армії та одна одній - і скріпили їх поцілунком.\n\nТа щойно церемонія завершилася й винесли алкоголь, вигуки радости змінилися лайкою, а давні суперечки спалахнули знову. Один гість замахнувся на чоловіка з іншої комуни, а той вивихнув йому руку. Священник поцілив пляшкою в гуляку й збив його з ніг. Почалася загальна бійка, хоча всі пильнували, щоб не застосовувати зброї. Зрештою, вони були союзниками по анархізму.\n\nКоли одна з наречених зламала ніс кузенові своєї нової дружини, вона весело засміялася й допомогла йому підвестися, знаючи, що ще багато років вони разом битимуться проти ворогів своїх комун."
 SBA.92.a: "І справді дивне весілля."
 
 SBA.93.t: "Добробут для всіх"
 SBA.93.desc: "Зали Генеральної Асамблеї, як завжди, були переповнені: невпинний потік людей з усіх верств приходив поскаржитися чи подати пропозицію. Та цього дня серед них було чимало членів войовничої Костінської спілки, які вимагали негайної зустрічі з Радою Безпеки.\n\nРада Безпеки, звісно, погодилася. Бригадир Віталій Костін почав ретельно завчену промову.\n\n«Від імени робітників Центрального Сибіру ми вимагаємо негайно скасувати мілітаризацію Сибірського плану, адже тепер регіон живе в мирі й Вільній Території ніщо не загрожує. Квоти слід негайно знизити, а виробництво відвернути від військових потреб. Певен, ви не заперечуватимете?»\n\nПершим заговорив Сіуда: «Звісно ні, товаришу Костін. Народ Сибіру заслуговує на добробут, особливо після всього пережитого, й, певен, усі тут погодяться». У кімнаті тихо загомоніли на знак згоди, та Іван Стєпанов заглушив усіх.\n\n«Товаришу Костін, я розумію ваші побоювання. Було б неприпустимо, якби Вільна Територія продовжувала це, коли, за вашими словами, їй ніщо не загрожує». Костін був задоволений: Рада Безпеки видавалася значно чутливішою до становища робітників за попередні підприємства й уряди.\n\n«На жаль, - продовжив Стєпанов, - наше становище інше. На сході й заході кровожерні воєводи зазіхають на наші землі. На півдні те саме роблять японські імперіялісти. Навіть у Центральному Сибіру переможені етатисти зализують рани й готуються до удару. Товаришу Костін, Вільна Територія мусить іти на жертви, інакше ми втратимо все, за що боролися».\n\nЦе розкололо Раду Безпеки. Чорна Армія завжди билася за народ, але Росія - суворе місце, і всі ці цінності нічого не важитимуть, якщо їх переможе деспот чи палій війни. Та, як і кожну пропозицію, цю належало винести на голосування."
 SBA.93.a: "Рада Безпеки схвалює пропозицію товариша Костіна."
 SBA.93.b: "Рада Безпеки відхиляє пропозицію."
 
 SBA.94.t: "Комуни Новосибірська відокремлюються!"
 SBA.94.desc: "Генеральній Асамблеї,\n\nНам казали, що Вільна Територія - бастіон абсолютної свободи й рівности, де люди живуть без гніту і капіталу, і держави. Однак нещодавні рішення Генеральної Асамблеї та Ради Безпеки, зокрема відмова від угоди нашої спілки про демілітаризацію, довели, що це не зовсім так.\n\nНарод Новосибірська більше не може стверджувати, що Сибірський Совєт представляє його інтереси. Тому комуни Іскітіма, Новосибірська, Каїнська й Татарська разом з іншими оголосили про вихід із Сибірської Вільної Території.\n\nЦе не оголошення війни. Ми сподіваємося, що наші народи й надалі житимуть у товаришуванні та солідарності.\n\nЗ повагою, Віталій Костін."
 SBA.94.a: "Розділені - впадемо."
 
 SBA.95.t: "Криза в Генеральній Асамблеї"
 SBA.95.desc: "«Звісно, це клята проблема! Але що ти пропонуєш? Увійти туди й придушити їх, наче кровожерний диктатор?»\n\n«Ти збожеволів, Пьотре? Ми не дамо Вільній Території розпастися, бо якийсь довбаний шахтар не хоче прийняти ціну виживання!»\n\nПісля листа Новосибірська про відокремлення Генеральна Асамблея поринула в хаос. Щодня між Сіудою і Стєпановим спалахувала нова сварка, і жоден не поступався. Інші члени Асамблеї рідко втручалися, але після трьох днів нерішучости вибору не лишилося.\n\n«Той покидьок навмисно написав „товариш“, правда? Він глузує з нас».\n\nСіуда обернувся: «Ти на його боці, Валєнтєєве?»\n\n«Цього разу - так. Він перетворює Новосибірськ на кляту фортецю! Вільна Територія не встоїть, якщо комуни просто...»\n\n«Ви обоє збожеволіли?» - перебила Таратута. «Сіуда має рацію: саме проти цього ми й боролися! Товариш Костін висловив прагнення до солідарности, не ворожнечі. Певна, якщо ми приймемо угоду його спілки, Новосибірськ погодиться повернутися». Стєпанов і Сіуда замовкли. Обидва розуміли, що час ухвалити рішення, та жоден не відступав. Хто б не діяв, робитиме це без підтримки іншого. Для Сіуди це були перегони: встигнути до появи Чорної Армії в Новосибірську, яка знищить усі шанси на переговори. Стєпанов натомість знав: якщо не діяти швидко, новосибірські зрадники підготуються, й напад стане надто дорогим для його розтягнутих дивізій.\n\nНарешті один із них заговорив."
 SBA.95.a: "Ми повернемо Новосибірськ, схвалюєш ти це чи ні, Пьотре."
 SBA.95.b: "Ми знайдемо інший шлях. Це не мусить скінчитися кровопролиттям."
 
 SBA.96.t: "Комуни Томська відокремлюються!"
 SBA.96.desc: "Генеральній Асамблеї,\n\nНарод Томська розуміє Вільну Територію як рух, народжений з ідеалізму, й поважає такі переконання у світі, роздертому шовіністами й диктаторами. Та попри прагнення свободи, властиве вашому рухові, під проводом Генеральної Асамблеї народ Томська свободи не знайшов. Солдати Чорної Армії патрулюють вулиці, установи Томська недбало зруйновано, а наших друзів змушено тікати.\n\nТому комуни Томська вирішили вийти з Вільної Території.\n\nОднак ми не прагнемо війни. Навпаки, ми сподіваємося, що після довгих років конфлікту народи Центрального Сибіру ще знайдуть мир.\n\nЩиро, Віктор Нєкрасов."
 SBA.96.a: "Розділені - впадемо."
 
 SBA.97.t: "Криза в Генеральній Асамблеї"
 SBA.97.desc: "«Звісно, це клята проблема! Але що ти пропонуєш? Увійти туди й придушити їх, наче кровожерний диктатор?»\n\n«Ти збожеволів, Пьотре? Ми не дамо Вільній Території розпастися, бо якийсь довбаний письменник не хоче прийняти ціну виживання!»\n\nПісля листа Томська про відокремлення Генеральна Асамблея поринула в хаос. Щодня між Сіудою і Стєпановим спалахувала нова сварка, і жоден не поступався. Інші члени Асамблеї рідко втручалися, але після трьох днів нерішучости вибору не лишилося.\n\n«Той покидьок намагається знищити все, чого ми досягли. Вони пішли, бо ми забрали в них награбоване багатство, а не через турботу про народ».\n\nСіуда обернувся: «Ти на його боці, Валєнтєєве?»\n\n«Цього разу - так. Він перетворює Томськ на кляту фортецю! Вільна Територія не встоїть, якщо комуни просто...»\n\n«Ви обоє збожеволіли?» - перебила Таратута. «Сіуда має рацію: саме проти цього ми й боролися! Товариш Нєкрасов висловив прагнення до солідарности, не ворожнечі. Певна, якщо ми приймемо угоду його спілки, Новосибірськ погодиться повернутися».\n\nСтєпанов і Сіуда замовкли. Обидва розуміли, що час ухвалити рішення, та жоден не відступав. Хто б не діяв, робитиме це без підтримки іншого. Для Сіуди це були перегони: встигнути до появи Чорної Армії в Томську, яка знищить усі шанси на переговори. Стєпанов натомість знав: якщо не діяти швидко, томські зрадники підготуються, й напад стане надто дорогим для його розтягнутих дивізій.\n\nНарешті один із них заговорив."
 SBA.97.a: "Ми повернемо Томськ, схвалюєш ти це чи ні, Пьотре."
 SBA.97.b: "Ми знайдемо інший шлях. Це не мусить скінчитися кровопролиттям."
 
 SBA.98.t: "Влада плодить паразитів"
 SBA.98.desc: "Іосіф служив у Чорній Армії сім років. Захищав села довкола Канська від бандитів, бився під Красноярськом і Кемеровом, а коли його обрали офіцером, із вдячністю прийняв нову посаду. Тож коли дивізія отримала наказ повернути Новосибірськ, він його виконав.\n\nТа битва за Новосибірськ відчувалася інакше. Він ніколи не сумнівався в ідеалах Чорної Армії, але все ж почувався так, наче опинився не на тому боці. Його дивізія прорвала нашвидкуруч зведені барикади, здолала погано навчених чоловіків, і за кілька годин місто знову було «під контролем» Вільної Території.\n\nТа саме в «контролі» й була проблема.\n\nІосіф був надто молодим, щоб воювати, коли народ Канська виборював свободу від Центральносибірської Республіки, але батько часто розповідав про ті часи. Як вони взялися до зброї проти гноблення й захищали місто від краще спорядженого війська - хіба повсталі в Новосибірську не опинилися в такому самому становищі?\n\nВін не міг позбутися цієї думки: він бився, щоб тримати місто «під контролем», а не щоб визволити його."
 SBA.98.a: "Хіба це свобода?"
 
 SBA.99.t: "Влада плодить паразитів"
 SBA.99.desc: "Іосіф служив у Чорній Армії сім років. Захищав села довкола Канська від бандитів, бився під Красноярськом і Кемеровом, а коли його обрали офіцером, із вдячністю прийняв нову посаду. Тож коли дивізія отримала наказ повернути Томськ, він його виконав.\n\nТа битва за Томськ відчувалася інакше. Він ніколи не сумнівався в ідеалах Чорної Армії, але все ж почувався так, наче опинився не на тому боці. Його дивізія прорвала нашвидкуруч зведені барикади, здолала погано навчених чоловіків, і за кілька годин місто знову було «під контролем» Вільної Території.\n\nТа саме в «контролі» й була проблема.\n\nІосіф був надто молодим, щоб воювати, коли народ Канська виборював свободу від Центральносибірської Республіки, але батько часто розповідав про ті часи. Як вони взялися до зброї проти гноблення й захищали місто від краще споряденого війська - хіба повсталі в Томську не опинилися в такому самому становищі?\n\nВін не міг позбутися цієї думки: він бився, щоб тримати місто «під контролем», а не щоб визволити його."
 SBA.99.a: "Хіба це свобода?"
 
 SBA.100.t: "Зустріч із Віталієм Костіним"
 SBA.100.desc: "«То ви Таратута? Прийшли пояснити, чому я маю відмовитися від свободи?» Костін одразу перейшов до суті зустрічі, яку влаштувала Таратута. Якщо все піде добре, вона зможе запобігти виходу Костінської спілки. Та треба поспішати: Стєпанов із генералами щось планували, і що б це не було - напевне дурницю.\n\n«Зовсім ні, товаришу Костін». Таратута сіла, і Костін зрештою зробив те саме. «Я розумію, що ви й Костінська спілка обурені відхиленням вашої пропозиції».\n\n«Авжеж. „Сибірський план“ - лише етатистське виправдання для позбавлення нас прав! Якщо ви його не демілітаризуєте, ми не братимемо в ньому участи».\n\n«Я знаю й співчуваю вашим вимогам. Але Рада Безпеки досі вважає етатистів на сході й заході надто великою загрозою. Якщо демілітаризувати план, вони задушать нашу революцію, як етатисти робили щоразу в історії. Це тимчасовий захід. Запевняю, він мені так само огидний». Здавалося, слова Таратути зачепили Костіна, і він уже замислився, коли до кімнати вбіг робітник із рушницею.\n\n«Товаришу Костін! Чорна Армія! Вони атакують місто!»\n\nОбоє вражено схопилися. «Що, в біса, робить цей дурень?!» - крикнула Таратута. Вона повернулася до Костіна, та він уже віддавав накази.\n\n«Повідомте інших! Ці мілітаристи показали справжнє обличчя». Костін повернувся до Таратути. «Ви здаєтеся щирою, але ваші союзники - аж ніяк. Раджу піти зараз: може стати гаряче». З цими словами він схопив рушницю й вибіг."
 SBA.100.a: "Наступного разу, коли побачу Стєпанова, він труп."
 
 SBA.101.t: "Зустріч із Віктором Нєкрасовим"
 SBA.101.desc: "Таратута сподівалася, що зустріч мине гладко. Нєкрасов був розумним чоловіком, вони напевне зможуть домовитися про щось розумне. На жаль, легко не буде.\n\n«У жодному разі. Не поки влада в руках військових, - Нєкрасов прокашлявся. - У Томську ми віримо в демократію. Генеральна Асамблея не була досконалою системою, але принаймні демократичною. Однак нещодавні військові придушення...»\n\n«Це лише тимчасовий захід, запевняю вас. Я теж із ними не згодна, але останні події...»\n\n«Останні події, спричинені вашими генералами? Вашими солдатами? Вашими рішеннями? Перепрошую, але...» Саме коли Таратута готувала заперечення, увірвався солдат.\n\n«Мене послав Карчєнко, пане! Чорна Армія штурмує місто, і ми перевозимо вас у безпечніше місце». Таратута шаленіла. Стєпанов вирішив, що груба сила - ідеальне розв'язання надзвичайно делікатної ситуації.\n\nНєкрасов підвівся й перед виходом повернувся до неї: «Сподіваюся, тепер ви розумієте нашу позицію. Можете піти, якщо хочете, але я потрібен деінде». Сказавши це, він вийшов, лишивши Таратуту кипіти від люті."
 SBA.101.a: "Наступного разу, коли побачу Стєпанова, він труп."
 
 SBA.102.t: "Неохочий відступ"
 SBA.102.desc: "Іван Стєпанов був не в гуморі ще до прибуття посильного. Після цього його настрій став іще гіршим.\n\nВін і підпорядковані йому частини Чорної Армії зайняли позиції на території відокремлених новосибірських комун, лише за кілька кілометрів від міста. Костін, звісно, не відповів на вимогу Чорної Армії підкоритися, тому Стєпанов готувався до неминучого - штурму самого Новосибірська.\n\nПісля ретельного огляду й аналізу він вважав свої сили здатними на це. Та тоді посильний приніс жахливу звістку: обурена поводженням із Новосибірськом, томська комуна на півночі теж оголосила про вихід. Якщо її міліція рушить на південь, командування Стєпанова опиниться під серйозною загрозою оточення.\n\nВін лютував через рішення, неминучість якого в глибині душі розумів, але неохоче почав планувати відступ на схід, до ядра Вільної Території. Збереження цілісности й самого існування його командування було понад усе. Якщо його зберегти, з часом воно повернеться до лігва зрадників і в Новосибірську, і в Томську.\n\nА коли повернеться, Стєпанов простежить, щоб за таку зраду всі дістали заслужену кару."
 SBA.102.a: "Серйозна невдача."
 
 SBA.103.t: "Неохочий відступ"
 SBA.103.desc: "Іван Стєпанов був не в гуморі ще до прибуття посильного. Після цього його настрій став іще гіршим.\n\nВін і підпорядковані йому частини Чорної Армії зайняли позиції на території відокремлених томських комун, лише за кілька кілометрів від міста. Нєкрасов, звісно, не відповів на вимогу Чорної Армії підкоритися, тому Стєпанов готувався до неминучого - штурму самого Томська.\n\nПісля ретельного огляду й аналізу він вважав свої сили здатними на це. Та тоді посильний приніс жахливу звістку: обурені поводженням із Томськом, новосибірські комуни на півдні теж оголосили про вихід. Якщо їхня міліція рушить на північ, командування Стєпанова опиниться під серйозною загрозою оточення.\n\nВін лютував через рішення, неминучість якого в глибині душі розумів, але неохоче почав планувати відступ на схід, до ядра Вільної Території. Збереження цілісности й самого існування його командування було понад усе. Якщо його зберегти, з часом воно повернеться до лігва зрадників і в Новосибірську, і в Томську.\n\nА коли повернеться, Стєпанов простежить, щоб за таку зраду всі дістали заслужену кару."
 SBA.103.a: "Серйозна невдача."
 
 SBA.104.t: "Ланцюгове відокремлення"
 SBA.104.desc: "Коли комуни Томська й Новосибірська оголосили про вихід із Вільної Території, багато хто вважав, що політичне становище вже не може погіршитися. Вони помилялися.\n\nНегайний, грубий і безкомпромісний напад Чорної Армії на відокремлені комуни мав показати решті, що відокремлення не терпітимуть, але дав протилежний результат. Жахнувшись так званої «зради» ідеалів Вільної Території, комуни Кемерова, Барнаула й Красноярська невдовзі теж оголосили про вихід, і Центральний Сибір розколовся ще більше.\n\nНіхто не знав, які шляхи оберуть Юрій Крилов, Васілій Шукшін і Віктор Астаф'єв для своїх комун, що знову стали «вільними» державами, але на примирення лишалося мало надії. Усі троє різко засудили дії Чорної Армії проти Томська й Новосибірська та мобілізували свої міліції для оборони регіону, якщо вона знадобиться.\n\nГенеральній Асамблеї лишилося вірним трохи більше за первісне ядро довкола Канська. Якою буде відповідь на нові події і чи буде взагалі - невідомо. Чи спланують такий самий наступ проти них? Та чи здатен іще Канськ на це?\n\nПокаже лише час."
 SBA.104.a: "Невже це кінець анархії в Сибіру?"
 
 SBA.105.t: "Межу перейдено"
 SBA.105.desc: "Іван Стєпанов знав: після цього вчинку вороття не буде. Та іншого виходу він не бачив і загартував волю для неминучого.\n\nВтручання Генеральної Асамблеї в придушення Чорною Армією сепаратистських повстань було, на його думку, просто неприйнятним. Він і його підлеглі були переконані: без цього втручання кризу вже владнали б, а Вільну Територію знову об'єднали б землею і метою. Але цього не сталося.\n\nОтже, вплив Асамблеї належало обмежити радикальним кроком, який він задумав. Стєпанов наказав підлеглим формуванням передислокуватися до Туви й довкола неї, захопивши контроль над регіоном у центрального уряду. Тува мала стратегічне положення й досить ресурсів та населення, щоб військо могло відновитися й, можливо, підготувати майбутні наступи.\n\nСтєпанов сподівався, що цей крок не стане постійним, хоча розумів таку можливість. Та був певен: він зробив найкраще для Чорної Армії, й дуже хотів, щоб з часом інші визнали це також."
 SBA.105.a: "І справді радикальний крок."
 
 SBA.106.t: "Межу перейдено"
 SBA.106.desc: "Пьотрові Сіуді урвався терпець. Він досить надивився на грубі методи Стєпанова та його однодумців у Раді Безпеки й більше не міг стояти осторонь. Треба було діяти. І діяти мав він.\n\nТак і сталося.\n\nСіуда оголосив, що Рада та її «ланцюговий пес» зрадили ідеали Вільної Території нападами на комуни, які, як тепер він уважав, повстали справедливо. Він залучив на свій бік багатьох найвпливовіших діячів комун довкола Канська й оголосив вихід міста зі складу того, що вже називав «нелегітимним урядом». Також Пьотр заявив про намір разом з іншими відновити Сибірський Совєт і зробив перші необхідні кроки.\n\nЯк він довідався пізніше, проголошення заскочило Раду зненацька. Раптова втрата території та шляхів постачання не дала силам Стєпанова негайно виступити проти нього. Ба більше, Стєпанов мусив відвести війська на південь, до Туви, щоб уникнути безнадійного тактичного становища.\n\nЗвісно, ще не було ясно, чи це нове відокремлення призведе до падіння Ради Безпеки та її, на думку Сіуди, дедалі більшого деспотизму. Та всі погодилися б: це був іще один крок до її поразки."
 SBA.106.a: "І справді радикальний крок."
 
 SBA.107.t: "Пропозицію ухвалено!"
 SBA.107.desc: "Після місяців дебатів Генеральна Асамблея ухвалила пропозицію більшістю у дві третини голосів. Оскільки більшість комун її підтримує, тепер її запровадять у всій Вільній Території. Деякі комуни досі виступають проти, та переважна частина Вільної Території втілить рішення протягом наступних місяців.\n\nПісля завершення цих дебатів зали Генеральної Асамблеї відкриті для нових."
 SBA.107.a: "Чудово!"
 
 SBA.108.t: "Пропозицію відхилено!"
 SBA.108.desc: "Після місяців дебатів Генеральна Асамблея відхилила пропозицію: вона не набрала більшости у дві третини голосів. Попри підтримку окремих комун, відсутність консенсусу не дасть нам змоги втілити її хоч скільки-небудь дієво.\n\nПісля завершення цих дебатів зали Генеральної Асамблеї відкриті для наступних."
 SBA.108.a: "Шкода."
 
