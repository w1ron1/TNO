 SBA_expansion_supplying_our_revolution_desc:0 "Нинішній розвиток Вільної Території не задовольняє потреб ані Чорної Армії, ані народу. Якщо цього швидко не виправити, ми не дамо ради власній землі, не кажучи вже про розширення.\n\nГенеральна Асамблея продовжить господарський розвиток: поліпшить інфраструктуру, фабрики, вузли постачання й залізниці та створить сталі логістичні шляхи.\n\nРеволюція не може жити лише ідеалізмом і переконанням - вона має себе забезпечувати."
 SBA_expansion_seize_their_hoarded_riches_desc:0 "Багатії достатньо натішилися владою. Роками вони командували народом, знущалися з нього й визискували його, не боячись відплати.\n\nБільше цього не буде. Тепер народ здобув силу, ролі помінялися, а паразитів і тиранів повалено. Настав час повернути награбовані багатства законним власникам - вільним людям Сибіру.\n\nРада Безпеки організує Чорну Армію й доручить їй провести вилучення по всьому Центральному Сибіру, залишивши паразитам лише необхідне для виживання. Після цього Генеральна Асамблея визначить спосіб справедливого розподілу багатства. Невдовзі ми досягнемо рівности між усіма мешканцями Вільної Території."
 SBA_expansion_increase_local_cooperation_desc:0 "Російські етатисти подбали, щоб слово «анархія» стало синонімом хаосу, смерти й руйнування, але це безмежно далеко від істини. Насправді анархія - те, чого держава боїться найбільше. Вона не означає цілковитого розпаду суспільства й відсутности будь-якого контролю; вона означає тільки те, що контролю немає в них. Через багаторічне виховання попередніх режимів сибірські ліві обережно ставляться до співпраці з нами. Та досить просто пояснити наші справжні цінності й політику, і вони швидко приєднаються до наших лав."
 SBA_expansion_revolutionary_security_administration_desc:0 "За кожним кутом ховаються щури: шпигуни, диверсанти й терористи під покровом темряви виконують волю буржуазії проти простих людей. Землі визволено зовсім недавно, тож більшість населення або не розуміє нашої боротьби, або активно їй опирається. Щоб зберегти мир і забезпечити плавний перехід, Чорна Армія наглядатиме за баламутами, керуючи землями як військовими округами."
 SBA_expansion_to_defend_freedom_desc:0 "Вільна Територія - єдине місце в Росії зі справжньою свободою, та багато хто цього не розуміє й не знає, що сусіди прагнуть знищити наше суспільство та нав'язати тоталітарну владу.\n\nНе можна впадати в самовдоволення чи байдужість.\n\nЗа наказом Генеральної Асамблеї Рада Безпеки організує загальну мобілізацію Вільної Території до праці й оборони. Промисловість оживе, добровольці заповнять фабрики, а міліції об'єднаються в силу, здатну відбити будь-якого завойовника."
 SBA_expansion_readying_the_black_army_desc:0 "Поки вороги збираються на кордонах і готуються до війни, ми мусимо відповісти так само. Тільки Чорна Армія стоїть між Вільною Територією та завоюванням. Вона наш захисний мур проти тиранії, але слабкий мур розіб'ється від першого удару.\n\nЦього не станеться.\n\nЧорна Армія отримає більше харчів, спорядження, матеріялів - усього потрібного для оборони. Народові доведеться піти на короткочасні жертви, але вони необхідні, щоб військо не просто підготувалося до війни, а перемогло."

