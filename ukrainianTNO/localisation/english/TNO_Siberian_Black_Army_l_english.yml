 SBA_power_struggle_category: "§eГенеральна Асамблея§!"
 SBA_power_struggle_category_desc: "Напруга між Генеральною Асамблеєю та Радою Безпеки у Вільній Території переросла у відкриту боротьбу за владу. Пьотр Сіуда та Іван Стєпанов, двоє найвпливовіших людей Центрального Сибіру, змагаються за вплив у нашому молодому експерименті. Їхні суперечні переконання - ідеалізм і прагматизм - зіткнуться на далекосхідній арені, де обидва збирають підтримку перед остаточною сутичкою в Новосібірску.\n\nПоки найвідоміші провідники Вільної Території відсутні, а депутати Асамблеї та командири Ради нескінченно сперечаються, підтримувати порядок доводиться рядовим бійцям Чорної Армії - наскільки порядок узагалі можливий в анархістському суспільстві."
