 SBA_militarized_society: "Мілітаризоване суспільство"
 SBA_militarized_society_desc: "Ми не схожі на слабкі й беззахисні комуни, розкидані Росією, які спокійно вірять у власні ідеали й гадають, ніби сили реакції та тиранічний зовнішній світ не змовляться їх знищити. Ні, ми значно далекоглядніші. Революція завжди матиме ворогів, тож наша зброя не змовкне, доки доброзичлива рука Мами Анархії не торкнеться кожного куточка нашої землі."
