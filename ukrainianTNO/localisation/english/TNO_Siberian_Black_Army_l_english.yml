 SBA_regional_into_a_brighter_tomorrow_desc: "Попри всі труднощі Сибірська Чорна Армія здолала кожного ворога й об'єднала Центральний Сибір! Однак наша праця на цьому не закінчується - попереду ще безліч справ. Передусім під нашим контролем опинилося багато нових сіл, містечок і навіть великих міст, тож ми маємо допомогти належно організувати всі нові землі у справжні комуни. Крім того, треба розпочати тривалий процес пристосування людей до нового ладу й пояснення, чому саме анархізм є правильним майбутнім Росії.\n\nВодночас у тіні ховається майже невисловлений страх, що Чорна Армія поглине Сибірський Совєт, а анархістська мрія потрапить у пастку військової хунти. Частина цих побоювань, можливо, небезпідставна, та ми сподіваємося знайти рішення, що збереже свободу й водночас не дозволить краю поринути в хаос!"
 SBA_regional_consolidate_the_regional_courts_desc: "Нові території під нашим контролем треба згуртувати й перетворити на належні анархістські комуни. На перший погляд рішення просте: дозволити людям самостійно організувати комуни. Проте те, що легко виглядає на папері, на практиці спричинило запеклу ідеологічну суперечку. Населення Центрального Сибіру ніколи не жило в анархістському суспільстві й, імовірно, навіть не знає, як самоорганізуватися. До того ж серед нього напевно ще надто багато тих, хто бажає зруйнувати нашу мрію. Отже, перед нами вибір: дозволити людям самоорганізацію, як велить ідеологія, чи доручити Чорній Армії тимчасово керувати цими землями, доки вони не будуть готові створити справжні комуни?"
 SBA_regional_instate_provisional_leadership_desc: "Попри наші надії, провідники Сибірського Совєту знають правду: серед населення щойно завойованих земель нині надто багато противників анархізму, а дозвіл на негайну самоорганізацію лише запросить диверсії. Хай як це болісно, ми не маємо іншого вибору, крім як тимчасово передати нові землі під керівництво Чорної Армії, доки не переконаємося, що люди готові організуватися самостійно. Це може здаватися суперечністю, але заради Революції ми мусимо так учинити. Якщо пощастить, населення швидко звикне до анархізму, після чого владу належно передадуть майбутнім анархістським комунам, не дозволивши повноваженням Чорної Армії пустити надто глибоке коріння."
 SBA_regional_faith_in_the_newly_integrated_desc: "Дозволити Чорній Армії керувати новими землями означало б цілковито зрадити нашу ідеологію! Це може здаватися дрібницею, але таке рішення створить небезпечний прецедент: якщо ми розширимося ще далі, то чому військо не мало б так само керувати й наступними землями, доки їхні мешканці звикають до анархізму? Крім того, демонстративна недовіра до людей підриває весь анархізм у Сибіру. Один із його головних принципів - взаємна співпраця, а відмова простягнути руку довіри від самого початку руйнує наші надії! Дехто не захоче самоорганізуватися, але належне втілення анархістської ідеології, а не фашистське розмахування військом, дасть нам змогу збудувати справді вільне анархістське суспільство!"
 SBA_regional_strike_the_balance_of_power_desc: "Чорна Армія безперечно стала могутньою владою, від якої ми значною мірою залежали впродовж усіх воєн і розширень. Така залежність непокоїть багатьох, а страх, що військо зрештою створить фактичну військову хунту, поширився всюди. Після всього пройденого ми, звісно, не можемо допустити такої трагедії. Щоб Чорна Армія не зосередила надмірної влади, треба докласти зусиль до зміцнення совєтів і комун. Посилення цивільних рад у поєднанні з переданням частини завдань Чорної Армії іншим, представницькішим органам дасть змогу зберегти анархістські ідеали навіть перед лицем загроз!"
 SBA_regional_extend_the_communication_systems_desc: "Однією з найбільших проблем нашого розширення стала нездатність підтримувати належний зв'язок. Про події у віддалених сільських районах ми часом дізнаємося лише за кілька днів, а то й тижнів. У нинішню добу перебудови кращі зв'язок і координація із сільськими товаришами мають критичне значення: необхідно забезпечити їм доступ до кращих ресурсів і покласти край усім прихованим загрозам. Для цього ми продовжимо телеграфні лінії, збудуємо нові радіовежі та прокладемо сучасну телефонну мережу, що дозволить дістатися навіть найізольованіших громад. У питаннях села ми більше не залишатимемося в темряві!"
 SBA_regional_correct_the_misguided_teachings_desc: "Освіта безперечно є підвалиною нашого майбутнього. Саме вона прищеплює молоді цінності, до її уроків люди повертаються протягом усього життя. Деякі частини старого совєцького й центральносибірського навчання викладали правильно, але чимало інших доведеться пояснити населенню заново, щоб воно стало взірцевими анархістами. Передусім треба наголосити на нездатності держав забезпечити Центральному Сибірові тривалу стабільність і мир, а також показати, як анархістська думка досягне успіху там, де провалилися маріонеткова демократія та етатизм. Це потребуватиме часу, але зрештою люди зрозуміють істину анархізму!"
 SBA_regional_cast_down_social_injustice_desc: "Упродовж століть російські держави, хай якої форми набували, створювали культуру нерівности. Жінок найчастіше вважають нижчими за чоловіків і прирікають бути домогосподарками. Люди інших рас так само зазнають нападок і підозри без жодної причини, крім упередження. Та найгірше становище мають гомосексуали: їм ледве визнають саме право на існування, а багатьох нещасних, чию орієнтацію викрили, переслідують. Таким забобонам немає місця в анархістському суспільстві. Ми мусимо розірвати кайдани наших жінок, пояснити людям, що раса - лише зовнішність і нічого більше, та нарешті дозволити гомосексуальним товаришам вільно кохати того, кого вони бажають!"
 SBA_regional_enshrine_the_material_rights_desc: "Кожна людина, хай ким вона є, заслуговує на право жити. Та, звісно, самого абстрактного права недостатньо: людям потрібні матеріяльні ресурси - їжа, вода й інші життєві потреби. Щоб справді гарантувати право кожного на життя, ми мусимо також забезпечити кожній людині, незалежно від її походження чи становища, доступ до всього необхідного. Для цього треба допомогти комунам завжди мати змогу дати людям засоби до існування. Ми не лише нагадаємо їм про цей обов'язок, а й повідомимо, що за потреби вони можуть отримати допомогу від ширшої спільноти комун. Ми подбаємо, щоб під анархізмом життя могло процвітати!"
 SBA_regional_establish_the_provisional_resource_council_desc: "З доступом до нових земель і багатств чимало товаришів указали на потребу належно координувати ресурси, щоб комуни могли справно працювати. З цією метою ми створимо Тимчасову ресурсну раду. Її головним завданням стане забезпечення видобутку й розподілу всіх ресурсів у межах Вільної Території. До Ради увійдуть робітники видобувних галузей і представники районів, які потребують цих матеріялів. Сподіваємося, вона зможе задовольняти всі пов'язані з ресурсами потреби міст і сіл, водночас даючи робітникам, які їх виробляють, місце, де їхній голос буде почуто."
 SBA_regional_the_last_congress_of_kansk_desc: "Через стрімке розширення Вільної Території стало очевидно, що для належної координації комунам потрібне центральніше місце. Однак іще лишилося кілька невирішених питань, а перенесення комунного конгресу до розташованого ближче до центру Новосібірска має бути оформлене офіційно, демократичним голосуванням. Тому ми проведемо в Канску останній Конгрес, розв'яжемо всі решту внутрішніх проблем і лише тоді переїдемо до Новосібірска!"
 SBA_regional_rectify_the_rural_urban_split_desc: "Першою великою проблемою, на якій вирішив зосередитися Канський Конгрес, став розрив між містом і селом. Більшість сільських товаришів уже почала перебудовувати села у справжні анархістські комуни, але мешканцям міст було значно важче. Численність і висока щільність міського населення означають, що успіх потребує набагато більше уваги та ресурсів. Тепер, коли частину інших нових комун уже згуртовано, ми можемо присвятити більше часу й сил належній перебудові міст. Їхні комунні уряди понад усе інше стануть взірцем для будь-яких майбутніх комун. Ми мусимо докласти всіх зусиль, щоб справді визволити кожного мешканця Вільної Території та показати йому світло анархізму!"
 SBA_regional_honors_for_humanity_desc: "Коли Совєцький Союз упав, а Центральносибірська республіка розкололася, люди лишилися напризволяще серед беззаконня. Щоб упоратися з хаосом, багато хто звернувся до релігії, і церква здобула надзвичайно сильний вплив у Центральному Сибіру. Ми не маємо наміру просто забороняти її, але мусимо обмежити її вплив на населення. Треба навчати людей світськости й пов'язувати їхні надії з комунами, щоб вони менше залежали від церкви як джерела стабільности. Крім того, вже отримані церковні багатства ми використаємо для власних цілей, а не повернемо духовенству. Декому з товаришів такі заходи можуть видатися суперечливими, але вони необхідні для побудови кращого суспільства!"
 SBA_regional_present_the_cure_desc: "Коли скинули царя, народ звернувся до іншого уряду - СССР. Коли СССР упав, люди знову обрали уряд - Центральносибірську республіку. Та зрештою й вона розпалася, як дві попередні системи. Ці держави не змогли подолати лиха, що мучили Росію, тому й загинули. Але там, де етатизм провалився, анархізм досяг успіху! Лише за короткий час Центральний Сибір зробив велетенський стрибок уперед. Росія, схоже, тяжко хвора, а анархізм є очевидними ліками від її недуг! Наш обов'язок - бути непохитними лікарями й подбати, щоб лікування провели як слід!"
 SBA_regional_liberty_all_encompassing_and_eternal_desc: "Коли всі головні питання владнано, останній Канський Конгрес починає згортати роботу. Основні внутрішні проблеми, здається, розв'язано, а створення комун і рад іде без перешкод. Завершиться Конгрес офіційним голосуванням за перенесення всіх майбутніх засідань до Новосібірска. Усупереч усім очікуванням Вільна Територія змогла не лише розширитися, а й досягти процвітання та поширити анархізм по всьому Центральному Сибіру! Ми билися в Україні, билися в Каталонії, а тепер нарешті перемогли тут, у Центральному Сибіру. Народ отримав свободу, і для Вільної Території наближається новий світанок - світанок, за якого всі ми зможемо насолоджуватися плодами свободи!"
 SBA_regional_develop_the_free_territory_desc: "Колишній совєцький уряд ніколи не приділяв нашому краю великої уваги. Ми, звісно, отримали розширення Транссибірської магістралі й дещо оновлене устаткування для міських центрів, але Совєцькому Союзові просто бракувало часу й ресурсів вкладати в наш дім стільки, скільки він вкладав в інші регіони. Проте так мало бути не завжди. Сибірський план передбачав ширший розвиток цивільної інфраструктури, розростання міст і великі інвестиції у військово-промислові заводи. Військова промисловість мала стати майже цілком вертикально інтегрованою - від видобутку необробленої залізної руди до виробництва й розподілу автоматів Калашнікова. Тоді план був нездійсненним, але завдяки новим ресурсам ці задуми нарешті можна втілити."
 SBA_regional_integrate_the_urban_economies_desc: "Міські райони завжди було непросто інтегрувати до нашої комунної економіки. Не здатні самі виробляти їжу, міста часто обмінювали виготовлену на своїх заводах зброю на харчі із сусідніх містечок. Тепер, коли в місцевих центрах розвинулося власне виробництво рушниць, ця економічна рівновага зруйнувалася. Щоб компенсувати містам утрату джерела доходу, треба заохотити їх краще використовувати наявні переваги - більшу кількість кваліфікованих працівників і додаткову робочу силу. Вони мають виробляти спеціялізовані вироби й цивільні товари, за допомогою яких і надалі залучатимуть до міст капітал і продовольство."
 SBA_regional_rebuild_urban_infrastructure_desc: "Хоч Центральний Сибір і уникнув люті німецьких бомбардувальників, які спустошили землі далі на заході, його міста не вийшли з катастрофи цілком неушкодженими. Розпад Центральносибірської республіки й наступні війни за визволення краю довели інфраструктуру міських центрів до жахливого стану. На щастя, тепер у Сибіру нарешті настав мир, а новостворені комуни більш ніж готові взятися за відбудову, тож виконати це завдання буде нескладно."
 SBA_regional_re_organize_the_industrial_centers_desc: "У самій своїй суті комунізм ставить громаду понад усе й твердить, що кожен може зробити внесок у спільне благо. Такий ідеал легко розвивати в тісно згуртованих селах чи невеликих містечках, але значно важче - у великих містах. Ми мусимо плекати відчуття солідарности й братерства серед міських мешканців. Ця спільність починається на робочому місці, серед співробітників і товаришів по фабриці. Задля цього ми викорінимо старе уявлення про відносини начальника й робітника та запровадимо нову систему робітничого самоврядування."
 SBA_regional_establish_the_council_of_trade_unions_desc: "Ще до перемоги Чорної Армії над воєначальниками й деспотами в Центральному Сибіру існувало багато профспілок, але нині вони гостро потребують реформування. Костінці, приміром, надто прихильні до большевизму, щоб їм можна було довірити весь теперішній вплив, а решта організацій надто дрібні й місцеві, щоб об'єднати всіх робітників Сибіру. Тому слід заснувати офіційну раду, схвалену й підтриману Радою Безпеки. Вона об'єднає всі профспілки й завадить авторитаристам підривати їхні лави зсередини."
 SBA_regional_encourage_the_kostinsty_desc: "Костінці - войовнича робітнича організація, що існувала в цьому краї ще до нашого приходу. Наші політичні погляди не збігаються цілком: їхній провід, схоже, тяжіє до довоєнної бухарінської філософії, тоді як ми обстоюємо радикальнішу анархо-комуністичну політику. Проте їхній організаційний досвід і вплив можуть виявитися для нас неймовірно корисними. Керівники костінців уже дали зрозуміти, що не заперечують проти співпраці, і запропонували допомогу у втіленні переробленого Сибірського плану. Ми були б дурнями, якби відмовилися від цієї пропозиції."
 SBA_regional_the_bounty_of_the_siberian_plan_desc: "Сибірський план майже завершено. Уже зараз тисячі промислових машин, розподілених по всьому Сибіру між великими містами й малими містечками, встановлюють і вперше випробовують. Електричне світло починає сяяти в місцях, де люди досі не бачили навіть лампочки, а нові вугільні станції по всьому Сибіру відкривають тисячі робочих місць. Рівень життя мільйонів сибіряків ось-ось зробить квантовий стрибок, і це висуне нас до числа провідних промислових сил Росії. Такими темпами одного дня ми, можливо, затьмаримо навіть Німеччину..."
 SBA_regional_encourage_the_peasant_communes_desc: "Комунізм за своєю природою ставить громаду вище за приватну особу. А яка спільнота чоловіків і жінок може бути більшою за всю їхню землю? Ми мусимо заохотити ізольовані сільські громади, які зазвичай не мають представництва у владі, простягнути руку назовні й долучитися до економічного та політичного життя країни. Виробництво окремої сільської громади може бути невеликим, але якщо всі села й містечка Вільної Території працюватимуть разом, вони пізнають справжній добробут."
 SBA_regional_develop_the_altai_region_desc: "Алтай - край із величезним промисловим потенціялом. Інфраструктура там майже відсутня, зате природні багатства практично не розроблені, а населення досить численне, щоб підтримувати роботу кількох гірничих і фабричних осередків. Навіть перший крок до індустріялізації регіону - прокладання залізничних колій - має вже протягом найближчих тижнів підвищити сільськогосподарське виробництво й видобуток корисних копалин, поки ми спрямовуватимемо туди дедалі більше ресурсів."
 SBA_regional_facilitate_rural_mechanization_desc: "Одна з важливих рис комунного життя - самодостатність. Утім, вона не завжди можлива: віддаленим громадам часто бракує кваліфікованої праці й промислових потужностей для виробництва сучасної електроніки чи автомобілів. Але ми можемо дати їм засоби для придбання таких речей. Сприяючи механізації сільських районів Вільної Території, ми допоможемо комунам виробляти більше, ніж їм потрібно, і обмінювати надлишок урожаю та худоби на товари, яких сільське населення не здатне виготовити самостійно. До того ж надлишок продовольства стане в пригоді для зростання населення."
 SBA_regional_ensure_rural_interconnection_desc: "Деякі сільські райони Вільної Території просто непридатні для великої індустріялізації та розширення. Вони або надто ізольовані, або малозаселені, або лежать у місцевості, вразливій до іноземного вторгнення. Найкраще, що ми можемо для них зробити, - розбудувати інфраструктуру й з'єднати їхні землі з рештою наших. Способів чимало: справжні автомобільні чи залізничні шляхи, телефонні або простіші телеграфні лінії, продовження електромережі. Це не створить для місцевих мешканців заводських робочих місць, але, сподіваємося, дасть їм змогу досягти бодай дещо вищого рівня життя."
 SBA_regional_enlightenment_for_all_desc: "Поки Росія грузла в безперервних громадянських війнах і сутичках, породжених владою воєначальників, світові наддержави вдосконалювали свій технологічний арсенал. Від космічних перегонів до розвитку транзисторних обчислень - вони вдесятеро збільшили обчислювальні, сільськогосподарські та промислові потужності, тоді як ми мусили покладатися на машини кількадесятирічної давнини. Щоб піднятися до їхнього рівня, треба почати вкладати кошти в місцеві школи, університети й лабораторії Вільної Території. Фінансування й автономія для цих осередків знань - найнадійніший шлях піднести наш освітній рівень."
 SBA_regional_the_interventionist_approach_desc: "Довкола Росії існують держави, здатні знищити нас одним натисканням кнопки. Тисячі міжконтинентальних, підводних і балістичних ракет середньої дальности озброєні й готові пролити на Росію атомний вогонь, якщо їхні власники так вирішать. Навіть без цієї зброї нас легко розчавити сучасними рушницями й ракетами, що є в їхньому розпорядженні. Після розпаду Совєцького Союзу наші технології майже не розвивалися, і країна стала вразливою. Нині ми не маємо ані технологій, ані кваліфікованих фахівців для створення такої зброї, але освітня система під наглядом військової ради напевно допоможе почати скорочувати технологічне відставання."
 SBA_regional_trust_in_the_educators_desc: "Дехто стверджує, що заради рівня передовіших сусідів треба підпорядкувати освіту військовій раді, аби всіх учнів і викладачів привести до однакового стандарту якости. Це безглуздя. Різні регіони мають різні потреби. Сільські громади можуть захотіти навчати дітей обслуговування тракторів і ремонту двигунів, тоді як міста віддадуть перевагу виробництву електроенергії та інформатиці. Ми маємо довірити місцевим освітянам самостійно визначати навчальну програму, яка найкраще відповідає потребам їхньої громади."
 SBA_regional_inspire_progressive_thought_desc: "Контроль над освітою має першорядне значення для безпеки Вільної Території. Військова рада могла б лишити комунних викладачів самих собі, але це відкрило б двері диверсіям і прищепленню реакційних ідей нашій молоді. Якщо військо не втрутиться й не запобіжить краху, під загрозою опиниться весь анархізм. П'яту колону треба зупинити. Задля цього ми створимо всеохопну навчальну програму, яка водночас даватиме учням основні знання, потрібні в дорослому житті, та сповідуватиме засади анархізму."
 SBA_regional_the_right_to_well_being_desc: "Як писав Пьотр Кропоткін, розпливчастих проголошень «права на працю» або принципу «кожному весь результат його праці» недостатньо. На шляху до справді вільного й рівного суспільства не можна кинути напризволяще жодну людину. Дехто скаже, що воєнні шрами Росії роблять жертви необхідними, а нерівність - прикрим фактом життя. Ми бачимо ці виправдання такими, якими вони є насправді: брехнею еліти, що прагне зосередити дедалі більше багатства Росії у власних руках. Кожна нова кіловат-година енергії, кожен товар, що сходить із виробничої лінії, кожна завершена будівля мають ставати перемогою, плодами якої користується проста людина. Добробут для всіх - не мрія."
 SBA_regional_provide_schools_for_all_desc: "Освіта - могутнє знаряддя. Зростання письменности серед європейських робітників у XIX столітті прискорило розвиток соціялістичних рухів, адже політична теорія перестала бути винятковою власністю інтелектуалів. Ба більше, масова освіта спричинила небувале зростання виробництва й технологій. На жаль, Центральний Сибір - здебільшого сільський і нестабільний край, тому кількістю та якістю шкіл поступається розвиненішим регіонам. Ми неодмінно маємо збудувати нові школи, щоб усе населення отримало доступ до якісної освіти."
 SBA_regional_expand_research_cooperatives_desc: "Росія відстала від решти світу в багатьох аспектах, але, мабуть, найпомітніше - у технологічному поступі. Коли телевізори стали звичними в американських домівках, тут навіть радіо вважали розкішшю. Коли в Японії створювали реактивні винищувачі, ми латали літаки бухарінської доби. Коли Німеччина накопичувала тисячі ядерних боєголовок, ми не спромоглися збудувати жодної.\n\nЩоб виправити становище, треба всіляко підтримувати й заохочувати комунні дослідницькі ініціятиви. Та сама винахідливість, що подарувала Українській Чорній Армії тачанку, має дати нашій армії танки й реактивні літаки."
 SBA_regional_lessons_from_the_union_desc: "Сибірський план досяг значно більшого успіху, ніж ми могли уявити. Ще до його завершення промислова продуктивність у всьому Сибіру зросла більш ніж на 200 відсотків. Лише за минулий місяць виробництво електроенергії збільшилося більш ніж на 330 мільйонів кіловат-годин - приблизно стільки щомісяця виробляє гребля Гувера. І все це здійснено за мандатом Ради Безпеки. Перед таким величезним досягненням замовкли голоси тих, хто боявся, що ця рада обмежить громадянські свободи або навіть зашкодить довгостроковому процвітанню нашої країни."
 SBA_regional_reach_for_the_dawn_desc: "Жорстке економічне планування не лише обмежує права громадян, а й у довгій перспективі шкодить господарству. Якщо ми справді бажаємо процвітання Росії та перемоги комунізму, треба відкинути авторитарну ідею державного контролю над економікою. Бухарін уже спробував і зазнав невдачі. Заради справжнього добробуту слід дозволити робітничим організаціям і профспілкам самостійно визначати, що виробляти, природно відповідаючи на потреби й запити суспільства та економіки. Дехто назве таку систему капіталізмом під іншою назвою, але ми відкидаємо це тавро. Це і є справжня соціялістична економіка."
 SBA_regional_the_guardians_of_the_revolution_desc: "Кордони Вільної Території постійно перебувають під загрозою. Воєначальники, бандити й нападники будь-якої миті готові грабувати наші міста та села. Тому настав час перетворювати ополчення на повноцінну армію. Для цього треба більше вкладати у спеціялізоване спорядження - протитанкову й протиповітряну зброю та снайперські гвинтівки, - щоб підвищити бойову ефективність війська. Крім того, доведеться зміцнити дисципліну. Ці люди більше не можуть лишатися простими селянами-добровольцями: вони мусять стати солдатами, і ми втовкмачимо їм це муштрою."
 SBA_regional_maintain_the_flawless_legacy_desc: "Ми не можемо зректися власного коріння. Чорна Армія є народним ополченням, створеним народом і для народу, й тепер відмовлятися від цієї спадщини не можна. Така відмова докорінно змінила б саму основу нашого суспільства. До того ж військо тісно переплетене з урядом, тож запровадження в Чорній Армії вертикальної структури командування відкрило б двері корупції та загрозі перевороту з боку генералів нової реформованої армії. Заради безпеки нашого анархічного способу життя, попри всі його вади, ми мусимо зберегти військо, засноване на виборах."
 SBA_regional_welcome_the_rehabilitated_desc: "Чорна Армія досягла надзвичайного успіху в завойовницькому поході Сибіром, але у війську вже проступають тріщини. У міру об'єднання людські резерви поволі танули, і невдовзі ми вже не зможемо вимагати від рідних комун нових бійців. Щоб виправити становище, треба почати приймати до наших лав армії завойованих держав. Це не лише полегшить нестачу людей, а й значно спростить інтеграцію їхніх територій до наших земель."
 SBA_regional_lessons_from_the_liberation_war_desc: "Війни за об'єднання Росії ми виграли не самою грубою силою й чисельністю, як це часто бувало в минулому, а хитрістю вправних генералів і продуманими стратегіями. Ми можемо вивчити їхні звіти та плани, скористатися досвідом командирів і продовжити розвиток військових доктрин, який старий совєцький уряд розпочав у Другій світовій війні. Стратегії попередніх конфліктів уже збирають і викладають у наших військових школах."
 SBA_regional_industrial_warfare_desc: "Велика війна кількадесятирічної давнини стала катастрофою не лише через людські втрати, а й через неймовірне споживання матеріялів. Після неї всі держави світу засвоїли цей урок. Розвиток важкої артилерії, танків і літаків означав, що майбутні війни вимагатимуть могутньої промисловости для утримання сучасних армій. Практика підтвердила цю теорію. Наші військові завоювання досі були можливими лише завдяки невтомним робітникам у тилу, які місяць за місяцем випускали тисячі рушниць, гармат і літаків. На жаль, що далі військо просувається Росією, то більшим воно мусить ставати для захисту довгих кордонів. Тож військову промисловість треба розширювати в ногу з армією."
 SBA_regional_reinforce_the_soldiers_desc: "Поширюючись Росією, військова машина вимагає дедалі більше людей. Щоб задовольнити цю потребу, треба посилити набір у щойно завойованих землях. Добровольців із новоприєднаних територій приймали завжди, але їхня кількість була мізерною. Це легко пояснити: підкорені народи недобре ставляться до завойовників, навіть якщо ми надали їм майже повну автономію. Треба розпочати масову вербувальну кампанію в нових комунах і здобути прихильність населення. Сподіваємося, це збільшить кількість новобранців у приєднаних землях."
 SBA_regional_following_the_falcon_desc: "Перемога над Новосібірском далася нелегко. Його сухопутне військо, можливо, поступалося нашому, але повітряні сили безперечно затьмарювали наші. Ворожа авіяційна підтримка завдала нам надто великих утрат, щоб і далі заплющувати очі на проблему. На щастя, тепер у цьому немає потреби. У Новосібірску розташований один із найбільших авіяційних заводів усієї Росії, а отже, й один із найбільших повітряних флотів країни. Обслуговуватимуть його деякі з найкращих авіямеханіків Сибіру. Вільна Територія робить іще один крок до сучасности."
 SBA_regional_black_wings_above_desc: "У минулому Чорна Армія майже не мала досвіду повітряної війни. Ми часом застосовували літаки в бою, але нам просто бракувало промислових потужностей і кваліфікованих льотчиків для справжніх повітряних сил. Та з огляду на наші розміри й відносну силу ворогів ми мусимо створити повноцінну авіяцію та інтегрувати її до війська. У нас є безліч колишніх пілотів, здатних навчити нове покоління авіяторів, відносно сучасні креслення літаків і промислові потужності, щоб почати їхнє виробництво."
 SBA_regional_experimental_helicopter_designs_desc: "Гелікоптери - одне з численних технологічних досягнень світу, зроблених тоді, коли Росія котилася назад у міжусобиці та владу воєначальників. Ці дивні літальні апарати не схожі на старі літаки: вони підіймаються вертикально за допомогою ротора, що дозволяє атакувати наземні цілі з повітря й перевозити війська та припаси туди, де немає посадкової смуги. Їхній виступ у Південноафриканській війні показав величезний потенціял, а вітчизняна розробка вже почалася."
 SBA_regional_past_the_tachanka_desc: "Сучасна бронетехніка й моторизація знову змінили війну для Росії. Колись наша конструкторська думка зосереджувалася на масовому виробництві дешевих танків, якими мали завалити німецького ворога. Танків так і не випустили достатньо, щоб по-справжньому перевірити цю доктрину, але чимало генералів підтримувало ідею задавити противника числом. Натомість вивчення японських і німецьких танкових доктрин показує наголос на рухливості та якості. Нам слід засвоїти їхній досвід і конструкції та відповідно оновити тактику бронетанкових і моторизованих військ."
 SBA_regional_tanks_for_peace_desc: "Якщо Росія щось і засвоїла з німецького вторгнення двадцять років тому, то це користь і ефективну жорстокість механізованої війни. Російські частини були розсічені й розбиті швидкістю та вибуховою силою панцерних дивізій. Нездатність Бухаріна створити танкові сили, спроможні захистити Совєцький Союз, не повториться. Наші сусіди напевно дійшли тих самих висновків. Якщо ми хочемо захистити кордони, створення бронетанкового корпусу Чорної Армії мусить стати першочерговим завданням."
 SBA_regional_compile_the_strategies_desc: "Попри нещодавні спроби реформувати військо й запровадити бодай основи спільної доктрини, чимало офіцерів і далі застосовує власні тактики та наступальні стратегії, часто всупереч найкращому рішенню. Треба створити єдину військову доктрину, якої командири зможуть дотримуватися заради загальної стратегії в усіх майбутніх війнах. Так ми краще розумітимемо перебіг бойових дій і справжні можливості війська, замість лише сподіватися, що окремий офіцер ухвалить правильне рішення."
 SBA_regional_military_egalitarianism_desc: "Однією з найвидатніших рис Чорної Армії була демократична військова структура. На відміну від майже всіх інших армій, влада в ній походила не згори - від генералів і найвищих командирів, - а від рядових солдатів, які самі обирали офіцерів і підвищували тих, кого вважали найздібнішими. Генерали на вершині командної структури вважаються не ціннішими за будь-якого іншого вояка. Саме завдяки цій рівності наші люди й б'ються так завзято."
 SBA_regional_the_tomsk_firearms_collective_desc: "Мешканці Томска добре пристосовані до нашого виду демократії, бо вже мали місцеві демократичні установи, якими могли скористатися. Проте вони досі не засвоїли життєво важливої для нашої оборони збройової культури. Людям або нецікаво, або задорого купувати зброю, а більшість узагалі не вважала її потрібною, гадаючи, що їх захистять власні армії. Наша присутність тут очевидно доводить протилежне. Тому слід створити організацію, яка пояснить томцям потребу у зброї та навчить нею користуватися."
 SBA_regional_an_army_for_liberation_desc: "Найвищим обов'язком Чорної Армії має стати поширення нашого анархістського способу життя по всій Росії, щоб люди всіх переконань звільнилися від державної тиранії. Ми мусимо готуватися не лише до оборони, а передусім до наступу. Традиційно призовники вступали до Чорної Армії, щоб захищати домівки, а не завойовувати чужі. Треба переконати їх: задля власного захисту ми мусимо визволити всіх інших. Невдовзі над усією Росією майорітиме чорний прапор."
 SBA_regional_an_army_for_self_defense_desc: "Призначення нашого ополчення завжди полягало в захисті, а не заподіянні шкоди. Чорна Армія не схожа на силу терору Яґоди: вони билися за панування й владу, ми б'ємося за мир і хліб. Колишні завоювання не повинні визначати наше майбутнє. Щоб зберегти гідність і цілісність Сибірської Чорної Армії та Вільної Території, ми мусимо не дати собі ступити на той самий тиранічний шлях, яким ішли попередники. Можливо, саме так ми нарешті знайдемо процвітання."
 SBA_regional_looking_outwards_desc: "Геополітика - гра дипломатії й такту не менше, ніж армій і воєн. Щоб убезпечити Вільну Територію, треба оцінити наше становище щодо сусідів на заході та сході, визначити, чи загрожують вони нам, а якщо так - наскільки великою є небезпека. Якщо ж нам пощастило межувати з державою, дружньою до Вільної Території, торговельні угоди або оборонні пакти можуть послужити нашим інтересам."
 SBA_regional_a_policy_of_liberation_desc: "Після тривалого обговорення Рада Безпеки проголосила політику всесвітнього визволення. Якщо виникне нагода підтримати соціялістичних товаришів або анархістських друзів за кордоном, ми мусимо нею скористатися. Зброя, фінансування, технології... Хай у чому вони матимуть потребу, ми намагатимемося це надати. Станьмо розпалом, від якого в кожній державі спалахне полум'я революції. Це може зашкодити нашій репутації серед світових держав або навіть спровокувати їхню агресію, але якщо ми допоможемо визволитися хоча б одному пригнобленому народові, то знатимемо, що зусилля були не марні."
 SBA_regional_a_policy_of_protection_desc: "Після тривалого обговорення Рада Безпеки проголосила політику захисту. Найменше нам потрібно розлютити Японію чи Німеччину й розпалити нову війну, яка знову спустошить Росію. Якщо соціялісти й анархісти самі визволяться від гнобителів або розпочнуть кампанію визволення у власній країні, вони матимуть нашу цілковиту підтримку - але не нашу зброю. Зрештою, втручання в чужу війну ніколи не приносить добра. Погляньмо на Сполучені Штати: навряд чи вони очікували, що застрягнуть у Південній Африці так надовго."
 SBA_regional_exporting_the_revolution_desc: "Щоб підтримати соціялістичних і анархістських друзів по всьому світу, спершу треба їх знайти. Ми створимо нову організацію - таємну за природою й глобальну за масштабом. Її мета? Вишукувати революціонерів у всьому світі й допомагати їм, навіть тим, хто ще не усвідомив, що є революціонером. Від земель одразу за нашими кордонами до найдальших куточків Африки й Південної Америки наші люди надаватимуть народам засоби та спонуку визволити себе. Дехто назве це пропагандою; ми воліємо називати це правдою."
 SBA_regional_declare_a_safe_harbor_desc: "Світ став жорстоким місцем. Усюди людей переслідують за расу, релігію, ідеологію - назвіть будь-яку ознаку. Вільна Територія не така. Ми - одна з небагатьох держав Землі, що може назвати себе справді вільною. Треба відкрити кордони світові й стати його безпечною гаванню. Якщо ви не маєте наміру чинити зло чи сіяти хаос у наших межах, то ласкаво просимо долучитися до величного експерименту. До того ж імміграція приносить користь і нам: що більше нас буде, то краще ми зможемо себе захистити."
 SBA_regional_an_eye_to_the_world_desc: "Росія - сувора господиня, а наші сусіди ще суворіші. Щоб захиститися, ми мусимо завжди знати, що вони роблять. Задля цього треба створити якусь таємну організацію. Якщо сусіди почнуть мобілізацію проти нас - ми знатимемо. Якщо вони розроблять нові танки й літаки - ми знатимемо. Якщо очільник сусідньої держави піде вигуляти собаку - ми знатимемо. Завдяки новому агентству рука Чорної Армії буде в кожній теці, а око - на кожній державі."
 SBA_regional_solidarity_with_the_world_desc: "Створити розвідувальне агентство непросто. Щоб таємно побудувати щось настільки велике й важливе, потрібні час і терпіння. Треба ухвалити безліч рішень і обрати напрям розвитку. Приміром, оборонні розвідувальні організації часто працюють і влаштовані інакше, ніж агресивніші служби. Можливо, довготривале проникнення й спостереження важливіші за провокації та контрабанду за кордоном. Жоден вибір не є поганим - це лише різні способи розподілити наші ресурси."
 
 ### Power Struggle ###
 SBA_power_struggle_siuda_winning_a_game_i_was_never_playing: "Виграти гру, у яку я не грав"
 SBA_power_struggle_siuda_winning_a_game_i_was_never_playing_desc: "Друга Сибірська війна добігла кінця, і здавалося, що припинення офіційних бойових дій покладе край поневірянням Вільної Території та відкриє нову добу інтеграції й подальшого об'єднання. Та життя ніколи не буває таким простим.\n\nСтєпанов почав вибудовувати власну сферу впливу на колишніх далекосхідних землях, і тепер очевидно, наскільки небезпечною може стати ця боротьба. По той бік Байкалу вже спалахнуло протистояння, розпалене зрадником Стєпановим, тож настав час діяти.\n\nСіуду приголомшила ця підступна зрада - та ще й із боку найближчого оточення, - але його рішучість непохитна як ніколи. Щоб анархізм вижив, Сіуда мусить вистояти. У цій боротьбі йому доведеться грати за правилами Стєпанова, інакше анархізм зникне назавжди."
 SBA_power_struggle_siuda_something_we_can_all_agree_on: "Те, у чому ми всі згодні"
 SBA_power_struggle_siuda_something_we_can_all_agree_on_desc: "Щоб залучити жителів Чіти на наш бік, слід нагадати їм просту й незаперечну істину: монархізм - застаріла й безглузда система правління, що раз по раз доводила свою неспроможність. Після повалення цього гнилого ладу Лютневою революцією він мав навіки лишитися в могилі. Як монархія знову проросла на Далекому Сході, годі збагнути бодай одному анархістові. Настав час нагадати чітинцям, чому вона загинула, і показати їм найкращі сторони анархізму.\n\nЩоб люди Чіти побачили, чого можна досягти завдяки співпраці із сусідами, їм потрібен маяк анархізму. Заодно ми зможемо позбутися останнього пам'ятника монархії та просвітити чітинців.\n\nВідновивши й переобладнавши царський палац, ми перетворимо його на місце засідань міської ради. Так ми вб'ємо двох зайців одним пострілом, а пропагандистська цінність перебудови буде неоціненною й напевно прихилить значну частину населення до справжнього анархізму."
 SBA_power_struggle_siuda_an_unspeakable_evil_again: "Знову невимовне зло"
 SBA_power_struggle_siuda_an_unspeakable_evil_again_desc: "Перед вірним Сіуді вищим командуванням стоїть просте, але спантеличливе питання: чому Амур потрапив до рук нацистів? Наймерзенніша ідеологія, винна в незліченних смертях і руйнуваннях, не кажучи вже про розпад Росії, змогла пустити коріння в Амурі. Як це сталося, досі лишається загадкою, та часу обмаль і треба діяти.\n\nСіуда вирішив розпочати кампанію денацифікації Амурського краю. Ця програма має наблизити населення Амура до справжньої суті анархізму, але водночас послужить знаряддям знищення самого образу нацизму у Вільній Території. Одним із головних пропагандистських завдань стане демонтаж привезеної з Харбіна неонової свастики: її вибух запишуть і поширять серед населення. Просто щоб ніхто не пропустив метафори."
 SBA_power_struggle_siuda_pull_the_rope_taut: "Натягнути мотузку"
 SBA_power_struggle_siuda_pull_the_rope_taut_desc: "Маґаданські фашисти аж ніяк не чисті й не добросерді. Коли жителі портового міста голодували й замерзали на вулицях, фашисти сиділи на горі багатств і американського фінансування. Маґаданці більше не страждатимуть від цієї несправедливости.\n\nЩоб викорінити фашистів і повернути владу народові, ми мусимо розподілити між людьми завезену з Америки зброю та розповісти кожному в портовому місті про злочини, які чинили проти них фашисти в минулі роки. Нагадування про те, що ті часи вже позаду, а найкраще лише починається, напевно приверне місто на бік Сіуди."
 SBA_power_struggle_siuda_remember_the_tyrant: "Пам'ятати тирана"
 SBA_power_struggle_siuda_remember_the_tyrant_desc: "Спитайте будь-якого ворога авторитаризму на просторах Далекого Сходу, ким був Ґєнріх Яґода, і вам розкажуть про уламки колишньої Далекосхідної Совєцької Соціялістичної Республіки. Розкажуть про нескінченні заходи секурократії. Про те, як НКВД вибивав двері серед ночі - усе в ім'я приреченої держави. Про Сибірську війну проти Центральносибірської республіки, яка лише виснажила обидві сторони й спустошила колиску сибірського анархізму. Чому ж тоді жителі Іркутска досі згадують цього божевільного з теплотою?\n\nЦе, без сумніву, загадка, але зараз не час міркувати, чому дехто обожнює тирана, - час знищити пам'ять про нього. Усім, хто забув найгірші звірства НКВД, покажуть жахи правління Яґоди - хочуть вони того чи ні."
 SBA_power_struggle_siuda_a_black_october: "Чорний Жовтень"
 SBA_power_struggle_siuda_a_black_october_desc: "Народ неминуче мав повстати проти секурократичного гніту Яґоди й покласти край жахливій системі. Це відважне повстання очолив Валєрій Саблін, і колись його наміри були чистими. Але щойно він дістав бодай крихту влади, то зрадив власні переконання. Запровадивши призов, винищення політичних ворогів та безліч інших репресивних заходів, Валєрій Саблін невдовзі став напрочуд схожим на того, проти кого виступив. Навіть тепер у Бурятії є люди, які досі звеличують учинки Сабліна. Цьому треба покласти край.\n\nЯк у Бурятії стався так званий «Другий Червоний Жовтень», так і ця жахлива помилка потребує противаги: у місті відбудеться перший Чорний Жовтень, і всі пізнають дива анархізму."
 SBA_power_struggle_siuda_the_opium_of_the_masses: "Опіят для мас"
 SBA_power_struggle_siuda_the_opium_of_the_masses_desc: "Питання релігії та церкви викликає у Вільній Території гострі суперечки. Релігія тут цілком законна, але сама думка про надання церкві будь-якої влади непокоїть багатьох у комунах - зокрема й самого Сіуду. Звісно, мешканці північних сибірських пусток наших почуттів не поділяють. Щоб схилити їх на наш бік, доведеться знайти компроміс із місцевими комунами.\n\nЦе, ймовірно, неабияк підвищить нашу популярність, але може не вистачити, щоб прихилити до нас увесь край. Тому вирішено, що під час подорожі на північ Сіуда заснує низку благодійних установ. Трохи удачі - і північ стане на наш бік."
 SBA_power_struggle_siuda_an_alliance_with_capital: "Союз із капіталом?"
 SBA_power_struggle_siuda_an_alliance_with_capital_desc: "Наш багаторічний комісар економічних справ Міхаїл Кільчічаков опікувався розподілом багатств, рівністю комун, утриманням Чорної Армії та багатьма іншими справами. Його посада життєво важлива для існування Вільної Території, а поширення анархізму Сибіром змусило залучити до неї нових людей, зокрема Васілія Шукшіна, і створити новий орган - «Комунну раду економічного управління». Ця могутня й аполітична система може як урятувати анархізм, так і згубити його.\n\nЗвісно, ми воліли б, щоб анархізм вижив. Сіуда звернеться до ради й попросить підтримати нашу справу. Якщо її члени справді дбають про анархізм, усе мине без проблем."
 SBA_power_struggle_siuda_is_there_anything_she_cant_do: "Чи є щось, чого вона не вміє?"
 SBA_power_struggle_siuda_is_there_anything_she_cant_do_desc: "Серед усіх прибічників Сіуди Євґєнія Таратута вже багато років була наставницею для незліченних людей і жодного разу не похитнулася у своїй вірності анархістській справі. Та коли ми взялися укріплювати комуни, стало зрозуміло: щоб переконати народ Сибіру, нам потрібна людина з особливими здібностями. Письменницький досвід і талант Таратути можуть стати безцінними в цій безперервній боротьбі за владу.\n\nТакій майстерній письменниці буде зовсім неважко написати дитячу книжку про пригоди... героя, який бореться за мрію про анархізм... у казковому світі проти лихого... дракона, що бажає російському народові іншої долі.\n\nЗгодом ця книжка напевно стане бестселером."
 SBA_power_struggle_siuda_appealing_to_a_higher_power: "Звернутися до вищої сили?"
 SBA_power_struggle_siuda_appealing_to_a_higher_power_desc: "Одним із найвищих командирів Сибірської Чорної Армії є наш Валєнтєєв. Він із Сіудою розмовляє нерідко, але здебільшого про службові справи, і друзями вони себе назвати не можуть. Та перед лицем найбільшої загрози для анархізму союзи не можна визначати наявністю чи відсутністю дружби.\n\nСіуда влаштує приватну зустріч із Валєнтєєвим і зі шкури вилізе, щоб заручитися його підтримкою справжнього анархізму. Зараз ми мало що можемо зробити, тож мусимо зібрати якнайбільше підтримки - за всяку ціну."
 SBA_power_struggle_siuda_a_russia_for_us_all: "Росія для всіх нас"
 SBA_power_struggle_siuda_a_russia_for_us_all_desc: "Ніщо так не віддане свободі й визволенню людства, як анархізм. Від Камчатки до меж Західносибірської рівнини він панує безроздільно. Спроба Стєпанова захопити владу обернулася цілковитою катастрофою, і тепер зрозуміло, що анархізм більше не має жодних внутрішніх суперників.\n\nВитримавши перше випробування, анархізм постав законним, могутнім і, понад усе, нестримним. Тепер лишається об'єднати половину Росії, ще вільну від сталевої хватки Німеччини, а потім рушити далі. Боротьба буде довгою й тяжкою, та анархізм вистоїть. Інакше й бути не може."
 
 SBA_power_struggle_stepanov_winning_the_long_game: "Перемога в довгій грі"
 SBA_power_struggle_stepanov_winning_the_long_game_desc: "Ще від останніх днів Центральносибірської республіки заколот Івана Стєпанова й перехід до Сибірської Чорної Армії живила одна-єдина мета.\n\nЗосередити владу у власних руках і врятувати Вільну Територію від її виродженого анархізму. За десятиліття в Сибірській Чорній Армії мета Івана Стєпанова анітрохи не змінилася, і він невтомно працював, щоб здобути владу у Вільній Території. Далекий Схід тепер відкриває безліч можливостей, а популізм Сіуди ще не встиг пустити там коріння - шлях до нової доби анархізму вільний.\n\nГру розпочато. Нехай Стєпанов твердою рукою веде Росію й безжально б'є слабких анархістів із почту Сіуди."
 SBA_power_struggle_stepanov_the_imperial_realm: "Імперські володіння"
 SBA_power_struggle_stepanov_the_imperial_realm_desc: "У Чіті досі лишається чимало аристократів, яким вдалося уникнути зашморгу наступальної армії Вільної Території. Офіцери, генерали, фельдмаршали й урядовці так чи інакше зберегли вплив і досі втримують владні позиції.\n\nЯкщо ми хочемо закріпитися в Чіті, то скористаємося звичними способами задобрювання цих аристократів бенкетами й розвагами. Якщо все мине добре, місто стане новим оплотом впливу Стєпанова, а анархізм Сіуди ще на крок наблизиться до небуття."
 SBA_power_struggle_stepanov_a_man_much_like_myself: "Людина, дуже схожа на мене"
 SBA_power_struggle_stepanov_a_man_much_like_myself_desc: "На землях Амура досі повно чорносорочечників, які мріють повернутися до влади; серед них є й примітний колишній підлеглий Родзаєвского. Він звернувся до Стєпанова з угодою, що відкриває чудові можливості. Чорносорочечники ще мають чималі запаси й пропонують Стєпанову та Чорній Армії архіви РФП, пожертви й статки білої еміграції, а за потреби - і силову підтримку. Натомість після успішного перевороту Стєпанова вони знову стануть губернаторами Амура.\n\nНадійність цих чорносорочечників, безперечно, лишається під питанням, та, з огляду на відсутність альтернатив і причин відмовлятися від такої вигідної угоди, вибору в нас може не бути."
 SBA_power_struggle_stepanov_the_cowards_foundation: "Опора боягуза"
 SBA_power_struggle_stepanov_the_cowards_foundation_desc: "Однією з найбільших помилок маґаданської РФП була надмірна залежність від ненадійних іноземних військ. Точніше - від найманців. Армія держави Матковского виявилася нездатною очолювати цілу країну, але найманців можна використати для вужчих завдань.\n\nПісля повного розгрому Далекого Сходу маґаданські найманці розвіялися краєм, мов порох за вітром, та, подейкують, і досі беруть замовлення. Якщо ми хочемо стати справжньою професійною силою, треба зібрати ці розпорошені елементи під нашим крилом. Невдовзі до лав Чорної Армії приєднається нове військо охоронців і особистої варти, віддане виживанню Вільної Території."
 SBA_power_struggle_stepanov_purchase_the_commissars: "Купити комісарів"
 SBA_power_struggle_stepanov_purchase_the_commissars_desc: "У землях навколо Байкалу досі перебуває чимало колишніх комісарів НКВД, відомих бойовою вправністю та вмінням забезпечувати покору війська. Якщо ці колишні НКВДисти не мають нічого проти того, щоб підтримувати бойовий дух - незалежно від конкретної армії чи справи, - Сибірська Чорна Армія стане значно сильнішою.\n\nЗвісно, мало кого з бійців НКВД вдасться переконати приєднатися до Стєпанова, та в нас є засіб схилити нерішучих на свій бік. Якщо вони вступлять до його війська, ми зробимо все можливе, щоб ці хоробрі солдати жили в розкошах і насолоді - доки допомагатимуть придушувати невдоволення, коли це знадобиться."
 SBA_power_struggle_stepanov_the_power_of_populism: "Сила популізму"
 SBA_power_struggle_stepanov_the_power_of_populism_desc: "Дві найбільші переваги будь-якого політика - уміння переконати натовп пристати до його справи та здатність розуміти власні найгірші вади. На лихо Іванові Стєпанову, завдяки другому він добре знає, що першого йому бракує. Так само добре він знає й те, що чудово діє на жителів Бурятії: популізм.\n\nУсім у Чорній Армії відома проста істина: ми не можемо допустити, щоб Сіуда дістався краю раніше за нас. Якщо бодай шепіт його слів перетне Байкал, ми можемо цілковито втратити Бурятію. Цього не можна допустити. Хай Стєпанов і нездара в промовах, навіть поганий виступ незрівнянно кращий, ніж просто віддати край Сіуді."
 SBA_power_struggle_stepanov_confessional_with_the_lord: "Сповідь перед Господом"
 SBA_power_struggle_stepanov_confessional_with_the_lord_desc: "Північні пустки Сибіру сповнені релігії, і мало хто заперечить просту істину: немає ідеології, ворожішої до церкви, ніж анархізм. Сіуда спробує обманути жителів півночи, нібито він не зневажає саму думку про релігію, та ми знаємо, що це неправда. Якщо хтось і попередить північні землі про наміри Сіуди, то саме ми.\n\nІван Стєпанов вирушить на північ Сибіру й розповість про жахливі переконання Сіуди, примусово насаджуваний державний атеїзм та намір силоміць загнати північ до Вільної Території. Правдивість цих тверджень можна обговорювати, але саме нашому відважному лідерові Стєпанову випаде обов'язок попередити православних братів про зло анархізму."
 SBA_power_struggle_stepanov_return_to_form: "Повернення до звичного"
 SBA_power_struggle_stepanov_return_to_form_desc: "Поки Іван Стєпанов мандрував Далеким Сходом, удома зростали нестабільність і гнів: він більше не міг особисто стримувати крайнощі анархізму. У Томску протести дедалі набирали сили, відколи Сибірська Чорна Армія почала ще глибше проникати в державний апарат Вільної Території; люди також вимагали повернення Стєпанова до Центрального Сибіру.\n\nПросіть - і дістанете. Вправні солдати вдома вже розтрощили протести, тож тепер у нас є кілька відважних бійців Сибірської Чорної Армії та значно менше жителів Томска. Настав час винагородити солдатів, які виконали наказ. Таку нагороду дістають усі, хто служить інтересам Стєпанова, і в найближчі місяці ми, вочевидь, роздамо ще безліч медалей."
 SBA_power_struggle_stepanov_calling_up_an_old_friend: "Покликати старого друга"
 SBA_power_struggle_stepanov_calling_up_an_old_friend_desc: "Іван Стєпанов і генерал Андроній Мішурєнко вже багато років є близькими союзниками з волі обставин - ще відтоді, як приєдналися до Сибірської Чорної Армії та Вільної Території. Жоден із них не є справжнім анархістом і обоє лише на словах віддані анархізмові, але для війська вони стали незамінними. На цьому їхня подібність закінчується.\n\nСтєпанов невтомно працював, щоб стати головним лідером Вільної Території, тоді як Мішурєнко готував Сибірську Чорну Армію до визволення Росії від німецьких окупантів. Попри всі відмінності, давні спроби Стєпанова прихилити Мішурєнка мусять нарешті дати результат - інакше він назавжди втратить близького союзника."
 SBA_power_struggle_stepanov_cut_the_head_off_the_snake: "Відрубати змії голову"
 SBA_power_struggle_stepanov_cut_the_head_off_the_snake_desc: "Кісткою в горлі Стєпанова був і досі лишається найвищий виборний офіцер Сибірської Чорної Армії. Непохитна відданість Стєпана Валєнтєєва анархізмові лише послаблює наші позиції у війську. Він найаполітичніший з усіх військових Вільної Території, але водночас останній можливий союзник Сіуди. До вирішальних днів лишається дедалі менше часу. Через тверді ідеологічні переконання Валєнтєєва ми вже не встигнемо схилити його на свій бік. Отже, рішення просте.\n\nВалєнтєєв надто могутній, надто ворожий до наших поглядів і надто глибоко перебуває у сфері Сіуди, щоб його ще можна було врятувати. Який жаль, що саме зараз з'явилася змова... радикального анархіста-екстреміста, який хоче очистити Сибірську Чорну Армію від усякого етатизму.\n\nЯкий жаль для Валєнтєєва."
 SBA_power_struggle_stepanov_a_russia_of_my_own: "Моя власна Росія"
 SBA_power_struggle_stepanov_a_russia_of_my_own_desc: "Іван Стєпанов трудився заради своєї мрії так, наче іншого вибору не існувало. І тепер його справді немає.\n\nСтєпанов усе життя боровся за цей день. Кожна мета, кожен обов'язок і кожне прагнення були лише породженням його бажання очолити Росію. Корумпований, неспроможний анархізм стоїть у нього на шляху, та в серці Івана Стєпанова немає ані жалю, ані смутку через власні вчинки. Таким був план, і він здійснюється без помилок, вагань і докорів сумління.\n\nУсі важелі влади міцно затиснуті в руках Івана Стєпанова. Анархізм Сіуди боровся з ним на кожному кроці, але цього було замало, щоб спинити неминуче сходження Івана Стєпанова.\n\nНехай Росія живе вічно, а Стєпанов стане до стерна."
 
 ### LibSoc Superregional ###
 SBA_superregional_libsoc_the_second_test: "Друге випробування"
 SBA_superregional_libsoc_the_second_test_desc: "Анархісти перемогли! Наша країна ледь не перетворилася на таку саму деспотичну державу воєначальника, якими стали багато сусідів, але Пьотр Сіуда та його прибічники зуміли організуватися й відбити мерзенний переворот Стєпанова. Коли Стєпанов зійшов зі сцени, для Сибірської Вільної Території настав новий світанок. Куди ми рушимо далі та що Сіуда зробить із новою владою в Раді Безпеки - невідомо. Лишається сподіватися, що він не зречеться анархістських ідеалів, які привели нас сюди."
 SBA_superregional_libsoc_what_they_can_never_take_away_from_us: "Те, чого в нас не відняти"
 SBA_superregional_libsoc_what_they_can_never_take_away_from_us_desc: "Стєпанов доклав чимало зусиль, щоб стерти межу між анархізмом і тим, що ним не є. Його широкі авторитарні укази та вчинки змусили громадян засумніватися, що взагалі означає анархізм. Становище ускладнює те, що більшість людей не знала й досі не знає його справжньої суті. Наш провідник Пьотр Сіуда виголосить промову про основні права людини та засади анархізму. Сподіваємося, це розпочне обговорення ідеології та допоможе громадянам зрозуміти свої права у Вільній Території."
 SBA_superregional_libsoc_our_attachment_to_liberty: "Наша відданість свободі"
 SBA_superregional_libsoc_our_attachment_to_liberty_desc: "Щоб лишитися вільним народом у Вільній Території, ми мусимо бути готові дати відсіч численним охочим відібрати нашу свободу. Воєначальники на кожному кордоні прагнуть нас поневолити, бо таких, як ми, більше немає. А за ними стоять ще страшніші загрози - Німеччина та Японія, чию жахливу могутність нині видно в Москві й Пекіні. Кожні чоловік і жінка повинні бути готові взяти зброю на захист нашого способу життя, коли цього вимагатимуть обставини, інакше ми неминуче загинемо."
 SBA_superregional_libsoc_make_our_message_clear: "Чітко донести нашу ідею"
 SBA_superregional_libsoc_make_our_message_clear_desc: "Попри всі наші зусилля, більшість людей досі не розуміє анархізму. Багато громадян навіть не думають про землі за межами сусідніх комун. Сіуда дедалі виразніше бачив це в розмовах із жителями Вільної Території. Вражений їхнім незнанням, він написав і видав книжку зі своїми та чужими поглядами на анархізм і на те, чим він є у Вільній Території, сподіваючись зробити ідеологію зрозумілішою пересічному читачеві."
 SBA_superregional_libsoc_make_our_message_clear_tt: "Ми фінансуватимемо школи, щоб навчати людей §eтеорії анархізму§!.\n"
 SBA_superregional_libsoc_we_will_stand_shoulder_to_shoulder: "Ми стоятимемо пліч-о-пліч"
 SBA_superregional_libsoc_we_will_stand_shoulder_to_shoulder_desc: "Ваша комуна - ваш дім, а навколишні комуни - ваші сусіди! Слід завжди пам'ятати, що співгромадяни у Вільній Території - такі самі анархісти, й ніколи не вважати їх ворогами через расу, релігію чи будь-що інше. Натомість пересічний громадянин має пильно стежити за Генеральною Асамблеєю. Це орган представництва всіх громадян, але його владою легко зловживати, якщо партія чи коаліція здобуде забагато місць. Стережіться ворога-етатиста, а не ближнього."
 SBA_superregional_libsoc_freedom_must_be_protected: "Свободу треба захищати"
 SBA_superregional_libsoc_freedom_must_be_protected_desc: "Сибірська Чорна Армія ледь не розпалася, бо комуни були надто заклопотані власними проблемами й політикою, щоб спинити повзуче посилення Стєпанова. Військо ставало дедалі могутнішим, а майже ніхто не втручався. Більше цього не буде. Чорна Армія вже не діятиме незалежно від Генеральної Асамблеї, а буде прикута до неї. Відтепер Асамблея зможе на власний розсуд усувати й переставляти генералів та командирів, щоб жоден новий Стєпанов ніколи не сягнув колишніх висот влади."
 SBA_superregional_libsoc_lessons_from_stepanovs_coup: "Уроки перевороту Стєпанова"
 SBA_superregional_libsoc_lessons_from_stepanovs_coup_desc: "Ми пройшли довгий шлях. Майже десять років минуло від появи Сибірської Вільної Території й майже два десятиліття - від нашої втечі на схід під час Другої світової війни. Та лише кілька місяців тому переворот Стєпанова знову назавжди нас змінив. Світ змінюється так стрімко, але здається, що Росія та її народ зовсім не змінилися - хіба що багато хто став озлобленим. Нам лишається вчитися й пристосовуватися до цього дивного нового світу."
 SBA_superregional_libsoc_there_is_no_such_thing_as_harmless_power: "Безпечної влади не буває"
 SBA_superregional_libsoc_there_is_no_such_thing_as_harmless_power_desc: "Генеральну Асамблею створили з найкращими намірами, але наш фактичний лідер Пьотр Сіуда дійшов висновку, що й вона здатна пригнічувати. Голоси малих сільських комун в Асамблеї можуть переважити голоси більших міських громад, ставлячи їхні інтереси вище за інтереси інших. Це неприйнятно, якщо ми й далі називаємо себе анархістами. Відтепер Генеральною Радою керуватиме пряме народне голосування, а комуни дістануть ще більше незалежности."
 SBA_superregional_libsoc_just_the_bare_minimum: "Лише необхідний мінімум"
 SBA_superregional_libsoc_just_the_bare_minimum_desc: "Ми й далі твердо віримо, що анархізм життєздатний і кращий за всі інші ідеології. Та лишається факт: у майбутньому для нашого захисту буде потрібна організація людей і загальних ресурсів, яку здатен забезпечити уряд. Генеральній Асамблеї дозволять створити невелику бюрократію лише для найнеобхіднішого економічного й комунного управління. Цей уряд буде якнайменшим, а всі законодавчі й судові повноваження залишаться в окремих комун."
 SBA_superregional_libsoc_our_disdain_for_tyrants: "Наша зневага до тиранів"
 SBA_superregional_libsoc_our_disdain_for_tyrants_desc: "Держава - лише знаряддя, яким сильні б'ють слабких. Яким багаті грабують бідних. Яким ненависники гноблять тих, кого ненавидять. Яким можновладці нагромаджують ще більше влади. Доки такий механізм існує, народ страждатиме. Тому Чорна Армія ніколи його не прийме. Ми відкинемо фашистів, комуністів, демократів і всіх прибічників держави - великої чи малої. Ми боротимемося проти кожного, хто спробує нав'язати нам авторитарні порядки. Вільна Територія залишиться вільною!"
 SBA_superregional_libsoc_dealing_with_the_snakes_in_our_garden: "Позбутися змій у нашому саду"
 SBA_superregional_libsoc_dealing_with_the_snakes_in_our_garden_desc: "Ми викорінили Стєпанова та найближче коло його союзників, але в Чорній Армії ще багато прибічників його самого або принаймні його ідей. Ба більше, останніми роками військо загалом стало значно авторитарнішим та етатистськішим і дозволяє собі в управлінні та війні те, що колись було неприйнятним. Треба повідомити про це Генеральну Асамблею й реформувати армію, бо її нинішні дії неприйнятні - особливо якщо ми хочемо лишатися справжнім анархістським суспільством."
 SBA_superregional_libsoc_emancipating_themselves: "Спокутувати провину працею"
 SBA_superregional_libsoc_emancipating_themselves_desc: "Ми подали Генеральній Асамблеї список із кількох сотень найгірших злочинців у Чорній Армії: тих, хто зловживав владою, вимагав данину з комун, погрожував невинним військовою силою, а часом навіть підбурював до насильства. Ми вимагали правосуддя й очікували, що за злочини їм відплатять - бажано розстрілом. Та Асамблея вирішила інакше: вбивати цих людей аморально й небезпечно як прецедент. Сіуда погодився, тож відтепер вони виконуватимуть неоплачувану працю у Вільній Території - усю ручну роботу, потрібну війську."
 SBA_superregional_libsoc_no_clemency_for_tyranny: "Жодної пощади тиранії"
 SBA_superregional_libsoc_no_clemency_for_tyranny_desc: "У Чорній Армії є люди, які роками зловживали становищем. Вони вимагали данину з комун, погрожували невинним військовою силою, а часом навіть підбурювали до насильства. Ці злочини тяжкі й не заслуговують милосердя. Попри протести Генеральної Асамблеї, ми самі здійснимо правосуддя. Зрадників справи й загального добробуту засуджено до розстрілу. Асамблея просто не розуміє: якщо лишити їх живими, вони розкладатимуть систему зсередини. Ми розуміємо й не допустимо цього."
 SBA_superregional_libsoc_how_far_to_go: "Як далеко зайти?"
 SBA_superregional_libsoc_how_far_to_go_desc: "Ми значно просунулися в демонтажі етатистської структури й усуненні тих, хто вів нас до держави. Та лишається велике питання: що робити з Радою Безпеки? Її ліквідація - очевидний крок для тих, хто прагне знищити всі сліди уряду, але вона має чимало переваг, тож поспішати не варто. Хоч як нам прикро це визнавати, Рада чудово організовує армію й ухвалює складні рішення за потреби. Її знищення може зашкодити безпеці Вільної Території. Та якщо вона лишиться, чи зможемо ми справді називатися анархістами?"
 SBA_superregional_libsoc_dissolve_the_security_council: "Розпустити Раду Безпеки"
 SBA_superregional_libsoc_dissolve_the_security_council_desc: "Рада завжди була знаряддям держави, за допомогою якого Стєпанов встановив мерзенний контроль над країною й розпочав переворот. Щоб це ніколи не повторилося, установу треба ліквідувати. Доки вона існує, Вільній Території завжди загрожує повзучий авторитаризм. Сьогодні анархістська ідеологія може здаватися захищеною, але за кілька років генерали-опортуністи в Раді здатні поступово розмити її й надійно перебрати контроль над країною. Цього не можна допустити."
 SBA_superregional_libsoc_empower_the_general_assembly: "Посилити Генеральну Асамблею"
 SBA_superregional_libsoc_empower_the_general_assembly_desc: "Повна ліквідація Ради Безпеки була б бажаною, але компроміс можливий. Рада дає війську організаційні переваги й загалом полегшує ведення війни. Та це не означає, що вона діятиме як раніше. З огляду на владу, яку Стєпанов зміг нагромадити в Раді, відтепер вона суворо підлягатиме Генеральній Асамблеї й більше не зможе скасовувати рішення окремих комун чи самої Асамблеї."
 SBA_superregional_libsoc_our_communal_spirit: "Наш комунний дух"
 SBA_superregional_libsoc_our_communal_spirit_desc: "Геніальність комунної системи не лише в гарантіях політичної, релігійної та економічної свободи, а й у єдності, яку вона дає нашій країні. Комуни сильно різняться розміром і етнічним складом, але всіх нас єднає відданість анархістській справі. Ми вже багато років живемо в комунній системі, тож навряд чи хтось щиро прагне повернутися до варварських, визискувальних та імперіялістичних урядів минулого. Прославмо комунний дух, який приніс нам мир і добробут."
 SBA_superregional_libsoc_we_have_seen_failure_and_persevered: "Ми зазнали невдачі й вистояли"
 SBA_superregional_libsoc_we_have_seen_failure_and_persevered_desc: "Сіуда вирушить у подорож Вільною Територією, щоб розширити власні обрії та зблизитися з жителями комун. Наші громадяни такі різні й розпорошені, що скласти ясне уявлення про їхні думки й настрої нелегко. Подорож країною стала надзвичайно популярною: кілька комун уже готують великі й пишні святкування до його прибуття. Ми зазнали невдачі й вистояли. Вільна Територія житиме!"
 SBA_superregional_libsoc_place_an_emphasis_on_ruralism: "Курс на руралізм"
 SBA_superregional_libsoc_place_an_emphasis_on_ruralism_desc: "Раніше Генеральна Асамблея й військо надавали великого значення подоланню розриву між містом і селом у Вільній Території. Та Сіуда дійшов висновку, що цей розрив насправді зміцнює країну. Асамблея гадала, що тісніший зв'язок між міськими й сільськими комунами полегшить обмін ресурсами, до виробництва яких кожна з них пристосована. Натомість Сіуда стверджує, що така торгівля послаблює малі сільські комуни. Якщо міста забезпечують їх усім потрібним, вони не мусять розвиватися. Отже, усунення торгівлі між ними спонукатиме менші комуни зростати."
 SBA_superregional_libsoc_granting_opportunity_to_the_freshly_liberated: "Шанс для щойно визволених"
 SBA_superregional_libsoc_granting_opportunity_to_the_freshly_liberated_desc: "Далекий Схід переповнений монархістами, етатистами, нацистами та всілякими іншими рухами. Їхні порочні ідеології перетворили край на одне з найгірших місць Росії: уряд невпинно стежив за громадянами, поліційні головорізи забирали що хотіли й били непокірних, а найгірше - людей кидали до таборів за інакші погляди. Ми маємо зробити все, щоб допомогти цим нещасним: дамо їм їжу, воду, житло й комуну, де можна оселитися. Згодом вони знову стануть повноцінними членами суспільства й живим пам'ятником тому, що держава робить із людьми."
 SBA_superregional_libsoc_show_them_our_success: "Показати їм наш успіх"
 SBA_superregional_libsoc_show_them_our_success_desc: "Анархізм довів свою життєздатність. Вільна Територія досягла приголомшливого успіху в усьому: комунна економіка процвітає, кордони захищені, права народу забезпечені. Та ми завжди пам'ятаємо про вади й запрошуємо критикувати та обговорювати ідеологію. Ми запросимо мислителів, які не підтримують анархізм, пояснити свої причини й запропонувати кращу, на їхню думку, систему. Понад усе ми заохочуємо це обговорення, щоб наш народ і весь світ побачили: анархізм - життєздатна ідеологія."
 SBA_superregional_libsoc_pull_back_the_curtain: "Зірвати завісу"
 SBA_superregional_libsoc_pull_back_the_curtain_desc: "Капіталісти - лише царисти XX сторіччя. Думка суперечлива, але витримує перевірку: вони визискують, володіють майном і вбивають так само, як їхні попередники. Водночас капіталісти - не більш ніж фашисти, що ховаються за личиною добрих намірів. Багато хто з нами обуриться такій оцінці й скаже, що капіталізм корисний для країни та поліпшить її становище. Але це безперечно хибно, що доводять бананові республіки Центральної Америки та знехтувані бідняки Сполучених Штатів. Єдиний справжній шлях уперед - анархізм, і ми сподіваємося, що люди це зрозуміють, коли завіси інших жорстоких ідеологій буде зірвано."
 SBA_superregional_libsoc_more_drastic_measures: "Рішучіші заходи"
 SBA_superregional_libsoc_more_drastic_measures_desc: "Стає дедалі очевидніше: щоб вижити в цьому похмурому світі, ми мусимо здобути ядерну зброю. Вільна Територія могутня, а нашому народові не бракує мужности й духу, але жодна кількість хоробрих людей і звичайної зброї не спинить ядерного обстрілу. Їхня жахлива сила незрівнянна, і нині ними володіють лише наймогутніші країни. Єдиний спосіб не допустити застосування цієї зброї проти нас - відповісти власною. Якщо нам удасться, незалежність і безпека комун будуть захищені."
 SBA_superregional_libsoc_leave_this_to_the_experts: "Залишити це фахівцям"
 SBA_superregional_libsoc_leave_this_to_the_experts_desc: "Від колишнього Совєцького Союзу та держав-воєначальників, що постали на його місці, лишилося чимало науковців і ядерних фахівців; багато з них живуть на наших землях. Варто залучити їх до створення дієвої ядерної зброї. Старі совєцькі документи свідчать, що Союз почав розробляти ядерні технології ще 1942 року й значно просунувся до розпаду. Деякі записи містять технічні відомості, які старші науковці можуть використати для прискорення програми. Таку небезпечну й важливу технологію краще довірити фахівцям."
 SBA_leave_this_to_the_experts_tt: "Ми розпочнемо §Yядерну програму§! з річними витратами §Y150 млн доларів США§!."
 SBA_superregional_libsoc_scrounge_up_the_blueprints: "Розшукати креслення"
 SBA_superregional_libsoc_scrounge_up_the_blueprints_desc: "Є сотні, якщо не тисячі, старих совєцьких технічних документів і планів щодо розвитку ядерних технологій. Хоч вони ніколи не були головним напрямом совєцьких досліджень, розробники просунулися доволі далеко й навіть створили проєкти перших реакторів під назвою Ф-1. Їх не втілили: після розпаду Совєцького Союзу роботи припинили, а багато креслень розсіялися російськими пустками. Ми мусимо їх здобути. Шукатимемо скрізь - у сховищах колишніх воєначальників і навіть на чорному ринку, якщо буде потрібно."
 SBA_superregional_libsoc_head_to_the_mines: "Рушити до копалень"
 SBA_superregional_libsoc_head_to_the_mines_desc: "Ядерна зброя не діє без урану. Цей нестабільний елемент визнано найкращим подільним матеріалом для великих і простих ядерних пристроїв, тож він потрібен для нашої першої бомби. Поблизу кількох гірничих комун Вільної Території є уранові поклади. Треба заохотити їх видобувати матеріал для програми й дослідів. Урану знадобиться багато, тому доручимо його збір відразу кільком комунам."
 SBA_superregional_libsoc_give_them_all_they_need: "Дати їм усе потрібне"
 SBA_superregional_libsoc_give_them_all_they_need_desc: "Розвиток ядерних технологій стає дедалі дорожчим і ресурсомісткішим. Науковці просять усе більше подільного матеріалу, обчислювальної техніки й працівників для лабораторій. Сіуда охоче підтримує проєкт заради спільної безпеки Вільної Території, але Генеральна Асамблея не в захваті: дехто навіть стверджує, що така технологія завдасть більше шкоди, ніж користи. Ці заперечення безглузді й суперечать нашим цілям. Переконаймо Асамблею: забезпечити науковців усім потрібним - життєво важливо для нашого виживання."
 SBA_give_them_all_they_need_tt: "Збільшує §Yщомісячний приріст поступу§! на §Y1%§! із річними витратами §Y50 млн доларів США§!."
 SBA_superregional_libsoc_all_hands_on_deck: "Усі до роботи"
 SBA_superregional_libsoc_all_hands_on_deck_desc: "Боротьба за ядерну зброю - це боротьба проти самої держави. Наш хрестовий похід спрямовано проти елітарности та контролю, які держава часто нав'язує громадянам. Вільна Територія уособлює все, чим не є навколишні уряди: справжню свободу для всіх своїх складових. Отже, розвивати ядерні технології та зброю ми мусимо гуртом, використовуючи досвід усіх комун і даючи кожному можливість долучитися. Ми обійдемо комуни й запросимо чоловіків та жінок допомогти в анархістській боротьбі за ядерну зброю."
 SBA_superregional_libsoc_permit_input_from_all: "Вислухати кожного"
 SBA_superregional_libsoc_permit_input_from_all_desc: "Раніше ми зверталися по поради до фахівців і знавців у цій маловідомій галузі технологій, але тепер зрозуміли: ширше коло думок може принести справі більше користи. Простий народ здатен допомогти в питаннях управління, металообробки, промислового виробництва та багатьох інших. Та й хіба ми анархісти, якщо не намагаємося залучити до процесу якнайбільше людей?"
 SBA_superregional_libsoc_from_the_mines_to_the_labs: "Від копалень до лабораторій"
 SBA_superregional_libsoc_from_the_mines_to_the_labs_desc: "Чимало гірників щодня працює з ураном. Вони видобувають його, водії перевозять, і лише потім матеріал потрапляє до рук науковців. Ці звичайні люди мають цінний досвід роботи з елементом, який завдає нашим ученим чимало клопоту під час створення бомби. Можливо, варто залучити їх і скористатися знаннями про поводження з радіоактивним матеріалом."
 SBA_superregional_libsoc_together_nothing_is_impossible: "Разом немає неможливого!"
 SBA_superregional_libsoc_together_nothing_is_impossible_desc: "Наші дослідження просунулися далеко! Завдяки сукупним знанням і досвіду мільйонів жителів Вільної Території суспільство стоїть на порозі ядерної доби. Невдовзі чисті ядерні реактори живитимуть наші домівки, а могутні ядерні бомби їх захищатимуть. Анархістська ідеологія довела: без втручання й керівництва владної держави незалежні люди здатні на все - навіть створити ядерну зброю."
 SBA_superregional_libsoc_harnessing_the_ultimate_deterrent: "Опанувати найвищий засіб стримування"
 SBA_superregional_libsoc_harnessing_the_ultimate_deterrent_desc: "Наше досягнення просто неймовірне. Незалежно від остаточного результату, ми мобілізували ресурси сотень комун без гнітючого центрального уряду. Ми довели, що анархістське суспільство не лише можливе, а й дієздатне. Ніхто більше не скаже, що воно не здатне організуватися настільки, щоб стати загрозою. Навіть якщо наш ядерний запас ніколи не зрівняється з німецьким чи японським, сама наша здатність бути організованою військовою загрозою може захистити нас."
 
 ### Despotist Superregional ###
 
 SBA_superregional_despotist_the_king_of_the_anarchic_wastes: "Король анархічних пусток"
 SBA_superregional_despotist_the_king_of_the_anarchic_wastes_desc: "Довгий шлях привів нас до вершини військових і суспільних досягнень. Від приток Обі до берегів Маґадану, від вулиць Томска до верхоянських вершин наша Чорна Армія тріюмфує над усім Сибіром. Іван Стєпанов підніс нашу славну справу на небачені висоти й тепер править цими безмежними землями як некоронований король."
 SBA_superregional_despotist_the_deliberations_of_stepanov: "Роздуми Стєпанова"
 SBA_superregional_despotist_the_deliberations_of_stepanov_desc: "Чорна Армія перемогла в Сибіру, тож настав час важливих рішень. Передусім: як керувати цим краєм? Формуючи майбутнє, ми мусимо обережно зрівноважити ідеалізм первісної Чорної Армії з потребами й відповідальністю великої сили. Чи має Стєпанов захопити необмежену владу й повести територію до нових тріюмфів, ризикуючи наразитися на спротив через зраду засадничих ідеалів? Чи краще вичікувати, діяти непомітно й виявляти належну повагу до традицій, що привели нас сюди? Від цього вибору може залежати майбутнє Сибіру."
 SBA_superregional_despotist_put_on_a_good_show: "Влаштувати гарну виставу"
 SBA_superregional_despotist_put_on_a_good_show_desc: "Ми безперечно мусимо посилити хватку на Сибіру, але не можемо просто проголосити диктатуру. Територія негайно повстане, і нашим планам - як і нам самим - настане кінець. Треба діяти тонше: працювати в межах усталених порядків і традицій Чорної Армії та відсувати комуни лише тоді, коли вони вже не матимуть жодної надії опиратися. Сибір не стане нашим за одну ніч, та квапитися не можна."
 SBA_superregional_despotist_fighting_off_the_vultures: "Відігнати стерв'ятників"
 SBA_superregional_despotist_fighting_off_the_vultures_desc: "Чорна Армія підкорила найобширніший і найсуворіший край планети, але багато хто досі вважає нас слабкими. Від японських маріонеток до деспотів Західної Росії навколо кружляють стерв'ятники, готові дзьобати наше тіло. Тому генерал Стєпанов розпочне нову публічну кампанію зміцнення: широкий набір добровольців, сміливі військові навчання біля ворожих кордонів і навіть нова серія фільмів для народу. Ми створимо образ сили, щоб залякати тих, хто радо розірвав би нас. Звісно ж, у дусі наших анархістських традицій."
 SBA_superregional_despotist_theres_only_room_for_one_state: "Місце є лише для однієї держави"
 SBA_superregional_despotist_theres_only_room_for_one_state_desc: "Суспільна пам'ять напрочуд податлива. Нові пропагандистські листівки й плакати та зміни в навчальних програмах допоможуть створити нову версію історії. У ній Сіуда постане щонайменше недосконалим лідером, чиї амбіції мало не згубили всю Чорну Армію, а генерал Стєпанов - далекоглядним анархістським провідником. Хто контролює минуле, зрештою контролює майбутнє. І саме таким буде наше майбутнє."
 SBA_superregional_despotist_mandatory_freedoms: "Обов'язкові свободи"
 SBA_superregional_despotist_mandatory_freedoms_desc: "Роки боротьби Чорної Армії породили традиції, викувані кров'ю й вогнем. Згодом вони затвердли в закони, яких за звичаєм дотримуються численні сибірські комуни. Уже окреслено як звичайні адміністративні норми, так і вищі засади прав людини, а наше завдання - забезпечити їх виконання. Відрядивши до комун Чорну Армію та озброєні допоміжні загони, ми покажемо всім, що краєм правлять справедливість і сила. У Сибіру будуть закон, порядок і свобода - будь-якою ціною."
 SBA_superregional_despotist_an_officer_on_every_council: "Офіцер у кожній раді"
 SBA_superregional_despotist_an_officer_on_every_council_desc: "Чорна Армія - хребет нашої території. Вона завоювала для нас Сибір і захистила народ від усіх деспотичних та реакційних загроз. Та не кожен житель є солдатом: більшість веде скромне цивільне життя в комунах. Оскільки вони покладаються на наш захист, Чорна Армія повинна дістати більше впливу на місцеве й регіональне управління. Якщо в кожній комунній раді буде принаймні один наш представник, інтереси війська завжди будуть почуті. Це на благо всіх."
 SBA_superregional_despotist_ask_for_permission_first: "Спочатку спитати дозволу"
 SBA_superregional_despotist_ask_for_permission_first_desc: "Роки боротьби Чорної Армії породили традиції, викувані кров'ю й вогнем. З часом вони стали законами, яких за звичаєм дотримуються численні сибірські комуни. Та деякі з них доведеться змінити. Скликавши з'їзд представників комун і країв, ми створимо новий кодекс законів. Він надасть нам значно більшої законности в очах народу й цілком відповідатиме анархістському ідеалові народної волі. Доки процес буде достатньо гнучким, демократія допоможе нам досягти власних цілей."
 SBA_superregional_despotist_advisory_communes: "Дорадчі комуни"
 SBA_superregional_despotist_advisory_communes_desc: "Система комун є основою суспільного ладу наших земель. Більшість людей - селяни, ремісники чи освічені фахівці - живе в комунах. Їхні ради досі були й головним органом управління, розподіляли ресурси та вершили правосуддя. Але так тривати не може. З появою Ради Безпеки й потребою керувати безмежним Сибіром стало очевидно: сільські невігласи, що розподіляють урожай і призовників, - не основа для системи правління. Комунні ради можуть лишитися дорадчими, але відтепер усю важку адміністративну роботу виконуватиме керівництво Чорної Армії."
 SBA_superregional_despotist_the_ascendancy_of_military_anarchism: "Сходження авангардного анархізму"
 SBA_superregional_despotist_the_ascendancy_of_military_anarchism_desc: "Старі традиції комунного правління добрі, але світ небезпечний, і вороги мусять боятися нашої сили. Ми можемо здіймати чорний прапор, а солдати - цитувати Бакуніна, та ми все одно армія. Поєднавши ідеали анархізму з відданістю захистові й розширенню наших здобутків, Чорна Армія переможе. Авангардний анархізм піднісся над нашими землями, і ми віддамо життя за його захист."
 SBA_superregional_despotist_keeping_the_generals_in_check: "Тримати генералів у шорах"
 SBA_superregional_despotist_keeping_the_generals_in_check_desc: "Чорною Армією можуть керувати люди, що називають себе «анархістами», та офіцерський корпус у ній однаково є. У Раді Безпеки панує жменька генералів, які здобули відданість військ добротою або жахом. Із ними треба поводитися обережно. Кожен має вади й чесноти, і не кожного варто лишати поруч."
 SBA_superregional_despotist_kilchichakovs_greed: "Жадібність Кільчічакова"
 SBA_superregional_despotist_kilchichakovs_greed_desc: "Міхаїл Кільчічаков - тягар. Принаймні так про нього говорять. Його головна причина піднестися в керівництві Чорної Армії - жадібність, і це всім відомо. Він постійно привласнює частину коштів із бюджетів і реквізицій. Водночас він компетентний: його адміністрація вправно керує великими просторами, а сам Кільчічаков - добрий генерал. Він буде вірним і корисним, а його надмірності, хоч і викликають огиду, легко сховати. Міхаїла можна лишити, доки він не стане більшою ганьбою, ніж цінним помічником."
 SBA_superregional_despotist_mishurenkos_toy_soldiers: "Іграшкові солдати Мішурєнка"
 SBA_superregional_despotist_mishurenkos_toy_soldiers_desc: "Андроній Мішурєнко - палій війни й пишається цим. На засіданнях Ради він постійно вимагає нових наборів, нового спорядження й нових наступів проти ворогів Чорної Армії. Доброзичливий спостерігач назвав би його захопленим. Менш доброзичливий - скаженим божевільним, а ми аж ніяк не доброзичливі. Та Мішурєнко - здібний і доволі вірний нам генерал. Його можна лишити, доки кровожерливі дивацтва не заведуть нас за край. Але яка ймовірність такого?"
 SBA_superregional_despotist_valenteevs_scheming: "Підступи Валєнтєєва"
 SBA_superregional_despotist_valenteevs_scheming_desc: "Стєпан Валєнтєєв - загроза, і від цього нікуди не подітися. Вони із Сіудою були давніми друзями та ідейними товаришами, а Валєнтєєв, імовірно, вважає себе природним наступником. До того ж він добрий у своїй справі: відзначився в боях і користується повагою рядових Чорної Армії. Досвід і здібності роблять його надто небезпечним. Треба усунути його так, щоб ми могли все заперечити: невдала дрібна операція, дружній вогонь чи щось подібне. Найважливіше - Валєнтєєв мусить померти."
 SBA_superregional_despotist_an_open_secret: "Відкрита таємниця"
 SBA_superregional_despotist_an_open_secret_desc: "Іноді потрібна поступовість, а діяти слід украй обережно, щоб перебіг подій не став некерованим.\n\nЦе не такий випадок.\n\nБезмежні сибірські землі під нашою владою треба зламати й підкорити волі Стєпанова. Інакше чернь Чорної Армії опиниться під владою людей на кшталт Валєнтєєва. Цього не можна допустити. Ми мусимо перебрати контроль над військом, Чорною Армією, комунами й кожною людиною на наших землях. Народ називатиме нас диктаторами в анархістському вбранні, але якщо ми переможемо, їхні слова нічого не важитимуть."
 SBA_superregional_despotist_the_greatest_threat_is_inside_us: "Найбільша загроза - всередині"
 SBA_superregional_despotist_the_greatest_threat_is_inside_us_desc: "Генеральна Асамблея була корисним знаряддям утримання влади в Сибіру, але лише до певної межі. Надмірні незгода й розбрат, що вихлюпуються з її стін, становлять великий ризик для наших політичних зусиль. Тому ми мусимо розпустити Генеральну Асамблею й перебрати ширші повноваження."
 SBA_superregional_despotist_targeting_the_next_generation: "Націлитися на наступне покоління"
 SBA_superregional_despotist_targeting_the_next_generation_desc: "Діти багато в чому корисніші за дорослих. Вони повторять будь-яке гасло, пристосуються до будь-яких умов і, найкраще, засвоять будь-яку ідеологію, у якій їх виховувати. Майбутнє Чорної Армії - у сибірській молоді, отже саме на ній мають зосередитися наші зусилля."
 SBA_superregional_despotist_conscription_lotteries: "Призовні жеребкування"
 SBA_superregional_despotist_conscription_lotteries_desc: "Кожен справжній анархіст має бути готовим віддати життя за справу Чорної Армії. Якщо хтось не хоче померти за комуну й добро своїх товаришів, мусять бути наслідки, і призов - хоч би яким прикрим він був - один із них. У громадах, де бракує добровольців, ми проводитимемо жеребкування й набиратимемо нових вояків для боротьби із зовнішніми тиранами. Це ще й заощадить трохи коштів на вищій освіті."
 SBA_superregional_despotist_no_schooling_required_to_hold_a_gun: "Щоб тримати рушницю, освіта не потрібна"
 SBA_superregional_despotist_no_schooling_required_to_hold_a_gun_desc: "У томських салонах люди могли міркувати про природу освіти й укладати незбагненні навчальні програми. Але це не Томск. На наших землях диплом чи свідоцтво не потрібні, щоб тримати рушницю й захищати ідеали Чорної Армії. Освітня система це відображатиме. Звісно, трирічних дітей навчатимуть рахувати й такого іншого, але єдиними потрібними нам вишами стануть офіцерські академії. Змій реакції здолають наші мурашині рої!"
 SBA_superregional_despotist_sack_the_teacher_introduce_the_officer: "Геть учителя, давайте офіцера"
 SBA_superregional_despotist_sack_the_teacher_introduce_the_officer_desc: "Можливо, освіта все-таки потрібна дієздатному суспільству. Та це не заважає пристосувати її до найнагальніших потреб. Початкові й середні програми зосередяться на потрібних краю навичках - від інженерії та медицини до теорії войовничого анархізму. Коли настане час, усі учні будуть готові битися проти ворогів Чорної Армії, а підготовку здобудуть і в класі, і на полігоні. Зрештою, між ними не буде різниці."
 SBA_superregional_despotist_the_school_to_soldier_pipeline: "Від шкільної лави до війська"
 SBA_superregional_despotist_the_school_to_soldier_pipeline_desc: "Продовжуючи програму мілітаризованої освіти, треба стерти межу між учнем і солдатом. Найкращий спосіб - запровадити в школах нові молодіжні програми. Ці резервні корпуси підготовки офіцерів унормують ідеали авангардного анархізму й навчать молодь убивати та вмирати в майбутніх війнах. До того ж їм буде чим зайнятися у вихідні. Бездіяльні руки - майстерня диявола..."
 SBA_superregional_despotist_freedom_has_its_limits: "Свобода має межі"
 SBA_superregional_despotist_freedom_has_its_limits_desc: "Анархізм проголошує себе вершиною людської свободи, і це може бути правдою. Та кожне суспільство в історії, навіть бездержавне, мусило певною мірою обмежувати свободу. Не можна ж кричати «пожежа» в переповненому театрі. Необмежена свобода накликала б хаос, а анархізм - не хаос. Це народ, який у єдиному строю крокує до вищих перемог. Так, свобода має межі, й на наших землях це стане очевидно."
 SBA_superregional_despotist_proclaim_the_necessity_of_continuing_revolution: "Проголосити потребу безперервної Революції"
 SBA_superregional_despotist_proclaim_the_necessity_of_continuing_revolution_desc: "Наші радикальні зміни устрою Чорної Армії викликали шепіт серед простого люду. Кажуть, ми зрадили всі ідеали й анархістське майбутнє на наших землях більше неможливе.\n\nМи можемо це змінити.\n\nТому ми публічно оголосимо, що мета Чорної Армії - безперервна Революція до визволення Росії. А після визволення Росії лишиться ціла планета, закута всілякими тираніями. Людина народилася вільною, та від полів Америки до німецьких в'язниць, від міст Японської імперії до глибин Африки вона в кайданах. Тож вийдемо до народу й проголосимо: за межами Сибіру є новий світ!\n\nТам наша доля."
 SBA_superregional_despotist_a_leader_to_make_makhno_proud: "Лідер, яким пишався б Махно"
 SBA_superregional_despotist_a_leader_to_make_makhno_proud_desc: "Завершено. Безмежні землі Сибіру без жодного сумніву під нашим контролем. У містах, селах і комунних полях народ присягає генералові Стєпанову. Дні людей сповнені праці й суворо патріотичного дозвілля, а діти вправляються зі зброєю за школами. Сам Нестор Махно, прабатько нашої справи, попри всі свої вади пишався б нашими здобутками. Азійська Росія лежить під прапором Чорної Армії, а на її чолі стоїть Стєпанов."
 SBA_superregional_despotist_the_peoples_stick: "Народний кийок"
 SBA_superregional_despotist_the_peoples_stick_desc: "Чому Америка, цей величезний колос континентальної наддержави, здалася Японії?\n\nЧому три великі держави світу вічно стоять одна проти одної з ножами біля горлянок, але не наважуються завдати удару?\n\nЧому Громадянська війна в Німеччині викликала стільки тривоги серед генералів і радників усього світу?\n\nПричина лише одна: ядерна зброя. Держава з ядерною зброєю має найвищий козир і може одним промовистим словом пригрозити всім винищенням. Об'єднана Росія з ядерною зброєю буде нестримною.\n\nМи мусимо мати свою."
 SBA_superregional_despotist_zelenogorsk_has_much_to_offer: "Зєлєноґорск має що запропонувати"
 SBA_superregional_despotist_zelenogorsk_has_much_to_offer_desc: "Сибір відомий величезними покладами корисних копалин, тож джерел матеріалів для молодої ядерної програми чимало. Її керівники вважають одним із найкращих варіянтів Красноярський край: він доволі населений та індустріялізований, а споруди в Зєлєноґорску особливо придатні для наших потреб. Постачання для розробки ядерної зброї може бути складним, але фахівці однаково передусім радять Зєлєноґорск."
 SBA_superregional_despotist_black_army_mining_detachments: "Гірничі загони Чорної Армії"
 SBA_superregional_despotist_black_army_mining_detachments_desc: "Чорна Армія безперервно зростає й дещо роздулася, тож тепер маємо чимало солдатів без нагальної роботи. Найкраще застосування зайвих людей - життєво важлива праця, і ядерна програма дає таку нагоду. Вони не замінять цивільних уранових шахтарів, але суттєво збільшать виробництво. Можна негайно відрядити війська до копалень у Хіаґдінскому та Елконі. Це чудово розв'яже можливу нестачу робочих рук і підвищить ефективність програми."
 SBA_superregional_despotist_an_officer_in_every_mine: "Офіцер у кожній копальні"
 SBA_superregional_despotist_an_officer_in_every_mine_desc: "Схоже, наказ солдатам видобувати уран у далеких куточках наших земель не пішов на користь бойовому духові Чорної Армії. На копальнях повідомляють про зупинки робіт, насильство проти наглядачів і вкрай низьку мораль. Ми не усунемо всіх причин невдоволення, зате можемо, так би мовити, опустити батіг. Треба відрядити до шахт нових офіцерів, насамперед навчених правоохоронній справі й придушенню заворушень. Заради Чорної Армії уран мусить текти."
 SBA_superregional_despotist_a_discovery_in_streltsovsk: "Відкриття в Стрєлцовску"
 SBA_superregional_despotist_a_discovery_in_streltsovsk_desc: "Далеко від нашої центральносибірської колиски, біля кордону з маріонетками Сфери, стоїть невелике гірниче місто Краснокамєнск. Його економіка значною мірою спирається на видобуток вугілля й манґану, але нещодавно техніки знайшли дещо нове: уран. У надрах Стрєлцовскої копальні може лежати одне з найбільших родовищ Росії. Доступ до нього надзвичайно допоможе ядерній програмі. Та копальня лежить на Далекому Сході, далеко поза нашими рідними землями. Це створить труднощі з видобутком, перевезенням і переробкою, не кажучи про нестачу робочих рук у нещодавно завойованому краї. Ризики перенесення програми на схід очевидні, але й можлива нагорода величезна."
 SBA_superregional_despotist_statists_of_siberia: "Етатисти Сибіру"
 SBA_superregional_despotist_statists_of_siberia_desc: "Багаті ресурси Стрєлцовскої копальні безперечно корисні для ядерної програми. Та є проблема: ще зовсім недавно російський Далекий Схід був полем бою. Багато цивільних уже успішно інтегровано, але шрами від боротьби і з фашистами, і з етатистськими комуністами глибокі. На Далекому Сході треба діяти обережно й розважливо."
 SBA_superregional_despotist_earn_your_liberation: "Заслужити своє визволення"
 SBA_superregional_despotist_earn_your_liberation_desc: "У таборах по всій території досі перебувають тисячі полонених із підкореного Далекого Сходу. Багато хто, особливо з лівих фракцій, приєднався до Чорної Армії, але ще більше сповідує різні течії фашизму та білого монархізму. Утримання таборів виснажує ресурси, а полонені є спокусливим джерелом робочої сили. До того ж багато хто радо заслужить свободу, навіть якщо для цього доведеться копати радіоактивні матеріали в богом забутій цятці Центральної Азії. Давши полоненим шанс повернутися до цивільного життя, ми вб'ємо одним каменем багато птахів."
 SBA_superregional_despotist_no_pity_for_tyrants: "Жодного жалю до тиранів"
 SBA_superregional_despotist_no_pity_for_tyrants_desc: "Який дурень повірить, що фашиста можна виправити? У таборах Чорної Армії досі нидіють тисячі виродків - покидьки після боїв у Чіті, Амурі й Маґадані. Їх можна відправити видобувати уран, але не обманюймо себе: вибору вони не матимуть. Натомість скуштують власних ліків.\n\nФашисти знову запрягли б усю Росію в ярмо кріпацтва. Погляньмо, як їм сподобається опинитися по інший бік батога."
 SBA_superregional_despotist_the_revolution_will_succeed: "Революція переможе..."
 SBA_superregional_despotist_the_revolution_will_succeed_desc: "Ядерна програма просувається вражаюче, а видобуток і дослідження далі дають результати. Та цього замало. Поки що. Заради всесвітнього тріюмфу анархізму наші вирішальні удари мають бути готові якнайшвидше. До програми спрямують більше гірників, інженерів і дослідників. Її успіх стане найвищим пріоритетом!"
 SBA_superregional_despotist_by_any_means_necessary: "Будь-якою ціною"
 SBA_superregional_despotist_by_any_means_necessary_desc: "Наша ядерна програма досягла успіху. За кілька тижнів перша чиста бомба поділу буде готова до випробування. Їй далеко до величезних арсеналів Америки, Німеччини та Японії, але це однаково безпрецедентний тріюмф у російській військовій історії. Чорна Армія ось-ось розщепить атом і прикує до себе перелякані погляди світу. Вітаємо."
 
