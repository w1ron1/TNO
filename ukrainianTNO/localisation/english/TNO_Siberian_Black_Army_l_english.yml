 SBA.110.t: "Друг на заході?"
 SBA.110.desc: "Після розпаду Сибірської Вільної Території Монґуш Буян-Бадирґи, очільник алтайсько-тувинського повстання проти сил Стєпанова, відбив їхні атаки й убезпечив свої кордони. Тепер Буян-Бадирґи звертається до нас із проханням приєднатися до Далекосхідної Совєцької Республіки на правах автономії. Саблін неабияк зацікавився цією ідеєю, наказав надіслати згоду на автономію й доручив відповідним органам підготувати інтеграцію до Совєцької Республіки. Буян-Бадирґи дістане автономію, а ми станемо ще на крок ближчими до об'єднання Росії."
 SBA.110.a: "Вітаємо нових друзів!"
 
 SBA.111.t: "Друг на заході?"
 SBA.111.desc: "Після краху Сибірської Вільної Території Монґуш Буян-Бадирґи, провідник алтайсько-тувинського повстання проти сил Стєпанова, відбив його наступ і захистив свої кордони. Тепер Буян-Бадирґи просить прийняти його до Далекосхідної Совєцької Республіки зі збереженням автономії. Яґода зацікавлений у приєднанні, але не в автономній державі. Ми можемо погодитися на анексію без автономії, хоча Буян-Бадирґи навряд чи це прийме. Чимало людей переконують Яґоду погодитися на автономію, адже повернення нових земель Росії наближає об'єднання. Та остаточне слово все одно за Яґодою."
 SBA.111.a: "Надати їм автономію."
 SBA.111.b: "Або повна інтеграція, або жодного приєднання до революції."
 
 SBA.112.t: "Прохання про автономію схвалено!"
 SBA.112.desc: "ага, я теж хотів би контенту для туви, але його нема, тож якого біса ти тут робиш?"
 SBA.112.a: "ґеймінґ"
 
 SBA_PowerStruggle.1.t: "Анархічна анархія"
 SBA_PowerStruggle.1.desc: "Пьотр Сіуда й Іван Стєпанов востаннє сиділи поруч. Затамувавши подих, вони несвідомо доживали останні хвилини як союзники. Стєпанов зім'яв кашкета майже в кулю, стискаючи його спітнілими долонями, доки тиск дозволяв, а тоді відпускав із глибоким тремтливим зітханням. Сіуда зняв значок із мундира й крутив його між пальцями, раз у раз проколюючи бліду шкіру до крові. Сотні працівників, виборних офіцерів і учасників асамблеї довкола віддавалися власним нервовим звичкам.\n\n«Хтось мав принести випивку». Тихого голосу Таратути вистачило, щоб порушити крихку тишу. Дехто ввічливо хихикнув - усі вже втомилися чекати біля радіо на звістку, що страхи були марні. Тиша знову набрала сили.\n\nРаптом апарат милосердно затріщав. Тиша змінилася статикою, а статика - словами. «Дай сюди! Я сам. Командування? Це...» Голос знову потонув у шумі, й Стєпанов ударив радіо збоку. «...успішно. Наразі діємо із Зєї. Опір...» Усі заметушилися, шукаючи того, хто полагодить зв'язок. «...беззастережна капітуляція. Ми перемогли».\n\nДовкола люди схопилися з місць і обіймали найближчих, але Іван Стєпанов сидів, а Пьотр Сіуда стояв - дві статуї, два пам'ятники анархізму. Перше бажання Стєпанова святкувати задушило усвідомлення: він не контролював Східного Сибіру, не мав там вірних офіцерів для підкупу й асамблей, на які можна накласти вето. Сіуда збагнув схоже: його заклик не сягав далеких закутків Маґадану, а вплив обмежувався Центральним Сибіром. Стєпанов першим різко встав, поправив кашкета над лисиною й рушив геть. Сіуда не забарився йти слідом."
 SBA_PowerStruggle.1.a: "Чому так рано йдете, товаришу Сіудо?"
 SBA_PowerStruggle.1.b: "Ґенерале Стєпанове? Куди це ви?"
 
 SBA_PowerStruggle.3.t: "Попереду нова пригода"
 SBA_PowerStruggle.3.desc: "Годинник знову вдарив, сповіщаючи третю ночі. Пьотр Сіуда жбурнув склянку в корпус, і кімнатою розлетілися скалки. Він обіцяв не перетворювати випивку на звичку, але скрутні часи вимагали скрутних заходів. Скільки склянок не кидай, час не спиниться й від'їзд за три години не відкладеться. Сіуда глибоко вдихнув, гучно відригнув і звівся на ноги. Оминаючи скло, він підійшов до кухонного столу, накритого картою Далекого Сходу.\n\nВід самого її вигляду нудило - а може, то насувалося похмілля. Росія була значно більшою за все побачене ним, хоча бачив він чимало: самозвані царі й корпоративні республіки, міста мистецтва й військові округи Червоної армії - весь політичний спектр на клапті Росії. Про східних воєначальників він знав поверхово: Цар, два Вожді, Яґода та його найлютіший ворог, навіть якийсь Отець, що прагнув поєднати церкву з анархізмом. Від самої думки голова боліла ще дужче. А про захід він і думати не хотів.\n\nСіуда впав на стілець і бездумно дивився на карту. Родзаєвск, еге ж - скромністю тут не пахло. Та справа була не лише у фашистах: на сході ніде не було влади народу. Він випростався, схопив ручку й почав викреслювати держави. Монархісти, фашисти, етатисти - лише тепер він по-справжньому збагнув, яким жалюгідним було там життя. Хміль умить минув. Сіуда заходив кімнатою: повернувся колишній Сіуда, готовий до ранку складати план, як змінити весь край."
 SBA_PowerStruggle.3.a: "Він узяв ручку й обвів Родзаєвск - свою першу ціль."
 
 SBA_PowerStruggle.4.t: "Нехай їхні люди повернуться!"
 SBA_PowerStruggle.4.desc: "«Пьотре...» - тихо мовила Євґєнія Таратута. «Я розумію тебе, але ще не пізно. Прошу, подумай знову». Ранок починався чудово: першу ніч у тимчасовому штабі в колишньому Родзаєвску вони сперечалися, а перший ранок провели біля міської брами, тремтячи від холоду.\n\n«Я вже вирішив, Євґєніє. Поки ти спала, я все владнав. Машини вже в дорозі». Сіуда стояв зі схрещеними руками, дивлячись на звивистий шлях у ліс. Євґєнія приречено зітхнула. Він не навмисно нехтував її порадами - просто знав, що має рацію! Місто мало повернутися до нормального життя й назавжди змити пляму минулого.\n\nДалекий гул двигунів змусив обох насторожитися. Відступати було пізно, і Сіуда вже обіцяв собі потім довіку кепкувати з марних страхів Євґєнії. Невдовзі з'явилися автобуси, перший зупинився за кілька метрів. Сіуда підійшов до дверей, і люди почали виходити з валізами. «Вітаю, товариші, вітаю вдома!» Фашистський режим вигнав і депортував сотні євреїв та корінних мешканців із земель їхніх родин. Для Пьотра це було неприпустимо.\n\nОстаннім вийшов лисий чоловік із переповненою прямокутною валізою. Сіуда хотів допомогти, та той зупинив його. «Це ви повернули нас сюди?» Сіуда кивнув. Чоловік міцно потиснув йому руку; Пьотр розгледів плямисту шкіру й неохайне обличчя. «Дякую. Це мій дім. Я знову почуваюся в безпеці». Усміхнувшись, він розчинився в натовпі."
 SBA_PowerStruggle.4.a: "Цей проєкт неодмінно матиме успіх."
 SBA_PowerStruggle_4_tt:0 "Збільшує вплив §RСіуди§! в Амурі."
 
 SBA_PowerStruggle.5.t: "Злоякісна пухлина"
 SBA_PowerStruggle.5.desc: "Вечір після першого дня проєкту «Повернення додому», як його називав Сіуда, завершувався, мов будь-який інший. Сіуда поїв, відредагував промови й трохи приємно поговорив із Таратутою. Лихе передчуття щодо проєкту так її й не полишило, та вона з усіх сил намагалася викинути його з голови. Сіуда переможно відклав ручку й іще раз окинув поглядом промову. За порадою архіварки, яку він зустрів у Новосібірску, Пьотр почав записувати їх як «важливі уламки історії». «Євґєніє, підійди й поглянь! Це буде чудовий початок нашої антифашистської кампанії».\n\nЄвґєнія неквапно підійшла до Сіуди й вихопила папір із його рук. «Ця громада одужує, - прочитала вона поверх окулярів, - повернення біженців - наші ліки, а терпимість - зцілення». Таратута звела брову й скривилася. «І відколи ти лікар?» Пьотр закотив очі й сьорбнув чаю. «Непогано, - зрештою поступилася вона. - Може навіть когось розчулити до сліз».\n\nПриємну розмову урвав шалений грюкіт у двері. Обоє завмерли й пильно дивилися на них, чекаючи, що ті ось-ось розчахнуться. Та цього не сталося. Більше не було ні стуку, ні взагалі жодного звуку. Вони поглянули одне на одного й порозумілися без слів. Сіуда повільно підвівся й підкрався до дверей. Зброї він не мав, зате Таратута тримала свій пістолет поруч. Пьотр глибоко вдихнув і рвучко відчинив двері.\n\nНікого.\n\nАле на порозі лежала записка. Пьотр підхопив її з землі й одним рухом грюкнув дверима. Таратута дивилася, як Сіудині очі гарячково бігають від слова до слова, наче він мусив устигати за ними, інакше вони його поглинуть. Після, здавалося, цілої вічности мовчання Сіуда обернувся до Євґєнії, спантеличено насупивши брови. «Тут лише імена. Просто список імен. Але... деякі з них викреслено». Він читав і перечитував документ знову й знову, доки не запам'ятав його напам'ять. І тоді все зрозумів."
 SBA_PowerStruggle.5.a: "«Єв, ці імена... це люди, яких ми привезли сьогодні вранці»."
 
 SBA_PowerStruggle.6.t: "Приборкання дикого звіра"
 SBA_PowerStruggle.6.desc: "«Порядок! Будь ласка, заспокойтеся!» Сіуда стояв на нашвидкуруч збитій із дерев'яних ящиків сцені посеред міста. Довкола зібрався натовп, що вже мало чим відрізнявся від розлюченої юрби. Коли достатньо людей сходяться разом, вони утворюють єдине тіло. Натовп - окремий від людини вид, зі своїм рухом і поведінкою. Звір перед Сіудою голосно ревів і вимагав відповідей. Він провів рукою по волоссю. Господи.\n\n«Досить!» - наказав він, і натовп стих. «Те, що сталося минулої ночі, - трагедія, але якщо ми гризтимемося між собою, то справедливости не доб'ємося!»\n\n«Трагедія? - закричав звір. - Загинуло тридцять людей!» Звір лютував. «Ви привезли нас сюди! Привели на забій! Фашисти не зникли, ми не в безпеці!» Він повторював це гасло знову й знову, заглушуючи Сіуду та його марні спроби приборкати істоту. Обидві сторони вже ладні були розірвати одна одну, коли містом пролунав постріл і змусив обох замовкнути.\n\nУ хвості звіра стояв рівний, мов жердина, чоловік середніх років, звичайного зросту й статури, наставивши зброю високо в небо. «Товаришу Сіудо, перепрошую, що довелося привертати вашу увагу таким способом, але, гадаю, мої слова достатньо важливі, щоб це виправдати». Чоловік рушив уперед, і звір розпадався навколо нього, безперешкодно пропускаючи крізь натовп. «Я народився тут, але за диктатури мою родину вигнали, бо мій батько був євреєм. Ми втекли аж до Новосібірска - міста надії, сибірської оази. Саме там я вперше почув ваші ідеї й став відданим прибічником. Мене завжди вражало ваше вміння гуртувати людей - напевне, саме воно й привело вас із того міста сюди».\n\nЧоловік підійшов ближче до сцени й простягнув Сіуді руку. «Мене звуть Абакумов. Я хочу допомогти вам знайти того, хто це зробив»."
 SBA_PowerStruggle.6.a: "І один за одним до нього приєдналися інші."
 
 SBA_PowerStruggle.7.t: "Роздоріжжя"
 SBA_PowerStruggle.7.desc: "За тиждень і два дні після прибуття Пьотра Сіуди та Євґєнії Таратути Родзаєвск перевернувся догори дриґом. Денацифікація стала для Сіуди нав'язливою ідеєю, і навіть вороги визнавали твердість його переконань. Він прагнув стерти останні сліди російського фашизму. Подорож мала тривати п'ять днів, та дні злилися докупи, бо містяни дедалі більше боялися нового удару вбивці чи вбивць.\n\nАбакумов став фактичним шерифом, хоча від титулу відмовився. Він зв'язував тих, хто поважав Сіуду, з тими, хто звинувачував його. За порадою Сіуди Абакумов створив Надзвичайний антифашистський комітет із п'ятьох людей - без самого Сіуди. Уперше той опинився в натовпі, а не в асамблеї. Натомість обрана Таратута фактично була його голосом.\n\nКомітет днями планував оборону й перевіряв безплідні сліди. Сіуда відчайдушно хотів допомогти, але воля народу була проти нього. Він міг лише дивитися, як сусіди звинувачують одне одного в тому, що вони - Привид Родзаєвского.\n\nПеред черговим слуханням із радіо озвався полегшений голос: «Товаришу Сіудо! Це ґенерал Валєнтєєв. Я в Іркутску - чи в тому, що від нього лишиться. Цілі частини розкололися, військове управління паралізоване. Союзні бюрократи намагаються повернути владу, підриваючи наші установи й народний опір. Усе вийшло з-під контролю. Якщо втратимо електростанцію, великі міста залишаться без струму. Ви потрібні негайно». Сіуда занімів. Будь-який вибір був неправильним."
 SBA_PowerStruggle.7.a: "Комітет тут упорається."
 SBA_PowerStruggle.7.b: "Я прибув викорінити фашистський вплив і не піду, доки не завершу!"
 
 SBA_PowerStruggle.8.t: "Ну, я пішов"
 SBA_PowerStruggle.8.desc: "Сіуда стояв зі схрещеними руками й дивився на місто. За тисячі кілометрів на сході Євґєнія та Родзаєвск вели власну битву. Попри втому він не міг позбутися відчуття, що чинить неправильно. Він ніколи не кидав розпочатого. Та що мав робити - сидіти склавши руки? Добрий анархіст шанує народну волю, а люди воліли його позбутися.\n\nНайперше Сіуда помітив сморід Іркутска. На головній вулиці, оточений посиленою охороною, він побачив те, що більшість уявляла під анархією: скло на дорогах, пожежі в будинках, покинуту каналізацію. Тривожно, але не безнадійно. Сіуда бачив справжні зони бойових дій, і цей занепад не йшов із ними в порівняння.\n\nВін зупинився біля воріт Президії. Перед від'їздом на схід Сіуда вже визначив будівлі для місцевих асамблей, а Президія була перлиною: асамблея тут засвідчила б перемогу анархістської системи над совєцькою. Він двічі постукав, зачекав і постукав утретє. Двері відчинилися, і його з охороною впустили.\n\nОбіцяної перлини не було. Вікна забиті, цілі крила перетворені на житло, за безліччю колишніх столів Союзної еліти сиділи лише троє чоловіків і дві жінки. Їхня розмова стихла. Ґенерал Валєнтєєв, приємне видовище для втомлених очей, вийшов із-за рогу. «Товаришу! Не чекав вас так рано, але радий. Роботи чимало»."
 SBA_PowerStruggle.8.a: "І не кажіть."
 
 SBA_PowerStruggle.9.t: "Боротьба за серця й уми"
 SBA_PowerStruggle.9.desc: "Скрута Іркутска мала три причини. По-перше, Чорна Армія розкололася на два табори, як і в Томску. Це було неприйнятно: якщо збройні сили не здатні підтримувати спільний порядок і захищати громаду, анархізм не запрацює. По-друге, через відсутність політичного підґрунтя - частково через від'їзд Сіуди - освічена еліта переконала людей демократично відновити Вєрховний Совєт. Нарешті, людям було байдуже.\n\n«Ви берете квартали А, Б і Г», - наказував Сіуда метушливій армії солдатів, цивільних і нероб. «Ресурсів мало. Розподіляйте їжу обережно, але не скупіться». Люди отримували завдання за здібностями, а Сіуда дивився з дурнуватою усмішкою. За ніч уцілілі стали провідниками громади. Невдовзі допомога працювала сама: їжа надходила вчасно, ремонти тривали весь день, санітарні працівники повернулися до справ.\n\nСіуда вийшов оглянути місто. Під уламками й різаниною вже проглядали поліпшення - він знову починав бачити той Іркутск, який називали Парижем."
 SBA_PowerStruggle.9.a: "Однією проблемою менше, дві лишилися."
 SBA_PowerStruggle_9_tt:0 "Збільшує вплив §RСіуди§! в Іркутску."
 
 SBA_PowerStruggle.10.t: "Усе добре колись..."
 SBA_PowerStruggle.10.desc: "Сіуда прокинувся сам - не лише в ліжку, а в усій Президії, що стала його другим домом після Родзаєвска. Блукаючи коридорами, він тужив за Євґєнією. Вона завжди знала, що робити, й вірила в нього навіть тоді, коли він сам не вірив, що здатен учинити правильно для Росії. Лишалося бажати подрузі добра й гадати, чим вона зайнята.\n\nТа питання довелося відкласти. У головній залі він почув ознаки життя й визирнув у вікно. Шість доріг сходилися біля фонтана, і кожну заповнювали нескінченні лави людей із плакатами, дітьми та зброєю. Ідеологічний калейдоскоп простягався від прибічників Яґоди під прапорами Союзу до течій, яких Сіуда навіть не вмів визначити. Якщо місто знову роздере себе, вся відбудова буде марною.\n\nЗдавалося, весь Іркутск зібрався тут. Сіуда пробився до фонтана й побачив представників шести таборів за викладом вимог. Один упізнав його й підбіг. «Ви Пьотр Сіуда! Саме вчасно - можете все врятувати!» Він обійняв Сіуду за плечі. Той не знав, що саме рятувати, але конфлікт йому зовсім не подобався. І тут він зустрівся поглядом із ґенералом Валєнтєєвим, який теж продирався крізь юрбу."
 SBA_PowerStruggle.10.a: "Сіуда самими губами попросив Валєнтєєва викликати озброєну підмогу."
 SBA_PowerStruggle.10.b: "Сіуда глибоко вдихнув і приготувався до всього."
 
 SBA_PowerStruggle.11.t: "Більше ніякого товариша-добряка"
 SBA_PowerStruggle.11.desc: "Диявол працює швидко, але рішучі солдати Чорної Армії - ще швидше. Не минуло й двох годин після виклику, як на обрії з'явилися люди. Та ці дві години були нестерпними.\n\nВалєнтєєв пірнув у юрбу й рушив до Президії та радіо. Сіуда знову лишився сам у морі тіл. Це не його дім, не Канск, не його сусіди чи друзі. Їхня політика була йому чужа. Він раптом збагнув: поза рубежами Вільної Території лежить іще величезна Росія й цілий світ. На мить його ідеалізм похитнувся.\n\nДо прибуття Армії протести майже згасли: людям просто набридло, і вони розійшлися. Сіуді запаморочилося. Він даремно застосував Чорну Армію й створив небезпечний прецедент. Валєнтєєв привітав його з успіхом, та перемога була порожньою: мирна угода була близько, але він самоусунувся й чекав порятунку військових. Солдати несли стабільність і справедливість, але суворі погляди містян гасили весь позитив.\n\nСіуда сів у машину, повертаючись до Канска з поразкою в Родзаєвску й пірровою перемогою в Іркутску. «Привіт, Пьотре». Він одразу впізнав голос Таратути й сів поруч. «Сподіваюся, тобі велося краще, ніж нам»."
 SBA_PowerStruggle.11.a: "Сіуда засміявся: «Авжеж - принаймні якийсь час»."
 
 SBA_PowerStruggle.12.t: "За столом переговорів"
 SBA_PowerStruggle.12.desc: "Сіуда поглянув на Валєнтєєва, тоді на натовпи протестувальників, що оточили його стіною. Цій пороховій бочці бракувало лише іскри. Він усміхнувся чоловікові: «Чим допомогти?»\n\nІмена шістьох представників він вивчив швидко. Кожна група чогось вимагала від інших, а Сіуда став посередником. Під дедалі гучніші вигуки шестеро намагалися укласти угоду, яка лишить усіх задоволеними, а місто - цілим.\n\n«У цьому й суть асамблеї, - пояснював невиспаний Сіуда. - Кожен має один голос. Прийдете - ваш голос зарахують. Анархізм із партіями не втримати». Шестеро навперебій доводили протилежне. Нічого не виходило. Сіуда розтирав скроні, а тупіт і повторювані гасла змушували мріяти, щоб Чорна Армія просто розвела шість походів і всіх відпустила додому.\n\nМинуло три години.\n\nВигуки стихли, а переговори стали перевернутим звіринцем: шість юрб спостерігали за сімома людьми. Один представник здався, за вісім хвилин другий, потім іще троє - лишилися Сіуда й останній. «У політиці ви непохитні - нехай. Але я не дозволю вашій економіці знищити місто й Росію. Потрібен компроміс, інакше буде загальний страйк». Виснажений Сіуда засвоїв урок:"
 SBA_PowerStruggle.12.a: "Іноді треба просто погодитися."
 SBA_PowerStruggle_12_tt:0 "Збільшує вплив §RСіуди§! в Іркутску."
 
 SBA_PowerStruggle.13.t: "Суперсищик Сіуда"
 SBA_PowerStruggle.13.desc: "Після нападів запровадили сувору комендантську годину. Родзаєвск жив у стані облоги, і Абакумов не ризикував дарма. Це заслуговувало поваги. Його першою помилкою стала спроба змусити анархіста дотримуватися правил.\n\nУ хутряній шубі Сіуда вислизнув у мертву ніч. Він і сам не знав, чого шукає: доказу, слідів, велетенської неонової стрілки до винуватців? Натомість отримав крижаний дощ і темряву. Дурня. Він повернувся й спробував ступати у власні сліди. У перший не влучив - пусте. У другий теж - уже підозріло. А побачивши, що сліди ведуть у протилежний бік, усе зрозумів.\n\nВін крадькома дійшов до околиці й високих дерев, звідки прибули ті кляті автобуси. Сліди вели на північ, а Сіуда йшов слідом, мов вірний пес. Раптом вони урвалися. Коли він нахилився, земля під ним нявкнула.\n\nСіуда похитав головою: люди не зникають, лишаючи сліди, а земля не нявкає. Та звук повторився. Він озирнувся, ступив - і знову почув нявкіт. Кіт під снігом! Сіуда гарячково розгрібав замет, доки не знайшов це."
 SBA_PowerStruggle.13.a: "Не кота - двері."
 
 SBA_PowerStruggle.14.t: "Вигнання привида Родзаєвского"
 SBA_PowerStruggle.14.desc: "Пьотр Сіуда, Євґєнія Таратута, Абакумов та інші члени Надзвичайного антифашистського комітету стояли колом на околиці. Таратута скептично глянула: «Пьотре... Якщо хочеш повернутися до Канска, то...»\n\n«Ні, - наполіг він. - Я вночі почув нявкіт, наче кіт був просто під ногами!» Члени комітету переглянулися з тривогою та роздратуванням. «Знаю, звучить безглуздо, але я не жартую. Ось побачите». Сіуда розгріб свіжий сніг, відкривши дерев'яні двері, схожі на погрібні. «Я їх не відчиняв. Люди довірили відповідальність вам, і я теж. Убивця за цими дверима». Тепер тривога стала страхом, а роздратування - відвагою.\n\n«Ну що ж, - мовив Абакумов, міцно стискаючи пістолет, - якщо не чекатимемо запрошення, час це скінчити».\n\nУсередину пішли лише Сіуда, Таратута й Абакумов, а решта лишилися, щоб комітет уцілів за найгіршого кінця. Трійця спустилася в лабіринт тунелів, що розгалужувалися з кожної стіни. «Нічого собі... - прошепотів Абакумов. - Вони ведуть усюди...» Біля першого ходу слабке світло торкалося стіни. Вони мовчки погодилися й рушили до нього."
 SBA_PowerStruggle.14.a: "Вони не спиняться, доки не докопаються до істини."
 SBA_PowerStruggle_14_tt:0 "Збільшує вплив §RСіуди§! в Амурі."
 
 SBA_PowerStruggle.15.t: "У череві звіра"
 SBA_PowerStruggle.15.desc: "Вони ледве встигли ступити до системи тунелів, як на стіні з'явилася тінь. Абакумов притиснув палець до губ, безмовно наказуючи ступати обережно. Він приготував зброю, а тінь більшала й більшала.\n\nПогойдуючи хвостом із боку в бік, сірий кіт неквапно пройшов повз трійцю, наче троє незнайомців щодня вривалися до його дому. Абакумов тихо засміявся. «То був лише кі...»\n\nЧиясь рука рвучко вивела його з рівноваги й затягла за ріг. Сіуда й Таратута відсахнулися. Євґєнія намагалася міцніше схопити пістолет, але було запізно. З-за рогу вийшов знайомий лисий чоловік із неохайною бородою. Він був не сам: Абакумова міцно тримали за шию. Його очі розповідали історію жаху, наче він справді побачив привида. Лисий притиснув пістолет до шиї заручника, загнавши цівку в заглибину між черепом і хребтом. «Кинь свій клятий пістолет, - гаркнув він Таратути й жестом указав донизу. - Кидай на землю!»\n\nЄвґєнія й Сіуда нервово переглянулися. Пьотр кивнув, і Таратута повільно поклала пістолет на землю. Переконаний, що зможе виплутатися словами, Сіуда заходився виголошувати одну зі звичних промов, але слова важко застрягали в роті. Де він бачив цю лисину? Цю неохайну бороду... Першою заговорила Таратута. «Хто ти?» - вимогливо спитала вона.\n\nАбакумов марно борсався, намагаючись попередити товаришів, на кого вони натрапили. Лисий стиснув його ще дужче. «Анархісти. Так ви себе називаєте? Вимажте жидо-большевизм лайном - він усе одно лишиться тим самим. Вождь попереджав нас, що цей день прийде. Якби ми були пильнішими чи ретельнішими у стратах, тепер ми стояли б на протилежних місцях».\n\n«Ти... ти був в автобусі, - нарешті видушив Сіуда. - Сидів разом із ними! Оселився тут як удома! Хто ти?»"
 SBA_PowerStruggle.15.a: "«Я - наступний Вождь усієї Росії»."
 
 SBA_PowerStruggle.16.t: "Мама Анархія і Вождь"
 SBA_PowerStruggle.16.desc: "Майбутнє Далекого Сходу вирішувалося під землею. Притиснутий до стіни Пьотр Сіуда та його найближча довірена особа Євґєнія Таратута безпорадно дивилися, як Абакумов бореться в дужих руках Привида Родзаєвского. «Я - наступний Вождь усієї Росії, - хизувався той. - Ви зігнали всіх тварин докупи, і я вдячний за большевицьку дурість. Не всі звідси вийдуть».\n\nПоки самозваний Вождь просторікував, Таратута шукала вихід, який урятує Абакумова. Пістолет лежав далеко; потягнутися - і Маленький Гітлер відреагує. Сіуда тим часом складав власний монолог, аби переконати фашиста. Глухий кут.\n\nЖодна книжка не повірила б, що російський анархізм урятував підземний кіт, та тут це було логічно. Кіт повернувся, замуркотів і потерся об ногу самозванця. Той спробував прогнати його, але завагався. Абакумов вирвався, а Таратута одним рухом підхопила пістолет, прицілилася й зробила світ трохи кращим.\n\nВони перевели подих. Абакумов потер шию. «Підійдіть. Дивіться. Це був не просто фашист, а друга людина після Родзаєвского». За рогом горіли свічки перед портретом Родзаєвского на стосі книжок ненависти.\n\nСіуда, досі приголомшений зустріччю з безумцем у подобі біженця, похитав головою. «Це доводить: нам ще довго виганяти з Росії служителів ненависти». Таратута мовчки перезарядила пістолет."
 SBA_PowerStruggle.16.a: "Вона вистрілила в портрет раз, а тоді ще шість разів."
 
 SBA_PowerStruggle.17.t: "Назад у минуле"
 SBA_PowerStruggle.17.desc: "Чіта справді вражала Сіуду. Після всього пережитого він не чекав, що в Росії ще знайдуться люди, які чіплятимуться за скалічені рештки руху, що десятиліттями не показував іклів. Сотні монархістів блукали вулицями, досі вірні давно мертвому роду, що гнобив батьківщину. Його довірену міністерку закордонних справ це дивувало значно менше.\n\n«Наче повернувся в минуле, товаришко. Справді», - прямо сказав Сіуда, широко розплющивши очі в порожніх коридорах колишнього царського палацу, оздобленого коштовностями й забутими портретами. Супутниця лише всміхнулася й показала на величну залу попереду.\n\n«Не белькочи. Такі місця ще існують; Харбін завжди був прихистком для цих людей і їхньої ностальгії, - жартома відповіла вона. - Ти просив придатне місце, ні? Я знайшла».\n\nУ голові Пьотра спалахнула зухвала думка. Він уже бачив тут столи й стільці, суперечки й гамір, що повернуть життя покинутій будівлі. Тут буде місцева асамблея. Цар і його порядки зникнуть під маршем рівности й поступу. «Так, подруго. Саме те»."
 SBA_PowerStruggle.17.a: "Минуле відступає, майбутнє рветься вперед."
 SBA_PowerStruggle_17_tt: "Збільшує вплив §RСіуди§! в Бурятії."
 
 SBA_PowerStruggle.18.t: "Пил на вітрі"
 SBA_PowerStruggle.18.desc: "Огида - лише це слово описувало нудоту Сіуди від споруди в центрі Амура. Дивитися боліло: велетенська неонова свастика досі стояла й заливала вулиці різким світлом, уособлюючи і жахливе життя Амура, і його колишніх володарів. Назвати Пьотра приголомшеним було б применшенням.\n\nВін обернувся до посланця. «Чому це досі тут? Щоб за годину зникло, інакше я сам рознесу його». Сіуда з відразою відіслав його до гарнізону по засоби знищити цей символ лиха Росії.\n\nНе минуло й пів години, як прийшли загартовані сибірським холодом люди. Вказівки віддано, заряди закладено, юрба зібралася. Сіуда хотів публічно й рішуче показати амурцям, що вони вільні. Ніщо не промовляло краще за вибухівку й радісні вигуки.\n\nТепер він відчував задоволення. Нудота минула, на обличчі розквітла усмішка. Люди теж раділи; декотрі мало не плакали, коли пам'ятник гнобителю з гуркотом став пилом на вітрі.\n\nАле не всі. Дехто сердився через наругу над пам'ятником Вождю. Вони пробиралися крізь натовп під виглядом глядачів, та обличчя їх видавали. Сіуда мовчки вказав рукою, й солдати рушили допитати новоприбулих."
 SBA_PowerStruggle.18.a: "Новий світанок."
 SBA_PowerStruggle_18_tt: "Збільшує вплив §RСіуди§! в Амурі."
 
 SBA_PowerStruggle.19.t: "Від народу, для народу"
 SBA_PowerStruggle.19.desc: "Маґадан завжди лежав дещо осторонь, навіть як на сибірське місто, а цієї пори року тут, безперечно, панував лютий мороз. За звичайних обставин Пьотр Сіуда сюди б не потрапив, але він саме був неподалік і почув, що день тому, невдовзі після визволення міста, прибув американський вантажний корабель.\n\nСіуда спускався брукованими дорогами до доків, а за ним тінню йшов виборний офіцер на ім'я Бурах. Його люди стежили за вантажним кораблем, пришвартованим біля одного з маґаданських причалів. Біля трапа, що вів на палубу, двоє солдатів стояли поруч із чоловіком, якого Сіуда міг уважати лише капітаном судна. Коли Пьотр наблизився, той підвів очі й навіть наче зрадів його появі.\n\n«Нарешті, - пробурчав капітан із густим акцентом. - Ви тут головний? Може, покликати перекладача?»\n\nСіуда зупинився перед ним і відразу відповів: «Перекладач? Ні. Ні. Не треба», - його англійська була непевною.\n\nКапітан кліпнув, звівши докупи кущисті брови. «Ну, гаразд. У нас харчі, теплий одяг, чимало припасів на зиму...» - пояснював він, поки Сіуда кивав. Пьотр крадькома глянув на Бураха, силкуючись приховати пустотливу усмішку, що вже проступала на обличчі. Він прошепотів молодому офіцерові наказ, і Бурах одразу відійшов, почавши шикувати своїх людей. Капітан спостерігав, як повз маршують солдати в темній формі.\n\nГоді й казати, капітан запідозрив недобре. Він примружив очі. «Ви... ви ж...»\n\n«Так», - перебив Сіуда, навіть не давши капітанові відповісти. Американець озирнувся: солдати заполоняли палуби його корабля, спільно піднімали ящики й тягли їх до натовпу, що вже збирався. Капітан наче хотів запротестувати, коли солдати почали ламати ящики й кидати товари всередині цивільним, які простягали руки. Та, знову поглянувши на Сіуду та його винувату усмішку, капітан дійшов одного висновку."
 SBA_PowerStruggle.19.a: "«Мені замало платять за це...»"
 SBA_PowerStruggle_19_tt: "Збільшує вплив §RСіуди§! в Маґадані."
 
 SBA_PowerStruggle.20.t: "Печера"
 SBA_PowerStruggle.20.desc: "Зійшовши на трибуну посеред Іркутска, Сіуда оглянув зморену юрбу, що досі збиралася. Робітники, чоловіки й жінки, дехто з дітьми, тулилися ближче до мікрофона. Пьотр не нервував: виступав багато разів, але не пам'ятав, коли востаннє бачив у такому місці настільки похмурих людей.\n\nЗа місяці після визволення комуни змінили місто. Викорінення потворних рис поліційної держави Яґоди потребувало часу, а поки місцева адміністрація долала негаразди, нестабільність ширилася. Сіуда стиснув край трибуни, прокашлявся й почав.\n\n«Товариші Іркутска! Минуло кілька місяців, відколи місто вирвали зі згасаючих рук старого Союзу й повалили Президію. Тирана Яґоду - пофарбованого червоним Муссоліні, що велів би НКВД стежити за вами, мов за слухняними рабами, - скинуто й справедливо покарано. Майбутнє Іркутска світле як ніколи».\n\nЙого голос, що запалював Ангарський басейн, цього разу падав у глухі вуха. Обличчя кривилися, хмурилися або лишалися порожніми. Сіуда ковтнув.\n\nМоже, вони звикли до кулака Яґоди - наче худоба чи в'язні печери, що бачили лише тіні. Та втомлені обличчя казали: це не їхня вина. Як не гірко визнавати, режим Яґоди давав безпеку, якої Чорна Армія ще не дала. Але дасть.\n\nСіуда видихнув. Полум'яний задум промови розвіявся. Він не знав, що сказати.\n\nГлибоко вдихнув і знову оглянув натовп."
 SBA_PowerStruggle.20.a: "«...і ми проведемо нові міські збори, щоб обговорити й виправити міські негаразди»."
 SBA_PowerStruggle_20_tt: "Збільшує вплив §RСіуди§! в Іркутску."
 
 SBA_PowerStruggle.21.t: "У пошуках Чорного Жовтня"
 SBA_PowerStruggle.21.desc: "Пьотр Сіуда стояв посеред сцени в ратуші Улан-Уде, де до нього вже сиділо чимало ідеологів і промовців. Зала була вщерть заповнена людьми - корінними бурятами, молодими солдатами в пошарпаній формі, матерями й батьками, що тулилися одне до одного й дивилися на Сіуду на сцені.\n\nУпродовж першої години міських зборів Сіуда добре відповідав на запитання. Публіка була сприйнятливою та все розуміла - можливо, політика Сабліна вже підготувала її до вільної природи Чорної Армії. Лунали звичні питання: як усе працюватиме, яким буде новий розклад, як функціонуватимуть господарства. Але Сіуда вже проходив це в незліченних інших містах. Він не думав, що Улан-Уде чимось відрізнятиметься.\n\nМолода жінка біля передніх рядів підняла руку. Сіуда вказав на неї, і її дзвінкий голос заповнив залу.\n\n«Що ви думаєте про минулу політику товариша Сабліна - і чи ваша стане її продовженням?»\n\nІ вперше на цих перших зборах в Улан-Уде Сіуда замовк. Його очі прикипіли до жінки, що поставила запитання, а публіка вперше побачила, як він справді над ним замислився.\n\n«Товариш Саблін, - він забарабанив пальцями по дереву трибуни, - людина палких ідеологічних переконань. Його заклик до визволення гідний поваги, але стільки влади не має зосереджуватися в руках однієї людини». Натовп вичікувально дивився на нього, але що ще міг сказати Сіуда, не вихваляючи етатиста? Хоч, треба визнати, одного з кращих.\n\n«А як щодо освітніх програм і навчання грамотности для наших товаришок?» - гукнув інший голос.\n\nСіуда прокашлявся. «Запевняю вас, ми продовжимо цю політику, якщо не розширимо її». Його танець довкола теми Сабліна з кожною секундою ставав небезпечнішим.\n\n«А що ви думаєте про самого товариша Сабліна!? Він же не так уже й відрізнявся, правда?» - озвався третій голос. Сіуда тяжко зітхнув."
 SBA_PowerStruggle.21.a: "«...наступне питання, будь ласка»."
 SBA_PowerStruggle_21_tt: "Збільшує вплив §RСіуди§! в Бурятії."
 
 SBA_PowerStruggle.22.t: "Між Богом і людиною"
 SBA_PowerStruggle.22.desc: "У двері тимчасового кабінету Сіуди - маленького приміщення в колишній школі Алдана, зовсім недавно приєднаного до комун Вільної Території, - кілька разів ритмічно постукали. Пьотр підвів очі й трохи підвищив голос, аби його почули крізь дерев'яні двері.\n\n«Заходьте!» Ручка повернулася, скрипучі завіси подалися, й усередину ввійшов кремезний чоловік у товстому зимовому хутрі поверх священничого вбрання. Жорстке сиве волосся приховувало почервоніле від холоду обличчя, а на взутті він заніс із вулиці м'який порошистий сніг. «Товаришу Каїне! Сідайте, сідайте», - запросив Пьотр.\n\nОтець Каїн усміхнувся й умостився на твердому дерев'яному стільці навпроти маленького столу Сіуди. За вкритим льодом вікном стояли одна біля одної вантажівки Чорної Армії; їхні кузови наповнювали товарами й припасами для подорожі на північ - до Омолона, Сахи й Колими, звідки отець Каїн і прибув до Сіуди.\n\n«Просто отець Каїн. Я лише смиренний слуга Господа». Око Сіуди сіпнулося, та священник був чоловіком приязним - іще більше з огляду на те, що сам прийшов до нього. «Я прийшов подякувати вам, пане Сіудо. По всій Сасі ширяться розмови, що ваші товари доходять до племен. Їжі вистачить нам на всю зиму - ми безмежно вдячні», - кивнув Каїн.\n\nСіуда всміхнувся. Підтвердження відчутного добра зігріло його обличчя достатньо, щоб здолати холод надворі. Каїн продовжив.\n\n«Така милість - це любов Бога й людини, особливим чином утілена у вас і ваших помічниках, пане Сіудо. Нехай Бог вас благословить».\n\nВід нової згадки про Бога Пьотрове око знову сіпнулося, а в грудях ворухнулося дивне почуття. Він напружився, плечі звелися, але щасливе бородате обличчя Каїна вгамувало ці емоції, руки поволі розслабилися. Він не міг змусити себе сердитися на священника: добро є добро незалежно від політики чи віри."
 SBA_PowerStruggle.22.a: "Добро є добро незалежно від політики чи віри."
 SBA_PowerStruggle_22_tt: "Збільшує вплив §RСіуди§! в Якутску."
 
 SBA_PowerStruggle.23.t: "Вечеря з ворогом"
 SBA_PowerStruggle.23.desc: "У будинку пролунав твердий, навмисний стук. Сіуда вийшов із кухні до дверей, обтрушуючи одяг. Далекий Схід був гарний, але Канск назавжди лишався його домом. «Товаришу Кільчічаков! Вітаю, будь ласка, заходьте!» Сіуда відступив, пропускаючи чоловіка. Кільчічаков лише буркнув і ввійшов до будинку. «Можете лишити пальто де завгодно». Сіуда повернувся на кухню й сів з одного краю столу. За кілька митей Кільчічаков приєднався до нього.\n\n«Пробачте, якщо мої кухарські вміння вже не ті, що колись, - я довго був у дорозі», - сказав Сіуда між шматками їжі.\n\n«Так, вашу відсутність я напевне помітив, як, певно, й люди в Томску, - огризнувся Кільчічаков. - Хоча, гадаю, звинувачувати вас у цьому не зовсім чесно». У кімнаті запала тиша, яку порушували тільки тихі звуки жування. Зрештою економіст промокнув рот серветкою й прокашлявся. «Хоч я й ціную цей жест, сумніваюся, що він походить винятково з доброти вашого серця, хоча для вас це й не було б чимось незвичним, - знову поступився Кільчічаков. - Я вже достатньо давно в цій грі, щоб знати: мене запрошують, коли я потрібен, а не коли мене хочуть бачити».\n\nСіуда відклав виделку й приготувався прийняти виклик. «Товаришу, востаннє ми бачилися в Канску. Ви зупинили мене дорогою на засідання Асамблеї й сказали, що я мушу боротися, аби знайти новобранця». Сіуда відкинувся на стільці й схрестив руки. «І тоді я зрозумів, що помилявся щодо вас». Він зробив паузу, даючи словам подіяти. «Я вважав вас ділком. Капіталістом. Ваша вправність в економіці переконала мене в цьому. Через це я думав, що ви безсердечні, що ви мій найбільший ворог. Але коли ви попросили знайти того хлопця, я побачив людяність. Побачив, що ви не погана людина». Сіуда нахилився вперед над столом. «Рано чи пізно настане час, коли ви опинитеся на одному чи іншому боці».\n\n«То ви мені погрожуєте?»\n\n«Ні, ні, - засміявся Сіуда. - Я знаю, що ви зробите правильний вибір: той самий, який повернув спокій тій матері й не дозволить, щоб таке повторилося»."
 SBA_PowerStruggle.23.a: "Хоч Кільчічаков ніколи б не визнав цього, Сіуда його переконав."
 SBA_PowerStruggle_23_tt: "Збільшує вплив §RСіуди§! в Новосібірску."
 
 SBA_PowerStruggle.24.t: "Сучасний переказ"
 SBA_PowerStruggle.24.desc: "Власних дітей Таратута не мала, але завжди відчувала до них особливу ніжність. На її думку, більше людей мали б поводитися як діти: бути життєрадісними й допитливими, але передусім сповненими надії. Саме цю надію вона бачила в очах дітей, які сіли навколо неї півколом. Томська публічна бібліотека люб'язно прийняла її пропозицію представити найбільше своє досягнення - дитячу книжку. Місто ще носило рани від розправи над мирними демонстрантами, вчиненої за наказом Стєпанова, та дитяча радість могла загоїти будь-яку рану.\n\n«Гаразд, діти! - дзвінкий голос худорлявої жінки закликав малечу до порядку. - Сьогодні в нас дуже особлива гостя-читачка - товаришка Таратута! Що ми їй скажемо?» Хор дітей відповів тисячею різних реплік - від привітань до повідомлень, що їм треба до вбиральні. Жінка всміхнулася Таратути й закотила очі. «Гаразд! Гаразд, нумо знову заспокоїмося. Поки вона читатиме, ми сидітимемо дуже тихо й поводитимемося дуже чемно, добре?» Юрба дітей по-різному висловила згоду. Таратута відкрила книжку й перегорнула першу сторінку.\n\n«Жило собі мишеня на ім'я Ґєорґій. Щодня воно прокидалося й ішло до школи».\n\n«Миші не ходять до школи! - вигукнула дитина. - Я ніколи не бачила миші в школі!»\n\nТаратута всміхнулася попри переривання: лише дитина відчує потребу виправляти вигадку. «Але це світ, у якому вони ходять!» Відповідь, схоже, задовольнила дитину, й Таратута могла продовжити. «Якось на майданчику Ґєорґій наткнувся на Фьодора - величезну драконицю, яка користувалася своїми розмірами, щоб кривдити інших школярів. „Віддай мені свій обід, мишеня!“ - прогриміла Фьодор. Ґєорґій злякався! Фьодор могла проковтнути його цілком! Він уже поліз до наплічника, щоб віддати обід, коли поруч підбігла інша учениця».\n\nТаратута лизнула палець і перегорнула все ще злиплі сторінки. «Дівчинка, яку він знав із класу, підбігла до Ґєорґія. „Стій! - сказала вона. - Чому вона заслуговує на твій обід? Він твій!“ Дівчинка обернулася до Фьодор і стала біля ніг дракониці. „Те, що ти сильніша, не дає тобі права кривдити нас!“ Ця сцена привернула увагу багатьох інших школярів, і вони приєдналися до неї, ставши поруч. „Ти можеш кривдити нас поодинці, але разом ми сильніші за тебе!“» Таратута лагідно закрила книжку й усміхнулася дітям."
 SBA_PowerStruggle.24.a: "Їхні усмішки були єдиною потрібною нагородою."
 SBA_PowerStruggle_24_tt: "Збільшує вплив §RСіуди§! в Томску."
 
 SBA_PowerStruggle.25.t: "Багато не знадобиться"
 SBA_PowerStruggle.25.desc: "Однією чаркою ніколи не обходиться. Стєпан Валєнтєєв і Пьотр Сіуда сиділи в барі, перескакуючи з теми на тему. «Присягаюся! Вона зробила ляльку з моїм обличчям - із власного волосся!» - реготав Сіуда. Навіть незворушний Валєнтєєв не стримався. «І спитала, чи подобається! Що я мав відповісти - що це найогидніше, що я бачив? Довелося сказати, що обожнюю її. Вона досі в моїй валізі!» Обоє хвилину сміялися п'яним сміхом.\n\nКоли стихли, Валєнтєєв витер очі. «Ах, товаришу Сіудо...»\n\n«Просто Пьотр».\n\n«Ви вмієте веселитися. Так не відпочивав від нашої останньої випивки. Дякую за запрошення». Він підвівся, лише трохи похитнувшись.\n\nСіуда теж встав і взяв пальто. «Проведу до машини. Хотів іще дещо обговорити». Надворі повернулася реальність: вони не просто друзі чи бойові товариші, вони відповідали за цю землю. Сіуда міцно схопив його за плече. «Боюся, таких вечорів більше не буде».\n\nП'яний Валєнтєєв усміхнувся: «Згоден, ми майже біля машини».\n\nСіуда ввічливо засміявся, але холод протверезив. «Я не про це. Іван щось замислив. Протест у Томску, напад на конвой, може, навіть демонстрації в Іркутску - він смикає нитки! Скоро він діятиме. Мені треба знати, чи ви зі мною»."
 SBA_PowerStruggle.25.a: "Валєнтєєв закинув голову й засміявся: «Ви думали, я підтримаю Івана?»"
 SBA_PowerStruggle_25_tt: "Збільшує вплив §RСіуди§! в Канску."
 
 SBA_PowerStruggle.26.t: "Випускний день"
 SBA_PowerStruggle.26.desc: "Стєпанов однією рукою масажував скроню, другу люто стискав. Очі бігали між картою на столі й порожнім аркушем. Скільки він так сидів? Надворі було темно, але за цим змаганням могли минути дні. Сіуда, мабуть, уже на сході - тисне руки, цілує немовлят і творить дива. Стєпанов зітхнув. Літак вранці, роботи безліч, та ходити колами легше. І він ходив. І ходив. І ходив.\n\nПрокинувся за три години до відльоту, а аркуш далі глузував. До біса! Фіолетове небо віщувало ранок. Стєпанов підвівся з крісла-ліжка й став біля вікна, дивлячись на сонне місто. Це його володіння, тут він упорається. Та за обрієм чекали нові перешкоди, пригоди й спадщина. Він усміхнувся: Сіуда робив це заради ідеології, а він - заради гонитви, напруги, слави.\n\nУ проміжку між ніччю і днем Іван Стєпанов сів за стіл. Час міг вагатися, але він - більше ні. Слова потекли на папір: розгортання військ і накази на час відсутности в Сибірі. Томск і монгольські комуни потребували додаткових людей. Він поставив підпис. Напевне, до повернення вони втримають порядок."
 SBA_PowerStruggle.26.a: "Напевне."
 
 SBA_PowerStruggle.27.t: "Багато облич Томска"
 SBA_PowerStruggle.27.desc: "Іґор вийшов у звичний час, у звичному одязі й зі звичними думками: яка сьогодні робота, що на обід, чи встигне до сну дітей? Та дорогою до заводу його охопило передчуття. Сусіди не готували сніданку, діти не збиралися до школи, околиці Томска завмерли. Натомість із площі долинали лютий барабанний бій і тиха оркестрова музика. Незвично.\n\nПьотр вийшов рано, у найтеплішому одязі й з незвичними питаннями: хто прийде, які гасла, хто такий Д. Ш.? За три квартали приклад рушниці вдарив його в обличчя.\n\nМіхаїл зійшов із нічного поїзда разом із 399 товаришами. Вони мали оселитися в Томску й приєднатися до двох тисяч солдатів, що прибули раніше за наказом найвищої військової влади Сибіру. Розбиваючи табір, він відчув на собі погляди. Коли місто мистецтва прокинеться й побачить військо, буде хаос.\n\nДмітрій Шостаковіч вийшов із халупи-в'язниці вдосвіта, абияк обмотавши шию шарфом. Звичний план: зібрати потрібне й повернутися «додому» пити. Та біля вокзалу він побачив, як поїзд випускає потік солдатів. Старий негайно розбудив давніх союзників у колись рідному місті й підготував їх вийти на вулиці."
 SBA_PowerStruggle.27.a: "На світанку Томск опинився на замку."
 
 SBA_PowerStruggle.28.t: "Чорна Армія червоніє"
 SBA_PowerStruggle.28.desc: "Біля перепрофільованого томського відділка поліції, тимчасового штабу Чорної Армії, скандування, тупіт ніг і тиха оркестрова музика протестувальників утворили досконалий супровід до громадянської війни, що вирувала всередині Чорної Армії.\n\nАнархізм не знає кордонів - принаймні так кажуть. Насправді анархісти вже розділили навпіл себе, а невдовзі могли розітнути й усю Вільну Територію. По різні боки казарми виникла межа, і майже всі 2 400 чоловіків обрали сторону. Ліворуч, за іронією, стояли ті, хто погоджувався з наказами. Навпроти них сформувалася строката коаліція противників розгортання. Поки що їхніми кулями були слова, але суперечки дужчали, а напруга невпинно зростала.\n\n«Ви поводитеся так, наче не знаєте, де ми! - один голос силкувався перекричати натовп. - Це місто мистецького самовираження й культурного поступу, а не війни! Я був тут, коли товариші Сіуда й Стєпанов ішли тими самими вулицями, якими тепер ідуть протестувальники, і бачив, як...»\n\n«Господи, та стулися вже! - відрубав голос з іншого боку. - Так хочеш вихваляти реакціонерів - приєднуйся до них. Ми тут, щоб зберігати мир, і ця демонстрація лише доводить правоту генерала Стєпанова. Поки наші товариші винищують останні рештки етатизму на сході, наш обов'язок - підтримувати порядок тут». Схвальний гомін змагався з глузуванням сіудистів.\n\nПоки суперечка шаленіла, один чоловік, недавній новобранець Чорної Армії, нервово сидів біля радіо. Від самого початку протестів він годинами відчайдушно викликав хоч когось, хто відновить порядок. Та стало очевидно, що Вільна Територія була не більшою за свої найгучніші імена. Без проводу Валєнтєєва, рішучости Мішурєнка та ідейної переконаности Сіуди Армія лишилася без напрямку, й жодні голосування не могли владнати проблему. Нарешті радіо милосердно затріщало й ожило. Після багатьох годин спроб його з'єднали з генералом Стєпановим у тимчасовому східному штабі в Чіті. «Товаришу генерале, це Павєл...»\n\n«Мені байдуже. За останню годину ви тридцять разів намагалися до мене додзвонитися. Що відбувається?»\n\n«Протести. Вони протестують через...» Десь позаду розбилося скло, а голоси двох угруповань стали гучнішими. «Товаришу генерале, люди хочуть, щоб ми пішли, і частина наших чоловіків із ними згодна. Десятки вже приєдналися до протестувальників. Прошу вказівок»."
 SBA_PowerStruggle.28.a: "Крізь зціплені зуби ґенерал наказав відступити."
 SBA_PowerStruggle.28.b: "Рішуче ґенерал зажадав відновити порядок у Томску."
 SBA_PowerStruggle_28_tt:0 "Збільшує вплив §RСіуди§! в Томску."
 
 SBA_PowerStruggle.29.t: "Ганебна хода"
 SBA_PowerStruggle.29.desc: "Іван Стєпанов завмер, не маючи на це часу. Він ледве виїхав із Новосібірска, а картковий будинок уже сипався. У слухавці звучав крах планів. Якби він старався більше, почав раніше, передбачив далі! Ретельніший добір дав би вірних командирів, краще планування випередило б протести. Заднім розумом усе досконале.\n\n«Товаришу ґенерале?» Два слова витягли його з безодні «якби». Із балкона царського палацу він дивився на нове, беззаконне, неприборкане місто. Воно не стане його, якщо ядро влади впаде. Поступитися першому опору? Але як тримати схід під чоботом, якщо не втримав Томск?\n\n«Товаришу ґенерале? Наказуйте».\n\nЧасу не було. Стєпанов глибоко вдихнув. «Слухайте уважно. Повна перебудова командування. Половина лишається на околицях - ґенерал Мішурєнко підготує місця. Решта, прихильники агітаторів, вирушає патрулювати південний кордон. Ґенерал Чапаєв відкриє штаб у Туві. Зрозуміло?»\n\n«Так, товаришу ґенерале».\n\n«І ще. Коли йтимете, пам'ятайте: це не ганебна хода й не остання ваша зустріч із містом»."
 SBA_PowerStruggle.29.a: "«Коли я повернуся, протестів не буде»."
 
 SBA_PowerStruggle.30.t: "День, коли музика померла"
 SBA_PowerStruggle.30.desc: "Усе почалося на радіо три десятиліття тому. Дімітрій Шостаковіч - найкращий композитор свого часу! Провидець, геній, вундеркінд. Протягом тих десятиліть ці означення відійшли на задній план, викрадені й замінені новими: політик, провідник, герой. Та й ці титули затрималися ненадовго. Коли анархісти Чорної Армії рушили на північ, до міста, яке стало його домом після падіння Союзу, він перетворився на повну протилежність молодому собі: п'яницю, невдаху, відлюдника. Якийсь час здавалося, що саме ці слова стануть останніми, якими його опишуть. Пристрасть згасає, талант - ні. За що б не брався Дімітрій Шостаковіч, він досягав величи в усьому; навіть зазнаючи невдачі, робив це велично й із надією. Сподівався навіть під час падіння Томська, що над містом зійде нове сонце.\n\nУсе почалося на радіо три години тому. Наказ Стєпанова був чіткий: жодного відступу, жодної капітуляції перед вимогами протестувальників припинити окупацію. Солдати вихлюпнулися з будівлі двома течіями, що розійшлися з одного русла. Одна потекла на бік народу й протестувальників, друга - до протилежного краю міського майдану. Коли чоловіки стали на місця перед останньою симфонією й приготувалися до крещендо, стало ясно: переможця визначено наперед. Протест організували нашвидкуруч, якщо він узагалі був організований. Чоловіки, жінки й діти стояли пліч-о-пліч, маючи лише кулаки й рішучість, і знали, що програють. Солдати, маріонетки генерала-змовника, вишикувалися для виконання наказів, а за ними неодмінно чекала підмога. Дімітрій Шостаковіч безпорадно дивився, як його місто втретє за життя розколюється навпіл.\n\nЯк Давид убив Голіята, так і крихкий мир убив один-єдиний камінь. Хтось із одного чи другого боку жбурнув його в супротивників. Один камінь став десятьма, голоси солдатів дужчали, нашвидкуруч зібрана композитором симфонія грала голосніше, намагаючись їх заглушити, а анархія розлилася, мов бурхлива ріка. Коли каміння перетворилося на кулі, Дімітрій Шостаковіч востаннє мигцем побачив своє місто: гострий біль пустив коріння в черепі й розповзся назовні, наче зараза. Коли він лежав помираючи, музика стихла. Замовкло скандування."
 SBA_PowerStruggle.30.a: "І почалися крики."
 
 SBA_PowerStruggle.31.t: "Без сну на Західному фронті"
 SBA_PowerStruggle.31.desc: "Було пізно - принаймні для старого. Генерал Андроній Мішурєнко стояв, міцно зчепивши руки за спиною, й дивився за обрій, на захід. Обличчя не ворухнулося: він зберігав ту саму поставу й стоїчну гідність, з якою вирішив триматися. Та серце боролося з розумом, і останнім часом розум дедалі частіше програвав. Він тужив за заходом, але з кожним днем образ дому ставав трохи розмитішим. Щоночі на рубежі з воєнними державами заходу він думав перейти кордон - просто вийти з Вільної Території й повернутися до Севастополя, до Москви, до Лєнінґрада, додому.\n\nМаленька рука, що міцно схопила його ззаду, буквально струснула Мішурєнка з думок. Старий генерал обернувся зі спотвореним гримасою обличчям, уже готовий прочитати нотацію про належний спосіб привертати увагу начальства. Та спершу він придивився, з ким має справу. Перед ним стояв худорлявий хлопець, один із тисяч таких самих, з відчаєм в очах. Мішурєнко ніколи не мав сина - а може, й мав, бо тепер навіть найважливіші подробиці було важко згадати. Проте погляд хлопця безпомилково казав: сталося щось серйозне.\n\n«Товаришу генерале! - вигукнув хлопець. - Бійка!» Він зігнувся, сперся руками на коліна й намагався віддихатися. «Двоє чоловіків, я не знаю їхніх імен, вибачте, я... ну, я одразу побіг сюди, хтось наказав, його імени я теж не знаю, вибачте. Двоє новобранців, таких як я, вони... вони почали битися. Один із Канська, це я знаю. Казав, що його батько особисто зустрічав Сіуду - тобто товариша Сіуду, вибачте! А тоді інший, другий чоловік, сказав щось про брак рішучости, про те, що його батько служив із товаришем генералом Стєпановим, і...»\n\nМішурєнко підняв руку, змусивши схвильованого хлопця замовкнути. Ніч знову стала тихою; лише слабкий вітер нагадував, що світ і далі обертається. Старий генерал знову поглянув на захід, на все, за що боровся, й ретельно обдумав становище. Про тертя між хлопцем і Стєпановим він знав добре, але тепер воно ширилося Армією. Хай він буде проклятий, якщо дрібна політика зупинить його повернення додому. Мішурєнко поклав руку хлопцеві на плече й подивився просто в очі. «Дякую. Далі я владнаю все сам»."
 SBA_PowerStruggle.31.a: "Рідкісний проблиск здорового глузду божевільного ґенерала."
 
 SBA_PowerStruggle.32.t: "Особистий лист"
 SBA_PowerStruggle.32.desc: "«Кому: Ґенералові Івану Стєпанову\n\nЯк найстарший виборний офіцер Чорної Армії я бачив багатьох. Я одним із перших приєднався до руху й відтоді гадав, чи не помилився. Десятиліття тому, мерзнучи в залі асамблеї Канска, я дивився, як ви будуєте собі царство - царизм усередині анархії. Спершу й сам повірив вашим хитрощам і думав, що ви віддані справі не менше за Пьотра.\n\nТа коли ми виросли з бандитів у державних мужів, я побачив вас. Ви ґенерал, не ідеолог. Учора двоє моїх підлеглих побилися через політику, яку проповідуєте ви й хлопець. Тоді стало ясно: ваші плани на Росію значно ширші за доброзичливу подорож на схід.\n\nЯк офіцер я, можливо, упереджено обираю коня в боротьбі за владу, але дам пораду. Ваші дії щодо Армії та народу огидні, й гірше ще попереду. Ви маєте повагу й величезну силу, та ніколи не зрівняєтеся з популярністю хлопця. У походах по трупу Союзу я не зустрічав рівного Пьотрові Сіуді в чарівности та рішучості. Якщо хочете перемогти, відкиньте надію виграти словами.\n\nПоки вас і Сіуди немає, ширяться чутки. Хибне рішення щодо Томска це підтверджує. Подейкують про повстання в Кемерові, хоч доказів я не маю. Контакт в Амурі каже, що Сіуда незабаром прибуде туди. Це нагода усунути проблему раз і назавжди. Я не вказуватиму вибір, але якщо хочете правити як сильна рука - дійте як сильна рука»."
 SBA_PowerStruggle.32.a: "Прагнучи назавжди позбутися проблеми, Стєпанов почав планувати вбивство Сіуди."
 SBA_PowerStruggle.32.b: "Продовжуючи довгу гру, Стєпанов почав планувати розслідування протестів у Кемерові."
 
 SBA_PowerStruggle.33.t: "Ігри скінчилися"
 SBA_PowerStruggle.33.desc: "Стєпанов перечитував лист Мішурєнка без кінця: ходив і читав, лежав і читав, тиснув руки й подумки повторював слова, будуючи зв'язки майбутнього диктатора. Якщо хоче бути сильною рукою, мусить так діяти. Фраза не давала сну, спокою й працездатности. Повернувшись до колишнього Імператорського палацу, він знову став на балконі й шукав відповідь у місті.\n\nВін ненавидів себе. Завжди холодний і зібраний, від одного листа став нерішучим. То була лише маска, але він сподівався, що вдавання стане сутністю. «Нерішучий» - слово переслідувало його. Мішурєнко, старий забудькуватий ґенерал, мав зухвалість наказувати. Ким він себе вважає? Тим, хто має рацію.\n\nДесь на сході був Сіуда. Руки Стєпанова стиснулися. Якщо нічого не зробити, хлопець лишить Росію слабкою купою уламків. Нагод убити його було вдосталь, але Стєпанов вагався не через дружбу, а через страх. Коли визнав, що Сіуда може перемогти, рішення стало очевидним: хлопець помре, а він правитиме. Найвідданіші люди чекатимуть Сіуду біля місця призначення, а сам Стєпанов повернеться до Центрального Сибіру заради алібі."
 SBA_PowerStruggle.33.a: "Наші рішення розходяться хвилями й змінюють майбутнє."
 
 SBA_PowerStruggle.34.t: "Замахнувся - і схибив"
 SBA_PowerStruggle.34.desc: "Пьотр Сіуда нудьгував у машині, що перетинала російські простори. Проєкт денацифікації колишніх володінь Родзаєвского мав гучний успіх, навіть якщо в боці Пьотра весь час сиділа одна чимала скалка. Попереду, підстрибуючи на нерівностях, їхала машина його особистої охорони. Позаду близько трималися ще дві: в одній їхали Євґєнія та інші помічники, за ними - вантажівка з припасами. Утомившись від утоми, Сіуда нахилився вперед із заднього сидіння. «Товаришу, - звернувся він до водія, - ми досі встигаємо до міста перед північчю? Ми планували розташуватися там на ніч і взятися до роботи від самого ранку».\n\nВодій кивнув. «Так». Сіуда всміхнувся: людина небагатослівна! Схоже, саме такі до нього й тяглися, мабуть, щоб урівноважити його власну словесну щедрість. Задоволений Пьотр відкинувся на сидінні й дозволив собі заснути, виснажений напруженим розкладом.\n\nЩе до того, як розплющив очі, він відчув біль у голові. Сіуда лежав долілиць на підлозі машини. Двигун ревів, а на крутих поворотах його ось-ось мало кинути по салону, наче м'яча на шкільному подвір'ї. Він міцно схопився за сидіння, підтягнувся й побачив, як земля стрімко проноситься повз. Пьотр насупився: попереду крізь лобове скло не було видно жодних фар. Думки помчали майже так само швидко, як машина. Його викрадають? Ні, напевне ні: дві машини позаду ніколи б такого не допустили. Сіуда знову нахилився до водія. «Що ви робите?!»\n\nНе відводячи очей від дороги, водій спокійно відповів: «Машину попереду атакували». Він навіть відпустив кермо, щоб наочно пояснити. «Із лісу ринули чоловіки, у них були рушниці, ось так». Водій удав, ніби тримає зброю. «Треба вивезти вас звідси». Він знову схопив кермо й далі мчав на повній швидкості. Сіуда вдруге відкинувся на сидінні, намагаючись осмислити становище. Це був не напад бандитів, а замах на вбивство. Ні для кого не було таємницею, що багато людей прагнули його смерти, але ресурси для такого нападу мав лише один."
 SBA_PowerStruggle.34.a: "Стєпанов."
 
 SBA_PowerStruggle.35.t: "Пекло не знає такої люті"
 SBA_PowerStruggle.35.desc: "За годину й тридцять шість хвилин мине рівно доба від останнього від'їзду Стєпанова з Імператорського палацу. Отже, за годину й тридцять п'ять хвилин буде доба зі смерти Пьотра Сіуди. Стєпанов глибоко дихав. Це добре, казав собі. Рішення сильної людини. На тисячний раз він майже повірив, і тривога відступила.\n\nЗ літака Росія розляглася внизу. Тепер ніщо не завадить захопити владу. Промову вже відрепетирувано: під час спільної інтеграції зрадник із Россійської Фашистської Партії атакував машину Сіуди, а Стєпанов ледве врятувався. Він уже думав про перший крок після захоплення Росії. Вечеря звучала непогано.\n\nПараноїк Стєпанов наказав негайно доповісти про замах. Солдат приніс аркуш. «Товаришу ґенерале, звістка від людей на місці про вашу... операцію». Стєпанов узяв папір і відпустив його.\n\nВін гарячково водив пальцем по словах: засідка, Сіуда, сутичка, втеча, провал. На останньому завмер. Сіуда втік неушкодженим і, певно, здогадався про плани. Іван розірвав аркуш і зім'яв половини. Легкого виходу не буде. Найманці підвели, але він не підведе. Тепер доведеться бути сильною людиною."
 SBA_PowerStruggle.35.a: "Доведеться зробити це самому."
 
 SBA_PowerStruggle.36.t: "При дворі народного князя"
 SBA_PowerStruggle.36.desc: "«Я тут народився, - Алєксєй обвів рукою все довкола. - Кажу тобі, один зі старих генералів Союзу геть утратив глузд і проголосив себе королем! Мій батько буквально був там, коли Сіуда сказав Рюрікові, що не вбиватиме його». Іван, який ішов поруч, лише закотив очі. Авжеж. Він був довірливим і кілька разів ставав жертвою жартів, але не був дурнем. Місто навіть не скидалося на королівство! Убоге, без пам'ятників королеві, без придворної пишноти - просто таке саме, як решта Росії. «Досі не віриш? - запитав Алєксєй, обернувшись до Івана. - Повіриш. Склад, до якого ми йдемо, нібито доверху набитий старими речами з королівства. Рушниці, форма з короною. Сам побачиш».\n\nКоли вони нарешті прибули до складу, сонце вже почало сідати. Виборний офіцер поділив роту на дві групи, щоб кожна обшукала свою половину будівлі. На прикрість Алєксєя, їх з Іваном поставили разом, і вони почали перебирати ящики. Не знайшовши нічого істотного, Іван переможно випростався. «Я ж казав. Тут немає нічого, що доводило б існування королівства. Серйозно, треба бути особливим дурнем, щоб дума...»\n\nБез попередження склад поглинула непроглядна темрява. Розмови миттю стихли, над усіма запала тиша. На якусь мить Іван був певен, що осліп, але вже за секунду світло спалахнуло знову. Посеред будівлі озброєні вартові стояли колом довкола чоловіка в розкішній довгій хутряній накидці. Напруга була майже відчутною; солдати Чорної Армії розгублено перезиралися. «Це незаконний обшук, - прогримів чоловік, - і очевидне порушення народних прав. Тому міліція оточила будівлю, щоб зберегти недоторканність нашого майна. Усі озброєні солдати негайно покинуть цю місцевість». Іван обернувся до Алєксєя, широко розплющивши очі й не відводячи їх від чоловіка, у якому впізнав князя Юрія. Князь стояв до Івана спиною, а обидва хлопці опинилися так, що вартові їх не бачили. Іванове дихання затремтіло, він поглянув на зброю. Його охопило щось непідвладне волі. Тремтлива рука стиснула рушницю, він прицілився,"
 SBA_PowerStruggle.36.a: "І натиснути на гачок."
 SBA_PowerStruggle.36.b: "І опустити зброю."
 
 SBA_PowerStruggle.37.t: "Ні королів, ні панів"
 SBA_PowerStruggle.37.desc: "Іван ніколи раніше не стріляв у людину. Це трохи нагадувало стрільбу по мішені, якій його навчали. Він нервував, та саме до цього й готувався. Здавалося, можна простежити політ кулі в сповільненому часі, коли світ рухався зі швидкістю хвилина за секунду. Він дивився, як один за одним люди реагували на звук. А тоді почув уже не один, а десять, а потім сотні пострілів, коли всі усвідомили, що сталося. Князь, одна з останніх ланок династії Рюриковічів, приєднався до сестри на підлозі складу.\n\nАлєксєй миттю смикнув Івана на холодну підлогу. Очі в нього були шалені, голос тихий, але панічний. «Ти застрелив його! - задихано сказав він. - Ти застрелив його!» Алєксєй повторював ці слова знову й знову, та Іван майже не чув за стріляниною довкола. Він не заплющував очей, боячись, що тоді знову побачить князя. Алєксєй схопив його за плечі, і далі лежачи долілиць. «Ти застрелив його, Іване! О Боже!» Їм не треба було дивитися, щоб знати: почалася різанина. Та Іван не втримався й визирнув із-за схованки. Він побачив двері, якими вони ввійшли, двері до зовнішнього світу, де ще кілька хвилин тому це завдання було нудним. Князь не блефував. Усередину вбігали нові люди, вірні короні чи просто місту, й падали одразу, щойно переступали поріг.\n\nЦілу вічність стрілянина й запах смерти висіли в повітрі, витісняючи кисень і намертво притискаючи двох молодих солдатів до місця. Кілька разів постріли стихали, а тоді починалися знову, ще лютіше. Нарешті вони замовкли остаточно, та Іван не підвівся. Алєксєй підвівся - і заплакав."
 SBA_PowerStruggle.37.a: "Безглузда кривава бійня."
 SBA_PowerStruggle_37_tt:0 "Збільшує вплив §gСтєпанова§! в Кемерові."
 
 SBA_PowerStruggle.38.t: "Нові пригоди князя"
 SBA_PowerStruggle.38.desc: "Тремтливі руки Івана розтиснулися, і рушниця впала на підлогу. Алєксєй здригнувся від звуку й кілька разів приголомшено перевів погляд з Івана на зброю й назад. Він закричав пошепки: «Господи! Ти збирався його застрелити? Хочеш, щоб нас усіх повбивали?» Іван силкувався знайти слова, затинаючись у якомусь поясненні: він лише хотів знешкодити небезпеку до початку сутички, просто діяв за навчанням, ніколи раніше не був у бою - мільйон інших виправдань забив йому горло.\n\nВиборний офіцер ступив уперед, прибравши руки від зброї, й тихо заговорив із князем. «Ми лише перевіряємо повідомлення, що в цій будівлі зберігають зброю та боєприпаси для повалення Вільної Території. Рада Безпеки надала нам повне право розслідувати й знищувати проетатистські заколоти до того, як вони спалахнуть». Офіцер підійшов ближче до князя, змусивши його охорону напружитися. «Якщо вам і народові цього міста нема чого приховувати, то нема й причини наставляти на нас зброю».\n\nКнязь похитав головою й суворо відповів: «Ви повалили це королівство в ім'я свободи, а тепер розтопчете її через саму можливість небезпеки?» Він непокірно схрестив руки. «Ультиматум лишається незмінним».\n\nАлєксєй обернувся до Івана. «Бачиш, я ж казав, що не брехав. Тут справді було королівство». Вони дивилися, як офіцер і князь, здавалося, цілу вічність обмінюються репліками. Іван трохи опанував себе, але не міг позбутися думки, що ледь не накоїв чогось жахливого. Поки вони сиділи й чекали, чекали й чекали, солдати з обох боків поступово заспокоювалися. Напруга лишалася, та тепер найменший звук уже не спричинив би різанини. Однак усі не помічали дедалі більшого натовпу цивільних за стінами складу. Князь не блефував. Коли офіцер нарешті відійшов від Юрія, містяни вже переважали солдатів числом, тож іншого вибору, крім прийняти князеві вимоги, не лишилося. Один за одним бійці вийшли зі складу з порожніми руками й ганебно помарширували з Кемерова."
 SBA_PowerStruggle.38.a: "Стєпанов не зрадіє цій звістці."
 
 SBA_PowerStruggle.39.t: "Свіжий випуск! Читайте все!"
 SBA_PowerStruggle.39.desc: "Редакційна стаття Віктора Нєкрасова в томському «Революціонері».\n\n«Тиха ніч у Кемерові стала чим завгодно, тільки не тихою. Без пояснень і попереджень до міста ввійшли сто солдатів. Томску ця історія знайома. Військо зайняло будівлю, а коли громада опиралася зневазі до анархістських цінностей, Чорна Армія виступила проти народу. Повної історії ще немає, але схоже, підставою стала хитка чутка про контрабанду зброї. Чекаючи новин, запитаймо, чому таке стається дедалі частіше.\n\nНедовіра до військової влади виправдалася. Згадайте останню асамблею: скільки там було вартових? А на попередній? Поки Валєнтєєв і Мішурєнко на різних кінцях Території, а Сіуда й Стєпанов на сході, Чорну Армію лишили няньчити нас, доки Мами Анархії та її численних наречених немає.\n\nСутички в Томску й Кемерові доводять: навіть якщо Чорна Армія відвернулася від свободи, народ - ні. Тиск має бути постійним і повсюдним, придушуючи авторитаризм у зародку. Що зробите ви, коли сотні солдатів увійдуть до вашого міста? Встанете чи дивитиметеся, як помирає свобода? Держава в чорному не може маскуватися під анархію. Питайте «чому», бо за кожним розгортанням і переміщенням стоїть чийсь наказ»."
 SBA_PowerStruggle.39.a: "Як журналісти вчепляться в добру історію - вже не відпустять."
 
 SBA_PowerStruggle.40.t: "Полетять голови"
 SBA_PowerStruggle.40.desc: "Імператорський палац був багатьма речами: домом, осередком міста, пам'ятником непохитній рішучості російського народу в службі своєму цареві. Для Павєла, селянського хлопця з родини хліборобів Ангарського басейну, він був мрією, місцем таким самим реальним, як Москва, але живим лише в минулому. Коли велетенські металеві двері з гуркотом зачинилися позаду, Павєл прокинувся від мрії. Імператорський палац більше не був домом чи бодай чимось подібним. Тепер він став кладовищем. Порожнім, крім двох останніх мешканців: селянина й самозванця.\n\nПозаду Павєл досі чув вигуки й гучну луну промови товариша генерала, досі відчував запах попелу від награбованих творів мистецтва, пропагандистських листівок і спалених тіл. Та й попереду видовище було не кращим. На підлозі скорченим лежало тіло чоловіка, зім'яте й кинуте, наче нікчемний клапоть паперу; з обличчя звисали рештки окулярів. Якби не ледь помітне здіймання грудей, його неможливо було б відрізнити від трупа. Павєл сумно всміхнувся чоловікові. Це було моторошно, але правильно, правда? Саме це він і мав бачити - адже він солдат, анархіст!\n\n«Селянин». Тихий голос чоловіка внизу вирвав Павєла із заціпеніння. «Вони прислали селянина мене прикінчити». Чоловік засміявся, та сміх швидко обернувся кашлем, а тоді хрипом. Павєл мовчки дивився, як безформна купа набуває людських обрисів і підводиться навколішки. Вони зустрілися поглядами. «Так же? Ти не шляхтич. Ти хлопчик».\n\nПавєл глибоко вдихнув і відчув, як рука тягнеться до пістолета. Той мав рацію. Він був лише хлопчиком.\n\n«Що я зробив, щоб заслужити це? Померти навколішки від руки селянина? Решту страчували перед народом, під грім промов і демонстрацію військової сили!» Слова самозванця прокотилися луною порожньою будівлею. Павєл вихопив зброю й, як йому наказали, приставив до чола полоненого. «Це не справедливість і не свобода. Невдовзі ти зрозумієш, що стоїш на боці тиранії»."
 SBA_PowerStruggle.40.a: "Кулі байдуже до родоводу."
 SBA_PowerStruggle_40_tt: "Збільшує вплив §gСтєпанова§! в Бурятії."
 
 SBA_PowerStruggle.41.t: "Хитрий задум чорносорочечника"
 SBA_PowerStruggle.41.desc: "«Зачекайте за кілька метрів на північ. Побачите мене, коли я закінчу», - наказав Стєпанов, відпускаючи помахом руки охоронців і виходячи з машини. Заглушений двигун знову ожив, фари вантажівки дали єдине світло навколо. Короткого сяйва вистачило Стєпанову, щоб добре роздивитися місцевість: сніг, дерева, знову сніг і дерева. Єдиною ознакою цивілізації була напіврозвалена халупа попереду. Неймовірно, пирхнув він, яка особлива порода ідіотів погодилася б воювати за це? Зашурхотіла по снігу ґума, і світло позаду згасло. Стєпанов глибоко вдихнув, напевне набравши більше морозу, ніж кисню, й поправив кашкета. Це мало бути варте зусиль.\n\nВін не встиг дійти до входу, як двері розчинилися й назовні викульгавив літній чоловік, явно без одного ока й напевне без частини мозку. «Генерале! - благоговійно вигукнув він, хоча вони ніколи не зустрічалися. - Для мене честь приймати вас, заходьте». Старий розвернувся на п'яті й рушив назад до сибірської халупи, а Стєпанов ішов на безпечній відстані. Усередині його миттю накрила знайома хвиля смороду цвілі. Джерело знайшлося швидко: по всій підлозі були розкидані теки, документи й окремі папірці. Бюрократ у душі Стєпанова здригнувся від того, як упорядкували явно важливі відомості, але цікавість перемогла нав'язливе прагнення порядку, коли погляд ковзнув по свастиці на кожному документі.\n\n«З таким за містом краще не показуватися! - піддражнив старий. - До того ж кажуть, ваш друг збирається навідати Родзаєвск».\n\nСтєпанов насупився від самої думки, що він міг би дружити з недоумком, який торочив свою маячню. «Справді. Певен, вас це не тішить. Не думаю, що він їде ставити пам'ятник покійному Вождю».\n\nСтарий диявольськи всміхнувся й щиро розреготався. «Тішить не більше, ніж вас, генерале!» Він гепнувся на дерев'яний стілець, який ледве витримував його вагу, й жестом запросив Стєпанова сісти. «Довкола вас розкидана праця всього мого життя: кожен документ про Россійську Фашистську Партію, її членів та операції. Безцінні відомості для того, хто хоче влаштуватися в цих краях».\n\nСтєпанов розвів руками. «Так ви й писали в листі. Та я навряд чи повірю, що це дарунок доброї волі від фашиста такій людині, як я. У чому підступ?»\n\n«А ви як думаєте? Я хочу того самого, що й ви!» Старий нахилився набагато ближче, переваливши живіт через стіл; його обличчя опинилося за кілька сантиметрів від Стєпанова. «Я теж чекаю на свою частку Сибіру»."
 SBA_PowerStruggle.41.a: "Може, він не такий дурний, як думав Стєпанов..."
 SBA_PowerStruggle_41_tt: "Збільшує вплив §gСтєпанова§! в Амурі."
 
 SBA_PowerStruggle.42.t: "Караван зрадників"
 SBA_PowerStruggle.42.desc: "Маґадан був не одним містом, а двома - не як Буда й Пешт, хоча думка про угорську столицю викликала в старого румуна саркастичну усмішку. Один Маґадан був цілком вигаданим: на заході його уявляли сучасною Венецією, слабким, але живим серцем Росії. Іноземні товари робили місто придатнішим для життя, але чим купа лайна краща за гору? Може, він надто суворий: Маґадан був домом більшу частину десятиліття. Щось же втримувало найманця на місці.\n\nБуло пізно, десь між темрявою й глибокою темрявою, але хмари не ховали світла корчми на пагорбі. Ось і магія! Румун відчинив двері й увійшов у тепло.\n\nЛюдей у барі було мало, зате їхні гучні характери це надолужували. «Дивіться, кого принесло!» - гукнув голос із важким «р». Румун повісив пальто. «Поглянь на цю пропозицію! Такої не бачив!» Він сів за круглий стіл лицарів Вербелла. Посередині лежала стосом купа паперів, угорі - незрозумілі великі червоні літери.\n\n«Цей мій». Спритна рука вихопила аркуш. «Кирилиця, але мова французька». Румун перерахував: один французькою, один румунською, два англійською.\n\n«Той ґенерал, мсьє... Стєпанов? Пропонує... дуже багато».\n\n«Ага, - озвався співрозмовник. - Але підозріло. Навіть Ненсі відмовилася й узяла іншу пропозицію від якоїсь пані, пов'язаної з ґенералом. Та за такі гроші я радо поділюся з вами - анархізм до біса»."
 SBA_PowerStruggle.42.a: "Анархізм і справді до біса."
 SBA_PowerStruggle_42_tt: "Збільшує вплив §gСтєпанова§! в Маґадані."
 
 SBA_PowerStruggle.43.t: "Вам лист"
 SBA_PowerStruggle.43.desc: "Чєрнов завжди був людиною обов'язку: від миті народження його життя визначала непохитна відданість країні та справі, в яку він вірив. Скільки себе пам'ятав, НКВД було єдиним, що він знав. Там його навчили відрізняти правильне від неправильного, кого вбивати й що означає вбивство, розповіли про велику революцію. Він прийняв усе це, навіть коли старі товариші один по одному зникали під чоботом нового режиму, нового обличчя, що спрямовувало руку й кликало народ до запалу нескінченного повстання.\n\nЗвісно, усе це він уже бачив. Нескінченні ночі минали навпочіпки в затхлих кабінетах; світські розмови були зайві під хвилями того спільного, що єднало їх усіх, - революції. Для Міхаїла Чєрнова довічна присяга захищати революцію й усе, що її супроводжувало, була пекучим вогнем у душі, полум'ям, яке не давало крижаному холоду гіркої дійсности просочитися в саму його сутність.\n\nЦя оболонка раптом розлетілася на друзки. Громовий стук у двері розбив відносну тишу оселі; з-за побитого входу долинало приглушене хрипке дихання, а мрії про минуле розсипалися перед жахливим сьогоденням. Ностальгія розчинилася в клекотливій ямі відчаю й паніки, чоло вкрилося потом, а задушливий жар усередині спалахнув ревучим полум'ям жалю. Паніка перетворилася на дію. Авангардист підвівся з-за столу й на мить завмер, думаючи, чи не поритися в шухляді в пошуках захисту.\n\nРушивши вперед, Чєрнов мало не перечіплювався через пошарпані дерев'яні дошки. Безперервне рипіння гнилого дерева сповнювало кімнату, поки тремтлива рука невпинно тяглася до клямки. Долоня була слизька від поту; він ніяк не міг її повернути, та зрештою вчепився в латунь, опустив зап'ясток і дозволив дверям із грюкотом розчинитися всередину поруч із ним.\n\nТа замість спалаху пістолета, якого очікував колишній оперативник, до його обличчя простягнули лист. Блідо-білий папір прикрашала майже зухвало-червона печатка."
 SBA_PowerStruggle.43.a: "Революція кличе тебе, друже."
 SBA_PowerStruggle_43_tt: "Збільшує вплив §gСтєпанова§! в Іркутску."
 
 SBA_PowerStruggle.44.t: "Важка публіка"
 SBA_PowerStruggle.44.desc: "«Як на таку довгу дорогу, воно того не варте», - з отруйною огидою буркнув старий військовик. Бурятія була лише черговою зупинкою на шляху до влади, й Стєпанов сподівався здобути щось істотне. Натомість прийом був холодним, люди не цікавилися майже нічим із його слів.\n\nПалка пристрасть і риторика залізного кулака не пробили порожніх поглядів. Наприкінці тиради не пролунало жодного оплеску. Сором, зневага й розгубленість навалилися цеглою, переростаючи у відчай від публічного провалу.\n\nТа крізь задуху сорому пробилася гордість: попри затримки й дивні негаразди він випередив Сіуду. Це мало значення. Він охоче ткнув би анархіста цим у лице, але кількох швидких поїздів замало, щоб утоптати його в багно.\n\nСтєпанов відчув рішучість, покрутив у склянці алкоголь і заспокоїв нерви. Стоїчна маска повернулася, а думки вже шукали наступну зупинку."
 SBA_PowerStruggle.44.a: "«Наступна зупинка?»"
 SBA_PowerStruggle_44_tt: "Збільшує вплив §gСтєпанова§! в Бурятії."
 
 SBA_PowerStruggle.45.t: "Паломництво"
 SBA_PowerStruggle.45.desc: "Крижаний вітер бив у товсте пальто Івана, коли він брів засніженими вулицями Омолона. Цокотячи зубами, він прошепотів молитву й з полегшенням побачив, що місцева корчма ще відкрита. Ковзаючи по льоду до порятунку, він згадав, навіщо його прислали.\n\nВиклик до кабінету Стєпанова рідко означав щось добре. Сморід диму й горілки зустрів його перед маршалом. Завдання було просте: чергова блискуча схема підірвати асамблею, особливо Сіуду. За додаткову плату він погодився.\n\nСтєпанов запропонував їхати до релігійного Омолона й оголосити анархіста завзятим безбожником. Іван подумки засміявся, та смертельно серйозний погляд командира вбив жарт.\n\nТепер його оточували захоплені місцеві, а він нервово просторікував про збочене зло анархіста та ненависть до Бога й учення. Такого успіху він не чекав, але продовжував вигадувати глибокі знання про атеїстичну природу анархізму для всього Омолона.\n\nЛюди кивали - мабуть, схвально. Іван тихо видихнув із великим полегшенням."
 SBA_PowerStruggle.45.a: "«Слухайте добре - бійтеся Анархіста!»"
 SBA_PowerStruggle_45_tt: "Збільшує вплив §gСтєпанова§! в Якутску."
 
 SBA_PowerStruggle.46.t: "З байдужістю, від одного ґенерала іншому"
 SBA_PowerStruggle.46.desc: "Серед колон, грому оркестру й вигуків громадян стояв украй байдужий ґенерал Іван Стєпанов, а тупіт чобіт відбивав ритм головного болю. Назовні він удавав відважного стоїка, та втомлені очі ледве переходили з людини на людину. Як Сіуда це витримує - завжди бадьорий, оптимістичний і готовий вивергнути маячню? На мить Стєпанов подумав, що воно того не варте й він не створений правити. Міцна рука на плечі прогнала думку.\n\n«Товаришу ґенерале! Честь зустріти вас!» Перед ним стояв велетенський бородань, за яким V-подібно вишикувалися такі самі здоровані. «Вас тут дуже поважають». Спогад про протести повернувся; як же хотілося забути.\n\nСтєпанов простягнув руку. «Честь моя. Якби натовп переміг, нас би тут не було». Він обернувся до радіовежі - останньої цілі давньої облоги Томска. «Становище було складне, й лише найкращі впоралися б так, як ви». Двоє чоловіків відкрили дерев'яні скрині з медалями. Стєпанов узяв одну й приколов велетневі."
 SBA_PowerStruggle.46.a: "Навіть Стєпанов уміє ділитися славою."
 SBA_PowerStruggle_46_tt: "Збільшує вплив §gСтєпанова§! в Канску."
 
 SBA_PowerStruggle.47.t: "З любов'ю, від одного ґенерала іншому"
 SBA_PowerStruggle.47.desc: "«Вип'єте?» - Стєпанов сьорбнув імпортного алкоголю з особистої колекції. «Останні тижні були для вас не менш тяжкими».\n\n«Ні. Востаннє я пив у Севастополі й більше не питиму, доки...» - холодно відповів Мішурєнко зі схрещеними руками.\n\nСтєпанов кивнув. «Так і думав. І досі не курите?» Той похитав головою й не відводив очей. «Щось гризе, ґенерале? Така мовчанка на вас не схожа».\n\n«Що ви робите? Намагаєтеся звабити мене до майбутнього перевороту?»\n\nСтєпанов самовпевнено всміхнувся. «Не ображатиму ваш розум: вітер змін лютішає. Але чутка про вороже захоплення - брехня. Андронію, пам'ятаєте нашу канську розмову про вірність і подібність?»\n\n«А мій лист пам'ятаєте? - виплюнув Мішурєнко. - Я не ваш пес. Не думайте, що знову обдурили мене. Ваші змови посіяли розкол і недовіру в Чорній Армії. Всім ясно, кому ви вірні. Як і кому вірний я».\n\n«Прошу лише підтримки. Я хочу поставити німців навколішки, хочу помсти й справедливости, - зловісно всміхнувся Стєпанов. - Хочу, щоб ви знову закурили».\n\nСтарий скривився, підвівся й глянув на гладкого ґенерала. «Ви думаєте, що лише ви тримаєте проєкт разом, але помиляєтеся. Після смерти хлопця буде буря». Він обернувся до дверей і взявся за ручку."
 SBA_PowerStruggle.47.a: "«Але це буде необхідно»."
 SBA_PowerStruggle_47_tt: "Збільшує вплив §gСтєпанова§! в Новосібірску."
 
 SBA_PowerStruggle.48.t: "З ненавистю, від одного ґенерала іншому"
 SBA_PowerStruggle.48.desc: "Дим з-під дверей кабінету Стєпанова був звичним, але цього разу він ішов не від сигар, а з вух господаря. «У вас було одне завдання!» Кулак поглибив ум'ятину в столі. «Я давав докладні вказівки, усе потрібне, а ви лишили йому кілька подряпин! Сміховина. Певно, Євґєнія втрутилася...»\n\n«Товаришу Стєпанове, - озвався Чапаєв, якого заманили обіцянкою посади Валєнтєєва, - це тактичний провал. Але Валєнтєєв надовго вибув, і ми подали знак».\n\nСтєпанов здійняв руки. «Чудово! Коли він стане з Сіудою й накаже нас стратити, пишатимемося знаком! Уже той журналіст Астафьєв мене переслідує, а тепер спитають, як я, відповідальний за безпеку, допустив ледь не смерть найстаршого виборного офіцера».\n\n«Можна перекласти провину на Сіуду, подати це як напад радикала...»\n\n«Досить. Через вас я сумую за Мішурєнком - той хоч доводить справу до кінця. Я вже маю план. Припустімо, ідеолога з Бурятії знайдуть мертвим. Самогубство. А в записці - план відродити полум'я, запалене тим моряком. Це розколе Сіуду з найближчими союзниками. Ви знищили шанс заглушити силу його слів. Не підведіть знову, або я знайду компетентних»."
 SBA_PowerStruggle.48.a: "«А тепер геть!»"
 SBA_PowerStruggle_48_tt: "Збільшує вплив §gСтєпанова§! в Красноярску."
 
 SBA_PowerStruggle.49.t: "Час вийшов"
 SBA_PowerStruggle.49.desc: "Багатомісячна боротьба за вплив у щойно приєднаних далекосхідних комунах нарешті завершилася. Супротивники повернулися на ринг з усією владою, підтримкою та впливом. Далекий Схід замовк, поглинутий Вільною Територією, а вдома дедалі гучніше били барабани війни.\n\nЛишалося чекати й дивитися, чи не були всі зусилля марними."
 SBA_PowerStruggle.49.a: "Зрештою гору взяв Канський Хлопець-Промовець."
 SBA_PowerStruggle.49.b: "Зрештою змови ґенерала завжди тримали його на крок попереду."
 
 SBA_PowerStruggle.50.t: "Сенсорне перевантаження"
 SBA_PowerStruggle.50.desc: "Не минуло й двох хвилин, а Стєпанов уже задихався. Одяг і форма злилися в гору заввишки до Уралу. Невже руки такі пухкі? Він дивився то на них, то в дзеркало, доки не побачив звіра в клітці, що стискалася. Він заверещав і безпорадно намагався запхати клятий одяг у валізу. Не ліз.\n\nЯк дитина, що годинами пхає квадратну іграшку в круглий отвір, Стєпанов заплакав. Витер сльози, знову побачив пухку руку, й тиск злетів. Він упав на розкішне ліжко, украдене з палацу Рюриковічів, як і все інше, та розридався. З балкона виднілися всі обличчя, сповнені люті, яку він сам розпалив. Ґенерал Іван Стєпанов перетворився на схлипуючу руїну, і гірше бути не могло.\n\nПронизливий телефон урятував його від почуттів. Стєпанов схопив слухавку. «Вони тут! Сіуда й тисячі! Вони прийшли вбити мене!» Він задихався, чекаючи слів розради. Та це була секретарка, яка нагадала про відпустку до родини. Стєпанов люто кинув слухавку.\n\nВін дошкандибав до вікна й побачив облогу. Ні змови, ні плану. Гра більше не тішила. Росія того не варта; він піде у відставку, здасться - що завгодно! Та цього не вистачить юрбі, яку він обертав проти інших. Стєпанов глибоко вдихнув, спокійно розпакував валізу й сів на ліжку лицем до дверей, готовий отримати заслужену нагороду."
 SBA_PowerStruggle.50.a: "Тут лежить король, похований під власним картковим будинком."
 
 SBA_PowerStruggle.51.t: "Добраніч, але не прощавай"
 SBA_PowerStruggle.51.desc: "«Добраніч, Євґєніє!» Попри все Пьотр Сіуда знаходив час для найближчої подруги. Вони чимало пережили, але воно того варте. Далекосхідна кампанія була бурхливою, та він лишив край кращим, ніж знайшов. Засунувши руки в кишені, Сіуда йшов снігом під міськими ліхтарями. Позаду тягнувся слід, дорога для інших. Голова високо, очі вперед.\n\nЦе було нечесно, неправильно, але інакше перемогти неможливо. Товста рукавиця затулила Сіуді рота. Очі мало не вискочили, коли він усе зрозумів. Він марно пручався проти значно більшого нападника, бив ногами й намагався кричати. Помилився, повіривши місту й гадаючи, що він просто один із народу. Друга рука стиснула горло. Очі засльозилися й за тридцять секунд заплющилися.\n\nДві пари слідів стали однією. Оболонку найбільшого російського мрійника підняли, закинули на плече й понесли. У Канску, серці революції, де Пьотр Сіуда й Іван Стєпанов уклали угоду, що змінила Росію, анархізм помер.\n\nІван Стєпанов, задоволений вершиною праці всього життя, пішов у протилежний бік. Коли позаду зупинилася вантажівка й тіло глухо впало в кузов, він усміхнувся. Це справді було так легко."
 SBA_PowerStruggle.51.a: "У світі темряви світло може сяяти лише певний час."
 
 SBA_LibSoc.1.t: "Серед руїн"
 SBA_LibSoc.1.desc: "Десь у глибині сибірських лісів блукав Пьотр Сіуда. Він тремтів, оголене тіло здригалося від снігу. З усього майна лишився тільки ліхтар із тьмяним світлом. З чорного беззоряного неба за ним стежило бліде біле око. Без напряму й мети Пьотр шкандибав уперед. Похмурий ліс хитався від крижаного вітру, та його волосся не ворушилося. Повітря співало, кликало. Гостинно! Наче дім! Це було... добре. Тремтіння припинилося. Стихія більше його не торкалася. Сніжинки осідали на шкірі й не танули. Це добре! Пьотр засміявся й упустив ліхтар, підкинув сніг і затанцював серед крижаних кристалів. Крутився, звивався й стрибав, забігаючи дедалі глибше. Пісня лісу гучнішала, а його усмішка ширшала.\n\nПісня урвалася. Велике небесне тіло згасло. Ліс став чорним - не просто чорним, а порожнечею, не тьмяною кімнатою, а винищувачем світла. Сміх затих, холод повернувся. Роками Пьотр стояв у винищувачі світла. Раптом дерева спалахнули. Пьотр закричав і почав дерти шкіру. Так гаряче! Надто гаряче! Гаряче! Він танув, шкіра збиралася калюжею. Гаряче. Гаряче. Гаряче-гаряче.\n\nЗ попелястого трупа лісу виросло одне дерево, а на єдиній гілці висіло тіло. Товсте й кругле, воно гойдалося серед полум'я. \"Пьотре, - прогримів труп, - дитино. Поглянь, що ти приніс цьому лісові. Він кишів життям. А тепер дивись! ДИВИСЬ!\" Пьотр не мав очей, але бачив.\n\nВін рвучко сів у ліжку, важко дихаючи. Кімната була такою самою, як до сну. Пьотр засміявся - лише сон! Хихотіння стало реготом, а регіт - риданням."
 SBA_LibSoc.1.a: "Одна з багатьох безсонних ночей."
 
 SBA_LibSoc.2.t: "Промова до стривоженого народу"
 SBA_LibSoc.2.desc: "\"Ваше пальто, товаришу Сіуда\". Євґєнія загорнула Пьотра у ведмежу шубу, завелику для нього. Революціонер дивився вперед, думками деінде. Євґєнія обійшла його й зазирнула в очі, намагаючись знайти там Пьотра. Обличчя спохмурніло. \"Пьотре? Я розумію, що ти вагаєшся\". Зморшкуваті руки лягли йому на груди. \"Ми зайшли надто далеко. Ти мусиш виступити. Я знаю, що виступиш і вчиниш правильно. Ти не він\". Остання фраза зачепила Пьотра, обличчя сіпнулося.\n\n\"Дякую, товаришко Таратуто\". Він щільніше загорнувся й рушив до балкона. Ще не відчинив дверей, а вже чув вигуки: люди скандували його ім'я, кликали захисника Революції від генерала-змія Стєпанова. Пьотр глибоко вдихнув і вийшов у свіже ранкове повітря.\n\nВін чемно кивав, чекаючи кінця овацій. Усе відчувалося інакше. Так ушановували фашистів і мріяли, щоб ушановували царів. Чому він тут? Відповідь була в захопленні людей унизу. Вони обрали його. Довіряли. Він не мав права їх підвести.\n\n\"Товариші! Сьогодні ми долаємо друге випробування! Разом повалили авторитарні держави Сибіру! Вони побиті й скривавлені, але ми мусимо пильнувати. Час збудувати власну анархію, вільну від держави і всередині, і за межами нашої території!\" Пьотр віднайшов упевненість, викладаючи головну ідею анархістського руху й гуртуючи людей. Хоч на мить тягар страху зник із плечей."
 SBA_LibSoc.2.a: "Попереду надто багато роботи."
 
 SBA_LibSoc.3.t: "Роздуми чоловіка, який має все"
 SBA_LibSoc.3.desc: "Доктор Друґов недбало кинув валізи. Перед ним сяяло прекрасне море, а десь далеко за ним стояло місто на пагорбі - місце, де люди могли бути і вільними, і цивілізованими. Тепер уже не важило, що спричинило розпад Росії й піднесення анархії. Запитати було легше, ніж відповісти, тож доктор не питав. Він залюбки сів би на корабель і покинув це божевілля, але...\n\n\"Я так і знала, що знайду тебе тут\", - почувся позаду голос панни Друґової. Не доктора чи пані Друґової - ні, вона вважала себе Друґовою вільною, анархісткою.\n\nДоктор кивнув, не відвертаючись від моря. \"Ти прийшла зі мною, Наталіє?\"\n\n\"Ще чого\".\n\nДруґов засміявся. \"Я так і думав\". Батько й дочка деякий час мовчали. Далекий гудок порушив тишу. \"Мені час\".\n\n\"Так\".\n\n\"Навіщо ти прийшла? Познущатися? Провести мене?\" Друґов люто розвернувся. Дочка не всміхалася й не стримувала сміху - її обличчям текли сльози. Він ступив утішити її, та вона відсахнулася. Батько відкрив рота, прагнучи сказати хоч щось, але знову загув гудок. Він поглянув на дочку, тоді на море."
 SBA_LibSoc.3.a: "Доктор Друґов зібрав валізи й рушив до пристані."
 
 SBA_LibSoc.4.t: "Є куди рости"
 SBA_LibSoc.4.desc: "Адріян притискав книжки до грудей і самотньо блукав кампусом. Гаразд, він не був сам - ішов із групою. Який же дурень, якщо загубився! Як можна не впоратися з ходою по прямій? Дурень! Дурень! Дурень! Він ляснув себе по лобі. Група вже десь у коледжі, а він заблукав у дворі! Господи, пробув тут двадцять хвилин і вже все проїбав, як завжди! Перший у родині студент - і вже зганьбив усіх. Що скаже матері? Що заблукав і його відрахували? Він ніколи...\n\nЗа рогом Адріян із кимось зіткнувся, книжки гупнули на землю. \"Пробачте!\" - вигукнув він, гарячково збираючи речі.\n\nЖінка лише засміялася, потираючи руку. \"Кудись поспішаєш! Дай допоможу\". Вона нахилилася по книжки.\n\n\"П-пробачте, треба було дивитися, я просто...\"\n\n\"Відстав від групи?\" - перебила вона. Почервонілий Адріян кивнув. \"Я так і думала. Не хвилюйся, ти не перший, тут величезно. Я Анастасія, друзі називають Анною. Приємно познайомитися!\" Вона простягнула руку.\n\nАдріян витер спітнілу долоню об штани. \"Вітаю, Анастасіє, я Адріян\".\n\nЇї це розвеселило. \"Що ж, Адріяне, може, я все тобі покажу?\""
 SBA_LibSoc.4.a: "Молода дружба юних умів."
 
 SBA_LibSoc.5.t: "Знову відчувши ґрунт під ногами"
 SBA_LibSoc.5.desc: "Пьотр Сіуда йшов дорогою - якщо ґрунтову стежину можна так назвати - в оточенні найближчих товаришів. \"Ви, мабуть, думаєте, навіщо я вас сюди притяг. Валєнтєєв сказав, що треба частіше виходити в люди, - Пьотр засміявся, не завершивши історії, - що я втрачаю зв'язок із народом. Ось ми й тут!\"\n\nВін тричі постукав у двері занепалої халупи. Почет заповнив хиткий ґанок. Ніхто не відповів. Пьотр постукав сильніше. Тиша. Він зітхнув і вже хотів піти, коли двері розчинилися. \"Ви хто, в біса?\" Очі чоловіка розширилися. \"Товариш Сіуда? Щ-що ви тут робите?\"\n\nЩире привітання викликало в Пьотра гучний сміх. Він простягнув руку. \"Справжній росіянин! Добрий вечір, товаришу. Сподіваюся, не потурбували\".\n\nСпантеличений старий похитав головою. \"Ні-ні, просто не сподівався сьогодні побачити такого, як ви\".\n\nПьотр підняв брову. \"Такого, як я? Товаришу, я звичайна людина й зробив для цієї території не більше за вас. Та завжди прагну зробити для громади все можливе. Тож скажіть, - він уперше за довгий час щиро всміхнувся, - що я можу для вас зробити?\""
 SBA_LibSoc.5.a: "\"Для початку заходьте. На плиті їжа\"."
 
 SBA_LibSoc.6.t: "Робити те, чого не зробить ніхто"
 SBA_LibSoc.6.desc: "\"Віддай!\" Іван рвучко спробував вирвати зброю з рук Міхаїла.\n\n\"Від'їбись!\" Міхаїл відштовхнув товариша плечем. \"Я роблю те, що треба було зробити зі зрадниками багато років тому\".\n\n\"Чого ти досягнеш, застреливши його перед людьми й дітьми? Спатимеш краще?\" Іван указав на юрбу довкола й офіцера навколішки.\n\n\"Не починай знову цю херню! Три місяці слухаю твоє ниття й давно все пояснив! Він зрадник! Навіть не зрадник - він ніколи не був із нами!\" Міхаїл дико розмахував зброєю.\n\n\"Не можна розстріляти всі проблеми! Саме цього хотів Стєпанов!\"\n\nМіхаїл навів зброю на друга. \"Не порівнюй мене з ним! Я не маю з ним нічого спільного!\"\n\nІван широко розплющив очі. \"Господи, що з тобою, в біса? Застрелиш мене за те, що кажу правду?\"\n\nМіхаїл обдумав слова й поволі кивнув. \"Знаєш, ти маєш рацію. Пробач. Тебе я стріляти не хочу. А от його...\" Він миттю повернув зброю до голови чоловіка й вистрілив. Люди закричали, Іван мовчав."
 SBA_LibSoc.6.a: "Це не анархія. Це зло."
 
 SBA_LibSoc.7.t: "Крок назад"
 SBA_LibSoc.7.desc: "\"Пьотре, ти не можеш серйозно!\" - гукала Євґєнія, наздоганяючи Сіуду в коридорах Генеральної Асамблеї; Валєнтєєв ішов слідом.\n\nПьотр швидко рушав до головної зали, завелике пальто мало не злітало. \"Я не роблю це тобі на зло. Рішення визрівало давно, це не примха. Я завжди остерігався Генеральної Асамблеї: ніщо не завадить з'явитися новому Стєпанову\".\n\nВалєнтєєв став перед ним і схопив за плечі. \"Товаришу Сіуда, я не можу дозволити. Розумію вас, але подальша передача влади вниз нікому не полегшить життя. Генеральна Асамблея добра такою, як є\".\n\nПьотр скинув його руки й збирався відповісти, але Євґєнія стала поруч і поклала руки йому на груди. \"Пьотре! Будь ласка, я знаю, ти прагнеш правильного, але подумай про наслідки! Допомагати найуразливішим стане ще важче!\"\n\nПьотр відступив, і руки подруги опустилися. Він насуплено дивився на обох. Генеральна Асамблея була надто могутня, але, може, їхні аргументи мали сенс? Він неспокійно переминався."
 SBA_LibSoc.7.a: "\"Я боротимуся з тиранією, хай де вона з'явиться\"."
 SBA_LibSoc.7.b: "\"Можливо, ви маєте рацію... Та я боюся\"."
 
 SBA_LibSoc.8.t: "Самотній на вітрі"
 SBA_LibSoc.8.desc: "Сєрґєй стукав ногою по гнилій дерев'яній підлозі й кривився, дивлячись у вікно біля каміна. Надворі падав сніг, мов сльози заплаканого Бога. Може, Він плакав через останні двадцять років. Хіба можна винуватити? Бог Сєрґєя був усемогутнім, але й турботливим: хотів, щоб кожне Його дитя не просто вижило, а процвітало. Напевно, ніхто не страждав більше за тих, хто йшов життям пліч-о-пліч із Богом.\n\nТа хоч Бог гнівався чи сумував, Його замерзлі сльози не допомагали. Буря була страшна, будинок могло поховати. Краще не думати. Сєрґєй закрив штори й озирнувся. Інша буря зріла в домі. Дружина колисала молодшого сина, старший крутив радіо, середній сидів поруч. Вони годинами кликали на допомогу, але ніхто не відповідав. Сєрґєй підкинув поліно, аби відволіктися.\n\nСтарший син скинув слухавки. \"Ніхто не слухає! Немає сенсу\". Він пішов у свій куток. Дружина тривожно поглянула на Сєрґєя. Навіть якщо син перебільшував, опинитися в пастці серед глушини з трьома хлопцями було жахливо. І саме тоді радіо ожило."
 SBA_LibSoc.8.a: "\"Сєрґєю? Ви кликали на допомогу? Я неподалік\"."
 
 SBA_LibSoc.10.t: "Заперечую!"
 SBA_LibSoc.10.desc: "Пьотр грюкнув долонями по столу, з чола стікав піт. \"Генерал Стєпанов був замаскованим тираном! Ховав справжні наміри в нашій найдорожчій установі! Мене обдурили. НАС обдурили. Я вважав його другом. Хай що ми думали про генерала, він мав надто багато влади, і ми зрозуміли це запізно. Таке не повинно повторитися\". Пьотр вирівняв на столі докази проти Стєпанова. \"Пропоную цілком знищити Чорну Армію в її теперішній формі\".\n\nЛюди в мовчазній залі перезиралися. Що він каже? Не знаю, відповідали похитуванням голови, але нічого доброго. Сіуда постукував по столу. Зазвичай їх неможливо втихомирити, а тепер, коли треба говорити, усі мовчать?\n\nНарешті юнак підвівся, поправив кашкета й тремтячим голосом спитав: \"Ви ж не закликаєте вбити чоловіків і жінок, які добровільно нас захищали, товаришу Сіуда?\"\n\nПьотр пильно глянув йому в очі. \"Я завжди закликав до смерти держави, товаришу\". Асамблея, як завжди, вибухнула хаосом. Пьотр грюкав по столу, закликаючи до порядку. \"Що ж робити? Дозволити їм накопичувати владу? Чекати, доки захоплять територію?\" Розділена зала зійшлася на одному: Чорна Армія мусить спокутувати провину працею. Пьотр зважив народне рішення й власний страх: скільки ще Стєпанових ховається в армії? Він глибоко вдихнув і оголосив вирок."
 SBA_LibSoc.10.a: "Пьотр виконує волю народу."
 SBA_LibSoc.10.b: "Щоб захистити Росію, треба знищити всі джерела влади!"
 
 SBA_LibSoc.11.t: "Як накажете"
 SBA_LibSoc.11.desc: "Ірінушка ламала руки, прихиливши голову до крижаного сталевого каркаса машини. Про Маґадан вона знала небагато. Ніколи там не бувала - правду кажучи, лише чула про нього мимохідь. Знала, що це портове місто, колишній дім декого з найгірших людей Росії. Вона залюбки поїхала б туди, якби з власної волі. Їй страшенно хотілося побачити океан. Пьотр раз у раз згадував, як хвилі борються з крижаним покривом над ними. Пьотр, дурненький хлопчина з усмішкою до вух, так пишався, проголошуючи це досконалою алегорією анархістської боротьби.\n\nСтєпанов ніколи не бував на Далекому Сході - ба більше, боявся його. Він не раз казав про це Ірінушці, коли вона супроводжувала його з комуни до комуни. До Сибіру він прибув не з власної волі, однак Томск йому вельми сподобався, і він часто мимохідь зауважував, що від самої думки про вторгнення на Далекий Схід його нудить. А от про переворот він не згадував ніколи. Ірінушка повторювала це Асамблеї більше разів, ніж могла злічити. Їм було байдуже. Вони ще й мали нахабство дивитися їй у вічі й казати, що це для її ж добра.\n\nМашина різко зупинилася, й Ірінушка вдарилася головою об сталь. Вона скривилася від болю, але не скрикнула. Відколи забрали Пьотра, вона не промовила ані слова. Якщо така воля народу - нехай. Отже, вона, мабуть, до народу не належала. Двері перед нею відсунулися. Там стояли двоє чоловіків, а за ними - ще багато людей зі зброєю. Вони щось казали про Маґадан, визволення, роботу. Ірінушка лише всміхнулася: за спиною одного з чоловіків вона бачила океан."
 SBA_LibSoc.11.a: "Що дарує більше волі, ніж дика вода?"
 
 SBA_LibSoc.12.t: "Народ вимагає справедливости"
 SBA_LibSoc.12.desc: "\"Можете виголосити останнє слово\", - гаркнув один із членів оперативної групи товариша Сіуди з боротьби проти внутрішніх етатистів. Шура тихо повторив ці слова на одному подиху з чоловіком, що тримав рушницю. Скільки разів він сам їх промовляв? Тримав рушницю? Натискав на гачок? Скільки разів повертався додому після винищення ворогів, змивав із рук кров і пристрасно кохався з дружиною? Якщо таке число взагалі існувало, Шура його не знав. Його роботою було вбивати й удавати, ніби сам він ніколи не опиниться перед цівкою.\n\nВін міг спробувати сказати щось дотепне, може, випробувати одну-дві заготовлені шпильки. Міг сказати щось гнітюче, змусити ката здригнутися - це ж була б перемога, правда? Насправді досвід навчив його: останні слова, хай які змістовні чи промовисті, нічого не важать для кулі, що летить до тебе. Шура мовчав, поки солдат перед ним зводив курок. Той прицілився в голову чоловіка навколішки й вистрілив.\n\nШура зустрів грім пострілу, та щось було не так. Кат, мабуть, утратив рівновагу, коли цілився. Куля акуратно засіла в грудях. Усупереч здоровому глузду й власній волі Шура закричав. Із самої глибини вирвався нутряний крик, досі прихований. Може, то кричали всі, кого він убив, - крик, замкнений у ньому, нарешті вирвався на волю. Без попередження гримнув іще один постріл."
 SBA_LibSoc.12.a: "І крик урвався."
 
 SBA_LibSoc.13.t: "Хвилина перепочинку"
 SBA_LibSoc.13.desc: "\"Я ще не закінчив, Євґєніє\". Пьотр заходився різати оленину. Відпиляв шматок стейка й поклав до рота. Лікті спиралися на стіл, руки стирчали сторчма: в одній виделка, у другій ніж.\n\n\"Я знаю, Пьотре\", - похмуро сказала Євґєнія Таратута, перебираючи гарнір.\n\nЖуючи, він покрутив приборами в повітрі. Проковтнувши, Пьотр заговорив знову: \"Знаєш, Євґєніє, я волію їсти з гостями\". Вона кивнула. \"Я стільки разів запрошував Стєпанова до власного дому. Він сидів саме там, де ти. Їв мою їжу й дивився мені у вічі. Називав себе моїм другом\".\n\nЄвґєнія відклала виделку й благально глянула на друга. \"Пьотре...\"\n\n\"Ні-ні, Євґєніє, дай договорити. Він казав, що знає, як усунути наших ворогів, і ми сиділи тут, складаючи плани\". Пьотр устромив виделку в стіл. \"Він дивився на мене й наказував, що робити, а я робив\". Пьотр схопив тремтячу руку Євґєнії. \"Скажи, що мені робити. Відчуваю, Рада Безпеки переслідуватиме мене ще багато років. Позбутися провини й розпустити її чи працювати всередині неї? Скажи мені, Євґєніє, я не впораюся сам\"."
 SBA_LibSoc.13.a: "\"Роби те, що підказує серце\"."
 
 SBA_LibSoc.14.t: "Збирайте речі й ідіть"
 SBA_LibSoc.14.desc: "Рада Безпеки ніколи не мала існувати довше, ніж триватиме надзвичайний стан, - доки не мине безпосередня загроза загибелі свободи. Та ось вона, загниває роки потому. Навіть після визволення Сибіру її члени трималися за владу й перетворилися на товариство етатистів і контрреволюціонерів. Настав час раз і назавжди її скасувати. Чорна Армія більше не буде на побігеньках у посадовців, яких неможливо притягнути до відповідальности за їхні вчинки. Треба покласти цьому край, перш ніж вони влаштують якийсь \"переворот\" проти Сіуди й занапастять себе. Ніхто не заперечуватиме. Було очевидно: їхній час у центрі уваги минув. Тепер Чорна Армія служитиме нашим товаришам.\n\n\"Члени Асамблеї, вношу пропозицію негайно скасувати Раду Безпеки. Вона виконала своє призначення, а її члени зберігали вірність, та нам більше не потрібна центральна організація, що командує такою могутньою армією\".\n\nАсамблея схвально закивала.\n\n\"Хто за?\"\n\nПіднялася переважна більшість рук.\n\n\"Тоді, гадаю, справу вирішено\"."
 SBA_LibSoc.14.a: "Ось так просто."
 
 SBA_LibSoc.15.t: "Навести мости"
 SBA_LibSoc.15.desc: "Не опускай голови. Вони не знають. Але й не задирай - вони на тебе не полюють, їм нізвідки знати. Чому вони так дивно на нього дивляться? Якщо нічого не знають, чому, проходячи повз, міцніше притискають до себе дітей? О, він знову чухається. Пов'язка завжди свербіла - сила звички. Він хутко засунув руки в кишені, перебираючи папірець в одній і ніж у другій. Глибоко вдихнув: усе гаразд, усе буде гаразд. Саша почав задихатися - нічого не гаразд. Він бачив, як Чорна Армія пронеслася сходом із жорстокістю скривдженого народу: йому співчуття не буде. Люди знову дивилися. Саша зупинився - він мало не проминув контору.\n\n\"Добридень, товаришу. Що вас привело?\" - гукнув генерал із протилежного кінця кімнати. Він стояв до Саші спиною й порпався в картотеці. Саша вколовся лезом у кишені. Він мав наказ. Він завжди виконував накази. Чоловік обернувся. \"Можу чимось допомогти?\"\n\nСаша похитав головою, глибше вганяючи лезо у великий палець. Чорт забирай. Чорт забирай. Чому для цього обрали саме його? Він не знав, як передавати послання! Він навіть не знав, у чому воно полягає. \"В-ви Валєнтєєв?\" Спантеличений чоловік підняв брову й кивнув. Саша витяг із кишені папірець. Убий його. Скажи, що Вождь вічний. Зроби це, Сашо. Роби, що наказано.\n\nГенерал роздратувався. \"Хто ви такий? Що ви тут робите?\" Зроби це, Сашо! Зроби, клятий невдахо!"
 SBA_LibSoc.15.a: "\"Н-нічого, пане Валєнтєєв, заблукав сюди випадково\"."
 
 SBA_LibSoc.16.t: "У МОЇЙ комуні?"
 SBA_LibSoc.16.desc: "Євґєнія всміхнулася й поклала руку Пьотрові на ногу, поки їхню машину кидало на нерівній сибірській місцевості. \"Тобі нема чого хвилюватися, Пьотре, - засміялася вона. - Це ж саме для тебе!\"\n\nПьотр відповів напівусмішкою. За вікном пропливала вся Сибір. Вона була такою величезною: подекуди траплялися населені міста, але навколо стільки порожнечі. Стільки можливостей - так він сказав багато років тому, стоячи в залі Канської Асамблеї. Євґєнія штовхнула його ліктем, вирвавши з роздумів. Пьотр глянув на неї й усміхнувся ширше. \"Ти мені лестиш, Євґєніє! Ти могла б навчити цих людей не гірше за мене\".\n\n\"Авжеж, - вона поплескала його по нозі. - Але їм потрібна не я, Пьотре, а ти\". Від цих слів у Пьотра скрутило живіт.\n\nКоли Пьотр зійшов із вантажівки посеред Іскітімської комуни, його не зустрічала звична юрба. Люди не кинулися до нього, не скандували ім'я й не співали йому хвалу. Ні, комуна жила як завжди, і лише дехто впізнав товариша Сіуду. Пьотр відчув, як на обличчі з'являється усмішка: так рідко випадає побачити анархію в дії. Побачити, як люди живуть, як хочуть, без обмежень і наказів центральної влади. Євґєнія мусила все зіпсувати. Вона скликала людей і попросила уваги. Навколо Пьотра почав збиратися невеликий натовп - здебільшого просто цікаві до метушні. Пьотр прикусив губу, аби втримати усмішку: обов'язок кличе. Це лише перша з багатьох комун, які він відвідає. Попереду, безперечно, довгий місяць, але якщо на кожній зупинці він бачитиме анархію в дії, як тут, воно того варте."
 SBA_LibSoc.16.a: "\"Товариші, що ви знаєте про анархізм?\""
 
 SBA_LibSoc.17.t: "У тіні долини"
 SBA_LibSoc.17.desc: "Пьотрові здавалося, що чвари в Міністерстві економіки - найдріб'язковіші й найдурніші речі, які він бачив за свій, щоправда, обмежений досвід управління. Перебираючи листи, він сміявся з найгірших.\n\n\"Мушу сказати, Вадіку, твій сумнів щодо економічного процвітання Куржіно просто огидний\".\n\n\"Станіславе, я доповім про тебе в божевільню, якщо ти справді віриш, що це кровозмісне сільце здатне на щось більше, ніж голодувати навіть у врожайний рік\".\n\nМіністерство економіки наче зациклилося на сварках про те, яке саме російське місто чи містечко отримає кошти, хоча відповідь видавалася Пьотрові очевидною. Чому не розподілити їх рівномірно, зокрема між малими містами? Якщо зосередити обмежені кошти у великих містах, уже скорочений розрив між селом і містом лише зросте, тоді як меншим містечкам ця допомога могла б дати вкрай потрібний поштовх. Менш густонаселені комуни могли стрімко зрости навіть від невеликого вливання. Великим містам не потрібно ще більше грошей у їхні бюрократичні чорні діри."
 SBA_LibSoc.17.a: "Як же мене заїбало це лайно."
 
 SBA_LibSoc.18.t: "Обидві сторони історії"
 SBA_LibSoc.18.desc: "Правила були прості: не переходити на особистості, поважати думки одне одного й поводитися цивілізовано. Звісно, простота цих правил залишала простір для непорозумінь, коли анархісти й люди найрізноманітніших політичних поглядів заполонили оперну залу Новосибірської комуни заради вечора доброзичливих дебатів. Сіуда сидів позаду, спостерігав за перебігом суперечки й сумлінно занотовував влучні тези обох сторін.\n\n\"Пане, я розумію нацистський світогляд, справді розумію. Але не розумію, як ви можете підтримувати вчинки цих людей після того, як вони стількох убили й залишили за собою стільки невинних жертв?\"\n\nФашист самовдоволено всміхнувся й відповів: \"Ви вбивали б заради свободи? Заради анархії, як ви її називаєте?\"\n\n\"Так\".\n\n\"І я вбивав би за свою свободу, за національне визволення. Дехто загине, та якщо ціною буде расово чиста утопія, воно того варте\".\n\n\"Кожна смерть? Кожна дитина?\"\n\n\"Кожна дитина\".\n\n\"А чи замислювалися ви, пане, що раса - лише суспільний конструкт? Що націоналізм - лише брехня, вигадана вашими предками?\"\n\n\"А, бачу, у вас жидівський спосіб мислення. Лише дурень заперечуватиме, що одні нації вищі за інші. Зрештою, хіба африканці вже мають Фольксгалле?\"\n\nАнархіст фиркнув. Дебати тривали."
 SBA_LibSoc.18.a: "Жиди, кажу вам!"
 
 SBA_LibSoc.19.t: "Завіса!"
 SBA_LibSoc.19.desc: "\"Гадаю, пане Сіуда, ви побачите, що це якнайдалі від істини\". Чоловік у костюмі нахилився до сусіднього столу, на якому непевно височіли стоси паперу. Він дістав одну зі своїх численних діаграм і поставив на трибуні перед собою. Провів пальцем уздовж спадної лінії. \"Погляньте сюди: загальна тенденція свідчить, що наші військово-промислові спроможності неухильно падають, відколи ми відкинули капіталізм. Нерозумно з ідеологічних міркувань відмовлятися від системи, яка перетворила Америку зі скромної колонії на провідну наддержаву\".\n\nПереповнена зала Асамблеї почала обсипати промовця образами; люди підводилися з місць, аби освистати гаданого опонента. Пьотр Сіуда хутко занотував щось у записнику й тричі підкреслив. Ударивши долонею по трибуні, він закликав залу до порядку. \"Ну ж бо, товариші, принижуючи людей, ви нікого не переконаєте\". Пьотр сперся на трибуну й повернувся до чоловіка праворуч. \"Товаришу, ви слушно критикуєте мій аргумент, я це визнаю. Однак я об'їздив нашу територію вздовж і впоперек та бачив наслідки капіталізму. Скажу вам одне: капіталізм працює на тих, хто його створив, а не на тих, хто живе під ним\".\n\nУ Пьотрового співрозмовника була відповідь, а в революціонера - своя. Вони могли б сперечатися цілу вічність, і Пьотр насолоджувався б кожною миттю."
 SBA_LibSoc.19.a: "Завіса над капіталізмом."
 
 SBA_LibSoc.20.t: "Прикре усвідомлення"
 SBA_LibSoc.20.desc: "\"Ви психопат! Кретин! В-ви цілковитий довбаний ідіот!\" Валєнтєєв силкувався дібрати слова, щоб описати Андронія Мішурєнка, і з розпачу гатив кулаком по столу товариша Сіуди. \"Пьотре, ти мусиш побачити це таким, яким воно є! Це самогубство!\"\n\nПьотр Сіуда відчував, що може довіряти товаришеві Валєнтєєву: той завжди діяв у найкращих інтересах народу. Звісно, те саме він колись думав про Івана Стєпанова. \"Товаришу! Ми з вами обоє боролися за право товариша Мішурєнка виступати й подавати свої плани на розгляд Асамблеї\".\n\nВалєнтєєв відкинув волосся назад і недовірливо відхилився на стільці. Мішурєнко сидів рівно, зігнувши губи в усмішці. \"Дякую, товаришу Сіуда. Я ціную вашу здатність помічати справжній талант\". Мішурєнко посунувся на стільці й нахилився до Пьотра. \"Служба навчила мене: інтелектуали чудово вміють сидіти у вежах зі слонової кістки й кричати нам накази згори. Про справжню війну вони нічого не знають. Ядерна зброя - така сама зброя, як рушниця чи пістолет. Ми не просимо науковців складати нашу артилерію - ми просимо народ\".\n\n\"Пьотре, не все є народною боротьбою! - благав Валєнтєєв. - Заради народу, благаю тебе, залиш це фахівцям!\""
 SBA_LibSoc.20.a: "\"Науковці - теж наші товариші\"."
 SBA_LibSoc.20.b: "\"Не все може бути народною боротьбою, але це - може\"."
 
 SBA_LibSoc.21.t: "Шукаючи всюди"
 SBA_LibSoc.21.desc: "Міша притиснув руку до чола, намагаючись - безуспішно - захиститися від негоди. Чорт забирай, як же він ненавидів Томск. Ну, його думка про місто була дещо складнішою, але все одно воно йому не дуже подобалося. Міша здригнувся - чи то від холоду, чи то від огиди. Відколи це його погляди стали такими неоднозначними? Мабуть, кілька років роботи з Генеральною Асамблеєю таке роблять із людиною.\n\nНарешті вдалині виразно проступила хата. Міша здолав іще кілька метрів і ступив на дерев'яний ґанок. Будь чемним, подумав він, цей чоловік нічого тобі не зробив. Міша постукав у двері - не надто тихо й не надто гучно. Притулив вухо до дверей, прислухаючись, чи хтось іде. Ані звуку. От лайно, знову помилився. Виходить, він дарма волочився аж на околицю Томска. Міша вже хотів піти, але тут помітив: фіранка на одному з вікон хутко засмикнулася. Він постукав знову. \"Гей! Я знаю, що ви там! Я вас бачу!\" Жодної відповіді. Міша зітхнув: він не заради гри в хованки сюди перся. Повернув ручку й увійшов.\n\nУсередині все скидалося на наслідки вибуху атомної бомби. Підлогою розкидані папери, з книжок вирвані сторінки, на великих дошках - незрозумілі карлючки. Міша обережно переступав через безлад. \"Я з відомства товаришки Таратути. Маю лише кілька запитань... ГЕЙ!\" У дальньому кінці кімнати він побачив чоловіка в костюмі, який уже наполовину виліз у вікно.\n\nТой відчайдушно намагався протиснутися назовні, але портфель зачепився за підвіконня. Міша кинувся вперед, схопив чоловіка й затягнув назад."
 SBA_LibSoc.21.a: "\"То ви й є Андрєй Сахаров?\""
 
 SBA_LibSoc.22.t: "Демократія, на жаль"
 SBA_LibSoc.22.desc: "Сіуда не заперечував проти фінансування науковців. Зрештою, вони будували ядерну бомбу - на це вочевидь потрібно чимало ресурсів, - а Сіуда твердо вірив у високі ідеали науки. Генеральна Асамблея - не надто. Більшість представників здобули у своїх комунах базову освіту з управління й представництва, проте не зналися на ядерній фізиці та точній кількості ресурсів, необхідних для створення ядерної бомби. Тож коли їм показали повний перелік потрібних коштів і матеріалів, кілька представників почали глузувати й вимагати, щоб несміливий науковець зійшов зі сцени.\n\nУрешті-решт голосування все одно мало відбутися. Висунули дві пропозиції: надати науковцям усі потрібні ресурси й сподіватися, що бомба вийде кращою та буде готова швидше, або виділити лише частину коштів і матеріалів. Бомбу, найімовірніше, створять і в другому разі, але дослідники, певна річ, невдоволені тим, що їм не дають цілковитої свободи в справі, пріоритетній для Сибіру."
 SBA_LibSoc.22.a: "Може, ця бомба взагалі не спрацює."
 SBA_LibSoc.22.b: "Дайте науковцям те, що вони просять!"
 
 SBA_LibSoc.23.t: "Що скажеш, простий чоловіче?"
 SBA_LibSoc.23.desc: "Генеральна Асамблея, як завжди, галасувала. Коли Сіуда скликав засідання, кожен член конгресу охоче вирушив до Новосибірска. Якщо вони були зайняті - хоча мало хто був настільки зайнятий, щоб пропустити Асамблею, - то надсилали замість себе заступників. У залі конгресу відчувалася напруга, що, здавалося, охоплювала кожного чоловіка й кожну жінку: вони були частиною чогось справжнього. Хай це була лише якась Асамблея в Сибіру, їхня праця, їхнє життя служили добробуту всіх людей.\n\nЗбуджений гомін у залі стих до шепоту, коли Пьотр вийшов на сцену. Він підтягнув старий мікрофон ближче до губ, випростався й заговорив до сотень присутніх. Пьотр ніколи не був промовцем - голос звучав невпевнено, ритм був уривчастим, - але всі, хто скупчився в залі, його розуміли, а це було головне.\n\n\"Минулої ночі я лежав у спальні без сну й міркував: як анархія виживає? Виживає по-справжньому? Не одним лише духом. Якби це було так, що сталося б із незліченними пригнобленими, які прагнуть духу анархії? А з теоретиками й філософами, які присвятили ідеалу книжку за книжкою? Очевидно, за анархію люди мусять помирати. За свободу. Хай то етатисти й фашисти чи самі анархісти - схоже, для тривкої анархії ми мусимо вбивати провідників держави. І поки я обмірковував цей прикрий висновок, то зрозумів: анархія народжується не з лона смерти, а зі страху смерти. Коли етатисти боятимуться катастрофи, вони дадуть нам спокій. Коли етатисти боятимуться остаточного знищення - ядерного пекла, - вони залишать нам свободу. Тож саме найвища зброя приведе нас до найвищого ідеалу, люди\"."
 SBA_LibSoc.23.a: "Ми мусимо створити ядерну бомбу."
 
 SBA_LibSoc.24.t: "Навіть я?"
 SBA_LibSoc.24.desc: "У цій вивісці було щось смішне: «Нехай твій голос пролунає крізь атом!» Пьотр нарешті з'їхав із глузду - а може, давно пірнув у безодню й тільки тепер затягнув туди решту. Та Пьотр грав чесно, тож надто кепкувати з нього не випадало: він таки витяг себе з дому на ці збори - чи то з цікавости, чи то заради розваги.\n\nПьотр сів ближче до задньої стіни тісно набитої кімнати. Витяг із кишені куртки стару цигарку й недбало затиснув її в роті, обмацуючи себе в пошуках запальнички. На сцену піднялася літня жінка за допомогою якогось цабе з Чорної Армії. Вона дошкандибала до мікрофона. \"Перевірка. Перевірка. Нас чути?\" Люди скривилися від свисту. \"Чудово! - бадьоро сказала вона. - Хочу подякувати всім, хто прийшов сьогодні ввечері: цей проєкт має найвищу важливість. Утім, багато часу не заберу - знаю, насувається буря. Отже, якщо хтось хоче поча...\"\n\n\"Так, я хочу дещо сказати\". Пьотр усміхнувся, дивлячись на чоловіка, що підвівся. Оце буде цікаво. \"Чи замислювалися ми, наскільки глибоко у війні вкорінені привілеї? Створення атомної зброї - найвища форма класової нерівности!\" Пьотр не стримав істеричного реготу й накликав на себе гнівні погляди присутніх.\n\n\"Вас щось розсмішило в словах товариша?\" - гукнула зі сцени літня жінка.\n\n\"Ні-ні, просто... - Пьотр усе ще сміявся. - Він сказав, що ядерна війна класистська! Я не менший анархіст за будь-кого тут, але ж це просто сміховинно!\"\n\n\"Сміховинно те, що ви витягли себе з дому в такому вигляді й досі маєте нахабство ображати товаришів\", - відрубала жінка зі сцени. Пьотр перестав сміятися й зіщулився у кріслі."
 SBA_LibSoc.24.a: "\"То що ви казали, товаришу?\""
 
 SBA_LibSoc.25.t: "На мою думку"
 SBA_LibSoc.25.desc: "«Я щиро переконаний, що боротьба за свободу нарешті сягнула кульмінації. Анархізм як ідеологія - це боротьба, нескінченна битва проти ієрархії. Саме коли люди почуваються в безпеці, вони мусять бути найпильнішими».\n\nНі, це не те. Пьотр закреслив написане.\n\n«Анархістська боротьба є боротьбою за єдність. Згуртований народ зрештою переможе державу, коли коли коли коли...» Пьотр захлопнув книжку. Він ненавидів не мати відповідей. Збагне пізніше, треба лише...\n\nУ двері постукали. \"Пьотре? Я хотіла спитати, чи маєш кілька хвилин?\"\n\nПьотр важко зітхнув. \"Так, заходь. Що я можу для тебе зробити?\"\n\n\"Я... я... Ти ж знаєш, що я завжди кажу, що думаю. Гадаю, тобі слід серйозно це переосмислити\".\n\n\"Мені страшно, Євґєніє. Ти це хотіла почути? Я не знаю, що маю робити, тому дозволяю народові вирішувати\"."
 SBA_LibSoc.25.a: "Ніхто не казав, що анархія буде легкою."
 
 SBA_LibSoc.26.t: "Не шукай долі в темній похмурій шахті"
 SBA_LibSoc.26.desc: "\"Бережіть голову\". Провідник повів Пьотра Сіуду глибше в шахту Вєрхнєудінска. \"Гадаю, ранкова зміна ще працює, хоча скоро підуть обідати\".\n\n\"Якщо можна, я хотів би побачити їх за роботою. Щоб цей проєкт мав успіх, мені треба знати всі тонкощі мислення шахтарів і їхнього повсякденного життя\".\n\nБригадир замислено похитав головою. \"Думаю, це можна влаштувати. Вони, напевно, навіть не помітять, як ви ввійдете! Тут ми виконуємо чи не найтяжчу роботу в усій Росії!\" Він засміявся. \"Так, погляньмо... А! Ось Дімітрій! Найкраще спитати в нього, він один із освіченіших у цій компанії. ДІМІТРІЮ! НЕГАЙНО ТЯГНИ СЮДИ СВОЮ ДУПУ!\"\n\nЧоловік відклав кайло, зняв каску й почав нею обмахуватися. \"Я можу чимось допомогти?\"\n\n\"Дімітрію, це товариш Сіуда, ви його знаєте. Він шукає відомості про один проєкт. Пьотре?\"\n\n\"Приємно познайомитися, товаришу Міхаїле\". Вони потисли руки. \"Мені потрібна ваша допомога, Вільній Території потрібна ваша допомога. Що ви вважаєте найважливішим у видобутку урану?\""
 SBA_LibSoc.26.a: "\"Обов'язково носіть одяг зі свинцевою підкладкою!\""
 SBA_LibSoc.26.b: "\"Уран? Краще беріть плутоній!\""
 
 SBA_LibSoc.27.t: "Наука на вершині світу"
 SBA_LibSoc.27.desc: "Увійшовши до будинку, Пьотр затупав по килимку, збиваючи сніг із чобіт. Це мало допомогло: норільський сніг мало не поглинув його цілком. Штанини замерзли й затверділи, тож ходити було доволі незручно. Він перевальцем підійшов до великого крісла-гойдалки біля каміна й сів. \"Ви вже розпалили вогонь!\" - гукнув Пьотр до літнього чоловіка, який запросив його й тепер пішов по чайник.\n\n\"Я здогадався, що ви захочете зігрітися: більшість людей до такого холоду не готові, - сказав він, наливаючи воду в чайник. - Та й з огляду на тему нашої розмови хочу впевнитися, що ваш мозок працює на повну. Не знаю, чи вам відомо, але холод погіршує здатність ухвалювати розумні рішення\".\n\n\"Справді? - спитав Пьотр, знімаючи рукавиці. - Ні, не знав. Де ви про це дізналися?\"\n\n\"Я навчався в Академії наук, доки світ не полетів шкереберть\". Він засміявся й почухав щетину. \"Один мій університетський товариш... як же його звали? Ніяк не згадаю. Він вивчав сільське господарство, це було його захоплення, й одного разу про це згадав. Та не про це я хотів сказати. Я мушу попередити: під час створення цю ядерну зброю треба тримати в цілковитій таємниці. Будь-який витік відомостей може мати жахливі наслідки\"."
 SBA_LibSoc.27.a: "\"Це народний проєкт, я не можу приховувати його від людей\"."
 SBA_LibSoc.27.b: "\"Авжеж, хтозна, які диверсії задумали етатисти\"."
 
 SBA_LibSoc.28.t: "Усі на борт!"
 SBA_LibSoc.28.desc: "Пьотр поклав портфель на коліна й визирнув у вікно потяга. Подорож із Новосибірска до Красноярска була одним із найпопулярніших маршрутів Транссибірської магістралі. Часом родини сідали в потяг просто задля розваги - відсвяткувати весілля чи день народження. Він їх не винуватив. Люди створили Сибіру погану славу безплідної пустки, але тут ховалося стільки скарбів. Пьотр дістав із портфеля ручку й папір і почав замальовувати вагон. Художником він був кепським, але поступово вправлявся.\n\n\"Запропонувати вам напої, товаришу?\" - бадьоро спитала стюардеса позаду. Пьотр здригнувся, випустив ручку й ледь упіймав між ніг записник. \"Ой, вибачте! - засміялася жінка. - Я не хотіла вас налякати!\"\n\nПьотр теж оцінив кумедність миті. \"Не хвилюйтеся, папір, на щастя, не розбивається, як скло\". Він глянув на шатенку з такими самими карими очима. \"Звідки ви?\"\n\nВона заправила волосся за вухо. \"Із Красноярска, мій батько тримає крамницю на ринку\".\n\n\"Що ви можете розповісти про перевезення товарів цими потягами?\""
 SBA_LibSoc.28.a: "\"Оминайте Кемеровський вузол, він геть непридатний!\""
 SBA_LibSoc.28.b: "\"Зробіть два й повезіть різними потягами\"."
 
 SBA_LibSoc.29.t: "Безпека понад усе"
 SBA_LibSoc.29.desc: "\"ТОВАРИШІ! МОЛОДІ Й СТАРІ! СТАНЬТЕ НА ЗАХИСТ НАШИХ НАЙСУМЛІННІШИХ ТРУДІВНИКІВ!\" - кричав у рупор чоловік біля міської управи Якутска, стоячи на ящику з рибою, привезеною на захід із Маґадану.\n\nМішурєнко закотив очі, проходячи повз протестувальників разом із Пьотром Сіудою. \"А, байдуже, - виплюнув він. - Учасники проєкту не лише зголосилися добровільно, а й уже мають чи не найкращі вигоди, які ми можемо запропонувати! Цим людям завжди буде мало. Ми визволяємо їх від окупації, даруємо свободу й самоврядування, а що роблять вони? Скаржаться\". Мішурєнко похитав головою. \"Пробачте, що вам доводиться це бачити, товаришу Сіуда. Ми приїхали не заради цього\".\n\nПьотр дивився на натовп, крокуючи повз. Зиркнув на годинник: він мав зустрітися з кількома незламними прибічниками попереднього режиму, які погодилися на перемовини після запеклої облоги. \"Та годі вам, вони просто користуються правом на протест!\"\n\n\"Авжеж, але хотілося б, щоб вони скористалися й правом помовчати, - фиркнув Мішурєнко. - Ось машина, товаришу Сіуда, сідайте\".\n\nПьотр досі дивився на протест. Може, вони мали рацію? Може, ще залишилася робота? Ні, напевно, ні. Та навіть якщо був найменший шанс, що це так, хіба не варто перевірити?"
 SBA_LibSoc.29.a: "\"Я наздожену вас, мені треба лишитися тут\"."
 SBA_LibSoc.29.b: "\"Так... їдьмо\"."
 
 SBA_LibSoc.30.t: "Світло Господнє"
 SBA_LibSoc.30.desc: "Що може бути спокійнішим за прогулянку вечірнім ринком? Пьотр Сіуда не бажав би нічого іншого. Він опинився в Ґорно-Алтайску заради зустрічі з комуною щодо мирного переходу від попередньої адміністрації. Люди видалися Пьотрові доволі приємними, хоч і дещо консервативними на його смак. Та зараз його смаки були зайняті іншим: він відкусив в'яленої оленини. Рот наповнив смак добре приправленої та чудово приготованої закуски. Він розслабився на лавці, заплющив очі й просто насолоджувався довкіллям.\n\nА тоді почалися крики.\n\n\"Не випробовуйте Його могутности!\"\n\n\"Він стежить! Чиніть праведно!\"\n\n\"Лише Бог може судити!\"\n\nПьотр розплющив очі й побачив чоловіків у мантіях. Вони тримали плакати із зображенням ядерних вибухів у великому перекресленому колі. Пьотр утомлено потер очі."
 SBA_LibSoc.30.a: "Нехай Бог засуне це туди, куди сонце не заглядає."
 SBA_LibSoc.30.b: "Знайти віру ніколи не пізно."
 
 SBA_LibSoc.31.t: "Профспілкові хлопці виграють битви"
 SBA_LibSoc.31.desc: "\"Мушу сказати, товаришу, я неабияк вражений. Ваші здобутки перевершують навіть деяких найбільш промислово розвинених ваших сучасників\", - сказав Пьотр, оглядаючи фабрику, переповнену чоловіками, які гатили молотами по листах металу.\n\n\"Та годі вам, товаришу Сіуда, - відповів очільник найбільшої профспілки комуни. - Ми тут люди скромні, справді\".\n\n\"Ні\". Пьотр раптом зупинився, осяяний думкою. \"Це може випередити наші початкові строки ядерного проєкту на кілька років! Ви мусите спрямувати всю свою волю на його розвиток!\"\n\nПрофспілковий очільник замислено похитав головою. \"Що ж... Гадаю, я міг би спробувати їх переконати, але вони не надто прагнуть виробляти тут військову зброю. Якщо я їх умовлю, вони висунуть умови. Захочуть обмежити потужність зброї та отримати обіцянку, що її ніколи не застосують. Вона має бути лише для показу\"."
 SBA_LibSoc.31.a: "\"Гадаю, це можна влаштувати\"."
 SBA_LibSoc.31.b: "\"Не вийде\"."
 
 SBA_LibSoc.32.t: "Відчайдушні часи..."
 SBA_LibSoc.32.desc: "\"Народний трибунал визнав їх винними за всіма пунктами: експлуатація, вбивство, крадіжка - увесь набір. Але не стратив. Гадаю, для вас це цілком звична річ, - засміявся чоловік. - Ви постійно бачите хлопців і гірших за наших. Ви знали, що на сході були справжні фашисти? Божевілля!\" Він відчепив від паска кільце з ключами й почав шукати потрібний. \"Так чи інакше, ці двоє мало не зі шкіри пнулися заради нагоди „спокутувати провину в очах народу“\", - він зобразив лапки пальцями. \"Як на мене, це відчайдушна маячня, але що я знаю?\"\n\nПьотр увійшов до тюремної камери. Двоє чоловіків сиділи за дерев'яним столом і грали в шахи. \"Державне поріддя\", - холодно сказав Пьотр.\n\nОбидва миттю підскочили, штовхнувши стіл і зіпсувавши цілком добру шахову партію. \"Товаришу Сіуда! Слава Богу, ви прийшли! Нам страшенно прикро! Ми з помічником роками вели записи в цій камері! Гнили тут!\"\n\n\"Так вам і треба\", - відповів Пьотр, схрестивши руки.\n\n\"Я розумію ваші переконання, і час ув'язнення теж указав нам шлях! На знак доброї волі пропоную всі наші записи з колишньої роботи в державному університеті, а також незліченні нотатки й теорії, які ми створили відтоді!\" Чоловік сунув записник Пьотрові до рук. \"Будь ласка, візьміть це й відпустіть нас!\""
 SBA_LibSoc.32.a: "\"Можете лишити книжку собі. Це народна справа\"."
 SBA_LibSoc.32.b: "\"Забирайтеся звідси... й нікому не кажіть\"."
 
 SBA_LibSoc.33.t: "Ще на день старший і ще глибше в боргах"
 SBA_LibSoc.33.desc: "\"Розумієте, - слова шахтаря приглушувала набита їжею паща, - я знаю чоловіка, який знав чоловіка, що був там, коли вони випарували той американський острів\". Він відпив із великої склянки газованого напою. \"Цілковитий псих\". Робітник відригнув. \"Так ось, той знайомий подався назад на захід. Я вже кілька років про нього не чув, але він був страшенно схиблений на ядерній зброї та всьому, що з нею пов'язано. Залишив мені список матеріалів і навіть розпланував кар'єр\".\n\nПьотр гидливо скривився. Якби проєкт не мав найвищої важливости, він напевно волів би бути будь-де в Росії, тільки не тут. \"Дякую, що поділилися цими відомостями, товаришу. Ви сприяєте дуже шляхетній справі\".\n\nШахтар відкинувся на стільці. \"Гей-гей-гей, я наче не казав, що просто все віддам! Мені теж має щось перепасти, еге ж?\"\n\nПьотр насупився. \"Жадібність вам не личить, товаришу. Наполегливо раджу припинити цей балаган\".\n\n\"Та годі тобі, Пьотре!\" Обличчя Пьотра лишилося незворушним. \"Гаразд! Насери в одну руку, поклади свою ідеологію в другу й подивися, яка наповниться швидше\". Чоловік зірвався зі стільця."
 SBA_LibSoc.33.a: "\"З-зачекайте! Просто... нумо все обговоримо\"."
 SBA_LibSoc.33.b: "\"Ідіть! І заодно подумайте про купання!\""
 
 SBA_LibSoc.34.t: "Питання не «чому?», а «чому б ні?»"
 SBA_LibSoc.34.desc: "Попри весь час, витрачений на розмови з людьми, на палкі промови про рух, який він вивів із минулого на передній край світової політики, іноді Пьотр волів просто слухати. Зрештою, саме слухаючи, він уперше дізнався про анархію. У світлих умів щойно створеного Томського центру збагачення можна було багато чого навчитися.\n\n\"Вітаю науковців, героїв війни й дипломатів! Я - К. Іванов! Ні, К означає не „товариш“, а...\"\n\n\"Презентація, товаришу Іванов?\" - сказала шатенка ліворуч від нього.\n\n\"Пробачте, товариші, це моя чарівна помічниця Кароліна. Вона тут мозок операції, хай не переконує вас у протилежному\". Іванов засміявся й поклав руку помічниці на плече. \"У дитинстві мені часто казали: „Ти марнуєш час“, „Ти ніколи не досягнеш успіху“. Сьогодні ми доведемо, що вони помилялися! Сьогодні змусимо їх проковтнути власні слова! Нас осяяло! Я не хочу цих клятих слів, я хочу дії! І моя дія - підірвати ваш клятий будинок!\" - заревів Іванов.\n\nПьотр приголомшено й мовчки дивився із зали. Цей чоловік що, геть збожеволів? Його самолюбство, певно, вже збирало камінці на Місяці - настільки воно було не від світу цього. А з іншого боку, може, проєктові саме це й потрібно - справжня пристрасть? Пьотр відкрив рота й сказав..."
 SBA_LibSoc.34.a: "\"Кароліно, приборкайте свого начальника!\""
 SBA_LibSoc.34.b: "\"До величі, товаришу Іванов!\""
 
 SBA_LibSoc.35.t: "Скрізь зелене світло"
 SBA_LibSoc.35.desc: "Пьотр сидів дуже-дуже далеко від полігона. На галявині посеред лісу втілилися місяці тяжкої праці й найкращі таланти, які могла запропонувати Росія. Товариш Сіуда тримав тремтячою рукою бінокль. На шляху Сибірської Чорної Армії від нікчемної банди головорізів до справжньої спільноти й могутньої сили регіону було багато \"великих кроків\". Перша угода між ним і Стєпановим, війни проти дрібних держав Центрального Сибіру, боротьба з етатистами сходу - будь-яка з цих митей могла розвалити весь рух. Це, мабуть, була ще одна така переломна мить.\n\n\"Товаришу Сіуда? Це Мішурєнко\", - розібрав Пьотр крізь тріск рації. \"Зброя готова. Сподіваюся, ви на належній відстані. Також раджу прикрити очі: навіть звідти вас неодмінно засліпить\".\n\nПьотр затремтів, підносячи рацію до рота. \"Зрозумів\", - сказав він, не дозволяючи страху прозвучати в голосі.\n\n\"Вітаю, хлопці й дівчата, сьогодні російський народ підвівся. Три...\" Пьотр сховався за цегляною стіною, на якій сидів. \"Два...\" Він приготувався почути розщеплення атома. \"Один...\" Напружився всім тілом, молячись, щоб товариші справді відвели його на безпечну відстань. \"Підрив\".\n\nПьотр притиснувся до стіни, готовий відчути хвилю неймовірної спеки. Не було ні грому, ні гуркоту, ні звуку атома, підкореного людиною. Лише тиша. Обережно Пьотр підвівся й визирнув з-за стіни, але не побачив... геть нічого. Ні хмари, ні дерев, що розлітаються вдалині від сили вибуху, - нічого. Він схопив рацію. \"Товаришу Мішурєнко... що, в біса, сталося?\""
 SBA_LibSoc.35.a: "\"Що ж... схоже, нічого. Повертаємося до креслень\"."
 
 SBA_LibSoc.36.t: "Під перехресним вогнем"
 SBA_LibSoc.36.desc: "Король Рюрік. Ось його ім'я. Він не Ніколай Івановіч Крилов. Не товариш Крилов. І не в'язень! Та він був тут. Сидів. Лежав. Стояв. Справляв нужду. Малював. І все - у тих самих чотирьох кутах. Це були тортури. Росія могла запропонувати стільки всього, стільки дивовижних місць! Ліси, тайга, пустелі! Безліч міст, сіл і портів! Він пам'ятав часи, коли Союз простягався від моря до моря! Ото були дні... коли він міг бачити. Бачити щось більше за чотири кам'яні стіни й мертве місто Юрґа.\n\n\"Ось, старий. Вечерю подано\", - сказав охоронець, ставлячи тарілку, звісно ж, недосмаженої риби й трохи нарізаної капусти. \"Вечеря, гідна короля, еге ж?\"\n\n\"Ви плануєте щовечора повторювати ті самі нападки на мою особу?\"\n\n\"Сподіваєтеся, я повірю у вашу виставу, ваша величносте?\" - фиркнув охоронець і пішов. Рюрікові майже хотілося його зупинити. Це був єдиний зв'язок із зовнішнім світом. Він навіть не знав імени цього чоловіка.\n\nРюрік покірно сів за грубо збитий і вже прогнилий стіл біля вікна. Потицяв рибу виделкою. Часом йому подобалося рухати її ротом за допомогою прибора. Змушувати її говорити, розповідати про пишноту королівського двору. Іноді він навіть залишав рибин і давав їм імена, але ненадовго. Після Лідії Сьомої та Восьмої сморід ставав нестерпним. Рюрік схилив голову в молитві. Заплющив очі, та все одно бачив світло. Ще раз розплющив і заплющив - світло не зникло. Тоді він підвів погляд і побачив грибоподібну хмару, що здіймалася над містом Юрґа. Рюрік опустився на коліно, схиляючись перед вибухом."
 SBA_LibSoc.36.a: "Нарешті свобода."
 SBA_whoops_i_nuked_yurga: "§eНад Юрґою здіймається грибоподібна хмара.§!"
 
 SBA_LibSoc.37.t: "Перемога всієї Росії!"
 SBA_LibSoc.37.desc: "Пьотр сидів дуже-дуже далеко від полігона. На галявині посеред лісу втілилися місяці тяжкої праці й найкращі таланти, які могла запропонувати Росія. Товариш Сіуда тримав тремтячою рукою бінокль. На шляху Сибірської Чорної Армії від нікчемної банди головорізів до справжньої спільноти й могутньої сили регіону було багато \"великих кроків\". Перша угода між ним і Стєпановим, війни проти дрібних держав Центрального Сибіру, боротьба з етатистами сходу - будь-яка з цих митей могла розвалити весь рух. Це, мабуть, була ще одна така переломна мить.\n\n\"Товаришу Сіуда? Це Мішурєнко\", - розібрав Пьотр крізь тріск рації. \"Зброя готова. Сподіваюся, ви на належній відстані. Також раджу прикрити очі: навіть звідти вас неодмінно засліпить\".\n\nПьотр затремтів, підносячи рацію до рота. \"Зрозумів\", - сказав він, не дозволяючи страху прозвучати в голосі.\n\n\"Вітаю, хлопці й дівчата, сьогодні російський народ підвівся. Три...\" Пьотр сховався за цегляною стіною, на якій сидів. \"Два...\" Він приготувався почути розщеплення атома. \"Один...\" Напружився всім тілом, молячись, щоб товариші справді відвели його на безпечну відстань. \"Підрив\".\n\nПьотр притиснувся до стіни, готовий відчути хвилю неймовірної спеки. Не було очікуваного грому чи навіть гуркоту. Радше ляск - наче луснула повітряна кулька. Пьотр розгубився, хоча, зрештою, він ніколи раніше не чув вибуху ядерної бомби. Обережно й усупереч здоровому глузду він визирнув з-за стіни й побачив ліс - точніше те, що від нього лишилося. Грибоподібної хмари, про яку його попереджали, не було, зате кратер був напевне. Пьотр із полегшенням глибоко видихнув. Спрацювало, хоч вибух був набагато, набагато слабшим за його уявлення. Він схопив рацію. \"Товаришу Мішурєнко, вітаю з успішною роботою\"."
 SBA_LibSoc.37.a: "\"Радий догодити, товаришу Сіуда\"."

 SBA_LibSoc.38.t: "Що криється в назві?"
 SBA_LibSoc.38.desc: "«Хліб здобуто».\n\nПьотр Сіуда закреслив назву. Із юности він відчував глибокий потяг до письменства. Звідки це взялося? Він не міг відповісти. Те, як його ручка танцювала папером, підказувало, що він обдарований, що писати - його покликання. Пьотр любив думати: якби не став революціонером, то був би письменником, а може, поетом - він не знав напевне. Та чи можна відокремити ідеологію від поезії? Хіба кожен вірш, кожна історія не відкриває автора? Не є вікном, крізь яке інші можуть зазирнути всередину, але ніколи не отримати відповіді?\n\n«Свободу знайдено: історія російського революційного руху».\n\nПьотр закреслив іще одну назву. У цьому й полягала його проблема. Думки кружляли в голові, але він не міг їх упорядкувати, надати собі сенсу. Як він пояснить себе іншим, якщо сам себе не розуміє?\n\n«Товариськість».\n\nКоротко й просто. Назва видалася доречною. Пьотр пригадав найвпливовіші праці минулого століття - книжки, що поставили світ навколішки. \"Майн Кампф\", \"Імперіум\", \"Маніфест комуністичної партії\". Його книжка буде не такою. Ні, писання Пьотра простягне світові руку й допоможе йому звестися на ноги. Охоплений раптовим натхненням, Пьотр торкнувся ручкою паперу. Слова полилися з олівця, доки вступ не було завершено. Пьотр перечитав його:"
 SBA_LibSoc.38.a: "Розділ перший: робітники й робітниці Канска..."

 
 SBA_Despotist.1.t: "Людина обирає"
 SBA_Despotist.1.desc: "Листівка висіла на кожному стовпі й дверях анархістської території. Угорі величезними друкованими літерами красувалося: «ГРОМАДЯНИ СИБІРУ!» Далі йшов такий текст:\n\n«Не бійтеся. ТИРАНА, ЗРАДНИКА й РУЙНІВНИКА Сибіру УВ'ЯЗНЕНО. Пьотр Сіуда - зрадник народу й комун. Він ЗҐВАЛТУВАВ і ПОГРАБУВАВ незліченну кількість жінок і дітей. Немає сумніву, його ПРОКЛЯТО. Доброзичливий маршал Чорної Армії ІВАН СТЄПАНОВ СКИНУВ цього жорстокого диктатора. Ваша свобода в безпеці».\n\nЛистівка завершувалася зловісним посланням:"
 SBA_Despotist.1.a: "«Анархія ЖИВЕ під провідною рукою Стєпанова!»"
 SBA_Despotist.1.b: "«НЕГІДНИК анархії мертвий. Стєпанов відродить державу!»"
 
 SBA_Despotist.2.t: "Усі по місцях!"
 SBA_Despotist.2.desc: "Повітря Новосибірська було важким від запаху зради. А може, то був смог - ніколи не розбереш. Громадяни куталися в куртки й пленталися на роботу до комунних фабрик. З боку Обі пролунав гудок. Вулицями свистів вітер. На майдані Анархії зібрався невеликий натовп. Зазвичай там траплялися хіба продавці зміїної олії, політичні марґінали, бездомні та божевільні. Цього разу на сцені стояла якась суміш усього переліченого. Коли Іван Стєпанов підійшов до мікрофона, риштування під ним зарипіло.\n\n«Тиран Пьотр Сіуда помер в ув'язненні!»\n\nНатовп загомонів і заворушився. Стєпанов сподівався на тепліший прийом.\n\n«Я скликав провідників численних конгресів Сибіру, щоб обговорити шлях анархії після доби Сіуди. Під провідною рукою Чорної Армії я забезпечу Новосибірськові й землям за його межами обіцяну свободу! Кінець етатизмові!»\n\nСтєпанов довго розповідав про чесноти анархії та гріхи Сіуди авдиторії, яка аж надто обережно аплодувала. Щоб остаточно задушити дух повстання, знадобиться час. Коли він закінчив, до трибуни вийшли очільники громад. Їхні слова звучали переможно й гордо, та під ними ховався страх. Політики - чудові актори, тільки коли до їхніх жалюгідних голів не приставлено зброї. Один за одним вони виходили, обсипали Стєпанова люб'язностями й удавали, ніби Сибір досі вільний. Наприкінці лишилася заледве половина натовпу - решту поглинула похмура зимова ніч."
 SBA_Despotist.2.a: "І вистава триває."
 
 SBA_Despotist.3.t: "Щастя під військовим примусом"
 SBA_Despotist.3.desc: "Лєонід закашлявся від диму, мабуть, найгіршої цигарки у своєму житті. Чорна Армія була в місті, і кожна її клята подачка смакувала лайном. Пиво, яке вона розливала на благо міста, було осадом із випитих діжок. Їжа напівзогнила, молоко ледь солодке. А все місто приймало це так, ніби зроду нічого не вирощувало. Один офіцер, роздаючи дітям хліб, помітив, що Лєонід спостерігає. Солдат бездоганно всміхнувся й помахав йому. Старий не збирався спокійно дивитися, як із серця міста виривають душу.\n\n«Ви, кляті червоні, не заберете нашої свободи! Тепер думаєте завоювати наші серця, га? Оця ваша цигарка? Закладаюся, її скрутив сільський дурник. Що тут, бензин і слина? Ви нічим не кращі за німців! Усі ви довбані етатисти, от що я вам скажу. Зневірилися в анархії, так? Зневірилися в народі? Я покажу, що для мене означає ваша маленька доброзичлива „допомога“!»\n\nЛєонід показово кинув цигарку на підлогу ґанку й сидячи розчавив її ногою.\n\n«Вона означає лайно! Чуєте? Лайно! А тепер біжіть до Іркутська й випросіть у Яґоди ще цигарок, зрадники народу!»\n\nСолдат із веселою цікавістю глянув на Лєоніда, попрощався з уже переляканими дітьми й пішов годувати інших мешканців нужденної комуни. Щойно офіцер зник із поля зору, Лєонід дістав іще одну подаровану цигарку й жадібно закурив."
 SBA_Despotist.3.a: "Нас їм не дістати!"
 
 SBA_Despotist.4.t: "А ви хто такий?"
 SBA_Despotist.4.desc: "Вони зібралися в курній клуні. Будівлі ради не було: хутір був таким малим, що суперечки й важливі рішення владнували на загальних зборах за кілька годин розмов, із хлібом та звичними чарками горілки. Через замети двері намертво замело, і лише пів дня копання вручну звільнило прохід. Більшість містян протиснулася всередину, збилася докупи й почала обговорювати справу дня.\n\nТієї осени врожай був поганий, і деяким родинам на півночі не вистачало харчів на зиму. Велика ферма на південь від хутора берегла припаси для патрулів Чорної Армії, які могли проїжджати містом, та, усвідомивши скруту, вирішила віддати більшість тій родині.\n\nУмови ретельно узгодили, потисли руки й добряче напилися. Зрештою, ніч була холодна, а горілка тепла. Збори почали скидатися на свято. Хтось навіть приніс балалайку, та щойно всі почали танцювати, пролунав постріл. Не за милю звідси, від якогось мисливця далеко від лісу, а просто в клуні. Чоловік тримав зброю над головою. Коли всі зрозуміли, хто саме стріляв, то нарешті збагнули, ким був новий громадянин. Не громадянином і навіть не місцевим. Судячи з акценту й п'яної мови, він прибув із Новосибірська. Перелякані слухачі розібрали кілька слів.\n\n«Ніхто не буде, е-е... ділитися харчами... без прямого дозволу Чорної Армії. Розмову скінчено, сільське бидло».\n\nВін схопив пляшку горілки, вийшов із клуні й поїхав верхи. Решта громадян заціпеніла. Цієї зими одна родина голодуватиме."
 SBA_Despotist.4.a: "Схоже, Чорна Армія вже в місті."
 
 SBA_Despotist.5.t: "Просіть - і, можливо, одержите"
 SBA_Despotist.5.desc: "Вони прибули з Новосибірська: потягом, автом, верхи, мотоциклом. Дехто велосипедом, ще менше - пішки. Кожен у плямистій чорній формі, з іржавим пістолетом і кількома набоями. Казали, що від ведмедів, але всі знали: дев'ятиміліметровий набій ведмедя не вб'є. Він призначений для людини. Вони принесли клаптик паперу з хитким чорним друком, що мало не смердів новосибірським відчаєм, якщо, звісно, його ще не скрутили в цигарку. Кожен знав послання напам'ять.\n\n«Привезіть своїх провідників до Новосибірська. Там ви разом із маршалом Стєпановим вирішите долю Вільних Територій».\n\nІ вони прибували юрбами, такі ж різноманітні, як і засоби їхньої подорожі: низькі, високі, білі, корінні сибіряки. Можливо, це був найбільший Конгрес в історії Вільної Території. Старий конференційний центр абияк прибрали, довгий стіл завалили свіжими булочками. Учасники сіли, двері зачинили, а репортери притиснули вуха до них, марно намагаючись почути щось зв'язне. Нікого не впускали й не випускали.\n\n«То був кінь?»\n\n«Мені почулося чи там стріляли?»\n\n«Там плаче дитина?»\n\nДо півночи більшість облишила пошуки правди. Удосвіта ошатно вбраний учасник зборів вийшов із папером у правій руці та рупором у лівій і звернувся до кількох людей, що лишилися.\n\n«Ми визначили майбутній устрій Сибіру»."
 SBA_Despotist.5.a: "«Маршал Стєпанов запевнив нас у нашій свободі»"
 SBA_Despotist.5.b: "«Маршал Стєпанов ґарантує свободу,\nдоки вона не заважає війні»"
 SBA_Despotist.5.c: "«Маршал Стєпанов поведе нас до справжнього визволення»"
 
 SBA_Despotist.6.t: "Я мав би вас знати"
 SBA_Despotist.6.desc: "Протести вщухли. Проти чого, власне, протестувати? Робітники дістали все, чого просили: рівні права, визволення праці та якусь подобу соціялізму. Тому, коли на майдані Анархії все ж спалахнув невеликий протест, Новосибірськ охопила цікавість. Але це був інший протест. Люди вимагали не нових економічних заходів, а політичної свободи. Уперше їм довелося за неї боротися: до приходу Стєпанова вони мали повну волю. Тепер по всьому Сибіру чинилися грабунки й обмежувалися свободи. На півночі цінну деревину сплавляли річкою на дрова для фронту. Коней і трактори конфіскували для «розвитку регіону». Найкращу пшеницю півдня забирали на пайки солдатам. Деякі надто відверті очільники комун почали зникати. Здавалося, за лічені місяці зникло все, на чому заснували Чорну Армію. Свобода вже не була вільною.\n\nЦе не означало, що Чорна Армія збиралася стріляти в мирних протестувальників. Стєпанов був етатистом, а не дурнем. Поки що він міг спостерігати, як опір сам згасає, а Чорна Армія показує людям справжню ціну свободи. Вони більше не сидітимуть без діла й не ухилятимуться від визволення Росії. Заради перемоги доведеться жертвувати, і Стєпанов подбав, щоб кожна родина сплатила ціну. Щоб загартувати їх."
 SBA_Despotist.6.a: "А зрештою - загартувати Росію."
 
 SBA_Despotist.7.t: "Незвична зустріч"
 SBA_Despotist.7.desc: "Неділя похмура.\n\nСтєпанов сьорбав вино, контрабандою привезене з далекого заходу, як і музика. У цьому була своя комедія: крадена музика, крадене вино, крадена влада. У їдальні панувала тиша, яку порушувала лише приглушена музика з програвача. Стєпанов сперся ліктями на стіл і поклав підборіддя на складені руки. «Сподіваюся, їжа найвищої якости?» За столом чемно закивали.\n\nМої години безсонні.\n\n«Добре», - сказав Стєпанов.\n\nПісня звучала далі.\n\nВалєнтєєв промокнув губи серветкою. «Що ж, було приємно, товаришу Стєпанов. Вечеря чудова». Він підвівся.\n\n«Так, гадаю, мені теж час. Треба лягати». Кільчічаков устав і присунув стілець.\n\nЛишилося двоє. Стєпанов дивився просто перед себе, блаженно загублений у музиці. «Іване? - запитав Мішурєнко. - Що ти робитимеш?»"
 SBA_Despotist.7.a: "«Я насолоджуватимуся вечерею, Мішурєнку»"
 
 SBA_Despotist.8.t: "Банкір"
 SBA_Despotist.8.desc: "Кільчічаков поправив високу хутряну шапку, натягнув рукавички й узув чоботи. Він мав куди важливіші справи за прогулянку: інтеграція нових територій, затвердження бюджету Чорної Армії, сварки з жадібними комунами. Неосвіченій людині це здавалося простим: підписав папірець і віддав бідоласі, якому доведеться повідомити комуні, що додаткового перерозподілу вона не дістане. Та від звичайного канцелярського щура Кільчічакова відрізняло те, що інші чоловіки проклинали саме поняття валюти, а він знаходив у ній спокій. Він любив свою роботу, і Стєпанов чудово це знав.\n\nВийшовши з кабінету в різке новосибірське повітря, Кільчічаков зустрів провідника анархії Івана Стєпанова. «Як ся маєш, Міхаїле?» - буркнув Стєпанов, підводячись із лавки. «Прогуляєшся зі мною?»\n\n«Знаєш, Міхаїле, - сказав Стєпанов, коли вони обходили квартал, - я не розумію, як працюють числа. Чесно, зовсім не розумію». Він зупинився, тримаючи руки в кишенях пальта. «А ти розумієш».\n\n«Гадаю, це приходить із досвідом. Почасти здібність природна, але...»\n\n«Знаєш, що ще я розумію, Міхаїле? Гроші просто так не зникають». Стєпанов дістав із кишені сигару й запалив. «Я хочу, щоб ти був на моєму боці, але знаю: тут є ще мільйон людей, які не гірше знаються на числах».\n\nМіхаїл Кільчічаков ледь кивнув. «Отже, це шантаж?»"
 SBA_Despotist.8.a: "«Не шантаж, а бізнес»"
 
 SBA_Despotist.9.t: "Генерал"
 SBA_Despotist.9.desc: "«Так, ага, розумію». Насправді Стєпанов нічого не розумів. Мало хто розбирав божевільні просторікування Андронія Мішурєнка. Та в душі Іван Стєпанов був актором. Принаймні вмів удавати, що слухає, хоча навіть це було зайвим. Стєпанов міг міцно спати, а Мішурєнко все одно просторікував би про важливість служби для знищення нацистської загрози. Іван відкинувся на спинку крісла й дивився, як старий генерал вішає грубо намальовану карту Европи за Уралом.\n\n«Оце, - сказав Мішурєнко, обводячи окуповане німцями серце Росії, - наша кінцева мета. Повернення батьківщини - найважливіше завдання народу. Росіяни так довго корчилися в муках під чоботом Гітлєра, що ми повинні визволити їх за першої нагоди».\n\n«Повністю згоден». Можливо, вперше в житті Стєпанов погоджувався з божевільним. Москву треба повернути. Він в'їде верхи, гордо здіймаючи чорний прапор, - і це закріпить його владу на довгі роки.\n\nМішурєнко почав шукати в торбі ще одну карту й між іншим кинув: «З тобою працювати набагато легше, ніж із хлопчаком».\n\n«Справді?»\n\n«Так. Гадаю, ти здатен зробити те, що мусиш. Хлопчак ніколи не був здатен»."
 SBA_Despotist.9.a: "Приємний комплімент від божевільного."
 
 SBA_Despotist.10.t: "Змія"
 SBA_Despotist.10.desc: "Валєнтєєв барабанив пальцями по керму в такт музиці. Непомітно для нього навіть дихання підлаштувалося під ритм. Китайської він не знав і в країні ніколи не був, та кордон із Китаєм майже не охороняли. Виїжджати з Маґадану було б надто очевидно - там на нього вже чекали б, а на захід Валєнтєєв точно не ризикнув би. Мабуть, краще про це не думати. Щоб відволіктися, він почав перемикати радіостанції.\n\n«ДОПОМОЖІТЬ! - заверещало радіо. - БОЖЕ, БЛАГАЮ, ДОПОМОЖІТЬ НАМ!» Від моторошного крику в чоловіка мороз пішов поза шкірою. Він ударив по гальмах і міцно вчепився в кермо, щоб не вилетіти з сидіння. «Це Марія Фєдорова, - схлипувало радіо. - Я замкнена в церкві Горно-Алтайська... прошу, якщо хтось чує, МЕНІ ПОТРІБНА ДОПОМОГА!» Валєнтєєв миттю ввімкнув передачу й помчав до комуни.\n\nКомуна була сільська й маленька, але незвично тиха. Валєнтєєв обережно рушив до церкви, пригнувшись і тримаючи зброю напоготові. У вікні він побачив на підлозі мертвих чоловіків. Чорт! Запізнився. Хіба що дівчина встигла сховатися, поки село билося з бандитами? Валєнтєєв увійшов до церкви, тримаючи палець біля спуску.\n\n«ДОПОМОЖІТЬ! - кричала дівчина. - БОЖЕ, БЛАГАЮ, ДОПОМОЖІТЬ НАМ!» Валєнтєєв кинувся на звук, розчинив двері підвалу й побачив не дівчину, а програвач, радіо й досить вибухівки, щоб знести Фольксгалле."
 SBA_Despotist.10.a: "До свіданія, товаришу Валєнтєєв."
 
 SBA_Despotist.11.t: "Наступні миті вирішать решту вашого життя"
 SBA_Despotist.11.desc: "Стєпанов затягнувся останньою цигаркою з пачки. Він іще не став тим гедоністом, на якого часто перетворюються авторитарні правителі, але дозволяв собі дрібні розкоші. Цигарка була не місцева, не з тих паскудних тютюнових господарств за містом. Справжня американська, з Вірджинії. Вдихаючи дим, він на коротку мить засумнівався, що комуни приречені на невдачу. Зрештою, якщо якісь капіталістичні плянтації Вірджинії здатні створити таке, що це казало про купку російських бовдурів, які гарували у своїй «демократії на робочому місці»?\n\nДумку перервав телефонний дзвінок - не така вже й розкіш, старий апарат Червоної Армії. У слухавці прозвучав незнайомий голос із московським акцентом. Напевне, утік після війни. Голос тремтів.\n\n«Пане, я говорю від імени маршала Валєнтєєва. Маршал чемно просить вас скласти повноваження й співпрацювати у відновленні анархії».\n\nСтєпанов зважив вибір. Або поступитися й, можливо, загинути в сибірській в'язниці, або кинути виклик Валєнтєєву. А якщо кинути виклик - хтозна, що буде далі? Тож він підняв слухавку й відмовився коритися.\n\nВалєнтєєв почув дзвінок, і серце завмерло. Невже це воно? Мить, коли вони нарешті перемогли? Можна припинити битися й тиснути, можна відпочити. Просто відпочити - без тривог про етатизм, деспотів чи смерть в ім'я життя. Він узяв слухавку, і серце знову завмерло.\n\nВалєнтєєв не був готовий до такої відповіді. Не думав, що його блеф викриють. У нього не було ні людей, ні грошей на війну. Боже, як він міг бути таким дурнем? Наступні слова Стєпанова вирвали з чоловіка серце, ідеалізм і надію."
 SBA_Despotist.11.a: "«Може, забудьмо про це,\nа ви підете на спочинок до своєї дачі»"
 
 SBA_Despotist.12.t: "Геть! Усі геть!"
 SBA_Despotist.12.desc: "Усе вирішували наступні кілька хвилин. Роки очікування, планування й підготовки, терпіння Сіудиного «товариського» безглуздя, добір правильних солдатів, навіть слушної погоди - Стєпанов уже двічі все скасовував через дощ. Та сьогодні погода не підвела, а Генеральна Асамблея була переповнена. Або сьогодні, або ніколи.\n\n«Товаришу Стєпанов, ви досі не пояснили, що сталося з товаришем Пьотром Сіудою. Він був під вашим захистом, і його зникнення непокоїть багатьох у цій Асамблеї». Слова повернули Стєпанова до дійсности. Безліч облич дивилася на нього, напружено чекаючи відповіді. Він глянув у нотатки: довга промова засуджувала Пьотра, перелічувала його численні невдачі й загальну недалекість, а «зникнення» пояснювала провиною самого надміру завзятого хлопчиська. Але це було не в стилі Стєпанова. Ніколи не було. «Товариші». Стєпанов усміхнувся, коли ненависне слово викликало хвилю огиди в Асамблеї. «Я не мушу відповідати за трагічну долю товариша Пьотра. Адже від цієї миті Асамблею розпущено». Він натиснув кнопку під трибуною.\n\n«Товаришу Стєпанов, що це за етатистське божевілля?» - встиг запитати депутат, перш ніж до зали ринули десятки бійців Чорної Армії. Стєпанова огорнуло полегшення, і він стиснув трибуну. Він так довго уявляв цю мить, що частина його не вірила в її прихід. Та ось вона настала.\n\nОдин депутат скочив на ноги. «Це зрада, Стєпанове! Вільної Території та всього...» Солдатка смикнула його назад і прикладом рушниці забезпечила мовчання. Стєпанов схопив мікрофон. «Прикро, що такі рішучі дії стали необхідними, - збрехав він. - Але Генеральна Асамблея раз у раз доводила нездатність керувати Вільною Територією. Рада Безпеки чудово впорається без вас. А тепер співпрацюйте із солдатами, які виведуть вас із зали, щоб перехід відбувся мирно й упорядковано»."
 SBA_Despotist.12.a: "«Відмова співпрацювати була б нерозважливою, товаришу»"
 
 SBA_Despotist.13.t: "Ні, ні! Я не піду!"
 SBA_Despotist.13.desc: "Життя ніколи не було досконалим. Воно було важким, виснажливим, смертельно небезпечним і, понад усе, коротким. Але в Сибіру, серед тієї пустки, воно на крок наближалося до досконалости. Робота була тяжкою: вигрібати хліви, сіяти зерно. Та навколо панувала краса. Вона ніколи не зникала. Повільна звивиста дельта. Прохолодний вітер літнього ранку, лютий мороз узимку. Засніжені гори, що ледь визирали з-за обрію. Кожен день був повним і незмінним, линув наче вітер. Він міг би жити так вічно.\n\nВони приїхали вночі у великій гуркітливій військовій вантажівці. Підкотили просто до дверей, загупали до них великими чобітьми й почали стукати. Стук не припинявся. Він чув його й досі. Потім двері вибили, а його витягли назовні. Він кричав. Він був лише хлопчиком. Не готовим померти за свою країну. Мати теж кричала. Батько кілька хвилин намагався чинити опір, та удар прикладом у лице змусив його замовкнути. Хлопця довелося волокти з дому, поки він брикався й благав за своє життя. Його кинули в кузов. Під пов'язкою на очах він не міг стримати сліз. Плакав і плакав, повсякчас чуючи той стук. Чи був він насправді? Зрештою життя згасло у сні та маренні."
 SBA_Despotist.13.a: "Йому снився той стук і материн крик."
 
 SBA_Despotist.14.t: "Бери це й забирайся"
 SBA_Despotist.14.desc: "Коли хлопчик прокинувся, вантажівка вже зупинилася й займався світанок. Двоє чоловіків витягли його з кузова.\n\n«Хочеш до армії, га?»\n\n«Н-ні. Я просто хочу додому, пане. Будь ласка, я хочу додому».\n\n«А нам насрати. Бери торбу й рушай тією долиною. Ми чекатимемо на іншому боці».\n\nОбидва засміялися. Вони знали, що він не дійде. Повернулися до машини й поїхали, лишивши хлопця в куряві із ще мокрими від сліз щоками. У торбі знайшлася повна води фляга, трохи мізерних пайків, черствий хліб і брезент, напевне для укриття. Доведеться вдовольнитися цим. А що ще робити? Чекати, поки його склюють грифи? Тож він рушив, штурхаючи каміння й схлипуючи на стежці.\n\nКоли гнів нарешті розчинився в журбі, він почав дивитися довкола. Краєвид нагадував дім. Дельти не було, зате були ті самі низькі гори й пагорби з плямами дерев. Майже як удома.\n\nВін утомився, зголоднів, хліб скінчився. На небі вже зійшов місяць. Вони мали рацію: йому ніколи не дістатися. Хлопець нашвидкуруч прив'язав брезент між двома деревами й сів на колоду, дивлячись у темряву. Він так і не заснув, лише сидів, плакав, лютував і перебував у жахливому заціпенінні.\n\nАж раптом небо заворушилося. Спершу спалахнуло кілька вогнів, та за хвилину все небо затремтіло й загойдалося фантастичними барвами. Зелене, пурпурове, синє світло осяяло височінь. Наче величний, невимовний танець.\n\n«О Боже. На півдні такого немає»."
 SBA_Despotist.14.a: "Він сидів, а барви відбивалися в заплаканих очах."
 
 SBA_Despotist.15.t: "Я вас проведу"
 SBA_Despotist.15.desc: "Нова новосибірська технічна школа приносила самі клопоти. Діти виходили звідти без найменшого розуміння техніки, а всі викладачі, здавалося, були підривниками, які вчили учнів лише анархістської революційної думки. Нещодавно дехто зі студентів почав напиватися й збиратися в організацію «Нові анархісти», проголошуючи ненависть до Ради Безпеки й прагнення повернути Пьотрів ідеалізм.\n\nОднієї морозної новосибірської ночі гурт «Нових анархістів» влаштував на вулиці «протест». Вони п'яно ображали солдатів і кидали в них уламки цегли та каміння з бруківки. Почав збиратися натовп цікавих глядачів і розлючених солдатів. Здавалося, ось-ось почнеться однобічна бійка - Бостонська різанина нової Росії. Який новий Пол Рівер прославить її у своєму зображенні? Який Кріспус Аттакс поведе наступ за свободу й анархію?\n\nСолдат витяг іржавий револьвер і тричі вистрілив у повітря. Можливо, хоробрість цих анархістів перебільшували. Почувши постріли, вони кинулися навтьоки."
 SBA_Despotist.15.a: "Лише купка п'яних студентів."
 
 SBA_Despotist.16.t: "Найвеличніше пограбування у світі"
 SBA_Despotist.16.desc: "Перемагати було приємно. Бути собою було приємно. Було приємно розслабитися, поволі сьорбаючи найрозкішніший алкоголь, який могла запропонувати Росія. З балкона Іван Стєпанов бачив Росію - СВОЮ Росію. Звісно, вона «належала народові», анархія жила й процвітала. Власне, вона ніколи не була такою сильною! Стєпанов мало не захлинувся вином від сміху.\n\nВін лежав десь там, у неглибокій могилі, похований у місці, яке любив. Поетично. Може, Стєпанову спробувати писати вірші? Якби тільки знайшовся час між керуванням людьми й військом. Колись він, можливо, запише свої думки. Хтозна? Краще питання: кому не байдуже? Стєпанову точно було байдуже. Ця ніч належала лише йому. Жодного Пьотра, що дошкуляв ідеологією, жодного Валєнтєєва, що загрожував владі, жодної вини, що переслідувала б його.\n\nГенерал Іван Стєпанов обережно вибрав платівку й опустив голку. Над Сибіром заходило сонце, осяюючи зрадливого генерала золотим світлом. Чи воно того варте? Терпіти всю маячню про товаришів? Різати людей в ім'я ідеології, до якої йому байдуже? Безперечно.\n\nСтєпанов відкинувся у кріслі. Проблем вистачало: майбутнє визволення, зростання Чорної Армії, викорінення останніх прибічників Пьотра. Та це проблеми завтрашнього дня. Ця ніч належала йому. Росія належала йому - найгеніяльнішому злодієві, який поцупив анархістський рух просто з-під носа його прибічників."
 SBA_Despotist.16.a: "Тяжка праця винагороджується."
 
 SBA_Despotist.17.t: "Звичайна пияцька гра"
 SBA_Despotist.17.desc: "Осяяння прийшло вночі.\n\nСтєпанов улаштував одну зі своїх вечірок в оточенні повій. На програвачі крутилася платівка зі старими російськими шляґерами совєцьких часів. Вони пили й роздягалися - звичайна ніч. Аж поки вона не вимовила ті слова.\n\n«О так, дерева геть розбомбило».\n\nЦе сказала одна з гарніших повій, із яскраво-червоною помадою та в короткій спідниці, яку особисто замовив Стєпанов.\n\n«Стривай. Алєксандріна, так? Ні. Каріне. Що ти щойно сказала?»\n\n«Я-я лише сказала, що мусила зрубати дерева біля свого будинку. Одне мало впасти. Не хотіла вас образити, пане Стєпанов. І... я Анастасія, пане».\n\n«Ні, Каріне, ти вжила дуже особливе слово про те, як зрубала дерева».\n\n«Розбомбило?»\n\n«Так. Так, саме воно! Воно!»\n\nСибірські повії приголомшено дивилися, як Стєпанов вискочив із дачі, застрибнув у машину й помчав на південь. Що ж, він заплатив їм за всю ніч, алкоголь лишився - чому б не святкувати далі?\n\nСтєпанов був трохи п'яний, але все стало ясно. Йому потрібна ядерна бомба. Іншого шляху не було. Хто тепер на них не нападе? Без великого засобу стримування, що тримав решту світу в заціпенінні, війна вже поглинула б усе."
 SBA_Despotist.17.a: "До Зєлєноґорська!"
 SBA_Despotist.17.b: "Чув, на сході є чимало!"
 
 SBA_Despotist.18.t: "Святий Петре, не клич мене"
 SBA_Despotist.18.desc: "Пьотр Сіуда сидів сам зі склянкою горілки й постукував ногою. Заглибившись у думки, він стукав, доки не усвідомив звуку. Змусив себе дихати й заспокоїтися, а тоді зрозумів, що слід зробити.\n\nЧорна Армія перетворилася на правителів, а понад державу Пьотр ненавидів тільки правителів, які її підтримували й заслуговували на кару. Коли народна армія втрачає ідеали та підтримку народу, вона стає просто бандою. Сіуда з болем визнавав, що саме це й сталося. Хтозна, що вони задумали? Скинути анархію, свободу, за яку всі так тяжко боролися? Відновити державу, що прикриватиметься комунізмом, але буде позбавлена його справжніх ідеалів? Це треба припинити. Їх треба вбити. А якщо не можна вбити - майже заморити працею.\n\nРепресії почалися з малого. Комуни відкликали солдатів і генералів за «пропозицією» Пьотра. Дехто з нижчих чинів зник на півночі. До кінця місяця все стало очевидним. Стільки чоловіків просто щезло. Офіційно багато хто ніколи не існував - їх стерли з документів. Та всі знали, де вони: або поринули у вічний сон без сновидінь, або гарували в північних таборах. Життя там було жорстоким і часто коротким. Чоловіки прибували в сльозах і благали про іншу кару, будь-яку іншу. Але Сіуда був ситий тиранами. Ситий тим, що народ став трохи більше за рабів бандитів. Чорну Армію треба було очистити."
 SBA_Despotist.18.a: "Досить."
 
 SBA_Despotist.19.t: "Дозріло для збору"
 SBA_Despotist.19.desc: "Це жиди. Не інакше. Хто ще при здоровому глузді змусив би такого, як він, - борця за білу расу й чистоту арійського народу - видобувати якийсь проклятий метал? Вони смикали за всі нитки. Довбані жиди.\n\nАртур намагався зрозуміти, чим пахне в шахті. Нудотний запах. Та коли він вдихнув, горло забив густий задушливий пил. Він ледве дихав. Боже, чому не бився з жидами до смерти? Одного він наче вбив, хоча тепер, пригадуючи, зрозумів, що то міг бути його ж солдат. Рушниці. Їх зробили жиди, тому спуски були несправні. А тепер вони що, будують ядерну бомбу? Авжеж, адже атоми - жидівська наука. Він мусив повернутися до Ґерманії. Попередити Гітлєра. Чи Гітлєр іще живий? Боже, він не міг дихати. Треба повернутися до Гітлєра. Вийти із шахти й розповісти про бомбу. Жиди. Так, саме так. Вони будують бомбу. Артур поповз до сонячного світла. У той бік, правда? Здається, там він повернув ліворуч... чи праворуч? Так, ось воно, світло. Ці шахти такі курні, темні й заплутані. Може, це пил. Він ніяк не міг його позбутися.\n\nОхоронець дивився, як чоловік, хриплячи й бурмочучи, виповз із шахти. Він без кінця кашляв пилом.\n\n«Назад, фашистське падло! Робочий день іще не скінчився!»\n\nЧоловік поглянув на нього й забурмотів: «Ти жид». Він підповз до охоронця. «Нащо ви, сучі сини Сіону, будуєте бомбу? Нащо? Відповідай!» Чоловік знову захрипів.\n\n«Торкнешся мене - застрелю, нацисте».\n\nАртур кволо вдарив охоронця, і один постріл у груди обірвав його життя."
 SBA_Despotist.19.a: "Гітлєр так і не довідався про бомбу."
 
 SBA_Despotist.20.t: "Рушай далі"
 SBA_Despotist.20.desc: "Закордонні медія надрукували новину літерами середнього розміру на звороті третьої сторінки.\n\nРОСІЙСЬКИЙ ВОЄВОДА СТЄПАНОВ СТВОРИВ ЯДЕРНУ БОМБУ\n\nАНАРХІСТИ РОСІЇ ПОКАЗАЛИ ЯДЕРНУ ЗБРОЮ\n\nБільшість вирішила, що це чутка, й повернулася до своїх справ. Для Стєпанова це був один із найвищих злетів. Провезти бомбу Новосибірськом - навіть якщо то був лише муляж - стало для нього справжньою миттю гордости. Коли велетенську бомбу з пап'є-маше провезли містом, він зійшов на трибуну на майдані Анархії й заговорив до змерзлого й смертельно знудженого натовпу.\n\n«Я хочу подякувати всім ядерним науковцям, які допомогли створити це технологічне диво й прибули сюди побачити його показ».\n\nЖоден науковець не прийшов, але пролунали рідкі оплески. Стєпанов продовжив: «Ця бомба не лише ґарантує нашу свободу, а й покаже всьому світові наші передові можливості!»\n\nДік склав газету. Дивна промова з Росії. Не те щоб його це стосувалося. Здавалося, по-справжньому важливі новини звідти ніколи не доходили аж до Америки. Невдовзі почалася робота."
 SBA_Despotist.20.a: "А він іще навіть кави не випив!"
 
 SBA_Despotist.21.t: "Доброзичливий бог"
 SBA_Despotist.21.desc: "Наприкінці нічим не примітної промови Стєпанов додав імпровізоване звернення.\n\n«На нашій різнобарвній і різноманітній Землі є багато дурнів. На жаль, перший дурень виявився солодкомовним, тож тепер світ ними переповнений. Найбільше я зневажаю тих дурнів, які вірять у людську природу. Вірити слід лише в одне - у Бога. Не в міф про бездоганну людину чи соціялізм, а в єдність Божу. І, схоже, саме та віра привела нас до зрадників і фальшивих пастирів на кшталт нашого старого друга Сіуди.\n\nЛюди Новосибірська, не йдіть їхніми слідами. Людська природа - жахлива, жахлива річ. Анархія огидна, жорстока й коротка. Лише провід сильної руки врятує людину від падіння у війну всіх проти всіх. Благаю вас, маловіри, покладіться на мене. Адже Чорна Армія не перестане рятувати вас від хвиль диких, спустошливих варварів. Ми - новий бастіон цивілізації в Сибіру, і ніхто не відбере в нас цього звання»."
 SBA_Despotist.21.a: "Постає нове божество."
 
 SBA_Despotist.22.t: "Трон із кісток"
 SBA_Despotist.22.desc: "Останньою справжньою пропагандою, яку бачив Фьодор, були плакати бухарінських часів. Ті кляті аркуші проголошували близьку поразку німців і переможний наступ Червоної Армії. Колись вони були всюди: на кожній стіні, у кожних дверях. Тепер тріпотіли на вулицях, чіплялися за дерева чи горіли, даруючи тепло. Нещасні, яким доводилося ночувати надворі, складали з них ковдри проти сибірської ночі. Фьодор згадував, як деяким плакатам не щастило стати туалетним папером. Напевне, це було краще за листя.\n\nТому дивно було побачити в Новосибірську новий плакат. Не такого чистого червоного кольору, як у Бухаріна. Придивившись, Фьодор помітив вади друку: фарба виходила за лінії, постаті на тлі були майже чорними плямами. Грубо, та все ж пропагандистський плакат. Зображення було дивне. У центрі чоловік стояв навколішки, схиливши голову. Пошматована форма кавалериста й широкі підкручені вуса видавали Сємьона Будьонного, того большевика, якого вбили під час атаки на Богучани. До його горла приставив меч інший чоловік, обличчя якого не показали, але статурою він нагадував звичайного солдата Чорної Армії. Фьодор мружився, та впізнати його не міг.\n\nФьодор був там під час атаки - найвищої хвилі боротьби Чорної Армії проти большевиків на сході. Стріляв зі старої ґвинтівки по конях. Будьонний очолював атаку й упав, коли випадкова куля влучила тварині в тулуб. Коли Чорна Армія відбила червоних, Сіуда застрелив Будьонного в голову. Звістка облетіла регіон: диявол Богучан мертвий. Чому ж тоді, думав Фьодор, Будьонного страчував якийсь безіменний солдат, а не Пьотр? За мить його осяяло. Старий покидьок Стєпанов не хотів вихваляти здобутки Пьотра. Він вихваляв Чорну Армію. Нічим не кращий за Бухаріна."
 SBA_Despotist.22.a: "Одного дня ми ними дупи витиратимемо."

 SBA_Despotist.23.t: "Ви про них чули?"
 SBA_Despotist.23.desc: "«З'єднайте з Мішурєнком». Іван Стєпанов гаркнув наказ із ліжка й нетерпляче чекав, поки черговий ідіот у кабінеті Мішурєнка перемкне лінію. Він поглянув на величезну білу мармурову стелю спальні. Нещодавно відремонтував її коштом Кільчічакова. Ото вже п'явка: гроші з бюджету зникали в його присутності так майстерно, що це вразило б Стєпанова, якби не було таким виснажливим.\n\n«Товаришу Стєпанов, це Андроній Мішурєнко». Стєпанов наче чув, як із його рота летить слина. Як він узагалі дійшов до того, що ця людина стала його найнадійнішим радником?\n\n«Євґєнія з тобою? Казала, що зайде до кабінету. Щось про...»\n\n«Теракт у Канську? Так, мені відомо».\n\nСтєпанов оторопів. Відколи в Мішурєнка з'явилися яйця? Він придушив бажання розірвати йому дупу - справа понад усе. «Вона там чи ні?»\n\n«Ні. Вона не приходила». Тиша. «Товаришу Стєпанов, ви про них чули?»\n\nЦя фраза переповнила чашу. «Годі загадкового лайна, заради Бога. Я думав, із Сіудою покінчено і з ним, чорт забирай». Знову тиша. Стєпанов прикусив губу: йому справді хотілося знати. «Розкажи, що відбувається, Андронію. Мені їхати до Канська?»"
 SBA_Despotist.23.a: "«На вашому місці я тримався б подалі від міста»"
 
 SBA_Despotist.24.t: "Протилежність любови"
 SBA_Despotist.24.desc: "Андрєй застогнав, лягаючи в ліжко; тіло боліло після недавньої сутички. Місцеві фабричні робітники вирішили спаплюжити його дім, а згодом загнали Андрєя в кут і побили до крови. Максім досі працював зміну на заводі боєприпасів, і Андрєй сподівався, що той не надто занепокоїться, коли його побачить. Максіму й без того було важко, Андрєй не хотів ставати ще одним тягарем. Він навіть відмив фарбу з дверей, хоча все так боліло, що літня сусідка мусила допомагати носити воду.\n\nАндрєй пам'ятав часи, коли такого не траплялося. Звісно, все не було досконалим, але якщо ставало погано, можна було звернутися до солдатів і змусити ненависників бодай вибачитися. Поки його били, серед нападників він наче впізнав одного із солдатів, якому раніше скаржився. Можливо, винна травма голови, але Андрєй не міг пригадати, коли саме все змінилося. Ставлення змінилося після приходу Ради Безпеки до влади, але ж вона наче підтримувала захист таких, як він, правда?\n\nАндрєй зітхнув. Ще кілька днів - і він повернеться до свого підрозділу, де людей приймають краще. За іронією, Андрєй був щасливчиком, хоча зараз так не почувався."
 SBA_Despotist.24.a: "Не знаєш справжньої цінности втраченого, доки воно не зникне."
 
