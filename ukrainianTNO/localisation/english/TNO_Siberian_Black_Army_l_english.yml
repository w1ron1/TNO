 SBA_general_assembly_category: "§eГенеральна Асамблея§!"
 SBA_general_assembly_category_desc: "Комуни Вільної Території утворюють «§eГенеральну Асамблею§!» - фактичний законодавчий орган нашого славетного суспільства. Тут комуни можуть висловити скарги й ідеї та спільно ухвалити рішення на користь усіх вільних народів світу. Звісно, ми вільні від корупційних оборудок і взаємних послуг буржуазних «демократій», а всі позірні прояви такого - лише хибне розуміння анархістських методів."
 
 SBA_general_assembly_information_tt: "Голосування з різних питань можна проводити кнопкою «Показати пропозиції». Існують три типи питань: §Rреформи§!, §Yрезолюції§! та §Gпропозиції§!.\n\n§RРеформи§! назавжди змінюють ефекти національного духу «§YСибірська Вільна Територія§!». Голосувати за них можна лише після ухвалення попередньої реформи й розблокування через національний фокус.\n\n§YРезолюції§! впливають на політику §eГенеральної Асамблеї§! та §qРади Безпеки§!. Голосувати за них можна лише після розблокування через національний фокус або подію.\n\n§GПропозиції§! мають менший вплив і надають Вільній Території невеликі бонуси. Після висунення пропозицію не можна вносити повторно протягом §Y180 днів§!.\n\nПитання обговорюватимуть у §eГенеральній Асамблеї§! протягом §Y60 днів§!. Якщо §Yдві третини§! представників комун проголосують «за», його буде ухвалено.\n\nКожна комуна має власний §Yетос§!, що впливає на її голосування з різних питань. Схилити комуни до підтримки можна за допомогою §Yпоступок§!."
 
