 SBA.32.a: ""

 SBA.33.t: "Сезон полювання"
 SBA.33.desc: "\"Прочесати й обшукати!\" - командир указав на величну дачу Алєксандра Покришкіна. Альоша не знав, що робити. До армії вступив лише кілька тижнів тому, навчався з іншим чотою, тож наслідував гадано досвідченіших товаришів. Вони обійшли зліва й рушили до задніх дверей - спіймати сокола в гнізді.\n\nАльоша притиснув рушницю до грудей і крадькома ступав уперед. Дурня: Покришкіна напевно вже не було. Краєчком ока він глянув на ліс. Нічого. Стривайте, це... бліда голова? Лисий чоловік? Альоша примружився - постать зникла. Дурний хлопчисько! - пролунав у голові батьків голос. Тіло наказувало рухатися, але очі вчепилися в ліс. Він порівнював уявний знімок із теперішнім краєвидом. За найменшого руху гілки нутро кричало: біжи.\n\nТріск - хтось наступив на гілку. Альоша озирнувся на бійців: ніхто не почув. Тепер нутро наказало.\n\nЗадихаючись, він біг, рушниця метлялася. Неможливо. Що глибше він забирався до лісу, то дурнішим здавалося це починання, та ноги не спинялися. За галявиною виднівся малий летунський майданчик. Удалині похитувалася товстенька зелена постать із лисою головою. Альоша підняв рушницю й узяв її на приціл. Сьогодні він уполює сокола. Яка історія: молодий новобранець убив очільника ненависної держави! Альоша наказав собі натиснути на гачок, та пострілу не було. Навіть здалеку він бачив відчай, із яким біг Покришкін. Той боровся за життя, як і сам Альоша."
 SBA.33.a: "Альоша опустив рушницю."


