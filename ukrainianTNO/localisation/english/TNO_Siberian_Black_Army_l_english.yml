 SBA_build_a_nuke_workshop: "§OПроєкт «ЕМАНСІПАЦІЯ»§!"
 SBA_build_a_nuke_workshop_desc: "Кожна держава, яка прагне закріпитися серед провідних сил світу, мусить розпочати пошуки §Gядерної зброї§!.\n\nБільшість країн веде їх у лабораторіях, випробовує зброю на островах і погрожує світові §Rядерним армаґедоном§!, але §WВільна Територія§! обрала інший шлях. Під проводом §WПьотра Сіуди§! народ §WРосії§! доведе, що з ним треба рахуватися. Щоб зберегти мету §Gпроєкту «ЕМАНСІПАЦІЯ»§! - створення §Gатомної бомби§! за допомогою народу, - §WПьотр Сіуда§! відвідуватиме комуну за комуною й проситиме поради. Мільйони жителів Сибіру мають мільйони різних думок. Вибір порад, до яких ми прислухаємося, і тих, які відкинемо, визначить долю §Gпроєкту «ЕМАНСІПАЦІЯ»§! та всієї §WРосії§!."
