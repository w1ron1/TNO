 ### Leader Bios and Names ###
 SBA_Siberian_Soviet: "Сибірський Совєт"
 POLITICS_SIBERIAN_SOVIET_DESC: "Після розпаду Союзу мешканці басейну Ангари раптом опинилися поза владою Москви. Перше, що вони зробили в істинно соціялістичному дусі, - зібрали комітет. Чимало місцевих установ і без московського нагляду продовжували працювати, а завдяки нормуванню та затягуванню пасків багато завезених із інших частин Союзу товарів можна було замінити місцевими або й зовсім без них обійтися. Зв'язок із залишками совєцького уряду на заході Росії урвався, та люди не квапилися визнавати ані «демократичний» тимчасовий уряд Центральносибірської республіки, ані тиранічний режим Ґєнріха Яґоди. Вони створили загони самооборони й кров'ю боронили свою свободу. Так, під впливом колись вигнаних анархістських мислителів із найдальших куточків Совєцького Союзу, вони проголосили незалежний Сибірський Анархістський Совєт - самоврядний керівний орган із рівним представництвом усіх великих міст і промислових спілок.\n\nКоли зовнішні загрози відступили, Сибірська Чорна Армія - військова сила вільних комун на берегах Ії - стала одним із найвпливовіших голосів у Совєті й проголосила мілітаризований анархізм своєю головною платформою. Служба в міліції стала невіддільною частиною життя кожного чоловіка й жінки Вільної Території, а збройні формування вільних комун збиралися не лише задля самооборони вільних громад, а й задля поширення визвольної ідеології за кордоном.\n\nДедалі глибша мілітаризація анархістського суспільства, начебто суперечна анархістським ідеалам, спричинила напрочуд мало напруження між Армією та Совєтом. Проте чимало простих людей бояться, що амбіції Чорної Армії, захисниці незалежности сибірських комун, зрештою знищать їхню власну свободу."
 
 SBA_Security_Council: "Сибірська Рада Безпеки"
 POLITICS_KHAKASSIA_SECURITY_COUNCIL_DESC: "Піднесення Ради Безпеки до становища вирішальної сили в сибірській політиці мало стати поштовхом, що знову запустить завмерле серце Мами Анархії. Для багатьох це стало водночас і потрясінням, і цілком очікуваною подією. Поки міжнародні спостерігачі міркують про наслідки усунення Генеральної Асамблеї на узбіччя, перед людьми під владою зміцнілої Чорної Армії стоїть складніше питання: чи можуть вони досі називати себе вільними?\n\nДо Ради увійшли найвпливовіші й найталановитіші офіцери Центрального Сибіру, а Вільна Територія відвернулася від первісної мети. Колись це була спільна боротьба людей, що знали біль і все життя жили під чоботом тиранії, проти гнобительської системи, яка переслідувала людство споконвіку. Та підступи генерала Івана Стєпанова переліпили, змінили й спотворили її.\n\nСтєпанов здобув вплив під час розпаду Центральносибірської республіки. Очолюючи дивізію, яка мала прокладати шлях до самого серця держави Яґоди, генерал побачив безглуздя того, що росіяни й далі йдуть убивати росіян за наказом костюмованих панів зі столиці. Він нашвидкуруч уклав угоду з блискучим промовцем і профспілковим ватажком Пьотром Сіудою: Стєпанов підняв свою дивізію проти тиранії та влади, а Сіуда забезпечив рухові народну підтримку.\n\nІван Стєпанов довго підіймався на вершину, але тепер, коли Генеральна Асамблея безсила, генералові лишилося тільки робити те, що він робив завжди: влаштувати гарну виставу."
 
 TAN_Mongush_Buyan_Badyrgy: "Монґуш Буян-Бадирґи"
 POLITICS_MONGUSH_BUYAN_BADYRGY_DESC: "Колишній голова Ради міністрів і гаданий наступник Дондука Куулара у старій Тувинській Народній Республіці Монґуш Буян-Бадирґи очолює народ, яким довго нехтували й про який забули. Тува пережила розпад Совєцького Союзу й постала незалежною державою, надсилаючи Монголській Народній Республіці ту крихту допомоги, яку могла, аби стримати імперіялістичні японські війська. Та попри зусилля тувинського й монгольського народів Улан-Батор упав перед загарбниками, і багато хто в уряді Куулара боявся, що наступним стане Кизил.\n\nТож прибуття до Туви сил Червоної Армії сприйняли як справжнє благословення. Вимога підпорядкувати Тувинську Народну Республіку командуванню Червоної Армії була незначною ціною за шанс відвернути Японію.\n\nПісля смерти Куулара Буян-Бадирґи очолив новий тувинський уряд при Народній революційній раді. А коли сили Червоної Армії капітулювали перед Чорною Армією, що наступала з півночі, завдяки популярності серед тувинців йому дозволили вільно піти. Певний час Буян-Бадирґи це влаштовувало: змінився тільки прапор армії, що їх захищала. Та невдовзі у сплюндрованому війною краї знову вибухнув хаос: різні північні комуни Вільної Території оголосили про відокремлення, і до Туви прибули сили Івана Стєпанова.\n\nДо Туви знову прийшла армія, майже з тих самих причин, що й попередня. Проте вона вже не прагнула співпрацювати з тувинцями: запровадила призов, перекинула виробництво на військові потреби й спорудила оборонні укріплення, втягнувши Туву в новий безглуздий конфлікт. Буян-Бадирґи не міг бездіяльно дивитися на це. Згуртувавши колишніх урядовців і вояків Туви разом із алтайськими партизанами, він підняв повстання проти влади Чорної Армії. Тува знову мусить битися з незмірно сильнішим ворогом, але, долавши такі труднощі раніше, Буян-Бадирґи знає: вона переможе знову."

 KAL_Regional_Councils: "Регіональні ради"
 POLITICS_REGIONAL_COUNCILS_DESC: "Анархія - ідеал, що визволив Центральний Сибір від кайданів авторитаризму, влади воєначальників і елітаризму, - зазнала краху. Коли комуни Красноярска оголосили незалежність і повернулися до темряви, що поглинула край кілька місяців тому, комуни північного Сибіру опинилися відрізаними від настанов Генеральної Асамблеї. Втративши погоджений міжкомунний орган, вони запанікували, залишившись роз'єднаними й без проводу.\n\nТа дні минали, перетворювалися на тижні, а тоді й місяці - і комуни північного Сибіру стояли. Вторгнення нових воєначальників із півдня так і не сталося, як не сталося й голоду через брак координації між комунами. Попри безсумнівні труднощі децентралізовані комуни Північносибірських Совєтів вижили, тепер уже відокремлені від будь-якої влади.\n\nТака крайня децентралізація робить створення армії, координацію розвитку й будь-які рішучі дії майже неможливими, та комуни Норільска, Колпашева і їхні численні сільські товариші тримаються. Генеральну Асамблею, яку раніше вважали життєво необхідною для координації Вільної Території, тепер бачать застарілою організацією, що заважала сибірякам утілити справжній анархізм.\n\nТа чи здатна така система вижити в суворих російських землях, із воєначальниками на півдні та централізованими державами, що постають на сході й заході?"
 POLITICS_IVAN_STEPANOV_DESC: "Якщо розпад Совєцького Союзу й мав бодай одну добру сторону, то це, безперечно, строкате розмаїття персонажів, героїв і лиходіїв із геть різними мотивами, мріями та цілями, здатних перекувати країну за власним образом. Який воєначальник міг би назвати себе далекогляднішим за Вільну Територію? Боротьба за анархізм не конче мала лишитися мрією. Існує світ, де Сіуда та його фракція перемогли; світ, де анархізмові нарешті дозволили показати себе; світ, де одного дня всі люди можуть стати вільними; світ без Івана Ґєорґієвіча Стєпанова.\n\nВід бунтівників-лєніністів і монархів-Рюриковичів Стєпанова відрізняє не відсутність бачення чи мети - у цьому він мало чим різниться від самого Сіуди. Можна навіть твердити, що його бачення грандіозніше за Сіудине чи за мрії будь-якого іншого воєначальника роздробленої Росії. Поволі зводячи у Вільній Території приховану ієрархію, що оберталася винятково навколо нього, Стєпанов створив Раду Безпеки - орган, здатний в ім'я територіяльної цілісности скасовувати рішення Генеральної Асамблеї. Тоді Рада Безпеки була безумовною необхідністю, і навіть найпалкіші ідеологи мусили неохоче прийняти її місце у Вільній Території. Та що більше земель поглинала Територія, то частіше люди питали, навіщо Рада досі потрібна.\n\nТо навіщо? Для безпеки Вільної Території - вже ні. Для доведення задуму Стєпанова до кінця - вона була всім, єдиним способом здійснювати контроль. А для Івана Стєпанова все завжди зводилося саме до контролю. Довгі роки він терпляче чекав, доки стане віссю, навколо якої обертатиметься Вільна Територія. Але він чекає вже понад два десятиліття, мирячись із безглуздими примхами людей, чиєї ідеології не розуміє і знати не хоче. Перед Стєпановим не раз поставали нагоди, і він дозволяв їм вислизнути крізь пальці. Тепер, у хаосі анархії, він схопить нагоду, стисне їй горло й ніколи не відпустить."
 TOM_Viktor_Nekrasov: "Віктор Нєкрасов"
 POLITICS_VIKTOR_ASTAFYEV: "Красноярск був державою, заснованою на обіцянках: свободи, величі, добробуту на десятиліття вперед. Де тепер усі ці обіцянки?\n\nТовариш Сіуда теж багато чого обіцяв, коли Чорна Армія ввійшла до Красноярска: визволення, звільнення від пут і рівність для всіх. Певний час - у дні й тижні після падіння вотчини Андрєєва - обіцянок дотримувалися. Чорна Армія вигнала міських гнобителів, а представники Генеральної Асамблеї разом із Соціял-демократичною партією створили місцеву асамблею. Саме в переповненій, занедбаній і затхлій їдальні Сибірського лісотехнічного інституту Віктор Пєтровіч Астаф'єв уперше скуштував анархізму. Посланці, що допомагали перебудовувати міський устрій, добре підготували такого поміркованого демократа, як Астаф'єв, до нового життя, що чекало на нього та інших містян. Ставши комунним лідером, Астаф'єв не раз зустрічався із Сіудою й Таратутою. Тісні зв'язки Віктора із Сіудою та високопоставленими членами Генеральної Асамблеї тільки погіршили його зраду.\n\nКоли Красноярск став штаб-квартирою Чорної Армії, Астаф'єв почав питати себе, чи це справді анархізм. Його прохання розширити цивільне самоврядування лишилися непочутими: Кільчічаков надсилав квоти, Мішурєнко оселився в місті разом із численним почтом солдатів, а Стєпанов раз у раз накладав вето на місцеві пропозиції.\n\nСіуда насправді нічим не відрізняється від Андрєєва, а Астаф'єв і народ Росії вже ситі порожніми обіцянками. Хоч Сіуда та Генеральна Асамблея не раз просили Красноярск повернутися до їхнього лона, Сіуда не безгрішний. На думку Віктора Нєкрасова, хто водиться з тиранами - сам нічим не кращий, а тиранам не місце у вільній Росії."
 POLITICS_YURIY_KRYLOV_COLLAPSE_DESC: "Юрій Ніколаєвіч Крилов - чоловік, замкнений у казці. Принаймні йому легше бачити своє життя оповіддю, яку хтось розказує, а не долею, яку він проживає. Автор трагедії відвів Юрієві роль головного героя, князя над неспокійною землею.\n\nКолись давно, у далекій-далекій країні жив маленький хлопчик. Він був шляхетного роду, але мешкав серед підданих квітучого королівства. Одного дня, коли хлопчик читав біля річки, до його королівства прийшов злий чаклун і зачарував усіх навколо, перетворивши їх на рабів, невтомних слуг свого господаря. На королівську родину чари не подіяли. Король і його гвардія відважно билися з чаклуном, та чаклун і його лицар здолали королівство, полонили короля, а сестра героя загинула в бою.\n\nПіддані захистили Юрія від сил чаклуна, і він узяв нове ім'я, зрікшись титулів. Та герой невтомно працював заради добробуту свого народу й підривав маріонеткову адміністрацію чаклуна. Якийсь час імперія чаклуна здавалася непереможною, аж доки між ним і лицарем не стався розкол. Лицар почав утверджувати себе як гегемона краю, усіма засобами виборюючи власне королівство. Жорстокість лицаря і згасання впливу чаклуна дали нагоду завдати удару, як і провіщало пророцтво.\n\nГерой, узявши ім'я та титул короля Рюрика III, згуртував найвідданіших прихильників, щоб звільнитися від чар чаклуна й знову жити вільно. Поки герой пророцтва відновлює сили, божевільний генерал із півдня продовжує набіги. Казка короля Рюрика III ще далека від завершення. Невдовзі почнеться пророча битва, і народ нарешті житиме...\n\n§G...довго й щасливо.§!"
 POLITICS_VASILY_SHUKSHIN_COLLAPSE_DESC: "Чи є місце консервативному підприємцеві в Росії? За імперії його молоде підприємство придушила б відсталість царя. За Союзу в нього в кращому разі конфіскували б майно, а в гіршому - ще й життя. А тепер, у добу російської анархії, де місце консервативному підприємцеві?\n\nПопри образу на Покришкіна й безсоромних клептократів федерації, падіння Новосібірска і, що важливіше для нього, Барнаула занурили Шукшина в тяжку депресію. Хаос і плутанина перших днів та тижнів після капітуляції федерації розвіяли по світу найкращих і найздібніших людей Росії. Покришкін зник безвісти й вважався мертвим. Керівників мегакорпорацій стратили або ув'язнили. Від капіталістичного істеблішменту лишився сам Васілій Макаровіч Шукшин. Популярність серед містян урятувала його від кари, але він був змушений жити самітником і проводив дні, пиячачи на самоті вдома. Людина справді падає найнижче, коли її відкидає більшість, а під тиранією Генеральної Асамблеї більшість ніколи не була такою могутньою, а Шукшин - таким слабким. Так тривало, доки одного дня Шукшин не отримав листа.\n\nКолишній високопоставлений член міської ради Барнаула писав про дедалі більше невдоволення в місті. Мета листа була очевидною, хоч слова й намагалися її приховати: в анархістському фундаменті з'явилися тріщини, а люди тужили за обіцянкою федерації. Шукшин ожив: до нього повернулися оптимізм і відчуття мети. Розкол анархістського руху доводив одне - анархізм не працює. На відміну від роздрібнених анархістів, Шукшин має справу, і хай йому чорт, якщо анархісти вдруге візьмуть гору."
 POLITICS_VITALY_KOSTIN_COLLAPSE_DESC: "Чи може одна людина змінити світ? Авжеж. Романов, підприємець, учений - люди вищого стану можуть гнути світ під свої примхи. А раб? Чи здатен простий робітник розірвати віжки гноблення без Лєніна? Віталій Сємьоновіч Костін не знає і, правду кажучи, сподівався ніколи не мусити дізнаватися.\n\nЗвичайний інженер-будівельник із Новосібірска, Костін швидко став одним із найпалкіших прихильників Вільної Території та її визвольного послання. Під час визволення міста він показав себе вправним організатором і промовцем, а його проста популістська програма знайшла відгук у робітників. Організований Костіним страйк мав вирішальне значення в кампанії Вільної Території проти Сибірського Сокола. Коли в Новосібірску створили асамблею, Костін, людина скромного походження, хотів повернутися до простого трудового життя, задоволений тим, що доля Росії в надійних руках товариша Сіуди. Та першим на місто заявив права не Сіуда.\n\nУ тижні після походу одне ім'я звучало дедалі частіше, затьмаривши навіть Покришкіна: Іван Стєпанов. Спочатку це був шепіт, чутки про могутнього поплічника Сіуди, що був силою їхнього дуету. Поголос ширився швидко, але справжню тривогу викликала начебто нескінченна й дедалі більша кількість солдатів Чорної Армії на фабриках і демонстраціях. Суворі квоти, політичні репресії та нестримна корупція змусили багатьох містян чухати потилиці й питати, що змінилося. Відверте гноблення робочого люду стало таким тяжким, що один чоловік мусив вийти з відставки.\n\nЗраджений капіталістами Новосібірска, а потім і анархістами Канска, Костін уособлює серце й душу російського народу: стомлену. Скільки ще повстань потрібно? Скільки разів народові брехатимуть? Костін не знає всіх відповідей, та й загалом знає небагато, але одне йому відомо напевно: гноблення в будь-якій подобі треба викорінювати, навіть якщо воно ховається за черепом і кістками."
 POLITICS_VIKTOR_NEKRASOV_DESC: "Розчарований тиранією голови Яґоди й чужий корпоративним капіталістам Новосібірска, Віктор Платоновіч Нєкрасов найбільше зблизився з Шостаковічем і Гуманістичним салоном Томска. Та навіть там він не міг знайти свого місця серед радикальніших соціял-демократів і поміркованих соціялістів. Нєкрасов почувався загубленим. Його погляди були значно лівіші за більшість гуманістів, але все ще правіші за анархістський рух, що зростав на півдні. Не знайшовши руху, який міг би назвати своїм, Нєкрасов присвятив себе письменству - пристрасті, яку відкрив після переїзду до інтелектуального серця Росії. Він зацікавився журналістикою. Ідеологічна самотність зробила його відлюдником, але дала змогу стати винятковим воєнним кореспондентом, який висвітлював походи воєначальників Центральним Сибіром і далі на схід. Найбільше його увагу привертала Чорна Армія.\n\nЯкщо розширення Вільної Території ще не захопило його цілком, то її очільники, що пройшли вулицями Томска, безсумнівно це зробили. Його погляди не збігалися із сіудизмом у всьому, та після визволення міста він майже не нарікав. Скасування салонної системи дало йому більше голосу, ніж раніше, а неприязнь Території до авторитаризму була безперечно приємною. Проте дні й тижні минали, а конфлікт у Томску наче не вщухав. Анархістські угруповання, віддані різним фракціям і філософіям, відкрито билися на вулицях, через що дедалі більші загони Чорної Армії мусили патрулювати місто.\n\nРазом із загостренням конфлікту розкол зростав і в самому Нєкрасові. Якби історія тривала, якби вчені й писарі ще могли знайти роботу в жорстоку добу утилітаризму, похід на Томск увійшов би до літописів як найвизначніший робітничий страйк покоління, і Віктор Нєкрасов не опинився б там, де був. Та доля часто безжальна, а люди з найкращими намірами нерідко стають на хибний бік історії."
 
