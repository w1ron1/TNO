 SBA_intro_mother_anarchys_eldest_sons_desc: "Сибірська Чорна Армія, народжена кілька років тому після розпаду імперії Яґоди, стала прапороносцем анархістської ідеології. Поза увагою світу за нашими кордонами ми процвітаємо на власній землі. Створену нами Вільну Територію засновано на мілітаризованому анархізмі, основи якого заклали перші прихильники Чорної Армії. Та попереду ще довгий шлях, повний перешкод і можливостей, перш ніж ми поширимо наше вчення й визволимо сусідів.\n\nМи маємо розвивати комуни, не позбавляючи їх прав у бездержавному суспільстві. Так само треба зміцнити Чорну Армію, головну силу їхнього захисту, щоб Вільна Територія не лишилася безборонною перед небезпекою. Якщо все піде за планом, невдовзі ми будемо готові зустріти майбутнє."
 SBA_intro_assemble_the_communal_representatives_desc: "Генеральна Асамблея Сибірської Чорної Армії постала в перші роки нашого існування для координації політики між усіма визволеними анархістськими комунами. Її регулярно скликають для розв'язання повсякденних, але важливих для безперебійної роботи Вільної Території справ.\n\nМи досі виживаємо в цьому хаотичному й нестабільному оточенні значною мірою тому, що бережемо ідеали анархії й водночас не втрачаємо пильности. Щоб так було й надалі, нам потрібна внутрішня співпраця, а Генеральна Асамблея дає чудову нагоду відкрито й прозоро обговорювати справи наших земель."
 SBA_intro_assemble_the_security_council_desc: "Хоч Сибірська Чорна Армія найпалкіше обстоює справжню свободу російського народу, було б брехнею заперечувати потребу в організованому збройному захисті за нинішніх обставин. Тому ми прийняли систему мілітаризованого анархізму, яку наш народ встиг полюбити. Її ключовим органом є Рада Безпеки, утворена з провідних командирів усіх організованих сил міліції, відданих Чорній Армії. Усіх цих командирів обирають самі солдати, тож вони справді представляють їхні голоси й інтереси. Чергове засідання Ради Безпеки допоможе порушити й розв'язати всі останні питання безпеки."
 SBA_intro_the_third_congress_of_tulun_desc: "Канск лежить у Сибіру, на ключовому шляху між Далеким Сходом і рештою країни, та став найкращим доказом успіху нашого анархістського експерименту. У будівлях, звідки колись правили маріонетки Республіки, зародилася традиція Канського Конгресу. Раз на кілька років там збираються представники всіх земель Чорної Армії.\n\nОбговорювати доведеться безліч питань, часто життєво важливих для самих основ Вільної Території. Делегати представлять стан Чорної Армії й поступ у побудові бездержавного суспільства в Центральному Сибіру. Так ми зможемо оцінити здобутки від дня нашого заснування."
 SBA_intro_present_elected_officer_candidates_desc: "Ще одна горда традиція Сибірської Чорної Армії, успадкована від первісної Махновщини й усіх справжніх анархістів, - демократичні вибори офіцерів. Замість сліпого підкорення традиційній самовладній системі командування кожного командира Армії, створеної народом для захисту народу, обирають демократично. За це відповідають Солдатські Асамблеї, і будь-якого офіцера можна відкликати будь-коли. За роки існування ми вдосконалили цей процес так, що завдяки виборові війська нагору піднімаються здібні люди.\n\nПід час Третього Канського Конгресу треба показати стан війська та його керівників. Обрані Солдатськими Асамблеями офіцери постануть перед Конгресом, щоб їх представили комунним делегатам і вони долучилися до обговорення інших справ."
 SBA_intro_present_revolutionary_security_reports_desc: "Армія Вільної Території є основою захисту наших визволених земель: без неї ми б не розірвали кайданів і досі жили під владою тоталітарної імперії Яґоди або «демократичної» держави Центрального Сибіру. Та узгодити роботу й дії всіх підрозділів неймовірно складно. Саме тому потрібні «звіти безпеки», які описують місцеву ситуацію, допомагають спільно усувати загрози комунами й обороняти їх. На Третьому Канському Конгресі ці звіти покажуть загальну картину в Центральному Сибіру та її вплив на анархістські комуни. У хаосі російської влади воєначальників єдність перед загрозами має величезне значення."
 SBA_intro_present_local_developmental_reports_desc: "Щоб показати численним комунним делегатам Канського Конгресу успіх нашого експерименту, треба представити результати проєктів і самоврядування в усіх поселеннях. Безперечно, кожне село й місто тією чи іншою мірою отримало допомогу - не від державної влади, а завдяки принципам анархії, які дали місцевим змогу вільно розвивати рідний край. Експерти мають представити Конгресові свої висновки та звіти про розвиток громад. Це водночас переконає найупертіших делегатів у дієвості нашої системи."
 SBA_intro_riding_on_desc: "Сибірська Чорна Армія, створена серед моря хаосу й авторитаризму, має лишатися островом стабільности та справжньої свободи. Сусідні режими воєначальників стали хрестоматійними прикладами того, ким ми не хочемо бути, тому ми відмежовуємося від них і йдемо за анархістською мрією. Волею та рішучістю нашого народу ми поволі долаємо давні проблеми й розвиваємо Центральний Сибір заради спільної справи. А оскільки нас чекає війна із сусідами, треба зробити все, щоб Чорна Армія вийшла з неї переможницею."
 
