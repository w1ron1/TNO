 SBA_anarchist_refuge_desc: "Наш клаптик землі - одне з небагатьох місць на цій злиденній Землі, де ідеали анархізму можуть розквітати без загрози ревізіоністів чи контрреволюціонерів. Та нашій маленькій комуні, хоч би якою завзятою вона була, потрібен не лише революційний дух; їй потрібні мета та єдність напрямку, інакше наш експеримент розвалиться."
