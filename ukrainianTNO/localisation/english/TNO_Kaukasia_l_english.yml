 ### Leader Descriptions ###
 POLITICS_REICHSKOMMISSAR_JOSIAS_DESC:0 "Йозіас, спадковий принц Вальдек-Пірмонта виріс у владі та знаті, але був безсилий зупинити позбавлення своєї родини шляхетських титулів і привілеїв після проголошення Німецької Республіки. Він приєднався до Нацистської партії наприкінці 1920-х років, швидко влився в ряди СС і поступово піднімався кар'єрними сходами. Йозіас здобув репутацію педантичного та відданого букві закону, навіть ініціювавши справу проти коменданта табору Бухенвальд Карла-Отто Коха за розкрадання коштів. До закінчення Західно-російської війни Йозіас займав комфортну посаду верховного комісара поліції СС у Вартеланді, залишаючись поза підозрою щодо провального перевороту Гіммлера. Щоб зберегти бездоганну репутацію, виконуючи обов’язки спостерігача Гіммлера на східних околицях рейху, вони з Гіммлером інсценували розрив, кульмінацією якого стало публічне зречення Йозіасом СС і знищення членського квитка.\n\nКоли стало відомо, що Рейхскомісаріат Кавказу переповнений партизанами й потребує нового рейхскомісара, Йозіас легко переконав фюрера призначити його завдяки бездоганній роботі та чудовій репутації. Але менш ніж за тиждень після прибуття до Тифлісу Йозіаса захопила група партизанів Закавказького радянського руху, які три дні жорстоко його катували. Він запам'ятав кожен момент болю і кожне обличчя, що спостерігало. Після звільнення Йозіас реалізував план 'умиротворення'. Магістралі та міста були укріплені, місцеве населення переселено примусово, а непокірні регіони безжально бомбили. Він також почав наповнювати адміністрацію та гарнізони вірними членами СС, потай повернувшись до організації (хоча вважає образою, що його оригінальний номер члена не був відновлений). Йозіас досі надсилає квоти ресурсів до Германії, щоб уникнути скарг, але є ті, хто вірить, що він насправді отримує накази від Нанцига."

 POLITICS_KAISER_JOSIAS_DESC:0 "Йозіас, спадковий принц Вальдек-Пірмонта, опинився абсолютно самотнім. Він розірвав зв’язки з СС після того, як відчув себе ображеним Гіммлером, відмовився підтримати будь-кого з так званих фюрерів, які гризлися між собою в рейху, відчужив промисловців через спроби все більше і більше обкладати податками їхні шахти та нафтопереробні заводи, і прокляті місцеві жителі ніколи не прийняли б іноземця як правителя їхніх земель. У Йозіаса залишалося лише одне: звернутися до своєї шляхетної спадщини.\n\n Ідея була відкинута як божевілля як його родиною, так і найближчими радниками. Абсолютна монархія у ХХ столітті? Що за абсурдна фантазія! Але для Йозіаса здавалося, що інших варіантів було небагато. Монархи могли керувати багатонаціональними державами легше, ніж військові диктатори, не кажучи вже про нацистів. Зрештою, чи не вдалося Габсбургам утримати космополітичну імперію в самому серці Європи протягом п’ятисот років? І тому він наказав це зробити. Було виготовлено корону, призначено дату, обрано собор, знайдено єпископа, і велика частина бюрократії та військових, які виступали проти цього, була тихо очищена з уряду.\n\n Тепер офіційний титул рейхскомісара — Його Величність Йозіас I, король Кавказу, захисник Кубані та принц Вальдек-Пірмонта. Він носить пишні уніформи, проводить аудієнції у своєму палаці в Катеринодарі та вислуховує клопотання регіональних губернаторів, які повинні вклонитися перед його троном. Хоча дехто називає це божевіллям, у цьому є метод: він сприймає свої обов’язки як монарх так само серйозно, як і обов’язки нациста, і, здається, він не має наміру послаблювати гноблення місцевих жителів."

 POLITICS_PAUL_PLEIGER_DESC:0 "Хоча рейхскомісаріат Кавказу міг бути створений як спосіб перевірити обмежену автономію для співпрацюючих меншин, його існування завжди було спрямоване на одну мету: вичавити кожну краплю нафти та видобути кожну унцію дорогоцінних металів із землі. Для досягнення цієї мети вищі ешелони бюрократії рейхскомісаріату були заповнені магнатами гірничодобувної промисловості, нафтовими баронами та іншими промисловцями, які мали особистий інтерес у максимізації операцій. Безперечним лідером цієї корпоративної кліки є Пауль Плейгер, який раніше керував престижними промисловими операціями, такими як Reichswerke Hermann Göring.\n\n Хоча Плейгер і його колеги були задоволені тим, щоб залишатися в тіні, поки рейхскомісари тримали місцевих під контролем, нещодавні... ексцентричності Йозіаса переконали його, що потрібно вживати заходів, щоб зберегти основну місію рейхскомісаріату. Тепер, коли більш холоднокровні голови взяли верх, Плейгер сподівається, що він і його колеги-промисловці зможуть зберегти стабільність, підтримувати потік нафти до Батьківщини та забезпечити прибутковість своїх численних інвестицій до кінця свого життя. Плейгер також має багаторічний досвід експропріації майна на звільнених територіях, і багато хто як у Катеринодарі, так і в Германії впевнені, що він може впоратися з цією набридливою проблемою місцевого населення, яку навіть жорстокість Йозіаса не змогла розв'язати. Усе, що йому потрібно, це кілька років стабільності та стабільного фінансування, наполягає він, і все увійде в щасливий статус-кво, який вигідний усім (і їхнім портфелям)."
 
