 ### Ideas ###
 CAU_bergbaureich:0 "Шахтарський Рай"
 CAU_bergbaureich_desc:0 "Кавказ відомий не своїми землями, а тим, що знаходиться під ними. Земля щедро дарує нескінченні річки нафти та тони металів і мінералів, якими німецькі окупанти користуються глибоко та жадібно."
 CAU_shipments_to_ger:0 "Поставки до Рейху"
 CAU_shipments_to_ger_desc:0 "Хоча Україна може бути житницею Рейху, Кавказ є його бензобаком. Його нафтова промисловість існує виключно для задоволення потреб Рейху та працює за наказами з Германії, тому цілком природно, що все, що вона видобуває із землі, надсилається до Рейху, щоб ті використовували це на власний розсуд."
 CAU_stratified:0 "Стратифіковане суспільство"
 CAU_stratified_desc:0 "У рейхскомісаріаті склалася своєрідна ієрархія. На самому низу знаходяться \"три ненависні шкідники\" – грузини, вірмени та черкеси, яких німці зневажають за їхню постійну бунтівливість. Вище розташовуються інші етнічні меншини, трохи менш зневажувані. Потім ідуть німецькі кваліфіковані робітники та їхні сім’ї, а на вершині сидять бюрократія та армія, які повністю контролюються людьми Йозіаса."
 CAU_german_investments:0 "Німецькі інвестиції"
 CAU_german_investments_desc:0 "Нафта повинна текти, як кажуть у народі, а Кавказ має її вдосталь. Колись занедбана через холодне ставлення Йозіаса до Рейху, тепер барони з радістю приймають спеціалістів з Батьківщини, щоб підвищити продуктивність до висот, яких ніколи раніше не бачили!"
 
 ### Skeleton events

 cau.10002.t:0 "Королівське питання"
 cau.10002.desc:0 "Чи повинен Йозіас стати божевільним монархом на якомусь етапі?"
 cau.10002.a:0 "Ні"
 cau.10002.b:0 "Так"

 cau.10003.t:0 "Змова промисловців"
 cau.10003.desc:0 "Йозіаса скинуть промисловці за те, що він повний божевільний."
 cau.10003.a:0 "Ні, він нормальний"
 cau.10003.b:0 "Геть Йозіаса!"

 cau.10004.t:0 "Кайзер Йозіас!"
 cau.10004.desc:0 "Цей божевільний справді зробив це, він коронував себе кайзером Кавказії!"
 cau.10004.a:0 "Боже, бережи кайзера Йозіаса!"

 cau.10005.t:0 "Вибір промисловців"
 cau.10005.desc:0 "Почалася громадянська війна в Німеччині, і перед нами постає вибір. Чи підтримати Бормана чи Герінга?"
 cau.10005.a:0 "Ставимо на Бормана!"
 cau.10005.b:0 "Йдемо з Герінгом!"

 #EVENTS
 cau.788.t:0 "Загублений легіон?"
 cau.788.desc:0 "Очільник експедиції на Кавказі в Туреччині, розчаровано виглядаючи, оголосив, що знайдене зовсім не є доказом того, що стародавні арійці колонізували Європу. Натомість після знаходження численних римських артефактів вони заявили, що, можливо, виявили місцезнаходження загубленого римського легіону Legio IX - Hispania.\n\nЦе викликало великий інтерес у міжнародної спільноти, особливо після того, як кавказці підтвердили свої знахідки, показавши кадри з розкопками стародавніх щитів, шматків броні, зброї та кількох скелетів. Однак кавказці зазнали приниження в очах міжнародної спільноти, і експедиція втратила колишній ентузіазм. Вже надходять повідомлення, що розгніваний Йозіас, ймовірно, припинить розкопки."
 cau.788.a:0 "Вони знайшли щось цікаве, і така реакція!?"

 cau.789.t:0 "Стародавній поклик"
 cau.789.desc:0 "Обергруппенфюрер Бадер, керівник нашої зараз провальної експедиції в Туреччині, надіслав дивні новини. Він повідомляє, що археологи та їхні охоронці переживають дивні кошмари та сни, а деякі з них мають симптоми, схожі на променеву хворобу. Вони вже придбали радіаційні костюми, але їхні дозиметри досі не зафіксували жодного радіаційного зараження. Натомість вони повідомляють про щось набагато дивніше.\n\nБадер стверджує, що під час звичайних радіоперевірок вони виявили дивний шум на одній із невикористовуваних частот. Після подальшого розслідування вони виявили, що це, мабуть, якийсь сигнал або сила, як називає це Бадер, що виходить із місця розкопок. Бадер вже почав дослідження без дозволу, але *попросив* дозволу на створення антени для цієї дивної сили. Він вважає, що за умови належного фінансування та, звісно, нашої підтримки, він може зосередити цю енергію в одній точці.\n\nЕкспедиція починає виходити з-під контролю, але хто знає, яке відкриття нас чекає?"
 cau.789.a:0 "Він має наше благословення, результати точно будуть цікавими."
 cau.789.b:0 "Закрити експедицію, це вже стало марною витратою."

 cau.790.t:0 "Непрохані гості"
 cau.790.desc:0 "Розкопки на Кавказі були суперечливими і привернули постійні гарнізони протестувальників, журналістів і місцевої поліції, які спостерігали за все більшими групами солдатів і вчених, відправлених кавказцями для вивчення їхніх знахідок. Найдивнішим відкриттям була антена, встановлена в центрі місця розкопок, яка викликала безліч запитань, на які міжнародна спільнота не змогла знайти відповіді.\n\nІ тепер усе зникло.\n\nНа записах видно, як кавказці зібралися навколо антени, і один чоловік натиснув перемикач. Спочатку нічого незвичайного не відбувалося, більшість кавказців навіть здавалися нудьгуючими.\n\nПотім пролунала громова буря. Небо потемніло, сонце почало сідати, хоч була середина дня, і вся експедиція зникла.\n\nНад кратером залишився сяючий, закручений вихор енергії, і з нього виринули... римляни. Як легіони стародавнього Риму, сотні солдатів вийшли з вихору, озброєні, як не дивно, кулеметами, гвинтівками, танками та іншими озброєннями. Скоро пролунали постріли: ці дивні гості відкрили вогонь по членах експедиції, які залишилися, а потім і по цивільних, які ще не втекли.\n\nПовідомляють, що турецька армія вже вступила в бій, і зазнає поразки."
 cau.790.a:0 "Що?!"
