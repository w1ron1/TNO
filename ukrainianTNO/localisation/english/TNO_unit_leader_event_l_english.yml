l_english:
 unit_leader_events.1.t:0 "[From.GetName] Захворів"
 unit_leader_events.1.d:0 "Схоже, на службі [From.GetHerHis] [From.From.GetNameDef] [From.GetRank] [From.GetName] зайшов [From.GetHerselfHimself] надто далеко. Через несприятливий клімат у районі [From.GetHerHis] операцій [From.GetRank] тепер захворів і, ймовірно, потребуватиме певного часу на відновлення. Поки [From.GetSheHe] не одужає, [From.GetSheHe] не працюватиме на [From.GetHerHis] звичному рівні."
 unit_leader_events.1.a:0 "Шкода"
 unit_leader_events.2.t:0 "[From.GetName] Поранений"
 unit_leader_events.2.d:0 "Схоже, під час успішного завершення битви [From.GetRank] [From.GetName] піддав [From.GetHerselfHimself] дещо надмірному ризику, ведучи [From.GetHerHis] людей. [From.GetSheHeCap] був поранений, і, ймовірно, знадобиться певний час, щоб рани повністю загоїлися, а до того часу [From.GetRank] не працюватиме на [From.GetHerHis] звичному рівні."
 unit_leader_events.2.a:0 "Шкода"
 
 operative_events.1.t:0 "Агента захоплено"
 operative_events.1.desc:0 "Під час виконання завдання в тилу ворога [This.GetName] був схоплений ворожою контррозвідкою [From.From.GetAdjective]. Повідомлення з інших джерел свідчать, що [This.GetSheHe] утримується у віддаленому місці для допиту. Хоча ми вважаємо, що [This.GetSheHe] намагатиметься якомога довше чинити опір допиту, цілком імовірно, що ворог зрештою отримає цінну розвідувальну інформацію, якщо [This.GetSheHe] не буде врятований або вбитий до того, як [This.GetSheHe] зламається."
 operative_events.1.a:0 "Ми повинні провести операцію з порятунку!"
 operative_events.2.t:0 "Агент змушений переховуватися"
 operative_events.2.desc:0 "Під час виконання завдання у [From.From.GetNameDef] [This.GetName], очевидно, був виявлений контррозвідкою [From.From.GetAdjective]. В останньому повідомленні, яке [This.GetSheHe] надіслав, йшлося про те, що [This.GetSheHe] помітив ворожий нагляд за [This.GetHerHim] і що [This.GetSheHe] збирається виконати процедури ухилення та втечі.\n\nУ рамках цих процедур [This.GetName], природно, перервав зв'язок зі своїми кураторами, щоб не поставити під загрозу їх або інших осіб.\n\nЯкщо все мине успішно, [This.GetName] зв'яжеться з нами знову за кілька тижнів."
 operative_events.2.a:0 "Нам нічого не залишається, крім як чекати й сподіватися."
 operative_events.3.t:0 "Агента вбито"
 operative_events.3.desc:0 "Схоже, [This.GetName], один із наших агентів, відряджених до [From.From.GetNameDef], приніс найвищу жертву та загинув під час виконання службових обов'язків. Повідомлення від джерел у [From.From.GetAdjective], природно, мізерні, але, схоже, за [This.GetName] стежила контррозвідка [From.From.GetAdjective]. Схоже, [This.GetSheHe], ймовірно, мав бути схоплений і або обрав смерть, щоб уникнути розголошення життєво важливої інформації під час допиту, або був убитий агентами [From.From.GetAdjective], чинячи опір арешту."
 operative_events.3.a:0 "Герой, покликаний до [This.GetHerHis] останнього спочинку."
 operative_events.4.t:0 "Агента поранено"
 operative_events.4.desc:0 "Після близького зіткнення з контррозвідкою [From.From.GetAdjective] [This.GetName] повідомив, що на деякий час вибуде з ладу, щоб подбати про поранення, яких [This.GetSheHe] зазнав під час спроби відбитися від спроби затримати [This.GetHerHim].\n\n[This.GetName] тепер перебуває в безпечному місці, де доглядає за [This.GetHerHis] ранами, і буде недоступний протягом кількох тижнів, поки [This.GetSheHe] одужує."
 operative_events.4.a:0 "[This.GetSheHe] невдовзі повернеться до боротьби."
 operative_events.5.t:0 "Ворожий агент завербований"
 operative_events.5.desc:0 "Наша контррозвідка досягла значного успіху: після тривалого допиту та ознайомлення з імовірною долею [This.GetHerHis] у разі звинувачення у шпигунстві захоплений агент [From.From.GetAdjective] [This.GetName] погодився співпрацювати з нами в обмін на повну амністію за [This.GetHerHis] злочини проти держави.\n\nЗавдяки [This.GetHerHis] глибоким знанням внутрішньої роботи розвідувальних служб [From.From.GetAdjective] [This.GetSheHe], без сумніву, значно легше проникатиме до [From.From.GetNameDef] і залишатиметься непоміченим контррозвідкою [From.From.GetAdjective]."
 operative_events.5.a:0 "Але ми очікували, що [This.GetHerHim] буде вбито?"
 operative_events.6.t:0 "Агента [From.GetAdjective] захоплено!"
 operative_events.6.desc:0 "[This.GetName] був схоплений під час спроби проникнути до нашої адміністрації та передати секретну інформацію назад своїм керівникам. Під час допиту [This.GetSheHe] розкрив [This.GetHerselfHimself] як іноземного агента [From.GetAgency], що діяв на території [From.From.GetAdjective]. Досі невідомо, якою саме є зацікавленість [From.GetAdjective] у нашій державі або які частини нашої адміністрації вже стали відомі [From.GetAdjective] розвідці. Оскільки [This.GetName] ув'язнений і очікує подальшого допиту, нам залишається лише сподіватися, що зрештою [This.GetSheHe] розкриє все, що відомо про операції [From.GetAdjective] у [From.From.GetNameDef]."
 operative_events.6.a:0 "Ми знаємо, як змусити тебе говорити."