admin_title_textbox_mapmode_tt: "Клацніть §Gлівою кнопкою миші§! аби обрати цей стейт для порівняння в режимі §Yадмін. назв§! для мапи\nКлацніть §Gправою кнопкою миші§!, аби обмежити порівняння до інших стейтів в межах однієї країни\n----------\n§YАдміністративна назва§!, або ж скорочено §Yадмін. назва§!, це функція що надає глибокий погляд на обрану адміністративну одиницю(-і) стейту (від одиниць першого до третього рівня). Гравці можуть також порівнювати адмін. назву(-и) стейту з адмін. назвою(-ами) іншого стейту завдяки відповідному режиму мапи.\n\nСистема §Yадмін. назви§! також цілком сумісна з системою §Yендонімів-екзонімів§!, яка може бути доступною через кнопку "§DE§!" поруч із кнопкою огляду армії, справа згори на інтерфейсі гравця."

