admin_title_textbox_mapmode_tt: "§GLeft-Click§! to select this state for comparison in the §YAdmin. Title§! map mode\n§GRight-Click§! to limit comparison to other states within the same country only\n----------\n§YAdministrative Title§!, or §YAdmin. Title§! for short, is a feature that provides an in-depth view on a selected state's administrative division(s) (spanning from first to third-level divisions). Players can also compare a state's Admin. Title(s) with another state's Admin. Title(s) via the corresponding map mode.\n\nThe §YAdmin. Title§! system is also fully compatible with the §YEndonym-Exonym§! system, which can be accessed via the "§DE§!" shaped button beside the Army overview button on the top right of the player interface."

