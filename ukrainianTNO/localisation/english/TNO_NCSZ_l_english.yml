 POLITICS_Neil_Blaney_ULS_desc:0 "Народжений у розпал націоналістичного руху 1922 року, Ніл Блейні присвятив своє життя просуванню ідеалу єдиної католицької Ірландії. Чи то на полях Ольстеру як лейтенант, чи то як наймолодший член Дойлу у 1948 році, Блейні залишався непохитно відданим католицькому націоналізму. Хоча його радикалізм і сільські манери зробили його неприйнятним для міських виборців, що передчасно поклало край його амбіціям стати Тішехом, віддана сільська підтримка Блейні надала йому достатньо політичної ваги, щоб перетворити його на «вічного міністра».\n\nНа жаль для народу того, що колись було Ольстером, портфелем вічного міністра є «Міністерство північних графств», фактичне губернаторство колишньої Північної Ірландії. Створена у вогні катастрофи, яка привела цей район під контроль Дубліна, «Спеціальна зона північних графств» спочатку була тимчасовою адміністративною одиницею, покликаною привести регіон у відповідність до решти острова. Однак у міру того, як інтеграція застоювалася, а німецькі гарнізони, що гарантували стабільність, були відкликані після економічного краху, СППГ перетворилася на бомбу уповільненої дії. Людиною, яку Імон де Валера обрав для її знешкодження, був не хто інший, як Ніл Блейні.\n\nНевдовзі після вступу на посаду міністра північних графств Блейні вирішив покласти край юніоністській проблемі за допомогою методу, якого навчився в Німеччині. За одну ніч СППГ перетворилася на дисципліноване об'єднання різних воєнізованих ополчень, сил ґарди та армійських підрозділів, які Блейні використав, щоб придушити Ольстерський опір та його цивільних прихильників зливою куль. Для своєї республіканської бази Блейні став не ким іншим, як рятівником ірландської єдности. Його успіх у Белфасті, крім того, відродив його інтерес до здобуття найвищої посади в Ірландії."
 
 POLITICS_James_Kelly:0 "Бригадир Джеймс Келлі вступив до Ірландських сил оборони невдовзі після закінчення Другої світової війни, саме тоді, коли почав укорінюватися вплив німецьких військових радників. Завдяки своїм блискучим результатам він був відправлений до Німеччини для подальшого навчання, після чого повернувся до Ірландії та був призначений до військової розвідки в неспокійних північних графствах. Це призначення зблизило його з політичним істеблішментом Фіанна Файл, а через кілька років, після відходу німців, — із Нілом Блейні.\n\nУ міру того як ірландська армія дедалі більше розросталася через діяльність німецьких радників, бажання зберігати низьке безробіття та необхідність підтримувати порядок у північних графствах, Келлі стрімко просувався службовими сходами. До 1960 року він став заступником начальника військової розвідки в північних графствах. Хоча спочатку його вважали одним із офіцерів, які підтримували використання Блейні воєнізованих угруповань, вважаючи, що той діяв за наказами Лемасса, він швидко почав сумніватися щодо Громадянської гвардії. Спочатку він протестував проти їхніх контрпродуктивних методів, але невдовзі почав підозрювати, що з організацією загалом щось не так.\n\nПоки Блейні намагався покласти край його розслідуванню, Келлі та його зв'язки в Абвері самостійно розкрили правду про Р-ІРА. Звільнений невдовзі після арешту, коли з'ясувалося, що він вважав себе таким, що виконував накази уряду, він поспішив відновити свою репутацію, представивши своїм колегам-офіцерам план обезголовлення всіх терористичних організацій та відновлення порядку.\n\nТепер, коли його план увінчався успіхом, Келлі може почати демонтувати візантійську адміністрацію Блейні та замінити її чимось, що більше сприятиме стабільності. Принаймні саме це він сказав Шону Лемассу. Адже хоча він і хотів би дотриматися своїх обіцянок, заявлені Лемассом наміри оприлюднити таємні документи цілком могли б викрити його причетність до першого контакту між ІРА та Блейні. Небажана перспектива несправедливого завершення його військової кар'єри в ганьбі спонукала його домовлятися з колегами-офіцерами, що цілком може погано закінчитися для Ірландії..."
 
 POLITICS_Ian_Paisley:0 "Для Іана Пейслі викриття змови між ірландським урядом та ІРА стало останньою краплею. Він знав, що прогнила папістська структура уряду, непридатна для правління працьовитими протестантськими народами Ольстеру, неминуче гнобитиме істинних слуг Божих. Проте масштаби співпраці адміністрації Блейні з воєнізованими угрупованнями привели його до неконтрольованої люті. Він намагався бути розсудливим, вісімнадцять років намагаючись вести добросовісні переговори, але більше ні, не після того, як дізнався, що його народ тероризували й убивали за згодою папістської влади.\n\nПісля того як хаос охопив північні графства після вбивства Шеймаса Тумі та чистки гарнізону, Пейслі вирішив зробити єдине, що покладе край хаосу: назавжди звільнити Ольстер від його католицької проблеми.\n\nТепер, коли папістська некомпетентність дозволила йому законно взяти під контроль землі, які король Вільгельм звільнив двісті років тому, Пейслі може втілити свій план зі створення величного моноліту протестантизму в Ольстері, який найближчим часом зможе возз'єднатися зі своїми британськими братами.\n\nМаючи повний контроль над Ольстерськими добровольчими силами, Пейслі насамперед має намір захистити свій новий протестантський режим від неминучої реакції півдня, а після цього очистити його від елементів, які він прирік на знищення. Він знає, що це буде нелегко, адже пам'ятає наступ німців у 1944 році, коли воював на стороні, що програла, але заради Бога та Ольстеру він докладе всіх зусиль, щоб не допустити повторення цього."
 
 POLITICS_Seamus_Twomey_ULS_desc:0 "Шеймусу Тумі знадобилося майже три десятиліття, але нарешті його плани здійснюються.\n\nВирісши в нищівній бідності католицького району Белфаста 1920-х років, Тумі вирішив змінити майбутнє Ірландії так, щоб кожен його співвітчизник міг жити без бідности та безробіття.\n\nПершою перешкодою на шляху до цього бачення, з якою зіткнувся молодий націоналіст, було британське правління північними графствами. Він приєднався до ІРА, щоб покласти йому край, але зрештою саме німецькі гармати привели до об'єднаної Ірландії — на жах Тумі. Втікши з тюремного корабля, коли Вермахт увійшов до Белфаста, він узявся відновлювати організацію як антинімецький фронт. Разом із Каталом Ґулдінґом він відродив організацію ІРА та неохоче погодився на нечітко визначений «ірландський марксизм» як офіційну ідеологію групи.\n\nХоча його терористична кампанія з вигнання німецького гарнізону з Північної Ірландії була здебільшого неефективною, остаточний відхід окупантів, значною мірою спричинений Західноросійською війною, приписали Республіканській армії. Зростання популярности було посилене незмінною політикою ірландського політичного істеблішменту щодо співпраці з Німеччиною.\n\nТумі, як і раніше сповнений рішучости звільнити Ірландію від іноземного впливу, потребував достатньо великого арсеналу, щоб це зробити. Саме тоді він вирішив створити свій грандіозний план: перехитрити Блейні й забрати його власну зброю, створивши воєнізовану групу, готову служити його власним цілям. Тим часом Тумі був більш ніж готовий придушувати протестантський юніонізм. Тепер, однак, роки очікування добігли кінця."
 
 POLITICS_Terence_ONeill:0 "Народжений у Лондоні Теренс О'Ніл, син Артура О'Ніла, який мав сумнівну честь стати першим членом парламенту, загиблим у Першій світовій війні, завжди виступав за мир і співпрацю. У молодості він закликав уряд із повагою ставитися до місцевих католицьких ірландців, а пізніше, коли Ольстер став Північними графствами, часто й докладно говорив про жорстокість, якої зазнали протестанти після анексії, водночас відмовляючись схвалювати насильницьке розв'язання цієї особливої ситуації. Для декого він був «колабораціоністом», оскільки роками працював у межах ірландської політичної системи, але при цьому ніколи не поступався своїми принципами.\n\nЗавдяки своєму примирливому ставленню та довірі як серед католиків, так і серед протестантів, Теренс О'Ніл, схоже, є ідеальною людиною для загоєння ран Північних графств."
 
 POLITICS_Sean_MacEoin:0 "Ірландія: знову розділена. Вина за це національне приниження лежить на некомпетентних адміністраціях, які перетворили Сили оборони на притулок для безробітних і віддали своє багатство Німеччині. Настільки тяжка ситуація вимагала людини, здатної стояти над політикою та врятувати країну від громадянської війни, і цією людиною став Шон МакІон.\n\nДля МакІона жалюгідні результати його улюблених збройних сил під час Північної кампанії виявилися надто важкими для сприйняття. Знаючи, що втрата Ольстеру неминуче штовхне Ірландію ще глибше в обійми іноземних держав, МакІон вирішив покласти край нескінченному підпорядкуванню Ейре іноземним державам, здійснивши переворот із рештками Ірландських сил оборони. Тепер, коли він контролює Ірландію — або те, що від неї залишилося, — МакІон має намір лише відновити професіоналізм збройних сил, перш ніж у якийсь момент у майбутньому передати країну обраній владі."
 
 ULS_the_strangest_machine:0 "Найдивніша машина"
 ULS_the_strangest_machine_desc:0 "Ніл Блейні, міністр північних графств, відтворив свій величезний успіх у Донеголі зі створення політичної машини Фіанна Файл, цього разу в Ольстері. Як саме йому це вдалося, залишається загадкою для дублінського уряду, якому він номінально підпорядковується. Хоча його методи, безперечно, сумнівні, ніхто не може поскаржитися, що він не підтримує «закон і порядок»..."
 ULS_rifles_round_every_corner:0 "Гвинтівки на кожному розі"
 ULS_rifles_round_every_corner_desc:0 "Повільне й виснажливе завоювання британського Ольстеру дозволило запланованому створенню таємних допоміжних підрозділів успішно відбутися, на відміну від ситуації в інших частинах Британії. Десятки, якщо не сотні, складів озброєння розкидані по всій території північних графств, забезпечуючи Допоміжні підрозділи достатніми запасами зброї, які з часом перетворилися на протестантські групи опору, відомі під загальною назвою «Ольстерські добровольчі сили»."
 
