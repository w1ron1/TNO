 ## Leader Descs ##
 POLITICS_MOUSSA_TRAORE_DESC: "Мусса Траоре не належить до людей, які мають багато прихильностей, але є три речі, які він особливо цінує. Він гордий мусульманин, друг французів і антикомуніст. Його ополчення також дотримується цих принципів, і саме тому він оголосив про свою опозицію уряду Малі та тому щуру Кейті, а тепер він несе світло проти соціялістичної загрози на південному заході.\n\nНародившись у селі Себету, Траоре з'явився на світ за три роки до війни в Європі й за чотири роки до падіння материка. До шістнадцяти років він уже приєднався до ополчення Кейти. Старші ополченці навчили його справжньої природи ісламу, і Траоре дедалі більше ненавидів прогресивного Кейту в міру свого просування військовими сходами. Він також почав відчувати певні симпатії до французів. Час від часу він з'являвся із сумкою французької зброї, стверджуючи, що здобув її під час вдало проведеного рейду, але його місцеве угруповання різношерстих ополченців краще знало, що він укладав із ними угоди.\n\nІз роками Траоре та його ополчення почали консолідувати владу на північному заході від територій, контрольованих Кейтою, поступово збільшуючи свій вплив, оскільки дедалі більше людей переходили до цього нового уряду в Каєсі. Поки не стало надто пізно, Траоре проголосив ще одну державу Малі, окрему від тієї, яку контролювала Кейта. Тепер гра починається, і Траоре розтрощить соціялістську наволоч, а світло Боже твердо буде на його боці."

