 ### Ideas ###
 KAY_idea_islamic_influences: "Іслямські впливи"
 KAY_idea_islamic_influences_desc: "Експеримент зі світськістю було випробувано, і він провалився. Можливо, це працює для інших, далеких від нас країн, але для Малі це просто неприйнятно. Старі королівства будувалися навколо ісламу, і це зробило їх сильними, тож він так само зробить сильним і сучасне Малі.\n\nУряд Каєса ставить іслам наріжним каменем як суспільного, так і політичного життя, і завдяки цьому він лише сильніший. Коли Малі буде возз'єднано, іслам стане клеєм, що утримуватиме націю разом, міцним фундаментом, на якому можна буде її розбудувати."
 KAY_idea_decentralized_high_command: "Децентралізоване верховне командування"
 KAY_idea_decentralized_high_command_desc: "Уряд Каєса — не якийсь абсолютний режим під владою Траоре, попри те, що можна було б припустити спочатку. Сформовані з волі багатьох невдоволених малійських офіцерів, тепер ці офіцери мають величезний вплив і владу, рівні власним повноваженням Траоре.\n\nОчевидно, що з погляду структури командування та логістики це справжній кошмар: кожен генерал використовує свою незалежність для досягнення власної мети й постійно бореться з колегами за логістичну першість. Якщо уряд має вижити, Траоре доведеться знайти спосіб упорядкувати верховне командування."
 