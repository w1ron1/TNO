 ###DESCRIPTIONS###
 POLITICS_YAMAMOTO_MOICHIRO_DESC: "Для генерал-майора Ямамото Моїчіро Малая мала стати останнім акордом у його славетній, політично плідній, але скривавленій кар'єрі під час японських завоювань Китаю та колишньої Голландської Ост-Індії. Коли після краху переговорів між Марай Хоко́каєм та дедалі більш централізованою Республікою Індонезією спалахнуло малайське повстання, Ямамото перевели з Яви, де він був важливим учасником переговорів щодо індонезійської «незалежности», щоб очолити японське втручання.\n\nПочаткові етапи втручання були успішними: Об'єднаний малайський анти-японський фронт було витіснено з основних населених пунктів більшої частини Малаї, за винятком багатих на ресурси та стратегічно важливих регіонів північного Пераку й Паганґу. Відтоді, однак, останній акорд Ямамото перетворився на болото, що стрімко погіршується, а ворог, який постійно зникає з поля зору, виявився надзвичайно вправним у веденні війни в джунглях. Але на цьому ситуація не закінчується — насправді вона ще гірша, ніж очікувалося.\n\nКоли Республіка Індія, а дехто каже, що й ОВН, почала допомагати широкому фронту анти-японських повстанців, Ямамото вдався до ескалації: на його думку, це був раціональний захід, оскільки населення Малаї виявило надзвичайну стійкість до японських спроб налагодити співпрацю. З цією метою він залучив деяких із початкових архітекторів малайської перемоги, таких як сумнозвісний стратег боротьби з повстанцями Нішіура Сусуму. Однак час працює проти Ямамото, адже його власна відставка вже не за горами — як і набирає обертів ОМАЯФ."

 ##IDEAS##
 SHO_Zaibatsu: "Щедроти Країни висхідного сонця"
 SHO_Zaibatsu_desc: "Положення Шьонану як держави-сателіта Японії призвело до багатьох наслідків як у політичній, так і в економічній сферах, але яскравим прикладом останніх є економічне панування японських конгломератів, відомих як дзайбацу. Бідні малайські робітники дзайбацу працюють у нелюдських умовах довгі години за мізерну або взагалі відсутню платню, фактично створюючи систему рабства. Малая має потенціал засяяти так само яскраво, як зоря Сфери спільного процвітання; усе, що нам потрібно, — раз і назавжди придушити повстання."

 SHO_Dai-nijyugo: "Осередок 25-ї армії"
 SHO_Dai-nijyugo_desc: "25-та — горді захисники Шьонану!\nПринаймні на папері.\nНа практиці 25-та є лише оболонкою колишньої себе: десять років постійних боїв із повстанцями перетворили колись горду армію на недоукомплектоване, недогодоване та погано споряджене військо. Те, що підтримує її існування, — це постачання безпосередньо з Японії та втома її ворогів. Добре це чи погано, але 25-та мусить перемогти, адже ще одна поразка стане останнім цвяхом у її труну."
 SHO_Dai-nijyugo_2: "Осередок 25-ї армії"
 SHO_Dai-nijyugo_2_desc: "25-та — горді захисники Шьонану!\nПринаймні на папері.\nНа практиці 25-та є лише оболонкою колишньої себе: десять років постійних боїв із повстанцями перетворили колись горду армію на недоукомплектоване, недогодоване та погано споряджене військо. Те, що підтримує її існування, — це постачання безпосередньо з Японії та втома її ворогів. Добре це чи погано, але 25-та мусить перемогти, адже ще одна поразка стане останнім цвяхом у її труну."

 SHO_minority: "Розколота мережа колабораціоністів"
 SHO_minority_desc: "Довге десятиліття конфлікту з малайськими повстанцями залишило нашу мережу союзників, яка й без того була розтягнута до межі, ще більш радикалізованою та розірваною на частини. Інформатори, яким ми могли довіряти, стали подвійними агентами, а люди, яких у найкращому разі вважали нейтральними, перетворилися на прихильників повстанців. Не кажучи вже про наших власних «лояльних» колабораціоністів, чиє прагнення до особистої влади видно наскрізь. Попри все це, це все, що в нас є, і саме з цим Ямамото працюватиме — добре це чи погано."

 SHO_Marai_Giyugun_Auxiliaries: "Допоміжні сили Марай Ґіюґун"
 SHO_Marai_Giyugun_Auxiliaries_desc: "Місцеві ополченці, прихильники нашого режиму та паназіятизму, досі існують по всій Малаї, борючись проти збочених повстанців та їхніх західних господарів. В ідеальній ситуації їхню службу винагороджували б кивком голови — і не набагато більше, — але жалюгідний стан 25-ї армії означає, що будь-яка цілком дієздатна людина, здатна взяти зброю та битися, більш ніж вітається."
 SHO_Marai_Giyugun_Auxiliaries_2: "Допоміжні сили Марай Ґіюґун"
 SHO_Marai_Giyugun_Auxiliaries_2_desc: "Місцеві ополченці, прихильники нашого режиму та паназіятизму, досі існують по всій Малаї, борючись проти збочених повстанців та їхніх західних господарів. В ідеальній ситуації їхню службу винагороджували б кивком голови — і не набагато більше, — але жалюгідний стан 25-ї армії означає, що будь-яка цілком дієздатна людина, здатна взяти зброю та битися, більш ніж вітається."

 
 ###LEADER DESCRIPTIONS###
 ####EVENTS####
 sho.0.t: "Шьонан — Світло Півдня"
 sho.0.d: "Малая та Сінґапур стали одними з кладовищ колишньої Британської імперії. Повна поразка та капітуляція її гарнізону Співдружності в лютому 1942 року, хоча й нищівна для морального духу, не стала останнім ударом для імперії. Відтоді колишня колонія опинилася під владою японців та їхніх колабораціоністів.\n\nТепер освіта проводилася Ніппон-ґо. Було запроваджено шанування Імператора та масові святкування річниць за імперським календарем. Місцева економіка була висушена до краплі для підтримки японських зусиль. Щоб завершити це «відродження», Сінґапур перейменували на Шьонан — Світло Півдня.\n\nУ Малаї султанати залишили недоторканими та надали їм достатньо автономії, щоб вони були задоволені, але Перліс, Кедах, Келантан і Теренґану передали Таїланду. Невдовзі хвиля японських бізнесменів та емігрантів зробила півострів своїм домом.\n\nСтаном на 1962 рік Шьонан залишається важливою частиною ширшої імперії Японії, а його багаті сировинні ресурси живлять населення, що процвітає. Однак під поверхнею невдоволення японцями ніколи не було сильнішим."
 sho.0.a: "Ми — маяк Імператора на екваторі!"

 sho.1.t: "Світло Півдня"
 sho.1.desc: "На папері Сфера, здається, працює як годинник, приносячи процвітання всім азіатам та їхнім союзникам у Тихоокеанському регіоні й об'єднуючи їх у гармонійну мережу під проводом Японії. На відміну від тиранічної тіні Єдінґспакту та лицемірства ОВН, Сфера виконує своє справжнє призначення: розвиток і зростання під японським доброзичливим правлінням — принаймні якщо вони дотримуються японської лінії.\n\nІ все ж вони не можуть її втримати. Філіппінська республіка ледве стримує комуністів, що спускаються з Півночі, та залишки Американської Співдружності на Півдні. Є також вічна проблема Малаї — найсерйозніша загроза з усіх, якщо ОМАЯФ зможе дістатися Шьонан-то.\n\nТелефон Іно нарешті дзвонить, і він сумлінно відповідає на нього, відвертаючись від вікон свого кабінету, з яких відкривається вид на жваву діяльність на вулицях Токіо.\n\n«Ми втримали міста, але джунглі палають — Таїланд теж не допомагає, вони ледве можуть дістатися кордону, не зазнаючи нападів власних партизанів». Голос Ямамото, низький і хрипкий, долинув із слухавки, і Іно на мить замислився над ситуацією.\n\nМалая давно стала величезною ямою для грошей, а повторні провали 25-ї армії постійно виснажують ресурси, як це було з республікою Юло. Тріщинам у Сфері дозволяли існувати надто довго. Час нагадати опортуністам, чому Висхідне сонце сяє яскравіше на Сході, почавши зі збитого зі шляху Світла Півдня."
 sho.1.a: "«Забезпечити безпеку Шьонан-то — будь-якою ціною»."

 sho.2.t: "Проблема логістики"
 sho.2.desc: "Адмірал Томас Г. Мурер та штаб планування Командування Індійського океану втомлено розглядали карту, розкладену на столі, з лініями та кордонами, що окреслювали держави Південно-Східної Азії — від величезного Індонезійського архіпелагу до джунглів Індокитаю. Проте цього разу всі погляди були зосереджені на Малаї та завданні постачання повстанців на півострові.\n\n«Якщо повстанці не зможуть захопити порт, ми багато чого не зробимо», — прямо заявив один із лейтенантів.\n\n«Дякую, офіцере, що вказали на очевидне», — огризнувся один із командирів, — «але ми не займаємося неможливими речами».\n\n«У нас є «Перч», старий «Балао», переобладнаний для транспортних завдань і доступний для використання. Можливо, ми також зможемо викрасти «Сіліона» з Атлантики», — відповів інший офіцер. «Це буде небагато, але краще, ніж нічого».\n\n«Цейлон?» — припустив третій, вказуючи на карту. «Доступ до бази в Трінкомалі був би величезною допомогою для нашої здатності дістатися Південно-Східної Азії».\n\n«Це доведеться узгоджувати з Державним департаментом», — відповів командир. «Не розраховуйте на це».\n\n«А як щодо МАК, Командування повітряних перевезень? Ми можемо спробувати здійснювати польоти C-130 з острова Кокос і використовувати танкери для дозаправки посеред маршруту».\n\n«Мені доведеться поговорити про це з ВПС», — втрутився Мурер. «Спочатку їм доведеться провести кілька випробувальних польотів, але я погоджуюся з лейтенантом: доки повстанці не зможуть захопити порт...»"
 sho.2.a: "«Наші руки зв'язані»."

 sho.3.t: "Відлуння криків"
 sho.3.desc: "«Як ви знаєте, нам вдалося отримати доступ до порту. Цей прорив тепер дозволяє нам фактично перекинути сюди більше наших американських хлопців». Девіс узяв карту зі столу перед собою та прикріпив її до стіни. «Як бачите, цим маршрутом — суцільна морока, а пройти ним буде ще більшою морокою, але, на жаль, ми мусимо бути якомога обережнішими, щоб уникнути перехоплення Імператорським флотом Японії або щоб Сукарно не встромив свого носа в цю справу».\n\nШирока посмішка розпливлася на обличчі Девіса; він радів тому, що американські солдати нарешті ступлять на землю Азії та кинуть виклик пануванню цих японських імперіалістичних маніяків. «Знаєте, генерале Хафізе, чи так вас звати? Я радий, що ми можемо допомогти вам у цій битві. Японці зруйнували моє власне життя. Ці виродки забрали моїх дітей і мою дружину на Гаваях, вони забрали все, що було мені таке дороге, і просто вирвали це з моїх рук». Посмішка Девіса згасла, а очі наповнилися сльозами. Можливо, він не був із ними того фатального дня, але крики й плач бідолашних Маріси та Джека, коли вони разом із матір'ю, що ридала, зробили свій останній подих, продовжували переслідувати його. Його мозок зрадив його, коли вперше спробував уявити їхню долю.\n\n«У мене була одна дитина, Амін. Він завжди грався в багнюці й завжди був невичерпним джерелом радости. Одного дня, коли ті мерзотники лише вперше увірвалися сюди, він, як завжди, грався в багнюці. Я та моя дружина Халіма намагалися змусити його повернутися всередину, але він відмовився, і коли з'явилися японці, він попросив солдата погратися з ним. Солдат навіть секунди не вагався, перш ніж холоднокровно застрелити його, а я застиг біля вікна, нездатний набратися сміливости протистояти вбивці, дивлячись, як його душа покидає тіло, а кров забарвлює землю».\n\nУ кімнаті запанувала тиша, вільна від звичного бурмотіння солдатів; єдиним звуком було цвірінькання цвіркунів. Там, у приглушеній залі, двоє чоловіків сиділи, обійнявши один одного, і ридали рікою, тримаючи в руках зброю."
 sho.3.a: "Вони помстяться за своїх близьких, навіть якщо це коштуватиме їм власного життя."

 sho.4.t: "Ранок у Вашингтоні"
 sho.4.desc: "Президент був у рідкісному піднесеному настрої, коли сонце сходило над Припливним басейном. Він уперше за довгий час добре виспався. Голдеман передав йому записку з дуже обнадійливими результатами опитувань, що надходили з Огайо. Заголовок у Washington Post проголошував «ОМАЯФ ОГОЛОШУЄ ПЕРЕМОГУ В МАЛАЇ» і супроводжувався дуже гарними світлинами повстанців, які піднімали прапор. Найбільше Ніксону сподобалося саме це. Це були ті вражаючі візуальні образи, які залишаться в головах виборців ще довго після того, як вони забудуть, де розташована Малая і чому вона важлива.\n\nНіксон сперся на колону в Резиденції та відкусив шматок свого сніданку — сир і грейпфрут, политі кетчупом. Він смакував його молочний смак. Навіть Кеннеді не міг зіпсувати йому настрій.\n\nАвжеж, цей шмаркач, мабуть, навіть зараз розмовляв із якимось клятим ліберальним репортером із Boston Globe чи New York Times. Він був певен, що хлопці Сульцберґера намагалися знайти спосіб приписати цю перемогу їхньому золотому хлопчикові, щоб той міг кинути виклик Ніксону в 64-му. Але зрештою Ніксон був Президентом. Саме він вибив японцям око. Саме він поклав край багаторічній боротьбі в Тихоокеанському регіоні та здобув для Америки стратегічного союзника. Усі світлини в газеті були його заслугою. Лише його. Поки Америка продовжуватиме перемагати за кордоном, його переобрання буде легкою справою.\n\nПрезидент постояв ще кілька хвилин, дозволяючи собі уявити всі хороші відгуки в пресі, які він отримає. Він був сповнений рішучости насолоджуватися цією миттю якомога довше."
 sho.4.a: "Ніксон — тепер як ніколи."

 sho.41.t: "Опівночі у Вашингтоні"
 sho.41.desc: "Річард Мілгаус Ніксон сидів на сходах Білого дому, не відриваючи очей від миготливого червоного світла на вершині Вашингтонського монумента — вмикається, вимикається, вмикається, вимикається — і думав про своє політичне майбутнє. Він звик до таких нічних прогулянок щоразу, коли через комутатор надходили погані новини — чи то через ситуацію на Алеутських островах, чи через те, як преса розпікала його через боротьбу за громадянські права. Сьогодні погані новини надійшли зі Східної Азії. Після років періодичних боїв японці оголосили про перемогу над ОМАЯФ у Малаї. На світлинах, які, ймовірно, з'являться наступного дня в Post, були мертві солдати з американською зброєю та виснажене, переможене обличчя Чин Пена.\n\nВмикається, вимикається, вмикається, вимикається.\n\nПрезидент подумав, що це була лише чергова поразка в довгій низці поразок, чергова помилка Ніксона. Будуть статті та передовиці, де Президента розпікатимуть за те, що він дозволив черговому союзникові впасти перед фашизмом, послабив ОВН і дозволив Америці втратити доступ до цінної торгівлі. Буде нескінченний парад тупиць та коментаторів, які питатимуть, чи має він достатньо «витривалости», щоб знову балотуватися в 64-му, — ніби шмаркач Кеннеді впорався б краще. Принаймні Ніксон умів страждати з хоробрим виразом обличчя. Кеннеді не протримався б і місяця на посаді Президента.\n\nЗдавалося, світло на вершині монумента надовго згасло, перш ніж знову спалахнути. Ніксон невпевнено підвівся на ноги.\n\nПровал у Малаї був прикрим, але він його переживе. Буде кілька днів поганої преси, можливо, слухання в Конґресі, а потім громадськість забуде, що Малая взагалі існувала. Виникне якась нова криза, за яку він та хлопці зможуть ухопитися, щось велике й гучне. Все, що йому потрібно було зробити, — знайти нову відволікаючу тему, і він зможе згуртувати навколо себе націю.\n\nНіксон не озирнувся, коли човгав назад до Білого дому."
 sho.41.a: "Вмикається, вимикається, вмикається, вимикається."

 sho.5.t: "Гіркота простої терпимости"
 sho.5.desc: "Уперше в житті Токунда відчув себе... стривоженим? Неспокійним? Приголомшеним? Він не був певен, що саме відчував, але нічого доброго в цьому не було.\n\nКоли оголосили набір добровольців, щоб допомогти силам Шьонану викорінити американських маріонеткових повстанців у Малаї, він був одним із перших, хто відгукнувся. Його нудило від того, що хтось втручався в об'єднавчу місію Сфери спільного процвітання. Надто довго народи Азії розділяли та налаштовували одне проти одного західні чужинці.\n\nУперше, завдяки Імперії та мудрості Імператора, Азія опинилася в руках власних народів. Жодних чужинців, жодних імперіалістів, лише люди, які об'єднуються заради власних інтересів. Як можна не хотіти бути частиною такої єдности? Звісно, він чув про повстанців, дисидентів, але вони були не більше ніж американською та нацистською пропагандою. Деякі люди зроблять що завгодно заради грошей і влади. Принаймні, так він думав.\n\nОсобисто ступити у Світло Півдня виявилося... протверезливим.\n\nТут не було жодної гордої малайської армії, яка чекала на нього. Колабораціоністи були виснажені, їх було менше, ніж він очікував, і вони відчували нестачу постачання. Швидко стало зрозуміло, навіщо їм була потрібна допомога. Проте ще більш тривожним було те, що... у якийсь момент йому здалося, що тут йому не раді — та й колабораціоністам, зрештою, також. Він не відчував, що допомагає своїм азійським братам відтіснити американських імперіалістів.\n\nВін відчував себе чужинцем. Сторонньою людиною. Тим, кого терплять, але не вітають. Здавалося, народ не на їхньому боці. І він не знав чому. Він не міг списати це на американців, хіба що багато хто в Шьонан-то були таємними шпигунами. Але чому вони не зустрічали допомогу Японії з розпростертими обіймами? Це його непокоїло, і він відчував, що це непокоїтиме його ще довго після того, як він зрештою повернеться додому."
 sho.5.a: "Небажані помічники."



 sho.7.t: "Світло на Півдні"
 sho.7.desc: "Шьонан-то — прекрасне місце на світанку над Тихим океаном. Блискучий горизонт торкається землі й сягає вкритого смогом неба, промислове полум'я та вогні нафтопереробних заводів відблискують на боках офісних вікон дзайбацу. Гомін досягає вулиць і вливається до чайних будинків, готелів та фабрик у спотвореній суміші малайської, китайської, японської та залишкової англійської (колишня торгова мова ще не втрачена). Тисячі підприємств відчиняються й чекають, коли щедроти торговельних шляхів прибудуть до їхніх дверей вантажівками та автомобілями, що в'їжджають дорогами, настільки переповненими й занедбаними, що вони стали центром політичних дебатів. Прокидаються й нетрі: кули та робітники нового Світла Півдня, палаюча нафта під палаючою лампою, мають знову кинутися в сліпуче сяйво Коштовності Сфери. Яка різниця, якщо кілька з них не повернуться?\n\nПолітики в Дієті, як завжди, переймаються тисячею проблем, що тягнуть місто вниз: торгова інфраструктура розвалюється через часте використання та періодичні комуністичні диверсії, 18-й рейд на Чин Пена завершився самопроголошеною перемогою без жодного тіла, яке можна було б показати, малайці та індійці продовжують вимагати ширшої автономії для шкіл, що фінансуються самостійно (ігноруючи щедрі пожертви дзайбацу, які зробили їх можливими), і, звісно, султани мають зуб на дратівливо успішне місто у себе за спиною. Над усім цим — японське населення, горде, непохитне й абсолютно нестерпне; а під ним — китайці, безкінечні та багатостраждальні, мов ґарґульї, що підтримують ангелів на стіні собору, який розвалюється.\n\nЦе мир. Певною мірою. Але одне точно: ніщо не триває довго в задусі спеки та блиску нескінченного ринку — і хто може сказати, що принесе наступний ранок, золото чи вогонь?"
 sho.7.a: "Місто, яке не може заснути."

 sho.8.t: "Пожежа в кав'ярні"
 sho.8.desc: "Більшість заворушень тліють задовго до того, як вулиці заповнюються вогнем і сміттям. Вони скручуються у вологих місцях, надто тихих для вух поліції, розкидаючи вусики пліток і підозр із кожним напівпошепки сказаним словом, і саме там гнів перетворюється на ненависть — а потім на насильство. Заворушення виникають задовго до того, як спалахують, задовго до того, як уряд про них дізнається: і саме тут починається бунт у Шьонан-то, біля сирої, просоченої саке кав'ярні на околиці Центрального району, далеко за межами слуху Кемпейтаю та Дієти, у день, який після завершення подій зникне з історії.\n\nУсе починається, як і більшість речей, із розмови, яка триває надто довго, щоб це було комфортно. Її учасники назавжди загублені для історії — можливо, назавжди, адже все суперечливе в Шьонані має властивість замовчуватися заради суспільного блага, — але відомо ось що: серед тих, хто 13 жовтня зібрався в кав'ярні, були японські бізнесмени, китайські державні службовці середнього класу, малайські та індійські крамарі. Усіх їх зібрала плітка про останню хвилю імпортних квот дзайбацу, запроваджених із Токіо, але жоден не мав щодо цього однакової думки. Китайські чиновники були найрізкішими й найгіркішими у своїй критиці: податкове ярмо та надмірна праця були повсюдними, але найсильніше били саме по них. Японські бізнесмени вважали людей у Токіо правими, але такими, що помиляються у своїх цілях; індійці та малайці, звісно, були стурбовані пануванням японських компаній, і хіба безпідставно? Ніхто не міг ігнорувати повільний занепад старих індійсько-малайських економічних володінь на землі, яку дехто досі називав Малаєю.\n\nТри погляди, одна точка розколу, суперечка, що живиться сама собою та зростає до сп'янілих, запальних висот. Згодом власник свідчитиме про бійку в барі, яку вдалося припинити лише поліції, але головні учасники втекли заздалегідь. Один із них пообіцяв, що за тиждень японські володіння запалають по всій Малаї — а потім зник, Кассандра, загублена в гарячому вітрі малайської ночі."
 sho.8.a: "Це погроза, обіцянка чи пророцтво?"

 sho.9.t: "Сухий трут, іскра, сірник"
 sho.9.desc: "Гнів продовжує зростати протягом тижня після інциденту в кав'ярні (який місцева влада швидко замовчує, щоб не спровокувати постійно пильну й вічно дратівливу гарнізонну адміністрацію), просто не в публічних місцях. Кемпейтай значно відступив від своїх жахливих крайнощів, віддаючи перевагу спокійній корупції перед жорстокістю, але вони все ще здатні й небезпечно компетентні, коли доходить до виконання брудної роботи. Шепіт росте, росте й росте до гарячкового напруження, просто поза полем зору, танцюючи, мов світлячки над тихим озером, а потім —\n\n17 жовтня: Sumitomo оголошує про чергову незначну економічну реструктуризацію філії в Шьонан-то, звільняючи кілька десятків працівників для інтеграції нової філії мережі керівників операцій із Токіо. Більшість звільнених — малайці та індійці. Постраждало небагато людей, але для багатьох, хто й без того підозріло ставився до дзайбацу, це стало доказом того, що японці мають намір витіснити місцеві підприємства та викорінити корінну промисловість, назавжди запрягши Малаю до Сфери. Охоронці повідомляють про бійки на фабриці та обурену риторику в етнічних анклавах Східного й Центрального районів, заклики до дій — і до зброї.\n\n19 жовтня: китайського кули знаходять убитим біля готелю. Під час першого повідомлення подробиці нечіткі. Через подальші обставини тіло лише частково оглядають, перш ніж наступні події роблять подальше розслідування неможливим. Серед помітних свідків біля тіла — кілька японських бізнесменів та керівників, кілька поліцейських — і банда китайців із нескінченних нетрів центральної та північної частин міста. Останні поспішно відступають, але не раніше, ніж обіцяють помститися за пролиту кров.\n\n20 жовтня: натовпи китайців, малайців та індійців марширують містом, розпалені страхом і риторикою, що їх оточує. Святкування дня народження Пророка кілька місяців тому пройшло гладко за належного контролю натовпу, але місцева гвардія припускається двох критичних помилок: вони посилають один загін, і кожен член цього загону є японським офіцером."
 sho.9.a: "Зовсім не звучить зловісно."

 sho.10.t: "Палаючий світанок"
 sho.10.desc: "Незрозуміло, що саме спричинило заворушення, зважаючи на подальший хаос, який вони спричинили. Точні обставини загубилися в поліцейських звітах, що згоріли разом з іншими урядовими будівлями. Дехто пізніше висловлював підозри, що Дієта доклала руку до приховування доказів — ці голоси швидко замовкли, законними чи... ну, під доками достатньо місця для тих, хто не бажає грати за правилами гри.\n\nЯсно одне: два натовпи зустрілися на вулиці Рочор, розділені тонкою лінією японських гвардійців. Людей у загоні щойно прислали з казарм, і вони погано розуміли місцеву lingua franca: заїкуватою малайською нічого не вдієш, щоб заспокоїти вже стривожені серця, особливо коли деякі з цих стривожених сердець належать китайцям. Командир загону просить поговорити з очільниками двох демонстрацій, вважаючи, що вони є частиною спільного протесту. За цю помилку його висміюють мовами, яких він не розуміє, поки натовп розростається за межі вулиці, змушуючи місцевих крамарів підкоритися. Дієта, звісно, мовчить. Натовпи не довіряють один одному: малайці та індійці середнього класу бачать у китайцях диверсантів і навіть гірше, китайці зневажають малайців та індійців, яких підняла японська доброзичливість, тоді як самих китайців вона прибила під своїм чоботом.\n\nЗіткнувшись із ситуацією, яку він не може контролювати, командир по радіо просить свою базу про допомогу та підкріплення: саме тут свідчення розходяться. Китайські протестувальники клянуться, що він наказав поліції відкрити по них вогонь. Індійські протестувальники клянуться, що поліції наказали ігнорувати китайців і відтісняти малайців та індійців. Новина поширюється серед усього натовпу в обох варіантах, стаючи дедалі більш запальною в міру того, як набирає швидкости й люті. Обидва натовпи одночасно рушають уперед у відчайдушній спробі випередити атаку, яку вважають неминучою, долаючи тонку синю лінію. Командира більше ніхто ніколи не бачить."
 sho.10.a: "О чорт."

 sho.11.t: "Палаючий день"
 sho.11.desc: "Заворушення лютують на вулицях і поширюються за їхні межі. Чутки — могутня річ, і їх неможливо контролювати; віральність дуже добре переноситься в меметичний дискурс. Погрози, страхи та біль стають небезпечнішими, коли натовпи пробігають повз згуртовані сім'ї, а жага помсти стає відчутнішою з кожним ударом серця. А під усім цим старі образи гниють і розквітають кривавим цвітом. Натовпи та банди сіють хаос на вулицях, барикадують фабрики та руйнують будь-який будинок, який, за словами одного з членів банди, якого пізніше допитали, здається «надто багатим, надто могутнім, надто великим, надто японським».\n\nНасильство породжує насильство, коли гарнізон намагається організувати спільну відповідь після небаченого з часів самого завоювання Малаї рівня насильства. Мешканці відступають до анклавів, беруть до рук іржаві паранґи та багнети й готуються вбивати тих, хто здається загрозою. (Багато селян захищають представників інших етнічних груп у своїх рідних містах — акт тихого непокори, який більш-менш залишається непоміченим усіма іншими.) Лють швидко поширюється на економічну сферу — і на політичну, коли будівлю Управління комісара поліції спалюють дотла разом із багатьма визначними офісами дзайбацу. Дієта метушиться й чекає на відновлення порядку, відкликаючи солдатів із життєво важливих оборонних позицій, щоб захистити себе. Малайські султани однозначно засуджують заворушення майже так само рішуче, як і бездіяльність Дієти. Дієта, можливо, нездатна впоратися навіть із власною територією, але принаймні її можна розворушити до гнівної самооборони: подальша війна слів робить усе управління Шьонану ще жалюгіднішим, поки за скляними вікнами зростає кількість загиблих.\n\nНа знаменитому знімку палаюче місто вкриває обрій та лінію горизонту над ним густою хмарою сажі: репортери припускають, що дим і сажа походять від знищення складу озброєнь біля Кеппела, зруйнованого, щоб не допустити «комуністичних диверсантів» до складу та його пограбування. Жодних доказів проникнення комуністів у демонстрації так і не знаходять."
 sho.11.a: "Закеннайо! Невже ніхто не здатен відновити порядок?"

 sho.12.t: "П. Рамлі випускає «Labu Dan Labi»!"
 sho.12.desc: "«У Куала-Лумпурі спекотний день, але, здається, ніхто не переймається: усі чекають на відкриття кінотеатрів. Кажуть, це його найкраща робота, і навіть якщо так кажуть щоразу, коли він випускає фільм, багато хто все одно з нетерпінням чекає на наступний великий фільм П. Рамлі — »\n\n«— комедійний фільм про двох приятелів став несподіваною інвестицією для японського кінематографіста, але, за словами наших джерел тут, у Центральному районі, з П. Рамлі було приємно працювати, і він виявився підприємливим режисером. Ми вважаємо, що цей несподіваний прецедент лише віщує ще більші перспективи для молодої малайської кіноіндустрії — »\n\n«— сюжет глибший, ніж ви думаєте. Подивіться на фабулу! Отже, Лабу та Лабі працюють на багатого, але впертого чоловіка, так? Вони хочуть бути магістратами, лікарями, але не можуть, фізично обмежені своїми обов'язками перед багатієм. А на кого працює багатій? Правильно, на дзайбацу. Фільм — це одна велика метафора того, що насправді робить Сфера, тримаючи нас у пригніченні, поки — »\n\n«— ну, я думаю, фільм чудовий і все таке, але мені здається, його трохи надто возвеличують. Рамлі — єдина кінозірка, якій японці можуть довіряти, і, безумовно, він є символом єдности, але хіба ви не думаєте, що їх має бути, ну, більше одного? Токенізм працює лише тоді, коли в нас є кілька токенів! — »\n\n«— слухайте, мені байдуже, що ви думаєте, я знаю лише те, що я прихильник Рамлі, перевірений часом, і якщо вам це не подобається, можете стрибнути з доків у Мелаці. У будь-якому разі, нам треба почати відкладати на проїзд автобусом до міста на наступний фільм — »"
 sho.12.a: "Ще один приголомшливий успіх Майстра малайського кіно!"

 sho.13.t: "За маскою"
 sho.13.desc: "Уривок, Marai-Eiga Shimbun, 19XX, XXXXXXXXXX\n\nНатовпи його не знають, чиновники, що усміхаються в офіційній Marai-Negara Filmworks, його не знають, кінопродюсери та кальфактори його не знають. П. Рамлі — це маска, усміхнена данина всім, хто його знає: а за цією маскою — блискуча порожнеча, принаймні з погляду Шьонану. Хто такий П. Рамлі? Відповідь, здається, полягає в тому, що він — ким завгодно, ким його хочуть бачити жителі Малаї: реформістом, усміхненим прихильником істеблішменту, войовничим мусульманином, життєрадісним секуляристом, союзником усіх і справжнім другом нікого. Зрештою, ухиляння — це форма відображення, а хто не хоче побачити себе у відображенні найбільшої кінозірки Малаї? Але хто такий Теку Закарія? Ким він стає, коли П. Рамлі знімає маску й костюм та виходить із-під світла прожекторів?\n\nМи заходимо до його будинку, приємного таунхауса в престижнішому передмісті Куала-Лумпура, і нас зустрічає сильний аромат жасмину: очевидно, Салома, або просто Салма Ісмаїл, як вона любить, щоб її називали, полюбляє запах парфумів, тож Закарія докладає великих зусиль, щоб купувати парфуми. Він усміхається нам і заводить світську розмову про погоду, поки вона метушиться на кухні: попри сім років шлюбу, у подружжя досі немає дітей, що вони обоє пояснюють своєю зайнятою кар'єрою (звісно, вони дуже давно працюють разом на знімальному майданчику в кіно та музиці).\n\nЙого обличчя стає серйозним, коли ми починаємо обговорювати його найвідоміші висловлювання щодо дедалі глибшого расового та економічного розколу в Шьонан-то та міських районах власне Малаї: він згадує своє дитинство в бідній родині та те, як японці врятували його від злиденного життя, відправивши до військово-морської школи, а згодом до Токіо, де почалася його кар'єра. «Якби не японці, я все життя був би бідним!» — сміється він, а потім знову стає серйозним: «То чим я настільки відрізняюся від кулів та голодних людей надворі? Хіба не сказано в словах Пророка, що ми повинні, подібно до Нього, бути милістю для світів?»"
 sho.13.a: "Мудрі слова відомого чоловіка."

 sho.14.t: "П. Рамлі випускає «Рамчонґ до Токіо!»"
 sho.14.desc: "'— о, нічого собі, Рамлі цього разу справді перевершив себе! Я ридала в кінці, але, чорт забирай, невже він не може просто зняти хорошу романтичну стрічку без політичного підтексту — '\n\n'— наш кореспондент повідомляє, що це може бути найдраматичніший фільм Рамлі з усіх, поєднуючи всю тонку емоційну біль любовного трикутника, в якому опинилися наші протагоністи, із тонкими коментарями щодо «нерівних» відносин між малайцями та японцями, а через них — між нашими японськими союзниками в Токіо та Куала-Лумпурі — '\n\n'— зображує похмурі нерозділені кохання, що застрягли в серцях туристичної групи, яка відвідує Куала-Лумпур із Токіо. Маріко кохає Куніо, але Куніо приваблює Росна, хоча він не може змусити себе сказати про це через тягар класових і расових відмінностей — а Росна має далеке кохання, що бореться із Заїбатсу, яким володіє дядько Куніо. Сцена готова для емоційного, бурхливого протистояння, і містить численні згадки про спустошливу бідність сільських районів у тіні економічної системи, у яку Сфера замкнула малайців — '\n\n'— це, безперечно, сміливо, так, але чи не може це трохи надто сильно розлютити Дієт у Шонан-то та японських радників, як гадаєте? Одна справа — здійняти невеликий переполох, але навіщо запрошувати його до нас додому? Отак? Я серйозно хвилююся, що Рамлі може запросити армію назад до парламенту, бо йому надто сильно болить за бідних — '\n\n'— слухайте, мені байдуже, що там сказано, головне те, що я плакала, коли Росна та Куніо прощалися! Гаразд? Якщо я плакала, це означає, що фільм хороший, незалежно від підтексту! То хто хоче піти подивитися його ще раз? — '"
sho.14.a: "Ніхто не скаже, що Рамлі не переходить межу."

 sho.16.t: "Східний Ґібралтар"
 sho.16.desc: "Сонце зійшло над розбитим узбережжям, піщаними берегами та мальовничими пляжами, перетвореними на місце різанини й страждань. Сінґапур, Шонан, колишній східний бастіон Британії, точка опори, з якої Японія поширювала свій вплив на Малаккську протоку та Індійський океан. Точка опори, що тепер опинилася в руках повстанців.\n\nДля солдатів Об'єднаного малайського анти-японського фронту, укріплених у Ґібралтарі Сходу, мир здавався далеким спогадом. Дні безперервних артилерійських обстрілів, перерваних авіанальотами та лютими, відчайдушними контратаками 25-ї армії. Нормування води, медикаментів і боєприпасів. Війна на виснаження, що залишала обидві сторони виснаженими.\n\nТа дух свободи було нелегко загасити. Виснажені боями, змучені безсонною ніччю за безсонною ніччю, солдати, що відходили на південь Сінґапуру, вибухнули гучними радісними вигуками. Перші кораблі флоту ОВН з'явилися на горизонті, блакитно-білі прапори майоріли на вітрі — нарешті прибула так довго обіцяна допомога.\n\nПочуття надії, радости й вдячности, змішані з невпевненістю та тривогою, свобода, принесена іноземною державою, оптимізм щодо невизначеного майбутнього. Але наразі примара миру й перемоги переважує все інше."
 sho.16.a: "Дядько Сем нарешті прибув."

 sho.17.t: "Кінець надзвичайного стану?"
 sho.17.desc: "На краще чи на гірше, ситуація на Малайському півострові, схоже, стабілізувалася. За даними нашої розвідки, рішучі зусилля 25-ї армії зі знищення ОМАЯФ були повністю зупинені через доволі серйозні події на Японських островах. Падіння впливового Заїбатсу Ясуда спричинило повний крах економічного сектору Японії, і навіть сили Імператорської японської армії в Малаї виявилися нездатними протистояти ударним хвилям цієї катастрофи. Паралізовані хаосом, спричиненим руйнуванням їхнього ланцюга постачання, операції 25-ї армії були негайно припинені, а невдовзі після цього було оголошено припинення вогню.\n\nКоли мир нарешті оселився на спустошеній війною землі Малаї, можна припустити, що завтрашня лінія фронту позначатиме сьогоднішні кордони, якщо, звісно, мир триватиме. Однак, з огляду на те, що японці наразі скуті економічними проблемами, не схоже, що конфлікт відновиться найближчим часом.\n\nТепер, коли війна завершилася, ми можемо зосередити увагу на наших відносинах із повстанцями. Якщо наші зв'язки переживуть те, що пил осів, ОВН може отримати змогу встановити сильного партнера в самому серці Сфери."
 sho.17.a: "Сподіваймося, вони пам'ятають своїх друзів."

 SHOUS.1.t: "Соціялізм у Куала-Лумпурі?"
 SHOUS.1.desc: "Перші вибори в Малаї після завершення війни закінчилися, і, схоже, результат виявився не зовсім таким, якого ми хотіли.\n\nДійсно, переможцем став Ахмад Буестамам, відданий соціяліст, який, на жаль, видається менш прийнятним для наших інтересів. Не будучи особливим ідеологічним радикалом, Буестамам хоче адаптувати соціялізм, щоб зробити його сумісним із Малаєю, оскільки він вважає, що сліпе відтворення большевизму — не те, чого країна хоче й потребує. Натомість його бачення соціялізму, схоже, зосереджене на відбудові країни — на тому, чого вона відчайдушно потребує після цілковитого спустошення війною.\n\nПеремога Буестамама, хоч і все ще краща за продовження японського впливу в регіоні, є для нас певною невдачею. Порівняно з Разаком він не настільки прихильний до ОВН і, ймовірно, не приєднається до нас у найближчому майбутньому; це втрачена можливість, зважаючи на всі ресурси, які ми вклали в конфлікт. Тим не менш, той факт, що японців більше немає в Малаї, усе ще є перемогою, яку слід святкувати, і ми повинні радіти тому, що контроль Токіо над Азією зазнав серйозного удару.\n\nЧерез результат виборів ми помітили, що прогресисти останнім часом дещо зросли в опитуваннях. Ймовірно, це можна пояснити тим, що широка громадськість сприймає перемогу Буестамама як логічний наслідок нашої підтримки війни, а отже, як пряме схвалення нами соціялізму."
 SHOUS.1.a: "Можливо, мирна революція — це те, чого потребує Малая."

 SHOUS.2.t: "Японці йдуть, ОВН приходить"
 SHOUS.2.desc: "Перші вибори в Малаї після завершення війни закінчилися, і, на щастя, схоже, що наш бажаний кандидат здобув перемогу.\n\nАбдул Разак Хусейн зумів завоювати серця й уми народу, і тепер він очолює країну, готовий втілити свої плани відбудови. Консерватор, Разак — саме такий чоловік, якого ми хотіли б бачити при владі: поміркований, прихильний до ОВН, він, схоже, відданий відбудові країни, чого вона, безперечно, потребує з огляду на спустошення, спричинене війною.\n\nПеремога Разака для нас є найкращим можливим сценарієм: на відміну від своїх опонентів, він цілком прийнятний для наших інтересів і, без сумніву, співпрацюватиме з нами в найближчому та віддаленому майбутньому. Оскільки ми вже ведемо з ним переговори щодо вступу Малаї до ОВН як спостерігача, очевидно, що його перемога закріпила за його країною статус американського союзника.\n\nОднак ми ще не зовсім завершили справи з Малаєю. Майже гарантований вступ до ОВН означає потребу в економічній та гуманітарній допомозі, оскільки ми, очевидно, не можемо дозволити Разаку та малайському народу самостійно впоратися зі спустошенням їхньої країни. Хоча такі зусилля можуть бути дорогими, це також можливість для нас: спрямовуючи гроші та ресурси в Малаю, ми можемо переконатися, що вона залишатиметься для нас надійним союзником, що б не сталося."
 SHOUS.2.a: "Зрештою, все це було не дарма."

 SHOUS.3.t: "Звіт ЦРУ: Малая"
 SHOUS.3.desc: "-ЦІЛКОМ ТАЄМНО-\nСитуація в Малаї, (СКОРОЧЕНО ДЛЯ СТИСЛОСТІ)\nВИСНОВКИ:\nI. Оцінка\nA) Потенціал Малаї як опори для подальшого відтіснення японського впливу в регіоні значно зменшився. Керівник малайської станції ЦРУ повідомляє, що малоймовірно, що нинішній режим буде повалено. Керівник станції зазначає, що, незважаючи на прихильні настрої адміністрації Ватаніа до ОВН. Малоймовірно, що Малая прагнутиме тісніших відносин.\nB) Посол Белл вважає малоймовірним, що Японія терпітиме американську присутність у Малаккській протоці, і, ймовірно, намагатиметься дестабілізувати Малаю. (Коментар: нещодавні економічні проблеми Японії, ймовірно, на певний час унеможливлять значні зусилля.)\n\nII. Режим\nA) Повстання серйозно розкололо Малайський народний анти-японський фронт, а помірковані елементи як ліворуч, так і праворуч протягом конфлікту влилися в радикальніші угруповання. Значна частина країни залишається під воєнним станом. Війська досі помітні в ключових населених пунктах, таких як Джохор, Куала-Лумпур і Келанґ.\nB) Військова адміністрація Аскар Ватаніа, хоч і популярна на поверхні, залишається крихкою в умовах делікатного післявоєнного становища Малаї. Комуністична партія Малаї зберігає значний вплив у сільських районах.\n\nIII. Воєнні збитки\nA) Малайський півострів сильно постраждав від повстання, а значні частини населення не мають доступу до основних послуг або належної інфраструктури (див. Додаток C: звіт Мартіна).\nB) Допомога, яку запитує адміністрація Ватаніа, є значною й оцінюється приблизно в 1,5 мільярда доларів США на рік (близько 40% бюджету зовнішньої допомоги).\nC) Відбудова Малаї разом із конфліктами на Філіппінах та в Південній Африці створить значне навантаження на наявні бюджети.\n(СКОРОЧЕНО ДЛЯ СТИСЛОСТІ)\n-ЦІЛКОМ ТАЄМНО-"
 SHOUS.3.a: "Втрачена можливість."

 SHOUS.4.t: "Марксистська Малая"
 SHOUS.4.desc: "Малайська надзвичайна ситуація завершилася, і, схоже, король попелу, що править над спустошенням, не налаштований до нас дружньо.\n\nЧін Пен, відданий антиколоніяліст, тепер очолює зламану й спустошену країну, яка готується відбудовуватися після наслідків громадянської війни. Переконаний комуніст, Пен прагне відбудувати Малаю за марксистсько-бухариністськими принципами, а його минулі дії свідчать, що він не зупиниться ні перед чим заради досягнення свого бачення вільної, нескутої Малаї.\n\nХоча теоретично це може здаватися цілком добре, справа в тому, що Пен не тримає Америку та ОВН близько до свого серця. Попри наші добрі наміри, він вважає, що ми нічим не кращі за японців, і що співпраця з нами означала б лише заміну одного колоніяльного сюзерена іншим. Таким чином, схоже, наша співпраця з Малаєю на цьому завершується, і країна піде власним шляхом, вільна від іноземного впливу.\n\nДля нас це є серйозною невдачею: якби опоненти Пена змогли взяти контроль над країною, ймовірно, вона була б прихильнішою до нас, особливо у випадку перемоги Разака. Принаймні ми можемо втішатися тим, що японці також пішли з Малаї, а це означає, що їхній вплив зазнав серйозного удару. Зрештою, нам усе одно слід стежити за країною, про всяк випадок, якщо політична ситуація стане сприятливішою; однак не варто очікувати надто багато, інакше ми можемо залишитися розчарованими."
 SHOUS.4.a: "Принаймні вона вільна..."

 SHOUS.5.t: "Великі амбіції"
 SHOUS.5.desc: "Кеннеді перевів погляд і щосили намагався зберігати яскраву усмішку — непросте завдання, коли тиснеш руку чоловікові із залізною хваткою та сталевими нервами, а десятки камер неодмінно спалахують перед ними обома. Хоча допомога ОВН повстанню у Сфері не вважалася неможливою, особливості Малаї завжди робили залучення до справи когось за межами Сполучених Штатів непростим питанням. Коли останні спалахи камер преси зникли перед Джоном Кеннеді та Туном Абдулом Разаком, пара нарешті змогла сісти й поговорити про участь Америки в Малаї.\n\nРазак говорив ще до того, як сів. «Пане віцепрезиденте, ми обоє знаємо, що ОВН потрібна тверда позиція в Тихоокеанському регіоні, союзник, на якого можна спертися, якщо справи підуть шкереберть. Якби ви просто надіслали нам ще трохи припасів—»\n\nКеннеді скривився й перебив. «Ми робимо все можливе з нашими скиданнями припасів, і так уже випробовуємо удачу. Якщо до Малаї потрапить хоча б ще одна гвинтівка, японці про це дізнаються, і ми отримаємо цілком нову ситуацію».\n\nБрови Туна звузилися, і він склав пальці в замок. «Нічого такого, з чим ви не впоралися б, правда?» Кеннеді посміхнувся й зробив ковток води. «Я серйозно!» — продовжив Тун. «Ми обоє знаємо, яким буде ваш наступний крок. Так чи інакше, це шанс повернути Америці позиції у справі світової свободи. Не те щоб президент Ніксон особливо допомагав цим шансам своїм управлінням країною, і якщо ви зможете відмежувати себе від нього, я впевнений, що невдовзі ви опинитеся в кріслі президента». Кеннеді на мить замислився над словами Туна.\n\n«Можливо, ми можемо дати Малаї трохи більше. Зрештою, я ненавиджу бачити, як чиєсь культура перетворюється на ніщо, але не розраховуйте ні на що більше, ніж те, що ви вже отримуєте. Я поговорю про це з президентом і дізнаюся, що він думає»."
 SHOUS.5.a: "«Тільки не розраховуй на це»."
 razak_victory_tt: "§GПовернення до нормального життя серед моря ворожости.§!"

 SHOUS.6.t: "Необхідна жертва"
 SHOUS.6.desc: "«11 952».\n\nЦе число не виходило з голови Неру, і він вагався, чи приймати його за правду. «І це лише за минулий місяць?»\n\n«Так, усе було особливо погано. Наші позиції були...» Ахмад Буестамам урвав себе, помітивши, як очі Неру розширилися й застигли. «Малая потребує цього. Ці чоловіки та жінки... вони загинули заради того, за що варто боротися».\n\n«Але я не хочу, щоб хтось помирав, Ахмаде. Насправді я хотів би, щоб ніхто не помирав, ні за це, ні за...» — він урвався.\n\n«За їхню свободу, Пандитджі? Я знаю. Я теж хотів би, щоб їх не сталося, але знаю, що вони були б щасливі, знаючи, що загинули в боротьбі за свободу. Якби вони знали, що загинули, борючись не лише за свою свободу, а й за кращий світ, я знаю, що вони були б задоволені своєю долею. Якщо 11 952 людини загинули за свою свободу, то кожен із них загинув у боротьбі за краще майбутнє». Буестамам подивився на Неру, який тепер глибоко замислився, осмислюючи сказане Ахмадом. «Бачите, неможливо створити дієздатну державу, і вже точно соціялістичну державу, сподіваючись на краще майбутнє. За неї треба боротися, незалежно від того, схвалюють це ті, хто стоїть на шляху. Ніхто ніколи не захоплюватиметься нашою роботою». Неру підвів погляд на Буестамама. «Але це треба зробити».\n\nНеру зітхнув, намагаючись прочистити голову. «Слухай... наступного разу просто стеж за зв'язком, гаразд?» «Ми й так втратили достатньо хороших людей, і я не хочу втрачати більше через помилку, яку ми щойно навчилися виправляти». Підвівшись із крісла за столом навпроти Неру, Буестамам підійшов до вікна, що виходило на пишні зелені індійські краєвиди. «Звісно, Пандитджі. Насамперед нам треба повернутися до Малаї»."
 SHOUS.6.a: "Легше сказати, ніж зробити."
 Boestamam_victory_tt: "§GХліб, дах і робота мають бути правом кожного малайця.§!"

 SHOUS.7.t: "Переможець і здобич"
 SHOUS.7.desc: "Ніксон ніколи не любив мати справу з Конґресом — чи то проштовхувати законопроєкти, чи займатися питаннями громадянських прав, чи переконувати впертих конґресменів; для цього в нього був Кеннеді. Ні, зовнішня політика завжди була його сферою, і сьогодні йому було що святкувати.\n\n«Поразка Японії в Малаї» — читав заголовок однієї газети, «Кривавий ніс Сфери» — іншої. Від узбережжя до узбережжя, а особливо в його рідній Каліфорнії, новини про поразку Японії в джунглях Південно-Східної Азії піднімали його рейтинг схвалення так, як цього не змогли зробити понад два напружені роки на посаді президента Сполучених Штатів. Навіть New York Times, аж ніяк не найбільш прихильне до нього видання, опублікувало редакційні статті з похвалою його зовнішній політиці.\n\nО, звісно, комуніст, який очолював повстанців, не вшанував його телефонним дзвінком, але він не збирався дозволяти цьому зіпсувати настрій. Утім, йому довелося зателефонувати Даллесу й переконатися, що Малая не вислизне з його рук. Перше доміно було повалено, і, якби все залежало від нього, воно було б далеко не останнім."
 SHOUS.7.a: "Америка 1, Японія 0"

 SHOUS.10.t: "Пара солдатів"
 SHOUS.10.desc: "Спостерігаючи, як його товариші марширують вулицями Сан-Дієґо, Хусейн Онн відчував, як піт стікає по ньому. Обтяжений формою та медалями, він і без того почувався зле від сонця, що пекло згори. Та й його війська аж ніяк не заспокоювали його. Судячи з усього, дорогою з Індії вони забули половину своєї підготовки, а ризик і без того був чималим. Якщо ця ставка окупиться, втрати в живій силі буде з лишком компенсовано завдяки більшій допомозі ОВН. З кожним нерівним кроком, невдалим відданням честі чи похиленою головою на чолі Хусейна виступала нова крапля поту. Відчувши, як хтось торкнувся його плеча, Хусейн відволікся від своїх переживань. Виявивши, що його ткнули сигарою, та ще й добрий друг, він заспокоївся. «Зроби паузу, Хусейне, все буде гаразд». ЛеМей запалив срібну запальничку й підніс полум'я до сигари, що тепер зручно лежала в роті Хусейна. Випустивши хмару диму, ЛеМей поклав запальничку назад у нагрудну кишеню форми й ледь перевів подих, перш ніж почати розповідати про нові плани Національного прогресивного пакту щодо мобілізації своїх митців, закликаючи людей «Боріться за Малаю!»\n\n«Повірте мені, пане Онн, НПП зробить усе, що в його силах, щоб боротися за вільну Малаю. Звісно, це означає більше військ на землі й більше зброї для борців за свободу кращого світу, але це також означає краще майбутнє для американських — і, звісно, ОВН — операцій у регіоні. Хоча ми, можливо, не зможемо принести нову Мал—»\n\nДо пари підійшов кремезний американець, поглянув на генерала ЛеМея й запитав: «Перепрошую, сер, але цей Хусейн Обб, він малайський, так?» ЛеМей подивився на чоловіка. Він не був ані особливо худим, ані надто кремезним. Стояв із такою впевненістю, яку може мати лише ідіот або геній. Його ніс криво стирчав над щетиною, схожою на колючий дріт, а погляд видавав суцільну злобу. ЛеМей нахилився вперед і прямо подивився чоловікові в очі.\n"
 SHOUS.10.a: "«Іди нахуй, Френсісе»."

 SHOJAP.1.t: "Запах незалежности"
 SHOJAP.1.desc: "Малайське повстання було придушене, і новий лідер країни, хоч і прийнятний, не зовсім той, кого ми хотіли б бачити.\n\nНещодавно обраним прем'єр-міністром, першим після завершення повстання, тепер є Бурхануддін Аль-Хельмі. Малайський націоналіст та ісламіст, Аль-Хельмі прагне відбудувати Малаю відповідно до свого бачення: ісламістської, антиколоніяльної Малаї, що крокує пліч-о-пліч зі своїми азійськими партнерами.\n\nОднак він виявився дещо надто прихильним до Індонезії на наш смак, а також надто радикальним і недостатньо покірним. Його прагнення до незалежної Малаї добре відомі, і, на жаль, вони знаходять відгук серед малайського народу. Більше того, його примирлива, навіть дружня позиція щодо Індонезії може дещо надто сильно порушити баланс у Сфері спільного процвітання, посиливши режим Сукарно ціною нашого впливу в регіоні.\n\nТим не менш, прем'єр-міністр усе ще є відносно співпрацюючим, а це означає, що ситуація наразі достатньо стабільна. У будь-якому разі, ми, на жаль, зараз мало що можемо зробити, а це означає, що нашому надто радикальному колабораціоністу доведеться залишатися на своїй посаді."
 SHOJAP.1.a: "Сподіваємося, він не завдасть надто багато клопоту..."

 SHOJAP.2.t: "Безсонні ночі"
 SHOJAP.2.desc: "Головний біль гупав у черепі Дато Онна Джаафара, поки гравітація тиснула на його плечі. Була без п'яти друга ночі, і лише тепер він зміг втекти зі свого засідання. Джаафар дістав останні дві сигарети з пачки — недостатньо, але краще, ніж нічого. Він поглянув угору, на хмари, мовчки оплакуючи своє становище.\n\nЯкою жорстокою іронією було те, що він, гордий малай, тепер працював із залізним кулаком, який нищив його країну. Він згадав ранні роки, коли був активістом і боровся за рівні права народів Малаї. Але люди, які сьогодні воювали в джунглях, ніколи не зможуть створити вільну Малаю. Та навіть якби й могли, вони б цього не зробили. Які б помірковані повстанці колись не існували, їх більше не було; на їхньому місці залишилися лише омани радикали, які проміняли б одну диктатуру на іншу, ведучи безнадійну боротьбу проти імперії, що набирала силу.\n\nМожливо, одного дня, через 20, 50 чи 1000 років, з'явиться по-справжньому вільна Малая. Але до того дня, думав Джаафар, тим, хто прагне свободи, доведеться працювати з тими, хто може її знищити, домовляючись зі своїми колоніяльними господарями, щоб здобути хоча б видимість незалежности. Але останнім часом навіть це здавалося оптимістичним. Партія, яку він заснував, розколювалася, а разом із нею почала розколюватися і його мрія про вільну Малаю. Чи був цей головний біль сьогодні лише плямою на довгому шляху до свободи, чи це була ще одна образа на десятиліття сизіфової агонії?"
 SHOJAP.2.a: "Коли сигарети скінчилися, він затоптав недопалок ногою, і засновник ПЕРМАС вирушив до свого готельного номера."
 jaafar_victory_tt: "§RЛюдина без вибору — загнана в кут. Ідеальна маріонетка.§!"

 SHOJAP.3.t: "Сходження Альбара"
 SHOJAP.3.desc: "Хоча ми вважали, що ситуація в Малаї на деякий час стабілізувалася, схоже, наші прогнози виявилися не зовсім правильними.\n\nДійсно, Дато Онн Джаафар дещо несподівано помер у похилому віці шістдесяти дев'яти років, і його наступником було затверджено націоналістичного запеклого діяча Сайєда Джаафара Альбара. Радикальний прихильник переваги малайців, він уже заявив про свої наміри перетворити свою країну на державу, де малайський народ перебуватиме на передньому плані. Наслідки цього викликають певне занепокоєння, оскільки дехто в нашій адміністрації вважає, що якщо він накаже надто жорстоко придушувати немалайських громадян, міжнародна репутація Сфери, як і наш образ пана́зійських визволителів, може постраждати.\n\nТим не менш, Альбар поки що показав себе відносно співпрацюючим, а це означає, що ми можемо терпіти його націоналістичні претензії, доки він не створює надто багато проблем. Більше того, ми вважаємо, що він може стати противагою Таїланду й допомогти тримати його під контролем — на що його попередник був не надто здатний.\n\nЗрештою, сходження Альбара на посаду прем'єр-міністра для нас мало що змінює, і ми можемо лише сподіватися, що він не надто сильно порушить баланс сил у Південно-Східній Азії: зрештою, Малая все ще є нашою маріонеткою, та ще й корисною."
 SHOJAP.3.a: "Чим більше речі змінюються..."

 SHOJAP.4.t: "Прем'єр-міністр попелу"
 SHOJAP.4.desc: "Малайська кампанія стала не чим іншим, як катастрофою на всіх фронтах, а смерть Дато Онна Джаафара та вбивство Аль-Хельмі партизанами залишили нам небагато варіантів щодо того, кого призначити керувати спустошеною землею, окрім Сайєда Джаафара Альбара\n\n. Радикальний прихильник переваги малайців, він уже заявив про свої наміри перетворити свою країну на державу, де малайський народ перебуватиме на передньому плані. Наслідки цього в найкращому разі викликають сміх, оскільки дехто в нашій адміністрації вважає, що якщо він накаже надто жорстоко придушувати немалайських громадян, які й без того виснажені шкодою, завданою громадянською війною, міжнародна репутація Сфери, як і наш образ пана́зійських визволителів, може постраждати.\n\nТим не менш, Альбар поки що показав себе відносно співпрацюючим, а це означає, що ми можемо терпіти його націоналістичні претензії, доки він не створює надто багато проблем. Зрештою, з огляду на стан країни, яку він успадковує, ми можемо бути певні, що протягом тривалого часу він не зможе зробити нічого, що справді завдасть нам клопоту — достатньо часу, щоб, сподіваємося, призначити більш... співпрацюючого міністра."
 SHOJAP.4.a: "Світло стає дедалі тьмянішим."

 SHOJAP.5.t: "Довгоочікуваний дзвінок"
 SHOJAP.5.desc: "Це був звичайний день у житті Іно Хірої. Навіть доволі безподієвий день, але хто він такий, щоб скаржитися? Зрештою, у політиці відсутність новин і хороші новини зазвичай є одним і тим самим. Так, подумав він, це був цілком звичайний день... Принаймні доти, доки не задзвонив телефон.\n\n«Це Іно Хіроя. Хто це?»\n\n«Прем'єр-міністре!» — радісно вигукнув голос на іншому кінці. «Ми це зробили, все скінчено! Ми придушили ОМАЯФ!»\n\n«А, чудові новини!» — відповів прем'єр-міністр. Нарешті малайська надзвичайна ситуація наближалася до кінця. Після стількох років 25-та армія нарешті зробила те, що мала зробити багато років тому, і радикального повстання більше не існувало. Але що йому тепер робити? Думки ринули в голові Іно. Можливо, найкращим рішенням було б якомога швидше влити ресурси в Малаю, щоб повністю повернути її до Сфери. Але водночас це стало б величезним витоком коштів, і, зважаючи на нестабільну ситуацію вдома, він не був упевнений, що справді може собі це дозволити. Ні, треба було зробити щось інше, щось менш жорстке. Але що?\n\n«Отже, що нам робити, прем'єр-міністре?»\n\n«Так, так, перепрошую. Слухай, я хочу, щоб ти з'ясував, який високопоставлений політик був би найбільш відкритим до співпраці з нами. Коли з'ясуєш, переконайся, що саме він прийде до влади». Сказавши це, Іно поклав слухавку. Це все ще був доволі безподієвий день, подумав він, принаймні порівняно з деякими іншими. Але після цієї новини..."
 SHOJAP.5.a: "Він щойно став набагато кращим."
 
 sho.51.t: "Укус поразки"
 sho.51.desc: "Хоча зовні вираз обличчя Іно майже не змінюється, лють, що накопичується під ретельно витриманою маскою прем'єр-міністра, ледве стримується; мільйони єн інвестицій, тисячі втрат особового складу за роки та роки головного болю через Світло Півдня пішли нанівець, коли останній особовий склад 25-ї армії було евакуйовано, а повстання впало в обійми американців — кого завгодно, тільки не їх. Навіть якщо вони зможуть запровадити блокаду товарів і відносин, вага ОВН та присутність Австралії й Республіки Індія просто означають, що вони не зможуть морити ОМАЯФ голодом, а нове вторгнення наразі просто не розглядається; 25-та армія майже перестала існувати, виснажене військо нарешті здалося й розпалося після війни, а наразі є й важливіша риба для смаження.\n\nЗагалом це була цілковита катастрофа для його перебування на посаді, і він відчуває метафоричний ніж Армії біля свого горла через цю невдачу. Доведеться зробити більше послуг, пожертв і обіцянок, щоб задовольнити своїх покровителів і позбутися критиків, принаймні поки він зосередиться на другому питанні на столі. Нестабільність Юло все ще є величезною проблемою, а тепер, коли Малая тимчасово знята з їхніх рук, повстанці майже напевно наважаться діяти.\n\nЗітхнувши, Іно готується набрати знайому низку телефонних номерів і звернутися по кілька давно належних йому послуг."
 sho.51.a: "Картковий будинок хитається у своїй основі."

