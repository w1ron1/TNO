 #Characters
 FSR_Jose_Valiente:0 "José María Valiente"
 POLITICS_Jose_Valiente_DESC:0 "Having led the mainstream Tradicionalistas into an unhappy compromise with Franco, José María Valiente Soriano faced a Falangist purge of his communion. The final indignity. A man of caution, his policy that the one true king should remain outside Spain until the rising's end has prevailed. Until then, Valiente serves as Don Javier's leal regent and President of the Council of Ministers.\n\nThe regent is old: old enough to appreciate this long-missed unity. With the full backing of the self-styled Javier I thrown behind Valiente's Requeté militias, the estranged Carlist family has returned to the reconstituted Comunión Tradicionalista. Unable to control the circumstances which caused the initial splits, experience inherited and perfected by time will serve him well in leading the resurgent movement.\n\nFor the first time in a hundred years, the movement has the numbers to independently fight for God. Carlism's prospects are full to bursting. Decentralized in belief and organization, and priding itself on its rejection of the parliamentary-party model, the CT will prove an unruly apparatus for controlling its congregation. However, currently only divided over the king's presence, the communion's sole fixation is to pursue this last, best chance for restoration. Under heaven, tradition will reign again.\n\nThe Cross of Burgundy marches again; a weathered red beret is donned one, last time."

 FSR_Unorganized:0 "Disorganized Leadership"

 FSR_Mauricio_Sivatte:0 "Mauricio de Sivatte"
 FSR_Mauricio_Sivatte_hog_desc:0 "§YSecond Secretary of Comunión Tradicionalista\nAIntegralism§!\n--------------\nFinally, the Carlist cross is risen, and its true son has come home. Sickened by Carlo-Francoist collaboration, doctrinal impurity, and Javier's vacillation, Maurici de Sivatte i de Bobadilla had due cause for leading a splinter in the movement, founding RENACE. Now that the decisive action they called for has come, his carlo-inegristas have flocked back to the Comunión Tradicionalista. While not declaring it publicly, Sivatte's presence surely signals the return of Don Javier's legitimacy.\n\nGiven the relatively powerless position of Deputy Secretary of the CT, Sivatte is nonetheless a force. His bauble of a role is a beacon, rallying all intransigents and Catalan Carlists. For it was he who rebuilt the Carlist structures in Catalonia after the Civil War. And now, without need for impure compromise, the old Catalan jefe savours this chance to restore his power base in full."

 FSR_Fidel_Carazo:0 "Fidel Carazo Hernández"
 FSR_Fidel_Carazo_for_desc:0 "§YMinister of Foreign Affairs\nIntegralism§!\n--------------\nWhile the crowd cheers, there is a bittersweet lump in Fidel Carazo Hernández's throat. For an avowed admirer of Franco and Carlist critic of the Francoist regime, there could be no other outcome. Now, returning to the cause of his youth, he has taken up the Ministry of Foreign Affairs. Many others had refused it. The role is unprecedented for Carlism, and some say hopeless. But this son of shepherds has long known how to move men.\n\nConsidered internationally as a forgotten anachronism, Carlism's pool of prospective backers is shallow. Nevertheless, Carazo has plied his editorial skills, finding friends in Latin American Catholic groups who share his sentiment that God is the source of all legitimate governance. The clarion horn has sounded. With the particular support of Brazilian integralists, the Spanish communion will once more enjoy nurturing protection, under the kingship of God."

 FSR_Jose_Perez_Nievas:0 "José Ángel Pérez-Nievas"
 FSR_Jose_Perez_Nievas_sec_desc:0 "§YMinister of Defense\nIntegralism§!\n--------------\nAmong those who had steadfastly opposed Valiente's collaboration with Franco, José Ángel Zubiaur Alegre is distinct, doing so from a moderate anti-centralist position within Carlism. In his Basque homeland, the cause of fuerista local and regional self-rule is remembered. But those designs lay in the future. For now, he is hard-pressed to mobilize the economy for war, drawing upon those rural regions, which are poor and nostalgic for old feudal charters.\n\nIf this was not enough of a headache, Zubiaur has been tasked with devising post-war Carlist economic policy. Tasking him with making coherent the historically vague position of supplementing liberal materialism with moral law and medieval corporatism, Valiente's gifts may be poisoned. All the same, the minister will dedicate himself, aiming to rise above his many rivals competing for the leadership of Navarre and the Basque Country."

 FSR_Jose_Zubiaur:0 "José Ángel Zubiaur"
 FSR_Jose_Zubiaur_eco_desc:0 "§YMinister of Economy\nIntegralism§!\n--------------\nAmong those who had steadfastly opposed Valiente's collaboration with Franco, José Ángel Zubiaur Alegre is distinct, doing so from a moderate anti-centralist position within Carlism. In his Basque homeland, the cause of fuerista local and regional self-rule is remembered. But those designs lay in the future. For now, he is hard-pressed to mobilize the economy for war, drawing upon those rural regions, which are poor and nostalgic for old feudal charters.\n\nIf this was not enough of a headache, Zubiaur has been tasked with devising post-war Carlist economic policy. Tasking him with making coherent the historically vague position of supplementing liberal materialism with moral law and medieval corporatism, Valiente's gifts may be poisoned. All the same, the minister will dedicate himself, aiming to rise above his many rivals competing for the leadership of Navarre and the Basque Country."

 FSR_Jose_Zamanillo:0 "José Luis Zamanillo"
 FSR_Ricardo_Pardo:0 "Ricardo Pardo Zancada"
 FSR_Miguel_Urmeneta:0 "Miguel Javier Urmeneta"
 FSR_Jose_Pareja:0 "José Arturo Márquez de Prado y Pareja"
 FSR_Jose_Azcarraga:0 "José Luis de Azcárraga"

 #National Spirits 
 FSR_spirit_zumalacarregui:0 "The Spirit of Zumalacárregui"
 FSR_spirit_zumalacarregui_desc:0 "Our Kingdom, declared after the pro-Nazi coupists began to purge the junta into ruin, is a small and isolated actor in the larger context of the Iberian War. The cards may be stacked against us, but we cannot be discouraged. The legendary Carlist General Zumalacárregui faced even more difficult conditions during the first Carlist War, and still managed to transform a few sorry guerrilleros into a formidable military. Energized by his undying faith in God and the Carlist cause, Zumalacárregui scraped and innovated through hardships. When his forces were outnumbered, the General utilized ingenious guerrilla tactics And when his men were hungry, Zumalacárregui created the now world-renowned Spanish omelette from the few ingredients available to him. Today, the Kingdom must honor and follow his spirit: adapt to the circumstances around you, and keep faith in the victory of tradition. "
 FSR_precious_cargo:0 "Precious Cargo"
 FSR_precious_cargo_desc:0 "Choosing not to invite the royal family back to Spain until the conclusion of the war was not a decision the government took lightly. The Kingdom's ultimate goal, after all, was to install the Carlist dynasty back into power in Iberia. Troop morale would have benefited from the royal family's presence in the country, and their absence has somewhat stymied the initial optimism among the Comunión Tradicionalista's ranks after the Kingdom's declaration. At the same time, there are concerns that this decision was a cynical power-grab made by Regent Valiente in order to strengthen his control over the movement. Ultimately, however, the royal family staying outside the country was the right call. Those possessing royal blood are few and far between-they are too important and the situation in Spain too dangerous."

 #Tree
 FSR_the_sane_choice:0 "The Bourbon Rebirth"
 FSR_the_sane_choice_desc:0 "Iberia has fallen, and with it Spain suffers. Across our land godless socialists and degenerate Nazis run rampant, demolishing our culture under their chaotic regimes. But even in this dark hour, there is hope.\n\nOur forces were able to save some areas from the coup, and troops loyal to the true Spanish Government are mobilizing. Have hope Countrymen, for the Bourbons have come again."
 FSR_the_sane_choice_tt:0 "§LAl legítimo rey se requirió. La reconquista de nuevo comenzó.§!"

 FSR_the_question_of_unity:0 "The Question of Unity"
 FSR_the_question_of_unity_desc:0 "While in Spain our numbers may be few, our resolve is the strongest as it is carried by the force of our righteousness. Together, no usurper can stand against us!\n\nThat being said, standing together is harder than we had initially hoped. Our movement is riddled with fractures, from petty squabbles to lineage disagreements. We must address these distractions immediately."
 
 FSR_reestablish_the_comit_de_accin:0 "Reestablish the Comité de Acción"
 FSR_reestablish_the_comit_de_accin_desc:0 "While we may have a government, we need to ensure our King and our movement act as one, in a way that a simple bureaucracy could not accomplish.\n\nTo this end, we shall reestablish the Comité de Acción, a group made up of local and regional leaders and led by our Monarch. It shall not replace the government, but shall allow our Kingdom to organically meet the most pressing needs of the people, while avoiding some of the inefficiencies of a civil service."
 
 FSR_meet_with_carloctavistas:0 "Meet With Carloctavistas"
 FSR_meet_with_carloctavistas_desc:0 "It is impossible to create consensus without first speaking to the dissenters. The Carloctavistas support a rival claimant to the throne, supporting the sons of Blanca de Borbón instead of honoring the rules of succession.\n\nHowever, they were supported by the Francoists and a notable number sympathize with them, making their influence currently unignorable. We shall reach out to see what compromises can be made to further unify our movement."
 
 FSR_speak_with_the_aet:0 "Speak With the AET"
 FSR_speak_with_the_aet_desc:0 "Across Europe, universities have been the enemy of tradition and God, often spreading subversive and degenerate ideas through cadres of weak-minded students. However, there is a group in Spanish universities that put God and Javier first in their mind; the Agrupación de Estudiantes Tradicionalistas.\n\nWe will strengthen our ties to it and bolster them so that the young may be saved from corrupting influences. We can also better watch them, and make sure they don't begin to deviate from our cause.\n\nThey are still students after all."
 
 FSR_celebrate_the_margaritas:0 "Celebrate the Margaritas"
 FSR_celebrate_the_margaritas_desc:0 "The Margaritas are a truly blessed thing that only we could have created in Spain. An organization of women loyal to God and Javier, they advocate for our cause and are a symbol of true traditional femininity in this age of subversion.\n\nWhile we would not ever use women the way other groups are disgracing them, their sacrifices in the hospitals, their service in the home and their piety at the Church services has been noticed. We shall feature them in a propaganda effort and promote them everywhere we can, so that traditional values may be safeguarded in the home."
 
 FSR_rise_requet_rise:0 "Rise Requeté Rise"
 FSR_rise_requet_rise_desc:0 "The Requete, our militia from the days of the Second Republic and the last Civil War, were fierce fighters who struck fear into the hearts of those who rejected their God and their King. Unfortunately their hour has come again.\n\nAfter years of being integrated into the Spanish, and then Iberian, army we must raise new tercios of soldiers, and do a swift reorganization. No longer a militia, the Requete shall become the foundation of a new Spanish Army."
 
 FSR_promises_of_public_participation:0 "Promises of Public Participation"
 FSR_promises_of_public_participation_desc:0 ""
 
 FSR_promises_of_a_mass_movement:0 "Promises of a Mass Movement"
 FSR_promises_of_a_mass_movement_desc:0 ""
 
 FSR_promises_of_continuity:0 "Promises of Continuity"
 FSR_promises_of_continuity_desc:0 "There are those across Spain who claim us to be traitors -that we are no more than common usurpers, wielding little more than a pretender on strings. Even in our territory, our King and his divine right are ridiculed by miscreants.\n\nTo remedy this, we shall sponsor a new propaganda campaign to educate both our people and Spain itself that it is in fact all others who are pretenders. Only we represent Spain and its true, ordained administration. Posters, radio and TV broadcasts will make it clear - even if thieves throw a man out of his house, it is he who remains the rightful master."
 
 FSR_dios_patria_fueros_rey:0 "Dios, Patria, Fueros, Rey"
 FSR_dios_patria_fueros_rey_desc:0 "All of our efforts are to create a God-fearing, righteous and strong Spain. Not for over a century has Spain been so close to such a joyous situation. All the blood, all the sacrifice and the hard decisions. All is so that we can create a state washed in the blood of the lamb, not just the blood of our enemies.\n\nWe shall remind our people of this fact. Our King and the Church shall speak, from podium or pulpit, of the piety and values that shall be the base of the new Spain. After so much chaos we shall ensure that our people remember why we fight."
 
 FSR_new_navarrese_brigades:0 "New Navarrese Brigades"
 FSR_new_navarrese_brigades_desc:0 "Navarre is a rugged area. It has seen difficult fighting before, against both Napoleon's legions and those opposing our Nationalist alliance in the last Civil War. In this war, it has turned against Spain and been stolen by unworthy men, as a brigand steals a wallet.\n\nSuch injustices have not gone unnoticed and there remain men from the area, proficient in fighting in such difficult terrain, who remember their true loyalties. We shall organize these exiles into elite units, and offer them a chance to restore God and King to Navarre and Spain."
 
 FSR_experts_of_propaganda:0 "Experts of Propaganda"
 FSR_experts_of_propaganda_desc:0 "Our Spain is a place of culture and art, and one art in which we shall invest is the art of rhetoric. We have identified a score of men who once worked in occupations related to affecting public opinion and attitudes, both in the service of the Government or businesses. We will issue special service exemptions for these individuals on the condition they form a new advisory body in our administration to advise public campaigns.\n\nSuch experts can bring our message of piety, tradition and monarchy to a new generation and greatly enhance the effectiveness of our propaganda."
 
 FSR_experts_of_guerrilla:0 "Experts of Guerrilla"
 FSR_experts_of_guerrilla_desc:0 "While the light that God and King brings is present in our territory, there are still many areas of Spain that are kept in the dark by those of the degenerate and godless mindset. We have heard those masses crying out in that darkness, and we shall bring them hope.\n\nWe shall invest in new penetrative 'expeditions' into enemy territory, using proficient troops and exiles, to harass enemy units and spread Carlism to local populations. While risky and costly, we shall ensure that the tactics that destroyed Napoleon will destroy Spain's new enemies."
 
 FSR_azcarragas_marines:0 "Azcarraga's Marines"
 FSR_azcarragas_marines_desc:0 "A loyal member of the former Iberian Navy, José Luis de Azcárraga, has approached us regarding reconstituting the Marine wing of the Navy. He has identified loyal soldiers who were past employed in the Iberian military who are proficient in amphibious warfare.\n\nWhile we shall not be engaged in fights across seas in the immediate future, such units can ensure river bridgeheads to strike the traitors where they least expect. With such men the armies that stand against us cannot stand."
 
 FSR_autonomous_infantry_battalions:0 "Autonomous Infantry Battalions"
 FSR_autonomous_infantry_battalions_desc:0 "Contrary to what our detractors say, traditionalism does not mean ignorance. The wars of this century have shown us that the key to military victory is limited autonomy and we have taken note. The old ways of war died in the fields of France and Britain as their lethargic armies were destroyed by Germany's dynamic forces.\n\nWe shall issue new guidance to our officers encouraging a degree of autonomy, allowing our forces to react faster and more effectively than our enemies will be able to.Through evolution, we shall stand strong."
 
 FSR_in_the_name_of_the_red_beret:0 "In the Name of the Red Beret"
 FSR_in_the_name_of_the_red_beret_desc:0 "While the icon of God and King should be sufficient, we do recognise those concepts may be too abstract for the many commoners. Therefore, we shall start to focus our military propaganda on the Red Beret of our Requetes.\n\nThis will allow all Spaniards to know who fights for them, and across Spain the symbol of the Red Beret will inspire men to give all in the service of their country. The men of our army will know that Beret is a symbol of courage and give them renewed drive to end this War."
 
 FSR_mobilise_auxiliary_tercios:0 "Mobilise Auxiliary Tercios"
 FSR_mobilise_auxiliary_tercios_desc:0 "The longer the War continues, the more ravenous our army's hunger for men. While there is some general distaste towards further mobilisations, we can soften this by implementing Auxiliary Conscription instead.\n\nConscripting men to serve behind the lines in the multitude of support roles that are required will also allow more men to be redirected to the frontline without drawing too much of the ire of the commons. Of course there will be those that recognise our ruse, but they should be too small a group to cause too many issues."
 
 FSR_sivattes_catalonian_influence:0 "Sivatte's Catalonian Influence"
 FSR_sivattes_catalonian_influence_desc:0 "Mauricio de Sivatte is a man of the old school, even by our standards. A man of strict orthodoxy, or at least his own blend of it, he has been noted as criticizing some of our decisions as we entered the War. While somewhat irritating, he does have an audience and there may be plenty of room to compromise.\n\nWe shall reach out to Sivatte and give him a position within our ministries. Doing so will help to unify the forces of tradition in Spain, give us the support of his followers and, thankfully, make him stop his complaining."
 
 FSR_urmenetas_basque_connections:0 "Urmeneta's Basque Connections"
 FSR_urmenetas_basque_connections_desc:0 "Regardless of how distasteful the lust for capital can be, we are certainly no communists. We recognise how expensive wars can be, and we are more capable than simply rejecting it and waging war simply by pointing a gun at our people's back.\n\nA partial solution is personified in Miguel Javier Urmeneta, a man with connections to the Northern financial and business circles. With his support we can gain much needed money for the war effort, and improve capital access for our businesses."
 
 FSR_el_fuero_de_guerra:0 "El Fuero de Guerra"
 FSR_el_fuero_de_guerra_desc:0 "So far our economic stances have been a little too reactive to events or inherited from the old Iberian administration. This has led to some confusion and unnecessary red tape, things felt inevitably the most by our brave soldiers. As such, we shall create a comprehensive policy paper outlining a true war economy.\n\nThis will allow us not only to improve the strength of our war effort, it will also facilitate the continuing reform of our economy into a truly national, Carlist one."
 
 FSR_mobilize_the_countryside:0 "Mobilize the Countryside"
 FSR_mobilize_the_countryside_desc:0 "The countryside is a bastion of morality and faith, and so we must take measures to make full use of it. The two priorities are the ever-present need for manpower and the farms which are vital for our food supply.\n\nWe shall engage in a recruitment drive, highlighting our need for god-fearing and brave men for the frontlines. We shall couple this with strategic draft exemptions for our farmers as well as investments in the larger farms to ease transporting their goods."
 
 FSR_mobilize_the_cities:0 "Mobilize the Cities"
 FSR_mobilize_the_cities_desc:0 "Our cities hold the key to our industrial output, as well as large amounts of our population. While city dwellers may not be of the same caliber as those who live a more traditional life in the countryside, their sheer number will make them the backbone of our forces. Further the equipment we will need cannot be grown, so the factories of the cities is vital.\n\nWe shall run a campaign highlighting the threat the pretenders represent to Spanish society itself in the cities to ensure there will be no shortage of volunteers, while also providing funds for strategic industries with which to improve their production lines."
 
 FSR_mobilize_the_exiles:0 "Mobilize the Exiles"
 FSR_mobilize_the_exiles_desc:0 "Some of our nation's more troublesome sons who refused to reject their King found themselves unwelcome in Spain, even with our presence in the former government. Many of these left and have come into considerable prosperity in other nations. It is time now that we ask them to prove the commitment to which they accepted exile.\n\nWe shall reach out to as many sympathetic exiles as possible and ask them to lend support for our economy, however they can. With their support, we shall have the funds we need to create a Spain that will accept them back with open arms."
 
 FSR_economic_pragmatism:0 "Economic Pragmatism"
 FSR_economic_pragmatism_desc:0 "While a national, God-fearing and moral economy is the constant objective of our state, we would be remiss to overlook the simple reality that fundamental economic reforms during a war that has reduced parts of our nation to anarchy may not be the best advised idea.\n\nWe shall engage in some minor reforms of course, but we shall stop short of many of our stated goals for the time being and instead prioritize efficiency. This will earn some complaints from our more hardline cadres but such things are regrettably necessary in times of war."
 
 FSR_decentralize_the_war_industry:0 "Decentralize the War Industry"
 FSR_decentralize_the_war_industry_desc:0 "Industry is a crude beast, and if left unleashed can run havoc over a nation. One only needs to see the degeneracy of America or the lethargy of Japan to see that. We recognise that the best way to restrain this beast is by ensuring righteous men are at the helm who prioritize not capitalistic advancement or individual power but the needs of the State, the King it serves and the God who commands him.\n\nWe shall distribute control of vital industries to prominent supporters of our cause, and reduce state control over them. Such men will ensure sound business will maintain the Carlist war effort, while the reduced state interference will avoid creating Spanish zaibatsus."
 
 FSR_reestablish_the_sindicatos_libres:0 "Reestablish the Sindicatos Libres"
 FSR_reestablish_the_sindicatos_libres_desc:0 "While the socialist trade unions were dens of subversion and blasphemy, we are far from cruel capitalists. Workers receiving representation is no bad thing, so long as they keep in mind their position.\n\nTo this end, we shall create a new national Workers Union, the Sindicatos Libres, which will allow workers a voice with an emphasis on Christian morality and calm agreements based on reality, not doctrine. Any socialist agitating members that still remain shall be dealt with, either by prosecution or by an unfortunate 'accident' in the workplace, depending on what looks better on the paperwork."
 
 FSR_break_up_war_strikes:0 "Break Up War Strikes"
 FSR_break_up_war_strikes_desc:0 "We are not blind to the needs of our people, we understand that War brings with it difficult conditions and intense demands that wear them down. However, some dissidents are claiming we go too far and are exploiting the situation to undermine our war effort and aid our enemies with strikes.\n\nThis is unacceptable. We shall direct all workplaces to make the wartime prohibition of strikes clear. To any who still transgress, examples will be made where all can see."
 
 FSR_selfpolicing_workers:0 "Self-Policing Workers"
 FSR_selfpolicing_workers_desc:0 ""

 FSR_the_hunt_for_grafters_and_corrupters:0 "The Hunt for Grafters and Corrupters"
 FSR_the_hunt_for_grafters_and_corrupters_desc:0 "Until recently, we were a shrinking organization being pushed to the fringes of Iberian politics. Now we actively contest to liberate Spain. This has seen a massive and rapid expansion of our organizations and supporters.\n\nWe are aware however that such a fast expansion means we cannot be certain of our new brothers and sisters. We shall ensure our security services maintain a close eye on our internal groups so that spies and traitors cannot derail our efforts from within."

 #Events
 FSR_wars.1.t:0 "Late Night Advice"
 FSR_wars.1.d:0 "The dull drones of the phone calling didn't last long before it was picked up.\n\n"Hello?" came the curt answer from the other end. The tone of Javier de Bourbon showed he had no desire for idle chat.\n\n"Your Highness," began José María Valiente as he leaned back in his chair. The room was sparse, being part of a safehouse located in a small town in the countryside of Spain. "I apologize for calling at such a late hour. I wanted to report the results of the regional council."\n\n"And?"\n\nJosé rubbed his eyes before responding. "It's... mixed, sire. I can't deny that we aren't divided. It is cordial, there is common ground, but the regional groups are caught on details. They dispute minor issues on everything from conduct of the War to government responsibilities. I fear we may start fraying at the seams."\n\nThere was silence on the line for a moment. "José, we are close now. Close to correcting over a century of torment for our country. We cannot let playground squabbles distract us now."\n\n"Maybe if they could see their leader, all the nonsense would wash away." José mused.\n\n"They have their leader," answered Javier, "they have you, and the faith I place in you. Spain has no better servant. Spain needs strength, a commanding strength. Give that to them, don't let them squabble."\n\nJosé nodded to himself, turning over the words in his head. "I will, sire." he said."
 FSR_wars.1.a:0 "My legitimacy is represented by you, therefore so is my power"

 FSR_wars.2.t:0 "Succession"
 FSR_wars.2.d:0 ""Is this safe, Señor Valiente?" asked José's bodyguard in a wisplike voice. They were walking through the camp of the Carloctavists, surrounded by curious militiamen.\n\n"We will be fine Hugo, trust me," replied José with a firm air of confidence. "We are all friends here, just friends that are slightly quarreling. Besides, I've already spoken to their real leader".\n\nThey were led into a large tent near the middle of the encampment. It was designed like an office, lavishly dressed in the circumstances. Sitting at the desk in the center was a man - leader of the Carloctavists.\n\n"Jaime del Burgo, it is a pleasure" said José. Jaime looked at him and regarded him sternly for a moment, before inviting them both to sit at the provided chairs.\n\n"I have considered your offer, José," began Jamie, "and what you ask for is not simple. Our loyalty is to the rightful Queen, not your pretender. We will not be used by you like how Franco used you."\n\nJosé winced internally at the barb but allowed nothing to show. He took out his briefcase and took out a wreath of pages, handing them to Jaime. He glanced through them, brow furrowing.\n\n"Here is a sworn statement, complete with seal, that your 'Queen' has agreed to cooperate with the main Carlist movement for the duration of the War. At its conclusion we swear a Succession Convention where this question may be legally settled. Regardless of outcome your movement will find influence in our ranks. Are your Queen's actions agreeable to you?"\n\nJamie placed the papers down and pondered for a brief moment. "It is agreeable" he said."
 FSR_wars.2.a:0 "False Promises can bring True Rewards"

 FSR_wars.3.t:0 "Faith"
 FSR_wars.3.d:0 ""Sisters, for years we have labored under those who used Catholic society as merely a cloak to disguise their true selves. Hide the evil which lurked, as Judas did in our Lord's final hours. Now that the influence of Satan has been recognized, and our men fight to protect our homes as Michael the Archangel did, it is vital that we look to the example of Paul and teach new generations the good news."\n\nThe Conference hall was bathed in light as María spoke from the podium. In every nook of the room sat or stood a proud woman, in her estimation. Members of the Margaritas, finely dressed and pious. Women who could face the turmoil of the war and continue to be symbols of grace and piety.\n\n"We must remember, sisters, that the influence of the devil can strike in our moments of weakness. That can occur anywhere; in our communities, in our friends and even our homes. Can we leave our children defenseless against our current spiritual predicament?"\n\nCries of no rang around the room. María smiled and reached her hands out to the congregation. "It is scary, sisters, I know how you all fear for the souls of your family and friends. Do not fear though, for the light of the Lord once more shines on Spain. We will soon have a God-fearing King and a new society of piety and prosperity!"\n\nA cheer rang around the room, and María began to take her leave. She invited to the stage a man she said was one of God's bravest in Spain, a leading representative of the King's Counter-Terrorism Agency to inform them of how to help prevent subversion.\n\nNear the back of the room, a woman prayed the rosary. She did not pray for the Margaritas. She prayed for the soul of Spain."
 FSR_wars.3.a:0 "A New Vision of an Old Spain"

 FSR_wars.4.t:0 "The Poster"
 FSR_wars.4.d:0 "The poster came up overnight, on nearly every public announcement board and seemingly unattended wall. Bold colors met the bright sun as the sunrise crept above the houses, and the first residents began to see the new artistic addition to their town.\n\nThe poster was large, impossible to miss. In the bottom left corner there was a sliver of something resembling normalcy. Children playing as a mother gazed away through a window, her back turned to the viewer. All wore bright clothes with an image of sunlight passing through.\n\nEncompassing that narrow image was a large painted soldier, his uniform impeccable and his face one of righteous determination. However, it was not unkind, a face modeled to be strangely comforting in its complexion. The background was red, eye-catchingly so. In his hands were a rifle, bayonet attached and pointed at the two antagonists of the piece.\n\nTowards the bottom was a man dressed in a long black cloak and hood. He wore round glasses and possessed a long, exaggerated nose. On his clothes, in white, were the printed words 'Democracy'. Above him was a clear rendition of Adolf Hitler, wearing a brown Spanish military with the white word 'Fascism' printed. Both of them reached for the family behind the soldier, Democracy almost crawling along the ground while Fascism loomed aggressively.\n\nAt the bottom was a slogan as well as details about the nearest recruiting station. The slogan read "¡Hombres, defiéndanse de la Degeneración!".\n\nA man who saw it was asked by his wife what the new posters were like when he got home later that day. She had heard a neighbor talk about a striking new recruitment poster.\n\n"Ah, they're okay." he said."
 FSR_wars.4.a:0 "Everyone's a critic"

 FSR_wars.5.t:0 "The Public Eye"
 FSR_wars.5.d:0 "NEW CLARITY REGARDING ECONOMIC PROSPERITY!\n\nOur leader, José María Valiente, gave a well-received speech today before a Council of Regional Businessman offering much-welcomed clarity regarding a long-rumored adjustment of the economy after the disruptions brought by the cowardly Liberals and monstrous Fascists.\n\nIn his speech, our leader praised the "considerable efforts of those who, like the Church of old when faced by the evils of Paganism, came together in a common unity rather than abandon the world to chaos and disorder. He aimed particular praise at a variety of spontaneous acts of collaboration agreements between workers and business leaders, amicably settling long term disputes in the interests of our defense. He declared such actions to be examples of "Vertical Brotherhood".\n\nOur leader went on to announce that his government had made public to relevant business groups an abbreviated version of the Fuero de Guerra, a document that will outline the base of further economic policy especially for the duration of the War.\n\nFurther details were provided regarding the document, focusing on the efforts to create an economy based on principles of justice and Christian morality. A statement from the Economic Office specified that reforms would be implemented cautiously in the interest of the Worker and that this document was merely a first step towards an economic model worthy of a great Spain.\n\nFor the Full Story Turn to Page 3\n\nFull Transcript of the Speech Available on Page 38"
 FSR_wars.5.a:0 "Always buzzwords and slogans" the reader thought as they turned the page"

 FSR_wars.6.t:0 "Unaltered Deals"
 FSR_wars.6.d:0 ""José, I would never question our purpose. However, the fact that we are maintaining elements of the Falange in our state is concerning to say the least."\n\nJosé was sitting straight and unmoving in his office, despite the length of the meeting causing him to want nothing more than to slump back. Across the desk sat José María Araúz, a man who in recent weeks had caused him much consternation. Arauz had been making statements to journalists, ministers and practically anyone who would listen to his list of reforms. José had finally had enough.\n\n"I respect your position," José said, masking an hour of exasperation, "but you must appreciate our position. Our Government and economy? Young, fighting for its life. Traitors are actively trying to destroy us. We must step carefully."\n\n"That is exactly why we need to act! The Vertical Syndicates continue to limit our efforts to really change this country. People need to see we are serious if they are to welcome us."\n\nJosé had wished he would not have to use this card but he failed to see what else he could say. "I spoke to the King earlier this evening. He agrees that rapid changes are unwise" José lied.\n\n"He does?" Arauz deflated.\n\n"But, he has noted your concerns and feels they are valid. He instructed me to begin making changes to the Syndicates in order to facilitate the eventual creation of our Obra Corporativa Nacional. Understand that your determination has caught the King's eye."\n\nArauz inflated, his eyes enthused. José internally sighed. How easy it was to make people accept the original offer just by mentioning the King."
 FSR_wars.6.a:0 "A trump card sparsely used is well-preserved"

 FSR_wars.7.t:0 "Rude Awakening"
 FSR_wars.7.d:0 "The gentle sounds of the forest bounced off the trees as Pedro rested, lying on a tree slightly away from his companions. His squad had been marching for days through the country, taking care to avoid the roads and trails that occasionally cut through the forests and fields.\n\nThey had been part of a much larger platoon, trying to secure a forest clearing that showed up on some of the regional maps. One that, so they had been told, could secure a temporary helipad in the upcoming operations in the area. To Pedro that seemed like a good deal, god knows that the war had usually made evacuation and moving around difficult; the chance to make things a little better for once was welcome. However in the green maze they had lost their platoon.\n\nPedro was drifting asleep to the cacophony of the forest before being bolted awake. The squad leader was shouting something. He focused.\n\n"Where is the goddamn sentry? Don't you know to put a sentry you dumb idiots, I'll have you court martialled!"\n\n"Isn't that your job?" replied one of the privates, earning a response of slurs.\n\nPedro stood up to prepare for the inevitable before suddenly tensing. A twig snapped. A bush... shuffled? Before he could move half a dozen camouflaged soldiers bearing weapons sprang up. On the shoulder was the emblem of the Carlists.\n\nThe squad stopped dead, with Pedro backing towards them as they all raised their hands. Not one of them had their rifles. The Carlists moved as ghosts, dead silent as they advanced on them."
 FSR_wars.7.a:0 "For them, the war was over"

 FSR_wars.8.t:0 "Our Spain Is a Monastery"
 FSR_wars.8.d:0 "The only sound in the bright, warm morning was the striking of a hammer against a nail. The town square looked fresh in the morning sun, the struggles of the War a myth. The notice being hammered to the wall barely affected that, to the delight of the soldier, for he had no wish to impact such an idyllic visage.\n\nThe task completed, the soldier stepped back to admire a successful, albeit basic, task. Into the square came a priest. Not uncommon, the priest was known to take a walk every morning around the town. He said it kept him in touch with his flock, and his laity felt more at ease in these times of struggle to see him during their mornings.\n\n"Good morning soldier, what brings you to our humble town?" he asked the soldier cheerfully. As a man of God, he cared little for the War itself, seeing no real distinction between his brothers. In his view, while they quarreled it was important that they always understood that God took no sides other than righteousness.\n\n"Good morning father," the soldier greeted, "I bring a public notice. Failure to attend Mass without appropriate circumstances will now incur a tax."\n\nThe Priest stopped. Taxing those who did not wish to attend Mass? While the Priest wanted nothing more than for all to seek the Lord's salvation, he had no interest in forcing people to his altar.\n\n"My son, shouldn't those who worship choose to do so?" he asked, somewhat puzzled.\n\nThe soldier looked at the priest with a slight grin, as a parent to a foolish child. "Oh Father, in these times we all need God and the community, for there is Spain. Those that want to reject God, well they should contribute more to the community.""
 FSR_wars.8.a:0 "The soldier walked merrily away as the Priest stood conflicted"

 FSR_wars.9.t:0 "Law and Order"
 FSR_wars.9.d:0 "The square had been baked all day by an unremitting sun, and as the evening drew closer the heat seemed unable to dissipate. The mob of people crammed into the square seemed to try and ignore the heat, instead staring at the new wooden structure that dominated their once quaint town square.\n\nOn it stood four people, arms tied behind their backs. One was weeping, one was praying, while the others held a glazed expression. Next to them was a Priest, saying a prayer over the condemned while a man in a black hood made sure the contraption behind them was ready for operation. The unmistakable machine was a gallows, with a guard flanking both sides.\n\nThe Town's new Mayor walked onto the gallows platform, addressing the people as though this were a normal stage. He spoke of how the condemned today had betrayed not only their country, but their God too. How they had been caught having extramarital intercourse, with undeniable proof they wished to corrupt the youth. How their kind had led to Spain's woes. One of the condemned spoke up, pleading that it was all lies, before a guard's rifle butt struck her nose, causing her to collapse in a screaming huddle. She was promptly returned to a standing position.\n\nThe Mayor concluded that he hoped that today would serve as a unifying moment for all his townsfolk, and increase their commitment to the public good. The priest tried to speak to the weeping woman, whose nose was streaming blood, but the guards roughly forced them into position. Within minutes they were silent, dead eyes surveying the people of the town.\n\nThe townspeople were silent too, with only the guards all around the square giving a cheer as the trapdoors had dropped. The Priest simply looked at his shoes, unable to meet any gazes. He hoped that God was not watching."
 FSR_wars.9.a:0 "He saw a pale horse, and sitting upon him, was Death"

 FSR_wars.10.t:0 "Conscription in Valladolid"
 FSR_wars.10.d:0 "Valladolid couldn't be seen behind them, but the smoke from its ruins certainly could be.\n\nRodrigo's unit had been effectively decimated in the defense. Only he and a handful of men had survived out of what was once an entire platoon. Their minds were dour, as they silently walked along the cracked highway. A single horse drawn cart went with them, all they could collect before fleeing.\n\n"Sir," a sergeant - maybe the last remaining one Rodrigo reflected - walked up to him, "permission to speak?" Rodrigo simply responded with a nod.\n\n"The men have been talking Sir. We were lucky to get out but we know that they're right behind us. Right now we will be massacred and I reckon some of the men are going to desert unless we find reinforcements to help us."\n\nRodrigo continued his silence, stopping to ponder the matter. It was true, he'd seen the eyes of the men as they had walked out of the outskirts, there were no thoughts of God or King in them. Only survival. With the enemy liable to chase them at any moment they wanted bodies as shields.\n\nOut of the corner of his eye, Rodrigo sensed movement. On the other side of the road a refugee train was passing, also fleeing the city. They were emaciated and desperate. They were also unarmed. An idea came to Rodrigo.\n\n"Sergeant, in the cart we were able to throw in a box of rifles weren't we?" he asked\n\n"Yes sir, a few dozen old rifles plus ammunition" came the knowing response.\n\n"Good. Assemble the men, we'll make sure we have the numbers we need.""
 FSR_wars.10.a:0 "Most of the new recruits would be dead by weeks end"

 FSR_wars.11.t:0 "Public Announcements Around La Coruña"
 FSR_wars.11.d:0 "Juan's truck bounced and shook constantly as it tried to navigate what had once been the roads of La Coruña. Rubble, holes and corpses made the road almost unrecognizable. Juan was happy for the loudspeaker playing in the back of the truck - it disguised the frequent frustrated curses he was yelling.\n\nThe City was unrecognizable, not that Juan had ever been there before. Maybe it had been nice once? Frankly Juan didn't really care. It was a Galician area, and they'd always rubbed him the wrong way anyway. Other than the truck and the loud voice blaring over the loudspeaker there seemed to be no other sound or sign of life anywhere in the city.\n\nThe loudspeaker was playing an address from the former City Mayor, who had been trying to flee south to Portugal. In an exhausted tone, slightly broken too, it told the people that the battle was over. The forces of the King of Spain had successfully liberated the city from men like him that had wanted to use it for their own selfish pleasure. He asked that all the citizens welcome their saviors with open arms, complying with their commands in order to see a quick end to this war they had foolishly been waging against the true king.\n\nAs Juan continued to drive around the streets, a set course that had been planned in advance - albeit with some adjustments for unexpected impassable roads, he slowly began to sense eyes. He would catch them briefly hiding in windows, behind cars or walls. Hiding just as Juan turned to look at them.\n\nThey must have feared his truck, it did have the flag of the King emblazoned on the side after all. Juan however could not pity them. They had caused this, letting their pride and ego control them to such devastating effects. He hoped that soon they would all learn the error of their ways, just as the Mayor had learned his."
 FSR_wars.11.a:0 "The voice of the Mayor carried on the wind, and all heard it"

 FSR_wars.12.t:0 "The Law in Vigo"
 FSR_wars.12.d:0 ""Private Barrera, you have been found guilty of theft and I have no choice but to sentence you to 12 months service within a Penal Battalion. You will be taken from here and you shall receive your transfer papers. Good luck."\n\nThe Private refused to meet the Coronel's eyes and was removed from the tent. Coronel Aguire sighed. There had been a dozen court martials that day, of varying degrees of severity. Petty thefts all the way to murder. So much for enjoying some rest after Vigo had been rescued. Doing court martials from his command tent was not exactly restful, but the need for discipline was more important now than ever.\n\nThe adjutant walked in, a young kid replacing the last one after they caught a sniper bullet during the Vigo offensive. Aguire hadn't learned his name yet, but the lad seemed nice enough. Kept and proper, he carried a package under his arm, a sight that immediately raised the Coronel's spirit.\n\n"Sir, here is the package you told me to collect. The men who delivered it mentioned they expected payment? They seemed an awfully dour group"\n\n"They know the arrangement," said the Coronel as he took the package and hastily ripped it open. Out of it came a bottle of port, Real Companhia Velha Royal Oporto Colheita'44. His eyes lit up, received with a puzzled look by the Adjutant.\n\nCoronel Aguire placed the bottle on his desk, rubbing his hands together as he looked around to find his glasses. "Those men outside are great at finding things locally my boy," he told the adjutant, "since we saved this place, enjoying some fruits of victory isn't a crime.""
 FSR_wars.12.a:0 "The Adjutant thought he saw red specks on the package paper"

 FSR_wars.13.t:0 "Following Orders in Oviedo"
 FSR_wars.13.d:0 "RECORD OF ROYAL ARMY RADIO MESSAGES 19** - 19**\n\nROYAL NORTHERN COMMAND MECHANIZED (ATTACHED) FORCES.\n\nCOMMAND TRANSMISSIONS P.G. 4\n\nIFV 21 COMMANDER: Command, this is IFV 21. There are civilians in our fire zone. Please advise, over.\n\nCOMMAND: Acknowledged IFV 21. Are hostiles present? Over.\n\nIFV 21 Commander: Entrenched position in next street suppressing friendly infantry at both street exits. Suspected refugees sighted sheltering within the position. Please advise, over.\n\nPAUSE OF 30 SECONDS\n\nCOMMAND: Likely militia, clearance for cannon use given. Please acknowledge, over.\n\nIFV 21 COMMANDER: There... we think there's kids in there.\n\nCOMMAND: Militia aiding soldiers kill your friends. Acknowledge the clearance, over.\n\nPAUSE OF 10 SECONDS\n\nIFV 21 COMMANDER: Acknowledged. Out."
 FSR_wars.13.a:0 "SECRET: DISSEMINATION OF THESE RECORDS IS A CRIMINAL OFFENSE"

 FSR_wars.14.t:0 "Leadership in Bilbao"
 FSR_wars.14.d:0 "Sitting along the road were men wearing no uniform, except for the red bands around their arms. The mark of the countless socialist militias that had sprung up as royal forces had pushed through Bilbao. Their numbers were filled mostly with the old and the young; everyone else was dead or had fled.\n\nCaptain Torrez looked at his new prisoners with a frustrated sternness. They had kept his unit in a fight over a factory complex for two days, only surrendering once their ammo had been exhausted. They had cost Torrez men and, most importantly, time.\n\nHe walked up and down the line, hunting. He wanted to find the leader, the man who had kept him trapped in a fight over an empty building for two days, but no man seemed to have the build he expected. A leader would stare into the eyes of the enemy, and none of these men would.\n\n"Now gentleman," he said, "I desire to speak to your commander. As you refuse the discipline of uniform, I confess I can't say which of you is he. Unless you make yourself known, sir, I will just start shooting a man until you show yourself." Some of Torrez's men shifted uncomfortably at that, but he gave it no thought. Why should he care about the squeamishness of weaker men?\n\nHe pointed his pistol at the nearest man and counted down, slowly, eyes surveying the line. At one, he saw movement as someone stood up.\n\n"Ah sir, I see you..." he stopped. A woman had stood up. A woman who had stared at him as he had hunted along the line, something he ignored. It was impossible, a woman could not-\n\n"You wanted me?" she challenged.\n\nTorrez simply pointed his pistol at her and fired. He was incapable of speech."
 FSR_wars.14.a:0 "What beliefs survive contact with the enemy?"

 FSR_wars.15.t:0 "Paternalism in Pamplona"
 FSR_wars.15.d:0 "The cracks of the rifles hung heavy. The bodies by the trucks grew ever plentiful.\n\nIn a nondescript square, a constant throng of prisoners were bought. Some struggled, crazed eyes seeing oblivion. Others catatonic, dazed from all resistance as they took in their last day. Some wept, pleading to unheeding ears. To the riflemen the dazed were the best. They were working in long shifts after all. New soldiers came to relieve the executioners leaving some temporarily forgotten against the bloody wall. Before starting, however, one soldier lowered his weapon and walked away, earning confused glances from his compatriots.\n\n"Private, are you ill?" asked the monitoring officer, an old man with a kindly air.\n\n"Sir, I am sorry" answered the Private, "but I cannot be a part of this. I can serve with the King's army against its enemies but these people... they're our prisoners..." The private trailed off, conflicted.\n\nThe Officer looked with pity. "I understand this is hard, it makes you no less a man. Today is simply necessary. Spain's foes are so nefarious because they hide themselves as sheep - but make no mistake that they are wolves."\n\nThe Private nodded. He knew he was right, but deep inside he seemed to rebel against his sense. His stomach churned.\n\nThe Officer nodded understandingly. "Go and take a rest outside the square, 10 minutes then come back. If you don't feel right yet I can always assign you to another task."\n\nThe Private smiled slightly. "Thank you sir. You are a good man.""
 FSR_wars.15.a:0 "The order was given to fire, and a single prisoner briefly begged them to stop"

 FSR_wars.16.t:0 "Testimony from Zaragoza"
 FSR_wars.16.d:0 ""People of Zaragoza, for the first time in a century we are truly free."\n\n"Those who tried to capture our souls and turn us against common decency, the very soul of Spain, have been vanquished from our streets. However, across our country there are still terrorists and traitors who seek to destroy our new peace. Our newly claimed peace of mind."\n\n"For years I myself had to lie. I hid myself within organizations that hated Spain. I wanted nothing more than to enrich myself off the toils of the people. I lied to people, who I exploited for power, and I sought to corrupt the next generation to ensure my position."\n\n"I was a Republican, rejecting the very concept of a monarch. I was an atheist, refusing the possibility of any God. I believed in these things because they freed me from any concept of right and wrong. I believed myself to be the arbiter of my own morality. I believed that to be human was to be God; in myself as God."\n\n"The King is ready to return to Spain. The only thing that stops him creating the Spain that has been denied the righteous is how many still reject this truth. Brothers and sisters, we must see past the depravations this struggle has brought us. Look at your siblings. Look at your family. Look at your friends. Do they deny, as I once did? Do they prevent the King taking his righteous place?"\n\n"I was wrong, and now I thank our liberators for showing me the truth of my actions. The men around me in the studio are my brothers. Those who I once swore myself to were traitors. To all those who love Spain, these men are our friends. To swear fealty to the King, is to swear fealty to Spain."\n\n"My name is Diego Pérez. I have been saved.""
 FSR_wars.16.a:0 "From every radio, soldiers made sure the messages played"

 FSR_wars.17.t:0 "Defending Public Order in Guadalajara"
 FSR_wars.17.d:0 "A makeshift market had congregated in the Plaza Guadalajara, surrounded by blasted buildings. The skeletons of the once beautiful buildings stood coldly, grim reminders of the wave of violence that had so recently passed through their city.\n\nThe market was meager. Dirty blankets laid on the ground, equally dirty vendors sitting with them. The wares were grim; rats, battered tins, dirty razors, cigarettes and other things scavenged from the various ruins. Money was accepted, but at beyond extortionate rates. The more frequent trading was barter - the marketplace seeing people trade anything they could just for another meal.\n\nAt a corner, a voice boomed across the gray square. A speaker condemned the soldiers who watched silently from the wings, monitoring them. He proclaimed the King was an antichrist, the demon of their own teachings. He called for the people to not bow to military force, and to accept the evidence of their own eyes.\n\nHe had collected a group quickly and as he spoke, more drifted towards him. The fire in his voice contrasted the cold of the city. Eventually, the soldiers that had acted sentry over the market joined them, and demanded the speech to cease.\n\nThe people turned on the soldiers, shouting at the small group. The Speaker encouraged them, calling them his flock and that the Lord protected all of them from evil if only they had strength. Stones began to be hurled at the soldiers.\n\nA crack rang out. The Speaker fell dead. The market's attendees dove for cover.\n\n"Does anyone else want to say they aren't happy?""
 FSR_wars.17.a:0 "They looked at the corpse and chose their words carefully"

 FSR_wars.18.t:0 "Administrative Woes in Madrid"
 FSR_wars.18.d:0 ""Alejandro, can you please stop being such a perfectionist about this?"\n\n"It's a symbol, a message both to Spain and the world! We have to do this right."\n\nThey had been going in circles for some time, arguing every detail of Madrid's liberation parade and state address. Almost as soon as their soldiers had marched through the city the two civil servants, Alejandro and Diego, had been assigned co-chair roles of a City Administrative Committee.\n\n"Alejandro," piped Diego, "the King won't be there, and most of the city is wrecked. We want something small but meaningful, we don't want pictures of soldiers marching in front of rubble. Surely even you can appreciate why?"\n\n"We can dress it up fine, we have loads of free labor just waiting to be used in the refugee camps. We can clean things up. I've got the route plans, the locations and the choreography all planned. Both our names will be on this, you just need some ambition!"\n\n"The city is bombed to pieces and local logistics are still a mess. Half the citizens are starving, still living in their own shit-"\n\n"So let's give them something to do!"\n\nDiego buried his face in his hands. This once informal meeting still had a huge list of things they needed to talk about, and frankly he was getting sick of his colleagues' enthusiastic event planning. "Fine, you can have the requested resources, but no more. Satisfied?"\n\nAlejandro smiled smugly. "Very. Ok, Next. What were you saying about logistics?""
 FSR_wars.18.a:0 ""It is about time we talked about that""

 FSR_wars.19.t:0 "Indirect Strategies in Toledo"
 FSR_wars.19.d:0 "One box. Two boxes. Three boxes. Twenty boxes. How many boxes? The crates of artillery shells were being opened almost as fast as they arrived as the goliath artillery pieces, some of them ancient relics, rang loud all through the night. The men eventually stopped counting the boxes, as well as the barrels they changed. The guns were incessant.\n\nThey couldn't see their target. The opaque night seemed to swallow the land away from the camp, the electricity of the area long having failed. Sometimes, the artillerymen thought they could make out the silhouette of the distant city buildings as flashes of explosions offered momentary opportunities of light. Most however chose not to look too closely.\n\nThey focused on their work, the soldiers operating as one machine - finely tuned. Their fire rate was consistent, their adherence to training to perfect. The Officers looked on proudly at the men as they expertly worked their task. The artillerymen were determined, their minds trying to focus on the task at expense of all else.\n\nSlowly the day began to dawn, the barrage having lasted all through the night. Such a bombardment was historic, every man felt the weight of history rise with the Sun, however few men could really say they accepted it. The Sun also illuminated their work to history; a shattered visage that barely resembled the Toledo they had seen as they arrived.\n\nMost of the soldiers were dismissed, commanders praising their work. They assured them that thanks to them, many of their compatriots' lives would be saved as they advanced into the city. They deserved a good rest. They walked away, strangely silent the officers thought, while the Section Commander meandered up a hill with his binoculars to proudly look upon his work."
 FSR_wars.19.a:0 ""Fucks sake, we hit the Cathedral. I wanted to see that""

 FSR_wars.20.t:0 "Crowd Control in Valencia"
 FSR_wars.20.d:0 "Tired and ragged masses had been moving through the checkpoint all day, one of the few humanitarian corridors out of the city. It had been decreed that, to facilitate aid and security, only a handful of routes through the perimeter to relocation camps would be permitted. Any found in the restricted outskirts, off the permitted roads, would be shot on sight.\n\nHugo had been leaning on the sandbags of his position for hours, looking down from his makeshift scaffold and absently watching the tide of bodies. Many of them glared at him but he didn't care much. After all, he didn't need to actually talk to them or direct them as those below him did. He just had to look imposing, a big 30. Caliber machine gun set up at his side.\n\n"Long live the Republic!"\n\nA cry pierced the ambient sounds of the weary refugees marching, a single woman breaking out of the throng and running towards an officer. For a second, the soldiers all simply watched with slight amusement and surprise - until they saw the grenade she was clutching.\n\nShe pinned the officer against a wall of one of the street's buildings and pulled the pin. Seconds later, the woman with her arms blasted away flew back, the officer's body a grisly sight. Some refugees and soldiers vomited.\n\nHugo nervously turned back to the refugees, as did many of the soldiers. Some of them were shouting slogans of support, mostly those to the rear who couldn't see for themselves what happened. Hugo heard angry murmurs. He thought he saw hands reaching into jackets. Eyes of hatred seemed to advance towards his scaffold and the men below.\n\n"Open fire!" he yelled instinctively. The men below joined him, firing indiscriminately into the screaming crowd."
 FSR_wars.20.a:0 "The records would show dozens of dead guerillas"

 FSR_wars.21.t:0 "Troop Provisions in Cartagena"
 FSR_wars.21.d:0 "This had been a regular basement mere weeks ago, but the huge crater had changed that.\n\nThe road was battered, holes punctuated the torn skin and hollow buildings. Most of them lay untouched since their ruin but this basement was different. While the building above it had collapsed into a pile of brick, the makeshift passage into it off the street made it a rare place protected from the elements. From it, warm smells emanated.\n\nA line of people stretched for an uncertain distance, having heard of the Priest in the basement. He was firm but fair - you came in, ate your meager soup ration and left. Any attempts at extortion or theft would be met with force from the Priest and his staff - as some brigands had learned. It wasn't much, but food was hard to come by in the City and few wanted to risk the crowded refugee centers. Fewer still the relocation camps.\n\nToday soldiers came before the crater; tired and injured men. The line glared at them; they avoided the gaze. The Priest left his basement, met with a barked official decree from the Transitional City Authority that due to the wartime situation his provisions were being seized. Statutes meaningless to the Priest and his flock were read out.\n\n"I'm sorry, but I can't allow you to take these people's food," he simply said. From the stories the line had heard, they waited for the threat. For him to take control of the situation, show these soldiers to be little more than thieves. After all, he was a man of God, and these soldiers claimed to love the Lord.\n\nInstead he was simply thrown aside, the queue seeing a frail man unable to do anything. The soldiers silently walked into the crater. The people inside were quickly cast out too. A sergeant fired a handgun into the air, dispersing the people who had waited."
 FSR_wars.21.a:0 "They left hungry. Soup was served there no more."

 FSR_wars.22.t:0 "Media Interviews in Badajoz"
 FSR_wars.22.d:0 "Just look into the camera, speak clearly, and ignore the mic. Remember, this might be on TV so smile!\n\n"I moved East when the war started, in a refugee train from Valencia. Honestly? Glad I did, this is the best job I ever had"\n\n"Before the war? I was a taxi driver. Now I'm a tank driver. The pay's not so different but at least I dont gotta look out for traffic no more"\n\n"The City? Ah, I never liked Badajoz. What can I say, I'm Aragonese. So the fact I'm missing out on the sightseeing isn't no big deal"\n\n"To the people back home spreading rumors about us killing civilians? Ah I've heard these types. I think they should come out here, see how many civilians they run into. It's a jungle out here, we're all just doing our part."\n\n"I take guiding my men seriously, but I wouldn't use that word - 'control'. An officer should think about 3 things; God, King and guiding his men. I use that word deliberately, guide. We aren't the Falange after all."\n\n"The food is alright, I mean it is army rations. Makes me think about what I'll do after the war. Yeah I'm gonna be a restaurateur. Hell, looking at this city, buying somewhere won't be too hard. We have a buyer's market!"\n\n"My unit killed a man yesterday. I don't know how to feel about it. We were ordered to and we just did it. We went in, dragged him out in front of his kids and shot him and I don't know why. He wasn't even armed. People back home should-""
 FSR_wars.22.a:0 "Sorry, could we have that again? Try to sound prouder about it this time."

 FSR_wars.23.t:0 "Intercepted Evacuation Near Córdoba"
 FSR_wars.23.d:0 "Young Sofia sat by a dock, on the banks of the Guadalquivir, slightly downriver from Córdoba. She swung her legs, her toes submerged in the cold water. The day was starting to dim, but she was enjoying the pale evening. Her mother would not expect her back for some time anyway, so she sat contented feeling the breeze.\n\nThe War had largely passed them by. Her father had died years ago, and she had no brother. Her and her mother lived simply in a nearby village, and while she had seen the recent new soldiers pass through she hadn't paid them much mind. They were nothing to do with her, and she cared little for fighting, her concerns remained whatever chore her mother prepared for her next.\n\nSomething in the water caught her eyes. A soft green suitcase, floating on the river, was passing by. Curious, she stood up, craning her neck to get a better look. There was nothing particularly noticeable about it, the only thing of note was how unusual it was.\n\nThen she saw another suitcase, then another. She stood watching as within minutes the river was bloated with suitcases. Some seemed damaged. Some burned. Some were stained.\n\nDamaged small boats began to float down and Sofia noticed that they seemed aimless, dangerously drifting. Concerned, she dove into the water and swam out to the leading boat, calling if anyone needed help as she swam.\n\nShe clambered up the rear ladder, and stepped swiftly onto the boat, immediately slipping over. Her landing was surprisingly soft, and as she looked she realized why. The deck was covered with people. Limbs were torn, the paneled wood stained a dark scarlet. Their lifeless eyes stared, where they were connected to bodies. The skin was lifeless. She registered the bullet holes in the boat. There were no drivers, and as she turned with a quivering chin to the other boats, she saw they too were driverless. The stench overpowered her."
 FSR_wars.23.a:0 "She screamed."

 FSR_wars.24.t:0 "Decrees in Sevilla"
 FSR_wars.24.d:0 "The Iglesias family gathered around the radio in their living room, chattering about what the announcements could be. 8pm sharp, as the recently distributed posters had decreed. They lived on the outskirts of the city, and their semi-rural surroundings had been spared the damage suffered by most of the city.\n\nThey had been rather lucky since the battle for Sevilla had begun. The house's patriarch, Joaquín, had been a factory owner before the war and his role had protected him and his sons from the various conscription measures. As soon as the forces of the King had approached, Joaquín had been happy to share as much information as he could with them. He had always been enamored by the idea of monarchy.\n\nThe radio, silent before, began to crackle as the announcement began. "Attention Sevilla, attention Sevilla. Please stand by for important decrees regarding public order." The house's matriarch, Maria, smiled. She had seen the rows of destitute walking out of the city in recent days, some of them looking hungrily at their property. She knew that the King would restore the proper Catholic morals they needed.\n\n"Thank you for your patience," the radio said after a few electronic beeps, "the following decrees are mandated by the Transitional Authority of Sevilla. Take note of the crime and the punishment; ignorance of the law is not an excuse. Punishments will be delivered summaraily"\n\n"Hear hear!" said Joaquín approvingly. As the list began to be read out however, his smile began to waver slightly as surprise took over.\n\n"Obstructing official business: death. Disrupting public order: death. Trespass: death. Subversive thought: death. Theft: death. Vagrancy: death. Blasphemy: death. Insult to clergy: death. Resistance to the King's representatives purchasing property: death...""
 FSR_wars.24.a:0 ""This seems a little strong" mused Joaquín. His wife turned and glared"

 FSR_wars.25.t:0 "Routing Cádiz"
 FSR_wars.25.d:0 "Commander Álvarez fired his tank's machine gun, cutting down the last fleeing enemies in the street. The tank had reached the end of the city; the docks lay ahead of them. He smiled - they had crossed Spain. "Ahead, David!" he called down to his driver.\n\n"Ox Leader 1, Ox Leader 1. HQ calling. Please respond. Over." his radio cracked as they moved closer to the water. Álvarez grabbed the handset from below him. The radio was ancient, probably used in the last civil war and haphazardly thrown into the tank.\n\n"HQ, Ox Leader 1 responding. We've reached the docks." Álvarez looked over the docks as they reached the end of the street. Smoldering wrecks were dotted around - some flashes of gunfire remained on the far side but resistance had all but collapsed. His tank unit's supporting infantry were spreading around the immediate area and no one seemed left to resist. In the water there were many small boats seemingly unarmed.\n\n"Acknowledged Ox Leader 1. Be advised, we have evacuating forces on small boats in the harbor. We cannot allow them to consolidate. Target the ships and destroy as many as possible. Over."\n\n"Are you sure they are military HQ? They look a little colorful for military vessels. Over." Álvarez looked out. With no binoculars the boats were hard to make out, but they were certainly heading out to sea.\n\n"They are confirmed hostile Ox Leader 1. Fire at will. Out."\n\nÁlvarez shrugged. He hadn't come all the way to Cádiz just to let them run away. He returned to the tank column's frequency.\n\n"All units line up on the harbor edge and target the boats in the water. Fire at will.""
 FSR_wars.25.a:0 ""Tally your kills, I'll get the winner a drink""

 FSR_wars.26.t:0 "High Priority Individuals in Barcelona"
 FSR_wars.26.d:0 "The men were held like cattle in a barn near the city. In previous weeks they had been proud members of local socialist militias, defenders of the people from invaders. Eventually, however, their luck had run out. The doors had been locked two days ago after they had been thrown inside and no one had come in or out since. It was dark, the windows boarded up with the only light shining through the small gaps of the wooden walls. In that barn the prisoners stood.\n\nIn the corner was a pile of bodies; the men tried not to look. When they were brought here, some men had been wounded. Others had not eaten or drank in some time. Those unlucky had died trapped with their comrades, and their comrades could not bear to stand with their corpses littering the floor. Dried blood and bile left a stench that was near unbearable.\n\nEventually, the doors opened, shining harsh sunlight into the barn. Orders were shouted to come outside. Those who were still able followed the voice as best they could, leaving behind weakened friends no longer able to stand.\n\n"I want the leaders to step forward," shouted the leader of the soldiers outside, "make yourself known." They stood around in a group, rifles in hand, lazily looking over the bowed prisoners. Despite the protests of the men, the remaining leaders stepped forward.\n\n"Here we are, fascist. Do what you want, but get these men some help. Please" one of them said to the Officer.\n\n"Take them," the Officer commanded, "get rid of the rest. No room." The leaders were seized and dragged away, and while some of the men tried to step forward few had the strength to act."
 FSR_wars.26.a:0 "Even as the rifles were raised at all who remained, their strength failed"

 FSR_wars.27.t:0 "Sightseeing in Girona"
 FSR_wars.27.d:0 "Through the battered streets, Private Santiago walked with a battered tourist map. The city around him no longer had a lot of the beauty that the tourist map promised on it, however the rough outline of the streets could still be made out despite the desolate aftermath of the battle.\n\nOthers were walking around, citizens of the city slowly roving the remains of the city walking on the side of the roads. The middle of the roads had the occasional columns of troops, even the occasional truck, making their way through the newly liberated city.\n\nOn the map, Santiago had written directions, and he was glad for the foresight. The defenders had removed all the damn road signs. He had been 'volunteered' by his unit to walk across half the city by some spook from Intelligence to look at some communist prisons, apparently for anti-socialists. After days of fighting in the city he had been looking forward to some rest, being forced to walk for miles just to look at some ruins was not what he was hoping for.\n\nHe dragged his feet as he walked and fortunately most of the citizens stayed out of his way. His rack and rifle weighed on his back. At first he had tried to walk cautiously, wary of potential snipers or angry civilians, but after hours of walking and the relative crowding of the center he had given up. He just wanted this done.\n\nTurning a corner, he came across the next prison location; a collapsed building, fallen to the side after what looked like a near miss.Only one side remained standing. He walked towards it and looked over the ruin. The prison was apparently in the basement, but surely nothing would be left after a collapse like that? Then again, how many genuine supporters of the King would there be in Girona?\n\n"Ah fuck it, its gone" muttered Santiago, kicking a little dust at the ruin. He walked away, muttering about how this whole thing was a complete waste of time, disappearing once more into the streets."
 FSR_wars.27.a:0 "Intelligence received a long list of prisons confirmed destroyed"
