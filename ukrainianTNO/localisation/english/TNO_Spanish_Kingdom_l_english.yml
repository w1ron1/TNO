 #National Spirits 
 FSR_spirit_zumalacarregui:0 "Дух Сумалакарреґі"
 FSR_spirit_zumalacarregui_desc:0 "Наше Королівство, проголошене після того, як пронімецькі путчисти почали доводити хунту до руїни, є малим та ізольованим гравцем у ширшому контексті Іберійської війни. Карти можуть бути складені проти нас, але ми не можемо падати духом. Легендарний карлістський генерал Сумалакарреґі зіткнувся з іще складнішими умовами під час Першої карлістської війни, але все одно зумів перетворити кількох нещасних партизанів на грізне військо. Натхнений своєю невмирущою вірою в Бога та карлістську справу, Сумалакарреґі долав труднощі, імпровізуючи та впроваджуючи нововведення. Коли його сили поступалися чисельністю, генерал використовував винахідливу партизанську тактику. А коли його люди голодували, Сумалакарреґі створив відомий у всьому світі іспанський омлет із небагатьох доступних йому інґредієнтів. Сьогодні Королівство має шанувати його дух і наслідувати його: пристосовуватися до обставин навколо себе та зберігати віру в перемогу традиції. "
 FSR_precious_cargo:0 "Цінний вантаж"
 FSR_precious_cargo_desc:0 "Рішення не запрошувати королівську родину назад до Іспанії до завершення війни не було рішенням, яке уряд ухвалив легковажно. Зрештою, кінцевою метою Королівства було повернути карлістську династію до влади в Іберії. Присутність королівської родини в країні підняла б бойовий дух військ, а її відсутність дещо стримала початковий оптимізм серед лав Традиціоналістського сопричастя після проголошення Королівства. Водночас існують побоювання, що це рішення було цинічною спробою захоплення влади регентом Вальєнте задля посилення свого контролю над рухом. Зрештою, однак, перебування королівської родини за межами країни було правильним рішенням. Тих, хто має королівську кров, мало, і вони розкидані по світу — вони надто важливі, а ситуація в Іспанії надто небезпечна."

 #Дерево
 FSR_the_sane_choice:0 "Відродження Бурбонів"
 FSR_the_sane_choice_desc:0 "Іберія впала, і разом із нею страждає Іспанія. По всій нашій землі безбожні соціялісти та дегенеративні нацисти шаленіють, руйнуючи нашу культуру своїми хаотичними режимами. Але навіть у цю темну годину є надія.\n\nНашим силам вдалося врятувати деякі райони від перевороту, а війська, вірні справжньому іспанському уряду, мобілізуються. Не втрачайте надії, співвітчизники, адже Бурбони повернулися."
 FSR_the_sane_choice_tt:0 "§LAl legítimo rey se requirió. La reconquista de nuevo comenzó.§!"

 FSR_the_question_of_unity:0 "Питання єдности"
 FSR_the_question_of_unity_desc:0 "Хоча в Іспанії нас може бути небагато, наша рішучість є найсильнішою, адже її живить сила нашої правоти. Разом жоден узурпатор не зможе вистояти проти нас!\n\nВтім, триматися разом виявилося важче, ніж ми спочатку сподівалися. Наш рух пронизаний розколами — від дріб'язкових суперечок до розбіжностей щодо походження. Ми мусимо негайно усунути ці відволікання."

 FSR_reestablish_the_comit_de_accin:0 "Відновити Комітет дій"
 FSR_reestablish_the_comit_de_accin_desc:0 "Хоча ми маємо уряд, ми мусимо забезпечити, щоб наш Король і наш рух діяли як одне ціле, чого проста бюрократія досягти не може.\n\nЗ цією метою ми відновимо Комітет дій — групу, що складається з місцевих і регіональних лідерів та очолюється нашим Монархом. Він не замінить уряд, але дозволить нашому Королівству органічно задовольняти найнагальніші потреби народу, уникаючи деяких неефективностей державної служби."

 FSR_meet_with_carloctavistas:0 "Зустрітися з карлооктавістами"
 FSR_meet_with_carloctavistas_desc:0 "Неможливо досягти консенсусу, не поговоривши спершу з незгодними. Карлооктавісти підтримують іншого претендента на престол, віддаючи перевагу синам Бланки де Бурбон замість дотримання правил престолонаслідування.\n\nОднак їх підтримували франкісти, і значна кількість людей їм симпатизує, що робить їхній вплив наразі неможливо ігнорувати. Ми звернемося до них, щоб з'ясувати, яких компромісів можна досягти для подальшого об'єднання нашого руху."

 FSR_speak_with_the_aet:0 "Поговорити з АЕТ"
 FSR_speak_with_the_aet_desc:0 "По всій Європі університети були ворогами традиції та Бога, часто поширюючи підривні й дегенеративні ідеї через осередки слабкодухих студентів. Однак в іспанських університетах існує група, яка ставить Бога та Хав'єра на перше місце у своїх думках — Об'єднання традиціоналістських студентів.\n\nМи зміцнимо наші зв'язки з ним і підтримаємо його, щоб молодь могла бути врятована від згубного впливу. Ми також зможемо краще наглядати за ними й переконатися, що вони не почнуть відхилятися від нашої справи.\n\nЗрештою, вони все ще студенти."

 FSR_celebrate_the_margaritas:0 "Вшанувати Марґарити"
 FSR_celebrate_the_margaritas_desc:0 "Марґарити — воістину благословенне явище, яке лише ми могли створити в Іспанії. Організація жінок, вірних Богові та Хав'єру, вони відстоюють нашу справу й є символом справжньої традиційної жіночности в цю епоху підриву.\n\nХоча ми ніколи не використовували б жінок так, як інші групи їх ганьблять, їхні жертви в лікарнях, служіння вдома та побожність під час церковних богослужінь не залишилися непоміченими. Ми покажемо їх у пропагандистській кампанії та всіляко сприятимемо їм, щоб традиційні цінності могли бути збережені в родині."

 FSR_rise_requet_rise:0 "Повстань, рекете, повстань"
 FSR_rise_requet_rise_desc:0 "Рекете, наше ополчення часів Другої республіки та останньої громадянської війни, були лютими бійцями, які вселяли страх у серця тих, хто відкидав їхнього Бога та їхнього Короля. На жаль, їхня година знову настала.\n\nПісля років інтеграції до іспанської, а потім іберійської армії ми мусимо створити нові терції солдатів і швидко провести реорганізацію. Більше не ополчення, рекете стануть основою нової іспанської армії."

 FSR_promises_of_public_participation:0 "Обіцянки громадської участи"
 FSR_promises_of_public_participation_desc:0 ""
 
 FSR_promises_of_a_mass_movement:0 "Обіцянки масового руху"
 FSR_promises_of_a_mass_movement_desc:0 ""
 
 FSR_promises_of_continuity:0 "Обіцянки наступности"
 FSR_promises_of_continuity_desc:0 "По всій Іспанії є ті, хто називає нас зрадниками — що ми не більше ніж звичайні узурпатори, які тримають на ниточках лише претендента. Навіть на нашій території нашого Короля та його божественне право висміюють негідники.\n\nЩоб виправити це, ми профінансуємо нову пропагандистську кампанію, аби пояснити як нашому народу, так і самій Іспанії, що насправді саме всі інші є претендентами. Лише ми представляємо Іспанію та її справжню, встановлену Богом адміністрацію. Плакати, радіо- й телевізійні трансляції чітко це пояснять — навіть якщо злодії викинуть людину з її дому, саме вона залишається його законним господарем."

 FSR_dios_patria_fueros_rey:0 "Бог, Батьківщина, Фуероси, Король"
 FSR_dios_patria_fueros_rey_desc:0 "Усі наші зусилля спрямовані на створення богобоязливої, праведної та сильної Іспанії. Понад століття Іспанія не була настільки близькою до такого радісного становища. Уся кров, усі жертви та важкі рішення. Усе це заради того, щоб ми могли створити державу, омиту кров'ю Агнця, а не лише кров'ю наших ворогів.\n\nМи нагадаємо нашому народові про цей факт. Наш Король і Церква говоритимуть із трибуни чи амвона про побожність і цінності, які стануть основою нової Іспанії. Після стількох років хаосу ми подбаємо, щоб наш народ пам'ятав, за що ми боремося."

 FSR_new_navarrese_brigades:0 "Нові наваррські бригади"
 FSR_new_navarrese_brigades_desc:0 "Наварра — суворий край. Раніше тут точилися важкі бої — як проти легіонів Наполеона, так і проти тих, хто виступав проти нашого націоналістичного союзу в останній громадянській війні. У цій війні вона обернулася проти Іспанії та була вкрадена негідними людьми, як розбійник краде гаманець.\n\nТакі несправедливості не залишилися непоміченими, і в цьому краї досі є люди, вправні у веденні бою на такій складній місцевості, які пам'ятають про свою справжню вірність. Ми організуємо цих вигнанців в елітні підрозділи та дамо їм шанс відновити владу Бога й Короля над Наваррою та Іспанією."
 
 FSR_experts_of_propaganda:0 "Експерти з пропаганди"
 FSR_experts_of_propaganda_desc:0 "Наша Іспанія — це місце культури й мистецтва, і одним із мистецтв, у яке ми інвестуватимемо, буде мистецтво риторики. Ми визначили чимало людей, які колись працювали у сферах, пов'язаних із впливом на громадську думку та настрої, як на службі уряду, так і в бізнесі. Ми видаватимемо цим особам спеціальні звільнення від служби за умови, що вони сформують новий дорадчий орган при нашій адміністрації для консультування щодо громадських кампаній.\n\nТакі експерти можуть донести наше послання про побожність, традицію та монархію до нового покоління й значно підвищити ефективність нашої пропаганди."
 
 FSR_experts_of_guerrilla:0 "Експерти з партизанської війни"
 FSR_experts_of_guerrilla_desc:0 "Хоча світло, яке несуть Бог і Король, присутнє на нашій території, багато районів Іспанії все ще перебувають у темряві через тих, хто дотримується дегенеративного та безбожного світогляду. Ми чули, як ці маси волають у темряві, і ми принесемо їм надію.\n\nМи інвестуватимемо в нові проникливі «експедиції» на ворожу територію, використовуючи вправні війська та вигнанців, щоб переслідувати ворожі підрозділи та поширювати карлізм серед місцевого населення. Хоча це ризиковано й дорого, ми подбаємо, щоб тактика, яка знищила Наполеона, знищила й нових ворогів Іспанії."
 
 FSR_azcarragas_marines:0 "Морська піхота Аска́рраґи"
 FSR_azcarragas_marines_desc:0 "Вірний член колишнього Іберійського флоту, Хосе Луїс де Аска́рраґа, звернувся до нас із пропозицією відновити морську піхоту флоту. Він виявив лояльних солдатів, які раніше служили в іберійських збройних силах і добре володіють навичками ведення амфібійної війни.\n\nХоча найближчим часом ми не братимемо участи в боях за морями, такі підрозділи можуть забезпечити плацдарми на річках, щоб завдавати ударів по зрадниках там, де вони найменше цього очікують. Із такими людьми армії, що стоять проти нас, не вистояти."
 
 FSR_autonomous_infantry_battalions:0 "Автономні піхотні батальйони"
 FSR_autonomous_infantry_battalions_desc:0 "Всупереч твердженням наших недоброзичливців, традиціоналізм не означає неуцтва. Війни цього століття показали нам, що ключем до військової перемоги є обмежена автономія, і ми взяли це до уваги. Старі способи ведення війни загинули на полях Франції та Британії, коли їхні мляві армії були знищені динамічними силами Німеччини.\n\nМи видаватимемо нашим офіцерам нові настанови, заохочуючи певний рівень автономії, що дозволить нашим силам реагувати швидше й ефективніше, ніж це зможуть наші вороги. Завдяки еволюції ми стоятимемо міцно."
 
 FSR_in_the_name_of_the_red_beret:0 "В ім'я червоного берета"
 FSR_in_the_name_of_the_red_beret_desc:0 "Хоча символу Бога й Короля мало б бути достатньо, ми визнаємо, що для багатьох простолюдинів ці поняття можуть бути надто абстрактними. Тому ми почнемо зосереджувати нашу військову пропаганду на червоному береті наших рекете.\n\nЦе дозволить усім іспанцям знати, хто бореться за них, а по всій Іспанії символ червоного берета надихатиме людей віддавати все заради служіння своїй країні. Люди нашої армії знатимуть, що берет є символом мужности, і це додасть їм нового запалу для завершення цієї війни."
 
 FSR_mobilise_auxiliary_tercios:0 "Мобілізувати допоміжні терції"
 FSR_mobilise_auxiliary_tercios_desc:0 "Чим довше триває війна, тим ненаситнішим стає голод нашої армії за людьми. Хоча існує певна загальна неприязнь до подальших мобілізацій, ми можемо пом'якшити це, запровадивши допоміжний призов.\n\nПризов чоловіків для служби в тилу на безлічі необхідних допоміжних посад також дозволить перенаправити більше людей на передову, не викликаючи надмірного гніву простолюду. Звісно, знайдуться ті, хто розпізнає нашу хитрість, але їх має бути надто мало, щоб спричинити серйозні проблеми."
 
 FSR_sivattes_catalonian_influence:0 "Каталонський вплив Сіватте"
 FSR_sivattes_catalonian_influence_desc:0 "Маурісіо де Сіватте — людина старої школи навіть за нашими мірками. Людина суворої ортодоксії, або принаймні її власного різновиду, він критикував деякі наші рішення, коли ми вступили у війну. Хоча це дещо дратує, він має свою аудиторію, і тут може бути чимало місця для компромісу.\n\nМи звернемося до Сіватте й дамо йому посаду в наших міністерствах. Це допоможе об'єднати сили традиції в Іспанії, забезпечить нам підтримку його послідовників і, на щастя, змусить його припинити скаржитися."
 
 FSR_urmenetas_basque_connections:0 "Баскські зв'язки Урменети"
 FSR_urmenetas_basque_connections_desc:0 "Хоча жага до капіталу може бути огидною, ми, безумовно, не комуністи. Ми розуміємо, наскільки дорогими можуть бути війни, і здатні на більше, ніж просто відкинути це й вести війну, приставивши рушницю до спини нашого народу.\n\nЧасткове рішення уособлює Міґель Хав'єр Урменета, людина зі зв'язками в північних фінансових і ділових колах. За його підтримки ми зможемо отримати так необхідні для воєнних зусиль гроші та покращити доступ нашого бізнесу до капіталу."
 
 FSR_el_fuero_de_guerra:0 "El Fuero de Guerra"
 FSR_el_fuero_de_guerra_desc:0 "Досі наші економічні позиції були дещо надто реактивними щодо подій або успадкованими від старої іберійської адміністрації. Це призвело до певної плутанини та непотрібної бюрократичної тяганини — речей, які неминуче найсильніше відчувають наші хоробрі солдати. Тому ми створимо всеосяжний програмний документ, що окреслить справжню воєнну економіку.\n\nЦе дозволить нам не лише посилити наші воєнні зусилля, а й сприятиме подальшій реформі нашої економіки в по-справжньому національну, карлістську."
 
 FSR_mobilize_the_countryside:0 "Мобілізувати сільську місцевість"
 FSR_mobilize_the_countryside_desc:0 "Сільська місцевість є бастіоном моралі та віри, і тому ми мусимо вжити заходів, щоб повною мірою нею скористатися. Два пріоритети — постійна потреба в людях і ферми, життєво важливі для нашого продовольчого постачання.\n\nМи проведемо кампанію з вербування, наголошуючи на нашій потребі в богобоязливих і хоробрих чоловіках на передовій. Ми поєднаємо це зі стратегічними звільненнями фермерів від призову, а також інвестиціями у великі ферми, щоб полегшити транспортування їхньої продукції."
 
 FSR_mobilize_the_cities:0 "Мобілізувати міста"
 FSR_mobilize_the_cities_desc:0 "Наші міста є ключем до промислового виробництва, а також містять значну частину нашого населення. Хоча міські жителі можуть бути не такого ґатунку, як ті, хто живе більш традиційним життям у сільській місцевості, їхня чисельність зробить їх основою наших сил. До того ж необхідне нам спорядження не виросте на полях, тому міські фабрики життєво важливі.\n\nМи проведемо кампанію, що висвітлюватиме загрозу, яку претенденти становлять для самого іспанського суспільства в містах, щоб забезпечити відсутність нестачі добровольців, а також надамо кошти стратегічним галузям для покращення їхніх виробничих ліній."
 
 FSR_mobilize_the_exiles:0 "Мобілізувати вигнанців"
 FSR_mobilize_the_exiles_desc:0 "Деякі з найпроблемніших синів нашої нації, які відмовилися зректися свого Короля, опинилися небажаними в Іспанії навіть за нашої присутности в колишньому уряді. Багато хто з них поїхав і досяг значного добробуту в інших країнах. Тепер настав час попросити їх довести відданість, заради якої вони погодилися на вигнання.\n\nМи звернемося до якомога більшої кількости прихильних вигнанців і попросимо їх надати підтримку нашій економіці, чим зможуть. За їхньої підтримки ми матимемо кошти, необхідні для створення Іспанії, яка прийме їх назад із розпростертими обіймами."
 
 FSR_economic_pragmatism:0 "Економічний прагматизм"
 FSR_economic_pragmatism_desc:0 "Хоча національна, богобоязлива та моральна економіка є постійною метою нашої держави, було б нерозумно ігнорувати просту реальність: фундаментальні економічні реформи під час війни, яка перетворила частини нашої нації на анархію, можуть бути не найкращою ідеєю.\n\nМи, звісно, проведемо деякі незначні реформи, але наразі зупинимося, не досягнувши багатьох із проголошених нами цілей, і натомість надамо пріоритет ефективності. Це викличе певні нарікання серед наших радикальніших кадрів, але, на жаль, у воєнний час такі речі необхідні."
 
 FSR_decentralize_the_war_industry:0 "Децентралізувати воєнну промисловість"
 FSR_decentralize_the_war_industry_desc:0 "Промисловість — грубий звір, і якщо його випустити на волю, він може спустошити цілу націю. Достатньо поглянути на дегенеративність Америки чи млявість Японії, щоб переконатися в цьому. Ми визнаємо, що найкращий спосіб стримати цього звіра — забезпечити керівництво праведними людьми, які ставлять на перше місце не капіталістичний розвиток чи особисту владу, а потреби Держави, Короля, якому вона служить, і Бога, який ним керує.\n\nМи передамо контроль над життєво важливими галузями впливовим прихильникам нашої справи та зменшимо державний контроль над ними. Такі люди забезпечать належний бізнес, який підтримуватиме карлістські воєнні зусилля, а зменшення державного втручання дозволить уникнути створення іспанських заїбатсу."
 
 FSR_reestablish_the_sindicatos_libres:0 "Відновити Синдикатос Лібрес"
 FSR_reestablish_the_sindicatos_libres_desc:0 "Хоча соціялістичні профспілки були осередками підривної діяльности та блюзнірства, ми далекі від жорстоких капіталістів. Те, що робітники мають представництво, не є чимось поганим, доки вони пам'ятають про своє становище.\n\nЗ цією метою ми створимо нову національну Робітничу спілку, Синдикатос Лібрес, яка дасть робітникам право голосу з наголосом на християнській моралі та спокійних угодах, заснованих на реальності, а не доктрині. З будь-якими соціялістичними агітаторами, які все ще залишаться, розбиратимуться — або шляхом переслідування, або через нещасний «випадок» на робочому місці, залежно від того, що краще виглядатиме в документах."
 
 FSR_break_up_war_strikes:0 "Припинити воєнні страйки"
 FSR_break_up_war_strikes_desc:0 "Ми не сліпі до потреб нашого народу, ми розуміємо, що війна приносить із собою важкі умови та величезні вимоги, які виснажують людей. Однак деякі дисиденти стверджують, що ми заходимо надто далеко, і використовують ситуацію, щоб підірвати наші воєнні зусилля та допомогти нашим ворогам страйками.\n\nЦе неприйнятно. Ми зобов'яжемо всі робочі місця чітко дотримуватися воєнної заборони на страйки. Для тих, хто й надалі порушуватиме її, будуть показово вжиті заходи, щоб усі їх побачили."
 
 FSR_selfpolicing_workers:0 "Самоконтроль робітників"
 FSR_selfpolicing_workers_desc:0 ""

 FSR_the_hunt_for_grafters_and_corrupters:0 "Полювання на хабарників і корупціонерів"
 FSR_the_hunt_for_grafters_and_corrupters_desc:0 "Донедавна ми були організацією, що скорочувалася й відсувалася на узбіччя іберійської політики. Тепер ми активно боремося за визволення Іспанії. Це спричинило масове й стрімке розширення наших організацій та лав прихильників.\n\nОднак ми усвідомлюємо, що таке швидке розширення означає, що ми не можемо бути певними щодо наших нових братів і сестер. Ми подбаємо, щоб наші служби безпеки пильно стежили за внутрішніми групами, аби шпигуни та зрадники не змогли зсередини зірвати наші зусилля."

 #Події
 FSR_wars.1.t:0 "Пізня нічна порада"
 FSR_wars.1.d:0 "Тупе гудіння телефону тривало недовго, перш ніж слухавку підняли.\n\n«Алло?» — коротко відповіли з іншого кінця. За тоном Хав'єра де Бурбона було зрозуміло, що він не бажає вести пусті розмови.\n\n«Ваша Високосте», — почав Хосе Марія Вальєнте, відкинувшись у кріслі. Кімната була аскетичною, оскільки була частиною конспіративної квартири, розташованої в маленькому містечку в сільській місцевості Іспанії. «Перепрошую, що телефоную так пізно. Я хотів доповісти про результати регіональної ради».\n\n«І?»\n\nХосе потер очі, перш ніж відповісти. «Це... неоднозначно, сеньйоре. Не можу заперечувати, що ми розділені. Все мирно, є спільний ґрунт, але регіональні групи чіпляються до деталей. Вони сперечаються через дрібниці щодо всього — від ведення війни до відповідальності уряду. Боюся, ми можемо почати розходитися по швах».\n\nНа мить у слухавці запала тиша. «Хосе, ми вже близько. Близько до виправлення більш ніж століття мук нашої країни. Ми не можемо дозволити дріб'язковим сваркам відволікати нас зараз».\n\n«Можливо, якби вони могли побачити свого лідера, вся ця нісенітниця зникла б», — замислився Хосе.\n\n«У них є їхній лідер», — відповів Хав'єр, — «у них є ти та віра, яку я в тебе вкладаю. Іспанія не має кращого слуги. Іспанії потрібна сила, владна сила. Дай їм її, не дозволяй їм сваритися».\n\nХосе кивнув сам собі, прокручуючи слова в голові. «Я зроблю це, сеньйоре», — сказав він."
 FSR_wars.1.a:0 "Моя легітимність представлена тобою, отже, так само і моя влада"

 FSR_wars.2.t:0 "Престолонаслідування"
 FSR_wars.2.d:0 "«Це безпечно, сеньйоре Вальєнте?» — запитав охоронець Хосе тихим, мов подих, голосом. Вони йшли табором карлооктавістів, оточені допитливими ополченцями.\n\n«Усе буде добре, Уґо, довірся мені», — твердо й упевнено відповів Хосе. «Ми всі тут друзі, просто друзі, які трохи сваряться. До того ж я вже говорив із їхнім справжнім лідером».\n\nЇх провели до великого намету неподалік центру табору. Його облаштували як кабінет, розкішно оздобивши з огляду на обставини. За столом у центрі сидів чоловік — лідер карлооктавістів.\n\n«Хайме дель Бурґо, радий зустрічі», — сказав Хосе. Хайме подивився на нього й на мить суворо оцінив його, перш ніж запросити обох сісти на підготовлені стільці.\n\n«Я обміркував вашу пропозицію, Хосе», — почав Хайме, — «і те, про що ви просите, не так просто. Наша вірність належить законній Королеві, а не вашому претендентові. Ми не дозволимо використовувати нас так, як Франко використав вас».\n\nХосе внутрішньо здригнувся від цього уколу, але нічим не виказав своїх почуттів. Він дістав свій портфель, витягнув із нього стос паперів і передав їх Хайме. Той переглянув їх, насупивши брови.\n\n«Ось письмова заява з печаткою, у якій ваша “Королева” погоджується співпрацювати з основним карлістським рухом протягом усієї війни. Після її завершення ми урочисто скликаємо Конвенцію про престолонаслідування, де це питання може бути вирішене законним шляхом. Незалежно від результату ваш рух матиме вплив у наших лавах. Чи прийнятні для вас дії вашої Королеви?»\n\nХайме поклав папери й на мить замислився. «Це прийнятно», — сказав він."
 FSR_wars.2.a:0 "Фальшиві обіцянки можуть принести справжні винагороди"

 FSR_wars.3.t:0 "Віра"
 FSR_wars.3.d:0 "«Сестри, роками ми жили під владою тих, хто використовував католицьке суспільство лише як покривало, щоб приховати свою справжню сутність. Приховували зло, що ховалося всередині, як Юда в останні години нашого Господа. Тепер, коли вплив Сатани визнано, а наші чоловіки борються за захист наших домівок, як це робив Архангел Михаїл, життєво важливо звернутися до прикладу Павла й навчити нові покоління благій звістці».\n\nЗала конференції була залита світлом, коли Марія виступала з трибуни. У кожному закутку кімнати, за її оцінкою, сиділа або стояла горда жінка. Членкині Марґарит, ошатно вдягнені та побожні. Жінки, здатні витримати потрясіння війни й залишатися символами благодаті та побожності.\n\n«Ми мусимо пам'ятати, сестри, що вплив диявола може вразити нас у моменти слабкости. Це може статися будь-де: у наших громадах, серед наших друзів і навіть у наших домівках. Чи можемо ми залишити наших дітей беззахисними перед нашим нинішнім духовним становищем?»\n\nЗала загуділа вигуками «ні». Марія усміхнулася й простягнула руки до присутніх. «Це лякає, сестри, я знаю, як усі ви боїтеся за душі своїх родин і друзів. Але не бійтеся, адже світло Господа знову сяє над Іспанією. Незабаром ми матимемо богобоязливого Короля та нове суспільство побожности й добробуту!»\n\nЗала вибухнула оваціями, і Марія почала залишати сцену. Вона запросила на трибуну чоловіка, якого назвала одним із найхоробріших Божих людей в Іспанії, провідного представника Контртерористичного агентства Короля, щоб розповісти їм, як запобігати підривній діяльності.\n\nБіля задньої частини зали жінка молилася на вервиці. Вона молилася не за Марґарит. Вона молилася за душу Іспанії."
 FSR_wars.3.a:0 "Нове бачення старої Іспанії"

 FSR_wars.4.t:0 "Плакат"
 FSR_wars.4.d:0 "Плакат з'явився за ніч — майже на кожній дошці оголошень і, здавалося б, на кожній занедбаній стіні. Яскраві барви зустрілися з яскравим сонцем, коли світанок підіймався над будинками, а перші мешканці почали помічати нове мистецьке доповнення до свого міста.\n\nПлакат був великим, його неможливо було не помітити. У нижньому лівому кутку виднівся клаптик чогось, що нагадувало нормальність. Діти гралися, а мати дивилася кудись крізь вікно, повернувшись спиною до глядача. Усі були вдягнені в яскравий одяг, осяяний сонячним світлом.\n\nЦе вузьке зображення оточував великий намальований солдат, його форма була бездоганною, а на обличчі застигла праведна рішучість. Однак воно не було недобрим — його риси були створені так, щоб дивним чином заспокоювати. Тло було червоним, настільки яскравим, що впадало в очі. У руках він тримав гвинтівку з приєднаним багнетом, спрямовану на двох антагоністів композиції.\n\nУ нижній частині стояв чоловік, одягнений у довгий чорний плащ із каптуром. Він носив круглі окуляри й мав довгий, перебільшений ніс. На його одязі білими літерами було надруковано слово «Демократія». Над ним було чітке зображення Адольфа Гітлера у коричневій іспанській військовій формі, над яким білими літерами було надруковано «Фашизм». Обидва тягнулися до родини за спиною солдата: Демократія майже повзла землею, тоді як Фашизм агресивно нависав над ними.\n\nУнизу також був слоган і відомості про найближчий пункт вербування. Слоган звучав так: «¡Hombres, defiéndanse de la Degeneración!».\n\nЧоловік, який побачив його, того ж дня, повернувшись додому, почув від дружини запитання про те, якими були нові плакати. Вона чула, як сусід розповідав про вражаючий новий плакат для вербування.\n\n«А, нормальні», — сказав він."
 FSR_wars.4.a:0 "У кожного своя думка"

 FSR_wars.5.t:0 "На очах у громадськости"
 FSR_wars.5.d:0 "НОВА ЯСНІСТЬ ЩОДО ЕКОНОМІЧНОГО ДОБРОБУТУ!\n\nНаш лідер, Хосе Марія Вальєнте, сьогодні виступив із добре сприйнятою промовою перед Радою регіональних бізнесменів, запропонувавши довгоочікувану ясність щодо давно обговорюваного коригування економіки після потрясінь, спричинених боягузливими лібералами та жахливими фашистами.\n\nУ своїй промові наш лідер похвалив «значні зусилля тих, хто, подібно до давньої Церкви, що зіткнулася зі злом язичництва, об'єднався у спільній єдності замість того, щоб залишити світ хаосу та безладу». Особливо він похвалив низку спонтанних угод про співпрацю між робітниками та керівниками підприємств, які мирно врегульовували тривалі суперечки в інтересах нашої оборони. Він назвав такі дії прикладами «Вертикального братерства».\n\nНаш лідер також оголосив, що його уряд оприлюднив для відповідних бізнесових груп скорочену версію El Fuero de Guerra — документа, який визначить основу подальшої економічної політики, особливо на час війни.\n\nБуло надано додаткові відомості щодо документа, зосереджені на зусиллях зі створення економіки, заснованої на принципах справедливости та християнської моралі. Заява Економічного управління уточнила, що реформи впроваджуватимуться обережно в інтересах Робітника, а цей документ є лише першим кроком до економічної моделі, гідної великої Іспанії.\n\nПовна історія — на сторінці 3\n\nПовна стенограма промови — на сторінці 38"
 FSR_wars.5.a:0 "Завжди самі гасла та модні слова", — подумав читач, перегортаючи сторінку"

 FSR_wars.6.t:0 "Незмінні угоди"
 FSR_wars.6.d:0 "«Хосе, я ніколи не ставив би під сумнів нашу мету. Однак той факт, що ми зберігаємо елементи Фаланґи в нашій державі, щонайменше викликає занепокоєння».\n\nХосе сидів прямо й нерухомо у своєму кабінеті, хоча через тривалість зустрічі йому хотілося не більше за все на світі відкинутися назад. По той бік столу сидів Хосе Марія Араус, чоловік, який останніми тижнями завдавав йому чимало клопоту. Араус робив заяви журналістам, міністрам і практично кожному, хто був готовий вислухати його перелік реформ. Хосе нарешті втратив терпіння.\n\n«Я поважаю вашу позицію», — сказав Хосе, приховуючи годину роздратування, — «але ви мусите зрозуміти наше становище. Наш уряд і наша економіка? Молоді, борються за життя. Зрадники активно намагаються нас знищити. Ми мусимо діяти обережно».\n\n«Саме тому нам і треба діяти! Вертикальні синдикати продовжують обмежувати наші зусилля зі справжньої зміни цієї країни. Люди мають побачити, що ми налаштовані серйозно, якщо ми хочемо, щоб вони нас прийняли».\n\nХосе хотів би не використовувати цей козир, але не бачив, що ще міг сказати. «Я говорив із Королем сьогодні ввечері. Він погоджується, що швидкі зміни нерозумні», — збрехав Хосе.\n\n«Справді?» — Араус знітився.\n\n«Але він звернув увагу на ваші занепокоєння й вважає їх обґрунтованими. Він доручив мені розпочати зміни в Синдикатах, щоб сприяти майбутньому створенню нашої Національної корпоративної справи. Зрозумійте, ваша рішучість привернула увагу Короля».\n\nАраус пожвавішав, його очі загорілися. Хосе внутрішньо зітхнув. Як легко змусити людей прийняти первісну пропозицію, просто згадавши Короля."
 FSR_wars.6.a:0 "Козир, який використовують рідко, добре зберігається"

 FSR_wars.7.t:0 "Грубе пробудження"
 FSR_wars.7.d:0 "Тихі звуки лісу відбивалися від дерев, поки Педро відпочивав, лежачи біля дерева трохи осторонь від своїх товаришів. Його загін кілька днів ішов через країну, старанно уникаючи доріг і стежок, які час від часу перетинали ліси та поля.\n\nВони були частиною значно більшого взводу, який намагався закріпитися на лісовій галявині, позначеній на деяких регіональних картах. Їм сказали, що вона могла б забезпечити тимчасовий вертолітний майданчик для майбутніх операцій у цьому районі. Педро вважав це непоганою ідеєю — Бог знає, що війна зазвичай ускладнювала евакуацію та пересування; можливість хоч трохи все полегшити була бажаною. Однак у зеленому лабіринті вони загубили свій взвод.\n\nПедро вже засинав під какофонію лісу, коли раптом прокинувся від різкого крику. Командир загону щось кричав. Він зосередився.\n\n«Де, в біса, вартовий? Ви що, не знаєте, що треба виставляти вартового, дурні ідіоти? Я віддам вас під військовий суд!»\n\n«Хіба це не ваша робота?» — відповів один із рядових, заслуживши у відповідь потік образ.\n\nПедро підвівся, щоб підготуватися до неминучого, але раптом напружився. Хруснула гілка. Кущ... ворухнувся? Перш ніж він встиг поворухнутися, півдюжини замаскованих солдатів зі зброєю вискочили назовні. На плечі кожного був знак карлістів.\n\nЗагін завмер, а Педро відступив до них, поки всі підняли руки. Жоден із них не тримав гвинтівки. Карлісти рухалися, мов привиди, мертво тихо наближаючись до них."
 FSR_wars.7.a:0 "Для них війна закінчилася"

 FSR_wars.8.t:0 "Наша Іспанія — монастир"
 FSR_wars.8.d:0 "Єдиним звуком цього світлого теплого ранку був удар молотка по цвяху. Міська площа виглядала свіжою під ранковим сонцем, а страждання війни здавалися міфом. Оголошення, яке прибивали до стіни, майже не порушувало цієї картини, на радість солдатові, адже він не хотів псувати такий ідилічний краєвид.\n\nЗавершивши роботу, солдат відступив, щоб помилуватися результатом успішної, хоч і простої, роботи. На площу зайшов священник. Нічого незвичайного — було відомо, що священник щоранку гуляє містом. Він казав, що це допомагає йому залишатися на зв'язку зі своєю паствою, а мирянам у ці важкі часи було спокійніше бачити його вранці.\n\n«Доброго ранку, солдате, що привело вас до нашого скромного міста?» — весело запитав він солдата. Як Божа людина, він мало переймався самою війною, не бачачи справжньої різниці між своїми братами. На його думку, поки вони сварилися, було важливо, щоб усі завжди розуміли: Бог не займає жодної сторони, крім праведности.\n\n«Доброго ранку, отче», — привітався солдат, — «я приніс громадське оголошення. За неявку на месу без належних обставин тепер стягуватиметься податок».\n\nСвященник зупинився. Оподатковувати тих, хто не бажає відвідувати месу? Священник понад усе хотів, щоб усі шукали спасіння Господа, але не мав жодного бажання змушувати людей приходити до його вівтаря.\n\n«Сину мій, хіба ті, хто поклоняється, не повинні самі обирати це?» — дещо спантеличено запитав він.\n\nСолдат подивився на священника з легкою усмішкою, як батько на нерозумну дитину. «Ох, отче, у ці часи всім нам потрібні Бог і громада, адже є Іспанія. Ті, хто хоче відкинути Бога, ну що ж, вони мають більше сприяти громаді»."
 FSR_wars.8.a:0 "Солдат весело пішов геть, а священник залишився в роздумах"

 FSR_wars.9.t:0 "Закон і порядок"
 FSR_wars.9.d:0 "Площа цілий день пеклася під невблаганним сонцем, і з наближенням вечора спека, здавалося, не спадала. Натовп людей, що заповнив площу, намагався ігнорувати спеку, натомість дивлячись на нову дерев'яну конструкцію, що панувала над колись затишною міською площею.\n\nНа ній стояли четверо людей, зі зв'язаними за спиною руками. Один плакав, один молився, а решта мали скляні погляди. Поруч із ними стояв священник, який читав молитву над засудженими, тоді як чоловік у чорному каптурі перевіряв готовність конструкції позаду них. Цією безпомилковою машиною була шибениця, по обидва боки якої стояла охорона.\n\nНовий міський мер вийшов на поміст шибениці, звертаючись до людей так, ніби це була звичайна сцена. Він говорив про те, що засуджені сьогодні зрадили не лише свою країну, а й свого Бога. Що їх спіймали за позашлюбним статевим актом, маючи незаперечні докази того, що вони прагнули розбестити молодь. Що такі люди стали причиною бід Іспанії. Одна із засуджених озвалася, благаючи, що все це брехня, перш ніж приклад гвинтівки охоронця вдарив її по носу, від чого вона впала, кричачи й скорчившись. Її негайно повернули у вертикальне положення.\n\nМер завершив, заявивши, що сподівається, що сьогодні стане об'єднавчим моментом для всіх містян і зміцнить їхню відданість суспільному благу. Священник спробував заговорити з жінкою, що плакала й чий ніс стікав кров'ю, але охоронці грубо поставили їх на місце. За кілька хвилин вони замовкли, а мертві очі дивилися на людей міста.\n\nМістяни теж мовчали, і лише охоронці навколо площі вигукнули схвальні вигуки, коли люки провалилися. Священник просто дивився на свої черевики, не в змозі зустрітися з чиїмось поглядом. Він сподівався, що Бог не дивиться."
 FSR_wars.9.a:0 "Він побачив блідого коня, а на ньому сиділа Смерть"

 FSR_wars.10.t:0 "Призов у Вальядоліді"
 FSR_wars.10.d:0 "Вальядоліда вже не було видно за спиною, але дим від її руїн було видно безпомилково.\n\nПідрозділ Родріґо фактично було знищено під час оборони. Лише він і жменька людей вижили з того, що колись було цілим взводом. Вони мовчки йшли потрісканою автострадою з похмурими обличчями. Єдиний запряжений кіньми віз ішов разом із ними — усе, що вони встигли зібрати перед втечею.\n\n«Пане», — сержант, можливо, останній із тих, що залишилися, як подумав Родріґо, підійшов до нього, — «дозвольте доповісти?» Родріґо просто кивнув.\n\n«Чоловіки розмовляли, пане. Нам пощастило вибратися, але ми знаємо, що вони прямо за нами. Зараз нас переб'ють, і я гадаю, що частина людей дезертирує, якщо ми не знайдемо підкріплення».\n\nРодріґо продовжував мовчати, зупинившись, щоб обміркувати це питання. Це було правдою: він бачив очі людей, коли вони виходили з околиць, і в них не було ані думок про Бога, ані про Короля. Лише виживання. Ворог міг переслідувати їх будь-якої миті, а їм потрібні були тіла як щити.\n\nКраєм ока Родріґо відчув рух. По той бік дороги проходила колона біженців, які також тікали з міста. Вони були виснажені й відчайдушні. Вони також були беззбройними. Родріґо спала на думку ідея.\n\n«Сержанте, ми ж змогли кинути у віз ящик із гвинтівками, чи не так?» — запитав він.\n\n«Так, пане, кілька десятків старих гвинтівок і боєприпаси», — свідомо відповів той.\n\n«Добре. Збирай людей, ми подбаємо, щоб отримати необхідну чисельність»."
 FSR_wars.10.a:0 "Більшість нових рекрутів померла б до кінця тижня"

 FSR_wars.11.t:0 "Громадські оголошення в Ла-Коруньї"
 FSR_wars.11.d:0 "Вантажівка Хуана постійно підстрибувала й тряслася, намагаючись проїхати тим, що колись було дорогами Ла-Коруньї. Уламки, ями й трупи зробили дорогу майже невпізнанною. Хуан був радий гучномовцю, що грав у кузові вантажівки, — він приховував часті лайки, які той роздратовано вигукував.\n\nМісто було невпізнанним, хоча Хуан ніколи раніше тут не бував. Можливо, колись воно було гарним? Чесно кажучи, Хуан не надто переймався. Це була галісійська місцевість, і вони завжди були йому не до душі. Окрім вантажівки та гучного голосу, що лунав із гучномовця, у місті, здавалося, не було жодного іншого звуку чи ознаки життя.\n\nГучномовець транслював звернення колишнього мера міста, який намагався втекти на південь, до Португалії. Виснажений, трохи надломлений голос повідомляв людям, що битва закінчилася. Сили Короля Іспанії успішно визволили місто від таких людей, як він, які хотіли використовувати його для власного егоїстичного задоволення. Він просив усіх громадян зустріти своїх визволителів із розпростертими обіймами, виконуючи їхні накази, щоб побачити швидкий кінець цієї війни, яку вони нерозумно вели проти справжнього короля.\n\nКоли Хуан продовжував їздити вулицями заздалегідь спланованим маршрутом — хоча й із деякими змінами через несподівано непроїзні дороги, — він поволі почав відчувати на собі погляди. Він ненадовго помічав їх у вікнах, за автомобілями чи стінами. Вони ховалися саме тоді, коли Хуан повертав голову, щоб подивитися на них.\n\nМабуть, вони боялися його вантажівки — зрештою, на її боці був зображений прапор Короля. Однак Хуан не міг їм співчувати. Вони самі спричинили це, дозволивши своїй гордості та его довести ситуацію до таких руйнівних наслідків. Він сподівався, що незабаром усі вони зрозуміють свою помилку, як зрозумів її мер."
 FSR_wars.11.a:0 "Голос мера нісся вітром, і його чули всі"

 FSR_wars.12.t:0 "Закон у Віґо"
 FSR_wars.12.d:0 "«Рядовий Баррера, вас визнано винним у крадіжці, і в мене немає іншого вибору, крім як засудити вас до 12 місяців служби в штрафному батальйоні. Вас заберуть звідси, і ви отримаєте документи про переведення. Удачі».\n\nРядовий відмовився зустрічатися поглядом із полковником, і його вивели з намету. Полковник Аґірре зітхнув. Того дня було проведено дюжину військових судів різного ступеня суворости. Від дрібних крадіжок до вбивства. Ось тобі й відпочинок після визволення Віґо. Проводити військові суди у своєму командному наметі було не надто схоже на відпочинок, але потреба в дисципліні тепер була важливішою, ніж будь-коли.\n\nДо намету зайшов ад'ютант, молодий хлопець, який замінив попереднього після того, як той отримав кулю снайпера під час наступу на Віґо. Аґірре ще не встиг вивчити його ім'я, але хлопець здавався цілком приємним. Охайний і вихований, він тримав під пахвою пакунок, вигляд якого одразу підняв полковникові настрій.\n\n«Пане, ось пакунок, який ви наказали мені забрати. Люди, що його доставили, сказали, що очікують оплати? Вони здавалися напрочуд похмурою компанією».\n\n«Вони знають домовленість», — сказав полковник, забираючи пакунок і поспішно розриваючи його. З нього вийшла пляшка портвейну Real Companhia Velha Royal Oporto Colheita'44. Його очі засяяли, що викликало спантеличений погляд ад'ютанта.\n\nПолковник Аґірре поставив пляшку на стіл, потер руки й почав шукати окуляри. «Ці люди надворі добре вміють знаходити речі на місці, хлопче», — сказав він ад'ютантові. — «Тепер, коли ми врятували це місце, насолодитися плодами перемоги — не злочин»."
 FSR_wars.12.a:0 "Ад'ютантові здалося, що він побачив червоні цяточки на папері пакунка"

 FSR_wars.13.t:0 "Виконання наказів в Ов'єдо"
 FSR_wars.13.d:0 "ЗАПИС РАДІОПОВІДОМЛЕНЬ КОРОЛІВСЬКОЇ АРМІЇ 19** — 19**\n\nМЕХАНІЗОВАНІ СИЛИ ПІВНІЧНОГО КОРОЛІВСЬКОГО КОМАНДУВАННЯ (ПРИДАНІ).\n\nКОМАНДНІ ПЕРЕДАЧІ П.Г. 4\n\nКОМАНДИР БМП 21: Командування, це БМП 21. У нашій зоні вогню перебувають цивільні. Прошу вказівок, прийом.\n\nКОМАНДУВАННЯ: БМП 21, зрозуміло. Чи присутній ворог? Прийом.\n\nКОМАНДИР БМП 21: Укріплена позиція на наступній вулиці веде вогонь на придушення нашої піхоти біля обох виходів із вулиці. Помічено ймовірних біженців, які переховуються всередині позиції. Прошу вказівок, прийом.\n\nПАУЗА 30 СЕКУНД\n\nКОМАНДУВАННЯ: Ймовірно, ополчення. Дозвіл на застосування гармати надано. Підтвердіть, прийом.\n\nКОМАНДИР БМП 21: Там... ми думаємо, що всередині діти.\n\nКОМАНДУВАННЯ: Ополчення допомагає солдатам убивати ваших друзів. Підтвердіть дозвіл, прийом.\n\nПАУЗА 10 СЕКУНД\n\nКОМАНДИР БМП 21: Підтверджую. Кінець зв'язку."
 FSR_wars.13.a:0 "ТАЄМНО: ПОШИРЕННЯ ЦИХ ЗАПИСІВ Є КРИМІНАЛЬНИМ ПРАВОПОРУШЕННЯМ"

 FSR_wars.14.t:0 "Командування в Більбао"
 FSR_wars.14.d:0 "Біля дороги сиділи чоловіки без форми, за винятком червоних пов'язок на руках. Це був знак незліченних соціялістичних ополчень, які виникли, коли королівські сили просувалися через Більбао. Переважно їхні лави складалися зі старих і молодих; усі інші загинули або втекли.\n\nКапітан Торрес дивився на своїх нових полонених із роздратованою суворістю. Вони утримували його підрозділ у бою за заводський комплекс протягом двох днів, здавшись лише після того, як у них закінчилися боєприпаси. Вони коштували Торресу людей і, що найважливіше, часу.\n\nВін ходив уздовж шеренги, полюючи. Він хотів знайти лідера — чоловіка, який утримував його в бою за порожню будівлю протягом двох днів, — але жоден чоловік не мав очікуваної ним статури. Лідер дивився б ворогові в очі, але жоден із цих людей не робив цього.\n\n«А тепер, панове», — сказав він, — «я бажаю поговорити з вашим командиром. Оскільки ви відкидаєте дисципліну форми, мушу зізнатися, що не можу сказати, хто з вас ним є. Якщо ви не назвете себе, пане, я просто почну стріляти в людей, доки ви не покажетеся». Дехто з людей Торреса незручно поворухнувся, почувши це, але він не звернув уваги. Чому його мала б турбувати гидливість слабших людей?\n\nВін навів пістолет на найближчого чоловіка й почав повільно рахувати, оглядаючи шеренгу. На «один» він побачив рух — хтось підвівся.\n\n«А, пане, я вас бачу...» — він зупинився. Підвелася жінка. Жінка, яка дивилася на нього, поки він ходив уздовж шеренги, — те, що він проігнорував. Це було неможливо, жінка не могла—\n\n«Ви хотіли мене?» — кинула вона виклик.\n\nТоррес просто навів на неї пістолет і вистрілив. Він був нездатний говорити."
 FSR_wars.14.a:0 "Які переконання переживуть зустріч із ворогом?"

 FSR_wars.15.t:0 "Патерналізм у Памплоні"
 FSR_wars.15.d:0 "Тріск гвинтівок важко зависав у повітрі. Трупів біля вантажівок ставало дедалі більше.\n\nНа непримітній площі постійно прибували натовпи полонених. Дехто пручався, божевільні очі бачили небуття. Інші були кататонічними, оглушені опором, що вже вичерпався, коли вони проживали свій останній день. Дехто плакав, благаючи невчутливі вуха. Для стрільців оглушені були найкращими. Зрештою, вони працювали довгими змінами. Нові солдати приходили на зміну страчувальникам, залишаючи декого тимчасово забутим біля закривавленої стіни. Однак перед початком один солдат опустив зброю й відійшов, викликавши спантеличені погляди товаришів.\n\n«Рядовий, ви хворі?» — запитав офіцер, який наглядав за процесом, старий чоловік із доброзичливим виглядом.\n\n«Пане, вибачте», — відповів рядовий, — «але я не можу бути частиною цього. Я можу служити в армії Короля проти його ворогів, але ці люди... вони наші полонені...» Рядовий замовк, розриваючись між почуттями.\n\nОфіцер подивився зі співчуттям. «Я розумію, що це важко, і це не робить вас меншою людиною. Сьогодні це просто необхідно. Вороги Іспанії такі підступні, бо ховаються під виглядом овець — але не помиляйтеся, вони вовки».\n\nРядовий кивнув. Він знав, що офіцер має рацію, але глибоко всередині, здавалося, бунтував проти власного сумління. Його шлунок скрутило.\n\nОфіцер розуміюче кивнув. «Ідіть і відпочиньте за межами площі, через 10 хвилин повертайтеся. Якщо вам усе ще буде не по собі, я завжди можу призначити вам інше завдання».\n\nРядовий злегка усміхнувся. «Дякую, пане. Ви добра людина»."
 FSR_wars.15.a:0 "Було віддано наказ стріляти, і один полонений на мить благав їх зупинитися"

 FSR_wars.16.t:0 "Свідчення із Сараґоси"
 FSR_wars.16.d:0 ""Народе Сараґоси, вперше за століття ми справді вільні."\n\n"Ті, хто намагався захопити наші душі та налаштувати нас проти загальнолюдської порядности, самої душі Іспанії, були вигнані з наших вулиць. Однак по всій нашій країні все ще є терористи й зрадники, які прагнуть знищити наш новий мир. Наше щойно здобуте душевне спокойство."\n\n"Роками мені самому доводилося брехати. Я переховувався в організаціях, які ненавиділи Іспанію. Я понад усе хотів збагатитися за рахунок праці народу. Я брехав людям, яких експлуатував заради влади, і прагнув розбестити наступне покоління, щоб забезпечити своє становище."\n\n"Я був республіканцем, відкидаючи саму ідею монарха. Я був атеїстом, заперечуючи можливість існування будь-якого Бога. Я вірив у ці речі, бо вони звільняли мене від будь-якого поняття добра і зла. Я вважав себе арбітром власної моралі. Я вважав, що бути людиною — означає бути Богом; що я сам є Богом."\n\n"Король готовий повернутися до Іспанії. Єдине, що заважає йому створити Іспанію, якої було позбавлено праведних, — це те, скільки людей досі відкидають цю істину. Брати й сестри, ми повинні дивитися крізь позбавлення, яких завдала нам ця боротьба. Погляньте на своїх братів і сестер. Погляньте на свої родини. Погляньте на своїх друзів. Невже вони заперечують, як колись це робив я? Невже вони заважають Королю посісти своє праведне місце?"\n\n"Я помилявся, і тепер дякую нашим визволителям за те, що вони показали мені правду про мої вчинки. Чоловіки навколо мене в студії — мої брати. Ті, кому я колись присягав, були зрадниками. Для всіх, хто любить Іспанію, ці чоловіки — наші друзі. Присягнути на вірність Королю — означає присягнути на вірність Іспанії."\n\n"Мене звати Дієґо Перес. Я врятований.""
 FSR_wars.16.a:0 "Із кожного радіоприймача солдати стежили, щоб ці повідомлення лунали"

 FSR_wars.17.t:0 "Захист громадського порядку в Ґвадалахарі"
 FSR_wars.17.d:0 "На площі Ґвадалахари виник імпровізований ринок, оточений зруйнованими будівлями. Холодні скелети колись прекрасних будівель стояли навколо, похмурі нагадування про хвилю насильства, що так недавно прокотилася містом.\n\nРинок був убогим. На землі лежали брудні ковдри, а поруч із ними сиділи такі ж брудні продавці. Товар був похмурим: щури, пом'яті бляшанки, брудні бритви, цигарки та інші речі, знайдені серед різних руїн. Гроші приймали, але за грабіжницькими цінами. Частіше торгувалися шляхом обміну — на ринку люди віддавали все, що могли, лише заради ще однієї їжі.\n\nУ кутку голос прогримів над сірою площею. Промовець засуджував солдатів, які мовчки спостерігали за ним із країв площі. Він проголосив, що Король — антихрист, демон із їхніх власних учень. Він закликав людей не схилятися перед військовою силою та прийняти те, що бачать на власні очі.\n\nВін швидко зібрав навколо себе групу людей, і в міру того, як говорив, до нього приєднувалися нові. Вогонь у його голосі контрастував із холодом міста. Зрештою солдати, які стояли на варті ринку, приєдналися до них і зажадали припинити промову.\n\nЛюди обернулися проти солдатів, вигукуючи на адресу невеликої групи. Промовець підбадьорював їх, називаючи своєю паствою та заявляючи, що Господь захищає їх усіх від зла, якщо їм лише вистачить сили. У солдатів почали летіти камені.\n\nПролунав постріл. Промовець упав мертвим. Відвідувачі ринку кинулися шукати укриття.\n\n"Хтось іще хоче сказати, що він незадоволений?""
 FSR_wars.17.a:0 "Вони подивилися на труп і ретельно підбирали слова"

 FSR_wars.18.t:0 "Адміністративні негаразди в Мадриді"
 FSR_wars.18.d:0 ""Алехандро, можеш, будь ласка, перестати бути таким перфекціоністом щодо цього?"\n\n"Це символ, послання і для Іспанії, і для світу! Ми повинні зробити все правильно."\n\nВони вже деякий час ходили по колу, сперечаючись щодо кожної деталі параду на честь визволення Мадрида та державного звернення. Майже одразу після того, як їхні солдати пройшли маршем через місто, двох цивільних службовців, Алехандро та Дієґо, призначили співголовами Міського адміністративного комітету.\n\n"Алехандро, — втрутився Дієґо, — Короля там не буде, а більша частина міста зруйнована. Ми хочемо чогось невеликого, але значущого, нам не потрібні фотографії солдатів, що марширують на тлі руїн. Невже навіть ти не можеш зрозуміти чому?"\n\n"Ми можемо все це гарно оформити, у нас є безліч вільної робочої сили, яка просто чекає, щоб її використали в таборах біженців. Ми можемо все прибрати. У мене вже є плани маршруту, місця проведення та хореографія. Обидва наші імена будуть на цьому, тобі просто потрібні амбіції!"\n\n"Місто розбомблене вщент, а місцева логістика досі в безладі. Половина громадян голодує, досі живе у власному лайні—"\n\n"То даймо їм щось робити!"\n\nДієґо сховав обличчя в долонях. Ця колись неформальна зустріч усе ще мала величезний список питань, які їм потрібно було обговорити, і, відверто кажучи, він уже втомився від захопленого планування заходів своїми колегами. "Гаразд, ти отримаєш запитані ресурси, але не більше. Задоволений?"\n\nАлехандро самовдоволено посміхнувся. "Дуже. Гаразд, далі. Що ти там казав про логістику?""
 FSR_wars.18.a:0 ""Саме час нам про це поговорити""

 FSR_wars.19.t:0 "Непрямі стратегії в Толедо"
 FSR_wars.19.d:0 "Один ящик. Два ящики. Три ящики. Двадцять ящиків. Скільки ще ящиків? Ящики з артилерійськими снарядами відкривали майже так само швидко, як вони прибували, поки гігантські артилерійські гармати, деякі з яких були стародавніми реліквіями, гучно гуркотіли всю ніч. Зрештою чоловіки перестали рахувати ящики, як і стволи, які вони змінювали. Гармати не вмовкали.\n\nВони не бачили своєї цілі. Непроникна ніч, здавалося, поглинула землю за межами табору, електрика в цьому районі давно вже зникла. Іноді артилеристам здавалося, що вони можуть розгледіти силуети далеких міських будівель, коли спалахи вибухів на мить освітлювали місцевість. Проте більшість воліла не придивлятися надто уважно.\n\nВони зосередилися на своїй роботі, солдати діяли як єдина машина — тонко налаштована. Темп вогню був стабільним, їхнє дотримання вишколу — бездоганним. Офіцери гордо спостерігали за чоловіками, які вправно виконували свою роботу. Артилеристи були рішучими, їхні думки намагалися зосередитися на завданні, нехтуючи всім іншим.\n\nПоволі почав наставати світанок, а обстріл тривав усю ніч. Таке бомбардування було історичним, кожен чоловік відчував, як тягар історії сходить разом із Сонцем, однак мало хто справді міг сказати, що приймає це. Сонце також висвітлило їхню роботу для історії: понівечений краєвид, який ледве нагадував Толедо, яким вони його побачили, коли прибули.\n\nБільшість солдатів відпустили, командири хвалили їхню роботу. Вони запевнили їх, що завдяки їм життя багатьох їхніх товаришів буде врятовано, коли вони просуватимуться в місто. Вони заслужили хороший відпочинок. Вони пішли геть, дивно мовчазні, як подумали офіцери, тоді як командир секції попрямував на пагорб із біноклем, щоб гордо поглянути на свою роботу."
 FSR_wars.19.a:0 ""Чорт забирай, ми влучили в собор. Я хотів його побачити""

 FSR_wars.20.t:0 "Контроль натовпу у Валенсії"
 FSR_wars.20.d:0 "Втомлені й обірвані натовпи цілий день проходили через блокпост, один із небагатьох гуманітарних коридорів із міста. Було постановлено, що задля сприяння допомозі та безпеці через периметр до таборів переселення буде дозволено лише кілька маршрутів. Усіх, кого виявлять на заборонених околицях, поза дозволеними дорогами, буде розстріляно на місці.\n\nГуґо годинами спирався на мішки з піском на своїй позиції, дивлячись із імпровізованого помосту та байдуже спостерігаючи за потоком людей. Багато хто кидав на нього похмурі погляди, але йому було байдуже. Зрештою, йому навіть не потрібно було говорити з ними чи спрямовувати їх, як це робили ті, хто стояв унизу. Йому треба було лише мати грізний вигляд, із великокаліберним кулеметом калібру .30, встановленим поруч.\n\n"Хай живе Республіка!"\n\nКрик прорізав звуки втомлених біженців, що марширували, коли одна жінка вирвалася з натовпу та побігла до офіцера. На мить усі солдати просто дивилися з легкою розвагою та здивуванням — доки не побачили гранату, яку вона стискала в руці.\n\nВона притиснула офіцера до стіни однієї з будівель на вулиці та висмикнула чеку. За кілька секунд жінка, якій вибухом відірвало руки, відлетіла назад, а тіло офіцера перетворилося на моторошне видовище. Деякі біженці та солдати виблювали.\n\nГуґо нервово повернувся до біженців, як і багато інших солдатів. Дехто вигукував слова підтримки, переважно ті, хто був позаду й не міг власноруч побачити, що сталося. Гуґо почув сердитий гомін. Йому здалося, що він бачить руки, які тягнуться до курток. Очі, сповнені ненависті, здавалося, насувалися на його поміст і чоловіків унизу.\n\n"Відкрити вогонь!" — інстинктивно закричав він. Чоловіки внизу приєдналися до нього, безладно стріляючи в натовп, що кричав."
 FSR_wars.20.a:0 "У звітах було зазначено десятки загиблих партизанів"

 FSR_wars.21.t:0 "Постачання військ у Картаґені"
 FSR_wars.21.d:0 "Ще кілька тижнів тому це був звичайний підвал, але величезна вирва все змінила.\n\nДорога була понівечена, ями вкривали розірвану поверхню та порожні будівлі. Більшість із них залишалися недоторканими відтоді, як були зруйновані, але цей підвал був іншим. Хоча будівля над ним обвалилася в купу цегли, імпровізований прохід із вулиці робив його рідкісним місцем, захищеним від негоди. Звідти долинали теплі запахи.\n\nЛюдей тягнувся невизначеної довжини ряд, які почули про священника в підвалі. Він був суворим, але справедливим — ти заходив, з'їдав свою мізерну порцію супу й ішов. На будь-які спроби вимагати більше або красти священник та його помічники відповідали силою — як уже дізналися деякі розбійники. Це було небагато, але в місті було важко дістати їжу, і мало хто хотів ризикувати в переповнених центрах для біженців. Ще менше — у таборах переселення.\n\nСьогодні перед вирвою з'явилися солдати — втомлені й поранені чоловіки. Ряд похмуро дивився на них; вони уникали поглядів. Священник вийшов зі свого підвалу й почув різку офіційну постанову Перехідної міської адміністрації про те, що через воєнний стан його запаси конфіскують. Зачитувалися статути, які нічого не означали для священника та його пастви.\n\n"Мені шкода, але я не можу дозволити вам забрати їжу цих людей", — просто сказав він. Судячи з історій, які чув ряд, вони чекали на погрозу. На те, що він візьме ситуацію під контроль і покаже, що ці солдати — не більше ніж злодії. Зрештою, він був людиною Божою, а ці солдати стверджували, що люблять Господа.\n\nНатомість його просто відкинули вбік, і черга побачила кволого чоловіка, нездатного щось зробити. Солдати мовчки зайшли у вирву. Людей усередині теж швидко вигнали. Сержант вистрілив із пістолета в повітря, розігнавши людей, які чекали."
 FSR_wars.21.a:0 "Вони пішли голодними. Супу там більше не подавали."

 FSR_wars.22.t:0 "Медійні інтерв'ю в Бадахосі"
 FSR_wars.22.d:0 "Просто дивись у камеру, говори чітко й не зважай на мікрофон. Пам'ятай, це може потрапити на телебачення, тож усміхайся!\n\n"Я рушив на схід, коли почалася війна, у потоці біженців із Валенсії. Чесно? Я радий, що зробив це, це найкраща робота, яка в мене коли-небудь була"\n\n"До війни? Я був водієм таксі. Тепер я водій танка. Платять не набагато більше, але принаймні мені більше не треба стежити за рухом"\n\n"Місто? А, я ніколи не любив Бадахос. Що тут скажеш, я араґонець. Тож те, що я втрачаю можливість оглянути місто, не така вже й велика проблема"\n\n"Людям удома, які поширюють чутки про те, що ми вбиваємо цивільних? А, я знаю таких типів. Думаю, їм варто приїхати сюди й подивитися, скільки цивільних вони тут зустрінуть. Тут справжні джунглі, ми всі просто робимо свою частину роботи."\n\n"Я серйозно ставлюся до керівництва своїми людьми, але я б не вживав це слово — 'контроль'. Офіцер має думати про три речі: Бога, Короля та керування своїми людьми. Я навмисно вживаю слово 'керування'. Ми ж не Фаланга, зрештою."\n\n"Їжа нормальна, я маю на увазі, це ж армійські пайки. Змушує мене думати про те, що я робитиму після війни. Так, я стану ресторатором. Чорт, дивлячись на це місто, купити десь місце буде неважко. У нас ринок покупця!"\n\n"Мій підрозділ учора вбив чоловіка. Я не знаю, що з цього відчувати. Нам наказали, і ми просто це зробили. Ми зайшли, витягли його перед його дітьми й застрелили, і я не знаю чому. Він навіть не був озброєний. Люди вдома повинні—""
 FSR_wars.22.a:0 "Перепрошую, можемо ще раз? Цього разу спробуйте прозвучати гордіше."

 FSR_wars.23.t:0 "Перехоплена евакуація біля Кордови"
 FSR_wars.23.d:0 "Юна Софія сиділа біля причалу на березі Ґвадалківіві, трохи нижче за течією від Кордови. Вона розгойдувала ногами, зануривши пальці ніг у холодну воду. День починав темніти, але вона насолоджувалася блідим вечором. Мати все одно не чекала б на неї ще деякий час, тож вона сиділа, задоволено відчуваючи подих вітру.\n\nВійна здебільшого оминула їх стороною. Її батько помер багато років тому, а брата в неї не було. Вона та її мати просто жили в сусідньому селі, і хоча Софія бачила, як останнім часом повз проходили нові солдати, особливої уваги вона їм не приділяла. Вони не мали до неї жодного стосунку, та й до боротьби їй було байдуже — її турбувало лише те, яку роботу мати доручить їй наступною.\n\nЩось у воді привернуло її увагу. М'яка зелена валіза, що плавала річкою, пропливала повз. З цікавістю вона підвелася, витягнувши шию, щоб краще роздивитися. У ній не було нічого особливо примітного, єдине, що впадало в очі, — наскільки незвичайним було саме її місце тут.\n\nПотім вона побачила ще одну валізу, потім ще одну. Вона стояла й дивилася, як за лічені хвилини річка наповнилася валізами. Деякі, здавалося, були пошкоджені. Деякі обгорілі. Деякі заплямовані.\n\nПочали пропливати невеликі пошкоджені човни, і Софія помітила, що вони, здавалося, пливли безцільно, небезпечно дрейфуючи. Стурбована, вона пірнула у воду й попливла до човна попереду, гукаючи, чи не потрібна комусь допомога.\n\nВона видерлася по задніх сходах і швидко ступила на човен, одразу ж посковзнувшись. Приземлення виявилося напрочуд м'яким, і, поглянувши вниз, вона зрозуміла чому. Палуба була вкрита людьми. Кінцівки були відірвані, панельне дерево забарвлене в темно-червоний колір. Їхні неживі очі дивилися вперед там, де вони все ще були з'єднані з тілами. Шкіра була мертвою. Вона помітила кульові отвори в човні. Водіїв не було, і коли вона з тремтячим підборіддям обернулася до інших човнів, то побачила, що й вони були без водіїв. Сморід накрив її з головою."
 FSR_wars.23.a:0 "Вона закричала."

 FSR_wars.24.t:0 "Укази в Севільї"
 FSR_wars.24.d:0 "Родина Іґлесіасів зібралася навколо радіоприймача у вітальні, перемовляючись про те, якими можуть бути оголошення. Рівно о 20:00, як і наказували нещодавно розклеєні плакати. Вони жили на околиці міста, і їхнє напівсільське оточення було врятоване від руйнувань, яких зазнала більша частина міста.\n\nВід початку битви за Севілью їм неабияк щастило. Патріарх родини, Хоакін, до війни був власником фабрики, і його становище захищало його та його синів від різноманітних заходів із мобілізації. Щойно сили Короля наблизилися, Хоакін був радий поділитися з ними всією інформацією, яку тільки міг. Він завжди був зачарований ідеєю монархії.\n\nРадіо, яке досі мовчало, почало потріскувати, коли розпочалося оголошення. "Увага, Севілья, увага, Севілья. Приготуйтеся почути важливі укази щодо громадського порядку." Матір родини, Марія, посміхнулася. Останніми днями вона бачила, як із міста виходили натовпи нужденних, деякі з яких жадібно поглядали на їхню власність. Вона знала, що Король відновить належну їм католицьку мораль.\n\n"Дякуємо за ваше терпіння", — сказало радіо після кількох електронних сигналів, — "наступні укази встановлені Перехідною адміністрацією Севільї. Зверніть увагу на злочин і покарання; незнання закону не є виправданням. Покарання будуть виконуватися негайно"\n\n"Правильно!" — схвально сказав Хоакін. Однак коли почали зачитувати список, його посмішка почала трохи згасати, поступаючись подиву.\n\n"Перешкоджання офіційній діяльності: смерть. Порушення громадського порядку: смерть. Незаконне проникнення: смерть. Підривні думки: смерть. Крадіжка: смерть. Бродяжництво: смерть. Богохульство: смерть. Образа духовенства: смерть. Опір представникам Короля, які купують власність: смерть...""
 FSR_wars.24.a:0 ""Це здається дещо жорстким", — задумливо промовив Хоакін. Його дружина обернулася й суворо на нього подивилася"

 FSR_wars.25.t:0 "Розгром у Кадісі"
 FSR_wars.25.d:0 "Командир Альварес відкрив вогонь із кулемета свого танка, знищуючи останніх ворогів, що тікали вулицею. Танк дістався кінця міста; попереду були доки. Він посміхнувся — вони перетнули Іспанію. "Уперед, Девіде!" — крикнув він своєму водієві.\n\n"Лідер Віл, один. Лідер Віл, один. Штаб викликає. Відповідайте. Прийом." — затріщало радіо, коли вони наблизилися до води. Альварес витягнув слухавку з-під себе. Радіо було старим, імовірно, використовувалося ще в останній громадянській війні й абияк закинуте в танк.\n\n"Штаб, це Лідер Віл, один. Ми дісталися доків." Альварес оглянув доки, коли вони досягли кінця вулиці. Навколо були розкидані обвуглені уламки — на дальньому боці ще зрідка спалахували постріли, але опір майже повністю зламався. Піхота, що підтримувала його танковий підрозділ, розходилася по безпосередній території, і, здавалося, більше нікому було чинити опір. На воді було багато невеликих човнів, які, здавалося, не мали озброєння.\n\n"Прийняв, Лідер Віл, один. До відома: у гавані на малих човнах перебувають евакуаційні сили. Ми не можемо дозволити їм об'єднатися. Цільтесь у кораблі та знищте якомога більше. Прийом."\n\n"Ви впевнені, що це військові, штаб? Вони трохи занадто барвисті для військових суден. Прийом." Альварес поглянув назовні. Без бінокля човни було важко розгледіти, але вони точно прямували у відкрите море.\n\n"Вони підтверджено ворожі, Лідер Віл, один. Вогонь на ваш розсуд. Кінець."\n\nАльварес знизав плечима. Він не пройшов увесь шлях до Кадіса лише для того, щоб дозволити їм утекти. Він повернувся на частоту танкової колони.\n\n"Усім підрозділам вишикуватися на краю гавані та навестися на човни у воді. Вогонь на ваш розсуд.""
 FSR_wars.25.a:0 ""Рахуйте свої влучання, переможцю я куплю випивку""

 FSR_wars.26.t:0 "Особи високого пріоритету в Барселоні"
 FSR_wars.26.d:0 "Чоловіків тримали, наче худобу в хліві, неподалік від міста. Кількома тижнями раніше вони були гордими членами місцевих соціялістичних ополчень, захисниками народу від загарбників. Зрештою, однак, їхня удача скінчилася. Двері зачинили два дні тому, після того як їх заштовхали всередину, і відтоді ніхто не входив і не виходив. Було темно, вікна забиті дошками, і єдине світло проникало крізь маленькі щілини в дерев'яних стінах. У цьому хліві стояли полонені.\n\nУ кутку лежала купа тіл; чоловіки намагалися не дивитися. Коли їх сюди привели, деякі були поранені. Інші вже давно не їли й не пили. Нещасливці помирали, замкнені разом зі своїми товаришами, а їхні товариші не могли більше терпіти, коли їхні трупи лежали на підлозі. Засохла кров і блювотина залишали майже нестерпний сморід.\n\nЗрештою двері відчинилися, впустивши в хлів різке сонячне світло. Лунали накази вийти назовні. Ті, хто ще міг, якнайкраще слухалися голосу, залишаючи позаду ослаблених друзів, які вже не могли стояти.\n\n"Я хочу, щоб лідери вийшли вперед", — крикнув командир солдатів надворі, — "назвіть себе". Вони стояли групою, тримаючи гвинтівки в руках і ліниво оглядаючи схилених полонених. Попри протести чоловіків, решта лідерів вийшли вперед.\n\n"Ось ми, фашисте. Роби, що хочеш, але допоможи цим чоловікам. Будь ласка", — сказав один із них офіцеру.\n\n"Забрати їх", — наказав офіцер, — "позбутися решти. Місця немає." Лідерів схопили й потягли геть, а хоча деякі чоловіки й намагалися вийти вперед, сил на це майже ні в кого не було."
 FSR_wars.26.a:0 "Навіть коли гвинтівки підняли проти всіх, хто залишився, їхні сили підвели їх"

 FSR_wars.27.t:0 "Огляд визначних місць у Жироні"
 FSR_wars.27.d:0 "Пошарпаними вулицями рядовий Сантьяґо йшов із пошарпаною туристичною мапою. Місто навколо нього вже не мало й близько тієї краси, яку обіцяла туристична мапа, проте грубі обриси вулиць усе ще можна було розгледіти попри спустошені наслідки битви.\n\nІнші теж ходили містом — громадяни поволі блукали серед його решток уздовж узбіч. Посеред доріг час від часу проходили колони військ, а іноді проїжджали вантажівки, рухаючись через щойно визволене місто.\n\nНа мапі Сантьяґо записав напрямки й був радий своїй передбачливості. Захисники прибрали всі кляті дорожні знаки. Його підрозділ "добровільно" відправив його пройти через половину міста за наказом якогось шпигуна з розвідки, щоб оглянути комуністичні в'язниці, начебто на предмет антисоціялістів. Після кількох днів боїв у місті він чекав на відпочинок, а змушений був іти милі лише для того, щоб поглянути на якісь руїни — зовсім не цього він хотів.\n\nВін тягнув ноги, коли йшов, і, на щастя, більшість громадян трималася від нього подалі. Його спорядження та гвинтівка важко тиснули на спину. Спочатку він намагався йти обережно, остерігаючись можливих снайперів або розлючених цивільних, але після кількох годин ходьби й через відносну людність центру він здався. Він просто хотів із цим покінчити.\n\nЗавернувши за ріг, він натрапив на наступне місце в'язниці; зруйновану будівлю, що впала набік після того, що виглядало як близький вибух. Стояла лише одна її сторона. Він підійшов і оглянув руїну. В'язниця, як виявилося, була в підвалі, але хіба після такого обвалу там могло щось залишитися? Хоча, з іншого боку, скільки справжніх прихильників Короля взагалі могло бути в Жироні?\n\n"А, чорт із ним, її вже нема", — пробурмотів Сантьяґо, копнувши трохи пилу в руїну. Він пішов геть, бурмочучи про те, якою марною тратою часу була вся ця справа, і знову зник серед вулиць."
 FSR_wars.27.a:0 "Розвідка отримала довгий список в'язниць, підтверджено зруйнованих"
