 #Персонажі
 FSR_Jose_Valiente:0 "Хосе Марія Вальєнте"
 POLITICS_Jose_Valiente_DESC:0 "Очоливши основну течію традиціоналістів у їхньому невдалому компромісі з Франко, Хосе Марія Вальєнте Соріано зіткнувся з фаланґістською чисткою свого сопричастя. Остання принизлива крапка. Обережна людина, він дотримувався політики, згідно з якою єдиний справжній король має залишатися за межами Іспанії до завершення повстання, і ця політика перемогла. Доти Вальєнте служить леальним регентом Дона Хав'єра та Головою Ради міністрів.\n\nРегент старий: достатньо старий, аби оцінити цю давно втрачену єдність. За повної підтримки самопроголошеного Хав'єра I, кинутої за спину рекете Вальєнте, відчужена карлістська родина повернулася до відновленого Традиціоналістського сопричастя. Не маючи змоги контролювати обставини, що спричинили початкові розколи, досвід, успадкований і вдосконалений часом, добре послужить йому в керівництві відродженим рухом.\n\nВперше за сто років рух має достатньо чисельности, аби самостійно боротися за Бога. Перспективи карлізму переповнені можливостями. Децентралізоване за своїми переконаннями й організацією та горде своєю відмовою від парламентсько-партійної моделі, Традиціоналістське сопричастя виявиться непокірним апаратом для контролю над своєю паствою. Однак наразі розділене лише питанням присутности короля, сопричастя цілковито зосереджене на використанні цього останнього, найкращого шансу для реставрації. Під небесами традиція знову пануватиме.\n\nБургундський хрест знову йде в бій; потертий червоний берет вдягається востаннє."

 FSR_Unorganized:0 "Неорганізоване керівництво"

 FSR_Mauricio_Sivatte:0 "Маурісіо де Сіватте"
 FSR_Mauricio_Sivatte_hog_desc:0 "§YДругий секретар Традиціоналістського сопричастя\nІнтеґралізм§!\n--------------\nНарешті карлістський хрест піднято, і його справжній син повернувся додому. Обурений колаборацією карло-франкістів, доктринальною нечистотою та коливаннями Хав'єра, Маурісі де Сіватте-і-де-Бобаділья мав достатні підстави очолити розкол у русі, заснувавши RENACE. Тепер, коли вирішальна дія, якої вони вимагали, настала, його карло-інтеґралісти повернулися до Традиціоналістського сопричастя. Не заявляючи про це публічно, присутність Сіватте, безсумнівно, сигналізує про повернення легітимности Дона Хав'єра.\n\nПопри відносно безвладне становище заступника секретаря Традиціоналістського сопричастя, Сіватте все ж є силою. Його дріб'язкова посада — маяк, що гуртує всіх непримиренців і каталонських карлістів. Адже саме він відбудував карлістські структури в Каталонії після громадянської війни. І тепер, без потреби в нечистому компромісі, старий каталонський хефе смакує цю можливість повністю відновити свою базу влади."

 FSR_Fidel_Carazo:0 "Фідель Карасо Ернандес"
 FSR_Fidel_Carazo_for_desc:0 "§YМіністр закордонних справ\nІнтеґралізм§!\n--------------\nПоки натовп радіє, у горлі Фіделя Карасо Ернандеса стоїть гірко-солодкий клубок. Для затятого шанувальника Франко та карлістського критика франкістського режиму іншого результату бути не могло. Тепер, повернувшись до справи своєї юности, він очолив Міністерство закордонних справ. Багато інших відмовилися від цієї посади. Ця роль безпрецедентна для карлізму, а дехто вважає її безнадійною. Але цей син пастухів давно знає, як вести за собою людей.\n\nНа міжнародній арені карлізм вважають забутим анахронізмом, а коло потенційних покровителів у нього вузьке. Попри це, Карасо використав свої редакторські навички, знайшовши друзів серед латиноамериканських католицьких груп, які поділяють його переконання, що Бог є джерелом усієї легітимної влади. Пролунав закличний ріг. За особливої підтримки бразильських інтеґралістів іспанське сопричастя знову користуватиметься опікою, що живитиме його, під владою Божого королівства."

 FSR_Jose_Perez_Nievas:0 "Хосе Анхель Перес-Нієвас"
 FSR_Jose_Perez_Nievas_sec_desc:0 "§YМіністр оборони\nІнтеґралізм§!\n--------------\nСеред тих, хто непохитно виступав проти співпраці Вальєнте з Франко, Хосе Анхель Субіаур Алеґре вирізняється тим, що робив це з поміркованої антицентралістської позиції всередині карлізму. На його баскській батьківщині пам'ятають справу фуеристського місцевого та регіонального самоврядування. Але ці задуми належать майбутньому. Наразі він змушений докладати значних зусиль, аби мобілізувати економіку для війни, спираючись на сільські регіони, які є бідними та ностальгують за старими феодальними хартіями.\n\nНаче цього головного болю було недостатньо, Субіауру доручено розробити повоєнну економічну політику карлістів. Йому доручено узгодити історично розпливчасту позицію щодо доповнення ліберального матеріялізму моральним законом і середньовічним корпоратизмом, і дари Вальєнте можуть виявитися отруєними. Попри все, міністр присвятить себе цій справі, прагнучи перевершити численних суперників, які змагаються за лідерство в Наваррі та Країні Басків."

 FSR_Jose_Zubiaur:0 "Хосе Анхель Субіаур"
 FSR_Jose_Zubiaur_eco_desc:0 "§YМіністр економіки\nІнтеґралізм§!\n--------------\nСеред тих, хто непохитно виступав проти співпраці Вальєнте з Франко, Хосе Анхель Субіаур Алеґре вирізняється тим, що робив це з поміркованої антицентралістської позиції всередині карлізму. На його баскській батьківщині пам'ятають справу фуеристського місцевого та регіонального самоврядування. Але ці задуми належать майбутньому. Наразі він змушений докладати значних зусиль, аби мобілізувати економіку для війни, спираючись на сільські регіони, які є бідними та ностальгують за старими феодальними хартіями.\n\nНаче цього головного болю було недостатньо, Субіауру доручено розробити повоєнну економічну політику карлістів. Йому доручено узгодити історично розпливчасту позицію щодо доповнення ліберального матеріялізму моральним законом і середньовічним корпоратизмом, і дари Вальєнте можуть виявитися отруєними. Попри все, міністр присвятить себе цій справі, прагнучи перевершити численних суперників, які змагаються за лідерство в Наваррі та Країні Басків."

