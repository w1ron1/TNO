STC_Carmelo_Ortiz_Taborga: "Кармело Ортіс Таборга"
POLITICS_CARMELO_ORTIZ_TABORGA: "Відновлення Чакської війни президентом Бушем, катастрофічна подія для більшості Болівії, виявилося майже провіденційним для певної групи орієнтальців, зосереджених навколо фігури Кармело Ортіса Таборги.\n\nЦі чоловіки та жінки, відомі як «сепаратисти», провели більшу частину Чакської війни в Асунсьйоні, ведучи інтелектуальну війну словами зі своїми «інтеграціоністськими» опонентами. Обидві групи є вкрай расистськими та зневажливо ставляться до здатності населення західного нагір'я — навіть його білої меншини — самостійно керувати собою. Їхня основна розбіжність полягає в тому, чи означає це, що східні сектори країни, а саме Санта-Крус, разом із власним білим населенням, мають «взяти владу» в країні, чи взагалі залишити її. Після тріумфального вступу парагвайців до однойменного міста департаменту сепаратистська фракція отримала значний матеріальний і пропагандистський поштовх, а також контроль над цивільною адміністрацією окупованої зони.\n\nЇхній лідер, колишній торговець і телеграфіст, був першим, хто вирушив до Парагваю по допомогу у справі незалежності, і його легітимність серед еліти Санта-Крус лише зростала з кожною невдалою спробою Болівії відвоювати місто. Тим не менш, населення регіону, по обидва боки останньої лінії перемир'я, залишається глибоко розділеним у цьому питанні. Більше того, уряд, що керує цивільною адміністрацією окупованого Санта-Крус, сам складається з широкої коаліції ранніх прибічників Ортіса Таборги, членів недовговічної Партії Орієнтального Соціалізму та нового покоління лідерів, що гуртуються навколо «аполітичного» комітету на підтримку Санта-Крус. Хоча ці групи разом охоплюють увесь спектр політичних поглядів у регіоні, багато представників двох останніх груп не до кінця переконані в необхідності незалежності, яка зрештою має єдиним гарантом лише військове становище Парагваю."
