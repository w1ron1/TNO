STC_Carmelo_Ortiz_Taborga: "Кармело Ортіс Таборга"
POLITICS_CARMELO_ORTIZ_TABORGA: "Відновлення Чакської війни президентом Бушем, катастрофічна подія для більшості Болівії, виявилася майже провіденційною для певної групи орієнтальців, зосереджених навколо фігури Кармело Ортіса Таборги.\n\nЦі чоловіки та жінки, відомі як «сепаратисти», провели більшу частину Чакської війни в Асунсьйоні, ведучи інтелектуальну війну слів зі своїми «інтеграціоністськими» опонентами. Обидві групи є високо расистськими та зневажливо ставляться до спроможності населення західного нагір'я — навіть його білої меншини — самостійно керувати. Їх основна розбіжність полягає у тому, чи означає це, що східні сектори країни, а саме Санта-Крус, разом із власним білим населенням, мають «взяти владу» у країні чи покинути її назавжди. З тріумфальним вступом парагвайців до міста Санта-Крус, сепаратистська фракція отримала значний матеріальний і пропагандистський стимул, а також контроль над цивільною адміністрацією окупованої зони.\n\nЇхній лідер, колишній торговець і телеграфіст, був першим, хто звернувся до Парагваю по допомогу в справі незалежності, і його легітимність серед еліти Санта-Крус лише зростала з кожною невдалою спробою Болівії відвоювати місто. Тим не менш, населення регіону, по обидва боки останньої демаркаційної лінії за перемир’ям, залишається сильно розділеним у цьому питанні. Більше того, уряд, що керує цивільною адміністрацією окупованого Санта-Крусу, сам складається з широкої коаліції ранніх прибічників Ортіса Таборги, членів короткочасно існуючої Партії Орієнтального Соціалізму та нового покоління лідерів, які орбітують навколо «аполітичного» комітету на підтримку Санта-Круз. Хоча ці групи складають сукупну більшість політичної думки в регіоні, багато хто з останніх двох груп не повністю переконаний у незалежності, яка, в кінцевому рахунку, має гарантом лише військові успіхи Парагваю."
