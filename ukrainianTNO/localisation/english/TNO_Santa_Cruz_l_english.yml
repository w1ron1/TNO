## Початкові ідеї
STC_oriental_racist_party: "Орієнтальна расистська партія"
STC_oriental_racist_party_desc: "Обидва домінуючі напрямки політичної думки у Санта-Крус (юніонізм та сепаратизм) базуються на припущенні про расову перевагу Санта-Крус над нижчою за статусом «колла», західною частиною країни.\n\nЧи то це проявляється у формі звеличення іспансько-білої чистоти, чи гуарані-метисного воїнського спадку — іноді обидвох речей водночас — сприйняття таке, що «Орієнтальна расистська партія», як її називають західні газети, рішуче налаштована перетворити Санта-Крус на кару для всієї Болівії."
STC_pozo_cano_ghost: "Привид Поцо-Кано"
STC_pozo_cano_ghost_desc: "З 1938 року головним пріоритетом і метою зовнішньої політики Парагваю було досягнення незалежності Орієнта як прелюдії до остаточної анексії Санта-Крус.\n\nРауль дель Поцо-Кано та Бенхаміно Велілья стали вирішальною парою у цьому прагненні, а їхній колишній офіс у консульстві Парагваю в Санта-Крус залишається джерелом значної кількості сепаратистської пропаганди, яка в поєднанні з військовою могутністю Парагваю мала значний вплив на думки нерішучих представників населення Орієнта."
STC_masonic_shadow_war: "Система двох лож"
STC_masonic_shadow_war_desc: "Теорії змов про масонів та їхні ложі є постійною тенденцією у західному світі ще з моменту їхнього поширення. Часто такі змови огортаються антисемітизмом — найвідоміше, звісно, у Німецькому Райху, де звинувачення Гітлера масонів у тому, що вони є єврейською маріонетковою організацією, безпосередньо призвели до організованого державою масового вбивства їхніх членів. Чутки про «масонські змови» стали пугалом для лідерів з усіх боків політичного спектру, яким потрібен зручний цап-відбувайло для проблем їхніх країн, незалежно від правдивості цих чуток чи їхніх наслідків.\n\nСвого роду жорстока іронія полягає в тому, що єдина частина світу, де ці конспіративні думки мають хоч якесь підґрунтя, — це та, де її дві ложі давно повністю відкололися від масонства.\n\n«Кабальєрос дель Орієнте» та «Тоборочі», колись одне ціле, доки «Тоборочі» не відкололася від «Кабальєрос», ведуть жорстоку тіньову війну, яка охоплює політику Крусеньйо. Керівництво — усе члени. Багаті — усі члени. Генерали — усі члени. Впливові — усі члени. Якщо ви хочете чогось досягти в суспільстві Санта-Крус, ви присягнете ложі або залишитеся там, де почали."
STC_rapid_growth: "Орієнтальне диво"
STC_rapid_growth_desc: "Ще два десятиліття тому — чи навіть одне — Санта-Крус був глухим кутом, болівійським визначенням справжньої глушини. Але, як це сталося з арабами, чорне золото під назвою нафта знищило це старе пекло назавжди. Сьогодні освічені крусеньйо напівжартома називають своє рідне місто «Перлиною Орієнту».\n\nВідкриття величезних нафтових родовищ призвело до стрімкого індустріального розширення та загального економічного зростання. Це спричинило демографічний бум, який підживлював стрімку урбанізацію колишньої глушини та будівництво, здавалося б, неперевершених інфраструктурних проєктів, щоб Санта-Крус продовжував розвиватися.\n\n§GНе сумнівайтеся: Санта-Крус переживає свої найкращі дні.§!"

## Революційні ідеї
STC_the_reign_of_terror: "Панування терору"
STC_the_reign_of_terror_desc: "Багатство Санта-Крус є втіленням кривавих грошей, здобутих ціною незліченних життів, які бандити Моронa сплюндрували. Для більшості тих, хто не став жертвою жорстокості крусеньйського МНР одразу, наступним випробуванням стає пограбування їхніх домівок серед білого дня знавіснілими сусідами, які й самі невдовзі переймають ті самі звички. Нечисленні надто «моральні», щоб грабувати, часто лежать мертвими в провулках, убиті власною пихою. Спокута більше не є можливістю — лише смерть здатна звільнити живих від гріхів."
STC_revolutionary_army: "Революційна армія"
STC_revolutionary_army_desc: "Лояльна армія відрізняється від компетентної, хоча ці якості часто поєднуються, але не є нерозривними. Хоча тепер сили Санта-Крус виконують кожен наказ із вуст Сандоваля Морона, ті небагато, хто не слухається, часто стикаються з неприємними наслідками. Сумна реальність полягає в тому, що багато з цих «проблемних» людей виявлялися досвідченими офіцерами. Навіть якщо довірені особи Морона настільки ж компетентні, як і старі генерали, ґрунтовно знищена структура командування залишається серйозним фактором, що паралізує армію."

