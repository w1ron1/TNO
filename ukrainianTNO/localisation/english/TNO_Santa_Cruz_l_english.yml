## Початкові ідеї
STC_oriental_racist_party: "Орієнтальна расистська партія"
STC_oriental_racist_party_desc: "Обидва домінуючі напрямки політичної думки у Санта-Крус (юніонізм та сепаратизм) базуються на припущенні про расову перевагу Санта-Крус над «колла», західною частиною країни.\n\nЧи то це проявляється у формі звеличення іспансько-білої чистоти, чи гуарані-метисного воїнського спадку — іноді обидвох речей водночас — сприйняття таке, що «Орієнтальна расистська партія», як її називають західні газети, рішуче налаштована перетворити Санта-Крус на кару для всієї Болівії."
STC_pozo_cano_ghost: "Привид Поцо-Кано"
STC_pozo_cano_ghost_desc: "З 1938 року головним пріоритетом і метою зовнішньої політики Парагваю було досягнення незалежності Орієнта як прелюдії до остаточної анексії Санта-Круз.\n\nРауль дель Поцо-Кано та Бенхаміно Велілья стали вирішальною парою у цьому прагненні, а їх колишній офіс у консульстві Парагваю в Санта-Крус залишається джерелом багатьох сепаратистських пропагандистських матеріалів, які, у поєднанні з військовою міццю Парагваю, мали значний вплив на схильність нерішучих серед населення Орієнта."
STC_masonic_shadow_war: "Система двох лож"
STC_masonic_shadow_war_desc: "Теорії змов про масонів і їхні ложі є постійною тенденцією у західному світі ще з моменту їх появи. Часто такі змови обгорнуті в оболонку антисемітизму — найбільш відомо про такий процес, звісно, у Німецькому Райху, де Гітлер називав масонів єврейською маріонетковою організацією, що безпосередньо призвело до організованого державою масовим вбивством її членів. Чутки про «масонські змови» стали пугалом для лідерів з усіх боків політичного спектру, які потребують зручного цапа-відбувайла для проблем своїх країн, незалежно від правдивості чи наслідків.\n\nСвого роду жорстока іронія, що єдина частина світу, де ці конспіративні думки мають хоч якесь підґрунтя - це та, де її дві ложі давно відійшли від заповідей масонства.\n\n«Кабальєрос дель Орієнте» та «Тоборочі», колись одне ціле, доки «Тоборочі» не відкололись, ведуть жорстоку тіньову війну, яка охоплює політику Крусеньйо. Лідери — усі члени. Багаті — усі члени. Генерали — усі члени. Здалі — усі члени. Якщо ви хочете досягти чогось у суспільстві Санта-Крус, ви присягнете ложі або залишитеся там, де почали."
STC_rapid_growth: "Орієнтальне диво"
STC_rapid_growth_desc: "Ще два десятиліття тому — чи навіть одне — Санта-Крус був глухим кутом, болівійським визначенням безлюдної глибинки. Але, як це сталося з арабами, чорне золото під назвою нафта знищило це старе пекло назавжди. Сьогодні освічені крусеньйо напівжартома називають своє місто «Перлиною Орієнту».\n\nВідкриття величезних нафтових родовищ призвело до стрімкого індустріального зростання та загального економічного підйому. Це спричинило демографічний бум, який підживлював стрімку урбанізацію колишнього захалустя та будівництво неперевершених інфраструктурних проєктів, щоби Санта-Крус продовжував рухатися.\n\n§GНе сумнівайтесь, Санта-Крус переживає свої найкращі дні.§!"

