STC_Luis_Sandoval_Moron: "Луїс Сандоваль Морон"
POLITICS_LUIS_SANDOVAL_MORON: "Лучо повернувся до свого міста, і цим сказано все.\n\nЛуїс Сандоваль Морон усе своє доросле життя боровся за Санта-Крус, але не за Санта-Крус фашистських недоумків з Расистської Орієнтальної партії, а за справжній Санта-Крус, той, що належить бідним і Болівії. Опір парагвайцям та їхнім сепаратистським колаборантам був революційною боротьбою, частиною якої він пишався бути, і коли він успадкував мантію лідера крусеньйського МНР від Фроїлана Кальєхи Кастро, він знав, що побачить її завершення. Але, звісно, як Ікар, він підлетів надто близько до Сонця.\n\nЙого зрадили не люди, які пам'ятали, хто захищав їх від поміщиків, а його товариші. Брати Чавес Ортіс, отруєні опортунізмом, встромили свої кинджали під час П'ятої Чакської війни, відмовилися підтримати відважні зусилля Болівії зі звільнення свого співвітчизника від парагвайців, а натомість продалися їм. Вони ще й мали нахабство засуджувати Сандоваля за його дії, за його безжальність у веденні боротьби, за заходи, яких Сандоваль вживав, щоб тримати своїх солдатів задоволеними й дисциплінованими. Як мало вони розуміли.\n\nІ все ж їм вдалося перетягнути на свій бік більшість МНР, тож Сандоваля вигнали із Санта-Крус, з його землі, і він вирушив у вигнання. Відтоді минуло багато тяжких років — років, протягом яких він клявся помститися всім, хто скривдив його та Санта-Крус. Років, протягом яких його ненависть дедалі зростала. Але час для вивільнення цієї ненависті нарешті настав. Місто належить йому. Братів Чавес Ортіс невдовзі переслідуватимуть, сепаратистів невдовзі стратять. А їхніх дружин? Що ж, на війні та в коханні все дозволено."
