#Ideas
SWE_folkhem_start:0 "Фолкхеммет"
SWE_folkhem_start_desc:0 "Зразок шведської держави є таким, де держава діє в якості прихистку для народу. Прихистку, у якому його постояльці захищені від природних негод. Якщо "прихисток" залишає своїх мешканців на поталу вовчій пащі чи на милість бурі, то невже він справді є таким? Подібно тому: що таке держава, як вона не здатна захистити свій народ від непередбачуваних аспектів повсякденного життя, або від ворожих елементів у всякчас несталому середовищі?\n\nБезсумнівно, шведська держава існує не задля престижу, не заради величавості - та для свого народу. Вона сприяє соціальній і політичній участі мас, чиї основні потреби ніколи не піддають ризику. Оплот теплоти в холодному світі."
SWE_schwedenisierung_3:0 "Обережна співпраця"
SWE_schwedenisierung_3_desc:0 "Незважаючи на те, що в народі шведська держава відома бастіоном світла й свободи, вона тісно співпрацює з імперією, яка відповідає цьому визначенню абсолютно зворотно. Оточена німцями й їхньою імперією - Айнхайтспактом, Швеція конструктивно й близько співпрацює з Німецьким Райхом; це виявилося благом. Німецькі інвестиції в сфері промисловості забезпечують роботу тисячам шведів.\n\nНімці задоволені підтримкою цих вигідних відносин, доки шведський уряд час від часу прогинається під Райх. Райх тримає Швецію не зашморгом, а теплим рукостисканням, і це влаштовує шведський народ."
SWE_exports_3:0 "Експорт до Німеччини"
SWE_exports_3_desc:0 "Могутня німецька промисловість має чималі потреби, а з великою промисловістю - приходить великий попит на руду. Шведські гірничодобувні компанії скористалися цим, узявши на працю в залізних копальнях тисячі шведів по всій країні, і отримавши від цього чималі прибутки. Також німецькі фірми, такі як Райхсверке, отримали концесії на підпорядкування собі великих шахт у країні, використовуючи сотні привезених рабів (яких без проблем документують як трудових мігрантів) для видобутку багатств із-під шведської землі. У результаті Швеція користується досить щедрими торговельними привілеями з країнами Айнхайтспакту. Привілеї, що для будь-якого шведського бізнесмена значать набагато більше життя якихось закордонних рабів."
SWE_statare_2:0 "Реформовані статаре"
SWE_statare_2_desc:0 "Система "статаре" в історії була програмою, за якою сільськогосподарські робітники працювали за контрактом, натомість отримувавши дах над головою й їжу. Програма проіснувала до 1945 року, коли її реформували, щоб охопити більше секторів економіки з правомірною вимогою для поліпшення умов життя. Хоч дехто критикує цю програму, її прихильники стверджують, що вона допомогла країні відновитися після війни, яка забрала чимало життів шведських молодиків."
SWE_eugenics_3:0 "Примусові стерилізації"
SWE_eugenics_3_desc:0 "Шведську програму євгеніки започаткували в 1906 році, і вона лиш зростала з широкою нормалізацією подібних практик у післявоєнній Європі. Нехай вона й не наближається за масштабами до німецької, шведська програма євгеніки передбачає з одного боку примусову стерилізацію людей з різними спадковими захворюваннями, а з іншого - і людей, які не здатні бути батьками через залежності чи інші соціальні проблеми. Репрезентують це для публіки, як програму громадської охорони здоров'я - не більше."

#Events
victoria.3.t:0 "Хто така "Victoria", і чому їх цілих три?"
victoria.3.desc:0 "Таге Ерландер тихо пихкотів цигаркою, здіймаючи в повітря хмаринки диму й дивлячись на гору паперів із байдужістю, яка безупинно росла на його столі. Він повідомив своїй секретарці не турбувати його сьогодні, бо настав час працювати, і лиш він та Бог знали, скільки роботи чекає. Залізниці й шахти на півночі, порти й кораблі на півдні, перекидання нових мобілізованих і дивізій на кордон із Норвегією… для настільки відносно незначної країни, як Швеція, багато було за чим наглядати.\n\nТа що Таге Ерландер ніяк не міг передбачити, то це портал, який відкрився в стіні праворуч від нього, і чоловіка в футболці з логотипом, окулярах і джинсах, що визирнув крізь нього.\n\nЕрландер миттю підвівся. "Хт- хто ти? Як ти сюди потрапив?", - заволав він. Чоловік ані втік, ані налякався: натомість лишень озирнувся до Ерландера, і лідер Швеції виявився безпорадно прикутим до свого стільця.\n\n"Спокійно", - попросив він, і Ерландер раптом відчув невідворотну потребу закрити свій писок. "Я Ден Лінд, із Paradox Interactive".\n\nЕрландер боровся зі своїєю скутістю, проте це було марно. Ден поглянув на його намагання з тихою посмішкою, перш ніж продовжити. "Згідно з Користувацькою угодою Hearts of Iron IV, ресурси вашої країни... реквізовуються для використання в останньому проекті Paradox Interactive". Він вказав на свою футболку.\n\n"Я не розумію!", - Ерландер заридав, дивившись на іншого чоловіка, одягненого в величне вбрання часів вікторіанської доби й у чудовому капелюсі, що вийшов через портал і зайняв своє місце поруч із Деном. "Хто цей Парадокс? Що в біса таке "Залізні серця 4"?", - Ден проігнорував його прохання, продовжуючи свою промову.\n\n"Як я вже сказав, ваша країна перебуватиме під наглядом сера Мартіна Енворда, хоча ви можете кликати його Віз. Учинення опору спонукатиме до негайного звільнення. Гарного вам дня, і не забудьте купити Victoria 3, незабаром!". Ден і "Віз" посміхнулися в неіснуючу камеру, до того як перший чоловік зник, залишивши Ерландера наодинці зі своїм новим володарем."
victoria.3.a:0 "Підтверджено."

