#Leader Descriptions:
POLITICS_OLOF_PALME_NOTUSED_DESC:0 "Провідний член шведського робітничого руху в дорослому віці, Улоф Пальме не міг похизуватися скромним походженням, оскільки родом він із заможної консервативної лютеранської родини в Стокгольмі. Дитина, падка на хвороби, яка мала немало часу для читання книжок, у юному віці вивчила англійську, французьку та німецьку мови - це стало їй у нагоді в подальшому житті. Під час Другої світової, Пальме недовго послужив у шведській армії, переживши найжахливіший страх народу перед вторгненням німців. Пальме виїхав до Сполучених Штатів, аби продовжити своє навчання - і саме тут, він почав означувати свої політичні ідеї. Зустрічі з Національним прогресивним фронтом ознайомили його з проблемами расизму та класової боротьби, а недовга подорож до Азії розкрила йому жахіття японського імперіалізму. Повернувшись до Швеції наприкінці 1950-х, Пальме був готовий долучитися до шведської політики. На виборах 1958 року, він потрапив до Риксдагу, а його праця в різних урядових відомствах зробила Пальме ще більш популярним, як частково радикального й прогресивного діяча. За два роки він став заступником прем'єр-міністра: а наприкінці 1961 року, Таге Ерландер пішов у відставку на користь свого ставленика.\n\nХай Улоф Пальме й пропрацював на посаді прем'єр-міністра недовго, він стрімко справив неабияке враження. Його хист до красномовства виявився життєво важливим, коли громадськість вперше відреагувала на призначення такого молодика наступною головою уряду. Візити прем'єр-міністра до деяких дипломатично ізольованих країн викликали досить розбіжну реакцію: як серед шведського суспільства, так і між світовою спільнотою, особливо вирізняючи його візит до комуністичної Куби. Прем'єр-міністр не цурався дорікати диктаторським режимам, що панують Європою; водночас, дотримуючись обачної політики умиротворення. Настає 1962 рік, і Улоф Пальме приступає до виконання своїх обов'язків усерйоз. Його політику нерідко критикують, як суперечливу, а іноді й непопулярну - але ніхто не може стверджувати, що він негідно впорався зі своєю новою роллю."

POLITICS_TAGE_ERLANDER_DESC:0 "Прем'єр-міністр Пер Альбін Ганссон раптово помер, коли сходив із потяга в Стокгольмі в 1945 році. Величезну спадщину по собі залишив Ганссон. Його перебування на посаді голови уряду значуще змінило становище шведської нації, і навіть в останню мить свого життя не виражав бажання зупинитися. То ж, доволі неочікувано, міністру освіти Таге Ерландеру довелося самотужки очолити як і Соціял-демократичну партію, так і Швецію загалом. Уряд Ерландера сформувався в часи великої невизначеності для Швеції. Європи, якою її знала країна, більше не існувало: заступив її новий, німецький порядок. Швеція була відтепер єдиною країною Скандинавії, яка не перебувала під прямим німецьким правлінням. Навіть тоді, коли війна в Європі близилася до закінчення, здавалося, що країна не зможе існувати таким чином довго. Аби запобігти такій долі, Ерландер привідчинив Швецію для торгівлі й співпраці з Німеччиною. Дане рішення незабаром постало основним аргументом проти соціял-демократичного уряду, позаяк Народна партія взялася займати чітку проамериканську точку зору.\n\nВідтоді Ерландер проявив себе тим, хто старанно засвоїв часи Ганссона. Хай він не настільки харизматичний, як його попередник, та політика прем'єр-міністра вберегла його популярність. Загальне медичне страхування, більші пенсії та розширена система опіки над дітьми - лише деякі з реформ, проведених наприкінці 1940-х і 1950-х років. Чимало з цього вдалося досягти завдяки невеликій армії, і - раптовій вигоді від торгівлі з Німеччиною.\n\nУтім, у Швеції не все гаразд. Ерландер знайомий із обточеними спробами Німеччини повпливати на націю - про що також опозиція публічно висловлюється. Подальші роки покажуть, чи ціна за "Фолкхеммет" усе ще зможе виправдати себе."

POLITICS_WIZ_DESC:0 "Ніколи до цього життя стількох людей не змінювалося настільки стрімливо, як уперше загуділи двигуни - із стугіном, що розлинувся континентами. Люди закладали основи революції в кіптяві та попелі, що вкривали вулиці, візіонери крамарства й дипломатії розбурхували світ, а блиски натхнення злітали до небес. Угорі, там - над трубами, що пихкотять, здіймалася обіцянка впевненості в успішному майбутньому. І саме на Мартіна Енворда - Лорда Віза Чаддінґтонського, поклали серйозну відповідальність наблизити це щасливе майбуття.\n\nКоли його шановані співробітники корчилися в своїх кріслах від обурення тисячі мільярдів тролів і селюків: серед понурої темряви теперішнього сьогодення, Віз здійнявся зі свого зіркового полотна, завітного творіння свого, Stellaris - аби надати нову гру нам, скромним гравцям-кріпакам, що має замінити старий і золотавий проєкт, яким була Victoria II. Може це бути легко й не дуже.\n\nВелика відповідальність стоїть перед Візом, за створення наступника гри, яка зберегла свою шанобу впродовж десяти з гаком років існування. Подібного завдання, мабуть, вистачило би, щоб знівечити розум менш навченого розробника - проте він не такий. Під аплодисменти тисячі трильйонів підлесливих ґеймерів, разом зі мною - Лорд Віз Чаддінґтонський береться за черговий визначний проєкт.\n\n§GTL:DR - VICTORIA 3 ПІДТВЕРДЖЕНА§!"

