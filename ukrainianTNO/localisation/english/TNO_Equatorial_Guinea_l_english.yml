 ##Events
 EQG_FOR.1.t: "Становище Екваторіальної Гвінеї"
 EQG_FOR.1.d: "Розпад Іберійського союзу призвів до створення кількох нових держав на африканському континенті. Однією з таких держав є Республіка Екваторіальна Гвінея, розташована на захід від наших союзників у регіоні Конґо.\n\nПотреба молодої держави в торговельних партнерах і допомозі для доповнення її можливостей розвитку, на щастя, спонукала її зблизитися з нашою Економічною сферою, відкривши можливість для подальших дій у майбутньому. Хоча її корисність тьмяніє порівняно з її сусідом, більший контроль над континентом може лише принести нам користь."
 EQG_FOR.1.a: "Світло свободи сяє дедалі яскравіше."

 EQG_FOR.2.t: "Становище Екваторіальної Гвінеї"
 EQG_FOR.2.d: "Розпад Іберійського союзу призвів до створення кількох нових держав на африканському континенті. Однією з таких держав є Республіка Екваторіальна Гвінея, розташована на захід від наших союзників у регіоні Конґо.\n\nПотреба молодої держави в торговельних партнерах і допомозі для доповнення її можливостей розвитку, на щастя, спонукала її зблизитися з нашою Економічною сферою, відкривши можливість для подальших дій у майбутньому. Хоча її корисність тьмяніє порівняно з її сусідом, більший контроль над континентом може лише принести нам користь."
 EQG_FOR.2.a: "Радісні новини!"

 EQG_FOR.3.t: "Становище Екваторіальної Гвінеї"
 EQG_FOR.3.d: "Розпад Іберійського союзу призвів до створення кількох нових держав на африканському континенті. Однією з таких держав є Республіка Екваторіальна Гвінея, розташована на захід від наших союзників у регіоні Конґо.\n\nПотреба молодої держави в торговельних партнерах і допомозі для доповнення її можливостей розвитку, на щастя, спонукала її зблизитися з нашими союзниками в Західній Африці, а отже, і з нашою Економічною сферою, відкривши можливість для подальших дій у майбутньому. Хоча її корисність тьмяніє порівняно з її сусідом, більший контроль над континентом може лише принести нам користь."
 EQG_FOR.3.a: "Їхній успіх — це наш успіх."

 EQG_FOR.4.t: "Становище Екваторіальної Гвінеї"
 EQG_FOR.4.d: "Розпад Іберійського союзу призвів до створення кількох нових держав на африканському континенті. Однією з таких держав є Республіка Екваторіальна Гвінея, розташована на захід від наших союзників у регіоні Конґо.\n\nПотреба молодої держави в торговельних партнерах і допомозі для доповнення її можливостей розвитку, на щастя, спонукала її зблизитися з нашими союзниками в Західній Африці, а отже, і з нашою Економічною сферою, відкривши можливість для подальших дій у майбутньому. Хоча її корисність тьмяніє порівняно з її сусідом, більший контроль над континентом може лише принести нам користь."
 EQG_FOR.4.a: "Їхній успіх — це наш успіх."
 
 #Ideas
 EQG_Preelection_Shock: "Потрясіння перед виборами"
 EQG_Preelection_Shock_desc: "Попри те, що обіцянка неминучих виборів усе ще залишається далекою невизначеністю, різні фракції, що змагаються за правління Екваторіальною Гвінеєю, вже перенесли свою боротьбу на вулиці.\n\nЗбройні сутички між ополченцями, що належать до тієї чи іншої партії, стали щоденним явищем — від провулків Бати та Малабо до самої сільської місцевости, здебільшого в надії завчасно усунути своїх противників ще до початку голосування.\n\nОднак доки обстановка не буде визнана достатньо стабільною для відкриття виборчих дільниць, кожен день, коли Тимчасовий уряд не може стримати розгул хаосу, означає ще один день, який народові Екваторіальної Гвінеї доведеться чекати на відповідь на питання про невизначене майбутнє їхньої країни."

 EQG_Towards_Integration: "На шляху до інтеграції"
 EQG_Towards_Integration_desc: "Коли соціялістична Народна ідея Екваторіальної Гвінеї несподівано вийшла переможцем у хаотичній боротьбі на перших виборах, питання невизначеного майбутнього країни було вирішено вельми дивною відповіддю: її доля лежить не самотньо, а серед решти її африканських товаришів.\n\nПочинаючи, звісно, з Камеруну, звідки новообраний уряд, що не дивно, отримує значну підтримку.\n\nТож поки всі адміністративні зусилля незабаром недовговічної республіки будуть спрямовані на федерацію з її північним сусідом. Аж доки одного дня Екваторіальна Гвінея не зможе приєднатися до обіймів своїх братів і сестер, втілюючи панафриканську мрію."

 EQG_Grand_Coalition: "Велика коаліція"
 EQG_Grand_Coalition_desc: "У несподіваному повороті затяжне змагання за правління Екваторіальною Гвінеєю виграли помірковані голоси MUNGE та MONALIGE, ситуативні союзники у великому центристському блоці, єдиною метою якого, здається, є стримування їхніх радикальніших противників з усіх боків політичного спектра.\n\nПопри обіцянки довгоочікуваної стабільности після хаотичних років навколо перших виборів молодої республіки, об'єднаний фасад нового уряду приховує хитку коаліцію конфліктних особистостей і суперечливих амбіцій, що загрожують розколоти її за найменшого тиску.\n\nТа якщо їй якимось чином вдасться уникнути краху під вагою власних суперечностей, цей нечестивий союз може стати першим із багатьох, що здійснять обіцянку вільної та демократичної Екваторіальної Гвінеї."

 EQG_Bioko_Nationalism: "Біокський націоналізм"
 EQG_Bioko_Nationalism_desc: "Як і решта Африки, народ, що називає землю Екваторіальної Гвінеї своїм домом, далеко не є однорідним.\n\nХоча Тимчасовий уряд здебільшого постав із ядра народу фанг із континентальної частини країни, острови, розкидані вздовж узбережжя затоки, населені безліччю етнічних груп, які почуваються непредставленими в новоздобутій незалежності країни; найбільш помітними серед них є народ бубі з головного острова Біоко, де також розташована столиця молодої держави.\n\nВід поміркованих представників, які висловлюють бажання хоча б певного ступеня автономії, до тих, хто вимагає повної незалежности свого острівця, ці голоси можуть стати більш нагальною проблемою, якщо до них прислухається конкуруюча держава, яка може побачити вигоду у зростанні невдоволення."
