POLITICS_FU_ZUOYI_DESC:0 "Чи був Фу Цзої зрадником?\n\nСлід дослідити минуле цього колись героя війни й бійця-довгожителя Національно-революційної армії, аби знайти вашу відповідь. Слава тому, як він кинувся в полум'я революції 1911-го, коли йому минало шістнадцять років; слава тому, як маючи командування губернатора Шаньсі Янь Сішаня на початку 1930-х, присвятив свої сили й свій розум на користь тієї землі, що звали Суйюань, під його очільництвом; і слава тому, як він боровся до останнього, аби захистити її від японського гніту, одержуючи нищівну перемогу за перемогою проти підступного Демчиґдонрова та його поводирів.\n\nФортуна, втім, довго не триває. Зрештою під кривавими багнетами, що стали такими після операції "Ґо-Ґо", Суйюань впав - потім і Шеньсі. Зник і Фу, разом зі своїм колишнім покровителем. Дуже легко, значить, вказати пальцями на підозрілу появу обидвох, саме в час для переговорів; і на їхнє прагнення піднести себе, як рішуче рішення проблеми партизан на прикордонних територіях, повернувши таким чином Яню його дорогу батьківщину, а Фу - надавши те гнітюче кубло злодіїв, яким було Шеньсі. Для пересічного глядача це може бути зрадою Китаю, що неможливо пробачити; для Фу, то його остання спроба вберегти шляхетних однодумців-патріотів від цілковитого винищення, навіть якщо це означає продати власну душу загарбникові. Давши їм безпечний шлях до втечі - незважаючи на дорікання Янь Сішаня - він поклявся своїм життям, що одного, бодай одного дня, воз'єднається з ними в їхному визвольному поході ще раз.\n\nВін дотримувався тієї клятви, яку склав, коли пов'язав себе з новою рідною землею й її народом, як було з Суйюанем. Він дотримувався тієї клятви, навіть коли старий товариш Янь відійшов у небуття, а Шаньсі перейшов під його керівництво. Ба навіть сьогодні, коли він - беззаперечний керманич двох провінцій, то продовжує триматися цієї клятви. Та вогник надії перед його очима слабшає й тускліє з кожним роком: Фу тільки може спостерігати за тим, як и'ясник Цуджі витанцьовує свій кривавий вальс вздовж західних кордонів Шеньсі, а вогник гасне й тріщить, готовий от-от згаснути наступної миті.\n\nТак чи був Фу Цзої зрадником? Хай історія його розсудить, бо він зробив вже усе, що міг." 

