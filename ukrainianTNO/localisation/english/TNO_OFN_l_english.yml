l_english:
 OFN_CAR_african_crisis:0 "Центральна Африка розвалилася!"
 OFN.1.t:0 "Південноафриканський саміт"
 OFN.1.desc:0 "Настала довгоочікувана дата організованого американцями «Самміту щодо поліцейської операції в Південній Африці». Представник Сполучених Штатів виступив із досить палкою промовою про необхідність для ОВН об'єднатися заради цієї битви, інакше організація почне втрачати своє значення. Було зазначено, що відсутність співпраці в Єдінґспакті призвела до очевидної загибелі Німеччини, а Японія ніколи не могла б розраховувати на єдину багатонаціональну військову відповідь, яку здатна організувати лише ОВН. Також було висунуто натяк на страх, оскільки американські делегати намагалися наголосити, що нездатність відповісти на цю загрозу призведе до того, що загрози дістануться членів ОВН.\n\nПромова Макнамари отримала оплески на чолі із заступником міністра Стиккером та іншими представниками різних урядів у вигнанні, а також певне схвалення від делегатів Канади та Австралії, але інші, схоже, вагалися.\n\nНайпоказовішою була реакція представників Вест-Індії, Ґаяни та Ісландії, які вже висловлювали свою незгоду з війною та своєю участю в ній. Президент Ісландії Торберґссон, перший президент нації після завершення американської військової окупації минулого року зі смертю генерала Мелоя-молодшого та відомий своїми палкими націоналістичними поглядами, очолив опір пропозиції. Стверджуючи, що різні «маріонеткові держави» Америки ніколи не були зацікавлені в американських авантюрах, і заявляючи, що вони ніколи не дозволять проливати свою кров на чужій землі, його власна промова викликала нову хвилю оплесків від багатьох інших делегатів.\n\nЗрештою, рішення буде винесене на голосування, і багато хто затамував подих, очікуючи, чи доведе ОВН, що вона є альянсом зі сталі, чи альянсом із паперу."
 OFN.1.a:0 "Голосуємо за перемогу!"
 OFN.1.b:0 "Будь я проклятий, якщо наші хлопці проливають кров за Африку!"

 OFN.3.t:0 "Допоміжний персонал до Африки"
 OFN.3.desc:0 "Далеко на півдні точиться війна. Американський генерал Г. Хауз надіслав повідомлення із проханням про допоміжний персонал для допомоги в організації шпиталів та управлінні логістикою. Деякі добровольці висловили занепокоєння щодо температури, побоюючись, що не витримають спеки. У будь-якому разі перша група людей уже залишила Рейк'явік, прямуючи до Кейптауна."
 OFN.3.a:0 "Буде дуже спекотно!"

 OFN.8.t:0 "Ми повинні відправити людей до Африки"
 OFN.8.desc:0 "Війна в Південній Африці вирує, і американці попросили нас мобілізувати сили для захисту свободи та демократії південноафриканського народу. З огляду на стан Федерації, це, безперечно, не найкращий час для відправлення військ, які ми могли б використати для забезпечення миру. Вимоги є вимоги, і ми усвідомлюємо, що не маємо вибору, тож сьогодні ми надіслали телеграми до різних пунктів із закликом до добровольців."
 OFN.8.a:0 "Гаразд тоді"

 OFN.9.t:0 "Канада повинна допомогти!"
 OFN.9.desc:0 "Південна Африка, колишній член Співдружности, зазнала вторгнення нацистів! Ми повинні зробити все можливе, щоб допомогти їм. Це далеко від нашого дому, але коли наш Альянс закликає нас врятувати націю від зла й тиранії, ми повинні зробити все, що можемо!"
 OFN.9.a:0 "Виконаймо свій обов'язок!"

 OFN.10.t:0 "Церква підтримує військові зусилля"
 OFN.10.desc:0 "Протягом минулого тижня кілька громад закликали своїх членів записуватися на військову службу. Вони наголошують на нехристиянських цінностях, які сповідують націонал-соціялісти, та підкреслюють необхідність врятувати християнський народ Капської землі. Південна Африка — єдина демократія в Африці, і наш християнський обов'язок — захистити свободу та викорінити зло заради слави Божої."
 OFN.10.a:0 "Благослови наших солдатів."

 OFN.11.t:0 ""
 OFN.11.desc:0 ""
 OFN.11.a:0 ""

 OFN.13.t:0 "Дух '76"
 OFN.13.desc:0 "На борту Air Force One Ніксон відпочивав у приватному кабінеті президента, схиливши шию над щоденним брифінгом, що лежав на столі. Наодинці, коли тишу заповнювало лише гудіння двигунів літака, президент переглядав документи, озброївшись ручкою, якою занотовував свої думки на жовтому блокноті на колінах. Наприкінці брифінгу Ніксон зупинився, і в його очах з'явилася цікавість. Він повільно перечитав останній абзац про себе, перш ніж потягнутися до телефона поруч.\n\nСпівробітник ЦРУ, який перебував на борту, тихо увійшов, але у відповідь почув від Ніксона запитальним, можливо, допитливим тоном: «Що це?» Погляд співробітника перемістився між президентом і брифінгом, що лежав на столі. Невже це якийсь жарт?\n\n«...Це ваш щоденний брифінг, пане президенте», — промовив спантеличений співробітник.\n\n«Я знаю, що це, чорт забирай, — я хочу знати, про що, в біса, там ідеться», — гаркнув Ніксон. Повернувши брифінг до співробітника, Ніксон подався вперед і вказав на останній абзац. Співробітник нахилився, примруживши очі. Нарешті зрозумівши, що турбує президента, він швидко випростався.\n\n«Ми визначили, що сплеск громадської підтримки втручання в Південноафриканську війну є передусім соціальним явищем», — чітко почав співробітник. «Ця підтримка схильна до швидких змін — це реакція на те, що відбувається на передовій. Крім того, останні дані свідчать, що ефективність наших військовослужбовців залежить від громадської підтримки їхніх обов'язків». Ніксон мовчки кивав.\n\n«Ми також виявили, що, хоча багато американців вважають війну виправданою, це може бути не так у майбутніх конфліктах». Співробітник зробив паузу, майже вагаючись продовжувати. «Раджу вам ознайомитися з меморандумом щодо Західної Африки для отримання додаткової інформації, пане президенте»."
 OFN.13.a:0 "«Розумію. Тримайте мене в курсі.»"
 OFN.13.tt:0 "§FМеханіку §Yвнутрішнього фронту§! тепер §Gрозблоковано§!§!."

 OFN.14.t:0 "Повідомлення про звірства бурів на перших шпальтах"
 OFN.14.desc:0 "Десмонд, будівельник із Нью-Йорка, прямує до продуктового магазину, щоб придбати останній випуск New York Times. Він довго розмовляв із колегою про Південноафриканську війну, і конфлікт усе ще не виходив у нього з голови, коли він сьогодні залишив роботу.\nЧоловік узяв свій примірник із прилавка продуктового магазину та відкрив його, побачивши сьогоднішній головний заголовок жирним шрифтом: «ВІЙНА В ПІВДЕННІЙ АФРИЦІ ТРИВАЄ». Від самого початку війни між райхскомісарами та Республікою Десмонд був відомий серед оточення своєю цілковитою байдужістю до неї. Зрештою, після того, що сталося востаннє, коли Америка воювала за кордоном, чим це мало відрізнятися? Він почав читати про нещодавні німецькі наступи, що розривали південноафриканське серце країни, і замислився, чому він платить податки, щоб підтримувати таку безглузду війну. Дійшовши до кінця статті, він побачив безпосередньо під нею новий жирний заголовок: «БУРИ ВЧИНЯЮТЬ МАСОВІ ВБИВСТВА, СОТНІ ЗАГИНУЛИ».\n\nДесмонд не міг повірити тому, що читав у цій статті. Бури, підтримувані Німеччиною, жорстоко ґвалтували, поневолювали та вбивали жінок і дітей; щонайменше 500 людей постраждали від рук загарбників, а війна лише починалася. Саме тоді Десмонд по-справжньому усвідомив масштаби війни та те, чому американцям було так необхідно втрутитися: на кону стояли життя невинних, беззбройних людей. Чоловік уявив, що могло б статися, якби жертвами звірств бурів стали його дружина, донька та син. Віддаючи касирові жменю монет, він почав замислюватися, чи справді може підтримати військові зусилля."
 OFN.14.a:0 "Принаймні ми повинні спробувати."

 OFN.15.t:0 "Відправити вантажівку для перевезення припасів"
 OFN.15.desc:0 "Африка величезна, а міста райхскомісаріатів розташовані далеко, нам потрібно знайти рішення"
 OFN.15.a:0 ""

 OFN.16.t:0 "Відправити наших хлопців через море"
 OFN.16.desc:0 "Учора ввечері надійшла американська телеграма — прохання посилити наші зусилля в Африці, надіславши більше людей. Деякі більш ліберальні члени нашого парламенту відповіли, що наша економіка не перебуває в стані, який дозволив би оплатити таку операцію."
 OFN.16.a:0 "Звісно, генерале."
 OFN.16.b:0 "Ми не можемо дозволити собі такі операції зараз."

 OFN.17.t:0 "Виконати свій обов'язок"
 OFN.17.desc:0 "Південноафриканська війна точиться далеко від наших островів, але ми повинні змиритися з цим. Можливість безпечно плисти на захід, до Америки, є важливою частиною нашої безпеки. Ніхто не може гарантувати, що Тихий океан назавжди залишатиметься безпечним для наших кораблів. Ми повинні вирушити до Африки, щоб зберегти безпеку західного шляху."
 OFN.17.a:0 "Вітрила підняти!"

 OFN.18.t:0 "«ВОЄННА ПАРТІЯ» отримує фінансування від Америки"
 OFN.18.desc:0 "ЦРУ надіслало нам кошти на створення додаткової пропаганди, і ми зможемо використати їх для кількох цілей, зокрема для формування підтримки війни та підвищення нашої популярности."
 OFN.18.a:0 "Дякуємо, Америко!"

 OFN.19.t:0 "Власник фабрики хоче продати нам фабрику"
 OFN.19.desc:0 "Сталевий магнат звернувся до нашого уряду та запропонував продати нам одну зі своїх фабрик за низькою ціною. Фабрика незабаром застаріє, а в нього й без того є інші проєкти. Вважайте це його підтримкою військових зусиль. Для оновлення обладнання та виробничих ліній знадобляться певні кошти, але нашим людям в Африці вкрай потрібне збільшення виробництва."
 OFN.19.a:0 "Дякуємо, але ні."
 OFN.19.b:0 "Так, будь ласка."

####OFN Membership System
 OFN.membership.1.t:0 "[?USA.OFN_candidate.GetName] хоче приєднатися до ОВН"
 OFN.membership.1.desc:0 "Після певного періоду переговорів [?USA.OFN_candidate.GetName] офіційно попросилася до ОВН. США вже схвалили її заявку, і тепер нам належить проголосувати щодо її членства."
 OFN.membership.1.desc_brittany_delaporte:0 "Бретань надіслала запит до Сполучених Штатів, сподіваючись отримати дозвіл на вступ до ОВН. Згідно з протоколом, Сполучені Штати у свою чергу надіслали всім державам-членам таке питання: чи слід дозволити Бретані членство в ОВН?"
 OFN.membership.1.desc_brittany_mordrel:0 "Бретонці прагнуть приєднатися до нашого альянсу. Бретань має велике стратегічне значення, оскільки розташована в континентальній Європі та може легко надати безпечну гавань військово-морським підрозділам, що діють в Атлантиці. Найбільшою загрозою для її існування є Бургундська держава, що, безперечно, і є причиною, чому вони шукають захисту."
 OFN.membership.1.a:0 "Проголосувати за їхнє членство."
 OFN.membership.1.b:0 "Залишитися нейтральними та спробувати вибити певні поступки від США."
 OFN.membership.1.c:0 "Заявити про нашу опозицію до [?USA.OFN_candidate.GetName]."
 OFN.membership.1.d:0 "Ми не можемо дозволити собі розлютити США, проголосувати «за»."
 OFN.membership.2.t:0 "[FROM.GetName] голосує за вступ [?USA.OFN_candidate.GetName] до ОВН"
 OFN.membership.2.desc:0 "[FROM.GetName] проголосувала за вступ [?USA.OFN_candidate.GetName] до ОВН."
 OFN.membership.2.a:0 "Чудово."
 OFN.membership.3.t:0 "[FROM.GetName] нейтральна щодо вступу [?USA.OFN_candidate.GetName] до ОВН"
 OFN.membership.3.desc:0 "[FROM.GetName] зберегла нейтралітет у питанні вступу [?USA.OFN_candidate.GetName] до ОВН. Оскільки розширення ОВН потребує одностайного голосування, нам доведеться надати їм певні поступки, якщо ми хочемо заручитися їхнім голосом."
 OFN.membership.3.a:0 "Неприємно."
 OFN.membership.4.t:0 "[FROM.GetName] виступає проти вступу [?USA.OFN_candidate.GetName] до ОВН"
 OFN.membership.4.desc:0 "[FROM.GetName] проголосувала проти вступу [?USA.OFN_candidate.GetName] до ОВН. Оскільки для будь-якого запропонованого розширення ОВН потрібна одностайна згода, нам доведеться витратити ресурси на те, щоб переконати їх змінити свій голос."
 OFN.membership.4.a:0 "Перешкода."
 OFN.membership.5.t:0 "Переговори з [?USA_currently_negotiating_with.GetName]"
 OFN.membership.5.desc:0 "[?USA_currently_negotiating_with.GetName] наразі не підтримує кандидатуру [?OFN_candidate.GetName] на вступ до ОВН. Щоб схилити їх на наш бік, ми можемо зробити одне з наступного:\nСплатити [?USA_current_political_cost] політичної влади\nСплатити [?USA_current_money_cost] мільйонів доларів США\n"
 OFN.membership.5.a:0 "Надати їм певні поступки"
 OFN.membership.5.b:0 "Заплатити їм гроші"
 OFN.membership.5.c:0 "Забути про це"

 OFN_membership_costs_trigger:0 "Ми маємо або [?FROM.OFN_convince_cost_political] політичної влади, або [?FROM.OFN_convince_cost_money] мільйонів доларів США"
 OFN_membership_change_vote:0 "§GВони підтримають кандидатуру [?USA.OFN_candidate.GetName]\n\n"
 OFN_membership_money_cost_tooltip:0 "§YЦе коштуватиме нам [?USA_current_money_cost] мільйонів доларів США.§!"
 OFN_membership_political_cost_tooltip:0 "§YЦе коштуватиме нам [?USA_current_political_cost] політичної влади.§!"
 OFN_membership_all_in_favor:0 "Усі члени ОВН підтримують вступ кандидата"
 OFN_membership_start_negotiations:0 "§YМи спробуємо переконати [FROM.GetName] за допомогою фінансових або політичних поступок§!"
 OFN_membership_scotland:0 "§YМи привітаємо Шотландію у складі §YБОВН!§!§!"
 OFN_membership_negotiation_trigger:0 "Ми наразі не намагаємося переконати члена ОВН змінити свій голос."

#####Membership Decision category
 USA_OFN_membership_category:0 "Переговори щодо розширення ОВН"
 USA_OFN_membership_category_desc:0 "Для вступу країни до ОВН потрібна одностайна згода всіх чинних членів. Теоретично це має підкреслювати те, що альянс є об'єднанням рівних. На практиці, однак, США мають чимало засобів для «переконання» незгодних членів змінити свої голоси.\n\nПоточний кандидат: [?USA.OFN_candidate.GetNameWithFlag]\n\n[CAN.GetFlag][GetCanadaVote]\n[NZL.GetFlag][GetNewZealandVote]\n[AST.GetFlag][GetAustraliaVote]\n[BLZ.GetFlag][GetBelizeVote]\n[SAF.GetFlag][GetSouthAfricaVote]\n[IBR.GetFlag][GetIberiaVote]\n[ENG.GetFlag][GetEnglandVote]\n[ITA.GetFlag][GetItalyVote]"
 OFN_open_negotiations_with:0 "Вести переговори з [FROM.GetName]"
 OFN_admit_member:0 "Прийняти [?USA.OFN_candidate.GetNameWithFlag] до ОВН"
