## IBERIAN WARS
POR_a_guerra_iberica:0 "A Guerra Ibérica"
POR_a_guerra_iberica_desc:0 "Iberia is in flames.\n\nPortugal however, has not restored order within her own realm. What was originally meant to be a swift move to escape the collapsing building that was the Iberian Union had failed due to an uprising by violent revolutionaries, leaving us in the rubble that is now the Iberian Wars.\n\nBut not all is lost, for we have what the Portuguese republicans lack—a just cause. After all, what are the righteousness and virtues of these presumptuous insurrectionists who defraud the Portuguese people as a force of freedom? Where is the justice that they promise the Portuguese people, when they actively inhibit our efforts to lead our nation out of the darkness?\n\nThese questions are ones we will answer—not only through word of mouth but through the barrel of a gun."

POR_o_exercito:0 "O Exército"
POR_o_exercito_desc:0 "Much of the army lies in disarray with the secession of Portugal from the Union. While the Portuguese soldiers formerly under the flag of the Iberian Union have all returned to Portugal, it's not merely a change of uniform for us. Logistics are scattered, districts still correspond to the Iberian ones, and our men are using whatever ammunition and guns they could scrape up from derelict Iberian warehouses.\n\nFortunately, reorganisation and rearmament is not beyond our grasp—we have been blessed with what industry has managed to find itself intact as a result of the fighting, but also the remnants of Portuguese military theorists find themselves siding with us. It's time to set pen to paper and man to arms, for the creation of the Portuguese Royal Army will secure our nation's future."

POR_the_policia_international:0 "The Polícia Internacional e de Defesa do Estado"
POR_the_policia_international_desc:0 "A Great Portugal is a Secure Portugal, and as we have learnt from the past series of events in and around Iberia, there is no shortage of threats to the security of Portugal - and thus her grandeur too.\n\nLogically, as anyone else in our position would have done, we have created a secret service—the Polícia Internacional e de Defesa do Estado, to liquidate the internal threats which loom over our country. However, as of lately, it seems the PIDE has found itself... overstepping, in the name of the regime, resulting in undesirable effects on our popularity, particularly among the military command, where it seems they have made themselves an obstacle to the army's manoeuvres. We had best do something about their increasingly disruptive behaviour lest they prove themselves to be a disruption rather than a benefit to our efforts."

POR_the_portuguese_ss:0 "The Portuguese SS"
POR_the_portuguese_ss_desc:0 "While the PIDE has been a thorn in our sides in our bid to gain popularity among the citizens, their achievements and exploits can never be overwritten—no, certainly not when they have built for us such a comprehensive network of intelligence! One whose name makes POWs quiver in their boots when we threaten to hand them over to them.\n\nIt's time that we put the PIDE to a task more... useful, to our cause. A few changes here and there, really, but no serious overhauls to their management. If we were to give it greater access to equipment in exchange for their operations being less clandestine (to us). After all, their experience and competence are a huge asset to us, we simply need to keep them on leash."

POR_make_them_elite_divisions:0 "Make Them Elite Divisions"
POR_make_them_elite_divisions_desc:0 "For what it's worth, the PIDE has been an especially useful body —particularly in liquidating opposition figures both within and outside of our realm of control. Their operations, both on the Peninsula and in our African holdings, have given the PIDE a limited but certainly promising pool of candidates for recruits.\n\nGiven the right training, however, these potential agents would prove very useful in carrying out anti-partisan and infiltration operations against our adversaries. Under the leadership of Oscar Cardoso, we will initiate a programme of agent training to prepare these recruits for military service—particularly those with experience in Africa. Our defence against subversion starts with the agent, after all."

POR_fully_integrate_them:0 "Fully Integrate Them"
POR_fully_integrate_them_desc:0 "That's it. At every corner we turn and every path we take, the PIDE has managed to make itself an obstacle in our path to victory. At any means now, their lack of clarity and openness in communicating with us have only been at the detriment of our war effort, and if we are to achieve any sort of meaningful conclusion to this conflict, something has to be done.\n\nTo keep them tightly under our control, we'll place them fully under the jurisdiction of the Ministry of the Interior and seize their vast archives of intelligence for our own review. Of course, such a vast overhaul of their structure will come at the cost of a purge of their personnel—but if we have to crack a few eggs, then so be it.\n\nGet me the list of personnel and a highlighter."

POR_a_new_secret_police:0 "A New Secret Police"
POR_a_new_secret_police_desc:0 "None would dispute the effectiveness of PIDE - it has for many years worked tirelessly to protect the State from subversive elements. That success, however, has unfortunately led to an unacceptable degree of 'insubordination' that can no longer be tolerated, especially in light of its deleterious effects on the war effort.\n\nIt will therefore be promptly dissolved, and in replacement will be established the Direção-Geral de Segurança, or DGS. This time, the leash will be kept tight, and the DGS will only be permitted to act when and where the State tells it."

POR_incorporate_the_legiao_portuguesa:0 "Incorporate the Legião Portuguesa"
POR_incorporate_the_legiao_portuguesa_desc:0 "The Portuguese Legion is, for lack of a better term, a 'difficult' formation to administer. Though it served well for many years as a container for the more 'radical' right-wing members of the Estado Novo, it was always deprioritized. The current state of affairs, however, demands action, given its uncertain loyalties to the new Kingdom.\n\nThe Legion will therefore be integrated into the new Army, and its members either given comparable positions and ranks if desired, or discharged if otherwise. We will keep the best of the unit, and dispense with the unreliable."

POR_a_economia:0 "A Economia"
POR_a_economia_desc:0 "It was a simple reality that the Iberian economy was dominated by Spanish interests and concerns - population and industry concentrations could not permit otherwise. The severance of that has left the Kingdom in a difficult position, with supply chains and production pipelines completely severed and disorganized.\n\nImportant decisions will need to be made - and made quickly - if the Kingdom is to maintain a healthy and functioning economy. We must make sure that the State's foundation is maintained."

POR_the_industrial_heartland:0 "The Industrial Heartland"
POR_the_industrial_heartland_desc:0 "We are most fortunate, indeed, that the Kingdom's territory incorporates the northern regions of Portugal - the region where the lion's share of the national industrial base resides (and in stark contrast to the Republic's agrarian southlands). We must act quickly to leverage this industrial advantage into progress towards victory.\n\nProper organization of the industries present, and correct 'alignment' of their priorities as they relate to the production of military equipment will be critical, and will help in advancing the war effort."

POR_continue_the_corporatist_model:0 "Continue the Corporatist Model"
POR_continue_the_corporatist_model_desc:0 "Though we would ideally transform the Kingdom's industrial policy, reality demands otherwise. It has been decided that corporate-centric measures will remain in place for the foreseeable future, or at least until the national emergency is over.\n\nCollaboration with loyal businessmen and their interests will secure the economic future of the country, and will furthermore ensure that we have final say over all critical economic decisions. We must ensure economic victory before we can secure military victory."

POR_build_up_the_national_industry:0 "Build Up the National Industry"
POR_build_up_the_national_industry_desc:0 "Though we already possess a significant industrial advantage over the Republic, we must not become complacent. What is already strong can be made stronger, and each extra factory will bring us that much closer to victory.\n\nWe will relax licensing standards and accelerate development approvals in order to ensure that expansion, and as private industry expands its own scale, so too will it expand the Kingdom's war effort."

POR_adopt_a_dirigisme_model:0 "Adopt a Dirigisme Model"
POR_adopt_a_dirigisme_model_desc:0 "With the rebellion against the Caudillo ongoing, His Majesty's Regime must reconsider the economic model that will support the reconstituted monarchy. Salazar might be gone, but his influence over the Portuguese economy will be difficult to downplay. Corporatism has had decades to be proven a viable model in Iberia, only to produce with less-than-satisfactory results. Embracing the free market is too volatile right now, so a middle ground between it and traditional command economies must be considered.\n\n'Dirigisme' is a little obscure for an ideal of economic restructuring by modern standards, one that propagates state-directed control and oversight in an otherwise standard free market model. While Dirigisme is ostensibly more politically neutral than Fascism or Corporatism, it will allow enterprise the room to allow the economy to flourish while allowing the state to keep the least savory impulses of capitalism at bay."

POR_contact_espirito_santo:0 "Contact Espírito Santo"
POR_contact_espirito_santo_desc:0 "One of the prominent figures in Iberian Union is the illustrious banker Ricardo Ribeiro do Espírito Santo, one of the most affluent financers in Portugal and a well-known friend to António Salazar. Yet despite this familiarity with the Caudillo, Espírito Santo has scarcely been impressed by the economic structure espoused by his peers. With the proof of Corporatism's failure currently raging all around us, perhaps it is a worthwhile investment to seek an arrangement with the magnate and his associates?\n\nCutting a deal under the table isn't new in the world of Finance, even in the middle of an active warzone. Our operatives behind the lines may be able to reach Espírito Santo, even with the fighting still raging. The battlefield isn't the best place for business negotiations, yet the Royalists require funding to win the war against Portugal's enemies and Espírito Santo may well be the only man His Majesty can trust to see to it."

POR_relax_the_tariffs:0 "Relax the Tariffs"
POR_relax_the_tariffs_desc:0 "Like everything else amidst the Civil War, Portugal's resource network has been thrown entirely into disarray. Where one commodity might be in short supply, another might be in abundance one second and almost depleted the next. With the roads and rail networks in constant flux with the ever-shifting frontlines, the only other wellspring of supplies is the one most integral not only to the war effort, but to Portuguese cultural identity itself: maritime commercial trade.\n\nGerman economic dominance and western market antipathy has meant trade negotiations in either direction have been anything but simplistic. These too have gone out the window along with any semblance of peace south of the Pyrenees, meaning that keeping Portuguese society from collapsing must take priority regardless of His Majesty's economic model; the tariffs will be lifted, the ports opened. Portugal will breathe again and damn the consequences."

POR_o_rei:0 "O Rei"
POR_o_rei_desc:0 "It has been a long standing dream of the Portuguese nationalists to undo the great humiliation of the coup in 1910 which resulted in the expulsion of our King Manuel II, which sacrificed our honour and traditions to the cult of so-called "progress."\n\nBut today, things have changed. A new king has risen, and though he has little aspiration to be a political leader, he still stands tall as a figure both for the cheering crowds and the army, but also a symbol to rally behind—commemorating the end of the reign of terror of the republican radicalist mob rule."

POR_a_figurehead_for_democracy:0 "A Figurehead for Democracy..."
POR_a_figurehead_for_democracy_desc:0 "By the grace of almighty God, the rightful ruler and anointed King Jaime of Portugal, is the divinely-ordained proctor of the people's welfare made manifest! He is the heir to the Empire that once conquered the Amazon, challenged the might of the Congo and possessed territory as far east as India, Indonesia and even China. This is the weight of history that sits behind the words and wisdom of Portugal's most esteemed monarch.\n\nNo longer will the people's will be ignored by the conniving ranker of partisan politics, for His Majesty fundamentally acts as their most solemn, most integral ambassador. It is his word that will break the stalemate of party infighting, christioning the return of true parliamentary democracy and political resurgence to our great nation!"

POR_and_a_gatekeeper_for_stability:0 "...And a Gatekeeper for Stability"
POR_and_a_gatekeeper_for_stability_desc:0 "Yet His Majesty is himself not immune to wrath, such is his love for his kingdom and his people when roused to fury! After decades of oppressive and morally corrosive rule, who would King Jaime be to allow further erasure of Portuguese reputation and dignity? What point would there be in the Royalist rebels throwing themselves on the enemy's bayonets only for a facsimile of Salazarist-thought, or something even worse, to worm Its way into His Majesty's Regime?\n\nThe King has a mandate to protect his nation and people that will not be denied anymore, regardless of party, polity or protocol. His Majesty is and will be vested with power to curtail the influence of bad actors in his new government, placing restrictions on parties and politicians deemed irresponsible or even removing them entirely if needed."

POR_the_question_of_regime:0 "The Question of Regime"
POR_the_question_of_regime_desc:0 "Portugal now has the opportunity to finally undo a generation of tyrannical rule, but with it comes questions of what should replace it once the Salazarists are finally scattered to the sea. Conservatives and militarists both favor adopting a measure of authoritarianism in the vein of Estado Novo, while others hold out hope that His Majesty's government will finally be opened to accommodate a true democratic resurgence.\n\nEven though plenty are desperate to move past what the Caudillo represented, the Corporatist regime left a framework for Royalist rule that may prove too appealing to simply abandon completely. With the Civil War still raging, we must refrain from asking the difficult questions for the duration. If either camp is able to sway the King in their favor however, an answer might be waiting for them all once the fighting subsides."

POR_a_king_of_the_masses:0 "A King of the Masses"
POR_a_king_of_the_masses_desc:0 "Tradition may be of great import to the people of Portugal, especially to the archy committed among His Majesty's Regime, but Salazar and Franco both proved that a leader who rules through the anonymity of closed doors and royal appointees will not do in an era where popular support is at a premium.\n\nDespite possessing little political acumen of his own, King Jaime is adamant that he will not sit on the sidelines while the future of his countrymen is threatened. His Majesty is determined to expand public appearances in an effort to speak from the heart, to the hearts of his people. He wants everyone to know that he was a child of his nation before he was anything else, that he too will not tolerate her abuse and that he his heart will bleed to see it ended."

POR_a_king_of_the_few:0 "A King of the Few"
POR_a_king_of_the_few_desc:0 "While the Portuguese elite have rarely earned the respect of the average person for their ties with Salazar, they still offer a means of legitimacy for His Majesty's Regime. The people of Portugal might remain King Jaime's highest priority, but he is well aware of who holds the most sway in the nation's power structure. It seems venal in the modern era, but petty misgivings over social strata means little in times of crisis.\n\nThe King has decided to focus efforts on the levers of power through government meetings with few public appearances. At the same time, private parties of Portugal's rich and wealthy alongside His Majesty will be held to strengthen the political alliance between the two. A union of aristocracy and oligarchy is certain to evoke the era of Portuguese imperial tradition at Its height, giving credence to the rightness of His Majesty's cause."

POR_a_bright_future_ahead:0 "A Bright Future Ahead"
POR_a_bright_future_ahead_desc:0 "As the fighting at the front continues to escalate, it is vital to His Majesty's Regime that the Portuguese people, soldier and citizen alike, are reminded of the righteousness of the Royalist restoration. The army of King Jaime is not merely fighting for the security of his person or his people, but to redeem the soul of one of Europe's most venerable of nations, one whose honor is stained by the lust and impropriety of António Salazar and all men like him.\n\nCannon to the Republicans, who greed and naivete would plunge our country into ruin! Cannon to the Communards, who would annihilate every tradition we hold dear! Cannon to the Estado Novo, to see the nation we love so dearly be finally redeemed in the eyes of God!"

POR_the_santos_costa_reforms:0 "The Santos Costa Reforms"
POR_the_santos_costa_reforms_desc:0 "While it may be painful to admit, the ugly truth of our plight in the Civil War is that the Portuguese armed forces have not been deployed in a major conflict on European soil since 1936. Now we face the prospect of not only fighting our own people with an already underdeveloped fighting force, but bracing for a potential Spanish invasion once the guns fall silent in Lisbon.\n\nWith previous attempts to reform the Portuguese military having withered on the vine of Iberian bureaucracy, newly drafted proposals for His Majesty's Army have been compiled by the Army Chief and Defense Minister Fernando dos Santos Costa. With a comprehensive plan to revamp and modernize the Royalist guerrillas into a true Royal Army, we will remind everyone and ourselves that Portuguese fighting capabilities are not merely a thing of the past."

POR_entice_ofn_investment:0 "Entice OFN Investment"
POR_entice_ofn_investment_desc:0 "There was a time in our history when Portuguese collaboration with the free world was not unfamiliar, whether it was our entry into the First World War or Salazar's cunning political maneuverings with the British in the Second. With the Iberian experiment seemingly in its death throes, we be ready to make inroads with the half of the world still capable of rational diplomacy.\n\nAnd it is not merely principle that will bind us, for there is a great deal of capital in the west that would be invaluable to our post-war reconstruction and development efforts. We certainly have interest in maintaining our independence as well as our commitments with the rest of Europe, but that is no excuse not to mend relations with Washington and their allies."

POR_a_unidade_e_a_maior_forca:0 "A Unidade é a Maior Força, Agora e Para Sempre"
POR_a_unidade_e_a_maior_forca_desc:0 "'Unity is the Greatest Strength, Now and Forever.'\n\nFor some, this refrain has lost much of Its luster. For some, apathy and cynicism abides where love and pride in their country should be bursting at the seams. For some, the heart and soul of Portugal was bought and sold a long time ago.\n\nThan the King returned, one who would see a future for Portugal built upon the traditions of the past. A chance to restore what once was, forged in the fires of Iberia's collapse and the Civil War. As that war enters the final phases, that old refrain finds a new meaning. The people of Portugal have endured only the beginning of the crucible that is to come, even if His Majesty is victorious in the end. They all must brace for tougher times ahead, for they must be united and ready when the smoke finally clears."

