 #Leaders
 POLITICS_ANTONIO_DE_OLIVEIRA_SALAZAR_WARS_DESC:0 "It would be quite unfair to dismiss António de Oliveira Salazar, the leader of Portugal since 1932, as merely an obstructive bureaucrat. Coming to power in Portugal a few years before Franco gained control of Spain, Salazar was a political power player in his own right. Only under the pressure of German troops seizing Angola and Mozambique did he decide to accept a deal with his own personal devil. When Franco approached Salazar to create a defensive-pact-turned-nation, he accepted reservedly, merging Portugal with the similarly right-wing nation of Spain. Now the Iberian Union, the two countries would work together in harmony... at least in theory.\n\nIn actuality, however, this could not be further from the truth. Salazar was not concerned with the welfare of the Union so much as the welfare of Portugal. Wielding a desire to protect his nation from anything that might harm her in the one hand, and an almost pathological obsession with vetoing proposals that would solidify the Union further in the other, Salazar quickly gained a reputation in the Council for being obstructive. His paranoia concerning "Spanish oppression of Portugal" led to many a confrontation with Franco himself, who saw him as one of many reasons why Iberia was likely to fall apart. With Franco's attempted passing of the "Law of Succession", meaning Portugal's absorption into Spain through the reinstallation of the monarchy after the deaths of the Caudillos, the divide between the two was firmly set. This was despite Salazar removing old shirt falangist elements who had attempted to stage a coup against the Union.\n\nYet it had not been Salazar's obstructionism which had led to the collapse of the Union. That blame could be entirely dropped at Franco's feet, for the Spanish dictator had failed to effectively deal with the Basque revolt. Salazar had fled Madrid for Lisbon soon after, declaring independence for the state of Portugal in an Iberia now torn apart by civil strife."

 POLITICS_ANTONIO_DE_OLIVEIRA_SALAZAR_DIVORCE_DESC:0 "It would be quite unfair to dismiss António de Oliveira Salazar, the leader of Portugal since 1932, as merely an obstructive bureaucrat. Coming to power in Portugal a few years before Franco gained control of Spain, Salazar was a political power player in his own right. Only under the pressure of German troops seizing Angola and Mozambique did he decide to accept a deal with his own personal devil. When Franco approached Salazar to create a defensive-pact-turned-nation, he accepted, merging Portugal with the similarly right-wing nation of Spain. However, the dream was not meant to be.\nAttrition with his fellow Caudillo, the internal turmoils, the exhaustion and stress of age, a thousand reasons could be given to the end of the Union, yet none of them really matters in the end. Now, at his personal house, he oversees the rebuilding of a Portugal that, once again, stays on their own lonesome self against a rapidly changing world.\n\nOne he is certain he will not live to see past this decade."
 
 POR_Jaime_Melo:0 "Jaime Álvares Pereira de Melo"
 POLITICS_JAIME_I_DESC:0 "Being relatively unknown, Dom Jaime Álvares Pereira de Melo was perhaps the perfect compromise King. His only recognition amongst the elites was hosting lavish parties and intellectual gatherings, lacking political interests as a man of the arts instead. As such after the death of Salazar he would be approached by Fernando Santos Costa for the position of King of Portugal due to this apoliticalism.\n\nDespite hesitations, he accepted the position and became the first King of Portugal in decades. The following coup attempt by the Republicans left many fearing a total loss of popular support, with the King pressured to create a new government that would avoid calamity and bring order to the streets despite his desire to be a mere figurehead. Instead the failed coup turned into revolt with the government forced to focus on its very survival.\n\nThrown to the forefront of politics, the King's growing popularity poses new issues for the future of the Kingdom. Some see this popularity as a means to power, pushing for the King to be more than a figurehead in their name. Such challenges are for after the war however; for now Portugal's soul must survive."
 
 POR_Antonio_Salazar:0 "António de Oliveira Salazar"
 
