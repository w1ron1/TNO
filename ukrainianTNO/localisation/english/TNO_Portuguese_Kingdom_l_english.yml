#Other descs
POLITICS_ANTONIO_SPINOLA_GUINEA_DESC:0 "The times maketh the man. Portugal and West Africa are undergoing a turbulent time, and António de Spínola is the man entrusted to see Portuguese Guinea through both.\n\nHe oversees a colony forsaken by Lisbon as a maw overtakes his homeland. He oversees a colony sensing weakness in its overlord, with nationalist attacks increasing in both frequency and ferocity while his own forces are stretched thinner and thinner. He oversees a colony towards which the hungry eyes of global politics gaze, eager to take Portuguese territory for their own use.\n\nBut Spínola is nothing if not a pragmatic man and his leadership has already at least sustained Portugal's position. Now, he has only to keep it, by any means necessary.\n\nTimes maketh the man. Spínola will do everything he can to ensure that History remembers what he became."

POLITICS_FERNANDO_DIAS_ANC_DESC:0 "Fernando de Quintanilha e Mendonça Dias is no revolutionary.\n\nHailing from an influential family, he was among the senior Naval officers when Iberia was formed. Support for Salazar and a reputation of competency made him a natural choice to represent Portugal in military affairs, eventually being named Chief of the Atlantic Naval Command. A career well lived, until his home fell apart.\n\nIn his mind he has secured a piece of Portugal away from chaos. While he personally sympathizes with Estado Novo's ideals he has little interest in intervention, seeking only to preserve Portugal's Atlantic position until stability returns. As such he maintains a lax approach to ruling, not seeking to usurp nor establish anything new in the pursuit of stability in his archipelago.\n\nBut everyday the OFN, currently supporting his rule, demands just a little more. Nationalists convince just a few more people in response to the authorities' harsher methods. The fears of communists taking the homeland grow. Vultures circle his rule, but he will do anything necessary to ensure Portugal survives."
