 POR_Ulisses_Cortes:0 "Ulisses Cortês"
 POR_Ulisses_Cortes_eco_desc:0 "§YMinister of the Economy\nDespotism§!"

 POR_Francisco_Sousa_Tavares:0 "Francisco Sousa Tavares"
 POR_Francisco_Sousa_Tavares_hog_desc:0 "§YPresident of the Council of Ministers\nChristian Liberalism§!\n--------------\n§LIf there are any signs of division within the soul of the Kingdom, Francisco Sousa Tavares may be its most prominent symptom. A lawyer, journalist and long time opponent of Salazar, Tavares believed that his authoritarianism would lead Portugal to catastrophe. A view strengthened when Iberia was formed, devolving into a dysfunctional bloat. A view vindicated by the bloodshed in the streets.\n\nTo him a democratic Portugal, institutions guaranteed by a Monarch, is the only way for Portugal to prosper. But all around him are absolutists, his appointment a mere olive branch to democrats. Tavares will play along for now, but when peace returns he will see the people's will reflected in the King.§!"

 POR_Joao_Costa_Leite:0 "João Pinto da Costa Leite"
 POR_Joao_Costa_Leite_for_desc:0 "§YMinister of Foreign Affairs\nAristocratic Conservatism§!\n--------------\n§LFrom the gilded halls of the Portuguese aristocracy; born, raised and married into the aristocratic machine, João Pinto da Costa Leite sees as few others can the dangers of anarchy. Salazar, his thesis tutor in university, had been a close associate based on shared abhorrence for socialists and traitors who wanted to destroy Portugal. Now Salazar is dead and Portugal in chaos.\n\nIn him the Estado Novo ideals burn bright, albeit believing in monarchy rather than a President. In the economy and public life order must be restored. He isn't a man with a gun, but he is a man with connections. He will ensure Portugal finds strong friends, amongst those who understand the responsibilities of power.§!"

 POR_Jose_Ulrich:0 "José Frederico Ulrich"
 POR_Jose_Ulrich_eco_desc:0 "§YMinister of Economy\nAristocratic Conservatism§!\n--------------\n§LJosé Frederico Ulrich's family has been involved in banking for generations, from Hamburg to Lisbon their financial footprint lies. With such pedigree, in addition to his aristocratic background, it is perhaps unsurprising that he was a close collaborator of Salazar and the monarchists within the Estado Novo.\n\nThat association is not without its difficulties however. João Pinto da Costa Liete, fellow monarchist, was appointed Foreign Minister but comes with his own economic corporatist beliefs. Ulrich holds the premier economic position due to his softer beliefs, but he dislikes the thought of a day when Costa Leite finds himself with the economic reins.§!"

 POR_Fernando_Santos_Costa:0 "Fernando dos Santos Costa"
 POR_Fernando_Santos_Costa_sec_desc:0 "§YMinister of Defense\nAristocratic Conservatism§!\n--------------\n§LFernando dos Santos Costa is, to some, one of the greatest men in Portugal. To others, among the most dangerous.\n\nMeeting Salazar in University, both men were close collaborators as they rose the ranks of power, Costa giving Salazar access to military information with his military rank. However his monarchism and reactionism, further right than even Salazar, would eventually lead to ejection from the government.\n\nNow, having couped Caetano and restored the Monarchy, he will entrench Portuguese greatness, the military there to oversee it all. From the ashes, a stronger Portugal will rise.§!"

