##National Spirits 
POR_role_of_throne:0 "The Role of the Throne"
POR_role_of_throne_desc:0 "While during the creation of the Kingdom few supported the King in having any more power than the minimum he could, as his popularity grew and he proved himself to be effective, some began to genuinely propose the idea and be met with, not backlash, but support. From both the elites and the people.\n\nDue to the King's neutral position on the issue, the divisive nature of such a topic and the current war on Portuguese soil, the answer to this question has been pushed into the future, for the aftermath of the conflict. What is to come only can everyone wonder, however one thing is known for sure, whatever is chosen, some people will not be happy."

POR_bridge_past_future:0 "A Bridge Between the Past and the Future"
POR_bridge_past_future_desc:0 "Inheriting the mantle of the "Monarquia do Norte", the new Portuguese Kingdom would find itself in a much similar yet different situation to it. Having popularity and legitimacy on a level that the 1919 uprising could only dream of, the crown finds itself in a much better position than its spiritual ancestor.\n\nServing as a bridge between the past and future, the Kingdom represents both the proud past of the country while at the same time preaching a solid path for its future, uniting people that otherwise would not work together under a common banner. However, if the state is able to live up to these large goals only time will tell."

#EVENTS 
POR_wars.1.t:0 "A Speech for the History Books"
POR_wars.1.desc:0 "Caetano knew Salazar loathed giving speeches to large crowds of people, but after something as momentous as seceding from the Iberian Union, and with Spanish forces mobilizing to reassert control over the nation, it was necessary to calm the public.\n\nThe speech began as well as could be expected, but Salazar's professional image and honesty could work in their favor. Caetano followed every word as Salazar moved to explaining the necessity of secession: "It's Spain's failures that have brought us to this point.. Franco has shown himself to be completely unable to maintain internal security within Spain's borders, and every single time, he puts the burden on Portugal to-"\n\nA loud crack rang out through the plaza, and Salazar slumped to the ground, akin to a puppet having all of its strings cut. There was the briefest moment of quiet.\n\nAnd then it all came crashing down. Citizens began screaming and fleeing the plaza, and the soldiers stationed around Salazar's podium gave way to panic. Someone heard the order to fire, and soon the soldiers had turned their rifles onto the crowd, firing blindly in the direction of the shooter. The screams grew louder. Panic spread as bodies dropped hard to the ground, felled by gunfire or tumbling beneath the crush of the packed plaza.\n\nAs the ministers present were rushed to safety, Caetano had seen it all from his position standing behind Salazar. The red blossoming across his chest, the glassy stare."
POR_wars.1.a:0 "Salazar was dead."

POR_wars.2.t:0 "The State Begins to Fracture"
POR_wars.2.desc:0 ""António de Oliveira Salazar is dead." Caetano let the sentence hang in the air. Many faces among the National Assembly contorted themselves into shock and disbelief, acting as if the assassination was a new thing, that he had just announced. "Yet Portugal should not, and will not die with him. Salazar was a great man, but what would do him a stronger disservice than to let his nation rot with him?"\n\n"What greater insult to his legacy, than to leave Portugal corrupt, and decadent? To leave it headless, and powerless to the whims of Madrid? To venture into the old, feudal Dark Ages, and to shy away from progress?" The reaction was mixed. Members of his clique nodded and murmured in agreement. Others, like the Monarchists, jeered at the sentence and deafening boos hit Caetano. That didn't matter to him. No, what mattered was the largest bloc in the assembly - the neutrals and the Salazarians - with their reaction. Rather, their lack of a reaction. Caetano had got their attention, and that is precisely what he wanted. If they gave way to him, so would the entire country.\n\n"That is wh-"\n\nThe doors slammed open. Unending columns of men marched into the hall, every single one heavily armed with automatic weapons and body armour. The equipment betrayed Caetano's initial assumption of a paramilitary.\n\n"Attention, all members of the National Assembly!" The voice was unmistakable. Chief of the General Staff, Francisco da Costa Gomes. "In the wake of abhorrent factionalism, infighting and anti-Portuguese behaviour, I am temporarily dissolving the National Assembly. I want to emphasise that I, nor anyone in the military, will take charge of the nation, and a coup d'etat is not imminent."\n\nMaybe he was imagining it, but Caetano could feel Gomes' eyes watching his every move. Again, the reaction was mixed. This time, it was the Reformists who made their disapproval known. Clammy hands escorted the arch-reformist out of the chamber, like a prisoner being dragged to the electric chair. What was worse? The fact he was seconds away from power? Or the fact he spotted Gomes making idle conversation with the Monarchists, like old work colleagues at a bar?"
POR_wars.2.a:0 "Would Salazar have wanted this?"

POR_wars.3.t:0 "Parallel Plans"
POR_wars.3.desc:0 ""The National Assembly's been dissolved. It's now or never, there won't be a better chance than this."\n\n"But Costa Gomes said there'd be no coup-"\n\n"-And he's obviously lying, everybody can tell. Now's the time for action! If we hesitate it won't be long before some plutocratic junta sweeps in to feast on the nation's corpse."\n\nThe first group of officers had assembled a plan they believed could help save their country. Salazar and Caetano were weak, and the results of their ideas had demonstrated their failures clear as day. They would march on Lisboa, and restore the monarchy.\n\nOnly then could Portugal be free.\n\n"We need men on the roads, immediately."\n\n"Let's not pull the trigger too early-"\n\n"Too early? The monarchists must be champing at the bit to make the first move, can we afford to chase those nostalgic fools? The second group of officers had, meanwhile, assembled a plan they believed could help save their country. Salazar and Caetano were weak, and the Estado Novo's grasp over the nation had faltered. They would march on Lisboa, and sweep away the old order in favor of a new, provisional government.\n\nOnly then could Portugal be free."
POR_wars.3.a:0 "The game would be decided by the first to reach Lisboa."

POR_wars.4.t:0 "The Kingdom Returns"
POR_wars.4.desc:0 ""I would not come here before you if there was not an alternative!" As Fernando Santos Costa stood on the platform, he let a small smile crawl on the corners of his face. It had been a while since he made grand speeches to soldiers about duty, honour et cetera. But it was good to be back on the stage after so long.\n\n"I would not waste your time if my task was not of the utmost urgency. But, it seems that Portugal has lost its way after so long. The nation, and its people, are at a crossroads, you see. A crossroad between law and order - or anarchy and terror."\n\nThe soldiers stood in front of him, did not show any hints of emotion. Why would they? The men had been drilled, day in and day out, to show nothing except cold determination, like automatons. But a soldier could always tell what another soldier is feeling. And Gomes knew that he had their attention. All he needed was their approval. "The so-called Reformists will say that Portugal is a dying nation. They say that there is no hope for the country in its current state. That something must be done. True patriots know differently. I know that we are the greatest nation in the world. I know that our people are some of the most hardworking individuals on the planet. And I know that some believe what I believe."\n\nTime to bring it home. This would be his do or die moment. If the army was on board with him, then nothing would stop him. "I understand those who reject a monarchy. I truly do. But there is no other alternative, soldiers. They are the only people who understand what makes Portugal great - and how to keep it so. Will you join me, my soldiers? Join me in keeping Portugal standing on its own two feet?"\n\nA silence fell. A soldier in the front - not older than 20 - gave a salute. Then another. And another. Soon, the entire crowd joined in silent prayer, as every man followed in the gesture, like dominoes. Costa smiled. As long as the army was on his side, the Monarchy would be inevitable."
POR_wars.4.a:0 "Battle lines are being drawn across the face of Portugal."

POR_wars.5.t:0 "Sebastião's Lament"
POR_wars.5.desc:0 "João Varela Gomes considered himself a bit of a wordsmith, and even in his young days as a revolutionary, those around him said the same. He was almost purpose-built for meetings like these that were important to the fate of his country. A military man, Gomes never lacked the ability to give hard stares, and it just so happened that he was wearing one at that very moment. Sitting across from him in a small, well-lit diplomat's room was Costa Gomes.\n\n"Before we begin in earnest, I would like to address a...rumor." Costa shifted uncomfortably. "Has...is Delgado truly back in the country? People are saying they saw someone matching his description in Lagos." João pressed his fingertips together beneath the desk, but his face remained stock-still. He looked furtively to the side, at nothing in particular.\n\n"I don't know anything about that. Anyway, you have work to do, don't you? The monarchists have retaken control of the country and now they want a king back in Queluz as soon as they can crown one." Costa let the poorly masked deflection slide.\n\n"I have my work, and you yours. I simply fear for the state of the country. The last thing Portugal needs now is more despots." João Varela raised an eyebrow slightly.\n\n"I'm well aware. Plans are already underway to ensure the new Portugal stays a free one. Now, it is your turn." For the Captain, that hard stare came in handy. "There are just two options for you now, two options for us all. Rise with us, and break the cycle.""
POR_wars.5.a:0 "Or remain, and drown in the storm surge."

POR_wars.6.t:0 "Under the Cover of Night"
POR_wars.6.desc:0 "Jaime Álvares Pereira de Melo was awoken by hands forcefully shaking him awake. His eyes, blurred by drowsiness, could scarcely recognize at first that it was his own guards rushing him out of his bed, catching his dazed reflection in the well-appointed armoire across his bed. Marched down the corridors, his scattershot mind landed on the sound of boots on marble, and the discomfort of the gravel driveway on his feet as he was bundled into the back of a waiting military truck.\n\n"Where are you taking me?"\n\n"We're evacuating you to Porto, Your Majesty," replied the soldier sitting next to him. Jaime was not satisfied with the answer's brevity.\n\n"Why? What's happened in Lisboa to demand such a thing? What's going on?"\n\nThe soldier seemed to catch the king's displeasure, as there was a bit of shakiness in his voice as he elaborated, "Your Majesty, military units in the capital have revolted against the government. They're being aided by communist militias. For your safety we're falling back to Porto until order can be restored." As proof, one of the soldiers in the front seat turned on the radio, as a voice that Jaime recognized as Humberto Delgado was giving an impassioned speech about revolution. Jaime hadn't expected good news, but the idea that Lisboa had seemingly fallen into open revolt still shook the man.\n\nIt took a few hours until Jaime's escort arrived in Porto; Delgado or one of his followers had been intermittently on the airwaves the entire journey. As the truck rolled through Porto's dark streets, Portugal's new President, a Red Caudillo, led a fervent chant over the radio:"
POR_wars.6.a:0 "Shut this piece of crap down."
POR_wars.6.b: ""The people united will never be defeated!""

POR_wars.7.t:0 "Nuno Tristão's Ghost"
POR_wars.7.desc:0 "Kaúlza de Arriaga sat alone in his office. In front of him sat a large map of the entire globe. Robed in a dark, emerald-green hue stood the Portuguese Empire. There old Lusitania stood, tall, proud and alone and with territories from Macau to Angola - it would carry the flag higher and higher as a bastion of civilisation and virtue. Where did it go so wrong? Macau...Macau never stood a chance. Those condemned men, who knew that the noose was wrapped around their necks, still chose to fight for their country. That was bravery. To do the right thing, when you knew it was futile. The men of Macau were better than Portugal deserved. He only wished he could visit their graves.\n\n"And are you sure about this?" he spoke onto the phone. He did not remember picking it up, but he knew who he was talking to. "Spínola, are you sure that the situation you've described is right? It sounds like we've lost Guinea, in all but name."\n\n"Name is stretching it. Everything past the sand berm of the coast is completely unknown to us. Some of our men even refuse to follow orders because they hear stories of the 'vicious' PAIGC." António de Spínola hissed down the phone. In the background, Kaúlza made out the faint chatter of radio communications and footsteps.\n\n"We discipline them, and then another regiment breaks ranks. So you tell me, General? Does it sound like we've lost Guinea?"\n\nThere was a moment of silence between the two. Kaúlza pinched his eyes shut, letting Spínola rant about his troubles in the background. His head throbbed with a dull pain as if someone had been using a chisel to sculpt his head. Macau was lost. East Timor? Gone. Angola and Mozambique took from them like toys from a pram. What would Portugal become if they lost Guinea? What would they have? What would he have?\n\nHe opened his eyes. Instead of an office, Kaúlza de Arriaga awoke in a wooden cabin, aflame. The heat was unbearable, and already the flames had claimed much of the house. He could not move, and he could not speak. Beside him was the telephone, with Spínola's voice resounding. The inferno streaked across the wood, sprinting towards him. This was what Portugal was. An old man, dying in a house they built. Kaúlza snapped to reality and broke the silence. What he was going to do was not brave or strong. But it was the only option left."
POR_wars.7.a:0 ""What do we need to take Guinea back?""

POR_wars.8.t:0 "Pais' and the Terrible, Horrible, No Good, Very Bad Day"
POR_wars.8.desc:0 "Director Pais was in a cheery mood. The sun was shining, a cool breeze was flowing through his office window, and he was finishing up one of his favorite assignments: drafting up a list of officials suspected to be disloyal to the Kingdom. One of them was a Council Member known to correspond with a PCP associate. Another was a labor activist rumored to sympathize with that bastard Delgado. Their true nature would be revealed soon enough, Pais thought to himself, once PIDE's agents started trailing them.\n\nSuddenly, Pais' door swung upon. It was General Costa, who carried a stern look on his face. "Don't you knock?" asked Pais lightheartedly. Costa was unamused. "Diretor Pais, I am here to inform you that you must send a memorandum to PIDE's operatives ordering them to pause their activities immediately and remain in their stations until further notice". Pais raised an eyebrow and slowly stood up from his desk. "Pardon me, General, but I'm a bit confused. Has something happened?"\n\n"The Minister of the Interior and I have been discussing the future role of PIDE in the Kingdom." Pais felt a sharp sinking feeling in his chest. "We're no longer sure as to whether PIDE's current role and structure are sufficient in light of the evolving intelligence landscape. For the time being, that mea-"\n\n"Not sufficient?! This is an outrage!" shouted Pais. "My agency is the one thing standing between us and total Communist infiltration! PIDE's work is as important as ever. You can't jus-"\n\n"Know your place, Pais," interjected Costa. "This isn't a request, it's an order. Either send the memorandum or I'll have the Army do it for you." Costa turned around stiffly and slammed the office door shut behind him.\n\nPais looked down at his desk. He angrily crumpled up his list and threw it into the trash can. Questions filled his head. Was it something he did? Were they going to strip PIDE of its special authorities? Was Costa going to fire him? Would they shutter the Agency? Surely they wouldn't go that far. Pais shakily slumped back into his chair, consumed with anxiety. He'd worked so hard to protect his country. Would all these efforts be for naught? The director turned his head towards his window and out into Lisbon's cloudless sky."
POR_wars.8.a:0 ""It had been such a nice day..."."

POR_wars.9.t:"Cucas"
POR_wars.9.desc: "Octávio had just been conscripted into the Republican army, and was assigned the menial task of guard duty. While others rested for the fights ahead, Octávio stood guard and watched for incoming attacks. Fortunately, the night passed without any incidents. Only a few more minutes and...\n\n"What was that?" another guard asked - loud shouts came from further down the valley. "Rookie, go check it out."\n\n"Me?" Octávio retorted, looking around at the now-awake soldiers who had assembled to make sense of the commotion, hoping to God any of them would volunteer to come with him. Crickets. "Fine, I'll do it..."\n\nA minute passed, then two, then five, then fifteen, and the men started to feel worried for Octávio. "What's taking him so long?" One munched on his cigarette nervously. "Maybe we should go after him, I feel bad for sending him out on hi-"\n\nA rifle's butt slammed into his skull and sent him tumbling to the ground. The rest of the guards grasped for their weapons, but before they could reach them, they were all slammed to the ground and, in a matter of minutes, gagged and bound. They were holstered over their assailants' shoulders and carried away, mumbling cries and squirming.\n\n"It was just some animals, I think..." Octávio came back over the hill, only to find five rifles lying on the ground. No blood. The only sign of struggle: A half-finished cigarette. Octávio knew what that meant. He loaded his rifle and fired shots into the air while running into the camp and screamed..."
POR_wars.9.a:"To arms! To arms! The Flechas have come!"

POR_wars.10.t:"Empty Words, Full Dreams"
POR_wars.10.desc: "...And so, all Portuguese must stand together to safeguard the nation, beset by traitors of all kinds... thank you..." As soon as the radio was cut, Jaime sighed in relief. The King of Portugal and the Algarves wondered how many people listened to him, or found any value in his words. Around him, a dozen hands rushed to move the recording equipment out of the way. He pondered, his eyes falling on the crew's faces: what did they think of his uninspired speech? He wasn't ready for this. Throughout the past 30 years, the closest thing to politics he had done was attending the galas of the aristocracy. He didn't know how to rouse the public's spirits. He did not have the wits for statecraft his advisors did, nor was he a great martial man who could bring about a quick and victorious end to war. What a failure of a king he was. Did he even deserve the title?\n\nLeft alone in the room for a moment, he leaned back in his seat. Images went through his mind's eye. He saw himself walking the streets of Lisbon, unaccompanied by cadres, shaking hands with an ecstatic crowd. He saw himself cutting ribbons to inaugurate buildings and signing checks for orphanages and hospitals. These were good thoughts, something to aspire to at least. As soon as this war was over, he'd make them a reality. Yes, that was what he would do. When his advisors finally reunited the country, he would become the People's King."
POR_wars.10.a:"Even Kings have dreams."

POR_wars.11.t:"Courtly Clashes"
POR_wars.11.desc: "Your Majesty. There is one more matter I must bring up." Francisco Sousa Tavares, the Prime Minister of the Kingdom of Portugal, looked at the King uncomfortably. "If I may be so forward, I believe it would be beneficial if you made a public appearance tomorrow. See, I am planning a speech and..."\n\n"Absolutely not." King Jaime's Minister of Foreign Affairs, João Pinto da Costa Leite, got up from his seat, preparing to leave. "I'm afraid His Majesty has prior engagements for tomorrow afternoon, as he has been invited to attend an event at the German embassy. You will have to make do for your little... rally without him".\n\nBefore he could leave the room, the Prime Minister retorted, looking straight at the King, "Your Majesty, I'm afraid I must insist. You can send your apologies to the Germans, the people must know you stand with them."\n\nJoão stopped in his tracks and sighed. "No. The diplomatic consequences of humiliating the German ambassador would be absolutely disastrous. Your Majesty, please inform Prime Minister Francisco of your intention to abide by your prior engagements." Jaime looked at the two men, tuning out Francisco's response. Is this what being King means? Enduring your minister's childish bickering? Can they not resolve their differences without involving him?\n\nAnd as the two men continued arguing, King Jaime sighed, and rested his head on his arms, wondering..."
POR_wars.11.a:"Will these two ever get along?"

POR_wars.12.t: "A Delicate Deal"
POR_wars.12.desc:"Ricardo Espírito Santo had told his secretary to clear his schedule for the day. He eyed the phone and tapped his desk. The war effort needed Banco Espírito Santo. As daylight faded, his anxiety grew. What if Prime Minister Francisco Sousa Tavares was too stubborn to accept his demands? What if...\n\nHe grinned as the phone rang. Finally. Prime Minister Francisco had listened to reason. Ricardo let the second and third ring pass, then reached for the phone, and answered it on the fourth.\n\n"Diretor Ricardo, listening." His tone was haughty, almost mocking. He wanted Francisco to feel the humiliation of his concession\n\n"Senhor Ricardo? This is King Jaime. I have telephoned you to discuss your aid to the state." Ricardo's smile faded. "Senhor Ricardo?"\n\n"Yes, I apologize, Your Majesty. I must say, I did not expect a call from you today." Ricardo resumed his composure. He could not afford to show weakness with the King on the other line\n\n"That is alright. I heard my Prime Minister and you reached an... obstacle, let's say, during your previous talk, is that correct? Concerning the Bank's relationship with the government?"\n\n"Indeed, Your Majesty. As I informed Senhor Francisco, BES would be happy to commit itself to the war effort in whatever capacity Your Majesty's government requires. But to do so, we will require more operational independence. Without it, my hands are tied." He received no answer. Ricardo's heart raced, and his brow sweated. Had he misspoken? Was the King offended by his earlier gaffe? The silence was finally broken by the King's voice"
POR_wars.12.a:"Very well, Senhor Ricardo. You will have what you need."

POR_wars.13.t:0 "A Restrained PIDE"
POR_wars.13.desc:0 "General Costa briskly paced towards Director Pais' office. He was headed over to explain the new restructuring of PIDE that he and the Minister of the Interior had agreed to. The last time he had spoken to Pais about this subject, the Director nearly blew a gasket. Costa hoped to get this over with as soon as possible. He strode past the office's secretary, not even batting an eye at her, and swiftly opened Pais's door. "Diretor Pais."\n\nPais' eyes shot up from the book he was reading, the initially startled look on his face quickly changing into one of downcast self-resignation. Costa paused for a moment, waiting for Pais' response. When he received none, he continued. "The Minister of the Interior and I have assessed the state of PIDE and its utility to the Kingdom. We have come to the conclusion that the Agency requires substantial adjustments in order to service our nation's intelligence necessities".\n\nThe General went over a variety of new responsibilities that were to be bestowed upon PIDE, as well as new restrictions. PIDE's ability to create paramilitary units would be relinquished. The Agency's presence, especially on the battlefront, would be significantly limited, with future operations only responding to threats within Portugal's borders. Pais' fears were slightly allayed - PIDE's dissolution wasn't in the cards. Finally, Costa got the topic of the Agency's leadership.\n\n"We are still confident in your abilities to head PIDE, in spite of these new developments".\n\nPais breathed a somewhat muted sigh of relief. "Thank you, General. I promise you will find your trust in me is well placed". Costa quickly reviewed a few more details of what the restructuring would entail and then left the room. As he exited the Director's office, Costa reflected on Pais' reaction. These changes to PIDE's authorities were considerable, but Pais seemed relieved to have kept his job more than anything."
POR_wars.13.a:0 ""Let's see if he'll last"."

POR_wars.16.t: "Safe Portuguese Home"
POR_wars.16.desc: "The truck was parked in the Porto square, swamped by frothing masses. They bustled and pushed as they tried to reach the front of the crowd that enveloped the truck, to reach the man calling out the contents of its wares.This truck came regularly now, every week at least once. It was nondescript, small and compact, painted a dark green color in its totality. From its trailer, a man shouted, advertising his treasured imports while guards stood below, making sure no one tried to steal. The man took the money handed from desperate fists stretching from the crowd.\n\nHe returned with a newspaper.\n\nFolded and tied neatly, they came from Galicia, or so it claimed, purporting to be from one of the few free Spanish Presses. Was that true? Were these Spanish smugglers? Men driven by journalism? Conmen with a skill for the written word? None of them could truly say for certain, but news from the turmoil across the border was few and far between. The people would take their chances.\n\nThe newspapers were lurid, sparing little detail. Execution, abuse and vandalism being committed across the regions were described with nearly pornographic detail. It inflamed the citizens, to hear of the disaster that had befallen their former Iberian brethren. To see what their larger Iberian partner was reduced to.\n\nMany read as soon as they cleared the crowd. Some cried out, cursing whatever group had been placed as the proponents of some new affront to civilization. Others discussed in hush groups the situation, each one a minister in his mind. A policeman watched, observing the anthill-esque square.\n\nThe horror did its work on the minds of the citizens. It hardened their hearts against Spain."
POR_wars.16.a: "It'd never happen here."

POR_wars.17.t: "For Your Own Protection"
POR_wars.17.desc: "Fabio was thrown into the street from the shop he had been in, still bewildered. The day had been like any other. A day off from his many responsibilities to catch up with his own personal tasks. Shopping, a domestic banality that - given his work - he now cherished for its simplicity. A normal day.\n\nWhen the Police had strode into the corner shop while he was chatting with the shopkeeper, a friendly woman he had got somewhat acquainted with in recent weeks, he'd barely even registered them at first. Not until the sharp grab of his shoulder had he realized something was amiss.\n\nHe picked himself up, a dull ache in his arm forming. "What do you want?" He asked, more bewildered than inflamed.\n\n"You are Fabio Roque, secretary for the local branch of the People's Democratic Movement?" The police stood together as if glued, their expressions cloned in their muted disdain.\n\n"Yeah?"\n\n"You have a night in the cells waiting. Under the Protection of Domestic Stability law - newly passed - we have an obligation to take anyone employed in legal political activism and are under threat into protective custody" They grabbed him and dragged him to a nearby patrol car.\n\n"What, but I'm not being threa- "he protested, before he was thrown into the backseat.\n\nOne of the officers forced him to the end and sat next to him while the other got into the driver's seat. The officer next to him glared, eyes betraying suppressed intentions.\n\n"Do you feel threatened?" the officer asked."
POR_wars.17.a: ""God save the King.""

POR_wars.18.t: "Domestic Warfare"
POR_wars.18.desc: "The clock never stopped, the slow clockwork sounds of the antique hanging upon the grey wall reverberating around the room. First came the tick. Then the tock. Joaquim had had enough.\n\nHe cradled his head sitting in his plastic seat, feeling the bruises and lacerations. The stitches were fresh and he cursed that he took for granted the times he didn't feel such pain. A representative of the King attacked, it was an outrage! Ever since his appointment to the local backwater Ministry office he'd received snide looks. That was nothing new, this area was known to have its share of republican sentiment but who would dare strike him? With nothing but plastic chairs and the damned clock around him he had nothing to do but feel every kick and punch that had been landed upon him that night.\n\nHe lifted himself up and walked again to the desk at the end of the room, behind it a hunched police officer scribbling into mounds of papers. The officer paid him no heed.\n\n"Excuse me, I've been here for hours now, are you sure no one can see me? This was an assault and I'm a representative of His Majesty. This is becoming absurd."\n\n"You will be seen when an officer is free" came the monotonous reply. As he spoke however, heavy footsteps sounded from outside and another officer came through the door to the officers rear. Joaquim rested his head upon the desk edge and sighed in relief.\n\n"I was told there was a King's representative who wanted to file an assault report? I'm here to assist you with that" came a voice, gravelly and familiar. Joaquim looked up at the officer. The large ears. The beard. The voice.\n\nIt was the man who had set upon him that night. And he grinned heartily at him once again."
POR_wars.18.a: ""Actually, I might have been mistaken...""

POR_wars.19.t: "Reprisal"
POR_wars.19.desc: "The area was isolated from the town, impromptu checkpoints and barriers turning it into an island. It was a uniform place; cheap. Mostly prefabricated constructions, the entire section of the town was new. Now it had a wall through it.\n\nThe residents were refugees from other areas of Iberia, as well as other nationalities who hadn't evacuated. Some French, British and Italians eked out an existence in this shanty while they waited for an avenue home.\n\nThe town crowded the checkpoints or watched from the roofs of the nearby buildings. A notice had instructed all able to congregate. Soldiers idled around the area's only entrances. They looked nervous, more than a few vomiting without care for appearances.\n\nThe people of the quarantined area remained absent, glimpsed only as shadows in homes. Eventually, loudspeakers rang.\n\n"To all those in attendance today, the King's Military has been forced into action. Intelligence and sworn statements have implicated this area as a base for socialist subversion - notably including the recent attack on the Duarte I Hospital."\n\nA general cry came from the crowd. The attack was infamous, a group of men charging into a mostly unprotected military hospital, massacring any they saw.\n\n"The accrued statements state clearly these people operated openly here, yet none reported or opposed them. So, each residency shall deliver to troops a member of their household unless they can help identify those complicit in the attack. Communicate this to your soldiers, and they shall deliver the King's justice." \n\nAn alarm sounded, and the soldiers moved in."
POR_wars.19.a: "Vigilance is a community effort."

POR_wars.20.t: "The Quiet Countryside"
POR_wars.20.desc: "Igor stood by his car, taking a break for a while. His wheel change could wait a second. It was hard work for someone his age and this area deserved a moment's reverence.\n\nThe sun was setting behind him, illuminating the fields and hills before him with a lustrous orange glow. His car had been forced off the road, a deep pothole had blown the tire. He wanted to blame it on the war but that wasn't fair, roads had been that way for years.\n\nThere was some kind of farm before him. Its fields, some green and some sandy yellows, were neatly organized and even stretched slightly up the steep hill. The sound of birdsong rang from the thin trees that lined the road. He smiled.\n\nThe birdsong was broken by the sound of a car driving along the road, colored green with an open top - clearly military. He barely looked until it stopped beside his vehicle, the driver hopping out. He was fairly young with a well maintained field uniform and pistol belt. Igor tensed; he could see a rifle perched on the passenger seat.\n\n"Good evening sir, do you need any help?" the driver asked pleasantly, eyeing up the tire. He made no attempt to grab the rifle, relaxing Igor. He'd grown paranoid in his old age.\n\n"No, it's ok - almost finished. Just taking a break." Igor responded. The soldier turned to look at him. His brow furrowed as he looked at him, recognition glinting in his eyes.\n\n"You're Igor Faria? You owned those restaurants in Porto didn't you?"\n\n"Oh, you knew them? Wow, that was a while ago. You must have been just a kid." Igor chuckled, not seeing the soldier reaching for his holstered handgun."
POR_wars.20.a: ""I remember the newspapers. Estado Novo types loved meeting in your places.""

