### Лідери ###
FML_Alvaro_Pereira_Monjardino:0 "Алвару Монжардіно"
POLITICS_FML_ALVARO_PEREIRA_MOJARDINO_DESC: "Алвару Перейра Монжардіно присвятив більшу частину свого життя юридичній практиці після завершення навчання в Лісабоні у 1954 році. Повернувшись на Азорські острови, він розпочав кар'єру в бізнесі, налагоджуючи зв'язки з американськими підприємствами та бізнесменами завдяки своїй роботі представником Mobil Oil на Азорських островах.\n\nЗрештою Монжардіно зробив крок у світ політики, працюючи з іберійським урядом у складі комісії з планування Азорських островів. Початковою метою цієї комісії було створення автономних Азорських островів, а звіти, у підготовці яких брав участь Монжардіно, були лише першим кроком до цієї мети. Тепер, однак, усе це значно перевершило початкові амбіції: острови стали повністю незалежними від Іберії та опинилися під захистом ОВН. Монжардіно не дозволив своїм зв'язкам з Америкою пропасти марно. Завдяки як своїм зв'язкам з американськими бізнесменами, так і природному географічному положенню двох острівних республік, Монжардіно домігся того, щоб Азорські острови, а не Мадейра, отримали більшу частину фінансування ОВН, призначеного для цих невеликих архіпелагів.\n\nРеформіст Монжардіно очолює PPDA — центристську партію, яка користується широкою підтримкою населення завдяки зосередженості партії на покращенні умов життя на островах. Коли Монжардіно називає себе найуспішнішим адвокатом Азорських островів, важко знайти когось, хто з ним не погодиться."
 

### Ідеї ###
FML_peaceful_island_sea_war:0 "Мирний острів у морі війни"
FML_peaceful_island_sea_war_desc:0 "Континентальна Португалія охоплена полум'ям, розірвана різними ворогуючими угрупованнями, що борються за владу. Такі міста, як Лісабон, опиняться у вирі жорстоких міських боїв, поля в сільській місцевості будуть витоптані, а незліченна кількість життів буде втрачена.\n\nАрхіпелаги, навпаки, залишаються твердо нейтральними під контролем Атлантичного військово-морського командування. Мирні острови архіпелагів пропонують дружню гавань посеред жорстокої бурі, тож багато іноземних підприємств у Португалії вирішили перебратися сюди. Навіть якщо це лише тимчасово, новоприбулі дали вкрай необхідний поштовх економіці островів."
FML_american_boogeyman:0 "Американський страшило"
FML_american_boogeyman_desc:0 "Хоча наразі архіпелаги можуть бути бастіоном миру під захистом Атлантичного військово-морського командування, ніхто не вірить, що вони самі зможуть по-справжньому захистити острови від того, хто вийде переможцем у континентальній Португалії. Щоб вижити, АВМК доведеться укласти угоду, використавши цінність військових і військово-морських баз архіпелагів як важіль.\n\nНа щастя для АВМК, Дядько Сем мав стратегічні інтереси в регіоні, і ОВН запропонувала допомогти з обороною в обмін на доступ до цих баз. Однак ОВН не відчуває особливої симпатії до АВМК і більш ніж готова подати архіпелаги на срібній таці тому, хто їх вимагатиме, якщо той буде достатньо поступливим."

### Локалізація Азорських островів ###
FML_azores:0 "Республіка Азорських островів"
FML_azores_DEF:0 "Республіка Азорських островів"
FML_azores_ADJ:0 "Азорськ."

FML_american_interests:0 "Американські інтереси"
FML_american_interests_desc:0 "Азорські острови займають стратегічне положення в Атлантиці, і ОВН дуже хотіла б його зберегти. Тому, порівняно з Мадейрою, на Азорських островах присутність ОВН значно більша, а острови отримують щедру допомогу та економічні стимули.\n\nБезперечно, Азорські острови користуються добробутом, який приносить ця посилена присутність, але не все те золото, що блищить. Вашингтон пильно стежить за урядом островів. Будь-які натяки на те, що Азорські острови намагаються дистанціюватися від ОВН, рішуче не схвалюються, незалежно від того, реальні ці натяки чи уявні."
FML_little_piece_paradise:0 "Маленький шматочок раю"
FML_little_piece_paradise_desc:0 "Хоча останні кілька років для Азорських островів були далеко не блискучими, і ніхто не бажав, щоб Португалія занурилася в жорстоку громадянську війну, нещодавні події мають один позитивний наслідок, який дещо полегшив життя: ОВН дуже багата й більш ніж готова кинути невелику частину своїх величезних статків Азорським островам, щоб надійно утримати їх у руках ОВН.\n\nЯкщо раніше уряд Азорських островів міг бути обмежений іберійськими боргами чи надмірно напруженим бюджетом, то тепер до його скарбниці надходить вдосталь американських грошей. Тому уряд розпочав низку інфраструктурних та соціальних проєктів, щоб покращити життя мешканців Азорських островів. Поки ці гроші продовжуватимуть надходити, Азорські острови процвітатимуть."

