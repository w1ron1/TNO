 #############################

 ### Initial tree ###
 SVR_a_bastion_of_freedom: "Оплот свободи"
 SVR_a_bastion_of_freedom_desc: "Росію зламано. Нацистська вогнева міць безжально розтрощила її; навіть тепер, у відблисках своєї перемоги, нацистські літаки з вереском і гуркотом проносяться над головами, глузуючи з нас, поки руйнують наші міста й убивають наших дітей.\n\nАле її також розірвали зсередини зрадники - колаборанти. Люди без відданости й принципів, які живуть лише задля втамування жаги до влади та крови. Нашу Батьківщину знищено, а з глибин цих бездонних розломів ринули зло й тиранія, змітаючи те мале, що в нас залишилося.\n\nСвєрдловск стоїть бастіоном проти цієї чорної хвилі, свічкою в пітьмі, останнім оплотом свободи. Ми битимемося до останньої краплі крови, щоб зберегти нашу свободу."

 SVR_look_around_you: "Озирніться довкола"
 SVR_look_around_you_desc: "Озирніться довкола, співвітчизники! Скажіть, що ви бачите? Чи бачите ви спустошення? Хвороби, смерть, анархію? Хор смерти, що лунає від Арханґєльска до Камчатки? Чи чуєте цокіт копит по каменю й могутні сурми, що звіщають наближення вершника? Чи бачите божевілля просто за нашими кордонами?\n\nА що на півночі, де слово дрібного злочинця є законом? Що в Тюмєні, де люди поневолені терором, і в Омску, чиє керівництво ладне в одну мить приректи мільйони на загибель в ім'я «помсти»? Якщо бачите, співвітчизники, то розумієте, чому ми мусимо зберегти нашу свободу."

 SVR_not_all_hope_is_lost: "Не вся надія втрачена"
 SVR_not_all_hope_is_lost_desc: "По всій Росії неможливо не помітити горя, заподіяного німцями. Колишній Союз, розтрощений на уламки, не здатен захистити своїх людей. Коли з неба падають бомби, усі внизу знають лише паніку та страх. Мрії про волю, свободу й достаток можуть тільки загинути, пошматовані осколками й вибуховою силою. Усю Батьківщину, від Заходу до Сходу, охопила пошесть, всеосяжніша за будь-яку лють чи хворобу: безнадія, що життя й далі триватиме, як раніше, серед терору й насильства.\n\nОднак на землях Західного Сибіру досі сяє самотній маяк надії, придушений холодом і кинутий помирати під час падіння Союзу, але все ще незгаслий. Для всіх, хто наважиться кинути виклик долі, двері до війська маршала залишаються відчиненими. Тих, хто плекає надію, хто відмовляється зректися невинного бажання кращого завтра, Військовий округ прийме як бойових побратимів у своєму поході до ідеального майбутнього."

 SVR_defend_your_mother: "Захисти свою матір"
 SVR_defend_your_mother_desc: "Мета Військового округу від самого початку була зрозумілою: захист, а не експансія. Під проводом маршала Рокоссовского він спрямовував і присвячував усі свої сили безпеці росіян, які живуть під його владою. У Росії, роздертій ґеноцидним насильством та ідеологічним екстремізмом, самі лише ідеї млявих реформ не здатні забезпечити життя мільйонів; тверда, але лагідна рука мусить вести їх у майбутнє, захищаючи від небезпек іззовні та зсередини.\n\nКожен, хто вступить до Округу, отримає рушницю, пайок і платню. Це три засоби, які дають людині змогу захистити свою родину. Батько, мати, син і донька, брат, родич, сестра чи незнайомець - ще одна пара рук допоможе не допустити нових смертей. Небезпек навколо безліч, але коли народ крокуватиме вперед пліч-о-пліч з Округом, він не знатиме страху."

 SVR_trust_the_marshal: "Довіра до маршала"
 SVR_trust_the_marshal_desc: "Великий маршал Рокоссовскій, колись маршал Союзу, нині керує тим малим, що залишилося від Військового округу. Для мешканців Свєрдловска він уособлює останню, відчайдушну надію на стабільність і свободу; відповідальність за мільйони людей накладає на його тіло нестерпний тягар. Його солдати, штабісти й народ благають його переглянути своє завдання, передати частину обов'язків іншим і відпочити. Він відмовляється, самотужки протистоячи припливу тиранії та авторитарного правління.\n\nТож іншого шляху, крім як довіритися маршалові у виконанні його обов'язку, немає. На всіх щаблях суспільства Військового округу люди віритимуть маршалові на слово: він досвідчений, а отже, знає краще. Від жебраків і бездомних у містах та селах до найвищих ешелонів командування в їхніх спартанських покоях - усі бачитимуть у маршалі маяк життя, свободи й щастя посеред Росії, роздертої війною та хаосом."

 SVR_fortifying_homes: "Укріплення будинків"
 SVR_fortifying_homes_desc: "Вони повертаються щомісяця. Іноді серед білого дня, іноді вночі, але вони завжди прилітають і завжди повертатимуться, хоч скількох людей уб'ють і хоч яких руйнувань завдадуть із висоти в тисячі футів.\n\nЛюфтваффе становить постійну загрозу не лише для нашого народу, а й для нашої адміністрації, і ми не повинні шкодувати коштів на зменшення збитків від бомбардувань. Якщо ми не можемо відбити їх одразу, то пошлемо військові частини укріплювати будинки й - сподіваємося - рятувати життя під час наступного нальоту."

 SVR_bomb_shelters: "Бомбосховища"
 SVR_bomb_shelters_desc: "Ні для кого не таємниця, що головною ціллю Люфтваффе є місто Свєрдловск, - і саме тому ми мусимо якнайкраще захистити його від руйнувань. Мішків із піском, маскування та вряди-годи проказаної молитви недостатньо.\n\nПідземні бомбосховища - найкращий спосіб захистити мешканців Свєрдловска. Вони не врятують міську інфраструктуру, а бомбардування сильно обмежують нашу спроможність забезпечувати громадян, проте фабрики можна відбудувати, а дороги - відремонтувати. Людські втрати ми собі дозволити не можемо."

 SVR_deter_the_tyrant: "Стримати тирана"
 SVR_deter_the_tyrant_desc: "На півдні Лазар Каґановіч і його кліка тиранів із затятим завзяттям чіпляються за мантію Західносибірської народної республіки. Його тоталітарний уряд суперечить нашим ідеалам волі та свободи.\n\nВін стежить за нами, чекаючи найменшого послаблення готовности, щоб ударити й знищити все, що ми збудували. Поки він не може цього зробити: розпочати великий наступ під загрозою повітряних нальотів Люфтваффе було б самогубством. Але бомбардування не стримуватимуть його вічно. Ми мусимо укріпити кордон, щоб відвернути такий напад, доки не настане час покласти край його тиранії."

 SVR_cast_them_down: "Скинути їх з небес"
 SVR_cast_them_down_desc: "Бомби падають - у Росії це простий факт життя. Далі на схід росіяни, можливо, знайдуть якщо не розраду й спокій, то бодай подобу тиші. Проте для багатьох у Свєрдловску, від військових до цивільних, можливість відступити за гори є не більш ніж нездійсненною мрією. Бомбосховища допомагають убезпечити людей, даючи їм прихисток від жаху, який німці щодня обрушують на російську землю. Та, можливо, навіть цього буде недостатньо.\n\nМожливо, настав час розглянути інші способи дій. Колись давно один китайський генерал сказав, що найкращий захист - це добрий напад. Інженерний корпус разом із трудовими батальйонами Округу спорудить протиповітряні позиції по всій його території. Вони більше не сіятимуть страждання безкарно, поки армія мовчки спостерігає. Їхні бомби зустрінуться зі снарядами зеніток, і пощади не буде. Досить ми ховалися в страху; час скинути їх з небес."

 SVR_a_semblance_of_safety: "Подоба безпеки"
 SVR_a_semblance_of_safety_desc: "Над Росією досі падають бомби. Такою є реальність життя в Окрузі. Зі сходу тиран Каґановіч і далі позирає на нас, але укріплення стримують його нападників і женуть їх геть. Німці досі нишпорять у небі, та відтепер їхньому пануванню чинять опір. Чоловіки й жінки на протиповітряних позиціях становлять реальну загрозу бомбардувальникам, які вже не можуть безкарно нападати на цивільне населення й військових Свєрдловска.\n\nУвесь Округ радіє. Його люди, від маршала до найпростішого робітника, натрапили на безпеку - чи принаймні на її подобу. Деякі нещасливі бомби все ще влучають у цілі, а вовки Каґановіча здійснюють набіги за ресурсами та здобиччю. Та факт лишається фактом: люди захищені краще, ніж будь-коли, а Армія робить усе можливе, щоб уберегти їх від лиха. Маршал сподівається, що його народ якнайкраще скористається цією передишкою."

 SVR_fortify_factories: "Укріпити фабрики"
 SVR_fortify_factories_desc: "Основний факт існування Округу зрозумілий усім: з усіх боків його оточують організації та угруповання, що прагнуть із лихими намірами підкорити його територію й населення. Тому вкрай важливо підтримувати роботу фабрик, інакше вороги здолають армію та досягнуть своїх цілей. Проте за нинішньої погоди, коли з неба сиплються німецькі бомби й осколки, виконати це завдання виявилося вельми складно. Через падіння обсягів виробництва та промислової ефективности фабрики не зможуть вчасно доправляти спорядження солдатам, прирікаючи тим самим Округ.\n\nМаршал і його штаб вигадали, можливо, не найоригінальніший, але випробуваний і надійний задум. Трудові батальйони працюватимуть разом з інженерним корпусом, щоб укріпити фабрики всіма можливими способами. Замаскувати їх, сховати, укріпити - Округ не гребуватиме жодним методом."

 SVR_extra_rations: "Додаткові пайки"
 SVR_extra_rations_desc: "Військове керівництво Округу управляє всім у Свєрдловску, а народ, цілковито відданий ідеалам маршала й підрозділу під його командуванням, слухається. Проте свєрдловські фабрики не виконують норм, постачаючи менше зброї, ніж потребує Округ. Робітники посилаються на довгі години, виснажливу працю й жах перед німцями, що літають угорі, адже їхні робочі місця є першочерговими цілями для бомбардувань. Їхня відданість не викликає сумнівів; їхня служба нам необхідна - це нагальна потреба дня. Робітників забагато не буває.\n\nОкруг почне з найочевиднішої їхньої проблеми: винагороди. Фабрична праця в Росії небезпечна, і не всі, хто прокидається вранці й гарує біля машин, радіють цьому факту. Маршал має намір полегшити тягар цих героїв, видаючи їм додаткові пайки відповідно до виконаної роботи. Під владою Округу ці чоловіки й жінки не знатимуть ані голоду, ані нестатків."

 SVR_night_shifts: "Нічні зміни"
 SVR_night_shifts_desc: "Багатьох робітників сама думка про працю на свєрдловській фабриці жахає. Більшість змін припадає на день, коли фабрику видно з повітря, що робить її першочерговою ціллю для німецьких бомбардувань. Досить побачити літак удалині, щоб увесь цех упав навколішки. Один вибух змусить людей розбігтися, надто наляканих, щоб повернутися до роботи наступного дня. Ті, хто погоджується на цю працю, - герої, але ми боїмося за них так само, як вони бояться за власне життя: серед них є кваліфіковані робітники й техніки, яких Фронт не може собі дозволити втратити.\n\nЦивільна адміністрація порадила маршалові та його штабові перенести зміни на ніч. Рокоссовскій дослухається до цієї пропозиції. Робітники пересуватимуться й працюватимуть уночі, щоб уникнути втрат від випадкових німецьких бомб, які розтинають небо. Німці могли вважати нас мертвими й загнаними в кут, але ми знайдемо способи їх здолати."

 SVR_a_decent_work_environment: "Гідні умови праці"
 SVR_a_decent_work_environment_desc: "Питання винагороди вирішено. Жоден робітник, який день і ніч трудиться заради Округу, не залишиться без належної винагороди. Проте одна проблема не зникає. Робочий день лишається довгим, а виснажлива праця справи не полегшує. Утім, це не означає, що робітники невдячні. З доброзичливих долонь маршала вони отримали життєво важливу поступку, і відтепер їхня відданість вічна. Набір робітників і кількість добровольців сягають рекордного рівня, а продуктивність вища, ніж будь-коли.\n\nМаршал має намір усунути всі інші можливі скарги. Довгі години відійдуть у минуле, натомість буде запроваджено систему змін, узгоджену з режимом активности Люфтваффе. Досвідчені наглядачі стежитимуть за робітниками й, перебудовуючи ритм праці, не даватимуть їй стати нестерпною та виснажливою. Коли проблем більше не залишиться, цивільні вічно крокуватимуть пліч-о-пліч з Округом до перемоги над Чорною Лігою й тираном Лазарем."

 SVR_making_the_best_of_things: "Дати собі раду"
 SVR_making_the_best_of_things_desc: "Життя в Росії нелегке. Німецькі бомбардування стали буденністю, а насильство шириться всюди, де місцевий воєначальник не здатен утвердити свою владу. Проте в Окрузі, під проводом шанованого маршала Рокоссовского, мешканці Свєрдловска мають найвищий рівень життя в цій частині Росії. Військове керівництво Округу існує винятково для захисту всіх його жителів, і хоч життя тяжке, люди не голодують, а їхні благання не лишаються непочутими.\n\nМаршал дасть народним масам Округу урок із власного життя: як дати собі раду. Ані тут, ані деінде життя аж ніяк не заможне й не зручне, але маршал ніколи не втрачав надії. Крізь усі негаразди він веде людей із чистим сумлінням і теплим серцем, даючи їм засоби для виживання й життя. Вони наслідуватимуть його приклад і далі крокуватимуть у майбутнє, хоч би які темні примхи долі лягали їм під ноги, - заради маленької іскри світла в кінці шляху."

 SVR_sanctioned_scavengers: "Ліцензовані збирачі"
 SVR_sanctioned_scavengers_desc: "Колись давно, ще до заснування Військового округу, Свєрдловск входив до Західносибірської народної республіки, а маршал проти власної волі очолював її збройні сили. У регіоні запанувала подоба стабільности, коли ЗСНР намагалася усунути шкоду, завдану падінням Союзу після Великої Вітчизняної війни.\n\nПотім почалася Західноросійська війна. Підтримуючи товаришів на заході, Народна Республіка надсилала стільки допомоги, скільки могла, - харчами, зброєю та одягом. Поразка Західноросійського революційного фронту й внутрішні чвари в його лавах звели нанівець усю надіслану допомогу. До початку терористичних бомбардувань Республіка розосередила надлишки по всьому Сибіру, і більшість із них залишилася недоторканою у Свєрдловску.\n\nТепер Округ скасує заборону на пошук припасів цивільними. У цих запасах досі можуть зберігатися цінні ресурси: уламок минулого, що й надалі дарує життя тим, хто живе в сучасності."

 SVR_a_silent_morning: "Тихий ранок"
 SVR_a_silent_morning_desc: "Одного дня все припинилося. Сирени мовчали, їхні вуста стулила відсутність небезпеки, що наближалася. Багато хто вважав це випадковістю, гадав, що німці невдовзі повернуться й знову запанують у небі, а бомби знову без вагань, роздумів і милосердя падатимуть на Росію. Та вони так і не повернулися. Хмари мовчали, у небі не було жодного літака. Чутки виявилися правдивими: німці пішли. Під тиском внутрішніх конфліктів, протиповітряних позицій і Вільних авіяторів вони відступили.\n\nМаршал разом з усім Округом полегшено зітхає. Проте в майбутньому на них чекають нові небезпеки. Тіньові торгівці Златоуста з їхніми незбагненними намірами, загадкова й таємнича Чорна Ліга та рештки Західносибірської народної республіки під проводом Лазара Каґановіча невдовзі змагатимуться зі Свєрдловском за становище провідної сили регіону. Часу обмаль; конфлікт наближається з кожною секундою."

 ### Post-Bombing ###
 SVR_our_work_begins: "Початок нашої роботи"
 SVR_our_work_begins_desc: "На краще чи на гірше, бомбардувальники зникли, а тиша тепер оглушує сильніше за будь-який вибух. Наші вороги вже заповнюють її звуками праці й війни, і ми не маємо права змарнувати цю нагоду відбудуватися та розширитися. Свєрдловск більше не може сидіти, пригнувши голову, й лише усувати наслідки руйнувань.\n\nНатомість його треба перетворити на державу, готову возз'єднати не лише землі колишньої Західносибірської народної республіки, а й усю Росію! Ми мусимо спорожнити мішки з піском, прибрати прожектори й повернути зенітників на фабрики. Попереду довга дорога й безліч роботи."

 SVR_military_rail_expansion: "Розширення залізниць"
 SVR_military_rail_expansion_desc: "Доки вершини й доти Златоуста нависають над нашим західним флангом, нам бракує ефективного плацдарму для наступу на північ. Ми мусимо розширити залізничну мережу, щоб провести дієвий північний наступ, не користуючись коліями на території Драґунова.\n\nСхідний вузол постачання також уможливить наступальні дії на півдні ще до захоплення тюмєнських залізниць."

 SVR_motorization_drive: "Курс на моторизацію"
 SVR_motorization_drive_desc: "Коли 3-тя армія переможно рушить за межі наших оборонних рубежів, вона почне випереджати й надмірно розтягувати лінії постачання. Ми мусимо швидко збільшити парк автотранспорту, щоб повністю моторизувати нашу логістичну систему.\n\nЗапасні машини також можна переобладнати для створення мобільних бойових підрозділів, здатних перевершити піхоту ворога маневреністю."

 SVR_restore_industry: "Відновити промисловість"
 SVR_restore_industry_desc: "Тінь Люфтваффе змушувала нас раніше зосереджувати промислові зусилля на захисті й укріпленні наявної промисловости від знищення.\n\nТепер, під чистим блакитним небом, ми мусимо спрямувати сили на стрімке розширення свєрдловської воєнної машини, щоб озброїти й забезпечити паливом нашу кампанію проти тиранів Західного Сибіру."

 SVR_expand_the_logistics_corps: "Розширити корпус логістики"
 SVR_expand_the_logistics_corps_desc: "Що більше чоловіків отримують зброю, лінії фронту простягаються до обрію, а наше промислове виробництво стрімко зростає, то складнішим стає питання про те, кому що належить, і як усе це доправити.\n\nКорпус логістики мусить устигати за дедалі більшим масштабом та інтенсивністю конфліктів, інакше ми самі завалимося в прірву власної неефективности."

 SVR_sverdlovsk_design_bureau: "Свєрдловське конструкторське бюро"
 SVR_sverdlovsk_design_bureau_desc: "Посилення наших технологічних спроможностей неабияк допоможе оновити армію та зміцнити економіку. Після Другої світової війни й розпаду Росії в ході подальшої Совєцько-німецької війни у Свєрдловску опинилося кілька колишніх совєцьких науковців.\n\nБагато з них запропонували нам свої послуги. Створення нового бюра, яке керуватиме цими науковцями, а також спорудження дослідницьких установ, де вони зможуть жити й працювати, стане великою підмогою для наших науково-дослідних колективів."

 SVR_specialized_weapons: "Спеціялізоване озброєння"
 SVR_specialized_weapons_desc: "Упродовж військової історії світ раз у раз переконувався в справедливості одного принципу: разом із розвитком технологій зростає і спеціялізація у війську.\n\nУ Середньовіччі це означало появу важкоозброєних лицарів на полі бою. Під час Наполеонівських воєн - революційне застосування Наполеоном артилерії. Сьогодні це протитанкова й протиповітряна зброя, компактне танкове озброєння тощо.\n\nЯкщо армія Округу має залишатися дієздатною бойовою силою, спроможною, можливо, одного дня зійтися з німецькою армією, нам конче потрібно йти в ногу з новими тенденціями війни."

 SVR_simplified_designs: "Спрощені конструкції"
 SVR_simplified_designs_desc: "Порівняно із сусідами та ворогами місто Свєрдловск має величезну кількість населення. Цей великий людський резерв не матиме для нас жодної цінности, якщо ми не зможемо дати людям рушниці.\n\nТому ми мусимо зосередити розробки й промисловість на виробництві надійної зброї, придатної до масового випуску, з якою ми зможемо змести оборону ворогів сталевою бурею."

 SVR_mobile_units: "Мобільні підрозділи"
 SVR_mobile_units_desc: "На безкрайніх землях Сибіру перевага в маневрі неодмінно принесе перемогу.\n\nБільшість наших і ворожих сил - це легко озброєні солдати з низькою мобільністю, тому ми мусимо створити мобільні підрозділи, здатні скористатися безмежними сибірськими просторами й водночас мати достатній захист для прориву ворожих ліній та ведення маневрової війни."

 SVR_combined_arms_operations: "Загальновійськові операції"
 SVR_combined_arms_operations_desc: "Одним із найсмертоносніших уроків Другої світової війни стали принципи та жорстока ефективність механізованої війни. Наша піхота добре навчена й споряджена, але їй бракує швидкости та потужности, які танкові дивізії дають на сучасному полі бою, а тому вона не здатна скільки-небудь ефективно протистояти бронетехніці.\n\nРозбудова бронетанкового корпусу життєво важлива, якщо ми прагнемо захистити Свєрдловск і зрештою позмагатися з іншими силами за возз'єднання нашої Батьківщини."

 SVR_russias_finest: "Найкращі в Росії"
 SVR_russias_finest_desc: "3-тя армія перевершує всіх за бойовими можливостями й військовим досвідом. Якщо ми здолаємо ворогів у Західному Сибіру, то не кількістю, а якістю: неперевершені солдати й бездоганне планування прориватимуть ворожі лінії та захоплюватимуть ключові цілі.\n\nЗусилля буде спрямовано на формування спеціяльно навченого підрозділу для застосування на найважливіших ділянках фронту."

 SVR_let_all_serve_russia: "Нехай усі служать Росії"
 SVR_let_all_serve_russia_desc: "Поки ми крокуватимемо вперед до перемоги, наші лінії фронту ширшатимуть, а територія, яку треба охороняти, стрімко зростатиме.\n\nЯкщо ми хочемо довести ці війни до кінця, то мусимо мобілізувати нові допоміжні підрозділи, щоб затуляти вразливі прогалини в наших лініях і допомагати просуватися вперед до остаточної перемоги."

 SVR_savant_high_command: "Блискуче верховне командування"
 SVR_savant_high_command_desc: "У Свєрдловску служать одні з найталановитіших командувачів, які будь-коли ходили землею. Сам Рокоссовскій, Павєл Батов, Яков Крєйзєр та Іван Баґрамян - лише кілька генералів під нашим командуванням. Кожен із них має власні вміння та спеціялізацію, але разом вони становлять кістяк не лише 3-ї армії, а й самого Свєрдловска.\n\nМи можемо скористатися їхніми глибокими знаннями поля бою, щоб провести широкі військові реформи - від найкращих способів володіння багнетом до складання планів наступальних операцій по всій ширині фронту."

 SVR_intensify_training_regimen: "Посилити режим підготовки"
 SVR_intensify_training_regimen_desc: "Щоб наша армія могла возз'єднати Росію, ми мусимо перетворити її на справді професійну бойову силу. З огляду на це армія має повністю переглянути режими підготовки й докорінно перебудувати навчальні табори відповідно до наших нових, вищих стандартів.\n\nНаші новобранці повинні однаково добре воювати як у суворих умовах Уральських гір на півночі, так і в пустелі Рин на півдні. Багатьом новобранцям, яких ми раніше прийняли б, тепер відмовлять, але залишаться лише найкращі з найкращих."

 SVR_specialized_forces: "Спеціялізовані війська"
 SVR_specialized_forces_desc: "Свєрдловське військо нагадує молот. Воно сильне й здатне ефективно застосовувати силу, але йому бракує витончености, потрібної для спеціяльних операцій. Нині це робить приховані операції, як-от проникнення, практично неможливими.\n\nСтворення нового роду військ спеціяльного призначення дасть нам змогу воювати в складніших умовах, вести різні види бойових дій і виконувати нові типи завдань."

 SVR_river_crossing_strategies: "Стратегії форсування річок"
 SVR_river_crossing_strategies_desc: "Тюмєнь перетинає кілька річок - такою є природа Іртишського басейну. Нам потрібні плани їхнього форсування, інакше вони почервоніють від крови наших військ. Батов запропонував сформувати спеціялізовану піхотну дивізію, навчену операцій із форсування річок.\n\nЦя дивізія діятиме як авангард решти військ і створюватиме плацдарми, щоб уся армія могла переправитися й продовжити наступ. Добрий план, Батов!"

 SVR_the_new_russian_army: "Нова російська армія"
 SVR_the_new_russian_army_desc: "Уся праця, вкладена в нашу армію, нарешті дала плоди. Тепер Свєрдловск має військо сучасної доби. Наші сили добре навчені, належно споряджені та стратегічно зорієнтовані, мають підрозділи спеціяльного призначення й бронетанковий корпус.\n\nЗ такою могутньою армією попереду й дедалі потужнішою промисловістю позаду возз'єднання Росії під нашим стягом не просто можливе, а неминуче."

 SVR_internal_enemies: "Внутрішні вороги"
 SVR_internal_enemies_desc: "Підривні елементи всередині Свєрдловска становлять для нашої держави не меншу загрозу, ніж ворожі солдати на наших кордонах. Досі наша нездатність стримувати їх призводила до занепаду духу в армії, вкрай високого рівня дезертирства й постійного витоку державних таємниць до Чорної Ліги.\n\nЩоб покласти край цим руйнівним силам, ми мусимо визначити, хто всередині держави загрожує нашій країні. Якщо ми не усунемо внутрішніх загроз, то зовнішні неодмінно нас підкорять."

 SVR_creating_a_new_security_service: "Створення нової служби безпеки"
 SVR_creating_a_new_security_service_desc: "Боротьба з цими новими загрозами вимагатиме створення відомства, здатного протидіяти шпигунам та інакодумцям там, де груба сила армії безсила. Відомства на кшталт НКВД.\n\nБюро внутрішньої безпеки стежитиме за державними таємницями, виявлятиме небезпечних агітаторів і перевірятиме, чи всі урядовці є тими, за кого себе видають, та чи виконують доручення уряду. Ця організація підтримуватиме роботу держави за будь-яких умов."

 SVR_modernize_police_methods: "Модернізувати методи поліції"
 SVR_modernize_police_methods_desc: "Для роботи нового бюра безпеки життєво важливою буде здатність добувати й розшифровувати інформацію. Створено комітет із колишніх совєцьких шпигунів, офіцерів НКВД і криптографів, який розпочне набір людей із необхідними для роботи в Бюро внутрішньої безпеки навичками.\n\nУ захищених місцях по всьому Свєрдловску вже навчаються десятки шпигунів, а молодші криптографи починають розшифровувати ворожі повідомлення та відомості. Невдовзі від нас не сховають жодної таємниці в усій Росії."

 SVR_enforce_martial_law: "Запровадити воєнний стан"
 SVR_enforce_martial_law_desc: "Міста ворогів можуть належати нам, але поки їхнє захоплення є лише символічною перемогою. Осередки відданих ворогові партизанів досі діють у містах на всій відвойованій території. Вони стали повзучою, невидимою раковою пухлиною, яку треба вирізати, перш ніж вона пожере нас зсередини. Щоб боротися з цими терористами, міста слід закрити.\n\nДехто каже, що призупинення цивільного права та habeas corpus є зрадою наших ідеалів волі та свободи. Але перед лицем людей - ні, чудовиськ, - які миттю знищили б усе, що ми обстоюємо, ці критики доволі скоро замовкнуть. Заради загального добра, звісно."

 SVR_promote_heroes: "Відзначити героїв"
 SVR_promote_heroes_desc: "Солдатська служба - невдячна праця. Щодня дивитися у вічі смерті й каліцтву - важко, фізично виснажливо й згубно для бойового духу. Константін Рокоссовскій, колишній драгун Імператорської армії, знає це надто добре.\n\nЗамість звеличувати загиблих ми мусимо зосередитися на хоробрих синах 3-ї армії, які досі живі й продовжують боротися за краще майбутнє всієї Росії. Ми мусимо відзначити наших доблесних солдатів, які довели свою гідність у бою, та вшанувати їхній героїзм."

 SVR_reinstating_nationwide_administration: "Відновлення загальнорегіональної адміністрації"
 SVR_reinstating_nationwide_administration_desc: "Зовсім скоро перемога буде нашою! Усі організовані загрози нашому правлінню буде знищено, над Західним Сибіром майорітиме один стяг, а його землі звільняться і від тиранів, і від розбійників. Возз'єднання Росії незабаром опиниться в межах нашої досяжности!\n\nАле поки в нас є нагальніші турботи. Наші завоювання вражають, проте вони також неосяжні. Навіть коли 3-тя армія вже розтягнута до краю, величезні простори на нашій периферії перетворилися на беззаконні пустки - вакуум влади, який чекає, коли його заповнить наступний Язов чи Каґановіч.\n\nМи мусимо утвердити владу нашої адміністрації в цих районах, перш ніж утратимо над ними контроль."

 SVR_one_step_closer: "Ще на крок ближче"
 SVR_one_step_closer_desc: "Справу нарешті завершено. І всередині, і назовні Уральський військовий округ стоїть непохитно - неподільний і нездоланний! Тепер, коли внутрішніх ворогів упокорено, ми можемо належно й повністю повернути нещодавно відвойовані території до єдиного державного утворення, зміцнивши свою владу в регіоні.\n\nПопереду ще мільйони квадратних кілометрів, які треба звільнити, і незліченні вороги на нашому шляху. Дорога буде довгою. Вона буде всіяна кров'ю тиранів і хоробрих солдатів, які їх убили. Але поки надія на величнішу й сильнішу Росію йтиме разом із нами - чоловіками й жінками, досить відважними, щоб нести вогонь у темряву. Поки що ми стали ще на крок ближче."


 #SVR_a_deal_with_the_devil: "A Deal with Dragunov"
 #SVR_a_deal_with_the_devil_desc: "The pen may be mightier than the sword, but nobody said anything about automatic rifles! Our soldiers need weapons and lots of them, more than our anemic arms industry is capable of producing or sustaining.\n\nLuckily, there is a second solution to solving our deficit. To our immediate west, Comrade Dragunov sits atop what is effectively a city-sized arms factory in Zlatoust. We must draw up plans to purchase arms from this "Merchant of Death" as soon as possible!"

 #SVR_guarantee_for_arms: "A Guarantee for Arms"
 #SVR_guarantee_for_arms_desc: "Dragunov has contacts all over Russia. If we want a better deal than the arrangements he has with nearly everyone - our immediate threats included - we must court his favour.\n\nWe can't offer him money - he makes enough of that already - nor can we appeal to his sense of duty to the motherland because, well, the only thing he cares about is the bottom line. What we can offer him is safety. There are millions of men and women in Russia who would kill to have what he has, and some of them have the firepower to do it. If we remind him of this fact, and promise him protection courtesy of the 3rd Army, he should be willing to open his armory to us. It's not extortion; it's just aggressive selling!"

 #SVR_no_compromise: "No Compromise"
 #SVR_no_compromise_desc: "Yevgeny Dragunov is not a stupid man, though he is not terribly principled. He values one thing: profit. Every other semblance of morality is of secondary importance. He does not care about our ambitions to reunite Russia; he may even be opposed to a united Russian state on the grounds that it would be bad for his little gun-running operation.\n\nIf he is not concerned with our goals, then we are not concerned for the safety of his little fief. We will pay him for a shipment of arms, nothing less and nothing more. The 3rd Army does not bleed for the ambivalent."

 #SVR_the_guardians_of_the_skies: "The Guardians of the Skies"
 #SVR_the_guardians_of_the_skies_desc: "The Free Aviators remain one of the most effective air forces in all of Russia, certainly in Western Siberia. Becoming their ally, or even integrating their military forces into our own could provide us with numerous benefits, among which would include the prestige of being the nation that received the endorsement of the Free Aviators.\n\nMaintaining good relations with the Free Aviators must then be a top priority for Sverdlovsk in its foreign relations goals. To that end, opening up diplomatic relations and sending an offer of industrial assistance could help to begin bringing our nation closer to theirs."

 #SVR_a_road_to_surgut: "A Road to Surgut"
 #SVR_a_road_to_surgut_desc: "The goal of integrating the Free Aviators into Sverdlovsk will require more than kind words and minor industrial assistance. Years of aerial combat with Germany over and around Free Aviator territory has inflicted major damage on the infrastructure that once connected Surgut to the rest of Russia.\n\nMany of the roads and rail lines affected ran through Sverdlovsk just as well as Surgut. Rebuilding these connections would benefit us and could help to bring us into good favor with the Aviators."

 #SVR_an_expanded_deal: "An Expanded Deal"
 #SVR_an_expanded_deal_desc: "While the Free Aviators have been entirely successful in their effort to build a decent air force, their focus on the military has put a large strain on Surgut's economy. Many basic necessities like coal, bread, and warm clothing can be difficult to come by. Medical supplies like gauze are almost nonexistent in the country.\n\nSverdlovsk by comparison is in a much more stable position, and can afford to send surplus supplies to our neighbor in the north. Doing so would go a long way towards winning the hearts of the people in Surgut."
 
 #SVR_an_offer_for_integration: "An Offer for Integration"
 #SVR_an_offer_for_integration_desc: "Over the past few months, the economic and political ties that have connected us to Surgut have become a binding force. The District's public perception stands at an all time high on account of generous aid and the tireless work of our envoys in the region.\n\nWorkers of Sverdlovsk sent up to the oil fields in Surgut have been welcomed and accepted. Businesses in the country work with us before anyone else. Many of the Free Aviators themselves have even declared support for our regime. The time is right to bring Surgut into the fold."

 #SVR_send_workers_north: "Send Workers North"
 #SVR_send_workers_north_desc: "Surgut's lifeblood is in its oil resources. Most nations in this region purchase oil from Surgut's supply, and demand for the black gold is ever increasing. Sverdlovsk's oil demand has increased steadily as our reunification campaign has progressed, and this trend is bound to continue as we begin to deploy motorized and armored divisions.\n\nDespite this, Surgut has struggled to capitalize on the situation and increase output. The biggest limiting factor for Surgut appears to be the manpower available to extract the resource. By offering the services of our own workers and engineers, we might be able to boost oil output for our own consumption and improve relations with the Free Aviators."

 #SVR_the_devil_cornered: "The Devil Cornered"
 #SVR_the_devil_cornered_desc: "When the bombings ended, many in Sverdlovsk were unsure as to the Military District's position in this new post Luftwaffe age for Russia. It has become apparent now that Sverdlovsk stands among the strongest powers in Russia, having taken out both Omsk and Tyumen, two of the strongest warlords in Western Siberia. This is no time to rest on our laurels, however. There remains threats to Sverdlovsk still.\n\nZlatoust is one such threat. Their arms trade is pumping high quality weapons directly into the hands of those who would have us destroyed. That said, Zlatoust has an extremely well equipped military, and a bank with which to hire endless mercenaries. Conquering the small nation could end up forcing us to expend far more resources than we can afford. Consequently, it might be beneficial to give an offer of integration before authorizing military action against Zlatoust."

 
 
 
# SVR_kreizers_brilliant_defense: "Kreizer's Brilliant Defense"
# SVR_kreizers_brilliant_defense_desc: "Comrade Kreizer is one of the finest generals in all of Russia, having served with distinction in the Second World War. He is known for his tactical skill when on the defensive, and after nearly two decades of continuous warfare, he has turned defending into an art.\n\nHis methods make heavy use of mobile formations that can change positions to counter enemy attacks on a whim and perform lightning-fast retreats when needed. His methods are to become a main staple of our military doctrine, posthaste."
#
# SVR_batovs_graceful_attack: "Batov's Graceful Attack"
# SVR_batovs_graceful_attack_desc: "Siberia is a land of vast forests, wide rivers, and towering mountains - none of which deter General Pavel Batov. Comrade Batov is a close friend of Rokossovsky and his second in command, and for good reason.\n\nHis skills in traversing hostile terrain to outflank and encircle enemy forces coupled with his expertise in launching offensive operations across rivers make him a formidable commander. We shall study and perfect his tactics so they may be replicated throughout the entire army."
#
# SVR_intense_teamwork_training: "Intense Teamwork Training"
# SVR_intense_teamwork_training_desc: "An army is an organism. It has countless microscopic parts that all work in unison to accomplish a shared objective. We can improve the effectiveness of the organism by turning each individual squad into a microcosm of it.\n\nSoldiers are to be trained extensively in squad tactics that emphasize teamwork, flexibility, and effectiveness. They must be beholden not to our government or some lofty philosophical goal, but to their brothers-in-arms, through thick and thin."
#
# SVR_the_path_of_least_bloodshed: "The Path of Least Bloodshed"
# SVR_the_path_of_least_bloodshed_desc: "In the vast wastes of Siberia, flesh is the most valuable resource. Soldiers - skilled or otherwise - are scarce at the moment, and we must amend our tactics to reflect that.\n\nWhether on the offensive or defensive, time must be taken to establish field hospitals, and squads should develop strategies for extracting their wounded comrades so they may live to fight another day. The path of least bloodshed is the one upon which we find victory."
#
# 
# SVR_inspect_zlatousts_weaponry: "Inspect Zlatoust's Weaponry"
# SVR_inspect_zlatousts_weaponry_desc: "Trade with Dragunov has brought a great deal of Zlatoust weapons into the District's possession. Most of the arms from our stockpile were just older models from the Soviet-German war and before.\n\nSome, however, are newer, more advanced designs that were put into production as recently as the last few months. These newer guns should be sent to the design bureau so that we might take advantage of Dragunov's technological advancements and employ them for our own gain."
#
# SVR_make_improvements: "Make Improvements"
# SVR_make_improvements_desc: "Dragunov's armaments are certainly impressive pieces of gunsmithing, but no gun is perfect. Our scientists in the design bureau have come up with a list of improvements that they would like to make on Dragunov's designs, as well as a number of completely original designs based off of the technology discovered in Zlatoust arms.\n\nTesting on these new experimental designs has already begun, and it shouldn't be long before Sverdlovsk is producing weapons of similar, if not superior caliber to even the best within Russia."
# 
# 
# SVR_combined_arms_operations: "Combined Arms Operations"
# SVR_combined_arms_operations_desc: "Among the deadliest lessons learned in the Second World War were the principles and brutal efficiency of mechanized warfare. While our infantry are well trained and equipped, they lack the speed and power that tank divisions can provide on the modern battlefield, and thus fail to to contend in any meaningful way with armour.\n\nDeveloping an armor corps is of vital importance if we wish to protect Sverdlovsk and eventually compete with other powers in the reunification of our homeland."
#
# SVR_new_weapon_materials: "New Weapons Materials"
# SVR_new_weapon_materials_desc: "Our scientists down at the design bureau have finished up with some new designs that take advantage of new composite materials developed in the past few years.\n\nThis has had not only the effect of making our armaments lighter and easier for our soldiers to carry into battle, but has actually also increased the reliability of the weapons using these materials. We will see to it that these new designs and materials are put into production immediately."
#
# 
# 
# SVR_the_insanity_of_yazov: "The Insanity of Yazov"
# SVR_the_insanity_of_yazov_desc: "With the death of Karbyshev we were hopeful that the nightmare in Omsk was finally over. It appears our assumptions were wrong. At only 38 years old, Dmitry Yazov continues his predecessor's tradition of ultranationalist militarism and focus on destroying Germany.\n\nWhile we aren't necessarily in opposition to such an aim, Yazov has decided that in order to complete this goal he will have to conquer all of Russia, and we stand right at his doorstep. Already Omsk has begun preparing for conflict with Sverdlovsk through the mass collection of what we thought was secure information. Among the files lost are our current industrial capacity, army size, and many of our plans for expansion. Plugging these information leaks and rooting out Yazov's spies are top priority."
#
# SVR_the_tyranny_of_kaganovich: "The Tyranny of Kaganovich"
# SVR_the_tyranny_of_kaganovich_desc: "After Russia's failure in the war against Germany, many in Western Siberia turned to Lazar Kaganovich and the Western Siberian People's Republic to succeed where Bukharin's Soviet Union failed.\n\nDespite the collapse and eventual dissolution of the Western Siberian People's Republic, Kaganovich is still seen by a large portion of the population as their rightful leader. Practically, this has led to many in the army deserting, and many more simply avoiding military service.\n\nLetting this dangerous notion of loyalty towards Kaganovich fester within the nation and create further discontent among the people will exacerbate the severity of our problems greatly in the future. It is vital that these Kaganovich sympathizers are discovered and eliminated."
#
# 
# SVR_recon_groups: "Recon Groups"
# SVR_recon_groups_desc: "Protecting the state from those who would steal our secrets and provoke rebellion in our lands is certainly an important function, but to do such things to others would be equally valuable.\n\nThe new security bureau will be equipped with a department dedicated to offensive missions, such as infiltration, extraction, and espionage. These "Recon Groups", as they are to be referred to officially, will perform cross border weapons smuggling, intelligence gathering operations, and assassinations should we need them to."
#
# 
# SVR_draw_out_the_plans: "Draw Out the Plans"
# SVR_draw_out_the_plans_desc: "We've had plans for the conquest or integration of several of our neighbors for years, but the constant bombing raids by the Luftwaffe prevented us from organizing enough to actually act on these plans.\n\nThese plans included infiltrating our neighbors' armies, reaching out to resistance organizations in their territories, and more invasion strategies than could be counted.\n\nNow with the state reorganized and our military rejuvenated, the wind is at our back. It is time to revisit these plans, possibly expand on them, and finally execute them."
#
# SVR_Operation_Orange: "Operation: Orange"
# SVR_Operation_Orange_desc: "As far as going on the offensive goes, we are limited to striking either north or south - for now. To the north, remnants of Bukharin's Gulag system dot the snowy countryside. Derelict. Abandoned. Emptied.\n\nIt seems a cabal of ex-inmates - rapists, thieves, and murderers - have set up a partially-functioning government out of their stronghold of Yugorsk. We must free the people of Yugra - Russian and native alike - from their criminal tyranny! We shall draw up plans for an attack on Yugra at once."
#
# SVR_sow_fear_in_their_ranks: "Sow Fear in Their Ranks"
# SVR_sow_fear_in_their_ranks_desc: "The bandits of Yugra are little more than a disorderly band of criminals. And criminals are all the same. There is no honor among thieves, no loyalty. They act like they are the most powerful men in Russia, but when it comes time to back that claim up? They run like wild dogs.\n\nAll we have to do is perform some simple exercises on the border and fly some planes over their cities and their troops will be too petrified of our military power to mount any sort of resistance."
#
# SVR_clear_out_the_bandits: "Clear the Bandits"
# SVR_clear_out_the_bandits_desc: "Yugra stands in the way of reunifying the Western Urals. There will be no compromise - there can be no compromise, not with Vory. They live to hoard wealth like the tsars of old and plunder the same innocent people that we strive to protect.\n\nThese disorganized bandits should stand no chance against our well-oiled war machine. We must meet these bandits with the full force of the 3rd Army and bring them to justice for their crimes."
#
# SVR_Operation_blue: "Operation: Blue"
# SVR_Operation_blue_desc: "As far as going on the offensive goes, we are limited to striking either north or south - for now. To the south lies the city of Tyumen and her overlord, Lazar Kaganovich. Oh, Kaganovich. So ambitious, so zealous, yet so misguided. A power-hungry old man clinging to the scraps of a government that was doomed to fail.\n\nIt is sad, in a way. But we must not shed tears for him. He is a bloodthirsty tyrant, someone who will not stop until either all of Russia is within his iron grip... or he is stopped. That is our task; it is us or him. We shall draw up plans for an attack on Tyumen at once."
#
# SVR_withdraw_agents: "Withdraw Our Agents"
# SVR_withdraw_agents_desc: "If the enemy is unknown, so too is the outcome of the battle. We need to know what they're using - both in terms of small arms and heavy weapons. We need to know how many men they have conscripted and where those men are. Most importantly, we need to know what their doctrines are - how their commanders think.\n\nWe have agents in the field collecting that information right now. With our attack imminent, we must withdraw them so we may use the most up-to-date information on Tyumen in our plans."
#
# 
# SVR_destroy_the_tyrant: "Destroy the Tyrant"
# SVR_destroy_the_tyrant_desc: "Tyumen is the boogeyman just beyond our borders. Kaganovich, together with his clique of tyrannical apparatchiks, must be put down and their oppressed constituents liberated.\n\nWe must finally wipe the stain that is the West Siberian People's Republic off the map - and for good this time. Onward, to victory!"
#
# SVR_Operation_black: "Operation: Black"
# SVR_Operation_black_desc: "Omsk. The Black League. Dmitry Yazov. They are all one and the same. Karbyshev was a broken man, pushed past the edges of sane thought by Nazi torture, but he was also old and increasingly senile.\n\nYazov is different. He is younger, sharper, and smarter. His insanity makes him even more dangerous than his deceased master. Now, Omsk is the biggest challenge to our continued survival in Western Siberia, and must be dealt with before Yazov's crusade for revenge kills us all."
#
# SVR_promise_a_better_life: "Promise a Better Life"
# SVR_promise_a_better_life_desc: "We don't know much about Omsk - nobody does. Spies that go in don't come out; the only thing that does is repetitive propaganda. What we do know is that Omsk is a society carefully crafted and maintained in preparation for a war unlike any war that has ever been fought. It is wholly totalitarian and we can use that against them.\n\nBy broadcasting messages across the border, we can reach the people of Omsk and promise them a better life, one free from their omnipresent and omnipotent oppressor, the Black League."
#
# SVR_a_deal_with_novosibirsk: "A Deal with Novosibirsk"
# SVR_a_deal_with_novosibirsk_desc: "Since the Black League is such a unanimously monstrous foe, we may be able to garner military support from nearby warlords; the first name that comes to mind is Novosibirsk. They share many of our political processes and have a somewhat similar vision for a reunited Russia, especially when it comes to the military's role in politics.\n\nAdditionally, they share a border with Omsk. We should cut a deal with them: they provide some light artillery barrages to distract Yazov and we strike while his head is turned and crush the Black League once and for all!"
#
# SVR_decapitate_the_monster: "Decapitate the Monster"
# SVR_decapitate_the_monster_desc: "To discredit Omsk as a threat to all of Russia is to ignore the apocalyptic insanity - and stupidity - that is the cornerstone of their ideology. Nothing about what they believe is hyperbole.\n\nNot with Omsk.\n\nSuch as it is, the responsibility to defeat them falls to us. And we shall not fail."
#
# SVR_Operation_red: "Operation: Red"
# SVR_Operation_red_desc: "With Yugra under our control, we may now push further north, into the same frozen work camps the Vory came from. What remains of the Gulag's guards have flocked to Vasily Blokhin's banner, who rules to this day with the same iron fist he used to snuff out countless thousands of lives back when he worked for the NKVD.\n\nWe shall draw up plans for an attack on Vorkuta at once."
#
# SVR_an_offer_to_surrender: "An Offer for Surrender"
# SVR_an_offer_to_surrender_desc: "Blokhin seems to have no grand vision for Russia; he has no ideological commitments, not even to the West Russian Revolutionary Front. Knowing this, perhaps he can be reasoned with.\n\nHe may surrender his territories to us if we promise him a high-level position in our administration. Even the most free societies still need jailers."
#
# SVR_cut_him_down: "Cut Him Down"
# SVR_cut_him_down_desc: "For one foolish reason or another, Blokhin refuses to go quietly. All the better for us in the long run. Mass murderers like him deserve no place in the new Russia, let alone in our government!\n\nHis men are nothing more than prison guards with inflated egos. They cannot stand to the 3rd Army.\n\nWe shall strike his name - and Vorkuta - from the history books with ease."
#
# 
# SVR_enforce_martial_law: "Enforce Martial Law"
# SVR_enforce_martial_law_desc: "The cities of Tyumen and Omsk are ours, but so far their capture has been a solely symbolic victory. Holdouts of Kaganovich's and Yazov's followers still operate out of urban areas throughout the reconquered territories. They have become a creeping, invisible cancer that must be excised before they consume us from within. To fight these terrorists, the cities must be locked down.\n\nSome say that suspending civil law and habeas corpus is a betrayal of our ideals of liberty and freedom. But in the face of men - no, monsters - who would destroy everything we stand for in the blink of an eye, these detractors will fall silent soon enough. For the greater good, of course."
#
# SVR_reincorporate_their_industry: "Reincorporate Their Industry"
# SVR_reincorporate_their_industry_desc: "Despite the large industrial base we are now in control of, much of it is either inert or destroyed, no doubt thanks to scorched earth policies by our enemies. This presents us with two problems for the price of one.\n\nNot only are Omsk's oil fields useless and Tyumen's heavy industrial centres nonfunctional - hampering our ability to further reunite Russia - but the workers of these areas are jobless and likely more hostile to our new administration. These vital economic locations must be rebuilt, renovated, and reorganized at once!"
#
# SVR_connect_rail_networks: "Connect Rail Networks"
# SVR_connect_rail_networks_desc: "Between the terror bombings and the collapse of the West Siberian People's Republic, hundreds of kilometers of tracks were destroyed, left to decay, or cannibalized for war production.\n\nWhile the latter was never a great idea, we now have the opportunity to rebuild the railways in our nation, which will stimulate economic growth and facilitate troop movement. We should start by reconnecting the lines between Sverdlovsk, Tyumen, and Omsk."
#
# SVR_promote_heroes: "Promote Heroes"
# SVR_promote_heroes_desc: "Soldiering is a thankless job. Facing death and dismemberment day in and day out is stressful, physically taxing, and horrible for morale. Once a dragoon in the Imperial Army, Konstantin Rokossovsky knows this all too well.\n\nAs opposed to idolizing the dead, we must instead focus on the brave sons of the 3rd Army who are still alive, who still fight for the betterment of all Russia. We must recognize our valiant soldiers for proving their merit in battle, and commend them for their heroism."
#
# SVR_one_step_closer: "One Step Closer"
# SVR_one_step_closer_desc: "The deed is finally done. Inside and out, the Ural Military District stands supreme, indivisible and invincible! Now that our internal enemies have been put to rest, we can go about properly and fully reincorporating the newly retaken territories into a unified polity, strengthening our hold on the region.\n\nThere are still millions of square kilometres left to liberate and countless foes standing in our way. The road ahead is long. It shall be littered with the blood of tyrants and the brave soldiers who killed them alike. But for now, the hope for a greater, stronger Russia will ride with us, the men and women courageous enough to carry the flame into the darkness. For now, we are one step closer."

 #SVR_process_newfound_intelligence: "Process Newfound Intelligence"
 #SVR_process_newfound_intelligence_desc: "Looking for documents that were left undestroyed, and processing the yet undiscovered information on stockpile locations and agents."

 #SVR_promises_of_democracy: "Promises of Democracy"
 #SVR_promises_of_democracy_desc: "Promising that soon there will be no need for a military administration #and the people will be able to vote for their own leaders."

