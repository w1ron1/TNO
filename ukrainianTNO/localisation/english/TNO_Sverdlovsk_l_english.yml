 #Regional decisions
 SVR_sverdlovsk_regional_category: "Стан округу"
 SVR_sverdlovsk_regional_category_desc: "Перемога в Західному Сибіру відкрила перед нами неймовірні можливості й водночас принесла безліч нових проблем. Найнагальніша - рештки ревізіоністів і Чорної Ліги, що перетворилися на терористичні організації, яких треба вистежити. Та внутрішнім тероризмом біди не вичерпуються. Вакуум влади на новозавойованих територіях загрожує стабільності всього Округу. Перш ніж скористатися успіхами й звернути погляд на решту Росії, ці землі треба умиротворити, стабілізувати та інтегрувати - економічно й політично."

