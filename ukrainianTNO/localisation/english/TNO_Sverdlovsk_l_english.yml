 ##=====| Ideas |=====##
 #######################

 SVR_notso_redarmy: "Не така вже й Червона Армія"
 SVR_notso_redarmy_desc: "Попри командування маршала Рокоссовскоґо, наша Червона армія починає втрачати мету; до маршала дедалі частіше доходять чутки про проникнення Чорної Ліги й симпатії до ревізіоністів, тоді як останні засади комунізму відкинуто на користь звичайного військового правління. Визначити спільний напрям, імовірно, доведеться наступникові маршала: старий лев не зможе вічно відганяти смерть."
 SVR_renewed_red_army: "Відроджена Червона Армія"
 SVR_renewed_red_army_desc: "Об'єднані спільною метою під проводом Батова, ми знову підтвердили відданість Визволенню; з ім'ям маршала Рокоссовскоґо на устах і думкою про стару Батьківщину ми розтопчемо всіх окупантів! Ура!"
 
 SVR_the_marshal: "Маршал"
 SVR_the_marshal_desc: "Маршал Константін Рокоссовскій є маяком надії для мешканців Західного Сибіру, об'єднавчою постаттю, яка битиметься до останнього за народ Росії. Його майже героїчна присутність вселяє довіру громадянам і впевненість військам. Поки маршал може вести нас, нам нічого боятися."
 SVR_fortified_homes: "Укріплені будинки"
 SVR_fortified_homes_desc: "У великих містах різні житлові будівлі поспіхом укріплено, щоб хоч трохи захистити їх від бомбардувань Люфтваффе. Це далеко не досконалий захід, але принаймні він убезпечить людей, доки ми шукаємо постійніше рішення."
 SVR_fortified_homes_2: "Укріплені будинки"
 SVR_fortified_homes_2_desc: "Ми можемо скільки завгодно укріплювати оселі, та бомби Люфтваффе надто потужні, щоб наші теперішні засоби надійно їх стримували. Інженери створили широку мережу бомбосховищ, що зміями тягнуться під містами на глибині, цілком безпечній від будь-якого повітряного нападу."
 SVR_fortified_homes_3: "Укріплені будинки"
 SVR_fortified_homes_3_desc: "Завдяки праці інженерів мешканці Округу нарешті можуть відчути безпеку перед загрозою німецьких нальотів. Безліч будинків і квартир укріплено, а на випадок, якщо цього виявиться замало, споруджено бомбосховища."
 SVR_fortified_factories: "Укріплені фабрики"
 SVR_fortified_factories_desc: "Хоч повномасштабне виробництво ще неможливе, деякі менш уразливі фабрики укріплено проти німецьких нальотів. Тепер, коли ця промисловість здебільшого захищена, ми можемо поволі повертатися до нормального життя."
 SVR_fortified_factories_2: "Укріплені фабрики"
 SVR_fortified_factories_2_desc: "Крім укріплень та інших заходів проти можливих нальотів, ми запровадили зміни в самих умовах праці. Робітники працюватимуть у зміни, які німці рідше зможуть перервати, а досвідчені наглядачі стежитимуть за безперебійним виробництвом."
 SVR_new_russian_army: "Нова російська армія"
 SVR_new_russian_army_desc: "Із насіння, посіяного маршалом Рокоссовскім та його ветеранською Третьою армією, постає цілком нова сила. Очолювана найдосвідченішими офіцерами світу й укомплектована найхоробрішими людьми Сибіру, нова російська армія з часом може стати однією з найкращих у світі."
 SVR_new_russian_army_2: "Нова російська армія"
 SVR_new_russian_army_2_desc: "Нещодавно відроджена російська армія й далі вдосконалюється. Завдяки новому режиму підготовки з наголосом на взаємодії й тактичній гнучкості війська на полі бою працюють як годинник, що підвищує їхню загальну ефективність."
 SVR_new_russian_army_3: "Нова російська армія"
 SVR_new_russian_army_3_desc: "Завдяки досвідові неперевершеного офіцерського корпусу Третю армію перековано на щось цілком нове. Нові режими підготовки й реформи дали нам одну з найбоєздатніших сил російської анархії, і настав час застосувати її. Уперед, товариші, до перемоги!"
 SVR_new_russian_army_4: "Нова російська армія"
 SVR_combined_russian_army: "Об'єднана російська армія"
 SVR_combined_russian_army_desc: "Нові режими підготовки дали змогу докорінно поліпшити організацію війська. Наші солдати - найкращі в Росії, і вони це знають. Армія впевнено марширує, усвідомлюючи свою перевагу й знаючи, що всякий супротивник буде розбитий її міццю."
 SVR_specialized_defense: "Спеціялізована оборона"
 SVR_specialized_defense_desc: "Товариш генерал Крєйзєр - майстер оборонної стратегії, і він запропонував програму посилення обороноздатности військ. Наші частини застосовуватимуть високомобільні з'єднання, здатні миттєво реагувати на ворожі вторгнення й громити їх раптовими безжальними контратаками."
 SVR_specialized_defense_2: "Спеціялізована оборона"
 SVR_specialized_defense_2_desc: "У межах програми товариша Крєйзєра з поліпшення обороноздатности армії розширено медичний корпус Червоної армії. Він краще облаштовуватиме польові шпиталі позаду фронту, а нові тактики допоможуть виносити поранених товаришів із небезпеки."
 SVR_specialized_defense_3: "Народний щит"
 SVR_specialized_defense_3_desc: "Трагічний факт війни полягає в тому, що цивільні неминуче страждають. Та Червона армія була й завжди буде захисницею народу. Тому одним із її головних обов'язків у прийдешніх війнах стане захист громадян Росії. У цивільних районах уже зведено й укомплектовано укріплення, готові до оборони. Молимося, щоб вони ніколи не знадобилися."
 SVR_efficient_resource_extraction: "Ефективний видобуток ресурсів"
 SVR_efficient_resource_extraction_desc: "Відколи в Сурґуті знайшли нафту, ми скористалися нагодою запровадити ефективніші способи видобування, діставши ширший доступ до природних ресурсів."
 SVR_savant_high_command_idea: "Блискуче верховне командування"
 SVR_savant_high_command_idea_desc: "Рокоссовскій. Батов. Крєйзєр. Баґрамян. Це лише кілька славетних імен у верховному командуванні Червоної армії. Нашими військами керують одні з найуміліших і найдосвідченіших командирів світу, і використання їхнього величезного досвіду дасть плоди в майбутніх конфліктах."
 SVR_quality_small_arms: "Якісна стрілецька зброя"
 SVR_quality_small_arms_2: "Якісна стрілецька зброя"
 SVR_quality_small_arms_2_desc: "Завдяки новим зразкам зброї зі Златоуста й нашого конструкторського бюро від часу створення армії ми значно поглибили знання та вміння у виробництві озброєння. Колись наші війська мали лише зброю, знайдену на трупі старої Росії, а тепер ідуть у бій із найкращою стрілецькою зброєю. З такими рушницями вони готові кинути виклик світові - і свого часу зроблять це."
 SVR_simple_small_arms: "Спрощена стрілецька зброя"
 SVR_simple_small_arms_desc: "Знання саме собою є нагородою, але воно також дає чимало переваг тим, хто вміло ним користується. Науковці Свєрдловського конструкторського бюро вміють це якнайкраще: вони безперервно створюють сучасні зразки й водночас спрощують конструкції для масового виробництва на наших потужностях. Невдовзі кожен солдат може отримати сучасну гвинтівку."
 SVR_security_service: "Бюро внутрішньої безпеки"
 SVR_security_service_2: "Бюро внутрішньої безпеки"
 SVR_eyes_inside_the_machine_idea: "Розвідувальні групи"
 SVR_eyes_inside_the_machine_idea_desc: "Елітні оперативні групи бюро безпеки, названі «розвідувальними групами», здатні виконувати широкий спектр наступальних завдань - від диверсій до ризикованого проникнення. Збір розвідданих і «мокрі справи» також належать до їхніх спеціяльностей. Ці вправні агенти неодмінно стануть незамінним активом у прийдешні дні."
 SVR_eyes_inside_the_machine_idea_2: "Очі всередині машини"
 SVR_airland_battles: "Повітряно-наземна битва"
 SVR_airland_battles_desc: "Повітряно-наземна битва - військовий принцип тісної координації сухопутних і повітряних сил. Наземні війська наступають агресивними маневрами й виконують роль передової оборони, тоді як авіяція б'є по підкріпленнях у ворожому тилу, забезпечуючи швидкий прорив і сильно послаблюючи оборонні позиції супротивника."
 SVR_intelligence_leaks: "Витоки розвідданих"
 SVR_agitated_populace: "Збурене населення"
 SVR_prisoner_labor: "Праця в'язнів"
 SVR_increased_rations: "Збільшені пайки"
 SVR_increased_rations_desc: "Нехай усі знають: за маршала ніхто не голодуватиме! Робітники Військового округу отримають збільшені пайки відповідно до внеску в краще життя нашого народу. Працювати на фабриках нині небезпечно, але з повним шлунком це, можливо, буде легше."

 SVR_black_league_influence_tier_1: "Низький вплив Чорної Ліги"
 SVR_black_league_influence_tier_1_desc: "Завдяки ретельним перевіркам і постійній пильності вплив Чорної Ліги в Окрузі здебільшого приборкано. Викрито кількох дрібних агентів, але їхній вплив обмежений, і вони не загрожують жодному урядовому чи військовому органові, від якого залежить безперервність управління."

 SVR_black_league_influence_tier_2: "Середній вплив Чорної Ліги"
 SVR_black_league_influence_tier_2_desc: "Вплив Чорної Ліги зростає. Дедалі більше агентів успішно переходять кордон і дістають доступ до захищених зон, впливаючи на урядові й військові операції. Стан ще не критичний, але легко може таким стати, тож потрібні рішучі дії."

 SVR_black_league_influence_tier_3: "Високий вплив Чорної Ліги"
 SVR_black_league_influence_tier_3_desc: "Вплив Чорної Ліги на адміністрацію Округу зріс іще більше: кількох агентів виявлено в особливо захищених зонах, а повідомлення про диверсії множаться. Це загрожує самому існуванню Округу й більше не може тривати. Діяти вже не просто варто - необхідно."
 
 SVR_black_league_influence_tier_4: "Дуже високий вплив Чорної Ліги"
 SVR_black_league_influence_tier_4_desc: "Стан жахливий. Агенти Чорної Ліги проникли майже на всі рівні командної структури Округу, паралізувавши можливість довготривалого управління чи оборони від їхніх військових операцій. В Округу майже не лишилося часу - він мусить діяти! Негайно!"

 SVR_revisionist_influence_tier_1: "Низький вплив ревізіоністів"
 SVR_revisionist_influence_tier_1_desc: "Завдяки постійній ретельній перевірці політичних поглядів офіцерів більшість прихильників ревізіонізму викрито, а ті, що переховуються, майже не мають влади. Округ захищений від цієї загрози. Поки що."

 SVR_revisionist_influence_tier_2: "Середній вплив ревізіоністів"
 SVR_revisionist_influence_tier_2_desc: "Серед низки молодших офіцерів виявлено тривожний рівень симпатій до ревізіонізму. Основи адміністрації Округу ще не під загрозою, але через це вже скомпрометовано кілька другорядних об'єктів та операцій, тож проблему слід розв'язати зараз."

 SVR_revisionist_influence_tier_3: "Високий вплив ревізіоністів"
 SVR_revisionist_influence_tier_3_desc: "В Окрузі виявлено небезпечно високий рівень симпатій до ревізіонізму, зокрема серед кількох старших офіцерів. Це вже безпосередньо призвело до передання ворогам важливих військових таємниць і планів. Потрібні зосереджені зусилля, щоб викорінити таких прихильників."

 SVR_revisionist_influence_tier_4: "Дуже високий вплив ревізіоністів"
 SVR_revisionist_influence_tier_4_desc: "Стан критичний. Підтверджено присутність прихильників ревізіонізму на найвищих рівнях командування, що серйозно підриває стабільність Округу та спроможність вести військові операції. Якщо негайно не вжити радикальних заходів, усе може бути втрачено!"

 SVR_revisionist_sabotage: "Ревізіоністські партизани"
 SVR_revisionist_terrorism: "Ревізіоністські терористи"
 SVR_black_league_sabotage: "Диверсанти Чорної Ліги"
 SVR_black_league_terrorism: "Терористи Чорної Ліги"
 SVR_unhappy_workers: "Невдоволені робітники"
 SVR_unhappy_workers_desc: "Наше рішення силою покласти край робітничим протестам розлютило трударів, і багато хто далі вдається до пасивного опору урядові. Через це виробництво сповільнилося, та з часом люди схаменуться."
 SVR_unhappy_army: "Невдоволена армія"
 SVR_unhappy_army_desc: "Рішення подолати нестачу серед робітників і цивільних коштом скорочення пайків та ресурсів для армії підірвало бойовий дух. Ми запевнили солдатів, що це тимчасово, але у війську все одно дещо побільшало дезертирів."
 SVR_demoralized_army: "Деморалізована армія"
 SVR_demoralized_army_desc: "Червона армія знала кращі часи. Дезертирство стає тривожно поширеним, а бойовий дух упав до найнижчого рівня. Заходи для піднесення настрою солдатів уже тривають, але нормалізація потребує часу. А доти, ймовірно, дезертирів стане ще більше..."
 SVR_worker_concessions: "Поступки робітникам"
 SVR_worker_concessions_desc: "Ми вирішили перекинути матеріали й кошти з війська на забезпечення цивільних життєво потрібними товарами. Поступки задовольнили робітників, але у збройних силах чути невдоволене бурчання."
 SVR_specialized_forces_idea: "Спеціялізовані війська"
 SVR_specialized_forces_idea_desc: "Щоб підвищити пристосовність нової армії, створено окремий рід сил спеціяльного призначення. Ці війська опановуватимуть складніші види бойових дій - від гірської війни до морських десантів. Їхня підготовка значно суворіша за звичайну, зате такий солдат не боїться жодної, хай і найпідступнішої місцевости."
 SVR_sverdlovsk_design_bureau_idea: "Свєрдловське конструкторське бюро"
 SVR_sverdlovsk_design_bureau_idea_desc: "Для кращої підготовки Червоної армії до небезпек сучасної війни засновано Свєрдловське конструкторське бюро. Цей спеціяльний науково-дослідний відділ цілодобово розроблятиме нову зброю та спорядження й, сподіваємося, допоможе нам випереджати ворогів у військовій техніці."
 SVR_sverdlovsk_design_bureau_idea_2: "Свєрдловське конструкторське бюро"
 SVR_sverdlovsk_design_bureau_idea_2_desc: "Завдяки новому збільшенню фінансування бюро може найняти більше науковців, придбати більше матеріалів і випробувати більше зброї. Здається, для навчання бійців завжди є нове спорядження - рідкісна розкіш у російській анархії. Поки армія стрімко модернізується, перемога видається майже певною."
 SVR_expanded_logistics_corps: "Розширений корпус логістики"
 SVR_expanded_logistics_corps_desc: "Щоб війська не втрачали постачання й могли битися навіть у віддалених краях, корпус логістики розширено й удосконалено. Це допоможе перемагати ворога навіть за межами звичайної досяжности наших ліній постачання."
 SVR_sown_fear: "Свєрдловська загроза"
 SVR_sown_fear_desc: "Рокоссовскій і 3-тя армія готують наступ, а наші солдати буквально тремтять у чоботях. Бойовий дух низький, дезертирство високе, поразка здається неминучою. Боже, поможи нам."
 SVR_council_of_generals: "Рада генералів"
 SVR_council_of_generals_desc: "Рада, до якої входять найвидатніші генерали Свєрдловска, полегшує Рокоссовскому тягар урядування. Вона радитиме йому щодо цивільних і військових починань та стримуватиме в разі зловживання владою, забезпечуючи тривалу стабільність Округу."
 SVR_russian_stratocracy_idea: "Російська стратократія"
 SVR_russian_stratocracy_idea_desc: "В Уральському військовому окрузі армія є хребтом уряду, уособлюючи керівництво й захист держави. Російська анархія вимагає могутніх і дисциплінованих воїнів, тож наша держава віддає армії левову частку коштів і матеріалів, вироблених нашим володінням.\n\nДехто з цивільних може нарікати на «фаворитизм» та інші дрібниці, та мало хто сумнівається у здібностях армії, і всі вітають її захист."
 SVR_russian_stratocracy_idea_2: "Російська стратократія"
 SVR_russian_stratocracy_idea_2_desc: "В Уральському військовому окрузі армія є хребтом уряду, уособлюючи керівництво й захист держави. Російська анархія вимагає могутніх і дисциплінованих воїнів, тож наша держава віддає армії левову частку коштів і матеріалів, вироблених нашим володінням.\n\nДехто з цивільних може нарікати на «фаворитизм» та інші дрібниці, та мало хто сумнівається у здібностях армії, і всі вітають її захист."
 SVR_increased_reconstruction_efforts_idea: "Посилені зусилля з відбудови"
 SVR_increased_reconstruction_efforts_idea_desc: "Зусилля з возз'єднання Західного Сибіру тяжко позначилися на інфраструктурі. Бої спричинили знеструмлення міст, цілковито вивели дороги з ладу й підірвали здатність розгортати військові сили. Це не може тривати. Фінансування збільшено, а ремонтні бригади відряджено виправляти шкоду, щоб знову зв'язати нашу державу воєдино."
 SVR_defense_industry_idea: "Оборонна промисловість"
 SVR_defense_industry_idea_desc: "Нові фабрики постають мало не щотижня й безперервно виробляють озброєння для оборони держави [SVR.GetName]. Уперше військові замовлення справді виконуються. Тепер у кожного не просто є рушниця: кожен солдат отримує повний комплект найновішого спорядження Бюро. Робітники тилу наближають перемогу - по одній гвинтівці за раз."
 SVR_rokossovsky_military_academy: "Військова академія Рокоссовскоґо"
 SVR_rokossovsky_military_academy_desc: "Маршал Рокоссовскій, найяскравіший військовий розум покоління, дав ім'я академії, яка, сподіваємося, виховає такі ж блискучі уми. Відкрита лише кілька років тому, вона прийняла багатьох охочих вступити до офіцерського корпусу. Щедро фінансована й добре укомплектована академія відкриває шлях до величі всім, хто прагне нею йти."
 SVR_gazprom: "Ґазпром"
 SVR_gazprom_desc: "Ґазпром - державна енергетична корпорація, створена для розпорядження величезними запасами нафти. Вона забезпечить ефективний видобуток для цивільних і військових потреб, збільшуючи виробництво пального загалом."
 SVR_price_controls_idea: "Контроль цін"
 SVR_price_controls_idea_desc: "Щоб стримати дедалі вищу інфляцію, Рада вирішила запровадити контроль цін на низку життєво потрібних товарів і ресурсів. Економісти невдоволені, та це необхідно для стабільности економіки, доки вона не вийшла з-під контролю."
 SVR_sweeping_privatization_idea: "Масштабна приватизація"
 SVR_sweeping_privatization_idea_desc: "З Єльциним біля стерна Росія починає повільний, нерівний марш до капіталізму. Колишню державну власність передають підприємцям-початківцям, загартованим життям ділкам і всім проміжним типам. Лише час покаже, чи завершиться ця перебудова всієї економіки успіхом або невдачею."
 SVR_novosibirsk_harassment: "Тиск із боку Новосібірска"

