 ### Regional political tree ###
 SVR_the_status_of_the_district: "Стан округу"
 SVR_the_status_of_the_district_desc: "Після років війни, бомбардувань і кровопролиття нам, схоже, нарешті вдалося об'єднати Західний Сибір під нашою владою. Коли буде викорінено останні осередки спротиву воєначальників та ідеологічних фанатиків, нам доведеться ухвалити кілька непростих рішень. Свєрдловск роками перебував під військовим правлінням, і воно добре служило нашим інтересам. Тодішня нестабільність у Росії вимагала надати військовим перевагу в ухваленні рішень на державному рівні.\n\nОднак Свєрдловск уже виконав поставлене завдання. Ми возз'єднали значну частину Росії та довели нашу державу до становища, коли їй більше не загрожує постійне вторгнення. Прихильники демократії стверджують, що за таких обставин час розпочати перехід до демократичного ладу. Військові заперечують, що такі заходи передчасні, а наше становище ще недостатньо безпечне для запровадження демократії. Щоб розв'язати це питання, буде проведено референдум. Чи стане Свєрдловск демократією?"
 
 SVR_the_army_knows_best: "Армія знає краще"
 SVR_the_army_knows_best_desc: "Наша держава ще не перебуває в достатній безпеці, щоб розпочати запровадження демократії. Доба воєначальників у Росії, можливо, добігає кінця, але до об'єднання країни ще далеко. Великі наддержави, що постали з попелу Совєцького Союзу, не менш, а то й більш небезпечні за будь-які попередні загрози.\n\nХоча ми, безперечно, принципово підтримуємо цю систему, заради народу поки що не можемо покласти край військовому правлінню. Якщо для цього доведеться вдатися до брудних прийомів на прийдешньому референдумі - нехай так."
 
 SVR_fledgling_democratic_institutions: "Зародження демократичних інституцій"
 SVR_fledgling_democratic_institutions_desc: "Підготувати державний апарат до переходу до демократії - нелегке завдання. Потрібно не лише змінити функції колишніх бюрократичних органів і відомств та відповідні системи призначень, а й створити цілком нові інституції, пристосовані до нової форми правління.\n\nЙдеться про такі інституції, як національний конгрес і незалежна судова влада. Обов'язки та функції, які раніше виконували військові, треба відокремити від виконавчої влади й розподілити між цими установами. Створювати нову систему влади важко, але зрештою воно того варте."
 
 SVR_deciding_the_future: "Визначення майбутнього"
 SVR_deciding_the_future_desc: "Настав день референдуму. Чоловіки й жінки по всій країні завмерли в очікуванні результатів. Робітники фабрик і копалень сидять у барах із напоями в руках і напружено вслухаються в слова радіодиктора.\n\nГрупа молодих студентів чекає на площі столиці неминучого оголошення з гучномовців. Солдати збираються групами в казармах і терпляче чекають, доки капітани повернуться з верховного командування з новинами. Уся країна затамувала подих, поки урядовець підраховує голоси й оголошує переможцем..."
 
 ### Batov political tree ###
 SVR_the_guiding_hand_of_the_marshal: "Напрямна рука маршала"
 SVR_the_guiding_hand_of_the_marshal_desc: "Армія під проводом маршала Павєла Батова здобула перемогу на виборах! Тепер, коли армія втримала контроль над урядом, маршал Батов і далі вестиме Округ до перемог над усіма, хто загрожує Росії та її народові.\n\nВоєнні плани буде переглянуто й виправлено. Фінансування військових досліджень подвоять разом із бюджетом самої армії. Під проводом нашого маршала Округ процвітатиме й розширюватиметься. Невдовзі ми, можливо, навіть зможемо називати себе Росією."
 
 SVR_establish_the_council_of_generals: "Заснувати Раду генералів"
 SVR_establish_the_council_of_generals_desc: "Навіть найвеличніший лідер не здатен керувати державою самотужки. Буде засновано Раду генералів, покликану радити маршалові та допомагати виконувати його розпорядження як на передовій, так і в уряді. Генерали матимуть і друге призначення: вони стримуватимуть владу маршала.\n\nЯкщо він колись почне ухвалювати непослідовні рішення або діяти всупереч стабільності чи добробуту Округу, вони втрутяться й усунуть його з посади голови уряду. Сподіваємося, ситуація ніколи не дійде до такого, але якщо це станеться, ми будемо готові."
 
 SVR_russian_stratocracy: "Російська стратократія"
 SVR_russian_stratocracy_desc: "Наша державна адміністрація є взірцем військової ефективности. Під час служби солдатів привчають до найсуворішої дисципліни, і вони зберігають це ставлення до життя й після звільнення. Ці люди стають воїнами - хоробрими й готовими без страху робити те, чого вимагає мить.\n\nНаші військові - найкращі з найкращих, і вони довели свою ефективність та надійність в уряді. Тож цілком розумно зарезервувати окремі державні посади за колишніми військовослужбовцями. Віддаючи важливі посади тим, хто в тій чи іншій ролі служив у війську, ми забезпечуємо ефективність і легітимність уряду."
 
 SVR_enshrine_army_traditions: "Закріпити армійські традиції"
 SVR_enshrine_army_traditions_desc: "3-тя армія та її традиції відіграли визначальну роль у перемогах над нашими ворогами. Її вплив не лише на уряд, а й на ширшу культуру всієї держави був величезним.\n\nСаме мужність і дисципліна цих людей провели Округ крізь найтяжчі часи, і народ це помітив. Ми мусимо подбати, щоб військові традиції шанували, а до ветеранів ставилися з повагою. Надто багато наших солдатів бачили загибель товаришів, аби тепер терпіти зневагу якоїсь вуличної молоді. Наші люди дістануть заслужену пошану."
 
 SVR_calm_their_fears: "Заспокоїти їхні страхи"
 SVR_calm_their_fears_desc: "Чимало громадян досі остерігаються військового правління, попри минулі урядові та військові успіхи нашої військової адміністрації. Ми маємо розвіяти ці страхи й переконати суспільство, що військові знають, що найкраще для країни, і дієво працюють задля її добробуту.\n\nПропагандистська кампанія, що висвітлить минулі перемоги війська та вихвалятиме управління економікою і державою з боку військової адміністрації, має значною мірою змінити ставлення громадян до військового правління."
 
 SVR_enlistment_benefits: "Пільги за вступ до армії"
 SVR_enlistment_benefits_desc: "Армії завжди потрібні нові люди. Коли вороги за кордоном нарощують свої сили, ми мусимо робити те саме. Однак для збільшення набору доведеться зробити пропозицію привабливішою для молоді. Після такої значної стабілізації геополітичного становища загроза неминучого вторгнення вже не настільки дієвий мотив.\n\nГарантована пенсія ветеранам, суспільна повага й можливість стати частиною політичної системи Округу - лише деякі переваги, які дістане солдат після вступу до армії. Це напевно має підвищити рівень набору."
 
 SVR_establish_provincial_military_governors: "Призначити військових губернаторів"
 SVR_establish_provincial_military_governors_desc: "Місцеві урядовці нижчої ланки та виборні губернатори неабияк ускладнюють роботу нашої адміністрації. Вони зволікають із запровадженням ухвалених нами законів, неодноразово прямо виступали проти правлячої військової ради й заохочували антивійськову зраду.\n\nТакого більше не можна терпіти. Віднині всі посади губернаторів провінцій та політичні посади в інших адміністративних підрозділах влади обійматимуть військові офіцери, а не місцеві виборні керівники чи партійні урядовці."
 
 SVR_rewarding_the_loyal: "Нагородити лояльних"
 SVR_rewarding_the_loyal_desc: "Попри всі наші зусилля, чимало громадян досі невдоволені нашим правлінням. Вони стверджують, що таке втручання війська в урядування є корумпованим, неефективним і шкодить участі громадян у владі. Ми мусимо показати, що це зовсім не так.\n\nГромадянам, безперечно, дозволено брати участь в урядуванні, якщо вони доведуть достатню лояльність і надійність. Хоча більшість важливих посад обійматимуть військові, задля вдоволення народу ми зарезервуємо кілька символічних посад нижчої бюрократичної ланки для пересічних громадян без досвіду служби."
 
 SVR_for_the_greater_good: "Заради вищого блага"
 SVR_for_the_greater_good_desc: "Військове правління необхідне, щоб урятувати державу від корумпованих і недієздатних політиків. У минулому вони не змогли захистити країну від небезпечних ідеологій на кшталт марксізму й фашизму, і немає підстав вважати, що зможуть у майбутньому. Віднині уряд контролюватимуть винятково військові та збройні сили.\n\nВільні партії, готові підривати нашу національну безпеку, буде заборонено. Хоча запроваджені заходи можуть засмутити частину громадян, важливо пам'ятати: все, що ми робимо, ми робимо заради вищого блага."
 
 SVR_ease_martial_law: "Пом'якшити воєнний стан"
 SVR_ease_martial_law_desc: "Реакція на чимало наших нещодавніх законів і проголошень була доволі негативною. Громадяни дедалі більше обурюються тим, що ми зробили після приходу до влади, а деякі навіть вдаються до насильства.\n\nЩоб утихомирити суспільне обурення й, можливо, послабити напруження, військовий уряд негайно пом'якшить воєнний стан та обмеження нічної комендантської години, а згодом планує цілком їх скасувати. Сподіваємося, це заспокоїть населення й зробить жорсткішу відповідь непотрібною."
 
 SVR_a_meaningful_life: "Гідне життя"
 SVR_a_meaningful_life_desc: "Маршал - суворий, а подекуди й жорсткий керівник, але не байдужий. Маршал Батов розуміє тяжке становище простого робітника й те, за що бореться наша країна. Негайно буде запроваджено низку правил і реформ у промисловості та ширшій економіці для поліпшення умов праці.\n\nЗокрема, його реформи зосередяться на скороченні робочого часу та кількох помірних заходах безпеки. Це має й далі вгамовувати невдоволення та зміцнювати підтримку війська. Маршал дбає про нас, простих людей."
 
 SVR_every_hand_is_useful: "Кожна пара рук потрібна"
 SVR_every_hand_is_useful_desc: "У перші роки Бухаріна й Сибірського плану умови праці були жахливими. Комуністична партія мало дбала про безпеку громадян, а виробничі нещасні випадки траплялися надто часто.\n\nМи ж є значно сучаснішою та освіченішою державою, яка не може миритися з такими непотрібними втратами. Тому маршал схвалив подальше регулювання, яке поліпшить норми безпеки й запобігатиме надто частим аваріям. Якщо ми прагнемо колись правити Росією, жодна людина не є зайвою."
 
 SVR_the_guardians_of_russia: "Вартові Росії"
 SVR_the_guardians_of_russia_desc: "Маршал, його Рада й армія - єдине, що захищає нашу державу від навколишнього хаосу. Вони убезпечили нас, і під їхнім проводом наша країна перемагала навіть у найскрутніші часи. Тепер ми мусимо зробити те саме для решти Росії.\n\nНаш народ лежить розбитий і розпорошений російськими пустками, і якщо він колись знову об'єднається й стане цілим, то лише під нашою владою. Ми - вартові Росії, які берегтимуть і захищатимуть її, пильнуючи всіх, хто бажає їй зла."
 
 ### Regional Batov economy tree ###
 SVR_rebuilding_the_district: "Відбудова Округу"
 SVR_rebuilding_the_district_desc: "Округ зазнав величезних руйнувань упродовж останніх років. Запеклі бої призвели до масового знищення інфраструктури й промисловости та забрали тисячі життів. Настав час вкладати кошти у відбудову країни.\n\nСировину й ресурси спрямують на відновлення фабрик і прокладання нових доріг, людям, чиї засоби до існування знищено, нададуть фінансову допомогу, а для численних переселенців створять табори. Сподіваємося, за кілька місяців більшість промисловости знову запрацює, а людей буде розселено."
 
 SVR_taking_inventory: "Провести інвентаризацію"
 SVR_taking_inventory_desc: "Від колишніх держав воєначальників, які ми завоювали, залишилися сотні, якщо не тисячі одиниць обладнання та зброї. Майже все воно кепсько виготовлене, застаріле або в поганому стані, але здебільшого досі працює. Чимало гвинтівок та іншого спорядження просто лежать без нагляду й можуть потрапити до рук будь-яких повстанців.\n\nМи маємо знайти, описати й зберегти все залишене обладнання та додати його до власних запасів - задля безпеки й на випадок надзвичайної потреби. Можливо, ця зброя ніколи не знадобиться, але завжди краще мати й не потребувати, ніж потребувати й не мати."
 
 SVR_temporary_fully_controlled_economy: "Тимчасова контрольована економіка"
 SVR_temporary_fully_controlled_economy_desc: "Хоча Округ цілковито відкидає планову економіку й автаркічний устрій, які проповідують комуністичні та фашистські держави, стала очевидною потреба запровадити воєнну економіку, не надто відмінну від раніше відкинутих нами систем.\n\nВійна за панування в Росії неминуча. І хоча планова економіка в довгостроковій перспективі значно менш ефективна за вільний ринок, у такі часи ми просто не можемо дозволити власникам фабрик і промисловим магнатам викручувати руки урядові."
 
 SVR_the_resources_of_siberia: "Ресурси Сибіру"
 SVR_the_resources_of_siberia_desc: "Нашій воєнній економіці потрібні ресурси, і, на щастя, ми сидимо на одному з найбільших їхніх запасів у світі. Мінеральні багатства Сибіру так само великі, як сам Сибір, тож ми маємо активніше їх розробляти, щоб виробляти все потрібне військове спорядження. Крім того, після завершення об'єднання й повернення Росії до вільного ринку ми зможемо зміцнити економіку, продаючи ці ресурси за кордон і здобуваючи дешевий та доступний капітал."
 
 SVR_a_fair_wage: "Справедлива зарплата"
 SVR_a_fair_wage_desc: "Навіщо ми працюємо над об'єднанням Росії, як не заради простих людей? Усі наші невтомні зусилля спрямовані на створення стабільної та справедливої держави для всіх народів Росії, де кожен трудівник одержує належну платню. Тому уряд запровадить новий закон про справедливу оплату праці й підвищить мінімальну зарплату в усій країні. Сподіваємося, це підвищить не лише заробітки, а й рівень життя та купівельну спроможність пересічного громадянина. Часи змінилися, але наша відданість народові - ні."
 
 SVR_the_best_and_the_brightest: "Найкращі й найталановитіші"
 SVR_the_best_and_the_brightest_desc: "Якщо тисяча років історії чогось і навчила нас, то це того, що краща технологія майже завжди перемагає. Османські гармати під мурами Константинополя, британські стрільці, що колонізували Африку, чи один німецький бомбардувальник, який одним ударом завершив Другу світову війну, - ми раз у раз бачили перевагу, яку кращі технології дають над ворогами. Можливо, ще важливіший їхній вплив на власну країну.\n\nПромислова революція у сто разів збільшила економічне виробництво Великої Британії, полегшила перевезення сільськогосподарських товарів і визволила мільйони з бідности. Ми мусимо знайти найкращих і найталановитіших людей країни й надати їм усі ресурси, потрібні для впровадження Росії в майбутнє."
 
 SVR_military_engineering_schools: "Військово-інженерні училища"
 SVR_military_engineering_schools_desc: "Зі зростанням економіки будуватимуться нові фабрики, починатимуться будівельні проєкти й засновуватимуться технічні компанії - усім їм потрібні інженери. На жаль, нинішня система освіти не здатна задовольнити навіть поточний попит, не кажучи вже про потреби за кілька років. Навіть військовим бракує добрих інженерів.\n\nТому для полегшення становища військо візьме на себе будівництво кількох нових інженерних училищ. Навчання буде безкоштовним за умови, що після випуску студент чотири роки служитиме. Відслуживши, він зможе повернути свої знання цивільній економіці. Виграють усі!"
 
 SVR_investing_in_machinery: "Інвестиції в обладнання"
 SVR_investing_in_machinery_desc: "Після краху, що настав слідом за Західноросійською війною, ми зовсім не могли досліджувати новіші й ефективніші виробничі машини та технології.\n\nОднак тепер, коли возз'єднання Росії завершено, ми нарешті можемо зосередитися на модернізації промислових технологій країни. Базова інтеграція комп'ютерів, надійніше й зручніше обладнання для великих виробничих комплексів та впровадження установок ізостатичного пресування мають підвищити наші виробничі можливості."
 
 SVR_expand_the_bureau: "Розширити бюро"
 SVR_expand_the_bureau_desc: "Свєрдловське конструкторське бюро значно перевершило всі сподівання, які ми покладали на нього під час створення. Воно очолило розробки в багатьох сферах - від нової стандартної гвинтівки до новаторських досліджень транзисторних обчислень та їхнього застосування для підвищення ефективности нинішніх комп'ютерів.\n\nЗ огляду на величезний внесок цієї організації в національну безпеку й науку загалом, підвищення фінансування цілком доречне. Ба більше, самі лише значно зрослі бюджетні потреби бюро через розширення й модернізацію дослідницьких об'єктів виправдовують підвищення бюджету щонайменше на тридцять-сорок відсотків."
 
 SVR_increase_reconstruction_efforts: "Посилити зусилля з відбудови"
 SVR_increase_reconstruction_efforts_desc: "Відбудова наших земель триває довше, ніж очікувалося. Бойові дії останніх воєн разом із і без того критичною нестачею інфраструктури в сільських районах і між ними безмірно сповільнили процес.\n\nПонад половину видатків досі було спрямовано винятково на ремонт доріг та іншої інфраструктури, тому в задоволенні потреб населення ми майже не просунулися. Щоб справді щось змінити, мусимо подвоїти зусилля з відбудови, збільшивши фінансування й залучену робочу силу."
 
 SVR_the_defense_industry: "Оборонна промисловість"
 SVR_the_defense_industry_desc: "Цивільна промисловість, звичайно, важлива. Вона потрібна економіці мирного часу й буде необхідною для відбудови Росії. Проте відбудовувати буде нічого, якщо армія залишиться без зброї. Росії досі загрожують вороги з усіх боків, і вкладення в оборонну промисловість забезпечать війську достатню силу для боротьби з ними.\n\nКоли на наших кордонах стоять такі держави, як Німеччина та Японія, нам потрібне не лише найкраще спорядження, а й якнайбільше його."
 
 SVR_the_civilian_industry: "Цивільна промисловість"
 SVR_the_civilian_industry_desc: "Цивільна промисловість життєво важлива для сили країни. Економіка, цілком зосереджена на військовому виробництві, не здатна функціонувати. Цивільна промисловість забезпечує всі побутові потреби народу - від тостерів, плугів і лампочок до лопат.\n\nНайважливіше для уряду те, що вона сприяє економічному зростанню й постачає матеріали для будівництва нових фабрик, зокрема сталь, бетон і скло. Щоб відбудувати Росію, ми мусимо інвестувати в цивільну промисловість і виробляти потрібні для цього матеріали."
 
 SVR_on_the_way_to_recovery: "На шляху до відновлення"
 SVR_on_the_way_to_recovery_desc: "Наша політика та інвестиції почали давати плоди. Люди знову виходять на вулиці, витрачають гроші й користуються кредитами. Уперше за десятиліття фабрики почали виробляти товари й вироби, цілком не пов'язані з війною.\n\nВулиці й залізниці, що сполучають великі та малі міста, більше не обриваються й не вкриті вирвами. Росіяни по всій країні відчувають нове почуття, яке давно вважали забутим. Росіяни знову починають відчувати мир."

 ### Yeltsin political tree ###
 SVR_a_victory_for_democracy: "Перемога демократії!"
 SVR_a_victory_for_democracy_desc: "Західний Сибір давно не бачив світла свободи. Спершу регіоном правили фанатичні комуністи Лазара Каґановіча, а тоді він швидко загруз у тристоронньому протистоянні між ними, крайніми реваншистами Чорної Ліги та нашою державою, яка теж має сумну історію авторитаризму. Відмінність, звісно, в тому, що наш режим контролював суспільство через необхідність, а не ідеологію. Тепер, коли на Уралі нарешті мир, у такій твердій руці більше немає потреби.\n\nМаршал Батов вирішив розпочати передачу влади цивільному урядові на чолі з надійним політиком Борісом Єльциним як головою Західносибірської республіки. Єльцин відомий підтримкою економічних реформ, тож за його правління регіон може очікувати послаблення як політичних, так і ринкових обмежень."
 
 SVR_begin_privatization: "Розпочати приватизацію"
 SVR_begin_privatization_desc: "Військовий режим мав схильність зосереджувати навколо себе не лише політичну, а й економічну владу та націоналізував низку ключових секторів, хоча й не зайшов так далеко, як попередні комуністи. Наслідком стали роздуті й неефективні державні підприємства, нездатні належно реформуватися чи давати прибуток. Вони могли бути потрібні у воєнний час, але не забезпечать майбутнього зростання. Потрібні реформи.\n\nПриватизація й поділ цих велетнів сприятимуть здоровій конкуренції та зрештою заможнішому суспільству. Під поверхнею вирує творчий потенціял, і для кращого майбутнього треба лише дати підприємливим громадянам Західного Сибіру змогу його вивільнити."
 
 SVR_ensure_regional_soviet_autonomy: "Автономія регіональних совєтів"
 SVR_ensure_regional_soviet_autonomy_desc: "Однією зі спадщин комуністичної адміністрації є регіональні органи влади, які майже не впливали на управління своїми землями. Військові відкинули ідею автономії нижчих рівнів влади, вважаючи, що мають нагальніші турботи. Розподіл повноважень - важливий крок до демократії: передати все центральному урядові означає прокласти певний шлях до тиранії.\n\nТому президент Єльцин вирішив передати регіональним совєтам значні повноваження щодо оподаткування, видатків і багатьох інших справ, щоб народ мав більше представництва, ніж у часи, коли всі рішення ухвалювали свєрдловські бюрократи. Народ, наділений владою, - щасливий народ, а ніщо не вдовольняє маси так, як самовизначення."
 
 SVR_codify_the_constitution: "Ухвалити конституцію"
 SVR_codify_the_constitution_desc: "Досі уряд здебільшого правив указами. Право й політика переважно залежали від рішень маршала Батова, і хоча він аж ніяк не був жорстоким правителем, рішення через це часто були довільними, а іноді й суперечили інтересам народу. Щоб не перетворитися на владу, яка править лише силою, уряд потребує узгоджених правил - саме на цьому наполягає президент Єльцин.\n\nНова конституція Західносибірської республіки захищатиме основоположні свободи слова, самовираження, віросповідання та зібрань. Вона визначить ролі різних гілок влади й прояснить відносини між місцевим і федеральним урядами. Можливо, ми не одразу відчуємо її користь, але цей документ стане основою демократії, що колись охопить усю країну."
 
 SVR_free_the_press: "Дати свободу пресі"
 SVR_free_the_press_desc: "Жодна вільна держава не може існувати без вільної преси. Преса - четверта влада й засаднича складова демократії. Вона виконує роль сторожа, викриваючи корумпованих політиків та урядовців. У минулі роки пресу змушували мовчати, намагаючись підтримувати моральний дух у тяжкі часи й зберігати стабільність уряду.\n\nОднак ніхто не розумів, що така політика й регулювання ЗМІ лише дестабілізували уряд і послаблювали країну, дозволяючи панувати корупції та несправедливості. Час цензури минув. Тепер настала доба вільної преси."
 
 SVR_moving_to_a_civilian_administration: "Перехід до цивільної адміністрації"
 SVR_moving_to_a_civilian_administration_desc: "Реформи президента Єльцина вже змінили значну частину західносибірського суспільства, але досі відбувалися за військового режиму. Недостатньо змінити лише найвищу владу: щоб уряд був справді належним, цивільні керівники мають стояти на кожному його щаблі. Інакше конфлікт інтересів між військом і державою цілком може призвести до корупції та відродження деспотизму.\n\nГенералів на державних посадах буде звільнено й замінено кваліфікованими цивільними кандидатами. Чинні військовослужбовці більше не обійматимуть посад, які мають бути виборними. Ці заходи можуть здаватися різкими, але лише так можна запобігти перетворенню нового уряду на хунту під тонкою демократичною оболонкою."
 
 SVR_meet_with_the_marshal: "Зустрітися з маршалом"
 SVR_meet_with_the_marshal_desc: "Зміна влади спричинила неабияке занепокоєння в деяких верствах суспільства. Військові посадовці сумніваються в мудрості відкривати суспільство в бурхливі часи й не вірять, що приватизація принесе щось, крім збагачення купки спекулянтів коштом національних інтересів. Сутичка між реформаторами Єльцина й військом стала б катастрофою для Республіки, тож нинішній і колишній президенти зустрінуться, щоб владнати суперечності.\n\nБатов і Єльцин обговорять економіку, демократизацію та роль армії в новому уряді, прагнучи компромісу, прийнятного для всіх сторін. Прихильники жорсткої лінії з обох боків можуть нарікати на результат, але всі погодяться: діялог незрівнянно кращий за кровопролиття як спосіб розв'язання суперечок."
 
 SVR_free_the_parties: "Дати свободу партіям"
 SVR_free_the_parties_desc: "Тепер, коли демократію в країні забезпечено, час знову відкрити політичну сцену для партій. Нові й різноманітні політичні партії життєво необхідні для подальшого успіху демократії. Якщо народ не має партій, із якими може себе ототожнити й через які висловити політичні погляди, то навіщо взагалі така демократія? Вона буде лише представництвом еліти, яка контролює найбільші партії!\n\nХай там як, ця подія стане визначною миттю нашої історії. Хай живе Республіка!"
 
 SVR_ensure_army_representation: "Забезпечити представництво армії"
 SVR_ensure_army_representation_desc: "Новий уряд цілком цивільний, але армія явно потребує певної ролі. Розмова президента з маршалом Батовим показала необхідність співпраці різних частин держави під час переходу Західного Сибіру до демократії. Відчужувати армію дуже небезпечно; доклавши зусиль, її можна зробити союзником демократії, а не ворогом.\n\nУ парламенті молодої Республіки завжди буде певне військове представництво для підтримання добрих відносин між ним і виборним урядом. Воно стане підвалиною стабільности наших інституцій: якщо цивільні правителі зійдуть із правильного шляху, військо зможе втрутитися й захистити систему та національну безпеку. Поки Західносибірській республіці загрожують внутрішні й зовнішні вороги, ця схема має значний потенціял."
 
 SVR_checks_and_balances: "Стримування і противаги"
 SVR_checks_and_balances_desc: "Жодна справжня демократія не може вважати себе такою без належної системи стримувань і противаг. Вона гарантує, що влада не зосередиться надмірно в руках однієї людини чи групи.\n\nНашій республіці така система потрібна щодо армії. Хоча формально ми вже стали республікою, військо досі має величезний вплив на політику. Треба поступово позбавити його частини цієї влади, можливо, домовившись із військовим керівництвом."
 
 SVR_a_shaky_foundation: "Хиткий фундамент"
 SVR_a_shaky_foundation_desc: "Хоча наша республіка тепер має вільний і демократичний лад, нам досі доводиться розв'язувати чимало проблем, успадкованих від військового правління. Найпомітніша з них - украй низька участь громадян у демократії.\n\nБагато громадян або не знають про свої нові демократичні права й обов'язки, або байдужі до них. Ми мусимо поінформувати їх про те, що вони можуть і чого не можуть робити в нашій країні, та зробити активними виборцями, готовими діяти відповідно до своїх переконань."
 
 SVR_for_a_better_tomorrow: "Заради кращого завтра"
 SVR_for_a_better_tomorrow_desc: "Попри невдачі на шляху до демократії, ми щиро сподіваємося невдовзі стати справедливим і рівноправним суспільством. Уже утворилися нові політичні партії та розпочали кампанії, навіть звичайні громадяни обговорюють економіку й політичну теорію, а люди починають вірити в систему, до якої ще рік тому не мали жодного доступу. Російський народ прямує до справжньої свободи й демократії, і доки ми працюємо разом, для нас немає нічого неможливого."
 
 ### Regional Yeltsin economy tree ###
 SVR_yeltsin_rebuilding_the_republic: "Відбудова Республіки"
 SVR_yeltsin_rebuilding_the_republic_desc: "Наша Західносибірська республіка в жалюгідному стані. Нещодавні битви й війни на шляху до об'єднання знищили значну частину інфраструктури та промисловости, причому найгірше становище на завойованих землях. Звісно, попереднє десятиліття панування воєначальників і бомбардувань Люфтваффе лише погіршило справу.\n\nДавно настав час зосередити політичні й економічні зусилля на відбудові країни та підвищенні рівня життя. Інфраструктура й промисловість уже є - їх лише треба відремонтувати та оновити."
 
 SVR_yeltsin_taking_inventory: "Провести інвентаризацію"
 SVR_yeltsin_taking_inventory_desc: "Від колишніх держав воєначальників, які ми завоювали, залишилися сотні, якщо не тисячі одиниць обладнання та зброї. Майже все воно кепсько виготовлене, застаріле або в поганому стані, але здебільшого досі працює. Чимало гвинтівок та іншого спорядження просто лежать без нагляду й можуть потрапити до рук будь-яких повстанців.\n\nМи маємо знайти, описати й зберегти все залишене обладнання та додати його до власних запасів - задля безпеки й на випадок надзвичайної потреби. Можливо, ця зброя ніколи не знадобиться, але завжди краще мати й не потребувати, ніж потребувати й не мати."
 
 SVR_yeltsin_allow_strikes: "Дозволити страйки"
 SVR_yeltsin_allow_strikes_desc: "Право на страйк є засадничим для демократії та прав робітників. Діставши нагоду, корпорація неминуче зловживатиме правами працівників. Можливість страйку дасть громадянам змогу колективно домовлятися про кращу платню й умови праці.\n\nЦе приносить користь не лише робітникам, а й економіці загалом. Що більше багатства повертається громадянам, то більше вони витрачають на товари й вироби. До того ж право на страйк можна вважати частиною свободи самовираження. У кожному разі ми мусимо послабити обмеження щодо страйкарів, а за можливости й цілком їх скасувати."
 
 SVR_yeltsin_towards_a_market_economy: "До ринкової економіки"
 SVR_yeltsin_towards_a_market_economy_desc: "Десятиліттями російська економіка була майже цілком спрямована на війну й виробництво зброї. Фабрики випускали не тостери, а гвинтівки, артилерію, танки, літаки й усі можливі вибухові речовини. Однак тепер, коли наша держава стрімко наближається до повного об'єднання російських земель, ми можемо переорієнтуватися на звичайнішу ринкову економіку.\n\nЕкономіку, де люди створюють прилади для поліпшення життя, а не збільшення руйнівної сили. Економіку, де зростання кладе людям до кишень більше грошей, а не солдатам до рук більше гвинтівок. Економіку для мирного народу, а не суспільства у вічній війні."
 
 SVR_yeltsin_a_more_efficient_social_safety_net: "Ефективніша система соціального захисту"
 SVR_yeltsin_a_more_efficient_social_safety_net_desc: "Зі стабілізацією становища й економіки в Росії уряд дістав більше вільних ресурсів. Було висунуто чимало пропозицій щодо їх використання, але останнім часом переконливо доводять потребу поліпшити систему соціального захисту літніх і безробітних.\n\nХіба ми не повинні шанувати старших - тих, хто бився у Другій світовій та Західноросійській війнах? Тих, хто стільки пожертвував заради Батьківщини? А ще безробітних і злиденних. Усі ми знаємо, що таке крайня бідність. Якщо ці два десятиліття чогось нас навчили, то принаймні співчуття до тих, хто втратив усе. Ми мусимо більше давати нашому народові."
 
 SVR_yeltsin_establish_the_gazprom_energy_company: "Заснувати енергетичну компанію Ґазпром"
 SVR_yeltsin_establish_the_gazprom_energy_company_desc: "Сибір належить до найбагатших на ресурси регіонів світу. Тут є не лише рясні жили цінних руд і мінералів, а й одні з найглибших нафтових покладів планети. Раніше від доступу до цих багатств нас відділяв лише брак капіталу.\n\nТепер, із швидким відновленням економіки, держава має більше фінансових ресурсів для інвестицій. Зважаючи на дедалі більшу потребу країни в нафтовій енергії, цілком логічно використати багаті сибірські землі, якими ми володіємо. Для цього й створено нову державну енергетичну корпорацію - компанію Ґазпром."
 
 SVR_yeltsin_the_best_and_the_brightest: "Найкращі й найталановитіші"
 SVR_yeltsin_the_best_and_the_brightest_desc: "Якщо тисяча років історії чогось і навчила нас, то це того, що краща технологія майже завжди перемагає. Османські гармати під мурами Константинополя, британські стрільці, що колонізували Африку, чи один німецький бомбардувальник, який одним ударом завершив Другу світову війну, - ми раз у раз бачили перевагу, яку кращі технології дають над ворогами. Можливо, ще важливіший їхній вплив на власну країну.\n\nПромислова революція у сто разів збільшила економічне виробництво Великої Британії, полегшила перевезення сільськогосподарських товарів і визволила мільйони з бідности. Ми мусимо знайти найкращих і найталановитіших людей країни й надати їм усі ресурси, потрібні для впровадження Росії в майбутнє."
 
 SVR_yeltsin_expand_the_bureau: "Розширити бюро"
 SVR_yeltsin_expand_the_bureau_desc: "Свєрдловське конструкторське бюро значно перевершило всі сподівання, які ми покладали на нього під час створення. Воно очолило розробки в багатьох сферах - від нової стандартної гвинтівки до новаторських досліджень транзисторних обчислень та їхнього застосування для підвищення ефективности нинішніх комп'ютерів.\n\nЗ огляду на величезний внесок цієї організації в національну безпеку й науку загалом, підвищення фінансування цілком доречне. Ба більше, самі лише значно зрослі бюджетні потреби бюро через розширення й модернізацію дослідницьких об'єктів виправдовують підвищення бюджету щонайменше на тридцять-сорок відсотків."
 
 SVR_yeltsin_increase_reconstruction_efforts: "Посилити зусилля з відбудови"
 SVR_yeltsin_increase_reconstruction_efforts_desc: "Відбудова наших земель триває довше, ніж очікувалося. Бойові дії останніх воєн разом із і без того критичною нестачею інфраструктури в сільських районах і між ними безмірно сповільнили процес.\n\nПонад половину видатків досі було спрямовано винятково на ремонт доріг та іншої інфраструктури, тому в задоволенні потреб населення ми майже не просунулися. Щоб справді щось змінити, мусимо подвоїти зусилля з відбудови, збільшивши фінансування й залучену робочу силу."
 
 SVR_yeltsin_the_civilian_industry: "Цивільна промисловість"
 SVR_yeltsin_the_civilian_industry_desc: "Цивільна промисловість життєво важлива для сили країни. Економіка, цілком зосереджена на військовому виробництві, не здатна функціонувати. Цивільна промисловість забезпечує всі побутові потреби народу - від тостерів, плугів і лампочок до лопат.\n\nНайважливіше для уряду те, що вона сприяє економічному зростанню й постачає матеріали для будівництва нових фабрик, зокрема сталь, бетон і скло. Щоб відбудувати Росію, ми мусимо інвестувати в цивільну промисловість і виробляти потрібні для цього матеріали."
 
 SVR_yeltsin_the_defense_industry: "Оборонна промисловість"
 SVR_yeltsin_the_defense_industry_desc: "Цивільна промисловість, звичайно, важлива. Вона потрібна економіці мирного часу й буде необхідною для відбудови Росії. Проте відбудовувати буде нічого, якщо армія залишиться без зброї. Росії досі загрожують вороги з усіх боків, і вкладення в оборонну промисловість забезпечать війську достатню силу для боротьби з ними.\n\nКоли на наших кордонах стоять такі держави, як Німеччина та Японія, нам потрібне не лише найкраще спорядження, а й якнайбільше його."
 
 SVR_yeltsin_investing_in_machinery: "Інвестиції в обладнання"
 SVR_yeltsin_investing_in_machinery_desc: "Після краху, що настав слідом за Західноросійською війною, ми зовсім не могли досліджувати новіші й ефективніші виробничі машини та технології.\n\nОднак тепер, коли возз'єднання Росії завершено, ми нарешті можемо зосередитися на модернізації промислових технологій країни. Базова інтеграція комп'ютерів, надійніше й зручніше обладнання для великих виробничих комплексів та впровадження установок ізостатичного пресування мають підвищити наші виробничі можливості."
 
 SVR_yeltsin_on_the_way_to_recovery: "На шляху до відновлення"
 SVR_yeltsin_on_the_way_to_recovery_desc: "Наша політика та інвестиції почали давати плоди. Люди знову виходять на вулиці, витрачають гроші й користуються кредитами. Уперше за десятиліття фабрики почали виробляти товари й вироби, цілком не пов'язані з війною.\n\nВулиці й залізниці, що сполучають великі та малі міста, більше не обриваються й не вкриті вирвами. Росіяни по всій країні відчувають нове почуття, яке давно вважали забутим. Росіяни знову починають відчувати мир."
 
 ### Regional military tree ###
 SVR_the_grand_russian_army: "Велика російська армія"
 SVR_the_grand_russian_army_desc: "Третя армія, один із найорганізованіших і найкраще оснащених військових підрозділів, що досі існують у Росії, знову довела свою цінність і перемогла в руйнівних війнах, які спустошили Західний Сибір. Проте бойові дії викрили серйозні вади наших стратегічних і тактичних доктрин, які можуть стати згубними, якщо майбутні вороги навчаться їх використовувати.\n\nТепер, коли в регіоні відновлено мир, розпочнеться всебічний перегляд і модернізація бойових можливостей армії. Ми вже маємо грізну силу, але дозволити суперникам наздогнати нас означало б накликати лихо. Коли сильні сторони війська буде відточено до гостроти леза, Третя армія рушить далі як найвеличніша збройна сила всієї Росії, і перемогу буде практично гарантовано."
 
 SVR_the_cream_of_the_crop: "Найкращі з найкращих"
 SVR_the_cream_of_the_crop_desc: "Наш офіцерський корпус уславився як найкращий у Росії, але чи відповідають тій самій планці сотні тисяч підлеглих йому солдатів? Реформи стандартів підготовки дали нам нищівно ефективні війська у війні проти ревізіоністів і підступної Чорної Ліги, але після перемоги ставки значно зросли, а з усіх боків нас оточили ще могутніші вороги.\n\nТому буде проведено ще ширшу перебудову режиму підготовки. Наші й без того вправні війська доведуть свої можливості до межі завдяки новим стандартам набору й програмам навчання. Третя армія стане добірною силою з найкращих людей Західного Сибіру - найкращих бійців, яких здатен дати регіон. На менше ми не погодимося."
 
 SVR_mechanized_troop_training: "Підготовка механізованих військ"
 SVR_mechanized_troop_training_desc: "Під час війни з ревізіоністами Лазара Каґановіча їхні численні моторизовані сили стали грізною перешкодою для наших військ, які переважно билися пішки. Хоча зрештою ми здобули тяжку перемогу, навіть поразкою ворог дав нам важливий урок: механізація сухопутних військ є абсолютною необхідністю, а механізовані підрозділи - основою будь-якої справді сучасної армії.\n\nНечисленні механізовані сили, які ми маємо нині, геть непридатні до завтрашніх воєн. Щоб створити справді сучасне військо, вся армія мусить опанувати нові методи підготовки, зосереджені на практичному застосуванні високомобільних механізованих підрозділів, і краще пристосуватися до полів бою майбутнього."
 
 SVR_an_end_to_outdated_tactics: "Кінець застарілим тактикам"
 SVR_an_end_to_outdated_tactics_desc: "Досі армія покладалася на тактики, які цілком пасували б полям Другої світової війни майже двадцять років тому. Поки що вони були достатніми, як показала війна за об'єднання Західного Сибіру під нашою владою, але роки минають, а часи змінюються швидше, ніж здається.\n\nЗа десятиліття, які ми провели, спочиваючи на лаврах, незліченні нові види зброї та способи війни стали буденністю. Якщо не діяти негайно, наші армії лишаться далеко позаду й перетворяться на музейні реліквії! Настав час відкласти вчорашню тактику й прийняти завтрашню."
 
 SVR_centralized_command: "Централізоване командування"
 SVR_centralized_command_desc: "Наше військо має найкращий офіцерський корпус, який може запропонувати Росія, але нинішня структура командування марно обмежує його таланти. Щоб краще скористатися видатними здібностями офіцерів, верховне командування запропонувало широку централізацію командного ланцюга, яка зменшить зайву тяганину й полегшить передавання наказів.\n\nДіставши більше контролю над своїми силами, генерали зможуть ефективніше керувати поступовим перетворенням війська на високопрофесійну бойову силу, гідну здійснити майбутнє возз'єднання Росії."
 
 SVR_the_shield_of_the_people: "Щит народу"
 SVR_the_shield_of_the_people_desc: "Захист народу Росії від незліченних лих цієї жорстокої доби воєначальників був однією з визначальних цілей, заради яких постала наша держава. Тепер, коли ми контролюємо значно більшу частину розбитої країни, ця шляхетна місія стала ще важливішою, ніж у тяжкі дні після розпаду Західносибірської народної республіки.\n\nТому ми ніколи не повинні забувати первісну місію й маємо гарантувати безпеку народу за будь-яких обставин. На наших землях буде споруджено укріплення для стримування можливих загарбників, а задля зменшення страждань цивільних уже запропоновано численні вдосконалення оборонної стратегії."
 
 SVR_legacy_of_the_third_army: "Спадщина 3-ї армії"
 SVR_legacy_of_the_third_army_desc: "Коли ми відчайдушно тікали від тиранічного правління Лазара Каґановіча та його республіки, основою наших збройних сил стала уславлена Третя армія. Крізь усі випробування її хоробрі чоловіки й жінки вели нашу державку від перемоги до перемоги та забезпечили тривалий мир народові Західного Сибіру. З новими конфліктами на обрії ветерани Третьої, без сумніву, ще напишуть нові розділи своєї тріюмфальної історії.\n\nТретя армія - не просто наша найелітніша сила, а героїчний символ усього, що нині уособлює нова Червона армія. Її вагома спадщина стане взірцем для всіх майбутніх армій, а сама Третя - яскравим маяком чести й дисципліни, до якого прагнутимуть наші шляхетні війська."
 
 SVR_the_sverdlovsk_tank_factory: "Свєрдловський танковий завод"
 SVR_the_sverdlovsk_tank_factory_desc: "Свєрдловський танковий завод - один із найбільших танкових заводів, що досі працюють у Росії; на заході з ним може зрівнятися лише завод «Красноє Сормово». На жаль, завод дуже постраждав від страшної Люфтваффе та її жорстоких нальотів, і значну частину руйнувань так і не відремонтовано. Його жалюгідний стан украй обмежує виробництво, тож якщо ми хочемо створити значні танкові сили для Червоної армії, треба діяти.\n\nЗавод не лише відремонтують: уже складено амбітні плани розширити його далеко за межі колишніх можливостей. Якщо втілити їх у життя, завод відродиться, а наше військо нарешті дістане грізний танковий парк, здатний змести ворогів Росії!"
 
 SVR_quality_materials: "Якісні матеріали"
 SVR_quality_materials_desc: "Яка користь із танка, що не витримує навіть найпростішої сучасної протитанкової зброї? Поки Росія грузла в безладі, протитанкові боєприпаси пішли далеко вперед, і багато нових засобів зроблять наші бронетанкові війська цілковито безпорадними, якщо ворог почне їх застосовувати. На щастя, поки розробляються кращі танки, існує тимчасове рішення.\n\nПоліпшивши якість металів, із яких виготовляють танки, ми зможемо підвищити їхню стійкість проти протитанкової зброї. На жаль, наші сили переважно покладаються на застарілі конструкції минулого десятиліття, але якісніші метали й трохи винахідливости дозволять змінити схему бронювання, підвищивши живучість машин і втримавши їх у бою."
 
 SVR_establish_the_rokossovsky_military_academy: "Військова академія Рокоссовскоґо"
 SVR_establish_the_rokossovsky_military_academy_desc: "Константін Рокоссовскій був не просто генералом: він убезпечив народ Свєрдловска й героїчно переломив боротьбу з тиранами, які його гнобили. Навіть нині блискучі стратегії Лева Сибіру неабияк впливають на наші армії, а без його мудрого керівництва ми не досягли б і близько таких успіхів удома та за його межами.\n\nНа честь нещодавно померлого маршала у Свєрдловску незабаром відчинить двері Військова академія Рокоссовскоґо. Цей осередок військової науки стане колискою нового покоління російських офіцерів і дозволить нам із гордістю зберегти традицію найуміліше керованої сили Росії, хоч би як невблаганно плинув час.\n\nНавіть після смерти старий лев навіки залишиться провідником і сторожем хоробрих офіцерів Червоної армії."
 
 SVR_the_expertise_of_zlatoust: "Досвід Златоуста"
 SVR_the_expertise_of_zlatoust_desc: "Блискучі інженери Златоуста були майстрами своєї справи й стояли на передньому краї виробництва озброєнь навіть порівняно з іноземними розробками. Їхню зброю недарма можна знайти по всій розбитій Росії. Златоустівські рушниці дешеві у виробництві, надійні в бою й мають страшну силу. Легко зрозуміти, чому воєначальники Росії ладні платити за них королівський викуп!\n\nТепер, коли Златоуст і його збройові заводи під нашим контролем, варто й далі фінансувати цих конструкторів. Але цього разу вони служитимуть нам, а не собі. Златоустівські фабрики винятково постачатимуть нашому війську одну з найпередовіших у світі зброї та спорядження, залишаючи суперників далеко позаду."
 
 SVR_the_factories_of_tyumen: "Заводи Тюмєні"
 SVR_the_factories_of_tyumen_desc: "Тюмєнський регіон - ключовий промисловий осередок Західного Сибіру, але назвати його фабрики жалюгідними означало б значно применшити лихо. Регіон роками потерпав від бездарного правління режиму Каґановіча, й промисловість заплатила високу ціну за некомпетентність колишнього тирана. Останнім цвяхом у труну стали бурі війни, що не так давно прокотилися рештками республіки.\n\nТепер, коли режим повалено, ми можемо ремонтувати й розширювати фабрики Тюмєні, повертаючи їх до ладу. Тюмєнь - один із наріжних каменів промисловости Західного Сибіру, і її відродження до колишньої слави неодмінно принесе економіці величезну користь."
 
 SVR_the_airfields_of_surgut: "Аеродроми Сурґута"
 SVR_the_airfields_of_surgut_desc: "Переважна більшість авіяційних об'єктів Західного Сибіру нині є лише розбомбленими рештками колишньої величі через невпинні й несправедливі бомбардування гунів. Однак із сурґутськими аеродромами все геть інакше.\n\nКолись незалежні Вільні авіятори зразково їх утримували, тож вони зберегли майже бездоганний стан і належать до найбільших досі чинних авіяційних об'єктів Росії. Тепер, коли за ними стоїть уся держава, ми можемо розширити й поліпшити аеродроми далеко понад колишні можливості, щоб вони краще служили молодим повітряним силам."
 
 SVR_revolutionary_designs: "Революційні розробки"
 SVR_revolutionary_designs_desc: "Поліпшення броні наших танків уже видаються багатообіцяльними, але старі купи брухту не можна переробляти вічно: рано чи пізно виявляться серйозні вади, яких не виправити ще одним шаром рознесеної броні. Механізованим силам потрібні нові сучасні конструкції, а нинішні моделі не годяться.\n\nМаючи відновлений танковий завод у Свєрдловску та Уральський автомобільний завод, ми можемо й мусимо зробити краще. Наші техніки, одні з найгеніяльніших у своєму поколінні, невдовзі наполегливо працюватимуть над бронемашинами майбутнього. Нові вдосконалені танки з найсучаснішими боєприпасами й бронею пануватимуть на полі бою, а модернізовані БМП доставлятимуть війська в бій і підтримуватимуть їх вогневою міццю, здатною зрівняти із землею цілий квартал."
 
 SVR_eyes_inside_the_machine: "Очі всередині машини"
 SVR_eyes_inside_the_machine_desc: "Однією з найприкріших рис Західносибірських воєн був рівень проникнення ворога до наших лав. Жодна частина державки - від цивільного сектору до війська - не була в безпеці, а шпигуни постійно загрожували операціям. Створення Бюро внутрішньої безпеки дозволило покласти край більшій частині цього безумства, але після об'єднання регіону загрози стали більшими, а БВБ нині не здатне їм протистояти.\n\nТому ми збільшимо фінансування БВБ для розширення його діяльности. Відтепер ми не ховатимемося за обороною, викорінюючи проникнення лише після виявлення. БВБ перейде в наступ, проводитиме сміливі шпигунські місії на ворожій території й застосовуватиме найсучасніші обчислювальні технології для зламу кодів. Бюро стане нашими пильними очима й вухами, і жодна загроза державі більше не лишиться непоміченою."
 
 SVR_invincible_and_legendary: "Непереможна й легендарна"
 SVR_invincible_and_legendary_desc: "Товариші, реформи майже завершено! Наші війська нарешті здобули звання найкраще підготовленої професійної бойової сили всієї Росії, грізний танковий парк зростає щодня, а нездоланна воєнна машина Уралу нарешті ожила після майже двох десятиліть сну. Це потребувало багато часу й праці, але Червону армію перетворено на справді сучасну силу, більш ніж готову до будь-яких майбутніх випробувань.\n\nОб'єднання Західного Сибіру було лише початком шляху. Невдовзі ми звернемо увагу на повне визволення всієї країни. Народ Росії волає про справедливість, і Червона армія сумлінно відповість на заклик! Наші непереможні війська стануть жахіттям для самозваних тиранів розбитої землі, а легендарні генерали поведуть їх до перемоги!"
 
 ### Regional foreign diplomacy tree ###
 SVR_reaching_out: "Налагодження контактів"
 SVR_reaching_out_desc: "Твердо контролюючи Західний Сибір, ми можемо знову брати участь у міжнародній політиці. Першим завданням буде встановити зв'язок із зовнішнім світом. У добу воєначальників Свєрдловску було важко обмінюватися інформацією навіть з Арханґєльском, не кажучи про далекі держави на кшталт Сполучених Штатів.\n\nОднак тепер, коли регіон швидко стабілізується під нашою владою, відновлення контактів не має бути складним. Якщо пощастить, нашим пріоритетом стане міжнародне визнання, можливо, навіть як законної держави-наступниці Росії та/або Совєцького Союзу. Крім того, варто розпочати торгові переговори з великими державами, як-от Сполучені Штати і Японія, а також із сусідами."
 
 SVR_approach_the_eagle: "Наблизитися до Орла"
 SVR_approach_the_eagle_desc: "Сполучені Штати Америки - одна з наймогутніших держав світу, що змагається з Японією та Німеччиною за впливом і військовою силою. З огляду на небезпечне становище Росії між двома останніми державами, на кордонах з обома й з двома з найдовших сухопутних кордонів із цими наддержавами у світі, Сполучені Штати закономірно зацікавлені в нашій подальшій безпеці та процвітанні.\n\nТож ми маємо намагатися здобути прихильність Вашинґтона хоча б для того, щоб відкрити шлях до можливих майбутніх угод."
 
 SVR_establishing_a_consulate: "Заснування консульства"
 SVR_establishing_a_consulate_desc: "Перші зустрічі зі Сполученими Штатами пройшли добре! Вони доволі прихильно прийняли делегацію, і ми навіть устигли попередньо обговорити форми підтримки, яку вони могли б надати нашій країні. З огляду на помірний успіх цієї справи варто попросити дозволу заснувати консульство у Вашинґтоні.\n\nЦе консульство могло б стати місцем для переговорів про економічні й військові угоди з урядом Сполучених Штатів та навіть для встановлення деяких не цілком офіційних контактів у Північній Америці."
 
 SVR_dragunovs_connections: "Зв'язки Драґунова"
 SVR_dragunovs_connections_desc: "Хоча ми можемо мати особисті заперечення щодо Євґєнія Драґунова та його численних минулих справ із нашими ворогами, не можна заперечити користи від його вражаючої мережі закордонних контактів і зв'язків, чимало з яких він зберіг після падіння Златоуста. Треба звернутися до Драґунова й спробувати укласти взаємовигідну угоду.\n\nМи знімемо з нього всі звинувачення, пов'язані з часами торгівлі зброєю та керівництва Златоустом, а він допоможе нам вийти на нові ринки й укласти торгові угоди через свої численні закордонні контакти. Виграють усі."
 
 SVR_show_them_our_worth: "Показати, чого ми варті"
 SVR_show_them_our_worth_desc: "Наша країна може бути малою, але має багато що запропонувати охочим торгувати з нами. Промислові можливості обмежені, а запаси капіталу невеликі, зате ми маємо одні з найбільших на континенті запасів дешевих природних ресурсів, передусім нафти з далекої півночі Сибіру.\n\nМи повинні дешево постачати цю сировину на закордонні ринки, заохочувати її купівлю й залучати подальші інвестиції до Росії. Якщо нам удасться знайти за кордоном покупців наших природних багатств, прості торгові відносини, можливо, вдасться перетворити на ширшу економічну угоду."
 
 SVR_tapping_the_market: "Вийти на ринки"
 SVR_tapping_the_market_desc: "Нам потрібен доступ до більшої кількости ринків. Ми хочемо не лише продавати товари й природні ресурси, а й діставати закордонні товари та інвестиції. Для цього доведеться розпочати повномасштабний дипломатичний наступ.\n\nНаші дипломати працюватимуть у кожній державі Центральної Азії, в Індії, Африці, Південній Америці та скрізь, де є легкодоступний ринок. Ми спробуємо укласти торгові угоди й економічні договори та знизити мита з якомога більшою кількістю охочих держав. Нехай гроші течуть."
 
 SVR_contact_rome: "Зв'язатися з Римом"
 SVR_contact_rome_desc: "Італійці контролюють один із найбільших єдиних ринків світу. Їхня імперія простягається від багатої Італії через нафтоносну Аравію до Суеца в Єгипті й має один із найпотужніших ринкових потенціялів на планеті, не кажучи вже про величезну споживчу базу.\n\nБуло б нерозумно навіть не спробувати туди проникнути. Ми надішлемо делегацію до Рима, встановимо дипломатичні відносини й розпочнемо торгові переговори. Якщо все складеться добре, матимемо нового партнера й доступ до італійських фінансових установ."
 
 SVR_sail_to_scandinavia: "Курс на Скандинавію"
 SVR_sail_to_scandinavia_desc: "Скандинавія нерозривно пов'язана з Росією. Ми не лише століттями мали спільний кордон, а й справили величезний взаємний вплив на політику та культуру.\n\nНині Росія лежить у руїнах, а Скандинавія пройшла крізь сорокові й п'ятдесяті переважно неушкодженою, якщо не рахувати завоювання Норвегії. Фінляндія та Швеція змогли вийти і на американський, і на німецький ринки та неабияк виграли. Якщо встановимо торгові відносини зі Скандинавією, то й ми зможемо скористатися перевагами її унікального становища."
 
 SVR_into_the_world: "У світ"
 SVR_into_the_world_desc: "Ми досягли значних успіхів у виведенні країни на світову арену. Ми не лише здобули визнання кількох закордонних держав, а й зміцнили економічні відносини та загальну силу нашої держави в Росії.\n\nЗавдяки встановленим зв'язкам шлях до об'єднання стане значно легшим, а ширша російська економіка неодмінно зміцніє завдяки нашим зусиллям із відкриття нових ринків. Світ спостерігає, як у Росії постає нова сила. Не розчаруймо його."

