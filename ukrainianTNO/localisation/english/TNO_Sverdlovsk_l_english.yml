 #Guardians of the Skies
 SVR_Guardians_Of_The_Skies: "Вартові небес"
 SVR_Guardians_Of_The_Skies_desc: "§O588-й нічний бомбардувальний полк§!, відомий як Нічні відьми або «Вільні авіятори», - справжні герої. Вони гідно й відважно служили Батьківщині під час Великої Вітчизняної війни й продовжують служити тепер, здійснюючи бойові вильоти проти нацистських бомбардувальників із головної бази в Сурґуті. Завдяки спільному корінню в Совєцьких збройних силах у нас завжди були особливі відносини з авіяторами. Їхня інтеграція не лише зміцнить наш контроль над Західним Сибіром, а й дасть доступ до їхнього досвіду повітряного бою та бомбардувальних крил."

