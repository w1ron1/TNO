 ##=====| Events |=====##
 ########################

 SVR.1.t: "Ранкова трапеза в Окрузі"
 SVR.1.desc: "Косий зазирнув на дно чавунного казана, у каламутний суп, що вкривав його зсередини. До стінок поприлипали квасолини, наче перлини серед бурхливого моря. Косий мусив визнати, що страва була не надто поживною чи ситною, але їжа є їжа. Він перевів погляд на чергу чоловіків, жінок і дітей, які чекали на щоденну пайку хліба й супу. Він зітхнув. Цього, мабуть, теж було замало. Косий поглянув на металеве блюдо поруч із собою - кілька крихт майже зливалися з тьмяною, грифельно-сірою поверхнею.\n\nПоряд стояв новобранець Пискун із гвинтівкою, знятою з плеча. Час від часу рядовому доводилося верескливо кричати, щоб утримати натовп у порядку. Без гвинтівки чоловіки й жінки в черзі сміялися б із Пискунового голосу.\n\n"Гей, - сказав Косий, упіймавши погляд новачка. - Тобі допомогти? Хочеш помінятися, новенький?"\n\n"Ні, - Пискун напружив голос, намагаючись звучати старшим за свої роки. - Усе гаразд. Я впораюся". Хлопця закинули до відділення суворих на вигляд ветеранів, і він намагався говорити так, ніби був тут своїм. Решта його не надто любила, але Косий бачив у Пискуновій поставі певну твердість: прагнення жити, перевершуючи те, чого вимагав обов'язок. Дай йому час, казав Косий Пекарю. Дай йому час.\n\n"Як скажеш". На початку Косий і сам був не бозна-ким. Він майже не бачив, звідси й прізвисько Косий. Від дихання запітніли його окуляри з ледь придатними лінзами, і щойно він зняв їх, щоб протерти, як почув гудіння й гуркіт, що заглушили гамір натовпу.\n\n"Німці! - заверещав Пискун, і його голос пронизував жах. - Пригніться! Пригніться!" Не гаючи часу, Косий впустив окуляри й завмер лежачи, а серце так билося, наче от-от проломить грудну клітку. Гудіння, а тоді тиша. Минуло добрих кілька хвилин, перш ніж черга знову рушила."
 SVR.1.a: "Ще один звичайний ранок у військовому окрузі."

 SVR.2.t: "Свічки в спальні"
 SVR.2.desc: "Сьогодні вербувальник знову прийшов до Анатолієвого дому. Батько, чиї суглоби рипіли в унісон із дерев'яними мостинами, пішов відчиняти. У тьмяній спальні Анатолій чекав на повернення старого. Вербувальник мав зрозуміти: хоч як Анатолій хотів би воювати на передовій, хворий батько потребував його більше. Він дивився на полум'я, що пожирало ґніт свічки, яка поволі танула, аж воно випалювало йому очі.\n\n"Але ваш син уже призовного віку..." - твердий, рішучий голос відлунював коридорами маленького будинку. Він затихав, обертаючись на глухі удари й відгомін, а слова змішувалися з вечірнім шумом. Гавкав сусідський пес, легкий вітер ворушив землю.\n\n"Пане офіцере, перепрошую, - сказав батько словами, обтяженими втомою й віком. - Але він мені потрібен. Ви ж, певно, розумієте..." Удар і відгомін. Голоси металися туди-сюди, парирували, атакували, завдавали ударів у відповідь. Анатолію було байдуже. Він почув, як грюкнули двері. Імпровізований прийом скінчився.\n\nКоли старий повернувся, Анатолій допоміг укласти його ноги й руки на ліжко, вмостивши голову на подертій брудній подушці. Світло осяяло батькове обличчя, і сиве волосся стало срібними нитками у мерехтінні слабкого свічкового вогню.\n\n"Не живи солдатським життям, - почув від нього Анатолій. - Не живи. Не живи". Батько поринув у царство сну й захропів."
 SVR.2.a: "Жодного іншого вибору, крім дому."

 SVR.3.t: "Відхід батька"
 SVR.3.desc: ""То як, - сказав вербувальник, і його голос аж клекотів від занепокоєння, - ваш батько здоровий?"\n\n"Ні", - відповів Анатолій.\n\nУ темній спальні, де спав його батько, до Анатолія долітали уривки розмови. І сьогодні ввечері батько не зміг підвестися й узятися до своїх обов'язків. Анатолій знову сидів біля свічки, полум'я якої пожирало ґніт і розносило запах топленого сала - парфуми для змучених душ. У полоні втоми й виснаження Анатолій сидів біля ліжка.\n\nАнатолій не знав, що за хвороба мучила його батька. Колись старий мав здоровий колір обличчя, а обриси живота видавали невеличке черевце. Тих надмірів більше не було. Там, де колись був жир, лишилися самі кістки. Там, де були енергія й запал, оселилися лише втома й млявість. Він не міг ходити, а руки раз у раз тремтіли, немов жили окремо й не корилися його волі.\n\nАнатолій знав, що батьків час швидко наближався. Він дивився на лагідно хропляче обличчя - образ шляхетної немочі. Може, сьогодні вночі, може, завтра. Анатолій змирився з цим. Якби вони жили деінде - у Фінляндії, Швеції чи Норвегії, - з батьком, можливо, все було б гаразд. Підвівшись із пошарпаного дерев'яного ослона, він рушив до своєї кімнати й перед виходом крадькома глянув на батька.\n\nОпівночі він почув, як хропіння стихло."
 SVR.3.a: "Так скінчилося ще одне життя в Окрузі."
 
 SVR.4.t: "Вербувальна кампанія"
 SVR.4.desc: ""Упишіть своє ім'я та вік, - сказав Пекар новобранцеві, - ось у цю анкету, будь ласка". Як лейтенант Округу, він бачив багатьох чоловіків і жінок, які записувалися на службу. Дехто обирав таке життя з патріотичних міркувань. Героїчний учинок, проте не всі виправдовували сподівання, породжені їхніми намірами. Інші йшли з чистого прагматизму. Таким людям Пекар співчував; зрештою, Рокоссовскій розплачувався не талонами чи рублями, а хлібом і супом.\n\nОднак чоловік перед ним опинився в тій самій ямі, у якій колись сидів Пекар. Це були люди, які не мали іншого вибору, крім як записатися на брудну роботу з керування машинами, що вбивають. Потенційний новобранець мав виснажений, грубий і занедбаний вигляд. Довге нечесане волосся, на підборідді поволі проступала вечірня щетина - чоловік виглядав зневіреним і знедоленим. І худим. Пекар не міг повірити, що йому лише вісімнадцять. Цю нещасну, обділену людину рекомендував Ґлєб. Батько був другом, сказав Ґлєб, до того ж хлопець уже досяг призовного віку.\n\nОтже, сирота. Нібито молодий чоловік заповнив анкету й показав її Пекарю. Двадцять років, підпис: Анатолій Данилович Морозов. Худий. Неохайний. Прутик - ось яким буде його прізвисько. Якби це був хтось інший, Пекар закреслив би старе ім'я й уписав нове прізвисько. Та за таких обставин він не зміг себе змусити.\n\n"Ідіть до медпункту, - сказав Пекар. - Якщо лікар дасть згоду, я видам вам спорядження й відправлю на муштру". Майже непомітний кивок. Та перш ніж Анатолій пішов, Пекар поплескав його по плечах. "Ви в надійних руках, - сказав Пекар. - Я пережив те саме. Усе буде гаразд".\n\nСльози перейшли в ридання. "Так, - сказав Анатолій. - Дякую"."
 SVR.4.a: "Анатолій Данилович Морозов: прийнятий на службу."

 SVR.5.t: "Два принципи"
 SVR.5.desc: "Інструктор із муштри зачекав, доки сяде останній новобранець із цієї партії - худорлявий недомірок на ім'я Анатолій Морозов, - а тоді почав. "Сидіти рівно, пси! Дивитися на мене, негайно!" - гримнув він громовим голосом. Десятки спин випросталися. Дехто з новобранців аж підскочив на стільці.\n\nВін назвався сержантом Кутузовим, а двох офіцерів обабіч представив як сержантів Тєрєщєнка й Базіна. "Наше завдання - підготувати кожного з вас до служби солдатом Уральського військового округу! Солдат Округу має мужність, відвагу, вправність і чесність! Він найкращий воїн у всій Росії! Ясно?"\n\n"Так точно!"\n\n"Солдат Округу розуміє дві речі! Перша: він росіянин. А отже, його обов'язок - захищати російський народ. Ви тут не заради помсти. Ви тут не заради слави. Ви тут, бо завинили це мільйонам співвітчизників, розчавлених під Гітлєровим чоботом! Ясно?"\n\n"Так точно!"\n\n"Друга: він належить до 3-ї армії, а отже, відданий 3-й армії. Ви будете так само віддані товаришеві-солдату, як і мені, Батову чи самому Рокоссовскому! Кожен без винятку чоловік у цій кімнаті покладається на те, що ви викладетеся до останку! Це, а також ваша відданість творенню нової, сильнішої та безпечнішої Росії, - усе, чого ми від вас просимо. Зрозумійте ці дві речі, і я не зазнаю невдачі у своїй меті, як і ви - у своїй. Ясно?""
 SVR.5.a: ""Так точно!""

 SVR.6.t: "Повсякденне життя"
 SVR.6.desc: "Колись становище було нестерпним. Німецькі бомбардувальники поволі стирали нас на порох. Вони нищили наші домівки, псували дороги, руйнували запаси продовольства й позбавляли наше військо боєздатности. Тим часом тиран із півдня знову й знову нападав на нас, проривав нашу оборону й забирав здобич. По суті, вони були одним і тим самим - єдиною, згуртованою силою, відданою знищенню Свєрдловска.\n\nТепер доля обернулася до нас. Ті нечисленні бомбардувальники, що доповзають до Уралу, зустрічає наш зенітний вогонь, а населення міст уже звикло до спорадичних нальотів. Через наші укріплення кожен наступний напад обходиться Каґановічу дедалі дорожче - та він усе одно повертається. Збитки й утрати від бомбардувань і набігів скоротилися в рази. Хоч загроза від німців і Каґановіча стала частиною повсякденного життя, цивільні мешканці Свєрдловска виконують свої обов'язки зі стоїцизмом і відвагою, знаходячи розраду і в тому, що для їхнього захисту вжито заходів безпеки, і в надії, що одного дня ні ті, ні інші вже ніколи їм не зашкодять."
 SVR.6.a: "Подоба безпеки - усе-таки безпека."

 SVR.7.t: "Погляд зі світлого боку"
 SVR.7.desc: "Порівнювати нинішній рівень життя з рівнем життя довоєнного Союзу безглуздо. Це лише підриває бойовий дух і відкриває свідомість жадібним до влади демагогам, які скористаються тією ностальгією. Важливо цінувати те, що маємо, замість нарікати на те, чого нам бракує.\n\nСвєрдловск - одне з найбільших міст Росії поза нацистським пануванням, і наші громадяни мають відносно високий рівень життя, безперечно вищий, ніж у більшості земель на схід від нас. Уряд і військо об'єднані спільною метою: вони існують, щоб служити народу. До турбот людей дослухаються й беруть їх до уваги, а їхнє життя та засоби до існування захищають від тих, хто прагне їх знищити. Зрештою, у нас є маршал Рокоссовскій, який веде нас із гідністю та незламною рішучістю. Він дає своїм громадянам усе необхідне, щоб облаштувати життя, може, й не заможне, але достатнє. Чоловіки й жінки можуть безпечно ходити на роботу й приносити додому хліб для родин. У Росії, де закон - це насильство, наразі цього має вистачити."
 SVR.7.a: "Пам'ятайте: все стане краще, але завжди могло бути й гірше."

 SVR.8.t: "Скарби минулого"
 SVR.8.desc: "Іван зубами зняв ковпачок із ручки й притиснув мапу до ноги, щоб зробити позначку, поки Аркадій переводив дух. Ще один розграбований склад. Відколи скасували мораторій на пошуки покинутих припасів, у Свєрдловску, схоже, з'явилося чимало охочих до мародерства. "Ти тупий виродок, - видихнув Аркадій. - Той останній пагорб мене мало не вбив. Мені вже байдуже, що каже твій брат. Ми повертаємося".\n\n"Ні, зачекай!" - сказав Іван, досі тримаючи ковпачок у зубах. Він сховав ручку й уважно оглянув мапу. Його брат служив у війську й пообіцяв щедру винагороду, якщо він знайде щось варте уваги. Аркадій пильно на нього дивився. "Недалеко звідси є ще одна будівля. Може, це склад". Гримаса Аркадія не змінилася. Іван склав мапу й поклав її до задньої кишені. "Там увесь шлях униз, старий. Ти впораєшся".\n\nБудівля виявилася спільною хатиною, де солдати або подорожні, які прямували на північ, могли зупинитися й перепочити день чи два. Іван розбив замок каменем і штовхнув двері. В обох розширилися очі. Хатина була заставлена скляними глеками з водою та ящиками сухпайків. Стіни вкривали мапи ЗСНР і навіть Росії на захід від Уралу з примітками. Біля койки з іншого боку хатини стояв маленький стіл, завалений коробками з набоями. До столу тулилися кілька гвинтівок. "Христе, та це золота жила, - слабким від подиву голосом сказав Аркадій. - Хто все це тут залишив?"\n\n"Це не має значення, старий, - сказав Іван, витягаючи мапу. - Зараз один мій брат буде дуже, дуже щасливий"."
 SVR.8.a: "Загублені багатства, сховані в усіх на очах."

 SVR.9.t: "Тихе небо"
 SVR.9.desc: "Нарешті небо чисте. Завдяки великим зусиллям маршала Рокоссовскоґо із захисту народу й активного стримування нацистів бомбардувальники зникли, а наші люди звільнилися з пазурів Люфтваффе. Це привід для святкування! Але ми не повинні байдикувати. Попереду багато роботи, щоб підготувати Свєрдловск до повернення Росії. Не можна гаяти часу. Нашу промисловість та інфраструктуру слід не просто відновити, а й модернізувати; військо треба переоснастити й посилити; а ще ми мусимо дослідити суперників у регіоні, щоб знати, із чим матимемо справу. Час виходити зі сховку."
 SVR.9.a: "До роботи."

 SVR.10.t: "Краєвид із будинку 24-А на проспекті Лєніна"
 SVR.10.desc: "Константін зітхнув і впустив звіт на стіл, поверх десятка інших документів. Голова розколювалася від болю. Він силоміць звівся на ноги. Спину прострілювали напади болю. Він підійшов до вікна й обперся на підвіконня. На обрії громадилися темні важкі хмари. Унизу громадяни снували проспектом Лєніна. Повз прогуркотіла вантажівка з кількома солдатами.\n\nВін був старим чоловіком, на чиїх плечах лежав тягар Росії - та її народу. Скільки йому ще залишилося? Рік? Два? П'ять? Чого він досяг? Союз розпався, ЗСНР розпалася, а Свєрдловск оточили вороги. Павєл, призначений ним наступник, був більш ніж здатним керівником, але не чудотворцем. Він не міг зупинити бомбардування, не міг збільшити пайки, не міг спинити Каґановіча чи Язова. Не в тому стані, у якому перебував Свєрдловск.\n\nКонстантін знав, що ці думки краще не висловлювати, але мусив бути чесним із собою. І навіть якщо час від часу він сумнівався в собі, народ не сумнівався ніколи. Зрештою, він був Константіном Рокоссовскім! Так, старим чоловіком, але також командувачем 3-ї армії, Героєм Совєцького Союзу й доброзичливим охоронцем останнього бастіону свободи в усій Росії! Якщо комусь і ставало снаги повернути Росію, то саме йому.\n\nНа обличчі поволі проступила вперта посмішка. Він сів і клацнув вимикачем настільної лампи. Поправив окуляри вище на переніссі й опустив погляд на звіт, продовжуючи з місця, де зупинився. Він не міг здатися - ні тепер, ні будь-коли. Попереду було ще надто багато роботи."
 SVR.10.a: "Довіряйте маршалу, адже він довіряє вам."

 SVR.11.t: "До лісу"
 SVR.11.desc: "У розумінні Лукі Фєдосова "навчання командній роботі" означало командні види спорту. У розумінні сержанта Кутузова воно означало серед глухої ночі кинути Луку та вісьмох інших чоловіків із його відділення в лісі, давши їм лише кілька найпростіших засобів для виживання та піжами на їхніх тілах, і наказати самотужки знайти дорогу на базу. "Співпраця, навіть на рівні відділення, - запорука перемоги", - сказав він. Юлія Лісіцина він вочевидь не врахував.\n\nЮлій висловлював свою думку за будь-яких обставин, і найчастіше та думка була образою. Лука сподівався, що з огляду на їхнє становище той угамується. Навіть Пьотр, командир Лукиного відділення, наказав Юлію замовкнути. На жаль, для дошкульних кпинів повноцінний нічний сон не потрібен.\n\n"Ти не розпалиш вогню, якщо просто на нього дивитимешся, Фєдосов".\n\n"Може, допоможеш мені прочитати мапу, Фєдосов? У тебе, мабуть, нічний зір, раз ти так явно не хочеш розпалювати той вогонь".\n\n"Якби ти так само добре рубав розпал, як розрубав руку, ми вже були б на базі!"\n\nЗрештою Лука розпалив вогонь. Юлій з'ясував, де вони перебували, і, на Лукине здивування, подякував йому. Лука пожартував, що не був певен, чи Юлій узагалі вміє читати, і вони обидва засміялися. Вони рушили в дорогу й, подолавши кілька смертельно небезпечних схилів та перейшовши вбрід річку, повернулися на базу невдовзі після сходу сонця. Лука був брудний, мокрий від пояса донизу й мав порізи на обох руках. Побачивши, як вони крокують до казарми, Кутузов лише запитав: "Якого біса з вами сталося?" Юлій усміхнувся й поцікавився в Кутузова, чи не побачив той чогось, що йому сподобалося. Лука та решта відділення захихотіли."
 SVR.11.a: "Товариство, загартоване важкими часами, - найміцніший зв'язок."

 SVR.12.t: "Чотири операції"
 SVR.12.desc: "Німецька кампанія невибіркових терористичних бомбардувань була жахливим злочином проти народу Росії. Однак вона також ефективно досягала своєї мети. Через постійну загрозу знищення з повітря наші армії не могли здійснювати жодних значних маневрів, а промислові спроможності вести війну були істотно обмежені. По суті, Німеччина не давала Росії об'єднатися. У той час Ставка була змушена сидіти склавши руки й розробляти незліченні варіянти гіпотетичних планів нападу на сусідів, коли нальоти неминуче припиняться. Тепер настав час скористатися тими планами.\n\nВідкинувши застарілі, непотрібні або відверто фантастичні плани, ми залишили чотири операції, кожна з яких стосується одного з наших сусідів. На півночі операції «Помаранчева» й «Червона» розгромлять відповідно бандитів Юґри та недобитків НКВД у Воркуті. На півдні операція «Синя» покладе край терору Каґановіча, а операція «Чорна» повалить Чорну Лігу в Омску. Ми можемо спершу завдати удару в будь-якому напрямку, але слід зауважити, що Тюмєнь та Омск зрештою нападуть на нас на власних умовах, якщо ми не вдаримо невдовзі."
 SVR.12.a: "Шаблі наголо - на Тюмєнь."
 SVR.12.b: "Спершу розібратися з бандитами."

 SVR.13.t: "Операція «Помаранчева»"
 SVR.13.desc: "ВЕРХОВНЕ КОМАНДУВАННЯ УРАЛЬСЬКОГО ВІЙСЬКОВОГО ОКРУГУ\n\nПРОСПЕКТ ЛЄНІНА, 24-А, СВЄРДЛОВСК\n\nНАКАЗ № 212; ЩОДО ВОРОВСКОЙ ТЄРІТОРІІ ЮҐРИ\n\nУсі визначені з'єднання 3-ї армії, а також будь-які допоміжні формування мають бути розгорнуті проти території під контролем бандитської держави Юґри. Загальний напрямок дій 3-ї армії такий:\n(1) усі частини мають наступати по всій лінії фронту єдиною лінією, щоб не дати малим загонам бандитів обійти наш наступ;\n(2) ворожі ополчення, які вирішать чинити опір, буде знищено без пощади;\n(3) ворожі ополчення, які здадуться, буде роззброєно, а всіх їхніх членів заарештовано;\n(4) усі формування зійдуться з півдня та сходу біля головного укріплення бандитів, Юґорска, й ліквідують будь-який організований опір.\n\nВорожі ополчення, які переживуть перше зіткнення з нашими силами, навряд чи зможуть дати бій; найімовірніше, переслідувати ворога на північ від річки Сєвєрная Сосьва не знадобиться. Утім, це може стати необхідним, якщо ворог відступатиме на північ зі значною кількістю контрабанди. Наші авіяційні крила спробують завадити такому відступу, знищуючи всі організовані підрозділи, які зможуть знайти. Про всі приготування, здійснені 3-ю армією та для неї, належить доповідати Верховному командуванню Уральського військового округу.\n\nПідпис: КОНСТАНТІН РОКОССОВСКІЙ"
 SVR.13.a: "Джаба Іоселіані, розшукується живим або мертвим."

 SVR.14.t: "Наказ 241"
 SVR.14.desc: "ВЕРХОВНЕ КОМАНДУВАННЯ УРАЛЬСЬКОГО ВІЙСЬКОВОГО ОКРУГУ\n\nПРОСПЕКТ ЛЄНІНА, 24-А, СВЄРДЛОВСК\n\nНАКАЗ № 241; ЩОДО «ЗАХІДНОСИБІРСЬКОЇ НАРОДНОЇ РЕСПУБЛІКИ» В ТЮМЄНІ\n\nУсі наявні з'єднання 3-ї армії, а також будь-які допоміжні формування мають бути розгорнуті проти Західносибірської народної республіки. Загальний напрямок дій 3-ї армії такий:\n(1) спеціально сформовані частини мають проникнути крізь оборонні лінії ворога, створити плацдарми на протилежних берегах річок Ісєть і Міас та втримувати їх;\n(2) коли ворожа загроза оточення ліній постачання зникне, основна маса наявних сил має вступити з ворогом у генеральну битву;\n(3) ворожі сили, здатні дати бій, буде знищено;\n(4) ворога належить переслідувати, доки всі його формування не буде знищено, а над усіма територіями Західносибірської народної республіки не буде встановлено контроль.\n\nПро всі приготування, здійснені 3-ю армією та для неї, належить доповідати Верховному командуванню Уральського військового округу.\n\nПідпис: КОНСТАНТІН РОКОССОВСКІЙ"
 SVR.14.a: "Sic semper evello mortem tyrannis."

 SVR.15.t: "Шпигуни зі Свєрдловска!"
 SVR.15.desc: "Сьогодні рано-вранці виявилося, що кілька військових бюрократів із різних щаблів нашої командної вертикалі зникли, не з'явившись на своїх постах. За звичайних обставин ми могли б списати це на купку безхребетних канцеляристів, які втратили відвагу й залишилися в ліжках, але швидко стало зрозуміло, що цього разу справа не в тім. Перевірка особистих речей, які вони залишили, засвідчила, що ці бюрократи були аґентами Рокоссовскоґо! Ба більше, схоже, перед втечею вони викрали надзвичайно важливі документи військової розвідки.\n\nЦе приголомшлива зрада - і ще й зсередини наших кордонів! Щоб реорганізувати наші організаційні структури й зробити витіклу інформацію непридатною для будь-якого ворога, знадобиться чимало часу."
 SVR.15.a: "За це когось розстріляють!"

 SVR.16.t: "Наказ 270"
 SVR.16.desc: "ВЕРХОВНЕ КОМАНДУВАННЯ УРАЛЬСЬКОГО ВІЙСЬКОВОГО ОКРУГУ\n\nПРОСПЕКТ ЛЄНІНА, 24-А, СВЄРДЛОВСК\n\nНАКАЗ № 270; ЩОДО «ВСЕРОСІЙСЬКОЇ ЧОРНОЇ ЛІГИ» В ОМСКУ ТА ОПЕРАЦІЙ ІЗ ПРОТИДІЇ ТЕРОРИЗМУ Й ЕКСТРЕМІЗМУ\n\nУсі наявні з'єднання 3-ї армії, а також будь-які допоміжні формування мають бути розгорнуті проти уряду Всеросійської Чорної Ліги в Омску. Загальний напрямок дій 3-ї армії такий:\n(1) сили мають наступати вздовж річки Іртиш: Тобольський фронт - східним берегом, Ішимський фронт - західним;\n(2) ворожі сили, здатні дати бій, буде знищено;\n(3) моторизовані формування оточать місто Омск, щоб не дати ворожим силам утекти;\n(4) Омск буде окуповано, а Чорну Лігу розпущено. Про всі приготування, здійснені 3-ю армією та для неї, належить доповідати Верховному командуванню Уральського військового округу.\n\nОднією із загроз успіхові цієї операції є радикалізм серед громадян. Терористичні напади можуть уповільнити наступ або навіть поставити його під загрозу. У таких випадках екстремістів за можливости затримуватимуть живими й ув'язнюватимуть. Операції з протидії екстремізму зосередяться на такому, за порядком важливости: запобігання нападам, виявлення загроз, позбавлення підозрюваних у загрозі будь-яких засобів для здійснення нападів і відбиття нападів, якщо вони все-таки стануться. Реабілітація та дерадикалізація в'язнів матимуть найвищий пріоритет задля сприяння умиротворенню Омска.\n\nПідпис: КОНСТАНТІН РОКОССОВСКІЙ"
 SVR.16.a: "Чи цього буде досить?"

 SVR.17.t: "Облака"
 SVR.17.desc: "У лісі панувала б тиша, якби не музика. Вона пливла повітрям, наче привид. А може, наче благословення. Вістка про близьку добру долю. Принаймні Васілій Буров сподівався, що це саме вона. Люди зі Свєрдловска витягли кожну композицію просто з його пам'яти. Ансамбль Алєксандрова. Прокоф'єв. І його улюблена пісня «Облака». Почувши моторошний голос Ґаліча, він мало не розплакався. Саме тоді він наважився.\n\nЙого напарник Артур чхнув. "Як гадаєш, коли вони здадуться, Васю?" - запитав він. Він був набагато молодший за Васілія. Ліга була єдиним світом, який він знав. Васілій знизав плечима. Артур торохтів далі. "Жалюгідно - думати, ніби вони налякають нас музикою. Жалюгідно. Бо вони знають, що не переможуть. У них немає жодного шансу!" Регіт Артура нагадував Васілію кажанячий писк. Він закотив очі й сповільнив крок, пропускаючи Артура вперед. "Хоча це не означає, що вона не дратує. Думаю, Ґлавком уже щось готує. Недовго лишилося".\n\n"Побачимо", - сказав Васілій. Його руки тремтіли. Він глибоко вдихнув, вирівняв гвинтівку й двічі вистрілив Артурові в спину. Тріск відлунив поміж дерев. Він кинувся вперед, зіштовхнув напарника на землю й пірнув у ліс, до джерела музики. Воно мало бути близько; він устигне!\n\nЗа кілька секунд кадра вже наздоганяла його. Він чув крики й бачив чорні постаті між деревами. Він кричав їм у відповідь, благав відпустити його. Він плакав. Пролунали три постріли; дві кулі розірвали його тіло й повалили на землю обличчям до неба. Музика тепер затихала, але крізь прогалини в кронах сонячне світло танцювало на його обличчі. Він милувався хмарами, що вільно пливли за межами будь-якої в'язниці, за межами будь-якої потреби."
 SVR.17.a: "Негайно знайти й знищити ті гучномовці."

 SVR.18.t: "Пропозиція зі Свєрдловска"
 SVR.18.desc: "Ми отримали телеграму з канцелярії Константіна Рокоссовскоґо, маршала Уральського військового округу в Свєрдловску. Він планує напасти на Омск і раз і назавжди знищити Чорну Лігу, але для цього йому потрібна наша допомога. Він хоче, щоб ми влаштували прикордонну сутичку вздовж східного рубежу Омска. Цей напад фактично обмежиться серією артилерійських обстрілів і має відволікти Лігу, щоб Рокоссовскій міг увійти в її землі. Він обіцяє мінімальні втрати, якщо вони взагалі будуть. Така сутичка низької інтенсивности навряд чи переросте в повноцінні бойові дії, однак вона може розлютити Ґлавковєрха Язова, що стане проблемою, якщо Рокоссовскій не зможе його повалити. Якою буде наша відповідь?"
 SVR.18.a: "Язов загрожує всій Росії. Ми підтримаємо Рокоссовскоґо."
 SVR.18.b: "Він упорається сам."

 SVR.19.t: "Наказ 303"
 SVR.19.desc: "ВЕРХОВНЕ КОМАНДУВАННЯ УРАЛЬСЬКОГО ВІЙСЬКОВОГО ОКРУГУ\n\nПРОСПЕКТ ЛЄНІНА, 24-А, СВЄРДЛОВСК\n\nНАКАЗ № 303; ЩОДО «ВОРКУТИНСЬКОГО ВИПРАВНО-ТРУДОВОГО ТАБОРУ» У ВОРКУТІ\n\nУсі наявні з'єднання 3-ї армії, а також будь-які допоміжні формування мають бути розгорнуті проти Воркутинського виправно-трудового табору. Загальний напрямок дій 3-ї армії такий:\n(1) Північний фронт має наступати, доки всю ворожу присутність на південь від річки Уса не буде ліквідовано шляхом знищення;\n(2) плацдарми на протилежному березі Уси буде захоплено або створено;\n(3) коли ворожа загроза оточення ліній постачання зникне, єдиний удар у напрямку Воркути витіснить ворожі формування з міста й району Воркутлаґу;\n(4) присутність НКВД буде стерто, а Відділ трудових колоній Народного комісаріяту внутрєнніх дєл (sic) розпущено назавжди.\n\nПро всі приготування, здійснені 3-ю армією та для неї, належить доповідати Верховному командуванню Уральського військового округу.\n\nПідпис: КОНСТАНТІН РОКОССОВСКІЙ"
 SVR.19.a: "Кров на снігу стікає з його рук."

 SVR.20.t: "Пропозиція, від якої неможливо відмовитися"
 SVR.20.desc: "Ми отримали комюніке від маршала Константіна Рокоссовскоґо з вимогою негайно передати Воркуту й навколишні території Уральському військовому округу. Натомість Рокоссовскій обіцяє Блохіну й кільком іншим ключовим посадовцям керівництва Воркутлаґу високі посади в уряді Округу.\n\nПропозиція спокуслива - об'єднання з таким могутнім чоловіком, як Рокоссовскій, безперечно піде нам на користь, - але вона може бути надто доброю, щоб бути правдою. Ні для кого не таємниця, що Блохін винний у тяжких злочинах. Більшість охоронців також є співучасниками, якщо не мають не меншої вини. Що завадить Рокоссовскому заарештувати й розстріляти кожного охоронця, бюрократа й адміністратора тієї ж миті, коли ми складемо зброю? До того ж що з нами станеться, якщо його державка розвалиться, як Західноросійський революційний фронт?\n\nТа чи можемо ми взагалі йому відмовити, зважаючи на силу його війська?"
 SVR.20.a: "Я ризикну заради гарної затишної посади, сподіваюся, десь у трохи теплішому місці, дуже вам дякую."
 SVR.20.b: "Він божевільний, якщо думає, що ми просто ляжемо перед ним. Нехай іде до біса!"

 SVR.21.t: "Блохін поступається"
 SVR.21.desc: "Незмінно прагматичний і позбавлений ідеології Блохін прийняв нашу пропозицію. Його нечисленні сили зустрілися з нашими й ведуть їх крижаними, розбитими дорогами до Воркути, щоб ми могли взяти під контроль місто, огидний Воркутлаґ, який його породив, та ненаситну пустку, що оточує їх обох. Ще один шматок Росії переходить до наших рук.\n\nЩодо Блохіна, ми можемо дотримати угоди й дати йому посаду десь у нашій адміністрації - схоже, він погодиться на що завгодно, - або ув'язнити за тисячі й тисячі смертей, за які він відповідальний, та злочини проти народу Совєцького Союзу й Росії загалом."
 SVR.21.a: "Цей чоловік - чудовисько. Його треба судити й покарати!"
 SVR.21.b: "Наше слово - наша порука."

 SVR.22.t: "Блохін стоїть на своєму"
 SVR.22.desc: "У незбагненному прояві непокори Блохін відхилив нашу пропозицію капітуляції. Можливо, жадоба влади нарешті виштовхнула його за межі здорового глузду. Можливо, він був параноїком і вважав нашу пропозицію "надто доброю, щоб бути правдою". А може, йому просто не сподобалася думка знову комусь підпорядковуватися після всіх цих років. Хай там як, прикро, що він воліє приректи своїх людей на лютий холод і неминучу поразку від наших переважних сил, а не дослухатися до розуму. Є в цьому й світлий бік: тепер ми можемо відкинути всі вдавання, ніби даємо Блохіну шанс спокутувати провину, і судити його як масового вбивцю, яким він є."
 SVR.22.a: "Неважливо."

 SVR.23.t: "Ультиматум від Лева"
 SVR.23.desc: "Схоже, Свєрдловск - звісно ж, почасти завдяки нашим щедрим продажам зброї - здолав своїх суперників, Тюмєнь та Омск. Тепер Рокоссовскій не має рівних у регіоні, і це проблема, бо ми більше не маємо жодної сторони, яку могли б підтримати, щоб стримувати його. Так, Каґановіч і Язов мали свої вади, але ворожнеча між ними обома й Рокоссовскім підтримувала напруження в регіоні - напруження, яке часто виливалося в прикордонні сутички, а це означало більше пошкодженої, захопленої чи покинутої зброї, а отже - більше покупців для нас. Та коли Свєрдловск став новокоронованим гегемоном Західного Сибіру, ми втратили можливість застосовувати свою силу, погрожуючи перенести справи до одного з його суперників. Що тепер буде з нашою домовленістю?\n\nСьогодні сам Рокоссовскій відповів на це питання. Він надіслав нам пропозицію мирної інтеграції до складу Округу. Згода означатиме, що ми віддамо весь контроль над продукцією наших арсеналів. Вона також означатиме втрату всіх без винятку зв'язків поза Свєрдловском і фактично назавжди закриє для нас ті ринки. Відмова означатиме війну. У нас достатньо зброї для боротьби, а місцевість надзвичайно зручна для оборони, але навіть із цими двома перевагами ми навряд чи зможемо стримувати їх вічно. Що відповімо?"
 SVR.23.a: "Війна нас знищить. Ми погоджуємося."
 SVR.23.b: "Якщо він хоче наші рушниці, нехай прийде й забере їх!"

 SVR.24.t: "Золота республіка схиляє коліно"
 SVR.24.desc: "Навіть Торговець смертю має трохи здорового глузду. Драґунов мудро прийняв нашу пропозицію негайної та мирної інтеграції Златоуста до складу Округу. Наші сили входять на його територію, щоб узяти її під контроль, а інженери 3-ї армії вже працюють над планами розширення напрочуд добре збереженої інфраструктурної мережі державки задля кращого сполучення з рештою Округу.\n\nУсе це не применшує численних переваг, які дає нам Златоуст. Тепер ми маємо доступ до його багатств: досвіду Драґунова й Калашнікова в конструюванні зброї, потужностей, на яких вони її виготовляють, та запасів, що чекають свого часу. І все це без жодної краплі крови, пролитої на кам'янистих схилах Уралу."
 SVR.24.a: "Безперечно, величезна перемога!"

 SVR.25.t: "Золота республіка не скоряється!"
 SVR.25.desc: "Драґунов відхилив нашу пропозицію здатися, пославшись на становище Златоуста як нейтрального арбітра й ділового партнера всіх російських держав. Маршал поділяє його прагнення миру й добробуту для всіх росіян. На жаль, відмова зректися нейтралітету означає, що зрештою він проти нас, а отже, маршал мусить розібратися з ним так, як вважатиме за потрібне.\n\nУ відмові Драґунова немає нічого дивного; він ніколи й не був на нашому боці. Він охоче озброював Тюмєнь та Омск - аби тільки вони платили - і, без сумніву, відповідальний за незліченні тисячі смертей по всій Росії. Його цікавлять лише гроші, а жадоба прибутку змусила його зректися всіх без винятку моральних принципів. Він геніяльний зброяр, але також воєнний злочинець, якого ми мусимо знищити."
 SVR.25.a: "Час сплатити рахунок, Євґєнію."

 SVR.28.t: "Рак усередині"
 SVR.28.desc: "Наші кордони залишаються дірявими, і диверсанти з Тюмєні та Омска прослизають крізь кожну непропатрульовану прогалину. Вони пошкоджують інфраструктуру, життєво важливу для нашої системи внутрішньої торгівлі. Пропагандою й риторикою - а не справжньою правдою - вони налаштовують проти нас цивільних і військовиків. Партизани-ревізіоністи пошкоджують наші військові об'єкти й допомагають ворогові під час набігів, щоб послабити нас перед невідворотним нападом Каґановіча. Оперативники Чорної Ліги поводяться куди антисоціяльніше, здійснюючи напади з використанням замінованих автомобілів і саморобних вибухових пристроїв. Вони також улаштовують повноцінні перестрілки з місцевими гарнізонами. Ці елементи загрожують нашій державі та її народові, тому з ними треба негайно розібратися."
 SVR.28.a: "Омск становить значно більшу загрозу!"
 SVR.28.b: "Тюмєнь готова вдарити по наших кордонах!"

 SVR.29.t: "Підготовка до десантних операцій на суходолі"
 SVR.29.desc: "Річка ринула повз Людмілу, котячи крижану воду їй до пояса. Кожен крок був битвою; кожна ступня несла обіцянку безпеки й ризик раптового падіння в каламутну глибочінь. На ній було майже вісімдесят фунтів спорядження, не рахуючи гвинтівки в руках. Бронежилет, запасні набої, аптечка, налобний ліхтар, змінний одяг та інше. Вона почувалася повільною, спітнілою. Важкою.\n\nЇї зосередженість урвалася, коли чобіт загруз у м'якій ділянці річища й вона похитнулася вперед. Вона спромоглася лише на придушений схлип, перш ніж голова занурилася під річкову поверхню. Вода полилася їй у горло. Потік миттю змив усі ілюзії контролю. Річка хотіла її смерти, але вона відмовлялася. Вона відштовхнулася від дна й звелася на ноги, що боролися з течією, та не зупинялася, доки не дісталася протилежного берега. Вона впала на траву й між вдихами викашлювала воду. Серце гупало у вухах, але вона раділа, що лишилася живою, раділа, що нарешті перейшла річку.\n\nЇї інструктор Віктор Лєонов натиснув кнопку секундоміра. На тридцять секунд довше за його час. Тридцять секунд, які могли її вбити. Вона надто зосередилася на вазі спорядження, на річці, на тому, щоб не намочити гвинтівку, і не стежила за тим, куди йде, та не вела вогонь у відповідь. Але вона також училася. Він підійшов до Людміли, привітав із завершенням вправи й подав руку, щоб допомогти підвестися. Вона прийняла її."
 SVR.29.a: "З часом жодна річка не зможе тебе зупинити."

 SVR.30.t: "Пропозиція інтеграції"
 SVR.30.desc: "Наша угода із Сурґутом взаємовигідна, вона постала з років тісної співпраці та взаємної поваги. Тепер, коли становище в Західному Сибіру стабілізується, настав час викарбувати в камені зв'язок між 3-ю армією та 588-м нічним бомбардувальним полком.\n\nМи надішлемо Сурґуту пропозицію формально інтегрувати його територію до складу Округу. Це логічне завершення нашої взаємної співпраці. Від інтеграції Сурґута виграють і Свєрдловск, і сам Сурґут. Ми матимемо необмежений доступ до їхніх авіяційних крил, з якими зможемо координувати бойові вильоти проти ворожих сил; натомість вони отримають повний доступ до ресурсів самого Свєрдловска й зможуть забезпечувати своїх громадян."
 SVR.30.a: "Виграш для обох сторін."

 SVR.31.t: "Свєрдловск просить про інтеграцію"
 SVR.31.desc: "Ми отримали комюніке від маршала Рокоссовскоґо з пропозицією інтегрувати нашу територію до складу Уральського військового округу. Згода, безперечно, стала б благом для нашого виснаженого населення, але завжди існує загроза, що маршал скористається нашим досвідом для... непривабливих цілей. Що відповімо?"
 SVR.31.a: "Нічні відьми з вами, маршале!"
 SVR.31.b: "Ми й самі чудово даємо собі раду, дуже вам дякуємо!"

 SVR.32.t: "Вільні авіятори погоджуються на інтеграцію!"
 SVR.32.desc: "Як ми й очікували, Вільні авіятори прийняли нашу пропозицію інтеграції. Місцеві мешканці вітали вантажівки, що привозили новий міський гарнізон, а Бочарова та решта Нічних відьом на публічній церемонії на площі 1905 року нарешті отримали давно заслужені медалі Героїв Совєцького Союзу з рук самого маршала Рокоссовскоґо.\n\nІнтеграція Сурґута означає, що під наш контроль перейшов перший шматок Росії за межами Свєрдловска, і він не стане останнім. Авіятори вже доводять, що є цінними союзниками в нашій боротьбі. Вони пообіцяли дати поштовх нашим військово-повітряним силам, поділившись величезними знаннями про повітряний бій, і забезпечити авіяційній промисловості заслужене прискорення. З ними на нашому боці наше панування в небі майже ґарантоване."
 SVR.32.a: "Ми сильніші разом."

 SVR.33.t: "Вільні авіятори відмовляються?"
 SVR.33.desc: "Вільні авіятори відхилили нашу пропозицію інтеграції! Більшість, якщо не все верховне командування, була приголомшена їхньою відмовою, а цей раптовий переворот у наших усталених дипломатичних відносинах з Авіяторами поставив під сумнів не лише майбутнє подальшої співпраці, а й наші плани повернення Західного Сибіру загалом. Якщо ми хочемо й надалі мати з ними справу, доведеться застосувати до Сурґута агресивніший підхід."
 SVR.33.a: "Схоже, потрібна твердіша рука."

 SVR.34.t: "Дорога Ано"
 SVR.34.desc: "Павєл відклав запечатаний конверт і потягнувся до стосу звітів на столі. Він узяв горішній і уважно прочитав. Максім Павловіч Карчагін. Народився 30.02.1934. 214-й батальйон, 52-й полк, 139-та стрілецька дивізія. Загинув у бою під час сутички на південь від Камєнска-Уральскоґо. Він перевернув звіт і сумно зітхнув. Одружений. Двоє дітей, обом по чотири роки. Вийнявши перо з чорнильниці, він узяв аркуш паперу з письмового приладдя й почав писати.\n\n"Прийміть мої найглибші та найщиріші співчуття з приводу втрати вашого чоловіка..."\n\nЩе один лист, ще одна трагедія. Ніщо з написаного ним не полегшить її болю - хіба словами можна описати невимовне? Смуток, страх, гнів? Максім загинув без жодної причини, убитий безликим ворогом і зведений до імени та світлини на аркуші паперу. Але він був незмірно більшим: солдатом, коханим, чоловіком, батьком. Тепер - лише труп. Скільки ще людей загине, перш ніж Росія возз'єднається? Скільки ще доведеться написати листів? Від цієї думки Павлові стало млосно.\n\n"...Максім був героєм не лише для солдатів, із якими служив, а й для всієї Росії. Бажаю вам і вашій родині всього найкращого, поки ви переживаєте цю немислиму трагедію. Якщо я бодай чимось можу полегшити ваш біль, то буду вдячний за таку нагоду..."\n\nПавєл склав лист, засунув його в конверт і запечатав восковою печаткою. Він відклав конверт і потягнувся до стосу звітів на столі.\n\n"...З найглибшим співчуттям...""
 SVR.34.a: ""...Павєл Івановіч Батов.""

 SVR.35.t: "Солодка перемога"
 SVR.35.desc: "Нашу місію з об'єднання Західного Сибіру завершено. Силами нашої армії ми очистили Урал від усіляких воєначальників і претендентів. Тиранів Тюмєні та реакціонерів Омска переможено, і ми лишилися єдиними переможцями. Генерала Рокоссовскоґо назавжди пам'ятатимуть як героя Батьківщини. Не повинні ми забувати й тих, хто загинув, пожертвувавши життям заради об'єднання Західного Сибіру.\n\nТепер, поки наші радісні солдати святкують, ми мусимо розпочати відбудову й інтеграцію нових земель. У народів Уралу з'явилася нова надія на майбутнє, а армія проходить парадом вулицями Свєрдловска. Люди більше ніколи не хочуть жити так, як жили в хаосі доби воєначальників. Ми не можемо повторити помилок Західносибірської народної республіки десятирічної давнини. Росію має очолити надійний генерал на кшталт Рокоссовскоґо, а не корумпований тиран Каґановіч чи божевільний Язов.\n\nНове покоління мусить підвестися й повести Росію іншим шляхом. Нам знадобляться модернізація та реформи, а також сильне керівництво, здатне нагромадити сили для прийдешніх воєн. Але зараз ми можемо відсвяткувати нашу перемогу й новий шлях Росії. Нехай народ відчує радість, якої не знав тридцять років."
 SVR.35.a: "Ми маємо проголосити нашу перемогу всьому світові!"

 SVR.36.t: "Герої Совєцького Союзу"
 SVR.36.desc: "Зала засідань була невеликою, проте бездоганно оздобленою. Над сценою висіли знамена різних корпусів і дивізій 3-ї армії. Обабіч висіли прапори старого Союзу й Округу. Глядачів розділили на дві частини: одну для гостей - переважно військовиків - і другу для нагороджуваних.\n\nСидячи серед нагороджуваних, Кіріл завмер, наче статуя, - як і кожен інший солдат, що мав дістати підвищення. Проте всередині його нудило. Отримання офіцерського звання він іще міг витримати. Молодший лейтенант Кіріл Яблонскій - для нього це звучало чудово. Але від думки, що він нарешті зустрінеться з маршалом Рокоссовскім віч-на-віч, на очах у всього Свєрдловска, у нього скручувало шлунок. Чому - він не знав.\n\nКіріл так поринув у думки, що ледь не пропустив власне ім'я. Він розгладив однострій і, виходячи на сцену, намагався не надто тремтіти. Рокоссовскій стояв за трибуною, а обабіч нього - генерали Батов і Баґрамян. Він усміхнувся, коли Кіріл потис йому руку, потім приколов медаль до Кірілових грудей і вручив погони - золоті, з однією зіркою та єдиною червоною смугою посередині. Кіріл віддав честь, Рокоссовскій відповів тим самим, а тоді хлопець, не подумавши, мовив: "Дякую, товаришу маршале".\n\n"Дякую за службу, товаришу, - відповів він. - Тебе привів сюди власний героїзм. Це найменше, що я міг зробити". Він знову повернувся до присутніх і привітав новоспечених офіцерів. Зала вибухнула оплесками, а Кіріл згадав увесь біль і муки, пережиті за час служби в 3-й армії. На одну довгу, осяйну мить усе воно того вартувало."
 SVR.36.a: "Захисники нашої свободи заслуговують на подяку."

 SVR.37.t: "Праця в тіні"
 SVR.37.desc: "Кабінет Аркадія Фабрічнікова містився на третьому поверсі будівлі, яка, на його думку, колись була житловим домом. Її експропріювала 3-тя армія й перетворила на штаб Бюро внутрішньої безпеки - установи, яку він тепер очолював. Однією з дивовиж цієї будівлі було те, що його кабінет був єдиним на всьому третьому поверсі. Тому він і зрозумів, що плакати були знаком.\n\nВони були масні від фарби та клейстеру, і на кожному товстими чорними літерами було написано те саме: "ЧОРНА ЛІГА: ВІДРОДЖЕННЯ РОСІЇ". Здерти їх із дверей було нескладно, але водночас він відчував, ніби за ним стежать.\n\nУсередині він повісив плащ і папаху, сів за стіл і розгорнув укладену військовими справу про "підривну діяльність". Вона була товща за його зап'ясток і вщерть набита звітами про операції, протоколами розтинів, свідченнями очевидців, зразками ревізіоністської пропаганди та агіток Ліги, світлинами ґрафіті. Здавалося, ворожі аґенти кишіли всюди. До біса, вони були навіть у -\n\nУ коридорі клацнув метал. Швидкі, цілеспрямовані кроки. Він рвучко відчинив одну з шухляд столу й вихопив Токарєва саме тоді, коли двері розчахнулися. Його гаданий убивця злякано відскочив. "Господи, це ж лише я!" - вигукнув один із його помічників, Ерік. Аркадій полегшено зітхнув і опустив пістолет. Ерік сховав у кишеню оздоблену сталеву запальничку й затягнувся сиґаретою. "Ми з Колєю збиралися випити, підеш із нами?" Аркадій на мить замислився, опустивши погляд на розкладену перед ним справу."
 SVR.37.a: ""Ні, дякую. У мене є робота.""

 SVR.38.t: "Розбіжність у поглядах"
 SVR.38.desc: ""Константіне Константіновічу, ви, може, й добре знаєте свою справу, але, друже мій, ви що, кляті шори начепили?!"\n\nРокоссовскій сердито глянув на Батова й відрубав: "Я міг би сказати те саме. Наші діти бавляться уламками й дротами. Ще вчора я бачив, як чоловіка пограбували за кілька кроків від нашого штабу!"\n\n"Так, Загарбник штовхнув Росію до безглуздого насильства, і ви хочете виправити це ще більшим насильством? Скажіть, що відрізняє найманих державою головорізів від звичайних?"\n\n"Обов'язок, насамперед. Треба бути геть наївним, щоб нападати на тих самих людей, завдяки яким ти ще дихаєш. Лише примус стоїть між цивілізацією та анархією. Озброєні люди, що служать вищій меті. Не можна переконати ведмедя, коли він кидається на тебе, - або бийся, або помри!"\n\nБатов хмикнув - і з метафори, і з хлоп'ячої бравади Рокоссовскоґо. Схоже, той був переконаний, що саме він - єдиний захисник цивілізації від ненаситних орд. Батов уже приготував відповідь, і губами його ковзнула самовпевнена посмішка. Та перш ніж він устиг її висловити, то стривожено завмер, помітивши зміну.\n\nРокоссовскій знову зблід, а тіло генерала затрясло від страшного нападу кашлю. Коли напад урешті минув, Батов простягнув йому склянку води, але Рокоссовскій легковажно відмахнувся."
 SVR.38.a: ""Старий друже, може, настав час поговорити про ваше здоров'я?""

 SVR.40.t: "Про Сибірську Чорну Лігу"
 SVR.40.desc: "Сибірська Чорна Ліга - терористична організація, що базується в Омску. Її заснував покійний Дмітрій Міхайловіч Карбишев, а нині очолює Дмітрій Тімофєєвіч Язов. Через притаманну Лізі тоталітарну й антисоціяльну природу дати їй будь-який опис надзвичайно складно. Однак одне зрозуміло: Чорна Ліга прагне возз'єднати Росію під своїм знаменом з єдиною метою - жорстоко й дорого помститися Німеччині та німецькому народові.\n\nЛіга вже поміж нас, хоча поки що в обмеженому масштабі. Незліченні інфільтратори пролізли на наші заводи, до наших установ і навіть до нашого війська. Їхня мета проста: домогтися поглинення Свєрдловска Омском. Для цього вони вдаються і до меча, і до пера. Прихильники Ліги закладають бомби, планують замахи на високопоставлених політичних діячів, намагаються їх здійснити й атакують наше сільське господарство. Вони також поширюють пропаганду, граючи на загальних антинімецьких настроях громадян, і просувають брехню, нібито Ліга поверне Росії велич та забезпечить усім "довоєнний" рівень життя.\n\nЗ огляду на загрозу, яку Ліга становить для всієї Росії, підозрюваних інфільтраторів і симпатиків не щадять. Підозрюваних у зберіганні чи поширенні пропаганди негайно заарештовують і "заохочують" співпрацювати з державними службовцями. З інфільтраторами чинять так само, хіба що в разі спроби уникнути арешту в них стрілятимуть. Те саме стосується симпатиків у війську. Хоча такі заходи можуть здаватися драконівськими, деякі генерали підозрюють, що навіть їх буде замало, аби викорінити гниючу корупцію."
 SVR.40.a: "Чорна рука Язова сягає далеко..."

 SVR.41.t: "Про каґановічівських соціялістів-ревізіоністів"
 SVR.41.desc: "Соціяліст-ревізіоніст - це чоловік або жінка, віддані Лазарю Каґановічу й прихильні до форми авторитарного соціялізму, що відрізняється від панівної бухарінської течії. Загрозу, яку ревізіоністський тероризм становить для нашого режиму, годі переоцінити.\n\nЇхні цілі подвійні: підірвати здатність нашого війська вести бій і налаштувати населення проти нас. Задля першої мети ревізіоністські формування збираються під час прикордонних сутичок, аби вдарити нашим силам у спину, грабувати склади й пошкоджувати військову інфраструктуру. Задля другої ревізіоністи поширюють маніпулятивну, сфальсифіковану пропаганду, прагнучи розпалити народне повстання.\n\nЗнаючи про загрозу, яку ревізіоністські аґенти становлять для нашого уряду, ми мусимо боротися з ними всюди, де вони з'являються. Нещодавно БВБ повідомило про арешт кількох великих ревізіоністських терористів, більшість із яких працювали безпосередньо на самого Каґановіча. Ці аґенти, без сумніву, були частиною ширшої мережі, й тепер, коли керівництво перебуває під вартою, БВБ планує вистежити й схопити менш значущих членів, перш ніж ті перегрупуються."
 SVR.41.a: "Безперечно, це удар по справі ревізіоністів у Свєрдловску."

 SVR.42.t: "Вплив Чорної Ліги знищено!"
 SVR.42.desc: "Завдяки невтомним зусиллям БВБ - і помітному зростанню числа цивільних, які викривають ворожих аґентів і повідомляють про них, - Фабрічніков доповів, що останню велику ланку Чорної Ліги на нашій території цілковито знищено. Усі дрібні ланки вже внесено до переліку, і їх невідкладно ліквідують. Він також повідомляє, що зусилля з відокремлення й дерадикалізації підозрюваних симпатиків у війську дали плоди та відіграли важливу роль у виявленні великих схованок і запобіганні кільком терактам.\n\nЧорну скверну вичищено зі Свєрдловска, але ми мусимо зберігати пильність. Тепер, коли їхня мережа розгромлена, а зв'язкові ув'язнені або мертві, мешканці Свєрдловска можуть зітхнути спокійно, знаючи, що серед них немає аґентів Чорної Ліги. Тепер ми звертаємо погляд на схід, де нас чекає остаточне зіткнення з Омском."
 SVR.42.a: "За БВБ - мовчазних захисників Свєрдловска!"

 SVR.43.t: "Вплив ревізіоністів знищено!"
 SVR.43.desc: "Завдяки невтомним зусиллям БВБ Фабрічніков доповів, що вплив ревізіоністів на нашій території впав до абсолютного мінімуму. Наш успіх він пояснює трьома чинниками: просвітою щодо тиранії, притаманної каґановічівській і сталінській думці; порівняно високим рівнем життя; а також нашими зусиллями заохочувати населення зберігати оптимізм і непохитність. За його словами, спільна дія цих чинників зробила теорії Каґановіча непривабливими для пересічного цивільного.\n\nМи успішно відбили пазурі, що стискалися довкола нас, але сам звір досі живий. Тепер, коли ризику повстання чи спроби "революції" немає, ми можемо присвятити більше часу та ресурсів поваленню режиму Каґановіча й справжньому визволенню народу Росії."
 SVR.43.a: "Уперед!"

 SVR.44.t: "Троє звичайних дисидентів"
 SVR.44.desc: "Для інших відвідувачів бару ці троє чоловіків нічим не вирізнялися. У натовпі їх було неможливо помітити. Зрештою, саме на це вони й розраховували. Боріс Єльцин, Євґєній Прімаков та Алєксандр Тізяков сіли в кабінці, замовили напої й заговорили.\n\n"Ми маємо діяти сміливіше, - сказав Боріс. - Я бував на протестах. Лише в цьому місті тисячі людей вірять, що зміни можливі, що демократія можлива. Ми повинні розповісти всім, що цей уряд їх не представляє. Справжня свобода дає людям бюлетені, а не кулі. А для цього нам треба випускати більше газет і проводити більше мітингів".\n\nОбидва його товариші навперебій кинулися відповідати. "Минулого тижня двох моїх хлопців ув'язнили за 'поширення провокаційної літератури', - сказав Євґєній. - Якщо ми почнемо пропагувати те, що фактично є державною зрадою, нас можуть закрити назавжди. А тоді й я потраплю до в'язниці!"\n\n"Подумай про наші витрати, Борю, - сказав Алєксандр. - Газети й листівки коштують дорого. Мітинги - ще дорожче. Ми не можемо й далі тягнути гроші з моїх зв'язків, не привернувши уваги Рокоссовскоґо. Тоді він піде грошовим слідом, і ми -"\n\n"Я зрозумів, зрозумів! - сказав Боріс, розмахуючи руками, наче розвіював сиґаретний дим. - Звісно, нам треба бути обережними. Але мусимо розширювати межі можливого. У нас є справжній шанс збудувати демократію в Росії; ми не можемо його змарнувати". Невдовзі офіціянт приніс напої. Боріс підняв маленьку склянку віскі й усміхнувся своїм співзмовникам."
 SVR.44.a: ""Тост за свободу.""

 SVR.45.t: "Свобода і смерть"
 SVR.45.desc: "Надя важко поставила каструлю з водою на плиту й викрутила пальник на найбільший вогонь. Саме тоді вона це почула. Голос плинув крізь відчинене поруч вікно. Раптовий порив вітру напнув фіранки. Вона протиснулася повз них і висунула голову з вікна.\n\nНа неї ринув потік подробиць. На вулиці внизу довкола пам'ятника Свєрдлову ворушився величезний натовп, що вихлюпувався на дорогу. Голос належав чоловікові середніх років, який стояв на невеликому дерев'яному помості в центрі натовпу. Крізь гомін людей, автомобільні клаксони й шипіння води на плиті вона не могла розібрати кожного його слова. Але чула його голос. Наполегливий. Гучний. Пристрасний. Він говорив про свободу й про те, як Рокоссовскій її в них відібрав. Він замовк, і натовп вибухнув вигуками. Вона також. Демократія - яка неймовірна ідея!\n\nДві чорні вантажівки з вереском загальмували на кільці, блимаючи синіми й білими вогнями. Задні двері відчинилися, і звідти ринули постаті в чорному. У Наді все стислося всередині. Її пальці вчепилися в підвіконня. Пролунав другий голос, посилений гучномовцем. Він гаркнув, вимагаючи, щоб натовп розійшовся. Відповіді людей - вони називали його фашистом, тираном, гітлерівцем - заглушили його вимоги. Чоловік середніх років зник. Кілька чорних постатей жбурнули в натовп димові шашки. Передні ряди сахнулися назад. Постріли. Люди в чорному ринули вперед. Крики.\n\nНадя відступила від вікна. Її трусило. Рука вдарила по каструлі, та зісковзнула з плити, вихлюпнула окріп їй на ногу й із гуркотом упала на підлогу. Надя скрикнула. Крізь зуби вирвалася низка лайок, коли хвиля болю прокотилася тілом і запаморочила голову. З вулиці внизу долинали ні з чим не сплутувані звуки кийків, що били по тілах, перемежовані пострілами, - звуки згасання життя."
 SVR.45.a: "Свобода приходить ціною демократії."

 SVR.46.t: "Немає справедливости - немає миру"
 SVR.46.desc: "Останнім часом ми спостерігаємо виразне й тривожне зростання невдоволення цивільного населення нашим урядом. По всій країні надходили повідомлення про вандалізм, диверсії та навіть фізичні сутички з поліцією чи військовиками. Утім, більшість таких інцидентів сталася в самому Свєрдловску, і це не має дивувати.\n\nНайімовірніша причина цієї хвилі заворушень - недавній інцидент на проспекті Лєніна, 46, унаслідок якого шестеро людей загинули, а ще десятеро дістали поранення. Подробиці в кращому разі уривчасті, але всі звіти свідчать, що все почалося вранці, коли натовп цивільних незаконно зібрався послухати промову політичного втікача, особу якого досі не встановлено. Приблизно за пів години прибув місцевий ґарнізон. Військовики оголосили зібрання незаконним і наказали натовпові розійтися. За повідомленнями, натовп відповів цеглою. Коли задля недопущення дальшого насильства чи пошкодження майна застосували сльозогінний газ, люди напали на солдатів із ланцюгами та сталевими трубами. Заворушення, що от-от мали початися, закінчилися, коли ґарнізон відкрив вогонь, не маючи прямого наказу.\n\nМаршал Рокоссовскій і Верховне командування сперечалися, як найкраще відповісти на цю трагедію. Деякі генерали вважають, що причетних до інциденту солдатів слід заарештувати. Швидких і публічних арештів прагне громадськість, і вони поклали б край будь-яким думкам про заколот. До того ж ці люди стріляли в цивільних. Їхній арешт - питання моралі. Однак інші члени Верховного командування стверджують, що солдати діяли в межах самооборони; насильство почали бунтівники. Арешт солдатів виставить уряд безпорадним і серйозно підірве бойовий дух. Зрештою останнє слово за Рокоссовскім."
 SVR.46.a: "Справедливість для загиблих."
 SVR.46.b: "Це була самооборона."

 SVR.47.t: "Падіння Чорної Ліги"
 SVR.47.desc: "З Омска надійшли надзвичайно важливі новини. Численні джерела підтвердили, що після нещодавньої смерти засновника Сибірської Чорної Ліги, генерала Дмітрія Карбишева, всередині неї, схоже, розгорівся жорстокий розкол.\n\nРозкол між різними офіцерськими кліками, за повідомленнями, призвів до загибелі багатьох високопоставлених діячів, передусім Дмітрія Язова, призначеного наступника Карбишева. Бюро внутрішньої безпеки вважало його винятково небезпечним радикалом, який напевне просував би і аґресивну експансію, і посилення диверсій проти наших сил, тож очікується, що його смерть завдасть смертельного удару по цілісності Ліги.\n\nЯкщо повідомлення правдиві, для Округу це надзвичайно сприятливий поворот подій. За відсутности централізованої влади в Омску вкрай малоймовірно, що незмінно тривожний вплив Ліги на наше військо й цивільне суспільство вдасться розширити чи навіть утримати на нинішньому рівні. Ба більше, БВБ повідомляє, що через незахищені й нерегулярні контакти між різними сторонами розколу вже викрито кількох інфільтраторів і диверсантів Ліги, а найближчими днями очікується викриття та затримання багатьох інших.\n\nКрім того, хоча Ліга загалом номінально зберігає контроль над своєю територією, майже напевне вона вже не спроможна вести наступальні операції. Отже, ми чи будь-хто інший зможемо розібратися з нею тоді, коли нам буде зручно.\n\nСхоже, значну перемогу здобуто без жодного пострілу. Принаймні без пострілу з нашого боку."
 SVR.47.a: "Яка удача..."

 SVR.48.t: "Спогади"
 SVR.48.desc: "Минуло багато років відтоді, як Амазасп Бабаджанян та Іван Баґрамян востаннє могли зупинитися й замислитися про минуле. І ревізіоністи, і Чорна Ліга робили такі перепочинки неможливими.\n\nТа тепер, коли обидві групи розпорошено, а владу Округу над Західним Сибіром зміцнено, вони знову могли собі це дозволити. Так вони й зробили: ділили трапезу й увесь час говорили вірменською. Як обоє й очікували, розмова швидко перейшла до їхньої старої батьківщини, давно втраченої під окупацією.\n\nБабаджанян довго розповідав про рідне село Чардахли, що лежало в азербайджанських землях, одразу за межею території Райхскомісаріяту. Баґрамян слухав із цікавістю: хоча сам народився в Єлізавєтполі, його батьки також походили з цього села, і він чув про нього чимало історій.\n\nОднак із плином часу розмова перейшла від минулого до сьогодення, і обоє висловили сум через окупацію Чардахли та усвідомлення того, що, можливо, вже ніколи його не побачать.\n\nТа Баґрамян нагадав товаришеві: Округ створив собі міцну базу в Сибіру й, якщо рішуче втілюватиме належну стратегію, зможе возз'єднати всю Росію. Якщо це станеться, Кавказ можна буде відвоювати, а до Чардахли - знову приїхати.\n\nВід цієї думки Бабаджанян усміхнувся. Він сказав Баґрамяну, що коли цей день настане, для нього буде честю запросити того до свого старого дому й розділити таку саму трапезу.\n\nВони скріпили домовленість рукостисканням і розійшлися - як вірмени та як друзі."
 SVR.48.a: "Одного дня."

 SVR.49.t: "Підтримка Федерації"
 SVR.49.desc: "Наш посланець у Новосібірску надіслав добрі новини. Федерація визнала загрозу Ліги й обіцяє підтримати нас у прийдешньому конфлікті. Сам президент Покришкін дав свої ґарантії.\n\nУ разі війни сили Федерації Новосібірска й Алтая мобілізуються вздовж кордону з Лігою, наче готуючись до повномасштабного наступу. Сподіваємося, що це відвернення уваги разом із підготовчими обстрілами їхніх важких гармат змусить Лігу перекинути війська з головного фронту проти нас. Це дасть нам перевагу, потрібну для перемоги над божевільними покидьками з Омска."
 SVR.49.a: "На війні важлива кожна перевага."

 SVR.50.t: "Звіт FPR-54-B12"
 SVR.50.desc: "Ідентифікатор: FPR-54-B12\nУкладач: JPK-BQ-9\nКлясифікація: 2B\nПредмет: ворожі дії в реґіоні SA-28G\n\nПередумови: за вказівкою центрального командування розпочато наступальні операції проти сил Уральського військового округу (оцінку UMD-34-G додано). Наявність значних сил противника (звіт про бойові дії UXE-893-H додано) вимагала передислокації раніше нерозподілених резервів з інших секторів.\n\nПідсумок: під час наступальних операцій проти сил Округу дружні підрозділи зазнали несподіваного обстрілу з непрямим наведенням із боку раніше не залученої третьої сторони. Огляд показав, що боєприпаси мали новосібірське походження. Подальший бій і полонення передових спостерігачів підтвердили присутність новосібірських сил, розгорнутих для взаємодопомоги бойовим формуванням Уральського округу.\n\nВисновок: Федерація Новосібірска й Алтая (політичну оцінку PE-56-3 додано) почала підтримувати Уральський військовий округ як політично, так і військово. Наполегливо рекомендовано переглянути розташування дружніх сил, їхнє розгортання й політичні оцінки.\n\n---КІНЕЦЬ ЗВІТУ---"
 SVR.50.a: "Негайно повідомити центральне командування. Пріоритет 5C-A."

 SVR.51.t: "Ми стоїмо самі"
 SVR.51.desc: "Рокоссовскій із презирством дивився на лист: білий папір із печаткою Федерації Новосібірска й Алтая, а поряд - його зміст.\n\n"Хоча ми бажаємо вам успіху в прийдешньому конфлікті, з жалем повідомляємо, що Федерація не має наміру прямо чи опосередковано втручатися у війну..."\n\nВідвівши погляд від сторінки, Рокоссовскій дістав сиґарету й запальничку, насолодився запахом тютюну та диму, а тоді поклав їх на попільничку, підпалюючи лист. 3-тя армія залишилася сама."
 SVR.51.a: "Поразка неприпустима."

 SVR.100.t: "Смерть маршала"
 SVR.100.desc: "Сьогодні похмурий день для Округу. Минулої ночі маршал Константін Рокоссовскій помер після тривалої боротьби з раком простати, який, без сумніву, загострили багаторічна служба та суворий сибірський клімат. Його останніми словами були: "Я зробив усе, що міг наразі. Ідіть далі, дайте мені спочити".\n\nРокоссовскій був одним із найкращих генералів Совєцького Союзу й служив російському народові з честю та гордістю. Навіть коли в довгі, жорстокі роки німецьких терористичних бомбардувань здавалося, що надії більше немає, він не припиняв рятувати кожне можливе життя. А коли бомбардування скінчилися, він провів Свєрдловск крізь найбільш бурхливі роки його історії, привівши 3-тю армію до перемоги над арміями Каґановіча та Язова.\n\nЙого наступником став близький друг і особистий помічник, генерал Павєл Батов, чиє право перебрати керівництво ніхто не заперечує. Рокоссовскоґо пережили дружина Ґаліна та дві доньки, Аріадна й Надєжда."
 SVR.100.a: "Суворов перебирає стерно."

 SVR.101.t: "Втрачені скарби"
 SVR.101.desc: ""Кляте армійське командування, - пробурмотів лейтенант Чернишевскій. - Уже втретє цього місяця посилають нас ганятися за примарами".\n\n45-й логістичний взвод відрядили до невеликого села Монєтний перевірити повідомлення, що там уцілів арсенал поліцейського відділку, де, можливо, досі зберігається придатна для армії зброя. Однак після багатогодинного маршу в зруйнованій бетонній будівлі вони знайшли хіба покинуте сміття, уламки та інший мотлох. Чернишевскій уже відкрив рота, щоб наказати повертатися, коли з дальнього кінця будівлі долинув голос.\n\n"Здається, тут щось є, пане!" Це був рядовий Соловйов, який нещодавно вступив до підрозділу. Він дивився на шматок дерева біля верху стіни, а тоді почав відтягувати купу завалів, що його закривала. До нього долучилися інші, доки купу не прибрали, і перед ними постали двері. Обережно відчинивши їх, вони спустилися сходами й опинилися в затхлому льосі. Коли інший рядовий освітив стіни, солдати мовчки завмерли перед знахідкою.\n\nЦілі полиці пістолетів-кулеметів, старих рушниць і карабінів. Ящики з пістолетами та набоями. Коли все це доправлять назад, зброї вистачить на цілу армію."
 SVR.101.a: "Наполегливість винагороджується."

 SVR.102.t: "Старі знаряддя для нового світу"
 SVR.102.desc: "Очі капітана Валєнтіна Маркова розширилися, коли він побачив гори ящиків, які вивантажували зі старої вантажівки. Вони заповнювали кузов від підлоги до стелі й від задньої стінки до кабіни.\n\n"Зі старого арсеналу їдуть іще, - сказав лейтенант Попов. - Решту передамо штабу логістичного батальйону на перевірку, але, може, спершу хочете попередньо оглянути це?"\n\nКапітан кивнув, коли двоє чоловіків опустили один із ящиків на землю й розкрили ломом. Марков витяг старий ППШ-41, аж рота роззявивши. Гладенький сухий приклад і блискуча металева цівка мали такий вигляд, наче їх виготовили вчора. Він оглянув механізм. Той здавався щойно з заводу.\n\n"Хочу випробувати. У вас є набої, лейтенанте?"\n\n"Так, товаришу капітане, зараз погляну", - відповів лейтенант, зазирнув у ящик, знайшов пачку й передав Маркову. Той дістав набої, зарядив зброю й натиснув на спуск. Вона ожила з ревом, за кілька секунд випустивши кулі високо в повітря. Для нього цього випробування було досить. Відклавши зброю, він простягнув руку лейтенантові Попову."
 SVR.102.a: ""Чудова знахідка, лейтенанте!""

 SVR.103.t: "Простий скарб"
 SVR.103.desc: ""Гей, Лєбєдєв, можеш присвітити сюди?"\n\nРядовий Смірнов мружився в темряві, намагаючись розгледіти ящики. За кілька секунд яскравий промінь ударив йому в обличчя. Смірнов кліпнув і дістав лом. За даними штабу, ця стара будівля колись була арсеналом, а він та решта логістичного взводу мали прочесати її в пошуках припасів, що могли б знадобитися армії.\n\nСолдат зірвав кришку. Разом із товаришем вони підняли її й зазирнули всередину, витягнувши пару запилених хакі-кителів. Очевидно, довоєнних, трохи затхлих, але в доброму стані. Смірнов накинув один на себе. Ще й доволі теплий. Хто б не запечатував ці однострої, він знав свою справу.\n\n"ЇЖА!" - пролунав у темряві арсеналу голос з іншого відділення. Смірнов і решта відділення кинулися через склад, гучно гупаючи чобітьми по бетонній підлозі. Коли вони побачили відкритий ящик, їхні очі розширилися, наче в Аладдіна, що знайшов печеру чарівних скарбів. Та для Смірнова й решти взводу численні пакунки консервів усередині були набагато ціннішими."
 SVR.103.a: "Які скарби можуть бути ціннішими за ті, що потрібні для виживання?"

 SVR.104.t: "Ленд-ліз"
 SVR.104.desc: "Полковнік Смірнов подивився на старий пістолет-кулемет Томпсона у своїх руках, а тоді - на вантажівку, з якої вивантажували ящики зі зброєю. Логістичний взвод щойно повернувся зі старої армійської бази з повним кузовом зброї та спорядження - досить, щоб озброїти сотні солдатів, якби це не була американська зброя за ленд-лізом часів Великої Вітчизняної війни. Прикро, що мало того, що ця зброя була імпортована з Америки ще під час війни, так і всі знайдені ящики з набоями поіржавіли.\n\nВін підійшов до вантажівки, знайшов чоловіка зі знаком зброяра на однострої й заговорив.\n\n"Скільки часу знадобиться, щоб переробити одну з цих рушниць під наші набої Токарєва?"\n\n"Доведеться викликати зі Свєрдловска більше фахівців із переробки патронника, - сказав зброяр. - Та коли вони прибудуть, справа має бути порівняно простою".\n\nСмірнов знову поглянув на дорогу. Стос вивантажених ящиків заввишки нагадував стародавню піраміду.\n\n"Підрозділ оплатить реквізицію й перевезення. Скажіть своїм людям, що найближчими тижнями вони будуть дуже зайняті"."
 SVR.104.a: "Відновлення логістики - справа нелегка."

 SVR.105.t: "Старий птах"
 SVR.105.desc: "Рядовий Крупін освітив покинутий анґар. Як і повідомив штаб місії, тут досі стояло кілька старих літаків із останніх днів Великої Вітчизняної війни. Питання було в тому, скільки з них іще працюють - якщо працює бодай один.\n\nВін зі своїм відділенням рушив проходом, а сусіднє відділення - іншим, по черзі перевіряючи стан кожного літака. На їхнє розчарування, більшість машин, як і перша, проіржавіли без надії на ремонт; хіба внутрішні деталі ще могли згодитися на брухт.\n\nСаме тоді вони знайшли старий штурмовик Іл-2 конструкції Ілюшина. Як і на інших, більша частина фарби за роки облізла. Та кабіна здавалася справною, а решта зовнішніх деталей, хоч за ними явно давно не доглядали, виглядали придатнішими. Перевірити літак можна було лише одним способом.\n\n"Ти ж служив в авіяції, товаришу", - сказав сержант Ібраґімов, повернувшись до Крупіна. Рядовий кивнув, відчинив кабіну й забрався всередину. Органи керування мали трохи зношений вигляд, але досі працювали. Він по пам'яті виконав процедуру запуску, і його обличчя розпливлося в усмішці, а товариші заходилися вітати. Після довгих років сплячки двигун старого літака знову ожив, захлинаючись і гуркочучи."
 SVR.105.a: "Ми злітаємо в небо."

 ### Not so Red Army chain ###
 SVR.110.t: "Не така вже й Червона Армія"
 SVR.110.desc: "Рядовий Дмітрій Сєрґєєвіч Чєрнов жував несмачне м'ясо зі їдальні. Його призвали кілька років тому, і він досі пам'ятав революцію 3-ї армії проти Тюмєні. А от дня, коли їжа відтоді мала бодай якийсь смак, пригадати не міг. Він повернувся до свого друга, рядового Морозова, який служив не так довго.\n\n"Ти коли-небудь думав, що соціялізм насправді має бути не таким? Тобто нам казали, що після революції всі стануть вільними. Але ми й далі їмо те саме лайно, а ті самі офіцери на нас горлають, як і раніше".\n\nМорозов усміхнувся, запалюючи сиґарету. "Сєрґєєвічу, я вже давно не вірю в цю чужоземну брехню. Кілька місяців тому я почав читати брошуру, яку дав мені Алєксовіч. У ній ішлося про істинний шлях помсти тим, хто катував Батьківщину, і про добробут, яким насолоджуватимуться всі росіяни, коли ми здолаємо ворогів, що її скривдили".\n\n"...Можна глянути? Просто... цікаво", - спитав Чєрнов.\n\nМорозов дістав із кишені шинелі маленьку пошарпану брошуру. Угорі виднілися літери: "ЧОРНА ЛІГА: ВІДРОДЖЕННЯ РОСІЇ"."
 SVR.110.a: "Тінь Чорної Ліги довшає."

 SVR.111.t: "Тінь шириться"
 SVR.111.desc: ""Товаришу лейтенанте!" - рядовий Давидов віддав честь офіцерові, увійшовши до кабінету.\n\n"Рядовий Давидов, - відповів лейтенант Котов. - Що привело вас сьогодні, товаришу?"\n\n"Е-е, я хотів дещо обговорити, - відповів рядовий. - Розумієте, один із моїх товаришів по відділенню, товариш Морозов, трохи дивний. Він часом говорить про якийсь 'Великий суд', що скоро має відбутися, і що він 'приведе до відродження матінки Росії'. Сьогодні він дав мені про це брошуру, і я подумав, що ви маєте її побачити".\n\nДавидов передав брошуру лейтенантові. Вона була чорною, з білим орлом і написом "ВЕЛИКИЙ СУД" угорі.\n\n"Дякую, що повідомили, товаришу, - сказав лейтенант Котов. - Можете повертатися до своєї кімнати".\n\nРядовий Давидов віддав честь лейтенантові й вийшов. Зачинивши двері, лейтенант Котов узяв слухавку й набрав номер.\n\n"Алло. Товаришу полковнику? Так, це я, лейтенант Котов. Я знайшов у наших лавах іще одного ультранаціоналіста"."
 SVR.111.a: "Розосередити найгірших агітаторів."
 SVR.111.b: "Почати репресії."

 SVR.112.t: "Стан поліпшується"
 SVR.112.desc: ""І що ви думаєте про Омск і Чорну Лігу, товаришу Чєрнов?"\n\n"Та це просто купка реакціонерів. Не знаю, навіщо я його слухав".\n\nМинув тиждень відтоді, як ультранаціоналістичного агітатора рядового Анатолія Морозова перевели з його підрозділу до ґарнізонного поста на іншому кінці країни. Комісара Єґорова призначили до цього підрозділу регулярно перевіряти лояльність частин, де ультранаціоналісти поширювали контрреволюційну пропаганду.\n\n"Усе гаразд, товаришу, - сказав Єґоров. - Цілком природно, що люди починають молоти дурниці, коли довкола самі погані впливи. Однак після переведення Маракова саме ви показали найкращий результат у тестах на лояльність".\n\n"Як він поживає, якщо дозволите спитати? Він досі симпатизує ультранаціоналістам?"\n\n"Ні, товаришу. Після переведення він майже не говорить, особливо про Чорну Лігу. Комісари досі за ним стежать, але ми вже думаємо невдовзі припинити нагляд".\n\n"Радий чути"."
 SVR.112.a: "Світло завжди розвіє тінь."

 SVR.113.t: "Чорна гідра"
 SVR.113.desc: "Комісар Вячєслав Дмітрієв роззявив рота, дивлячись на світлини перед собою. Фотографії пролігівських брошур, плакати з їхньою емблемою та книжки Карбишева і його генералів височіли купою на столі. За всю кар'єру він не бачив стільки зрадницьких матеріялів в одному підрозділі, як у 47-му Ніжнєтаґільскому батальйоні. Ще три місяці тому його вважали одним із найвідданіших підрозділів. Як таке могло статися?\n\nДвері кабінету відчинилися, й увійшов чоловік в однострої військової поліції.\n\n"Товаришу комісаре! - поліціянт віддав честь. - Ми знайшли головного підозрюваного в справі ультранаціоналістів! Схоже, він мав прямі зв'язки з Омском, завдяки яким поширював реакційну пропаганду в наших лавах".\n\n"Хто він?" - запитав комісар Дмітрієв.\n\n"Один із новоприбулих, переведених минулого місяця. Його звати Анатолій Морозов. Ми збиралися його заарештувати, але він утік і досі переховується".\n\n"Починайте облаву, - сказав комісар. - І приведіть до мене офіцерів, відповідальних за його переведення. Ми не можемо допустити повторення таких катастроф"."
 SVR.113.a: "Реакція - наче гідра: відрубаєш одну голову, а на її місці виростуть дві."

 SVR.114.t: "Нові ланки"
 SVR.114.desc: ""Рядові Фєдоров, Мєкніков та Юртаєв: за створення нелегальної ланки Чорної Ліги й поширення її пропаганди в 4-му Пєрвоуральскому батальйоні військовий суд визнає вас винними та засуджує до розстрілу!"\n\nВирок комісара Алєксєя був остаточним. Троє рядових, які стояли за столом, заваленим пропагандою Чорної Ліги, кивнули, приймаючи вирок, після чого вартові повели їх назад до камер.\n\nКоли Алєксєй виходив із судової зали, його зупинив начальник, дивізійний комісар Калашнік, і повів до кабінету.\n\n"Товаришу Алєксєй, я маю дещо вам показати", - сказав він, указуючи на мапу країни. Грубе коло чорних шпильок оточувало сам Свєрдловск, немов кільце темного полум'я, що підступало дедалі ближче.\n\n"Кожна шпилька - відома ланка Чорної Ліги", - пояснив Калашнік. Побачивши, як розширилися Алєксєєві очі, він продовжив: "Бачу, тепер ви розумієте проблему з вашими маленькими друзями".\n\nНайближче до Свєрдловска, немов кинджал, спрямований йому в серце, була Пєрвоуральска ланка."
 SVR.114.a: "Спробувати проникнути до них."
 SVR.114.b: "Негайно запровадити воєнний стан."

 SVR.115.t: "Спроби проникнення"
 SVR.115.desc: ""Присягаюся, товаришу комісаре, нас підставили! Ми не знаємо, звідки в наших шафках узялися брошури Чорної Ліги!"\n\n"Я чув це вже стільки разів", - сказав він заарештованим рядовим, коли їх виводили з казарми. Він дістав флягу горілки й ковтнув.\n\n"Виснажують усі ці арешти, товаришу?" - засміявся помічник.\n\n"Є трохи", - відповів Сокорін, ховаючи флягу.\n\nВідтоді як вони найняли аґентів для проникнення в ланки Чорної Ліги, військова поліція загрібала розвіддані про їхню діяльність, наче азартний гравець у казино. Відкриття, що ланок було значно більше, ніж вважали раніше, непокоїло, та тепер, коли про їхнє існування знали, придушити їх стало набагато легше. Штаб навіть не підозрював про цю ланку, доки аґент Полєтов не надіслав кілька звітів розвідки про зв'язок між нею та осередком у сусідньому селі.\n\nСокурін звірився з нотатником. До кінця дня їм іще належало заарештувати одну ланку."
 SVR.115.a: "Чудово."

 SVR.116.t: "Правда"
 SVR.116.desc: "Офіцери Ґорькій і Бородін стояли в покинутому складі, а промені їхніх ліхтарів вихоплювали лише уламки. За інформацією аґента Полєтова, пів години тому тут мала зустрітися ланка Чорної Ліги з аґентом з Омска, який привіз би їм нові пропагандистські матеріяли та вказівки.\n\n"Що сталося?" - запитав Ґорькій товариша.\n\n"Мабуть, дізналися про нас і втекли", - відповів Бородін, вилаявся собі під ніс і дістав із кишені пальта рацію. "Повідомлю штаб. Засідка провалилася".\n\nТим часом Полєтов сидів у своїй кімнаті в казармі. Повідомлення на базу було надіслано, лишалося тільки дочекатися відповіді. Поглянувши на годинник, він також дістав із кишені крихітну рацію й увімкнув. Сигнали, що сповіщали про надходження інструкцій, пролунали точно вчасно, й невдовзі штучний жіночий голос почав зачитувати низку чисел. Він дістав нотатник і заходився розшифровувати передачу.\n\n"Вітаємо, аґенте Морозов, із успішним витоком неправдивої інформації, - йшлося в повідомленні. - Завдяки вашим зусиллям Великий суд наблизився на один день. Ось ваші щотижневі інструкції...""
 SVR.116.a: "Диявол завжди той, від кого найменше цього чекаєш."

 SVR.117.t: "Спійманий на гарячому"
 SVR.117.desc: ""Чуґунов, що ви можете розповісти нам про діяльність Чорної Ліги у Свєрдловску?" Офіцер Плотніков стояв перед молодим чоловіком, який сидів на іншому боці столу. За дверима чатував вартовий на випадок, якщо в'язень спробує втекти. Учора вранці прикордонна поліція спіймала Чуґунова, коли він намагався оминути перевірку. Той стверджував, що прибув із Тюмєні, та деякі папери при ньому свідчили про інше.\n\n"Я вже казав, що не маю нічого спільного з тими психами. Мої батьки живуть у Свєрдловску. Я лише хотів побачити -"\n\n"Переконлива історія, - сказав Плотніков, - якби не вилучені папери, ми, може, навіть повірили б вам, Чуґунов. Чи нам слід називати вас Мєдвєдєвим?"\n\nПлотніков підняв маленький нотатник, підніс його до обличчя й почав читати.\n\n"Тут написано, що ви мали зустрітися з ланкою Чорної Ліги на покинутому заводі під Камєнском, Мєдвєдєв. Розкажете нам трохи більше про цю вашу групу?"\n\nМєдвєдєв зітхнув, зрозумівши, що гру скінчено.\n\n"Що саме ви хочете знати?" - сказав він офіцерові."
 SVR.117.a: ""Усе.""

 SVR.118.t: "Пекло"
 SVR.118.desc: "Анатолій Морозов почув, як куля поліційного снайпера зрикошетила від металевих сходів, поки він мчав дедалі вище, підіймаючись на дах складу. Він був останнім уцілілим членом своєї ланки, останньою надією на те, що Свєрдловск приєднається до лав Чорної Ліги й Великого суду, коли настане той священний день. Знизу долинув голос.\n\n"Анатолію Морозов! Не чиніть опору арешту!"\n\nВін проігнорував слова військової поліції, діставшись вершини споруди. На даху його оточували старі цистерни з бензином. Унизу він бачив зібраний взвод військової поліції, а їхній начальник звертався до нього через гучномовець.\n\n"Це ваш останній шанс, Морозов! Здавайтеся, або ми відкриємо вогонь!"\n\nНі, подумав Морозов, дивлячись на цистерну поряд, капітуляції бути не могло. Якщо він не зможе взяти участь у Великому суді, його життя не матиме сенсу. Трасувальна куля поліційного снайпера пролетіла повз нього й влучила в бензинову цистерну, що зайнялася. Усміхаючись, він відкрив крани навколишніх цистерн, здіймаючи пожежу.\n\n"РОСІЯ ПОВСТАНЕ!" - вигукнув він із розпростертими руками й переможно засміявся, справді довершивши свою втечу від поліції, коли вогняні вибухи цистерн поглинули його тіло."
 SVR.118.a: "На вершині світу."

 SVR.119.t: "Дезертири в лавах"
 SVR.119.desc: "Капрал Мєльніков доїв останню ложку поданого йому борщу, смакуючи кожну краплю запашної юшки. Він уже давно не їв нічого теплого й не знав, коли випаде наступна нагода. Підвівши очі, він побачив, що решта відділення також насолоджується борщем.\n\n"Уже пізно. Хочете лишитися на ніч?" - запитав їх старий Вячєслав Яковлєв. До його хатини давно ніхто не приходив, тож він не знав, чи знайдеться місце для гостей, але вирішив, що принаймні мусить запропонувати з чемности.\n\n"Ми залюбки лишилися б іще, але боюся, що мусимо продовжити завдання, - відповів капрал. - Штаб буде дуже невдоволений, якщо ми запізнимося".\n\nЯковлєв кивнув. Він здивувався, коли вдень Мєльніков зі своїм відділенням з'явилися біля хатини, та капрал пояснив, що вони виконують таємне завдання зі Свєрдловска, про яке ніхто не має знати, тож поспіх був зрозумілим.\n\nКоли настала ніч, відділення рушило безкраїм лісом довкола хатини. Зірки було майже не видно, але, на щастя, Мєльніков викрав мапу з канцелярії. Коли вони присіли над нею, на їхніх обличчях з'явилося тепло, якого вони не відчували від часу, коли полишили дім старого. Недовга хода на південний захід - і вони нарешті перетнуть кордон Тюмєні. До свободи."
 SVR.119.a: "Ми мусимо запровадити суворіші обмеження."
 SVR.119.b: "Ми мусимо заохотити їх залишитися."

 SVR.120.t: "Тяжкі часи"
 SVR.120.desc: "Ґаліна Артьомова зціпила зуби, обережно відмірюючи їжу на прилавку й вираховуючи, як найкраще розподілити денний пайок. Її дихання стало важким, коли вона зрозуміла, що капусти на 425 грамів менше, ніж гадала. Навіщо було скорочувати овочевий пайок, подумала вона. Байдуже. Вона впорається. Вона єдина доросла в домі, тож найбільше їжі потрібно їй... ні. Найбільше вона потрібна дітям. Але котрій дитині?\n\nВона глянула на трьох дітей, що гралися в кутку: Дєніску, Катю та Олєжка. Дєніска був найстарший, але чи варто дозволяти йому рости, поки молодші голодують? Ні, їжа найбільше потрібна наймолодшому, Олєжкові. Ґаліна стояла, переводячи погляд із дітей на пайок і назад. Вона знову й знову ділила й перерозподіляла їжу, намагаючись знайти найкращий спосіб, аж поки закричала й упала на стілець. Якби ж Кіріл був тут. Якби вона могла почути його сміх, то, можливо, знайшла б сили знову взятися до роботи.\n\nІ от, коли вона розплющила очі, перед нею стояла Катя з пакунком і листом у руці.\n\n"Не сумуй, матусю. Тато прислав нам подарунок з армії".\n\nКатя відкрила пакунок і засміялася. Сміялася з примх долі, що наздогнали її саме цієї миті. Сміялася з жарту, на який перетворилося її життя. Сміялася з умісту пакунка.\n\nПАЙОК: ВІЙСЬКОВИЙ: ОВОЧЕВІ КОНСЕРВИ: 425 ГРАМІВ"
 SVR.120.a: "Набрати цивільних до ополчення."
 SVR.120.b: "Вони потрібні нам на заводах."

 SVR.121.t: "Ревізіоністська пропаганда"
 SVR.121.desc: "Рядовий Дмітрій Олєґовіч Чабан зітхнув, дивлячись на лист, і опустився на ліжко в казармі.\n\n"Цивільні пайки знову скоротили, - сказав він другові, рядовому Аґапову. - У тебе ніколи не виникало відчуття, що соціялізм має бути не таким? Нам казали, що всі будуть рівні, а тепер ми всі однаково голодуємо!"\n\n"Звісно, - сказав Аґапов. - Саме авангардна партія робітників має привести революцію до перемоги. Купка генералів, які вдають соціялістів, - просто військові диктатори під іншою назвою".\n\n"І це..."\n\n"Олєґовічу, наші родини голодують тому, що начальство дбає лише про власну вигоду. Саме тому провалився й старий Совєцький Союз. Хочеш дізнатися справжній шлях уперед, справжній шлях до соціялізму?"\n\nЧабан кивнув. Будь-що було краще за цю оболонку армії, що вдавала країну.\n\nАґапов дістав із кишені потерту брошуру й передав Чабанові. Назва проголошувала: "СТАЛІНІЗМ: ШЛЯХ У МАЙБУТНЄ!""
 SVR.121.a: "Вистежити їх."
 SVR.121.b: "Запровадити суворі обмеження у війську."

 SVR.122.t: "Агітаторів спіймано"
 SVR.122.desc: ""Присягаюся, товаришу комісаре, я не знаю, звідки взялася ця брошура!" - закричав рядовий Чабан, сидячи в кімнаті для допитів.\n\n"То вона взялася з нізвідки, товаришу? Чарівна довбана жар-птиця одного дня спустилася з неба й кинула її вам у кишеню! - кричав комісар Васільєв, тицьнувши сталінською брошурою Чабанові в обличчя. - Присягаюся, я битиму з вас усе лайно, доки ви не помрете або не заговорите! ВИ МЕНЕ ЗРОЗУМІЛИ, ТОВАРИШУ?"\n\n"Я... е-е..." - Чабан силкувався пригадати, де й коли дістав брошуру.\n\n"У вас три секунди, щоб згадати, товаришу. Один... два..."\n\n"Від товариша Аґапова, товаришу! Він дав її мені днями під час обідньої перерви!"\n\n"Справді? - комісар понизив голос. - А ви знаєте, звідки вона в нього?"\n\n"Е-е, здається, кілька тижнів тому я бачив, як товариш Іванов щось йому передавав, і... е-е, пригадую, днями Аґапов іще розмовляв із товаришем Бабаріним?"\n\nКомісар Васільєв усміхнувся. "Ось так, товаришу. Говоріть далі...""
 SVR.122.a: "Посилити обмеження у війську."
 SVR.122.b: "Вичистити решту агітаторів."

 SVR.123.t: "Питання бойового духу"
 SVR.123.desc: ""Гей, ти не бачив Чабана? Мені потрібна сиґарета", - запитав рядовий Кузнєцов у товариша, рядового Роґова. Цього дня в казарменій їдальні здавалося порожніше. Розмови стихли, а в меншому натовпі було наче менше знайомих облич.\n\n"Здається, днями його забрали".\n\nКузнєцов на мить завмер, усвідомивши значення Роґових слів.\n\n"О... тоді, може, попросиш сиґарету в Аґапова?"\n\n"Його також забрали. Сьогодні вранці".\n\n"Іванов, Бабарін...?"\n\n"Їх теж".\n\nСолдати знову замовкли. Тиша в їдальні тепер оглушувала, а говорити здавалося неможливим, коли значення Роґових слів стало очевидним. Кузнєцов спробував жестом попросити в товариша сиґарету, але це здавалося такою дрібницею на тлі довколишньої похмурости й самоти, у якій вони опинилися."
 SVR.123.a: "Такою є ціна ревізіонізму."

 SVR.124.t: "Зростання протестів"
 SVR.124.desc: "У Євґєнія Нікітовіча Бочарова болів живіт, а плакат із написом "НЕМАЄ ЇЖІ = НЕМАЄ РОБОТИ" здавався важким у руці. Позаду стояв металургійний завод, де він працював і який через страйк не відкривався вже тиждень. Та він однаково не опускав плаката й разом із товаришами-робітниками вигукував гасла, доки не охрип. Під час протесту він помітив, як до нього наближається друг, Андрєй Собакін.\n\n"Гей, Нікітовічу? Знаю, останнім часом я майже не ходив на протести, але я міркував і дещо зрозумів: начальство ніколи не поверне нам їжу".\n\n"То що нам робити? Згортатися й іти додому?" - запитав Бочаров.\n\n"Ні, Нікітовічу, - відповів Собакін. - Ми маємо не просто протестувати проти нестачі. Знаєш, у що вірив Сталін? Він вірив, що державою має керувати робітнича партія, а не клята армія. Невже ти справді думаєш, що купка офіцерів так легко віддасть їжу нам, робітникам, а не своїм?"\n\n"...Розкажеш мені більше про Сталіна, Андрюшко?""
 SVR.124.a: "Поступитися вимогам."
 SVR.124.b: "Придушити протест."

 SVR.125.t: "Надто далекий міст"
 SVR.125.desc: ""Сержанте Ніколаєв, я бачу ревізіоністів, - сказав рядовий Кравцов. - Вони зібралися на майдані перед заводом".\n\nНіколаєв увімкнув рацію.\n\n"Штабе, це Т-34 4830-B. Цілі в полі зору".\n\n"Чудова робота. Відкрити кулеметний вогонь, за потреби перейти до вогню з автоматичної гармати. Не пошкодити інфраструктуру. Повторюю: не пошкодити інфраструктуру".\n\nСерце Андрєя Собакіна завмерло, коли він почув кулеметні черги на вулиці й крики товаришів-протестувальників. Скам'янівши від жаху, він дивився, як Т-34 3-ї армії сунуть вулицею, з безжальною ефективністю несучи смерть робітникам.\n\nОднак він відмовився тікати. Обличчям стікав піт; коли натовп розбігся, він побачив на землі Бочарова - закривавленого, але живого. Він спробував підняти його, аж тут позаду загуркотів Т-34. Очі обох робітників розширилися, коли вони побачили спрямовану на них гарматну цівку. Зрозумівши, що це їхня остання мить, обоє водночас вимовили один склад."
 SVR.125.a: ""Ні.""

 SVR.126.t: "Знак часу"
 SVR.126.desc: ""Мені подобається твій суп, матусю!" - сказав Дєніс Артьомов, умочуючи бутерброд в овочевий суп, який приготувала мати. Його брат і сестра, Єкатєріна й Олєґ, згідно кивнули й зробили те саме.\n\n"Справді? Це тому, що матуся готувала їжу з любов'ю", - усміхнулася мати, Ґаліна Артьомова. Вона вже давно не могла приготувати їм такого обіду, хай навіть суп і бутерброди були простими. Але після закінчення страйків уряд погодився знову збільшити цивільні пайки, і тепер вона могла готувати щось більше за жалюгідні крихти, якими годувала їх раніше.\n\n"Можна мені десерт, коли я доїм, матусю?" - запитала Єкатєріна.\n\n"Звісно, Катю. Чого б ти хотіла?"\n\n"Можна морозива?" Інші діти підтримали Катину пропозицію.\n\nДесерт, подумала Ґаліна. Ще одна річ, про яку вона майже забула.\n\n"Звісно, сонечко. Після обіду підемо до крамниці морозива"."
 SVR.126.a: "Життя цивільних поліпшилося."

 SVR.127.t: "Солдатська доля"
 SVR.127.desc: ""Товаришу Артьомов, що з вашими чобітьми?" - гаркнув сержант Павлов.\n\n"Що, товаришу?" - відповів рядовий Кіріл Артьомов.\n\n"Вони як слід не начищені. Наче ви в лайно наступали".\n\n"О, е-е, вибачте".\n\n"Краще вибачайтеся наприкінці дня. Як закінчите, пробіжіть п'ять кіл навколо майдану".\n\nПісля огляду Артьомов пробіг додаткові кола, як йому й наказали. Після чергового скорочення пайків бігти було важко, й після п'ятого кола він просто впав на землю, виснажений і змучений болем. Увечері під час муштри Артьомов відставав на вправах і ледь не впав із паркану, через який вони мали перелізти. За це його позбавили вечері.\n\nКоли з настанням ночі він знову ввійшов до казарми, виснажений і голодний, то думав, чим саме заслужив цей день страждань. Тут двері відчинилися, й до кімнати ввійшов один із товаришів.\n\nНаступного ранку він дістав пакунок із дому, який, схоже, запізнився на день. Він недовірливо дивився, як відкриває його й бачить уміст: банку овочевих консервів і трохи м'яса від дружини."
 SVR.127.a: "Коло повернулося до початку."

 SVR.128.t: "Ще одна партія"
 SVR.128.desc: "Того дня Вячєслав Яковлєв побачив, як із пшеничних полів до нього наближаються двоє чоловіків у пошарпаних одностроях. Старий облишив оранку й відразу пішов їм назустріч.\n\n"Вітаю, - сказав перший обідранець. - Я Ґєннадій Кузнєцов, а це мій товариш Євґєній Роґов. Ми..."\n\n"Виконуєте надсекретне завдання в Тюмєні? - запитав Яковлєв. Двоє солдатів перезирнулися. - Якщо вам потрібен прихисток, нагорі є вільна спальня. Заходьте".\n\nТого вечора Яковлєв із двома солдатами сіли вечеряти. Солдати віддали йому частину пайків, і він зміг приготувати для них ситні пироги.\n\n"То прямуєте до Тюмєні, еге ж? Раджу на найближчому перехресті повернути праворуч і йти дорогою до найближчого міста вже за кордоном. Можете вирушити рано-вранці й іти туди весь день, або вийти опівдні й заночувати біля озера".\n\n"Дякуємо, товаришу. Ми переночуємо й вирушимо завтра вранці, - сказав Роґов. - До речі, звідки ви стільки знаєте про нас і наше завдання?"\n\nЯковлєв усміхнувся.\n\n"Скажімо так: я вже досить давно знаю декого з ваших друзів"."
 SVR.128.a: "І знову почалося..."

 SVR.129.t: "Лояльність"
 SVR.129.desc: "Рядовий Кірілл Задачін кілька разів нервово озирнувся в старій шкільній спортивній залі, де він і решта 39-го стрілецького батальйону чекали, доки комісар оголосить результати обов'язкових перевірок лояльности. Два місяці тому майже все його відділення визнали недостатньо лояльним, після чого товаришів більше ніхто не бачив; минулого місяця забрали й решту друзів із рідного села, що служили в іншому взводі. А що, як нелояльним визнають його?\n\nКомісар Воробйов урочистим кроком увійшов у залу в парадному однострої, усміхаючись, наче вовк, який опинився в кошарі. Задачін заплющив очі, але ніщо не могло підготувати його до наступних слів Воробйова.\n\n"Вітаю".\n\nУся рота, зокрема й Задачін, який розплющив очі, недовірливо втупилася в комісара.\n\n"Товариші, мало того, що в цьому підрозділі немає жодного нелояльного бійця, штаб визнав вас найвідданішим підрозділом у всій армії. На честь вашої надійности відтепер цей підрозділ називатиметься 15-м ґвардійським стрілецьким батальйоном! Церемонія вручення нового знамена відбудеться наступної середи"."
 SVR.129.a: "Ціна лояльности висока, але винагорода ще вища."

 SVR.130.t: "Перемоги в тихій війні"
 SVR.130.desc: "Бюро внутрішньої безпеки веде війну, і ця війна поставила перед ним унікальний виклик. Ворожі бійці не носять одностроїв, не мають на собі нарукавних пов'язок чи символів. Вони не виступають проти нас із рушницями й ножами; їхня зброя - книжки, брошури й пропаганда. У цій війні битви точаться й виграються у свідомості наших солдатів, а не на полі бою.\n\nЗавдяки невтомній праці хоробрих синів Свєрдловска в БВБ наші зусилля в боротьбі з повстанцями Чорної Ліги, що терзають країну, дали плоди. Оперативники успішно проникли до кількох ланок, що дало нам перевагу в зриві їхніх пропагандистських кампаній та полюванні на них. Після захоплення керівників цих ланок і арешту незліченних симпатиків вплив Омска на нашу країну підірвано."
 SVR.130.a: "Ми не спочинемо, доки не вичистимо з наших земель рештки їхньої чорної скверни!"

 SVR.131.t: "Перемоги над ревізіоністами!"
 SVR.131.desc: "Бюро внутрішньої безпеки веде війну, і ця війна поставила перед ним унікальний виклик. Ворожі бійці не носять одностроїв, не мають на собі нарукавних пов'язок чи символів. Вони не виступають проти нас із рушницями й ножами; їхня зброя - книжки, брошури й пропаганда. У цій війні битви точаться й виграються у свідомості наших солдатів, а не на полі бою.\n\nЗавдяки невтомній праці хоробрих синів Свєрдловска в БВБ наші зусилля в боротьбі з невмирущим ревізіоністським впливом мали величезний успіх. Підривні каґановічівські елементи в наших кордонах вважали, що населення співчуває їхній справі, і це дало оперативникам ідеальну нагоду проникнути до їхніх організацій. Наші люди всередині таємно передавали нам інформацію, завдяки якій ми зривали спроби ревізіоністів грабувати армійські склади й поширювати проревізіоністську літературу. А коли основні бази цих ланок установили, їх методично й із машинною точністю стерли з мапи. Ревізіоністському впливові завдано тяжкого удару, від якого вони навряд чи оговтаються."
 SVR.131.a: "Тиранам не місце у Свєрдловску - та й у Росії загалом!"

 SVR.132.t: "Дезертири зі Свєрдловска"
 SVR.132.desc: "Рано-вранці, під гнітючим покровом сибірської ночі, невелика група людей прослизнула крізь укріплення на нашому північному рубежі й перетнула кордон, де їх швидко затримали військові патрулі. Переважно це чоловіки, хоча з ними є кілька жінок і дітей. Вони стверджують, що дезертирували з жалюгідної хунти Рокоссовскоґо й шукають прихистку в Тюмєні, нинішньому смолоскипі міжнародної соціялістичної революції.\n\nЦей незвичайний гурт напрочуд добре обізнаний із нашими соціялістичними ідеалами, хоча походить із реакційної держави Свєрдловска. Вони також можуть володіти цінною інформацією, яку ми використаємо проти ворога. Однак деякі їхні вислови майже дослівно взяті з праць Маркса і Сталіна. Цілком можливо, що ці чоловіки та жінки - шпигуни, надіслані дестабілізувати наш уряд. Що з ними робити?"
 SVR.132.a: "Солідарність! Впустити їх."
 SVR.132.b: "Затримати й допитати їх."
 
 SVR.140.t: "Вплив Чорної Ліги надто низький"
 SVR.140.desc: "Інфільтратори й симпатики Чорної Ліги роками терзали нашу країну, підриваючи стабільність уряду та сіючи насіння нашої поразки в невідворотній війні з Омском. Ми почали тіснити їх лише нещодавно, зі створенням Бюро внутрішньої безпеки, та багато хто боявся, що навіть найкращих наших зусиль буде замало. Тепер війна нарешті почалася, й інфільтратори розкрили карти.\n\nНевтомна пильність БВБ звела вплив Чорної Ліги на нашій території майже нанівець. Диверсії й теракти поодинокі та рідкісні. У небагатьох бере участь понад п'ятеро повстанців, і ще менше завдають істотної чи бодай помітної шкоди нашим воєнним зусиллям. Тепер, коли вулиці вільні від терористів, ми можемо зосередити всі сили на остаточній перемозі над Язовим."
 SVR.140.a: "Наш ворог - по той бік багнета."

 SVR.141.t: "Чорна Ліга створює проблеми"
 SVR.141.desc: "Інфільтратори й симпатики Чорної Ліги роками терзали нашу країну, підриваючи стабільність уряду та сіючи насіння нашої поразки в невідворотній війні з Омском. Ми почали тіснити їх лише нещодавно, зі створенням Бюро внутрішньої безпеки, та багато хто боявся, що навіть найкращих наших зусиль буде замало. Тепер війна нарешті почалася, й інфільтратори розкрили карти.\n\nПопри велику шкоду, якої ми завдали їхній мережі, БВБ не змогло цілковито знищити мережу інфільтраторів Чорної Ліги. Ворожі аґенти налаштовують населення проти війни, спричиняючи невеликі протести та пролігівський вандалізм. Вони також влаштовують диверсії на заводах і лініях зв'язку, іноді завдаючи значної шкоди. Попри це, їм не вдалося паралізувати наші воєнні зусилля, і БВБ невдовзі зачистить ці зрадницькі елементи."
 SVR.141.a: "Вони нас не зупинять. Уперед!"

 SVR.142.t: "Чорна Ліга тероризує населення"
 SVR.142.desc: "Інфільтратори й симпатики Чорної Ліги роками терзали нашу країну, підриваючи стабільність уряду та сіючи насіння нашої поразки в невідворотній війні з Омском. Ми почали тіснити їх лише нещодавно, зі створенням Бюро внутрішньої безпеки, та багато хто боявся, що навіть найкращих наших зусиль буде замало. Тепер війна нарешті почалася, і ці сумніви, можливо, були виправдані.\n\nЛанки з п'ятдесятьох і більше чоловіків нападають на військові склади й грабують усе, що не прибито. Міські райони кишать інфільтраторами й насильством. Чоловіки в саморобних одностроях Ліги виходять на міські майдани й відкривають вогонь із викраденої військової зброї. Вітер здіймає бурі з розкиданих пропагандистських листівок Ліги. Провулки всієї столиці вкриті плакатами, що обіцяють помсту німецькій загрозі. БВБ із цим не впорається; необхідно негайно зняти військові підрозділи з фронту й кинути проти цих терористів!"
 SVR.142.a: "Вплив Чорної Ліги шириться глибоко й моторошно."

 SVR.143.t: "Диверсія Чорної Ліги!"
 SVR.143.desc: "Інфільтратори й симпатики Чорної Ліги роками терзали нашу країну, підриваючи стабільність уряду та сіючи насіння нашої поразки в невідворотній війні з Омском. Ми почали тіснити їх лише нещодавно, зі створенням Бюро внутрішньої безпеки, та багато хто боявся, що навіть найкращих наших зусиль буде замало. Тепер війна нарешті почалася. Їхній кошмар став нашою дійсністю.\n\nБанди силовиків Чорної Ліги нишпорять вулицями й без розбору розстрілюють "зрадників". Ланки чисельністю до п'ятисот чоловіків заполоняють військові бази й склади та грабують усе, що не прибито. На фронті симпатики Ліги нападають на офіцерів і навіть заколюють їх багнетами уві сні. Координовані атаки саморобними вибуховими пристроями знищили цілі збройові заводи, вбивши всіх усередині й знищивши запаси. Надходять навіть уривчасті повідомлення про відкриті повстання ланок Чорної Ліги! Щоб подолати цих терористів, потрібні рішучі заходи, інакше наші воєнні зусилля можуть зазнати краху!"
 SVR.143.a: "Чорна рука тягнеться до нас..."

 SVR.144.t: "Низький рівень тюмєнської агітації"
 SVR.144.desc: "Під час нинішньої війни з Тюмєнню ми помітили кілька випадків диверсій і партизанської діяльности. Хоча вони незначні, це однаково певною мірою шкодить нашим лініям постачання й воєнним зусиллям. Ми вважаємо, що за цим стоять тюмєнські агітатори та симпатики. На щастя, диверсанти дуже ізольовані й, на нашу думку, майже не мають способів зв'язатися з ворогом у Тюмєні. Утім, становище могло бути значно гіршим.\n\nНаші ґарнізони вже мобілізовано для стримування загрози, однак вистежити ворога буде нелегко. Вони, без сумніву, мають багато схованок, і знайти їх буде непросто. Наші війська мусять остерігатися засідок. Та оскільки партизанів небагато, командування ґарнізонів запевнило нас, що їхнє викорінення не забере багато часу. Вони не повинні створити значних проблем, але ми не можемо ризикувати довгою війною, адже тоді опір може стати набагато серйознішим. Нам однаково слід діяти швидко, щоб комуністична загроза Тюмєні не тривала довго."
 SVR.144.a: "Сподіваємося, наших зусиль зі стримування партизанів вистачить."

 SVR.145.t: "Тюмєнська диверсія!"
 SVR.145.desc: "Надійшло кілька повідомлень про партизанів, які створюють проблеми у внутрішніх районах країни. Симпатики Тюмєні пошкоджують інфраструктуру й перерізають лінії постачання. Наше військо на фронті повідомляє, що не одержує вкрай потрібних припасів зі столиці. Хоча ми не допустили загального повстання, вони однаково завдали нашому війську чимало клопоту. Ми також вважаємо, що Тюмєнь підтримує зв'язок із цим опором і, можливо, намагається поширювати серед робітників протюмєнську пропаганду. Ми не можемо більше цього терпіти.\n\nНаші ґарнізони вже зіткнулися з цими заколотниками, але ті запекло чинять опір. Поки що нам не вдається обмежити їхню діяльність невеликими районами далеко від центрів населення й складів постачання. Ґарнізони доповідають, що зупинили погіршення становища, проте перемогти всіх партизанів буде важко. Ми мусимо швидко здолати Тюмєнь, перш ніж усе вийде з-під контролю. Не можна допустити, щоб ця війна затягнулася."
 SVR.145.a: "Ми мусимо підготувати наступ, щоб припинити цю війну!"

 SVR.146.t: "Агітація з Тюмєні!"
 SVR.146.desc: "Ми гадали, що в нинішній війні проти революційної загрози весь народ підтримає нас, але, схоже, це не так. Робітники страйкують по всьому Свєрдловску, зупиняючи виробництво. Ми вважаємо, що безпосередньою причиною є тюмєнські партизани. Ці терористи також нападають на ґарнізони й сіють хаос та безлад. Ґарнізони настільки охоплені параноєю, що будь-який звук за стінами казарм зустрічають градом куль. Наші солдати просто зараз залишаються без припасів і набоїв.\n\nОскільки ґарнізони переважно заблоковані, партизани безперешкодно знищують вантажі з припасами та залізниці. Можливо, доведеться зняти частину фронтових військ і відправити в сільську місцевість боротися з цією загрозою. Треба щось зробити, аби відновити порядок і продовжити боротьбу. Нам лишається тільки сподіватися, що Тюмєнь не зможе скористатися нашим тяжким становищем."
 SVR.146.a: "Треба щось робити!"

 SVR.147.t: "Озброєні робітники повстали!"
 SVR.147.desc: "Це катастрофа! Поки триває наша війна з Тюмєнню, повстали численні партизанські підрозділи, які її підтримують. Схоже, ми недооцінили силу тюмєнської діяльности у Свєрдловску. Вони здобули прихильність набагато більшої кількости робітників на заводах і солдатів у війську, ніж ми гадали. Тепер масштабна партизанська діяльність охопила весь Свєрдловск, і наші ґарнізони нічого не можуть із цим удіяти. Наші воєнні зусилля зупинилися, а сільська місцевість занурюється в безлад.\n\nМи майже не маємо відповіді на це становище, адже чимало ґарнізонів було вирізано під час раптових нападів. Надходять навіть повідомлення, що партизани переслідують фронтових солдатів. Усе наше військо можуть відрізати від столиці! Ми мусимо перемогти цих партизанів, поки не запізно!"
 SVR.147.a: "Як ми могли таке допустити?"

 SVR.150.t: "Пропущений будильник"
 SVR.150.desc: "Очі Саші Корнілової розплющилися, коли на них упало сонячне світло. У паніці вона зіскочила з ліжка й майже кинулася до комода, збираючи одяг на сьогодні. Самого погляду на годинник вистачило, щоб приголомшити її: майже полудень! Вона ніколи не могла спати так довго, адже ще змалку замість будильника її будили бомби.\n\nЦя думка змусила Сашу завмерти. У паніці через те, що проспала, вона не помітила дивної тиші в місті. Обережно відчинила вікно й поглянула в небо. Нічого. Звичного гуркоту німецьких бомбардувальників не було, натомість небо залишалося цілком тихим. Звісно, вона чекала, що бомбардувальники повернуться пізніше того дня, але поки насолодиться спокоєм - щойно дістанеться роботи.\n\nМинали години, а бомбардувальники так і не з'являлися. Увечері Саша змогла спокійно пройтися назад до квартири, і прохолодне сибірське повітря заспокоювало біль, набутий за день на заводі. Саша самотньо повечеряла й слухала офіційне радіо, яке повідомляло, що небо над усією територією Свєрдловска тихе. За повідомленнями, уперше за багато років Вільним авіяторам не було причини покидати злітні смуги.\n\nНарешті, лягаючи спати, Саша вперше в житті простягнула руку й завела будильник на старому годиннику."
 SVR.150.a: "Тиха ніч."
 
 SVR.151.t: "Авіятори над військовим округом"
 SVR.151.desc: "Зенітники на пагорбі за Свєрдловском готували батарею до бою. Розвідники із західної околиці міста повідомили про наближення строю німецьких бомбардувальників, і вони хотіли бути готовими.\n\nЗі своїм застарілим спорядженням зенітники добре розуміли, що навряд чи зможуть відчутно завадити бомбардувальникам або не дати їм виконати місію терору та смерти. Але так само добре вони розуміли, що мусять спробувати. Що мусять завдати удару у відповідь ненависному німцеві будь-яким можливим способом і тим самим полегшити відчай, який тепер охопив російську свідомість.\n\nКоли стрій з'явився в полі зору - великі чорні овали високо в небі, - головний навідник визначив відстань, наскільки міг, і приготувався відкрити вогонь. Та саме цієї миті сержант схопив його за руку й указав у небо. З хмар виринув рій дрібніших цяток, що накинувся на стрій бомбардувальників, перш ніж той устиг ущільнитися. Кожен росіянин в Окрузі знав, що це означає, і молився про це скільки міг, часто марно. Але цього разу їх почули. Авіятори прибули.\n\nЗенітники знали, що попри це мали б стріляти, адже авіятори не входили до командної структури Округу, але не стали. Ніхто не наважився б ризикувати влучити в одного з авіяторів високо в небі, і хоча технічно це було порушенням наказу, вони знали, що офіцери заплющать на це очі, адже відчували те саме, що й зенітники. Те саме, що й кожен справжній росіянин.\n\nКоли кілька бомбардувальників потягли за собою шлейфи диму й полум'я, зенітники дружно закричали від радости. Перемогу, хоч і крихітну, було здобуто. А легенда про авіяторів продовжувала зростати."
 SVR.151.a: "Якби ж вони літали за Округ."

 #Regional events
 sverdreg.1.t: "Стан округу"
 sverdreg.1.desc: "Павєл Батов сидів у своєму кабінеті, радий, що нарешті запанували тиша і спокій. За останні кілька років багато що змінилося: він пройшов шлях від генерала до маршала всього Уральського військового округу. А разом із новими обов'язками постали й нові виклики.\n\nОб'єднати регіон, який ціле десятиліття залишався розділеним, було нелегко. Управління територією, уп'ятеро більшою за ту, яку раніше контролював військовий округ, стало справжнім випробуванням для гарнізонів Округу та влади Батова. Та це не становило й половини всіх його клопотів. Управління було одним, а інтеграція земель, якими правили різні воєначальники з дуже відмінними від наших ідеологіями, - зовсім іншим. Батов розумів: перш ніж Західний Сибір справді можна буде назвати єдиним, доведеться докласти чимало праці. Поряд зі складною політичною ситуацією він мусив долати й наслідки зруйнованої економіки. Безперервні війни останнього десятиліття спустошили Західний Сибір. Щоб наша економіка бодай могла зрівнятися з економіками сусідів-суперників, у відбудову доведеться вкласти величезні кошти.\n\nДо всіх проблем, породжених об'єднанням Західного Сибіру, додалося й те, що демократичний рух на чолі з Борісом Єльциним здобував дедалі більшу підтримку. У міру стабілізації регіону населення почне схилятися до демократичнішого уряду, і, якщо Батов захоче перейти до демократії або легітимізувати свою владу, можливо, доведеться провести вибори.\n\nНарешті, смерть маршала Рокоссовского поклала величезний тягар на самого Батова. Йому належало, спираючись на спадщину Рокоссовского, взяти Західний Сибір під контроль і зміцнити Округ настільки, щоб урешті відвоювати всю Росію. Якщо Батов хотів стати другим великим маршалом, йому треба було зробити дуже багато, але з чогось належало почати."
 sverdreg.1.a: "Спадщина маршала тепер у його руках."
 
 sverdreg.2.t: "Захист народу"
 sverdreg.2.desc: "Маршал Батов стояв біля мікрофона, готовий звернутися до всього Уральського військового округу. Отримавши сигнал починати, він прокашлявся.\n\n"Громадяни Округу, я, маршал Батов, маю зробити дуже важливу заяву. Відтоді як наша армія взяла під контроль увесь Західний Сибір, партизани й учасники опору не припиняють нападати на наші гарнізони, що підтримують закон у ці хаотичні часи. Порядок необхідно зберегти, а зробити це можна лише військовим правлінням. Тому я оголошую: армія й надалі утримуватиме щойно повернені території, а воєнний стан діятиме на всій території Округу до окремого розпорядження."\n\n"Я знаю, що багато хто з вас прагне ширших свобод, однак лише наші збройні сили здатні вас захистити. Бандити й партизани становитимуть загрозу, доки військові з ними не покінчать, а доти армія залишатиметься вартовою народу. Я і кожен генерал цього Округу обіцяємо зробити все можливе, щоб уберегти вас і ваші родини. Від вас я прошу лише одного - цілковито виконувати ці накази."\n\n"Пам'ятайте: доля Росії в руках усіх нас. Ми не вороги й не бажаємо розчавити вас чоботом авторитаризму. Ці накази мають не зашкодити вам, а захистити вас. Я теж хотів би, щоб ми жили у вільніші часи, але нинішні обставини цього не дозволяють. Дякую за розуміння.""
 sverdreg.2.a: "Безпека - наш найвищий пріоритет."
 
 sverdreg.3.t: "Суд над Лазарем Каґановічем"
 sverdreg.3.desc: "Лазар Каґановіч повільно ввійшов до зали суду під охороною двох кремезних солдатів, озброєних значно важче, ніж, мабуть, було потрібно. Він сів на маленький дерев'яний стілець, навмисне зроблений незручним.\n\nВійськовий суддя похмуро дивився згори на старого, який здавався таким дрібним і немічним. "Лазарю Каґановічу, суд завершив розгляд вашої справи. Після наради вас засуджено до страти за зраду Росії та її народу."\n\nСтрата!?! Зрада!?! Каґановіч уже не міг стримати люті! Він не був зрадником! Схопившись зі стільця й сердито тицьнувши в суддю зморшкуватим пальцем, він вибухнув тирадою: "Ні, це ВИ зрадники! Ви служили в моїй армії, ви билися за соціялізм і Батьківщину! А тепер погляньте на себе! Ви не більш ніж кляті фашисти й брудні капіталісти! Треба було мені провести чистку проти Рокоссовского, коли ще була нагода!"\n\n"СІДЬТЕ, КАҐАНОВІЧУ! - гаркнув суддя. - Ми ухвалили рішення, і воно остаточне! Лише ви винні в тому, що повели Західний Сибір цим темним шляхом. Ви самі себе згубили."\n\n"Ще побачите, - гірко відповів Каґановіч. - Революція переможе так чи інакше. Незабаром упадуть усі, хто стоїть на шляху соціялізму. Якщо мені не судилося це побачити - нехай."\n\n"Відведіть його до камери.""
 sverdreg.3.a: "Революцію припинено чи лише відкладено?"
 
 sverdreg.4.t: "Суд над Дмітрієм Язовим"
 sverdreg.4.desc: "Дмітрія Язова жбурнули на стілець у залі суду. Із закривавленим носом і підбитим оком він поглянув на суддю. "Ось нарешті вбивця постав переді мною, щоб зізнатися у своїх мерзенних злочинах, - похмуро сказав військовий суддя. - Дмітрію Язове, ми з колегами завершили нараду й одностайно засудили вас до смерти. Сьогодні ввечері вас розстріляють. Охороно, заберіть цього нікчему з моїх очей." Останню фразу суддя вимовив поспіхом, бо не хотів більше дивитися на Язова.\n\n"Невже не бажаєте почути мої останні слова?" - спитав Язов, байдужий до своєї близької смерти. Зрештою, нічого іншого він і не очікував.\n\n"Гаразд, яку ще дурницю ви хочете сказати?" - без жодного зацікавлення спитав суддя.\n\n"Я лише хотів поцікавитися, чи готові ви зустріти прийдешні випробування, - холодно промовив Язов. - Ви знищили свій єдиний шанс на перемогу, генерале. Знищивши Чорну Лігу, ви разом із нею знищили всі шанси Росії. Лише я міг провести Росію крізь прийдешню бурю, крізь саме Велике Випробування! Тепер Росію чекають лише поразка й роз'єднаність. Невже ви справді гадаєте, що держава бодай із подобою демократії зможе зберегти єдність і силу супроти такого ворога, як Німеччина?"\n\nКоли Язов закінчив, суддя на мить замовк і похитав головою. "Ні... ні... це ви помиляєтеся. Невже ви не бачите в собі вбивці? Звіра, що залишив темну пляму на Росії? Якби ви очолили нашу велику державу, то знищили б її разом із Німеччиною."\n\n"Можливо, - Язов почав усміхатися. - Зате Росія нарешті була б помщена."\n\n"Заберіть його!" - наказав суддя. Коли охоронці востаннє потягли Язова геть, він зазирнув у темні очі Дмітрія Язова - і не забув їх до кінця життя."
 sverdreg.4.a: "Одного чудовиська нарешті знищено."
 
 sverdreg.5.t: "Повернення до нормального життя"
 sverdreg.5.desc: "Свєрдловск став новим містом після того, як військові відновили порядок у всьому Західному Сибіру й на Уралі. Разом із містом змінилося й життя Катерини. Колись усе тут контролювала й розписувала армія, а тепер місто стало вільнішим, наче визволеним. Коли з комуністичною загрозою та Чорною Лігою було покінчено, військовим уже не доводилося керувати кожною миттю життя громадян. Для Катерини це означало все.\n\nЗа часів Совєцького Союзу, коли Катерина була ще маленькою дівчинкою, вона теж жила у Свєрдловску, вільна й без жодних обов'язків. Та після розпаду життя стало тяжким. Вона годинами працювала за мізерні порції їжі для дітей, а військові навіть визначали, коли їй дозволялося виходити з дому. Вона ледве це витримувала.\n\nТепер, коли воєнний стан і комендантська година лишилися в минулому, Катерина нарешті могла жити повним життям. Вона навіть могла виходити вночі й дивитися на зорі! Військові нікуди не зникли, але все явно змінилося на краще. Можливо, попереду на неї чекало ще більше свобод."
 sverdreg.5.a: "Вільний Свєрдловск, вільна жінка."
 
 sverdreg.6.t: "Герой війни"
 sverdreg.6.desc: "Старий Пьотр - так його всі називали. Якби хтось описував старого, загартованого ветерана, то описав би саме Пьотра. Він служив у царській армії та воював у громадянській війні, де втратив ногу, хоча дехто казав, що до того встиг убити сотню людей. А ще ніхто краще за нього не міг розповісти про армію - саме це й збирався розпитати Мартін. Юнакові було лише вісімнадцять, але можна було б подумати, що він знає про війну більше. Мартін хотів воювати, та не хотів бути звичайним солдатом. Він хотів стати героєм, як Пьотр, убивати німців і варварів.\n\nСтарий ветеран здебільшого сидів у кріслі-гойдалці й дивився, як люди проходять повз його стару садибу. Коли Мартін підійшов, ветеран розплющив очі й хрипким, але чітким голосом мовив: "Чого тобі, хлопче? Я намагаюся подрімати."\n\n"Пьотре, мене звати Мартін, я йду до армії. Хочу навчитися битися й убивати, як ви."\n\nСтарий повернувся до нього: "Що ж, хлопче, ось тобі перший крок. Не йди. Армія не для таких, як ти. Вертайся додому."\n\nХлопець витріщив очі. "Що ви таке кажете? Ви ж були солдатом, героєм! Люди кажуть, ви вбили сотню ворожих солдатів! Я достатньо сильний, щоб воювати!"\n\n"Річ не в тому, чи достатньо ти сильний, хлопче! - закричав Пьотр. - Якщо хочеш бути героєм, не йди до армії. Там ти станеш лише вбивцею або мерцем. Повір мені: якщо хочеш бути героєм - рятуй людей, а не вбивай їх."\n\nМартін пішов, спантеличений дужче, ніж будь-коли. Пьотр мав рацію чи був лише сердитим старим? Невже всі солдати насправді були просто вбивцями?"
 sverdreg.6.a: "На війні немає героїв."
 
 sverdreg.7.t: "Маршал і його Рада"
 sverdreg.7.desc: "Стіл для нарад стояв порожній, а генерали Ради мовчки чекали на маршала. Минуло кілька хвилин, і до кімнати ввійшов маршал Батов, сівши на чолі столу. "Ця нарада буде зовсім іншою, - сказав він, обводячи поглядом решту генералів. - Замість нинішніх проблем я хотів би поглянути в майбутнє."\n\n"Відтоді як ми вперше об'єднали Західний Сибір, наша політична ситуація змінилася, - продовжив Батов. - Із залишками ворожих урядів у Тюмєні й Омску покінчено, а нашу владу на всьому Уралі стабілізовано. По всьому військовому округу стало спокійніше, і наше правління, схоже, убезпечене. Отже, коли політичні цілі виконано, на чому нам зосередитися далі?"\n\nПершим заговорив генерал Алєксєй Жадов. "Ми повинні готуватися до війни. Сусідні суперники не чекатимуть, доки ми будемо готові завдати удару. Треба збільшити армію, подвоїти військове виробництво й підготувати інфраструктуру постачання до будь-якого вторгнення. Щоб возз'єднати Росію, доведеться багато воювати, тож час починати вже тепер."\n\n"Дякую, Алєксєю, - сказав маршал Батов. - Справді, ми мусимо спрямувати значну частину зусиль на возз'єднання Росії. Проте не можна нехтувати становищем нашого народу. Не всі сили можна кинути на армію: перш ніж Росію буде об'єднано, слід забезпечити процвітання цивільної економіки й подолати бідність. А доти чекатимемо нагоди завдати удару. Коли час настане, ми будемо готові.""
 sverdreg.7.a: "Єдина Росія наближається."
 
 sverdreg.8.t: "Підготовка до відбудови"
 sverdreg.8.desc: "Об'єднання Західного Сибіру коштувало дорого: під час боїв фабрики, дороги й залізниці було тяжко пошкоджено або знищено. Тепер, коли ворогів переможено, а внутрішні проблеми подолано, ми нарешті можемо готуватися до відбудови.\n\nРуйнування не оминули нікого: міста знищено, люди голодують. Економіка лежить у руїнах і ледве працює, безробіття шириться. Школи стоять покинуті, бо на освіту немає коштів. Країною панує бартер, а справжніх грошей в обігу майже немає.\n\nЩоб підготувати відбудову Округу, [SVR.GetLeader] наказав розпочати будівельні роботи по всьому Західному Сибіру. Відновивши осердя наших міст, ми зможемо ще більше посилити відбудову. Сподіваємося, що зрештою Західний Сибір зміниться до невпізнання, а ми наблизимося до відновлення."
 sverdreg.8.a: "Маємо надію."
 
 sverdreg.9.t: "Нафта в Сурґуті!"
 sverdreg.9.desc: "Сьогодні нашому міністрові економіки Фарману Салманову пощастило. Під час геологічних робіт у Сурґуті він відкрив поклад нафти, більший за всі досі знайдені в цьому регіоні! Нафта надзвичайно важлива для нас: вона живить наші танки й вантажівки. А з такими запасами ми, можливо, зможемо ще й торгувати нею, укладаючи вигідні угоди з іноземними державами.\n\nТепер слід зосередитися на спорудженні сховищ для всієї цієї нафти, щоб жодна крапля не пропала. Також знадобляться додаткові зусилля, аби видобути її всю й повністю скористатися родовищем. Якщо нам це вдасться, про нестачу пального можна буде забути назавжди!"
 sverdreg.9.a: ""Я знайшов нафту. Оце й усе.""
 
 sverdreg.10.t: "Провести інвентаризацію"
 sverdreg.10.desc: "Інтендант ішов складом, оглядаючи все конфісковане спорядження, захоплене у ворожих солдатів під час об'єднання. Гвинтівки, артилерія, навіть танки - тепер усе це було в його руках. Він міркував, що 3-й армії воно неабияк знадобиться.\n\nТепер він перейшов до пошкоджених речей. Танк, підбитий протитанковою гарматою, але ще придатний до ремонту. Вантажівка - ось цій добряче дісталося. Її корпус укривали кульові отвори, і здавалося, що куль там більше, ніж самої вантажівки. Усередині на сидіннях лишилися плями крови, що злилися в червоні патьоки. Мабуть, із цією доведеться попрацювати довше, подумав він.\n\nБої були жорстокими - він бачив це на власні очі. Тепер, коли все скінчилося, йому лишалося збирати уламки. Тисячі уламків: рятувати те, що ще можна врятувати, і викидати решту. Та цією старою зброєю воюватимуть у нових війнах. Сподіваймося, крови на ній буде менше. Її важко відмивати."
 sverdreg.10.a: "Що більше зброї, то краще."
 
 sverdreg.11.t: "Справи йдуть угору"
 sverdreg.11.desc: "Схоже, всі наші зусилля з поліпшення економіки Округу нарешті дають плоди. Економіка переживає величезне зростання, а Західний Сибір стає дедалі заможнішим. Якість життя також поліпшилася: люди мають більше житла й кращу роботу. Для освіти населення збудовано школи. А найкраще те, що завдяки зростанню економіки повсюди виникають нові підприємства.\n\nЦе корисно не лише людям, а й нам. Завдяки міцнішій економіці наші фабрики знову відкриваються, ба навіть будуються нові. Наслідки індустріялізації вже стають помітними, і ми виробляємо більше товарів, ніж будь-коли.\n\nПоліпшується й інфраструктура: прокладено нові дороги, відновлюється електропостачання, а залізниці дають змогу швидко й легко перевозити товари.\n\nСильна сучасна економіка вже близько, але, щоб російська економіка розкрила весь свій потенціял, спочатку треба об'єднати Росію. А доти ми закладатимемо підвалини господарства, здатного змагатися з найбільшими наддержавами!"
 sverdreg.11.a: "Прощавай, бідносте!"
 
 sverdreg.12.t: "Перешкоди війни"
 sverdreg.12.desc: "Чоловіки стояли в шерензі перед смугою перешкод. Усі вони були новобранцями, готовими вступити до 3-ї армії та захищати військовий округ. Інструктор дивився кожному в очі й щоразу, навчаючи нову групу, бачив ті самі обличчя. Здавалося, ще вчора він муштрував того бідолашного слабосилого Кіріла, не даючи спуску, доки той нарешті не став солдатом. Більше він його не бачив, але Кутузов вірив, що підготував хлопця досить добре, аби той пережив війни.\n\nТа він прийшов не жаліти цих хлопчаків, а навчати їх! "Гаразд, хлопці, слухайте сюди! - гаркнув інструктор. Він був немолодий, але голос досі мав могутній. - Ми вже знайомі, та якщо хтось із вас, йолопів, устиг забути моє ім'я, то я сержант Кутузов. Сьогодні ви тренуватимете не швидкість, а рішучість. Це одна з найскладніших смуг перешкод в Окрузі. Височенні стіни, колючий дріт і глибоке багно заважатимуть вам дістатися фінішу. Але ви не здастеся. Навчання не скінчиться, доки кожен із вас не дійде до кінця."\n\nКутузов і далі ходив перед строєм, дивлячись кожному просто в очі. "Щоб перемогти в бою, солдатові замало швидкости, сили чи спритности. Йому потрібна рішучість перемогти. Якщо людина не налаштована здолати ворога, вона або програє, або загине. Щоб перемогти, ви мусите поєднати вміння з рішучістю. У сучасній війні здаватися не можна. Якщо здастеся на полі бою, цей Округ і все, за що ми досі боролися, втратять сенс. Зрозуміли?"\n\n"Так точно!" - хором вигукнули чоловіки.\n\n"То чого чекаєте? ВПЕРЕД!" - закричав сержант, дивлячись, як хлопці кинулися на смугу перешкод, кожен прагнучи першим дістатися фінішу."
 sverdreg.12.a: "Рішучість - половина перемоги."
 
 sverdreg.13.t: "Війни минулі, теперішні й майбутні"
 sverdreg.13.desc: "Фьодор біг стежкою, насолоджуючись свіжим повітрям і теплом від фізичних вправ. Бути солдатом 3-ї армії було важко: тренування тривали майже шістнадцять годин на день. Фьодор мріяв працювати у власному полі, мати господарство й утекти від смертельних битв і суворих офіцерів. Він хотів сам визначати свій розклад і жити в спокійному місці.\n\nФьодор згадав молодість, коли щойно вступив до 3-ї армії. Він воював у багатьох минулих війнах: пережив крах Західносибірської народної республіки, боровся з бандитами в добу воєначальників і долучився до кампанії за возз'єднання Західного Сибіру.\n\nНевже він служив лише заради бою й гострих відчуттів? Прийдешні війни будуть не менш, а то й більш жорстокими. Що заважало йому просто піти?\n\nТа тоді він згадав головний урок армії: 3-тя армія завжди мала захищати народ. Якщо він здасться й стане фермером, чи не зрадить родини, які присягався боронити?\n\nЗдавалося, Росія ще десятиліттями грузнутиме в боях. Навколо чекали нагоди вороги 3-ї армії. Фьодор не міг покинути людей. Росії було потрібно, щоб він продовжував боротьбу."
 sverdreg.13.a: "Захищати народ - обов'язок 3-ї армії."
 
 sverdreg.14.t: "Аси-авіятори"
 sverdreg.14.desc: "Літак мчав над безплідною крижаною тундрою, вправно слухаючись пілотки й підхоплюючи повітряну течію над озером. Євдокія Бочарова вже багато років не бачила німецьких літаків. Тепер загроза надходила із Західної Росії та Центрального Сибіру. Вона ще не встигла повоювати як слід, але була готова захищати Західний Сибір і військовий округ.\n\nТепер, коли знову існував центральний уряд, усе змінилося. Вільні авіятори вже не могли робити все, що заманеться, й мусили виконувати накази наземного командування. У певному сенсі все стало як за старих часів Совєцького Союзу.\n\nПродовжуючи політ, вона повернула до Уральських гір, перевіряючи, чи не перетнули кордон розвідувальні патрулі із Західної Росії. Євдокії було байдуже, хто править унизу. Там, у небі, її Вільні авіятори мали обов'язок - захищати Росію в повітрі."
 sverdreg.14.a: "Вільні авіятори назавжди!"
 
 sverdreg.15.t: "Управління закордонних справ"
 sverdreg.15.desc: "Після об'єднання Західного Сибіру нашою новою державою зацікавилося чимало іноземних сил. Нам було потрібне місце для відносин з іншими державами, і сьогодні [SVR.GetLeader] оголосив про створення у Свєрдловску Відомства закордонних справ. Багатьом країнам поза німецькою сферою подобається сильна й незалежна Росія, і дехто може погодитися надати нам обмежену допомогу та визнання. До того ж ми маємо ресурси, потрібні іншим державам, тож Управління закордонних справ також провадитиме торгівлю.\n\nОднак наші суперники по той бік кордонів теж прагнуть відносин із цими іноземними державами. Можливо, за допомогу доведеться змагатися, проте ми впевнені, що зможемо налагодити дієві відносини з усіма, хто виявляє до нас інтерес."
 sverdreg.15.a: "Давно час знайти друзів."
 
 sverdreg.16.t: "Контакти в Західному Сибіру"
 sverdreg.16.desc: "Ми отримали цікаву пропозицію від Відомства закордонних справ Свєрдловска в Західному Сибіру. Їхній уряд дуже схожий на наш і, схоже, прагне відкритіших відносин. Споріднений уряд у Західному Сибіру може принести нам чималу користь.\n\nВони просять визнати їх законним урядом Західного Сибіру. Це важливий крок до відкриття відносин, який може дещо розлютити уряди-суперники, однак не завдасть непоправної шкоди нашим відносинам з іншими російськими урядами, що також можуть нас цікавити.\n\nЗахідний Сибір також просить про торговельні відносини. Вони мають чимало ресурсів, особливо нафти, які можуть бути дуже цінними для нас. Ми теж маємо багато корисного для них, тож причин відмовлятися немає."
 sverdreg.16.a: "Схоже на добру угоду. Перекажіть нашу згоду й погляньмо, що отримаємо."
 
 sverdreg.17.t: "Відповідь США"
 sverdreg.17.desc: "Ми отримали повідомлення від американців: вони прийняли нашу пропозицію! Вони визнали нашу владу над Західним Сибіром і готові торгувати, тож у нас нарешті з'явився надійний торговельний партнер. Торгувати було важко через обмежений доступ до зовнішнього світу й сусідів, яких аж ніяк не назвеш прихильними до торгівлі з нами. Сподіваємося, тепер ми дістанемо більше ресурсів для війська й товарів для цивільного населення, а наше становище в очах американців поліпшиться. Можливо, в майбутньому ми ще більше поглибимо зв'язки?"
 sverdreg.17.a: "Дякуємо, Америко!"
 
 sverdreg.18.t: "Нове консульство"
 sverdreg.18.desc: "До нас знову звернувся уряд Західного Сибіру, цього разу просячи дозволу відкрити консульство у Вашинґтоні. Це ще більше зблизить наші країни й допоможе поліпшити відносини, проте може створити враження, що ми обрали сторону в Росії. Якщо ми хочемо зберегти нейтралітет або виявити більшу прихильність до іншого уряду, варто відмовити.\n\nУтім, консульство ще більше сприятиме торгівлі між нашими державами, даючи нам доступ до більшої кількости нафти й посилюючи наш вплив у регіоні. Його відкриття, безперечно, принесе нам користь. Проте надмірне зближення із західносибірцями завжди матиме наслідки."
 sverdreg.18.a: "Дозволити західносибірцям відкрити консульство."
 
 sverdreg.19.t: "Дипломатичний успіх!"
 sverdreg.19.desc: "Добрі новини: американці погодилися на відкриття консульства! Це ще більше зближує наші держави й відкриває перед нами нові дипломатичні можливості. Представництво у Вашинґтоні створює між нами міцний зв'язок.\n\nКонсульство також сприятиме торгівлі між нашими країнами: американці дістануть ширший доступ до наших ресурсів, а ми - до їхніх. Схоже, ця угода вигідна обом сторонам, тож сподіваємося, що наші відносини лише розвиватимуться."
 sverdreg.19.a: "Час перебиратися до Вашинґтона!"
 
 sverdreg.20.t: "Дипломатична невдача!"
 sverdreg.20.desc: "Від американців надійшли погані новини: вони відмовилися відкрити наше консульство. У відповіді сказано, що це було б надто далекосяжним кроком у дипломатичних відносинах і що вони хочуть лишатися нейтральнішими в російській політиці. Ми розуміємо ці міркування, але відмова однаково стала ударом для уряду й дипломатів, які сподівалися поглибити відносини з американцями.\n\nУтім, ми зберігаємо чудові торговельні відносини, а дипломатичні канали не закрито цілковито. Американці й далі визнаватимуть нашу владу над Західним Сибіром і підтримуватимуть нашу економіку. Це ж не означає, що вони знайшли когось кращого за нас, правда?"
 sverdreg.20.a: "Чому вони відмовили?"
 
 sverdreg.21.t: "Вигідна пропозиція"
 sverdreg.21.desc: "Від початку об'єднання торгівля завжди була для нас складною справою. Відсутність доступних портів і сусідів, охочих торгувати, змушує докладати чималих зусиль навіть для простих угод, які не завжди вигідні нам. Вартість багатьох важливих товарів для цивільної та військової економіки й далі зростає, а імпортуємо ми значно більше, ніж експортуємо.\n\nЄвґєній Драґунов, схоже, помітив наші труднощі й готовий скористатися зв'язками, щоб відкрити для нас нові можливості. До входження в наш уряд він очолював державу воєначальника Златоуст і був першокласним ділком, який торгував зброєю на пустках доби воєначальників. Завдяки цим зв'язкам Драґунов зможе дістатися близьких і далеких країв, а його харизма неабияк допоможе на торговельних переговорах.\n\nОкрім використання своїх контактів, Драґунов великодушно запропонував служити в нашому уряді. Такий чоловік міг би стати спритним міністром. Чому б йому не довіряти?"
 sverdreg.21.a: "Прийняти пропозицію, але не підпускати його до уряду."
 sverdreg.21.b: "Погодитися й запропонувати йому посаду."
 
 sverdreg.22.t: "Помилування за послугу"
 sverdreg.22.desc: "Від початку об'єднання торгівля завжди була для нас складною справою. Відсутність доступних портів і сусідів, охочих торгувати, змушує докладати чималих зусиль навіть для простих угод, які не завжди вигідні нам. Вартість багатьох важливих товарів для цивільної та військової економіки й далі зростає, а імпортуємо ми значно більше, ніж експортуємо.\n\nДехто з міністрів запропонував розв'язання. Від часу завоювання держави воєначальника Златоуст її лідер Євґєній Драґунов сидить у нашій в'язниці. У минулому він припустився помилок, але помилування в обмін на його зв'язки може бути дуже корисним. Зрештою, продавати зброю нашим ворогам він уже не зможе.\n\nУтім, багато його контактів утрачено або розсіяно, тож, на жаль, скористатися всіма не вийде. Та навіть так Драґунов може стати нам у пригоді, а нині ми беремо все, що можемо. Якщо це чоловік, який колись зрадив нашу країну, - нехай."
 sverdreg.22.a: "Він іще може стати в пригоді."
 
 sverdreg.23.t: "Аташе"
 sverdreg.23.desc: "На базі армії США кипіла робота: солдати готувалися до навчань. Роман Сідоров, який прибув до Америки військовим аташе, радів нагоді побачити армію в дії. Це була одна з численних баз довкола Вашинґтона, але особлива: одна з небагатьох, де щомісяця проводили загальні навчання. "Ви, мабуть, сержант Роман Сідоров, - промовив чоловік у великому зеленому кашкеті, простягаючи руку. - Я полковник Ґрейсон Ґарнс, командир бази. Радий вашому візитові."\n\n"Приємно познайомитися, полковнику." Роман на мить замовк: він знав основи англійської, але вільно не розмовляв. "Мені дуже цікаво побачити сьогоднішні навчання. Ви не заперечуєте, якщо я подивлюся?"\n\n"Звісно, можете дивитися - це ж ваша робота, хіба ні? - відповів Ґарнс. - Ідіть за мною. За кілька ярдів звідси є чудовий оглядовий майданчик. Певен, сьогоднішні навчання вам сподобаються."\n\nРоман разом із командиром піднявся на майданчик, і за кілька хвилин почалося дійство. Базу поділили на червону й синю команди, а армія відпрацьовувала танкову тактику та маневрену війну. Роман дивився, як американські танки мчать полями, оминають перешкоди й безперервно стріляють. Непереможні, подумав він. Цю тактику треба було привезти до Свєрдловска: танкова війна в Росії буде неминучою. "Подобається, Романе? - спитав командир. - Ці танки щойно розроблено й знято з виробничих ліній. Саме їх першими побачать німці чи японці, якщо битимуться з армією США."\n\n"У Росії в нас точно немає нічого подібного. Навіть сама тактика для нас нова! Певен, моє командування вдома буде дуже задоволене тим, чого я навчився в Америці."\n\n"Радий чути. Тільки дорогою додому не впустіть ці нотатки до рук німців, гаразд?""
 sverdreg.23.a: "Ця тактика неодмінно стане нам у пригоді!"
 
 sverdreg.24.t: "Випадкова зустріч"
 sverdreg.24.desc: "Переконавшись, що двері за ним замкнено, Боріс Єльцин вальяжно ввійшов до розкішної вбиральні. Щоб утекти з нудної торговельної наради, він завжди тримав про запас пляшку горілки. На жаль, приміщення було не порожнє: біля умивальника мив руки помічник. Вони зустрілися поглядами, і помічник глянув на пляшку в руці Єльцина. "Е-е, гм..." - затинався Боріс, майже не знаючи англійської. Не вигадавши кращого виходу, він знизав плечима, усміхнувся й дістав другу чарку.\n\nПомічник подивився на чарку, наче міркуючи, чи приймати пропозицію. Єльцин налив горілку; той нарешті зважився, підняв чарку й усміхнувся. "Будьмо", - сказав він і випив.\n\nПісля кількох чарок обидва повернулися на конференцію, де помічник сів поруч із сенатором, який представляв американців. Нарешті принесли потрібні папери, тож настав час підписати з десяток сторінок перед Єльциним. Закінчуючи четверту, він почув, як сенатор щось сказав англійською перекладачеві. "Сенатор Фулбрайт питає, скільки чарок випив його помічник, перш ніж здався, пане Єльцине."\n\nПочервонівши, Боріс ніяково відповів перекладачеві: "Дві, та й ті були не по вінця."\n\nСенатор розреготався й знову звернувся до перекладача. "Наступного разу, коли підете випити з моїм хлопцем Біллом Клінтоном, нехай змусить мене пишатися й вип'є чотири, як справжній чоловік.""
 sverdreg.24.a: ""Неодмінно, але наступного разу не у вбиральні.""
 
 sverdreg.25.t: "Можливості в Західному Сибіру"
 sverdreg.25.desc: "Сьогодні дипломати передали нам пропозицію з Росії. Уряд Західного Сибіру звернувся по торгівлю та визнання, очевидно налагоджуючи контакти з багатьма державами поза німецькою сферою. Їхнє визнання неодмінно розлютить Німеччину та інші російські уряди, але ця угода може багато нам дати.\n\nВони мають потрібні нам ресурси, зокрема нафту й природний газ. Хоч більшість нафти ми отримуємо з Близького Сходу, ще один постачальник ніколи не завадить. Ми могли б налагодити співпрацю між нашою нафтовою компанією ENI та їхнім Ґазпромом, щоб до нас надходило якнайбільше нафти. Присутність ENI в Сибіру також дасть нам вплив на їхній нафтовидобуток. Однак торгівля й визнання продемонструють нашу близькість до їхнього уряду, тому, якщо ми прагнемо тісних відносин з іншим російським урядом, можливо, варто почекати."
 sverdreg.25.a: "Звісно, що більше нафти, то краще!"
 sverdreg.25.b: "Вони нас не цікавлять."
 
 sverdreg.26.t: "Торгівля із Західним Сибіром"
 sverdreg.26.desc: "Торгівля із Західним Сибіром почалася, тож тепер до країни надходитиме більше сировини, ніж будь-коли. Західносибірський уряд уже запевнив, що нафту відправлено й ми отримаємо її вчасно. Торгівля неодмінно піде на користь обом сторонам: ми здобудемо партнера в Росії, а вони - економічну перевагу над сусідами.\n\nЩо більше нафти, то краще: вона живитиме автомобілі громадян і танки, вантажівки та літаки нашої армії. Сподіваймося, цей потік товарів не вичерпається й у майбутньому."
 sverdreg.26.a: "Росія тепер напевно стабільніша, правда?"
 
 sverdreg.27.t: "Італія нас приймає!"
 sverdreg.27.desc: "Італія відповіла на наше повідомлення й погодилася на пропозицію! Незабаром між нашими державами почнеться торгівля, а Італія вже визнала нашу країну на світовій арені. Промисловість готується експортувати туди нафту, а наш Ґазпром співпрацюватиме з ENI. Сподіваємося, це партнерство допоможе подолати труднощі торгівлі з далекою Італією, хоча вже постає питання, як саме туди доправляти товари.\n\nОднак угода передбачає не лише вільну торгівлю. Нам доведеться впустити ENI до країни для нагляду за нафтовидобутком. Це може дати італійцям більше влади над нашими родовищами, ніж нам хотілося б, але воно того варте. Нам потрібно якнайбільше торговельних партнерів."
 sverdreg.27.a: "Італійський нафтовий досвід на нашому боці!"
 
 sverdreg.28.t: "Італія нам відмовляє!"
 sverdreg.28.desc: "Ми отримали відповідь з Італії, і вона виявилася не такою, як ми чекали. На жаль, Італія відхилила запит про торгівлю й не визнала наш уряд. Ми не знаємо, чи їх більше цікавлять відносини з іншим російським урядом, чи вони взагалі не хочуть вести справи в Росії, але це прикра втрата для нашого дипломатичного становища й торговельних можливостей. Можливо, іншого дня вони охочіше торгуватимуть?"
 sverdreg.28.a: "Прикро, але не катастрофа."

 sverdreg.29.t: "Полювання на бандитів"
 sverdreg.29.desc: "Сховище бандитів сповнилося стріляниною: загін Захара оточив останнього злочинця, який не бажав здаватися без бою. Ця банда давно дошкуляла Округу, грабуючи села й господарства по всій його території. Війська Захара вистежували її місяцями. Та в бою бандити не могли зрівнятися з 3-ю армією.\n\nВийшовши з укриття, Захар знову відкрив вогонь. Влучив! Бандит упав, забризкавши стіну кров'ю. Це був останній. Більшість здалася відразу, не бажаючи битися з краще озброєною 3-ю армією. Ті, хто опирався, дістали по заслузі.\n\nНаказавши прибрати тіла й винести поранених, Захар востаннє оглянув кімнати, перевіряючи, чи ніхто не сховався. Бандитів не лишилося, зате знайшлося чимало коштовностей. Прикраси, гроші, дорогі вази й навіть кілька картин валялися по кімнатах. Та один предмет особливо привернув його увагу - лялька, мабуть, маленької дівчинки. Невже бандити опустилися настільки, щоб забрати в дитини ляльку?\n\nЗахар знав, що його люди залюбки залишили б усе собі, але обов'язок 3-ї армії - служити російському народові. Для когось ці речі, певно, були єдиними скарбами. Захар за всяку ціну поверне їх законним власникам, а надто ту ляльку."
 sverdreg.29.a: "3-тя армія існує, щоб захищати народ, а не грабувати його."

 sverdreg.30.t: "Результати виборів [GetYear] року"
 sverdreg.30.desc: "Виборча кампанія закінчилася, і сьогодні починається голосування! Дільниці відкрито в кожному місті Західного Сибіру, а після підрахунку голосів регіон нарешті матиме незаперечного лідера!\n\nДехто побоювався, що Батов скористається владою й поверне вибори на свою користь. Однак голосування всюди видається доволі чесним, принаймні за мірками молодої демократії. Хоча дехто скаржиться, що уряд зробив замало для справжньої демократії, обидва кандидати мають шанс. Неможливо передбачити, хто переможе.\n\nУтім, навіть перемога Єльцина не означатиме, що військові просто віддадуть країну. Батов і його армія намагатимуться зберегти якнайбільший вплив у Західному Сибіру незалежно від результату."
 sverdreg.30.a: "Принаймні вибори є."

 sverdreg.31.t: "3-тя армія йде вперед"
 sverdreg.31.desc: "Стоячи на балконі у Свєрдловску й споглядаючи величезний військовий парад унизу, маршал Павєл Батов із гіркотою думав, що його командир, наставник і друг Константін Рокоссовскій не може стояти поруч і бачити цю процесію.\n\nСолдати колишньої 3-ї армії, яку Рокоссовскій провів крізь найтемніші дні й перетворив на опору нинішньої влади над Західним Сибіром, були неперевершені. Вони зберегли дисципліну й порядок, що дали їм змогу стабілізувати первісний Округ і захистити його від ревізіоністів та ультранаціоналістів. Та Батов знав: удосконалювати ще було що.\n\nПопри бездоганний зовнішній вигляд, у струнких шерегах, механізованих колонах і досвідчених повітряних частинах, що з гуркотом пролітали над головою, ховалися застарілі тактики, недостатня підготовка новобранців і проблеми централізації командування. Усе це належало виправити - і буде виправлено. Батов про це подбає.\n\nКоли перед ним ідеальним ешелоном пройшла наступна група піхоти, віддаючи честь, Батов випростався й відповів на вітання. Він знову пошкодував, що старого маршала немає поруч. Але він ушанує друга так, як той цінував би найбільше: перетворить своє військо на найпрофесійнішу, найбоєздатнішу й політично найнадійнішу силу в усій Росії.\n\nІ коли ця армія пройде від Тихого океану до німецького кордону, він знатиме: його працю завершено."
 sverdreg.31.a: "Наше завдання лише почалося."

 sverdreg.32.t: "Загублена душа"
 sverdreg.32.desc: "Стояв ясний, вітряний день в Омску, колишньому темному серці Чорної Ліги. Маршал Павєл Батов разом із почтом стояв перед особливо пишним надгробком, уважно його розглядаючи. "Залиште мене, - тихо сказав він. - Я ненадовго."\n\nКоли супутники відійшли, Батов наблизився до могили й став навколішки перед написом: "ДМІТРІЙ МІХАЙЛОВІЧ КАРБИШЕВ, 1880 - 1963".\n\nСаме ім'я викликало в пам'яті маршала хвилю спогадів. Колись генерала Карбишева він міг назвати товаришем. Під час Великої Вітчизняної війни Батов навіть на мить не припустив би, що така людина здатна підняти зброю проти братів.\n\nІ все ж він лежав тут - жертва власного хибного прагнення зміцнити оборону Росії, навіть ціною душі. Можливо, зрештою саме її він і втратив. Батов відчував дивну суміш смутку й жалю. Він був поруч, коли думки Карбишева звернули в темні краї, і коли старий генерал почав утілювати свої похмурі задуми. Він міг спробувати зупинити його, повернути товариша на правильний шлях, але тепер було запізно.\n\nКарбишев і чудовисько, яке він, можливо несвідомо, створив, були мертві. Батову лишалося тільки сподіватися, що в потойбіччі він нарешті знайшов спокій. Поклавши біля надгробка стару медаль покійного генерала, маршал Батов підвівся й востаннє попрощався з давнім товаришем, який став противником."
 sverdreg.32.a: "Якби ж до цього не дійшло."

 sverdreg.33.t: "На тому березі затоки"
 sverdreg.33.desc: ""Тепер таких уже не вирощують, еге ж, Дімо?" - пробурмотів Кузьма Ґаліцкій, лускаючи насіння з миски. Поруч сидів Дмітрій Лєлюшєнко. Робочий день скінчився, але обом треба було завершити додаткові справи, тож вони опинилися в порожній кімнаті відпочинку й ненадовго відклали папери.\n\n"Авжеж. Коли я був малим, насіння було солонішим, - відповів Лєлюшєнко, набираючи жменю. - Я виріс у Ростові. Там вирощували весь соняшник, знаєш? Тож мимоволі починаєш на ньому знатися. А це зовсім не те насіння, яке я пам'ятаю."\n\nҐаліцкій кліпнув.\n\n"Ти з Ростова?"\n\n"Так, - відповів Лєлюшєнко й теж замовк. - Тільки не кажи, що й ти з Ростова!"\n\n"Взагалі-то я з Таґанроґа, - сказав Ґаліцкій. - Знаєш, невелике місто на тому березі затоки?"\n\n"Справді? У мого батька був співробітник із Таґанроґа. Коли я був малим, він пригощав мене на вихідних", - відповів Лєлюшєнко.\n\n"Та ну? Жартуєш! Мій дядько працював у Ростові. Він їздив поромом і завжди брав із собою зайві цукерки!"\n\nОбидва генерали засміялися, згадуючи дитинство. Та в порожній кімнаті запала неприродна тиша.\n\n"Вони, мабуть, загинули, правда? Мій батько, твій дядько, всі. Краути напевно їх винищили", - після довгої паузи сказав Лєлюшєнко.\n\nЗнову запала тиша, перш ніж Ґаліцкій відповів."
 sverdreg.33.a: ""Ось заради чого ми воюємо, правда?""

 ### Batov events ###
 batov.1.t: "Перемога маршала!"
 batov.1.desc: ""...маршал Павєл Батов та армія, - вигукнув радіодиктор, - здобули перемогу на референдумі!"\n\nБатов із полегшенням вимкнув короткохвильовий приймач і поглянув на місто внизу. Навіть попри нечесні прийоми армії він не був певен, що їм удасться перемогти в голосуванні. Народ мав якусь безглузду одержимість демократією, якої він не міг збагнути. Саме тепер, як ніколи раніше, люди воліли, щоб ними керував якийсь дурень, який нічого не тямить у військовій стратегії, а не генерали, що роками успішно вели країну? Єльцин не зміг би вивести армію навіть із паперового пакета, не кажучи вже про війну проти Німеччини. Цього не можна було допустити, особливо коли вороги скупчувалися на кордоні.\n\nМаршал уже починав гарячкувати, як із ним часто траплялося, коли йшлося про політику. Та його думки перервав промінь світла, що вдарив йому в очі з вулиці внизу.\n\nВін придивився й побачив на вулиці маленького хлопчика, який штовхав візок і продавав дрібну печену картоплю. Візок був великий, а спереду мав маленьку металеву табличку, що відбивала світло у вікно. Бідолашний хлопчик ледве міг його штовхати.\n\nПогляд Батова пом'якшав, і він відкинувся на спинку крісла. Усе, що він робив, він робив заради російського народу."
 batov.1.a: "Зрештою вони це зрозуміють."

 batov.2.t: "Новий кабінет"
 batov.2.desc: "Після взяття Західної Росії Батова переселили до нового кабінету: більшого й розкішнішого. Чи заслужив він на нього? Батов відповів би, що ні. За цей кабінет заплатили кров'ю і потом його людей. Він не чекав на ще більший кабінет, який дістанеться йому після об'єднання Росії. Ще більше крови, ще більше смерти. Було важко зосередитися на перемогах, а не на помилках, які неминуче ставалися: випадках дружнього вогню, несправному спорядженні, провалах розвідки та звичайному лихому невезінні. Виправдовувати себе тим, що все це було корисним досвідом, здавалося неправильним. Він і Рада добре зналися на воєнному плануванні та стратегії, але чи буде цього досить? Чи зможуть вони нарешті об'єднати Росію, а колись і повернути Московієн?\n\nЗадзвонив телефон, і він підняв слухавку. "Пане, Рада генералів зібралася й просить вас бути присутнім".\n\n"Звісно, зараз буду". Батов поклав слухавку й зібрав потрібні для наради речі. Усі тривоги могли зачекати."
 batov.2.a: "Роботи ще вистачало."

 batov.3.t: "Новий початок"
 batov.3.desc: "Родіон пам'ятав той день у суді так, ніби це було вчора: він наговорив поліції забагато, адвокат зробив усе, що міг, а суддя запропонував простий вибір покарання - п'ять років каторжних робіт або два роки в бойовій частині на передовій. Він обрав друге. У навчальному таборі його приписали до роти невдах. Це був штрафний підрозділ, повний колишніх злочинців і засуджених: убивць, злодіїв, полонених бандитів - жодного невинного. Щоправда, дехто запевняв протилежне: що присяжні були безмозкі, адвокати нічого не тямили, а військові судді Російського народного союзу просто хотіли до них причепитися. Коли жартівники й дотепники дісталися до нього й запитали, за що він потрапив до цього підрозділу, Родіон чесно відповів: "То була моя остання справа. Усе було ідеально для крадіжки грошей, але нас спіймали. Якийсь щур нас продав".\n\nУ рідкісну мить співчуття до товариша-злодія жартуни насупилися, аж раптом один випалив: "Ну, твої вміння нам іще знадобляться. Тут усілякої роботи не бракує - особливо коли всі добрі пайки дістаються кадровикам!" Решта чоловіків зареготала й загаласувала.\n\nКрізь веселий гамір озвався ще один: "Родіон, так? Радше вже Раскольніков!"\n\nРодіон вишкірився й відповів: "Перепрошую, але я не обкрадаю старих бабусь. На відміну від тебе". Казарма вибухнула криками й реготом."
 batov.3.a: "Нас мало, нас щаслива жменька..."

 batov.4.t: "Угода для солдатів, що переховуються"
 batov.4.desc: "У столиці Російського народного союзу двох чоловіків супроводжували сходами до кабінету верховного маршала Батова. Охоронці мали нудьгуючий вигляд, наче вели до верховного маршала ще двох високопосадовців. Однак самі чоловіки були спантеличені й приголомшені. На світанку того ранку обох раптово розбудив лютий стукіт у двері. На порозі стояли суворі аґенти Бюро внутрішньої безпеки, які питали відповідно про Сєрґєя Ахромєєва й Алєксандра Алтуніна. Коли двоє зустрілися у штабі Батова, кожен поглянув на іншого з німим запитанням: як Батов і його люди взагалі дізналися їхні справжні імена й нові адреси? Двоє колишніх генералів ЗРРФ пішли за охоронцями до великого кабінету верховного маршала Батова. Батов відпустив охорону й попросив чоловіків сісти. Він зчепив руки й почав: "Подорож сюди була зручною? Дорогою з вами ніхто не поводився погано? Бо, - Батов злегка всміхнувся, - якщо так, я можу віддати їх під військовий суд". Двоє чоловіків і далі мовчали й здавалися знервованими. "Хай там як, ви, мабуть, дивуєтеся, навіщо я покликав вас сьогодні: двох колишніх високопоставлених генералів Революційного фронту. Ні, я не збираюся вас заарештовувати. Я хотів запропонувати угоду".\n\n"Яку саме?" - запитав Алтунін.\n\n"Увійдіть до генерального штабу Російського народного союзу. Найближчими днями нам знадобиться вся допомога, яку тільки зможемо дістати. Досвід вас обох був би надзвичайно цінним, і ми його належно оцінили б". Батов на мить замовк. "Вас це зацікавило б? Зрештою, ми досі Червона армія".\n\nДвоє чоловіків поглянули один на одного. Тоді Ахромєєв сказав: "Дайте нам кілька днів на роздуми"."
 batov.4.a: ""Думайте скільки треба, аби тільки остаточна відповідь була ствердною"."

 batov.5.t: "Труднощі на конференції"
 batov.5.desc: "На другий день конференції Батов вирішив, що вона перебуває в жалюгідному стані. Ще один день минув у суперечках про те, як найкраще рухатися вперед, які проблеми найнагальніші, як краще зробити те чи інше тощо. Часом вони ставали палкими, а часом - до ломоти в кістках нудними. Батов збрехав би, якби сказав, що весь час був уважний.\n\nНезадовго до завершення чергового виснажливого дня Павєл Батов підвівся й попросив чоловіків повернутися на свої місця.\n\n"Панове, хоча це лише другий день, я вважаю наш поступ незадовільним. Я виступаю зараз, щоб нагадати: народ Росії покладається на те, що ми зробимо все правильно. Понад половина проблем, які мучать нашу територію, не стосується війська. Тому я мушу наголосити: ми не можемо підходити до них по-військовому". Батов замовк. Він пошкодував, що не написав довшої промови, перш ніж усі ці очі звернулися на нього. Перед ним сиділи стратеги, тактики, фахівці з логістики, але жодного цивільного.\n\nВін продовжив: "Ми не можемо дозволити собі впертість. Ми не розчавимо бідність танковими гусеницями. Так, формально остаточні рішення ухвалюємо ми, але мусимо покладатися на цивільне керівництво та його спеціялізовані знання. Сила російського народу перевершує силу війська, і тепер ми маємо нагоду це довести. Одного дня, коли Росію буде об'єднано, коли нацисти більше не терзатимуть наші землі, народ Росії матиме розкіш перекувати наші мечі на лемеші. Коли того дня решта світу погляне на російську націю, що вона побачить? Сподіваюся, колись принижений і пошматований війною народ, який усупереч усьому звівся з мужністю та рішучістю, щоб викувати краще майбутнє"."
 batov.5.a: "Оплески були громовими."

 batov.6.t: "Пізня ніч у Державному департаменті"
 batov.6.desc: "Джим поспішав завершити редагування останньої частини досьє. Він уже провів над цим брифінґом багато довгих ночей. Стислі строки, на жаль, були невіддільною рисою кар'єри в Державному департаменті. Принаймні цього разу це була не звичайна паперова тяганина. Російський воєначальник на ім'я Павєл Батов хотів здійснити дипломатичний візит до Сполучених Штатів, а Джим мав підготувати довідку для людей, які з ним зустрічатимуться. Казали, що він організував боєздатну військову силу, приборкав корупцію й фактично об'єднав половину Росії. З огляду на все, навіть якщо він очолював військову хунту, то не здавався жахливим союзником для Америки: надійний, ненавидів Райх і не був надто тиранічним. Останнім штрихом Джим долучив чітку чорно-білу світлину Батова й поклав усі документи до жовтої теки. Він збирався залишити її на столі начальника.\n\nКоли начальник відкрив досьє, то взяв чорно-білу світлину Батова й почав уважно її розглядати. "Гм, він мені когось нагадує", - сказав начальник.\n\n"Кого?" - запитав Джим.\n\nНачальник на мить замислився. "Він нагадує мені одного давнього російського генерала: Суворова".\n\n"А чим Суворов був такий особливий?" Джим забув, що його начальник знав російську культуру та історію."
 batov.6.a: ""Для початку, Суворов не програв жодної битви"."

 batov.7.t: "Несподівана інспекція"
 batov.7.desc: "Командирові бази здалося дивним, що до його навчального табору прибула така розкішна на вигляд автоколона. Він подумав, що це ще один генерал із Ради, у якого більше часу, ніж розуму, з'явився для чергової інспекції. Та щойно він побачив безпомилково впізнавану шинелю, що майоріла на вітрі, то відразу зрозумів, хто це. Він кинувся вітати верховного маршала й затинаючись промовив: "Пане, це справді несподіванка, і я не певен, чи ваші помічники вам казали, але цей табір готує наші бойові підрозділи з колишніх засуджених?"\n\n"Так, казали, а несподіванка була частиною плану", - з усмішкою відповів верховний маршал, потискаючи командирові бази руку.\n\nКомандир провів його всією базою. Вони мали тренувальний будинок для підготовки до міських боїв, навчання з бойовою стрільбою (справжніми набоями) і, присягаюся Богом, справжню смугу перешкод. Особливою гордістю верховного маршала були польові пайки, які отримували солдати. Ні, страви були не найсмачніші, але цілком їстівні й набагато кращі за колишні - завдяки деяким добродійникам із Вашинґтона. Від усього цього його серце переповнювала гордість за свою армію. Вона справді стала грізною бойовою силою... але чи буде цього досить?\n\nВони ще не об'єднали всієї країни. Московієн досі окупував Райх, воістину страхітливий супротивник, якщо такий узагалі існував. Батов дивився, як чоловіки відпочивали після заняття з фізичної підготовки. Вони могли мати дисципліну, майстерність, мужність... але часом війна була сильнішою за чесноти й уміння. Часом війна залежала від удачі, а Батов не був певен, що він особливо везучий чоловік."
 batov.7.a: "Усе, що могли зробити він і Росія, - докласти всіх сил."

 batov.8.t: "Солдат Батьківщини у Вашинґтоні"
 batov.8.desc: "Батов дістався Вашинґтона. Він виконав звичний дипломатичний ритуал: вручав подарунки, промовляв чарівні слова, щоб випросити щось у керівників країни. Він був солдатом, не більше й не менше, і не почувався придатним до такої роботи. Йому здавалося, що він марнує тут час. Так, ця робота була важлива, але він лише хотів, щоб її міг виконати хтось інший. Усе це страшенно виснажувало - доки люди з Вашинґтона не привезли його до Арлінґтона.\n\nЕкскурсовод повів Батова та його почет цвинтарем. Батов був якомога урочистішим, адже вони фактично проходили священною землею. Деякі могили були ще з часів Громадянської війни, інші - такі недавні, як Південноафриканська війна. Він дивувався чистоті могил і зусиллям, вкладеним у догляд за територією. Здебільшого нічого не відбувалося, хіба що перекладач передавав йому пояснення екскурсовода про історію та минуле цвинтаря. Останньою зупинкою на шляху стала Могила Невідомого солдата. Екскурсовод пояснив, що пам'ятник ушановує американського солдата, чиї останки не вдалося впізнати, але якого все одно пам'ятатимуть. Він добре розрахував тривалість пояснення, бо щойно закінчив, настав час зміни варти. Увесь почет, затамувавши подих, дивився, як вартовий із бездоганною точністю, чіткістю й дотриманням часу виконує кожен крок ритуалу. Коли все скінчилося, Батов щось сказав перекладачеві, запитав, де вбиральня, і негайно пішов разом з охоронцями.\n\n"То що вам сказав верховний маршал?" - запитали американці перекладача, зацікавлені тим, що після цілковитого мовчання впродовж екскурсії спонукало його так раптово піти.\n\n"Верховний маршал дуже вдячний за вашу щедрість, завдяки якій ви показали йому Арлінґтонський цвинтар, - відповів перекладач. - Він перепросив, бо хотів кілька хвилин побути на самоті. Невдовзі повернеться".\n\n"Що він подумав про Арлінґтон?"\n\n"Він був глибоко зворушений і сказав мені, що хотів би, аби народ Росії міг зробити те саме"."
 batov.8.a: "Солдат не плаче - він ридає."
 batov.8.b: "Солдат не плаче - він ридає."

 batov.9.t: "Нещастя невдах"
 batov.9.desc: "Родіон уже чув про роботу з розмінування. Коли їм дали це завдання, він підготувався до найгіршого: що він разом із ротою просто крокуватиме підозрюваним мінним полем і розчищатиме його кров'ю та плоттю. На щастя, все було зовсім не так. Роті провели прискорений курс із методів розмінування. Офіцери також призначили досвідченого фахівця зі знешкодження боєприпасів, щоб він наглядав за всім завданням. Усій роті видали те нечисленне захисне спорядження, яке мали: по кілька шарів протиосколкових жилетів і ці гарячі важкі шоломи з поганою вентиляцією. Дідько, у Російському народному союзі навіть здогадалися розгорнути пункт першої допомоги й медичного сортування просто біля поля, де вони працювали. Від того, наскільки добре поводилися з його ротою на цьому завданні, Родіонові ставало трохи тривожно.\n\nРота мала розчистити посеред дороги коридор, придатний для проїзду. Протитанкові боєприпаси їх не турбували: вони були надто великими, щоб спрацювати від людського натиску, й потребували ваги цілого автомобіля. Та виродки встановили ще й протипіхотні міни. Роту поділили на зміни, бо людей вистачало, а пошук таких речей був фізично виснажливим. Родіон дивився, як попередні зміни вдягають захисне спорядження в задушливу спеку, а також на кількох шибайголів, які цим не переймалися. Йому сказали, що самовпевненість убиває не гірше. Кляті металошукачі давали безліч хибних спрацювань, і на викопування розсипаних уламків та випадкового мотлоху витрачали більше часу, ніж на міни.\n\nБУМ!\n\nСтовп пилу й диму накрив передню колону саперів. Кілька чоловіків кричали, кликали медиків. Родіон кинувся туди, щоб відтягнути поранених подалі від небезпечної зони. Чоловіки корчилися від болю, а їхня кров фарбувала запилену дорогу. Родіон почав тягнути одного з поранених геть. Захисне спорядження на чоловікові лише заважало. Інший чоловік підбіг, схопив пораненого за другу руку й теж почав тягнути. Тепер Родіон із товаришем швидко просувалися вперед. Ще кілька десятків метрів - і вони доправлять його до сортувального пункту."
 batov.9.a: "День буде довгим."

 batov.10.t: "«Червона» армія?"
 batov.10.desc: "Павєл Батов підписував документи, коли двері його кабінету з клацанням відчинилися. Це був Іван Баґрамян, його заступник і, що важливіше, найближчий друг. Найближчий із тих, хто ще жив, звісно. Часом досі було важко думати про Константіна як про мертвого. Батов міркував, чи схвалив би той його нещодавні, доволі неортодоксальні думки. "Ви мене кликали, товаришу?" - запитав Баґрамян, зачиняючи за собою двері.\n\n"Так. Так, кликав. Прошу, сідайте". Коли той сів, Батов продовжив: "Перепрошую за таке коротке попередження, але мені треба дещо виговорити".\n\nБаґрамян здивувався почутому. "Усе що завгодно, товаришу. Вас замучили папери?" Батов похитав головою з легкою, майже сумною усмішкою.\n\n"Ні, ні, нічого такого. Просто я подумав... цей Російський народний союз, який ми створили, якщо бути цілком чесним, насправді не є соціялістичною державою, чи не так? Та ми досі називаємо своє військо «Червоною армією» й гордо виставляємо серп і молот. Досить дивно, правда?" Баґрамян звів брови й, схоже, не знав, що відповісти, тож Батов продовжив. "Тоді я подумав: навіщо й далі робити такі непотрібні речі? Напевно, наші час та сили можна застосувати краще, ніж удавати заради давно померлих людей те, чим ми не є". Між ними запала тиша, і перш ніж Баґрамян устиг відповісти, Батов засміявся, викликавши на його обличчі ввічливу, спантеличену усмішку. "Що ж, забудьте мої слова, Іване Хрістофоровичу. Залишімо майбутнє на завтра, а сьогодні поговорімо про минуле. Скільки часу минуло, відколи ми востаннє розмовляли лише вдвох? Це було під час битви за Москву?"\n\n"Ні, то було в Самарі, товаришу".\n\n"Самара, точно!""
 batov.10.a: ""Треба якось туди навідатися"."

 batov.11.t: "Кошмар Суворова"
 batov.11.desc: "Павєл Батов, спотикаючись, брів полем бою. Зусібіч лунали крики. Одні були далекими, інші звучали так близько, ніби долинали просто поруч із ним. Однак маршал не міг цього визначити. Хоч як він старався, не міг тримати очі розплющеними довше за секунду. Коли намагався озирнутися, здавалося, ніби він дивиться на сонце, хоча навколо панувала непроглядна темрява. Зрештою крики віддалилися, а вибухи почали лунати рідше.\n\nБатов помітив, що нарешті може розплющити очі, й побачив, що тепер стоїть на начебто величезному цвинтарі, де білі хрести позначали могили аж до самого обрію. Знову поглянувши вперед, Батов помітив удалині дивну статую. Біля пам'ятника стояло кілька чоловіків у формі генералів Червоної армії. Та підійшовши ближче, він побачив, що не може розгледіти їхніх облич, хоч як старається.\n\nПостаті почали плескати, коли Батов наблизився, щоб роздивитися пам'ятник - велетенське, залите кров'ю зображення його самого. Коли він простягнув руку, щоб торкнутися статуї, один із безликих чоловіків заговорив.\n\n"Вони всі загинули заради тебе".\n\nПавєл Батов прокинувся з приглушеним зойком. Він гарячково озирнувся й відчув, як його огортає полегшення, коли збагнув, що це був лише сон. Подробиці того, що відбувалося уві сні, почали зникати, а сонячне світло, яке лилося крізь вікно спальні, Батов сприйняв як знак, що час уставати. Того дня мала відбутися важлива стратегічна нарада щодо Москви, і маршал не збирався заводити звичку запізнюватися."
 batov.11.a: "Це був лише сон..."
 batov.11_tt: "§Y...який може стати дійсністю, якщо він не буде §Rобережним§!§!."

 batov.12.t: "Обіцянка відплати"
 batov.12.desc: ""...і ще одне, товаришу Крєйзєр, у вас є бланки щодо нової форми? Я міг би присягнутися, що вони мали надійти ще вчора".\n\nТепер настала черга Крєйзєра присягатися.\n\n"Здається, я їх отримав, Батов, але не знав, що це, тож просто поклав до свого столу. Перепрошую, зараз принесу".\n\nКрєйзєр відкрив стіл і почав виймати зі шухляди різні стоси паперів, аж натрапив на стару вицвілу світлину й завмер. На ній були він, його батьки та дядьки на його бар-міцві. Що ж із ними сталося? - замислився він, і серце почало падати. Він нічого не чув про них від початку війни. А це означало... ні. Такого не могло статися. Не з ними. Заради Бога, тільки не з ними.\n\nБатов уже хотів запитати Крєйзєра, чому він так довго, коли побачив, що той дивиться на світлину, і на хвилину забув про бланки, давши йому усвідомити долю своєї родини. Вони просиділи в кабінеті, здавалося, цілу вічність, перш ніж Крєйзєр заговорив.\n\n"Скільки ще, товаришу? - запитав Крєйзєр. - Скільки ще чекати, доки ми відплатимо фріцам за все, що вони в нас відібрали?"\n\nБатов кліпнув.\n\n"Недовго, - відповів він. - Але спочатку ми маємо роботу, пам'ятайте про це. Ми повинні об'єднати Батьківщину, і одного дня кожен у нашій країні зможе помститися за втрачене, товаришу. Пам'ятайте про це"."
 batov.12.a: "Одного дня."

 ### Yeltsin events ###
 yeltsin.1.t: "Перемога демократії!"
 yeltsin.1.desc: "Результати виборів оголошено, і Єльцин із демократами здобули перемогу зі значною більшістю голосів! Схоже, народ висловив свою волю, і невдовзі військова хунта піде у відставку. Військовий контроль над урядовими будівлями вже починає слабнути, а на зміну йому приходить цивільний уряд. Військові також послаблюють свою владу, скасовуючи воєнний стан по всьому Уральському округу.\n\nЗвісно, заміна військового уряду цивільним принесе чимало змін. Цивільніша модель уряду, безперечно, перемістить увагу на цивільні питання, однак військо й надалі зберігатиме в уряді значну силу та вплив.\n\nПроте демократизація триватиме незалежно від того, подобається це військовим чи ні, а більші свободи стануть доступними кожному жителеві Уралу. Єльцин має безліч планів щодо Уралу й Росії, але чи вдасться йому їх утілити - ще належить побачити."
 yeltsin.1.a: "Вітаємо, президенте Єльцине!"

 yeltsin.2.t: "За зачиненими дверима"
 yeltsin.2.desc: "Попри всю офіційність і публічність, зустріч насправді була доволі приватною. Президент позував перед камерами за дверима кімнати, а за кілька хвилин нетерплячого очікування прибув інший чоловік. «Маршале». Боріс Єльцин привітав Павєла Батова напрочуд фотогенічною, але фальшивою усмішкою. Той наблизився до дверей, нібито не помічаючи або принаймні не зважаючи ані на спалахи камер, ані на погляди репортерів, ані на почет обох чоловіків, що заходив усередину.\n\n«Єльцине», - відповів він із кам'яним виразом обличчя та крицевим голосом, після чого ввійшов до кімнати попереду президента. Звання, яке він «нібито» забув назвати. На коротку мить вираз Боріса змінився. Він ступив до дверей, помахав камерам і повільно їх зачинив. Що ж, час із цим покінчити.\n\n«Як ми обговорювали раніше, - почав він, підійшовши до столу й сівши, а тоді продовжив: - Армія отримає певне представництво в уряді. Однак якщо з'ясується, що вона втручається в демократичні процеси...»\n\n«Якщо вже на те пішло, армія виступить лише проти тиранічного зловживання владою», - перервав Павєл, не зводячи очей із президента.\n\n«Дайте визначення тиранії».\n\nДалі сталося те, чого не бачили натовпи за дверима. У повітрі замиготіли вказівні пальці, документи перечитували й переписували, а в самому осередді всього цього були Боріс і Павєл. Нарешті, після багатьох годин торгу й криків, було визначено кількість місць, які збереже армія, та її статус «мовчазного сторожового пса» - вислів, що безмежно розлютив президента. Однак краще мати армію, яка присягається захищати демократію, ніж ту, що їй цілковито протистоїть. Тож обидві групи попрощалися й вийшли з кімнати під спалахи камер.\n\nФотогенічну усмішку Боріса затьмарили останні слова маршала:"
 yeltsin.2.a: "«Ми стежитимемо за вами, Єльцине»."

 yeltsin.3.t: "Обід на двох"
 yeltsin.3.desc: "Зазвичай офіційний обід із президентом збирав усіх його найближчих друзів і радників, які обговорювали поточні події чи теми від книжок до полювання. Проте сьогоднішній офіційний обід був незвичайним. Кімната стояла майже порожня: усередині були лише двоє людей, що обговорювали невелику проблему.\n\nА саме давні зв'язки Євґєнія Прімакова зі Всеросійською Чорною Лігою. Євґєній Пітовранов, колишній наставник цього чоловіка, з яким вони згодом розірвали відносини, став одним із провідних членів адміністрації Дмітрія Язова. Навіть тепер, коли Чорна Ліга вже мертва й похована, смерть Язова чи Пітовранова не усунула загрози скандалів.\n\n«Як гадаєте, скільки саме людей знає?» - запитав Боріс, суворо дивлячись на Євґєнія. «Ми не можемо дозволити нікому скористатися цим, навіть якщо ви розірвали зв'язки».\n\n«Не хвилюйтеся, усе приховають», - відповів Прімаков, і Боріс грубо кивнув. «Дуже на це сподіваюся, інакше в найкращому разі ми обоє опинимося на вулиці. А в найгіршому...» Йому не довелося закінчувати речення. Обидва й так усе розуміли."
 yeltsin.3.a: "Гаразд."

 yeltsin.4.t: "Інавгурація"
 yeltsin.4.desc: "Спершу натовп мовчав, поки підіймали стяги й сурмили сурми. А тоді здійнявся гамір. Спочатку тихий, коли війська стали струнко, а члени обраного Єльциним кабінету вийшли до трибуни. Він посилився, коли ввійшов Павєл Батов і сів у першому ряду. А тоді нарешті перетворився на рев, щойно показався Боріс Єльцин, перший президент республіки.\n\nПриклавши праву руку до серця, президент нерухомо простояв увесь гимн, тихий як миша, поки гриміли патріотичні пісні й не вщухав рев натовпу, а тоді нарешті підійшов до мікрофона.\n\n«Найдорожчі друзі, - почав він з усмішкою.\n\nСьогодні знаменний день не лише для нашої новоствореної республіки, а й для самої демократії! Від скромного й героїчного початку ми дійшли до цієї миті. Не забуваймо героїзму та звершень минулого, але водночас погляньмо у відважне нове майбутнє!»\n\nМинали години, а президент один за одним запрошував до трибуни чоловіків і жінок. Солдатів, ушанованих за відвагу, фахівців у різних галузях державного управління та... кількох особистих друзів чи багатіїв. На щастя, ніхто не мав до цього жодних претензій; поки що навіть Батов. Щоправда, Західним Сибіром ширилися чутки й бурмотіння про якихось партизанів, але з цим можна було розібратися... пізніше.\n\nА зараз народові Західного Сибіру настав час святкувати."
 yeltsin.4.a: "Свобода - наш найвищий пріоритет."

 yeltsin.5.t: "Промова президента"
 yeltsin.5.desc: "«Друзі, - звернувся президент, цього разу з набагато меншої сцени й за набагато меншою трибуною, ніж під час інавгурації. - Коли я закликав принести демократію до Свєрдловска, то не очікував такої бурхливої підтримки. Я дякую вам, адже ваші голоси дозволили здобути перемогу над будь-якою тиранією. Однак...» Боріс Єльцин замовк і нахилився до натовпу.\n\n«Завдання перед нами складніше, ніж ми гадали. Навіть зараз над усією країною збираються грозові хмари терору й диктатури... ми не можемо дозволити їм занурити нас у вічну ніч. Я закликаю вас зберігати єдність і пильність! Майбутнє республіки не в моїх руках, а у ваших». Залунав шквал оплесків, а він повільно пішов за лаштунки. Він годинами подорожував. Говорив. Благав. Сподівався.\n\nАле в кінці тунелю все ж, можливо, було світло. Упевнена хода президента змінилася рідкісною на людях утомою, а фотогенічна усмішка зникла. Хвилина спочинку, хвилина сну - а тоді знову до роботи. У його розкладі було ще безліч місць, які треба відвідати, і він не міг марнувати час. Тож він знову вдягнув маску життєрадісности, повернув ходу захопленого мрійника й попрямував до автомобіля."
 yeltsin.5.a: "«Куди далі?»"

 yeltsin.6.t: "Кілька дрібних прохань"
 yeltsin.6.desc: "Агенти Бюро внутрішньої безпеки не мусили ставити запитань, коли Прімаков почав надсилати згори дрібні «прохання». Власне, ніхто їх і не ставив. Хоч якби хтось із них потурбувався поглянути на картину в цілому, а не на дрібні «доручення», роздані різним агентам із певним рівнем таємности й приватним схваленням президента, то міг би помітити кілька зв'язків.\n\nПо-перше, якби хтось поглянув на купи документів, що їх поступово вилучали й спалювали, то міг би помітити кілька давніх листів від такого собі Євґєнія Пітовранова до Євґєнія Прімакова й замислитися: «Чому провідний член Всеросійської Чорної Ліги багато років тому контактував з одним із провідних діячів нашого уряду?» А може, його зацікавили б пакунки.\n\nТак, пакунки з грошима й листами розвозили по всій Республіці чоловікам і жінкам. Колишнім членам Чорної Ліги, секретареві з власної канцелярії Прімакова, міському голові та ще кільком людям із різних гілок влади. Їх було більш ніж досить, аби одержувачі могли почати планувати потенційно ранній вихід на пенсію, і, сподіваймося, більш ніж досить, аби переконати їх дослухатися до написаного в записках.\n\nНарешті, когось міг би зацікавити труп серед лісу неподалік від столиці. Свіжий, понівечений настільки, що встановити особу було б майже неможливо, з незавершеним криком, закарбованим на рештках обличчя, поряд з уламками автомобіля. Якби мертві могли говорити, їм було б що розповісти.\n\nОднак ніхто не питав. Ніхто не дивився. І ні Євґєній Прімаков, ні Боріс Єльцин ніколи й нікому не казали ані слова про ці дивні події, обмежившись лише коротким кивком один одному наодинці та швидкою зміною теми."
 yeltsin.6.a: "Зрештою, деякі речі краще лишити похованими."

 yeltsin.7.t: "Найкраща свобода з усіх"
 yeltsin.7.desc: "Анатолій звик бачити свого «найкращого друга» п'яним на вулицях. Проте він не звик, що поліціянти не тягли того геть, зазвичай несхвально насупившись і твердо щось промовляючи. А втім, ось Алєксєй горланив на всю силу, і жодного поліціянта не було видно. «ГЕТЬ ЄЛЬЦИНА!» - п'яно скандував він, усміхаючись і сяючи на розі вулиці.\n\nПопри випадкові погляди перехожих і його галасливі крики, жоден поліціянт не прийшов забрати міського пияка. Навіть коли він кричав про уряд. Нічого. «Алєксєю, - сказав Анатолій, підійшовши до старшого чоловіка з трохи стривоженим обличчям. - Що ви робите?! Вас же вже заарештовували...» Рука перервала його стурбоване втручання, притиснувши палець до губ у заклику мовчати.\n\n«Раніше. Тепер ми живемо в демократії. Тепер так можна», - сказав Алєксєй з усмішкою.\n\n«Тобто...»\n\n«Критикувати уряд, критикувати те, що тобі не подобається, критикувати президента... тепер усе це законно. Можеш казати, що відчуваєш, і тебе за це не заарештують».\n\n«То я можу назвати президента надто п'яним...»\n\n«Надто п'яним? Ні, надто тверезим!» Сміх.\n\nУсе, що було далі, злилося в туман: Алєксєй повів молодого чоловіка до міського бару. Випивка. Сміх. Образи, здебільшого жартівливі. Від зросту президента й поламаних олівців на його столі на світлинах до руки, яку він ховав за краваткою, - критикувати можна було все й усіх у Республіці. І все буде розкритиковано.\n\n«За Єльцина, який дав нам свободу називати його як завгодно!» - заревів Алєксєй. Відвідувачі зі сміхом підхопили тост, а Анатолій радісно вигукнув. На мить молодшому здалося, ніби він побачив сльози в очах старшого, але усмішка того видавалася щирою."
 yeltsin.7.a: "«Тільки подумати, як усе могло скластися, якби раніше ми могли казати те, що хотіли», - заплакав старший."

 yeltsin.8.t: "Дружнє обличчя"
 yeltsin.8.desc: "У Вашинґтоні новини розлітаються швидко. Боріс Єльцин, президент Російської федеративної республіки, прибув із візитом. За лічені хвилини після виходу з літака Єльцин опинився не лише в гостинних обіймах Вашинґтона, а й у гостинних обіймах самої Америки. Прихильник демократії ще за військового правління у Свєрдловску, він швидко переміг на референдумі й відтоді став першим президентом цієї нової молодої республіки.\n\nБоріса зустріли перед камерами з розкритими обіймами, а його поїздка до столиці була ідеальною виставою: від екскурсії меморіялами до обіду з численними сенаторами. Його вітали з усіх боків, а руки представників різних партій одночасно потяглися, щоб потиснути його руку.\n\nДо того ж преса була в захваті, називаючи його та Російську федеративну республіку «новою надією» для Росії."
 yeltsin.8.a: "Сподіваймося, наше перше враження правильне..."

 yeltsin.9.t: "Підозри маршала"
 yeltsin.9.desc: "«Ні, - заявив Павєл Батов, маршал Російської федеративної республіки, оглядаючи документи перед собою й дивлячись на Єльцина. - Категорично ні. Хоча військові цінують ваші спроби реформ, деякі з них дивовижні або неймовірно... специфічні».\n\nЄльцин - президент Єльцин, як далі наполягав цей чоловік, - відреагував на такі прості заяви як завжди. Спочатку він бурчав і нарікав, що втручання маршала шкодить республіці. Потім, трохи покричавши, намагався «досягти компромісу» щодо документів. Часом це спрацьовувало. Зазвичай - ні.\n\nЗрештою він поступався, і зустріч закінчувалася... але не сьогодні. Сьогодні Павєл мав запитання. «Чому пакунки з грошима потрапляють до стількох рук? Про що ви говорите з Прімаковим? Що робить БВБ?»\n\nНа мить очі Боріса розширилися, а тоді його поведінка стала холодною. «Не знаю, про що ви, - пробурмотів він. - Те, що я кілька разів обідав із другом, не означає, ніби ми обговорюємо щось підозріле. Лише кілька спортивних подій, кілька книжок, кілька особистих розмов. Щодо БВБ, його діяльність засекречена. Що це за пакунки?»\n\nПавєл витріщався на нього ще кілька хвилин. «Добраніч, Єльцине», - майже виплюнув він і вийшов із кімнати. В одному він мав рацію: жодних доказів на підтвердження підозр не було. Однак його відповідь..."
 yeltsin.9.a: "Він у цьому замішаний, хай що це таке."

 yeltsin.10.t: "Тихі роздуми"
 yeltsin.10.desc: "Глухої нічної пори Боріс сидів за своїм столом. Політики, службовці, прибиральники - майже всі вже покинули це крило будівлі. І цієї темної години, цієї миті, коли матері вкладали дітей спати, пияки критикували його в барах, а нічні радіошоу й далі сперечалися та жартували, він сидів тут за своїм столом на самоті. Один.\n\nХіба мати амбіції було неправильно? Мрії? Він бачив, як дивився на нього Батов, як дивилися інші скептики. Кожен критик мав що сказати про його поведінку, його ідеї чи його «виставу» перед пресою. Але ж він пройшов шлях від політичного дисидента до президента. А тепер вони ступили на шлях до повернення Росії.\n\nНаодинці із собою він визнавав: вони мали рацію - він таки хотів стати спасителем Росії. Хотів повернути її з краю прірви, виплекати, зробити сильною та стійкою. І так, він хотів похвали. Хотів бачити своє обличчя в підручниках, хотів, щоб батьки розповідали дітям, як він урятував Росію від загибелі, і хотів затьмарити Лєніна, Бухаріна й царів.\n\nХіба неправильно бажати спадщини? Бажати, щоб саме це стало його спадщиною? Росія кликала, і він відповідав. Це не було жадібністю чи надмірним себелюбством. Будь-який чоловік чи жінка хотіли б почути радісні крики мільйонів, побачити щасливі усмішки змучених війною ветеранів, які нарешті живуть у мирі, або замінити жахіття минулого надією. Він міг їм це дати. Він їм це дасть.\n\nМожливо, вони просто заздрили чи гадали, що він не впорається. Боріс Єльцин зітхнув і коротко глянув у вікно."
 yeltsin.10.a: "Він доведе, що вони помилялися. Він мусив."
