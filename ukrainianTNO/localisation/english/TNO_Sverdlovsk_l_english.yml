 ### Batov tree ###
 SVR_a_union_of_the_people: "Союз народу"
 SVR_a_union_of_the_people_desc: "Під проводом верховного маршала Батова та Ради генералів доля була щедрою до нас, і ми скористалися її даром: Західну Росію возз'єднано під одним стягом! Однак зараз не час для надмірних святкувань. Попереду ще багато роботи, і не лише заради самого возз'єднання. Наша адміністрація працює на межі можливостей, тож ми мусимо діяти швидко, аби якнайскоріше інтегрувати народ Західної Росії до нашої молодої держави. Досі нам доводилося витримувати куди гірше, тому нинішні перешкоди - ніщо. Тож рушаймо вперед із іще більшою рішучістю, знаючи, що ми можемо й неодмінно переможемо."

 SVR_why_we_fight: "За що ми боремось"
 SVR_why_we_fight_desc: "Війна - жахлива річ, і жодна людина не жадає смерти так охоче, як чоловіки жадають ікри. Народові Росії потрібна причина боротися. Рада генералів схвалила пропагандистську кампанію, яка нагадає людям, чому ми невпинно йдемо вперед. Наш похід за возз'єднання ще не завершено. Половина Росії досі лишається поза нашою владою, Московієн і далі перебуває під контролем фашистів, а Росія все ще слабка. Це геркулесові завдання, але ми мусимо спробувати. Тому пошлімо найкращих митців складати й оформлювати нові гасла, плакати та інші матеріяли, аби російський народ знову об'єднався під одним стягом."

 SVR_freedom_from_oppression: "Свобода від гноблення"
 SVR_freedom_from_oppression_desc: "У прийдешніх війнах Матінці-Росії знадобиться вся можлива допомога, тож чому вона змушує своїх дочок сидіти вдома? Настав час скасувати обмеження для жінок на бойових посадах. Вони вже сумлінно служать у тилових частинах, і немає жодного сенсу не допускати жінок до служби на передовій, якщо вони відповідають високим вимогам підготовки. Верховного маршала Батова ознайомлено з цим питанням, і він вимагає негайно скасувати ці обмеження."

 SVR_freedom_from_persecution: "Свобода від переслідувань"
 SVR_freedom_from_persecution_desc: "Надто довго Росія була беззаконною пусткою, пошматованою між бандитськими ватажками, фашистами й іншими лиходіями. Це була сваволя, але найтяжче доводилося звичайній людині. «Хто сильніший, той і правий», - кажуть ті лиходії. Годі. Наша Росія буде могутньою, але водночас мусить бути справедливою. Провідним правознавцям доручено докорінно перебудувати нашу правову систему. Її потрібно розширити відповідно до більшої чисельности населення й території, а суди зробити справедливішими та менш корумпованими. Рада генералів рекомендувала правознавцям певні юридичні цілі: гнучкішу систему оскарження, можливість військової служби в обмін на пом'якшення вироку, ширше застосування судів присяжних - і це лише початок. У прагненні справедливости для всієї Росії ми не сміємо забувати про справедливість для її народу. Хай буде так!"

 SVR_freedom_from_annihilation: "Свобода від знищення"
 SVR_freedom_from_annihilation_desc: "Наші конфлікти охопили весь діяпазон: від рейдів проти бандитів і протиповстанських патрулів до повномасштабної звичайної війни з регіональними воєначальниками. Наші збройні сили вже наділені належною дисципліною й підготовкою, і ми сподіваємося, що, чітко визначивши деякі питання на теоретичному рівні, зможемо закріпити їх у повсякденній тактиці.\n\nТому провідні військові фахівці та Рада генералів мають намір провести офіційний перегляд стандартних оперативних процедур і правил ведення бою. Ми більше не просто називатимемо себе справді професійною армією, а й станемо нею!"

 SVR_the_next_generation: "Наступне покоління"
 SVR_the_next_generation_desc: "Настав час нової хвилі набору, щоб поповнити втрати, яких ми зазнали в усіх війнах за возз'єднання. Підготувати нову рекрутську кампанію буде нескладно: наші автори вже вигадали привабливу назву - «Наступне покоління».\n\nОсновний наголос буде на нашому професіоналізмі: ми вже не купка призовників з іржавими гвинтівками, а, можливо, одна з найкомпетентніших армій у всій Росії. Ми маємо належне логістичне забезпечення, справжню підготовку від ветеранів і, найважливіше, гідну платню. Майбутнє безпеки Росії вже настало - чи станеш ти частиною Наступного покоління?"

 SVR_appealing_to_the_populace: "Звернення до населення"
 SVR_appealing_to_the_populace_desc: "Здебільшого Західна Росія прийняла нашу нову адміністрацію, але ще лишилися окремі осередки повстанців. На воєнному фронті наші найкращі бійці намагаються ліквідувати всі твердині, які могли вціліти, однак у протиповстанській боротьбі значно важливіші не бомби чи кулі, а серця й уми. Нещасний народ російської анархії надто довго страждав під владою тиранічних можновладців і воєначальників. Щоправда, ми й самі не є цивільною установою, але тиранувати людей не збираємося.\n\nНавіть Рада генералів сподівається, що одного дня Росією можна буде правити без воєнного стану. Проте народ Західної Росії цього не знає. Крім слів і пропаганди, Рада генералів рекомендує зміцнювати довіру діями. Надалі ми сподіваємося залучати цивільні поради та пропозиції до нашої адміністрації, що невпинно розростається, і народ про це знатиме."

 SVR_reintegrate_the_remnants: "Реінтегрувати залишки"
 SVR_reintegrate_the_remnants_desc: "Прикро, що Перша Західноросійська війна не повернула Московієн, але ми ніколи не перестанемо віддавати належне нашим попередникам із Західноросійського революційного фронту. Це була справді грізна армія, і ми сподіваємося, що її бійці вийдуть із підпілля. Так, Російський народний союз уже не є організацією, заснованою на «марксистсько-лєнінських» принципах, але ми, безперечно, сподіваємося, що старі солдати змінять свою думку. Ті, хто ще досить молодий для бою, можуть принести користь як унтерофіцери.\n\nНавіть ветерани, непридатні до боїв на передовій, але які зуміли вижити, стануть цінним поповненням нашого офіцерського корпусу. Бюро внутрішньої безпеки також збирає зачіпки. Ходять чутки, що після возз'єднання деякі колишні командири ховаються під новими іменами. Скористаймося нашими розвідувальними ресурсами й знайдімо їх. Ми не бажаємо зла колишнім членам ЗРРФ. Навпаки, від однієї групи старих солдатів до іншої: ми лише хочемо дати їм іще один шанс возз'єднати Росію та вигнати фашистів із Московієна."

 SVR_securing_heavy_industry: "Запустити важку промисловість"
 SVR_securing_heavy_industry_desc: "Хоча наші бійці отримали суворий наказ не допускати супутніх руйнувань, через запеклі бої чимало важкого обладнання та фабрик у Західній Росії вийшло з ладу. Не пошкодити фабрики - це одне, а знову запустити їх - зовсім інше. Рада генералів видала виконавче розпорядження, згідно з яким наша чинна промисловість має зосередитися на постачанні необхідних деталей і засобів для відновлення роботи зупинених фабрик."

 SVR_restoring_russia: "Відновлення Росії"
 SVR_restoring_russia_desc: "Західна Росія, безперечно, постраждала від терористичних бомбардувань і хаосу після Західноросійської війни більше за всіх. Тутешній народ заслуговує на краще, тому належна інтеграція зараз є нашим найвищим пріоритетом. Перш ніж Російський народний союз стане сильним, він мусить стати життєздатним, а нині наші сили розпорошені. Ми складемо план належного розвитку регіону й знову наведемо лад на цих землях."

 SVR_the_councils_plan: "План Ради"
 SVR_the_councils_plan_desc: "Окрім належної реінтеграції західноросійських регіонів, Рада вирішила офіційно зібратися, щоб розробити стратегічні плани найкращих дій. Верховний маршал Батов та інші члени Ради проведуть тижневу конференцію. За попереднім аналізом, більшість перешкод стосуються цивільних питань, а вони несуть власні труднощі. Тому перед тим, як переходити до забезпечення виконання й належного впровадження, важливо визначити правильні цілі та принципи."

 SVR_grants_for_academia: "Гранти для науковців"
 SVR_grants_for_academia_desc: "Дурня мало хто жаліє, а якщо нічого не зміниться, Росія як нація так і лишиться країною дурнів. Стільки років анархії та терористичних бомбардувань назавжди відкинули російський народ назад від належного поступу. Ми не плекаємо ілюзій, що миттєво наздоженемо наддержави Німеччину, Японію чи навіть далекі Сполучені Штати, але починати треба вже зараз.\n\nНаша Рада вирішила порадитися з науковцями щодо перших кроків, і вони рекомендували надавати гранти, щоб заохотити населення. Сподіваймося, ці інвестиції принесуть нам чималі дивіденди!"

 SVR_price_controls: "Контроль цін"
 SVR_price_controls_desc: "Економічне становище Російського народного союзу жахливе. Рада провела чимало палких дискусій із провідними економістами про найкращий шлях уперед, але зрештою, на їхнє велике невдоволення, вирішила відкинути їхні пропозиції вільного ринку. Для боротьби з інфляцією буде встановлено контроль цін на основні потреби, як-от харчі, паливо та вода. Щоб заспокоїти економістів, Рада знову й знову пояснювала, що це лише тимчасові заходи й у майбутньому можуть бути запроваджені нові довгострокові рішення, але зараз головним пріоритетом є стабільність..."

 SVR_the_eagles_soar: "Злет орлів"
 SVR_the_eagles_soar_desc: "Настав час знову потеплішати відносинам із нашим багатим і могутнім покровителем за океаном - Сполученими Штатами. Ми вже встановили офіційні дипломатичні відносини як регіональна держава, а тепер час їх поглибити. Подальша економічна чи військова підтримка суттєво допоможе нам возз'єднати Росію.\n\nТож ми плануємо дипломатичний візит до Сполучених Штатів на чолі з верховним маршалом Батовим. Ми сподіваємося нагадати нашим покровителям, що їхня попередня підтримка не була марною, як не будуть змарновані й наші майбутні прохання. Дипломати вже починають складати кілька економічних і політичних поступок в обмін на їхню допомогу. Хай наш візит добре приймуть."

 SVR_to_serve_russia: "Служити Росії"
 SVR_to_serve_russia_desc: "Друзі мої, після всієї тяжкої праці настав час побачити її плоди! Після багатьох тижнів обговорень і керування з кабінету верховний маршал Батов висловив бажання особисто перевірити кілька місць. Утім, у звичному для Батова стилі він попросив не попереджати про ці інспекції. Що ж, сподіваймося, він буде вражений!"

 ### Yeltsin tree ###
 SVR_democracy_triumphant: "Тріумф демократії!"
 SVR_democracy_triumphant_desc: "Борісові Єльцину нарешті вдалося спрямувати країну до демократії, і Російська федеративна республіка народилася наново! Проте разом із цими змінами постали нові виклики: реінтеграція нещодавно завойованих територій і розширення наших демократичних інституцій.\n\nКоли половина Росії перебуває під нашим контролем, ми нарешті можемо почати втілювати справжню демократію, а президент Єльцин виголосить урочисту промову з нагоди цієї події.\n\nЗа свободу нациї!"

 SVR_bury_the_past: "Поховати минуле"
 SVR_bury_the_past_desc: "Перш ніж рухатися далі, ми мусимо позбутися одного скелета в шафі. Прем'єр-міністр Євґєній Прімаков мав зв'язки з омською Чорною Лігою. Звісно, нині він уже не підтримує зв'язків із цією групою, але докази лишилися й можуть спричинити серйозний скандал у нашій молодій демократії.\n\nКористуючись своїм впливом як прем'єр-міністр, Прімаков подбає, щоб Бюро внутрішньої безпеки очистило всі документи, де його ім'я пов'язане з Лігою, а також з'ясувало, хто про це знає, а хто ні. Ті, хто знає, отримають щедру винагороду за мовчання."

 SVR_a_breath_of_fresh_air: "Ковток свіжого повітря"
 SVR_a_breath_of_fresh_air_desc: "Маршал Батов більше не є панівною силою в нашій політиці. Так, він і далі лишається нашим міністром безпеки, але вже засвоїв своє місце в цій новій демократії, і відтепер нашому народові про це нагадуватимуть. Із часом демократія Республіки зміцніє у своїй основі, а всі спогади про військове правління відійдуть у небуття.\n\nЗа нову Росію!"

 SVR_to_the_new_republic: "За нову Республіку!"
 SVR_to_the_new_republic_desc: "Тепер, коли значна частина російської території перебуває під нашою адміністрацією, нам довелося зіткнутися з очікуваним, але від того не менш обтяжливим бюрократичним тягарем.\n\nЩоб полегшити собі справу, ми звернемося до всіх колишніх держав із міцними демократичними традиціями, як-от колишня республіка в Сиктивкарі, та поговоримо з політиками, які втратили своє місце після розпаду їхніх країн. Їхні навички допоможуть нам швидше й ефективніше інтегрувати нові території."

 SVR_the_brilliant_flame_of_democracy: "Яскраве полум'я демократії"
 SVR_the_brilliant_flame_of_democracy_desc: "Погляньте й здивуйтеся, як свобода прийшла до Росії! Утім, ми не можемо сидіти склавши руки й дозволити цим інституціям розвиватися самотужки. Російська федеративна республіка мусить активно розчищати шлях, спонукаючи кожного громадянина замислитися над тим, у чому він бере участь і як саме, а тих, хто досі вагається, - приєднатися до нас!"

 SVR_a_free_russia: "Вільна Росія"
 SVR_a_free_russia_desc: "Хто скаже, що людина може голосувати за власним вибором, якщо вона не вміє читати, писати чи розуміти природу політики? Освітня система Росії занепадає вже десятиліттями, але ми як держава відповідаємо за те, щоб дати людям необхідні засоби для навчання.\n\nФінансування буде збільшено за всіма напрямами - школам, учителям і на навчальні матеріяли. Усе заради розумнішої та кращої Росії."

 SVR_back_to_washington: "Назад до Вашинґтона"
 SVR_back_to_washington_desc: "Наші друзі у Сполучених Штатах Америки поділяють схожі з нашими ідеали. Ба більше, їх славлять як лідера вільного світу, і цілком заслужено! Ми можемо багато чого навчитися в американців, тому Боріс Єльцин організував особистий візит до Вашинґтона, щоб налагодити добрі відносини.\n\nХай він завершиться добре."

 SVR_reintegrate_the_west: "Реінтегрувати Захід"
 SVR_reintegrate_the_west_desc: "Території Західної Росії не так тісно пов'язані з нашим урядом, як землі, на які ми поширили владу спочатку. Цю проблему потрібно швидко виправити - кожне село, місто й регіон буде включено до Російської федеративної республіки, і питання лише в тому, коли це станеться, а не чи станеться взагалі."

 SVR_sweeping_privatization: "Масштабна приватизація"
 SVR_sweeping_privatization_desc: "Значна частина нашої економіки досі перебуває в руках держави. Чому так має бути? Хоча ми керуємося добрими намірами, ми не здатні мікрокерувати всім, що відбувається в полі нашого зору. Розпочнеться програма приватизації; кмітливі люди Росії візьмуть долю наших підприємств у свої руки й виліплять із них добробут."

 SVR_economic_shock_therapy: "Економічна шокова терапія"
 SVR_economic_shock_therapy_desc: "Процес іде недостатньо швидко! Однак Боріс Єльцин, заохочений представниками ділової еліти, виробив новий спосіб мислення. Якщо державу можна рішуче підштовхнути до радикальних реформ - скасувати контроль цін, відкритися для торгівлі та іноземних інвестицій, приватизувати державні підприємства, - тоді такі радикальні зміни зможуть вивести нашу економіку з комуністичного заціпеніння. Звісно, буде спротив, упертість бюрократів, які бояться втратити свої затишні посади.\n\nЛогіка полягає в тому, що саме така різка зміна необхідна, аби в майбутньому перетворити економіку Росії на краще, а якщо зробити це зараз, то можна уникнути більшої шкоди згодом. Дехто може постраждати від потрясінь, але з часом усі вони отримають належну частку багатства. Як і всі громадяни Росії."

 SVR_throne_of_bayonets: "Трон на багнетах"
 SVR_throne_of_bayonets_desc: "Хоча демократія нарешті почала знаходити непевну опору в російському світі, військо досі нависає над нами, наче Дамоклів меч, готовий упасти на нашу Республіку, щойно обірветься нитка. Президент Єльцин організує зустріч із маршалом Батовим і докладно обговорить із ним подальший план дій. Демократичні інституції та армійські структури мусять діяти спільно, інакше нас спіткає ще більше конфліктів."

 SVR_placate_the_military: "Задобрити військових"
 SVR_placate_the_military_desc: "Військові не можуть і далі стояти напоготові, чекаючи, поки ми дамо їм якусь винагороду. До певної міри нам доведеться їх задобрити, щоб стримувати їхній вплив і контролювати лояльність. На щастя, Республіка має додаткові кошти, які можна спрямувати на розробку нових військових технологій. Хай там що, це матиме подвійний ефект: допоможе поліпшити нашу армію та зробить військових задоволенішими."

 SVR_the_saviors_of_russia: "Спасителі Росії"
 SVR_the_saviors_of_russia_desc: "Самою лише доброю волею демократію не захистити. Вона потребує оборони й отримає її від наших хоробрих чоловіків, які служать у війську. Республіка розпочне пропагандистську програму, щоб заохотити людей вступати до армії та прихильніше ставитися до думки, що зрештою ми знову підемо війною на кожного, хто стане на заваді возз'єднанню всього російського народу."

 SVR_feed_the_beast: "Нагодувати звіра"
 SVR_feed_the_beast_desc: "Росію ніколи не буде об'єднано, якщо наша армія складатиметься з баламутів і людей, які тікають за першої ознаки бою. Війську потрібне найкраще, що ми можемо дати, і воно заслужено отримає кошти на нові методи підготовки та способи провести наших солдатів уперед, у сучасну епоху війни. Заради захисту країни, заради захисту народу!"

 SVR_rise_from_the_ashes: "Постати з попелу"
 SVR_rise_from_the_ashes_desc: "Економіка зазнала шокової терапії, якої потребувала ще з часів комуністів і мілітаристів; так само було вдоволено жагу військових до влади, і ми починаємо перетворювати їх на справжню бойову силу. Ідеали демократії повільно, але впевнено ширяться землями під контролем Республіки.\n\nЗрештою Росія стане відродженим феніксом, що здійметься над наддержавами, маючи лише силу, гордість і демократію.\n\nХай Російська федеративна республіка живе вічно!"

