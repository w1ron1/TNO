 GENERAL_YAKOV_KREIZER_DESC: "§LЄврей за походженням, Яков Крєйзєр служив генералом під час Великої Вітчизняної війни й особливо відзначився в операції «Суворов». Його знання оборонної війни, дії та стійкість його військ, що тримали позиції, відіграли ключову роль у порятунку відступаючих частин Червоної армії. Коли Третя армія відокремилася від республіки Каґановіча, Крєйзєр, як і багато інших, став на бік Рокоссовскоґо.§!"

