 SVR_foreign_trade: "Зовнішні відносини та торгівля"
 SVR_foreign_trade_desc: "Виходячи з анархії Західного Сибіру, ми мусимо дивитися назовні, щоб повернути вагу на міжнародній арені. Перший крок - дружні відносини з іноземними державами на захід і схід від нас. Якщо дипломатія матиме успіх, нас можуть визнати справжнім наступником загиблої держави, що колись володіла всією Росією."

