 #Not so Red Army
 SVR_Not_So_Red_Army: "Не така вже й Червона Армія"
 SVR_Not_So_Red_Army_desc: "Уряд §GУральського військового округу§! складається лише з найвідданіших і найталановитіших бойових товаришів Рокоссовскоґо. Про решту збройних сил цього не скажеш. Наша армія повна призовників, які мимоволі перейшли з §RТюмєні§! - тобто просто опинилися по наш бік кордону, коли вляглася курява. Багато хто досі прихильно ставиться до §RТюмєні§! та самого Каґановіча. Ще поширенішою й нагальнішою проблемою є дедалі більше випадків появи пропаганди §RЧорної Ліги§! в казармах по всій країні.\n\nЧужоземним агентам у наших збройних силах не буде терпимости. Зрадників і ненадійних осіб треба вирізати, мов хворобу, доки вони не повстали й не знищили державу зсередини."

