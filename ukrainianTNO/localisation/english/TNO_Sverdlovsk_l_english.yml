 SVR_Yevgeniy_Primakov_hog_desc: "§YГолова уряду\nПатерналістський консерватизм§!\n--------------\n§LПрімаков завжди мав внутрішній потяг до кращого - для себе й свого народу. Народжений 1929 року в Кієві в єврейській родині, він покладав великі надії на наукову кар'єру. Старанний юнак змалку тяжко працював, щоб навчатися в найкращих умів свого покоління й чинити великі справи. Та розпад Союзу зруйнував ці мрії - як здавалося молодому Прімакову, назавжди. Решту підліткових років і ранню дорослість він провів у Західному Сибіру, швидко піднявся соціяльною драбиною й невдовзі подався в політику. У цей перехідний час він учинив багато такого, чим не пишається і що привертатиме увагу людей та всіх нажитих політичних суперників. Попри це після розпаду ЗСНР Прімаков вирішив допомагати Борісу Єльцину відроджувати демократію в зруйнованій війною Росії. Та минуле переслідуватиме його всю кар'єру, навіть якщо він принесе демократію всім росіянам.§!"
 
