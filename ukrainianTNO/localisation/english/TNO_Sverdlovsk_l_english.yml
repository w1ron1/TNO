 SVR_Ivan_Bagramyan_sec_desc: "§YМіністр безпеки\nВійськова хунта§!\n--------------\n§LМало хто може похвалитися службою стільком державам за одне життя. Народжений у Єлісавєтполі Кавказького намісництва Російської імперії в родині вірмен, Іван Баґрамян спершу воював у Першій світовій війні в лавах Російської Кавказької армії, а після здобуття Вірменією незалежности служив у вірменському війську. Невдовзі після приєднання Вірменії до Совєцького Союзу він вступив до Червоної армії, звитяжно служив під час Великої Вітчизняної війни й особливо відзначився в операції «Суворов». Палко відданий Рокоссовскому, Іван пішов за старим маршалом, коли той відокремився від Західносибірської народної республіки. Співчутливий Баґрамян неохоче кидає війська в безглузді криваві бійні, і цю рису він поділяє зі своїм колегою генералом Батовим.§!"
 
