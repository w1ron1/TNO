 POLITICS_KONSTANTIN_ROKOSSOVSKY_DESC: "На відміну від багатьох інших, Константін Константіновіч Рокоссовскій попри все залишався вірним совєцькій Батьківщині - навіть донині. Народившись за царських часів у родині польської шляхти, в дитинстві він зазнав тяжких злиднів. Цілком закономірно він пристав до партії більшовиків і невдовзі став одним із найвидатніших та найвідоміших командирів Совєцького Союзу - визначним джентльменом і офіцером із бездоганним бойовим послужним списком. Після двох десятиліть служби в Червоній армії картковий будинок розсипався, СССР упав, і Рокоссовскому довелося пристосовуватися до цілком нового світу. Коли його 3-тя армія, відступаючи від німецьких загарбників, дісталася Уралу, Лазар Каґановіч прийняв її з розкритими обіймами, тож Рокоссовскій приєднався до Західносибірської народної республіки.\n\nПроте союз Каґановіча та його генералів, сповнений недовіри й запеклого суперництва, був крихким і неминуче мав розпастися. Західний Сибір усупереч усьому боровся за виживання, поки німці не припиняли нещадних бомбардувань, а розколи між провідниками та генералами дедалі поглиблювалися, доки їх уже неможливо було подолати. Коли Карбишев захопив Омск, а бездіяльність Каґановіча виказала його зневагу, Рокоссовскій зрозумів, що Народна Республіка йде на дно, швидко зібрав свою 3-тю армію у Свєрдловску й утворив тимчасовий військовий уряд під власним проводом, підпертий грізною силою. Розчарувавшись у колишньому партійному начальстві в Тюмєні, Рокоссовскій не зрікся справи возз'єднання Совєцького Союзу, навіть якщо її вестиме віддане й безстороннє військо, породжене та навчене найкращими традиціями російського й совєцького воєнного мистецтва, яке служить трудящим, а не бюрократам. Тяжка служба й похилий вік дорого коштували здоров'ю маршала Рокоссовскоґо, та в ці відчайдушні часи його рішучість незламна. Навіть якщо він не доживе до дня, коли Червона армія знову маршируватиме Красною площею, він може покластися на давніх друзів і товаришів, які гідно продовжать його місію."

 POLITICS_PAVEL_BATOV_DESC: "Солдати під командуванням Павла Івановіча Батова часто лагідно називають його «нашим Суворовим» - і за зовнішність, і за манери, порівнюючи з легендарним російським полководцем, знаним військовим генієм, скромністю та любов'ю до простих російських солдатів. Сам генерал навряд чи визнає або заохочує таке порівняння, та важко дорікнути тому, хто бачить такі паралелі між очільником Уральського військового уряду й уславленим героєм російського минулого.\n\nУ найтемніші дні нацистського наступу на Росію Батов познайомився з Константіном Рокоссовскім, із яким його поєднали професійні й особисті зв'язки, що тривали до смерти останнього. Бойове побратимство двох генералів стало темою захопливих легенд та оповідей по всьому Сибіру, де правда перепліталася з вигадкою. Пережите ними разом, війни, у яких вони билися пліч-о-пліч як єдине ціле, - усе це закарбувалося в сучасній російській культурній пам'яті.\n\nНа похороні давнього друга Батов присягнув нести прапор справи покійного генерала й берегти спадщину Лева Сибіру. Реорганізовуючи сили Уральського військового округу під своїм командуванням і встановлюючи надзвичайну владу в охопленій війною Росії, Батов прагне переосмислити роль Червоної армії в суспільстві - щоб вона була не просто захисницею російського народу, а його провідницею в часи анархії та спустошення."

 POLITICS_PAVEL_BATOV_70S_DESC: "Бурхлива історія Росії природно породила чимало видатних військовиків, які завдяки неабиякому таланту виривали перемогу з пащі неминучої загибелі. Тепер, коли, мабуть, найтемніша доба існування Росії скінчилася, історія знайшла ще одну таку постать, якій складатиме вічну подяку: Павла Івановіча Батова.\n\nВеликий маршал Батов - людина, яка кинула виклик обставинам, у пастці яких опинилися він і його товариші. Коли вороги діяли безрозсудно й агресивно, Батов умів спершу подумати, а вже тоді діяти. Деякі воєначальники вважали, що за возз'єднання Росії не буває надто високої ціни, але Батов ретельно дбав, аби не наражати своїх людей на зайву небезпеку. Відмова опускатися до рівня супротивників не завадила його поступу, і тепер так званий «Сучасний Суворов» стоїть на чолі відродженої російської держави.\n\nТа навіть після того, як гармати замовкли, Батов майже не знаходить розради. Попереду його найбільше випробування - повернення російського осердя з-під нацистської чуми, і Великий маршал ночами не спить, думаючи про жорстокість, яку, ймовірно, принесе такий велетенський конфлікт. Гірше того, Батова не полишають сумніви, чи поділяють підлеглі його бачення Росії.\n\nА поки Павєл Батов ітиме далі, як ішов завжди: з непохитною відданістю Росії та її народові."

 POLITICS_BORIS_YELTSIN_DESC: "Іноді тигр може стати в пригоді. Верховний хижак, здатний переслідувати здобич із завзяттям, якому дорівнює хіба його кровожерність. Фашисти випустили свого тигра на Уралі й ненароком спустили з ланцюга розбещеного чоловіка, що залишав по собі лише насильство. Та свєрдловський тигр іншої породи, і, на відміну від німецького, його повід буде коротким і міцним.\n\nБоріс Ніколаєвіч Єльцин - ідейна людина в державі, сумновідомій своєю безідейністю. Він обстоює агресивну економічну політику приватизації, стрімке поширення демократії та швидке возз'єднання Росії. Саме запал і відданість вивели його з відносної невідомости до керівництва демократичною фракцією Свєрдловска.\n\nУтім, хоч він і прагне втілити нове бачення та може прислужитися нашій справі припинення російської анархії, як кожного тигра, його треба тримати під контролем. Павєл Батов добре усвідомлює і поспішність Єльцинової політики, і не надто привабливі методи її здійснення. Тому він присягнув забезпечити військовим рівний вплив у новій республіці.\n\nЄльцин мусить пройти по линві, врівноважуючи консервативних мілітаристів зі своїми агресивно республіканськими нахилами. Війну за Росію ще не виграно, й лише час покаже, чи здійсненне таке завдання. Та якщо він досягне успіху, Росія неодмінно стане сильнішою. Можливо, її політика не стане менш жорстокою, але це все ж буде вільна, агресивно капіталістична республіка."

 POLITICS_ANTON_ANTONOV_OVSEYENKO_DESC: "Спорідненість із батьком, видатним більшовицьким військовим командиром, не врятувала Антона Владіміровіча Антонова-Овсєєнка від заслання до сумнозвісних сибірських ґулаґів. Роками він на власному досвіді пізнавав терор СССР, аж доки табори не звільнили бандити й злодії.\n\nПопри все пережите він не здавався й дочекався нагоди втекти разом з іншими дисидентами та колишніми в'язнями, коли перемогли збройові торговці Златоуста.\n\nОскільки інших придатних керівників для підтримання порядку в Ханти-Мансі майже не було, Антонова та його караван обрали управляти морозними рівнинами від імени Уральської Республіки. Поволі надбані за роки дружні зв'язки дали плоди: єдиний фронт політичних дисидентів, священників на кшталт його близького соратника Сєрґєя Ізвєкова та навіть звичайних бандитів спромігся підтримати лад на берегах Іртиша й, понад усе, подбати, щоб його мешканцям не довелося пережити того самого, що й Антонову."

 POLITICS_ANTON_ANTONOV_OVSEYENKO_ONEGA_DESC: "Спорідненість із батьком, видатним більшовицьким військовим командиром, не врятувала Антона Владіміровіча Антонова-Овсєєнка від заслання до сумнозвісних сибірських ґулаґів. Роками він на власному досвіді пізнавав терор СССР, аж доки табори не звільнили бандити й злодії.\n\nПопри все пережите він не здавався й дочекався нагоди втекти разом з іншими дисидентами та колишніми в'язнями, коли перемогли антикомуністи Онєґи.\n\nОскільки інших придатних керівників для підтримання порядку в Ханти-Мансі майже не було, Антонова та його караван обрали управляти морозними рівнинами від імени Північноросійської Республіки. Поволі надбані за роки дружні зв'язки дали плоди: єдиний фронт політичних дисидентів, священників на кшталт його близького соратника Сєрґєя Ізвєкова та навіть звичайних бандитів спромігся підтримати лад на берегах Іртиша й, понад усе, подбати, щоб його мешканцям не довелося пережити того самого, що й Антонову."

