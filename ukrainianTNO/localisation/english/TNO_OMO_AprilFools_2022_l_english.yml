 # Far Eastern Siberian Plan
 OMO_2022_crystals_regional_sibplan: "=== Далекосхідний Сибірський план ==="
 OMO_2022_crystals_regional_sibplan_desc: "Товариш Бакхарін засвоїв помилки минулого й прагне спокутувати їх, створивши на безлюдних землях Сибіру потужну промисловість, яка служитиме винятково народові й нікому іншому, відповідно до ідеалів Гармонійного комунізму. Але він мусить ступати обережно, щоб не відхилитися від своїх ідеалів, адже помилки минулого не мають повторитися вдруге.\n\n§FДалекосхідний Сибірський план буде завершено, щойно прогрес сягне §Y100§!, після чого розвиток припиниться.\n\nПрогрес Далекосхідного Сибірського плану: ([?OMO_2022_sibplan_boogaloo_progress|Y0]/§G100§!)§!"
 
