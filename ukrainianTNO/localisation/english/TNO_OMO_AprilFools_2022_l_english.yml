 ### Characters
 OMO_2022_Nikolai_Buckharin: "НЄІЗВЄСТНО"
 POLITICS_NEIZVESTNO_DESC: "У Сибіру живе багато людей. Невідомих серед криги й холоду. Але цей чоловік не такий.\n\nСтарий, такий старий. І все ж рішучий. Залізна воля. А ті очі, вони бачили так багато...\n\nХто він? Ми його знаємо? Та звідки нам... Вогник упізнання згасає.\n\nЙому ніколи зважати на наші пусті здогади. Він має місію. Виправити кривди.\n\n§eІ так починається остання драма...§!"
 
 OMO_2022_Nikolai_Buckharin_Revealed: "Ніколай Бакхарін"
 POLITICS_PONY_BUCKHARIN_DESC: "Саме це ім'я неодмінно викличе в кожного росіянина цілу бурю почуттів, залежно від того, хто він. Ненависть, смуток, жаль, теплі спогади, давні мрії про совєцьку славу. Палітра така ж різноманітна, як Російська Анархія, що й личить людині, причетній до її зародження. Ви, певно, вже знаєте цю історію. Фашистський Райх перерізав Союзові горло, а Бухарін безслідно зник. Більшість уважала його мертвим. Та більшість помилялася. Насправді Бухарін сховався в самотній тундрі земель, якими колись правив, зломлений власними невдачами. Він загубився серед своїх поразок і ніс у собі безліч питань, яких не вмів поставити, а хотів лише відповідей. Роки були жорстокими, а пошуки відчайдушними. Та знайшовши відповідь, він уже ніколи не став колишнім.\n\nЗустрічайте Ніколая Бакхаріна - вже не старезну людську руїну, а мудрого єдинорога, який дістав нове життя й дивиться в майбутнє. Бакхарін прагне все виправити, обернути назад помилки минулого й наново створити Совєцький Союз, вільний від давніх вад, аби проголосити світові знайдену ним відповідь:\n\n§CДружба - це диво.§!\n\n§YПортрет:§! Neither з команди Equestria at War."
 
 POLITICS_ALICORN_BUCKHARIN_DESC: "Алікорн - найпрекрасніша й наймогутніша з усіх істот на Землі. Створіння чистої сили й магії, безсмертне та великодушне, живий бог, що ходить одним світом із людьми й поні. Маючи літні здібності найпрудкіших пегасів, магію наймудріших єдинорогів і силу наймогутнішого коня, лише найвидатніші герої всього понійства коли-небудь сягають таких висот. Ніколи ще людина не здобувала подібної слави.\n\nНіколай Бакхарін - не проста людина.\n\nВід провідника однієї з наймогутніших держав світу до зганьбленого невдахи й назад, старий Головпоні тепер згадує колишнє життя не більш як кошмар, від якого врятувався, часи до кристалів та Еквестрії. Йому знадобилася вся сила, щоб звести міст між людьми й поні, коли два світи зіткнулися, та його успіх незрівнянний, а велика праця заслуговує великої нагороди. Тож принцеси Еквестрії вирішили дарувати йому подобу алікорна, зробивши Бакхаріна наймогутнішим поні на Землі.\n\nОглядаючи свої землі, Бакхарін пам'ятає боротьбу сорокових і п'ятдесятих. Пам'ятає звитяги останніх років, коли підніс Росію з руїн у нову добу. Він справді пізнав просту істину й несе її із собою в славетне майбутнє - знання, що дружба - це диво.\n\n§YПортрет:§! Neither з команди Equestria at War."
 
 POLITICS_ALEXANDER_MEN_OMO_2022_DESC: "Колись у північних комунах віряни молилися за одну людину. Казали, що він прийде їх урятувати, відродить їхній дух і принесе мир на їхні землі. Його звали Отцем.\n\nНатомість вони дістали поні.\n\nЗневірений Алєксандр Мєнь повернувся до проповідництва. Та так званий «Гармонійний Союз» виявився новим Содомом, де гармонію творили лише звірячі перетворення й неприродна магія. Силою Господньою його належало здолати.\n\nТак Алєксандр Мєнь розпочав битву словами. Згодом він став неофіційним представником усього людства, повсякчас проповідуючи проти крайнощів Бакхарінового уряду. Його місія здавалася приреченою, та неймовірним чином Росія дослухалася. У мить кризи народ вигнав Бакхаріна, замінивши його своїм давнім Отцем.\n\nТепер Гармонійний Союз очолює людина. Він уже оголосив зміни, заборонив нечестиві кристали й сформував суто людський кабінет. За кілька митей Гармонійний Союз вирвано з доби поні, дружби й магії. На краще чи на гірше, але він повернувся в добу Людей."
 
 OMO_2022_Various_Leaders: "Гармонійна Президія"
 POLITICS_VARIOUS_LEADERS_OMO_2022_DESC: "У гонитві за Гармонією Ніколай Бакхарін не зважав на власні творіння, що зрештою й призвело до його падіння. Коли поні його країни здійняли крик, а їхні потреби геть занедбали, радикальні поні з Президії відгукнулися, строєм випровадили Бакхаріна з посади й перебрали цілковиту владу над державою. Та після цього постало багато питань. Хто стане новим провідником? Як вони подолають кризу, що сягнула вершини? Куди рухатися далі?\n\nЖодне не дістало відповіді. Спочатку між людьми й поні подекуди спалахувало насильство, та потім не настали ні анархія, ні беззаконня, ні масові вбивства з помсти, ні спустошення краю. Потім настала тиша. Люди розійшлися по домівках. Поні розійшлися по домівках. Зліплене нашвидкуруч керівництво мовчки підтримувало роботу держави, бо більше нічого не лишалося. Люди відмовляються знатися з поні, а поні - з людьми. Жалюзі опущено, двері грюкають, навколо лише косі погляди. Дехто цурається навіть представників свого виду. Бо саме почуття дружби померло.\n\nі §CГармонія§!. §eзазнала краху.§!"
 
 OMO_2022_BRY_IRK_Harmonic_Presidium: "Гармонійна Президія"
 
 OMO_2022_Alexei_Rykov: "Алєксєй Риков"
 OMO_2022_Alexei_Rykov_hog_desc: "§YПрем'єр Гармонійного Союзу\nГармонійний комунізм§!\n§F--------------§!\n§LЯкщо про Алєксєя Івановіча Рикова щось і можна сказати напевно, то це те, що старість не послаблює відданости справі. Народжений 1881 року, Риков є найстаршим досі активним членом ВКП(б). Частково він завдячує цим омолоджувальній дії поніфікації, та передусім - своїй повній і беззастережній відданості комуністичній справі.\n\nАлєксєй Риков служив у старому Совєцькому Союзі Бухаріна його прем'єром, другою людиною після самого Бухаріна. Він лишався вірним Совєцькому Союзові до самого його краху під німецьким чоботом. Багато хто гадав, що старий помер, та вони мертво помилялися. Довгі роки він жив у вигнанні на далеких просторах сибірської тундри, аж до того доленосного дня, коли одержав дивного листа, а слідом за ним до нього сюрреалістично завітав балакучий кінь... який виявився старим Головою, самим Ніколаєм Бакхаріном.§!"
 
 OMO_2022_Ponyina_Zhemchuzhina: "Поніна Жемчужина"
 OMO_2022_Ponyina_Zhemchuzhina_for_desc: "§YМіністерка закордонних справ\nГармонійний комунізм§!"
 
 OMO_2022_Mikhail_Tomsky: "Міхаїл Томскій"
 OMO_2022_Mikhail_Tomsky_eco_desc: "§YМіністр фінансів\nГармонійний комунізм§!"
 
 OMO_2022_Vasily_Blyukher: "Васілій Блюхер"
 OMO_2022_Vasily_Blyukher_sec_desc: "§YМіністр оборони\nГармонійний комунізм§!"
 
 OMO_2022_Lili_iz_Doliny: "Лілі із Доліни"
 OMO_2022_Lili_iz_Doliny_desc: "§LПро Лілі із Доліни, чиє ім'я приблизно означає «Лілія долини», відомо напрочуд мало. Найраніша відома згадка її імені містилася під віршем у газеті, надрукованій у Центральносибірській Республіці до її падіння. Після цього її ім'я майже ніде не з'являлося, і хоча вона стверджує, що вступила до Республіканської армії, доказів цього небагато.\n\nЛілі із Доліни - лише псевдонім, а справжнє ім'я вона береже в таємниці. Коли Бакхарін закликав усіх, хто прагнув кращого життя, вона відгукнулася. Вона служила лейтенанткою, але швидко пішла на підвищення, проявивши себе в обороні далекосхідного села від нападу бандитів. Це разом із гострою потребою в здібному командуванні привело її на нинішню посаду ґенералки Гармонійного Союзу. Її відданість Гармонії та всьому понійству безсумнівна, і вона не зупиниться ні перед чим, доки гармонійний комунізм не простягнеться від порту Владивостока до Москви.\n\n§YПортрет:§! Neither з команди Equestria at War.§!"
 
 OMO_2022_Sharmy: "Шрами"
 OMO_2022_Sharmy_desc: "§LШрами - чиє ім'я російською означає «шрами» - є наслідком надзвичайно рідкісної генетичної мутації під час поніфікації, що, за повідомленнями, трапляється лише з одним на тисячу піддослідних. Представники його виду мають риси кажанів: слабкий зір, загострений слух, крила зі шкіроподібного матеріялу та помітні ікла. Науковці називають їх «тестралами», хоча нині їх частіше знають як кажанопоні.\n\nПро життя Шрамів до поніфікації відомо небагато. Судячи з його невпізнаваного іноземного російського акценту, він, найпевніше, виріс не в Росії, хоч ґенерал із нього здібний. За його словами, всім досить знати, що він, трясця, добрий ґенерал, і нічого більше.\n\nА ще він... полюбляє носити із собою ляльку зебри з фіолетовим волоссям і фіолетовими смугами, називаючи її своїм «Провідником», хоч би що це означало. Ми не розпитуємо.\n\n§YПортрет:§! Neither з команди Equestria at War.§!"
 
 OMO_2022_Yuri_Gagarin: "Юрій Ґаґарін"
 OMO_2022_Yuri_Gagarin_desc: "Юрій Ґаґарін народився у скромному селі Клушино, а з початком Великої Вітчизняної війни його родина втекла на Далекий Схід. Відтоді він жив тихим, нічим не примітним життям в Іркутску. Коли Байкал увійшов до Гармонійного Союзу, Ґаґарін охоче зголосився на поніфікацію. Юрій Ґаґарін переродився величним пегасом.\n\nВін став єдиним пегасом, здатним виконати те, що науковці називають «звуковим веселковибухом»: пегас розганяється до такої швидкости, що за ним розквітає грандіозне видовище барв. Поки що єдине пояснення цього явища полягає в тому, що це можуть бути сліди еквестрійської магії, яка тим чи іншим способом потрапила на нашу землю.\n\nА ще він чомусь усюди ходить у скафандрі."
 
 OMO_2022_Ivan_Yumashev: "Іван Юмашев"
 
 OMO_2022_Nestor_Lunin: "Нєстор Лунін"
 
 OMO_2022_Its_a_fucking_BT7: "БТ-7"
 OMO_2022_Its_a_fucking_BT7_desc: "§LПісля підписання Сталліонґрадського договору поні з іншого боку наполягли, щоб передати нам танковий підрозділ, геть тотожний БТ-7 часів Великої Вітчизняної війни, хіба що перероблений так, аби всередині сиділи поні, а не люди. Вони без угаву торочили, ніби цей танк здатний до «ґеніяльного стратегічного плянування», хоча це, зрештою, лише довбаний танк.\n\nЗвісно, ми вважали поні з того боку божевільними, доки один офіцер не вирішив кинути всередину машини мапу наших можливих ворогів на заході. Танк заревів, ожив і виплюнув мапу назад, але тепер її всю було майстерно списано лініями наступу, маневрами, прогнозами руху ворога, логістикою, усім на світі. Можливо, цей світ справді остаточно збожеволів.§!"
 
 ### National Focuses

 ## Warlord Stage Tree
 OMO_in_the_endless_tundra: "У безкраїй тундрі"
 OMO_in_the_endless_tundra_desc: "Я тікаю з Москви. Вислизаю чорним ходом, поки фронт розвалюється.\n\nЯ стою перед багаттям. Палю нечисленні документи, що посвідчують мою особу й таврують мою поразку.\n\nЯ вже відвертаюся, аж раптом бачу його. Кристал. Він мерехтить серед полум'я. Я присідаю, простягаю тремтячу руку й відчуваю, як від дотику моє тіло викривлюється та змінює подобу. Коли біль стискає мене, а реальність рушиться, я відчуваю, як сором розвіюється. Я розумію, як урятувати Росію. Я маю §Cту саму відповідь§! на питання моєї країни. §CВідповідь§!, на яку ніхто не сподівається."
 
 OMO_a_pink_wind_in_the_far_north: "Рожевий вітер далекої півночі"
 OMO_a_pink_wind_in_the_far_north_desc: "Так, я інакше виглядаю. Після того як усе моє єство викривилося неймовірними способами, я ще й мислю інакше. Та це не так уже й погано. У цій подобі я відчуваю, як мене сповнює нова енергія. Я рішучіше, ніж будь-коли, прагну допомогти кожнопоні в Росії, хоч би як голосно вони кричали й хоч би як швидко тікали, побачивши мене!\n\nЛюдина, яку вони знали як Бухаріна, мертва. З попелу її невдач постає жеребець Бакхарін. Я вирву перемогу з пазурів поразки. Я принесу §CГармонію§! всім бідним, пригнобленим народам колишнього Совєцького Союзу. Світ іще побачить, на що здатні росіяни, коли працюють разом!"
 
 OMO_rally_the_old_guard: "Зібрати стару гвардію"
 OMO_rally_the_old_guard_desc: "У тій дедалі меншій частині мого розуму, яка ще пам'ятає, як воно - бути людиною, я часом згадую своїх великих друзів із Президії. Молотова. Рикова. Томского. Тоді ми гадали, що все збагнули. Думали, ніби революційна авангардна партія може наділити робітничі кляси політичною свідомістю, потрібною для повалення капіталізму.\n\nА виявилося, що все це дурниці! Для успішного повалення капіталізму потрібне не леніністське революційне керівництво, а дружба. Багато дружби. Я мушу розшукати найближчих уцілілих союзників, розповісти їм цей факт і показати найновішу сходинку розвитку марксистської думки. Скептики можуть назвати нас ухильниками, але ми доведемо, що майбутнє за гармонійним комунізмом!"
 OMO_rally_the_old_guard_tt: "§CСтарих друзяк покличуть разом зібрати перший понійний кабінет.§!"

 OMO_convince_the_new: "Переконати нових"
 OMO_convince_the_new_desc: "Та не можу ж я покладатися лише на старих друзів-комуністів, правда? Ні. Мені потрібні чудові нові друзі. Мені потрібно, щоб кожнопоні працювали разом над фантастичним новим майбутнім Росії. Коли всі народи працюють разом, можливо все! Зрештою, саме в цьому сила §CГармонії§!.\n\nЯ поскачу до кожного села на Далекому Сході й спробую переконати якнайбільше людей прийняти мою нову науку дружби та спільноти. Багатьох відвертатиме моя нова подоба, а банальні слова про командну працю навряд чи здадуться їм розв'язком усіх проблем, та я знаю, що зможу їх прихилити. Я переконаю їх, що це не лише моя історія, а й їхня!"
 
 OMO_the_first_all_ponies_council_of_the_harmonic_union: "Перший Всепонійний Конґрес"
 OMO_the_first_all_ponies_council_of_the_harmonic_union_desc: "Не знаю як, не знаю яким чином, але мені вдалося. Я зібрав велику групу людей, які вірять у мене й у моє бачення майбутнього. Нарешті нас досить, щоб розпочати працю над принесенням §CГармонії§! до Російської анархії.\n\nТа самими дружніми розмовами й довгими переходами риссю через сніги далеко не зайдеш. Мені потрібні структури та установи, які допоможуть утілити моє бачення Росії. Настав час скликати новий урядовий орган: §CПерший Всепонійний Конґрес Гармонійного Союзу§!. Велична назва для величної мрії, і нам доведеться тяжко працювати, щоб бути її гідними."
 OMO_the_first_all_ponies_council_of_the_harmonic_union_CET: "£decision_icon_small Відкриває використання £omo_crystal_texticon  §hкристалів§! для §Yрозвитку§! держави."
 
 OMO_expanding_the_crystal_mines: "Розширити кристальні копальні"
 OMO_expanding_the_crystal_mines_desc: "В осерді нашого відтворення суспільства лежить одна дивовижна річ:\n\nКристали.\n\nБув час, коли жодна жива істота на цій планеті не знала про поклади цього дорогоцінного матеріялу, розсипані краєвидом Північного Сибіру. З приходом нашого відважного провідника Бакхаріна ми дістали й здатність знаходити незліченні кристальні жили, які лише чекають, щоб їх видобули й спрямували на створення нового світу за його задумом. Та спершу ми мусимо міцніше взяти в копита те, що вже маємо. Усі наші нинішні кристали походять з одного родовища, чий потенціял набагато більший за те, що ми нині використовуємо. Його слід розширити, як і постановив Всепонійний Конґрес."
 
 OMO_search_for_new_sources: "Шукати нові джерела"
 OMO_search_for_new_sources_desc: "Тепер, коли до наших складів і сховків щодня тече сталий потік кристалів, час розширити заготівлю цих незамінних самоцвітів. Декотрі інженери, що натрапили на нашу молоду цивілізацію, зуміли виготовити з кристалів пристрої для пошуку нових жил.\n\nУсе, що потрібно цим пристроям, - аби котрепоні пронесло їх крізь суворі ліси, пагорби й тундру сибірських просторів. Саме тому Всепонійний Конґрес створив Кристалопошукові загони, невеликі групи з найдосвідченіших мисливців і слідопитів Півночі. Їх відправлять у сибірську пустку шукати кристали й викликати гірничі бригади, щоб почати розробку. Ці ресурси знадобляться нам, аби пережити прийдешню бурю..."
 
 OMO_send_workers_to_the_mines: "Відправити робітників у копальні"
 OMO_send_workers_to_the_mines_desc: "Створення та розширення кристальних копалень уже повним ходом, тож нашим десятникам доручили якнайкраще впорядкувати роботу на місцях видобутку. Випробувавши майже всі можливі способи, вони одностайно доповіли: найбільше вузьке місце в переміщенні кристалічного матеріялу - це кількість понісили, залученої до виробничого ланцюга. Її просто бракує.\n\nНа щастя, поні зі справними копитами нам не бракує. Нам доконче потрібно якнайшвидше дістати якнайбільше кристалів, тож багатьох поні з менш важливих робіт слід перевести до копалень.\n\nЦими кристалами ми визволимо братів, що страждають на півдні. До праці, товариші!"
 
 OMO_the_crystals_miners_trade_union: "Профспілка кристальних гірників"
 OMO_the_crystals_miners_trade_union_desc: "Рим збудували не за день, як не збудують за день і нашу нову гармонійну Росію. Ми мусимо закласти її підвалини, створивши профспілку кристальних гірників. Ця організація дасть пролетарям змогу спільно висловлювати свої турботи, а урядові - дієво на них відповідати."
 
 OMO_delay_labor_organization: "Відкласти організацію праці"
 OMO_delay_labor_organization_desc: "Сумна правда полягає в тому, що магічні кристали з гір потрібні нам понад усе. А якщо ми відвернемося на такі речі, як організація праці, видобуток кристалів може обвалитися.\n\nКолись ми матимемо стільки кристалів, скільки забажаємо, і зможемо організувати пролетаріят, створити соціялістичну державу чи зробити ще щось до душі. А доти робітникам доведеться почекати - нашим прикрим пріоритетом мусять бути кристали."
 
 OMO_alernative_uses: "Інші застосування"
 OMO_alernative_uses_desc: "Кристали, кристали, кристали. Вони вже роблять так багато. Перетворюють нас на ці неймовірні жереб'ячі подоби, набагато сильніші за попередні. Дарують магічні сили, яких людство жадало тисячоліттями. Та має бути щось іще. Наші науковці мусять глибше дослідити кристали, відкрити кожну їхню грань і переконатися, що ми справді оволоділи їхньою силою. Лише розкривши справжню силу кристалів, ми зможемо наділити нею світ гармонії."
 
 OMO_the_councils_inaugural_session: "Установче засідання Конґресу"
 OMO_the_councils_inaugural_session_desc: "Тепер, коли §CПерший Всепонійний Конґрес Гармонійного Союзу§! сформовано, час скликати його перше в історії засідання.\n\nЦе великий крок для порівняно невеликого гурту друзів, який ми виплекали, і засідання без сумніву буде цікавим.\n\nЗрештою, перше засідання Конґресу очолюватиме поні. Таке побачиш не щодня.\n\nТа що там, узагалі ніколи.\n\nЛишається сподіватися, що все мине добре."
 
 OMO_offer_ponification: "Запропонувати поніфікацію"
 OMO_offer_ponification_desc: "Бакхарін запропонує народам Росії дещо особливе. Відчувши на собі силу тих дивовижних кристалів, він зрозумів, що ми мусимо зробити.\n\nМи мусимо поширити цей дар на решту Росії. Дати людям нагоду скинути смертну подобу й піднестися до подоби поні. Полишити похмурий світ болю й ненависти та прийняти магічне майбутнє, що лежить перед ними. Показати їм справжню силу дружби."
 
 OMO_only_ponies_in_charge: "При владі лише поні"
 OMO_only_ponies_in_charge_desc: "Лише поні здатні по-справжньому збагнути, що означає жити в гармонії. Лише поні взагалі здатні зрозуміти саму ідею гармонії, і лише вони можуть утілити її в усій повноті. Попри ці вже встановлені факти, чимало владних посад на землях під нашим урядом досі посідають люди. Це, звісно, неприйнятно, адже наша держава процвітатиме лише тоді, коли житиме за засадами гармонії. Тож усі адміністративні посади мають віддаватися лише поні й нікому більше, а задля нашого спільного процвітання всіх людей на цих посадах буде негайно звільнено."
 
 OMO_admit_the_holdouts: "Прийняти непоступливих"
 OMO_admit_the_holdouts_desc: "Хоч товариш Бакхарін першим зголосився перетворитися на поні, не всі товариші пішли його копитослідами. Багато росіян досі чіпляються за людську подобу й бояться перетворення через якийсь недолугий страх перед балакучими поні. Та багато з них в усьому іншому є вірними й щирими товаришами. Тому ми маємо прийняти цих людей до нашої політичної системи, щоб вони служили справі гармонійного комунізму на повну силу."
 
 OMO_defining_harmony: "Визначити Гармонію"
 OMO_defining_harmony_desc: "Наступне питання, яке має обговорити Конґрес, стосується важливої підвалини: що ж таке Гармонія? Які її засади, які цілі, за що саме ти борешся, коли борешся за Гармонію? Товариш Бакхарін має щодо цього певні думки, та досі не сів і не виклав усі точні ідеї на папері. Конґрес почне визначати Гармонію як ідеал, щоб ми могли йти вперед під її стягом."
 
 OMO_spreading_the_word: "Поширити звістку"
 OMO_spreading_the_word_desc: "Однією з реалій нашого молодого Гармонійного Союзу є те, що він, м'яко кажучи, ізольований. Поки ми зміцнювали новонароджену державу, за її межами про нас і наші переконання знали небагато людей. Час це виправити, бо ніхто не стане на наш бік, якщо не знає, що це за бік. Ми негайно відправимо людей ширити звістку про наш рух, бо далеко не підемо, якщо майже ніхто не буде готовий за нього боротися."
 
 OMO_a_utopian_ideal: "Утопійний ідеал"
 OMO_a_utopian_ideal_desc: "Як не крути, Гармонія досконала. Мирне суспільство, що обстоює співпрацю та дружбу між усіма народами, вільне від ненависти й відкрите для всіх. Наш народ мав би прагнути такої чудової речі, та ніколи не прагнутиме, доки не побачить її в усіх подробицях. Тепер, коли ми трохи чіткіше все визначили, час показати людям у наших кордонах, які ж прекрасні Дружба та Гармонія!"
 
 OMO_the_new_pink_army: "Нова Рожева Армія"
 OMO_the_new_pink_army_desc: "Ми віримо в гармонійний комунізм, єдність і рівність усіх істот, але це не означає, що ми наївні пацифісти. Хаос, вічний ворог Гармонії, квітне на руїнах Старого Союзу. І коли слуги Хаосу відвернуться від дружби, їх зустрінуть багнети!\n\nМи створимо нову армію, сучасну армію, армію з людей і поні, об'єднаних під рожевим стягом Гармонії. Тепер жоден ворог не уникне поразки й жоден друг не лишиться без захисту."
 
 OMO_create_the_pony_brigades: "Створити понійні бригади"
 OMO_create_the_pony_brigades_desc: "Через фізичні відмінності між поні та людьми об'єднувати їх в одному підрозділі було б нерозумно. Натомість для нових понійних добровольців ми створимо Понійні бригади. Ці вояки стануть елітним кістяком Рожевої Армії, рухатимуться швидше й битимуться завзятіше за сучасних їм людей."
 OMO_create_the_pony_brigades_CET: "Формує §Y3§! дивізії, кожна з §Y6§! £nato_unit_pony_onhooves_icon_small §hкопитних батальйонів§!.\n£nato_unit_pony_onhooves_icon_small §hКопитні батальйони§! відтепер §Gдоступні§! в шаблонах дивізій."
 
 OMO_the_human_volunteers: "Людські добровольці"
 OMO_the_human_volunteers_desc: "Виявляється, чимало людей цікавляться поні, а декотрі ними просто-таки зачаровані. Здебільшого це юнаки й суспільні вигнанці, які навіть складають рейтинги улюблених поні та носять одяг на знак підтримки понійства.\n\nМожливо, ці люди й не вершки суспільства, та для поля бою вони годяться. Ми навчимо їх тримати зброю. Навчимо засад війни в Арктиці. Вишколимо в питаннях гігієни та фізичної форми. Невдовзі ці люди будуть готові вступити до Гармонійного Союзу, а Союз стане від цього лише міцнішим."
 OMO_the_human_volunteers_CET: "Ми завербуємо цих юнаків воювати за Гармонійний Союз: кожна дивізія матиме §Y8§! £GFX_nato_unit_infantry_icon_small §hлюдських батальйонів§!."
 
 OMO_rifles_for_hooves: "Рушниці для копит"
 OMO_rifles_for_hooves_desc: "Понійні бригади можуть бути вірними та відданими нашій справі, та без рушниць їхня бойова ефективність обмежена. Ми мусимо почати виробляти зброю, щоб Бригади могли показати праведність гармонійного комунізму тим, хто ще не вірить. Деякі члени партії висловили побоювання, що поні не можуть тримати рушниці, та невдовзі вони відкриють: силою дружби можливо все."
 
 OMO_rifles_for_hands: "Рушниці для рук"
 OMO_rifles_for_hands_desc: "Зброя для поні? Це скрундне питання. А от зброя для людей - проста річ. Люди становлять половину нашого населення, як і половину збройних сил. До того ж вони мають пальці, зокрема великі. Усі наявні конструкції зброї створено саме з огляду на це, тож виробництво людської зброї може стати простим запасним варіянтом на додачу до понійної.\n\nЯк поні примудряються тримати предмети руками, ми навіть не наважуємося пояснювати. Та хай там як, ми мусимо виробляти зброю для людей."
 
 OMO_interspecies_cooperation: "Міжвидова співпраця"
 OMO_interspecies_cooperation_desc: "Гармонія на цілі милі перевершує людське розуміння, а її магічна привабливість, як у переносному, так і в буквальному значенні, лишається для людей незбагненною. Та міжвидова співпраця однаково є основною засадою гармонії, а поки примара фашизму досі вештається неподалік, співпраця поні й людей перед обличчям реакційної агресії стає дедалі важливішою. Зрештою, як суспільство може називатися єдиним із гармонією, якщо його народи не живуть разом гармонійно?"
 
 OMO_the_first_trial: "Перше випробування"
 OMO_the_first_trial_desc: "У нашій подорожі до революції гармонії на сплюндрованій землі Росії нам понад усе потрібне одне - сильне й здібне сухопутне військо, що захистить від численних ворогів Гармонії в усьому світі. Нещодавно ми спромоглися зібрати сили, віддані нашій справі, та лишилося одне велике питання: чи вміють вони взагалі воювати?\n\nНа щастя, ми маємо зручний зразок для випробування війська: купу пересічних бандитів, які безперешкодно грабують усю північ Далекого Сходу. Відправмо Армію Гармонії й улаштуймо їй справжнє бойове хрещення, а здобутий досвід використаймо в майбутніх битвах за Гармонійний Світовий Союз."
 
 OMO_a_beacon_in_the_north: "Маяк на півночі"
 OMO_a_beacon_in_the_north_desc: "Після стількох тяжких зусиль і самовідданої праці ми досягли свого. Сибірські пустки, що роками після розпаду Союзу та початку Анархії не знали жодної влади, знову постали як обличчя нового гармонійного руху. Живлена магією та силою дружби, наша держава квітне як маяк Гармонії на крижаній півночі. Та на Далекому Сході, звісно, не все гаразд. Фашисти скніють у фарсі та трагедії, наші заблуклі сини сваряться в Іркутску й Бурятії, а дехто й досі нидіє серед лютого холоду. На кордонах Гармонію оточує безліч загроз, тож час діяти."
 
 OMO_looking_outwards: "Поглянути назовні"
 OMO_looking_outwards_desc: "Підвалини закладено. Роботу виконано. Наше гармонійне суспільство створено, та воно досі лише одне з багатьох. Якщо вся Росія має об'єднатися в дружбі, нам доведеться поглянути за власні кордони й почати розширюватися. Ми маємо кількох «сусідів», та вирішили спершу завітати на Камчатку, де осіли залишки Тихоокеанського флоту. Зробімо перший крок уперед!"
 OMO_looking_outwards_tt: "£decision_icon_small Відкриває §Yрішення§!, що дають змогу завчасно розвивати нашу §Gекономіку§! за допомогою £omo_crystal_texticon  §hкристалів§!."

 OMO_painting_the_red_fleet_pink: "Пофарбувати Червоний флот у рожеве"
 OMO_painting_the_red_fleet_pink_desc: "Ми здобули першу перемогу в поширенні Гармонії: Камчатка й пошарпані залишки Тихоокеанського флоту тепер у наших копитах. Поки ми працюємо над належним приєднанням їх до нашої держави, слід зробити ще більший крок до справжньої інтеґрації. Понад усе наших нових братів і сестер дивують наші звичаї. Вони майже нічого не розуміють у Гармонії, тож поширити серед них магію дружби належить нам."
 OMO_unlock_state_ponification_tt: "Ми можемо почати надавати новим областям статус осердних за допомогою £omo_crystal_texticon  §hкристалів§!."

 OMO_ready_the_army: "Підготувати армію"
 OMO_ready_the_army_desc: "У прагненні здолати сили дисгармонії ми пройшли тяжку боротьбу. Тиждень за тижнем, місяць за місяцем нас переслідували постійні негаразди... та, на щастя, ми маємо друзів, які нам допоможуть. Коли ми працюємо разом і проговорюємо свої проблеми, то можемо з'ясувати, що саме потрібне для досягнення наших цілей!\n\nУ цьому випадку друзі чітко сказали, що нам потрібно: зброя. Багато, дуже багато зброї та армія, здатна нею орудувати. Лише опанувавши силу неймовірного, схваленого державою насильства, ми зможемо створити світ, безпечний для дружби й гармонії!"

 OMO_speak_to_the_masses: "Звернутися до мас"
 OMO_speak_to_the_masses_desc: "Лишенько, ми так захопилися всіма нашими друзями в Президії, що забули про обов'язки перед народом! Несправедливо тримати його в невіданні щодо роботи й прагнень нашого уряду. Люди мають повне право тішитися Гармонією, що принесла нам стільки радости.\n\nВиправмо це! Виступімо з великою, величною промовою, щоб усі в Росії могли долучитися до єдиного гармонійного союзу!"

 OMO_up_to_date_intelligence: "Свіжі розвіддані"
 OMO_up_to_date_intelligence_desc: "Візьміть будь-яку простеньку мапу світу й побачите, що всі частини Росії, які не загарбали фашистські покидьки чи імперіялістичні пси, лежать під великою чорною плямою з написом «Російська анархія». Це аж ніяк не віддає належного численним державкам воєначальників, що примостилися на кістках Союзу, та цілком зрозуміло, коли сталі кордони в Анархії є радше побажанням. Хтось постійно відгризає дрібні шматки землі, чи то в сутичці, чи просто з-під носа попереднього володаря, і це добряче ускладнює життя.\n\nЩоб цьому зарадити, час привести до ладу нашу розвідку й почати одержувати свіжі донесення про становище на південному кордоні. Коли ми знатимемо, що робочі мапи не такі старі, як товариш Бакхарін, військові пляни заберуть трохи менше нервів."

 OMO_ponies_at_the_ready: "Поні напоготові"
 OMO_ponies_at_the_ready_desc: "Ого! Тепер усе складається докупи! Армія готова! Люди розвішують гарненькі прапорці та стрічки. Уся країна єдина, мов один колектив, мов одне коло друзів!\n\nА тепер час силою розширити це коло дружби! Ми рушимо на південь і визволимо народ від його неприязни до Гармонії. Ми розіб'ємо кайдани несусідськости. Ми покладемо край гнітові самотности!"
 OMO_ponies_at_the_ready_CET: "£decision_icon_small Ми почнемо поширювати §CГармонію§! по всьому §YРосійському Далекому Сходу§!."
 
 OMO_the_issue_of_parasprites: "Проблема параспрайтів"
 OMO_the_issue_of_parasprites_desc: "Надходять повідомлення, що милі кругленькі комашки з іншого світу, яких ми досліджували... втекли. Завдяки здатності нестатево розмножуватися за лічені хвилини проблема одного бунтівного «параспрайта», що постала лише кілька годин тому, обернулася на велетенський нечестивий рій, який пожирає останні крихти їжі в Північно-Східному Сибіру.\n\nОй."

 OMO_observing_the_other_world: "Спостерігати за іншим світом"
 OMO_observing_the_other_world_desc: "Коли німці почали досліджувати космос, їхнім головним способом вивчення було надсилання «роверів» - невеликих безпілотних дослідницьких машин, напханих приладами для збору відомостей про інший світ. Ми зробимо так само: відправимо ровери крізь портали в протилежний бік, щоб вони дослідили світ, звідки прийшла магія, яка так змінила наше суспільство, й розповіли про нього більше. А коли настане слушний час, відправимо власних поні складати мапи цього іншого світу."
 OMO_observing_the_other_world_trigger: "§RГолод через параспрайтів§! подолано"

 OMO_salvage_what_we_can: "Урятувати все можливе"
 OMO_salvage_what_we_can_desc: "Хоч рої комах завдали величезної шкоди врожаям і деревам, прийдешні хуртовини загнали їх у сховки й дали нам коротку нагоду оцінити втрати та оговтатися. Загони єдинорогів і земних поні відправлено рятувати все, що можливо, й спробувати зігнати параспрайтів у місця, де їх буде легше винищити."

 OMO_send_in_the_army: "Ввести армію"
 OMO_send_in_the_army_desc: "Стріляти в параспрайтів із рушниць до жалю неефективно: у найкращому разі куля зачепить одного-двох, а в найгіршому весь рій знайде нову ціль. Та якщо ввести армію, озброєну злагодженою вогневою тактикою, артилерійськими снарядами з повітряним підривом і, найголовніше, вогнеметами, ми зможемо нищити крилату загрозу в лігвах, перш ніж вона знову вирветься назовні й почне розмножуватися."

 OMO_feeding_the_hungry: "Нагодувати голодних"
 OMO_feeding_the_hungry_desc: "Підготовка до можливого голоду давно є частиною нашої загальної довгострокової стратегії, та ця раптова надзвичайна ситуація змушує розпечатати запаси, якщо ми хочемо бодай якось нагодувати народ. Звісно, після цього ми будемо незрівнянно гірше готові до справжнього голоду чи іншої подібної трагедії. Це доказ, що надалі будь-які справи з іншим світом слід вести якнайобережніше."

 OMO_damage_report: "Звіт про збитки"
 OMO_damage_report_desc: "Втрачено 80-100% хлібних злаків, зернових та інших харчових культур усіх видів. Втрачено 15-30% загального деревного покриву. Близько 67% сільського населення переселилося до столиці, хоча це можна виправити. Майнова шкода на незліченні рублі. І найгірше: ця цілковито рукотворна трагедія забрала 15 життів. Центральний ланцюг командування лишився цілим, як і урядовий контроль загалом, і нам удалося уникнути великого голоду.\n\nІ все це через одну кругленьку комашку, яка випадково втекла з ящика горілки."

 OMO_this_can_never_happen_again: "Такого більше не станеться"
 OMO_this_can_never_happen_again_desc: "Ще один такий спалах без жодного перебільшення стане нашим кінцем. Ми надто довго досліджували магію та потвор з іншого світу, не дотримуючись навіть найпростіших запобіжних заходів карантину. Годі. Ця помилка станеться лише раз. Нашою найбільшою силою завжди був розум, і тепер ми його застосуємо."

 OMO_more_crystals_are_necessary: "Потрібно більше кристалів"
 OMO_more_crystals_are_necessary_desc: "Спадає на думку, що для більшого порталу без проблем із нестабільністю нам, ну, знадобиться більше кристалів. Вони невіддільні від якихось там механізмів роботи порталу, а тепер іще потрібні для створення більшого. Отже, якщо казати прямо, нам справді доведеться піти й пошукати ще кристалів. Значно більше."

 OMO_finding_them: "Знайти їх"
 OMO_finding_them_desc: "Так, ми це вже казали, але варто наголосити ще раз: просто зараз нам справді-справді потрібно до біса багато кристалів! А для цього, здається, доведеться вийти й знайти більше кристалів, бо, не бажаючи бити здохлого поні, а лише забити думку вам у голови, - нам ДУЖЕ потрібно більше кристалів."

 OMO_refining_the_crystals: "Облагородити кристали"
 OMO_refining_the_crystals_desc: "Ми назбирали вдосталь кристалів для будівництва порталу, та робота з ними показала, що вони могли б бути трохи менш... паскудними. Для нашого завдання вони насправді не надто ефективні. Можливо, їх можна якось облагородити, наприклад, огранувати по-різному. Слід випробувати кілька способів і з'ясувати, який вичавить із них найбільшу ефективність."

 OMO_recalibrate_the_harmonics: "Перекалібрувати гармоніки"
 OMO_recalibrate_the_harmonics_desc: "Після нещодавніх катастроф із порталом логічно припустити, що на певному етапі щось пішло якось дуже й дуже не так. Що саме, ми не знатимемо, доки не розберемося, тож час буквально повернутися до креслярської дошки. Математичні розрахунки слід виконати наново, перевірити, перевірити вдруге й заради певности перевірити ще раз. І якщо пощастить, ми більше не наскочимо на ті самі проблеми."

 OMO_interdimensional_theories: "Міжвимірні теорії"
 OMO_interdimensional_theories_desc: "Розумники виконали свій звичний номер і повернулися з висновком, що параспрайти, які пройшли крізь портал, походять з альтернативного виміру, багато в чому геть відмінного від нашого. Водночас ніхто насправді не розуміє, що це взагалі означає. Наукові справи часто спантеличують, а наші науковці анітрохи їх не полегшують. Доручимо людям у білих халатах розвинути свої теорії й подати їх так, щоб ми нарешті зрозуміли божевільні карлючки, які вони нам приносять."

 OMO_putting_theory_into_practice: "Утілити теорію на практиці"
 OMO_putting_theory_into_practice_desc: "Коли всю теорію про портальну технологію та інший вимір викладено, час перейти до головного питання: що ми взагалі можемо із цим зробити? Чи є способи спілкуватися з іншими вимірами, чи знають вони про наше існування, чи можна скористатися порталом для подорожей до інших світів? Можливості безмежні, та нам уже час визначити практичні цілі й вирішити, що саме ми здатні зробити."

 OMO_building_the_gateway: "Збудувати браму"
 OMO_building_the_gateway_desc: "Ми завершили теоретизувати про інші світи, підвищили ефективність кристалів і чітко визначили цілі. Сила Дружби та Гармонії значно прискорила наш науковий поступ, а тепер лишився останній крок: будувати! Ми створимо новий портал, більший і кращий за будь-який попередній. Магія зробила нас сильнішими, і ми скористаємося її дарами, щоб дізнатися, що насправді чекає на тому боці. А поки зберімо матеріяли й берімося до праці."

 OMO_searching_for_friends: "Шукати друзів"
 OMO_searching_for_friends_desc: "Еквестрія величезна й містить розвинені суспільства поні, грифонів, зебр, яків і, вочевидь, якихось комахоподібних створінь на ім'я «мінливці». Ми мусимо шукати друзів, які зможуть допомогти нам постачанням їжі, новими технологіями, а найголовніше - набуттям друзів. Зрештою, хіба не на цьому тепер ґрунтується наша ідеологія?"

 OMO_reaction_in_a_perfect_world: "Реакція в досконалому світі"
 OMO_reaction_in_a_perfect_world_desc: "Виявляється, навіть у майже досконалому світі з практично необмеженими ресурсами, миром і гармонією сили підлої реакції далі паразитують на здобутках робітників і селян. Дехто з наших теоретиків уже завзято пояснює, як реакційні переконання, попри свою нерозумність, усе одно пускають коріння в цивілізаціях із необмеженими ресурсами й магією, що долає дефіцит. Та для нас усе це означає лише одне: у взаєминах із державами Еквестрії слід бути обережними."

 OMO_first_contact_protocols: "Протоколи першого контакту"
 OMO_first_contact_protocols_desc: "Хоч наші спостереження виявили цікаві паралелі між культурою поні й нашою, вони досі є іншим народом з іншими віруваннями та звичаями. Ми маємо скласти протоколи перших взаємин із понійством. Перше враження завжди найважливіше, й так рано вскочити в халепу було б страшенною помилкою."

 OMO_what_to_offer: "Що запропонувати"
 OMO_what_to_offer_desc: "У давнину дві далекі цивілізації завжди починали першу зустріч з обміну цінними дарами рідних земель. Ми зробимо так само. Звісно, у магічному світі наші речі можуть виявитися не такими цінними, тож подаруємо інтелектуальні праці на кшталт «Маніфесту» й інших засадничих текстів нашого суспільства, а також книжки та статті про наші найвищі математичні й наукові досягнення.\n\nСподіваємося, вони будуть вражені...?"

 OMO_friendship_focus: "Дружба"
 OMO_friendship_focus_desc: "Поні Еквестрії мають так багато, що ми майже нічого не можемо їм дати, чого вони вже не мали б. У них більше ресурсів, більше робочих копит, більше магії... у них більше всього порівняно з нашою маленькою часткою світу.\n\nЄдине, що ми можемо їм запропонувати, - нашу вічну дружбу. Лишається тільки сподіватися, що цього буде досить."

 OMO_what_to_receive: "Що одержати"
 OMO_what_to_receive_desc: "Що ми можемо здобути від зустрічі з поні Еквестрії?\n\nЧи справді спілкування з ними принесе нам величезну користь?\n\nЯкщо ми можемо дати їм так мало, чи не стануть ці відносини однобічними?\n\nЧи справді зустріч із ними варта зусиль?\n\nВирушаючи в невідоме, ми ставимо собі всі ці питання й багато інших."

 OMO_harmony_focus: "Гармонія"
 OMO_harmony_focus_desc: "Поні Еквестрії знають Гармонію все своє життя. Натомість ми знаємо її лише кілька коротких років і завдячуємо цим винятково видінню товариша Бакхаріна.\n\nЗвісно, це означає, що поні Еквестрії знають Гармонію значно глибше й краще, ніж ми можемо собі уявити. Ці неймовірно розвинені знання принесуть нам велику користь, тож від подальшої співпраці ми лише виграємо."

 OMO_unity_focus: "Єдність"
 OMO_unity_focus_desc: "Зрештою, одне зрозуміло. Єдність наших двох народів може принести лише добро.\n\nРазом ми покажемо світові велич Гармонії!\n\nРазом ми битимемося проти сил ненависти й реакції!\n\nРазом сума наших двох частин набагато перевершить ціле!\n\nРазом наша дружба буде нездоланною!"

 OMO_prepare_the_gifts: "Приготувати дари"
 OMO_prepare_the_gifts_desc: "Наш союз з еквестрійцями не буде довершеним, доки вони не зможуть мирно прийти, відвідати нас і особисто поділитися мудрістю... гм, а чим замінити «особисто», коли йдеться про поні?\n\nПерепрошуємо, ми трохи відволіклися. Відкинувши цю мовну нісенітницю, ми взялися готувати підношення й дари, які вручимо еквестрійцям під час зустрічі. Лишається сподіватися, що їм сподобається, та товариш Бакхарін небезпідставно вірить: понад усе вони оцінять дух, із яким ці дари вручено."

 OMO_ready_to_greet_them: "Готові їх привітати"
 OMO_ready_to_greet_them_desc: "«Одну школу завершено, й настав час почати іншу».\n\nНарешті ми готові. Це забрало багато часу й вимагало тривалого навчання. Книжки на столі товариша Бакхаріна виростали в стоси завбільшки зі старі московські висотки, поки він день у день засиджувався до наступного ранку. Ці обов'язки не оминули навіть товаришів із меншою відповідальністю.\n\nТепер ми готові: ми зможемо зустрітися з ними й не виставити себе дурнями."

 OMO_introducing_ourselves: "Представитися"
 OMO_introducing_ourselves_desc: "«Настала слушна мить».\n\nПід наглядом товариша Бакхаріна ми збудували портал до Еквестрії. Дипломатичну службу Гармонійного Союзу підготовлено, й вона готова взятися до обов'язку здобути прихильність наших товаришів у Гармонії. Тож ступімо в наступний світ і привітаймо наших старших братів та сестер гармонійним способом.\n\nЗа мир, свободу та хліб - через поширення дружби й соціялізму!"

 OMO_the_treaty_of_stalliongrad: "Сталліонґрадський договір"
 OMO_the_treaty_of_stalliongrad_desc: "Наша праця перевершила найсміливіші мрії! Ми уклали офіційний договір із найближчими до нас за методами та світоглядом: шанованими товаришами зі Сталліонґрада. (Зважте, товариш Бакхарін трохи підозрює цього Сталевого Жеребця, але придушує сумніви заради збереження гармонії.)\n\nЗавдяки офіційному договору між Гармонійним Союзом і Сталліонґрадом наші народи тепер готові зустріти все, що їм випаде."
 OMO_the_treaty_of_stalliongrad_trigger: "Ми взяли під контроль §YРосійський Далекий Схід§!"
 
 ## Regional Trees
 # Political
 
 OMO_the_ponies_of_russia: "Поні Росії"
 OMO_the_ponies_of_russia_desc: "У нашому гармонійному суспільстві живе багато поні, наділених різними здібностями залежно від виду: польотом, магічними чарами чи надзвичайною силою. Щодня дедалі більше людей наважуються стати поні, і вони є шанованими членами нашого суспільства. Але вони нещасні.\n\nПоні відрізняються від людей, мають інші потреби, які суспільство намагається якнайшвидше задовольнити, проте поки не надто успішно. Повільні зміни непокоять багатьох поні, які відчувають, що система не здатна їм допомогти. Тож дедалі більше з них вимагають подальших змін на свою користь."
 OMO_the_ponies_of_russia_tt: "§RПоні стурбовані...§!"

 OMO_the_humans_that_remain: "Люди, що залишилися"
 OMO_the_humans_that_remain_desc: "У нашому гармонійному суспільстві, що не дивно, живе багато людей із найрізноманітнішими вміннями, зовнішністю й статурою, і кожного привів сюди власний життєвий шлях. Чимало людей відмовилися від поніфікації, і вони є шанованими членами нашого суспільства. Але вони нещасні.\n\nХоч у цьому світі людина є звичайною формою існування, багато хто відчуває відчуження через суспільні зміни на користь поні, які відбуваються надто швидко, щоб за ними встигати. Тому чимало людей непохитно вимагають, аби під час перетворення суспільства їх не залишили позаду."
 OMO_the_humans_that_remain_tt: "§RЛюди сповнені недовіри...§!"

 OMO_pony_superiority: "Вищість поні"
 OMO_pony_superiority_desc: "Та про що тут узагалі сперечатися? Якщо люди такі чудові, чому ж вони не літають, не чаклують і не демонструють неймовірної сили? Отож-бо - не можуть. Зрештою, недарма люди відмовляються від людськости й приймають понійство. За будь-якими мірками поні є досконалішим створінням - сильнішим, швидшим і навіть розумнішим, а людям до них далеко."
 OMO_pony_superiority_tt: "Завершення цього фокуса разом із фокусом §YЗберігати скромність§! §Rрозлютить людей§!.\n\n"
 OMO_pony_superiority_tt_lb: " \n"

 OMO_remind_them_of_their_origins: "Нагадати їм про їхнє походження"
 OMO_remind_them_of_their_origins_desc: "Ніхто не заперечує, що поні вражають і що ця подоба має свої переваги, але вони надто швидко забувають, що колись були людьми. Вони теж ходили на двох ногах і долали всі життєві труднощі без допомоги крил чи надзвичайної сили. Нехай досхочу тішаться своїми перевагами, але мусять пам'ятати, що мали їх не завжди."

 OMO_we_are_not_your_enemies: "Ми вам не вороги"
 OMO_we_are_not_your_enemies_desc: "Не вдаватимемо, ніби люди не мають жодних підстав боятися поні чи поніфікації. Це дивна новина, і труднощі з пристосуванням цілком зрозумілі, але передусім люди мають збагнути, що не слід ставитися до поні з огидою. Вони не якісь страхопоні, що повстали з безодні, спотворені жахливими побічними діями магії, вони наші друзі! Зрештою, дух Гармонії - це дух дружби, і людям стане спокійніше, коли вони зрозуміють, що їхні перетворені товариші залишилися їхніми друзями."

 OMO_remaining_humble: "Зберігати скромність"
 OMO_remaining_humble_desc: "Поні. Пхе! Можете скільки завгодно говорити про дружбу й Гармонію, але це звучить нещиро, коли ви аж так собою захоплюєтеся. Послухайте лишень, як вони говорять про себе, як чепуряться й вихваляються своїми здібностями, хизуються перед людьми крилами, рогами та сміховинною силою, наче ті багно під копитами. Якщо читати між рядків, то вони більше нагадують олігархів чи диктаторів, які виставляють напоказ багатство та владу перед підданими, ніж комуністів. Люди мають залишатися скромними, бо саме в цьому істинний дух Леніна й революції, а не в чотириногій манії величі, якою так полюбляють хвалитися поні."
 OMO_remaining_humble_tt: "Завершення цього фокуса разом із фокусом §YВищість поні§! §Rрозлютить поні§!.\n\n"
 OMO_remaining_humble_tt_lb: " \n"

 OMO_chaos_in_the_supreme_soviet: "Хаос у Верховному Совєті"
 OMO_chaos_in_the_supreme_soviet_desc: "Це клятий кошмар!\n\nНапруга у Верховному Совєті між фракціями поні та людей нарешті сягнула точки кипіння, і тепер вони ладні перегризти одне одному горлянки. Копита люто гупають об підлогу, руки шалено розмахують у повітрі, а голоси з обох боків стають дедалі гучнішими. Порохова бочка вже готова вибухнути, і просто диво, що досі нікого не застрелили, хоча й цього ще не можна виключати. Вони лютують дедалі дужче й самі заспокоюватися явно не збираються...\n\nТреба щось зробити, перш ніж їхній гнів стане некерованим."
 OMO_chaos_in_the_supreme_soviet_tt: "§RКриза докотилася до зали Верховного Совєту.§!"

 OMO_solidarity_in_struggle: "Солідарність у боротьбі"
 OMO_solidarity_in_struggle_desc: "Хоч наші чотириногі товариші якнайтісніше пов'язані з Гармонією, було б безглуздо стверджувати, що лише вони здатні її відстоювати. Зрештою, це суперечило б основним гармонійним засадам дружби! Справжня гармонія неможлива, якщо відкидати людей. І поні, і люди стануть частиною нашого гармонійного авангарду й разом, як друзі, долатимуть випробування революції!"

 OMO_the_true_vanguard: "Справжній авангард"
 OMO_the_true_vanguard_desc: "Поні та Гармонія нероздільні, це ясно кожному спостерігачеві. Вони яскраві, осяйні створіння, що повсякчас звеличують дива дружби й гордо демонструють унікальність нашої ідеології. Тож якщо вони є втіленням Гармонії, очевидно, що вони є й утіленням гармонійного комунізму. Друга половина назви нашої ідеології не менш важлива, і висновок безсумнівний: лише поні можуть виконувати обов'язки гармонійного авангарду революції."
 OMO_the_true_vanguard_tt: "Завершення цього фокуса разом із фокусом §YСтара гвардія стоїть непохитно§! §Rрозлютить людей§!.\n\n"
 OMO_the_true_vanguard_tt_lb: " \n"

 OMO_we_have_not_forgotten: "Ми не забули"
 OMO_we_have_not_forgotten_desc: "Деяким людям, схоже, здається, ніби під час перетворення поні спіткала якась катастрофа, що цілковито стерла їм пам'ять про людське життя, але поні нічого не забули. Ні, це люди не повинні забувати, ким є ці «поні-створіння». Це діти людей, батьки людей, їхні подружжя та кохані. Люди лише ще дужче відчужуються, коли поводяться так, наче поні замінили їхніх близьких, замість усвідомити, що поні і є їхніми близькими."

 OMO_the_old_guard_stands_firm: "Стара гвардія стоїть непохитно"
 OMO_the_old_guard_stands_firm_desc: "Замисліться на мить суто логічно. Рух за поніфікацію й пристосування суспільства до потреб поні розвивається із загрозливою швидкістю, можливо, навіть випереджаючи совєтський ідеал та його цілі. «Пристосування» - лише інша назва «ревізії», а ця нова порода гармонійної вищости поні неодмінно стане розсадником ревізіоністських ідей. Зрештою, лише люди обстоюватимуть справжній гармонійний комунізм: Стара гвардія проти Молодих жеребців. Тож наш обов'язок - тримати в шорах усіх ревізіоністів, які здіймуть голову."
 OMO_the_old_guard_stands_firm_tt: "Завершення цього фокуса разом із фокусом §YСправжній авангард§! §Rрозлютить поні§!.\n\n"

 OMO_calls_for_action: "Заклики до дії"
 OMO_calls_for_action_desc: "Лишенько, усе швидко виходить із-під копит! Поні по всьому Гармонійному Союзу припинили працювати й вриватися в тематично доречні пісні. Натомість вони вийшли на вулиці. З плакатами й мегафонами вони вимагають, щоб Бакхарін визнав природну вищість поні над людством.\n\nТака поведінка зовсім не дружня! Ба більше, вона дуже нечемна! З агітаторами доведеться поводитися надзвичайно обережно, інакше їхні гидкі витівки можуть призвести до повного розпаду держави й назавжди зганьбити нашу ідеологію. Або засмутити когось із людей! І те, й інше погано!"

 OMO_speak_to_the_ponies: "Поговорити з поні"
 OMO_speak_to_the_ponies_desc: "Усі поні страшенно засмучені. Відтоді як та заблудла жінка напала на Рикова, на вулицях спалахують бійки, а у Верховному Совєті точаться сварки. Навіть вечірки скасовують! Вечірки! Так тривати не може. Це не шлях Гармонії.\n\nНатомість треба все обговорити, як і личить друзям. Ми звернемося до членів неорганізованого блоку поні й спробуємо зрозуміти, як їм допомогти. Хоч у них немає єдиного провідника, а їхні претензії часом доволі заплутані, ми певні, що зможемо їх підбадьорити й повернути їм довіру до людей."

 OMO_the_human_delegation: "Людська делегація"
 OMO_the_human_delegation_desc: "Людська фракція у Верховному Совєті з часом невпинно меншала, але залишалася помітною силою, особливо в цю кризову пору. Її очолює православний проповідник на ім'я Алєксандр Мєнь, який став головним голосом на захист людства. Хай які сумніви викликає в нас заняття Мєня, для перемовин із людьми він є надзвичайно важливою постаттю.\n\nМи влаштуємо з ним зустріч, щоб з'ясувати, чого ж вони насправді хочуть, і, сподіваємося, узгодити кілька практичних рішень."

 OMO_the_general_strike: "Загальний страйк"
 OMO_the_general_strike_desc: "Великі історичні зміни завжди починалися з масових дій народу й заради народу. Так було в історії Росії та старого Совєтського Союзу: хто ж забуде загальний страйк 1905 року, що повалив царський абсолютизм? Так само народи Гармонійного Союзу страйкуватимуть знову.\n\nСправжні сини й доньки Росії, ті, хто вирішив залишитися людьми, готуються очолити загальний страйк проти понійської утопії Бакхаріна. Коли маси знову солідарно повстануть, центральний уряд буде змушений їх вислухати."

 OMO_we_havent_gone_far_enough: "Ми зайшли недостатньо далеко"
 OMO_we_havent_gone_far_enough_desc: "Ну ж бо, ну ж бо! Треба пришвидшитися! Ми не можемо зупинятися, попереду ще стільки поступу. Люди примусили б нас повзти зі швидкістю мерця, аж поки ми не замерзнемо, а поні, звісно, краще знають, що слід робити. Адже гармонійний комунізм - це поступ і розвиток суспільства. Саме праві й олігархи завжди говорять про «збереження» свого способу життя й тягнуть суспільство в багно власних корисливих інтересів. Треба діяти негайно й вести суспільство вперед!\n\nВласне, чому ми досі це обговорюємо? Ми лише марнуємо час, сидячи склавши копита під мордою, тож до роботи!"
 OMO_we_havent_gone_far_enough_tt: "Заспокоїть §Cпоні§!, якщо вони розлючені.\n\n"

 OMO_talking_things_out: "Усе обговорити"
 OMO_talking_things_out_desc: "Не варто ставати на чийсь бік і проводити межі. І люди, і поні висловили свої аргументи, до того ж слушні. Тут усі ми товариші під знаменом Гармонії, тож чому б не сісти й не владнати суперечки? Зберімо ключових представників людської й понійської фракцій, об'єднаймося в дружбі та спробуймо виробити компроміс. Зрештою, Гармонія - це злагоджена взаємодія різних речей, тож працюймо разом!"

 OMO_weve_gone_too_far: "Ми зайшли надто далеко"
 OMO_weve_gone_too_far_desc: "Агов, агов, стривайте! Чому б нам трохи не пригальмувати? Усе це явно вийшло з-під контролю, поні хочуть і рибку з'їсти, і в сідло сісти. Ні, тут люди безперечно мають рацію. Наші кінські товариші обвели нас навколо копита: ми виконували кожну їхню забаганку й гнали суспільство вперед із шаленою швидкістю, забувши про справді важливі речі. Ми ризикуємо залишити гармонійний комунізм позаду, тож час, чорт забирай, сповільнитися й вислухати людей."
 OMO_weve_gone_too_far_tt: "Заспокоїть §Gлюдей§!, якщо вони розлючені.\n\n"

 OMO_supremacy_of_the_ponies: "Панування поні"
 OMO_supremacy_of_the_ponies_desc: "Ієрархія не суперечить гармонії. Навпаки, справжня гармонія вимагає визнати слабкі й сильні сторони кожного, навіть якщо чиясь перевага абсолютна. Після років страждань і конфліктів ми побачили від людей та поні все необхідне, і правда очевидна. Поні за всіма ознаками вищі.\n\nАвжеж, у людей є великі пальці й вони ходять на двох ногах. Але наші інженери легко розв'язали всі пов'язані з цим проблеми, пристосувавши поні до світу, створеного для людей. Зворотне неможливе: магія поні перевершує все, що може запропонувати людство. Хай яка праця, поні в ній неперевершені.\n\nТаким є природний стан речей. Поки ми не визнаємо цього факту, Союз не житиме в гармонії з правдою."
 OMO_supremacy_of_the_ponies_tt: "Та, можливо, їхня §Rпиха§! стане причиною їхнього падіння..."

 OMO_resilience_of_humanity: "Стійкість людства"
 OMO_resilience_of_humanity_desc: "Коли Головпоні Бакхарін опинився на крижаній півночі, хіба його врятувала милість поні? Ні, його врятували люди: зігріли й нагодували, хоча він здавався їм цілковито чужим створінням. Історія Гармонійного Союзу сповнена прикладів людської доброти, любови й турботи.\n\nТепер дехто стверджує, що людство можна знехтувати. Мовляв, через кволі тіла й життя без магії про людей можна забути. Людина, безумовно, слабша за поні, але така ж чудова! Люди - наші друзі!\n\nМи маємо пам'ятати: навіть якщо людству бракує сили поні, воно розділяє з ними узи дружби. А хіба дружба не є справжньою магією Гармонійного Союзу?"
 OMO_resilience_of_humanity_tt: "...Саме тому ми тут, щоб §Gдоповнити§! те, чого бракує нашим товаришам."

 OMO_conflict_resolution_is_magic: "Урегулювання конфліктів - це магія"
 OMO_conflict_resolution_is_magic_desc: "Багато хто знав Бухаріна як здібного державного діяча, харизматичного провідника й розумного урядовця. Але сьогодні він показав світові ще один зі своїх численних талантів - урегулювання конфліктів.\n\nКриза на вулицях Іркутська починає вщухати. Розмови про конфлікт більше не заповнюють місто, навпаки, серця його жителів сповнені Гармонії. Люди торгують із поні. Поні й люди разом працюють у шахтах і крамницях. Навіть бари тепер спільні, й люди з поні підіймають келихи за світлі дні та довгу дружбу.\n\nНаразі Гармонійний Союз єдиний. Між людством і понійством досягнуто хоч і неофіційної, але угоди. Тепер ми можемо залишити це питання позаду й дивитися у світле майбутнє - як друзі."
 OMO_conflict_resolution_is_magic_tt: "Отже, §Cпоні§! та §Gлюди§! більше ніколи не мають розлучатися. Нехай ця §Rкриза§! стане уроком на майбутнє, щоб смерть §Yтовариша Рикова§! не була марною.\n\n"
 OMO_conflict_resolution_is_magic_trigger: "Нашому §Yрежиму§! не загрожує §eрозпад§!"
 
 #Economic
 
 OMO_the_gears_of_a_harmonic_society: "Шестерні гармонійного суспільства"
 OMO_the_gears_of_a_harmonic_society_desc: "Наче машина, наше суспільство складається з багатьох окремих деталей і частин, кожна з яких служить чомусь значно величнішому за себе. Щоб суспільство працювало справно, ми мусимо стежити, аби кожна з цих деталей була в бездоганному стані й добре доглянута.\n\nЕкономіка, промисловість, поні та люди. Усе це важливі частини величної машини, і наш обов'язок - дбати про них та берегти наше величне гармонійне суспільство."

 OMO_the_foundations_for_a_utopia: "Підвалини утопії"
 OMO_the_foundations_for_a_utopia_desc: "Чимало урядів і провідників, зокрема Совєтський Союз, спадкоємцями якого ми тепер є, стверджували, що втілення обраної ними ідеології створить утопічне суспільство й принесе добробут усім її прихильникам. Навіть сам товариш Бакхарін визнавав, що тоді це були лише солодкі слова, а утопічне суспільство залишалося недосяжною мрією. Та це зміниться.\n\nУперше в історії людства й понійства ідеологія гармонійного комунізму закладе підвалини справжнього утопічного суспільства, у якому біль і смуток залишаться в минулому, а дружба пануватиме над конфліктом. Час нам замислити цю утопію."

 OMO_the_future_of_our_kind: "Майбутнє нашого роду"
 OMO_the_future_of_our_kind_desc: "Дар магії, отриманий завдяки знайденим нами магічним кристалам, воістину могутній, але навіть він кориться волі часу - єдиній сталій у всесвіті. Поні ростуть, старіють і зрештою помирають. А тоді їхнє місце посідають діти й лошата, які продовжують спадщину батьків.\n\nНаш обов'язок - піклуватися про молоде покоління й виховувати його, щоб воно виросло та принесло гармонію в наше життя. І найкраще, що держава може для нього зробити, - забезпечити належну освіту незалежно від суспільного становища."

 OMO_buckharins_academy_of_friendship: "Академія дружби Бакхаріна"
 OMO_buckharins_academy_of_friendship_desc: "Дружба - не емпірична наука. Вона не така конкретна, як закони фізики, не така обґрунтована, як хімічні реакції елементів, і її не так легко довести математичними числами. Саме тому опанувати цю дисципліну нелегко як поні, так і людям.\n\nНіколай Бакхарін відкриє Академію дружби, де поні й люди, старі й молоді, зможуть вивчати захопливу природу Дружби та Гармонії заради всесвітньої Гармонії."
 OMO_buckharins_academy_of_friendship_tt: "£decision_icon_small Розпочнеться будівництво §CАкадемії дружби§! Бакхаріна."

 OMO_an_economy_of_magic: "Економіка магії"
 OMO_an_economy_of_magic_desc: "Правда в тому, що ми не звичайна держава. Ми володіємо тим, чого немає в жодної іншої країни на Землі: магією.\n\nЦілком природно спрямувати цю магію на благо народу. Вона здатна в рази посилити нашу національну економіку на світовій арені, відкрити безліч можливостей і принести добробут як поні, так і людям. І почати ми можемо просто зараз."

 OMO_the_anatomy_of_a_pony: "Анатомія поні"
 OMO_the_anatomy_of_a_pony_desc: "Щоб світ пізнав справжню дружбу, а світлі уми російських поні й людей засяяли на повну, ми мусимо їх підтримати. Наша молодь сяє блискучим потенціалом до вищої освіти й здатна принести дружбу не лише самій Росії.\n\nМи мусимо якнайповніше розвивати науки Гармонії, щоб справді обдаровані поні та люди могли поширювати свої знання всюди."

 OMO_books_for_the_children_and_foals: "Книжки для дітей і лошат"
 OMO_books_for_the_children_and_foals_desc: "Жодна кількість високоосвічених поні та людей не матиме досить сили, щоб самотужки витягнути весь наш народ із неписьменности й злиднів, адже останні два десятиліття були особливо жорстокими до росіян через невпинні конфлікти у світі без Гармонії. Ми це змінимо.\n\nЩоб виконати обіцянку по-справжньому дбати про майбутнє нашого роду, ми маємо дати всім змогу відкрити свій розум, читати, навчатися й процвітати. Ми поведемо до світлого майбутнього всіх поні, а не лише обраних."

 OMO_a_lesson_to_remember: "Урок, який слід пам'ятати"
 OMO_a_lesson_to_remember_desc: "Найважливіший урок, який мають пам'ятати і понійство, і людство, міститься в простій фразі:\n\n§C«Дружба - це магія»§!\n\nУ цих трьох словах закладена єдина абсолютна істина буття.\n\nЖоден конфлікт, розкол, війна чи біль не здатні перемогти магію дружби. Ми зробили свій внесок, навчивши народ її сили, а тепер саме він має закласти підвалини нашого нового відважного гармонійного суспільства."

 OMO_a_far_eastern_siberian_plan: "Далекосхідний Сибірський план"
 OMO_a_far_eastern_siberian_plan_desc: "Товариш Ніколай Бакхарін мав величне бачення економічно розвиненого індустріального суспільства, що процвітає в достатку й стабільності. Багато років тому він утілив це бачення в Центральносибірському плані, який живив економіку регіону.\n\nЗ магічною силою на своєму боці товариш Бакхарін може досягти ще більшого. Новий план економічного й промислового розвитку тут, на Далекому Сході, із силою понійської магії нарешті втілить працю, розпочату десятиліття тому."
 OMO_a_far_eastern_siberian_plan_tt: "£decision_icon_small Відкриває нові §Yрішення§! в §hмеханіці кристалів§! для розвитку §Yекономіки магії§!."

 OMO_encourage_urbanization: "Заохочувати урбанізацію"
 OMO_encourage_urbanization_desc: "Здавна що далі на схід Росії, то рідше трапляються міста. Сибірський клімат ніколи особливо не сприяв будівництву великих міських осередків, хоч вони, звісно, існують, а сільські поселення тут, на Далекому Сході, особливо поширені.\n\nУтім, спроба не завадить, правда ж? Урбанізація сільської місцевости неодмінно принесе довгострокові економічні вигоди завдяки появі там прибуткових галузей. Це лише один крок великого плану наздогнати решту світу, щоб усі ми могли скористатися його плодами."

 OMO_cultivating_the_winter: "Обробляючи зиму"
 OMO_cultivating_the_winter_desc: "Росія, а надто Далекий Схід, має один із найсуворіших кліматів серед заселених земель. Сніг - жорстока пані, і землеробство тут часто перетворюється на справжню боротьбу. Але завдяки магії природні перепони можна перестрибнути!\n\nЗастосувавши кілька добірних магічних прийомів, ми зможемо перетворити великі ділянки безплідного снігу на цілком придатні для рільництва землі й, сподіваємося, забезпечити народ їжею понад усяку міру. Хай якою жорстокою пані є холоднеча, невдовзі вона буде змушена схилитися, бо їй не зрівнятися з магією Гармонії."

 OMO_connecting_the_east: "Сполучити Схід"
 OMO_connecting_the_east_desc: "Далекий Схід і справді є пустельним та віддаленим краєм, де порівняно з розвиненішими регіонами на кшталт Західної Росії майже немає інфраструктури. Сполучення між областями надзвичайно важливе, але невблаганна місцевість і сибірські морози неабияк ускладнюють нашу справу.\n\nТа ми мусимо наполягати. Колись у майбутньому на обрії може постати війна, й без належної системи постачання ми неодмінно програємо. До того ж цивільним стане легше подорожувати між регіонами держави."

 OMO_give_to_the_poor: "Допомогти бідним"
 OMO_give_to_the_poor_desc: "Не кожному поні щастить жити в будинку, грітися біля вогнища й вести життя своєї мрії. Дехто животіє на вулиці, сподіваючись на щедрість інших як на єдине джерело прибутку, і саме виживання вночі для них уже диво.\n\nТовариш Бакхарін не лежатиме спокійно, поки ці люди страждають. Кожен заслуговує на щасливе життя, і він має силу визволити їх зі злиднів."

 OMO_share_the_wealth: "Поділитися багатством!"
 OMO_share_the_wealth_desc: "Воістину прикро, що одні люди самі володіють розкішними маєтками, а іншим ніде навіть переночувати. Гармонійний Союз мусить подолати цю майнову прірву.\n\nМи заохочуватимемо багатіїв нашої країни ділитися статками з нужденними, щоб і ті отримали гідні можливості в житті. На відміну від старих методів, ми не можемо просто силоміць відбирати власність у багатих. Доведеться придумати інший спосіб, інший стимул допомагати бідним."
 
 # Military
 
 OMO_the_marching_of_the_hooves: "Марш копит"
 OMO_the_marching_of_the_hooves_desc: "Формуючи армію, слід ураховувати сильні сторони наявних бійців, а в поні їх справді чимало. Завдяки чотирьом копитам вони значно рухливіші за звичайну людину, а надзвичайна сила дає їм змогу частіше виконувати складні завдання. Хоча ми досі, гм, не зовсім розуміємо, як саме вони тримають рушниці, роблять вони це завзято, тож забезпечмо їх зброєю перед походом у бій."

 OMO_the_thundering_of_the_boots: "Грім чобіт"
 OMO_the_thundering_of_the_boots_desc: "Звісно, не варто недооцінювати й кількість людей, готових воювати в наших арміях. Багато з них уже стали чудовими солдатами й цілком здатні виконувати бойові завдання, та й нехтувати тактичним хистом, який чимало людей демонструє в бою, ми не можемо. Люди готові воювати, а отже, вони теж стануть до лав Рожевої Армії."

 OMO_cooperation_is_key: "Співпраця - ключ до успіху"
 OMO_cooperation_is_key_desc: "Мирне врегулювання Кризи Гармонії дало нам багато уроків, і серед них те, що наші солдати, поні й люди, не повинні почуватися чужими одне одному.\n\nПротиставляти їх або проводити чіткі межі між видами - саме це й спричинило кризу. У Гармонії ми всі друзі, незалежно від того, маємо руки чи копита, і подібні речі неприпустимі. Люди й поні повсякчас працюватимуть разом під знаменом єдиної Рожевої Армії."

 OMO_experiment_with_onhooves_warfare: "Дослідити копитну війну"
 OMO_experiment_with_onhooves_warfare_desc: "Схоже, всі ці роки ми не використовували повністю потенціал копитної війни. Земні поні мають надзвичайну силу, однороги здатні чаклувати, а пегаси наділені даром польоту.\n\nМожливо, настав час по-справжньому оцінити можливості нашої неперевершеної армії, щоб здобути верхнє копито в боях із ворогами."
 OMO_experiment_with_onhooves_warfare_tt: "Відкриває умови для фокуса §YПоліт пегасів§!."

 OMO_the_peoples_army: "Народна армія"
 OMO_the_peoples_army_desc: "У традиційній державі армія утверджує владу уряду, захищає його інтереси й веде його війни. У традиційній державі армія ніяк не підзвітна народові, який лише зрідка обіцяє захищати.\n\nПроте ми не традиційна держава. Відповідно до засад комунізму наша армія служить народові та пролетаріяту. Замість утверджувати владу уряду й придушувати народну волю, вона стане першою й останньою лінією оборони народу від несправедливости та фашизму. Армія складатиметься з народу, творитиметься народом і служитиме народові. Вчинити інакше означало б зрадити принципи нашої революції й утратити все, що робить нас нами."

 OMO_the_many_faces_of_the_pink_army: "Численні обличчя Рожевої Армії"
 OMO_the_many_faces_of_the_pink_army_desc: "У роки після розпаду Союзу утримувати будь-які війська, крім сяк-так озброєної піхоти, було неймовірно важко. Витрачати промислові потужності на авіяцію чи флот здавалося безглуздям, коли держава воєводи ледве виробляла досить рушниць для своїх людей. Але часи змінюються, наша сила зростає, і ми мусимо визнати, що армія не обмежується сухопутними військами.\n\nТож до Рожевої Армії приєднаються належні повітряні та морські сили, які довершать наші збройні сили й наблизять їх до рівня сучасних держав світу. Летімо далеко й пливімо швидко!"

 OMO_the_grand_military_academy_of_magadan: "Велика військова академія Маґадана"
 OMO_the_grand_military_academy_of_magadan_desc: "Ми багато дізналися про стратегію армії, що складається з поні та людей. Тепер нам потрібні фахівці, які застосують ці знання й дадуть нам перевагу в битві умів у штабі. Тож товариш Бакхарін доручив заснувати Велику військову академію Маґадана. Але чому саме в Маґадані?\n\nМи не егоїсти, і здобуті нами знання можуть стати в пригоді нашим новим союзникам. До того ж це дасть нам змогу повчитися в самих експертів, а Маґадан - велике портове місто, куди іноземним стратегам буде легко приїхати й усе побачити."
 OMO_the_grand_military_academy_of_magadan_tt: "Ми отримаємо різні §Gбонуси§! залежно від того, з ким подружимося в §Yдереві зовнішніх відносин§!.\n"
 OMO_the_grand_military_academy_of_magadan_tt_1: "\n- Дружба з [USA.GetFlag] §Dамериканцями§! дасть нам таке:"
 OMO_the_grand_military_academy_of_magadan_tt_2: "\n- Дружба з [JAP.GetFlag] §Rяпонцями§! дасть нам таке:"
 OMO_the_grand_military_academy_of_magadan_tt_3: "\nМи надамо §Yправо на стоянку§! державі, з якою подружилися."

 OMO_the_flight_of_the_pegasi: "Політ пегасів"
 OMO_the_flight_of_the_pegasi_desc: "Військові теоретики й стратеги нарешті вдосконалили склад, імовірно, найновішого й найціннішого бойового засобу Рожевої Армії. Представляємо батальйон пегасів.\n\nСформовані цілком із пегасів (і, можливо, зовсім малої кількости тезтралів) дивізії цих батальйонів можуть діяти як швидкі та спритні ударні війська, адже здатні літати з величезною швидкістю без дорогого обладнання. Якщо теорія правильна, вони розгромлять ворога, перш ніж той устигне підготувати належну оборону. Справді надзвичайно цінний засіб."
 OMO_the_flight_of_the_pegasi_tt: "Уможливлює використання £nato_unit_pegasi_icon_small §Cбатальйонів пегасів§!."
 
 OMO_rule_the_skies: "Панувати в небесах"
 OMO_rule_the_skies_desc: "У сучасній війні не можна покладатися лише на міць наших поні та людей на землі. Нині повітря слід вважати окремим полем бою, а тому контроль над небом має стати нашим головним пріоритетом.\n\nМи почнемо озброюватися для війни в повітрі, адже це поле бою, яке ми аж ніяк не можемо дозволити собі втратити."

 OMO_planes_in_the_night_sky: "Літаки в нічному небі"
 OMO_planes_in_the_night_sky_desc: "Перевага в повітрі стане рушійною силою нашої армії. Пілоти-поні та люди допомагатимуть відважним товаришам на землі, очищаючи небо й надаючи безпосередню повітряну підтримку проти ворожих військ.\n\nМи вкладемося у виробництво та розгортання першої партії літаків для наших нових, відроджених повітряних сил, і завдяки їхнім зусиллям у небі Рожеву Армію буде не спинити."
 OMO_planes_in_the_night_sky_tt: "Ми отримаємо запас §Yбазових реактивних винищувачів§! і §Yбазових реактивних штурмовиків I§!, якщо дослідили відповідні технології.\n\n"

 OMO_project_shooting_star: "Проєкт «Падуча зоря»"
 OMO_project_shooting_star_desc: "Часом так хочеться, щоб замість складних маневрів у надії ухилитися від ворожих ракет і зенітних снарядів ворог узагалі не міг виявити наші літаки.\n\nСаме це стане метою нового проєкту під особистим патронатом Ніколая Бакхаріна: перевершити всі повітряні сили світу, втіливши ідею малопомітних літаків та навчившись ефективно застосовувати їх у бою. Проєкт буде дорогим, але гроші, безумовно, коштують менше за життя наших пілотів і заміну збитих літаків."

 OMO_docks_in_kamchatka: "Верфі Камчатки"
 OMO_docks_in_kamchatka_desc: "Камчатка стала одним із перших нових надбань Гармонійного Союзу, а до того мала один із найгрізніших серед нечисленних флотів Російської Анархії. Проте відтоді її потужні морські споруди цілковито занепали, а верфі мовчали, поки ми зміцнювалися на Далекому Сході й розв'язували суспільні проблеми.\n\nТа після створення нашого флоту кращої нагоди все впорядкувати годі й шукати. Верфі Камчатки знову запрацюють, і кожен корабель нашого флоту буде збудовано в дусі Гармонії."

 OMO_the_second_pacific_fleet: "Другий Тихоокеанський флот"
 OMO_the_second_pacific_fleet_desc: "Тепер, коли Камчатка знову до діла й побудовано чимало нових кораблів, об'єднання наших морських сил триває. Ми підсилимо нові судна, повернувши до строю деякі старі кораблі Тихоокеанського флоту, і нарешті впорядкуємо всю флотську систему.\n\nМає бути встановлений ланцюг командування й набрані офіцери, і лише тоді Тихоокеанський флот відродиться: не жалюгідним пережитком Анархії, а законним спадкоємцем флоту Совєтського Союзу й могутньою силою на морі."

 OMO_the_great_cause_of_harmony: "Велика справа Гармонії"
 OMO_the_great_cause_of_harmony_desc: "Убивство - жахлива річ. Це моторошний акт розбрату проти ближнього, якого вже не скасувати, тому Гармонія його засуджує. Але на війні нам часто доступні лише знаряддя вбивства. Це прикро, тож ми поставимо армії завдання звести його до мінімуму.\n\nНаші війська надаватимуть перевагу полоненню, їм заборонять безпідставні вбивства, а перемоги здобуватимуть із якнайменшою кількістю безглуздих смертей і руйнувань, бо не буде ані Гармонії, ані Дружби, якщо не залишиться нікого, хто міг би відчути їхній дух."
 
 # Foreign Policy
 
 OMO_harmony_on_the_world_stage: "Гармонія на світовій арені"
 OMO_harmony_on_the_world_stage_desc: "Гармонія - це щось більше за зв'язки між окремими душами чи навіть цілими народами. Її можна поширити на весь світ. У досконалому суспільстві, у світі досконалої гармонії, не було б потреби ані в подальших об'єднавчих війнах, ані у війнах узагалі. Був би лише один народ на одній планеті, об'єднаний дружбою.\n\nНаші дипломати розуміють ці засади. Вирушаючи з Росії у широкий світ, вони складають послання, натхнені цією мрією. Деякі іноземці неминуче поставляться з недовірою до нашого понійського керівництва, тверджень про магію чи гармонійної ідеології, але ми зможемо подолати їхні страхи. Так чи інакше, ми принесемо Гармонію на світову арену."
 OMO_harmony_on_the_world_stage_tt: "Ми відкриємо нашу §Yполітичну сферу§! зовнішньому світові."

 OMO_a_message_to_germany: "Послання Німеччині"
 OMO_a_message_to_germany_desc: "У досконалому світі ми подружилися б із кожною державою, бо кожна заслуговує на провідну руку Гармонії. Однак є одна перепона: одна держава вчинила стільки жорстокости, що такої руки їй простягнути неможливо. Це Німеччина.\n\nЖахливим діям її уряду та керівництва немає виправдання. Націонал-соціялізм нібито гармонійний, але побудований на чварах і насильстві; нібито дружній, але побудований на ненависті й жахіттях. Наразі ми не маємо фізичної чи матеріяльної змоги повалити Райх, але можемо сказати йому все, що про нього думаємо. Райх почує про кожну ваду свого мерзенного режиму!"

 OMO_speaking_with_the_panasianists: "Розмова з паназіятистами"
 OMO_speaking_with_the_panasianists_desc: "Справедливо буде сказати, що ми маємо проблеми з японцями: імперіялістичною імперією просто біля нашого порога, яка скористалася розпадом Союзу й украла законні російські землі на кшталт Владивостока, а у Великій Вітчизняній війні була нашим ворогом. Проте після завершення війни нас об'єднує ставлення японців до Фашистського Райху.\n\nВідносини між нацистами та імперіялістами після того, як осів пил, переважно розвалилися, а як кажуть: «Ворог мого ворога - мій друг». З огляду на це й на нашу близькість нам належало б зв'язатися з ними, бо підтримкою наддержави не слід нехтувати..."

 OMO_breaking_bread_with_the_americans: "Розділити хліб з американцями"
 OMO_breaking_bread_with_the_americans_desc: "За ідеальних обставин ми, мабуть, воліли б не мати з американцями жодних справ. Їхній капіталістичний лад погано узгоджується з нашим гармонійним комунізмом, але порівняно з іншими наддержавами, фашистськими німцями та імперіялістичними японцями, саме вони найбільше співчувають нашій боротьбі й найімовірніше нас підтримають.\n\nКолись ми стояли пліч-о-пліч з американцями у Великій Вітчизняній війні проти держав Осі, і сподіваємося, що цю пам'ять не забули так швидко. Визнання нас законною російською державою матиме велику вагу у «Вільному світі», який вони очолюють, тож у дипломатії вони - наша найкраща надія."

 OMO_ponies_on_the_senate_floor: "Поні в залі Сенату"
 OMO_ponies_on_the_senate_floor_desc: "Мало що американці цінують більше за свою демократичну систему. Вона є значною частиною їхньої національної ідентичности, і хоч ми маємо зауваження до її втілення, можемо її поважати - і використати.\n\nМи надішлемо представників, які обстоюватимуть наше визнання та підтримку безпосередньо перед одним із підкомітетів Сенату й обраними демократичним шляхом посадовцями. Якщо хочемо чогось досягти з американцями, варто діяти в добре знайомий їм спосіб."

 OMO_an_alicorn_in_tokyo: "Алікорн у Токіо"
 OMO_an_alicorn_in_tokyo_desc: "Після нашого звернення до японців надійшло цікаве запрошення: товариша Бакхаріна запросили до їхньої столиці Токіо на зустріч із Його Величністю Імператором Японії.\n\nМіж комунізмом, гармонійним чи будь-яким іншим, та ідеєю панівного монарха, звісно, немає жодної любови, але значення Імператора важко переоцінити. Успішна розмова з ним матиме велику вагу в складній політичній системі Японії, адже якщо всі члени Йокусанкая й можуть у чомусь погодитися, то найімовірніше саме зі словом свого монарха.\n\nБакхарін негайно почне готуватися до подорожі: Токіо на власні очі побачить одного з головних поборників гармонійного комунізму!"

 OMO_the_old_dream: "Стара мрія"
 OMO_the_old_dream_desc: "Чим була мрія Карла Маркса, як не Гармонією? Його утопія без держави й ринку безперечно перегукується з ідеалами Бакхаріна. Навіть тепер наші провідники шукають порад у його маніфесті. Наші провідники вигукують його ім'я з трибун. Наші плакати зображують його серед понійського керівництва. Кожен поні й кожна людина в Союзі безперечно знає його ім'я.\n\nЧи переглянули ми його вчення? Так. Його мрія мала чимало відмінностей, але він був лише людиною, яка жила майже за століття до нас. Поні, кристали - усе це приголомшило б нашого праотця, але з часом він неодмінно зрозумів би наше бачення. Наша мрія стара, але, дивлячись на світ, ми мусимо її пам'ятати. Колись вона стане підвалиною справжнього Гармонійного Союзу, що простягнеться по всій земній кулі."

 OMO_the_east_is_pink: "Схід порожевів"
 OMO_the_east_is_pink_desc: "Росія знову з'явилася на мапі. Понад двадцять років ми не могли чесно цього сказати, і завдячуємо цим Гармонійному Союзу.\n\nПроте ми більше не та «Червона загроза», якою нас уявляли світові реакціонери.\n\nТепер ми §Cрожеві§!, і це надовго."

 OMO_communists_of_the_world: "Комуністи світу"
 OMO_communists_of_the_world_desc: "Революційна справа зазнала тяжкого удару, коли Совєтський Союз упав, а Європу розчавив фашистський чобіт. Проте кінець Совєтського Союзу не означав кінця комунізму, хоч дехто й стверджує протилежне.\n\nПопри все, досі існують сильні комуністичні держави. У такому ворожому світі наші країни неодмінно мусять стояти разом, інакше нас перевішають поодинці. Ми звернемося до цих держав і подружимося з їхніми урядами."

 OMO_inspired_by_harmony: "Натхненні Гармонією"
 OMO_inspired_by_harmony_desc: "Бачення §CГармонії§!, яке осяяло товариша Бакхаріна, докорінно змінило наше уявлення про можливості комунізму. Зважаючи, як далеко занесла нас нова хвиля ідеалів, важко навіть уявити, що станеться, якщо більше наших товаришів-революціонерів зрозуміють Гармонію.\n\nТому ми навчимо комуністів світу Гармонії й покажемо, що дружба - це праксис.\n\nУсе неодмінно мине добре."
 
 ## Superregional Tree
 # Main Tree
 OMO_the_second_allponies_congress: "Другий Всепонійний Конґрес"
 OMO_the_second_allponies_congress_desc: "Перший Всепонійний Конґрес відбувся в пустках сибірського Далекого Сходу. Його учасниками стали одні з найперших прихильників гармонійного комунізму, які зібралися, щоб визначити початковий курс Гармонійного Союзу й закласти його підвалини. Зайве казати, що відтоді багато що змінило: наша держава пройшла довгий шлях, поширилася на нові землі й запросила під крило Гармонії безліч нових людей, тож тепер Гармонійний Союз складається з набагато різноманітнішого населення.\n\nВідповідно, мають змінитися й делегати Другого Всепонійного Конґресу. Конгрес буде дієвим лише тоді, коли представлятиме народи, об'єднані Гармонією, тож ми подбаємо, щоб зібрання мало належний склад."

 OMO_moving_westward: "Рушаючи на захід"
 OMO_moving_westward_desc: "Тепер, коли Центральний Сибір у наших руках, одразу впадає в око, наскільки він розвиненіший. Індустріялізація таких міст, як Новосибірськ, значно випереджає будь-що на наших далекосхідних землях, чи то завдяки спрямованому на розвиток Центральносибірському плану, чи то через несприятливий для нас природний клімат. Триматися за пустки просто економічно недоцільно. Час перенести весь важливий політичний апарат до Центрального Сибіру й покинути стару столицю Іркутськ заради величнішого міста... Новосибірськ чудово підійде."

 OMO_expand_ponification: "Розширити поніфікацію"
 OMO_expand_ponification_desc: "Разом із цілою новою землею під покровом Гармонії з'явилося багато нових друзів! Уперше за довгий час ми володіємо цілими населеними осередками, де живуть лише люди й досі не проводилося жодної поніфікації. Було б вкрай несправедливо не запропонувати її всім цим людям, тож товариш Бакхарін вирішив поширити поніфікацію на кожного охочого в Центральному Сибіру. Звісно, ці землі густо заселені, і Бакхарін очікує, що багато людей приймуть нашу пропозицію. Нам слід розширити необхідну інфраструктуру, щоб прийняти кожного охочого."

 OMO_making_new_friends: "Заводити нових друзів"
 OMO_making_new_friends_desc: "Центральний Сибір - великий край, де живе багато центральних сибіряків. За часів Центральносибірської Республіки й навіть після неї тут працювали одні з найздібніших і найрозумніших урядовців усієї Анархії.\n\nПоети й ідеалісти Томська, промисловці Новосибірська, сміливі анархісти Канська - ось лише кілька прикладів. Багато з них досі тут і готові працювати на нас. І хоча загалом ми не поділяємо їхніх поглядів, було б несправедливо через це залишити їх осторонь. Гармонія - це нові друзі, тож заведімо їх."

 OMO_staying_the_course: "Не звертати з курсу"
 OMO_staying_the_course_desc: "Хоч старі центральносибірські провідники можуть бути здібними урядовцями, на жаль, ми навряд чи здатні їм довіряти. Ми лише нещодавно приєднали регіон, і багато складників гармонійного комунізму будуть їм геть чужими. Ризикувати не можна, нехай призвичаюються до Гармонії у затишку власних домівок. Для управління центральносибірськими землями слід залучити наших людей.\n\nЦе може здатися складним завданням, але завжди знайдуться охочі поширювати дух Гармонії. Можливо, хтось із нових членів партії, хто прагне уславитися. Майбутньому завжди варто дати шанс."

 OMO_siberia_made_pink: "Сибір порожевів"
 OMO_siberia_made_pink_desc: "Тепер, коли наша адміністрація облаштувалася, а поніфікацію запропоновано всім охочим, здається, населення Центрального Сибіру чудово приймає Гармонію. Нова суміш поні та людей пізнає магію дружби, залишає лиха Анархії позаду й гуртується як друзі. Для нас це безумовно добре, адже наші ідеали поширюються серед народу, але зрештою це добре для всіх. Що більше людей об'єднує дружба, то могутніша Гармонія. Наші зусилля дали плоди, й це може втішити кожного з нас."

 OMO_utilize_the_bureaucracy: "Використати бюрократію"
 OMO_utilize_the_bureaucracy_desc: "Центральний Сибір, як і вся Росія, колись був лише частиною великого Совєтського Союзу до його розпаду наприкінці Великої Вітчизняної війни.\n\nПорівняно із Західною Росією, що потерпала від німецьких терористичних бомбардувань і Західноросійської війни, та нашим Далеким Сходом, який природно перетворився на некеровану пустку або став поживою для білої еміграції, Центральний Сибір зберіг багато бюрократичних структур колишнього Союзу спершу за Центральносибірської Республіки, а потім за численних воєвод, що від неї відкололися.\n\nВони стануть вирішальними для легшої інтеграції в Гармонійний Союз, адже наші власні структури багато в чому наслідують старий Союз."

 OMO_standardize_gauges: "Стандартизувати колію"
 OMO_standardize_gauges_desc: "Надзвичайно важливо якомога краще уніфікувати залізниці, які перетинають сибірські землі. Один Бог знає, що встигли набудувати центральносибірські воєводи зі своїми недолугими, безглуздими планами й невпинними негармонійними чварами. Тож іншого вибору немає, треба діяти.\n\nНехай відповідальні за транспорт органи перевірять ширину сибірських залізничних колій, щоб забезпечити єдиний стандарт у всьому Союзі."

 OMO_east_and_center_now_as_one: "Схід і центр тепер єдині"
 OMO_east_and_center_now_as_one_desc: "Лише дванадцять місяців тому, коли ми почали перебирати відповідальність за Центральний Сибір в ім'я нової гармонійної Росії, східний і центральний сибірські регіони були двома цілковито окремими державами, розірваними колишньою некомпетентністю, підступними зрадами та жорстокістю німців.\n\nТепер вони стали одним цілим і майже не відрізняються. Ми об'єднали їх в ім'я Гармонії!"

 OMO_the_legacy_of_1924: "Спадщина 1924 року"
 OMO_the_legacy_of_1924_desc: "1924 рік став важливою поворотною миттю в історії Росії та Совєтського Союзу, яку товариш Бакхарін і багато інших пам'ятають надто добре. Лише на двадцять перший день року після тривалої хвороби помер великий революціонер Владімір Ленін і передав керівництво Бакхаріну.\n\nБакхарін підтримав запропоновану Леніним Нову економічну політику й утілив її багатьма способами, найвідомішим із яких став славетний Центральносибірський план. Його спадщина мала велике значення для воєвод, які колись панували в Барнаулі, Томську й інших містах. Але тепер ці землі належать нашому Гармонійному Союзу, і віжки знову в наших копитах. На честь духу Леніна ми продовжимо незавершену справу, розпочату багато років тому!"

 OMO_the_fruits_of_the_siberian_plan: "Плоди Сибірського плану"
 OMO_the_fruits_of_the_siberian_plan_desc: "Дехто сумнівається в дієвості Центральносибірського плану, але лише тому, що за часів Союзу його потенціял так і не було втілено повністю. Остаточний результат проєкту значною мірою визначила спроба Фашистського Райху втоптати нас у землю, тож ці судження не дають належної оцінки подіям.\n\nМи знову запустимо старий апарат і методи, доповнивши їх численними винаходами воєвод часів Анархії, і нарешті скуштуємо справжні плоди Центральносибірського плану."

 OMO_sowing_harmony: "Сіючи Гармонію"
 OMO_sowing_harmony_desc: "Про теорію Сибірського плану можна сперечатися цілими днями, але неможливо заперечити, що його втілення було відверто катастрофічним. На відміну від нашого Далекосхідного Сибірського плану, реалізація рясніла суперечливими ідеями, експеримент провалився, а Росія і весь світ, зокрема й ми, змінилися настільки, що врятувати хоч якусь його цінність неможливо.\n\nЧистий аркуш дасть нам змогу згори донизу переосмислити, якими можуть бути гармонійна Росія та гармонійний світ. Навіщо марнувати таку нагоду? Прибирання зими ніколи не завадить!"

 OMO_a_newer_economic_policy: "Новіша економічна політика"
 OMO_a_newer_economic_policy_desc: "Хоч би що ми думали про НЕП, факт залишається фактом: ми вже не Совєтський Союз. Ми щось цілковито, геть нове в історії людей І поні, й наша економіка має це відображати. Наша історія та наш світ - бурхлива, кривава теза про те, що працювало й не працювало в Росії та за кордоном. Було б невіглаством вдавати, ніби друга половина XX століття, ще й із численними розумними видами, може жити за уявленнями першої.\n\nТеорія завдає мороки, але економіка однаково невдячна праця."

 OMO_the_element_of_generosity: "Елемент Щедрости"
 OMO_the_element_of_generosity_desc: "Може, це й не перше слово, яке спадає на думку, але комунізм - це Щедрість.\n\nДеякі основні складники комуністичної теорії передбачають примусове вилучення багатств у вищих класів (звісно, засади Гармонії забороняють нам силоміць вилучати багатство) та їхній розподіл серед нужденних нижчих класів. А якщо Щедрість означає ділитися з іншими тим, що маєш, то хіба ці поняття не тотожні? Зв'язок між Гармонією та комунізмом був визначений ще до того, як ми його встановили, а звеличення Щедрости лише зміцнює його.\n\n§lС- стривайте... Невже це...? Елемент Гармонії проявляється на Землі? Просто тут?§!"

 OMO_harmony_is_friendship: "Гармонія - це дружба"
 OMO_harmony_is_friendship_desc: "Наш Гармонійний Союз - це маяк Гармонії та Дружби, що сяє з нової Росії, яка поволі відроджується після десятиліть страждань. Тепер, коли Далекий Схід і Центральний Сибір об'єднано в Гармонії, ми справді сильніші, ніж будь-коли.\n\nДля цього знадобилося стільки праці: від народження гармонійного комунізму в далеких північних пустках Сибіру й поширення Гармонії на весь Далекий Схід до примирення людей і поні нашої країни та приходу Гармонії до Центрального Сибіру. І ось ми тут. З болю довгих років страждань ми спрямували магію, могутнішу за будь-яку силу на цій землі, - магію Дружби."

 OMO_friendship_is_magic: "Дружба - це магія"
 OMO_friendship_is_magic_desc: "Однак ми мусимо визнати певні реалії. Хоч як ми намагалися б цього уникнути, конфлікт із силами Західної Росії за долю країни видається неминучим. Болісно зазнавати шкоди від інших росіян і самим завдавати їм шкоди, незалежно від устрою їхньої держави. У такі темні часи як ніколи важливо, щоб основні засади Гармонії залишалися непохитними в серцях нашого народу.\n\nСаме магія змінила нас у стількох сенсах, показала новий спосіб життя й подарувала незбагненні здібності. Саме дружба допомогла нам пережити найтемніші часи, об'єднавши нас у любові й товаристві. Ми багато чим завдячуємо Гармонії, і якщо завжди нестимемо її із собою, то ніколи не зазнаємо невдачі. Люди чи поні, ми єдині. Ми всі - Маленькі Поні Бакхаріна.\n\nТож стіймо непохитно. Нехай люди беруть рушниці, а поні готуються рушати риссю. Урал чекає. І десь там на нас чекають нові друзі!"
 
 # Nuke Tree
 OMO_project_feniks: "Проєкт «ФЕНІКС»"
 OMO_project_feniks_desc: "Овва! Реальність нашого становища вимагає ще суворіших заходів, ніж створення збройних сил і їхнє застосування проти розрізнених ворожих сил Росії. Це тим важливіше, що ми маємо визволити Московію та решту західних земель і показати їм славу Гармонії.\n\nТож, наче могутній Фенікс, гармонійна Росія поверне собі місце на світовій арені, щоб нести народові шлях Гармонії. Відродившись із попелу поразки, Росія заявить право на спадщину всіх великих держав: силу Атома."
 OMO_project_feniks_tt: "Ми розпочнемо проєкт §OФЕНІКС§!, щоб приборкати силу §Rатома§!."

 OMO_dedicated_crystal_mines: "Спеціялізовані кристальні шахти"
 OMO_dedicated_crystal_mines_desc: "У Росії виникло кілька кристальних шахт. Проте зараз вони, здається, надто захоплені речами, на яких нам не слід зосереджуватися: різними магічними цяцьками, цілком корисними в мирний час чи звичайній війні, але поза тим абсолютно непотрібними.\n\nТак тривати не може. Слід видати указ, який заборонить усім шахтам постачати кристали на всілякі сторонні справи й натомість спрямує всю їхню продукцію на проєкт «ФЕНІКС»."

 OMO_a_superior_material: "Досконаліший матеріял"
 OMO_a_superior_material_desc: "Уран цілком годиться іншим, негармонійним державам. Його вистачило, щоб осоромити американців і британців. Його вистачило, щоб підкорити Східну Азію волі Японії, а Європу - німецькому диктатові. Але для нас цього далеко не досить.\n\nЗавдяки доступним нам кристалам і магії ми зможемо розробити нечуваний в історії розщеплюваний матеріял. Він дасть нам змогу створити неперевершену магічно-ядерну бомбу."

 OMO_facilities_in_siberia: "Об'єкти в Сибіру"
 OMO_facilities_in_siberia_desc: "Як саме Фенікс повстане з попелу, якщо вороги зможуть дістатися до нього ще до народження? Навколо наших об'єктів уже діють сили НКҐД, яким доручено не здіймати галасу. Але вони повідомляють про труднощі, які напевно поменшають, якщо ми переберемося у віддаленіші місця.\n\nТому по всьому Сибіру слід побудувати більші об'єкти, де ми зможемо працювати вільніше й таємніше. Нехай буде зроблено!"

 OMO_absolute_secrecy: "Цілковита таємність"
 OMO_absolute_secrecy_desc: "Як саме Фенікс повстане з попелу, якщо вороги зможуть дістатися до нього ще до народження? Ми мусимо зберігати проєкт у цілковитій таємниці, наскільки це взагалі можливо для людей і поні. Вибору немає: ані слова не має просочитися назовні, інакше німецькі вороги Гармонії нападуть на нас.\n\nНехай навколо наших об'єктів розгорнуть сили НКҐД. Їм доручать не здіймати галасу."

 OMO_the_power_of_the_sun: "Сила Сонця"
 OMO_the_power_of_the_sun_desc: "Ми вийшли на фінішну пряму нашої праці. У Сибіру побудовано об'єкти, де уран поєднують із кристалами та магією, щоб створити бомбу, рівної якій не було в історії людей і, можливо, навіть поні. Робота успішно велася в цілковитій таємниці силами найсвітліших умів і спеціялізованих кристальних шахт Гармонійного Союзу.\n\nТож можна впевнено сказати: усе вже готово, крім самого складання зброї. Час настав."

 OMO_the_brightest_minds: "Найсвітліші уми"
 OMO_the_brightest_minds_desc: "...які ми маємо, незалежно від їхньої національности чи виду, слід закликати до бою іншого штибу. Ні, тут не знадобиться ані зброя, ані наступальна магія. Навпаки, це війна розуму й рук.\n\nСлід завербувати всіх відданих науковців, людей і поні, та взяти з них присягу мовчання, щоб вони довели проєкт до остаточного завершення й допомогли нам ширити Гармонію світом."

 OMO_in_the_palm_of_our_hooves: "На долоні наших копит"
 OMO_in_the_palm_of_our_hooves_desc: "У Сибіру побудували об'єкти, де уран поєднали з кристалами та магією, щоб створити бомбу, рівної якій не було в історії людей і, можливо, навіть поні. Роботу успішно виконали в цілковитій таємниці силами найсвітліших умів і спеціялізованих кристальних шахт Гармонійного Союзу. Потім бомбу склали. І тепер, тепер...\n\nНам удалося. Сила, здатна навіки захистити Гармонію від ворогів усіх форм і видів... тепер наша. Вона на долонях наших копит і рук.\n\nВона залишиться з нами... назавжди."
 OMO_in_the_palm_of_our_hooves_tt: "Доба §Rатома§! почалася."
 
 ### Event localisation
 
 OMO_aprilfools.1.t: "Останні миті"
 OMO_aprilfools.1.desc: "Замерзла тундра сибірської півночі - пустельне місце. Тут панує холод, глибокий, пронизливий холод, що його відчуваєш у самому кістковому мозку. Це скований морозом краєвид безмежної білизни, подекуди порушеної вкритими інеєм деревами, що здіймаються, наче бурульки, аж до обрію. Тут тихо; птахи не співають, а звірі, що мешкають у цих обпалених морозом лісах, - небезпечні хижаки. Почути їх було б останнім, що ви зробите у своєму житті.\n\nВи не знаєте, що змусило вас прийти в ці пустки. Бажання втекти від свого безглуздого життя? Може, якесь приземленіше прагнення знайти воду чи їжу. А може, одного дня ви просто вирішили піти й ніколи не повертатися. Це не має значення. Сибір покликала, і ви зволили відповісти.\n\nХай там якими були ваші причини, блукаєте ви вже довгенько. Ви не знаєте, де перебуваєте й скільки часу минуло. У ваших очах усе злилося докупи, а краєвид, здається, не має кінця. Ви не знаєте, як давно спорожнів ваш бурдюк і скільки минуло від останньої справжньої страви. Зрештою, не витримавши тягаря дійсности, ви падаєте на землю... стривайте.\n\nСтривайте, що це за хр... це що...\n\nЦе поні??"
 OMO_aprilfools.1.a: "Підійти ближче й дізнатися правду."
 OMO_aprilfools.1.a.tt: "§CГармонія прийде в Росію.§!"
 OMO_aprilfools.1.b: "Смерть ліпша за всю цю нісенітницю."
 
 OMO_aprilfools.2.t: "Церемонія відкриття"
 OMO_aprilfools.2.desc: "Єлєна спустилася з одного кола пекла в інше, від єресі до зради. Після довгих років роботи в адміністрації Яґоди, після років розбудови в Іркутську установ, здатних відновити Совєтський Союз, вона опинилася поруч із цим чоловіком. Вона сиділа за круглим столом із Яґодою, Сабліним і потворою Бакхаріним як помічниця останнього, експертка в суперечці між двома чоловіками та доказ його відданости «міжвидовій співпраці».\n\nСмерть була б для неї надто милосердною, та, можливо, коли цей фарс переговорів закінчиться, вона все-таки заслужить таку нагороду.\n\n«Ну ж бо, друзі!» - вигукнув кінь, гупаючи копитами по дерев'яному столу. «Я знаю, ми не погоджуємося щодо того, хто тут ухильник, а хто ні, але навіщо нам битися, якщо можна натомість обговорити наші розбіжності! Ви обоє були зоряними товаришами, і я знаю, що всі ми зможемо працювати як команда!»\n\nЗапала тиша. Яґода нищівно дивився на Єлєну й поні. Саблін затулив обличчя руками й пробурмотів щось схоже на: «Господи, ну йоб твою мать...»\n\nПотвора Бакхарін повернула до неї свої величезні очі. Існувати такі очі не могли, вони мали б миттю запасти всередину, але все одно вп'ялися в неї. «Я починаю думати, що дружба й Гармонія, можливо, не розв'яжуть нашу проблему», - промовив він гучним співучим голосом, наче двох чоловіків не було за столом. «Як гадаєте?»"
 OMO_aprilfools.2.a: "«Вам неодмінно слід спробувати оголосити війну їм обом водночас. Це все владнає»."
 OMO_aprilfools.2.b: "Єлєна втомлено знизала плечима. Переговори тривали."
 
 OMO_aprilfools.3.t: "Взірець пристойности й спокою"
 OMO_aprilfools.3.desc: "«Мені й без того гидко сидіти поруч зі зрадником соціялістичної справи, - виплюнув Яґода, люто дивлячись на Сабліна, - а сама думка, що я маю слухати й виконувати накази клятого коня... Тобто, Господи, це ж довбаний абсурд. Наче я потрапив у якусь кляту казочку».\n\nСаблін відняв руки від обличчя. Перед ними був не впевнений у собі революціонер, а виснажений чоловік, який намагався втримати останні крихти здорового глузду. «У нас із Ґєнріхом були розбіжності, але цього разу я мушу погодитися. Це вже занадто. Це...» Він замовк, хитаючи головою. «Усе це взагалі справжнє?»\n\n«Авжеж справжнє!» - відповів Бакхарін без крихти самоусвідомлення. «Якщо я щось і зрозумів за останні місяці, то це те, що справжня сила не в могутній державній службі безпеки, - він глянув на Яґоду, - і не в поверненні до правдивих марксистсько-ленінських принципів, - він глянув на Сабліна, - а в спільній праці заради великих звершень! Правда ж, товаришко Панова? Ви ж пам'ятаєте Перший Всепонійний Конґрес?»\n\nРот Єлєни розтулився, наче в риби, та раптом Яґода підвівся з-за столу й вихопив пістолет з-за пояса. «Досить. З мене годі цього клятого божевілля. Довбаний всепонійний конґрес. Я не можу... Я відмовляюся... Я не знаю, що ти, блядь, таке, але ти не Ніколай Бухарін. У тебе п'ять секунд, щоб забратися, перш ніж я відкрию вогонь».\n\nТроє інших учасників переговорів відступили від столу з піднятими руками й копитами. «О ні, Єлєно!» - промовив медоточивим голосом Бакхарін. «Схоже, потоваришувати з товаришем Яґодою буде значно важче, ніж ми думали! Що ж нам робити?»"
 OMO_aprilfools.3.a: "«Війна. Треба піти звідси й негайно оголосити війну Яґоді та Сабліну. Певна, усе закінчиться чудово»."
 OMO_aprilfools.3.b: "«Вам неодмінно слід продовжити розмову з безумцем, який погрожує вас застрелити»."
 
 OMO_aprilfools.4.t: "Нічий бік"
 OMO_aprilfools.4.desc: "Бакхарін глибоко вдихнув і підбіг до чоловіка з пістолетом. «Іноді дружити важко, і дружбу треба плекати, але коли ми працюємо разом, це змінює все. Дозволь показати».\n\nТоді, на загальний подив, Ніколай Бакхарін, колишній Генеральний секретар Комуністичної партії Совєтського Союзу, заспівав:\n\n«Спершу я не знав, як бути.\nГадав, що знаю все потрібне, не відав, чого чекати,\nТа щойно мури впали, я побачив правду,\nВесь цей час чогось бракувало,\nІ думаю, ти теж це збагнеш!»\n\n«Якого хуя ти...»\n\nЄлєна з жахом спостерігала, як Саблін зняв кашкета й відійшов від стіни. А тоді, наче одержимий, він теж заспівав:\n\n«Ось де твориться комунізм!\nОсь як живе комунізм!\nНаші рухи міцно сплітаються,\nУзи глибшають і довше тримаються,\nА найвеличніший гімн, який ми пізнаємо,\nРозповість, як Магію Комунізму ми зростимо!»\n\nНевідомо звідки залунала музика, дедалі гучніша. Повітря заповнили блискітки й видіння дивних світів. Яґода закричав і позадкував; пістолет тремтів у його руці, а магія Бакхаріна просочувалася в розум. Єлєна мала лише мить, щоб діяти."
 OMO_aprilfools.4.a: "«СТРІЛЯЙ У ЦЬОГО ШКУРОХОДА, ҐЄНРІХУ! ЗАРАДИ ВСЬОГО СВЯТОГО!»"
 OMO_aprilfools.4.b: "«Ось де твориться комунізм. Ось де твориться комунізм. Ось де...»"
 
 OMO_aprilfools.5.t: "Гірський дует"
 OMO_aprilfools.5.desc: "Подумки Єлєна була далеко від цієї кімнати, далеко від цієї сцени. Вона дивилася, як Саблін і Бакхарін співають і танцюють про цінність дружби. Як пісня коня вчепилася в мозок Яґоди, і старий революціонер долучився до них низьким, хрипким баритоном. Як вони без підготовки чи пояснень виконують складну хореографію й гру слів.\n\nКоли музика стихла, товариш Яґода повернувся до коня й сказав чужим голосом: «Дякую, товаришу. Тепер я бачу, що, працюючи разом, ми справді можемо досягти значно більшого».\n\n«Цілковито згоден», - сказав Саблін, обіймаючи свого ворога, чоловіка, якого поклявся знищити. Його рот, здавалося, рухався незалежно від тьмяних, скляних очей. «Ми зрозуміли, що дружба не завжди дається легко. Але за неї, без сумніву, варто боротися».\n\nПотвора протиснулася між двома чоловіками. Вона викрутила свої кінські передні ноги, щоб обійняти їх. Її обличчя спотворилося в подобу усмішки. «Я радий, що заради Росії ми змогли відкинути розбіжності. Ми об'єднаємо наші державки під спільним стягом Гармонії. Ми працюватимемо разом як друзі, і все це завдяки пораді моєї доброї подруги...»\n\nБільше вона не витримала. Єлєна відвернулася й вибігла з кімнати переговорів. Вартові тривожно дивилися на неї, коли вона проминала їх, розпатлана, зі слізьми, що лилися по обличчю, але їй було байдуже. Вона могла думати лише про те, як Саблін і Яґода піддалися на кінські хитрощі. Про те, як дедалі більші простори її Батьківщини опинялися під владою балакучого співучого коня."
 OMO_aprilfools.5.a: "Яка радість у здоровому глузді?"
 OMO_aprilfools.5.a.tt: "§CГармонійну область Байкал§! буде утворено під проводом об'єднаної §YГармонійної Президії§!."
 
 OMO_aprilfools.6.t: "Дружнє прощання"
 OMO_aprilfools.6.desc: "Міхаїл сидів на напрочуд зручному ліжку в тюремній камері й пошепки повторював російську промову, яку підготував за час короткого ув'язнення. Якщо пощастить, він вийде звідси живим. Раптом одне з конеподібних створінь постукало копитом по ґратах і сказало Міхаїлу англійською з сильним акцентом: «Генеральний секретар хоче вас бачити». Міхаїл хутко виструнчився, коли до нього наблизилася кінська постать, а двері камери відчинили.\n\nЄдиноріг, якого ці коні звали своїм провідником, почав говорити: «Міхаїле Романов. Ваш уряд капітулював перед Союзом Гармонійних Соціялістичних Республік...»\n\nМіхаїл миттю впав навколішки й почав благати про милосердя: «Будь ласка, пане, змилуйтеся! Я ніколи не хотів правити Росією, я навіть не хотів залишати Австралію! Я лише хочу побачити...»\n\nЄдиноріг урвав Міхаїла, обійнявши його, принаймні Міхаїл вирішив, що це були обійми. Пригортаючи колишнього царя, єдиноріг заспокійливо промовив: «Не хвилюйтеся, Міхаїле. Ми не хочемо завдати вам болю. Власне, я прийшов сказати, що ми відправляємо вас додому, в Австралію».\n\nМіхаїл ледве спромігся подякувати єдинорогові, так сильно він ридав. Нарешті він знову побачить родину, нарешті повернеться додому. Ніщо не могло зробити його щасливішим."
 OMO_aprilfools.6.a: "Дім - наймиліше слово у світі."
 
 OMO_aprilfools.7.t: "Падіння"
 OMO_aprilfools.7.desc: "Константін Родзаєвскій майже нічого не чув, окрім радісних вигуків юрби. З пов'язкою на очах і руками, зв'язаними за спиною, він чудово розумів, що зараз станеться. Він мав би боятися. Натомість він просто не міг нічого збагнути.\n\nПоні. Його перемогли поні. Завойовники належали до нижчої раси, були недолюдьми в усіх можливих значеннях, і все ж знищили його армії та підкорили державу. Це було неможливо. Усі його логічні побудови, від фізичних до расових, лежали в руїнах.\n\nЛіворуч загримів чийсь голос. «Хоч ідеологія Гармонії не схвалює страт, ми завжди були готові зробити рідкісний виняток. У випадку Константіна Родзаєвского ми бачимо послідовність жорстокости й насильства, що, на жаль, не піддається виправленню. Попри суперечливість цього рішення, ми визнали його єдиною відповіддю».\n\nЮрба вибухнула оплесками. Раптом Родзаєвскій відчув, як його тіло відірвалося від підлоги, наче він падав угору. Сподіваючись знайти тверду опору, він почав звиватися й бити ногами, та зміг лише скинути пов'язку. Коли тканина впала з очей, він нарешті побачив юрбу.\n\nУнизу, певно, зібралася ціла армія з тисяч людей і поні. Наймогутніші з-поміж них мали прекрасні роги, осяяні магічною силою, якою йому ніколи не судилося володіти. Спільними зусиллями вони підіймали його до шибениці. Це була справжня гармонія класів - корпоративістська мрія, яку він завжди уявляв, здійснена нелюдською расою.\n\nІ тоді він це відчув. Мотузку, що затягувалася довкола шиї, сяючи могутнім світлом, обвиваючись і скручуючись позаду нього.\n\nНарешті, лише на мить, він пізнав справжній страх."
 OMO_aprilfools.7.a: "А тоді він упав."
 
 OMO_aprilfools.8.t: "Урочисте відкриття"
 OMO_aprilfools.8.desc: "Академія Дружби була найвизначнішим внеском Бакхаріна в академічне життя Росії - величезне розлоге містечко, цілковито присвячене вивченню дружби й гармонії, із надзвичайно потужним дослідницьким відділом еквестрійських речовин. Зведена винятково магією з приголомшливого білого мармуру, Академія мала в самому серці старовинний замок із величезною авдиторією, де великий алікорн нині промовляв перед кількома тисячами блискучих молодих умів.\n\nСеред цієї юрби непомітно сиділа молода єдиноріжка з вогненно-рудою гривою, яка прибула дуже, дуже здалека, щоб бути тут у цю мить. Вона могла б приїхати з друзями, та вирішила, що доречніше прийти в цей новий світ самій - так само, як колись прийшла у світ, що тепер став її домом. До того ж вони мали домашнє завдання.\n\nГомін юрби враз ущух. З гучним тріскотом алікорн магічно посилив голос, щоб той прогримів усією авдиторією, і почав промову.\n\n«Люди, поні, істоти всіх видів! Мене звати Ніколай Бакхарін, і я головпоній цієї відродженої держави, що нині стоїть за Мир і Гармонію для всіх. Не так давно я поневірявся безкрайніми пустками Сибіру, злиденний і загрузлий у відчаї, у ненависті до себе за те, що підвів Батьківщину й народ у годину найвідчайдушнішої потреби. Та одного дня я зустрів магію, магію дружби, а решта... решта вже історія. Цей заклад засновано з тим самим духом і тією самою надією, які я відчув того доленосного дня, щоб сприяти поступу гармонійних ідеалів і науки. Тому його двері відчинені не лише для моїх совєтських співвітчизників, а й для істот з іншого світу, з будь-якого іншого світу. Тут кожен може продовжити освіту, і цими словами я оголошую Академію Дружби відкритою!»\n\nЯскравий спалах магії запалив у небі величні феєрверки й освітив обличчя натовпу, що ревів і кричав на знак схвалення. Сансет усміхнулася й почала заповнювати заяву."
 OMO_aprilfools.8.a: "Добре, що було дистанційне навчання, справді дуже дистанційне."
 
 OMO_aprilfools.9.t: "Камінґ-аут"
 OMO_aprilfools.9.desc: "«Мамо, тату, я маю вам дещо сказати, але спершу пообіцяйте, що не сердитиметеся».\n\nСцена в оселі Мєдвєдєвих була б незбагненною ще рік тому. Батьки Лєни сиділи перед нею на маленькому дивані в крихітній вітальні й із неприхованою тривогою дивилися на свою юну доньку-поні. Вона вже давно збиралася з духом, щоб поговорити з ними, і нарешті зважилася після особливо важкого дня на ринку.\n\n«Щось сталося, Лєночко? - запитала мати. - Це ж не той хлопець Сєрґєй знову тобі докучає?»\n\n«Спершу пообіцяйте», - відповіла Лєна, міцно заплющивши очі. Вона вже відчувала, як навертаються сльози.\n\nБатьки перезирнулися. «Обіцяємо. Ти ж знаєш, що можеш розповісти нам усе», - відповів батько, незвично похмурий замість звичайної веселости.\n\nМолода кобилка глибоко вдихнула. «Мамо, тату, я... мені не подобаються хлопці, мені подобаються дівчата. Я так боялася вам сказати, бо дуже вас люблю й не хотіла, щоб ви мене зненавиділи, і подумала, що тепер, коли я стала поні, я...»\n\nКімнату заповнила незручна тиша, й Лєна приготувалася до неминучого крику чи чогось гіршого. Натомість здригнулася від несподіванки, коли дві пари рук огорнули її в теплих обіймах. «Єлєно Іванова, ми ніколи не зможемо тебе зненавидіти, - заявила мати. - Любиш ти хлопців чи дівчат, для нас це не має значення, бо ти все одно наша донечка».\n\n«Твоя мати має рацію, - продовжив батько. - Не думай, що це хоч щось змінює. Тобі однаково треба зняти білизну, ось-ось дощитиме».\n\nМати награно обурилася, але цього вистачило, щоб прорвати греблю. Задушений смішок переріс у ридання, і ще довго троє Мєдвєдєвих стояли в обіймах, задоволені тим, що можуть жити й любити цієї миті, не турбуючись про завтра."
 OMO_aprilfools.9.a: "Гармонія - це і любов, і прийняття."
 
 OMO_aprilfools.10.t: "Маніфест Отця"
 OMO_aprilfools.10.desc: "Останнім часом Бакхарін не міг дивитися на газету. Новини ставали дедалі похмурішими: менше теплих історій про врятовані поніфікацією життя, більше страхіть про великі протести й наляканих людей. Схоже, навіть газети почали вірити в побрехеньки Алєксандра Мєня. Бог знає чому, та людство почало слухати цього вуличного проповідника. Можливо, Бог і справді був на його боці.\n\nСьогодні на першій шпальті «Іркутського оглядача» не було навіть статті. Мєнь чи хтось із його послідовників викупив усю сторінку, щоб опублікувати особливий твір самого Мєня. Він назвав його «Маніфест Отця». Бакхарін мимоволі засудив його: яка людина була б настільки пихатою, щоб назвати себе Отцем?\n\nНаписано принаймні вправно й без відвертих образ. Попри всі вуличні промови про зло поніфікації, Мєнь довго говорив про те, що поні потребують «захисту», послуговуючись тією самою мовою, що й понійські радикали. Та під нею ховалося щось зловісне. Отець закликав уряд зареєструвати всіх поні, певно, його власний уряд. Навіщо такі відомості людині на кшталт Мєня?\n\nБакхарін відклав газету. Мало статися щось погане, щось небезпечне. На Гармонійний Союз насувалися темні дні, і Бакхарін не міг вигадати жодних ліків."
 OMO_aprilfools.10.a: "Навіть Головпоні міг лише молитися."
 
 OMO_aprilfools.11.t: "Божественний марш"
 OMO_aprilfools.11.desc: "Спершу похід на Іркутськ здавався нічим не примітним. Отець почав щонайбільше з кількома сотнями людей, усі вони були його послідовниками й співали та галасували, як робили вже сотню разів. Здавалося, Божественний марш може зазнати невдачі.\n\nТа уряд не міг передбачити сили прихильників Мєня. З лав Божественного маршу лунав гімн за гімном, старі пісні, які кожен старший росіянин знав напам'ять. Для людей, що після місяців стабільности зачинилися у своїх домівках, ці пісні відлунювали в серцях, нагадуючи про минулі дні, про дім.\n\nДля поні вони не несли такої надії. Людські пісні могли оспівувати дружбу, але на вулицях ішли не за гармонію. Серед них не було жодного поні, очевидно, їхнє бачення стосувалося лише людства. У рожевій ностальгії протестувальників не знайшлося місця понійству.\n\nМожливо, поліція могла змусити Божественний марш розійтися. Та що це дало б? Увесь Гармонійний Союз, усі здобутки Бакхаріна трималися на гармонії між двома расами. Смерть Отця лишила б на Союзі не менший шрам, ніж його прихід до влади.\n\nТож Алєксандрові Мєню дозволили безперешкодно дійти до Президії. Під сповненими надії поглядами людей, під нажаханими поглядами поні Мєнь вийшов на чоло юрби й став перед брамою Президії. Шляхетним громовим голосом він промовив слова, що змінили історію."
 OMO_aprilfools.11.a: "«Впустіть нас»."
 
 OMO_aprilfools.12.t: "Скорившись долі"
 OMO_aprilfools.12.desc: "Відколи сили Бакхаріна ввійшли до Іркутська, Юрій навчився ненавидіти поні за сам їхній вигляд. Барвисті й дивні, вони своїми перемогами лише дужче руйнували стару Росію, замінюючи її нісенітницею в цукровій глазурі. Коли Божественний марш проходив повз його квартал, він одним із перших приєднався до пастви. Коли вони дісталися брами Гармонійної штаб-квартири, Юрій на власні очі побачив, як усередину ввійшов його герой, Отець Мєнь.\n\nТоді Юрій уперше наблизився до Політбюро. Сьогодні був другий раз. Подейкували, що Отець Мєнь переконав Бакхаріна піти у відставку й незабаром держава знову стане краєм людей. У публіці вирувало збудження, за винятком кількох нажаханих поні, що наважилися прийти особисто. Настала пора людству належно повернутися.\n\nКоли Бакхарін підтюпцем вийшов на балкон, юрба заревіла, не від радости, а від самого передчуття. Та Головпоні не поділяв її запалу. Стоячи поруч з Алєксандром Мєнєм, Бакхарін виголосив коротку й прісну промову, лише відзначивши вади Гармонії та своє захоплення напрямом, у якому новий провідник поведе державу.\n\nТоді Бакхарін замовк. Лише на мить Юрій помітив на його довгому обличчі розчарування. Це не мало значення, запевнив він себе. Та все одно щось у цьому здавалося жорстоким. Бакхарін зробив для Росії все, навіть перетворився на чарівного коня, але приборкати державу так і не зміг. Попри все його історія закінчиться ще однією, останньою невдачею.\n\nНарешті Бакхарін оголосив те, чого всі чекали: він піде у відставку. Юрій урешті дозволив собі осягнути остаточність цієї миті. Навколо нього величезна юрба радісно вигукувала."
 OMO_aprilfools.12.a: "Прощавайте, Головпоні."
 OMO_aprilfools.12.a.tt: " \n§BТак добігає кінця мрія про утопічне суспільство, де §CПоні§! й §GЛюди§! могли жити пліч-о-пліч як бойові товариші, так розпускається нитка Гармонії. §YНіколая Бакхаріна§! вигнано з Президії, а §BАлєксандр Мєнь§! і радикальна людська фракція §RВКП(б)§! перебрали владу замість нього, на превеликий жаль Поні Далекого Сходу...\n\nОй, схоже, щасливого кінця вам не дісталося. Нумо, завантажте збереження й урятуйте Гармонійну Мрію! Я на вас розраховую.§!"
 
 OMO_aprilfools.13.t: "Тривожна вимога"
 OMO_aprilfools.13.desc: "День у Верховному Совєті починався як завжди, та Бакхарін помітив дивний настрій серед деяких делегатів-поні. Тоді один із них, Сємьон Рисаковскій, підвівся й звернувся просто до Бакхаріна: «Головпоні Бакхарін, я й кілька моїх колег-делегатів вирішили висунути вам просту вимогу. Офіційно визнати поні єдиними законними громадянами Росії, а людство оголосити нижчою расою, підлеглою понійству».\n\nБакхаріна приголомшила безглуздість вимоги, і він відчув, як кров відхлинула від обличчя. Ще більше його вразило, що понад десяток інших делегатів схвально кивали! Бакхарін насилу видавив відповідь: «Щ-Що? Як я можу схвалити таке, пропозицію, що суперечить кожному засадничому принципу гармонії?»\n\nВідповів не Рисаковскій, а Валєнтіна Всаднік, інша делегатка-поні: «Якщо ви не визнаєте потреби в таких діях, то не маєте права керувати своїми побратимами-поні!»\n\nРисаковскій додав до спалаху Всаднік: «Цей вибір матиме страшні наслідки, Головпоні», - і рушив до дверей. Всаднік та чимало делегатів-поні пішли за ним.\n\nБакхарін не зміг промовити ані слова, коли вони виходили, а в його животі утворився крижаний клубок."
 OMO_aprilfools.13.a: "Досягнуто точки неповернення."
 
 OMO_aprilfools.14.t: "Марш поні"
 OMO_aprilfools.14.desc: "Колись Адам Авіаносєц щиро вірив у Гармонію й палко підтримував Бакхаріна. Проте з кожним роком єдиноріг дедалі сильніше віддалявся від потреб своїх найвідданіших прибічників. Поні більше не були в безпеці в державі, яку збудували власними копитами, потом і кров'ю. Саме тому Адам охоче приєднався до товаришів з Рожевої Армії в марші на Верховний Совєт.\n\nКоли план тільки складали, вони очікували певної підтримки, та далеко не такої великої, яку зрештою здобули. Головний проспект Іркутська швидко заповнили бійці Рожевої Армії й десятки однодумців серед цивільних поні, які скандували вимоги вигнати делегатів із Верховного Совєту й покласти край людському пануванню над Союзом. Коли вони наблизилися до штаб-квартири, ґарнізон перегородив їм шлях. За ним стояв генерал Шрами, фіолетового тесрала легко було впізнати за плюшевою зеброю, яку він завжди носив із собою.\n\nЮрба стихла, і дехто з демонстрантів приготував зброю. Вони не хотіли бійки, але тепер уже точно не збиралися відступати, навіть якщо ґарнізон теж переважно складався з поні. Усі погляди звернулися до генерала Шрами, який мовчав, здавалося, цілу вічність. Нарешті він наказав: «Солдати, розійтися».\n\nПісля цього наказу ґарнізон розступився перед демонстрантами, наче Червоне море, а Адам та інші поні радісно закричали."
 OMO_aprilfools.14.a: "І отак вони опинилися всередині."
 
 OMO_aprilfools.15.t: "Грубе пробудження"
 OMO_aprilfools.15.desc: "Очі Бакхаріна розплющилися, коли гучний стукіт у двері пробився крізь сон. Перш ніж він устиг зрозуміти, що прокинувся, двері зірвали з завіс, а пів десятка солдатів-поні вдерлися до спальні Головпоні. Бакхарін лише спромігся сповзти з ліжка й опинився віч-на-віч із провідницею солдатів, генералом Лілі із Доліни.\n\nУ голові Бакхаріна роїлася тисяча думок, усі погані. Його серце не билося так шалено відколи понад двадцять років тому він почув звістку про «Барбароссу». «Щ-Що відбувається, генерале? Що це все таке?!»\n\nЗаспаний єдиноріг не міг прочитати обличчя генерала Доліни, хоч і відчайдушно шукав у її виразі бодай якусь надію. Але не знайшов розради, а її слова знищили останні рештки сподівань: «Головпоні Ніколаю Бакхарін. Вас заарештовано за злочини проти понійства. Прошу не чинити опору».\n\nСолдати схопили Бакхаріна, а в такому стані він не міг їм опиратися. Він навіть не встиг осмислити слова генерала Доліни. На голову й ріг йому натягнули чорний мішок і змусили вийти з кімнати.\n\nКуди його вели, він не знав."
 OMO_aprilfools.15.a: "Так у віко труни забили останнього цвяха."
 OMO_aprilfools.15.a.tt: " \n§BКолеса змін розкрутилися без упину, і §CПоні§! опинилися на вершині. У тундрі панує хаос: поміркований уряд §YНіколая Бакхаріна§! повалила група радикальних поні з Президії. Без провідника Президія без кінця гризеться за долю держави, а мільйони з відчаєм спостерігають, як люди розходяться по домівках і відмовляються спілкуватися з представниками іншого виду. Гармонія впала.\n\nОй, схоже, щасливого кінця вам не дісталося. Нумо, завантажте збереження й урятуйте Гармонійну Мрію! Я на вас розраховую.§!"
 
 # OMO_aprilfools.16 is a hidden event, doesnt require loc.
 
 OMO_aprilfools_warlord.1.t: "Метаморфоза"
 OMO_aprilfools_warlord.1.desc: "Першою думкою Ніколая Бухаріна було те, що він помер.\n\nТаке відчуття виникало в нього не вперше. Життя після Великої Вітчизняної війни складалося з нескінченних лих, утрат і страждань. За роки таємного вигнання в Сибіру він не раз дивом уникав смерти. Цілком логічно, що зрештою удача мала скінчитися й він мав загинути, як стільки людей до нього.\n\nАле якщо він помер, чому його переповнювала радість? Чому він досі відчував ревіння вогню й ніжний дотик снігу? Чому його тіло здавалося таким дивним?\n\nБухарін спробував пригадати. Він пам'ятав, як тремтів і розпалював багаття. Пам'ятав блиск якогось каменя чи самоцвіту серед вугілля, неземне сяйво. Він простягнув руку, щоб узяти його, зрозуміти, а тоді... Біль. Агонія. Шкіра злазила, кістки викривлялися. Можливо, він і кричав, якби не видіння.\n\nКрізь біль він побачив незнаний світ. Побачив суспільство істот, щасливих і гармонійних, вільних і рівних, не обтяжених стражданнями. Вони жили як рівні, союзники, друзі. Ці дивні створіння, що ходили підтюпцем і носили яскраві строкаті вбрання, жили в суспільстві досконалішому за будь-яку диктатуру пролетаріяту.\n\nБухарін почув, як хихикає незнайомим високим голосом. Він розплющив величезні очі й підвівся на всі чотири копита. Стояв перед жаріючим багаттям, доки не помітив кристал серед вугілля й відбиття дивної істоти в ньому. Сам не розуміючи чому, він вигукнув:"
 OMO_aprilfools_warlord.1.a: "«Ой лишенько, поні!»"
 OMO_aprilfools_warlord.1.a.tt: "§CГармонійний Союз§! постане."
 
 OMO_aprilfools_warlord.2.t: "Дарованому коневі в зуби дивляться"
 OMO_aprilfools_warlord.2.desc: "Коли Анатолій, молодий дослідник, який із кількома колегами робив усе можливе, щоб зберегти в Російській Анархії світло науки, пішов на полювання по вечерю, небо було ясним і сонячним. Коли він уполював їжу, небо вкрилося хмарами. Анатолій не зважив на них, гадаючи, що нічого не станеться.\n\nЯк же він помилявся.\n\nЗненацька пішов сніг. Спершу він падав, наче на стереотипній картинці зимової казки. Потім повалив сильніше... ще сильніше... і ще сильніше.\n\nЗрештою Анатолій заблукав. Притиснувши наплічник до грудей, він пробирався крізь бурю, та не міг знайти жодного орієнтира. Хвилини тяглися й перетворювалися на години, а воля йти далі поступово згасала. Можливо... Можливо, краще просто здатися.\n\nКоли Анатолій уже майже впав, перед ним з'явилася таємнича постать. Стурбованим голосом вона повела його до будинку, що поволі виринав зі снігу, поки він ішов до нього. Зігрівшись і тримаючи в руках чашку супу, Анатолій похитав головою й уважніше роздивився постать.\n\n...Якої ще тричі проклятої матері! Це була не людина, а... балакучий кінь! Поні! Цей-таки балакучий кінь накривав стіл для нього й свого гостя. Голова Анатолія йшла обертом. Стривайте. Він десь бачив це обличчя.\n\nЦе що... «Бухарін? Ніколай Івановіч»?\n\nБакхарін знову повернувся, усміхнувся й удавано вклонився."
 OMO_aprilfools_warlord.2.a: "«Так, товаришу. Власною персоною»."
 
 OMO_aprilfools_warlord.3.t: "З любов'ю"
 OMO_aprilfools_warlord.3.desc: "Алєксєй Риков без кінця перечитував листа перед собою. Коли лист щойно прибув, його наповнила радість, якої він не відчував, здавалося, цілу вічність. Зрештою, це був лист від старого друга Бухаріна, від якого вже десятиліттями не було звісток. Та що далі він читав, то сильніше його охоплювало моторошне відчуття: виявилася дивна невідповідність.\n\nІм'я «Bukharin» і в адресі, і в підписі було написано як «Buckharin». Можливо, ненавмисна помилка, та Риков не міг уявити, щоб Верховний Провідник СССР двічі неправильно написав власне ім'я, хоч як тяжко позначився б на ньому вік.\n\nНевже це якийсь хворий жарт? Жорстоке глузування зі старого чоловіка та його бажання знову зустріти давно втраченого друга? Ні, ні, це неможливо. У листі яскраво описано найдорожчі миті їхньої дружби, подробиці, які могли знати лише Риков і Бухарін.\n\nРиков сидів на дивані на межі сліз. Від прибуття листа минув день, а бідолашний Риков і далі нічого не розумів. Раптом з-за вхідних дверей долинув ледь чутний стукіт. Риков нерішуче наблизився, дивуючись, хто здіймає такий галас у пізню годину.\n\nЧи не про цей стукіт він мріяв? Чи це довгоочікуване прибуття невловимого товариша? Він трохи прочинив двері й розгледів незбагненний силует за ними. Відчинив ширше. І раптом відсахнувся. На його подив і жах, істота перед ним мала впізнавані риси старого друга Ніколая Бухаріна, та людиною не була. Це... він був поні."
 OMO_aprilfools_warlord.3.a: "«Що сталося, Риков? У тебе такий вигляд, наче привида побачив»."
 
 OMO_aprilfools_warlord.4.t: "Звернення"
 OMO_aprilfools_warlord.4.desc: "Вони з'їхалися до Омолона з усієї Росії. Одні покинули багаторічну службу Яґоді. Інші подолали шлях аж зі Свердловська. Вони полишили родини, домівки й кар'єри заради безумної надії, що Голова Ради Народних Комісарів Ніколай Бухарін повернувся, щоб відновити Союз.\n\nА тоді виявилося, що Бухарін став якимось потворним конем.\n\n«Товариші, - вигукнула чотиринога потвора, будьонівка якої криво сиділа на чомусь, схожому на ріг. - Революційні ідеали не можуть обмежуватися державою. Щоб здолати капіталістичне хижацтво, ми повинні втілювати марксистські ідеали в повсякденному житті, у наших стосунках. Ми маємо стати авангардом революції дружби!»\n\nКоли колишній совєтський провідник закінчив, у кімнаті запала тиша. Тоді один із прибулих комуністів різко прошепотів: «Це ж... не може бути серйозно, правда?»\n\nЗнову мовчанка. «Не знаю, Єлєно. Енґельс таки писав про буржуазну й пролетарську родину. Гадаю, нам... варто усвідомлювати експлуатацію в усіх людських відно...»\n\n«У дружбі? Ви ж чули, що балакучий кінь говорив про дружбу, так?» Єлєна Панова озирнулася, нажахана кількістю людей, які кивали й повторювали думки коня. «Ми певні, що ця істота - Ніколай Бухарін?»\n\nЇї супутник знизав плечима. «Та хай він хоч зелений чоловічок. Я ніколи не йшов за натовпом, але якщо в нього є ідеї, як урятувати Совєтський Союз...» Він дивився, як людина-кінь спілкується з авдиторією. «Я готовий дати йому шанс»."
 OMO_aprilfools_warlord.4.a: "«Але ж це балакучий кінь?»"
 
 OMO_aprilfools_warlord.5.t: "Еквінологічний конгрес"
 OMO_aprilfools_warlord.5.desc: "Перший Всепонійний Конґрес, сама назва якого досі змушувала Єлєну прагнути смерти, відбувся в Омолоні, у маленькій приземкуватій будівлі, що водночас слугувала станцією відпочинку оленярів. Час від часу хтось із них заходив усередину з холоду, бачив яскраво-рожеві прапори й миттю розвертався. Стоячи серед юрби інших російських делегатів, Єлєна міркувала, чи не ліпше було б зробити так само.\n\n«Чимало народу, еге ж, товаришко?» - пролунав голос. Єлєна повернулася й здригнулася, побачивши Бухаріна чи... Бакхаріна. Він був коричневий, заввишки близько чотирьох футів, а його очі були такі величезні, що Єлєна бачила в них відбиття майже всієї кімнати. Вона стримала стогін.\n\n«Так, - відповіла вона з усією ввічливістю, на яку була здатна. Вона не могла повірити, що перебуває тут. Не могла повірити, що покинула товариша Яґоду через саму лише чутку про те, що Бухарін живий. - Гадаю, усім нам було... цікаво дізнатися... про...»\n\n«Гармонію?» - сказав Бакхарін, колись шанований комуністичний провідник, а тепер кінь. Його хвіст заметлявся з боку в бік. «Справді, останні роки Батьківщина безцільно блукає, розділена деспотами й безумцями. Урятувати її може лише справді радикальна думка. Лише прийнявши силу дружби, ми врятуємо Совєтський Союз!»\n\nПогляд Єлєни знову ковзнув до дверей, до морозу надворі. Так легко було б утекти зараз, зникнути серед працівників Яґоди чи відкинути все й стати оленяркою. Але вона не могла змусити себе. Хоч яким безумним був цей балакучий звір і його балачки про дружбу, він пропонував бодай мізерну можливість успіху. Єлєна болісно зітхнула."
 OMO_aprilfools_warlord.5.a: "«Ми всі прагнемо почути ваші нові теорії... Бакхаріне»."
 
 OMO_aprilfools_warlord.6.t: "Магічна дружба та її блискучі дари"
 OMO_aprilfools_warlord.6.desc: "Звуки металу, що вдаряв об кристал, і робочих чобіт, що дзенькали об кристалічну підлогу, сповнювали шахти, створюючи дивовижно затишну атмосферу, хоч для вух Павла вони й були чужими. Оглядаючи новостворену камеру, де видобуток кристалів був іще більшим, ніж в інших частинах комплексу, він почув новий звук: легше цокання копит по кристалу, що сповіщало про поні без спорядження, який підійшов до нього.\n\n«Як просуваються розкопки, Павле?» - запитав Владімір, зупинившись біля його плеча. «Конгрес хоче... ні, потребує, щоб усе йшло добре». Владімір був другом Павла з дитинства, а тепер став одним із найвищих за рангом поні в шахтах. Їм часто доводилося працювати разом, і хоча Павло досі не вважав поніфікацію цілком нормальною, його друг лишався другом, хоч якої форми набув.\n\n«Усе йде добре! Деякі етапи виробництва ще можна поліпшити, та загалом, гадаю, Конгрес буде задоволений нашою роботою».\n\nДрузі знову повернулися до розлогої маси поні й людей перед ними, де кожен докладався відповідно до своїх талантів. Люди працювали біля стін, поволі видобуваючи кристали, які поні виносили з камери. За всім наглядали єдинороги, здатні силою думки рухати саме каміння. Ніхто не міг нарікати на начальство, що насправді полегшувало твою роботу. Усю цю картину огортало дивне блискуче світло промислових ламп, відбите кристалами, що сяяли в усій залі."
 OMO_aprilfools_warlord.6.a: "Виявляється, дружба дає не лише магію."
 
 OMO_aprilfools_warlord.7.t: "Пошуки на краю світу"
 OMO_aprilfools_warlord.7.desc: "Світанок настав пошепки, сонячні промені розтікалися замерзлою землею, наче мед, розмазаний по хлібу. Вони пливли долинами, вздовж річок, поміж дерев, аж доки не дісталися маленького табору, одного з найдальших форпостів суспільства на самому краю світу.\n\nСоню розбудив звук рубання дров; день уже почався, а вона досі лежала щільно закутана в наметі. Хутко приготувавшись, вона вийшла назовні, де її зустрів сліпучий блиск сонця на свіжому снігу. Соня дивувалася відчуттю снігу під копитами, незвичному, але не зовсім неприємному дотику, м'якому, прохолодному й свіжому. Вона погодилася на поніфікацію лише перед від'їздом заради свого загону: однакова кількість поні та людей була ідеальним складом для дослідження сибірської глушини.\n\nДо неї підійшов командир, тримаючи завдання в руках. Їм видали три пристрої, здатні вказувати напрям до кристалів, наче старовинна лозоходська рамка. Зазвичай кристали всередині ледь мерехтіли, майже непомітно при денному світлі. Та прилад у руках командира яскраво сяяв, заливаючи його тіло м'яким фіолетовим світлом.\n\n«Соню, добре, що ти вже прокинулася!» Його усмішка була щира, але втомлена. «Виявляється, ми натрапили на те, що шукали, й навіть не помітили. Схоже, табір стоїть просто над родовищем кристалів».\n\nНа мить Соня зраділа, та швидко зрозуміла, що щось не так. Учора детектори мали б аж дзвеніти, проте навіть уночі лише світилися трохи яскравіше. Якщо вони нічого не виявили, то довколишні кристали були чимось укриті. А тоді вона побачила його й усе зрозуміла. На саморобному ліжку поруч із частково викопаною канавою лежав її друг Яков. На відміну від минулої зустрічі, тепер він теж був поні."
 OMO_aprilfools_warlord.7.a: "Підступи Сибіру вразили чергову необачну душу."
 
 OMO_aprilfools_warlord.8.t: "Інша порода робітників"
 OMO_aprilfools_warlord.8.desc: "Гуркіт двигунів і хмари пилу сповнювали ранкове повітря: вантажівки виїжджали з двору на дорогу, доверху навантажені гірничим обладнанням та чоловіками й жінками, яким належало ним користуватися.\n\nТобто чоловіками, жінками й поні.\n\nОстання група неабияк бентежила Максіма, який працював у шахтах Сибіру майже все життя. Його й без того приголомшувало входження поні в повсякденне суспільство. А потім він дізнався, що на першій роботі при новому північносибірському уряді працюватиме в нещодавно відкритій кристалічній шахті разом із цими поні. Отак він і опинився затиснутим між двома дивними створіннями у вантажівці, що прямувала до шахт.\n\nКоли вантажівка заторохтіла ґрунтовими дорогами, усередині було тихо, наче в могилі. Чути було лише машину й поодиноке човгання людей та поні. Зрештою мовчанку порушив молодик, який ще не працював на таких великих проєктах. Він поставив технічне питання, у якому Максім добре знався, та щойно він розтулив рота, заговорив поні поруч.\n\nВиявилося, він хибно оцінив поні, і їхній вік, і досвід. Той, що праворуч, був старим майстром і добровільно поніфікувався, щоб спростити міжвидову співпрацю. Той, що ліворуч, був ветераном Західноросійської війни. Поніфікований одним із перших, він став одним із небагатьох охоронних праців... поніців, призначених до цього проєкту.\n\nПопри всі дивовижі, з якими Максім досі не міг змиритися, їхні історії та спільне наставництво молодших звучали люд... поняно. Коли вони дісталися шахти, Максім уже починав бачити поні в іншому світлі."
 OMO_aprilfools_warlord.8.a: "Може, ми таки зможемо порозумітися."
 
 OMO_aprilfools_warlord.9.t: "За жалюзі"
 OMO_aprilfools_warlord.9.desc: "Широкі вікна кабінету наглядача мали відкривати вид на кожен закуток Омолонського гірничого комплексу, та майже завжди жалюзі були щільно закриті. Спокійний і нічим не примітний поні-наглядач більше дбав про достаток, ніж про добробут. Лише зрідка він обходив підприємство, перевіряючи, чи робітники й далі гарують. Більшість часу він сидів у кімнаті й насолоджувався тишею свого високого кабінету.\n\nМісяцями його ранок починався однаково: закрити жалюзі й прочитати свіжу газету. Сьогодні, як завжди, новини були погані. Головпоні запровадив нові правила для його галузі: Профспілку кристалічних шахтарів. Робітників і так було важко знайти, як тепер із ними впоратися?\n\nРаптом наглядач почув шум надворі. Вирішивши, що це дрібна сварка, він спробував повернутися до газети, та шум ставав дедалі виразнішим і гармонійнішим, гучнішим за будь-які навушники. Схоже, хтось скандував.\n\nРоздратований наглядач розсунув жалюзі. Нарешті він побачив свою зміну. Під кабінетом зібралися сотні робітників, людей і поні, вони кричали й махали плакатами. Хтось, певно новий представник профспілки, вигукував вимоги, але наглядач поки не слухав. Із цим можна розібратися пізніше. Головне, вони не працювали й псували йому ранок.\n\nНаглядач схопив зі столу мегафон і розчинив вікно. «Гаразд, гаразд! - заверещав він до натовпу. - Я зустрінуся з вашим провідником, хай хто це буде. Тільки дайте мені повернутися до читання».\n\nНаглядач зітхнув і повернувся до газети. Знадвору долинули тихі радісні вигуки."
 OMO_aprilfools_warlord.9.a: "Дивна така перемога."
 
 OMO_aprilfools_warlord.10.t: "Тимчасові робітники"
 OMO_aprilfools_warlord.10.desc: "Зазвичай наглядач проводив ранок із кавою та газетою. Сьогодні все було інакше. Його робітники почали протест. Вони мали згадати, хто тут начальник, навіть якщо для цього доведеться навчати нову зміну на сибірському морозі, далеко від теплого кабінету.\n\nНа підготовку вистачило кількох годин. Відверто кажучи, робота вимагала більше розуму, ніж сили, особливо з огляду на яскраве сяйво кристалів. Єдиною проблемою був бойовий дух. Коли посеред шахтарського селища вирував протест, приховати сутність роботи було неможливо. Наглядач міг називати цих чоловіків «тимчасовими робітниками» лише до певного часу. Вони були штрейкбрехерами й, зважаючи на протест, чудово це знали.\n\nКоли нова зміна була готова спуститися до шахти, більшість уже змирилася зі своєю роллю. Лише один знервований робітник лишився позаду, раптом охоплений докорами сумління. У короткому пориві непокори він звернувся до начальника: «Що заважає нам приєднатися до протестувальників?»\n\nСпантеличений наглядач не відразу знайшов відповідь. «Нічого, власне, хоча вони, певно, ненавидять вас за штрейкбрехерство. Я просто знайду нових робітників. Тут, на півночі, вас багато, а я один. Пам'ятай це, перш ніж поставиш іще одне дурне питання».\n\nЖеребець приголомшено дивився на нового начальника. Наглядач лише вказав на шахтний стовбур."
 OMO_aprilfools_warlord.10.a: "«А тепер до роботи!»"
 
 OMO_aprilfools_warlord.11.t: "Несподіваний гість"
 OMO_aprilfools_warlord.11.desc: "Сєрґєй не розумів, чому Іван вирішив, що випадкова стодола на два села північніше за дідька на морозі - ідеальне місце, щоб бавитися з магічним кристалом. Стерильно там точно не було, та й їхати від дому Сєрґєя страшенно далеко. Принаймні Алєксєй приніс горілку, багато горілки, тож вони могли хоч трохи розважитися, поки заробляли обмороження.\n\n«Я вистрелю в нього з пістолета», - сказав Іван, хитаючись і шукаючи зброю в задній кишені.\n\n«Ага! Стривай, щ...» Сєрґєй не встиг запитати, що відбувається, як гримнув постріл і яскравий спалах освітив стодолу. Коли Сєрґєй знову зміг бачити, кристал зник. На його місці висіло в повітрі сяйне кільце. Воно було наче вікно, крізь яке відкривався цілковито інший краєвид, не схожий на малу стодолу, де сиділи науковці.\n\nТоді крізь портал щось пролетіло. Кулясте, із двома парами крил і чотирма ногами. Великі фасеткові очі, як у комахи. А потім сяйне кільце зникло з тихим «плоп». Після кількох хвилин крику, плачу й п'яної стрілянини Алєксєю вдалося замкнути істоту в ящику з-під горілки, який вони спорожнили. Коли всі заспокоїлися, Іван досить влучно підсумував спільні думки: «Що це, блядь, було?»\n\n«Не знаю, але хай що це таке, воно не із Землі», - відповів Сєрґєй. Одне він знав напевне: у лабораторії це треба повторити."
 OMO_aprilfools_warlord.11.a: "«Може, товаришеві Бакхаріну сподобається»."
 
 OMO_aprilfools_warlord.12.t: "Наш останній шанс"
 OMO_aprilfools_warlord.12.desc: "У залі панував майже цілковитий хаос. На одній половині сиділи люди, росіяни, ветерани незліченних конфліктів і поневірянь, досі вкриті шрамами від куль, багнетів, снарядів і всіх інших способів, якими людство завдавало жорстокости власному видові. Побачивши другу половину зборів, вони кричали й вимагали негайно припинити цей фарсовий «совєт», у якому їх змушували брати участь.\n\nЗ іншого боку, сидячи на задах попри чотири копита, розташувалася строката зграя яскравих поні всіх різновидів. Вони теж кричали, хоч і якось менш агресивно, наполягаючи, що шлях уперед полягає в прийнятті допомоги та ідеалів поні, у принесенні «Гармонії» до Росії та поніфікації за їхнім прикладом.\n\nПосеред ревучої юрби сидів утомлений каштановий поні. На мить відчай здолав його, крики й галас відступили на задній план, очі засклилися, а думки повернулися до страшних днів падіння Союзу. Його Союзу. Тоді він згадав, що побачив і відчув, коли набув нової форми. Біль розтанув, наче сніжинки на сонці, а життєва енергія, яка вперше привела його до влади в Москві, повернулася. Тепер він не зазнає невдачі. Зібравши волю, здатну творити дива, він засяяв рогом і магічно посилив голос, звертаючись до зборів.\n\n«Товариші! Час суперечок і сварок давно минув. Ми втратили на них право, коли впали перші бомби, коли німецька сталь і жадоба крови розтрощили все, що ми так тяжко будували. Тепер ми маємо ще один шанс, можливо, останній. Наче дивом нам даровано сили, майже казкові, й скористатися ними можна, якщо ми матимемо волю до єдности, мрію про дружбу! Вірте чи ні, друзі, та це правда: Дружба - це Магія! Саме ця магія нарешті врятує Росію, а можливо, й увесь світ!»\n\nЗала стихла. Тоді люди одна за одною підвелися й віддали честь. Не мало значення, як його звали, Бухарін, Бакхарін чи ніяк, він був їхнім провідником, і диво повернуло його до них."
 OMO_aprilfools_warlord.12.a: "Лишається тільки повірити."
 
 OMO_aprilfools_warlord.13.t: "Нова форма"
 OMO_aprilfools_warlord.13.desc: "Магія сяяла, наче ніщо в цьому світі, мерехтіла й блищала, мов жива. Бірюзові промені танцювали на обличчі Ґріґорія, який вдивлявся в кристал. Поруч стояв поні, колись такий самий чоловік, як він. Ґріґорій не міг позбутися думки, що зараз зробить найгіршу помилку в житті, переживе жахіття, коли плоть розтане, перебудується й назавжди спотвориться.\n\nПоні засміявся. «Я міг би сказати, що це не болить, що звик до цього майже відразу. Та відверто, хіба це має значення? Чого ти досяг як людина? Комуністичний рух утрачено, Росію втрачено, дім утрачено, останні рештки теж. У нас є шанс, чоловіче. Ми мусимо знову принести жертву, цього разу людську подобу. Але мрія живе: світ миру й гармонії, де всі істоти працюють заради спільної мети поступу, вільні від смертельної хватки жадоби. Ця магія дає нам силу востаннє вступити в бій, можливо, в новому тілі, але з міццю, швидкістю й дарами, яких ти не мав як людина. Що скажеш?»\n\nҐріґорій тримав кристал, відчуваючи прохолодну гладку твердість шкарубкими мозолями долоні. Він бився без кінця, від Польщі до України, до Москви, завжди відступав, відступав у найдальші досяжні закутки. Роки обстрілів і недоїдання забрали рештки сили з людського тіла, і тепер згорбленою оболонкою він сидів у совєті Бакхаріна як представник того мізеру, що лишився від старої Росії. У глибокій фіолетовій поверхні кристалу на нього, наче насміхаючись, дивилося відбиття виснаженого чоловіка.\n\nВін вирішив. Відбиття зникло, коли блискучі жили енергії вирвалися з кристалу, спершу в серце, а тоді розійшлися всім тілом. За мить усе скінчилося.\n\nМагія ринула до нового рогу, а в ногах заграла нова сила. До цього доведеться трохи звикнути. Але майбутнє вже здавалося світлішим."
 OMO_aprilfools_warlord.13.a: "По всій Росії знову лунає пісня відродження."
 
 OMO_aprilfools_warlord.14.t: "Суперечка"
 OMO_aprilfools_warlord.14.desc: "«Ти здурів? Хочеш, щоб я зрікся людської подоби, останньої довбаної речі, що лишилася мені на цій землі після того, як німці забрали все інше?»\n\n«Ніхто не просить тебе від чогось відмовлятися, натомість прийми майбутнє! Товаришу, ця магія нарешті поверне Росію... ні, увесь рух!»\n\nПеред великим фіолетовим кристалом голосно сперечалися поні й людина. Повз них пройшла стара жінка, байдуже відзначивши безглуздість сцени. Світло кристалу, здавалося, ставало то яскравішим, то тьмянішим із кожним підвищенням голосу й палким доказом. Можливо, сперечалися вони про нісенітницю, та людська природа, здається, ніколи не змінювалася, навіть якщо змінювалася подоба. Вона залишила їх позаду, а голоси лунали дедалі тихіше.\n\n«Ви нічим не кращі за білих, за німців! Реакціонери, що чіпляються за минуле коштом...»\n\n«Чіпляються за минуле? Так ти називаєш небажання перетворитися на коня?»\n\nЯкийсь час вони просто дивилися одне на одного, виснажені криками. Більше нічого не можна було сказати, жодні слова не могли подолати прірву. Навіть якби вони не обговорювали магічне перетворення на маленького барвистого поні, усе закінчилося б так само, рано чи пізно."
 OMO_aprilfools_warlord.14.a: "Як далеко може йти людина, перш ніж муситиме зупинитися?"
 
 OMO_aprilfools_warlord.15.t: "Усе той самий"
 OMO_aprilfools_warlord.15.desc: "«Ну як тобі? Тепер кобилки мої, еге ж?»\n\n«Якимось дивом, навіть перетворившись на коня... там унизу ти лишився вельми «людяним», бідолашний засранцю».\n\nЄдиноріг і чоловік засміялися за чаркою після робочого дня. Колись Сєрґєй утратив праву руку через поспішну ампутацію після поранення уламком. Та коли він прийняв «Пропозицію Бакхаріна», як її тепер називали, усі його кінцівки знову стали дієздатними, хоч тепер ними доводилося користуватися трохи інакше.\n\nНіколай ходив із ціпком і не чув на ліве вухо, але знав, що хоче померти з обличчям, яке востаннє бачила його мати. Хоч йому й було кумедно дивитися, як старий друг магією жонглює пляшками в повітрі, такі дива назавжди лишаться йому недоступними. Та, звісно, поні вони чи ні, після довгого дня завжди можна було перехилити по чарці-другій і згадати далекі часи, коли вони ще були молоді й буйні, а світ міг запропонувати так багато.\n\nСєрґєй повернув тіло й життєву силу, хоча розум лишився старим. Його воля була така міцна, що серед юних ідеалістів, які масово записувалися прийняти «Пропозицію», він не здавався чужим. Тож, звісно, він спробував переконати друга ще раз. І, звісно, Ніколай знав, що це не для нього.\n\nТож вони заговорили про інше й далі сміялися."
 OMO_aprilfools_warlord.15.a: "Може, це й не левітація, але дружба таки магія."
 
 OMO_aprilfools_warlord.16.t: "Визначення Гармонії"
 OMO_aprilfools_warlord.16.desc: "«Отже, основа робітничого волевиявлення - вільні «Гармонійні» совєти, які обирають представників, а ті сходяться в дусі братерства й дружби, щоб здійснювати найвищу законодавчу владу?»\n\n«Що за нісенітниця! Без авангарду дружби, вищого за всіх інших, неможливо ґарантувати безпеку та єдність мети нової держави!»\n\n«Авангард дружби! Тож м'ясники й тирани тепер називатимуть себе нашими найкращими друзями, перш ніж зробити смертельний постріл!» Поки дим нескінченних цигарок клубочився над головою й затуляв і без того тьмяну лампочку, Бакхарін стомлено думав, що деяким людям ніколи не набридає без кінця розмірковувати, як до останньої дрібниці має бути влаштоване суспільство, перш ніж вони бодай відірвуть зади від стільців.\n\n«Панове... і поні... ми не бачимо суті. Гармонія стосується не того, як упорядковане суспільство, а того, навіщо його впорядковано. Замість експлуатувати інших істот ми працюємо з ними, знаючи й довіряючи, що вони так само працюють із нами».\n\nКілька голів різної форми спантеличено перезирнулися. «Але хіба це не кінцева мета самого комунізму? Що «Гармонія» додає до цього рівняння?»\n\nЯкусь мить Бакхарін не мав відповіді. Питання було слушне. Тоді він почав.\n\n«Від самого початку нашими засобом, методом і метою має бути дружба. Звертаючись до громадськости, ми прагнемо щиро подружитися з кожним особисто й лише тоді, з товариською смиренністю, питаємо, чи хоче він допомогти нам створити це нове суспільство. Забудьте про робітничі совєти, авангардну партію й усе інше. Наші засадничі одиниці - чарки після роботи, святкування уродин, плечі, по яких можна грюкати, заходячись від сміху, і які можна обійняти, коли просто плачеш. Навіть якщо люди не поділяють наших ідеологічних переконань, дружба понад усе. Ось що я маю на увазі. Решта буде потім»."
 OMO_aprilfools_warlord.16.a: "«А тепер ідіть і знайдіть нових друзів. Вільні»."
 
 OMO_aprilfools_warlord.17.t: "Я хочу вірити"
 OMO_aprilfools_warlord.17.desc: "«ВІН ХТО?» - очі Артьома вирячилися від подиву.\n\n«Кінь. Ти не помилився», - Саша виправив себе. «Точніше, поні».\n\n«Я не чув цього імени роками, десятиліттями, а тепер ти кажеш, що він повернувся і що він КІНЬ?»\n\nУ барі Зєї нікого не було, крім Артьома й бармена Саші. Усі інші повернулися на робочі місця відбувати виснажливі зміни через суворі виробничі квоти, запроваджені фашистським урядом. Та не Артьом. Він твердо вирішив задовольнити цікавість.\n\n«І чому ти так дивно вимовляєш: Бу... Бух...»\n\n«БАКхарін», - наголосив Саша, додавши до вимови трохи англійського звучання. «Він сам себе так називає».\n\n«І звідки тобі про це знати?» Артьом перехилив іще одну чарку горілки.\n\n«Підслухав розмову вартових. Знаєш, що все справді серйозно, коли навіть призовники РФП це обговорюють. Вони ще казали, що цей «Бакхарін» планує відбудувати старий Совєтський Союз. Бог знає, чи здатен довбаний кінь зробити щось таке».\n\nПісля Сашиних слів запала глибока тиша, і до темної кімнати долинуло виття сибірських вітрів. Не кажучи більше ні слова, Артьом підвівся й вийшов, лишивши Сашу самого в темряві.\n\nПрийшовши додому, Артьом відчинив двері, привітав дружину й доньку та продовжив: «Збирайте речі. Вирушаємо на світанку»."
 OMO_aprilfools_warlord.17.a: "«Я маю розповісти вам одну історію, але доведеться мені повірити»."
 
 OMO_aprilfools_warlord.18.t: "Ідилія"
 OMO_aprilfools_warlord.18.desc: "Маленькі хлопчик і дівчинка бігали маленьким селом десь у Російській Анархії.\n\nВони й справді дуже давно не були такі жваві.\n\nТа сьогодні настав час енергії та надміру щастя.\n\nЧому, запитаєте ви? Вони не змогли б добре пояснити, якби їх запитали, та все було досить просто:\n\nБо вперше за довгий час їхні батьки були щасливі.\n\nЇхні обличчя більше не витягувалися від смутку, а чола не борознили зморшки тривоги.\n\nВласне, вони були веселіші, ніж діти взагалі могли пам'ятати.\n\nБули й інші причини радіти. Вони знову їли, як годиться нормальним людям; минулої ночі й кілька ночей перед нею ніхто не лягав спати голодним.\n\nХлопчик і дівчинка були надто малі, щоб розуміти, що відбувається. Якби їх запитали про поні, вони розповіли б лише про маленьких коней із книжок. Та вони однаково були щасливі."
 OMO_aprilfools_warlord.18.a: "Тож вони й далі весело стрибали, як і належить дітям."
 
 OMO_aprilfools_warlord.19.t: "Нова армія"
 OMO_aprilfools_warlord.19.desc: "Ніколай Бакхарін страшенно це ненавидів. Ні, справді.\n\nЗа такого розвитку подій конфлікт із рештою світу був неминучим. Чого ще чекати, коли решта світу складалася з трьох чи більше різновидів імперіялістів, якогось майбутнього імператора з найдальшої Океанії, хлопа, який вважав росіян вищою расою, і чоловіка, що поклонявся прагматизмові, наче божеству.\n\nЦе не означало, що Ніколаю таке мало подобатися.\n\nУсі світові проблеми можна було б легко владнати, якби люди хоч раз сіли й поговорили. Для Ніколая це досить добре спрацювало під час відновлення ладу на північному сході. Та, на жаль, іноді люди просто не бажали говорити.\n\nТож, не маючи вибору, Бакхарін підписав декрет і передав його Політбюро на підпис. Там погодилися й повернули його, після чого він наказав поширити декрет.\n\nНаступного дня мешканці Гармонійного Союзу, і люди, і поні, прокинулися й побачили повідомлення про створення Збройних сил Гармонійного Союзу, які в народі називатимуть..."
 OMO_aprilfools_warlord.19.a: "...новою Рожевою Армією."
 
 OMO_aprilfools_warlord.20.t: "Перший вишкіл"
 OMO_aprilfools_warlord.20.desc: "Завершивши звичний обхід двох лав новобранців, що струнко стояли наструнко, інструктор незвично для себе втратив дар мови. Зазвичай він уже виокремлював слабких, нерішучих і всіх, хто здавався невпевненим у своїх діях, давав їм ворога для ненависти та причину знайти мотивацію.\n\nАле як це зробити з балакучими пастельними кіньми? Хтозна, може, якщо кричати надто гучно, вони його затопчуть. Нарешті він припинив мудрувати, заревів на всіх добірними матюками, і разом вони рушили на «майданчик», де мали перевірити свої фізичні здібності. Принаймні тут він був на знайомій території.\n\nПершими були єдинороги. Уже за десять хвилин бігу полем вони хапали ротом повітря, зате майже всі виявилися бездоганними стрільцями. Що важливіше, зброю вони тримали сяйною магією, якою також могли підіймати важке спорядження, перекидати себе через стіну для лазіння й робити безліч інших речей. Поки вишкіл тривав, інструктор занотовував кожну подробицю й подумки складав перелік бойових ролей, які їм пасуватимуть.\n\nДалі були пегаси. Через крила бігати смугою перешкод не мало сенсу, тож він наказав найздібнішому єдинорогові підняти кілька обручів і змушував пегасів виконувати дедалі складніші маневри, доки вони не попадали від виснаження. Живі літаки, ідеальні для десанту, доправлення припасів на фронт і розвідки.\n\nОстанньою вийшла більшість новобранців, які нервово чекали й спостерігали. Земні поні. Жодних відразу помітних особливих здібностей, але складені явно інакше: вони марширували, дерлися, копали й тренувалися без жодної перерви аж до заходу сонця. І досі могли продовжувати.\n\nСидячи в кабінеті й насолоджуючись тихими хвилинами після завершення вишколу, інструктор зрозумів, що йому дали ідеальний матеріял для створення армії."
 OMO_aprilfools_warlord.20.a: "І, бачить Бог, він зробить із нього найкращу кляту армію, яку бачив хоч один зі світів."
 
 OMO_aprilfools_warlord.21.t: "Добровольці-люди"
 OMO_aprilfools_warlord.21.desc: "Арміям зазвичай не властиве охоче прийняття відмінностей і поблажливість до відсталих, і Армія Гармонії, яку збирав уряд Бакхаріна, не була винятком. Спершу нещодавно поніфікований інструктор 5-ї Революційної бригади (змішаної) ледь не здався та не зажадав, щоб його новобранці-люди або прийняли Пропозицію Бакхаріна й стали поні, або вступили до людської бригади й припинили ганьбитися в спробах змагатися з невтомними земними поні, летючими пегасами й магічними єдинорогами.\n\nТа потім він зачекав і подивився. Навіть коли поні сміялися, люди йшли далі. Вони твердо вирішили зберегти подобу й не дозволили їй стримати себе.\n\nПоволі, крок за кроком, люди спершу почали наздоганяти земних поні, а тоді зрівнялися з ними. Коли це не вдавалося, вони однаково бігли, доки не падали, а тоді товариші зупинялися й несли їх до фінішу. Нарешті поні зрозуміли: їхня мета полягала не просто у вступі до армії та формуванні суто військового підрозділу.\n\nВони мали стати підрозділом Гармонії, а хто втілював її ідеали щиріше за цих чоловіків? Тоді поні усвідомили свою дурість, вибачилися й почали змагатися вдвічі завзятіше. Спостерігаючи, як представники двох видів віддаються дружньому змаганню й водночас бережуть одне одному спини, інструктор зрозумів, що йому неймовірно пощастило тренувати справді магічну бригаду."
 OMO_aprilfools_warlord.21.a: "Армія Гармонії набуває форми."
 
 OMO_aprilfools_warlord.22.t: "Усупереч усім поясненням"
 OMO_aprilfools_warlord.22.desc: "Чоловік в окулярах тяжко зітхнув і відірвав погляд від планшета. «Отже, товаришко Ковдро, чи не могли б ви підняти ручку зі столу перед вами?»\n\nПоні на ім'я Ковдра, яка на той час уже майже шість годин підіймала різні речі, теж зітхнула. Попри роздратування, вона підняла ручку.\n\n«Як?!»\n\n«У них навіть пальців немає! Це неможливо!»\n\nКовдра поклала ручку. Один із науковців згорнувся калачиком на підлозі лабораторії й ридав щось про свій «докторат із фізики». І це був не найгірший зрив за останню годину.\n\n«Товаришко Ковдро, як... як ви... як... що?»\n\n«Пробачте, товаришу, я справді не знаю, як це працює. Просто беру речі, не замислюючись, і це відбувається», - відповіла вона фразою, яку завчила ще п'ять годин тому. Пояснення не задовольнило науковців. Один чоловік переламав планшет об коліно й вийшов. Вона зітхнула, коли до кімнати вбігла нова група вчених із питаннями, чому всі так шаленіють. Вона знала, що пробуде тут усю ніч."
 OMO_aprilfools_warlord.22.a: "«Можете знову підняти олівець, але цього разу... подумайте про це?»"
 
 OMO_aprilfools_warlord.23.t: "Нашкребли"
 OMO_aprilfools_warlord.23.desc: "«Це джезайл», - стомлено пробурмотів Артємій, уперше від початку роботи. Даніїл кліпнув, зрозумів, що лише він це почув, і недбало нахилився ближче до товариша.\n\n«Це, е-е... що?» Обох солдатів відрядили збирати зброю, яку люди жертвували армії. Виробляти її в сибірських пустках було важко, тож згрібати докупи вже наявну зброю здавалося непоганою ідеєю, правда ж?\n\nЦя логіка протрималася рівно до миті, коли вони побачили озброєння, зібране селянами. І яке ж то було озброєння. Серед строкатого набору рушниць були вкрай іржавий ППШ, що під час огляду відразу розпався навпіл; обрізана гвинтівка Мосіна, і ствол, і приклад, що не було б так погано, якби майстер не залишив гострий рваний край ствола й скалки на прикладі; кілька давно занедбаних автоматів Фьодорова, певно, ще з громадянської війни 20-х; РПД... ні, перепрошуємо, АК-47, до якого прибили й приварили стільки шматків дерева й металу, що він трохи нагадував РПД; і окраса колекції, довга дерев'яна рушниця в руках Артємія, яку він назвав...\n\n«Джезайл. Афганські племена використовували їх проти британців. Це клятий мушкет», - сухо промовив Артємій, оглядаючи держак мітли, вбраний рушницею. Під уважними поглядами селян Даніїл нервово почухав потилицю, намагаючись знайти щось добре.\n\n«Ну... Він... гм, стріляє?» Питання змусило Артємія перервати огляд. Тоді він узяв набої, порох і кулю, та зарядив зброю. Без попередження прицілився в сусіднє дерево й вистрілив. Пролунав грім, вистріл викинув велику чорну хмару диму, а коли вона розвіялася, стало ясно, що куля влучила просто в ціль. Артємій глибоко вдихнув і повернувся до селян."
 OMO_aprilfools_warlord.23.a: "«Ми все заберемо»."
 
 OMO_aprilfools_warlord.24.t: "Навчальний бій"
 OMO_aprilfools_warlord.24.desc: "«Гаразд, усі слухайте, - прошепотіла в рацію лейтенант Аліна Валукова. - Люди обходять зліва, поні йдуть центром. Вирушайте й захопіть пагорб».\n\nКурсант Ґєнріх кивнув на знак згоди, як і істоти довкола, люди та поні. П'ята Революційна бригада була одним із перших підрозділів Рожевої Армії, що складався з представників обох видів Союзу, тож Ґєнріх уважав їхнім обов'язком довести, що гармонія може перемогти навіть на війні.\n\nВирушивши, Ґєнріх і ще двоє поні, обидва єдинороги, кралися крізь підлісок. Почувши попереду шелест, він підняв копито, наказуючи зупинитися, й обережно звів догори пневматичну рушницю. З кущів вискочив маленький горностай, пискнув на бігу, й група з полегшенням зітхнула.\n\nРаптовий град кульок вибухнув навколо, миттю обірвавши полегшення. Поні ліворуч від Ґєнріха дістала влучання, і він обережно перетягнув її за край невеликого насипу. Висунув голову, щоб визирнути, але мусив пригнутися, ухиляючись від кульки, що летіла просто в обличчя. «Нас відрізали! - крикнув він у мікрофон. - Нам потрібна допомога!»\n\nУ рації затріщав інший голос. «Одну мить».\n\nБурю кульок обірвала серія криків і далеких ударів, а тоді знову запала тиша. По снігу захрустіли кроки, і до канави простягнулася людська рука. Ґєнріх ухопився за неї, підтягнувся й кивнув чоловікові, який йому допоміг."
 OMO_aprilfools_warlord.24.a: "«Добре, а тепер захопімо той пагорб!»"
 
 OMO_aprilfools_warlord.25.t: "Перше випробування"
 OMO_aprilfools_warlord.25.desc: "«Вантажте все, хлопці! І забирайте жінок, якщо якась варта того!»\n\nТак кричав ватажок бандитів, наставивши стару, зношену гвинтівку Мосіна на чоловіка, що зіщулився від страху. Позаду його люди вривалися до кожного будинку й грабували все, що могло мати хоч якусь цінність. Жінки села зібралися в центрі, тулячись одна до одної заради тепла й розради.\n\nТоді з неба впали троє крилатих поні, пегаси, які злетіли від землі, наче кулі, й заметалися довкола бандитів, збиваючи їх із пантелику. З лісу залунали постріли. Розлючений ватажок вистрілив у чоловіка, на якого цілився, та перш ніж куля влучила, вона зависла в повітрі, огорнута сяйною аврою, магією.\n\nЗ гуркотом нескінченних громовиць із дерев вирвалися земні поні й відкрили влучний вогонь по бандитах. Просто за ними бігли люди у формі Гармонійного Союзу, атакуючи виродків багнетами чи допомагаючи селянам утекти. Не минуло й десяти хвилин, як усе скінчилося.\n\nБандити, які не впали на землю й не наклали в штани, кинулися назад до лісу, у поспіху покидавши всю здобич. Селяни були врятовані. Поки вони святкували й обіймали солдатів незалежно від виду, люди та поні з Гармонійної Армії думали про майбутнє. Попереду було ще багато битв, безперечно важчих за цю."
 OMO_aprilfools_warlord.25.a: "Та це була їхня перша перемога."
 
 OMO_aprilfools_warlord.26.t: "Друга сесія Всепонійного Конґресу"
 OMO_aprilfools_warlord.26.desc: "Це не могло відбуватися знову, думала Єлєна Панова. Або вона збожеволіла, або її реакційна мати весь час мала рацію: Пекло справді існувало.\n\n«А, товаришко Панова, як добре знову побачити вас між засіданнями».\n\nЄлєна заплющила очі. У голові промайнули дитячі молитви, коли вона благала Бога, будь-кого, покласти цьому край. Натомість, розплющивши очі, вона побачила істоту на ім'я Бакхарін, яка цокотіла до неї. Її одутле обличчя розтяглося в усмішці. «Сподіваюся, мої теорії та внесок у справу Лєніна вас задовольнили?»\n\nЄлєна вдивлялася в безодню очей істоти. Тижнями вона слухала, як Бакхарін повторював порожні банальності про дружбу. Тижнями дивилася, як ці істоти знаходили матеріяли та зброю, яких не могло існувати. Найгіршими були перетворення. Серйозні, гідні довіри революціонери зустрічалися з Бакхаріним, а виходили на чотирьох ногах із застиглими усмішками на обличчях.\n\n«Незабутньо», - почула вона власну відповідь.\n\nІстота в шкурі Бухаріна засміялася. «Гадаю, для початку цього досить! Тепер, коли ми визначилися з революційною програмою, надзвичайно важливо поширити революцію на всіх людей Батьківщини! Коли ви, я й усі тутешні делегати об'єднаємося як друзі, ми принесемо Гармонію всій Росії».\n\nПевно, їхню розмову слухали, бо Єлєна помітила цокання копит і плескання рук. Бакхарін та його пекельні легіони святкували."
 OMO_aprilfools_warlord.26.a: "Це не може бути правдою. Це не може бути правдою."

 OMO_aprilfools_warlord.27.t: "Прокладаючи курс"
 OMO_aprilfools_warlord.27.desc: "Кімната, де відбувалося засідання, була маленькою, і більшу частину простору займав великий стіл посередині. Навколо нього сиділи Бакхарін, Риков, Поніна, Блюхер і Томскій, розглядаючи докладну мапу Далекого Сходу. Вона була настільки точним зображенням кордонів різних урядів і воєначальників регіону, наскільки це взагалі було можливо за їхніх умов, а це небагато про що говорило.\n\nГоворив Блюхер, і Бакхарін зрозумів, що замислився, дивлячись на десятки міст і містечок на мапі: «...саме тому першочерговим завданням є створення єдиного фронту. Наші людські й понійські резерви надто малі, щоб укомплектувати кілька активних фронтів». Бакхарін та інші міністри кивнули.\n\nПоніна доповнила думку Блюхера: «Флот на Камчатці також ідеальний через давні зв'язки із Совєтським Союзом. Юмашев і його люди, безперечно, трохи розчарувалися в минулому, та ми зможемо нагадати їм про вірність і переконати долучитися до нашої нової справи». Бакхарін не мав заперечень, решта міністрів також схвально кивнули.\n\nБакхарін звернувся до всього столу: «Якщо інших думок немає, пропоную відрядити делегацію на Камчатку й поговорити з Юмашевим про вступ до Гармонійного Союзу. Хто за?» Бакхарін підняв копито й побачив, як одностайно здійнялися ще два копита й дві руки. Схоже, рішення ухвалено."
 OMO_aprilfools_warlord.27.a: "«Гаразд. Тоді вирушаємо на Камчатку»."

 OMO_aprilfools_warlord.28.t: "Кінь заходить на баржу"
 OMO_aprilfools_warlord.28.desc: "Коли Бакхарін увійшов до кабінету Юмашева, очі господаря спалахнули незвичною енергією. «Це справді ти, Ніколаю? Востаннє я бачив тебе в Москві 1945-го. Ніколи не думав, що знову побачу. А тепер ти кінь! Ну, певний різновид коня, гадаю».\n\n«Поні», - виправив Бакхарін.\n\n«Зрозуміло. Твоя слава біжить поперед тебе, - продовжив Юмашев. - Увесь рік я чую неймовірні повідомлення. Магія, поні, гармонія, усе здавалося мені трохи безглуздим. Але ось ти переді мною, Ніколай Бакхарін».\n\n«Я теж радий тебе бачити, Юмашеве. Але треба обговорити важливу справу». Рухом рогу Бакхарін відкрив теку на столі Юмашева. «Чи приймаєш ти мою пропозицію про приєднання?»\n\nЮмашев відсунув теку. «Я прочитав твої плани ще до твого прибуття. Відверто кажучи, я відкинув би таку пропозицію від будь-кого іншого. Вони безнадійно ідеалістичні, ревізіоністські й, чесно кажучи, утопічні».\n\n«Тобто ти відмовляєш?» - запитав Бакхарін.\n\nЮмашев замовк, роздратований. «Ні. Ти мій Головпоні, і навіть тепер це мусить щось означати. З такими щедрими умовами я допоможу тобі в цьому Гармонійному Союзі».\n\nУперше від входу Бакхарін усміхнувся. «Ти про це не пошкодуєш, Юмашеве. Поруч зі мною ти допоможеш Росії значно більше, ніж зміг би тут».\n\n«Сподіваюся, ти маєш рацію. Можливо, це навіть можливо. За два десятиліття я не бачив ані дружби, ані магії, які ти уявляєш. Та нині дивні часи»."
 OMO_aprilfools_warlord.28.a: "«Зрештою, мій Головпоні - поні!»"

 OMO_aprilfools_warlord.29.t: "Пофарбувати флот у рожевий"
 OMO_aprilfools_warlord.29.desc: "Сєрґєй мусив визнати, що залізні громади старого Тихоокеанського флоту мали грізний вигляд, поки він тремтів на ранковому сибірському вітрі. Величезні витвори інженерного мистецтва досі стояли на краю світу, робота верфей, які давно занепали чи потрапили до рук німців. На мить його думки піднеслися до гордого російського флоту, що захищає узбережжя, та короткий порух голови повернув його до дійсности. Держава мала значно нагальніші турботи за флот, а те, що підтримували камчатські товариші, було лишень зграєю піратських суден. Тихо зітхнувши, Сєрґєй почав обмірковувати, як сформулювати прохання продати флот...\n\n«Доброго ранку, товаришу!»\n\nЦокання копит по асфальту сповістило про наближення його кінської напарниці. Блубері, здається? Чи Блу Бері? Він досі не розумів системи понійських імен, особливо тих, хто після перетворення обирав геть інше ім'я замість старого, як робила більшість. «Які ж прекрасні кораблі! Не можу дочекатися, коли ми почнемо над ними працювати!» - захоплено вигукнула вона.\n\n«Е-е... Блу, ми не працюватимемо над ними. Гадаю, їх слід продати, - пробурмотів він, сподіваючись, що вона зрозуміє натяк. - Вартість утримання цих старих посудин порівняно з продажем...»\n\n«Та годі тобі, Сєрґєю!» - продовжила вона, легко штовхнувши його копитом у бік, занадто дружньо на його смак. «Поглянь на них! Хіба не красені? А хіба вони не будуть іще гарнішими, якщо їх відчистити до блиску? І уяви, що ми зможемо з ними робити! Влаштовувати вечірки, проводити ґала-вечори, трощити фашистів!»\n\nЇї захоплення, хоч яким надокучливим воно було, змусило його зупинитися й подумати. За такої хиткости Союзу, можливо, навіть застарілий флот таки був ліпшим за жоден..."
 OMO_aprilfools_warlord.29.a: "«...знаєш, Блу? Твоя правда»."
 OMO_aprilfools_warlord.29.a.tt: "Камчатський флот буде §Yвідновлено й повернено до служби§!."
 OMO_aprilfools_warlord.29.b: "«Я не змінив думки. Беремо гроші, не флот»."

 OMO_aprilfools_warlord.30.t: "Слово Головпоні"
 OMO_aprilfools_warlord.30.desc: "Помічник незграбно опустив мікрофон на кілька градусів, поки Бакхарін готувався: старий Головпоні був трохи нижчим за людину, яка його представляла. У повітрі кімнати, де перебували він і радіодиктор, дивно змішалися пошана й незручність, а чоловік постійно кидав погляди на єдинорога. Бакхарін давно звик до розглядання.\n\nВедучий помахав рукою, привертаючи його увагу, і Бакхарін випростався, глибоко вдихнув та ковтнув води. Коли він востаннє звертався до народу? Коли оголосив про поразку Совєтів? Чи дійшло це звернення до всієї країни, а може, останнім було оголошення про відступ із Москви? Чи...\n\n«...наживо із Сибіру, маю найвищу честь представити вашого старого Голову, який повернувся до нас, Ніколая Бакхаріна!» - владно промовив диктор, вирвавши Бакхаріна із задуми.\n\n«Добрий вечір усім вам, колишні громадяни Совєтського Союзу. Тих, хто пам'ятає мій голос, я вітаю, а тих, хто ніколи його не чув, запрошую. Найвища честь мого життя - знову отримати змогу звернутися до людей усієї держави. Наше мовлення лунає від Маґадана до Москви, нехай же його почує весь наш народ, хоч би де він був».\n\n«Двадцять років тому на нашу державу впала найбільша ганьба. Танки й чоботи нацистської загрози прокотилися по наших гордих арміях, і ми не змогли їх зупинити. Відтоді землі старого Союзу придушені фашизмом, охоплені конфліктами, перебувають в анархії. Моя найбільша ганьба, що таку катастрофу було допущено. Я не сподіваюся на прощення. Натомість обіцяю відродження!»\n\n«Ми принесемо Росії нову добу співпраці! Повернемо нашій великій державі славу! Звільнимо народ силою дружби й гармонії! Слава Совєтському Союзу, товариші, він постає знову!»"
 OMO_aprilfools_warlord.30.a: "Гадаю, усе минуло добре."

 OMO_aprilfools_warlord.31.t: "Це не світлячок"
 OMO_aprilfools_warlord.31.desc: "Коли він уперше її спіймав, вона була милою, присягався Міхаїл.\n\nПісля кількох тижнів хмар і дощів настав погожий сонячний день, який виманив хлопчика надвір. На сільському полі він натрапив на якусь мультяшну синю комаху, що мирно дрімала на стеблі пшениці. Тихенько писнувши від захвату, він схопив її долонями й помчав додому, де замкнув у банці з-під варення, значно старшій за нього. Цілу годину він дивився, як вона пурхає всередині, час від часу кидаючи зернятка, які вона пожирала швидше, ніж він устигав кліпнути. Нову улюбленицю він назвав Любов'ю.\n\nА тоді, повернувшись із новою порцією зерна, він побачив уже дві Любові.\n\nЦе змусило його завмерти. Звідки взялася друга? Керуючись первісною обережністю, він обережно відкрутив кришку, щоб укинути ще зерна. Воно миттю зникло, наче його вирвали з руки, а тоді дві комахи кашлянули, і їх стало чотири. У паніці він знову закрутив банку й кинувся до вікна, підняв її над головою, але виявив, що Любовей у банці вже немає. Власне, і банки в руках більше не було. Спантеличено підвівши погляд, він побачив вісім комах-потвор, що літали над головою. Вони зависли в повітрі, наче підвішені прикраси, а тоді рвонули до вікна, прогризли його швидше, ніж він міг повірити, і вилетіли назовні. Коли вони полетіли до полів, Міхаїл помітив дещо, від чого його занудило.\n\nВони всі знову подвоїлися."
 OMO_aprilfools_warlord.31.a: "Ой-йой."

 OMO_aprilfools_warlord.32.t: "А тепер погляньте на це"
 OMO_aprilfools_warlord.32.desc: "Чобіт Валєрія важко ступав зораною землею. Частково через обережність, щоб не наступити на те, на що він волів би не наступати. Переважно через п'ятдесятифунтовий вогнемет, який упивався в плечі. Пристрій на спині, безперечно, був старшим за нього та його товаришів, реліквія часів, коли японці загрожували таким глухим закуткам, а совєтських арсеналів було вдосталь. Сам факт, що до нього знайшлося пальне, був дивом. Та важкий виродок знову й знову виявлявся грубим, але дієвим засобом винищення гнізд цієї фантастичної сарани, хоча називати такі рішення грубими означало б удавати, що існували хоч трохи цивілізованіші.\n\nУтім, він сподівався, що попередня група, особливо поні, вигнала комах до прибуття його підрозділу. Йому не надто хотілося спалювати домівки купки збіднілих селян. Хоч домівок майже й не лишилося.\n\nПравду кажучи, крім кількох халуп і розритих клаптів землі майже ніщо не свідчило, що тут колись було село. Кілька поні бігали колишньою головною вулицею, оглядаючи збитки й записуючи втрати, які мала відшкодувати держава. Двоє контужених селян блукали руїнами, перебираючи землю в пошуках хоч якихось речей. Найближче до нього стояла мати й люто сварила заплакану дитину.\n\n«Твій батько соромився б тебе, якби був тут, Міхаїле! Усі посіви зникли, дім зник, село в руїнах!»\n\n«Мамо, пробач! Я не знав! Я думав, це...»\n\n«Тобі дуже пощастило, що товариш Бакхарін такий щедрий, бо інакше я залишила б тебе в лісі на поталу вовкам! Щоб більше ніколи такого не робив!»\n\n«Валєрію!»\n\nГолос однієї з його кінських товаришок відірвав його від підслуховування. Обернувшись у вказаному нею напрямку, він побачив гайок, довкола якого ліниво кружляли ледь помітні барвисті цятки. Клацання вогнемета заглушило його тихе зітхання."
 OMO_aprilfools_warlord.32.a: "Просто чергова проблема."

 OMO_aprilfools_warlord.33.t: "Випробування"
 OMO_aprilfools_warlord.33.desc: "От і настав час уперше запустити портал. Підлеглий Алєксєя Пєтровіча, Фьодор Романовіч, кивнув, і нечесана грива впала йому на обличчя. «Так, ми саме завершуємо останні обчислення. Перший запуск можна почати будь-якої миті».\n\nАлєксєй усміхнувся. «Не бачу ліпшої миті, правда?» Він кивнув підлеглому. «Починаймо».\n\nКімнату миттю залило сліпучим спалахом, коли закручений фіолетовий портал ожив, але так само швидко її поглинула темрява. Кімната по той бік порталу була темна, єдиним джерелом світла слугувало жалюгідне вогнище. Майже порожня, лише один поні стояв струнко, вдивляючись у темний краєвид за вікном. Вона була фіолетовою, з темною гривою й червоним пасмом, та носила те, що Алєксєй міг би присягнутися, було російськими імператорськими реґаліями.\n\nПочувши, як відкрився портал, вона повільно повернулася. «А, - прошепотіла вона хрипким від тривалого мовчання голосом. - Не знала, що сьогодні матиму гостей. Цікаво, хто це. Може, посланці Селестії та Луни, які скажуть, що вони скоро повернуться? Чи, може...» Вона різко обернулася, в очах спалахнуло безумство. «Нові друзі?»\n\nАлєксєй мимоволі ковтнув. «Закрийте портал».\n\nПоні по той бік почала сяяти й повільно рушила до науковців. «Зрештою, годинник цокає. Селестія й Луна повернуться, коли всі знову стануть друзями, зокрема й усі ви!»\n\n«Закрийте його!» - закричав Алєксєй, гупнувши копитом по аварійному вимикачу. Портал зник так само швидко, як виник, і в кімнаті запала приголомшена тиша. Він розтулив рота й озвучив думку, яка крутилася в голові кожного поні."
 OMO_aprilfools_warlord.33.a: "«Що це, в біса, було?»"
 OMO_aprilfools_warlord.33.a.tt: "§CЗіграйте в першоквітневий кросовер TNO від Equestria at War у їхньому моді!§!"

 OMO_aprilfools_warlord.34.t: "Спостереження за іншим світом"
 OMO_aprilfools_warlord.34.desc: "Він уже багато разів уявляв цю сцену. Мирне місто по той бік, забарвлене кристалом у рожевий колір. Судячи з усього, там була жвава ніч, поні розмовляли, сміялися й підстрибували під зоряним небом. Ніхто не помічав його присутности, а він бачив усе.\n\nТепер це був його народ, подумав він. Не той, яким він правив, але споріднений подобою й кров'ю. Еквестрія, так він читав на вивісках. Доречна назва для землі без людей, але з поні. Звідси, із Сибіру, вона здавалася сучасним Едемським садом, де не існувало потреби й нужди, а всі обмінювалися люб'язностями.\n\nІ, як Едемський сад, вона була закрита для нього та його народу.\n\nПотрібно створити портал, але як? Певно, це якось пов'язано з кристалами. Може, розщеплення? Чи щось із цією невловною магією, що пронизувала його світ. Він знав лише, що це мало колись статися, що це було можливим. Як іще перші кристали потрапили на Землю? Якщо природа могла, то людина й поні теж зможуть.\n\nВін повернувся до науковців, найкращих у всій Сибіру. Строкате товариство, хтось людина, хтось поні, але всі нетерпляче чекали його слів. «Товариші, - почав він. - Ми стоїмо на порозі великого прориву в нашій історії. Силою ваших умів ми створимо сполучення з Еквестрією, установимо гармонію й нерозривно зв'яжемо два світи. Усвідомте масштаб своїх дій і знайте: своєю працею ви принесете безпосередню користь усьому нашому народові, Сибіру, Росії, світові. Я знаю, ви зможете»."
 OMO_aprilfools_warlord.34.a: "«До роботи»."

 OMO_aprilfools_warlord.35.t: "Протоколи першого контакту"
 OMO_aprilfools_warlord.35.desc: "«...тож повторімо все ще раз, Кірілле».\n\n«Не знаю, як тобі сказати, Кренбері, але все це вище мого розуміння. Чому б не послати провідником поні? Тебе, наприклад?»\n\n«Поні їх не здивує. А людини вони ніколи не бачили. Ти відразу привернеш увагу».\n\n«...Господи, яка ж це відповідальність».\n\n«Саме тому ти мусиш працювати особливо старанно. Повторімо все. Ти з'явишся на міській вулиці й неодмінно спричиниш переполох, тому перше враження має бути бездоганним. Ти прибудеш, станеш, випростаєшся й скажеш: «Слава підкові й серпу! Я Кірілл Борісовіч Борісюк із Гармонійного Союзу, прибув за наказом Ніколая Івановіча Бакхаріна. Я прийшов з іншого світу. Ми чули про вашу могутність як авангарду соціялізму в цьому світі. Від товариша товаришеві, вітаю вас! Проведіть мене до найближчого представника влади!»\n\n«Загалом годиться, але остання частина змушує мене звучати як прибулець».\n\n«Ти і є прибулець».\n\n«Гаразд, так, розумію. Із цим усе добре. Але далі ти кажеш, що, зустрівши цього... представника влади, я маю... підняти до нього копито під кутом, а тоді виструнчитися й віддати честь?»\n\n«Сформульовано не зовсім точно, але так, за нашими спостереженнями, це їхній звичай».\n\n«Та я виглядатиму, наче зіґую!»\n\n«Не сумніваюся, що наші звичаї здадуться їм так само дивними. То ти й далі глузуватимеш із традицій наших побратимів-комуністів чи почнеш співпрацювати?»\n\n«...гаразд».\n\n«Добре. Тепер перейдімо до застільного етикету»."
 OMO_aprilfools_warlord.35.a: "«Ісусе Христе, це що, сіно?»"

 OMO_aprilfools_warlord.36.t: "Нові копита в новому світі"
 OMO_aprilfools_warlord.36.desc: "Щойно Ґєнріх пройшов крізь портал, від писка до кінчика хвоста його пронизало відчуття. Не зовсім смак, не зовсім запах, не зовсім звук, радше поєднання всіх трьох. Розум наче затуманило, наче зв'язок між ним і рештою тіла перервався. Та хоч яким незвичним було це відчуття, Ґєнріхові воно здавалося дивно знайомим. Воно нагадувало його перетво...\n\nНе встиг він завершити думку, як опинився по той бік. Поміж високих дерев Ґєнріх побачив решту загону. Його сестра Маша жувала іриску й спокійно дивилася на дерева. Даніїл і Валєнтін налаштовували рацію, намагаючись зв'язатися з кимось зі Сталінґрада. А лейтенант Валукова ходила лісом туди-сюди й гризла нігті, за нею тінню ходив дипломат Кірілл. Ніхто не почувався затишно в новому світі. Усі наче боялися, що дерева почнуть ходити або небо проллє вогняний дощ. Тож Бригада чекала в тривожній тиші, поки Валєнтін знайде сигнал.\n\nПара й далі вовтузилася з рацією, коли з неї раптом пролунав голос. Крізь перешкоди можна було розібрати кілька слів. Засідка. Річка. Грифони. Почувши останнє, Ґєнріх нашорошився. З інструктажу перед завданням він знав, що грифони - жадібні гібриди орлів і левів, непримиренні вороги Гармонії та Комунізму. Раптом приблизно за три милі на північний захід загриміли постріли. Почувши їх, лейтенант Валукова наказала Бригаді виступати просто назустріч стрілянині на порятунок сталінґрадських солдатів, атакованих грифонами."
 OMO_aprilfools_warlord.36.a: "Вороги, тремтіть, Рожева Ґвардія вже тут."

 OMO_aprilfools_warlord.37.t: "Свіжа кров на чужій землі"
 OMO_aprilfools_warlord.37.desc: "Ґєнріх натиснув на спуск. Із дула вилетіла фіолетова блискавка, із рушниці вискочила гільза кристального набою, і наступний грифон упав, усе за одну секунду. Ґєнріх змінив позицію за укриттям і прицілився в іншого грифона. Спуск. Фіолетовий спалах. Цього разу закляття з рушниці пролетіло за дюйм від цілі. Закляття Маші не схибило, і грифон упав із криком.\n\nҐєнріх озирнувся в пошуках ворога, та в межах досяжности нікого не було. Кілька грифонів, що лишилися, здійнялися на крила й утекли, петляючи між соснами, щоб уникнути магічного вогню. Лейтенант Валукова наказала припинити вогонь, і Ґєнріх притулив обважніле тіло до дерева, сповзаючи, доки круп не торкнувся лісової землі. Лише тоді він помітив, що поранений, куля грифона влучила в ліве плече. Шукаючи хоч чогось, що відверне увагу від болю, Ґєнріх зосередився на цокоті копит довкола.\n\nОдна пара копит наближалася, і Ґєнріх відчув, що хтось стоїть поруч. Розплющивши очі, він побачив незнайому кобилку з татуюванням сурми на крупі. Вона на мить замовкла, а тоді сказала: «Не знаю, хто ви, незнайомцю, але ви з друзями допомогли нам саме тоді, коли це було найбільше потрібно. Дякую».\n\nКобилка простягнула Ґєнріхові копито, і за мить він потиснув його правим копитом. Дивлячись їй в очі й кривлячись від болю, Ґєнріх відповів..."
 OMO_aprilfools_warlord.37.a: "«Друзі завжди допомагають іншим»."

 OMO_aprilfools_warlord.38.t: "Нові друзі в новому світі"
 OMO_aprilfools_warlord.38.desc: "«Це не татуювання, а мітка таланту. Кожен поні отримує її в дитинстві, вона показує всім твою особистість».\n\n«То чому в тебе мітка сурми, якщо ти не граєш на сурмі?» - запитав Ґєнріх свою нову подругу.\n\n«Мабуть, тому що я дуже голосно говорю, коли хвилююся».\n\n«Тобто розмова зі мною тебе не хвилює?» - дражливо запитав Ґєнріх.\n\nКобилка всміхнулася, та перш ніж устигла відповісти, переповнена військова вантажівка зупинилася. Побачивши, як інші сталінґрадські солдати виходять із кузова, Ґєнріх пішов за ними й озирнувся. Вантажівки привезли їх на засніжене поле, оточене високими будівлями, що нагадували Ґєнріхові Іркутськ. Праворуч стояла особливо висока споруда, увінчана велетенською статуєю поні.\n\nКобилка підкралася збоку й крикнула Ґєнріхові у вухо: «Це Палац Совєтів». Відповівши на її попередню усмішку, Ґєнріх почав шукати поглядом товаришів. Маша ділилася ірисками з двома сталінґрадськими поні. Валєнтіна, який, певно, ніколи раніше не бачив поні, обліпили місцеві. А лейтенант Валукова розмовляла з темною поні з білявою гривою й парою кажанячих крил. Здивований побаченим, Ґєнріх подумав, що має ще багато дізнатися про Сталінґрад і цей новий світ. Та було приємно бачити, що узи товариства й дружби вже зароджуються."
 OMO_aprilfools_warlord.38.a: "Дружба - це Магія."

 OMO_aprilfools_warlord.39.t: "Скріпімо це копитостисканням"
 OMO_aprilfools_warlord.39.desc: "«Що ж, сьогодні ми точно добре попрацювали. Чи не так, товаришу Бакхарін?» - запитав Генеральний секретар Сталінґрада Васілій.\n\n«Справді», - відповів Бакхарін, просто кивнувши. У кімнаті запала мирна тиша, поки вони розглядали успішно укладений договір між двома державами.\n\n«Товаришу Бакхарін, мушу запитати: ви справді вважаєте, що ваш світ готовий до вашого послання, вашої революції? З вашого опису це надзвичайно жорстокий світ».\n\n«Не думаю, що буде легко, але Земля готова більше, ніж ви гадаєте. Зрештою, держави й народи не одне й те саме, - відповів Бакхарін. - А як ваш світ? Із ваших слів виходить, що не все так утопічно, як здавалося в моїх видіннях».\n\nВасілій знизав плечима. «Усе складніше, ніж ви спочатку думали, та поні Сталінґрада сильні й віддані справі. Ми не дозволимо силам реакції здолати нас, не хвилюйтеся».\n\n«Що ж, якщо це все, що ми мали обговорити, гадаю, настав час скріпити союз копитостисканням».\n\n«Цілковито згоден, товаришу»."
 OMO_aprilfools_warlord.39.a: "«Об'єднавши сили, ми станемо нездоланними!»"
 
 ## Regional
 
 OMO_aprilfools_regional.1.t: "Гімн"
 OMO_aprilfools_regional.1.desc: "Головний флорист зателефонував Бакхаріну о 10:00; пекарі - об 11:30. До Іркутська вже підтюпцем прибували телевізійні групи. З ліхтарних стовпів звисали довгі стрічки й гірлянди. Усе було готове до дня всенародного святкування, яке Бакхарін наказав провести на честь умиротворення Далекого Сходу й возз'єднання Совєтського Союзу під новим рожевим стягом.\n\nЯкась частина революційного вождя розуміла, що не варто було так глибоко занурюватися в організацію свята. Зрештою, він мав штат, цілу бюрократію для проведення заходів. І все ж видовище притягувало його з надприродною силою. Від часу перетворення він став одержимий вечірками. Він просто обожнював усе таке м'якеньке, гарнесеньке, манюсіньке-.\n\n"Ніколаю". Голос вирвав його з гарячкових думок. Він стримав рум'янець, коли в полі зору підтюпцем з'явився Риков. "Я приніс оцінку безпеки Великого Галопуючого Гала російської єдности. Надходить дедалі більше повідомлень про ворожість людей до понячого керівництва, а через те, що до міста прибуває стільки народу, є побоювання, що..."\n\nБакхарін хотів поставитися до цього попередження серйозно. Коли він був людиною, то, можливо, обмежив би святкування й зосередився на безпеці та управлінні. Але той чоловік помер. Тепер його мучив невситимий голод до повітряних кульок і святкових серпантинів.\n\n"Нехай Рожева гвардія проведе додаткову перевірку безпеки прибулих із Харбіна й пильно стежить за всіма, хто не брав участи в Першому Всепонійному Конґресі. Ми надто тяжко працювали, щоб тепер не повеселитися.""
 OMO_aprilfools_regional.1.a: ""Як скажете, Головпоні.""
 
 OMO_aprilfools_regional.2.t: "Там, де я хочу бути"
 OMO_aprilfools_regional.2.desc: "Велике Галопуюче Гала минало добре, аж напрочуд добре, думав Риков. До Іркутська невпинно прибували щасливі поні й спантеличені люди. Члени партії сміялися й раптом заводили пісні в губернаторському палаці. Жодних слідів антигармонійних екстремістів. У бальній залі все було спокійно.\n\nРиков полегшено видихнув. Можна було розслабитися. Він озирнув залу в пошуках нового друга. Лише одна людина ні з ким не розмовляла: темноволоса жінка з розкуйовдженим волоссям. Стискаючи в руках сумочку, вона когось шукала.\n\n"А, подруго", - сказав Риков, підбігаючи підтюпцем. Він не пам'ятав її імени, але обличчя здавалося знайомим. "Сподіваюся, на нашому святі дружби народів у вас усе гаразд? Я товариш Риков."\n\nВона здригнулася й міцніше вхопилася за сумочку. "Ні. Риков був героєм Совєтського Союзу. Людиною". Її обличчям покотилися сльози.\n\n"Ой лишенько. Так, я змінився, але я досі Риков. Просто тепер я прагну розбудувати дружній уряд, який вирішує суперечки спільною працею, видає державні кексики й-."\n\n"Ви себе чуєте? Тобто-. Боже, невже лише я розумію, наскільки це все безглуздо? Всі ці балачки про дружбу. Всі ці банальності". Вона розстебнула сумочку. Слова вихоплювалися з її рота одне за одним. "Я прийшла сюди по шкурохода. Прийшла покласти край цьому фарсові, але клянуся могилою матері: якщо ви скажете ще хоч слово про дружбу... Ще хоч один афоризм..."\n\nРиков на мить замислився. Він подивився на неї величезними очима. "Іноді сумувати - цілком нормально.""
 OMO_aprilfools_regional.2.a: "Єлєна Панова вихопила з сумочки пістолет і впритул вистрілила в Алєксєя Рикова."
 
 OMO_aprilfools_regional.3.t: "Ти і я"
 OMO_aprilfools_regional.3.desc: "Вона чула крики. Чула тупіт панічної юрби. Відчувала, як її тіло несе з бальної зали, з губернаторського палацу, на вулиці Іркутська. Єлєна Панова бігла й вила, пролітаючи повз пошматовані знамена й напівздуті кульки.\n\n"Геть поні! Геть поні!" - верещала вона навіженим голосом, несучись крізь натовпи. "Геть чудовиськ! Геть уряд тварюк!" Табун лошат розбігся з дороги, коли вона промчала вулицею. "Свобода! Ми будемо вільні!"\n\nЦе не припинялося. Її скандування. Її хрипке дихання. Щомиті вона помічала дедалі більше тіней угорі й позаду. Поняча поліція, свистячи у свистки, стягувалася навколо неї, але вона вперто продовжувала скандувати. "Свобода! Коні нами не керуватимуть! Свобода!"\n\nЯке значення мало те, що Єлєна не змогла вбити творця свого пекла, Бакхаріна? Напад на Рикова довів, що пастельних потвор можна перемогти. Вона довела, що закони цього світу досі поширюються й на них, а їхня так звана Гармонія не є неминучою. Вона не сумнівалася, що її вчинок надихне росіян, яким остогидли музичні номери й пискливе хихотіння. Якщо пощастить, народ прокинеться. Він повстане проти чотириногих гнобителів, як колись повстав проти царів.\n\nВона опинилася в пастці в кінці провулка, а вони вже були просто за спиною. Поліція. Гнобителі. Поні. Дико всміхаючись, вона наставила пістолет на себе. "Ви нами не керуватимете! Ми будемо-."\n\nЗвідкись із височини прилетіла самотня підкова й бенькнула Єлєну по голові. Вона мить похиталася, випустила пістолет і впала."
 OMO_aprilfools_regional.3.a: "Ой-йой."
 OMO_aprilfools_regional.3.a.tt: "§RКриза розгортається...§!"
 
 OMO_aprilfools_regional.4.t: "Сварка"
 OMO_aprilfools_regional.4.desc: ""Велике Галопуюче Гала стало катастрофою! Не можу повірити-."\n\n"-одна з перших членів партії! І людина! Бідний Риков. Бідний, любий Риков, який-."\n\n"Бакхарін її знав! Він привів її на переговори. Матінко, невже такого керівництва ми хочемо?"\n\nІ так без кінця. Совєт, зазвичай осередок гармонії, розколовся на ворогуючі фракції. Посеред цього безладу виснажений Бакхарін стояв за трибуною й намагався навести лад.\n\n"Товариші! Товариші!" - вигукнув Бакхарін. "Не можна опускатися до дріб'язкових сварок! Ми можемо шанобливо не погоджуватися, але ці особисті напади на наших друзів грають просто на руку-."\n\n"Правильно ви про руки заговорили! Мене перетворили на поні лише минулого тижня, тож я знаю, що кажу: жодній людині не можна довіряти", - гукнув червоний поні із задніх лав. Він підняв копито. "Жодних прав непоні! Жодного прихистку видовим реакціонерам!"\n\n"У жодному разі!" - приголомшено відказав Бакхарін. "Гармонія має бути для всіх, а не лише для поні! Якщо ми почнемо дискримінувати одну групу, то будемо не кращі за..."\n\nАле він уже бачив, що його аргументи не подіяли. У задній частині зали велика група поні протестно підвелася й рушила до дверей. Вони не сидітимуть склавши копита, поки Бакхарін пускає до них людських антигармонійних екстремістів. Вони не підуть як ягнята на заклання. Зрештою, вони ж поні."
 OMO_aprilfools_regional.4.a: ""О Єлєно... що ти накоїла?""
 OMO_aprilfools_regional.4.a.tt: "Вплив §YБакхаріна§! на §Cрадикальних поні§! у §YВКП(б)§! слабшає."
 
 OMO_aprilfools_regional.5.t: "На розі"
 OMO_aprilfools_regional.5.desc: ""Кілька років тому Бакхарін приніс до Сибіру її найбільший гріх. Він назвав його поніфікацією."\n\nКількома роками раніше Алєксандра Мєня можна було почути на морозній півночі Омолону, де його прекрасні проповіді збирали величезні натовпи. Тепер він був не більш ніж вуличним проповідником. Його нова наука виявилася суперечливою, для більшости надто радикальною, адже отець Мень ненавидів поні й усе, що вони уособлювали.\n\n"Коли Бог створив людину, то створив її за образом Своїм. Наша подоба, наші очі, руки й обличчя були створені довершеними, як дар божественного духу. Погляньте, що поніфікація робить із цими дарами! Вона спотворює й руйнує їх. Наші очі перетворюються на величезні баньки, руки сплющуються в копита без суглобів, навіть обличчя видовжуються у здоровенні писки. Чи міг справедливий Бог вимагати від нас такого? Біблія засуджує чаклунство, а воно тепер повсюди. Ми не можемо його прийняти!"\n\nНавколо дивного чоловіка поволі почав збиратися людський натовп. Дехто його впізнав. Іншим просто було цікаво, про що він так розпинається. Але ніхто не сподівався відчути щиру прихильність до його слів. Так, він був радикальним, надто радикальним. Та в його словах було щось... щось могутнє. Щось, до чого варто дослухатися.\n\n"Усі ви, хто лишився людиною, я люблю кожного з вас. Ваша стійкість перед лицем гріха - це справжня краса. Тримайтеся, брати мої! Дослухайтеся до мого слова!""
 OMO_aprilfools_regional.5.a: ""Ви мусите непохитно протистояти кінському гріхові!""
 
 OMO_aprilfools_regional.6.t: "Параліч у Верховному Совєті"
 OMO_aprilfools_regional.6.desc: "Бакхарін дивився, як Полунична Ніч сходить із трибуни під глузування людської половини зборів. Її промова була палкою й сповненою ненависти, а десь посеред засудження людської агресії вигуки заглушили її голос. Він сподівався, що інші промовці говоритимуть примирливіше.\n\nНаступний промовець вийшов із людського боку, і Бакхарін із тривогою спостерігав, як той рішуче прямує до трибуни. Його промова теж потонула в тупоті копит і іржанні понячої половини. Ставала очевидною паралізованість уряду через самосегрегацію. Жодна сторона не приймала представників іншої й не відряджала своїх до протилежної половини зборів. Найближче до розмови вони підходили, коли перекрикували чужі виступи.\n\nПолунична лишилася біля людського промовця, коли той урвав виступ. Побачивши його погляд, вона вишкірилася й заговорила. "Ми не хочемо слухати порожніх виправдань, Луко. Повзи назад до своїх друзів і плануй, як чинитимеш опір неминучому". Бакхарін побачив, як його губи скривилися в безрадісній усмішці.\n\n"Неминучому?" - перепитав Лука. "Перепрошую, Кіро, але я не зважаю на пророцтва смердючої, паршивої понячої с-."\n\n"Я Полунична!" - заволала вона й замахнулася на нього копитом. Він відскочив, а тоді стиснув кулаки, готуючись відповісти.\n\n"Досить!" - прогримів Бакхарін. Уся зала стихла. "Оголошую перерву на 30 хвилин. Просто зараз. Я розчарований вами всіма, а особливо вами двома". Він по черзі кинув звинувачувальний погляд на Полуничну й Луку. "Щоб я більше ніколи не бачив такого ганебного видовища. Ідіть". Коли вони почовгали до виходу, Бакхарін опустився на своє місце. Як усе дійшло до такого? Уперше відтоді, як він отримав свій дар, він не знав, що робити. Чи могло бодай щось змінити ситуацію?"
 OMO_aprilfools_regional.6.a: "Йому лишалося тільки спробувати."

 OMO_aprilfools_regional.7.t: "Перегони з перешкодами на вулицях"
 OMO_aprilfools_regional.7.desc: "Стояв похмурий ранок, коли поні рушили маршем. Сердите небо гуркотіло далеким громом у такт десяткам тисяч копит, що цокотіли вулицями Іркутська. Поні заполонили місто з плакатами "Поні при владі" й антилюдськими гаслами. О 9:47 гурт хлопчаків кинув у натовп каміння. О 9:49 загорілася перша будівля й почалося справжнє пекло. Орда поні галопом носилася містом, підпалювала коктейлі Жданова, перевертала автівки й била всіх, хто чинив опір.\n\nРожеву гвардію швидко мобілізували для відновлення порядку й миру в місті. 5-та революційна бригада, ветерани портального інциденту, прибула перекрити шлях до великого людського житлового району. Бунтівники швидко це помітили й почали збиратися навколо виснажених військ.\n\n"Зрадники!, - вигукнув один поні. "Вони захищають ворогів Гармонії!|\n\n"Ви стали на бік двоногих проти своїх! Як ви могли нас зрадити!" - заверещав інший. Маса поні росла, аж поки перед солдатами не зібрався цілий рій. Командир підрозділу відступив на кілька кроків, обдумуючи становище. Чи варто було їх зупиняти? Та чи могли вони взагалі це зробити? Коли поні рушили вперед, він мусив вибирати."
 OMO_aprilfools_regional.7.a: "Ще більше насильства не приведе до Гармонії."
 OMO_aprilfools_regional.7.b: ""Розігнати їх в ім'я Гармонії!""

 OMO_aprilfools_regional.8.t: "Як живе інший кінь"
 OMO_aprilfools_regional.8.desc: "Бакхарін підійшов до сцени в супроводі двох охоронців. Уперше натовп по-справжньому його лякав, і це був натовп поні, не менше. Перед ним стояли справжні понячі супремасисти, радикали, які зневажали Бакхаріна та його бачення. Їх треба було заспокоїти, але це явно буде нелегко.\n\nБакхарін спробував угамувати натовп. "Я прийшов поговорити з вами, товариші. Я чув про ваші вимоги. Сподіваюся, сьогодні зможу пояснити вам усю цінність Гармонії."\n\nУ відповідь здійнялося глузування. Дехто обзивав його людолюбом і понячим юдою. Бакхарін стримав гнів, адже ця лють мусила мати причину. Натомість він запитав: "Чого ви хочете від мене, кобили й жеребці? Я прийшов вислухати вас, обіцяю."\n\nПоні загомоніли між собою, а тоді маленька фіолетова кобилка, схоже, місцева ватажка, підтюпцем вийшла перед натовпом. "Нам страшно", - сказала вона, широко розплющивши чарівні перелякані очі. "Люди нас ненавидять. Вони виставляють свою ненависть на вулицях, кричать на нас, смикають за гриви й намагаються нас осідлати. Ваші слова про Гармонію нас не рятують, Бакхаріне. Нам потрібен захист!"\n\nНатовп вибухнув вигуками, радісним галасом і громом копит. Бакхарін на мить замислився над відповіддю. Чи справді він міг пристати до цих радикалів, чи все ж мав триматися поміркованого шляху?"
 OMO_aprilfools_regional.8.a: ""Я розумію ваші побоювання. Я подумаю над додатковим захистом.""
 OMO_aprilfools_regional.8.b: ""Не бійтеся. З часом Гармонія здолає ці незгоди.""

 OMO_aprilfools_regional.9.t: "Про поні та людей"
 OMO_aprilfools_regional.9.desc: "Бакхарін пильно дивився на чоловіка у священничому вбранні, зосередившись на хресті, що висів у нього на шиї. Алєксандр Мєнь був не звичайним священником: його запальні проповіді та промови зробили його неофіційним провідником людства. Бакхарін ніколи не був особливо релігійним і вважав, що релігійна доктрина позбавляє народ сили, але вони з Менем поділяли певні ідеали. Можливо, в ім'я Гармонії їм удасться досягти компромісу?\n\n"Вітаю, проповіднику. Я радий, що ви погодилися на цю зустріч. Божі слуги часто зневажали мене за мої переконання, посилаючись на... сумнівні причини, але я сподіваюся, що ми зможемо дійти гармонійнішого порозуміння. Як Союз може допомогти подолати прірву між нами?"\n\n"Ваша політика загрожує залишити людство позаду", - відповів Мень, наголошуючи на слові людство.\n\n"Це просто неправда, Союз однаково служить і поні, і людям", - із теплою усмішкою відказав Бакхарін, сподіваючись послабити напруження.\n\n"І все ж наші мізерні ресурси витрачаються на те, щоб поні могли жити щасливо. Людина трудиться заради родини та громади, а плоди її праці йдуть на справи, які загрожують її засобам до існування. Де ж тут гармонія?" Бакхарін прикусив язика. Мень був різним, але чи міг такий побожний священник бути брехуном? Чи не завдає нинішня політика більше шкоди, ніж користи? Чи не ставить Союз добробут одних вище за добробут інших? Думки Бакхаріна перервав проникливий погляд Меня, який терпляче чекав відповіді."
 OMO_aprilfools_regional.9.a: ""Ваші звинувачення безпідставні, до всіх ставляться однаково.""
 OMO_aprilfools_regional.9.b: ""Можливо, ми помилково обділили увагою декого з товаришів.""

 OMO_aprilfools_regional.10.t: "Загнуздати штрейкбрехера"
 OMO_aprilfools_regional.10.desc: ""Гей-гей! Го-го! Поні-квоти - це зло!" - ось що найгучніше лунало сонячного ранку біля Іркутського авіазаводу. Тисячі заводських робітників страйкували надворі, скандуючи антипонячі гасла. Нові вимоги зобов'язували підприємства наймати людей і поні відповідно до їхньої частки в суспільстві, тож багато хто ризикував утратити роботу, а інженери не збиралися йти тихо.\n\nЛюсі ще ніколи не бачила стільки людей дорогою до школи: багато хто кричав, і не менше спостерігачів здивовано на них витріщалося. Дівчинка-поні пробиралася краєм натовпу, уникаючи поглядів пікетувальників із плакатами мертвих поні. Вона пришвидшила крок, не зводячи очей із тих, хто міг завдати їй шкоди, й петляла між чоловіками та жінками, аж раптом у щось врізалася й упала просто в натовп. Перед нею стояв великий м'язистий чоловік і дивився з огидою.\n\n"Гляньте сюди! Одна з цих паршивих шкур, що крадуть наші робочі місця, хоче пройти! Ми їй дозволимо?" - загорлав чоловік.\n\n"Що? Будь ласка! Я не хотіла у вас врізатися! Я ходжу до школи он там униз по-." Пояснення Люсі потонуло в морі страйкарів, які її оточили. Вона відчула, як чиясь рука схопила її за копито, а потім іще одна. "Допоможіть! Хто-небудь!"\n\nАртем спостерігав за страйком із сусідньої крамниці. Того дня на уроках було нудно, тож він утік подивитися, як батько протестує проти уряду. Він саме відкусив яблуко, коли почув із натовпу крики про допомогу. Артем побачив, як батько з кількома чоловіками підняли молоду блакитну поні. Невже це Люсі? Вона була єдиною знайомою йому блакитною поні й завжди обмінювалася з ним смаколиками. Артем вагався. Він знав, що родина зненавидить його, якщо він втрутиться, але Люсі була його подругою. Невже завдати їй болю - це і є рішення?"
 OMO_aprilfools_regional.10.a: ""Люсі не винна!""
 OMO_aprilfools_regional.10.b: "І більше її ніхто не бачив."

 OMO_aprilfools_regional.11.t: "Демонстративний вихід"
 OMO_aprilfools_regional.11.desc: "Реформи мали бути переліком змін, продиктованих здоровим глуздом, змін, які міг прийняти кожен у Гармонійному Союзі. Переслідування поні, безперечно, було справжньою проблемою, із цим погодилися б навіть людські радикали, тож треба було щось робити. Люди хотіли спокою та впевнености, хотіли покласти край хаосові довкола поніфікації. Це й було все, що прагнув виправити Головпоні Бакхарін.\n\nАле сприйняли все інакше. Можливо, через звичний ентузіязм Головпоні. Можливо, через рев понячої делегації. Можливо, через неймовірну довжину переліку, де йшлося про все - від гірничої системи до будівельних норм. Хай там як, люди в натовпі не побачили в його реформах "здорового глузду". Для них це була несправедлива політика переваг для поні, ляпас суспільній рівності, на якій ґрунтувалася гармонія.\n\nОголошення зустріли громовими оплесками, принаймні поні. Вони радісно вигукували й тупотіли, як ніколи раніше, бо нарешті їх визнав чоловік, який довго називав їхніх провідників екстремістами. Дехто навіть почав скандувати ім'я Бакхаріна, рятівника всього поніства.\n\nТа попри все Головпоні не міг зосередитися на радості понячої делегації.\n\nВін лише дивився, як люди, киплячи від люті, виходять із будівлі."
 OMO_aprilfools_regional.11.a: "Кожен добрий учинок має свою ціну..."

 OMO_aprilfools_regional.12.t: "Поговорімо про це"
 OMO_aprilfools_regional.12.desc: "Умовити дві фракції сісти й поговорити одна з одною було нелегко, і цього разу Бакхарін побоювався, що зусилля могли того не вартувати.\n\nЗ одного боку невеликої кімнати для нарад сидів Алєксандр Мєнь. Священник відкрито виступав проти уряду Бакхаріна й безперечно очолював дедалі сильніший гуманістичний рух усередині Союзу. З другого боку сидів представник поні. Червоношерстого єдинорога на ім'я Творча Іскра обрали товариші з набагато менш організованої за людську групи, щоб представляти пропонячу фракцію Верховного Совєту.\n\n"Я вже казав: людство не прийме угоди, за якою муситиме грати другу скрипку при балакаючих конях", - зневажливо мовив Мень.\n\n"А я вже казав, що поні до цього байдуже!" Творча Іскра повернув голову до Бакхаріна. "Ви певні, що отець Мень здатен сперечатися добросовісно? Загальновідомо, що священники-."\n\n"Досить!" - заревів Бакхарін. Творча Іскра й отець Мень здивовано сіпнулися на своїх місцях від такого незвичного спалаху. "Мені вже по горло набридли ці безперервні сварки! Товаришу Мень, з усією повагою, ви казали, що хочете дати людству місце в Гармонійному Союзі, і я чув майже те саме від вас, товаришу Іскро. Якби ви обоє перестали перекрикувати одне одного й просто вислухали співрозмовника, то, можливо, знайшли б спільну мову!"\n\nТворча Іскра й отець Мень по-новому поглянули один на одного. Творча Іскра кивнув. "Якщо це справді все, чого хоче людство, то, може, ми зуміємо домовитися.""
 OMO_aprilfools_regional.12.a: "Уперше за довгий час Бакхарін усміхнувся."

 OMO_aprilfools_regional.13.t: "Марна енергія"
 OMO_aprilfools_regional.13.desc: ""Я завжди прагнув лише найкращого для свого народу. Керівні засади гармонійного комунізму забезпечують найкраще життя всім народам, об'єднаним Дружбою. Ал-." Голос Ніколая Бакхаріна в радіоприймачі швидко розчинився, поступившись навалі тріскоту. Десь посеред п'ятої... шостої... хтозна-якої чарки Дзвіночок кілька секунд осмислювала, що сталося, а тоді простягнула копито до ручки приймача й крутила її, доки голос знову не став чітким.\n\n"-занепокоєння щодо розвитку нашого суспільства, і я зрозумів, що ми, на жаль, збилися зі шляху. У дедалі поніфікованішому суспільстві ми втратили з поля зору справжнє значення гармонійного комунізму. І хоч я глибоко співчуваю численним поні поміж нас, ми не можемо нехтувати способом життя наших людських товаришів.. Тому сьогодні я оголошую низку нових заходів, щоб повернути нас на правильний шлях. Відтепер набувають чинности нові обмеження поніфікації, видобутку й виробництва кристалів, кількости поні в таких галузях, як армія..." Голос знову згас. Але не через перешкоди.\n\nЯкий же фарс. Вона підвелася з місця біля радіо й, незграбно стискаючи в одному копиті пляшку горілки, підійшла до вікна свого будинку, щоб дивитися на сніг. Подалі від голосу Бакхаріна, який, без сумніву, далі перераховував приписи, покликані тримати поні саме такими, якими їх хотіли бачити люди. Фашисти постійно так робили, але тепер... Тепер це завдавало більше болю. Їй було байдуже, коли лисий дурень Матковскій бурчав про чергову затяту праву політику, але товаришу Бакхаріну вона довіряла. Довіряла настільки, що стала поні, а ось як він віддячив їм усім. Який хворий жарт.\n\nДзвіночок знову ковтнула горілки, не відводячи погляду від снігу. У тумані сп'яніння вона не почула останніх слів товариша Бакхаріна, сповнених смутку. "Дякую вам і... сподіваюся, ви зможете мене пробачити.""
 OMO_aprilfools_regional.13.a: "Це світ людей, а ми всі лише живемо в ньому."

 OMO_aprilfools_regional.14.t: "Нарешті"
 OMO_aprilfools_regional.14.desc: "Бакхарін спробував, але не зміг стримати позіхання.\n\nПоніна тихенько хихикнула. "Утомилися, товаришу?" Її голос м'яко пролунав у величній залі Президії. Уперше за останні місяці в Іркутську нарешті запанував спокій: зникли щоденні бійки в Совєті, скінчилися виснажливі засідання Президії, на яких усі відчували тягар начебто неминучого кінця гармонійного суспільства. Натомість настав мир.\n\nВони це зробили.\n\n"Боюся, так буває, коли старієш", - хихикнув він. І знову спробував, але не зміг стримати позіхання, немов доводячи власні слова. "Відтоді як Риков... майже не було часу відпочити."\n\nУ кімнаті запала тиша. "Ти не винен у смерті Рикова, Ніколаю", - запевнив Томскій із другого боку столу. Він поклав руку на копито Бакхаріна. Ця підтримка була приємною. "Ми всі знали про ризики, коли відгукнулися на твій заклик."\n\n"І ми вже стільки зробили", - додала Поніна. Вона штовхнула Бакхаріна плечем. "Ми перемогли. Гармонія в Росії сильніша, ніж будь-коли. Можеш спати спокійно. Росія, може, й не керуватиме собою сама, але для того в тебе є ми, правда?"\n\n"Гаразд, гаразд, я зрозумів", - засміявся Бакхарін. "Ви, звичайно, маєте рацію. Пробачте, схоже, на старість я вдався у філософію. Мабуть, варто прийняти вашу пораду й поспати."\n\nВислухавши їхні прощання, він підвівся з-за столу й вийшов із зали, а тоді тихими коридорами попрямував до невеликої квартири біля свого кабінету. Усміхаючись, він кивав охоронцям і слухав пташиний спів із-за стін урядової будівлі. День був прекрасний.\n\nНарешті діставшись своїх покоїв, він обережно ліг на ліжко. Заплющив очі й дуже скоро заснув."
 OMO_aprilfools_regional.14.a: "Нарешті спокій."
 OMO_aprilfools_regional.14.a.tt: "§YТовариш Бакхарін§! зумів досягти §Yмиру§! між §Cпоні§! й §Gлюдьми§! Далекого Сходу."

 OMO_aprilfools_regional.15.t: "Вознесіння"
 OMO_aprilfools_regional.15.desc: "Бакхарін різко розплющив очі, прокинувшись так само швидко, як заснув. Озирнувшись, він побачив себе в темному безмежному просторі. Єдина інша істота стояла просто перед ним. Вона була високою, на голову й плечі вищою за самого Бакхаріна, мала крила пегаса й ріг єдинорога. Її тіло було темно-синім, а грива мерехтіла, немов освітлена зорями.\n\n"Хто... хто ви?" - із подивом у голосі запитав Бакхарін.\n\nПостать перед ним по-совиному кліпнула. А тоді засміялася, і звук, здавалося, луною розійшовся навколо. "Перепрошую, вже надто давно мене всі впізнають. Я принцеса Луна з Еквестрії."\n\n"Принцеса?" - перепитав він, піднявши брову.\n\n"Так, принцеса", - підтвердила вона. "Я знаю, як ви ставитеся до монархій, однак наша монархія існує в ім'я Гармонії. Хоч ваш підхід і... нестандартний, ваша праця мене неабияк вразила. Ви звершили Великий Подвиг Гармонії, якого ще не бачив жоден із наших світів. Ви повернули гармонію з краю загибелі й викували суспільство, що залишатиметься міцним довгі роки. Це гідне похвали, юний єдинороже, і гідне винагороди. Я хочу запропонувати вам іще один вибір: піднестися ще вище й стати тим, ким вам завжди судилося бути, алікорном."\n\n"Ви хочете зробити мене принцом?"\n\n"Ви могли б скористатися цією силою й стати принцом, хоча я сумніваюся, що ви так учините. Натомість ви станете взірцем: сяйним символом гармонії, який навіки розриває кайдани знедолених і пригноблених. Ось що ми пропонуємо. Ось що ви заслужили своєю боротьбою."\n\nБакхарінові майже не довелося думати. "Якщо це найкраще для народу Росії, я приймаю."\n\nЛуна кивнула. "Я попросила б вас стати навколішки, та, мабуть, краще лишитися несхиленим. Тож станьте прямо, Ніколаю Бакхаріне, руйнівнику кайданів, і прийміть силу!""
 OMO_aprilfools_regional.15.a: "І Бакхарін прокинувся, назавжди змінившись."
 OMO_aprilfools_regional.15.a.tt: "О, постань, §Yтоваришу Бакхаріне§!, §CРуйнівнику Кайданів§!."
 OMO_aprilfools_regional.15.2.a.tt: "У дереві фокусів відкрито §Yнові гілки§!."
 
 OMO_aprilfools_regional.16.t: "Згасання гніву"
 OMO_aprilfools_regional.16.desc: "У так званий період "Кризи Гармонії" деякі рішення уряду вважалися особливо суперечливими навіть за мірками тієї неспокійної доби. Вони викликали гнів і невдоволення передусім серед людського населення Гармонійного Союзу.\n\nТепер цей період минув, а з ним минає й гнів людського населення. Щодня протестів ставало дедалі менше, люди згортали протестні знамена, а життя народу Гармонійного Союзу повільно, але впевнено поверталося до норми."
 OMO_aprilfools_regional.16.a: "На Далекий Схід нарешті повертається мир."
 
 OMO_aprilfools_regional.17.t: "Після бурі"
 OMO_aprilfools_regional.17.desc: "Поні Росії були невдоволені деякими заходами, які Гармонійний уряд запровадив під час "Кризи Гармонії", й багато з них масово вийшли на вулиці, люто протестуючи проти уряду. Це лише підливало оливи у вогонь, і на вулиці виходило дедалі більше поні.\n\nТа нині все інакше. Уряд і товариш Бакхарін зуміли заспокоїти поні й загладити провину. Поні своєю чергою повернулися до гармонійного способу життя й навіть стали кращими, адже тепер їм зручніше спілкуватися й жити разом із людьми."
 OMO_aprilfools_regional.17.a: "Ми врятували Союз від катастрофи."

 OMO_aprilfools_regional.18.t: "Далекосхідний Сибірський план"
 OMO_aprilfools_regional.18.desc: "Перший Сибірський план відзначився цілковитою байдужістю до тих, хто мав його виконувати. Жодних лікарень, жодних польових амбулаторій, навіть містечок для їхнього розміщення не було, тож у вільний час доводилося майструвати халупи. Робітники мусили будувати заради комунізму й водночас самі себе утримувати.\n\nАле цього разу, схоже, все було інакше. Хоч на чолі нібито стояла та сама особа, якщо його взагалі ще можна було назвати особою. Ніколай Бухарін, голова Совєтського Союзу, став конем. Данило голосно розсміявся від самої думки: Бухарін став конем і знову захопив владу над Росією. Що далі? Ленін повернеться білкою? Маркс напише нову книжку, але ніхто не зможе її прочитати, бо писав він лапами?\n\nТа попри всю нісенітницю довкола обставин Бакхаріна цього разу умови й справді були набагато кращими. У молодості Данило гадав, що може втримати на плечах вагу цілого світу, і ті плечі ледь не зламалися під вантажем бетону та дротів. Тепер, наближаючись до п'ятдесятиріччя на посаді інженера-електрика, він міг оцінити значні поступки, які Бакхарін заклав у новий Сибірський план. Коротший робочий день. Вища платня. Магічно збудовані будинки відпочинку із сучасними зручностями. Він навіть міг напряму зустрітися з планувальниками й обговорити з ними свої потреби, а потім усі вони разом пішли випити.\n\nТакі дрібниці поволі, але впевнено перетворювали колись незбагненні лави інтелігенції та бюрократії, раніше безликі сутності, на справжніх людей, а може, навіть на майбутніх друзів."
 OMO_aprilfools_regional.18.a: "Гармонія вкорінюється по всій землі."

 OMO_aprilfools_regional.19.t: "Запитання"
 OMO_aprilfools_regional.19.desc: "Іркутська зразкова школа Гармонії № 4 була першою у своєму роді, попри назву: справжній експеримент із міжвидової освіти, де навчалися юні світлі уми і людей, і поні. Від світанку до заходу сонця їм прищеплювали бачення Бакхаріна: вони разом училися, їли й гралися. Не мало значення, дві в них ноги чи чотири.\n\nІрина Єршова, вчителька 3-Б класу, гадала, що їй дісталися, мабуть, найрозвиненіші діти в усій Росії. В одному реченні вони ставили запитання, яких чекаєш від старшокласника, і співали дитячі пісеньки, не бачачи в цьому нічого дивного. Та сьогодні маленький Альоша, що співав найсолодше з усіх, поставив запитання, яке ледь не збило її з ніг. "Пані Єршова, навіщо нам учитися дружбі? Якщо я буду найбагатшим, найсильнішим або найрозумнішим, хіба всі однаково не робитимуть те, що я скажу?"\n\n"Хлопчику мій, що б ти до мене відчував, якби я щоразу била тебе по голові, коли хотіла чогось навчити? Якби друзі били тебе щоразу, коли хотіли з тобою погратися, ти й далі з ними грався б? У минулому багато людей, зокрема чимало дорослих, думали так само, як ти, і через це народ багато років жив у смутку. Сила й розум важливі, це правда. Але найбільша сила й мудрість - мати друзів, яким можеш довіряти. Це ми й називаємо магією дружби. Ніщо не здолає народ, об'єднаний у гармонії.""
 OMO_aprilfools_regional.19.a: "Навчи їх замолоду, і вони пам'ятатимуть усе життя."

 OMO_aprilfools_regional.20.t: "14 хвилин до запуску"
 OMO_aprilfools_regional.20.desc: "Бакхарін щасливо сидів на помості й дивився на натовп. Усі ці люди прийшли побачити щось дивовижне: перший показ нового підрозділу ударних військ пегасів.\n\n"5 хвилин до запуску!"\n\nКомісар гукнув Бакхаріну, і вони обмінялися салютами. Глянувши на стартову лінію, Бакхарін побачив сімнадцятьох пегасів, найшвидших зі своїх частин, які вишикувалися й готувалися показати себе.\n\n"10! 9! 8!..." - рахував комісар, а Бакхарін радісно спостерігав. "Старт!"\n\nПегаси помчали по колу зі швидкістю, недосяжною для людини, й незабаром визначилися двоє головних суперників: блідий жеребець із жовтою гривою та кобила з блакитною шерстю й у захисних окулярах. Коли вони мчали шия до шиї, Бакхарін зустрівся поглядом із жеребцем і побачив у ньому щось особливе, чисту, нічим не стримувану рішучість. Огинаючи поворот перед фінішною прямою, жеребець щосили заревів:\n\n"Поїхали!"\n\nУ ту ж мить жеребця осяяло світло, яке потягнулося за ним, наче слід ракети, а коли його швидкість сягнула небачених висот, із нього вибухнуло кільце чистої веселки. Натовп остовпів, немов побачив сцену просто з Еквестрії.\n\nПісля фінішу жеребця обступили журналісти й шанувальники, але Бакхарін проштовхався крізь них і підійшов до молодого перегонця. "Як тебе звати, юначе?""
 OMO_aprilfools_regional.20.a: ""Мене? Юрій Ґаґарін, пане.""
 OMO_aprilfools_regional.20.a.tt: "§YЮрій Ґаґарін§! очолить власну елітну £nato_unit_pegasi_icon_small §Cдивізію пегасів§!."

 OMO_aprilfools_regional.21.t: "Послання Німеччині"
 OMO_aprilfools_regional.21.desc: ""Дозвольте спитати вас дещо, [GER.GetLeader]: що вам відомо про дружбу?\n\nУсе життя я боровся. Від царистів до республіканців, я бився з реакціонерами всіх кольорів, щоб захистити революцію. А тоді прийшли ви з італійцями, угорцями, румунами та багатьма іншими, а ваші лави поповнили наші власні зрадники. Держава розпалася, і я боровся вже не за свою країну, а за власне виживання. Після місяців утечі від тих, хто напевно мене вбив би, я нарешті врятувався.\n\nЯк бачите, я знаю, що таке мати ворогів. Я також знаю, що таке програвати знову й знову та бачити, як ненависть розбиває кожну мрію. Тож я питаю вас тепер, поки ви купаєтеся в тріюмфі над найбільшим містом світу: де ваші друзі?\n\nВи живете лише завдяки силі апарату безпеки, який захищає вас від власного народу. Гітлер був легендою, але після першого вже померли троє фюрерів. Ви справді гадаєте, що ніхто не захоче вбити четвертого? Можливо, куля прилетить від озлобленого бідняка, а може, від студента, який дізнався трохи забагато. Можливо, раб одного дня помститься за свій клас, так довго топтаний німецьким чоботом. І це ще найдостойніша смерть, на яку ви можете сподіватися. Ви розумієте й боїтеся, що будь-якої миті власні прибічники стягнуть вас у багно й пил та кинуть там. Чи довіряєте ви міністрам, що стоять так близько до влади, не захопити її? А що із чорною державою на заході, яка аж слину пускає від думки про ще одну нагоду поставити Німеччину на коліна? Найбільша іронія полягає в тому, що і для мене, і для вас найбільша загроза - німецький убивця.\n\nЯ знаю, що у вас немає дружби, [GER.GetLeader]. Я спробував би пояснити її, але боюся, вам уже нічим не допомогти. Луна навчила мене більшого, ніж ви колись зможете зрозуміти, але досить сказати: Дружба - це магія.""
 OMO_aprilfools_regional.21.a: ""Підписано: Головпоні Ніколай Бакхарін.""

 OMO_aprilfools_regional.22.t: "Кінський торг"
 OMO_aprilfools_regional.22.desc: "Конгресмен Джон Брадемас біг уздовж Припливного басейну, намагаючись зібратися з думками. За десять років він здобув славу одного з провідних державних діячів Вашингтона. Він гідно поводився на слуханнях і спілкувався з фахівцями із зовнішньої політики з усіх головних аналітичних центрів. Він навіть входив до кількох поважних рад.\n\nІ попри всі ці заслуги він ніяк не міг збагнути, як порозумітися з гостями з Росії.\n\n"Отже, я розумію... що вам довелося багато пережити", - сказав захеканий конгресмен, наполовину супроводжуючи, наполовину наздоганяючи табун летючих коней, які проносилися крізь ряди квітучих вишень. "Але... я вважаю... добрі відносини... можуть бути... взаємовигідними..."\n\nОдин поні занісся до Меморіялу Джефферсона, викликавши здивовані крики туристів усередині. Стогнучи, Брадемас поплентався сходами повз спалахи полароїдів. Одним незграбним рухом він протиснувся крізь юрбу довговолосих підлітків, від яких тхнуло скунсами. І змусив себе продовжити промову. "Америка завжди... підтримувала... підприємливі, вільні душі."\n\nТа коні не звертали на нього уваги. Вони галопували пантеоноподібною спорудою, охали й ахали перед статуєю. Читали написи на мармурових плитах, носилися поміж колонами, а тоді знову вийшли на мармурові сходи й задивилися на місто. Піднявшись за ними й хапаючи ротом повітря, Брадемас благально подивився на них. "Будь ласка... чого ви хочете?"\n\nУперше від початку імпровізованої екскурсії коні зупинилися й перезирнулися. "Можна зайти в, як ви казати, Монумент Вашингтона?" - запитали вони ламаною англійською."
 OMO_aprilfools_regional.22.a: ""Гадаю... ми можемо це влаштувати.""

 OMO_aprilfools_regional.23.t: "Непроханий гість у палаці"
 OMO_aprilfools_regional.23.desc: "Хоча зазвичай їхня роль була суто церемоніяльною, двоє вартових перед Імператорським палацом тепер безперечно відпрацьовували свою платню. Принаймні вони зможуть хвалитися онукам, що особисто врятували життя самого імператора від... від...\n\nЩо це взагалі за істота перед ними? Вона скидалася на маленького коня, але була темно-червоною й мала велетенські величні крила. На голові стирчав гострий ріг, що яскраво світився, поки істота говорила, намагаючись перекласти свої слова японською. Важко було сказати, наскільки вдало.\n\n"Пустіть мене. Ви мусили бачити, як я раніше залишав палац. Щоправда, я вилетів, але ви не могли мене не помітити! Я був на авдієнції у вашого імператора!"\n\nОдин із вартових набрався сміливости заговорити. Нехай у звіра були крила й ріг, але в його руці лежала холодна, заспокійлива вага вогнепальної зброї. "Геть, звірюко! Тобі не місце на священній землі, що несе тягар усієї Японії!" Пишномовні слова здавалися цілком доречними для події просто з казки. Вартовий поглянув у лице магічного поні й сподівався, що виглядає хоробро. Якщо істота не відступить, доведеться навести зброю, а хто знає, до чого це призведе. Бакхарін склав крила й роздратовано відступив на кілька кроків. Коли він заходив, то мовчки пройшов повз цих вартових. Невже вони його геть не помітили? Сонце важко пекло спину. Ситуація ставала незручною.\n\nІ тут з-за воріт долинув звук. Поспішний біг. Стук. Вартові на мить перезирнулися й відчинили двері. У воротях, немов в обрамленні, стояв один з особистих охоронців імператора. Він підійшов до Бакхаріна й провів його всередину. Там на нього чекав старий кволий чоловік, наділений більшою символічною владою, ніж сотня фюрерів і тисяча президентів, який прагнув знову поговорити з дивним звіром, котрого почав називати другом."
 OMO_aprilfools_regional.23.a: "Одна небесна істота говорить з іншою."

 OMO_aprilfools_regional.24.t: "Великий задум Бакхаріна"
 OMO_aprilfools_regional.24.desc: "Попри всі свої обов'язки Бакхарін досі знаходив час на вивчення комуністичної літератури. Сьогодні ввечері він читав Маркса, велику основу, з якої виріс увесь рух. Коли він читав ці праці молодим і ще людиною, вони здавалися такими мудрими, немов містили розв'язання всіх проблем людства.\n\nТепер, маючи за плечима весь свій досвід, він ледве стримувався, щоб не рвати на собі волосся через усі обмеження, припущення й застарілі думки. Наче відчувши, що керівник дійшов до межі, до кімнати ввійшов особистий секретар Бакхаріна з текою. "Звіт, який ви просили, пане, про стан міжнародного комуністичного руху. Залишити його на столі?"\n\n"Ні, ні, дайте сюди. Мені треба перемкнутися."\n\nТека майже одразу виявилася цікавою. Звісно, перемога фашистів і розпад Совєтського Союзу не пішли рухові на користь, але він усе одно вижив. Окрім решток західноросійського уряду на Батьківщині, комуністичні осередки вціліли на околицях Китаю та у В'єтнамі. У західній Республіці Індії комуністи утворили доволі велику й добре організовану партію, а східний уряд, схоже, сам безпосередньо перейняв досить ліві ідеї. Далі на захід, звичайно, жодна комуністична партія не могла діяти відкрито в Європі під владою нацистів та італійців, зате в Південній Америці й Африці набирали сили великі та перспективні рухи. Їм була потрібна лише підтримка й, звісно, легкий поштовх у правильному, гармонійному напрямку.\n\nЦікаво. Дуже цікаво. Бакхарін і не помітив, як заснув, задоволено посміюючись і уявляючи грандіозне відродження світового комуністично-гармоністського руху. Прокинувшись, він збере ці думки докупи й перетворить їх на великий задум із перебудови сил робітничого та селянського руху в усьому світі."
 OMO_aprilfools_regional.24.a: "Лишається тільки сподіватися, що вони відкриті до нових ідей..."

 OMO_aprilfools_regional.25.t: "Основні труднощі"
 OMO_aprilfools_regional.25.desc: ""Е-е... буейнос діяс, товариші."\n\nРосіянин, який не знає іспанської, але намагається нею говорити, являє собою незабутнє видовище, як швидко з'ясував Бакхарін. Судячи з поглядів, перше враження було геть не таким, як він хотів. Він поспіхом перейшов назад на англійську, яку, на щастя, бодай трохи розумів кожен делегат. Зрештою, хоч щось між ними мало бути спільним.\n\nА зібралася й справді строката компанія з усього континенту. Кубинський революціонер, парагвайський бойовик, бразильський амазоніст, очільник чилійського колективу - це лише кілька учасників зустрічі, кожен з історією, цікавішою за найдивовижнішу вигадку. І все ж Бакхарін чомусь відчував, що увагу зали прикували не його праці.\n\n"...і цим завершується моя теорія про те, чому Гармонія має стати пріоритетом сучасної комуністичної діяльности. Що скажете, панове?"\n\n"...ви тепер кінь?"\n\n"Єдиноріг. Але так. Наступне питання?"\n\n"А як ви стали... конем?"\n\n"Кристали. Я про них говорив. У когось є питання про гармонійний комунізм? Будь ласка?"\n\n"...раз ви кінь, чи намагався хтось, е-е, припнути вам до спини сідло й... покататися на вас?""
 OMO_aprilfools_regional.25.a: "Ця подоба має свої прокляття."

 OMO_aprilfools_regional.26.t: "Досконалий взірець сучасного генерал-майора"
 OMO_aprilfools_regional.26.desc: "У них не було пальців. Як вони тримали зброю без пальців?\n\nЦе було єдине, про що думав генерал Джеймс Брайтон, сидячи поміж американських дипломатів і військових. Усі вони розташувалися на сцені перед так званою Великою військовою академією Магадана. Кожного попросили виголосити перед зібраним натовпом коротку промову про довгу й успішну історію російсько-американської співпраці. І кожен дивився на море чотирифутових барвистих коней із рушницями.\n\nПоки чиновник Державного департаменту нудно торочив про дружбу, Брайтон на кілька сантиметрів повернув голову й утупився просто в найближчого до сцени поні. Він устиг уважно роздивлятися коня якусь секунду, перш ніж істота помітила його погляд. Генерал швидко відвернувся.\n\nЗвісно, ця подія була важлива. Звісно, відносини з новою відродженою Росією відкривали величезні можливості для Сполучених Штатів у боротьбі з фашизмом. Він мав усією душею бути присутнім на події, яку американські перемовники так тяжко намагалися організувати.\n\nАле зброя. Він не міг припинити думати про кляту зброю. Вона просто липла до їхніх копит, наче намазана клеєм? Як вони натискали довбані гачки? Він бачив салют із 21 гармати, і жоден поні не торкнувся гачка. Як це можливо? Якийсь ідіот у Пентагоні мусив знати відповідь.\n\nЧоловік за трибуною повернувся на своє місце. Генерал продовжував думати, спантеличений дедалі більше, а зібрання оповила незручна тиша. Нарешті помічник нахилився й торкнув його за плече. "Ваша черга говорити, пане.""
 OMO_aprilfools_regional.26.a: ""Я навіть не хочу думати, як вони керують літаками.""

 OMO_aprilfools_regional.27.t: "Зустрічний марш"
 OMO_aprilfools_regional.27.desc: "Стоячи струнко й незворушно, з мечами при боці, офіційна військова делегація Японської імперії у Великій військовій академії Магадана мала справді дуже серйозний вигляд.\n\nАле коли вони дивилися на парад поні, що маршували повз, ця маска мало не тріснула. Кісточки генерала Такамури побіліли, коли він стиснув цуку свого 80-річного церемоніяльного меча, а око нервово засіпалося. Губи генерал-лейтенанта Шімури тремтіли, поки він стримував сміх, а полковник Котані вдарив майора Суґавару ліктем у живіт за мить до того, як той не витримав і зареготав. Один поні в строю це помітив, подивився йому просто в очі й віддав честь пухнастою, схожою на зефір передньою ногою. Торкнувшись шолома, вона тихенько пискнула.\n\nЯпонська військова делегація насилу витримала решту маршу, поки повз проходило ціле райдужне розмаїття балакаючих коней. Наприкінці обличчя поважного генерала почервоніло, мов помідор, і щойно парад закінчився, він рушив до своїх покоїв, ледь не пускаючи пару з вух. Колись він служив у кавалерії й із багаторічного досвіду знав, який вигляд має світ поміж кінських очей.\n\n"Цікаво, який він тепер, якщо їх осідлати."\n\nВін вибухнув істеричним реготом, але бодай трохи втішало, що його принаймні не змусили очолювати парад."
 OMO_aprilfools_regional.27.a: "День, який не забути."

 OMO_aprilfools_regional.28.t: "Удавання"
 OMO_aprilfools_regional.28.desc: ""Ого, це божевілля. І по-своєму величне."\n\n"Авжеж. Усі ці кути, чорна сталь, і ця штука має бути невидимою для радарів."\n\n"Так, але в мене лише одне питання. Що за-."\n\n"Не треба."\n\n"У якому сенсі? Я просто хотів спитати, що це за синя пташка?"\n\n"Не переймайся. Щоразу, як хтось питає про неї інженерів, вони починають говорити в риму, щось про падучі зорі та бажання."\n\n"Що? І який у цьому сенс?"\n\n"Жодного, але ми просто змирилися. Це наші найкращі фахівці, і якщо вони хочуть намалювати двоногу синю пташку на своєму новітньому літаку-невидимці, я не можу їх зупинити."\n\n"Вони... намагаються її нагодувати?"\n\n"Просто відвернися, капрале...""
 OMO_aprilfools_regional.28.a: ""...відвернися, поки не почалася пісня.""
 
 ## Superregional
 
 OMO_aprilfools_superreg.1.t: "Другий Конгрес"
 OMO_aprilfools_superreg.1.desc: "Перед світанком Новосибірськ був тихим. Стоячи на балконі біля свого кабінету, Ніколай Бакхарін бачив безліч рожевих знамен, що майоріли над містом. Невеликі групи людей і поні прибирали засипані снігом вулиці, готуючи їх до Другого Всепонійного Конґресу.\n\nВажко було повірити, що він зайшов так далеко. Скільки років минуло відтоді, як він мерз на самоті в сибірській пустці? Скільки знадобилося промов, щоб пояснити його бачення Гармонії й перетворити гурток із кількох десятків прибічників на рух, а тоді на цілу державу? Хоча праця часто була тяжкою й болісною, він ніколи не зрікався своїх ідеалів. Ніколи не зраджував друзів і не підводив їх.\n\nНу, майже всіх.\n\nНад балконом пролетів холодний вітер, і Бакхарін злегка здригнувся. Перші промені сонця визирали з-за обрію, а по всьому місту запалювалися вогні. Незабаром партійні чиновники рушать до конгресової зали. Сотні делегатів усіх форм, розмірів і видів зберуться обговорити шлях Росії вперед і збереження революційних ідеалів для майбутньої боротьби. На них чекала тяжка праця.\n\nБакхарін відвернувся від міста, зайшов до кабінету й зачинив за собою двері. Перш ніж думати про Конгрес та об'єднання людей і поні, він мусив зробити одну справу. Завдяки рогові на його голові перо й аркуш пергаменту злетіли в повітря. Повільними, обережними рухами він почав писати."
 OMO_aprilfools_superreg.1.a: "Час розв'язати останні вузли."
 
 OMO_aprilfools_superreg.2.t: "Кумедні винаходи"
 OMO_aprilfools_superreg.2.desc: "За часів Рюрика Кемеровський завод розваг був збройовою фабрикою. Коли Гармонійний Союз визволив Центральний Сибір, споруда вже занепала й була частково зруйнована в боях між воєначальниками. Лише відданий і талановитий непман міг перетворити її на щось справді особливе.\n\nСьогодні Головпоні Бакхарін проводив звичайну інспекцію новітньої фабрики. Яка ж вона дивна! Поні й люди стояли пліч-о-пліч і виробляли не зброю чи їжу, а м'якенькі дитячі іграшки. Ґудзики й тканина мчали конвеєром, а робітники зшивали їх докупи. Наприкінці лінії барвисті плюшеві поні купами складали в ящики, готові до відправлення по всьому Гармонійному Союзу.\n\nБакхарін обернувся й узяв одну іграшку. На нього дивилася його власна точна копія, набита ватою, з очима-ґудзиками. Вона мала навіть такий самий капелюх і бороду, як у Головпоні. У ріг вшили сяйний ліхтарик, щоб діти могли вдавати, ніби плюшевий поні володіє магією алікорна.\n\nЯкі чудові новації, подумав Бакхарін. Саме для цього й створили НЕП. Плюшеві іграшки ніколи не народилися б у позбавленій уяви голові партійного бюрократа, хоч би яким відданим Гармонії він був. Такі промислові новації могли походити лише від самих робітників, готових випробовувати свої ідеї на гармонійному ринку соціялізму.\n\nВін стиснув іграшку. Із голосового пристрою, схованого в тілі поні, пролунав глибокий голос.\n\n"Я Головпоні Бакхарін! Дружба - це магія!""
 OMO_aprilfools_superreg.2.a: ""І справді трохи схоже на мене...""
 
 OMO_aprilfools_superreg.3.t: "Друзі назавжди"
 OMO_aprilfools_superreg.3.desc: ""Здається, все". Перлинка завершила перевіряти сідельні сумки, повні книжок і паперів із червоними молотами та підковами. "Покличеш нашого хлопчика?" - запитала вона чоловіка.\n\n"Звісно, я-."\n\n"-маю з ним поговорити. Останнім часом він сам не свій. Особливо відколи зрозумів, що нам доведеться переїхати до Новосибірська разом з усім Верховним Совєтом."\n\n"Я подбаю про це, не хвилюйся". Золота Зоря зачинив багажник автівки й повернувся в будинок. Усередині він побачив сина, який мовчки дивився на щось, утримуване чарами в повітрі.\n\n"Веселко?" Він підійшов до хлопчика й побачив у його чарах фотографію, де той стояв разом з іншими лошатами й людськими дітьми.\n\n"Міша... Блу... Лука... Віктор", - хлопчик шморгнув носом. "Я... більше ніколи їх не побачу, правда?" Зоря чув смуток у його голосі. "Вони роками були моїми друзями! Як я маю отак просто їх відпустити?!" Веселко розплакався.\n\nЗолота Зоря підбіг ближче й заговорив: "Сину, іноді ми мусимо відпускати те, що любимо, але завдяки цьому можемо знайти щось іще прекрасніше". Зоря підняв чарами поламану рамку й продовжив: "Збережи цю світлину, постав її на стіл у нашому новому домі й назбирай ще багато таких. Світ великий, і в ньому безліч майбутніх друзів. Я в тебе вірю."\n\nВеселко витер сльози з обличчя й поглянув на світлину, яку батько тримав у повітрі. Він узяв її копитом і обійняв батька."
 OMO_aprilfools_superreg.3.a: ""Я... дякую, тату.""
 
 OMO_aprilfools_superreg.4.t: "Дар дарування"
 OMO_aprilfools_superreg.4.desc: "Коли нову Росію Бакхаріна охопили дивні зміни, Алєксєй не звернув на них уваги. Життя в його селі йшло своїм звичаєм: холодне, тяжке, але нормальне. Нікому нічого не вистачало, тож вижити можна було лише завдяки добрій волі й щедрості односельців. А оскільки Алєксєй мав найбільше, то зазвичай і віддавав найбільше. Нічого дивного він у цьому не бачив. Він просто так жив, і дарувати було для нього так само природно, як дихати.\n\nА от коли він хотів позичити сусідському синові останню крихту цукру й раптом побачив комору, до стелі наповнену акуратно складеними мішками високоякісного експортного кубинського цукру, це вже точно не було природним. Щоправда, всі інші запаси їжі, звісно, зникли в етері. Але це не мало значення, бо Алєксєй зрозумів: його щедрості тепер наче ніщо не обмежувало, навіть такі дурниці, як закони фізики чи реальности. Хай що він хотів подарувати, він міг це створити.\n\nНа коротку мить його спокусила думка начаклувати гори золота чи коштовного каміння, але відразу минула. Усе сталося уві сні, в бірюзовому видінні сили, яку він отримав, очевидно, через свій статус утіленої Щедрости. Та зрештою Алєксєй зрозумів, що йому набагато приємніше просто дарувати дітям цукерки, допомагати сусідам лагодити плуги й трактори, а іноді заварювати смачний якісний чай для пані з будинку навпроти, яка втратила чоловіка на війні."
 OMO_aprilfools_superreg.4.a: "Щедре серце лишається щедрим."
 OMO_aprilfools_superreg.4.a.tt: "§lОдного дня Елементи постануть.§!"
 
 OMO_aprilfools_superreg.5.t: "Інформована згода"
 OMO_aprilfools_superreg.5.desc: ""То... то ви кажете, що... що я заходжу туди, а тоді пф-ф! І я поні?"\n\nСєрґєй Іванов відчув, як усмішка стає натягнутою. "Я щойно відповів на це питання, товаришу."\n\nВін зітхнув. Сєрґєй не був серед перших, хто прийняв пропозицію Бакхаріна. Спершу він сумнівався: відмовитися від людської подоби й стати живим, дихаючим пастельним конем? Але що більше друзів приймали пропозицію, то виразніше він бачив, якими щасливими вони стали в нових тілах, і нарешті вирішив до них приєднатися. Тож коли Бакхарін закликав добровольців донести його пропозицію до щойно приєднаних областей Центрального Сибіру, Сєрґєй зрозумів, що мусить піти.\n\nВід добродія перед ним тхнуло дешевим пивом. Він надокучав Сєрґєєві вже майже пів години, повторюючи п'ять чи шість тих самих питань і щоразу наче радіючи відповіді. Та що більше зростав захват чоловіка, то менше в Сєрґєя лишалося терпіння.\n\n"Усе просто, - знову пояснив він. - Заходиш, торкаєшся кристала й перетворюєшся на поні, яка найкраще відповідає твоїй вдачі."\n\nЧоловік кивнув. "Я хочу це зробити."\n\n"Що?"\n\n"Я... я хочу, - гикнув чоловік, ковтнув із фляги й продовжив, - я хочу стати поні."\n\n"Товаришу, вам не можна туди в такому стані! Пропозиція Бакхаріна відкрита для всіх понів, але це надто важливе рішення, щоб приймати його напідпитку, а потім нічого не пам'ятати!" Сєрґєй перескочив через прилавок і, легенько підштовхуючи чоловіка, вивів його за двері."
 OMO_aprilfools_superreg.5.a: ""Повертайтеся, коли протверезієте, тоді й поговоримо!""
 
 OMO_aprilfools_superreg.6.t: "Сибірський захід сонця"
 OMO_aprilfools_superreg.6.desc: "Бакхарін дивився на Новосибірськ, залитий згасаючим світлом під помаранчевим небом. Сонце дедалі нижче схилялося до обрію, а думки Бакхаріна віддалялися від краєвиду.\n\nНатомість він думав про тих, кого втратив у дорозі. Про Леніна, що стільки років тому помер від хвороби, і про Рикова, трагічно вбитого екстремісткою. Думки про смерть Рикова досі завдавали болю. Рана була надто свіжою, щоб її ворушити.\n\nНебо змінило колір із помаранчевого на рожевий, а тоді на темно-фіолетовий. Бакхарін думав про всіх загиблих більшовиків і мільйони людей, що страждали протягом останніх десятиліть. Від часів Великої Вітчизняної війни Росія знала лише муки та чвари.\n\nКоли сонце повністю сховалося за обрієм, а Новосибірськ огорнула спокійна нічна темрява, Бакхарін присягнув більше ніколи не дозволити народові страждати від розпачу, знайомого всім росіянам. Сам Бакхарін надто добре знав цей розпач, що оселився в ньому після падіння Совєтського Союзу.\n\nБакхарін відвернувся від балкона, готовий зробити все необхідне."
 OMO_aprilfools_superreg.6.a: "Запалімо іскру надії, а не роздмухуймо полум'я розпачу."
 
 OMO_aprilfools_superreg.7.t: "Ultima Ratio"
 OMO_aprilfools_superreg.7.desc: ""До випробування 20 секунд. Товариші, перевірте захист для очей". Науковці в бункері метушилися перед Бакхаріном та рештою Політбюро, завершуючи останні перевірки. Цей день настав. Бакхарін не любив абсолютної зброї вбивства: це був жорстокий злочин проти природи, що суперечив усьому, за що стояла Гармонія. Але якщо він хотів змагатися із сучасним світом та іншими наддержавами, то мусив прийняти це необхідне зло. І сьогодні настав день випробування.\n\nП'ять, гомін ущух. Чотири. Три, Бакхарін нервово потер копито об копито. Два. Один-.\n\nСвітло було сліпучим навіть крізь захист для очей. Бакхарін мусив примружитися, поки воно згасало, залишаючи по собі лютий стовп атомного вогню. Ударна хвиля затрусила будівлю, а хмара росла, її верхівка сплющувалася й загорталася в себе, утворюючи легендарний гриб. Коли видовище вляглося, гомін поновився. Науковці були задоволені, а Бакхарін і Політбюро принаймні раділи, що все минуло вдало, а не катастрофічно. Можливо, якась частина Бакхаріна хотіла, щоб випробування провалилося, щоб вони не приборкали-.\n\nІ тут пролунав другий вибух. Бакхарін не помітив, як хмара почала згортатися всередину, доки схвильовані крики науковців не привернули до неї увагу. Усі в кімнаті могли лише дивитися, як удалині вона стискається дедалі щільніше, а потім відскакує назад. Це вже була не грибоподібна хмара, а пульсуюча сфера руйнівної фіолетової енергії, поряд із якою попередній вибух здавався камінчиком. Чисте руйнування. Тиша була оглушливою. Бакхарін чув лише низький гуркіт, що лишився після вибуху. Що сталося? Він не мав бути таким потужним... Це кристали? Магія збільшила силу? Питання металися в його голові, але слова ледве могли зірватися з уст."
 OMO_aprilfools_superreg.7.a: ""Що ми накоїли?""
 OMO_aprilfools_superreg.7.a.tt: "§RЦе недобре.§!"
 
 OMO_aprilfools_superreg.8.t: "Старі імена зі старих часів"
 OMO_aprilfools_superreg.8.desc: "Сиктивкар був занедбанішим, ніж пам'ятав Бакхарін.\n\nВін, звичайно, не уявляв його сяйним раєм, зрештою, місто десятиліття бомбили й стільки ж років за нього воювали, але потрісканий кулями бетон і подекуди вибиті вікна старих будинків, які досі вперто стояли, не додавали йому краси. Завдяки зусиллям Гармонійного Союзу Сиктивкар нарешті міг повернутися до світлого майбутнього. До того ж сам Бакхарін допоміг надати місту сучасної подоби. У певному сенсі це нагадувало батька, який бачить свою дитину дорослою.\n\nВін саме почав обдумувати цю думку, коли почув тихий стукіт чобіт об бруківку. Обернувшись, він побачив, хто підходить ззаду: Блюхер із листом у правій руці. На його обличчі сяяла усмішка.\n\n"Добрий вечір, Блюхере, - заговорив Бакхарін. - У когось гарний настрій. Через краєвид?"\n\n"Частково, товаришу, - відповів Блюхер, стаючи поруч. Він оглянув місто, а тоді повернувся до свого Головпоні. - Але головно я прийшов віддати вам це". Він простягнув Бакхаріну листа, і той узяв його копитом. Обережно розірвав конверт і почав читати.\n\n"Розумієте, товаришу, коли ми рушили на захід, я почав чути розповіді, ніби ваша дочка стала політичною діячкою. Можете собі уявити? Певен, ви теж таке чули. Я наказав усе перевірити. Ми пройшли слідом до самого кінця й з'ясували, що ці чутки не просто правдиві, а що вона десь..." Він указав на пошкоджене місто попереду. "...тут."\n\nБакхарін не слухав. Він не відривав очей від аркуша й швидко читав. Стримано ахнув, різко підняв голову й широко розплющив очі."
 OMO_aprilfools_superreg.8.a: ""Світлана?!""
 
 OMO_aprilfools_superreg.9.t: "Сімейне возз'єднання"
 OMO_aprilfools_superreg.9.desc: "Ніколай Бакхарін багато чого зробив за своє життя. Зламався в найтемнішу годину країни й без надії втік до сибірської тундри. Перебивався крихтами в пустці, ховаючись від ганьби, поки доленосна знахідка кристала не принесла йому благословення. Боротьба обдарувала його магією та силою, любов'ю народу й честю.\n\nТа попри все це постукати у двері було найстрашнішою справою, на яку він будь-коли наважувався.\n\nУдари копита по дереву пролунали наче постріли, і він обережно відступив на кілька кроків. Найкращі люди й поні НКГД витратили кілька днів, щоб розгадати її способи переховування. Він знав, що означає так ретельно відступити від світу. Чи прийме вона його, чи запросить увійти? Чи впізнає взагалі?\n\nДвері тихо прочинилися на якусь шпаринку. Він побачив каре око, що визирнуло назовні й раптом стало круглим, мов блюдце. Двері зі скрипом відчинилися до кінця, і перед ним постала-.\n\n"Тату?"\n\n"Світлано, я-."\n\n"...ти справді кінь". Вона прикрила рот руками, оглядаючи Ніколая з голови до ніг.\n\n"Алікорн, люба", - він спробував усміхнутися. "Ти здорова?"\n\n"Так. Ти хотів би..." Поки вона затиналася, його затопили спогади. Востаннє він бачив її в кузові вантажівки тридцять років тому. Їй було лише 17. Тепер вона була старша, набагато старша, але він упізнав цю поставу, голос, очі. Це була його Світлана. "Ти хотів би зайти?""
 OMO_aprilfools_superreg.9.a: ""Так. Я дуже цього хочу.""
 
 OMO_aprilfools_superreg.10.t: "Родина знову разом"
 OMO_aprilfools_superreg.10.desc: "Чашка дзенькнула об блюдце, коли він поставив її на стіл. "Неймовірно", - тихо пробурмотів він. "Звідки в тебе такий чудовий напій?"\n\n"Ще з довоєнних часів", - відповіла Світлана й відпила кави, немов підкреслюючи свої слова. "Я готую її лише з особливої нагоди."\n\n"І це, гадаю, така нагода?" - спитав Бакхарін із легкою усмішкою. Дочка всміхнулася у відповідь. "Розкажи ще про Комі. Ти казала, що зустрічала Міхаїла Андрєєвіча?"\n\n"О так. І товариша Андрєя Алєксандровіча, ще була Світлана Сталіна-." Почувши це ім'я, Бакхарін мимоволі насупився. "-вона не була такою варваркою, як її батько, але була цілеспрямованою. А Комі... там панував такий хаос, тату, нудьгувати не доводилося."\n\nБакхарін відсунув блюдце. "Перш ніж я продовжу, просто хочу сказати, як я пишаюся тобою, Світлано. Ти стала важливою, хороброю людиною. Провідницею, воїтелькою, товаришкою. Для мене честь називати тебе дочкою."\n\nСвітлана засяяла й випросталася на стільці. "Я... я завжди знала, що ти десь там. А тепер я... бачу тебе тут, у плоті, і..." Вона замовкла. Бакхарін нічого не сказав. Натомість поліз до кишені піджака, дістав кристал і поклав на стіл. Той сяяв електрично-фіолетовим у денному світлі, притягуючи Світлану. Коли вона підвела очі, у них змішалися страх, надія, захват і тривога. Старий глибоко вдихнув і продовжив.\n\n"Ти розумієш, що це означає? Це буде... велика зміна. Ти втратиш теперішню подобу. Але здобудеш дружбу, магію, гармонію... усе, що тільки уявиш. Вибір за тобою, Світлано, - він заплющив очі й тихо засміявся. - Та хай що ти обереш, я просто хочу, щоб ти знала, як я пишаюся тобою, моя маленька поні.""
 OMO_aprilfools_superreg.10.a: ""Ти приєднаєшся до мене?""
 OMO_aprilfools_superreg.10.a.tt: "§BВід імені команди §DПроєкту Ferus§! дякуємо, що зіграли у першоквітневу сюжетну гілку TNO 2022 року.\n\nЗіграйте в частину нашого спільного проєкту в §CEquestria at War§!, чекайте на майбутні *нормальні* оновлення й пам'ятайте: §YДружба§! §G- це§! §Cмагія!§!§!"
 
 OMO_aprilfools_superreg.11.t: "Лист"
 OMO_aprilfools_superreg.11.desc: "Єлєно,\n\nКоли ми зустрілися в Омолоні, ти попросила мене пояснити мою теорію Гармонії. Ось вона: від звірів цього світу нас відрізняє здатність любити. Завдяки їй людина може піднятися над вузькою особистою вигодою. Вона надихає людей на великі звершення заради спільного блага. Ось чому фашисти докладають стільки зусиль, щоб розірвати зв'язки й спрямувати наше прагнення до спільноти та дружби в бік ненависти, смерти й руйнування.\n\nЯ знаю, наскільки незграбно й наївно це звучить, немов моя етика походить просто з американської поппісні. Але банальність не робить її менш правдивою. Посеред принижень злиднів та експлуатації саме дружба стала нашим найбільшим джерелом сили й розради.\n\nХотів би я встигнути тебе цього навчити. Хотів би знати всю глибину твого розпачу. Хотів би востаннє побачити тебе на Гала й сказати, як я ціную твоє товариство, як твоя відданість Союзові нагадувала мені, чому я став головою Ради Народних Комісарів. Твої слова й учинки нагадали мені, що я не можу бути лише провідником поні. Я мусив стати провідником усіх народів, які прагнуть свободи під гнітом.\n\nТвого вчинку проти Рикова не виправити. Я не можу подарувати тобі легке відпущення гріхів, наче якийсь розпусний священник. Жоден добрий друг так не зробив би. Але я ніколи не втрачу надії на твоє перевиховання, на те, що боротьба змінить тебе й ти вийдеш із неї сильнішою. Коли будеш готова до цієї подорожі, я допоможу тобі.\n\nА доти я берегтиму пам'ять про тебе у своєму серці."
 OMO_aprilfools_superreg.11.a: "До зустрічі, подруго."
 
 ### News Event Localisation
 
 OMO_aprilfools_news.1.t: "[Get_newspaper_header]Байки з півночі"
 OMO_aprilfools_news.1.desc: "Із найпівнічніших громад Сибіру манівцями просочуються чутки. Цей край так мало заселений, що сама поява бодай якихось новин звідти вже вражає. А їхній зміст іще дивовижніший.\n\nПодейкують, що громади Омолону захопив балакаючий кінь, і не просто кінь, а єдиноріг. Кажуть, істота очолює уряд, який проповідує комунізм і гармонію, а сам жеребець нібито зветься "Ніколай Бакхарін". Кілька знавців російських справ списали все на масову істерію, але місцеві запевняють, що це щира правда.\n\nЦей журналіст пам'ятає часи, коли наша газета була поважним джерелом новин."
 OMO_aprilfools_news.1.a: "Ага, звісно. Повірю, коли сам побачу."
 
 OMO_aprilfools_news.2.t: "[Get_newspaper_header]"Гармонійний Союз" об'єднав Далекий Схід"
 OMO_aprilfools_news.2.desc: "Практично незбагненний розвиток подій на далекому сході колишнього Совєтського Союзу.\n\n"Гармонійний Союз" під керівництвом Ніколая Івановича Бухаріна, або "Бакхаріна", як він тепер, вочевидь, називає себе англійською, відсунув убік гризливі залишки НКВД й воєначальників з-поміж харбінських емігрантів, які начебто контролювали російський Далекий Схід, та захопив владу над краєм. Від Іркутська до Магадана й далі країна тепер, схоже... опинилася під владою не людей, а яскраво розфарбованих... балакаючих... коней на чолі з Бакхаріном, який, здається, й сам став конем.\n\nМенш розсудливі аналітики, отримавши цю новину, вишикувалися до барів, щоб напитися до нестями. Розсудливіші пішли на психіятричне обстеження. Цей журналіст планує зробити і те, й інше.\n"
 OMO_aprilfools_news.2.a: "Гаразд, *тепер* я вірю."
 
 OMO_aprilfools_news.3.t: "[Get_newspaper_header]Гармонійна Росія"
 OMO_aprilfools_news.3.desc: "Гармонійний Союз Ніколая Бакхаріна возз'єднав Росію, хоча ще десять років тому будь-кого, хто передбачив би такий результат, запроторили б до божевільні. Міжнародні спостерігачі приголомшені, та більшість швидко вчиться приймати нову дійсність.\n\nПопри відмінності, відносини між людьми й поні мирні як ніколи завдяки їхній вірі в нову, радикально ідеалістичну ідеологію гармонійного комунізму. Поки світ спостерігає з рівною мірою подиву й захвату, ширяться чутки, що Гармонійний Союз готується рушити на захід і раз і назавжди кинути виклик німцям. Після двох десятиліть принижень і болю лишається сподіватися, що ця нова доба Гармонії та Дружби триватиме довго."
 OMO_aprilfools_news.3.a: "До цього звикаєш."
 
 OMO_aprilfools_news.4.t: "[Get_newspaper_header]Розпад Гармонії"
 OMO_aprilfools_news.4.desc: "Схоже, доба Гармонії добігла кінця. Гармонійний Союз поринув в анархію та цілковитий безлад після того, як коаліція різношерстих пропонячих екстремістів із "Рожевої Армії" захопила Верховний Совєт. Наразі, схоже, жодна група не змогла скоординувати зусилля зі стабілізації держави.\n\nГолову Ніколая Бакхаріна не бачили вже кілька днів, а сторонні спостерігачі досі не знають, де він перебуває. На диво, не повідомляють про жодні заворушення. Останні протестувальники, і люди, і поні, схоже, просто повернулися додому й зачинилися. Вулиці спорожніли. За повідомленнями, люди й поні уникають одне одного, а Верховний Совєт перебуває в безладі без чітко призначеного наступника.\n\nНа вулицях панує мир, тривожний, але все-таки мир."
 OMO_aprilfools_news.4.a: "О людство!"
 
 OMO_aprilfools_news.5.t: "[Get_newspaper_header]Людська революція в Гармонійному Союзі"
 OMO_aprilfools_news.5.desc: "Схоже, доба Гармонії добігла кінця. Алєксандр Мєнь, відомий російський проповідник і давній гуманітарний діяч, захопив владу в Гармонійному Союзі.\n\nХоч становище людей у Союзі дещо поліпшилося, поні дедалі більше опиняються на узбіччі суспільства й зазнають нападів. Поніфікацію та кристали вже повністю заборонили, а більшість північних копалень закрили. Поні, що лишилися, з розпачем дивляться, як їх позбавляють прав і більше не визнають законними громадянами Далекого Сходу. Аналітики побоюються кризи біженців у Японії та Канаді, адже поні шукатимуть будь-якої нагоди вирватися з цього людиноцентричного кошмару."
 OMO_aprilfools_news.5.a: "Людина поні вовк."
 
 OMO_aprilfools_news.6.t: "[Get_newspaper_header]Гармонійний Союз отримав ядерну зброю"
 OMO_aprilfools_news.6.desc: "Сейсмологи на Алясці зафіксували значну аномалію на Далекому Сході російської анархії. Подальші дослідження показали, що так званий Гармонійний Союз успішно створив ядерну бомбу, потужність вибуху якої значно перевищує все, на що здатні три наддержави. Так звану "кристалічну магію" використали для посилення бомби до нечуваного рівня.\n\nУ комюніке Гармонійний уряд пообіцяв ніколи не застосовувати цю зброю проти ворога. Однак світ уперше об'єднався... в безмежному страхові й жахові перед державою, що постала з російської анархії."
 OMO_aprilfools_news.6.a: "О ні."
 
 ### Project Ferus
 OMO_project_ferus.0.t: "Equus Ferus Caballus"
 OMO_project_ferus.0.desc: "Ви наближаєтеся до воріт якоїсь установи, що стоять у високому сітчастому паркані, який тягнеться так далеко, як сягає око. Вартовому біля воріт вистачило одного погляду, щоб подати сигнал відчиняти. Водій заводить автівку всередину.\n\nПосеред комплексу стоїть бункер. Водій зупинив автівку перед входом, який охороняють іще двоє солдатів. Коли ви виходите, вони віддають вам честь. Один відчиняє двері, й ви заходите до будівлі.\n\nДвері за вами зачиняються, світло ззовні зникає, і кімната тьмяніє. Ви не бачите нічого, крім ліфта, який чекає на вас. Ви входите, натискаєте кілька кнопок, і двері зачиняються. У ліфті досі непроглядна темрява. Ви міркуєте, куди поділися всі кляті гроші, влиті в цей проєкт, якщо вони не спромоглися навіть установити світло в цій довбаній коробці.\n\nЛіфт зупиняється, двері відчиняються. Кімната попереду, що не дивно, теж не освітлена, крім тьмяного сяйва із самого центру. Ви наближаєтеся в темряві до джерела світла. Перед вами стоїть те, що науковці називають "ігровим комп'ютером". Ця техніка на десятиліття випереджає 60-ті, але Проєкт якимось чином її роздобув.\n\nНа клавіятурі, що сяє всіма кольорами веселки, "RGB-клавіятурі", як її називають хлопці, ви набираєте такі слова:\n\n"PinkiePieIsBestPony1913"\n\nМашина з гудінням оживає, з неї виривається синтетичний голос і промовляє:"
 OMO_project_ferus.0.a: ""Ласкаво просимо до Проєкту Ferus, президенте Ніксоне.""
 OMO_project_ferus.0.a.tt: "§BЗаписи §CПроєкту Ferus§! тепер можна переглянути в нижньому правому куті.§!"
 
 OMO_project_ferus_generic_title: "Новий запис у Проєкті"
 OMO_project_ferus_generic_description: "Один із наших працівників Проєкту Ferus у комплексі Ґрей-Гіллз подав новий авдіозапис до головного архіву Проєкту. Його об'єднано з іншими записами у вашій особистій базі даних, і тепер він готовий до перегляду."
 OMO_project_ferus_generic_option: "Погляньмо, гаразд?"
 OMO_project_ferus_generic_option_tt: "§BПеревірте інтерфейс §CПроєкту Ferus§!.§!"
 
 ### Ideas and Dynmods
 # Warlord
 OMO_2022_crystal_buffs: "Використання понячих кристалів"
 OMO_2022_crystal_buffs_desc: "Таємниця як поніфікації, так і інфраструктури нашого гармонійного суспільства криється в §Cмагічних кристалах§!, що залягають під землею далекої півночі. Уміло керуючи їхньою §Cмагією§!, ми перетворимо Гармонійний Союз на заздрість усього світу."
 
 OMO_2022_harmony_words: "Шлях до Гармонії"
 OMO_2022_harmony_words_desc: "З півночі долинають чутки про величне суспільство, вільне від нужди й поневірянь та сповнене товариства й дружби. Ці солодкі слова починають знаходити відгук серед нашого населення, тож ми маємо пильнувати, аби вони не поширилися надто далеко."
 
 OMO_2022_an_interspecies_army: "Міжвидова армія"
 OMO_2022_an_interspecies_army_desc: "Армія Гармонії складається не з одного народу, а з багатьох. Земні поні, єдинороги, пегаси й люди разом наповнюють лави Рожевої Армії, спільно доповнюючи особливі здібності одне одного. Міжвидова армія має свої виразні труднощі, але завдяки їм ми лише сильніші."
 
 OMO_2022_pony_far_east_army: "Гармонія на Далекому Сході"
 OMO_2022_pony_far_east_army_desc: "Рожева Армія крокує вперед, несучи §CГармонію§! Далекому Сходу! Деспоти, фашисти й тирани, стережіться: пригноблені маси скидають свої кайдани завдяки дружбі й товариству!"
 OMO_2022_pony_far_east_army_tt: "§RЦей національний дух буде усунуто після перемоги над нашими ворогами на Далекому Сході.§!"
 
 OMO_2022_portal_research_bureau: "Бюро дослідження порталів"
 OMO_2022_portal_research_bureau_desc: "Бюро дослідження порталів засновано для вивчення досі невідомої властивости магічних кристалів. Якщо нам удасться розкрити таємниці порталів, ми зможемо спрямувати Гармонійний Союз у майбутнє."
 
 OMO_2022_portal_research_bureau_2: "Бюро дослідження порталів" 
 OMO_2022_portal_research_bureau_2_desc: "Бюро дослідження порталів засновано для вивчення досі невідомої властивости магічних кристалів. Якщо нам удасться розкрити таємниці порталів, ми зможемо спрямувати Гармонійний Союз у майбутнє."
 
 OMO_2022_an_infant_ideology: "Ідеологія в пелюшках"
 OMO_2022_an_infant_ideology_desc: "Гармонійний комунізм є чимось цілковито новим. Це суміш марксистської догми та золотого правила, а точний зміст самої гармонії ще належить визначити. Лише час покаже, на що може перетворитися ця нестабільна ідеологія."
 OMO_2022_an_infant_ideology_2: "Ідеологія в пелюшках"
 OMO_2022_an_infant_ideology_2_desc: "Гармонійний комунізм є чимось цілковито новим. Це суміш марксистської догми та золотого правила, а точний зміст самої гармонії ще належить визначити. Лише час покаже, на що може перетворитися ця нестабільна ідеологія."
 OMO_2022_an_infant_ideology_3: "Ідеологія в пелюшках"
 OMO_2022_an_infant_ideology_3_desc: "Гармонійний комунізм є чимось цілковито новим. Це суміш марксистської догми та золотого правила, а точний зміст самої гармонії ще належить визначити. Лише час покаже, на що може перетворитися ця нестабільна ідеологія."
 
 OMO_2022_first_pony_congress_of_harmonious_union: "Перший Всепонійний Конґрес Гармонійного Союзу"
 OMO_2022_first_pony_congress_of_harmonious_union_desc: "Всепонійний Конґрес є головним керівним органом Гармонійного Союзу. Конгрес, що складається з Верховного Совєту та Президії, скликано, аби повести Союз у гармонійне майбутнє."
 OMO_2022_first_pony_congress_of_harmonious_union_2: "Перший Всепонійний Конґрес Гармонійного Союзу"
 OMO_2022_first_pony_congress_of_harmonious_union_2_desc: "Всепонійний Конґрес є головним керівним органом Гармонійного Союзу. Конгрес, що складається з Верховного Совєту та Президії, скликано, аби повести Союз у гармонійне майбутнє."
 OMO_2022_first_pony_congress_of_harmonious_union_3: "Перший Всепонійний Конґрес Гармонійного Союзу"
 OMO_2022_first_pony_congress_of_harmonious_union_3_desc: "Всепонійний Конґрес є головним керівним органом Гармонійного Союзу. Конгрес, що складається з Верховного Совєту та Президії, скликано, аби повести Союз у гармонійне майбутнє."
 
 OMO_2022_a_harmonious_society: "Гармонійне суспільство"
 OMO_2022_a_harmonious_society_desc: "Наше суспільство складається з двох народів: поні та людей. Лише об'єднавши зусилля обох народів, ми зможемо втілити істинні засади гармонії, що лежать в основі нашого великого експерименту: Дружба - це диво."
 OMO_2022_a_harmonious_society_2: "Гармонійне суспільство"
 OMO_2022_a_harmonious_society_2_desc: "Наше суспільство складається з двох народів: поні та людей. Лише об'єднавши зусилля обох народів, ми зможемо втілити істинні засади гармонії, що лежать в основі нашого великого експерименту: Дружба - це диво."
 
 OMO_2022_parasprite_famine: "Параспрайтовий голод"
 OMO_2022_parasprite_famine_desc: "Лихо! Дивний вид комах тероризує сільські землі Далекого Сходу й пожирає той мізерний урожай, який спромоглися зібрати наші селяни. Якщо ми не зупинимо цих \"параспрайтів\" і не врятуємо селянські господарства від знищення, наш народ голодуватиме."
 OMO_2022_parasprite_famine_2: "Параспрайтовий голод"
 OMO_2022_parasprite_famine_2_desc: "Лихо! Дивний вид комах тероризує сільські землі Далекого Сходу й пожирає той мізерний урожай, який спромоглися зібрати наші селяни. Якщо ми не зупинимо цих \"параспрайтів\" і не врятуємо селянські господарства від знищення, наш народ голодуватиме."
 OMO_2022_parasprite_famine_3: "Параспрайтовий голод"
