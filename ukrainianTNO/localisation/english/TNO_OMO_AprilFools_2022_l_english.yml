 # Project Feniks
 OMO_2022_crystals_nuke: "=== Проєкт §OФЕНІКС§! ==="
 OMO_2022_crystals_nuke_desc: "У цю добу наддержави визначаються вже не лише могутністю армії чи розміром економіки. Ні, наддержаву визначає доступ до зброї масового знищення, завдяки якій ніхто не насмілиться кинути їй виклик.\n\nЯкщо ми хочемо змагатися з іншими світовими потугами, то, на жаль, мусимо розробити власну таку зброю. Заради Гармонії ми щиро сподіваємося, що нам ніколи не доведеться її застосувати."
 
 OMO_2022_crystals_nuke_the_test: "Підготуватися до §eвипробування§!"
 OMO_2022_crystals_nuke_the_test_tt: "§YСхрестімо копита...§! стоп, ні, так не вийде."
 
 OMO_2022_crystals_nuke_assembly: "Почати остаточне складання зброї"
 
