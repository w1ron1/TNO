 ### ANDREW FAROS ###

 OMO_2022_ferus_transcription_title.1: "Капітан Фарос №1 - Що це, в біса, за місце?"
 OMO_2022_ferus_transcription_desc.1: "§YКап. Ендрю Фарос§!\nГаразд, е-е... ця штука працює? Добре. Гаразд. Гаразд. Мене звати капітан Ендрю Фарос. Сьогодні 3 березня 19-\n\n§Y(ВИЛУЧЕНО)§!\nВам не можна називати дату.\n\n§YКап. Ендрю Фарос§!\nСхоже, мені не можна називати дату... Що? Дурня якась, хто взагалі це слухатиме? Гаразд. Нехай. Сьогодні точно НЕ 3 березня, м-мені байдуже. Це перший день того, що тут, схоже, називають §Cпроєктом Ferus§!, хоч би що це означало. Мені не платять за те, щоб я з'ясовував, що відбувається, для цього тут яйцеголові. Мене щойно призначили начальником охорони §Lкомплексу Ґрей-Гіллз§! і наказали чомусь вести аудіожурнал. Гадки не маю навіщо.\n\nЯкщо чесно, я навіть не знаю, що ми тут робимо. Бачив, як якісь яйцеголові тягали щось на кшталт... російського коня?\n\n§Y(ВИЛУЧЕНО)§!\nЦе поні, сер.\n\n§YКап. Ендрю Фарос§!\nП-поні?\n\n§Y(ВИЛУЧЕНО)§!\nТак, сер, росіяни... перетворюються на поні.\n\n§YКап. Ендрю Фарос§!\nВони роблять ЩО?!\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 OMO_2022_ferus_transcription_title.2: "Капітан Фарос №2 - Мені дуже, дуже треба підвищити зарплату."
 OMO_2022_ferus_transcription_desc.2: "§YКап. Ендрю Фарос§!\nЖурнал безпеки §Cпроєкту Ferus§!, день 97-й... здається. Доповідає капітан Фарос. Кілька хвилин тому на підрівні 17 оголосили тривогу через порушення умов утримання. Схоже, там унизу щось... вирвалося. Охорону бази §LҐрей-Гіллз§! мобілізовано, формується оперативна група для-\n\n§B<<Звукові перешкоди між §Y00:20§! та §Y00:25§!, опис: звук "іскорок">>§!\n\n§YКап. Ендрю Фарос§!\nЩо за чорт...?\n\n§B<<Звукові перешкоди на §Y00:26§!, опис: звук "ляскання">>§!\n\n§YНевідома - голос, схожий на дитячий§!\nОй, де я? Це вихід?\n\n§YКап. Ендрю Фарос§!\nГей! Стояти на місці!\n\n§YНевідома§!\nА-а! Чудовисько!\n\n§YКап. Ендрю Фарос§!\nЯ-я не чудовисько, я-\n\n§YНевідома§!\nНе підходь до мене!\n\n§B<<Звукові перешкоди між §Y00:41§! та §Y00:48§!, опис: п'ять уже чутних раніше "іскорок", після яких лунають удари металевих предметів; судячи з реакції капітана Фароса, їх кидають у нього>>§!\n\n§YКап. Ендрю Фарос§!\nЩ- Стривай, гей- чекай, чекай, чекай- припини, припини, припини!\n\n§YНевідома§!\n§B<Чути плач>§!\n\n§YКап. Ендрю Фарос§!\nЩо відбувається?!\n\n§YНевідома§!\nЯ не хочу назад!\n\n§YКап. Ендрю Фарос§!\nЩо?!\n\n§YНевідома§!\nВони такі злі! Я думала, вони стануть моїми друзями, а вони не стали!\n\n§YКап. Ендрю Фарос§!\nЯ... не буду цим займатися.\n\n§B<<Звукові перешкоди між §Y01:07§! та §Y01:12§!, опис: постріл із тазера в суб'єкта, позначеного в журналі як §Y"Невідома"§!>>§!\n\n§YКап. Ендрю Фарос§!\n...Боже, мені треба підвищити зарплату.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 OMO_2022_ferus_transcription_title.3: "Капітан Фарос №3 - Бачите? Цей хлопець усе розуміє."
 OMO_2022_ferus_transcription_desc.3: "§YКап. Ендрю Фарос§!\nЖурнал безпеки, якийсь там день §Cпроєкту Ferus§!. Мені... вже байдуже. Хлопці загнали в кут якогось агента Кемпейтай, що нишпорив комплексом, і затримали його. Формально це допит, а неформально мені байдуже.\n\n§YАгент Кемпейтай§!\n§B(Приблизний переклад із японської):§! §LЯ не знаю, що тут відбувається. Де я, бляха, опинився? Що коїться, я нічого не розумію, якого біса.§!\n\n§YКап. Ендрю Фарос§!\nАга, друже, я, е-е, не знаю японської, тому попрошу тебе замовкнути-\n\n§YАгент Кемпейтай§!\n§LТа що ви взагалі тут робите, що це за божевільна наука, тут ПОНІ?!§!\n\n§YКап. Ендрю Фарос§!\nАга... поні.\n\n§YАгент Кемпейтай§!\n§B(Англійською):§! Поні... говорять.\n\n§YКап. Ендрю Фарос§!\nЯ знаю.\n\n§YАгент Кемпейтай§!\n§LЧому?§!\n\n§YКап. Ендрю Фарос§!\nХотів би я тобі сказати.\n\n§YАгент Кемпейтай§!\n§B(Неперекладна японська лайка)§!\n\n§YКап. Ендрю Фарос§!\nАга, звучить доречно. Виговорися, друже.\n\n§YАгент Кемпейтай§!\nУряд Америка... божевільний.\n\n§YКап. Ендрю Фарос§!\nІ не кажи.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 OMO_2022_ferus_transcription_title.4: "Капітан Фарос №4 - БЕЗ НАЗВИ. КАПІТАН ФАРОС БУВ НЕДОСТУПНИЙ."
 OMO_2022_ferus_transcription_desc.4: "§YКап. Ендрю Фарос§!\nДоповідає капітан Фарос, сьогодні... 6 серпня 65-го. Збрехав би, якби сказав, що точно знаю, що відбувається, але останній тиждень я чергував у вестибюлі. Зазвичай просто зустрічаєш людей, записуєш імена, професії, те-се, але останні кілька днів усе трохи інакше. Розумієте, яйцеголові вже не просто ходять туди-сюди й балакають про сеанси психотерапії, усе стало серйозно. Дуже серйозно. Настільки серйозно, що дехто перестав з'являтися. Я не натякаю, що вони там накладають на себе руки чи щось таке, але все одно починаю непокоїтися. Підслухав розмову кількох із них, вони згадували якусь "ЗМТ" чи щось таке. Якщо це щось на кшталт "ЗМЗ", а люди просто перестають з'являтися, то я не знаю, чого чекати.\n\n§B<<Примітка до аудіо: у голосі капітана Фароса чути дедалі сильнішу тривогу>>§!\n\nЯ поговорив із хлопцями, Вейном, Тексом, Барні та іншими. Розповів, що чув і що, на мою думку, може статися. Схоже, вони налякані не менше за мене. Події не сповільнюються, навпаки, усе, здається, лише пришвидшується. Під час однієї з перерв Генк §B(Гарк?)§! сказав мені, що вся ця справа робить його параноїком, майже таким самим, як я.\n\nНе пам'ятаю, скільки минуло відтоді, як я востаннє його бачив. Він говорив щось про протидію... перетворенням. Сталося якесь "випадкове зараження", і відтоді від нього ні слуху ні духу. Я переглянув реєстраційні списки, "службова справа охорони". Його ім'я звідти прибрали, і його не було вже... близько тижня. Я вже не розумію, що відбувається. Піду спитаю начальника комплексу, що це все означає, а потім поговорю з докторкою Стензленд і-\n\n§B<<Звукові перешкоди між §Y02:03§! та §Y02:06§!, опис: удари по склу, після яких скло розбивається>>§!\n\n§YКап. Ендрю Фарос§!\nГосподи Ісусе-\n\n§B<<Звукові перешкоди на §Y02:07§!, опис: §eГУЧНИЙ ВИБУХ§!>>§!\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 OMO_2022_ferus_transcription_title.5: "Д-р Керол Стензленд: щодо капітана Ендрю Фароса"
 OMO_2022_ferus_transcription_desc.5: "§YД-р Керол Стензленд§!\nЗапис №5, говорить докторка Керол Стензленд, 8 серпня 1965 року, 17:07. Зі мною... колишній капітан Ендрю Фарос. Вітаю, сер. Як ви?\n\n§YКап. Ендрю Фарос§!\nЯ... я не дуже знаю. Не знаю. Я вже навіть не розумію, що відбувається. А ви- ви розумієте! Ви знаєте, що тут коїться! Знаєте, що тут відбувається! Якби Гарк не був, бляха, мертвий, він би-\n\n§YД-р Керол Стензленд§!\nДоктор Річард Гарк не помер, він нещодавно вийшов із карантину. Наскільки я розумію, він просто- там.\n\n§YКап. Ендрю Фарос§!\n...Він живий? Не- такий, як я?\n\n§YД-р Стензленд§!\nТак, правильно, він прийшов сюди просто з карантину й, схо-\n\n§YКап. Ендрю Фарос§!\nМожна з ним поговорити?\n\n§YД-р Керол Стензленд§!\n...Ні. Перед цим він поговорив зі мною й сказав, що сподівається, що вам добре. Він вдячний, що ви живі, як і я, це-\n\n§YКап. Ендрю Фарос§!\nЯ б заперечив, мене навряд чи можна назвати справді, справді- <зітхання> забудьте. Послухайте, я просто вже не знаю напевне, що тепер тут роблю. Я бачив, що ця штука робить із людьми. "Людьми". Я знаю, що буде. Не хочу, щоб це сталося, але я не-\n\nЯ знаю, що буде. Я говорив із декотрими з них, розумієте? Не на службі, знаю, що не мав права, але вони здаються щасливими. Майже вдоволеними, ніби єдина їхня проблема в житті - те, що вони тут. Здається, я це розумію. Я втомився. Усе, що я робив тут... я майже готовий, але... просто хочу час від часу говорити з кимось із вас. Можна... Можна?\n\n§YД-р Керол Стензленд§!\nЗа останнім протоколом, щоб звикнути до цього становища, передбачено один-два тижні психотерапії. Після цього дозволено відвідини друзів і родини.\n\n§YКап. Ендрю Фарос§!\nЦе... це добре. Думаю, мені б це дуже сподобалося.\n\nЗдається, я готовий стати щасливим.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 ### RICHARD HARK ###

 OMO_2022_ferus_transcription_title.6: "Д-р Річард Гарк №1 - За це я потраплю до пекла"
 OMO_2022_ferus_transcription_desc.6: "§YД-р Річард Гарк§!\nАлло? Ця штука працює? Так, е-е. Мене звати доктор Річард Гарк. Наразі я обіймаю посаду провідного фізика-ядерника в комплексі §LҐрей-Гіллз§!, округ Кайт, штат Міннесота, Сполучені Штати. Америки. Я розумію, що це не можна передавати в ефір, але якщо не говоритиму до чогось, урешті заговорю з кимось. Не те щоб таке- не те щоб це могло статися, коли вся ця охорона не дає нам покинути цей довбаний бункер.\n\nВони...\n\nВони привезли зразок лошати? Лоша... лоша. Схоже, із затримкою росту, зміною кольору шкіри, проптозом і...\n\nВоно заговорило зі мною. Воно, бляха, заговорило зі мною. Подивилося на мене своїми довбаними виряченими очима й сказало: "Привіт". Не знаю, скільки я там простояв. На одну кляту мить подумав, що це жарт. Що хтось мене розігрує. Але, схоже, ні, хіба сам Бог вирішив пожартувати з мене, бо це чули й усі інші. Ми... ми його приспали. За моїм наказом. Я взагалі не знаю, що про це думати. Після евтаназії охорона перевезла його до біологічного відділу, а мене відтоді тримають у невіданні. Чекаю їхнього звіту, коли вони бодай приблизно збагнуть, як саме воно працювало. Як ті довбані очі не провалювалися всередину... <зітхання> Наскільки я розумію, нервову систему повністю досліджуватимуть від кількох місяців до року-двох, а тоді ми перейдемо до подальших досліджень і сховаємо все це кудись подалі. Дуже глибоко. А доти писатимемо про цю штуку звіти, поки не скінчиться папір, після чого, певен, почнемо писати на стінах.\n\nЯ-я міг лишити його живим. Міг. Якби ця істота була розумною, ми могли б щось у неї спитати, будь-що. Звідки вона, як з'явилася, чи бодай сама це знає. Істота явно контролювала основні й навіть усі рухові функції, яких коні зазвичай не мають чи не повинні мати. Очевидно. Але що б я міг зробити? Вона лише розповіла б те, що ми вже дізналися від груп постачання, якби охорона не відрізала нас- курва! Чорт забирай. Ні, ні, мене б зупинили: охорона, адміністрація чи... хтось. Ця істота мала звідкись узятися. Не знаю. У неї був чужоземний акцент. Не німецький, точно не японський, голос був дівочий, а акцент точно російський. Раніше такого не чув, але навіть тоді він здавався дивним. Висота голосу, усе було якесь перекручене, ніби- не знаю. Якби це не був кінь, можна було б подумати, що це людина, якщо ви розумієте, і я, бляха, її вбив. Ми отруїли її ціанідом, а бідолашна довбана істота дивилася на мене й скиглила. Я клятий убивця. Боже- ця істота- усе це суперечить усьому, чого я навчав- чого мене вчили. Це маячня. Це довбане божевілля. Я клятий убивця й навіть не знаю, що саме вбив. Сподіваюся лише, що ця істота- ні, ні, про це не можна думати. Господи.\n\nІ я маю написати про це довбаний звіт! Ніксону! Що я маю сказати? "Вітаю, пане президенте, коні тепер говорять, дякую за бюджет у $400,000,000"?! Це довбане божевілля. Певно, я збожеволів. Знаєте що? Гаразд. У мене дах поїхав, не всі карти в колоді. Але я знаю, що бачив. Я не збираюся- я або вийду від психотерапевта з рецептом на якісь пігулки, або ридатиму над смертю здорового глузду на зеленій Божій землі. Мене посадили сюди заради одного й тільки одного: осмислювати все, що Бог витягає зі своєї задньої кишені. Та щодо цього... я не певен, що тут доклав руку Бог.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.7: "Д-р Річард Гарк №2 - Усе це неправильно"
 OMO_2022_ferus_transcription_desc.7: "§YД-р Річард Гарк§!\nГоворить доктор Річард Гарк, провідний фізик-ядерник комплексу §LҐрей-Гіллз§!. Сьогодні четвер, 13 лютого. День перед святом Валентина. Я записую це повідомлення, тому що- Господи.\n\nМи, е-е, отримали ще один зразок.\n\nЯк і попередній, ця істота була чотириногою, близько чотирьох футів заввишки та вагою двісті п'ятдесят фунтів. Хоч інші науковці, зокрема я, почали називати цих істот "лошатами", очевидно, що цей термін неточний або принаймні оманливий. Істоти лише віддалено нагадують відомі види коней. Очі займають близько двох третин голови. Ноги, якщо їх можна так назвати, є безформними стеблами без м'язів і копит. За відсутності шерсті... плоть утворює єдину гладеньку поверхню. Найчастіше яскравого пастельно-червоного кольору.\n\nІ, як засвідчують інші записи, вони говорять. Російською. Це підтвердили зовнішні фахівці, хоча від самого початку все й так було очевидно.\n\nПерекладача дістали... не знаю звідки. Гадаю, з Управління. Допит відбувався за стандартною процедурою: хто ти? Як тебе звати? Чого ти хочеш? І так далі.\n\nІстота... Істота усно повідомила, що її звати Ілля. Вік 22 роки. Він стверджував, що є громадянином, е-е... Горсграда, що, як я припускаю, є якоюсь помилкою перекладу. До колишнього Радянського Союзу прибув через якийсь портал. Мабуть, як у мультфільмах Looney Tunes.\n\nУсе пішло не так... коли ми спитали, навіщо він тут і яка його мета.\n\nІстота... повідомила, що хотіла втекти з дому. Сказала, що там небезпечно. Коли ми спитали чому, істота уточнила: тому що на іншому боці була §EВона§!, а якісь богоподібні створіння "зникли", і за їхньої відсутности §EВона§! захопила владу. Спроби дізнатися більше призвели до... Боже. Воно заплакало. Не знаю як- не зміг би це пояснити інакше, ніж сказавши, що з його очей полилися великі, густі сльози. Він повторював, що §EВона§! захопила владу. Повторював, що §EВона§! спробує знайти шлях сюди.\n\nДопит довелося достроково припинити, бо зразок, я та кілька інших працівників утратили емоційну стійкість. Продовжимо пізніше.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.8: "Д-р Річард Гарк №3 - Сьогодні я не матиму справи з демонічними сутностями"
 OMO_2022_ferus_transcription_desc.8: "§YД-р Річард Гарк§!\nРічард Гарк. 20 лютого. Після тижневої перерви ми поновили спроби спілкування з істотами, тепер уже в множині. Схоже, ми отримали новий зразок із російського Далекого Сходу. Згідно з ретельно відредагованими звітами, зразок знайшли біля того, що через брак кращого терміна ми називаємо "порталом". У звіті також зазначено, що було знайдено кристал невідомого походження, який, гадаю, досліджує окрема група.\n\nАле я відволікся. Сьогодні ми мали довідатися більше про дім зразків та джерело їхнього страху й тривоги.\n\n§B<<Довга пауза.>>§!\n\nВони називають її Регенткою. Це кобила неймовірної сили, колишня служниця двох богинь-королев, відомих як "Луна" й "Селестія". Після зникнення обох королев унаслідок невідомого катаклізму §EРегентка§! захопила владу, і це... змінило її. Спотворило. Вона намагається знайти їх... за будь-яку ціну. У пошуках вона розірвала світ зразків на шматки.\n\nЯ усвідомлюю всю абсурдність цієї історії, але страх, із яким зразки її переповідали, здавався справжнім. Вони знову заплакали своїми величезними очима й стали... украй збудженими, коли перекладач повідомив, що ми отримали кристал. Вони без кінця повторювали, цитую: "Вона знайде шлях сюди", кінець цитати. Лише це й повторювали.\n\nНе знаю, наскільки сильно мені слід через це непокоїтися.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.9: "Д-р Річард Гарк №4 - Щодо §E"Регентки"§!"
 OMO_2022_ferus_transcription_desc.9: "§YД-р Річард Гарк§!\nНе думаю, що той, хто це слухає, колись приносив роботу додому? Ні? Ну, гаразд.\n\nСьогодні... 7 березня, хоча, може, досі 6-те. Я сиджу сам у лабораторії після пізнього вечора з дружиною. Ми ходили в кіно. На якийсь фільм з Елвісом. Не знаю.\n\nЯ був із дружиною. Був у кінотеатрі. Мені знадобилося в туалет, тож я пішов. Тобто встав. Встав і в дзеркалі. У дзеркалі вбиральні...\n\nЯ побачив §EЇї§!. Побачив істоту, яку зразки називають §E"Регенткою".§! Не знаю, звідки знаю, що то була Вона, але знаю. Вона скидалася на інші зразки, тільки була темно-фіолетова, неприродного відтінку, а з її чола стирчав великий виріст. І... вона всміхалася. На обличчі застигла моторошна оскалена посмішка, ніби вона щойно щось... знайшла. Я стояв заціпенілий, не міг закричати, а тоді... вона почала тиснути... на... поверхню...\n\nНе знаю, як це описати. Дзеркало. Дзеркало. Дзеркало почало прогинатися. Наче вона пробивалася крізь нейлонову панчоху до вбиральні... до нашого світу. Мене врятував лише звук фільму за стіною. Пролунав постріл чи якийсь інший гучний звук і вирвав мене із заціпеніння. Я жбурнув у дзеркало смітник, і воно розлетілося на мільйон шматочків. Уся підлога виблискувала.\n\nМи поводилися з цими істотами... з їхніми порталами так, ніби перехід можливий лише в один бік. Але двері працюють не так. Вони пропускають в обидва боки. А що, як усе, що відбувається в Росії... усе, що робимо ми... тримає ці двері прочиненими? Що, як Вона стежить за нами й шукає шлях сюди?\n\nЩо тоді робити? Що нам робити, коли ця істота, якої так бояться всі наші зразки, прорветься сюди? Не знаю. Справді не знаю. Уранці треба поговорити з іншими працівниками. Переглянути наш підхід до цих істот. Сподіваюся, ми зможемо діяти трохи обережніше, перш ніж зробимо щось, про що пошкодуємо.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.10: "Д-р Річард Гарк №5"
 OMO_2022_ferus_transcription_desc.10: "...\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n§YД-р Річард Гарк§!\n§RПрезидент бачив її. У Білому домі.\n\nВона знає, де ми, і намагається проникнути сюди. Я... гадаю, зразки теж знають. Вони не припиняють плакати.§!\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.11: "Д-р Річард Гарк №6 - Зниклі діти"
 OMO_2022_ferus_transcription_desc.11: "§YД-р Річард Гарк§!\nСьогодні тридцять дітей зникли зі своїх ліжок у §LҐрей-Гіллз§!. Як пише місцева газета, їхні батьки чули хихотіння, а тоді... нічого.\n\nАле останні кілька днів тільки таке й відбувається. Зникнення. Люди телефонують на радіостанції та розповідають про "демона", який переслідує їх уві сні. Щось у небі.\n\nЛюди починають ставити запитання, і я не знаю, скільки ще ми зможемо їх уникати.\n\nТиша.\n\nЗразки... Ілля та його друзі... уже кілька днів не промовили ні слова. Нічого не допомагає. Вони просто дивляться на нас крізь вікно порожнім поглядом своїх величезних очей і дедалі більше марніють. Їхня плоть...\n\nБоже мій, що ми нако-\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.12: "Д-р Річард Гарк №7 - ????"
 OMO_2022_ferus_transcription_desc.12: "§BПримітка до розшифрування: протягом усього запису чути постріли, сигнали тривоги та магічні звукові артефакти.§!\n\n§YД-р Річард Гарк§!\nСлухайте. Якщо хтось... отримає... це повідомлення... перекажіть моїй дружині, що я її кохаю. Просто- просто скажіть їй-\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 OMO_2022_ferus_transcription_title.13: "Д-р Річард Гарк №8 - Мені шкода"
 OMO_2022_ferus_transcription_desc.13: "§YД-р Річард Гарк§!\nЦе доктор Річард, е-е, Гарк, я зараз у своєму кабінеті, стався якийсь прорив чи щось таке. Я, е-е... я не дуже добре почуваюся. Забарикадував двері, але зовні щось вибухнуло, і в мене, е-е... у нижній частині кишківника стирчить сталева труба. Я її ще не витягав. Усе, е-е, дуже погано. Здається, починається-\n\nУ роті присмак металу. Я почав запис приблизно... через 15 хвилин після блокування. Дотримуюся процедури, хоча в мене з грудей стирчить довбаний прут, але я роблю все, що можу. Я, е-е, не певен- думаю, в мене 10 хвилин? Зазвичай блокування триває близько пів години. Тому, е-е- мені, е-е, шкода. За все це, мені шкода, я-я-я не мав нічого цього робити. Треба було, бляха, звільнитися за першої ж нагоди, коли я-. Мені шкода. Шкода Ендрю, шкода Керрі, шкода того клятого росіянина, якого я... Мені шкода. Мені так, бляха, шкода.\n\n§B<<Звукові перешкоди між §Y0:59§! та §Y01:01§!, опис: удари у двері>>§!\n\nОт лайно- слухайте, мені шкода. За все. Я старався, але люди однаково загинули. Цього було замало. Передайте Норману, що мені шкода, скажіть- БЛЯХА.\n\n§B<<Звукові перешкоди на §Y01:10§!, опис: двері вибито>>§!\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 OMO_2022_ferus_transcription_title.14: "Д-р Річард Гарк №9 - Боже, не віриться, що все це правда"
 OMO_2022_ferus_transcription_desc.14: "§YД-р Річард Гарк§!\nГоворить доктор Гарк із §LҐрей-Гіллз§!. Курва. Гаразд. Після того невеликого спалаху та моєї власної зустрічі зі смертю й металевим прутом ми, завдяки передовій розвідці наших друзів, е-е, друзів у Маґадані, вже приблизно розуміємо, що відбувається. Наскільки ми розуміємо, приблизна хронологія така: по-перше, поні значно випередили нас у своїх дослідженнях, що загалом було очікувано, хоч і не в тому напрямку, який ми спершу припускали. Ідеться про міжвимірні переміщення та метафізичні дослідження. Це неймовірно захопливо, послухайте: поні вдалося не лише- не лише відкрити розрив у самій тканині простору-часу, а й вплинути на ділянки поза безпосередніми межами проходу. Зазвичай, щоб розкрити настільки велику, видиму щілину, потрібне буквально нескінченне джерело енергії. Звісно, наслідками зазвичай були б нескінченний витік, нескінченний вплив... нескінченні наслідки. Однак через унікальний стан джерела живлення, цих кристалів, їх, схоже, можна налаштувати на, е-е... щось, на нескінченне джерело енергії, або вони принаймні створюють подібний ефект чи здатні спрямувати щось ХОЧА Б ВІДДАЛЕНО порівнянне з ним у... щось.\n\nТільки Бог знає, що це означає на практиці. Можливо, саме так ці кристали взагалі *ПОТРАПИЛИ* до нашого виміру. Колись через таке лайно я ночами не спав, знаєте? А тепер кожна клята хвилина дня сповнена... можливостей. Можливостей дізнатися більше, можливостей здійснити прорив! Такого запалу я не відчував відтоді, як відкрив осциляцію ароматів! Утім. Боже, про що я- а, точно, гаразд.\n\nКоли будівництво порталу між всесвітами- радше вимірами, просунулося вперед, ми побачили, що ті- §EВона§! з іншого боку почала впливати на нашу реальність. Що далі вони просувалися, то ближче §EВона§! тягнулася до нас. Особливо до мене. Схоже, §EВона§! також дотягнулася до президента й, найімовірніше, до видатних членів понячого суспільства, а потім до всіх поні. Не знаю, як §EВона§! вчепилася в мене невдовзі після того, як живі зразки почали розповідати про §EНеї§!, мабуть, через поступове опромінення кристалами, що вже мене не здивувало б. Коли Вона зв'язалася з президентом, вони, певно, вже були до біса близько. А потім стався останній спалах, який трохи продірявив мені груди, і вся ця пригода досягла кульмінації. Відтоді, схоже, §EВона§! не пройшла крізь портал, інакше в нас були б значно більші проблеми. Думаю, вони або переналаштували його, або повністю вимкнули, бо поні з того виміру до нас досі потрапляють, але зразки кажуть, що тепер значно менше бояться §EЇї§!- от лайно, мало не забув про Ґреймейна, е-е, ҐрейМЕНА.\n\nОтже, ніби прізвище цього покидька й без того було недостатньо підозрілим, виявилося, що в тому всесвіті існував якийсь двійник Ґреймейна. Коли прибув Норман 2.0, він перетворився, але зберіг спогади первісного Нормана. Норман 2.0 перетворився, а нещодавно, наскільки я знаю, первісний Норман його приспав. Знову ж таки, це може означати, що портальний Норман був тим, кого ми вважаємо версією 1.0, а ми тут маємо справу з кораблем Тесея. Хто знає. Якщо це й важливо, мені вже байдуже. Хай там як, навіть якби я спробував у всьому розібратися, у мене немає всіх частин головоломки. Але будуть. Одного дня я все з'ясую. А поки працюватиму, доки це не станеться.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 OMO_2022_ferus_transcription_title.15: "Д-р Річард Гарк №10 - Відгуляймо кінець світу"
 OMO_2022_ferus_transcription_desc.15: "§YД-р Річард Гарк§!\nГоворить доктор Річард Гарк, провідний фізик-ядерник комплексу §LҐрей-Гіллз§!. Я-я знаю, що нам не можна називати дати, але цей запис у будь-якому разі буде приватним. Наразі 1 квітня 1972 року. Якщо пам'ять не зраджує, минуло трохи більше десяти років відтоді, як §Cпроєкт Ferus§! офіційно, е-е, неофіційно розпочався. На честь цього грандіозного досягнення в повільному занепаді людства та моєї нездатности його зупинити я планую влаштувати всім тут непоганий вечір. Отже, список гостей буде такий, одну секунду.\n\nТак, тут у нас я, Стензленд, Ґрей- Ґреймейн чи Ґреймен, я завжди, бляха, це плутав, Овенс, Армстронг, кілька хлопців із біологічного відділу, росіянин, якщо вдасться, і Фарос, якщо теж вдасться. Звісно, тут є два припущення: по-перше, що він захоче прийти, по-друге, що він не надто змінився. Сподіваюся, не настільки, щоб утратити свій довбаний к- цей чоловік уміє співати караоке, це найменше, що я можу вам сказати. Дай Боже, він досі вміє. Коротше, веду всіх до нового закладу відпочинку й розваг, на який ми нарешті отримали фінансування, принаймні востаннє, коли я перевіряв. Якщо все піде за планом, буде весело: лише ми й ніч, розумієте? Нам усім зараз не завадить трохи відволіктися. Визнаю, я вже трохи втомився від усього цього, якщо бути відвертим із ва- із собою, мабуть. Усі ці невдачі, довбані звіти, усі зміни й перешкоди, через які довелося пройти. Відверто кажучи, не думаю, що витримаю ще кілька років. Час, проведений тут, я ніколи не забуду, на краще це чи на гірше. Та, чесно кажучи, мені це потрібно. З деякими знайомими треба налагодити стосунки, це вже точно. Якщо подумати, я, здається, так і не помирився з Овенсом. Сподіваюся лише, що ще не пізно.\n\nЧасу в нас небагато. У нас як виду, тобто. Ці істоти поширюються й не зупиняться. Якщо ми не діятимемо зараз, то, найімовірніше, вже не матимемо нагоди, і, можливо... після того, що сталося з президентом. Ну. Може, я єдиний, хто так думає, але якщо так, то нехай. Тож, може, так навіть краще, якщо я не можу цього зупинити. Якщо нам гаплик, пропоную піти з гуркотом- не- гуркотом- не самогубство. Ні, це буде довбана шалена вечірка. Обіцяю. Після всього, що пішло не так, ми заслужили бодай одну справжню перемогу. Уранці так не здаватиметься, але зараз- я радий, що це роблю, знаєте. З огляду на все я досить оптиміс-\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 ### VASILY SOLOYOV

 OMO_2022_ferus_transcription_title.16: "Д-р Василь Соловйов №1 - Заради цього я приїхав до Америки?"
 OMO_2022_ferus_transcription_desc.16: "§YД-р Василь Соловйов§!\nАудіожурнал, день двадцять сьомий проєкту Ferus, говорить доктор Василь Соловйов. Я запи- ні. Ні, ні. Не можу- не можу говорити це із серйозним обличчям. Знаєте, я просто не можу!\n\n§Y(ВИЛУЧЕНО)§!\nДокторе Соловйов, це серйозно, украй серйозно! Ви маєте зрозуміти, що-\n\n§YД-р Василь Соловйов§!\nКлянусь гнилим стравоходом Лєніна, це НЕ серйозно... стривайте, що ви робите?\n\n§Y(ВИЛУЧЕНО)§!\nЗаписую. Це найвигадливіше прокляття, яке я чув за останнє десятиліття, а я працював у психіатричній лікарні.\n\n§YД-р Василь Соловйов§!\nЗа моїми висновками, ви, найімовірніше, були там пацієнтом! А я ще думав, що Лисєнко божевільний...\n\n§Y(ВИЛУЧЕНО)§!\nІ все-таки, докторе Соловйов, закликаю вас набратися терпіння. Цей проєкт має величезний потенціял, ми-\n\n§B<<Звукові перешкоди від §Y01:08§! до кінця запису, опис: щось схоже на шкрябання по плівці>>§!\n\n§Y(ВИЛУЧЕНО)§!\nЩо це за шум?\n\n§YД-р Василь Соловйов§!\nЗаписувач, мабуть, скінчилася плів-\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 OMO_2022_ferus_transcription_title.17: "Д-р Василь Соловйов №2 - Ці кристали дивні, дуже дивні"
 OMO_2022_ferus_transcription_desc.17: "§YД-р Василь Соловйов§!\nАудіожурнал, день вісімдесят третій проєкту Ferus. Уперше досліджено один із так званих "кристалів". Колір лазуровий, твердість невідома, без зовнішнього впливу випромінює слабке світло; його присутність чинить психотропний вплив на-\n\n§B<<Звукові перешкоди між §Y00:23§! та §Y00:28§!, опис: ЩО ЗА ХУЙНЯ>>§!\n\n§YД-р Василь Соловйов§!\nДоктор Гарк досі під впливом. Ефекти невідомі й непередбачувані, хоча більшість передбачає раптові сплески "позитивних" емоцій: радости, сміху, спокою. Аналіз повітря в кімнаті досліджень не виявив жодних слідів психотропних речовин.\n\n§B<<Звукові перешкоди між §Y00:52§! та §Y01:00§!, опис: так, так, це наймоторошніший довбаний сміх, який я коли-небудь чув>>§!\n\n§YД-р Василь Соловйов§!\nРічарде, припиніть, будь ласка. Клянусь обвислими вухами Бухаріна, я так і знав, що треба було лишатися в Маґнітоґорську... Кінець аудіозапису.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 ### CAROL STENZLAND ###

 OMO_2022_ferus_transcription_title.18: "Д-р Керол Стензленд №1 - Вони... люди"
 OMO_2022_ferus_transcription_desc.18: "§YД-р Керол Стензленд§!\nГоворить докторка Керол Стензленд, головна хірургиня комплексу §LҐрей-Гіллз§!. Зараз 00:43 за центральним стандартним часом, 8 січня 1963 року.\n\n§YД-р Стенфорд Гарріс§!\nТак, правильно, перепрошую.\n\n§YД-р Отто Еріксон§!\n...Гаразд. Гадаю, ми всі тут і перебуваємо при здоровому тілі й розумі. Наскільки я розумію, ми починаємо операцію на "унікальному зразку лошати". Група постачання відмовилася відповідати на запитання, тому ми фактично діятимемо наосліп. З огляду на дивну природу зразка наші висновки, найімовірніше, можна буде висловити лише в термінах відомих наук. Це незвідана царина, тож поставтеся з розумінням.\n\n§YД-р Керол Стензленд§!\nЧудово, з представленнями закінчили, почнімо. Докторе Еріксон, будьте ласкаві.\n\n§YД-р Отто Еріксон§!\nЗа товщиною шкіра приблизно відповідає більшості лошат. Сама шкіра значно гладша, крім гриви я не бачу жодної шерстинки. Вени здаються нор- ні, зачекайте, вони дивні... як для коня. Стривайте... Аортальний клапан трохи... не такий. Це, е-е...\n\n§YД-р Стенфорд Гарріс§!\nТак, ні, я розумію, що ви маєте на увазі. Для наших слухачів: я дивлюся на аортальний клапан, який з'єднує лівий шлуночок з аортою. Як у людини. У коней теж є подібний за функцією клапан, але цей виглядає надзвичайно... Стензленд, ви могли б-\n\n§YД-р Керол Стензленд§!\nУже. Це, гаразд, ні, це-\n\n§YД-р Отто Еріксон§!\nЙоб твою, це не-\n\n§YД-р Стенфорд Гарріс§!\nГосподи Ісусе! Це людське серце!\n\n§YД-р Керол Стензленд§!\nЩо це за довбана хуйня? Е-е- для протоколу, це докторка С- ДОКТОРКА СТЕНЗЛЕНД! Усі заспокойтеся, Господи!\n\n§YД-р Отто Еріксон§!\nГаразд, ні, це людські ребра, Ісусе, бляха. Гаразд- ні, це точно людські- це довбаний напис- ой, якого біса.\n\n§YД-р Стенфорд Гарріс§!\nО! О.\n\n§YД-р Керол Стензленд§!\nГаразд, гаразд. Це людська печінка, так?\n\n§YД-р Стенфорд Гарріс§!\nТак.\n\n§YД-р Керол Стензленд§!\nГаразд. Отто?\n\n§YД-р Отто Еріксон§!\nЩО?\n\n§YД-р Керол Стензленд§!\nГосподи, нічого. Нічого.\n\n§YД-р Стенфорд Гарріс§!\nНе знаю... як це краще сказати, Керол. Ситуація геть довбана. Передайте скальпель.\n\nПродовжуємо операцію, розтинаю передню праву ногу просто над копитом... От лайно, Отто?\n\n§YД-р Отто Еріксон§!\nТак, це великогомілкова кістка.\n\n§YД-р Стенфорд Гарріс§!\nГаразд. Думаю, час узяти двотижневу відпустку й усе обміркувати. Отто, підете зі мною?... Гаразд. Стензленд?\n\n§YД-р Керол Стензленд§!\nНі.\n\n§YД-р Стенфорд Гарріс§!\nГаразд, я вимикаю цю штуку, гадаю, хтось інший змо-\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 OMO_2022_ferus_transcription_title.19: "Д-р Керол Стензленд №2 - Дебати"
 OMO_2022_ferus_transcription_desc.19: "§YД-р Керол Стензленд§!\nПочинаємо перший запис дебатів. Схоже, уряд Сполучених Штатів нарешті визначив, якою мірою можна оприлюднити проєкт Ferus та як за цих обставин звертатися до громадськости. Хтось хоче почати?\n\n§YД-р Ґаррет Овенс і д-р Річард Гарк§!\nТак.\n\n§YД-р Керол Стензленд§!\nНу звісно, щоб мене. Тоді почнімо з прихильників. Це ви, Овенсе, ваші аргументи?\n\n§YД-р Ґаррет Овенс§!\nНам потрібні ресурси. Зараз ми надриваємося, намагаючись тримати все це в таємниці, тоді як державні установи, які нічого не знають, не можуть нам допомогти. Наша мета - захистити світ від цих явищ, стримати їх у межах Росії та вберегти людей від перетворення на цих істот. Нашим пріоритетом завжди була безпека, а не таємність.\n\n§YД-р Керол Стензленд§!\nДокторе Гарк?\n\n§YД-р Річард Гарк§!\nВизнаю, ресурси нам потрібні, але потрібна й таємність. Ви уявляєте, що станеться, якщо громадськість довідається? Просто на мить уявіть. Орди туристів вирушать до Росії, хочемо ми цього чи ні, а поні зустрінуть їх із розпростертими обіймами! Спалахи будуть усюди, а чорний ринок стане таким, якого ми й уявити не могли-\n\n§YД-р Ґаррет Овенс§!\nВін уже є! У нас уже є звіти ЦКЗ про поодинокі спалахи, ми вже викрили три банди торговців кристалами! Три! Хочемо ми цього чи ні, стає лише гірше, і нам потрібні звичайні сили безпеки та правоохоронці, інакше ми не впораємося!\n\n§YД-р Річард Гарк§!\nВи знаєте, скільки релігій довбані поні от-от спростують?!\n\n§YД-р Ґаррет Овенс§!\nОй, годі, церква пристосується. Вони просто-\n\n§YД-р Річард Гарк§!\nПішов ти.\n\n§B<<Звукові перешкоди між §Y01:28§! та §Y01:38§!, опис: тупіт, після якого грюкають двері>>§!\n\n§YД-р Керол Стензленд§!\nГаразд, здається, рішення ухвалено. Зв'яжемося з Державним департаментом і подумаємо, як усе оприлюднити. Сподіваюся, устигнемо до японців або німців.\n\n§YД-р Ґаррет Овенс§!\nШматок лайна.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.41: "Д-р Керол Стензленд №3 - Історичні розбіжності"
 OMO_2022_ferus_transcription_desc.41: "§YД-р Керол Стензленд§!\nМені байдуже, можете сказати Джонсону, хай сяде й крутиться на одноколісному велосипеді без сидіння, наче найсумніше й найсіріше у світі Катеринине колесо. Знаєте, що я чотири роки вивчала в Гарварді? Квантову механіку. А не довбаний догляд за поні. Якщо вам це потрібно, звільніть мене й найміть мою сестру.\n\nЗнає президента? Джонсон знає президента так само, як Кларк із біологічного відділу знає, як задовольнити жінку, з якою не має біологічної споріднености. Господи.\n\nСьогодні 8 листопада 1966 року, час... 8:09. Говорить докторка Керол Стензленд із метафізичного відділу. Зі мною-\n\n§YД-р Річард Гарк§!\nРічард Гарк. Доктор Річард Гарк. Співкерівник метафізичного відділу. Відповідно до протоколів BLACKBUCK буде зроблено запис нашого метааналізу останніх інтерв'ю з... перетвореними особами.\n\n§YД-р Керол Стензленд§!\nТак. Дякую, докторе Гарк. Як я й казала... так. Ми розглядаємо останні інтерв'ю з особами, які зазнали "поніфікації". (пошепки) Господи Ісусе, не віриться, що я це сказала.\n\n§YД-р Річард Гарк§!\nТак, і команда крила аналізу даних виявила розбіжність між інтерв'ю капітана Фароса та суб'єкта D-03. В інтерв'ю Фароса сказано: "Тоді потрапити туди було майже неможливо-"\n\n§YД-р Керол Стензленд§!\nЩо ви робите?\n\n§YД-р Річард Гарк§!\nЯ... е-е... наслідую Ф-Фароса?\n\n§YД-р Керол Стензленд§!\nТак... навіщо?\n\n§YД-р Річард Гарк§!\nЩоб відчути атмосферу, знаєте? І хіба це не дивно?\n\n§YД-р Керол Стензленд§!\nТак, дивно. Припиніть, будь ла-\n\n§YД-р Річард Гарк§!\nНі, ні, я про його опис війни. Наслідував я блискуче. Отже, в інтерв'ю він згадує, як у п'ятдесятих воював разом із росіянами, намагаючись відвоювати їхню землю. Також пам'ятає, як ми взяли Іводзіму, перш ніж японський флот розгромив нас і замкнув на острові. І як 1962 року їздив у відпустку на іберійське узбережжя Барселони.\n\n§YД-р Керол Стензленд§!\nІ що?\n\n§YД-р Річард Гарк§!\nТа Івани ніколи цього не робили, пам'ятаєте? Владу захопив той моторошний чотириокий директор НКВД, а Росія розпалася десь на шість частин. А цей Сухар тут розповідає так, ніби кожна крижана дупа стала окремою державою. І ми не брали Іводзіму. Ми навіть близько не підійшли. Ті мудаки розтрощили нас, наче трирічну дитину в пащі пітбуля. А узбережжя Барселони? Агов, це ж маячня?\n\n§YД-р Керол Стензленд§!\nПо-перше, навіщо взагалі таке порівняння-\n\n§YД-р Річард Гарк§!\nНе порівняння, а уподібнення.\n\n§YД-р Керол Стензленд§!\nМені геть байдуже. По-друге, чому історія з Барселоною - маячня?\n\n§YД-р Річард Гарк§!\nБо в п'ятдесятих гребля перегородила все Східне Середземномор'я, пам'ятаєте? Той німецький адмірал, Донатс чи як його, захопив усе це. Тому він не міг побувати на узбережжі Барселони, бо узбережжя немає!\n\n§YД-р Керол Стензленд§!\nПро що, в чорта, ви взагалі говорите? Ви самі собі зробили лоботомію, поки я не дивилася, чи від природи такі дурні? І подивіться на карту. Барселона досі має узбережжя, воно лише посунулося на кілька миль через греблю. І я бачила фото директора НКВД, звідки ви взяли чотири ока? Та й... хоча я погано пам'ятаю війну з Японією. Гляньте, там Ґері! Ґері!\n\n§YҐері§!\nТак?\n\n§YД-р Керол Стензленд§!\nЩо сталося з Росією після закінчення війни?\n\n§YҐері§!\nО, це просто! Вона стала лише жалюгідною частиною великого цілого.\n\n§YД-р Річард Гарк§!\nСтривайте, до чого це-\n\n§YҐері§!\nНехай Темний Технохан вічно мчить Новим Світом на своєму скакуні в супроводі чотирьох Провісників Нової Епохи з тієї Давньої Левантійської Єресі. Як давня белькотлива фортеця Нового Ніппону впала від наших мечів і своїх розколів, так упаде й Нео-Ацтлан, бо їхній Хрестовий похід мільярда душ не зупинить нашу орду. Слава переможним Кісткомагнатам!\n\n§YД-р Річард Гарк§!\nЩо за ху-\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 ### JEBEDIAH POAL ###

 OMO_2022_ferus_transcription_title.20: "Д-р Джебедая Поул №1 - Ласкаво просимо на це (лайно)шоу"
 OMO_2022_ferus_transcription_desc.20: "§YД-р Джебедая Поул§!\nГаразд, усім привіт. Мене звати доктор Джебедая Поул, і це комплекс §LҐрей-Гіллз§!. Якщо коротко, ви, найімовірніше, не знаєте, де перебуваєте й що відбувається, зате маєте докторський ступінь. Тоді ласкаво просимо до клубу. Згодом вам тут сподобається, але спершу розподілимо вас. Біологи й медичний персонал підпорядковуються докторці Стензленд. Щоправда, розмовлятимете з нею нечасто. Уявляйте її як кактус: рідко п'є і страшенно колюча.\n\nДалі фізики. Якщо ви з'ясовуєте, як усе виникає, звертайтеся до Гарка. Потім геологія, якою зараз ніхто не керує, але ми шукаємо людину. Почекайте трохи, і керівник у вас з'явиться. Якщо ж вас перевели сюди для психіатричної роботи, ви звернулися за адресою: наразі я буду вашим начальником. Розумійте це як хочете. Тепер про те, навіщо ви тут.\n\nА ось і головний сюрприз: на російському Далекому Сході помітили унікальне явище, люди там перетворюються на, е-е... поні. Це не гіпербола й не перебільшення, я бачив усе на власні очі. Балакучі коні, магічні кристали, це місце - божевільня, і тепер ви її нові мешканці. Освоюйтеся стільки, скільки треба, але вам мали видати папку з подробицями. Прочитайте її стільки разів, скільки знадобиться, а з усіма запитаннями звертайтеся до керівника відділу. А загалом щасти вам, люди. Воно нам знадобиться.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 OMO_2022_ferus_transcription_title.21: "Д-р Джебедая Поул №2 - №1-032"
 OMO_2022_ferus_transcription_desc.21: "§YД-р Джебедая Поул§!\nЦе сеанс психотерапії №1-032, 8 серпня, зі мною доктор Девід Ґейнсбі. Докторе Ґейнсбі, що вас непокоїть?\n\n§YД-р Девід Ґейнсбі§!\nДля початку - риторичні запитання. Я працюю в постачанні, що може мене не переслідувати? Ми переглядали фотографії, речові рештки... Геологічний відділ відправив групу постачання з камерами по кристали. Вони знали, що треба триматися подалі, після того як бідолашні японські покидьки спробували зняти відео на Далекому Сході, але Господи... фотографії, які вони відкопали...\n\n§YД-р Джебедая Поул§!\nНе поспішайте, у вас стільки часу, скільки потрібно.\n\n§YД-р Девід Ґейнсбі§!\nНі, ні, усе гаразд, це, е-е... То були звалища, це- це скидалося на братську могилу. Для... невдалих перетворень, але вони не зовсім провалилися. Вони перетворилися наполовину, там були напівлюди-напівпоні, вони... Це нагадало мені те, про що розповідав батько, коли я був дитиною. Він був фізиком-ядерником, працював над Мангеттенським проєктом. Він так і не пробачив собі. Завжди казав, що наука, людський поступ, усе це марне, якщо ми застосовуємо його лише проти себе. Я не розумів, що він говорив не про ядерну бомбу, а саме про це. <зітхання> Не можу уявити, щоб ті поні втратили всю свою людяність. Не після цього. Ті люди, що лежали в ямах, на тому звалищі... Я їх бачив. Їхні очі були розплющені. Вони досі жили.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 ### AGUSTIN ###

 OMO_2022_ferus_transcription_title.22: "Агустін Чан-Гонсалес №1 - Наша подорож до Маґадана"
 OMO_2022_ferus_transcription_desc.22: "§YАгустін Чан-Гонсалес§!\nНі, я казав стати там, а не тут, хіба не пам'ятаєш, що ми обговорювали? Кут має бути... стривай, ти ж не записуєш, так?\n\nО, mierda, е-е-е, вітаю, дозвольте представитися, мене звати Агустін Чан-Гонсалес, а це мій оператор Стівен Браун... Ні, бовдуре, не затуляй мене, люди мають бачити, як я тут стою. На чому ми зупинилися? А, так. Сьогодні ми з моїм дуже "добрим" другом вирушаємо в подорож до Маґадана! У певних журналістських колах Берклі ширяться гучні чутки, що люди там перетворюються на... поні.\n\nЗазвичай, якби хтось мені таке сказав, я попросив би поділитися тим, що він курить. Але офіс мого колеги, який досліджував ці чутки й розмовляв із військовиками, обшукало ФБР, тож, гадаю, у цій історії є щось більше, ніж нам розповідають. Підозрюю, що адміністрація Ніксона спільно з місцевою владою приховує якісь дивні справи в Маґадані. Зазвичай я не проводжу польових досліджень, але ця тема видалася надто дивною, щоб пройти повз, а моя журналістська доброчесність вимагає викривати всі темні справи уряду. Зрештою, народ має вимагати від уряду звіту, а для цього повинен знати, чим той займається.\n\n§YСтівен Браун§!\nТобто справа не в тому, що ти намагаєшся вкрасти історію в колишньої?\n\n§YАгустін Чан-Гонсалес§!\nЩо? Я не... і навіть ЯКБИ це було так, я ніколи... ти взагалі на чиєму боці?\n\n§YСтівен Браун§!\nЯ на тому "боці", який не пхає мене на сторічний російський військовий корабель, що, я майже певен, от-от розвалиться, смердить гнилим м'ясом і має забитий туалет, бо ХТОСЬ лишив у клятій вбиральні радіоактивний безлад!\n\n§YАгустін Чан-Гонсалес§!\nЦе нечесно! Я...\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 OMO_2022_ferus_transcription_title.23: "Агустін Чан-Гонсалес №2 - ????"
 OMO_2022_ferus_transcription_desc.23: "§YАгустін Чан-Гонсалес§!\n...вона ввімкнена? Так? Гаразд. Ми опинилися в сибірській глушині, зараз ми приблизно... за три кілометри на північний захід від Маґадана. Мисливці повідомляли, що за останні кілька тижнів тут зникали люди, тому... стривай, чорт, я забув, американці не знають, що таке кілометр. Мабуть, думають, що метрична система - комунацистська загроза. Стівене, знаєш, скільки кілометрів у милі?\n\n§YСтівен Браун§!\nЯ схожий на математика?\n\n§YАгустін Чан-Гонсалес§!\nГосподи, друже, знаю, тут мороз, але не треба зриватися на мені, я не винен. Не хочу сперечатися, просто повернімося до справи, гаразд? На чому ми зупинилися? А, так. Нам пощастило орендувати кілька їздових собак, щоб... стривай, Стівене, що це там блищить?\n\n§YАгустін Чан-Гонсалес§!\nВоно наче... світиться? Я знав, що в Якутії є коштовне каміння й таке інше, але не тут. І нічого подібного я ніколи не бачив.\n\n§YСтівен Браун§!\nЯ його підніму.\n\n§YАгустін Чан-Гонсалес§!\nЩо? Не торкайся! Воно світиться, а це універсальний сигнал: "цей предмет злий". Він навіть може бути радіоактивним!\n\n§YСтівен Браун§!\nІди ти, Агустіне, мені треба сплачувати рахунки, а це очевидна марна трата часу. Бодай щось отримаю, коли його продам.\n\n§YАгустін Чан-Гонсалес§!\nЧувак! Не клади камеру на землю, вона ж мерзла! Ти знаєш, скільки вона коштувала? Гаразд, гаразд, гаразд. Твоя взяла. Дай лише підніму її.\n\nКлянуся Богом, друже, якщо через цю штуку з тобою щось станеться, ти захворієш на рак і в тебе випаде волосся, я не ви-\n\n§B<<Звукові перешкоди між §Y01:39§! та §Y01:50§!, опис: звук "іскорок", після якого лунає жахливий крик>>§!\n\n¿Q-qué? По-поні? Вони спр-справжні. О, dios mío, я не мо-\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

 OMO_2022_ferus_transcription_title.24: "Щодо СУБ'ЄКТА №616"
 OMO_2022_ferus_transcription_desc.24: "Директору ЦРУ. 14 листопада 1964 року. Щодо СУБ'ЄКТА №616.\n\nЯк зазначено в попередньому звіті, СУБ'ЄКТА №616 затримали наші сили, розгорнуті в Маґадані. Коли його знайшли, він перебував у шоковому стані й безупинно повторював, що поніфікація справжня, а його друга кристал перетворив на поні.\n\nСуб'єкта переконали, що він повернеться до Америки й зможе продовжити цивільне життя. Він не знає, що з ним станеться. Лише повторює, що хоче повернутися до Уругваю й обійняти матір.\n\nБуде застосовано встановлену стандартну процедуру. Статус іммігранта полегшує зникнення суб'єкта. Його перевезуть до комплексу в §LҐрей-Гіллз§!, де використають як піддослідного в дослідженні депоніфікації під керівництвом доктора §R(ВИЛУЧЕНО)§!.\n\nКінець передачі.\n\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 ### STANFORD HARRIS ###
 
 OMO_2022_ferus_transcription_title.25: "Д-р Стенфорд Гарріс №1 - Гарріс"
 OMO_2022_ferus_transcription_desc.25: "§YД-р Стенфорд Гарріс§!\nЦя штука працює? Говорить доктор Стенфорд Гарріс, я працював у-\n\n§YД-р Річард Гарк§!\nЯ, бляха, не сплю!\n\n§YД-р Стенфорд Гарріс§!\nМи чекаємо на медсестру, яка справді знає, що робить. Я алгебраїст, а не анатом, але навіть я бачу, що Гарк не кінь.\n\n§YД-р Річард Гарк§!\nПоки що не кінь!\n\n§YД-р Стенфорд Гарріс§!\nТак, так, гаразд. Сестро, нарешті ви прийшли, цей чоловік-\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.26: "Д-р Стенфорд Гарріс №2 - Наслідки"
 OMO_2022_ferus_transcription_desc.26: "§YД-р Стенфорд Гарріс§!\nГоворить доктор Стен Гарріс, 2 квітня, медичний блок §LҐрей-Гіллз§!. У моїй присутності... всі. Тут Гарк, Стензленд, Овенс, Еріксон, росіянин, Поул, Армстронг, здається, десь неподалік... а Фароса знову відвезли до ветеринарів. Схоже, вечірка була шалена. З огляду на все, добре, що я не пішов. Хоча якщо після такої гулянки бідолашний охоронець на ранковій зміні здіймає тривогу, то зазвичай люди готові вбити, аби потрапити на неї.\n\nА втім. Дехто надто поринає в роботу. Бачив таке, коли все справді почало летіти шкереберть: в Овенса, Стензленд, Гарка-\n\n§YД-р Ґаррет Овенс§!\nЙОБ ТВОЮ, Я ЖИВИЙ!\n\n§YД-р Стенфорд Гарріс§!\nА, докторе Овенс, ласкаво просимо назад до світу живих!\n\n§YД-р Ґаррет Овенс§!\nОт лайно, як же голова болить, де я? Котра година?\n\n§YД-р Стенфорд Гарріс§!\nВи живий, дихаєте й перебуваєте в медичному блоці, зараз 14:00. Схоже, вечірка у вас була пекельна. Скільки пальців я показую?\n\n§YД-р Ґаррет Овенс§!\nОх, до хріна.\n\n§YД-р Стенфорд Гарріс§!\nТак я й думав. У вас тяжке похмілля, напевно. За дивним збігом, симптоми перетворення майже ідентичні. Тож наразі всі ви фактично перебуватимете на карантині. Саме тому я в захисному костюмі.\n\n§YД-р Ґаррет Овенс§!\n...Що?\n\n§YД-р Стенфорд Гарріс§!\nУсе гаразд, не хвилюйтеся, просто відпочивайте.\n\n§YД-р Ґаррет Овенс§!\nУсе болить.\n\n§YД-р Стенфорд Гарріс§!\nЗнаю. Я маю опитати решту команди, коли вони прокинуться й зможуть відповідати на запитання. Але, думаю, мине ще кілька годин. А доти з вами був доктор Гарріс і, відповідно, решта наукової команди. Бережіть себе.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 ### GARRET OWENS ###
 
 OMO_2022_ferus_transcription_title.27: "Д-р Ґаррет Овенс №1 - Аналіз кристалів"
 OMO_2022_ferus_transcription_desc.27: "§YД-р Ґаррет Овенс§!\nГоворить доктор Ґаррет Овенс, доктор мінералогії та геохімії. Мене перевели з посади в Неваді й доручили досліджувати унікальну геологію російського Сибіру. Інструктаж я вже пройшов, якщо тільки то не були писання довбаного шизофреніка-наркомана. Отже, якщо я все правильно зрозумів, із Росії надходять якісь нові кристали, що перетворюють людей на поні. Я бачив долучені до звіту фотографії, і хоч, мабуть, мав би бути глибоко стривожений, можу підтвердити: я недостатньо знаю біологію, щоб злякатися. Нема злого без доброго, знаєте? Як найосвіченішого геолога по цей бік обох завіс і людину, яку визнали найменш схильною розпатякати таємниці, мене призначили провідним геологом цього проєкту. Забув, як вони його називають, та й пам'ятати, мабуть, не варто. Дай Боже, ніхто ніколи не згадає, розумієте?\n\nЗвіти розкладені переді мною, записники впорядковані й готові, а я вже по вуха в документах. Щоб ви зрозуміли, усе трохи довбано. На вигляд це щось на кшталт родохрозиту? Можливо? Це точно не зовсім нормально, особливо якщо воно перетворює людей на довбаних тварин, тому я запровадив нову систему класифікації. Наразі просто називатиму їх §h"X"§!. Наслідки цих відкриттів прості: нам знадобиться чимало біологів, адже це виходить далеко за межі однієї наукової дисципліни. Тепер про ціну. За нинішнього рівня геологічного стримування одне випадкове перетворення стається кожні два місяці. У середньому. За наших нинішніх запасів найбільша перерва між спалахами становила чотири місяці, найменша - 19 годин. Ми вдосконалюємося, але недостатньо швидко, щоб урятувати потрібних нам талановитих людей, принаймні так каже доктор Гарріс. Щоб це виправити, я залучаю більше геологів і фахівців зі стримування. Це й так планувалося, але переважно для активних досліджень. Для самих досліджень це чудово, але за кількістю випадкових перетворень просто неймовірно ефективно. Тому значну частину нової команди я перевожу на убезпечення комплексу. Найближчими днями проведемо випробування, і це сповільнить не лише ефективність нашої команди, геологів тобто, а й усього комплексу. Наскільки мені відомо, §LҐрей-Гіллз§! досі єдине місце, де працюють над цим конкретним "проєктом". Тому Гарк, імовірно, надере мені довбану дупу. Та байдуже, я це переживу. І мої люди теж.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.28: "Д-р Ґаррет Овенс №2 - №2-01"
 OMO_2022_ferus_transcription_desc.28: "§YД-р Ґаррет Овенс§!\nЖурнал постачання №2-01, говорить доктор Овенс, записую результати експедиції постачання №16. Радий повторити, що ця експедиція обійшлася без жодних жертв. Отже, перегляньмо список: 7 зразків природних кристалічних утворень з околиць Маґадана, 1 живий зразок поні, 2 зразки поні після смерти та близько 50 надзвичайно цікавих фотографій. Для документації опишу кілька... Гаразд, тут у нас фото міських районів, здебільшого поні... о, ні, там є люди. Схоже на якийсь мітинг. Цікаво. Що ще, що щ- о, це, е-е, якісь §R(ВИЛУЧЕНО)§!. Гаразд. Що ще, фото покладів кристалів, схоже на якусь печеру. Гм. Так, що ще- о.\n\nКладовище.\n\nГаразд, думаю, е-е, досить. Кінець зв'язку.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 ### EMIL ARMSTRONG ###
 
 OMO_2022_ferus_transcription_title.29: "Д-р Еміл Армстронг №1 - Хто вигадав "проєкт Ferus"?"
 OMO_2022_ferus_transcription_desc.29: "§YД-р Еміл Армстронг§!\nАудіожурнал, день шістсот сьомий проєкту Ferus, говорить доктор Еміл Армстронг. До речі, а чому він узагалі називається проєктом Ferus?\n\n§Y(ВИЛУЧЕНО)§!\nВід латинської назви "коня". §B(Джерело: §CПоні§!)§! Equus ferus caballus.\n\n§YД-р Еміл Армстронг§!\nВи жартуєте.\n\n§Y(ВИЛУЧЕНО)§!\nНі, я-я майже певен, що так і є.\n\n§YД-р Еміл Армстронг§!\nАле це- це ж така дурня! Хто, в біса, це вигадав? Намагалися покреативити? О, це проєкт про коней, але нікому не кажіть, що він про довбаних КОНЕЙ.\n\n§Y(ВИЛУЧЕНО)§!\nЗдається, дружина Ніксона.\n\n§YД-р Еміл Армстронг§!\nЩо?!\n\n§Y(ВИЛУЧЕНО)§!\nТак... Так, вона.\n\n\n\n§YД-р Еміл Армстронг§!\nНенавиджу це місце.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.30: "Д-р Еміл Армстронг №2 - Пара...спрайти"
 OMO_2022_ferus_transcription_desc.30: "§YД-р Еміл Армстронг§!\nАудіожурнал, день §R(ВИЛУЧЕНО)§! і, е-е, §R(ВИЛУЧЕНО)§!, здається. Говорить доктор Еміл Армстронг. Кілька днів тому наші хлопці з федеральної служби дістали нам зразок чогось, що, за словами русаків, пройшло крізь якийсь магічний міжвимірний портал. Не знаю, що, в біса, вони там виробляють, але ця штука нібито втекла з того паршивого сховища, яке вони використовують на Далекому Сході.\n\nВони назвали її якось, е-е, здається, це перекладається як "параспрайт". Якась комаха, майже муха, хоча я б навіть назвав її милою. Не знаю, чому нині все з Росії пастельне, але ця штука не виняток.\n\nЕ-е. Її тут немає. Вона ж була в цьому ящику?\n\n§YНевідомий§!\nТак, у цьому.\n\n§YД-р Еміл Армстронг§!\nНу, тепер її тут немає. Що-\n\n§YСистема гучномовців §LҐрей-Гіллз§!§!\nУВАГА: НЕВПІЗНАНИЙ ЗРАЗОК УТІК З УВ'ЯЗНЕННЯ. ПРОТОКОЛ БЛОКУВАННЯ АКТИВОВАНО.\n\n§YД-р Еміл Армстронг§!\nОт лайно.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.31: "Д-р Еміл Армстронг №3 - Маячня"
 OMO_2022_ferus_transcription_desc.31: "§YД-р Еміл Армстронг§!\nАудіожурнал, день дві тисячі шістсот п'ятдесятий проєкту Ferus. Говорить доктор Еміл Армстронг із сонячного §LҐрей-Гіллз§!. Принаймні, думаю, там сонячно. Кілька днів тому якийсь бовдур бавився з кристалом у сховищі, перетворився на одного з довбаних поні й затопив нижні лабораторії. І вгадайте, хто працював у вихідний?\n\nУ мене третій день ізоляції. Здається. Тут важко стежити за часом. Схоже, вони хочуть, щоб навіть в ізоляції я записував свої спостереження, тож ось вони.\n\nПерше: стіни дуже неприємного брудно-білого кольору. Серйозно, повісьте якусь- якусь картину чи що.\n\nДруге: їжа тут - сміття. Просто жахлива. На це йдуть мої податки? У Пепе через дорогу краще, а я майже певен, що вони ніколи не миють посуд. Узагалі.\n\nТретє, і я не можу наголосити на цьому достатньо: мої керівники - купка БОВДУРІВ.\n\nЯкийсь цирк. Я дуже не хочу стати довбаним поні... Сумую за дружиною.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.32: "Д-р Еміл Армстронг №4 - Король панд"
 OMO_2022_ferus_transcription_desc.32: "§YД-р Еміл Армстронг§!\nАудіожурнал, день дві тисячі шістсот шістдесят перший проєкту Ferus у комплексі §LҐрей-Гіллз§!. Говорить доктор Еміл Армстронг. Мене щойно випустили з обов'язкового карантину, я, до речі, досі людина, і, оце несподіванка, мені наказали негайно повернутися до роботи. Зараз іду назад до кабінету, одному Богу відомо, скільки паперів там накопичилося-\n\n§B<<Звукові перешкоди між §Y00:20§! та §Y00:25§!, опис: жування>>§!\n\n§YД-р Еміл Армстронг§!\nЧому в моїй лабораторії панда? Річарде!\n\n§YД-р Річард Гарк§!\nА, Еміле, бачу, вже вийшли з ізоляції. Вітаю, мабуть, відчуваєте полегшення.\n\n§YД-р Еміл Армстронг§!\nТак, це чудово, Річарде, але якого біса в моїй лабораторії панда?\n\n§YД-р Річард Гарк§!\nПанда?\n\n§YД-р Еміл Армстронг§!\nТак, панда. Ну, знаєте: велика, чорно-біла, їсть пагони й листя. Панда!\n\n§YД-р Річард Гарк§!\nА навіщо панді бути у вашій лабораторії?\n\n§YД-р Еміл Армстронг§!\nГарне запитання, еге ж? Це якийсь жарт? Як вони взагалі протягли її крізь двері?\n\n§YД-р Річард Гарк§!\nПопросіть Фароса, хай її забере. Радий знову вас бачити, Еміле.\n\n§YД-р Еміл Армстронг§!\nГосподи Ісусе. Яке ж жахливе місце.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 ### Misc Characters with only one entry ###
 
 OMO_2022_ferus_transcription_title.33: "Відкриття Теодора Норта"
 OMO_2022_ferus_transcription_desc.33: "§YТеодор Норт§!\nГоворить Теодор Норт, кореспондент New York Times із... із... не знаю, де саме я перебуваю, але точно на півдні Сибіру. Я продовжував серію подорожніх репортажів про сільське життя у воєначальницькій Росії, але в останньому місті місцеві розповіли про дивні, е-е... дивні події в навколишніх лісах. Це розпалило мою цікавість, і я вирушив усе дослідити.\n\nЗараз я крадуся крізь низькі чагарники. Попереду щось рухається, але я не можу розібрати, що саме. Тут щось є, зі мною, у цьому лісі. Я чую його, відчуваю запах... відчувааааю його. Це саме життєрадісність. Я відчуваю таке товариське єднання й братерство, якого ніколи не знав.\n\nТепер я майже їх бачу. Люди- дві ноги, чотири ноги- разом ідуть поміж дерев, майже танцюють у місячному сяйві. Стривайте... це не місячне сяйво... але яке ж воно пречудоооове!\n\nВони наближаються. Тепер я відчуваю... цілісність! Усе, що нам завжди казали, правда: дружба - це справжня магія!\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.34: "Ґейнсбі: НЕ СТРІЛЯЙТЕ, БЛЯХА, У КРИСТАЛИ X"
 OMO_2022_ferus_transcription_desc.34: "§YД-р Ґейнсбі§!\nГоворить доктор Ґейнсбі. Отже, наскільки я розумію, цей запис призначений для тих мудаків, які внизу, у сховищі, бавилися з російськими гвинтівками, що застосовувалися проти поні. Гаразд, я не мав би, бляха, цього пояснювати, але гратися з мисливською рушницею в полі зору довбаних §hкристалів X§! не. Можна. Ніколи! Ви, покидьки, розумієте, з чим ми маємо справу?! Я поговорив із достатньою кількістю людей у цьому комплексі, щоб мені дозволили перетворити вас на поні заради експерименту! Клянуся Христом, якщо не схаменетеся, я відправлю вас до Ґреймейна як "витратний живий ресурс"! БЛЯХА!\n\nГосподи. Якщо ми ще раз заскочимо когось за такими забавками з гвинтівками, я маю повне право відправити вас до найближчої до пекла кімнати цього підвалу, і це обіцянка.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.35: "Звіт д-ра Еріксона про д-ра Гарка"
 OMO_2022_ferus_transcription_desc.35: "§YД-р Отто Еріксон§!\nГоворить доктор Еріксон, доповідаю про стан доктора Річарда Гарка. Судячи з усього, під час учорашнього спалаху о 18:12 Гарк був у своєму кабінеті. Біля кабінету розірвалася газова жила, уламки влучили йому у верхню частину грудей. Вважається, що це сталося в момент блокування, а вибух газової жили спричинив як саме блокування, так і поранення. За повідомленнями, рятувальні служби прибули не пізніше ніж приблизно через 17 хвилин після вибуху. З огляду на все, непогано. На момент прибуття насичення крові Гарка киснем становило близько 85%, і охорона під'єднала його до дихального обладнання. Коли охорона прибула, Гарк нібито був непритомний, бла-бла-бла, йому ввели епінефрин та ще якесь... добро, чому він не зрадіє, але, як на мене, трохи якісної хімії він переживе. Він житиме. Так.\n\nНаразі стан Гарка тяжкий, але стабільний. Він точно житиме, якщо не буде ускладнень, яких я, чесно кажучи, не очікую, принаймні коли геологію перебрав Овенс. Коротше кажучи, невдовзі Гарк знову стане на ноги. Сподіваюся, з ним усе буде гаразд.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 ### NORMAN GREYMANE ###
 
 OMO_2022_ferus_transcription_title.36: "§GҐреймейн§! №1 - Що за хуйня цей ПРАНСЕР?!"
 OMO_2022_ferus_transcription_desc.36: "§YД-р Норман Ґреймейн§!\nАудіожурнал, день 1157 §Cпроєкту Ferus§!, доповідає доктор Норман Ґреймейн. Мене нещодавно перевели з ЦКЗ, федеральним службам, схоже, знадобився фахівець із худоби. Мабуть, я маю бути втішений? Для мене честь, що уряд зацікавився моєю роботою, сільськогосподарська епідеміологія - недооцінена галузь, але допуск найвищого рівня для такого скромного науковця, як я? Що ж, справа, мабуть, серйозна.\n\nПодивімося, що в конверті. Агенти в Росії повернули зразки чотирьох нових патогенів, які стрімко поширюються серед коней, оленів, яків та інших копитних. Дедалі більше побоювань викликає можливість передачі цих вірусів від коня до людини, адже тоді світ сколихне глобальна пандемія небачених масштабів. Боже милостивий...\n\nПатоген Альфа: у копитних спостерігаються сильні висипи, втома, анемія, розлад травлення, блювання та втрата ваги. Хворих тварин можна впізнати за виснаженим вигля- Господи, який жах! Ніколи не бачив такого- такого змарнілого коня! Агенти неофіційно назвали патоген... лошакією? Гаразд, якого біса.\n\nПатоген Бета: спочатку його плутали з патогеном Альфа; заражені копитні страждають від гарячки, зневоднення, постійної діареї, яка може містити кров, слиз і гній, утоми й утрати ваги. Агенти неофіційно назвали патоген конодизентерією... вони мене за дурня мають?\n\nПатоген Гамма: у копитних спостерігали широкий спектр тяжких симптомів, зокрема численні набряклі лімфатичні вузли, блювання, кровотечі, кульгавість і ознаки некрозу. Російські фахівці припускають, що це значно смертоносніший різновид кінського раку. Патоген Гамма має кілька неофіційних назв, але бажана назва... Прансер?! Гей! Ви там! Так! Я до вас говорю! Це якийсь хворий жарт?!\n\n§YД-р Керол Стензленд§!\nПерепрошую, сер, боюся, ми не знайомі. Я докторка Керол Стензленд. Боюся, наші колеги дуже полюбляють жарти.\n\n§YД-р Норман Ґреймейн§!\nЩе б пак! Що це за сміття? Прансер? Лошакія? Це каламбури з казок на ніч, які я читав дітям! Не віриться, що мене перевели з ЦКЗ до цього клятого наукового цирку.\n\n§YД-р Керол Стензленд§!\nО! То ви новий працівник із ЦКЗ! Мені казали, що невдовзі ми працюватимемо разом. Я докторка Стензленд, ваша керівниця. Ви вже прочитали сторінку про копитерію?\n\n§YД-р Норман Ґреймейн§!\nЦе... просто дифтерія, але для коней?\n\n§YД-р Керол Стензленд§!\nНасправді карликовість.\n\n§YД-р Норман Ґреймейн§!\nЯ йду обідати. Було приємно познайомитися, Керол.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.37: "§CҐреймейн§! №2 - Щодо суб'єкта D-03"
 OMO_2022_ferus_transcription_desc.37: "§YД-р Керол Стензленд§!\nГоворить докторка Керол Стензленд. Сьогодні 23 квітня 1966 року, час запису 18:06. Я розмовляю з колишнім §YРобертом Ґреймейном§!... тепер класифікованим як суб'єкт D-03. Унаслідок нещодавньої та досі незрозумілої низки подій D-03 перетворився з людини на представника якогось виду конячих. Точні ознаки та властивості цього нового виду на момент запису ще досліджуються.\n\n§YD-03§!\nЧому ти постійно мене так називаєш, Керол? Я був на твоєму весіллі й святкуванні народження дитини! Будь ласка, мене звати Роберт, я був твоїм колегою! Я людина, а не довбана тварина, прошу тебе, Керол!\n\n§YД-р Керол Стензленд§!\nD-03 демонструє ознаки збудження. Датчики показують прискорення пульсу до 150 ударів на хвилину. Такий пульс убив би дорослу людину, але для середнього коня шварцвальдської породи він нормальний. Можливий доказ гіпотези Краковського?\n\n§YD-03§!\nЧому ти мене ігноруєш?! Я тут, я людина! Я маю права, я нагороджений герой війни! Я, бляха, служив у Шотландії, заради всього святого! Будь ласка! Що подумав би малий Чарлі, якби побачив, що робить його матуся? Де Сем?\n\n§YД-р Керол Стензленд§!\nСуб'єкте D-03, у попередньому інтерв'ю ви сказали, що відчували, ніби готові, так би мовити, "стати щасливим". Чи не могли б ви докладніше пояснити цю заяву для протоколу?\n\n§YD-03§!\nПішла ти.\n\n§YД-р Керол Стензленд§!\nD-03, нагадую, що ваші нинішні умови життя є привілеєм, а не необхідністю. Відмова від співпраці під час інтерв'ю матиме для вас наслідки. Будь ласка, відповідайте.\n\n§YD-03§!\nЯ не скажу більше ні довбаного слова, доки не отримаю відповіді. Ви ставитеся до мене як до собаки, коня чи клятого щура, мені байдуже, а тоді чекаєте від мене люб'язности? Де Сем, чорт забирай?\n\n§YД-р Керол Стензленд§!\nГаразд, відкладемо сценарій. Джонсон здере з мене шкіру, як із російського собаки, але ми нікуди не просуваємося. Мені байдуже, скажіть йому все, що хочете. Цей чоловік - герой війни. Чи бойовий кінь, мабуть. Ґреймейне? Ви згадували Самуеля? І Чарлі?\n\n§YD-03§!\nПам'ятаєш Юту, Керол? Пам'ятаєш, як ми випадково спалили намети, бо малий Чарлі перекинув гриль? Твоя рідна кров. Наче ти не впізнаєш його імені.\n\n§YД-р Керол Стензленд§!\nУ мене немає дитини, ...Роберте. Ніколи не було. Власне, це одна з причин, чому я хотіла з вами поговорити. 27 жовтня 1945 року лейтенант Роберт Ґреймейн загинув під час бою з німецькими загарбниками поблизу Единбурга. Він очолив атаку п'яти бійців проти частин СС у Великій Британії. Він, полковник Самуель Едвардс і весь його загін загинули в бою.\n\n§YD-03§!\nЩо? Про яку хуйню ти говориш? Ні, ми стримали тих покидьків. Я їх стримав. Я... не...\n\n§YД-р Керол Стензленд§!\nІнтерв'ю завершено.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.38: "§GҐреймейн§! №3 - Будь ласка, не зважайте на спів"
 OMO_2022_ferus_transcription_desc.38: "§YД-р Норман Ґреймейн§!\nГоворить доктор Норман Ґреймейн. Сьогодні 15 червня 1966 року. Зі мною моя керівниця, докторка Керол Стензленд. Доповідаю про результати перших випробувань Pestis Ferarum.\n\n§YД-р Керол Стензленд§!\nНаскільки небезпечні ці пошесті, Ґреймейне? Сподіваюся, безліч коней, яких ви запросили як піддослідних, задовольнила потреби вашого дослідження. Служба обслуговування вже надіслала численні скарги на відходи після ваших дослідів.\n\n§YД-р Норман Ґреймейн§!\nРезультати обнадійливі, Стензленд. Запевняю, я фахівець і не марнуватиму цінне життя на безглузді дослідження. Патогени шалено швидко поширюються серед копитних, але на людей не впливають. Маючи достатньо часу й ресурсів, ми могли б розпочати розробку ліків або навіть щеплень проти цих чужоземних зараз. Утім, біля питного крана мене осяяла цікава гіпотеза.\n\n§YД-р Керол Стензленд§!\nПерепрошую, біля питного крана?\n\n§YД-р Норман Ґреймейн§!\nТак, біля питного крана. Ми знаємо, що ці хвороби прийшли звідти ж, звідки взялися ті балакучі понячі потвори, а отже, поні є носіями патогенів. Вони або мають імунітет і мимоволі їх поширюють, або так само потерпають від них.\n\n§YД-р Керол Стензленд§!\nСтривайте, Ґреймейне, що це, в біса, за питний кран?\n\n§YД-р Норман Ґреймейн§!\nПитний кран, Стензленд, це місце, де тримаєш кнопку, а вода б'є вгору й можна пити.\n\n§YД-р Керол Стензленд§!\nНормане, це питний фонтанчик.\n\n§YД-р Норман Ґреймейн§!\nЗабудьте про кран! Мені потрібні піддослідні з Росії чи звідки ви, в біса, дістаєте тих істот. Якщо вони вразливі до цих хвороб, ми зможемо створити пошесть, яка зітре їх із лиця Землі, якщо вони стануть загрозою. Оскільки ми не вважаємо поні учасниками бойових дій, то не порушуємо жодної Женевської конвенції, і я певен, що світ подякує нам за послугу.\n\n§YД-р Керол Стензленд§!\nВи отримаєте піддослідного, Ґреймейне, але лише одного. Ці ресурси надто цінні для вашої роботи. Щоправда, він трохи дивний, у чому ви невдовзі самі переконаєтеся. Чудова робота, Ґреймейне, з нетерпінням чекаю на результати. Кінець аудіозапису.\n\n§YД-р Норман Ґреймейн§!\n~~Ось так воно й буууде, моя крихіітко, ти поскачеш верхи на конях, є-е.~~\n\nО-от лайно, воно досі працює!\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.39: "§CҐреймейн§! №4 - Допоможіть"
 OMO_2022_ferus_transcription_desc.39: "§YD-03§!\nАудіожурнал... Відколи мене замкнули в цій довбаній оглядовій кімнаті, я вже навіть не пам'ятаю, який сьогодні день. Коли виберуся звідси, Стензленд заплатить. Як вона могла забути? Ні, вона не могла забути, вона бреше. Усе було брехнею, димовою завісою, яка привела мене сюди. Та демонічна жінка принаймні дала мені психотерапевтку, яка приходить щотижня, або мені так здається, бо в цій клітці неможливо стежити за часом. Вона каже, що все буде добре, що мене звільнять від прокляття, що все це частина Божого задуму. Яка довбана маячня!\n\nВона мене не слухає! Вона слухає тих чудовиськ по той бік скла! Я бачу, як вони на мене дивляться, бачу це в їхніх очах. Жалість! Зневага! А найгірше... їхні амбіції. Бачив, як ті виродки дивляться на мене, наче я якийсь лабораторний щур. Вони дають мені все, що можуть знайти, щоб витріщатися, як я тримаю випадкові чашки, каву та а-а! Я їх ненавиджу, але найбільше ненавиджу того викрадача тіл, який носить мою шкіру! Я справжній Ґреймейн! А не той хворий сучий син із тупим ім'ям §G"Норман"§!, який шкіриться до мене крізь вікно, набираючи в шприци бозна-що. Щодня я бачу, як я сам заходжу сюди й уколює мене тими гидкими рідинами. Він шепоче, що це ліки, але я знаю, що він бреше. Відчуваю, як гниють нутрощі, слабнуть усі ноги, а потім непритомнію. Уже навіть не пам'ятаю, скільки разів він це робив, пам'ятаю лише сни. Щоночі я знову в Шотландії, б'юся з фріцами, бачу яскраве світло, а тоді прокидаюся у світі поні! Я не розумію, просто хочу піти, повернутися додому, бути вільним... Хочу знову побачити своїх дітей...\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"
 
 OMO_2022_ferus_transcription_title.40: "§GҐреймейн§! №5 - X-01"
 OMO_2022_ferus_transcription_desc.40: "§YД-р Норман Ґреймейн§!\nАудіожурнал, особливе позначення X-01, доповідає доктор §GНорман§! Ґреймейн про остаточні результати експерименту Caedes Ferarum. За минулий місяць здійснено чимало стрімких проривів. По-перше, за допомогою суміші хімікатів і процесів, які мені заборонено тут описувати, ми створили швидкодійний повітряний різновид патогену Гамма, також відомого як Прансер. Ненавиджу цю назву. Кількох піддослідних призначили вирощувати додаткові клітини Прансера для синтезу, тож лишився останній, найважливіший елемент експерименту: випробування на живому суб'єкті. За непокору обрано суб'єкта D-03. Поки ми готуємо газ, запишемо його останні слова.\n\nДоброго ранку, суб'єкте D-03! Цей день настав! Останнє випробування, і ми відправимо вас веселою дорогою додому!\n\n§YD-03§!\nЗ мене досить ваших ліків, "докторе". Ви лише труїте мою кров, душите нутрощі й роз'їдаєте кістки. Пішли ви разом з усіма своїми друзями-науковцями.\n\n§YД-р Норман Ґреймейн§!\nНе треба так, D-03, ви маєте радіти, що після цього нарешті підете звідси.\n\n§YD-03§!\nЩо ви, в біса, робите?\n\n§YД-р Норман Ґреймейн§!\nУводжу ліки, суб'єкте D-03, і видаляю пляму з нашої часової лінії. Не дивіться на мене так, безтямний ви мул. Я тижнями записував ваше нічне бурмотіння про дружину, дітей і той понячий світ-паноптикум, із якого вас викинуло. А ось головний сюрприз, D-03: ні вас, ні вашої дружини, ні дітей не існує!\n\n§YD-03§!\nПрипиніть брехати, хвора тварино! Це ви маєте сидіти в цій клітці! Я вибрався з тієї зони бойових дій живим!\n\n§YД-р Норман Ґреймейн§!\nТри десятиліття відкритих даних переписів свідчать про протилежне, D-03. Нас збентежив список загиблих із вашим ім'ям. Як ви могли померти, якщо ніколи не жили? Ця загадка підводить нас до єдиного питання: хто ви? Ми знаємо, що ті демонічні поні без проблем гуляють між вимірами, але ви - аномалія. У вас спогади про хибну реальність, але моє ім'я й моторошно схожий на мій голос. Якось, якимось чином, сатанинськими чарами ті поні вирвали вас з однієї реальности й перенесли до нашої. Що це означає для нашого світу? Не знаю, але в одному певен: вас треба стерти, D-03.\n\nВи були живою суперечністю, Роберте Ґреймейне, порушенням законів природи, наривом, який треба вирізати з кори Землі. Цікаво, Роберте, що ми навіть мали спільний день народження, спогади з дитинства. Ви б померли від шоку, якби я відкрив, що ми одна людина, а це ускладнило б експеримент. Та сама людина, але два різні життя, два різні імена. Таке емоційне втручання спотворило б мою роботу. Як прикро, що ви становили загрозу людству, Роберте. Я міг відправити вас до психіатричної лікарні чи кудись далеко звідси, але натомість ви мусили померти.\n\nПісля контакту з газом суб'єкт D-03 прожив близько двох хвилин, а тоді всі його органи відмовили. Після цього останнього випробування Caedes Ferarum можна визнати успішним.\n\n§R=== КІНЕЦЬ ЗАПИСУ ===§!"

