 OMO_april_bukharin_debug_category: "§CНалагодження поні-TNO§!"
 OMO_april_bukharin_debug_category_desc: "My Little Pony (MLP) - лінійка іграшок та медіафраншиза, створена американською компанією Hasbro. Перші іграшки розробили Бонні Закерле, Чарльз Мюнхінґер і Стів Д'Агуанно, а випустили їх 1981 року. Поні мають різнобарвні тіла, гриви й унікальний символ на одному чи обох боках крупа. У двох найновіших утіленнях такі символи називаються "знаками краси".\n\nMy Little Pony неодноразово оновлювали, надаючи їй нового й сучаснішого вигляду, щоб зберегти привабливість на ринку; колекціонери та шанувальники серіалу називають кожне таке оновлення "поколінням". Франшиза орієнтована переважно на дівчат, хоча у 2010-х здобула культову популярність серед непередбаченої авдиторії дорослих шанувальників."

