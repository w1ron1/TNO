 # "Far Eastern War Plans"
 OMO_2022_far_eastern_war: "§CГармонія§! на Далекому Сході"
 OMO_2022_far_eastern_war_desc: "На жаль, задля поширення §CГармонії§! серед наших далекосхідних сусідів ми мусимо вдатися до насильства, адже регіон кишить фашистами й тиранами всіх мастей, а на мирне вирішення годі й сподіватися.\n\nТож ці §Rвоєнні плани§! стануть засобом, що дасть нам змогу ефективно розправитися з ворогом і поширити §CГармонію§!.\n\nПоні, напоготові!"
 
 OMO_2022_not_doing_far_east_war_decision: "Не виконується інший воєнний план, і від виконання попереднього минуло не менш як §Y40 днів§!"
 
 OMO_2022_reconciliation_is_magic: "Примирення - це §Cдиво§!"
 OMO_2022_reconciliation_is_magic_desc: "На схід від озера Байкал лежить §YБурятська АССР§! Валєрія Сабліна, держава, що постала з повстання проти своїх колишніх господарів з іншого берега озера: решток §YПрезидії Верховного Совєту§! під проводом Ґєнріха Яґоди.\n\nБакхарін вважає цей конфлікт безглуздим. Комуністи Росії повинні об'єднатися в §CГармонії§! проти капіталістичної загрози, а не битися між собою через те, що правильно чи неправильно згідно з їхніми ідеалами! Ми мусимо припинити цей конфлікт і сподіватися, що зможемо разом об'єднатися проти тиранії."
 OMO_2022_reconciliation_is_magic_CET: "Ми почнемо §Yпосередництво в мирних переговорах§! між двома ворогуючими володарями й покажемо їм наші шляхи §CГармонії§!."
 
 OMO_2022_vs_yakutia: "Воєнний план: [YAK.GetFlag] §GЗелений§!"
 OMO_2022_vs_yakutia_desc: "І Гармонія, і комунізм визнають жадібність рушієм страждань і причиною приходу до влади тих, хто її не заслуговує. Капіталістична держава Якутія не є винятком: мандрівники, біженці й наші шпигуни повідомляють про жахливі умови праці, спричинені загребущими руками численних олігархів, що керують країною.\n\nМи не можемо сидіти склавши руки, поки наші товариші по зброї страждають під капіталістичним гнітом. Тож наш обов'язок - звільнити робітників від кайданів і благословити їх милістю Гармонії."
 
 OMO_2022_vs_yakutia_conclusion: "Викопати якутські кристали"
 OMO_2022_vs_yakutia_conclusion_desc: "У необробленому вигляді знайдені алмази є коштовним камінням, яке переважно використовують для дорогих прикрас, але корпорації та гірники цих гір не могли побачити більшого, бо їм бракувало ключового складника: понячої магії.\n\nПісля достатнього впливу понячої магії ці коштовні алмази можуть проводити магію з тією самою ефективністю, що й §hмагічні кристали§!, знайдені на півночі. Ми пошлемо гірників видобувати їх і, на відміну від попередніх корпорацій, добре ставитимемося до робітників та платитимемо їм заслужену платню в ім'я §CГармонії§!."
 
 OMO_2022_vs_chita: "Воєнний план: [CHT.GetFlag] §WБілий§!"
 OMO_2022_vs_chita_desc: "Залишки Білої армії та давні царисти на Сході згуртувалися під владою царя Міхаїла II, облаштувавши в Чіті свою базу. Не помиляйтеся: ці залишки Білої армії є затятими мілітаристами, які прагнуть скасувати результати нашої праці 1917 року. Гармонія та мир із ними неможливі.\n\nЯк і всіх тиранів та ворогів Гармонії, ми мусимо розчавити їх заради загального блага. Ми не можемо дозволити цим реакціонерам приректи Росію на гніт, від якого ми потерпали стільки років тому."
 
 OMO_2022_vs_chita_conclusion: "Повернути Міхаїла до Австралії"
 OMO_2022_vs_chita_conclusion_desc: "Міхаїл II ніколи не був натхненником своєї \"царистської реставрації\". Насправді ниточки держави смикала Біла армія, а не він. Ми усунули загрозу Гармонії й не тримаємо зла на Міхаїла.\n\nНастав час подарувати йому заслужений спокій поруч із близькими в Австралії."
 
 OMO_2022_vs_amur: "Воєнний план: [AMR.GetFlag] §rКоричневий§!"
 OMO_2022_vs_amur_desc: "Константін Родзаєвскій, безперечно, найогидніший із Харбінської трійці. Він сповідує ідеологію, настільки подібну до німецького націонал-соціялізму, що вони майже нерозрізнювані. Він і його режим фанатиків - справжні вороги Гармонії та народу.\n\nЙого потрібно знищити за будь-яку ціну."
 
 OMO_2022_vs_amur_conclusion: "§RСтратити§! Константіна Родзаєвского"
 OMO_2022_vs_amur_conclusion_desc: "Константін Родзаєвскій. Справжній ворог Гармонії, революції та народу. Він мусить піти.\n\nЗазвичай держава й Ніколай Бакхарін не схвалюють смертної кари, навіть для очільників ворожих держав, адже це суперечить ідеалам Гармонії. Однак не можна заплющити очі на всю мерзотність його вчинків.\n\nНастав час відправити його на шибеницю й помститися за народ Амуру."
 
 OMO_2022_vs_magadan: "Воєнний план: [MAG.GetFlag] §BСиній§!"
 OMO_2022_vs_magadan_desc: "Держава Маґадан є корпоративістською державою під проводом Міхаїла Матковского, ще одного видатного відступника з Харбінської трійці. Як і інші, вони не приймуть ідеї Гармонії, не кажучи вже про комунізм. Хоча він і поміркованіший за інших, загроза від нього не менша.\n\nНастав час завоювати Маґадан і зробити його по-справжньому вільним."
 
 OMO_2022_vs_magadan_conclusion: "Привітати добровольців із Маґадана"
 OMO_2022_vs_magadan_conclusion_desc: "Уряд Маґадана слабкий, і його легко розібрати. Ба більше, через близькість до сибірської Півночі дехто там уже знайомий із поняттями дружби й гармонії та готовий служити нашій справі. Ми приймаємо їх із розкритими обіймами й проголошуємо перемогу Гармонії над фашистами Маґадана."
 
 OMO_2022_irkutsk_buryatia_integration: "Навчитися на їхніх помилках"
 OMO_2022_irkutsk_buryatia_integration_desc: "На жаль, нам не вдалося переконати Яґоду й Сабліна припинити ворожнечу та об'єднатися в дружбі, тож ми були змушені розпочати вторгнення, щоб покласти край їхнім війнам. Дружба завжди є відповіддю, хоча декому цього не збагнути.\n\nМи не повинні допустити такого знову. Дружба й Гармонія мусять перемогти!"
 
 OMO_2022_vs_buryatia: "Воєнний план: [BRY.GetFlag] §RЧервоний§!"
 OMO_2022_vs_buryatia_desc: "Хоча революціонери Бурятії за допомогою сили Дружби й повалили тиранію Яґоди, вони відмовляються засвоїти цей урок. Саблін не бажає приєднуватися до Союзу Бакхаріна й далі бореться за повернення до ленінських засад, яким бракує необхідного розуміння Гармонії та Дружби.\n\nМи не можемо дозволити старим непросвітленим течіям комунізму завадити відродженню Союзу, інакше Гармонія може назавжди застрягти в сибірській пустці."
 OMO_2022_vs_irkutsk: "Воєнний план: [IRK.GetFlag] §RЧервоний§!"
 OMO_2022_vs_irkutsk_desc: "Яґода відмовляється навіть розглядати возз'єднання з нашим Союзом, називаючи Гармонійний комунізм ревізіоністською ідеологією, яку слід знищити. Він навіть досі проголошує себе законним наступником старого Союзу, попри повернення Бакхаріна.\n\nЙого тиранію й невігластво треба розчавити, щоб Гармонія та Дружба розквітли по всій Росії."

