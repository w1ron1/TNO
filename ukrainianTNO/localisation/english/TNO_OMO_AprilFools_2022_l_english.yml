 OMO_2022_impending_regime_collapse: "Неминучий крах гармонійного режиму"
 OMO_2022_impending_regime_collapse_desc: "Криза, що спіткала наш Союз, сягнула вершини, адже одна з фракцій здобула надмірний вплив на гармонійний уряд, а відтак і на наше суспільство. Це може означати кінець Гармонії, якою ми її знаємо, якщо рівновагу сил не буде відновлено..."
 
