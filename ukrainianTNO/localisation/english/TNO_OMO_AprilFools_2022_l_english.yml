 OMO_2022_the_longing: "Туга"
 OMO_2022_the_longing_desc: "Наш народ вивчає поні Еквестрії, намагаючись побудувати своє суспільство за їхнім взірцем. Через це чимало наших громадян воліли б просто жити там, а не залишатися у власному світі. Туга завдала багато страждань знедоленій частині нашого населення."
