 OMO_crystals_gui_desc: "Саме в пустці Далекого Сходу Бакхарін уперше знайшов засіб, завдяки якому сили Гармонії можна поширити на весь світ. §hМагічні кристали§!, знайдені глибоко під землею, дають нам змогу §Cвтілити нашу дружбу§! у фізичному світі й чинити неймовірні дива, навіть не ворухнувши копитом."
 
 # Crisis of Harmony GUI
 
 OMO_2022_crisis_radical_warning: "Жодна фракція §Rне§! повинна мати понад §Y75%§! впливу, інакше §CГармонія§! може опинитися §Rпід загрозою§!."
 OMO_2022_crisis_gui_desc: "Після вбивства прем'єра Рикова §Cсамі підвалини гармонії§! похитнулися, і суспільство, яке ми так тяжко будували, почало розпадатися просто на наших очах. Наші §Cпоні§! відчувають, що суспільство змінюється надто повільно, щоб устигати за їхніми дедалі більшими потребами, тоді як §Gлюдство§! вважає, що його дедалі більше лишають позаду. Вкрай важливо зберегти рівновагу між вимогами обох фракцій, §Rщоб Гармонійний Союз не поринув у розбрат.§!"

 OMO_2022_crisis_dial_warning_tt: "§FНапрямок розвитку нашого суспільства під час §Rкризи§! §xнадто далеко відхиляється§! від усталеного порядку. Якщо так триватиме й далі, наш §Cгармонійний§! режим може §Rвпасти§!, а його місце посяде щось гірше.\n\n§RЖодна фракція не повинна мати понад 75% впливу під час кризи. Ситуацію слід виправити якнайшвидше.§!§!"
 
 OMO_2022_crisis_pony_number_tt: "§FВплив §Cпоні§! під час §Rкризи§!: §C[?OMO_2022_crisis_pony_influence|2]%§!§!"
 OMO_2022_crisis_human_number_tt: "§FВплив §Gлюдей§! під час §Rкризи§!: §G[?OMO_2022_crisis_human_influence|2]%§!§!"
 
