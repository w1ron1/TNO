 POLITICS_MA_JIYUAN_DESC:0 "Кривавою місциною є північний захід. Чимало батьків дали дуба на цій жорстокій і спартанській землі, якою знаний цей регіон. Деяким із них пощастило бути похованими - тоді як більшість спочили, віддавши своє тіло на поталу природі. Вони покинули за собою безліч синів: одні живуть рушницею, інші вилами. Ці сини плекають в собі злобу та ненависть, закарбовуючи їх у своїх сердцях. Та все ж саме могилі загиблого батька й люті живого сина належить визначити долю цього китайського краю. Ма Буфан віддав душу в бою проти Північно-західної армії - його син, Ма Цзіюань, здійснить помсту за нього.\n\nІз втратою в кампанії проти Північно-західної армії минулого лідера Кліки Ма, його тата, контроль сім'ї Ма й її війська перейшов до юного й амбіційного Ма Цзіюаня. Він був змушений спостерігати, як Тсуцзі та його ватага спраглих до багатств розбійників спустошують північно-західні землі. Перед ними той був залишений безпорадним, як і коли тибетці здійснили розвідку боєм на південному кордоні, за періоду їхньої вразливості. І якою б не була думка його ворогів, Ма Цзіюань не забув їх кривди.\n\nУ повітрі знову затишшя - затишшя перед бурею. Плани було складено, і скоро завершаться приготування. Кров'ю за кров віддасть Ма Цзіюань; він виправить несправедливість, що була здійснена проти його батьків і проти його земель. Їх побито та поморено, та не переможено. Ма Цзіюань знає це, і скоро про це дізнається весь Китай."

