 ##Ideas##
 #########
 TUR_italian_interference:0 "Італійське втручання" 
 TUR_economic_stagnation:0 "Економічний застій" 
 TUR_economic_stagnation_desc:0 "Наслідки економічного краху Німеччини середини 50-х років були значними для Туреччини, економіка молодої республіки, напіврозвинена та орієнтована на внутрішній ринок, процвітала завдяки післявоєнному буму, що пом'якшував витрати на мобілізацію під час війни. У новому, більш жорсткому середовищі, де німецькі, італійські та інші іноземні інвестори стають більш обережними, а внутрішні інвестиції залишаються недостатніми, турецька економіка увійшла у стан спаду, посилюючи політичну напругу. Реформи вкрай необхідні, інакше спад може перерости у вільне падіння у разі виникнення кризи..."
 TUR_spoils_of_war: "Військові трофеї" 
 TUR_spoils_of_war_desc: "Війна була розв'язана, війна була виграна. Тепер Туреччина розбагатіла та розпещена новими можливостями, адже попит і торгівля здаються більш жвавими, ніж будь-коли. Військовий комплекс реве від радості через нові території, які потребують управління військовими людьми, що повинні бути оснащені.\n\nЦе наші золоті дні, але ніщо хороше не триває вічно, можливо, варто підготуватися на випадок, якщо наша зоря почне падати з висоти..." 
 TUR_year_of_grief: "Рік скорботи" 
 TUR_year_of_grief_desc: "Турецький народ бився, як леви, але його вели осли. Друга італо-турецька війна стала невдачею найвищого порядку для Туреччини, не лише через її існування, а й через наслідки. Її відголоски призвели до зростання цін, інфляції та різкого зниження рівня життя.\n\nСтарий порядок знаходиться на межі колапсу, його поглинає політичний хаос, тоді як опозиційні партії процвітають на їхніх помилках. Для пересічного турецького громадянина немає таких можливостей, лише похмура ситуація, яку доводиться терпіти." 
 TUR_italo_turkish_tension:0 "Італо-турецька напруга"
 TUR_italo_turkish_tension_desc:0 "Тріумвірат знаходиться на смертному ложі, а «люблячі» родичі переважно радіють його агонії. Відносини між Туреччиною та її колишнім італійським союзником знаходяться на найнижчому рівні за всю історію, а кілька націоналістичних політиків відновили старі турецькі претензії на Левант, Кіпр і Родос, сподіваючись підняти національний дух - і свою популярність.\n\nНезважаючи на це націоналістичне відродження, багато хто висловлює занепокоєння або навіть страх щодо можливих наслідків таких претензій. Італія - зрештою, наймогутніша країна в Середземномор'ї, і, незважаючи на перевантаженість їхніх сил, немає гарантій, що вона не знайде сил для боротьби..." 
 TUR_inspectorate_generals: "Генеральні інспекторатори" 
 TUR_inspectorate_generals_desc: "Генеральні інспекторатори - це урядові комісії, які підпорядковуються лише Президенту Республіки, вони відповідають за умиротворення неспокійних регіонів і поширення політики туркізації на землі під юрисдикцією Генеральних інспектораторів, зокрема у східних регіонах. Після Другої світової війни два нових Генеральних інспекторатори були створені у північних частинах Сирії, а найновіший - у північному Іраку; останній має більшу автономію через те, що є більш новим доповненням до республіки. Попри те, що офіційно ці Генеральні інспекторатори хвалять за їхні стабілізаційні зусилля, як місцеві жителі, так і значна частина політичного істеблішменту в Анкарі виступають проти їхніх дій, які вони вважають утиском.\n\nЗ огляду на зростання заворушень і невдоволення у всіх провінціях, підконтрольних Генеральним інспекторам, стає очевидним, що потрібні зміни - і навіть тоді не ясно, чи будуть ці зміни на краще, чи на гірше..." 
 TUR_stains_of_the_past: "Плями минулого" 
 TUR_stains_of_the_past_desc: "Реджеп Пекер, без сумніву, був найвпливовішим лідером після самого Ататюрка. Він фундаментально змінив Республіку та РНП, формуючи їх відповідно до своїх ідеалів авангардної партійної держави, яка поширювала б кемалістські цінності по всій Анатолії. Тепер, через понад десять років після його смерті, його політика все ще міцно тримається в основах нації, протистоячи силам реакції та революції.\n\nПопри це, його ідеалістичні реформи не здобули йому любові турецького народу, і з РНП, що сприймається як його партія - партія холодних авторитарних бюрократів - вони стоять перед загрозою поразки через демократичний запал. РНП має замислитись над своїм минулим і рухатись у майбутнє, якщо хоче уникнути долі існування лише на сторінках у підручниках історії." 
 TUR_demokrasi_bahari: "Весна демократії" 
 TUR_demokrasi_bahari_desc: "Вето БКК на Закон про демократизацію 1962 року, спільно запропонований ДПП та УДП з метою скасування недемократичних виборчих законів і придушення виборців у країні, сколихнуло націю до самої основи. Турецький народ втомився від уявної демократизації країни і вимагає справжніх реформ на вулицях Стамбула, Анкари та інших міст.\n\nЦе найбільший масовий протест в історії країни, де протестувальники варіюються від студентів, які мріють про вільнішу Туреччину, до фермерів, що хочуть економічної допомоги. Режим в Анкарі сприймається як гнобитель народної волі, що заслуговує лише на повалення. Так чи інакше, цей виклик авторитету уряду має бути вирішений." 
 TUR_demokrasi_ittifaki: "Альянс демократії" 
 TUR_demokrasi_ittifaki_desc: "«Demokrasi İttifakı» або Альянс демократії, був пактом, укладеним між УДП та ДПП під час виборів 1963 року, щоб залишити свої відмінності осторонь і разом боротися проти диктатури РНП і принести демократію до Туреччини. Це було простіше, коли обидві партії були в опозиції, але, ймовірно, буде складніше керувати різними ідеологіями і точками зору, тепер коли вони разом при владі. Люди чекають і спостерігають, чи зможе Альянс працювати разом, щоб розібрати однопартійну державу, створену РНП." 
 TUR_divide_and_conquer_idea: "Розділяй і володарюй" 
 TUR_divide_and_conquer_idea_desc: "Виборчий сезон 1963 року завершився, і народ Туреччини вільно підтвердив свою віру в партію Ататюрка та Іньоню, надавши нам більшість в Асамблеї. Цей демократичний вираз виявився занадто складним для «Альянсу демократії», де глибоко розділені УДП та ДПП не змогли сформувати уряд, незважаючи на технічну, ледь помітну більшість. Натомість переговори з ДПП завершилися плідно: вони були переконані реформістським порядком денним Касима Ґюлека і погодились служити молодшим партнером у нашій коаліції." 
 TUR_a_modern_chp_0: "Сучасна РНП - невизначена" 
 TUR_a_modern_chp_0_desc: "Машина комунікації партії горить новою фразою «сучасна РНП», але турецький народ не знає, що це насправді означає. Їх інтригують заклики до більш доступної та відповідальної партії та обіцянки встановити зв’язок із народом, але це лише викликає більше питань щодо того, що це передбачає.\n\nЯкщо Ґюлек та РНП хочуть продовжувати свої перемоги, виборці мають бути звільнені від хмар невизначеності, що огортають цю «сучасну РНП»." 
 TUR_a_modern_chp_1: "Сучасна РНП - ухил уліво" 
 TUR_a_modern_chp_1_desc: "РНП змістилася вліво після різних реформ, проведених партією. Булент Еджевіт та його потужний вплив визначили курс на майбутнє, і лівий кемалізм дедалі більше не лише легітимізується, а й реалізується." 
 TUR_a_modern_chp_2: "Сучасна РНП - ухил управо" 
 TUR_a_modern_chp_2_desc: "РНП змістилася вправо після різних реформ, проведених партією. Турхан Фейзіоґлу та його вплив визначили курс на майбутнє, і правий кемалізм дедалі більше не лише легітимізується, а й реалізується." 
 TUR_a_modern_chp_3: "Сучасна РНП - бачення Ґюлека" 
 TUR_a_modern_chp_3_desc: "Можливо, у минулу епоху РНП не бачила більш сучасного майбутнього. Тверді та непорушні, як скеля на вітрі, кемалісти минулого продовжували дотримуватись своєї лінії. Тепер - ні. З Ґюлеком на посаді президента реформи продовжують ухвалюватися та досягати успіху. Перемоги партій - це його досягнення, а не Еріма, не Іньоню і не будь-кого, хто під ними чіплявся за свою ортодоксальність. Еджевіт і Фейзіоґлу єдині за ним, просуваючи лише найкраще для партії, а ортодоксальне крило задоволене, хоча й часом бурчить." 
 #UDP
 TUR_demokrasi_ittifaki_udp: "Альянс демократії - Понеділковий ранок"  
 TUR_demokrasi_ittifaki_udp_desc: "Наша молода демократія пережила хитромудрі махінації Мендереса, частково завдяки зусиллям наших коаліційних партнерів із ДПП, як на вулиці, так і в Асамблеї. Хоча щоденна робота уряду може бути трохи складнішою з Айбаром та Аліджаном за нашими плечима, останні події знову довели важливість об’єднання про-демократичних сил у моменти кризи.\n\nТаким чином, союз УДП-ДПП залишається, хоча політичний ландшафт змінився з моменту його формування, і зі зростанням міжпартійних суперечностей виникає питання, як наявні партії можуть змінити себе."  
 TUR_demokrasi_ittifaki_bilgic: "Неймовірна коаліція"  
 TUR_demokrasi_ittifaki_bilgic_desc: "Прем’єр-міністр Білґіч здобув мандат на другий термін, однак УДП не отримала більшості на останніх виборах. Союз, сформований між УДП і ДПП у 1963 році, тримався якнайдовше, але політичний ландшафт змінився кардинально. Це пояснює, як вийшло, що партія Білґіча утворила коаліцію з лівими кемалістами під керівництвом Булента Еджевіта. Звісно, раніше це було немислимим, але Еджевіт і міністр економіки Неджметтін Ербакан мають досить схожі ідеї щодо економіки, зосереджуючись на добробуті та індустріалізації. Якщо вони зможуть працювати разом, Туреччина 1970-х стане справедливішою, безпечнішою та сучаснішою. Якщо вони зможуть працювати разом."  
 TUR_demokrasi_ittifaki_demirel: "Бізнес політики"  
 TUR_demokrasi_ittifaki_demirel_desc: "Візія прем’єр-міністра Деміреля для Туреччини – це здоровий глузд, зосереджений на сприятливому для бізнесу розвитку та особистій свободі. Коли настав час формувати уряд, щоб реалізувати це, і партія Деміреля не мала чіткої більшості, такий же здоровий глузд підказав йому укласти коаліцію з найбільш сумісними партіями. Хоча між Демірелем і правим кемалістом Турханом Фейзіоглу з РПД, а також Екремом Аліджаном з РДП немає великої любові, всі троє чоловіків розуміють: гроші вирішують усе. Цей тріумвірат політичного центру є найкращою надією Туреччини подолати наступне десятиліття та вийти з нього справжнім конкурентом."  
 TUR_great_turkey: "Велика Туреччина"  
 TUR_great_turkey_desc: "Міністр економіки Сулейман Демірель і міністр внутрішніх справ Садеттін Білґіч мають великі амбіції не просто витягнути економіку Туреччини зі спаду, а й повністю її оживити. Їхній новий підхід до сільської місцевості частково є економічним, а частково соціальним, пропонуючи механізацію з одного боку та м’яке повернення до традиційних цінностей з іншого, сподіваючись виправити шкоду, завдану класу землевласників земельними реформами Пекера. В інших регіонах прокладаються нові лінії електропередач, залізниці, автомагістралі, будуються фабрики – а на сході інвестиції манить чорне золото."  
 TUR_great_turkey_menderes: "Велика Туреччина – Нетерплячий будівельник"  
 TUR_great_turkey_menderes_desc: "Економічне бачення Мендереса багато в чому завдячує його походженню як землевласника – і чому б і ні, враховуючи необхідність виправлення шкоди, завданої Пекером сільській Туреччині? Обробка земель, механізація та освіта є основою сільськогосподарської політики Мендереса. Тим часом державні економічні підприємства продовжують відігравати важливу роль в індустріальному секторі, оскільки Аднан-бей вирішив, що час для економічної лібералізації, якої деякі вимагали, ще не настав."  
 TUR_great_turkey_demirel: "Велика Туреччина – Держава добробуту"  
 TUR_great_turkey_demirel_desc: "Тепер, коли Демірель є прем’єр-міністром, його фірмова економічна політика стає дедалі більш помітною в урядових справах; Сулейман робить усе можливе, щоб створити сучасну турецьку економіку наприкінці 60-х років, щоб показати світу, як далеко нація зайшла з часів старих часів роздутої бюрократії РНП і корпоративізму Пекера. Демірель також використав це як спосіб дистанціюватися від Мендереса, чиї авантюри заважали стабільності країни, і від Білґіча, чия моралістична позиція стояла на шляху до розкриття всього потенціалу вільного ринку."  
 TUR_great_turkey_bilgic: "Велика Туреччина - Справедливий порядок"
 TUR_great_turkey_bilgic_desc: "Садеттін Білґіч може визнати, що ідеї Деміреля щодо «Великої Туреччини» мали певний потенціал, але прем'єр-міністр зібрав групу союзників, які вважають, що національній економіці потрібна не подальша лібералізація, а краще управління. Новопризначений міністр фінансів Неджметтін Ербакан, підтримуючи приватне підприємництво, виступає за боротьбу з бідністю та соціальну допомогу, коріння яких сягає ісламістської традиції, а також за зменшення впливу кемалістів на важку промисловість. Ербакан і Білґіч доведуть, що нація може розвивати сучасну економіку, не піддаючись жадібним спокусам."
 TUR_gilgamesh_against_enkidu: "Ґільґамеш проти Енкіду"
 TUR_gilgamesh_against_enkidu_desc: "Такий чоловік, як Аднан Мендерес, навряд чи пішов би з політики тихо, навіть після скандалу, такого як недільна криза. Його прихильники також не зникли б за одну ніч. Дійсно, ображений Мендерес повернувся з новою партією, Milletin Demokrasi Partisi, або Народною Демократичною Партією, обіцяючи завершити роботу, за яку його обрали ще в 1963 році, і очистити політику від «масштабної корупції».\n\nРозкол між UDP та MDP відображає глибший поділ – між міською та сільською правицею в Туреччині, поділом ресурсів Анатолії між бізнесменами та землевласниками, між Заходом та Сходом. У постаті Мендереса ця суперечність набуває конкретної форми, і ми повинні усунути цю напругу, якщо хочемо остаточно позбутися його."
 TUR_death_of_enkidu: "Смерть Енкіду"
 TUR_death_of_enkidu_desc: "Ніхто не хотів, щоб Мендерес помер мучеником. З убивством колишнього прем'єр-міністра його прихильники оплакують втрату, а його критики святкують удачу. У повітрі панує атмосфера гніву та обурення, а конспірологічні теорії множаться. Треба відновити довіру громадськості; хоча між Аднаном та Анкарою не було любові, така образа не може залишитися нерозкритою та непокараною. З часом емоції вщухнуть, хоча таємниця вбивці Мендереса залишиться."
 TUR_will_of_the_people: "Людина з народу"
 TUR_will_of_the_people_desc: "Нарешті, після довгого часу в забутті, Аднан-бей отримав можливість виправити помилки старого режиму та повністю трансформувати турецьке суспільство. Саме народ вивів Мендереса на цю позицію, і він має намір іти вперед разом із ними. Його обрали для того, щоб звільнити націю, як це зробив його герой Ататюрк, і ніщо не зупинить його на цьому шляху.\n\nМендерес – природжений оратор перед натовпом. Вони не бачать його гіркоти, його розчарувань, його шаленої думки. Мендерес жив під пильним оком шпигунів CHP багато років. Якби йому дали можливість покарати тих, хто його образив, це мав би бути дуже сильний чоловік, щоб відмовитися від цього."
 TUR_will_of_the_people_2: "Воля народу"
 TUR_will_of_the_people_2_desc: "Ризик виправдав себе, і Аднан-бей тепер займає Чанкайський маєток, позбавивши себе зрадника Фуата Кьопрюлю. Армія та Асамблея поставлені на місце, але оскільки його колишні наступники Білґіч і Демірель виявилися повністю керованими сліпими амбіціями, внутрішнє коло довірених союзників Мендереса ще більше скоротилося. Тепер він із задоволенням дивиться на свій кабінет і бачить своїх близьких друзів – Сарола, Коралтана, Ілері. Це тепер уряд Мендереса – тобто уряд народу, адже Мендерес уособлює в собі пристрасті та мрії, непереможну, патріотичну любов до нації.\n\n§eХто може його тепер зупинити?§!"
 TUR_will_of_the_people_3: "Воля мого народу"
 TUR_will_of_the_people_3_desc: "(не реалізовано)"
 #DYP
 TUR_demokrasi_ittifaki_dyp: "Демократичний Альянс - Вітер зліва"
 TUR_demokrasi_ittifaki_dyp_desc: "DYP вдалося забезпечити переобрання, що підтверджує життєздатність їхнього лівого уряду. Цей досить несподіваний результат, шокуючи багатьох, також дозволив DYP дистанціюватися від своїх коаліційних партнерів в UDP і впроваджувати ще більш ліві політики. Як усе це розвиватиметься далі, залишається побачити."
 TUR_demokrasi_ittifaki_aybar: "Ціна компромісу"
 TUR_demokrasi_ittifaki_aybar_desc: "Уряд Мехмета Алі Айбара – це невдоволений уряд. Спільні основи коаліції соціалістів, лібералів і лівих кемалістів надзвичайно нестійкі, з численними розбіжностями, які підривають ефективність уряду. Єдиний об'єднувальний фактор – це незадоволення компромісним вибором президента Наїма Талу, сухого та нецікавого бюрократа, який, здається, майже анонімно пересувається хаотичними коридорами влади."
 TUR_tip_revolution: "Мстиве обличчя соціалізму"
 TUR_tip_revolution_desc: "Після восьми років компромісів, напівзаходів і невиконаних обіцянок теорія Мехмета Алі Айбара про соціалізм через вибори проходить свій останній тест. Під тиском або за порадою радикального крила DYP, Айбар кинув виклик Асамблеї та закликав народ мобілізуватися, щоб дати уряду можливість здійснити справді радикальні зміни. Дехто називає це новим 1917 роком. Вулиці наповнені протестами, коридори влади киплять гнівом, а військові тримають обережну руку на спусковому гачку."
 TUR_demokrasi_ittifaki_alican: "Свобода і згода"
 TUR_demokrasi_ittifaki_alican_desc: "Прокладаючи шлях між крайнощами, прем'єр-міністр Екрем Аліджан прагне зцілити країну після хаосу протестів DİSK. У межах ніші турецького лібералізму сформувалося два табори – один більш лівий, який працює над створенням соціальної держави, і більш правий, пріоритетом якого є впровадження капіталізму західного зразка в Туреччині. Молодші коаліційні партнери UDP можуть бути як допомогою, так і перешкодою для природно поміркованого Аліджана, коли він іде цим політичним канатом."
 TUR_contrasting_ideals: "Протилежні ідеали"
 TUR_contrasting_ideals_desc: "«Називай ведмедя дядьком, поки не перейдеш міст» – це приказка, яка описує DYP. Незважаючи на те, що вони сформували уряд, DYP більше схожі на коаліцію, ніж на політичну партію.\n\nОб'єднані під керівництвом президента Тевфіка Рюштю Араса, соціалісти та ліберали, які складають партію, мають багато ідеологічних розбіжностей у своїх ідеалах. Одного дня вони перестануть називати один одного «дядьком», як у приказці, але цей день ще не настав."
 TUR_turkish_way_to_liberalism: "Турецький шлях до лібералізму"
 TUR_turkish_way_to_liberalism_desc: "Прокладаючи шлях між крайнощами, прем'єр-міністр Екрем Аліджан прагне зцілити країну після хаосу протестів DİSK. У межах ніші турецького лібералізму сформувалося два табори – один більш лівий, який працює над створенням соціальної держави, і більш правий, пріоритетом якого є впровадження капіталізму західного зразка в Туреччині. Молодші коаліційні партнери UDP можуть бути як допомогою, так і перешкодою для природно поміркованого Аліджана, коли він іде цим політичним канатом."
 TUR_turkish_way_to_socialism: "Турецький шлях до соціалізму"
 TUR_turkish_way_to_socialism_desc: "Іронія історії полягає в тому, що індустріалізаційна програма Пекера посіяла насіння того самого робітничого руху, який так лякав Пекера та його антикомуністичних соратників. Тут у яскравому контрасті видно одну з суперечностей капіталізму: умови класової боротьби необхідні для національного розвитку, але реальність цієї боротьби свідомо приховується.\n\nЗараз усе інакше, і турецький робітник вперше отримав реальний голос у Національній Асамблеї. Турецький робітник вийшов на вулицю і показав, де він стоїть. Турецький робітник самоорганізувався, адже в єдності сила. Зіткнувшись із конфронтацією, боси злякалися. Між цим і звільненням є мільйон перешкод і мільйон шляхів, але в Туреччині робітник піднявся."
 #Junta
 TUR_stability_held_at_gunpoint: "Стабільність на штиках гвинтівок"
 TUR_stability_held_at_gunpoint_desc: "Правляча коаліція Туреччини утримується тільки за рахунок стволів гвинтівок, що спрямовані на них. Різноманітні люди, зібрані військовими, міністри з IDP, AP і CHP, усі стикаються один з одним, переслідуючи власні окремі плани, об'єднані лише кількома незалежними міністрами та відчайдушними спробами Еріма досягти єдності.\n\nЕкстремізм прокрадається з обох боків, використовуючи хаос Туреччини. Ті, хто з правого крила, мобілізувалися під знаменами ісламсько-націоналістичної MMP, на чолі з колишнім генералом Алпарсланом Тюркешем. Тим часом, зліва борються під керівництвом Кемаля Тюрклера та соціалістів з TİP. Вуличні бої між ними стали звичайною справою, що викликає занепокоєння у всіх інших.\n\nЕрім знає, що його уряд може витримати — він повинен. Якщо не зможе, військові знову вступлять в дію."
 TUR_schemers_all_around: "Інтригани, усюди інтригани"
 TUR_schemers_all_around_desc: "Навіть голий король може виявитися оточеним псами, які хочуть його поглинути за будь-яку частку влади. Наглі негідники, які обступили його — Феррух Бозбейлі та Кемаль Сатир, лідери AP і CHP відповідно, обурені тим, що їхня влада та престиж були забрані Ерімом. Якщо їм доведеться йти проти інтересів нації — навіть якщо це призведе до зупинки країни — вони готові на все заради шансу стати на чолі уряду.\n\nОтже, як і будь-яку непокірну тварину, їх треба або навчити слухняності, або посадити на ланцюг."
 TUR_developmentalism_with_erim_touch: "Розвиток Ерімового розливу"
 TUR_developmentalism_with_erim_touch_desc: "Ерім не єдиний, хто має великі ідеї в уряді, але його хлопці добре постачають йому їх. Його «розумні хлопці», група технократів, які приєдналися до нього, розробили модель економічного зростання і стабільності для Туреччини. Найбільш важливий серед цих «розумних» — Аттіла Караосманоґлу, економіст, який захоплюється японськими методами, і який виклав, як вирішити економічну недугу Туреччини.\n\nЗамість статечних рішень для самого статизму, регулювання буде лібералізовано, а денаціоналізація дозволить турецьким корпораціям ставати більш прибутковими. Зміцнивши ці підприємства, з ними працюватимуть для видобутку ресурсів, будівництва інфраструктури та інтенсивної індустріалізації на заході. Як оплатити все це? Оскільки світ нагрівається, більше зброї буде потрібно, і Туреччина з радістю це забезпечить..."
 TUR_a_new_political_paradigm: "Нова політична парадигма"
 TUR_a_new_political_paradigm_desc: "Завдяки хитрості, відданості та терпінню Ерім зробив це. Він повернувся до керівництва CHP, привів свою партію до перемоги на виборах і повернув стабільність, безпеку та економічне зростання в Туреччину. У святкуванні його успіхів лише меншість наважується критикувати його, особливо щодо ролі армії в цих досягненнях.\n\nЗавдяки йому, старий статус-кво повернувся. Лоялісти CHP знову заполонили бюрократію, працюючи над тим, щоб забезпечити контроль їхньої партії над усіма сферами турецького суспільства. Шість стріл стоять вертикально, всі збережені на своєму місці від субверсії, і спадщина Ататюрка збережена. Хоча інші кажуть, що на шляху було втрачено деякі свободи, Ерім знає, що Ататюрк все ще усміхається до них."
 TUR_turkish_miracle: "Турецьке диво"
 TUR_turkish_miracle_desc: "Коли Ерім і його «розумні хлопці» представили себе на економічній сцені Туреччини, бюрократична ортодоксія була приголомшена їхніми пропозиціями, але їхній новий розвиток дійсно відкрив торгівлю Туреччини на світовій арені. Національні турецькі корпорації, такі як Коч та Сабанджі, домінують на турецькому ринку — швидко розширюючи свій вплив на сусідні ринки також — фінансуючи та інвестуючи в нові проекти з щедрою державної допомогою.\n\nТурецький бізнес мчить у нову епоху, повну обіцянок і захоплення, але якою ціною? Ліві та багато старих політиків CHP скаржаться на відвертий вплив нещодавно зміцнених корпорацій на правосуддя, при цьому поступова втрат прав робітників вказується як головний приклад цього. Однак більшість вважає це необхідною жертвою для новосягнутого процвітання Туреччини."
 TUR_our_most_gracious_overseers: "Наші наймилостивіші наглядачі"
 TUR_our_most_gracious_overseers_desc: "Після перевороту армії турецька армія створила організацію під назвою Комітет національної єдності, призначену для нагляду за Республікою та захисту її від демагогів і екстремістів. Вона швидко здобула репутацію за аж надмірну ретельність у своїх обов'язках охорони Республіки, активно нейтралізуючи тих, кого вважали загрозами для стабільності Туреччини.\n\nНа щастя для нинішнього уряду, армія любить Еріма за те, що він служить їхнім інтересам. В свою чергу, армія служить інтересам CHP, допомагаючи трохи маніпулювати шансами на користь Еріма. Турецька армія тепер стала невід'ємною частиною політичного життя в країні, стовпом, який навряд чи зміниться в найближчий час..."
 TUR_collapsing_political_scenery: "Розвал політичної сцени"
 TUR_collapsing_political_scenery_desc: "Уряд Еріма вважався представленням надії, що ситуація відновиться, і демократична система нарешті буде відновлена. Однак ось стоїть нація, змушена змиритися з тим фактом, що система, яку вона колись знала, сама себе поглинула.\n\nУсі політичні партії втратили будь-яку довіру; усі провідні політичні фігури були забруднені невдачами та некомпетентністю, до яких вони були причетні. Тому не може бути сумнівів, що політична система дійшла до точки колапсу. Незважаючи на це, нові вибори все ще на шляху. Турецька політична система, вкрай стурбована будь-яким покращенням, не має уявлення, що чекає попереду."
 TUR_caretaker_government: "Уряд-опікун"
 TUR_caretaker_government_desc: "Ніхат Ерім мав лише одне завдання: стабілізувати країну та покласти край триваючій стагнації. У цьому він зазнав невдачі. Його зусилля щодо зменшення стагнації лише погіршили ситуацію. Він навіть не зміг забезпечити результати для зусиль, що були поставлені турецькими збройними силами та хунтою. Невмілість Еріма призвела до того, що уряд був практично приречений на провал.\n\nУ відсутності достовірного, нині обраного замінника, прем'єр-міністр залишається на посаді, щоб забезпечити, щоб у країни був уряд. Але навіть для багатьох відчужених членів політичної системи зрозуміло, що уряд Еріма є лише формальністю. Поки результати виборів ще не відомі, саме Національні збори та наступники MBK тягнуть за собою нитки."
 TUR_a_new_establishment: "Нова еліта"
 TUR_a_new_establishment_desc: "Ніхат Ерім мав одну задачу — покласти кінець стагнації та стабілізувати країну. Він не зміг цього зробити, незважаючи на повну та ентузіастичну підтримку Турецьких збройних сил. Країна паралізована, нам потрібен шлях виходу.\n\nСтав очевидним, що відповідь на цей хаос полягає в прийнятті влади інженером Халілом Тургутом Озалом, популярно відомим як «Тонтон», який формує Патріотичну партію для захоплення контролю над урядом. Старі партії — це ганьба, нездатні до управління. Всі вони некомпетентні, їхні організації прогнили, а їхні лідери не заслуговують на довіру. Тому нація доручає себе прем'єр-міністру Озалу, щоб він забезпечив вихід з цього паралічу та продовжував розвивати нашу країну, дотримуючись того, що Ататюрк коли-небудь хотів, щоб ми робили. Можливо, Озал нарешті зможе здійснити побажання Ататюрка таким чином, як усі ці нікчемні розчарування до нього не змогли."
 TUR_echoes_in_the_barracks: "Ехо в казармах"
 TUR_echoes_in_the_barracks_desc: "Мета Комітету національної єдності (MBK) — відновити політичну стабільність і порядність, щоб турецька демократія більше не була під загрозою радикалізму та демагогії. Армія є охоронцем нації, і в годину потреби армія її врятувала. Але поки хунта працює над тим, щоб тримати антидемократичні сили в рамках, розколи в MBK продовжують розвиватися за закритими двЕріма.\n\nХоча всі члени збройних сил і комітету присягалися захищати кемалістські цінності, здається, що те, що це означає, ще не вирішено. Генерал армії Джемал Маданоґлу очолює фракцію, яка виступає за якнайшвидшу демократизацію, вважаючи, що хунта — це лише тимчасовий захід.\n\n Його колега, планувальник перевороту бригадний генерал Алпарслан Тюркеш і його фракція виступають проти цього, стверджуючи, що передчасна демократизація поставить націю під загрозу — хоча деякі шепочуть, що молодий офіцер хоче використати хунту для більш радикальної перебудови нації, а не просто передати її назад тим самим політикам, які вже колись її провалили."
 TUR_echoes_in_the_barracks_2: "Ехо в казармах"
 TUR_echoes_in_the_barracks_2_desc: "Мета Комітету національної єдності (MBK) — врятувати турецьку націю від саму себе. Оскільки турецька демократія була знищена на самому початку через демагогів і радикалів, армія не мала вибору, окрім як втрутитись і захистити націю від подальших пошкоджень. У годину потреби турецькі збройні сили виступили, і вони повинні усунути хвороби нації з кореня і стебла, перш ніж виникне будь-яке питання повернення влади тим самим політикам і бюрократам, які довели нас до цієї точки.\n\nУсі члени збройних сил і комітету присягалися дотримуватись кемалістських цінностей, а це означає, що вони повинні знову впиратися всім, чим можна, за республіку. На щастя, Алпарслан Тюркеш взяв на себе лідерську роль у боротьбі з радикалізмом, заспокоюючи вулиці та плануючи, яким буде наступний етап турецького уряду. Солдат є порятунком турецької нації."
 TUR_spectre_of_radicalism: "Привид радикалізму"
 TUR_spectre_of_radicalism_desc: "де лока на ідею? (це не перекладачі пропустили, а оригінальні локалізатори. Тут могла бути ваша реклама. Смартфон віво)"
 TUR_nine_light_doctrine: "Доктрина дев'яти світел"
 TUR_nine_light_doctrine_desc: "Великий лідер Алпарслан Тюркеш уточнив Шість стріл кемалізму, яких тепер уже недостатньо для сучасної тюркської нації. Доктрина Дев'яти світел Тюркеша визначає нові стовпи, на яких буде побудована нова Туреччина. Націоналізм і Популізм, як і в Шести Стріл, вчать, що всі турки повинні любити свою націю, оскільки всі турки є частиною нації. Соціальна орієнтованість і Свобода підтримують ідею, що Туреччина повинна мати змішану економіку, де держава контролює ключові галузі, а суспільство складається з вільних осіб, які отримують соціальне забезпечення та рівні можливості.\n\nІдеалізм і Мораль є ключовими для розвитку турецької свідомості, щоб турок розумів своє місце в історії та культурі, одночасно слідуючи світлу, яке науковий підхід може принести для чіткого аналізу світу.\n\nНарешті, у новій Туреччині селяни повинні бути під опікою та організовані в кооперативи для того, щоб стати більш процвітаючими, тоді як міста повинні швидко індустріалізуватися, щоб вся нація прийняла сучасність, епоху атома. Башбуґ постановив."
 TUR_a_new_system: "Нова система"
 TUR_a_new_system_desc: "Генерал Тюркеш давно знає, що потрібно зробити, щоби захистити Республіку та її інститути — високо оцінювану спадщину Ататюрка, єдину надію турецького народу. Тюркеш давно стверджує, що націоналісти по всій країні повинні об'єднатися і дотримуватись політики, встановленої ним. Тепер у нього є можливість це зробити, і він взяв її обома руками.\n\nСаме тут вступає в гру Міллі Бірлік Партісі — Партія національної єдності. Її мета — об'єднати кемалістів і ісламістів в твердженні «не мутлу Тюрк'юм дієне» — «як щасливий той, хто називає мене турком». Однак не всі бачать це однаково. Багато кемалістів, явно промиті соціалістами і лібералами, з якими вони стали співпрацювати, виступають проти зусиль генерала. Але немає причин хвилюватися. Оскільки турецькі збройні сили твердо підтримують уряд, для цих опозиційних фігур вже занадто пізно щось змінити."
 #RadKem
 TUR_inonu_and_his_devil: "Іньоню та його диявол"
 TUR_inonu_and_his_devil_tt: "§RІньоню утримуватиме нас від досягнення наших справжніх цілей.§!"
 TUR_inonu_and_his_devil_desc: "Влада має свою ціну, і для Іньоню ця ціна виявилася дуже високою. Щоб залишитись при владі, Президент відкладав прийдешні вибори, уклавши угоду з дияволом. Фаліх Рифки Атай, людина, яка колись була призначена для великих справ, але була відкинута Іньоню під час процесу демократизації в п'ятдесятих, повернувся, щоб знову взяти кермо в свої руки — відправивши амбіції Іньоню назад до початкової точки.\n\nПан Атай тепер є Прем'єр-міністром країни, її ж урядом і її ж правителем. Його контроль над державою зростає з кожним днем - він, мов ті лози, все сильніше обвивається навколо важелів влади. Однак Президент Іньоню все ще тримається за тонку надію, що він зможе перемогти диявола і повернути собі душу, і країну, щоб вона не сповзла в пекло. Завдання майже неможливе, але коли нічого більше втрачати, немає сенсу не спробувати."
 TUR_rogue_general_insurrection: "Заколот бунтівних генералів"
 TUR_rogue_general_insurrection_desc: "Сейфі Куртбек. Рагип Ґюмюшпала. Текін Арибурун. Пюштю Ердельхун. Всі вони зрадники, всі повинні померти.\n\nНа жаль, це лише симптом інфекції. Ці генерали перейшли на бік Демократичного альянсу — кар'єристів-політиканів, що символізують хворобу, яку ми повинні вирізати з Туреччини — які створили окремий бунтівний уряд в Стамбулі. Кожен день, поки існує ця паралельна держава, є ще одним днем, коли нашу владу ставлять під сумнів — це злоякісна хвороба, яку ми не можемо ігнорувати.\n\nГенерали визнають лише силу, отже, сила буде нашою єдиною відповіддю. Вони та їхня фальшива демократія будуть розчавлені в землю, знищені так, щоб навіть мучеників не залишилося. Турецький народ зрозуміє це, рано чи пізно."
 TUR_second_turkish_revolution: "Друга турецька революція"
 TUR_second_turkish_revolution_desc: "Революції Ататюрка були скасовані смертю цього чоловіка. Існує потреба в іншому Ататюрку, в другій турецькій революції, щоб продовжити його велику справу. Ось і Фаліх Рифки Атай.\n\nБез завершення революції демократизація є порожнім процесом, який тільки призведе до того, що турецьку державу захоплять жадібні до влади демагоги та опортуністи, роблячи жертви безлічі патріотів марними. Це не буде так; будуть потрібні додаткові заходи. Революція повинна бути завершена повністю — більше ніяких напівзаходів від Іньоню.\n\nКожен фанатик, кожен реакціонер і кожен інший шматок сміття буде вигнаний з нації. Лише тоді ідеали Ататюрка можуть бути реалізовані, і лише тоді можна буде створити його світську ліберальну демократію."
 TUR_the_archdevil: "Архидиявол"
 TUR_the_archdevil_desc: "Для багатьох турків президентство Атая — це час, коли вони позбавлені своїх прав і свобод і змушені визнати повну лояльність Фалиху Рифки Атаю, наступнику Ататюрка, Іньоню та Пекера. Туреччина тепер є авторитарною поліцейською державою, де не допускаються жодні думки, окрім кемалізму в інтерпретації Пекера. Давно пішла ера демократизації, замінена безперервним прогресом радикального кемалізму під наглядом Атая."
 TUR_task: "Завдання"
 TUR_task_desc: "Цитуючи Пекера: неможливо посадити апельсинове дерево на горі Зіґана. Єдиним лікуванням для великої нетерпимості та відсталості турецького народу є перетворити їх на трудових людей, які читатимуть слова Ататюрка та його думки безпосередньо, залишаючи свої забобони позаду. Ось чому, завдяки досвідченому міністру Авджіоґлу і його планам швидкої індустріалізації, ми досягнемо успіху в нашому завданні. Може, він і соціаліст за переконанням, але він обов'язково навчиться адаптуватися до корпоративного середовища, яке ми створюємо."
 TUR_cadre: "Кадр"
 TUR_cadre_desc: "Атай не сам у своїй боротьбі з реакцією та нетерпимістю. Його надійні чоловіки та жінки подають йому повну лояльність. Однак серед них, як і в будь-якому іншому інституті, є конкуренція. Радикальний кемалізм виник з об'єднання соціалістичної думки Кадро та націоналістичної думки Юлькю, обидва погоджуються з тим, що кемалізм — правильний шлях, але не згодні з кінцевою метою. Кадроїсти хочуть використати кемалізм для переходу до соціалістичної моделі виробництва, в той час як Юлькю хоче залишити державу корпоратистською та мілітаристською. Юлькюїст Талат Айдемір керує силою кемалістської молоді, а кадроїст Доґан Авджіоґлу диктує турецьку економіку. Поки Атай живий, ніхто не може кинути виклик його владі, але, як і всі до нього, він смертний, і у нього не буде кризи спадкоємства."
 TUR_tool: "Інструмент"
 TUR_tool_desc: "Щоб досягти успіху в нашому завданні, нам потрібні всі робочі руки турецького народу в праці. Турецька держава буде видобувати, бурити та обробляти всі природні ресурси, а потім передавати їх новим фабрикам, що відкриваються по всій країні. Не буде жодного відсталого регіону, від Діярбакира до Коньї, кожен сектор турецької економіки буде модернізований і механізований."
 TUR_second_turkish_revolution_yon: "Друга турецька революція - Шлях Йона"
 TUR_second_turkish_revolution_yon_desc: "Революцію Ататюрка підтримували ідіоти та підлабузники, які бездумно повторювали його мантри, не розуміючи, що вони означають, вигадуючи свої власні значення, щоб виправдати свої страхітливі способи. Туреччина потребує вченого, щоб навчити їх, що таке кемалізм — що він повинен бути — і немає кращої людини для продовження Другої турецької революції, ніж Доґан Авціоґлу.\n\nФашистські режими зруйнували старі західні держави, але вчення Сходу, вчення Ататюрка, дозволяють досягти справжнього соціалізму в Туреччині. Кемалізм показав шлях, і навіть якщо самозакохані політики, як Іньоню, були задоволені, ведучи народ у оману, Авціоґлу не міг собі цього дозволити.\n\nХоча він може бути ідеалістом, він знає, що революція не буде завершена за одну ніч, що перехід до соціалізму вимагає часу. На щастя, інструменти пропаганди висвітлили оптимальні методи навчання людей. Звідси лише справа часу, поки мрія Ататюрка стане реальністю."
 TUR_second_turkish_revolution_ulku: "Друга турецька революція - Шлях Юлькю"
 TUR_second_turkish_revolution_ulku_desc: "«Я твердо вірю, що в цій країні буде друга революція. Ієрархічне втручання було б найменш шкідливим!»\n\nСлова Талата Айдеміра — колишнього президента кемалістського молодіжного руху, який став лідером Другої турецької революції — колись могли бути відкинуті як пусті балачки, але тепер вони стали реальністю, за якою Туреччиною керують. Радикальна трансформація вимагає радикальних методів, і важка індустріалізація, необхідна для того, щоб Туреччина стала супердержавою, не буде досягнута дрібними чварами мас.\n\nНеобхідна дисциплінована авангардна група радикальних кемалістів, які повинні вести народ, направляючи їх від буремних перехідних часів до землі обітованої, яку передбачав Ататюрк. Вони визначать засоби для досягнення цих цілей, не зважаючи на моральні сумніви, готові застосувати будь-яку силу, яка буде потрібна. Вони знають, що їхні діти подякують їм за це."
 TUR_director: "Директор"
 TUR_director_desc: "Директор — це художник, змушений керувати тими, хто нижче, як інструментами для малювання картини, візією того, якою повинна бути ідеальна нація. Саме таким став Доґан Авціоґлу, фараоном всеосяжної турецької бюрократії, якою він буде користуватися для того, щоб вивести промисловий розвиток на нові рівні, і його транспортним засобом для створення нової — кращої — турецької суспільства.\n\nІ як справжній художник, Авціоґлу знає, що шедеври створюються не комітетами, а одиничною особою. Ататюрк знав це, коли діяв як провідник Туреччини в роки її формування, а тепер час для Авціоґлу зробити те саме, перетворюючи Туреччину на націю, що відповідає візії Ататюрка. Аматорство Іньоню та його підлість були повністю викорінені з Туреччини - майбутнє буде приходити з пильними очима, спрямованими на кожен рух, поки не буде зроблений остаточний крок."
 TUR_chairman: "Голова"
 TUR_chairman_desc: "Голова правління повинен відповідати тільки перед собою. Він отримує всю славу та відповідальність за рішення, що виходять від нього та від тих, хто нижче за нього. Талат Айдемір став дуже знайомим з цією відповідальністю як останній пастир Другої турецької революції, приймаючи на себе публічну увагу за рішення свого кадру, та відміняючи їх, коли їхня залізна рішучість тимчасово знижувалася до виснажливої дискусії.\n\nАйдемір представляє ці рішення громадськості в урочистій обстановці, на яку заслуговує герой. Турецький народ дивиться на нього як на модель для наслідування — їх нового чоловіка — людину, якою вони хочуть, щоб стали їхні діти. Газети та ЗМІ розповідають подібну історію, зображуючи його обличчя на перших сторінках, вихваляючи його героїзм, рівний Ататюрку. Туреччина довіряє йому як своєму національному аватару, своєму голосу та своїй руці, щоб знищити всіх, хто наважиться їх загрожувати."
 TUR_a_new_tsk: "Нові ЗСТ"
 TUR_a_new_tsk_desc: "Сейфі Куртбек марширував на Анкару зі своїм баченням, а сьогодні знаходить себе в Анкарі з зовсім іншою метою: тримає посаду президента Туреччини.\n\nДемократичний альянс, який він очолює, дав радикальним кемалістським генералам вибір: піти у відставку та насолоджуватись миром, або їх силоміць змусять піти, з усіма наслідками, що це означає. Нейтральні генерали залишаються на своїх посадах, їхня відданість республіці забезпечена. Отже, де тепер знаходяться TSK, Збройні сили Туреччині? На своєму належному місці, підпорядковані Міністерству національної оборони, якнайдалі від політичної влади."
 TUR_scars_of_22_april: "Шрами 22 квітня"
 TUR_scars_of_22_april_desc: "Немає слів, які могли б описати трагедію, яку ми пережили. 22 квітня може бути позаду нас, але нація страждає від втрати наших родин та друзів. Якою б справедливою не була наша справа, ми страждаємо за боротьбу, яку ми несли. Економіка — димлячий хаос, вона тримається тільки на словах та напівобіцянках. Сусід налаштувався проти сусіда на кожному можливому питанні, поляризація зміцнюється. І на додачу до цього всього, у нас немає реального способу легітимізувати наш уряд, оскільки іноземні держави дивляться на нас як на невдах.\n\nБільше так не буде. З народом за спиною справжня та правильна демократія підніметься з попелу і звільнить нас від руїн."
 TUR_a_constitution_for_democracy: "Конституція для демократії"
 TUR_a_constitution_for_democracy_desc: "Туреччина піднімається з турецької революції демократії як нація в кризі, не в стані безладу, але зі зруйнованою ідентичністю. Для того, щоб зібрати уламки та зібрати їх разом, потрібні лише найрозумніші та найкращі, здатні впоратися з цим завданняи.\n\nПісля цього нам потрібно буде назавжди залишити правління однієї партії позаду. Їхній час вже давно минув, і ми повинні були зрозуміти, що режим не буде готовий прийняти факт того, що їхній час завершився. Цю помилку не можна повторити знову. Люди потребують уряду, якому вони можуть довіряти, Туреччини, яка тримається на ідеї демократії, на свободі, яку вони можуть дійсно святкувати. З найкращими умами, що працюють над створенням конституції, ми включимо їх на кожному кроці."
 
