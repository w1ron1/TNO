 TUR_Fahri_Koruturk: "Фахрі Корутюрк"
 TUR_Fahri_Koruturk_hog_desc: "§YГолова уряду\nКемалізм§!\n--------------\n§LНароджений у 1903 році, адмірал Корутюрк пережив кілька етапів Турецької республіки. Столичний мешканець здобув свої перші значні досягнення в нестабільні тридцяті роки, беручи участь у численних місіях і дипломатичних справах по всій старій Європі, швидко ставши володіти мовою дипломатії. Кінець війни поклав край усім можливим перспективам кар'єри в морському флоті. Натомість він отримав важливі призначення як посол у союзних державах Туреччини. Ветеран парадоксальних процедур Тріумвірату, він призначений на посаду прем'єр-міністра, і з того часу спрямовує погляд Туреччини на зовнішній світ і її сумнівних союзників.§!"
 
 TUR_Cemal_Gursel_sec_desc: "§YМіністр безпеки\nКемалізм§!\n--------------\n§LНароджений в Ерзурумі в 1895, кар'єра Кемаля Ґюрселя в турецькій армії, напевне, єдина, яка може поконкурувати з кар'єрою самого Президента. Служба з відзнакою в Османській армії за часів Першої світової війни, британський полон у 1917, де Кемаль вивчив французьку, лише для того, аби дратувати своїх поневолювачів, повернення вже вмілим командиром, аби вести армію нової республіки у турецькій війні за незалежність, а потім - Збройні сили Туреччини в Другій світовій. Цей старий генерал — компетентний і популярний член кабінету президента — користується однаковою любов’ю як серед громадськості, так і серед військових.\n\nПоки що він цей свій вплив використовував для поширення одної ідеї:\nМіцна, професійна армія, віддана службі турецькій державі та її народу.§!"

 TUR_Ferit_Melen: "Феріт Мелен"
 TUR_Ferit_Melen_eco_desc: "§YМіністр економіки\nКемалізм§!\n--------------\n§LЧлен покоління, яке виросло на тлі славної революції Ататюрка, не дивно, що міністр економіки є одним з найбільш голосних прихильників дотримання кемалістських принципів. Народжений у 1906 році, закінчив Анкарський університет у 1931 році, Феріт Мелен є рішучим прихильником державного втручання в економіку, одного з «шести стріл» кемалістської ідеології. Націоналіст і вічний державний службовець, він відіграв важливу роль у формуванні сучасної турецької економіки; це зробило міністра економіки поляризуючою фігурою, з критикою з обох боків. Однак ця критика лише зміцнила його віру в думки Мустафи Кемаля та загартувала його націоналізм у догматичну ортодоксію.§!"

 TUR_Feridun_Cemal_for_desc: "§YМіністр закордонних справ\nКемалізм§!\n--------------\n§LФерідун Кемаль Еркін є знайомим обличчям у кабінеті президента. Довготривалий посол, надійний дипломат і добре відома особа впливу в Міністерстві закордонних справ. Ферідун завжди закликав до обережності в питаннях зовнішньої політики Туреччини, що було виправдано після виснажливого досвіду в складі посольства Республіки в  Ґерманії. Він - спокійний і розважливий голос у кабінеті палких націоналістів, тому поради міністра закордонних справ такі чужі для них, їх рідко слухають.\nПроте цей чоловік служив республіці з гідністю і став безцінним активом, коли відвернув країну від Райху і спрямував її до Середземномор’я, запобігши війні, яку передбачали всі.§!"
 
