 ##Leader Bios##
 ###############
 
 POLITICS_ISMET_INONU_DESC: "Якщо Мустафа Кемаль був батьком турків, то Ісмет Іньоню – їхній хрещений батько. Що може бути достатнім, щоб описати життя людини, чиї примхи визначали політику націй, армій і імперій?\n\nНароджений у Смирні в 1884 році в сім'ї курдського батька, Іньоню став свідком занепаду імперії, що відбувався навколо нього. Він служив в османській армії з відзнакою в Ємені, Румелії та під керівництвом Мустафи Кемаля у війні за незалежність проти старих імперій Європи. Ісмет був людиною, відданою ідеї відродження турецької нації з попелу халіфату, і швидко піднявся по щаблях революційної гвардії, ставши правою рукою Ататюрка.\n\nНапруга між прагматизмом Кемаля та непохитною волею Ісмета завжди існувала, і час від часу спалахувала конфліктами. Сьогодні, коли дні Ґазі залишилися лише в пам'яті, багато хто стверджує, що старий Візир переступив свої межі. Що він продав націю її ворогам, що він зрадив принципи, на яких вона була заснована. Але ці заяви – ніщо; ніщо, окрім образ на саму спадщину Ататюрка.\n\nЗа свою довгу каденцію на посаді президента Турецької Республіки Ісмет Іньоню переслідував одну мету з єдиним наміром: збереження турецької держави, яку він допоміг створити з нічого. Коли інтереси держави вимагали розрядки з фашистами, він слідував їм. Коли вони вимагали чобота і приклада гвинтівки, він виконував. Через великі випробування останніх трьох десятиліть він рухався вперед: побитий, оклеветаний, але ніколи не переможений.\n\nДержава, яка існує сьогодні, є свідченням політичної майстерності цієї людини та її непохитної волі. Велика турецька держава: така, що залишатиметься великою, незалежно від ціни."
 POLITICS_CEVDET_SUNAY_JUNTA_DESC: "Джевдет Сунай провів більшу частину свого життя на військовій службі. Народжений у 1899 році, він служив в османській армії під час Першої світової війни, короткий час перебував у британському полоні, боровся за незалежність Туреччини після повернення та поступово піднімався по військовій ієрархії. Його кар'єра досягла вершини у 1960 році, коли він став начальником Генерального штабу.\n\nПовага до нього і його авторитет зробили його ідеальною фігурою для молодих офіцерів, які здійснили державний переворот і усунули цивільний уряд. Водночас його не надто змушували до цієї ролі, оскільки, хоча Сунай і мало цікавиться тонкощами політики, він вірить, що турецька армія має обов’язок захищати націю від демагогії та радикалізму. На його думку, завдання хунти полягає у стабілізації ситуації, щоб розумне цивільне управління могло відновитися якомога швидше. Це його обов’язок – забезпечити виконання цієї обіцянки Національним комітетом єдності."
 POLITICS_CEVDET_SUNAY_DEM_DESC: "Джевдет Сунай провів більшу частину свого життя на військовій службі. Він мало цікавиться тонкощами політики. Але, на жаль для нього, це все, що зараз має значення. З розпуском Національного комітету єдності та передачею влади цивільному уряду, що складається з найбільш кваліфікованих політиків Туреччини, Сунай, тепер самопроголошений президент, ідеально міг би проводити час спокійно на віллі Чанкая. Але кожен день приносить нові кризи, і це було б службовою недбалістю – стояти осторонь і дозволити своїй праці зійти нанівець.\n\nПрезидент робить усе можливе, щоб підтримати уряд Еріма та зберегти мрію про демократичну, сучасну, кемалістську республіку. Сунай виконує свій обов’язок – бореться за Туреччину, як робив це завжди."
 POLITICS_CEVDET_SUNAY_INTERIM_DESC: "Джевдет Сунай провів більшу частину свого життя на військовій службі. Він служив в османській армії під час Першої світової війни та брав участь у кожному конфлікті, з яким стикалася Туреччина відтоді. Сунай знає, як виглядає поразка.\n\nУряд Еріма розвалився після того, як Національна асамблея опинилася в безвиході через внутрішню боротьбу, на вулицях щодня з’являється все більше розлючених демонстрантів, а економіка знесилена інфляцією та втратою довіри. План відновлення провалився, і президент Сунай нічого не може зробити, окрім як залишитися на посаді тимчасового керівника у віллі Чанкая до завершення нових виборів. Як завжди прагматик, коли він погодився підтримати військовий переворот, коли допомагав розробляти повернення до цивільного управління разом із рештою Національного комітету єдності, він знав, що існує великий шанс провалу цих зусиль.\n\nАле це було іншим, коли це залишалося лише ймовірністю. У холодній реальності – це зовсім інше."
 POLITICS_TEVFIK_RUSTU_ARAS_DESC: "Народжений у Чанаккале 11 лютого 1883 року, Тевфік Рюштю Арас був одним із молодих, орієнтованих на Захід міських професіоналів свого покоління, які приєдналися до Комітету єдності та прогресу. Він залишив свою медичну практику, щоб брати участь у Великій війні та у війні за незалежність, де його дружба з Мустафою Кемалем допомогла йому піднятися до видатної ролі.\n\nЗ 1925 року Арас успішно обіймав посаду міністра закордонних справ при Ататюрку; його високий, стрункий вигляд, круглі окуляри та манери лікаря зробили його несподівано ефективним дипломатом. Однак, коли зростання фашизму в Європі поставило під загрозу його програму регіональних альянсів та зближення з Радянським Союзом, а піднесення його суперника Іньоню на посаду президента створило проблеми ближче до дому, Арас зрозумів, що час змін настав. Коли він подав у відставку з посади міністра закордонних справ та вийшов із Республіканської народної партії(СНР) напередодні вступу Туреччини до країн Осі, розпочався новий розділ у житті лікаря.\n\nНезважаючи на наполягання Пекера, який сам ненавидів альянс, залишитися, Арас сприймався президентом Іньоню як потенційний суперник і як симпатик комуністів через його прокомуністичні погляди. Його кар’єра в CHP закінчилася безславно. У наступні роки лікар, який колись був у серці однопартійної диктатури, став одним із її найбільш видатних критиків, виступаючи за демократизацію у пресі та маючи невеликі зв’язки з короткочасною Демократичною партією Джелала Баяра. У кінці 50-х президент Іньоню знову звернувся до Араса, запросивши його створити опозиційну партію. За допомогою Екрема Аліджана із Товариства прав людини була створена Демократична партія відновлення, яка стала партією широких лівих сил і зрештою набула більш соціалістичного характеру, коли лідером партії став Мехмет Алі Айбар за підтримки профспілок.\n\nАрас був по обидва боки влади і, безсумнівно, є кваліфікованим кандидатом на посаду третього президента Туреччини. Дехто називає його комуністом, але поки він зможе утримати Аліджана та Айбара, Арас, можливо, зможе завершити роботу, яку почав Ататюрк."
 POLITICS_FUAT_KOPRULU_DESC: "У минулому, коли застій і занепад стали синонімами Османської імперії, великі візири династії Кьопрюлю були джерелами динамізму, які підтримували її існування якомога довше. Тепер, коли Туреччина стикається з тими ж хворобами, що й Османська імперія, ще один Кьопрюлю бере кермо влади.\n\nФуат Кьопрюлю розпочав свій публічний шлях як викладач османської турецької мови, а під час Балканських воєн перетворився на турецького націоналіста. Як інтелектуал, він провів дні, заглиблюючись у науку, що привело до його призначення Ататюрком на посаду в Міністерстві освіти. Там він вразив Президента настільки, що той запросив Фуата до Асамблеї.\n\nОднак Кьопрюлю розчарувався в авторитарному режимі CHP, коли чума пекерізму охопила його, і заснував Демократичну партію разом із Мендересом і Баяром. Вони переслідували помираючу диктатуру на кожному кроці, керуючись центристсько-правим гнівом, який не ослаб навіть після вбивства Баяра. Коли нація опинилася в приниженому стані, ДП нарешті взяла владу у свої руки.\n\nВзявши владу, ДП, може, не була єдиною в цілях, але в одному вони були єдині: у виборі лідера, Фуата Кьопрюлю. Білий півмісяць низько схиляється на безвітрі, але новий президент сповнений рішучості. Справжня демократія прийде до Туреччини, і нація назавжди залишиться єдиною, об’єднаною та непереможною."
 POLITICS_TEKIN_ARIBURUN_POSTJUNTA_DESC: "“Ми не приймемо жодного іншого режиму, окрім демократичного.”\n\nПісля того як технократичний уряд під керівництвом Ніхата Еріма розвалився, армія знову прийшла — так часто трапляється. Проте цього разу замість встановлення постійного стану надзвичайної ситуації солдати принесли реформи.\n\nТекін Арибурун є одним із цих солдатів демократії. Народжений 16 жовтня 1903 року у Штипі, Арибурун є сином героя Ґалліполі, який продовжив сімейну справу. Піднявшись у рядах Повітряних сил, він став першим військовим аташе Туреччини та відзначеним командиром. Його лідерські якості та політична надійність особливо проявилися під час Італо-турецької війни, перш ніж він зрештою перейшов у політику.\n\nБудучи обраним Президентом Асамблеєю, старий герой став стабілізуючою силою, поки Патріотична партія єдності Озала впроваджувала масштабні економічні реформи. Незважаючи на своє військове минуле, Арибурун є твердим прихильником цивільного управління — вірний кемалістським ідеалам, які символізує його форма."
 POLITICS_OSMAN_TURAN_DESC: "Придворний вчений для сучасної епохи, Осман Туран є одним із провідних медієвістів Туреччини та експертом із історії сельджуків. Те, що цей досить стриманий академік зараз сидить у президентському палаці Чанкая, значною мірою завдячує іншому історику, який став державним діячем, Фуату Кьопрюлю.\n\nЗнайшовши молодого Турана в Анкарському університеті наприкінці 1930-х років, Кьопрюлю став його науковим керівником для написання докторської дисертації. Після того, як академічну кар’єру Турана перервала війна та пригнітив диктаторський режим Пекера, неспокійний професор приєднався до свого наставника в опозиційній політиці, представляючи своє рідне місто Трабзон в Асамблеї.\n\nНезважаючи на свою суху манеру, наукова та політична діяльність професора Турана, включаючи його головування в культурному товаристві Türk Ocakları, його плідні публікації, навіть його шлюб із османською принцесою, допомогли встановити його як прямолінійну та шановану фігуру в консервативно-націоналістичних колах; хто ж, як не історик, допоможе Туреччині вчитися на її минулому?"
 POLITICS_SEVKET_SUREYYA_AYDEMIR_DESC: "Погляд на Шевкета Сюррею Айдеміра може викликати різні почуття в турецьких умах. Думки, які CHP дозволяє формулювати тепер освіченому працівникові, умах мрійників та патріотів. Думки, що ганьблять спадщину героїв, прогресу, правди, якою керувалися в кожному повороті. Шукати воду стало втомливо на спокійному та відкритому морі, що лише ледь пульсує відголосками.\n\nТепер нація належить Айдеміру для керівництва. У кожний момент свідомості соціалізм буде втілюватися у кожний аспект життя працівників, вкарбовуючи стріли шести принципів у їхні серця, що тягнуть їх уперед. Мрії про завтрашню Туреччину тяжіють у його розумі, але цей тягар він недовго нестиме сам."

 
