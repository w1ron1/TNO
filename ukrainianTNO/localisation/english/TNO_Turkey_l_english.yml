##World Events:

 turkey_skeleton_news.1.t: "[Get_newspaper_header]Турецький уряд веде перемовини з протестувальниками весняних протестів"
 turkey_skeleton_news.1.d: "На тлі запеклої дискусії про майбутнє нації та процес демократизації, бездіяльність кемалістів і спірні вибори 1958 року призвели до найбільших масових протестів, які коли-небудь бачив народ. Від Сарачхане в Стамбулі до Улуса в Анкарі десятки тисяч людей зібралися за демократію та проти економічного застою й однопартійного правління.\n\nНовий прем'єр-міністр Корутюрк уклав угоду з протестувальниками, погодившись лібералізувати закони про публічні збори та пресу за допомогою майбутнього законопроекту і надавши гарантію, що РНП дотримуватиметься обіцянки багатопартійної держави. Це було святковано великою частиною громадськості, а опозиційні партії оголосили це своєю перемогою, тоді як більш обережні елементи серед кемалістів відмовилися коментувати. У своєму виступі Президент Іньоню заявив, що Туреччина буде зразковою демократією, якою її бачив Ататюрк."
 turkey_skeleton_news.1.a: "Чи зможе РНП змиритися зі своїм минулим?"

 turkey_skeleton_news.2.t: "[Get_newspaper_header]Турецький уряд придушує весняні протести"
 turkey_skeleton_news.2.d: "На тлі запеклої дискусії про майбутнє нації та процес демократизації, бездіяльність кемалістів і спірні вибори 1958 року призвели до найбільших масових протестів, які коли-небудь бачив народ. Від Сарачхане в Стамбулі до Улуса в Анкарі десятки тисяч людей зібралися за демократію та проти економічного застою та однопартійного правління.\n\nПід керівництвом нового прем'єр-міністра Корутюрка уряд Туреччини вирішив розігнати натовпи за допомогою воєнного стану та силових методів. Опозиційні партії НДП та ДПВ засудили ці події та закликали до нових виборів. Президент Іньоню, виступаючи перед репортерами, заявив, що РНП є партією демократії, і її обов'язок захищати країну від тих, хто використовує ім’я демократії для досягнення своїх інтересів через владу натовпів."
 turkey_skeleton_news.2.a: "Ще одна невдала спроба демократизації."

 turkey_skeleton_news.3.t: "[Get_newspaper_header]РНП виграє загальні вибори в Туреччині 1963 року"
 turkey_skeleton_news.3.d: "Після успішної кампанії проти італійців на Близькому Сході, здається, РНП відновила свою репутацію в очах турецької громадськості. Пройшовши через буремні протести 1962 року, кандидат від реформістського крила партії, Касим Ґюлек, успішно став на захист демократизації проти старої еліти і виграв партійні праймеріз. Залучивши політику в американському стилі з акцентом на кампанії на місцях, його стратегія, схоже, успішно зрезонувала з турецькою громадськістю.\n\nПолітична програма Ґюлека передбачає відмову від авторитарної політики однопартійної ери, внесення змін до конституції з новими правами і гарантіями, одночасно збереженням кемалістських ідеалів світськості та націоналізму - все це для адаптації РНП до демократичного клімату. Однак час покаже, чи зможе він вистояти проти тиску з боку своєї партії."
 turkey_skeleton_news.3.a: "Політик у сандалях? Така кличка легко чіпляється."

 turkey_skeleton_news.4.t: "[Get_newspaper_header]НДП виграє загальні вибори в Туреччині 1963 року"
 turkey_skeleton_news.4.d: "У шокуючій — хоча й запізнілій — поразці для колись домінуючої РНП, НДП здобула парламентську більшість на нещодавніх виборах у Туреччині, отримавши контроль над урядом. Перемога відбулася після тріумфу Туреччини в Другій італо-турецькій війні, що дозволило багатьом вважати перемогу РНП гарантованою. Однак міжнародні спостерігачі підозрюють, що ця перемога не змогла заспокоїти зростаючу ворожість до їхнього правління.\n\nСтарший ліберальний державний діяч Фуат Кьопрюлю став новим президентом Туреччини, вважається об'єднуючою фігурою для багатьох у партії, а суперечливий популіст Аднан Мендерес став прем'єр-міністром. Вважається, що їхній час при владі буде використано для повної демократизації Туреччини, а також для ліквідації багатьох захисних бар'єрів, введених РНП."
 turkey_skeleton_news.4.a: "Виграли війну, програли мир."

 turkey_skeleton_news.5.t: "[Get_newspaper_header]НДП виграє загальні вибори в Туреччині 1963 року"
 turkey_skeleton_news.5.d: "Як і очікувалося, колишня домінуюча партія, РНП, закінчила свою десятирічну еру правління після перемоги ліберального НДП на нещодавніх виборах у Туреччині. Перемога стала наслідком поразки Туреччини в Другій італо-турецькій війні, яка призвела до обвалу економіки країни та масових протестів проти уряду. Тепер виглядає так, що ці протести відбилися і на результатах виборів.\n\nСтарший ліберальний державний діяч Фуат Кьопрюлю став новим президентом Туреччини, вважається об'єднуючою фігурою для багатьох у партії, а суперечливий популіст Аднан Мендерес став прем'єр-міністром. Вважається, що їхній час при владі буде використано для повної демократизації Туреччини та відновлення її економіки шляхом ухвалення ліберальної доктрини, скасувавши багато захисних заходів, введених РНП."
 turkey_skeleton_news.5.a: "Кінець ери."

 turkey_skeleton_news.6.t: "[Get_newspaper_header]ДПВ здобуває перемогу на загальних виборах у Туреччині 1963 року"
 turkey_skeleton_news.6.d: "Перемога Туреччини в Італо-турецькій війні призвела до того, що багато аналітиків очікували перемоги РНП, ще й зі значним відривом. Однак Демократична партія відродження, на чолі з «Посмішкою соціалізму» Мехметом Алі Айбаром, змогла досягти невеликої більшості разом зі своїми партнерами, консервативним НДП. Оскільки обидві партії раніше підписали виборчий пакт під назвою «Демократичний альянс», здається, що процес формування коаліції пройде гладко.\n\nТевфік Рюштю Арас, засновник партії, користується популярністю як серед ліберальних консерваторів, так і серед соціалістів, і став новим президентом. Коаліція його партії, що складається з робітників, студентів і фермерів, разом зі значною підтримкою демократизації та обіцянками побудувати соціальну державу, вважається багатьма ключем до їхнього успіху. Чи зможе прем'єр-міністр Айбар провести свої ідеалістичні реформи через жорсткі позиції в Великій раді кемалізму — покаже час."
 turkey_skeleton_news.6.a: "Демократія — це найделікатніша квітка у світі."

 turkey_skeleton_news.7.t: "[Get_newspaper_header]ДПВ виграє більшість на загальних виборах у Туреччині 1963 року!"
 turkey_skeleton_news.7.d: "Поразка Туреччини в Італо-турецькій війні стала очікуваним смертельним ударом для РНП, що дозволило Демократичній партії відродження, на чолі з «Посмішкою соціалізму» Мехметом Алі Айбаром, досягти невеликої більшості разом зі своїми партнерами з консервативної НДП. Обидві партії підписали виборчий пакт під назвою «Демократичний альянс», тому здається, що процес формування коаліції пройде гладко.\n\nТевфік Рюштю Арас, засновник партії, користується популярністю як серед ліберальних консерваторів, так і серед соціалістів, і став новим президентом. Коаліція його партії, що складається з робітників, студентів і фермерів, разом з сильною підтримкою демократизації та обіцянками побудувати соціальну державу, вважається багатьма ключем до їхнього успіху. Чи зможе прем'єр-міністр Айбар провести свої ідеалістичні реформи через жорсткі позиції в Великій раді кемалізму — покаже час."
 turkey_skeleton_news.7.a: "Демократія — це найделікатніша квітка у світі."

 turkey_skeleton_news.8.t: "[Get_newspaper_header]Інцидент 22 квітня"
 turkey_skeleton_news.8.d: "Не досягнувши перемоги над італійськими силами на полі бою, незабаром заклики до кінця сорокарічного правління РНП стали настільки голосними, що їх вже не можна було ігнорувати. Однак, коли Молодіжний рух кемалістів і Військова академія спільно вирушили до Великої національної асамблеї, стало очевидно, що їхня відданість демократії була значно переоцінена.\n\nПодія отримала назву Інциденту 22 квітня, коли сили, що підтримують так звану «радикальну кемалістську» гілку партії, захопили турецький парламент, арештувавши не лише членів опозиції, але й навіть ймовірних прихильників у самій партії. У зв'язку з цим прем'єр-міністр Фахрі Корутюрк пішов у відставку, його замінив радикальний кемаліст Фаліх Рифки Атай, який проголосив Другу турецьку революцію і відновив Трибунали незалежності для обвинувачених у зраді Республіки."
 turkey_skeleton_news.8.a: "Демократія задушена в колисці."

 turkey_skeleton_news.9.t: "[Get_newspaper_header]Криза відставок — турецькі міністри йдуть з посад"
 turkey_skeleton_news.9.d: "Хвиля відставок потрясла уряд прем'єр-міністра Ґюлека, всі вони прийшли від старших членів його партії, РНП. Реформістська програма Ґюлека з лібералізації законів про свободу слова та публічні збори, а також змінення конституції та відсторонення старої гвардії на користь реформістів відштовхнула основну частину партії. Лідером цієї хвилі став міністр закордонних справ Ніхат Ерім, давній суперник Ґюлека.\n\nЦі відставки були засуджені коаліційними партнерами прем'єр-міністра в ДПВ та реформістами в його власній партії, які висловили свою підтримку йому та його політиці. Однак з огляду на численні зв'язки Еріма у парламенті та й без того неприязно налаштовану Велику раду кемалізму, програма Ґюлека, ймовірно, буде зупинена, якщо він не вирішить кризу найближчим часом."
 turkey_skeleton_news.9.a: "РНП повинна відмовитися від свого авторитарного минулого — або ні."

 turkey_skeleton_news.10.t: "[Get_newspaper_header]РНП забезпечує переобрання в Туреччині"
 turkey_skeleton_news.10.d: "Підрахунок голосів на другі вільні вибори в історії Туреччини показав, що чинна РНП та прем'єр-міністр Касим Ґюлек зберегли владу. Це сприймається як вотум довіри реформістській політиці Ґюлека, який віддалив РНП від її нещодавнього авторитарного минулого. Президент Ісмет Іньоню, що є об'єднавчою фігурою для реформістів РНП та поміркованого крила, виступив разом з Ґюлеком на мітингу перемоги в Анкарі, прославляючи досягнення уряду Ґюлека.\n\nПоки опозиційні партії розмірковують над результатами, сама РНП також, схоже, поглядає вглиб себе, оскільки аналітики припускають, що міжпартійні конфлікти ще не були повністю вирішені. Хоча ортодоксальне крило партії втратило значну частину свого впливу, гостріший контраст намічається в середині колись єдиного реформістського крила, зокрема між більш лівими реформістами, очолюваними міністром праці Бюлентом Еджевітом, та більш правими реформістами, які підтримують міністра внутрішніх справ Турхана Фейзіоґлу."
 turkey_skeleton_news.10.a: "Реформізм продовжує свій шлях."

 turkey_skeleton_news.11.t: "[Get_newspaper_header]Ісмет Іньоню йде у відставку, Касим Ґюлек обраний президентом Туреччини"
 turkey_skeleton_news.11.d: "Цілий етап в історії турецької політики сьогодні закінчився - президент Ісмет Іньоню оголосив про своє негайну відставку. Іньоню, герой війни за незалежність і правиця Мустафи Кемаля Ататюрка, тримався за посаду президента протягом 30 років, але врешті-решт відійшов через проблеми зі здоров'ям, згідно з внутрішніми джерелами.\n\nНа спеціальній сесії Великої національної асамблеї прем'єр-міністр Касим Ґюлек був обраний на заміну Іньоню. Тепер, коли харизматичний реформіст займає найвищу посаду в країні, очікується, що РНП скоро збереться і вибере того, хто займе вакантну посаду прем'єр-міністра. Це не буде легко, оскільки внутрішньопартійні напруженості між лівими та правими реформістами, які раніше примудрявся збалансувати Ґюлек, ймовірно, скоро стануть критичними."
 turkey_skeleton_news.11.a: "За нову еру!"

 turkey_skeleton_news.12.t: "[Get_newspaper_header]Бюлент Еджевіт виграє на з'їзді РНП"
 turkey_skeleton_news.12.d: "У Турецькій республіці з'їзд партії правлячої РНП обрав міністра праці Бюлента Еджевіта головою партії, а пізніше і прем'єр-міністром. Це сталося після того, як президент Ісмет Іньоню пішов у відставку через погіршення здоров'я, і тодішній прем'єр Касим Ґюлек був обраний президентом, що створило вакантне місце в кабінеті, яке з'їзд партії зібрався заповнити.\n\nТепер стало зрозуміло, що Еджевіт займе цю посаду після підтвердження Великою національною асамблеєю. Це велика перемога ліво-реформістського крила РНП, яке протягом тривалого часу підтримувало ідеї соціального благополуччя, прав робітників та реформування кооперативів, і яку Еджевіт активно пропагував. У свою чергу, праві реформісти під керівництвом міністра внутрішніх справ Турхана Фейзіоґлу сильно розчаровані результатами, заявляючи, що підйом Еджевіта є доказом того, що партія потрапила в руки радикальних і «більшовицьких» елементів. Чутки про наближення розколу партії виглядають обґрунтованими."
 turkey_skeleton_news.12.a: "Майбутній напрямок кемалізму визначено."

 turkey_skeleton_news.13.t: "[Get_newspaper_header]Турхан Фейзіоґлу виграє на з'їзді партії РНП"
 turkey_skeleton_news.13.d: "У Турецькій Республіці з'їзд партії правлячої РНП обрав міністра внутрішніх справ Турхана Фейзіоґлу головою партії, а пізніше і прем'єр-міністром. Це сталося після того, як президент Ісмет Іньоню пішов у відставку через погіршення здоров'я, і тодішній прем'єр Касим Ґюлек був обраний президентом, що створило вакантне місце в кабінеті, яке з'їзд партії зібрався заповнити.\n\nТепер стало зрозуміло, що Фейзіоґлу займе цю посаду після підтвердження Великою національною асамблеєю. Це велика перемога правого реформістського крила РНП, яке підтримує ідеї національного розвитку, антирадикалізму та посилення зв'язків між приватним та державним бізнесом, які активно пропагував Фейзіоґлу. У свою чергу, ліві реформісти під керівництвом міністра праці Бюлента Еджевіта сильно розчаровані результатами, заявляючи, що підйом Фейзіоґлу є доказом того, що партія повертається до «реакційних і пекеристських практик». Чутки про наближення розколу партії виглядають обґрунтованими."
 turkey_skeleton_news.13.a: "Майбутній напрямок кемалізму визначено."

 turkey_skeleton_news.14.t: "[Get_newspaper_header]Військові реформи в Туреччині"
 turkey_skeleton_news.14.d: "Міністр національної оборони Сейфі Куртбек оголосив про широкий пакет військових реформ, спрямованих на покращення бойової готовності після Другої Італо-Турецької війни. Хоча більшість реформ зосереджена на модернізації та механізації, з великою сумою, виділеною на поліпшення стану турецьких транспортних засобів та інтеграцію зв'язку «повітря - земля», пакет реформ також включає суперечливу реструктуризацію армії, підпорядковуючи її цілком Міністерству національної безпеки та припиняючи її де-факто незалежність.\n\nКуртбек, з огляду на вимоги його відставки після того, як преса оприлюднила докази його причетності до невдалої спроби перевороту проти колишнього президента Ісмета Іньоню, отримав повну підтримку прем'єр-міністра Аднана Мендереса. На цей момент конфлікт між армією та цивільним урядом, здається, виграний урядом Мендереса."
 turkey_skeleton_news.14.a: "Тигр на ланцюгу."

 turkey_skeleton_news.15.t: "[Get_newspaper_header]Міністр Туреччини Сейфі Куртбек подає у відставку"
 turkey_skeleton_news.15.d: "Сейфі Куртбек, міністр національної оборони Туреччини, сьогодні подав у відставку після тривалих критичних публікацій в ЗМІ, що викрили його плани щодо перевороту проти Ісмета Іньоню, колишнього президента Туреччини. Куртбек був суперечливою фігурою на посаді, оскільки його запропоновані військові реформи передбачали усунення кількох видатних генералів, що підтримують РНП, і, найголовніше, підпорядкування армії Міністерству національної безпеки. Президент Аднан Мендерес, під тиском з боку армії та ЗМІ, оголосив про відставку Куртбека на короткій прес-конференції та покинув її без подальших коментарів.\n\nЦю новину з радістю сприйняли Збройні сили Туреччини, які, здається, задоволені тим, що зусилля Куртбека щодо припинення їх де-факто незалежності припинилися, коли його головний пропагандист вже не знаходиться при владі. Армія, здається, виграла свою боротьбу з урядом Мендереса."
 turkey_skeleton_news.15.a: "Армія святкує перемогу."

 #turkey_skeleton_news.16.t: "[Get_newspaper_header]Вибори 1967 року - Кризова неділя"
 #turkey_skeleton_news.16.d: "НДП виграли вибори 1967 року, як і очікувалося; однак Мендерес виступив проти Кьопрюлю на президентських виборах. Ситуація стає неконтрольованою."
 #turkey_skeleton_news.16.a: "Це спроба захоплення влади?"

 turkey_skeleton_news.17.t: "[Get_newspaper_header]Кризова неділя - Мендерес обраний президентом Туреччини"
 turkey_skeleton_news.17.d: "Після очікуваної перемоги НДП на недавніх виборах у Туреччині, передбачалося, що Фуат Кьопрюлю буде обраний Асамблеєю на другий президентський термін. Однак делегати були шоковані, коли прем'єр-міністр Аднан Мендерес висунув свою кандидатуру на пост президента, пішовши проти Кьопрюлю. Національні ЗМІ назвали цей скандал у останній момент «Кризовою неділею» - фракції, які підтримують або виступають проти Мендереса, намагалися виграти важливу номінацію.\n\nТепер же популіст з Айдина переміг свого колишнього наставника і зайняв пост президента, сформувавши уряд зі своїм близьким другом Мюкерремом Саролом на посаді прем'єр-міністра. Сюлейман Демірель і Садеттін Білґіч, яких раніше вважали протеже Мендереса, не були запрошені повернутися до уряду. Для багатьох прихильників Мендереса це велика перемога, але його критики побоюються, що турецька демократія, що існує лише кілька років, може вже бути небезпечно піддана під загрозу."
 turkey_skeleton_news.17.a: "Турки люблять своїх героїв..."

 turkey_skeleton_news.18.t: "[Get_newspaper_header]Кризова неділя - Демірель обраний прем'єр-міністром Туреччини"
 turkey_skeleton_news.18.d: "Після очікуваної перемоги НДП на недавніх виборах у Туреччині, передбачалося, що Фуат Кьопрюлю буде обраний Асамблеєю на другий президентський термін. Однак делегати були шоковані, коли прем'єр-міністр Аднан Мендерес висунув свою кандидатуру на пост президента, пішовши проти Кьопрюлю. Національні ЗМІ назвали цей скандал у останній момент «Кризовою неділею» - фракції, які підтримують або виступають проти Мендереса, намагалися виграти важливу номінацію.\n\nВрешті-решт, тиск зсередини та ззовні Асамблеї виявився надмірним, і сьогодні вранці Мендерес подав у відставку з уряду та НДП. Його наступником на посаді став міністр фінансів Сулейман Демірель, який виступає за вільний ринок. Міністр внутрішніх справ Садеттін Білґіч, який не зміг зайняти місце Мендереса, також подав у відставку і сформував нову партію — Міллієтчі Мухафазакар Парті, що складається з традиційних консервативних елементів."
 turkey_skeleton_news.18.a: "Це ранок понеділка..."

 turkey_skeleton_news.19.t: "[Get_newspaper_header]Кризова неділя - Білґіч обраний прем'єр-міністром Туреччини"
 turkey_skeleton_news.19.d: "Після очікуваної перемоги НДП на недавніх виборах у Туреччині, передбачалося, що Фуат Кьопрюлю буде обраний Асамблеєю на другий президентський термін. Однак делегати були шоковані, коли прем'єр-міністр Аднан Мендерес висунув свою кандидатуру на пост президента, пішовши проти Кьопрюлю. Національні ЗМІ назвали цей скандал у останній момент «Кризовою неділею» - фракції, які підтримують або виступають проти Мендереса, намагалися виграти важливу номінацію.\n\nВрешті-решт, тиск зсередини та ззовні Асамблеї виявився надмірним, і сьогодні вранці Мендерес подав у відставку з уряду та НДП. Його наступником на посаді став міністр внутрішніх справ Садеттін Білґіч, який очолює націоналістично-ісламістське крило партії. Міністр фінансів Сулейман Демірель, який не зміг зайняти місце Мендереса, також подав у відставку і сформував нову партію — Адалет Партісі, що складається з більш ліберально-консервативних елементів."
 turkey_skeleton_news.19.a: "Це ранок понеділка..."

 turkey_skeleton_news.20.t: "[Get_newspaper_header]Мендерес вносить зміни до Конституції Туреччини"
 turkey_skeleton_news.20.d: "З моменту свого обрання президентом Туреччини, аналітики помітили, що Аднан Мендерес все більше концентрує владу в своїх руках і все більш жорстко придушує будь-які прояви незгоди. Це досягло кульмінації сьогодні, коли Асамблея ухвалила поправку до Конституції, що скасовує посаду прем'єр-міністра і надає виконавчу владу президенту, подібно до США. Це велика перемога для Мендереса, чия хватка влади зміцнюється завдяки його численним прихильникам; його підтримувачі вважають його другим після Мустафи Кемаля Ататюрка, і, як Ататюрк, він врятує країну від деградації і демагогії як з крайньо правих, так і з крайньо лівих.\n\nХоча уряд Мендереса раніше лібералізував законодавство щодо турецької преси, це недавно стало відкочуватися, і критика Мендереса часто стикається з важкою рукою закону. Схоже, що іронія в тому, що чоловік, який виступав проти старої диктатури РНП, сам встановить диктатуру."
 turkey_skeleton_news.20.a: "Невже Туреччина ходить колами?"

 turkey_skeleton_news.21.t: "[Get_newspaper_header]Колишній прем'єр-міністр Туреччини вбитий"
 turkey_skeleton_news.21.d: "Сьогодні в Туреччині панує хаос через вбивство колишнього прем'єр-міністра Аднана Мендереса під час його передвиборної кампанії за повернення собі прем'єрства. За повідомленнями, Мендерес і його прихильники йшли через Анкару, коли зустріли протилежну ходу демонстрантів. Поліція врешті-решт розділила протиборчі групи, але Мендерес отримав смертельне ножове поранення від невідомого нападника під час заворушень.\n\nДраматичний кінець життя однієї з найбільш суперечливих фігур Туреччини, Мендерес покинув владу в ганебному вигнанні після порушення конституційних законів. Мендерес незабаром повернувся, заснувавши партію Міллєтин Демокрасі Партісі і намагаючись повернути посаду, яку його прихильники вважають неправомірно відібраною. Вже ходять чутки, хто може бути відповідальним за це вбивство, що ще більше поглиблює розкол у цій бурхливій молодій республіці."
 turkey_skeleton_news.21.a: "Неспокійна людина нарешті зупинена."

 turkey_skeleton_news.22.t: "[Get_newspaper_header]ДПВ переобрана в Туреччині"
 turkey_skeleton_news.22.d: "Політика реформ Демократичної партії відновлення здобула підтримку народу Туреччини, що забезпечило їй ще один термін при владі.\n\nЯк від новачків у турецькій політиці, багато хто мав високі очікування від амбітних заяв лідерів партії, і, здається, ці очікування були виправдані. НДП та РНП обидві визнали поразку, продемонструвавши відданість демократії, хоча РНП і робила це з певною неохотою. Лідери ДПВ подякували публіці за підтримку і пообіцяли більше реформ, орієнтованих на лівих і робітничий клас, дотримуючись курсу на більш рівну Туреччину."
 turkey_skeleton_news.22.a: "Ліві, здається, все розуміють."

 turkey_skeleton_news.23.t: "[Get_newspaper_header]Протести КРПП охоплюють Туреччину"
 turkey_skeleton_news.23.d: "Конфедерація революційних профспілок працівників (КРПП) організувала серію трудових демонстрацій по всій Туреччині, і страйки та протести потрясли країну. Лідерство ДПВ зіткнулося з внутрішньою дилемою щодо того, як вирішити ситуацію.\n\nВідповіді на кризу були повільними та непослідовними. Серед соціалістичного крила партії є ті, хто симпатизує протестувальникам, бажаючи надати їм деякі поступки. Серед ліберального крила перемогли прагматизм і порядок, і аналітики побоюються, що ці дві позиції можуть бути несумісні."
 turkey_skeleton_news.23.a: "Внутрішні суперечки серед лівих. Типово."

 turkey_skeleton_news.24.t: "[Get_newspaper_header]Прем'єр-міністр Туреччини Айбар подає у відставку, Аліджан формує уряд"
 turkey_skeleton_news.24.d: "Екрем Аліджан — лідер ліберального крила Демократичної партії відновлення — став новим прем'єр-міністром, сформувавши уряд із заявленою метою припинити трудові протести під керівництвом КРПП, які паралізували країну.\n\nРаніше соціалістичне крило партії під керівництвом Мехмета Алі Айбара намагалося вести переговори з протестувальниками. Така примирливість поставила його в суперечність з іншими членами Асамблеї, що призвело до його відставки та масового виходу соціалістів з ДПВ до Робітничої партії Туреччини."
 turkey_skeleton_news.24.a: "Тепер буде порядок."

 turkey_skeleton_news.25.t: "[Get_newspaper_header]Турецькі ліберали подають у відставку через протести DİSK"
 turkey_skeleton_news.25.d: "Ліберальне крило Демократичної партії відновлення на чолі з Екремом Аліджаном подало у відставку масово, вказавши на ймовірне «загравання» з протестувальниками КРПП прем'єр-міністром Мехметом Алі Айбаром. Айбар вже давно висловлював симпатії до революційних профспілок, які паралізували Туреччину, що змусило Аліджана і його союзників створити нову альтернативу — Реформістську Демократичну партію.\n\nЦей вихід значно ослабив ДПВ, але дозволив їй повністю погодитися з соціалістичним баченням Айбара — зміна, яку, здається, прем'єр-міністр вважає прийнятною, судячи з його заяв у пресі."
 turkey_skeleton_news.25.a: "Він ніколи їх і не потребував."

 turkey_skeleton_news.26.t: "[Get_newspaper_header]Військовий переворот у Туреччині"
 turkey_skeleton_news.26.d: "Громадяни Туреччини увімкнули свої радіоприймачі сьогодні вранці і почули, що цивільний уряд був повалений, а країна опинилася в руках армійського «Комітету національної єдності». Оголошення зробив бригадний генерал Алпарслан Тюркеш, який наголосив, що переворот був здійснений на захист конституції і заради порятунку держави від «демагогії» після політичного глухого кута в Асамблеї, а нові вибори будуть проведені найближчим часом. Аднан Мендерес, якого критикували за спроби перетворити країну на диктатуру, перебуває під вартою армії, так само як і його опоненти з НДП.\n\nГенерал Джевдет Сунай був оголошений новим президентом, а Тюркеш і ще один впливовий офіцер, генерал армії Джемаль Маданоґлу, очікується, що обіймуть посади в кабінеті. Коментатори задаються питанням, наскільки тимчасовим буде це припинення турецької демократії."
 turkey_skeleton_news.26.a: "Подивимося, хто залишиться на виборчому бюлетені після того, як танки проїдуть."

 turkey_skeleton_news.27.t: "[Get_newspaper_header]Військовий переворот у Туреччині"
 turkey_skeleton_news.27.d: "Громадяни Туреччини увімкнули свої радіоприймачі сьогодні вранці і почули, що цивільний уряд був повалений, а країна опинилася в руках армійського «Комітету національної єдності». Оголошення зробив бригадний генерал Алпарслан Тюркеш, який наголосив, що переворот був здійснений для захисту конституції і порятунку нації від «большевизму», а нові вибори будуть проведені найближчим часом. Це сталося після того, як уряд був затягнутий у сварливі юридичні битви в конституційному суді через контроверсійний реформістський пакет ДПВ.\n\nГенерал Джевдет Сунай був оголошений новим президентом, а Тюркеш і ще один впливовий офіцер, генерал армії Джемаль Маданоґлу, ймовірно, матимуть вплив на Комітет. Коментатори задаються питанням, наскільки тимчасовим буде це припинення турецької демократії."
 turkey_skeleton_news.27.a: "Подивимося, хто залишиться на виборчому бюлетені після того, як танки проїдуть."

 #turkey_skeleton_news.28 перепрофільовано для Тургута Озала, який сформує уряд після Ніхата Еріма

 turkey_skeleton_news.28.t: "[Get_newspaper_header]Ніхат Ерім формує технократичний уряд"
 turkey_skeleton_news.29.d: "Демократизація Туреччини, яку вела армія під керівництвом генерала Маданоґлу, призвела до поляризованих і оскаржуваних результатів виборів. Оскільки рани після перевороту досі болять в молодій республіці, не вдалося досягти угоди про коаліцію між протилежними партіями. Це призвело до того, що армія змусила Ніхата Еріма, політика з РНП, подати у відставку та сформувати технократичний уряд за підтримки трьох поміркованих партій: РНП, ПС та РДП.\n\nРаніше лідер «ортодоксального» крила РНП, Ерім відомий як довготривалий поміркований голос у партії, борючись і з радикальними, і з реформістськими елементами. Його команда освічених технократів і обіцянки стабільності та зростання зацікавили багатьох, але для більшості турецької публіки він виглядає як маріонетка для армії, щоб ще більше закріпити їх контроль."
 turkey_skeleton_news.29.a: "Чи буде він тим, хто принесе мир у Туреччину?"

 turkey_skeleton_news.30.t: "[Get_newspaper_header]Технократичний уряд Туреччини розвалюється"
 turkey_skeleton_news.30.d: "Технократичний уряд Туреччини під керівництвом прем'єр-міністра Ніхата Еріма та його коаліції — яка складається з Республіканської народної партії, Реформістської демократичної партії та Партії справедливості — розвалився через ескалацію соціальної та економічної кризи.\n\nУряд був сформований під військовим наглядом з метою стабілізувати країну, але Ерім не зміг виконати свої обіцянки перед загальною публікою та Асамблеєю. Турецька економіка досі не вийшла з недавньої кризи, а внутрішня боротьба в коаліції паралізувала уряд. Визнання Ерімом поразки означає, що представник армії оголосив про проведення нових виборів."
 turkey_skeleton_news.30.a: "Тільки експерт може вирішити проблему."

 turkey_skeleton_news.28.t: "[Get_newspaper_header]Патріотична партія виграє вибори 1971 року в Туреччині"
 turkey_skeleton_news.28.d: "З розвалом уряду Еріма та масовими протестами вулицями Туреччини країна пережила хвилю антиурядових протестів. Оскільки політична еліта не змогла відновити довіру громадськості, нова партія — Патріотична партія — скористалася цією хвилею для здобуття влади на останніх виборах.\n\nГолова Патріотичної партії Турґута Озал, колишній інженер-електрик та бюрократ, приніс перемогу на посаді прем'єр-міністра з програмою масової приватизації та структурних реформ, щоб покінчити з економічною кризою країни та підвищити довіру інвесторів. У своєму телевізійному виступі з перемогою Озал пообіцяв покласти край національній кризі та повернути «справжні кемалістські цінності», які, на його думку, попередні уряди «перекрутили»."
 turkey_skeleton_news.28.a: "Цього разу вони зроблять усе правильно."

 turkey_skeleton_news.31.t: "[Get_newspaper_header]Турецьке економічне диво"
 turkey_skeleton_news.31.d: "У Туреччині технократичний прем'єр-міністр Ніхат Ерім був обраний головою РНП. Його успішну економічну політику, яку називають турецьким дивом, привітали як завершення хаосу, що настав після перевороту, і він тепер веде свою партію до більшості на турецьких виборах.\n\nХоча іноземні експерти ставлять під сумнів легітимність перемоги Еріма на виборах, турецька публіка поки задоволена результатами і хоче продовжити зростання та стабільність, які прийшли з урядом Еріма. Однак, засилля в бюрократії країни управлінців із РНП нагадує деяким критикам про період одно-партійної влади. Економічні прогнози обіцяють сильне зростання, але політична сцена стала вужчою, і те, що залишилося, знаходиться під контролем прем'єр-міністра."
 turkey_skeleton_news.31.a: "Туреччина обміняла свободу на процвітання."

 turkey_skeleton_news.32.t: "[Get_newspaper_header]Демократизація в Туреччині призупинена, військове правління триває"
 turkey_skeleton_news.32.d: "Ті, хто сподівався, що військове правління в Туреччині буде коротким, як обіцялося спочатку, сьогодні побачили, що їхні надії не виправдалися. Спікер правлячого Комітету національної єдності оголосив, що планований перехід до цивільного правління відкладається «на невизначений термін». Він посилається на постійну політичну нестабільність, і КНЄ планує розпочати формалізацію військового контролю над державою.\n\nЦей крок, як вважають, є результатом роботи радикального крила КНЄ на чолі з крайньо правим бригадним генералом Алпарсланом Тюркешем та його молодими офіцерами, які вбачають в скасуванні демократії можливість сформувати націю за своїм розумінням. Тим часом генерал Джемаль Маданоґлу був переведений на дипломатичну посаду за кордон. Поширюються чутки про боротьбу за владу між двома чоловіками — боротьбу, в якій Тюркеш, здається, переміг."
 turkey_skeleton_news.32.a: "Турецька демократія не мала шансів."
 turkey_skeleton_news.32.b: "Ліберальна демократія зазнає поразки всюди, де її намагаються втілити."

 turkey_skeleton_news.33.t: "[Get_newspaper_header]Алпарслан Тюркеш стає лідером Туреччини"
 turkey_skeleton_news.33.d: "Президент Туреччини Джевдет Сунай подав у відставку на користь генерала Алпарслана Тюркеша, який поєднує посаду президента та роль лідера правлячого Комітету національної єдності країни. У супроводжуючих оголошеннях вказано, що Комітет скоро буде розпущений, а Асамблея в Анкарі буде реорганізована як «Асамблея засновника», до складу якої увійдуть перевірені армією делегати з двох легальних партій — РНП та нової партії, заснованої та очолюваної Тюркешем, — «Міллі Бірлік Партісі» (Партія національної єдності).\n\nХоча внутрішня діяльність військового уряду Туреччини залишалася прихованою в таємниці, чутки про те, що радикальне крило відсторонило помірковані сили під керівництвом Суная, майже підтвердилися, і Тюркеш усе більше став виступати публічно, розповідаючи про свої власні ідеологічні засади. Його горда і запальна націоналістична політика проповідує ісламський моральний кодекс, швидку індустріалізацію та повну підпорядкованість державі."
 turkey_skeleton_news.33.a: "Його послідовники називають його башбуґ - великий лідер."

 turkey_skeleton_news.34.t: "[Get_newspaper_header]Непокірні турецькі генерали зазнали поразки"
 turkey_skeleton_news.34.d: "Інцидент 22 квітня, ймовірно, закріпив те, що здавалося швидким занепадом правління РНП, призначивши радикального кемаліста Фаліха Рифки Атая прем'єр-міністром, проте численні генерали відмовилися від цього явного відхилення від демократії. Розкидані по країні, вони разом із урядом Демократичного альянсу в Стамбулі намагалися зробити опір цьому авторитарному заходу. Після двох років того, що багато хто вважає турецькою громадянською війною, що викликала святкування одних і терор інших, вони зазнали поразки.\n\nПовідомлення поступають про колони танків, що марширують по вулиці Істікляль; протестуючих судять тисячами, а Друга турецька революція прем'єр-міністра Атая тепер на повному ходу. У той час як Анкара відновлює контроль над рештою країни, включаючи найбільше місто, тепер зрозуміло, що ця короткочасна спроба опору завершилася насильницьким кінцем."
 turkey_skeleton_news.34.a: "Привид Пекера мучить країну."

 turkey_skeleton_news.35.t: "[Get_newspaper_header]Непокірні генерали скидають турецький уряд"
 turkey_skeleton_news.35.d: "Інцидент 22 квітня, оголошений теперішнім колишнім прем'єр-міністром Атаєм як початок Другої турецької революції і святкований радикальним крилом РНП, незважаючи на широку підтримку серед військових офіцерів, зрештою був скасований.\n\nТурецькі генерали, які протестували проти цього консолідаційного кроку, разом з урядом Стамбула, здобули несподівану перемогу над радикальними кемалістами після двох років кровопролитного конфлікту, що нагадував громадянську війну. Генерал Першої армії Сейфі Куртбек був одноголосно обраний президентом; він особисто очолив марш на Анкару і прийняв відставку тепер двічі осоромленого Іньоню. Після того, як він запропонував помилування та амністію багатьом заради єдності, роль створення нової конституції та відновлення демократії тепер в його руках."
 turkey_skeleton_news.35.a: "Хоч цього разу народ і армія згодні."

 turkey_skeleton_news.36.t: "[Get_newspaper_header]Прем'єр-міністр Фаліх Рифки Атай відсторонений"
 turkey_skeleton_news.36.d: "Коли стався Інцидент 22 квітня, багато хто відзначав порівняльну нерішучість президента Іньоню щодо Атая, призначеного прем'єр-міністром під час перевороту. Спекуляції щодо його зменшення влади набули популярності, але, здається, ці побоювання нарешті розвіялися, оскільки він зміг відновити контроль над ситуацією і усунути Атая вдруге у своїй знаменитій президентській кар'єрі, разом із цим усунувши загрозу від радикальних кемалістів, які часто ставали йому на заваді.\n\nНа місце Атая призначено Ніхата Еріма, набагато більш ідеологічно сумісного з Іньоню, який раніше вважався найбільш імовірним наступником Атая після його відставки 1954 року. Супроводжуючи це звільнення хвилею понижень та переведень його союзників у партії, однак, оскільки Атай фактично був відповідальним за схвалення перевороту Іньоню, його подальші кроки залишаються невідомими, і Туреччина 50-х років, схоже, повернулася, і це може бути як на краще, так і на гірше."
 turkey_skeleton_news.36.a: "Історія не повторюється, але часто римується."

 turkey_skeleton_news.37.t: "[Get_newspaper_header]Фаліх Рифки Атай призначений президентом Туреччини"
 turkey_skeleton_news.37.d: "Тепер, коли РНП перемогла загрозу від невірних генералів, політичні аналітики по всьому світу задаються питанням, що саме відбудеться після передбачуваної перемоги Анкари. Однак, оскільки президент Ісмет Іньоню йде у відставку на користь прем'єр-міністра Фаліха Рифки Атая, очевидно, що Атай — призначений прем'єр-міністром вдруге під час перевороту — і його радикальні кемалістські союзники, нарешті, повернулися до влади в партії.\n\nАтай, який до перевороту був головою Великої ради кемалізму, а також де-факто лідером послідовників Пекера в партії, став постійною занозою в боці Іньоню, якщо вірити інсайдерським повідомленням. Один з головних рушіїв перевороту, а можливо навіть відставки Іньоню, або, за чутками, його правління очікується як таке, що буде радикальним і революційним, що навіть перевищить те, що відбувалося за Пекера, і все, що може зробити нація — це спостерігати."
 turkey_skeleton_news.37.a: "Чи хотів би це Ататюрк?"

 turkey_skeleton_news.38.t: "[Get_newspaper_header]Фракція Йон піднімається до влади в Туреччині"
 turkey_skeleton_news.38.d: "Після смерті президента Атая очікувана боротьба за владу у Великій раді кемалізму привела до перемоги фракції Йон. Відомі своїми гетеродоксальними ідеологічними позиціями, новий уряд вважає, що якщо правильно реалізувати кемалізм, він стане дорогою до соціалізму.\n\nДоґан Авджіоґлу — відомий академік — був призначений на пост прем'єр-міністра, а давній союзник покійного президента і кемалістський ідеолог Шевкет Сюрейя Айдемір зайняв місце Атая. Їхня мета — це вид соціалізму, що ґрунтується на турецькій ідентичності, що вписує майбутнє нації у їхнє кемалістське бачення."
 turkey_skeleton_news.38.a: "Щось революційне з чимось знайомим."

 turkey_skeleton_news.39.t: "[Get_newspaper_header]Фракція Юлькю піднімається до влади в Туреччині"
 turkey_skeleton_news.39.d: "Після смерті президента Атая очікувана боротьба за владу у Великій раді кемалізму призвела до перемоги фракції Юлькю. Орієнтуючись на відродження візії Туреччини Реджепа Пекера, новий уряд спрямований на національне відродження старої корпоративістської держави 40-х і початку 50-х років.\n\nНовим президентом, наступником Атая, став Шюкрю Сьокменсюер, герой війни і давній союзник Пекера, чия стабілізуюча присутність, можливо, покликана збалансувати радикалізм нового прем'єр-міністра Талата Айдеміра. Айдемір раніше очолював Молодіжний рух кемалістів, організацію, яка вважається частиною програми розвитку молоді та частиною парамілітарної мережі."
 turkey_skeleton_news.39.a: "Мир вдома."

 turkey_skeleton_news.40.t: "[Get_newspaper_header][GetTURLeftKemalistPartyName] Перемагає на виборах 1971 року"
 turkey_skeleton_news.40.d: "Вибори в Туреччині завершилися з перемогою партії лівих кемалістів, назва якої - [GetTURLeftKemalistPartyName]. Після оголошення результатів лідер партії Бюлент Еджевіт привітав натовпи тріумфуючих прихильників у Анкарі, заявивши, що це перемога не тільки для партії та її програми «лівого центру», але й для турецького народу. Ліберальна партія, [GetTURLiberalPartyName], очікується як молодший коаліційний партнер у новому уряді.\n\n[GetTURLeftKemalistParagraph]"
 turkey_skeleton_news.40.a: "[GetTURLeftKemalistOptionText]"
 TUR_left_kemalist_paragraph_a: "Близько 50-річне правління РНП в Туреччині, здається, продовжиться на найближчі роки, хоча партія, яку очолює Еджевіт, зазнала значних змін. Тепер партія орієнтується на ліві ідеї, хоча деякі політики РНП вважають це лише сучасним виразом оригінальних кемалістських цінностей реформізму, державізму та секуляризму. У будь-якому випадку, здається, що РНП все ще не втратила довіри народу."
 TUR_left_kemalist_paragraph_b: "З початку вільних виборів у 1963 році РНП витратив свій час в опозиції, позбуваючись своїх авторитарних елементів, і під керівництвом Еджевіта партія змінила орієнтацію на ліво, з більш правими реформістами під керівництвом Турхана Фейзіоґлу, які відокремилися. Тепер кампанія РНП, яка наголошує на соціальній справедливості, земельній реформі та правах працівників, здається, виправдала програму «Лівого центру», яку підтримує Еджевіт, як життєздатну тенденцію кемалізму — можливо, ту, яка найкраще підходить для нового десятиліття."
 TUR_left_kemalist_paragraph_c: "Лідерство ДПЛ складається з лівих колишніх членів РНП, які відокремилися після того, як Турхан Фейзіоґлу став головою партії. Еджевіт повернувся після цієї поразки, перемігши своїх колишніх колег з виграшною кампанією, яка наголошує на соціальній справедливості, земельній реформі та правах працівників, виправдавши програму «Лівого центру» як життєздатну тенденцію кемалізму — можливо, ту, яка найкраще підходить для нового десятиліття."
 TUR_left_kemalist_option_a: "Голуб миру вилітає з залізної руки."
 TUR_left_kemalist_option_b: "Шість стріл у іншому сагайдаку."

 turkey_skeleton_news.41.t: "[Get_newspaper_header][GetTURRightKemalistPartyName] Перемагає на виборах 1971 року"
 turkey_skeleton_news.41.d: "Нещодавні вибори в Туреччині завершилися перемогою правих кемалістів - перемогла [GetTURRightKemalistPartyName]. Лідер партії Турхан Фейзіоґлу виступив з промовою до натовпу в Анкарі, розповідаючи про виклики, з якими зіштовхуватиметься нація в новому десятилітті, і як кемалізм є єдиним вирішенням цих проблем.\n\n[GetTURRightKemalistParagraph]"
 turkey_skeleton_news.41.a: "Нова ітерація кемалізму."
 TUR_right_kemalist_paragraph_a: "Близько 50-річне правління РНП в Туреччині, здається, продовжиться на найближчі роки, хоча партія, яку очолює Фейзіоґлу, зазнала значних змін. Тепер партія орієнтується на праві ідеї, хоча деякі політики РНП вважають це лише сучасним виразом оригінальних кемалістських цінностей популізму, державізму та націоналізму. У будь-якому випадку, здається, що РНП все ще не втратила довіри народу."
 TUR_right_kemalist_paragraph_b: "З початку вільних виборів у 1963 році РНП витрачала свій час в опозиції, позбуваючись своїх авторитарних елементів, і під керівництвом Фейзіоґлу партія змінила орієнтацію на праві ідеї - більш ліві реформісти під керівництвом Бюлента Еджевіта відокремилися. Тепер кампанія РНП, яка наголошує на економічному розвитку, законі та порядку та реформі освіти, привела партію до влади після восьми років, і тепер партія хоче зробити свій слід в історії Туреччини."
 TUR_right_kemalist_paragraph_c: "РПД виникла з правих колишніх членів РНП, які відокремилися після того, як Бюлент Еджевіт став лідером партії. Фейзіоґлу тепер переміг своїх колишніх колег з виграшною кампанією, яка наголошує на економічному розвитку, законі та порядку, а також реформуванні освіти, оновлюючи кемалізм для нового десятиліття."

 turkey_skeleton_news.42.t: "[Get_newspaper_header][GetTURPopConPartyName] перемагає на виборах 1971 року"
 turkey_skeleton_news.42.d: "Нещодавні вибори в Туреччині завершилися перемогою партії, назва якої - [GetTURPopConPartyName]; вона отримала найбільшу кількість голосів. Лідер партії Сюлейман Демірель привітав прихильників в Анкарі оживленою промовою, обіцяючи процвітання і свободу для турецького народу.\n\n[GetTURPopConParagraph]"
 turkey_skeleton_news.42.a: "Вчора — це вчора, сьогодні — це сьогодні."
 TUR_popcon_paragraph_a: "Колишній міністр фінансів, Демірель став лідером НДП і прем'єр-міністром після усунення Аднана Мендереса, і, подібно до Мендереса, його бомбастичний популізм викликає як захоплення, так і критику. Однак, здається, що турецький народ надав НДП свою довіру, сподіваючись, що Демірель зможе продовжити здійснювати обіцяний економічний розвиток."
 TUR_popcon_paragraph_b: "Маючи інженерну освіту і популістський політичний стиль, Демірель заснував ПС після того, як Садеттін Бігліч став лідером НДП, і суперництво між двома чоловіками врешті-решт призвело до розколу партії. Тепер, маючи національний мандат, Демірель прагне реалізувати свої плани швидкої індустріалізації та ринкових реформ."
 TUR_popcon_paragraph_c: "Складаючись з більш ліберальних і популістських елементів турецької правиці після розпуску НДП, фракціоналізм ПС зменшується завдяки об'єднуючій фігурі самого Деміреля. Тепер, маючи національний мандат, Демірель прагне нарешті втілити свої плани швидкої індустріалізації та ринкових реформ, щоб привести Туреччину у відповідність з розвиненими країнами Заходу."

 turkey_skeleton_news.43.t: "[Get_newspaper_header][GetTURPatConPartyName] перемагає на виборах 1971 року"
 turkey_skeleton_news.43.d: "Нещодавні вибори в Туреччині завершилися перемогою партії з назвою [GetTURPatConPartyName], яка отримала найбільшу кількість голосів. Лідер партії Садеттін Білґіч привітав натовпи прихильників в Анкарі, подякувавши їм за довіру, яку вони поклали у його партію для того, щоб зробити те, що найкраще для нації.\n\n[GetTURPatConParagraph]"
 turkey_skeleton_news.43.a: "Ісламісти та реакціонери при владі? Пекер би розлютився."
 TUR_patcon_paragraph_a: "Діючий прем'єр-міністр з моменту усунення Аднана Мендереса, Білґіч став поміркованою силою між конкурентними націоналістичними та ісламістськими секціями турецької правиці. Ще не ясно, чи продовжуватиметься ця рівновага, чи одна з тенденцій займе головну роль. Кампанія Білґіча на переобрання підкреслювала, що Туреччина є нацією принципів і що його місія полягає у захисті нації від радикалізму та поганого урядування."
 TUR_patcon_paragraph_b: "Після того, як його суперник Сулейман Демірель став лідером НДП після усунення Мендереса, партія розкололася за ідеологічними лініями, і більш націоналістичні та ісламські фракції під керівництвом Бігліча утворили MMP. Тепер, коли MMP очікується сформувати уряд, вони отримають можливість реалізувати повернення до традицій і соціальної держави, на яку вони провели свою кампанію. Оскільки секуляризм глибоко закріплений в юридичних нормах Туреччини, партії з більш про-релігійними тенденціями потрібно буде дотримуватися обережної лінії."
 TUR_patcon_paragraph_c: "Складаючись з більш націоналістичних та ісламських фракцій у НДП до її розпуску, MMP об'єднується завдяки поміркованій фігурі Бігліча. Тепер, коли MMP очікується сформувати уряд, вони отримають можливість реалізувати повернення до традицій і соціальної держави, на яку вони провели свою кампанію. Оскільки секуляризм глибоко закріплений в юридичних нормах Туреччини, партії з більш про-релігійними тенденціями потрібно буде дотримуватися обережної лінії."

 turkey_skeleton_news.44.t: "[Get_newspaper_header][GetTURLiberalPartyName] Перемагає на виборах 1971 року"
 turkey_skeleton_news.44.d: "Після завершення цьогорічних національних виборів, Республіка Туреччина отримала новий коаліційний уряд під керівництвом ліберальної партії, назва якій - [GetTURLiberalPartyName]. Голова партії Екрем Аліджан успішно домовився про широку коаліцію з двома іншими партіями для подальшої лібералізації та демократизації країни, зліва його підтримує Бюлент Еджевіт з партії, відомої як [GetTURLeftKemalistPartyName], а праворуч — Сулейман Демірель з партії, ім'я якій [GetTURPopConPartyName].\n\n[GetTURLiberalParagraph]"
 turkey_skeleton_news.44.a: "[GetTURLiberalOptionText]"
 TUR_liberal_paragraph_a: "Екрем Аліджан давно є носієм лібералізму в Туреччині, і як один з засновників ДПВ, він стояв на передовій боротьби з довготривалим перебуванням РНП при владі в 1963 році. Хоча його заслуги були затінені соціалістським крилом партії під прем'єр-міністром Айбаром, наслідки протестів КРПП дозволили Аліджану відновити свою посаду голови. Тепер Аліджан може реалізувати свою програму лібералізації ринку поряд з розширеною соціальною державою, оскільки нація відновлюється після справді хаотичного десятиліття."
 TUR_liberal_paragraph_b: "Екрем Аліджан давно є носієм лібералізму в Туреччині і був одним із засновників нещасливого опозиційного руху ДПВ. Після років напруженості ліберальне та соціалістичне крило партії розділилися, що дозволило Аліджану, більше не змагаючись із лівими, сформулювати програму лібералізації ринку поряд з розширеною соціальною державою, яка, очевидно, виграла підтримку більшості виборців на останніх виборах."
 TUR_liberal_option_a: "Туреччина все ще слідує західній моделі."
 TUR_liberal_option_b: "Ліберальна Туреччина? Як новина!"

 turkey_skeleton_news.45.t: "[Get_newspaper_header]Електоральний глухий кут на виборах 1971 року в Туреччині"
 turkey_skeleton_news.45.d: "Новини з Анкари повідомляють, що Турецька робітнича партія та її лідер Мехмет Алі Айбар, усміхнене обличчя соціалізму, змогли здобути більшість голосів. З виборчим блоком, що складається з меншин, профспілок, фермерів, інтелектуалів та студентів, його перемога потрясла країну до основ.\n\nНеприступні санітарні кордони навколо лівих руйнуються, оскільки кемалістські, консервативні та націоналістичні сили перебувають в дезорганізації щодо того, як вирішити результат. Навіть якщо їм удасться переконати лівих кемалістів, вони все одно далекі від більшості. Лідер ліберально-консервативної ДПЛ, старий колега і суперник Айбара, Екрем Аліджан, заявив, що вони будуть відкриті для переговорів, якщо Айбар готовий залишити свої радикальні політики, але для соціалістів вимоги ДПЛ є абсурдними, м'яко кажучи."
 turkey_skeleton_news.45.a: "Турецький соціалізм на переломному етапі."

 turkey_skeleton_news.46.t: "[Get_newspaper_header]ТРП формує уряд у Туреччині"
 turkey_skeleton_news.46.d: "Турецька робітнича партія під керівництвом Мехмета Алі Айбара погодився сформувати коаліційний уряд із лівопоміркованими партіями Екрема Аліджана та Бюлента Еджевіта. Усвідомлюючи свої обмежені мандати, Айбар вирішив співпрацювати замість того, щоб слідувати непохитній лівій політиці.\n\nЦе рішення викликало гостру критику з боку радикальної лівиці, яка звинувачує Айбара в марнотратстві рідкісної можливості для революційних змін, працюючи з «буржуазними партіями», стверджуючи, що коаліція розмиє соціалістичні цілі ТРП. Попри суперечності, Айбар залишається відданим реалізації реформ, які спрямовані на права працівників та справедливішу Туреччину."
 turkey_skeleton_news.46.a: "Є гідність у компромісі."

 turkey_skeleton_news.47.t: "[Get_newspaper_header]Друга турецька революція"
 turkey_skeleton_news.47.d: "Турецька робітнича партія під керівництвом Мехмета Алі Айбара продовжує формувати уряд, незважаючи на свою меншість у парламенті. Айбар разом з іншими посадовцями партії закликав турецький робочий клас піднятися в спонтанному акті солідарності, закликаючи до радикальних змін у суспільстві.\n\nЦей сміливий крок викликав занепокоєння серед військових і опозиції, які бояться, що риторика ТРП сигналізує про перехід до більш крайніх політик. Вже почалися вуличні зіткнення за участю прихильників Айбара, і економічна нестабільність невідворотна, оскільки інвестори висловлюють занепокоєння щодо політичного клімату країни. Перспектива подальших заворушень здається неминучою, оскільки уряд Айбара стикається з дедалі більшою опозицією зсередини та ззовні."
 turkey_skeleton_news.47.a: "Знаєте, Маркс це все передбачив."
 
 turkey_skeleton_news.48.t: "[Get_newspaper_header]СДП виграє загальні вибори в Туреччині"
 turkey_skeleton_news.48.d: "Після успіху в їхній «Революції демократії» Демократичний альянс та президент Куртбек розпустили свій тимчасовий уряд, щоб створити уряд демократичний. Нову конституцію було прийнято через референдум, що надає турецькому народу багато нових свобод, яких однопартійний режим позбавляв їх протягом років. Країна нарешті стабілізується після Інциденту 22 квітня, і тепер пройшли перші повністю демократичні вибори.\n\nНа чолі новоствореної Соціал-демократичної партії стоїть Туран Ґюнеш, видатний політик центру-ліву орієнтацію, і він зміг виграти вибори з обіцянками побудувати соціальну державу та покращити права працівників, при цьому дотримуючись нової конституції. Створивши коаліцію з Екремом Аліджаном та ліберально-консервативним ДЛП, новий уряд має за завдання зцілити молоді травми Республіки через демократію.\n"
 turkey_skeleton_news.48.a: "Турецька демократія отримує другий шанс на життя."

 turkey_skeleton_news.49.t: "[Get_newspaper_header]ДРП виграє загальні вибори в Туреччині"
 turkey_skeleton_news.49.d: "Після успіху в їхній «Революції демократії» Демократичний альянс та президент Куртбек розпустили свій тимчасовий уряд, щоб створити уряд демократичний. Нову конституцію було прийнято через референдум, що надає турецькому народу багато нових свобод, яких однопартійний режим позбавляв їх протягом років. Країна нарешті стабілізується після Інциденту 22 квітня, і тепер пройшли перші повністю демократичні вибори.\n\nДочка покійного політика Джелала Баяра, Нілюфер Ґюрсой, і її Демократично-республіканська партія здобули перемогу. Ставши першою жінкою-прем'єр-міністром країни, Ґюрсой прийняла естафету від свого покійного батька та Мендереса, обіцяючи консерватизм після років безперервних кемалістських реформ. У коаліції з ДЛП, ДРП шукає рішення економічних проблем країни через приватні інвестиції та сільське господарство."
 turkey_skeleton_news.49.a: "Демократія, гідність та єдність."

 turkey_skeleton_news.50.t: "[Get_newspaper_header]Туреччина досягає ядерної зброї"
 turkey_skeleton_news.50.d: "Ще одна секунда пройшла на атомному годиннику сьогодні - уряд Туреччини оголосив, що країна здійснила свій перший успішний ядерний тест. Хоча раніше було відомо, що Тріумвірат займався ядерною дослідницькою програмою, вважалося, що ця програма все ще знаходиться на теоретичному етапі до моменту розпаду альянсу. Очевидно, Туреччина вела свої власні секретні дослідження атомної енергії — дослідження, які тепер увінчалися успіхом.\n\nПопри загальне піднесене ставлення в турецькій пресі до їхнього наукового досягнення, критики вдома і за кордоном ставлять питання, що це означає для подальшого поширення ядерної зброї. Оскільки Туреччині вдалося так добре приховати свою ядерну програму, деякі запитують, коли буде зроблено наступний крок — і яка наступна країна оголосить подібне. Рим та Ґерманія швидко засудили Туреччину за «дестабілізацію балансу сил у регіоні». Від решти світу поки що жодної реакції."
 turkey_skeleton_news.50.a: "Півмісяць сяє ще яскравіше."
 
 ## Скелетні події щодо статусу партнера для виправлення
 
 turkey_faction_skeleton.1.t: "Турецький уряд подає заявку на статус спостерігача в ОВН"
 turkey_faction_skeleton.1.d: "Дипломати від Республіки Туреччина звернулися до нас з пропозицією — вони подали заявку на статус спостерігача в ОВН. Хоча Туреччина воювала разом з німцями під час війни, багато що змінилося за два десятиліття, які пройшли для цієї країни Близького Сходу.\n\n[GetTurkeyOFNApplicationParagraph]\n\nОкрім ідеологічних міркувань, цей крок має очевидну практичну вигоду для обох сторін. Турецька економіка, що розвивається, отримає вигоду від збільшення інвестицій з боку Америки та інших західних країн, а турецька безпека може полегшитися тепер, коли за їх спиною стоїть реальна світова супердержава. З іншого боку, стратегічне розташування Туреччини між Європою та Азією робить її цінним союзником. Хоча Туреччина надто обережна, щоб стати повноцінним членом ОВН, вона тепер рішуче ставить свою ногу в наш табір."
 turkey_faction_skeleton.1.UDP: "З часу приходу до влади в 1963 році, правляча партія НДП активно працює над руйнуванням інститутів однопартійного правління і відкриттям турецького суспільства, доводячи, що заклик до свободи і волі чути по всьому світу. Це привернуло увагу багатьох політиків нашого альянсу."
 turkey_faction_skeleton.1.CHP: "РНП, яка колись підписала пакт з силами Осі, очевидно, не є тією ж партією, яка тепер стукає в наші двері. Правляча партія, пройшовши через великі політичні реформи, здобула підтримку турецького народу на виборах і змінила свій курс у зовнішній політиці. Це привернуло увагу багатьох політиків нашого альянсу."
 turkey_faction_skeleton.1.DYP: "Ліво-ліберальний уряд ДПВ у Туреччині, що проводить внутрішні реформи та демократизацію, зробив крок до вільного світу, і до інших розвинутих демократій, на прикладі яких Туреччина будувала свою модель з моменту заснування республіки. Це привернуло увагу багатьох політиків нашого альянсу."
 turkey_faction_skeleton.1.Junta: "Турецький уряд після перевороту — це велика коаліція, спрямована на відновлення стабільності та довіри, і альянс із світовою супердержавою може йому допомогти. Хоча демократичне майбутнє країни ще під питанням, їхня нова ліберальна конституція та жвава політична сцена привернули увагу багатьох політиків нашого альянсу."
 turkey_faction_skeleton.1.Menderes: "Кажуть, Туреччина любить своїх героїв, і це, здається, справедливо і для популістського президента Аднана Мендереса. З часу приходу до влади в 1963 році він зробив багато для руйнування старого однопартійного ладу, при цьому зберігаючи свої авторитарні тенденції на прийнятному рівні. Найважливіше, він дуже прагне поглибити економічні зв'язки, що привернуло увагу багатьох політиків нашого альянсу."
 turkey_faction_skeleton.1.a: "Ще одне очко вільному світу."

 turkey_faction_skeleton.2.t: "Турецький уряд подає заявку на статус спостерігача в Пакті"
 turkey_faction_skeleton.2.d: "Німецькі та турецькі дипломати нещодавно завершили і оприлюднили секретні переговори між Райхом і Туреччиною, що призвели до того, що Туреччина стала спостерігачем в Айнхайтспакті. Це було приємною несподіванкою, оскільки, хоча турки брали участь у нашій великій анти-більшовицькій кампанії, відносини після закінчення війни були досить холодними. Республіка Туреччина замість цього грала в дружбу з Італією, що закінчилося конфліктом.\n\n[GetTurkeyPaktApplicationParagraph]\n\nНезважаючи на те, що їхнє громадянське суспільство все ще тримає символічну антинімецьку стійку, лідери Туреччини визнають, що ми є господарями Європи, як і в 1942 році. Вони отримують економічні вигоди від більш тісних відносин з Ґерманією, а ми отримуємо стратегічного союзника, з якого можемо поширювати наш вплив на Близький Схід. Хоча турки не хочуть ставати повноправними членами Пакту, об'єднання їхньої сили з нашою принесе вигоду обом."
 turkey_faction_skeleton.2.UDP: "Після цього правляча кліка бюрократів втратила владу на користь НДП, партії широкого турецького правого спектру. З часу приходу до влади вони займаються розформуванням, реформуванням або повторним розподілом монолітного державного апарату, що залишився від диктатури. Очевидно бачачи, що німецька дружба та інвестиції можуть бути корисними для Туреччини, їхнє наближення до нас свідчить про те, що перемогли прагматичні голови."
 turkey_faction_skeleton.2.CHP: "З того часу правляча РНП позбулася багатьох своїх попередніх диктаторських основ і стала більш реформістською, обережно відкриваючи економіку та громадянське суспільство. Проте їхня прагматична лінія не була втрачена, що підтверджується цією примиренням."
 turkey_faction_skeleton.2.Junta: "З того часу армія була змушена втручатися у внутрішню політику, і військова хунта організувала новий уряд на чолі з Ніхатом Ерімом. Під величезним політичним тиском і бажанням досягти швидкого економічного зростання уряд Ерім вирішив, що Райх може забезпечити те, що їм так сильно бракує."
 turkey_faction_skeleton.2.Menderes: "Президент Туреччини Аднан Мендерес завершив свою дипломатичну поїздку до Рейху, придбавши новий автомобіль марки Фольксваґен, заявивши, що набагато більше якісних німецьких автомобілів скоро з'являться на турецьких дорогах. Його повідомлення для народу наголошує на економічних та споживчих перевагах, які Туреччина отримає від більш тісних зв'язків з Пактом."
 turkey_faction_skeleton.2.a: "Повернення блудного сина..."
 
 turkey_faction_skeleton.3.t: "Турецький уряд подає заявку на статус спостерігача в Сфері співпроцвітання"
 turkey_faction_skeleton.3.d: "До нас звернувся уряд Туреччини з дуже хорошою пропозицією — поданням заявки на статус спостерігача в Сфері співпроцвітання. Хоча Туреччина була відносно ізольована на геополітичній арені після розпаду Тріумвірату, здається, вони нарешті вирішили обрати бік.\n\n[GetTurkeySphereApplicationParagraph]\n\nХоча турки поки що виключили можливість повного членства, і наші відносини з Туреччиною менш розвинені, ніж ті, що ми традиційно мали з їхніми італійськими суперниками, об'єднання Азії в межах Сфери може лише зміцнити наш вплив на Близькому Сході та в інших регіонах. Як старі друзі, які довго не бачилися, ми чекаємо, що виросте з цього зв'язку."
 turkey_faction_skeleton.3.UDP: "Правляча партія НДП прагне розірвати зв'язки зі старим режимом різними способами, включаючи переорієнтацію зовнішньої політики від старих європейських союзників Туреччини. Турецькі дипломати вже висловили своє прагнення до подальшого відкриття економіки для товарів та інвестицій, які може надати Сфера."
 turkey_faction_skeleton.3.CHP: "Правляча партія РНП проходить процес трансформації та демократизації, прагнучи відмовитися від авторитарного стилю правління, який партія практикувала з 1920-х років. Це також означає, що неефективна та корпоративістська турецька економіка відкривається, і їхнє співробітництво зі Сферою пропонує чудову можливість скористатися цією ситуацією."
 turkey_faction_skeleton.3.Junta: "Уряд на чолі з Ніхатом Ерімом був організований збройними силами Туреччини для відновлення стабільності та довіри, і вони прийняли рішення, що дружба зі світовою супердержавою полегшить їхню складну задачу. Візія Еріма про технократичний уряд, відокремлений від політичних партій, що підкреслює економічне зростання та придушення політичних крайнощів, має чимало прихильників у парламенті."
 turkey_faction_skeleton.3.Menderes: "Президент Аднан Мендерес провів певну чарівну кампанію, захвалюючи антиімперіалістичні цінності Сфери та її величезний економічний потенціал, мріючи про те, що японське фінансування та інновації можуть зробити для Анатолії. У свою чергу, багато великих корпорацій Сфери задоволені тим, що знайшли такого хорошого бізнес-партнера в особі Мендереса."
 turkey_faction_skeleton.3.a: "Паназіатство зміцнюється з кожним днем!"

 turkey_faction_skeleton.11.t: "Вибір фракції"
 turkey_faction_skeleton.11.d: "Вітаю знову, пане геймере. Будь ласка, виберіть фракцію, яку вам подобається"
 turkey_faction_skeleton.11.a: "ОВН. Демократія, олей!"
 turkey_faction_skeleton.11.b: "Пакт, за всю славу"
 turkey_faction_skeleton.11.c: "Сфера, за процвітання"
 turkey_faction_skeleton.11.e: "Ніхто лол, ми самодостатні."
 