#Tree 
GAL_Galicia_Wakes_Up:0 "Галісія прокидається!" 
GAL_Galicia_Wakes_Up_desc:0 "Галісія прокидається! Час нашої свободи настав! Ми звільнилися від франкістського чобота після стількох років репресій і жорстокости, і тепер боротимемося, аби зберегти нашу свободу та мріяти про галісійську націю! Патріоти почули наш заклик, і новостворені ополчення марширують до кордону. Ми високо піднімемо наш синьо-білий прапор над нашими окопами та фортами, і якщо фалангіст чи республіканець поверне зброю проти нас, ми захищатимемо нашу нову республіку до останньої людини. Галісія прокинулася, і ми не повернемося покірно в ту добру ніч." 
GAL_Galicia_Wakes_Up_tt:0 "§MPois, onde quer, xigante a nosa voz pregoa a redenzón da boa Nazón de Breogán.§!"

GAL_War_Economy:0 "Воєнна економіка Галісії"
GAL_War_Economy_desc:0 "Нинішня економічна модель Галісії нестійка. Тотальна війна, у якій ми опинилися, вимагає тотальної мобілізації. Якщо ми збираємося вести війну за виживання нашої нації, ми повинні негайно розпочати трансформацію економіки. Воєнна праця матиме абсолютний пріоритет, а цивільна промисловість буде переведена на військове виробництво, якщо тільки в ній не буде суворої потреби. Усі доступні ресурси будуть спрямовані виключно на нашу воєнну промисловість, аби максимально використати наш обмежений промисловий потенціал. Цивільній промисловості доведеться обходитися тим, що вона зможе здобути сама. Лише драконівське економічне втручання врятує нас тепер."

GAL_Bleed_Mines:0 "Вичавити шахти"
GAL_Bleed_Mines_desc:0 "Хоча Галісія й не відома своєю гірничодобувною промисловістю, нинішнього видобутку наших шахт недостатньо. Нинішня ситуація вимагає від нас негайно збільшити внутрішнє виробництво металів, якщо ми хочемо зберегти промислову продуктивність на нинішньому рівні. Ми більше не можемо покладатися на внутрішні райони Іберії у постачанні ресурсів, необхідних нашій промисловості, тому потрібен радикальний перерозподіл робочої сили на користь шахт. Якщо необхідно, ми змусимо шахти працювати безперервно цілодобово, зі змінами одна за одною, де робітники працюватимуть день і ніч, аби врятувати Галісію. Війна, яку ведуть кирками під землею, так само важлива, як і війна, яку ведуть гвинтівками на передовій."

GAL_Reform_Baks:0 "Реформувати банки"
GAL_Reform_Baks_desc:0 "Щоб забезпечити фінанси, необхідні для поточного конфлікту, ми повинні реформувати банки в Галісії, зробивши їх більш готовими задовольняти наші потреби. Провівши закони, які змусять банки надавати нам позики та випускати воєнні облігації, ми зможемо отримати необхідні кошти для продовження забезпечення воєнної промисловости та наших збройних сил. Хоча банкіри можуть бурчати через наше втручання, можна не сумніватися, що вони були б ще менш задоволені, якби фалангістські танки чи республіканська піхота дефілювали Коруньєю через те, що наші воєнні зусилля виявилися недофінансованими."

GAL_Not_Wasted_Product:0 "Жодного змарнованого продукту"
GAL_Not_Wasted_Product_desc:0 "Якщо Галісія має пережити конфлікт, що лютує в Іберії, ми повинні максимально підвищити ефективність наших воєнних зусиль. Перехід до воєнної економіки та збільшення виробництва внаслідок цього — добрий початок, але все це нічого не варте, якщо ми марнуватимемо плоди своєї праці. Ми повинні скоротити споживання, і лише сувора дисципліна та нормування дозволять цього досягти. Загальному населенню надаватимуться лише найнеобхідніші речі, щоб наша армія в цей час національної кризи не залишалася з порожніми руками."

GAL_Not_Land_Without_Farmer:0 "Жодного клаптика землі без фермера"
GAL_Not_Land_Without_Farmer_desc:0 "Галісія ніколи не славилася ані найродючішими землями, ані їхньою кількістю, а тепер, коли ми також відрізані від будь-якої підтримки з внутрішніх районів Іберії, вкрай важливо використовувати те, що маємо, з максимальною ефективністю. Жоден гектар не залишиться необробленим нашими фермерами, а земля оброблятиметься ретельно, щоб ми могли скоротити дефіцит продовольства та зменшити залежність від імпорту, особливо коли тверду валюту можна було б використати для безпосередніших воєнних потреб. Досягнення самодостатности у виробництві продовольства є вкрай важливим!"

GAL_Not_Factory_Without_Worker:0 "Жодної фабрики без робітника"
GAL_Not_Factory_Without_Worker_desc:0 "Щоб максимально підвищити ефективність наших фабрик, ми повинні забезпечити відсутність нестачі доступної робочої сили, яку можуть використовувати наші майстри. Не повинно бути жодної фабрики без робітників, і ніщо не залишатиметься без діла, доки ми можемо цьому зарадити. Денна та нічна зміни необхідні для збільшення обсягів виробництва, а невеликі промислові потужності Галісії повинні використовуватися на повну, якщо ми хочемо конкурувати з нашими противниками за обсягами виробництва. Ми повинні переконатися, що наші робітники готові викладатися на повну й готові працювати по 10, 12, а за необхідности й по 14 годин на день."

GAL_create_SODIGA:0 "Створити SODIGA"
GAL_create_SODIGA_desc:0 "Безпека робітників є необхідною умовою нашого нового режиму. Щасливі робітники — продуктивні робітники, і для досягнення цього ми повинні запровадити принаймні базові закони про безпеку праці, чим нехтували каудильйо, коли вони правили Іберією. Ці закони повинні заспокоїти робітників і зосередити їх на важливіших справах, таких як власне виконання своєї роботи. Належне законодавство про права робітників може почекати, доки наша нація не буде в безпеці, тож наразі цього символічного поступку робітникам доведеться дотримуватися."

GAL_Maria_Pita_Spirit:0 "Дух Марії Піти"
GAL_Maria_Pita_Spirit_desc:0 "Марія Піта, галісійка, яка очолила оборону Коруньї в 1589 році, є героїнею, на яку повинні прагнути бути схожими як чоловіки, так і жінки. Її розгром підступних загарбників з Альбіону під час експедиції Френсіса Дрейка повинен стати натхненням для наших молодих солдатів на полі бою, заохочуючи їх долати особисту небезпеку та втрати заради перемоги на полі бою як найкращих представників Галісії. Кілька обов'язкових уроків історії та кілька розповсюджень пропагандистських листівок — і кожен солдат знатиме та шануватиме її ім'я, а наша армія буде перейнята духом Марії Піти."

GAL_Call_of_Sea:0 "Terra dos Mil Ríos"
GAL_Call_of_Sea_desc:0 "Галісія має горду військово-морську традицію, що сягає XVII століття, зосереджену навколо великого порту Ферроль. Військово-морська база, яка досі використовується, є домівкою для значної частини іберійського флоту, а тепер, коли кораблі було захоплено, вона стала домівкою для всього галісійського флоту. Цей грізний флот слід негайно використати для забезпечення наших міжнародних торговельних зв'язків і підтримки наших військ уздовж узбережжя Іберії. Галісійський народ знову стане мореплавцями!"

GAL_Eye_to_Sky:0 "Крила над Компостелою"
GAL_Eye_to_Sky_desc:0 "З початком Іберійських воєн національні військово-повітряні сили опинилися в безладі, оскільки різні фракції та ескадрильї заявили про свою відданість розколотим державам по всій Іберії. На щастя, частини, розміщені на авіабазах Сантьяґо-де-Компостела та Віґо, приєдналися до нас майже без спротиву, а незалежно від ставлення пілотів наземні літаки були захоплені неушкодженими. Якщо ми збираємося вести сучасну війну, ми повинні контролювати небо, і реорганізація та створення галісійських військово-повітряних сил є ключем до цього. Захоплені літаки буде знову введено в експлуатацію, щоб вони склали ядро нових національних військово-повітряних сил."

GAL_Encourage_Conscription:0 "Чоботи на землі"
GAL_Encourage_Conscription_desc:0 "Попри запроваджені нами закони про призов, наші збройні сили все ще вимагають більше новобранців, незважаючи на всі наші зусилля. Ухилення від призову в Галісії набуло масового характеру, а чоловіки ухиляються від своїх обов'язків і служби перед батьківщиною. Оскільки наша бюрократія вже працює на повну потужність, наш єдиний варіант — зробити військову службу привабливішою, ніж вона є зараз. Необхідно поширювати пропаганду, щоб життя новобранця здавалося гламурним і захопливим, а завзятих фронтових солдатів слід відкликати для виступів і демонстрацій перед новобранцями та громадськістю, аби створити сприятливе враження про життя в галісійській армії."

GAL_Guerrilla_Tactics:0 "Партизанська тактика"
GAL_Guerrilla_Tactics_desc:0 "Зрозуміло, що галісійська армія завжди поступатиметься чисельністю та озброєнням своїм краще оснащеним і укомплектованим аналогам у внутрішніх районах Іберії, і якщо ми хочемо перемогти, нам доведеться грати брудно. Партизанська війна — ось наш порядок денний, і ми повинні забезпечити належну підготовку наших військ у мистецтві саботажу та виживання за рахунок місцевих ресурсів, щоб проводити операції в тилу ворога без постачання. Коли наші війська сіятимуть хаос у ворожому тилу, будь-якому загарбникові буде важко просуватися вперед, не залишаючи значну частину своїх військ у тилу для спостереження за нашими хоробрими партизанами."

GAL_Defensive_Positions:0 "Утримувати оборонні позиції"
GAL_Defensive_Positions_desc:0 "Війна, у якій ми зараз беремо участь, є оборонною, і нам не слід надмірно розтягувати свої сили та переходити в наступ. Ми воюємо, щоб захистити Галісію, а не щоб завойовувати заради Галісії, і саме ворог повинен наступати на нас, а не ми на нього. Місцева географія також сприятлива для оборони: тут є безліч височин і гір, куди можна відступити, якщо ми не зможемо втримати нинішні позиції. Завдяки оборонному мисленню та належним укріпленням ми повинні бути здатні постійно утримувати оборонні позиції на передовій, а це дозволить зберегти наші втрати низькими та підвищити наші шанси на перемогу."

GAL_Gun_Or_Sword:0 "Зі зброєю чи з мечем"
GAL_Gun_Or_Sword_desc:0 "Нашій армії вкрай бракує озброєння, і ми повинні вжити заходів, щоб забезпечити нашу армію більшою кількістю зброї. Уже було запропоновано вилучати зброю в цивільного населення, а також конфісковувати сучасніші музейні експонати. Також було запропоновано виробляти простішу та саморобну зброю, таку як примітивні гвинтівки й бомби. Наприклад, пляшка із запалювальною сумішшю проста у виготовленні та використанні й заощаджує цінні виробничі потужності, які краще спрямувати на виготовлення справжньої вогнепальної зброї. Інший приклад — багнет. Навіщо витрачати ресурси на його виробництво, якщо в кожному домі є цілий набір ножів і лез, які можна пристосувати до наших потреб? Ми повинні прагматично підходити до виробництва, а реквізиція зброї допоможе нам компенсувати її нестачу."

GAL_Intellectual_Support:0 "Нова Xeración Nós"
GAL_Intellectual_Support_desc:0 "Щоб наш уряд і бюрократія були ефективними та стабільними, ми повинні здобути довіру й підтримку інтелектуалів у межах наших кордонів. Ми повинні запропонувати інтелектуалам спеціалізовані посади та значні зарплати, щоб заохотити їх працювати на нас і посилити наш адміністративний потенціал. Щоб здобути їхню підтримку, ми пообіцяємо повну свободу слова та преси, а також скасуємо обмеження на наукові дослідження, водночас підтримуючи проєкти, що приносять користь нації. За підтримки інтелектуалів ми повинні бути на шляху до перетворення на науковий осередок півострова, а наш власний уряд стане ефективнішим."

GAL_rekindle_flame:0 "Стовпи Фіністерре"
GAL_rekindle_flame_desc:0 "Галісія стоятиме сама на Піренейському півострові, адже вона є домівкою вільних. Подібно до Сполучених Штатів Америки у 1776 році, Галісія є бастіоном свободи від тиранії тих, хто прагне пригноблювати просту людину заради власної вигоди. У Галісії немає ні богів, ні господарів, і ті, хто тут живе, вільні самостійно прокладати свій життєвий шлях без страху перед втручанням чи репресіями. Наша демократична республіка захищає права та привілеї нашого народу й оберігає нас від важкої руки авторитаризму, під якою ми так довго страждали. Ми — земля вільних, створена тими, хто здобув свободу, і ми більше ніколи не підкоримося тиранії."

GAL_galicia_Forever:0 "A Terra Nosa"
GAL_galicia_Forever_desc:0 "Завдяки проведеним нами реформам і нашій непохитній обороні як власних ідеалів, так і кордонів, ми впевнено рухаємося до того, щоб стати процвітаючою та заможною нацією, якій заздрять наші сусіди. Ми не лише здатні захистити себе та визнані незалежною державою, а й є зразковою демократією та натхненням для народів Іберії. Ми скинули кайдани, у які Франкісти та іберисти закували нас від падіння республіки, і готові боротися за збереження нашої свободи до останнього. Що б не підготувало нам майбутнє, Галісія готова."

#National Spirits 
GAL_newborn_nationalism:0 "Новонароджений націоналізм"
GAL_newborn_nationalism_desc:0 "У боротьбі проти Союзу, що розпадається, відчужена батьківщина каудильйо тепер приєднується до своїх сестер-сепаратисток. Та все ж ідея Галісії як нації є такою ж чужою для решти Іберії, як і для самих галісійців.\n\nПопри те, що галісійському націоналізму вже майже століття, він так і не досяг тієї популярности, яку мали його баскські та каталонські побратими, а його прихильники спостерігали, як він згасає у безпорадному вигнанні після падіння республіки. Тепер вогонь запалено знову.\n\nПоки міста купаються в галасі профспілок та міської інтеліґенції, їхні заклики до незалежности ще не досягають більшої частини населення, що живе в горбистій сільській місцевості. Якщо мрія про галісійську державу має постати з горнила цієї нової громадянської війни, її народ доведеться переконати, що це також і його мрія."

GAL_assymetric_aid:0 "Асиметрична допомога"
GAL_assymetric_aid_desc:0 "Коли громадянська війна завершилася, для багатьох галісійців це було подібно до смертельного дзвону. Дехто залишився, щоб продовжити боротьбу, але багато інших натомість вирішили втекти, шукаючи порятунку від, здавалося б, нескінченних насильства та хаосу. Але ці люди не були просто боягузами, які вирішили покинути своїх співвітчизників — навіть за океаном вони продовжували боротися.\n\nЧи то зберігаючи галісійську культуру та спадщину, чи досягаючи особистого успіху завдяки великому бізнесу за кордоном, втрачені діти Галісії прагнули брати участь у конфлікті здалеку. Чи то надсилаючи пакунки з допомогою, чи безпосередньо фінансуючи галісійську армію, ці емігранти сподіваються, що їхня допомога — якою б незначною вона не була — зможе допомогти їхній батьківщині на її шляху до свободи."

#Event 
GAL_wars.1.t:0 "Охоронці паломницького шляху"
GAL_wars.1.d:0 "Щороку тисячі католицьких вірян здійснюють паломництво до наших земель, прямуючи до святині Святого Якова, одного з дванадцяти апостолів Ісуса, під час паломництва, відомого як Каміно-де-Сантьяґо. Однак у неспокійні часи, які переживає Іберія, багато хто ризикує собою, якщо вирішить здійснити це паломництво. Довга подорож до Сантьяґо-де-Компостели стала небезпечною.\n\nПаломники тепер розповідають про, здавалося б, пов'язану між собою групу людей, які стежать за паломницьким маршрутом по всій північній Іберії. Багато паломників просто називають їх «Охоронцями». Судячи з усього, це група католицьких домогосподарок та літніх чоловіків, які значною мірою отримують підтримку від місцевих священників і церков уздовж паломницького маршруту. Паломники стверджують, що під час подорожі ці Охоронці приймали їх у своїх домівках, годували, доглядали за хворими паломниками, а іноді навіть надавали тривалий збройний супровід, щоб стримувати лиходіїв. Хоча повідомлення свідчать, що деякі з цих Охоронців озброєні, їх не вважають воєнізованим формуванням. Схоже, вони не мають жодної іншої мети чи порядку денного, окрім як супроводжувати паломників у безпеці до Сантьяґо-де-Компостели."
GAL_wars.1.a:0 "Благословенний той, хто пасе слабких"

GAL_wars.2.t:0 "Патруль Коста-да-Морте"
GAL_wars.2.d:0 "Свіжий вітер гуляє відкритим морем, поки самотнє судно галісійської берегової охорони безтурботно пливе темними водами ночі. Троє членів екіпажу цього убогого судна сидять разом у тісній каюті, згуртувавшись навколо слабкого електричного світла, яке вона дає в ці темні години. Чоловіки передають один одному пляшку без етикетки з міцним домашнім бренді, по черзі вихиляючи по ковтку солодкого й пекучого напою.\n\n«Ну гаразд», — відригує наймолодший із трьох після добрячого ковтка бренді. «Тепер твоя черга. Яку найдивнішу річ ти робив у цих нудних морях?» — запитує молодий чоловік, киваючи на найстаршого з них. «Ви, хлопці, хочете послухати воєнні історії? Гаразд. Я вас зацікавлю», — відповідає старший. «Я був молодшим чоловіком. Мені було за двадцять. Повним життя та енергії. Я вірив у працю на благо своєї країни, і коли випала така нагода, став моряком. На час перевороту Франко три десятиліття тому я був ідеалістом і унтер-офіцером. Я вірив у переворот Франко. У його лідерство. Тож коли я дізнався, що капітан нашого судна був республіканцем...» Чоловік замовкає. «Я поставився до цього не надто прихильно, як і мої люди. Коли капітан ішов внутрішніми коридорами судна, мої люди схопили його й побили. Щойно націоналістичні офіцери дізналися, що республіканського капітана захопили рядові моряки, вони взяли командування на себе. Вони застрелили капітана й захопили судно від імені перевороту Франко. Тоді я почувався як заколотний капер, що плаває Карибським морем, але іноді тепер замислююся, чи був би світ хоч трохи іншим, якби я не прирік людину на смерть лише за її відданість своїй країні». У кімнаті западає тиша, поки молодші чоловіки осмислюють почуту історію. «Але нехай це не подає вам жодних ідей!» — додає старший. Тишу порушує сміх, і чоловіки знову починають передавати один одному алкоголь."
GAL_wars.2.a:0 "Можливо, тихі моря — не таке вже й прокляття"

GAL_wars.3.t:0 "Служити чи не служити?"
GAL_wars.3.d:0 "Антон крокує вулицями Сантьяґо, повертаючись додому після своєї убогої роботи. Він не надто любить свою роботу, але вона дозволяє йому оплачувати навчання в коледжі, і цього йому достатньо. Серед міського натовпу можна помітити кількох чоловіків у формі. Багато молодих галісійців записалися до війська, щоб захищати Галісію від португальців та іспанців, які, на думку багатьох, можуть будь-якої миті здійснити вирішальний марш на Галісію. Антон почувається незначущим поруч з іншими хлопцями у формі. Йому здається, ніби вони важливіші за нього. Він відходить убік і продовжує йти вулицею додому.\n\nПроходячи через місто, він помічає плакат. На плакаті зображено солдата у виразній іспанській формі та іншого — у португальській. Третій солдат на плакаті одягнений у форму галісійського солдата й стоїть вищим за іспанця та португальця. Під художнім зображенням солдатів стоїть жирний червоний напис: «Захисти нашу свободу! Записуйся сьогодні!» Антон зупиняється й замислюється над написом. Він згадує, як незначущим почувається порівняно з чоловіками у формі, і на мить уявляє себе одним із них. У його думках виникають мрії про те, як він стає героєм Галісії, хоробро борючись за збереження нещодавно здобутої галісійської незалежности. Гордо носить свою форму.\n\nМожливо, вступити до війська було б не такою вже й поганою ідеєю, думає він. Звісно, його влаштовує життя студента, однак він уявляє, що міг би стати кимось значно більшим. Мати значення для своєї нації. Зробити свою родину гордою. Образи величі заповнюють його молодий розум, поки він читає адресу призовного пункту, надруковану на плакаті."
GAL_wars.3.a:0 "Можливо, варто ненадовго завітати до призовного пункту"

GAL_wars.4.t:0 "На слідах наших предків"
GAL_wars.4.d:0 "Семеро чоловіків причаїлися за різними каменями та перешкодами обабіч дороги. Озброєні різноманітними французькими, британськими та іспанськими мушкетами, вони приготували пастку. Невеликий патруль із п'яти французьких солдатів наближається, невимушено розмовляючи між собою. Французи просто заходять у зону ураження партизанів. Командир галісійських партизанів вискакує зі свого укриття і, перш ніж французькі солдати встигають відреагувати, стріляє. Один із французів падає на землю, мов лялька. Після сигнального пострілу решта шістьох чоловіків швидко підіймаються зі своїх сховків і відкривають вогонь по цілі. Ще троє французів падають на землю. Двоє французьких солдатів, що вижили, кидають зброю й починають благати чужою мовою. Однак партизани не виявляють жодного співчуття й швидко знайомлять французів із холодною сталлю своїх багнетів.\n\nПонад століття потому, на тому самому вузькому дорожньому перевалі, шестеро партизанів лежать за перешкодами обабіч дороги. Озброєні різноманітною автоматичною, напівавтоматичною та магазинною зброєю, вони чекають, коли наблизиться неповний взвод іспанських піхотинців. Коли іспанці перетинають межу зони ураження галісійських партизанів, вибухає саморобний вибуховий пристрій, убиваючи кількох іспанців та дезорієнтуючи решту. Дві ручні гранати летять услід і вибухають у лавах іспанців. Галісійці відкривають вогонь з автоматичних гвинтівок, і вцілілі іспанці падають мертвими.\n\nПодібно до своїх іберійських предків часів Війни за незалежність Іспанії, галісійці борються зубами й нігтями, використовуючи найбільш нетрадиційні способи, щоб не допустити окупації та зберегти свою незалежність. Жодна тактика не є надто брудною, жодна ціна не є надто високою — ці бійці йдуть на найвищу жертву, аби забезпечити майбутнє своїй нації."
GAL_wars.4.a:0 "Ми стоятимемо й боротимемося, як і вони"

GAL_wars.5.t:0 "Щіпка борошна"
GAL_wars.5.d:0 "На пайках приготувати хорошу пасту може бути складно. Однак із цим рецептом пасти з часником ви легко приготуєте поживну та смачну страву для всієї родини!\n\nДля початку вам знадобиться 1 фунт сухих спагеті.\nПотім наповніть велику каструлю водою та додайте чайну ложку солі. Доведіть воду до кипіння.\nПокладіть макарони в каструлю.\nПоки паста вариться, в окрему пательню налийте 3 столові ложки оливкової олії та додайте один або два зубчики подрібненого часнику, залежно від того, скільки його доступно у вашій місцевості. Якщо у вас є черствий хліб, не дайте йому пропасти! Розкришіть його та додайте до пательні. Готуйте на середньому вогні.\nКоли паста буде готова в каструлі, зніміть її з вогню. Додайте до пательні 1 столову ложку масла. Готуйте, доки ви чітко не відчуєте запах подрібненого часнику.\nДодайте зварену пасту до пательні. Ретельно перемішайте пасту. Якщо є можливість, посипте трохи сиру для додаткового смаку!\n\nІ ось у вас є смачна страва, яка легко вкладається у межі вашого двотижневого пайка! Цей посібник розрахований на сім'ю з чотирьох осіб, однак його можна легко пристосувати для більшої кількости людей, якщо ваша родина більша й отримує більші пайки."
GAL_wars.5.a:0 "Смачно"

GAL_wars.6.t:0 "Старі друзі"
GAL_wars.6.d:0 "Протягом довгих десятиліть правління Франко в Галісії інтелектуальна думка та ідеї аж ніяк не заохочувалися. У міру того як хватка каудильйо над Іберією посилювалася, багато галісійських інтелектуалів опинялися перед повним замовчуванням своїх поглядів або, якщо вони чинили опір, вигнанням. Однак після визволення Галісії багато з цих інтелектуалів почали повертатися до Галісії, прагнучи повернутися на батьківщину, де могли вільно висловлювати ідеї та думки, не стаючи мішенню переслідувань.\n\nУ результаті повернення інтелектуальної спільноти кількох її визначних представників було запрошено Альваро Кункейро на публічні збори, щоб обговорити важливі для них питання. Громадськість прибула в несподівано великій кількости, щоб бути присутньою на зустрічі. На зборах планується обговорити справи Іберії, можливість існування галісійської нації та роль Іберії у світі, що змінюється, серед інших тем.\n\nІнтелектуали, за якими пильно спостерігають численні громадяни та журналісти, погоджуються, що перед Галісією постають серйозні виклики, окрім суто питань безпеки. Також обговорюються ймовірні економічні труднощі, з якими зіткнеться Галісія, а також геополітичні труднощі пошуку та підтримання стабільної підтримки такої малої нації. У міру того як дискусії затягуються, багато хто відчуває подвійне почуття визволення й тривоги. Хоча інтелектуальна спільнота нарешті вільна, схоже, за роки придушення вона виробила доволі похмурий погляд на Галісію, Іберію та світ. Вони говорять про небезпеки нового порядку, що швидко змінюється, і погоджуються, що для виживання Галісії в ці майбутні неспокійні роки знадобиться велика обережність."
GAL_wars.6.a:0 "Великі уми думають однаково"

GAL_wars.7.t: "Кілька хороших людей"
GAL_wars.7.d: ""Відповідно до Надзвичайних положень про громадську безпеку, ми зобов'язані взяти вас, Міґеле Ново, під варту. Усе, що ви скажете або зробите під час перебування під вартою, може бути використано в суді. Відповідне майно буде конфісковано державою, якщо вам буде висунуто звинувачення, однак його буде повернуто у разі виправдання. Будь ласка, ходімо з нами."\n\nПоліцейський був ввічливим, і Міґель мусив це визнати. Їх було двоє: один читав заяву з картки, тоді як інший надягав на нього наручники. Він не здивувався — він очікував цього.\n\nВін стояв на порозі свого дому, а кілька сусідів вийшли подивитися на його арешт. Він не міг їх звинувачувати, адже був добре відомий у окрузі. Своїми гучними засудженнями регіоналізму, активною підтримкою законного іспанського уряду будь-якими необхідними засобами, які він відкрито висловлював на міських зборах, площах і в барах. Він вважав, що це лише питання часу, коли регіоналістське гестапо прийде по нього.\n\nОдин із поліцейських зачинив його двері та замкнув їх ключем, який надав Міґель, — ввічливість, яку він оцінив. Пізніше вони, мабуть, усе там перерили б, але принаймні йому дозволили зберегти дещицю гідности. Інший поліцейський повів його до автомобіля, що чекав.\n\n«Шкода, що ви служите цій новій державі. Схоже, у вас більше пристойности, ніж у більшости інших зрадників», — сказав він, коли вони саджали його на заднє сидіння, — «заарештовуєте людей лише за їхню підтримку законного уряду».\n\nПоліцейський зітхнув, дивлячись на Міґеля своїми втомленими очима. «Дехто з нас уже побачив достатньо варварства на ціле життя, пане Ново», — сказав він, зачиняючи дверцята автомобіля."
GAL_wars.7.a: "Що стоїть довше — держава чи душа?"

GAL_wars.8.t: "Відмова від служби"
GAL_wars.8.d: "Суд був порожній. За спиною Лоіса не було ні присяжних, ні глядачів. У маленькій, голій залі суду були лише Лоіс, його охоронці, писар і суддя, що сидів перед ним. Не дивно — якою взагалі була легітимність цього суду? Уніформа нічим не відрізнялася від колишньої.\n\n«Лоіс Варела, ви звинувачуєтеся в ухиленні від виконання обов'язків, відмові реагувати на неодноразові повістки про призов, доставлені на вашу адре-»\n\nЛоіс перебив його, перекрикуючи монотонний голос судді. «Це фарс. Я не чинитиму вбивства проти своїх товаришів, незалежно від того, якій державі вони належать. Мені байдуже, які тортури ви вигадаєте, щоб примусити мене, я не вдягну військової форми».\n\nЛоіс зухвало глянув на суддю. Він готувався до цього з тієї самої миті, як увійшов. Однак суддя дивився байдуже. «Як би там не було, пане Варела, ви не маєте особливого звільнення від Закону. Ми всі є підданими».\n\n«Несправедливий закон є нелегітимним», — парирував Лоіс, саркастично додавши: «Ваша честь». Він чув про долю, яка спіткала подібних принципових людей по всій Іспанії; він готувався до цього. Раніше йому пощастило отримати звільнення від служби, але він знав, що зрештою воно закінчиться. Раніше він мовчав, але проклятий буде, якщо не висловиться тепер.\n\n«Ми не обговорюватимемо легітимність Галісії чи її законів, пане Варела. Відповідно до надзвичайних положень я не бачу іншого виходу».\n\nЛоіс вдихнув. Ось і все.\n\n«Я засуджую вас до умовного покарання у вигляді позбавлення волі з умовним періодом обов'язкової праці на стратегічному підприємстві, яке буде призначено найближчими днями. Відведіть ув'язненого»."
GAL_wars.8.a: "Лоіс сидів у своїй камері. «Що?» — пробурмотів він."

