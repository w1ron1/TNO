#Ministers
GAL_Antonio_Rios:0 "Антоніо Алонсо Ріос" 
GAL_Antonio_Rios_hog_desc:0 "§YВіцепрезидент\nНаціональний лібералізм§!\n--------------\n§LАнтоніо Алонсо Ріос був галісійським депутатом до громадянської війни й, як і багато інших, був змушений тікати у вигнання під час громадянської війни. У вигнанні Алонсо став головою Ради Галісії — організації, покликаної слугувати урядом у вигнанні для галісійських політиків Республіки, яка також виконувала роль загальної організації для галісійських вигнанців в Америці.\n\nКоли Іберія знову поринула в хаос, Вело запросив Алонсо стати віцепрезидентом, аби надати новому галісійському уряду певної легітимности. Затятий галісійський націоналіст із юних років, Антоніо Алонсо Ріос завжди відчував напруженість у відносинах між прагненнями його співвітчизників та прагненнями республіканців у вигнанні. Він вважав, що Республіка робить недостатньо для визнання прав своїх історичних регіонів, і тому тепер виступає за повний суверенітет Галісії.§!"

GAL_Ramon_Otero:0 "Рамон Отеро Педра́йо"
GAL_Ramon_Otero_for_desc:0 "§YМіністр закордонних справ\nЛіберальний консерватизм§!\n--------------\n§LРамон Отеро Педра́йо довгий час був одним із лідерів галісійського націоналізму. Харизматичний оратор, талановитий письменник і людина, якій приписують запровадження сучасної географії в Галісії, саме Отеро першим визначив Галісію як «атлантичну», а не «середземноморську» країну. Його праві переконання та зв'язки з Церквою врятували йому життя під час громадянської війни в Іспанії, і він продовжував поширювати галісійську культуру під час диктатури настільки, наскільки йому це дозволяли. Тож не дивно, чому ліві націоналісти критикували рішення призначити Отеро радником із закордонних справ.\n\nПопри це, харизма Отеро та його ораторські здібності допомагають об'єднувати народ навколо справи вільної Галісії. Підтримуючи постійний контакт із галісійською громадою в Америці, Отеро невтомно працює над здобуттям політичної та матеріальної підтримки для воєнних зусиль.§!"

GAL_Francisco_Alvajar:0 "Франсіско Хав'єр Альвахар"
GAL_Francisco_Alvajar_eco_desc:0 "§YМіністр економіки\nСоціял-демократія§!\n--------------\n§LФрансіско Хав'єр Альвахар був сином галісійського політика та служив солдатом у Республіканській армії, хоча його власна політична кар'єра почалася лише після того, як він вирушив у вигнання. Залучившись до діяльности як Ради Галісії, так і республіканського уряду у вигнанні, Франсіско Хав'єр Альвахар мав досвід роботи на економічних посадах в уряді у вигнанні, а його зв'язки з галісійським націоналізмом зробили його очевидним кандидатом на роль керівника новоствореної галісійської економіки.\n\nЯк поміркований лівий, Альвахар скористався тим, що Галісії у своїх воєнних зусиллях потрібно лише захищатися. Його мета — створити галісійську економіку, яка справді стояла б на власних ногах, приділяючи особливу увагу промисловим проєктам для розвитку регіону.§!"

GAL_Jose_Fernandez:0 "Хосе Фернандо Фернандес"
GAL_Jose_Fernandez_sec_desc:0 "§YМіністр оборони\nЛівий націоналізм§!\n--------------\n§LХосе Фернандо Фернандес не був чужим ані війні, ані вигнанню. Будучи соціялістом і республіканцем, він був вигнаний з Іспанії за свою опозицію диктатурі Прімо де Рівери. Коли сили Франко захопили контроль над Галісією, він утік до Португалії, потопивши німецький корабель, що постачав припаси франкістам, перш ніж таємно перебратися до Франції, де залишався до кінця Другої світової війни.\n\nВірячи у збройну боротьбу, Хосе Фернандо Фернандес у наступні роки надавав свої послуги різним лівим групам у Латинській Америці, найпомітніше Карибському легіону та DRIL, який він допоміг заснувати разом із Шосе Вело Москерою. Він також брав участь у захопленні португальського пасажирського судна Santa Maria. Хоча це не стало іскрою, яка поклала б край іберійському режиму, диктатура невдовзі все одно впала. Після повернення до Галісії з проголошенням незалежности він швидко став її радником з питань оборони.§!"

