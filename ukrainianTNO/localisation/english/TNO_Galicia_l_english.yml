#Characters
GAL_Alvaro_Cunqueiro:0 "Альваро Кункейро"
POLITICS_ALVARO_CUNQUEIRO_DESC:0 "Альваро Кункейро, для одних герой справи галісійської незалежности, а для багатьох інших — зрадницький зрадник, походив із простого середовища, будучи сином фармацевта. У 1927 році він покинув навчання філософії та літератури в Університеті Сантьяґо-де-Компостела, вирішивши натомість присвятити себе журналістиці. Помітивши його талант, різноманітні газети й журнали, такі як El Pueblo Gallego, найняли молодого письменника. Живучи в розділеній республіці, він, однак, почав зазнавати політичного впливу, що зрештою привело його до заснування Partido Galeguista, або Галісійської націоналістичної партії. Під час громадянської війни він зіткнувся з іншою формою націоналістичної політики — цього разу іспанським націоналізмом, — почавши писати пропаганду для Фаланги. Однак він ніколи не втрачав своїх переконань і продовжував підтримувати таємні контакти з іншими прихильниками незалежности, а нова громадянська війна створила ідеальну можливість втілити його справу в дію.\n\nПісля того як місцеві еліти Галісії усвідомили, що жодного їхнього особистого впливу не вистачить, аби об'єднати нову націю проти її ворогів, вони почали шукати когось іншого. Остаточні кризові обговорення зрештою привели до висунення Кункейро, чию харизму та популярність серед народу неможливо було проігнорувати. Тепер, очолюючи рух за відокремлення, він стоїть на чолі Галісійської Республіки. Однак його визнання, що він не політик, а лише простий письменник, схоже, підтверджує, що після завершення конфлікту він не прагнутиме залишатися при владі. Поки що, однак, він є ідеальною символічною постаттю — людиною, яку люблять за його твори та яка має досвід у мистецтві пропаганди."

GAL_Xose_Velo:0 "Шосе Вело Москера"
POLITICS_XOSE_VELO_DESC:0 "Незалежність — життєва сила Шосе Вело Москери. Син консервативного мера та генеральний секретар першої галісійської молодіжної федерації у віці 19 років, він уперше був заарештований франкістськими силами за відмову назвати своїх товаришів по галісійському молодіжному руху. Партизан спочатку втік до Гвінеї, потім повернувся до Галісії, далі до Португалії й зрештою, у 1958 році, до Венесуели. Прагнучи до «покликання, яке не дозволяє нам постаріти», він разом із Умберто Дельгадо очолив Іберійський революційний директорат, відкривши у 1960-х роках шлях до збройної опозиції в Іберії.\n\nПовернувшись таємно, галісійські націоналісти, молоді й старі, підтримали Вело в об'єднанні народу. За підтримки офіцерів і населення, які однаково втомилися від нестабільности, Галісійську Республіку було успішно проголошено. Біля штурвала корабля уряд у вигнанні, що повернувся, — Рада Галісії — поставив свого нев'янучого героя президентом Тимчасової хунти. Нарешті кельтсько-галісійська мова лунає на противагу тим, хто зневажає її як «варварську».\n\nАле лунає вона не всюди, та й Шосе Вело не такий уже нев'янучий. Помітно більш втомлений і худий останніми роками чоловік очолює націю, охоплену посередніми націоналістичними настроями. Не менш антифранкістський, він бачить над вулицями хмару страху, а підтримка в сільській місцевості мовчить, спонукаючи уряд намагатися розпалити патріотичний запал. Кабінет непокоїться, що Вело піде у відставку з початком післявоєнної відбудови, але вголос цього не говорить.\n\nСьогодні Галісія існує. Тепер настав час це довести."
