#Ministers
GAL_Antonio_Rios:0 "Antonio Alonso Ríos" 
GAL_Antonio_Rios_hog_desc:0 "§YVice-President\nNational Liberalism§!\n--------------\n§LAntonio Alonso Ríos served as a Galician deputy prior to the Civil War, and like many was forced to flee into exile during the Civil War. In his exile, Alonso would become the Leader of the Council of Galicia, an entity meant to serve as a government-in-exile for exiled Galician politicians of the Republic, and which also acted as a general organization for Galician exiles in America.\n\nAs Iberia descended into chaos once more, Alonso was invited by Velo to serve as Vice-President, to give the new Galician government some legitimacy. A staunch Galician nationalist since his youth, Antonio Alonso Ríos had always felt there was a tense relationship between the wants of his fellow countrymen, and those of the republican exiles. He believed that the Republic was not doing enough to recognize the rights of its historical regions, and so now advocates for full Galician sovereignty.§!"

GAL_Ramon_Otero:0 "Ramón Otero Pedrayo"
GAL_Ramon_Otero_for_desc:0 "§YMinister of Foreign Affairs\nLiberal Conservatism§!\n--------------\n§LRamón Otero Pedrayo had long served as a leader for Galician nationalism. A charismatic orator, accomplished writer, and believed to have introduced modern Geography to Galicia, it would be Otero who would first define Galicia as an "Atlantic" country, not a "Mediterranean" one. His right-wing beliefs and ties to the Church spared his life during the Spanish Civil War, and he would continue to spread Galician culture during the dictatorship, to the extent that he was allowed. As such, it is no mystery as to why left-wing nationalists criticized the decision to name Otero as Councilor of Foreign Affairs.\n\nNonetheless, Otero's charisma and oratorical skills succeed in rallying the people to the cause of a free Galicia. In constant contact with the Galician community in America, Otero works tirelessly to get political and material support for the war effort.§!"

GAL_Francisco_Alvajar:0 "Francisco Javier Alvajar"
GAL_Francisco_Alvajar_eco_desc:0 "§YMinister of Economy\nSocial Democracy§!\n--------------\n§LFrancisco Javier Alvajar was the son of a Galician politician and served as a soldier in the Republican Army, although his own political career would not begin until after he went into exile. Becoming involved in both the Council of Galicia and the Republican government-in-exile, Francisco Javier Alvajar's experience in economic positions within the government-in-exile as well as his ties to Galician nationalism made him an obvious candidate to be placed in the newly created Galician economy.\n\nAs a moderate leftist, Alvajar has taken advantage of the fact that Galicia needs only defend itself in its war effort. His goal is to create a Galician economy that truly stands on its own, with a special emphasis on industrial projects to develop the region.§!"

GAL_Jose_Fernandez:0 "José Fernando Fernández"
GAL_Jose_Fernandez_sec_desc:0 "§YMinister of Defense\nLeft-Wing Nationalism§!\n--------------\n§LJosé Fernando Fernández was no stranger to war or to exile. As a socialist and a republican, he was exiled from Spain for his opposition to the dictatorship of Primo de Rivera. When Franco's forces seized control over Galicia, he fled to Portugal, sinking a German ship supplying the Francoists before sneaking away to France until the end of the Second World War.\n\nA believer of armed struggle, José Fernando Fernández gave his services to various left-wing groups in Latin America in the following years, most prominently the Caribbean Legion and DRIL, which he helped found alongside Xosé Velo Mosquera. He was also a participant in the hijacking of the Santa Maria, a Portuguese passenger ship. While that failed to be the spark to end the Iberian regime, the dictatorship would soon fall regardless. Returning to Galicia upon independence, he would quickly become its Council of Defense.§!"

GAL_Benjamin_Lopez:0 "Benjamín Balboa López"
GAL_Andres_Conde:0 "Andrés Freire Conde"
GAL_Luis_Paradela:0 "Luís Barreiro Paradela"
GAL_Avelino_Garcia:0 "Avelino García García"
GAL_Ramon_Garrido:0 "Ramón Garrido Vidal"
#Tree 
GAL_Galicia_Wakes_Up:0 "Galicia Esperta!" 
GAL_Galicia_Wakes_Up_desc:0 "Galicia awake! The hour is at hand for our freedom! We have broken free of the Francoist boot, after so many years of repression and cruelty, and now we will fight to retain our freedom and dream of a Galician nation! Patriots have heeded our call, and newly formed militias are marching towards the border. We will raise our blue and white flag high from our dugouts and forts, and should the falangist or republican turn to fight us, we will defend our new republic until the last man. Galicia has awoken, and we will not go back gently into that good night." 
GAL_Galicia_Wakes_Up_tt:0 "§MPois, onde quer, xigante a nosa voz pregoa a redenzón da boa Nazón de Breogán.§!"

GAL_War_Economy:0 "The Galician War Economy"
GAL_War_Economy_desc:0 "The current economic model in Galicia is unsustainable. The total war we find ourselves in requires total mobilisation. If we are to wage war for the survival of our nation, we must begin the transformation of the economy immediately. War work will take absolute priority, and civilian industry will be turned over to war production unless strictly necessary. All available resources will be provided to our war industry only, in order to maximise our limited industrial potential. Civilian industry will have to make do with what they themselves can procure. Only draconian economic intervention will save us now."

GAL_Bleed_Mines:0 "Bleed the Mines"
GAL_Bleed_Mines_desc:0 "Whilst in any case Galicia is not known for its mining industry, the current output of our mines is not sufficient. The current situation dictates that we must increase domestic production of metals immediately if we are to keep industrial productivity at the current levels. We can no longer rely on the Iberian interior to supply our industry with the resources we need, so a radical redistribution of labour to our mines is required. If necessary, we will have the mines work ceaselessly around the clock, with back to back shifts of workers toiling day and night to save Galicia. The war fought with pickaxes underground is just as important as the war fought with rifles at the frontline."

GAL_Reform_Baks:0 "Reform the Banks"
GAL_Reform_Baks_desc:0 "In order to secure the finances needed for the ongoing conflict, we must reform the banks within Galicia to be more amenable to our needs. By pushing through laws to force the banks to grant us loans and issue war bonds, we can secure the necessary funds we need to continue to provide for war industry and our armed forces. While the bankers may grumble at our intervention, its safe to say they'd be less happy if falangist tanks or republican infantry were parading through A Coruña because our war effort was underfunded."

GAL_Not_Wasted_Product:0 "Not a Single Wasted Product"
GAL_Not_Wasted_Product_desc:0 "If Galicia is to survive the raging conflict engulfing Iberia, we must maximise the efficiency of our war effort. The transformation to a war economy and the increased production developing from this is a good start, but it will count for nothing if we are wasteful with the fruits of our labour. We must decrease consumption, and only strict discipline and rationing will accomplish this. Only the absolute necessities will be provided for the general populace, to ensure that our army does not go empty handed in this time of national crisis."

GAL_Not_Land_Without_Farmer:0 "Not a Plot of Land Without a Farmer"
GAL_Not_Land_Without_Farmer_desc:0 "Galicia has never had the most fertile land, nor much of it for that matter, and now that we are cut off from any support from the Iberian interior as well, it is crucial that we use what we have to maximum effect. No hectare will go untilled by our farmers, and the land will be worked thoroughly to ensure we can narrow our food deficit and reduce our reliance on imports, especially when the hard currency could be used for more direct war work instead. Achieving self-sufficiency in food production is essential!"

GAL_Not_Factory_Without_Worker:0 "Not a Factory Without a Worker"
GAL_Not_Factory_Without_Worker_desc:0 "To maximise the efficiency of our factories, we must ensure that there is no shortfall in available labour for our foremen to utilise. There must be no factory without workers, and nothing will be left idle as long as we can help it. Day and night shifts are necessary to increase our volume of production, and the small industrial capacity of Galicia must be worked to its full potential if we are to compete with our opponents in terms of production. We must ensure that our workers are prepared to give it all, and are prepared to work 10, 12 and if necessary 14 hours a day if required to."

GAL_create_SODIGA:0 "Create SODIGA"
GAL_create_SODIGA_desc:0 "Worker safety is a must in our new regime. A happy workforce is a productive workforce, and to achieve this we must implement at least basic worker safety laws, something which was neglected by the Caudillos when they ruled over Iberia. These laws should placate the workforce and keep them focused on the more important matters, such as actually doing their jobs. Proper workers' rights legislation can wait until our nation is secure, so this token concession to the workers will have to do for now."

GAL_Maria_Pita_Spirit:0 "The Spirit of Maria Pita"
GAL_Maria_Pita_Spirit_desc:0 "María Pita, a Galician woman who lead the defense of A Coruña in 1589, is a heroine that men and women alike should aspire to be. Her rout of the perfidious Albion invaders of Francis Drake's expedition should be an inspiration to our young soldiers on the battle, encouraging them to fight past personal danger and loss to achieve victory on the battlefield as Galicia's finest. With a few mandatory history lessons and a few distributions of propaganda leaflets, every soldier will know and respect her name, and our army will be imbued with the spirit of María Pita."

GAL_Call_of_Sea:0 "Terra dos Mil Ríos"
GAL_Call_of_Sea_desc:0 "Galicia has a proud naval tradition stretching back to the 17th century, with it being focused around the major port of Ferrol. Still in use even now, the naval base is home to a sizable portion of the Iberian fleet, and now that the ships have been seized, it is home to the entire Galician navy. This formidable fleet should be put to use immediately to secure our international trade links, and provide support for our troops along the coastlines of Iberia. The Galician people will be seafarers once more!"

GAL_Eye_to_Sky:0 "Wings over Compostela"
GAL_Eye_to_Sky_desc:0 "With the outbreak of the Iberian Wars, the national airforce has been thrown into disarray with various factions and squadrons declaring their allegiances for the splintered states across Iberia. Fortunately, the units stationed at the Santiago de Compostela and Vigo air bases have joined us with little opposition, and regardless of the attitudes of the pilots, the grounded aircraft have been seized intact. If we are to wage modern war, we must have control of the skies, and reorganisation and the formation of a Galician airforce is key to this. The seized planes will be pressed back into service to form the core of a new national airforce."

GAL_Encourage_Conscription:0 "Boots on the Ground"
GAL_Encourage_Conscription_desc:0 "In spite of the conscription laws we have introduced, our armed forces still cry out for more recruits despite our best efforts. Draft dodging is rampant in Galicia, with men shirking their responsibilities and duty to the fatherland. With our bureaucracy already running at full capacity, our only option is to make conscription more appealing than it currently is. Propaganda must be issued to make the life of a recruit seem glamourous and exciting, and zealous frontline soldiers should be recalled to hold speeches and demonstrations for new recruits and the public in order to give a favourable impression of life in the Galician army."

GAL_Guerrilla_Tactics:0 "Guerrilla Tactics"
GAL_Guerrilla_Tactics_desc:0 "Naturally, the Galician army is always going to be outmatched and outnumbered by its better equipped and better manned counterparts in the Iberian interior, and if we want to win, we have to play dirty. Guerilla warfare is the order of the day, and we must make sure our troops are trained adequately in the art of sabotage and living off the land, in order to conduct operations behind enemy lines without being resupplied. With troops in their rear sowing havoc, any invading enemy will be hard pressed to advance without keeping a sizeable portion of their troops in the rear on watch for our brave partisans and guerillas."

GAL_Defensive_Positions:0 "Maintain Defensive Positions"
GAL_Defensive_Positions_desc:0 "The war we are currently engaged in is a defensive war, and we shouldn't overextend ourselves and fight offensively. We fight to defend Galicia, not to conquer for Galicia, and the enemy should be the ones advancing towards us, not us towards them. The local geography is also suited to defence, with plenty of highlands and mountains to fall back on should we fail to hold our current positions. With a defensive mindset and the appropriate fortifications, we should be able to permanently hold defensive positions at the frontline, and in doing this keep our casualties low and our odds of victory high."

GAL_Gun_Or_Sword:0 "With a Gun or With a Sword"
GAL_Gun_Or_Sword_desc:0 "Our army is woefully lacking in armaments, and as we must move to secure more weapons for our army. Seizure of weapons from the citizenry has already been proposed, as well as confiscating the more modern museum pieces. Manufacturing of simpler and makeshift weaponry, such as rudimentary rifles and bombs has also been suggested. For instance, the petrol bomb is simple to manufacture and easy to use, and saves valuable production capacity that would be better served making proper firearms. Another example, the bayonet. Why waste resources on producing these when every household has an array of knives and blades that can be adapted to our needs? We need to be pragmatic with production, and requisitioning weapons will help us cover our shortfalls."

GAL_Intellectual_Support:0 "A New Xeración Nós"
GAL_Intellectual_Support_desc:0 "For our government and bureaucracy to be efficient and stable, we must gain the trust and support of the intellectuals within our borders. We should offer specialist jobs and sizable salaries to entice intellectuals to work for us to bolster our administrative capacity. To gain their support, we will promise full freedom of speech and press, as well as lifting restrictions on scientific research whilst providing support for projects that benefit the nation. With intellectual support, we should be well on our way to becoming a scientific haven in the peninsular, as well as having our own government be more efficient."

GAL_rekindle_flame:0 "Pillars of Finisterre"
GAL_rekindle_flame_desc:0 "Galicia will stands alone in the Iberian Peninsula, for it is the home of the free. Much like the United States of America in 1776, Galicia is a bastion of freedom from the tyranny of those who would seek to oppress the common man for their own benefit. There are no gods and no masters in Galicia, and those who live here are free to make their own way in life without fear of interference or repression. Our democratic republic safeguards the rights and privileges of our people, and protects us from the heavy hand of authoritarianism that we struggled under for so long. We are the land of the free, made by those who have been freed, and we will never submit to tyranny again."

GAL_galicia_Forever:0 "A Terra Nosa"
GAL_galicia_Forever_desc:0 "With the reforms we have passed, and our stalwart defense of both our ideals and borders, we are well on course to become a thriving and prosperous nation that is the envy of our neighbours. Not only are we capable of our own defence, and a recognised independent state, but we are a model democracy, and inspiration for the people of Iberia. We have cast off the shackles that the Francoist and the Iberist chained us in since the end of the republic, and we are ready to fight to keep our freedom until we have fought to the last. Whatever the future throws at us, Galicia is ready."

#National Spirits 
GAL_newborn_nationalism:0 "Newborn Nationalism"
GAL_newborn_nationalism_desc:0 "In the fight against the collapsing Union, the Caudillo's estranged homeland now joins its separatist sisters. Yet the idea of Galicia as a nation is as foreign to the rest of Iberia as to the Galicians themselves.\n\nDespite almost a century old, Galician nationalism never quite reached the prominence of its Basque and Catalonian brethren, its proponents watching it fizzle out in helpless exile after the Republic fell. Now, the fire has been lit anew.\n\nWhile the cities bathe in the clamor of the unions and the urban intelligentsia, their echoes of independence do not yet reach a larger part of the population nested in the hilly countryside. If the dream of a Galician state is to emerge from the crucible of this new civil war, its people will have to be convinced that it is their dream too."

GAL_assymetric_aid:0 "Asymmetric Aid"
GAL_assymetric_aid_desc:0 "When the civil war ended, to many Galicians it was akin to a death knell. Some stayed behind to continue the fight, but many others chose instead to flee, seeking refuge from the seemingly endless violence and chaos. But these people were not simply cowards that had chose to abandon their countrymen - for even overseas, they continued to fight.\n\nWhether it be through preserving Galician culture and heritage or gaining personal success through big business overseas, Galicia's lost children have been most keen to take part in the conflict from afar. Whether it be via sending aid packages or by directly financing the Galician army, these expats hope that their assistance - however minor it may be - can help their homeland on its quest for freedom."

#Event 
GAL_wars.1.t:0 "The Guardians of the Pilgrim Way"
GAL_wars.1.d:0 "Each year, thousands of Catholic faithful undertake a pilgrimage to our lands, as the faithful flock to the shrine of Saint James, one of the twelve apostles of Jesus, in a pilgrimage known as the Camino de Santiago. However, as Iberia endures turbulent times, many find themselves at risk should they choose to undertake the pilgrimage. The long journey to Santiago de Compostela has become a treacherous one.\n\nPilgrims now speak of a seemingly connected group of individuals who stand watch over the pilgrimage route throughout northern Iberia. Many pilgrims simply refer to them as "The Guardians." What appears to be a collection of Catholic faithful housewives and older men, they draw much of their support from local priests and churches along the pilgrimage route. Pilgrims claim that, along their journeys, these Guardians have taken them into their homes, fed them, tended to ill pilgrims, and at times have even provided extended armed escorts to deter ill-doers. Whilst reports do claim that some of these Guardians are armed, they are not considered to be a paramilitary. They appear to have no goal or agenda other than to shepherd the guide to safety in Santiago de Compostela." 
GAL_wars.1.a:0 "Blessed is he who shepherds the weak"

GAL_wars.2.t:0 "The Costa da Morte Patrol"
GAL_wars.2.d:0 "A brisk wind rolls over the open seas, as a lone vessel of the Galician Coastal Patrol casually navigates the black waters of the night. Three crewmen of this meager vessel sit amongst the company of one another within the claustrophobic crew quarters, huddled around the feeble electric light that the quarters provide in these dark hours. The men pass around an unlabelled bottle of a heavy homemade brandy, taking turns downing a mouthful of the sweet and fiery drink.\n\n"Alright then." belches the youngest of the three, after taking a sizeable swig of brandy. "Now it is your turn. What's the wildest thing you have done on these boring seas?" asks the young man, as he beckons to the oldest among them. "You kids like to hear war stories? Fine. I will entice you." the eldest among them replies. "I was a younger man. In my twenties. Full of life and vigor. I believed in working for my country, and when the opportunity came to do so, I became a seaman. By the time of Franco's coup three decades ago, I was an idealist and a non-commissioned officer. I believed in Franco's coup. In his leadership. So when I learned that the captain of our vessel was a Republican..." The man pauses. "I did not take so kindly to that, and neither did my men. As the captain walked the interior halls of the vessel, my men grabbed him and beat him. Once the Nationalist officers learned that the Republican captain had been captured by the enlisted men, they took charge. They shot the captain, and took command of the vessel in the name of Franco's coup. Back then I felt like a mutinous privateer sailing the Caribbean, but sometimes I now wonder if the world would have been any different if I hadn't sentenced a man to die only for his loyalty to his country." The room falls silent, as the younger men absorb the story they have just been told. "But don't let that give you any ideas!" the older man chimes in. The silence is broken by laughter, as the men begin to pass around their alcohol once again." 
GAL_wars.2.a:0 "Perhaps silent seas aren't such a curse after all"

GAL_wars.3.t:0 "To Serve or Not to Serve?"
GAL_wars.3.d:0 "Antón strolls down the streets of Santiago, on his way home from his meager job. He does not particularly enjoy his work, yet it allows him to pay for his college education, and with that he is content. Among the city crowds one can spot several men in uniform dotted about. Many young Galician men have enlisted to defend Galicia from the Portuguese and Spanish, who many believe could make a decisive march upon Galicia at any moment. Anton feels inconsequential in the sight of the other boys in uniform. He feels as if they are more important than him. He shies away and continues to proceed down the street on his way home.\n\nAs he proceeds through the city, a poster catches his eye. Depicted upon the poster is a soldier with a distinct Spanish uniform, and another with a Portuguese uniform. The third soldier on the poster wears the uniform of a Galician soldier, and stands taller than the Spanish and Portuguese. Underneath the artistic depiction of the soldiers stands a bold, red caption: "Protect our freedom! Enlist today!" Anton stops and ponders the caption. He recalls how insignificant he feels when compared to men in uniform, and for a moment imagines himself as one of those men in uniform. Daydreams cross his mind of becoming a hero of Galicia, fighting bravely to preserve the newly found Galician independence. Wearing his uniform proudly.\n\nPerhaps joining up wouldn't be such a bad idea, he ponders to himself. Sure, he is content with his life as a student, however he imagines that he could be so much more. Mean something to his nation. Make his family proud. Images of grandeur flood his young mind, as he reads the recruitment office address printed on the poster." 
GAL_wars.3.a:0 "Perhaps I should pay the recruitment office a quick visit"

GAL_wars.4.t:0 "In Our Forefather's Shoes"
GAL_wars.4.d:0 "Seven men lay in wait behind various rocks and obstructions by the roadside. Armed with an assortment of French, British, and Spanish muskets, their trap is set. A meager presence patrol of five French soldiers approaches, as the Frenchmen nonchalantly talk amongst one another. The Frenchmen walk right into the guerrilla's kill zone. The frontman of the Galician guerrilla fighters springs out from his cover, and before the French soldiers can react, he fires his weapon. One of the Frenchmen drops to the ground like a ragdoll. With the signal shot having been fired, the other six hidden men rise up quickly, and fire upon their target. Another three Frenchmen drop to the ground. The two surviving French soldiers drop their weapons, and begin to beg in a foreign tongue. The guerrillas, however, show no sympathy, and quickly acquaint the Frenchmen with the cold steel of their bayonets.\n\nOver a century later, at the same narrow road pass, six guerrillas lay behind roadside obstructions. Armed with an assortment of automatic, semi automatic, and bolt action weaponry, they wait for the incoming semi-platoon of Spanish infantrymen to approach. As the Spanish cross the threshold of the Galician guerilla kill zone, an improvised explosive detonates, killing several of the Spanish, and disorienting the rest. Two hand grenades are lobbed, which detonate within the Spanish ranks. Automatic rifle fire opens up from the Galicians, as the surviving Spaniards drop dead.\n\nMuch like their Iberian forefathers in the Spanish War of Independence, Galicians fight tooth and nail in the most unconventional ways to stave off occupation and to preserve their independence. No tactic too dirty, no cost too high, these fighters pay the ultimate sacrifice to ensure a future for their nation." 
GAL_wars.4.a:0 "We will stand and fight, just as they did"

GAL_wars.5.t:0 "A Pinch of Flour"
GAL_wars.5.d:0 "On rations, cooking good pasta can be difficult. With this garlic pasta recipe, however, you'll have an easy time making a wholesome and tasty meal for your whole family!\n\nTo begin, you will need 1 pound of dried spaghetti noodles.\nThen, fill a large pot with water, and apply a teaspoon of salt. Bring the water to a boil.\nPlace the pasta noodles into the pot.\nAs the pasta boils, in a separate pan, apply 3 tablespoons of olive oil, and one or two cloves of minced garlic, depending on how much is available in your area. If you have any stale bread, do not put it to waste! Crumble it up and add it to the pan. Apply medium heat.\nOnce the pasta is prepared in the pot, remove from heat. Apply 1 tablespoon of butter to the pan. Cook until you can clearly smell the minced garlic.\nApply the boiled pasta to the pan. Toss the pasta around thoroughly. If available, sprinkle some cheese in for added flavour!\n\nAnd there you have it, a tasty meal that fits easily within the parameters of your bi-weekly ration! This guide was designed to feed a family of four, however it can easily be adjusted to feed more, if your family is larger and receives larger rations." 
GAL_wars.5.a:0 "Delicious"

GAL_wars.6.t:0 "Old Friends"
GAL_wars.6.d:0 "In the long decades of Franco's rule over Galicia, intellectual thought and ideas were far from encouraged. As the Caudillos' grip over Iberia grew, many Galician intellectuals found themselves facing complete silencing, or should they have resisted, exile. Since the liberation of Galicia, however, many of these intellectuals have trickled back in to Galicia, eager to return to their homeland, free to profess ideas and thoughts without becoming a target.\n\nAs a result of the homecoming of the intellectual community, several prominent members of the community have been invited to a public meeting arranged by Álvaro Cunqueiro to discuss important matters held dear by them. Members of the public have arrived in surprising numbers to witness the meeting. The assembly is pitted to contain discussions upon Iberian affairs, the plausibility of the Galician nation, and Iberia's role in the evolving world, among other topics.\n\nThe intellectuals, being watched closely by a plethora of citizens and journalists, agree that Galicia has severe challenges facing it outside of pure security matters. The probable economic difficulties that Galicia will face, as well as the geopolitical difficulties of finding and maintaining steady support for such a small nation, are also discussed. As the discussions drag on, many feel a dual sense of liberation and dread. Although finally free, it would appear that the intellectual community, throughout their suppressed years, have developed a rather grim outlook upon Galicia, Iberia, and the world. They profess the dangers of the rapid and evolving new order, and agree that great caution will be needed for Galicia to survive these upcoming tumultuous years." 
GAL_wars.6.a:0 "Great minds think alike"

GAL_wars.7.t: "A Few Good Men"
GAL_wars.7.d: ""Under the Emergency Public Security Provisions, it is our duty to take you, Miguel Novo, into our custody. Anything that you say or do in our custody can be used in a court of law. Relevant property will be confiscated to the State should you be charged, however it shall be returned in the event of an acquittal. Please come with us."\n\nThe Police Officer was courteous, Miguel had to give him that. There were two of them, one of them reading the statement from a card while the other placed him in handcuffs. He wasn't surprised, he had expected this.\n\nHe was on his doorstep, a few of his neighbors coming out to spectate his arrest. He couldn't blame them, he'd been well known locally. His vocal denunciations of regionalism, that active support by any means of the rightful Spanish government by any means necessary, loudly declared in town meetings, squares and bars. He figured it was only a matter of time before the regionalist gestapo came for him.\n\nOne of the police officers closed his door and locked it with the key Miguel had provided, a courtesy that was appreciated . They would probably ransack it later, but at least he was afforded some dignity. The other police officer walked him to the waiting police car.\n\n"It's a shame you men are with this new State. You seem to have more decorum than most other traitors," he said as they placed him in the backseat, "arresting people for nothing more than their support for the rightful government."\n\nThe officer sighed, aged eyes looking at Miguel. "Some of us have seen enough barbarity to last us a lifetime Mr Novo" he said as he shut the car door."
GAL_wars.7.a: "What stands longer, a State or a Soul?"

GAL_wars.8.t: "Refusal to Serve"
GAL_wars.8.d: "The court was closed. No Jury or spectators stood behind Lois. The small, bare courtroom held only Lois, his guards, a clerk and the judge that sat before him. Not surprising, what legitimacy did this court have anyway? The uniforms were no different from before.\n\n"Lois Varela, you stand here accused of dereliction of duty, refusing to respect the repeated call up notices delivered to your addre-"\n\nLois cut in, shouting over the monotone voice of the judge. "This is a sham. I won't commit murder against my comrades, regardless of their state. I don't care what tortures you concoct to coerce me, I will wear no military uniform."\n\nLois glared defiantly. He'd been preparing that since he'd walked in. The Judge however stared dispassionately. "Be that as it may Mr Varela, you don't possess a special exemption from the Law. We are all subjects."\n\n"Unjust Law is illegitimate," Lois retorted, adding "your honor" sarcastically. He had heard the fates that had befallen similar men of conviction across Spain; he had prepared himself for it. He had been lucky to have been exempted before, but he'd known it would run out eventually. He'd been silent before, he would be damned if he made no statement now.\n\n"We won't debate the legitimacy of Galicia or its laws Mr Valera. In accordance with the emergency provisions I see no other recourse."\n\nLouis breathed in. This was it.\n\n"I sentence you to a suspended custodial sentence, with a conditional period of obligated labor to a strategic industry which shall be assigned in the coming days. Return the prisoner.""
GAL_wars.8.a: "Lois sat in his holding cell. "What?" he murmured."

