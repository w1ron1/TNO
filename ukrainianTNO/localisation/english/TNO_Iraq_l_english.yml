## Опис лідерів ##
 POLITICS_ABD_AL_KARIM_QASIM_DESC: "Яка спадщина єдиного лідера Іраку? Як його запам'ятають?\n\nНародившись в бідності від сунітського арабського батька та шиїтської фейлійської курдської матері, Абд аль-Карім Касим не був тим, від кого очікували великих досягнень. Він став учителем, а потім членом армії. Його інтелект і юнацький шарм допомогли йому піднятися по кар'єрних сходах. Ці якості призвели до того, що в 1950-х роках Касима запросили в Рух вільних офіцерів, неорганізовану групу військових, яка прагнула зруйнувати уряд, підтримуваний Італією. Практично одноосібно Касим захопив контроль над групою і використав її для повалення хашимітської монархії. Ця перемога сама по собі була б достатньою, щоб зробити його національним героєм, але його наступна перемога над вторгненням Тріумвірату, уособленням колоніалізму, в 1959 році зробила його обожнюваним, іконою в усьому регіоні.\n\nЗовні мало що змінилося з моменту революції та підписання Італо-Іракської угоди про дружбу, що завершила інвазію. Хоча націоналізм Касима вступає в конфлікт із зростаючими панарабськими настроями, а його поступки італійцям викликають нарікання, Касим залишається величною фігурою. Більшість готові терпіти його ексцентричне лідерство, його чистки серед колишніх друзів і прогресивні реформи, оскільки вони досі вірять у його концепцію революції. Вони все ще вірять в його бачення сучасної іракської держави, де люди різних віросповідань і походжень можуть об'єднатися для подолання бідності, секторального розколу та іноземної експлуатації.\n\n§xПоки що...§!"
 POLITICS_IRAQI_COMMAND_COUNCIL_DESC: "§x"Цей Ірак і цей стан випробувань\nЖоден режим не може виправити її стан\nЇї сини під правлінням базової тиранії\nЗагарбники серед них правлять її іменем\nНевинні переслідуються винними\nА праведники переслідуються нечестивими\nБажання окремої особи освячено як закон\nПопри нас, святі спільноти."§!\n\n- Бахр аль-Улюм, "Діван""
 POLITICS_VITO_MICELI_DESC: "Віто Мічелі, італійський консул в Багдаді, зрозумів, що іракці зайшли занадто далеко зі своєю так званою "революцією", коли Касим почав говорити про націоналізацію нафтопромисловості. Цей дурень, мабуть, очікував, що він просто зможе сидіти, поки араби крадуть нафтопродукти Італії, але ні. Мічелі був розумніший за це. Коли хаос поширювався по Близькому Сходу і хижаки почали кружляти, Віто Мічелі взяв справи у свої руки, щоб захистити інтереси Італії. Він знайшов кілька незадоволених членів іракської армії та своїх старих друзів з італійських спецслужб, і потім використав їх, щоб знищити "Єдиного Лідера". Він був там, коли цей чоловік помирав, марно повторюючи, що він був другом бідних і побудував "тисячі маленьких будинків".\n\nНаступний крок мав бути простим. Мічелі знайшов би нового "Єдиного Лідера", простодушного лялькового правителя, який знав би своє місце. Натомість після смерті Касима настала анархія, і Мічелі опинився в Багдаді, підтримуючи "перехідну владу", яка не мала жодної внутрішньої легітимності і явно була підконтрольна італійським інтересам.\n\nТепер Віто Мічелі змушений боротися не тільки за славу Італійської імперії, але й за своє життя. Бо хоча спадщина Касима може бути складною, мало хто буде терпіти подальше існування людини, яка втілює найгірше, що може запропонувати колоніалізм і імперіалізм."

 POLITICS_ABD_AL_RAHMAN_AL_BAZZAZ_DESC: "Революції 1941 і 1958 стали народними повстаннями проти десятиліть арабського гноблення, але їх перехопили злісні сили, пише Абд аль-Рахман аль-Базаз. Час поставити революцію на правильний шлях.\n\nНародившись у Багдаді в 1913 році в багатій сунітській родині, аль-Базаз мав життя, сповнене привілеїв і інтелектуальних досягнень. Він закінчив початкову та середню школу на відмінно. Він закінчив Багдадську юридичну школу в 1934 році в часи національного хаосу і невизначеності. Він отримав юридичну освіту в Лондонському королівському коледжі в останні роки перед німецьким вторгненням. Повернувшись, рішучий демократ і антиімперіаліст, він приєднався до повстання уряду Золотого квадрату проти своїх англійських панів. Він став деканом Багдадського юридичного факультету, використовуючи свою позицію, щоб пропагувати демократичний арабський націоналізм, переплетений з ісламськими ідеалами.\n\nАле наступні кілька років стали серією розчарувань. Уряд Золотого квадрату виявився не судном для панарабської визволенської боротьби, а італійським імперіалізмом. Його рішення виступити проти нього призвело до арешту і катувань. Він пережив короткий період свободи після Революції 1958 року, тільки щоб знову бути арештованим Касимом за підозрою у змові проти уряду. Його

 POLITICS_ABU_AL_QASIM_AL_KHOEI_DESC: "Посланець Аллаха (с.а.в.) сказав: "Коли людина помирає, її вчинки обриваються, за винятком трьох: безперервної милостині, знання, яким скористалися інші, і праведного сина, який молиться за неї." Абду Казім аль-Хої- вчений, юрист і лідер аль-Хавзи в Наджафі- все своє життя розумів це.\n\nНародившись в Ірані як син релігійного вченого, аль-Хої провів своє раннє життя, вивчаючи Коран і навчаючись у різних шиїтських лідерів. Це семінарське навчання дозволило йому розвинути унікальний голос серед юристів, часто співчутливий до жінок та невірних. Воно також вселило в нього глибоке почуття обов'язку перед мусульманами всього світу. Між духовними обов'язками та вивченням юриспруденції він став невтомним адвокатом благодійності, підтримуючи благодійні організації по всьому Іраку. Вчений став знайомим обличчям, де б не з'являлась катастрофа, використовуючи свої адміністративні навички та релігійні зв'язки, щоб забезпечити комфорт жертвам несправедливості.\n\nЦе саме відчуття обов'язку змусило аль-Хої діяти під час краху республіки Касима. Після того, як він став свідком зростаючої хвилі насильства по всьому Іраку і підйому деспотичних, демагогічних лідерів, аль-Хої оголосив, що обов'язок духовенства - виступити проти корупції та гноблення. За тихої підтримки Великого Аятоли аль-Хої скликав і призначив делегацію шиїтських лідерів для відновлення порядку в Наджафі. Тримаючи дистанцію між собою та повстанням, аль-Хої став потужним символом для тих, хто сподівається на новий уряд, що керується демократичними ісламськими принципами."

 POLITICS_AHMED_HASSAN_AL_BAKR_DESC: "Що таке 1958 рік, якщо не неповна революція? Так, арабські народи Іракського регіону скинули найбільш очевидні символи західного імперіалізму, але вони залишалися штучно поділеними від своїх братів. Вони були полоненими в державах, нав'язаних іноземцями, і знищеними економічними системами, залежними від іноземних інтересів. Тепер, каже Ахмед Хасан аль-Бакр, настав час для арабських народів зруйнувати це спадкоємство гноблення.\n\nНародившись у Тікриті, коли той ще перебував під ігом турецького гноблення, життя аль-Бакра було визначено боротьбою. Він подолав важке дитинство і провів шість років вчителем початкової школи, перш ніж вступити в Іракську армію. Коли Золотий квадрат здійснив свою революцію проти британців в 1941 році, аль-Бакр, його сім'я та багато його товаришів по службі приєдналися до нього, лише для того, щоб опинитися на маргінесі після цього. Обурений тим, що його обманули, обмінявши британських панів на італійських, аль-Бакр почав тяжіти до двох таборів: Руху вільних офіцерів — підпільної групи офіцерів, присвяченої поваленню монархії, та нової фракції — Арабської Соціалістичної партії Ба'ас.\n\nНавіть після того, як Касим став Єдиним Лідером і почав жорстокий наступ на Ба'ас, аль-Бакр твердо переконувався, що партія була призначена бути революційними авангардами, інструментом, через який імперіалізм буде переможений. Стоячи серед руїн республіки Касима, він вирішив використовувати свою владу як голови військового бюро партії, щоб завершити неповну революцію 1958 року і забезпечити арабське єдність нарешті.\n\nБудь-якими необхідними методами."

 ### Ідеї ###
 IRQ_july_14_legacy: "Спадщина 14 липня"
 IRQ_july_14_legacy_desc: "Минуло майже 5 років з Революції 14 липня, і в багатьох аспектах вона все ще залишається незавершеною. Революція почалася як народне та поширене повстання проти італійського впливу, але швидко переросла в анархію, війну всіх проти всіх. Комуністи боролися з шиїтами, демократи боролися з мілітаристами, а всі воювали з ба'асистами. Лише військовий переворот генерала Абд аль-Каріма Касима і створення його уряду національного консенсусу припинили боротьбу. Відтоді Касим визнається кожною партією як лідер Іраку, але не дуже потужний. Його правління базується на консенсусі, що політичні партії країни індивідуально занадто слабкі, щоб об'єднатися проти нього, і що італійці завжди будуть прагнути підтримувати його режим як бастіон проти ба'асизму, підтримуваного Німеччиною."

 IRQ_dawa_ascendant: "Підйом Да'ва"
 IRQ_dawa_ascendant_desc: "Багато чого на політичній сцені Іраку залишається незмінним вже десятиліттями. Слабкий маріонетковий уряд, підтримуваний іноземною державою. Панарабці, чисельні в підтримці, але протиставлені всім іншим. Старі чоловіки, які говорять про демократію, молоді чоловіки, які пропагують комунізм. Опортуністи і корупція в армії (і везде). Проте, натхненні економічним стагнацією Іраку та утисками (як реальними, так і сприйманими) їхньої віри по всьому Близькому Сходу, іракські шиїти все більше і більше приєднуються до ісламської партії Да'ва, заснованої для того, щоб представляти їх і їхні проблеми. Хоча сама партія далеко не єдина, її зір продовжує зростати, навіть коли стабільність Іраку залишається сумнівною, і ніхто не сумнівається, що це сила, з якою потрібно рахуватися."

 IRQ_italian_interference: "Італійське втручання"
 IRQ_italian_interference_desc: "Хоча Ірак на папері може бути найнезалежнішою нацією в італійській сфері, насправді країна залишається сильно залежною від своїх патронів у Римі. Іракська нафта видобувається італійцями, його армія посилена і навчена італійськими радниками, а політика зазнає труднощів через принизливі угоди, що тримають країну слабкою і залежною. Хоча політики всіх напрямків засуджують постійну підкореність своєї нації, надто багато з них отримують вигоду від італійської підтримки та корупції, щоб щось із цим зробити."

 IRQ_italian_interference1: "Італійське втручання"
 IRQ_italian_interference1_desc: "Хоча на папері Ірак є, мабуть, найбільш незалежною нацією в італійській сфері, насправді країна залишатиметься сильно залежною від своїх патронів у Римі. Іракська нафта видобувається італійцями, його армія посилена та навчена італійськими радниками, а політика ускладнюється принизливими угодами, що тримають країну слабкою та залежною. Хоча політики всіх напрямків засуджують постійну підкореність своєї нації, надто багато з них отримують вигоду від італійської підтримки та корупції, щоб щось із цим зробити."

 IRQ_ineffecient_oil_industry: "Неефективна нафтова промисловість"
 IRQ_ineffecient_oil_industry_desc: "Здавалося б, відкриття величезних нафтових родовищ повинно було б призвести до економічного покращення. Але це буде здивуванням, якщо ви відвідаєте Ірак. Хоча нафтова промисловість Іраку включає великі нафтові поля в його пустелях та численні нафтопереробні заводи в містах, його фактичне виробництво залишається на низькому рівні. Та нафта, яка видобувається, часто крадеться та продається на чорному ринку або губиться в бюрократичному лабіринті Іраку, корупції та забрудненні. Якщо, всупереч всім перешкодам, бочка нафти все ж доходить до відправлення, гроші в основному йдуть італійцям, які її перевозять. Якщо ж якась монета потрапить назад у країну її походження, то швидше за все вона піде в кишені політичної або економічної еліти, а не до тих, хто насправді знайшов нафтове родовище, видобув його або працював на очищення нафти."

 IRQ_the_spectre_of_baathism: "Привид Ба'асизму"
 IRQ_the_spectre_of_baathism_desc: "Як і в інших частинах регіону, араби Іраку стають усе більш неспокійними, прагнучи створити об'єднану державу, вільну від імперіалізму та західної деградації. Це не новина, і ці почуття вже були виражені раніше, в революції 14 липня (яка черпала натхнення з повстань в Єгипті та інших країнах). Однак провал революції не переміг іракськ панарабізм, а навпаки, зробив його таємним, ефективним і добре організованим через партію Ба'ас. Хоча може й не бути видно самих ба'асистів, вони тим не менше присутні. Їхні плакати з'являються вночі, незважаючи на двоїсті зусилля уряду та гарнізону їх прибрати; їхні гасла звучать на дедалі більш поширених протестах; і здається, що в пустелі нескінченне постачання цих рішучих, злих чоловіків, які прагнуть влади, яку вони певні, що зрештою отримають."
