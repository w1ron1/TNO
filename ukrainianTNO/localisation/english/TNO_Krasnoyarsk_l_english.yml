 ## Leaders ##
 POLITICS_NIKOLAI_ANDREEV_DESC: "Ніколай Трофімовіч Андрєєв, народжений 1905 року, був призваний із резерву й у 1935 році повністю повернувся до Червоної армії, спершу як політичний комісар у Сибіру. Сподіваючись воювати з німцями на передовій, натомість був направлений до офіцерської школи. Та що відчайдушнішою ставала війна, то більше курсів він проходив - не для того, щоб стати вправнішим, а щоб якомога довше відтягнути відправлення на фронт у війні, яку вважав програною. Коли Совєцький Союз почав розпадатися, Андрєєв разом із клікою інших випускників офіцерської школи почав зміцнювати свою владу в Красноярському регіоні. Та після утворення Центральносибірської Республіки новий уряд небезпідставно занепокоївся існуванням уже сформованих угруповань, здатних загрожувати демократичним інституціям, тож кліку розпустили, а її членів розподілили по найдальших куточках Республіки. Сам Андрєєв опинився під командуванням Ніколая Крилова, та потай продовжував підтримувати зв'язок зі своїми людьми.\n\nКоли Республіка почала втрачати контроль і розпадатися, кліка знову зібралася в Красноярську й підняла заколот проти генерала Крилова під час його приреченої кампанії проти Сибірської Чорної Армії. Тепер, аби переконати мешканців міста, що перед ними не просто чергова хунта, Андрєєв і його офіцери пообіцяли нові й масштабні реформи. Вільна торгівля! Приватна власність! Іноземні союзники! Відкриті вибори! Свобода! Демократія!\n\nПісля краху старого порядку кліка доходить висновку, що справа об'єднання Сибіру тепер лежить саме в її руках. Після цього почнеться шалена гонка до моря й іноземного визнання, а вже тоді - зміцнення влади та підготовка до походу за визволення всієї Росії. Та чи справді Андрєєв зможе виконати всі ці обіцянки - зовсім інше питання."
 
 MILITARY_NIKOLAI_ANDREEV_DESC: "§LНіколай Трофімовіч Андрєєв народився 1905 року в Москві. Працював кур'єром, учнем коваля та друкарем, перш ніж 1935 року вступив до Червоної армії, де служив піхотним командиром у 93-й стрілецькій дивізії, а 1938 року - військовим комісаром Тайшетського району Іркутської області. Коли Німеччина вторглася до Совєцького Союзу, Андрєєв спершу прагнув потрапити на фронт, але натомість його відправили на схід проходити офіцерські курси. Та коли під німецьким натиском Союз почав розвалюватися, а Політбюро евакуювалося на схід, він уже докладав усіх зусиль, щоб відтягнути власне відправлення на фронт, і разом із клікою інших випускників офіцерської школи зміцнив владу в Красноярську. Центральносибірська Республіка від самого початку ставилася до кліки Андрєєва з підозрою, тож її розпустили, а учасників розкидали по різних призначеннях; самого Андрєєва поставили під командування Ніколая Крилова. Та під час Сибірської війни він зрозумів, куди дме вітер, знову зібрав свою кліку в її старому осередку влади й підняв заколот проти Крилова, остаточно поклавши край Центральносибірській Республіці."
 MILITARY_ALEXEY_PESTEREV_DESC: "§LАлєксєй Івановіч Пєстєрєв народився 1910 року в Бурятії. Працював колгоспником і будівельником, 1939 року вступив до Комуністичної партії, а 1941-го був призваний до Червоної армії. Служачи політичним комісаром у 209-й піхотній дивізії, Пєстєрєв швидко дослужився до виконувача обов'язків командира 932-го піхотного полку - як завдяки власним здібностям, так і через страхітливі втрати, яких армія зазнавала під час нищівного німецького наступу територією Совєцького Союзу. Під щільним вогнем він евакуював рештки свого полку за Урал, після чого потрапив під командування Ніколая Андрєєва. Вражений рішучістю Пєстєрєва, Андрєєв швидко прийняв його до своєї кліки. Під час заколоту проти Ніколая Крилова Пєстєрєву відвели ключову роль: він захопив переправи через Єнісей, відрізавши кілька полків Крилова на західному березі й прирікши їх на знищення Сибірською Чорною Армією.§!"
 MILITARY_NIKOLAI_LYASHCHENKO_DESC: "§LНіколай Ґріґорьєвіч Лящєнко народився 1910 року в Іркутську, а молодість провів у Киргизстані, де працював конюхом і ковалем, перш ніж вступити до місцевого профспілкового комітету, а 1929 року добровільно піти до Червоної армії. Відзначившись у совєцько-китайському конфлікті, він був направлений до Центральноазійської військової школи, яку закінчив 1932 року, після чого служив командиром піхоти в 73-й піхотній дивізії. 1936 року за заслуги Лящєнка нагородили орденом Червоної Зірки. Згодом він служив військовим радником у громадянській війні в Іспанії, повернувся з орденом Червоного Прапора й одразу був направлений на подальше навчання. Під час розпаду Совєцького Союзу він став одним із перших членів кліки випускників Ніколая Андрєєва. Коли Центральносибірська Республіка взялася розбивати кліку, Лящєнка відправили до Новосибірська, де він із притаманною йому відвагою воював у Сибірській війні. Та тривало це недовго: після зради Алєксандра Покришкіна він повернувся до Красноярська - лише для того, щоб зрештою й самому зрадити Республіку.§!"
 MILITARY_ALEKSANDRA_SAMUSENKO_DESC: "§LАлєксандра Ґріґорьєвна Самусєнко народилася 1922 року й, за чутками, ще підліткою брала участь у громадянській війні в Іспанії. До Червоної армії вона вступила 1935 року. Спершу служила в піхотному взводі, потім воювала в совєцько-фінській «Зимовій війні», а після закінчення танкової академії приєдналася до 1-ї гвардійської танкової армії як її єдина жінка-танкістка. За проявлену відвагу Самусєнко була неодноразово нагороджена, зокрема орденом Червоної Зірки. Після операції «Барбаросса» вона провела понівечені рештки 97-ї гвардійської танкової бригади за Урал і приєднала свою бригаду до Центральносибірської Республіки. Підпорядкована Ніколаю Крилову, Самусєнко бачила, як у Сибірській війні було знищено танковий корпус Великої армії Республіки. Саме це зрештою підштовхнуло її приєднатися до заколоту Ніколая Андрєєва проти Крилова, забивши останній цвях у труну Республіки.§!"
 
