 ## Ideas ##
 KRS_wild_promises: "Шалені обіцянки"
 KRS_wild_promises_desc: "Народ, м'яко кажучи, скептично поставився до нашого уряду після провалів як Совєцького Союзу, так і наступної Центральносибірської республіки. Щоб здобути їхню підтримку, президент Андрєєв пообіцяв їм увесь світ, пропонуючи всілякі соціальні, політичні та економічні реформи в кожній своїй пишномовній промові. Та хоча генералісимус поки що захопив їх, невдовзі народ вимагатиме від нас виконання обіцянок. Справжній стан держави набагато нестабільніший, ніж ми дали людям повірити, і шлях, яким ми йдемо, вузький та небезпечний, але якщо ми досягнемо успіху, то, можливо, зможемо подарувати їм увесь світ."
 KRS_military_guided_democracy: "Демократія під керівництвом військових"
 KRS_military_guided_democracy_desc: "На власному досвіді відчувши провал демократії під керівництвом цивільних у запобіганні повному суспільному та військовому краху Центральносибірської республіки, ми закріпили нашу систему правління, щоб забезпечити спільне управління між народом і військовими. Посаду президента обіймає головнокомандувач армії, призначений Генеральним штабом, тоді як прем'єр-міністра та Національні збори демократично обирає народ. Проте президент, а отже й військові, повинні погодитися на формування будь-якого нового цивільного уряду й можуть на власний розсуд розпустити його та скасувати законодавство."
 KRS_treasonous_traditions: "Зрадницькі традиції"
 KRS_treasonous_traditions_desc: "Покинувши Червону армію, а потім піднявши заколот проти Центральносибірської республіки, наш офіцерський корпус виробив як схильність, так і готовність виступати проти будь-якого режиму, який загрожує його майбутньому та інтересам. Коли наша молода Республіка робить свої перші кроки, а участь військових у нашій політиці та їхній вплив на неї стають дедалі звичнішими, багато хто побоюється, що гріхи минулого стануть гріхами завтрашнього дня.\n\n§RВійськові можуть вирішити діяти, якщо будуть незадоволені нашим урядом.§!"
