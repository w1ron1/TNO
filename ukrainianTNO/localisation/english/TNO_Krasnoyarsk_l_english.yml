 ## Ideas ##
 KRS_wild_promises: "Шалені обіцянки"
 KRS_wild_promises_desc: "Люди, м'яко кажучи, скептично ставилися до нашого уряду після провалу як Совєцького Союзу, так і Центральносибірської Республіки. Щоб заручитися їхньою підтримкою, президент Андрєєв пообіцяв їм увесь світ, у кожній своїй гучній промові пропонуючи всілякі соціяльні, політичні та економічні реформи. Та хоч нині Генералісімус і зумів захопити народ своїми словами, невдовзі люди вимагатимуть виконання обіцяного. Справжній стан країни значно хиткіший, ніж ми дали людям зрозуміти, тож шлях перед нами вузький і небезпечний. Та якщо нам удасться, можливо, ми й справді зможемо подарувати їм увесь світ."
 KRS_military_guided_democracy: "Демократія під проводом військових"
 KRS_military_guided_democracy_desc: "На власному досвіді побачивши, як цивільна демократія не змогла запобігти цілковитому суспільному й військовому краху Центральносибірської Республіки, ми закріпили систему, за якої управління державою поділяється між народом і військом. Посаду президента обіймає головнокомандувач армії, якого призначає Генеральний штаб, тоді як прем'єр-міністра й Національні збори демократично обирає народ. Однак президент, а отже й військові, мають схвалити формування будь-якого нового цивільного уряду й можуть на власний розсуд як його розпустити, так і скасувати ухвалені закони."
 KRS_treasonous_traditions: "Зрадницькі традиції"
 KRS_treasonous_traditions_desc: "Покинувши Червону армію, а згодом піднявши заколот проти Центральносибірської Республіки, наш офіцерський корпус набув і схильности, і готовности виступати проти будь-якого режиму, що загрожує його майбутньому та інтересам. Тепер, коли наша молода Республіка робить перші кроки, а участь військових у політиці та їхній вплив на неї дедалі зростають, багато хто боїться, що гріхи минулого стануть гріхами майбутнього.\n\n§RВійськові можуть вдатися до дій, якщо будуть незадоволені нашим урядом.§!"
