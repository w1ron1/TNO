 ## Leaders ##
 POLITICS_NIKOLAI_ANDREEV_DESC: "Народжений 1905 року Микола Трохимович Андрєєв був призваний із запасу, щоб повністю повернутися до лав Червоної армії у 1935 році, спочатку як політичний комісар у Сибіру. Сподіваючись воювати на передовій проти німців, натомість він вступив до офіцерської школи. Але в міру того, як війна ставала дедалі відчайдушнішою, він продовжував брати все більше й більше курсів — не для того, щоб стати вправнішим, а в надії відтермінувати відправлення на фронт за те, що він вважав програною справою. Коли Совєцький Союз розпався, він і група однодумців-випускників офіцерської школи почали консолідувати свою владу в Красноярському регіоні. Проте після створення Центральносибірської республіки вони цілком обґрунтовано занепокоїлися через існування будь-яких попередніх угруповань, які могли б загрожувати демократичним інституціям, і тому уряд розпустив групу та призначив її членів у найвіддаленіші куточки Республіки. Андрєєва підпорядкували Миколі Крилову, хоча він таємно залишався на зв'язку зі своєю групою.\n\nКоли Республіка почала втрачати владу й розпадатися, група возз'єдналася в Красноярську та підняла заколот проти генерала Крилова під час його приреченої кампанії проти Сибірської Чорної армії. Тепер, щоб переконати жителів міста, що вони не просто чергова різновидність хунти, Андрєєв та його офіцери пообіцяли нові й всеосяжні реформи. Вільна торгівля! Приватна власність! Іноземні союзники! Відкриті вибори! Свобода! Демократія!\n\nПісля краху попереднього порядку група вважає, що справа сибірського возз'єднання перебуває в їхніх руках. Після цього почнеться шалений ривок до моря, а разом із ним — міжнародне визнання, перш ніж консолідуватися та підготувати наступ для визволення всієї Росії. Але чи зможе Андрєєв насправді виконати ці обіцянки — зовсім інше питання."
 
 MILITARY_NIKOLAI_ANDREEV_DESC: "§LНароджений 1905 року в Москві, Микола Трохимович Андрєєв працював посильним, учнем коваля та друкарем, перш ніж нарешті вступити до Червоної армії у 1935 році, ставши командиром піхоти 93-ї стрілецької дивізії, а потім військовим комісаром Тайшетського району Іркутської області у 1938 році. Спочатку прагнучи вирушити на фронт, коли Німеччина вторглася до Совєцького Союзу, Андрєєва натомість відправили на схід для проходження офіцерських курсів. Однак, коли Совєцький Союз почав розпадатися під німецьким натиском, а Політбюро евакуювалося на схід, він доклав усіх зусиль, щоб відтермінувати відправлення на фронт, і разом із групою випускників офіцерської школи зміцнив владу в місті Красноярську. Спочатку викликаючи підозру в Центральносибірській республіці, групу Андрєєва було розпущено та розпорошено за різними призначеннями, а самого Андрєєва підпорядковано Миколі Крилову. Проте, здатний побачити напис на стіні під час Сибірської війни, Андрєєв зібрав свою групу на старій базі влади та підняв заколот проти Крилова, поклавши край Центральносибірській республіці.§!"
 MILITARY_ALEXEY_PESTEREV_DESC: "§LНароджений 1910 року в Бурятії, Олексій Іванович Пестєрєв працював колгоспником і будівельником, вступивши до Комуністичної партії у 1939 році, перш ніж бути призваним до Червоної армії у 1941 році. Служачи політичним комісаром 209-ї піхотної дивізії, Пестєрєв швидко піднявся до посади виконувача обов'язків командира 932-го піхотного полку завдяки як власним заслугам, так і величезним втратам, яких зазнала дивізія перед лицем німецького наступу через Совєцький Союз. Евакуювавши те небагато, що залишилося від його полку, через Урал під сильним вогнем, Пестєрєва підпорядкували Миколі Андрєєву, який, вражений рішучістю Пестєрєва, швидко прийняв його до своєї групи. Отримавши ключову роль у заколоті проти Миколи Крилова, Пестєрєв захопив переправи через річку Єнісей, залишивши кілька полків Крилова на західному березі та забезпечивши їхнє знищення силами Сибірської Чорної армії.§!"
 MILITARY_NIKOLAI_LYASHCHENKO_DESC: "§LНароджений в Іркутську 1910 року, Микола Григорович Лященко провів ранні роки життя в Киргизстані, ставши конюхом і ковалем, перш ніж вступити до місцевого профспілкового комітету, а потім добровільно записатися до Червоної армії у 1929 році. Відзначившись у Сіно-совєцькому конфлікті, він був направлений до Центральноазійського військового училища й закінчив його у 1932 році, служачи командиром піхоти 73-ї піхотної дивізії. Нагороджений орденом Червоної Зірки за заслуги у 1936 році, Лященко служив військовим радником під час громадянської війни в Іспанії та повернувся з орденом Червоного Прапора, після чого його негайно відправили на подальше навчання. Один із перших членів групи випускників Миколи Андрєєва під час розпаду Совєцького Союзу, Лященко був відправлений до Новосибірська в межах спроби Центральносибірської республіки розпорошити групу, де відзначився характерною хоробрістю під час Сибірської війни. Однак це тривало недовго: після зради Центральносибірської республіки Олександром Покришкіним він повернувся до Красноярська, лише щоб самому зрештою зрадити Республіку.§!"
 MILITARY_ALEKSANDRA_SAMUSENKO_DESC: "§LНароджена 1922 року й, за чутками, така, що служила в громадянській війні в Іспанії ще підлітком, Олександра Григорівна Самусенко вступила до Червоної армії у 1935 році. Спочатку служачи у взводі піхоти, вона спершу брала участь у Російсько-фінській «Зимовій війні», перш ніж закінчити танкову академію та приєднатися до 1-ї гвардійської танкової армії як її єдина жінка-танкіст. Високо відзначена за хоробрість і нагороджена орденом Червоної Зірки, Самусенко очолила пошарпані рештки 97-ї гвардійської танкової бригади через Урал після операції «Барбаросса» та приєднала свою бригаду до Центральносибірської республіки. Підпорядкована Миколі Крилову, після знищення танкового корпусу Великої армії Республіки під час Сибірської війни Самусенко приєдналася до Миколи Андрєєва в його заколоті проти Крилова, забивши останній цвях у труну Республіки.§!"
 
