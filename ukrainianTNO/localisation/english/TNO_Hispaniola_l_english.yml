MEX_Puerto_Plata.1.t:0 "Терміновий звіт про операції в Домінікані"
MEX_Puerto_Plata.1.desc:0 "ДЕРЖАВНЕ УПРАВЛІННЯ БЕЗПЕКИ\n\nПИТАННЯ: Спроба замаху СІМ у Федеральному окрузі.\n\nО 22:15 цього вечора два агенти Служби військової розвідки Домініканської Республіки, або СІМ, здійснили спробу вбити Хуана Боша, коли він повертався до свого готелю в Зона Роса Федерального округу.\n\nДУС отримало інформацію про ймовірний напад від джерела в адміністрації Трухільо та встановило спостереження для захисту Боша, головного лідера домініканської опозиції, після його прибуття до Мексики. Помітивши, що Toyota з тонованими вікнами слідувала за таксі Боша кілька кварталів, агент ДУС протаранив автомобіль власним, одночасно викликавши підкріплення. Двоє озброєних чоловіків втекли з Toyota, але їх переслідували та ліквідували кілька агентів у перестрілці.\n\nПрофіль одного з нападників відповідав відомому агенту СІМ, однак інший був невідомий джерелам ДУС. У обох були якісні фальшиві документи, які засвідчували їх як співробітників Banco de Comercio, а також сучасна німецька зброя. Агенти наразі намагаються ідентифікувати контакти СІМ, притулки чи шляхи проникнення, які використовували ці двоє, але прогрес уповільнено через отримані в операції поранення.\n\nПоки ці ресурси не будуть захоплені й не буде підтверджено відсутність додаткових інфільтраторів, безпека Боша не може бути гарантована. Уряд Трухільо також раніше відповідав на поразки, націлюючись на мексиканських силовиків та політичних посадовців. Подальші операції з розвідки з боку Домініканської Республіки становлять зростаючу загрозу національній безпеці.\n\nЗ повагою,\n\nКапітан Луїс де ла Барреда Морено"
MEX_Puerto_Plata.1.a:0 "Негайно передати президенту Лопесу Матеосу."

MEX_Puerto_Plata.2.t:0 "Ель Пойо та Ель Кабальйо"
MEX_Puerto_Plata.2.desc:0 "Фернандо Гутьєррес Барріос, капітан ДУС, зустрічав багатьох потенційних революціонерів під час своєї служби. Вони відповідали на його запитання, а потім більше про них ніхто не чув. Як особливо тоді було отримати повідомлення не від чергового комуніста чи агітатора-сінархіста, а від справжнього революціонера. Від Фіделя Кастро.\n\nЇхнє знайомство почалося за несприятливих обставин. У 1956 році Гутьєррес стежив за кубинцем і його партизанами, які планували повалення Батисти на ранчо в штаті Мехіко. Вперше, коли Кастро побачив його обличчя, Фернандо вдягав на нього наручники.\n\nАле під час подальших допитів слова Кастро були не словами злочинця, а словами революціонера, який прагнув повалити кубинського Уерту. Або ж потенційного союзника для Мексики. Вони дійшли до... домовленості, і Гутьєррес Барріос домігся звільнення дисидентів. Коли повстанці вирушили з Туспана до своєї батьківщини, дует потиснув один одному руки.\n\nТепер у цій самій руці був телеграм, що містив привітання з підвищенням Гутьєрреса та стандартні розповіді про останнє полювання та риболовлю Кастро. Їх типова дружня переписка... доки не виникло питання Домінікани.\n\nКастро стверджував, що настав час позбавити Еспаньйолу від її диктатора-фашиста. Німецькі покровителі Республіки перевантажені, а старі союзники, такі як Церква, віддаляються. Аббес і його СІМ тимчасово втрачають рівновагу через провал спроби замаху на Боша. Міські партизани 14 червня набирають сили, підживлені незадоволенням серед домініканської молоді та середнього класу. Три роки підривної діяльності з боку Мексики та Куби зараз об'єднуються в ідеальний шторм.\n\nГутьєррес Барріос повідомить секретаря Діаса Ордаса та президента про цю тимчасову можливість разом із своєю рекомендацією скористатися нею на повну."
MEX_Puerto_Plata.2.a:0 "Вони з Кастро скинули одного карибського диктатора. Залишився ще один."

MEX_Puerto_Plata.3.t:0 "Добрий вечір, Команданте"
MEX_Puerto_Plata.3.desc:0 ""Завжди радий поговорити з тобою, Адольфо," розпочав Кастро, "і дякую, що зважив на мій насичений графік."\n\nЛопес Матеос знав про нічні звички кубинського лідера, але зустріч опівночі була все ж таки несподіванкою. Чашку чорної кави він тримав так само міцно в лівій руці, як і телефонну трубку в правій. Притягнувши трубку ближче до рота, він сказав: "Звісно, Фіделю, капітан Гутьєррес повідомляє, що ти розглядаєш дії проти режиму Трухільо. Який твій план і чого ти від нас чекаєш?"\n\n"Переворот. Ми обоє хочемо бачити Трухільо і Батісту в трунах, а решту режиму – зміщеними. Він тріщить по швах, Адольфо, цивільні лідери та генерали вже таємно звертаються до наших агентів і ваших. Ми натиснемо, і решта щурів повистрибують за борт."\n\nЕль Команданте продовжив: "Моє прохання полягає в створенні офісу для спільних розвідувальних операцій у Гавані. Завтра вранці капітан Гутьєррес надішле тобі звіт про Oficina Conjunta de Asuntos Externos, або ОКАЕ, як ми її називаємо. Сила наших домініканських мереж зросте в п'ять разів, якщо ми об'єднаємо їх. Цей Спільний офіс закордонних справ об'єднає дисидентів і вигнанців, таких як Рух 14 червня, і допоможе організувати Карибський легіон."\n\nЛопес Матеос нишком зробив ковток кави, так само як, схоже, Гутьєррес нишком співпрацював із Кастро, минаючи ланцюжок командування. Їхній вибір союзників теж викликав занепокоєння. Тут, у Мексиці, Карибський легіон тримали під суворим контролем, але хто знає, що ці сварливі криптокомуністи могли б утнути на Еспаньйолі. Але... якщо хтось і міг скинути карибського монстра-диктатора, то це були ці двоє. А Гутьєррес міг стримувати радикалів. "Мексика підтримує тебе, Фіделю. Я затверджую цей ОКАЕ, і капітан Гутьєррес матиме свободу дій і фінансування, які йому потрібні.""
MEX_Puerto_Plata.3.a:0 "Ми помстимося за '48 за будь-яку ціну."
MEX_Puerto_Plata.3_tt: "£GFX_decision_icon_small §YРішення§! щодо §xповалення Трухільо§! буде розблоковано."
PP_Command_Power_MEX_tt: "Ми отримуємо §Y25§!£command_power §YОчки командування§! для проведення домініканських операцій."

MEX_Puerto_Plata.4.t:0 "Карибська координація"
MEX_Puerto_Plata.4.desc:0 "Двоє провідних шпигунів Федерального округу сиділи за столом, розділені відстанню в довжину столу. Представник Вашингтона, Вінстон Скотт, був балакучим і довго говорив іспанською про заплановану військово-морську та авіаційну підтримку США для висадки в Пуерто-Плата. З пам’яті він викладав цілі для диверсантів, які мають вступити в дію, як тільки Карибський легіон досягне берега. Кульмінацією був план перевороту проти Трухільо та впровадження спільного цивільно-військового уряду.\n\nВінстон стверджував, що високопоставлені військові чиновники готові діяти, як тільки Ель Хефе буде мертвий. І це буде не через старість. ФБР вже переправило гвинтівки М14 і тисячі доларів групі інсайдерів, серед яких був член особистої охорони Трухільо.\n\nНа цей момент мексиканець Фернандо Гутьєррес Барріос порушив мовчання: "Амадо Гарсія Герреро. ДУС також постачає цю групу через генерала Діаса, хоча ми більше зосередилися на зв’язку їх із співчуваючими членами режиму, ніж на забезпеченні матеріалами." На здивовану брову Вінстона він відповів: "Інший Діас, Модесто, ще один добре розташований чоловік, який врятував життя Хуана Боша."\n\n"Цікаво..." – відповів Вінстон, барабанячи пальцями по столу. "І як ФБР може допомогти ДУС?"\n\n"Ми працюємо над координацією різних осередків 14 червня в більш широкий рух. Якщо ваші диверсанти пріоритетно зірвуть комунікацію СІМ навколо Сантьяго в день вторгнення, я прогнозую успішне захоплення центру міста. Легіон тоді матиме чіткий шлях до Сьюдад Трухільо.""
MEX_Puerto_Plata.4.a:0 "LITEMPO продовжує приносити плоди."

MEX_Puerto_Plata.5.t: "Молитва війни"
MEX_Puerto_Plata.5.desc: ""Боже сили та милосердя, творець любові та миру..." Народжений у 1943 році в Мехіко, молодий Андре Сантана мав боротися з реальністю, побудованою на експлуатації та навмисному невігластві. Його батько постійно вигорав на роботі зі складання дверей автомобілів на заводі Ford. Його мати працювала неповний робочий день покоївкою в родині емігрантів з Кумамото. Його старший брат торгував дерев’яними виробами на вулиці. Але його дід... його дід був гордим селянином, який відмовився терпіти знущання з боку асьєнд і приєднався до Дивізіону дель Норте. Як він розповідав про часи, коли сидів верхи на своєму коні з карабіном 30-30, дід Андре був одним із останніх людей свого покоління, до того як сучасний капіталізм зламав їхні спини.\n\n"Пізнати тебе — означає жити, а служити тобі — значить царювати..." Білі піски Пуерто-Плата простягалися настільки далеко, наскільки міг бачити Андре, розділяючи домініканське місто від безкінечного синього неба та моря. Поруч із ним були люди всіх типів і переконань — такі ж мексиканські хлопці, як і він, ветерани Кубинської революції, домініканські дисиденти, гаїтяни, які прагнуть помсти, і янкі, готові боротися. Це було більше, ніж ковбої та американські пастухи, поруч із якими стояв його дід. Уся Америка об’єдналася, щоб знищити тиранію, несправедливість, невігластво —\n\n"Через заступництво Михаїла Архангела будь нашим захистом від усіх лих..." Але шлунок Андре був у вузлах. Він був не в Мехіко. Він був на чужій землі, ворожій землі, повній фашистів і гітлерівців, які хотіли його смерті. Якби він помилився, він би помер. Він йшов до Фаро, знакового маяка міста. Можливо, лише тренування тримало його в русі та не дало впасти від страху.\n\n"Допоможи мені подолати війну і насильство та встановити твій закон любові та справедливості..." Чорні "Фольксвагени" СІМ наближалися дорогою. Командир Андре закричав, щоб вони ховалися. Коли Андре навів свій AR-10 на передню машину, він закінчив молитву, сподіваючись, що вона не стане його останньою."
MEX_Puerto_Plata.5.a: "Даруй це через Христа, нашого Господа. Амінь."
MEX_Puerto_Plata.5.tt:0 "Почалося вторгнення Легіону в Домініканську Республіку. Нові §YРішення§! було розблоковано.\n\n§KЛіві та Націоналісти§! отримають середнє §wпокращення думки§! §yпідтримку§!!"
MEX_Puerto_Plata.5.tt.1:0 "Почалося вторгнення Легіону в Домініканську Республіку. Нові §YРішення§! було розблоковано."

MEX_Puerto_Plata.6.t: "Ретроспектива"
MEX_Puerto_Plata.6.desc: "До Секретаря Ордаса, Капітану Гутьєрресу Барріосу:\n\nЯ щиро радий, що Трухільо було усунуто відповідно до наших планів. Однак, у світлі провалу другої стадії плану, оновлення щодо можливостей чинного режиму — та його внутрішньої структури — повинно бути доставлене в мій офіс якомога швидше.\n\nШановний Секретарю Олачеа:\n\nБудь-які боєприпаси, які ще можна відновити з наших сховищ зброї, мають бути негайно відправлені назад у Веракрус. Ви цілком здатні впоратися із цим.\n\nСекретарю зовнішніх відносин Барро:\n\nОрганізуйте телефонну розмову з Кастро якомога швидше. Планування було дуже корисним, так, але тільки до певної межі (Пупо не з’явився). Легіон буде підтримано настільки, наскільки ми зможемо надати максимальну допомогу, не порушуючи доктрину Естради.\n\nЛопес Матеос оглянув аркуші паперу, розкладені на його столі. Чи не забув він когось? Його мозолясті пальці напружилися, оскільки перо стало важчим. Ах, так —\n\nВітаю, Ліценціадо Карденасе:\n\nПопри наші розбіжності, я вірю, що ви можете подивитися на наш прогрес у боротьбі з фашистським режимом Трухільо на Еспаньйолі та побачити, що ми обоє боремося за одну й ту ж революцію —\n\nВін перекреслив останні кілька слів товстою лінією. Спільна боротьба? Боротьба за спільні переконання? Ні — досить семантики. Можливо, деякі речі краще залишити несказаними."
MEX_Puerto_Plata.6.a: "Лопес Матеос відчув, як лист зім’явся в його руках, і повільно розірвав його на дві частини."

MEX_Puerto_Plata.7.t: "Зорепад"
MEX_Puerto_Plata.7.desc: "Луїс дивився крізь прозорий купол у карибську ніч. З вимкненими маяками він міг помітити інші літаки лише за зорями, які вони затуляли. 25 дір у нічному небі, які прямували до авіабази на півдні Куби, якої не було на жодній карті. Єдиним шумом у кабіні був приглушений рев реактивного двигуна. Їм наказали тримати радіо вимкненим протягом усього польоту. Керівництво не хотіло, щоб домініканці дізналися, що ескадрилью переводять на Кубу. Це було не без ризику; стежити за іншими літаками було складно навіть за найкращих умов. Сказати, що це було важче, коли ти не міг поговорити з товаришами по команді, — це не сказати нічого.\n\nУскладнення виникли, коли літаки ввійшли у високу хмару, що простягалася на горизонті в обидва боки. Той невеликий орієнтир, який був у Луїса, раптово зник. Єдиним, що тримало його в повітрі та на маршруті, були сяючі циферблати на панелі приладів. Раптом літак Луїса потрапив у зону турбулентності. Йому вдалося зберегти контроль над літаком і злегка нахилити важіль уперед, щоб спуститися нижче до спокійнішої зони. Подивившись на панель приладів, він побачив, що втратив майже 100 метрів висоти. Він лише дякував долі, що не врізався в один із інших літаків.\n\nХмара була кілька кілометрів завширшки. Щоб пройти її, знадобилася майже година. Коли Луїс вийшов із неї, не було жодного сліду його товаришів. Лише блискучий масив зірок угорі та вогні корабля, що ліниво дрейфував у теплому океані внизу. На щастя, він не занадто збився з курсу, щоб пропустити кубинське узбережжя. Навігація над землею була значно легшою. Вирівнявши вогні міст із картами, наданими йому, залишалося лише направити літак у правильному напрямку.\n\nЩе одна година тиші минула, перш ніж він побачив авіабазу. Скупчення перехресних ґрунтових злітних смуг, освітлених тьмяними лампами, за милю від найближчого села. Він зробив коло, побачив, що злітна смуга вільна, і приземлив літак. Після того, як він під'їхав до узбіччя, до його літака підкотило побите джипи, щоб доставити його до казарм для такого потрібного сну. Сівши на пасажирське сидіння, він запитав у водія, чи хтось іще вже прибув."
MEX_Puerto_Plata.7.a: "Ні, сер, ви перший."
MEX_Puerto_Plata.7_tt: "Орендовані літаки повернуться до нас, навіть якщо Легіон §Rзазнає поразки...§!"

MEX_Puerto_Plata.8.t: "Вихід"
MEX_Puerto_Plata.8.desc: "Президент, у своєму занепокоєнні, не звертав уваги на відсутність місячного сяйва, що проникало до Національного палацу крізь світловий ліхтар, із мерехтливою лампою — єдиним джерелом світла, яке відганяло темряву.\n\nУ будь-який інший день це можна було б виправити. Але це був не звичайний день.\n\nЛінії Карибського Легіону повністю розсипалися. Дисиденти 14 червня в столиці зазнали не меншого розгрому через посилення репресій нового режиму та прориви на фронті, що спричинили масовий втечу до кордону з Гаїті. Інші, відчайдушно прагнучи евакуації морем, заповнили доки та гавані Пуерто-Плата в пошуках втечі, благаючи невинні, непримітні траулери — мексиканські траулери, точніше, — які таємно постачали Легіон від початку кампанії.\n\nЛопес Матеос у своїх думках усвідомив, що країна ще ніколи не була так близька до дипломатичної катастрофи з часів, коли нацисти змусили Камачо піти на поступки після атаки на мексиканські танкери з нафтою — не кажучи вже про стрілянину по рибальських човнах його співвітчизників у 1959 році.\n\nВін поставив би під загрозу життя всіх цих моряків, якщо б наказав їм рушити. Домініканські збройні сили цілком могли б знищити їх у морі...\n\nАле він почав це. Він мав це завершити.\n\nПіднявши телефон, Лопес Матеос зробив пріоритетний дзвінок."
MEX_Puerto_Plata.8.a: ""Скільки зможете на борт, потім забирайтеся звідти, до біса!"" 

MEX_Puerto_Plata.9.t: "Спершу як трагедія..."
MEX_Puerto_Plata.9.desc: "Лопес Матеос сидів, зігнувшись над своїм столом, однією рукою міцно стискаючи президентський телефон, іншою жестом запрошуючи капітана ДФС Фернандо Гутьєрреса Барріоса підійти ближче. Гудки. "Оператор. Ви знаєте, хто це."\n\nГолос Кастро, сонний і роздратований, пролунав на іншому кінці після клацання. "...що це означає, Ваша Високоповажність?" За вікном було зовсім темно, що стало очевидним для президента, коли він обернувся в офісному кріслі; зараз у Гавані вже мав бути світанок. Гутьєррес Барріос, який тепер сидів поруч із Лопесом Матеосом, напружено слухав кожне слово.\n\n"Ми більше не можемо розраховувати на підтримку Ніксона, Фіделе. Він нас підставив. Він на боці цього фашистського поплічника," — Лопес Матеос майже виплюнув ім’я. "Балагер." Кастро вибухнув криком, нерозбірливим через лінію. Лопес Матеос вдихнув, піднявся; все ще борючись із телефонним шнуром. "Останній раз, коли нас так зраджували, було, коли вони задушили демократію та вбили Мадеро, щоб посадити того виродка Уерту ще в 1913 році! А потім над Алеутами Ніксон обманув міністра Ордаса! Це не поодинокі випадки, Фіделе, це були навмисні злочини — все заради їхніх інтересів."\n\n"Потрібен план дій, Ваша Високоповажність. Що робитиме Мексика?"\n\nЛопес Матеос засміявся, але його сміх швидко згас у розпал гніву, коли він жестикулював і вказував із запалом. "Ми продовжимо за планом. Легіон отримає нашу повну підтримку: зброю, розвідку, боєприпаси. А щодо грінго?" Він стиснув кулаки. "Ваші люди, мої люди, ДГІ — ми знайдемо кожного з них, хто ще залишився на Еспаньйолі, і ми зіштовхнемо їх у чортове море.""
MEX_Puerto_Plata.9.a: "...потім як фарс."

MEX_Puerto_Plata.10.t: "Справедлива Нагорода"
MEX_Puerto_Plata.10.desc: ""Я повинен сказати, що сьогодні відчув пульс революції, Адольфо,\" — Фідель Кастро розслаблено вмостився в розкішному кріслі в кварталі Лос-Пінос, що призначений для найвищих іноземних делегацій. Після офіційної, але приємної вечері президенти Кастро та Матеос приєдналися до капітана ДФС та особистого друга Гутьєрреса Барріоса на більш приватну зустріч для десерту. Однак Кастро не міг запропонувати солодощів, тільки вишуканий тютюн та каву. Натомість привезли дещо з домініканського торта з недавнього святкування Карибського Легіону.\n\n\"Я теж це відчуваю. Серце наших трьох націй тепер б’ється в унісон," — Матеос обережно відпив каву, дозволяючи її гіркоти з'єднатися з залишковою солодкістю італійської меренги з торта. \"Поразка режиму — це велика можливість для розширення нашого впливу в Карибському басейні. Сподіваюся, цей революційний дух розповсюдиться.\"\n\n\"Там було електрично. Ваші люди точно знають, як показати свою вдячність.\" Кастро згадав нещодавно проведену ним параду. Він та кубинська частина Карибського Легіону приїхали до Мехіко святкувати визволення Домініканської Республіки. \"Люди побачать солодку можливість, яка впаде їм прямо в руки. Все завдяки нашій великій роботі, Адольфо. І, звісно, я поважаю твої внески, капітане.\"\n\nГутьєррес ввічливо кивнув кубинському президенту перед тим, як заговорити. \"Я радий, що ти такий оптимістичний, але ми ще не зовсім закінчили з островом. Мої джерела вказують на те, що радикали Легіону, ймовірно, організовують марксистський переворот.\"\n\n\"Нехай намагаються, як хочуть. Пульс революції б’ється з нами.\" Усмішка пробилася крізь зуби кубинця, а титульна сигара, що лежала між ними, погойдувалася. \"А тепер, Гутьєррес, розслабся, насолоджуйся святкуваннями та візьми десерт. Твоя робота як шефа розвідки ще буде на місці вранці.\""
MEX_Puerto_Plata.10.a: "Найкраще не загладжувати реалії перемоги."

MEX_Puerto_Plata.11.t: "Смак Поразки"
MEX_Puerto_Plata.11.desc: "На мить, солодкий. Потім президент Лопес Матеос отримав удар по роті.\n\nПоки смак його другого ковтка текіли не вивітрився, він уже почав наливати третій, коли новини про катастрофічну поразку Карибського Легіону досягли Лос-Пінос. Це був би його п’ятий, якби він не витратив двадцять хвилин, сварячи Ордаса, перш ніж відправити його закрити тренувальні табори Легіону та приховати будь-які сліди мексиканської участі. Убийці Трухільо скоро прийдуть за ним, і він не хотів би ховатися від іноземних журналістів.\n\nСтук у двері. Голос Саліна з іншого боку: \"Пробачте, Ваша Екселенціє, але я хочу поділитися чимось, що може бути корисним у цей важкий час.\" Коротке бурчання було достатньо, щоб прийняти секретаря, який увійшов з пляшкою доброго саке. Президент і південець зустрілися поглядами... і засміялися.\n\nНезабаром ця пара ледь стояла на ногах, на столі президента лежав маленький ліс із чарок. Можливо, в третій раз Салінас поділився своєю теорією того, що пішло не так, \"Ти бачиш, Адольфо, це типове янкі-авантюризм. Вашингтон хоче домінувати в їхньому оточенні, вони не могли ризикувати з сильним чи незалежним Легіоном. Вони затягли нас у їхній недопрацьований план і потім скинули удар.\"\n\nМаленький голос у голові Лопеса Матеоса крикнув, що він і Кастро самі вирішили підтримати повалення Трухільо. Вони відкинули життя безлічі молодих людей, готових боротися за свободу. Вони перекручували та ламають доктрину Естради заради марної справи.\n\nВипивка прямо з пляшки заглушила цей голос. Його власний голос прокричав: \"Чорт візьми, Рауль. Чорт візьми.\"\n"
MEX_Puerto_Plata.11.a: "Дехто п’є, щоб забути."

MEX_Puerto_Plata.12.t: "Крик Мехіко"
MEX_Puerto_Plata.12.desc: "Густаво Діас Ордас гордився тим, що зміг зберігати серйозний вигляд в будь-яких ситуаціях. Фернандо Гутьєррес Барріос навчився тримати свої карти близько до грудей, приховуючи справжні почуття. Але короткий погляд між ними був взаємно зрозумілим - вони обидва не знали, чому вони тут. Все, що вони знали, це що Лопес Матеос викликав їх до свого кабінету в Палаці Націонал без затримок.\n\nПісля кількох хвилин мовчання Лопес Матеос витягнув книгу з під купи паперів. Підручник — для учнів середньої школи. На обкладинці були малюнки Сапати, Вільї та Обрегона. \"Це,\" — почав Лопес Матеос, \"перший стандартизований підручник з Мексиканської революції. Завдяки нашим зусиллям кожна дитина в Мексиці отримає його безкоштовно на уроках історії. Вони будуть чути ті ж самі історії, бачити тих самих героїв і розуміти правду про революцію. І вони будуть розуміти нашу потребу боротися з невіглаством і бідністю сьогодні, як ці люди боролися з Діасом та Уертою тоді. Але є проблема.\" Ордас і Барріос витріщилися з нерозумінням.\n\n\"Ми тільки що написали ще одну книгу про революцію, але ми не можемо її опублікувати.\" Усмішка з'явилася на його обличчі. \"Ми знищили ще одну диктатуру, не вдома, а за кордоном. Ми виступили і поклали край Трухільо. Ми показали світу, що Мексиканська революція не є мексиканською; кожен чоловік у Латинській Америці може йти тим шляхом, яким ми йшли, і покласти край загальним зламам та нехтуванню. Не помиліться; це один з найбільших моментів у історії Мексики — але якщо хоча б частина цієї історії стане відомою, нас розіпнуть за це.\n\n\"Я не можу кричати це з того балкону там, як Грітто, ми не можемо святкувати це як націоналізацію нафти, ми не можемо дати цю нову книгу в руки кожній мексиканській дитині. Але я можу вам сказати точно, як я почуваюся зараз, якщо не можу сказати це світу чи самій Мексиці. І з часом наша нація дізнається, що ми досягли в Домініканській Республіці.\""
MEX_Puerto_Plata.12.a: ""Тепер, хочемо рому чи текіли?""

MEX_Puerto_Plata.13.t: "Без трофею за участь"
MEX_Puerto_Plata.13.desc: ""Це була потужна промова, але тільки якби слова могли вбивати," — сказав Фідель Кастро, міцно тримаючи склянку віскі на льоду. Лопес Матеос походжав по високому балкону, що оглядав Гавану, навіть пастельні будівлі, що обрамляли широкі вулиці міста, не могли відволікти його від обурення.\n\n\"Коли ти такий потужний, як ми, вони повинні були б це розуміти." Матеос скрутив аркуш паперу, на якому були написані його особисті нотатки і доповнення до промови, його письменники так і не зрозуміли його пристрасті. Він прилетів до кубинської столиці, намагаючись врятувати хоч трохи міжнародної гідності після того, як його двічі обдурили: спочатку Ніксон змінив сторону на користь Балагера, а потім сам Легіон підписав цей фарс — Угоду з Санто-Домінго. Йому довелося вийти на сцену з Кастро і публічно критикувати людей, яких він тільки що підтримував. Він і Кастро провели ранок, виголошуючи спільну заяву, що ця угода — зрада домініканських прагнень до свободи та незалежності, як їх бачив Дуарт.\n\n\"Де ж усе пішло не так? Все було на своїх місцях.\"\n\n\"Ці покидьки не знають, що їм добре.\" Під кольоровим навісом Кастро прикривав свою спільну злість холодними словами. \"Вони повинні були б краще знати, ніж зв’язуватися з янкі, чи обіймати фашистів.\"\n\n\"Я ніколи не мав довіряти цьому підступному шахраю Ніксону після події з Алеутськими островами.\" Матеос вступив до тіні і взяв склянку з холодною водою, конденсат змочив його руки, коли він запив жадібно прохолодну рідину. \"І ні тим більше з цією групою найманців і негідників, яких називають Карибським Легіоном.\"\n\n\"Ігноруйте тих, хто вас підвів.\" Кастро посмикався від значення цих широких осудних слів Матеоса. Замість відповіді Кастро простягнув руку обуреному президентові. \"Ви маєте моє слово. Мексика і Куба завжди будуть разом.\"\n"
MEX_Puerto_Plata.13.a: ""Так, хороших друзів важко знайти.""

MEX_Puerto_Plata.14.t: "Обіймати Перемогу"
MEX_Puerto_Plata.14.desc: "Домініканське місто Пуерто-Плата було електричне від святкової енергії — від простих людей до найвищих політиків. На одному з багатьох красивих пляжів, що оточують місто, Лопес Матеос стоїть з генералом Пуопо Романом та Фіделем Кастро, спостерігаючи, як кораблі Легіонерів, що повертаються до Куби, відпливають з гавані. Як в одному з американських вестернів, переможний Легіон їде на захід сонця. Глибокі червоні і жовті кольори розливалися по блакитному океану, як феєрверки, що каскадно падають по небу. Всі узбережжя Домінікани святкують з радістю. Вони п’ють на вулицях. Дехто піднімається на колишню тюрму трахілістів, що височіє над морем, Форталесу Сан-Феліпе. Багато хто йде на сам пляж.\n\nМатеос поглядає на пісок, море і людей з заздрощами. Глибоко в душі він хотів би зірвати свій костюм і приєднатися до них. Розплескати воду і грати так, як це відповідає радості дня. Натомість він дозволяє їхньому святкуванню наповнити його серце. Він ніколи не думав, що стане на землю Домініканської Республіки, а тим більше на землю, звільнену від тиранії Трухільо. Матеос обертається до Романа з сльозою на оці. \"Дякую, Генерале, за запрошення бути тут в цей історичний момент. Я буду берегти цей спогад.\" \n\n\"Ви надто добрі. Ви заслуговуєте бути тут.\" Роман міцно схопив руку президента Мексики в рукостискання. \"Дякую. Республіка не була б звільнена, я не ходив би вільно по цьому пляжу без допомоги Мексики.\" Матеос потягнув Романа до обіймів. Вони обійнялися тепло, як можуть це робити два політики. У віддалі спалахували фотокамери, щоб зафіксувати дружбу націй і свободу бути щасливим.\n\n\"А тепер, Ваша Екселенціє,\" — продовжив Роман. \"Я вірю, що для нас вже приготували чудову вечерю.\"\n\n\"Це звучить непогано.\" Матеос подивився на калейдоскопічний горизонт. \"Але дайте мені десять хвилин. Я хочу подивитися на захід сонця.\"\n"
MEX_Puerto_Plata.14.a: "Незабаром для Домініканської Республіки настане новий день."

# News Events
hispaniola_news.1.t: "[Get_newspaper_header] Від invasion Пуерто-Плати"
hispaniola_news.1.desc: "Колапс Тріумвірату порушив багато політичних позицій Європи, а післяшоки все ще відчуваються, тепер вони перетинають океан. Домініканська Республіка під керівництвом Рафаеля Трухільо давно виступала як ворота до Америки для колишніх європейських країн Остром, забезпечуючи торгові угоди та уникаючи спроби вбивства, організовані Сполученими Штатами.\n\nСхоже, удача Трухільо сьогодні вичерпалася. Карибський Легіон, армія антифашистських добровольців, очолювана іспанським республіканцем Альберто Баяо, висадилася в Пуерто-Платі, маючи намір скинути Генераліссимуса. Водночас американські та кубинські військово-повітряні сили співпрацюють у бомбардуваннях ключових домініканських позицій на півночі. Коли повідомлення про повстання та бунти почали надходити зсередини Домініканської Республіки, стало очевидно, що боротьба за її майбутнє тільки почалася."
hispaniola_news.1.a: "Час покінчити з Трухільо раз і назавжди."
hispaniola_news.1.b: "Покажемо цим американським маріонеткам, хто насправді керує!"
hispaniola_news.1.c: "Карибський архіпелаг ламається."

hispaniola_news.2.t: "[Get_newspaper_header] Колапс домініканського режиму"
hispaniola_news.2.desc: "Сьогодні були підтверджені як очікування міжнародних аналітиків, так і заяви домініканських повстанців, оскільки Хоакін Балагер втік з острова до вигнання в Іберію. Прихильники Балагера дали запекліший бій, ніж очікувалося, і змогли триматися довше, ніж прогнозували. Проте врешті-решт стало зрозуміло, що ситуація режиму була нездійсненною, оскільки домініканські повстанці продовжували наближатися до Санто-Домінго.\n\nУ схожій сцені з перемогою Кубинської революції, переможне повстанське керівництво ввійшло в Санто-Домінго, спільно обійнявшись, в той час як групи вільних мисливців збирали колишніх співпрацівників і розграбовували їхні маєтки."
hispaniola_news.2.a: "Карибам не місце для фашизму."
hispaniola_news.2.b: "Можливо, настав час визнати, що Імперія дійсно мертва."
hispaniola_news.2.c: "Американська дегенерація продовжує поширюватися."
hispaniola_news.2.d: "Революційний запал продовжує розповсюджуватись у Карибах."

hispaniola_news.3.t: "[Get_newspaper_header] Трухільо переміг Карибський Легіон"
hispaniola_news.3.desc: "Коли Карибський Легіон висадився в Пуерто-Платі, більшість прогнозували, що режим Трухільо впаде за кілька тижнів, якщо не днів. Тепер тіла накопичуються по всій країні, але це тіла тих, хто став ворогами диктатора, а не його вірних прихильників. Оскільки останні вигнанці здаються або тікають, найбільша загроза для Трухільо була відвернена.\n\nНеудачний напад на острів залишив Карибський Легіон майже зруйнованим, більшість тих, хто залишився, тихо перетинають кордон з Гаїті, майже як бічний епізод. Ця невдача принизила як Сполучені Штати, так і Кубу, не тільки закріпивши присутність ворожої фашистської сили в Карибах, але й тепер змушені підкорятися її волі задля полонених, що потрапили до в'язниць Трухільо."
hispaniola_news.3.a: "Чорт! Покладіть провину на німців!"
hispaniola_news.3.b: "Іберійська єдність може перемогти будь-якого ворога!"
hispaniola_news.3.c: "Боже на небесах; Трухільо в Санто-Домінго."

hispaniola_news.4.t: "[Get_newspaper_header] Фульхенсіо Батіста страчений"
hispaniola_news.4.desc: "Останній розділ кубинської історії завершився разом із чоловіком, для якого опозиція стала іскрою, що розпочала все. Колишній кубинський президент Фульхенсіо Батіста чотири роки тому втік до Домініканської Республіки, коли ситуація на батьківщині змінилася, але коли ситуація в Санто-Домінго погіршилася, він намагався втекти зі своєю родиною та багатством до Іберії. Однак це не вдалося, коли його транспортний засіб був зупинений групою бунтівників.\n\nЩо сталося далі, так це масове святкування по всій Кубі, оскільки Батісту швидко доставили на острів. Він був парадований та публічно принижений на вулицях Гавани, після чого Батіста був підданий публічному суду, де його звинуватили в низці злочинів, зокрема в корупції, державній зраді, сотнях вбивств та зраді батьківщини. Його смертний вирок не став сюрпризом, рішення було підтверджене телеекзекуцією колишнього диктатора."
hispaniola_news.4.a: "Ти не будеш відсутній."
hispaniola_news.4.b: "Тепер вони просто натирають сіль на рану..."
hispaniola_news.4.c: "Ненависна людина зустрічає свою кінцівку."

hispaniola_news.5.t: "[Get_newspaper_header] Комуністичний путч в Домініканській Республіці"
hispaniola_news.5.desc: "Після перемоги Карибського Легіону над Трухільо, напруга всередині Легіону зросла і швидко переросла в кризу.\n\nЗ підтримкою командира Альберто Баяо, соціалістичні елементи в Легіоні почали другий революційний заколот проти діючого домініканського уряду. Ключові установи та будівлі в Санто-Домінго вже були захоплені, а гарнізони по всьому острову здалися або приєдналися до революції.\n\nМахімо Антоніо Лопес був урочисто обраний Президентом і вже пообіцяв, що це буде початок робітничої революції по всьому континенту, поки їхні сусіди з настороженістю спостерігають за новою соціалістичною державою."
hispaniola_news.5.a: "Це навряд чи може тривати довго?"

hispaniola_news.6.t: "[Get_newspaper_header] Хвиля арештів у Домініканській Республіці"
hispaniola_news.6.desc: "Після перемоги Карибського Легіону над Трухільо, напруга всередині Легіону зросла і швидко переросла в кризу.\n\nЗ підтримкою командира Альберто Баяо, соціалістичні елементи в Легіоні почали другий революційний заколот проти діючого домініканського уряду. Однак ця спроба здається не вдалою, оскільки міліції та повстанці відбили спробу соціалістичного перевороту.\n\nБаяо був заарештований, і почалась чистка в Легіоні, коли останніх революціонерів придушили. Очікується, що масштаби чистки будуть розширюватися, і Легіон та домініканські міліції незабаром позбудуться своїх соціалістичних бойовиків."
hispaniola_news.6.a: "Сподіваємось, що ситуація стабілізується."

hispaniola_news.7.t: "[Get_newspaper_header] Домініканський переворот, Трухільо скинуто"
hispaniola_news.7.desc: "Вчора ввечері Рафаель Леонідас Трухільо, Генераліссимус Домініканської Республіки, був застрелений кількома гвинтівочниками на шляху до його приватної резиденції. Міністр армії Домініканської Республіки, Хосе Рене 'Пупо' Роман Фернандес, вважається причетним до вбивства, а потім наказав арештувати членів родини Трухільо та Джонні Аббеса, голову домініканської розвідки. Попередні повідомлення з столиці свідчать про те, що військові перемогли збройний опір і користуються широкою підтримкою населення.\n\nРоман оголосив перемир'я з Карибським Легіоном, що займає кілька північних міст. Оскільки обидві сторони вступають в переговори, що проходять за посередництва Мексики та США, латиноамериканські держави висловлюють надію, що Кискейя залишить позаду кроваву спадщину Трухільо."
hispaniola_news.7.a: "Сic semper tyrannis."
hispaniola_news.7.b: "Вашингтонські маріонетки займають своє місце на сцені."
hispaniola_news.7.c: "Козел і його послідовники забиті сьогодні."
hispaniola_news.7.d: "¡Viva la Revolución! ¡Viva!"
hispaniola_news.7.e: "Навіть коли ми сумуємо за каудільйо, ми повинні готувати наступні кроки."

hispaniola_news.8.t: "[Get_newspaper_header] Домініканська культурна революція"
hispaniola_news.8.desc: "З моменту приходу до влади комуністичний уряд Махімо Антоніо Лопеса закріпив свою позицію, і внутрішні суперечності та боротьба досягли критичної точки.\n\nЗаявивши, що «буржуазні елементи в уряді та суспільстві» призвели до корупції і застою, Лопес обіцяв радикальні заходи, щоб назавжди викорінити спадщину Трухільо, фашизм і лібералізм, перетворивши країну на соціалістичну державу, спрямовану марксистсько-ленінськими-амазонськими принципами.\n\nДомініканські Червоні гвардії вже почали проводити насильницькі чистки та репресії, насилля поширюється по всій Домініканській Республіці, оскільки настає нова фаза революції."
hispaniola_news.8.a: "Народження ще одного тирана?"

hispaniola_news.9.t: "[Get_newspaper_header] Рафаель Боннеллі обраний Президентом Домініканської Республіки"
hispaniola_news.9.desc: "На подив деяких спостерігачів, Рафаель Боннеллі офіційно був обраний Президентом Домініканської Республіки.\n\nХоча його переслідувало минуле співробітництво з режимом Трухільо, він тим не менше був однією з провідних фігур у повстанні і відомий як лібералізатор ще за часів правління Трухільо. Його платформа, що складається з поєднання ринкових і політично ліберальних ідей, а також збереження деяких політик епохи Трухільо, здається, здобула підтримку серед населення.\n\nТепер Президент Боннеллі заявив про свій намір відкрити Домініканську Республіку для світу, при цьому обіцяючи зберегти політичну і соціальну ідентичність нації."
hispaniola_news.9.a: "Нова глава для Республіки."

hispaniola_news.10.t: "[Get_newspaper_header] Хуан Бош обраний Президентом Домініканської Республіки"
hispaniola_news.10.desc: "Хуан Бош давно був опонентом Трухільо і був змушений піти в екзиль задовго до повстання. Він був фаворитом на пост президента — і здобув перемогу.\n\nВідповідальний за об'єднання лівих соціальних націоналістів та революціонерів, він вийшов на політичну сцену з сильною базою, яка тільки зросла під час кампанії. Обіцяючи зруйнувати всі залишкові політики та інститути Трухільо та перебудувати політичні, економічні та соціальні структури в дусі соціальної справедливості, він входить в офіс з незаперечним мандатом.\n\nТепер на посаді, він вже почав впроваджувати політики, натхнені Кубою, а також розширювати синдикальні, трудові та політичні права для всіх громадян."
hispaniola_news.10.a: "Наслідки Трухільо нарешті стерті."
hispaniola_news.10.tt: "Бош, справжній §OРеволюціонер§!, інтегрує Домініканську Республіку в §KВерaкрус§! §VПакт§!."

hispaniola_news.11.t: "[Get_newspaper_header] Гаїтянський блиц"
hispaniola_news.11.desc: "Рано вранці, після кількох місяців військової підготовки на домінікансько-гаїтянському кордоні, домініканські війська почали наступ на Гаїті. Починаючи з спільного авіаційного та артилерійського обстрілу, а потім з прориву бронетанкових формувань, мета операції, здається, полягає в захопленні Порт-о-Пренсу ударом блискавки. Офіційно мета полягає в тому, щоб відреагувати на і нейтралізувати гаїтянське комуністичне партизанське вторгнення в Домініканську Республіку.\n\nОднак більшість геополітичних аналітиків вважає, що це лише прикриття для стратегічного кроку режиму Трухільо з метою анексії Гаїті та забезпечення цього вразливого флангу, поки можливість залишається через припинений статус Гаїті в Організації Вільних Націй. Ситуація виглядає похмуро, оскільки домініканські підрозділи просуваються фактично без опору, і багато хто побоюється, які наслідки принесе майбутнє домініканське правління для гаїтян."
hispaniola_news.11.a: "Швидко! Ми повинні підготуватися до зупинки цього!"
hispaniola_news.11.b: "Вони повинні були зрозуміти, що не варто було нас чіпати."
hispaniola_news.11.c: "Як відреагують Сполучені Штати?"

hispaniola_news.12.t: "[Get_newspaper_header] Гаїтянська революція"
hispaniola_news.12.desc: "У приголомшливому повороті подій, сили Парті Попюлер де Ліберейшн Національ здобули перемогу та скинули гаїтянський уряд після тривалої, затяжної партизанської боротьби, в результаті якої вони організували повстання та захопили Порт-о-Пренс, столицю. Після років боротьби з корупцією та некомпетентністю, новий уряд орієнтується на консолідацію влади та відновлення країни.\n\nЗалишаються занепокоєння щодо стабільності нового уряду, деякі спостерігачі побоюються, що новий уряд, з історією насильницького екстремізму ППЛН, може почати здійснювати великомасштабні злочини, що виникають через революційну запальність.\n\nУ той час як світ спостерігає з нетерпінням, як Гаїті рухається вперед під новим комуністичним керівництвом, деякі задаються питанням, які наслідки це матиме для Карибського басейну та Сполучених Штатів, причому останні очевидно є програвшими в цій ситуації."
hispaniola_news.12.a: "Перша доміно?"
hispaniola_news.12.b: "Хіспанйола червона, чи весь Карибський басейн буде наступним?"

hispaniola_news.13.t: "[Get_newspaper_header] Балаґер переміг у Громадянській війні в Домініканській Республіці"
hispaniola_news.13.desc: "Хоакін Балаґер, тимчасовий Президент Домініканської Республіки, оголосив про перемогу в короткочасній громадянській війні країни проти Домініканського Революційного Фронту та Карибської Легії. Оскільки залишки бойовиків втекли через кордон до Гаїті або здалися, Балаґер розпочав процес реконструкції та "де-Трухільоізації" країни. Очікується, що режим Балаґера продовжить тенденцію повільної лібералізації, відкриваючи Домініканську Республіку для зовнішнього світу.\n\nХоча перед Домініканською Республікою стоїть довгий шлях відновлення, багато хто з цікавістю спостерігає, як уряд Балаґера буде навігувати у своїх відносинах як з Сполученими Штатами, так і з Іберійським Союзом. Майбутнє країни висить на волосині, оскільки вона намагається відновити свою спадщину та примирити своє минуле з майбутнім."
hispaniola_news.13.a: "Тост за нового Президента!" # pro-balaguer
hispaniola_news.13.b: "Принаймні він не Трухільо..." # anti-balaguer
hispaniola_news.13.c: "Чим більше змінюється, тим більше залишаються ті ж самі речі." # generic

hispaniola_news.15.t: "[Get_newspaper_header] Громадянська війна в Домініканській Республіці"
hispaniola_news.15.desc: "Перемир'я, яке було укладено Президентом Домініканської Республіки Хоакіном Балаґером після вбивства Рафаеля Трухільо, сьогодні закінчилося без продовження. Внаслідок цього країна потрапила у повномасштабну громадянську війну між Конституційним про-Балаґерівським табором, який базується в Санто-Домінго, та Домініканським Революційним Фронтом на чолі з Ораціо Орнесом, який базується в Сантьяго-де-лос-Кабальєрос.\n\nПопри зусилля знайти дипломатичне вирішення, напруга в країні продовжувала зростати протягом останніх кількох місяців, що зробило ескалацію до громадянської війни неминучою, що призвело сьогодні вранці до авіаційного бомбардування Сантьяго домініканською авіацією. Рішення прийнято, і єдине вирішення конфлікту — це повна і кровопролитна перемога однієї зі сторін."
hispaniola_news.15.a: "Час покінчити з цими комуністами раз і назавжди." # pro-balaguer
hispaniola_news.15.b: "¡Не пройдуть!" # anti-balaguer
hispaniola_news.15.c: "Кіскея вимагає крові." # generic
hispaniola_news.15.d: "Нехай Карибське море горить..." # Germany

hispaniola_news.16.t: "[Get_newspaper_header] Сантодомінгський договір"
hispaniola_news.16.desc: "В історичному повороті подій, представники обох сторін конфлікту в Домініканській Республіці, разом з дипломатичними представниками Сполучених Штатів та Іберії, підписали офіційну мирну угоду для країни. Ця угода є важливим кроком у зовнішній політиці між Сполученими Штатами та Іберією, що веде до детант і можливості співпраці. Хоча це сталося раптово, угода була широко сприйнята домініканською громадськістю, оскільки країна вже місяцями перебувала в стані невизначеності.\n\nОднак не всі задоволені. Куба та Мексика висловили дипломатичні заперечення, засуджуючи цей крок як зраду домініканських революціонерів через міжнародний шантаж, звинувачуючи сторони переговорів у тиску на революціонерів, щоб змусити їх поступитися своїми позиціями. Попри це, зберігається оптимізм, що ця угода прокладе шлях до кращого майбутнього для домініканського народу."
hispaniola_news.16.a: "Здоровий глузд сьогодні переміг." # pro-balaguer
hispaniola_news.16.b: "Грінго нас зрадили..." # anti-balaguer
hispaniola_news.16.c: "Це зовсім несподіваний поворот подій." # generic

hispaniola_news.17.t: "[Get_newspaper_header] Трухільо вбитий!"
hispaniola_news.17.desc: "Рафаель Леонідес Трухільо був вбитий, його застрелили група невідомих офіцерів, що призвело до політичної турбуленції в Домініканській Республіці. Хоча країна сумує через втрату свого багаторічного лідера, Служба військової розвідки проводить жорстоку хвилю репресій проти підозрюваних змовників. Рамфіс Трухільо, який зайняв місце свого батька, намагається утримати контроль над країною.\n\nРамфіс стикається з проблемами як усередині, так і поза військом. Його контроль над владою слабкий, і залишається питанням, чи зможе він утримати країну стабільною та запобігти її падінню в хаос."
hispaniola_news.17.a: "Він це заслужив."

hispaniola_news.18.t: "[Get_newspaper_header] Гаїті перемогло на Гиспаньйолі"
hispaniola_news.18.desc: "Вдруге цього століття американські морські піхотинці знову пройшли вулицями Санто-Домінго. Оскільки просування домініканської армії загальмувалося через сильнішу, ніж очікувалося, опір з боку гаїтянського народу та його збройних сил, режим Трухільо став жертвою меча Дамокла. За запитом уряду Гаїті в Порт-о-Пренсі, збройні сили США втрутилися.\n\nСьогодні режим Трухільо більше не існує, на його місці, під наглядом американських військ і спостерігачів з Організації американських держав, знаходиться Перехідна рада, яка повинна вести Домініканську Республіку до нового та більш демократичного майбутнього."
hispaniola_news.18.a: "Кого ми відправляємо? Ми відправляємо морських піхотинців!"
hispaniola_news.18.b: "Сподіваюсь, що виберуть когось, хто нам подобається..."
hispaniola_news.18.c: "Дядько Сем відновлює порядок у своєму дворі."

hispaniola_news.19.t: "[Get_newspaper_header] Домініканська Республіка збиває американські літаки"
hispaniola_news.19.desc: "Важливі новини надходять із Вашингтона: Білий дім підтвердив, що Домініканська Республіка змогла знищити щонайменше два американські літаки F-105 Thunderchief, обидва пілоти були взяті в полон. Тим часом Домініканська Республіка випустила відео, на якому видно явні ознаки тортур і фізичного насильства над полоненими, супроводжуване маскованими офіцерами, які погрожують Америці відступити.\n\nВважається, що збройні сили Домініканської Республіки змогли досягти цього завдяки елементу несподіванки та німецьким постачанням експериментального обладнання MANPADS, що дозволило їм успішно засідати ворожі літаки. Очікується, що ВПС США значно зменшать свої операції перед цією загрозою."
hispaniola_news.19.a: "Чорт забирай!"
hispaniola_news.19.b: "Ось тобі, янкі!"
hispaniola_news.19.c: "Прикро."

hispaniola_news.20.t: "[Get_newspaper_header] Хоакін Балаґер обраний Президентом Домініканської Республіки" # TODO
hispaniola_news.20.desc: "Звісно, він це зробив, вибори були сфальшовані."
hispaniola_news.20.a: ""

hispaniola_news.21.t: "[Get_newspaper_header] Кап-Гаїтєнська прокламація"
hispaniola_news.21.desc: "Стрілянина лунає вулицями Гаїті. Зі своїх опорних пунктів у глибинці країни, Народна партія національного визволення закликала до національної партизанської боротьби проти підтримуваного Америкою уряду Гаїті.\n\nОстанній етап в нещасній історії Гаїті відкинув роки зусиль урядів Лескота і Дежуа в боротьбі з комуністичною опозицією. Партизанські удари та дрібні повстання почалися по всій країні, оскільки гаїтянські збройні сили мобілізуються.\n\nПо всьому Карибському регіону Сполучені Штати пильно стежать за ситуацією, аби баланс в регіоні не змістився проти їх інтересів."
hispaniola_news.21.a: "Виклик Pax Americana?"
hispaniola_news.21.b: "Ця ситуація стає все більш набридливою."

hispaniola_news.22.t: "[Get_newspaper_header] Лавод скидає уряд Гаїті"
hispaniola_news.22.desc: "Зі збільшенням загрози вторгнення Домініканської Республіки та зростаючими загрозами Трухільо щодо Порт-о-Пренса, підтверджено, що президент Гаїті Дежуа був усунений від влади за підтримки урядових і військових чиновників.\n\nПереворот очолив міністр Франк Лавод, який вже зробив заяви на користь Сполучених Штатів, обіцяючи зміцнити демократію та гаїтянські інститути після завершення надзвичайного стану.\n\nХоча реакція Сполучених Штатів була стриманою, Вашингтон здається невпевненим щодо щирості Лавода, але до стабільності на Гиспаньйолі навряд чи буде широко засуджено переворот, незважаючи на негайну призупинку країни з боку ОФН."
hispaniola_news.22.a: "Спаситель чи ще один диктатор?"

hispaniola_news.23.t: "[Get_newspaper_header] Формування Санто-Домінго"
hispaniola_news.23.desc: "Оточений домініканськими солдатами в окупованому Порт-о-Пренсі, тепер переіменованому в «Пуерто-Рамфіс», Рафаель Трухільо оголосив про перемогу Домініканської Республіки над Гаїті і негайно наказав про анексію Гаїті до складу Домініканської держави.\n\nПісля подорожі по ново завойованій країні та авторизації заходів, що призвели до переіменування або знищення багатьох гаїтянських громад, Трухільо офіційно оголосив, що тепер об’єднаний острів Гиспаньйола буде відомий як країна Санто-Домінго.\n\nПовідомлення про жорстокість щодо завойованого гаїтянського населення широко поширені, а країни регіону стикаються з хвилями гаїтян, які тікають від геноциду, що багато хто боїться лише погіршиться через мегаломанію Трухільо."
hispaniola_news.23.a: "Світло згасає на Гиспаньйолі."

hispaniola_news.24.t: "[Get_newspaper_header] Перемир'я на Гиспаньйолі" # на користь Трухільо
hispaniola_news.24.desc: "Наразі мир панує на Гиспаньйолі. Просування домініканської армії загальмувалося через сильніший, ніж очікувалося, опір з боку гаїтянського народу та його збройних сил, а перспектива американського втручання змусила режим Трухільо звернутися до західного сусіда за умовами миру. Сьогодні представники з Порт-о-Пренса та Санто-Домінго підписали документи, що забезпечують виведення домініканських військ з гаїтянської території, хоча кордон у Хінче залишився без змін після бліцкригу.\n\nУже вдруге за століття Гаїті успішно відстояло своє право проти іноземного завойовника."
hispaniola_news.24.a: "Порядок відновлено у задньому дворі дядька Сема."

hispaniola_news.25.t: "[Get_newspaper_header] Перемир'я на Гиспаньйолі" # на користь Гаїті
hispaniola_news.25.desc: "Наразі мир панує на Гиспаньйолі. Просування домініканської армії загальмувалося через сильніший, ніж очікувалося, опір з боку гаїтянського народу та його збройних сил, а перспектива американського втручання змусила режим Трухільо звернутися до західного сусіда за умовами миру. Сьогодні представники з Порт-о-Пренса та Санто-Домінго підписали документи, що забезпечують виведення домініканських військ з гаїтянської території, хоча кордон у Хінче залишився без змін після бліцкригу.\n\nУже вдруге за століття Гаїті успішно відстояло своє право проти іноземного завойовника."
hispaniola_news.25.a: "Коли хтось робить крок, який нам не подобається..."
hispaniola_news.25.b: "Сподіваюся, хтось, кого ми підтримуємо, буде обраний..."
hispaniola_news.25.c: "Порядок відновлено у задньому дворі дядька Сема."

hispaniola_news.26.t: "[Get_newspaper_header] Рафаель Трухільо помер" # природна смерть
hispaniola_news.26.desc: "Домініканська Республіка перебуває в стані шоку, оскільки новини про смерть Рафаеля Леоніда Трухільо розповсюджуються. Диктатор, який стояв на чолі країни десятки років, помер через старість. Хоча його прихильники в траурі, серед населення відчувається явне очікування, що буде далі.\n\nРамфіс Трухільо взяв на себе пост нового каудільйо, але сумніви залишаються щодо його здатності ефективно керувати. Багато хто ставить питання, чи має він справжнє враження на владу чи він лише маріонетка. Країна тепер на роздоріжжі, і невизначеність панує над її майбутнім."
hispaniola_news.26.a: "Чи приходить кінець епохі Трухільо?"

