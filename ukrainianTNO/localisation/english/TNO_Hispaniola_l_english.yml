# Опис лідера
POLITICS_RAFAEL_TRUJILLO_DESC: "З крахом каудилізму 20-х років, який привів країну до розрухи, Рафаель Трухільйо розпочав нову еру зі своїм переворотом у 1930 році, 'Ера Трухільйо'. Принісши політичну стабільність і економічний добробут, позбувшись впливу американців на республіку та зблизившись із Іберією та Італією, справжніми союзниками держави та її народу, новий режим став широко популярним серед людей, а самого Трухільйо багато хто вважає Благодійником (El Benefactor).\n\nПроте вся ця стабільність і процвітання були побудовані на тілах тих, хто виступав проти тиранічного і жорстокого режиму Трухільйо. Як із середини, тих, хто протистояв диктатору і потрапив у в'язниці, де їх катували до смерті, так і ззовні, гаїтян, яким не пощастило народитися в регіонах, претензії на які висував Трухільйо, які або були вбиті, або змушені втекти зі своїх домівок у страху.\n\nПротягом десятиліть секретна поліція та армія утримували цих ворогів Республіки в узді, однак, із падінням Батісти на Кубі безпека режиму була поставлена під сумнів, оскільки повстання проти нього було підтримане США. Побоюючись, що він буде наступним, Трухільйо безперервно нарощував свої військові та безпекові структури за допомогою Іберії та Італії, перетворивши Домініканську Республіку на фортецю фашизму, підтримуючи при цьому антиамериканські рухи скрізь, де це можливо. Усі знають, що дія проти нього неминуча, залишається лише питання, чи зможе режим вижити."
POLITICS_RAMFIS_TRUJILLO_DESC: "Вирісши сином людини, яка створила сучасну Домініканську державу, Рафаель Леонідас 'Рамфіс' Трухільйо викликав великі очікування у багатьох. Його батько був свідомий цього й надавав йому військові звання та називав мости на його честь у надзвичайно молодому віці. Рамфіс довгий час вважався очевидним спадкоємцем, і багато хто очікував, що він успадкує політичну кмітливість свого батька.\n\nЗвісно, Рамфіс виявився далеко не схожим на свого батька. Він ніколи не виявляв інтересу до політики, або принаймні не такого, як до молодих жінок та автоперегонів. Його нездатність закінчити Військову академію через захоплення екстравагантними романами з кінозірками стала джерелом сорому для режиму. А скандальне розлучення з першою дружиною змусило його на деякий час зникнути з публічного життя, хоча це ніяк не вплинуло на його богемний спосіб життя. Коли домініканці чують його ім'я, вони уявляють його з темноволосою актрисою в розкішному автомобілі, а не поруч із батьком у військовій формі, і сміються.\n\nАле Рамфіс чув цей сміх. І якщо є щось, що він успадкував від свого батька, то це невпевненість у собі. Він знає, що вони помиляються, і що він може бути великим лідером, як його батько. А кожен, хто в цьому сумнівається, буде або переконаний, або знищений."
POLITICS_RAMFIS_TRUJILLO_PUPPET_DESC: "Вирісши сином людини, яка створила сучасну Домініканську державу, Рафаель Леонідас 'Рамфіс' Трухільйо викликав великі очікування. Його батько знав про це і надавав йому звання та привілеї у ранньому віці. Він був довгий час визнаним спадкоємцем, але його інтерес до молодих жінок та розкішних автоперегонів значно переважав політичні амбіції.\n\nКоли настав час взяти владу, Рамфіс отримав пропозицію, від якої не міг відмовитися, від Служби військової розвідки. Він міг мати стільки розкішних автомобілів, кінозірок і вечірок, скільки хотів. Якщо потрібне було усунення супротивника, достатньо було лише назвати ім'я. Але справжня влада належала Джонні Аббесу Гарсії.\n\nАббес, хоч і сам продукт непотизму, завжди був вірним Трухільйо і прагнув лише просувати ідеї покійного правителя. Так Рамфіс міг жити, як завжди хотів, залишаючи тягар влади на плечах Аббеса, його агентів і німецьких кураторів."
POLITICS_JOAQUIN_BALAGUER_DESC: "Якби хтось сказав сім'ї і сусідам Хоакіна Балагера в бідній сільській місцевості Сантьяго-де-лос-Кабальєрос, що він стане президентом Домініканської Республіки після років тихої боротьби й зусиль, ті би лише сміялися. Але саме так все сталося.\n\nАмериканська окупація і риторика друга його батька, лідера пуерториканської визвольної боротьби Педро Альбісу Кампоса, розпалили в юному Балагері любов до інтелектуальних дискусій і політики. Це, у поєднанні з навчанням у написанні есе і праві, зробило його ідеальним кандидатом на посаду прокурора. Балагер був би задоволений працювати там певний час, якби не з'явилася можливість: його кузина одружилася з майбутнім правителем Домініканської Республіки, Рафаелем Леонідасом Трухільйо.\n\nСпочатку все складалося добре. Балагер був найважливішим міністром Трухільйо, його найближчим радником. Він тримав низький профіль і не критикував ексцеси диктатора. Але цей баланс швидко похитнувся, коли сам Трухільйо став загрозою для країни, яку створив. Балагеру не залишалося нічого, окрім як зберегти справу свого друга, організувавши його вбивство.\n\nНемає сумнівів: підйом Балагера знаменує перехід Домініканської Республіки до безпечнішої, поміркованішої моделі. Але ситуація залишається нестабільною, і новий президент знає, що мусить бути обережним; як він часто каже, на кожного вдячного цивільного зараз припадає не менше одного криптокомуніста, який незадоволений. Вони не можуть зруйнувати все, над чим працював Балагер. Це абсолютно недопустимо."
POLITICS_JOAQUIN_BALAGUER_STRUGGLE_DESC: "Якби хтось сказав родині та сусідам Хоакіна Балагера у бідних сільських місцевостях Сантьяго-де-лос-Кабальєрос, що він стане президентом Домініканської Республіки після років тихої боротьби та зусиль, вони б розсміялися йому в обличчя. Але саме так усе сталося.\n\nАмериканська окупація та риторика друга його батька, лідера пуерториканської визвольної боротьби Альбісу Кампоса, розпалили в молодому Балагері любов до інтелектуальних дискусій і політики. Це, у поєднанні з навчанням написанню есе та праву, зробило його ідеальним кандидатом на посаду прокурора. Балагер був би задоволений працювати там певний час, якби не з'явилася можливість: його кузина одружилася з майбутнім правителем Домініканської Республіки Рафаелем Леонідасом Трухільйо.\n\nСпочатку все складалося добре. Балагер був найважливішим міністром Трухільйо, його найближчим радником. Він тримав низький профіль і не критикував ексцеси диктатора. Але цей баланс швидко похитнувся, коли сам Трухільйо став загрозою для країни, яку створив. Балагер терпляче чекав, поки людина, яку він колись називав другом, загине, і лише тоді взяв владу. Його місія: знищити спадщину найгірших зловживань Трухільйо.\n\nДля досягнення цієї мети Балагеру довелося укласти союз із дисидентами та опозиційними силами. Він пообіцяв їм, що поверне демократію на Кіскею. Але тепер усі карти в його руках. Чи виконає він свою обіцянку повністю, чи обмежить свої дії? 'Suum est' — вирішувати йому."
POLITICS_GOBIERNO_RECONSTRUCCION_NACIONAL_DESC: "Це зроблено! Бог на Небесах, а Трухільйо (принаймні) на шість футів під землею; прибічники Тирана тепер разом із ним або у в'язниці. Але змусити революціонерів погодитися вбити Трухільйо було легким завданням. Складніше завдання — визначити майбутнє Домініканської Республіки — лише починається.\n\nТеоретично уряд чітко окреслений. Тимчасовий президент Домініканської Республіки — старий революціонер Орасіо Орнес, який очолює реконструкцію держави після Трухільйо. Усі законодавчі акти та укази підписуються ним за запитом Уряду Національної Реконструкції.\n\nОднак на практиці влада Орнеса не є такою вже й визначеною: Уряд Національної Реконструкції керує консенсусом своїх різноманітних членів. Але домініканські революціонери та їхні союзники з Карибського легіону мають тисячу протилежних світоглядів та ідеологій, і цей 'консенсус' почав руйнуватися з самого моменту, як Трухільйо опинився у безіменній могилі.\n\nГоловним пріоритетом президентства Орнеса є стабілізація політичної ситуації на Кіскеї для проведення мирних виборів. Але чим більше спостерігаєш за цим президентством і його дискусіями, тим менше віри у те, що це буде легке й безперебійне завдання."
POLITICS_OFN_OAS_DOM_DESC: "§YЗВАЖАЮЧИ НА ТЕ§!, що розбещені та мегаломанські амбіції так званого Генералісімуса Рафаеля Леонідаса Трухільйо фактично стали руйнівниками його режиму, джерелом страждань для звичайного народу та причиною нинішньої військової присутності в нашій нації;\n\n§YЗВАЖАЮЧИ НА ТЕ§!, що сили Організації Вільних Націй та Організації Американських Держав були щедро надані на благо народу Домініканської Республіки для забезпечення безпеки й стабільної ситуації в зоні, де вони надають керівництво й підтримку; та\n\n§YЗВАЖАЮЧИ НА ТЕ§!, що домініканському народу потрібне продовження управління та збереження національного правління доти, доки сили OFN та OAS залишатимуться у Домініканській Республіці для підтримки;\n\n§mПОСТАНОВЛЕНО§!, що буде створено Раду Управління Домініканської Республіки;\n\n§mПОСТАНОВЛЕНО§!, що до складу цієї Ради увійдуть чиновники й військові, які, не піддаючись анархізму та не дотримуючись огидних методів Рафаеля Трухільйо, внутрішньо протидіяли попередньому режиму на благо домініканського добробуту; та\n\n§mПОСТАНОВЛЕНО§!, що Рада Управління співпрацюватиме з перехідними органами OFN-OAS доти, доки їхня присутність залишатиметься необхідною у Домініканській Республіці."
POLITICS_JOSE_RENE_ROMAN_DESC: "Пупо Роман був призначений на скромну кар'єру у домініканській армії. Бенефактор, кидаючи виклик жорстокій долі, своєю божественною величчю врятував його від цієї незначності, піднявши його кар'єру до посади Секретаря Збройних Сил, другої особи режиму. Шлюб Пупо з однією з племінниць Трухільйо не був випадковістю. Обдарований привілейованим життям завдяки непотизму Трухільйо — найзавиднішим за часів жорстокої диктатури — навіть він не зміг уникнути постійних знущань Ель Хефе через тривожні випробування на лояльність.\n\nОбраза наростала в його серці з кожним приниженням. Побачити, як його господар веде націю далі у розпусту через співпрацю з німецькими фашистами, стало останньою краплею. Коли до нього звернулися змовники й їхні міжнародні союзники, він охоче прагнув помститися людині, яка тримала його у неволі, але це закляття було повністю зняте лише тоді, коли він побачив бездиханне тіло Козла. Очоливши своїх людей у боротьбі проти жорстокої таємної поліції SIM, він відновив порядок як голова спільного цивільно-військового уряду. Поки залишки старого режиму — люди, яких він колись називав товаришами, — систематично знищуються, ведуться переговори з Карибським легіоном для відновлення миру й єдності у Домініканській Республіці після тридцятирічної перерви."

# Ideas
DOM_Dios_Trujillo: "Бог та Трухільйо"  
DOM_Dios_Trujillo_desc: "Популярність Рафаеля Леонідаса Трухільйо Моліни неможливо переоцінити. Для тих, хто достатньо дорослий, щоб пам’ятати злидні та хаос 1920-х років, він є рятівником нації. Для молодшого покоління він є захисником домініканців від американського імперіалізму та гайтянського варварства. Хоча є чимало тих, хто бачить у ньому не більше, ніж грубого тирана, девіз 'Бог і Трухільйо' розповсюджений по всій країні, часто поруч із його портретом. Для багатьох домініканців Бог і Трухільйо – це одне й те саме."
DOM_Dios_Trujillo_Ramfis: "Бог та Трухільйо"  
DOM_Dios_Trujillo_Ramfis_desc: "Сумнозвісність Рафаеля 'Рамфіса' Трухільйо неможливо переоцінити. Гедоніст і дилетант; Домініканська Республіка переповнена темними історіями про його розкішний спосіб життя, підтримуваний жорстоким режимом, залишеним його батьком. Незважаючи на відсутність рішучості, він має амбіції, щоб його вважали рівним батькові. Хоча багато хто бачить у ньому не більше, ніж маріонетку й плейбоя, Рамфіс прагне змінити це. Для багатьох домініканців Бог і Трухільйо мають знову стати одним і тим самим."

DOM_Blanqueamiento: "Blanqueamiento"  
DOM_Blanqueamiento_desc: "За правління Трухільйо Домініканська Республіка здійснила особливо помітну ініціативу — Blanqueamiento, або 'Вибілювання'. Вважаючи, що іспанська біла культура є маяком, що цивілізував примітиви регіону, країна прийняла республіканських біженців, які втікали від Громадянської війни в Іспанії, незважаючи на його ідеологічну й політичну близькість до націоналістів, а також, несподівано, єврейських біженців, які втікали від наступу нацистів під час Другої світової війни.\n\nОднак це було лише першим кроком. Після закінчення конфлікту Трухільйо налагодив тісніші зв’язки з Франко та почав укладати торговельні, культурні й, найважливіше, міграційні угоди з Іспанією. Хоча ці ініціативи виявилися успішними, іберійці масово переселялися на острів, це не змогло істотно вплинути на переважно мулатське та чорне населення.\n\nНа додаток до фундаментальної антигаїтянської ідеології режиму, яка призвела до різанини з Перцевою травою 1937 року та вторгнення до Інче 1948 року, напруженість, спричинена цією політикою, відновила фактично геноцидну політику проти гаїтян, сприяючи дискримінації та насильству щодо великої кількості гаїтянських чорношкірих, які проживають у країні. Це призвело до зростання кількості погромів і вигнання гаїтян із прикордонних громад, штучно збільшуючи відсоток білих у процесі."

DOM_Rising_Resistance: "Тиха інсургенція"  
DOM_Rising_Resistance_desc: "Для сторонніх спостерігачів здається, ніби вся Домініканська Республіка підкорилася владі Генералісімуса, але є ті, хто ризикує всім, щоб побачити його падіння. Проте провал експедиції Луперон у 1959 році з метою повалення Трухільйо спричинив загальнонаціональну зачистку, залишивши опозицію розпорошеною та наляканою. Але, як доводить історія знову і знову, цього було недостатньо.\n\nЗагальне незадоволення режимом поширюється: від молодого покоління, що прагне змін, до старшого, яке колись співпрацювало з режимом і отримувало з цього вигоду, але тепер відчуває застій та невизначеність, а також через скандальну моральну розпусту сім’ї Трухільйо та його близького оточення, яку більше неможливо ігнорувати. Тихі чутки про революцію циркулюють у казармах і серед офіцерів, які втомилися від зловживань, меж яким режим не знає.\n\nПоки це невдоволення мовчазно пускає коріння у домініканському суспільстві, режим намагається приховати зростання міських інсургенцій, організованих Революційним рухом 14 червня, заснованим вижилими після катастрофи в Лупероні та домініканцями, які більше не можуть терпіти мовчання."

DOM_Modernizing_Military: "Модернізація армії"  
DOM_Modernizing_Military_desc: "[GetDOMModernizingMilitaryDesc]"  
DOM_Modernizing_Military_normal_desc: "Протягом останнього десятиліття домініканська армія переживає швидку експансію, майже повністю фінансовану за рахунок вигідного експорту цукру та какао-бобів на досить обмежені ринки Європи та Аргентини, а також за підтримки інтересів Тріумвірату. Ізольована в Карибському басейні через ворожість сусідів і вступ Гаїті в OFN, стає очевидним, що ми повинні захищати себе від деградованої ямайської імперіалістичної агресії з усіх боків."
DOM_Modernizing_Military_pupo_roman_desc: "За правління генералісімуса Трухільйо домініканська армія пережила швидку експансію, підкріплену імпортованими зброєю Тріумвірату та величезними бюджетами, фінансованими за рахунок експорту цукру та какао. Однак після висадки в Пуерто-Плата, що розкрила провали його благодійника, армія спрямувала своє блискуче нове озброєння проти цього маленького фашиста. Хоча її хвалили за визволення, надмірний розмір армії і ненависть до лівих Гаїті може призвести до того, що її генерали завершать нову еру свободи Кіскейї так само рішуче, як вони її розпочали."

DOM_Widespread_Revolts: "Широкомасштабні повстання"  
DOM_Widespread_Revolts_desc: "Ззовні Домініканської Республіки йде вторгнення — всередині ж відбувається повстання. Обидва мають одну мету — позбутися Трухільйо. Обидва бої йдуть одночасно — і обидва необхідні, щоб скинути генералісімуса. Офіцери, які піддаються вбивствам, склади, які вибухають, вкрадені арсенали — кожен акт наближає до того, що вони вважають неминучим визволенням. Вулиці забарвлені червоним від крові як друзів, так і ворогів; набагато безпечніше залишатися вдома."

PPI_Military_Preparation: "Військова підготовка"

DOM_Significant_Revolts: "Значні повстання"  
DOM_Significant_Revolts_desc: "Хвиля хаосу накрила Домініканську Республіку, загрожуючи знести режим Трухільйо. Поки Карибський Легіон атакує державу ззовні, дисиденти та повстанці атакують її зсередини — обидва з однією метою — повалити режим, що триває понад тридцять років. Партизанські атаки, вибухи та вбивства стали звичайним явищем, і вони накладають серйозний тиск на війська Трухільйо."

DOM_Small_Insurgency: "Мале повстання"  
DOM_Small_Insurgency_desc: "Вторгнення в Пуерто-Плата Карибського Легіону не єдине у своїй спробі скинути людину, що править Домініканською Республікою — вони приєдналися до них різні дисиденти та повстанці зсередини країни. Ці сили всередині країни виснажені — вони здебільшого діють як підтримка для Легіону, оскільки здається, що вони вже не здатні виконати будь-які завдання самостійно."

DOM_Nationwide_Crackdown: "Загальнонаціональна зачистка"  
DOM_Nationwide_Crackdown_desc: "Залізний кулак Рафаеля Трухільйо обрушився на різних повстанців і дисидентів, які загрожували його владі. Тіла трупів вистилають вулиці, асфальт яскраво червоний від крові. Порядок був відновлений у Домініканській Республіці — і він буде підтриманий."

DOM_BSI_detachment: "Іберійський підрозділ BSI"

DOM_ceasefire_Mobilization: "Національна мобілізація"  
DOM_ceasefire_Mobilization_desc: ""За наказом Президента Домініканської Республіки, доктора Хоакіна Балагера:\nПоточна загроза з боку підривних елементів, зрадників та загарбників не може бути недооцінена, оскільки вони отримують підтримку ззовні від сил, що мають власний інтерес у їхньому успіху. Тому я вважаю за необхідне оголосити загальну мобілізацію по всій території Домініканської Республіки.\n\nМи готові до боротьби на життя і смерть для збереження стабільності Кіскейї, і повинні бути готові захищати себе та свої сім'ї в будь-який час. Ми не дозволимо зрадникам знову застати нас зненацька; я сподіваюся на співпрацю кожного громадянина Нації."
DOM_ceasefire_New_State: "Нова держава"  
DOM_ceasefire_New_State_desc: "Незважаючи на те, що Президент Балагер з теплом згадує свою співпрацю з покійним родичем, Президентом Трухільйо, він є самостійною особистістю.\n\nЗ часом Трухільйо втратив будь-яку реальну мету поза власними егоїстичними інтересами та пропагандою безмежного гедонізму; цей чоловік навіть змусив Германа Ґерінга виглядати стримано порівняно з ним. Балагер, з іншого боку, має чіткий план. У Домініканській Республіці під його правлінням кожен громадянин буде чесним і сильним, а також знатиме свою роль, не піддаючись зовнішньому зіпсуттю.\n\nНемає кращого часу, ніж тепер. Серед поточної стагнації, якщо Балагер правильно використає свою можливість і розставить всі картки, він зможе перетворити Кіскейю на справжній бастіон чеснот серед сірої хвилі XX століття."

DOM_The_Defense_State: "Держава в Обороні"  
DOM_The_Defense_State_desc: "З одним орлом на горизонті ми покладаємось на іншого для підтримки. Наші зусилля спрямовані на будівництво оборони, навчання та оснащення нашої армії, а також на постійне спостереження за нашими північними берегами. Для допомоги в наших зусиллях дипломати подорожують через Атлантику, шукаючи підтримки з боку німецьких, іберійських і італійських сил для отримання кращої зброї та експертних радників.\n\nЯкщо OFN досягне Санто-Домінго, вони зроблять це, ступаючи через море власної крові."
DOM_The_Defense_State_2: "Держава в Обороні"  
DOM_The_Defense_State_2_desc: "З одним орлом на горизонті ми покладаємось на інших для підтримки. Наші зусилля спрямовані на будівництво оборони, навчання та оснащення нашої армії, а також на постійне спостереження за нашими північними берегами. Для допомоги в наших зусиллях дипломати подорожують через Атлантику, шукаючи підтримки з боку німецьких, іберійських і італійських сил для отримання кращої зброї та експертних радників.\n\nЯкщо OFN досягне Санто-Домінго, вони зроблять це, ступаючи через море власної крові."
DOM_Black_Spot_of_the_Caribbean: "Чорна пляма Карибського басейну"  
DOM_Black_Spot_of_the_Caribbean_desc: "Трухільйо в 1950-х роках був як дитина, що б'є іграшками, пихатий і буркотливий у своїх спробах роздратувати Сполучені Штати. Тепер він і його республіка подорослішали, і їхні зусилля проти північного орла значно вдосконалилися. Завдяки компетентній місцевій розвідці, що підтримується і співпрацює з німецьким розвідувальним апаратом, Домініканська Республіка стане центром антиамериканських операцій, якого будуть боятися та ненавидіти."
DOM_Black_Spot_of_the_Caribbean_2: "Чорна пляма Карибського басейну"  
DOM_Black_Spot_of_the_Caribbean_2_desc: "Трухільйо в 1950-х роках був як дитина, що б'є іграшками, пихатий і буркотливий у своїх спробах роздратувати Сполучені Штати. Тепер він і його республіка подорослішали, і їхні зусилля проти північного орла значно вдосконалилися. Завдяки компетентній місцевій розвідці, що підтримується і співпрацює з німецьким розвідувальним апаратом, Санто-Домінго стане центром антиамериканських операцій, якого будуть боятися та ненавидіти."
DOM_La_Patria_Nueva: "La Patria Nueva"  
DOM_La_Patria_Nueva_desc: "Кіскейя колись була відсталою колонією; Трухільйо зробив її такою, що стала чимось більшим: Новою нацією, державою та силою, з якою треба рахуватися. Але це лише частина його більшого бачення. Тепер починається боротьба за створення нової культури, більш білої національної ідентичності, де Трухільйо стане її засновником-пророком. Якщо йому вдасться це зробити, він підніметься до небес як pater gentis поруч з Сімоном Боліваром та Афонсу Генріке — і він досягне цих небес на мільйонах гаїтян, які не відповідають цій культурі."
DOM_A_New_State: "Нова держава?"  
DOM_A_New_State_desc: "Марнотратні надмірності режиму Трухільйо — відкрите пригнічення, расова перевага — все це повинно піти. Балагер та його кабінет успадкували націю, що гостро потребує оновлення. Тому підніміть рукави, Санто-Домінго, і готуйтесь до економічних та політичних реформ, гідних сучасної нації. Вашими зусиллями ці заморожені дипломатичні зв'язки можуть розтанути, і решта світу почне серйозно ставитися до нашої нової держави."

DOM_Puppet_Caudillo: "Ляльковий каудільо"
DOM_Puppet_Caudillo_desc: "Рамфіс Трухільйо, каудільо Домініканської Республіки, проводить свої дні за азартними іграми, пияцтвом і розпукою. Далеко не влада, що стоїть за троном, втручатися в це. Військова розвідка країни, SIM, контролює державу, очолювана своїм керівником Джонні Аббесом Гарсією. У відсутність Рамфіса корабель держави керує Аббес і SIM — що є цілком прийнятним для Німеччини, яка використовує свої широкі зв'язки з обома, щоб зробити Домініканську Республіку форпостом німецької розвідки."

DOM_National_Rescue: "Процес національного порятунку"
DOM_National_Rescue_desc: "Проблема, за думкою домініканської олігархії, полягала в концентрації влади в одній людині. Надання влади тирану майже призвело їх до руїни, і тепер вони повинні запобігти виникненню ще одного такого тирана. Розподіл влади серед інтересів олігархії та стародавніх родин дозволить їм зберегти свою владу, при цьому контролюючи один одного, щоб утримувати свої найгірші імпульси. Для народу вони стверджують, що це спроба врятувати Республіку; насправді ж, вони просто переконуються, що ніхто більше не наробить хаосу."

DOM_Auxiliary_Occupation: "Допоміжна окупація"
DOM_Auxiliary_Occupation_desc: "Американські солдати патрулюють села, шукаючи прихильників режиму Трухільйо. У будівлі Конгресу депутати витягуються по троє-чотири рази, щоб бути допитаними на предмет їхніх симпатій до 'екстремістських елементів'. Тимчасовий уряд санкціонує ці полювання, прагнучи, щоб американці очистили країну від гнилі, яку залишив Трухільйо. Нехай їхні зусилля будуть справедливими та швидкими в боротьбі з фашизмом."

DOM_Pan_American_Force: "Панамериканські сили"
DOM_Pan_American_Force_desc: "Коли люди думають про слово 'американець', вони уявляють товстих білих чоловіків з гамбургером в одній руці та факелом свободи в іншій. Але подивіться на американців у Домініканській Республіці: бразильські інженери будують вогневі точки для мексиканських охоронців, гаїтянські та суринамські офіцери обмінюються сигаретами та стратегіями, а солдати з усіх десяти країн Вест-Індських островів патрулюють вулиці і підтримують порядок. По всій Домініканській Республіці ОАГ здійснює перехід від деспотизму до демократії."

DOM_The_Dominican_Peoples_Revolution: "Революція Домініканського Народу"
DOM_The_Dominican_Peoples_Revolution_desc: "Коли тіло Трухільйо було наскрізь пробите кулями і лежало на вулиці, це було лише початком. Режим тирана зламано, і тепер народ Домініканської Республіки може знову з'єднати свої долі. Перший крок нового уряду Домініканської Республіки — закріпити свою легітимність і відповісти на найгірші страхи народу. Для натхнення вони дивляться на Кубу і проводять паралелі зі своєю революцією, щоб показати, що така революція може бути успішною — при цьому тихо ігноруючи більш націоналістичну реальність Куби."
DOM_The_Dominican_Cultural_Revolution: "Домініканська культурна революція"
DOM_The_Dominican_Cultural_Revolution_desc: "Домініканці, прийнявши необхідність і можливість національної революції, тепер готуються до її реалізації. Новий уряд працює над втіленням цієї революції, переорієнтуючи домініканську ідентичність на класові лінії, розриваючи панування Католицької Церкви в їхній культурному житті і виганяючи земельних власників, щоб їхні неправомірно отримані наділи могли бути передані фермерам, яким потрібна власна земля."
DOM_Starting_from_Scratch: "Почати з чистого аркуша"
DOM_Starting_from_Scratch_desc: "Коли хочеш виростити новий врожай, треба спалити землю. Коли бур'яни, шкідники та інвазивні види заполоняють землю, їх виривають один за одним, поки не залишиться нічого, окрім великого вирубаного поля. Домініканська революція очистила поля від містичного панування Церкви, жорстоких і надмірних збройних сил і величезного впливу олігархії; тепер пора засівати нові насіння. Починаючи з найскладнішого завдання, ця нова держава має бути відбудована з основ."
DOM_Economic_Revolution: "Економічна революція"
DOM_Economic_Revolution_desc: "Нова Домініканська Республіка має захопливе і важке завдання побудувати нову соціалістичну економіку на руїнах старої клептократії Трухільйо. Планова економіка, що обслуговує потреби всіх її громадян; реформа сільськогосподарської бази, яка надає владу фермерам і годує націю; освітня система, що є безкоштовною, доступною і всебічною для підвищення інтелекту народу; трудова демократія, продовольча та робоча безпека... З чистим полотном вони малюють своє бачення соціалістичної утопії."
DOM_Autonomous_Hinche: "Автономні території Гінче"
DOM_Autonomous_Hinche_desc: "Гінче було захоплено режимом Трухільйо, але це ніколи не було справжньою домініканською територією. Це було частково виправлено новою Республікою, де місцево обрані політики НПНВ утримують владу на цій автономній території. З міста Шарлеман Перальте, НПНВ веде партизанську кампанію проти буржуазного гаїтянського уряду, і коли настане час для допомоги з боку Домініканської Республіки, їх підтримка почнеться та буде зосереджена в Гінче."
DOM_Autonomous_Hinche_tt: "§YНадасть підтримку £GFX_haitian_guerrillas §eНПНВ§!§!"
DOM_Exodus: "Національний ексодус"
DOM_Exodus_desc: "Як щурі, що тікають з т sinking корабля, буржуа втікають від революції в Іберію, аби не потрапити в руки революціонерів і не бути покараними як прихильники Трухільйо або підпільні реакціонери. На жаль, список тих, хто боїться цієї долі, дуже довгий, і в ньому є велика кількість кваліфікованих робітників та інтелектуалів, чия присутність у списку є надмірною. Разом із їхнім досвідом і знаннями йде їхнє багатство, ще більше біднячи нову Домініканську Республіку."

DOM_Limits_Of_Tolerance: "Обмеження терпимості"
DOM_Limits_Of_Tolerance_desc: "Революціонери не розуміють, що їх так звана 'Революція' — це лише міраж. Те, що почалося з Пуерто-Плата, було трагедією, весь добробут, що з'явився після смерті Трухільйо, майже був зруйнований громадянською війною, але Балагер поклав цьому край. Домініканська Республіка вирішила здійснювати обережні зміни, ретельно налаштовуючи політику та принципи, які не дозволяють їй знову потрапити в темні віки — і якщо це означає пом'якшити вогонь революційного запалу будь-якими способами, то нехай так буде."
DOM_Doctor_Prescription: "Рецепт лікаря"
DOM_Doctor_Prescription_desc: "В очах Балагера економічний ріст не вимірюється дрібними транзакціями чи малими громадськими роботами. Він має бути великим, масштабним та всеосяжним. Його новий економічний план для Домініканської Республіки передбачає величезні інвестиції в громадський розвиток та міську інфраструктуру. Асфальтування доріг, будівництво дамб, прокладання каналів, укладання шосе, зруйнування цілого кварталу та його відбудова з нуля; це бачення Балагера, і він очікує, що його економіка підніметься як результат."
DOM_Mending_Our_Path: "Виправлення нашого шляху"
DOM_Mending_Our_Path_desc: "Балагер був меншою версією Трухільйо в плані відданості та сили; криптофашист, якому не потрібне було іноземне вторгнення, щоб його усунути. Його наступник прагне повернути Домініканську Республіку на правильний шлях. Збройні сили служитимуть народу, а не лідеру; місцевий бізнес буде захищений від грабіжницьких корпорацій; вигнанці будуть привітно зустрінуті. Коли Гусман завершить свою роботу, остання пляма спадщини Трухільйо буде стерта з нації, і Домініканська Республіка буде остаточно вільною."

DOM_The_Living_Ghost: "Живий привид"
DOM_The_Living_Ghost_desc: "Трухільйо може бути шість футів під землею, але його дух переслідує Домініканську Республіку. Спроби нового уряду відійти від його впливу були розчарувально обмеженими, оскільки симпатики сперечаються про його спадщину та легітимність уряду, який намагається відкинути батька цієї нації. Чи буде поточний уряд успішним у де-Трухільйо, це питання, яке зараз вирішується."

DOM_The_Dominican_Revolution_0: "Домініканська Революція" # default
DOM_The_Dominican_Revolution_0_desc: "Коли Домініканська Республіка прокинулась після важкої перемоги у смерті Трухільйо, вони поставили питання, яке мусить поставити кожен переможець: 'Що далі?' Для чого була вся ця боротьба і смерть? Яке бачення майбутнього це була війна за? Домініканська Республіка підводить підсумки, варить каву і починає записувати всі причини, чому потрібно було вбити Трухільйо. Можливо, вони знайдуть ту, яка визначить їхнє життя."
DOM_The_Dominican_Revolution_1: "Домініканська Революція" # bosch
DOM_The_Dominican_Revolution_1_desc: "Коли тіло Трухільйо було наскрізь пробите кулями і лежало на вулиці, це не було кінцем нашої місії. Це був лише перший крок на шляху, перша цеглина в фундаменті, перший хід у більшу гру. Домініканська Революція має значно більше значення: це побудова нації на принципах соціальної справедливості, економічної рівності та культурної рівноправності. Це свобода, мораль, зміни. Це зміна Домініканської Республіки, назавжди і на краще."
DOM_The_Dominican_Revolution_2: "Домініканська Революція" # bonnelly
DOM_The_Dominican_Revolution_2_desc: "Коли тіло Трухільйо було наскрізь пробите кулями і лежало на вулиці, це був сигнал, що боротьба підходить до кінця, громадянська війна була лише наслідком. Ідеалісти та мрійники думають, що це означає більше, але Домініканська Революція закінчилася, коли Трухільйо було повалено. Тепер наступає важка частина: життя після захоплення, вихід з мрії і вступ у світ реальності. Час взятися за серйозні справи, за розумні політики, прогресивні, але обережні зміни та обережну лібералізацію."
DOM_Reform_Program: "Програма реформ"
DOM_Reform_Program_desc: "Після вбивства страшної істоти, уряд Боша тепер звертає свій погляд на тих, хто його породив: католицьку церкву та земельних власників. Секуляризація цивільної влади позбавляє Церкву її непотрібних позицій влади, а земельна реформа повертає наділи, жадібно зібрані земельними власниками, назад у руки народу. Це сміливі ініціативи, але в країні, що бореться з наслідками війни, вони можуть загрожувати обрушенню вже й так хитких основ цього уряду."
DOM_Fourth_Dominican_Republic: "Четверта Домініканська Республіка"
DOM_Fourth_Dominican_Republic_desc: "З кожним днем пам'ять про еру Трухільйо тьмяніє. Старі рани гояться, старі шрами блякнуть. Люди відвертаються від минулого, з його зруйнованими містами і масовими могилами, і звертаються до радикально іншого майбутнього. Демократія, стабільність і уряд, який щиро піклується про свій народ. М'якше, добріше майбутнє вже на горизонті, і народ Домініканської Республіки крокує до нього з легким серцем."
DOM_Common_Sense_Program: "Програма здорового глузду"
DOM_Common_Sense_Program_desc: "Майбутнє перед нами лежить серед мінного поля, усіяного тілами візіонерів і наївних мрійників. Ця нова Домініканська Республіка буде іншою. Вони обережно крокують вперед, ретельно обираючи помірковані кроки на безпечному шляху. Стабільність, обережний розвиток, поміркованість — це те, що збереже Домініканську Республіку від нового періоду хаосу і кровопролиття."

