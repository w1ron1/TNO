# Leader descs
POLITICS_HAI_DEJOIE_DESC: "Нащадок французького рабовласника та президента Фабра Жеффрара, який повалив Другу Гаїтянську імперію, президент Луї Дежуа, здається, ніколи не відходив далеко від шляху до своєї нинішньої посади. Хоча він, можливо, стверджує протилежне, для звичайного гаїтянина зрозуміло, що президентство було для Дежуа таким же спадком, як і його цукрові плантації та землеволодіння.\n\nДежуа народився сином заможних землевласників, пристосовування до еліти було в його ДНК. Тому зовсім не дивно, що він тісно зв'язав себе зі своїм другом і наставником, Елі Леско. Двадцять років правління мулатської верхівки минуло, і Дежуа приєднався до свого керівника у накопиченні багатств.\n\nТим часом обставини змінилися. Уряд Дьюї, який був таким вірним президентству Леско, пішов у минуле, і з часом справи ставали дедалі складнішими. Зрештою, Леско було відправлено у відставку, а наступник сидів у кабінеті поруч. Питання, хто це був, для більшості навіть не виникало, відповідь була очевидною навіть для найбільш віддаленого дипломата чи для найбіднішого та найбільш пригніченого темношкірого громадянина.\n\nДехто відчуває сором за відкриту корупцію та олігархію, намагаючись дати щось пересічним людям у якості взаємної домовленості. Не так Дежуа — для нього немає сенсу змінювати порядок речей, яким його встановив Леско. Він, можливо, і самостійна особистість, але залишається аватаром мулатократії, так само як його попередник, і так само готовий зберігати важелі влади в руках мулатів."
POLITICS_HAI_JACQUES_STEPHEN_DESC: "Кажуть, що бути гаїтянином означає бути африканцем, але Жак-Стефан Алексі робить цей вислів ще більш глибоким. Для нього це також працює у зворотному напрямку, адже сама Гаїті є синтезом африканської культури та ідентичності. Це, своєю чергою, формує його мрію про майбутнє, яке одного дня об’єднає острівну націю з її прабатьківщиною через спільну боротьбу проти колоніалізму.\n\nНародившись у Гонаїв, Гаїті, у 1922 році, Жак-Стефан Алексі з раннього віку займався академічними дослідженнями, навчався у Франції та Сполучених Штатах, де вивчав медицину. За кордоном він захопився як письменництвом, так і комунізмом, розглядаючи їх як інструменти для допомоги своїй пригнобленій нації втекти від її поневолювачів.\n\nАктивний учасник руху «Негритюд», спрямованого на утвердження позитивної африканської ідентичності, Алексі рано зацікавився ідеями панафриканізму через свої літературні роботи. Він також вступив у соціалістичні кола, приваблений антиімперіалістичними аспектами марксистських ідеологій, і зрештою очолив НПНВ, заручившись підтримкою у сільській місцевості.\n\nКоли НПНВ консолідує свою владу під керівництвом Алексі, стає очевидним, що пишеться новий розділ гаїтянської історії, який може віддалити країну від колоніального впливу Заходу та наблизити її до своїх заморських братів і сестер. Жак тільки сподівається, що Сполучені Штати та інші іноземні держави не зможуть підірвати його рух, як вони вже намагалися зробити багато разів до цього."
POLITICS_HAI_CANTAVE_DESC: "Якщо є одна річ, на яку генерал Леон Кантав завжди знаходить час, то це слухати, як хтось критикує демократію та соціалізм, адже з часом це стало одним із його улюблених занять.\n\nСтара система управління Гаїті була, в кращому випадку, недосконалою. 'Демократично обрані' президенти, Леско та Дежуа, були, в кращому випадку, корумпованими егоцентриками, а в гіршому — простими недоумками, здатними лише привласнювати ресурси для себе. Для чого читати антидемократичну пропаганду в Гаїті, якщо мулатократи самі були найкращим доказом її недоліків?\n\nЗгодом стало зрозуміло, що гаїтяни були введені в оману соціалізмом. Як можна було припуститися такої помилки? Хіба катастрофи у Франції, що межували з соціалізмом, іспанських республіканців, Куби та Радянського Союзу не були достатнім застереженням проти цього шляху?\n\nОчевидно, цього не можна було допустити, і армія не дала цьому статися. Леон Кантав узяв владу у свої руки, усунувши соціалістів і демократів від управління країною. Прихильники занепалих ідей можуть скаржитися, але їхні думки не мають значення. Кантав, тепер президент Республіки Гаїті, бере на себе всю відповідальність за гаїтянський народ. Оскільки всі інші зазнали невдачі, нехай замовкнуть: Кантав усе владнає."
POLITICS_HAI_FIGNOLE_DESC: "Гаїті пережила роки нестабільності та страждань, роки расистського безладдя, під час яких гаїтянський народ став об'єктом тіньових оборудок. Десятиліття дурості за дурістю минали, і нація страждала, тоді як домініканці та інші отримували переваги за рахунок уряду та народу Гаїті.\n\nАле Даніель 'Ле Професор' Фіньоле не сидів склавши руки, поки його країна стікала кров'ю. Як переконаний ліберал, він день у день виступав проти урядів Леско та Дежуа. Люди Леско часто мстилися Фіньоле: коли він писав викривальні статті, його газети закривали, а його самого звільняли. Але це мало і зворотний ефект — його пристрасні виступи здобули йому популярність серед народу, який організовував 'woulo konpresè' або 'парокатки' проти тиранії мулатократів.\n\nПоразка за поразкою були деморалізуючими, але Фіньоле був готовий боротися навіть до смерті. Однак обставини змінилися: хунта Франка Лаво не змогла правити диктаторськими методами, а новий президент більше боявся домініканського нападу, ніж демократів чи комуністів. Тому він звернувся до 'Професора', і залишки еліти погодилися прийняти Фіньоле як президента, одночасно з тим, як він переконав лівих погодитися на його правління на певний час.\n\nТепер гаїтянська нація об'єднана під керівництвом одного лідера. Збройні сили, заможні землевласники, соціалістичні революціонери та прості робітники повинні працювати разом, поки Трухільйо не приєднається до Наполеона та інших тиранів шість футів під землю. Фіньоле клянеться, що не зупиниться, поки свобода не зазвучить у кожному поселенні острова."
POLITICS_HAI_FRANCOIS_DUVALIER_DESC: "Мулати називають Франсуа Дювальє небезпечною людиною, загрозою для закону та порядку. Афро-гаїтянська більшість, особливо ті, хто найбільш ворожо ставиться до еліти та найбільш прихильний до негритюду й чорного націоналізму, бачить у ньому втілення своїх надій. Військові, які є другою половиною його бази підтримки, називають його 'хорошою людиною'.\n\nАле всі — починаючи від пацієнтів, яким він так сумлінно служив у молодості, і до військових, іноземців та дипломатів — називають його 'Папа Док'.\n\nЙого шлях до влади був зовсім не очевидним, але його переконання були завжди зрозумілими. Расизм і насильство, які відбувалися під час окупації Гаїті Сполученими Штатами в 1910-х роках, надихнули чорний націоналізм серед гаїтян і залишили сильне враження на молодого Дювальє. Він побачив бідну чорну більшість і їхнє обурення проти мулатократії. Підтримуючи панафриканські ідеї, він долучився до місцевого руху негритюду, розпочавши довгу та хаотичну політичну подорож, яку час від часу переривали його повернення до медичної практики.\n\n— І тепер, несподівано, завдяки сенсаційній перемозі, він став президентом Гаїті. Більшість вважає, що він знищить стару мулатську еліту і виступить проти американців; однак його подальша політика залишається загадкою, і він може обрати шлях, якого ніхто не очікував."
POLITICS_HAI_HUDICOURT_DESC: "Гаїті пережила роки нестабільності та страждань, роки расистського безладдя, під час яких гаїтянський народ ставав жертвою тіньових оборудок. Десятиліття дурощів за дурощами минали, і нація страждала, тоді як домініканці та інші отримували переваги за рахунок уряду та народу Гаїті.\n\nМакс Леліо Гюдікурт не був тим, хто сидів би склавши руки, коли країна зраджувалася. Його шановний дядько, сенатор П'єр Гюдікурт, наставляв його й схвально спостерігав, як молодий чоловік здобував репутацію талановитого оратора й внесок у ліву думку на Гаїті. Отримавши диплом юриста, молодший Гюдікурт став працівником фірми свого дядька-сенатора.\n\nЛіві погляди Гюдікурта обурювали США, Стеніо Вінсента, Елі Леско і всі деспотії та гегемонії всередині й за межами Гаїті. Їх не задовольняло просто не погоджуватися з ним — його раз за разом катували, заарештовували його і його друзів, закривали його видання й виганяли з робочих місць. Але ніщо з цього його не зупинило; навпаки, це загартувало його характер — і об’єднало багато верств гаїтянського суспільства в захопленні ним.\n\nТепер настав момент істини: уряд так чи інакше поступився, і тепер Гюдікурт очолив країну. На нього покладено багато надій, і багато різноманітних фракцій вірять у нього, сподіваючись, що він стабілізує Об’єднаний фронт і перетворить його на постійний, функціональний уряд. В ім'я народу й усіх його чеснот Гюдікурт клянеться, що виправдає їхню довіру або загине, намагаючись."
POLITICS_HAI_LAVAUD_DESC: "Якщо зазирнути в кабінет колишнього генерала, а нині президента Франка Лаво, можна побачити багато атрибутів старого мулатократичного уряду Леско й його наступника, якого Лаво характеризує як 'пса Леско — Дежуа', розкиданих по підлозі, скинутих зі своїх старих насиджених місць. І це не дивно, адже Лаво взяв на себе обов’язок покінчити з ідіотською расистською політикою своїх колишніх босів настільки, наскільки це можливо.\n\nУправління Леско й Дежуа (або, швидше, їхня бездарність) існувало майже стільки, скільки Лаво був активним генералом. Очоливши Гвардію Гаїті та Міністерство оборони в 1944 році, він спостерігав, як надмірна наближеність Леско до Трухільйо дозволила останньому отримувати перевагу за перевагою за рахунок Гаїті. Тим часом, поки мулатократична еліта співала хвалебні оди цьому збоченцю, все, що Лаво бачив у Трухільйо, — це ту ж саму стару амбіцію зробити те, що вони завжди хотіли, а саме анексувати Гаїті.\n\nЗ часом відсутність готовності Гаїті ставала нестерпною. Якби уряд Леско залишався при владі, або мрія Трухільйо стала б реальністю швидше, ніж Лаво встиг би сказати 'putain de merde', або маси Порт-о-Пренсу впали б у лють і віддали країну комуністичним маніякам. Тому він зробив те, що зробив би будь-який військовий на його місці — скинув президента, мобілізував армію й ініціював украй необхідні реформи.\n\nЛаво не схожий на 'професора' чи 'кансон фе'. Демократія чи толерантність до лівих — ці поняття не входять у його словник. Але знищити мулатократію? О, це те, що Лаво залюбки зробить, адже лише дурень посмів би сказати, що мулатська еліта зробила щось варте похвали, маючи владу донині."
POLITICS_HAI_LESCOT_DESC: "Зустрічайте нового босса, який не відрізняється від старого.\n\nЗ самого початку свого правління президент Антуан Луї Леокарді Елі Леско керував виключно за власною волею. Ювенал у своїх Сатирах висміював підхід \"так я хочу, так я наказую; нехай моя воля замінить розсудливий суд\"—але Леско, навпаки, прийняв цей підхід із ентузіазмом.\n\nДвадцять років клептократичної корупції—або, як називає це сам Леско, стратегічного спрямування коштів—у поєднанні з методом управління, який всі, крім самого Леско, його друзів і вигодонабувачів, вважали регресивним, забезпечили йому утримання влади, навіть коли союзники програли Другу світову війну, а Домініканська Республіка впала в хаос. Але, на жаль, чорношкірі не зрозуміли свого належного місця—нижче за мулатів і білих—і почали повставати; Леско не залишалося нічого іншого, як зректися на користь свого наступника.\n\nНу, той час минув; міжцарів'я закінчилося. Леско повернувся до влади, навіть якщо маси внизу скаржаться так само голосно, як і раніше. Американці виконають свій обов'язок і збережуть його уряд, як це було колись. Воля гаїтянського народу не повинна впливати на жодні рішення. Важливо лише, щоб правильні люди залишалися при владі, а на чолі стояла правильна особа."
POLITICS_HAI_MAGLOIRE_DESC: "Генерал Поль Ежен Маглуар, відомий гаїтянам як Kanson Fè (Залізні Штани), тепер є останньою надією простих людей нації, обложеної внутрішніми поділами й оточеної зовнішніми загрозами.\n\nМаглуар має неоднозначне минуле. Іноді він виступав проти деспотизму, але в інші часи опортуністично підтримував його. Колись він був одним із найвірніших прихильників Леско у військових колах—але потім побачив гнів простого народу й вирішив, що буде розумніше скинути мулатократа та його наступника.\n\nНаразі ситуація вкрай чутлива, адже Гаїті стикається з небезпеками у двох напрямках. Хоча є певна підтримка ззовні, оборона нації має бути компетентною та обережною. Гаїтянський уряд має працювати у широкій коаліції, де всі, хто бажає працювати на стабільність нації, будуть прийняті та

# Ideas
HAI_Mulatocratie: "Мулатократія"
HAI_Mulatocratie_desc: "Коли американські війська висадилися на території Республіки Гаїті і почалася її окупація, колабораціоністи, які працювали з США в новому режимі, стали мулатською елітою Республіки, що призвело їх до потужних політичних та економічних позицій, надаючи їм значний контроль над державою. Цю систему багато хто в країні став асоціювати з терміном «мулатократія», тісно пов'язану з США та їхнім впливом на країну.\n\nХоча позитивна дискримінація лише погіршувалася після того, як уряд Леско відмовився змінювати статус-кво та впроваджувати реформи, багато хто покладав свої надії на П'єра Дежуа і його реформістську платформу, обіцяючи необхідні зміни в державі. Економічно країна пережила відродження, але політично не отримала нічого більше, ніж символічні реформи в уніжуючому статус-кво, що призвело до втрати надії в уряді і переходу до опозиційних груп."
HAI_Mulatocratie_Lavaud: "Мулатократія"
HAI_Mulatocratie_Lavaud_desc: "Коли американські війська висадилися на території Республіки Гаїті і почалася її окупація, мулатська еліта виступала як колабораціоністи з новим режимом. У відповідь на це вони були сприянні в досягненні потужних політичних та економічних позицій, що надало їм значний контроль над державою. Цю систему «мулатократії» глибоко асоціюють з США та їхнім впливом на Гаїті.\n\nПопри регресію, яку зазнав уряд під керівництвом Леско Старшого та фальшиві обіцянки Дежуа, режим Франка Лавада почав фактично впроваджувати реформи, спрямовані на боротьбу з багатьма з цих корупційних практик. Це включає відкриття урядових посад для чорних гаїтян і, відповідно, зменшення домінування мулатської еліти. Однак, коли реформи впроваджуються, стає очевидно, що «мулатократія» продовжуватиме зберігати disproportionate рівень контролю в Гаїті, доки США зберігають руку в політиці нації."
HAI_La_Fausse_Democratie: "Фальшива демократія"
HAI_La_Fausse_Democratie_desc: "З кінцем Гаїтянської громадянської війни Лавад опинився в ситуації, де його реформістська фракція стала домінуючою партією на політичній сцені Гаїті, здатною впровадити багато з тих змін, які раніше були йому недоступні. Кожного дня Лавад та його партія стають все сміливішими у своїх спробах розібрати «мулатократію» через антикорупційні заходи в поєднанні з бюрократичною ротацією.\n\nПопри це, очевидно, що корупція виживе серед правлячої еліти. Партія Лавада не має наміру демократизувати націю, яку вони тепер керують без опозиції, і для багатьох гаїтян життя продовжуватиметься так, як це було в останні десятиліття."
HAI_Le_Souverain: "Суверен"
HAI_Le_Souverain_desc: "З перемінами у політичному кліматі, «мулатократія» Гаїті була знесена хвилями чорного націоналізму. Різке піднесення Дювальє і консолідація влади під його праворадикальною популістською партією призвели до атак на верхівку мулатської еліти, що прагне позбавити їх влади, яку вони здобули за допомогою американського втручання, і передати її чорним гаїтянам.\n\nВиступаючи за видалення впливу США з острова, тепер меншою є підтримка з-за кордону для боротьби з ППЛН та внутрішніми ворогами режиму. Дювальє впевнений, що він та його прихильники в армії зможуть здолати будь-які загрози, що оточують нестабільну націю."
HAI_La_Tonton_Macoute: "Тонтон Макут"
HAI_La_Tonton_Macoute_desc: "Старий, який зникає з непокірними дітьми, кидаючи їх у свій мішок, є поширеним персонажем фольклору по всьому світу. Але на Гаїті ця надприродна фігура справді існує, і велика армія використовує його ім’я, щоб вселити жах і страх у своїх ворогів. З верхівки до низу, ніхто не застрахований від зникнення, згвалтування чи публічного вбивства. На чолі цього всього стоїть одна людина: Франсуа Дювальє.\n\nДювальє, переживши всі виклики, що постали перед його правлінням, тепер міцно закріплює свій режим на гаїтянській землі. Його Партія національної єдності замінила мулатську еліту на таку, що ґрунтується на вірності. Його парамілітарне угруповання МВСН здійснює волю одного з найбільш тоталітарних режимів в історії Америки. Підтримуючи персоналістську державу, засновану на насильстві та містицизмі, Дювальє майже нездоланний, на шкоду всій нації, що живе в страху та тривозі."
HAI_La_Cantavecratie: "Кантавекратія"
HAI_La_Cantavecratie_desc: "Колись на Гаїті існувала правляча група мулатів, вибрана небагатьма, хто вважав себе кращими за інших через свою расу та народження. Вони зазнали поразки. Сьогодні є лише одна людина, яка приймає рішення, і тільки він знає, що насправді потрібно масам. Його ім’я Леон Кантав.\n\nСамовпевнена диктатура Кантава не потребує фальшивої, плеутократичної демократії. Головний акцент робиться на знищення комуністів, які руйнують структуру країни зсередини. Хоча він приймає допомогу від США, він не відповідає високим ідеалам Організації Свободних Націй, створюючи режим, що стає дедалі репресивнішим. Все це робить його головним болем для Вашингтона. Однак він обіцяв покласти край ППЛН, і він дотримується своїх слів, тому ОФН не має вибору, як залишити все на своїх місцях."

