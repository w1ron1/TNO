hispaniola_news.36.t: "[Get_newspaper_header] Франсуа Дювальє обраний Президентом Гаїті"
hispaniola_news.36.desc: "Франсуа Дювальє офіційно обраний президентом Гаїті на виборах 1964 року під платформою, орієнтованою на антикомунізм і чорний націоналізм. Повідомлення з країни свідчать про організоване насильство, залякування виборців та придушення голосування з боку гаїтянських солдатів та мілітарних прихильників Дювальє, деякі з яких нібито відмовляли людям у голосуванні або погрожували виборцям під дулом пістолета.\n\nХоча точна ситуація невідома, і обидві сторони, ймовірно, брали участь в електорних маніпуляціях, стало очевидно, що гаїтянська армія повністю підтримує президента Дювальє. Вони вже зробили кілька заяв на підтримку нового уряду і підтримали заперечення Дювальє щодо будь-яких виборчих порушень."
hispaniola_news.36.a: "Гаїті отримує нового сильного лідера."

hispaniola_news.37.t: "[Get_newspaper_header] Гаїтянський уряд повалений"
hispaniola_news.37.desc: "Сьогодні Порт-о-Пренс знаходиться під військовим правом. Хвороблива реакція уряду Гаїті на зростання комунізму на острові, спочатку соціалістична перемога в Домініканській Республіці, а потім в глибинці країни з ростом радикалізму Партії народного визволення Гаїті (НПНВ), змусила армію взяти справи в свої руки після вбивства президента Леско.\n\nПід керівництвом генерала Леона Кантавес, новий військовий уряд Гаїті пообіцяв стати оплотом антикомунізму і вже почав антисоціалістські репресії в основних містах країни, що викликало осуд з боку східного сусіда.\n\nПо всьому острову малюються лінії фронту."
hispaniola_news.37.a: "Дуже тривожно."

