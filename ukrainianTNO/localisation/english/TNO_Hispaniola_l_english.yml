hispaniola_news.47.t: "[Get_newspaper_header] Лавауд веде переговори про завершення громадянської війни" # Переговори
hispaniola_news.47.desc: "Разом з керівниками Партії народного визволення національного визволення (НПНВ), президент Франк Лавауд оголосив про завершення громадянської війни на Гаїті, що потрясла країну і вивела маленьку Карибську націю у стан насильства. НПНВ погодилася демілітаризувати свої сили та брати участь у виборах, які були оголошені незабаром після заяви.\n\nЦе оголошення призвело до святкувань по всьому Гаїті, багато хто з тих, хто приписує Лавауду заслугу в успішних переговорах про закінчення конфлікту. Завершення війни також може означати кінець НПНВ, яка вже почала розколюватися через внутрішні розбіжності та конкурентні амбіції. З лівим фронтом, що розділяється, здається, що переобрання Лавауда майже неминуче."
hispaniola_news.47.a: "Можливо, є надія для Гаїті?"

hispaniola_news.48.t: "[Get_newspaper_header] НПНВ запускає загальне повстання"
hispaniola_news.48.desc: "Повідомлення з Порт-о-Пренса вказують, що міста по всьому Гаїті перетворились на зони міської війни після того, як Партія народного визволення запустила повномасштабний наступ проти уряду Гаїті.\n\nХоча НПНВ вела низькоінтенсивну партизанську боротьбу проти уряду Гаїті протягом тривалого часу, це є першим випадком відкритої війни великого масштабу. Уряд Гаїті оголосив надзвичайний стан і мобілізував військові сили для припинення повстання.\n\nПопри запевнення уряду в перемозі, цілі регіони країни перетворились на зони війни."
hispaniola_news.48.a: "Революція прийшла на Гаїті."

hispaniola_news.49.t: "[Get_newspaper_header] Президент Луї Дежуа вбитий"
hispaniola_news.49.desc: "Порт-о-Пренс — місто під охороною. Вбивство президента Луї Дежуа агентом Партії народного визволення вивело уряд Гаїті в хаос. Гаїтянська армія вже вийшла на вулиці столиці, шукаючи підозрюваних та співучасників.\n\nКолишній президент Антуан Луї Леокарді Елі Леоскот був введений в уряд як наступник Дежуа. Оскільки країна переживає громадянську війну, тісні зв'язки президента Леоскота зі США та його жорстка політика під час буремних років Другої світової війни зробили його непопулярним і повертають гіркі спогади серед великої частини населення."
hispaniola_news.49.a: "Це, безумовно, тривожно."

hispaniola_news.50.t: "[Get_newspaper_header] Даніель Фіньоле обраний президентом Гаїті"
hispaniola_news.50.desc: "На перших демократичних виборах за десятиліття П’єр-Есташ Даніель Фіньоле був обраний президентом Гаїті після рішучої перемоги. Офіційні виборчі органи Гаїті формально підтвердили його перемогу, і Фіньоле вже почав збирати свій уряд і закладає основи для своєї програми.\n\nХоча Фіньоле підтримує ОФН, він чітко заявив, що США — і будь-яка інша іноземна держава — більше не зможуть примусити Гаїті діяти проти її інтересів. Він готовий працювати з Америкою як партнером, а не клієнтом, і відкритий для бізнес-інвестицій, щоб розвивати економіку Гаїті. Можливо, США залишатимуться основним партнером Гаїті, хоча він може спробувати диверсифікувати торгівлю з іншими країнами. Перемога Фіньоле на виборах вказує на набагато яскравіше майбутнє для Гаїті, яке, сподіваємося, буде супроводжуватися меншою американською інтерференцією."
hispaniola_news.50.a: "Гаїті відкриває нову сторінку."

hispaniola_news.51.t: "[Get_newspaper_header] Макс Гудікорт обраний президентом Гаїті"
hispaniola_news.51.desc: "На перших демократичних виборах за десятиліття Макс Гудікорт був обраний президентом Гаїті після чіткої перемоги. Прогресивний політик з Гаїті вже почав працювати над складанням свого уряду та підготовкою до впровадження амбітної лівої програми, яка може бути складною для реалізації.\n\nГудікорт може стати викликом для США та ОФН. Його соціалістичні нахили добре відомі, і його антипідприємницька позиція, ймовірно, уповільнить економічне зростання Гаїті та буде несприятливою для американських корпорацій. Погляди президента Гудікорта на ОФН, як мінімум, скептичні, а в гіршому випадку — підозрілі. Його риторика проти ОФН була різкою, але малоймовірно, що він виведе Гаїті з альянсу, якщо не буде вважати, що його погано ставлять через його симпатії."
hispaniola_news.51.a: "Гаїті рухається в незвідані, але спокійні води."

hispaniola_news.52.t: "[Get_newspaper_header] Франк Лавауд обраний президентом Гаїті"
hispaniola_news.52.desc: "На «перших по-справжньому демократичних виборах за десятиліття» Франк Лавауд був обраний президентом Гаїті з переконливою перемогою. Не дивно, що Лавауд здобув перемогу з таким рівнем підтримки, що міжнародні спостерігачі виразили сумнів щодо її чесності. Хоча майже напевно вибори Лавауда були легітимними в тому сенсі, що він здобув найбільший відсоток голосів, є серйозні докази того, що мали місце деякі форми маніпуляцій на виборах. Тим не менш, його перемога була прийнята більшістю гаїтян, хоча з причин стабільності, а не справжньої особистої підтримки.\n\nЛавауд налаштований позитивно до американських інвестицій у Гаїті, був голосним прихильником ОФН, і очікується, що він зберігатиме тісні робочі відносини з альянсом. Хоча в його президентстві, ймовірно, виникнуть проблеми, він зможе стабілізувати країну."
hispaniola_news.52.a: "Краще деякий прогрес, ніж жоден."

hispaniola_news.53.t: "[Get_newspaper_header] Перемога уряду на Гаїті"
hispaniola_news.53.desc: "Після років соціалістичного повстання на Гаїті, уряд, підтримуваний ОФН під керівництвом [HAI.GetLeader], нарешті переміг антиурядових повстанців. Завдяки мужності, рішучості, силі та підтримці США уряд Гаїті відстояв свою найбільшу екзистенційну загрозу з часів захоплення Гінша Домініканською Республікою. Як дим розсіюється, гаїтянське керівництво подякувало США за їхню підтримку та почало заходи для зміцнення свого правління та відновлення підтримки серед місцевого населення.\n\nОскільки Домініканська Республіка була найбільшим союзником НПНВ, хоча й не завжди навмисно, східна частина острова з побоюванням спостерігає за ситуацією. Тепер, коли одна нація, з якою вони ворогували, звільнилася від їхнього виснажливого повстання, і отримала сильнішу підтримку від ОФН, ніж будь-коли раніше."
hispaniola_news.53.a: "Америка не відпустить свій контроль так легко."

hispaniola_news.54.t: "[Get_newspaper_header] Повстання знищене на Гаїті"
hispaniola_news.54.desc: "Після років комуністичного повстання на Гаїті, уряд, підтримуваний ОФН під керівництвом [HAI.GetLeader], нарешті переміг антиурядових повстанців. Завдяки мужності, рішучості, силі та підтримці США уряд Гаїті відстояв свою найбільшу екзистенційну загрозу з часів захоплення Гінша Домініканською Республікою. Як дим розсіюється, гаїтянське керівництво подякувало США за їхню підтримку та почало заходи для зміцнення свого правління та відновлення підтримки серед місцевого населення.\n\nОскільки Домініканська Республіка була найбільшим союзником НПНВ, хоча й не завжди навмисно, східна частина острова з побоюванням спостерігає за ситуацією. Тепер, коли одна нація, з якою вони ворогували, звільнилася від їхнього виснажливого повстання, і отримала сильнішу підтримку від ОФН, ніж будь-коли раніше."
hispaniola_news.54.a: "Америка не відпустить свій контроль так легко."

hispaniola_news.55.t: "[Get_newspaper_header] Падіння Порт-о-Пренса"
hispaniola_news.55.desc: "Криза на Гаїті сьогодні, оскільки антиурядове комуністичне повстання НПНВ нарешті вдалося повалити уряд ОФН у Республіці Гаїті. Міліційні загони змусили останки урядових сил покинути Національний палац, і уряд Жака Стефана Алексіса проголосив повну перемогу над «корумпованою мулатократією, яка пригнічувала наш народ десятиліттями під виглядом свободи через ОФН». Плани нового уряду підтримати інші ліві групи в регіоні також тримають ОФН в напрузі.\n\nСША особливо висловили гнів і розчарування цією подією, вже наклавши ембарго на островну націю і заявивши, що працюють на шкоду новому революційному уряду. Хоча ОФН в цілому сказав мало на цей рахунок, зрозуміло, що це є певною поразкою для вільного світу."
hispaniola_news.55.a: "Наче фашистів було недостатньо..."
hispaniola_news.55.b: "Ще одна перемога для пригноблених народів світу."
hispaniola_news.55.c: "Шокуючі новини з Карибів."

hispaniola_news.56.t: "[Get_newspaper_header] Смерть Франсуа Дювальє"
hispaniola_news.56.desc: "Уряд Гаїті підтвердив повідомлення про смерть Франсуа Дювальє, відомого серед гаїтян як «Папа Док». \n\nХоча деталі смерті не були оприлюднені, раніше повідомлялося, що президент Дювальє був діагностований із діабетом і переніс серцевий напад. Спеціалісти припускають, що Дювальє пережив ще один серцевий напад, оскільки його погіршене здоров'я було добре відомо.\n\nПісля успішного прийняття конституційної поправки його син, Жан-Клод, відомий як «Бейбі Док», став президентом, і вже призначена офіційна церемонія. Поки що невідомо, як, якщо взагалі, новий президент Дювальє відрізнятиметься від свого батька в управлінні країною."
hispaniola_news.56.a: "Який батько, такий син?"

hispaniola_news.57.t: "[Get_newspaper_header] Франсуа Дювальє оголошений президентом Гаїті на все життя"
hispaniola_news.57.desc: "Президент Гаїті Дювальє оголосив про прийняття конституційного референдуму, який закріпив його як президента Гаїті на все життя, дозволив йому обрати наступника та надав абсолютну владу президенству. Це оголошення було зустрінуте численними звинуваченнями у шахрайстві, оскільки спостерігачі стверджують, що бюлетені були заздалегідь заповнені, працівники заявляють, що окремим людям дозволялося голосувати кілька разів, а виборці скаржаться на залякування. Президент Дювальє стверджував, що 99% населення проголосувало за референдум, що було відкинуто багатьма експертами.\n\nБагато хто не знає, що саме президент Дювальє зробить, коли його позиція буде забезпечена, але ясно, що на Гаїті народилася нова диктатура."
hispaniola_news.57.a: "Ще одне закріплення влади диктатора."

hispaniola_news.58.t: "[Get_newspaper_header] Кантаве консолідує владу на Гаїті"
hispaniola_news.58.desc: "Президент Гаїті Леон Кантаве оголосив про успіх конституційного референдуму, який закріпив його як президента на все життя, офіційно дозволив йому призначати наступника та надав абсолютну владу президенству. Президент Кантаве заявив, що результати референдуму підтвердили його мандат, хоча міжнародні спостерігачі відзначають численні звинувачення у пригніченні виборців та насильстві з боку сил безпеки держави, що адміністрація заперечує.\n\nСША та сусідні країни ще не випустили офіційних заяв, і наразі не зрозуміло, як це вплине на майбутні відносини. Тим не менш, усі згодні з тим, що на найближчий час позиція Кантаве є стабільною."
hispaniola_news.58.a: "Ще один диктатор у Порт-о-Пренсі."

hispaniola_news.59.t: "[Get_newspaper_header] Провал конституційного референдуму на Гаїті"
hispaniola_news.59.desc: "Після провалу конституційного референдуму президента Гаїті Леона Кантаве, який мав закріпити його як президента на все життя та надати президенству абсолютну владу, країна на деякий час потрапила в хаос. Попри спроби пригнічення виборців та залякування, гаїтянський народ об'єднався, щоб перемогти на референдумі, і продовжував протести проти уряду Кантаве навіть після його провалу, вимагаючи його відставки.\n\nЛише через кілька днів уряд погодився на вимоги, і гаїтянський парламент оголосив про відставку Кантаве з посади, призначивши на його місце Пола Маглуара. Він пообіцяв провести країну через цей складний період і забезпечити необхідну стабільність."
hispaniola_news.59.a: "Щось нове чи варіант старого?"

