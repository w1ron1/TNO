### Hispaniola ###
# Ideas
HIS_Hispaniola_War: "Гаїтянсько-Домініканський конфлікт"
HIS_Hispaniola_War_desc: "Гаїті та Домініканська Республіка переживали війни з часів здобуття незалежності обома країнами, що розташовані на острові Гаїті. Однак після завершення американської окупації ситуація здавалась стабільною: вибори Леско старшого, друга Трухільйо, можливо, ознаменували нову епоху миру між двома державами.\n\nАле ця ситуація довго не протрималась. Незабаром два диктатори почали конфліктувати, і з посиленням американського втручання в Гаїті напруга між обома країнами почала зростати. Часті сутички на кордонах завершилися тим, що більша й краще навчена домініканська армія порушила кордони, встановлені в 1936 році, і окупувала гаїтянські землі.\n\nГаїтянська армія, яка ледве контролює власну територію, охоплену партизанськими війнами, зазнала великої національної ганьби через вторгнення й окупацію. Це ще більше посилило кризу, в якій опинився уряд Гаїті. З ідеєю реваншизму, яка поширюється серед багатьох, нова війна на острові, схоже, лише питання часу."

PPI_civil_war: "Домініканська громадянська війна"
PPI_civil_war_desc: "Сучасний плачевний стан нашої Республіки яскраво демонструє, як найкращі зусилля й плани людства руйнуються перед лицем дурості та зради. Наших зусиль виявилося недостатньо, щоб забезпечити дипломатичне вирішення теперішнього хаосу, і тепер вся Кіскейя в крові.\n\nСьогодні від нас вимагається безжалісна рішучість. Це фінальне протистояння між старим порядком і новим, жорстокий час монстрів, з якого тільки одна фракція може вийти переможцем. Горе переможеним; до рук переможця перейде право визначати майбутнє Домініканської Республіки."

# Puerto Plata
HIS_well_supplied_army: "Міцні лінії постачання"
HIS_not_supplied_army: "Розвалені лінії постачання"

PPI_USAF_bombing: "Бомбардування ВПС США"
PPI_USAF_bombing_desc: "Американські військово-повітряні сили мобілізувалися на підтримку повстанців і вже завдають ударів по наших військах і лініях постачання відтоді, як Легіон висадився. Це лише питання часу, коли вони посилять свою кампанію. Ми маємо скористатися цією ситуацією, поки вона не погіршилась..."
PPI_USAF_bombing_2: "Посилені бомбардування ВПС США"
PPI_USAF_bombing_2_desc: "Американці поступово посилюють свою авіаційну кампанію проти нас, націлюючись на наші лінії постачання, укріплення та війська. Ми перебуваємо у невигідному становищі, але ми прорвемося та врятуємо нашу націю від янкі та їхніх поплічників."
PPI_USAF_bombing_3: "Максимально інтенсивні бомбардування ВПС США"
PPI_USAF_bombing_3_desc: "Американці довели свою авіаційну кампанію проти нас до максимальної інтенсивності, націлюючись на все, що потрапляє в їхнє поле зору. Нас чекає повне знищення, і ми можемо лише молитися і сподіватися, що нас не зітруть з лиця землі."

PPI_USN_support: "Берегові обстріли ВМС США"

