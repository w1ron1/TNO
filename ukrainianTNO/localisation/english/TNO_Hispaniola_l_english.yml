# Опис лідерів
POLITICS_ALBERTO_BAYO_DESC: "Це не перша війна Альберто Байо, і не перший конфлікт або боротьба, яку він бачив. Він народився в іспанській Кубі. Після цього він переїхав до Іспанії, де, коли фашисти напали, він чинив їм опір до самого кінця.\n\nМинуло два десятиліття з того часу, як Байо очолював невдалу операцію республіканців Іспанії на відновлення Майорки—хоча його люди спочатку мали успіх і твердо вірили у перемогу, націоналісти втрималися достатньо довго, щоб італійці втрутилися, і фашистська ось втягла республіканців назад, скорочуючи їх, коли вони втікали.\n\nЯк сталося занадто багато разів до того, Байо був осоромлений і позбавлений майже всіх своїх ролей, відправлений на задній план на весь період війни. Він оселився в Мексиці та ненадовго працював у мексиканській військовій академії, а потім жив бідним життям мебляра до того, як революціонери Ернесто Че Гевара та Фідель Кастро звернулися до нього.\n\nЦе був перший великий прорив Байо, справжній успіх. Навчаючи Гевару та Кастро партизанської тактики, він приєднався до них у висадці на Гранма і залишався з ними до того, як революція стала переможною—і його роль у цьому була важливою. Саме в цих обставинах старий революціонер, тепер генерал кубинської армії, повернувся до свого рідного краю.\n\nТепер на кону стоїть не Куба або Майорка, а Кіскея. Байо став мудрим з віком і навчився на своїх помилках. Але він не може позбутися страху, що він знову опиниться у ситуації, яка коштувала йому всього майже три десятиліття тому. Він не може—і не хоче—допустити таку ж помилку знову."
POLITICS_HORACIO_ORNES_DESC: "Гораціо Орнес пройшов великий шлях, дійсно великий шлях, від того пекла, через яке він пройшов у горах Сібао після катастрофи висадки Луперон у 1959 році.\n\nУ цих землях місцеві жителі були вороже налаштовані, і результати були рідкісними; однак міста виявилися ідеальними місцями для дисидентів, які вже були стомлені тиранією Трухільйо. Саме ці міста стали ідеальними місцями для закладки підґрунтя для повстання, яке тепер зруйнувало Трухільйо—але робота ще не закінчена, адже його пси досі знаходяться при владі в Санто-Домінго.\n\nМайже з самого свого народження у 1922 році в Пуерто-Платі, Орнес здавалося, був приречений боротися проти тиранії режиму. Спочатку він був дисидентом-юристом і письменником, потім емігрував, щоб допомогти викорінити тиранію у всіх її формах по всьому Карибському басейну. Але експедиція на Кайо Конфітес у 1947 році зазнала невдачі—те, що мало стати атакою на Трухільйо, замість цього призвело до бомбардування Куби та Гавани. Наступного року Карибський Легіон розділився на два, і молода охорона Фіделя Кастро сформувала Другий Легіон; Орнес змушений був приєднатися до них, і боротися в кубинських горах протягом шести років.\n\nТепер настав час для Орнеса здійснити те, заради чого він працював усе своє життя. Його мета, до якої він прагнув все це час, вже в межах досяжності, і він покладе все на карту в цій останній спробі."

# Ідеї
CAL_PPI_cosmopolitan_brotherhood: "Космополітичне Братерство"
CAL_PPI_cosmopolitan_brotherhood_desc: "У своїй основі Другий Карибський Легіон є волонтерською армією, яка залучає новобранців з усієї Америки. Вони борються з єдиною метою — знищити ракову пухлину фашизму, що поширилася по всьому регіону. Їх об'єднує глибоке братство, виковане в полум'ї їхнього досвіду боротьби з диктатурою, братство, яке виходить за межі національних кордонів.\n\nХоча це братство допомагає у конфлікті, широкий спектр потенційних новобранців може створювати певні труднощі у спілкуванні, оскільки розбіжності в культурних і мовних особливостях ускладнюють згуртованість і переклад наказів. Незважаючи на ці труднощі, Легіон не має проблем із підтримкою високого бойового духу, навіть за наявності деяких неефективностей."

CAL_PPI_rebels_of_fortune: "Повстанці Удачі"
CAL_PPI_rebels_of_fortune_desc: "Дехто бореться за славу, дехто за політику, а дехто за гроші та багатство. Легіон — це братство, об'єднане через національні та політичні поділи, як армія найманців. Але вони борються не за багатство, а за місію. Для них слава — це боротьба проти тиранії, їхня політика — це війна з автократами, їхня валюта — це відданість справі, а їхнє багатство — це Кариби, вільні від фашизму.\n\nА удача любить сміливих!"

CAL_PPI_Internal_Sectarianism: "Внутрішній Сектаризм"
CAL_PPI_Internal_Sectarianism_desc: "Теоретично, Легіон є аполітичною організацією, об'єднаною проти фашизму. На практиці ж широкий спектр політичних переконань окремих легіонерів створює певні тертя. Зокрема, численні комуністи, яких привабив Легіон, викликають значне занепокоєння щодо єдності армії у досягненні спільної мети.\n\nТільки час покаже, чи ці поділи будуть подолані або загострені."

CAL_Specialised_Training: "Спеціалізоване Навчання"
CAL_Specialised_Training_desc: "Мексиканський уряд значно інвестував у створення віддалених навчальних центрів для Карибського Легіону — подалі від цікавих очей. У свою чергу, суворі пустелі, високі гори та густі джунглі цієї країни стали неоціненною школою для Легіону. І, звісно, не менш важливими виявилися кілька кричущих інструкторів та група 'відставних' мексиканських морських піхотинців."

CAL_ceasefire_United_Front: "Єдиний Домініканський Фронт"
CAL_ceasefire_United_Front_desc: "У часи кризи завжди було так, що люди — а також інші, більш розумні істоти — схильні залишати осторонь розбіжності й працювати разом проти спільного ворога. Найочевиднішим прикладом цього в наші дні є Революційна Коаліція, створена після перевороту, що поклав край життю Тирана.\n\nСклад сил повстанців є численним і різноманітним. Часто трапляється, що ідеологічні розбіжності та особисті суперечності стоять між ними; однак у нас є важливіша мета, яка стерла всі ці перешкоди, — поховати спадщину Трухільйо у ямах історії."
CAL_ceasefire_Champions: "Чемпіони Антифашизму"
CAL_ceasefire_Champions_desc: "\"Бог на Небесах, Трухільйо — в шести футах під землею, Балагер — поруч із своїм босом; ¡Viva la Revolución!\"\n\nЦей крик оживляє чемпіонів антифашизму й антигітлеризму, які складають велику частину наших лав. Починаючи з Другого Карибського Легіону і долучаючи до себе ряди ліберальних і соціалістичних дисидентів Кіскеї, яких Тиран десятиліттями топтав під ногами, ми об'єднані метою й силою.\n\nНаша єдність проти слуг Гітлера, Муссоліні та Франко — це сила, необхідна для нашої справи; разом ми знищимо загрозу каудилізму назавжди!"

CAL_PPI_provide_intelligence: "Надання Розвідданих"

CAL_decreasing_morale: "Зниження Моралі Легіону"
