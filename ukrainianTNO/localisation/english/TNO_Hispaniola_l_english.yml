HAI_Professionalism_Army_1: "Армія міліції"

HAI_Occupation: "Вічна американська присутність"
HAI_Occupation_desc: "Хоча окупація Гаїті Сполученими Штатами формально завершилася в 1934 році, коли останні американські війська покинули країну того ж року, вплив окупанта не зник так швидко. США продовжували контролювати політику країни і надалі.\n\nДехто сподівався, що цей вплив з часом згасне, але поразка союзників у Другій світовій війні змінила плани Америки щодо цього регіону. Підтримавши уряд Леско Старшого в придушенні студентських та масових протестів, США знову активно втрутилися в політику Гаїті, забезпечуючи, щоб регіон залишався в їхній сфері впливу. Однак підтримка проамериканських олігархів призвела до того, що багато з них приєдналися до опозиційних груп, які тепер ведуть партизанську війну проти уряду з метою вигнати американців.\n\nЗ підсиленням партизанських рухів після успіху Кубинської революції уряд Гаїті став усе більшим тягарем для ОФН, який тепер покладається на «війська збереження порядку», щоб гарантувати хоча б якийсь контроль. І з обох сторін кожен ставить питання, як довго ще може тривати нескінчена окупація."
HAI_Renewed_Haitian_Sovereignty: "Відновлений гаїтянський суверенітет"
HAI_Renewed_Haitian_Sovereignty_desc: "З виведенням американських військ з Гаїті та вирішенням внутрішніх конфліктів країна знову змогла заявити про свій суверенітет у власних справах. Замість іноземних солдатів було створено невелике, але зростаюче військо під єдиним командуванням з Порт-о-Пренса, яке поступово трансформується у постійну армію, здатну забезпечити країні оборонну автономію на обозріме майбутнє.\n\nХоча багато інституційних проблем ще залишаються, ріст ринку та зміцнена самовизначеність вселяють надію у багатьох громадян, що ситуація хоча б потроху покращується."
HAI_Struggle_for_Sovereignty: "Боротьба за суверенітет"
HAI_Struggle_for_Sovereignty_desc: "Дювальє не підтримує американський вплив на Гаїті, але, з огляду на обставини та його перевагу м'якої американської сили над домініканською жорсткою силою, він поки що грає за правилами ОФН. Іноді його режим легко співпрацює, іноді намагається дистанціюватися від американської політики, а іноді взагалі не висловлюється. Це динамічні та мінливі стосунки.\n\nАле союз зручності — це ненадійна річ. Якщо Вашингтон не втрутиться в справи Гаїті належним чином, маленька країна може відокремитися або піддатися вторгненню. Звісно, таке втручання може викликати також руйнівний спротив з боку Порт-о-Пренса, якщо воно не буде контролюватися."

HAI_Noirisme_Socialism: "Привид Румея"
HAI_Noirisme_Socialism_desc: "Після десятиліть економічної та соціальної нерівності, коли мулатська аристократія домінувала у всіх аспектах держави, ідеї соціалізму та ноїризму стали глибоко укоріненими в свідомості чорного населення Гаїті. Однак, хоча ноїризм завжди домінував в ідеології опозиції, соціалісти, що підтримували партизанську боротьбу та надихалися Кубинською революцією, швидко здобули популярність та підтримку, що призвело до зіткнень між групами, які підтримували ці ідеї.\n\nОднак ці два рухи поступово знаходять спільний знаменник, де питання класової та расової ідентичності більше не є протилежними, а переплітаються між собою. Повернувши панафриканізм Жака Румея, що майже зник разом із його смертю в 1944 році, Жак-Стефан Алексіс та його Партія Народної Єдності тепер очолюють опозицію до уряду, виступаючи проти як американців, так і Трухільйо, здобуваючи велику популярність."
HAI_Rising_PPLN_Insurgency: "Зростаюча партизанська боротьба ППЛН"
HAI_Rising_PPLN_Insurgency_desc: "Після хаосу та кривавого конфлікту вторгнення в Пуерто-Плата, нестабільність поширилася на кордон з Домініканською Республікою через біженців. Це створило можливість для ППЛН, соціалістської повстанської організації, зміцнити свої сили та рішучість, що призвело до ситуації, коли уряд швидко наближається до конфронтації.\n\nЦя партизанська боротьба загрожує охопити Гаїті війною, якщо не буде вжито рішучих дій. Однак міжнародна спільнота мало вірить в здатність уряду ефективно реформувати країну чи протистояти повстанцям."
HAI_Protracted_Guerrilla_Campaign: "Тривала партизанська кампанія"
HAI_Protracted_Guerrilla_Campaign_desc: "Партизани мобілізувалися на сході та південному заході Гаїті, що призвело до ситуації, коли урядові війська більше не мають контролю над частинами сільської місцевості. Ситуація ще не переросла в громадянську війну, але числа повстанців зростають з кожним днем, оскільки ППЛН використовує невдоволення Порт-о-Пренса та антипівнічну налаштованість громадян.\n\nУряд готується до боротьби за виживання існуючого правлячого апарату, що, ймовірно, буде вирішено лише через насильницьке протистояння, будь-яким чином. Настав час просити міжнародну допомогу."

HAI_LUnite_Instable: "Нестабільна єдність"
HAI_LUnite_Instable_desc: "Важкі часи створюють дивні та неможливі політичні реалії, і жоден момент не є таким більш очевидним, ніж під час війни. З вторгненням Домініканської Республіки Гаїті знайшло себе в ситуації, коли внутрішня напруга перекидається у нову реальність, де прагматизм змушує різні політичні сили заморозити свої розбіжності, аби разом боротися з окупацією. Цей «єдиний фронт» поєднує олігархічний естеблішмент, реформістів та ППЛН в боротьбі проти легіонів Трухільйо.\n\nХоча багато хто вважає, що це можливість для Гаїті подолати свою жахливу нестабільність, історія дає мало підстав для оптимізму у країні, що охоплена внутрішніми поділами, навіть якщо їм вдасться перемогти в нинішньому конфлікті."
HAI_La_Renaissance_dHaiti: "Відродження Гаїті"
HAI_La_Renaissance_dHaiti_desc: "Незважаючи на песимістичний погляд міжнародної спільноти, кровопролиття та руйнування війни, а також внутрішні поділи, які колись здавались непереборними, Гаїті вийшло з вторгнення Домініканської Республіки відновленим. «Єдиний фронт» між естеблішментом, реформістами та ППЛН витримав, і хоча жодна з політичних сил не задоволена повністю, жодна з них більше не бажає піднімати зброю проти своїх співгромадян.\n\nОбачність панує, оскільки на Гаїті пробують багатоетнічну демократію, у країні, що звикла до домінування расових напружень, цей період можна назвати експериментальним. Попри корупцію, що залишається проблемою, економічний ріст та новоутворений доступ до урядових структур вселяють надію в народ, що найгірше, можливо, вже позаду."

HAI_Haitian_Social_Revolution: "Гаїтська соціальна революція"
HAI_Haitian_Social_Revolution_desc: "Перенаправити соціальні сили від руйнівного расового конфлікту до загоєння ран, які він залишив, — завдання не з легких. Гаїті під новим соціалістичним режимом намагається започаткувати нову еру рівності та гармонії, об'єднуючи расово різноманітний робочий клас проти того, що залишилось від капіталізму в їхній країні. Ці спроби дали змішані результати; ці рани занадто глибокі, щоб зникнути так швидко. Але якщо вони досягнуть успіху, то мрії Лувертюра, Дессаліна і Петіона нарешті стануть реальністю."
HAI_LArmee_Rouge_dHaiti: "Червона армія Гаїті"
HAI_LArmee_Rouge_dHaiti_desc: "З успіхом революції ППЛН розпочинається процес реформування військової сили Гаїті; відсутність миротворців США, що підтримували нашу оборону, змушує нас відновлювати наші війська з нуля. Тренування від домініканських комуністичних партизан і кубинських партизанських бійців активно допомагають у цьому зусиллі, і хоча дух гаїтянських борців за свободу має бути увічнений, знадобиться певний час, перш ніж Гаїті зможе перейти від розрізнених міліцій до повністю професіоналізованої армії."
HAI_Socialist_Economy: "Соціалістична економіка"
HAI_Socialist_Economy_desc: "Гаїтянський уряд нещодавно спрямував свої зусилля на створення нової економіки, побудованої на ідеях, що панували в країні за часів правління PRH. Добра новина: основні товари стали набагато дешевшими, а економічна діяльність зосереджена на підвищенні добробуту всього гаїтянського суспільства. Погана новина: обмеження експорту обмежує доходи, а відсутність індустріалізації заважає продуктивним можливостям країни. Це характерні проблеми ранньої соціалістичної економіки, з яких Гаїті намагається вибратися."
HAI_Exiles_and_Enemies: "Екзили та вороги"
HAI_Exiles_and_Enemies_desc: "Навіть після того, як народ Гаїті переміг сили імперіалізму, противники нового режиму в Порт-о-Пренсі, здається, безкінечні; від проамериканських решток останнього режиму до крайніх правих націоналістів Дювальє. Але на цьому все не закінчується; обмежене визнання нового уряду, безсумнівно підкріплене спільними американськими/ОФН осудженнями, залишило Гаїті все з меншим числом союзників, що контрастують з її постійно зростаючим списком ворогів, що робить боротьбу за легітимність у Карибському басейні справді важким завданням."

# Decision Flavor
HIS_HAI_decision.1.t: "Зв'язки, що об'єднують"
HIS_HAI_decision.1.desc: "Не все можна було доставити – або морем, або авіацією – в глибину Гаїті, зважаючи на географічну близькість Америки до Гаїті.\n\nПеревезення, звісно, обмежувалося прибережними містами, і не було аеродромів, що підходять для швидкої доставки вантажів у глибину гаїтянських гір. Для громад і передових баз глибоко в горах Гаїті портфелі та мулі все ще виконували свою роботу, яку вони виконували століттями, з'єднуючи ізольовані форпости за допомогою крові, поту та праці.\n\nТому залишалося лише одне знаряддя для поліпшення інфраструктури острова: залізниці. Американська окупація на початку століття залишила в країні неповний мережевий залізничний шлях. Багато рейок викривилися від спеки, їхні сполучні балки прогнили після десятиліть незастосування, а мережа була далеко від достатньої для задоволення попиту.\n\nАле робота була достатньо простою. Залізничні колії та балку можна було відновити за допомогою важкої праці та простих імпортів сталі, і, якщо не бути прискіпливим щодо електрифікації або дизельних двигунів, паровий двигун можна було привести в дію за допомогою деревного вугілля. Відновлені колії, що тягнуться від Леогану до Веретт через Порт-о-Пренс, могли довести постачання до частини внутрішньої території, з якої вдячні портфелі та мулі могли здійснювати кілька постачань до кінцевої точки.\n\nУ цій роботі не було нічого яскравого або розкішного – укладання рейок, ремонт колій, обслуговування депо – але вона виконувала свою справу."
HIS_HAI_decision.1.a: "Іноді старі методи найкращі."

HIS_HAI_decision.2.t: "Більше, ніж просто фарба"
HIS_HAI_decision.2.desc: "Грубе приземлення на Bowen Field було, зрештою, гарним вказівником того, що чекає на оглядові підрозділи OFN, коли вони почали інспекцію авіаційного корпусу Гаїті.\n\nВсієї довжини злітно-посадкова смуга була тріснута, а ремонтні бригади не прикладали реальних зусиль, щоб замостити покриття на краях, що було вкрите кратерами. Після того, як військовий літак C-130 від США прибув, з'ясувалося, що для літака немає доступного ангару — і це в буквальному сенсі, адже поряд була лише гнилі, діряві конструкції з оцинкованої сталі поруч із занедбаною вежою управління.\n\nПерсонал США здійснив обхід, дивуючись, коли з'ясували, що кілька P-51 Mustangs не були накриті захисними покриттями для захисту від елементів. Декілька з них зберігалися в робочому стані, хоча мало хто був готовий ставити на них своє життя; інші ж були оболонками самих себе, які давно були розібрані на частини.\n\nУ будівлі командування аеродрому посібники та навчальні матеріали були покриті пилом і цвіллю, вийшли з друку майже два десятиліття тому і були майже не використані з того часу. Те, що залишилося з пілотів, замість польотів, використовувалося для миття підлоги та забезпечення "безпеки" на базі для відсутнього командира, який не з'являвся майже тиждень."
HIS_HAI_decision.2.a: "Повітряні сили треба буде відновлювати з нуля."

HIS_HAI_decision.3.t: "Спалити їх, зламати їх"
HIS_HAI_decision.3.desc: "\"Дуглас, знаєш, що ми сьогодні веземо?\" — запитав О'Харріс у свого другого пілота, перевіряючи прилади на C-130.\n\n\"Залежить, О'Харріс, що таке 'дефоліант'? Здається, Тері везе напалм на південь, але я поняття не маю, що це за штука\", — відповів Дуглас, сидячи поруч з О'Харрісом у кріслі пілота. О'Харріс відчув, як в його пам'яті виникає слабка згадка, потім клацнув пальцями, коли зрозумів термін.\n\n\"А-а, дефоліанти, це те, з чим працював мій батько, коли був садівником; це хімікати, які розпилюють на рослини, щоб їх вбити. Та штука працює дуже швидко, одного його друга один раз вдихнув це, і його перевірили. Він був в порядку, але в майбутньому у нього виникли проблеми з кістками. Чому, думаєш, ми веземо дефоліанти гаїтянам?\" — запитав О'Харріс риторично.\n\n\"Ну, це і напалм.\" — відповів Дуглас. \"Здається, ми нарешті даємо нашим хлопцям шанс на боротьбу.\"\n\nПідйом і перші хвилини польоту пройшли без пригод. Повітря між О'Харрісом і Дугласом було спокійним, як зазвичай, але обидва могли відчути, що вони трохи занепокоєні.\n\n\"Гей, Дуглас?\" — сказав О'Харріс, — \"Не переживай. Ці штуки не зможуть завдати шкоди занадто багатьом людям.\""
HIS_HAI_decision.3.a: "\"Просто садівничі інструменти. Обіцяю.\""

HIS_HAI_decision.4.t: "Абуломанія"
HIS_HAI_decision.4.desc: "Джеррі та Карл поділилися сигаретою, спостерігаючи за млявими світлами промислового району в нічному місті з комфортного салону їхнього автомобіля. Важко було це назвати святом, але Джеррі та Карл могли лише радіти хорошим новинам за останні роки. Джеррі зробив ще один подих, і Карл витягнув маленьку пляшку горілки зі свого кишені.\n\n\"Знаєш, що мені зараз потрібно, Джеррі?\" — запитав Карл, вже намагаючись налаштувати радіо.\n\n\"Чорт, Карле, якщо ти знову включиш якусь цю тупу музику, я викину це через вікно, — відповів Джеррі, але його слова були перервані останніми нотами пізньої джазової сесії. Знайома голос ведучого радіо прозвучала, змушуючи Джеррі та Карла відкинутися назад і розслабитись.\n\n\"Вітаємо вас, дорогі слухачі, і мені тільки що передали жахливий лист від мого друга з Пентагону.\" Джеррі і Карл зупинили всі свої дії.\n\n\"Здається, що після того, як гаїтянський режим почав слабшати під натиском народного повстання ППЛН після того, як США вийшли... президент почав відправляти частини армії назад на Гаїті. Америка повертається на Гаїті\", — сказав голос.\n\n\"Вони не можуть цього зробити! Скільки ми ще будемо протестувати?!\" — закричав Карл. Ведучий знову встав в ефір.\n\n\"Так, ми маємо підтвердження, що Америка 'поверне кілька військових елементів на Гаїті у зв'язку з ескалацією комуністичних повстанців.' Не треба вам розповідати, друзі, що це абсолютна брехня! Я кажу, в цю суботу всі збираємося разом і покажемо цим проклятим аристократам, що ми зупинили їх раніше, і зупинимо знову! І щось мені підказує, що наші ряди точно не зменшуються, можу вам це сказати!\""
HIS_HAI_decision.4.a: "Карл подумав про балон фарби в багажнику."

HIS_HAI_decision.5.t: "Минуло МАХ-Швидкість"
HIS_HAI_decision.5.desc: "Деякі американські військові на Гаїті літали на спостережних літаках, інші консультували війська Гаїтянських Збройних Сил, але більшість, як майор ВПС Ісак Гансон, займалися паперовою роботою. Він уже майже рік займався документацією на Гаїті в Оперативній групі ВПС і пройшов шлях від заповнення документів в офісі до їх доставки в польових умовах. Зазвичай він подорожував між Порт-о-Пренсом і обласними центрами, але сьогоднішні накази були особливими; зростаюче американське зобов'язання на Гаїті вимагало централізованого командування, тому ОГВПС було розформовано. На його місце прийшла Військова допомога, Гаїті, про існування якої майор Гансон тепер мав повідомити.\n\nСправжня мета MACH залишалася незрозумілою для Гансона, і його цікавість взяла верх під час поїздки на човні до острова Гонаве. З цигаркою і пляшкою коли в одній руці і секретними документами в іншій, Гансон дізнався, що новий міжвідомчий командний пункт має плани з розширення американської присутності на всьому Гаїті, навіть на острові Гонаве. Після того як він закінчив з файлом і виснажив можливості рахувати хмари, його човен причалив до Магазину. Майор Гансон виявив, що американське консульство і військовий аташе знаходяться в занедбаному готелі, далеко не в тому місці, яке мало стати майбутнім центром операцій MACH на Гонаве.\n\nВсередині були пилові портрети Естеса Кефауера на стінах, згаслі недопалки сигарет у тріснутих столах і група нудьгуючих чоловіків, що грали в карти на напої. \"Лейтенант Сойєр? Сойєр?\" — голосно вимовив Гансон у лобі, де чоловіки різко припинили розмови. Після паузи один із них зображував увагу, що викликало кілька сміхів, перш ніж він повернувся: \"Сойєр. Що там?\" Після того як Гансон представився як майор Гансон з нової об'єднаної Військової допомоги, чоловіки звернули на нього більше уваги. Гансон повідомив їм про майбутні зміни на їхній ізольованій станції, зокрема про прибуття трьохсот осіб, що мають відновити споруди епохи окупації для щоденного використання. Чоловіки були збентежені, шоковані тим, що їхнє безтурботне призначення раптово стало серйозним, і Сойєр благав Гансона про допомогу. Натомість майор просто відмовив його."
HIS_HAI_decision.5.a: "\"У мене є справи.\""

HIS_HAI_decision.6.t: "Політ Драконячої Леді"
HIS_HAI_decision.6.desc: "На висоті служби в 75 000 футів, практично весь острів Гаїті перебуває в полі зору Артура Лезервууд. Острів із зеленими просторами і понад 7 мільйонів мешканців, все це можна побачити з кабіни літака U2.\n\nХоча більшість тільки мріє наблизитися до космосу, для нього це лише одна з багатьох розвідувальних місій, які почалися нещодавно за наказом ФБР. Щоб захопити фотографії військових баз, важливих урядових будівель, великих рухів військ або будь-яких інших місць, куди їх відправляло бюро, Артур користувався камерою моделі Hycon B, передовою технологією, що дозволяє отримувати роздільну здатність до 2 футів, навіть на висоті понад 14 миль.\n\nПілоти, як він, виконують вильоти щодня, надаючи нашим гаїтянським союзникам безпрецедентну розвідку про стан домініканських військових частин, даючи їм елемент несподіванки та допомагаючи їм у боротьбі проти тиранічного режиму Санто-Домінго."
HIS_HAI_decision.6.a: "Там, мабуть, дуже самотньо."

HIS_HAI_decision.7.t: "Перерва в післяобідній час"
HIS_HAI_decision.7.desc: "Затишно розташоване в горах півострова Тібурон, маленьке село Аннет давно вважалося безпечним притулком, захованим від постійної війни, що охопила країну під час громадянської війни, кровопролиття так і не дісталося до дверей його мешканців. Однак одного післяобіднього часу виявилося достатньо, щоб зруйнувати цю ілюзію.\n\nПроти ясного оранжевого неба з'явилося понад десяток гелікоптерів, їхні металеві лопаті злилися у какофонію машинного шуму та ротарного безумства. Коли вони зависли над центром села та почали спускатися, партизани, що базувалися тут, сховалися та забарикадувалися у своїх будинках разом з родинами, тоді як багато жителів зібралися зовні, протестуючи, вимагаючи, щоб солдати залишили їх у спокої.\n\nАмериканські солдати вийшли з гелікоптерів і почали обшук будинок за будинком. Ті, хто намагався чинити опір, швидко зрозуміли, що вони явно не готові, і більшість не надавала жодного опору. Ті, хто забарикадувалися, побачили, як їхні будинки спалюють, вбиваючи партизанів і будь-яку іншу нещасну душу, яка опинилася всередині. До того часу, як вони пішли, половина села горіла, а кожен мешканець залишився з жахливими спогадами на все життя."
HIS_HAI_decision.7.a: "Полум'я замінило захід сонця."

HIS_HAI_decision.8.t: "Фольклор, фантазії та поразка"
HIS_HAI_decision.8.desc: "ФБР спеціальний агент Едвард Лансдейл дивився на стіл, оточений засмученими колегами в халатах, що тримали скальпелі та пилки, і кивнув головою в знак схвалення. Перед ним лежав труп одного нещасного колишнього гаїтянського партизана, захопленого, коли він заблукав занадто далеко від табору. Його було перетворено на невпізнану абомінацію з кігтями і шерстю, спотворену спробу відтворити легендарного Луп-Гару, духа людини-вовка, що пожирає все на своєму шляху, особливо дітей.\n\nЦе остання спроба з багатьох, що були здійснені в рамках нової, підвищеної психологічної кампанії ФБР, що проводиться по всьому Гаїті. Використовуючи пропаганду під чужим прапором, яка стверджує, що комуністи нападають на селян у сільській місцевості та вдаючись до уявлень про Вуду, Лансдейл викликав невдоволення своїх колег як в бюро, так і особливо з боку союзного гаїтянського уряду, через екстра-юридичні страти полонених для використання як погано продуманого культурного апропріації, що перейшло межу.\n\nКампанія мала змішані результати, намагаючись використати місцеві легенди, її ігнорувала більшість, хоча вона вплинула на найбільш суеверних партизанів. Однак, Едвард Лансдейл не зневіряється через ці невдачі і наполягає на тому, що він на порозі прориву в новій психологічній війні."
HIS_HAI_decision.8.a: ""Мати "крайнощі", але за яку ціну?""

HIS_HAI_decision.9.t: "Передавання речей"
HIS_HAI_decision.9.desc: "Двір казарми був майже безмовним, коли офіцери та солдати з нетерпінням оточили ящик, привезений із Порт-о-Пренса, прямо з американських військових резервів. Нарешті, гаїтянський батальйон отримав необхідні гвинтівки, гранати та боєприпаси прямо від Дядька Сема. Однак, коли вони почали оглядати зброю, на чоловіків накотився відчуття гіркоти.\n\n\"Цей мотлох, мабуть, служив ще під час їхнього першого захоплення наших дуп 50 років тому\", — зауважив офіцер, вивчаючи пилову стару гвинтівку М1903 Springfield. Вийнявши її з коробки та зарядивши рідкісним магазином, він прицілився в ціль і натиснув на спуск. Чутно було гучний КЛІК, після якого військові зітхнули. Зброя застрягла.\n\n\"Виглядає так, що нам є над чим попрацювати.\" Офіцер показав на зброю, щоб її роздали солдатам. \"Хочу, щоб ви зробили інвентаризацію всього, що ми отримали від американців — дізнайтесь, що працює, а що потребує ремонту.\"\n\nВ кінцевому підсумку майже 30% отриманої зброї потребували ремонту, від застряглих гвинтівок до відсутніх частин."
HIS_HAI_decision.9.a: "Краще, ніж нічого."

HIS_HAI_decision.10.t: "Свіжа асфальтова доріжка"
HIS_HAI_decision.10.desc: "\"Це, мабуть, все.\"\n\nОфіцер ВПС США зробив останні зауваження, і після міцного рукостискання угода була на крок ближче до завершення. Аеродром офіційно передаватиметься збройним силам Гаїті, і в наступні дні очікуються вильоти з цієї бази.\n\nПроцес, що включав навчання з технічного обслуговування, передачу управління повітряним рухом, передачу обладнання та акліматизацію пілотів, зайняв лише кілька днів — вражаючий термін з огляду на транспортування всього персоналу та обладнання назад до США. Тепер це будуть гаїтянські льотчики, що вилітають звідси, що є свідченням зростаючої довіри та співпраці між нашими збройними силами та підвищення здатності ВПС Гаїті, результат нашої безперервної підтримки.\n\n\"Все, що мені тепер потрібно, це підпис тут.\" Офіцер показав на низ документа, потім передав його своєму гаїтянському колезі."
HIS_HAI_decision.10.a: "\"Дякую.\""

HIS_HAI_decision.11.t: "Мир на Гаїті, поки що"
HIS_HAI_decision.11.desc: "Поки делегати обмінюються рукостисканнями, а генерали отримують дзвінки, остаточний мирний договір, нарешті, укладено. Америка буде дотримуватись узгоджених умов, і тисячі військових, обладнання та кораблів почнуть довгу подорож додому.\n\nХоча публічно це оголошено дипломатичною перемогою, американці як у уряді, так і вдома розуміють, що переговори ніколи не були кінцевою метою втручання на Гаїті, і деякі ставлять під сумнів наші цілі в цьому конфлікті.\n\nПроте, незважаючи на умови, накладені переговорами, більшість просто раді, що таке досягнення взагалі відбулося, припиняючи кровопролиття для всіх учасників, якщо навіть тимчасово. Вплив цього на внутрішню ситуацію ще належить побачити, оскільки багато хто розділяється в думках, чи варто було це всіх втрат і витрат."
HIS_HAI_decision.11.a: "Нарешті мир."
# Weariness Events
HIS_HAI_decision.12.t: "Парад"
HIS_HAI_decision.12.desc: "Вони спускалися по Parade Place і вийшли на Ocean Avenue. Дехто грав музичні композиції, коли проривалися через Бруклін, співаючи гаїтянські народні пісні та танцюючи під ритм конга-барабанів. Інші несли саморобні банери з написами на кшталт: \"Élections libres en Haïti maintenant!\" або \"Lanmò opresè kapitalis yo!\"\n\nТам були сині та червоні прапори та червоно-чорні. Була хрестика та молотка з серпом. Були фотографії загиблих солдатів та плакати, що закликали до миру. Люди сміялися, плакали, танцювали та співали в яскравих костюмах, які вони врятували з рідної землі. Множина голосів лунала через вулиці, коли люди спостерігали з вікон і пожежних сходів.\n\nКоротше кажучи, парад був всім Гаїті. Хоча вони не погоджувалися щодо того, яким буде майбутнє їхньої батьківщини, громада емігрантів і вигнанців Нью-Йорка була рішуче налаштована не дозволити місту забути про насильство, що розгортається на півдні. Америка мала відповідальність, обов'язок піклуватися. Адже все, що вона зробила для того, щоб поранити першу вільну чорну республіку, найменше, що бланам могли б зробити, це вислухати їхні крики."
HIS_HAI_decision.12.a: "Багато людей, що кричать одним голосом."

HIS_HAI_decision.13.t: "Кіноніч в Берклі"
HIS_HAI_decision.13.desc: "\"То це називається 'Факел демократії'? Чому вони так це назвали?\" — запитав Річард. Комітет UC Berkley з опозиції до втручання на Гаїті був лише останнім з того, що багато консерваторів почали називати «антиамериканськими установами», хоча «CHIO» був лише невеликою групою антивоєнних студентів, які ще намагалися розповсюджувати плакати по кампусу. Ідея антивоєнного документального фільму могла бути користю для них, якщо б вони поширили інформацію про покази фільму.\n\n\"Звісно, 'Факел демократії' — тому що постер фільму містить фото, яке зробив фотограф TIME минулого місяця, на якому гаїтяни спалюють село. Це абсолютно антиурядова пропаганда\", — підтвердила Амелія. Інші члени CHIO — всі 12 — слухали, але були невпевнені.\n\n\"Амеліє,\" — почав Річард, — \"останній кінотеатр, де показували цей фільм, мав про-воєнні протести перед входом, і це зупинило більшість людей від того, щоб увійти, і-\"\n\n\"Але це було в Толедо, не в Берклі. Тут люди відкриті до нових ідей, вони хоча б подивляться його, перш ніж погрожувати підпалом, а до того часу вони точно зрозуміють, що це не тільки сонце і веселка. Люди гинуть, Річарде, вони повинні це дізнатися!\" — сказала Амелія, в той час як деякі з активістів почали кивати. Річард трохи посмикався.\n\n\"Я маю на увазі, ми не можемо насправді отримати дозволи на це, чи не так? Їм це точно не дозволять.\"\n\n\"Річарде, це наш перший шанс за деякий час поширити інформацію. Люди починають хвилюватися, що це може стати кошмаром для OFN, і хто турбується, якщо люди протестують фільм? Принаймні вони будуть змушені його обдумати, перш ніж створювати плакати,\" — сказала Амелія, і більшість з активістів виглядала вже погодженою. Річард зітхнув."
HIS_HAI_decision.13.a: "\"У нас є один шанс. Не зіпсуй це.\""

HIS_HAI_decision.14.t: "Помічні руки"
HIS_HAI_decision.14.desc: "Старий, побитий вантажівка загальмувала і зупинилася, коли решта вантажівок і машин в їхньому конвої припаркувалися на півдорозі через гаїтянське село. Обережно виходячи з водійського та пасажирського місць, Марк Мейсон підійшов до передньої частини конвою, де решта водіїв-волонтерів почали оточувати лідера, який організовував їхню групу протягом останніх кількох місяців, оскільки деякі з місцевих жителів села почали виходити зі своїх будинків, щоб розглянути зовнішню процесію вантажівок з постачанням. Посеред півкола водіїв лідер волонтерів махав усім до себе.\n\n"Чудово, так, вантажівки з другого по дев'ятий розподіляють товари тут, потім чекайте на місці, поки наш конвой не повернеться сюди. Будьте добрі до місцевих, а перекладачі все пояснять, ви просто носіть коробки. Зрозуміло?" Ніхто не відповів. "Чудово. Інші вантажівки, за мною." І ось решта вантажівок поїхали, залишивши Марка з десятком або більше допомогових працівників, всі абсолютно дезорієнтовані або вже починали працювати. Через мить короткий гаїтянин підійшов і почав кричати, щоб усі почали вивантажувати коробки в центр міста. Коли всі почали повертатися до своїх вантажівок, Марк помітив, як гаїтянин підійшов до місцевого гаїтянського поліцейського і поговорив з ним.\n\nЧерез кілька годин важкої праці Марк відчув, що готовий закінчити на сьогодні, хоча був лише південь. Хоча Марк був там уже кілька тижнів і звик до важкої праці, він все одно втомлювався під безжальним карибським сонцем і періодичними криками гаїтянина. Марк був готовий попросити перерву і підійшов до короткого гаїтянина.\n\n"Що ти маєш на увазі, перерва?!" — закричав він. "Перерва?! Ти прийшов сюди працювати — будеш працювати, moun sòt!" Марк відступив і почав повертатися до свого вантажівки. Поглянувши через плече, він помітив, як офіцер передає короткому гаїтянину конверт."
HIS_HAI_decision.14.a: "'Збереження демократії'? Моя пізня."

HIS_HAI_decision.15.t: "Марш за Гаїті"
HIS_HAI_decision.15.desc: "Річард спостерігав за безліччю студентів і громадян, які маршували через район Місії в Сан-Франциско, і відчував гордість. Крики протесту за виведення Америки з Гаїті, плакати та інтерв'ю з медіа показували всьому світу, як люди хочуть, щоб Америка пішла, майже так само, як і гаїтяни. Що найбільше здивувало Річарда, так це розмір натовпу. Навіть до того, як він став частиною CHIO, Річард знав, як підрахувати кількість людей у натовпі, і цей натовп складав не менше 10 000. Спустившись з пам'ятника, Річард прокрався через натовп біля великих фігур на сходах міської ратуші, інтерв'ю, вимоги через гучномовець, намагаючись знайти Амелію.\n\n"...Що ж, для мене і більшості інших чорних солдатів, ці соціалісти менше зробили проти мене і людей, подібних до мене, ніж більшість білих американців, я не боюся, що гаїтяни будуть вішати..."\n\n"...До чорта з війною! До чорта з їхнім імперіалізмом! Якщо ці бізнесмени та їхні підлабузники думають..."\n\n"...Брат зараз воює на Гаїті, і він не мав пекельного вибору! Вони думають, що можуть нас потягнути..."\n\n"...А тепер цей маленький с***ець загубився! Почекай, чорт... Річарде!" — Річард впізнав голос.\n\n"Ласкаво просимо на вечірку, Амеліє! Віриш, ми все це змогли зробити самі?!" — закричав він, захоплено.\n\n"Річарде, половина цих хлопців з UCSF. Крім того, у нас є серйозніші проблеми. СФПД вже на підході, нам потрібно розчистити ці люди.\n\n"Ні, чорт забирай, Амеліє — навіть якби ми й хотіли. Ми не йдемо. Не можемо і не підемо. Мені байдуже, якщо нас газуватимуть і бити, ми залишаємося. Гаїтяни вже стікають кров'ю. Ми їм повинні."
HIS_HAI_decision.15.a: "Військові марширували так само."

HIS_HAI_decision.16.t: "Біг від американців"
HIS_HAI_decision.16.desc: "Річард біг по темних вулицях Лос-Анджелеса, прикриваючи око однією рукою. Протест, технічно, був успіхом, адже там дійсно було десятки тисяч людей — хоча контрпротестуючі на підтримку війни абсолютно мали поліцію на своїй стороні. Якби поліцейські просто не втручалися, CHIO мала б гарний шанс виграти в цій боротьбі. Потрапивши під бінбег у око, Річард почав сумніватися у своїй позиції у цьому конфлікті. Доїжджаючи до, здавалося б, порожнього провулка, Річард дозволив руці відірватися від обличчя, і навіть у місячному світлі він міг бачити, що це не сльози, які текли з його ока, а частини його самого. Річард відчув, як починає задихатися. З кута провулка, з-за сміттєвого баку, з'явився бомж.\n\n"Ох-" Річард здивовано прошепотів, "чорт, вибач. Ти хочеш, щоб я пішов?" — запитав він. Бомж, здається, налаштовував свої очі на ніч, і почав посміхатися.\n\n"Чорт, хлопче, тобі потрібна допомога. Думаю, я знаю одного чувака..." — сказав бомж із сміхом і попрямував на вулицю. Річард розумів, що не повинен йти за ним. Після майже півгодини прогулянки в найгіршу частину Лос-Анджелеса, бомж привів Річарда до складу з димарями, що піднімалися з отворів у даху. Зайшовши всередину, здалося, що це ціле містечко, де люди розмовляли або пили. Бомж підійшов до групи людей, що лежали на койках, всі стогнали від болю.\n\n"Добре, чувак, це доктор Марк Мейсон, він тобі допоможе. Марк?" — запитав бомж, "Привів тобі ще одного революціонера! Сідайте, хлопче."\n\nТой, кого називали "доктором", абсолютно не був випускником, судячи з того, що Річард міг розпізнати, але він виглядав достатньо розумним. Оглядаючи навколо, Річард зрозумів, що всі навколо носили на своїх одягах антивоєнні символи, якщо не на пов'язках, що перетворилися на турнікет. Річард зітхнув."
HIS_HAI_decision.16.a: "Жертви другої війни. Ті, що на боці американського народу."

HIS_HAI_decision.17.t: "Поляризація"
HIS_HAI_decision.17.desc: "Гаїтянська війна. Здавалося, що ця тема не покидає обговорення. Студенти на кампусах жартували про те, як їх призначать на службу. Бізнесмени скаржилися, що їм доводиться платити податки за це. Державні законодавці обмірковували, скільки пільг потрібно буде виплачувати після цього. Було відчуття, що це поглинає національну дискусію, захоплюючи її. У кожного була думка, але ці думки все більше ділилися на дві протилежні.\n\nДля тих, хто підтримував президента, війна була, звісно, благородною справою. Хоча ніхто не підтримував останнє вторгнення США на Гаїті (для тих, хто пам'ятає, залишалося неприємне враження від цього бізнесу), нинішнє втручання було необхідним, навіть патріотичним. Сполучені Штати робили світ безпечнішим для демократії, свободи та волі для всіх народів. Це був їхній обов'язок перед світом. Ті, хто вказував на насильство, зростаючу злість і маніпуляції США, були оманутими або брехливими.\n\nДля тих, хто був проти президента — це була різноманітна група державних партій і активістів — війна ставала все більш безглуздою та несправедливою. Незалежно від того, чи мали Сполучені Штати хороші наміри (якщо вони взагалі їх мали), вони давно знищили все добрі справи своїми власними діями. Сполучені Штати знищували життя гаїтян, казали одні. Сполучені Штати різали своїх власних хлопців, говорили інші. Консервативні активісти запитували, хто буде оплачувати витрати на втручання, а ліберальні активісти скаржилися на порушення прав людини та зростаючі чутки про жорстокість по той бік Карибського моря.\n\nТак чи інакше, війна поглинала все. Державні партії всіх напрямків змушені були прийняти позицію за або проти. Люди ставали твердими у своїх переконаннях, переконаними в недобрих намірах іншої сторони."
HIS_HAI_decision.17.a: "Глибока тріщина в американському житті."

HIS_HAI_decision.18.t: "Кандидат"
HIS_HAI_decision.18.desc: "Кандидат піднявся сходами на сцену, махаючи натовпу через яскраві вогні. Він переконався, що затримався для камер, дозволяючи руці впасти звичайним чином до його пояса перед тим, як потиснути руку голові партії. Він вимовив слово "спасибі", як того і очікували від кандидата від основної партії до Сенату США, а потім пройшов усміхнений до лектора і почекав, поки вигуки натовпу затихнуть.\n\n"Друзі," сказав він з примушеним народним тоном. "Я не можу вам сказати, як я вдячний за те, що стою тут сьогодні перед вами. Еліти та партійні боси казали нам, що ми не зможемо цього зробити, але ми показали ЗМІ силу нашого громадянського руху!"\n\nЩе один раунд оплесків. Він дав свою найяскравішу посмішку, знаючи, що донори, які підтримували його кампанію, будуть розміщувати її на обкладинках своїх газет.\n\n"Занадто довго еліти в нашому суспільстві нав'язували нам свої вимоги. Вони хочуть забрати молитву зі шкіл. Вони хочуть лікувати наших хлопців і змусити їх поводитись, як дівчата, і так,..." Він затримався, наче з серця. "Вони хочуть послабити Америку, відправляючи наших хлопців помирати за кордон, руйнуючи тканину наших громад."\n\nВін міцно схопив лектор і дозволив своїй усмішці зникнути.\n\n"Як довго президент змусить нас воювати в такому жахливому місці, як Гаїті, місці, яке більшість наших дітей навіть не змогли б знайти на карті? Я кажу, припиніть зв'язувати руки нашим хлопцям і дозвольте їм робити все, що потрібно для перемоги або привезти їх додому. І поки ми це робимо, ми скажемо їм припинити приїжджати сюди люди, які нам не належать." Він мав вигукнути цю наступну фразу, щоб його почули через натовп. "Я був там, на передовій тільки минулого тижня, коли я сказав губернатору, що ми не хочемо більше біженців в наших громадах! Ніяких більше переселенців-гаїтянських злочинців та комуністів в нашому штаті!""
HIS_HAI_decision.18.a: "Натовп ревів від захоплення."

HIS_HAI_decision.19.t: "Фраґінг"
HIS_HAI_decision.19.desc: ""Ми цього не зробимо, лейтенанте Керрі. Ви не змусите нас." — заявив рядовий Дженсон. Половина загонів бази стояли за ним, перетворюючи гаїтянський двір на майданчик для маршу. І, в деякому сенсі, це і було.\n\n"Рядовий Дженсон, залишайтеся тут на хвилину, я збираюся поговорити з капітаном Ленгсдоном. Дайте мені кілька хвилин." — сказав лейтенант Керрі, обернувся і намагався з усіх сил зробити вигляд, що він не боїться, що його можуть застрелити власні війська. Зайшовши в намет капітана Ленгсдона, він зняв капелюх і зустрів погляд виснаженого командира бази.\n\n"Капітан Ленгсд-"\n\n"Знаю, Керрі. Знаю." — сказав капітан, сидячи в кріслі з відчуттям поразки. "Ти знаєш, що я зробив, коли почув про 'фраґінг'? Я списав це на рахунок. Чорт, ми всі так зробили. Ну і що, що він був з тими психами з CHIO? Потім я побачив, як один з наших рядових відкрив вогонь на свого офіцера." — капітан похитав головою. "Боже. Ця проклята війна."\n\n"Капітан... що ми можемо зробити?" — запитав лейтенант Керрі, сповнений безнадії. Капітан Ленгсдон важко зітхнув і задумався на півхвилини.\n\n"Нічого, чорт візьми. Скажи їм, що ми приймаємо, але при умові, що ми координуємо захист цього табору. МП вже на шляху, після ще півдесятка баз, як наша. Чортові боягузи." — сказав капітан. Лейтенант Керрі кивнув, хоча відчував, що весь його світ розвалюється навколо нього. Вийшовши назад, війська залишалися такими ж кам'яними, як завжди.\n\n"Рядовий Дженсон, ми приймаємо, але при умові, що ми координуємо захист цього табору. Згоден?" Рядовий Дженсон дивився на лейтенанта Керрі, намагаючись заспокоїтися, хоча явно був шокований.\n\n"Згоден.""
HIS_HAI_decision.19.a: "Гаїтяни чули їхні вигуки за кілька миль."

HIS_HAI_decision.20.t: "Дні гніву"
HIS_HAI_decision.20.desc: "Це був спокійний вечір для 72-річної Тельми Пауелл, операторки телефонного зв'язку в Капітолії. Був нечисленний серйозний бізнес у Конгресі, не такий, як у 1962 році, під час боротьби за громадянські права. Вона отримувала час від часу дзвінки від виборців, просячи перенаправити їх до конгресменів, але більшість з тих, хто дзвонив, були ввічливими молодими людьми. Вона підозрювала, що її голос, із його бабусиним тоном, допомагає заспокоїти найгірших дзвонарів.\n\nПролунав дзвінок. Вона з'єднала лінію. "Привіт, це телефонний зв'язок Капітолію. Як я можу вам допомогти?"\n\n"Ця будівля вибухне через 30 хвилин." — сказав низький, жорсткий голос на іншому кінці. "Ви отримаєте багато подібних дзвінків, але цей реальний. Евакуюйте будівлю негайно. Це протест проти участі Америки у війні на Гаїті." І лінія обірвалася.\n\nТельма на хвилину завмерла в своєму кріслі, почувши, як її серце б'ється в грудях. Вона швидко глянула на годинник. Було 1:02 ночі.\n\nТоді вона рішуче діїла: Зателефонувала до Капітолійної поліції та поліції метрополії Вашингтона, пояснюючи ситуацію якнайшвидше і різким, швидким голосом. Потім зателефонувала в кожен офіс, де знала, що працівники можуть залишатися до пізна — в Архітектурний офіс, до прибирання, і в поштову службу — інформуючи їх про евакуацію. Було 1:22, коли вона завершила. З-за її дверей пролунав сигнал тривоги.\n\nВона схопила свою сумку та фото чоловіка з робочого столу. Вибігла через мармурові коридори Капітолію, проходячи повз входи в барбершоп Сенату і їдальню. Відкриваючи двері на двір, вона побачила поліцейські вогні за ним, і раптом почувся гучний скрегіт та страшний гуркіт вибуху."
HIS_HAI_decision.20.a: "Коли вони увірвалися, поліція знайшла зруйновану туалетну кімнату та зіпсований коридор."

HIS_HAI_decision.21.t: "Втеча"
HIS_HAI_decision.21.desc: "Лулуза та Жан-Клод залишилися на Гаїті через війну Батісти, політичний хаос та американське втручання. Лулуза працювала медсестрою в місцевій лікарні, а Жан-Клод допомагав управляти рестораном свого батька. Вони, пара середнього класу, вважали себе в безпеці від насильства, що поглинало їх рідну країну. Але потім батька Жан-Клода застрелив уночі член Червоної армії, а Лулуза завагітніла.\n\nСпочатку вони намагалися пройти через належні канали. Лулуза та Жан-Клод подали заяву на притулок в американському посольстві через загрози їхньому життю. Але, як виявилося, існували сотні пар, подібних до них, майже всі з яких були успішними середнім класом, наляканими тим, куди прямує їхня країна. Коли, після довгого дня очікування, вони нарешті потрапили на співбесіду з консульським офіцером, їм дали низку суперечливих форм для заповнення. Жан-Клод найняв дорогого юриста, який готував документи кілька днів, але їхня заява залишилась без відповіді.\n\nКоли життя в животі Лулуза росло, пара вирішила застосувати більш сумнівні методи. Вони могли б подати заявку на туристичну візу в США і спробувати зникнути, але американці були підозрілі до вагітних жінок, а час очікування там виявився ще довшим, ніж на прийом до посольства. Вони могли б спробувати контрабанду, але ідея доплисти на човні до Гуантанамо була для них надто небезпечною. Нарешті, Лулуза отримала шанс. Один з лікарів, з яким вона працювала, знав консульського офіцера в посольстві Мексики, який за невелику хабарчугу готовий був дати їм тимчасову туристичну візу. Потім їм треба було тільки орендувати машину і пробратися через кордон.\n\nПара пакувала свої сумки, намагаючись не думати про те, що вони залишають позаду, коли востаннє замикали двері своєї квартири і сідали в літак до Ермосільо. Там вони обміняли свої гроші та орендували машину. Вони дізналися, що навіть найчесніший чиновник може заплющити очі за певну суму грошей."
HIS_HAI_decision.21.a: "Перехрестивши кордон, Лулуза відчула різкий поштовх у животі."

HIS_HAI_decision.23.t: "Переселення"
HIS_HAI_decision.23.desc: "Лулуза та Жан-Клод втекли з Гаїті, маючи мало більше, ніж могли нести, після того як підкупили мексиканського чиновника для отримання туристичної візи та втекли через кордон у США. Перші кілька місяців після цього були важкими, неприємними. Вони зупинялися в різних мотелях по Техасу та Луїзіані. Не вміючи говорити вільно, їм не раз доводилося просити допомоги зламуючи англійську — від продавців на заправках, крамарів та перехожих. Це було принизливо для Жан-Клода, який завжди гордився своєю силою, незалежністю та підприємницьким духом.\n\nАле вони пережили все це, мандруючи по Півдню на старенькому авто, поки не приїхали в Маямі, де опинилися перед високою статуєю Туссена Л'Овертюра. У кращі часи вони могли б зупинитися там і постояти в захопленні. Тепер Лулуза взяла чоловіка за руку і, вагітний животик тремтів, повела їх до першої церкви, яку вони знайшли. Священник, добрий латинський чоловік, який говорив гаїтянським креольським з ледь помітним іспанським акцентом, направив їх до лікарні, яка спеціалізувалася на конфіденційності. Незабаром народилася Надін.\n\nІ це був початок їх нового життя. Завдяки зв'язкам через церкву Лулуза та Жан-Клод дізналися, що в Маямі є багато таких, як вони, добрих порядних людей, які втекли від насильства, що поглинуло їх рідну країну як зараз, так і в попередні десятиліття. Жінка, чий колишній багатий батько був ув'язнений Дежоєм, допомогла їм отримати квартиру без документів. Середній віком чоловік-ветеран влаштував Жан-Клода на роботу будівельником, що здавалося абсурдним для слабкого чоловіка, який раніше працював ресторанером. Жінки з Літтл-Гаїті приносили маленькі подарунки їжі для дитини і пропонували пильнувати за нею вдень, якщо Лулуза захоче працювати прибиральницею.\n\nВони прийняли всі ці подарунки. Як могли вони відмовитися? І коли нові вигнанці приїжджали з Гаїті, спраглі допомоги та керівництва, вони оберталися і робили те ж саме. Лулуза, тепер вагітна другою дитиною, пильнувала дітей тих, хто шукав роботу, поки Жан-Клод, тепер сильний та широкоплечий, використовував свою позицію в профспілці для того, щоб знаходити нову роботу своїм товаришам."
HIS_HAI_decision.23.a: "Це було важке життя, але воно було хорошим."

HIS_HAI_decision.24.t: "Охорона кордону"
HIS_HAI_decision.24.desc: "Лулуза та Жан-Клод втекли з Гаїті, маючи мало більше, ніж могли нести, після того як підкупили мексиканського чиновника для отримання туристичної візи та втекли через кордон у США. Перші кілька місяців після цього були важкими, неприємними. Вони зупинялися в різних мотелях по Техасу та Луїзіані. Не вміючи говорити вільно, їм не раз доводилося просити допомоги зламуючи англійську — від продавців на заправках, крамарів та перехожих. Це було принизливо для Жан-Клода, який завжди гордився своєю силою, незалежністю та підприємницьким духом.\n\nВони вірили, що зможуть справитись, що Бог на їхньому боці. Тоді, коли вони сиділи разом у своєму номері в мотелі під Бірмінгемом, пролунав стукіт у двері, а потім звук ключа. Коли двері відкрилися, вони побачили співробітника на стійці реєстрації та двох чоловіків у поліцейських формах. Вони вигукнули щось англійською, що звучало як "INS", а потім швидко увірвалися в кімнату, прижимаючи Жан-Клода до стіни, поки Лулуза кричала.\n\nНаступні кілька тижнів були кошмаром. Вони опинилися на задньому сидінні вантажівки з іншими наляканими чоловіками та жінками. Потім їх поклали в кімнату, де кілька агентів швидко проговорили заяви поганим французьким і виглядали роздратованими, коли вони не розуміли, що їм кажуть. Їх змусили підписати папір, а потім знову заштовхали в машину на кілька годин. Жан-Клод кричав водієві, що його дружина вагітна і їй потрібен лікар, поки машина тряслася дорогою. Їхні скарги залишилися нечутними.\n\nКоли їх нарешті випустили, вони опинилися не вдома, а в таборі. Чоловіки залишили Жан-Клода та його дружину в занедбаному місці, оточеному охоронцями, своєрідній утримувальній камері, поки американці та їхні суди намагатимуться вирішити, що з ними робити. Замість безпеки Лулуза та Жан-Клод потрапили в інший вид небезпеки."
HIS_HAI_decision.24.a: "Погані самаритяни."

HIS_HAI_decision.25.t: "Бунт"
HIS_HAI_decision.25.desc: "Лулуза зникла, а Жан-Клод став руїною самого себе.\n\nЛише кілька тижнів тому вони були разом. Він і його вагітна дружина потрапили до цього табору після втечі з рідного Гаїті. Агенти — яких він тепер розумів як агентів самого диявола — змусили їх підписати документ на незрозумілій мові, в якому вони визнали незаконний перетин кордону. Їм дали кашу і порвані ковдри, коли табір ставав дедалі переповненіший біженцями з Гаїті та інших місць. Він думав, що зможе витримати все це, поки Лулуза не почала родити і її забрали. Минали дні. Він не знав, чи вона жива, чи мертва. Монстри відмовлялися відповідати на його питання.\n\nЖан-Клод ковтав ридання. Тепер він бачив правду: Американці забрали все. Це їхнє втручання призвело до того, що чужі люди вбили його батька. Це їхня окупація змусила його відмовитися від ресторану та дому. Коли він зробив єдине правильне, що може зробити чоловік, вони відповіли тим, що вкрали його дружину і дитину та замкнули його, як собаку, в клітці. Це не могло залишитись так. Це не могло бути так.\n\nКоли охоронці наказали йому та іншим в'язням покинути ігрову кімнату та повернутися до своїх камер, він відмовився рухатися. Коли офіцери крикнули на нього і погрожували бити кийками, він все одно відмовився рухатися. Коли перший офіцер вдарив Жан-Клода по спині, коли зібрані біженці почали кричати, коли гнів зрештою переповнив страх, і біженці накинулися на офіцерів, він не рухався. Він не рухався навіть тоді, коли його товариші почали бити і кричати, рвати офіцерів за знущання, які вони та їхня країна чинили над ними. Пролунала гучна сирена, і табір потопав у повному хаосі, а більше охоронців вийшло з бунтівними рушницями.\n\nЧерез кілька тижнів Сполучені Штати звинуватять його в організації бунту. Після безглуздої судової справи його депортують."
HIS_HAI_decision.25.a: "Жан-Клод ніколи не дізнається, що сталося з Лулуза чи його ненародженою дитиною."

# Events
HIS_HAI.6.t: "Переговори про позиції"
HIS_HAI.6.desc: "Коли новина про припинення членства Гаїті в ОФН потрапила до резолютивного столу, наказ президента Ніксона чітко виразив його гнів: \"Поставте цього покидька Лавада на лінію.\" Державний департамент кинувся відкривати комунікацію, поки Ніксон, зашорений у своєму кріслі, чекав годинами. У його розумі миготіли образи катастрофи: Гаїті може потрапити під владу Трухільйо без американської підтримки, НПП та преса будуть щодня тиснути на нього, сяючі посмішки Кеннеді. Підсвідомо він чекав їх.\n\nРанок похмуро ковзав до полудня. Його секретарка повідомила, що Лавад на лінії, і Ніксон, як голодний звір, схопив телефон. \"Генерал Лавад,\" почав він, намагаючись зберегти спокій, \"це президент Ніксон. Як ви поживаєте?\"\n\n\"Привіт, пане Президенте,\" прийшов тонкий голос. \"Я дуже стурбований недавнім рішенням припинити членство Гаїті в ОФН.\"\n\n\"Ну, е-е, я впевнений, ви розумієте, що всі ми трохи здивовані тим, як все склалося. Ми всі просто цікаві, що ви плануєте робити тепер, коли ви прийшли до влади, е-е, в манері, яка деякими викликає занепокоєння. Глибоке занепокоєння.\"\n\n\"Прошу зрозуміти, пане Президенте, що я—\" Ніксон пропустив наступні кілька слів, коли відсунув приймач, щоб бурмочучи \"чортів покидьок\", повернутися до \"—забезпечити викорінення корупції, яка слабить нашу націю.\"\n\n\"Все одно, ви знаєте, є деякі дуже, е-е, дуже гідні люди серед старої гвардії. Якщо б ви могли залишити деяких з них при владі і дати світу знати, що цей ваш хунта не тут, щоб залишитися, я впевнений, що ОФН міг би розглянути позицію...\""
HIS_HAI.6.a: "Але Ніксон не зміг поступитися, і Лавад не мав змоги заперечувати."
HIS_HAI.6.a_tt: "§YПолітичні реформи £decision_icon_small §GРішення§! будуть §Gвідкриті§!§!\n"
HIS_HAI.6.b: "Ніксон проковтнув свою гордість і почав продумувати, як подати це."
HIS_HAI.6.b_tt_1: "§YСильніша армія £decision_icon_small §GРішення§! будуть §Gвідкриті§!§!\n"
HIS_HAI.6.b_tt_2: "§RКонтроверсії щодо нашої присутності в Гаїті будуть §Yсильнішими§!§!\n"

HIS_HAI.20.t: "Тангенції в Гінші"
HIS_HAI.20.desc: "Топ секрет/[?global.date.GetDateStringNoHourLong]\nВІД: ЖЕРАР ДЕЙВІС МОЛ.\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: НАСУТТЯ ДОМАШНІХ СИЛ НА КОРДОНІ З ГАЇТІ\n\n1. Велика група збройних сил Домініканської Республіки була помічена на кордоні з Гаїті. Ця сила налічує десятки тисяч осіб і здатна здійснити наступ в Гаїті з комбінованою підтримкою. Це вказує на те, що диктатор Рафаель Трухільйо готується до наступальної війни в майбутньому.\n\n2. Переліт через BIGEYE на X/XX та X/XX надав інформацію про велику концентрацію домініканських сил у суперечливому регіоні Гінші між двома країнами. Особливо насторожувало будівництво численних військових баз та складів, що, здається, мають на меті підтримку наступальних операцій. Розвідка SAD підтвердила наявність великої кількості підрозділів, які зібрались у цьому районі, багато з яких не знаходяться в оборонній позі, як це зазвичай очікується.\n\n3. Ця сила не здавалася розширеною останнім часом, і інформатори в уряді не очікують негайного вторгнення. Це може означати, що Трухільйо чекає моменту, коли його сили зможуть подолати Гаїті без опору. Однак, ймовірно, Трухільйо зібрав ці сили, готуючись до моменту в майбутньому, коли Америка не зможе захистити Гаїті. Багато аналітиків очікують, що гаїтянці вистоять менше ніж тиждень проти домініканців, якщо це трапиться.\n\n4. Важливо, щоб Америка не дозволила Трухільйо думати, що він може вдарити по Гаїті безкарно в будь-який час. Наша політика в цьому регіоні має зберігати позицію твердого зобов'язання, щоб відлякати будь-яку атаку. Тим часом ФБР буде продовжувати моніторити це розгортання на предмет змін в рівні сил або їх структурі."
HIS_HAI.20.a: "ВІРНІСТЬ, ХОРОБРІСТЬ, ЦІЛІСНІСТЬ."

HIS_HAI.21.t: "Новини з кордону"
HIS_HAI.21.desc: "Топ секрет/[?global.date.GetDateStringNoHourLong]\n\nВІД: ЖЕРАР ДЕЙВІС МОЛ.\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ЗНИЖЕННЯ КІЛЬКОСТІ ДОМАШНІХ СИЛ НА КОРДОНІ\n\n1. Домініканські сили, що були зібрані на кордоні з Гаїті, були відведені. Великі кількості військ, включаючи багато броньованих підрозділів, переміщуються з району Гінші і перерозподіляються по країні. Це ймовірно вказує на те, що будь-яке можливе вторгнення в Гаїті було скасовано.\n\n2. Переліт BIGEYE показав, що кілька транспортних засобів на поїздах рухаються з цієї території, а дорожні конвої рухаються через гірський хребет Кортильєра Септентріональ. Порівняння з попередніми знімками показало помітне скорочення запасів і транспортних засобів на різних складах, і ті підрозділи, що залишилися, здаються тими, які утримуються для реагування на вторгнення з Гаїті.\n\n3. Джерела на місці відзначили велику переміщення військ по країні, що відповідає перебазуванню сил з Гінші. Багато джерел вважають, що демілітаризація пов'язана з нещодавньою смертю багаторічного диктатора Рафаеля Трухільйо. Чи це спрямовано на відновлення порядку чи є справжньою спробою деескалації проблеми Гінші, наразі невідомо. Однак можна зробити висновок, що вторгнення в Гаїті більше не є короткостроковою метою нового уряду."
HIS_HAI.21.a: "ВІРНІСТЬ, ХРАБРОСТІ, ІНТЕГРІТЕТ."
HIS_HAI.21_tt: "§F£GFX_fopo_tensions §xНапруга на кордоні§! була §Kрозвіяна§!."

HIS_HAI_ugly.1.t: "Гридота Америки"
HIS_HAI_ugly.1.desc: "\"Можливості для роботи за кордоном! Підтримуйте Америку сьогодні!\" - читалося на привабливих плакатах, які були розміщені по всьому округу Колумбія. Яскраві червоні літери були прикріплені до дошок оголошень у державних установах, університетах та готелях. Вони ясно давали зрозуміти, що є дефіцит кваліфікованих людей для роботи за кордоном, що ці посади добре оплачуються і дозволяють побачити захоплюючі місця по всьому світу, а також що вони будуть робити добре і патріотичне завдання, поширюючи свободу за кордоном.\n\nСаме ця остання обіцянка привернула увагу Гридоти Америки — він довго сам так себе називав через свої грубі одягу та брудні руки — звернутися до Державного департаменту. Він відвідував великі інформативні сесії, що проводилися послами в бездоганних сорочках з крапленими комірами, а також ходив на вечірні курси з добре виголеними чоловіками. Під час важкої роботи інженером він здавався іспит з питань закордонної служби, сподіваючись приєднатися до цих принців бюрократії, довести, що він гідний підтримувати такі високі ідеали, як свобода та рівність. Він уже складав цей іспит один раз і, нічого не дізнавшись, готувався здати його ще раз.\n\nСаме з цією метою він відкрив свою поштову скриньку після довгого робочого дня. Гридота Америки витерла свої масляні руки об штани, щоб не забруднити поштові скриньки будівлі — його начальник дуже старався їх тримати чистими — і перевірив вміст. Було кілька рахунків, меню ресторанів, реклама про Річарда Ніксона. Потім, поховані внизу, він знайшов товстий конверт з великим гербом Сполучених Штатів. Він відкрив його неакуратно.\n\n\"Вітаємо! Результати вашого іспиту на іноземну службу дають вам право на негайне призначення на посаду політичного офіцера в нашому посольстві в Порт-о-Пренсі. Щоб прийняти цю посаду...\""
HIS_HAI_ugly.1.a: "Він тримав листа з гордістю, не звертаючи уваги на плями, які залишали його пальці."

USA_UA_haiti_long_haul_tt: "§RMilitant unrest§! в §QГаїті§! навряд чи швидко вщухне, і Сполучені Штати будуть залучені в §QГаїтянську війну§! на роки вперед.\n\nТому §Yрішучі дії в цьому конфлікті є життєво важливими§!, щоб уникнути непередбачених довгострокових наслідків для американської інтервенції."
  
HIS_HAI_ugly.2.t: "Гридотна робота"
HIS_HAI_ugly.2.desc: "Освіта Гридоти Америки перед його відправкою була дуже короткою. Йому навіть не намагалися навчити місцеву мову чи ознайомити з ситуацією в Гаїті. Навпаки, більшість його часу в штаб-квартирі Державного департаменту була зосереджена на так званих \"брифінгах безпеки\" — як захищати себе і уникати шпигунів. Найкращою освітою для нього стали поїздки до бібліотеки та доповіді з Конгресу.\n\nСаме тому він зараз опинився в ситуації, де нелогічно сперечався з групою солдатів у селищі на гаїтянському узбережжі. \"Тепер, панове, я скажу це ще раз,\" сказав він голосом, якому він сподівався, що не видасть його роздратування. \"Державний департамент попросив мене приїхати сюди, щоб побудувати дороги та дати людям роботу. Я поговорив з тисячею людей про це, отримав згоду від місцевих лідерів. Це дуже важливо — запустити ці послуги тут.\"\n\nКомандир підрозділу подивився на зношену хакі Гридоти Америки і з іронічним виразом сказав: \"Я більше переживаю за своїх хлопців, щоб їх не вбили вночі, ніж про те, щоб ці бідняки отримали роботу на дорогах. Як я вже казав раніше, ти можеш мати свій проект, але лише з підрядниками, затвердженими США, і з присутністю американських військ. Це єдиний спосіб запобігти саботажу.\"\n\nВін стримався від того, щоб не розкидати руки в ознаці розчарування. \"Але ви ж бачите, як це суперечить самому сенсу, чи не так? Дуже погано, коли солдати ставлять свої гвинтівки в обличчя людям, але немає робіт, немає місцевого володіння проектом, якщо ми отримуємо якихось іноземних підрядників.\"\n\nАле чоловік перед ним залишався байдужим. \"Слухай, не знаю, що тобі сказати. Якщо ти хочеш поскаржитися про нас, хто захищає американські життя, я б порекомендував підняти це по командуванню. А поки...\" Він показав на селище. \"Я буду ставитися до кожного з цих людей як до потенційної загрози.\""
HIS_HAI_ugly.2.a: "Гридота Америки стояв в обуренні, поки солдати вирушили патрулювати брудні вулиці, залишаючи будівельне обладнання, що тріпотіло на вітрі."

HIS_HAI_ugly.3.t: "Гридотні Люди"
HIS_HAI_ugly.3.desc: "Гридотна Американець усвідомлював, що він єдиний чоловік без краватки. Лише повернувшись із деяких селищ, де доставляв будівельне обладнання, він опинився в особняку міністра закордонних справ Гаїті в брудних, поцяткованих землею хакі, оточений модно одягненими чоловіками. Якби не солдати біля вікна, а гості сміялися і пили, ніхто б не здогадався, що вони знаходяться посеред воєнної зони.\n\n"Боже, боже, ти якийсь брудний," — сказав голос. Він повернувся і побачив старшого чоловіка у дорогому костюмі, який попивав мартіні і посміхався невеликою посмішкою. "Сподіваюся, зарплати в дипломатичній службі не стали такими поганими, що чоловіки не можуть дозволити собі костюми?"\n\n"Я шукаю заступника голови місії, ви не бачили...?"\n\n"О, мабуть, курить марихуану, відпочиває. Кілька твоїх друзів із Держдепу забрали жінок до верхніх кімнат, якщо хочеш перевірити спальню."\n\nАмериканець відкрив рот, але в цей момент почулося гучне вигуковання, коли чоловік в офіцерській формі відкрив пляшку шампанського шаблею. Біла піна витекла на килим.\n\nЧоловік з подивом розглядав це. "Ти коли-небудь думав про те, як важко людям в цих країнах працювати, щоб нас розважити? Кращі вечірки. Кращі напої. Кращі дівчата. Я був в Іраку перед переворотом, і це було те саме, тільки без італійців." Він здався заглибленим у свої думки. "Припускаю, якщо б вони перестали проводити ці заходи, то не було б і сенсу бути тут. Просто ще одна яма на карті."\n\nГридотний Американець більше не міг приховувати своєї огиди. Він похитав головою і пішов, не вимовивши жодного слова."
HIS_HAI_ugly.3.a: "«Бажаю удачі в пошуках твого друга,» — крикнув чоловік йому вслід. «Тут є напої, коли ти здадешся.»"

HIS_HAI_ugly.4.t: "Гридотне Нагадування"
HIS_HAI_ugly.4.desc: "«Все в порядку?»\n\nГридотний Американець моргнув і виявив, що сидить у маленькому ресторані в комуні Табарр у Порт-о-Пренсі. Навколо нього тихо розмовляли інші гості; змішана публіка середнього класу місцевих жителів і іноземних солдатів та дипломатів, які насолоджувалися нічним повітрям. Неподалік грала музика. Навпроти нього сиділа Марі, сіра жінка двадцяти восьми років, яка працювала однією з численних секретарок посольства. Він припускав, що цей вечір з нею — це своєрідне побачення.\n\nГридотний Американець сумно посміхнувся. «О, просто трохи втомлений. Дізнався, що дипломатія — це більше питання его, ніж практична діяльність, як я уявляв».\n\n«Ну, таке вже життя,» — сказала вона нудним голосом. «Це завжди так було. Не має сенсу турбуватися з цього приводу».\n\nВін насупився, але до того, як зміг щось сказати, почувся звук розбитого скла, крик і дзвін столу. Американець обернувся і побачив офіціанта, який схилився над уламками кількох стаканів, поки п’яний солдат встав. «Ти, чорт, дурень...» — почав білий чоловік, піднімаючись. Офіціант тихо вибачився, але це було не почуто, коли інший чоловік відтягнув ногу і вдарив офіціанта в груди. Той відлетів назад від болю. Потім солдат плюнув на землю.\n\n«Досить!» — сказав Гридотний Американець, піднімаючись зі столу. Він підійшов вперед. «Ти не маєш права так поводитися з цією людиною або з будь-яким іншим гаїтянином. Ми приїхали сюди, щоб дати цим людям свободу. Кожен акт насильства зневажає форму...»\n\nАле він не встиг вимовити решту слів, бо кулак чоловіка вдарив його по обличчю. Зчинилася тиша, коли він впав на сусідній стіл і на підлогу. Смак крові заповнив його рот. Він побачив погляд Марі за столом, яка відводила очі, а п’яний чоловік наближався до нього та нахилявся."
HIS_HAI_ugly.4.a: "«Я зроблю все, що хочу,» — плюнув він, — «А потім федерали все приберуть. Не забувай про це.»"
HIS_HAI_ugly.4.tt: "§Р він відчув, як чоловік плюнув на нього. Він залишався нерухомим, поки чоловік не віддалився в ніч.§!"

HIS_HAI_ugly.5.t: "Некрасиві Прохання"
HIS_HAI_ugly.5.desc: "Було б не так погано, якби це була просто зовнішня травма, проблема вигляду, але щелепа Негарного Американця все ще була чутлива після нещасливого побачення з Марі. Кожен раз, коли він відкривав рот, через нього проходив різкий біль. Ще гірше було те, що це ускладнювало розмови у час, коли він найбільше потребував свого голосу. Міністерство оголосило, що проводитиме обстеження всього населення країни для кращого розподілу допомоги та "зменшення шахрайства". Будь-які села, які не були повністю обстежені, ризикували втратити доступ до їжі, грошей і матеріалів. І оскільки багато його колег ховалися в посольстві, щоб уникнути загроз безпеці, він змушував себе працювати, самотньо, через біль.\n\n"Bonjour, monsieur," — сказав Негарний Американець. Через його травму та зламану французьку він відчував себе дитиною. "Je suis un americain avec... le gouvernement. Je voudrais... demander quelques questions à ta famille."\n\nЮнак перед ним дивився з нудьгою чи зневагою. Негарний Американець спробував повторити: "Je voudrais..."\n\nГаїтянин оглянув тиху дорогу з глиняним покриттям. Поки інші селяни займалися своїми справами, кілька американських солдатів сперлися на свій джип і розмовляли. Він подивився на порожній будинок позаду себе.\n\n"Так, американець. Я відповім на питання. З родиною. Ходімо," — сказав чоловік, жестом запрошуючи до будівлі.\n\nНегарний Американець на мить затримався. Йому не дозволяли заходити до будівель наодинці, але його досвід досі був мирним. Він зустрічав деяку ворожість — звичайні антиамериканські мітинги й гасла — але нічого такого, про що його попереджували на брифінгу з безпеки, і — торкаючись щелепи — нічого такого, що він не міг зрозуміти на якомусь рівні."
HIS_HAI_ugly.5.a: "Чоловік жестом запросив його у двері. Зітхнувши, Негарний Американець пішов слідом."

HIS_HAI_ugly.6.t: "Некрасиві Наслідки"
HIS_HAI_ugly.6.desc: "Він зрозумів, що зробив помилку, як тільки зайшов до будівлі. Замість того, щоб зустріти чоловіка і його невелику родину, Негарний Американець відчув щось холодне, металеве і гостре, що притислося до оголеної плоті біля шиї.\n\n"Не кричи," — сказав чоловік.\n\nНегарний Американець підняв свої брудні руки в жесті капітуляції, формуляри для перепису все ще стискаючи в долоні. У темній кімнаті блиснув ніж, коли чоловік почав перевіряти кишені Негарного Американця, дістав його гаманець і почав його переглядати.\n\n"Будь ласка," — сказав Негарний Американець тихим голосом. Чоловік дістав з гаманця пачку грошей. "Я беззбройний. Я тут лише для опитування. Я тільки хочу допомогти."\n\nЧоловік викинув порожній гаманець. "Допомогти? Ви нас убиваєте, поводитесь із нами, як із собаками, і називаєте це допомогою?" Він плюнув на підлогу. Ніж хитнувся. "Ми досі говоримо про жандармерію, про повій і гангстерів, яких ви на нас нав’язали. І навіть зараз ваші банки і компанії приходять грабувати. Хіба це не правда?\n\n"Я не... Я не..." — почав Американець.\n\n"Ти не знаєш." Чоловік повторив це плоским тоном. Він опустив ніж і подивився на американця з виразом ненависті. "Ти приходиш сюди, вважаючи себе героєм, і ти навіть не знаєш власної історії—."\n\nВін не встиг договорити. Негарний Американець жбурнув свою колекцію опитувальних форм до гаїтянина. Папери розсипалися по кімнаті, як конфетті. Чоловік на мить відступив від несподіванки, а Негарний Американець повернувся, вибіг із будівлі, кричачи так голосно, як дозволяла пошкоджена щелепа."
HIS_HAI_ugly.6.a: "Коли він повернувся з американськими солдатами, він знайшов лише розкидані папери і свій порожній гаманець."

HIS_HAI_ugly.7.t: "Некрасиві Думки"
HIS_HAI_ugly.7.desc: "Минуло кілька днів після інциденту в селі, і—з огляду на зростання насильства та нічні жахіття Негарного Американця про холодний ніж біля його шиї—його начальники вирішили, що йому та його колегам слід уникати польової роботи. Натомість Державний департамент повернувся до виконання "життєво важливої підтримки" для "нової фази участі Америки зі своїми гаїтянськими партнерами." На практиці це означало виконання ролі кур'єра для армії США.\n\n"Ласкаво просимо до Порт-о-Пренса, панове," — кричав Негарний Американець крізь дощ і сильний вітер. Він стояв поруч із злітно-посадковою смугою міжнародного аеропорту Порт-о-Пренса, з усіх сил намагаючись утримати парасольку в слизьких руках, поки транспортні літаки приземлялися один за одним. З них виходили юнаки, декотрі виглядали занадто молодими для своїх форм.\n\nЧоловік у промоклому мундирі потиснув руку Негарному Американцю. "Хотів би сказати, що це задоволення," — закричав він, перш ніж усміхнутися. "Сподіваюся, ця погода не стане поганою ознакою."\n\nНегарний Американець посміхнувся, удаючи, що жарт його потішив. "Коли ви влаштуєтесь, Посол запрошує вас до своєї резиденції, щоб обговорити поточні виклики. Він припускає..."\n\nРозмова тривала. Негарний Американець відчував, як його рот рухається, вимовляючи бюрократичні фрази про "ситуацію безпеки" і "оцінки на місцях." Але в душі він відчував себе спустошеним. Це було не те, що він уявляв собі, коли вперше приїхав. Він не уявляв себе агентом імперії, зустрічаючи юнаків і ведучи їх до смерті. Він приїхав сюди з дурною, дитячою надією змінити щось.\n\nНегарний Американець і офіцер пішли до машини. Він відчинив двері для чоловіка і жестом запросив його сісти всередину. Вони ввічливо розмовляли дорогою до посольства."
HIS_HAI_ugly.7.a: "Дощ почав змивати бруд із його пальців."

HIS_HAI_ugly.8.t: "Некрасиві Сцени"
HIS_HAI_ugly.8.desc: "Негарний Американець відчув, як його обід перевертається всередині шлунка, коли гелікоптер злітав із бази поблизу аеропорту. Порт-о-Пренс зменшився і набув пластикового, модельного вигляду. Мініатюрні машини носилися дорогами, які змінювалися з асфальтованих на ґрунтові. Потім він побачив голі пагорби, де поодинокі містечка були розкидані, як бризки фарби.\n\n"Бачиш це?" — закричав його супутник, вказуючи кудись на обрій. "Нам надійшло повідомлення, що деякі з червоної армії Фреда Батіста ховаються там." Гелікоптер затрусило. Чоловік перевів увагу вниз, на підрозділ американських і гаїтянських солдатів. Вони виглядали, як іграшкові солдатики на зеленому фоні. "Це буде хороша місія, щоб перевірити нашу координацію."\n\nНегарний Американець кивнув, ніби розумів щось із цього. Він міцно тримався за ручку пасажира. Він відчував би себе щасливішим, коли це випробування закінчиться і він зможе доповісти заступнику керівника місії, що ситуація з безпекою покращилася настільки, що можна було знову виконувати польову роботу.\n\n"Вони будуть встановлювати контакт. Тобі варто дивитися уважно."\n\nНегарний Американець змусив себе вдивлятися внизу, де підрозділ американців і гаїтян наближався до села. Коли вони підійшли на кілька метрів, пагорбом пролунали тріщини. Усмішка зникла з обличчя його супутника. "Ісусе Христе."\n\nВнизу солдати падали. Червоний туман здіймався, коли один за одним вони падали під невидимого ворога. Декілька чоловіків вистрілили в порожній простір, перш ніж впасти в бруд. Він безпорадно дивився, як один хлопець, блідий і худий, кинув свою гвинтівку і спробував відступити, перш ніж його череп розлетівся. Потім пролунав звук куль, що влучали в нижню частину їхнього гелікоптера.\n\n"Чорт. Відхід! Відхід! Забирайте нас до біса звідси!""
HIS_HAI_ugly.8.a: "Негарний Американець стримувався, скільки міг, перш ніж вирвати на свій бронежилет."

HIS_HAI_ugly.9.t: "Некрасиві Події"
HIS_HAI_ugly.9.desc: "З його високими зовнішніми стінами та запечатаними вікнами, Негарний Американець завжди вважав американське посольство в Порт-о-Пренсі фортецею, джерелом захисту для працьовитих людей Державного департаменту. Після кількох катастрофічних подій, включаючи його власний невдалий політ на гелікоптері, він тепер бачив його як в’язницю. Співробітники давно припинили взаємодіяти з будь-ким у приймаючій країні і натомість ходили одними й тими ж коридорами знову і знову. Він почав бачитися з Марі знову, не через велике почуття любові, а щоб уникнути нудьги й апатії та знайти привід відірватися від свого столу.\n\n"Сер," — пролунало поруч. "У мене є зведення тих звітів операцій Міноборони, які ви просили."\n\nВін відірвався від своїх думок і підвів погляд, щоб побачити... Картера? Честера? Усі імена почали зливатися у його мозку. Усе, що знав Негарний Американець, це те, що чоловік прибув два тижні тому, був помітно на десятиліття молодший за інших і був сином чи племінником чинного члена Конгресу. Його поставили відповідальним за "адаптацію" цього хлопця, що в даному випадку означало попросити його оцінити, як проходила нова орієнтована на військових "співпраця," щоб він, у свою чергу, міг написати дипломатичну депешу до Вашингтона.\n\nНегарний Американець змусив себе подякувати усмішкою. Потім відкрив невеликий пакет паперів... Він відчув, як його обличчя побіліло. Сховані за найглибшою бюрократичною мовою, там були звіти про звірства. Від цього неможливо було втекти. Американські радники "ліквідували цілі." Цілі села були "переміщені," щоб усунути "активні загрози персоналу." Регулярно траплялися "інциденти" насильства, що не були справою кількох божевільних солдатів, а стали результатом системи, яка діяла для знищення повстання. Його руки, чисті через брак важкої праці, міцно стискали папери.\n\n"Сер," — сказав хлопець-принц, здавався таким далеким, "вам добре?""
HIS_HAI_ugly.9.a: ""Просто...залиш мене. Мені потрібен момент, щоб із цим впоратися."""

HIS_HAI_ugly.10.t: "Некрасиві Слова"
HIS_HAI_ugly.10.desc: "Він відмовився від запрошення Марі відвідати її в посольському комплексі. Він відмовився від невеликої вечірки з нагоди виходу на пенсію свого заступника голови місії. Пізно вночі Негарний Американець сидів, вдивляючись у напівнаписаний лист у друкарській машинці на своєму столі.\n\n"Пане посол, додаю копію свого листа про відставку з посади в Державному департаменті. За останні кілька тижнів я втратив впевненість у чесності нашої роботи тут і у здатності Сполучених Штатів впливати на позитивні зміни для народу Гаїті. Я сподіваюся, що, подавши у відставку—."\n\nЛист обривався на цьому. Це і було тим, з чим він боровся останню годину. Чого він сподівався досягти? Чи вважатиме керівництво Департаменту його дії сміливим протестом проти несправедливості? (Ні.) Чи сподівався він згуртувати колег, щоб вимагати чогось кращого? (Ні.) Чи думав він, що врятує когось, крім самого себе, від насильства, яке, навіть зараз, чиниться на вулицях в ім’я свободи й справедливості? (Ні.)\n\nВін похилив голову в руки. Єдине, чого досягне його відставка, це дозволить Департаменту замінити його кимось новим. Можливо, ця людина буде кращою за нього, сильнішою та розумнішою, здатною вистояти проти очевидного зла. Але, найімовірніше, вони привезуть ще одного бюрократичного принца, людину у гарних сорочках із чистими руками, бо він ніколи в житті не працював важко. Він мав це завершити. Він мав спробувати.\n\nНегарний Американець витягнув листа з друкарської машинки, зім’яв його і кинув у смітник. Потім, не промовивши ні слова, він узяв зведений звіт, який приніс Честер, і почав складати депешу до Вашингтона."
HIS_HAI_ugly.10.a: "Прибиральний персонал чув, як друкарська машинка клацала пізно вночі."

HIS_HAI_ugly.11.t: "Некрасива Сварка"
HIS_HAI_ugly.11.desc: ""Ти уникаєш мене."\n\n"Я зайнятий роботою."\n\n"Ти думаєш, я не зайнята? Ми знаходимося в одному комплексі щодня, а ти навіть не можеш пройти коридором."\n\n"Це було важко... Вибач."\n\n"Це через те, що сталося в ресторані? Я знаю—. Я знаю, що мала щось зробити, але я злякалася. Я запанікувала. Я..."\n\nОдягнений у чисту сорочку білого комірця, Негарний Американець сидів на столі в задній кімнаті для зберігання і дивився у стелю. "Це не твоя вина. Просто... щоразу, коли я дивлюся на тебе, я думаю про те, як ми тут зазнали невдачі та прирекли цю країну."\n\n"Я нагадую тобі про те, як ми тут зазнали невдачі?" Настала тиша. "Я?" Вона гірко засміялася. "О, це багатий аргумент, з твоїх уст."\n\nВін відчув, як його обличчя стало гарячим. "Я справді намагаюся щось змінити тут. Я працюю важко. Я брудню руки."\n\n"Боже мій, ти настільки егоцентричний, що думаєш, ніби ти єдина людина, яка намагається врятувати щось із цієї катастрофи? Ти так відчайдушно хочеш бути рятівником, але ти такий самий, як кожен інший пихатий ідіот, який випадково отримав цю роботу." Вона фиркнула. "Що змушує тебе думати, що гаїтяни взагалі потребують тебе?""
HIS_HAI_ugly.11.a: "Він промовив невпевнену відповідь, коли Марі пішла геть. Це були її останні слова до нього."

HIS_HAI_ugly.12.t: "Некрасива Церемонія"
HIS_HAI_ugly.12.desc: "Чому саме його, серед усіх його колег, обрали поїхати до Вашингтона, щоб отримати сертифікат заслуг? Що він узагалі досягнув за час свого перебування на Гаїті, чого не зробили інші? Чи посол рекомендував його, щоб позбутися з країни і зі свого шляху? Чи, можливо, якийсь недолугий співробітник із Вашингтона прочитав його депеші? Чи це просто через те, що він виглядав як втілення американського бойскаута і його фото було корисним для передвиборчих матеріалів?\n\nНегарний Американець не знав. Все, що він усвідомлював, це те, що він і кілька інших підтверджених принців бюрократії стояли в рядок уздовж стіни Східної кімнати Білого дому. Він був одягнений у вишуканий костюм і бездоганну сорочку зі стрілоподібним комірцем, поки камери преси спалахували, а президент говорив про важку роботу, порядність і тріумф американського духу. У якийсь момент—після пояснення досягнень інших нагороджених—президент назвав його ім’я. Президент похвалив його як зразок дипломатичного службовця, висловлюючи вдячність за його роботу у просуванні свободи та розширенні можливостей народу Гаїті.\n\nЙому було байдуже.\n\n"Добра робота, синку," — сказав президент [USA.GetPresidentLastName], проходячи вздовж ряду. Він стиснув йому плече та вручив сертифікат. "На тебе чекає яскраве майбутнє."\n\nПотім усе закінчилося. Президент вийшов, а преса склала свої камери. Кілька співробітників вивели його з будівлі. Він мав піти на вечірку й у готель і вести беззмістовні розмови, які не мали нічого спільного з насильством, що навіть зараз чиниться Сполученими Штатами по всьому світу. Вони сміялися й веселилися, співаючи щасливих пісень, ігноруючи гору кісток, на якій стоїть американська могутність."
HIS_HAI_ugly.12.a: "Коли він сідав на літак назад до Гаїті, він усвідомив, що його руки більше не носили слідів важкої праці."

HIS_HAI_ugly.13.t: "Некрасиві Американці"
HIS_HAI_ugly.13.desc: "Вони оплатили йому поїздку до Вашингтона, щоб прийняти шматок паперу, а тепер умивали руки від нього. Із Державного департаменту надійшло повідомлення, що посольство США на Гаїті «скорочує» свою діяльність і буде «переглядати пріоритети в регіоні». Він та інші отримали повідомлення про те, що їхні посади в посольстві були ліквідовані, і їх переведуть на інше місце, щойно з’явиться вакансія.\n\nНегарний Американець тримав обличчя непроникним, крокуючи спорожнілими коридорами посольства, уникаючи погляду на стіл, за яким працювала Марі та інші секретарі. Він заповнював коробки документами, які мали бути знищені—звітом Честера про злочини США, своїм зім’ятим, наполовину завершеним листом про відставку, розкиданими формами опитувань і рецептом на знеболювальні, які він отримав для щелепи. Він не реагував, коли коробки з його «спадщиною» на Гаїті були завантажені в інсинератор і знищені.\n\nТак було краще, думав він. Те небагато, чого він досягнув, навряд чи переживе стрімкий вивід військ США. Навряд чи розлючені натовпи зовні, які махали гаїтянськими прапорами й вигукували антиамериканські гасла, схвалять будь-які згадки про його перебування тут.\n\nНе те щоб, на його думку, було що святкувати.\n\nКоли всі сліди його перебування були знищені, Негарний Американець піднявся на дах посольства і сів у один із останніх гелікоптерів, що вилітали з Порт-о-Пренса. Коли він злетів, він тримав погляд спрямованим на горизонт, щоб не бачити людей, яких підвів."
HIS_HAI_ugly.13.a: "Прощавайте..."

HIS_HAI_ugly.14.t: "Некрасивий Вихід"
HIS_HAI_ugly.14.desc: "Вони завантажували коробки з документами в інсинератор. Вони гарячково збирали речі, засовуючи все, що могли, у зношені валізи. Вони завантажували людей в броньовані конвої, поки натовпи за стінами посольства ставали все більш панічними. Гаїті падало. Уряд утік. Тепер залишилися лише працівники американського посольства та залишки військових США, які обороняли Міжнародний аеропорт Порт-о-Пренса.\n\nНегарний Американець щойно завершив завантаження звіту Честера про звірства в сумку для спалення, коли чоловік у військовій формі відчинив двері до однієї з кімнат для зберігання. Його обличчя виглядало диким, панічним. \"Ми повинні йти зараз.\"\n\nВін увійшов у гараж саме тоді, коли Марі зникла в задній частині вантажівки, зляканий вираз обличчя на її обличчі. Потім він відчув, як його підганяють до іншої вантажівки позаду неї. У нього було кілька секунд, щоб зачинити двері, перш ніж машина рушила на переповнені вулиці, серед криків і переляканих людей, які благали про втечу, про притулок. Негарний Американець спостерігав, як молодий чоловік кинувся на бік його машини, лише щоб бути скинутим, коли та повернула за ріг. Колись жваві крамниці були зачинені й пустували, поки їхні власники ховалися від ППЛН. Великий банер із зображенням зниклого президента Гаїті тріпотів на вітрі.\n\nВодій повернувся, щоб подивитися на нього. \"Ми майже на місці. Як тільки побачиш термінал аеропорту, готуйся—.\"\n\nВін не почув решти. Пролунав серія гучних ударів, потім звук розбитого скла, коли кулі прорвали переднє вікно. Чоловік осів на кермо. Негарний Американець відчув, як машина зійшла з дороги, прискорюючись із тривожною швидкістю. Група чоловіків із червоним прапором стояла наприкінці дороги. Він не встиг подумати, коли відстібнув ремінь безпеки, відчинив багажне відділення і вистрибнув."
HIS_HAI_ugly.14.a: "Прощавай..."

HIS_HAI_ugly.15.t: "Некрасиві Американці"
HIS_HAI_ugly.15.desc: "Він прокинувся серед недоглянутої трави, що м'яко тріпотіла на вітрі. Небо над головою було безхмарним, його яскраво-синю гладь перетинали сліди від реактивного літака високо вгорі. Негарний Американець залишився лежати, роблячи інвентаризацію своїх частин тіла. Він міг поворушити пальцями ніг, правою рукою. З місця над ліктем йшла гостра, холодна біль. Він змусив себе повернути голову в той бік і побачив, як щось прорвало рукав його забрудненої травою й закривавленої сорочки. З-під шкіри виступала його бліда—.\n\nВін сів, коли блювота прорвалася через його горло й обпекла губи. Він знову зігнувся. Він подивився на дорогу та на уламки вантажівки, його вантажівки, яка тепер лежала на боці. Шматки паперу тріпотіли у розбитих вікнах. Невелика група чоловіків із гвинтівками копирсалася в уламках, надто зайнята пошуками, щоб помітити його.\n\nВін хитнувся, підвівшись на ноги.\n\nВін почекав мить, щоб переконатися, чи не помітять його.\n\nПотім почав шкутильгати назад у бік міста.\n\nЯк довго це тривало, він не міг сказати. Час склався сам у себе. Вперше з моменту прибуття в Порт-о-Пренс багато років тому, однак, вулиці були дивно тихими й порожніми. Більше не було музики, більше не було святкувань. Більше не було іноземців на вулицях. Усе те, що він і його колеги підтримували, зникло.\n\nКоли він більше не міг йти, він зупинився перед величезним, занедбаним білбордом. На ньому було зображено американський прапор і багато усміхнених облич. Написаний англійською та креольською, на ньому був простий напис гарним шрифтом."
HIS_HAI_ugly.15.a: "\"Можливості працевлаштування за кордоном! Приєднуйся до Америки сьогодні!\""
HIS_HAI_ugly.15_tt: "§RПрощавайте...§!"

HIS_HAI_ugly.16.t: "Некрасиві Американці"
HIS_HAI_ugly.16.desc: "Урешті-решт, поїздка до Білого дому стала кінцем вечірки. Він повернувся до посольства в Порт-о-Пренсі. Він оформив свої звіти та документи, поки сили безпеки боролися з гаїтянською червоною армією, військами Фреда Батіста. Це були боротьба, виклики, поки у Вашингтоні не почали панікувати через події на Гаїті, а потім опустили руки. Рішення кризи було знайдено, але не таке, якого бажав Вашингтон, і не таке, що вирішило б основні проблеми чи дії американців на острові.\n\nМ'яка рука торкнулася його плеча. Пара губ торкнулася його щоки. \"Ти в порядку, коханий? Ти знову маєш це обличчя.\"\n\nНегарний Американець повернувся від телевізора у своїй квартирі у Вашингтоні до своєї подруги. Він простягнув свою грубу руку та погладив її по щоці, поки президент із екрана говорив про відданість Америки своїм карибським союзникам та подальшу підтримку Гаїті як країни. \"Так, Мері-Бет, я в порядку. Просто думаю про наступне відрядження.\"\n\nВона поцілувала його ще раз і пішла на кухню, щоб закінчити готувати. Він повернув свою увагу до екрана. Президент [USA.GetPresidentLastName] стояв у Рожевому саду, його тіло мерехтіло під полуденним сонцем. \"Перебуваючи на Гаїті, ми жодного разу не пожертвували своїми принципами заради доцільності, жодного разу не забули, для чого ми там. Ми прагнули довести, що Америка може бути силою добра у світі та сприяти справедливості, куди б вона не йшла. Чого ми повинні навчитися з цього досвіду —.\"\n\nНегарний Американець з огидою вимкнув телевізор. Його власне некрасиве відображення дивилося на нього у темному екрані."
HIS_HAI_ugly.16.a: "Прощавайте..."

HIS_HAI_ugly.17.t: "Некрасиві Американці"
HIS_HAI_ugly.17.desc: "\"О, Христе, ми справді збираємося слухати цю шаблонну промову?\"\n\n\"Це президент, тому—.\"\n\n\"Але що він реально скаже? Ну ти ж був на Гаїті. Ти вже знаєш, що ми зробили й чого не зробили. Все, що POTUS скаже, це буде якийсь поверхневий погляд, відфільтрований через мільйон бюрократів.\"\n\n\"Але все одно\", — зітхнув Негарний Американець до свого нового колеги в американському консульстві в Монреалі, на першому місці роботи після закінчення місії на Гаїті, — \"ми повинні представляти політику США, і важливо, щоб ми могли говорити про специфіку промови, якщо люди запитають про це.\"\n\nЙого колега-дипломат махнув рукою на знак протесту, але не заперечував, коли Негарний Американець увімкнув радіо, розташоване між їхніми столами. Він тримав обличчя незворушним і професійним, відповідаючи ідеалу американського професіоналізму. Він узяв ручку, щоб робити нотатки.\n\n\"З перемогою республіканських сил на Гаїті ми бачимо оновлену відданість нашим основоположним принципам,\" сказав президент крізь статичний шум. \"Ми бачимо, що Америка є силою добра, силою справедливості. З мінімальними інвестиціями ми змогли супроводжувати наших гаїтянських союзників до сім'ї демократій і забезпечити права людини та добробут мільйонів...\"\n\n\"Гей! Гей!\" — раптом закричав колега Негарного Американця з тривогою. \"Твоя ручка! Боже мій, твоя ручка.\"\n\nНегарний Американець вирвався зі ступору й подивився вниз, щоб побачити, що він розламав свою ручку навпіл. Темно-червоні струмки текли з розбитої трубки й заливали його грубі руки."
HIS_HAI_ugly.17.a: "Прощавайте..."

HIS_hinche_negotiations.1.t: "Вимоги Дювальє"
HIS_hinche_negotiations.1.desc: "\"Президенте [USA.GetPresidentLastName], Дювальє на Гаїті буде проблемою. Він погрожує застосувати силу через суперечку навколо Гінче.\"\n\n\"Яку суперечку?\" Президент [USA.GetLeader] гортав ранковий брифінг, шукаючи розділ про Кариби — і примружуючись на абзац із позначкою "Гаїті".\n\n\"Гінче, сер.\" Аналітик розвідки перегорнув свої власні нотатки, надаючи контекст до скромної позначки у щоденному брифінгу президента. \"Спірна територія між гаїтянами та Домініканською Республікою — болюча тема у відносинах щонайменше з 30-х років і навіть раніше, домініканці знову окупували її в '48-му.\"\n\n\"І чому Дювальє зараз вирішив погрожувати силою через це?\"\n\n\"Статус-кво його не влаштовує, і Дювальє досить самовпевнений, щоб думати, що він може змінити ситуацію завдяки своїй волі,\" — сказав аналітик. \"Домініканці офіційно звертаються до Організації американських держав для медіації, за підтримки США.\"\n\nПрезидент [USA.GetLeader] зітхнув. Це було ще одне завдання в напруженому порядку денному лідера вільного світу, і небажане завдання на додачу — але Америка могла принести одну річ до столу:"
HIS_hinche_negotiations.1.a: "Вона могла переконатися, що погрози Дювальє залишаться лише погрозами."

HIS_hinche_negotiations.2.t: "Занадто довге очікування"
HIS_hinche_negotiations.2.desc: "\"Президенте [USA.GetPresidentLastName], гаїтяни не збираються заспокоюватися. Вони офіційно звернулися до Організації американських держав із проханням про американське посередництво у суперечці навколо Гінче.\"\n\n\"Яка ще суперечка?\" Президент [USA.GetLeader] гортав ранковий брифінг, шукаючи розділ про Кариби, і мружився на абзац із позначкою 'Гаїті'.\n\n\"Гінче, сер.\" Аналітик розвідки перегорнув свої власні нотатки, надаючи контекст до скромної позначки у щоденному брифінгу президента. \"Спірна територія між гаїтянами та Домініканською Республікою — болюча тема у відносинах щонайменше з 30-х років, а домініканці знову окупували її в '48-му.\"\n\n\"І чому гаїтяни зараз здіймають галас через це?\"\n\n\"Статус-кво їх не влаштовує, і новий уряд міг би отримати вигоду за рахунок домініканців,\" сказав аналітик. \"Припускаючи, що вони виграють у суперечці. Ми не впевнені, чи готові гаїтяни піти на війну, якщо вони не отримають бажаного, але домініканці нічого не залишають на волю випадку й просять США підтримати медіацію.\"\n\nПрезидент [USA.GetLeader] зітхнув. Це було ще одне завдання в напруженому порядку денному лідера вільного світу, і небажане завдання на додачу — але Америка могла принести одну річ до столу:"
HIS_hinche_negotiations.2.a: "Вона могла, принаймні, забезпечити чесність усіх учасників."

HIS_hinche_negotiations.3.t: "Лінія на піску"
HIS_hinche_negotiations.3.desc: "Коли представники Гаїті та Домініканської Республіки завершили свої вступні презентації у конференц-залі готелю в Маямі, обмінюючись гострими поглядами попри люб'язні слова, американські модератори вирішили, що час зробити перерву.\n\nУся презентація від гаїтянського уряду була переліком образ і злочинів, вчинених Домініканською Республікою, історією недовіри та гніву, що почалася ще з різанини в Парслі та раніше. Домініканцям не можна довіряти, що вони дотримаються свого слова, не кажучи вже про те, щоб зберегти важливий шматок законної гаїтянської території в Гінче, плацдарм у суверенну і непорушну гаїтянську територію; з Божою поміччю, вони отримають Гінче, або Гаїті й Гіспаніола не знатимуть миру.\n\nДомініканський представник грав роль здивованого й уникливого дорослого — звинувачуючи гаїтян у загостренні суперечки, яку можна було б вирішити між двома сторонами самостійно, тоді як було зрозуміло, що уряд Домініканської Республіки десятиліттями не проявляв інтересу до її вирішення. На їхню думку, Гаїті роздмухувало справу понад міру — твердження, яке зручно уникало будь-якого питання про справжнього власника Гінче.\n\nВони не зможуть вирішити цю проблему самостійно — і їм це не потрібно, якщо Америка буде готова зробити вибір за них. Це було надією Гаїті, і тепер це була надія Домініканської Республіки."
HIS_hinche_negotiations.3.a: "Домініканці збережуть Гінче."
HIS_hinche_negotiations.3.b: "Гаїті заслуговує на Гінче."

HIS_hinche_negotiations.4.t: "Кинута рукавичка"
HIS_hinche_negotiations.4.desc: "\"Це рішення суперечить будь-якому поняттю справедливості.\"\n\nПредставник Гаїті вже вичерпав свій час для виступів, його гнів перекочував через слабкі спроби модератора зупинити його. Навпроти нього делегації Домініканської Республіки та Америки сиділи незворушно, тримаючи свої обличчя якнайбільш нейтральними.\n\nАмериканське рішення на користь того, щоб Гінче залишилося за Домініканською Республікою, передбачувано зірвало переговори — і ніхто не очікував, що гаїтяни підуть тихо. Якщо дозволити гаїтянам випустити пару — це ціна дотримання обраного курсу, то американці — і, очевидно, домініканці — були готові її заплатити.\n\n\"Ми принесли цю суперечку до вас із щирістю, впевнені в праведності та історичній обґрунтованості нашої справи. Те, що Америка покладається на аргументи сьогодення, щоб виправдати несправедливе минуле, прирікає Гіспаніолу на похмуре майбутнє.\"\n\nАпеляція до закону перетворилася на апеляцію до емоцій. Модератор, вирішивши дозволити гаїтянам виговоритися до виснаження, не заперечував проти гаїтянської обструкції, даючи словам представника зависнути у повітрі.\n\n\"Якщо наші скарги не можуть бути вислухані справедливо, то ми змушені визнати, що наша довіра до Сполучених Штатів була помилковою. Наш уряд розгляне свої залишкові можливості для задоволення потреб народу Гаїті.\"\n\nІ ось вона — загроза. У міжнародній політиці кожен мав голос, навіть якщо не завжди міг вирішити, де ним скористатися. Домініканські представники повернулися до американців, очікуючи, що буде далі."
HIS_hinche_negotiations.4.a: "Наше рішення залишається незмінним. Гінче — територія Домініканської Республіки."
HIS_hinche_negotiations.4.b: "Наше рішення залишається незмінним. Гінче — територія Домініканської Республіки."
HIS_hinche_negotiations.4.c: "Наше рішення залишається незмінним. Гінче — територія Домініканської Республіки."

HIS_hinche_negotiations.5.t: "Право на відмову"
HIS_hinche_negotiations.5.desc: "Прийняття Америкою позиції Гаїті, як і очікувалося, було сприйнято Домініканською Республікою вкрай негативно.\n\nЗникла будь-яка видимість розгубленості чи поблажливого терпіння. Тепер домініканський представник вперто відмовлявся приймати американську пропозицію — передати Інче Гаїті — аж до посиніння. Гаїтяни, зі свого боку, були близькі до того, щоб здатися і залишити переговори, аргументуючи це тим, що вони нічого іншого від домініканців не очікували, але принаймні американці тепер знали те, що гаїтяни знали роками.\n\nДипломати Державного департаменту оголосили чергову перерву. З огляду на те, що переговори перебували на межі зриву, і США вже стали на бік Гаїті, дехто з них вважав, що для збереження переговорів необхідно запропонувати домініканцям певні заохочення — пропозицію допомоги у розвитку, значно щедрішу за будь-який пакет, запропонований раніше, з індивідуальними 'пакетами' для ключових лідерів. Це буде найбільш дорогою 'взаємовиграшною' угодою, але, можливо, вона спрацює.\n\nПроте інші стверджували, що краще зараз обрати сторону і підтримувати її до кінця, будь то гаїтяни або перехід на бік домініканців."
HIS_hinche_negotiations.5.a: "Що не вирішить слово, вирішать гроші."
HIS_hinche_negotiations.5.b: "Гаїтяни мають рацію, незважаючи ні на що."
HIS_hinche_negotiations.5.c: "Перегляньте позицію Домініканської Республіки."

HIS_hinche_negotiations.6.t: "Шрами на тканині"
HIS_hinche_negotiations.6.desc: "Після того, як американська делегація знову відмовилася поступитися вимогам Гаїті, конференція в Маямі швидко завершилася. Гаїтяни покинули конференцію протягом години, більше нічого не сказавши на захист відхиленої петиції.\n\nТепер у Білому домі залишалося лише побачити, як уряд Гаїті впорається з наслідками. Інші члени ОФН, безсумнівно, уважно стежили за новинами, маючи приклад того, як Америка 'кинула під автобус' одного з членів ОФН заради регіонального миру — приклад, якого вони, безумовно, хотіли б уникнути для своїх країн.\n\n\"Президенте [USA.GetPresidentLastName]?\" Військовий помічник увійшов до Овального кабінету, передаючи Президенту [USA.GetLeader] короткий кабель від посольства в Порт-о-Пренсі. \"Гаїтяни залишаються в ОФН, хоча й оголосили кілька старших радників персонами нон ґрата.\"\n\nПрезидент [USA.GetPresidentLastName] насупився. Це були добрі новини — гаїтяни зрештою проковтнули свою гордість і не збиралися розривати ОФН. Однак було зрозуміло, що це невдоволення стане ознакою відносин Гаїті та США на багато років уперед.\n\nДо кабелю додавалися довші чорнові варіанти консульського оголошення із закликом до американців повернутися додому з Гаїті, яка тепер охоплена антиамериканськими заворушеннями. Це був не перший випадок, коли американці були небажаними в Гаїті, але гаїтяни мали довгу пам'ять і пам'ятатимуть цю свіжу образу так само образливо, як і всі попередні."
HIS_hinche_negotiations.6.a: "Ще одна проблема для управління у майбутньому?"

HIS_hinche_negotiations.7.t: "Більше не добрі сусіди"
HIS_hinche_negotiations.7.desc: "Після того, як американська делегація знову відмовилася поступитися вимогам Гаїті, конференція в Маямі швидко завершилася. Гаїтяни покинули конференцію протягом години, більше нічого не сказавши на захист відхиленої петиції.\n\nТепер у Білому домі залишалося лише побачити, як уряд Гаїті впорається з наслідками. Інші члени ОФН, безсумнівно, уважно стежили за новинами, маючи приклад того, як Америка 'кинула під автобус' одного з членів ОФН заради регіонального миру — приклад, якого вони, безумовно, хотіли б уникнути для своїх країн.\n\n\"Президенте [USA.GetPresidentLastName]?\" Військовий помічник увійшов до Овального кабінету, передаючи Президенту [USA.GetLeader] короткий кабель від посольства в Порт-о-Пренсі. \"Гаїтяни щойно надіслали офіційне повідомлення про бажання вийти з ОФН.\"\n\nІ ось воно. Президент [USA.GetPresidentLastName] зітхнув, затискаючи перенісся. Гаїтяни попереджали, що підтримка Домініканської Республіки матиме свою ціну, — і вони дотрималися своєї загрози.\n\n\"Є ще дещо, сер.\" Помічник зробив паузу, чекаючи, поки Президент [USA.GetPresidentLastName] поверне свою увагу, перш ніж завдати остаточного удару. \"Гаїтяни просять визначити графік виведення військ ОФН із Гаїті.\"\n\nМіж тим, як Президент [USA.GetPresidentLastName] осмислював новину, панувала ніякова тиша. У шлунку з'явилося зростаюче, неприємне відчуття, яке, здавалося, не збиралося зникати найближчим часом."
HIS_hinche_negotiations.7.a: "Від одного головного болю до іншого."

HIS_hinche_negotiations.8.t: "За межею"
HIS_hinche_negotiations.8.desc: "Після того, як американська делегація знову відмовилася поступитися вимогам Гаїті, конференція в Маямі швидко завершилася. Гаїтяни покинули конференцію протягом години, більше нічого не сказавши на захист відхиленої петиції.\n\nТепер у Білому домі залишалося лише побачити, як уряд Гаїті впорається з наслідками. Інші члени ОФН, безсумнівно, уважно стежили за новинами, але найбільше нервували домініканці, які поспішно запитували, чи готові США у відповідь надати гарантії безпеки, якщо Дювальє вирішить діяти на свій розсуд.\n\n\"Президенте [USA.GetPresidentLastName]!\" Військовий помічник влетів до Овального кабінету, передаючи Президенту [USA.GetLeader] короткий кабель від посольства в Порт-о-Пренсі. \"Уряд Дювальє мовчить, але ознаки незаперечні: гаїтянська армія рухається з Порт-о-Пренса до домініканського кордону.\"\n\n\"Він дійсно збирається вторгнутися?\" У Президента [USA.GetPresidentLastName] відвисла щелепа. Дювальє був непередбачуваним, але це? Ніколи в найсміливіших снах вони не могли уявити, що Дювальє буде готовий розпочати війну у дворі Америки - адже цього разу було занадто очевидно, на чиєму боці були симпатії Америки.\n\nПрезидент [USA.GetPresidentLastName] не пам'ятав багато з того, що сталося далі. Лунали гарячкові звернення - всі без відповіді - до Порт-о-Пренса із заявою, що Дювальє перейшов межу. Військові та Державний департамент поспіхом розробляли плани евакуації американців як з Гаїті, так і з Домініканської Республіки - з достатньою вогневою потужністю на випадок, якщо Америці знову не пощастить втрутитися в події на Гаїті."
HIS_hinche_negotiations.8.a: "Нова криза назріває в Карибському басейні."

HIS_hinche_negotiations.9.t: "Дипломатія чека"
HIS_hinche_negotiations.9.desc: "Там, де не спрацювала логіка, втрутився меркантильний інтерес і страх.\n\nДомініканці не збиралися поступатися лише завдяки силі гаїтянських аргументів - між сторонами пролито надто багато поганої крові, щоб це було можливо, навіть за умов американського дипломатичного впливу на боці Гаїті. Їх довелося переконувати вагою американських доларів та силою американської зброї.\n\nРяд за рядом цифр із сумами були надруковані в детальному списку, що включав обіцянки фінансування, допомоги та пільгових кредитів уряду Домініканської Республіки. Це американці наполягли зробити поза присутністю гаїтян - щоб дозволити домініканцям зберегти обличчя.\n\nКоли цифри ставали занадто великими, американці дозволяли іншому, більш прямому інструменту дипломатії взяти центр сцени. Для цього гаїтян запрошували до кімнати - нібито для обговорення питань військової готовності навколо Гаїті, але насправді, щоб вразити домініканців тим, що після певного моменту Америка не прийме 'ні' за відповідь.\n\nУ підсумку всі сказали 'так'. Кожен отримав щось зі зустрічі - гаїтяни свою землю, американці мир, а домініканці - обіцяні виплати."
HIS_hinche_negotiations.9.a: "Про гордість домініканців нічого не сказано."

HIS_hinche_negotiations.10.t: "Розрив"
HIS_hinche_negotiations.10.desc: "Навіть із застосуванням тонких - і не дуже - методів переконання на підтримку позиції Гаїті, американці зрозуміли, що домініканці не поступляться - і гірше того, не покинуть переговори.\n\nПереговори щодо територіального спору за Інче затягнулися до самого ранку - домініканці, ймовірно, сподівалися, що втома зробить із гаїтянами та американцями те, чого не зробили їхні аргументи. Американці оголосили чергову перерву, і в конференц-зал було привезено візок із паруючими кавниками.\n\nАмериканці та гаїтяни мусили вийти - поступившись моральною перевагою домініканцям, хоч би через їхню впертість, але питання про те, що буде далі, залишалося. Оскільки відносини з Домініканською Республікою навряд чи відновляться, залишається лише забезпечити, щоб гаїтянська частина Гаїті сяяла там, де Домініканська Республіка занепадає, щоб ніхто не сумнівався у мудрості підтримки Гаїті.\n\nГаїтяни не заперечували - вони, зрештою, отримали те, чого хотіли."
HIS_hinche_negotiations.10.a: "Гаїті засяє завдяки американським коштам та інвестиціям."
HIS_hinche_negotiations.10.b: "Дювальє, однак, не зупиниться, поки весь Гаїті не відповідатиме йому."

HIS_hinche_negotiations.11.t: "За межею"
HIS_hinche_negotiations.11.desc: "\"Президенте [USA.GetPresidentLastName]!\" Військовий помічник влетів до Овального кабінету, передаючи Президенту [USA.GetLeader] короткий кабель від посольства в Порт-о-Пренсі. \"Уряд Дювальє мовчить, але ознаки незаперечні: гаїтянська армія рухається з Порт-о-Пренса до домініканського кордону.\"\n\n\"Він дійсно збирається вторгнутися?\" У Президента [USA.GetPresidentLastName] відвисла щелепа. Дювальє був непередбачуваним, але це? Ніколи в найсміливіших снах вони не могли уявити, що Дювальє буде готовий розпочати війну у дворі Америки - адже цього разу було занадто очевидно, на чиєму боці були симпатії Америки.\n\nПрезидент [USA.GetPresidentLastName] не пам'ятав багато з того, що сталося далі. Лунали гарячкові звернення - всі без відповіді - до Порт-о-Пренса із заявою, що Дювальє перейшов межу. Військові та Державний департамент поспіхом розробляли плани евакуації американців як з Гаїті, так і з Домініканської Республіки - з достатньою вогневою потужністю на випадок, якщо Америці знову не пощастить втрутитися в події на Гаїті."
HIS_hinche_negotiations.11.a: "Нова криза назріває в Карибському басейні."

### НПНВ ###
# Ideas

HAC_Government_of_the_Alliance_Generale: "Уряд Альянсу Générale"
HAC_Government_of_the_Alliance_Generale_desc: "НПНВ ніколи не стверджував, що є домінуючим партнером у революційному альянсі, але як найбільш організована організація, НПНВ займає авторитетну позицію. Щоб компенсувати цей привілей, вони докладають зусиль до співпраці з товаришами-революціонерами та враховують їхні інтереси в ширшому проєкті. Проте у фронті назріває зростаючий конфлікт із нуаризмом Жака-Стефана Алексіса, який ставить у центр культури, а не клас, як основне питання гаїтянського суспільства."
HAC_Army_of_Insurgents: "Армія Повстанців"
HAC_Army_of_Insurgents_desc: "Як і кожне велике соціалістичне повстання в історії, революційна армія НПНВ почалася як різноманітний союз міліцейських новобранців і дезертирів із Гаїтянських Збройних Сил. Замість однієї армії, розосередженої по всій країні, вона складається з кількох регіональних армій, які отримують накази від Центрального Комітету, забезпечуючи певну гнучкість.\n\nОднак нова революційна армія не позбавлена труднощів - через неефективний зв’язок і погану організацію постачання координація залишається складною, а багато незалежних загонів партизанів - таких як сумнозвісний загін під керівництвом Фреда Баптиста - діють безпосередньо поза ланцюгом командування. Тим не менш, з часом і досвідом ці проблеми будуть вирішені, якщо на це вплине Центральний Комітет."
HAC_Mass_Revolutionary_Movement: "Масовий Революційний Рух"
HAC_Mass_Revolutionary_Movement_desc: "Для НПНВ це є предметом гордості - їхній рух має масову підтримку на Гаїті, охоплюючи всі аспекти суспільства, які залишаються невидимими і знехтуваними елітами Порт-о-Пренса. Це рух, який відповідає на скарги робітничого класу, утиски не-гаїтянців та зростаючі заклики до чорного націоналізму проти панування мулатів. Якою б не була ваша справа, НПНВ знайде для вас місце у своєму ідеологічному фронті проти гаїтянського буржуазного уряду."
HAC_Through_the_Hinche_Highway: "Через Шосе Інче"
HAC_Through_the_Hinche_Highway_desc: "Зміна долі НПНВ після Домініканської революції, яка створила молоду націю революціонерів прямо на кордоні, була несподіваною, але не небажаною. Наші брати й сестри в Інче, розташованому в глибині країни, надали нам притулок і стабільний потік добровольців, зброї та припасів. З нашого опорного пункту там ми отримали ще кращу позицію, з якої ми можемо повернути Гаїті разом із нашими соратниками по зброї."

