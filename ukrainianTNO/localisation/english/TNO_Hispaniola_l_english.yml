hispaniola_news.61.t: "[Get_newspaper_header] Гаїті перемагає Революційний фронт"
hispaniola_news.61.desc: "Війна між Гаїті та Революційним фронтом завершена, і Гаїті тепер повністю окупує колишню Соціалістичну Республіку. Після ліквідації соціалістичного повстання НПНВ, антисоціалістична кампанія Гаїті завершена з капітуляцією Домініканської Народної Республіки.\n\nБуло створено новий уряд окупації для Домініканської Народної Республіки за допомогою ОФН, офіційно названий «Перехідним урядом», хоча місцеве населення повідомляє про негативне ставлення або навіть ворожість до нового уряду та миротворчих сил ОФН-ОАС.\n\nСША, як повідомляється, дуже радіють цьому розвитку, хоча деякі дисидентські голоси в конгресі і навіть інші країни ОФН, ймовірно, незадоволені ще одним вкладенням у «Перехідний уряд»."
hispaniola_news.61.a: "І ось так революція розбита на тисячу частин."

hispaniola_news.62.t: "[Get_newspaper_header] Гаїтянська революція"
hispaniola_news.62.desc: "Здається, що соціалістична революція на всьому острові Гаїті, яка почалася з Домініканської Республіки, сьогодні завершилась падінням Гаїті до революційних сил. Революційний фронт Гаїті успішно штурмував Порт-о-Пренс, поваливши підтримувану ОФН мулатократію та встановивши на острові другу революційну державу. На вулицях столиці з'явилися танки Червоної Армії Домініканської Республіки, а лідер гаїтянських революціонерів Жак-Стефан Алексіс заявив: «Як люблять говорити американці, ми лише перший доміно...». \n\nЦі події, безсумнівно, матимуть глибокий вплив на Латинську Америку, не лише через створення нової комуністичної держави в регіоні, але й тому, що Сполучені Штати були успішно кинутих і переможених військовою силою у власному задньому дворі."
hispaniola_news.62.a: "Цікаві події."

