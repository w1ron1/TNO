# Events
HIS_puertoplata.1.t: "Тривоги з Раю"
HIS_puertoplata.1.desc: "КОНФІДЕНЦІЙНО\n\nДО: ДОКТОРА АНТОНІУ ОЛІВЕЙРА САЛАЗАРА, ГЕНЕРАЛІСІМО ФРАНСІСКО ФРАНКО\n\nДОМІНІКАНСЬКА РЕСПУБЛІКА — СТРАТЕГІЧНИЙ СОЮЗНИК У КАРИБСЬКОМУ РЕГІОНІ\n\nЗ крахом Тріумвірату основна життєва артерія Домініканської Республіки була перервана. Через занепокоєння щодо забезпечення безпеки держави та зважаючи на вразливе становище Генералісимо Рафаеля Трухільйо, невелика група генералів у Збройних силах спланувала державний переворот. Змова була швидко виявлена розвідувальними службами уряду протягом минулого тижня і ліквідована без особливих труднощів і без відомої іноземної підтримки.\n\nЦе перша подібна змова за останнє десятиліття, хоча раніше вони часто траплялися, коли Трухільйо ще не закріпився на своїй посаді. Однак нещодавні події збільшили загрозу від таких змов. Кілька країн у регіоні ворожо ставляться до режиму: Мексика та Венесуела довго перебували в конфронтації з ним, а недавні події на Кубі перетворили її на центр анти-Трухільйської організації, не кажучи вже про активну опозицію, яку Сполучені Штати демонструють із кінця війни. Трухільйо приватно висловив занепокоєння щодо майбутніх змов, які можуть отримати підтримку згаданих країн, і можливості їхнього успіху.\n\nКритично важливо, щоб Трухільйо залишався при владі. Домініканська Республіка нині є нашим найближчим союзником у Латинській Америці, а зусилля Рафаеля Трухільйо відіграють ключову роль у наших стратегічних інтересах. З крахом Тріумвірату багато хто вважає, що позиція його уряду ізольована, за винятком нашої присутності. Якщо його режим зазнає краху через зовнішній тиск, ймовірні заміни будуть значно менш відкритими до співпраці. Підвищена увага буде зосереджена на цій нації, і рекомендується, щоб державі надавали додаткову підтримку відкрито, щоб покращити сприйняття її дипломатичного становища.\n\nВід Міністерства Закордонних Справ."
HIS_puertoplata.1.a: "Над Іспаньйолою збираються темні хмари..."

HIS_puertoplata.2.t: "Можливість"
HIS_puertoplata.2.desc: "ЦІЛКОМ ТАЄМНО - [?global.date.GetDateStringNoHourLong]\nВІД: ВИКОНАВЧИЙ СЕКРЕТАРІАТ\nПАМ’ЯТКА ДЛЯ ПРЕЗИДЕНТА\nТЕМА: НЕСТАБІЛЬНІСТЬ У ДОМІНІКАНСЬКІЙ РЕСПУБЛІЦІ\n\nОстанні геополітичні потрясіння залишили режим Генералісимо Рафаеля Трухільйо ослабленим. Невдала змова отримала певний розмах невдовзі після краху Тріумвірату, але зрештою була придушена. Незважаючи на провал, цей переворот свідчить про зміну тенденцій у домініканській політиці. Інші змови, особливо ті, що є більш організованими, виглядають вірогідними. Крім того, дипломатичне становище країни залишається ізольованим, окрім підтримки Іберії. Зусилля щодо покращення відносин із сусідніми країнами малоймовірні, враховуючи, що за останнє десятиліття режим перетворився на парію.\n\nКілька спеціальних агентів у полі використали свої зв’язки з лояльними посадовцями в певних регіонах Домініканської Республіки, щоб розкрити провалену змову. У відповідь була проведена незначна чистка, що викликала занепокоєння у деяких офіційних осіб. На Кубі тривають плани надання допомоги Карибському легіону у заміні Трухільйо (див. додаток для отримання додаткової інформації). Продовження військової присутності домініканських сил на гаїтянському кордоні свідчить про незмінність зовнішньої політики.\n\nВкрай важливо забезпечити заміну режиму, очолюваного Трухільйо. Більшість місцевої опозиції в цілому об’єднана проти прихильності Трухільйо до фашистських та антиамериканських режимів у Європі та Латинській Америці. Така опозиція також співчуває нам, Кубі чи Мексиці. У боротьбі з Трухільйо спеціальні агенти були відправлені для надання допомоги повстанцям і організації їх для запланованого наступу Легіону. Агенти також зараз організовують опозицію всередині домініканської армії, маючи певні успіхи."
HIS_puertoplata.2.a: "ВІДАНІСТЬ, СМІЛИВІСТЬ, ЧЕСНІСТЬ."
PP_Command_Power_Loan_tt: "Ми тимчасово отримали §Y80§!£command_power §Yкомандних очок§! для проведення операцій у Домінікані."
DOM_puerto_plata_intervention_enabled_legion: "£GFX_decision_icon_small §YРішення§! щодо §xусунення Трухільйо§! буде розблоковано."

HIS_puertoplata.3.t: "Звіт про діяльність Легіону"
HIS_puertoplata.3.desc: "КОНФІДЕНЦІЙНО\nДО: ДОКТОРА АНТОНІУ ОЛІВЕЙРА САЛАЗАРА, ГЕНЕРАЛІСІМО ФРАНСІСКО ФРАНКО, МІНІСТЕРСТВО ЗАКОРДОННИХ СПРАВ\n\nДОМІНІКАНСЬКА РЕСПУБЛІКА - СТРАТЕГІЧНИЙ СОЮЗНИК У КАРИБСЬКОМУ РЕГІОНІ\n\nПротягом останніх тижнів ми відправили невеликий контингент агентів до Куби за підтримки домініканської розвідки. Цим агентам було поставлено завдання контррозвідки, щоб виявити будь-які потенційні змови щодо повалення уряду Рафаеля Трухільйо. Останні результати свідчать про те, що ризик змови з іноземною підтримкою щодо усунення Трухільйо є реальним.\n\nЗавдяки поєднанню залякування, перехоплення та підкупу, нашим агентам вдалося частково проникнути у групу з 2000 солдатів Карибського Легіону. Ці солдати проходять навчання з амфібійних висадок та ведення бою і складаються переважно з політичних дисидентів, які залишили країну в останні роки, а також добровольців з Куби та інших країн. Немає жодних сумнівів у тому, що вони готуються до нападу на Домініканську Республіку, особливо враховуючи останні атаки повстанських осередків на кілька прибережних районів.\n\nЦе серйозне погіршення перспектив для Домініканської Республіки, а уряд, схожий на кубинський, безсумнівно буде ворожим до нас, що може поставити під загрозу наші інтереси в Латинській Америці в цілому. Домініканський уряд був негайно попереджений про загрозу та готується до великої, раптової війни. Окрім цього, інтенсивність наших зусиль з розкриття планів Легіону, ймовірно, унеможливить подальший прогрес без зайвого ризику для наших агентів. Для такого розвитку подій підготовлено кілька планів на випадок надзвичайної ситуації, і їх слід негайно виконати."
HIS_puertoplata.3.a: "Давайте переглянемо ці плани."
DOM_puerto_plata_intervention_enabled_trujillo: "£GFX_decision_icon_small §YРішення§! щодо §Gдопомоги Трухільйо§! буде розблоковано."

HIS_puertoplata.4.t: "Статус Домініканської Республіки"
HIS_puertoplata.4.desc: "ЦІЛКОМ ТАЄМНО\nТІЛЬКИ ДЛЯ ОЧЕЙ\nДО ВСІХ ЧЛЕНІВ [getIntelAgencyCaps]\nОПЕРАЦІЯ БЕРНШТЕЙН\n\nДОМІНІКАНСЬКА РЕСПУБЛІКА - КАРИБИ - ПРИХИЛЬНІСТЬ ДО ІБЕРІЇ\n\nРозпад Тріумвірату спричинив вразливість уряду Рафаеля Трухільйо як до внутрішнього тиску, так і до зовнішніх дій. Сполучені Штати в координації з Кубою та Мексикою наразі тренують невеликий контингент Карибського Легіону, який займає пряму позицію проти диктаторських режимів у регіоні. Зважаючи на повідомлення про навчання з проведення амфібійних операцій, ймовірно, вони планують атаку з моря з подальшим об’єднанням з дисидентами та повстанськими силами всередині країни, щоб спробувати організувати народну революцію.\n\nНаразі Іберія стала єдиним прихильником Домініканської Республіки. Ймовірно, вони також виявили плани американців та кубинців, про що свідчить посилена присутність відомих агентів безпеки. Санто-Домінго дотримується нейтральної позиції щодо політики, спрямованої проти нас, а Іберія є ворожою. Малоймовірно, що підтримка домініканського уряду змінить цю точку зору. Таким чином, будь-які потенційні вигоди в найближчому майбутньому будуть незначними. Однак перспектива витіснення американської активності в їхньому власному регіоні, а також у зоні, яка знаходиться під впливом США, все ще має стратегічне значення.\n\nНЕХАЙ ҐЕРМАНІЯ БУДЕ В БЕЗПЕЧНИХ РУКАХ."
HIS_puertoplata.4.a: "Навіть нейтральна Домініканська Республіка краща за ту, що беззаперечно підтримує Америку."

HIS_puertoplata.5.t: "Наближення вторгнення"
HIS_puertoplata.5.desc: "ЦІЛКОМ ТАЄМНО - [?global.date.GetDateStringNoHourLong]\nВІД: ВИКОНАВЧИЙ СЕКРЕТАРІАТ\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\nТЕМА: ЗАПЛАНОВАНЕ ВТРУЧАННЯ В СПРАВИ ДОМІНІКАНСЬКОЇ РЕСПУБЛІКИ\n\nКарибський легіон завершує свої навчальні плани, які дали помірні результати. Висадка в Пуерто-Плата запланована через два місяці після обговорення між Міністерством оборони та спільними розвідувальними агентствами Мексики та Куби. У координації з цим планується загальне повстання у містах по всій країні. Припускається, що режим Трухільйо та його іноземні союзники обізнані про плани вторгнення та повстання.\n\nЗвіти місцевих офіцерів зазначають, що Легіон покращив свої навички, але попередній досвід обмежив можливі вигоди. Деякі види озброєння та засоби зв’язку були надані місцевим повстанським осередкам і підрозділам, які приєднаються до повстання, з очікуванням, що вони відволічуть військові сили Трухільйо за межами ключових регіонів для висадки. Останні репресії з боку режиму Трухільйо були спрямовані на ключові осередки, а тактика стала більш узгодженою з методами боротьби з тероризмом, які застосовує Іберія. Крім того, повідомляється, що домініканські склади отримують сучасні системи протиповітряної оборони, що свідчить про інвестиції, спрямовані на запобігання вторгненню.\n\nВажливо визнати ризик, який це становить для запланованого втручання. Ці обставини, ймовірно, не унеможливлять поразки, але залучення іноземних урядів ризикує перетворити конфлікт на затяжну боротьбу, що може поставити під загрозу успіх операції. Однак багато з цих ризиків відомі протягом тривалого часу. Спеціальні агенти намагаються виявити та захопити іноземних агентів, але їхня увага залишається зосередженою на забезпеченні успіху висадки. Було б доцільно надати Карибському легіону рішучу підтримку з боку ВПС і ВМС США, щоб мінімізувати ризики."
HIS_puertoplata.5.a: "ВІРНІСТЬ, ХОРОБРІСТЬ, ІНТЕГРИТЕТ."
HIS_puertoplata.5.a_tt: "§YВторгнення§! §eпочнеться§! через 60 днів."

HIS_puertoplata.6.t: "Наближення повстання"
HIS_puertoplata.6.desc: "КОНФІДЕНЦІЙНО\nДО: ДОКТОРА АНТОНІО ОЛІВЕЙРА САЛАЗАРА, ГЕНЕРАЛІСІМО ФРАНСИСКО ФРАНКО, МІНІСТЕРСТВА ЗАКОРДОННИХ СПРАВ\n\nДОМІНІКАНСЬКА РЕСПУБЛІКА - СТРАТЕГІЧНИЙ СОЮЗНИК У КАРИБСЬКОМУ РЕГІОНІ\n\nСили, які проходили підготовку поблизу Майарі та затоки Найпе на Кубі, Карибський легіон, схоже, завершують свої приготування. Інтенсивність тренувальних програм зменшилася, а постачання військового спорядження значно зросли в останні тижні в районі табору. Крім того, заяви кількох високопосадовців на Кубі частіше містять чіткі ворожі коментарі щодо Домініканської Республіки. Дії повстанських осередків у прибережних районах Домініканської Республіки також посилилися, незважаючи на зростання заходів боротьби з повстанцями.\n\nМи прогнозуємо, що за поточних умов напад на Домініканську Республіку відбудеться не пізніше ніж за два місяці, а, ймовірно, і раніше. Щоб протидіяти цьому, наполегливо рекомендується зробити власні приготування. Для вашого розгляду вже підготовлено кілька планів дій. Планування продовжуватиметься, паралельно з посиленням присутності наших спеціальних підрозділів та постачанням обладнання зі складів. Крім того, останнім часом було вжито заходів для підриву ворожої розвідки, хоча наразі вони дали мало результатів."
HIS_puertoplata.6.a: "Битва за Еспаньйолу наближається."
HIS_puertoplata.6.a_tt: "§RТік-так...§!"

HIS_puertoplata.7.t: "Наближення повстання"
HIS_puertoplata.7.desc: "ЦІЛКОМ ТАЄМНО\nДЛЯ ОЧЕЙ ЛИШЕ\nДО ВСІХ ЧЛЕНІВ [getIntelAgencyCaps]\nОПЕРАЦІЯ БЕРНШТЕЙН\n\nДОМІНІКАНСЬКА РЕСПУБЛІКА - РОЗТАШОВАНА В КАРИБСЬКОМУ РЕГІОНІ - СХИЛЬНА ДО СПІВПРАЦІ З ІБЕРІЄЮ\n\nОстаточні приготування Карибського легіону до нападу на Домініканську Республіку знаходяться на завершальному етапі. Інтенсивність тренувань знизилася, запаси зброї більш ніж подвоїлися протягом останнього місяця, а кілька десантних суден знаходяться в портах поблизу таборів, де перебуває Карибський легіон. Бойова активність і заходи проти повстанців у Домініканській Республіці зросли, хоча оцінити їхню ефективність важко. Ймовірно, уряд Трухільйо загалом усвідомлює загрозу з боку Карибського легіону, хоча повною мірою, можливо, і не усвідомлює.\n\nПопередні оцінки свідчать, що вторгнення Легіону розпочнеться приблизно через два місяці. Деякі зусилля були спрямовані на створення осередків на острові Еспаньйола, але прогрес у цьому напрямку обмежений. Ті, що вдалося організувати, будуть спрямовані на підрив зусиль Легіону. Тим часом допомога була відправлена до Домініканської Республіки, і загалом її було прийнято, хоча керівництво поки що не змінило свого дипломатичного ставлення до нас. Дипломати з Іберії, які перебувають на місці, схвально ставляться до нашої допомоги, але так само не виявляють готовності до подальшої співпраці.\n\nХАЙ НІМЕЧЧИНА БУДЕ У БЕЗПЕЦІ."
HIS_puertoplata.7.a: "І хай зусилля цих агентів принесуть плоди."

HIS_puertoplata.10.t: "Приземлення"
HIS_puertoplata.10.desc: "Пілот посміхнувся. Він чекав на цей момент досить довго. Нахиляючи важіль управління вперед, він відпустив газ, і його A-6 Intruder нахилився вперед і прискорився. Він натиснув на гачок, спочатку легенько, а потім сильніше. Вистрілилося полотно вогню і смерті, яке було націлене на величезний пагорб попереду нього, на вершині якого стояла статуя Христа-Спасителя. Цей пагорб був усіяний фашистською артилерією.\n\nНайважливіша частина будь-якої артилерійської команди — це спостерігач. Його завдання — знаходити цілі і вказувати на них того, хто стріляє з гармати. Сьогодні спостерігач точно побачив щось, але не ціль. Американський літак мчав до його позиції, і він приносив смерть. Він бачив, як вогонь розповсюджувався від його гармат, і лише зморщив лице. Спостерігач підняв рацію до губ і щось сказав — попередження? Крик про допомогу? Ніхто не міг сказати — це було заглушено звуками вибухів і вогню. Літак за літаком пролітав над тим, що колись було артилерійською позицією, сигналізуючи, що вторгнення почалося. Ця історія розвивалася навколо Домініканської Республіки, американські літаки били по військових цілях. Нижче літаків, на морі, десантні судна вибухали на берег — і понад дві тисячі чоловіків штурмували їх — борючись за свободу, борючись проти фашизму.\n\nАтака ззовні поєднувалася з атакою зсередини: повстанці, партизани, натовпи — всі приєднувались до своїх товаришів ззовні в боротьбі за скинення диктатора. Використовувалися різні види зброї, від сучасної, яку постачала ФБР, до стародавньої зброї, що передує Першій світовій війні. Тимчасові списи, дубини — все, що могло допомогти покласти край режиму.\n\nЗусилля увінчалися успіхом. До того, як Трухільйо мав ясну картину ситуації, висадка в Пуерто-Плата успішно відбулася — і незабаром після цього, допоміжна висадка в Лупероні, за 30 кілометрів на захід, мала той самий результат. У Білому домі в Ситуаційній кімнаті президент Річард Ніксон кивнув на того, хто сидів навпроти нього з вусами. Фідель Кастро кивнув у відповідь — командант Бая щойно надіслав телеграму."
HIS_puertoplata.10.a: "Периметр встановлений; висадка - визначний успіх. Продовжуємо до наступного етапу."
HIS_puertoplata.10_tt: "§xОперація почалася.§!"

HIS_PP_flavor.2.t: "Перемога"
HIS_PP_flavor.2.desc: "Якби домініканець почув звук хрумтіння чобіт на шляху до палацу, він одразу згадував би військові паради генералісімо Трухільйо до Національного палацу, що відбулися кілька місяців тому. Але цей парад був парадом тріумфу — ті, хто прийшли скинути фашистів, досягли своїх цілей. Обійнявшись, команданте Бая і команданте Орнес йшли в ряд зі своїми товаришами по зброї; Урібаррі, Морган, Менойо, Кубела та Каамано, їхні зброї носилися за спинами. За ними йшла змішана почесна варта з легіонерів і повстанців. Бая поглянув вперед на елегантну купольну будівлю, якою був Національний палац. Вона не була такою розкішною, як колишній президентський палац у Ла-Гавані, але зберігала ту ж красу. Однак вона не залишилася без пошкоджень через бої, які розгорнулися раніше, коли Санто-Домінго стало швидким і жорстоким полем бою. Вікна були розбиті, стіни й стовпи покриті кульовими влученнями, а дим піднімався з куполу, де гасили вогонь.\n\nБої закінчились, і сцени, що послідували за тріумфом Фіделя, тепер повторювалися на вулицях Домініканської Республіки. Спільники виокремлювалися та заганялися в автівки силами повстанців, в той час як лояльні сили здавалися легіонерам і йшли з піднятими руками і похиленими головами. Меморабілії спільників горіли на вулицях, статуї були розбиті на частини, будинки розграбовані. Повстанці і захоплені лоялісти допомагали сумуючим цивільним збирати тіла з вулиць.\n\nПарад зупинився, і повстанці пройшли до палацу. На відміну від революції Фіделя, зустріч була напружена, а не братерська. У всіх були різні уявлення щодо майбутнього, і їхній союз починав тріщати по швах. Але вони повинні були підтримувати громадську вигляд.\n\nОтже, вони стояли на сходах палацу, знову з'єднавши руки, поки Орнес не вийшов до трибуни, оточений прапорами Легіону. Під ним стояли журналісти з усіх Карибів, здебільшого американські та мексиканські, кілька телекамер і натовп, що махав кубинськими та домініканськими прапорами. Орнес не був Фіделем, але його авторитарний голос миттєво привернув увагу.\n\n"Революціонери! Сьогодні ми покінчили з останніми залишками фашистської тиранії Трухільйо, і тепер ми можемо розпочати процес реорганізації. Я служитиму головою тимчасового правління всіх антифашистських сил, поки не відбудуться вибори..."
HIS_PP_flavor.2.a: "¡Viva la Revolución!"

