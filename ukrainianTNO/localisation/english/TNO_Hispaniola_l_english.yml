HIS_PP_flavor.4.t: "Президентське відчайдушність"
HIS_PP_flavor.4.desc: "Купи заяв про відставку височіли на Резолютному столі, багато з них подано з розчаруванням за словами. Деякі були подані з краплями сліз, що ще не висохли на папері. Халдеман стояв в Овальному кабінеті нерухомо, його звичайний безбарвний вираз обличчя накривав його обличчя, поки він дивився на Ніксона. Президент сидів у своєму шкіряному кріслі, його ноги були твердо на землі, і його погляд губився в малюнках дуба та махагону на Резолютному столі.\n\nЧоловік, ймовірно, з ФБР, увійшов з манільським конвертом у правій руці. Поклавши конверт на Резолютний стіл, він готувався говорити перед Ніксоном, раптово піднявшись, наче прокинувшись від сну, вибухнув. "Що, чорт забирай, сталося? Ми витратили на це прокляту купу грошей, ми зробили все, що могли, а якийсь бідний синок і той... чортів Трухільйо, відкидають прокляте вторгнення!" Чоловік дивився на Ніксона, вибираючи мовчати. Збивання слів розкидалися в крику Ніксона, але повідомлення було ясним.\n\n"Чому ми не могли просто... чорт! Чому ми не могли просто знищити цих проклятих!" Ніксон крутив руками в повітрі безцільно. "Ми все ще можемо їх закопати? Можемо придумати чортову причину для вторгнення?" Чоловік відкрив рот, але Ніксон перервав себе. "Ні — чорт забирай, преса все розпізнає. Якийсь державний відділ викине цю чортову ідею до того, як ми навіть встигнемо її спланувати!" Кінець крику Ніксона змусив кімнату замовкнути перед тим, як він голосно вигукнув одне слово. "Іди." \n\nЧоловік стояв у шоковому стані, перш ніж зрештою йти. Президент важко зітхнув, сильно стискаючи руки, як він впав назад у своє місце. Халдеман терпів тишу в кімнаті після того, як двері закрилися. "Якщо чуєш, що якийсь чорт говорить пресі," почав Ніксон з обмеженням, "звільни їх. І позбудься всього, що зв'язує мене з цією чортовою катастрофою."
HIS_PP_flavor.4.a: "Звичайно, сер."

HIS_PP_flavor.5.t: "Бик і півень налякають орла"
HIS_PP_flavor.5.desc: "Більшість днів в Іберійському посольстві в Домініканській Республіці були спокійними. Незважаючи на те, що воно було одним з найрозкішніших представництв Іберії за кордоном, часто спостерігалися небагато подій, окрім того, щоб служити мостом між бізнесменами Європи та маленькою Карибською країною. Але сьогодні був особливий випадок. Штори були зачинені, а двері замкнені зсередини. Сьогодні посольство мало свою приватну святкування.\n\nОфіційно жоден іберійський урядовець з Португалії або Іспанії не святкував чи жартував про смерть американських громадян під час невдалої висадки в Домініканській Республіці. Насправді, всі іберійські бізнесмени та політики того дня зібралися в Іберійському посольстві, щоб похлопати один одному по спинах за добре виконану роботу. Адже перемога Трухільйо означала перемогу для Іберії.\n\nРаптом з'явилися десятки американців, які стали військовополоненими в Домініканській Республіці, і тепер Ніксон мав вигинатися назад, щоб хоча б деяких із них повернути. І хто ж міг би бути кращим для медіації таких переговорів, як дружня (достатньо) держава в Європі, з зв'язками як з американцями, так і з домініканцями? І не дивно, що Іберія повністю відповідала цьому опису. Тепер посол і іберійські промисловці потирали руки від усіх послуг, які США незабаром повинні їм усім, і Трухільйо теж.\n\nЗ забезпеченим правлінням Трухільйо від усіх ворогів, як внутрішніх, так і зовнішніх, Іберія тепер могла спокійно відпочивати в регіоні. Кіскея буде зобов'язана їм на багато років, і ніхто в владі не забуде цього."
HIS_PP_flavor.5.a: "¡Y que Trujillo siga mandando!"

HIS_PP_flavor.6.t: "Зростання напруженості в Анші"
HIS_PP_flavor.6.desc: "Ситуація ставала все гіршою.\n\nНельсон Жак був нікому не відомою особою. Колись він був простим гаїтянським селянином у Анші, дещо ізольованим, але в межах розумної відстані від сусідніх громад. Ця ізоляція, можливо, була єдиним, що врятувало його під час окупації домініканців. Йому довелося навчитися змінювати себе, приховувати свій франкомовний акцент і вдавати, що він просто ще один чорний домініканець.\n\nЙому потрібно було тримати голову низько. Він бачив, що траплялося з тими, хто цього не робив.\n\nЦілі міста і села були знелюднені домініканськими переселенцями, яких підтримувала армія. Людей, які відмовлялися, вбивали, а якщо вони боролися, то як колективне покарання завжди слідували жорстокі репресії. Він втратив сім'ю та друзів під час окупації: одні загинули, інші зникли.\n\nВін думав, що, можливо, домініканці залишать його в спокої, і він зможе якось вижити тут, але ситуація змінювалася, і в повітрі висіла зловісна атмосфера. Це були не просто переселенці, це були не просто домініканці, які поводилися жорстоко заради забави — в усьому цьому був сенс. Він помітив вантажівки, що проїжджали повз, завантажені припасами, з колонами солдатів у супроводі.\n\nВідбувалося щось більше. Зростаючу напруженість відчували всі. Для вигнання чи переслідування бідних гаїтянських селян їм не потрібні були тисячі солдатів. Вони готувалися до чогось, і він боявся, що знає, до чого саме. І якщо він мав рацію, то чим довше він залишався, тим більшою ставала небезпека."
HIS_PP_flavor.6.a: "Бочка з порохом."

HIS_PP_flavor.7.t: "Спалюючи міст"
HIS_PP_flavor.7.desc: "Дим наповнював кожну кімнату посольства, а тріск полум'я змішувався з ударами елегантних чорних туфель. Усі, окрім одного, зайняли себе закриванням розбитих вікон простирадлами та пальтами або переносили ящики з документами прямо до сміттєвих баків, які випускали полум'я. Зовні кілька нещасливих членів персоналу, обраних для того, щоб опинитися під вогнем, робили все можливе, щоб заспокоїти натовпи, які збиралися біля будівлі. Незважаючи на всі їхні крики і махання білими прапорами, нескінченна маса людей повзла все ближче. І все, що робив посол, це сидів за своїм столом, тримаючи голову в руках.\n\nВоно було прямо перед ним. Звичайний телефон. Чорний і пластиковий, як тисячі інших. Але для посла він міг би мати напис «політичне самогубство» великими червоними літерами. Був один варіант, який міг би дати йому більше часу. Один варіант, який міг би захистити його і решту персоналу. Один варіант, який міг би забезпечити, щоб Іберія зберегла обличчя в цій катастрофі. Або, точніше, був один народ, який міг би зробити це.\n\nАмериканці могли б стримати своїх божевільних собак на острові й зупинити їх від нападу на персонал чи на нього. Американці могли б дати їм літак назад до Штатів, а потім назад до Іберії. Американці могли б забезпечити, щоб їхня преса не говорила занадто багато про зв'язки Іберії за останні кілька тижнів. Йому доведеться благати і ставати на коліна, але вони б це зробили. Відчай змусив би людину на все, навіть пожертвувати всіма картами, які залишилися у Іберії в Карибському басейні, на користь американців. І посол був настільки відчайдушним."
HIS_PP_flavor.7.a: "Знати, коли відступити."

HIS_PP_flavor.8.t: "ЗВІТ: СИТУАЦІЯ В ДОМИНІКАНІ"
HIS_PP_flavor.8.desc: "ЦІЛКОМ ТАЄМНО\nТІЛЬКИ ДЛЯ ОЧЕЙ\nДЛЯ ВСІХ ЧЛЕНІВ [getIntelAgencyCaps]\nОПЕРАЦІЯ БУРШТИН\n\nСЬЮДАД-ТРУХІЛЬО — СТОЛИЦЯ ДОМИНІКАНСЬКОЇ РЕСПУБЛІКИ\n\nЗавдяки успішній роботі МЗС Рейху та нашим хоробрим агентам у [getIntelAgencyShort] перемога була досягнута урядом Трухільйо в його боротьбі проти комуністичного Карибського легіону. Його американське керівництво та численні дезертири зі збройних сил, які приєдналися до нього, були вбиті, захоплені або втекли до Гаїті. Режим тепер консолідувався, а його вороги були ліквідовані.\n\nМожливість, яку це відкриває, неможливо переоцінити. Завдяки нашій ролі в перемозі Трухільйо, ми маємо можливість зміцнити стосунки з його урядом. Більше того, нам вдалося глибоко проникнути в домініканську розвідку, що буде надзвичайно корисним у майбутньому.\n\nПопри це, головна мета нашої операції успішно досягнута: не дозволити американцям закрити вразливу точку в їхньому «задньому дворі». Усі, хто брав участь у успішному виконанні цього завдання, були рекомендовані своїм відповідним начальникам для належного визнання та нагород.\n\nНЕХАЙ НІМЕЧЧИНА БУДЕ У БЕЗПЕЦІ."
HIS_PP_flavor.8.a: "Кинджал, спрямований у підчерев'я Америки — і він наш, тільки наш!"

HIS_PP_flavor.9.t: "Інцидент в Анші"
HIS_PP_flavor.9.desc: "Учора опівдні партизанські солдати ППЛН, які ховалися на віддаленій базі в Альпійському лісі, атакували село вздовж гаїтянсько-домініканського кордону. Природно, нічого з цього не є правдою, але цього достатньо, щоб Трухільйо міг виправдати введення воєнного стану в усьому регіоні навколо Анші, а також уздовж кордону з Гаїті, посиливши вже й так значну військову присутність у цьому регіоні. Це явно і очевидно є приводом для вторгнення.\n\nСказати, що Білий дім або Капітолій погано відреагували на ці новини, було б применшенням: Конгрес обурений, Пентагон кипить, а надто багато гаїтянських і домініканських цивільних осіб, за будь-якими розумними мірками, опиняться між вогнем; вищі військові кола у Вашингтоні припускають, що вторгнення до Гаїті почнеться максимум за тиждень. У той час перспектива втручання ляже на стіл президента, незважаючи ні на що."
HIS_PP_flavor.9.a: "Іспаніола затамувала подих..."

HIS_PP_flavor.10.t: "ЗВІТ: СИТУАЦІЯ В ДОМИНІКАНІ"
HIS_PP_flavor.10.desc: "ЦІЛКОМ ТАЄМНО\nТІЛЬКИ ДЛЯ ОЧЕЙ\nДЛЯ ВСІХ ЧЛЕНІВ [getIntelAgencyCaps]\nОПЕРАЦІЯ БУРШТИН\n\nСЬЮДАД-ТРУХІЛЬО — СТОЛИЦЯ ДОМИНІКАНСЬКОЇ РЕСПУБЛІКИ — ПІД АМЕРИКАНСЬКИМ ПАНУВАННЯМ\n\nУсі німецькі агенти були безпечно евакуйовані з Домініканської Республіки, і наші сліди були приховані настільки, наскільки це можливо. На жаль, через некомпетентність режиму Трухільйо та його наступника криптокомуністи Карибського легіону об’єдналися з бунтівними збройними силами, щоб перемогти законний уряд острова та поставити його під американське панування.\n\nМісцезнаходження колишнього президента невідоме. Ми у [getIntelAgencyShort] намагаємося його знайти, але не можемо обіцяти корисного результату. Крім того, хоча у Фронту повстанців достатньо ідеологічної несумісності, щоб розділитися на фракції, жодна з цих фракцій не буде хоча б віддалено настільки ж готовою співпрацювати з урядом Рейху, як попередній режим.\n\nМожна з упевненістю сказати, що наші зусилля в Домініканській Республіці зараз повністю втрачені. Нам краще не турбувати цей регіон Карибського басейну найближчим часом, інакше американці використають це як привід створити для нас проблеми в невигідному місці.\n\nНЕХАЙ НІМЕЧЧИНА БУДЕ У БЕЗПЕЦІ."
HIS_PP_flavor.10.a: "Ну що ж. Це було варте спроби."

HIS_PP_ceasefire.1.t: "Іграшкова війна"
HIS_PP_ceasefire.1.desc: "Президент Ніксон скликав екстрене засідання у Ситуаційній кімнаті Білого дому, а потім дочекався, поки впевниться, що він увійде останнім. Він хотів, щоб чоловіки підвелися, щоб справити враження в майбутніх описах цієї зустрічі. Він виправив свій костюм, випростав спину і зайшов до кімнати з удаваною невимушеністю. \"Панове,\" — сказав він, коли радники з питань оборони підвелися на знак уваги. Ніксон відзначив відсутність мексиканців і кубинців. Сьогодні був лише внутрішній круг. \"Давайте поговоримо про Трухільйо.\"\n\nІ тоді військова машина запустилася. Молоді радники розклали моделі Домініканської Республіки на столі, пересуваючи фігурки, що представляли сили, пов'язані з повстанцями, і домініканські війська, а також деякі фігурки, які символізували ймовірну присутність іберійських і німецьких активів. Маленька відкинута фігурка Трухільйо з великим хрестом, намальованим через його обличчя, лежала збоку. Америка досягла своєї мети, перемогла потенційного тирана і поставила крапку в його грандіозних амбіціях. Згідно з доповіддю, Сполучені Штати могли б тепер повернутися додому з високо піднятою головою.\n\n\"Я відчуваю, що наближається 'але', панове,\" — сказав Ніксон хитрим голосом.\n\nОдин із радників оглянув кімнату, ніби переконуючись, що ніхто не підслуховує. \"Сер, смерть Трухільйо є великою перемогою, але є можливість зміцнити її, гарантуючи стабільне, проамериканське керівництво в довгостроковій перспективі\" — він зробив паузу і взяв фігурку з дошки. \"Хоакін Балагер, права рука Трухільйо, взяв владу після смерті свого начальника. Є деякі ранні повідомлення, що він навіть міг стояти за цим. Виходячи з його рішення шукати припинення вогню з нашими хлопцями, ми вважаємо, що він набагато, набагато більш розсудливий лідер. Ми віримо, що він буде відкритий до... дипломатичного вирішення цієї кризи, і ми тепер маємо необхідні канали зв’язку для цього. Він із задоволенням відновить торгівлю та посадить нас за один стіл із іберійцями.\"\n\n\"А кубинці й мексиканці — ні, я так розумію?\"\n\n\"Вони мають... моральні застереження.\" Пауза. \"Вони хочуть, щоб Балагер загинув, і можуть відреагувати погано, якщо ми домовимося.\""
HIS_PP_ceasefire.1.a: "Привабливо, але ці виродки нас уб'ють, якщо ми приймемо пропозицію. Балагер має піти."
HIS_PP_ceasefire.1.b: "Чому нас повинні хвилювати чортові моральні застереження кубинців? Скажіть Балагеру, що ми готові слухати."

HIS_PP_ceasefire.2.t: "Світанок в Домінго"
HIS_PP_ceasefire.2.desc: "\"Містере Буш! Ласкаво просимо до Санто-Домінго,\" — ці слова зустріли техасця родом із Массачусетсу, коли він зійшов із С-46 на злітну смугу. Невелика почесна варта домініканських солдатів чекала поряд із маловідомим міністром, що тепер став президентом Домініканської Республіки.\n\n\"Дякую, президенте Балагер. Це велика честь бути тут від імені мого уряду.\" Дипломат віддав чоловікові чіткий салют.\n\n\"Для мене також, містере Буш,\" — відповів президент, ведучи його до поруч припаркованого джипа. У водійському кріслі вже сиділа людина. \"Мені шкода, що мирне врегулювання було неможливим у підсумку. Я розумію, що це спричинило вашому уряду великі труднощі з Гаваною і Мехіко-Сіті, чи не так?\"\n\n\"Е-е, так, пане президенте.\" Кулі, що залишили сліди на будівлях, нагадували, наскільки недавнім був мир. \"Я був відправлений із жалем повідомити вам, що, е-е, Сполучені Штати не зможуть повністю відновити нормальні дипломатичні відносини з вашим урядом на даний момент.\"\n\n\"Шкода, але це було очікувано,\" — насупився президент, коли вони в'їхали до міста. Розслаблені, спокійні солдати все ще патрулювали вулиці, а забиті вікна залишалися частим видовищем. \"Проте, я впевнений, що все буде забуто з часом, і мій уряд вдячний вашій країні за допомогу у відновленні порядку в ці важкі часи.\""
HIS_PP_ceasefire.2.a: "\"Я розумію, ви заробили свої статки на нафті?\""

HIS_PP_ceasefire.3.t: "Мікроменеджмент катастрофи"
HIS_PP_ceasefire.3.desc: "Ніксон цього зовсім не очікував. Америка підтримала Легіон усіма можливими ресурсами, а потім вирішила зробити нерозумний поворот і зрештою програла тій самій стороні, яку підтримувала спочатку. Це повний провал у міжнародних відносинах, що тільки й чекає, щоб трапитися, особливо з урахуванням того, як преса тисне на уряд у пошуках відповідей.\n\nТреба було зробити все можливе, щоб американський уряд залишався у добрих відносинах із союзниками, оскільки Центральне командування не впоралося зі своїм завданням.\n\nНіксон мав протистояти реакції з боку преси і замести все під килим, особливо з огляду на те, що чутки почали ширитися деякими регіонами країни. Можливо, вони могли б зробити щось настільки сміливе, як визнання нового уряду.\n\nХоча ситуація загалом і не була до кінця 'катастрофічною', вона безперечно досягне цього, якщо Ніксон її проігнорує. Треба було щось зробити, щоб заспокоїти ситуацію. Офіс Президента мав шукати вихід — цапа-відбувайла, квиток із цього хаосу."
HIS_PP_ceasefire.3.a: "Це повинно спрацювати, безумовно."

HIS_PP_ceasefire.4.t: "Американська пропозиція"
HIS_PP_ceasefire.4.desc: "Пишу, повідомляючи про недавній розвиток подій у триваючому конфлікті на Гаїті та потенційне вирішення кризи. Після багатьох годин переговорів мій американський колега погодився підтримати деескалацію участі США в Карибському регіоні, якщо це буде зустрінено аналогічним зобов'язанням з боку Іберії.\n\nЗокрема, американський представник пропонує, щоб наші країни утримувалися від розгортання військових сил у Колумбії у світлі потенційної можливості поновлення відкритої війни там. Також він пропонує політику взаємного визнання позицій сторін на Гаїті, ефективно перетворюючи Домініканську Республіку на нейтральну територію.\n\nЯ хотів би особисто підтримати цю пропозицію, не в останню чергу тому, що багато часу було витрачено на переконання мого американського колеги прийняти ці умови, але також через величезну можливість дипломатичної розрядки між Іберією і США, яку ця угода відкриє. З огляду на бурхливий стан глобальних відносин останнім часом, шлях до нормалізації відносин із Вашингтоном буде корисним, навіть якщо ми зрештою вирішимо ним не скористатися. Більше того, відмова від пропозиції майже напевно призведе до нового спалаху конфлікту в Домініканській Республіці, який може не обов'язково розвинутися на користь Іберії.\n\nОднак, як завжди, вибір за вами, шановні Каудильйо."
HIS_PP_ceasefire.4.a: "Це очевидне рішення. Підпишіть."
HIS_PP_ceasefire.4.b: "Ми ніколи не поступимося Вашингтону."

HIS_PP_ceasefire.5.t: "Зводячи кінці з кінцями"
HIS_PP_ceasefire.5.desc: "Коли до Ніксона та Білого дому надходять повідомлення про перемогу Балагера, він міг лише зітхнути, потираючи скроню, поки дивився на газету, яку йому передав один із помічників.\n\nОзнайомившись із повідомленнями, він випростав піджак, потім встав і подивився у вікно на павільйон, розмірковуючи про себе, споглядаючи вид на галявину перед Білим домом.\n\nХоча рішення підтримати Об'єднаний фронт було зрештою його, на нього тиснули союзники Америки в регіоні. І знаючи ставки, було вже надто пізно відмовитися від підтримки Фронту, особливо після досягнення деяких вкрай необхідних дипломатичних успіхів.\n\nПроте він особисто шкодував про рішення не підтримати Балагера. Той здавався близьким за поглядами та міг дати йому удачу в азартній грі з європейською політикою. Можливо, навіть дозволивши йому посилити роль Америки у світі.\n\nАле Ніксон міг лише бажати такого другого шансу. Йому довелося робити все можливе з тим, що він мав зараз, з огляду на ситуацію. Коли Ніксон вийшов із павільйону, він звернувся до свого помічника, віддавши чіткий наказ."
HIS_PP_ceasefire.5.a: ""Скажіть прессі, що ми виконали місію зі знищення Трухільйо.""

HIS_PP_ceasefire.6.t: "Отримувач диму"
HIS_PP_ceasefire.6.desc: "В Овальному кабінеті було тихо, окрім нервового постукування ногою президента Ніксона. За дверима кабінету керівник апарату Білого дому Боб Галдеман тримав у долоні секундомір і поглядав на співробітників і техніків, що чекали сигналу. Потім у кабінеті задзвонив телефон, і президент миттєво підняв слухавку до вуха. \"Алло?\" — стурбовано промовив Ніксон, перш ніж із телефонної трубки прийшла добра новина. \"А як щодо, ну, Балагера? Вибув?\" Пролунав ще один задовільний відгук. Ніксон засміявся і промовив у слухавку: \"Б'юся об заклад, ці іспанці побігли з піджатими хвостами. Молодець.\" Палець торкнувся кнопки перемикання, і Ніксон додав: \"Очікуйте дзвінка незабаром,\" перш ніж завершити лінію. Це був сигнал Галдеману запустити свій секундомір.\n\nПотім почалася суєта кроків і коліс, коли команда Галдемана доставила перед стіл \"Рішучості\" передову конференц-зв'язок. \"Що за чортівня-\" Ніксон обірвався, побачивши натовп. \"Бобе, що це?\" Працівники під'єднали президентський телефон до пристрою й протягли кабелі за двері кабінету. Зосереджений на своєму секундомірі, Галдеман відповів: \"Для конференц-дзвінка, пане президенте,\" і недбало передав Ніксону відповідний меморандум зі свого стола. Цей гігант AT&T поєднав чотири столиці в одну лінію та забезпечив, щоб голос президента звучав найголосніше. Керівник апарату зупинив свій секундомір. Час настав.\n\n\"Привіт, Фіделю!\" — вигукнув Ніксон у трубку, розмовляючи в реальному часі з кубинським колегою. Голос президента Кастро рознісся через динаміки: \"Президенте Ніксоне, всім заслужені вітання!\" На лінії також були президент Мексики та представники нового домініканського уряду в Маямі та Санто-Домінго, які висловили схожі побажання. Потім усі заговорили одночасно, і звук став неприємно спотвореним. Зморщивши обличчя, Ніксон продовжив: \"Наші хлопці з Об'єднаного фронту здобули важку перемогу, і ми у Вашингтоні п'ємо за вашу удачу.\" Ще одна какофонія, ймовірно, тост за добрі стосунки, пролунав як подряпаний вініл, але Ніксон підіграв. Ця клята машина, думав він, але він не був тим, хто зіпсує святкування."
HIS_PP_ceasefire.6.a: ""¡Salud!""

HIS_PP_ceasefire.7.t: "Тонучи в молоці та меді"
HIS_PP_ceasefire.7.desc: "Вільям Теплі Беннетт-молодший був американським послом в Іберійському Союзі та проникливим дипломатом. Управляючи ситуацією в Пуерто-Плата від самого початку вторгнення Легіону, він міг нарешті зітхнути з полегшенням, знаючи, що перемога забезпечена.\n\nЗ усіма додатковими військовими коштами, виділеними Вашингтоном на війну, Вільям перенаправив значну частину з них на розкішну вечірку в посольстві, запросивши багатьох впливових осіб нового уряду. Серед ключових гостей був президент Балагер, який люб’язно прийняв запрошення, а також інші політичні фігури.\n\nПопри величезну кількість претензійності, зміна в дипломатії залишалася очевидною для обох сторін. Це було особливо помітно, коли Вільям підняв келих за здоров'я Балагера, який сидів ліворуч від нього, і промовив про \"нові початки\" не лише для Домініканської Республіки, але й для відносин між Америкою та Іберією.\n\nЗвісно, жодного медіа-висвітлення цієї події не було, щоб уникнути можливих суперечок щодо неї. Проте деякі гості не могли не пліткувати, спостерігаючи за послом, який піднімав тости."
HIS_PP_ceasefire.7.a: "Стерв'ятники кружляють над новою Республікою."

HIS_PP_ceasefire.9.t: "Припинення вогню"
HIS_PP_ceasefire.9.desc: "ЦІЛКОМ ТАЄМНО\nЛИШЕ ДЛЯ ОЧЕЙ\nДО ВСІХ ЧЛЕНІВ [getIntelAgencyCaps]\nОПЕРАЦІЯ БЕРНШТЕЙН\n\nМІСТО ТРУХІЛЬО - ДОМІНІКАНСЬКА РЕСПУБЛІКА\n\nРозвідувальні звіти свідчать, що недавній переворот Балагера проти Рафаеля Трухільйо, багаторічного диктатора Домініканської Республіки, призвів до встановлення нестабільного перемир'я між урядовими силами та повстанцями, підтримуваними США. Непідтверджені чутки стверджують, що Балагер шукає угоди з урядом США для подальшої співпраці чи дипломатичного вирішення. Якщо це правда, така угода становитиме ризик для німецьких планів у Карибському регіоні та загрожуватиме покращенню відносин між США та Іберією, що створює негайну загрозу німецькому контролю в Європі.\n\nРекомендується негайна диверсійна операція для розпалювання ворожнечі між повстанцями та урядом. Найбільш підходящою для цього була б Спеціальна Оперативна Група Бранденбург. Перемир'я необхідно порушити, щоб зупинити переговори.\n\nНЕХАЙ НІМЕЧЧИНА БУДЕ В НАДІЙНИХ РУКАХ."
HIS_PP_ceasefire.9.a: "Мир — така складна річ."

HIS_PP_ceasefire.10.t: "Припинення вогню — Приходить Америка"
HIS_PP_ceasefire.10.desc: "Телефонна лінія з іберійського посольства міста Трухільо до Мадрида, на щастя, залишилася незрізаною під час хаосу, і незабаром вона стала життєво важливою ланкою зв’язку з дедалі стурбованішими Салазаром і Франко. Їхній колишній союзник — трохи дивак, так, але хіба є сильні люди без дивацтв? — потрапив прямо на приціл американської імперії, а тепер його усунули власні ж люди? Балагер здавався досить дружнім, і дійсно йому вдалося якось домовитися про перемир'я між ним і повстанцями, але тепер тягар лежав на американцях, щоб вони прийшли й обговорили все — і, судячи з того, як вони підтримували це повстання, не було певності, що вони це зроблять.\n\nОстання телеграма прийшла приблизно о першій ночі за іспанським часом. Наступний ранок провели у тривожному очікуванні, ходінні туди-сюди та обговореннях. Що їм робити? Що вони могли зробити? Іберія не могла дозволити собі втратити свій плацдарм у Західній півкулі, і водночас не мала засобів рішуче протистояти американській машині. Не вистачало влади, людей, зброї, щоб змагатися. Все залежало від Вашингтона.\n\nНарешті радіотиша була перервана ще однією телеграмою, яка вдарила, як блискавка. Вона прийшла до Вашингтона, а Вашингтон відповів \"ні\". Війна триватиме. Франко зітхнув, Салазар упав у крісло — наступні кілька тижнів принесуть або перемогу, або поразку."
HIS_PP_ceasefire.10.a: "Холодна війна не шкодує жодного куточка світу."

HIS_PP_ceasefire.11.t: "Припинення вогню — Приходить Америка"
HIS_PP_ceasefire.11.desc: "Телефонна лінія з іберійського посольства міста Трухільо до Мадрида, на щастя, залишилася незрізаною під час хаосу, і незабаром вона стала життєво важливою ланкою зв’язку з дедалі стурбованішими Салазаром і Франко. Їхній колишній союзник — трохи дивак, так, але хіба є сильні люди без дивацтв? — потрапив прямо на приціл американської імперії, а тепер його усунули власні ж люди? Балагер здавався досить дружнім, і дійсно йому вдалося якось домовитися про перемир'я між ним і повстанцями, але тепер тягар лежав на американцях, щоб вони прийшли й обговорили все — і, судячи з того, як вони підтримували це повстання, не було певності, що вони це зроблять.\n\nОстання телеграма прийшла приблизно о першій ночі за іспанським часом. Наступний ранок провели у тривожному очікуванні, ходінні туди-сюди та обговореннях. Що їм робити? Що вони могли зробити? Іберія не могла дозволити собі втратити свій плацдарм у Західній півкулі, і водночас не мала засобів рішуче протистояти американській машині. Не вистачало влади, людей, зброї, щоб змагатися. Все залежало від Вашингтона.\n\nНарешті радіотиша була перервана хорошими новинами, що стало приємною несподіванкою. Балагер, завдяки якомусь невеликому диву і, ймовірно, значній сумі фінансування, зміг умовити американців, а посольство було готове допомагати у проведенні мирних переговорів. Франко посміхнувся, Салазар подякував Господу — не все було втрачено."
HIS_PP_ceasefire.11.a: "Тепер час для справжньої роботи."

HIS_PP_ceasefire.13.t: "Непокора"
HIS_PP_ceasefire.13.desc: ""Прочитайте це," — гаркнув Ніксон.\n\nПомічник здригнувся, але виконав наказ.\n\n"ДО ПРЕЗИДЕНТА НІКСОНА ВАШИНГТОН\nВІД ХОАКІНА БАЛАГЕРА САНТО-ДОМІНГО\n\nВИМОГИ, ПРЕД'ЯВЛЕНІ УРЯДОМ СПОЛУЧЕНИХ ШТАТІВ ЩОДО МОЄЇ ВІДСТАВКИ ТА ОРГАНІЗАЦІЇ УРЯДУ ТАК ЗВАНОГО \"ПРИМИРЕННЯ\" З ПОВСТАНСЬКИМИ СИЛАМИ, Є ОБРАЗОЮ ТА ЗНЕВАГОЮ СУВЕРЕНІТЕТУ ДОМІНІКАНСЬКОЇ РЕСПУБЛІКИ СТОП ЦЕ БЕЗСУМНІВНО НІЩО ІНШЕ, ЯК ГРА З ВОГНЕМ, ЯКЩО СПОЛУЧЕНІ ШТАТИ СТАНУТЬ НА БІК ГРУПИ ОPORTУНІСТИЧНИХ КОМУНІСТІВ СТОП\n\nБАЛАГЕР"\n\nРеакція Ніксона була передбачуваною. Розірвавши копію телеграми, коли помічник передав її йому, він закричав на чиновників у кабінеті: \"Цей виродок! Чортовий фашистський сучий син, ким він себе вважає, щоб кидати виклик Америці? Він сам підписав собі смертний вирок!\""
HIS_PP_ceasefire.13.a: ""Ви йдіть і скажіть тим "опортуністичним комуністам", що ми тепер на їхньому боці!""

HIS_PP_ceasefire.14.t: "Весело крокуємо до пекла"
HIS_PP_ceasefire.14.desc: ""...отже, містере Президенте, дипломатичне перемир’я між Об'єднаним фронтом і Домініканською Республікою, ну, воно розірване." Нервовий помічник проковтнув слину, намагаючись заспокоїти пересохле горло. "Конфлікт відновлено з обох боків, і-"\n\n"Чи знають про це газети?" — різко перебив Ніксон, з його чола скочувалася крапля поту. Пальці міцно тримали ручку, барабанячи нею по столу, створюючи ритм для думок.\n\n"Ні, містере Президенте, принаймні поки що ні."\n\nНіксон кивнув, потім повернувся до начальника розвідки, дивлячись тому прямо в очі. "Я ж казав вам, хлопці, цей чортів дурень обернеться проти нас, таким людям довіряти не можна. Я казав вам із самого початку, казав, коли він відмовився піти у відставку, і кажу зараз: раз фашист — завжди фашист."\n\nЧоловік, який отримав словесний удар Ніксона, кивнув, дозволяючи президенту продовжувати.\n\n"Я хочу, щоб ви хлопці вдарили цього виродка всією міццю демократії, зрозуміло? Покажіть світу, що якщо ви зачепите нас, ми вас поховаємо." Ніксон махнув ручкою у бік начальника. "Я хочу, щоб ви перерізали їхні лінії зв'язку, я хочу, щоб Об’єднаний фронт знав про кожен чих домініканців, я хочу, щоб ви напхали стільки зброї Кастро, що він стрілятиме кулями у Балагера, зрозуміли?"\n\n"Так, містере Президенте, зрозуміло."\n\n"Добре, добре, добре." Ніксон повернувся до барабанного ритму, намагаючись змусити мозок затихнути. Він намагався зберігати спокій, але внутрішнє напруження почало прориватися. Чи сталося б усе це, якби він просто вирішив підтримати цього виродка з самого початку? Чи варто було підтримувати цих жалюгідних повстанців в ім’я демократії, якщо це означало, що Америка зазнає поразки перед світом?\n\nОдним помахом руки він відпустив усіх присутніх, і, залишившись на самоті в Овальному кабінеті, Річард Ніксон почав варитися у власних думках."
HIS_PP_ceasefire.14.a: "Запізно, запізно, запізно."

HIS_PP_ceasefire.15.t: "Ультиматум"
HIS_PP_ceasefire.15.desc: "Шановний Вільям Таплі Беннетт-молодший, американський посланець у Домініканській Республіці, поспішав зібрати свої речі та покинути Сантьяго-де-лос-Кабальєрос. Його супровід мав бути евакуйований до Пуерто-Плата, а звідти — до Америки. Президент дав йому останнє секретне завдання; він мав евакуюватися до Санто-Домінго, щоб діяти як зв'язок між Балагером та Вашингтоном.\n\nУ цьому напівготельному номері, напівімпровізованому офісі, йому було доручено знайти мирне вирішення кризи. Віддалений артилерійський обстріл свідчив, що всі місяці важкої роботи були марними. Сирени лунали безупинно, пожежі спалахували в поліцейських дільницях і військових казармах, які близько п'ятнадцяти хвилин тому бомбардували Військово-повітряні сили Домінікани.\n\nВін вилаявся, почувши стук у двері, і залишив валізу, щоб відчинити. Одразу до кімнати увірвалися група офіцерів-домініканських повстанців, які збунтувалися після вторгнення в Пуерто-Плата кілька місяців тому. Очолював групу знайоме обличчя й остання людина, яку Беннетт хотів би побачити; полковник Франциско Альберто Кааманьо.\n\nВони пильно дивилися один на одного. Посланець у своєму зім’ятому костюмі, полковник у своєму розтріпаному оливковому мундирі, обличчя спітнілі, зі злими поглядами. Їхня палка дискусія іспанською тривала п’ять хвилин, супроводжувалася криками сирен повітряної тривоги та гуркотом далеких вибухів. Вони не зволікали, і незабаром почали кричати.\n\n\"Скажіть Балагеру припинити бомбардування!\" — гаркнув Кааманьо. Беннетт, втративши самовладання, гримнув кришкою валізи та закричав: \"Зараз не час для переговорів, це час для вашої капітуляції!\"\n\nКааманьо та його товариші замовкли, очевидно, роздратовані й розлючені. Коли полковник заговорив, його тон був холодним, як зима у Вайомінгу.\n\n\"Тоді дозвольте мені сказати вам, що ми продовжуватимемо антифашистську боротьбу, щоб не сталося.\""
HIS_PP_ceasefire.15.a: "І, не попрощавшись, вони розійшлися різними дорогами. Один — геть від Балагера, інший — до нього."

HIS_PP_ceasefire.16.t: "Обіцянка Мадрида"
HIS_PP_ceasefire.16.desc: "\"Сподіваюся, це зрозуміло,\" сказав Балагер. \"Що Домініканська Республіка в боргу перед Іберією. Надана підтримка була безцінною — ми б не змогли реорганізувати й дисциплінувати Збройні сили без іберійської допомоги.\" Він усміхнувся. \"Це принесе нам перемогу.\"\n\nЦю думку підтримали й інші радники з безпеки та офіцери, що також зібралися навколо столу. Іберійський посол виглядав задоволеним, і в кімнаті панувала атмосфера полегшення, адже вони всі тісно співпрацювали протягом усього цього періоду. З огляду на те, що війна майже напевно відновиться з початком перших обстрілів позицій повстанців, подальша підтримка Іберії була не просто важливою — вона була життєво необхідною.\n\n\"Я надаю свої власні гарантії, а також гарантії Мадрида,\" посол з’єднав пальці рук. \"Ми продовжуватимемо підтримувати вас беззастережно.\" Його губи скривилися у невеликій насмішкуватій усмішці. \"Якщо ці комуністи бажають загрожувати іспанській єдності, вони побачать, що наша рішучість є непохитною.\"\n\nВін зробив кілька нотаток, продовжуючи. \"Більше агентів наших спецслужб прибуде найближчим часом, так само як і офіцери для продовження роботи з вашими силами. З огляду на ймовірне відновлення бойових дій, час має вирішальне значення. Реальність, яку, запевняю вас, Мадрид розуміє.\"\n\nЦе були надзвичайно добрі новини для Балагера. Їхня армія ще довго не зрівняється з іберійською — але він був упевнений, що її достатньо, щоб придушити комуністичних партизанів. Ціль цього етапу операції виконано, тепер можна було перейти до інших питань… військового характеру.\n\n\"Чудово,\" сказав Балагер. \"А з огляду на покращення наших Збройних сил, є сильна перевага у виборі іберійського обладнання. Сподіваюся, Мадрид готовий сприяти такій домовленості?\" Посол усміхнувся та дістав кілька документів із сумки."
HIS_PP_ceasefire.16.a: ""Вони безумовно готові. Давайте обговоримо деталі та ціни.""

HIS_PP_ceasefire.19.t: "Іберія погодилась"
HIS_PP_ceasefire.19.desc: "Державний департамент може ненадовго зітхнути з полегшенням, оскільки сьогодні надійшли новини про прийняття Мадридом запропонованого взаємного розрядження в Карибському регіоні. Іберія погодилася визнати позиції США в Домініканській Республіці та пообіцяла не втручатися військовим чином у Колумбію в обмін на аналогічні дії з боку США, що значно знизило напруженість у регіоні.\n\nПозитивна відповідь Мадрида також відкриває дорогу до подальшого дипломатичного примирення з Іберійським Союзом. Хоча кілька років тому це могло здатися неймовірним, з крахом Тріумвірату та смертю Гітлера стан європейської геополітики настільки змінився, що кроки до дружби між США та Іберією можуть бути успішними. Якщо Мадрид піде на зустріч, це може стати життєво важливим плацдармом у Європі..."
HIS_PP_ceasefire.19.a: "Перший крок до атлантичного братерства?"

HIS_PP_ceasefire.20.t: "Іберія відмовила"
HIS_PP_ceasefire.20.desc: "З Мадрида надійшла комюніке, яке інформує Державний департамент про те, що уряд Іберії вирішив відхилити нашу пропозицію щодо взаємного розрядження в Карибському регіоні, що, на жаль, відкидає назад прогрес у напрямку миру та постійного врегулювання в Домініканській Республіці, а також провіщає втручання Іберії в Колумбію.\n\nУ зв'язку з цим Департамент переглянув свої плани та прискорив підготовку до військової операції в Колумбії. Ще більш нагально, відмова Іберії поставила під загрозу політику США в Домініканській Республіці та фактично гарантувала, що Еспаньйола знову порине у громадянську війну. Наша поточна політика обережної підтримки уряду Балагера, спроби деескалації та пошуку компромісу, тепер повинна бути покинута, і ми маємо знову повністю підтримати повстанців. Державний секретар уже виступив із заявою, вимагаючи, щоб Балагер склав свої повноваження в рамках цієї дипломатичної зміни курсу."
HIS_PP_ceasefire.20.a: "Еспаньйола продовжуватиме горіти."

HIS_PP_ceasefire.21.t: "З робочого столу Хоакіна Балагера"
HIS_PP_ceasefire.21.desc: "Шановні Каудільйо Франко та Салазар,\nПишу вам, щоб висловити свою найглибшу вдячність за підтримку Іберійського Союзу в найскладнішій економічній ситуації Домініканської Республіки. Цей рік, мабуть, був найважчим для нашої молодої республіки, і наше виживання було б неможливим без ваших внесків.\n\nБудь ласка, будьте впевнені, що, незважаючи на чутки та наклепи, які ви можете почути, я та моя нація прагнемо забезпечити добрі відносини та поглиблення зв’язків з Іберійським Союзом. Як вдячні діти підтримують зв’язок зі своїми батьками довго після того, як вони залишають рідний дім, Домініканська Республіка не забула своїх коренів. Ми — нація, народжена відважними конкістадорами, які досліджували далекі береги, і хоча ми пройшли довгий шлях, частина нас ніколи не буде відокремлена від нашої прабатьківщини. Ми прагнутимемо підтримувати тісні відносини з вашим Союзом і сподіваємося бути вашими найсильнішими та найвідданішими союзниками у найближчі роки.\n\nНарешті, я закликаю вас не думати суворо про мою стриманість у публічному вираженні наших національних відносин. Хоча зовнішня політика є фундаментальним компонентом будь-якої держави, і міра нації визначається тим, як вона ставиться до своїх друзів і союзників, внутрішня ситуація займає настільки багато мого часу, що, на жаль, у мене залишається мало часу для розвитку цих відносин. Сподіваюся, ви розумієте, переживши трагічну громадянську війну у своїй пам’яті, яку увагу вимагає реконструкція у роки, що настають після кривавого конфлікту між братами. Якщо у ваших серцях знайдеться місце для продовження вашої щедрості, знайте, що у вас завжди буде друг у Карибському басейні.\n\nЗ повагою,\nДр. Хоакін Антоніо Балагер Рікардо"
HIS_PP_ceasefire.21.a: "Президент Домініканської Республіки."

HIS_PP_ceasefire.22.t: "Почесні гості"
HIS_PP_ceasefire.22.desc: "Шановні Каудільйо,\n\nМи висловлюємо вам нашу найглибшу вдячність за доброзичливість, з якою ви прийняли нас і наших співвітчизників у цю годину гострої потреби. Ваша гостинність до всіх домініканських патріотів є найдоречнішою даниною пам'яті нашого покійного брата та вічним зв’язком, який ви троє встановили між нашими народами.\n\nЗ найбільшою покірністю ми звертаємося до вас із проханням про ще більшу підтримку, Каудільйо цього чудового Іберійського Союзу. Адже ми не можемо дозволити, щоб Генераліссімус Рафаель Леонідас Трухільйо Моліна залишився непомщеним. Ми не можемо дозволити, щоб зрадник Пупо Роман оскверняв Національний палац. Ми не можемо дозволити, щоб сильний карибський союзник вашої могутньої держави став здобиччю янкі, мексиканців і їхніх божевільних комуністичних маріонеток.\n\nМи, справжній Конгрес Домініканської Республіки, позбавлені своєї батьківщини, але готові боротися, щоб повернути її. Якщо ви надасте нам фінансування, зброю та доступ до ваших дипломатичних ресурсів, ми зберемо лоялістів у домініканській армії та серед громадян, щоб боротися проти нелегітимного режиму Романа та його комуністичних поплічників у так званому \"Легіоні\". Щоб боротися за бачення, яке ви поділили з нашим братом.\n\nПеремога та помста будуть гарантовані для Кіскейї, а вічна вдячність і можливості для нашого іберійського союзника.\n\nЗ найвищою повагою,"
HIS_PP_ceasefire.22.a: "Гектор і Петан Трухільйо Моліна"

HIS_PP_ceasefire.23.t: "Благодійники та бенефіціари"
HIS_PP_ceasefire.23.desc: "Шановні Каудільйо,\n\nСьогодні день слави, день святкування у Мадриді, Лісабоні та Сьюдад-Трухільйо. Узурпатор Пупо Роман був усунутий з Національного палацу, і наш племінник, Рамфіс Трухільйо, взяв батьківський меч, щоб очистити нашу улюблену землю від комуністичних жебраків, які називають себе Домініканським революційним фронтом.\n\nЦя перемога була б неможлива без вашої щедрої підтримки справжнього Конгресу Домініканської Республіки, як у його законодавчій ролі, так і в об'єднанні його багатьох і доблесних вигнанців через писане слово. Завдяки Конгресу ми змогли донести до домініканських генералів і громадськості відомості про різанину, яку ці більшовицькі демони заподіяли б нашій землі. Побачивши, що Роман готовий передати країну цим безбожним виродкам на вимогу Вашингтона, Гавани та Мехіко, вони піднялися з люттю та доблестю, що віддзеркалює вашу в 1936 році, Каудільйо Франко.\n\nМи абсолютно впевнені, що ці праведні домініканські солдати придушать фальшивий легіон з тією ж легкістю, як і усунули узурпатора. З нашим племінником на полі бою та нами, що невтомно організовуємо справу та згуртовуємо спільноту вигнанців, іберійські інвестиції в наш національний порядок і обіцянки будуть виконані та відшкодовані в найкоротші терміни.\n\nЗ найвищою повагою,"
HIS_PP_ceasefire.23.a: "Гектор і Петан Трухільйо Моліна"

HIS_PP_ceasefire.24.t: "До Сьюдад-Трухільйо"
HIS_PP_ceasefire.24.desc: "Шановні Каудільйо,\n\nЗі шаною ми називаємо вас Благодійниками нації, адже домініканський народ завдячує вам цим титулом. З честю ми називаємо вас Лідерами, адже саме ваша військова допомога дала їм змогу скинути ярмо янкі-комуністів. З пристрастю ми називаємо вас братами, адже ви були братами для нас і братами для нашого покійного Рафаеля.\n\nІ з сумішшю найвищої радості та глибокого смутку ми повідомляємо вам, що відправимося до Еспаньйоли. Легіонери-злодії знищені, бунтівники 14 липня схоплені або вбиті, а порядок і мир повернуто в нашу батьківщину.\n\nДодаємо офіційну декларацію Конгресу Домініканської Республіки, останню та найважливішу, видану на іберійській землі. Вона звеличує відкриті серця іберійського народу та мудрість його великих лідерів у захисті домініканців, яких перемістили махінації США, Мексики та Куби, а також жертви іберійської нації в наданні нам засобів для порятунку нашої власної країни.\n\nЗнайте, що ми будемо згадувати наш час в Іберії з теплотою та намагатися приймати всіх іберійців з тією гостинністю, яку ви виявили нам і нашим побратимам.\n\nЗ найвищою повагою,"
HIS_PP_ceasefire.24.a: "Гектор і Петан Трухільйо Моліна"

HIS_PP_ceasefire.25.t: "Реакція на державний переворот у Домінікані"
HIS_PP_ceasefire.25.desc: "ЦІЛКОМ ТАЄМНО\nЛИШЕ ДЛЯ ОЧЕЙ\nДЛЯ ВСІХ ЧЛЕНІВ [getIntelAgencyCaps]\nОПЕРАЦІЯ «БУРШТИН»\n\nСЬЮДАД-ТРУХІЛЬЙО - ДОМІНІКАНСЬКА РЕСПУБЛІКА\n\nЗі значною підтримкою США секретар збройних сил Домінікани здійснив переворот проти Рафаеля Трухільйо, багаторічного лідера республіки. Члени родини Трухільйо, зокрема його син і передбачуваний наступник Рамфіс, були заарештовані або втекли до Іберії, тоді як частий співробітник [getIntelAgencyCaps] Джонні Аббес і більшість домініканської розвідки були знищені.\n\nРоман оголосив про припинення вогню з криптокомуністичними повстанцями, які окупували північ країни, та бере участь у переговорах за посередництва США та Мексики. Угода зміцнить його проамериканський уряд і посилить вплив Вашингтона в Карибському регіоні.\n\nРекомендується негайна диверсійна операція для розпалювання ворожнечі між повстанцями та урядом. Найкращим рішенням буде розгортання спецгрупи «Бранденбург». Припинення вогню слід порушити, щоб зірвати переговори.\n\nНЕХАЙ НІМЕЧЧИНА БУДЕ У БЕЗПЕЦІ."
HIS_PP_ceasefire.25.a: "Ми не дамо шансів миру."

HIS_PP_ceasefire.26.t: "Успішний контрпереворот у Домінікані"
HIS_PP_ceasefire.26.desc: "ЦІЛКОМ ТАЄМНО\nЛИШЕ ДЛЯ ОЧЕЙ\nДЛЯ ВСІХ ЧЛЕНІВ [getIntelAgencyCaps]\nОПЕРАЦІЯ «БУРШТИН»\n\nСЬЮДАД-ТРУХІЛЬЙО - ДОМІНІКАНСЬКА РЕСПУБЛІКА\n\nНаша кампанія саботажу переговорів, організованих США між тимчасовим урядом Домінікани та криптокомуністичними повстанцями, перевершила очікування. Антикомуністичні елементи домініканської армії, слабо координовані трухільїстськими вигнанцями в Іберії, захопили Національний палац і стратили Пупо Романа та інших проамериканських діячів.\n\nСпецгрупа «Бранденбург» сприяла контакту між цими генералами та ув'язненим Рамфісом Трухільйо. Його звільнено, і він служитиме фігурною головою нового уряду.\n\nЯк урядові війська, так і повстанці оголосили про недійсність припинення вогню Романа, і громадянська війна почалася. Хоча урядові сили дезорганізовані після контрперевороту, повстанці погано оснащені та частково демобілізовані під час переговорів.\n\nНавіть якщо остаточний результат залишається незрозумілим, заслуги групи «Бранденбург» у зриві американських операцій у Карибському регіоні є беззаперечними.\n\nНЕХАЙ НІМЕЧЧИНА БУДЕ У БЕЗПЕЦІ."
HIS_PP_ceasefire.26.a: "Тріумф німецької розвідки."

HIS_PP_ceasefire.27.t: "Уряд Трухільйо відновлює контроль"
HIS_PP_ceasefire.27.desc: "ЦІЛКОМ ТАЄМНО\nЛИШЕ ДЛЯ ОЧЕЙ\nДЛЯ ВСІХ ЧЛЕНІВ [getIntelAgencyCaps]\nОПЕРАЦІЯ «БУРШТИН»\n\nСЬЮДАД-ТРУХІЛЬЙО - ДОМІНІКАНСЬКА РЕСПУБЛІКА\n\nДомініканська армія розгромила повстанські сили, висаджені в Пуерто-Плата, і поступово відновлює порядок у сільській місцевості. Після нестабільності, викликаної переворотом Романа та трухільїстським контрпереворотом, ця перемога та супровідна антиамериканська, антикомуністична риторика викликали помірну підтримку громадськістю уряду Рамфіса Трухільйо.\n\nПошкодження, яких зазнали домініканські спецслужби та армія після вбивства Рафаеля Трухільйо, свідчать, що в найближчому майбутньому карибська нація, ймовірно, зосередиться на внутрішній безпеці. Хоча її здатність проєктувати силу за кордоном зменшилася, її опір американському проникненню та збройним проксі є серйозним ударом по прагненнях нашого противника до гегемонії в Західній півкулі.\n\nКрім того, цей ослаблений стан може дати поштовх подальшим можливостям для Райху. Уряд Домінікани висловив зацікавленість у поглибленні торговельних зв’язків для підтримки реконструкції та у посиленні розвідувального співробітництва для викриття залишків американських шпигунів.\n\nНЕХАЙ НІМЕЧЧИНА БУДЕ У БЕЗПЕЦІ."
HIS_PP_ceasefire.27.a: "Вир у Карибах для Америки."

HIS_PP_ceasefire.28.t: "У Залі Америк"
HIS_PP_ceasefire.28.desc: "З передньої частини Зали домініканський генерал Хосе Рене Роман Фернандес приймав овації стоячи від зібраних міністрів закордонних справ Організації американських держав з сором’язливими очима та стриманою посмішкою. Долоні президента Річарда Мілгауса Ніксона плескали без угаву, його усмішка була такою ж широкою і зубатою, як у акули.\n\nКомюніке «Відступ фашистів у Америці» було складено, вибори в Домініканській Республіці під наглядом ОАД організовані, а останніх із тих таких корисних радикалів з Карибського легіону відправляли назад до Куби. Там, де Кефовер і генерал Ейзенхауер зазнали невдачі, моряк зі Східного Віттієра розбив фашистський плацдарм Трухільйо і приніс США їхню найбільшу перемогу у сфері громадських відносин у Латинській Америці цього століття.\n\nКоли дипломати кружляли, Ніксон жестом запросив Романа, і вони вирушили разом, супроводжувані перекладачами. Дует вийшов до Галереї героїв, де Ніксон на мить зустрівся поглядом із бюстом Вашингтона, перш ніж обережно повів свого гостя ліворуч. Там, перед сходами, Ніксон зупинився перед статуєю Хуана Пабло Дуарте.\n\nЗ урочистим обличчям Ніксон почав: \"Він герой для домініканців, герой для всіх народів Америк. Його мужність і рішучість, після надто довгого часу, привели до звільнення вашої Республіки.\" А потім його обличчя набуло звичної веселої виразності: \"Ось що вони казатимуть про вас. Нам знадобиться більше мармуру для цього місця.\"\n\nПісля того як перекладач передав слова президента, Роман чемно засміявся і зміг сказати англійською: \"Дякую.\" Менш емоційно, ніж Ніксон сподівався, але це мало значення. Коли вони спустилися до великої сходової клітки до натовпу преси, що чекала внизу, Ніксон подумав сам собі,"
HIS_PP_ceasefire.28.a: "Не генерала Романа запам’ятають."

HIS_PP_ceasefire.29.t: "Дік і Дікерсон"
HIS_PP_ceasefire.29.desc: "Телефон Ненсі Дікерсон дзвонив. Однією рукою вона приглушила позіхання, а іншою підняла слухавку до вуха. Різкий голос прорвався: \"Це Дік.\" Який Дік? Хто телефонує кореспондентці NBC о першій годині ночі?\n\nВочевидь, президент Сполучених Штатів. Втомлений розум Дікерсон намагався змусити її втомлену руку потягнутися до блокнота й ручки, які були поза досяжністю клятого телефонного шнура. Ніксон, не усвідомлюючи цього, продовжив тираду: \"-ця пресконференція, ваша пресконференція про ситуацію в Домініканській Республіці, це було ганебно. Я очікую цього від них, але ви працювали у закордонних справах. Ви маєте знати, що вся ця справа була успіхом. Генералісимус Трухільйо, Рафаель, я маю на увазі справжнього, був чортовим нацистським покидьком. Він викрадав людей з американської території, вбивав Бетанкура. Він мертвий, Аббес мертвий, уся SIM, яка займалася цим бізнесом, знищена.\" Ніксон, здається, зробив паузу, щоб перевести подих.\n\n\"Пане президенте...\" Ніксон не здавався п’яним Ненсі. Можливо, це навіть лякало більше.\n\n\"Але цей хлопець, цей Рамфіс. Йому просто пощастило проти Легіону. Він, ви знаєте, не солдат. Нічого такого, щоб нас лякало. А домініканцям доведеться відбудовуватися після війни, це займе роки.\"\n\n\"Пане президенте, як ваша адміністрація забезпечить безпеку американців, які були захоплені режимом Трухільйо під час нещодавнього конфлікту?\" Нарешті Ненсі дістала блокнот.\n\n\"Ви йдете на церковну службу Білого дому цього тижня?\"\n\nНенсі записала \"церква\", перш ніж її розум наздогнав. Її розгублений рот випалив: \"Я не знала, що мене запросили.\""
HIS_PP_ceasefire.29.a: "\"Я можу про це подбати,\" відповів Ніксон, перш ніж раптово покласти слухавку.\""

HIS_DOM_ceasefire_skeleton.3.t: "Операція «Пауер Пак»"
HIS_DOM_ceasefire_skeleton.3.desc: ""Добре! Рухайтесь! Рухайтесь!" - крикнув офіцер морської піхоти, коли транспорти приземлились, і солдати один за одним висаджувалися на пристань.\n\nІнші кораблі, які супроводжували флот ВМС США, залишалися на короткій відстані від порту Санто-Домінго, і більше транспортів наближалися, заповнені морськими піхотинцями. Офіцер замислювався, що не так давно вони бомбили ці порти, а тепер вони тут як союзники.\n\nПринаймні, так це називали в Домініканській Республіці — принаймні, у військовому уряді. Хоча їх запросили, цього було недостатньо, щоб розвіяти явну напругу та підозру, особливо з боку домініканських солдатів, які недовірливо дивилися на морських піхотинців, безсумнівно, спогади про бомбардування досі залишалися у їхній пам'яті. Тим не менш, вони співпрацювали з морськими піхотинцями, які почали виконувати свої завдання у місті та по всьому острову.\n\nНаскільки знав офіцер, це мало бути дуже тимчасовим рішенням — після врегулювання ситуації США мали негайно піти. Хіба не це Америка робить для своїх союзників? Допомагає їм у часи потреби? Водночас він розумів, як іноді проходять ці «тимчасові» окупації.\n\nЧерез кілька годин морські піхотинці встановили контрольно-пропускні пункти та забезпечили ключову інфраструктуру по всьому місту на свій розсуд. Більше солдатів продовжували прибувати, поки в місті Санто-Домінго не було кілька тисяч морських піхотинців. Компанії морської піхоти були організовані, проведені брифінги, видані накази.\n\nЧерез кілька годин ці компанії були розгорнуті по всьому домініканському інтер’єру, де вони мали забезпечити контроль над островом шматок за шматком, поки не були впевнені, що можуть підтримувати стабільність. Усі, як американці, так і домініканці, сподівалися, що ситуація швидко вирішиться після цього."
HIS_DOM_ceasefire_skeleton.3.a: "Напруга залишалася густою в повітрі."

HIS_DOM_ceasefire_skeleton.4.t: "МЕМОРАНДУМ ЩОДО СТАНУ СПРАВ У ДОМІНІКАНСЬКІЙ РЕСПУБЛІЦІ"
HIS_DOM_ceasefire_skeleton.4.desc: "РЕЗЮМЕ: Початкові етапи тимчасової окупації Домініканської Республіки пройшли успішно. Американські сили встановили повний контроль над ключовими точками інтересу, організували лінії зв’язку по всій країні та розмістили війська США для швидкого реагування на будь-які заворушення або насильство.\n\nУспіх операції та низька ймовірність зриву вимагають оцінки майбутнього Домініканської Республіки. Сполучені Штати мають можливість сформувати напрямок розвитку країни, і варіанти повинні бути ретельно розглянуті. Було визначено два основних напрямки дій:\n\n1) Сполучені Штати продовжують мандат чинного військового уряду, поки вибори не будуть готові. Це відтермінує вибори до того часу, поки уряд і радники США не оцінять, що країна готова. Це майже напевно гарантує, що Домініканська Республіка залишиться союзником США, але може бути непопулярним серед домініканської громадськості та карибського регіону.\n\n2) Сполучені Штати проводять вибори якнайшвидше, чого військовий уряд навряд чи захоче або зможе оскаржити. Це розпустить чинний уряд і створить тимчасовий цивільний уряд до проведення виборів.\n\nМайже напевно, якщо вибори відбудуться в нинішньому кліматі, доктор Хуан Бош здобуде перемогу. Адміністрація Боша майже напевно не буде безумовно підтримувати інтереси США, оскільки він критично ставиться до багатьох американських політик. Однак його перемога продемонструє відданість Сполучених Штатів демократії та майже напевно покращить наш регіональний імідж, особливо на Кубі та в Мексиці."
HIS_DOM_ceasefire_skeleton.4.a: "Продовжити військовий уряд. Для виборів ще занадто рано."
HIS_DOM_ceasefire_skeleton.4.a_tt: "§RМи можемо роздратувати наших карибських союзників§!"
HIS_DOM_ceasefire_skeleton.4.b: "Наша робота виконана. Нехай домініканський народ сам визначить своє майбутнє, яким би воно не було."
HIS_DOM_ceasefire_skeleton.4.b_tt: "§YБуде сформовано тимчасовий уряд§!"

#Мексиканські евенти в Пуерто-Плата
