hispaniola_news.67.t: "[Get_newspaper_header] Католицька церква засуджує Трухільо"
hispaniola_news.67.desc: "У відповідь на триваючі національні репресії проти підпільного руху опору «14 червня» та інших опозиційних сил, внаслідок яких понад 500 осіб загинули або зникли безвісти, а тисячі були заарештовані, п'ять єпископів, архієпископ і Апостольський Нунцій Домініканської Республіки Ліно Заніні підписали пастирський лист, що засуджує дії режиму.\n\nКоли засудження жахливих злочинів і порушень прав людини зачитуються на кожній недільній Месі по всій країні, католицька церква, один з основних партнерів режиму, здається, остаточно розірвала зв'язки з генералісимусом Трухільо. Оскільки підпільна опозиція продовжує зростати, основи режиму Трухільо, бастіону фашизму на Карибах, здаються хиткими."
hispaniola_news.67.a: "Як Трухільо відповість на це?"
hispaniola_news.67.b: "Шанс для домініканців позбутися дегенеративного католицизму." # GER
hispaniola_news.67.c: "Це буде зовсім скоро" # USA, MEX, CUB
hispaniola_news.67_tt: "Молимося за тих, хто страждає найбільше і переживає важкі випробування."

hispaniola_news.68.t: "[Get_newspaper_header] Трухільо вбитий"
hispaniola_news.68.desc: "Генералісимус Рафаель Трухільо був вбитий невідомими змовниками в столиці Домініканської Республіки, Сіудад Трухільо. Неконфірмовані повідомлення вказують на широкомасштабне вторгнення, здійснене військовими інсайдерами за співпраці з розвідкою США, Куби та Мексики. Військові офіційні особи так званої Карибської Легії вважають це вирішальним ударом, але попереджають, що війна проти бунтівного домініканського режиму продовжиться, поки не буде скинутий теперішній уряд.\n\nЙого смерть залишає вакуум влади в режимі Трухільо. Джерела вважають, що серед кандидатів на посаду є Рамфіс Трухільо, син диктатора; Хоакін Балагер, нинішній президент; а також Джонні Аббес Гарсія, керівник таємної поліції. У той час як емігранти за кордоном святкують цю новину, ще не зрозуміло, чи означатиме це кінець тридцятирічної диктатури."
hispaniola_news.68.a: "Ключова ланка зникла."

hispaniola_news.69.t: "[Get_newspaper_header] Квіскейська угода"
hispaniola_news.69.desc: "Спільний цивільно-військовий уряд Пуупо Романа в Санто-Домінго досяг угоди з Домініканським революційним фронтом. До складу фронту входять люди Карибської Легії та інші дисиденти, такі як Рух 14 червня, і фронт буде визнано за їхню роль у поваленні режиму Трухільо. Їхні бійці будуть дозволені залишитися як демобілізовані громадяни в Домініканській Республіці або подорожувати з їхньою зброєю до Куби, при цьому безпека тих, хто залишиться, гарантована присутністю миротворців ОАС. ОАС також зобов'язана здійснювати нагляд за проведенням вільних виборів, що відбудуться найближчими місяцями.\n\nМексика, Куба, США та інші демократії Латинської Америки вітали перемогу цього народного фронту проти фашизму, в той час як європейські країни засуджують укріплення лівих сил на Гаїті."
hispaniola_news.69.a: "Трухільо обертається в могилі."

hispaniola_news.69.b: "Більшовизм руйнує Кариби!"
hispaniola_news.69.c: "Знову ранок у Санто-Домінго."
hispaniola_news.69.d: "Нехай живуть визволителі!"

hispaniola_news.70.t: "[Get_newspaper_header] Трухільо здійснив переворот, що спричинив громадянську війну в Домініканській Республіці"
hispaniola_news.70.desc: "Домініканські збройні сили поставили Рамфіса Трухільо, сина покійного генералісимуса Рафаеля Трухільо, новим головою Республіки, після публічної страти Хосе Рене 'Пупо' Романа Фернандеса та інших лідерів поваленого уряду. Провал переговорів з Революційним фронтом, що контролює північ країни, та побоювання з приводу комуністичної загрози підірвали військову та громадську підтримку Романа. З Іберії брати убитого лідера, 'Петан' і 'Блекі' Трухільо, передали ці співчуття для організації контрреволюції та звільнення їхнього племінника.\n\nЗасуджуючи повернення Трухільо до влади, Революційний фронт оголосив скасування угоди про припинення вогню з урядом Романа та розпочав марш на столицю країни."
hispaniola_news.70.a: "Квіскейські квіти, политі кров'ю."
hispaniola_news.70.b: "Ми відновлюємо Карибський бастіон, але боротьба триває."
hispaniola_news.70.c: "Як батько, так і син?"
hispaniola_news.70.d: "Ми ж виграли, чорт забирай!"
hispaniola_news.70.e: "Революційна хвиля повинна розбити цей домініканський Уерту."

HIS_puertoplata_shootdown.1.t: "Ікар"
HIS_puertoplata_shootdown.1.desc: "Капітан Майкл 'Лаки' Орловський був досвідченим бойовим пілотом за американськими стандартами.\n\nУ Малаї він вдосконалив свою точність бомбардування, навчившись виводити свій літак з небезпеки до того, як він буде підбитий наземним вогнем або ворожими літаками. За свої подвиги серед товаришів він отримав прізвисько 'Лаки'. Домініканці були для нього як прогулянка в парку порівняно з японцями. Єдиною загрозою була їх тепер знищена авіація та старі гвинтівки, які стріляли трасуючими снарядами, але ніколи не потрапляли.\n\nСьогодні серія удач Лаки Орловського, зрештою, завершилася.\n\nВін був здивований, коли його раннє попередження про небезпеку заголосило, коли він наближався до цілі. Він зробив фатальну помилку, вважаючи це збійним сигналом. У ту мить, коли німецька ракета вдарила по його літаку, а він катапультувався, він зрозумів, що домініканці тепер можуть порівнятися з японцями. І його напарник ледве встиг повідомити про інцидент по радіо, перш ніж на його літаку також з'явилися ракети."
HIS_puertoplata_shootdown.1.a: "Коли він приземлився, він знайшов лише домініканські гвинтівки, націлені на нього."
HIS_puertoplata_shootdown.1.a_tt: "§RНам потрібно посилити нашу авіаційну підтримку!§!\n"
PP_Command_Power_Loan_Takeback_tt: "§Y80§!£кредит на §Yкомандну владу§! було скасовано.§!"

HIS_puertoplata_shootdown.2.t: "Підбитий"
HIS_puertoplata_shootdown.2.desc: "Приват Пенья був 19 років і лякався наближення американських літаків.\n\nВін не був єдиним. Всі солдати були налякані. Кожен мав свою історію про те, як ціла ескадра була знищена одним бомбуванням напалмом. І якщо жар та ударна хвиля були недостатньо страшними, то рани та крики переслідували тебе навіть у сні.\n\nАле вони не були безпорадними. Вони навчилися ухилятися і ховатися від літаків, і сьогодні вони збиралися помститися. Витягнувши ящики з новітніми німецькими MANPADS, вони отримали особисте наказання від Трухільо використовувати їх за призначенням. Спогад про впевнену усмішку Ель Хефе надав Пеньї сміливості. Сьогодні декадентні янкі будуть проливати кров.\n\nВони прицілилися і вистрілили, як тільки літаки наблизилися в зону досяжності. Кілька звуків сигналів порушили тишу їх камуфльованого укриття, і згодом вони всі випустили свої ракети. Вони мовчки спостерігали, як ракети відлетіли. І тоді ракета Пеньї перетворила американський літак на полум'яну кулю.\n\nПідрозділ вибухнув від радості. Пенью підхопили Гонсалес та Немесио і пронесли його, обмінюючись потисканнями рук з усіма хлопцями. Вони це зробили — збили літак. Тепер вони могли змусити янкі повернутися в Гаїті, де вони ховалися за спинами тих дикунів!\n\nЇх святкування було перерване криками тривоги і прокльонами; янкі-пілот вижив і катапультувався. Пенью спустили, і він разом з підрозділом узяв свої гвинтівки і пішов захопити ворожого пілота."
HIS_puertoplata_shootdown.2.a: "¡Абахо лос Янкіс!"
HIS_puertoplata_shootdown.2.a_tt: "§GНаші MANPADS ефективно використовуються!§!\n"

USA_Trujillo_Conspiracy.1.t: "Кілька відважних людей"
USA_Trujillo_Conspiracy.1.desc: "Генерал Хуан Томас Діас з Домініканської Республіки, його обличчя було маскою концентрації, перевіряв свою ціль. Ранкове сонце м'яко освітлювало стрільбище, єдиним звуком був шелест листя вітру на його ранчо. Повільно піднімаючи ствол свого пістолета, він звужував очі, заспокоюючи своє дихання, руки і серце слідували за ним. Постріл розірвав тишу ранку, і на обличчі генерала промайнула іскра задоволення. Не в ціль, але дуже близько. Задоволений, він підійшов до столу, де його чекали напої та компанія. Антоніо де ла Маза був п'ятдесятирічним чоловіком, який виглядав на шістдесят, його тіло було виснажене тими самими напоями, які змушували його хитатися на ногах. Сьогодні він був у гарному настрої, хоча б тому, що це було за рахунок сумнівного прицілу його друга. Хуан закотив очі і пройшов до свого келиха, помітивши третю людину, що наближалася до них. Антоніо, слідуючи за поглядом товариша, скривив обличчя і витягнув свою зброю. «Це достатньо; хто ти такий і чому перешкоджаєш хорошому часу?\"\n\n"Я з американського консульства." Той, що був одягнений стильно, не здивувався ворожості, тримаючи порожню посмішку, якою так славляться янкі. "Вибачте за неанонсований візит, але я чув від друга, що у вас, джентльмени, були розбіжності з вашим Каудільйо."\n\nХуан стиснув кулаки. Десятиліття служби зруйновані публічним приниженням через відважних, але дурних вигнанців в човнах. Лице Антоніо, навпаки, стало відстороненим. Режим вбив його брата, Тавіто, через провалений замовний вбивство. Щось змінилося на обличчі Антоніо. "Ми лояльні люди. Я управляю пилорамами нашого Каудільйо. Але якщо б ми були нелояльні, нам потрібні б були кілька хлопців і багато зброї." Потім він повернувся і вистрілив в мішень."
USA_Trujillo_Conspiracy.1.a: "І на мішені з'явилася дірка від кулі."
USA_Trujillo_Conspiracy.1.a_tt: "Щоб забезпечити успіх змови, нам потрібно досягти високої операційної сили і бездоганно співпрацювати з §KMexico§! та §VCuba§!. І створити можливість..."

USA_Trujillo_Conspiracy.2.t: "Хребет"
USA_Trujillo_Conspiracy.2.desc: "Вологе, незабезпечене вентиляцією повітря в кімнаті на другому поверсі консульства США залишало бажати кращого, але розкіш посольства тепер була втрата. Консул Генрі Дірборн сидів через маленький стіл від свого колеги, людини, яку він знав лише як 'Естебан'. Перед ними лежала карта країни, червоні кола позначали різні райони.\n\n"Ось тут нам потрібно почати створювати укриття." Дірборн вказав на кожне коло по черзі. "Рух 14 червня набирає обертів, і нам потрібно скористатися цим до того, як уряд розпочне репресії."\n\n"Легко сказати, янкі. Ви думаєте, вони не пробували цього раніше? Кожне зібрання людей, незалежно від того, є вони повстанцями чи ні, постійно спостерігається SIM і їх чорними "Фольксвагенами"." Він постукав по стіні. "Чорт забирай, вони, мабуть, зараз і зовні цієї будівлі."\n\n"Все, що нам потрібно, це місця для сховищ на випадок репресій, Естебане. Рух набирає обертів, особливо після вбивства сестер Мірабаль, але йому не вистачає стійкості. Хоч я і не новачок у ваших побоюваннях, важливо, щоб ми розпочали це.""
USA_Trujillo_Conspiracy.2.a: ""І зберігати найвищу секретність.""
USA_Trujillo_Conspiracy.2.b: ""І передати інформацію до мексиканського DFS та кубинців.""

USA_Trujillo_Conspiracy.3.t: "Заради старих часів"
USA_Trujillo_Conspiracy.3.desc: ""Отже, я був там, летів через бурю в Сибіру." Лоренцо 'Вімпі' Беррі почав з ностальгічною усмішкою, ведучи свого гостя та дружину через свій супермаркет. "Сніг був такий густий, що ви ледь могли бачити через вікно. Але це нас не зупиняло, ні, сер! Ми знали, що на кону: росіяни були.."\n\n"Комуністами," різко відповів офіцер Трухілісти, намагаючись розтерти втому з очей. "Ви допомагали комуністам."\n\n"О, знову це? Це була війна, дорога," перебила його дружина, Флеріда. "Вімпі не міг вибирати, хто друг, а хто ворог, а крім того! Це був чудовий досвід; інакше як би він став інструктором для місцевих пілотів?"\n\n"О, це були ті часи! О! Мої учні завжди любили цю історію, одного разу я змушений був приземлитися в лісі, і там був цей Якут..." Офіцер зітхнув, але продовжив. Відволікавшись на нескінченні балачки подружжя, він не звернув уваги на двох чоловіків, Карла та Джеймса, які тягнули важкі ящики до складських приміщень супермаркету. Вімпі завжди мав багато друзів під час своєї роботи інструктором для домініканців, і нічого не роздратовувало його так, як бачити, як їх вбивають даремно; ось чому він залишив роботу після того, як фашисти вбили Тавіто та Мерфі, і чому він так поспішив помститися за їхніх вбивць. Провезення зброї ФБР через свій бізнес тримало його і Флеріду неспокійними вночі, але вони добре спали, коли справедливість буде відновлена: фашисти, під шість футів землі."
USA_Trujillo_Conspiracy.3.a: "Це для вас, хлопці."

USA_Trujillo_Conspiracy.4.t: "Підготовка"
USA_Trujillo_Conspiracy.4.desc: "Вулиці Домініканської Республіки останнім часом здаються тихішими. Якщо ви не поліція чи якийсь урядовий бандит, загальна мудрість свідчить: 'не виходьте на вулиці і тримайте голову вниз.' Щось велике наближається, щось, що змінить світ, і всі це знають. Лише кілька чоловіків можуть сказати, що це буде, і консул Дірборн сподівався бути одним із них. Відійшовши від вікна офісу, Дірборн повернувся до своїх гостей. Його стіл був завалений фотографіями та звітами, ретельно організованими ним самим і його гостями, Карлом і Джеймсом, або як їх звали насправді.\n\nДірборн нахилився до столу, дивлячись на центральну фотографію Трухільо, обличчя тирана було обведене червоним колом. "Ми його отримали. Це зайняло десятиліття, але тепер він на тому місці, де ми хочемо." його погляд ковзав по документах. "Його дім з карт опадає; церква втомилася від вбивств; бізнесмени втомилися від того, що його клан краде у них; молодь по всій країні готова до боротьби з ним, і навіть середній клас не може більше терпіти економічну stagnацію. Вони будуть танцювати на вулицях, коли він піде, але їм потрібен поштовх."\n\nДва агенти ФБР переглянулись і кивнули, потім Джеймс сказав: "Зрозуміло, сер, ми відправимо повідомлення до Вашингтону і продовжимо готувати підготовку. Трухільо не зрозуміє, що його вразить.""
USA_Trujillo_Conspiracy.4.a: "Статус операції ATHENS: ЗАТВЕРДЖЕНО"

USA_Trujillo_Conspiracy.5.t: "Терпіння і час"
USA_Trujillo_Conspiracy.5.desc: ""Отже, що ви думаєте про план, Імберте?" Як Антоніо де ла Маза і його співучасник Тоні Імберт наближалися до супермаркету Вімпі, перший почав розмову.\n\n"Це повинно спрацювати, все просто." Імберт відмовився від зорового контакту і продовжував дивитись через вікно вантажівки на можливих агентів SIM.\n\n"Не дуже любиш говорити, так? Ну нічого, ми ж все одно тут-" Антоніо подивився на чоловіка перед прихованою вантажівкою. "Чому він просто не приносить їх? Дивись, Імберте, здається, Карл нас кличе."\n\nОбидва вийшли, привітавши свого контактного агента ФБР. "Слухайте, ви двоє. Я не можу передати ці гвинтівки без обіцянки. Ви повинні затримати вбивство, поки ATHENS не буде готова, наказ зверху."\n\n"Чи не повинні домініканці самі вирішувати, коли і де звалити своїх тиранів?" заревів де ла Маза у відповідь. Його нетерпіння взяло верх, перш ніж Тоні перервав.\n\n"Антоніо, не будь наївним. Янкі - єдина причина, чому ми дійшли так далеко, чи зараз реально час припинити співпрацю?" Він звернувся до спеціального агента."
USA_Trujillo_Conspiracy.5.a: ""Ми розуміємо.""
USA_Trujillo_Conspiracy.5.b: ""Але Вашингтон повинен пам'ятати, що він не сам у цьому.""

USA_Trujillo_Conspiracy.6.t: "Не турбувати"
USA_Trujillo_Conspiracy.6.desc: "Джеймс перевірив через замкову щілину перед тим, як відкрити двері, тримаючи їх трохи прочиненими, поки він дивився на вулицю, що наближалася. Він тихо вийшов на ґанок. Це був один з укриттів Дірборна, яке час від часу приховувало різних дисидентів та тих, хто втікав від переслідувань. Поточний гість консула був чоловік на ім'я Гуальберто, який висадився з кубинцями 14 червня 1959 року в Ла Веґі і ховався з того часу. Сам Гуальберто виглянув з забарикадованих вікон першого поверху, швидко зникаючи в темряві.\n\nТоді Джеймс почув хлопок двигуна, коли чорний "Фольксваген" стрімко в'їхав в алею з жахливим скреготом. Він дуже добре знав, хто зараз мав прийти.\n\n"Підніміть руки! Ви під арештом!"\n\nВін міг би дотягнутися до М14, захованого в одному з порожніх дошок підлоги, але за той час, що зайняло б приготування гвинтівки, таємна поліція вже б розстріляла його. SIM дістали його. Вони заберуть його в один із своїх чорних сайтів, катуватимуть його, він чув історії про мутації, електричні удари, навіть кастрацію -\n\nАле потім він присягнув, що знову почув хлопок двигуна, хоча машина була на місці, тільки зрозумів, що це постріли, коли "Фольксваген", наляканий, різко поїхав з поля зору. Два чоловіки в цивільному вийшли з пролому в огорожі. "Ми з DFS," сказав один з них, "Вашингтон - не єдина сторона, що хоче повалити Трухільо."\n\nДжеймс перевів подих. "Як я можу вам довіряти?"\n\n"Або ви і сенйор Гуальберто йдете з нами, або спробуєте ввічливо пояснити себе SIM, коли вони повернуться озброєні до зубів і будуть шукати кров Янкі.""
USA_Trujillo_Conspiracy.6.a: ""Зрозуміло. Я принесу Гуальберто і М14.""
USA_Trujillo_Conspiracy.6.b: ""Ціную, але тепер саме вашу кров вони шукають цієї ночі.""
USA_Trujillo_Conspiracy.6.c: "СХОВАНО - МАЄ БУТИ ДОСТУПНЕ ЛИШЕ ІШІМ ІСКУССТВЕННОМУ ІНТЕЛЕКТУ, ЯКЩО ГРАВЕЦЬ - МЕКСИКА"

USA_Trujillo_Conspiracy.7.t: "Правдоподібне заперечення"
USA_Trujillo_Conspiracy.7.desc: "ТОП СЕКРЕТ\n\nКЛАСИФІКОВАНО:\nЗаступник Генрі М.В. Дірборн\n\n\n\nПАМ'ЯТКА ДЛЯ ПРЕЗИДЕНТА\n\n\n\n(1) Змова готова до виконання Операції ATHENS. Поточний стан готовності задовільний. Компліцитний помічник постійно контролює рухи Трухільо, і мені також повідомили, що вони мають достатньо запасів і боєприпасів.\n\n(2) Дисидентський рух має багато прихильників серед високопосадовців армії та Домініканської партії, зокрема серед начальника армії генерала Пупо Романа. Інші у державному апараті будуть прагнути захопити владу після вбивства Трухільо.\n\n(3) Якщо Карибський легіон зможе забезпечити плацдарм на Пуерто-Плата, я можу з упевненістю заявити, що режим впаде, ймовірно, через наступну боротьбу за владу між секретарем поліції Джонні Аббесом, Рамфісом Трухільо та номінальним президентом Хоакіном Балагером.\n\n\nОперація ATHENS розпочнеться після отримання згоди Президента."
USA_Trujillo_Conspiracy.7.a: "Козел не знатиме, що його вдарить."

USA_Trujillo_Conspiracy.8.t: "Вірний до кінця"
USA_Trujillo_Conspiracy.8.desc: "Келихи шампанського дзвінко звучали під низьким, млявим розмовами. Генераліссимус Трухільо, сидячи на п'єдесталі в елегантному костюмі, спостерігав за рядами режиму - хоча його погляд затримався на одному чоловікові зокрема. Почесний гість. Він раптово встав і попросив тишу, і одразу всі непомітні розмови вечора стихли, поступаючись місцем сталевій тиші.\n\n"Домініканська Республіка завжди горда вітати сенйора Гіттельмана." Трухільо тримав келих у хватці, погляд його повільно повернувся до старшого чоловіка серед столів; в окулярах, навіть згорблений, ознаки колишньої вражаючої фізичної форми, що зникла за три десятиліття. "Симон," продовжив Козел, "навчав мене бути тим, хто вигнав гаїтян, поклав край анархії та бідності, керуючи цією нацією через кризу за кризою, без обмежень." Це більше нагадувало оду самому собі, ніж тост на честь колишнього морського піхотинця США, його інструктора; колись грубого, жорсткого, але тепер більше схильного соромитись згадки про насильство.\n\nТрухільо посміхнувся дещо іронічно. "І ця горда нація мала свої зовнішні загрози." Він уявив того виродка Бетанкура, спаленного і згорілого в його порожньому "Паккарді". Гіттельман кивнув, червоніючи.\n\n"Симон - друг для нас усіх. Ми щиро вдячні за його роботу в Вашингтоні від імені нашого уряду, допомагаючи пояснити нашим американським друзям, що їхні погрози є помилковими і невірно зрозумілими. Не те, щоб вони мали якийсь результат." Ввічливий сміх з аудиторії."
USA_Trujillo_Conspiracy.8.a: "Гіттельман відчув, як його серце опускається, коли він стиснув руку дружини."

USA_Trujillo_Conspiracy.9.t: "Викуте вогнем"
USA_Trujillo_Conspiracy.9.desc: "Коли Вімпі побачив американський літак, що пролітав над Сьюдад Трухільо, його охопила ностальгія. Частина його подумала, що він повинен бути там, в небі, несучи бій Трухільо і підтримуючи народ, як він робив це в Сибірі. Однак він також згадував, що його робота тоді полягала у доставці обладнання, а вид літаків означав, що тисячі чоловіків і хлопців чекають на нього на пляжі.\n\nЗ почуттям терміновості та рішучості Вімпі та Флеріда навантажили свій вантажівка скільки можна було боєприпасів, зброї та гранат. Цей процес підготовки був виснажливим, тривав кілька місяців і включав допомогу ФБР.\n\nАле тепер все завершено, і Вімпі почав короткий процес поливання їх супермаркету бензином. Стоячи на його парковці, оглядаючи результат своїх років праці, вони відчували суміш гордості та скорботи.\n\nКоли вони відкрили Супермаркет Вімпі, це був перший подібний супермаркет в Домініканській Республіці. Вімпі, супермаркет у американському стилі, був більше, ніж просто продуктовим магазином. Це було соціальне місце, улюблене місце Хуана Домінго Перона, і перша повністю кондиціонована комерційна будівля в Республіці. Але коли Флеріда підпалила сірник і підпалила бензин, їх символ успіху та стійкості перетворився на попіл, на спогади та глибоке почуття втрати.\n\nЖоден з них не озирнувся назад, коли вони поїхали. Що чекає на них після цього, було невідомо, особливо після того, як вони спалили своє джерело існування..."
USA_Trujillo_Conspiracy.9.a: "Але вони стикнуться з цим разом."

USA_Trujillo_Conspiracy.10.t: "Коли план збігається"
USA_Trujillo_Conspiracy.10.desc: "Дірборн не міг пригадати, коли востаннє американського дипломата запросили до президентського палацу Домініканської Республіки. Козел був божевільним собакою вже давно, і його кінець наближався, чи була Америка за цим чи ні. Однак він підозрював, і не тільки через великі келихи вина, які йому дали, що Америка та новий уряд генерала Романа ладитимуть значно краще.\n\n"У нас ще є деяка робота з прибирання," почав генерал, зробивши ще один ковток. "Є чимало бандитів з SIM і відчайдушних лоялістів, що чіпляються за якусь надію, що все зміниться на краще, але це вже не має значення на цьому етапі; боротьба вже в них згасає. За кілька тижнів, а може навіть за кілька днів, Трухільйо та його прихильники будуть повністю знищені."\n\n"Боже, слава Богу. І можете бути впевнені, що Сполучені Штати не пошкодують коштів на забезпечення стабільності та обмеження подальшого насильства. До речі..." Консул встав зі свого місця, поставивши келих на стіл. "Я піду, допоможу прискорити допомогу. Дякую за ваш час, генерал."\n\nРомано посміхнувся привітно та потиснув руку Дірборну, коли вони наближались до входу в палац. "Радий був зустрітися, сподіваюся знову почути від вас, консуле Дірборн.""
USA_Trujillo_Conspiracy.10.a: "Чорна пляма Карибського моря більше не існує."

USA_Trujillo_Conspiracy.9.t: "Викуте вогнем"
USA_Trujillo_Conspiracy.9.desc: "Коли Вімпі побачив американський літак, що пролітав над Сьюдад Трухільо, його охопила ностальгія. Частина його подумала, що він повинен бути там, в небі, несучи бій Трухільо і підтримуючи народ, як він робив це в Сибірі. Однак він також згадував, що його робота тоді полягала у доставці обладнання, а вид літаків означав, що тисячі чоловіків і хлопців чекають на нього на пляжі.\n\nЗ почуттям терміновості та рішучості Вімпі та Флеріда навантажили свій вантажівка скільки можна було боєприпасів, зброї та гранат. Цей процес підготовки був виснажливим, тривав кілька місяців і включав допомогу ФБР.\n\nАле тепер все завершено, і Вімпі почав короткий процес поливання їх супермаркету бензином. Стоячи на його парковці, оглядаючи результат своїх років праці, вони відчували суміш гордості та скорботи.\n\nКоли вони відкрили Супермаркет Вімпі, це був перший подібний супермаркет в Домініканській Республіці. Вімпі, супермаркет у американському стилі, був більше, ніж просто продуктовим магазином. Це було соціальне місце, улюблене місце Хуана Домінго Перона, і перша повністю кондиціонована комерційна будівля в Республіці. Але коли Флеріда підпалила сірник і підпалила бензин, їх символ успіху та стійкості перетворився на попіл, на спогади та глибоке почуття втрати.\n\nЖоден з них не озирнувся назад, коли вони поїхали. Що чекає на них після цього, було невідомо, особливо після того, як вони спалили своє джерело існування..."
USA_Trujillo_Conspiracy.9.a: "Але вони стикнуться з цим разом."

