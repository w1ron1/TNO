 ## French West Indies Referendum

 TNO_fwi_referendum_category_desc_usa: "§RUnrest and anti-Americanism§! has built in the [FWI.GetFlag] §WAntilles§! as [USA.GetFlag] §mour§! legal justification for occupying the islands sunsets. In response, §mHigh Commissioner Lemnitzer§! has drafted a path toward managed independence. To maintain §GCaribbean stability§!, we should ensure his §*Confederation Plan§! is legitimated through §Ypopular referendum§!.\n\nHowever, the referendum has drawn §Ropportunists§! seeking to §adisrupt§! our Caribbean presence. If [MEX.GetFlag] [IBR.GetFlag] §Ktheir§! §Ointerf§!§nerence§! drives matters out-of-hand, we could §Yignore the results...§!"
 TNO_fwi_referendum_category_desc_mex: "Since the §,fascists§! occupied [FRA.GetFlag] §aFrance§!, [FWI.GetFlag] §WGuadeloupe and Martinique§! have been occupied as well. [USA.GetFlag] §mThe Gringos§! took on the role of the [FWI.GetFlag] §WAntilles'§! colonial power, §Roverriding local governance§!. Now they seek to change the guise of this imperialism, exchanging open control for a puppet §*Confederation§! via §Ypopular referendum§!.\n\nBut this opening allows [MEX.GetFlag] §Kus§!, and [IBR.GetFlag] §Ocertain op§!§nportunists§!, to support the natural desire of America's peoples for §Gindependence§! and §Gself-determination§!. The Veracruz Pact shall break all yokes!"
 TNO_fwi_referendum_category_desc_ibr: "[IBR.GetFlag] §OIbe§!§nrian§! fleets once sailed the Caribbean, bringing troves of §fluxuries§! to Sevilla. The sea's opportunity remains, but our §GHegemony§! has passed into §Ranother's hands§!. Its modern colossus, the [USA.GetFlag] §mU.S.§!, has occupied the [FWI.GetFlag] §WAntilles§! for two decades. Chafing under open Anglo-rule, a §Yreferendum§! now aims to install an §mAmerican-controlled§! §*Confederation§! instead.\n\nIf our fellow §aLatins§! are convinced to §Rreject§! this, modern [IBR.GetFlag] §OConqui§!§nstadors§! could gain a foothold to pursue the §frich commerce§! of their forefathers."

