l_english:
 ## Референдум у Французькій Вест-Індії

 TNO_fwi_referendum_category_desc_usa: "§RЗаворушення та антиамериканізм§! набирають сили на [FWI.GetFlag] §WАнтильських островах§!, оскільки [USA.GetFlag] §mнаше§! юридичне обґрунтування окупації островів добігає кінця. У відповідь §mВерховний комісар Лемніцер§! розробив план поступового переходу до керованої незалежності. Щоб зберегти §Gстабільність у Карибському басейні§!, ми маємо забезпечити легітимізацію його §*Плану Конфедерації§! через §Yнародний референдум§!.\n\nОднак референдум привернув §Rопортуністів§!, які прагнуть §aперешкодити§! нашій присутності в Карибському басейні. Якщо втручання [MEX.GetFlag] [IBR.GetFlag] §Kїхніх§! §Oінтерф§!§nеренцій§! вийде з-під контролю, ми завжди можемо §Yпроігнорувати результати...§!"
 TNO_fwi_referendum_category_desc_mex: "Відтоді як §,фашисти§! окупували [FRA.GetFlag] §aФранцію§!, [FWI.GetFlag] §WГваделупа та Мартиніка§! також перебувають під окупацією. [USA.GetFlag] §mГрінґо§! перебрали на себе роль колоніальної держави на [FWI.GetFlag] §WАнтильських островах§!, §Rігноруючи місцеве самоврядування§!. Тепер вони прагнуть змінити фасад цього імперіалізму, замінивши відкрите правління маріонетковою §*Конфедерацією§! через §Yнародний референдум§!.\n\nАле ця можливість дозволяє [MEX.GetFlag] §Kнам§! та [IBR.GetFlag] §Oпевним опорт§!§nуністам§! підтримати природне прагнення народів Америки до §Gнезалежності§! та §Gсамовизначення§!. Веракруський пакт розірве всі кайдани!"
 TNO_fwi_referendum_category_desc_ibr: "[IBR.GetFlag] §OІбе§!§nрійські§! флоти колись борознили Карибське море, доставляючи до Севільї цілі кораблі §fрозкошів§!. Можливості моря нікуди не зникли, але наша §Gгегемонія§! перейшла до §Rінших рук§!. Її сучасний колос, [USA.GetFlag] §mСША§!, вже два десятиліття окупує [FWI.GetFlag] §WАнтильські острови§!. Знемагаючи під відкритим англосаксонським правлінням, острови тепер готуються до §Yреферендуму§!, який має встановити §*Конфедерацію§! під §mамериканським контролем§!.\n\nЯкщо наших братів-§aлатинів§! переконати §Rвідкинути§! це, сучасні [IBR.GetFlag] §Oконкі§!§nстадори§! зможуть закріпитися тут і відкрити шлях до §fприбуткової торгівлі§! їхніх предків."

