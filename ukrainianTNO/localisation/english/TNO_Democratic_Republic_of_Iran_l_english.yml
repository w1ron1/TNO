 ## Leader Descs ##
 POLITICS_KARIM_SANJABI_DESC: "Карім Санджабі - не з тих, хто швидко здається. Старий гвардієць демократичних націоналістів Ірану, його партія «Національний фронт» чинила мужній опір шахові й зазнала за це переслідувань, адже ненависна САВАК вдавалася до дедалі жорсткіших заходів, щоб придушити опозицію. Сам Санджабі ніколи не припиняв боротьби за свою мрію про сильний, вільний Іран. Саме його мужність і рішучість зробили його фактичним лідером продемократичного підпілля країни, яке з початком Іранської революції перетворилося на зародок Демократичної Республіки Іран.\n\nПотрясіння, спричинені революцією, принесли нові можливості та підтримку нового друга на іншому боці світу. Мобілізувавши всі свої контакти, фракція Санджабі звернулася по допомогу до Сполучених Штатів Америки, давши всі необхідні обіцянки, щоб заручитися підтримкою Вашинґтона. Боротьба буде важкою. Але, можливо, цей союз здатен змінити перебіг подій, і тоді над демократичним Іраном зійде сонце - над Іраном, де його народ буде заможним і вільним."
