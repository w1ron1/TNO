 ## Leader Descs ##
 POLITICS_SHALVA_LOLADZE_DESC: "Шалва Лоладзе віддав усе, що мав, на захист своєї батьківщини: свою честь, свою гідність і свою кров. Коли німці вторглися до Совєцького Союзу, він записався до війська, ставши пілотом Совєцьких Військово-повітряних сил. Однак удача була не на його боці, і його збили над окупованою Україною. Постаючи перед вибором між нацистським табором для військовополонених і посадою в колабораціоністському Грузинському легіоні, він здався й обрав останнє. Нижчі чини Легіону набиралися з грузинських військовополонених, які обурювалися совєцькими господарями або відчайдушно прагнули вижити, але його керівники були клікою генералів і політиків із колишньої Демократичної Республіки Грузія. Вигнані зі своєї батьківщини від часів совєцької перемоги, вони прагнули повернутися. Коли війна закінчилася, а Райх переміг, бажання Легіону здійснилося. Але замість того, щоб прибути як визволителі, вони були змушені служити окупантами своїм новим німецьким господарям.\n\nУ Легіоні утворився ідеологічний розкол між старою ґвардією, яка виступала за терпіння, та молодшим поколінням, яке віддавало перевагу більш рішучим діям. Коли почалася Західноросійська війна, а Закавказький Совєт повстав, командири Легіону залишилися вірними Райху; коли німці неминуче прийдуть відновити порядок, вони винагородять грузинів за їхню відданість. Ця винагорода так і не прийшла. А коли Катаріненштадт втратив контроль після смерті Йозіаса, генерали знову наказали своїм людям чекати. Однак полковники втомилися чекати. Шалва Лоладзе очолив заколот, заарештувавши своїх командирів і розстрілюючи тих, хто чинив опір. Він згуртував Легіон, який швидко скинув німецький гарнізон, і прапор Грузії знову замайорів над Тбілісі. Тепер він не служитиме жодному господареві, окрім себе, і жодному прапору, окрім прапора своєї батьківщини."
 POLITICS_GIVI_JAVAKHISHVILI_DESC: "Ґіві Дмитрович Джавахішвілі не був ані солдатом, ані палким оратором, а лише лагідним бюрократом, який керував комітетом, що наглядав за інфраструктурою водогонів Грузинської РСР. Партизани, у яких він переховувався після падіння Тбілісі, називали його непотрібним у створенні мережі опору, але він запевняв, що має навички для значно важливішого завдання: побудови уряду. Виграти війну — це, звісно, добре, наполягав він, але який сенс перемагати у війні, якщо вони нездатні закріпити свою владу та відновити порядок? Хіба люди не довірятимуть більше тій стороні, яка пропонує виживання та засоби до існування, ніж хаос і бідність?\n\nІ так Джавахішвілі почав налагоджувати контакти між іншими осередками опору. Не лише солдатами, а й профспілковими лідерами, науковцями, бухгалтерами, учителями — усіма, хто міг допомогти підготувати нову грузинську державу. І те, що починалося як вільна коаліція партизанів, поступово перетворилося на щось більше: основи тіньового уряду, який зміг би захопити владу та продовжити роботу там, де зупинилася стара бюрократія.\n\nСпочатку вони намагалися координувати дії із Закавказьким Совєтом під час Західноросійської війни, але німцям вдалося контратакувати та відновити свій контроль, перш ніж могла відбутися будь-яка суттєва співпраця. Тож вони знову пішли в підпілля, чекали свого часу та чекали наступної можливости завдати удару. Смерть Йозіаса означала, що мрії Джавахішвілі нарешті могли здійснитися. Він та його союзники розпочали довгоочікуване повстання на територіях колишньої Грузинської РСР, розгромивши колабораціоністів і знесилений німецький гарнізон. І коли дим розсіявся, його уряд, що лише зароджувався, зміг одразу взятися до роботи та почати відновлювати державний апарат. Але хоча Джавахішвілі обіцяв, що зможе побудувати державу, було очевидно, що спочатку йому доведеться виграти війну. І тепер настав час виконати всі свої обіцянки."
 