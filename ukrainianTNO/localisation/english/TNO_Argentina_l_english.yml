 POLITICS_AF_DESC: "Другий наймолодший із 14 дітей, юний Артуро — як і всі його брати та сестри — був підштовхнутий матір’ю до інтелектуальної кар’єри. Намагаючись стати футболістом, щоб уникнути цієї долі, він зазнав низки неймовірних травм, які змусили його вступити на юридичний факультет Університету Буенос-Айреса. Тут раніше посередній Фрондісі досяг успіху, отримавши спеціальний диплом, від якого він відмовився через призначення ректора університету тогочасним військовим режимом.\n\nВідтоді залучений до радикальної політики (UCR), Фрондісі брав участь у низці невдалих військових переворотів, перш ніж у 1946 році був обраний депутатом разом із Рікардо Бальбіном. Ця пара стала провідними діячами MRI й спільно очолила захоплення фракцією контролю над UCR напередодні виборів 1951 року, на яких вони балотувалися разом і зазнали принизливої поразки. Обидва вижили, перетворившись на лідерів численної опозиції Перону. Сам Фрондісі, зокрема, написав їдку націоналістичну книгу під назвою «Політика й нафта», у якій засудив готовність пероністів укладати контракти з іноземними нафтовими компаніями, і був провідним змовником у численних змовах із метою його повалення — діяльності, що відтоді стала його улюбленим заняттям.\n\nОднак після повалення Тирана безпринципність Фрондісі ставала дедалі тривожнішою. Зловживаючи своїм контролем над Національним комітетом UCR, у 1958 році він декретом нав’язав свою кандидатуру на посаду президента — замість кандидатури Бальбіна, — спричинивши кризу, яка безповоротно розколола партію. Усвідомивши, що його власна UCR-I не може перемогти UCR-P Бальбіна, Фрондісі вдався до невиконуваних обіцянок вигнаному Перону, завдяки голосам якого він переміг на виборах. Однак одразу після вступу на посаду він почав проводити урядову політику, цілком відірвану від його передвиборчої програми.\n\nЩо ще гірше, розкриття обіцянок Фрондісі пероністам обурило значну частину UCRI та військових, і всі три групи зробили управління країною для нього майже неможливим. Справді, постійні інтриги Фрондісі — та його очевидна нездатність робити це правильно — стрімко штовхають Аргентину в політичну прірву. Парадоксально, однак, його бачення було підтверджене безпрецедентним успіхом його індустріалістської економічної політики — світлою плямою, затьмареною численними політично вмотивованими страйками та військовими повстаннями, які принижують його уряд."
 
 ARG_Pedro_Eugenio_Aramburu: "Педро Еухеніо Арамбуру"
 POLITICS_PEA_DESC: "Аморальний, соціопатичний, бездушний і егоїстичний: Педро Еухеніо Арамбуру є остаточним уособленням гротескної політизації аргентинської армії, здатним змінювати свої лояльності чи ідеологію щоразу, коли це необхідно, і цілковито позбавленим будь-якої поваги до християнської моралі.\n\nНепримітний піхотинець, який покірно служив старшим офіцером протягом усього пероністського режиму без інцидентів чи змовницьких нахилів, Арамбуру перетворився на палкого ґорилу, коли вітер змінився, і відіграв важливу роль у зраді Лонарді на посаді міністра війни. Через кілька днів він санкціонував сумнозвісні страти кількох генералів-дисидентів та їхніх цивільних пероністських союзників на прохання президента, адмірала Хартунґа, і навіть ув’язнив свого близького особистого друга, генерала Бенґоа, за відмову покинути Лонарді. Попри цю покірність, він не отримав підвищення і залишився озлобленим через те, що сам не став президентом — його давня амбіція, яка переважує будь-які міркування про Бога та Батьківщину.\n\nЗмінивши стратегію, Арамбуру став лідером профрондісістського сектора в армії під час невдалої президентської каденції кордобського адвоката, сподіваючись отримати кандидатуру UCRI на президентських виборах 1963 року, знову й знову рятуючи його від неминучого повалення. Саме Арамбуру покликали розв’язати кризу, яка зрештою знищила президентство Фрондісі, але посеред справи він передумав і теж його зрадив. Отримавши керівництво армією після провалу проєкту Поджі, Арамбуру негайно почав змовлятися проти генерала Менендеса, прагнучи нарешті заволодіти президентським кріслом. Успішно замкнувши його в психіатричній лікарні, Арамбуру нарешті зміг сам обійняти посаду президента.\n\nОднак безпосередньо захопити владу ніколи не було планом Арамбуру. Натомість він ретельно розробив виборчий закон, який дозволив би йому та безлічі оточуючих його прогнилих ґорил прийти до влади виборчим шляхом, за забороненого перонізму та традиційно розколотого UCR, який політичні потрясіння останніх років розсікли так, що відновити його вже неможливо. З цієї ситуації виникла UDELPA — партія, цілковито побудована навколо його власної постаті, яка в союзі з антиклерикальною PDP, радикалами-уніоністами, демократичними соціялістами та військовими інтересами прагне підтримувати принципово непредставницьку й репресивну лівоцентристську «м’яку диктатуру», доки пам’ять про поваленого тирана не буде повністю стерта плином часу."

 ARG_Juan_Carlos_Ongania: "Хуан Карлос Онґанія"
 POLITICS_JCO_DESC: "Генерал-лейтенант Хуан Карлос «Морж» Онґанія — людина, яка живе й помирає за правилами. Справді, майже фанатична прихильність Онґанії до структури була настільки сильною, що часом призводила до його низьких результатів, як це сталося в Національному військовому коледжі, де він опинився в нижній чверті свого курсу. Ця прихильність до жорстких рамок також відвернула доволі розумного кавалериста від будь-якого інтелектуалізму — відраза, яка в поєднанні з його природною здатністю командувати та особистою чесністю привела його до розвитку як стереотипного «троперо», офіцера, цілковито присвяченого командуванню підрозділом, який ніколи не обіймав штабних чи адміністративних посад.\n\nДотримання правил також зробило планування переворотів глибоко неприємним для Онґанії, хоча його відмова брати участь в анти­пероністських змовах не врятувала його від заслання на другорядну посаду в Генеральній інспекції кінного поповнення, де він животів, наглядаючи за кінними стайнями аж до повалення Перона. Після цього періоду незначної діяльності він став провідним командиром танкових військ. Обурений розпадом організованості в 1960-х роках, Онґанія був доведений до межі, і разом із багатьма своїми колегами-кавалеристами очолив кампанію зі знищення «Колорадо», побічно врятувавши аргентинську демократію та здобувши посаду головнокомандувача у віці 48 років.\n\nВідтоді мотиви Онґанії стають значно туманнішими. Причини його відставки, його можлива участь у перевороті, що привів його до влади, та ступінь, до якого він щиро вірить або був змушений повірити в те, що є великим лідером, майже неможливо визначити. Відомо лише, що план на випадок захоплення влади військовими, зрештою втілений невдоволеними генералами, вимагав призначення Онґанії президентом — на що він погодився лише за умови отримання «чистого чека» для проведення «справжньої національної революції». Що саме це означає, особливо з огляду на зростаючу ворожість між взаємно недовірливими ліберальними й націоналістичними групами, що співіснують у його уряді, ще належить побачити. Проте проєкт Онґанії, схоже, має широку підтримку, включно з більшістю профспілок і великими корпораціями, і навіть його противники визнають його добре освіченою та доброзичливо налаштованою людиною."

 ARG_Jose_Luis_Romero: "Хосе Луїс Ромеро"
 POLITICS_JLR_DESC: "Для Ромеро його репутація історика невіддільна від політично анґажованого громадянина. Походячи з родини іспанських іммігрантів, Ромеро змалку виявляв інтерес до історії та філософії. Невдовзі він здобув інтелектуальний авторитет серед колег завдяки своїм дослідженням греко-римської історії, пишучи для кількох культурних журналів. Пристрасть Ромеро до розуміння механізмів соціальних та економічних структур нерозривно пов’язана з його членством у Соціалістичній партії. Палко виступаючи проти уряду Перона, він був звільнений зі своєї посади в Університеті Ла-Плати, але після перевороту 1956 року був призначений контролюючим ректором цього закладу.\n\n«Перонізм» завжди був для історика-соціяліста суперечливим словом. Рух із фашистськими рисами, якому вдається завоювати серця й думки робітничого класу, мав би бути немислимим, майже неприродним. Але для Ромеро істина була очевидною: пероністи досягли успіху там, де соціялізм зазнав невдачі. Він став одним із головних прихильників зміни курсу, започаткованої соціялістами, намагаючись звернутися до пероністських виборців із більш агресивною антиістеблішментною позицією.\n\nОднак Ромеро важко розв’язати внутрішні суперечності, які переслідували партію останніми роками. США — імперіалістична держава чи союзник у боротьбі проти фашизму? Перонізм — вираження невдоволення робітників чи демагогічна маніпуляція? Навіть попри свої величезні знання в соціальних науках, він досі не має відповіді. Проте він має деякі ідеї щодо їх розв’язання: краща система освіти, більш плюралістична демократія, кращі умови праці. Виправлення структурних недоліків країни — не лише єдиний спосіб допомогти робітничому класу, а й врятувати саму демократію."

 ARG_Ricardo_Balbin: "Рікардо Бальбін"
 POLITICS_BALBIN_DESC: "Обличчя демократичної боротьби проти Хуана Перона та професійний невдаха Рікардо Бальбін тепер зазнав остаточного, нищівного приниження, посівши посаду, за яку він боровся й програв чотири рази, цілковито завдяки великодушності людини, яка тричі його перемагала, — самого Перона.\n\nНасправді це цілком справедливо. Раптовий вихід Бальбіна на передній план аргентинської політики сам був результатом ретельно спланованого кроку Перона: прагнучи стримати тоді, здавалося, невпинне сходження Артуро Фрондісі, Перон наказав навмисно невдалий замах на життя Бальбіна, який, як і очікувалося, перетворив пристойного, але помітно посереднього депутата-інтрансигента на мученика. Справді, план спрацював настільки добре, що Фрондісі був настільки повністю позбавлений своєї більшості в партії, що образився достатньо, аби самому стати активом пероністів.\n\nПісля падіння Фрондісі до рук пероністів Бальбін залишився єдиною доступною опозиції загальнонаціональною постаттю, тож кожні шість років він стомливо йшов назустріч неминучій поразці від Перона та його людей, дедалі більше впадаючи в депресію. Проте виявилося, що цей образ вічного кандидата мав свою користь. Перон, відчуваючи наближення смерті та відсутність гідного наступника, побачив у цьому покірному лідері опозиції корисну й прихильну перехідну постать і вирішив забезпечити його обрання своїм віцепрезидентом, переконаний, що самого його сходження на посаду буде достатньо для мирного демонтажу режиму, контроль над яким він давно втратив.\n\nТепер, після смерті Перона, схоже, його план працює бездоганно: невеликий превентивний переворот непероністських офіцерів, покликаний запобігти будь-якому руху проти законного президента, залишив Бальбіну мало іншого, крім як спостерігати за тим, як Пероністська партія розпадається зсередини. Багато хто, включно з ним, вважає, що це означає повернення до вільних виборів одразу після завершення його терміну. Однак UCRP вже не та, якою була раніше, і такі люди, як Ідальґо Сола, дедалі впливовіший міністр оборони, вважають необхідним продовжити перехідний період, заздалегідь визначивши результат щонайменше наступних виборів через певний франкенштейнівський союз UCRP-PP/PPF, нав’язаний із благословення та під керівництвом військових."

 ARG_Arturo_Umberto_Illia: "Артуро Умберто Ілья"
 POLITICS_ILLIA_DESC: "Типовий шлях в аргентинській політиці зазвичай передбачає, що молоді кордобські адвокати залишають рідну провінцію заради багатообіцяючого майбутнього в коридорах влади Буенос-Айреса. Артуро Ілья, навпаки, був портеньйським лікарем, який вирушив до крихітного містечка Крус-дель-Ехе в середземноморській провінції на пряме прохання самого Іполіто Іріґоєна, який особисто контролював призначення залізничних лікарів.\n\nВідтоді як у 1929 році він отримав своє призначення, Ілья став надзвичайно популярним у Кордові, зарекомендувавши себе чесним адміністратором. Оскільки провінція залишалася вільною від фальсифікацій у 1930-х роках, Кордовська UCR залишалася при владі та розвинула виразно інтрансигентський, лівий ухил, уособлений начальником Ільї, Амадео Саббатіні. Будучи затятим прихильником «Кордовської лінії» Саббатіні, він продовжив її після смерті каудильйо у 1960 році та вирізнився як один із перших антифрондісістів у UCR. За коротким винятком трьох років, коли він був віцегубернатором Кордови, Ілья провів свою політичну кар’єру, працюючи єдиним лікарем у Крус-дель-Ехе, куди часто добирався верхи.\n\nОбраз самовідданого, доброзичливого сільського лікаря, присвяченого покращенню здоров’я своїх громадян, виявився безцінним активом для Ільї протягом усього його президентства. Однак під цією принципово правдивою подобою Ільї також ховається літня, не надто спритна людина, чий погляд на світ залишався принципово незмінним із 1930 року. Його розсіяна манера, застаріла мова, відсутність бачення та виключення нерадикалів із процесу ухвалення рішень викликали порівняння з останніми роками правління його героя Іріґоєна. Що ще гірше, вони спричинили величезне відчуття образи та відстороненості від влади з боку людини, яка, на їхню думку, прийшла з 20% голосів, щоб правити від імені таємної радикальної секти, яка не визнає жодної провини чи вади."

 ARG_Rogelio_Julio_Frigerio: "Рохеліо Хуліо Фріґеріо"
 
 ARG_Carlos_Alberto_Perez_Companc: "Карлос Альберто Перес Компанс"
 POLITICS_CARLOS_ALBERTO_PEREZ_COMPANC: "Коли генерал Онґанія відкинув кандидатуру, подану йому на срібній таці, почався шалений, майже психотичний пошук прийнятного наступника. Серед характеристик, якими мав володіти цей гіпотетичний призначений президент, найважливішими були:\n\n 1. Достатня підтримка з боку PAF (Перон, Асулес і Фрондісі).\n\n 2. Визнана католицька та девелопменталістська репутація.\n\n 3. Достатня дистанція від провідних діячів Фронту, щоб уникнути враження фаворитизму.\n\nДоктор Перес Компанс, надзвичайно католицький підприємець із шанованого землевласницького роду та політичне ніщо, має все це у надлишку. Дійсно, як людина, про яку за кілька днів до оголошення його кандидатури майже ніхто не знав, він мав велику перевагу — нездатність викликати сильні почуття у генералітету Асулесів чи пероністських політичних керівників. Посилена увага, яку він отримав протягом наступних тижнів, включно з ретельною перевіркою його фінансів армійською розвідкою, поставила його у вигідне становище чесного підприємця, чиї інтереси могли лише виграти від законного втілення економічної програми Національного фронту.\n\nПроте серед усієї цієї уваги та перевірок громадська думка, схоже, не помітила його тісного особистого зв'язку з Рохеліо Фріґеріо, людиною схожого комерційного походження. Дійсно, схоже, що його кандидатура — не більше ніж оголений спинний плавець плану Фрондісі та Фріґеріо перехопити Фронт для власних цілей. Однак обдурити всіх їм не вдалося, і один із другорядних партнерів Фронту, генерал (у відставці) Хусто Леон Бенґоа, забив на сполох щодо сумнівної нейтральності кандидата. Так виникло партнерство Компансa з колишнім міністром війни, на превелику радість їх обох.\n\nЇхня перемога, здобута за обережної підтримки пероністських вождів, тепер відкриває шлях до потенційної стабільності. Проте безсумнівно незручне обмеження пероністів лише периферійними ролями в уряді, тоді як основну масу посад займають члени Фрондісістської UCRI та політичні нікчеми з маловідомих націоналістичних груп — на кшталт самого Переса Компанса — ставить під сумнів її життєздатність. Дійсно, з огляду на те, що Пероністська громадянська війна вимальовується на горизонті, навіть повної підтримки самого поваленого тирана може бути недостатньо, щоб уряд Фронту уникнув тієї самої турбулентності, якій його й було задумано запобігти."

 ARG_Jose_Maria_Guido: "Хосе Марія Ґвідо"
 POLITICS_JOSE_MARIA_GUIDO_DESC: "В історії Аргентини президентство Нації виявилося настільки бажаною посадою, що відчай від самої думки про перебування на ній здавався б немислимим — досі.\n\nХосе Марія Ґвідо, доброзичливий адвокат із маленького містечка в Ріо-Неґро, здобув певну політичну популярність у 1956 році як один із «лейтенантів Фрондісі», групи політиків UCR, а згодом UCRI, найбільш близьких до тодішнього президента Національного комітету. Завдяки угоді Перона—Фрондісі він потрапив до Сенату, представляючи провінцію, переважно пероністську за своїми симпатіями, і став наступним у черзі на спадкування після відставки Алехандро Ґомеса, а згодом і після Балбіна.\n\nТак само рішуче, як і сам Фрондісі, налаштований утримати його на посаді, Ґвідо неодноразово відмовлявся від спроб військового кабінету та окремих офіцерів перебрати президентство. Невідомо йому було, що ці спроби організував сам Фрондісі, і зрештою він був втягнутий у змову Президента, покликану забезпечити його безперервність в уряді після повалення. Так стражденний Ґвідо був підштовхнутий до президентства, абсолютно непідготовлений і засмучений. Його єдині вказівки, отримані в листуванні від ув'язненого Фрондісі, звучали так:\n\n«Ґвідо має відмовитися від Партії. Партія має співпрацювати з Ґвідо після виходу з Партії. Відокремити уряд від Партії. зберегти те, що залишилося від Уряду. Законодавці не повинні залишати своїх місць і мають забезпечувати кворум для необхідних рішень. Поки що домовитися про інституційну стабільність. Виклики необхідно подолати, щоб уникнути громадянської війни.»\n\nЗавдання Ґвідо, безсумнівно невдячні через непопулярні заходи, яких вони потребують, ще більше ускладнюються значно зменшеною владою Президента, крахом військової дисципліни та зростаючим бажанням деяких генералів знову покінчити з невдалим експериментом демократії. Але понад усе власне бажання Ґвідо зберегти свій образ і його жах перед перспективою кровопролиття роблять вжиття необхідних заходів для їх зупинки значно складнішим, ніж мало б бути."

 ARG_Vicente_Solano_Lima: "Вісенте Солано Ліма"
 POLITICS_VICENTE_SOLANO_LIMA_DESC: "Доктор Вісенте Солано Ліма походить з іншої епохи, із забутої доби аргентинської політики до Перона. Народжений у 1901 році в сім'ї старіючого росиста, він отримав друге ім'я «Солано» на честь парагвайського диктатора Солано Лопеса, але згодом його сплутали з прізвищем — «Ліма» — настільки, що вони стали невіддільними одне від одного.\n\nМолодий Вісенте вирішив стати адвокатом, але, на відміну від свого шкільного товариша Ернесто Санмартіно, пов'язав себе з консервативною політикою. Його обрали національним депутатом від Націонал-демократів (PDN), а згодом призначили головним міністром у провінційній адміністрації Родольфо Морено. Саме тут він отримав прізвисько «Червоний міністр» за проведення прото-пероністської трудової політики. Усунутий незадовго до перевороту 1943 року, він повернувся і в 1946 році встановив контроль над консерваторами Буенос-Айреса. Хоча під час президентства Перона його ненадовго вислали до Монтевідео за друк консервативних газет, він послідовно заперечував, що є анти­пероністом.\n\nЗавдяки дружнім зв'язкам із профспілковими лідерами та готовності брати участь у сфальсифікованих пероністських виборах Солано Ліма став обличчям PDN протягом більшої частини 1950-х. Його примирливі позиції щодо перонізму поставили його та консерваторів Буенос-Айреса на курс зіткнення з «ліберальними» консервативними партіями внутрішніх провінцій. Зрештою зіткнення відбулося у 1956 році, коли фракція Солано Ліми підтримала Лонарді проти військово-морського перевороту, який його усунув. Криза, що виникла внаслідок цього, знищила PDN, і Солано Ліма створив власну партію — Народних консерваторів (PCP), які прийняли пропероністську політику. Це примирливе ставлення, його захист Лонарді та номінальний неперонізм роблять його прийнятним кандидатом для Фронту національного розвитку Асулесів.\n\nНаціональний фронт, задуманий як об'єднання «продуктивістських» соціальних секторів, які за підтримки військових могли б здійснити амбітний проєкт індустріалізації, не зміг досягти універсальності, яку задумував його творець, також колишній консерватор Родольфо Мартінес. Через відмову більшості радикалів брати участь він став посередником між пероністами, фрондісістами та християнськими демократами, націоналістами й PCP, із Солано Лімою на чолі. На жаль для генералів, які організували створення Фронту, зв'язки Солано Ліми з Пероном значно §Yглибші§!, ніж вони уявляють."

 ARG_Emilio_Hardoy: "Еміліо Ардой"
 POLITICS_EMILIO_HARDOY_DESC: "Доктор Еміліо Хуліо Ардой вважає своєю життєвою місією примирити аргентинський консерватизм із Демократією, яку він створив.\n\nНароджений у родині адвокатів середнього класу, глибоко занурених у консервативну політику Буенос-Айреса, Ардой пережив трагедію зі смертю батька у віці 16 років. Підхоплений системою підтримки місцевої консервативної політичної машини, Ардой уникнув бідності завдяки посаді, отриманій як подачка, у муніципальному уряді Ломас-де-Самори, аж поки не став адвокатом. Залучений своїм благодійником до провінційної партії Буенос-Айреса, Ардой усе своє юнацтво пропрацював у Консервативній партії.\n\nРанні зв'язки принесли свої плоди, і в 1935 році, у віці 24 років, Ардой був обраний національним депутатом на широко сфальсифікованих виборах, які виграла перейменована Націонал-демократична партія. Ці конкретні вибори переслідували Ардоя та решту аргентинського консерватизму протягом багатьох років, а система, що дозволила їм відбутися, зрештою була повалена у 1943 році. Усунені від влади консерватори були охоплені глибокою внутрішньою кризою, ставши жертвами виборчої системи, яку самі створили у 1912 році і яка тепер залишила їх майже без представництва. Ба більше, їхнє виключення з Демократичного союзу непоступливими радикалами, проти яких вони свого часу вдавалися до фальсифікацій, перетворило консерваторів на практично незначну третю силу в національній політиці.\n\nОднак у кожній кризі криється можливість, і неодноразові, свавільні ув'язнення Ардоя пероністами принесли йому в консерватизмі Буенос-Айреса такий самий статус, який подібне поводження принесло Балбіну в UCR. Його єдиний провінційний суперник, Вісенте Солано Ліма, усунув себе з гри, створивши партію-відкол, залишивши тихомовного Адвоката перед монументальним завданням відродження аргентинського консерватизму.\n\nПротягом наступного десятиліття Ардой наполегливо боровся з нездужанням і песимізмом, що охопили перейменований Консервативний союз Буенос-Айреса та його дітище — Національну федерацію центристських партій. Хоча йому вдалося достатньо, щоб «перемогти» на сильно фрагментованих, анархічних виборах, що відбулися після президентства Фрондісі, правда полягає в тому, що FNPC не є справжньою партією, а консерватори не примирилися повністю з демократією після 1916 року. Навіть сам Ардой та його «демократизаторське» крило відкрито закликали до повалення Фрондісі в найтемніші дні його адміністрації. Завдання Ардоя, окрім зовсім не простого обов'язку довести до кінця весь свій термін, полягає в тому, щоб належним чином побудувати справжню консервативну Партію зі справжньою народною базою."

 ARG_Arturo_Uanini: "Артуро Уаніні"

 ARG_Raul_Poggi: "Рауль Алехандро Поджі"
 POLITICS_RAUL_POGGI_DESC: "Різні люди описували генерал-лейтенанта Рауля Поджі як грубого селюка — «кампесано», посереднього офіцера та прототипового зарозумілого горили; він, можливо, уособлює найгіршу сторону аргентинських військових.\n\nНевідомий офіцер, якого незаслужено підвищили внаслідок свідомої політики уряду Фрондісі, спрямованої на прихильність до військових інженерів, колись торрансист Поджі зрадив свого наставника незадовго до того, як той став жертвою непродуманих змов. Отримавши командування обезголовленою армією, Поджі дозволив військово-морському керівництву впливати на себе, що мало мало допомогло його непопулярності у власному роді військ.\n\nСхоже, не помічаючи дедалі сильнішого руху проти себе, Поджі розвинув ще грандіозніші амбіції, дорогою ставши маріонеткою адміралів. Нещастя Фрондісі вкотре відкрило шлях для незаслуженого підвищення, і Поджі весело рушив до президентства після провалу спроб знайти альтернативні рішення, затверджений на своїй посаді хунтою, яку контролював флот.\n\nПоки Поджі весело підписує укази, які майже не намагається читати, країна та армія під ним починають розпадатися. Крайнощі, до яких готові піти тепер вивільнені сили антиперонізму, підточують відносну терпимість і відразу до насильства, які характеризували аргентинську політику навіть за часів недемократичних урядів.\n\nТим часом посередній генерал зазнає дедалі більшого особистого тиску, а його спалахи люті стають звичним явищем, особливо в міру того, як крах армійської дисципліни робить постать армійських Каудильйо, значно популярніших за нього самого, дедалі важливішою."

 ARG_Benjamin_Menendez: "Бенхамін Менендес"
 POLITICS_BENJAMIN_MENENDEZ_DESC: "Для генерал-майора Бенхаміна Менендеса перевороти — не хобі, а спосіб життя. На жаль, він ніколи не був особливо вправним у їх здійсненні.\n\nПісля вступу до армії у 1910 році Менендес був залучений майже до кожної можливої невдалої спроби перевороту. Колись офіцер-націоналіст і ґерманофіл, він неодноразово безуспішно намагався повалити уряди генерала Хусто та доктора Ортіса наприкінці 1930-х. Він охоче підтримав, але був застукан зненацька революцією червня 1943 року проти Кастільйо та успішним ув'язненням Перона у 1945 році. Коли уряд Демократичного союзу збирався перевести його до резерву через його позицію під час війни, він спробував повалити й їх, але не зміг отримати жодної підтримки. Невдовзі після цього кавалерист став затятим лібералом і співпрацював із радикалами-уніоністами у невдалій спробі запобігти вступу Перона на посаду президента у 1951 році.\n\nУв'язнений до кінця президентства Перона, Менендес був звільнений, але усунутий від будь-яких важливих посад. Дедалі більше непокоячись перспективою повернення пероністів протягом президентства Фрондісі, він двічі намагався повалити його, але молодші офіцери часто залякували його, «крадучи» його генералів, і він не відіграв жодної ролі в успішному усуненні Фрондісі. Зрештою, однак, падіння Поджі та його кліки змусило флот, ризикуючи втратити свою владу й престиж, достатньо глибоко поритися в ямі генералів у відставці, придатних для президентства. Так народилася змова, яка висунула Менендеса та Рохаса на посади президента і віцепрезидента за наказом хунти, контрольованої останнім.\n\nПопри надзвичайну роль удачі в його черговій і зрештою успішній змові, 70-річний генерал стикається із серйозними питаннями щодо життєздатності свого президентства. Хоча він цілком при свідомості, його досі безперервна історія невдач, підпорядкованість флоту, колишня ґерманофілія та загальна посередність породили сумніви щодо його корисності. Ба більше, його ставлення до погіршення пероністського насильства, схоже, суперечить дедалі гучнішим закликам до поміркованості в армії."

 ARG_Rodolfo_Martinez: "Родольфо Мартінес"
 POLITICS_RODOLFO_MARTINEZ_DESC: "Мало хто в аргентинській політиці вирізняється серед незліченних легіонів адвокатів — «лос докторес», — які займають більшість посад у всіх трьох гілках влади. Донедавна доктор Родольфо Пастор Мартінес не був одним із них.\n\nКонсервативний адвокат із Кордови, Мартінес став суддею у 1940-х після короткої служби в армії, де служив під командуванням майора Едуардо Лонарді, який, своєю чергою, був одружений із його кузиною. Однак його юридична кар'єра обірвалася, коли членство в національному комітеті Демократичного союзу втягнуло його в політику: він недовго очолював Демократичну партію Кордови, перш ніж його відсунули вбік.\n\nВідомий учасник анти­пероністської опозиції протягом наступних п'яти років, Мартінес відіграв ключову роль у заснуванні Християнсько-демократичної партії. Коли Лонарді повалив Перона у 1956 році, його призначили до Консультативної хунти від нової партії, а після усунення генерала підвищили до міністра промисловості. Протягом усього перебування при владі в тимчасовій адміністрації Гартунґа Мартінес залишався одним із найгучніших анти­пероністських діячів в уряді та зблизився з міністром війни генералом Арамбуру. Незабаром після цього, отримавши довічну посаду в Університеті Буенос-Айреса, він тимчасово відійшов від політики.\n\nПовернення Мартінеса на політичну сцену в останні дні уряду Фрондісі, на вимогу Арамбуру, стало переломним моментом. Обурений розворотом свого політичного друга щодо того, чи слід усувати непоступливого Президента, Мартінес розірвав із ним відносини, заднім числом став лонардістом і приєднався до союзників покійного генерала, прагнучи відродити його політичний проєкт. Після спроби перевороту та усунення останніх перешкод з боку опозиції генералів, пов'язаних з Альваро Алсоґараєм, Мартінес та його протеже Маріано Ґрондона успішно перехопили тимчасову адміністрацію Ґвідо, щоб створити Національний фронт, виборчий інструмент, за допомогою якого вони сподіваються зрушити країну з місця, водночас нейтралізувавши перонізм шляхом його інтеграції до політичної системи."

 ARG_Alfredo_Palacios: "Альфредо Паласіос"
 POLITICS_ALFREDO_PALACIOS_DESC: "Альфредо Лоренсо Паласіос народився в заможній уругвайській родині в 1878 році та став одним із перших членів Соціялістичної партії, від якої його обрали національним депутатом у 1904 році під час короткого експерименту з одномандатними округами. Там Паласіос заприятелював зі своїм колегою-депутатом, колишнім президентом-консерватором Карлосом Пеллегріні, за підтримки якого йому вдалося провести прогресивне трудове законодавство, що й донині є основою його значної популярності серед промислових робітників Буенос-Айреса.\n\nЯк висхідна зірка соціялістів, він здавався їхнім ідеальним кандидатом на перших виборах із загальним виборчим правом у 1916 році, але був виключений за участь у дуелях через кохання до жінки, з якою зрештою відмовився одружуватися. Відсторонений від політики більшу частину 1920-х, Паласіос побудував вражаючу академічну кар'єру, перш ніж його покликали очолити соціялістів після внутрішнього розколу через ставлення до іріґоєнізму.\n\nХоча його підтримка значно зросла в 1930-х, коли соціялісти сформували найбільшу парламентську опозиційну групу уряду UCRA—консерваторів, прихід перонізму після 1943 року практично стер електоральну базу соціялістів, а членство Паласіоса в першому Демократичному союзі принесло йому лише коротке перебування на посаді міністра праці, яку до нього обіймав полковник Перон і яку невдовзі скасували. Здавалося, Паласіос приречений відійти в тінь, а його становище в партії було під загрозою через таких людей, як Амеріко Ґіольді, але невдала спроба запобігти інавгурації Перона знову вивела Паласіоса на передній план як провідного діяча опозиції.\n\nПісля падіння Перона старіючого Паласіоса призначили послом в Уругваї, а в 1958 році він повернувся, щоб вдруге балотуватися на президентство, посівши далеке четверте місце. Після його несподіваної перемоги на виборах до Сенату в 1961 році, яка запобігла розколу хворого PS, його постать пережила відродження, і про нього почали говорити як про кандидата потенційного анти­пероністського фронту, з чим 85-річний Паласіос погодився після того, як Ґіольді переконав його, що він є єдиною людиною, достатньо прийнятною і для радикалів, і для консерваторів, щоб отримати їхні голоси.\n\nСтаріючий Паласіос, правий він чи ні, тепер зробив неможливе: він переміг перонізм — хоч і без Перона — на виборчій урні та завершив 70 років політичної діяльності перемогою, безпрецедентною в аргентинській історії. Хоча його похилий вік не залишає йому шансів пережити свій термін, президент Паласіос помре щасливим, знаючи, що його обрання запобігло поверненню §YТоталітаризму§!, принаймні поки що..."

 ARG_Juan_Domingo_Peron: "Хуан Домінґо Перон"
 POLITICS_JUAN_DOMINGO_PERON_DESC: "Двічі повалений, двічі повернений, полковник Хуан Домінґо Перон здійснив те, чого не зміг навіть Хуан Мануель де Росас.\n\nЗа мовчазної згоди своїх колишніх противників, католицьких націоналістів, самогубної підтримки деяких недолугих лівих і самонав'язаного легалізму певних генералів Асулесів, агентам Перона дозволили перехопити §QНаціональний фронт§! та блискавично провести серію подій, що уможливили його повернення.\n\nХоча вони цього ще не усвідомлюють, згадана вище суміш корисних ідіотів, які, немов уві сні, дозволили повернутися тому самому чоловікові, якого вони колись повалили, ось-ось повністю розчарується у своїх очікуваннях щодо Перона, більш прихильного до їхніх особливих бачень майбутнього Аргентини.\n\nБез зусиль відновлений на своїй посаді, цей проникливий взірець аргентинськості може лише дійти того самого висновку, що й усі інші: перонізм приносить плоди. Відповідно до цього полковник Перон вирішив, що жодних фундаментальних змін до свого початкового уряду, так грубо перерваного у 1956 році, він не потребує. І ось під звуки Marcha Peronista та з переважною більшістю голосів Аргентина радісно повертається в попереднє десятиліття.\n\nДля сорока відсотків країни, якій не пощастило не погоджуватися з цим проєктом, повернений полковник може запропонувати лише місця у в'язниці Вілья-Девото в комплекті зі знайомою гостинністю Спеціальної секції боротьби з комунізмом і, звісно, останнім пунктом у своєму арсеналі дотепів та мудрості:\n\n«§YЯ§! повернувся не тому, що був добрим, а тому, що §Vви§! були набагато гіршими.»"

 ARG_Roberto_Marcelo_Levingston: "Роберто Марсело Левінґстон"
 POLITICS_ROBERTO_MARCELO_LEVINGSTON_DESC: "Президентство Роберто Левінґстона неможливо було б уявити навіть як неймовірну зав'язку оперети Ґілберта й Саллівана.\n\nВирваний із комфортної посади військового аташе у Вашинґтоні через низку дивних збігів, пов'язаних із відхиленням усіх інших можливих кандидатів із короткого списку з 12 видатних генералів і цивільних, серед яких він не фігурував, і повідомлений телефоном про своє призначення під час вечері, Левінґстон може претендувати на найхимернішу історію в усій історії Аргентини. Цей гротескно кумедний випадок, посилений невідомістю нового Президента, відомого лише небагатьом посвяченим аргентинської розвідки, сприяв тому, що його стали сприймати як безпорадну заміну генералу Лануссе, сильному правителю хунти, яка його призначила.\n\nОднак це не могло бути далі від істини. Насправді, всупереч усьому, що можна було уявити, правий шпигун генерал Левінґстон розпочав нахабний хрестовий похід, маючи своїм єдиним союзником радикального лівого хірурга-непоступливого радикала Оскара Аленде. Самі проти всього світу — і могутності хунти Лануссе — єдина надія цієї пари полягає в успіху лівонаціоналістичного економічного плану Аленде та силових маневрах Левінґстона в армії, де він поступається за званням Лануссе. Це самопроголошене «поглиблення революції», зустрінуте апатією й навіть насмішками громадян, втомлених від років військового правління та гучних дискусій\n\nЗіткнувшись із такою байдужістю до їхньої долі з боку тих, кого вони прагнуть захистити, цей останній відчайдушний натиск націоналістів проти насування цунамі військового лібералізму стає не лише дивним, а й майже безнадійним і, як наслідок, романтичним. Чи запам'ятає його так історія, чи лише як трагікомічну спробу розумного, але надмірно амбітного армійського офіцера, який не впорався з масштабом завдання, та політичного викопного, чиї президентські якості з кожним днем наближаються до нуля, перевернути весь політичний істеблішмент від Перона до Лануссе, ще належить побачити. У будь-якому разі Левінґстон і його строката команда ідеологічно різноманітних соратників мають мало часу до того, як завіса над аргентинською революцією опуститься. Якщо вона має завершитися щасливо, тепер усе залежить від них."

 ARG_Alejandro_Agustin_Lanusse: "Алехандро Аґустін Лануссе"
 POLITICS_ALEJANDRO_AGUSTIN_LANUSSE_DESC: "Алехандро Лануссе — прототип, хоча й не стереотип, аргентинського військового каудильйо. Добре пов'язаний, добре освічений і здатний удавати, що він не є ні тим, ні іншим, цей суворий небіж чи не останнього каудильйо до Перона — Аґустіна П. Хусто — став для багатьох в аргентинському суспільстві уособленням армії.\n\nЙого дебют у світі державних переворотів, де він був би професійним гравцем, якби це був спорт, відбувся, коли капітаном він відіграв значну роль у невдалій спробі радикалів-уніоністів запобігти інавгурації Перона у 1951 році. Ув'язнений до 1956 року через цю спробу, Лануссе віддячив своєму визволителю, генералу Лонарді, зрадою, започаткувавши змову, яка повалила його менш ніж через місяць після звільнення. Згодом, відігравши значну роль у піднесенні генерала Онґанії зі свого престижного становища в кавалерії, він був серед тих, хто підштовхнув його розгромити Асулесів у 1962 році.\n\nПротягом наступних років Лануссе та Онґанію часто вважали друзями, але уряд останнього — до появи якого Лануссе доклав чимало зусиль — виявився розчаруванням, тож Лануссе знову зрадив і повалив свого благодійника, який призначив його очільником армії, сподіваючись, що коротка інтерлюдія значно менш впливового генерала прокладе шлях до його власного обрання. Проте його надії знову зазнали краху, і зрештою він дійшов висновку, що найменш ганебним варіантом буде безпосередньо взяти уряд під контроль.\n\nОднак це не означає кінця його амбіцій стати президентом законним шляхом. Насправді Лануссе прийшов до влади з баченням майбутнього: минуле. Точніше, минуле його дядька. Його план полягає в тому, щоб якомога краще відтворити коаліцію сил, яка сформувала давно померлу Конкордансію, і за її допомогою висунути власну кандидатуру, щоб перемогти Перона його ж зброєю. Це завдання, і без того складне, ще більше ускладнилося через втрату престижу військових за останні кілька років. Проте Лануссе та його міністр внутрішніх справ, престижний депутат UCRP Артуро Мор Ройґ, все одно спробують це зробити. Власне, вони мусять, адже Лануссе знає, що заборона перонізму більше не є стійкою, а його вільні вибори тепер — єдине, що стоїть між Аргентиною та поверненням тирана."

 ARG_Isabel_de_Peron: "Ісабель Мартінес де Перон"
 POLITICS_ISABEL_DE_PERON_DESC: "Ісабель Перон перебирає кермо влади від великої людини — свого чоловіка. Виштовхнута на світову сцену разом із цілим світом, який має успадкувати, вона постає їхнім новим месії — не завдяки здібностям, а через їхню відсутність.\n\nНароджена в Ла-Ріосі, ранній вихід зі школи визначив її долю, яка привела її до впливових місць, навіть якщо почалося все в нічному клубі. Усе почалося з чарівного вдівця, чоловіка на ім'я Хуан. Пов'язана тягарем традиції, нинішня Ісабель блякла на тлі Евіти, але все одно залишалася голосом у його вусі.\n\nЗ часом Ісабель знайшла чоловіка, який став її довіреною особою завдяки спільному інтересу до окультизму: Хосе Лопес Реґа. Його вплив допоміг Ісабель стати віцепрезиденткою Хуана, відчайдушно наслідуючи стару пару Хуана та Евіти. Будучи для нього слабкою заміною втраченої Ленори, вона піднялася на цю посаду над Руcci, Балбіном, Менемом та Анкореною завдяки розколотій партії.\n\nТак було, доки Перон не помер. Ісабель стала президенткою не завдяки власним заслугам, а через відсутність суперечностей навколо неї, без зволікань перетворившись на маріонетку. Але згодом стало ясно, що вона не справляється з керуванням країною, тоді як Реґа діє як її Свенґалі, дедалі більше перебираючи на себе функції президентства. Наразі військові та робітничий рух терплять це як засіб для знищення лівого перонізму.\n\nАле рано чи пізно це привілейоване становище закінчиться, щоб його успадкувала нова, підібрана вручну провідниця для Ісабель."

 ARG_Rodolfo_Martinovic: "Родольфо Мартінович"
 POLITICS_RODOLFO_MARTINOVIC_DESC: "Ніхто не може точно сказати, коли почалася Війна проти Рікардо Балбіна. Коли саме зарозумілість Буенос-Айреса та його національного комітету нарешті вичерпала терпіння найближчих прихильників Артуро Ільїї, точно визначити неможливо. Відомий лише її химерний результат і користь, яку він приніс губернатору, можливо, найбільш периферійного штату з усіх.\n\nРодольфо Мартінович народився в Буенос-Айресі в родині хорватських іммігрантів. Досить стереотипно для радикального політика, він вивчав медицину, а потім переїхав у суворий, крижаний Патагонський Південь, щоб практикувати цю професію. Він здобув політичне визнання у своїй новій домівці Санта-Крус завдяки ролі у заснуванні головної лікарні провінції. Однак цього було недостатньо, щоб подолати величезну силу перонізму на сільському півдні, і майбутній віцегубернатор Мартінович зазнав принизливої поразки від підтримуваного пероністами кандидата UCRI на перших виборах у провінції в 1958 році.\n\nОднак Мартінович не здався, і в будь-якому разі його смілива позиція принесла йому підтримку для участі у виборах 1963 року. Стиль його кампанії, загальна манера поведінки та майже месіанське ставлення принесли йому — ймовірно, бажані — порівняння з Жаніу Квадросом. Однак національний статус йому принесло не це, а постійна ворожість, з якою його зустрічали люди Балбіна в провінційній UCRP, та його агресивні відповіді на неї. Відображаючи дедалі сильніше розчарування його веденням внутрішньопартійних справ радикалів, Мартінович відкрито виступив проти президента Національного комітету, тихо підтриманий Ільєю та Кордованською лінією, до якої він належить.\n\nНа подив усіх, цей патагонський Квадрос переміг у протистоянні з Голіафом, і коли Ілья контролював національну виконавчу владу, більше не було кому зайняти місце кандидата в президенти, крім нього самого. Під час виборчої кампанії він повторив свою провінційну стратегію, і його заклики очистити сумнозвісну політику Буенос-Айреса, відстояти права Внутрішніх провінцій та відновити президентську владу виявилися достатньо переконливими, щоб привести його до президентства. Дійсно, іріґоєністський тон його кампанії, нечуваний у радикальних колах протягом багатьох років, загалом вважається причиною його перемоги. Тепер, однак, йому доводиться зіткнутися з реальністю управління, яку значно ускладнює його заявлена опозиція майже до всіх нерадикальних політичних, профспілкових та соціальних секторів. Ба більше, його вороги в UCRP, які й досі ображені на його атаки на Балбіна, почали робити кроки для його усунення."

 ARG_Cirpriano_Reyes: "Сіпріано Рейес"
 POLITICS_CIPRIANO_REYES_DESC: "Помста — це страва, яку найкраще подавати холодною, і Сіпріано Рейес чекає на свою тарілку вже майже два десятиліття.\n\nКолись Рейес був провідним профспілковцем, чиєю мрією було повторити успіх Британської лейбористської партії в умовах швидкої індустріалізації міського району Буенос-Айреса. Цю мрію перехопив прихід певного полковника на посаду заступника міністра праці, який перетворив мрії Рейеса на персоналістський кошмар. Проте він намагався змусити це працювати. Дійсно, між 1943 та 1945 роками мало хто працював так невтомно, як він, заради успіху кар'єри Перона. Коли його ув'язнення зробило його непридатним для висунення кандидатом того року, Перон наказав своїм прихильникам голосувати порожніми бюлетенями. Рейес не погодився і сам балотувався в президенти, а в 1952 році — проти Перона.\n\nЗа це непокірного лідера робітничого руху ув'язнювали і радикальні, і пероністські уряди, але він отримав посаду в адміністрації Лонарді, яку не зміг обійняти через її коротке існування. Проте він був сповнений рішучості відродити Лейбористську партію та поволі працював із профспілковцями, які дедалі більше втомлювалися від віддаленого керівництва Перона. Його успіх у створенні анти­пероністсько-пероністського фронту з профспілкою Аугусто Вандора та кількома нео­пероністськими політиками дозволив йому назавжди вирвати кермо робітничого руху з рук полковника. Окрім дисидентських пероністів, об'єднаних у його власній PL, UP, PTB, PP та кількох MPP, Рейес, за допомоги колишнього президента Фрондісі, заручився підтримкою широкої коаліції менших партій — від MID Фрондісі до християнських демократів і навіть деяких ультраправих націоналістичних партій.\n\nЦя перемога політичної винахідливості та незалежного робітничого руху повністю перевернула аргентинську політичну сцену, як і готовність військових дозволити Рейесу вступити на посаду. Що станеться далі — загадка, але одне напевно: ера Перона завершилася, а Рейес став її могильником."

 ARG_Guillermo_Estevez_Boero: "Ґільєрмо Естевес Боеро"
 POLITICS_GUSTAVO_BOERO_DESC: "Як адаптувати Соціялізм до особливостей аргентинської нації? Після років випробувань і поневірянь соціялістичний активіст, народжений у Росаріо, схоже, зрозумів, як це зробити. Більшу частину свого життя Боеро вирізнявся як важлива постать студентського активістського руху, присутня в кожному конфлікті на захист прав студентів. Попри те, що його характеризували як людину дії та організатора, а не мислителя, Боеро розвинув власну політичну теорію для пожвавлення соціялістичного руху.\n\nПопри майже непримиренні відмінності, перонізм і радикалізм мають більше спільного, ніж усі думають: націоналістичні народні рухи, які місцеві та іноземні економічні еліти мусили зупиняти силою. На думку Боеро, шлях до «національного визволення» лежить через політичний союз для гарантування стабільності демократичної системи. Спираючись на спадщину Альфредо Паласіоса, Боеро вважає, що народний рух, заснований на рівності, соціальній справедливості та демократії, покладе край аргентинському циклу самознищення.\n\nТепер, коли він став несподіваним переможцем виборів 1969 року, він хоче втілити свої ідеї на практиці. Соціялізм без бомб чи зброї, але досягнутий через демократичний консенсус, захист національних інтересів і солідарність із братніми латиноамериканськими націями. Нову націю не будуватимуть на смерті й ненависті, а надії на майбутнє.\n\nАле, §Rщо, як усе закінчиться так само, як з усіма іншими, хто намагався і зазнав невдачі?§!"

 ARG_Emilio_Jofre: "Еміліо Хофре"
 POLITICS_EMILIO_JOFRE_DESC: "Якщо й був момент, коли старий консервативний рух міг змінитися, то це саме він. У руках Еміліо Хофре консерватизм або житиме, або помре.\n\nНароджений у заможній родині в провінції Мендоса, Хофре вперше здобув популярність, коли зумів вихопити посаду губернатора з рук і пероністів, і радикалів. До кінця шістдесятих Хофре був одним із найуспішніших консерваторів Аргентини. Це був ідеальний момент, оскільки консервативні партії почали перегруповуватися, відроджуватися і зрештою реформуватися. В Еміліо Хофре вони мали свого кандидата.\n\nНеймовірно, але кампанія спрацювала — Хофре та PDR стрімко прийшли до влади. Тепер Хофре має сформувати перший уряд, керований єдиною консервативною партією, від 1943 року. Це величезний виклик, але Хофре готовий до нього. Хоча його помірніший анти­перонізм і феміністичні погляди можуть суперечити поглядам багатьох у його партії, його проникливість дозволила йому зібрати кабінет, який може раз і назавжди повернути назад хвилю реформізму.\n\nМоже здатися божевіллям, що Еміліо Хофре такий спокійний. Для тих, хто всередині його партії, його успіх — або його провал — визначатиме долю консервативного руху на десятиліття вперед. Але це просто його робота. Перед лицем очікувань він не може зробити нічого, крім як взятися до роботи."

 POLITICS_ISAAC_ROJAS_DESC: "Адмірал Ісаак «Чорна Мураха» Рохас, названий так через свою любов до широких чорних сонцезахисних окулярів і невисокий зріст, або, можливо, через те, що він безсоромно женеться за владою, наче мураха.\n\nЗвісно, тепер на Рохаса чекає подібна безславна доля. Колись головний владний гравець у військовій хунті та союзник, що став заклятим ворогом Перона, Рохас втратив значний вплив після необачної підтримки урядів Поджі та Менендеса. Рохас, чия влада над усім, крім флоту, вислизнула далеко з його рук, тепер був змушений підкоритися плану Арамбуру щодо контролю над країною. У межах цієї схеми Рохас тимчасово виконує обов'язки президента Республіки, доки не відбудуться вибори, на яких «перемога» Арамбуру вважається політичними аналітиками наперед визначеною. Мало хто впевнений, що станеться з Рохасом після приходу Арамбуру до влади, і найменше з усіх — сам Рохас."

 ARG_Julian_Licastro: "Хуліан Лікастро"
 POLITICS_JULIAN_LICASTRO_DESC: "Президента Аргентини не існує, є лише майор Хуліан Лікастро, очільник «Пероністського технологічного командування» (CTP), організації, яка здавалася б вигадкою погано написаної белетристики, якби не була настільки реальною. Молодший офіцер, який закінчив навчання першим у своєму класі, Лікастро завдяки своїм пероністським симпатіям отримав безпрецедентно швидкі підвищення та призначення очільником Пероністського технологічного командування. Цей відділ Пероністської партії, відповідальний за довгострокове політичне планування та формування функціональної пероністської філософії, тепер узяв під контроль державний механізм.\n\nКоли віцепрезидент Перона, обраний у надзвичайному порядку, почав надто швидко відхилятися від усталених пероністських принципів, Лікастро зрозумів, що це стане смертельним дзвоном для революційного процесу, який розпочався в червні 1943 року. Тож він був змушений повстати проти уряду, якому присягнув на вірність. Він, полковник Хосе Луїс Валоні та інші молодші пероністські офіцери, а також молоді члени Пероністської партії, такі як Хуліо Барбаро та Карлос Ґроссо, здійснили надзвичайний переворот, щоб врятувати перонізм від самого себе. CTP офіційно «втрутився» в діяльність Пероністської партії, щоб реформувати її з огляду на забезпечення її більшої життєздатності. Точніше, Лікастро пообіцяв послабити чистки лівих пероністів і наполегливо працює над створенням послідовної ідеологічної основи, у межах якої перонізм зможе діяти.\n\nСказати це легше, ніж зробити. Хоча Лікастро може правити нацією, парадоксально він є підлеглим і до того ж досить молодшим офіцером армії. Він іде по канату. Усталений пероністський політичний клас, без сумніву, плете змови проти нього, а лояльність багатьох членів CTP сама по собі викликає питання. Попри ці виклики, Лікастро сповнений рішучості втілити своє бачення, але залишається питанням, чи зможе його уряд молодших чиновників та ідеологів, багато хто з яких щойно закінчив університет, протриматися достатньо довго, щоб завершити його."

 ARG_Carlos_Menem: "Карлос Сауль Менем"
 POLITICS_CARLOS_MENEM_DESC: "Бути одночасно володарем Ла-Ріохи, віцепрезидентом, професійним гонщиком ралі, побожним мусульманином, сім'янином і медійною особистістю — нелегке завдання. Проте Карлос «Турок» Менем із радістю та харизмою, що не має рівних серед професійних демагогів у всьому світі, виконує всі ці ролі одночасно. Дійсно, цей шанувальник Факундо Кіроги, який розпочав свою політичну кар'єру менш ніж двадцять років тому, став настільки популярним, що почав лякати навіть самого Перона.\n\nНенадовго обраний губернатором Ла-Ріохи перед поверненням Перона у 1964 році, він, як це часто роблять пероністські губернатори, перетворив свою провінцію на жорстко контрольовану феодальну вотчину, де відбулися одні з найбільш кричуще нерівних виборів протягом другого та третього урядів Перона. Однак ще до закріплення цієї бази його постійні поїздки до інших провінцій вказували на довгострокову виборчу кампанію, плоди якої мали бути зібрані колись у майбутньому. Так сталося, що коли настав час, Менем зміг домогтися власного обрання віцепрезидентом і фактичним наступником хворого Перона.\n\nБалотуючись на комічно демагогічній платформі, настільки явно відірваній від економічної реальності, що навіть багато його власних прихильників ставили під сумнів її серйозність, Менем став відомий не лише як кандидат «на продовження курсу», а й як той, хто здійснюватиме перонізм ще радикальніше, ніж сам Перон. Частково це правда: Менем має намір зберегти режим і його методи. Проте приватне бачення Менемом економічної та геополітичної ситуації цілком відрізняється від того, що він демонстрував публічно. Переконаний у неминучості перемоги Америки в Холодній війні та неефективності аргентинської економіки, новий Президент вирішив — на шкоду традиційним принципам пероністської ідеології — відповідно скоригувати режим.\n\nОстанньою перешкодою перед тим, як Менем отримає достатню політичну силу всередині Пероністської партії для цього, є позачергові вибори, які він призначив. Цей крок спричинив контрольовану, але значну відлигу, настільки, що вона перетворилася на справжню боротьбу. Тож його противники, об'єднані або в §CАвтентичній пероністській партії§!, сформованій із залишків очищених лівих у PP/PPF, або в §MРадикальному громадянському союзі§!, мають певний шанс його перемогти. Дійсно, як вказує тривожно популярний передвиборчий слоган, який просувають перші, традиційний пероніст може опинитися під загрозою проголосувати за §YМенема§!, але обрати §lАлсоґарая§!."

 ARG_Manuel_de_Anchorena: "Мануель де Анкорена"
 POLITICS_MANUEL_DE_ANCHORENA_DESC: "Маючи прізвище, яке Ева Перон охарактеризувала як «смердюче гноєм», Мануель де Анкорена пережив усі приниження та підозри, породжені його надзвичайно привілейованим походженням, заради однієї мети: використати перонізм як інструмент для досягнення життєвої мети — реабілітації Хуана Мануеля де Росаса, губернатора Буенос-Айреса з 1835 до 1852 року. Хоча ця мета може здаватися надто езотеричною, щоб присвятити їй усе життя, для дуже значної кількості інтелектуалів, націоналістичних бойовиків і профспілковців це священний хрестовий похід історичного значення.\n\nДля цього землевласника-скотаря, який став пероністським політиком, місія повернути його тезку до слави також забезпечила йому значну виборчу базу всередині Пероністської партії, яка дотримується або традиціоналістських, або фашистських політичних течій і поділяє ту саму мету. За їхньої допомоги Анкорена був піднесений на колишню посаду свого героя — губернатора Буенос-Айреса, а згодом і до віцепрезидентства. Тепер, перебуваючи біля керма держави, Анкорена вважає своїм першим пріоритетом забезпечити реабілітацію Росаса на рівні, вищому, ніж навіть багато його прихильників вважали можливим. Дійсно, він прямо засудив спадщину Конституції 1853 року та ліберальну думку загалом і, схоже, готовий поступово ліквідувати всі залишкові сліди того й іншого в Пероністській Конституції, водночас відновлюючи певні естетичні атрибути, використовувані за часів Росаса.\n\nОкрім цього хрестового походу проти лібералізму, Анкорена, схоже, переважно залишив уряд своєму кабінету — дивній збірці однодумців-профспілковців, армійських офіцерів та функціонерів Пероністської партії з відносно різним ідеологічним походженням, яка, за винятком деяких економічних скорочень, більш-менш зберегла більшість політик, що діяли на момент смерті Перона. Дійсно, єдиною сферою, де уряд Анкорени виявив особливу активність, стали репресії проти лівих, незалежно від їхнього ідеологічного походження. Зокрема, дедалі більш всеосяжна діяльність міністрів Оскара Іваніссевича та Альберто Отталаґано породжує чутки про широкомасштабну чистку, більш подібну до тих, що були звичними в Німеччині."

 POLITICS_LEONDRO_ANAYA_DESC: "Штат Ріу-Ґранді-ду-Сул — дивне місце для виконання обов'язків генералом з аргентинської військової родини, але саме там нині опинився Ельбіо Леандро Аная з II армійського корпусу.\n\nПопри те, що він із завзяттям узявся за завдання умиротворення півдня Бразилії, іноді йому важко придушити відчуття, що його обділили. Він побоюється, що його батько, Ельбіо Карлос, який відслужив термін на посаді військового міністра Фрондісі, або навіть його кузен Леандро, якого не відправили до Ріу-Ґранді-ду-Сул, мали кращу долю. На щастя, Аная — людина, для якої почуття обов'язку понад усе.\n\nЗвільнений з армії після участі в путчі Менендеса проти Перона у 1951 році, Аная був поновлений на службі через два роки та підвищений у званні. Відтоді він повільно просувався службовими сходами, у 1961 році обійнявши посаду заступника директора Вищої військової школи імені генерала Паса, а згодом, у 1965 році, директора Кавалерійської школи. Ставши командувачем II армійського корпусу наприкінці шістдесятих, він отримав завдання очолити аргентинське вторгнення до Ріу-Ґранді-ду-Сул після того, як до влади прийшов комуніст Леонел Бріcола.\n\nЗатятий антикомуніст, Аная вважає своїм обов'язком встановити «санітарний кордон» проти потенційного червоного режиму в Бразилії — комунізм не можна допустити до Буенос-Айреса, якою б суворою не була ціна його стримування. Незалежно від своїх сумнівів, Аная достеменно знає, що допомагає захищати всю Америку від варварства, але також вважає, що йому не завадило б заручитися певною місцевою підтримкою своєї місії, поки він уже цим займається."

