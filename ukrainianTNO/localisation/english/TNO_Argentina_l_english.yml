l_english:
 ### Ministers ###
 ARG_Alfredo_Roque_Vitolo: "Альфредо Роке Вітоло"
 ARG_Alfredo_Roque_Vitolo_hog_desc: "§YМіністр внутрішніх справ\nЛіберальний радикалізм§!\n--------------\n§LАльфредо Роке Вітоло спочатку був «ленсиністським» радикалом, названим на честь лівого мендосинського каудильйо, який очолював UCR провінції у 1920-х роках. Коли угруповання Ленсіна занепало після його вбивства радикалами-суперниками, Вітоло присягнув на вірність Національному комітету UCR, що забезпечило йому швидке підвищення до очільника Радикальної партії Мендоси та короткий період у Конґресі перед червневим переворотом 1943 року, який породив перонізм.\n\nКоли Фрондісі розколов UCR у 1958 році, Вітоло знову вирішив залишитися на боці переможців і приєднався до «Непримиренних», хоча й програв праймеріз на посаду губернатора Мендоси. Як втішний приз, він отримав міністерство внутрішніх справ — відповідальне за поліцейські сили та мікроуправління політичними справами, — де виявився напрочуд довговічним, ставши єдиним міністром із початкового кабінету Фрондісі, який досі залишається на посаді.§!"
 ARG_Miguel_Carcano: "Міґель Анхель Каркано"
 ARG_Miguel_Carcano_for_desc: "§YМіністр закордонних справ\nЛіберальний консерватизм§!\n--------------\n§LМіґель Каркано — син консервативного губернатора Кордови Рамона Хосе Каркано, міністра кабінету 1890-х років і одного з низки консерваторів, які підтримали перонізм. Хоча в 1930-х роках його двічі обирали депутатом від консерваторів, а сам він залишається членом PD, Каркано поставив дипломатичну кар’єру вище за партійну приналежність.\n\nПротягом Другої світової війни працюючи послом у Франції, Великій Британії та Сполучених Штатах, Каркано зблизився з Джозефом Кеннеді та його родиною. Це стало головним чинником його призначення міністром закордонних справ після усунення соратників Фрігеріо під тиском військових.§!"
 ARG_Alvaro_Alsogaray: "Альваро Карлос Альсогарай"
 ARG_Alvaro_Alsogaray_eco_desc: "§YМіністр економіки\nЛібералізм§!\n--------------\n§LЯк і багато генералів, які змовляються з метою повалення Фрондісі, Альваро Альсогарай розпочав свою політичну кар’єру кадетом під час повалення Іполіто Іріґоєна, колишнього кумира Фрондісі. Однак, на відміну від своїх колег-офіцерів, «Ель Інхеньєро» Альсогарай пішов у відставку в званні капітана, щоб зосередитися на своїй дедалі більшій прихильності до вільноринкової економіки.\n\nХоча його погляди значно розходяться з настроями суспільства — навіть у найбільш консервативних секторах, — а його Partido Cívico Independiente залишається мізерною, його зв’язки з військовими принесли йому кілька міністерських посад: очільника торгівлі (1956–58), а тепер і міністра економіки. Схоже, його кандидатуру підтримав Рохеліо Фрігеріо — людина, яку він де-факто замінив, — який вважав його корисною фігурою для стримування інфляції, водночас приділяючи увагу започаткованим ним проєктам розвитку. На розчарування Фрондісі, він здебільшого не виправдав цієї обіцянки, а його зв’язки з військовими роблять його дуже важкозамінним.§!"
 ARG_Rosendo_Fraga: "Росендо Фраґа"
 ARG_Rosendo_Fraga_sec_desc: "§YВійськовий секретар\nЛіберальний консерватизм\n§!\n--------------\n§LГенерал Росендо Фраґа походить із родини, глибоко зануреної в найбільшу традицію аргентинських військових — змови, — і, як його батько до нього, він досяг «політичного» керівництва армією як Secretario de Guerra (військовий міністр). Хоча Росендо — чий дід, батько та син мають те саме ім’я — неодноразово змовлявся проти Фрондісі як командувач IV дивізії в Кордові, після піднесення до кабінету — здійсненого під тиском генерала Торонсо-Монтеро — він змінив свою думку й став палким лоялістом.\n\nФраґа, самопроголошений «ліберальний консерватор», поступово, але впевнено почав недовіряти своєму колишньому союзнику Торонсо-Монтеро та його найближчим прихильникам в армії. Його успіх, якому сприяють його товариський характер і особистий авторитет, безумовно, виявиться життєво важливим для виживання Фрондісі.§!"

 ARG_Mariano_Grondona: "Маріано Ґрондона"
 ARG_Juan_E_Guglialmelli: "Хуан Е. Ґуґліальмеллі"
 ARG_Juan_C_Rosas: "Хуан К. Росас"
 ARG_Mariano_Grondona_hog_desc: "§YМіністр внутрішніх справ\nКонсерватизм§!\n--------------\n§LРозумний молодий чоловік, якого швидкість його сходження до владних коридорів далеко винесла за межі його глибини, доктор Маріано Ґрондона тепер має взяти на себе величезну відповідальність за міністерство внутрішніх справ надзвичайно крихкого уряду Frente Nacional, який він допоміг зібрати.\n\nПриведений на посаду заступника міністра на хвилі останнього союзника Фрондісі Родольфо П. Мартінеса, Ґрондона, католик і нещодавно пом’якшений анти-пероніст, отримав завдання не допустити розпаду політичних фракцій усередині Фронту та стримувати політичні амбіції перонізму. Його головним ворогом у цьому завданні є вкрай обмежена кількість особистих зв’язків — побічний продукт його молодості та нещодавнього приходу в політику.§!"
 ARG_Mario_Amadeo_for_desc: "§YМіністр закордонних справ\nНаціональний католицизм§!\n--------------\n§LНа більш розсудливому боці спектра аргентинського Nacionalismo перебуває група навколо доктора Маріо Амадео Френча, юриста з величезним авторитетом. Досвідчений Амадео, досвідчений дипломат із невеликою роллю в посередництві під час укладання перемир’їв наприкінці Другої світової війни, обіймав міністерство закордонних справ в уряді Лонарді, а згодом здивував багатьох своїх ультраправих друзів, спрямувавши свої значні інтелектуальні та особисті ресурси на підтримку Фрондісі у 1958 році.\n\nЦі зв’язки з Фрондісі дали націоналістам те, чого вони ніколи не здобували іншими засобами: електоральну значущість і гарантований контроль над закордонними справами. На відміну від інших, більш егоїстичних націоналістів, Амадео знає, коли варто зупинитися, маючи перевагу, і майже не має стимулу робити щось інше, крім як намагатися зберегти Frente Nacional таким, яким він є, принаймні доти, доки не отримає достатніх гарантій, що будь-які зміни гарантуватимуть новонабуту владу Nacionalista.§!"
 ARG_Juan_E_Guglialmelli_eco_desc: "§YМіністр планування\nНаціональний лібералізм§!\n--------------\n§LДля багатьох в армії ім’я Артуро Фрондісі у 1958 році викликало страх, майже жах. Для «J.E.G.» однак президент-розвивальник став благословенням — як політично, так і для його кар’єри. Ґуґліальмеллі, прихильник ідей Фрондісі й, можливо, найвидатніший інтелектуал в армії, став плідним автором на захист економічних цілей уряду, що лише зміцнило його особисту дружбу з Фрондісі.\n\nПісля його визначної ролі як провідного Асуля під час війни між армійськими фракціями 1962–63 років Ґуґліальмеллі був підвищений до генерала й, із появою Frente Nacional, отримав контроль над економічною політикою за згодою як Фрондісі, так і Фрігеріо. Хоча формально він очолює міністерство планування, а не економіки, саме він контролює напрямок економіки, основою якого є його нові §CPlanes de Desarollo§!."
 ARG_Juan_C_Rosas_sec_desc: "§YВійськовий секретар\nДеспотизм§!\n--------------\n§L«Червоний генерал» армії Хуан Карлос Росас є найпомітнішим очільником «Сундрахістів», групи офіцерів, пов’язаних із націоналізмом Азад Гінд та його лідера. Через це його іноді звинувачують у «марксизмі», хоча це зовсім не так, але він залишається значно толерантнішим до лівих «соціялізуючих» заходів, ніж інші генерали.\n\nЦя толерантність і його рішучий легалізм зробили його очевидним кандидатом на те, щоб терпіти нинішній уряд.§!"

 ARG_Juan_Palmero: "Хуан Палмеро"
 ARG_Miguel_Angel_Zavala_Ortiz: "Міґель Анхель Савала Ортіс"
 ARG_Juan_Carlos_Pugliese: "Хуан Карлос Пульєсе"
 ARG_Ignacio_Avalos: "Іґнасіо Авальос"
 ARG_Juan_Palmero_hog_desc: "§YМіністр внутрішніх справ\nЛіберальний радикалізм§!\n--------------\n§LХуан Северіне Палмеро настільки ж лояльний президенту Іллі, наскільки може бути лояльним член UCRP. Член «Кордобської лінії» та очільник провінційного уряду під час уряду Хартунґа, Палмеро отримав складне завдання не допустити усунення Іллі, розумно випускаючи тиск через клапан, яким є безперервна заборона перонізму.\n\nНа жаль для уряду, Палмеро, ймовірно, не та людина для цієї роботи. Не надто талановитий і не надто популярний, він отримав призначення переважно завдяки своєму становищу в Кордовській UCR.§!"
 ARG_Miguel_Angel_Zavala_Ortiz_for_desc: "§YМіністр закордонних справ\nЛіберальний радикалізм§!\n--------------\n§LКолись король Ґорил, Міґель Анхель Савала Ортіс за останні кілька років пом’якшив свою позицію щодо перонізму разом зі своєю групою «поміркованих» уніоністів. Усунутий від бажаної посади міністра економіки через наполягання Іллі на балансуванні фракцій UCR, Савала Ортіс зрештою опинився в міністерстві закордонних справ.\n\nДещо небезпечніше проамериканський, ніж і країна, і президент Ілля, Савала-Ортіс був позбавлений частини своїх повноважень самим Іллею, який вважає, що його міністри мають переважно «дорадчі» ролі.§!"
 ARG_Juan_Carlos_Pugliese_eco_desc: "§YМіністр економіки\nЛібералізм§!\n--------------\n§LХуан Карлос Пульєсе — дуже рідкісний приклад у аргентинській політиці звичайного партійного політика. Радикал із юності, він обіймав різні посади, піднімаючись службовими сходами самої UCR, перш ніж спеціалізуватися як законодавець: спочатку як обраний сенатор від рідного Буенос-Айреса, а потім як національний депутат. Не маючи нічого особливого — жодних родинних зв’язків, військових друзів, езотеричних уявлень про економічне зростання — Пульєсе вирізнявся в UCR лише своєю нормальністю.\n\nОднак перебування Пульєсе у світі нормальності закінчилося, коли він став відомим як «заступний міністр усіх радикальних урядів». Дещо неохоче відкликаний, щоб замінити Суссіні на посаді міністра юстиції після його падіння в немилість, Пульєсе мріяв повернутися до законодавчого органу, коли Еухеніо Бланко, головний економічний радник Артуро Іллі, помер посеред передвиборчої промови. Обраний на його місце, Пульєсе змирився із завданням проведення помірковано прогресивної та протекціоністської кейнсіанської економічної програми, яка принесла йому напрочуд мало особистих ворогів у бурхливому світі аргентинської політики.§!"
 ARG_Ignacio_Avalos_sec_desc: "§YВійськовий секретар\nДеспотизм§!\n--------------\n§LВсупереч тому, що вважає багато хто з широкої громадськості, основна маса армійських офіцерів зі сформованими політичними поглядами — помірковані радикали. Іґнасіо Авальос серед цього моря людей є одним із найбільш пересічних.\n\nОфіцер генерального штабу був відправлений у відставку за перебування на стороні, що програла, під час planteo 1957 року, і тому залишився осторонь подій, що відбулися після цього. У поєднанні з його відомою приналежністю до UCRP це зробило його прийнятним для генерала Онґанії, якому особливо сподобалося, що він був офіцером у відставці.§!"

 ARG_Pablo_Gonzalez_Bergez: "Пабло Ґонсалес Берґес"
 ARG_Adolfo_Vicchi: "Адольфо Віккі"
 ARG_Raul_Prebisch: "Рауль Пребіш"
 ARG_Pablo_Gonzalez_Bergez_hog_desc: "§YМіністр внутрішніх справ\nЛіберальний консерватизм§!\n--------------\n§LПабло Ґонсалес Берґес — і права рука Хардоя, і його праве крило. Ґонсалес Берґес значно більш «ґорила», ніж президент, мав колорадські симпатії, що викликають негативні почуття у військових, які врівноважуються лише впевненістю, що його присутність у міністерстві не допустить повернення Перона.\n\nУ більшості інших питань Ґонсалес Берґес і Хардой — одне й те саме, а його призначення насамперед розглядалося як спосіб підвищити статус консерваторів Буенос-Айреса, чия електоральна база значно менша, ніж у внутрішніх провінціях.§!"
 ARG_Adolfo_Vicchi_for_desc: "§YМіністр закордонних справ\nАристократичний консерватизм§!\n--------------\n§LКолишній губернатор Мендоси, що постарів, є одним із небагатьох національних діячів великого значення 1930-х років, які продовжують брати участь у національній політиці. Хоча його дещо менше заплямовано шахрайством того десятиліття, ніж інших відомих консерваторів, Віккі найбільше відомий своєю роллю у змовах проти Перона протягом 1950-х років, будучи потенційним міністром закордонних справ багатьох гіпотетичних революційних урядів.\n\nХоча Віккі вже досить старий, йому віддали перевагу перед молодшими кандидатами через його відкладену мрію обійняти цю посаду та через надмірно велику роль мендосинського консерватизму в тріумфі Хардоя.§!"
 ARG_Raul_Prebisch_eco_desc: "§YМіністр економіки\nКонсерватизм§!\n--------------\n§LФігура величезного авторитету в економічних колах усього світу, призначення Рауля Пребіша до міністерства економіки стає несподіванкою. Хоча Пребіш був функціонером останнього консервативного уряду 1930-х років — і відіграв важливу роль у часто критикуваному договорі Рока—Рансимана, — його прийняття розвивальництва в пізніші роки викликало гнів улюблених економістів аргентинського консерватизму. Запропоновані ним рішення економічної кризи 1956 року також викликали достатньо обурення практично з усіх боків, щоб спричинити його тимчасове вигнання.\n\nПроте Хардой відкликав Пребіша на посаду міністра економіки, очевидно прийнявши «розвивальництво» Фрондісі як основу економічної політики. Хоча Пребіш — той, хто винайшов цей термін — має значно менш про-мультинаціональне й більш вільноринкове бачення цього явища, його призначення є великою перемогою плану Фрондісі поширити свій вплив за межі президентства.§!"
 ARG_Rosendo_Fraga_hardoy_sec_desc: "§YВійськовий секретар\nЛіберальний консерватизм§!\n--------------\n§LДещо несподівано відставний генерал Фраґа повернувся на свою колишню посаду у військовому міністерстві на вимогу свого брата, депутата-консерватора. Рекомендований завдяки своїй ролі в захисті законності під час уряду Фрондісі, він є прийнятним для армії Асулів — ледве.\n\nОднак набагато важливіше з політичного погляду те, що Фраґа представляє одного з багатьох колишніх функціонерів Фрондісі, яких консервативний уряд зберіг або поновив на посадах.§!"

 ARG_Carlos_Sanchez_Viamonte: "Карлос Санчес Віамонте"
 ARG_Torcuato_S_Di_Tella: "Торквато С. Ді Телья"
 ARG_Carlos_Sanchez_Viamonte_hog_desc: "§YМіністр внутрішніх справ\nДемократичний соціялізм§!"
 ARG_Americo_Ghioldi_for_desc: "§YМіністр закордонних справ\nДемократичний соціялізм§!\n--------------\n§L«Ґіольді — політичний опортуніст чи просто стурбований антифашист?» — запитують політичні журнали. «Залежить від мого настрою», — саркастично хоче відповісти Ґіольді, але він знає, що його вороги жадають його крові. Народившись у Буенос-Айресі, Ґіольді продовжує родинну традицію політичного компромісу, а його брати Родольфо та Орестес самі є комуністичними лідерами. Палкий ворог Перона, Ґіольді брав участь у кожній змові з метою усунення його від влади й радів його остаточному падінню. Його співпраця з наступним військовим урядом і спроби кинути виклик партійним настановам поставили під загрозу його політичне становище, і лише втручання Паласіоса врятувало його від незначущості. Як міністр закордонних справ Ромеро, Ґіольді хоче переконатися, що Аргентина не відвернеться від США — єдиної країни, здатної зупинити фашизм. Зрештою, хтось має поставити троцькістів і прихильників перонізму на місце, перш ніж вони все зіпсують.§!"
 ARG_Torcuato_S_Di_Tella_eco_desc: "§YМіністр економіки\nДемократичний соціялізм§!\n--------------\n§LВважається або ледачим привілейованим дитям, або видатним дослідником — одним із двох спадкоємців імперії Ді Телья неможливо не помітити. Народжений у родині заможних італійських іммігрантів, його батько був промисловцем-філантропом, який утік від диктатури Муссоліні. Передбачалося, що він опікуватиметься сімейною компанією, але його більше цікавила соціологія, ніж сіре життя керівника, чим він розчарував батька. Він подорожував світом від Швеції до Ізраїлю, навіть одружився з індіанкою. Разом з іншими дослідниками він заснував Instituto de Desarrollo Económico y Social, присвячений економічним і політичним дослідженням. Протягом багатьох років головною одержимістю Ді Телья було дослідження способів упровадження соціялізму в Аргентині. Як міністр економіки Ді Телья прагне сприяти виробництву споживчих товарів, співпрацюючи з іншими південноамериканськими економіками. Хоча він особливо не любив перонізм, тепер починає переглядати деякі свої погляди.§!"
 
 ARG_Aldo_Ferrer: "Альдо Феррер"
 ARG_Eduardo_R_Castro_Sanchez: "Едуардо Р. Кастро Санчес"
 ARG_Silvano_Santander_hog_desc: "§YВіцепрезидент\nЛіберальний радикалізм§!\n--------------\n§LСільвано Сантандер уособлює найбільш істеричний анти-перонізм у всій Аргентині. Публіці він відомий передусім своїми перебільшеними, часом наклепницькими заявами про пронацистську діяльність своїх політичних опонентів та участю в «корпусі постійних змовників» за уряду Фрондісі.\n\nОбрання Сантандера віцепрезидентом колегією виборців було насамперед відповіддю на бажання Демократичного союзу продемонструвати найдужче доступне антифашистське обличчя. Можливо, ця мета була перевиконана, оскільки дедалі гучніші заклики Сантандера до повномасштабних чисток і розслідувань «тоталітарної» діяльності, схоже, неодмінно стануть політикою, щойно слабке здоров’я Паласіоса зрештою вичерпає себе.§!"
 ARG_Adolfo_Vicchi_ud_ii_for_desc: "§YМіністр закордонних справ\nАристократичний консерватизм§!\n--------------\n§LКолишній губернатор Мендоси, що постарів, є одним із небагатьох національних діячів великого значення 1930-х років, які продовжують брати участь у національній політиці. Хоча його дещо менше заплямовано шахрайством того десятиліття, ніж інших відомих консерваторів, Віккі найбільше відомий своєю роллю у змовах проти Перона протягом 1950-х років, будучи потенційним міністром закордонних справ багатьох гіпотетичних революційних урядів.\n\nІз появою UD консерватори отримали лише кілька значущих міністерств, серед яких закордонні справи були найпрестижнішими, і вони неминуче призначили свого найвідомішого анти-пероністського дипломата очолити його.§!"
 ARG_Aldo_Ferrer_eco_desc: "§YМіністр економіки\nДСОціальний радикалізм§!\n--------------\n§LЦіною для UD за голоси Оскара Аленде стала економічна політика нового уряду, представлена протеже губернатора Буенос-Айреса, висхідною зіркою економічного націоналізму Альдо Феррером.\n\nХоча деякі його політики є відверто анафемою для консервативних секторів, які віддали значну частину голосів за UD, страх повернення до перонізму зробив ризик протекціонізму достатньо прийнятним. Ба більше, політика Феррера відповідає поглядам значної частини офіцерського корпусу Асулів, що робить його перебування в уряді прийнятним — поки що.§!"
 ARG_Eduardo_R_Castro_Sanchez_sec_desc: "§YВійськовий секретар\nДеспотизм§!\n--------------\n§LОдностайне рішення уряду Демократичного союзу, що значно зміцнився електорально, усунути більшу частину армійського керівництва від командування викликало побоювання значної нестабільності, на що відповіддю стало об’єднання ролей військового міністра та головнокомандувача армії в одній особі, відомій своїм глибоким «легалістським» походженням.\n\nВибір упав на Едуардо Ромуло Кастро Санчеса, чиє призначення головнокомандувачем зумовило відставку переважної більшості командування Асулів. Відомий як загалом аполітичний і легалістський офіцер, він, доки залишається в армії, значно зменшуватиме можливість переворотів.§!"
 ARG_Ernesto_Sanmartino_hog_desc: "§YМіністр внутрішніх справ\nЛіберальний радикалізм§!"

 ARG_Benjamin_Rattenbach: "Бенхамин Раттенбах"
 ARG_Jose_Maria_Guido_for_desc: "§YМіністр закордонних справ\nЛіберальний радикалізм§!\n--------------\n§LПрезидент Ґвідо насправді не розуміє, що ті нечисленні повноваження, які він мав під час свого короткого й нещасливого президентства, тепер зникли, але йому все одно байдуже.\n\nЗ радістю допомагаючи плану Фрондісі до майбутніх виборів, а потім назавжди залишаючи політику, Ґвідо продовжує виконувати свою церемоніальну роль президента, виступаючи чимось на кшталт пишномовного міністра закордонних справ.§!"
 ARG_Benjamin_Rattenbach_sec_desc: "§YВійськовий секретар\nНаціональний католицизм§!\n--------------\n§LДля генерала Раттенбаха, найближчого друга покійного генерала Лонарді, успіх ініціативи Frente Nacional є здійсненням мрії.\n\nХоча Раттенбах — непохитний анти-пероніст, він усе ще дотримується думки, що, якщо відокремити їх від Перона, пероністи як політична сила є за своєю суттю національними, християнськими та принципово прийнятними. Ба більше, кабінетна боротьба між Асулями та Віолетами дозволила йому відсунути погляд генерала Онґанії щодо верховенства головнокомандувача над військовим міністром і, схоже, усунула останню перешкоду на шляху нормалізації армії.§!"

 ARG_Alberto_Maria_Fonrouge: "Альберто Марія Фонруже"
 ARG_Rogelio_Frigerio: "Рохеліо Фрігеріо"
 ARG_Manuel_Reimundes: "Мануель Реймундас"
 ARG_Alberto_Maria_Fonrouge_hog_desc: "§YМіністр внутрішніх справ\nПопулістський консерватизм§!\n--------------\n§LЖиттєво важливою частиною плану Солано Ліми «Операція Повернення» є вибір міністра внутрішніх справ, прийнятного для військових Асулів, але зрештою обізнаного з реальним планом Солано Ліми та готового його підтримати.\n\nАльберто Марія Фонруже, адвокат у кримінальних справах і співзасновник Народної консервативної партії, був ідеальною людиною для цієї роботи. Його вважали одним із найбільш справжніх «консерваторів» партії, тому його призначення викликало мало нарікань, адже він уже виконував роль федерального інтервентор-ґубернатора в Коррієнтесі в останні місяці президентства Ґвідо. Багато хто вважав його гарантом перебування Солано Ліми в уряді всупереч тиску пероністів, але правда полягає в тому, що ні він, ні Солано Ліма не мають наміру чинити опір таким вимогам.§!"
 ARG_Rogelio_Frigerio_eco_desc: "§YМіністр економіки\nНаціональний лібералізм§!\n--------------\n§LПовернувшись із короткого вигнання в Уругваї, економічний представник Фрондісі нарешті отримав шанс офіційно обійняти посаду міністра економіки. Змінивши тактику з управління на обмін голосів на контроль над економікою, це портфоліо є платою за роль Фрондісі в обранні Frente Nacional.\n\nЧи мав сам Фрігеріо офіційно очолити міністерство, спочатку залишалося питанням глибокого занепокоєння для багатьох офіцерів Асулів, але — помилкове — припущення, що його его завадить будь-яким узгодженим діям кабінету проти панівного військового істеблішменту, який із певним побоюванням спостерігає за урядом власного створення, зрештою перемогло побоювання щодо його «тоталітарних» зв’язків.§!"
 ARG_Manuel_Reimundes_sec_desc: "§YБезпека війни\nДеспотизм§!\n--------------\n§LПолковник Мануель Реймундас є водночас тіньовою та публічною фігурою, відомою націоналістичними симпатіями та публічним шляхом — як багато хто у Frente Nacional, він обіймав посаду в ефемерному уряді Лонарді, — але про його життя чи походження відомо мало.\n\nХоча його дуже коротке перебування у військовому міністерстві в перші дні уряду Фрондісі принесло йому більше ворогів, ніж друзів, Реймундаса знову призначили на цю посаду через його ранній анти-перонізм і прихильність до Лонарді, що зробило його прийнятним для генералів Асулів, які боялися, що Фронт може бути використаний для сприяння поверненню §YТирана§!. Однак деякі підозрюють, що Реймундас має такий самий намір наслідувати його сходження, як і не допустити його повернення...§!"

 ARG_Isaac_Rojas: "Ісаак Рохас"
 ARG_Ernesto_Sanmartino: "Ернесто Санмартіно"
 ARG_Arturo_Mathov: "Артуро Матхов"
 ARG_Isaac_Rojas_hog_desc: "§YМіністр внутрішніх справ\nВійськова хунта§!\n--------------\n§LЧерез суто технічну особливість того, як працює уряд Менендеса, Ісаак Рохас не є президентом. Фактично, в усьому, крім імені й титулу, Ісаак Рохас є єдиним правителем усієї Аргентини. Формально Ісаак Рохас є очільником військово-морських справ Аргентини, хоча його вплив на чинний уряд набагато більший. Із часів диктатури Перона Рохас був палким прихильником президента Перона, аж до перевороту проти нього в «56-му. Відтоді його підтримка диктатора згасла, і він поклявся зробити все від нього залежне, щоб не допустити його повернення. Змусивши Менендеса посісти місце при владі, схоже, він досяг свого.\n\nДосягнувши своєї головної мети останніх кількох років, Рохас отримав нову мету: забезпечити безперервне президентство Менендеса, доки ім’я «Перон» не буде забуте не лише Аргентиною, а й самою історією.§!"
 ARG_Ernesto_Sanmartino_for_desc: "§YМіністр закордонних справ\nЛіберальний радикалізм§!\n--------------\n§LЕрнесто Санмартіно зробив більше, ніж можна було б повірити, щоб утримати Аргентину вільною від Перона. Можна припустити, що для кожного існує межа того, наскільки далеко він готовий зайти заради досягнення своїх цілей, точка, після якої кращим варіантом стає просто здатися. На жаль для Хуана Домінґо Перона, такої межі не існує — принаймні поки що.\n\nКолишній депутат і міністр внутрішніх справ до 1951 року, Санмартіно пожертвував своєю кар’єрою разом із Менендесом під час самоперевороту, намагаючись не допустити повернення Перона до влади. Масштаб зусиль, до яких Санмартіно вдався заради цього грандіозного завдання, не залишився непоміченим, як і не приніс йому найбільшої кількості медалей. Однак він не допустив Перона до влади, і цього достатньо.§!"
 ARG_Arturo_Mathov_eco_desc: "§YМіністр фінансів\nЛіберальний радикалізм§!\n--------------\n§LСеред усіх тих, хто ненавидить Хуана Домінґо Перона, повалений диктатор породив небагатьох противників, настільки ж шалено сповнених злості до цієї людини, як Артуро Матхов. Народжений в Аргентині в сім’ї російських євреїв, Матхов протистояв Перону від найперших днів його режиму, аж до участі в низці терористичних нападів проти диктатора. Саме ця рішуча ненависть до нього принесла Матхову посаду політика-уніоніста UCR, а потім і місце в кабінеті Менендеса.\n\nВід перших днів режиму Перона Матхов раз у раз доводив, що здатен не допустити Перона до Аргентини. Рано чи пізно волю Матхова знову буде випробувано, і Матхов буде готовий зустріти це випробування.§!"
 ARG_Pedro_Eugenio_Aramburu_sec_desc: "§YМіністр війни\nВійськова хунта§!\n--------------\n§LНі для кого не секрет, що політика Аргентини була заплутаним безладом. Уніоністи, пероністи, радикали та помірковані вже встигли побувати при владі в Аргентині, а тепер черга знову дійшла до радикальних поміркованих — військової диктатури, яка має повернути Аргентину від краю прірви. Життя аргентинського політика перетворилося на життя клоуна, а Аргентина — на цирк. Ніхто не втомився від цього більше, ніж Педро Еухеніо Арамбуру.\n\nВійськовий за фахом, Арамбуру втомився. Найбільше його стомлює те, що ознаки цього знову проявляються. Цикл починає повторюватися, і нічого не можна зробити, щоб його зупинити, окрім як самому покласти йому край, чого б це не коштувало.§!"

 ARG_Junta_Militar: "Хунта Мілітар"
 ARG_Armando_P_Martineja: "Армандо П. Мартінеха"
 ARG_Adolfo_Vicchi_poggi: "Адольфо Віккі"
 ARG_Carlos_Eugenio_Moori_Koening: "Карлос Еухеніо Мурі-Кьонінґ"
 ARG_Junta_Militar_hog_desc: "§YВлада законодавчого органу\nВійськова хунта§!"
 ARG_Armando_P_Martineja_for_desc: "§YОчільник економічної ради\nВійськова хунта§!\n--------------\n§LНещасливим наслідком жахливих потрясінь аргентинської боротьби є простий факт, що мало хто взагалі може з цим щось зробити. Завжди є люди, які піднімаються відповідно до вимог ситуації, але є незліченні маси, які просто дозволяють життю відбуватися з ними. Армандо П. Мартінеха не є ні тим, ні іншим і водночас є обома.\n\nДля кожного, хто стикався з перспективою перонізму, реакцією була або огиду, або цікавість, і мало хто залишався «на роздоріжжі» щодо цього питання. Щодо цього питання позиція Мартінехи чітко визначена. А саме, він відчуває унікальну злість до цієї людини й був визначальним обличчям пересічного Колорадо, якщо не найважливішим для подальшого виживання анти-пероністського руху. Для Мартінехи, якщо це означає, що Перон залишиться за межами Аргентини, цього достатньо.§!"
 ARG_Adolfo_Vicchi_poggi_eco_desc: "§YМіністр фінансів\nАристократичний консерватизм§!\n--------------\n§LДоктор Адольфо Анхель Віккі вперше зіткнувся з політикою, ставши губернатором Мендоси в 1930-х роках, але був примусово усунутий федеральною інтервенцією у своїй провінції. Тоді він швидко зрозумів, що влада полягає в зброї, а нова хвиля військового втручання в аргентинську політику залишиться надовго, а отже, жоден політичний проєкт не зможе вижити без військової підтримки. Піднесення запального популізму Хуана Домінґо Перона стало несподіваною й жахливою загрозою для консервативного істеблішменту, і перед її обличчям доктор Віккі поклався на те, що вважав справжньою владою Аргентини.\n\nБудучи частиною широкої коаліції — від консерваторів і радикалів до соціялістів на кшталт братів Ґіольді, — доктор Адольфо Віккі організував бомбардування Пласа-де-Майо, намагаючись повалити Перона; після провалу підтримав військове захоплення уряду Перона роками пізніше, що принесло йому поважну дипломатичну посаду, а згодом і посаду при генералі Поґґі. Доктор Адольфо Анхель Віккі — лише один із багатьох цивільних, які зрозуміли, де насправді лежить влада в Аргентині, і вона не в урні для голосування.§!"
 ARG_Carlos_Eugenio_Moori_Koening_sec_desc: "§YМіністр війни\nВійськова хунта§!\n--------------\n§LЩо може змусити людей чинити найгірші злочини? Для одних це їхня країна, для інших — їхній Бог, а є й такі, хто здатен чинити найгірші мислимі вчинки, керуючись надією на кращий світ. Інші мають більш буденні причини: жінку. Паріс спричинив загибель Трої через Єлену, Марк Антоній зрадив Рим заради Клеопатри, але цих чоловіків збили зі шляху живі спокусниці, тоді як випадок полковника Мурі-Кьонінґа був дещо своєрідним.\n\nУсе почалося з простого завдання, даного генералом Хартунґом: зберігати тіло Еви Перон під наглядом і не дозволити використати його як осередок пероністського опору, і полковник Кьонінґ виконав його з прусською дисципліною. Але полковник Кьонінґ не був чистим пруссаком: покоління на південь від екватора зробили їх не відміннішими від будь-якого ґаучо, з усіма вадами цієї раси. Коли він уперше поклав Евіту на горищі й побачив ці блакитні очі, цю забальзамовану бліду красу, збережену на всю вічність, щось у ньому змінилося. Полковникові почали снитися кошмари, у яких Евіта ходила будинком уночі; іноді він відчував жіночі парфуми на сходах, чув звук граційних кроків, що йшли його вітати, коли він повертався з роботи, чув далекі голоси, коли лежав із дружиною, які кликали його на горище. Чутки про ці нічні візити почали поширюватися лісовою пожежею — від офіцерів Вищого командування до підривників, замкнених у камерах, усі відчували огиду до історій про найвідданішого військового міністра Поґґі, який закохався в Мертву; разом із цією огидою йшов страх: якщо він здатен на таке, то на що ще він здатен?\n\nКоли ситуація вдома стала нестерпною, під тиском його дружини було викликано довіреного єпископа для проведення екзорцизму над тілом Еви Перон. Можливо, якби вона була мудрішою, пані Мурі-Кьонінґ наказала б провести екзорцизм над власним чоловіком.§!"

 ARG_Mariano_Jose_Drago: "Маріано Хосе Драґо"
 ARG_Federico_Pinedo: "Федеріко Пінедо"
 ARG_Rodolfo_Martinez_hog_desc: "§YМіністр внутрішніх справ\nХристиянська демократія§!\n--------------\n§LЗапрошений до вмираючого кабінету Фрондісі на наполягання генерала Арамбуру, Родольфо «Роло» Мартінес посварився зі своїм благодійником і, чи то з помсти, чи то з переконання, вирішив перешкоджати його політичним амбіціям, допомагаючи спробам забезпечити виживання Фрондісі.\n\nКоли вони зазнали невдачі, Фрондісі доручив Мартінесу знайти та переконати Хосе Марію Ґвідо обійняти посаду, щоб запобігти військовому перевороту. Дружба, що виникла між двома чоловіками в нестерпній тривозі кількох годин між їхньою першою зустріччю того дня та офіційною присягою Ґвідо, була достатньою, щоб новий президент попросив Мартінеса залишитися міністром внутрішніх справ і спробувати знайти якесь рішення проблеми майбутніх пероністських депутатів і губернаторів, обрання яких ще не було скасовано.§!"
 ARG_Mariano_Jose_Drago_for_desc: "§YМіністр закордонних справ\nКонсерватизм§!\n--------------\n§LСин, можливо, найвпізнаванішого міністра закордонних справ в історії Аргентини, Маріано Хосе Драґо настільки глибоко занурений у традиції аргентинського консерватизму — Jockey Club, дипломатична служба та La Prensa — що майже нерозрізнимо зливається з масою своїх однопартійців.\n\nНа його честь, Драґо — компетентний дипломат і розумний інтелектуал, але має мало того, що вирізняло б його серед інших потенційних кандидатів на цю посаду, окрім його досвіду роботи в іноземних посольствах.§!"
 ARG_Federico_Pinedo_eco_desc: "§YМіністр фінансів\nКонсерватизм§!\n--------------\n§LУлюбленою темою Хосе Марії Ґвідо у передвиборчих промовах понад 30 років було погано відгукуватися про Федеріко Пінедо.\n\nКолишній соціяліст, а згодом незалежний соціяліст, став улюбленим економістом аргентинського лібералізму протягом 1930-х і 1940-х років. Двічі обіймаючи посаду міністра фінансів у той період, його роль у продажу комунальних підприємств стала особливо сумнозвісною через тогочасні зловживання й викликала гнів як націоналістів, так і непримиренних радикалів.\n\nПрактично зникнувши з політики на наступні двадцять років, Пінедо був повернутий на свою колишню посаду за рекомендацією Родольфо Мартінеса, що Ґвідо здалося більше схожим на хворобливий, іронічний жарт.§!"

 ARG_Rodolfo_Decker: "Родольфо Деккер"
 ARG_Rodolfo_Decker_hog_desc: "§YМіністр внутрішніх справ\nПеронізм§!"

 ARG_Roman_Subiza: "Роман Субіса"
 ARG_Roman_Subiza_hog_desc: "§YМіністр внутрішніх справ і політичних справ\nПеронізм§!\n--------------\n§LДоктор Роман Субіса провів перші роки перонізму, хірургічно вбиваючи федералізм усюди, де той становив загрозу будівництву пероністського режиму. Виконуючи це завдання, молодий Субіса став інтервентор-ґубернатором шести провінцій — рекорд в історії Аргентини, — кар’єру, трагічно обірвану в 1956 році, коли він разом із Пероном утік у вигнання.\n\nКоли колишній політичний мікроменеджер полковника, Анхель Борленґі, тепер уже помер, кращого кандидата на його посаду у внутрішніх справах, ніж Субіса, не було. Під час короткого президентства Віски він діяв із безпрецедентною спритністю та швидкістю, перекроюючи виборчі округи новоствореної мажоритарної системи як очільник політичних справ. Ця трудова етика дала йому перевагу над його суперником, міністром зв’язку Раулем Аполдом.§!"
 ARG_Mario_Amadeo_peron_for_desc: "§YМіністр закордонних справ\nНаціональний католицизм§!\n--------------\n§LМаючи дивну й цікаву відзнаку служити міністром закордонних справ і в кабінеті Перона, і в уряді людини, яка його повалила, Маріо Амадео покладає надії на те, що мрію Nacionalista, яку обіргало усунення останнього, можна певним чином наблизити завдяки першому.\n\nХоча періодичні Nacionalista-імпульси Перона — породжені, наскільки можна здогадуватися, часом доби та розташуванням планет — залишають певний простір для надій Амадео, його очікування щодо волі Перона неминуче будуть так само жорстоко розбиті, як очікування Фрондісі чи Куке.§!"
 ARG_Jorge_Antonio: "Хорхе Антоніо"
 ARG_Jorge_Antonio_eco_desc: "§YПрезидент Центрального банку та Інституту іноземної валюти\nПеронізм§!\n--------------\n§LОдин із найбільш езотеричних мандатів перонізму, що виник із підтримуваної самим полковником корпоратистської переваги, полягає в тому, що економікою мають керувати бізнесмени. Однак, як і багато ранніх соратників Перона, «геній» торгівлі оловом Міґель Міранда вже давно помер.\n\nЗамість Міранди де-факто адміністратором економіки тепер є Хорхе Антоніо, який накопичив величезні статки за першого пероністського режиму завдяки сумнівним практикам, працюючи радником президента з промислових питань. Як і Міранда, новий очільник BCRA виявляє готовність керувати економікою так само, як своїми підприємствами, — спекулюючи, — водночас неминуче позитивно відповідаючи на прохання Перона збільшити державні витрати, щоб задовольнити його профспілкову базу.§!"
 ARG_Miguel_Angel_Iniguez: "Міґель Анхель Ініґес"
 ARG_Miguel_Angel_Iniguez_sec_desc: "§YМіністр війни\nПеронізм§!\n--------------\n§LСпочатку лояльний, але непероністський генерал, М. А. Ініґес був доведений до крайнощів несправедливим ставленням до нього з боку військового міністра Арамбуру після повалення Перона й Лонарді відповідно. Сповнений люті та відчаю через реваншистський поворот, якого набула Revolución Libertadora, Ініґес наприкінці 1950-х і на початку 1960-х років підбурював розпорошені гарнізони до зрештою невдалих повстань — донкіхотської кампанії, яка здобула йому повагу вигнаного Перона.\n\nХоча угода Перона з загнаним у кут Онґанією і, через нього, верховним командуванням Асулів прямо забороняла повернення відставних офіцерів на службу, політичні посади, такі як військове міністерство, усе ще відкриті для таких людей, як Ініґес, який, своєю чергою, мусить працювати в межах згаданої угоди, щоб забезпечити лояльну армію для поверненого Полковника.§!"

 ARG_Italo_Luder: "Італо Людер"
