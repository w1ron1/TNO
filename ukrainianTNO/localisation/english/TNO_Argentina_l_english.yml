 ARG_the_death_of_discipline: "Смерть дисципліни"
 ARG_the_death_of_discipline_desc: "Повернення на службу анти­пероністських офіцерів, очищених протягом 1950-х років, та одночасна чистка пероністських і лонардістських офіцерів вивели з ладу традиційно сувору ієрархію Збройних сил Аргентини та підірвали дисципліну до рівнів, майже небачених у цивілізованому світі.\n\nЦе знищення усталених традицій в армії мало два зовнішні прояви: постійне мікрокерування політичними справами з боку груп поновлених офіцерів, параноїдально налаштованих щодо можливого повернення Перона, що проявляється в постійних і принизливих §Rвійськових planteos§!, які знову й знову змушували президента Фрондісі поступатися військовим вимогам.\n\nХоча проти цього стану хаосу §Yзростає спротив§!, президент Фрондісі та інші, прагнучи уникнути відповідальності за кровопролиття, відмовлялися віддати «професіоналістам» у війську накази, які їм парадоксальним чином необхідні для придушення постійних заколотів.\n\nБа більше, збереження чинності §YДоктрини уряду де-факто§!, відповідно до якої законність переворотів підтверджується давніми елементами аргентинської судової практики, робить перспективу §R«Революцій»§! постійною небезпекою."

 ARG_structural_unhingement: "Структурний розлад"
 ARG_structural_unhingement_desc: "«Протягом тривалого часу найбільшою недугою, що вражає Аргентину, є неавтентичність майже в усіх її проявах. Через відсутність міцної культурної основи, боягузтво чи комфорт в Аргентині майже всі «прикидаються». Сама країна проголошує себе цілком нормальною і навіть демократичною нацією, хоча очевидно, що всі звикли маскуватися під тих, ким вони не є. Ця невідповідність між реальною країною та видимою, формальною, номінальною нацією найвиразніше проявляється в політичній сфері.»\n\n- Доктор Пабло Ґонсалес Берґес"

 ARG_greekback_lira_blues: "Блюз ліри з грецьким забезпеченням"
 ARG_greekback_lira_blues_desc: "Аргентинське населення переслідує майже патологічна одержимість. На перших шпальтах газет, у вступних монологах сатириків, на профспілкових конгресах і в Торговій палаті є одна тема розмов, яка змушує здригатися всіх, хто має частку в майбутньому економіки: ціна італійської ліри або, в деяких колах, долара США щодо песо.\n\nХоча одержимість ціною іноземної валюти певною мірою перебільшена через сплески покупок, спричинені сенсаційністю в медіа, меркантильний характер аргентинської економіки робить ціну іноземної валюти більш-менш точним зовнішнім вираженням умов обміну та довіри до економіки. Таким чином, економічні результати уряду §jпередусім, імовірно, оцінюватимуться за ціною іноземних валют у будь-який конкретний момент§!."

 ARG_juan_domingo_el_ausente: "Хуан Домінґо Ель Аусенте"
 ARG_juan_domingo_el_ausente_desc: "Стаття 1: На всій території Аргентинської Республіки забороняється:\n\na) Використовувати зображення, символи, знаки, значущі вислови, доктрини, статті та художні твори, які можна обґрунтовано тлумачити як такі, що представляють §Yпероністських§! осіб або організації, з метою утвердження ідеології поваленого режиму.\n\nВикористання портрета або фотографії скульптури §Yпероністських§! посадовців чи їхніх родичів, §Yпероністського§! герба та прапора, власного імені поваленого Президента, імен його родичів, висловів §Y«перонізм», «пероніст», «юстиціялізм», «юстиціяліст», «третя позиція»§!, абревіатури §YPP§!, дат, уславлюваних поваленим режимом, музичних композицій «Марш §Yпероністів§!» та «Евіта Капітана» або їхніх фрагментів, а також промов поваленого Президента чи його дружини або їхніх фрагментів.\n\nb) Використання людьми та для цілей, установлених у попередньому абзаці, зображень, символів, знаків, значущих висловів, доктрини, статей і художніх творів, які претендують на такий характер або можуть бути кимось сприйняті як такі, створених чи таких, що будуть створені, які в будь-який спосіб можуть стосуватися представницьких осіб, організацій або ідеології §Yперонізму§!.\n\nДекрет-закон 41/61, 1956"

 ARG_anarchy_in_the_army: "Анархія в армії"
 ARG_anarchy_in_the_army_desc: "Ми самі, дедалі більш самі, як наслідок дріб'язкової політики, якою ми самі займалися. Коли я кажу «ми», я маю на увазі людей в армії, з якими ми багато років були разом, вважаючи, що нас об'єднує спільний знаменник, а сьогодні мусимо визнати, що єдине, що нас об'єднує, — це бути проти Перона. Наші розбіжності знищили й розсіяли нас, а ще гірше — дискредитували нас.\n\nДисципліна мертва, і ми її вбили."

 ARG_navy_controlled_army: "Армія під контролем флоту"
 ARG_navy_controlled_army_desc: "Армія, занурена у внутрішню боротьбу, виявилася нездатною запобігти маніпуляціям з боку свого традиційного ворога — аргентинського флоту. Її найвищі генерали, які покладалися на підтримку флоту, щоб позбутися своїх суперників, тепер мусять платити данину своїм господарям в Армаді.\n\nХоча це становище принципово нежиттєздатне, наразі флот має вільні руки для керування життям нації без втручання з боку найсильнішої противаги йому у Збройних силах."

 ARG_reign_of_the_cavalry: "Правління кавалерії"
 ARG_reign_of_the_cavalry_desc: "Коли справа дійшла до вирішального моменту, Бог виявився на боці більших батальйонів.\n\nКінець «Колорадо» у війську від рук танків аргентинської кавалерії також ознаменував піднесення командирів цього роду військ, що давно відчували себе занедбаними командною структурою армії. Їхнім першим заходом стала масштабна й безпрецедентно ретельна чистка армії, яка спустошила лави піхоти та інженерних військ. Після чистки майже всі старші посади тепер посідають кавалеристи-асулеси та їхні союзники в артилерії — становище, яке, як очікується, триватиме щонайменше десятиліття."
