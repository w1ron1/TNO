 #Events
 CPV_POR.1.t: "Терміновий звіт про колоніальні володіння"
 CPV_POR.1.d: "Справи в Кабо-Верде йдуть погано. Невдоволення серед корінного населення невдовзі призведе до краху португальської адміністрації, яка досі чіпляється за цей регіон. Ви можете запобігти цьому, швидко вигравши війну."
 CPV_POR.1.a: "О ні... ну й нехай"

 CPV_POR.2.t: "Крах португальського Кабо-Верде"
 CPV_POR.2.d: "Час вичерпано. Залишки португальської адміністрації пішли у відставку. На їхнє місце до влади прийшли настільки ж прихильні до Португалії місцеві жителі. Поспішайте виграти війну, перш ніж хтось зробить усе ще гірше."
 CPV_POR.2.a: "Краще вони, ніж соціялісти"

 CPV_POR.3.t: "Кабо-Верде повертається додому"
 CPV_POR.3.d: "Після завершення громадянської війни життєво важливий зв'язок між Кабо-Верде та Лісабоном було відновлено. Колонія знову під нашим контролем, хоча ми залишимо їй більше автономії, ніж раніше."
 CPV_POR.3.a: "Ура"

 CPV_POR.4.t: "Кабо-Верде повертається додому"
 CPV_POR.4.d: "Після завершення громадянської війни життєво важливий зв'язок між Кабо-Верде та Лісабоном було відновлено. Режим, очолюваний місцевими жителями, приєднався до нас."
 CPV_POR.4.a: "Ура"

