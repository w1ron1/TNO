 #Ideas
 CPV_Tarrafal_Shocks: "Потрясіння Таррафала"
 CPV_Tarrafal_Shocks_desc: "Нестабільність, що виникла під час португальської громадянської війни, не обмежувалася фронтами чи вулицями, адже перебої в системі постачання Португалії спричинили дефіцит припасів, що торкнувся практично всіх, навіть ув'язнених. Особливо сильно це позначилося на виправній колонії Таррафал, яку давно використовували для ув'язнення політичних в'язнів із материкової Португалії, а ізоляція Кабо-Верде лише погіршила ситуацію.\n\nГостра потреба в припасах для цивільного населення призвела до скорочення пайків для ув'язнених Таррафала, що спричинило масові заворушення по всьому тюремному комплексу. Оскільки уряд Кабо-Верде й без того ледве дає раду з наслідками війни на материку, пожежі в Таррафалі стали похмурим символом безперервного хаосу, що нині охопив острів."

 EQG_Towards_Federation: "На шляху до федерації"
 EQG_Towards_Federation_desc: "Рідкісний промінь надії з'явився після інституційної анархії португальської громадянської війни: ПАІГК у Кабо-Верде змогла вислизнути з-під португальського контролю й рушити до власної незалежности. Важливим союзником у цьому прагненні стала перемога сестринської партії ПАІГК у сусідній лузо-колоніальній Гвінеї-Бісау, яка так само звільнилася від португальського контролю.\n\nЗ огляду на спільну політичну та регіональну спадщину, а також територіальну близькість, уряди Кабо-Верде та Гвінеї-Бісау розпочали процес об'єднання двох держав у єдину федерацію, сподіваючись об'єднати колишні колонії в ім'я національного самовизначення."

 CPV_Loans_Lawyers: "Позики та юристи"
 CPV_Loans_Lawyers_desc: "Гонка за створення вільного й незалежного Кабо-Верде завершилася приходом до влади ДСКВ, яка відтоді забезпечує свободу островів, поки Португалія продовжує оговтуватися від громадянської війни. Цей процес ускладнюється тим, що, хоча значну частину ДСКВ становлять уродженці Кабо-Верде, які працюють юристами, частина партії складається з представників діаспори, що повернулися зі Сполучених Штатів Америки, через що їхнє правління виглядає частково іноземним витвором.\n\nПро-ОВНівський ухил ДСКВ не допоміг приховати цей образ, але поточні партійні програми індустріалізації, схоже, допомагають пом'якшити ці побоювання. Уряд ДСКВ вирішив брати позики, переважно в держав-союзниць ОВН, щоб допомогти розбудувати промисловість островів як засіб надолужити економічне відставання після століть колоніального правління."

 CPV_Archipelagic_Neutrality: "Архіпелажний нейтралітет"
 CPV_Archipelagic_Neutrality_desc: "Зіткнувшись із перспективою бути втягнутим у незліченні конфлікти, що спустошують материкову Африку, нещодавно встановлений режим СНККВ на вимогу своїх західноафриканських союзників офіційно прийняв політику нейтралітету щодо справ на континенті. Оскільки незалежність від Португалії була здобута лише нещодавно, узгоджені уряди держав уздовж Гвінейської затоки вирішили, що острівний ланцюг слід захистити, зберігаючи його осторонь від напружености на материку.\n\nСтавши свідком насильства Іберійського колапсу, важко повірити, що хитка ситуація в Африці буде менш нестабільною, якщо в Західній Африці знову спалахне війна. Дипломатична ізоляція від майбутніх конфліктів у регіоні може вберегти населення островів від подальшого кровопролиття, але ускладнює їм приєднання до будь-якої регіональної чи глобальної сили. Поки Кабо-Верде здатне зберігати баланс нейтралітету та триматися подалі від ворогів Західної Африки, його народ зможе дихати спокійно."

 CPV_New_Old_Colony: "Нова стара колонія"
 CPV_New_Old_Colony_desc: "Божою милістю маленький острівний архіпелаг Кабо-Верде було повернуто під контроль його законних правителів у Лісабоні. Попри кровопролиття громадянської війни та втрати португальського колоніального краху, повернення островів знаменує крок уперед у місії Португалії з відновлення свого національного суверенітету.\n\nПроте ані Португалія, ані Кабо-Верде вже не такі, як до громадянської війни, навіть якщо опір поверненню португальського правління на місцях залишається відносно незначним. Лісабону вдалося досить швидко відновити свою владу над островами, але вже розробляються нові реформи, покликані усунути недоліки оновлених відносин із Кабо-Верде та визначити його місце в Португальській імперії."