 # National Spirits
 NZL_Culture_War:0 "Культурна війна – домінування англійців"
 NZL_Culture_War_desc:0 "Життєдайне джерело новозеландської економіки - Тихоокеанський регіон. Імпорт, особливо з американських ринків, має ключове значення для економіки Нової Зеландії. Таким чином, американська культура часто має значний вплив на місцеву культуру.\n\nНа сьогоднішній день у культурному плані над Новою Зеландією все ще гордо майорить юніон-джек. Британська культура залишається домінуючою. І все ж ми чуємо ці єхидні перешіптування, коли повертаємося від них спиною. Чи справді ми є "білошкірим сміттям Тихоокеанського регіону"? Чи ми просто досить сміливі, щоб зберегти наші традиції??"
 NZL_Culture_War_2:0 "Культурна війна - Зниження англосаксонського впливу"
 NZL_Culture_War_2_desc:0 "Кровоносна система економіки Нової Зеландії тече з боку Тихого океану. Імпорти, зокрема з американських ринків, мають вирішальне значення для економіки Нової Зеландії. Таким чином, американська культура часто має надмірний вплив на місцеву культуру.\n\nПроте, "юніон-джек" все ще висить над Новою Зеландією, але деякі вже почали ставити питання: чому? Нове покоління народжується без спогадів про велич Британії, окрім похвали від батьків. Для зростаючої кількості людей це просто ще один острів на іншому боці світу."
 NZL_Culture_War_3:0 "Культурна війна - Найкраще з обох світів"
 NZL_Culture_War_3_desc:0 "Кровоносна система економіки Нової Зеландії тече з боку Тихого океану. Імпорти, зокрема з американських ринків, мають вирішальне значення для економіки Нової Зеландії. Таким чином, американська культура часто має надмірний вплив на місцеву культуру.\n\nТам, де "юніон-джек" колись панував без конкуренції, зараз Зірки і смуги здаються серйозним суперником. Американська та британська культури борються за серця і розуми новозеландців щодня, ставши темою дебатів на публічних форумах. Чи є це американське захоплення тимчасовим модним трендом, чи це майбутнє?"
 NZL_Culture_War_4:0 "Культурна війна - Зростаючий вплив Америки"
 NZL_Culture_War_4_desc:0 "Кровоносна система економіки Нової Зеландії тече з боку Тихого океану. Імпорти, зокрема з американських ринків, мають вирішальне значення для економіки Нової Зеландії. Таким чином, американська культура часто має надмірний вплив на місцеву культуру.\n\nКоли американські імпорти вперше почали надходити до Нової Зеландії, їх сприймали як небажаний засіб для досягнення мети. Зараз вони стають нормою. Англосаксонські спадщини - дорогі попереднім поколінням - поступово відкидаються все більше людей, рік за роком, як іграшки з дитячого візочка."
 NZL_Culture_War_5:0 "Культурна війна - Американська домінація"
 NZL_Culture_War_5_desc:0 "Кровоносна система економіки Нової Зеландії тече з боку Тихого океану. Імпорти, зокрема з американських ринків, мають вирішальне значення для економіки Нової Зеландії. Таким чином, американська культура часто має надмірний вплив на місцеву культуру.\n\nЗ'явилася нова фраза серед більш цинічних громадян - «У Новій Зеландії ми імпортуємо все, навіть нашу культуру.» Для деяких це лише знак часу, символ зростаючої підліткової зрілості Нової Зеландії. Інші сміються з цього, викриваючи тих, хто так легко відмовляється від своїх традицій заради сучасних дрібничок та примх."
 
 NZL_Onto_World_Stage:0 "На світовій сцені - Носій факела"
 NZL_Onto_World_Stage_desc:0 "Незалежно від того, чи є ви найбільшою супердержавою, чи найменшим спостерігачем, ви повинні нести факел свободи по всьому світу. Це основа нинішньої зовнішньої політики Нової Зеландії, що відображається в їхній рішучості вступити в Організацію вільних націй (ОВН) у боротьбі з фашизмом по всьому світу. Але Нова Зеландія - маленька країна, і її досяжність іноді перевищує її можливості."
 NZL_Onto_World_Stage_2:0 "На світовій сцені - Підпалювач полум'я"
 NZL_Onto_World_Stage_2_desc:0 "Кампанія проти фашизму є благородною, але коли її здійснюють маленькі країни, іноді вони стикаються з невдачами. Нова Зеландія зазнала поразки в своїй агресивній зовнішній політиці, але це лише тимчасово. Несправедливість будь-де є загрозою справедливості в усьому світі. Після всього, не можна зняти рукавички після однієї поразки."
 NZL_Onto_World_Stage_3:0 "На світовій сцені - Опечений вогнем"
 NZL_Onto_World_Stage_3_desc:0 "Кампанія проти фашизму не позбавлена своїх труднощів, але сьогодні перемога здається чимось дуже швидкоплинним для середнього новозеландця. Якщо раніше громадська думка була одностайно за інтервенцію за кордоном, то тепер більше людей вважають, що Нова Зеландія має піклуватися про себе, а не про весь світ. Пацифісти більше не піддаються осуду, коли вони наважуються говорити, тепер їх слухають."
 NZL_Onto_World_Stage_4:0 "На світовій сцені - Підпалений"
 NZL_Onto_World_Stage_4_desc:0 "Нова Зеландія грала з вогнем занадто багато разів, і тепер вона бачить наслідки. Кампанія проти фашизму більше нагадує фарс, оскільки фашизм здобуває перемогу за перемогою проти сил свободи. Хоча справжні прихильники все ще стоять на боці боротьби, громадськість починає ставити під сумнів, чи справді варто відправляти стільки грошей за кордон."
 NZL_Onto_World_Stage_5:0 "На світовій сцені - Каторжник попелу"
 NZL_Onto_World_Stage_5_desc:0 ""Привіт, [NZL.GetLeader], скільки наших дітей ти сьогодні вб'єш?"\n\nЦі вигуки стали буденними на вулицях, оскільки військові пригоди Нової Зеландії виглядають більше як посміховисько в кращому випадку і прояв жадібності та імперіалізму в найгіршому. Якщо не станеться великих змін, яструби та курчата Нової Зеландії скоро зникнуть."
 NZL_Onto_World_Stage_6:0 "На світовій сцені - За лаштунками"
 NZL_Onto_World_Stage_6_desc:0 "Після довгих років боротьби у чужих війнах для Америки, новий уряд Нової Зеландії вирішив зробити перерву в триманні факела проти фашизму. Як довго це триватиме, ніхто не знає, окрім тих, хто при владі, і виборця. Якщо новий уряд зможе переконати людей, що мир - це рішення, все буде добре. Якщо вони вирішать, що кампанія проти фашизму має відновитися, їхній час при владі буде дуже обмежений."

 NZL_Social_Fabric:0 "Соціальна тканина - Непошкоджена"
 NZL_Social_Fabric_desc:0 "Соціальна тканина Нової Зеландії утримує націю разом, однак багато небезпек загрожують її розтягнути, порвати і зруйнувати.\n\nНа щастя, основа тканини Нової Зеландії залишається міцною і не пошкодженою. Люди єдині та сповнені надії щодо майбутнього нашого суспільства. Поки наша соціальна тканина міцна, наша нація не впаде в темряву та відчай."
 NZL_Social_Fabric_2:0 "Соціальна тканина - Зношена"
 NZL_Social_Fabric_2_desc:0 "Соціальна тканина Нової Зеландії утримує націю разом, однак багато небезпек загрожують її розтягнути, порвати і зруйнувати.\n\nДосконало зшита тканина Нової Зеландії зазнала деяких труднощів останнім часом, але вона не є крихкою. Дехто може сумніватися в намірах уряду, скептично ставлячись до деяких рішень, але зрештою розуміють, що керівники на верху знають, що роблять, і заспокоюються."
 NZL_Social_Fabric_3:0 "Соціальна тканина - Тріщини"
 NZL_Social_Fabric_3_desc:0 "Соціальна тканина Нової Зеландії утримує націю разом, однак багато небезпек загрожують її розтягнути, порвати і зруйнувати.\n\nТканина Нової Зеландії переживає перехід, перетворюючись з одного цілого шматка на кілька частин, з'єднаних найтоншими нитками, зношеними через постійні соціальні потрясіння. Бідний острів може витримати лише певну кількість турбуленцій, поки його уряд продовжує тягнути його до краю."
 NZL_Social_Fabric_4:0 "Соціальна тканина - На шмаття"
 NZL_Social_Fabric_4_desc:0 "Соціальна тканина Нової Зеландії утримує націю разом, однак багато небезпек загрожують її розтягнути, порвати і зруйнувати.\n\nО, прекрасна Нова Зеландіє, що з тобою сталося... розірвана тими, хто обіцяв захистити тебе. Колишня сильна соціальна тканина залишена на шматки - люди, які вона повинна була представляти, в люті проти уряду - а політики лише тикають руками, не здатні допомогти."

 NZL_Establishment:0 "Більш гармонійний уряд"
 NZL_Establishment_desc:0 "З часу проголошення самоврядування у 1907 році, наш уряд прагнув представляти та надавати вигоду добрим людям Нової Зеландії. Досі Веллінгтон справляється непогано: уряд стабільний, парламент доволі дружелюбний, а віра народу в наші політичні установи на прийнятному рівні. Поки цей мир триватиме, Нова Зеландія залишатиметься бастіоном політичної стабільності на десятиліття вперед."
 NZL_Establishment_2:0 "Незвичний новий порядок"
 NZL_Establishment_2_desc:0 "З часу проголошення самоврядування у 1907 році, наш уряд прагнув представляти та надавати вигоду добрим людям Нової Зеландії. За ці роки з'явилося два домінуючі партії, які представляли їх, але зараз стало очевидно, що жодна з цих партій не готова управляти ними.\n\nНовий уряд соціальних кредитистів успадкував цю естафету, але не стабільність, яку витратили давним-давно. Для багатьох це було непередбачувано, але приємна зміна після двох втомлених старих партій. Однак деякі задаються питанням, як зміняться демократичні установи Нової Зеландії або чи залишаться вони установами після цієї сміливої нової зміни."