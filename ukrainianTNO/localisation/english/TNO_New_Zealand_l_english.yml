 ## Біографії лідерів
 # Національна партія
 POLITICS_KEITH_HOLYOAKE_DESC:0 "Кіт Холйоак - це людина, відома багатьма речами - своєю спокійністю, товстим акцентом та репутацією надмірно ввічливого чоловіка серед них. Походження Холйоака лежить у сільських районах Нової Зеландії, він був сином пари власників магазинів, які стали фермерами. Приєднавшись до партії реформістів, орієнтованої на сільське населення, у 1932 році, Холйоак швидко став зіркою партії, відігравши ключову роль у реформуванні її в сучасну Національну партію.\n\nЗайнявши посаду прем'єр-міністра у Першому Національному уряді, Холйоак став головою уряду після поразки Націоналів у 1957 році, після відставки попереднього прем'єр-міністра Сідні Холланда в 1956 році. Три роки він перебував на посаді лідера опозиції, перед тим як виграти загальні вибори 1960 року, здобувши посаду на власне право.\n\nВиступаючи за підтримку сильної національної оборони проти постійної загрози з боку Японії, міністерство Холйоака вже почало переслідувати прогресивну соціальну програму скасування смертної кари та розширення прав маорі. Коли наближаються загальні вибори 1963 року, Холйоак сподівається, що Нова Зеландія продовжить підтримувати його бачення."
 POLITICS_ROBERT_MULDOON_DESC:0 "Є дві сторони в Роберті Мулдуні. Зовні він є грізним захисником вільного світу, людиною, яка не боїться кидатися на фашистів, еліт і розумників, які хочуть потоптати просту людину. Усередині ж ховається більш обережний чоловік, турботлива душа, яка не бажає завдати нікому болю. Як він поєднує ці дві сторони - ніхто не знає.\n\nВиховуючись за складних обставин після того, як його батька відправили до психіатричної лікарні, він потрапив під вплив своєї бабусі, пристрасної соціалістки. Хоча він ніколи не визнає цього, вона сформувала його переконання щодо сильної системи соціального забезпечення. Служачи в Другій світовій війні, шокуюча поразка союзників підштовхнула його до яструбових позицій, ставши відомим прихильником ОВН.\n\nПісля війни Мулдуон приєднався до Національної партії, швидко ставши активним її членом. У 1957 році він здивував усіх перемогою над діючим Норманом Кінгом і став депутатом. В урядах Голланда та Холйоака він довів свою майстерність, обіймаючи все більш високі посади. Після падіння Холйоака багато хто звернувся до Мулдуона за змінами в темпі та особистості, і вони отримали це з лишком.\n\nБудучи прем'єр-міністром, він швидко здобув свою частку прихильників та ворогів завдяки різкому характеру, що не готовий вислуховувати інших. Що стосується Роба, це його шлях або шосе, рука в руку з ОВН проти фашизму. Всі інші можуть старатися або відходити вбік."
 POLITICS_JACK_MARSHALL_DESC:0 "Проти хвилі радикалізму та популізму, яка охопила весь світ, тихо стоїть джентльмен, що охороняє Нову Зеландію від загрози, що вразила багато інших країн цього століття. Це ім'я - Джек Маршалл.\n\nНароджений у Новій Зеландії, але походить зі Шотландії, Маршалл мав комфортне середньокласне виховання, пізніше вивчав право та розпочав кар'єру в юридичній сфері. Однак його покликала свобода, і він записався до армії під час Другої світової війни. Хоча його служба не була примітною, він отримав важливі уроки після поразки Нової Зеландії у війні.\n\nЗалишивши право, щоб увійти в політику, він знайшов своє покликання в Національній партії, піднявшись до рангу заступника Холйоака. На жаль для нього, Холйоак віддав перевагу Мулдуону перед ним, що призвело до того, що Роб став наступним лідером Національної партії. Однак Маршалл мав останній сміх після того, як критики Мулдуона звернулися до нього, розчаровані їхнім колишнім лідером через його різкість і невдачу на виборах.\n\nТепер, ставши Прем'єр-міністром, як і Мулдуон, кожен його крок здається спостережуваним урядом та опозицією. "Він надто хороший." "Він не досить сміливий." "Як він може надихнути когось?" Час покаже, чи зможе Маршалл довести свою правоту, або ж він завершить, як Мулдуон, той, кого він скинув."
 POLITICS_BRIAN_TALBOYS_DESC:0 "Нова Зеландія стоїть на краю прірви. За її спиною маса країн, що згоріли живцем. Попереду - певна смерть. Спостерігаючи за Новою Зеландією, Браян Талбойс повторює мантру для себе знову і знову - "Має бути інший шлях".\n\nВихований у традиційній християнській родині, Браян Талбойс мав належне виховання, насолоджуючись усіма середньокласними розкошами, які він міг бажати в освіті та інших питаннях. Коли розпочалася війна, Талбойс вступив до Королівських повітряних сил Нової Зеландії, залишаючись близьким, але не надто близьким до небезпеки, коли старий світ падав, даючи місце новому порядку.\n\nПісля війни він став фермером, професія, яка призвела його до Національної партії. Як депутат, він легко піднявся політичною сходинкою завдяки своєму умінню не непокоїти нікого, вважаючись приємним і м'яким чоловіком. Талбойс налагодив зв'язки в усіх правильних місцях, оскільки його колеги з Національної партії продовжували бути враженими його роботою. Більшість припускала, що він не має сили стати лідером, але ось він тут сьогодні.\n\nЩиро кажучи, вони, можливо, мали рацію, про що іноді замислюється і сам Талбойс. Проте назад вже не повернутися. Національна партія або виживе і процвітатиме, або зазнає поразки перед популізмом Лейбористів. Немає міфічного третього шляху, лише вибір - жити чи загинути."
 POLITICS_KEITH_HOLYOAKE_2_DESC:0 "Коли 'старий Ківі Кіт' вступив у політику більше тридцяти років тому, він не думав, що опиниться на найвищій посаді в державі. Коли він вперше став Прем'єр-міністром прямо перед поразкою Націоналів, він ніколи не вважав, що повернеться, щоб виграти чотири вибори поспіль, але це сталося.\n\nАле протягом цих років, які зміни насправді відбулися в Новій Зеландії? Звісно, він закріпив створення новозеландської національної ідентичності, відмінної від британської, але чи не була така необхідність у післявоєнному світі? Можливо, це відсутність змін, за які його запам'ятають, зберігаючи те, що робить Нову Зеландію великою, попри великі зміни.\n\nАбо його запам'ятають за зміни, які він приніс у світ? Його хрестовий похід проти фашизму допоміг повалити чимало диктаторських режимів, відкриваючи нові етапи демократії у світі, який здається все більше її відкидає. Чи буде це Організація Вільних Націй, яка напише його епітафію після того, як його кар'єра нарешті завершиться?\n\nХолйоак може сказати лише "сподіваюся", оскільки всюди його рішучий консерватизм здається все більш не на місці. З роками він може тільки ставити собі питання "як все закінчиться?" і знову і знову отримувати відповідь - "моторошно"."
 POLITICS_BRIAN_TALBOYS_2_DESC:0 "Яскравий новий день настає для Нової Зеландії, коли реальність нового десятиліття починає проявлятися. Минувши економічні труднощі вчорашнього дня, Талбойс з радістю дивиться на зростаючий розвиток завтрашнього дня. Він тільки сподівається, що так все і залишиться.\n\nВихований у традиційній християнській родині, Браян Талбойс мав належне виховання, насолоджуючись усіма середньокласними розкошами, які він міг бажати в освіті та інших питаннях. Коли розпочалася війна, Талбойс вступив до Королівських повітряних сил Нової Зеландії, залишаючись близьким, але не надто близьким до небезпеки, коли старий світ падав, даючи місце новому порядку.\n\nПісля війни він став фермером, професія, яка призвела його до Національної партії. Як депутат, він легко піднявся політичною сходинкою завдяки своєму умінню не непокоїти нікого, вважаючись приємним і м'яким чоловіком. Талбойс налагодив зв'язки в усіх правильних місцях, оскільки його колеги з Національної партії продовжували бути враженими його роботою. Більшість припускала, що він не має сили стати лідером, але ось він тут сьогодні.\n\nТепер, маючи стабільну позицію як Прем'єр-міністр, Талбойс має перед собою важливу роботу. Наразі Кризу нафти можна вважати позаду, але її проблеми все ще залишаються, проблеми, які можна вирішити лише важкою працею. На щастя, пан Талбойс не з тих, хто боїться важкої праці, і він готується побудувати Нову Зеландію завтрашнього дня."
 POLITICS_ROBERT_MULDOON_2_DESC:0 "Роберт Мулдуон порівнювали з багатьма людьми під час його перебування при владі. Серед них Адольф Гітлер, Бенито Муссоліні, Річард Ніксон і Кіт Холйоак. Однак для своїх відданих прихильників він просто Роб, і він залишиться тут.\n\nКонсервативний чоловік, правління Роберта показало його прихильність до невеликих змін у певних сферах. Наприклад, система соціального забезпечення здебільшого була збережена та покращена на користь старших новозеландців, незважаючи на протести з боку більш ліберальної частини його партії. Можна було б подумати, що Мулдуон надто м'який, щоб навіть подумати про скорочення соціальних витрат.\n\nПроте таке припущення навряд чи буде узгоджено з його грубими військовими втручаннями. У Західній Африці новозеландські війська воювали з людьми, які жили за тисячу миль від них, за уряд, який вони ніколи не знали. Таке саме сталося в Ірані та Іраку. Чи були всі люди, з якими вони боролися, фашистами? Для Національної партії легка відповідь - так, єдина відповідь - урядова відповідь.\n\nДля прихильників Роба вони з радістю споживатимуть цю відповідь разом з усім, що він каже. Мулдуон - це чоловік, будь-хто, хто йде проти нього, ймовірно, лінивий ліберал, квір або фашист. Що стосується їх, вони з радістю бачать, як він править ще двадцять років, так само, як і сам Мулдуон."
# Labour Party
 POLITICS_NORMAN_KIRK_DESC:0 "Нова Зеландія не може присвятити себе вирішенню проблем світу, коли сама вже вражена численними проблемами. Кірк це знає, Лейбористи це знають, і тепер виборці знають цю просту істину.\n\nНорман Кірк добре знайомий з цією реальністю з дитинства, яке він провів у бідності, врятованій лише завдяки тому, що його батько виконував тяжку працю, щоб прогодувати свою родину. З палким бажанням до навчання, але з труднощами в навчанні, він вирішив залишити школу у віці 13 років, працюючи в різних фізичних професіях, щоб забезпечити себе.\n\nПриєднавшись до Лейбористської партії в 1943 році, він швидко піднявся по кар'єрних сходах завдяки своїй старанності та уважному вивченню виборчих питань, досягнувши нової віхи в 1954 році, коли був обраний до парламенту. Під час уряду Неша залишаючись на задніх рядах, він уникнув публічної критики, яку переживала Лейбористська партія в цей період, зберігаючи та набираючи популярність завдяки своїм робітничим корінням.\n\nПоваливши Нордемейера за допомогою лівого крила партії, Кірк тепер маневрує до посади прем'єр-міністра завдяки зовнішньополітичним невдачам Холйоака, захопленнями, якими Кірк не бажає займатися. Натомість, він опинився з партією та нацією, якими потрібно піклуватися, обидва потребують виваженого керівництва, щоб уникнути захоплення радикалами або консерваторами."
 POLITICS_HUGH_WATT_DESC:0 "Як більше новозеландців повертаються додому в мішках для трупів - без ніг, рук або надій - така реакція на ці жахи була очікувана. Х'ю Ватт є обличчям цієї реакції.\n\nНароджений в Австралії, але завжди вважавши Нову Зеландію своїм домом, він виріс, маючи технічну освіту. Звісно, він заробляв на життя інженером, де вперше познайомився з профспілковим рухом, зареєструвавшись як член. Не дивно, що Ватт потім приєднався до лейбористів, але сюрпризом стало, як далеко він піднявся в рядах партії.\n\nУ п'ятдесяті роки він став головою Робітничого представницького комітету свого округу та членом національного виконавчого комітету Лейбористської партії. Після невеликої поразки на виборах 1951 року він був обраний депутатом на проміжних виборах 1953 року. У невдалому уряді Неша він зумів зарекомендувати себе, ставши Міністром робіт, здобувши похвалу за свою доброзичливу поведінку.\n\nВатт уособлює контраст з більш консервативними позиціями свого попередника Кірка. Він вже отримав похвалу за свою відмову від відправлення новозеландських молодих чоловіків на смерть у війнах Америки, що здобуло йому підтримку зростаючої лівої частини, яку йому потрібно задовольнити. Але чи сумуватиме Нова Зеландія за війною - це питання для наступних виборів..."
 POLITICS_MARTYRN_FINLAY_DESC:0 "Не багато чоловіків опиняються практично виштовхнутими до лідерської ролі, особливо в політиці. Мартін Фінлей - один з тих рідкісних чоловіків, підтримуваних молодими та сміливими лейбористами як фігура для мобілізації, свідчення його роботи над виправленням соціальних проблем Нової Зеландії.\n\nСин місіонерів, його життя було визначено бідністю та трагедією, які прийшли в його життя, коли йому було лише два роки, коли його батько помер. Економічні реалії продовжували перешкоджати його життю, зупинивши його амбіції стати лікарем, коли йому довелося залишити школу у шістнадцять років. Згодом він отримав стипендію в Лондонській школі економіки, де вперше відчув політику.\n\nПідтриманий британськими інтелектуалами Лейбористської партії, розцвівши, він повернувся додому, сповнений енергії. Ставши депутатом у сорокових роках, його місце в парламенті змінювалося, але його пристрасть до соціальних реформ залишалася незмінною. Коли лейбористи шукали нового лідера, щоб вести їх, вони звернулися до Фінлея - чоловіка старих Лейбористів, але з поглядами, які підходили для молодих Лейбористів - він здійснив це попри всі труднощі.\n\nПрем'єр-міністр, що не відчуває себе комфортно серед людей, Фінлей б радше залишався в своїх власних куточках. Але коли така золота можливість виникає - шанс втілити свої соціально-ліберальні погляди в законодавство, як він може відмовити? Проте вже зараз він стикається з опором з боку консервативної частини Лейбористської партії. Чи стане його прем'єрство мостом, який буде занадто важким для нього?"
 POLITICS_BOB_TIZARD_DESC:0 "Як новозеландці вибираються з тупика, в якому їх залишили попередники націоналів, вони розуміють, що зміни потрібні більше ніж будь-коли, радикальні зміни. Боб Тізард - саме та людина для цієї роботи.\n\nВиростаючи в Окленді, Тізард отримав чудову освіту. Він довів, що є здібним учнем, за винятком перерви, викликаної війною, коли він приєднався до авіації, намагаючись змінити хід подій. Повернувшись до університету, він отримав перший досвід у політиці через студентські асоціації. Пізніше він став активним у профспілковому русі, що стало каталізатором його вступу до Лейбористської партії.\n\nПісля кількох невдалих спроб Тізард приєднався до парламенту як депутат, виконуючи роль старанного члена опозиції. Коли Лейбористи почали прихилятися до соціалізму, він теж став на цей шлях, усвідомивши, в який бік віє вітер. Коли Фінлей пішов у відставку з посади лідера у 1969 році, Тізард висунув свою кандидатуру. У тісних лідерських виборах він здобув вузьку перемогу, якраз вчасно, щоб скористатися катастрофою націоналів.\n\nТізард може мати амбіційні цілі як прем'єр-міністр, але він вважає, що Новій Зеландії потрібні радикальні зміни, які він обіцяє. Напівзаходи націоналів лише призвели до занепаду економіки, безробіття та соціальної кризи. Під його керівництвом не буде більше напівзаходів, тільки повні рішення, щоб повернути країну до життя."
 POLITICS_NORMAN_KIRK_2_DESC:0 "Політика - це гра балансу, кожен сектор суспільства тягне до себе, кричачи про необхідність представлення своїх інтересів. Партія Кірка - лише мікрокосм цього процесу, дві фракції готові порвати його на частини, щоб досягти своїх цілей. Якби він був меншою людиною, він би зламався вже давно.\n\nХоча деякі критикують прем'єр-міністра Нормана Кірка за відносно повільний темп реформ для суспільства Нової Зеландії, порівняно з роками консерватизму, що передували йому, його темп здається майже революційним на цьому фоні. Обов'язкові профспілки були закріплені на законодавчому рівні, а система соціального забезпечення була повністю відновлена після її ослаблення в роки правління Національної партії.\n\nАле все ж таки, звинувачення в консерватизмі тривають, особливо коли він ухиляється навіть від терміну «соціялізм», який так багато інших в партії прийняли. Його прихований соціальний консерватизм продовжує впливати на політику, а параноїдальні настрої, які супроводжують його, роблять його замкнутою фігурою поза його бомбастичною особистістю.\n\nАле ще більше турбує питання його здоров'я. Великий Норм робить роботу десяти людей одночасно, попри медичні поради, що навпаки, не сприяє його здоров'ю, погана дієта і важка вага лише погіршують ситуацію. Якщо щось не зміниться, лейбористи можуть залишитися без свого лідера набагато раніше, ніж очікується."
 POLITICS_HUGH_WATT_2_DESC:0 "Коли Х'ю Ватт вперше вступив на найвищу посаду в Новій Зеландії в 1966 році, люди втомилися від війни. Деякі вважали, що це лише фаза, але коли Ватт повертається до влади стабільно, можливо, новозеландці нарешті дали шанс миру.\n\nЗвісно, невтручання не було єдиною його політикою під час численних років правління. Під час свого перебування на посаді прем'єр-міністра Х'ю Ватт повернув Нову Зеландію до робітників. Хоча його ліві опоненти критикують його роботу як напівзаходи, він краще знає, ніж слухати комуністів. Нова Зеландія, яку він будує, не є проваленою радянською державою, а демократією.\n\nОднак, навіть у свої найгордіші моменти, Ватт усвідомлює, що ще багато чого залишилося зробити. Завдання будівництва соціалізму - це не справа кількох років, а десятиліть. Несправедливість і нерівність не були ліквідовані, вони все ще чекають на свою зміну в куточках фабрик, де робітники продовжують не отримувати свою справедливу частку за працю.\n\nВрешті-решт, він розуміє, що не буде тим, хто досягне соціялістичної мрії. Ватт відчуває, як його кістки скриплять, час наздоганяє його з кожним днем. І в своєму кабінеті прем'єр-міністр замислюється над важливим питанням: «Хто продовжить мою справу?»"

 # Social Credit Party
 POLITICS_JOHN_OBRIEN_DESC:0 "Коли Виконавчий комітет соціального кредиту замінив суворого Вернона Кракнелла на харизматичного Джона О'Брайєна, вони були впевнені, що знайшли когось, хто легше погодиться на їхні вимоги. Час доведе, що вони помилилися.\n\nБільшу частину свого життя О'Брайєн був маловідомою фігурою. Він виріс на фоні Другої світової війни, спостерігаючи, як прекрасна Британія та старий порядок руйнуються під ударами страшної сили. Однак Британія, яка відновилася, привернула його увагу, особливо одна її частина. У 1945 році світ побачив першого прем'єр-міністра соцкреда у особі Хастінга Рассела, герцога Бедфорда.\n\nХоча Рассел і не здійснив своїх амбіцій, його ідеї надихнули О'Брайєна приєднатися до новозеландської партії соціального кредиту. Потужний оратор і енергійний працівник, він добре зарекомендував себе в організації, ставши заступником лідера у 1960 році. 1960-ті також принесли йому місце в парламенті, де він став відомим різким критиком наступних урядів.\n\nАле тепер критик має взяти на себе роль лідера. Він стоїть на нестабільній коаліції, але готовий зробити все, щоб скористатися цією можливістю. Абсолютна економічна безпека буде гарантована, купівельна спроможність відновлена, і кожен громадянин отримає свій національний дивіденд. Якщо щось стане на шляху до його цілей, наслідки яких будуть страшними."

