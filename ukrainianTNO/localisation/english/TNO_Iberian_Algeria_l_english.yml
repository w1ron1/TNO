 #Leader Descriptions
 POLITICS_FEDERICO_GOMEZ_DESC:0 "Командир Федеріко Гомез де Салазар був очевидним кандидатом, аби очолити іберійську "миротворчу" місію в Алжирі. Народившись в 1912-му році, Гомез де Салазар виріс під час міжвоєнних років у Іспанії, спостерігаючи за тим, як країна ставала дедалі більш розділеною й нестабільною, незважаючи на те, що їй вдалося врятуватися від розорення Першої світової війни. До 1929-го він проходив вишкіл під наглядом генерала Франціско Франко у Загальній військовій академії в Сарагосі. Відповідно, він воював на стороні націоналістів у Громадянській війні в Іспанії. У Другій світовій він був членом Дивізії Азул - іспанської добровольчої дивізії, що була відправлена на Східний фронт на боці Німецького Райху від режиму Франко. Після війни Гомез продовжив віддано служити новоствореному Іберійському союзу.
 
\n\nПроблеми в Алжирі для каудільо Іберії були достеменно відомі. Салазар особливо прагнув захистити значну іберійську громаду поселенців, що проживає вздовж кордону Алжиру й Марокко. Коли ситуація там стала достатньо неконтрольованою, Салазар скористався шансом, аби відправити армію. Накази Гомеза де Салазара були чіткими: захищати всіх іберійських поселенців, співпрацювати з французькими п'єр-нуарцями й знешкодити італійський вплив. Гомез де Салазар є вірним офіцером - коли він отримав розпорядження, то дотримається його, яким би воно не було."
 POLITICS_JORGE_JARDIM_DESC:0 ""
