 #Ideas
 SLG_Legion_Presence:0 "Присутність Легіону"
 SLG_Legion_Presence_desc:0 "Іспанський легіон було надіслано, аби захистити свої португальських братів, що поселилися на цій землі. Більш важливим, проте, є те, що їх відправили керувати територією, яка позбавлена французької влади. Він залишається домінуючою політичною й військовою силою в цьому регіоні, і контролює більшість з того, що відбувається в ньому..."
 SLG_Retornados:0 "Португальські реторнадос"
 SLG_Retornados_desc:0 "Опісля вторгнення німців у Португальську Африку, більшість наших громадян обрали повернутися до іберійської землі. Тоді уряд вирішив розташувати їх у неофіційно підконтрольній Іберії області Алжиру, як частину схеми посилення їхніх претензій на територію. До сьогодні португальські поселенці населяють ці землі, надаючи нам основу для роботи в напрямку сильнішої нації."
 SLG_Native_Unrest:0 "Заворушення корінного населення"
 SLG_Native_Unrest_desc:0 "Із переважаючою кількістю португальців, що оселяються на цій території, корінні алжирці вирішили чинити супротив діям режиму й загалом досадити нам. Це проблема, яку потрібно вирішити так чи інакше..."
 
