 RUS_isolated_vilages: "Ізольовані села"
 RUS_isolated_vilages_desc: "Холод і безжальність - ось що визначає цей край Землі. Людські громади тут рідкісні й розкидані, тому ця місцевість не становитиме великої загрози зовнішнім силам."
 RUS_heirs_of_harbin: "Спадкоємці Харбіна"
 RUS_heirs_of_harbin_desc: "Після Громадянської війни в Росії залишки Білої армії відступили до Харбіна й опинилися у вигнанні, де загоювали рани та планували повалення Совєцького Союзу. Проте невдовзі в місті оформився фашистський рух. Під проводом Родзаєвского та Матковского Россійская Фашистская Партія (РФП) незабаром стала головною партією російських емігрантів. Коли Союз розпався, білі та РФП утворили єдиний фронт проти більшовиків і якийсь час досягали успіху, аж доки внутрішні чвари їх не розкололи. Тепер три уламки борються за владу, і кожен проголошує себе законним спадкоємцем Харбіна."
 RUS_the_true_heir_of_harbin: "Справжній спадкоємець Харбіна"
 RUS_the_true_heir_of_harbin_desc: "Після завершення смути на російському Далекому Сході одна фракція здобула перемогу й, розгромивши розкольників і більшовиків, стала провідною силою білих російських емігрантів. Після перших успіхів у Сибірській кампанії харбінські вигнанці опинилися у чужій землі, а те небагато, що їх єднало, зникло, оголивши глибокі суперечності між царистами, непримиренними фашистами та корпоратистами. Тепер, коли всі інші претенденти на панування в регіоні переможені, ця фракція може з гордістю назватися єдиним справжнім спадкоємцем Харбіна."
 RUS_shattered_ambitions: "Розбиті амбіції"
 RUS_shattered_ambitions_desc: "Росіяни знову спробували об'єднатися, й чужоземні держави знову їх розбили. Деякі воєначальники змогли повернути контроль над своїми володіннями, та вони правлять народом, зламаним тілом і духом. Мине не одне десятиліття, перш ніж вони хоча б наблизяться до колишньої могутности."

 RUS_far_east_war: "Далекосхідний фронт"
 RUS_far_east_war_desc: "Далекий Схід запалав: різні угруповання воєначальників б'ються за панування над регіоном і його народами. Докорінно відмінні ідеології борються за першість. Але ця війна не буде легкою. Ще від російсько-японської війни арктичні території регіону славляться надзвичайною складністю контролю. Щоб здобути перемогу, різним угрупованням доведеться долати слабку інфраструктуру, розтягнуті лінії постачання та безмежну глушину."

