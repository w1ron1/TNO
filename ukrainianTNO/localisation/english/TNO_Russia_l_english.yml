 RUS.50.t: "Повідомлення про виселення"
 RUS.50.desc: ""Добрий день." Чоловік середнього віку підозріло дивився на Васілія з-за окулярів у роговій оправі, твердо ставши в дверному отворі. "Я зобов'язаний повідомити вас..." Шкільна вчителька потягнулася по блокнот, щоб занотувати почуте, але згадала, що його немає. "...що відповідно до Закону про реституцію земельної та іншої власности, ухваленого Вічем Російської Республіки 18 грудня 1973 року..." Літній кремезний баварець вибухнув лютою політичною тирадою, бризкаючи слиною, поки Васілій нервово позирав на гвинтівку на стіні. "...ваше помешкання віднесено до першої категорії відчужених земель, що належать російському народові." Налякана нідерландська домогосподарка ламаною німецькою, якої навчив її чоловік, запитала, що все це означає.\n\n"Відповідно, за тридцять днів законне право власности на ваш будинок і землю буде передано первісному, довоєнному власникові..." Фермер благально перелічував усе, що збудував на цій землі, а його діти на задньому плані ледь стримували сльози. "...тому вам рекомендовано до того часу залишити володіння з усіма речами." Літній ветеран не промовив ані слова, лише глянув на Васілія майже співчутливо, наче чомусь розумів його.\n\n"Будь ласка, не пошкоджуйте майно. За будь-яку шкоду, завдану землі до вашого від'їзду, з вас буде стягнено плату." Будівельник, що ридав, уже не слухав. "Російська держава шкодує про необхідність цього заходу, але вважає його потрібним для справедливого відшкодування тим, хто втратив майно через німецьку окупацію. Літня жінка дивилася на чергового ідеолога на своєму порозі порожніми, майже мертвими очима."\n\n"У вас є запитання?""
 RUS.50.a: "Васілія поглинув наступ голосів."

