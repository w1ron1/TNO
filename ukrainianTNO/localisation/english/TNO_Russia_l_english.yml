 RUS.200.t: "Червоний Жовтень назавжди"
 RUS.200.desc: "Сьогодні по всій Росії лунають святкування: солдати в старій совєцькій формі несуть старі й знайдені совєцькі знамена, що пам'ятають і часи революції, і криваву бійню Великої Вітчизняної війни. Для Росії настав новий день, і вперше за понад два десятиліття цей понівечений край, схоже, справді об'єднався навколо спільної мети та спільної справи.\n\nМіжнародні спостерігачі неоднозначно реагують на радісні натовпи: у Європі багато хто боїться слов'янської помсти й раптової можливості розплати за поразки у Світовій війні, тоді як в Америці чимало людей святкують, а ліві проголошують, що маятник знову хитнувся проти нацистів і Японії.\n\nОднак у Росії народ єдиний. Навіть ті, хто засуджує совєтів і комунізм, не можуть заперечувати, що об'єднана Росія - чи не єдина надія, яку цей край бачив за ціле людське життя, і вже зараз багато хто сперечається про те, що саме держава робитиме далі."
 RUS.200.a: "Яким постане Союз перед світом?"
 RUS.200.b: "Пролетарі всіх країн, єднайтеся!"

 RUS.201.t: "Єдність Росії - непорушна"
 RUS.201.desc: "Сьогодні режим [From.GetRulingParty] на чолі з [From.GetLeader] оголосив про перемогу у справі возз'єднання численних російських держав і проголосив новий сильний та могутній лад, що нарешті відкине ворогів назад у безодню. У кожному великому населеному пункті видно радісні натовпи й солдатів на марші, а в кожному селі знайдеться принаймні один-два п'яні ополченці, які, хитаючись вулицями, розмахують прапором нового союзу.\n\nДля Росії настав новий день і новий лад. Країна вже випробувала монархію, комунізм, а тепер, після своєї найбільшої поразки, за іронією долі, ще й фашизм. Багато хто здивований тим, що росіяни, здається, перейняли ідеологію своїх найненависніших ворогів, але водночас чимало інших вважають це природною реакцією.\n\nКажуть, щоб боротися з ворогом, треба самому стати ворогом."
 RUS.201.a: "Коли вдивляєшся в безодню..."
 RUS.201.b: "Вороги Росії нас боятимуться!"
 
 RUS.202.t: "Республіканський фенікс"
 RUS.202.desc: "Російська Республіка проіснувала недовго й загинула у вогні та полум'ї, коли революція схопила її та з криком затягнула в пітьму. Вічно безпорадна й нездатна сформувати стабільний уряд, Республіка, здавалося, так і не дістала справжнього шансу, а її загибель оплакували одиниці.\n\nПроте часи змінюються, і сьогодні [From.GetLeader] та його прихильники оголосили, що останні приготування до возз'єднання російської держави нарешті завершено. Нова, сучасна Російська Республіка покладе край чварам воєначальників і принесе російському народові єдність та справедливість.\n\nНіхто достеменно не знає, що задумали росіяни. Чи прагнутимуть вони відвоювати землі, чи мирно їх реінтегрувати, покаже час, а світ тим часом завмер у напруженому чеканні."
 RUS.202.a: "Що ж, вип'ємо за другий шанс."
 RUS.202.b: "Свобода всім росіянам!"
 
 RUS.203.t: "Корона зі стічної канави"
 RUS.203.desc: "Сьогодні під час величної церемонії в новій столиці Росії [From.GetLeader] був коронований як Цар всіх Русей. Тисячі радісних громадян і вже чималий почет придворних вітали нового самодержця на престолі.\n\nСвіт охопило щире здивування: повернення царизму було останнім, чого багато хто очікував. Водночас чимало експертів не погоджуються й стверджують, що цього давно слід було чекати. Зрештою, справжнє падіння Росії, схоже, почалося саме після повалення Царя, а самодержавні настрої пережили довгі роки доби воєначальників.\n\nТа хоч дивуйся, хоч ні, тепер усією неосяжною Росією править Цар, і вперше за десятиліття народ країни має щось, а точніше когось, навколо кого можна об'єднатися. Захід зустрів це зі схваленням, однак Японія та Німеччина вже почали готувати свої армії, побоюючись, що новий конфлікт у Росії стане точкою зламу для їхніх імперій.\n\nНевідомою лишається тільки реакція нового Царя, і багато хто зі страхом чи надією чекає на його перші укази."
 RUS.203.a: "Православ'я, самодержавство й народність панують знову."
 RUS.203.b: "Слава Царю! Володарю всіх Русей і земель за їхніми межами!"
 
 RUS.204.t: "Вічна сила"
 RUS.204.desc: "Сьогодні [From.GetLeader] і його військове оточення оголосили, що останні приготування до возз'єднання російської нації нарешті завершено. Телебачення всього світу показує солдатів на марші, які салютують своїм генералам, а часто ті ж самі люди є ще й губернаторами, тоді як радісні натовпи вітають обіцяні хунтою стабільність і безпеку.\n\nРосія тепер є державою, але, якщо точніше, це армія, що має державу: [From.GetRulingParty] на чолі з [From.GetLeader] править залізною рукою з вершини командної вертикалі.\n\nПоки росіяни святкують, міжнародна реакція сповнена розгублености й страху. Багато хто вітає кінець жорстокости та бандитизму, що так довго були невіддільними від доби російських воєначальників, однак під владою єдиного самодержавного військового лідера та його найближчого кола Росія також стала звіром, якого варто боятися. Російське військо вже почало розбудовуватися до нового, сучасного рівня, і, на думку міжнародних спостерігачів, [From.GetLeader], схоже, готовий пустити його в діло."
 RUS.204.a: "Це може принести лише нові конфлікти."
 RUS.204.b: "Вороги Росії, бійтеся нас!"

 RUS.205.t: "Великий похід починається"
 RUS.205.desc: "Сьогодні в Росії [From.GetLeader] був проголошений духовним провідником російських народів, остаточно закріпивши за собою роль володаря всього краю. Після молебню в кожній церкві Росії святкування тривали до ночі, а очільник новооб'єднаної держави став першим у краї, чию промову передали телебаченням і радіом від Уралу до Тихого океану.\n\nДля багатьох селян, які не мали доступу ні до того, ні до іншого, промову особисто зачитали місцеві духовні провідники та військові губернатори.\n\nНіхто не знає, що чекає на нову теократичну адміністрацію далі. Дехто вважає, що [From.GetRulingParty] нестиме віру людям у межах держави, однак інші бояться, що святі легіони рушать за кордон або почнуть власний духовний хрестовий похід проти давніх ворогів."
 RUS.205.a: "Сподіваймося, новий режим навчиться поміркованости."
 RUS.205.b: "Наш святий отець приведе нас до слави!"
 
 RUS.206.t: "Чорний марш починається"
 RUS.206.desc: "Сьогодні над Росією майорить чорний прапор. Солдати вивели останніх російських 'зрадників', серед яких було кілька гаданих німецьких і японських шпигунів, та стратили їх перед камерами міжнародного телебачення під схвальні вигуки росіян.\n\n[From.GetLeader] і [From.GetRulingParty] проголосили, що ці люди стануть першими на довгому шляху Росії, покликаному обрушити гнів російського народу на винуватців його страждань під час Світової війни.\n\nКомісари вже відвідали кожне село й місто та почали забирати всіх придатних чоловіків до війська, яке багато хто називає Чорними легіонами через темну форму та прапори. Подейкують навіть, що до цих легіонів можуть почати набирати жінок.\n\nНова держава майже нічого не сказала про свою економіку, а про промисловість згадувала тільки як про знаряддя війни. Схоже, права та свободи народу її майже не цікавлять. Натомість вона багато й докладно говорить про повне винищення ворогів Росії, і народ, здається, приймає це з розпростертими обіймами. Принаймні на людях."
 RUS.206.a: "Це ніяк не може скінчитися добре."
 RUS.206.b: "Остання війна, остання перемога!"
 
 RUS.207.t: "Вічна свастика"
 RUS.207.desc: "Росія вже давно відома як чорна діра для новин: усередину потрапляє все, а назовні не виходить майже нічого. Та й те, що виходить, зазвичай шириться через чутки. Однак нещодавня заява [From.GetLeader] приголомшила світ.\n\nАрійське Братство, яке довго вважали лише моторошною байкою, заявило про своє існування й могутність усьому світові, поширивши владу на Росію та об'єднавши її у своїй залізній хватці. Свастики прикрашають кожне місто, поки керівництво Братства міркує, як найкраще поширити свої доктрини на здобуту величезну територію.\n\nЧутки не вщухають. Дехто навіть каже, що Братство може виступити проти Райху, який нібито обожнює, якщо той достатньо ослабне, адже, за їхніми переконаннями, арійськість можна як здобути, так і втратити. Подейкують, що в разі достатнього занепаду Райху керівництво Братства може проголосити себе носієм істинної арійськости, а Німеччину через це доведеться приборкати.\n\nХоч би якими були наміри Братства, більшість спостерігачів із жахом і потрясінням дивиться на нову Росію й може лише молитися, щоб та стала милосерднішою або якнайшвидше розвалилася..."
 RUS.207.a: "Боже милостивий..."
 RUS.207.b: "Я став Смертю, руйнівником світів."
 
 RUS.300.t: "Сонячний день у Сибіру"
 RUS.300.d: ""
 RUS.300.a: "Це змінює все!"
 
 RUS.999.t: "Бомбардування припиняються"
 RUS.999.d: "Довгі роки життя на величезній частині Росії визначали німецькі терористичні бомбардування.\n\nЦіле покоління росіян виросло серед випалених руїн, завжди стежачи за небом і будучи готовим бігти в укриття, щойно вгорі з'являться темні обриси бомбардувальників. Ціле покоління урядів, незалежно від ідеології, намагалося створити бодай якусь інфраструктуру чи промислову базу, але навіть те нечисленне, що вдавалося збудувати, часто негайно знищували.\n\nТа більше цього немає. Уже кілька днів мільйонам росіян не доводилося відчайдушно бігти до сховищ. Цивільну й військову інфраструктуру ремонтують, і її не руйнують знову. Нові споруди досі стоять. І нарешті приходить усвідомлення.\n\nБомбардувальники зникли.\n\nТі, хто має доступ до зовнішньої інформації, вважають, що громадянський хаос, який охопив ненависний Райх і його колоніяльні володіння в райхскомісаріятах, унеможливив продовження повітряної кампанії. Багато з тих, хто такого доступу не має, вважають це даром Божим.\n\nОднак навіть поки прості росіяни святкують у стані, близькому до нестями, інші говорять про темні хмари на обрії. Численні російські державки, яких більше не сковують німецькі бомби, тепер можуть звернути погляд назовні. Лише час покаже, що вони вирішать робити."
 RUS.999.a: "Чисте небо. Темні хмари."
 
 RUS.100.t: "Ще один день у Сибіру"
 RUS.100.desc: "У Сибіру стояв холодний, дуже холодний день, як і завжди. Сніг укривав землю, приховуючи глибоко внизу ґрунт, що ніколи не бачив сонця й уже не побачить. Пробираючись крізь сніг у чоботях і хутрі, з в'язкою птахів в одній руці та рушницею в другій, Артьом поглянув на хмари над головою. Вони були темнішими, ніж зазвичай, а це напевне віщувало бурю.\n\nСтрусивши сніг із хутра та шкіряного одягу, він підійшов до своєї халупи й повільно відчинив двері, обережно поклавши речі на стіл поруч.\n\nПісля миті тихих роздумів, протягом якої він оглянув скромну оселю й запалив лампу, Артьом почухав за вухом свого пса Сашу та, як і щодня, увімкнув радіо. Почувши лише шипіння, він насупився.\n\nАртьом швидко перебрав нечисленні доступні станції, але скрізь було лише шипіння, шипіння й знову шипіння. Трохи згодом він знизав плечима: вже кілька днів він чекав, що стара похилена радіовежа біля такого ж занедбаного села завалиться, і нічого із цим не можна було вдіяти. Зовнішній світ із усіма його дивами був для Артьома лише далекою думкою, тож, зітхнувши, він востаннє вимкнув радіо."
 RUS.100.a: "Життя триває..."
 
 RUS.5000.t: "Ще один день у Сибіру"
 RUS.5000.desc: "Ти що, бляха, щойно сказав про мене, йобаний куркулю? Щоб ти знав, я закінчив курс у Народному комісаріяті внутрішніх справ найкращим у випуску, брав участь у численних таємних нальотах на кубинський уряд Батісти й маю понад 410757864530 підтверджених убивств. Я навчений горилячій війні та є найкращим снайпером у всіх збройних силах СССР. Для мене ти лише чергова мішень.\n\nЯ, бляха, зітру тебе з лиця землі з точністю, якої цей світ ще не бачив, запам'ятай мої довбані слова.\n\nДумаєш, можеш сказати мені таке лайно через інтернет і тобі це зійде з рук, сраколизе-фашисте? Подумай ще раз, гівнюче. Просто зараз я зв'язуюся зі своєю таємною мережею шпигунів по всьому світу, твою IP-адресу вже відстежують, тож краще готуйся до бурі, білявчику.\n\nДо бурі, що змете те жалюгідне ніщо, яке ти називаєш своїм життям.\n\nТи, бляха, мертвий, куркулю. Я можу бути будь-де й будь-коли та вбити тебе понад сімсот тисячами способів, і це тільки голими руками. Я не лише чудово підготовлений до беззбройного бою, а й маю доступ до всього арсеналу совєцького флоту й використаю його на повну, щоб стерти твою жалюгідну дупу з лиця землі, дрібна гівноїдна фашистська комахо. Якби ти тільки знав, яку нечестиву кару накличе на тебе твій маленький "дотепний" коментар, то, може, прикусив би свого довбаного язика. Але ти не зміг, не зробив цього й тепер розплачуєшся, клятий нацисте. Я заллю тебе лютим лайном, і ти в ньому втопишся.\n\nТи, бляха, мертвий, куркулю."
 RUS.5000.a: "ООООООООООООООООООООООООООООООООООООООООООООООООООООООООО БООООООООООООООЖЕ"
 
