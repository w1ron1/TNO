 ### Russia Diplomacy events ###
 ###############################
 ### Race for the Urals ###
 RUS_race_for_the_urals.1.t: "Гонка за Урал"
 RUS_race_for_the_urals.1.d: "На схід від нас простягаються величні Уральські гори. Цей великий гірський хребет, традиційна межа між Європою та Азією, має вирішальне значення для наших об'єднавчих прагнень.\n\nПісля Західноросійської війни й розпаду ЗРРФ у регіоні не лишилося жодної центральної влади. Чимало комун і сіл шукали захисту або в міста Орєнбурґа, або в солдатів Уральської Ліги. Наша розвідка повідомляє, що інші потрапили під владу залишків НКВД у Маґнітоґорску чи були розграбовані бригадою Дірлеванґера. Зростання напружености після припинення німецьких терористичних бомбардувань призвело до конфліктів, що сформували нинішній розподіл сил у регіоні.\n\nУрал є для нашої держави водночас можливістю та загрозою. Захоплення ресурсів і населення цього краю значно допоможе нашій справі. Проте по той бік Уралу інша держава-об'єднувач проголошує себе законним російським урядом. Якщо цей супротивник захопить Урал, то зможе розмістити війська по наш бік гірського хребта, створивши загрозу нашим східним провінціям. Отже, ми мусимо утвердити своє панування в регіоні всіма необхідними засобами!\n\nНаші дипломати й генерали підготували цілу низку засобів, щоб залучити Урал до нашої сфери інтересів. За прогнозами, сторона, що найкраще поєднає престиж, дипломатичні успіхи та військове залякування, першою схилить місцеві еліти до прийняття об'єднання. Якщо дипломатія зазнає невдачі, у нас лишається військове втручання... Варіянт, із яким наші східні суперники навряд чи легко змиряться.\n\nГонка за Урал почалася! Ми здолаємо сибірських суперників і приєднаємо ще одну частину роздробленої Росії до нашої зростаючої держави!"
 RUS_race_for_the_urals.1.a: "Новий театр дій."
 
 RUS_race_for_the_urals.2.t: "Гонка за Урал"
 RUS_race_for_the_urals.2.d: "На захід від нас простягаються величні Уральські гори. Цей великий гірський хребет, традиційна межа між Європою та Азією, має вирішальне значення для наших об'єднавчих прагнень.\n\nПісля Західноросійської війни й розпаду ЗРРФ у регіоні не лишилося жодної центральної влади. Чимало комун і сіл шукали захисту або в міста Орєнбурґа, або в солдатів Уральської Ліги. Наша розвідка повідомляє, що інші потрапили під владу залишків НКВД у Маґнітоґорску чи були розграбовані бригадою Дірлеванґера. Зростання напружености після припинення німецьких терористичних бомбардувань призвело до конфліктів, що сформували нинішній розподіл сил у регіоні.\n\nУрал є для нашої держави водночас можливістю та загрозою. Захоплення ресурсів і населення цього краю значно допоможе нашій справі. Проте по той бік Уралу інша держава-об'єднувач проголошує себе законним російським урядом. Якщо цей супротивник захопить Урал, то зможе розмістити війська по наш бік гірського хребта, створивши загрозу нашим західним провінціям. Отже, ми мусимо утвердити своє панування в регіоні всіма необхідними засобами!\n\nНаші дипломати й генерали підготували цілу низку засобів, щоб залучити Урал до нашої сфери інтересів. За прогнозами, сторона, що найкраще поєднає престиж, дипломатичні успіхи та військове залякування, першою схилить місцеві еліти до прийняття об'єднання. Якщо дипломатія зазнає невдачі, у нас лишається військове втручання... Варіянт, із яким наші західні суперники навряд чи легко змиряться.\n\nГонка за Урал почалася! Ми здолаємо західноросійських суперників і приєднаємо ще одну частину роздробленої Росії до нашої зростаючої держави!"
 RUS_race_for_the_urals.2.a: "Новий театр дій."

 RUS_race_for_the_urals.3.t: "Наших дипломатів дискредитовано в Орєнбурґу!"
 RUS_race_for_the_urals.3.d: "Запрошення лишаються без відповіді. На дзвінки ніхто не передзвонює. Двері зачиняються перед самим носом. Останнім часом наших дипломатів в Орєнбурґу переслідує низка невдач. Підозрілих невдач, адже ворожість місцевих, схоже, не має жодної очевидної причини.\n\nБезсумнівно, наші суперники в гонці за Урал дискредитували наших дипломатів. Імовірно, поєднавши шантаж, підроблені докази, наклепи та відверту брехню про наші наміри, вони зуміли заплямувати репутацію наших дипломатів у великому місті на річці Урал.\n\nНам знадобиться час, щоб виплутатися із цієї халепи. Варто уважніше стежити за дипломатичними зусиллями наших суперників в Уральському регіоні."
 RUS_race_for_the_urals.3.a: "Про дещо із цього ми навіть ніколи не чули..."

 RUS_race_for_the_urals.4.t: "Наших дипломатів дискредитовано в Уральській Лізі!"
 RUS_race_for_the_urals.4.d: "Командири Уральської Ліги завжди поводилися з нашими дипломатами чесно й прямо. Однак останнім часом знамениті своєю пунктуальністю та чесністю елітні солдати дедалі частіше не з'являються на заплановані зустрічі з нашими дипломатами. Запити на акредитацію нових дипломатичних працівників раптом наштовхнулися на стіну бюрократії. Двері, колись відчинені перед нами, тепер зачинені.\n\nБезсумнівно, наші суперники в гонці за Урал дискредитували наших дипломатів. Імовірно, поєднавши шантаж, підроблені докази, наклепи та відверту брехню про наші наміри, вони зуміли заплямувати репутацію наших дипломатів серед командирів елітних Уральських рейнджерів.\n\nНам знадобиться час, щоб виплутатися із цієї халепи. Варто уважніше стежити за дипломатичними зусиллями наших суперників в Уральському регіоні."
 RUS_race_for_the_urals.4.a: "Про дещо із цього ми навіть ніколи не чули..."

 RUS_race_for_the_urals.5.t: "Наших дипломатів дискредитовано в Маґнітоґорску!"
 RUS_race_for_the_urals.5.d: "Не завжди легко зрозуміти цілі й прагнення тих, хто ховається в тіні Чорної Гори. Однак останнім часом наші дипломатичні посланці натрапили на незбагненну стіну мовчання. Контакти в Маґнітоґорску та його моторизованій дивізії НКВД стали відстороненими й похмурими.\n\nБезсумнівно, наші суперники в гонці за Урал дискредитували наших дипломатів. Імовірно, поєднавши шантаж, підроблені докази, наклепи та відверту брехню про наші наміри, вони зуміли заплямувати репутацію наших дипломатів серед господарів Чорної Гори.\n\nНам знадобиться час, щоб виплутатися із цієї халепи. Варто уважніше стежити за дипломатичними зусиллями наших суперників в Уральському регіоні."
 RUS_race_for_the_urals.5.a: "Про дещо із цього ми навіть ніколи не чули..."

 RUS_race_for_the_urals.6.t: "Наш вплив в Орєнбурґу зменшився!"
 RUS_race_for_the_urals.6.d: "Мить вагання перед рукостисканням із нашими дипломатами. Менше теплоти в спілкуванні місцевих чиновників із нашими посланцями. Легка неохота погоджуватися на подальші дипломатичні зустрічі. Наш вплив в Орєнбурґу слабшає, безперечно через зусилля суперників у гонці за Урал.\n\nВажко визначити наслідки цього послаблення впливу чи те, скільки часу піде на його відновлення до попереднього рівня. Утім, одне безсумнівно: наші суперники готові на все, аби перешкодити нашому впливу в регіоні."
 RUS_race_for_the_urals.6.a: "Брехня й наклепи!"

 RUS_race_for_the_urals.7.t: "Наш вплив в Уральській Лізі зменшився!"
 RUS_race_for_the_urals.7.d: "Мить вагання перед рукостисканням із нашими дипломатами. Менше теплоти в спілкуванні місцевих чиновників із нашими посланцями. Легка неохота погоджуватися на подальші дипломатичні зустрічі. Наш вплив в Уральській Лізі слабшає, безперечно через зусилля суперників у гонці за Урал.\n\nВажко визначити наслідки цього послаблення впливу чи те, скільки часу піде на його відновлення до попереднього рівня. Утім, одне безсумнівно: наші суперники готові на все, аби перешкодити нашому впливу в регіоні."
 RUS_race_for_the_urals.7.a: "Брехня й наклепи!"

 RUS_race_for_the_urals.8.t: "Наш вплив у Маґнітоґорску зменшився!"
 RUS_race_for_the_urals.8.d: "Мить вагання перед рукостисканням із нашими дипломатами. Менше теплоти в спілкуванні місцевих чиновників із нашими посланцями. Легка неохота погоджуватися на подальші дипломатичні зустрічі. Наш вплив у Маґнітоґорску слабшає, безперечно через зусилля суперників у гонці за Урал.\n\nВажко визначити наслідки цього послаблення впливу чи те, скільки часу піде на його відновлення до попереднього рівня. Утім, одне безсумнівно: наші суперники готові на все, аби перешкодити нашому впливу в регіоні."
 RUS_race_for_the_urals.8.a: "Брехня й наклепи!"

 RUS_race_for_the_urals.9.t: "Орєнбурґ у руках нашого супротивника!"
 RUS_race_for_the_urals.9.d: "У коридорах політичних установ Орєнбурґа, як і в залах засідань рад найбільших комун, скрізь трапляються люди, підкуплені нашими суперниками в гонці за Урал. Колись маргінальну ідею добровільної інтеграції до держави наших суперників тепер відкрито обговорюють на вулицях.\n\nНаші союзники в регіоні надсилають один звіт за іншим: Орєнбурґ опинився в руках нашого супротивника! Ми мусимо діяти швидко, інакше вся держава дозволить нашому суперникові добровільно себе анексувати."
 RUS_race_for_the_urals.9.a: "Неприхована агресія!"

 RUS_race_for_the_urals.10.t: "Уральська Ліга в руках нашого супротивника!"
 RUS_race_for_the_urals.10.d: "Від звичайних казарм і аж до штабів командирів Уральської Ліги дедалі частіше лунають тривожні розмови про те, щоб задля майбутнього Росії поєднати силу Ліги з ресурсами нашого супротивника. Дипломати суперника довели свій вплив на Уральську Лігу до критичного рівня.\n\nУральська Ліга та її елітна армія опинилися в руках нашого супротивника! Ми мусимо діяти швидко, інакше вся держава дозволить нашому суперникові добровільно себе анексувати."
 RUS_race_for_the_urals.10.a: "Неприхована агресія!"

 RUS_race_for_the_urals.11.t: "Маґнітоґорск у руках нашого супротивника!"
 RUS_race_for_the_urals.11.d: "У тіні Чорної Гори та навколо неї важко відрізнити правду від чуток. Проте всі говорять про одне: еліта Маґнітоґорска тепер перебуває під значним впливом дипломатів нашого суперника.\n\nМаґнітоґорск, його промисловість і військо опинилися в руках нашого супротивника! Ми мусимо діяти швидко, інакше вся держава дозволить нашому суперникові добровільно себе анексувати."
 RUS_race_for_the_urals.11.a: "Неприхована агресія!"
 
 RUS_race_for_the_urals.12.t: "Налагоджувальна подія"
 RUS_race_for_the_urals.12.d: "Якщо ви це бачите, хтось напартачив."
 RUS_race_for_the_urals.12.a: "Я негайно про це повідомлю."

 RUS_race_for_the_urals.13.t: "Іноземний вплив досяг критичного рівня!"
 RUS_race_for_the_urals.13.d: "Стан Комун Орєнбурґа завжди був мінливим. Навіть у найкращі дні комуни погрожували одна одній і гнівно зиркали через кордони та з протилежних боків зали засідань ради. Однак сьогодні багато хто в Раді Орєнбурґа зрозумів, що став практично зайвим. Представники відроджених російських держав при раді дедалі більше перетворювалися на справжню рушійну силу орєнбурзької політики.\n\nНові сили Західної Росії та Сибіру здобули настільки всеосяжний вплив на колись розсварену раду, що та стала лише продовженням волі російських держав. Голоси останніх незалежних членів ради потонули в одностайності, якої Комуни ще ніколи не знали.\n\nВільнодумний і незалежний народ Орєнбурґа бурчав би й нарікав, але поряд із могутністю відроджених російських держав кілька розлючених селян були дрібницею.\n\nНаприкінці дня члени ради поверталися додому й бурчали, а світ ішов далі без них."
 RUS_race_for_the_urals.13.a: "Сумний стан справ."

 RUS_race_for_the_urals.14.t: "Іноземний вплив досяг критичного рівня!"
 RUS_race_for_the_urals.14.d: "Командир Константін Тучєвскій сидів у своєму командному наметі на кордоні з Маґнітоґорском. Від вищого керівництва надійшов наказ: Чорна Гора прагне взяти регіон під контроль, тому слід чекати її нападу. Це було два місяці тому, і за весь цей час він не почув від Гори ані звуку.\n\nЩе за годину чекання з боку місцевого залізничного депо дорогою долинув гуркіт вантажівок і тупіт людей. І депо, і вантажівки були подарунками їхнього нового доброчинця, разом із указівками щодо їхнього використання. До Константіна доходило дедалі більше чуток згори, а представники доброчинця щораз частіше диктували Лізі її дії. Навіть це призначення надійшло з канцелярії представника.\n\nКонстантін був у Лізі від самих її витоків, ще від утечі з Воркути. Він вів людей у бій проти Дірлеванґера й відіграв ключову роль у підготовці орєнбурзького ополчення. Та попри все це його не полишала тривога. Що більше він чув про новий шлях Ліги, то дужче непокоївся."
 RUS_race_for_the_urals.14.a: "Лігу закуто в кайдани."

 RUS_race_for_the_urals.15.t: "Іноземний вплив досяг критичного рівня!"
 RUS_race_for_the_urals.15.d: "У тіні Чорної Гори сержант Андрєй Конолєв патрулював села Уралу. Він внутрішньо здригався, коли діти з острахом сахалися від нього, а матері заводили їх до хат. Усе, що вони з товаришами накоїли, щоночі переслідувало його в кошмарах. Він міг тільки дякувати долі за те, що останнім часом накази змінилися.\n\nВідроджені російські держави звернули голодні погляди на Південний Урал. Економічна допомога ринула до регіону, вперше за десятиліття зводилися нові дороги й залізниці, відкривалися нові фабрики, а життя під поглядом Гори стало помітно кращим, ніж раніше.\n\nЗвісно, економічні стимули супроводжувалися політичним втручанням. Спершу вплив був незначним, то тут, то там змінювали окремі правила, але тепер стало очевидно, що Чорну Гору прикуто до її доброчинців. Дедалі частіше Андрєй отримував накази від людей поза ланцюгом командування. Навіть цей звичайнісінький патруль був наслідком зовнішнього впливу.\n\nПроминаючи ще одну оселю із зачиненими віконницями, Андрєй не міг не відчувати вдячности. Якби все лишилося по-старому, невдовзі його ліквідували б за сумніви й каяття. Тепер його заспокоювала сама буденність патрулювання Уралу.\n\nНарешті Андрєй поглянув на свого напарника Алєксандра. Той був кращою людиною за більшість, хоч і не доброю: ніхто з них не міг назвати себе добрим і не збрехати. Вони зупинилися на краю села, подалі від переляканих очей та осудливих поглядів. Зрештою він набрався сміливости заговорити: "Алєксандре?"\n\n"Так?"\n\n"Ти коли-небудь замислювався, навіщо ми тут?""
 RUS_race_for_the_urals.15.a: "Мить роздумів."

 RUS_race_for_the_urals.16.t: "Отримано вимогу інтеграції"
 RUS_race_for_the_urals.16.d: "Рада Комун Орєнбурґа вирувала. Від звичайного дня в Раді цей відрізнявся лише темою обговорення. Ранок почався досить спокійно, аж доки до зали засідань не впустили посланця. Це був похмурий чоловік, надісланий до Орєнбурґа однією з нових сил російської анархії.\n\nНовина, яку він приніс, приголомшила всіх. Це була вимога, що суперечила всьому, у що вірили мешканці Комун, і все ж у залі точилася справжня суперечка про те, який шлях обрати. Уперше члени ради об'єдналися лише у три фракції. Одні хотіли поступитися, прийняти - слід визнати, спокусливі - вигоди й відмовитися від нинішнього стану, тоді як інші не збиралися продавати за прості хабарі важко здобуті свободи.\n\nТретя фракція, ті, хто не приставав на жоден бік, мала вирішити остаточний вибір Ради. Після багатьох годин крику й не однієї спроби обох сторін перейти до насильства третя сторона оголосила своє рішення.\n\nКоли представник третьої фракції підвівся, зала Ради стихла. Чоловік став на чолі своєї групи й промовив: "Ми вирішили, що Комуни Орєнбурґа повинні...""
 RUS_race_for_the_urals.16.a: "...прийняти інтеграцію."
 RUS_race_for_the_urals.16.b: "...відмовитися від інтеграції."

 RUS_race_for_the_urals.17.t: "Отримано вимогу інтеграції"
 RUS_race_for_the_urals.17.d: "Яніс Мєндрікс сидів за столом у штабі Уральської Ліги. Дні здавалися священникові дедалі довшими, бо все більше його людей, і кожен із них був доброю людиною, піддавалися обіцянкам нової російської сили. Ліга опинилася над прірвою: від її нового доброчинця надійшло послання з вимогою не менш як повного підпорядкування Уральської Ліги його владі.\n\nВигоди від приєднання були очевидними: більше їжі, ліків і предметів розкоші для людей під захистом Ліги, більше вояків для оборони краю. Та недоліки були не менш явними. Він пам'ятав давні часи, коли серп і молот гордо майоріли в кожному місті Союзу. Пам'ятав гноблення, жорстокість і смерть. Пам'ятав, як його разом із сотнями інших везли до Воркути, де вони мали працювати, доки не замерзнуть. Він пам'ятав... і вагався.\n\nЯк незліченну кількість разів у житті, він молив Бога про настанову. Хоч уже давно не чув Господнього голосу, та все одно молився, щоб сьогоднішній вибір приніс довіреним йому людям краще й безпечніше життя.\n\nНарешті він ухвалив рішення. Уральська гвардія мала..."
 RUS_race_for_the_urals.17.a: "...прийняти інтеграцію."
 RUS_race_for_the_urals.17.b: "Битися до кінця!"

 RUS_race_for_the_urals.18.t: "Отримано вимогу інтеграції"
 RUS_race_for_the_urals.18.d: "У глибинах Чорної Гори, поки керівники цього проклятого місця обговорювали державні справи, простий прибиральник на ім'я Павєл займався щоденною роботою. Саме зараз він витирав із підлоги їдальні рештки обіду якогось солдата НКВД. Павєл посідав настільки низьке місце в тутешній ієрархії, що солдати й науковці Чорної Гори його майже не помічали. Довкола нього язики розв'язувалися, і він вбирав плітки, наче губка.\n\n"Чув, начальство веде переговори з фашистами. Кажуть, вони вимагають нашого підкорення. Покидьки", - пролунав голос одного чоловіка.\n\n"Та невже? А я чув, що то Революційний фронт або ті психи з Чорної Ліги", - озвався інший.\n\n"А я чув, що це привид товариша Бухаріна, який повстав, аби знову нищити німців", - додав Дмітрій. Павєлу подобався Дмітрій: час від часу той підкидав йому зайвий пайок. "Річ у тім, що не варто надто довіряти чуткам. Хоч би якою була правда, урешті ми виконаємо накази".\n\nТак воно й було: війська НКВД виконають накази згори, хоч би якими жахливими вони були. Павєл пам'ятав крики й тіла тих, хто опинився в лабораторіях. Він не любив прибирати в тих місцях. Щоразу йому здавалося, що він чує муки проклятих душ."
 RUS_race_for_the_urals.18.a: "Анексія краща."
 RUS_race_for_the_urals.18.b: "Чорна Гора не схилиться."

 RUS_race_for_the_urals.19.t: "Орєнбурґ просить нашої допомоги"
 RUS_race_for_the_urals.19.d: "Комуни Орєнбурґа звернулися до нас по допомогу. Наші суперники в боротьбі за контроль над Західною Росією та Сибіром чинять на Комуни величезний тиск. Вони обіцяють багатства в обмін на покору, та Комуни не мають наміру поступатися.\n\nРада Орєнбурґа готова піти на певні поступки в обмін на нашу підтримку. Так само не можна недооцінювати й політичний вплив, який ми здобудемо в Орєнбурґу. Якщо нам удасться бодай поки зберегти його незалежність, ми позбавимо ворога важливих ресурсів і подбаємо, щоб у майбутньому Комуни охочіше погодилися на інтеграцію.\n\nУтім, це ризикована пропозиція. Якщо вони не відступлять, нас легко може втягнути у війну, до якої ми не готові. До того ж через свій невеликий розмір Комуни навряд чи зможуть надати бодай помітну допомогу в можливих боях. Зрештою, рівновага сил у регіоні висить на волосині, і від нашого рішення залежить доля Орєнбурґа, а можливо, й самої Росії."
 RUS_race_for_the_urals.19.a: "Скажіть їм, що ми їх підтримаємо."
 RUS_race_for_the_urals.19.b: "Ми нічим не можемо зарадити."

 RUS_race_for_the_urals.20.t: "Уральська Ліга просить нашої допомоги"
 RUS_race_for_the_urals.20.d: "Константін Корявов із тривогою дивився на кордон із землями Уральської Ліги. Він і його люди отримали наказ вишикуватися вздовж кордону й готуватися до переходу. Відтоді минуло три тижні, і солдати вже втомилися чекати. Як розповів йому полковник Оборін, покидьки по той бік Уралу готувалися вторгнутися на територію Ліги.\n\nВін знав бійців Уральської гвардії: сильних і відважних до одного. Від самої думки про те, щоб покинути їх напризволяще, його нудило, однак у разі такого наказу він мусив би підкоритися.\n\nКонстантін відійшов від своєї позиції з видом на кордон і повернувся до командного намету. Напевне він знав лише те, що до столиці надіслали прохання про допомогу й вище керівництво гаряче сперечалося, як діяти. Востаннє зітхнувши, він увійшов у трохи тепліше повітря намету.\n\nНе встиг він нічого зробити, як ад'ютант подав йому повідомлення, призначене лише для його очей. Схоже, начальство нарешті віддало наказ виступати."
 RUS_race_for_the_urals.20.a: "Скажіть їм, що ми їх підтримаємо."
 RUS_race_for_the_urals.20.b: "Ми нічим не можемо зарадити."

 RUS_race_for_the_urals.21.t: "Маґнітоґорск просить нашої допомоги"
 RUS_race_for_the_urals.21.d: "Глибоко в уральській глушині сержант Ніколай Пєтровіч лежав на животі, спостерігаючи за кордоном із Маґнітоґорском. Його підрозділ виконував розвідку для регулярних дивізій, розміщених у глибині території. Його люди були строкатим гуртом, переважно старими мисливцями з глушини та знавцями виживання, які вступили до війська заради стабільнішого пайка. Попри свою різношерстість, вони були відданими й дуже дисциплінованими.\n\nЗараз люди Ніколая спостерігали, як боєць НКВД із Чорної Гори патрулював село внизу. Навіть із такої відстані було видно його нервозність: щось відбувалося, і нічого доброго це не віщувало. Ніколай чув про Чорну Гору достатньо, щоб зневажати її володарів, але також розумів необхідність узяти край під контроль, хоча сам волів би взяти Гору штурмом і перебити всіх покидьків із НКВД.\n\nПричина нервозности чоловіка швидко стала очевидною, коли почулися крики. Із півдня до села наближалися люди в іншій, дуже знайомій формі. Сили НКВД у селі завдавали нападникам тяжких утрат, але самі поволі відступали.\n\nУперше за майже три тижні порушивши радіомовчання, Ніколай зв'язався з командиром. Пояснивши ситуацію, він став чекати на накази."
 RUS_race_for_the_urals.21.a: "Скажіть їм, що ми їх підтримаємо."
 RUS_race_for_the_urals.21.b: "Ми нічим не можемо зарадити."
 
 RUS_race_for_the_urals.22.t: "Зустрічна вимога"
 RUS_race_for_the_urals.22.d: "Жахливі новини! Орєнбурґ відхилив нашу вимогу про анексію. Після кількох годин безплідних дебатів його рада відмовила нам. Дехто хотів об'єднатися з нами, але зрештою перемогла протилежна група. Схоже, приєднати Орєнбурґ до нашої держави можна лише кровопролиттям.\n\nЩо гірше, держава по той бік гір повідомила Орєнбурґу, що підтримає його, якщо той боронитиме незалежність. Отже, війна з Орєнбурґом майже напевне спричинить її вторгнення проти нас. Ми очікуємо такої війни, але ще не цілком готові до неї.\n\nУ нас є лише два варіянти. Честь вимагає підкріпити слова військовою силою. Хоч би хто протистояв нам, ми діємо рішуче. Ми не марнуємо час на нескінченні дебати, як комуни. Ми повернемо цю частину законної російської землі до спільного лона, а всіх, хто стане на шляху, також розчавимо.\n\nА втім... чи не мудріше зачекати? Війна, ймовірно, все одно станеться. Нічого не зміниться, якщо ми трохи відкладемо дії та краще підготуємося. Можна просто прийняти цю невдачу й зосередити зусилля на здобутті переваги."
 RUS_race_for_the_urals.22.a: "Порожня бравада."
 RUS_race_for_the_urals.22.b: "Ми не маємо вибору, крім як відступити."

 RUS_race_for_the_urals.23.t: "Зустрічна вимога"
 RUS_race_for_the_urals.23.d: "Уральська Ліга широко відома своєю хоробрістю. Але її люди також бувають упертими й тупоголовими. Особливо коли гадають, що мають перевагу. І понад усяку міру, коли за їхніми спинами, схоже, стоїть велика держава.\n\nСьогодні Яніс Мєндрікс відхилив нашу пропозицію інтегрувати його Лігу. Запропонована угода виявилася недостатньо доброю, і його гвардія готова чинити нам опір за будь-яку ціну. Схоже, Уральська гвардія нас не боїться й готова битися з нами, як уже билася з багатьма іншими. За звичайних обставин ми радо прийняли б її виклик.\n\nТа є одна складність. По той бік гір інша держава готова підтримати Уральську Лігу. Її сили здатні змагатися з нашими, а обладнання вистачить і для підтримки Ліги. Це означатиме масштабну війну з іншою великою державою, і в дуже невдалий час.\n\nУ нас два варіянти. Або ми вступаємо в масштабну війну, яка закінчиться лише поразкою іншої держави, або, зіткнувшись з іншим претендентом на Росію, підтискаємо хвоста й повертаємося в тінь. Насправді все залежить від того, чи віримо ми у свою перемогу. Чи вигідно нам битися саме зараз?"
 RUS_race_for_the_urals.23.a: "Порожня бравада."
 RUS_race_for_the_urals.23.b: "Ми не маємо вибору, крім як відступити."

 RUS_race_for_the_urals.24.t: "Зустрічна вимога"
 RUS_race_for_the_urals.24.d: "Ніхто не сподівається, що ми розуміємо події всередині Чорної Гори. Так само ніхто не чекає від неї розумних рішень. Але ще менше людей сподівається, що хтось поважатиме її право ухвалювати власні рішення. Тим паче держава, яка прагне стати законним урядом Росії.\n\nМаґнітоґорск узагалі не відповів на нашу пропозицію. Натомість ми отримали повідомлення з другого боку Уралу. У ньому прямо сказано, що будь-яка спроба силою нав'язати нашу вимогу призведе до оголошення нам війни. Це, цілком очевидно, велика проблема. Не лише тому, що все те чортзна-що всередині триватиме, а й тому, що масштабна війна стає надзвичайно ймовірною.\n\nРозумним рішенням було б відступити. Війна не несе нічого доброго, особливо якщо ми можемо програти. Краще не квапитися, відновити повну силу й підготуватися до війни. Раптовий і необдуманий крок може знищити все, що ми збудували й заради чого працювали.\n\nМоральним рішенням було б послати армію розчавити цього хробака, що виповз із трупа Совєцького Союзу, і всіх, хто хоче захищати скоєні ним злочини. Звісно, іноді заради блага народу Росії нам, на жаль, доводиться йти на компроміс."
 RUS_race_for_the_urals.24.a: "Порожня бравада."
 RUS_race_for_the_urals.24.b: "Ми не маємо вибору, крім як відступити."

 RUS_race_for_the_urals.25.t: "Наш суперник поступився!"
 RUS_race_for_the_urals.25.d: "Чудові новини з Орєнбурґа! Нашу вимогу зберегти незалежність Вільної Території почуто! Наш суперник по той бік Уралу вирішив, що анексія комун не варта ризику відкритого військового конфлікту з нами, й відмовився від планів інтеграції. Орєнбурґ лишиться суверенним маяком свободи та процвітання на півдні Росії, принаймні поки що. Однак дипломатична боротьба за долю території ще далеко не скінчилася. Наш суперник досі прагне включити місто до своїх кордонів, і тепер, коли ми вже раз пригрозили застосувати військову силу, наступного разу він, імовірно, буде краще підготовлений. Жителі Орєнбурґа також можуть не оцінити, що ми самі призначили себе їхнім опікуном. Вони мають дуже добрі відносини з нашим суперником, і багато хто міг чекати на анексію. Наше втручання в їхні закордонні справи не додасть нам прихильників на цій території. Однак найважливіше те, що місто лишається поза руками нашого суперника, і принаймні зараз так воно й буде. Доки Орєнбурґ вільний, ми маємо шанс привернути його до нашої справи, але мусимо діяти швидко."
 RUS_race_for_the_urals.25.a: "Принаймні поки він у безпеці."

 RUS_race_for_the_urals.26.t: "Наш суперник поступився!"
 RUS_race_for_the_urals.26.d: "Чудові новини з Бєлорєцка! Наша вимога зберегти незалежність Уральської Ліги спрацювала! Наш суперник по той бік Уралу вирішив, що інтеграція Ліги не варта ризику війни з нами, й відмовився від планів анексії. Уральська Ліга лишиться вільною твердинею безпеки та стабільности на півдні Росії, принаймні поки що. Однак дипломатична боротьба за долю Ліги ще далеко не скінчилася. Наш суперник досі прагне включити Уральську гвардію до своєї держави, і тепер, коли ми вже раз пригрозили вторгненням, наступного разу він, імовірно, буде готовий до війни. Уральській Лізі також може не сподобатися, що ми самі призначили себе її опікуном. Вона має дуже добрі відносини з нашим суперником, і багато хто міг чекати на приєднання до більшої держави. Наше втручання в її справи не додасть нам прихильників серед гвардійців. Однак найважливіше те, що Ліга лишається поза руками нашого суперника, і принаймні зараз так воно й буде. Доки Уральська Ліга вільна, ми маємо шанс привернути її до нашої справи, але мусимо діяти швидко."
 RUS_race_for_the_urals.26.a: "Принаймні поки вона в безпеці."

 RUS_race_for_the_urals.27.t: "Наш суперник поступився!"
 RUS_race_for_the_urals.27.d: "Добрі новини з Маґнітоґорска! Нашу вимогу зберегти незалежність держави прийнято! Наш суперник по той бік Уралу вирішив, що анексія Маґнітоґорска не варта війни, й відклав плани інтеграції на невизначений час. Маґнітоґорск лишиться незалежним осередком науки та інновацій на півдні Росії, принаймні поки що. Однак дипломатична боротьба за долю міста ще далеко не скінчилася. Наш суперник досі прагне включити Чорну Гору до своєї держави, і тепер, коли ми вже раз пригрозили йому війною, наступного разу він, імовірно, буде готовий до конфлікту. Уряду Маґнітоґорска також може не сподобатися, що ми самі призначили себе його опікуном. Він має дуже добрі відносини з нашим суперником, і багато хто чекав на приєднання до сильнішої держави. Наше втручання в їхні плани не додасть нам прихильників в уряді. Однак найважливіше те, що Маґнітоґорск лишається поза руками нашого суперника, і принаймні зараз так воно й буде. Доки Чорна Гора вільна, ми маємо шанс привернути її до нашої справи, але мусимо діяти швидко."
 RUS_race_for_the_urals.27.a: "Принаймні поки він у безпеці."

 RUS_race_for_the_urals.28.t: "Наш ультиматум відхилено"
 RUS_race_for_the_urals.28.d: "Жахливі новини з Орєнбурґа! Наш суперник відмовився облишити плани анексії Вільної Території. Він стверджує, що уряд Орєнбурґа готовий інтегруватися до його держави, а отже, це справа лише між ними. Якщо ми хочемо перешкодити анексії, нам доведеться підтвердити діями свою погрозу військового втручання. Війна зупинить анексію, але ми можемо вступити в конфлікт, до якого ще не цілком готові. З іншого боку, відмова від вторгнення принизить нас перед усім світом. Нас знатимуть як державу порожніх погроз і неправдивих обіцянок. Ситуацію додатково ускладнює сам Орєнбурґ. Якщо мирна анексія провалиться, наш суперник, імовірно, спробує вторгнутися й захопити місто раніше за нас, перетворивши Вільну Територію на природного союзника нашої справи. Однак якщо Орєнбурґ збереже нейтралітет, то може вважати агресором нас, адже ми втрутилися в його справи й почали війну, щоб не дати йому інтегруватися з нашим суперником. Тоді привернути його на наш бік стане ще важче. Доля Росії висить на волосині, а час спливає. Ми мусимо вирішити зараз."
 RUS_race_for_the_urals.28.a: "Отже, війна."
 RUS_race_for_the_urals.28.b: "Ми зробили все, що могли."

 RUS_race_for_the_urals.29.t: "Наш ультиматум відхилено"
 RUS_race_for_the_urals.29.d: "Жахливі новини з Бєлорєцка! Наш суперник відмовився облишити плани анексії Уральської Ліги. Він стверджує, що Уральська гвардія готова інтегруватися до його держави, а отже, це справа лише між ними. Якщо ми хочемо перешкодити анексії, нам доведеться підтвердити діями свою погрозу військового втручання. Війна зупинить анексію, але ми можемо вступити в конфлікт, до якого ще не цілком готові. З іншого боку, відмова від вторгнення принизить нас перед усім світом. Нас знатимуть як державу порожніх погроз і неправдивих обіцянок. Ситуацію додатково ускладнює сама Уральська Ліга. Якщо мирна анексія провалиться, наш суперник, імовірно, спробує вторгнутися й захопити гори раніше за нас, перетворивши гвардійців на природних союзників нашої справи. Однак якщо Ліга збереже нейтралітет, то може вважати агресором нас, адже ми втрутилися в її справи й почали війну, щоб не дати їй інтегруватися з нашим суперником. Тоді привернути її на наш бік стане ще важче. Доля Росії висить на волосині, а час спливає. Ми мусимо вирішити зараз."
 RUS_race_for_the_urals.29.a: "Отже, війна."
 RUS_race_for_the_urals.29.b: "Ми зробили все, що могли."

 RUS_race_for_the_urals.30.t: "Наш ультиматум відхилено"
 RUS_race_for_the_urals.30.d: "Жахливі новини з Маґнітоґорска! Наш суперник відмовився облишити плани анексії Чорної Гори. Він стверджує, що уряд Маґнітоґорска готовий інтегруватися до його держави, а отже, це справа лише між ними. Якщо ми хочемо перешкодити анексії, нам доведеться підтвердити діями свою погрозу військового втручання. Війна зупинить анексію, але ми можемо вступити в конфлікт, до якого ще не цілком готові. З іншого боку, відмова від вторгнення принизить нас перед усім світом. Нас знатимуть як державу порожніх погроз і неправдивих обіцянок. Ситуацію додатково ускладнює сам Маґнітоґорск. Якщо мирна анексія провалиться, наш суперник, імовірно, спробує вторгнутися й захопити територію раніше за нас, перетворивши Чорну Гору на природного союзника нашої справи. Однак якщо Маґнітоґорск збереже нейтралітет, то може вважати агресором нас, адже ми втрутилися в його справи й почали війну, щоб не дати йому інтегруватися з нашим суперником. Тоді привернути його на наш бік стане ще важче. Доля Росії висить на волосині, а час спливає. Ми мусимо вирішити зараз."
 RUS_race_for_the_urals.30.a: "Отже, війна."
 RUS_race_for_the_urals.30.b: "Ми зробили все, що могли."

 RUS_race_for_the_urals.31.t: "Оголошено війну за Орєнбурґ!"
 RUS_race_for_the_urals.31.d: "Катастрофа! Напруженість на Південному Уралі невпинно зростала й нарешті вилилася в збройний конфлікт. Наш суперник не дозволив нам мирно вести дипломатичні справи й вирішив здійснити свою обурливу погрозу. Замість того щоб дати нам домовитися з Орєнбурґом про мирне приєднання міста до нашої держави, він знову кинув Росію у війну. Війська вже почали сутички вздовж усього Уралу. Після початку бойових дій дипломати Орєнбурґа офіційно вийшли з усіх переговорів про об'єднання, хоча наші дипломати чітко пояснили їм наслідки такого кроку. У відповідь нам не лишається нічого, крім вторгнення до Вільної Території. Ми не можемо допустити, щоб Орєнбурґ опинився під контролем суперника. Тепер нас поставили в незавидне становище, змусивши одночасно битися і з Орєнбурґом, і з нашим суперником. Єдиний вихід - швидко й рішуче розгромити обох. Ми намагалися владнати справу мирно, але, схоже, возз'єднання Росії вимагає пролити ще більше російської крови. Лишається сподіватися, що ця нова боротьба буде цивілізованішою за попередні."
 RUS_race_for_the_urals.31.a: "Та ми все одно переможемо!"
 
 RUS_race_for_the_urals.32.t: "Оголошено війну за Уральську Лігу!"
 RUS_race_for_the_urals.32.d: "Катастрофа! Напруженість на Південному Уралі невпинно зростала й нарешті вилилася в збройний конфлікт. Наш суперник не дозволив нам мирно вести дипломатичні справи й вирішив здійснити свою обурливу погрозу. Замість того щоб дати нам домовитися з Уральською Лігою про мирне приєднання гвардії до нашої держави, він знову кинув Росію у війну. Війська вже почали сутички вздовж усього Уралу. Після початку бойових дій Уральська Ліга офіційно вийшла з усіх переговорів про об'єднання, хоча наші дипломати чітко пояснили їй наслідки такого кроку. У відповідь нам не лишається нічого, крім вторгнення в гори. Ми не можемо допустити, щоб територія гвардії опинилася під контролем суперника. Тепер нас поставили в незавидне становище, змусивши одночасно битися і з гвардією, і з нашим суперником. Єдиний вихід - швидко й рішуче розгромити обох. Ми намагалися владнати справу мирно, але, схоже, возз'єднання Росії вимагає пролити ще більше російської крови. Лишається сподіватися, що ця нова боротьба буде цивілізованішою за попередні."
 RUS_race_for_the_urals.32.a: "Та ми все одно переможемо!"

 RUS_race_for_the_urals.33.t: "Оголошено війну за Маґнітоґорск!"
 RUS_race_for_the_urals.33.d: "Катастрофа! Напруженість на Південному Уралі невпинно зростала й нарешті вилилася в збройний конфлікт. Наш суперник не дозволив нам мирно вести дипломатичні справи й вирішив здійснити свою обурливу погрозу. Замість того щоб дати нам домовитися з Маґнітоґорском про мирне приєднання Чорної Гори до нашої держави, він знову кинув Росію у війну. Війська вже почали сутички вздовж усього Уралу. Після початку бойових дій уряд Маґнітоґорска офіційно вийшов з усіх переговорів про об'єднання, хоча наші дипломати чітко пояснили йому наслідки такого кроку. У відповідь нам не лишається нічого, крім вторгнення. Ми не можемо допустити, щоб Чорна Гора опинилася під контролем суперника. Тепер нас поставили в незавидне становище, змусивши одночасно битися і з Маґнітоґорском, і з нашим суперником. Єдиний вихід - швидко й рішуче розгромити обох. Ми намагалися владнати справу мирно, але, схоже, возз'єднання Росії вимагає пролити ще більше російської крови. Лишається сподіватися, що ця нова боротьба буде цивілізованішою за попередні."
 RUS_race_for_the_urals.33.a: "Та ми все одно переможемо!"

 RUS_race_for_the_urals.34.t: "Зрада нашого покровителя"
 RUS_race_for_the_urals.34.d: "Нас покинули! Дипломати нашого покровителя щойно повідомили, що він більше не може гарантувати незалежність Орєнбурґа й нам доведеться захищатися без його допомоги. Нас зрадили в найскрутнішу мить, коли суперник покровителя по той бік Уралу готується силою змусити нас приєднатися до його володінь або битися. Ворог значно переважає наші сили чисельністю та вогневою міццю, тож будь-яка боротьба за виживання дорівнюватиме самогубству. Та, можливо, смерть краща за втрату свободи, заради якої ми так тяжко працювали. Боягузи на півночі кинули Орєнбурґ вовкам, і тепер, коли наш захисник відвернувся, його суперник незабаром повторить свої вимоги. Ми мусимо вирішити, що відповісти."
 RUS_race_for_the_urals.34.a: "Щоб захистити народ, ми мусимо здатися."
 RUS_race_for_the_urals.34.b: "Ми вистоїмо, не схилившись!"

 RUS_race_for_the_urals.35.t: "Зрада нашого покровителя"
 RUS_race_for_the_urals.35.d: "Нас покинули! Дипломати нашого покровителя щойно повідомили, що він більше не може гарантувати незалежність Уральської Ліги й нам доведеться захищатися без його допомоги. Нас зрадили в найскрутнішу мить, коли суперник покровителя по той бік гір готується силою змусити нас приєднатися до його володінь або битися. Ворог значно переважає наші сили чисельністю та вогневою міццю, тож будь-яка боротьба за виживання дорівнюватиме самогубству. Та багато бійців Уральської гвардії радше помруть, захищаючи гірську домівку, ніж схиляться перед черговим тираном. Підступні боягузи кинули Уральську Лігу вовкам, і тепер, коли наш захисник відвернувся, його суперник незабаром повторить свої вимоги. Ми мусимо вирішити, що відповісти."
 RUS_race_for_the_urals.35.a: "Щоб захистити народ, ми мусимо здатися."
 RUS_race_for_the_urals.35.b: "Ми знову стримаємо навалу!"

 RUS_race_for_the_urals.36.t: "Зрада нашого покровителя"
 RUS_race_for_the_urals.36.d: "Нас покинули! Дипломати нашого покровителя щойно повідомили, що він більше не може гарантувати незалежність Маґнітоґорска й нам доведеться захищатися без його допомоги. Нас зрадили в найскрутнішу мить, коли суперник покровителя по той бік гір готується силою змусити нас приєднатися до його володінь або битися. Ворог значно переважає наші сили чисельністю та вогневою міццю, тож будь-яка боротьба за виживання дорівнюватиме самогубству, адже навіть могутні укріплення Чорної Гори не зможуть вічно стримувати ворогів. Підступні боягузи кинули Маґнітоґорск вовкам, і тепер, коли наш захисник відвернувся, його суперник незабаром повторить свої вимоги. Ми мусимо вирішити, що відповісти."
 RUS_race_for_the_urals.36.a: "Щоб захистити народ, ми мусимо здатися."
 RUS_race_for_the_urals.36.b: "Жодних компромісів."

 RUS_race_for_the_urals.37.t: "Орєнбурґ приймає інтеграцію!"
 RUS_race_for_the_urals.37.d: "Наші дипломати повернулися з Орєнбурґа з чудовими новинами! Після тривалого обговорення Рада Орєнбурґа прийняла нашу пропозицію мирно включити свою територію до нашої держави! Нинішній уряд продовжить керувати регіоном як тимчасова перехідна адміністрація, доки ми не зможемо повністю його інтегрувати. Ополчення Орєнбурґа та навколишніх громад також погодилися ввійти до складу нашого війська, надавши нам тисячі солдатів, які знають місцевість і готові служити новій державі. Багато хто боявся, що Орєнбурґ стане іскрою, яка знову запалить Росію, та цього разу, здається, перемогла дипломатія. Можливо, ми можемо сподіватися, що доба війни між росіянами добігає кінця."
 RUS_race_for_the_urals.37.a: "Вони знають, що для них краще."

 RUS_race_for_the_urals.38.t: "Уральська Ліга приймає інтеграцію!"
 RUS_race_for_the_urals.38.d: "Наші дипломати повернулися з Бєлорєцка з чудовими новинами! Після тривалого обговорення керівництво Уральської Ліги прийняло нашу пропозицію мирно включити свою територію до нашої держави! Нинішній уряд продовжить керувати регіоном як тимчасова перехідна адміністрація, доки ми не зможемо повністю його інтегрувати. Уральська гвардія також погодилася ввійти до складу нашого війська. Це великий дар, адже гвардійці є одними з найдосвідченіших і найбільш загартованих у боях солдатів не лише в Росії, а й у всьому світі. Наші солдати пишатимуться тим, що б'ються поряд із ними. Багато хто боявся, що Уральська Ліга стане іскрою, яка знову запалить Росію, та цього разу, здається, перемогла дипломатія. Можливо, ми можемо сподіватися, що доба війни між росіянами добігає кінця."
 RUS_race_for_the_urals.38.a: "Вони знають, що для них краще."

 RUS_race_for_the_urals.39.t: "Маґнітоґорск приймає інтеграцію!"
 RUS_race_for_the_urals.39.d: "Наші дипломати повернулися з Маґнітоґорска з чудовими новинами! Після тривалого обговорення керівництво Чорної Гори прийняло нашу пропозицію мирно включити свою територію до нашої держави! Нинішній уряд продовжить керувати регіоном як тимчасова перехідна адміністрація, доки ми не зможемо повністю його інтегрувати. Моторизовані бригади НКВД, що захищають гору, також погодилися ввійти до складу нашого війська. Нам дуже пощастило, адже хоч вони нечисленні, та озброєні одними з найсучасніших зразків зброї в Росії. Багато хто боявся, що Маґнітоґорск стане іскрою, яка знову запалить Росію, та цього разу, здається, перемогла дипломатія. Можливо, ми можемо сподіватися, що доба війни між росіянами добігає кінця."
 RUS_race_for_the_urals.39.a: "Вони знають, що для них краще."

 RUS_race_for_the_urals.40.t: "Орєнбурґ кинуто напризволяще!"
 RUS_race_for_the_urals.40.d: "Орєнбурґ незабаром буде нашим. Розвідники щойно повідомили, що наш суперник вирішив покинути місто напризволяще й не ризикувати військовим зіткненням. Його надія зупинити нашу анексію гарантіями незалежности комун розбилася, коли ми не відмовилися від своїх планів. Зрозумівши, що нас не залякати й не змусити скоритися, суперник швидко облишив зухвалу браваду. Він довів, що не готовий підкріпити гучні слова рішучими діями, і тепер шлях до мирного чи силового захоплення Орєнбурґа відкритий. Знаючи, що доведеться протистояти нам наодинці, комуни мають останній шанс прийняти мирну анексію. Якщо вони воліють загинути, а не піти тихо, ми радо їм допоможемо."
 RUS_race_for_the_urals.40.a: "Просто в наші руки."

 RUS_race_for_the_urals.41.t: "Уральську Лігу кинуто напризволяще!"
 RUS_race_for_the_urals.41.d: "Урал незабаром буде нашим. Розвідники щойно повідомили, що наш суперник вирішив покинути Уральську Лігу напризволяще й не ризикувати військовим зіткненням. Його надія зупинити нашу анексію гарантіями незалежности Ліги розбилася, коли ми не відмовилися від своїх планів. Зрозумівши, що нас не залякати й не змусити скоритися, суперник швидко облишив зухвалу браваду. Він довів, що не готовий підкріпити гучні слова рішучими діями, і тепер шлях до мирного чи силового захоплення Уральської Ліги відкритий. Знаючи, що доведеться протистояти нам наодинці, Уральська гвардія має останній шанс прийняти мирну анексію. Якщо гвардійці прагнуть останнього бою, ми радо їм його дамо."
 RUS_race_for_the_urals.41.a: "Просто в наші руки."

 RUS_race_for_the_urals.42.t: "Маґнітоґорск кинуто напризволяще!"
 RUS_race_for_the_urals.42.d: "Маґнітоґорск незабаром буде нашим. Розвідники щойно повідомили, що наш суперник вирішив покинути Чорну Гору напризволяще й не ризикувати військовим зіткненням. Його надія зупинити нашу анексію гарантіями незалежности Маґнітоґорска розбилася, коли ми не відмовилися від своїх планів. Зрозумівши, що нас не залякати й не змусити скоритися, суперник швидко облишив зухвалу браваду. Він довів, що не готовий підкріпити гучні слова рішучими діями, і тепер шлях до мирного чи силового захоплення гори та навколишніх земель відкритий. Знаючи, що доведеться протистояти нам наодинці, володарі Маґнітоґорска мають останній шанс прийняти мирну анексію. Якщо вони воліють загинути, а не піти тихо, ми радо їм допоможемо."
 RUS_race_for_the_urals.42.a: "Просто в наші руки."

 RUS_race_for_the_urals.43.t: "Орєнбурґ здається!"
 RUS_race_for_the_urals.43.d: "Схоже, на Південному Уралі нарешті переміг здоровий глузд. Покинуті нашим суперником напризволяще Комуни Орєнбурґа прийняли нашу останню пропозицію мирної анексії. Зрозумівши, що їм годі сподіватися вистояти проти нашої набагато могутнішої армії, уряд Орєнбурґа вирішив, що підкорення краще за самогубство. Тепер територію буде анексовано нашою державою, і ми зможемо розпочати інтеграцію. Хай що відчувають багато жителів Орєнбурґа, у цьому рішенні немає безчестя. Уникнувши війни, вони врятували тисячі життів і вберегли Південний Урал від незліченних руйнувань, які принесла б нова війна. Після десятиліть насильства й божевілля до Орєнбурґа нарешті повернеться стабільність."
 RUS_race_for_the_urals.43.a: "Вони зробили мудрий вибір."

 RUS_race_for_the_urals.44.t: "Уральська Ліга здається!"
 RUS_race_for_the_urals.44.d: "Схоже, на Південному Уралі нарешті переміг здоровий глузд. Покинута нашим суперником напризволяще Уральська Ліга прийняла нашу останню пропозицію мирної анексії. Зрозумівши, що їй годі сподіватися вистояти проти нашої набагато могутнішої армії, рада Уральської гвардії вирішила, що підкорення краще за самогубство. Тепер територію буде анексовано нашою державою, і ми зможемо розпочати інтеграцію. Хай що відчувають багато мешканців гір, у цьому рішенні немає безчестя. Уникнувши війни, вони врятували тисячі життів і вберегли Південний Урал від незліченних руйнувань, які принесла б нова війна. Після десятиліть насильства й божевілля до Бєлорєцка нарешті повернеться стабільність."
 RUS_race_for_the_urals.44.a: "Вони зробили мудрий вибір."
 
 RUS_race_for_the_urals.45.t: "Маґнітоґорск здається!"
 RUS_race_for_the_urals.45.d: "Схоже, на Південному Уралі нарешті переміг здоровий глузд. Покинуті нашим суперником напризволяще володарі Маґнітоґорска прийняли нашу останню пропозицію мирної анексії. Зрозумівши, що їм годі сподіватися вистояти проти нашої набагато могутнішої армії, володарі Чорної Гори вирішили, що підкорення краще за самогубство. Тепер територію буде анексовано нашою державою, і ми зможемо розпочати інтеграцію. Хай що відчувають багато жителів Маґнітоґорска, у цьому рішенні немає безчестя. Уникнувши війни, вони врятували тисячі життів і вберегли Південний Урал від незліченних руйнувань, які принесла б нова війна. Після десятиліть насильства й божевілля до Чорної Гори нарешті повернеться стабільність."
 RUS_race_for_the_urals.45.a: "Вони зробили мудрий вибір."

 RUS_race_for_the_urals.46.t: "Орєнбурґ відмовляється здатися!"
 RUS_race_for_the_urals.46.d: "Ми щойно отримали комюніке з Орєнбурґа, у якому відхилено нашу пропозицію мирної інтеграції. Хоч ми цілком ясно дали зрозуміти, що це остання нагода Орєнбурґа погодитися й уникнути збройного конфлікту, він досі відмовляється від усіх наших пропозицій і заявляє, що поневолити його можна лише силою. Навіть покинутий нашим суперником напризволяще народ Орєнбурґа відмовляється слухати голос розуму. Проти нашої чисельної переваги та вогневої міці в нього немає жодних шансів. Можливо, він вважає, що відданости свободі досить, аби нас перемогти. Незабаром ми покажемо, наскільки він помиляється. Коли все скінчиться, ніхто не зможе сказати, що ми не намагалися владнати справу по-доброму. Мабуть, цілком доречно, що для умиротворення регіону, відомого ще більшим насильством і хаосом, ніж решта Росії, знадобиться остання війна."
 RUS_race_for_the_urals.46.a: "Ми навчимо їх відповідати за свої вчинки."

 RUS_race_for_the_urals.47.t: "Уральська Ліга відмовляється здатися!"
 RUS_race_for_the_urals.47.d: "Ми щойно отримали комюніке з Бєлорєцка, у якому відхилено нашу пропозицію мирної інтеграції. Хоч ми цілком ясно дали зрозуміти, що це остання нагода Уральської Ліги погодитися й уникнути збройного конфлікту, вона досі відмовляється від усіх наших пропозицій і заявляє, що без бою не схилиться перед тиранією. Навіть покинуті нашим суперником напризволяще бійці Уральської гвардії відмовляються слухати голос розуму. Проти нашої чисельної переваги та вогневої міці в них немає жодних шансів. Можливо, вони вважають, що підготовки й навичок гірської війни досить, аби нас перемогти. Незабаром ми покажемо, наскільки вони помиляються. Коли все скінчиться, ніхто не зможе сказати, що ми не намагалися владнати справу по-доброму. Мабуть, цілком доречно, що для умиротворення регіону, відомого ще більшим насильством і хаосом, ніж решта Росії, знадобиться остання війна."
 RUS_race_for_the_urals.47.a: "Ми навчимо їх відповідати за свої вчинки."

 RUS_race_for_the_urals.48.t: "Маґнітоґорск відмовляється здатися!"
 RUS_race_for_the_urals.48.d: "Ми щойно отримали комюніке з Маґнітоґорска, у якому відхилено нашу пропозицію мирної інтеграції. Хоч ми цілком ясно дали зрозуміти, що це остання нагода Маґнітоґорска погодитися й уникнути збройного конфлікту, він досі відмовляється від усіх наших пропозицій і заявляє, що зупинити його поступ можна лише силою зброї. Навіть покинуті нашим суперником напризволяще володарі Чорної Гори відмовляються слухати голос розуму. Проти нашої чисельної переваги та вогневої міці в них немає жодних шансів. Можливо, вони вважають, що сучасного спорядження та укріплень досить, аби нас перемогти. Незабаром ми покажемо, наскільки вони помиляються. Коли все скінчиться, ніхто не зможе сказати, що ми не намагалися владнати справу по-доброму. Мабуть, цілком доречно, що для умиротворення регіону, відомого ще більшим насильством і хаосом, ніж решта Росії, знадобиться остання війна."
 RUS_race_for_the_urals.48.a: "Ми навчимо їх відповідати за свої вчинки."

 RUS_race_for_the_urals.49.t: "Протидія інтервенції в Орєнбурзі!"
 RUS_race_for_the_urals.49.d: "Після повного краху всієї державної влади землі навколо Орєнбурґа поринули в цілковиту анархію. Міста, села й віддалені комуни самі дбають про себе, а дієвої влади немає ніде поза місцевим рівнем. Центрального уряду чи провідника, з яким можна було б вести переговори, не існує, тож земля дістанеться тому, хто першим її захопить. Наш суперник розпочав інтервенцію, заявивши, що планує відновити порядок у регіоні. Це неприкрита спроба загарбати землю й різке загострення боротьби за контроль над Південним Уралом. Нестримна агресія у вигляді повномасштабного військового вторгнення змусила наших командирів перейти до найвищої бойової готовности. Вони попереджають: якщо суперник готовий увірватися до Орєнбурґа під приводом відновлення порядку в Росії, то невдовзі буде готовий вчинити так само з нами. Ми мусимо ретельно обміркувати наступні кроки й бути готовими до конфлікту будь-якої миті."
 RUS_race_for_the_urals.49.a: "Також увійти до Орєнбурґа!"
 RUS_race_for_the_urals.49.b: "Лише захоплення непотрібної землі."

 RUS_race_for_the_urals.50.t: "Протидія інтервенції в Орску!"
 RUS_race_for_the_urals.50.d: "Після смерти короля бандитів Оскара Дірлеванґера землі навколо Орска поринули в цілковиту анархію. Міста й села самі дбають про себе, а сільською місцевістю нишпорять бандити, грабуючи та вбиваючи всіх на своєму шляху. Центрального уряду чи провідника, з яким можна було б вести переговори, не існує, тож земля дістанеться тому, хто першим її захопить. Наш суперник розпочав інтервенцію, заявивши, що планує відновити порядок у регіоні. Це неприкрита спроба загарбати землю й різке загострення боротьби за контроль над Південним Уралом. Нестримна агресія у вигляді повномасштабного військового вторгнення змусила наших командирів перейти до найвищої бойової готовности. Вони попереджають: якщо суперник готовий увірватися до Орска під приводом відновлення порядку в Росії, то невдовзі буде готовий вчинити так само з нами. Ми мусимо ретельно обміркувати наступні кроки й бути готовими до конфлікту будь-якої миті."
 RUS_race_for_the_urals.50.a: "Також увійти до Орска!"
 RUS_race_for_the_urals.50.b: "Лише захоплення непотрібної землі."

 RUS_race_for_the_urals.51.t: "Вторгнення на Південний Урал"
 RUS_race_for_the_urals.51.d: "Наш суперник вчинив безпрецедентний акт агресії: відкинув будь-яку дипломатію, розпочав масштабну військову інтервенцію на Південному Уралі й оголосив війну всім місцевим державам. Цей приголомшливий крок поклав край усім надіям мирно вирішити суперечки щодо регіону, і тепер наш уряд та військо поспіхом готують відповідь.\n\nДипломати закликають нас стати на захист місцевих держав і оголосити війну суперникові. Вони стверджують, що ми не можемо дозволити вторгненню тривати без опору й так показати власну слабкість, а порятунок населення Південного Уралу здобуде нам його вічну відданість. Коли війна закінчиться поразкою нашого суперника, це дасть змогу легше переконати місцеві уряди, що інтеграція до нашої держави буде для них кращою.\n\nГенерали погоджуються, що не можна принижувати себе бездіяльністю під час кризи, але не вважають урятування уральських держав гідною метою, нагадуючи про наші власні плани рано чи пізно анексувати регіон. Натомість вони радять відповісти власною інтервенцією. Поки армії Південного Уралу зайняті війною з нашим суперником, ми зможемо безперешкодно ввійти й захопити більшу частину, а можливо, навіть увесь Південний Урал. Це також дасть нам змогу далі готуватися до можливої війни із суперником у майбутньому.\n\nТретій варіянт - не втручатися безпосередньо й продовжити готуватися до війни на власних умовах. Через це суперник може вважати нас слабкими й боягузливими, а ми віддамо йому величезний шматок російської землі практично без опору. Утім, годі заперечувати, що нас застали зненацька й тепер ми мусимо діяти обережно й без нерозважности."
 RUS_race_for_the_urals.51.a: "Цю агресію треба покарати - вдарити просто по них!"
 RUS_race_for_the_urals.51.b: "Мусимо відповісти тим самим - також вторгнутися!"
 RUS_race_for_the_urals.51.c: "Ми не можемо дозволити собі війну - не втручатися!"

 RUS_race_for_the_urals.52.t: "Рух на кордоні"
 RUS_race_for_the_urals.52.d: "Розвідники повідомили про різке зростання військової активности вздовж наших кордонів. З огляду на нинішню боротьбу за вплив на Орєнбурґ і Південний Урал демонстрація сили не дивує, але генерали попереджають, що справа, схоже, набагато серйозніша. Останніми днями до наших кордонів прибувають дедалі нові підрозділи й займають, здавалося б, заздалегідь визначені позиції. Тепер уже майже напевне один із сусідів відкинув дипломатію й готується до вторгнення! Ми мусимо мобілізувати ополчення Орєнбурґа й підготувати народ до війни. Часу обмаль, а нас застали зненацька. Єдина надія - переконати суперника агресора стати на наш захист. Якщо він відгукнеться, нам, можливо, вдасться зберегти бодай частину свободи Орєнбурґа. Сподіваймося, він краще готовий до бою, ніж ми."
 RUS_race_for_the_urals.52.a: "Ми зробимо все, що зможемо."

 RUS_race_for_the_urals.53.t: "Рух на кордоні"
 RUS_race_for_the_urals.53.d: "Вартові повідомили про різке зростання військової активности вздовж наших кордонів. З огляду на нинішню боротьбу за вплив на Уральську Лігу й самі гори демонстрація сили не дивує, але генерали попереджають, що справа, схоже, набагато серйозніша. Останніми днями до наших кордонів прибувають дедалі нові підрозділи й займають, здавалося б, заздалегідь визначені позиції. Тепер уже майже напевне один із сусідів відкинув дипломатію й готується до вторгнення! Ми мусимо мобілізувати Уральську гвардію та ополчення й знову підготуватися до війни. Часу обмаль, а ворог має величезну чисельну перевагу. Єдина надія - переконати суперника агресора стати на наш захист. Якщо він відгукнеться, нам, можливо, вдасться зберегти бодай якусь безпеку для народу Уралу. Сподіваймося, він готовий виступити разом із нами проти паліїв війни."
 RUS_race_for_the_urals.53.a: "Нехай приходять..."

 RUS_race_for_the_urals.54.t: "Рух на кордоні"
 RUS_race_for_the_urals.54.d: "Патрулі повідомили про різке зростання військової активности вздовж наших кордонів. З огляду на нинішню боротьбу за вплив на Маґнітоґорск і Південний Урал демонстрація сили не дивує, але генерали попереджають, що справа, схоже, набагато серйозніша. Останніми днями до наших кордонів прибувають дедалі нові підрозділи й займають, здавалося б, заздалегідь визначені позиції. Тепер уже майже напевне один із сусідів відкинув дипломатію й готується до вторгнення! Ми мусимо мобілізувати полки НКВД й підготувати укріплення. Часу обмаль, а ворог має величезну чисельну перевагу. Єдина надія - переконати суперника агресора стати на наш захист. Якщо він відгукнеться, нам, можливо, вдасться втримати контроль над Чорною Горою. Сподіваймося, він захистить нашу автономію від тих, хто прагне її відібрати."
 RUS_race_for_the_urals.54.a: "Ми стоятимемо непохитно."
 
 RUS_race_for_the_urals.55.t: "Рух на кордоні"
 RUS_race_for_the_urals.55.d: "Останніми днями прикордонні села повідомляють про різке зростання військової активности. З огляду на нинішню боротьбу за вплив на громади Південного Уралу демонстрація сили не дивує, але селяни попереджають, що справа, схоже, набагато серйозніша. Останніми днями до наших кордонів прибувають дедалі нові підрозділи й займають, здавалося б, заздалегідь визначені позиції. Тепер уже майже напевне один із сусідів відкинув дипломатію й готується до вторгнення! Без провідника чи уряду, здатного організувати відповідь, громади регіону будуть покинуті напризволяще. Часу обмаль, і ми не маємо жодної можливости створити організовану оборону. Єдина надія - що суперник агресора може прийти нам на допомогу. Навіть тоді він, імовірно, захопить наші землі собі, але краще бути інтегрованими, ніж завойованими."
 RUS_race_for_the_urals.55.a: "Нехай ці покидьки приходять!"

 RUS_race_for_the_urals.56.t: "Сам на сам"
 RUS_race_for_the_urals.56.d: "Наші дипломати повернулися з похмурими новинами. Попри всі зусилля й численні пропозиції зміцнити дипломатичні зв'язки, вони не змогли переконати могутнього сусіда виступити разом із нами проти його суперника. Він навів кілька виправдань про дипломатичні зобов'язання й недостатню підготовку, але то була лише спроба зберегти обличчя. Насправді він надто боягузливий, щоб стати поряд із нами, й тепер Орєнбурґ мусить самотужки протистояти вторгненню. Ворог набагато переважає наші війська чисельністю та вогневою міццю. Він місяцями готувався до нападу, а ми мали лише кілька днів, щоб зібрати оборону. Багато хто вже проголосив Орєнбурґ приреченим, але не менше людей готові битися до гіркого кінця, захищаючи нашу свободу. Ми мусимо вирішити, що робитимемо."
 RUS_race_for_the_urals.56.a: "В оточенні ворогів..."

 RUS_race_for_the_urals.57.t: "Сам на сам"
 RUS_race_for_the_urals.57.d: "Наші дипломати повернулися з похмурими новинами. Попри всі зусилля й численні пропозиції зміцнити дипломатичні зв'язки, вони не змогли переконати могутнього сусіда виступити разом із нами проти його суперника. Він навів кілька виправдань про дипломатичні зобов'язання й недостатню підготовку, але то була лише спроба зберегти обличчя. Насправді він надто боягузливий, щоб стати поряд із нами, й тепер Уральська Ліга мусить самотужки протистояти вторгненню. Уральська гвардія знову значно поступається ворогові чисельністю та вогневою міццю. Він місяцями готувався до нападу, а ми мали лише кілька днів, щоб зібрати оборону. Багато хто вже проголосив Лігу приреченою, але інші заявляють, що ніколи покірно не схиляться й не приймуть рабства. Ми мусимо вирішити, що робитимемо."
 RUS_race_for_the_urals.57.a: "В оточенні ворогів..."

 RUS_race_for_the_urals.58.t: "Сам на сам"
 RUS_race_for_the_urals.58.d: "Наші дипломати повернулися з похмурими новинами. Попри всі зусилля й численні пропозиції зміцнити дипломатичні зв'язки, вони не змогли переконати могутнього сусіда виступити разом із нами проти його суперника. Він навів кілька виправдань про дипломатичні зобов'язання й недостатню підготовку, але то була лише спроба зберегти обличчя. Насправді він надто боягузливий, щоб стати поряд із нами, й тепер Маґнітоґорск мусить самотужки протистояти вторгненню. Наші сили значно поступаються ворогові чисельністю та не готові до бою. Він місяцями готувався до нападу, а ми мали лише кілька днів, щоб запровадити запасні оборонні плани. Багато хто вже проголосив Чорну Гору приреченою, але інші готові не здаватися й не дозволити, щоб уся наша праця пішла намарне. Ми мусимо вирішити, що робитимемо."
 RUS_race_for_the_urals.58.a: "В оточенні ворогів..."

 RUS_race_for_the_urals.59.t: "Орєнбурґ чинить опір!"
 RUS_race_for_the_urals.59.d: "Жахливі новини! Уряд Орєнбурґа офіційно відхилив нашу пропозицію інтеграції, заявивши, що ніколи не відмовиться від свободи й добровільно не дозволить нашій державі себе анексувати! Попри масштабні дипломатичні операції на Південному Уралі, нам, схоже, не вдалося переконати його добровільно приєднатися до нашої держави. Коли дипломати повідомили, що ми маємо намір возз'єднати всю Росію, включно з Орєнбурґом, будь-якими засобами, які вважатимемо необхідними, його уряд заявив, що вже зв'язався з нашим суперником і попросив захисту від можливого вторгнення. Це образа для нашого уряду й мрії про єдність Росії! Замість того щоб прийняти наші щедрі умови й зробити крок до мирного відновлення Росії, уряд Орєнбурґа вирішив загострити ситуацію до дипломатичної кризи. Лишається сподіватися, що суперник розпізнає спробу втягнути його у війну, якої не хоче жодна сторона."
 RUS_race_for_the_urals.59.a: "Гідно поваги, але марно."

 RUS_race_for_the_urals.60.t: "Уральська Ліга чинить опір!"
 RUS_race_for_the_urals.60.d: "Жахливі новини! Рада Уральської Ліги офіційно відхилила нашу пропозицію інтеграції, заявивши, що ніколи не відмовиться від незалежности й добровільно не дозволить нашій державі себе анексувати! Попри масштабні дипломатичні операції на Південному Уралі, нам, схоже, не вдалося переконати її добровільно приєднатися до нашої держави. Коли дипломати повідомили, що ми маємо намір возз'єднати всю Росію, включно з Уралом, будь-якими засобами, які вважатимемо необхідними, рада заявила, що вже зв'язалася з нашим суперником і попросила захисту від можливого вторгнення. Це образа для нашого уряду й мрії про єдність Росії! Замість того щоб прийняти наші щедрі умови й зробити крок до мирного відновлення Росії, Уральська гвардія вирішила загострити ситуацію до дипломатичної кризи. Лишається сподіватися, що суперник розпізнає спробу втягнути його у війну, якої не хоче жодна сторона."
 RUS_race_for_the_urals.60.a: "Гідно поваги, але марно."

 RUS_race_for_the_urals.61.t: "Маґнітоґорск чинить опір!"
 RUS_race_for_the_urals.61.d: "Жахливі новини! Володарі Маґнітоґорска офіційно відхилили нашу пропозицію інтеграції, заявивши, що ніколи не відмовляться від своєї влади й добровільно не дозволять нашій державі себе анексувати! Попри масштабні дипломатичні операції на Південному Уралі, нам, схоже, не вдалося переконати їх добровільно приєднатися до нашої держави. Коли дипломати повідомили, що ми маємо намір возз'єднати всю Росію, включно з Уралом, будь-якими засобами, які вважатимемо необхідними, вони заявили, що вже зв'язалися з нашим суперником і попросили захисту від можливого вторгнення. Це образа для нашого уряду й мрії про єдність Росії! Замість того щоб прийняти наші щедрі умови й зробити крок до мирного відновлення Росії, володарі Чорної Гори вирішили загострити ситуацію до дипломатичної кризи. Лишається сподіватися, що суперник розпізнає спробу втягнути його у війну, якої не хоче жодна сторона."
 RUS_race_for_the_urals.61.a: "Гідно поваги, але марно."

 RUS_race_for_the_urals.62.t: "Наші благання почуто!"
 RUS_race_for_the_urals.62.d: "Ми щойно отримали чудові новини від дипломатів! Суперник держави, яка намагається нас анексувати, заявив, що не дозволить загрожувати нашій незалежності. Він засудив агресивні й залякувальні вимоги свого супротивника по той бік Уралу та проголосив, що в разі нападу на Орєнбурґ негайно стане на наш захист усією своєю військовою міццю. За підтримки набагато могутнішого сусіда ми більше не є легкою здобиччю, а держава, яка прагне нас поглинути, мусить подумати, чи варто починати повномасштабну війну на всьому заході Росії лише задля анексії одного міста й навколишніх комун.\n\nПоки невідомо, чи закінчилася криза. Держава, яка прагне інтегрувати Орєнбурґ, досі може вирішити загострити ситуацію. Якщо так станеться, нам лишається сподіватися, що новий союзник дотримає слова."
 RUS_race_for_the_urals.62.a: "Порятунок?"

 RUS_race_for_the_urals.63.t: "Наші молитви почуто!"
 RUS_race_for_the_urals.63.d: "Ми щойно отримали чудові новини від дипломатів! Суперник держави, яка намагається нас анексувати, заявив, що не дозволить загрожувати нашій незалежності. Він засудив агресивні й залякувальні вимоги свого супротивника по той бік Уралу та проголосив, що в разі нападу на Уральську Лігу негайно стане на наш захист усією своєю військовою міццю. За підтримки набагато могутнішого сусіда ми більше не є легкою здобиччю, а держава, яка прагне нас поглинути, мусить подумати, чи варто починати повномасштабну війну на всьому заході Росії лише задля анексії кількох гір та їхніх мешканців.\n\nПоки невідомо, чи закінчилася криза. Держава, яка прагне інтегрувати Уральську Лігу, досі може вирішити загострити ситуацію. Якщо так станеться, нам лишається сподіватися, що новий союзник дотримає слова."
 RUS_race_for_the_urals.63.a: "Слава Богу."

 RUS_race_for_the_urals.64.t: "Відповідь на наше прохання"
 RUS_race_for_the_urals.64.d: "Ми щойно отримали чудові новини від дипломатів! Суперник держави, яка намагається нас анексувати, заявив, що не дозволить загрожувати нашій незалежності. Він засудив агресивні й залякувальні вимоги свого супротивника по той бік Уралу та проголосив, що в разі нападу на Маґнітоґорск негайно стане на наш захист усією своєю військовою міццю. За підтримки набагато могутнішого сусіда ми більше не є легкою здобиччю, а держава, яка прагне нас поглинути, мусить подумати, чи варто починати повномасштабну війну на всьому заході Росії лише задля анексії однієї гори та навколишньої території.\n\nПоки невідомо, чи закінчилася криза. Держава, яка прагне інтегрувати Чорну Гору, досі може вирішити загострити ситуацію. Якщо так станеться, нам лишається сподіватися, що новий союзник дотримає слова."
 RUS_race_for_the_urals.64.a: "Чудово."
 
 RUS_race_for_the_urals.65.t: "Запропоновано перемир'я!"
 RUS_race_for_the_urals.65.d: "Наш суперник надіслав дипломатичне комюніке з пропозицією укласти перемир'я й закінчити війну за долю Південного Уралу. Держави, які колись правили регіоном, були завойовані й поглинуті під час боїв, а з продовженням війни стає зрозуміло, що держава на захід від Уралу здобуває перевагу. Запропоноване перемир'я зупинить бойові дії на невизначений час і, принаймні поки що, передасть західній державі кілька спірних територій. До них увійде весь спірний регіон Південного Уралу, а також край Воркути на далекій півночі, який лежить на захід від Уральських гір, хоча де-юре перебуває під контролем східної держави.\n\nПеремир'я дасть обом нашим державам можливість оговтатися й зализати рани. Західна держава матиме час інтегрувати нові території, але може втратити нинішній запал. Східна держава поступиться контролем над кількома важливими регіонами, але може виграти достатньо часу, щоб відновити сили й згодом повернути їх. Ми мусимо вирішити, чи прийняти ці умови, чи продовжувати бій до повної перемоги або поразки."
 RUS_race_for_the_urals.65.a: "Прийнятно."
 RUS_race_for_the_urals.65.b: "Це безглуздя!"

 RUS_race_for_the_urals.66.t: "Запропоновано перемир'я!"
 RUS_race_for_the_urals.66.d: "Наш суперник надіслав дипломатичне комюніке з пропозицією укласти перемир'я й закінчити війну за долю Південного Уралу. Держави, які колись правили регіоном, були завойовані й поглинуті під час боїв, а з продовженням війни стає зрозуміло, що держава на схід від Уралу здобуває перевагу. Запропоноване перемир'я зупинить бойові дії на невизначений час і, принаймні поки що, передасть східній державі весь Південний Урал.\n\nПеремир'я дасть обом нашим державам можливість оговтатися й зализати рани. Східна держава матиме час інтегрувати нові території, але може втратити нинішній запал. Західна держава поступиться контролем над територією, за яку почала війну, але може виграти достатньо часу, щоб відновити сили й згодом повернути її. Ми мусимо вирішити, чи прийняти ці умови, чи продовжувати бій до повної перемоги або поразки."
 RUS_race_for_the_urals.66.a: "Прийнятно."
 RUS_race_for_the_urals.66.b: "Це безглуздя!"

 RUS_race_for_the_urals.67.t: "Запропоновано перемир'я!"
 RUS_race_for_the_urals.67.d: "Наш суперник надіслав дипломатичне комюніке з пропозицією укласти перемир'я й закінчити війну за долю Південного Уралу. Держави, які колись правили регіоном, були завойовані й поглинуті під час боїв. Війна триває, втрати невпинно зростають, але жодна сторона так і не змогла здобути перевагу. Запропоноване перемир'я зупинить бойові дії на невизначений час і рівно поділить Південний Урал між сходом і заходом.\n\nПеремир'я дасть обом нашим державам можливість оговтатися й зализати рани. Обидві матимуть змогу інтегрувати нові території й підготуватися до відновлення бойових дій, але припинення війни зараз може позбавити будь-яку зі сторін ініціятиви в майбутньому. Ми мусимо вирішити, чи прийняти ці умови, чи продовжувати бій до повної перемоги або поразки."
 RUS_race_for_the_urals.67.a: "Прийнятно."
 RUS_race_for_the_urals.67.b: "Це безглуздя!"

 RUS_race_for_the_urals.68.t: "Наш план перемир'я прийнято!"
 RUS_race_for_the_urals.68.d: "Ми щойно отримали відповідь на пропозицію перемир'я, і суперник прийняв наші умови! Воркута й Південний Урал відійдуть західній державі, а всі бойові дії між нашими країнами поки припиняться. Мир буде вкрай непевним і може зруйнуватися будь-якої миті, але принаймні дасть нам змогу перевести подих і підготуватися до відновлення бойових дій. Якщо якимось дивом він устоїть, ми навіть зможемо повернутися до мирних переговорів про возз'єднання, але то справа іншого дня. Зараз важливо лише те, що країна, охоплена війною впродовж десятиліть, отримає ще кілька дорогоцінних митей миру. Навряд чи вони триватимуть довго. Тепер, коли західна держава відчула смак перемоги, невідомо, скільки вона чекатиме, перш ніж захоче скуштувати його знову."
 RUS_race_for_the_urals.68.a: "Нарешті мир."

 RUS_race_for_the_urals.69.t: "Наш план перемир'я прийнято!"
 RUS_race_for_the_urals.69.d: "Ми щойно отримали відповідь на пропозицію перемир'я, і суперник прийняв наші умови! Південний Урал відійде східній державі, а всі бойові дії між нашими країнами поки припиняться. Мир буде вкрай непевним і може зруйнуватися будь-якої миті, але принаймні дасть нам змогу перевести подих і підготуватися до відновлення бойових дій. Якщо якимось дивом він устоїть, ми навіть зможемо повернутися до мирних переговорів про возз'єднання, але то справа іншого дня. Зараз важливо лише те, що країна, охоплена війною впродовж десятиліть, отримає ще кілька дорогоцінних митей миру. Навряд чи вони триватимуть довго. Тепер, коли східна держава відчула смак перемоги, невідомо, скільки вона чекатиме, перш ніж захоче скуштувати його знову."
 RUS_race_for_the_urals.69.a: "Нарешті мир."

 RUS_race_for_the_urals.70.t: "Наш план перемир'я прийнято!"
 RUS_race_for_the_urals.70.d: "Ми щойно отримали відповідь на пропозицію перемир'я, і суперник прийняв наші умови! Південний Урал буде порівну поділено, а всі бойові дії між нашими країнами поки припиняться. Мир буде вкрай непевним і може зруйнуватися будь-якої миті, але принаймні дасть нам змогу перевести подих і підготуватися до відновлення бойових дій. Якщо якимось дивом він устоїть, ми навіть зможемо повернутися до мирних переговорів про возз'єднання, але то справа іншого дня. Зараз важливо лише те, що країна, охоплена війною впродовж десятиліть, отримає ще кілька дорогоцінних митей миру. Навряд чи вони триватимуть довго. Оскільки жодна держава не досягла всіх своїх цілей, одна з них, а можливо, й обидві, імовірно, рано чи пізно спробують здобути повнішу перемогу."
 RUS_race_for_the_urals.70.a: "Нарешті мир."

 RUS_race_for_the_urals.71.t: "Наш план перемир'я відхилено!"
 RUS_race_for_the_urals.71.d: "Ми щойно отримали відповідь на пропозицію перемир'я, і суперник відхилив наші умови! Він заявляє, що запропоновані нами поступки на користь західної держави жахливо несправедливі й упереджені на нашу користь, а доки ми не почнемо вести переговори добросовісно, про жодні домовленості не може бути й мови. Суперник знову підтвердив намір повністю возз'єднати Росію на власних умовах і будь-якими необхідними засобами. Оскільки продовжувати переговори неможливо, будь-яка надія на перемир'я, схоже, втрачена. Єдиний вихід - тотальна війна за повний контроль над усією Західною Росією. Миру між нашими державами не буде, доки існують обидві. Боротьба за Південний Урал перетворилася на безкомпромісний бій за виживання, який визначить майбутнє Росії на десятиліття вперед. Ми мусимо перемогти."
 RUS_race_for_the_urals.71.a: "Самі палії війни."

 RUS_race_for_the_urals.72.t: "Наш план перемир'я відхилено!"
 RUS_race_for_the_urals.72.d: "Ми щойно отримали відповідь на пропозицію перемир'я, і суперник відхилив наші умови! Він заявляє, що запропоновані нами поступки на користь східної держави жахливо несправедливі й упереджені на нашу користь, а доки ми не почнемо вести переговори добросовісно, про жодні домовленості не може бути й мови. Суперник знову підтвердив намір повністю возз'єднати Росію на власних умовах і будь-якими необхідними засобами. Оскільки продовжувати переговори неможливо, будь-яка надія на перемир'я, схоже, втрачена. Єдиний вихід - тотальна війна за повний контроль над усією Західною Росією. Миру між нашими державами не буде, доки існують обидві. Боротьба за Південний Урал перетворилася на безкомпромісний бій за виживання, який визначить майбутнє Росії на десятиліття вперед. Ми мусимо перемогти."
 RUS_race_for_the_urals.72.a: "Самі палії війни."

 RUS_race_for_the_urals.73.t: "Наш план перемир'я відхилено!"
 RUS_race_for_the_urals.73.d: "Ми щойно отримали відповідь на пропозицію перемир'я, і суперник відхилив наші умови! Він заявляє, що наша пропозиція порівну поділити Південний Урал жахливо несправедлива й упереджена на нашу користь, а доки ми не почнемо вести переговори добросовісно, про жодні домовленості не може бути й мови. Суперник знову підтвердив намір повністю возз'єднати Росію на власних умовах і будь-якими необхідними засобами. Оскільки продовжувати переговори неможливо, будь-яка надія на перемир'я, схоже, втрачена. Єдиний вихід - тотальна війна за повний контроль над усією Західною Росією. Миру між нашими державами не буде, доки існують обидві. Боротьба за Південний Урал перетворилася на безкомпромісний бій за виживання, який визначить майбутнє Росії на десятиліття вперед. Ми мусимо перемогти."
 RUS_race_for_the_urals.73.a: "Самі палії війни."

 RUS_race_for_the_urals.100.t: "Вимога інтеграції"
 RUS_race_for_the_urals.100.d: "Що ви, чорт забирай, робите на Південному Уралі в 1970-х? Не треба так із собою. Ваш контент скінчився п'ять років тому, можете вже піти й зіграти в щось краще."
 RUS_race_for_the_urals.100.a: "Скоритися"
 RUS_race_for_the_urals.100.b: "Померти"
 
