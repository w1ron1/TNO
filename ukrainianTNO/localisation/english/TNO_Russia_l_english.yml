 regional_development_decision_category: "Регіональний розвиток"
 regional_development_decision_category_desc: "\n\n\n\n\n\nПісля возз'єднання нашого регіону Росії ми контролюємо величезні землі з мільйонами людей і маємо у своєму розпорядженні справді грізну силу. Проте досягнутий поступ - не кінець. Наша інфраструктура досі неповна, народ живе в злиднях, а ми багато в чому відстаємо від Райху. Щоб перетворити свою державу на справді гідну поваги силу, ми мусимо розпочати амбітну програму розвитку й поступу, інакше суперники переграють нас і зруйнують наші прагнення возз'єднати Батьківщину."

