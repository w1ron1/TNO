 # Far East Naval #
 far_east_naval_category: "[GetNavalDeccatName]"
 far_east_naval_category_desc: "\n\n\n\n\n\nПісля розпаду країни, що настав за Другою світовою війною, Червоний флот і його кораблі здебільшого було знищено, затоплено або кинуто іржавіти й перетворюватися на брухт. Коли в п'ятдесятих Сибір охопила анархія, останні рештки Тихоокеанського флоту або загинули, або вдалися до піратства поблизу Камчатки. Тепер, коли порядок нарешті відновлено, ми маємо засоби відбудувати свій флот.\n\nСвіт дивиться на Росію, наче на затонулий лінкор: колись могутній корабель, кинутий гнити й занепадати на дні океану. За наших обставин флот, можливо, не найпрактичніша інвестиція, проте вихід кораблів у море допоможе захистити торгівлю. Крім того, це покаже світові, що ми піднялися з глибин, у які нас скинули, і знову здатні захистити себе на землі, у повітрі й на просторах Тихого океану."
 RUS_FEN_recover_schematics: "Відновити креслення совєцької доби"
 RUS_FEN_recover_schematics_desc: "Через анархію ми втратили мистецтво передового кораблебудування. На щастя, маючи під контролем адміністративні установи Іркутска та порти Маґадана й Камчатки, ми зможемо почати будувати кораблі тих типів, які СССР використовував під час Другої світової війни."
 RUS_FEN_fleet_modernization: "Розпочати модернізацію флоту"
 RUS_FEN_fleet_modernization_Desc: "Закріпившись на Тихому океані й володіючи базовими кораблебудівними спроможностями, ми зможемо розпочати програму модернізації, яка допоможе наздогнати суперників."
 RUS_FEN_heavy_ship_program: "Програма важких кораблів"
 RUS_FEN_heavy_ship_program_desc: "Багатства Сибіру живитимуть наше прагнення повернути собі моря, тож тепер ми можемо розпочати виробництво важких кораблів. Справді, спуск на воду порівняно сучасного флагмана доведе світові, як далеко просунулася Росія у відновленні після анархії!"
 RUS_FEN_naval_program: "Програма переозброєння флоту"
 RUS_FEN_naval_program_Desc: "Відновлення нашої сили як морської держави вимагатиме тяжкої праці. Та хай там як, ми можемо спрямувати додаткові ресурси на програму морського машинобудування, щоб прискорити будівництво кораблів."
 RUS_FEN_state_fishing_fleet: "Створити державний риболовецький флот"
 RUS_FEN_state_fishing_fleet_desc: "Переобладнавши частину нашого флоту постачання на великі транспортні судна, ми зможемо закріпитися в Беринговому й Охотському морях. Це не лише допоможе прогодувати наших людей, а й доповнить сільськогосподарський сектор, якому важко розвиватися серед суворих краєвидів російського Далекого Сходу."
 RUS_FEN_state_fishing_fleets: "Розширити державний риболовецький флот"
 RUS_FEN_state_fishing_fleets_desc: "Переобладнавши для цивільного використання ще більше суден постачання, ми зможемо зберігати вагому присутність у заявленій морській економічній зоні."
 RUS_FEN_state_fishing_armada: "Державна риболовецька армада"
 RUS_FEN_state_fishing_armada_desc: "Подальше розширення флоту дасть змогу наростити вилов риби до межі сталості."
 RUS_FEN_sell_10_convoys: "Переобладнати й продати 10 конвоїв"
 RUS_FEN_sell_10_convoys_desc: "Переобладнавши частину суден постачання для цивільного використання й продавши їх транспортним компаніям, які працюють у Тихоокеанському регіоні, ми зможемо додатково заробити на фінансування інших державних програм."
 RUS_FEN_sell_100_convoys: "Переобладнати й продати 100 конвоїв"
 RUS_FEN_sell_100_convoys_desc: "Переобладнавши для цивільного використання багато суден постачання й продавши їх транспортним компаніям, які працюють у Тихоокеанському регіоні, ми зможемо додатково заробити на фінансування інших державних програм."

 RUS_FEN_state_fishing_fleet_1: "Державний риболовецький флот"
 RUS_FEN_state_fishing_fleet_1_desc: "Наш новостворений комерційний риболовецький флот уже працює. Це небагато, але принаймні він може постачати досить харчів, щоб доповнити наше вбоге сибірське сільське господарство морепродуктами з Охотського моря."
 RUS_FEN_state_fishing_fleet_2: "Державні риболовецькі флоти"
 RUS_FEN_state_fishing_fleet_2_desc: "Наші комерційні риболовецькі флоти зросли й стали продуктивнішими, завдяки чому ми можемо краще годувати людей і підтримувати свою морську економічну зону в північній частині Тихого океану."
 RUS_FEN_state_fishing_fleet_3: "Державна риболовецька армада"
 RUS_FEN_state_fishing_fleet_3_desc: "За продуктивністю наші промислові риболовецькі флоти можуть посперечатися навіть із японськими й американськими флотами, що діють у північній частині Тихого океану. За такого вилову морепродуктів ніхто в Сибіру не залишиться голодним."


 # Far East Sakha #
 far_east_sakha_category: "Експедиція до Сахи"
 far_east_sakha_category_desc: "\n\n\n\n\n\nПопри негостинність, північні райони Сибіру приховують величезні обсяги досі не освоєних ресурсів, передусім корисних копалин. Совєцькі геологи сподівалися видобути ці багатства, а для втілення задуму в межах Сибірського плану сюди спрямували численну робочу силу. Початок Другої світової війни зупинив проєкт, від якого лишився самий кістяк. Тепер, коли наш законний російський уряд відновив порядок у регіоні, ми можемо продовжити програму й розвинути залишену нам основу.\n\nЦе буде довге й важке завдання, але в разі успіху величезні багатства та стратегічна інфраструктура, здобуті завдяки проєкту, матимуть вирішальне значення для об'єднання Росії."
 RUS_Sakha_Begin_Expedition: "Розпочати експедицію до Сахи"
 RUS_Sakha_Begin_Expedition_desc: "Першим кроком стане приведення до прийнятного стану доріг і залізничних сполучень, збудованих у тридцятих роках. Для цього ми відрядимо в регіон військових інженерів, які виконають найважчу роботу, щоб наші цивільні фахівці могли безпечно пересуватися й працювати на місці."
 RUS_Sakha_Begin_Drilling: "Розпочати буріння"
 RUS_Sakha_Begin_Drilling_desc: "Коли базова інфраструктура знову працює, ми можемо почати пошуки скупчень руди. Хоч у нас досі є старі совєцькі мапи й інфраструктура, геологи очікують повільного поступу та спершу мізерних результатів, доки ми не знайдемо більші запаси корисних копалин і не створимо довкола них сучасну гірничу інфраструктуру."
 RUS_Sakha_Extend_Roads: "Розширити мережу доріг"
 RUS_Sakha_Extend_Roads_desc: "Щоб дістатися до інших потенційно прибуткових скупчень руди, нам доведеться розширити мережу доріг у регіоні Саха. Цього разу для просування вглиб регіону треба буде залучити звичайну робочу силу та важке обладнання."
 RUS_Sakha_Mir_Excavation: "Розробка родовища «Мір»"
 RUS_Sakha_Mir_Excavation_desc: "Схоже, песимістичніші геологи мали рацію: наразі в межах нашої досяжності знайдено мало корисних копалин. Значна частина цінних руд залягає так далеко на півночі й у настільки негостинних умовах, що будь-який видобуток там неможливий. Проте ми знайшли ділянки, де можна видобувати придатні для промисловости §Dдіяманти§! в обсягах, достатніх для певної прибутковости. Якщо доправити більше обладнання, копальня в Мірному має запрацювати на повну протягом пів року."
 RUS_Udachnaya_Excavation: "Розробка родовища «Удачная»"
 RUS_Udachnaya_Excavation_desc: "Хоч із нинішнім обладнанням буде важко отримати прибуток, відкриття ще однієї §Dкімберлітової трубки§! за Полярним колом переконливо доводить, що це принаймні варта уваги довгострокова інвестиція. Закріпившись у цьому районі, ми розпочнемо тривалий процес перетворення цих родовищ на повноцінні кар'єри для великомасштабного видобутку. Для цього значні державні кошти буде вкладено в поліпшення старих совєцьких залізниць регіону, що спростить перевезення вантажів до нових промислових центрів і з них.\nОтже, експедицію до Сахи можна вважати дорогою, але все-таки успішною справою, яка окупиться в довгостроковій перспективі."
 RUS_Fortify_Tura: "Укріпити Туру"
 RUS_Fortify_Tura_desc: "З огляду на можливість конфлікту із західним сусідом ми мусимо зберігати пильність і готуватися до найгіршого. Через наше невигідне географічне становище існує високий ризик того, що потенційний ворог прорве північний фланг, захопить стратегічні копальні й завдасть нищівного удару економіці.\n\nЩоб усунути цю вразливість, наші генерали запропонували перетворити невелике містечко Тура на стратегічне укріплення загальнодержавного значення, а його мешканців переселити далі на схід. Так ми здобудемо міцну оборонну позицію поблизу кордону, яка стане чудовим рубежем захисту, якщо війна на заході застане нас зненацька."
 RUS_mining_tt_1: "§G+0.025 інших доходів§!"
 RUS_mining_tt_2: "§G+0.075 інших доходів§!"
 RUS_mining_tt_3: "§G+0.1 інших доходів§!"
 RUS_Far_East_Mining: "Доходи від видобутку"
 RUS_Far_East_Mining_desc: "Наша гірнича промисловість розробляє мінеральні ресурси Якутії та Камчатки, що залишалися недоторканими від розпаду Совєцького Союзу. Видобуті там золото й діяманти забезпечують нам непоганий дохід, яким можна поповнити державну скарбницю."

 # Centsib Norilsk #
 centsib_norilsk_category: "Відродження Норільска"
 centsib_norilsk_category_desc: "\n\n\n\n\n\nВіддалені райони на півночі Центрального Сибіру було кинуто напризволяще під час анархії, що настала після краху центральної влади регіону та сповзання до панування воєначальників унаслідок Сибірських війн. Не лишилося жодного дієздатного органу з ресурсами для утримання старих совєцьких об'єктів, тож багатства Норільска десять років лежали без ужитку, недосяжні для всіх російських воєначальників, які претендували на ці землі.\n\nТепер, коли до регіону повернулася певна стабільність, новий уряд узявся повернути його й відновити колишній економічний потенціял. У разі успіху багатства Норільска значно допоможуть нам об'єднати й відбудувати Росію."
 RUS_Norilsk_Reconnect_Roads: "Відновити дорожнє сполучення"
 RUS_Norilsk_Reconnect_Roads_desc: "Територія довкола покладів корисних копалин лежить у руїнах. Десятиліття занедбання геть знищило дороги, а більшість об'єктів, до яких вони вели, у найкращому разі покинуті, а в найгіршому - повністю зруйновані. Перш ніж доправляти обладнання для їх повноцінного відновлення, ми плануємо вислати військових інженерів, щоб знову привести основні дороги до робочого стану."
 RUS_Norilsk_Restore_Infrastructure: "Відновити совєцьку інфраструктуру"
 RUS_Norilsk_Restore_Infrastructure_desc: "Перший етап нашої експедиції до Норільска завершено, тож тепер можна доправити важке будівельне обладнання й повернути стару совєцьку гірничу інфраструктуру до робочого стану."
 RUS_Norilsk_Rebuild_Rail_Links: "З'єднати Норільск із Єнісєєм"
 RUS_Norilsk_Rebuild_Rail_Links_desc: "Перевезення матеріялів із Норільска до наших промислових і торговельних центрів на півдні було складним завданням. Вічна мерзлота, м'яко кажучи, ускладнює прокладання автомобільних і залізних доріг, але є інший шлях. Якщо наші люди повернуть Дудінку й відновлять сполучення зі старою совєцькою залізницею, спорудженою в тридцятих роках за Сибірським планом, ми знову зможемо перевозити товари Єнісєєм до придатніших для життя місць нижче за течією."
 RUS_Norilsk_Rebuild_Rail_Links_tt: "§GВідкриває додаткові рішення з розвитку§!."
 RUS_Norilsk_Expand_Mining_Operations: "Розширити гірничі роботи"
 RUS_Norilsk_Expand_Mining_Operations_desc: "Ми вкладемо кошти в розширення копалень і поліпшення обладнання, яким користуються наші робітники."
 RUS_Norilsk_Expand_Petroleum_Excavation: "Розширити видобуток нафти"
 RUS_Norilsk_Modernized_Fright_Train_Network: "Модернізована мережа вантажних залізниць"
 RUS_Norilsk_Modernized_Fright_Train_Network_desc: "Нині ми переважно покладаємося на старі совєцькі залізниці та колії початку XX століття. Модернізація сполучень між Норільском і Дудінкою, а також Лєсосибірском на півдні, значно поліпшить наше становище."
 RUS_Norilsk_Modernized_Fright_Train_Network_tt: "§GВідкриває останнє рішення з видобутку ресурсів§!."
 RUS_Norilsk_Expand_Resource_Fields: "З'єднати й розширити родовища"
 RUS_Norilsk_Expand_Resource_Fields_desc: "Поліпшивши наскільки це можливо сухопутне сполучення між нашою столицею та Норільском, ми можемо востаннє докласти зусиль до посилення експлуатації ресурсів північних регіонів."
 RUS_Norilsk_Summer_Ports: "Інвестувати в літні порти"
 RUS_Norilsk_Establish_Power: "Створити надійне енергопостачання"
 RUS_Norilsk_Fortify_Sibgrad: "Укріпити Сибґрад"
 RUS_Norilsk_Fortify_Sibgrad_desc: "Запланований як гірниче місто на підставі хибних геологічних досліджень у тридцятих роках, Сибґрад відтоді стоїть майже цілковито покинутим, а від нього лишилися самі фундаменти. З огляду на можливість конфлікту зі східним сусідом було б безвідповідально залишити наш північний фронт без захисту. Завдяки стратегічному розташуванню перетворення Сибґрада на повноцінний військовий об'єкт розв'яже проблему складної оборони північного фронту в разі війни."


#Poor warlord militaries
 RUS_monthly_payment: "Щомісячна відкладена виплата"
 RUS_monthly_payment_desc:"Минулого місяця ми додатково заборгували своїм солдатам [?monthly_deferred_payments|3] млрд $."
 RUS_Worsening_moral: "Погіршення бойового духу"
 RUS_Worsening_moral_desc: "Ми якось спромоглися стабілізувати фінанси, та це рішення не надто популярне. Якщо виконаємо свою частину угоди й зуміємо достатньо збагатитися, усе буде гаразд. Але якщо нам знадобиться понад два роки, щоб повернути борг, можливо, доведеться піти на додаткові поступки й навіть зіткнутися із заколотом."
 RUS_Worsening_moral_2: "Занепад дисципліни"
 RUS_Worsening_moral_2_desc: "Наші солдати дедалі більше невдоволені нав'язаною системою виплат векселями. Ми можемо лише друкувати ще більше папірців, щоб тимчасово від них відкупитися обіцянками ще більшої винагороди в майбутньому, хоча це, звісно, посилює інфляційний тиск."
 
 RUS_Poor_warlord_try: "Система відкладених виплат"
 RUS_Poor_warlord_try_desc: "Запроваджена нами система відкладених виплат дає нашим солдатам право на вищу платню.\n\nНатомість частину їхньої платні буде утримано, доки наше становище не поліпшиться. Нині ми заборгували [?deferred_military_cost_million] млн $ платні."

