 ### Wandering Dog chain - West Russia ###
 RUS.8.t: "Відірвана від родини"
 RUS.8.desc: "Сидячи біля руїн хатини, Саша силкувалася почути своїх супутників. Вона втратила вухо від уламка бомби, яка знищила будівлю, і тепер одним вухом насилу визначала, звідки долинають звуки.\n\nНалякана й самотня, вона понад усе хотіла знову почути сміх і жарти, що так часто лунали в хатині та біля вогнища. Цей сміх завжди зустрічав її після довгого дня полювання та вистежування, коли мисливці хвалили Сашу за те, як вправно вона провела їх крізь густі хащі.\n\nСаша чекала весь день, упевнена, що мисливці повернуться, що вони мусять повернутися. Вона завжди була їм вірна й не могла уявити, що вони не відплатять їй тим самим. Настав вечір, а вона лишилася, згорнувшись клубком, щоб зігрітися. Впала ніч, а Саша все чекала й дивилася на цікаві очі численних хижаків, які спостерігали за нею з узлісся.\n\nУранці другого дня разом із голодом прийшло розуміння: друзі не повернуться. Більше не було причин лишатися, та й треба було полювати. Але Саша не забула друзів і знала, що де б вони не були, вони теж не могли її забути.\n\nСаша мусила їх знайти. Вона підвелася на чотири лапи й рушила до узлісся."
 RUS.8.a: "Один день із собачого життя."

 RUS.9.t: "Сільськими краями"
 RUS.9.desc: "Як і тисячі разів до цього, Владімір запалив цигарку, затис її в губах і вдихнув. На мить настало полегшення, але криво скручена, безперечно перевтомленим і недосвідченим фабричним робітником, цигарка розсипалася між пальцями.\n\nЛаючись, він затоптав жаринки й здригнувся. До Ордену його прийняли лише місяць тому, і він ще не звик до холоду світанкових патрулів.\n\nПочувши позаду тріск гілки, Владімір різко обернувся й скинув гвинтівку. Замість людини він здивовано побачив одновухого пса, що схилив голову набік і дивився на нього. Нервово засміявшись, чоловік знову закинув зброю на плече й ступив уперед.\n\n«Привіт, - почав він, - ти наче заблукав. Заблукав?» Пес не видав ані звуку й не відступив, коли Владімір став навколішки й погладив його несподівано грубу шерсть, на мить відчувши найрідкісніше в Росії почуття: спокій.\n\nНевдовзі пес заскиглив і відійшов, а Владімір дивився йому вслід, доки той не зник за обрієм. Чоловік сів на пеньок, запалив ще одну цигарку, цього разу міцніше тримаючи її, та зітхнув.\n\nМожливо, подумав він, певною мірою всі в Росії були псами. Як цей пес утратив вухо, так кожен росіянин - нападник, цивільний, робітник, вартовий чи хтось інший - утратив щось своє. Росія була негостинною землею. Більшості людей вона пропонувала лише злигодні.\n\nТа, можливо, колись вони, як і цей пес, знайдуть просту доброту в ближньому. Докуривши, Владімір сидів і дивився, як перед ним сходить сонце."
 RUS.9.a: "Буде й на нашій вулиці свято."

 RUS.10.t: "Нові друзі"
 RUS.10.desc: "Саша й далі шукала старих друзів і пробиралася лісом. Одним уцілілим вухом вона погано чула, а труднощі були такі сильні, що їй досі не вдалося вполювати жодної здобичі. Голод наростав.\n\nШукаючи безпечне місце для короткого перепочинку, Саша сховалася під гілками сосни. Лише там вона зрозуміла, що не сама: навпроти двоє чоловіків присіли над оленячим слідом.\n\n«Так ми нічого не вполюємо, сам знаєш», - почувся глибокий голос старшого.\n\n«Замовкни! - відповів молодший. - Я ж казав, я не слідопит. Я фер...» Він урвався, краєм ока помітивши Сашу, й різко підвівся.\n\nВона зустрілася з ним поглядом і не побачила злоби. За довгу мить молодик дістав із кишені кілька смужок в'яленого м'яса й кинув перед нею. Голодна Саша вже рушила до їжі, але роки суворої підготовки зупинили її.\n\n«Поглянь, Павле! - вигукнув старший. - Дресирований пес!» Він засміявся й підійшов, а цей звук нагадав Саші кращі часи. Погладивши її шию, чоловік спрямував пса до сліду, підняв м'ясо й дав їй. Саша швидко з'їла гостинець і відразу зрозуміла, що робити: принюхалася до оленячого сліду й поглянула в напрямку запаху.\n\n«Бачиш, Павле! Слідопит. Веди!»\n\nПочувши наказ, Саша помчала в ліс, а люди побігли за нею. Старих друзів вона ще не знайшла, зате зустріла нових.\n\nІ цього вистачило, щоб вона знову була щаслива."
 RUS.10.a: "Усі пси потрапляють до раю."

 RUS.11.t: "Собаче життя"
 RUS.11.desc: "Коли Сєрґєй дивився крізь приціл гвинтівки, його відволікло бурчання в животі. Він не їв уже три дні й був у відчаї.\n\nЧоловік намагався полювати на кролів, але кепсько стріляв. А щоб замахнутися на щось більше й потенційно небезпечніше, йому бракувало сміливости.\n\nРоздратовано опустивши гвинтівку, Сєрґєй почув збоку шум і обернувся. Там стояв одновухий пес і допитливо на нього дивився. Швидко оговтавшись від подиву й усвідомивши нагоду, чоловік дуже повільно підвівся та почав наближатися.\n\nЗ кожним кроком дуло гвинтівки ставало ближчим до тварини, але вже після другого Сєрґєй зрозумів помилку. Пес добре знав, що означає зброя, і щойно їхні очі зустрілися, розвернувся та побіг.\n\nВилаявшись, Сєрґєй опустився на коліно й вистрілив, поціливши псові в задню лапу. Підбігши, він побачив, що тварина жива, але вже не може рухатися. Пес скиглив, а чоловік знав, що мусить зробити: підняв гвинтівку й вистрілив удруге. Потім став навколішки, витяг ніж і заходився білувати тушу.\n\nВін не знав, як пес тут опинився і що вигнало явно дресировану тварину в глушину, та й, правду кажучи, йому було байдуже.\n\nХоч би ким пес був раніше, тепер він став їжею."
 RUS.11.a: "У цьому світі пес пожирає пса."

 ### The Modern Bogatyr ###
 RUS.12.t: "Сучасний Богатир"
 RUS.12.desc: "З-поміж усіх переказів російської анархії лише один поширився від крижаного Далекого Сходу до західної Костроми й навіть углиб нацистської імперії. Це історія мандрівника з невідомих країв, який несе справедливість спустошеними шляхами старої Росії. Він став однією з найбільших загадок цілої країни.\n\nПро нього майже нічого не відомо. Дехто називає його колишнім рейнджером Уральської гвардії, який залишив дім, щоб нести справедливість у найгірші закутки Росії. Інші розповідають про колишнього солдата Вермахту, якого пожирає провина й який прирік себе на вигнання заради покути перед скривдженими. Є й поодинокі звістки про вдову зі знищеного села, яка прагне дати іншим справедливість, відмовлену їй самій. На Сході шепочуть про американського добровольця Західноросійської війни, що застряг у чужій землі, але чинить добро на своєму шляху. А в барах сибірських міст завжди можна почути дивні, певно народжені наркотиками, байки про людину з майбутнього, яка повернулася врятувати світ.\n\nХто б він не був і що б не шукав серед трупа Совєцького Союзу, напевне відома лише його доброта до народу, звиклого до насильства й смерти. Кажуть, мандрівник самотужки стримував цілі банди нападників; визволені раби Пермі оповідають про янгола світла, який скинув їхні кайдани й розчинився в ночі; навіть із Москова доходять чутки про самотні напади на нацистські твердині.\n\nБезперечно, багато цих подвигів вигадані, але дії героя, цього сучасного Богатиря, запалили вогонь надії навіть у серцях найпригнобленіших людей Росії."
 RUS.12.a: "Щонайменше цікава оповідь."

 RUS.13.t: "Таємнича зустріч"
 RUS.13.desc: "Васілій сидів на вартовому посту, притиснувши до плеча гвинтівку. Він вдивлявся в пустку, що відділяла Фронт від земель під владою Воркутинського ГУЛАГу. Останній тиждень він провів на кордоні в одному з кількох невеликих полків, які охороняли фланги Фронту. За кілька годин мала прибути зміна.\n\nЗнову поглянувши на арктичні простори, він невиразно розгледів щось удалині. Сіра цятка рухалася тундрою. Васілій підніс бінокль і зосередився на цілі. То була людина в якійсь старій уніформі. Незнайомець добре вдягнувся для такої погоди: важка куртка, рукавиці та інше зимове спорядження. Обличчя закривала балаклава, а на голові був незнайомий Васілію шолом. На грудях чоловіка висіла доглянута гвинтівка, певно, новенька модель зі Златоуста.\n\nВасілій міцніше стиснув зброю й стежив, як чоловік наближається. Нарешті той підійшов досить близько, щоб його почули, тримаючи руки осторонь від зброї. "Стій! Що ти тут робиш?"\n\nЗагадковий чоловік заговорив ламаною російською, постійно затинаючись. "Я прийти попередити. Бандити йти зі сходу. Багато бандитів, сьогодні вночі нападати." Через жахливий акцент Васілій ледве його розумів, але почув досить.\n\n"Що? Чорт. Гаразд, піднімайся сюди, але без дурниць." Чоловік піднявся сходами й зайшов до вартівні з піднятими руками.\n\n"Попередити людей, багато бандитів", - сказав незнайомець. Васілій негайно зв'язався з гарнізоном, але допомогу могли надіслати лише наступного дня. Вони з незнайомцем укріпили вартівню як могли, а далі лишалося тільки чекати.\n\nКоли наступного дня гарнізон прислав підкріплення, побачене приголомшило солдатів. Васілій сидів надворі на пеньку й курив, а на полі та довкола будівлі височіли купи тіл. Незнайомця ніде не було."
 RUS.13.a: ""Виняткова робота, товаришу Васілію.""

 RUS.14.t: "Привид Сиктивкара"
 RUS.14.desc: "Сєрґєй готувався до сьогоднішніх подій. Він облаштувався на даху будинку навпроти законодавчої палати Комі й був готовий виконати свою частину плану.\n\nСєрґєя та його людей найняли вбити групу політиків Комі, які стали серйозною перешкодою для задумів замовника. Спершу до зали мали випустити трохи сльозогінного газу із Сиктивкарського арсеналу. Як його вдалося дістати, він не знав. Коли залу евакуюють, Сєрґєй зробить перший постріл із цієї позиції та втече. Спільники засіли в інших будівлях і мали добити цілі, поки він відвертатиме охорону.\n\nСєрґєй потягнувся до рації, сподіваючись востаннє перевірити зв'язок перед початком, але раптом на мить почув голос Юрія. Слів він не розібрав, проте міг заприсягтися, що вдалині хтось закричав. "Юрію, відповідай! Що відбувається?" - вимагав він. У відповідь була лише тиша. Щось пішло не так. Поглянувши в приціл, Сєрґєй зрозумів, що охорону не попередили: вона поводилася надто спокійно.\n\nНа протилежному боці вулиці, на даху законодавчої палати, він побачив Андрєя з балоном. Здавалося, там усе йшло за планом, але Сєрґєй знав, що операція розвалюється. Він знову поглянув на Андрєя й цього разу щось помітив. У тіні дверей на дах через плече напарника дивилася висока постать у старій уніформі та зимовому одязі. Вона вихопила з-за пояса ніж і встромила його Андрєю в горло.\n\nПерш ніж Сєрґєй устиг зреагувати, постать зникла. Він підвівся, зібрав речі й кинувся до дверей, щоб покинути позицію. Та не встиг пройти далеко, як почав задихатися: кімнату заповнив газ з арсеналу. Кашляючи й намагаючись прикрити очі, він відчув у спині поцілунок холодної сталі."
 RUS.14.a: "Життя в Сиктивкарі триває."

 RUS.15.t: "До наступного світанку"
 RUS.15.desc: "Незнайомець прийшов зі світанком. Він шкутильгав до села, лишаючи кривавий слід від самого лісу. Софія саме йшла на ринок і першою побачила, як він ледве переставляє ноги. Не пройшовши й кількох кроків, чоловік із тяжким зітханням упав на землю.\n\nПідійшовши ближче, вона побачила залиту кров'ю уніформу. Чоловік дихав поверхово, а його очі скляніли. Майже запанікувавши, Софія покликала сільського лікаря. Молода вдова занесла незнайомця до своєї оселі й поклала на диван. Лікар перев'язав рани, однак одужання мало тривати кілька тижнів.\n\nСофія зголосилася доглядати його. Перші два дні незнайомець не приходив до тями, лише зрідка вигукував щось чужою мовою. Софія відразу її впізнала: німецьку ні з чим не сплутаєш. Попри ненависть до німців у серці, вона й далі піклувалася про нього. На третій день чоловік нарешті прокинувся. Спершу він запанікував, але швидко опанував себе, поглянув їй у вічі й ламаною російською подякував.\n\nЗа наступний тиждень він оклигав настільки, що вже міг допомагати по господарству. Щодня чоловік зустрічав її усмішкою, а тоді брався до справ. Щовечора після вечері вона міняла йому пов'язки, і вони розмовляли до глибокої ночі.\n\nЗрештою незнайомець одужав і повідомив, що продовжить шлях на схід, до Сибіру. Вранці перед від'їздом Софія зустріла його біля дверей гостьової кімнати. Довгу мить обоє мовчали. Нарешті він нахилився, і дві загублені душі злилися в поцілунку. Мить промайнула надто швидко, і чоловік покинув невелику оселю в безіменному селі.\n\nТа цього разу, на відміну від багатьох інших у своєму житті, незнайомець пішов, давши обіцянку: колись, із наступним світанком, він повернеться."
 RUS.15.a: "Обіцянку дано, і її буде дотримано."

 RUS.16.t: "Світло надії"
 RUS.16.desc: "Андрєй майже не пам'ятав життя за межами табору, так давно це було. Колись він був шанованою людиною серед своїх, очолював громаду, мав дружину й дітей. Але нацистські покидьки, які поневолили його, давно сплюндрували громаду, а її мешканців убили або обернули на рабів. Його любу Алєксандрію замордували працею вже за кілька місяців ув'язнення. Їхніх дітей, гордого Юрія та сором'язливу Анну, вбили всього за кілька тижнів після прибуття до цього пекла.\n\nЯкимось дивом він пережив виснажливу працю, голод, майже безперервні побої та приниження. Інколи здавалося, ніби сам Бог обрав його на страждання Йова. Та Андрєй не плекав ілюзій, що його історія матиме такий самий щасливий кінець. Він сповз із нар і поплентався з барака рабів. Попереду чекали ще кілька довгих днів у шахті, й Андрєй відчував, що вони стануть останніми.\n\nПіднявши кайло, він почув галас із боку вартового барака. Раптом пролунав вибух, і над адміністративним корпусом знялася вогняна куля. Услід гримнув постріл, і голова коменданта табору розлетілася на шматки. Охоронці біля входу до шахти нарешті почали приходити до тями, та перш ніж устигли щось зробити, на них накинулася група рабів із шахтарським знаряддям. Андрєй навіть не помітив, як долучився до них, доки не відчув, як кайло пробило череп найближчого вартового.\n\nТоді крізь туман бою прорізався голос: "Уперед, пси! Смерть фашистам!" До шахти наближалися партизани. Попереду йшов кремезний, наче лісоруб, чоловік, а поруч мовчки крокував дивний незнайомець у пошарпаній уніформі. "Радий бачити, що й ви, бідолахи, долучилися до веселощів. Ходімо, ми витягнемо звідси всіх до одного." Від цих слів у серці Андрєя знову зажевріла крихта надії."
 RUS.16.a: "Боротьба за свободу лише почалася."

 RUS.17.t: "За супом і розмовою"
 RUS.17.desc: "Лєонід був своєрідною місцевою установою. Майже все життя він прожив на вулицях Самари, здебільшого через обставини, а подеколи за власним вибором. Самарці добре його знали, а в районі, який він називав домом, Лєонід міг назвати на ім'я майже кожного мешканця. Чужинці сюди забрідали вкрай рідко: район лежав далеко від усього, що цікавило торговців.\n\nТому, прийшовши пообідати до місцевої їдальні, він здивувався, побачивши незнайомця в пошарпаній військовій уніформі. Той сидів за столом і мимохідь сьорбав суп. Узявши свою миску, Лєонід підсів до нього. "Вітаю, мандрівнику. Гарний день, еге ж?" Незнайомець глянув на нього й відповів.\n\n"Вітаю. Так, день гарний. Суп добрий." Чужинець мав дивний іноземний акцент і кепсько володів мовою. Лєонід міг заприсягтися, що вже чув таку вимову, але ніяк не міг згадати де.\n\n"Авжеж, Дарія варить добрий суп. Виглядаєш як мандрівник. Куди прямуєш?" Лєонід зустрічав чимало таких людей, нездатних із тієї чи іншої причини лишатися на одному місці.\n\n"На схід", - відповів чоловік. Його плечі опустилися. "Маю... справу на Сході. Спокутувати провину", - втомлено й покірно продовжив він. Незнайомець і сам не розумів, навіщо сказав більше: сенсу в цьому майже не було.\n\nЛєонід лише кивнув. "Я розумію, мабуть, краще, ніж ти гадаєш. Знаєш, замолоду я був неабияким шибайголовою. Наробив багато такого, чим не пишаюся. Якщо хочеш виговоритися, я вмію слухати. Розмова допомагає, хай навіть ненадовго."\n\nНезнайомець уперше поглянув йому просто у вічі, обтяжені жалем, і почав свою розповідь. То була довга історія боротьби й жахіть. Вислухавши її, Лєонід нарешті все зрозумів. Зрештою, акцент у чоловіка був німецький."
 RUS.17.a: "Друг у найнижчому з місць."

 RUS.18.t: "Проста доброта"
 RUS.18.desc: "У самому серці Свєрдловска безцільно блукав незнайомець. На щастя, хмари сьогодні були досить густі, щоб німецькі бомбардувальники лишалися на землі. Напередодні ввечері чоловік прибув до міста по винагороду за знищену банду й оселився в місцевій нічліжці. Йдучи вулицями Свєрдловска, він проминав невеликий парк, хоча називати його парком було, мабуть, надто щедро. Це був просто найбільший уцілілий клаптик міської зелені. Та незнайомець усе одно прогулювався ним і спостерігав за людьми.\n\nУ такі дні, коли не загрожували німецькі бомби, сім'ї могли насолодитися рідкісною мирною дниною. Їх було небагато, але від самого вигляду цих людей серце незнайомця наповнювалося дивним теплом. Він уже давно не бачив такого спокою серед жителів Росії.\n\nЧоловік зупинився на вершині невеликого пагорба, пошрамованого бомбами й занедбаного свєрдловцями. Він сів на край вирви й дивився на людей, яких щойно проминув. Не встигнувши надовго поринути в спогади, незнайомець почув за спиною тихе чхання. Обернувшись, він побачив на дні вирви маленьку дівчинку років шести. Вона приголомшено дивилася на нього широко розплющеними очима. Роззираючись у пошуках її батьків, чоловік поманив дівчинку до себе. "Ходи сюди, маленька. Де твої батьки?"\n\n"Я... я не знаю. Не можу їх знайти!" - тремтячим від сліз голосом відповіла вона. Перш ніж дівчинка розридалася, незнайомець підняв руку.\n\n"Ходімо, ми їх знайдемо." Чоловік узяв її за руку й повів із пагорба. Вони шукали майже годину, але зрештою знайшли батьків. Обоє геть вибилися з сил, а їхні обличчя спотворювала паніка. Дівчинка кинулася до них, і ті аж обм'якли від полегшення. Перш ніж вони встигли подякувати, незнайомець розчинився в натовпі."
 RUS.18.a: "Проста мить доброти."

 RUS.19.t: "День у темряві"
 RUS.19.desc: "Лєв напружив м'язи й замахнувся кайлом. Камінь розкришився та засипав уламками робочу бригаду. Кам'яний пил ніби застрягав у горлі, дихати ставало дедалі важче, а сили полишали його. Лєв знав, що незабаром упаде і його доведеться витягати з темних тунелів до лазарету.\n\nВін також знав, що заміну знайдуть миттєво, й іншого бідолаху з трудового табору заженуть у пітьму копати, доки той не звалиться. Лєв провів тут уже майже два роки. Він порушив якесь партійне положення, за що його заслали до цього пекла. Тепер він хапав повітря короткими ковтками й розумів, що кінець близько. Якщо особливо не пощастить, охоронці просто залишать його гнити.\n\nТа перш ніж він устиг знову замахнутися, його зупинили. Лєв приголомшено поглянув на чоловіка, який узяв його за плече. То був один з охоронців, найманець, якому платили за підсилення гарнізону. Він обережно забрав кайло однією рукою, другою вклав Лєву в долоні флягу й жестом наказав відійти за спини бригади. Тоді незнайомець став на його місце й заходився з разючою силою рубати камінь.\n\nЛєв сів позаду робітників і жадібно припав до фляги. Дихання вирівнялося, а біль у тілі наче послабшав. За десять хвилин він повернувся до роботи, а дивний охоронець тим часом підмінив його сусіда. Найманець працював із майже надприродною швидкістю, по черзі давав перепочити кожному членові бригади й, здавалося, анітрохи не втомлювався. Коли комендант оголосив кінець робочого дня, люди Лєва вийшли з тунелів з усмішками на обличчях.\n\nВони більше ніколи не побачили дивного найманця: наступного дня він забрав платню й пішов. Але назавжди запам'ятали, як той узяв на себе їхній тягар."
 RUS.19.a: "Покута має багато форм."

 RUS.20.t: "Зламані люди"
 RUS.20.desc: "Вони вистежували чоловіка кілька днів. Він умів зникати й безперечно добре знав місцевість Західного Сибіру, що ще дужче розпалювало лють Віктора. Пошарпану уніформу вони впізнали відразу. Німецький пес, та ще й із Вермахту, насмілився паскудити російську землю своєю присутністю. Та найдужче Віктора дратували вчинки цього чоловіка. На відміну від покидьків, які бомбардували села, він допомагав людям: захищав сім'ї від бандитів і работорговців, працював на селян за жалюгідну пайку. Виродок гадав, що зможе спокутувати провину, але Віктор знав: єдиною спокутою для цієї свині буде смерть.\n\nНаступного дня Віктор із людьми наздогнав чоловіка й одразу напав. Хоч перевага несподіванки була на їхньому боці, незнайомець швидко переломив хід сутички. Троє переслідувачів уже загинули, ще двох було поранено. Та Віктор не збирався здаватися, поки виродок не помре. Він кинувся на чоловіка, повалив його й заходився штрикати ножем. Але перш ніж устиг розпороти свиню, відчув пекучий біль у животі. Віктор опустив очі на холодну сталь, що ввійшла в його черево, й обм'як.\n\nНімець підвівся й підійшов до нього, поки кров стікала в сніг. Він відтягнув Віктора до дерева. Той намагався чинити опір, але майже не міг рухатися. Тоді чоловік узявся до рани: очистив її та наклав пов'язку. Закінчивши, він підвівся й рушив геть. Віктор зібрав останні сили й вичавив із себе: "Це нічого не змінює, німецька свине! За свої злочини ти заслуговуєш смерти! Ви всі, покидьки, заслуговуєте!""
 RUS.20.a: ""Я знаю.""

 RUS.21.t: "Бібліотека"
 RUS.21.desc: "Бібліотека стояла в Томску протягом багатьох поколінь. Вона майже не постраждала від насильства Громадянської війни в Росії та хаосу розпаду Совєцького Союзу. Навіть Республіка ледь не загинула, а бібліотека лишилася недоторканою. У її стінах зберігалися знання всієї Росії. Доглядачі за щедрої підтримки салонів робили все можливе, щоб великі архіви не занепали. Справді, це було одне з небагатьох місць у Росії, здатних берегти рукописи її минулого.\n\nВадім Пєвцов наглядав за бібліотекою ще з юности, з часів до падіння старого Союзу. Невдовзі він мав піти на спочинок і передати справу наступникам, але спершу хотів зробити останній внесок. Вадім нервово сидів у кабінеті, мало не тремтячи всім тілом, і чекав звісток від найнятого чоловіка. Минув майже місяць, відколи він відрядив мандрівника за Урал. Той мав проникнути до Пєрмі й повернутися з найбільшим скарбом усієї Росії: оригіналом Остромирового Євангелія. У Пєрмі рукопис тримали заручником як символ законности "арійського" режиму.\n\nДень змінився ніччю, і Вадім уже втрачав надію повернути рукопис. Але перш ніж відчай опанував його серце, двері відчинилися. До кімнати, трохи накульгуючи, зайшов незнайомець із дбайливо притиснутою до грудей дорожньою торбою. Не кажучи ані слова, він поставив її на стіл і відкрив, тоді дістав середньовічний рукопис і обережно поклав перед Вадімом.\n\nТой завмер від приголомшення й захвату. Він сумнівався у здібностях чужинця, а тепер рукопис лежав просто перед ним. Вадім уважно оглянув пошкодження, завдані нацистською недбалістю. Відновлення буде довгим, але пам'ятку можна врятувати. Він хотів подякувати чоловікові, та побачив, що той уже спав, обм'якнувши у кріслі."
 RUS.21.a: "Заслужений відпочинок."

 RUS.22.t: "Загублений і самотній"
 RUS.22.desc: "Він ішов землями під владою Сибірської Чорної Армії. Напередодні чоловік вступив до Вільної Території й тепер заглиблювався в Сибір. Дорогою він проминув чимало сіл, допомагаючи де міг в обмін на їжу та припаси. Щоправда, у віддалених поселеннях його часто проганяли як шахрая.\n\nКоли спала ніч, він розбив табір у невеликому гаю. Багаття потріскувало, а чоловік дивився в небо, всіяне такою кількістю зірок, якої не бачив до вигнання. Невдовзі тріск вогню заколисав його. Тоді прийшли спотворені розумом спогади, постаючи перед ним без прикрас. Він бачив уривки життя під "славетним" пануванням Нацистської партії, товариство й націоналістичний запал, що стали буденністю для громадян Райху.\n\nВін побачив матір, горду й прекрасну, яку підкосила хвороба, що отруювала кров. Згадав глузливе обличчя лікаря та слова про її нечисте походження. Відтоді й до призову він більше її не бачив. "Служи Батьківщині в її війську або здохни як собака, хлопче", - лунав у голові голос ґестапівця.\n\nЙого батька, гордого солдата Райху, заарештували за забруднення арійського генофонду та єврейське походження дружини. Звістку про страту чоловік отримав на фронті Західноросійської війни.\n\nНарешті з'явилися жертви. Він знав, що жорстокість боїв у Західній Росії переслідуватиме його до смерти, але по-справжньому його мучили каральні операції. Села, спустошені його підрозділом. Чоловіки, яких зганяли докупи й розстрілювали, поки вони благали помилувати родини. Жінки й діти, замкнені у власних домівках і церквах та спалені живцем. Він досі чув їхні крики, що судили й проклинали його.\n\nЧоловік із криком розплющив очі й панічно озирнувся. Заспокоївшись, він зібрав речі та продовжив подорож."
 RUS.22.a: "Цього ніколи не буде досить."

 RUS.23.t: "При дворі Яріслейфа"
 RUS.23.desc: "Залу наскрізь просяк п'янкий дух тріумфу. Могутні й наділені численними привілеями у володіннях свого князя воїни королівської гвардії святкували велику перемогу над несподівано небезпечним ворогом. Наслідуючи звичаї старої Руси, вони захопили місцеву корчму в Кємєрові й влаштували бенкет.\n\nБандити були одвічною пошестю на трупі Совєцького Союзу, й зазвичай загибель чергового недоладного наброду мало турбувала королівську гвардію. Але цього разу розбійники билися радше як совєцький гвардійський полк, ніж як люди пересічного отамана. Битва була люта, чимало хоробрих душ полягло, та стійкість гвардії виявилася незламною.\n\nСеред галасливого святкування вирізнялася одна дивина. У тихому кутку бару разом із загартованими ветеранами сидів незнайомець. Він мав до болю пересічну зовнішність: звичайні карі очі й таке саме каштанове волосся. Інших рис ніхто не запам'ятав, бо горілка лилася рікою й лишила в пам'яті чималі прогалини.\n\nНезнайомець був почесним гостем королівської гвардії, адже відіграв вирішальну роль у перемозі в тій доленосній битві. Час від часу хтось із молодших воїнів підходив і пропонував йому випити, але чоловік щоразу чемно відмовлявся. Натомість купував напій тому, хто його пригостив, і відсилав назад до товаришів. Усю ніч він тихо розмовляв із ветеранами. Ніхто не знав, про що саме, та всі присутні запам'ятали сумну усмішку, яка зникла з обличчя чужинця лише наступного ранку, коли той знову рушив у пустку."
 RUS.23.a: "Гірко-солодкий спогад про давно загиблих товаришів."

 RUS.24.t: "День відпочинку"
 RUS.24.desc: "Павєл сидів у човні посеред Байкалу, ліниво тримаючи вудку. На воді він був іще зі світанку. На відміну від звичайних днів, сьогодні мав пасажира: чужинця, безперечно із заходу, який щедро заплатив за місце в маленькому рибальському човні. Павєл скоса спостерігав за ним. Незнайомець закинув вудку, відкинувся на сидінні й тримав у руці холодне місцеве пиво. "Як тебе звати, хлопче?" - порушив мовчанку Павєл. Чоловік здригнувся й не квапився відповідати.\n\nЗа хвилину він тихо мовив: "Алєксандр" - і знову заходився потроху пити. Павєл лише кивнув. "Гарне ім'я, Алєксандре. Сильне. Звідки ти? Не впізнаю вимови." Йому було цікаво: супутники на риболовлі траплялися рідко, тож хотілося скористатися нагодою. Алєксандр знову здивувався й відповів іще неохочіше.\n\n"Із заходу. Далекого заходу, за Московом." Коли він поглянув на воду, в очах промайнуло щось дивне. Цікавість Павєла лише зросла. Сам він виріс у Західній Росії за царя, проте ніяк не міг визначити ледь помітний акцент Алєксандра. "Що ж, шлях ти подолав чималий. Дозволь першим привітати тебе в Байкалії. Край у нас прекрасний, якщо не зважати на тирана... Та байдуже." Павєл швидко змінив тему, раптом чоловік служить Яґоді. "Родина є?" Алєксандр замислився, і на мить його очі сповнив глибокий сум. "Була. Тепер їх немає. Минуло десять років." Власна відповідь, здавалося, здивувала його самого, наче він не міг повірити, що це сталося так давно. "Коли я був хлопчиком, батько брав мене на риболовлю. Я рідко дозволяю собі втіхи, але сьогодні вирішив ушанувати його пам'ять."\n\nПавєл поглянув на чоловіка вже з новим розумінням, повернувся до своєї вудки й дав Алєксандру насолодитися тишею."
 RUS.24.a: "Тихий день на Байкалі."

 RUS.25.t: "Оптимізм в анархії?"
 RUS.25.desc: "Вулиці Улан-Уде випромінювали майже відчутний оптимізм. Народ Бурятской АССР був дивним винятком серед анархії колишнього Совєцького Союзу. Більшість росіян давно розчарувалася й збайдужіла до життя в хаосі, а мешканці держави Сабліна лишалися невиправними ідеалістами. Ще дивніше, що їхній ідеалізм не був сліпим до реалій світу. Вони знали, наскільки він несправедливий, але попри все боролися з темрявою.\n\nНезнайомець ішов вулицями, спостерігав довколишнє пожвавлення й радість та мимоволі піддавався загальному настрою. Він не був соціялістом, але добре розумів привабливість цих ідей. Дорогою до нього наблизився чоловік в уніформі Червоної армії Сабліна, тримаючи руки подалі від зброї. "Вітаю, товаришу! Що привело вас до нашого славного міста?" - усміхнено запитав він. Незнайомця вразила щирість цієї усмішки. "Я лише проїздом. Знайду нічліг, а вранці рушу далі на схід", - відповів чоловік. Брехати не було потреби: на відміну від володінь Яґоди, тут його навряд чи вб'ють за необережне слово.\n\n"Гаразд, товаришу. Раджу пройти Головною вулицею три квартали. Ліворуч побачите невеликий готель, саме для таких мандрівників, як ви. Ем... якщо не заперечуєте, що привело вас на Далекий Схід?"\n\n"Правду кажучи, я й сам не знаю. Не зовсім. Я роками мандрую Росією. Це просто чергова подорож." Насправді він достеменно знав, чого шукає, але сумнівався, що колись знайде.\n\n"Гм, дивно чути таке в наші часи. Ох, як нечемно з мого боку, я ж не відрекомендувався. Сержант Віктор Шихов, радий знайомству."\n\n"Алєксандр. Навзаєм. Дякую за пораду", - відповів незнайомець і з легкою усмішкою рушив далі вулицею."
 RUS.25.a: ""Звісно, друже!""

 RUS.26.t: "Неспокійні дні"
 RUS.26.desc: "Незнайомець напрочуд легко потрапив до Чіти. Солдатів Білої армії, які зупинили його на кордоні, більше цікавили новини із заходу, ніж особа мандрівника. Невдовзі дорога привела його до міста. Увійшовши до Чіти, він одразу відчув довколишню напругу. Групи солдатів люто зиркали одна на одну через вулицю. Прибічників царя було менше, ніж людей, відданих старим білогвардійським генералам, які керували Князівством. Та цей розкол виник зовсім недавно й міг визрівати ще роками.\n\nВикинувши напругу з голови, незнайомець ішов вулицями, доки не натрапив на невеликий готель. У вестибюлі навколо каміна сиділи інші виснажені дорогою мандрівники. Він замовив на стійці кімнату на ніч і пішов відпочити. Скинувши важкий верхній одяг, чоловік ліг на ліжко. Його рука мимохіть торкнулася лівого боку, вкритого опіками. Він згадав ніч, коли їх дістав, намагаючись удати героя й уперше за всю ту прокляту війну дослухатися до сумління. Усе скінчилося обпеченим тілом і смертю людей, яких він прагнув урятувати.\n\nІз роздумів його вирвав крик із сусідньої кімнати. Не вагаючись, він зіскочив із ліжка зі старим службовим пістолетом у руці й вибив двері. Чоловік у білогвардійській уніформі притиснув молоду жінку до стіни. Штани вже лежали біля його ніг, а до горла жертви тулився ніж. Ґвалтівник ледве встиг обернутися, як пролунали три постріли. Він мовчки впав на підлогу, дівчина вибігла з кімнати й кинулася сходами вниз, а незнайомець помчав до себе. Зібравши спорядження, він відчинив вікно й вистрибнув. Доведеться шукати інше місце для ночівлі."
 RUS.26.a: "Розважливість часто важливіша за відвагу."

 RUS.27.t: "Смерть у родині"
 RUS.27.desc: "Віталій Ґрінін був простою людиною: фермером на досить безплідних землях російського Далекого Сходу, люблячим батьком, відданим чоловіком, вірним солдатом Червоної армії та одним із небагатьох євреїв у регіоні. Тепер Віталій Ґрінін помер: уночі його забрав рак. Родині, якій досі щастило не привертати уваги божевільного Вождя із Зєї, лишалося тільки оплакувати його. Бути євреєм на цій землі було небезпечно. Якщо вони втратять обережність, амурський режим невдовзі запроторить усіх до таборів.\n\nСтарший син Віталія, Бєньямін, потайки покликав добровольців допомогти з тагарою. Люди поступово сходилися з навколишніх сіл. Усіх, крім одного, Бєн знав. Незнайомець мав вигляд мандрівника. Коли почалося обмивання тіла Віталія, стало очевидно, що чоловік не належить до їхньої віри, однак він твердо намірився пройти всі обряди до кінця. Пролунали прощальні слова на честь покійного батька. Нарешті тіло загорнули в молитовне покривало й саван, а коли труну опускали в могилу, прочитали псалми.\n\nКоли настав час шиви, Бєн із родиною повернувся додому, а гості почали розходитися. Незнайомець, однак, залишився й мовчки сидів із ними. Зрештою Бєн поставив просте запитання: "Чому?" Чоловік пильно поглянув на нього, в очах промайнула ніяковість, і він відповів.\n\n"Він урятував мені життя. На війні. Я не заслуговував, але він урятував." Спершу відповідь усіх спантеличила. Що це означало? Чоловік служив у Червоній армії? Може, був дезертиром? І тут Бєна наче потягом ударило. Колись давно Віталій розповідав про молодого німецького солдата, який не виконав наказу, намагався врятувати російських цивільних і був за це підстрелений товаришами. Бєн поглянув на чоловіка зовсім іншими очима. Спала ніч, а той лишився. Лишався до кінця шиви. Минув тиждень, і на восьмий день незнайомець пішов."
 RUS.27.a: "Збережи мене, Предвічний, бо до Тебе прибігаю."

 RUS.28.t: "Смерть надії"
 RUS.28.desc: "Васілій усе життя прожив у Маґадані. Від падіння старого Союзу місто пережило чимало злетів і значно більше падінь. Брак торгівлі майже знищив місцеву економіку, й тепер із міста виходили хіба вантажі камчатських піратів і контрабандистів. До приходу РФП Васілій очолював профспілку портових робітників і лише дивом уникнув шибениці, принизивши себе й зрікшись спілки перед колишніми друзями. Тепер після ще одного довгого дня пияцтва він сидів біля місцевого бару й вибльовував нутрощі.\n\nВідчувши, що вже може стояти сам, Васілій спробував підвестися, але лише виблював на чоботи незнайомця. Він прокашляв вибачення й приготувався до побиття, та удару не було. Чоловік допоміг йому піднятися й підтримав, не даючи впасти. "Ось, випий", - почув Васілій, коли йому в руки вклали флягу з водою.\n\n"Дяк, вибач за чоботи. Я б нові купив, але, ну... останній рубль спустив на бухло, яке щойно виблював." Від його подиху незнайомець здригнувся й відхилився. Він забрав флягу й відвів Васілія додому, якщо халупу на міській околиці можна було так назвати. Васілій сів на іржаве ліжко, а чужинець вмостився на старому барному стільці, що стояв неподалік. Трохи подивившись на господаря, чоловік показав йому стару потерту світлину.\n\n"Упізнаєш їх?" Васілій придивився й зрозумів, що таки впізнає.\n\n"Ага, це старий Аарон із родиною. Слухай, хлопче, якщо ти їх шукаєш, то дарма. Їх зачистили ще до розколу РФП. Усі мертві. Мені шкода."\n\n"Розумію, дякую." Незнайомець раптом підвівся й рушив до виходу, перед тим поклавши на стілець стос рублів."
 RUS.28.a: "Останню надію зруйновано."

 RUS.29.t: "Проповідь на краю цивілізації"
 RUS.29.desc: "Алєксандр сидів у задній частині церкви й зачаровано слухав проповідь священника. Він багато років не бував на службі. До Західноросійської війни ходив до церкви ревно, але війна заплямувала його. Алєксандр уважав, що більше не заслуговує на спокій, який колись відчував серед лав. Плану він уже не мав. Від того, щоб просто сісти в сніг і дати собі померти, його втримувала лише обіцянка, дана багато місяців тому у Вятці.\n\nМандри нарешті привели його до віддаленого села Омолон. Алєксандр чув чутки про проповідника на далекій півночі, який надихав пригноблених усього краю. Тепер він сидів і слухав, як "отець" із кафедри проповідує мир і терпимість. Його красномовство захоплювало, а слова, принаймні здебільшого, заслуговували підтримки. Алєксандр добре розумів, чому ця людина така популярна.\n\nКоли служба скінчилася, Алєксандр підійшов до отця Мєня й попросив вислухати його сповідь. Вони пройшли до кабінету в задній частині будівлі. Там Алєксандр сів і вперше за багато років висповідався. Він довго говорив про свої злочини, про виконання наймерзенніших наказів і всіх людей, яких убив, служачи нацистам та їхньому злу. Вислухавши все, отець Мєнь заговорив.\n\n"Ви бачили й робили речі, які мало хто здатен зрозуміти, і я бачу, як вони обтяжують вашу душу. Та ви зробили все можливе, щоб спокутувати минулі вчинки. До мене доходили із заходу оповіді про ваші справи. Так, ваше минуле затьмарене нацистським злом. Але майбутнє може бути сповнене миру й любови, якщо ви лише дозволите собі жити далі. Пам'ятайте темні часи, але не дайте їм поглинути себе."\n\nАлєксандр відчув, як тягар на душі трохи полегшав, хоча знав, що однієї розмови замало, щоб загоїти рани. Він дозволив собі хвилину молитви, а тоді залишив священника важливішим справам."
 RUS.29.a: "На шляху до внутрішнього спокою."

 RUS.30.t: "Корпоративна війна"
 RUS.30.desc: "Вулицями Новосибірска марширувала група чоловіків у корпоративній уніформі. Штаб-квартира "Сибіру" відрядила їх залякати власників невеликого сталеливарного заводу в промисловому районі. Загін очолював молодий офіцер Андрєй Уґолєв, висхідна зірка корпоративної служби безпеки. Із кийками в руках вони наближалися до заводу з півдня. Та з півночі йшла інша група корпоративних охоронців. Судячи з вигляду, це були люди "Фєнікса", озброєні гвинтівками й кількома рушницями.\n\nКоли два загони зблизилися, про себе заявила третя сторона. За саморобними барикадами біля входу до заводу засіли кілька робітників на чолі з дивним найманцем. Вони мали різноманітні старі совєцькі гвинтівки й пістолети, а добре озброєний ватажок носив стару уніформу.\n\nЩойно корпоративні загони побачили один одного, почалося пекло. Краще озброєна група відкрила вогонь, убивши або поранивши більшість людей Уґолєва. Сховавшись за низькою стіною довкола заводу, він намагався згуртувати підлеглих, та всі вже загинули або втекли.\n\nТоді й робітники висловили своє невдоволення. Незнайомець вигукнув наказ і відкрив вогонь по корпоративних головорізах. Раптове втручання заводчан приголомшило бійців "Фєнікса". Втративши половину людей, уцілілі ледве встигли сховатися. Незнайомець дістав із поясної сумки невеликий предмет і кинув його просто в середину їхньої групи. Оглушливий вибух і злива уламків стали останнім, що вони відчули, перш ніж їх розірвало на шматки.\n\nАндрєй озирнувся на тіла друзів і ворогів та відчув лише заціпенілу покору долі. Прокинувшись цього ранку, він був кимось, висхідною зіркою. Після сьогоднішнього дня йому ще пощастить, якщо біля корпоративної штаб-квартири дозволять жебрати недоїдки."
 RUS.30.a: "Зрештою висхідна зірка мусить упасти."

 RUS.31.t: "Сутичка в горах"
 RUS.31.desc: "У монгольському прикордонні бійці Червоної армії та їхні союзники під командуванням лейтенанта Лєоніда Морозова перевіряли чутки про вторгнення Мєньцзяна. До них приєднався чужинець із заходу, найманець, який і попередив про появу мєньцзянських розвідників.\n\nЛєонід не квапився довіряти чоловікові, але не можна було недооцінювати наслідки раптового нападу монгольських фашистів. Коли загін ішов гірськими перевалами вглиб Монголії, лейтенант відчув недобре. Він наказав зупинитися: вітер змінився, а повітря аж дзвеніло від напруги. Блиск прицілу Лєонід помітив на мить запізно. Куля пробила бік і збила його з ніг. Поки солдати кинулися шукати укриття серед каміння, чиясь рука схопила лейтенанта за уніформу й затягнула за великий валун. То був найманець.\n\nНезнайомець перев'язав йому бік і відкрив вогонь по ворожих солдатах, які заповнювали перевал. Крізь туман болю Лєонід бачив, як його люди намагаються стримати ворога. Невелика група дісталася вантажівки з припасами й захопила протитанкову зброю та набої. Рятівник вигукував накази, згуртовуючи солдатів і налагоджуючи оборону. На щастя, втрати виявилися напрочуд малими, й бійці почали поволі відтискати нападників.\n\nЛєонід озирнувся на найманця, але той зник. Аж раптом він побачив чоловіка попереду лінії Червоної армії: із гранатометом на плечі той біг просто під ворожий вогонь. Божевілець стрибнув у канаву й навів захоплену зброю на схил над позиціями ворога. Боєголовка зі свистом урізалася в гору й вибухнула. Скеля затріщала й посипалася в долину просто на супротивника. Коли вороги кинулися тікати від обвалу, вцілілі бійці вибухнули переможним криком."
 RUS.31.a: ""Трикратне «ура» божевільному найманцеві!""

 RUS.32.t: "Світанок"
 RUS.32.desc: "Алєксандр прибув до села туманного ранку, що огорнув землі Вятки. Спершу він попрямував до лікаря. Минулого разу, полюючи в цих краях на грабіжників з Арійського Братства, Алєксандр дістав кілька куль. Він ледве дошкандибав до села, а лікар урятував йому життя. Двері відчинилися раніше, ніж мандрівник устиг до них підійти, й він мало не зіткнувся з господарем. Той одразу впізнав Алєксандра й здивувався, коли чоловік із тихою подякою вклав йому в руки торбу.\n\nНе встиг лікар нічого сказати, як Алєксандр уже прямував вулицею до справжньої мети. З тривогою він постукав у двері Софії й терпляче чекав. Із будинку долинала приглушена лайка, а тоді двері розчахнулися. Як завжди вранці, Софія мала вкрай розпатланий вигляд і довгу мить не могла збагнути, хто стоїть перед нею.\n\n"Вітаю, Софіє. Надто давно ми не бачилися", - мовив він. Її очі миттю розширилися, і вона ахнула. Раптом Софія міцно обійняла його, стискаючи мов рятівну мотузку, аж у нього хруснула спина. Алєксандр відразу обійняв її у відповідь, хоча й не так сильно, та поцілував у маківку. "Я радий знову тебе бачити, Софіє."\n\nБез жодних пояснень вона затягнула його до будинку, глибоко поцілувала й повела на кухню. Алєксандр дивився, як Софія метушиться, слухав її безперервну розповідь про новини з Вятки й відчував, як обличчя розтягується в усмішці. Він майже здивувався, коли вперше за багато років його наповнило справжнє щастя.\n\nТієї ночі, обіймаючи Софію, він уперше від Західноросійської війни спав спокійно. Кошмари не прийшли, а душа стала ще на крок ближчою до миру."
 RUS.32.a: "Можливо, щастя було досяжним."

 RUS.33.t: "Експедиція до Сахи"
 RUS.33.desc: "Наші геологи представили цікаву пропозицію. В архівах Іркутска припадають пилом старі плани дослідження півночі Сахи. Там сподівалися знайти алмази й інші коштовні мінерали, але, як і багато великих та амбітних проєктів Сибірського плану, цей задум зруйнувався після вторгнення країн Осі до Совєцького Союзу. Тепер ми маємо шанс утілити його в життя. Робота напевне буде довгою й дорогою, та сама можливість відкрити алмазне родовище масштабу якутського надто принадна, щоб її проґавити. Щойно держава буде готова виділити ресурси, армійський інженерний корпус устромить лопати в цю тверду й непривітну землю."
 RUS.33.a: "Мерехтливе світло серед пустки."

 RUS.34.t: "Відродження Норільска"
 RUS.34.desc: "Доба воєначальників у Центральному Сибіру поступово добігає кінця. Ресурси регіону міцно перебувають під нашим контролем, тож настав час рушити на північ і знову сполучити багаті землі Норільска з рештою молодої держави. За часів Совєцького Союзу цей край мав сумну славу через широке застосування примусової праці. Після його розпаду регіон поволі занепадав, а згодом був остаточно втрачений, коли Сибірська війна знищила совєцький уламок, що постав після Другої світової. Тепер ми можемо повернути ці землі народові, а їхні незліченні багатства - до російських рук."
 RUS.34.a: "Не повторюймо помилок минулого."

 RUS.35.title_Amur: "Початок всеросійської промислової боротьби"
 RUS.35.title_Chita: "Кінь бере короля"
 RUS.35.title_Magadan: "Двоє чоловіків, два бачення"
 RUS.35.title_Werbell: "Армія без країни, країна без промисловости"
 RUS.35.title_Irkutsk: "Засідання С.Д.Р.К."
 RUS.35.title_Men: "Господь дає, Господь забирає"
 RUS.35.title_Sablin: "Виправлення помилок Бухаріна"

 RUS.35.desc_Amur: "Анархія на Далекому Сході нарешті добігає кінця, тож ми мусимо взятися за відновлення економіки. Відверто кажучи, становище похмуре: ми переживаємо небачену для Росії демографічну катастрофу й через тривалу занедбаність краю значно відстаємо в розвитку від західних воєначальників. Щоб мати шанс об'єднати російські землі під своїм прапором, ми мусимо розпочати стрімке економічне та промислове зростання. На виправлення незліченних років відсталости маємо приблизно пів десятиліття, тож не можна гаяти ані хвилини."
