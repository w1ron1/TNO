### Decision Categories ###
 #Raiding
 russian_raiding_category: "§YНабіги та здобич§!"
 russian_raiding_category_desc: "[GetRaidingDesc]"
 russian_raiding_category_desc_no: "Набіги, на жаль, стали частиною повсякденного життя в Росії та, хоч як прикро це визнавати, одним із небагатьох доступних нам засобів виживання. Тому ми мусимо бути готові влаштовувати набіги на сусідні території, щоб здобувати їжу, обладнання й ресурси.\n\nЗараз ми маємо £loot_icon  [?loot_amount|Y0] здобичі."
 russian_raiding_category_desc_am: "Попри все, ми повернулися туди, звідки почали, але в іще гіршому становищі. Наші люди зіщулюються й, мов щури, шукають хоч якоїсь схованки від пронизливого холоду пусток, які ми звемо домом, і бодай чогось їстівного. Нехай наша зброя залишилася від огидної імперії, а інші воєначальники потерпають так само, як і ми, та виживання не зважає на мораль. Якщо заради нього доведеться знову грабувати сусідів, нехай так."

