 siberia_development_decision_category: "Спадщина §DСибірського плану§!"
 SIB_siberian_plan_description_title: "§GСпадщина Сибірського плану§!"
 SIB_siberian_plan_description: "Хоч більша частина Росії роздроблена й понівечена бомбардуваннями та війною, у наших володіннях збереглися рештки надзвичайного проєкту. §DСибірський план§!, започаткований Бухаріним і розширений §YЦентральносибірською Республікою§! на вершині її могутности, був усеосяжною ініціятивою зі створення інфраструктури, яка мала перетворити Сибір на найбільший і найкраще організований промисловий регіон планети.\n\nХоч план і не досяг усього свого потенціялу, значна частина його структури вціліла й може послужити поліпшенню нашої промисловости.\n\nПроте через особливості нашого регіону та значну індустріялізацію території ми мусимо пильно стежити за промисловими робітниками, щоб §Rсеред населення не зростало невдоволення§!."
 
