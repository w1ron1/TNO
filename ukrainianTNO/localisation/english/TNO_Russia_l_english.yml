 ### CIA Stuff ###
 MAG_american_military_advisors_1: "Американські радники"
 MAG_american_military_advisors_1_desc: "За щасливим збігом обставин американці з військовим досвідом нині готують наші війська до бою за допомогою передових доктрин і суворих навчань. Якщо вони досить довго застосовуватимуть свої методи, наші люди здобудуть військову підготовку світового рівня, а вище командування ще більше професіоналізується завдяки воєнним іграм і загальному поліпшенню роботи."


 
