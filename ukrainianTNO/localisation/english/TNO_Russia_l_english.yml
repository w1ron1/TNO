 #Nukes decisions
 RUS_nuke_development_category: "[RUSGetNuclearProgramName]"
 RUS_nuke_development_category_desc: "Щоб здобути становище на світовій арені, до якого ми мусимо прагнути, державі [RUSGetUniqueName] потрібна власна ядерна програма. Ми не сподіваємося одразу отримати бомбу, але мусимо закласти підвалини належної програми, щоб, коли настане час §Rможливого конфлікту§!, стати з ворогами на рівних.\n\nПоточний етап програми: [RUSGetNuclearProgramStage]\n\nНаш поступ:\nТеоретичні розробки: [?RUSNukesTheoryProgress]%\nЗабезпечення матеріалами: [?RUSNukesMatsProgress]%\nСтворення інфраструктури: [?RUSNukesInfraProgress]%\nЗбагачення матеріалів: [?RUSNukesRefineProgress]%\nВиробництво зброї: [?RUSNukesWeaponsProgress]%\n\nЗагалом поступ [RUSGetNuclearProgramProcess] і щомісяця становить [?RUSNukesMonthlyProgress]%."
