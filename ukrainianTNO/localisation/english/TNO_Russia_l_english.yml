 RUS_strain_remove: "§YУсуває§! поточне §Yадміністративне навантаження§! на нашу державу.\n"

 RUS_administrative_overload_1_desc: "Після недавнього об'єднання нашого регіону й початку відродження Росії новій бюрократії важко пристосуватися до дійсности нашого становища. Щоб забезпечити подальше розширення, необхідно істотно реформувати й розбудувати адміністрацію, усунути прогалини та створити основу з кваліфікованих управлінців."
 RUS_administrative_overload_2_desc: "Після недавнього об'єднання нашого регіону й початку відродження Росії новій бюрократії важко пристосуватися до дійсности нашого становища. Щоб забезпечити подальше розширення, необхідно істотно реформувати й розбудувати адміністрацію, усунути прогалини та створити основу з кваліфікованих управлінців."
 RUS_administrative_overload_3_desc: "Після недавнього об'єднання нашого регіону й початку відродження Росії новій бюрократії важко пристосуватися до дійсности нашого становища. Щоб забезпечити подальше розширення, необхідно істотно реформувати й розбудувати адміністрацію, усунути прогалини та створити основу з кваліфікованих управлінців."
 RUS_administrative_overload_4_desc: "Після недавнього об'єднання нашого регіону й початку відродження Росії новій бюрократії важко пристосуватися до дійсности нашого становища. Щоб забезпечити подальше розширення, необхідно істотно реформувати й розбудувати адміністрацію, усунути прогалини та створити основу з кваліфікованих управлінців."
 RUS_administrative_overload_5_desc: "Після недавнього об'єднання нашого регіону й початку відродження Росії новій бюрократії важко пристосуватися до дійсности нашого становища. Щоб забезпечити подальше розширення, необхідно істотно реформувати й розбудувати адміністрацію, усунути прогалини та створити основу з кваліфікованих управлінців."

 RUS_increased_factory_output: "Збільшений обсяг виробництва фабрик"
 RUS_increased_factory_output_desc: "Завдяки нашим зусиллям фабрики почали виробляти більше товарів. Це матиме вирішальне значення для нинішніх і майбутніх воєн та наших шансів об'єднати регіон."

 RUS_savy_army: "Ощадливе військо"
 RUS_savy_army_desc: "Попри всі труднощі, військо держави здійснило те, що багато хто вважав неможливим: істотно скоротило свої поточні витрати, зберігши колишній рівень професіоналізму й ефективности. Це справді визначне досягнення, яке добре прислужиться державі під час розширення та появи нових потреб у ресурсах."
 RUS_promisory_notes_system: "Система боргових розписок"
 RUS_promisory_notes_system_desc: "Щоб підтримувати військо в міру розширення держави, було запроваджено систему боргових розписок: солдатам «платять» новоствореною валютою, яку вони зможуть обміняти, коли наша економіка зміцніє. Принаймні поки що це дасть державі змогу продовжувати походи задля розширення.\n\n§RАле якщо борг не буде погашено в розумні строки, нас чекатимуть тяжкі наслідки.§!"
 RUS_expanded_promisory_notes_system: "Розширена система боргових розписок"
 RUS_expanded_promisory_notes_system_desc: "Всупереч давнім обіцянкам держави, систему оплати війська борговими розписками досі не скасовано. Видані раніше розписки досі не обміняно. Нарікання серед солдатів гучнішають, а невдоволення швидко шириться.\n\n§RНічого доброго.§!"

 POLITICS_NO_AUTHORITY_SIBERIA_DESC: "Після розпаду Совєцького Союзу в найвіддаленіших закутках Сибіру не виникло жодної держави-наступниці чи держави-уламка. Без централізованої бюрократії, інфраструктури, промисловости, великої торгівлі або далекого зв'язку, що могли б об'єднати регіон, села переважно повернулися до способу життя, яким жили століттями: натурального господарства, полювання та скотарства. Місцеві якути, евени й чукчі знову вільно сповідують шаманські вірування, а православні російські села не завдають їм клопоту. Зазвичай найдальша подорож веде до сусіднього села, і його мешканці можуть роками не чути ані крихти новин із зовнішнього світу.\n\nХоч регіон може бути багатий на ресурси, воєначальники з придатніших для життя земель на півдні й заході не бачать сенсу його завойовувати. Розмір краю, відсутність доріг і суворість зим відлякають від такого безглуздя будь-якого розважливого деспота. Просто не зважати на ці землі теж майже не небезпечно: найближчим до армії в більшості сіл є кілька старих із іще старішими мисливськими рушницями. Схоже, якщо народи Сибіру якимось чином не об'єднаються самі або їх не завоює успішний претендент на спадщину Росії, вони й далі животітимуть так, як завжди: ізольовано й самотньо, на краю світу."
 
 #Wonders
 RUS_remove_wonders_tt: "§YОсобливі ефекти§! всіх §Yстратегічних об'єктів§! буде усунуто."
 RUS_gorky_tank_factory: "Завод «Красноє Сормово»"
 RUS_gorky_tank_factory_desc: "Комплекс «Красноє Сормово» панує навіть над розлогими промисловими спорудами Ґорького та його околиць і пристосований до виробництва високоякісних моделей танків та іншої важкої техніки. Коли його буде захищено, складальні лінії можна спрямувати на швидке розширення й удосконалення бронетанкових з'єднань держави."
 RUS_syktyvkar_arsenal: "Сиктивкарський арсенал"
 RUS_syktyvkar_arsenal_desc: "Під містом Сиктивкар лежить справжня скарбниця совєцьких технологій і зброї. Чани й контейнери зі смертоносною «зброєю відплати» зберігали тут до розпаду Фронту, а тепер їм знайшли нове застосування захисники Республіки. Газ дієвий, а спроможність випалювати землі ворогів є ефективним засобом, однак ті, хто контролює арсенал, мають непропорційно великий вплив."
 RUS_the_izhevsk_arsenal: "Іжевський механічний завод"
 RUS_the_izhevsk_arsenal_desc: "Іжевск має довгу й славетну історію як осередок виробництва зброї для потреб Батьківщини. Підприємство засновано 1807 року за наказом імператора Алєксандра I, а в роки війни Іжевський механічний завод став головним виробником стрілецької зброї для Червоної армії, виготовивши мільйони рушниць усіх типів. Успішний зброяр Міхаїл Калашніков реорганізував і перебудував підприємство для Західноросійського революційного фронту під час його реваншу проти Німеччини, однак наступ царистської когорти імператора Владіміра III змусив працівників фабрики втекти до Сибіру, залишивши механічний завод у розпорядженні імператорської Корони.\n\nПопри шкоду, якої він зазнав за роки безперервних конфліктів у Західній Росії, Іжевський механічний завод залишається одним із найбільших центрів виробництва зброї на російських землях і надає перевагу в стрілецькому озброєнні кожному дрібному царку Росії, що ним володіє."
 RUS_vorkuta_gulags: "Воркутинські ГУЛАГи"
 RUS_vorkuta_gulags_desc: "Упродовж багатьох років Совєцький Союз тисячами відправляв своїх найнебезпечніших в'язнів, як кримінальних, так і політичних, до Воркути, де їх примушували працювати на користь держави. Тепер, коли ГУЛАГи під нашим контролем, держава має доступ до цього ресурсу й може використовувати його і для робітничих загонів, і для призову."
 RUS_ural_automotive_plant: "Уральський автомобільний завод"
 RUS_ural_automotive_plant_desc: "Уральський автомобільний завод - один із найбільших фабричних комплексів Центрального Сибіру, що десятками тисяч випускає цивільну й військову техніку. Контроль над заводом дасть державі змогу у величезних кількостях виробляти вантажівки та легку бронетехніку - кровоносну систему сучасної війни."
 RUS_zlatoust_arms_plant: "Златоустівський збройовий завод"
 RUS_zlatoust_arms_plant_desc: "Знаменитий Златоустівський збройовий завод, розташований глибоко в Уралі, віддавна славиться високою якістю виробленого спорядження та боєприпасів. Коли підприємство буде забезпечене для держави, його розлогі виробничі лінії можна використати для швидкого виготовлення величезних обсягів військового майна."
 RUS_krasnoyarsk_railway_junction: "Красноярський залізничний вузол"
 RUS_krasnoyarsk_railway_junction_desc: "Красноярський вузол, безперечно, є одним із найважливіших стратегічних пунктів Транссибірської маґістралі й забезпечує стратегічне залізничне сполучення в багатьох напрямках. Контроль над вузлом гарантує швидке перевезення військового майна та інших припасів, а також будівельних матеріалів для цивільних потреб."
 RUS_kuznetsk_basin: "Кузнецький басейн"
 RUS_kuznetsk_basin_desc: "Кузнецький басейн, одне з найбільших у світі родовищ вугілля, дає величезну кількість сировини тим, хто здатен його розробляти. Контроль над басейном не лише гарантує безпеку енергопостачання держави, а й завдяки зосередженому тут досвіду видобутку підвищить ефективність інших гірничих робіт."
 RUS_novosibirsk_aircraft_plant: "Новосибірський авіаційний завод"
 RUS_novosibirsk_aircraft_plant_desc: "Новосибірск і його авіаційні заводи, великі виробники як готових літаків, так і їхніх складників, здатні швидко створити значний повітряний флот. Контроль над містом і підприємствами дасть державі змогу спрямувати це виробництво на власні авіаційні цілі."
 RUS_port_of_magadan: "Порт Маґадана"
 RUS_port_of_magadan_desc: "Маґадан - одне з найважливіших портових міст Сибіру, добре відоме всім країнам світу як брама до регіону; крім того, воно має чималі суднобудівні потужності. Контроль над портом забезпечить швидке будівництво суден."
 RUS_irkutsk_hydro_station: "Іркутська гідроелектростанція"
 RUS_irkutsk_hydro_station_desc: "Найбільша гідроелектростанція Сибіру, гребля на річці Анґарі, постачає величезні й невичерпні обсяги електроенергії. Контроль над електростанцією обіцяє значні промислові переваги, а дослідження інженерного досвіду її спорудження допоможе прискорити інші будівельні проєкти держави."
 RUS_cheryomushki: "Авіабаза Чєрьомушкі"
 RUS_cheryomushki_desc: "Довгі злітно-посадкові смуги та розлогі ангари Чєрьомушек, одного з найбільших летовищ Далекого Сходу, дають змогу зосереджувати тут великі повітряні флоти. Контроль над летовищем допоможе державі легше здобувати перевагу в повітрі над ворогами, а його величезні розміри також сприятимуть запобіганню аваріям під час злету й посадки."
 
 ### Lenin's Body ###
 RUS_lenin_embalmed: "Мавзолей Лєніна"
 RUS_lenin_embalmed_desc: "Батька Революції Владіміра Ілліча Лєніна після смерти зберіг його наступник, щоб усі пам'ятали того, хто звільнив нас від тиранії буржуазного панування. Під час Барбаросси тіло евакуювали з місця його спочинку, а тепер воно перебуває під нашою шанобливою опікою. Володіння його останками надає нашому уряду певної легітимности в очах народу."
 RUS_lenin_body_destroyed: "Тіло Лєніна знищено"
 RUS_lenin_body_destroyed_desc: "В ім'я всіх, кого він гнобив, паплюжив і вбивав, земні останки архізрадника Лєніна віддано полум'ю. Наймерзенніший лиходій в історії Батьківщини став не більш ніж попелом і димом на вітрі, як на те й заслуговує."
 RUS_destroyed_lenin_body: "Тіло Лєніна знищено"
 RUS_lenin_body_tt: "Доступні нові рішення"
 RUS_lenin_enbalmed_category: "Тіло Лєніна"
 RUS_lenin_leave_be: "Залишити його в спокої"
 RUS_lenin_mausoleum: "Зберегти революціонера"
 RUS_bury_lenin_socialist: "Поховати революціонера"
 RUS_bury_lenin_moderate: "Покласти край його культу особи"
 RUS_bury_lenin_omsk: "Поховати його тихо"
 RUS_destroy_lenin_body: "Знищити зрадника"
 LENIN_DECISION_MADE: "Щодо тіла §RЛєніна§! ухвалено рішення."

 ### Southern Urals Rewards ###
 RUS_magnitogorsk_research_division: "Маґнітоґорське дослідницьке бюро"
 RUS_magnitogorsk_research_division_desc: "Дослідження під керівництвом божевільного Лисєнка могли мати сумнівну користь, але його коло науковців зі старої совєцької інтелігенції безперечно складалося з блискучих умів. За допомогою Дослідницького бюро наші науково-дослідні спроможності зростуть удесятеро. Однак, мабуть, краще не питати їх, що відбувалося в глибинах Чорної Гори."

 RUS_wealth_of_orenburg: "Багатство Орєнбурґа"
 RUS_wealth_of_orenburg_desc: "Інтеграція Орєнбурґа принесла багатство, майже нечуване в Російській Анархії. Місто та його околиці залишилися майже цілковито неушкодженими за роки після Великої Вітчизняної війни. Статус Перлини Південного Уралу сприяв зростанню його добробуту, тоді як решта Росії зазнала лише спустошення. Багатство, здобуте в Орєнбурзі, матиме вирішальне значення для відродження всієї Росії."

 RUS_ural_guard_training: "Підготовка Уральської гвардії"
 RUS_ural_guard_training_desc: "Уральська Ліга має одних із найбільш загартованих у боях солдатів Росії: вони пережили десятиліття кровопролиття й довели свою вартість у битвах проти воєначальників, бандитів, німецьких дезертирів і дивізій НКВД. Тепер цей цінний досвід служитиме нам, адже їхніх ветеранів буде включено до наших армій. Віднині нашими частинами командують одні з найдосвідченіших знавців російського способу ведення війни."

 RUS_NKVD_security_training: "Підготовка служби безпеки НКВД"
 RUS_NKVD_security_training_desc: "Дивізія НКВД Бунькова, розміщена в Маґнітоґорску, залізною рукою правила тією землею з тіні, попри все утримуючи при владі спочатку Лисєнка, а потім і себе. Їхні особливі таланти знайдуть добре застосування після залучення агентів до наших служб безпеки й розвідки."

 ### Siberian Plan ###
 RUS_legacy_of_the_siberian_plan: "Спадщина Сибірського плану"
 RUS_legacy_of_the_siberian_plan_desc: "Наша держава розташована в унікальній частині Росії - колишньому осередку грандіозного промислового проєкту Бухаріна та Центральносибірської Республіки. Здобуття обладнання та інфраструктури й відновлення окремих частин Сибірського плану принесуть нашій державі величезну користь."

 SIB_plan_reduce: "Бонус Сибірського плану буде зменшено на 45%."

 RUS_naval_rearmament_program: "Програма переозброєння флоту"
 RUS_Naval_Deccat_Socialist: "Червонопрапорний Тихоокеанський флот"
 RUS_Naval_Deccat_Chita: "Імперський флот"
 RUS_Naval_Deccat_Amur: "Всеросійський флот"
 RUS_Naval_Deccat_Magadan: "Національний флот"
 RUS_Naval_Deccat_MGS: "Морські гармати патріотів"
 RUS_naval_rearmament_program_desc: "Тривають програми переозброєння флоту, покликані прискорити розвиток сучасного сибірського військово-морського флоту."

###Far East economic decisions###

 far_east_dev_category: "Розвиток Далекого Сходу"
 far_east_dev_category_desc: "Територія російського Далекого Сходу перебуває у вкрай хиткому становищі. Її землі значно неродючіші за землі наших західних сусідів, що живляться плодами Сибірського плану Бухаріна. Щоб протистояти цій майбутній загрозі, поліпшити життя наших громадян і зміцнити національну економіку, ми маємо обробити ці безплідні поля й видобути приховані під землею дорогоцінні невикористані ресурси.\n\nОкрім можливих покладів у землі, наше розташування на Далекому Сході дає ще одну перевагу. Порт Маґадана - єдиний вільний порт, що забезпечує життєво важливий торговельний шлях. Наша економіка буквально чекає на бурхливе зростання. Треба лише почати."
 expand_Kolyma: "Розширити Колимську трасу"
 expand_Kolyma_desc: "Колимська траса простягається через російський Далекий Схід і сполучає життєво важливий порт Маґадана із заходом. Це надзвичайно важливий шлях, що допомагає нам поширювати силу на захід, а заодно дає людям змогу подорожувати. У нинішньому стані Колимська траса не витримає безперервного потоку транспорту та військ. Тож ми вирішили розширити її відповідно до нашої дедалі більшої потреби в належній інфраструктурі на всьому Далекому Сході."
 Purchase_icebreakers: "Замовити криголами"
 Purchase_icebreakers_desc: "Щоб збільшити пропускну здатність порту Маґадана, нам потрібні криголами для очищення Охотського моря від криги."
 foray_into_yakutia: "Експедиція до Якутії"
 foray_into_yakutia_desc: "Попередні розвідки свідчать, що Якутія сповнена багатств. Однак через її віддаленість і суворі умови для їх видобутку знадобляться цілеспрямовані зусилля."
 expand_Petropavlovsk: "Розширити Пєтропавловск"
 expand_Petropavlovsk_desc: "Пєтропавловск - кепський торговельний порт, тут нічого прикрашати. За сотні кілометрів від найближчого важливого населеного пункту й за тисячі від майбутньої лінії фронту він видається лише замерзлим білим слоном. Проте він розташований зовсім поруч з американцями, і його розширення може заохотити їх постачати нам товари й, можливо, торгувати з нами, водночас дещо послабивши тиск на Маґадан."
 expand_Irkutsk: "Залучити іноземні компанії до Іркутска"
 expand_Irkutsk_desc: "Іркутск - одна з найбільш населених частин нашого регіону, тож іноземні інвестори можуть вважати його стратегічним місцем для розширення діяльности й виходу на російський ринок. Ми не заважатимемо їм, доки наша держава може мати користь від їхньої присутности."
 khabarovsk_special_zone: "Домагатися створення Хабаровської особливої економічної зони"
 khabarovsk_special_zone_desc: "Хоч Японія віддала нам усі наші законні землі на Амурі, у Маньчжурії досі залишається чимало росіян, зокрема в Хабаровску та Владивостоці. Владивосток далеко й перебуває під міцним японським контролем, а Хабаровск ніколи не був по-справжньому пов'язаний із маньчжурським промисловим комплексом, і його російське населення завдавало чимало клопоту маньчжурському власникові. Ми могли б попросити відкрити в Хабаровску філію нашої компанії, щоб повністю використати потенціял міста, водночас запустити щупальця в місцеве населення та ширити слово Вождя."
 repair_railway_to_mck: "Відновити російсько-маньчжурську залізницю"
 repair_railway_to_mck_desc: "Ще до великої катастрофи, що спіткала Батьківщину, стара імперська колія здебільшого занепала. Через повну байдужість колишнього маньчжурського власника сполучення з Амуром і головними маньчжурськими залізничними лініями так і не відновили. Ми можемо втрутитися, полагодити його й полегшити торгівлю з Маньчжурією та Сферою, зменшивши залежність від Маґадана."
 ice_breaker_Okhotsk_sea: "Криголам в Охотському морі"
 ice_breaker_Okhotsk_sea_desc: "Відсутність регулярного сполучення між Маґаданом і Пєтропавловском заважає подальшому розширенню торгівлі. Американці запропонували збудувати кілька криголамів, щоб збільшити потік перевезень"

 foreign_business_bureau: "Створити БІП"
 foreign_business_bureau_desc: "«Бюро іностранного прєдпріятія», або Бюро іноземного підприємництва, - це організація, яку ми маємо намір створити, щоб використати наше становище єдиної та найкращої брами до внутрішньої Росії. Вона допоможе нам узгоджувати зусилля іноземних компаній із державним баченням, а також фінансувати деякі ініціятиви за кордоном."
 northeastern_factories: "Північно-східні фабрики"
 northeastern_factories_desc: "Створивши особливі зони на шляху до Маґадана й Маньчжурії, ми плануємо залучити іноземні компанії, збільшити прибутки та забезпечити себе споживчими товарами."
 transpacific_trade: "Транстихоокеанська торгівля"
 transpacific_trade_desc: "Далекий Схід - суворий, холодний і безплідний край, де їжі мало, а ротів багато. Ми перебуваємо занадто близько до голоду, тоді як чимало країн за Тихим океаном шукають ринки для збуту продовольства, але мають слабку промисловість. Ми можемо скористатися своїм становищем і продавати їм жадані метали для живлення промисловости в обмін на їжу для наших робітників"
 mission_to_siberia: "Місія до Центрального Сибіру"
 mission_to_siberia_desc: "Хаос після Сибірської війни знищив зв'язок між Далеким Сходом і Центральним Сибіром. Тепер, коли ситуація, схоже, знову стабілізується, а ми є їхнім найближчим виходом до зовнішнього світу, можемо спробувати встановити контакт і з'ясувати, про яку угоду можна домовитися."
 open_to_siberia: "Налагодити зв'язки з Центральним Сибіром"
 open_to_siberia_desc: "Держава [CSB.getAdjective] прихильно прийняла нашу місію й зацікавилася створенням особливого сполучення між нами: схоже, вона прагне укласти угоду, за якою певна кількість її потягів зможе користуватися нашими залізницями, аби її товари діставалися Маґадана з мінімальним митом. Це пожвавить торгівлю, збільшить наші прибутки й, що найважливіше, поліпшить відносини з дуже важливим сусідом."
 special_pipeline: "Спеціальний коридор"
 special_pipeline_desc: "Наша місія до держави [CSB.getName] не дала результатів. За кордоном ми знайшли лише ворога. Проте ми обоє в скруті: вони шукають шлях із Росії для своїх товарів і великої промисловости, народженої Сибірським планом, а ми шукаємо все, що дасть більше прибутків і промисловости. Можна спробувати укласти особливу угоду: дозволити їхнім потягам прямувати до Маґадана, єдиного вільного російського порту, а звідти до всього світу, але за чималу плату й частку їхнього продовольства.\n\nМи знаємо, що така угода не триватиме вічно, але вона може дати нам перевагу, потрібну, щоб невдовзі позмагатися з державою [CSB.getAdjective]."
 recruit_foreign_specialist: "Залучити іноземних фахівців"
 recruit_foreign_specialist_desc: "Залучити іноземних фахівців, щоб навчити нашу адміністрацію та фабрики найновіших світових методів"
 attract_canadian_mining_companies: "Залучити канадські видобувні компанії"
 attract_canadian_mining_companies_desc: "Нам бракує засобів, машин і знань для розробки багатств далекосхідної землі. Залучивши кілька стратегічно важливих компаній, ми зможемо розвинути наш край"
 american_econ_mission: "Американська економічна місія"
 american_econ_mission_desc: "Привілейовані зв'язки з американцями відкрили нам доступ до американського капіталу, а американські підприємці зацікавилися нашою землею. Узгодьмо їхні зусилля, щоб збагатити Росію!"
 Russo_manchu_mining_companies: "За дивним поворотом подій тепер росіяни просять маньчжурів допомогти їм розробляти землю. За цим тимчасовим приниженням, однак, ховається блискуча нагода: вічно голодні до нової сировини й металу, маньчжури виявилися майстрами видирати ресурси із землі й перетворювати їх на гроші. Дуже доречна здібність для нашої ох і спраглої до грошей країни."
 jap_econ_mission: "Японська економічна місія"
 jap_econ_mission_desc: "Наші зв'язки з Японією та близькість до неї мають чудово заохотити її підприємства розширювати діяльність у наших землях. Узгодьмо ці зусилля"
 
 make_Magadan_big_big: "§GЦе значно збільшить наші можливості в Маґадані§!"
 make_Magadan_big: "§GЦе збільшить наші можливості в Маґадані§!"
 Magadan_income: "Це збільшить наші прибутки від Маґадана"
 Magadan_income_growth: "Це збільшить наші прибутки й економічне зростання від Маґадана"
 us_friendly: "Між державою [Root.getName] та США триває активна дипломатія"
 japan_friendly: "Між державою [Root.getNamedef] та Японією §Gтриває активна дипломатія§!"
 japan_non_hostile: "Відносини між державою [Root.getNamedef] та Японією не є §Rворожими§!"
 FST_not_winter: "Зараз не арктична зима (§Yлистопад - квітень§!)"
 has_Magadan_space: "Ми можемо розширити свою діяльність у Маґадані"
 FST_US_non_hostile: "Відносини зі США не є ворожими"
 FST_started_both_econ_diplo: "Розпочато дипломатичні й економічні заходи"
 consume_Magadan_capacity: "Це зменшить залишок наших можливостей у Маґадані"
 has_Magadan_space_lot: "Ми можемо значно розширити свою діяльність у Маґадані"
 FST_Magadan_trade: "Прибутки порту Маґадана"
 
 ### Far-East Repop Decisions ###
 RUS_FE_repopulation_decisions: "Проблема людських ресурсів"
 RUS_FE_repopulation_decisions_desc: "[GetSibManpowerDescription]\n\n[GetSibRepopText]\n\n[GetSibImmigrationText]"
 RUS_FE_AMR_manpower_decision_desc: "Війна, погане врядування та хвороба §Rбільшовизму§! залишили нашу любу Росію в скрутному становищі. Царі й цариці не дбали про добробут народу, а лиховісні §Rжиди§!, що керували §RНечестивим Союзом§!, бачили в Батьківщині лише знаряддя для своїх мерзотних задумів. Тому ключова політика РФП полягає не лише в заохоченні §Mповернення росіян додому задля відбудови Батьківщини§!, а й у тому, щоб кожна російська жінка доклала всіх зусиль, аби §nпривести у світ більше росіян§!. Завдяки недавнім перемогам нашого руху ми нарешті можемо виправити ці історичні помилки та поліпшити демографічне становище Росії."
 RUS_FE_MAG_manpower_decision_desc: "Роки були немилосердні до Росії. За жорстокістю царів настав терор §Rчервоної загрози§! - тієї самої руйнівної сили, що втоптала нашу любу Батьківщину в землю й дозволила Німеччині окупувати найбільші міста країни. Проте не все втрачено: тепер, коли наша частина Сибіру об'єднана під нашою владою, ми маємо зробити все можливе, щоб подолати демографічну кризу й знову поставити Росію на ноги. Міцно контролюючи порт Маґадана, ми можемо §Mй далі заохочувати російських емігрантів повертатися додому через Маґадан§!, а завдяки поліпшенню врожаїв після повернення орних земель Амуру від нашого старого «друга» Родзаєвского можемо дозволити собі державну політику §nзаохочення російських родин мати більше дітей§!."
 RUS_FE_CHT_manpower_decision_desc: "Від часу загибелі Романових Росія знала лише нужду й відчай, бо не мала свого §gЦаря§!, який указував би їй шлях. Після поразки відважної §WБілої армії§! від рук §Rбільшовиків§! Росія пережила внутрішній і зовнішній геноцид, утративши землі та людей, необхідних для існування держави. Але тепер, коли в нашому куточку Сибіру відновлено владу благословенного §gЦаря§!, ми можемо активно виправляти цю демографічну катастрофу й повернути Матінці Росії колишню славу. Маючи під контролем порт Маґадана, ми можемо §Mактивно заохочувати російських емігрантів повернутися додому й допомогти відбудувати Батьківщину§!, а завдяки поліпшенню врожаїв після повернення орних земель Амуру забезпечити достатньо продовольства, щоб виправдати державну політику §nзаохочення російських родин мати більше дітей§!."
 RUS_FE_IRK_manpower_decision_desc: "Попри тимчасові невдачі від початку Великої Вітчизняної війни, Президія Вєрховного Совєту змогла відновити совєцький порядок і контроль у бунтівних районах Східного Сибіру. Більшість наших технічних труднощів може розв'язати НКВД, але про демографічне становище Сибіру цього не скажеш. Через неналежне планування попередньої адміністрації ми відчуваємо нестачу робочої сили, яка, якщо її не усунути, завадить досягненню наших довгострокових економічних і військових цілей. Завдяки далекоглядності совєцької держави ми ще від 1944 року §nзаохочуємо совєцьких жінок мати більше дітей§!. Після перенесення уряду до Іркутска й спричиненого цим скорочення доступних ресурсів програму було згорнуто, однак повернення совєцького Далекого Сходу дає змогу розширити її далеко за межі, встановлені два десятиліття тому. До того ж тепер, коли законний совєцький уряд знову контролює останній дієвий порт Союзу, ми можемо §Mпочати повертати додому тимчасово переселених совєцьких громадян§! з-за кордону: відділ Агітпропу заохочуватиме їх повернутися, а економісти обчислюватимуть ідеальний рівень компенсації."
 RUS_FE_BRY_manpower_decision_desc: "Історія Росії - це одна трагедія за іншою. Століттями народ жив під ярмом царя, який бачив у ньому лише худобу для власного визиску. §RЛєнін§! намагався дати людям перепочинок від цієї історичної закономірности, але йому завадила §WБіла армія§!, а його спадщину скували фракційні чвари подальшої громадянської війни. Багато хто вважав, що останню надію буде знищено, коли §RВелика Вітчизняна війна§! завершилася перемогою §gфашистів§!, але ми довели, що вони помилялися. Тиранів і зліва, і справа вигнано з нашого куточка Сибіру, й тепер ми маємо шанс відбудувати Союз. Однак роки війни й повсюдна байдужість до страждань народу призвели до демографічної катастрофи, яку необхідно подолати, якщо ми хочемо досягти успіху нашої §Rреволюції§!. Міцно контролюючи єдині дієві порти Росії, ми можемо §Mпочати повертати додому совєцьких емігрантів§!, а завдяки поліпшенню врожаїв після повернення орних земель Амуру маємо відносний надлишок продовольства, потрібний для державної політики §nзаохочення совєцьких жінок мати більше дітей§!, хоча заради цього, можливо, доведеться поступитися деякими ідеалами."
 
 RUS_FE_AMR_manpower_repop_0: "Нашу §nзародкову програму відновлення населення§! запроваджено як одну з перших політик РФП після нашого утвердження в Амурі. Наш рідний регіон благословенний найкращими орними землями російського Далекого Сходу, тож ми маємо унікальну змогу підтримувати цей амбітний задум із відродження Батьківщини. Нині програма складається із §Jсильного політичного заохочення§! та §Jдержавних продовольчих пайків§! для родин, що виховують кількох дітей і дотримуються доброї моралі; очікується, що це збільшить народжуваність на §n5%§!. Маючи в розпорядженні всі ресурси Далекого Сходу, наше Міністерство продовольства й сільського господарства вважає, що програму можна розширити. Більші соціальні виплати родинам, які виховують іще більше дітей, та активніше використання державних засобів масової інформації для мотивації громадян мають забезпечити стале зростання народжуваности на всіх наших територіях."
 RUS_FE_AMR_manpower_repop_1: "Нашу §nпрограму відновлення населення§! запроваджено як одну з перших політик РФП після нашого утвердження в Амурі, й відтоді ми лише нарощували зусилля зі збільшення народжуваности. Нині програма складається із §Jсильних фінансових заохочень§! та §Jдержавного визнання§! для родин, що виховують додаткових дітей і дотримуються доброї моралі; разом із §Jпропагандистською кампанією§! це має збільшити народжуваність на §n20%§!. Наші аналітики вважають, що цей показник можна додатково підвищити завдяки посиленій підтримці вдів і вдівців."
 RUS_FE_AMR_manpower_repop_1_tt: "Посилені фінансові заохочення для російських подружніх пар за кожну дитину після четвертої мають збільшити народжуваність у наших землях, а також кількість здорових шлюбів і стабільних домогосподарств. Крім того, матері, що виявили взірцеві материнські якості й виконали патріотичний обов'язок, народивши п'яту російську дитину, отримають офіційну державну нагороду: §fХрест чести російської матері§!."
 RUS_FE_AMR_manpower_repop_2: "Нашу §nрозширену програму відновлення населення§! запроваджено як одну з перших політик РФП після нашого утвердження в Амурі, й відтоді наші зусилля зі збільшення населення дедалі міцнішають. Нині програма складається із §Jсильних фінансових заохочень§! та §Jдержавного визнання§! для родин, що виховують додаткових дітей і дотримуються доброї моралі, а також §Jпосиленої державної підтримки вдів§!. Разом із іще §Jінтенсивнішою пропагандистською кампанією§! ці заходи мають збільшити народжуваність на §n35%§!. Наші аналітики вважають, що всі можливості подальшого збільшення цього показника вичерпано."
 RUS_FE_AMR_manpower_repop_2_tt: "Підвищенню народжуваности заважає чимало прикрих перепон, як-от кількість родин, знищених лихоліттям війни, та тривала підривна діяльність §Rбільшовиків§!, що прагнуть відвернути жінок від їхніх жіночих обов'язків. Якщо держава допомагатиме вдовам, які подадуть заявку до програми пошуку придатних чоловіків, і надаватиме їм подальшу фінансову підтримку, кількість стабільних, повноцінних родин у наших землях має зрости. Крім того, буде запроваджено додатковий ступінь §fХреста чести російської матері§! для патріотичних російських жінок, які народять восьму дитину, а батьки багатьох дітей отримають субсидії на житлові позики."
 
 RUS_FE_AMR_manpower_immigration_0: "§MНаразі ми не маємо організованої всеросійської програми реміграції§!. Через невпинне очорнення нашого доброчесного руху запеклими ворогами Росії всередині та за межами країни організувати серйозне повернення російських емігрантів до Батьківщини буде дуже складно. Міністерство народної просвіти вважає, що для остаточного розв'язання проблеми потрібно зробити людям надзвичайно привабливу пропозицію. Однак за даними Міністерства праці, недавнє збільшення кількости вільних осель завдяки нашим §dпрограмам переселення робітників§! може забезпечити доступний вихід, який водночас дасть змогу русифікувати деякі бунтівні тубільні провінції Сибіру: російським патріотам, що повертаються, запропонують дешеві земельні ділянки й роботу в Якутску."
 RUS_FE_AMR_manpower_immigration_1: "Наразі ми підтримуємо §Mактивну програму реміграції§!. Ми приваблюємо російських емігрантів дешевими земельними ділянками й квартирами в Якутску та навколишніх районах, конфіскованими в різних якутських повстанців і зрадників Батьківщини. Переселенці до Росії отримують особливу опіку й ставлення, щоб полегшити їхню реінтеграцію до нашої Всеросійської держави після життя за кордоном. §WАлєксандр Болотов§! запевняє, що його люди непомітно наглядатимуть за цими громадами, а вся кореспонденція до їхньої прийомної батьківщини залишатиметься позитивною. Сподіваємося, з часом це поліпшить наш образ серед російських емігрантів."
 RUS_FE_AMR_manpower_immigration_1_tt: "Оселі, що звільнилися після придушення якутського опору нашій державі, слід розподілити поміж патріотичними росіянами за кордоном. Будь-яка особа російського походження може подати заявку на значно субсидовану земельну ділянку в Якутії за умови проходження обов'язкової перевірки на підривну діяльність. Щоб поліпшити наш образ за кордоном, переселенці до Якутії отримають особливе ставлення. На знак вдячности за їхню готовність допомогти у відбудові Росії переселеним якутам скоротять вироки за зраду в трудових бригадах до якихось семи років."
 RUS_FE_AMR_manpower_immigration_2: "Наразі ми підтримуємо §Mрозширену програму реміграції§!. Ми не лише надаємо патріотичним росіянам значно субсидовану землю, а й активно повертаємо тих, хто здобув за кордоном досвід промислової праці, пропонуючи їм додаткові високооплачувані робочі місця. §WАлєксандр Болотов§! та його люди й далі пильно стежать за громадою поверненців, що обтяжує наші служби безпеки. Ми хотіли б розширити програму в майбутньому, але вважаємо, що до національного возз'єднання вона вже досягла найбільших можливих масштабів."
 RUS_FE_AMR_manpower_immigration_2_tt: "Наші зусилля із заселення Якутска дали певні плоди, тож тепер можна ширше повертати додому російських емігрантів. Ми поширюватимемо своє послання повсюдно й заохочуватимемо росіян у Європі, Америці та інших краях повертатися додому, пропонуючи їм значно субсидовану землю й добре оплачувану роботу у видобувній галузі. Переконати емігрантів і досі непросто, але, принадивши їх належною морквиною, ми сподіваємося, що вони схаменуться й повернуться відбудовувати Батьківщину"
 RUS_FE_AMR_manpower_immigration_3: "Наразі ми підтримуємо §Mрозширену програму реміграції§!. Ми не лише надаємо патріотичним росіянам значно субсидовану землю, а й активно повертаємо тих, хто здобув за кордоном досвід промислової праці, пропонуючи їм додаткові високооплачувані робочі місця. До того ж ми здійснюємо §Mвсеросійську програму репатріяції§!, покликану переселити до Батьківщини багато тисяч росіян, які досі живуть у Маньчжурії, що дасть змогу поступово скоротити частину нашої виправно-трудової сили. Попри численні труднощі в поверненні загублених синів і дочок Росії, тепер ми можемо сказати, що програма досягла найбільшого можливого успіху й можливості для подальшого розширення вичерпано."
 RUS_FE_AMR_manpower_immigration_3_tt: "На південь від нас лежать неосяжні російські землі, які від остаточного розпаду §RНечестивого Союзу§! перебувають під владою маньчжурів. Хоч наш §WВождь Константін Родзаєвскій§! сподівається зрештою возз'єднати весь регіон із Росією, у короткій перспективі, можливо, доведеться задовольнитися використанням нашого впливу на місцеву владу для організації програми репатріяції тисяч росіян, які досі живуть під маньчжурським урядом. Однак це буде дорого. Політично знадобляться переговори й відмова від частини наших важелів для майбутнього повернення регіону. Економічно очевидними є витрати на переселення десятків тисяч людей за дуже короткий час і пошук роботи для них, що можливо лише через перерозподіл майна колишніх учасників виправно-трудових сил та поступове надання їм оплачуваної роботи в галузях, де ми нині покладаємося на виправно-трудові загони"

 RUS_FE_MAG_manpower_repop_0: "Наразі §nми не здійснюємо активної програми відновлення населення§!, бо відмовилися від цієї політики РФП після утвердження в менш родючих землях Маґадана. Запровадивши додаткові пільги для створення родин і виховання дітей, ми зможемо прискорити зростання населення."
 RUS_FE_MAG_manpower_repop_1: "Нашу §nпрограму відновлення населення§! запроваджено, і вона починає давати результати. Нині вона складається з §Jфінансових заохочень§! та §Jдержавного визнання§! батьків, які виховують кількох здорових дітей. Разом наші зусилля мають збільшити народжуваність на §n10%§!. Наші аналітики вважають, що цей показник можна додатково підвищити, збільшивши масштаб програми й пільги"
 RUS_FE_MAG_manpower_repop_1_tt: "Ми почнемо збільшувати населення, фінансово заохочуючи пари одружуватися й народжувати більше дітей. Крім того, запровадимо офіційний державний орден на знак визнання їхньої служби Батьківщині через створення великої та здорової родини: §JОрден батьківської слави§!"
 RUS_FE_MAG_manpower_repop_2: "Нашу §nпрограму відновлення населення§! розширено, і вона дає добрі результати. Нині вона складається із §Jсильних фінансових заохочень§! та офіційних §Jдержавних почестей§! для батьків, які виховують багато здорових дітей. Разом наші зусилля мають збільшити народжуваність на §n20%§!."
 RUS_FE_MAG_manpower_repop_2_tt: "Ми посилимо зусилля зі збільшення населення, надавши додаткові фінансові заохочення парам одружуватися й народжувати більше дітей. Крім того, запровадимо другий ступінь §JОрдена батьківської слави§! для родин, які виявили виняткову відданість державі, привівши у світ щонайменше вісьмох здорових дітей"
 RUS_FE_MAG_manpower_repop_3: "Наша §nпрограма відновлення населення§! досягла межі, яку можуть витримати економіка й сільське господарство, та дає дуже добрі результати. Нині вона складається із §Jсильних фінансових заохочень, великої пропагандистської кампанії§! й офіційних §Jдержавних почестей і пільг§! для батьків, які виховують багато здорових дітей. Разом наші зусилля мають збільшити народжуваність на §n35%§!. Ми зробили все можливе, щоб виправити демографічне становище Батьківщини, і можемо лише молитися, щоб цього вистачило"
 RUS_FE_MAG_manpower_repop_3_tt: "Вождь бажає, щоб у світ приходило більше російських дітей. Ми посилимо зусилля зі збільшення населення, надаючи родинам нові фінансові заохочення, а неодружених і бездітних обкладатимемо додатковими податками, підштовхуючи їх до виконання патріотичного обов'язку перед Батьківщиною. Крім того, розпочнемо наполегливу пропагандистську кампанію й збільшимо державні пільги для кавалерів §JОрдена батьківської слави§!."

 RUS_FE_MAG_manpower_immigration_0: "§MНаразі ми здійснюємо зародкову організовану програму реміграції§!. Завдяки єдиному доброму порту Росії, робочим відносинам з ОВН і певною мірою з російськими емігрантами ми вже певний час повертаємо найбільш відважних патріотів. Наші експерти вважають, що тепер, коли Далекий Схід міцно перебуває під нашим контролем, ми можемо створити програму, яка активніше заохочуватиме росіян за кордоном повертатися додому й відбудовувати Батьківщину."
 RUS_FE_MAG_manpower_immigration_1: "Наразі ми підтримуємо §Mактивну програму реміграції§!. Вона вже дає плоди: завдяки узгодженим зусиллям із повернення людей додому та нашим зв'язкам з §QОВН§! щомісяця повертається сталий потік емігрантів. Ми шукаємо способи розширити охоплення, як завдяки портовим можливостям, так і дозволивши Радіо «Вільний Маґадан» вести особливі передачі за кордон багатьма мовами."
 RUS_FE_MAG_manpower_immigration_1_tt: "Завдяки досвіду, здобутому за тривалий час контролю над портом Маґадана, ми можемо відносно легко розширити програму реміграції. Наше міністерство закордонних справ активніше повертатиме додому росіян, що живуть за кордоном, поширюючи поміж емігрантів інформацію про переваги повернення до справжньої російської держави. Крім того, вони отримають фінансові заохочення до повернення. Хоч це й дорого, більшість із них живе краще за нас у Сибіру, тому їхнє повернення має принести вливання грошей у нашу економіку."
 RUS_FE_MAG_manpower_immigration_2: "Наразі ми підтримуємо §Mмасштабну програму реміграції§!, а також використовуємо §Mкороткохвильове радіомовлення§!, щоб охопити більше росіян за кордоном. Простір для подальшого розширення є, але в партії немає єдности: стара гвардія воліє зосередитися на російських емігрантах, а ця справа вже досягла межі. Натомість розширення обсягу наших зусиль підтримують лише реформісти, яким для просування своєї програми потрібен контроль над більшістю в партії."
 RUS_FE_MAG_manpower_immigration_2_tt: "Ми збільшимо фінансування програми й активно шукатимемо росіян із досвідом бюрократичної роботи, пропонуючи додаткові заохочення повернутися до Батьківщини. На додачу до фізичних програм ми використаємо §OРадіо «Вільний Маґадан»§!, щоб завдяки короткохвильовим передачам багатьма мовами вийти на закордонні ринки й охопити більше росіян за кордоном."
 RUS_FE_MAG_manpower_immigration_3: "Наразі ми підтримуємо §Mрозширену програму реміграції зі спрощеними подорожами з блоку §QОВН§! до нашої держави§!, підсилену §Mактивними міжнародними короткохвильовими передачами§! з Маґадана. Сталий потік емігрантів повертається до імперської Росії, а з Америк до наших земель прибуває помітна цівка шукачів пригод, тож програма досягла найбільшого можливого результату й дала значній кількості загублених синів і дочок Росії змогу повернутися додому."
 RUS_FE_MAG_manpower_immigration_3_tt: "Тепер, коли §sреформісти під проводом Пєтліна§! міцно контролюють нашу російську державу, ми нарешті можемо відкритися ОВН і спростити прибуття з Америк загалом та прихильних до ОВН держав зокрема. Це полегшить повернення емігрантів, а також створить нові можливості для європейців і американців, які шукають нового життя, пригод або повернення до консервативного порядку на російському Далекому Сході. Разом із цією реформою ми також підвищимо якість і дальність міжнародного короткохвильового мовлення Радіо «Вільний Маґадан». Чистіший звук із на 50% меншими перешкодами має більше сподобатися слухачам! Додатковою перевагою подальшого відкриття до ОВН та поліпшення відносин із блоком буде приплив людей, освічених у їхніх університетах, а також їхнього капіталу."
 
 RUS_FE_CHT_manpower_repop_0: "Наразі §nми не здійснюємо активної програми відновлення населення§!. Запровадивши додаткові пільги для створення родин і виховання дітей, ми зможемо збільшити народжуваність в Імперії."
 RUS_FE_CHT_manpower_repop_1: "Нашу §nпрограму відновлення населення§! запроваджено, і вона починає давати результати. Нині вона складається з §Jфінансових заохочень§! та §Jдержавного визнання§! батьків, які виховують кількох здорових дітей. Разом наші зусилля мають збільшити народжуваність на §n10%§!. Відділ охорони здоров'я вважає, що цей показник можна додатково підвищити, збільшивши масштаб програми й пільги."
 RUS_FE_CHT_manpower_repop_1_tt: "Ми почнемо збільшувати населення, фінансово заохочуючи пари одружуватися й народжувати більше дітей. Крім того, запровадимо імперську відзнаку за їхню службу §gЦареві§! й Батьківщині через створення великої та здорової родини: §JМедаль батьківської слави§!."
 RUS_FE_CHT_manpower_repop_2: "Нашу §nпрограму відновлення населення§! розширено, і вона дає добрі результати. Нині вона складається із §Jсильних фінансових заохочень§! та §Jофіційних державних почестей§! для батьків, які виховують багато здорових дітей. Разом наші зусилля мають збільшити народжуваність на §n20%§!."
 RUS_FE_CHT_manpower_repop_2_tt: "Ми посилимо зусилля зі збільшення населення Імперії, надавши додаткові фінансові заохочення парам одружуватися й народжувати більше дітей та врівноваживши їх податками на тих, хто відмовляється одружуватись і створювати родини. Крім того, запровадимо другий ступінь §JМедалі батьківської слави§! для родин, які виявили виняткову відданість своєму §gЦареві§! й Батьківщині, привівши у світ щонайменше вісьмох здорових дітей."

 RUS_FE_CHT_manpower_immigration_0: "§MНаразі ми не маємо організованої програми реміграції§!. Завдяки єдиному доброму порту Росії та добрим зв'язкам із консервативнішими колами російських емігрантів ми можемо створити програму, що заохочуватиме росіян за кордоном повертатися додому. До того ж вони привезуть із собою гроші й навички."
 RUS_FE_CHT_manpower_immigration_1: "Наразі ми підтримуємо §Mактивну програму реміграції§!. Хоч вона ще зародкова, завдяки нашим узгодженим зусиллям уже маємо сталий потік емігрантів, які щомісяця повертаються. Подальше розширення зусиль дасть нам змогу повернути додому вправних адміністраторів, прихильних до §WБілого руху§! та нашого §gЦаря§!."
 RUS_FE_CHT_manpower_immigration_1_tt: "Розпочавши програму реміграції, ми зможемо активніше повертати росіян з-за кордону: Імперське інформаційне бюро поширюватиме поміж російських емігрантів відповідні відомості. Крім того, вони отримають фінансові заохочення повернутися до свого §gЦаря§!. Хоч це й дорого, більшість із них живе краще за нас у Сибіру, тому їхнє повернення має принести вливання грошей у нашу економіку."
 RUS_FE_CHT_manpower_immigration_2: "Наразі ми підтримуємо §Mмасштабну програму реміграції§!. Завдяки їй ми поліпшили демографічне становище, а також повернули багатство й знання до Імперії. Програму можна розвивати далі, але ми не зможемо зробити це до остаточного врегулювання політичних суперечок у нашій Імперії. §WБіла армія§! хоче звернутися на південь, до §fСфери співпроцвітання§!. Натомість наш §gЦар§! уважає, що нам слід встановити зв'язки з громадами §QОВН§!. До розв'язання цього питання будь-яке подальше розширення програми призупинено."
 RUS_FE_CHT_manpower_immigration_2_tt: "Ми збільшимо фінансування програми й активно шукатимемо росіян із досвідом бюрократичної роботи, пропонуючи додаткові заохочення повернутися до Батьківщини й допомогти §gЦареві§! у відбудові нашої Імперії."
 RUS_FE_CHT_manpower_immigration_3_CPS: "§MНаразі ми підтримуємо розширену програму реміграції зі спрощеними подорожами з блоку §fСВС§! до нашої держави§!. Завдяки сталому потокові емігрантів, які повертаються до імперської Росії, програма досягла найбільшого можливого результату й дала значній кількості загублених синів і дочок Росії змогу повернутися додому."
 RUS_FE_CHT_manpower_immigration_3_CPS_tt: "Тепер, коли Імперія міцно перебуває під контролем §WБілої армії§! та прагматичнішого правителя, ми відчинимо двері для §fСВС§! і спростимо подорожі між нами. Це ще більше збільшить населення, адже ми значно ефективніше працюватимемо з емігрантською громадою на півдні, а також приваблюватимемо до Імперії досвідчених китайських і японських інженерів та промислових робітників"
 RUS_FE_CHT_manpower_immigration_3_OFN: "§MНаразі ми підтримуємо розширену програму реміграції зі спрощеними подорожами з блоку §QОВН§! до нашої держави§!. Завдяки сталому потокові емігрантів, які повертаються до імперської Росії, програма досягла найбільшого можливого результату й дала значній кількості загублених синів і дочок Росії змогу повернутися додому."
 RUS_FE_CHT_manpower_immigration_3_OFN_tt: "Тепер, коли любий народові §gЦар§! міцно контролює Імперію, ми нарешті можемо відкритися §QОВН§! і спростити прибуття з Америки та прихильних до ОВН держав. Це полегшить повернення емігрантів, а також прибуття європейців і американців, які шукають нового життя, пригод або повернення до консервативного монархізму на російському Далекому Сході. Подальше відкриття до ОВН та поліпшення відносин із блоком також дасть нам змогу привабити більше людей, освічених у їхніх університетах."

 RUS_FE_IRK_manpower_repop_0: "Наразі §nми здійснюємо скорочену версію заходів із відновлення населення§!, запроваджених 1944 року: §Jдержавні нагороди§! й §Jсоціальні пільги§! надаються патріотичним совєцьким жінкам, які виконують свій обов'язок у відважній боротьбі за поліпшення демографічного становища, збільшуючи народжуваність на §n5%§!. Завдяки більшим фінансовим ресурсам і доступу до орних земель."
 RUS_FE_IRK_manpower_repop_1: "Нашу §nпрограму відновлення населення§! розширено, і нині вона складається з §Jполітичних і фінансових заохочень§!, а також §Jдержавного визнання§! совєцьких матерів, які виховують кількох здорових дітей. Разом наші зусилля мають збільшити народжуваність на §n15%§!. Однак наші економісти вважають, що надалі розширювати програму без обмеження доступу жінок до роботи буде складно."
 RUS_FE_IRK_manpower_repop_1_tt: "Активна пропаганда, яка заохочує совєцьких жінок мати більше дітей, та програма збільшених державних пільг мають підвищити кількість дітей у кожної совєцької жінки. Крім того, ми відновимо додаткову фінансову допомогу патріотичним жінкам, які здобули звання §JМатері-героїні§! за народження десятьох або більше дітей."
 RUS_FE_IRK_manpower_repop_2: "Наша §nрозширена програма відновлення населення§! досягла вершини й дає позитивні результати, але поки що вичерпала можливості зростання. Нині вона складається із §Jсильних політичних заохочень§! та §Jофіційних державних почестей§! для совєцьких жінок, які народжують і виховують багато здорових дітей. Разом із нашим компромісом щодо ролі жінок у робочій силі ці зусилля мають збільшити народжуваність на §n25%§!."
 RUS_FE_IRK_manpower_repop_2_tt: "Ми посилимо зусилля зі збільшення населення, заохочуючи совєцьких жінок не вступати активно до робочої сили, доки вони не народять принаймні трьох дітей. Закони буде змінено, щоб надати податкові пільги подружнім парам, оплачені коштом вищих податків на неодружених, за винятком ветеранів, вдів і вдівців. Крім того, додаткові пільги для носійок звання §JМатері-героїні§! ще більше підвищать ефективність програми. Хоч це й обтяжить обсяги виробництва та фінанси, наші економісти вважають, що в довгостроковій перспективі ціна окупиться завдяки більшій кількості активних учасників робочої сили"

 RUS_FE_IRK_manpower_immigration_0: "§MНаразі ми не здійснюємо жодної активної програми реміграції§!. Створивши соціальні й економічні стимули до повернення та доручивши Агітпропу поширювати інформацію серед совєцьких емігрантів, ми зможемо заохотити совєцьких громадян повернутися до нового дому нашої революції."
 RUS_FE_IRK_manpower_immigration_1: "Наразі ми підтримуємо §Mобмежену програму реміграції§!, зосереджену на суворо контрольованих переселеннях, де НКВД наглядає за листуванням поверненців. Попри потребу в контролі, програма вже дає плоди: завдяки узгодженим заходам із надання інформації, засобів для подорожі й економічних стимулів до нас щомісяця повертається сталий потік колишніх совєцьких громадян. Утім нашим зусиллям шкодять проблеми з образом держави й нестача придатних для переселення районів, де не виникне ризику негативного міжнародного сприйняття. Більше фінансування має це виправити."
 RUS_FE_IRK_manpower_immigration_1_tt: "Маючи в руках порт Маґадана, ми можемо організувати скоординовані державні заходи, що заохочуватимуть колишніх совєцьких громадян повернутися додому й допомогти у відбудові країни - це перший із багатьох кроків до повернення наших тимчасово розпорошених громадян. Однак ми не можемо цілком їм довіряти, тому обмежимо переселення тими частинами Маґадана та Іркутска, які, як нам відомо, відповідають очікуванням іноземців."
 RUS_FE_IRK_manpower_immigration_15: "Наразі ми підтримуємо §Mсуворо контрольовану програму реміграції§!, зосереджену на суворо контрольованих переселеннях, де НКВД наглядає за листуванням поверненців. Попри потребу в контролі, програма вже дає плоди: завдяки узгодженим заходам із надання інформації, засобів для подорожі й економічних стимулів до нас щомісяця повертається сталий потік колишніх совєцьких громадян. Тепер, коли Якутск перетворено на відроджене місто соціялістичної праці, невдовзі ми будемо готові розширити програму реміграції. Звісно, всіх охочих переселитися до Якутска непомітно зареєстровано й перевірено"
 RUS_FE_IRK_manpower_immigration_15_tt: "Навіть за Бухаріна було звично дбати, щоб відвідувачам Совєцького Союзу показували все найкраще, що могла запропонувати країна. Адже залишки руйнувань від свавілля Білої армії в СССР або регіон, який іще не відчув усіх позитивних наслідків урядових реформ, завжди могли зашкодити образу країни. Якутск - ідеальне місце для проєкту відродження, покликаного створити в повернених совєцьких громадян якнайкраще враження про Совєцький Союз, що відновлюється. У регіоні не лише достатньо економічних можливостей, аби виправдати постійне його поліпшення, а й легко наглядати за всім, що входить і виходить. Поки тривають будівельні роботи, ми поширимо поміж совєцьких емігрантів звістку про хліб, землю й добре оплачувану працю, які чекають на них у колишній батьківщині."
 RUS_FE_IRK_manpower_immigration_2: "Наразі ми підтримуємо §Mконтрольовану програму реміграції§!, зосереджену на §Mконтрольованому переселенні до Якутска§!, щоб зберігати рівновагу між нашою потребою в нових відданих громадянах і потребою Союзу в безпеці. Ми вже досягли межі охоплення совєцьких емігрантів і тепер шукаємо інші можливості, адже досвід підтримання стабільности Якутска доводить, що ми здатні на більше, хоча й ризикуємо перевантажити служби безпеки."
 RUS_FE_IRK_manpower_immigration_2_tt: "Якутск підготовлено, НКВД стежитиме, щоб усе минуло без проблем, тож ми готові почати переселення до міста надійних кандидатів - цей взірець соціялістичної ефективности неодмінно вразить світ."
 RUS_FE_IRK_manpower_immigration_3: "Наразі ми підтримуємо §Mсуворо контрольовану й ретельно перевірену імміграційну програму§!. Її рушієм є §Mінтенсивна пропаганда, спрямована на соціялістичні громади СВС та ОВН§!. Послання світові про Якутск як соціялістичну утопію, де люди можуть відчути справжній соціялізм, розійшлося далеко, а наші служби безпеки наполегливо дбають, щоб до Союзу не потрапив жоден порушник і жодне погане слово про нього не вийшло за межі колишньої Республіки Якутія. Однак це межа реалістичного зростання програми, бо подальше розширення може поставити під загрозу безпеку Союзу."
 RUS_FE_IRK_manpower_immigration_3_tt: "Завдяки розширеній просвітницькій кампанії Агітпропу ми повідомимо всім у межах досяжности нашого радіомовлення, що Якутск - соціялістична утопія Сходу. Підвищення ефективности оперативників НКВД у забезпеченні стабільности досвіду поверненців дасть нам змогу поширити програму навіть на кандидатів із земель СВС та ОВН - звісно, якщо вони пройдуть нашу сувору перевірку"

 RUS_FE_BRY_manpower_repop_0: "Наразі §Mми не здійснюємо активної програми відновлення населення§!, адже після вигнання тирана Яґоди з Іркутска так і не відновили політики СССР. Якщо захочемо, то можемо поєднати економічні стимули й політичне заохочення, щоб совєцькі жінки народжували більше дітей без зречення наших ідеалів соціялістичної рівности."
 RUS_FE_BRY_manpower_repop_1: "Нашу §nпрограму відновлення населення§! відновлено в обмеженому масштабі. Нині вона складається з §Jполітичних і фінансових заохочень§!, а також §Jдержавного визнання§! батьків, які виховують кількох здорових дітей. Разом наші зусилля мають збільшити народжуваність на §n7.5%§!. Наші економісти вважають, що для ліпших результатів доведеться обмежити участь жінок у робочій силі"
 RUS_FE_BRY_manpower_repop_1_tt: "Ми почнемо збільшувати населення, доручивши Агітпропу заохочувати совєцьких жінок мати більше дітей. Крім того, відновимо §JОрден материнської слави§! для совєцьких жінок, які народять і виховають щонайменше сімох дітей, та надамо нагородженим низку додаткових економічних пільг."
 RUS_FE_BRY_manpower_repop_2: "Нашу §nпрограму відновлення населення§! розширено, і вона дає позитивні результати, але поки що вичерпала можливості зростання. Нині вона складається із §Jсильних політичних заохочень§! та офіційних §Jдержавних почестей§! для совєцьких жінок, які народжують і виховують багато здорових дітей. Разом із нашим обмеженим компромісом щодо ролі жінок у робочій силі ці зусилля мають збільшити народжуваність на §n15%§!."
 RUS_FE_BRY_manpower_repop_2_tt: "Ми посилимо зусилля зі збільшення населення, заохочуючи совєцьких жінок не вступати активно до робочої сили, доки вони не народять дітей. Крім того, одержувачки §JОрдена материнської слави§! матимуть додаткові пільги для полегшення економічного становища батьків. Діючи в невеликому масштабі, ми зможемо досягти цілей, не жертвуючи визволенням совєцьких жінок від старих класових структур"

 RUS_FE_BRY_manpower_immigration_0: "§nНаразі ми не здійснюємо жодної активної програми реміграції§!. Створивши соціальні й економічні стимули до повернення та доручивши Агітпропу поширювати інформацію серед совєцьких емігрантів, ми зможемо заохотити совєцьких громадян повернутися до нового дому нашої революції."
 RUS_FE_BRY_manpower_immigration_1: "Наразі ми підтримуємо §Mактивну програму реміграції§!. Вона вже дає плоди: завдяки узгодженим заходам із надання інформації, засобів для подорожі й економічних стимулів до нас щомісяця повертається сталий потік колишніх совєцьких громадян. Ми прагнемо розширити охоплення, підвищивши ефективність Агітпропу в поширенні інформації серед емігрантських громад, а також збільшивши соціальні пільги, що допоможуть їм розпочати нове життя в нашій Совєцькій Республіці."
 RUS_FE_BRY_manpower_immigration_1_tt: "Маючи в руках порт Маґадана, ми можемо організувати скоординовані державні заходи, що заохочуватимуть колишніх совєцьких громадян повернутися додому й допомогти у відбудові країни. Крім того, ми докладемо особливих зусиль для залучення людей із досвідом у промисловості й будівництві."
 RUS_FE_BRY_manpower_immigration_2: "Наразі ми підтримуємо §Mрозширену програму реміграції§!, що використовує §Mсучасну соціялістичну пропаганду§! для охоплення більшої кількости совєцьких громадян за кордоном. Наша справа поки що досягла межі зростання, але Відділ агітації та пропаганди вважає, що після подальшого розвитку Совєцької Республіки ми зможемо відкритися як притулок для соціялістів, яких утискають у всьому світі, організувавши їхнє переселення до нашого совєцького суспільства в обмін на участь у революційній справі."
 RUS_FE_BRY_manpower_immigration_2_tt: "Підвищивши ефективність зусиль Агітпропу з охоплення совєцьких емігрантських громад за кордоном і посиливши соціальні стимули до повернення, ми збільшимо дієвість програми."
 RUS_FE_BRY_manpower_immigration_3: "Наразі ми підтримуємо §Mглобальну програму соціялістичної міграції§!, підсилену §Mвсією міццю нашого Відділу агітації та пропаганди§!. Щомісяця до порту Маґадана прибувають тисячі соціялістів, які тікають від переслідувань із таких далеких країв, як Африка, Близький Схід і Південна Америка. Ми справді можемо назватися маяком світла в цьому світі, який дає надію пригнобленим під визискувальним ярмом і капіталістичних, і фашистських режимів"
 RUS_FE_BRY_manpower_immigration_3_tt: "Тепер, коли в нашому розпорядженні більшість ресурсів Сибіру, ми готові перетворити совєцьку програму реміграції на соціялістичну імміграційну програму, поширивши стимули до подорожі й переселення, раніше доступні лише совєцьким емігрантам, на переслідувані соціялістичні громади."

