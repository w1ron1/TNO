 #Warlord Development decisions
 warlord_development_decision_category: "Місцевий розвиток"
 warlord_development_decision_category_desc: "У суворих землях Росії численні держави воєначальників, розкидані степами, мусять вдаватися до... нетрадиційних засобів розвитку своїх володінь.\n\nВикористовуючи методи, які не спрацювали б у формальніших, цивілізованих державах, воєначальники мусять належно розпоряджатися своїм політичним впливом, щоб у майбутньому їхні невеликі володіння могли здолати ворогів."
 
