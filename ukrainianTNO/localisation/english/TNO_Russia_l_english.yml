### Ideas ###
 RUS_terror_bombing: "Терористичні бомбардування Люфтваффе"
 RUS_terror_bombing_desc: "З гнітючою регулярністю бомбардувальники Люфтваффе з летовищ Райхскомісаріяту Московієн пролітають над державами воєначальників Західної Росії, бомблять усе, що бачать, і внаслідок цього завдають тяжкої шкоди майже кожній царині життя росіян. Єдиним порятунком є Вільні авіатори, які намагаються перехопити їх за кожної нагоди. Якби не вони, становище в Росії було б значно гіршим."
 SIB_terror_bombing: "Терористичні бомбардування Люфтваффе"
 SIB_terror_bombing_desc: "З гнітючою регулярністю бомбардувальники Люфтваффе з летовищ Райхскомісаріяту Московієн пролітають над державами воєначальників Західної Росії, бомблять усе, що бачать, і внаслідок цього завдають тяжкої шкоди майже кожній царині життя росіян. Єдиним порятунком є Вільні авіатори, які намагаються перехопити їх за кожної нагоди. Якби не вони, становище в Росії було б значно гіршим."
 CEN_SIB_the_flight_east: "Втеча на схід"
 CEN_SIB_the_flight_east_desc: "Хоч Західноросійська війна завершилася майже десять років тому, Західна Росія так і не пізнала миру з німцями. Натомість життя раз по раз переривають бомбардування Люфтваффе - нескінченна кампанія терору, покликана назавжди скалічити колишнього супротивника.\n\nЧимало росіян навчилися жити серед цього насильства, та інші намагаються втекти від нього на схід. Цей постійний потік біженців назавжди змінив розподіл населення Росії, адже багато хто переселяється до далеких закутків країни, яких іще не торкнулася нацистська воєнна машина."
 RUS_FE_the_flight_east: "Втеча на схід"
 RUS_FE_the_flight_east_desc: "Хоч Західноросійська війна завершилася майже десять років тому, Західна Росія так і не пізнала миру з німцями. Натомість життя раз по раз переривають бомбардування Люфтваффе - нескінченна кампанія терору, покликана назавжди скалічити колишнього супротивника.\n\nЧимало росіян навчилися жити серед цього насильства, та інші намагаються втекти від нього на схід. Цей постійний потік біженців назавжди змінив розподіл населення Росії, адже багато хто переселяється до далеких закутків країни, яких іще не торкнулася нацистська воєнна машина."

 RUS_warlord_manpower: "Набір воєначальника"
