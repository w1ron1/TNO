 #####################
 RUS_tourist.1.t: "Відчалювання"
 RUS_tourist.1.d: "З компасом у руці й метеликами в животі він дивився на обриси Анкориджа, що стрімко меншали на обрії. Партія в карти й щедра порція алкоголю добряче підігріли його захват і жагу до мандрів, поки судно стояло в порту, але він мусив визнати: викинути з голови вчорашнє прощання було нелегко.\n\nРеакція матері його не здивувала: тихі схлипування й довжелезний перелік настанов біля вхідних дверей. Вона нервувала вже кілька тижнів, і весь цей час він щосили намагався її заспокоїти. Він мусив це зробити, уживе всіх можливих запобіжних заходів і матиме всі потрібні документи. Ця розмова, здавалося, не закінчиться ніколи. Ні, з мамою він владнав усі останні суперечки. Не вона породила цей жаль у його серці, що віддалялося морем. Як не дивно, це був тато.\n\nНазвати батька загадковим означало б нічого не сказати. Дитячих спогадів було безліч: пропущені бейсбольні матчі, дні народження без нього, односкладові відповіді на малюнки з дитсадка.\n\nНе те щоб татові було зовсім байдуже. Час від часу він виявляв любов, учив синів міняти пробите колесо. Проблемою була сталість, точніше її відсутність. Щомиті тато міг знову зникнути в підвалі, або машина виїжджала з подвір'я й поверталася через кілька годин після родинної вечері. Він ніколи не знав, що про це думати. Можливо, війна просто забрала надто багато й створила чоловіка, здатного жити лише на віскі та самотніх годинах.\n\nТож коли перед таксі тато розплакався, стиснув його у ведмежих обіймах і нишком передав синові компас та пістолет, перш ніж зачинилися дверцята, він не міг не розгубитися. Чи справді він ухвалив правильне рішення, якщо воно так сильно вплинуло на такого чоловіка?\n\nЗрештою він відігнав цю думку й повернувся під палубу. Шляху назад уже не було, а попереду чекала велика й захоплива пригода. Він повернеться живим і, зрештою, зміниться на краще."
 RUS_tourist.1.a: "Час дізнатися, що там на мене чекає..."
 
 RUS_tourist.2.t: "Несподіване прибуття"
 RUS_tourist.2.d: "До причалів Пєтропавловска-Камчатского прибуло судно з міста Анкоридж в американському штаті Аляска. Його єдиний пасажир - молодий американець на ім'я Стів Сміт, який називає себе самотнім туристом і має документи на підтвердження. Рішучий, але ще зелений, він навряд чи довго проживе в російській анархії, і саме від нас залежить, чи дістане він таку можливість.\n\nОблизнувши губи, Іван Юмашєв ще раз пробіг очима звіт і відклав його. Взявши цигарку - нині розкіш, яку, кажуть, награбували на японському судні, - він запалив її вільною рукою. Американський турист, еге ж? Таке щодня не побачиш. Можливо, варто особисто зустрітися з американцем перед його від'їздом і показати йому флот. Це бодай раз відвернуло б Юмашєва від жалюгідного стану ганебного піратства, до якого докотився Тихоокеанський флот."
 RUS_tourist.2.a: "Принаймні це справить враження на моряків."

 RUS_tourist.3.t: "Запис 1: Тихоокеанський флот"
 RUS_tourist.3.d: "Відвідини Камчатки виявилися насиченішими, ніж я очікував. Моряки на військових кораблях і причалах витріщалися на моє судно, коли воно зупинилося. Коли я сказав, що прибув з Америки, вони чомусь страшенно зраділи, а чимало з них захотіли потиснути мені руку. Я майже почувався знаменитістю. Це відчуття лише посилилося, коли адмірал Юмашєв, командувач цього «Тихоокеанського флоту», що контролює Камчатку, прийшов особисто зі мною зустрітися. Він сказав, що місто називається Пєтропавловск-Камчатскій, і провів мені екскурсію флотом. Адмірал був дуже люб'язним і терплячим, хоча його англійська була не найкращою. Він сказав, що вивчив її ще під час війни, тієї великої, тож уже зо два десятиліття не мав практики. Та все краще, ніж нічого.\n\nАле із флотом було щось не так. Кораблі застарілі, проте їм усе одно потрібні пальне й запчастини, а я не побачив ні промисловости для їх виробництва, ні торгових суден біля причалів. Я чув, що економіка Камчатки тримається на піратстві, але не думав, що такі хороші люди, як адмірал і ці моряки, підуть на таке. Та їсти треба всім, і якщо хоча б половина почутого мною про стан Росії правдива, то надто винуватити їх я не можу. Принаймні адмірал Юмашєв домовився про інше судно, яке відвезе мене до Маґадана."
 RUS_tourist.3.a: "Земля на обрії!"

 RUS_tourist.4.t: "Візит американця"
 RUS_tourist.4.d: "З Камчатки прибуло судно з цікавим пасажиром - американським туристом. Люди з-за кордону нечасто відвідують Росію, а надто американці. Зрештою, мало кому хочеться їхати до спустошених війною земель, особливо на розлогий і морозний Далекий Схід. Без нашої допомоги він, певно, і тижня не проживе, поки не замерзне насмерть. Не можна дозволити наївному американцеві загинути в глушині, тож ми маємо бодай надати йому притулок на кілька днів.\n\nМожливо, Матковскій навіть зустрінеться з ним! Як американець він може допомогти нам вийти на керівництво Сполучених Штатів. Ми завжди прагнули тісніших відносин з американцями, то чому б не почати зараз, коли один із них просто тут! Матковскій навіть вважає, що турист має зв'язки із ЦРУ. Яка удача!\n\nДо того ж це гарна нагода виявити гостинність. Американець неодмінно буде вражений зустріччю зі справжнім Вождем росіян! Так чи інакше, це справить добре враження й допоможе нам вирізнитися з-поміж усіх навколишніх воєначальників.\n\nА втім, можливо, краще й безпечніше просто провести йому загальну екскурсію Маґаданом. Побачивши місто, він краще зрозуміє справжнє життя в Росії, ніж після будь-якої зустрічі з Матковскім. До того ж Вождь - зайнята людина й може не захотіти марнувати час на потенційно нікчемного американця. То що: показати йому місто чи нехай Матковскій запросить його випити?"
 RUS_tourist.4.a: "Відправити його до Матковского й знайти найкращу горілку!"
 RUS_tourist.4.b: "Влаштувати йому екскурсію!"

 RUS_tourist.5.t: "Запис 2: Зустріч із Матковскім"
 RUS_tourist.5.d: "Сьогодні я зустрівся з маґаданським «Вождем» Міхаїлом Матковскім. Він видався доволі веселим і пригостив майже не жахливою горілкою, але загалом усе було досить дивно. Чомусь він постійно розпитував про мої зв'язки з президентом Ніксоном і ЦРУ. Може, річ у моїй зачісці?\n\nКоли я сказав, що я звичайнісінький американець, він трохи розчарувався. Потім спитав, як живеться в Америці й що я роблю в Росії. Я розповів, що вдома навчаюся в університеті, а сюди приїхав досліджувати Росію, трохи розважитися й пережити кілька пригод замість нудного домашнього життя. Не знаю, що він відповів, але, здається, щось на кшталт того, що мене застрелить перший-ліпший бандит. Ну й нехай. Тоді я випив іще кілька чарок і розповів йому, що мій тато - астронавт на таємній місії до Венери, а ще на війні вбив сто япошок одним пістолетом. Насправді він механік і завжди ним був. Матковскому, схоже, сподобалася історія, хоча я не знаю, скільки він зрозумів. Моя російська не найкраща.\n\nПісля зустрічі він подарував мені величезну ведмежу шкуру. Мабуть, її треба носити? Власної хутряної куртки мені й так вистачає, але я все одно прийняв подарунок. Шкура дуже тепла.\n\nДалі рушаю до Якутска, щоб побачити, що там відбувається."
 RUS_tourist.5.a: "Принаймні він добре провів час?"

 RUS_tourist.6.t: "Запис 2: Екскурсія Маґаданом"
 RUS_tourist.6.d: "Сьогодні мені провели екскурсію Маґаданом. Веселе містечко з безліччю барів. Щоправда, там подають лише горілку, і, чесно кажучи, вона жахлива. Морський порт, мабуть, єдина тут велика споруда. Проте в місті напрочуд затишно. Дивно затишно, бо можна пройти повз родину, що мирно вечеряє, а тоді глянути на інший бік вулиці й побачити, як офіцер-чорносорочечник гамселить волоцюгу. Та все одно затишно.\n\nЗдається, ніби крім Маґадана тут узагалі нічого немає, хоча мені сказали, що поруч є ще кілька сіл. Місце справді віддалене, тож сподіваюся знайти дорогу далі. Та й доріг у Росії небагато.\n\nПід час екскурсії я майже напевно бачив трудовий табір. Не знаю, чи це був саме він, але з того, як екскурсовод намагався мене туди не пустити, я майже певен, що в Маґадані є кілька населених трудових таборів. Сподіваюся, це буде найгірше з побаченого мною в Росії. Утім, гадаю, деякі місця можуть бути набагато гіршими.\n\nЗагалом Маґадан не такий уже й поганий. Але дуже сподіваюся, що не всі місця тут такі. Люди, схоже, пристосувалися до суворого життя. Одні краще за інших, та я радий, що приїхав. Час продовжувати подорож, а шлях попереду ще довгий."
 RUS_tourist.6.a: "Усе одно краще за Амур!"

 RUS_tourist.7.t: "Турист-янкі?"
 RUS_tourist.7.d: "Один із наших прикордонних постів уздовж Алдану повідомив про незвичного гостя з Маґадана.\n\nСпершу ми гадали, що він шпигун фашистської банди Матковского, але після ретельнішої перевірки з'ясувалося, що це не так. Чоловік пояснив, що він американський турист, який відвідує Росію, і надав докази на підтвердження цього шаленого твердження.\n\nМи не уявляємо, що могло спонукати людину, надто заможного американця, до такого вчинку, але загрози він начебто не становив, тож його відпустили до Якутска. З огляду на брак досвіду навряд чи він проживе довго, але ми можемо бодай показати йому нашу скромну республіку."
 RUS_tourist.7.a: "Хто при здоровому глузді вирішить, що Росія підходить для туризму?"

 RUS_tourist.8.t: "Запис 3: Якутія"
 RUS_tourist.8.d: "Переправа через річку до Якутії минула спокійніше, ніж я очікував. Спершу прикордонники поставилися підозріло, та я пояснив свої наміри. Гадаю, вони спочатку не повірили, але після мого паспорта й квитка до Маґадана відпустили мене до столиці.\n\nЯкутск був мирним, хоч і малолюдним. Мешканці привітні, але не надто люблять свій уряд. Наскільки я зрозумів, у Якутії панують гірничі компанії, які фактично купили політиків і часто знущаються з робітників. Зустрінуті шахтарі розповідали про тяжкі умови праці й мізерну платню.\n\nЗакупивши припаси й упорядкувавши записи, я попрощався та покинув столицю. За Якутском я майже нічого не бачив, окрім поодиноких сіл і кар'єрів, і переважно йшов уздовж Лєни до «Партизанської республіки» Алдан.\n\nЗ огляду на все почуте про Росію, мабуть, варто найняти провідника або охоронця. Майже всі співрозмовники сумнівалися, що я зможу обійти всю країну й повернутися до Штатів цілим. Тож я найняв провідницю, колишню партизанську снайперку Зою Васілєвну Фьодоровну (сподіваюся, написав правильно). Вона нібито прибула на Далекий Схід разом із совєцьким урядом і воювала проти німців. Не найпривітніша людина, зате досвідчена й сама обійшла значну частину Росії, тому здалася найкращим вибором. Почувши від якутів, наскільки небезпечний Іркутск, я вирішив натомість пройти через Амур! Зоя зраділа значно менше за мене, але невже там аж так погано?"
 RUS_tourist.8.a: "Принаймні вони були мирними."


 RUS_tourist.11.t: "Американець на кордоні?"
 RUS_tourist.11.d: "Наші люди на північно-західному кордоні, які стежать за покручами з Алдану, повідомили про новоприбулих.\n\nНевелика група, до якої входять росіянка й чоловік, що називає себе американцем, попросила дозволу ввійти на нашу територію. Чоловік стверджує, що хоче перетнути усю Росію, а тому прагне відвідати Зєю.\n\nНаші люди не знайшли підстав сумніватися в ньому чи його нібито справжніх документах. Однак ми мусимо бути обережними. Хоч це складно й тому малоймовірно, диверсанти з числа маґаданських відступників або чітінських пережитків могли підійти з боку Алдану, шукаючи слабше захищену прикордонну ділянку.\n\nОбидві групи понад усе бажають повалити Вождя й закувати його в кайдани. Або й гірше. Та якщо він справді той, за кого себе видає, перед нами золота нагода. Демонстрація сили й законности нашого уряду може посилити наш вплив у регіоні та неабияк наблизити регіональне, а згодом і національне панування.\n\nЗдається, вони не готують повстання проти Вождя, але наміри паразитів рідко бувають очевидними, навіть коли вони самі з'являються перед нами. Що з ними робити?"
 RUS_tourist.11.a: "Вони не становлять загрози. Нехай прямують до Зєї."
 RUS_tourist.11.b: "Заарештувати їх. Вони підлягають допиту."
 
 RUS_tourist.12.t: "Запис 5: Всеросійський уряд Амуру"
 RUS_tourist.12.d: "Хоч я й досі вдосконалюю російську, напружену ситуацію вже здатен зрозуміти. Саме така сталася під час нашої спроби перейти до Амуру.\n\nНас зупинив патруль украй суворих чоловіків, і я подякував долі за рішення найняти Зою. Завдяки поєднанню її скорострільної російської та моїх документів нам дозволили рушити до Зєї, столиці території та осідку другого Вождя РФП.\n\nМушу сказати, почувши в Маґадані, яке гнітюче місце Зєя зокрема й Амур загалом, я сумнівався. Більше не сумніваюся. Над усім висить пелена ледве стримуваного насильства й відчуття, що один хибний крок матиме негайні та жорстокі наслідки. Тепер я добре розумію, чому фракція Матковского відкололася від тутешньої.\n\nМи із Зоєю швидко налагодили взаємовигідну співпрацю й водночас поліпшуємо знання мов одне одного. Вона сказала, що відчуває те саме. Ніхто з нас не хоче затримуватися тут, тож за першої нагоди ми рушимо на захід, до краю, де, як мені сказали, зберігся осередок старого монархізму.\n\nІ в нього власні сварки з Амуром. Навіть не уявляю чому.\n\nЦе був жарт, Стіве. Навчися вже передавати сарказм на письмі."
 RUS_tourist.12.a: "Яке щастя буде покинути це місце."

 RUS_tourist.13.t: "Американсько-матковскійський агент?"
 RUS_tourist.13.d: "Ми ухвалили правильне рішення щодо прибулих з Алдану. Щойно наші люди спробували їх заарештувати, жінка, а за нею й «американець» почали чинити опір.\n\nІ тому з ними негайно розібралися.\n\nПозбувшись тіл, наші люди ретельніше оглянули їхні речі. У жінки не було нічого цікавого, крім кількох якутських дрібничок і стародавньої рушниці із західних земель, але в куртці фальшивого американця знайшли щоденник. А в ньому - одкровення.\n\nЧоловік і справді виявився американцем, який прибув через Пєтропавловск. Але де була його наступна зупинка? У Маґадані. Там його не лише прийняли в місті, а й особисто зустрів архізрадник Матковскій. Ми не знаємо, про що вони говорили, та з огляду на подальшу подорож, безперечно, про нас.\n\nЧутки про американську підтримку Матковского та його фракції ходять давно, і раптова поява цього чоловіка лише їх підсилила. Утім, хоч остаточна мета американця нам невідома, ми знаємо, що він її не досягне.\n\nТож ми можемо пишатися своєю пильністю, адже зірвали ще одну змову проти великої місії Вождя."
 RUS_tourist.13.a: "Ніхто не зупинить Вождя. Навіть американці."

 RUS_tourist.14.t: "Турист"
 RUS_tourist.14.d: "Сьогодні в Чіті здійнявся неабиякий галас: зі Сходу на наші землі прибув геть несподіваний гість. Прикордонники затримали молодика, якого спершу вважали шпигуном банди Родзаєвского, але насправді він виявився молодим американським студентом, що без лихого наміру мандрує спустошеними війною просторами Росії. Туристи нині велика рідкість, та небезпеки Росії його, схоже, не відлякали.\n\nПісля перевірки та звільнення він зрештою дістався Чіти й почав розпитувати місцевих. Новина про дивного гостя швидко досягла найвищих щаблів влади, і тепер сам цар Міхаїл II висловив бажання зустрітися з американцем. Ми, звісно, не бажаємо суперечити волі богопомазаного монарха, але, можливо, краще не дозволяти йому говорити із чужинцем..."
 RUS_tourist.14.a: "Можна влаштувати зустріч під пильним наглядом..."
 RUS_tourist.14.b: "Натомість він може поговорити з армією."

 RUS_tourist.15.t: "Запис 6: Чоловік, який мав стати царем"
 RUS_tourist.15.d: "Коли я прибув до Чіти, одразу стало очевидно, що тут зовсім інша атмосфера, ніж у Зєї. На вулицях досі були солдати, але люди не так боялися займатися своїми справами серед білого дня. Я вирішив опитати кількох містян, щоб краще відчути це місце, та доля приготувала зовсім інше. Якось мене зупинили на вулиці військові. Я подумав, що потрапив у халепу, але натомість мене відвезли до розкішного маєтку неподалік міста. Виявилося, цар, який нібито править тут, захотів побачити мене особисто.\n\nЦар Міхаїл II був зовсім не таким, як я уявляв. По-перше, він вільно говорив англійською з виразним британським акцентом. На моє питання він відповів, що це взагалі його рідна мова, а російську він іще вивчає. Тільки уявіть: чоловік, який має бути імператором Росії, навіть не володіє російською! До того ж він був дуже скромним і щиро захопився моєю подорожжю та тим, що я прибув сюди з Америки.\n\nКоли я продовжив розповідати про життя в Америці, він раптом відсторонився й натомість запропонував показати мені Чіту. Ми гарно провели час, але я не міг не помітити військових, які ходили за нами по п'ятах. Якщо подумати, весь візит був якийсь... дивний. Міхаїл постійно нервував і озирався через плече. Охорона маєтку здавалася надмірною. Вони намагалися не пустити когось усередину чи не випустити назовні?"
 RUS_tourist.15.a: "Допитливі американці..."

 RUS_tourist.16.t: "Запис 6: Сибірська гостинність"
 RUS_tourist.16.d: "Після жахливого місця, звідки я прибув, Чіта була справжнім ковтком свіжого повітря. Люди майже не боялися влади й жили без постійного страху за своє життя. Принаймні на перший погляд ця так звана імперія цивілізованіша за тих нацистських виродків на сході. Добре виспавшись у непримітному готелі біля головної вулиці, я почав розпитувати місцевих.\n\nБільшість не надто прагнула говорити, і невдовзі я привернув небажану увагу солдатів, що стежили за вулицею. Озираючись назад, не пригадаю жодного справжнього поліціянта за весь час тут. Військові забрали мене на допит, який проводили якісь дуже високі генерали.\n\nВони поводилися грубо й не надто повірили в мою історію. Питання були дивні: від місця мого ночівлі до того, чи контактував я коли-небудь із їхнім царем. Я навіть не знаю цього чоловіка, тож не розумію, чому вони так вирішили!\n\nПісля допиту головний домовився, щоб вантажівка вивезла мене з Чіти та їхньої території. Наостанок він сказав, що не хоче, аби «допитливі американці пхали носа не у свої справи». Не найтепліший прийом, але все могло скінчитися значно гірше..."
 RUS_tourist.16.a: "Однією проблемою менше."

 RUS_tourist.17.t: "Можливість з Америки?"
 RUS_tourist.17.d: "Наші люди на кордоні з білими повідомили, що кілька хвилин тому невелика група вийшла з Чіти й перетнула кордон Бурятії.\n\nНеймовірно, але її очолює американець, той самий, який, за словами пропагандистів, уже здобуває певну славу. Цей чоловік нібито прагне перетнути всю Росію зі сходу на захід і зупинитися в якомога більшій кількості держав, законних чи ні. Загрози він не становить, зате відкриває можливість.\n\nЗа межами наших земель мало хто знає про боротьбу проти іркутських тиранів, а дипломатична, фінансова чи будь-яка інша підтримка неабияк допомогла б. Якщо переконати американця в справедливості нашої справи, ми можемо виграти. Шанс мізерний, але те саме казали й про всю нашу боротьбу, а ми досі тут.\n\nВитрати будуть мінімальними. Американець і так відчує революційний дух нашого народу, подорожуючи країною, а коротка зустріч із самим Сабліним може підсилити враження. Природна харизма нашого лідера добре відома, і кількох хвилин його часу може вистачити, щоб після завершення подорожі американець змалював нас у доброму світлі.\n\nДехто вважає навіть саму цю думку дурною й негідною уваги, але багато інших закликають скористатися нагодою. Що нам робити?"
 RUS_tourist.17.a: "Запросити його на зустріч із Сабліним. Не можна втрачати таку нагоду."
 RUS_tourist.17.b: "Безглузде відволікання. Нехай оглядає краєвиди."

 RUS_tourist.18.t: "Запис 7: Бурятская АССР"
 RUS_tourist.18.d: "Коли ми ввійшли до Бурятії з боку Чіти, ми, точніше я, аж ніяк не очікували запрошення на зустріч із її лідером. Та саме його й отримали.\n\nПрикордонники поставилися підозріло, але без надмірностей, і майже без перешкод пропустили нас до столиці у Вєрхнєудінск. Та після прибуття нас зустріли дуже ошатні офіцери й повідомили, що сам Саблін хоче поговорити з нами. Точніше, зі мною. Ба більше, я справді відчував, що це було саме прохання.\n\nЯ, звісно, погодився. Зою та інших добре прийняли, а мене відвезли до його кабінету. Мушу сказати, він надзвичайно вражає. Майже неправдоподібно молодий, із легкою усмішкою, величезною особистою харизмою та привітною вдачею, він сподобався мені відразу.\n\nЯ зізнався, що мало знаю про боротьбу, про яку він розповідав, і доктринальний розкол із так званим «тиранічним і кровожерним» режимом в Іркутску. Він не образився, лише сказав, що сподівається колись установити відносини з Америкою. Можливо, пожартував він, зі мною як послом.\n\nНевдовзі мене й решту групи випровадили, але загалом зустріч була дуже приємною. До того ж його люди дали нам кілька сувенірів, а Зоя придбала ще кілька на маленькому ринку.\n\nЗавтра вирушаємо до самого Іркутска. Цікаво, чи правдивий Саблінів опис міста."
 RUS_tourist.18.a: "Не може ж усе сказане ними бути правдою?"

 RUS_tourist.19.t: "Запис 7: Бурятская АССР"
 RUS_tourist.19.d: "Спочатку я не знав, чого чекати від Бурятії. Усі в Чіті, пов'язані з урядом чи ні, не сказали про неї нічого доброго. Бунтівна держава, казали вони, та ще й комуністична.\n\nЯ боявся найгіршого, але, на щастя, був приємно здивований. У цих землях відчувається енергія, якої я досі не зустрічав у Росії. Віра в те, що незалежно від майбутнього тутешні люди борються за щось гідне, щось краще. «Революційний дух», як вони самі це називають.\n\nНе можу сказати, чи існує він насправді, але люди тут щиро в нього вірять, і цього їм достатньо. Зоя дуже сумнівається, що такий запал допоможе перемогти сильнішого ворога, і каже, що «дуже добре» знає ціну духові, але я не поділяю її песимізму.\n\nДо речі, я помітив, що до мене, до нас, почали ставитися інакше: з більшою увагою, пошаною та схваленням. Вочевидь, звістка про мою подорож трохи поширилася й випереджає нас, а дехто вважає її надзвичайно цікавою. Для мене це дуже дивне відчуття.\n\nНевдовзі ми вирушимо до Іркутска й побачимо, чи справді його правителі такі тиранічні, як тут кажуть. У будь-якому разі мені цікаво дізнатися."
 RUS_tourist.19.a: "Не може ж усе сказане ними бути правдою?"

 RUS_tourist.20.t: "Американець-саблінець?"
 RUS_tourist.20.d: "Від наших агентів у землях Сабліна надійшло повідомлення про людей, які покинули Вєрхнєудінск і прямують до Іркутска.\n\nАмериканець, який нібито прибув на Далекий Схід до Пєтропавловска на зафрахтованому судні, разом із кількома супутниками тепер рухається до нашої території після прийому в повстанців. Ми не певні в намірах групи, але незабаром виникне ситуація, що потребуватиме уваги.\n\nЗа даними НКВД, американця прийняв сам Саблін. Зміст їхньої розмови невідомий, але сам контакт викликає підозру. Ми також не можемо підтвердити політичні погляди його супутників, особливо жінки зі значними географічними знаннями та бойовими навичками.\n\nКілька офіцерів радять вважати всю групу завербованою саблінцями й діяти рішуче, щоб схопити та знешкодити їх. Інші закликають до стриманости, зважаючи на присутність відомого американця, який уже посів певне місце в суспільній свідомості.\n\nЯкий наказ слід віддати агентам?"
 RUS_tourist.20.a: "Заарештувати їх, але обережно. Нам не потрібен інцидент."
 RUS_tourist.20.b: "Заарештувати їх, але пильнувати. За потреби відкрити вогонь."

 RUS_tourist.21.t: "Запис 8: Президія Вєрховного Совєту"
 RUS_tourist.21.d: "Саблін і його люди ясно попередили, що Іркутск та його «тирани» не приймуть нас так тепло, як він. І мали рацію.\n\nЩойно ми дісталися кордону, нас перехопили, ніби наперед знали, де шукати. Зоя сказала, що так воно, найімовірніше, і було: про наші рухи доповідали агенти НКВД. Щоразу, коли вона вимовляє цю абревіатуру, в голосі чути отруту, але я відчуваю, що попри ненависть вона їх боїться, і цього досить, щоб боявся і я.\n\nНевдовзі я зрозумів, як вони впливають на людей. Агенти були чоловіками, але їхні очі лишалися холодними й твердими, коли вони обшукували речі, а після різкого наказу - і нас самих, у найпринизливіший спосіб. Нас звинуватили в саблінстві й цілковито проігнорували заперечення. Потім поставили ще більше питань, і я бачив, як Зоя дедалі більше напружується.\n\nМожливої катастрофи вдалося уникнути, коли вони почали розпитувати про мої мандри. Я збагнув: попри слова з нами поводилися обережніше, ніж могли б, бо я, ми, вже стаємо відомими. Невдовзі нам відмовили у в'їзді й наказали рушати на південний захід.\n\nНаша група так і не побачила земель Президії й, схоже, ніколи не побачить. Якщо їх уособлюють люди, які нас затримали, мене це цілком влаштовує.\n\nМи продовжуємо шлях. Не те щоб у нас був вибір."
 RUS_tourist.21.a: "Напружена ситуація."
 
 RUS_tourist.22.t: "Ще одна могила"
 RUS_tourist.22.d: "Від наших агентів на кордоні надійшло ще одне повідомлення, і для Президії новини недобрі.\n\nНевдовзі після перехоплення та затримання американця і його групи вони виявили крайнє обурення питаннями й вимогами обшуку. Це обурення, особливо з боку досі невідомої жінки, поміченої агентами ще у Вєрхнєудінску, зрештою призвело до катастрофи.\n\nПереконана, справедливо чи ні, що їх ось-ось стратять, жінка вбила одного агента, забрала його зброю й спробувала втекти. Бій був коротким, але жорстоким: вона вбила ще кількох агентів, перш ніж її застрелили.\n\nРозцінивши це як доказ того, що група складалася із саблінських диверсантів, агенти ліквідували решту, зокрема американця. Тіла й речі, за якими їх можна було впізнати, швидко знищили.\n\nНам доведеться подбати, щоб остаточну долю американця не пов'язали з нами, але ми можемо бути певні: НКВД знову виступив мечем і щитом Партії та держави."
 RUS_tourist.22.a: "Не можна нехтувати пильністю."

 RUS_tourist.23.t: "Пам'ятна зустріч на кордоні"
 RUS_tourist.23.d: "Завжди пильні щодо диверсантів НКВД, прикордонники Народно-революційного совєту, самі ветерани Червоної армії, швидко помітили невелику групу, яка наближалася з боку Іркутска.\n\nСолдати рушили на затримання й були приголомшені історією, спершу викладеною ламаною російською з дивним акцентом чоловіком, а тоді вправніше жінкою. Після перевірки документів і багажу їхнє здивування лише зросло.\n\nЗрештою повіривши розповіді й посміявшись із «прийому» іркутської влади, прикордонники впустили їх до НРС і спрямували до Орґону. Перед тим вони повідомили, що вже послали радіограму, і якщо група невдовзі не з'явиться там, наслідки будуть дуже серйозними.\n\nКоли мандрівники зникли за обрієм, солдати завершили патрулювання й повернулися до казарм. Увечері за армійською юшкою та картами вони дивувалися, що могло спонукати американця пішки перетинати всю Росію, і сперечалися про його шанси вижити.\n\nСержант виграв, давши йому не більше одного шансу з десяти."
 RUS_tourist.23.a: "Але шанс усе-таки є."

 RUS_tourist.24.t: "Запис 9: Народно-революційний совєт"
 RUS_tourist.24.d: "Після вкрай неприємного знайомства із совєцькою владою в околицях Іркутска ми рушили на південь і ввійшли до земель Народно-революційного совєту.\n\nЦя «держава», створена залишками Червоної армії на монгольських землях, мала столицю, що за виглядом і гостинністю нагадувала військовий табір. Ми зібрали кілька дрібничок та історій у місцевих, але більше, на жаль, писати майже нема про що.\n\nУтім, тут випала нагода надіслати листа до Америки. За цілком помірну плату торговець, який невдовзі мав їхати через Мєнцзян до порту Дайрен, погодився взяти пошту. Сподіваюся, вона дійде доволі швидко.\n\nЗначно цікавішими за спілкування з місцевими були мої пригоди із Зоєю. Вона дивовижна жінка, здатна легко вливатися в культуру відвідуваних держав і майже без зусиль розбиратися у складній внутрішній політиці. Як я вже не раз переконався, вона чудово відчуває небезпеку й уміє або цілковито її уникнути, або владнати все до початку насильства. Я знову вдячний, що найняв її.\n\nМи рушаємо далі й маємо перетнути внутрішню межу між Далеким Сходом і Центральним Сибіром. Цікаво, які держави там існують. Тут ми вже побачили неймовірне розмаїття урядів, і я хочу знати, чи так буде й надалі.\n\nСподіваюся, що так."
 RUS_tourist.24.a: "Безцінна супутниця."

 RUS_tourist.25.t: "Хроніка зі Сходу"
 RUS_tourist.25.d: "Дорогі мамо й тату,\n\nЯ живий! Принаймні був живим і здоровим, коли писав цього листа. Зараз ми стоїмо табором у Туві, а це, мабуть, означає, що я успішно перетнув російський Далекий Схід. Я залюбки розповів би все особисто, але наразі доведеться вдовольнитися листом.\n\nКамчаткою керують залишки Червоного флоту. Моряки були дуже привітні, а їхній командир навіть дав мені судно до Маґадана. На жаль, через спустошеність краю вони змушені піратствувати, щоб вижити. Маґадан був порівняно заможним, люди призвичаїлися до суворих умов, а їхній лідер Матковскій видався приємним чоловіком.\n\nЗа кордоном Якутська республіка перебувала під владою гірничих компаній і, хоч була мирною, лишалася малолюдною. Там я найняв Зою, досвідчену снайперку, яка стала моєю провідницею.\n\nПерейшовши до Амуру, я потрапив у край бандитів і вбивць, де насильство й жорстокість були звичними та нестримними. Нам пощастило не постраждати, і ми дісталися Чіти, якою керують люди, що, здається, досі вважають Громадянську війну в Росії незавершеною, а на чолі стоїть цар з Австралії.\n\nНарешті ми перетнули Бурятію, край ідеалістичних революціонерів, що воюють проти останніх тиранічних решток Совєцького Союзу в Іркутску, параноїдальній державі, яка депортувала мене до Туви, де нині правлять залишки Червоної армії.\n\nДо повернення додому ще далеко, але Росія - дивовижний край, і я лише сподіваюся перетнути його весь із Зоєю поруч. Побажайте удачі, друзі, і, сподіваюся, скоро побачимося,"
 RUS_tourist.25.a: "З любов'ю, Стів."

 RUS_tourist.26.t: "Новий гість у Вільній Території"
 RUS_tourist.26.d: "«Імперіялістичний шпигун, - бурмотів Пьотр, - не інакше». Ідеолог Сибірської Чорної Армії ходив кімнатою взад-вперед, гортаючи сторінки звітів, які потроху надходили з прикордонних комун. За їхніми словами, американець проник через кордон із російською провідницею, найімовірніше реакційною поплічницею, і відвідував комуни. Пьотр знову вивчив папери, пробігаючи очима кириличні літери. Незнайомець розповідав безглузду історію про те, що він «турист», але це, мабуть, лише тонке прикриття агента ЦРУ.\n\n«Може, - втрутився Стєпанов, - він просто турист. Чесно кажучи, Пьотре, я поважаю твій запал, але сумніваюся, що ЦРУ надіслало б шпигуном студента, який явно не бачив ані дня війни, ані дня праці». Сіуда примружився на слова військового колеги.\n\n«Можливо, він прибув поширювати авторитарну пропаганду про те, яка прекрасна їхня капіталістична пекельна «демократія»». Відповідь Пьотра звучала вже не так полум'яно: оцінка Стєпанова вгамувала його гнів. Обличчя ідеолога пом'якшало. «Ні, товаришу Іване, ти, мабуть, маєш рацію. Але було б корисно затримати його й з'ясувати справжні причини перебування тут». Він ледь усміхнувся. «Можливо, навіть улаштувати туристові екскурсію нашим способом життя, запалити в ньому вогонь анархізму, щоб він поніс його до Америки?»\n\nСтєпанов кивнув. Ідея мала сенс, але вирішувати було не їм двом. Такий уже шлях анархії."
 RUS_tourist.26.a: "Дати йому повну свободу."
 RUS_tourist.26.b: "Нехай Чорна Армія за ним наглядає."

 RUS_tourist.27.t: "Запис 10: Вільна Територія"
 RUS_tourist.27.d: "Ми із Зоєю вже близько тижня в Сибірській Вільній Території, і записати є багато чого. У Штатах мене завжди вчили, що «анархія» - погане слово, яке означає суцільний хаос. Ця анархія виявилася не такою, як я очікував, і мені важко в усьому розібратися. Усі живуть у комунах, якими керують ради, обрані місцевими. Я помилково спитав, чи робить це Вільну Територію демократією, і якийсь хлопчина в чорно-червоному капелюсі почав кричати на мене російською! Зоя переклала, і цей чувак розійшовся про те, що демократія - лише «завуальований авторитарний механізм», хай би що це означало.\n\nТреба віддати їм належне: люди загалом задоволені своїм життям, але на мене реагують по-різному. Кілька разів мене зупиняли захоплені селяни, усміхалися й фотографувалися, та не рідше мене освистували й обпльовували, а ще, присягаюся, за мною ходять чоловіки в одностроях! Не знаю, що думати про це місце. Люди тут справді вільні, але їхнє розуміння свободи незвичне для мене. Вони всім діляться, мають повну статеву й сексуальну рівність, але водночас живуть під владою військової хунти. Я приїхав сюди, майже нічого не знаючи про анархізм, і тепер, здається, розумію його не краще."
 RUS_tourist.27.a: "Вони вільні бути вільними, але навряд чи вільні в чомусь іще."

 RUS_tourist.28.t: "Запис 10: «Вільна» Територія"
 RUS_tourist.28.d: "Який жахливий день. Я просто оглядав місто, коли зграя головорізів у чорній формі схопила мене й потягла через провулок! Зоя домовлялася про транспорт до наступної комуни в нашому списку й, певно, не побачила викрадення. Бандити відвели мене до халупи на околиці й допитували сумішшю ламаної англійської та російської. Я мало що зрозумів, але, здається, мене звинувачували у шпигунстві на ЦРУ! Вони не катували мене, лише трохи відлупцювали, тож це, мабуть, єдина світла сторона. Я просидів там кілька годин, не знаю скільки саме, а тоді почув, як Зоя кричить на охоронців російською. Вони кричали у відповідь, та зрештою вона змусила їх мене відпустити. Коли вона виводила мене, здавалося, в неї зараз трісне клята судина: вона нагадувала величезну вишню в сорочці. Було б смішно, якби я не всирався зі страху.\n\nПісля цього балагану вона відвела мене вбік і сказала взагалі не говорити з місцевими. Виявилося, я вжив якусь «імперіялістичну лексику», і параноїдальний анархістський фанатик настукав на мене Чорній Армії. Вони склали два й два та вирішили, що я шпигун. Схоже, свобода тут не поширюється на великі страшні імперіялістичні думки чи слова, які вважають «неанархістськими». До біса це місце."
 RUS_tourist.28.a: "На біса вільному суспільству клята поліція думок?"

 RUS_tourist.29.t: "Цікава можливість"
 RUS_tourist.29.d: "Прикордонники на межі з Чорною Армією повідомили про затримання незвичайної групи прибулих.\n\nЛюдей, які стрімко покинули територію Чорної Армії та ввійшли до нашої, негайно затримали через підозріле походження. Їх обшукали й допитали щодо анархістської літератури або переконань.\n\nТа невдовзі стало зрозуміло, що це не анархісти, а почет самотнього американського туриста, якого теж затримали. Він намагається перетнути Росію зі сходу на захід і веде щоденник усіх відвіданих держав. Відразу з'явилася думка, що це відкриває чималі можливості.\n\nЯкщо запросити американця до Красноярска, показати йому відданість Тимчасового уряду демократичним ідеалам і наше прагнення поширити їх на всю Росію, ми можемо здобути важливу дипломатичну перемогу. Подарунки, звісно, підготуємо.\n\nОтже, ми супроводимо його до Красноярска, влаштуємо екскурсію містом та авдієнцію з генералом Андрєєвим. Ми покажемо, чому наша держава краща за сусідів, і доведемо, що землі анархістів на сході й божевільного на заході були б значно краще забезпечені під нашим контролем.\n\nТак приємно, коли випадає така нагода."
 RUS_tourist.29.a: "Такими нагодами не можна нехтувати."

 RUS_tourist.30.t: "Запис 11: Тимчасовий уряд Красноярска"
 RUS_tourist.30.d: "Після тієї неприємности в землях Чорної Армії, за порятунок від якої я завжди дякуватиму Зої та своєму давньому рішенню найняти її, ми якнайшвидше перетнули Єнісєй і негайно були затримані.\n\nСолдати, що назвалися представниками уряду Красноярска, вислухали нашу історію й зв'язалися з командуванням. Невдовзі, на наш подив, вони повідомили, що нас супроводять до самого Красноярска. Зоя занепокоїлася, але вибору явно не було, тож ми погодилися.\n\nРадий сказати, що її тривога була марною. Красноярск - надзвичайно приємне місто. Дорогою до центральної урядової будівлі я бачив чисті вулиці, працьовитих людей і найбільший залізничний вузол у своєму житті.\n\nБіля урядової будівлі нас особисто зустрів, і я не перебільшую, правитель території, генерал-президент Андрєєв. Як неважко припустити, я очікував, що військовий уряд буде неприємним, але під час розмови про мою подорож і його цілі здивувався відданості цього чоловіка ідеалам демократії, вільної торгівлі та не лише їм. Сподіваюся, його майбутні реформи матимуть успіх, адже свободи заслуговують усі.\n\nДалі ми прямуємо на захід, через Том, до Кємєрова. Місцеві в Красноярску охоче лихословлять про місто, державу та її правителя, але я вже навчився не вірити всьому почутому.\n\nУ будь-якому разі невдовзі побачимо самі."
 RUS_tourist.30.a: "Справді несподіваний уряд."

 RUS_tourist.31.t: "Дивне прибуття"
 RUS_tourist.31.d: "Наші сили безпеки на кордоні з Красноярском повідомили про дивну подію. Неймовірно, але з'явився американець і попросив дозволу ввійти до Князівства!\n\nСпочатку його затримали як можливого диверсанта зі зрадницького режиму Андрєєва, але чоловік надав переконливі докази свого американського громадянства й довгої подорожі Сибіром від Пєтропавловска до Красноярска. Він також пояснив, що мандрує Росією зі сходу на захід, відвідуючи якомога більше держав і досліджуючи їхні культури.\n\nНе маючи причин далі його утримувати й наказу центрального уряду відмовити у в'їзді, прикордонники дозволили йому продовжити шлях. Очікується, що незабаром він прибуде до Кємєрова."
 RUS_tourist.31.a: "Як цікаво."
 
 RUS_tourist.32.t: "Запис 12: Князівство Кємєрово"
 RUS_tourist.32.d: "Коли я вперше перетнув кордон Кємєрова, то подумав, що все почуте в Красноярску було правдою: прикордонники поводилися дуже непривітно, доки я не довів, хто я. Але після кількох днів у Кємєрові бачу, що все не так, як я очікував.\n\nМісто чисте й упорядковане, якщо не зважати на вугільний пил із Кузнецького басейну, люди доволі привітні, і я точно не бачу жахіть Зєї, Іркутска чи території Чорної Армії. Принаймні Зої тут подобається.\n\nТа значно дивніший за місто уряд. Наскільки я зрозумів, правитель - генерал Червоної армії, який пережив нервовий зрив і проголосив себе «імператором» Рюріком II, а пояснити його справжні цілі ніхто не може. Зате про його дітей, «князя» Юрія та «князівну» Лідію, розповідають усі й дуже голосно.\n\nЮрій має погляди, трохи подібні до Валєрієвих щодо профспілок та іншого, і прагне демократичної системи. Його сестра значно суворіша: хоче зберегти абсолютизм і каже, що лише він здатен підтримувати лад у такому беззаконному місці, як Сибір. Мене трохи налякало, наскільки розумно це прозвучало. До відплиття я беззастережно підтримав би Юрія, але після всього побаченого вже не можу так легко відкинути думку Лідії.\n\nУ будь-якому разі ми із Зоєю поговорили й завтра вирушимо на південь, до Бійска, столиці маленької держави православних старовірів. Цікаво, що там буде."
 RUS_tourist.32.a: "Цікаво, хто із цих двох переможе?"

 RUS_tourist.33.t: "Земля двох народів"
 RUS_tourist.33.d: "Дивна група дісталася Ґорно-Алтайска рано-вранці. Місцеві ополченці не знали, що думати про прибулих. Купцями з-за кордону вони бути не могли, бо не мали товару. Не скидалися й на місцевих, які йшли до церкви чи на сьогоднішнє свято. Попереду йшла жінка, міцно стискаючи рушницю. Поруч був чужинець із жахливою російською, який знову й знову називав себе американцем.\n\nЯк часто траплялося, патову ситуацію розв'язав президент Заволоко. Він наказав видати групі свіжий одяг. У традиційному алтайському вбранні чужинець менше впадатиме в око. Потім Заволоко звелів показати американцеві місцеву церкву. Під вечір той міг відвідати бурханістське свято, де під безмежним небом Ойротії лунатимуть пісні.\n\nОхоронницю запросили на допит. Переконавшись, що це справді лише мандрівники, не пов'язані з жодною центральносибірською фракцією, Заволоко ввічливо попросив жінку розповісти все відоме про Кємєрово, Красноярск і Сибірську Чорну Армію. Регіон прокидався, а на обрії збиралися темні хмари. В ізольованій республіці вітали будь-які відомості про події в Центральному Сибіру."
 RUS_tourist.33.a: "То це правда, що генерал Крилов збожеволів?"

 RUS_tourist.34.t: "Запис 13: Республіка Ойротія"
 RUS_tourist.34.d: "Схоже, мене погано поінформували. Усі в Центральному Сибіру називали Ойротію державою старовірів, тобто російських православних розкольників, висланих із Західної Росії до цієї глушини, але насправді в Ойротській республіці живе багато алтайців. Мене запросили на свято з піснями та спаленням священних рослин. Я мало зрозумів у ритуалах, але жодного шамана на чолі дійства начебто не було. Це радше була спільна церемонія. Місцеві поставилися до моєї присутности байдуже.\n\nСтолиця республіки мало відрізняється від інших провінційних міст, які я бачив. На відміну від Кємєрова чи Красноярска, про цей край просто забули. Тут, серед гір, два народи республіки, схоже, прагнуть лише миру та спокою. Зоя зауважила брак прикордонників і військових блокпостів. Сподіваюся, мир і надалі оберігатиме цих людей.\n\nНам продали коней! І, здається, за доброю ціною. Вони допоможуть швидко спуститися з гір і дістатися Новосибірска. Разом із нами поїде купець, який прямує туди ж. Буде цікаво повернутися до цивілізації: я чув, що Новосибірск - одне з останніх великих промислових міст Росії."
 RUS_tourist.34.a: "Подорож триває."

 RUS_tourist.35.t: "Тур на висоті"
 RUS_tourist.35.d: "Сьогодні вранці біля Іскитіма зупинився поторгувати караван вершників з Ойротії. Припаси були дуже потрібні, але ойротці привезли із собою ще одну дивину: один вершник ніс американський прапор. Мандрівник водночас неймовірно добре вписувався в караван і разюче вирізнявся поведінкою та загальним виглядом. Утім, він охоче торгував із нашими громадянами й здавався щасливим.\n\nА тоді натрапив на солдатів. І не припиняв із ними говорити.\n\n«Мене звати Стів, я турист з Америки! Я чув про тутешній авіазавод і бачив, як ваші літаки ширяють усім цим краєм Сибіру! Вони просто неймовірні».\n\nЙого російська була ламаною, і зв'язної розмови він майже не підтримував, але місцева супутниця пояснила ситуацію. Зоя, як вона назвалася, підтвердила історію Стіва й розповіла про його бажання обійти російські держави воєначальників та описати пережите. Звісно, солдати не могли втратити нагоду розважитися. Вони запропонували відвезти його до столиці й «реквізувати» там літак.\n\nСтів і Зоя радо погодилися, тож солдати повезли їх до столиці. Дорогою Стів розповідав дивакуваті, але щирі історії про подорожі Східним Сибіром. Більшість солдатів слухала зачаровано, але двоє найсерйозніших, Євґєній та Анатолій, сперечалися, на якому літаку підняти молодого американця.\n\n«Кажу тобі, Анатолію! Йому сподобається старий совєцький Іл-10. Американці обожнюють усю цю історичну штуку».\n\n«Нєт, нєт! Амеріканскій любить швидко й небезпечно! Треба взяти реактивний літак, над яким працював Алєксандр».\n\nПісля довгої суперечки вони разом з іншими солдатами й Стівом дійшли згоди та вирішили..."
 RUS_tourist.35.a: "Американцеві сподобається старовинний совєцький літак."
 RUS_tourist.35.b: "Вразимо його експериментальним реактивним літаком!"

 RUS_tourist.36.t: "Запис 14: У небі"
 RUS_tourist.36.d: "Росія з неба - воістину дивовижне видовище.\n\nЯ прибув до Анархії морем і мандрував нею суходолом, але політ серед хмар перед Уралом був прекрасним. Солдатів Новосибірска захопили мої історії, і вони витягли старий уламок історії з німецького конфлікту: совєцький Іл-10 кінця сорокових.\n\nВін трохи послужив у Західноросійській війні: бився з кількома самовпевненими Ме-262 і надавав підтримку наземним силам. У запеклому повітряному бою над Москвою його ледь не збили, але літак героїчно врятувався... принаймні так розповідав мій пілот Євґєній. Правда це чи ні, мені було байдуже. Мало значення лише те, що моя голова витала в буквальних хмарах, а він почувався затишно в цьому уламку минулого.\n\nМи не залишали кордонів Новосибірска й переважно трималися над Об'ю, але краєвиди та звуки спокійної сибірської природи з повітря перехоплюють подих. Я ніколи цього не забуду й не здатен гідно описати тут. Після посадки Євґєній по-братньому обійняв мене на прощання й пояснив, як безпечно дістатися Томска.\n\n«Щасливої дороги, товаришу. Нехай твою подорож увінчає щирий успіх». Ці слова ще дуже, дуже довго звучатимуть у моїй голові, а вдячність у серці неможливо висловити достатньо тепло."
 RUS_tourist.36.a: "«Зірвати земні пута й танцювати серед птахів у вишині...»"

 RUS_tourist.37.t: "Прикрий авіяційний інцидент"
 RUS_tourist.37.d: "Повітря над Куйбишєвим було свіже й ясне. Рідкі хмари пропускали сонце на сільські землі, й природа тяглася за його промінням. Попри вряди-годи загрозу набігів воєначальників, це був напрочуд звичайний день у звичайному новосибірському містечку.\n\nАж поки реактивний винищувач не врізався в поле пана Кравчєнка й не спалахнув від удару. Дехто вирішив, що це самотній німецький бомбардувальник, який заблукав надто далеко й був збитий Вільними авіяторами, інші ж гадали, що це невдалі повітряні навчання. Після ближчого огляду літак міг виявитися або експериментальним совєцьким реактивним літаком, який так і не вийшов за межі випробувань, або кустарним науковим експериментом якогось воєначальника в марній спробі здобути перевагу в повітрі. Та через тліючі уламки цього вже не визначити.\n\nПісля огляду сільська міліція встановила, що на борту було троє людей, усі загинули під час падіння або подальшого вибуху двигуна. Один страшенно понівечений труп виявився цікавим. Щоденник, який він притискав до грудей, сильно обгорів, але містив англійською мовою історії про численні держави воєначальників по всій Росії.\n\nНа жаль, більшість сторінок знищив вогонь, а стан щоденника такий поганий, що його історія, схоже, загубиться в тих самих язиках полум'я, які стерли його слід із цього світу."
 RUS_tourist.37.a: "Те, що залишилося, поховають у безіменній могилі."

 RUS_tourist.38.t: "Американець у Томску?"
 RUS_tourist.38.d: "Останнім часом багатьох спантеличила дивна група, що в'їхала до Томска. Вершники в алтайському вбранні несли американський прапор. Тепер ми знаємо, що це справді американець, який подорожує всією Росією й нарешті прибув до нашого міста.\n\nТомск і так приваблює чимало дивних людей обіцянками свободи та волі, але цей почет особливо цікавий. Американці вже багато років не забиралися так далеко до Сибіру! Майже всі в місті хочуть із ним зустрітися, і він уже здобув певну славу. Ми навіть готуємо для нього відвідини салонної дискусії та знайомство з унікальним урядом. Як американець, він неодмінно буде вражений наймогутнішою демократією Росії, чи не так?\n\nУ будь-якому разі слід відзначити його жагу до знань. Подорож усією Росією не для слабкодухих! Подейкують навіть, що вдома в Америці він студент. Мабуть, великий учений!"
 RUS_tourist.38.a: "Тут він буде в безпеці!"

 RUS_tourist.39.t: "Запис 15: Місто митців"
 RUS_tourist.39.d: "Томск геть не схожий на жодне відвідане мною місце. Хоча, заради справедливости, у Росії майже кожне місце відрізняється від наступного. Що глибше я заходжу, то дивніше стає.\n\nУ Томску мене прийняли з розпростертими обіймами, а люди тут здебільшого дуже привітні. Майже кожен хотів зустрітися й поговорити. Здається, ніде більше так багато не розмовляють про політику, науку та мистецтво.\n\nДо речі про політику: я й сам трохи побачив, як працює Томск. Мене запросили до салону, і, чесно кажучи, все було цілковито незбагненним. Я геть не розумів, що відбувається. Купа інтелектуальних розмов і вчених суперечок. Я не міг навіть збагнути тему, хоча моя російська стала значно кращою, ніж на час прибуття! Я не дуже розумію це місце, але добре знати, що в Росії є демократії, а не лише диктатури воєначальників. Може, Росія все-таки має надію...\n\nТа я не уявляю, як вони взагалі про щось домовляються. На вулицях Томска значно приємніше, ніж у салонах. Тутешня політика така, ніби всі ботани з мого університету вирішили створити державу. Хтозна, може, їм відомо щось, чого не знаю я.\n\nДалі їду до Омска. Люди кажуть оминати це пекло, якщо мені дороге життя, та я зберігатиму неупередженість. Невже там аж так погано?"
 RUS_tourist.39.a: "Йому справді обов'язково туди їхати?"

 RUS_tourist.40.t: "Каравани зі Сходу"
 RUS_tourist.40.d: "Сьогодні по обіді зі Східного Сибіру прибув караван біженців, а з ним - потенційні нові члени Чорної Ліги. Знедолені чоловіки, які шукають безпеки, братерства, мети... Ідеальні люди для підтримки нашого шляху до Великого Випробування.\n\nА ще був американець.\n\nМало хто довкола знав його ім'я, а його російська вимова була такою ж загадковою, проте він ніс американський прапор і подорожував із супутницею. Вона не була місцевою, але безперечно була росіянкою. Кадр 120996, призначений для охорони кордону, доповів місцевому офіцерові Ліги про дивного мандрівника. Командир Кадру виявив обережність, але з чистої цікавости дозволив непомітний допит і розмову. Чоловік назвався Стівом і сказав, що мандрує російською анархією з провідницею Зоєю. Стів описує свої враження та окремі історії з усієї країни, а нинішня зупинка - велике місто Омск.\n\nМи справді надміру обережні з гостями, особливо з такими дивакуватими, як американський турист, досить божевільний для подорожі державами воєначальників. Та командир Кадру 120996 наказав дати туристові кілька «дружніх порад» і трохи показати місто. Єдина проблема: Стів уперто тримається поради Зої, яка цілковито суперечить нашій. Після довгої розмови й нашої дружньої пропозиції турист ухвалює рішення."
 RUS_tourist.40.a: "Він погоджується з нашою порадою."
 RUS_tourist.40.b: "Клятий американець посилає нас!"

 RUS_tourist.41.t: "Запис 16: Прекрасне місто Омск"
 RUS_tourist.41.d: "Омск, мабуть, одне з найбезпечніших і найчистіших міст Росії, які я досі бачив. Я не прихильник жодної політичної сторони, але їхнє правління забезпечує надзвичайний порядок і водночас співчуття до звичайних громадян.\n\nЧлени «Чорної Ліги», яка водночас є найвищою владою та збройним воєнізованим формуванням країни, дуже щедро запропонували безпечно й чемно показати нам місто! Попри заперечення Зої, яка потім наодинці назвала мене «мудаком» і ще всіляко сварила, Чорна Ліга показала важливі культурні пам'ятки, пояснила устрій суспільства, дозволила подивитися військові навчання й відвела до чудової крамниці юшки, якою керує старий Пьотр. Потім Ліга швидко відвела нас до підземного гуртожитку, щоб нас не зачепила Люфтваффе й ми не тинялися нічним містом. Ліжка були міцні й зручні, а хоч ми фактично спали в бетонних тунелях метро, усе здавалося домашнім і теплим.\n\nСьогодні вранці ми маємо рушити до Уралу через Тюмєнь разом із військовим караваном. Зоя каже, що це просто прикрашена назва набігу. Я обережний, але дуже сумніваюся, що Чорна Ліга відправить так тепло прийнятого мандрівника в справжній бій. У будь-якому разі я вирушаю за кілька годин і напишу додому про все пережите."
 RUS_tourist.41.a: "«Дивно, але безпечно. Саме так мені подобається»."
 
 RUS_tourist.42.t: "Жахіття Чорної Ліги"
 RUS_tourist.42.d: "Який дурний турист. Чужоземний божевільний насмілився відкинути пораду нашої славетної Ліги й довірився місцевій Зої як своєму дороговказу. Очевидно, цей «Стів» - лише чергова перешкода, випробування, яке корумпована західна наддержава послала народові Омска, щоб зупинити наш виснажливий рух до Великого Випробування. Його записи - дрібне шпигунство, яке продадуть підтримуваному Америкою воєначальникові й використають, щоб нас розчавити. Кожна його нотатка наближає стрілку нашого годинника, а Ліга не може цього дозволити.\n\nНа щастя, протягом недовгого перебування «Стів» підтвердив свою дурість і самовпевненість. Приблизно через пів години після зіткнення з Кадром 120996 він зайшов до Бункера 2938, шукаючи інформацію й місце для ночівлі. Більшу частину бункера Кадр 482315 відвів для допитів осіб, які прагнули нашкодити російській нації. Один такий покидьок, інтелектуал Юсєф, саме здійснив жалюгідну спробу втечі. Вирвавшись із пут, напівосліплий негідник не побачив «Стіва», але покликав його. Зі зламаними по одному пальцями й зламаним духом Юсєф наштовхнувся на переляканого «Стіва», впав і помер від шоку. За мить члени Кадру 482315 випустили дві кулі з пістолета ТТ-33 у потилицю «Стіва».\n\nЙого супутницю Зою знайшли під час втечі від Кадру 384234 після того, як вона почула все ззовні, й швидко стратили одинадцятьма пострілами з ППШ. Обидва тіла викинуть під час завтрашньої вилазки до Тюмєні за наказом самого товариша Язова, якого цей унікальний поворот подій, схоже, потішив. Ніхто, навіть допитливий чужинець, не перешкодить нашому походові до Великого Випробування."
 RUS_tourist.42.a: "Щури за кордоном знайдуть застосування їхнім гнилим тілам."

 RUS_tourist.43.t: "Оповіді з Центрального Сибіру"
 RUS_tourist.43.d: "Дорогі мамо й тату,\n\nУ мене все гаразд, як і в Зої, яку послав сам Бог. Зараз я в місті Омск. Тут керує Чорна Ліга, і, мушу сказати, порядок у них залізний! Саме вони допомогли передати вам цього листа! Ще й через Казахстан! Ну не божевілля?\n\nЩо далі я мандрую, то більшою здається Росія. Першим містом був Канск під владою «Чорної Армії» (із Чорною Лігою не пов'язана, не плутайте!). Вони мене не злюбили. За нами стежили, а мене звинуватили в «авторитаризмі», що просто сміховинно. Я американець! Вільніших за нас немає! Красноярск був значно приємнішим: невеликим, але чистим і працьовитим. Його керівник Андрєєв дуже товариський. Він хоче збудувати демократію, та наразі це військова хунта. На заході було Кємєрово. Правителя я не зустрів - це старий генерал Червоної армії, який уявив себе давньоруським царем, дивина та й годі, - але люди були привітні. Потім я відвідав Ойротію, маленьку державу алтайців (одного з народів Росії, як індіянці вдома). Вони прості й щирі, продали мені коней і прекрасний плащ, який не терпиться показати. Новосибірск, навпаки, велике місто, трохи схоже на Балтимор. Мене підняли в небо на старому совєцькому військовому літаку, і, мамо, це перехоплювало подих. Політ усього життя. Останнім був Томск, де править купка інтелектуалів, але принаймні це демократія.\n\nНапишу знову за першої нагоди. Росія поки що спростовує майже всі сподівання, але із Зоєю поруч я точно буду в безпеці. Скоро побачимося!"
 RUS_tourist.43.a: "З любов'ю, Стів."

 RUS_tourist.44.t: "Виявлено можливе проникнення в секторі 217-Б - потрібні вказівки"
 RUS_tourist.44.d: "Товаришу майоре,\n\nВиявлено потенційну загрозу безпеці Народної Республіки. Незвичні обставини зумовили необхідність цього повідомлення.\n\nПідпорядковані мені спостережні підрозділи доповіли про групу осіб, яка намагалася ввійти до Народної Республіки з території Чорної Ліги. Порушники не відповідають жодним відомим класифікаційним параметрам диверсантів. Їхні вигляд і одяг не передбачають маскування, пересування верхи надто помітне, а маршрут відкритий і не дає укриття. До того ж група несе піднятий американський прапор, що ще більше підвищує помітність.\n\nПідлеглі припустили, що така докорінна зміна можливої тактики проникнення має на меті вивчити наші оперативні методи й процедури або захопити співробітників безпеки для добування інформації. Однак попередні спроби Ліги зосереджувалися на таємних викраденнях, а якщо спостережувані порушники спробують таке, вогонь із далекої відстані, найімовірніше, забезпечить швидку нейтралізацію.\n\nОчікую наказів щодо перехоплення.\n\nНа захист Центрального Комітету,\n\nҐ. А. Ґончаров,\nлейтенант державної безпеки, Червонопрапорний східний округ"
 RUS_tourist.44.a: "Відповідь: наблизитися обережно."
 RUS_tourist.44.b: "Відповідь: перехопити рішуче."

 RUS_tourist.45.t: "Запис 17: Західносибірська народна республіка"
 RUS_tourist.45.d: "Покинувши прекрасний Омск, ми рушили на північний захід, до земель, які, за словами Зої, принаймні формально контролюють одні з останніх непримиренних леніністів.\n\nМене це здивувало, адже після очевидних провалів ленінізму, найвиразніше засвідчених розпадом совєцьких держав, ця ідеологія мала б утратити привабливість. Та, як ми невдовзі з небезпекою для себе з'ясували, здорова комуністична параноя досі жива й сильна.\n\nПобачивши патруль, я наївно вирішив, що вони, як у багатьох інших державах, обережно наблизяться, переконаються в нашій мирності й перевірять документи. Перший крок вони виконали, але потім без жодного слова почали стріляти. Якби Зоя своїм досвідченим оком не прочитала їхню мову тіла, моя історія могла б там і скінчитися.\n\nНа щастя, згодом вона пояснила, що вони не зачекали достатньо для точного вогню й перекриття шляхів утечі. Ми одразу рвонули геть, женучи коней до межі, щоб випередити машини прикордонників. Зоя знову виявила майстерність, швидко знаходячи місцевість, якою могли пройти коні, але не автомобілі. Після кількох годин шаленої їзди, довівши коней до повного виснаження, ми, як засвідчує моя здатність писати далі, відірвалися від переслідувачів.\n\nТут нам явно не раді, тож ми рухаємося в єдиному можливому напрямку - на північ, оминаючи землі дивних томських демократів. Зоя каже, що навіть вона з нетерпінням чекає наступної зупинки.\n\nСподіваюся, вона так само потішить і мене."
 RUS_tourist.45.a: "Який грубий спосіб вітати гостей."

 RUS_tourist.46.t: "Звіт: диверсантів перехоплено"
 RUS_tourist.46.d: "Товаришу майоре,\n\nПотенційну загрозу безпеці Народної Республіки усунуто згідно з вашими вказівками.\n\nПісля отримання останнього повідомлення передові підрозділи під моїм командуванням за підтримки легкої бронетехніки рішуче перехопили порушників. Під час наближення ті на мить завмерли в нерішучості, а тоді один із них почав стрімко рухатися в протилежному напрямку.\n\nРозцінивши це як спробу втечі, а отже попередньо визначивши порушників як диверсантів Чорної Ліги, я наказав розпочати бій о 14:7:25.\n\nДопоміжний вогонь бронетехніки забезпечив швидку нейтралізацію. Вогонь у відповідь недовго вела лише одна жінка. Переконавшись у смерті порушників, ми побіжно обшукали їх і майно, після чого останки та речі кремували, щоб унеможливити подальше активне чи пасивне спостереження.\n\nДо повідомлення додано перелік предметів. Особливу увагу слід звернути на надзвичайно переконливі підробки різноманітних американських і сибірських дорожніх документів.\n\nНа захист Центрального Комітету,\n\nҐ. А. Ґончаров,\nлейтенант державної безпеки, Червонопрапорний східний округ"
 RUS_tourist.46.a: "Вірність Центральному Комітетові."

 RUS_tourist.47.t: "Незвичайне спостереження"
 RUS_tourist.47.d: "Один із наших розвідувальних літаків доповів командуванню про невелику групу, що перетинала річку між нашою територією та Народною Республікою.\n\nСпустившись для точнішого огляду, пілот побачив кількох вершників і ще кілька в'ючних коней із багажем. Найдивнішою була присутність серед вантажу американського прапора.\n\nПілот збирався обстріляти групу з бортової зброї, як це зазвичай роблять із неоголошеними порушниками кордону, але через дивність ситуації натомість вийшов на зв'язок. Судячи з напрямку, група рухалася до Воровской тєріторії, хоча шлях міг провести її дуже близько від наших аеродромів біля Сурґута.\n\nЩоб уникнути можливого зіткнення, радять не контактувати з ними, якщо тільки вони не спробують безпосередньо проникнути в охоронний периметр передових баз. У будь-якому разі ми пильно стежитимемо."
 RUS_tourist.47.a: "Стежити - але поки не вступати в бій."

 RUS_tourist.48.t: "Запис 18: Вільні авіатори"
 RUS_tourist.48.d: "Від часу прибуття до Західного Сибіру втеча до лісів або, в містах, до всюдисущих щілинних окопів стала звичною справою. Зоя каже, що німці роками бомблять усе, що бачать, і руйнування довкола свідчать про жахливі наслідки.\n\nАле коли хтось говорить про бомбардувальники, то завжди зі стриманою пошаною згадує й Авіаторів. Зоя ними захоплюється й пам'ятає з молодих років у німецькому тилу. Та хоч вона каже, що ми вже на їхній території, жодного ми не зустріли. Принаймні на землі: маленький літак постійно за нами стежить. Зоя каже, що вони обережні, бо німецькі диверсанти вже намагалися їм зашкодити.\n\nЄдине, що ми бачили здалеку в бінокль, - група біпланів на навчаннях. Тепер я розумію, звідки розповіді про майстерність Авіаторів: ніколи не бачив, щоб літаки так різко повертали, так низько літали й залишалися неушкодженими. Напевно, треба бути неймовірним пілотом, щоб роками воювати проти Люфтваффе на дерев'яно-полотняних машинах із тракторними двигунами.\n\nНе зустрівшись із самими Авіаторами, ми продовжуємо шлях на захід, де нібито цілий регіон контролює лютий бандитський клан. Поки не знаю, чи вірити.\n\nЗоя каже, що за кілька днів ми дістанемося їхньої території. Тоді й побачимо, наскільки правдиві історії."
 RUS_tourist.48.a: "Справді неймовірні пілоти."

 RUS_tourist.49.t: "Сліди на обрії"
 RUS_tourist.49.d: "Кілька наших братів, які пильнують кордон біля Няґані, доповіли про невелику групу вершників, що ввійшла на нашу територію з земель Авіаторів.\n\nВони не говорили з нами. Не зверталися до наших представників. Не запропонували данини чи торгівлі. Не дотримувалися правильних маршрутів, позначених для тих, кому ми раніше дарували безпечний прохід. Не виявили належної пошани до тих, хто тут є законом.\n\nА найважливіше - вони, схоже, мають цінності.\n\nПомічено не одного навантаженого товарами коня та кілька незвичайних і рідкісних дивовижець, серед них американський прапор. Їх можна продати, а все, за що вони були придбані, розподілити між нами. Принаймні один мандрівник явно озброєний, але для Юґри це цілком звичайно, і ми добре знаємо, як поводитися з чужинцями на своїй території.\n\nМашини вже готують - і для нападників, і для майбутньої здобичі. Залишається лише вирішити, наскільки велику групу відправити."
 RUS_tourist.49.a: "Наскільки вони можуть бути небезпечними? Досить малої групи."
 RUS_tourist.49.b: "Ми не знаємо, на що вони здатні. Про всяк випадок послати більше людей."

 RUS_tourist.50.t: "Запис 19: Воровская тєріторія Юґри"
 RUS_tourist.50.d: "Схоже, люди, які розповідали про Юґру перед нашим походом через землі Авіаторів, казали правду.\n\nНевдовзі після перетину кордону біля Няґані на нас напали чоловіки, яких я спершу вважав звичайними бандитами. Найняти Зою було, безперечно, найкращим моїм рішенням у Росії, якщо не рахувати часу в Омску, адже саме вона помітила сонячний відблиск від одного з їхніх прицілів.\n\nОдного коня вбили, але завдяки її блискавичним діям ми з іншими вирвалися з-під першого обстрілу й сховалися за складкою місцевости. Там я побачив справжню майстриню за роботою: вона застрелила двох ворогів із величезної відстані. Решта нападників невдовзі відступила, явно не очікуючи зустріти серед нас такого стрільця.\n\nОглянувши тіла, Зоя сказала, що їхні татуювання належать людям, які довго сиділи у в'язниці. «Злодії» Воровской тєріторії. Убивши кількох із них і не дочекавшись теплого прийому, ми за її порадою якнайшвидше рушили через регіон. Заперечувати я не мав причин.\n\nТепер ми щодуху прямуємо на північний захід і, якщо пощастить, незабаром покинемо це місце."
 RUS_tourist.50.a: "Не знаю, чого я чекав від «Воровской тєріторії»."

 RUS_tourist.51.t: "Успішна засідка"
 RUS_tourist.51.d: "Група, яку ми відрядили перестріти невідомих порушників, кілька годин тому повернулася з машинами, повними здобичі й порубаної конини.\n\nЗа словами старшого брата, на прибулих напали, коли ті ввійшли до невеликої балки: коней вибили з-під них, а наші люди відкрили вогонь згори. Вони чинили опір як могли, але незабаром загинули у майже безнадійному тактичному становищі.\n\nКрім однієї жінки з рушницею, на якій брат розпізнав знаки колишньої антинімецької партизанської організації і яка вбила двох братів, порушники виявилися легкою здобиччю. Після бою група обібрала тіла, скинула їх у неглибоку могилу, обшукала обоз і забила коней.\n\nСеред речей було багато предметів і дивовижець, що дуже зацікавили братів, зокрема товари з усіх куточків Сибіру, які рідко побачиш поблизу Уралу. Крім того, американський прапор, помічений раніше й також захоплений, належав одному з порушників, який, на диво, мав американський паспорт.\n\nНеймовірно, але він носив і щоденник про свою подорож безмежними просторами Сибіру та власне Росії, через землі багатьох держав і на зустріч із багатьма людьми. Дуже захоплива історія.\n\nАле історія, що закінчується тут."
 RUS_tourist.51.a: "Не знаю, чого вони чекали від «Воровской тєріторії»."
 
 RUS_tourist.52.t: "У квадраті DM-73 виявлено невідоме спостереження"
 RUS_tourist.52.d: "Товаришу комісаре,\n\nСьогодні близько 13:10 за допомогою апаратури далекого спостереження було помічено невелику групу невідомих осіб, яка піднялася на одну з вершин Заполярного Уралу на південний захід від Воркути.\n\nХоч вони явно зійшли з боку Воровской тєріторії, наразі ми не вважаємо їх представниками владного угруповання цієї території, оскільки раніше ні я, ні мій загін їх не помічали, а склад, спорядження та одяг групи, як і згодом упізнаний серед неї американський прапор, не відповідають такому припущенню.\n\nОглянувши землі внизу (але не помітивши ні мене, ні моїх офіцерів завдяки правильному застосуванню маскування), один із членів групи, як було помічено, подав іншому знак заперечення, після чого вся група почала спускатися в тому самому напрямку, звідки прийшла. Вісім годин подальшого інтенсивного спостереження, для якого мої сили було розосереджено приблизно на сто (100) кілометрів у кожен бік, не виявили жодних спроб групи повторити проникнення.\n\nНаразі я не можу зробити висновку про наміри чи цілі зазначеної групи. Однак можу впевнено стверджувати, що через мій сектор спостереження вона не ввійшла на територію Виправної держави, а підтримання безпеки незмінно залишається моїм найпершим обов'язком у всіх справах.\n\nНа захисті Держави,\n\nМ. М. Лєбєдєв,\nкапітан 8492-ї спостережної роти"
 RUS_tourist.52.a: "Держава залишається в безпеці. Завжди."

 RUS_tourist.53.t: "Запис 20: Воркутинська виправна держава"
 RUS_tourist.53.d: "До сьогодні я легковажив небезпеками, які, як мені відомо, існують і навіть переважають по всій Росії. Я пройшов через багато держав, які, як тепер знаю, пригноблюють і тероризують своїх мешканців, тоді як Омск був яскравим і блискучим винятком, за яким я досі страшенно сумую. Але сьогодні я вперше повернув назад.\n\nПісля засідки у Воровской тєріторії ми швидко ввійшли в північну частину Уральських гір, невдовзі піднялися на вершину й оглянули пустельні землі по той бік. І коли я дивився на них, то чомусь відчув холод, не пов'язаний із погодою. Певність, якої ще ніколи не знав. Певність, що подальший шлях стане кінцем для мене. Для всіх нас.\n\nЗасідка й наш порятунок на волосині навчили мене, що я більше не можу думати лише про себе. Зоя та інші супутники довірили мені вести їх за собою, а я мало не завів усіх на смерть, бо не дослухався до почутих історій. Ніхто з них нічого не сказав, але я знаю, що вони про це думали. Тож коли, оглянувши ту холодну землю, я повернувся до Зої й похитав головою, то лише з її очей зрозумів, що зробив правильний вибір.\n\nОтже, ми повертаємося на південь, до Свєрдловска. Нам знову доведеться перетнути Воровскую тєріторію, але цього разу ми будемо швидкими й пильними. Зоя впевнена, що тоді вдруге в засідку ми не потрапимо."
 RUS_tourist.53.a: "Відчуття певности на краю світу."

 RUS_tourist.54.t: "Незвичайна подія"
 RUS_tourist.54.d: "На наших північних кордонах сталася вельми цікава подія. Загін 364-го стрілецького полку перехопив значні сили бандитів із Юґри, які переслідували дивну групу під американським прапором.\n\nЗа свідченнями лейтенанта Романова, група, схоже, переважно складалася з дезертирів із Далекосхідного Совєту Яґоди, але, що найдивніше, очолював її американець. Цей чоловік, який назвався «Стівом», сказав Романову, що він турист і досліджує Росію, та надав докази на підтвердження своєї неймовірної заяви, зокрема справжній американський паспорт і квиток до Маґадана.\n\nДехто в групі здавався досвідченим ветераном і міг становити загрозу, проте Романов вирішив, що «Стів» майже не загрожує Округу, і супроводив групу до Свєрдловска."
 RUS_tourist.54.a: "Американець? Що ж, невелика екскурсія йому не зашкодить."

 RUS_tourist.55.t: "Запис 21: Свєрдловск"
 RUS_tourist.55.d: "Зоя розповідала, що Свєрдловск відколовся від Західносибірської Республіки під владою маршала Рокоссовского, так званого «Лева Сибіру». Вона мало знала про їхнє правління, але чула, що Рокоссовскій керує значно м'якше за лєніністів у Тюмєні. Якщо їхні патрулі не відкрили вогонь одразу, гадаю, вона чула правильно.\n\nПісля короткого допиту, під час якого я переказав свою історію про туриста-янкі й показав документи на підтвердження, мене разом з усією групою під озброєною охороною супроводили до самого Свєрдловска.\n\nХоч за нашою групою постійно стежили, життя у Свєрдловску здавалося цілком стерпним. Солдати були приязними, а люди здавалися задоволеними владою маршала. Нас поселили в пристойних приміщеннях місцевої казарми й нагодували цілком терпимою їжею. Не так добре, як в Омску, але безперечно краще за консерви на морозі в Уральських горах.\n\nНаступного ранку для нас улаштували парад стрілецької дивізії. Видовище було неабияке: ряд за рядом дисципліновані солдати крокували майже нога в ногу, а артилерійська батарея дала салют із 21 гарматного пострілу. Це, чорт забирай, значно краще за те, що зазвичай показує Національна гвардія Міннесоти. Гадаю, Зоя та інші теж так подумали: вона сказала, що востаннє бачила такий парад багато років тому, саме перед Сибірською війною між Далекосхідним Совєтом і Центральносибірською Республікою.\n\nПровівши в місті ще трохи часу й придбавши додаткові припаси, ми попрощалися зі Свєрдловском. Наступний пункт - Златоуст, де, як мені розповіли, діють доволі відомі торговці зброєю. Зоя каже, що неприємностей не буде, а я дуже хочу побачити, як виглядає країна під владою торговців зброєю."
 RUS_tourist.55.a: "Непогано, але Омск був кращий."

 RUS_tourist.56.t: "Американець прямує на захід"
 RUS_tourist.56.d: "Було б неправдою сказати, що між Златоустом і Свєрдловском немає напруження, але кордони відкриті для торгівлі, подорожей і туризму. Сам Свєрдловск розташований досить близько до нашого Новоуральска, який став осередком для караванів, мандрівників, підприємств і біженців, що осідають уздовж шляху або їдуть ним, звісно, якщо платять. Однак пізно вчора ввечері до Новоуральска пішки прямували двоє людей, і один із них ніс за собою американський прапор. Їхня рішуча хода до нашого кордону викликала цікаві погляди одних охоронців і смішки більшости інших.\n\n«Вітаю! Мене звати Стів! Я хотів би проїхати Республікою Златоуст, щоб пізнати її унікальне становище й численні цікаві місця, які вона пропонує громадянам!» Більшість охоронців усміхалися, а дехто не стримав сміху, проте вони залишалися професійними й зібраними.\n\n«Да, амєріканскій. Але ви двоє мусите, е-е, як це сказати... платити мито». Можливо, Стіву буде легше сприйняти цю новину англійською. Хай ким буде мандрівник, хай якими шляхетними будуть його цілі й хай яким цікавим буде він сам, без грошей ми просто не зможемо підтримувати свій рівень життя. Цей дивний і, вочевидь, відважний турист не був винятком.\n\n«Гадаю, у нас немає златоустівської валюти...» Молодий чоловік зніяковіло затнувся рідною англійською, але його супутниця, загартована й безсумнівно російська жінка, запропонувала прикордонникам трохи валюти, товарів для обміну та вміло їх заговорила, щоб пара могла продовжити шлях. Хоч це було далеко не стільки, скільки зазвичай беруть наші охоронці, гості, схоже, не мали лихих намірів, тож невдовзі їм дозволили пройти й сісти на автобус до самого Златоуста."
 RUS_tourist.56.a: "Аби тільки не наробив лиха..."

 RUS_tourist.57.t: "Зпаис 21: ЗЛАтуусст!"
 RUS_tourist.57.d: "злАТОУСТ супперр! ЧуДОВИЙ! Ч У Д О В И Й! коли ми знаййшли де зупнитись, ми з Зоєй пішли глянути купу міста. Багат культури й веселощів і все таке, дужи весило. Пишу це зараз у барі, дехто з місцевих почув про мене і захтів купити мені випивки! Зоя була твереза, алеее ми з друзями (Владіміром, Тьомою й Данилом) випили дуууже багат горілки. вони клиуть мене танцювати, тож я пішов. Не мерзни, щоденникууу\n\nНОВИНИ НОВИНИ НОВИНИ, зараз перша година ночіі. НОЧІ. Мало не поліз у бійку!!! Якийсь тупий міісцевий каже: «Мені не подобається твоє волосся, янкі», а я йому: «ага і шоо ти зробиш». Зараз СМІШНО. Зоя НЕ думала, шо це смішно. Мусила припнити бійку. Надіюсь я її не роззчаровую...\n\nЧЕТВЕРТА РАНКУ ХТОСЬ МЕНЕ ВДАРИФ, ДУЖЕ ПОГАНО. БАРУ НЕ ПОДОБАЄЦЯ. Зоя кудисьменеведе тож пакааа!\n\n...Я прокинувся вранці в чужому хліві. Одяг у багнюці, похмілля огидно сильне, а від мене смердить, як від сміття. Зоя розбудила мене, хлюпнувши водою в обличчя, і переказала вчорашні події. Виявляється, після того, як я почав бійку із СОЛДАТАМИ в одному з найпрестижніших барів Златоуста, я по-п'яному й по-дурному поліз до Нєллі, доньки Міхаїла Калішнакова.\n\nВідразу після цього мене знудило. Зої мало не довелося залякати весь бар, щоб винести звідти мою непритомну дупу, а тоді вона повезла нас до кордону з Уральською Лігою. Вирушаємо туди завтра, сподіваюся, без розлюченого натовпу солдатів-торговців за спиною..."
 RUS_tourist.57.a: "Усе як у тумані, але цього я точно не забуду."

 RUS_tourist.58.t: "Незнайомці з морозу"
 RUS_tourist.58.d: "Гвардійці дивилися на незграбного чоловіка та його провідницю, не зовсім розуміючи, що про них думати. Обоє куталися в товсті зимові пальта, сувора жінка несла ґвинтівку з оптичним прицілом, а окуляри чоловіка так запітніли, що крізь них нічого не було видно. «Ми просимо впустити нас на ваші землі, - уривчасто промовила жінка російською. - Мене звати Зоя, а цього чоловіка - Стів». Почувши своє ім'я, чоловік помахав гвардійцям, а ті перезирнулися.\n\nГвардійці насторожено оглядали дивну пару, певні, що чоловік не становить загрози, тоді як жінка випромінювала смертоносну впевненість. Нарешті один із гвардійців заговорив: «Ви біженці? У нас багато гарячої їжі й...»\n\n«Ні, - відповіла жінка, - ми не біженці». Вартові спантеличено перезирнулися, і другий гвардієць запитав:\n\n«Тоді хто ви? Шукаєте роботу? Найманці?»\n\nЖінка, Зоя, усміхнулася, скрививши обвітрене вітром обличчя: «Ми не біженці й не найманці, товариші, ми туристи».\n\nГвардійці не знали, що й думати, але жестом наказали парі йти за ними до Сібаю. Туристи? Який божевільний попреться на екскурсію Південним Уралом?"
 RUS_tourist.58.a: "Зачекайте, поки про це почує Старінов!"

 RUS_tourist.59.t: "Запис 22: Затишок у бункері"
 RUS_tourist.59.d: "Коли я зайшов за мури Сібаю, найменше від міста-бункера сподівався затишку. Радий повідомити, що моє приміщення чисте й зручне, а в них навіть є опалення! Росіяни з інших громад казали мені, що Південний Урал - пекельна діра, але, чесно кажучи, я цього не бачу. Всі такі приязні, їжа добра, а дехто з гвардійців навіть трохи знає англійську! Навіть Зоя трохи розслабилася. Вона багато часу проводить із якимось Зайцєвим, здається, він теж колись був снайпером. Я також знайшов собі друга, його звати Павєл. Хороший хлопець, приблизно мого віку, викурює пачку на день і попри це має напрочуд ніжний співочий голос.\n\nМи з ним говорили якось увечері про Південний Урал, і я запитав, чому цей край має таку погану славу. «Стів, - сказав він мені ламаною англійською з сильним акцентом, - Уральська Ліга тримає людей у безпеці за стінами і зі зброєю. За стінами холод, багато бандит». Я запитав, як дають собі раду інші громади на Уралі та куди він порадив би рушити далі, а він відповів: «нікуди, їдь з Уралу. Орск - країна бандит під владою Короля Ґвалтівника. Маґнітоґорск іще гірше, там головний божевільний учений, ніхто ніколи не йде. Орєнбурґ повний дурнів, марнування часу». Гадаю, якщо інші території такі погані, як каже Павєл, то не дивно, що Сібай - місто-бункер! Треба запитати Зою, здається, вона знає потроху про все."
 RUS_tourist.59.a: "Його справді звати Король Ґвалтівник?"

 RUS_tourist.60.t: "Фашистський прислужник біля воріт!"
 RUS_tourist.60.d: "Сьогодні Комуни здійняли страшенний галас, бо до ради дійшли повідомлення про американця й, імовірно, посіпаку РОА, які перетнули наші кордони. Ми не можемо сидіти склавши руки й дозволити фашистському лакузі паскудити нашу вільну соціялістичну землю! Тому рада зібралася, щоб визначити, як дати раду цьому підступному загарбникові. Після двадцяти шести годин дебатів і палкої бійки навкулачки було досягнуто згоди. Рада дійшла висновку, що застосування сили для затримання фашистського американського шпигуна та його гітлерівського посіпаки саме по собі було б фашистською дією. Хіба нашу комуну не засновано на принципах самовизначення? Ми можемо його ненавидіти, але він має право бути фашистською маріонеткою Американського Райху, а ми не можемо це право порушувати. Якщо ми ув'язнимо чи атакуємо цього чоловіка за те, що він нацистський покидьок, хіба ми самі не фашисти?"
 RUS_tourist.60.a: "Принаймні наша мораль лишилася чистою."
 
 RUS_tourist.61.t: "Запис 23: Наче автокатастрофа, влаштована комітетом"
 RUS_tourist.61.d: "Я часто чув в Орєнбурзі слово «анархія». Гадаю, насправді вони мали на увазі «повний пиздець». Мене запросили на засідання ради, щоб я, американський нацисто-царисто-бандит, міг «просвітитися анархізмом у дії». Не знаю, чого цим хотіли досягти, бо ніколи не бачив нічого настільки безладного й недієздатного! Знаю, ми, американці, жартуємо про заплутану купу лайна, на яку перетворилися НПП і РДК, але наша політика й поруч не стояла з Орєнбурґом.\n\nЗасідання почалося з того, що промовця, якогось невисокого чоловічка в окулярах, перекрикувала половина зали, якій він, мабуть, не дуже подобався. Російську я знаю не чудово, але неважко здогадатися, що означає «фашісти». Я гадки не маю, що на цьому засіданні взагалі мали обговорювати, і майже впевнений, що рада також. У якийсь момент аж троє промовців намагалися виголошувати промови одночасно, кричачи дедалі гучніше, щоб їх почули. Я кілька разів пробував щось сказати Зої, але за галасом вона мене не чула. Про бійку посеред зали чи черевик, який мало не влучив мені просто в голову, я взагалі мовчатиму.\n\nКоли я був малим, учителька використовувала паличку промовця, щоб говорила лише одна людина й ми не перекрикували одне одного. Орєнбурґу така річ точно пішла б на користь, але певен, що тут паличку промовця просто оголосили б «знаряддям гітлерівського гноблення». Орєнбурґ - паскудне місце, і я дуже хочу забратися звідси до біса."
 RUS_tourist.61.a: "«Я так утомився»."

 RUS_tourist.62.t: "Привіт, мамо, привіт, тату"
 RUS_tourist.62.d: "Привіт, мамо й тату! Пишу вам із Сибіру, щоб просто сказати, що зі мною все гаразд і не треба хвилюватися. Урал і Західний Сибір стали справжньою пригодою. Тут шалено багато воєначальників, а в самому Західному Сибіру можна знайти всі ідеології, які лише існують. Нацисти, комуняки, анархісти й навіть ліберали, кожен зі своїм баченням порятунку російського народу. Важко повірити, що лише тридцять років тому (приблизно) усе це було однією великою країною. Попри спустошення й руїни тут є краса, якої я не очікував побачити. Пам'ятаю, як одного ранку прокинувся в Сібаї й дивився, як сонце сходить над Уралом. Ще ніколи в житті я так не шкодував, що не став художником. Хотів би я, щоб ви побачили те, що бачу я, тобто добру його частину.\n\nЇм я добре, а моя провідниця Зоя оберігає мене. Колись вона була партизанкою-снайперкою, тож поруч із нею я майже не хвилююся. Гадаю, вона сподобалася б кузену Генрі, ви ж знаєте його слабкість до сильних жінок. Вона вчить мене російської, і, здається, я справді починаю її опановувати. Я маю багато запитань до місцевих і почуваюся ніяково, коли майже все перекладає Зоя, тож радий, що уроки йдуть так добре.\n\nЯк там сусіди? Бабусин кашель минув? Хто цього року виграв чемпіонат дитячої бейсбольної ліги? Сумую за вами й напишу знову, щойно зможу!\n\nP.S. Щоб цей лист потрапив до вас, мені довелося віддати контрабандисту автоматичну ґвинтівку, тож він коштує один АК-47. Безперечно, трохи дорожче за поштову марку."
 RUS_tourist.62.a: "З любов'ю, ваш син Стів."

 RUS_tourist.63.t: "Прибуття з Орєнбурґа"
 RUS_tourist.63.d: "Нещодавно на землі Республіки з території під управлінням Орєнбурґа ввійшла дивна група. Вона складалася з кількох росіян і чималого обозу, але, що дивовижно, очолював її американець, який попросив дозволу пройти до Уфи.\n\nСпершу наші прикордонні загони підозрювали їхні мотиви, але тривалий допит групи й ретельний огляд її майна переконали їх у відсутності ворожих намірів. Схоже, цей американець і справді подорожує Росією, відвідує якомога більше держав і веде їхній опис, і цей факт не лишився поза увагою кількох членів нашого уряду.\n\nВони наголосили, що міжнародне визнання Республіки було й залишається життєво важливим для збереження нашого суверенітету перед лицем численних регіональних та інших загроз. Тому поширення в Америці, а отже, і в ОВН, відомостей про нашу Республіку, культуру та труднощі може принести лише користь.\n\nБуло запропоновано провести туриста та його почет Уфою, ознайомити його з нашими культурними й релігійними звичаями та дати побачити звичні руйнування, яких завдають німецькі бомбардувальники. Після цього він неодмінно розповість про тяжке становище нашої Республіки, яка непохитно захищає свій народ у час великої небезпеки. І перед лицем великих загроз.\n\nЯкщо це приверне бодай якусь увагу, воно того варте. Залишається тільки вирішити, наскільки наполегливими нам бути."
 RUS_tourist.63.a: "Дуже наполегливими. Не можна змарнувати цю нагоду."
 RUS_tourist.63.b: "Менш наполегливими. Не можна здаватися вимогливими."

 RUS_tourist.64.t: "Запис 24: Ісламська республіка Башкирія"
 RUS_tourist.64.d: "Досі Росія була для мене землею, де я багато чого робив уперше. І Башкирія, офіційна ісламська держава, створена башкирською меншиною для себе, безперечно, одна з таких речей.\n\nМи залишили позаду, на щастя, хаос Орєнбурґа й перетнули кордон лише після кількох годин допиту - за нашими теперішніми мірками дуже швидко. До того ж невдовзі до нас підійшла невелика урядова делегація й запропонувала все показати. Зоя остерігалася всіляких «наглядачів», але я побачив можливість дістатися до того, чого інакше ми могли б не побачити через страх когось образити. І ця можливість невдовзі дала плоди.\n\nПредставник запросив нас на богослужіння в центральній мечеті Уфи, якщо ми поводитимемося тихо й шанобливо. Хоч усе життя я був християнином, мушу сказати, що це було надзвичайно красиво. Заклик муедзина, що лунав із мінарету мечеті, дивним чином заспокоював, а усталений ритуал усередині, хоч і дуже відрізнявся від усього баченого мною в церквах, випромінював спокій і почуття релігійної єдности, які я навряд чи зможу точно описати.\n\nПізніше ми оглянули ринок, де Зоя як могла розповіла мені про переслідування, яких башкири зазнавали протягом своєї історії. Про те, як ця держава стала їхньою спробою вибороти справжню батьківщину посеред війни між сторонами, що однаково їх ненавидять.\n\nТа, на жаль, час рушати далі, тож уранці ми перетнемо Бєлу. По той бік нібито існує якесь «Братство», і я мимоволі думаю, чи подібне воно до громади в Ойротії."
 RUS_tourist.64.a: "Батьківщина для свого народу - справді шляхетна мета."

 RUS_tourist.65.t: "Запис 24: Ісламська республіка Башкирія"
 RUS_tourist.65.d: "За останній короткий час я перейнявся величезною повагою до башкирського народу. І я не кажу таких речей легковажно.\n\nСтільки держав, які ми проминули, існують лише тому, що якийсь тиран захотів їх створити. Бо цей тиран захотів цілковито керувати життям тисяч або мільйонів людей, і горе тому, хто стане йому на заваді. Але тут є національна ідентичність. Національна культура. Національна релігія. Усе те, за що башкири борються, хоч майже всі намагаються це в них відібрати.\n\nСьогодні, коли ми оглядали центр міста й відвідували вцілілі тюркські пам'ятки, ми побачили докази цієї боротьби. Під час одного з постійних німецьких бомбардувань було зруйновано кілька будівель в Уфі, й ми опинилися неподалік. Ми відразу побачили, як люди, не лише солдати й поліціянти, а звичайні люди з усіх верств, кинулися допомагати тим, хто опинився під завалами. А оскільки ми були поруч, то не могли не приєднатися.\n\nДопомагаючи, я відчував довкола дух спільноти, якого нам так бракувало в багатьох місцях, де ми досі побували. Коли повернуся додому, сподіваюся, що моя подорож до Башкирії та все побачене й відчуте тут спонукають інших пам'ятати про цю крихітну державу. Цей народ на те заслуговує.\n\nТа, на жаль, наш час тут неминуче добіг кінця, тож уранці ми перетнемо Бєлу. По той бік нібито існує якесь «Братство», і я мимоволі думаю, чи подібне воно до громади в Ойротії."
 RUS_tourist.65.a: "Батьківщина для свого народу - справді шляхетна мета."

 RUS_tourist.66.t: "Арійське прибуття?"
 RUS_tourist.66.d: "Наші брати, які стежать за Бєлою, пильнуючи можливого вторгнення брудних башкирів, доповіли своїм командирам у Пєрмгаймі про надзвичайно дивну зустріч.\n\nГрупа під американським прапором нещодавно перетнула річку. Вона складалася не з башкирів, а зі слов'ян на чолі з чоловіком, якого вони вважали потенційним арійцем. Коли брати підійшли, щоб його заарештувати, він упізнав їхні однострої й заговорив німецькою. Тому вони не знають, що й думати про цю групу.\n\nЧоловік стверджує, що він американець, який подорожує Росією, щоб оглянути її держави й суспільства. Ми добре знаємо, скільки розкладницького недолюдського впливу існує в Америці, але не можемо заперечувати бодай саму можливість існування там арійства. Якщо ми приймемо його й покажемо перевагу нашої культури та раси, а також наше прагнення принести силу й чистоту всій нації, це може дуже допомогти справі Фюрера.\n\nВодночас із ним подорожує група озброєних слов'ян, які до того ж не здаються такими покірними, якими мають бути неарійці. Він також виявив певне занепокоєння, побачивши загін рабів у прикордонників. Деякі брати висловили побоювання, що вся ця вистава з «американцем» може бути хитрістю, спробою заслати шпигуна на наші землі.\n\nМи мусимо ухвалити рішення. Що робити із цим гаданим «арійцем»?"
 RUS_tourist.66.a: "Арієць із-за кордону? Ми мусимо його прийняти!"
 RUS_tourist.66.b: "Придивіться уважніше. Слов'янській підступності немає меж."

 RUS_tourist.67.t: "Запис 25: Арійське Братство"
 RUS_tourist.67.d: "Так зване Братство зовсім не схоже на те, що я уявляв. Воно гірше. Настільки гірше, що, правду кажучи, мені важко знайти слова, здатні передати весь мій жах.\n\nПеретнувши Бєлу з боку Уфи, ми майже відразу натрапили на брутальних солдатів у схожих на німецькі одностроях, але щойно я заговорив із ними тією мовою, їхня поведінка цілковито змінилася. Невдовзі нас уже супроводжували до їхньої столиці в Пєрмі, або Пєрмгаймі, як вони її називають. Саме там я побачив усю потворність держави, у якій ми опинилися.\n\nЦе місто - кошмар, де величезні колони рабів переганяють з одного місця примусової праці на інше. Найменше вагання чи непокора зустрічає жорстоке насильство або страту на місці, і вибір, схоже, залежить лише від примхи конкретного гнобителя. «Брати» називають рабів недолюдьми, а себе й мене - арійцями, і я зрозумів, що тільки тому ми ще не приєдналися до нещасних перед нами.\n\nМені вже довелося докласти всіх зусиль, щоб Зоя та інші трималися разом і під моїм наглядом, і я не знаю, чи зможу робити це ще довго. Від кожної розмови з одним із цих чудовиськ мене нудить, і я боюся, що невдовзі вони розгадають мої справжні почуття.\n\nТому я поговорив із Зоєю, і вона погодилася, що треба діяти, перш ніж нас розлучать або господарі змінять думку про мене. Цієї ночі ми дочекаємося темряви й рушимо до Ками, на іншому березі якої лежить порятунок.\n\nЛишається сподіватися, що ми дістанемося туди. Не треба було сюди приходити."
 RUS_tourist.67.a: "Цілковитий жах."

 RUS_tourist.68.t: "Не справжній арієць"
 RUS_tourist.68.d: "Наша обачність під час зустрічі з новоприбулим була виправданою. Бо він не справжній арієць.\n\nХоч він визнав перевагу конструкції нашого спорядження, хоч говорив німецькою, хоч його медові слова обіцяли дружбу й пізнання, вчинки довели протилежне. А наші брати були досить пильними, щоб їх помітити. Досить пильними, щоб захистити чистоту духу, чистоту форми й чистоту сутности, втілені в арійцеві. Чистоту, якої цей прибулець явно не мав.\n\nБо хіба справжній арієць добровільно подорожував би з озброєними слов'янами без ретельного нагляду? Хіба справжній арієць ставився б до них як до рівних? Хіба справжнього арійця непокоїло б «тяжке становище» недолюдей? Авжеж, жоден справжній арієць.\n\nТому і з ним, і з ними повелися як із будь-якими іншими підозрілими неарійцями. Їх обеззброїли, закували в кайдани й погнали до Пєрмгайма. Усіх, крім однієї слов'янки, яка спробувала чинити опір, за що рештки її тіла викинули в лісі.\n\nБратів, які наглядають за фабриками довкола нашої столиці, попередили про близьке прибуття нових працівників, і невдовзі їм знайдуть місця, де вони працюватимуть на користь своїх вищих. Так вони служитимуть меті, на яку заслуговують.\n\nА якщо вони не захочуть цього робити, що ж, брати вправно привчають до належної дисципліни."
 RUS_tourist.68.a: "Слов'янська сутність завжди себе виказує."

 RUS_tourist.69.t: "Сутичка на річці"
 RUS_tourist.69.d: "Сьогодні надійшло повідомлення про сутичку поблизу річки Ками. Частини Імперської армії, розміщені неподалік для спостереження за територією фанатиків у Пєрмі, помітили невелику групу, що тікала від ополчення Братства й намагалася перетнути річку.\n\nПомітивши, що один із членів групи несе великий американський прапор, а також добре знаючи жорстокість мешканців території Братства, вони вирішили втрутитися. Бійці Братства відкрили вогонь по групі, яка намагалася перейти річку, а наші сили відповіли, убили або поранили кількох нападників і змусили решту відступити.\n\nПісля порятунку й допиту ватажок групи надав докази свого американського громадянства та попросив дозволу ввійти до Князівства разом зі своїми супутниками. Він також пояснив, що досліджує Росію, і висловив величезну вдячність за порятунок від сил Братства.\n\nПереконавшись, що жодного супутника американця не розшукує царський уряд, групі дозволили ввійти, і вона рушила до Іжвєска.\n\nСлужба безпеки наглядатиме за ними до самого від'їзду."
 RUS_tourist.69.a: "Американець? Тут? Зі сходу?"

 RUS_tourist.70.t: "Запис 26: Князівство Вятка"
 RUS_tourist.70.d: "Слава Богу, що ті солдати врятували нас, коли ми переходили річку від психопатів із Пєрмі. Я ніколи більше не хочу туди повертатися. І сподіваюся, що хтось покладе їм край назавжди. Зоя погоджується.\n\nНова країна, у якій ми опинилися, Вятка, здається значно стабільнішою за кілька останніх. Нею нібито править цар, якого я вважав мертвим. Принаймні так мені сказав Міхаїл ще в Чіті. Можливо, вони родичі? Хай там як, тепер ми тут, не оточені вбивцями в чорному чи справжніми рабами, тож я однаково вдячний.\n\nМи рушили на південь, до міста Іжвєска, через яке, за словами Зої, вона проходила багато років тому дорогою на схід. Це безперечно одне з найрозвиненіших міст, які ми досі бачили, з величезними промисловими підприємствами й фабриками, що випускають усіляке обладнання. Та попри це відчувається загальна млявість, ніби все трохи зблякло. Я не зовсім знаю, як це правильно описати.\n\nПроте в цьому місті ми знайшли заміну коням, адже тепер перебуваємо в частині Росії з розгалуженою, хай і пошкодженою, мережею доріг. За частину грошей, які в мене ще лишилися, я придбав доволі нову вантажівку. Нею ми й продовжимо шлях на південний схід, до Татарстану.\n\nВона має значно прискорити останній відтинок нашої подорожі й стане кращим засобом утечі, якщо ми знову потрапимо в халепу."
 RUS_tourist.70.a: "Зблякле місто. Але принаймні безпечне."

 RUS_tourist.71.t: "Прибульці з Вятки"
 RUS_tourist.71.d: "Сьогодні по обіді група ввійшла до Республіки з Вятки, перетнувши однойменну річку й показавши свої подорожні документи. Вона складалася переважно з росіян, але серед них був один надзвичайний виняток: американець, який стверджував, що мандрує всією Росією, і мав на підтвердження приголомшливу кількість предметів із земель, розташованих аж біля Пєтропавловска.\n\nПідтвердивши свою особу, вони отримали дозвіл продовжити шлях і виїхали до Казані через Арск вантажівкою вятського виробництва. З її вихлопної труби майорів великий американський прапор, привертаючи увагу багатьох людей довкола.\n\nМи не зовсім розуміємо, що думати про цю подію. Група та її склад, особливо американець із доказами своїх мандрів, надто показні й складні, щоб бути правдоподібним прикриттям для диверсантів із сусідніх держав. Утім, якщо йдеться про татарський народ, то слово «розсудливі» історично важко застосувати до росіян. Треба бути обережними.\n\nГрупі не завдаватимуть шкоди, щоб не накликати невдоволення американців або, відповідно, ОВН. Їй дозволено продовжити шлях і спілкуватися з людьми, якщо її члени не порушуватимуть наших законів.\n\nАле за ними стежитимуть. Ретельно. Безпека нашого народу вимагає постійної пильности навіть у ситуаціях, які можуть здаватися безглуздими."
 RUS_tourist.71.a: "Завжди треба лишатися уважними."
 
 RUS_tourist.72.t: "Запис 27: Республіка Татарстан"
 RUS_tourist.72.d: "Увійшовши до Татарстану, ще однієї держави, заснованої на ідентичності етнічної меншини, я, гадаю, мав усі підстави вважати її схожою на сусідню Башкирію. Як же я помилявся.\n\nПрикордонники не виявили миттєвої ворожости, проте довго й пильно розглядали Зою та інших росіян і, здавалося, розслабилися та виявили справжню цікавість лише тоді, коли зрозуміли, що я американець. Чогось такого я вже наполовину очікую. Коли ми вирушили густими лісами регіону до Казані, таку цікавість виявляли майже всі зустрічні. Безперечно, цьому сприяв мій прапор, який тепер прикріплено до вихлопної труби й який гордо майорить на вітрі, куди б ми не їхали.\n\nМи сподівалися прибути до міста дуже пізно й разом непокоїлися, чи знайдемо нічліг, але це не стало проблемою. Коли місто з'явилося в полі зору, нас зустріло водночас захопливе й моторошне видовище. Німецькі бомбардувальники почали наліт, і мережа протиповітряної оборони Казані, яка, за словами Зої, була однією з найщільніших у Росії й майже цілком дісталася татарам після захоплення міста, ожила.\n\nЯ не здатен належно описати звуки й барви, які оточували нас якийсь час. Хіба що як громовий калейдоскоп: у небо до крихітних цілей високо над землею здіймалися гримотливі червоні, відлунні жовті й метеорні зелені спалахи.\n\nКоли наліт завершився, уже стемніло, тож ми вирішили знайти місце для табору, а не ризикувати й заходити глупої ночі до міста, піднятого по тривозі. Вранці ми оглянемо його й рушимо до наступного пункту, на південь у бік Самари. Та я однаково не думаю, що скоро забуду пережите.\n\nБа більше, гадаю, я бачитиму це уві сні."
 RUS_tourist.72.a: "Громовий калейдоскоп."

 RUS_tourist.73.t: "У землі зради"
 RUS_tourist.73.d: "Того ранку прикордонники Комітету дивилися на вантажівку, що наближалася, і не знали, що про неї думати. Вантажівка з Вятки, з американським прапором на вихлопній трубі, наближається з Татарстану? Справжнє безглуздя.\n\nВони ще більше спантеличилися, коли вікно опустилося й серед росіян усередині з'явився американець. А їхнє збентеження сягнуло вершини, коли на допиті він сказав, що подорожує країною. Вивчивши його вантаж і документи зі штампами таких віддалених місць, як Чіта, Красноярск і Свєрдловск, вони не могли йому не повірити. А щойно було сплачено випрошеного хабаря, шлях швидко відкрився.\n\nОднак неприємний досвід на кордоні став провісником майже всіх подальших зустрічей. Солдати дивилися на них із підозрою й часто ледве стримуваною жадібністю. Люди уникали їх, давно навчившись, що зв'язуватися з незвичайним - означає накликати лихо. Супутниця американця, яка сама колись воювала проти німців, кипіла ледве стримуваною люттю, коли солдати їх не бачили.\n\n«Власовці» були зрадниками, тваринами, не кращими за псів, казала вона. Тут не було чого відкривати, лише ворожість і похмурі картини. Хоч зазвичай вона дозволяла американцеві визначати їхній шлях, тут дала пораду: звернути й залишити цю прокляту «країну» далеко позаду.\n\nАмериканець замислився. Він уже давно навчився довіряти поглядам та інстинктам своєї супутниці, але ж уся причина його приїзду до Росії полягала в тому, щоб спостерігати за державами й суспільствами, з яких вона складалася.\n\nЧи звернув він зі шляху? Або сказав їй, що вони продовжують подорож?"
 RUS_tourist.73.a: "Вони йдуть далі, до Ставрополя-на-Волґє."
 RUS_tourist.73.b: "Вони оминають цю похмуру землю."

 RUS_tourist.74.t: "Запис 28: Землі РОА"
 RUS_tourist.74.d: "Зоя попереджала мене, що землі «власовців» напевно будуть похмурим і ворожим місцем, і мені прикро визнавати, що вона мала рацію.\n\nАтмосфера стала зрозумілою одразу після перетину кордону на південь від Казані. Всі солдати, дехто зі спорядженням німецького походження, були похмурими й неприємними, а багато хто з наших зустрічних майже відкрито вимагав хабаря за прохід. Ми не хотіли, щоб вони пильніше придивлялися до нас, особливо до Зої, тож погоджувалися.\n\nЗемлі й люди, яких ми бачили дорогою на південь, нагадували саме небо: сірі, похмурі й занепалі, наче з них висмоктали життя. Ставрополь-на-Волґє, перше велике місто після Сімбірска, був, хоч у це й важко повірити, ще гіршим.\n\nЯ думав, що Іжевск охопила якась невидима млявість, але Ставрополь здавався містом, яке навіки приготувалося до страждань. Люди дивилися на нас зі страхом, а хабарі вимагали дедалі частіше. Ресурсів бракувало, майже все привласнювали військові, а ще мені розповіли, що родини ховають синів від призову. Насправді це було настільки гнітюче, що навіть тепер я пам'ятаю лише сіре. Сірі небеса, сірі дороги, сірі будівлі й сіру їжу.\n\nЗоя та інші поділяли мої враження, тож після короткої розмови ми вирішили скоротити перебування в цій жахливій землі. На наступному перехресті повернемо на північний захід, до Ґорького, території колишньої совєцької танкової бригади, яка нібито почала здійснювати набіги на німецькі володіння на заході заради припасів.\n\nЗізнаюся, після пережитого у Воровской тєріторії ця перспектива трохи мене лякає, але заспокоює певність у тому, що ті землі принаймні мають бути кращими за ці."
 RUS_tourist.74.a: "Якщо це визволення, я не хочу мати з ним нічого спільного."

 RUS_tourist.75.t: "Запис 28: Землі РОА"
 RUS_tourist.75.d: "Зоя попереджала мене, що землі «власовців» напевно будуть похмурим і ворожим місцем, і мені прикро визнавати, що вона мала рацію.\n\nАтмосфера стала зрозумілою одразу після перетину кордону на південь від Казані. Всі солдати, дехто зі спорядженням німецького походження, були похмурими й неприємними, а багато хто з наших зустрічних майже відкрито вимагав хабаря за прохід. Ми не хотіли, щоб вони пильніше придивлялися до нас, особливо до Зої, тож погоджувалися.\n\nПісля третього такого блокпоста я ухвалив рішення. Зоя мала рацію. Ця земля була похмурою й ворожою, і я згадав обіцянку, яку дав далеко на півночі, поблизу Воркути. Подальший шлях лише наражав усіх нас на небезпеку заради майже напевно мізерної винагороди. І цього я більше не дозволю.\n\nНатомість ми повертаємо просто на захід, до Ґорького, території колишньої совєцької танкової бригади, яка нібито почала здійснювати набіги на німецькі володіння на заході заради припасів. Зізнаюся, після пережитого у Воровской тєріторії ця перспектива трохи мене лякає, але заспокоює певність у тому, що ті землі принаймні мають бути кращими за ці.\n\nЩоб іще краще уникати небажаної уваги, ми йдемо сільською місцевістю та тримаємося подалі від головних доріг. Підозрюю, що Зоя користується проходами й короткими шляхами, знайомими їй із давніх часів, але я вже навчився не питати.\n\nЯк захоче розповісти, то розповість. А поки я залишаю нас у її надійних руках."
 RUS_tourist.75.a: "Яке ж безпросвітно гнітюче місце."

 RUS_tourist.76.t: "Несанкціоноване проникнення"
 RUS_tourist.76.d: "Один із наших легкопанцерних загонів на південь від Кстова повідомив про несанкціонований перетин кордону між Бригадою та Комітетом самотньою вантажівкою, очевидно вятського походження.\n\nЗрадники із Самари й раніше намагалися проникнути на нашу територію, але ніколи в такий спосіб. До того ж командир підрозділу доповів, що на вантажівці добре видно американський прапор. Перш ніж кидати сили Бригади в бій, він запросив указівок від командування. Центральний штаб не знає, як діяти.\n\nПовномасштабна контратака в очікуванні, що вантажівка є розвідником перед набігом Комітету, витратить значні обсяги пального. Ймовірно, для поповнення запасів знадобиться додатковий набіг на володіння Райху на заході. Проте невелика група, вислана на зустріч із вантажівкою, може потрапити в засідку або полон. У такому разі вирішальне значення матиме призначений командир, адже йому доведеться діяти негайно, покладаючись на наявні відомості й власну вдачу.\n\nХай там як, ми мусимо відповісти, і то швидко. Який наказ віддати?"
 RUS_tourist.76.a: "Вислати невелику групу з агресивним командиром."
 RUS_tourist.76.b: "Вислати невелику групу з дипломатичнішим командиром."

 RUS_tourist.77.t: "Запис 27: Ґорьківська танкова бригада"
 RUS_tourist.77.d: "Дослухавшись до поради Зої, яку за час нашої довгої спільної подорожі я навчився безмежно поважати й якій довіряю, наша група повернула від Ставрополя-на-Волґє на північний захід і рушила до території так званої Ґорьківської танкової бригади.\n\nХоч, як я писав раніше, їхня слава налітників мене непокоїла, ми пояснили все невеликій групі танків і панцерників, яка перехопила нас після перетину кордону, й отримали дозвіл їхати до самого Ґорького. І яке ж це було видовище.\n\nЯ вважав Іжвєск величним прикладом промислової діяльности в Західній Росії, але Ґорькій затьмарює його величезними фабриками, які випускають танк за танком, панцерник за панцерником. І на відміну від інших танків, побачених у наших мандрах, Бригада прикрашає їх не самою емблемою.\n\nНа міській площі ми побачили, як строєм проходить танкова рота, кожен танк якої був переливчасто розмальований під певну пантеру. Підрозділ, що не дивно, називався ротою «Пантера». Мені більше сподобався «зразок» із левом, а Зої - зі сніговим барсом, напевно, через давню подорож південним Сибіром.\n\nПісля короткої зупинки, під час якої я бачив, як кілька членів Бригади жадібно дивилися на нашу вантажівку, ми вирішили знову рушати далі. Цього разу на північ через Волґу, до території Волоґди. Усі кажуть, що вона «нейтральна», і мені дуже цікаво дізнатися, що насправді означає це слово в російському хаосі."
 RUS_tourist.77.a: "Може, мені навчитися малювати?"

 RUS_tourist.78.t: "«Американець»"
 RUS_tourist.78.d: "Наш легкопанцерний підрозділ на південь від Кстрова повідомив про подальший розвиток подій навколо самотньої вантажівки, яка, за попередніми даними, ввійшла на територію Бригади з боку Комітету.\n\nНевеликий загін отримав наказ перехопити її, але коли це сталося, люди у вантажівці не захотіли негайно покинути її на вимогу. Командир підрозділу, який нещодавно повернувся з набігу на захід, нібито був настільки приголомшений цим ваганням, що негайно наказав силоміць витягти людей і розстріляти на місці.\n\nНаказ було виконано попри спробу опору, а тіла невдовзі спалено.\n\nКрім того, помітивши особливість конструкції вятської вантажівки, командир наказав доправити її до місцевої майстерні, де машину обшили панцерними плитами, встановили кілька легких гармат зі списаних панцерників і значно ширші шини. Потім він особисто повів її назад до Ґорького, не знявши американського прапора з вихлопної труби.\n\nПопри грубість конструкції цінність машини стала очевидною відразу. Вона була досить панцерована, щоб витримувати вогонь легкої зброї німецьких поселенців, але мала досить потужне озброєння, щоб їх здолати, а також значно економніше витрачала пальне, перевозила більше вантажу й краще долала бездоріжжя. Очікується, що вона добре покаже себе в набігах на німецьку територію.\n\nОсоби людей усередині не встановили, але прапор на вантажівці призвів до того, що саму машину в побуті почали називати «американцем».\n\nВикликаний цим попит змусив переобладнати виробничу лінію в Ґорькому, щоб у майбутньому перетворювати цивільні вантажівки на «американців» для потреб Бригади."
 RUS_tourist.78.a: "Дякуємо за ідею, хай ким ви були."

 RUS_tourist.79.t: "Нейтральна дивина"
 RUS_tourist.79.d: "Коли вантажівка вперше з'явилася на мосту через Волґу, волоґодські прикордонники не знали, що про неї думати. Вятська машина з американським прапором, що гордо майорить, та справжнім американцем усередині попросила дозволу ввійти до Нейтральної держави через пункт пропуску, де майже ніколи не бачили ні першого, ні другого. А тим паче обох разом.\n\nНе маючи причин відмовляти, прикордонники зрештою дозволили проїхати, звісно, після тривалого допиту. Коли вантажівка перетнула річку й повернула на головну дорогу до самої Волоґди, її пасажири неабияк спантеличилися.\n\nВони побували в багатьох місцях, де люди боялися чужинців і ховалися від них, доки не переконувалися в безпеці. Але тут усе було зовсім інакше. Тут люди визирали, роздивлялися вантажівку й махали їй услід, цікавлячись як прапором, так і людьми, що їхали під ним. І в один із тих надзвичайно рідкісних моментів, коли це досі здавалося доречним, пасажири помахали у відповідь.\n\nЩо ближче вони під'їжджали до міста й що густішою ставала забудова, то більше уваги їм приділяли й то сильніше вона виявлялася, на величезну радість одного з пасажирів. Коли вантажівка досягла Волоґди, вся група була сповнена сил і готова досліджувати державу, яка так тепло їх прийняла.\n\nТаке в Росії було справжньою рідкістю, і пасажири збиралися використати нагоду сповна."
 RUS_tourist.79.a: "Нейтралітет має свої переваги."

 RUS_tourist.80.t: "Запис 30: Нейтральна держава Волоґда"
 RUS_tourist.80.d: "Тепер, коли ми прибули до самого міста, я можу впевнено сказати, що Волоґда - надзвичайно спокійне місце.\n\nЛюди прагнуть стабільности як усередині країни, так і за її межами, а солдати й поліціянти, на відміну від багатьох інших місць і відповідно до написаного мною раніше, схоже, захищають людей і запобігають насильству. Так і має бути за природним порядком речей, але, як я з прикрістю пізнав на власному досвіді, для Росії це справжня дивина. Місто й справді варте заздрости.\n\nПроте це не Омск. Люди тут безперечно мирні й віддані своїм ідеалам озброєного нейтралітету, але їм бракує рушійної сили, пристрасті й цілковитої відданости тому миру, який я бачив у великому місті. Пам'ятаю, як мене вразила їхня несамовита жага миру, прагнення його остаточної перемоги й абсолютна певність багатьох людей, особливо урядовців, що вони її здобудуть. Вони знали, що попереду будуть труднощі, або «Випробування», як вони, схоже, почали їх називати, але не боялися, а дехто навіть чекав їх із нетерпінням.\n\nНі, Волоґда - не Омск, але, здається, ближчого місця я ще не знаходив, і цього має вистачити. Хай там як, треба йти далі. Зоя веде нас на північний схід, до, вочевидь, розколотої демократичної республіки, а я обережно сподіваюся, що вона виявить деякі засадничо корисні й стабілізаційні риси, які ми бачили в гнітюче нечисленних демократіях на своєму шляху.\n\nА якщо ні, принаймні спостерігати за нею точно буде цікаво."
 RUS_tourist.80.a: "Омск Заходу?"

 RUS_tourist.81.t: "Від однієї демократії до іншої"
 RUS_tourist.81.d: "Кордон із Волоґдою завжди був тихим і спокійним місцем, що для Західної Росії велика рідкість. Для багатьох солдатів це було ідеальне призначення: жодних набігів, мало контрабандистів, можна спокійно сидіти й не боятися щомиті дістати кулю. Принаймні тут було значно краще, ніж у Сиктивкарі. Але вряди-годи з Нейтральної держави все ж прибували всілякі дивовижі.\n\nОдна така дивовижа з'явилася того ранку у Вєлікім Устюзі, коли до місцевого пропускного пункту під'їхала вантажівка з американським прапором. Під час допиту з'ясувалося, що водій і сам американець, який здолав довгий шлях зі сходу аж сюди, до Комі, мандруючи Росією.\n\nСпантеличені вартові одразу почали сперечатися, що з ним робити. Невдовзі проявилися їхні політичні упередження: лунали звинувачення, що він агент ЦРУ, найманий шпигун із Московієна чи навіть диверсант Революційного фронту, хоч би як безглуздо це звучало. Іноземне обличчя тут побачиш нечасто, а через небувале загострення політичних розбіжностей у республіці підозри теж сягнули вершини. Утім, остаточне рішення належало командирові.\n\nПісля коротких роздумів вартовим наказали пропустити вантажівку. Вони неохоче провели американця з почтом через пропускний пункт до найнестабільнішої демократії Росії. Група рушила до Сиктивкара, де після прибуття мала відвідати..."
 RUS_tourist.81.a: "...саме серце міста."
 RUS_tourist.81.b: "...Куратовський район."
 RUS_tourist.81.c: "...вулицю Інтєрнаціональную."
 
 RUS_tourist.82.t: "Запис 31: Асамблея"
 RUS_tourist.82.d: "Схоже, я прибув до Сиктивкара, та й до Комі загалом, у вельми цікавий час. Щойно ввійшовши до міста, я почув, що пізніше того дня відбудеться засідання «Національної асамблеї», урядового органу, чимось подібного до Конґресу. Звісно, такого я просто не міг пропустити.\n\nЯкщо коротко, там панував хаос. Але не анархічний безлад, як на засіданні ради в Орєнбурзі: тут у дивний спосіб усе ж був якийсь порядок. Щойно президент закінчив вступну промову, кожен почав вигукувати власну програму, а програм, Господи, було чимало. Скажу відверто: Комі, мабуть, найбільш політично різноманітна країна, яку я бачив у житті. Депутати всіх мастей і переконань сперечалися годинами. Комуністи, монархісти, соціялісти, консерватори, ліберали та безліч інших намагалися протягнути власну програму крізь силу-силенну законопроєктів, пропозицій і поправок.\n\nУ дивний спосіб це було... захопливо? Ніколи не думав, що так перейматимуся сваркою купки старих чоловіків і жінок про податкові ставки, але так і сталося. Наче у фільмі, ще й з найколоритнішим складом акторів, який я будь-коли бачив: пані Сталіна непохитно протистояла екстремістам; панове Ґумільов і Жданов були гучні й веселі; пан Таборіцкій надто вже нагадував мені моторошного дядька Елмера; а ще там були президент і віцепрезидент. Обидва мали геть нещасний вигляд.\n\nІнша примітна постать перебувала не в залі асамблеї, а сиділа в галереї просто поруч зі мною. Навіть у найгарячіші миті дебатів цей чоловік не глузував, не кричав і взагалі, якщо чесно, майже не виявляв емоцій. Наприкінці засідання він простягнув руку, і ми обмінялися іменами. Здається, якийсь Суслов. Приємний чолов'яга, хоч і вельми дивний.\n\nКомі виявилася чудернацьким, але захопливим місцем. У певному сенсі я хотів би лишитися тут трохи довше. Та моя подорож триває на північ."
 RUS_tourist.82.a: "Дім там, де серце."

 RUS_tourist.83.t: "Запис 31: Сиктивкар і Куратовський район"
 RUS_tourist.83.d: "Комі найкраще описати як «місце для всіх». Навіть для злочинців, схоже.\n\nКуратовський район Сиктивкара - це, по суті, суцільний рекет. Чимало місцевих звертаються до радикального лівицтва через, як вони кажуть, «невдачі уряду Воронєцкого». Регулярні бомбардування Люфтваффе нищать моральний дух, інфраструктуру та засоби до існування, і людям Комі часом здається, що радикалізм розв'яже їхні проблеми. А серед цих проблем - зависокий рівень злочинности. Щойно ми із Зоєю ввійшли до району, група дітей ледь не обчистила наші кишені. Їх насилу прогнала коротка перестрілка між фашистськими партизанами й комуністами. Зоя затягнула мене до провулка, де ми кілька хвилин чекали, поки все вщухне. Звісно, як акули на кров, відчайдушні пройдисвіти злітаються «допомагати» зневіреним.\n\nКоли я намагався поговорити зі звичайними мешканцями Сиктивкара, до житлового будинку ввійшла соціялістична воєнізована група. Побачивши чужинців, вони, звісно ж, радо почали до нас чіплятися.\n\n«Гей, погляньте на цього бідолашного янкі! - гукнув хтось із них. - Бачу, в Куратовському районі тобі добряче дісталося, товаришу. Чому б не заплатити нам за захист?»\n\nМи із Зоєю дуже занепокоїлися, але проти озброєних партизанів, які шукали легкої наживи, шансів не мали. Відмовитися словами не вдалося, тож нас фактично змусили заплатити, а тоді «супроводжували» районом. Розпитувати несоціялістів було складно, коли за спиною тримають рушниці й ножі, заохочуючи розмовляти з більш... прихильними громадянами. Та наприкінці дня вони нас покинули, і ми швидко втекли з району."
 RUS_tourist.83.a: "Мабуть, тут так заведено."

 RUS_tourist.84.t: "Запис 31: Радіо «Вільний Сиктивкар»"
 RUS_tourist.84.d: "Комі найкраще описати як «місце для всіх», але я по-справжньому зрозумів це, лише зустрівши одну людину на вулиці Інтєрнаціональной. Шукаючи місце для ночівлі, я натрапив на ведучого Радіо «Вільний Сиктивкар», якого звали Іван Івановіч Іванов. Під час нашої подорожі Західною Росією ми із Зоєю вже чули і його голос, і інші передачі РВС. Іван був низьким, кремезним, але жвавим чоловіком середнього віку. Ми випадково зіткнулися, коли він ходив по горілку, а я впіймав пляшку, яку він упустив. Цього вже вистачило, щоб розпочати розмову, а коли я трохи розповів про свою історію та мету, Іван захоплено запросив мене наступного вечора виступити разом із ним у прямому етері. Ми із Зоєю люб'язно погодилися.\n\nСтудія була маленькою й виразно застарілою, але жвавість Івана та взаєморозуміння між нами в етері назавжди закарбувалися в моїй пам'яті. Почали ми досить просто: коротке знайомство, потім моя передісторія і, нарешті, розповідь про те, як я потрапив до Росії. Зоя вирішила не виступати, але сиділа з нами в кімнаті й перекладала. Ми годинами читали та обговорювали записи зі щоденника, а завершили передачу вже на світанку. Іван побажав нам удачі, а я пообіцяв написати йому, коли повернуся додому. Він люб'язно залишив мені уривок із передачі, який я тут перепишу.\n\n«Отже, Стів Сміт. Леґендарний американець з-за океану... Ви хочете щось сказати Комі? Росії?»\n\n«Що ж, Іване, правду кажучи, ніщо не розповість моєї історії краще за серце. Кожне слово в цьому щоденнику йде просто з нього, а історії чудових людей Росії ніколи не буде забуто. Союзу вже немає, але Росія далеко не втрачена, а дух її народу неможливо стерти. Обіцяю, що його історії житимуть у цій книжці. Особливо ця»."
 RUS_tourist.84.a: "«Досі не думав, що з мене вийде співведучий, Іване!»"

 RUS_tourist.85.t: "Самотня машина"
 RUS_tourist.85.d: "З огляду на колишню ворожнечу між Західноросійським революційним фронтом і Республікою Комі їхній кордон був доволі мілітаризованим. Бійці Червоної армії патрулювали його вздовж, не допускаючи набігів і підтримуючи стабільне становище між двома державами.\n\nТому поява самотньої цивільної машини, яка їхала Котлаським мостом і явно збиралася перетнути кордон, дещо приголомшила червоноармійців.\n\n«Пост КБ, говорить командир Дєжньов. Доповідаю: до кордону наближається одна цивільна вантажівка, зараз вона перетинає Котласький міст. Усередині кілька осіб, прийом», - доповів командир підрозділу, поки решта бійців займала оборонні позиції на випадок загострення.\n\nПерш ніж Дєжньов отримав відповідь, один із солдатів запитав: «Командире, вам це схоже на прапор Комі?» Зацікавлений Дєжньов узяв бінокль і придивився. Прапор на вантажівці точно не належав Республіці Комі. На ньому були червоні й білі смуги... безліч зірок... Не може бути, але Дєжньов не мав сумнівів. Такий прапор мала лише одна країна. Він хутко схопив рацію й заговорив.\n\n«Говорить Дєжньов. Доповнюю інформацію про ситуацію на Котлаському мосту. Машина їде під американським прапором, прийом»."
 RUS_tourist.85.a: "Негайно повідомити Архангєльск."
 RUS_tourist.85.b: "Затримати їх і викликати підкріплення."

 RUS_tourist.86.t: "Запис 32: Західноросійський революційний фронт"
 RUS_tourist.86.d: "Сьогодні ми прибули до Архангєльска, осередку Західноросійського революційного фронту. Ці рештки Червоної армії Совєцького Союзу колись контролювали всю Західну Росію, але розпалися після Західноросійської війни. Попри холод, Архангєльск здається цілком пристойним містом. Усюди світломаскувальні штори, військова комендантська година й підземні сховища, зате солдати привітні, а уряд, схоже, стабільний. Після всього, що я бачив і пережив деінде в Росії, це дуже непогано. Уряд приставив до нас кількох солдатів, аби ми не вскочили в халепу, але навіть це не заважало супровідникам час від часу долучатися до наших розваг.\n\nМи з почтом ходили випивати з червоноармійцями. Було весело, а Зоя, здається, особливо насолоджувалася нашим перебуванням в Архангєльску. Солдати розповідали нам цікаві історії, хоча чимало жартів загубилося в перекладі. Часом кімната сильно здригалася, але наприкінці вечора я вже не розумів, що було причиною: алкоголь чи протиповітряна оборона.\n\nЗахідноросійський революційний фронт став гарним завершенням моєї подорожі Росією, хоча попереду ще одна зупинка. Я пишу цей запис дорогою до кордону з Антикомуністичною гвардією в Онєзі. До вечора я буду в Гельсінкі."
 RUS_tourist.86.a: "А тоді - вперед, до Америки."

 RUS_tourist.87.t: "Запис 32: Західноросійський революційний фронт"
 RUS_tourist.87.d: "Сьогодні я прибув до кордону із Західноросійським революційним фронтом. Ця вкрай мілітаризована сила складається із залишків совєцької Червоної армії, яка до Західноросійської війни контролювала всю Західну Росію. Якщо я не хочу переконувати німців пропустити мене, це єдиний шлях до Фінляндії. На жаль, моя дедалі більша слава в Росії, схоже, допомагає не так сильно, як я сподівався.\n\nНа кордоні кілька червоноармійців зупинили нашу машину й націоналізували її від імені маршала Тухачєвского. А я ж тільки почав до неї звикати. Принаймні їхнє начальство виявило достатньо люб'язности й дало нам якусь компенсацію: кількох коней, щоб везти майно решту шляху, хоча до Онєґи їх узяти не дозволять. Великий маршал явно не хоче, щоб ми блукали без нагляду, тому до нас приставили невелику колону, яка супроводить нас до Архангєльска. Там ми переночуємо й одразу покинемо територію Фронту. Я б поскаржився на кепську гостинність, але принаймні нас іще не намагалися застрелити.\n\nХай що я думаю про втрату вантажівки, великий маршал ґарантував нам безпечний перехід через онезький кордон, і кінець подорожі вже видніється. Я не дозволю невдалому фіналові зіпсувати мою пригоду."
 RUS_tourist.87.a: "А тоді - вперед, до Америки."

 RUS_tourist.88.t: "Перетин кордону"
 RUS_tourist.88.d: "Рано-вранці колона Західноросійського революційного фронту прибула до щільно укомплектованого пункту на онезькому кордоні. Повідомлення від великого маршала ґарантувало, що зустріч відбудеться, хоча її причина дещо розчарувала командування Антикомуністичної гвардії.\n\nНайстарший присутній офіцер віддав наказ, і американський турист Стівен Сміт зі своїм почтом без зброї наблизився до онезьких військ. Їх обшукали, перевірили речі й, задоволені результатом, дозволили перетнути кордон. Американця, його супутників і все їхнє майно посадили у велику бронемашину, яка поїхала геть.\n\nПісля від'їзду нового транспорту американця кілька секунд у повітрі висіла тривожна тиша. Її порушила більшість військ Фронту, що почала відходити до Архангєльска. За кілька хвилин кордон став таким, як завжди: дві сторони сиділи на укріплених позиціях, готові щомиті відбити раптовий напад."
 RUS_tourist.88.a: "Деякі речі ніколи не змінюються."

 RUS_tourist.89.t: "Запис 33: Останні дні в Онєзі"
 RUS_tourist.89.d: "Я по-справжньому усвідомив це, лише коли ми перетнули кордон території Добровольчої гвардії та ввійшли до Онєґи. Я справді це зробив. Ми справді це зробили.\n\nМи перетнули всю Росію, побували в землях і дивовижних, і страхітливих, зустрічали людей і співчутливих, і жорстоких. Я побачив речі, про існування яких навіть не здогадувався, і дізнався про себе більше, ніж колись вважав можливим.\n\nЩе більше вражає безліч речей, які ми назбирали. Коли я прибув, у мене майже нічого не було, крім одягу, щоденника, невеликої суми грошей і прапора. А тепер? Тепер ми маємо монети й сувеніри з десятків державок. Маємо одяг з Ойротії. Набої зі Златоуста. Царський чайний сервіз із Вятки. І ще багато чого.\n\nЦе й справді була подорож усього життя, і навіть я не знаю, як нам удалося її здійснити. Озираючись назад, я бачу стільки митей, коли все могло закінчитися жахливо. З комуністами в Іркутску й Тюмєні. Під час нашої страхітливої мандрівки Воровской тєріторією до кордону Воркути. Під час походу до таборів біля Ґорького чи землями того моторошного «Братства» в Пєрмі. Але разом ми подолали всі випробування, і я ніколи цього не забуду.\n\nЗавтра ми рушимо до фінського кордону, де я нарешті покину Росію й почну довгу дорогу додому. Знаю, я мав би радіти, але боюся миті, коли доведеться їх залишити. Їхня дружба стала для мене дорожчою майже за будь-яку річ, і хоч я знаю, що вона назавжди лишиться зі мною, це слабка втіха, коли між нами лежатиме цілий світ.\n\nОсобливо важко буде залишити Зою, яка стільки зробила, щоб урятувати нас, урятувати мене. Я досі не знаю, як почуватимуся, коли нам доведеться розлучитися.\n\nАле сьогодні ми святкуватимемо. Я їм це винен."
 RUS_tourist.89.a: "Остання спільна ніч."

 RUS_tourist.90.t: "Довге прощання"
 RUS_tourist.90.d: "За довгу подорож група перетнула дуже, дуже багато кордонів, але цей був іншим. Цей був останнім. І його належало перейти наодинці.\n\nКоли вони наближалися до пропускного пункту, над яким високо майорів фінський прапор, а солдати пильно стежили за кожною ознакою небезпеки, чоловік обернувся до своїх супутників, не стримуючи сліз. Разом вони пройшли, мабуть, найнебезпечнішою й найбільш охопленою конфліктами землею на планеті. Піднялися в гори на краю світу. А тепер розлучалися.\n\nВін по черзі обійняв кожного та роздав більшу частину грошей і цінностей, зібраних у дорозі. Дякуючи то обіймами, то рукостисканням, він висловив удячність за їхню відданість, довіру й допомогу в усьому, навіть коли, можливо, не заслуговував на них.\n\nЗакінчивши, він став перед жінкою. Жінкою, яка йшла за ним, вела його, а подеколи й рятувала від Сибіру до самого місця, де вони тепер стояли. Жінкою, яка не перетне кордону. Він утратив дар мови й не міг знайти слів, здатних по-справжньому висловити його почуття.\n\nВона теж усе розуміла. Між ними постала дружба на все життя, яка могла народитися лише у спільних випробуваннях і якої більшості людей ніколи не пізнати. Хай де вони будуть, це не зміниться. Вона сама ступила вперед і міцно обійняла чоловіка, приховуючи власні тихі сльози. Подяки були не потрібні. Її вже давно висловлено.\n\nЗа довгу мить чоловік відступив, відвернувшись від усіх, бо знав, що інакше не зможе зробити потрібних кроків. Потім дуже повільно підняв решту сумок і, переставляючи ногу за ногою, дістався пропускного пункту.\n\nВін пішов далі. І хоча не бачив цього, друзі, разом із жінкою, дивилися йому вслід, доки він не зник за обрієм."
 RUS_tourist.90.a: "Кожна велика подорож мусить скінчитися."

 RUS_tourist.91.t: "Дивовижна історія"
 RUS_tourist.91.d: "Сьогодні наш уряд повідомили про надзвичайно незвичайну подію.\n\nЗа словами наших військ у Карелії, самотній американець увійшов до Республіки з території Добровольчої гвардії в Онєзі, заявивши, що перетнув майже всю Росію від Пєтропавловска до Архангєльска. Він також стверджує, що побував майже в усіх наявних державах воєначальників і записав свої спостереження та враження в розлогому подорожньому щоденнику.\n\nПрикордонні урядовці не повірили цим заявам і, як завжди, остерігалися можливих комуністичних диверсантів, але, за повідомленнями, були приголомшені після перевірки його паспорта й різноманітних подорожніх документів із держав по всій Росії, які, схоже, підтверджують історію. Якщо вона правдива, це безперечно неабияке досягнення.\n\nАле це досягнення нас не стосується.\n\nНас стосується присутність особи, яка, за власними діями та зізнанням, перетнула території багатьох комуністичних держав, зокрема нещодавно Західноросійського революційного фронту. Отже, цей чоловік становить загрозу безпеці, якої слід позбутися. Негайно.\n\nЙого доправлять під охороною до Гельсінкі й відповідно до попередньої угоди депортують через Ісландію назад до Америки. Так ми усунемо загрозу й водночас збережемо дипломатичні відносини з Америкою та ОВН.\n\nЦей чоловік і справді має захопливу й дивовижну історію, яку неодмінно розповість. Просто не у Фінляндії."
 RUS_tourist.91.a: "Відправити його додому."
 
 RUS_tourist.92.t: "Рейс Finnair 192"
 RUS_tourist.92.d: "Йон Ерлінґссон, багаторічний працівник міжнародного летовища Рейк'явіка, не думав, що колись зробить щось незвичайне чи зустріне когось видатного. Сьогодні він помилився, до того ж із геть несподіваної причини.\n\nНезадовго до полудня в міжнародному летовищі Рейк'явіка приземлився літак фінської авіакомпанії. Зазвичай у посадці східного рейсу на дозаправлення не було нічого дивного, але цього разу рейсом Finnair 192 летіла знаменитість. Стів Сміт був лише звичайним студентом із Середнього Заходу Сполучених Штатів, але нещодавно йому вистачило божевілля перетнути всю російську анархію та вижити, щоб про це розповісти. Кілька днів тому фінські прикордонники затримали його за незаконний перехід із Онєґи на територію Фінляндії, а тепер депортували назад до США. Природно, історія Стіва викликала певний ажіотаж у країнах, пов'язаних зі Сполученими Штатами.\n\nСьогодні Йона призначили розвантажувати багаж, і просто до нього стрічкою конвеєра під'їхала напрочуд незвичайна валіза. Сама валіза явно була старою, мабуть, іще з часів Совєцького Союзу, але мала неповторний американський дух. Попри подряпини й іржу, зсередини та зовні її прикрашали наліпки, сувеніри й фотографії. Йон тримав у руках частинку історії.\n\n«Перепрошую, пане, здається, ви взяли мою валізу». Йон зустрівся поглядом зі Стівом і в паніці простягнув руку. Стів усміхнувся, потис її та кивнув.\n\nЙон не надто добре знав англійську, але розумів, що мусить спробувати. «Якщо ви не проти, можна з вами сфотографуватися? Для моїх дітей. Вони обожнюють пригодницькі історії».\n\n«Я можу зробити навіть більше. Коли повернуся до Штатів і опублікую книжку, зателефонуйте їм. Я попрошу безкоштовно надіслати примірник вашій родині».\n\n«Ґуннаре! Неси сюди фотоапарат, у нас тут знаменитість!»"
 RUS_tourist.92.a: "Оце вже справжня пригода."

 RUS_tourist.93.t: "Повернення додому"
 RUS_tourist.93.d: "Стів прокинувся від удару переднього колеса літака об землю й різко подався вперед, упершись у пасок безпеки. Марно намагаючись прогнати сон із затуманених очей, він визирнув у вікно, поки літак поволі спинявся. У холодному сонячному світлі над обрієм Міннеаполіса працівники летовища безгучно займалися своїми справами.\n\nСтів досі був напівсонний, коли на нерозбірливу команду капітана відстебнув пасок і, хитаючись, підвівся. Нахилившись, він дістав сумку й разом з іншими схвильованими, але виснаженими пасажирами нічного рейсу вийшов із літака. Цікаво, звідки вони поверталися? Гостювали в друзів чи рідних? Відпочивали в знайомому, але далекому місці? Стів усміхнувся, нагадавши собі, що побував там, де бували одиниці з таким походженням, як у нього. У Росії.\n\nНарешті, після нескінченного човгання разом з іншими мандрівниками, його черевики ступили на американську землю. Точніше, на американський килим у короткому телетрапі, що відділяв його від дому, від родини. Попри всю відвагу й мужність, які провели його крізь охоплену війною Росію, туга за домом, яку він так довго стримував, нарешті прорвала всі греблі гірко-солодкими сльозами біля виходу.\n\nУвійшовши до летовища, Стів одразу помітив родину, що чекала з усмішками на обличчях і силою-силенною запитань. Не промовивши ні слова, він обійняв кожного родича, який прийшов його зустріти. Мати заплакала від радости, що син повернувся цілим, хоча це не мало її дивувати, адже він телефонував з Ісландії. Батько обійняв його, поплескав по спині й щиро прошепотів, як пишається сином. Прийшли навіть кілька двоюрідних братів і сестер, дядько та юрба незнайомців. Їх, мабуть, привабили історії про його пригоди. Стів утомлено запевнив, що невдовзі відповість на всі запитання, дійшов до батькової вантажівки, впав на заднє сидіння й заснув іще до того, як машина завелася."
 RUS_tourist.93.a: "У гостях добре, а вдома найкраще."

 RUS_tourist.94.t: "Тихе усвідомлення"
 RUS_tourist.94.d: "Після багатьох місяців суворого життя в наметах, часто серед непроглядної темряви дикої природи під зоряним небом Росії, родинний дім здавався Стіву Сміту майже чужим.\n\nНебо було іншим. Повітря було іншим. Люди були іншими. А найдужче відрізнялося саме відчуття. У Росії, як він не раз пізнавав на власному гіркому досвіді, небезпека чатувала всюди, а будь-яка знайдена безпека неодмінно виявлялася минущою.\n\nВін раптом із подивом і гострою провиною усвідомив, що це несправедливо. Після повернення його зустрічали люди. Називали хоробрим дослідником. Газети написали про нього кілька коротких статей. У рідному місті він став кимось на кшталт знаменитости.\n\nА як же Зоя? Як же інші? Ті, хто на кожному кроці ризикував не менше за нього у своїй розбитій, охопленій війною країні? Де їхня історія, їхня слава? Ніде, знав Стів, і не міг із цим змиритися.\n\nПорившись у сумках, він дістав товсті списані щоденники, стоси зроблених фотографій і дрібнички, які залишив собі того дня біля фінського кордону. Потім приніс стару батькову друкарську машинку. Розклав усе на столі, сів і витягнув стос паперу.\n\nВін міг розповісти їхню історію. Описати подорож, яку вони здійснили разом. Стів не знав, скільки часу забере написання, редагування та видання книжки, але знав, що не спочине, доки не завершить її.\n\nВін був їм це винен."
 RUS_tourist.94.a: "Їхня історія заслуговує бути почутою."

 RUS_tourist.95.t: "[Get_newspaper_header]«Через тундру» стала бестселером!"
 RUS_tourist.95.d: "Видання подорожніх записок американця Стівена Сміта викликало значний інтерес як у країні, так і в усьому світі, а попит набагато перевищив пропозицію. Книжка Сміта «Через тундру» складається з відібраних щоденникових записів, оповідей і фотографій людей, подій та місць, які він зустрів під час довгої подорожі всією Росією від Далекого Сходу до Фінляндії.\n\nКілька оглядачів назвали її «захопливим вікном» у бурхливе політичне становище сучасної Росії. Публікація спричинила значний суспільний інтерес до гуманітарних умов і допомоги в багатьох менш успішних державах-наступницях Росії, а урядовці кількох країн закликали приділяти більше уваги наданню такої допомоги."
 RUS_tourist.95.a: "Час замовити примірник."

 RUS_tourist.96.t: "Вони не постаріють"
 RUS_tourist.96.d: "Марта Сміт рахувала дні відтоді, як її син вирушив до Росії, тієї дикої та неприборканої землі, що кишіла слинявими тиранами й кровожерливими бандитами. Від останнього листа минули місяці, а вона не чула від нього ані слова. Навіть коли величезну країну почали приборкувати пів десятка тиранів, що ще лишилися, а їхні держави налагоджували зв'язки із землею свободи, Марта так і не отримала жодної звістки про долю свого хлопчика. Тепер, ставлячи чергову риску в таємному щоденнику під ліжком, про який, як вона була певна, Ернест не знав, жінка схилила голову в долоні й беззвучно заридала без сліз. Вони просто скінчилися ще в перший місяць цього щоночі повторюваного ритуалу.\n\nМарта жадібно випила склянку води з нічного столика й засунула щоденник назад під ліжко. Ернест нібито затримувався на роботі, тому від його дзвінка о сьомій ранку й до повернення додому вона віддавалася горю. Її страждання йшло по колу, поки вона чекала певности, якої ніколи не дочекається.\n\nЕрнест не затримувався на роботі. Розгрібаючи сміття на панелі старої побитої вантажівки, він шукав листа, знайденого минулого разу, коли «працював допізна» й нишпорив старою поштою в пошуках бодай якоїсь звістки про сина з Росії. Після нескінченних ночей пошуків чогось, що могло б заспокоїти змучену дружину, він знайшов лише один уривок розгадки: повідомлення росіянина з міста Харбін до американського кузена про те, що той бачив американця, який проїжджав через місто. І все. Крім кількох отриманих листів, це була єдина паперова згадка, що лишилася від сина. Цей знаний своєю стриманістю та працьовитістю чоловік відкинув листа, коли на нього впали сльози, схилив голову на кермо й заплакав."
 RUS_tourist.96.a: "Для тих, хто його любив, ця подорож ніколи не закінчилася."
 
### News Events ###
 ### West Russia World Events ###
 RUS_news.1.t: "[Get_newspaper_header]Арійське Братство об'єднує Західну Росію!"
 RUS_news.1.desc: "Уперше від часів війни 1950-х років Західну Росію об'єднано під одним стягом. На жаль для країни й усього світу, цей стяг прикрашає свастика. Перші передачі та заяви з регіону розповідають про загадкове Арійське Братство - товариство росіян, які вірять, що арійство визначається не расою, а станом, якого може досягти слов'янська раса, ставши рівною своїм завойовникам.\n\nХай би яким божевільним і неймовірним це звучало, Братство під проводом Ґутрума Ваґнера тепер контролює Західну Росію. Воно оголосило про свій успіх і рівність із «Райхом». Світ приголомшено й розгублено мовчить, чекаючи на подальші події. Якими будуть наступні кроки цієї нової російської держави воєначальника і як могутній Райх відреагує на це абсурдне утворення?\n"
 RUS_news.1.a: "Сподіваймося, ці божевільні далеко не зайдуть."
 RUS_news.1.b: "Гайль Ваґнер!"

 RUS_news.2.t: "[Get_newspaper_header]Орден Святого Георгія об'єднує Західну Росію!"
 RUS_news.2.desc: "Дивовижним чином те, що колись було купкою бідних сіл на околицях Західної Росії, тепер контролює весь регіон. Великий магістр Міхаїл Антіпін, очільник держави воєначальника, що розрослася з містечка Ґайни, виступив із заявою про недавній успіх.\n\nВласне, за цією державою стоїть Орден Святого Георгія - релігійна установа, створена після розпаду ЗРРФ. Усупереч усім несприятливим обставинам Орден досяг величезних успіхів у своїй об'єднавчій кампанії. За документами й власною оповіддю групи, усе почалося з боротьби проти бандитів на північ від Пєрмі. Тепер люди, які в найтемнішу годину країни звернулися до релігії, дістали нагоду поширити свої переконання.\n"
 RUS_news.2.a: "Невже це діло рук самого Бога?"

 RUS_news.3.t: "[Get_newspaper_header]Республіка Комі об'єднує Західну Росію!"
 RUS_news.3.desc: "Народжена з попелу ЗРРФ, невелика Республіка Комі зуміла вижити поміж більших регіональних суперників. Прихисток для політичних радикалів усіх мастей ставав дедалі нестабільнішим, та зрештою статус-кво втримався. [KOM.GetRulingParty] вдалося усунути різноманітну радикальну опозицію та знову об'єднати Західну Росію.\n\nОприлюднено декларацію президента [KOM.GetLeader], за якою замість Комі постає Західноросійська Вільна Республіка, що не обмежується колишньою територією АССР, а охоплює значно ширші землі. Це стало переломним моментом і знаменує остаточну поразку суперників демократичної держави воєначальника в регіоні. Схоже, з'явився новий претендент на владу над Росією.\n"
 RUS_news.3.a: "На щастя, це демократія."

 RUS_news.4.t: "[Get_newspaper_header]Комі об'єднує Західну Росію!"
 RUS_news.4.desc: "Після років хаосу й нестабільности, упродовж яких воєначальники боролися за панування, Західна Росія нарешті опинилася під стабільною владою одного режиму, причому демократичного. Або принаймні формально демократичного.\n\nДочка старого більшовицького політика, усунутого під час боротьби за владу у 1920-х, Свєтлана Сталіна піднялася щаблями Демократичної коаліції, що правила Республікою Комі із Сиктивкара. Вірна прихильниця політики Вознєсєнского й Морозова зрештою зіткнулася з розпадом коаліції, над якою так важко працювала, і тоді вирішила перебрати владу. Тимчасово призупинивши періодичні демократичні вибори в Республіці, відтоді вона правила авторитарно й зуміла об'єднати всю Західну Росію. Проте, попри всі обіцянки, виборів у цій західноросійській державі поки не видно, а її майбутнє лишається непевним.\n"
 RUS_news.4.a: "Сподіваймося, демократія повернеться."

 RUS_news.5.t: "[Get_newspaper_header]Комі об'єднує Західну Росію!"
 RUS_news.5.desc: "Народжена з попелу ЗРРФ, невелика Республіка Комі зуміла вижити поміж більших регіональних суперників. Прихисток для політичних радикалів усіх мастей ставав дедалі нестабільнішим, та зрештою статус-кво втримався. [KOM.GetRulingParty], партії, яка очолювала республіку від самого її народження, вдалося усунути різноманітну радикальну опозицію та знову об'єднати Західну Росію.\n\nОприлюднено декларацію президента, за якою замість Комі постає Західноросійська Вільна Республіка, що не обмежується колишньою територією АССР, а охоплює значно ширші землі. Це стало переломним моментом і знаменує остаточну поразку суперників демократичної держави воєначальника в регіоні. Схоже, з'явився новий претендент на владу над Росією.\n"
 RUS_news.5.a: "На щастя, це демократія."

 RUS_news.6.t: "[Get_newspaper_header]Західна Совєцька Федерація об'єднує Західну Росію"
 RUS_news.6.desc: "Ніколай Бухарін, можливо, й загинув, але його спадщина живе далі, не в останню чергу завдяки нащадкам. Спершу від Свєтлани Бухаріної, дочки колишнього комуністичного лідера, чекали ролі звичайної маріонетки лівих інтриґанів Комі. Проте вона сама виявилася здібною й рішучою керівницею, перевершила і союзників, і ворогів та очолила соціялістичну Комі. Закріпивши владу, Бухаріна знову об'єднала решту Західної Росії під червоним стягом.\n\nВизнаючи батькові помилки, Бухаріна однаково тримається комуністичного бачення й надії відновити Совєцький Союз після років анархії та занепаду. Мало хто з постсовєцьких воєначальників ладен присягнути західноросійській голові, але Бухаріна ще не вичерпала своїх хитрощів, здатних підкорити ворожі російські держави її волі.\n"
 RUS_news.6.a: "За владу Совєтів!"
 RUS_news.6.b: "Який батько, така й дочка."

 RUS_news.7.t: "[Get_newspaper_header]Совєцька Республіка Західної Росії об'єднує Західну Росію"
 RUS_news.7.desc: "Поставши невдовзі після краху комуністичних сил у Західноросійській війні, демократична Республіка Комі виявилася неспроможною владнати численні внутрішні проблеми й захиститися від загрози екстремізму, тож упала під натиском ультралівих парамілітарних загонів. Відтак Комі опинилася під колективним керівництвом старійшин Комуністичної партії, однак за купкою слабовільних бюрократів можна розпізнати чоловіка, що керує ними з-за лаштунків, - Міхаїла Суслова, видатного теоретика марксизму-лєнінізму й ідеологічного провідника сиктивкарських лівих.\n\nВідновивши совєцьку владу в Комі й обернувши регіональних суперників на руїни, комуністичне керівництво Західної Росії взяло курс на відродження совєцької влади на ортодоксальних марксистських засадах, від яких більше не відступатиме.\n"
 RUS_news.7.a: "Наша сила - у Партії!"
 RUS_news.7.b: "Невже вони досі не навчилися на помилках попередників?"

 RUS_news.8.t: "[Get_newspaper_header]Совєцька Федерація Західної Росії об'єднує Західну Росію"
 RUS_news.8.desc: "Звіти із Західної Росії підтверджують: землі, колись поділені між численними державами воєначальників, тепер підпорядковані одній із них - колишній Республіці Комі. Судячи зі звернення про об'єднання, очільником новопроголошеної Західної Совєцької Федерації є Андрєй Жданов.\n\nУзурпувавши владу свого давнього союзника, колишнього президента Комі Ніколая Вознєсєнского, та здолавши суперників серед лівих, Жданов утвердив беззаперечне панування. Новий генеральний секретар пообіцяв російському народові «соціялістичну альтернативу». Лібертарні схильності й популістська риторика вже принесли йому шалену популярність, хоча опозиція ще існує.\n"
 RUS_news.8.a: "Соціялізм відродився."

 RUS_news.9.t: "[Get_newspaper_header]Усть-Сисольск об'єднує Західну Росію!"
 RUS_news.9.desc: "Уперше за довгий час решта світу одержала певні й підтверджені відомості про події в Західній Росії. Учора Іґорь Шафарєвіч виступив як очільник нової західноросійської держави - не соціялістичної й не демократичної, а запекло націоналістичної. У промові він оголосив намір відвоювати решту Росії у тиранів і знову її об'єднати.\n\nІґорь Шафарєвіч належить до організації «Пассіонарії», партії, створеної багато років тому в молодій Республіці Комі. Математик поділяв ультраправі погляди, близькі до поглядів свого союзника Льва Ґумільова, тож приєднався до них, перш ніж стати обличчям правиці - співчутливою й нібито моральною людиною. Після приходу його фракції до влади «Усть-Сисольск» швидко розрісся, і, схоже, на Уралі вони не зупиняться.\n"
 RUS_news.9.a: "З Республіки «Комі» народжується російська нація."

 RUS_news.10.t: "[Get_newspaper_header]Усть-Сисольск об'єднує Західну Росію!"
 RUS_news.10.desc: "Згідно із заявами нового уряду-суперника в боротьбі за возз'єднання Росії, євразійська мрія, створена й популяризована багатьма правими російськими радикалами, стала на крок ближчою до здійснення. Війною і дещицею дипломатії Республіка Комі розширилася за межі заявлених кордонів, охопивши всю колишню територію ЗРРФ, і таким чином здобула частку в майбутньому всієї Росії. Однак очолює її не демократичний державний діяч і не місцевий керівник, а Лєв Ґумільов. Один із найпалкіших прихильників євразійства й зачарований стародавніми цивілізаціями, Ґумільов очолив ультраправу партію «Пассіонарії», що проголошує себе оплотом проти комунізму. Сусіди нової влади вже розмірковують над відповіддю, хоча пристосування до неї певно потребуватиме часу.\n"
 RUS_news.10.a: "Напевно ж це євразійство ненаукове!"
 RUS_news.10.b: "Ґумільов утілить нашу мрію!"

 RUS_news.11.t: "[Get_newspaper_header]Західноросійська Національна Совєцька Республіка об'єднує Західну Росію!"
 RUS_news.11.desc: "Те, що почалося як інтелектуальні роздуми начальника НКВД, завершилося створенням грізної сили в Західній Росії, згуртованої еклектичною тоталітарною ідеологією. Іван Сєров, колишній парамілітарний боєць і співробітник безпеки усть-сисольських комуністів, став одноосібним лідером у Республіці Комі, що розвалювалася, здолавши ворогів усередині й поза межами колишньої демократичної російської держави. Перебудовуючи країну за принципами ордосоціялізму, Сєров проголосив повернення російського національного характеру до совєцької політики, зберігаючи революційні риси більшовизму.\n\nЗлет Сєрова та його «ордосоціялістичної» диктатури викликав цікавість - і ще більше ненависти - в інших російських державах, а комуністи таврують його систему як відверте фашистське відхилення. Хоч би як ненавиділи цього чоловіка, очевидно, нова ідеологія проклала Сєрову шлях до панування над Росією, якого йому ще належить цілковито досягти.\n"
 RUS_news.11.a: "З товаришем Сєровим совєцька батьківщина знову стане могутньою!"
 RUS_news.11.b: "Якого прокляття Бог іще не наслав на стражденну російську землю?"

 RUS_news.12.t: "[Get_newspaper_header]Західноросійське Регентство об'єднує Західну Росію!"
 RUS_news.12.desc: "Хмари нерозкаяної реакції збираються над просторами Західної Росії: монархічні сили Усть-Сисольска здолали останнього регіонального суперника в боротьбі за владу над росіянами. «Регентство Західної Росії» на чолі із самопроголошеним регентом Російської Імперії, колишнім нацистським колаборантом і монархістом-емігрантом Сєрґєєм Таборіцкім, присвятило себе викоріненню останніх паростків більшовицької чуми й готується до повернення цесаревича Алєксєя. Той нібито пережив більшовицьку різанину 1918 року й має посісти законне місце на російському престолі.\n\nПоки самозваний регент із разючою жорстокістю запроваджує старі імперські звичаї, сусіди володінь Таборіцкого, приголомшені його фанатичним завзяттям, починають міркувати, чи здатен він покликатися на щось вагоміше за легітимність цесаревича, який помер кілька десятиліть тому...\n"
 RUS_news.12.a: "Життя за царя і його благословенного регента!"
 RUS_news.12.b: "Моторошно..."

 RUS_news.13.t: "[Get_newspaper_header]Самара об'єднує Західну Росію!" #Bunyanchenko
 RUS_news.13.desc: "Почавши як зневажені колаборанти, що засіли довкола Самари, Російська визвольна армія, або РОА, здолала всіх можливих ворогів і об'єднала всю Західну Росію. Про колишню колаборантську армію відомо мало, крім того, що її очолює генерал Власов. Чутки від утікачів змальовують генерала Бунячєнка як заступника Власова й розповідають про його прагнення спрямувати вояків РОА до помсти як більшовикам, так і німцям.\n\nРайх не прокоментував появу «Тимчасового комісаріяту Західної Росії». Ніхто не знає, скільки простоїть маленька імперія Бунячєнка й Власова, але поява мілітаризованої Росії біля самого порога неодмінно стане небажаною для Райху подією, якщо вона й далі намагатиметься возз'єднати країну.\n"
 RUS_news.13.a: "Анархія добігає кінця?"

 RUS_news.14.t: "[Get_newspaper_header]Самара об'єднує Західну Росію!" #Oktan
 RUS_news.14.desc: "З туману чуток і суперечливих новин російської анархії постала нова держава. Аналітики розвідок усього світу підтвердили, що Російська визвольна армія, або РОА, зуміла здолати всіх суперників у боротьбі за землі, які межують із Німецьким Райхом.\n\nРОА, що виросла з колаборантської міліції, та її командир генерал Власов розгромили суперників у жорстокій кампанії. За уривчастими відомостями, у центрі зміни долі РОА стоїть генерал-контрабандист Октан. Плани наступника Власова поки невідомі, адже РОА проголосила «Тимчасовий комісаріят Західної Росії». Біженці з нової держави засуджують корумповане правління Октана та його поплічників.\n"
 RUS_news.14.a: "Порядок у Росії? Хай мене Бог покарає."

 RUS_news.15.t: "[Get_newspaper_header]Самара об'єднує Західну Росію!" #Zykov
 RUS_news.15.desc: "Невідомими шляхами до багатьох світових інформаційних агенцій дійшло комюніке про народження «Тимчасового комісаріяту Західної Росії». Дивне послання описує появу нової демократії в Західній Росії на чолі з колишнім колаборантом Андрєєм Власовим та його протеже Мілєтієм Зиковим.\n\nРосійська визвольна армія, яку в Росії повсюдно зневажають за підтримку німців у Західноросійській війні, завжди називала себе зародком законної російської держави, вільної від більшовицького впливу. Після війни РОА зникла в анархії, тож її сьогоднішнє повернення неабияк приголомшило спостерігачів за Росією. Довгострокові перспективи нової держави лишаються непевними.\n"
 RUS_news.15.a: "Демократія, насаджена силою зброї?"

 RUS_news.16.t: "[Get_newspaper_header]Імперський стяг над Західною Росією?"
 RUS_news.16.desc: "Унаслідок подій, яких мало хто очікував, стара монархія знову стала провідною силою російської політики. Вірні імператорові Владіміру III сили успішно об'єднали розпорошені держави Західної Росії.\n\nМіжнародна реакція виявилася вкрай неоднозначною. Схвалення шляхтичів-емігрантів майже одностайне, однак інші засудили імператорський уряд як відновлення тиранії. Великі держави тим часом мовчать, очікуючи подальших подій, перш ніж робити дипломатичні кроки.\n\nПопри успіхи, уряд Вятки досі контролює лише близько п'ятої частини Росії. Ще невідомо, чи зможе він керувати навіть нею. Хай би яким був остаточний результат, ця подія неодмінно матиме величезний вплив на Росію в прийдешні роки.\n"
 RUS_news.16.a: "Імператор повернувся, але надовго?"
 RUS_news.16.b: "Сьогодні Імперський стяг гордо майорить!"
 RUS_news.16.c: "Схоже, ще один Романов стане до розстрільної стіни. Сподіваймося."

 RUS_news.17.t: "[Get_newspaper_header]Західноросійський революційний фронт об'єднує Західну Росію!"
 RUS_news.17.desc: "Люди й уряди в усьому світі приголомшені: уперше від Західноросійської війни 1950-х років із руїн Совєцького Союзу просочилися конкретні відомості. Західноросійський революційний фронт, який давно вважали розчавленим німецьким чоботом, поширив і зміцнив владу над Західною Росією та приборкав численних ворогуючих воєначальників під пильним оком великого маршала Алєксандра Алтуніна.\n\nВідомий своєю відданістю ортодоксальному більшовизму великий маршал Алтунін уже залучив народ до відновлення порядку й соціялізму на колись беззаконних землях, водночас збираючи Червону армію на сході. Схоже, великий маршал збирається здійснити мрію попередника про возз'єднаний СССР або загинути в спробі.\n"
 RUS_news.17.a: "Невже відродження СССР уже близько?"

 RUS_news.18.t: "[Get_newspaper_header]Західноросійський революційний фронт об'єднує Західну Росію!"
 RUS_news.18.desc: "Люди й уряди в усьому світі приголомшені: уперше від Західноросійської війни 1950-х років із руїн Совєцького Союзу просочилися конкретні відомості. Західноросійський революційний фронт, який давно вважали розчавленим німецьким чоботом, поширив і зміцнив владу над Західною Росією та винищив численних ворогуючих воєначальників під жорстоким поглядом великого маршала Міхаїла Тухачєвского.\n\nСумнозвісно прозваний «Червоним Наполеоном», великий маршал Тухачєвскій дістане неоціненну перевагу від тактики глибокої операції, коли Червона армія рушить на схід до Уралу, сповідуючи ще мілітаристичнішу форму совєцького комунізму. Очевидно, що «Червоний Наполеон» збирається знищити ворогів і знову об'єднати Росію під червоним стягом.\n"
 RUS_news.18.a: "Стара примара знову блукає Европою."

 RUS_news.19.t: "[Get_newspaper_header]Західноросійський революційний фронт об'єднує Західну Росію!"
 RUS_news.19.desc: "Люди й уряди в усьому світі приголомшені: уперше від Західноросійської війни 1950-х років із руїн Совєцького Союзу просочилися конкретні відомості. Західноросійський революційний фронт, який давно вважали розчавленим німецьким чоботом, поширив і зміцнив владу над Західною Росією та приборкав численних ворогуючих воєначальників під обачним керівництвом великого маршала Ґєорґія Жукова.\n\nВідомий і шанований реформіст, великий маршал Жуков уже почав іще дужче зміцнювати владу на заході, укріплюючи кордон із Московією та відбудовуючи інфраструктуру, тим часом як Червона армія готується рушити на схід до Уралу. Схоже, навіть поки Райх оговтується від власної громадянської війни, росіяни готуються розпочати нову.\n"
 RUS_news.19.a: "Невже відродження СССР уже близько?"

 RUS_news.20.t: "[Get_newspaper_header]Західну Росію знову розколото!"
 RUS_news.20.desc: "Той, кого багато хто вважав найімовірнішим об'єднувачем Росії, зазнав краху після згубного вторгнення до фінської маріонеткової держави Онєґи. Після довгої й запеклої битви фіни та їхні російські союзники закріпили владу над заходом і створили Північноросійську Республіку, підпорядкувавши решту регіону через держави-клієнти.\n\nЯк це вплине на можливе об'єднання Росії, незрозуміло: захід лежить розколотий, схід прокидається від сну, а барабани війни гримлять дедалі гучніше. Північноросійська Республіка мусить ступати обережно, інакше молода держава може стати лише черговою жертвою попелу старого світу.\n"
 RUS_news.20.a: "Захід спить, чекаючи гідного ворога."

 ### West Siberia World Events ###
 RUS_news.21.t: "[Get_newspaper_header]Свєрдловск об'єднує Західний Сибір!"
 RUS_news.21.desc: "Західний Сибір роздирають фракції та кліки ще від кінця Західносибірської народної республіки, а то й довше. Та нині одна з них нарешті взяла гору - Свєрдловський військовий уряд.\n\nХунта, осередком якої є однойменне місто, здолала головних суперників, інші могутні уламки ЗСНР, і поширила владу на слабших. Загроз режимові лишилося мало, й більшість знавців російських справ погоджується, що постала сила, рівна старій соціялістичній республіці. Однак очільник диктатури [SVR.GetLeader] утримується від порівнянь із ЗСНР, воліючи зображати свій режим новим."
 RUS_news.21.a: "З'явився новий претендент на владу над Росією."

 RUS_news.22.t: "[Get_newspaper_header]Тюмєнь об'єднує Західний Сибір!"
 RUS_news.22.desc: "Уривчасті відомості з колишнього Совєцького Союзу підтверджують, що Західний Сибір уперше за десятиліття возз'єднала та сама держава, яка колись ним правила. Рештки Західносибірської народної республіки відновили владу над краєм зі своєї бази в Тюмєні й тепер готуються вступити в боротьбу за решту Росії.\n\nГенеральний секретар Лазарь Каґановіч, палкий прихильник маловідомого совєцького діяча Іосіфа Сталіна, вважає масштабну централізацію промисловости й політичної влади єдиним способом уникнути помилок старого Совєцького Союзу. Покаже час, чи зможе сталінська модель упоратися з викликом відродження Совєцького Союзу."
 RUS_news.22.a: "Стара гвардія знову набуває ваги."
 
 RUS_news.23.t: "[Get_newspaper_header]Чорна Ліга об'єднує Західний Сибір!"
 RUS_news.23.desc: "Із пусток Західного Сибіру вирвалися уривчасті новини, що шепочуть про об'єднання регіону загадковою Чорною Лігою. Очевидно, відколовшись від зниклої Західносибірської народної республіки, Ліга прагне відбудувати Росію, щоб захистити народ від подальшої німецької агресії.\n\nЗасновник Ліги Дмітрій Карбишев помер незадовго до початку громадянської війни в Німеччині, тож молодою державою тепер керує його учень Дмітрій Язов. Обіцяючи повернути довоєнну якість життя, Язов має величезну популярність, а його військові реформи свідчать про рішучий курс на возз'єднання Росії. Позаду Ліги Урал, а Центральний Сибір дедалі ближче насувається попереду, тому майбутнє регіону видається непевним і бурхливим."
 RUS_news.23.a: "Лиховісно."
 
 ### Central Siberia World Events ###
 RUS_news.24.t: "[Get_newspaper_header]Красноярск об'єднує Центральний Сибір!"
 RUS_news.24.desc: ""
 RUS_news.24.a: ""
 
 RUS_news.25.t: "[Get_newspaper_header]Сибірська Чорна Армія об'єднує Центральний Сибір!"
 RUS_news.25.desc: "Поодинокі новинні повідомлення й оголошення із Центрального Сибіру підтвердили, що регіон опинився під владою раніше маловідомого утворення, знаного як Сибірська Чорна Армія. На основі вчення Нєстора Махна часів Громадянської війни в Росії постало суспільство мілітаризованого анархізму, де населення захищала не держава, а місцеві ополченці та їхні командири, покликані боронити комуни й анархістський лад.\n\nЦя ідеологія, уперше прийнята на землях між Центральносибірською Республікою та Вєрховним Совєтом Ґєнріха Яґоди після краху обох урядів, тепер силою зброї нової Чорної Армії утвердилася на всій колишній території ЦСР, попри всі труднощі, які створює така система."
 RUS_news.25.a: "Повернення, якого мало хто чекав."
 
 RUS_news.26.t: "[Get_newspaper_header]Сибірська Чорна Армія об'єднує Центральний Сибір!"
 RUS_news.26.desc: "Сибірська Чорна Армія вперше постала на спустошених землях Центрального Сибіру внаслідок краху найбільших центральних урядів Росії після Другої світової війни. Її засновники захоплювалися Вільною Територією Нєстора Махна кількадесятирічної давности й спробували її відтворити, створивши анархістське суспільство зі збройною силою, організованою місцевими мешканцями, які брали участь в управлінні комунами.\n\nТа коли СЧА поширила владу на інші міста й комуни регіону, ці ополчення, Чорна Армія, такою мірою підпорядкували собі місцеві й загальнодержавні справи, що їхня анархістська природа опинилася під сумнівом. Тепер, ставши об'єднавчою силою Центрального Сибіру, провідники СЧА, схоже, близькі до знищення справжньої анархістської мрії, за яку колись повстали."
 RUS_news.26.a: "Прикрий розвиток подій."
 
 RUS_news.27.t: "[Get_newspaper_header]Народно-революційний совєт об'єднує Центральний Сибір!"
 RUS_news.27.desc: "Народно-революційний совєт спочатку створили Алєксандр Васілєвскій і його найближчі радники та підлеглі під час утечі з окупованої нацистами Росії до Монґольської Народної Республіки. Попри всі труднощі, спричинені окупацією більшої частини Монґолії ворожим урядом Мєнцзяна, соціялістична держава знайшла інший напрям розширення - решту Центрального Сибіру.\n\nСовєт здолав могутніх ворогів у регіоні й тепер заявив права на всі його землі в ім'я «нового Совєцького Союзу», який прагне побудувати. В інших куточках Росії воєначальники-суперники із захватом або занепокоєнням спостерігають за новим претендентом на загальнодержавне панування."
 RUS_news.27.a: "Чи може соціялізм повернутися?"
 
 RUS_news.28.t: "[Get_newspaper_header]Новосибірск об'єднує Центральний Сибір!"
 RUS_news.28.desc: "Те, що почалося в добу занепаду Центральносибірської Республіки як велика фракція-відступниця, тепер зуміло перебрати її мантію. Держава Новосибірск під проводом Алєксандра Покришкіна має бурхливу історію. Уряд-суперник постав як жорстока відповідь на заходи часів Сибірської війни й підтримував тривожне співіснування з містом-державою Барнаулом.\n\nУтім, невдовзі він подолав політичні труднощі завдяки численному населенню, сільськогосподарській базі та промисловості й узявся до розширення та возз'єднання Центрального Сибіру. Воно, вочевидь, увінчалося успіхом: останніх ворогів переможено, а Покришкін тепер править регіоном як милостивий деспот."
 RUS_news.28.a: "Стрижень Росії об'єднано."
 
 RUS_news.29.t: "[Get_newspaper_header]Кємєрово об'єднує Центральний Сибір!"
 RUS_news.29.desc: "Повідомлення із Центрального Сибіру суперечливі й непевні, але одне відомо напевно: через розширення держави воєначальника Ніколая Крилова регіон пережив безпрецедентне потрясіння. Колишній совєцький генерал підтримав молоду Центральносибірську Республіку, але під час Сибірської війни відколовся, створив власну кліку й назвав себе Верховним правителем, самодержцем і королем Руси Рюриком II на честь середньовічного князя, засновника династії Рюриковичів.\n\nЦя незвичайна особистість, яку він собі прибрав, тепер відома в Росії та за кордоном, адже його королівство вирвало з чужих рук величезні простори. Інші держави приголомшено дивляться на нову абсурдну фракцію, що тепер має шанс возз'єднати Росію."
 RUS_news.29.a: "Який божевільний."
 
 RUS_news.30.t: "[Get_newspaper_header]Томск об'єднує Центральний Сибір!"
 RUS_news.30.desc: "Старий уряд Центрального Сибіру, який багато хто вважав ідеалістичним і відірваним від дійсности, багато років тому відступив до Томска після свого падіння внаслідок Сибірської війни. Мало хто вірив, що режим інтелектуалів здатен вижити, а тим паче повернутися, проте це сталося.\n\nТомський уряд зумів здолати колишніх союзників і нових ворогів, повернув кордони ЦСР і фактично її відновив. Наступником засновника Боріса Пастєрнака став Андрєй Сахаров, науковець та інтелектуал на чолі руху «Модерністів». Разом з іншими науковцями й професорами він узявся будувати на засадах популізму, освіти й меритократії державу, де панує наука, а ефективність є понад усе. Цей задум лише починає втілюватися."
 RUS_news.30.a: "Чи відбудують Росію від самих підвалин?"
 
 RUS_news.31.t: "[Get_newspaper_header]Томск об'єднує Центральний Сибір!"
 RUS_news.31.desc: "У вирі хаосу, звичного для російських держав воєначальників, дехто прагне раз і назавжди покласти край варварській славі Росії на світовій арені. «Бастилярди» - це коло пов'язаних із промисловістю композиторів і письменників, що виникло в Томску, осідку залишків уряду старої ЦСР після її краху. Перемігши на одних із небагатьох справді проведених у Росії демократичних виборів, Бастилярди взялися будувати державу під владою еліти, а тоді почали відвойовувати регіон в ім'я республіки.\n\nНовий президент Центральносибірської Республіки Данііл Хармс, сам поет і письменник, дав зрозуміти, що це не остаточна мета томських інтелектуалів. За його словами, «на країну попереду чекають більші випробування».\n"
 RUS_news.31.a: "Що на це скажуть нижчі класи?"
 RUS_news.31.b: "Сталь і дух прокладають нам шлях!"

 RUS_news.32.t: "[Get_newspaper_header]Томск об'єднує Центральний Сибір!"
 RUS_news.32.desc: "У царстві хаосу, типовому для російських держав воєначальників, можливо, постав маяк свободи й демократії. Старий уряд Центральносибірської Республіки, змушений після краху відступити до Томска, нещодавно оголосив, що регіон знову опинився під владою єдиної держави - їхньої.\n\nПро політичні фракції, які колись панували в республіці, відомо мало, проте, схоже, уряд дістався групі «Гуманістів». Її заснував відомий композитор Дмітрій Шостаковіч, а продовжив справу його протеже Моісєй Вайнбєрґ. Це спілка митців, яка прагне гуманної й демократичної республіки, що захищатиме своїх громадян. Очевидно, саме ця мрія й здійснилася.\n"
 RUS_news.32.a: "Принаймні це демократія."
 RUS_news.32.b: "На благо людства!"
 
 RUS_news.33.t: "[Get_newspaper_header]Томск об'єднує Центральний Сибір!"
 RUS_news.33.desc: "Центральний Сибір знову опинився під владою інтелектуального класу, який після Другої світової війни заснував першу російську демократію й усупереч усьому втримався в Томску. Після смерти поета-президента Боріса Пастєрнака ініціятиву перебрало товариство інтелектуалів і письменників «Декабристи», що вдалося до дипломатії та численних збройних конфліктів. Декабристи прийшли до влади, коли їхнього лідера Дмітрія Ліхачєва обрали наступником Пастєрнака, і прагнуть розвивати демократичний елітизм. Хоч це й викликало критику нижчих класів та політичних опонентів, республіканські ідеали досі збережено. Зрештою, можливо, це єдиний шанс Росії стати стабільною і квітучою демократією.\n"
 RUS_news.33.a: "Ще один претендент на возз'єднання."
 
 
 ### Russian Far East World Events ###
 RUS_news.34.t: "[Get_newspaper_header]Амур об'єднує російський Далекий Схід!"
 RUS_news.34.desc: "За дивним поворотом подій, продувана вітрами тайга російського Далекого Сходу тепер нібито підпорядкована силам Константіна Родзаєвского, засновника Россійской Фашистской Партії. Хоча думка про росіян, що прийняли фашизм, може здаватися дивною, чимало аналітиків згадують як прецедент провідну роль РФП у Всеросійському експедиційному корпусі.\n\nЩо чекає на режим Родзаєвского далі, невідомо. Логічно припустити, що РФП почне просуватися вглиб Сибіру, намагаючись об'єднати Росію. Як цей так званий Вождь та його послідовники взаємодіятимуть із міжнародною системою, неясно. РФП і Родзаєвскій давно користуються підтримкою японських покровителів, однак його бачення фашистської Росії явно ближче до німецької моделі, зважаючи на лютий антисемітизм партії та широке використання нацистської символіки. Якими будуть наслідки цих подій, поки невідомо.\n"
 RUS_news.34.a: "Темні часи на Далекому Сході."
 RUS_news.34.b: "Та ворогів іще багато."
 
 RUS_news.35.t: "[Get_newspaper_header]Іркутск об'єднує російський Далекий Схід!"
 RUS_news.35.desc: "Совєцький уламок на чолі з Ґєнріхом Яґодою був однією з небагатьох визнаних держав повоєнної Росії, проте світ нічого не знав про його справжній стан, і багато хто гадав, що, як і решту російського Далекого Сходу, його поглинула російська анархія. Однак нещодавні події вперше від 1950-х років повернули його до заголовків. Довго втримуючи володіння в Іркутску, Яґода зумів знищити інших претендентів на владу над Росією в регіоні й знову утвердив панування на околицях колишнього Совєцького Союзу.\n\nУсунувши найближчих ворогів, голова Яґода тепер прагне цілковито закріпити претензію на законне наступництво держави Бухаріна й поширити владу до західних рубежів Сибіру. Явне відродження совєцької держави-наступниці стривожило сибірських сусідів, тоді як міжнародна спільнота з великим занепокоєнням стежить за майбутнім Росії.\n"
 RUS_news.35.a: "Усі на захист совєцької батьківщини!"
 RUS_news.35.b: "З поверненням... «товаришу»."
 RUS_news.35.c: "Хода терору триває."
 
 RUS_news.36.t: "[Get_newspaper_header]Бурятія об'єднує російський Далекий Схід!"
 RUS_news.36.desc: "Усі погляди прикуті до сибірського Далекого Сходу, де сили колишньої Бурятской АССР закріплюють владу над регіоном під проводом колишнього комісара Валєрія Сабліна. Донедавна він служив Ґєнріху Яґоді під час його терору, а тоді очолив народне повстання, яке зрештою перемогло колишнього очільника НКВД.\n\nСповідуючи твердий лєнінізм, Саблін водночас присягнув уникати крайнощів старого Союзу й прагнути справедливого та рівного суспільства. Він популярний серед молоді та мрійників Сибіру, однак залишається питання, наскільки відданий своїй мрії про справді рівноправний Союз Саблін, який ледь сягнув зрілого віку. Хай там як, чоловіки й жінки Далекого Сходу крокують на захід, рішуче несучи свої ідеї всій Росії.\n"
 RUS_news.36.a: "Чи виживе ідеалізм у ці темні часи?"
 
 RUS_news.37.t: "[Get_newspaper_header]Чіта об'єднує російський Далекий Схід!"
 RUS_news.37.desc: "Сьогоднішнє звернення Міхаїла Андрєєвіча Романова на російському радіо підтвердило те, у що останнім часом багато хто вірив: новий цар та його уряд із Чіти встановили владу над усім російським Далеким Сходом.\n\nЦю фракцію створила велика група російських монархістів-емігрантів у Харбіні за підтримки Японської Імперії, і починала вона як чергова держава воєначальника біля маньчжурського кордону. Поширена думка, що інші реакційні генерали використовували царя Міхаїла як маріонетку й досі це роблять, хоча напевно невідомо. Наразі важливо те, що російський монархізм повернувся, нехай і далеко від серця держави.\n"
 RUS_news.37.a: "Невже перегони за возз'єднання почалися?"
 
 RUS_news.38.t: "[Get_newspaper_header]Маґадан об'єднує російський Далекий Схід!"
 RUS_news.38.desc: "Із тихої тундри російського Далекого Сходу надійшли новини. На давно покинутому загальнодержавною владою прикордонні всупереч усьому постає новий претендент на владу. Міхаїл Матковскій, очільник бунтівної гілки Россійской Фашистской Партії з портового міста Маґадан, утвердився як головна влада далекосхідного регіону.\n\nМатковскій і його союзники, відомі прагматичні фашисти, колись відкололися від первісної партії в Амурі через крайнощі Родзаєвского та його підтримку нацистів під час Великої Вітчизняної війни. Тепер решта світу завмерла, чекаючи, як далеко зможе зайти цей старий російський фашист. Колись вітри долі привели Росію до червоних, а тепер ця течія може змінити напрям.\n"
 RUS_news.38.a: "Дивний розвиток подій."
 
 RUS_news.39.t: "[Get_newspaper_header]Республіка Західна Аляска об'єднує російський Далекий Схід!"
 RUS_news.39.desc: "На далекосхідних окраїнах Росії сталося щось неймовірне. Легендарний Мітчелл Лівінґстон Вербелл III, очільник найманського загону, захопив величезні землі регіону, співмірного розмірами з Канадою. Спочатку він шукав прихистку для ветеранів і солдатів, розчарованих і відчужених тим, як до них ставилися в усьому світі, а зрештою вступив на службу до Міхаїла Матковского. Потім повстав проти колишнього працедавця й заснував місце, де солдати могли почуватися вдома.\n\nМожливо, досі успіхом він завдячував удачі, але для здійснення його задумів прихильности долі буде замало. Якщо чутки правдиві, Вербелл не збирається зупинятися на Далекому Сході. Можливо, Росію нарешті мають очолити не політики чи науковці, а ті, хто віддає життя за її захист.\n"
 RUS_news.39.a: "Оце захват."
 
 RUS_news.40.t: "[Get_newspaper_header]Боже царство в Сибіру об'єднує російський Далекий Схід!"
 RUS_news.40.desc: "Сьогодні світ приголомшено спостерігає, як із хаосу російського Далекого Сходу невідомо звідки постав цілком новий претендент, перевернув регіональний лад і закріпив над краєм свою владу. Новостворена держава воєначальника, яка називає себе Божим царством у Сибіру, спантеличує міжнародних спостерігачів численними суперечностями.\n\nВодночас держава й анархія, побожне й світське, Царство на чолі із загадковим «Отцем Півночі», якого припустимо ототожнюють із православним священником Алєксандром Мєнєм, геть непередбачуване. Те, що починалося як невелике селянське повстання, натхнене вкрай неортодоксальними переконаннями Отця, ще може привести до відродження Росії. Поки воїни Святої Руси крокують на захід, світ затамував подих.\n"
 RUS_news.40.a: "Земля божої суперечности."
 
 ### Misc Russia news events ###
 RUS_news.41.t: "[Get_newspaper_header]Сибірська революція"
 RUS_news.41.desc: "За цілковито несподіваним поворотом подій держава Центрального Сибіру, яку багато хто вважав чи не наймогутнішою серед усіх російських держав воєначальників, упала перед робітничою революцією. Новостворена Сибірська робітнича федерація - нестабільний конґломерат профспілок, рад і незалежних повстанських осередків - прагне перетворити регіон на робітничий рай. Що саме це означає і чи взагалі СРФ виживе, поки невідомо.\n\nСРФ очолює, схоже, простий бригадир Віталій Костін, і це, мабуть, найбільш неортодоксальна держава на мапі - якщо її взагалі можна назвати державою. Хай би якою була доля його новоствореного утворення, мрія Костіна про країну, де робітник стоїть на першому місці, тепер не сходить з думок кожного росіянина, аби й їхні амбітні держави воєначальників не розбудили сплячого велета революції.\n"
 RUS_news.41.a: "Чи виживе ця оселя робітника?"
 
 RUS_news.42.t: "[Get_newspaper_header]Златоуст знову розколює Західний Сибір!"
 RUS_news.42.desc: "Схоже, мрія про єдиний Сибір сьогодні зазнала тяжкого удару: розташована в Уральських горах Республіка Златоуст здолала амбітних воєначальників регіону й відновила порядок. Замість анексії президент держави Євґєній Драґунов, вочевидь, вирішив створити в регіоні низку маріонеткових держав, хоча й скористався нагодою трохи розширити власні кордони, заснувавши так звану Уральську Республіку.\n\nХоч Західний Сибір замовк, решта країни досі палає у вогні війни, і можна не сумніватися: будь-який майбутній об'єднувач Росії спершу муситиме загасити вогник стабільности, яким тепер став Західний Сибір.\n"
 RUS_news.42.a: "Можливо, ми бачимо народження нових держав?"
 
 RUS_news.43.t: "[Get_newspaper_header]Громадянська війна в Монґолії"
 RUS_news.43.desc: "Світ приголомшено спостерігає за неймовірним поворотом: розміщені в Монґолії рештки Червоної армії оголосили війну Монґолії зі Сфери співпроцвітання - і перемогли. Мирна угода передбачає, що Сфера не втручатиметься в діяльність Червоної армії на сході, що безсумнівно свідчить про експансіоністські цілі її очільника, генерала Алєксандра Васілєвского.\n\nВійськовик і один із найкращих генералів занепалого Совєцького Союзу, Васілєвскій тепер звертає увагу на північні фабрики Центрального Сибіру. Колись багато хто вважав його групу вцілілих червоноармійців звичайною ордою голодних монґольських бандитів, але тепер, схоже, у численних воєначальників, які змагаються за владу над розбитим Союзом, з'явився ще один ворог.\n"
 RUS_news.43.a: "Від тайги до британських морів Червона армія найсильніша."
 
 RUS_news.44.t: "[Get_newspaper_header]Президент Сталіна підписує Закон про національний суверенітет"
 RUS_news.44.desc: "Здійснивши сміливий зовнішньополітичний крок, президентка держави [KOM.GetNameDef] Свєтлана Іосіфовна Сталіна підписала амбітний законопроєкт, покликаний «забезпечити економічний і політичний суверенітет російської держави». Він містить цілий арсенал торговельних умов і вимог, найрадикальніша з яких обмежує вартість торговельних угод, що їх непов'язані союзом іноземні держави можуть укладати з новоствореною Республікою.\n\nНайважливіше те, що цей законопроєкт, за прогнозами, серйозно обмежить можливість іноземних держав купувати російські запаси нафти без попереднього укладення оборонної угоди із західноросійською державою. Цілком у дусі президентської теорії «суверенної демократії» держава Сталіної знову висунула міжнародній спільноті жорсткі умови в ім'я незалежности Росії.\n"
 RUS_news.44.a: "Сміливий крок."
 
 RUS_news.45.t: "[Get_newspaper_header]Вільна Територія розпадається!"
 RUS_news.45.desc: "Недавнє об'єднання Центрального Сибіру анархістською «Сибірською Чорною Армією» за останні кілька днів зійшло нанівець: численні держави воєначальників проголосили незалежність від Сибірського Совєту.\n\nБагато нових воєначальників стверджують, що відокремилися через так звану «зраду» Вільною Територією власних ідеалів, і заснували окремі від міжкомунних органів Вільної Території анархістські чи соціялістичні організації. Інші заявляють, що очолюють уряди-наступники держав, які Чорна Армія здолала під час перших завоювань. Однак усі ці нові рухи, схоже, мають спільного ворога - генерала Чорної Армії Івана Стєпанова, чиї сили відступають на південь, сподіваючись перегрупуватися й пізніше повернути втрачені землі.\n"
 RUS_news.45.a: "Передбачуваний кінець."
 RUS_news.45.b: "Чому ж це не спрацювало?"
 
 ### Total Russian reunification news events ###
 RUS_news.46.t: "[Get_newspaper_header]Повернення Фронту"
 RUS_news.46.desc: "Криваві війни за об'єднання Росії завершилися перемогою загартованих ветеранів, які першими захищали країну від нацистської Німеччини. Західноросійський революційний фронт, створений із решток Червоної армії, офіційно оголосив про об'єднання Росії під своїм стягом. Упродовж років Фронт воював не лише проти нацистської Німеччини, а й проти воєначальників, що панували в Росії після краху Совєцького Союзу.\n\nЛідера ЗРРФ, великого маршала Ґєорґія Жукова, не лише вихваляють як стратегічного генія, а й величають поборником простого народу; він пообіцяв і надалі підтримувати знедолених Совєцького Союзу.\n\nУряд Німеччини ще не відреагував на возз'єднання Росії, проте надходять повідомлення про мобілізацію військ на кордоні.\n"
 RUS_news.46.a: "Старий Фронт завдає удару у відповідь."
 RUS_news.46.b: "Слава великому маршалові Жукову!"
 RUS_news.46.c: "Ми відкинули їх одного разу й зробимо це знову."
 
 RUS_news.47.t: "[Get_newspaper_header]Біла армія возз'єднує Росію!"
 RUS_news.47.desc: "Із Росії надійшли приголомшливі новини! Завдяки дивовижній зміні долі низка успішних наступів привела переможну Білу армію до берегів Волги й забезпечила їй контроль над усією колись роздробленою державою. Уперше за майже пів століття Росією править цар.\n\nНа честь цієї події в Самарі провели великий військовий парад: вулицею перед радісними натовпами пройшли війська Білої армії та бронетехніка. У промові цар Нікіта I щедро вихвалив хоробрість своїх військ і пообіцяв, що Росія більше ніколи не опиниться під ярмом більшовицької тиранії. Наслідки нового об'єднання Росії під монархією поки неясні, але в країні відновлено довгоочікуваний мир і порядок.\n"
 RUS_news.47.a: "Геть несподіваний результат."
 RUS_news.47.b: "Слава імперії!"
 RUS_news.47.c: "Монархія чи ні, хай не забувають свого місця!"
 RUS_news.47.d: "Приємно для різноманітности побачити в Росії дружні обличчя."
 
 RUS_news.48.t: "[Get_newspaper_header]Відродження Совєцького Союзу"
 RUS_news.48.desc: "Схоже, Червона армія знову довела, що є наймогутнішою силою Росії: вона здолала всіх претендентів, розгромила опозицію та возз'єднала батьківщину. Почавши з найскромнішого становища, замкнена в Архангєльску після згубного завершення Західноросійської війни, Західноросійський революційний фронт, схоже, перетворився на відроджений Союз Совєцьких Соціялістичних Республік.\n\nФронт очолює великий маршал Міхаїл Тухачєвскій, стратегічний геній і прихильник глибокої операції, тож чимало спостерігачів припускають, що відроджений СССР зверне погляд на захід. Дехто навіть сумнівається, що амбіції Тухачєвского цим обмежуються, а нова хвиля партизанської діяльности в усій Східній Европі лише підкріпила такі заяви. Хай би що готувало майбутнє, Совєти рушать йому назустріч із мілітаристською люттю.\n"
 RUS_news.48.a: "Повернення червоних..."
 RUS_news.48.b: "Красная Армія всєх сільнєй!"
 RUS_news.48.c: "Треба було винищити цих слов'янських собак, коли мали нагоду."
 
 RUS_news.49.t: "[Get_newspaper_header]Об'єднання Росії" #Zykov Samara
 RUS_news.49.desc: "Із Самари, що тепер лежить у єдиній Росії, надійшла приголомшлива заява. Давній протеже Андрєя Власова Мілєтій Зиков проголосив так звану «Російську Республіку» - демократичну наступницю нещасливої демократії, яка прийшла на зміну імперії 1917 року.\n\nРосійську визвольну армію давно вважали серед місцевого населення колаборантами, але її відданість знищенню більшовизму та низовим демократичним цінностям Зикова, схоже, дала плоди. Після виборів, визнаних міжнародними спостерігачами «переважно чесними», Зиков уже оголосив повернення до демократії й антикомунізму, як їх бачить він та його товариші.\n\nЗиков уже виступив із рішучими заявами проти нацистів. Наразі Росія, схоже, прямує до стабільного майбутнього, проте на обрії назріває війна.\n"
 RUS_news.49.a: "Невже їм справді вдалося?"
 RUS_news.49.b: "Треба було повісити цього жидівського агітатора, коли мали нагоду."
 
 RUS_news.50.t: "[Get_newspaper_header]Республіка вогню і сталі"
 RUS_news.50.desc: "У події, що, ймовірно, стане однією з визначальних у XX столітті, президент Сєрґєй Бунячєнко возз'єднав Росію під владою нової республіки. Цей колишній український офіцер Червоної армії воював у Західноросійській війні під проводом колаборанта генерала Власова й допоміг Російській визвольній армії вирватися з-під влади німців до Самари. Відтоді злет Бунячєнка в РОА повторював її блискавичне піднесення над регіональними суперниками, аж поки він не став президентом нової республіки на її перших виборах.\n\nОстаточні задуми нового російського сильного лідера лишаються таємницею. Активно залучивши американські інвестиції під час швидкої індустріялізації, Бунячєнко тепер, схоже, орієнтується на інтереси Токіо. Його довгострокові амбіції невідомі, але короткострокові цілі знають усі: президент люто засудив дальшу німецьку присутність у Росії. Дивізії вже передислоковуються до західних рубежів.\n"
 RUS_news.50.a: "За честь Росії буде відомщено!"
 RUS_news.50.b: "Ці пси-дезертири ніколи не повернуться до Московії!"
 RUS_news.50.c: "Сильний лідер для нової Росії?"
 
 RUS_news.51.t: "[Get_newspaper_header]Тюремний цар усієї Руси"
 RUS_news.51.desc: "У найтемніші дні Західноросійської війни Німеччина спорядила армію відчайдухів, щоб прикрити відкриті фланги. Наприкінці війни призовники збунтувалися й зникли на сході біля Самари, а колишні господарі швидко про них забули. З Московії до колишніх допоміжних військ зрідка надходило спорядження, ціну кожного ящика якого визначав офіцер на ім'я Міхаїл Октан.\n\nТепер дрібний контрабандист став господарем Росії. Захопивши провід самарської фракції, Октан привів армію до берегів Тихого океану. Після великого походу за викорінення комунізму й слабкости Октан та його поплічники перебудували Російську Державу на жорстоку військову хунту, командири якої незбагненно багаті. Подейкують, що тепер він дивиться на захід і хоче зробити колишнім працедавцям нову пропозицію. Тим часом кайдани розбещеного фашистського режиму дедалі важче тиснуть на звичайних росіян.\n"
 RUS_news.51.a: "Нема коли спочивати на лаврах, хлопці!"
 RUS_news.51.b: "Ми створили цю армію покидьків, ми її й знищимо!"
 RUS_news.51.c: "На Росію впало ще одне страшне лихо!"
 
 RUS_news.52.t: "[Get_newspaper_header]Постання Російської Імперії"
 RUS_news.52.desc: "Здолавши останніх ворогів на вільній російській землі, народжене у Вятці царство з німецької експедиції закріпило владу над усією країною й готується долучитися до міжнародної спільноти.\n\nПолітика царського двору донедавна була майже невідома, але провідною партією відносно демократичної імперії є реформовані конституційні демократи на чолі з визначним радником Романом Ґулєм. Як лідер кадетів Ґуль відомий переконаний ліберал, і політологи вважають, що його вплив може зберегти помірковану політику й завадити піднесенню крайніх націоналістів. Наразі Його Імператорська Величність і прем'єр-міністр оголосили намір відновити відносини з рештою світу."
 RUS_news.52.a: "Попереду світле майбутнє."
 
 RUS_news.53.t: "[Get_newspaper_header]Постання Російської Імперії"
 RUS_news.53.desc: "Через пів століття Російська Імперія повернула принаймні тінь колишньої могутности. Після падіння імператорського уряду ніхто не міг уявити його повернення, але Друга світова війна й цілковитий крах СССР Бухаріна створили для цього умови. Дивно, що, попри всі зміни довкола, царська імперія зберегла первісні переконання й політику, прийнявши лише незначний поступ культурних і політичних ідей.\n\nДехто вважає її відсталою, однак очільник консервативного руху Васілій Шульґін, свідок подій 1917 року, запевнив народ, що імперія прагне стати військовим і технологічним гегемоном. Держави вже звертаються до Росії, сподіваючись налагодити добрі відносини з новою потугою."
 RUS_news.53.a: "Історія повторюється, еге ж?"
 
 RUS_news.54.t: "[Get_newspaper_header]Постання Російської Імперії"
 RUS_news.54.desc: "Спільне звернення царя Владіміра й прем'єр-міністра Солженіцина знаменує кінець російської доби воєначальників після десятиліть воєн і анархії. Коли останніх сибірських ворогів нібито знищено, перший за довгий час режим, що об'єднав країну, не здається таким крихким, як його місцеві й регіональні попередники.\n\nАвторитарні схильності нової монархічної держави не дивують. Солідаристи, яких вважають владною фракцією, не прагнуть повернення старої царської політики, але вірять у тверду державну владу, принаймні наразі. Демократичні процеси існують, і, попри звинувачення в шахрайстві та залякуванні виборців, населення справді підтримує тих, хто нарешті вивів його з хаосу й злиднів.\n"
 RUS_news.54.a: "Чи повернеться російська слава?"
 
 RUS_news.55.t: "[Get_newspaper_header]Постання Райху"
 RUS_news.55.desc: "Десятилітня боротьба за майбутнє Росії завершилася трагічно й майже іронічно. Арійське Братство, екстремістська організація родом із Пєрмі, панує над країною під залізною п'ятою, моторошно схожою на п'яту Третього Райху. Так званий «Фюрер» Ґутрум Ваґнер оголосив намір вести справжню арійську державу за принципами націонал-соціялізму.\n\nНімеччина поки відмовляється реагувати, але міжнародні спостерігачі можуть лише уявляти подив нацистської верхівки через бажання найненависнішої їм нації долучитися до панівної раси.\n"
 RUS_news.55.a: "Чи вистачить Европи на ще один Райх?"
 RUS_news.55.b: "Айн Фольк, Айн Райх, Айн Фюрер!"
 RUS_news.55.c: "Майн Ґотт."
 
 RUS_news.56.t: "[Get_newspaper_header]Північ пробуджується"
 RUS_news.56.desc: "Остання битва за об'єднання колишнього Совєцького Союзу завершилася значно тривожніше, ніж міг передбачити будь-який аналітик. Навіть після внутрішньої боротьби за владу Арійське Братство Пєрмі перемогло. Молода держава «Гіперборея» на чолі із загадковим верховним жерцем Вєліміром називає себе справжньою спадкоємицею давньої арійської цивілізації.\n\nПостання Гіпербореї викликало велике міжнародне занепокоєння. Залишається лише сподіватися, що божевільні заклики Вєліміра завоювати Німеччину, Палестину й інші «арійські батьківщини» є радше порожніми погрозами, ніж безумством.\n"
 RUS_news.56.a: "Росія в полоні божевільного."
 RUS_news.56.b: "Слава Пєруну!"
 RUS_news.56.c: "Майн Ґотт..."
 
 RUS_news.57.t: "[Get_newspaper_header]Демократія в Росії!"
 RUS_news.57.desc: "Немов із нізвідки надійшли новини про нову державу, яка возз'єднала Росію, хоча десять років тому це здавалося неможливим. Темна конячка, Російська Вільна Республіка, подолала всі випробування й перемогла радикалізм під проводом Союзу молодих реформістів та його нещодавно обраного лідера Константіна Катушева.\n\nРосійська Вільна Республіка, ліберальна демократія, була однією з небагатьох демократій Росії. Обіцяючи ліберальнішу соціальну політику й вільноринкову економіку, вона керує зовсім не так, як колишній Совєцький Союз. Хоча багато хто сумнівається, чи здатна Республіка принести демократію країні колишніх деспотів та екстремістів, вона цілком може стати новим осередком Холодної війни.\n"
 RUS_news.57.a: "Демократія в Росії? Щось новеньке."
 
 RUS_news.58.t: "[Get_newspaper_header]Свєтлана Сталіна об'єднує Росію!"
 RUS_news.58.desc: "«Період національного безладу завершився, у країні відновлено цивільне правління», - сказано в лаконічному комюніке уряду Російської Республіки. Коли останні барикади розбирають, а гармати стихають, переможницею постає не лише демократка, а й жінка. Свєтлана Сталіна, дочка грузинського більшовика, почала політичну кар'єру в Республіці Комі з метою створити нову Росію на чолі із сильною державою, здатною дбати про найбідніших і водночас нищити радикалів та реакціонерів.\n\nБурхливу республіку Комі багато хто вважав незначною, проте всупереч усьому її колись крихкий режим зміцнів у нову систему, де суверенна демократія здобула повну перемогу над суперниками й викувала суворий порядок у змучених степах колись дикого сходу. Хай би що чекало попереду, росіяни зустрінуть це разом, єдині та вільні.\n"
 RUS_news.58.a: "Нарешті вільні, Боже всемогутній, нарешті вільні."
 
 RUS_news.59.t: "[Get_newspaper_header]Свєтлана Сталіна об'єднує Росію!"
 RUS_news.59.desc: "Свєтлану Сталіну знають під багатьма іменами. Сталева пані. Цариця. Грузинка. А тепер і одноосібна володарка возз'єднаної Росії. Дочка грузинського більшовика почала свій похід як демократка, що прагнула здобути владу не кулею, а бюлетенем. Та під час її стрімкого злету радикальні фракції спробували знову скинути Росію в безодню. Вогонь кризи лише загартував її волю й викував незламну рішучість урятувати Росію від плюндрування радикалами та реакціонерами за будь-яку ціну.\n\nТепер Свєтлана Сталіна твердою рукою керує урядом відбудови за допомогою надзвичайних повноважень, призупинених виборів і слухняного парламенту. І хоча дехто називає це звичайною тиранією, ніхто не заперечить, що президентка нарешті поклала край довгому кошмару Росії.\n"
 RUS_news.59.a: "Краще за альтернативу."
 
 RUS_news.60.t: "[Get_newspaper_header]Демократія в Росії!"
 RUS_news.60.desc: "Сьогодні Росією пролунала переможна радіопередача: батьківщину об'єднала Російська Вільна Республіка. Колись уражена скандалами, чварами й екстремізмом, вона здавалася приреченою. Та нині демократія простяглася від Архангєльска до Камчатки, подолавши численні перешкоди на шляху до об'єднання.\n\nРеспублікою керує Народна демократично-соціялістична партія, поміркована ліва фракція президента Алєксандра Яковлєва, колишнього діяча Західноросійського революційного фронту. Багато хто досі сумнівається в стабільності республіки, але президент Яковлєв запевнив громадян, що екстремізм більше не загрожує Росії. Російська Вільна Республіка безсумнівно опиниться в центрі уваги трьох світових наддержав і стане новим осередком Холодної війни.\n"
 RUS_news.60.a: "Демократія в Росії? Щось новеньке."
 
 RUS_news.61.t: "[Get_newspaper_header]Відновлення СССР"
 RUS_news.61.desc: "Із тіней російської анархії постає новий лад. Країну возз'єднано під владою відновленої комуністичної держави, а очолює оновлену інституцію загадковий Міхаїл Суслов.\n\nМало хто може щиро сказати, що готують плани Суслова, крім відбудови країни й зміцнення влади. Совєцький шахіст поки тримає карти біля грудей, але ворогам Росії слід бути обережними. Мало хто з тих, хто став йому на шляху, дожив до розповіді, а вцілілі сходяться на одному: коли його задуми приведено в рух, ні Небо, ні Земля його не зупинять. Чи гарматами у відкритому полі, чи ножами в темряві, Росія знову стала силою, з якою слід рахуватися.\n"
 RUS_news.61.a: "Як не сила, то хитрість урятує Росію."
 
 RUS_news.62.t: "[Get_newspaper_header]Відновлення СССР"
 RUS_news.62.desc: "Після майже тридцяти років болю й приниження землі Росії знову об'єднано, а їхньою очевидною рятівницею стало знайоме обличчя. Свєтлана Бухаріна, дочка колишнього очільника Совєцького Союзу Ніколая Бухаріна, здолала всіх інших і повернула країну, яку її батько безуспішно намагався врятувати.\n\nОчоливши відновлену Совєцьку Росію, Бухаріна будує добрішу й справедливішу систему, яка, за її переконанням, справді втілить бачення старого Союзу. Сучасники хвалять її запал, харизму й душевність, та дехто згадує слід трупів, залишений об'єднавчим походом, і міркує, чи встоїть її ідеалізм, особливо тепер, коли вона дивиться на захід, до Москви.\n"
 RUS_news.62.a: "Чи навчиться вона на батькових помилках?"
 
 RUS_news.63.t: "[Get_newspaper_header]Совєцька Федерація об'єднує Росію!"
 RUS_news.63.desc: "Росія довго перебувала у відсталому стані чвар і влади воєначальників, але сьогодні цьому настав кінець: Андрєй Жданов проголосив утворення Совєцької Федерації.\n\nПопри службу міністром закордонних справ старого режиму Бухаріна, Жданов обстоював потребу нової Росії, звідси й нова назва. Виступаючи у Вєрховному Совєті в місті [KOM.Capital.GetName], самопроголошений «верховний лідер» закликав усіх росіян «об'єднатися під стягом федерації й сміливо рушити вперед, у майбутнє». Він також підтримав науки, звеличуючи технологічний поступ і потребу в «сміливих, рішучих діях задля піднесення людства до міжзоряної раси».\n"
 RUS_news.63.a: "Невже майбутнє вже настало?"
 
 RUS_news.64.t: "[Get_newspaper_header]Вікно в Євразію"
 RUS_news.64.desc: "Майже через тридцять років після поразки від держав Осі Росія знову об'єднана - принаймні так спершу подумав світ. Нова держава не називає себе «Росією», а свій народ «росіянами». Натомість її лідер Лєв Ґумільов, так званий «Провідник пасіонарної революції», назвав державу «Євразією», де росіяни є лише одним із багатьох «етносів».\n\nХоч би як вона звалася, нова євразійська держава, за повідомленнями, жорстко організована, суворо стратифікована й схильна до крайнього насильства. Невідомо, як сусіди, передусім Німеччина та Японія, впораються з такою стрімко войовничою потугою біля своїх кордонів.\n"
 RUS_news.64.a: "Ще один «Бич Божий»?"
 RUS_news.64.b: "Світло, що пробивається з іншого світу."
 
 RUS_news.65.t: "[Get_newspaper_header]Російська національна диктатура"
 RUS_news.65.desc: "Президент Російської Вільної Республіки Іґорь Шафарєвіч оголосив перемогу в справі припинення російської анархії та возз'єднання батьківщини під одним стягом. У кожному великому місті видно радісні натовпи й маршових солдатів, а в селах п'яні ополченці шкандибають вулицями, розмахуючи стягом нового союзу.\n\nПолітичне майбутнє Росії тепер визначає ідеологія співчутливого консерватизму, суміш радикального російського націоналізму й традиціоналізму, яку критики засуджують за шовіністичні та криптофашистські схильності. Безсумнівно одне: відновлення російської держави докорінно змінить рівновагу в Євразії, адже російський лідер без вагань засудив німецьку гегемонію у Східній Европі й Сполучені Штати за те, що «в найтемнішу годину кинули Росію на поталу нацистським катам».\n"
 RUS_news.65.a: "Коли вдивляєшся в безодню..."
 
 RUS_news.66.t: "[Get_newspaper_header]Тріюмф ордосоціялізму"
 RUS_news.66.desc: "Упродовж років міжнародні оглядачі й історики відзначали різкий вплив тріюмфу Райху в 1940-х на світові ідеали. Перемога націонал-соціялізму назавжди змінила світ, і найвиразніше ця похмура метаморфоза проступає на землях Росії. Ордосоціялістична робітнича партія, що походить із нині зниклої Республіки Комі, возз'єднала розбиті держави воєначальників під пильним оком генерального секретаря Івана Сєрова.\n\nОрдосоціялізм проголошує себе наступним етапом соціялістичної думки й, схоже, поєднує марксизм із радикальним націоналізмом та ксенофобією. Присягнувши боротися із «спадковими реакціонерами» всюди й «поширювати ордосоціялістичну революцію», Російська Національна Совєцька Республіка готова стати могутнім гравцем світової політики, і світ тремтить від цієї думки.\n"
 RUS_news.66.a: "Клас і нація."
 
 RUS_news.67.t: "[Get_newspaper_header]Свята Російська Імперія"
 RUS_news.67.desc: "Від самого краху СССР дехто припускав, що повернення монархізму до Росії неминуче. Та ніхто не міг чекати, що він набуде такої форми.\n\nСєрґєй Таборіцкій, самопроголошений «Благословенний Регент усієї Росії», завоював верховну владу й створив єдиний уряд: регентство давно померлого цесаревича Алєксєя Романова, сина Ніколая II. Регент широко пропагує твердження, що Алєксєй досі живий, однак воно нічим не підтверджене.\n\nНова Російська Імперія, за повідомленнями, є справжнім кошмаром: істинне самодержавство в російській традиції, поєднане з расизмом і тоталітарними методами націонал-соціялізму. Боже, спаси Росію, бо більше нікому.\n"
 RUS_news.67.a: "Слава кошмару!"
 
 RUS_news.68.t: "[Get_newspaper_header]Союз сталі"
 RUS_news.68.desc: "Після довгих років панування воєначальників розбиті землі Росії знову об'єднано під червоним стягом: колишній опальний суперник Бухаріна, а нині генеральний секретар всеросійської Комуністичної партії Лазарь Каґановіч під оплески присутніх проголосив відновлення Союзу Совєцьких Соціялістичних Республік.\n\nХоч відновлення совєцької влади не стало несподіванкою, новий Совєцький Союз обрав відмінний від попереднього уряду курс - масову централізацію та всебічну мобілізацію ресурсів для вирішального конфлікту. «Ні кроку назад, - сказав Каґановіч у недавній промові. - Або ми подолаємо труднощі й вистоїмо проти фашистської загрози, або вороги зметуть нас»."
 RUS_news.68.a: "Сталінське бачення Росії досі живе!"
 
 RUS_news.69.t: "[Get_newspaper_header]Нова Російська Республіка"
 RUS_news.69.desc: "Ще від часів Пєтра Великого Свєрдловск був стрижнем, що забезпечував зручний перехід через Урал і сполучав дві різні половини Росії. Тепер так звані «ворота до Азії» зробили саме це, але значно буквальніше.\n\nНовий російський уряд на чолі з президентом Борісом Єльциним проголосив відданість демократичним цінностям та ідеалам свободи, хоча досі тримається на крихкій рівновазі між ліберальними прихильниками президента й високопоставленими генералами Червоної армії у верхівці республіки. Попри розбіжності, усі сили молодої демократії єдині в прагненні побудувати сильну й незалежну Росію та спільно протистояти німецькій владі на рідних російських землях."
 RUS_news.69.a: "Хто міг уявити демократичну Росію?"
 
 RUS_news.70.t: "[Get_newspaper_header]Генерал Батов об'єднує Росію!"
 RUS_news.70.desc: "Ще від часів Пєтра Великого Свєрдловск був стрижнем, що забезпечував зручний перехід через Урал і сполучав дві різні половини Росії. Тепер так звані «ворота до Азії» зробили саме це, але значно буквальніше.\n\nЗ нової урядової резиденції у Свєрдловску маршал Павєл Батов проголосив Російський Народний Союз перед тисячами радісних людей. Батов прагне продовжити славні традиції покійного наставника й близького друга Константіна Рокоссовского. У промові він заявив, що Червона армія існує не лише для захисту російського народу, а й для служіння йому та проводу крізь бурхливі часи, звідси й назва. Мільйони росіян досі перебувають під німецькою окупацією, тож лише час покаже майбутнє Народного Союзу.\n"
 RUS_news.70.a: "Хай живе маршал!"
 RUS_news.70.b: "Я гадав, Червона армія комуністична?"
 RUS_news.70.c: "Росія знайшла свого Цезаря."
 
 RUS_news.71.t: "[Get_newspaper_header]Чорна Ліга крокує далі"
 RUS_news.71.desc: "Менш ніж за пів століття Росія двічі впала перед німецькими загарбниками. Та сьогодні, коли Дмітрій Тімофєєвіч Язов вийшов на сцену в Омску перед десятками тисяч людей, послання возз'єднаної держави світові пролунало в скандуванні російських солдатів: «Ніколи знову». Язов пройшов довгий і бурхливий шлях, і тепер мільйони росіян величають його главковерхом - верховним головнокомандувачем.\n\nПісля смерти наставника Дмітрія Карбишева Язов безжально насаджував Росії своє дарвіністське бачення. Майбутні плани держави невідомі, але її цілі легко збагнути з нової назви режиму - Російський уряд національного відродження. Від Чукотки до Волги земля тремтить, а небеса гримлять від тупоту чобіт і гуркоту барабанів. Над Росією нависла чорна тінь.\n"
 RUS_news.71.a: "Ліхтарі гаснуть по всій Євразії, і за нашого життя ми вже не побачимо їх запаленими."
 RUS_news.71.b: "Велике Випробування чекає!"
 RUS_news.71.c: "Якщо вони хочуть війни, то дістануть тотальну війну!"
 
 RUS_news.72.t: "[Get_newspaper_header]Новий Союз"
 RUS_news.72.desc: "Після довгих років панування воєначальників розбиті землі Росії знову об'єднано під червоним стягом: колишній протеже Лазаря Каґановіча, а нині беззаперечний правитель вільної Росії Нікіта Хрущов під оплески присутніх проголосив відновлення Союзу Совєцьких Соціялістичних Республік.\n\nПолітичні прагнення нового генерального секретаря лишаються загадкою для міжнародних спостерігачів. Він оголосив відданість спадщині покійного Іосіфа Сталіна й не відхилився від тоталітарного курсу колишніх зверхників, однак його правління відзначається гнучкістю у внутрішніх та зовнішніх справах. Хоч потрясіння минулого сильно її послабили, нова совєцька влада з часом зможе знову кинути виклик німецькому пануванню."
 RUS_news.72.a: "Сталінське бачення Росії досі живе!"
 
 RUS_news.73.t: "[Get_newspaper_header]Королівство Сибір об'єднує Росію!"
 RUS_news.73.desc: "Сьогодні світ сколихнули приголомшливі новини: розбита Росія, схоже, нарешті знову стала цілою. Прихильники [GetRurikStatus] здобули перемогу після масштабного конфлікту з урядом-суперником на заході.\n\nНа честь знаменної події в місті [KEM.Capital.GetName] провели військовий парад, а [GetHeirStatus] виголосив переможну промову. Майбутнє Росії під владою цього химерного режиму поки неясне.\n"
 RUS_news.73.a: "Хай живе король Рюрик II!"
 RUS_news.73.b: "Як дивно."
 RUS_news.73.c: "Пильнуймо цих божевільних..."
 
 RUS_news.74.t: "[Get_newspaper_header]Королівство Сибір об'єднує Росію!"
 RUS_news.74.desc: "Сьогодні світ сколихнули приголомшливі новини: розбита Росія, схоже, нарешті знову стала цілою. Прихильники [GetRurikStatus] здобули перемогу після масштабного конфлікту з урядом-суперником на заході.\n\nНа честь величного звершення в місті Вятка провели великий військовий парад, а тоді [GetHeirStatus] виголосив промову. Наслідки перемоги цього дивного режиму неясні, як і його плани щодо сусідніх німецьких колоній."
 RUS_news.74.a: "Хай живе король Рюрик II!"
 RUS_news.74.b: "Як дивно."
 RUS_news.74.c: "Хай ці божевільні тримаються подалі!"
 
 RUS_news.75.t: "[Get_newspaper_header]Російська Співдружність"
 RUS_news.75.desc: "З усіх томських мрійників Гуманістичне товариство прагнуло чи не найамбітнішого майбутнього: справжньої демократії, де робітників звільнено від царя, більшовиків і буржуазії, - справді вільної Росії.\n\nУ межах змінної конституційної системи Томска Гуманісти уславилися невтомним захистом простого народу й мирного переходу до соціялізму. Ліві критики глузували з них як з утопічних соціялістів минулої доби, праві звинувачували у принесенні анархії молодій республіці, але лідери Шостаковіч і Вайнбєрґ невпинно захищали права робітників, розширювали освіту й будували сучасну народну армію. Сотні тисяч людей мають попрощатися з родинами й рушити на захід, щоб битися за свободу й справедливість. Мрію Гуманістичного товариства про справді вільну Росію здійснено.\n"
 RUS_news.75.a: "Свобода, равєнство, братство!"
 RUS_news.75.b: "Російський народ нарешті знайшов демократію."
 RUS_news.75.c: "Хай хоч один жид утече..."
 
 RUS_news.76.t: "[Get_newspaper_header]Російська Республіка повертається!"
 RUS_news.76.desc: "З усіх рухів Томска жоден не висміювали так, як Бастилярдський салон. Група «Трійця» була відома не зворушливим мистецтвом чи натхненним баченням нової Росії, а дивними, моторошними й сюрреалістичними виставами, похмурим образом індустріяльного й суворо впорядкованого суспільства та параноєю щодо загибелі республіки, яку багато членів від початку вважали приреченою впасти перед популістськими хвилями.\n\nТепер Бастилярдським товариством захоплюються за визначну роль у воскресінні Росії. Під проводом президента Данііла Хармса Російська Республіка має квітучу економіку. Її народ невпинно працює, відбудовуючи країну, яку вкрали чужоземні загарбники. На кордоні з Айнхайтспактом тренуються вояки Республіканської армії. Щоб республіка жила, всі зовнішні загрози треба усунути. Тепер Данііл Хармс має повести народ до давно бажаного фіналу: визволення всіх росіян від чужоземної тиранії.\n"
 RUS_news.76.a: "Жертвам настає кінець."
 RUS_news.76.b: "Яка відданість. Невже вони справді визволять захід?"
 RUS_news.76.c: "Їхні абсурдні мрії добігають кінця."
 
 RUS_news.77.t: "[Get_newspaper_header]Російська Республіка повертається!"
 RUS_news.77.desc: "Колись із томських митців і вчених глузували за ідеалізм. Зрештою, які приклади російської демократії бачив світ? Невдачі Кєрєнского й Пастєрнака нібито доводили, що жодна республіка в Росії не встоїть.\n\nТепер скептики мовчать. Дивна змінна конституційна система Томска простяглася від Тихого океану до порога Райху. Там, де панували війна і злидні, Модерністи та їхній президент Андрєй Сахаров наважилися будувати школи й сучасну промисловість. Республіканська армія, колись безладне ополчення, виставила сучасне спорядження вздовж кордону з Айнхайтспактом. Її генерали, ветерани багатьох кампаній, належать до найкращих фахівців технократичної республіки. Тепер Модерністи пропонують принести Райху й усім ворогам російського народу свою досконалу науку війни.\n"
 RUS_news.77.a: "Поступ не спинити!"
 RUS_news.77.b: "Невже перо могутніше за меч?"
 RUS_news.77.c: "Ці унтерменші нічого нас не навчать!"
 
 RUS_news.78.t: "[Get_newspaper_header]Нова Російська Федерація!"
 RUS_news.78.desc: "Спершу несподівано перемігши в боротьбі за Центральносибірську Республіку, томська ідеалістична республіка поетів, науковців і вчених знову спростувала світові прогнози й пережила всіх суперників на шляху до об'єднання Росії.\n\nПід проводом президента Дмітрія Ліхачєва та його декабристської фракції змінна конституція чудної республіки дала новій Російській Федерації уряд на перетині старого й нового. Декабристський салон із вільною класично-ліберальною економікою під суворими природоохоронними законами прагне зміцнити зв'язки між старою сільською Росією та сучасними промисловими містами. Переможна армія республіки звертає на захід, шукаючи нових друзів і кидаючи виклик давнім ворогам заради визволення всіх росіян.\n"
 RUS_news.78.a: "Це століття приниження добігає кінця!"
 RUS_news.78.b: "Демократія в Росії?"
 RUS_news.78.c: "Вони мали б краще знати, ніж довіряти слов'янській черні!"
 
 RUS_news.79.t: "[Get_newspaper_header]Сибірська Чорна Армія об'єднує Росію!"
 RUS_news.79.desc: "У добу воєначальників Росія випробувала майже всі уряди й ідеології під сонцем, але тепер усіх суперників здолав несподіваний претендент: анархізм.\n\nПочавши як неорганізоване ополчення в сибірській глушині, Сибірська Чорна Армія міцніла й зростала, перемагаючи всіх, хто зазіхав на свободу її народу, й тепер править землями від Онєґи до Камчатки.\n\nОднак керування такою великою країною має труднощі, й Чорна Армія мусила відігравати дедалі більшу роль в управлінні, часто коштом проголошених принципів рівности й самовизначення. Попри це, вона готова захищати російський народ від ворогів і зберігати країну єдиною.\n"
 RUS_news.79.a: "Смерть усім, хто стоїть на шляху робітників."
 
 RUS_news.80.t: "[Get_newspaper_header]Єдина нація під анархією"
 RUS_news.80.desc: "У добу воєначальників Росія випробувала майже всі уряди й ідеології під сонцем, але тепер усіх суперників здолав несподіваний претендент: анархізм.\n\nПочавши як неорганізоване ополчення в сибірській глушині, Сибірська Чорна Армія міцніла й зростала, перемагаючи всіх, хто зазіхав на свободу її народу, й тепер править землями від Онєґи до Камчатки.\n\nБільшість оглядачів не вірили, що анархістський уряд принесе Росії стабільність, а тим паче керуватиме землями на двох континентах. Та Сибірська Чорна Армія не лише принесла мир, а й лишилася вірною принципам. Російська Вільна Територія є справді рівноправним суспільством, де селяни й робітники належать самі собі, вільні від усіх обмежень і захищені Чорною Армією.\n"
 RUS_news.80.a: "Схоже, Мама Анархія любить своїх синів."
 
 RUS_news.81.t: "[Get_newspaper_header]Повернення Союзу"
 RUS_news.81.desc: "Після катастрофічної поразки від Райху під час війни всі вважали, що Совєцький Союз не має надії. Сьогодні це припущення рішуче спростовано: колишня Президія Вєрховного Совєту успішно відвоювала колишню Російську СФСР.\n\nКПСС, пряма спадкоємиця адміністрації Бухаріна, оголосила намір продовжувати його спадщину у відродженому Совєцькому Союзі. Іноземні інвестори можуть сподіватися на соціялістичну ринкову економіку за зразком Нової економічної політики Лєніна й Бухаріна, поки країна починає відбудову батьківщини. Генеральний секретар [IRK.GetLeader] кинув кілька формальних слів у переможній промові й поступився трибуною іншим партійним лідерам.\n"
 RUS_news.81.a: "Схоже, Росія знову в СССР."
 RUS_news.81.b: "Хай живе Совєцький Союз!"
 
 RUS_news.82.t: "[Get_newspaper_header]Відроджений Союз"
 RUS_news.82.desc: "Довга боротьба за Росію завершується: один претендент завоював усю країну. Як і можна було чекати, нова Росія стала відродженим Совєцьким Союзом, що постав із прямого наступника старого. Новий Союз, яким твердою рукою керує колишній таємний поліціянт Ґєнріх Яґода, відрізняється значно могутнішою таємною поліцією й значно слабшим втручанням держави в економіку.\n\nЯґода захищає це як ініціятиву економічного розвитку, але політика викликала сильну критику міжнародних лівих, що остерігаються ревізіонізму. Якщо колишній діяч НКВД правильно розіграє карти, його Совєцький Союз може повернути місце економічної потуги, хоча питань досі багато.\n"
 RUS_news.82.a: "Чи потрібна революції залізна рука?"
 
 RUS_news.83.t: "[Get_newspaper_header]Нова російська революція"
 RUS_news.83.desc: "Уперше за майже 30 років над північчю сходить червона зірка. Генеральний секретар Валєрій Саблін офіційно оголосив світові відродження Союзу Совєцьких Соціялістичних Республік. Російська анархія, яку вже вважали новим статус-кво, скінчилася після низки кривавих воєн і важких дипломатичних угод, що їх дехто називає новою російською революцією. Кліка Сабліна починала як повстання проти тимчасового прем'єра Ґєнріха Яґоди, а обіцянки нового уряду про стабільність і мир принесли народну підтримку.\n\nТемна конячка перегонів за об'єднання, Валєрій Саблін має переконання, що здаються майже непридатними для російської анархії. За його лібертарної форми лєнінізму росіяни мають значно ширші політичні свободи. Совєцький ведмідь прокинувся, і світ нетерпляче чекає його реву.\n"
 RUS_news.83.a: "Надія ще може вижити."
 
 RUS_news.84.t: "[Get_newspaper_header]Нова російська революція"
 RUS_news.84.desc: "Уперше за майже 30 років над північчю сходить червона зірка. Генеральний секретар Валєрій Саблін офіційно оголосив світові відродження СССР. Російська анархія скінчилася після низки кривавих воєн і важких дипломатичних угод, що їх дехто називає новою російською революцією. Кліка Сабліна починала як повстання проти тимчасового прем'єра Ґєнріха Яґоди, а обіцянки нового уряду про стабільність і мир принесли народну підтримку.\n\nТемна конячка перегонів за об'єднання, Саблін уособлює справжню трагедію російської анархії. Спершу він сповідував ідеалістичну лібертарну форму лєнінізму, але, схоже, обрав шлях свого кумира й придушив політичне інакодумство, хоча народ загалом його підтримує. Коли нова держава дивиться на захід, світ міркує, чи піде Саблін шляхом пращурів, навіть якщо той приведе його до загибелі.\n"
 RUS_news.84.a: "Привид блукає Европою..."
 
 RUS_news.85.t: "[Get_newspaper_header]Постання Російської Національної Республіки"
 RUS_news.85.desc: "Хаос, що десятиліттями поглинав Росію, стихає до тривожного спокою: уперше від краху Совєцького Союзу один уряд повернув усю країну. Та ця держава нажахала б Лєніна: відколота гілка Россійской Фашистской Партії під проводом бунтівника Міхаїла Матковского стала остаточною переможницею боротьби за возз'єднання. Так званий Вождь усіляко відмежовується від догматиків Германії, називаючи себе авторитарним модернізатором і рідкісним поміркованим серед фанатиків. Принаймні таким він себе подає.\n\nПрагматизм Матковского приніс йому певну популярність за кордоном, особливо у Вашинґтоні, чиє зовнішньополітичне керівництво бачить у ньому взірцевого клієнта. Чимало фахівців скептичніші й твердять, що новий Вождь рано чи пізно покаже справжнє обличчя.\n"
 RUS_news.85.a: "Ще одна країна впала в деспотизм."
 RUS_news.85.b: "Що один «Вождь», що інший - нам байдуже."
 RUS_news.85.c: "Слава єдиному справжньому Вождеві!"
 RUS_news.85.d: "Цінний союзник чи вовк в овечій шкурі?"
 
 RUS_news.86.t: "[Get_newspaper_header]Російська Національна Республіка об'єднує Росію!"
 RUS_news.86.desc: "Коли Росія вперше розширювалася Азією, поселенці й солдати крокували на схід від Москви до Тихого океану. Сьогодні Росію знову проголошено єдиною, але напрям змінився.\n\nУ далекосхідному портовому Маґадані президент Сибірської Національної Республіки Ніколай Пєтлін оголосив офіційне перейменування держави на Російську Національну Республіку, щоб краще відобразити беззаперечні права уряду на спадщину загиблої совєцької держави. Колись Пєтлін був міністром в уряді Міхаїла Матковского, очільника відколу Россійской Фашистской Партії, але повалив його й виявився значно прихильнішим до ОВН та інших демократичних груп. Чи збереже він цей курс і саму владу, ще невідомо.\n"
 RUS_news.86.a: "Можливо, на російську демократію все-таки є надія."
 RUS_news.86.b: "З обох боків нас оточили американські шавки..."
 RUS_news.86.c: "Росія єдина й неподільна!"
 RUS_news.86.d: "Раз уже переміг здоровий глузд."
 
 RUS_news.87.t: "[Get_newspaper_header]Повернення Імперії"
 RUS_news.87.desc: "Сьогодні з Росії надійшли приголомшливі новини: прем'єр-міністр так званої Російської Імперії зробив офіційну заяву. Анатолій Собчак, очільник цивільного уряду відновленої імперії, підтвердив возз'єднання всієї Росії в ім'я царя Міхаїла II, який стояв поруч із ним.\n\nУривчасті свідчення й неповні звіти дали фахівцям змогу встановити, що Собчак та його адміністрація походять із вигнаного Білого руху, спершу осілого в Харбіні. Попри сумнівну легітимність Міхаїла II через морганатичний шлюб його батьків, ще до заяви Собчака цар неодноразово виступав публічно й обіцяв твердо протистояти нацистській Німеччині. Багато хто святкує повернення Романових та імперського ладу, інші глузують із походження Міхаїла. Лише час покаже долю нової адміністрації.\n"
 RUS_news.87.a: "Більш ніж унікальний поворот подій."
 RUS_news.87.b: "Боже, царя храни!"
 RUS_news.87.c: "Ще один Романов?"
 RUS_news.87.d: "Доведеться діяти обережно, щоб зберегти наше становище в Росії."
 
 RUS_news.88.t: "[Get_newspaper_header]Об'єднання Росії"
 RUS_news.88.desc: "Довга темна тінь Константіна Родзаєвского та його далекосхідної Россійской Фашистской Партії, схоже, простяглася ще далі. Сьогодні у великій промові з балкона парламенту в Усть-Сисольску так званий «Вождь Росії» оголосив про возз'єднання країни. На тлі жахливих повідомлень про звірства проти російських жидів влада Родзаєвского над державою, очевидно, вже закріпилася.\n\nХимерна теза РФП про майбутнє Росії стала жахливою дійсністю, коли сили Родзаєвского ринули на захід. У промові про об'єднання він також люто ненавидів «підступних німців», заявивши, що ті не спромоглися створити націонал-соціялістичне суспільство, й закликав «усіх справжніх росіян» служити в майбутній війні між двома фашистськими урядами. Майбутнє нової «Російської Національної Держави» покаже лише час.\n"
 RUS_news.88.a: "Світ темнішає далі."
 RUS_news.88.b: "А це ще хто?"
 RUS_news.88.c: "Слава єдиному справжньому Вождеві!"
 
 RUS_news.89.t: "[Get_newspaper_header]Божественна Росія"
 RUS_news.89.desc: "Церкви Росії співають хвалебні гімни, поки Боже царство в Росії огортає розбиту батьківщину й знову об'єднує її різні народи. Почавши як селянське повстання на Далекому Сході, Царство приголомшило міжнародних оглядачів своїм злетом, єдиною очевидною причиною якого є неофіційний лідер Алєксандр Мєнь.\n\nМєнь організував державу майже анархічно, і його ідеологія парадоксальна. Він побожний християнин і проповідник, а його держава, схоже, однаково терпима до всіх релігійних та етнічних меншин. Вона надзвичайно ізоляціоністська й досі не встановила дипломатичних зв'язків, тож багато хто міркує, як нова Росія змінить рівновагу Холодної війни.\n"
 RUS_news.89.a: "Дивний поворот для Росії."
 RUS_news.89.b: "Вони не наважаться кинути нам виклик!"
 RUS_news.89.c: "Хвала Господу!"

 RUS_news.90.t: "[Get_newspaper_header]Федерація об'єднує Росію!"
 RUS_news.90.desc: "Перемігши в боротьбі за владу після краху Центральносибірської Республіки, Федерація Новосибірска й Алтаю поширилася на всю Росію, інтегруючи або знищуючи всіх противників.\n\nУ новоствореній Російській Федерації панують місцеві можновладці, однойменні «силовики», що керують у співпраці з корпораціями. Президент Покришкін, який ледве відбив виклик Васілія Шукшина, зберігає відданість ідеалові неідеологічної держави, об'єднаної прагненням стабільности й процвітання. Федерація дивиться на захід, шукаючи нових друзів і кидаючи виклик давнім ворогам заради визволення всіх росіян.\n"
 RUS_news.90.a: "Тривожні новини."
 RUS_news.90.b: "Сильні й стабільні!"
 RUS_news.90.c: "Росія й сильні правителі - знайоме поєднання."

 RUS_news.91.t: "[Get_newspaper_header]Федерація об'єднує Росію!"
 RUS_news.91.desc: "Перемігши в боротьбі за владу після краху Центральносибірської Республіки, Федерація Новосибірска й Алтаю поширилася на всю Росію, інтегруючи або знищуючи всіх суперників.\n\nКолись у ній панували місцеві можновладці, однойменні «силовики», у співпраці з корпораціями, однак після обрання Васілія Шукшина новостворена Російська Федерація, схоже, почала нову сторінку. Політика екологізму, антикорпоратизму й ширшої демократичної участи президента Шукшина означає відхід від поширених корупції та цинізму. Федерація дивиться на захід, шукаючи нових друзів і кидаючи виклик давнім ворогам заради визволення всіх росіян.\n"
 RUS_news.91.a: "Тривожні новини."
 RUS_news.91.b: "Єдині й вільні!"
 RUS_news.91.c: "Демократична Росія?"

 RUS_news.92.t: "[Get_newspaper_header]Найманська Росія?"
 RUS_news.92.desc: "Мітчелл Вербелл III оголосив про створення своїх Сполучених Штатів Росії, що американські міжнародні видання називають приголомшливим поворотом, а німецькі державні ЗМІ - «американською змовою».\n\nАмериканський громадянин Вербелл спочатку прибув до портового Маґадана як найманець. У ході того, що він описує лише як «шалену поїздку», Вербелл пронісся на захід і об'єднав частини Росії, вільні від німецького чобота.\n\nДо Вербелла стікалися загони найманців, а він перетворив їхню силу на економічний ресурс, продаючи солдатів тому, хто більше заплатить, у зонах конфліктів усього світу. Міжнародна спільнота завмерла, очікуючи, як цей найманець триматиме державні віжки.\n"
 RUS_news.92.a: "Він клята американська маріонетка!"
 RUS_news.92.b: "З'єднайте мене з Вашинґтоном!"
 RUS_news.92.c: "Він це зробив. Цей божевільний покидьок це зробив."
 RUS_news.92.d: "Мабуть, нам це сниться..."
 RUS_news.92.e: "Час багатіти."

 RUS_news.93.t: "[Get_newspaper_header]Революційний совєт об'єднав Росію!"
 RUS_news.93.desc: "Від сьогодні держава, колись знана як Народно-революційний совєт, возз'єднала російські землі під своєю владою й прийняла назву Союзу Совєцьких Соціялістичних Республік. Вона походить із загонів Червоної армії під командуванням Алєксандра Васілєвского, вигнаних до степів Туви й Монґолії, які після тяжких боїв успішно повернулися до Росії та здолали всіх противників.\n\nПопри безсумнівну вірність соціялізму в усіх випробуваннях, деякі соціялістичні лідери світу вагаються приймати їх через дивний військовий уряд і незвично демократичні вибори офіцерів. Однак мало хто заперечить, що Росія міцно в їхніх руках, а вони стоять біля воріт Райху й готові показати міць нового, вдосконаленого Союзу.\n"
 RUS_news.93.a: "Хай живе народна революція!"
 RUS_news.93.b: "Тривожно, але хай так."
 RUS_news.93.c: "Демократичні вибори, кажете?"
 RUS_news.93.d: "Червона армія нарешті вдома."

#Kazakhstan World Events#

 KAZ_WORLD.1.t: "[Get_newspaper_header]Хаос на XII з'їзді партії Казахстану"
 KAZ_WORLD.1.desc: "Історично партійний з'їзд Казахстану був лише формальним схваленням політики бюро. Натомість на дванадцятому з'їзді запанував хаос: антипартійна фракція безуспішно спробувала усунути чинного першого секретаря.\n\nПерший секретар Кунаєв зміцнив владу у власній опорі. Однак, щоб утриматися й уникнути усунення, він, схоже, поклався на націонал-комуністів, яких за попередньої адміністрації ізолювали й відсували вбік. Хай би що чекало Казахстан, очевидно, він помітно відійде від марксистсько-лєнінського минулого."
 KAZ_WORLD.1.a: "Спадкоємець Шаяхмєтова посідає своє місце."

 KAZ_WORLD.2.t: "[Get_newspaper_header]Кунаєва усунуто з посади голови партії Казахстану"
 KAZ_WORLD.2.desc: "За несподіваним поворотом подій Дінмухамєда Кунаєва усунуто з посади першого секретаря Комуністичної партії Казахстану після осуду низки високопосадовців, зокрема його наставника. Після короткої прощальної промови перший секретар без церемоній пішов у відставку, назвавши головними причинами свої невдачі в аграрній політиці й національній безпеці.\n\nПосаду першого секретаря перебрав уйгурський партійний керівник Ісмаїл Юсупов. Він майже невідомий, і багато хто очікує, що його влада буде значно слабшою за обох попередників. Він уже оголосив плани «перебудувати аграрне виробництво Казахстану» - політику, що балансує між казахською та російською громадами."
 KAZ_WORLD.2.a: "Людина, не гідна свого крісла."
 
 KAZ_WORLD.3.t: "[Get_newspaper_header]НКВД повалює уряд Казахстану"
 KAZ_WORLD.3.desc: "Рутинне засідання завершилося приголомшливо: місцеве НКВД втрутилося у XII з'їзд КПК, пославшись на неспроможність попередньої адміністрації захистити країну від антикомуністичного бандитизму. Російського начальника НКВД Павла Фітіна, давнього союзника Шаяхмєтова, силою обставин поставлено першим секретарем.\n\nБезпрецедентний розвиток подій викликав гострі протести казахських студентів та інтелектуалів по всій країні. Та військо й поліція явно підтримують Фітіна, тому швидкий успіх опору малоймовірний. Наразі Фітін зосереджується на цілях для Казахстану: мирі, національній безпеці та відновленні зв'язку з великим СССР."
 KAZ_WORLD.3.a: "Казахстан знову став територією."

 KAZ_WORLD.4.t: "[Get_newspaper_header]Кунаєв оголошує конституційну реформу"
 KAZ_WORLD.4.desc: "Новий напрям Казахстану тепер зрозумілий. Попри попередні протилежні заяви, перший секретар Кунаєв оголосив, що партія обговорить можливі зміни до конституції. Це безпрецедентний крок, адже зазвичай конституційні реформи відбуваються лише у відповідь на зміни у великому СССР.\n\nОголошення стало великою перемогою Жумабєка Ташєнєва та його фракції, які останні два роки дедалі більше керували урядом. Проте російські громади вже відмовляються брати участь у зміні конституції, посилаючись на совєцький прецедент. Сам Кунаєв незвично мовчазний і, схоже, не хоче або не може рішучіше втрутитися."
 KAZ_WORLD.4.a: "Казахстан знаходить власний шлях."

 KAZ_WORLD.5.t: "[Get_newspaper_header]Першого секретаря Юсупова вбито!"
 KAZ_WORLD.5.desc: "Від Західноросійської війни Центральну Азію вважали оазою стабільности в хаотичній постсовєцькій Євразії. Та сьогодні перший секретар Юсупов лежить мертвий, і хаос нарешті рушив на південь. Казахстан, чи не наймогутніша з уцілілих держав регіону, може цього не пережити.\n\nЮсупов був непопулярний, та його смерть сколихнула країну. Оскільки винуватця не знайдено, місцеві казахські й російські керівники звинувачують одне одного, занурюючи Комуністичну партію у відвертий безлад. Обидві сторони не приймають лідера суперників, тож погодилися на компромісного Станіслава Скшешевского, важливого, але політично ізольованого провідника польської громади. Мало хто покладає на його уряд великі надії."
 KAZ_WORLD.5.a: "Надії більше немає."
 
 KAZ_WORLD.6.t: "[Get_newspaper_header]Фітін проводить чистку «кліки Алмаґамбєтова»"
 KAZ_WORLD.6.desc: "Павєл Фітін роками називав себе передусім совєцькою людиною, вищою за культурні межі. Та сьогодні він почав заарештовувати провідних казахських, татарських та інших мусульманських чиновників за «націоналістичні відхилення». Серед помітних постатей - голова Президії Ісмаїл Юсупов і заступник НКВД Нурулла Алмаґамбєтов.\n\nМало хто з аналітиків чекав такого результату, але більшість погоджується: цей крок означає значний поворот до російських націоналістів у його фракції. Коли казахів відсунули до місцевих партій і війська, багато хто боїться, що це ще один крок до цілковитого російського панування в Казахстані."
 KAZ_WORLD.6.a: "Казахстан знову став провінцією."
  
 KAZ_WORLD.7.t: "[Get_newspaper_header]Голова Кунаєв іде у відставку"
 KAZ_WORLD.7.desc: "Казахстан розколовся після відставки свого лідера, голови Дінмухамєда «Дімаша» Кунаєва, на тлі планів ширшого казахського самоврядування. Його вважали прихильником казахів, але нездатність подолати голод і бандитизм підірвала його образ і посилила націонал-комуністів, які усунули його на сьогоднішньому партійному засіданні.\n\nМіністр економіки Жумабєк Ташєнєв перебрав владу задля дальшої казахізації та ринково-соціялістичних реформ. Російські керівники на півночі країни назвали це незаконною незалежністю й цілковито відкинули його уряд.\n\nВідтак північні регіони відокремилися, а російські ополчення мобілізуються під проводом регіонального начальника поліції Ніколая Щолокова. Надходить дедалі більше повідомлень про місцеві збройні сутички, поки країна поринає у громадянську війну."
 KAZ_WORLD.7.a: "Для Червоного Казахстану починається фінал"
 
 KAZ_WORLD.8.t: "[Get_newspaper_header]Громадянська війна в Казахстані"
 KAZ_WORLD.8.desc: "У Казахстані, одній із найважливіших комуністичних держав світу до його краху, почалася громадянська війна. Через нездатність попереднього лідера поліпшити становище казахів казахські керівники захопили владу, що спричинило вихід росіян.\n\nМісцеві комісари, переважно росіяни, проводять власне партійне засідання й засуджують казахський режим в Алма-Аті. Країна поділена між російською північчю та казахським півднем.\n\nВ обох адміністраціях існують фракції з різними поглядами на віддалення від Росії, союз або возз'єднання з нею. Оглядачі кажуть, що це спонукає російських об'єднувачів підтримувати прихильні до тісніших зв'язків із Росією групи в Казахстані."
 KAZ_WORLD.8.a: "Війна повернулася до Землі звитяжців."
 
 KAZ_WORLD.9.t: "[Get_newspaper_header]Совєцька група перемагає"
 KAZ_WORLD.9.desc: "Офіційні заяви уряду Казахстану підтвердили смерть Павла Фітіна. Режим голови Фітіна, представника НКВД, відзначився неспроможністю владнати етнічний конфлікт, що назрівав у країні, й залишив по собі дедалі сильніший казахський опір. Тепер уряд, схоже, контролює Совєцька група - проросійська фракція, віддана сталінським ідеалам Тюмєні та переконанню, що Казахстан є продовженням СССР.\n\nУрядові протистоїть казахське військо, яке уникло чисток і повстало за незалежність країни. Несподівані успіхи заколоту в перші тижні боїв спонукали міжнародних оглядачів назвати конфлікт серйозною загрозою владі Совєцької групи, здатною занурити країну в хаос."
 KAZ_WORLD.9.a: "Невже Казахстан приречений вічно лишатися в тіні СССР?"
 
 KAZ_WORLD.10.t: "[Get_newspaper_header]Ташєнєв перемагає Акмолинський уряд"
 KAZ_WORLD.10.desc: "Останні двадцять років Казахстан дедалі більше бачив себе незалежною від СССР державою. Сьогодні це відокремлення, схоже, завершилося. Після останніх сутичок на півночі казахський уряд Жумабєка Ташєнєва переміг астанинських відступників.\n\nУ промові в Алмати Ташєнєв проголосив початок нової доби Казахстану й пообіцяв завершити нову конституцію найближчими місяцями. Разом із політичними реформами він, як очікується, відбудовуватиме економіку за більшовицькими принципами. Світ чекає на реакцію Росії й сподівається, що цей конфлікт не спалахне знову."
 KAZ_WORLD.10.a: "Казахську мрію здійснено."
 
 KAZ_WORLD.11.t: "[Get_newspaper_header]Нурмаґамбєтов перемагає Акмолинський уряд"
 KAZ_WORLD.11.desc: "Коли Саґадат Нурмаґамбєтов почав заколот, більшість уважала його армію приреченою. Та коли його люди входять до Астани, очевидно, що його зарано списали. Казахський націоналістичний лідер використав багаторічний бойовий досвід і безлад у російському уряді. Результат зрозумілий: нова казахська держава.\n\nПроте її ідеали лишаються вкрай розмитими. Нурмаґамбєтов проголосив республіку, але уряд досі складається переважно з військовиків, а належна демократизація його майже не цікавить. Наразі головною метою, схоже, є відновлення дипломатичних зв'язків із росіянами, які, як він сподівається, визнають новий незалежний уряд. "
 KAZ_WORLD.11.a: "Вільна, але ледве держава."
 
 KAZ_WORLD.12.t: "[Get_newspaper_header]Щолоков перемагає уряд Алмати"
 KAZ_WORLD.12.desc: "Спершу ополчення Щолокова здавалося оборонним і неорганізованим, нездатним протистояти досвідченій казахській армії. Натомість воно несподівано змінило хід війни, захопило Алма-Ату, а невдовзі й усю країну. Більшість приписує перемогу стратегії Щолокова, який знайшов союзників серед російських воєначальників, та безладній обороні казахського уряду, що не чекав повномасштабного наступу.\n\nТепер уряд Щолокова здобув перемогу, якої ніхто не чекав. Навіть внутрішні дії видаються хаотичними: Щолоков закономірно повернувся до бюрократії совєцького зразка, але без єдиного бачення незрозуміло, що визначатиме цю державу, крім розмитого російського націоналізму."
 KAZ_WORLD.12.a: "Що це за держава?"
 
 KAZ_WORLD.13.t: "[Get_newspaper_header]Соломєнцев перемагає уряд Алмати"
 KAZ_WORLD.13.desc: "Навіть у країні, що дедалі більше наближається до російської більшости, поміркованому націоналістові Соломєнцеву не могло бути легко прийти до влади. Та після короткої, але кривавої громадянської війни він узяв Алма-Ату й знову проголосив Казахську Совєцьку Соціялістичну Республіку єдиною.\n\nУ показаній по всій країні промові Соломєнцев присягнув знищити «реакційні буржуазні установи казахського шовінізму». Він також окреслив нові культурні автономії в Казахстані, законодавчо закріпивши становище польської та російської громад. Казахстан більше не країна казахів, а лише провінція, де казахи є одними з мешканців."
 KAZ_WORLD.13.a: "Совєцька група перемогла."
