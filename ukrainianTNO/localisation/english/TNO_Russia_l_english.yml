 #Coring
 RUS_coring_category: "§YРегіональна інтеграція§!"
 RUS_coring_category_desc: "Хоч усю Росію поєднує спільна ідентичність, роки панування воєначальників і безліч держав, що претендують на законну владу над Росією, створили умови, за яких новопридбані території не обов'язково можна вважати лояльними. Інтеграція цих земель до нашої держави, примусом чи інакше, має вирішальне значення для побудови цілісної адміністрації та відновлення справжньої опори в Росії."
