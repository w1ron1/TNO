### Events ###
 #Raiding
 raiding.100.t: "Ультиматум"
 raiding.100.d: "Ми отримали ультиматум від держави [FROM.GetNameDef]: від нас вимагають віддати данину здобиччю, інакше на нас нападуть та все одно заберуть її силою.\n\nМи опинилися перед нелегким вибором: вступити в сутичку з державою [FROM.GetNameDef], ризикуючи життями наших людей, чи відступити й задовольнити їхні вимоги, віддавши бажану здобич і зберігши воїнів для майбутніх битв?"
 raiding.100.a: "Ми так легко не відступимо!"
 raiding.100.b: "Мабуть, краще відступити й сплатити їм данину."

 raiding.101.t: "Вони відмовилися платити данину"
 raiding.101.d: "Як і очікувалося, держава [FROM.GetNameDef] відкинула нашу пропозицію та заявила про готовність до бою. Треба готувати наших людей до сутички.\n\nНа жаль, кровопролиття часом неминуче, і ми мусимо бути готовими до майбутнього. Якщо вони не хочуть співпрацювати, настав час силою відібрати здобич у держави [FROM.GetNameDef]."
 raiding.101.a: "Звуки пострілів і далі лунають Росією..."
 raiding.101.a.tt: "...але раптова зміна все скасує."

 raiding.102.t: "Данину сплачено"
 raiding.102.d: "Дивовижно, але держава [FROM.GetNameDef] поступилася й сплатила нам данину, віддавши бажану здобич. Кровопролиття вдалося уникнути, і наші люди житимуть, щоб битися іншого дня. Навряд чи держава [FROM.GetNameDef] знову здасться нам так легко."
 raiding.102.a: "Щоб вижити в російській анархії, часом доводиться погрожувати."

 raiding.103.t: "Успішний контрнабіг"
 raiding.103.d: "Надійшли донесення: наші люди квапляться додому на вантажівках, повних здобичі, із закривавленими руками. Вони вітають одне одного з успішним контрнабігом на захопленого зненацька ворога, плескають товаришів по плечах і востаннє стріляють услід уцілілим, що тікають геть. Ми оголошуємо перемогу в цій сутичці, а наші люди кричать і свистять у воєнному шаленстві, прагнучи показати нам скарби, вирвані з рук супротивника."
 raiding.103.a: "Заберіть усе, що може нам знадобитися."
 
 raiding.104.t: "Контрнабіг скасовано"
 raiding.104.d: "Нам не лишається нічого, крім як скасувати контрнабіг. Наш загін галасує й бешкетує, не здатний спілкуватися та діяти як єдине ціле. Їхня зброя постійно заклинює, а самі вони сваряться через жалюгідні рештки набоїв, які крадуть один в одного. Посилати цих безпорадних рядових було б безглуздям, ба навіть самогубством. Краще витратити час на озброєння й підготовку цих людей за допомогою тих небагатьох ресурсів, які ми зможемо зібрати, щоб наступний набіг не завершився цілковитою ганьбою."
 raiding.104.a: "Ми просто не були готові..."
 
 raiding.105.t: "Контрнабіг провалився"
 raiding.105.d: "Наші люди повертаються з прикордоння поранені та закривавлені. Одні біжать із перев'язаними побитими головами, інші нерухомо лежать у кузовах машин, стогнучи й благаючи про допомогу. Набіг на сусідів виявився пасткою, і вони відбили наших людей смертоносною силою. Деяких загиблих привозять назад із розпанаханою плоттю, розтрощеними черепами або понівечених кулеметним вогнем. Нам потрібен час, щоб оговтатися й відновити сили, а коли матимемо досить ресурсів, можливо, зможемо вдарити знову."
 raiding.105.a: "Наступного разу ми дістанемо покидьків!"

 raiding.1.t: "Успішний набіг"
 raiding.1.d: "Надійшли донесення: наші люди квапляться додому на вантажівках, повних здобичі, із закривавленими руками. Вони вітають одне одного з успішним набігом на захопленого зненацька ворога, плескають товаришів по плечах і востаннє стріляють услід уцілілим, що тікають геть. Ми оголошуємо перемогу в цій сутичці, а наші люди кричать і свистять у воєнному шаленстві, прагнучи показати нам скарби, вирвані з рук супротивника."
 raiding.1.a: "Заберіть усе, що може нам знадобитися."
 
 raiding.2.t: "Набіг скасовано"
 raiding.2.d: "Нам не лишається нічого, крім як скасувати набіг. Наш загін галасує й бешкетує, не здатний спілкуватися та діяти як єдине ціле. Їхня зброя постійно заклинює, а самі вони сваряться через жалюгідні рештки набоїв, які крадуть один в одного. Посилати цих безпорадних рядових було б безглуздям, ба навіть самогубством. Краще витратити час на озброєння й підготовку цих людей за допомогою тих небагатьох ресурсів, які ми зможемо зібрати, щоб наступний набіг не завершився цілковитою ганьбою."
 raiding.2.a: "Ми просто не були готові..."
 
 raiding.3.t: "Набіг провалився"
 raiding.3.d: "Наші люди повертаються з прикордоння поранені та закривавлені. Одні біжать із перев'язаними побитими головами, інші нерухомо лежать у кузовах машин, стогнучи й благаючи про допомогу. Набіг на сусідів виявився пасткою, і вони відбили наших людей смертоносною силою. Деяких загиблих привозять назад із розпанаханою плоттю, розтрощеними черепами або понівечених кулеметним вогнем. Нам потрібен час, щоб оговтатися й відновити сили, а коли матимемо досить ресурсів, можливо, зможемо вдарити знову."
 raiding.3.a: "Наступного разу ми дістанемо покидьків!"
 
 raiding.4.t: "На нас напали!"
 raiding.4.d: "Із прикордоння надійшли жахливі звістки. Бандити влаштували засідку на наші гарнізони й вирізали наших людей, лишивши на рівнинах їхні понівечені, неприродно скрючені тіла. Ба більше, нам повідомили, що вони проникли до прикордонних міст і сіл та пограбували беззахисне населення, забравши все, що могли. Наші підрозділи виявилися неготовими, тож ми майже нічого не можемо вдіяти, поки нападники тікають туди, звідки прийшли, лишаючи за собою слід нещасть і спустошення."
 raiding.4.a: "Боже милостивий!"
 
 raiding.5.t: "Ворог завагався"
 raiding.5.d: "Завдяки нещодавній підготовці оборонних заходів на всьому прикордонні бандити з того боку кордону чимдуж тікають назад у тіні. Вони більше не піняться від люті й не жадають нашого добра, бо бояться можливої жорстокої сутички за ці спірні землі. Вочевидь, майстерна оборона й психологічна гра виграли бій ще до того, як пролилася перша крапля крови: ворог тремтить перед умінням і міццю держави [Root.GetName]."
 raiding.5.a: "Ха! Погляньте, як боягузи тікають!"
 
 raiding.6.t: "Ворога розбито"
 raiding.6.d: "У свіжих донесеннях повідомляють про приголомшливу перемогу над загоном бандитів, що намагався здійснити набіг. У жорстокому протистоянні наші відважні оборонці майже винищили їх, і тепер спотворені війною тіла нападників розкидані по землі. Поки вцілілі шукають укриття й відступають у туманне прикордоння, наші солдати співають про перемогу та героїзм перед лицем загарбницького зла. Ця кривава поразка напевно на довгі роки відіб'є в них охоту нападати на землі держави [Root.GetName]!"
 raiding.6.a: "А тепер приберімо трупи..."
 
 raiding.7.t: "Реліквії минулого"
 raiding.7.d: "Наш нещодавній набіг на ворожу територію завершився гучним успіхом. Розгромивши сили ворога на полі бою, наші хоробрі солдати ввійшли до кількох прикордонних міст і відшукали там скарби з тих часів, коли Росія була єдиною. Вони болісно нагадують про наш нинішній жалюгідний розкол, але ми дійшли висновку, що деякі з цих речей можуть стати в пригоді для розвитку нашої молодої промисловости. Сподіваємося, вони допоможуть нам повернутися до тієї могутности, за якої їх колись виготовили, і знову принести цим землям гідне й мирне життя."
 raiding.7.a: "Та треба думати й про майбутнє..."
 
 raiding.8.t: "Їжа для голодних"
 raiding.8.d: "Нарешті сьогодні ввечері їжі вистачить усім, і нам більше не доведеться працювати з порожніми шлунками та розбитими серцями. Місяці на половинному пайку навчили нас стриманости й самовладання, але водночас точили наш розум тихою, крижаною істерією. Тепер їжі вистачить на цілі покоління, і люди держави [Root.GetName] зможуть братися до праці, не страждаючи від голоду протягом виснажливих до божевілля днів."
 raiding.8.a: "Схоже, сьогодні голодними не залишимося..."
 
 raiding.9.t: "Воєнна здобич"
 raiding.9.d: "Перемога! Наші загони тягнуть додому величезну здобич, прив'язану до дахів військових машин і напхану в мішки, які везуть верхи з ворожих земель. Ці скарби дадуть нам змогу наповнити скарбницю, поповнити арсенали й наростити місцеве виробництво. Баланс сил явно змістився на нашу користь, і з кожною наступною сутичкою ми дедалі краще озброєні, щоб протистояти загрозам, що насуваються з дикого російського прикордоння."
 raiding.9.a: "Це допоможе нам у майбутньому."
 
 raiding.10.t: "Скарб!"
 raiding.10.d: "Наші люди розтрощили ворога й винесли з його земель усе, що могло знадобитися нападникам. Серед хаосу й шаленства насильства кілька наших бійців зламали замки на складі та натрапили на скарби, які перевершили найсміливіші мрії! Вони зібрали золото, коштовні метали, статуї та інші залишки російського минулого. Ці реліквії принесуть нам величезне багатство, престиж і тугу за славними часами. Можливо, навіть попри насильство й жорстокість цих сутичок, це знак великих часів, що чекають на наш народ."
 raiding.10.a: "Реліквія минулого..."
 
 raiding.11.t: "Машини минулого"
 raiding.11.d: "Розтрощивши ворога, наші люди ввірвалися до його складів та арсеналів, забираючи все корисне й знищуючи те, чого не могли винести. Один загін солдатів натрапив на сховище з великим промисловим обладнанням. Варто прив'язати машини до наших автівок і доправити на фабрики, де їх можна пристосувати та вбудувати у виробничі лінії. Можливо, колись, машина за машиною, ми відбудуємо Росію з підвалин і повернемо їй колишню славу."
 raiding.11.a: "Можливо, завдяки їм Росію колись відбудують..."
 
 raiding.12.t: "Спогади про минуле"
 raiding.12.d: "Наші люди ввірвалися на спустошені військові бази ворога, оточені тілами загиблих. Вибиваючи двері, кричачи й завиваючи у воєнному шаленстві та без розбору стріляючи в кожного, хто ще лишався, вони мчали тісними коридорами й розбомбленими кімнатами. Вони трощили шафи й сховища в пошуках припасів, зброї та спорядження, аж поки один загін не влетів на склад і не знайшов там реліквії старої Росії. Солдати опустили зброю й заходилися збирати всі світлини, кіноплівки та речі, які могли винести. Отримавши їх сьогодні вранці, ми відкрили величезний скарб у фільмах, книжках і картинах Росії до анархії - болісне нагадування про минулу славу та нинішню ганьбу."
 raiding.12.a: "Можливо, завдяки їм Росія колись знову об'єднається..."
 
 raiding.13.t: "Їжу викрадено"
 raiding.13.d: "Сьогодні вранці ми виявили, що наші продовольчі запаси спорожніли: їх пограбували втікачі, бандити та злочинці. Щонайменше у трьох місцях розграбували склади із зерном, м'ясом, сіллю та консервами, залишивши тільки кілька розсипаних мішків ячменю й зіпсованих банок із м'ясом. Діти лягають спати голодними, а селяни насилу годують населення. Треба щось робити, бо за кілька тижнів наші люди почнуть наставляти зброю одне на одного заради шматка їжі."
 raiding.13.a: "Схоже, цього місяця житимемо на половинному пайку"
 
 raiding.14.t: "Гарнізон вирізано"
 raiding.14.d: "Сьогодні ми прокинулися від звісток про смерть і поразку. Бандити-грабіжники розорили наші казарми, а гарнізон лежить мертвий у багнюці, понівечений особливо моторошним і жахливим чином. Стіни заляпані кров'ю та мізками, із солдатських приміщень валить дим. Нападники своїми вкрай жорстокими й лихими діями завдали тяжких утрат нашим людським резервам. Тепер їх ніде не видно: вітер прикордоння свистить і кличе, а люди держави [Root.GetName] тремтять від страху. Хоч би що ми робили проти цих варварських армій, діяти треба швидко й невідкладно."
 raiding.14.a: "Поховайте загиблих і сповістіть родини..."
 
 raiding.15.t: "Пошкоджене обладнання"
 raiding.15.d: "Після останнього набігу на наші території ми, на щастя, можемо повідомити, що більшість цивільного населення не постраждала. Однак про промислове виробництво такого не скажеш. Фабричне обладнання розграбовано, кілька заводів зрівняно із землею, тож наш промисловий розвиток зазнав значного удару. Хоч зараз ми не зможемо так ефективно нарощувати виробництво, принаймні вдалося захистити людей. Зрештою, обладнання можна втратити й повернути - життя ні."
 raiding.15.a: "Покидьки!"
 
 raiding.16.t: "Пограбовані арсенали"
 raiding.16.d: "Наші генерали доповіли, що бандити пограбували кілька підконтрольних нам арсеналів. Зникли гвинтівки й набої, а з деяких складів нападники за одну ніч винесли геть усе. Тепер вони, напевно, вже далеко за кордоном, а наші порожні сховища залишають нам дедалі менше зброї, щоб захиститися від їхніх загребущих рук. Треба діяти, інакше невдовзі в нас відберуть і життя."
 raiding.16.a: "Це лише додасть їм нахабства..."
 
 raiding.17.t: "Села знищено"
 raiding.17.d: "Сьогодні надійшли донесення з обвуглених сіл на кордоні із сусідніми територіями. Наших людей вирізано, промисловість знищено. Бандити перетнули кордон із достатньою силою та люттю, щоб розтрощити оборону й залишити наших людей побитими та скаліченими. Сотні загиблих лежать у будинках, ратушах і на робочих місцях, а вцілілі здригаються, розповідаючи про набіги. Ми втратили значну частину спроможности захищатися від бандитських навал, і це тяжко вдарило по нашій здатності керувати спірними територіями. Ми переживаємо одну з найслабших митей і мусимо зробити все, щоб вижити й оговтатися, перш ніж неминуче відповісти палаючою люттю."
 raiding.17.a: "Які звірі здатні на таке..."

 #West Russian Wonders
 RUS_wonder.0.t: "Кінець чудес"
 RUS_wonder.0.desc: "Ми пройшли довгий шлях! Колись наш уряд вважали лише черговим воєначальником, який чіпляється за клаптик російської землі, а тепер ми можемо заявити про себе як про справжню державу на світовій арені. Потрапивши до останнього кола претендентів на об'єднання Росії, наша країна може пишатися здобутками й рішуче дивитися вперед.\n\nЦей поступ сповнив наших громадян захватом, поки ми відбудовуємо країну, її інфраструктуру та промисловість. Проте наші успіхи зробили колишні Чудеса значно менш важливими. Раніше володіння цими реліквіями щасливішого минулого надавало урядові легітимности, а народові - засоби для виживання, тепер же підконтрольні нам Чудеса становлять лише крихітну частку загальних багатств. Вони, безперечно, і далі надихатимуть людей та нагадуватимуть про добу воєначальників, але часи, коли володіння Чудесами мало вирішальне значення, скінчилися."
 RUS_wonder.0.a: "Назустріч непевному майбутньому."

 RUS_wonder.1.t: "Завод «Красноє Сормово» захоплено!"
 RUS_wonder.1.desc: "Ми заволоділи Ґорьківським танковим заводом, найбільшим виробником бронетехніки в Західній Росії.\n\nЦей завод був важливою частиною совєцької промисловости й широко використовувався під час Західноросійської війни. Після розпаду ЗРРФ він потрапив до рук Ніколая Авєріна та його бандитських дивізій, які штампували тут танки для набігів на райхскомісаріят Московієн. Негідна доля для такого важливого об'єкта військової інфраструктури!\n\nСеред російських воєначальників танки рідкісні, тому кожен, хто здатен їх виробляти, стає грізною силою, а завод - жаданим трофеєм. Тепер, коли він належить нам, ми можемо використати Ґорьківський танковий завод для вищої мети, ніж крадіжка німецьких недогризків.\n\nВідновлення виробництва танків стане ще одним кроком до військових можливостей повноцінної держави та остаточної перемоги в Західній Росії."
 RUS_wonder.1.a: "Міць сучасної війни вирвалася на волю."

 RUS_wonder.2.t: "Сиктивкарський арсенал захоплено!"
 RUS_wonder.2.desc: "Ми захопили Сиктивкарський арсенал, велике сховище військового озброєння, яке може вирішити долю перемоги в Західній Росії. Раніше ним володів Західноросійський революційний фронт, а коли ЗРРФ покинув Сиктивкар, арсенал дістався молодій Республіці Комі. Вона використовувала його, щоб підтримувати порядок у своїй сумнозвісно нестабільній столиці та утвердитися як регіональна сила, але навіть повний доступ до запасів не врятував її від утрати. В арсеналі є вогнепальна зброя, вибухівка, танки й хемічна зброя - страхітливий набір для будь-якого завойовника.\n\nЗаволодівши ним, ми здобули величезну перевагу та гордо тримаємо зброю, що принесе нам перемогу в Західній Росії. За постійної нестачі ресурсів у постсовєцькому ладі важлива кожна рушниця. Контроль над арсеналом забезпечить нас усім спорядженням, потрібним для утвердження влади над регіоном."
 RUS_wonder.2.a: "Заряджено й готово до бою."

 RUS_wonder.3.t: "Іжевський механічний завод захоплено!"
 RUS_wonder.3.desc: "Завоювавши Іжевск, ми закріпили контроль над Іжевським механічним заводом, найбільшим осередком виробництва зброї в Західній Росії. Іжевск давно штампує величезні обсяги пістолетів, гвинтівок та іншої стрілецької зброї. Після розпаду Західноросійського революційного фронту місто й завод перейшли до Владіміра Романова, гаданого спадкоємця останнього російського царя, який нарощував тут свої реакційні сили задля панування в регіоні.\n\nТепер завод міцно в наших руках, і ми можемо використати його для тієї самої мети. У Великій Вітчизняній та Західноросійській війнах він був одним із головних виробників зброї для величезних армій. Ми забезпечимо свої війська новою, сучасною зброєю, поки супротивники насилу збирають застарілі арсенали."
 RUS_wonder.3.a: "Втопімо їх у хвилі свинцю."

 RUS_wonder.4.t: "Завод «Красноє Сормово» втрачено!"
 RUS_wonder.4.desc: "Ми билися довго й завзято, але втратили Ґорьківський танковий завод, що завдало тяжкого удару нашому виробництву техніки. Колись Західноросійський революційний фронт ефективно використовував його проти німців, а відтоді завод лишався стратегічною опорою регіону як один із небагатьох промислових центрів, здатних випускати важку бронетехніку. Танки мають нищівну перевагу над відносно легко озброєними арміями Західної Росії, тому будь-якого воєначальника, який ними володіє, сприйматимуть надзвичайно серйозно.\n\nЗавод давав нам незаперечну вогневу перевагу, і нові власники, ймовірно, використають його так само. Ми ще далеко не приречені, але невдовзі слід чекати більше ворожих танків та бронемашин і відповідно підготуватися."
 RUS_wonder.4.a: "Тривожний розвиток подій."

 RUS_wonder.5.t: "Сиктивкарський арсенал втрачено!"
 RUS_wonder.5.desc: "Наші солдати обороняли його в безперервних вуличних боях по всьому Сиктивкару, але величезний міський арсенал більше не належить нам. Спершу він належав Західноросійському революційному фронтові, був покинутий Червоною армією під час відступу наприкінці 1950-х, а згодом служив Республіці Комі для підтримання порядку й оснащення війська. Там зберігаються великі запаси вогнепальної зброї, набоїв, ґранат і, що особливо привабить менш перебірливого воєначальника, хемічної зброї.\n\nТепер, коли арсенал вийшов з-під нашого контролю, маємо чого боятися. Ми, звісно, дотримувалися законів війни, але не можемо ручатися за супротивника: нові господарі цілком можуть застосувати проти нас хемічну зброю. Разом із нестачею звичайного озброєння після втрати арсеналу це помітно змінює баланс сил у Західній Росії."
 RUS_wonder.5.a: "У них більше зброї, та нас іще не перевершено."

 RUS_wonder.6.t: "Іжевський механічний завод втрачено!"
 RUS_wonder.6.desc: "Після втрати Іжевска разом із могутнім Іжевським механічним заводом ми можемо опинитися в скрутному становищі. Найбільша фабрика стрілецької зброї в Західній Росії є трофеєм, якого прагне кожен поважний воєначальник. Вона служила ще Західноросійському революційному фронтові, єдиній на людській пам'яті силі, здатній виробляти достатньо зброї, щоб кинути виклик Німеччині. Від нього завод перейшов до нас, а тепер опинився в руках ворога.\n\nНа хаотичних полях битв Західної Росії немає певности, але ця втрата безперечно значна. Ми не відчуємо її одразу, проте падіння виробничих потужностей неодмінно зашкодить майбутньому оснащенню війська. На нас чекає дефіцит, а сучасні методи виробництва знову стануть розкішшю. Це ще не кінець, та розвиток подій тривожний."
 RUS_wonder.6.a: "Їхню зброю ми переважимо власною відвагою."
 
 RUS_wonder.7.t: "Воркутинські ГУЛАГи захоплено!"
 RUS_wonder.7.desc: "Коли наші люди пройшли арктичними рівнинами, сумнозвісні Воркутинські ГУЛАГи перейшли під нашу владу. Похмурий комплекс сторожових веж, темних бараків і трудових таборів наганяє тремтливий страх серед крижаних пусток, а неймовірні муки в цій природній в'язниці нагадують про людську підлість. Ворожі солдати розкидані подвір'ям, засипані уламками й розірвані кулеметним вогнем. Темні цегляні стіни вкрила свіжа кров, повітря густо пропахло порохом, а тиша після бою оглушувала.\n\nМи опинилися в місці незмірних страждань. Поки одні наші люди вибивали двері й нишпорили в пошуках здобичі, інші опустили зброю й завмерли перед моторошним видовищем. Війна майже не пошкодила ГУЛАГи, тож перед нами постало питання: назавжди закрити їх і залишити реліквією варварського минулого чи забруднити руки жорстокою дійсністю цієї війни, щоб Росія могла жити?"
 RUS_wonder.7.a: "Іноді великі люди чинять жахливі речі."
 RUS_wonder.7.b: "Ніколи знову. Принаймні не так."
 
 RUS_wonder.8.t: "Уральський автомобільний завод захоплено!"
 RUS_wonder.8.desc: "Після завоювання Чєлябінска наші люди прочісують місто в пошуках усього цінного для війни із сусідами. Штурмові групи мчать вулицями й обстрілюють рештки ворожих дивізій, що засіли в будинках, а постріли з сутичок за кілька кварталів лунають усім містом. Один наш підрозділ узяв в облогу табір на Уральському автомобільному заводі й, прорвавши оборону, вирвав підприємство з рук кількох десятків приречених захисників.\n\nКонтроль над цим великим виробничим об'єктом дасть солдатам більше всюдиходів для майбутніх боїв. Це значно поліпшить постачання та прискорить прибуття підкріплень. Потужні двигуни заводу славляться швидкістю й надійністю на складній місцевості та стануть у пригоді в походах російською анархією. За допомогою мотора ми здобули перемогу для народу й майбутнього Росії."
 RUS_wonder.8.a: "Уперед, співвітчизники!"
 
 RUS_wonder.9.t: "Златоустівський збройовий завод захоплено!"
 RUS_wonder.9.desc: "Подальший наступ углиб Уралу приніс нам великий трофей - славетний Златоустівський збройовий завод.\n\nВін давно відомий величезними обсягами високоякісної стрілецької зброї та набоїв. Тепер ми забезпечимо ними себе й водночас позбавимо їх ворога. Наші інженери та адміністратори вже приєднують підприємство до ширшої логістичної мережі й невдовзі завершать роботу.\n\nНасправді це лише один великий фабричний комплекс серед багатьох під нашим контролем, і самотужки він не дасть вирішальної кількости спорядження. Та не варто недооцінювати його цінність: це символ російського виробництва зброї, і тепер він належить нам.\n\nЦе ще одна коштовність у нашій короні. Ми використаємо обіцяні нею економічні, військові та політичні переваги для нових наступів і завоювань, доки всі землі й народи Росії не визнають перемоги нашої держави."
 RUS_wonder.9.a: "Уперед!"
 
 RUS_wonder.10.t: "Воркутинські ГУЛАГи втрачено!"
 RUS_wonder.10.desc: "Поразки в Північній Росії змусили нас залишити систему Воркутинських ГУЛАГів і фактично віддати комплекс ворогові. Під час відступу в'язні, спостерігаючи нашу поразку, дедалі більше впадали в дику істерію. Шаленство бою жорстоко покарало наших людей, а в'язням це, можливо, здавалося збоченою справедливістю.\n\nМи ще можемо вдарити у відповідь, але люди виснажені й приголомшені воєнним вигнанням. Пронизливий арктичний вітер не милує переможених, і хоч би якими доблесними були наші війська, заціпливий холод не дає їм спочинку. Ми відходимо до кордонів своїх земель на перегрупування, та дика паніка ГУЛАГів назавжди випалила себе в пам'яті солдатів. Їхню бойову відвагу, схоже, вже не повернути, і це може віщувати нашу поразку."
 RUS_wonder.10.a: "За це когось розстріляють!"
 
 RUS_wonder.11.t: "Уральський автомобільний завод втрачено!"
 RUS_wonder.11.desc: "Наші люди хоробро билися в Чєлябінску, вступаючи в сутички з ворогом під градом металу, але їхньої жертви забракло, щоб урятувати Уральський автомобільний завод. Його машини й далі гриміли та брязкали в імлі й хаосі війни, переходячи з рук у руки разом із фронтом, що стрибав з вулиці на вулицю.\n\nМи відступаємо з міста до таборів у навколишній глушині й готуємо повернення заводу. До того часу супротивник використає нові іграшки для виробництва тих самих машин, які колись допомагали нам у боях. Ця поразка не ганебна, але все-таки поразка, що може нас погубити, поки ворог міцніє з кожним новим двигуном."
 RUS_wonder.11.a: "Це тяжка втрата для нас."
 
 RUS_wonder.12.t: "Златоустівський збройовий завод втрачено!"
 RUS_wonder.12.desc: "Златоустівський збройовий завод яскраво палає вдалині, поки наші люди відступають у глушину для перегрупування, а з краю поля бою лунають вибухи складів із набоями. Поразка тяжіє над військом, що дивиться на зруйновану фортецю, яку боронило кілька днів. Охоплені гірким цинізмом, багато хто відвертається й продовжує похід, озлоблений і переможений.\n\nЗавод зруйновано не повністю, він перейшов під контроль ворога й найближчими тижнями неодмінно виробить тисячі одиниць зброї. Наші люди винесли з поля бою все, що могли, та ніхто не наважується вголос сказати очевидне: невдовзі почнеться гостра нестача озброєння, поки ворог наближається до наших таборів за містом."
 RUS_wonder.12.a: "Сьогодні ми безперечно втратили перевагу."
 
 RUS_wonder.13.t: "Красноярський залізничний вузол захоплено!"
 RUS_wonder.13.desc: "Пробившись крізь лісисті гори навколо міста, наші люди захопили Красноярск, а разом із ним і широко знаний Красноярський залізничний вузол. Величезна будівля вокзалу панує над містом і поглядами солдатів, немов логістична фортеця, ущерть набита важкими металевими потягами на платформах.\n\nКонтроль над цим ключовим вузлом Транссибірської магістралі значно поліпшить нашу логістику для геркулесового завдання об'єднання Росії. Завантаживши потяги набоями та ящиками припасів, ми ефективніше доставлятимемо їх на фронт і прискоримо зв'язок. Володіння Красноярським вузлом поширить наш вплив Сибіром і стане кроком до об'єднання Росії під нашою владою."
 RUS_wonder.13.a: "Безперечне надбання!"
 
 RUS_wonder.14.t: "Кузнецький басейн захоплено!"
 RUS_wonder.14.desc: "Наші люди заповнюють руїни Кузнецького басейну, прориваючись крізь рештки ворожих укріплень та осередки поранених загонів. Удалині ще тріщать постріли, а полум'я спалених споруд рве небо. Вітер мчить Кузнецькою западиною, несучи чорний сморід вугільних покладів, що тепер належать нам.\n\nТакі багаті природні ресурси дадуть нам величезні обсяги енергії. Видобуте вугілля швидко наростить виробничі можливості й забезпечить енергією численних мешканців наших земель. Це надзвичайно цінне й жадане місце в Центральному Сибіру треба негайно використати, щоб пожати плоди копалень, перш ніж ворог спробує їх відібрати."
 RUS_wonder.14.a: "Сьогодні ми здобули велику перемогу!"
 
 RUS_wonder.15.t: "Новосибірський авіаційний завод захоплено!"
 RUS_wonder.15.desc: "Нещодавнє падіння Новосибірска й відступ ворога залишили в наших руках тепер бездіяльний Новосибірський авіаційний завод. Височезне й мовчазне підприємство збудували ще до Великої Вітчизняної війни, і відтоді воно виробляло літаки для кожного свого господаря.\n\nТепер завод належить нам, і невдовзі ми отримаємо новий арсенал літаків для всіх потреб війська. Заревуть двигуни, і ескадрильї з нашими знаками полетять сибірським небом. Щоб панувати на землі серед рівнин і пусток Центрального Сибіру, треба приборкати дике повітря розбитої Росії. Із цим заводом таке майбутнє може належати нам на довгі віки."
 RUS_wonder.15.a: "У небо!"
 
 RUS_wonder.16.t: "Красноярський залізничний вузол втрачено!"
 RUS_wonder.16.desc: "Наші люди квапилися до вагонів, поки ворожа облога наближалася до завершення. Тріск стрілянини й гуркіт артилерійських снарядів струсили їх до глибини душі, та бодай потяги в останню мить залишили Красноярський вузол і вирвалися з бою.\n\nМи врятували життя людей, але втратили адміністративну й логістичну коштовність Красноярска. Можливість швидко зв'язуватися й перевозити ресурси з одного кінця наших земель до іншого була безцінною, а тепер вона служить ворогові. Віддавши цей ключовий об'єкт, ми втратили свій широкий вплив на Центральний Сибір і, можливо, майбутній шанс об'єднати розбиту Росію."
 RUS_wonder.16.a: "Будь прокляті наші вороги!"
 
 RUS_wonder.17.t: "Кузнецький басейн втрачено!"
 RUS_wonder.17.desc: "Наші побиті й закривавлені люди лежать мертвими на сибірському прикордонні. У хаосі війни й насильства ми втратили контроль над Кузнецьким басейном, а з ним і доступ до величезних запасів вугілля в багатих покладах.\n\nПозбувшись такого джерела енергії, ми, ймовірно, зіткнемося зі спадом виробництва та труднощами з ощадженням палива. Тепер доведеться покладатися на обмежені енергетичні ресурси, тонко розпорошені нашими землями. Невдале керування може покласти край нашому існуванню та надії об'єднати Росію, прирікши нас на анархію, проти якої так невтомно боролися наші люди."
 RUS_wonder.17.a: "Прокляття!"
 
 RUS_wonder.18.t: "Новосибірський авіаційний завод втрачено!"
 RUS_wonder.18.desc: "Після недавніх поразок у Новосибірському регіоні донесення підтвердили, що ворог контролює Новосибірський авіаційний завод. Один із найбільших виробників літаків опинився в чужих руках, завдавши нам швидкого й потужного удару, який може привести до принизливої поразки. Війна пошкодила підприємство, та розвідка, на жаль, вважає, що воно здатне продовжити виробництво.\n\nПід ворожим контролем завод може відкрити проти нас новий фронт у небі. Ми більше не здатні постійно поповнювати авіяцію й ризикуємо програти не лише на землі, а й у повітрі. Це лише питання часу, коли небо належатиме супротивникові, а наша боротьба за перемогу стане ще тяжчою."
 RUS_wonder.18.a: "Тяжка втрата для нас."
 
 RUS_wonder.19.t: "Порт Маґадана захоплено!"
 RUS_wonder.19.desc: "Наші війська промчали далекосхідним прикордонням, і наступ на ворожі землі зупинило лише море. Після кривавої битви людей зустрів широкий, безмежний Тихий океан: порт Маґадана перейшов під наш контроль. Крижані бурхливі води простяглися на багато кілометрів навсібіч, а на цьому загадковому сибірському узбережжі стоїть найважливіший порт східноросійської пустки.\n\nОсередок торгівлі й контрабанди, особливо японських та американських товарів, порт Маґадана відкриває нашій владі можливості не лише торгувати, а й заявити про себе всьому світові. Завдяки цьому безцінному порту ми сподіваємося зробити перший крок до міжнародного визнання й торгівлі."
 RUS_wonder.19.a: "Браму до Росії захищено"
 
 RUS_wonder.20.t: "Іркутську гідроелектростанцію захоплено!"
 RUS_wonder.20.desc: "Після нещодавнього захоплення Іркутска нашими сибірськими арміями могутня гідроелектростанція перейшла під наш контроль. Її збудували за наказом Ґєнріха Яґоди, коли Совєцький Союз відтиснули до сибірських окраїн, і відтоді вона надійно живила все місто. Цей могутній символ панування Росії над природою може стати й символом нашої влади над сибірським прикордонням серед хаосу воєначальників Сходу.\n\nВеличезні обсяги електрики з річкової течії дадуть змогу живити наші заводи, фабрики й оселі громадян. Бетонна станція височіє над сибірською пусткою та перемелює води Анґари, виробляючи електроенергію. Ми використаємо природні жили розбитої країни, і з таким величним джерелом енергії наші запаси ніколи не вичерпаються!"
 RUS_wonder.20.a: "Це неодмінно допоможе нашим зусиллям."
 
 RUS_wonder.21.t: "Авіабазу Чєрьомушкі захоплено!"
 RUS_wonder.21.desc: "Після особливо кривавої облоги наші люди відібрали в боягузливого ворога авіабазу Чєрьомушкі й винесли з неї всю доступну здобич. Більша частина бази вціліла, тому летовище можна буде використати вже невдовзі. Літаки похмуро стоять у ангарах, їхні металеві крила нерухомі й бездіяльні.\n\nТепер ціла авіабаза під нашим контролем, а наші землі здатні підтримувати ескадрильї, що розтинають попелясте сибірське небо. Маючи таке летовище, солдати зможуть наступати крізь пустки, знаючи, що згори за ними стежать пілоти. Схід холодний, а його вітри ще холодніші, та жоден мороз не скує нашої рішучости битися й літати."
 RUS_wonder.21.a: "Небо належить нам!"
 
 RUS_wonder.22.t: "Порт Маґадана втрачено!"
 RUS_wonder.22.desc: "Притиснуті ворогом спиною до моря, ми були змушені покинути порт Маґадана й відступити в східне прикордоння для перегрупування. Дика сибірська природа сама загрожує нашим людям, але втрата порту вдарить ще болючіше, якщо ми не зможемо відібрати його назад.\n\nБез доступу до американських та японських товарів із порту лишилися лічені тижні, перш ніж влада й військо почнуть голодувати через брак ресурсів, їжі та спорядження. Треба вирішити: затягнути паски й приготуватися до удару чи зібрати сили й знову вступити в бій за порт. Люди загинуть, героїв пам'ятатимуть, але яку ціну ми готові заплатити за виживання?"
 RUS_wonder.22.a: "Поки що ворог здобув перевагу."
 
 RUS_wonder.23.t: "Іркутську гідроелектростанцію втрачено!"
 RUS_wonder.23.desc: "Попри всі зусилля втримати дамбу, ворог заполонив наші колишні позиції навколо Іркутської гідроелектростанції. Вода й далі мчить крізь її нищівні турбіни, тепер забарвлена кров'ю наших патріотів і під владою супротивника.\n\nВони безперечно використають весь потенціал станції, щоб живити великі машини та свою воєнну промисловість проти нас. Наші солдати здалеку дивляться, як ворожі війська й інженери пораються серед задимлених уламків, і радяться, як повернути об'єкт. Та певне одне: кожна мить під ворожим контролем дає дамбі змогу накопичувати дедалі більшу силу для війни проти наших хоробрих людей."
 RUS_wonder.23.a: "Тяжка невдача!"
 
 RUS_wonder.24.t: "Авіабазу Чєрьомушкі втрачено!"
 RUS_wonder.24.desc: "Ворог прорвав наш фронт трохи північніше Чіти, і люди відступають із позицій, щоб перегрупуватися й продовжити цю велику війну випробувань. Останні донесення свідчать, що після запеклої облоги та сутичок між ангарами й на летовищах війська втратили авіабазу Чєрьомушкі.\n\nНаші люди слабкі й виснажені, поразка приголомшила їх. До того ж ворог тепер має летовища й літаки для нових ударів із повітря по наших наступальних силах. Загнані втратами в кут, у будь-якій надійній стратегії повернення бази ми мусимо враховувати штурмові нальоти та підтримку з повітря."
 RUS_wonder.24.a: "Будь прокляті наші вороги!"
 
 RUS_wonder.1917.t: "Тіло Лєніна захоплено!"
 RUS_wonder.1917.desc: "Наші солдати захопили мавзолей Лєніна. Оскільки його тіло не має стратегічної чи тактичної ваги, ворожі війська покинули його без бою й відступили на безпечніші та краще захищені позиції. Політичне значення останків лишається сумнівним. По всій Росії ставлення до Лєніна як історичної постаті вкрай різне. Багато хто вважає його батьком політичного руху, чия дурість і неспроможність спричинили розпад країни. Інші бачать у ньому оплот вірного Марксу й Енґельсу комунізму, спадщину якого зрадив наступник Бухарін. Для когось він перший у шерезі стражденних, але все ще утопічних бухарінських вождів і мислителів. Хай там що думають про цю людину, вона безперечно є одним із найвидатніших провідників російської історії, а тепер перебуває в наших руках..."
 RUS_wonder.1917.a: "Чотири десятиліття історії в наших руках!"
 
 RUS_wonder.1924.t: "Тіло Лєніна втрачено!"
 RUS_wonder.1924.desc: "Ми втратили тіло Владіміра Лєніна майже з тих самих причин, з яких колись його захопили. Хоч останки Лєніна й помітний політичний засіб, вони не становлять важливого стратегічного чи тактичного вузла. Нехай тепер тіло у ворога й він насолоджується пропагандистськими можливостями, які дає труп батька Совєцького Союзу, згодом ми неодмінно його повернемо."
 RUS_wonder.1924.a: "Ми втратили лише кістки та ідеї."
 
 RUS_wonder.1991.t: "Тіло Лєніна знищено"
 RUS_wonder.1991.desc: "Владімір Лєнін, батько Совєцького Союзу й творець падіння Росії в добу воєначальників, більше не процвітатиме як символ комуністичної розбещености й занепаду. Його тіло спалено, а попіл розвіяно незайманими російськими нетрями. Хай інші й далі тримаються за ідеї, які уособлював його труп, ми подбаємо, щоб Лєніна більше не вважали «одним із найвидатніших провідників російської історії». Лєнін був людиною, якщо навіть цього вартий, яка на короткий час повалила нашу країну. Не більше й не менше."
 RUS_wonder.1991.a: "Недовговічний вождь із дивними ідеями, нічого нового."

 ### General Russia Events ###
 RUS.2.t: "Спортивне суперництво"
 RUS.2.desc: "Успішне об'єднання Західної Росії та інтеграція багато зробили, щоб згуртувати народ під спільним прапором, але між численними регіонами країни досі вирує запекле суперництво. Доба збройних воєначальників завершилася, тож люди знаходять нові способи з'ясовувати стосунки. Одним із них, схоже, став хокей.\n\nНедавня гра між «Ґорьківськими танкістами» й казанським «Ак Барсом» завершилася хаосом після вузької перемоги «Барса» 4:2 у першому матчі сезону. Мешканці Ґорького не змирилися з поразкою й почали низку п'яних демонстрацій. Протести переросли в заворушення: натовп намагався не пустити «Ак Барс» до готелю, розписував місто образами проти татар, грабував і нищив майно.\n\nЗавдані збитки сягнули значної суми, і багато хто боїться, що подія створила тривожний прецедент для наступних матчів саме тоді, коли хокейний сезон набирає обертів."
 RUS.2.a: "Ну, принаймні це краще, ніж стріляти одне в одного."

 RUS.3.t: "Потік кофеїну"
 RUS.3.desc: "Під час хаосу кінця 1950-х і початку 1960-х такі розкоші, як чай та кава, були рідкісним товаром. Їх могли дістати лише люди з грішми й зв'язками, а для більшости населення вони були цілковито недосяжними.\n\nПроте зі стабілізацією Росії доступ до світової економіки різко поліпшився, і колись рідкісні товари завозять дедалі більшими обсягами: шоколад, фрукти, іноземні вина й, звісно, кава та чай. Напої з кофеїном уже не розкіш для небагатьох привілейованих, а дедалі звичніший, хай і досі дорогий, вибір багатьох наших громадян."
 RUS.3.a: "Вип'ємо за наш майбутній успіх!"

 RUS.4.t: "Народний апокаліпсис"
 RUS.4.desc: "Томск - край письменників, поетів і науковців, чиї університети плодять більше рукописів і маніфестів, ніж хтось бажає рахувати. Та один анонімний твір викликав суперечки по всьому Сибіру. «Народний апокаліпсис» оповідає про мандрівку безликого вченого крізь падіння Центральносибірської Республіки й зустрічі з чотирма вершниками апокаліпси: Іваном Заволоко, Ґєнріхом Яґодою, Алєксандром Покришкіним та Ніколаєм Андрєєвим.\n\nПрокинувшись після хвороби в Ойротії, учений бачить людей, обернених на белькотливих безумців, що видирають собі очі й розривають шкіру через мор, принесений Заволоко. Той отруїв народ еліксиром віри й послабив тіло Республіки. Вигнаний сліпими й розбещеними, мандрівник бачить палаючі землі, викрадення й переслідування вільнодумців Яґодою, поки синьолиці демони ведуть війну проти народу. Тікаючи від різанини, він потрапляє на нескінченні дороги, вкриті живими скелетами, де голод пожирає землю через страшну зраду Покришкіна. Нарешті він стає свідком зради Андрєєва в Красноярску, коли той пронизує серце безіменного солдата, що уособлює шляхетну Республіку.\n\nЗасудивши чотирьох чоловіків за кінець обіцяного Народного Царства, оповідь завершується загибеллю землі. Усіх чотирьох поглинає безумство під вагою власного зла, і вони кам'яніють як потворні пам'ятники своїм діянням. Та чи вціліє хтось після кінця днів, щоб пам'ятати втрачене, лишається без відповіді."
 RUS.4.a: "Моторошна оповідь."

