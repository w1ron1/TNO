 RUS_RWS_nukes_chasing_the_sun: "Наздогнати сонце"

 RUS_RWS_nukes_into_the_atomic_age_desc: "Близькі й далекі держави здавна вважали Росію відсталою країною, неосяжним степом селян-хліборобів, а десятиліття революції, розпаду та громадянської війни майже не змінили цього уявлення. Та невдовзі все зміниться.\n\nЗавдяки людським та іншим ресурсам, здобутим під час наших кампаній з возз'єднання, ми маємо змогу розпочати ядерну програму.\n\nСила атома зрівнює суперників у геополітичній грі, тож тепер ми приборкаємо її для себе."

 RUS_RWS_nukes_establish_closed_facilities_desc: "Так само як ми прагнемо розкрити таємниці атома, наші вороги прагнуть нам завадити. Існує чимало способів посилити безпеку, проте лише деякі з них дають цілковитий захист, а коли ставки такі високі, нам потрібен саме він.\n\nТому всю нашу ядерну програму - лабораторії, збагачувальні підприємства, реактори й виробничі лінії - буде зосереджено в закритих містах. Без прямого дозволу найвищих урядових кіл ніхто не зможе ні ввійти до них, ні залишити їх.\n\nЦе громіздко й дорого, але байдуже. Програма мусить бути захищеною й убезпеченою, і так воно й буде."

 RUS_RWS_nukes_a_foundation_for_research_desc: "Понад двадцять років громадянської війни, поміж іншого, майже знищили освітню інфраструктуру країни й призвели до еміграції або загибелі більшости компетентних науковців і фізиків.\n\nЯкщо ми хочемо продовжити й завершити ядерну програму, маємо це виправити. Ми не можемо чекати, доки здібні науковці самі заявлять про себе чи повернуться здалеку або доки буде відновлено передові інститути. Треба діяти.\n\nМи безпосередньо фінансуватимемо наявні університети й дослідницькі центри та пильно шукатимемо серед їхніх студентів відданих і здібних кандидатів, яких можна залучити до нашої програми розробок."

 RUS_RWS_nukes_address_the_uranium_problem_desc: "Росія - справді неосяжна країна з величезними запасами різноманітних ресурсів. Однак, наскільки нам відомо, уран, на жаль, до них не належить. Без стабільного й надійного постачання урану не буде ані програми, ані бомби.\n\nТому ми мусимо докласти всіх зусиль, аби якнайшвидше знайти таке джерело. Хай чого це коштуватиме, ми знайдемо нові запаси розщеплюваного матеріалу."

 RUS_RWS_nukes_expand_the_dalur_mines_desc: "Наші пошуки додаткових внутрішніх джерел урану дали плоди. На схід від Уралу, поблизу міста Курґан, геодезисти нібито виявили величезне родовище урану, готове до розробки.\n\nЩоб дістатися до покладів, доведеться з нуля створити цілий гірничодобувний комплекс та всю супутню інфраструктуру. Потрібні зусилля будуть величезними, а витрати - ще більшими, але це не має значення - нам потрібен цей уран!"

 RUS_RWS_nukes_source_foreign_materials_desc: "Якщо ми не знайдемо в країні достатньо урану для нашої програми, доведеться шукати деінде. По всьому світу буде розіслано законних і не зовсім законних агентів для вивчення та перевірки як відомих, так і гаданих родовищ урану.\n\nМи дістанемо цей матеріал, хай доведеться його купити, виміняти чи вкрасти. Програма мусить тривати, а бомбі байдуже, звідки походить її начиння."

 RUS_RWS_nukes_chasing_the_sun_desc: "До створення придатної до застосування ядерної зброї ще далеко, проте ми успішно збудували інфраструктуру, яка зрештою дасть нам її.\n\nНаші лабораторії та дослідницькі об'єкти збудовано й захищено. Наші освітні заклади випускають науковців із потрібними навичками. Наші відомства забезпечили внутрішні та зовнішні джерела розщеплюваних матеріалів. Залишилося лише чекати.\n\nКоли настане той день і ми проведемо перше ядерне випробування, то зможемо пишатися як своїми досягненнями, так і тим, що [GetRussiaNameNuke] нарешті, після неймовірно довгого очікування, звільниться від зовнішнього втручання."

