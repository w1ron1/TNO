 Madagascar_state_desc.1857: "Також відомий як Махадзанга, Маджунга - другий за величиною порт Мадагаскару та колишня столиця провінції Маджунга. Тут проживають народ сакалава, індійська меншина, а також розташований аеропорт Амборові." # Majunga
 Madagascar_state_desc.1969: "З'єднана залізницею з Морамангою, Амбатундразака була заснована завоюванням Радами I. Місце розташування місцевого палацу, в'язниці та губернаторства, вона також є домівкою народу сіханака." # Ambatondrazaka
 Madagascar_state_desc.944: "Також відомий як Туамасіна, Таматаве - найбільший порт на острові. Домівка народу бецимісарака, осідок іноземних консульств та однієї з чотирьох католицьких архідієцезій, це місто має загальнонаціональне значення." # Tamatave
 Madagascar_state_desc.945: "Колишня столиця Мадагаскару та його культурний центр, Тананаріве також відомий як Антананаріву. Заселене переважно гірським народом мерина, це дуже щільне й багате на зручності місто завдяки століттям централізації. Це також\nосідок однієї з чотирьох архідієцезій країни." # Antananarivo
 Madagascar_state_desc.1970: "Мораманга, що малагасійською приблизно означає 'найдешевші раби', - місце першого повстання 1947 року. Розташована на залізничному вузлі й домівка народу безанузану, за чутками в цьому районі є значні поклади нікелю та кобальту." # Moramanga
 Madagascar_state_desc.1974: "Амбусітра - домівка народу бецілео. Крім того, вона також відома своїми славетними виробами з дерева, що є спеціалізацією племені зафіманірі." # Ambositra
 Madagascar_state_desc.1975: "Заснована Ранавалуною I як регіональна столиця після її південного завоювання, Фіанаранцуа колись була столицею однойменної провінції. Сьогодні це відправна точка залізниці Фіанаранцуа та домівка народу бецілео." # Fianarantsoa
 Madagascar_state_desc.1860: "У Манакарі розташований кінцевий пункт важливої залізниці Фіанаранцуа. Регіон є домівкою народу антемуру та місцем розташування місцевих кустарних паперових фабрик." # Manakara
 Madagascar_state_desc.946: "Порт Тулеар, колишня столиця своєї провінції, також відомий як Толіара, - нервовий центр французького Мадагаскару. Портове місто, домівка народу везу, також є осідком однієї з чотирьох архідієцезій Мадагаскару." # Tulear

 Madagascar_factionalism_USA_JAP: "Фракційність §YМалагасійського повстання§!:\nНа користь §D[USA.GetNameWithFlag]§!: [?global.Madagascar_USA_influence|%%Y]\nНа користь §S[JAP.GetNameWithFlag]§!: [?global.Madagascar_JAP_influence|%%Y]"
 Madagascar_factionalism_USA_JAP_delayed: "Якщо повстання має тріумфувати, найбільш впливова фракція очолить новостворений уряд. Хоча повстання об'єднане проти правління Пакту, підтримка американців та японців розділяє повстанців.\nЧерез незаконну підтримку Америки малагасійцям, вони §Runable to send direct support§!, залишаючи Імперію Японії нести тягар місцевої допомоги."

 Madagascar_factionalism_GER_FRA: "Фракційність §YФранцузького Мадагаскару§!:\nНа користь §j[GER.GetFlag] Третього Райху§!: [?global.Madagascar_GER_influence|%%Y]\nНа користь §B[FRA.GetNameWithFlag]§!: [?global.Madagascar_FRA_influence|%%Y]"
 Madagascar_factionalism_GER_FRA_delayed: "Хоча французький Мадагаскар є де-факто французьким, більшість роботи на місцях є відповідальністю німців. Отже, підтримка в уряді між французами та німцями не лише присутня, але й суперечить одна одній."

 Madagascar_investment_tt: "§Y[ROOT.GetFlag]Наші інвестиції§! у конфлікт — це [?Madagascar_investment|%%Y]"
 Madagascar_investment_tt_delayed: "Наші інвестиції представляють обсяг, до якого ми присвятили наші можливості конфлікту.\n§YІнвестиції можуть бути використані для стратегічних рішень на пізніх етапах конфлікту.§!"

 Madagascar_contribution_tt: "§Y[ROOT.GetFlag]Наш внесок§! у конфлікт — це [?Madagascar_contributions|%%Y]\n§g----------\nВищий внесок збільшує бонуси до зростання нашого фракціоналізму.§!"
 Madagascar_contribution_tt_delayed: "Наш внесок представляє корисність наших інвестицій порівняно з інвестиціями нашого союзника у конфлікті.\n§YНаш внесок модифікує зростання нашого фракціоналізму[ROOT.MADFopo_Contrib_Effect]"
 MADCW_modifier_knowledge: " і підсилює ефекти, відповідні нашій стороні у§! §nМадагаскарському§!§Y національному дусі §gФракційного Об'єднаного Фронту§! §Ynational spirit.§!"
 MADCW_modifier_knowledge_no: ".§!"
 USA_Madagascar_desc: "Ми незаконно залучилися до мадагаскарського повстання. Абсурдно, але це втручання через підтримку нашого японського ворога, який бореться проти Райху. Ми повинні забезпечити постачання і радників таким чином, щоб зруйнувати Німеччину тут, не зміцнюючи\nзанадто сильно японців — або не дозволяючи\nіншим дізнатися про наші дії."
 JAP_Madagascar_desc: "Політика створює дивних союзників. Борючись за звільнення народів Мадагаскару від імперіалізму, ми покладаємося на допомогу та розвідку американців. Ми повинні використовувати ці дані таким чином, щоб це приносило користь нам, обмежуючи американський\nвплив настільки, наскільки можливо."
 GER_Madagascar_desc: "Хоча Мадагаскар юридично належить Франції, це Великий Ґерманський Райх підтримував порядок до останнього повстання. Цю невдачу використовують інші світові держави, особливо японці. Ми\nне можемо дозволити собі втратити регіон; ми боротимемося до останнього мадагаскарця, щоб зберегти контроль."

