################## Malaya
 USA_MLY_aid_category_desc: "Після нашої поразки у Другій світовій війні на Тихому океані з'явилася хвиля, що складається з так званої Сфери співпроцвітання Японії. Проте нещодавно з'явилася можливість з війною охопленого регіону Малаї. Після десятиліть окупації японськими загарбниками малайський народ спостерігав, як уряд змінювався між колабораціоністами та повстанцями, і вів невпинну партизанську кампанію проти японських окупантів.\n\n25-а армія, що розміщена там японцями, розпочала останній відчайдушний наступ у надії знищити присутність повстанців у регіоні раз і назавжди. Це призвело до того, що повстанці звернулися до нас у пошуках допомоги для перемоги над японцями.\n\nПопри наші очевидні ідеологічні розбіжності, можливість, яку надає Малайя, безмежна. Ми нарешті зможемо вдарити по них у найбільш уразливих місцях, і якщо зірки зійдуться, ми зможемо знищити Криваву Хвилю шматок за шматком, і спостерігатимемо, як їхня славетна Сфера руйнується на наших очах."

