SalvadoranCoup_Factionalism_Castrists_Title_tt_delayed: "Кубинська революція надихнула антиамериканську, реформістську фракцію сальвадорської армії. Тепер Пуерто-Плата забезпечила їх загартованими ветеранами Карибського легіону. Поки робітники та селяни протестують проти вкоріненої кавової олігархії, вигнанці Оскар Осоріо та Рубен Алонсо Росалес прагнуть повести їх до національного визволення."
