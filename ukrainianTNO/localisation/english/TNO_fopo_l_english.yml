  JAP_WAC_retrofit_fishers_desc: "У Камеруна може й немає справжнього флоту, а створення такого зайняло б роки, але вони все ж можуть загрожувати окремим кораблям ОВН біля берегів торпедними катерами. Озброївши деякі риболовецькі та цивільні судна торпедами й кулеметами, модернізувавши їх двигуни та забезпечивши захист, ми суттєво послабимо операції ОВН у затоці Гвінеї."
