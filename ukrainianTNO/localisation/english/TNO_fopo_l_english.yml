################## Mozambique
 USA_GZCW_PW_desc_mondlane: "Політика робить дивних поплічників, і у світі конфлікту супердержав, що ведеться через проксі, деякі поплічники можуть бути дивнішими, ніж інші. Це добре демонструється в Мозамбіку. Едуардо Мондлане не є типовим американським проксі, він відкритий соціяліст, націоналіст і різко критично ставиться до холодної війни, що ведеться по всьому третьому світу. Відносини в найкращі часи напружені, і немає ілюзій щодо того, де лежать його справжні лояльності.\n\nПроте, коли Мозамбік тисне під вагою воюючих фракцій, Токіо уважно спостерігає. Мондлане представляє найкращі шанси Америки на те, щоб утримати цю частину Африки поза сферою впливу. Навіть якщо це означає передати її в руки нейтралів.\n\nЗнищення становить: §R[?ZZZ.mozambique_devastation|2]%§!\nМінімальне зростання становить: §R[?ZZZ.mozambique_devastation_exponential_min]%§!\nМаксимальне зростання становить: §R[?ZZZ.mozambique_devastation_exponential_max]%§!\n\nКожні 3 тижні знищення буде зростати на величину між мінімальним і максимальним. Якщо знищення перевищить 100%, громадянська війна в Мозамбіку зупиниться, і супердержави будуть змушені відступити."
 USA_GZCW_PW_desc_simango: "Мозамбік тисне під кривавою тінню громадянської війни. Конкурентні інтереси та криваві суперечності виходять з закритих кімнат на вулиці міст і сільські рівнини, неминуче привертаючи увагу супердержав, що прагнуть використовувати національну трагедію для міжнародної вигоди.\n\nУрія Сіманго не очолює ні найсильнішу, ні найбільшу фракцію у конфлікті, але те, чого не вистачає в силі, компенсується гнучкістю. Важко покладаючись на підтримку Америки, перемога Сіманго означатиме не лише утримання Японії подалі від Африки, але й забезпечення місця Мозамбіку у рядах Вільного Світу.\n\nЗнищення становить: §R[?ZZZ.mozambique_devastation|2]%§!\nМінімальне зростання становить: §R[?ZZZ.mozambique_devastation_exponential_min]%§!\nМаксимальне зростання становить: §R[?ZZZ.mozambique_devastation_exponential_max]%§!\n\nКожні 3 тижні знищення буде зростати на величину між мінімальним і максимальним. Якщо знищення перевищить 100%, громадянська війна в Мозамбіку зупиниться, і супердержави будуть змушені відступити."
 JAP_GZCW_PW_desc: "Мозамбік впав у хаос після перемоги Самори Машела на виборах молодої нації. Самора Машел - соціяліст, і він далеко не справжній друг Японії, але ми вже досягли з ним угоди про допомогу у відновленні його розбитої нації в обмін на економічні та політичні поступки. Американці безсумнівно підтримають опозицію, яка піднялася в збройному конфлікті, намагаючись скинути Машела і встановити свого диктатора на його місце, тому нам випадає обов'язок захистити режим Машела та наші інтереси не лише в Мозамбіку, а й по всій Африці, зокрема зменшуючи вплив янкі в Африці.\n\nЗнищення становить: §R[?ZZZ.mozambique_devastation|2]%§!\nМінімальне зростання становить: §R[?ZZZ.mozambique_devastation_exponential_min]%§!\nМаксимальне зростання становить: §R[?ZZZ.mozambique_devastation_exponential_max]%§!\n\nКожні 3 тижні знищення буде зростати на величину між мінімальним і максимальним. Якщо знищення перевищить 100%, громадянська війна в Мозамбіку зупиниться, і супердержави будуть змушені відступити."

