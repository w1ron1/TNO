  JAP_WAC_offensive_cote_divorie_desc: "Ми підготуємо те, що сподіваємося, стане останньою офензивою, щоб вибити Вільну Францію з цієї війни. Взявши під контроль Кот-д'Івуар, рудиментарна імперіалістична держава Франції, безсумнівно, не зможе продовжувати існування, а її союзники, безсумнівно, впадуть разом із нею."
  JAP_WAC_offensive_cote_divorie_stagnate: "Фронт у Кот-д'Івуарі стагнує"

