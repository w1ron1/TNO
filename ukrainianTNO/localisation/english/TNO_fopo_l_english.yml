 ## Generic Ideas
 JAP_Plane_Bombing: "Японські бомбардувальні рейди"
 JAP_Plane_Bombing_desc: "Спалах війни з японським маріонетковим урядом призвів до того, що японські ВПС обрушили свою лють на нас. Бомби падають на критичну інфраструктуру та військові об'єкти, і наша здатність до опору в повітрі мінімальна.\n\nЦе порушить організацію наших сил і завдасть шкоди внутрішній підтримці війни, але у нас майже немає вибору, окрім як продовжувати і сподіватися, що цей обстріл не ескалюється далі."
 JAP_military_advisors: "Японські військові радники"
 JAP_military_advisors_desc: "Наші друзі з Японії вирішили надіслати радників з Імператорської армії Японії для підтримки наших збройних сил у поточному конфлікті. Завдяки їхній підтримці ми побачимо значне покращення загальної ефективності наших солдатів, а також навчимося важливих уроків з сучасної війни, що підвищить ефективність наших збройних сил у майбутньому."
 JAP_technician_aid: "Японська технічна допомога"
 JAP_technician_aid_desc: "Японія вирішила надіслати техніків для підтримки нашого зусилля у війні, і ми вже бачимо значні переваги у ряді різних сфер нашої армії та економіки. Ми можемо лише сподіватися, що така допомога буде продовжувати надходити."
 JAP_sabotage_effort: "Японська диверсійна діяльність"
 JAP_sabotage_effort_desc: "Спалах війни з японським маріонетковим урядом призвів до того, що японські шпигуни були розгорнуті проти нас. Хвиля саботажу охопила нашу країну, коли їхні агенти почали красти державні секрети, саботувати військові операції та вбивати чиновників.\n\nЦе завдає шкоди зусиллям у війні не лише через прямі наслідки саботажу, але й через параною, що охопила наш уряд, оскільки наші власні агенти намагаються запобігти подальшій шкоді."

 JAP_partisan_attacks: "Координовані партизанські атаки"
 JAP_partisan_attacks_desc: "Партизанські атаки проводяться з тривожною частотою та ефективністю за нашими лініями. Вони націлюються на наші концентрації військ та лінії постачання, що заважає нашій здатності постачати війська і ефективно утримувати позиції. Висококонцентровану природу цих атак очевидно підтримують японські розвідслужби, що передають розвіддані цим групам. Ми зможемо вигнати їх, але до тих пір повинні залишатися пильними."

 JAP_army_infiltration: "Інфільтрована армія"
 JAP_army_infiltration_desc: "Нашу армію інфільтрувала японська розвідка. Через хабарі чи примус, низка наших високопоставлених офіцерів передає розвідувальні дані нашим ворогам. Доки ми не викоренимо цих шпигунів, наша здатність планувати наступи та координувати рух військ буде обмежена."

 JAP_military_advisors_dynmod: "Японські військові радники"
 JAP_technician_aid_dynmod: "Японська технічна допомога"
 JAP_sabotage_effort_dynmod: "Японська диверсійна діяльність"

 USA_Plane_Bombing: "Американські бомбардувальні рейди"
 USA_Plane_Bombing_desc: "Спалах війни з американським маріонетковим урядом призвів до того, що ВПС США обрушили свою лють на нас. Бомби падають на критичну інфраструктуру та військові об'єкти, і наша здатність до опору в повітрі мінімальна.\n\nЦе порушить організацію наших сил і завдасть шкоди внутрішній підтримці війни, але у нас майже немає вибору, окрім як продовжувати і сподіватися, що цей обстріл не ескалюється далі."
 USA_military_advisors: "Американські військові радники"
 USA_military_advisors_desc: "Наші друзі з США вирішили надіслати військових радників для підтримки наших збройних сил. Завдяки їхній підтримці ми побачимо значне покращення загальної ефективності наших солдатів, а також навчимося важливих уроків з сучасної війни, що підвищить ефективність наших збройних сил у майбутньому."
 USA_technician_aid: "Американська технічна допомога"
 USA_technician_aid_desc: "Сполучені Штати вирішили надіслати техніків для підтримки нашого зусилля у війні, і ми вже бачимо значні переваги у ряді різних сфер нашої армії та економіки. Ми можемо лише сподіватися, що така допомога буде продовжувати надходити."
 USA_sabotage_effort: "Американська диверсійна діяльність"
 USA_sabotage_effort_desc: "Спалах війни з американським маріонетковим урядом призвів до того, що ЦРУ були розгорнуті проти нас. Хвиля саботажу і параної охопила нашу країну, коли їхні агенти почали красти державні секрети, саботувати військові операції та вбивати чиновників.\n\nЦе завдає шкоди зусиллям у війні не лише через прямі наслідки саботажу, але й через параною, що охопила наш уряд, оскільки наші власні агенти намагаються запобігти подальшій шкоді."
 USA_rules_of_engagement: "Дотримання правил застосування сили"
 USA_rules_of_engagement_desc: "Правила застосування сили - це набір внутрішніх правил і політик, що визначають, як, коли і де солдат може застосовувати силу. Під час наших інтервенцій за кордоном президент видав наказ міністру оборони, щоб ці правила були оновлені та суворіше виконувались. Хоча деякі критикують цей крок, вважаючи, що він змушує армію воювати «з однією рукою за спиною», інші вірять, що це обмежить можливі звірства і збереже репутацію США вдома і за кордоном."
 USA_War_Immigrants: "Військові біженці"
 USA_War_Immigrants_desc: "Коли війна розгоряється, Вашингтон не далеко. Хоча ми відкидаємо хвилю фашизму та імперіалізму, це має свої наслідки. Наші проксі-війни призвели до того, що тисячі біженців стікаються до Америки. Хоча ми можемо отримати більше людей, соціальна напруга через кризу біженців не повинна бути недооцінена. Однак Америка неможлива без іммігрантів. Як каже статуя Свободи:\n\n'Дайте мені ваших втомлених, ваших бідних, ваші скупчені маси, що прагнуть дихати вільно.'"

 USA_military_advisors_dynmod: "Американські військові радники"
 USA_technician_aid_dynmod: "Американська технічна допомога"
 USA_sabotage_effort_dynmod: "Американська диверсійна діяльність"
 
 MEX_Plane_Bombing: "Мексиканські бомбардувальні вильоти"
 MEX_Plane_Bombing_desc: "Спалах війни з мексиканською маріонеткою накликав на нас гнів мексиканських ВПС. Бомби зливою падають на критичну інфраструктуру та військові об'єкти, а наша здатність чинити опір у повітрі мінімальна.\n\nЦе порушить організацію наших сил і завдасть шкоди внутрішній підтримці воєнних зусиль, але нам не лишається нічого, крім як продовжувати і сподіватися, що це бомбардування не ескалює далі."
 MEX_military_advisors: "Мексиканські військові радники"
 MEX_military_advisors_desc: "Наші друзі в Мексиці визнали за доцільне відправити військових радників на допомогу нашим збройним силам. З їхньою підтримкою ми побачимо значне покращення загальної ефективності наших солдатів, а також засвоїмо важливі уроки сучасної війни, які покращать ефективність наших збройних сил у майбутньому."
 MEX_technician_aid: "Мексиканська технічна допомога"
 MEX_technician_aid_desc: "Мексика визнала за доцільне відправити технічних спеціалістів на допомогу нашим воєнним зусиллям, і ми вже бачимо значні переваги в цілому ряді різних сфер нашої армії та економіки. Можемо лише сподіватися, що така допомога надходитиме й надалі."
 MEX_sabotage_effort: "Мексиканські диверсійні зусилля"
 MEX_sabotage_effort_desc: "Спалах війни з мексиканською маріонеткою призвів до того, що проти нас спустили DFS. Хвиля саботажу та параної прокотилась нашою країною, поки їхні агенти взялися за крадіжку державних таємниць, саботаж військових операцій та вбивства посадовців.\n\nЦе завдає шкоди воєнним зусиллям не лише через прямі наслідки саботажу, але й через параною, що охопила наш уряд, поки наші власні агенти намагаються запобігти подальшій шкоді."

 GER_Plane_Bombing: "Нальоти німецької авіації"
 GER_Plane_Bombing_desc: "Спалах війни з німецьким маріонетковим режимом призвів до того, що люфтваффе обрушила свій гнів на нас. Бомби падають на критичну інфраструктуру та військові об'єкти, а наша здатність чинити опір у повітрі мінімальна.\n\nЦе порушить організацію наших сил і підірве підтримку війни серед населення, але у нас майже немає вибору, окрім як продовжувати боротьбу і сподіватися, що цей бомбардувальний наступ не набуде більшої інтенсивності."
 GER_military_advisors: "Німецькі військові радники"
 GER_military_advisors_desc: "Наші друзі в Райху визнали за потрібне надіслати радників з Вермахту для допомоги нашим збройним силам у нинішньому конфлікті. З їхньою підтримкою ми побачимо значне покращення загальної ефективності наших солдатів, а також здобудемо важливі уроки сучасної війни, що підвищить ефективність наших збройних сил у майбутньому."
 GER_technician_aid: "Німецька технічна допомога"
 GER_technician_aid_desc: "Райх вирішив надіслати технічних спеціалістів, щоб допомогти нашій військовій кампанії, і ми вже бачимо значні переваги в різних аспектах нашої армії та економіки. Ми можемо лише сподіватися, що така допомога продовжуватиметься й надалі."
 GER_sabotage_effort: "Німецькі диверсійні зусилля"
 GER_sabotage_effort_desc: "Початок війни з німецькою маріонеткою призвів до активізації Абверу проти нас. Хвиля саботажу прокотилася нашою країною, коли їхні агенти почали викрадати державні секрети, саботувати військові операції та вбивати посадових осіб.\n\nЦе завдає шкоди воєнним зусиллям не лише через прямі наслідки саботажу, але й через параною, що охопила наш уряд, коли наші агенти намагаються запобігти подальшим атакам."
 GER_Wehrmacht_Technicians: "Техніки Вермахту"
 GER_Wehrmacht_Technicians_desc: "Райх вирішив надіслати армійських техніків, щоб допомогти нашій військовій кампанії, і ми вже бачимо значні переваги в різних аспектах нашої армії та економіки. Ми можемо лише сподіватися, що така допомога продовжуватиметься й надалі."

 GER_military_advisors_dynmod: "Німецькі військові радники"
 GER_technician_aid_dynmod: "Німецька технічна допомога"
 GER_sabotage_effort_dynmod: "Німецькі диверсійні зусилля"

 IBR_Air_Attacks: "Іберійські повітряні атаки"

 IBR_Army_Engineers: "Іберійські військові інженери"
 IBR_Army_Engineers_desc: "Уряд Іберії почав відправляти своїх спеціалістів з армійської інженерії до нашої країни, щоб підвищити нашу слабку промислову продуктивність. Це допоможе нам виробляти більше важливого озброєння."
 IBR_Air_Sorties: "Іберійські повітряні вильоти"
 IBR_Air_Sorties_desc: ""
 IBR_sabotage_effort: "Іберійські диверсійні зусилля"
 IBR_sabotage_effort_desc: "Спалах війни з іберійською маріонеткою призвів до того, що проти нас спустили іберійську таємну службу. Хвиля саботажу прокотилась нашою країною, поки їхні агенти взялися за крадіжку державних таємниць, саботаж військових операцій та вбивства посадовців.\n\nЦе завдає шкоди воєнним зусиллям не лише через прямі наслідки саботажу, але й через параною, що охопила наш уряд, поки наші власні агенти намагаються запобігти подальшій шкоді."
 IBR_military_advisors: "Іберійські військові радники"
 IBR_military_advisors_desc: "Наші друзі в Іберії визнали за доцільне відправити військових радників на допомогу нашим збройним силам у поточному конфлікті. З їхньою підтримкою ми побачимо значне покращення загальної ефективності наших солдатів, а також засвоїмо важливі уроки сучасної війни, які покращать ефективність наших збройних сил у майбутньому."
 
 BRA_Plane_Bombing: "Бразильські бомбардування"
 BRA_Plane_Bombing_desc: "Початок війни з бразильською маріонеткою призвів до ударів з боку ВПС Бразилії. Бомби падають на критичну інфраструктуру та військові об'єкти, і наші можливості для протидії в повітрі мінімальні.\n\nЦе порушить організацію наших сил та підірве підтримку війни з боку населення, але ми не маємо іншого вибору, як продовжувати боротьбу та сподіватися, що бомбардування не ескалує далі."
 BRA_military_advisors: "Бразильські військові радники"
 BRA_military_advisors_desc: "Наші друзі в Бразилії вирішили надіслати радників з армії Бразилії, щоб допомогти нашим збройним силам у поточному конфлікті. Завдяки їхній підтримці ми побачимо значне поліпшення загальної ефективності наших солдатів, а також отримаємо важливі уроки з сучасної війни, що підвищить ефективність наших збройних сил у майбутньому."
 BRA_technician_aid: "Бразильська технічна допомога"
 BRA_technician_aid_desc: "Бразилія вирішила надіслати техніків, щоб допомогти нашій військовій кампанії, і ми вже бачимо значні переваги в різних аспектах нашої армії та економіки. Ми можемо лише сподіватися, що така допомога продовжуватиметься й надалі."
 BRA_sabotage_effort: "Бразильські диверсійні зусилля"
 BRA_sabotage_effort_desc: "Початок війни з бразильським союзником призвів до активізації бразильської розвідки проти нас. Хвиля саботажу охопила нашу країну, коли їхні агенти почали викрадати державні секрети, саботувати військові операції та вбивати посадових осіб.\n\nЦе завдає шкоди воєнним зусиллям не лише через прямі наслідки саботажу, але й через параною, що охопила наш уряд, коли наші агенти намагаються запобігти подальшим атакам."

 TUR_military_advisors: "Турецькі військові радники"
 TUR_military_advisors_desc: "Наші друзі в Туреччині визнали за доцільне відправити військових радників на допомогу нашим збройним силам. З їхньою підтримкою ми побачимо значне покращення загальної ефективності наших солдатів, а також засвоїмо важливі уроки сучасної війни, які покращать ефективність наших збройних сил у майбутньому."

 Generic_receiving_intel: "Отримання розвідданих"
 Generic_receiving_intel_desc: "Ми отримуємо розвіддані від іноземної держави щодо рухів військ і можливостей наших ворогів. Це дозволить нам ефективніше планувати наші операції для протидії конкретній загрозі, яку вони представляють."

 TNO_plane_bombing: "Ворожі бомбардування"
 TNO_plane_bombing_desc: "Початок війни з нашим ворогом призвів до ударів з повітря з боку їхніх союзників. Бомби падають на критичну інфраструктуру та військові об'єкти, і наші можливості для протидії в повітрі мінімальні.\n\nЦе порушить організацію наших сил та підірве підтримку війни з боку населення. Хоча ми не можемо конкурувати з ними в небі, найкращий варіант — покладатися на імпортовані MANPADS, щоб зменшити потенційні збитки."

 proxy_war_increase_bombing_effectiveness_tt: ":\nЕфекти §YВорожих бомбардувань§! проти §Y[THIS.GetNameWithFlag]§! будуть §Gincreased§!."
 proxy_war_reduce_bombing_effectiveness_tt: ":\nЕфекти §YВорожих бомбардувань§! проти §Y[THIS.GetNameWithFlag]§! будуть §Greduced§!."
 proxy_war_reduce_bombing_effectiveness_large_tt: ":\nЕфекти §YВорожих бомбардувань§! проти §Y[THIS.GetNameWithFlag]§! будуть §Gsignificantly reduced§!."
 proxy_war_worsen_poverty_tt: "§sРівень бідності§! почне §Rrapidly worsen§!."

# Mano Campaign
USA_mano_campaign_desc: "Західна Африка перетворилася з кризи на справжню катастрофу! Було вже погано бачити кольори PALF, що замаскувалися під сонце rising, що майорять над руїнами демократичних націй, яких ми не змогли захистити. Тепер кровожерливі слуги Японії скористалися нафтовою кризою, щоб продовжити свої зусилля по 'визволенню', нападаючи на Сьєрра-Леоне та Ліберію.\n\nЦі дві нації, якими б недосконалими вони не були, є єдиними друзями ОФН в регіоні. Альтернатива перемозі в цій війні - абсолютна японська домінація в Західній Африці та її величезні ресурси. Америка не буде стояти осторонь, поки рабство знову накладається на африканців — поразка неможлива!"
JAP_mano_campaign_desc: "Наші спільники по антиімперіалізму, Пан-африканський фронт визволення, досягли великих успіхів у Західній Африці; їхнє перемогу над 'Вільними' французами, навіть за підтримки ОФН, довела справедливість нашої справи. Західний жадібність не може зрівнятися з озброєним гнівом поневолених. Тепер, коли нафтову кризу охоплено, і PALF залишився відносно недоторканим, вони скористалися можливістю і нанесли удар по останнім бастіонам імперіалізму: Сьєрра-Леоне та Ліберії.\n\nЯк ми, так і ОФН страждають від нафтової кризи, але американці все ж витратили все, що могли на конфлікт. Якщо PALF зараз програє, Західна Африка продовжить бути під загрозою колоніального чобота - ми не можемо дозволити цього. Один останній крок, щоб витіснити імперіалістів, і регіон буде остаточно звільнений… і міцно в нашій сфері."

 Mano_state_scorched_earth_modifier: "Випалена земля"
 Mano_state_scorched_earth_modifier_desc: "Ми не можемо самі відбити напад PALF, а наші союзники знаходяться за океаном. Ворог не залишив нам вибору: якщо наша нація має вижити, ми повинні виграти час будь-яким способом, навіть якщо нам доведеться знищити всі дороги, спалити всі посіви і зруйнувати всі будівлі, що ось-ось впадуть, ЩОБ-ЛИШЕ уповільнити напад PALF хоча б на годину.\n\nБоже, прости нас, бо червоні цього не зроблять."

