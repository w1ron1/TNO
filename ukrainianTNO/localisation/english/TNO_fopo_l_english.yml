 # GUI tooltips, explanations, etc
 MAD_involvement_text: "[get.MADWARLEVEL]"
 MAD_WAR_LVL1: "ЕТАП 1: §YПОГІРШЕННЯ§!"
 MAD_WAR_LVL1_desc: "§YКОРОТКИЙ ЗВІТ ПРО СТАН КОНФЛІКТУ§!: З огляду на те, що Мадагаскар §Rзанурюється в хаос§!, ми повинні встановити наш власний контроль, щоб відновити форму порядку перед початком боїв. Це досягається шляхом збільшення контролю в §Yстратегічних вузлах§!, які не контролює жоден уряд. Коли ми отримаємо достатній контроль над одним вузлом, ми зможемо §Gзапустити контрповстання§!, щоб розширити контроль підтримуваної нами фракції.\n\n§YЗАГАЛЬНИЙ СТАН КОНФЛІКТУ§!: §nДруге мадагаскарське повстання§! привернуло увагу трьох світових наддержав. Через обставини війни кожна задіяна нація надає підтримку своїй вибраній фракції по-різному.\n§g[GER.GetNameWithFlag]§!, як де-факто власник острова, може негайно втрутитися, надаючи логістичну підтримку для §Qмісцевого уряду§!, контролюючи стратегічні вузли та відправляючи дивізії, коли війна ескалює.\n§M[USA.GetNameWithFlag]§! незаконно залучена в конфлікт. Через це американська підтримка §Yобмежується постачанням зброї та логістичною допомогою§! для захоплення стратегічних вузлів.\n§e[JAP.GetNameWithFlag]§! відкрито підтримує §nмадагаскарських повстанців§! і, дивно, співпрацює з §MСполученими Штатами§! у цьому конфлікті. Японська підтримка є більш прямою, ніж американська, і зможе відправити дивізії та військову допомогу на пізніших етапах війни."
 MAD_WAR_LVL1_advance: "§YЕСКАЛАЦІЯ§!: Конфлікт §Gпродовжиться§! з §YПОГІРШЕННЯ§!, коли стратегічні вузли на карті будуть всі захоплені або учасник втратить можливість брати участь у конфлікті далі."
 MAD_WAR_LVL2: "ЕТАП 2: §YКОНФЛІКТ§!"
 MAD_WAR_LVL2_desc: "§YКОРОТКИЙ ЗВІТ ПРО СТАН КОНФЛІКТУ§!: Тепер, коли протиборчі уряди Мадагаскару мають офіційне становище на острові, §Rвійськові дії стали можливими для управління§!. Більшість бойових дій зосереджена на §Gпокращенні стратегічного контролю уряду на острові§!, одночасно §Oзахоплюючи територію без урядових сил§! через колапс авторитету.\n\n§YЗАГАЛЬНИЙ СТАН КОНФЛІКТУ§!: §nДруге мадагаскарське повстання§! привернуло увагу трьох світових наддержав. Через обставини війни кожна задіяна нація надає підтримку своїй вибраній фракції по-різному.\n§g[GER.GetNameWithFlag]§!, як де-факто власник острова, може негайно втрутитися, надаючи логістичну підтримку для §Qмісцевого уряду§!, контролюючи стратегічні вузли та відправляючи дивізії, коли війна ескалює.\n§M[USA.GetNameWithFlag]§! незаконно залучена в конфлікт. Через це американська підтримка §Yобмежується постачанням зброї та логістичною допомогою§! для захоплення стратегічних вузлів.\n§e[JAP.GetNameWithFlag]§! відкрито підтримує §nмадагаскарських повстанців§! і, дивно, співпрацює з §MСполученими Штатами§! у цьому конфлікті. Японська підтримка є більш прямою, ніж американська, і зможе відправити дивізії та військову допомогу на пізніших етапах війни."
 MAD_WAR_LVL2_advance: "§YЕСКАЛАЦІЯ§!: Конфлікт §Gпродовжиться§! з §YКОНФЛІКТУ§!, коли всі стратегічні коридори на карті будуть захоплені одним з учасників."
 MAD_WAR_LVL3: "ЕТАП 3: §YВОЄННІ ДІЇ§!"
 MAD_WAR_LVL3_desc: "§YКОРОТКИЙ ЗВІТ ПРО СТАН КОНФЛІКТУ§!: З організацією формального правління обома урядами на острові, справжнє §Rсуперництво за острів Мадагаскар§! почалося. Ця фаза є більш традиційною, з більшістю §Yвтручання іноземних держав, спрямованих на військову підтримку§!, а не стратегічну.\n\n§YЗАГАЛЬНИЙ СТАН КОНФЛІКТУ§!: §nДруге мадагаскарське повстання§! привернуло увагу трьох світових наддержав. Через обставини війни кожна задіяна нація надає підтримку своїй вибраній фракції по-різному.\n§g[GER.GetNameWithFlag]§!, як де-факто власник острова, може негайно втрутитися, надаючи логістичну підтримку для §Qмісцевого уряду§!, контролюючи стратегічні вузли та відправляючи дивізії, коли війна ескалює.\n§M[USA.GetNameWithFlag]§! незаконно залучена в конфлікт. Через це американська підтримка §Yобмежується постачанням зброї та логістичною допомогою§! для захоплення стратегічних вузлів.\n§e[JAP.GetNameWithFlag]§! відкрито підтримує §nмадагаскарських повстанців§! і, дивно, співпрацює з §MСполученими Штатами§! у цьому конфлікті. Японська підтримка є більш прямою, ніж американська, і зможе відправити дивізії та військову допомогу на пізніших етапах війни."
 MAD_WAR_LVL3_advance: "§YЕСКАЛАЦІЯ§!: Конфлікт §Gпродовжиться§! з §YВОЄННИХ ДІЙ§!, коли одна сторона не зможе витримати тиск конфлікту далі."
