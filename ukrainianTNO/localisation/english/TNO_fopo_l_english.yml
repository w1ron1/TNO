JAP_CCW_desc: "Колумбія лежить в руїнах; крихкий мир, заморожена війна, яка тривала в країні останнє десятиліття, розтанули, і колумбійці знову борються за те, у що вірять, з ножем і гвинтівкою. Колумбія лежить прямо у дворі Сполучених Штатів, і ми маємо унікальну можливість принизити їх на їхній території. Підтримуючи уряд Нової Гранади проти так званого законного уряду та соціялістів Революційного союзу, ми можемо створити союзну націю в Латинській Америці – прямо поруч зі Сполученими Штатами. Важливо, щоб ми не упустили цю можливість."

JAP_colombia.1.t: "Долини мертвих"
JAP_colombia.1.d: "До Офісу Прем'єр-міністра,\n\nЗ моменту нещасної загибелі президента Гайтан в 1954 році південноамериканська країна Колумбія перебуває у стані громадянської війни та конфліктів, з єдиною тонкою угодою про припинення вогню, яка стримує ситуацію. В країні розповсюджені банди, корумповані лідери, комуністи та інші загрози. Сполучені Штати, так званий охоронець Америк, продемонстрували свою непомітність і некомпетентність у боротьбі з хаосом. Таким чином, колумбійська криза дає нам унікальну можливість продемонструвати як силу Сфери, так і слабкість ОФН, перемігши гіганта на його власному дворі.\n\nНа щастя, ми знайшли підходящого кандидата для нашої підтримки в державі Нова Гранада. Керований відданими фашистами та італіофілами, цей штат представляє єдиний фронт націоналістів і індустріалістів, що виступають проти уряду, комуністів та американців. Багато з їхніх рядів високо оцінюють нашу імперію і були б раді нашій підтримці. Для цього рекомендується відправити військових радників і техніку для підготовки їхніх солдатів до краху перемир'я. Пріоритет для наших союзників - департамент Алантіко, що контролює важливий порт, через який наші геополітичні суперники намагаються постачати зброю своїм маріонеткам. Його захоплення серйозно ослабить їхні кампанії з перепостачання озброєнь.\n\nЗ вашою дозволом ми можемо почати операції негайно."
JAP_colombia.1.a: "Висхідне Сонце засяє над Андами."

JAP_colombia.2.t: "Новини з Колумбії"
JAP_colombia.2.d: "До Офісу Прем'єр-міністра,\n\nЯк і передбачалося, напруженість у Колумбії досягла такого рівня, що в північних регіонах країни почалися відкриті, хоча й обмежені, сутички. Незважаючи на те, що бої були запеклими, наші зусилля дали результат, оскільки парамілітарні сили наших союзників з Нової Гранади змогли захопити департамент Алантіко та утримати його від ворожих контратачів. Ця перемога дала їхнім військам величезний моральний імпульс і позбавила їхніх супротивників безпечних постачальних ліній — це вирішальна перемога для націоналістичної справи в Колумбії.\n\nОднак, хоча противнику було завдано серйозної поразки, наші розвіддані свідчать, що кінець конфлікту поки що не видно, і ми повинні підготувати Нову Гранаду до завершення перемир'я. Територія країни та лють ворожих партизанів створять серйозні труднощі для наших сил та союзників. Однак наші радники та контакти впевнені, що наша перемога — лише питання часу."
JAP_colombia.2.a: "Велика перемога, давайте надамо більше підтримки."

JAP_colombia.3.t: "Новини з Колумбії"
JAP_colombia.3.d: "До Офісу Прем'єр-міністра,\n\nЯк і передбачалося, напруженість у Колумбії досягла такого рівня, що в північних регіонах країни почалися відкриті, хоча й обмежені, сутички. Незважаючи на надану нами допомогу, міліції та найманці Нової Гранади були змушені відступити з департаменту Алантіко без досягнення результату. Через складну місцевість і сильний опір супротивника їхні сили не змогли подолати ворожі оборонні лінії, тому порт і постачальні лінії ворога залишаються недосяжними на цей момент.\n\nЧерез цей невдачу, ми можемо очікувати, що наші суперники продовжать постачати допомогу своїм маріонеткам без перешкод, і перед нами виникне складніше завдання. Хоча це неприємно, наші постачальні лінії для сил Нової Гранади залишаються цілими, а їхнє керівництво все ще налаштоване на перемогу над супротивником. Наші радники вдома та на місці все ще вірять, що успіх цілком можливий, і рекомендують посилити нашу підтримку у підготовці до завершення перемир'я."
JAP_colombia.3.a: "Сумно, але ми повинні закріпити наше становище."

