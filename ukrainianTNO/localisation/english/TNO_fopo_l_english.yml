# Iberia Decisions
IBR_EC_establish_smokescreen_operations: "Створити операції прикриття"
IBR_EC_establish_smokescreen_operations_desc: "Замахи. Бомбардування. Саботаж трубопроводів. Повільна інфільтрація Каракасу. Спрямуємо DFS та DIGEPOL по сліду будь-якої можливої загрози, крім військового блискавичного удару по столиці."
IBR_EC_reach_out_old_friends: "Звернутися до старих друзів"
IBR_EC_reach_out_old_friends_desc: "Перес Хіменес, венесуельський каудильйо, що став вигнанцем у Мадриді, буде щасливий розповісти нам, які офіцери найбільше незадоволені нинішнім лівим урядом."
IBR_EC_call_on_hispanic_sentiments: "Апелювати до іспаномовних почуттів"
IBR_EC_call_on_hispanic_sentiments_desc: "Значна частина населення проти безбожного лівацтва, що нині панує в Каракасі, і дивиться на Патрію як на кращий взірець. Ми запропонуємо їм це - усе, що їм треба зробити, - це відійти з дороги джипів."
IBR_EC_procurement_in_colombia: "Закупівлі в Колумбії"
IBR_EC_procurement_in_colombia_desc: "Ла Віоленсія робить зброю та боєприпаси дешевими прямо через венесуельський кордон."
IBR_EC_bribe_garrison_officers: "Підкупити офіцерів гарнізону"
IBR_EC_bribe_garrison_officers_desc: "Більшість солдатів знають, що венесуельський уряд - загроза нації. Іншим може нагадати сам болівар. Банкнота, а не Визволитель."
IBR_EC_cover_our_tracks: "Замести сліди"
IBR_EC_cover_our_tracks_desc: "Переконаймося, що за нами не стежать до наступних казарм. І вб'ємо покоївку, яка бачила, як ми заходили до попередніх."
IBR_EC_mislead_rival_agencies: "Ввести в оману ворожі агентства"
IBR_EC_mislead_rival_agencies_desc: "Венесуельці та мексиканці використовують діяльність наших агентів, щоб полювати на путчистів. Відправмо їх у безглузду погоню поблизу Гаяни."
IBR_EC_anti_guerilla_operations: "Антипартизанські операції"
IBR_EC_anti_guerilla_operations_desc: "Зусилля зі знищення комуністів ФАЛН - ідеальний привід для нашого нарощування сил. Не те щоб нам потрібен був привід."
IBR_EC_from_the_skies: "З небес"
IBR_EC_from_the_skies_desc: "Літаки дозволяють нам постачати сили Кастро Леона над надзвичайно пересіченою місцевістю Анд. Шкода лише, скільки уваги вони привертають."
IBR_EC_fuel_the_monsters: "Підживити "монстрів""
IBR_EC_fuel_the_monsters_desc: "Монкада Відаль та його болівaріаністські радикали жорстокі, дикі та галасливі. Коли змова перетворюється на переворот, дайте їм усе необхідне, щоб довести справу до кінця."
IBR_EC_emphasize_hispanic_unity: "Наголосити на іспаномовній єдності"
IBR_EC_emphasize_hispanic_unity_desc: "Багато венесуельських офіцерів глибоко поважають повалення нашої нелегітимної Республіки. Як абсолютна відданість Франко була необхідна для нашої перемоги, так абсолютна відданість Кастро Леону потрібна для їхньої."
IBR_EC_eradicate_guerillas_en_route: "Знищити партизанів по дорозі"
IBR_EC_eradicate_guerillas_en_route_desc: "До Каракасу довгий шлях, і осередки ФАЛН чигають на узбіччі. Пустіть їм кулі в голови зараз, щоб не довелося сповільнюватися пізніше."
IBR_EC_extract_assets: "Евакуювати агентів"
IBR_EC_extract_assets_desc: "Усе провалилося. Хапайте ці песети, і забираймося звідси к бісу!"

IBR_misleading_rival_agencies_tt: "Поки це рішення активне, ми не зможемо ухвалювати жодних інших рішень."
IBR_misleading_rival_agencies_active_tt: "Якщо §YВведення в оману ворожих агентств§! активне, ми не можемо ухвалювати інших рішень."
