USA_PP_preparations_tooltip: "За допомогою цих рішень ми можемо підготувати десантні сили та повстання. Кількість бригад Легіону, які ми можемо підтримати, визначається §LSupply§!."
USA_PP_ongoing_tooltip: "Ми повинні переконатися, що §LSupplies§! достатньо для підтримки Карибського Легіону до кінця кампанії, або вони отримають §negativen effects.§!"
USA_PP_ceasefire_tooltip: "За допомогою цих рішень ми можемо підготувати повстанців до сценарію громадянської війни. Чим вищий рівень £GFX_green_mbt_texticon §nPreparation§!, тим сильнішими вони будуть."

USA_PP_preparations_bottom: "Карибський Легіон наразі оснащений\n§Y[?USA.USA_PP_Army] бригадами§!. Використання більше ніж §R5 бригад§! швидше витратить постачання після висадки."
USA_PP_ongoing_bottom: "§YРезультат кампанії Карибського Легіону буде вирішено через два місяці.§!"

USA_PP_collapse_tooltip: "§RПротягом наступних двох місяців буде вирішено результат вторгнення у Пуерто-Плата...§!"

