  JAP_PHI_PW_3_desc: "Чоловіки вимагають помсти, і помста буде здійснена. 14-та армія отримала наказ повернути Філіппінські острови раз і назавжди. Кожна дрібниця була ретельно облікована, щоб нічого не пішло не так. Лінії бою намальовані, і поки що ми можемо тільки спостерігати та сподіватися на перемогу.\n\n[Get14ArmyCampaignStatus]Наразі наше постачання §Rзнижується§! з темпом §R[?JP_PHI_supply_decay]§!"
