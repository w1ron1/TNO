IBR_wac_desc_1: "Опорний пункт Європи в Західній Африці під загрозою! Під приводом "антиколоніалізму" Панафриканський фронт визволення - не більше ніж японські маріонетки, що розігрують расову політику - марширує на наших французьких союзників, а також на будь-яких африканських братів, які відкинули їхню доморощену версію імперіалізму.\n\nНаш обов'язок - і в наших найкращих інтересах - протистояти нативістам і марксистам.\n\nМи §Rескалювали§! війну на §Y[?global.WAC_escalation]%§!.\n\nНаші зв'язки з §iВільною Францією§! становлять §Y[?IBR_FFR_aid_var]%§!."
IBR_wac_desc_2: "Опорний пункт Європи в Західній Африці під загрозою! Французи та їхні союзники - наші давні друзі - оточені з усіх боків ворогами свободи. На заході й півночі: опортуністи та введені в оману, що завдають ударів по французах з усіляких дріб'язкових причин. На сході: лицемірні японські маріонетки, Панафриканський фронт визволення.\n\nМи §Rескалювали§! війну на §Y[?global.WAC_escalation]%§!.\n\nНаші зв'язки з §iВільною Францією§! становлять §Y[?IBR_FFR_aid_var]%§!."

