SalvadoranCoup_Factionalism_Hispanists_Title_tt_delayed: "Мляві зусилля президента Адальберто Рівери щодо подолання бідності та проамериканська зовнішня політика відштовхнули фракцію запеклих націоналістів-жорстких прихильників на чолі з Медрано та Фаустіно Сосою. Тепер його нездатність придушити народну революцію в сільській місцевості дала їм і мотив, і засоби, щоб усунути його та його м'який уряд від влади."

