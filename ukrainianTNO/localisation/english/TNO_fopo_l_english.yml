## GER ##
GER_PP_invasion_desc: "Шпигуни в Гавані та Вашингтоні повідомили нам про тренування 'Карибського легіону', групи політичних дисидентів та найманців, які готуються до вторгнення в Домініканську Республіку для повалення диктатора Рафаеля Трухільйо. Незважаючи на стійку підтримку Трухільйо Іберією, ми можемо виявити, що приниження американців на їхньому задньому дворі може бути цінним.\n\nВ американських авіаційних силах, ймовірно, буде використано в цьому конфлікті, і це може бути згубно для сил Д.Р. У відповідь інженери Вермахту почали активно підтримувати поставки протиповітряних зброї, зокрема нові технології для польових випробувань. Ми не повинні упустити цінний досвід та фото збитих американських пілотів у новинах."

