  ##Japan
  JAP_PHI_PW_2_desc: "14-та армія повернулася додому з попелом в роті та попелом своїх товаришів поруч. Воїни родин, позбавлених синів, батьків та братів, зливаються з клятвами, принесеними в муках. Ніякої милості, сказав юнак на вербувальному пункті; більше ніяких півзаходів, сказав старий, розмахуючи своїм старим каштановим гунто. Так каже Японія як єдина нація: помста за мертвих. Помста за їх героїв.\n\nЧерез два місяці ми вирушимо, щоб знову забрати ці прокляті острови. До того часу ми повинні вирішити, які дивізії ми привеземо."
  JAP_PHI_supply_text: "Наш поточний £GFX_PHI_supply_texticon §LSupply§! становить §L[?JP_PHI_supply]/100§!\nМінімальний рівень постачання для вторгнення £GFX_PHI_supply_floor_texticon §Sстановить: [?JP_PHI_supply_perc]§!"
  JAP_PHI_supply_tt: "£GFX_PHI_supply_texticon §LSupply: [?JP_PHI_supply]/100§!\n£GFX_PHI_supply_floor_texticon §SМінімум для постачання: [?JP_PHI_supply_perc]§!"
  JAP_PHI_customize_desc: "[GetCustomizationDesc]"
  JAP_PHI_preparations_custom: "Використовуючи ці рішення, ми можемо сформувати десантні сили для повернення Філіппін. Кількість дивізій, які ми можемо надіслати, обмежена §LSupply§!.\n\n14-та армія наразі оснащена\n§Y[?JAP_PHI_Army] дивізій§!. Ефективна десантна сила може мати не більше §R10 дивізій§!."
  JAP_PHI_ongoing_custom: "Ми повинні переконатися, що §LSupplies§! достатньо для підтримки 14-ї армії до кінця кампанії, інакше вони отримають §enegative effects.§!\n\n§YРезультат кампанії 14-ї армії буде вирішено через шість місяців.§!"

