TNO_fopo_satw_info: "§YВідлуння війни знову розноситься Південною Америкою§! цього разу в масштабах, яких ще не бачили. §mАргентина§! та §KБразилія§! зійшлися у прямому протистоянні за долю континенту, де переможець стане беззаперечним гегемоном §YПівденної Америки§!.\n\n§UЕскалація Південноатлантичної війни§! показує, наскільки далеко обидві сторони готові зайти, аби завершити це зіткнення титанів. Якщо її рівень впаде достатньо низько, §Gмирне завершення конфлікту може з’явитися на горизонті§! однак зі зростанням §Uескалації§! обидві сторони отримуватимуть дедалі радикальніші можливості покласти край війні й здобути вирішальну перемогу. Та якщо зайти надто далеко, після того як пил осяде, може не лишитися §RПівденної Америки, якою можна було б правити.§!\n\nВодночас і §mАргентина§!, і §KБразилія§! змушені стримувати невдоволення власного населення та тримати §Yвоєнне виснаження§! на низькому рівні, §Rінакше їхні ж народи змусять уряди визнати поразку.§!"
