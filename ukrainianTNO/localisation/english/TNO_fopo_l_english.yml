  PHI_Doing_Reconstruction: "Ми зараз допомагаємо в реконструкції іншими способами."
  PHI_reconstruction_successful_tt: "§GЯк наближається термін, ми можемо спокійно чекати, оскільки реконструкція Філіппін готова бути оголошеною завершеною.§!"
  JAP_PHI_disallow_rebel_encirclement: "Ми розпустили міліції та констебулярії."
