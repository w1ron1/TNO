 # GUI

 USA_ICW_desc: "Улюблений пес Токіо здичавів. Мохаммад Хатта та його послідовники підняли прапор повстання, і тепер золоте яйце Японії кипить у власному соку. І цей запах збуджує Австралію, яка бачить можливість вдарити у підчерев’я Сфери, помститися за втрати та звільнити поневолені маси архіпелагу.\n\nНаш обов’язок — підтримувати свободу, де б вона не з’являлася. Хатта має отримати все необхідне для перемоги у війні. Австралія повинна отримати все необхідне для того, щоб допомогти йому це зробити. А якщо все інше зазнає невдачі, ми врятуємо Індонезію від Сфери, незалежно від того, що доведеться зробити.\n\nПоточний етап: [Get_ICWPhase]"
 JAP_ICW_desc: "Ще раз, Південна ресурсна зона під загрозою. Сукарно та індонезійці стикаються з масовим повстанням повстанців і нелояльних військових угруповань по всьому архіпелагу. І жадібні імперіалісти в Австралії та ОВН знову відчувають можливість увірватися в Сферу і захопити мінеральне багатство островів для себе. На благо Східної Азії ми не можемо дозволити цьому статися.\n\nМи переконаємося, що Сукарно має всі ресурси, необхідні для вирішення цього безглуздя. Наша підтримка буде підкріплена словами та постачаннями. Якщо знадобиться, ми самі будемо боротися в цьому конфлікті. Східній Азії потрібна Індонезія за будь-яку ціну.\n\nПоточний етап: [Get_ICWPhase]"

