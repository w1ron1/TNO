  USA_PHI_huks_Irregular: "Запуск операції §eНЕПРАВИЛЬНИЙ§!"
  USA_PHI_huks_Irregular_Exhaustion_tt: "Бліц тривав щонайменше §Y5 місяців§!"
  USA_PHI_huks_Irregular_effect_tt: "Ми розпочнемо операцію для §Gподальшої співпраці§! з §eХуками§!. Це дозволить нам напряму надавати їм військових добровольців, §Rале це не дозволить нам підвищити підтримку USFIP.§!"
  USA_PHI_huks_Irregular_desc: "Бліц Балінтавака, як і передбачалося, мав бути швидкою та відносно безкровною війною проти японського уряду в Манілі, але вийшло інакше. Уряд Маніли чинив опір сильніше, ніж ми очікували, і війна перетворилася на криваве протистояння без очевидного переможця. Можливо, AFRSR буде готовий співпрацювати з нами, а знаходження таких союзників може дати нам необхідний поштовх для вигнання японців з островів, та забезпечення певного майбутнього Філіппін після війни, якщо ми переможемо."

