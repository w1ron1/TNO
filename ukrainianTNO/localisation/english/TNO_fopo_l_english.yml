GER_CLD_send_volunteers_desc: "Наші колумбійські побратими в боротьбі за свободу ведуть жорстоку громадянську війну. Ми допоможемо Другій патріотичній армії, відправивши добровольців."
GER_COL_provide_loans_to_the_CLD: "Надати кредити [CLD.GetFlag] SPA"
GER_COL_provide_loans_to_the_CLD_desc: "Ми надамо серію кредитів SPA, щоб допомогти їм продовжити боротьбу. Колумбія буде вільна від лібералізму і комунізму."

GER_CCW_desc: "Колумбія лежить в руїнах; крихкий мир, заморожена війна, в якій країна перебувала останні десять років, розтанули, і колумбійці знову борються з ножем і гвинтівкою за свої переконання. Колумбія знаходиться прямо в задньому дворі Сполучених Штатів — і нам надано унікальну можливість принизити їх прямо в цьому регіоні. Підтримуючи Другу патріотичну армію, наших гордих, хоча і дивних, націонал-соціялістичних братів проти так званого легітимного уряду, фашистів Нової Гранади, і соціялістів з Колумбійського революційного союзу, ми можемо привести частину Латинської Америки в націонал-соціялістичну орбіту — прямо біля Сполучених Штатів. Важливо, щоб ми не змарнували цю можливість."


## IBR ##
IBR_CCW_desc: "Зі смертю президента Гомеса, наш вплив у Колумбії опинився під загрозою, оскільки Пінілья, відомий палкий націоналістичний генерал, загрожує скинути Урданету. Повідомлення з Боготи інформують нас про те, що члени урядової еліти формують коаліцію під назвою 'Національний фронт' проти Пінільї на випадок його перевороту.\n\nЯкщо 'Фронт' не зможе запобігти узурпації влади генералом, нам потрібно буде звернутися до повстанців Нової Гранади, щоб допомогти утримати наш вплив у Південній Америці."

