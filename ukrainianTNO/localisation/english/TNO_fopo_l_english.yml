#KD's Balance Additions
  JAP_PHI_Commit_More_Forces: "Підкріплення ліній постачання"
  JAP_PHI_Commit_More_Forces_desc: "Створення Об'єднаного фронту змусило нас адаптувати наші плани вторгнення. Може знадобитися розширення мережі постачання для підтримки нашої армії."
  JAP_PHI_Training_Excercise: "Організувати тренувальні вправи"
  JAP_PHI_Training_Excercise_desc: "Не підготуватися — це найбільший злочин. Ми організуємо тренувальні вправи для підготовки наших сил до наступного вторгнення, хоча це, безумовно, коштуватиме нам обладнання та постачання, наші війська значно виграють від цього."

  TNO_Second_Invasion_Great_Equalizer: "§YЧерез створення ОФФ додаткові ресурси були перенаправлені на вторгнення.§!"
  TNO_Second_Invasion_Volunteer_anouncement: "Тепер можна приймати нові рішення для підтримки вторгнення. Добровольчі дивізії також можуть бути направлені."
  
  #JAP - PHI Decisions
  JAP_PHI_REC_Oli_1: "Ми використали можливість розширити наші зв'язки з промисловцями KALIBAPI"
  JAP_PHI_REC_Dem_1: "Ми використали можливість розширити наші зв'язки з парламентаріями KALIBAPI"
  JAP_PHI_Completed_Support_the_Loyalist: "Ми підтримали парламентаріїв"
  JAP_PHI_Completed_Support_the_Industrialist: "Ми підтримали промисловців"
  JAP_PHI_Assist_Reconstruction: "Допомогти в реконструкції"
  JAP_PHI_Assist_Reconstruction_desc: "Ми направимо допомогу уряду Філіппін для реконструкції у різних формах, будь то матеріальна чи грошова допомога."
  JAP_PHI_Send_in_Experts: "Надіслати експертів"
  JAP_PHI_Send_in_Experts_desc: "Ми направимо кілька економістів для допомоги Республіці на її довгому шляху до відновлення. Їхня допомога, безумовно, буде корисною для реконструкції та навіть може надати нам можливості для інновацій у нашій країні."
  JAP_PHI_Exploit_Local_Businesses: "Розширити бізнес-зв'язки"
  JAP_PHI_Exploit_Local_Businesses_desc: "Ми будемо допомагати уряду Філіппін в реконструкції, поки вони нададуть нашим корпораціям вигідний доступ до своїх ринків."
  JAP_PHI_Promote_Loyal_Democracy: "Сприяти філіппінській демократії"
  JAP_PHI_Promote_Loyal_Democracy_desc: "Ми розпочнемо кампанії для навчання наших відважних союзників на Філіппінах цінностям правильної паназійської демократії. Звісно, ми подбаємо, щоб демократія, яка вкоріниться на Острівній Перлині, не відступала від справи співпроцвітання."
  JAP_PHI_Support_the_Loyalist: "Підтримати кампанію Квентіна Паредеса"
  JAP_PHI_Support_the_Loyalist_desc: "Пан Паредес — освічений король політики Республіки, прихильник Лауреліанства, він легітимізує Республіку, продовжуючи реформи своїх попередників. Паназійське співпроцвітання буде зміцнено його зусиллями, тому ми забезпечимо його перемогу."
  JAP_PHI_The_Loyalist_tt: "Ми будемо підтримувати §gКвентіна Паредеса§! для забезпечення наших §RІнтересів§!"
  JAP_PHI_Support_the_Industrialist: "Підтримати кампанію Серджіо Осмені Молодшого"
  JAP_PHI_Support_the_Industrialist_desc: "Пан Осмена Молодший відомий своїм технократичним підходом до управління та реформ, його зв'язки з японським бізнесом роблять його кандидатом, найбільш узгодженим з нашими інтересами, тому ми повинні забезпечити його перемогу будь-якими засобами."
  JAP_PHI_The_Industrialist_tt: "Ми будемо підтримувати §gСерджіо Осмену Молодшого§! для забезпечення наших §RІнтересів§!"
  JAP_demobilize_militias: "Демобілізувати міліції та констебулярії"
  JAP_demobilize_militias_desc: "Оскільки міліціонери та констебулярії вже виконали своє завдання, нам більше немає потреби в них. Тримати їх організованими — це марна трата ресурсів, які можна використати в іншому місці, тому міліції та констебулярії, які так корисні були під час війни, тепер будуть розпущені."
  JAP_dismantle_manila_forts: "Розібрати форти Маніли"
  JAP_dismantle_manila_forts_desc: "Багато фортифікацій у місті Маніла є неприємним видовищем. Разом з неприємним виглядом вони також заважають процесу реконструкції, займаючи простір, який міг би бути використаний для корисніших будівель чи інфраструктури. Тому необхідна демонтаж і прибирання."
  JAP_emergency_price_fixing_laws: "Закони надзвичайного фіксування цін"
  JAP_emergency_price_fixing_laws_desc: "Економічна ситуація на Філіппінах критична, країна, виснажена війною, бореться з тим, щоб забезпечити людей продуктами та основними потребами внаслідок десятиліть безперервної війни. Ми повинні ввести закони надзвичайного фіксування цін, щоб забезпечити мінімальні страждання людей і не дати економічній ситуації погіршитися."
  JAP_anti_rebel_encirclement_campaigns: "Анти-революційні кампанії"
  JAP_anti_rebel_encirclement_campaigns_desc: "Маючи міліції на островах, ми розпочнемо численні кампанії, спрямовані на знищення повстанських осередків у джунглях Філіппін самостійно. Це значно допоможе реконструкції, ліквідуючи загрози режиму."
  JAP_anti_rebel_encirclement_campaigns_success_tt: "Полювання на §Rзалишкових повстанців§! на Філіппінах §Gуспішне§!."
  JAP_anti_rebel_encirclement_campaigns_fail_tt: "Полювання на §Rзалишкових повстанців§! на Філіппінах §eне вдалося§!."
  JAP_PHI_recon_timeout: "Термін реконструкції Філіппін"
  JAP_PHI_recon_timeout_tt: "§RФіліппіни різко дестабілізуються...§!"
  JAP_PHI_will_unlock_more_investments_tt: "Відкриє більше §GРішення щодо реконструкції§!"

  #USA - USFIP/Coalition Decisions
  #TTs
  USA_PHI_disallow_demobilization: "Неможливо демобілізувати Філіппінську армію"
  USA_PHI_disallow_demobilization_tt: "§RВибір цього рішення заборонить нам демобілізувати Філіппінську армію.§!\n"
  USA_PHI_disallow_hunt_bandidos: "Неможливо проводити анти-бандитські дії"
  USA_PHI_disallow_hunt_bandidos_tt: "§RВибір цього рішення заборонить нам проводити анти-бандитські дії.§!\n"
  USA_delegitimze_leyte_proclamation_tt: "Делегітимізація прокламації Лейте поставить §YDiosdado Pangan Macapagal Sr.,§! нашого кандидата на посаду президента Філіппін, §Gin charge of the country.§!\n\nЙого §Gдружелюбність§! до нас дасть нам ще одного союзника в рамках §DОрганізації Вільних Націй§!.\n§RЯкщо ми цього не зробимо, §Osomeone else§! хто менш співпрацює з нами, стане президентом.§!"
  USA_USFIP_anti_referendum_campaign_tt: "Кампанія проти §RПопулярного референдуму§! гарантує §YDiosdado Pangan Macapagal Sr.,§! перемогу на майбутніх виборах та запобігає тому, щоб §Oхтось інший§! не взяв владу в майбутньому.\n"

  USA_UPH_recon_timeout_tt: "§RМи втратимо прихильність уряду Філіппін, поставивши неприємного кандидата на посаду президента Філіппін.§!"
  USA_SPH_recon_timeout_tt: "§RМи втратимо прихильність уряду Філіппін, поставивши неприємного кандидата на посаду президента Філіппін.§!"

  #Dec loc
  USA_assist_reconstruction: "Допомогти в реконструкції"
  USA_assist_reconstruction_desc: "Ми безпосередньо надамо допомогу уряду Філіппін для реконструкції в різних формах, будь то матеріальна чи грошова."
  USA_Send_in_Experts: "Надіслати експертів"
  USA_Send_in_Experts_desc: "Ми надамо кілька експертів з економіки, щоб допомогти Республіці на її довгому шляху до відновлення. Їхня допомога, безумовно, буде корисною для реконструкції та навіть може надати нам можливості для інновацій вдома."
