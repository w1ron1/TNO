  USA_dismantle_manila_forts: "Розібрати форти Маніли"
  USA_dismantle_manila_forts_desc: "Багато фортифікацій у місті Маніла — це неприємне видовище. Окрім поганого вигляду, вони також заважають процесу реконструкції, займаючи місце, яке могло б бути використано для більш корисних будівель або інфраструктури. Тому необхідно провести демонтаж і прибирання."
  USA_emergency_price_fixing_laws: "Закони надзвичайного фіксування цін"
  USA_emergency_price_fixing_laws_desc: "Економічна ситуація на Філіппінах критична, країна, зруйнована війною, бореться з тим, щоб нагодувати людей і забезпечити їхні потреби через десятиліття нескінченних війн. Ми повинні ввести закони надзвичайного фіксування цін, щоб забезпечити мінімальні страждання людей і не допустити погіршення економічної ситуації."
