pp_spy_meter_tooltip_delayed: "[GetPPSpyTooltipDelayed]"
pp_spy_meter_tooltip_delayed_USA: "§FЗа лаштунками вирішальним фронтом у боротьбі з фашистською диктатурою Трухільо є приховані операції.\n\nНам не є таємницею, що режим користується допомогою іноземних розвідок, а, у поєднанні з власною сильною розвідкою Трухільо, наші шпигунські та саботажні зусилля, вимірювані £GFX_counter_intelligence_USA §MОпераційною силою§!, будуть вирішальними для забезпечення перемоги над диктатором.§![GetPPInsurgencyStrengthInvasion]"
pp_spy_meter_tooltip_delayed_MEX: "§FЗа лаштунками вирішальним фронтом у боротьбі з фашистським режимом Трухільо є приховані операції.\n\nОскільки і розвідка Іберії, і Німеччини підтримують Трухільо, проникнення DFS в Домініканську Республіку, вимірюване в £GFX_counter_intelligence §MОпераційній силі§!, повинно отримати всі ресурси для забезпечення перемоги після початку вторгнення.§![GetPPInsurgencyStrengthInvasion]"
pp_spy_meter_tooltip_delayed_IBR: "§FЗа лаштунками вирішальним фронтом у нашій операції підтримки наших союзників у Домініканській Республіці є приховані операції.\n\nМіцні американські та мексиканські розвідки є важким ворогом, тому наші контррозвідувальні зусилля, вимірювані в £GFX_counter_intelligence §OОпераційній силі§!, будуть вирішальними для забезпечення перемоги над дегенератами янкі.§![GetPPInsurgencyStrengthInvasion]"
pp_spy_meter_tooltip_delayed_GER: "§FЗа лаштунками вирішальним фронтом у нашій операції протидії зусиллям США в Домініканській Республіці є приховані операції.\n\nМіцні американські та мексиканські розвідки є важким ворогом, тому наші контррозвідувальні зусилля, вимірювані в £GFX_counter_intelligence_GER §OОпераційній силі§!, будуть вирішальними для досягнення нашої мети заблокувати розширення американської сфери.§![GetPPInsurgencyStrengthInvasion]"
pp_brandenburger_meter_tooltip_delayed: "[GetBrandenburgerTooltipDelayed]"
pp_brandenburger_meter_tooltip_delayed_GER: "§FЯкщо ми хочемо продовжувати проводити великі операції для дестабілізації перемир'я, нам потрібно переконатися, що наш контингент §BБранденбургерів§! є добре забезпеченим і готовим до бою.\n\nПеребування тисячі миль від дому в густих джунглях Домініканської Республіки при проведенні ризикованих операцій безсумнівно вплине на наші сили. Тому §BБойова сила§! вимірює, наскільки готові наші сили виконувати наші накази.§!"

###pp_spy_meter_tooltip_delayed_GER_SKP: ""§FNo combat force thousands of miles away from home can sustain itself independently. And no operation goes without equipment losses or manpower casualties.\n\nThus, the combat capability of our SKP fallschirmjägers on the ground is represented by £GFX_counter_intelligence_GER §OOperational Strength§!, and we will need to continually reinforce their capabilities if we want to conduct grander, more ambitious, destabilization operations."

