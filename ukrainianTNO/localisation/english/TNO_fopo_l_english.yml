# Invasion Preparation
MEX_PPI_show_infantry: "§GПоказати тренування колон Легіону§!"
MEX_PPI_show_infantry_desc: "Карибський легіонер часто новачок, але їх багато, і вони готові віддати все за справу."
MEX_PPI_hide_infantry: "§RСховати тренування колон Легіону§!"
MEX_PPI_hide_infantry_desc: "Карибський легіонер часто новачок, але їх багато, і вони готові віддати все за справу."
MEX_PPI_show_cuban_forces: "§GПоказати розгортання кубинських батальйонів§!"
MEX_PPI_show_cuban_forces_desc: "Кубинські батальйони складаються з високопрофесійних кубинських ветеранів їх революції."
MEX_PPI_hide_cuban_forces: "§RСховати розгортання кубинських батальйонів§!"
MEX_PPI_hide_cuban_forces_desc: "Кубинські батальйони складаються з високопрофесійних кубинських ветеранів їх революції."

MEX_PPI_prepare_cuban_intervention: "   Підготовка кубинського втручання"
MEX_PPI_prepare_cuban_intervention_tt: "§FДозволяє £GFX_decision_icon_small §YВербування§! §YCубинських батальйонів§!."
MEX_PPI_prepare_cuban_intervention_desc: "Будучи нашим головним союзником у боротьбі проти карибського фашизму, Куба вже давно підтримує повалення режиму Трухільйо. Багато тутешніх революціонерів та досвідчених солдатів рвуться в бій, щоб нарешті дістатися до нього. Тож не змушуймо їх чекати."

MEX_PPI_open_offices: "   Відкрити офіси Легіону в [MEX.GetLegionaryOffice]"
MEX_PPI_open_offices_tt: "§FДозволяє £GFX_decision_icon_small §YВербування§! §YКолон Легіону§!."
MEX_PPI_open_offices_desc: "[MEX.GetLegionaryOfficeDesc]"
PPI_Office_1: "Веракрус"
PPI_Office_2: "Чіуауа"
PPI_Office_3: "Федеральний округ"
PPI_Office_1_desc: "Щоб розбудувати Карибський легіон, нам потрібно вербувати, власне, карибців. Створення офісів у нашому головному портовому місті є першим кроком. Після цього ми оголошуємо заклик до вигнанців, співвітчизників і шукачів пригод з усіх куточків Америк."
PPI_Office_2_desc: "У Карибському басейні є лише обмежена кількість людей, як і кораблів, що прямують до Веракруса. Але якщо звернутися трохи північніше, ми отримаємо ще одне джерело бійців. Тепер домініканським вигнанцям і американським найманцям достатньо перетнути Ріо-Ґранде заради багатства та слави."
PPI_Office_3_desc: "Схоже, наш міжнародний заклик до кількох добрих бійців дістався й вітчизняної аудиторії. Звіти нашого моніторингу DFS повідомляють, що до нас приєдналася й певна кількість мексиканців лівих і націоналістичних поглядів. Тож доведеться зціпити зуби й почати відкрито вербувати й їх."

MEX_PPI_form_cuban_column: "   Створити [MEX.GetCubanColumnNumber] Кубинський експедиційний батальйон"
MEX_PPI_form_cuban_column_desc: "[MEX.GetCubanColumnNumberDesc]"
PPI_Cuban_Column_1: "1-й"
PPI_Cuban_Column_2: "2-й"
PPI_Cuban_Column_1_desc: "Куба має чимало солдатів, які охоче понесуть свою революцію до Домініканської Республіки. Важко озброєні, добре навчені й безмежно люто налаштовані, вони стануть вістрям списа вторгнення."
PPI_Cuban_Column_2_desc: "Кастро заявив, що достатньо його бородатих бійців зголосилися приєднатися до експедиційних сил, тож за бажання ми без проблем зможемо спорядити ще один підрозділ. А чому б і ні? Розширення нашого елітного ударного елементу дасть нашим військам додаткову перевагу над фашистськими головорізами."

MEX_PPI_form_column: "   Створити [MEX.GetColumnNumber] Колону Легіону"
MEX_PPI_form_column_tt: "Якщо початкове вторгнення буде успішним, §KЛіві§! та §NНаціоналісти§! отримають §wпідвищення§! §yдумок§!!"
MEX_PPI_form_column_desc: "[MEX.GetColumnNumberDesc]"
PPI_Column_1: "3-й"
PPI_Column_2: "4-й"
PPI_Column_3: "5-й"
PPI_Column_1_desc: "Тепер, коли у Веракрусі зібралося чимало людей і всі вони на обліку, нашим наступним кроком є зробити їх справді корисними. Саме тут ми видаємо їм зброю, проводимо вишкіл і перетворюємо цих людей на реальну бойову силу."
PPI_Column_2_desc: "Коли Хуарес заповнений солдатами удачі та вигнанцями-дисидентами, ми можемо сформувати з них ще один підрозділ легіонерів. Гутьєррес буде радий дізнатися, що до першої хвилі приєднається більше людей, хоча це й ускладнить нашу логістику."
PPI_Column_3_desc: "Купка комуністів з УНАМ і вуличних головорізів, яких ми тепер маємо, стане основою нашої нової колони. На щастя, тепер ми можемо зібрати їх усіх там, де Гутьєррес зможе пильно за ними наглядати. А потім нацькуємо їх на Трухільйо та його іберійських друзів."

MEX_PPI_training_bases: "   Створити тренувальні бази в [MEX.GetLegionBase]"
MEX_PPI_training_bases_desc: "[MEX.GetLegionBaseDesc]"
MEX_PPI_training_bases_tt: "Дозволяє навчання додаткової бригади."
MEX_PPI_training_bases_yucatan_tt: "([CAL.GetFlag]§YКарибський Легіон§!) Додає §YSpecialised Training§! який надає:\nПриріст досвіду дивізії: §G+5.0%§!\nШтраф за оточення: §G-5.0%§!\nВласна бойова ширина: §G-5.0%§!\nФактор приросту акліматизації в спеку: §G+15.00%§!"
MEX_PPI_training_bases_holguin_tt: "Модифікує §YSpecialised Training§! за рахунок:\nПриріст досвіду дивізії: §G+5.0%§!\nПрорив: §G+5.0%§!"
MEX_PPI_training_bases_guantanamo_tt: "Модифікує §YSpecialised Training§! за рахунок:\nПриріст досвіду дивізії: §G+5.0%§!\nВласна бойова ширина: §G-5.0%§!"
PPI_Base_1: "Юкатан"
PPI_Base_2: "Гольгін"
PPI_Base_3: "Гуантанамо"
PPI_BaseDesc_1: "Юкатан є найближчою територією до Домініканської Республіки. Бази тут дозволять інтенсивно тренувати Легіон у таємниці завдяки віддаленості, а місцева географія дає можливість швидше акліматизувати війська до вологого, жаркого та змінного клімату Карибів."
PPI_BaseDesc_2: "Гольгін на Кубі має клімат, найбільш схожий на домініканський тропічний, і з часів Кубинської революції цей район активно розвивається, що дозволяє нам використовувати логістичні переваги, зберігаючи при цьому великі площі незайнятих земель для моделювання різних сценаріїв, включаючи інфільтрацію, повітряні та амфібійні висадки."
PPI_BaseDesc_3: "Тренувальні бази в районі Гуантанамо надають унікальну можливість тісно співпрацювати з американськими силами під час навчань. Використовуючи американську інфраструктуру, ми можемо посилити амфібійні вправи і одночасно здійснювати великомасштабні повітряно-десантні навчання."

MEX_PPI_train_brigade: "    Тренувати [GetTrainingColumnNumber] Колону Легіону"
MEX_PPI_train_brigade_desc: "[MEX.GetTrainingColumnNumberDesc]"
PPI_Column_1_t_desc: "Тепер ми розуміємо, що простого вміння стріляти й крокувати в ногу недостатньо, аби армія вижила у бою з ворогом. Тож ми підвищуємо ставки. Розширена та спеціалізована підготовка зробить наших бійців готовими до всього, винахідливими… і неприємним сюрпризом для Трухільйо."
PPI_Column_2_t_desc: "Самі по собі спусконатискні янкі не створять «Дивізіон дель Норте». Їм потрібна холодна й жорстка доза реальності бойових дій. Команданте Вільям Александр Морган зробить тих, хто має реальний досвід служби в армії США, нашими командирами. А для решти кілька тижнів навчань із бойовими стрільбами дадуть усе необхідне, щоб бути жорсткими на ділі, а не лише на словах."
PPI_Column_3_t_desc: "Зазвичай, коли група ліваків залишає нашу країну, ми були б раді, аби вони ніколи не повернулися. Однак у наших національних інтересах — зробити так, щоб вони залишилися живими, неушкодженими й разом зі своїми підрозділами. Тож ми даємо їм знання та досвід, яких вони ніколи не здобудуть, читаючи марксистську нісенітницю."
MEX_PPI_acclimatization_and_guerrilla_training: "    Акліматизація та партизанське навчання"
MEX_PPI_acclimatization_and_guerrilla_training_tt: "Модифікує §YSpecialised Training§! за рахунок:\nПриріст досвіду дивізії: §G+5.0%§!\nШтраф за оточення: §G-5.0%§!\nВласна бойова ширина: §G-5.0%§!\nФактор приросту акліматизації в спеку: §G+10.00%§!"
MEX_PPI_acclimatization_and_guerrilla_training_desc: "Ми відправляємо невелику групу людей у дику місцевість, щоб повалити могутнього ворога. Вкрай важливо обернути на свою користь усе, що тільки можливо. Спираючись на кубинський досвід, Легіон витратить час на те, щоб навчитися виживати в непривітних джунглях, а маневреність і раптовість зробити своїми головними союзниками."
MEX_PPI_amphibious_training: "    Амфібійні навчання"
MEX_PPI_amphibious_training_tt: "Модифікує §YSpecialised Training§! за рахунок:\nШвидкість дивізії: §G+5.0%§!\nПриріст досвіду дивізії: §G+5.0%§!\nВідновлення організації армії: §G-5.0%§!"
MEX_PPI_amphibious_training_desc: "Давайте дивитися правді в очі: є лише один спосіб дістатися Домініканської Республіки. Тож настав час навчити цих сухопутних щурів твердо стояти на палубі! Наші новобранці в Ольгіні вирушать у тривалий «круїз» із кубинським флотом, відпрацьовуючи висадку на узбережжя."
MEX_PPI_airborne_training_1: "    Організація десантних сил"
MEX_PPI_airborne_training_1_tt: "Модифікує §YSpecialised Training§! за рахунок:\nШтраф за оточення: §G-5.0%§!\nПрорив: §G+5.0%§!"
MEX_PPI_airborne_training_1_desc: "Включення легких літаків КЗП (короткого зльоту та посадки) до складу наших сил дасть численні переваги. Ми зможемо забезпечити хоча б мінімальне постачання підрозділів у віддалених районах, а також сформувати невеликі загони для розвідки та проведення спеціальних операцій."
MEX_PPI_airborne_training_2: "    Великомасштабні повітряно-десантні навчання"
MEX_PPI_airborne_training_2_tt: "Модифікує §YSpecialised Training§! за рахунок:\nПриріст досвіду дивізії: §G+5.0%§!\nШтраф за оточення: §G-5.0%§!\nПрорив: §G+5.0%§!"
MEX_PPI_airborne_training_2_desc: "Завдяки пілотам ЦРУ та американському спорядженню ми тепер обговорюємо не лише скидання припасів чи операції малих груп. Тепер мова йде про повноцінне постачання, підкріплення та висадку з’єднань для захоплення ключових об’єктів. Після кількох занять на аеродромі Лівард-Пойнт наші люди зможуть втілити це в життя."

MEX_PPI_lease_cuba_air_wings: "Орендувати авіацію Куби"
MEX_PPI_show_supply_decisions: "Показати рішення з постачання"
MEX_PPI_hide_supply_decisions: "Сховати рішення з постачання"
MEX_PPI_mobilize_resources: "   Мобілізація ресурсів"
MEX_PPI_mobilize_resources_desc: "Іноді потрібно змастити колеса, щоб вони крутилися. А склад, повний речей, що просто лежать без діла, - це справді спокуса."
MEX_PPI_organize_supplies: "    Організація постачання"
MEX_PPI_organize_supplies_desc: "Квасоля, кулі, бинти — без цього всього наше вторгнення нікуди не рушить. Тільки дайте слово, і ми дістанемо більше припасів для наших хлопців."
MEX_PPI_provide_guns: "    Поповнення запасів зброї"
MEX_PPI_provide_guns_desc: "Якщо у нас десь лежать якась зброя, то вони краще послужать в руках легіонерів. Неважливо, чи це Томпсони, Гаранди чи навіть Арісаки часів Порфіріато; зброя, яка у нас є, краща за ту, якої у нас немає."
MEX_PPI_rally_oas_support: "    Залучення підтримки ОАС"
MEX_PPI_rally_oas_support_desc: "Організація американських держав може бути інструментом контролю Янкі над Америкою, але вони не люблять Трухільйо не більше, ніж ми. Залучення їх до нашого плану принесе дивіденди. Більше того, це допоможе заспокоїти американців, що ми хочемо спільних зусиль."
MEX_PPI_unleash_the_dgi: "    Випустити DGI"
MEX_PPI_unleash_the_dgi_desc: "Незважаючи на всю свою грізність, DFS виконує в основному функції в галузі національної безпеки і має обмежені можливості для проведення розвідки за кордоном або спеціальних операцій. Натомість кубинська Dirección General de Inteligencia має великі можливості в галузі прямих дій і не боїться бруднити руки. Якщо ми дамо їм волю, вони спалять Сьюдад-Трухільйо."
MEX_PPI_show_operational_decisions: "Показати оперативні рішення"
MEX_PPI_hide_operational_decisions: "Сховати оперативні рішення"
MEX_PPI_infiltrate_agents: "    Проникнення агентів"
MEX_PPI_infiltrate_agents_desc: "Підроблені паспорти, таємні дипломатичні призначення, парашути, таємне висадження на берег або старі добрі дірки в паркані. Чим більше людей ми маємо за лінією фронту, тим більше ми знаємо і тим більше можемо зробити."
MEX_PPI_organize_dissidents: "    Організувати дисидентів"
MEX_PPI_organize_dissidents_desc: "Трухільйо, нарешті, зайшов занадто далеко. Чоловіки і жінки по всій Республіці готові виступити проти цього монстра. Ми повинні підготувати їх до наступного етапу латиноамериканської революційної боротьби."
MEX_PPI_work_with_the_cia: "    Співпраця з ФБР"
MEX_PPI_work_with_the_cia_desc: "Певні проамериканські члени нашого уряду звернулися до нас із пропозицією. Оскільки ФБР проводить власні операції по боротьбі з Трухільйо, чи не було б сенсу об’єднати зусилля? Співпраця може принести велику вигоду..."
MEX_PPI_mutually_exclusive_with_redirect_heat_towards_the_cia_tt: "Взаємно виключно з §YПеренаправити увагу на ФБР§!"
MEX_PPI_redirect_heat_towards_the_cia: "    Перенаправити увагу на ФБР"
MEX_PPI_redirect_heat_towards_the_cia_desc: "Оскільки ФБР проводить власну операцію проти Трухільйо, нам може бути вигідно підставити їх під удар замість себе. Поки СІМ полює на них, для нас відкриваються можливості, якими варто скористатися. Це просто бізнес, та й що ті американці взагалі знають про Латинську Америку?"
MEX_PPI_mutually_exclusive_with_working_with_the_cia_tt: "Взаємно виключно з §YСпівпраця з ФБР§!"
MEX_PPI_bribe_dominican_officials: "    Підкупити домініканських чиновників"
MEX_PPI_bribe_dominican_officials_desc: "Чесність — рідкісний товар у країні, сповненій чоловіків, які не здатні захистити навіть власних дружин та доньок від Трухільйо. Але ми можемо запропонувати «стипендію» тим, хто готовий прислухатися до вищого поклику. Все, що їм потрібно зробити, — це прийняти неминуче..."
MEX_PPI_the_venezuela_connection: "    Венесуельське з'єднання"
MEX_PPI_the_venezuela_connection_desc: "На іншому кінці Карибського басейну є нація, яка давно ненавидить Трухільйо так само сильно, як і всі інші — і не без причини! Венесуела жадає помсти за замах СІМ на Бетанкура, і ми можемо її забезпечити. Залучення їх до нашої маленької схеми дозволить нам отримати доступ до їхнього власного «вікна» у цю чорну пляму Америки. Крім того, вони допоможуть нам із Вашингтоном порозумітися."
MEX_PPI_connect_with_dissidents: "    Зв'язок з дисидентами та емігрантами"
MEX_PPI_connect_with_dissidents_desc: "Священники, юристи, власники гасієнд, дресувальники коней, бандити, фермери, що вирощують нут — Мексика знає, що будь-яка людина може здобути революційне безсмертя. Тим, хто ненавидить монстра із Санто-Домінго, просто потрібно побачити цю ненависть в очах інших, щоб відчути її в собі. І коли прийде час, вони здіймуть крик і завдадуть свій удар."
MEX_PPI_cruise_the_caribbean: "    Подорожувати Карибами"
MEX_PPI_cruise_the_caribbean_desc: "Військово-морський флот Мексики невеликий, але це не означає, що ми не можемо використовувати його ефективніше. Навчання із забезпечення «свободи судноплавства» поблизу домініканських берегів покажуть їм, що ми готові дістати їх будь-де. Це підбадьорить повстанців та американців, але може сполохати певні внутрішні сили, що діють всередині режиму."
MEX_PPI_coordinate_with_dgi: "    Координувати з DGI"
MEX_PPI_coordinate_with_dgi_desc: "Як головна зовнішня розвідка нашого блоку, кубинська Dirección General de Inteligencia (DGI) є нашою головною опорою у зборі інформації та проведенні операцій всередині Домініканської Республіки. Регулярні зустрічі з ними дозволять обмінюватися даними та краще координувати спільні дії."

