VEN_ESQ_desc: "Після майже століття територіальних суперечок між Венесуелою та британською колонією Гаяна, Венесуела нарешті вторглась на спірну смугу Ессекібо - територію, що становить дві третини землі Гаяни та п'яту частину її населення. З огляду на те, що Венесуела тепер перебуває під фашистським і так званим "болівaріаністським" режимом, це вторгнення було цілком очікуваним.\n\nПроте воно захопило зненацька як гаянські, так і канадські сили, і, як член ОВН, союзні сили мають підтримати невелику гаянську армію. Однак через сільське та віддалене розташування Ессекібо гаянцям доведеться стримувати загарбників і відтісняти їх до кордону, доки не прибуде ОВН."
VCW_ESQ_desc: "Після провалу вторгнення до Гаяни будь-яке відчуття влади у Венесуелі було втрачено, коли нація впала в громадянську війну після вбивства Монкади Відаля комуністичним повстанцем. Уряд тепер бореться проти Fuerzas Armadas de Liberacion Nacional - Bandera Roja, лівого повстанського угруповання.\n\nПоки держава-парія занурюється в анархію, було сформовано спільні Експедиційні сили ОАД-ОВН, за підтримки венесуельських демократичних лідерів у вигнанні, щоб втрутитися в конфлікт і створити стабільніший та дружніший уряд. Скориставшись хаосом, є непогана ймовірність успіху експедиційних сил, хоча якщо вони зазнають невдачі, ніщо інше не врятує Венесуелу."

