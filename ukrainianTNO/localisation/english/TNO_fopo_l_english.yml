easter_coup_info_tt: "§!У місті Сан-Крістобаль, поблизу кордону з @COL §fКолумбією§!, зростає §uЗмова§! проти §SЛівого уряду§! @VEN Венесуели. У міру того як @IBR §OІноземні§! §nВороги§! §SУряду§! збільшують §RПідготовку§!, змова поширюється на невдоволених офіцерів у додаткових казармах. §RПідготовка§! має досягти §Y85§! або більше до Великої середи, щоб змова завершила свій шлях до столиці, Каракасу, і була готова розпочати переворот.\n\n@MEX @BRA §KСоюз§!§nники§! §SУряду§! за кордоном можуть допомогти @VEN Венесуелі розірвати зв'язки між казармами, знижуючи §RПідготовку§!.\n\nКрім того, вони можуть перемогти §uЗмову§!, знизивши її §MСекретність§! до §Y0§!, що дозволить провести §Xцілеспрямовану розправу§! над її керівництвом."

