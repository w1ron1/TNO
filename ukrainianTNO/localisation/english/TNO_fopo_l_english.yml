BRA_CCW_reassign_tt: "\n§YЕфекти після завершення Колумбійської громадянської війни:§!"
BRA_CCW_reassign_hardliners: "Призначити £BRA_hardliners_texticon §gЖорстоких ліній§! на фронт"
BRA_CCW_reassign_hardliners_desc: "Перемога жорстоких ліній є їхньою слабкістю. Призначення деяких з їхніх рядів на колумбійські фронти гарантує, що вони тимчасово зникнуть з наших очей."
BRA_CCW_reassign_sorbonne: "Призначити £BRA_sorbonne_texticon §QSorbonne§! на фронт"
BRA_CCW_reassign_sorbonne_desc: "Сорбонна страждає від почуття обов'язку. Багато з них готові добровільно допомогти нашим союзникам в Колумбії, де вони не матимуть великого впливу на те, як буде керуватися наша нація."
BRA_CCW_reassign_const: "Призначити £BRA_constitutionalists_texticon §KКонституціоналістів§! на фронт"
BRA_CCW_reassign_const_desc: "Конституціоналісти, які залишилися в бразильських збройних силах, є тими, хто мовчить. Вони з радістю погодяться бути переведені на колумбійські джунглі, де їм не доведеться бути під пильним наглядом."

### Reichsstaat Cabal ###
GER_RAC_desc: "Ганс Хюттіг окупував інші африканські райхскомісаріати, проголосивши Великий Африканський Райхштат. Проти нього виступає невелика група офіцерів і адміністраторів, які називають себе «Африканським кабалом», вірних Гермінії. Хоча вони занадто слабкі, щоб діяти самостійно, з нашою допомогою вони зможуть чинити опір божевільному правлінню Хюттіга. Також ми повинні захистити кабал від розкладу, який він переживе, коли Хюттіг помітить їхню діяльність.\n\nАльтернативно... ситуація з кабалом може бути використана на нашу політичну вигоду назад в Геймат, за рахунок шансів на його повалення.\n\nСила кабалу: (§G[?GRO.GRO_REICHSSTAAT_cabal_power|%1]§!)\nЗанепад: (§S[?GRO.GRO_REICHSSTAAT_cabal_decay|%1]§!)\n\n§YСила кабалу визначатиме його шанси на успіх після краху Райхштату...§!"

GER_cabal_supply_weapons: "Оснастити дружні партизанські сили"
GER_cabal_supply_weapons_desc: "Є іронія в тому, що ми фінансуємо партизан для підриву нашої власної колишньої колонії. Але не можна заперечувати, що нам доведеться вдатися до таких методів, щоб ослабити хюттігове захоплення над Африкою: озброївши лояльних німців, які ще борються за залишки Центральної Африки та Південно-Західної Африки, ми змусимо божевільного правителя перенапружити вже слабкі сили, знижуючи його контроль над потворою, яку він називає «державою», і зміцнюючи наших союзників."
GER_cabal_administrative_aid: "Підтримати анти-Хюттігові фракції"
GER_cabal_administrative_aid_desc: "Кабал бореться кожен день, не тільки для того, щоб підірвати захоплення Хюттіга континентом, але й для того, щоб зберегти свої голови на плечах. Це набагато більше, ніж метафора, оскільки Хюттіг відомий своєю схильністю до масових страти за найменшу ознаку зради: відправивши наші секретні служби допомогти їм, ми можемо бути впевнені, що Хюттіг буде занадто зайнятий іншими проблемами, щоб звертати увагу на наших друзів."
GER_cabal_cover_em: "Приховати зусилля кабалу"
GER_cabal_cover_em_desc: "Поки останні вірні люди в Бухлерштадті працюють над тим, щоб підривати божевільне правління Хюттіга, ми повинні переконатися, що вони не будуть розкриті. Спалюючи певні документи та підробляючи інші, ми можемо уникнути підозр щодо наших агентів в Африці, принаймні на даний момент."
GER_cabal_fund_them: "Фінансувати Кабал"
GER_cabal_fund_them_desc: "Кабал — це дорога справа, яка вимагає широкої мережі агентів і хабарів для розширення своєї бази влади та залишатися схованими від параноїдального погляду Хюттіга. Надання наших союзників таємних коштів дозволить зміцнити їхні зв'язки і переконатися, що вони залишатимуться корисними для Райху."

GER_cabal_siphon_funds: "Викачати кошти з Райхштату"
GER_cabal_siphon_funds_desc: "Наші друзі в Кабалі можуть бути дуже корисними для нас. Використовуючи їхні зв'язки, ми можемо красти гроші та викачувати кошти з казни нашої відступницької колонії: хоча це дуже вигідно для нашого бюджету, це, безумовно, поставить кількох членів угруповання під загрозу розкриття, і ми всі знаємо, що трапляється, коли Хюттіг ловить когось із руками на його грошах..."
GER_cabal_implicate_political_enemies: "Залучити наших політичних ворогів"
GER_cabal_implicate_political_enemies_desc: "Хоча першочерговим завданням Кабалу є захист наших інтересів в Африці, вони мають... інші завдання, які можуть бути дуже вигідними для нас. Наприклад, що трапиться, якщо хтось, хто виступає проти наших реформ, буде знайдений з документами, що доводять глибокі та надзвичайно компрометуючі зв'язки з самим Гансом Хюттігом, зрадником райхскомісара, який незаконно окупує наші колонії в Африці і зв'язався з такими людьми, як Гіммлер."

GER_cabal_hide_funding: "Приховати джерела фінансування"
GER_cabal_hide_funding_desc: "Хюттіг та його підручні останнім часом стають підозрілими через наші дії або їхню власну параноїдальність. Було б розумно на якийсь час скоротити наші зусилля і використати наші секретні служби, щоб приховати будь-які сліди нашого таємного фінансування. Між нами, ЦРУ, Токумусокан та СІМ — буквально всі в світі мають причину підривати Райхштат, що робить дуже легким перекласти провину на когось, крім нас..."
GER_cabal_provide_training: "Надати тренування"
GER_cabal_provide_training_desc: "Сили Кабалу малі та слабкі порівняно з СС, які служать Хюттігу. Кожен чоловік важливий, і ми повинні переконатися, що вони будуть готові, коли божевільна імперія Хюттіга неминуче розпадеться. Через наші секретні служби ми проникаємо в спеціальні підрозділи, що займаються навчанням як асиметричної війни, так і контррозвідки, збільшуючи їхню здатність захищатися від параної Хюттіга та чинити опір, коли все навколо них почне руйнуватися."

