  ##The US of A
  USA_PHI_PW_2_desc: "Коли кораблі 14-ї армії мчали на повній швидкості до Токіо, комодор надіслав останній сигнал Морзе до вежі на узбережжі: "Ми повернемося."\n\nТочну дату плутають чутки та дезінформація, які розвідка навіть не почала розплутувати. Тим не менше, прощальний постріл Японії настільки прямолінійний, наскільки і сповнений іронії: те, що Імперія так легко здасться, — це смішно в кращому разі та смертельна жарт у найгіршому. Справжнє випробування почнеться незабаром, у рідкісний момент у житті людини, коли історія повторюється, а легенди розповідаються знову.\n\nТому збери людей, підніми палісад, стань за гармати — але головне, не втрачай надію. Якщо ми побили дияволів один раз, ми зробимо це знову."
