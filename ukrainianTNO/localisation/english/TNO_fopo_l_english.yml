# - | District Tooltips | - #
VEN_CN_fopo_district_1_tt: "§YЛібертадор§!\n-------------\n§GСила мережі§!: §Y[?global.TNO_caracas_coup_control_var^1]%§!\n-------------\n\n\n\n\n £GFX_caracas_nights_description_district_libertador \n\n\n\n\n-------------\n§FВеликий район §WЛібертадор§! формує історичне та адміністративне ядро Каракасу. Батьківщина урядових установ, старих колоніальних кварталів і густої міської забудови, він втілює і спадщину міста, і його виклики.§!"
VEN_CN_fopo_district_2_tt: "§YСукре§!\n-------------\n§GСила мережі§!: §Y[?global.TNO_caracas_coup_control_var^2]%§!\n-------------\n\n\n\n\n £GFX_caracas_nights_description_district_sucre \n\n\n\n\n-------------\n§F§WСукре§! простягається на схід від центру столиці, поєднуючи жваві робітничі громади з ключовими транспортними коридорами. Це один з найгустонаселеніших і найдинамічніших районів метрополії."
VEN_CN_fopo_district_3_tt: "§YЕль-Атільйо§!\n-------------\n§GСила мережі§!: §Y[?global.TNO_caracas_coup_control_var^3]%§!\n-------------\n\n\n\n\n £GFX_caracas_nights_description_district_hatillo \n\n\n\n\n-------------\n§F§WЕль-Атільйо§! розташований у південно-східних пагорбах - тихіший анклав, відомий своїм колоніальним шармом, мистецькою культурою та прохолоднішим кліматом. Він являє разючий контраст із переповненим серцем Каракасу.§!"
VEN_CN_fopo_district_4_tt: "§YЧакао§!\n-------------\n§GСила мережі§!: §Y[?global.TNO_caracas_coup_control_var^4]%§!\n-------------\n\n\n\n\n £GFX_caracas_nights_description_district_chacao \n\n\n\n\n-------------\n§F§WЧакао§! - сучасний комерційний центр столиці, забудований хмарочосами, торговими центрами та офісами. Попри свій невеликий розмір, він уособлює економічний пульс і космополітичну сторону Каракасу."
VEN_CN_fopo_district_5_tt: "§YБарута§!\n-------------\n§GСила мережі§!: §Y[?global.TNO_caracas_coup_control_var^5]%§!\n-------------\n\n\n\n\n £GFX_caracas_nights_description_district_baruta \n\n\n\n\n-------------\n§F§WБарута§! лежить на південно-східному краю міста, де житлові квартали здіймаються зеленими схилами. Поєднання приміського спокою та міського розвитку, він з'єднує столицю з навколишніми долинами."

