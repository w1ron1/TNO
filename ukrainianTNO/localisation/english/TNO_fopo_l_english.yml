IBR_TMW_desc: "Після невдалих вторгнень до повстанського марокканського уряду іберійське військове керівництво окреслило чіткий, рішучий план повернення своїх найважливіших магрибських позицій. План передбачає швидкий, рішучий удар для відвоювання портів Мелілья та Сеута й стримування марокканського натиску та міжнародної уваги.\n\nХоча це не основна мета, Іберія могла б захопити решту регіону Ріф, якщо трапиться нагода, і отримати більший контроль над протокою. Однак такі агресивні дії можуть почати привертати увагу до війни та ризикувати подальшою відплатою з боку уряду Касабланки. Ця війна є критичним моментом для Іберії: або повний відступ з Магрибу, або гідне утримання - і можливе розширення - її залишкової влади."

IBR_The_Shedding_Of_Doubt: "Позбавлення сумнівів"
IBR_The_Shedding_Of_Doubt_desc: "У нас обмежений час для завершення всіх наших операцій у Марокко, і по завершенні відліку нам доведеться вивести війська з Марокко та задовольнитися здобутим."

IBR_A_Matter_Of_Pride: "Справа гідності"
IBR_A_Matter_Of_Pride_desc: "Анклави Сеута та Мелілья - іберійські, і ми не терпітимемо їхньої незаконної марокканської окупації. У наших найкращих інтересах убезпечити їх якнайшвидше."

IBR_The_Pyrrhic_Solution: "Піррове рішення"
IBR_The_Pyrrhic_Solution_desc: "Нам вдалося досягти обмежених здобутків у Марокко, зокрема анклавів Сеута та Мелілья. Хоча ми не контролюємо Ріф, це прийнятний результат."

IBR_The_Return_To_1912: "Повернення до 1912"
IBR_The_Return_To_1912_desc: "Нам вдалося убезпечити наші попередні володіння в Марокко, зокрема анклави Сеута та Мелілья, а також Ріф. Це близько нагадує наші кордони 1912 року, що робить цей результат більш ніж прийнятним."

IBR_TMW_wrapped_up_tt: "Ми §Rзавершили§! наші операції в §YМарокко§!"

