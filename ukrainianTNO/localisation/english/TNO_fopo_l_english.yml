  JAP_WAC_defend_gulf_of_guinea_desc: "Нашим найважливішим пріоритетом у конфлікті в Західній Африці є захист постачання PALF та запобігання доступу до нього Вільної Франції.\n\nМи не бажаємо прямо втручатися в конфлікт та ризикувати ескалацією, але Вільна Франція має значні військово-морські сили, з якими камеруанці не можуть зрівнятися. Незважаючи на наші бажання, ми змушені надати пряме військово-морське забезпечення і ресурси для розвитку флоту Камеруну, щоб захистити наші інтереси в регіоні.\n\n§YКампанія в затоці Гвінеї§! наразі [GetWACGulfAdvantage]"
