  USA_PHI_PW_1_desc: "З 30 000 американців, що робили останні оборонні спроби в Батаані і Коррехідорі, лише половина повернулася додому. Інші загинули в бою, в полоні або втекли в джунглі після припинення репатріації. Пройшло двадцять років, і тепер ситуація виявила справжній розмах їхньої довготривалої кампанії. Тепер лише сто миль розділяють їх від Маніли. Багато хто закликав президента надіслати допомогу нашим старим солдатам. І він так і зробить. Жодного разу більше ми не залишимо наших бійців. Ми не зламаємось вдруге."
