### Operation Bin Qasim ###
GER_OBQ_desc: "Індія палає — і саме її власні армії запалили сірник. Після зради Індійського легіону на користь Сфери ми почали шукати інші шляхи збереження та розширення нашого впливу в регіоні й зрештою знайшли гідних союзників у вигляді Пакистанського руху — виразно проєвропейської сили з тісними зв’язками з нашими мусульманськими партнерами та британськими друзями. Індія може бути вже поза нашою досяжністю, але назавжди відрізати від неї частину територій, поки її військова міць зосереджена на іншому кінці країни, — це цілком здійсненно."
GER_OBQ_PAK_claims_overview: "Територіальні претензії Пакистану"
GER_OBQ_PAK_claims_overview_desc: "Пакистанський рух вважає ці землі своїми. Щоб вони досягли успіху, ми маємо забезпечити їхній контроль над усіма заявленими територіями. Ви можете переглянути виділені регіони на мапі світу."
