################## Angola
 angola_civil_war_please_dont_end_instantly: "Рельєф Анголи"
 USA_angola_civil_war_desc: "Після колапсу попередніх властей в Анголі, ця колишня португальська колонія розпалася. Корінне населення тривалий час було поділено на дві фракції: про-західну, демократичну фракцію УНІТА та панафриканістську, соціялістичну фракцію ПЛУАА. Напруженість нарешті досягла неконтрольованого рівня, коли почалася війна; конфлікт знову спалахує на південно-західній Африці. Як завжди, в цьому хаосі існує ризик і можливість для нас."

 USA_angola_plant_mines: "Посадка мін у [?From.GetName]"
 USA_angola_plant_mines_desc: "Ми надамо інструкції місцевим силам у [?From.GetName] посадити міни по всьому регіону, щоб уповільнити моторизовані наступи."

 USA_angola_bombing_campaigns: "Бомбардувальна кампанія у [?From.GetName]"
 USA_angola_bombing_campaigns_desc: "Ми надамо нашим бомбардувальникам дозвіл почати вильоти, спрямовані на війська [?ANL.GetName] у [?From.GetName]."

 US_bombing_ANG_active: "Має активну бомбардувальну кампанію в Анголі."

 USA_guns_for_diamonds_ANG: "Зброя за діаманти"
 USA_guns_for_diamonds_ANG_desc: "Провінція Лунда на північному сході Анголи має багатство діамантів. Поточна громадянська війна означає, що вони були б більш ніж готові обміняти ці коштовності на зброю за вигідною ціною.\n\n\"Це ж не конфліктні діаманти, так? Не бреши мені, чувак.\""

 USA_ANG_sit_down_with_savimbi: "Зустріч із Савімбі"
 USA_ANG_sit_down_with_savimbi_desc: "Савімбі здобув підтримку кількох помітних американських консерваторів. Ми організуємо неформальну зустріч між цими лідерами та ангольцем як знак доброї волі."

 ANG_savimbi_acknowledged: "Американська залученість до Савімбі"

 USA_ANG_CIA_intelligence_SAF: "Співпраця з Південноафриканською розвідкою"
 USA_ANG_CIA_intelligence_SAF_desc: "ЦРУ, у координації з південноафриканською розвідкою, надасть деталі про пересування військ [?ANL.GetName], що дозволить нашим союзним силам краще протистояти їхнім атакам."

 USA_ANG_CIA_intelligence: "Надати розвіддані ЦРУ"
 USA_ANG_CIA_intelligence_desc: "Агенти ЦРУ в регіоні нададуть деталі про пересування військ [?ANL.GetName], що дозволить нашим союзним силам краще протистояти їхнім атакам."

 USA_ANG_economic_aid: "Надати промислову підтримку"
 USA_ANG_economic_aid_desc: "Ми надамо фінансування для підтримки промисловості [?ANG.GetName] у підтримку воєнних зусиль."

 USA_ANG_send_military_advisors: "Відправити військових радників"
 USA_ANG_send_military_advisors_desc: "Американські військові радники навчать війська [?ANG.GetName] сучасним тактикам і озброєнню."

