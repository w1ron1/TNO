### GER
################## SAW
 GER_bor_saw_desc: "§YУЧАСТЬ:§! [GetBORSAWInvolvement] ([?GER_Bormann_SAW_involvement|Y1]§Y%§!)\n§MПРОТЕСТ:§! [GetBORSAWProtest] ([?GER_Bormann_SAW_civilian_protest|Y1]§Y%§!)\n\nНаша стратегія наразі — [getBORSAWStrategy].\n\n§RВійна в Південній Африці§! не була ініційована і навіть не планувалася §YФюрером§!, проте ми можемо отримати з неї користь. Рішення витіснити §RСполучені Штати§! з Африки чи §Gвідступити§! матиме наслідки.\n\nНезважаючи на все це, §Mцивільне населення§! вже протестує проти нашої участі у цій війні. Ми повинні обережно збалансувати їхні вимоги і наші плани або ж §Rбудемо змушені відступити§!."

################## Congo
 GER_congo_civil_war_desc: "Африка була втрачена для нас, проте, здається, наші проблеми на цьому континенті не завершуються. Після хаосу в Конго адміністрація в Леопольдвілі звернулася за нашою підтримкою — і, можливо, в цьому є можливість відновити хоча б частину втраченого."
 JAP_congo_civil_war_desc: "Конго охоплений хаосом, і з американцями та німцями, що намагаються контролювати залишки, наш обов'язок — позбавити цих імперіалістів будь-яких вигод від Конго. Наша перемога в Конго зміцнить наш вплив і продовжить утримувати Африку від наших ворогів."
 USA_congo_civil_war_desc: "Конго охоплений хаосом, і з японцями та німцями, що намагаються контролювати залишки, наш обов'язок — позбавити цих тиранів будь-яких вигод від Конго. Наша перемога в Конго зміцнить наш вплив і продовжить утримувати Африку від наших ворогів."
 OFN_congo_civil_war_desc: "Колишня гордість американської моделі націобудівництва, Конго нині стикається з майже анархічним безладом, оскільки американська адміністрація розвалюється під власною вагою. Від веж Леопольдвіля до джунглів Катанги, Конго занурене у безлад, де місцеві повстанці піднімаються, щоб скинути залишки американського панування, а елементи підступної місцевої СС, що продовжує діяти в глибині Конго, залишаються як ракова пухлина, що продовжує загрожувати усім. Прогнози щодо майбутньої деколонізації та процвітання виявилися досить короткозорими й наївними; чи побачить Конго коли-небудь мир?"

