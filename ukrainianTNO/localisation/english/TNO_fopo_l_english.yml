## USA ##
USA_INDCW_desc: "Індійський субконтинент протягом століть бачив війни з іноземними загарбниками — від Олександра Великого до Британської імперії та японських фашистів. Тепер в історії воєн Індії пишеться новий кривавий розділ: Індійська громадянська війна, або Війна за возз’єднання, палає між проамериканською Республікою Індія та прояпонською державою Азад Хінд. Усі й будь-які мирні переговори зазнали краху, і лише війна здатна знову об’єднати розколоту країну.\n\nРІ є однією з найбільших демократій світу та має всі шанси стати одним із найважливіших союзників ОФН, відіграючи ключову роль у справах Близького Сходу й Азії. Втрата Індії на користь Японії стала б катастрофічним провалом — таким самим жахом для Вашингтона, яким колись була для Лондона. Але якщо свобода здолає фашизм, Японія може ніколи не оговтатися від цього удару."

