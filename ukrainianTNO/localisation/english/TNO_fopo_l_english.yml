 BRA_SAW_begin_blockade: "§YОперація "Останній Поклик"§!"
 BRA_SAW_begin_blockade_desc: "Адмірал Тоскано буде відповідальним за організацію часткової морської блокади атлантичних портів Африканського Щита, блокуючи постачання з Ґерманії та її союзників."
 BRA_saw_blockade: "Бразильська морська блокада"
 BRA_saw_blockade_desc: "З початком втручання Бразилії у Південноафриканську війну, бразильські кораблі почали обмежувати торгівлю і ресурси, що надходять до наших країн. Це почало суттєво впливати на нашу промисловість і може поступово задушити нас, якщо ми не здобудемо перемогу найближчим часом."

 BRA_SAW_reassign_hardliners: "Відправити £BRA_hardliners_texticon §gРадикалів§! на фронт"
 BRA_SAW_reassign_hardliners_desc: "Слабкість так званих Радикалів полягає в їх надмірній амбіційності. Відправка частини їхніх лідерів на африканські фронти дозволить уникнути їхньої участі у внутрішніх справах на деякий час."
 BRA_SAW_reassign_sorbonne: "Відправити £BRA_sorbonne_texticon §QСорбонну§! на фронт"
 BRA_SAW_reassign_sorbonne_desc: "Члени Сорбонни часто страждають від почуття обов'язку. Багато з них готові служити на передовій у Південноафриканській війні, де вони матимуть менший вплив на державні справи."
 BRA_SAW_reassign_const: "Відправити £BRA_constitutionalists_texticon §KКонституціоналістів§! на фронт"
 BRA_SAW_reassign_const_desc: "Конституціоналісти, що залишились у бразильських збройних силах, - це ті, хто тримав язик за зубами. Вони навряд чи заперечать проти переведення на південноафриканський фронт, радіючи можливості уникнути пильного нагляду."

