### JAP

################## Malaya
 JAP_SHO_aid_category_desc: "Шонан вже досить довгий час є однією з наших найпроблемніших колоній. З моменту, як ми відібрали його у британців, більшість населення справедливо сприймає нас як визволителів, що рятують Малайю від експлуатації в руках Британії. Проте інші взялися за зброю проти нашого уряду, і колонія застрягла у постійному циклі між військовим урядом і повстанцями. У нашій останній операції ми повернули Шонан і всі порти з-під контролю їх незаконного уряду, проте отримали інформацію, що вони звернулися за допомогою до американців.\n\nЗрозуміло, що ситуація у Південно-Східній Азії виходить з-під нашого контролю, і необхідно негайно застосувати жорсткіші заходи, починаючи зі знищення Чин Пена та UMAJF раз і назавжди, перш ніж ми звернемо увагу на Філіппіни та їхню власну проблему з повстанцями.\n\nГаваї можуть бути надмірністю, але Тихий океан належить нам, і ми не допустимо цього виклику нашому контролю над ним."

