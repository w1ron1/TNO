  JAP_WAC_offensive_wolofia: "Підготувати офензиву в Волофії"
  JAP_WAC_offensive_wolofia_stagnate: "Фронт у Волофії стагнує"

  JAP_WAC_offensive_burkina: "Підготувати офензиву в Моссі"
  JAP_WAC_offensive_burkina_stagnate: "Фронт у Моссі стагнує"
  # unused
  USA_congo_confrontation_WA: "§ROперація Коїлд Пітон§!"
  USA_congo_confrontation_WA_desc: "Військові вожді та дрібні тирани північного Конго не дуже схвалюють нашу спробу керувати їхньою територією, але вони також не люблять своїх камерунських сусідів, які аналогічно загрожують їхньому правлінню. В обмін на зброю та обіцянку легшого підходу ми можемо змусити їх зосередити свою увагу на півночі."

################## Mano Campaign

  USA_mano_timer: "Мобілізаційні зусилля"
  USA_mano_timer_desc: "Минуло всього кілька років з моменту, коли ми востаннє прибули на Золотий Берег, щоб врятувати нашого союзника від червоного потоку та його японських союзників, і ми зазнали поразки. Тепер ті ж сили, які влаштували різанину останній надії Франції, знову повернулися за демократіями Західної Африки, але ми відмовляємося робити ті ж помилки, що й у попередній війні.\n\nВеличезний масштаб панафриканського вторгнення зробив плани на незначну підтримку чи обмежене втручання безперспективними; якщо ми хочемо вигнати їх та захистити кордони наших союзників, ми повинні розгорнути свої війська на місці. Відстань між Західною Африкою та Америкою величезна, і перетнути її детально займе багато часу, тому ми повинні зробити все можливе, щоб прискорити нашу мобілізацію та розгортання. Кожна година має значення."
  mano_campaign_ongoing: "Кампанія Мано триває"
  mano_campaign_over: "Кампанія Мано закінчилася"
  USA_mano_success_tooltip: "Ми завершимо мобілізацію на території Пакту Мано."

  USA_mano_deploy_taskforce: "Розгорнути оперативну групу"
