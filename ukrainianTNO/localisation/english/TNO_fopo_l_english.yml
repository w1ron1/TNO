VEN_VR_desc: "Наш венесуельський союзник мало не впав під масштабним наступом комуністичного ФАЛН, але утримав позиції значними силами. Тепер повстанці заліковують рани в Андах, збираючи своїх прихильників у своєму бастіоні Сьюдад-Болівар та зрадників у селищах і університетах.\n\nНаближається ще одна червона хвиля. Ми мусимо зламати її гребінь, інакше втратимо Венесуелу назавжди."

