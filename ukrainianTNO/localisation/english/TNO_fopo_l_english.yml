## IBR ##
IBR_PP_invasion_desc: "Наші агенти в Гавані передали тривожні повідомлення, що кубинський уряд почав навчання 'Карибського легіону' — групи найманців, які готуються вторгнутися в Домініканську Республіку і повалити режим Трухільйо. Чутки про зростання спротиву в самій Д.Р. ще раз доводять, що контроль нашого друга більше не є таким міцним. Очевидно, що це зусилля організували американці.\n\nЯкщо ми хочемо зберегти хоча б якусь майбутню впливовість у Карибському регіоні, ми повинні забезпечити виживання Трухільйо та знищити Легіон."
IBR_PP_ceasefire_desc: "Наші агенти в Гавані передали тривожні повідомлення, що кубинський уряд почав навчання 'Карибського легіону' — групи найманців, які готуються вторгнутися в Домініканську Республіку і повалити режим Трухільйо. Чутки про зростання спротиву в самій Д.Р. ще раз доводять, що контроль нашого друга більше не є таким міцним. Очевидно, що це зусилля організували американці.\n\nЯкщо ми хочемо зберегти хоча б якусь майбутню впливовість у Карибському регіоні, ми повинні забезпечити виживання Трухільйо та знищити Легіон."
IBR_PP_invasion_text: "Наші агенти оцінюють, що поточне £GFX_PHI_supply_texticon §LПостачання§! Легіону становить десь між §L[?IBR.IBR_PP_supply_low]/100§! та §L[?IBR.IBR_PP_supply_high]/100§!"

