################## WAC

 BRA_wac_desc: "Президент Ласерда прагне довести, що його гучна підтримка тісного партнерства зі Сполученими Штатами та ОФН - це більше, ніж порожні слова. Зі спалахом конфлікту в Західній Африці американці знову згуртовують альянс для інтервенції, і Бразилія відповість на цей заклик. Уже розглядається широкий спектр операцій: від антипіратських дій у Гвінейській затоці до застосування авіації та наземних військ на підтримку Вільної Франції.\n\nЯкщо ця авантюра принесе плоди, ми доведемо і союзникам, і суперникам, що Бразилію не варто недооцінювати. Проте нездатність досягти швидких і рішучих результатів легко буде використана проти нас, кинувши темну тінь на зовнішню політику президента..."
 BRA_WAC_reassign_hardliners: "Спрямувати £BRA_hardliners_texticon §gРадикалів§! на фронт"
 BRA_WAC_reassign_hardliners_desc: "Надмірні амбіції так званих Радикалів є їхньою слабкістю. Відправлення частини їхніх лав на африканський фронт дозволить на певний час позбутися їхньої присутності."
 BRA_WAC_reassign_sorbonne: "Спрямувати £BRA_sorbonne_texticon §QСорбонну§! на фронт"
 BRA_WAC_reassign_sorbonne_desc: "Членів Сорбонни обтяжує почуття обов’язку. Багато хто з них охоче вирушить на фронти Західноафриканської кризи, де матиме мінімальний вплив на управління країною."
 BRA_WAC_reassign_const: "Спрямувати £BRA_constitutionalists_texticon §KКонституціоналістів§! на фронт"
 BRA_WAC_reassign_const_desc: "Конституціоналісти, що залишилися в бразильських збройних силах, - це ті, хто вмів мовчати. Вони навряд чи заперечуватимуть проти переведення на західноафриканський фронт, раді уникнути пильної уваги."
 BRA_WAC_reassign_tt: "\n§YЕфекти після завершення Західноафриканської війни:§!"
 BRA_WAC_increase_commitments: "Збільшити зобов’язання в Західній Африці"
 BRA_WAC_increase_commitments_alot: "Різко збільшити зобов’язання в Західній Африці"
 BRA_WAC_pull_out: "ОПЕРАЦІЯ «НЕБЕЗПЕЧНА БЛИЗЬКІСТЬ»"
 
 BRA_WAC_brazilian_tech_assistance: "Надати бразильську технічну допомогу"
 BRA_WAC_brazilian_tech_assistance_desc: "Через хаос війни та часті бомбардування авіації PALF промисловий і технічний сектори Вільної Франції перебувають у стані розладу. Бразилія надасть техніків та інженерів Вільній Франції, щоб допомогти збільшити виробництво піхотного спорядження й забезпечити її війська достатньою кількістю зброї."
 BRA_WAC_operation_search_destroy: "ОПЕРАЦІЯ ЗНАЙТИ І ЗНИЩИТИ"
 BRA_WAC_operation_search_destroy_desc: "Природа Західноафриканської кризи - це логістичний жах, де за кожним кущем можуть ховатися партизани. Підрозділи PALF, що добре знають місцевість, здатні влаштовувати засідки нашим військам і безслідно зникати. Тим часом їхні сили прориваються крізь наші лінії та сіють хаос у тилу. Цьому потрібно покласти край. Ми розпочнемо операції з пошуку та знищення, щоб знищити цих партизанів і командос."
 BRA_anti_piracy_operations: "Бразильські антипіратські операції"
 BRA_anti_piracy_operations_desc: ""
 
 BRA_WAC_show_navy: "    §iПоказати морські рішення§!"
 BRA_WAC_stranglehold: "ОПЕРАЦІЯ ЗАШМОРГ"
 BRA_WAC_stranglehold_desc: "Армія здатна діяти лише доти, доки має необхідні засоби ведення війни. Стратегічно використовуючи наш флот для блокади імпорту та постачань PALF, ми змусимо Камерун зосередитися на внутрішньому виробництві, обмеживши його спроможність вести бойові дії."
