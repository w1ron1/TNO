  ##Japan
  JAP_PHI_PW_1_desc: "Філіппінське повстання — це, мабуть, найтриваліший конфлікт, який IJA коли-небудь мав честь придушувати, можливо, тільки з Малаї. Розташування на цих островах часто означає кінець для кожного мисливця за славою та кар'єриста, бо їх джунглі пропонують лише малярію та ліки калібру .50. Ще більше ускладнюють будь-який тривалий успіх урізання бюджету попередніх міністерств, що зменшило чисельність колись могутньої 14-ї армії до звичайної гарнізонної одиниці — тенденція, яку нещодавно зупинив згубний сплеск повстанців.\n\nТим не менш, важливість архіпелагу рідко перебільшена. Перлина Ориєнту забезпечує не тільки наші морські шляхи до Індонезії, але й є нашою великою захисною стіною проти американського велетня. Втрата зараз залишить наші землі та моря відкритими для західного вторгнення; Боже, що тоді станеться.\n\nНаше завдання може бути невдячним і кровопролитним, але воно необхідне. Давайте до справи."
