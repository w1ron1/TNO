IBR_CN_regroup_perezjimenezistas: "Перегрупувати перес-хіменістів"
IBR_CN_regroup_perezjimenezistas_desc: "Колишній венесуельський каудильйо Маркос Перес Хіменес утримує значну кількість лоялістів у армії. Ми завітаємо до його резиденції в Мадриді та підготуємо кореспонденцію для офіцерів, готових приєднатися до нашої мережі."
IBR_CN_incite_national_sentiment: "Розпалити національні почуття"
IBR_CN_incite_national_sentiment_desc: "Кальдера занадто затісно дружить з канадцями та американцями - ганьба для спадщини Визволителя! Принаймні, саме так говоритимуть чутки, які ми поширимо через форт Тіуна."
IBR_CN_coordinate_with_rightist_legislators: "Координувати з правими законодавцями"
IBR_CN_coordinate_with_rightist_legislators_desc: "Революційний тріумвірат КОПЕЙ, СРД та ДД ігнорує нечисленних правих законодавців, поки самі сваряться між собою. Тим не менш, ці заможні та добре пов'язані громадяни стануть цінними елементами нашої мережі."
IBR_CN_hide_stockpiles_in_el_avila: "Сховати запаси в Ель-Авіла"
IBR_CN_hide_stockpiles_in_el_avila_desc: "Лісистий гірський парк Ель-Авіла - ідеальне місце для тайників і схованок наших агентів. Розмістімо кілька серед польових квітів."
IBR_CN_tempt_officers_with_vice: "Спокушати офіцерів пороками"
IBR_CN_tempt_officers_with_vice_desc: "Венесуельське воїнство дисципліноване й впорядковане. Та навіть язик доброго християнина може розв'язатися після смаку нічного життя Барути."
IBR_CN_expand_network_into_miranda: "Розширити мережу на Петаре"
IBR_CN_expand_network_into_miranda_desc: "Зростаючі нетрі всередині Петаре створюють густонаселений анклав у східному Каракасі. Трохи диверсифікації та угод з місцевими бандами можуть відкрити нові шляхи для нашої мережі."
IBR_CN_form_traditionalist_circles: "Сформувати традиціоналістські кола"
IBR_CN_form_traditionalist_circles_desc: "Санта-Росалія благослови Ель-Атільйо. Високо над Каракасом ми можемо змішатися з релігійними колами та завсідниками заміських клубів - обидві групи відчужені від революційної політики Венесуели."
IBR_CN_smuggle_an_exile_back: "Таємно повернути вигнанця" #this could be exiles
IBR_CN_smuggle_an_exile_back_desc: "Прихильники Нового національного ідеалу шукали притулку в Іберії після повалення законного уряду Венесуели. Поки DIGEPOL у безладі, настав час повернути одну впливову постать додому."
IBR_CN_pump_guns_and_money: "Накачати зброєю та грошима"
IBR_CN_pump_guns_and_money_desc: "Нам потрібно показати нашій мережі, що далека Іберія може здійснити їхні амбіції. Ніщо не переконує краще за ящики заряджених рушниць і песет."
IBR_CN_pressure_from_the_pulpit: "Тиск з амвону"
IBR_CN_pressure_from_the_pulpit_desc: "Обмежена, але корисна кількість праведних священників, що поділяють франкістське мислення, виступають проти революційних партій Венесуели - навіть проти "соціально-християнських" єресей КОПЕЙ. Скористаймося одним з них, щоб розширити нашу паству."
IBR_CN_plant_explosives_at_politicians_homes: "Закласти вибухівку в будинках політиків"
IBR_CN_plant_explosives_at_politicians_homes_desc: "Вчинки промовляють гучніше за слова. А найгучніша демонстрація провалів DIGEPOL - це бомба."

# - | Mexico Decisions | - #
MEX_CN_deploy_the_best_and_brightest: "Розгорнути найкращих і найталановитіших"
MEX_CN_deploy_the_best_and_brightest_desc: "Уряд СРД Вільяльби може похвалитися вражаючими технократичними якостями. Залучімо кількох членів до нагального політичного завдання - гарантування безпеки Каракасу."
MEX_CN_stress_unity_above_all: "Наголосити на "єдності понад усе""
MEX_CN_stress_unity_above_all_desc: "Уряд КОПЕЙ Кальдери - об'єднувальна сила. Підсилімо цей меседж на вулицях Каракасу листівками та промовцями."
MEX_CN_stiffen_miraflores_guard: "Посилити охорону Мірафлорес"
MEX_CN_stiffen_miraflores_guard_desc: "Безпеку президента треба убезпечити від іберійських диверсій. DFS почалася як охоронці Алемана - можливо, вони зможуть навчити своїх колег з DIGEPOL кільком трюкам."
MEX_CN_monitor_altimira_and_la_praza_francia: "Спостерігати за площею Альтаміра та Голден-Майл"
MEX_CN_monitor_altimira_and_la_praza_francia_desc: "Відбивний басейн площі Альтаміра - природне місце збору протестувальників та інтриганів, тоді як Голден-Майл, фінансовий район з одними з найдорожчих цін у Латинській Америці, цілком може паралізувати місто, якщо його заблокувати. Встановімо ретельне спостереження за районом."
MEX_CN_establish_commercial_connections: "Встановити комерційні зв'язки"
MEX_CN_establish_commercial_connections_desc: "Бізнесмени Барути завжди тримають вухо гостро щодо можливостей. Кілька угод, і ми дізнаємось найновіші відомості про іберійську контрабанду в Каракасі."
MEX_CN_stage_student_rallies: "Організувати студентські мітинги"
MEX_CN_stage_student_rallies_desc: "Численні університети Сукре роблять цей район природним бастіоном опору реакційній політиці Іберії. Використаймо цих радикалів з користю хоч раз."
MEX_CN_connect_to_caracas: "Налагодити зв'язок з Каракасом"
MEX_CN_connect_to_caracas_desc: "Висота Ель-Атільйо залишає його відрізаним від більшої частини Каракасу. Ми можемо покращити доступ DIGEPOL і заспокоїти мешканців, фінансуючи нову інфраструктуру."
MEX_CN_send_veracruz_dignitary: "Надіслати сановника з Веракруса"
MEX_CN_send_veracruz_dignitary_desc: "Веракруський форум об'єднує великих діячів революційної Латинської Америки. Візит високого рівня до Каракасу надихне захисників Венесуели."
MEX_CN_embed_an_agent: "Впровадити агента"
MEX_CN_embed_an_agent_desc: "OCAE значно покращила нашу координацію з венесуельською розвідувальною службою DIGEPOL. Вони, безсумнівно, привітають ще одного тигра DFS, що блукає темними провулками Каракасу."
MEX_CN_mobilize_the_ruling_party: "Мобілізувати правлячу партію"
MEX_CN_mobilize_the_ruling_party_desc: "Венесуельський уряд не був би при владі без своїх вірних організаторів у Каракасі, серці, що б'ється в країні. Влаштуймо демонстрацію сили масовим мітингом!"
MEX_CN_joint_naval_exercise_in_caracas_bay: "Спільні морські навчання в затоці Каракасу"
MEX_CN_joint_naval_exercise_in_caracas_bay_desc: "Могутній флот Ларрасабаля допоміг здійснити венесуельську революцію, і тепер він захищатиме її. Разом з мексиканськими та кубинськими суднами ми залякаємо зрадників!"

