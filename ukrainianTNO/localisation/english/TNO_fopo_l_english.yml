## MEX ##
MEX_PPI_desc:0 "Домініканська Республіка є латиноамериканським притулком для найогиднішої ідеології світу та неодноразово намагалася підтримати різні фашистські фракції у нашій країні. Це не може залишитися без уваги! Разом з нашими союзниками в Америці та на Кубі ми створимо багатонаціональну інвазійну силу, щоб знищити ворогів Мексики за кордоном."
MEX_PP_invasion_text:0 "Поточні £GFX_PHI_supply_texticon §LSupply§! для Легіону становлять §L[?USA.US_PP_supply]/100§!\nМінімальні поставки для вторгнення £GFX_PHI_supply_floor_texticon §Sмінімальний запас§! становлять §S[?USA.US_PP_supply_perc]§!"
MEX_PP_mexican_american_cooperation_tt:0 "Співпраця між §KMexico§! та §MUnited States§! наразі на рівні [MEX.GetPPMexican_American_Cooperation]"
MEX_PP_mexican_american_cooperation_ttd:0 "Сили, які протистоять §LТрухільйо§! та фашистському режиму, що править Домініканською Республікою, походять не з однієї країни, а з кількох. Взаємини між §KMexico§! та §MUnited States§! будуть особливо важливими для визначення долі останньої диктатури Карибського басейну, якщо вона впаде."
no_ma_pp_cooperation:0 "§gnвідсутня§!."
poor_ma_pp_cooperation:0 "§Rслабка§!."
decent_ma_pp_cooperation:0 "§wприйнятна§!"
