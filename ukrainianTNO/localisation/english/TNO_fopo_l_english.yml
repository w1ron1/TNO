GER_decrease_cabal_strength_tt: "Сила кабалу §Rзменшиться§! на §Y$RIGHT|%$§!.\n"
GER_cabal_not_maxed_out: "Вплив Кабалу ще не досяг максимального рівня."
GER_cabal_require_5_influence: "Кабал повинен мати хоча б §Y5%§! впливу."
GER_decrease_cabal_decay: "Щоденне §Rзанепад§! сили кабалу §Gзменшиться§! на §Y0.1%§!.\n"
GER_cabal_decaying: "Щоденний §Rзанепад§! сили кабалу §Gбільший§! ніж §Y0.1%§!.\n"

