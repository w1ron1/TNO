 BRA_SAW_reassign_tt: "\n§YЕфекти після завершення Південноафриканської війни:§!"
 BRA_SAW_weapons_category_desc: "Лише кілька десятиліть тому бразильці героїчно боролися проти нацистської загрози через Атлантику, захищаючи Британію, коли німці розпочали Операцію 'Морський лев'. Тепер знову загроза чобота нацистів нависає над Південною Африкою, намагаючись знищити демократію.\n\nНаша участь у Південноафриканській війні обмежена, але Бразилія знаходиться у унікальній позиції, щоб контролювати Атлантику та забезпечити постачання американської зброї. Після Лобстерної війни ми отримали неоціненний досвід боротьби проти нацистів і розвіддані про їх колоніальні сили, і ми не забули про атаки фашистів на наші конвої, які змусили нас взяти участь у війні.\n\nПравда, що війна в Південній Африці переважно наземна, і наш недавній досвід антифашистської боротьби здебільшого пов'язаний з морськими операціями. Крім того, є ті, хто воліє, щоб ми не мали нічого спільного з американцями. Але ми не можемо ризикувати повторенням Лобстерної війни; ми повинні захистити нашу країну від впливу фашизму та зробити все можливе, щоб ще одна країна не впала під жорстоке ярмо нацистського імперіалізму!\n\nБразилія повинна перемогти!"

 BRA_SAW_brazilian_tech_assistance: "Надати технічну допомогу Бразилії"
 BRA_SAW_brazilian_tech_assistance_desc: "Через хаос війни та часті бомбардування ВПС Шильда, промисловий та технічний сектори Південної Африки у занепаді. Бразилія надасть технічних спеціалістів та інженерів для допомоги Південній Африці у збільшенні виробництва піхотного спорядження, щоб забезпечити солдатів необхідною зброєю."
 BRA_brazilian_tech_assistance: "Технічна допомога Бразилії"
 BRA_brazilian_tech_assistance_desc: "Бразилія допомагає нашій промисловості та дослідженням для створення та виробництва піхотного обладнання для військових дій."
 BRA_SAW_operation_search_destroy: "ОПЕРАЦІЯ ПОШУК І ЗНИЩЕННЯ"
 BRA_SAW_operation_search_destroy_desc: "Характер війни в Південній Африці - це логістичний кошмар із партизанами за кожним кущем. Бурські війська, які знають місцевість, можуть засідати на наші підрозділи та зникати без сліду. Тим часом командос Шильда проникли через наші лінії та спричинили хаос. Це має бути припинено. Ми розпочнемо операції пошуку та знищення, щоб знешкодити цих партизанів і командос."
 BRA_brazilian_search_and_destroy_operations: "Операції з пошуку та знищення Бразилії"
 BRA_brazilian_search_and_destroy_operations_desc: "Бразилія почала виконувати операції з пошуку та знищення. Полювання на осередки опору та німецькі загони командос і їх знищення. Це зменшить кількість опору, з яким ми стикаємося на захоплених територіях."
 BRA_SAW_operation_withdraw: "ОПЕРАЦІЯ ЕВАКУАЦІЯ"
 BRA_SAW_operation_withdraw_desc: "Незважаючи на всі зусилля бразильських військових, ситуація на війні розвивається не на користь Бразилії. Наступ Шильда на Південну Африку не зупинився, і Південноафриканська республіка на межі краху. Подальша участь у війні може призвести до того, що ми не зможемо повернути наших солдатів додому, що стало б катастрофою. Ми не можемо допустити цього і негайно надішлемо накази про виведення наших військ. Ми надішлемо свої найкращі побажання Південній Африці та американцям, що залишилися, але решту війни їм доведеться вести самостійно."

