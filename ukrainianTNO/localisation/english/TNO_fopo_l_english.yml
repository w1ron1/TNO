  JAP_WAC_prepare_offensive_campaign_desc: "Американці, французи та їхні місцеві союзники переважно воюють на ворожій території. Ми будемо координувати дії з нашими африканськими союзниками, щоб спланувати наступ за лінією фронту, атакуючи їхні лінії постачання і знижуючи моральний дух ворога. Після початку операції на передових частинах буде використано цю ситуацію для прориву їхніх сил."
  JAP_WAC_prepare_offensive_campaign_mission_desc: "Американці, французи та їхні місцеві союзники переважно воюють на ворожій території. Ми будемо координувати дії з нашими африканськими союзниками, щоб спланувати наступ за лінією фронту, атакуючи їхні лінії постачання і знижуючи моральний дух ворога. Після початку операції на передових частинах буде використано цю ситуацію для прориву їхніх сил."

