IBR_SalvadoranCoup_TheOldPartiasFavor: "Прихильність старої Патрії"
IBR_SalvadoranCoup_TheOldPartiasFavor_desc: "§F-------------\nЩоразу, коли ухвалюється це рішення, його вартість £political_power_texticon  зростає на §Y5§!. Тим часом, його вартість у §Y$$M§! §Jпрямо пропорційна§! значенню §WВійськової готовності§!.\n-------------\n§!Слабкий уряд Сальвадору дозволив §&кастристському§! бруду просочитися в збройні сили. Спрямовуючи їх на лівих змовників, ми убезпечуємо справжніх сальвадорських патріотів."
IBR_SalvadoranCoup_TheOldPartiasFavor_CostPP_tt: "(§WВартість рішення £political_power_texticon §!): §R+5§!."

IBR_SalvadoranCoup_ArmsForTheWorthy: "Зброя для достойних"
IBR_SalvadoranCoup_ArmsForTheWorthy_desc: "§F-------------\nЩоразу, коли ухвалюється це рішення, його вартість £GFX_weapon_icon  зростає на §Y100§!.\nЙого сила вища, якщо §&Кастристи§! домінують.\n-------------\n§!Логістика озброєння сальвадорських патріотів з Іберії - справжнє пекло. Ми попрацюємо над переозброєнням певних... заповзятливих торговців у регіоні, що постачають зброю §,Іспаністам§!."

IBR_SalvadoranCoup_DesordenFromORDEN: "Безлад від ORDEN"
IBR_SalvadoranCoup_DesordenFromORDEN_desc: "Медрано, голова Національної гвардії Сальвадору та її розвідувального агентства ORDEN, відомий шанувальник іберійського врядування. Якби він "відпустив" кількох замучених цивільних осіб на публічний огляд, хиткий уряд Рівери отримав би ще один поштовх."

IBR_SalvadoranCoup_HomemadeNationalMartyrs: "Домашні національні мученики"
IBR_SalvadoranCoup_HomemadeNationalMartyrs_desc: "§F-------------\nЦе рішення шкодить Стабільності та Підтримці війни §WСальвадору§! §Jпропорційно§! до Домінування §,Іспаністів§!.\n-------------\n§!Так мало праведних людей готові віддати життя за Сальвадор. Інших можна переконати кількома правдоподібними погрозами їхнім родинам."
IBR_SalvadoranCoup_HomemadeNationalMartyrs_Error_tt: "§sПОМИЛКА: НЕВІДОМИЙ ЕФЕКТ. БУДЬ ЛАСКА, ВИКОНАЙТЕ ПЕРЕДУМОВИ РІШЕННЯ, ЩОБ ПРОДОВЖИТИ.§!"

IBR_SalvadoranCoup_GiftsAndFavors: "Подарунки та послуги"
IBR_SalvadoranCoup_GiftsAndFavors_desc: "§F-------------\nЩоразу, коли ухвалюється це рішення, його вартість£GFX_green_dollar_sign зростає на §Y5M§!.\nЯкщо його вартість перевищує §Y$15M§!, воно буде потужнішим.\n-------------\n§!Багато сальвадорських посадовців мають забагато що втратити в перевороті, щоб їх можна було схилити подарунками в межах наших можливостей. Однак їхні особисті секретарі..."
IBR_SalvadoranCoup_GiftsAndFavors_modifier_tt: "§WЗусилля уряду§! з боротьби проти §,Змо§!§&ви§! будуть менш ефективними у зниженні §WВійськової готовності§! та §WГніву цивільного населення§!."

IBR_SalvadoranCoup_UnderTheTableBargaining: "Закулісні перемовини"
IBR_SalvadoranCoup_UnderTheTableBargaining_desc: "§F-------------\nЩоразу, коли ухвалюється це рішення, його вартість£GFX_green_dollar_sign зростає на §Y5M§!.\nЯкщо §,Іспаністи§! домінують, §WВійськова готовність§! зростає, але §,День§! §&Розплати§! [ELS.GetFlag] наближається швидше.\nЯкщо §&Кастристи§! домінують, ефекти протилежні.\n-------------\n§!Корупція пронизує адміністрацію Рівери, як і її попередників. Ми можемо натиснути на непохитного кавового олігарха, щоб залучити його клан на свій бік."
IBR_SalvadoranCoup_UnderTheTableBargaining_Day_Increase_tt: "Додає §Y15§! днів до §,Дня§! §&Розплати§! [ELS.GetFlag]§W.§!"
IBR_SalvadoranCoup_UnderTheTableBargaining_Day_Decrease_tt: "Забирає §Y15§! днів від §,Дня§! §&Розплати§! [ELS.GetFlag]§W.§!"

IBR_SalvadoranCoup_SpreadingAnInferno: "Розпалюючи пекло"
IBR_SalvadoranCoup_SpreadingAnInferno_desc: "§F-------------\nЦе рішення збільшує §WВійськову готовність§! на §Y20%§! від §WГніву цивільного населення§! та збільшує популярність домінантної фракції.\n-------------\n§!Санта-Ана, Сан-Мігель тліють. Спустивши з ланцюга шалені війська, що підтримують переворот, проти лоялістів уряду, ми можемо підпалити їх повністю!"

# [==-==| [2.3] MEXICAN DECISIONS |==-==] #

MEX_SalvadoranCoup_NoRevolutionWithoutInfighting: "Немає революції без міжусобиці"
MEX_SalvadoranCoup_NoRevolutionWithoutInfighting_desc: "§F-------------\nЩоразу, коли ухвалюється це рішення, його вартість £political_power_texticon  зростає на §Y5§!.\nВоно збільшує популярність §&кастристів§! на §Y30%§! від популярності §,іспаністів§!, якщо §WГнів цивільного населення§! становить §Y50%§! або більше, і на §Y15%§! в іншому випадку.\n-------------\n§!Не даремно ми утримуємо державний контроль над пресою. Нехай мексиканські інтелектуальні та культурні титани візьмуться за пера, щоб сальвадорці взялися за мечі."

MEX_SalvadoranCoup_SwordsIntoThorns: "Мечі на тернини"
MEX_SalvadoranCoup_SwordsIntoThorns_desc: "§F-------------\nЩоразу, коли ухвалюється це рішення, його вартість £GFX_command_power зростає на §Y5§!.\nВоно зменшує популярність §,іспаністів§! на §Y12%§!, якщо §WГнів цивільного населення§! становить §Y50%§! або більше, і на §Y6%§! в іншому випадку.\n-------------\n§!Альмасан показав нам небезпеку правих прихвоснів для Революції. Влаштований DFS "нещасний випадок" для іспаністського офіцера позбавить §&кастристів§! клопоту пізніше."

MEX_SalvadoranCoup_LessonsFromMorelos: "Уроки Морелоса"
MEX_SalvadoranCoup_LessonsFromMorelos_desc: "§F-------------\nВартість §GFX_command_power цього рішення зростає §Jпропорційно§! до §WВійськової готовності§!.\n-------------\n§!Корона дель Росаль очолює Групу Морелоса, офіцерську мережу, що таємно поширює вплив PRI в нашій армії. Подібні методи можуть поширити змову Осоріо та Росалеса через сальвадорські казарми."

MEX_SalvadoranCoup_DoorToDoorRevolutionaries: "Революціонери від дверей до дверей"
MEX_SalvadoranCoup_DoorToDoorRevolutionaries_desc: "§F-------------\nВартість £GFX_weapon_icon  цього рішення втричі перевищує різницю між §WВійськовою готовністю§! та §WГнівом цивільного населення§!.\nЧим нижча Підтримка війни §WСальвадору§!, тим більше воно збільшить §WВійськову готовність§!.\n-------------\n§!Ветерани Карибського легіону та §&кастристські§! солдати - найбільш переконливі голоси проти уряду. Наша войовничість PRI навчить їх новому виду кампанії - політичної."
MEX_SalvadoranCoup_DoorToDoorRevolutionaries_trigger_tt: "§WВійськова готовність§! повинна перевищувати §WГнів цивільного населення§!."

MEX_SalvadoranCoup_AJustCause: "Справедлива справа"
MEX_SalvadoranCoup_AJustCause_desc: "§F-------------\nЩоразу, коли ухвалюється це рішення, його вартість£GFX_green_dollar_sign зростає на §Y5M§!.\n-------------\n§!Алеман може запросити сальвадорського промисловця до Акапулько у справах. Пояснити, наскільки вигідно бути на правильному боці Революції. Вони зрозуміють натяк."
MEX_SalvadoranCoup_AJustCause_modifier_tt: "§WЗусилля уряду§! з боротьби проти §,Змо§!§&ви§! знижуватимуть §WГнів цивільного населення§! на 30% менше."

MEX_SalvadoranCoup_EmphasizeTheLegacyOfLaMantanza: "Наголосити на спадщині Ла-Матансі"
MEX_SalvadoranCoup_EmphasizeTheLegacyOfLaMantanza_desc: "§F-------------\nЦе рішення збільшує £GFX_flame_texticon "Розв'язати пролетарські повстання" до максимуму §Y5§!. Поточна сила - [?SalvadoranCoup_UnleashProletarianRevolts_Level|Y0].\n-------------\n§!Лише тридцять років тому Мартінес убив десятки тисяч, щоб захистити землю, вкрадену кавовими олігархами. Листівки, радіо застерігають сальвадорців ніколи більше не допустити цього."
MEX_SalvadoranCoup_EmphasizeTheLegacyOfLaMantanza_trigger_tt: "Народна £GFX_flame_texticon §Zлють§! ще не досягла свого апогею."
MEX_SalvadoranCoup_EmphasizeTheLegacyOfLaMantanza_tt: ""Розв'язати пролетарські повстання" стає потужнішим у створенні §WГніву цивільного населення§!."

MEX_SalvadoranCoup_UnleashProletarianRevolts: "Розв'язати пролетарські повстання"
MEX_SalvadoranCoup_UnleashProletarianRevolts_desc: "§F-------------\nСила цього рішення зростає разом з £GFX_flame_texticon, до максимуму §Y5§!. Поточна сила - [?SalvadoranCoup_UnleashProletarianRevolts_Level|Y0].\n-------------\n§!Більше жоден зневласнений сальвадорець не втече в ганьбі до Гондурасу. §&Кастристи§! закличуть маси боротися за свою батьківщину!"

