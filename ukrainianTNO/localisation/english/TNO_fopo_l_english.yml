################## WAC
  JAP_wac_desc: "Камерун — не найкращий союзник. Вони недовірливі, демонструють сумнівні ідеології, мають внутрішню нестабільність, а їхні амбіції панафриканізму є небезпечними. Проте, навіть якщо вони нас не люблять, вони ненавидять західних колонізаторів ще більше. Якщо ми хочемо позбавити ОВН сильного пішого союзника, тоді Камерун необхідно підтримати.\n\n§Y[USA.GetFlag][USA.GetAdjective]§! §nСила гарнізону§!: §Y[?USA.USA_wac_garrison_strength]%§!"

