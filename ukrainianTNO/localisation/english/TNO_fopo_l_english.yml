### Info Tooltips
   TNO_fopo_into_tab_tt: "[Get_fopo_info_tooltip]"
   USA_WAC_info_tooltip: "§FВійна в Західній Африці перетворюється на складну справу з багатьма чинниками, які впливають на нашу участь у ній. §YНезадоволення§! війною зростатиме з часом, і що вищим воно стає, то серйозніші наслідки це матиме для нашої країни.\n\n§RЕскалація§! війни відкриє більш радикальні та потужні методи ведення війни, але водночас погіршить негативні наслідки і може призвести до §eнепередбачених наслідків§!.\n\n§nСила гарнізону§! є необхідністю для підтримання ефективної оперативної спроможності в регіоні через постійну присутність партизан. Це наш найбільш вразливий фланг, оскільки він вимагає постійних витрат ресурсів і є очевидною ціллю для наших ворогів, тому ми повинні бути обережними у використанні цього ресурсу.§!"
   TNO_fopo_into_icon_tt: "§YГлобальні Конфлікти Інформпункт§!"
   TNO_fopo_into_icon_tt_delayed: "§FЕкран §YГлобальних Конфліктів§! показує поточні зовнішні конфлікти вашої нації, такі як §Vпроксі-війни§! або §Cдипломатичні кризи§!, серед інших. Кожен окремий конфлікт буде представлений як окрема §Yвкладка§!, що відображатиме унікальні рішення, зосереджені навколо цього конфлікту.\n\nУспіхи або невдачі зовнішньої політики вашої нації матимуть вплив як на саму націю, так і на світ навколо неї, що робить важливим зважування участі та курсу дій на міжнародній арені, де ваша нація часто вступатиме у змагання воль, розуму та ресурсів з іноземними силами через зіткнення протилежних інтересів.§!\n\n§RЧи хочемо ми пограти у гру?§!"

