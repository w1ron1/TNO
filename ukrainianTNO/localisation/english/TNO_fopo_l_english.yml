USA_IND_start_aid_bill: "Подати законопроєкт про допомогу"
USA_IND_start_aid_bill_desc: "Ми внесемо до Конгресу законопроєкт, який дозволить подальші поставки допомоги Індії, зокрема й більш масштабні вантажі. В іншому разі ми ризикуємо залишити їх ні з чим, якщо ситуація погіршиться."
USA_IND_aid_bill_submitted_tt: "§YЗаконопроєкт про збільшення військової допомоги Республіці Індія буде подано до Конгресу§!"
USA_IND_obq_reaction: "Реакція на операцію «Бін-Касім»"
USA_IND_obq_reaction_desc: "На заході раптово відкрився новий фронт: підтримувані Німеччиною мусульманські загони під «пакистанським» прапором рушили з афганських баз на північно-західному кордоні, вступивши в сутички з місцевою поліцією та армійським резервом. Пентагон виявив кілька критично важливих маршрутів контрабанди й складів постачання, знищення яких придушить це повстання в зародку та не дозволить Республіці опинитися в кошмарі війни на два фронти. Ударимо — і вдаримо жорстко."
USA_IND_operation_big_stick: "Операція «Великий кийок»"
USA_IND_operation_big_stick_desc: "Сили Боса проривають оборону Республіки на всіх фронтах, а японське озброєння живить їхній невпинний наступ. Деякі в Пентагоні бачать тривожні паралелі з 1940 роком — з тією різницею, що цього разу ми маємо вибір, аби зупинити потік. Хоч це й підвищить напруженість у відносинах з іншими наддержавами, ми мусимо відправити людей, щоб утримати лінію фронту."

