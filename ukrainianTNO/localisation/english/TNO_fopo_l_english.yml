### French Civil War ###

USA_ffr_reclamation_desc: "У 1776 році Франція допомогла США у боротьбі проти тиранії — тепер час віддячити. Вільні Французи досягли наступного етапу в їхній кампанії з відновлення своєї батьківщини від нацистів — і ми допоможемо їм будь-яким можливим способом.\n\nМи дісталися до цього моменту — військові перемоги Франції в Західній Африці були б неможливі без нашої допомоги — і тепер ми маємо провести їх через фінішну пряму. Французи захоплені — і це справедливо — але ми повинні переконатися, що їхні дії підтверджують їхні слова."
USA_french_civil_war_desc: "Хоча Франція не ставала на чиюсь сторону під час американської громадянської війни, ми станемо на свою сторону в їхній війні: ми відправимо людей, зброю та інші види допомоги Вільним Французам. Ми допоможемо їм повернути їхню батьківщину — і таким чином повернемося на світову арену як вірний союзник ОФН. Ми дісталися до цього моменту — військові перемоги Франції в Західній Африці були б неможливі без нашої допомоги — і тепер ми маємо провести їх через фінішну пряму. Французи захоплені — і це справедливо — але ми повинні переконатися, що їхні дії підтверджують їхні слова."
USA_FFR_Reclamation_Modifier: "Участь у §WFrench Reclamation§!"

GER_ffr_reclamation_desc: "Десятиліттями неможливість законного уряду Франції обмежити вплив Французького опору була плямою на спробах Німеччини утримати свій вплив на Західну Європу, незліченні економічні та військові поставки не дали значних результатів, тепер, що найобразливіше, вони дозволили старому привиду нашої завоювання перфідної Французької Республіки знову нас переслідувати.\n\nПоява нашого ворога на французькій землі є образою для арійської раси, отже, стара ворожнеча знову буде розгорнута."
GER_french_civil_war_desc: "Політична нестабільність французької держави призвела до повномасштабної громадянської війни. Хоча цей результат не є несподіваним з огляду на знаки останніх 10 років, така кількість хаосу так близько до Рейну — нашої природної оборонної лінії — є шкідливою для стабільності Райху.\n\nДо того ж, надійна розвідка з середземноморського узбережжя Франції повідомляє про переміщення військ з трікольором і хрестом Лотарингії, символом проклятих голлістів. Ми повинні швидко придушити їх і видалити з публічного поля зору."

IBR_ffr_reclamation_desc: "Ми обіцяли допомогу французам. Вони виконали свою частину угоди, і тепер наш час виконати свою. Від Більбао до Барселони ми готові перетнути кордон і підтримати Вільних французів. Наші війська почнуть перетікати через кордон у Францію, оскільки ми ведемо бої в континентальній Європі вперше після громадянської війни.\n\nЯкщо все піде за планом, ми матимемо стабільного союзника між нами та німецькою загрозою на сході. Така можливість стане чудовим шансом дати німцям смак їхньої ж власної медецини і залякати їх ворожою державою на їхніх кордонах на десятиліття."
IBR_french_civil_war_desc: "Будь ласка, реалізуйте oveja"

