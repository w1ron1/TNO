VEN_selected_city_desc_txt: "[get_ven_city_desc]"

VEN_selected_city_0_desc_key: "Маракайбо - одна з найбільших гордостей Венесуели, нафтове місто, що збудувало імперію сталі та диму. Озеро виблискує як вишками, так і іржею, а його береги вкриті нафтопереробними заводами. Еліти міста досі чіпляються за залишки влади, обмінюючи послуги на барелі. Хто б не тримав Маракайбо, той тримає потік палива, що підтримує життя нації."
VEN_selected_city_1_desc_key: "Ель-Віхія розташоване між горами та рівнинами - вологий перехресток дизелю та туману. Вантажівки рухаються його вулицями вдень і вночі, перевозячи вантажі через Анди. Його маленький аеродром - тиха життєва артерія, ідеальна для переміщення речей, які не мають бути помічені. Цей маленький, але ключовий торговий вузол - одна з артерій, що живлять захід."
VEN_selected_city_2_desc_key: "Веґа-де-Аса - маленьке тихе містечко, загублене в Андах, не більше ніж скупчення блокпостів і втомлених солдатів. Контрабандисти та мандрівники проходять через нього, залишаючи по собі чутки, плітки та готівку. Це місце, де всі знають, коли варто відвести погляд. Можливо, це одні з небагатьох надійних воріт західного кордону."
VEN_selected_city_3_desc_key: "Столиця Тачіри, Сан-Крістобаль розташований високо в Андах - місто торгівлі, контрабанди та неспокійних розмов. Колумбійські гроші течуть через його ринки, а його люди - через його вулиці. Холодне повітря пахне паливом і політикою; Сан-Крістобаль цілком може стати вирішальним фактором того, чи залишиться кордон відкритим."
VEN_selected_city_4_desc_key: "Гуасдуаліто розтягнулося вздовж великих венесуельських рівнин, Льяносу, слугуючи ключовим проходом між Венесуелою та Колумбією. Торговці, солдати та найманці щодня перетинають його мости. Спека ніколи не спадає, так само як і напруга. Гуасдуаліто - це шлях, через який люди та постачання можуть убезпечити східний Льянос."
VEN_selected_city_5_desc_key: "Кабударес росте поряд з агломерацією Баркісімето, його заводи гудять неспокійними робітниками. Його вулиці молоді, швидко ростуть і сповнені неспокійної молоді, яка виходить на марш, щойно поліція відвертається. У самому серці Лари - ідеальна іскра для міських заворушень, якщо країна здригнеться."
VEN_selected_city_6_desc_key: "Сан-Карлос стоїть самотньо в глибині Льяносу, тихий і незворушний під палючим сонцем, як аграрне серце та столиця Кохедесу, оточена родючими рівнинами та старими колоніальними маєтками. Тут заправляються конвої, перш ніж зникнути за горизонтом. Коли рації замовкають, це логістичне місто-привид неодмінно триматиме армію нагодованою."
VEN_selected_city_7_desc_key: "Сан-Феліпе спочиває в долині, що славиться цукровими плантаціями та тишею, її поля колишуться під втомленим сонцем. Старі землевласники, родини з колоніальних часів, досі перешіптуються в кав'ярнях, чекаючи побачити, який прапор замайорить наступним. Хто б не володів столицею Яракуй, той убезпечує шлях до столиці."
VEN_selected_city_8_desc_key: "Пуерто-Кабельйо, досі поранене Ель-Портеньясо кількома роками раніше, живе й помирає своїм портом - історичними головними воротами з Венесуели до Карибів і решти світу. Контрабандисти, іноземні агенти та лоялісти всі причалюють тут під тими самими втомленими кранами. Командувати цією гаванню означає вирішувати, що заходить, а хто виходить."
VEN_selected_city_9_desc_key: "Маракай - промисловий і військовий вузол на захід від Каракасу, оточений пишними долинами та пагорбами. Заводи працюють у змінах, що ніколи не зупиняються, випускаючи деталі для машин війни. Щоб змова вдалася, вона мусить спершу пройти через браму до Каракасу, серед офіцерів, які знають, у який бік дме вітер."
VEN_selected_city_10_desc_key: "Каракас, Місто вічної весни, здіймається, наче міраж, оточений горами - густий і гарячковий, живий щогодини. Політики ховаються у скляних вежах, що виблискують над нетрями, поки вулиці шепочуть про бунт. Влада тут змінюється щохвилини, ніколи по-справжньому не спочиваючи. Усі шляхи ведуть до Каракасу, і вони закінчуються біля воріт палацу."

