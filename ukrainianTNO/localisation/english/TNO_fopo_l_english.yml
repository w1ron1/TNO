  USA_PHI_IJN_blockade_dummy_desc: "Наша здатність надавати подальшу допомогу філіппінським повстанцям фактично нейтралізована через блокаду островів Імператорським японським флотом. Ми можемо лише забезпечити постачання для наших волонтерів і більше нічого, інакше наші кораблі можуть бути знищені."

  USA_PHI_doing_preparation_decision: "Прийнято інше рішення щодо підготовки до японського вторгнення."
