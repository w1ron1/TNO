### JAP ###
JAP_INDCW_desc: "Первісно створений індійськими вигнанцями в Сінгапурі як інструмент національного визволення, уряд Азад-Гінд представляє наші інтереси на Індійському субконтиненті. Двічі на тиждень рейси між Токіо та Калькуттою перевозили амбітних маркетологів у пошуках нових ринків, тоді як стратеги Міністерства закордонних справ зважували його потенціал як морського форпосту в майбутніх конфліктах. Проте вони не зважили на тліючі жарини, залишені по собі — полум’я, запалене японськими військовими під час війни, яке тепер починало розгоратися.\n\nЦе полум’я — незгасний іскровий вогонь вільної Індії — ніколи по-справжньому не згасало. Воно терпляче чекало, поки жарини наберуть сили. Тепер, підживлене подіями, це полум’я готове охопити весь субконтинент, якщо його не буде погашено силою.\n\nЦя боротьба за визволення може перетворити віддалений аванпост на краю Імперії на її центральну твердиню. Палке прагнення незалежної Індії раз по раз придушувалося американським і німецьким імперіалізмом, що діяли спільно. Але маючи чим горіти й здійснивши останній поштовх, це полум’я може принести визволення ще одному куточку світу з-під ярма колоніалізму та імперіалізму."

