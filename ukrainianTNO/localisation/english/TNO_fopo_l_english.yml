#Ideas
TNO_SATW_chemical_weapons: "Хімічна війна"
TNO_SATW_chemical_weapons_desc: "Колись вважана одним із найстрашніших жахів, що постали з двох Світових воєн, нині в збройних силах цієї країни сформувався похмурий новий консенсус щодо застосування хімічної зброї. Витягнута із забутих сховищ і глибин арсеналів, вона була пущена в хід, щоб сіяти хаос на напружених і відчайдушних фронтах Південно-Атлантичної війни.\n\nНаслідки такого кроку виявилися негайними та радикальними. Численні країни вже засуджують її використання як воєнний злочин. Супротивники у Південно-Атлантичній війні публічно таврують це як огидний акт, але водночас потай планують застосувати таку ж зброю для власних потреб.\n\n§eУ цій війні було досягнуто нового рівня нелюдяності моліться, аби вона не продовжила свого падіння.§!"
TNO_SATW_tatically_nuked: "Тактичний ядерний удар"
TNO_SATW_tatically_nuked_desc: "Безсвітлий спалах розквітає в цій країні невидимі вогні радіації випалюють її зсередини й ззовні, стираючи з лиця Землі численні військові бази. Подібна доля спіткала й окремі «стратегічні» цілі — визначення, що приносить мало втіхи жертвам, залишеним по собі.\n\nФізичні руйнування — не єдина ціна цього ракетного удару. Моральний дух стрімко впав — солдати говорять про товаришів, випаруваних у мить ока, про роки накопичених боєприпасів, знищених за секунди. Південно-Атлантична війна досягла нового дна, а опівніч невблаганно наближається.\n\n§eІснує надзвичайно висока ймовірність удару у відповідь — ядерного, який буде повернуто тим самим — знову і знову… доки не залишиться нічого.§!"
TNO_SATW_treaty_of_montevideo: "Монтевідеоський договір"
TNO_SATW_treaty_of_montevideo_desc: "Колись Сонце Травня сяяло над цілим континентом — простягаючи своє світло від Пунта-Аренаса до Пунта-Гальїнас — але ті дні минули. Монтевідеоський договір став черговим приниженням для цієї колишньої гегемонії, закріпивши перемогу Бразилії над Аргентиною на умовах настільки каральних, що Версаль виглядає привабливо.\n\nАргентинської армії більше не існує — невдовзі її буде демілітаризовано та замінено силами самооборони, чисельність яких не може перевищувати мізерний ліміт. Флот спочиває на дні Атлантики, повністю затоплений. Навіть дотик до кордону з військовим наміром заборонений. Доля уряду виглядає похмуро — він глибоко непопулярний через свою роль у підписанні договору.\n\nЗрештою в Аргентині з’явиться новий уряд. Він пам’ятатиме день підписання цього договору з люттю — і тоді він повернеться по кров."
TNO_SATW_treaty_of_asuncion: "Асунсьйонський договір"
TNO_SATW_treaty_of_asuncion_desc: "Там, де колись існував шанс, що порядок і поступ стануть визначальними рисами Південноамериканського континенту, нині лишилася лише гірка ностальгія за втраченими можливостями. Асунсьйонський договір поклав остаточний край усім цим надіям, забивши прагнення Бразилії до гегемонії в домовину та опустивши її на шість футів під землю.\n\nЗгідно з умовами договору, бразильська армія перетворюється на порожню оболонку, позбавлену всього, що могло б загрожувати Аргентині. Флот спіткає подібна доля — його кораблі знаходять свій водяний гріб на дні океану. Заборонена навіть можливість тримати гвинтівку поблизу кордону, тож після підписання цього договору дні бразильського уряду видаються поліченими.\n\nЗрештою з’явиться новий бразильський уряд, загартований труднощами, накладеними договором. Він готуватиметься — з люттю дивлячись через кордон — і чекатиме моменту, щоб обрушити на Аргентину всю свою ненависть."
SATW_loss_treaty_restrictions_tt: "§RНеможливо тренувати підрозділи, розформовувати їх або редагувати шаблони підрозділів.§!\n"

