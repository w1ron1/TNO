VEN_VNS_Peoples_Momentum_tt: "£txticon_left_resistance §VЛегітимність повстанців§! §Rзросте§! незначно.\n\nЗа нашими спостереженнями поточної ситуації на місцях, £GNG_product_interest_texticon §*Легітимність уряду§!, за прогнозами, наступного місяця становитиме від [?VEN.predicted_legitimacy_low|Y0] до [?VEN.predicted_legitimacy_high|Y0].\n\nОскільки важко по-справжньому оцінити рівень підтримки, яку отримують повстанці, §ваші прогнози можуть дещо відрізнятися від реальності§!."
VR_info_tt: "§R\"Якщо я піду, я прибуду; якщо я прибуду, я увійду; якщо я увійду, я переможу.\"§!\n\nЧерез аморфну природу нашого @VNS §Vкомуністичного ворога§!, напіврегулярні сили, з якими ми стикаємось уздовж імпровізованих ліній фронту, - не єдина загроза. Ми мусимо стежити за §Zпартизанськими операціями§! в нашому тилу та забезпечити, щоб @VEN §Sвенесуельський уряд§! утримував достатню народну підтримку.\n\nЧим вища §YЛегітимність§! сторони, тим більше §Gбонусів§! отримують її війська. Натомість низька §YЛегітимність§! спричинить §Rдедалі гірші штрафи§!.\n\nШтати, які контролює @VEN §SУряд§!, додають до £GNG_product_interest_texticon §*Легітимності уряду§!, а штати, які контролюють @VNS §VКомуністи§!, додають до їхньої £txticon_left_resistance §VЛегітимності§!. У міру продовження війни §VЛегітимність§! £txticon_left_resistance §VКомуністів§! §Rзростатиме швидшими темпами§!.\n\n§JПротиповстанські операції§! критично важливі для знищення §Zпартизанської активності§! на території під контролем @VEN §SУряду§!. У штатах з @VNS §Vмодифікатором ФАЛН§! відбудуться §Rвідкриті повстання§!, якщо £txticon_left_resistance §VЛегітимність комуністів§! достатньо висока. Сили @VEN §SУряду§! можуть зазнати значної §Rвтрати командування та контролю§! через повстання в тилу, тож цього результату слід §Yуникати за будь-яку ціну§!."
VR_info_tt_delayed: "§YПОРАДА:§!\n§.#1 -§! Штаб рекомендує спробувати §Lзачистити західні, андійські редути§!, перш ніж кидати всю вагу наших дивізій проти ФАЛН на сході.\n§.#2 -§! Утримання високої Легітимності уряду з §Lпріоритетом на протиповстанські операції§! запобігатиме виникненню ворожих повстань на території уряду.\n§.#3 -§! Легітимність комуністів §Lпродовжуватиме зростати§!, забезпечуючи, що затяжний конфлікт грає їм на руку."
