# Ceasefire
GER_PPI_ceasefire_ends: "§YПеремир'я закінчується...§!"
GER_PP_ceasefire_desc: "Незважаючи на наші зусилля, вторгнення в Пуерто-Плата закінчилось перемир'ям, при якому Легіон утримує території на півночі, а Трухільйо був замінений Балагером. Найбільш тривожними є чутки, що американці та Іберія можуть погодити довгострокове мирне врегулювання. Це неприпустимо.\n\nМи вже ввели кілька груп Бранденбургерів, найелітніших спецпризначенців Німеччини. Живучи як партизани в горах, вони проведуть низку саботажних та дестабілізуючих операцій для продовження боїв. І хоч нам потрібно тримати їх на постачанні, більш амбітні операції можуть супроводжуватися значними ризиками."
GER_PP_ceasefire_text: "Поточний рівень £GFX_discontent_texticon §RTension§! становить [GetPPCeasefireTension].\nНаш поточний рівень £GFX_green_mbt_texticon §nPreparation§! становить [?DOM.PPI_ceasefire_military_preparation]"

