# [==-==| [2.5] JAPAN DECISIONS |==-==] #

JAP_SalvadoranCoup_BuildNewORDEN: "Побудувати новий ORDEN"
JAP_SalvadoranCoup_BuildNewORDEN_desc: "§F-------------\nВикористання цього рішення наближає §,День§! §&Розплати§! [ELS.GetFlag] дедалі швидшими темпами.\n-------------\n§!ORDEN, воєнізований і розвідувальний апарат під керівництвом нашого лихослівного союзника, §,генерала Медрано§!, - ключовий актив для §,іспаністів§!. Навчання та зброя гарантують, що він переживе падіння §WУряду Рівери§!."

JAP_SalvadoranCoup_AlemanistaInsights: "Зібрати відомості алеманістів"
JAP_SalvadoranCoup_AlemanistaInsights_desc: "§F-------------\nСила цього рішення пропорційна Домінуванню §&кастристів§!.\n-------------\n§!Деяких видатних §Kмексиканців§! турбують єни набагато більше, ніж потенційні сальвадорські революціонери. Усе, що ми хочемо знати про §&кастристів§!, майор Онодера дізнається."

JAP_SalvadoranCoup_DirectSales: "Здійснити прямі продажі"
JAP_SalvadoranCoup_DirectSales_desc: "§F-------------\nВикористання цього рішення наближає §,День§! §&Розплати§! [ELS.GetFlag] дедалі швидшими темпами.\n-------------\n§!Кавові олігархи Сальвадору відчайдушно намагаються захиститися від мародерствуючих селян. Ми можемо підірвати їхню залежність від §WУряду Рівери§! та непогано заробити, продавши їм надлишки зброї."

JAP_SalvadoranCoup_RootCoffeeAgency: "Вкорінити кавове агентство"
JAP_SalvadoranCoup_RootCoffeeAgency_desc: "§F-------------\nВикористання цього рішення зменшує вплив наших дій на §,День§! §&Розплати§! [ELS.GetFlag].\n-------------\n§!Кавове агентство, наша латиноамериканська розвідка, має налагодити сальвадорські зв'язки. Ці місцеві посередники підвищать нашу ефективність... і приховають нашу присутність."

JAP_SalvadoranCoup_AgainstWashingtonStooge: "Проти маріонетки Вашингтона"
JAP_SalvadoranCoup_AgainstWashingtonStooge_desc: "§F-------------\nЦе рішення націлене на менше з §WГніву цивільного населення§! та §WВійськової готовності§!, стаючи потужнішим із залученням ФБР у Сальвадорі.\nВикористання цього рішення наближає §,День§! §&Розплати§! [ELS.GetFlag] дедалі швидшими темпами.\n-------------\n§!Сальвадорці - гордий народ, і не стерплять американську маріонетку як свого президента. Тож ми фінансуємо стоси пропаганди для казарм чи вулиць, що зображує Ріверу саме такою."

JAP_SalvadoranCoup_SkilledHawk: "Стати вправним яструбом"
JAP_SalvadoranCoup_SkilledHawk_desc: "§F-------------\nЦе рішення скидає вплив наших дій на §,День§! §&Розплати§! [ELS.GetFlag] до нуля.\n-------------\n§!§mВашингтон§! надчутливий до нашої діяльності в Центральній Америці, а культурна спорідненість дозволяє §KМексиці§! та §OІбе§!§nрії§! діяти вільніше в Сальвадорі. Сховаймо наші кігті... на певний час."

