JAP_AZH_start_blockade_desc: "Американці постачають зброю, підтримуючи свій неоколоніальний режим в Індії; ми можемо запровадити блокаду, щоб зірвати їхні імперські задуми. Ефективність цієї блокади, однак, залежатиме від наших попередніх успіхів у §YМалаї та на Мадагаскарі§!."
