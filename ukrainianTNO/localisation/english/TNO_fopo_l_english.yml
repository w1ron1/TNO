VEN_district_1_txt: "Лібертадор"
VEN_district_2_txt: "Сукре"
VEN_district_3_txt: "Ель-Атільйо"
VEN_district_4_txt: "Чакао"
VEN_district_5_txt: "Барута"

IBR_CN_desc_1: "Від висот Ель-Атільйо до берегів Гуайре говорять про старих ворогів Вільяльби, послідовників колишнього диктатора Переса Хіменеса, що крадуться провулками. Про офіцерів, розчарованих згасаючим впливом армії. Про можливість здобути плацдарм у Карибському басейні.\n\nЦі шепоти ще не крики гніву біля стін Мірафлорес. Контрреволюційні сили досі розрізнені й слабкі. Але ми мусимо скористатися цим швидкоплинним моментом, щоб побудувати наші зв'язки - з дисидентами, контрабандистами та вигнанцями. Щоб коли Вільяльба виявить слабкість, а це неминуче станеться, вони відправили його приєднатися до старого друга Ромуло Бетанкура в пеклі."
IBR_CN_desc_2: "Від висот Ель-Атільйо до берегів Гуайре говорять про болівaріаністських бандитів, що крадуться в ледь стримуваній люті. Про офіцерів, розчарованих згасаючим впливом армії. Про можливість здобути плацдарм у Карибському басейні.\n\nЦі шепоти ще не крики гніву біля стін Мірафлорес. Контрреволюційні сили досі розрізнені й слабкі. Але ми мусимо скористатися цим швидкоплинним моментом, щоб побудувати наші зв'язки - з дисидентами, контрабандистами та вигнанцями. Щоб коли Кальдера зрадить свою країну, а це неминуче станеться, вони були готові встромити кинджал йому в спину."
MEX_VC_desc_1: "Від висот Ель-Атільйо до берегів Гуайре говорять про старих ворогів Вільяльби, послідовників колишнього диктатора Переса Хіменеса, що крадуться провулками. Про офіцерів, розчарованих згасаючим впливом армії. Про загрозу венесуельській революції та Веракруському пакту.\n\nЦі шепоти ще не крики гніву біля стін Мірафлорес. Контрреволюційні сили досі розрізнені й слабкі. Але змови іноземних стерв'ятників та реформістська програма Вільяльби дадуть їм чимало можливостей поширитися в наступні роки. Ми мусимо скористатися важкими уроками, яких навчив нас Уерта, щоб очистити вулиці нашого союзника від інфільтрантів, реакціонерів і зрадників."
MEX_VC_desc_2: "Від висот Ель-Атільйо до берегів Гуайре говорять про болівaріаністських бандитів, що крадуться в ледь стримуваній люті. Про офіцерів, розчарованих згасаючим впливом армії. Про загрозу венесуельській революції та Веракруському пакту.\n\nЦі шепоти ще не крики гніву біля стін Мірафлорес. Контрреволюційні сили досі розрізнені й слабкі. Але змови іноземних стерв'ятників та амбіції Кальдери як миротворця будуть роздратовувати войовників у наступні роки. Ми мусимо скористатися важкими уроками, яких навчив нас Уерта, щоб очистити вулиці нашого союзника від інфільтрантів, реакціонерів і зрадників. Інакше щури прогризуть собі шлях у фундамент Венесуели."
caracas_coup_info_tt: "§!Поки @IBR §OІбе§!§nрія§! прагне закріпити свою §Gмережу§! у §Yп'яти муніципалітетах§! Каракасу, серці @VEN §SВенесуели§!, @MEX §KМексика§! прагне допомогти своєму @VEN §Sвенесуельському§! союзнику викорінити її.\n\nЩоб досягти успіху у своїх амбіціях, @IBR §OІбе§!§nрії§! потрібно забезпечити §KВійськову інфільтрацію§! на рівні §Y70.00%§! або більше, і або:\n§s-§! §Y25.00%§! §GСили мережі§! у всіх §Yмуніципалітетах§!\n§s-§! §Y50.00%§! §GСили мережі§! у ключовому §YМуніципалітеті Лібертадор§! та §Y10.00%§! у всіх інших §Yмуніципалітетах§!.\n\n§KВійськова інфільтрація§! та §OПолітичний вплив§! пасивно збільшують §GСилу мережі§! у випадковому §Yмуніципалітеті§!, коли завершується місія "Час спливає..."."

caracas_coup_info_tt_delayed: "§LХто б не вийшов переможцем у таємній боротьбі за владу в столиці нації, це забезпечить §Gповний успіх§! або §Rцілковиту поразку§! перевороту в §Yдалекому майбутньому§!.§!"

