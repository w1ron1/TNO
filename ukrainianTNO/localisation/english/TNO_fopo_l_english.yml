 ################ MALAYAN RECONSTRUCTION / South Seas Reconstruction Strategic Initiative
 TNO_malaya_reconstruction_category_desc_usa: "Рим не був побудований за один день, і Малая точно не буде відновлена за годину. Хоча країна позбулася пут Японської Сфери, правда в тому, що вона стоїть одна, оточена агресивними країнами, які вважають її зрадниками, і єдині союзники — це Індія та Австралія, а що чекає їх у майбутньому — невідомо. Війна закінчена, але справжня битва за відновлення країни після років війни тільки починається; одна битва, яка, на щастя, набагато легша для наших зусиль. Інвестори та гроші значно легші для переміщення, ніж гармати та танки."

 TNO_malaya_reconstruction_category_desc_jap: "Наші протекторати та мережа союзників у Південно-Східній Азії перебувають під різними ступенями контролю, схильні до інфільтрації опірними групами та західними посіпаками. З цією метою Міністерство Великої Східноазіатської сфери та Міністерство закордонних справ запропонували Ініціативу Реконструкції та Стабілізації Південного Сфери — план для прискорення економічного потенціалу регіону. Від олов'яних копалень Малайї до гумових плантацій Північного Борнео, наш контроль над Сферою буде відновлено, а наша політична гегемонія в регіоні буде забезпечена."

 TNO_SEA_Status_Yellow: "Наш контроль над Південними морями: §CНедостатній§!"

