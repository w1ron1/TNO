 JAP_angola_civil_war_desc: "Ангола поринула в громадянську війну, і ОФН вже втрутився. Якщо їх не зупинити, вони асимілюють ще одну націю в свою імперську структуру. Ми не повинні цього допустити. Якщо PLUAA досягне успіху, ми не тільки переможемо американський імперіалізм, але й здобудемо цінного союзника - і вхідні ворота на континент."

