########################## IBW

USA_IBW_PW_desc: "Іберія впала у громадянську війну вдруге за кілька десятиліть, і знову виникла Іспанська Республіка. Франко довів себе як тирана - тому ми підтримуємо Республіку і ставимо історію на правильний шлях. Можливо, друга спроба буде успішною."
JAP_IBW_PW_desc: "Іберія значною мірою була нам байдужа, але в марокканській території виникла нова держава - Республіка Ріф, яка попросила нашої допомоги. Це шанс отримати доступ до Атлантики та Африки й допомогти їм у боротьбі."
GER_IBW_PW_desc: "Наш контроль над Східною Європою безперечний, хоча на заході він нестабільний. Іберія знову впала, і Фалангісти повернулися. Якщо вони переможуть, ми отримаємо доступ до Атлантики і підтвердимо себе як беззаперечних Господарів Європи."

