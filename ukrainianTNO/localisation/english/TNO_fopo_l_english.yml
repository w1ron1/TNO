USA_IND_humanitarian_aid: "Розгорнути гуманітарну допомогу США"
USA_IND_humanitarian_aid_desc: "Індійська громадянська війна перетворилася на найбільшу гуманітарну кризу в Азії, а масові голоди, які вона спричинила, шокували світ. На тлі зростання міжнародних закликів до дій Сполучені Штати та ОФН повинні зробити крок уперед і допомогти нагодувати Республіку Індія в годину найбільшої потреби."
USA_IND_start_blockade: "Запровадити блокаду Азад Хінду"
USA_IND_start_blockade_desc: "Перекривши морську торгівлю Азад Хінду, ми зможемо виснажити їхні матеріальні поставки й тим самим швидше завершити війну. Однак ефективність блокади залежатиме від наших попередніх результатів у §YМалаї та на Мадагаскарі§!."
