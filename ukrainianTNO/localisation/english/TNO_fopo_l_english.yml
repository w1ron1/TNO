## USA ##
USA_PP_invasion_desc: "Домініканська Республіка стала найбільшим болем для нас у Латинській Америці загалом. Режим знайшов нішу у експорті своєї хвороби, встановлюючи тісні зв'язки з іншими фашистськими режимами. Дії Трухільйо загрожують перетворитися на часову бомбу, і в майбутньому можуть зашкодити нашій позиції в регіоні.\n\nЗ'явилася можливість скинути диктатора після краху Тріумвірату. Наші кубинські союзники тренували організацію, відому як "Друга Карибська Легіон", невелика антифашистська армія з добровольців з усіх куточків Карибського басейну, і ми направимо їх проти Трухільйо."
USA_PP_invasion_text: "Поточний £GFX_PHI_supply_texticon §LSupply§! становить §L[?USA.US_PP_supply]/100§!\nМінімальний рівень постачання для вторгнення £GFX_PHI_supply_floor_texticon §SMinimum Supply§! становить §S[?USA.US_PP_supply_perc]§!"

USA_PP_ceasefire_desc: "Домініканська Республіка стала найбільшим болем для нас у Латинській Америці загалом. Режим знайшов нішу у експорті своєї хвороби, встановлюючи тісні зв'язки з іншими фашистськими режимами. Дії Трухільйо загрожують перетворитися на часову бомбу, і в майбутньому можуть зашкодити нашій позиції в регіоні.\n\nЗ'явилася можливість скинути диктатора після краху Тріумвірату. Наші кубинські союзники тренували організацію, відому як "Друга Карибська Легіон", невелика антифашистська армія з добровольців з усіх куточків Карибського басейну, і ми направимо їх проти Трухільйо."
USA_PP_ceasefire_text: "Поточний рівень £GFX_discontent_texticon §RTension§! становить [GetPPCeasefireTension].\nПоточний рівень £GFX_green_mbt_texticon §nPreparation§! становить [?CAL.PPI_ceasefire_military_preparation]"

