# SAW withdrawal

GER_saf_withdrawal_desc: "Те, що було спробою тріумфу §Rрозбещених райхскомісаріатів§!, справило великий вплив на Райх, що тільки відновлюється від жахів §RBürgerkrieg§! і потрапляє в §Yбезглуздий конфлікт§!. З нашим майже повним контролем над німецьким суспільством втрачено, тиск з боку елементів всередині уряду та §mcivilians§! змусив нас провести §Rвідступ§! з війни.\n\nМи маємо рівно §Y1 рік§! для правильного виконання §Gвідступу§! наших військових сил з Африки, поки матеріальна перевага §BSouth Africa§! і §BOFN§! не змінить хід війни проти райхскомісаріатів і серйозно §Rпорушить§! наші майбутні плани для Африки.\n\nОднак, якщо ми §Rперевищимо§! термін або якщо війна закінчиться на користь §BOFN§! до того, як наш відступ буде §Gзавершений§!, нам доведеться §Rпоспішати§! наш відступ, що призведе до §Rкраху§! наших планів. Нам слід діяти швидко."
GER_withdrawal_text: "§YПрогрес відступу§! становить [GetGERWithdrawalColor][?GER_withdrawal_var]%§! до завершення."
GER_withdrawal_complete_button_tt: "§YЗавершити відступ§!."

GER_withdrawal_deadline: "§RПриближається кінцевий термін...§!"
GER_promote_kai_uwe_von_hassel: "'Просування' Кая-Уве фон Гасселя"
