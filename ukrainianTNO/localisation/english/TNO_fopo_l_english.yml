# Mexico Decisions
MEX_EC_coordinate_with_digepol: "Координувати з DIGEPOL"
MEX_EC_coordinate_with_digepol_desc: "Венесуельська розвідувальна служба, DIGEPOL, гуде від діяльності. Хоча це виведе нас обох з поля, особиста зустріч у Маракайбо допоможе зв'язати нитки змови воєдино."
MEX_EC_disrupt_compromised_communications: "Порушити скомпрометовані комунікації"
MEX_EC_disrupt_compromised_communications_desc: "Змовницькі осередки пов'язані телефоном і рацією - втручаючись, ми втратимо цінні дані, але віддалені осередки діятимуть без наказів."
MEX_EC_root_out_spies: "Викорінити шпигунів"
MEX_EC_root_out_spies_desc: "Кроти в DIGEPOL, іберійці у Валенсії - усіх треба заарештувати й допитати, якщо Венесуела має бути в безпеці."
MEX_EC_harness_fidels_reach: "Використати вплив Фіделя"
MEX_EC_harness_fidels_reach_desc: "Команданте закличе венесуельських селян, робітників і солдатів захищати свою революцію з тією ж енергією та пильністю, які він прищепив у Гавані. Відповідь буде ентузіастичною, хоч і без чіткої мети."
MEX_EC_blackmail_potential_dissidents: "Шантажувати потенційних дисидентів"
MEX_EC_blackmail_potential_dissidents_desc: "Тиск на звичних перес-хіменістів, навіть якщо вони не очолюють цю змову, покаже, що їм про неї відомо."
MEX_EC_bribe_venezuelan_officials: "Підкупити венесуельських чиновників"
MEX_EC_bribe_venezuelan_officials_desc: "Вірність і патріотизм - рідкісні чесноти. А жадібність - поширена вада."
MEX_EC_conduct_naval_intelligence_operations: "Провести операції морської розвідки"
MEX_EC_conduct_naval_intelligence_operations_desc: "Спокійні карибські води приховують темні течії. Ми розпочнемо операцію SEMAR для пошуку іноземного втручання біля берегів Венесуели."
MEX_EC_trace_caribbean_shipments: "Відстежити карибські поставки"
MEX_EC_trace_caribbean_shipments_desc: "Іберійські кораблі пливуть біля венесуельських вод - простежмо за ними до порту призначення і проведемо розслідування."
MEX_EC_penetrate_colombian_arms_market: "Проникнути на колумбійський ринок зброї"
MEX_EC_penetrate_colombian_arms_market_desc: "Якщо ми з'ясуємо, хто купує зброю в колумбійців за іберійські песети, ця змова розкриється повністю."
MEX_EC_infiltrate_border_villages: "Інфільтрувати прикордонні села"
MEX_EC_infiltrate_border_villages_desc: "Зрадницька армія збирається на колумбійському кордоні поблизу Кукути, нам потрібно дізнатися про неї все. Найголовніше - як її зупинити."
MEX_EC_cooperate_with_the_cru: "Співпрацювати з CRU"
MEX_EC_cooperate_with_the_cru_desc: "Колумбійський революційний союз - не наш перший вибір партнера, але вони чимало завдячують венесуельському уряду. Ми попрацюємо з ними, щоб з'ясувати природу цієї загрози."
MEX_EC_trace_border_activity: "Відстежити активність на кордоні"
MEX_EC_trace_border_activity_desc: "Західний кордон Венесуели було важко охороняти ще до Ла Віоленсії, тепер це справжній хаос. Дослідімо деякі з найважливіших пунктів перетину."
MEX_EC_support_pinilla_spies: "Підтримати шпигунів Пінільї"
MEX_EC_support_pinilla_spies_desc: "Генерал Пінілья - надійний союзник Мексики... але його вплив у східній Колумбії, де нам потрібна допомога, обмежений революціонерами. Допоможімо його шпигунам проникнути туди."
MEX_EC_intercept_arms_and_supplies: "Перехопити зброю та постачання"
MEX_EC_intercept_arms_and_supplies_desc: "Наші джерела мають новини про поставку зброї, що прямує з Боготи. Ми налетимо, щоб схопити постачання та змовників, які на нього чекають."
MEX_EC_plot_arrests_with_ocae: "Спланувати арешти з OCAE"
MEX_EC_plot_arrests_with_ocae_desc: "Ми це зробили. Тепер спіймаймо кількох венесуельських зрадників та іберійський покидьків."


