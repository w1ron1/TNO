  JAP_PHI_you_fucked_up_tt: "З таким темпом ми будемо §Rзмушені повністю відкликати§! наші сили з островів. Ми повинні захопити §MMaynila§!, щоб покращити результат кампанії.\n\n"
  JAP_PHI_small_victory_tt: "З таким темпом ми зможемо забезпечити §Mбільшу частину Лусона§!, але нічого більше. Щоб покращити результат кампанії, нам необхідно захопити регіон §lСиланганг Бісайас.§!\n"
  JAP_PHI_half_victory_tt: "З таким темпом ми зможемо захопити §lбільшу частину Філіппін.§! Щоб §Gдійсно досягти перемоги§! в цій війні, ми повинні захопити §GОстрів Мінданао.§!\n\n"
  JAP_PHI_full_victory_tt: "§GМи здобули перемогу! Тепер ми повинні втримати позиції та виснажити залишкові ворожі сили до кінця кампанії для завершення нашої перемоги.§!\n\n"

  ###PHILIPPINES RECONSTRUCTION
  PHI_reconstruction_complete_button_tt: "§YОголосити завершення реконструкції§!"
  PHI_reconstruction_all_decisions_complete_tt: "§WУсі рішення мають бути прийняті перед тим, як реконструкція буде оголошена завершеною.§!"

  reconstruction_desc_text: "[GetPHIreconstructionDesc]"
  reconstruction_desc_text_USA: "[GetPHIreconstructionUSADesc]"

  JAP_PHI_reconstruction_desc: "Невдача Балінтавацького Бліцу сприяла закріпленню нашої позиції як єдиного господаря всієї Азії. Хоча їхні повстання були придушені, завдані ними збитки залишаться, і це коштує уряду Філіппін величезні кошти на відновлення, що, якщо вони не будуть обережними, може призвести до економічної та соціальної катастрофи в країні.\n\nТому ми вирішили надавати допомогу нашим філіппінським братам у різних формах: гроші, медичне обладнання, будівництво чи навіть зброя для ліквідації залишкових повстанців.\n\nОднак нам повідомили, що напруга на островах дуже відчутна, і що невдала кампанія реконструкції може призвести до §Rнепередбачених наслідків§!. Ми повинні бути обережними."

  USA_UPH_reconstruction_desc: "Хоча конфлікти вщухли, а бочки з пивом майже порожні, філіппінський народ все ще стикається з труднощами від нації, виснаженої як землею, так і духом. Американська допомога в полегшенні цього процесу очевидна.\n\nНаші аналітики оцінюють, що ми маємо не більше ніж шість місяців на відновлення найгірших руйнувань війни, поки громадська думка не змусить нас відступити. До того часу повинна бути відновлена цивільна влада через вибори, чи то за підтримки партії Діосдадо Пангана Макапагала СР, чи партії Карлоса Гарсії 'нових Філіппін'.\n\nЗазначимо, що пан Діосдадо зробив ставку на свою легітимність, засновану на тому, щоб ми не тільки відновили країну, але й зробили це вчасно та ефективно. Якщо ми перевищимо шість місяців, пан Гарсія, ймовірно, замінить пізнішого Серджіо Осмену, старшого, як Президент, і встановить уряд, менш схильний до наших порад."
  #USA_UPH_OFN_Mandate_reconstruction_desc: "With the general breakdown of civilian government in the Philippine Islands, Congress has authorized the Philippine Department to enforce martial law within the former Commonwealth's jurisdiction until order is fully restored and the bare minimum of economic activities may resume. General Beach pledged that martial law will last for no more than six months, after which the Mandate authorities will assume all government functions.\n\nFor the country today, insofar as it may still be one, is a hollow shell of what it was before the Blitz. Villages lay empty, the hollow wrecks of cities wail, and what few parcels of farmland that haven't been bombed, burned, or defoiled have been plucked of all they're worth by the bandits that rule the interior. Hope has fled for fairer climes; much as it pains us to say, the Filipino people will have to do without it for quite some time."
  USA_SPH_Coalition_reconstruction_desc: "У відповідь на вторгнення 14-ї армії, USFIP і комуністичний рух уклали угоду, яка перетворила їхній пакт ненападу під час Бліцу в повноцінний альянс. Одним із його пунктів було обов'язкове формування уряду після війни, складеного з представників Комуністичної партії Філіппін, військових і цивільних частин USFIP та різних груп, що виступають проти колишнього КАЛІБАПІ. Таким чином, так званий Об'єднаний Філіппінський Фронт перетворився на Коаліційний уряд після евакуації.\n\nПопулярність виконуючого обов'язки президента Лоренцо Таняди серед лівих сил та популярність Рамона Магсайсаї серед Націоналістів становлять пряму загрозу нашому кандидату, Діосдадо Пангану Макапагалу СР, з партії Ліберальних. Що буде в будь-якому випадку — невідомо, але це точно не буде добре для країни — або для нас, після всього, що ми вклали в цю справу."
  PHI_Reconstruction_text: "§YПрогрес реконструкції§! становить [GetPHIReconstructionColor][?PHI_reconstruction_var]%§! до завершення."
