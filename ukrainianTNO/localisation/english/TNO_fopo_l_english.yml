COL_Roads_with_Traps: "Заміновані дороги"
COL_Roads_with_Traps_desc: "Завдяки новому допоміжному спорядженню, що надходить з Іберії, ми встановимо пастки на дорогах, аби сповільнити пересування ворога."
COL_Iberian_Industrial_Equipment: "Іберійське промислове обладнання"
COL_Barranquilla_Concession: "Барранкільська концесія"
COL_Iberian_Military_Advisors: "Іберійські військові радники"
COL_Iberian_Military_Advisors_desc: "Наші друзі з Іберійського Союзу визнали за доцільне направити військових радників для допомоги нашим збройним силам. За їхньої підтримки ми побачимо суттєве покращення загальної боєздатності наших солдатів, а також опанування найновіших тактик сучасної війни як рядовим складом, так і офіцерами."
COL_Iberian_Bombing_Campaign: "Іберійська бомбардувальна кампанія"
COL_Iberian_Bombing_Campaign_desc: "Повернення насильства до Колумбії принесло із собою й гнів Іберійських повітряних сил. Бомби сиплються на критично важливу інфраструктуру та військові об’єкти, а наші можливості чинити опір у повітрі є мінімальними.\n\nЦе порушить організацію наших сил і завдасть шкоди внутрішній підтримці воєнних зусиль, але в нас майже немає вибору — залишається рухатися вперед і сподіватися, що це бомбардування не переросте у ще масштабнішу ескалацію."

## BRA ##
BRA_CCW_desc: "Насильство. Це найкраще слово для опису ситуації в Колумбії. Не має значення, скільки інших припинень вогню, крім того, що відбулося в 1956 році, буде поставлено; мир ніколи не був варіантом для колумбійців.\n\nТим не менш, ця майбутня війна також є можливістю забезпечити собі нового союзника в північних Андах, і якщо ми не допоможемо якнайшвидше закінчити цю війну, ми будемо страждати від її побічних ефектів. Час для змії випити кави в Колумбії."

BRA_CCW_support_URC_tt: "Ми підтримуватимемо §VКолумбійський Революційний Союз§! у §RКолумбійській громадянській війні§!."
BRA_CCW_support_URC_tt_change: "§FУ зв’язку з обранням §QКарлуса Ласерди§!, наші пріоритети в Колумбії змінилися. Відтепер ми підтримуватимемо §VКарибський революційний союз§! у §RГромадянській війні в Колумбії§!.§!"
BRA_CCW_support_NF_tt: "Ми підтримуватимемо §BНаціональний фронт§! у §RКолумбійській громадянській війні§!."
BRA_CCW_support_NF_tt_change: "§FУ зв’язку з обранням §hАдемара де Барроса§!, наші пріоритети в Колумбії змінилися. Відтепер ми підтримуватимемо §BНаціональний фронт§! у §RГромадянській війні в Колумбії§!.§!"
BRA_CCW_support_Pinilla_tt: "Ми підтримуватимемо §OРежим Пінільї§! у §RКолумбійській громадянській війні§!."
BRA_CCW_negotiations_tt: "Ми спробуємо домовитися про розрядку між §fКолумбією§! та §mСполученими Штатами§!.\nУ разі успіху ми та янкі допоможемо їм у §RЛа Віоленсії§!."
BRA_CCW_support_none_tt: "Ми не будемо втручатися в §RКолумбійську громадянську війну§!."
BRA_CCW_think_about_it_tt: "Хто гідний моєї підтримки?"

