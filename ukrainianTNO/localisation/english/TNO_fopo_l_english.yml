### Iranian Civil War

JAP_ircw_category_desc: "Колись однин з небагатьох союзників Німеччини на Близькому Сході, Іран нещодавно пережив крах та занурився у громадянську війну після смерті свого шаха, Мохаммада Рези Пехлаві, людини, що була широко непопулярною після його повалення прем'єр-міністра Мохаммада Мосаддика та встановлення про-німецького режиму. Оскільки нестабільність у регіоні загрожувала вийти з-під контролю з початку нафтової кризи, здається природним, що після його смерті іранські партизани зробили свій хід до влади.\n\nСеред цих повстанців, що виступають проти уряду Ірану, є Демократична Республіка Іран, очолювана Карімом Санжабі, Соціялістична Федерація Ірану під керівництвом Іраджа Ескандері, а також Балуджистський фронт визволення, рух за незалежність на південь від країни під проводом Шера Мухаммеда Маррі, серед інших. Звісно, є також рештки про-німецького уряду, що тримаються на півночі країни.\n\nЗ новими постачаннями зброї в регіон, і коли анті-німецький альянс вже має тріщини, здається, що це на користь світовим державам надіслати допомогу своїм обранцям."

### SAF War - Aftermath

TNO_SAF_Aftermath_desc_USA: "Ми здобули велику перемогу для демократії в Південній Африці, але наша робота ще далека від завершення. Хоча німецька армія розгромлена, залишки їхніх сил продовжують боротьбу. Крім того, багато місцевих ватажків створили свої власні сили і були б раді вигнати нас зі своїх земель. Перемога в Африці нічого не варта, якщо ми не зможемо стабілізувати континент.\n\nДеякі наші офіцери запропонували продовжити стратегію виснаження, використовуючи переважну вогневу міць та передові тактики для знищення якомога більше повстанців, мінімізуючи при цьому наші власні втрати. Проте дипломатичні чиновники запропонували використати м'якіший підхід, щоб виграти симпатії місцевих, що, на їхню думку, стабілізує континент у довгостроковій перспективі. Яким би не був наш підхід, громадськість вимагає, щоб наші молоді люди повернулися додому якомога швидше і залишили після себе стабільний континент. Якщо ми не зможемо задовольнити громадські вимоги, ми, ймовірно, постраждаємо на виборах."
