 paternalism_antarctic_administration_subtype:0 "Антарктична Адміністрація"
 paternalism_antarctic_administration_subtype_desc:0 "Відтоді як у 1950-х роках почалася боротьба за Антарктику, континент був поділений між кількома конкуруючими територіальними адміністраціями. Те, що почалося як прикордонна суперечка між режимами Чилі та Аргентини, переросло в міжнародний інцидент, що вимагав втручання Організації Вільних Націй. Не бажаючи відставати від сил свободи, націонал-соціалізм підняв голову у вигляді контрольованого нацистами Нойшвабенланду, намагаючись впровадити політику колонізації чистої, полярної арійської раси. Зрештою, японці теж прибули, ігноруючи будь-які претензії на законність, і захопили свою частину Антарктики силою зброї.\nПопри те, що кожна адміністрація дотримується своїх ідеологічних переконань, суворі реалії життя в \"Великому Білому Ніщо\" та відсутність значного цивільного населення спричинили певну уніфікацію режимів. Усі вони функціонують під військовим управлінням: у випадку Японії — у прямому контролі, а у випадку ОАН — у співпраці з цивільними партнерами.\nУ межах цих ієрархій тисячі людей працюють у лютий холод і сильні вітри, намагаючись виправдати свою присутність на \"вигнаному континенті\". Кожна держава намагається отримати хоча б якусь користь зі свого шматка льоду, хоча багато спостерігачів називають цю боротьбу вершиною \"помилки потоплених витрат\". Жодна держава не може відступити, поки залишаються інші, незважаючи на втрати грошей, матеріалів або людей. Потрібна була б колосальна зміна обставин, щоб зробити антарктичні проєкти прибутковими..."

 despotism_antarctic_administration_subtype:0 "Антарктична Адміністрація"
 despotism_antarctic_administration_subtype_desc:0 "Відтоді як у 1950-х роках почалася боротьба за Антарктику, континент був поділений між кількома конкуруючими територіальними адміністраціями. Те, що почалося як прикордонна суперечка між режимами Чилі та Аргентини, переросло в міжнародний інцидент, що вимагав втручання Організації Вільних Націй. Не бажаючи відставати від сил свободи, націонал-соціалізм підняв голову у вигляді контрольованого нацистами Нойшвабенланду, намагаючись впровадити політику колонізації чистої, полярної арійської раси. Зрештою, японці теж прибули, ігноруючи будь-які претензії на законність, і захопили свою частину Антарктики силою зброї.\nПопри те, що кожна адміністрація дотримується своїх ідеологічних переконань, суворі реалії життя в \"Великому Білому Ніщо\" та відсутність значного цивільного населення спричинили певну уніфікацію режимів. Усі вони функціонують під військовим управлінням: у випадку Японії — у прямому контролі, а у випадку ОАН — у співпраці з цивільними партнерами.\nУ межах цих ієрархій тисячі людей працюють у лютий холод і сильні вітри, намагаючись виправдати свою присутність на \"вигнаному континенті\". Кожна держава намагається отримати хоча б якусь користь зі свого шматка льоду, хоча багато спостерігачів називають цю боротьбу вершиною \"помилки потоплених витрат\". Жодна держава не може відступити, поки залишаються інші, незважаючи на втрати грошей, матеріалів або людей. Потрібна була б колосальна зміна обставин, щоб зробити антарктичні проєкти прибутковими..."

 fascism_antarctic_administration_subtype:0 "Антарктична Адміністрація"
 fascism_antarctic_administration_subtype_desc:0 "Відтоді, як у 1950-х роках почалася боротьба за Антарктику, континент було розділено між кількома конкуруючими територіальними адміністраціями. Те, що почалося як прикордонний конфлікт між чилійським і аргентинським режимами, переросло в міжнародний інцидент, який вимагав посередництва Організації Вільних Націй. Не бажаючи відставати від сил свободи, Націонал-соціалізм підняв голову у формі контрольованої нацистами Нойшвабії, намагаючись запровадити політику колонізації «чистою, полярною, арійською расою». Нарешті, японці прибули, ігноруючи будь-які претензії на легітимність, захопивши свою частку Антарктики силою зброї.\n\nПопри те, що кожна адміністрація дотримується своїх ідеологічних переконань, сувора реальність життя на Великій Білій Пустці та відсутність значного цивільного населення змусили режими до певної уніфікації. Усі діють під якоюсь формою військового управління — чи то під прямим контролем, як у випадку Японії, чи співпрацюючи з цивільними партнерами, як в ОАА.\n\nПід цими ієрархіями тисячі людей працюють у лютому холоді та пронизливих вітрах, намагаючись виправдати свою присутність на «вигнаному континенті». Кожна з держав намагається здобути хоч якусь користь зі своєї частки льоду, однак багато спостерігачів називають цю боротьбу ідеальним прикладом помилкової ідеї «втоплених витрат». Жодна з держав не може відступити, поки інші залишаються, незалежно від їхніх втрат у грошах, матеріалах чи людях. Знадобиться колосальний зсув у обставинах, щоб зробити антарктичні підприємства прибутковими..."
 
 national_socialism_antarctic_administration_subtype:0 "Антарктична Адміністрація"
 national_socialism_antarctic_administration_subtype_desc:0 "Відтоді, як у 1950-х роках почалася боротьба за Антарктику, континент було розділено між кількома конкуруючими територіальними адміністраціями. Те, що почалося як прикордонний конфлікт між чилійським і аргентинським режимами, переросло в міжнародний інцидент, який вимагав посередництва Організації Вільних Націй. Не бажаючи відставати від сил свободи, Націонал-соціалізм підняв голову у формі контрольованої нацистами Нойшвабії, намагаючись запровадити політику колонізації «чистою, полярною, арійською расою». Нарешті, японці прибули, ігноруючи будь-які претензії на легітимність, захопивши свою частку Антарктики силою зброї.\n\nПопри те, що кожна адміністрація дотримується своїх ідеологічних переконань, сувора реальність життя на Великій Білій Пустці та відсутність значного цивільного населення змусили режими до певної уніфікації. Усі діють під якоюсь формою військового управління — чи то під прямим контролем, як у випадку Японії, чи співпрацюючи з цивільними партнерами, як в ОАА.\n\nПід цими ієрархіями тисячі людей працюють у лютому холоді та пронизливих вітрах, намагаючись виправдати свою присутність на «вигнаному континенті». Кожна з держав намагається здобути хоч якусь користь зі своєї частки льоду, однак багато спостерігачів називають цю боротьбу ідеальним прикладом помилкової ідеї «втоплених витрат». Жодна з держав не може відступити, поки інші залишаються, незалежно від їхніх втрат у грошах, матеріалах чи людях. Знадобиться колосальний зсув у обставинах, щоб зробити антарктичні підприємства прибутковими..."
 
