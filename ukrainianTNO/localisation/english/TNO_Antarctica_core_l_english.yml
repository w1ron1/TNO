 ODF_WIP_Country_tt:0 "§FГраючий контент для цієї території буде додано в майбутньому §DОперація Глибокий Мороз§! §Fоновному оновленні! Ось анонс того, що нас чекає:§!"
 ODF_WIP_Country_tt_AAA:0 "§FГраючий контент для цієї території буде додано в майбутньому §DОперація Глибокий Мороз§! §Fоновному оновленні! Ось анонс того, що нас чекає:§!\n\n§WАктивність Аргентини в Антарктиці почалася на початку 1900-х років, з Героїчного віку антарктичних експедицій, та кількох маленьких хаток на віддалених островах. Після поразки союзників у Другій світовій війні, британський претензійний статус на Антарктику став доступним, і кілька років по тому Аргентина спробувала реалізувати це. Вони також намагались оголосити суверенітет над кількома маленькими островами, на яких були тепер неактивні британські станції, що знаходились в районі, претендованому Чилі. Чилійці підняли дипломатичний спір, Сполучені Штати втрутились, і почалася боротьба за Антарктику.\n\nПісля переговорів, Аргентина отримала все, крім найзахіднішої частини своїх заявлених земель. Закріпивши територію, Аргентина відкрила її для міжнародних наукових досліджень, практику, яку вона продовжує до цього дня. Однак, зростаюча мілітаризація території почала викликати занепокоєння.§!"
 ODF_WIP_Country_tt_AAB:0 "§FГраючий контент для цієї території буде додано в майбутньому §DОперація Глибокий Мороз§! §Fоновному оновленні! Ось анонс того, що нас чекає:§!\n\n§WГрупа Ahnenerbe Antarktis є найновішим додатком до антарктичного континенту, працюючи з маленької бази в західній Нейшвабенланді, заснованої кілька років після створення SS-Ordensstaat Burgund. Хоча ця територія формально не є антарктичною територією, як інші п’ять на континенті, Ahnenerbe та інші члени SS, які перебувають в Антарктиці, не мають наміру підкорятися Мейру. Керовані багаторічним Reichsgeschäftsführer Ahnenerbe Вольфрамом Зіверсом, чоловіки з Бегерхайма підкоряються лише Гіммлеру.\n\nЗараз єдина частина Ahnenerbe, що займається польовими дослідженнями, їхні цілі прості: проводити експедиції та експерименти, щоб науково довести перевагу арійської раси та знайти докази для підтримки теорії Світової Льодової Доктрини. Зіверс та його чоловіки сподіваються розкрити секрети, поховані під антарктичним льодом, оскільки вони та інші члени SS в Антарктиці знають, що повернення до Бургундії з порожніми руками — це не варіант.§!"
 ODF_WIP_Country_tt_AAG:0 "§FГраючий контент для цієї території буде додано в майбутньому §DОперація Глибокий Мороз§! §Fоновному оновленні! Ось анонс того, що нас чекає:§!\n\n§WТретя німецька антарктична експедиція була в той час секретною та незначною подією, яка проводила деякі символічні дослідження та заявляла приблизно визначену претензію в середині норвезької антарктичної зони. З початком Другої світової війни ця претензія та експедиція були здебільшого проігноровані і поступово забуті.\n\nКоли почалася боротьба за Антарктику, Рейх звернувся до своїх старих документів з експедиції 1938 року, що дозволило заявити оборонну претензію на регіон Нейшвабенланд. Рейхскомісаріат Норвегія відмовився від своєї антарктичної претензії на користь німців, які потім консолідували територію в поточне адміністрування. Покликавши одного з небагатьох чоловіків, що залишилися з експедиції 1938 року, Рудольфа Мейра, якого витягнули з Південно-Західної Африки і дали йому посаду на краю світу.§!"
 ODF_WIP_Country_tt_AAJ:0 "§FГраючий контент для цієї території буде додано в майбутньому §DОперація Глибокий Мороз§! §Fоновному оновленні! Ось анонс того, що нас чекає:§!\n\n§WДля того щоб реалізувати свою швидко написану претензію на Землю Нобу Шірасе (колишня Земля Марі Бірда) під час боротьби за Антарктику, Японська імперія надіслала загін парашутних десантників Теїсін Шудан під керівництвом Рікічі Цукади для забезпечення контролю над своєю новою землею. Японський антарктичний сектор контролює деякі з найвіддаленіших земель на континенті, але тим не менш, він допоміг Імперії ще більше зміцнити свій контроль над Тихим океаном і забезпечити ворота до Південної Америки.\n\nПісля відставки Цукади, територія стала домом для навчального центру 1-ї повітрянодесантної бригади, під командуванням Кінугаси Хаяо. Його невелика, але добре підготовлена бригада є потужною силою на континенті, яка зосереджена на підтримці та, можливо, навіть розширенні японського гегемонії в цьому регіоні, якщо з'явиться така можливість.§!"
 ODF_WIP_Country_tt_AAC:0 "§FГраючий контент для цієї території буде додано в майбутньому §DОперація Глибокий Мороз§! §Fоновному оновленні! Ось анонс того, що нас чекає:§!\n\n§WІсторія діяльності Чилі в Антарктиці починається в перші десятиліття 20 століття з створення маленького порту на Південних Шетландських островах для китобоїв та мореплавців. На жаль для чилійського уряду, британці наклеїли претензію на Антарктику прямо на місце, де пізніше буде розташовуватися чилійська претензія.\n\nПопри те, що вони офіційно заявили свою претензію за три роки до аргентинців, боротьба за Антарктику закінчилася тим, що аргентинці забрали більшу частину британської претензії завдяки поспішним переговорам. Чилійці втратили ще більше території після війни за Снайп, коли Аргентина захопила спірну територію між двома країнами. Поточний голова Чилійської антарктичної території, Хуліо Ескудеро Гусман, бореться за забезпечення чилійської претензії як до, так і під час боротьби за Антарктику, і не має наміру зупинятися, поки чилійська територія не буде відновлена.§!"
 ODF_WIP_Country_tt_AAO:0 "§FГраючий контент для цієї території буде додано в майбутньому §DОперація Глибокий Мороз§! §Fоновному оновленні! Ось анонс того, що нас чекає:§!\n\n§WФормована з австралійських, новозеландських і колишніх французьких претензій під час боротьби за Антарктику, адміністрація ОВН Антарктики контролює майже половину південного континенту. Цей величезний масив землі є важливою базою для операцій ОВН в Індійському океані, з невеликими військовими установками і морськими базами на узбережжі. Завершення будівництва атомної електростанції на станції МакМердо показує, що присутність ОВН на континенті буде тільки зростати.\n\nПроте, як і в більшості інших країн ОВН, напрямок адміністрації в значній мірі контролюється волею військових США, що Австралія та Нова Зеландія хотіли б змінити найближчим часом.§!"
 
 AAG_CountryInfo_Folder.101:0 "Антарктика"
 AAG_CountryInfo_Content.1:0 "До всього цього"
 AAG_CountryInfo_Content_desc.1:0 "§WАнтарктика§! — це холодне та безжальне місце. До §Y1950-х§! років, найпівденніший континент світу був майже ігнорований, його відвідували лише випадкові §Gнаукові дослідницькі групи§! або одиничні §Gвійськові експедиції§!. Земля була поділена і заявлена різними державами, але ці претензії мали мало дипломатичного значення, оскільки країни надавали перевагу більш придатним для життя регіонам світу. Все змінилося на початку §Y50-х§! років, з початком §iГонитви за Антарктикою§!."
 AAG_CountryInfo_Content.2:0 "Початок Гонитви"
 AAG_CountryInfo_Content_desc.2:0 "Все почалося з дипломатичного спору між §RЧилі§! та §MАргентиною§!, через кілька маленьких островів, які колись належали §xБританії§!, до їх поразки в §eДругій світовій війні§!. Обидві країни, фактично, мали дійсні претензії на ці острови. §MАргентина§!, щоб забезпечити свою суверенітет на регіоні, який вона заявила, почала процес оформлення своєї §WАнтарктичної території§!, а також прийняла частину земель, які раніше належали §xБританії§! і зараз залишалися без адміністрації. §RЧилі§! оскаржило цю дію, змусивши §QСполучені Штати Америки§! втрутитися в їхні переговори, щоб допомогти посередництву в їхньому спорі, а також заявити свої власні претензії на Антарктичний регіон. Справа швидко розвивалася з того часу."
 AAG_CountryInfo_Content.3:0 "Гонитва"
 AAG_CountryInfo_Content_desc.3:0 "§eІмперія Японії§!, прагнучи ще більше зміцнити свій контроль над Тихим океаном, заявила територію, колишню Марі-Берд Ленд, відправивши невелику військову силу для забезпечення території, перш ніж §QАмериканці§! зможуть щось спробувати. §QСполучені Штати Америки§! швидко відреагували, об'єднавши австралійські, новозеландські та колишні французькі претензії в §QАдміністрацію Антарктики ОВН§!. §rНімецький Рейх§! захопив претензію теперішнього Рейхскомісаріату Норвегії, який вже перекривав їхні антарктичні претензії, об'єднавши два ці регіони в територію, тепер відому як §rНойшвабенланд§!. У поспішно завершених переговорах між двома південноамериканськими країнами, §RЧилі§! отримав значно менше своєї заявленої території, тоді як §MАргентина§! забезпечила суверенітет над півостровом Трініті та багатьма навколишніми островами. За тиждень, §iГонитва за Антарктикою§! розділила континент на п’ять територій, оскільки Холодна війна ставала все §Wхолоднішою§!."
 AAG_CountryInfo_Content.4:0 "Антарктика сьогодні"
 AAG_CountryInfo_Content_desc.4:0 "До §Y1962§!, §WАнтарктика§! стала ще більше експлуатованою і мілітаризованою. §QАдміністрація Антарктики ОВН§! є важливою навчальною базою та базою для таємних операцій в Індійському океані, з тим, що §eЯпонський антарктичний сектор§! робить те ж саме на сході. Після невдалих спроб колонізації в §Y1950-х§!, §rНойшвабенланд§! став майданчиком для випробувань експериментальних літаків, холодостійкого обладнання, а згідно з непідтвердженими повідомленнями, ядерної технології. Тихо, §IAhnenerbe§! веде свою діяльність на базі в західному §rНойшвабенланді§!, проводячи свої власні §Iтаємничі операції§! далеко від чужих очей. §MАргентина§! стикається з внутрішніми труднощами, оскільки Аргентинський військово-морський флот і Аргентинський антарктичний інститут змагаються за контроль над територією, в той час як §RЧилі§! хотіло б отримати трохи більше території, яку вони заявили. Навіть із сучасними технологіями, Антарктика все ще небезпечне місце, де зустрічаються безжальні погодні умови, смертельні тріщини та погана інфраструктура. Як би вони не намагалися домінувати над §WАнтарктикою§!, замерзлий континент ніколи не був добрим до чужинців."

 AAG_CountryInfo_Folder.102:0 "Нойшвабенланд"
 AAG_CountryInfo_Content.5:0 "3-та експедиція"
 AAG_CountryInfo_Content_desc.5:0 "Історія §rНойшвабенланду§!, або §rНової Швабії§!, як її називають поза §rРейхом§!, починається в грудні §Y1938§!. §DТретя німецька антарктична експедиція§!, під командуванням §gАльфреда Рітшера§!, вирушила до §WАнтарктики§! на борту §gMS Schwabenland§!, з метою знайти місце для китобійної станції та пошукати можливі місця для військово-морської бази. Екіпаж прибув до §VКоролеви Мауд Ленд§!, частини континенту, яка вже була заявлена §VНорвегією§!, і здійснив власні претензії на цей регіон, виконуючи завдання експедиції, картографуючи тисячі квадратних кілометрів §Wантарктичного§! льоду. Коли §gMS Schwabenland§! повернувся до §rБатьківщини§! у лютому 1939 року, маленька та відносно секретна експедиція потонула в забутті, оскільки §eДруга світова війна§! та її наслідки охопили світ. Протягом наступного десятиліття §WАнтарктика§! залишалася непорушною, далеко від хаосу."
 AAG_CountryInfo_Content.6:0 "Гонитва"
 AAG_CountryInfo_Content_desc.6:0 "Те, що почалося як невеликий спір між §MАргентиною§! та §RЧилі§! щодо статусу кількох колишніх §xБританських§! островів в §BWедделевому морі§!, швидко переросло в §iГонитву за Антарктикою§!, коли три великі держави поспішили забезпечити своє місце в §WАнтарктичному§! пирозі. §DТретя німецька антарктична експедиція§!, яка була майже забута, тепер служила для закріплення претензій §rРейху§! на §WАнтарктику§!, разом з колишніми §VНорвезькими§! претензіями, які були передані їм теперішнім §rРейхскомісаріатом§! §VНорвегія§!. §VКоролева Мауд Ленд§! була офіційно перейменована на §rНойшвабенланд§!, §VПринца Олафа Берег§! на §rБерег Адольфа Гітлера§!, §VПринцеса Марта Берег§! на §rБерег Еви Гітлер§!, а §ocивільна адміністрація§! була створена з метою спроби колонізувати цей регіон."
 AAG_CountryInfo_Content.7:0 "Турбулентність"
 AAG_CountryInfo_Content_desc.7:0 "Молоді §WАнтарктичні§! бази стикнулися з нестачею постачання під час свого короткого існування, і ситуація лише погіршилася з початком §eВійни на Заході Росії§!, яка також стала останньою краплею для колоністів та §rРейху§! у їхніх спробах колонізувати суворі §WАнтарктичні§! землі. Після закінчення війни, територія була реорганізована в нинішнє §rвійськове управління§!, під керівництвом §gОбер-лейтенанта Люфтваффе Рудольфа Мая§!, який, кілька десятиліть тому, був одним з пілотів §DТретьої німецької антарктичної експедиції§!. §rНойшвабенланд§! зараз функціонує як §gЛюфтваффе Ерпробунгстелле§!, або майданчик для випробувань §gекспериментальних літаків§! та, останнім часом, §Knuclear weapons§!."
 AAG_CountryInfo_Content.8:0 "Особливості контенту"
 AAG_CountryInfo_Content_desc.8:0 "* Розробляти та тестувати §gнайсучасніші літаки§! для допомоги в майбутніх зусиллях §rРейху§!\n\n* Керувати таємними §Knuclear tests§!, що проводяться §sГерр Професор Доктор Шуман§!\n\n* Забезпечити функціонування §rНойшвабенланду§! за умов §osupply shortages§! та §eнестабільності§! вдома"
 
 AAO_CountryInfo_Folder.101:0 "Антарктика"
 AAO_CountryInfo_Content.1:0 "До всього цього"
 AAO_CountryInfo_Content_desc.1:0 "§WАнтарктика§! — це холодне та безжальне місце. До §Y1950-х§! років, найпівденніший континент світу був майже ігнорований, його відвідували лише випадкові §Gнаукові дослідницькі групи§! або одиничні §Gвійськові експедиції§!. Земля була поділена і заявлена різними державами, але ці претензії мали мало дипломатичного значення, оскільки країни надавали перевагу більш придатним для життя регіонам світу. Все змінилося на початку §Y50-х§! років, з початком §iГонитви за Антарктикою§!."
 AAO_CountryInfo_Content.2:0 "Початок Гонитви"
 AAO_CountryInfo_Content_desc.2:0 "Все почалося з дипломатичного спору між §RЧилі§! та §MАргентиною§!, через кілька маленьких островів, які колись належали §xБританії§!, до їх поразки в §eДругій світовій війні§!. Обидві країни, фактично, мали дійсні претензії на ці острови. §MАргентина§!, щоб забезпечити свою суверенітет на регіоні, який вона заявила, почала процес оформлення своєї §WАнтарктичної території§!, а також прийняла частину земель, які раніше належали §xБританії§! і зараз залишалися без адміністрації. §RЧилі§! оскаржило цю дію, змусивши §QСполучені Штати Америки§! втрутитися в їхні переговори, щоб допомогти посередництву в їхньому спорі, а також заявити свої власні претензії на Антарктичний регіон. Справа швидко розвивалася з того часу."
