 Antarctica_econ_window_overlay_tt: "§FЧерез наш статус §WАнтарктичної території§! ми не маємо контролю над власними §Geconomic§! справами. Бюджетування здійснюється нашою домашньою владою, і нам не потрібно збирати §Yподатки§!, управляти §GGDP§! і §Rборгом§!, контролювати наші §Gвалютні резерви§! та інші економічні заходи.§!"
 ANTARCTICA_INTEL_PANEL_TT: "§FЧерез наш статус §WАнтарктичної території§! ми не маємо власного централізованого розвідувального агентства. Операції з шпигунства координуються нашою домашньою владою від нашого імені та з нашою допомогою.§!"
 ANTARCTICA_PRODUCTION_PANEL_TT: "Через наш статус §WАнтарктичної території§! ми не виробляємо обладнання або не маємо важкої промисловості. Все необхідне обладнання імпортується з нашої батьківщини, сподіваючись на швидкість доставки."
 ANTARCTICA_CONSTRUCTION_PANEL_TT: "Через наш статус §WАнтарктичної території§! у нас немає ресурсів чи можливостей для великих будівельних проектів без підтримки та настанов нашої батьківщини."
 ANTARCTICA_DEPLOY_PANEL_TT: "Через наш статус §WАнтарктичної території§! ми не можемо набирати дивізії або розгортати армію, якщо сили не будуть надіслані з нашої батьківщини."
 Antarctica_division_resupply_tt: "Операції з поповнення та допомоги нашим польовим дивізіям доступні в розділі §YШтаб командування§!."
 
 AAN_Antarctic_Anarchy: "Антарктичні пустки"
 AAN_Antarctic_Anarchy_desc: "Те, що мало існує життя в Антарктиці, зазвичай обмежується узбережжям, де море дає хоч якийсь прихисток їхньому сумному існуванню. Чим ближче людина наближається до темного серця замороженого континенту, тим більше територія стає неприязною. Різко загострені саструги, бездонні тріщини та сніжна сліпота всі випробовують існування життя. Лише новоприбулі люди були б настільки безрозсудними, щоб вирушити в таке місце.\n\nНебо яскраво синє і порожнє, дивиться вниз на ці льодові поля, позбавлені опадів, таке ж холодне, як могила. Тут знаходиться найбільша і найнебезпечніша пустеля Землі. Ще гірше те, що зими тут жорстокіші, ніж будь-де, величезна всепоглинаюча порожнеча, чорна темрява під зорями. Температура в середньому досягає мінус 50 градусів Цельсія, що погіршується вітрами, які можуть стерти тіло до кісток. Коли людство стоїть на межі ядерного знищення, ці пустки — передчуття того, який світ може чекати на тих нещасних, хто переживе таку катастрофу.\n\n§QВічна чорна зима, забуття, що стало реальністю.§!"

