# Opening Screen
 REGIONAL_INFO_ANTARCTICA:0 "§G==АНТАРКТИКА==§!\n\n§WАнтарктика§! — це холодне і непривітне місце. До §Y1950-х років§! південний континент світу здебільшого ігнорувався, і його відвідували лише §Gнауково-дослідні групи§! або рідкісні §Gвійськові експедиції§!. Територія була поділена й заявлена різними державами, але ці претензії мали мало дипломатичного значення, оскільки країни надавали перевагу більш придатним для життя регіонам світу. Все змінилося на початку §Y50-х років§!, із §iБоротьбою за Антарктику§!.\n\nВсе почалося з дипломатичного спору між §RЧилі§! і §MАргентиною§! щодо кількох крихітних островів, які раніше належали британцям до їхньої поразки у Другій світовій війні. Обидві країни, технічно, мали дійсні претензії на острови. §MАргентина§!, щоб забезпечити свій суверенітет над регіоном, який вона заявляла, почала процес формалізації своєї §WАнтарктичної території§!, а також включила частину земель, які раніше належали британцям і залишилися без адміністрації. §RЧилі§! оскаржила ці дії, що спонукало §QСполучені Штати Америки§! втрутитися в їхні переговори для медіації спору, а також висунути власні претензії на Антарктичний регіон. Події швидко розвивалися звідти.\n\n§eЯпонської імперії§!, бажаючи ще більше зміцнити свою владу над Тихим океаном, заявила права на територію, раніше відому як Земля Марі Берд, і відправила невелике військове формування, щоб закріпити цю територію до того, як §Qамериканці§! зможуть щось зробити. §QСполучені Штати Америки§! швидко відповіли, консолідувавши австралійські, новозеландські та колишні французькі претензії в §QАнтарктичну адміністрацію ОВН§!. §rҐерманський Райх§! привласнив претензії колишнього Райхскомісаріяту Норвегії, які вже перетиналися з їхньою антарктичною претензією, об'єднавши їх у територію, відому тепер як §rНойшвабенланд§!. У швидко завершених переговорах між двома південноамериканськими країнами §RЧилі§! залишилася з меншою частиною, тоді як §MАргентина§! забезпечила суверенітет над півостровом Триніті та багатьма навколишніми островами. Протягом тижня §iБоротьба за Антарктику§! поділила континент на п'ять територій, коли Холодна війна стала ще §Wхолоднішою§!.\n\nДо §Y1962 року§! §WАнтарктика§! стала ще більше експлуатованою та мілітаризованою. §QАнтарктична адміністрація ОВН§! є важливим навчальним майданчиком та базою для таємних дій в Індійському океані, а §eЯпонський Антарктичний сектор§! займається подібною діяльністю на сході. Обидві сторони пильно стежать за кордоном. Після кількох невдалих спроб колонізації у §Y1950-х роках§! §rНойшвабенланд§! став випробувальним майданчиком для експериментальних літаків, обладнання для холодної погоди, а за непідтвердженими даними — і ядерних технологій. У західній частині §rНойшвабенланду§! §IАненербе§! тихо ведуть §Iтіньові операції§!, далеко від сторонніх очей. §MАргентина§!, задоволена своїми претензіями, використовує регіон для наукових цілей, часто дозволяючи іноземним ученим відвідувати територію. §RЧилі§! дотримується подібної політики, хоча їхня адміністрація воліла б отримати більше територій, які вони заявляли.\n\nНавіть із сучасними технологіями Антарктика залишається небезпечним місцем із суворою погодою, смертельними тріщинами та слабкою інфраструктурою. Незважаючи на спроби домінувати над §WАнтарктикою§!, замерзлий континент ніколи не був добрим до чужинців."

