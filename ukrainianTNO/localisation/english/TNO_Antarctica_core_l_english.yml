 AAO_CountryInfo_Content.4:0 "Антарктика сьогодні"
 AAO_CountryInfo_Content_desc.4:0 "До §Y1962§!, §WАнтарктика§! стала ще більше експлуатованою і мілітаризованою. §QАдміністрація Антарктики ОВН§! є важливою навчальною базою та базою для таємних операцій в Індійському океані, з тим, що §eЯпонський антарктичний сектор§! робить те ж саме на сході. Після невдалих спроб колонізації в §Y1950-х§!, §rНойшвабенланд§! став майданчиком для випробувань експериментальних літаків, холодостійкого обладнання, а згідно з непідтвердженими повідомленнями, ядерної технології. Тихо, §IAhnenerbe§! веде свою діяльність на базі в західному §rНойшвабенланді§!, проводячи свої власні §Iтаємничі операції§! далеко від чужих очей. §MАргентина§! стикається з внутрішніми труднощами, оскільки Аргентинський військово-морський флот і Аргентинський антарктичний інститут змагаються за контроль над територією, в той час як §RЧилі§! хотіло б отримати трохи більше території, яку вони заявили. Навіть із сучасними технологіями, Антарктика все ще небезпечне місце, де зустрічаються безжальні погодні умови, смертельні тріщини та погана інфраструктура. Як би вони не намагалися домінувати над §WАнтарктикою§!, замерзлий континент ніколи не був добрим до чужинців."
 
 AAO_CountryInfo_Folder.102:0 "OAA"
 AAO_CountryInfo_Content.5:0 "До початку боротьби"
 AAO_CountryInfo_Content_desc.5:0 "До початку §iБоротьби за Антарктику§!, останні зусилля §eАмерики§! в §WАнтарктиці§! відбулися в §Y1940§! році, з експедицією §DАнтарктичної служби США§!, третьою експедицією під керівництвом §gРічарда Евелина Берда§!. §gБерд§! був рушійною силою більшості зусиль §eСША§! на південному континенті, і його пристрасть до §WАнтарктики§! навіть призвела до того, що його запросили на §DТретю німецьку антарктичну експедицію§! (яку він відмовився брати через зростаючі напруженості). Після поразки §eСША§! в §VДругій світовій війні§!, подальші зусилля в §WАнтарктиці§! були відкладені на невизначений час, оскільки §eСША§! відновлювали свої сили. Так звана §D"Операція Highjump"§! була скасована на ранніх етапах планування."
 AAO_CountryInfo_Content.6:0 "ODF"
 AAO_CountryInfo_Content_desc.6:0 "Інтерес §eАмерики§! до §WАнтарктики§! поновився після суперечок між §MАргентиною§! і §RЧилі§! на початку §Y50-х§!, що започаткувало §iБоротьбу за Антарктику§!. Коли §rНімці§! відновили свої старі претензії до континенту, §eАмериканці§! відповіли тим же. Члени §QОрганізації вільних націй§! об'єднали свої території в §QАдміністрацію Антарктики ОВН§! і негайно почали розгортати §omilitary units§! в регіон під командуванням §gАдмірала Берда§!. Ця ініціатива, названа §Q"Операція Глибокий Заморозок"§!, була найбільшою експедицією в §WАнтарктиці§! в історії, з величезним §Bморським контингентом§!, §Bавіаційним контингентом§! та понад §B8,000 особами§!. §eАмериканці§! створили постійну базу в §WMcMurdo Sound§!, в той час як §VЯпонці§! захопили §WMary Byrd Land§! і §rНімці§! повернулися до §rNew Swabia§!. §WХолодна війна§! прийшла в §WАнтарктику§!, і було очевидно, що вона там залишиться."
 AAO_CountryInfo_Content.7:0 "Адміністрація"
 AAO_CountryInfo_Content_desc.7:0 "Після смерті §gАдмірала Берда§! в §Y1957§!, §gАдмірал Джордж Андерсон-молодший§! був призначений новим керівником §QАнтарктичного командування з розвитку§! і §QАдміністрації Антарктики ОВН§!. Цю посаду потім перейняв §gВіц-адмірал Вільям Раборн§! в §Y1961§!. Останнім часом, однак, територія стикається з низкою внутрішніх проблем, оскільки §nАвстралійці§! та §MНова Зеландія§! (які спочатку претендували на цю землю) вимагають більшої ролі в управлінні §QАдміністрацією Антарктики ОВН§!."
 
 AAA_CountryInfo_Folder.101:0 "Антарктика"
 AAA_CountryInfo_Content.1:0 "До всього"
 AAA_CountryInfo_Content_desc.1:0 "§WАнтарктика§! — це холодне і безжальне місце. До §Y1950-х§!, найпівденніший континент світу був здебільшого ігнорований, лише час від часу відвідуваний науковими експедиціями чи одиничними §Gвійськовими експедиціями§!. Земля була поділена і претендувана різними державами світу, але ці претензії мали мало дипломатичного значення, оскільки країни надавали перевагу населеним регіонам світу. Все це зміниться на початку §Y50-х§!, з початком §iБоротьби за Антарктику§!."
 AAA_CountryInfo_Content.2:0 "Початок боротьби"
 AAA_CountryInfo_Content_desc.2:0 "Все почалося з дипломатичної суперечки між §RЧилі§! та §MАргентиною§!, щодо кількох маленьких островів, які раніше належали §xБританцям§!, до їх поразки в §eДругій світовій війні§!. Обидві країни, технічно, мали чинні претензії на ці острови. §MАргентина§!, щоб забезпечити свою суверенність над регіоном, який вона претендувала, почала процес формалізації своєї §WАнтарктичної території§!, а також прийняття деяких земель, які раніше належали §xБританцям§! і тепер залишались без управління. §RЧилі§! оскаржило цей крок, що спонукало §QСполучені Штати Америки§! вступити в їх переговори, допомагаючи медіацію суперечки, а також заявляючи свої претензії на антарктичний регіон. Ситуація швидко розвивалась далі."
 AAA_CountryInfo_Content.3:0 "Боротьба"
 AAA_CountryInfo_Content_desc.3:0 "§eІмперія Японії§!, прагнучи посилити свій контроль над Тихим океаном, заявила територію, раніше відому як Земля Марі Берда, відправивши маленький військовий контингент для забезпечення цієї території, перш ніж §QАмериканці§! зможуть щось зробити. §QСполучені Штати Америки§! швидко відреагували тим самим, об'єднавши австралійські, новозеландські та колишні французькі претензії в §QАдміністрацію Антарктики ОВН§!. §rНімецький Рейх§! захопив претензію нинішнього §rРейхскомісаріату Норвегія, яка вже перекривала їх претензії на Антарктику, об'єднавши дві території в одну під назвою §rNeuschwabenland§!. В екстрених переговорах між двома південноамериканськими країнами, §RЧилі§! отримала мало, в той час як §MАргентина§! забезпечила суверенітет над півостровом Трініті та багатьма прилеглими островами. За тиждень §iБоротьба за Антарктику§! поділила континент на п’ять територій, оскільки Холодна війна ставала все більш §Wхолодною§!."
 AAA_CountryInfo_Content.4:0 "Антарктика сьогодні"
 AAA_CountryInfo_Content_desc.4:0 "До §Y1962§! §WАнтарктика§! стала ще більш експлуатованою та мілітаризованою. §QАдміністрація Антарктики ОВН§! стала важливим тренувальним майданчиком і базою для таємних операцій в Індійському океані, в той час як §eЯпонський антарктичний сектор§! робить те саме на сході. Після кількох невдалих спроб колонізації в §Y1950-х§!, §rNeuschwabenland§! став випробувальним полігоном для експериментальних літальних апаратів, холодностійкого обладнання та, згідно з непідтвердженими повідомленнями, ядерних технологій. Потайки §IAhnenerbe§! веде базу в західній частині §rNeuschwabenland§!, здійснюючи свої власні §Iтаємні операції§! від чужих поглядів. §MАргентина§! стикається з внутрішніми проблемами, оскільки Аргентиська флотилія і Аргентиський антарктичний інститут змагаються за контроль над територією, в той час як §RЧилі§! хоче отримати більше частини території, яку вони претендують. Навіть з сучасними технологіями, Антарктика все ще небезпечне місце, наповнене нещадними погодними умовами, смертельними тріщинами та поганою інфраструктурою. Незважаючи на всі їхні зусилля, §WАнтарктика§! завжди була несприятливою для чужинців."
 
 AAA_CountryInfo_Folder.102:0 "Аргентинська Антарктика"
 AAA_CountryInfo_Content.5:0 "До початку боротьби"
 AAA_CountryInfo_Content_desc.5:0 "Ранні дії §MАргентини§! в §WАнтарктиці§! почалися в середині §Y1900-х§! з встановленням метеостанцій та обсерваторій на островах, що оточують §WПівострів Трініті§!. До §eДругої світової війни§!, претензії §xБританії§!, §MАргентини§! та §RЧилі§! перекривалися, але після закінчення війни §xБританці§! не змогли змусити свої претензії на §WАнтарктику§! до виконання. §MАргентина§! почала поступово зміцнювати свої претензії та встановлювати контроль над колишнім §xБританським§! регіоном в кінці §Y1940-х§! та на початку §Y50-х§!. Багато в чому цей успіх був завдяки зусиллям §MГенерала Ернана Пухато§!, який здійснив встановлення §MSan Martín Base§! та §MІнституту Антарктичного Аргентини§!. У цей період почалися дипломатичні й навіть військові конфлікти з §RЧилійцями§! через перекриття претензій. Це досягло кульмінації в §Yлютому 1952 року§!, коли були зроблені перші постріли в §WАнтарктиці§!, коли §MАргентинський§! патруль відкрив вогонь по групі §RЧилійських§! геодезистів."
 AAA_CountryInfo_Content.6:0 "Накопичення"
 AAA_CountryInfo_Content_desc.6:0 "Цей інцидент призвів до залучення іноземних держав у суперечку між §MАргентиною§! та §RЧилі§!, де §rНімеччина§! виступила на підтримку пероністської §MАргентини§!, в той час як §QОВН§! закликав до миру. Ці переговори призвели до §iБоротьби за Антарктику§!, що відбулася наприкінці §Y1952§!, що встановила п'ять основних §WАнтарктичних§! територій як юридичні одиниці. Тепер, коли §WАнтарктика§! була розділена серед країн світу, вирішення конфлікту між §RЧилійцями§! та §MАргентиною§! йшло повільно, і кордон між обома регіонами досі оспорюється. Деякі зрушення сталися в §Y1955§!, коли було заплановано можливу конференцію між державами, але усунення Хуана Перона в §Yсічні 1956§! призвело до виходу §rНімеччини§! з переговорів, залишивши §QОВН§! єдиним посередником. Ще одна конференція планувалася на §Y1958§! для остаточного вирішення суперечки на фоні погіршення світової фінансової ситуації через крах економіки §rНімеччини§! внаслідок §eВійни з Росією§!."
 AAA_CountryInfo_Content.7:0 "Війна за сніп"
 AAA_CountryInfo_Content_desc.7:0 "Однак §BАргентинський флот§!, головний бенефіціар експансіонізму §MАргентини§! в §WАнтарктиці§!, був вражений перспективою того, що конференція під контролем §QОВН§! може демілітаризувати регіон. В §Yчервні 1958 року§!, §BАргентинський флот§! вторгся та захопив спірну західну частину своєї §WАнтарктичної§! претензії, а також кілька островів у §RПротоку Бігл§!, у події, відомій як §eВійна за сніп§!. Попри те, що §MАргентинський уряд§! офіційно заперечував свою причетність до інциденту, посередники §QОВН§! вийшли з переговорів між двома південноамериканськими країнами, залишивши §MАргентину§! з її незаконно захопленими територіями."
 AAA_CountryInfo_Content.8:0 "Нестійкий мир"
 AAA_CountryInfo_Content_desc.8:0 "Коли пил осів після §eВійни за сніп§!, §BАргентинський флот§! продовжував намагатися збільшити мілітаризацію своєї §WАнтарктичної§! території, так само, як і з §BTierra del Fuego§!. Їхні зусилля були частково гальмовані §MІнститутом Антарктичного Аргентини§!, з допомогою §MLейтенанта полковника Хорхе Едгара Леала§! та пероністських залишків у уряді, включаючи §MГенерала Пухато§!. Тим часом, §RЧилійці§! не змогли досягти успіху в спробах відновити східну частину своєї території, а §MАргентина§! зміцнила свій контроль над регіоном. Тепер недавно підвищений §MПолковник Хорхе Едгар Леал§! очолює §MАргентинську Антарктику§!, з гіркими §RЧилійцями§! на заході і нестабільними §rНімцями§! на сході. Однак його погляд спрямований §Onapівдень§! до §Wпівденного полюса§!."

