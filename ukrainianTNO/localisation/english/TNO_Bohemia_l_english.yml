 ### leader bios ###
 POLITICS_LUTZ_GRAF_KROSIGK_DESC:0 "Консервативний юрист та зневажений колишній міністр фінансів, Лютц Ґраф Шверін фон Кросіґк не та людина, яку можна було б очікувати на посаді, що керує будь-якою частиною величезних територій Райху. Призначений на посаду міністра фінансів Райху ненависним фон Папеном, він зміг зберегти свою посаду під час і після захоплення влади націонал-соціялістами завдяки комбінації мовчазного виконання наказів Гітлера та стабільному управлінню дорогоцінною валютою Райху під час років масових витрат. Однак його компетентність не змогла запобігти економічному краху 1950-х років. Його попередні досягнення в цій сфері та навіть повага Гітлера не змогли врятувати його роботу.\n\nПісля його усунення з посади міністра фінансів, Шверіна перекидало по численних відомствах - він став блукаючим бюрократом, що проглядає папери, але врешті-решт він став райхспротектором Богемії та Моравії завдяки своїй доволі м'якій, однак умілій руці у питанні заспокоєння місцевих жителів. Як виявилося, він став останнім на цій посаді, оскільки райхспротекторат було формально анексовано до складу Райху на початку 1950-х років.\n\nЧерез кілька років після анексії райхспротекторату до фактичних кордонів Райху Кросіґк знову з'явився на місцевій політичній арені, хоча цього разу як райхсвертайдіґунґскомісар військового округу XIX, місцевого командування вермахту, яке взяло на себе відповідальність після того, як хаос охопив Райх. Учасники громадянської війни в Німеччині ще не змогли захопити цю досить маленьку та нейтральну територію, але майбутнє такого кордону - і райхсвертайдіґунґскомісара зокрема - є досить похмурим, якщо все розвалиться під ударом одного з претендентів."

 POLITICS_KURT_DALUEGE_DESC:0 "Народившись у маленькому сілезькому місті, Курт Макс Франц Далюґе завжди був цілковито й повністю німцем, що процвітав у військовій культурі старої імперії. Далюґе вступив до нацистської партії на початку її існування і незабаром перейшов до СС, обіймаючи посаду голови Орднунґсполіцай протягом багатьох довоєнних років. Це була посада, яка ідеально підходила для такого соціопата, як він, і Далюґе був надзвичайно ефективним у придушенні партизанів і незгодних.\n\nТак сталося, що, коли Далюґе відправили до Богемії після поразки Совєтського Союзу, це здалося йому пониженням - наче його позбавляли рангу без жодної причини. Але, незважаючи на його неприязнь до цієї посади, Далюґе був впевнений, що незабаром повернеться до центру німецької політики, тому продовжував проявляти жорстокість до тих, за ким наглядав. Коли Гіммлер здійснив свій переворот, Далюґе не міг нічого зробити, окрім як спостерігати зі своєї посади в Празі. Повернення до вищих штабелів німецької політики так і не відбулося.\n\nУтім, відсутність посади у внутрішній партії насправді не пригнічувала Далюґе. Він зумів побудувати свою мережу впливу в Богемії, навіть зрадивши принципам СС і працюючи з чеським опором у роки, що настали після Західноросійської війни, дозволяючи їм зростати під його контролем і використовуючи їх для підриву гарнізону, коли йому це було вигідно. Коли настала громадянська війна, він використав свою мережу і вигнав гарнізон із Праги, проголосивши себе оберстґруппенфюрером. Мало хто, не рахуючи СС, підтримають його переворот і фанатичні дії, які, безсумнівно, стануться.\n\nАле в очах Далюґе, він уже вдосталь зазнавав приниження з боку Ґерманії. Нехай розпусні дурні кричать по всьому континенту. Далюґе тепер має владу в Богемії, і ніхто, ні в його власному царстві, ні в Німеччині, ні навіть у Бурґундії, не зможе забрати це у нього."