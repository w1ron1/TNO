 ## Опис лідера ##
 POLITICS_EMILE_BEDIANE_DESC: "Задум нації джола є відносно новим. Раніше, регіон Казаманс був усього лишень частиною Сенегалу. Люди там жили аналогічно сенегальцям, і регіон досить не вирізнявся, для хаотичного заходу Африки.\n\nТа все змінилося завдяки одній особі.\n\nЕміль Бадіане народився в 1915 році. Відмінний учень в школі: його пристрасть до освіти ніколи не згасала, і після випуску він став шкільним учителем. Довгий час здавалося - це буде найвища посада, якої він досягне в житті. Проте коли війна прийшла й пішла, Бадіане вгледів можливість стати чимось більшим, і вступив у політику. Там він віднайшов рух, якому віддав себе повністю – боротьба за незалежність народу джола, до якого він сам належав.\n\nЧітко долаючи будь-яку опозицію, Бадіане став речником Казамансу в середині 1950-х. Потім - низка масових протестів, довгих промов і постійних перешкод, що змусило Сенегал провести референдум про незалежність, який насилу прийняли. Спираючись на це, Бадіане офіційно проголосив Республіку Казаманс - і відокремився.\n\nТепер, Бадіане веде Казаманс у нову епоху для Західної Африки. Як переконаний ізоляціоніст, він продовжує спочивати на лаврах своїх минулих досягнень. Це наділило його величезною повагою, як засновника нації, проте не забезпечило вагомої підтримки. Оскільки опозиція зростає з кожним днем, залишається питання: чи зможе Бадіане утримати владу? Якщо він не здатний контролювати політику Казамансу, ніби колись контролював шкільне подвір'я - лічені його дні."

