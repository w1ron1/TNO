 ### Ідеї ###
 JOL_idea_under_shadow_wolofia: "Під сенегальською тінню"
 JOL_idea_under_shadow_wolofia_desc: "Казаманс – дуже маленька країна, що практично обділена армією. У вимірі хаосу на заході Африки, беззахисні країни не квітнуть довго. Тому Казаманс змушений звернутися за захистом до сусідів. Сенегал запропонував найкращі умови й найширшу автономію уряду Казамансу. Зараз Казаманс залишається незалежною державою під захистом Сенегалу, хай і вплив його чималого сусіда відчутно тяжіє над ним."
 JOL_idea_home_exiled_paigc: "Дім вигнанців із АПНГК"
 JOL_idea_home_exiled_paigc_desc: "Казаманс розташований на північ від іберійської колонії Гвінея-Бісау, і став домівкою для багатьох вигнанців звідти. Коли повстання Африканської партії за незалежність Гвінеї та Кабо-Верде зазнало поразки, партії вимушено довелося піти в вигнання до Гвінеї. Там зсередини виникли розколи - і одна з фракцій, під керівництвом Луїша Кабрала, відокремилася від головної організації та переїхала до Казамансу, де Кабрал продовжує її очолювати."