#National Spirits
MOR_Lyautey_Kingdom: "Королівство Ліоте"
MOR_Lyautey_Kingdom_desc: "Як протекторат Іберії над Марокко, так і внутрішні структури Марокканського королівства й досі значною мірою є продуктами діяльності Юбера Ліоте, французького колоніального офіцера початку XX століття. Його спадщина й сьогодні добре відчувається в різноманітних адміністративних структурах: зокрема, мовою управління досі залишається французька, а землевласницька знать використовується як ключові васали колоніальної адміністрації.\n\nГоловною спадщиною Ліоте є те, що всі екстрактивні інституції Марокко опосередковано, але надзвичайно ефективно працюють над створенням держави, де переважна більшість населення живе в жахливій бідності, тоді як клас колабораціоністів, колоніальних адміністраторів та іноземних бізнесменів визискує Марокко до останнього й живе у відносній розкоші. Ті, хто тримає кермо влади, можуть змінюватися, але сама система зрештою залишається незмінною."
MOR_Makhenz_Istiqlal: "Махзен та Істікляль"
MOR_Makhenz_Istiqlal_desc: "Внутрішню політику Марокко можна розділити на дві чітко виражені фракції. Перша — Махзен, до якого належать королівський двір, сили безпеки країни та армія. Друга — Істікляль, масова виборна партія, що домінує в електоральній політиці Марокко. Обидві прагнуть зрештою здобути незалежність Марокко, але Махзен значно прихильніше ставиться до Іберії. Водночас виникають конфлікти через значну ліву фракцію всередині Істіклялю, яку Махзен люто ненавидить.\n\nНаразі ці дві фракції існують у вимушеній та нестабільній співпраці. Але це триватиме доти, доки одна з них не отримає можливість безпечно позбутися іншої. Ця напруженість цілком може приректи на загибель і Махзен, і Істікляль у найближчі роки."
MOR_Nation_Long_Shadow: "Довга тінь нації"
MOR_Nation_Long_Shadow_desc: "У багатьох аспектах політичне життя Марокко визначається іредентизмом. Обидві правлячі фракції країни є надзвичайно іредентистськими. Махзен та Істікляль вважають Мавританію, Західну Сахару та низку інших регіонів законною марокканською територією, відібраною в них колоніальними державами.\n\nУ деяких країнах іредентистські фантазії можуть бути обмежені окремими представниками правлячого класу, але Марокко — не такий випадок. Народ країни більш ніж готовий вирушити на війну за землі, які вважає законними територіями Марокко. Самої згадки про повернення Західної Сахари чи Мавританії більш ніж достатньо, щоб будь-який урядовець або політична фракція здобули політичну легітимність — на краще це чи на гірше."
MOR_Letat_Cest_Moi: "Держава — це я"
MOR_Letat_Cest_Moi_desc: "Коли Іберія встановила контроль над Марокко, вона успадкувала системи та спадщину, створені французьким колоніальним правлінням. Тепер ті самі системи, які колись нав'язала Франція, знову прищеплюються до нового режиму. Цей новий режим — незалежне Марокканське королівство — безперечно має більше життєвої сили, ніж старий протекторат, але водночас багато в чому залишається схожим на своїх попередників. Уряд короля Хасана продовжує корупцію та визискування, започатковані французами, але відмовився від децентралізованого аристократичного правління.\n\nКоролю не потрібні регіональні еліти. Усі повинні служити Махзену — або бути знищеними."
MOR_One_Nation_One_Party: "Одна нація, одна партія"
MOR_One_Nation_One_Party_desc: "Радійте! Король і його двір головорізів, злодіїв та іноземних маріонеток нарешті усунені! Тепер Істікляль отримав владу для створення нового, республіканського уряду, заснованого на ідеалах парламентської демократії! Принаймні, так це виглядає в теорії. Насправді ж ця демократія щонайбільше є ілюзією. Істікляль беззаперечно є найпопулярнішою партією та має повний контроль над державними службами й силами безпеки країни. Вона контролює практично весь парламент і може в будь-який момент розчавити опозиційні угруповання.\n\nДо того ж, після зникнення колоніальної держави, яку можна було ненавидіти, антиколоніальні тенденції, що колись видавалися за ідеологію, тепер розчинилися в небутті. Нова республіка Істіклялю так само ідеологічно порожня та ультранаціоналістична, як і королівство, що їй передувало."
MOR_Glory_Soldier_Glory_Martyr: "Слава солдату, слава мученику"
MOR_Glory_Soldier_Glory_Martyr_desc: "Коли іберійці зімкнули свою лещату хватку навколо Марокко, а колоніальний уряд фактично почав безпосередньо правити народом, марокканська політика перевернулася з ніг на голову. І королівський двір, і Істікляль були розбиті, не здатні знайти собі місця в часи, коли націю визначала лише військова сила, коли лише військова сила мала сенс.\n\nГероями марокканської нації, які боролися за те, щоб назавжди позбутися іберійців, стали не політики, а солдати Марокко. Іберійці чітко показали, що свобода приходить лише зі ствола гвинтівки, і тепер Марокко усвідомило, що те саме стосується й уряду. Відтепер Марокко завжди очолюватимуть солдати — славні мученики нації."
MOR_No_Longer_Fool: "Більше не дурень"
MOR_No_Longer_Fool_desc: "Старі колоніальні структури управління, які поколіннями правили Марокко, остаточно й безповоротно зруйновані, перетворені на самий лише попіл, розвіяний вітром. Дріб'язкових пашів та каїдів, які служили своїм колоніальним господарям у Франції та Іберії, більше немає — вони розсіяні й повернулися до своїх справжніх домівок у Європі, щоб ніколи більше не повернутися.\n\nНа зміну дрібним воєначальникам, іноземним бізнесменам і паразитичним аристократам тепер нацією правитимуть лише керівники Рабату. Буде створено централізовану систему губернаторів, щоб Марокко нарешті могло по-справжньому об'єднатися як єдина нація."
MOR_National_Reclamation: "Національне повернення"
MOR_National_Reclamation_desc: "Радійте! Радійте, адже споконвічна земля марокканського народу нарешті повернулася до його лона. Радійте, адже Сахара повернена, а Велике Марокко вже майже стало реальністю — залишилося здійснити лише кілька завоювань! Доля Марокко вже зовсім близько!\n\nРадійте, коли поселенці вирушають до Сахари, щоб встановити порядок на землі, яка забула своє місце у світі! Радійте, коли тих, хто не стоїть на боці марокканської нації, виганяють геть! Радійте!\n\nУ міру того як місцеве населення Сахари підкорюють і виганяють, марокканський націоналізм досягнув найвищої точки напруження, і ця лихоманка не має жодних ознак того, що ось-ось спаде."
MOR_Modern_Absolutism: "Сучасний абсолютизм"
MOR_Modern_Absolutism_desc: "Старі антиколоніальні партії зламані. Ті, хто намагався чинити опір королівському правлінню, були вбиті, зникли безвісти або втекли у вигнання. Подвійна природа марокканської політики безповоротно зруйнована, і тепер залишився лише король Хасан — єдиний правитель Марокко та його народу.\n\nПопри заклики своїх придворних повністю покінчити з масовою політикою, король Хасан не скасував парламент. У цьому немає потреби, адже тепер у ньому залишилися лише ті, хто відданий Короні. Відтепер парламент слугуватиме вірним щитом монархії, ухвалюючи від імені короля непопулярні рішення, а натомість отримуючи дозвіл красти стільки, скільки їм заманеться, в обмін на свою віддану службу."
MOR_Madrid_Hand: "Рука Мадрида"
MOR_Madrid_Hand_desc: "Після того як Хасан II перетворився на звичайну маріонетку, а парламент було розпущено, старі структури марокканської політики розсипалися під залізною хваткою Іберії.\n\nТі представники Істіклялю, які пережили репресії Мадрида, втекли в гори, прагнучи приєднатися до АВН. Навіть армія, яка катувала й винищувала незліченну кількість членів АВН, тепер заплющує очі на їхню діяльність — адже її головнокомандувач був ув'язнений іберійцями.\n\nЗ кожною ніччю все більше селян і солдатів зникають, вливаючись до лав АВН, що невпинно зростають. Чи зможе Мадрид утримати свою хватку над Марокко?"

 #Events
 MOR_IBR.1.t:0 "Атлас у кайданах"
 MOR_IBR.1.desc:0 "Звіт про ситуацію: Султанат Марокко станом на [?global.date.GetDateStringNoHourLong]\n\n1. Наразі ситуація в Султанаті Марокко залишається стабільною. Однак дедалі більше сумнівів викликає те, чи збережеться цей статус-кво надалі.\n\n2. Вкрай важливо, щоб Марокко залишалося стабільним і перебувало під нашим контролем через його стратегічне положення та багатство природних ресурсів, таких як нафта й уран. Оскільки багато родовищ досі не розробляються, цінність Марокко для Іберійського Союзу лише зростатиме.\n\n3. Ця цінність залежить від співпраці з королем Хасаном II та Королівським двором. Наразі король і двір більш-менш добровільно співпрацюють, але останнім часом їхня покірність помітно зменшилася. Той факт, що Марокко є не колонією, а протекторатом, змушує нас покладатися на марокканський уряд у здійсненні непрямого управління країною, що, своєю чергою, обмежує кількість вимог, які ми можемо їм висувати.\n\n4. Однією з причин, чому марокканський двір та уряд демонструють ознаки непокори, є поява руху за незалежність, очолюваного Хізб аль-Істікляль (Партією незалежності). Він стверджує, що економічна стагнація Союзу створює непотрібний тягар для регіону, а подальша іберійська присутність, яку вони називають просто «експлуатацією», суперечить інтересам народу Марокко. Попри хибність цих тверджень, вони набувають популярності серед марокканського цивільного населення.\n\n5. Авторитарні тенденції короля Хасана та його прагнення до реформ призвели до того, що уряд дедалі очевидніше демонструє невдоволення нашим правлінням. Джерела в Палаці повідомляють, що політична еліта втомлюється від «юридичного васалітету» перед нами. Якщо ці чутки правдиві, підтримувати стабільність стане дедалі важче; однак війна в Рифі проти ворогів короля, що триває, дає нам тимчасовий перепочинок у цьому питанні."
 MOR_IBR.1.a:0 "...але як довго ще?"

 MOR_IBR.2.t:0 "Зустріч деспотів"
 MOR_IBR.2.desc:0 "\"Отже, ваш уряд нарешті придушив повстання в Рифі після всіх цих років боротьби\", — тон Франко звучав майже байдуже, а його обличчя залишалося незворушним. Король Хасан II запросив цю зустріч, щоб обговорити з Каудільйо поточні зміни у своїй країні, і обидва лідери прагнули продемонструвати, що саме вони мають перевагу в новому статус-кво. Невеликий випад Франко не залишився непоміченим і не міг залишитися без відповіді.\n\n\"Так, марокканці знають, як зупиняти повстання. До того ж Істікляль і помірковані націоналісти погодилися на співпрацю\", — відповів Хасан.\n\nВираз обличчя Франко не змінився, і після паузи він відповів: \"Якщо Істікляль погодився на співпрацю, то це означає, що Корона погодилася поступитися їхнім вимогам щодо більш конституційної системи\".\n\n\"Хоча офіційно Марокко переходить до напівконституційної моделі, насправді я збережу всі свої нинішні повноваження\", — у голосі Хасана виразно звучала впевненість, і йому здалося, що він помітив, як щось промайнуло на обличчі Франко. У кімнаті запала тиша, яку Каудільйо, здавалося, не поспішав порушувати, аж поки зрештою Франко не перервав мовчання."
 MOR_IBR.2.a:0 "\"Тоді побачимо, як довго триватиме ця співпраця.\""

 MOR_IBR.3.t:0 "ЗВІТ: АРМІЯ НАЦІОНАЛЬНОГО ВИЗВОЛЕННЯ"
 MOR_IBR.3.desc:0 "ЦІЛКОМ ТАЄМНО — ЛИШЕ ДЛЯ УПОВНОВАЖЕНИХ ОСІБ\n\nДІЯЛЬНІСТЬ ПОВСТАНСЬКИХ СИЛ:\nРАБАТ:\n\nПопри те, що уряду короля Хасана вдалося придушити повстання в Рифі, партизанські сили, які виступають за незалежність, продовжують чинити опір по всьому Марокко. Протягом останніх тижнів різні групи прихильників незалежності об'єдналися під єдиним прапором: Армією національного визволення. Також підтверджено повідомлення про те, що ця новостворена організація встановила зв'язки з союзними силами в сусідньому Алжирі.\n\nАрмія національного визволення залишається відносно незначною силою порівняно з легальними рухами за незалежність та Короною, однак вона продовжує зростати майже експоненційними темпами. Найімовірніше, це розширення триватиме доти, доки не буде знайдено рішення щодо статусу марокканського протекторату.\n\nСпівпрацю з марокканськими силами безпеки вже розпочато з метою стримування ситуації."
 MOR_IBR.3.a:0 "Подальші оновлення будуть надані в міру розвитку ситуації."

 MOR_IBR.4.t:0 "Доля Марокко"
 MOR_IBR.4.desc:0 "Король Хасан II знову сидів навпроти Франко в кабінеті Каудільйо. Франко саме переглядав розвідувальні звіти щодо ситуації в Марокко. Хасан припустив, що вони відповідають тому, про що доповідав його власний уряд.\n\nЗрештою Франко відклав папери й порушив мовчання: \"Отже, ви прибули з проханням покласти край статусу протекторату Марокко\".\n\n\"Так, статус протекторату більше не є сталим. Я вважаю, що в наших спільних інтересах переглянути відносини між Марокко та Іберією, а головне — надати Марокко повну незалежність\", — заявив Хасан. Якщо Франко погодився на цю зустріч, Хасан був майже впевнений, що той погодиться надати Марокко незалежність. Будь-який інший результат неодмінно завершився б катастрофою.\n\nФранко мовчав. Хасан продовжив: \"Звісно, Марокко залишатиметься близьким до Іберії у дипломатичних та економічних питаннях, але націоналісти в моєму уряді не підуть на компроміс щодо колонії в Західній Сахарі. Для них це червона лінія, яку вони відмовляються переступати, і вони не погодяться на жодну угоду, яка нехтуватиме цим питанням\".\n\nФранко мовчав болісно довго, хоча насправді минуло, мабуть, лише кілька секунд. Від результату цієї зустрічі залежала стабільність обох їхніх держав, а Хасан не міг прочитати вираз обличчя Каудільйо. Нарешті Франко відповів:"
 MOR_IBR.4.a:0 ""Ми можемо прийняти ці умови.""
 MOR_IBR.4.b:0 ""Якщо вони настільки вперті, нехай забудуть про незалежність.""

 MOR_IBR.5.t:0 "ЗВІТ: НЕЗАЛЕЖНІСТЬ МАРОККО"
 MOR_IBR.5.desc:0 "ЦІЛКОМ ТАЄМНО — ЛИШЕ ДЛЯ УПОВНОВАЖЕНИХ ОСІБ\n\nПОЛІТИЧНА СИТУАЦІЯ В МАРОККО:\nРАБАТ:\n\nПісля того як було прийнято вимоги марокканського уряду щодо незалежності, статус протекторату Марокко припинив своє існування. Крім того, усі іберійські колонії в Магрибі, за винятком портів Сеута та Мелілья, були передані під контроль Марокко. Політична ситуація в обох портових містах залишається стабільною.\n\nОчікується, що після здобуття незалежності політичний вплив монархії стане ще більш домінуючим. Ми вже отримали повідомлення про те, що король Хасан II намагався використати свої повноваження для протидії обраному уряду. Спостереження за політичною ситуацією триватиме, щоб майбутні події не поставили під загрозу інтереси Іберії.\n\nНарешті, очікується, що економічне панування Іберії над Марокко продовжиться й після формального здобуття незалежності. Багато марокканських активів і ресурсів належать іберійським бізнесменам та корпораціям, і ми підтвердили, що уряд короля Хасана не має наміру проводити націоналізацію. Як зазначалося вище, ситуація й надалі перебуватиме під наглядом, щоб забезпечити сприятливі для іберійських інтересів умови в Марокко."
 MOR_IBR.5.a:0 "Висновок: незалежність Марокко не зашкодить інтересам Іберії в регіоні."

MOR_IBR.6.t:0 "Віджгат Назар"
MOR_IBR.6.desc:0 "Купець у Танжері нервово погладжує підборіддя. Після об'єднання Марокко із Західною Сахарою його батьківщина стала ще більшою. Звісно, це була подія, яку слід було святкувати; його батьківщина нарешті могла вільно дихати, звільнившись від іспанського ярма й об'єднавшись зі своїми південними братами. І все ж, що буде з іспанським туризмом, від якого він так залежав? Чи переживе його бізнес наступні роки?\n\nПрикрашений нагородами офіцер Королівської армії усміхається від захвату. Хасан II, наділений божественним інтелектом та інтуїцією, здобув незалежність для своєї нації, не заплямувавши свої руки методами терору, до яких вдалася АВН. Така суверенна політика могла віщувати лише добрі перспективи для майбутніх випробувань. Які ж іще величні звершення чекають на марокканський народ під таким далекоглядним керівництвом?\n\nМарракеський інтелектуал, обізнаний із вченнями Маркса та Барки, радіє, дивлячись, як іберійці залишають його батьківщину. І все ж монархія залишається — маріонетковий режим у всьому, крім назви, поневолений примхами Мадрида. Заклик революції безперервно лунав у його свідомості. Пером чи кров'ю — визволення вже наближалося. Чи буде він готовий?\n\nГрупа селян примружує очі, дивлячись на обрій, і помічає колону солдатів, що прямує до їхнього села. Незнайомці швидко встромляють свої лопати й екскаватори в землю, ретельно вимірюючи кожен акр сільськогосподарських угідь та вкритої пилом вулиці. \"Заходи з урбанізації\", — кажуть вони сільським старійшинам. Незабаром із бетону та мішків із піском постає військовий гарнізон. Для селян мир стане лише далеким спогадом."
MOR_IBR.6.a:0 "Невже це свобода?"

MOR_IBR.7.t:0 "Міраж"
MOR_IBR.7.desc:0 "Сліпуче світло залило кімнату, коли двері камери відчинилися, змусивши Джубайра примружитися. Він інстинктивно смикнувся, намагаючись звільнитися від мотузок, якими його прив'язали до стільця. Зі світла виринули дві постаті в охайній формі, з кийками на поясах. На рукаві одного з офіцерів він ледве розгледів відзнаку: «DST». Залізні двері з гуркотом зачинилися, повернувши кімнату до її туманного напівмороку; єдиним джерелом слабкого світла було завішене вікно ліворуч від нього, за яким виднілися іржаві залізні ґрати, вмуровані в грубі вапнякові стіни.\n\nОдин з офіцерів притягнув стілець із сусіднього кутка, поставив його перед Джубайром і сам сів. У тиші, що настала після цього, Джубайр відчув пульсуючий біль у нижній губі й тихо застогнав. Це був наслідок попереднього побиття, хоча не цього чоловіка. Були й інші. Дуже багато інших.\n\n«Отже», — пробурмотів офіцер. — «Ми поговорили з твоїми товаришами по роботі, і вони вже зізналися в порушенні трудової дисципліни». Джубайр скривився. Безглуздий термін для профспілкової організації. «Не сумнівайся, з твоїми товаришами вже розібралися. Письмові зізнання, заяви про вину — ми отримали від них усе, що нам потрібно». Він замовк, почухав ліву щоку. «Залишився лише ти, мій упертий маленький друже».\n\nГуба Джубайра мимоволі затремтіла. Він відчував, як біль проникає аж до кісток. «Нам обіцяли свободу. Іберійці, вони...» Він замовк, шморгнувши носом. «Вони підуть, а ми отримаємо землю. Наші умови покращаться. Нам підвищать платню. Але нічого з цього не сталося».\n\nОфіцер тихо кивнув. «Гадаю, що так», — відповів він. Підвівшись зі стільця, він кивнув іншому офіцеру, який відчинив двері камери. Вони обмінялися нерозбірливими словами, але Джубайр не міг зрозуміти жодного з них. Він ледве розумів, чому взагалі опинився тут, наодинці зі своїм болем. Де свобода й добробут, які їм обіцяли?"
MOR_IBR.7.a:0 "Страждання, а потім тиша."

MOR_IBR.8.t:0 "Перевищення меж"
MOR_IBR.8.desc:0 "Особняк Генерального резидента був набагато більшим, ніж потрібно. Його штучне озеро блищало, мов обсидіан, коли один з іберійських офіцерів відійшов від величезного балкона й повернувся до бездоганно білих стін, уздовж яких стояли ряди тьмяних оливкових мундирів.\n\nПідійшовши до Генерального резидента, офіцер відчув, як підбори його чобіт глухо вдаряють об тераццо. Як віцекороль Марокко, він відповідав за його лояльність. «Він... маневрує», — пробурмотів Генеральний резидент. — «Пересуває людей — насправді випробовує межі своєї влади». Він кашлянув. «Це... недобре».\n\nІберійський офіцер сів поруч із Генеральним резидентом. Судячи з того, що він почув, справа, мабуть, стосувалася незалежності. Як же це дратувало. Його держава дала маріонетковому королю все, чого той коли-небудь бажав, а він вирішив поводитися як неслухняна дитина. «Що ви пропонуєте?»\n\nНаче за сигналом, усі інші іберійці в кімнаті повернулися до Генерального резидента.\n\n«Перш ніж ми зможемо щось зробити, марокканська армія... вона лояльна. Король подбав про це». Ще один кашель — сухий, вимушений. «Ну, безперечно... існує проблема перевищення меж. Але найефективнішим способом вирішити її було б розпустити армію та замінити її нашими силами».\n\nПеревищення меж. Це завжди було проблемою Іберії. Дехто навіть казав, що контроль над Португалією — це «перевищення меж» (не кажучи вже про збереження їхньої об'єднаної африканської території). Але хіба не в природі будь-якої великої держави розширювати межі свого впливу? Ці боягузи вздовж узбережжя та одне непокірне королівство були ніщо порівняно з чвертю світу, яку колись контролювали обидві половини Іберії."
MOR_IBR.8.a:0 "\"Королю треба підрізати крила.\""

MOR_IBR.9.t:0 "Маріонетки"
MOR_IBR.9.desc:0 "Сержант Гарсія сидів на білому патіо-стільці — одному з небагатьох, що досі залишилися стояти посеред вулиці. Небо над Танжером сяяло тьмяним помаранчевим, а неподалік через площу будівля палала, вийшовши з-під контролю. Ніхто не приходив її гасити, і, крім потріскування вогню, навколо не було жодного звуку. Те, що колись вирувало від місцевих жителів і туристів, тепер було мертвим; далекі звуки сирен і поодинокі постріли тонули в порожнечі. Гарсія сидів, досі стискаючи напоготові гвинтівку, і стримував стомлений схлип.\n\nДо цього він служив на блокпості, встановленому в рамках боротьби проти АВН, аж поки кілька годин тому все місто не вибухнуло оргією насильства. На блокпості чергувало кілька десятків чоловіків, половина втекла на вулиці, намагаючись дістатися околиць, а їхнім останнім наказом по радіо був відступ до узбережжя. Залишився лише він, і його гвинтівка — єдине, що лишилося від його поста після того, як він скинув форму й перевдягнувся в цивільне.\n\nПідлога біля його ніг була забарвлена темно-червоним, а навколо вітрини магазину, усіяної гільзами, лежали тіла, мов зламані маріонетки. Очевидно, це було кафе, переповнене туристами. Судячи з їхнього вигляду, більшість ледве встигла відреагувати. Їхні тіла неприродно скрутилися на столах, стільцях і підлозі, а на обличчях застигли шок і страх останніх миттєвостей життя. Чоловіки, жінки й діти — усі нерухомі, їхні тьмяні очі дивилися в небуття. Гарсія намагався не дивитися на них надто довго, але його ніс видав його — сморід смерті став нестерпним. Усередині магазину було чорно, мов смола, і це лякало його.\n\nПісля короткого відпочинку він знову сів рівно й налякано почав оглядати будівлі на площі, шукаючи будь-який рух. Боєприпасів залишалося мало, радіо не було, і ніхто не знав, де він. Він був сам, а його серце калатало, поки він напружував слух, намагаючись вловити будь-який підозрілий звук.\n\nВін підвівся й обережно рушив далі. Він не хотів тут помирати. Він думав про свою дружину Емілі, про свого сина Франко. Він думав про узбережжя й про них — мусив існувати якийсь вихід. Він не хотів помирати."
MOR_IBR.9.a:0 "Історія з невідомим кінцем; кожна перемога — трагедія."

MOR_IBR.10.t:0 "Цирковий лев"
MOR_IBR.10.desc:0 "Бути королем, стояти над простим народом, а потім опинитися під чоботом плебея — це, треба визнати, неабияке приниження. Хасан II тепер надто добре знайомий із цим відчуттям. Він дивиться у вікно, розмірковуючи над сценою біля свого палацу, де марокканському гвардійцю іберійські командос швидко наказують забратися геть. Саме ці люди вже кілька годин ходять за ним усюди, куди б він не пішов на території комплексу.\n\nСеляни, нікчеми — всі до одного. Як вони могли так із ним вчинити? Співвідношення сил між Іберією та його королівством не було для нього сюрпризом, але іберійці ніколи раніше не наважувалися фактично взяти його в полон у його власних володіннях і одним помахом руки відправити геть його власних людей. Йому залишалося лише стискати зуби й чемно усміхатися своїм викрадачам, поки в грудях закипав гнів, дедалі ближчий до того, щоб вихлюпнутися назовні й поставити цих брудних псів на місце. Принаймні саме так він уявляв — чи, можливо, навіть молився — що вчинить.\n\nПоки що він мовчки кипів від люті, спостерігаючи за своїми викрадачами, які пересувалися територією комплексу."
MOR_IBR.10.a:0 "...А в того хлопця капелюх задом наперед."

MOR_IBR.11.t:0 "Ворог мого ворога"
MOR_IBR.11.desc:0 "Ще рік тому, якби хтось запитав Білала, чи може він уявити себе віч-на-віч із офіцером-роялістом і при цьому не виколоти тому очі, він би розсміявся співрозмовнику просто в обличчя, а можливо, ще й кинув би зневажливе зауваження щодо його психічного стану, коли той виходив би з будівлі. Приблизно одинадцять місяців потому він і справді опинився там, кидаючи на пихатого чоловіка у військовій формі погляд, здатний по-справжньому вбити.\n\nЧоловік не звернув уваги на його ворожість. Коли його схопили після рейду на місцеве ополчення, він очікував смерті. А тепер добре вдягнений слуга наливав йому чай, поки військовий прочищав горло. «Добрий вечір, друже. Перепрошую за спосіб, у який ми змусили вас приєднатися до нас — інакше ми не могли бути впевнені, що ви погодитеся на співпрацю». Білал фиркнув. Це ще м'яко сказано. «Ми знаємо про ваші минулі... зустрічі з силами Його Величності, але готові відкласти ці розбіжності заради вищої мети. Працюйте з нами».\n\nБілал би вдавився чаєм, якби встиг його випити. Сама зухвалість цієї пропозиції могла його вбити. «Це жарт? Чому, в біса, я маю вам допомагати?! Або цьому тирану, зрештою? Ще рік тому ваші люди катували моїх товаришів!»\n\n«Усе просто. Розглядайте це не стільки як союз, скільки як збіг наших цілей. Це європейці». Білал стиснув кулаки. Він мав рацію: якщо й була група людей, яких Білал не міг терпіти, то це колонізатори. «Вони мають піти, і тут ми обоє згодні. Їхні напади на суверенітет Його Величності неприпустимі. Багато ваших товаришів по АВН уже погодилися. А коли наших об'єднаних сил стане достатньо, ми зможемо завдати удару й вигнати їх. Якщо ти та твої товариші співпрацюватимете, звісно». Чоловік уже збирався підвестися, але рука Білала блискавично метнулася вперед, змусивши його залишитися на місці.\n\n«Перш ніж ви підете, дозвольте мені дещо чітко пояснити. Мене не хвилює, що ви чули від моїх друзів чи моїх союзників. Якщо — і саме якщо — ми укладемо союз, хай навіть ненадовго, то в ту ж мить, коли європейці підуть, ми знову станемо ворогами. Я зрозуміло висловився?» У очах чоловіка промайнуло щось суворе й холодне, перш ніж він кивнув."
MOR_IBR.11.a:0 ""Звичайно.""

MOR_IBR.12.t:0 "Після нас — хоч потоп"
MOR_IBR.12.desc:0 "ЦІЛКОМ ТАЄМНО\nТЕРМІНОВЕ ПОВІДОМЛЕННЯ ДО СТАНЦІЇ ГІБРАЛТАРУ\n\nІБЕРІЙСЬКА ПІВНІЧНА АФРИКА ВТРАЧЕНА. МАРОККО ЗАХОПЛЕНО. КОНТРОЛЬ ЗБЕРІГАЄТЬСЯ ЛИШЕ В:\n\nРИФІ\n\nІФНІ\n\nЗАХІДНІЙ САХАРІ\n\nБІЙЦІ «АРМІЇ НАЦІОНАЛЬНОГО ВИЗВОЛЕННЯ» КОНТРОЛЮЮТЬ УСЕ ІНШЕ. СХОЖЕ, ЩО ВОНИ Є МАРОККАНСЬКИМИ НАЦІОНАЛІСТАМИ. АКТИВИ ЗА МЕЖАМИ ЗАЗНАЧЕНИХ РЕГІОНІВ ВВАЖАТИ ВТРАЧЕНИМИ. ОФІЦІЙНИХ ПОВІДОМЛЕНЬ НЕ ОТРИМАНО. НАДХОДЯТЬ ЗВІТИ ПРО НАСИЛЬСТВО ПРОТИ ІНОЗЕМНИХ ГРОМАДЯН ПО ВСЬОМУ РЕГІОНУ. ІБЕРІЙЦІ СТАЛИ ЦІЛЛЮ. ЗАХОДИ З ЕВАКУАЦІЇ ВЖИТО. СУТИЧКИ З БІЙЦЯМИ АВН ВІДБУВАЮТЬСЯ ЧАСТО Й ЗАГРОЖУЮТЬ ЗГУРТОВАНОСТІ СИЛ, ЩО ЗАЛИШИЛИСЯ.\n\nОЦІНКА: УМОВИ, ПІДКОНТРОЛЬНІ ФНВ, НЕМОЖЛИВО УТИХОМИРИТИ БЕЗ ВЕЛИЧЕЗНИХ/ТРИВАЛИХ ЗОБОВ'ЯЗАНЬ. ІФНІ ТА РИФ ЗБЕРІГАЮТЬ ОБОРОНОЗДАТНІСТЬ. ЗБЕРЕЖЕННЯ ІБЕРІЙСЬКОЇ ВЛАДИ — НАЙВИЩИЙ ПРІОРИТЕТ."
MOR_IBR.12.a:0 "Папка була набита панічними повідомленнями; усі вони говорили про одне й те саме."

MOR_IBR.13.t:0 "Брами Іфні"
MOR_IBR.13.desc:0 "Ар'є Амар дивився в телескоп на місто перед собою. Воно було нерухомим, і лише деякі ознаки життя видавали, що там хтось є. Не було видно ні машин, ні людей. Мертве місто — лише жменька птахів зловісно кружляла над його трупом. Він опустив телескоп і зітхнув. Час настав.\n\nВін опустив телескоп і повернувся до свого намету та чоловіків, які чекали на нього. Вони були вдягнені найрізноманітніше: деякі носили парадну офіцерську форму, інші — майже звичайний цивільний одяг із пов'язками на рукавах. Проте всі стояли перед ним у напруженому очікуванні, мов кам'яні стовпи під палючим сонцем.\n\n«Панове, — почав Амар, — сьогодні розпочинається визволення Іфні. Це кульмінація всіх наших кампаній, проведених до цього, — об'єднання народу проти іберійців». Він підняв палець, вказуючи на чоловіків. «Народ покладається на вас у тому, що ви виженете наших гнобителів із їхньої південної фортеці. А ви?» Він повернув палець на себе. «Ви покладатиметеся на мене, і я обіцяю вам, що незабаром ми стоятимемо в її порту».\n\nЧоловіки одностайно відповіли гучним: «Так, сер!», — а на їхніх обличчях застигла маска рішучості. Між ними танцювало передчуття, але Амар також бачив тривогу. Страх. Дорога сюди була залита кров'ю. Дорога попереду буде ще кривавішою. Можливо, його офіцери думали про те, скільки їхніх братів доведеться віддати заради визволення — питання, про яке він сам розмірковував, коли всі відверталися.\n\nВін відкинув ці думки; зараз був не час. Зараз його людям був потрібен їхній командир. «Повертайтеся до своїх підрозділів, запам'ятайте свої завдання й чекайте сигналу. Сьогодні Іфні нарешті пізнає свободу»."
MOR_IBR.13.a:0 "Коли вони пішли, він пошепки прочитав молитву — молитву за мертвих."

MOR_IBR.14.t:0 "Перепочинок"
MOR_IBR.14.desc:0 "Камери спалахували, коли двоє чоловіків поставили свої підписи під документом, і на жодному з їхніх облич не було й натяку на емоції. Причини були різні: дипломатія та компроміс, але це були лише дві з безлічі думок, що вирували в їхніх головах. Та найбільше їх об'єднувало виснаження.\n\nЖоден із них не спав уже кілька днів.\n\nГенерал Сантьяго Рей люто утримував Іфні. Використовуючи всі доступні засоби, він тримав лінію. Заборона доступу до районів, засідки, укріплені позиції та удача дозволили втримати тонку, але незламну оборону. Він майже не залишав поля бою, а часом був змушений битися пліч-о-пліч зі своїми людьми, коли ворог майже проривав їхні позиції. Радіостанції виходили з ладу, зброя несправно працювала, цілі міські квартали перетворювалися на руїни, але попри все, що ламалося, він і його люди — ніколи. Іфні стояло.\n\nПоруч із ним стояв командир АВН, набагато ближче, ніж вони могли уявити ще кілька днів тому. Командир Ар'є Амар поставив іберійців на межу краху. Численні іберійські контратаки завершувалися їдким димом і запахом смерті. Приховані склади та сховища перетворювалися на пил і попіл. Там, де їхня лінія була найслабшою, Амар тиснув і тиснув щосили. Він радів кожному успіху й оплакував кожну невдачу — понівечені тіла патріотів, що вкривали місто, яке він прагнув визволити, постійно стояли перед його очима.\n\nВони ненавиділи одне одного. Уявлення про честь і повагу між суперниками згасли серед закривавлених останків надто багатьох людей. Але в цю мить їхня ненависть відступила. Це перемир'я поклало край бойні, і хоча Амар суворо дивився на похмуро усміхнених іберійців крізь втому, провал визвольної боротьби хоча б на мить відійшов на другий план.\n\nЙого люди отримали перепочинок від різанини. Вони зробили достатньо, а якщо ціною цього стало залишити Іберії зруйноване місто — нехай буде так."
MOR_IBR.14.a:0 "По всій Іберії історія про Диво Іфні лунала, мов барабан, що віщував кінець принижень."

MOR_IBR.15.t:0 "Сміття на набережній"
MOR_IBR.15.desc:0 "Залишки останнього човна, що вирушив із порту, гойдалися туди-сюди біля причалу на самій лінії води, а лавина уламків ритмічно вдарялася об корпус із глухим стукотом. Купа металу й мастила майже не встигла рушити, перш ніж у неї влучила ракета. Вибух був швидким, на щастя, і останній корабель зник у спалаху. Залишитися мали лише генерал Рей та кілька добровольців, готових прийняти останній бій. Натомість те, що залишилося від його штабу, навалене на той викрадений човен, глухо гупало під ним.\n\nНа причалі було безліч бійців АВН, наче вся армія зійшлася до єдиного порту Іфні. Можливо, так і було. Люди генерала Рея щойно здалися — за що ще було битися? Позбавлені навіть можливості врятувати своїх побратимів, вони відчували гіркоту поразки, що пекла в роті, мов сіль. Бійці АВН снували навколо, сміялися між собою, але явно не знали, що робити. Можливо, вони не очікували такої покірної капітуляції? Можливо, вони думали, що генерал давно втік? Жоден із полонених, що сиділи на причалі, не запитував.\n\nЗрештою прибули автомобіль і фургон, із яких вийшли чоловіки в офіцерській формі та знімальна група. Невеликі камери супроводжували офіцерів, коли ті спускалися до причалу, знімаючи солдатів, які радісно вітали їх, поки офіцери підбурювали їх вигуками похвали. Відчувши, що настав час, генерал Рей підвівся.\n\n«Мене звати генерал Сантьяго Рей, командувач авангарду Іфні. Я здаю місто». Він говорив голосно, збираючи всю силу духу, щоб зберегти бодай якусь гідність, і перервавши веселі привітання офіцерів та солдатів. Багато хто роздратовано поглянув на полонених, і чари маленького святкування перемоги розвіялися. Камери продовжували знімати, коли один з офіцерів вийшов із натовпу АВН, звільняючи простір між полоненими та їхніми новими наглядачами. Він був високим, із грубими рисами обличчя, які аж ніяк не пасували до його нової форми.\n\n«Ми приймаємо вашу капітуляцію, генерале, і маємо сказати: ми очікували від вас, іберійців, більшого»."
MOR_IBR.15.a:0 ""Ми теж", — гірко подумав Сантьяго."

MOR_IBR.16.t:0 "Перлина"
MOR_IBR.16.desc:0 "На всіх радіочастотах звучить одна й та сама новина. Попри спроби применшити її значення в новинах, з вуст кожного іберійця лунає одна й та сама історія. За лічені години вона поширилася, мов лісова пожежа: перед нацією постала найбільша загроза — АВН рушила на Сеуту та Мелілью. По всьому Рифу орди повстають, щоб вигнати Іберію. У шепоті друзів і вигуках на площах звучать подив та обурення. Як це сталося? Чому це сталося? Де сила Іберії?\n\nУ найвищих владних залах мало хто не чує цих запитань. Карти вивчають одну за одною, а логістичні плани гарячково перевіряють. Розробляються плани й проводяться лінії. Начальники портів по всьому Півдню дивляться на великі кораблі, що чекають на вантаж — боєприпаси чи людей, — аби їх використали для відкидання АВН назад у пустелю. Зрештою, це більше, ніж колоніальне повстання. Це більше, ніж втрата васала. Сама Іберія опинилася під загрозою, а Пласа-де-Соберанія жадано очікуються, мов злодій жадає скарбу. Сама думка про їхню втрату є святотатством — мало хто здатен уявити це чимось більшим за заклик до мобілізації. Іберія не стоятиме осторонь, поки варвари вторгаються на її даровану Богом землю.\n\nПроте є й ті, кого не полишає гіркий присмак того, що інші називають поразницькими настроями. Попри стереотипи про племінних варварів, вони не можуть не бачити, що АВН перетворилася на напрочуд ефективну бойову силу. Ба більше, вони побоюються, що реакція Іберії залишається надто повільною — чи все необхідне вже розгорнуто? Чи справді вони готові до того, що насувається?\n\nЦі питання переслідують їх ночами, коли незліченні натовпи обрушуються на іберійські сили в Рифі. Стримати їх — життєво необхідно. Втратити частину самої Іберії?\n\nНемислимо."
MOR_IBR.16.a:0 "Сонце заходить над іберійським Рифом, і мало хто знає, чи побачить він його схід знову."

MOR_IBR.17.t:0 "Умиротворення"
MOR_IBR.17.desc:0 "Село палало рівними рядами, кожен солом'яний дах методично обвалювався сам на себе. Капітан Едуардо Варга поправив сонцезахисні окуляри, захищаючись від яскравого післяобіднього сонця, і спостерігав, як його регуляри тягнуть тіла до щойно викопаної ями. У повітрі висів запах бензину та обгорілої плоті, настільки густий, що його, здавалося, можна було відчути на смак. Позаду нього рація в командирському джипі ожила, передаючи чітке повідомлення з Мелільї: «Сили АВН знищено поблизу Таргіста. Операції з прочісування території дозволено».\n\nЛейтенант Сото різко видихнув через ніс, постукуючи пальцями по прикладу гвинтівки. «Кажуть, це було село постачання», — пробурмотів він тим м'яким, несхвальним тоном, яким розмовляв ще від Тетуана. Варга навіть не став відповідати. Кам'яні будинки потріскували й шипіли, коли полум'я проникало крізь дверні отвори, знаходячи сховані мішки із зерном, глечики з оливковою олією та час від часу заховану гвинтівку.\n\n«Ти». Варга вказав на старого, якого його люди витягли з оливкового гаю. Його руки були зв'язані дротом, а обличчя вкрите сажею та кров'ю. Перекладач, молодий рядовий із Сеути, виступив уперед. «Скажи йому, щоб назвав колабораціоністів». Рядовий ковтнув і заговорив швидкою арабською. Очі старого заметалися — спершу до палаючих будинків, потім до солдатів, які стояли навколо нього півколом. Тоді він плюнув, і слина впала до ніг рядового.\n\nСержант ступив уперед, уже діставши пістолет. Варга підняв руку. «Ще ні». Він повернувся до Сото."
MOR_IBR.17.a:0 "\"Спаліть також сади. І підготуй телеграму до Мелільї — Район зачищено. Переходимо до наступного сектора.\""

MOR_IBR.18.t:0 "Останній захід сонця"
MOR_IBR.18.desc:0 "Середземноморський вітер ніс гіркуватий запах порохового диму, коли іберійський прапор востаннє спускали з фортеці Мелільї. Капрал Луїс поправив шолом, спостерігаючи з даху, як бійці АВН у різномастійній формі розосереджуються по площі внизу. Їхні переможні вигуки арабською та ламаною французькою змішувалися з тихою іспанською мовою гарнізону, що відступав.\n\n«Усе скінчено», — пробурмотів він, загасивши сигарету об бетон. На світанку радіо передало наказ: негайно відступити. Не провокувати бойових дій. Мадрид і Лісабон списали їх. Чотириста років імперії стерто.\n\nНа площі внизу хлопчик копнув уламки дорожнього знака, тоді як бійці АВН керували рухом різкими, незнайомими наказами. Офіцер АВН видерся на покинуту вантажівку, тримаючи в руці мегафон. «Народе Мелільї! — оголосив він. — Іберійський імперіалізм закінчується сьогодні!» Натовп вибухнув вигуками. Пляшка пролетіла повітрям і розбилася об стару митницю. Полум'я почало лизати кам'яний фасад, де все ще залишався іберійський герб.\n\nЛуїс згадав розповіді свого діда — Рифську війну, гордість від володіння Африкою. Тепер історія замкнула коло. Він поглянув у бік гавані, де в сутінках чекав останній транспортний корабель, його ходові вогні світилися вдалині.\n\n«Виходимо!» — гаркнув їхній лейтенант. Принаймні навчання нарешті стало в пригоді. Спускаючись сходами, Луїс почув чергу святкових пострілів. Десь радіо грало стару музику, яку заглушували дедалі гучніші вигуки: «Maroc libre!» Капрал востаннє поглянув на марокканський прапор, що натягнувся на вітрі над площею. Потім повернувся до моря, до пляжу й подумав."
MOR_IBR.18.a:0 "Що його син уже ніколи не назве цей берег своїм так, як міг він."

MOR_IBR.19.t:0 "Спиною до стіни"
MOR_IBR.19.desc:0 "Іберія зазнала приниження, а потім катастрофи, опинившись загнаною до останнього клаптика своїх північноафриканських територій. Марокканські метрополії та середземноморське узбережжя, якими іберійці так пишалися, втрачені. Залишилися лише пісок, скелі та останнє приниження.\n\nСили АВН регулярно переходять лінію зіткнення, а нові прихильні до них сахарські ополчення з'являються майже щодня. Іноді іберійські війська, із запалими очима та мовчазні, знищують їх. Тремтячі руки прочісують села, вирізані зі страху. В інших випадках ополченці зникають у пустелі, породжуючи нові кошмари для змучених солдатів гарнізону. Під час патрулювання та на базах примара цих женців нависає над усіма.\n\nОбидві сторони знають, що фінальне зіткнення за Магриб незабаром відбудеться, а іберійські офіцери, що схиляються над картами та списками постачання, бачать перед собою танцюючу катастрофу. Коли наступ АВН починається, заклик до Мадрида звучить чітко: терміново потрібна підтримка, інакше Іберія втратить свою північноафриканську перлину."
MOR_IBR.19.a:0 "Барабани, барабани в пустелі."

MOR_IBR.20.t:0 "Велика битва за Магриб"
MOR_IBR.20.desc:0 "Всупереч усім оцінкам ситуації на полі бою, як АВН, так і похмурого верховного командування, іберійські сили в Північній Африці успішно відкинули повстанців із Магрибу та втримали оборону попри величезну перевагу противника. Це стало приголомшливим відновленням сил і драматичним переломом у ході кампанії — але, на жаль, шкоди вже завдано. Хоча Іберія зберегла контроль над Західною Сахарою, саме Марокко втрачено. Поки точилися бої в Магрибі, АВН закріпила контроль над північним заходом, зробивши будь-яку потенційну контратаку практично неможливою.\n\nНавіть якби Іберія мала столицю, військову підтримку та суспільну згоду для повторного вторгнення в Марокко і досягла успіху в поваленні тимчасового уряду АВН, її сили все одно зіткнулися б із неминучою кампанією терору, за якою послідувала б надто масштабна для придушення контрпартизанська війна.\n\nНаскільки гіркою не була б ця пігулка, особливо з огляду на героїчну оборону в Магрибі, іберійське колоніальне правління в Марокко, можливо, добігає кінця. Будь-яку надію на відновлення бодай видимості контролю над регіоном доведеться покласти на цивільний уряд у співпраці зі спецслужбами, заручившись підтримкою прихильних до Іберії сил у Марракеші для довгострокової операції зі скидання АВН на користь режиму, дружнього до Мадрида.\n\nВ іншому разі Іберії та солдатам на місцях залишається небагато варіантів, окрім як поспішно відступити до континентальної Європи й зализувати свої рани."
MOR_IBR.20.a:0 "Гірка поразка навіть посеред доблесної перемоги — кепський стан справ."

MOR_IBR.21.t:0 "Кінець"
MOR_IBR.21.desc:0 "Генерал Ортіс сидів на палубі крейсера, його форма все ще була вкрита брудом. Він мовчав, цілковито, і ніхто не наважувався потурбувати ні його, ні інших, хто був поруч. По всій палубі так само сиділи або стояли чоловіки, приголомшені й нерухомі. Деякі мали ледь оброблені рани, але відганяли санітарів, які намагалися до них підійти. Інші стискали зброю, відмовляючись виходити з бойової готовності, хіба що поруч зі своїми побратимами. Вони мовчали — відтоді, як кілька годин тому поспіхом піднялися на борт останнього корабля, що залишив Африку.\n\nСонце палило, а навколо не було нічого, крім синього океану. Ті, хто взагалі звертав на це увагу, просто дивилися в горизонт. До цього натовпу нерішуче підійшов офіцер, його випрасувана форма різко контрастувала з тілами навколо. «Генерале Ортіс?» — голосно запитав він, удаючи впевненість. «Вас викликають до рації. Наказ Каудильйо».\n\nНе виказавши жодного розуміння, він просто підвівся й пішов за офіцером. Його очі бачили лише минуле, коли він, похитуючись, зайшов усередину корабля. Немов уві сні, він підійшов до рації, з якої почув знайомий голос Каудильйо.\n\n«Генерале Ортіс, мене повідомили про абсолютно катастрофічний характер нашого відступу. Ми втратили Африку, хто знає, скількох наших синів ми втратили, а ти опинився на евакуаційному кораблі. Ти—»\n\nГенерал Ортіс простягнув руку й вимкнув рацію, викликавши здивований вигук оператора та присутніх офіцерів. Він подивився на них, крізь них, а потім повернувся на палубу. Він пройшов через корабель, і ніхто не наважився його зупинити, доки він не повернувся на своє місце на палубі. Його люди не звернули на нього уваги, але їм це було й не потрібно.\n\nВін сидів на палубі крейсера."
MOR_IBR.21.a:0 "Його форма все ще була вкрита брудом."

MOR_IBR.22.t:0 "Розмова в їдальні"
MOR_IBR.22.desc:0 "Вентилятори, що звисали зі стелі, насилу ганяли повітря над численними столами їдальні, але мало хто з чоловіків звертав на це увагу, пожираючи свої обіди, мов голодні вовки, та обмінюючись плітками під час короткого перепочинку від служби. Чутки множилися, мов грибок, і вони поступово піднімали настрій.\n\n«Я чув це від сержанта, він почув від одного з офіцерів. АВН останнім часом дуже притихла. Хлопці з розвідки вже серйозно думають, що ми перемогли!» — схвильовано сказав один із солдатів, один із багатьох, хто обговорював те саме за столом. Інші чудово його розуміли.\n\n«Патрулювання стало легшим... Я думав, це тільки мені так здається. Наш останній загиблий — хто? Хав'єр, який підірвався на тій кухонній бомбі тиждень тому?» — відповів інший, стишуючи голос.\n\nІнший солдат долучився: «Так, але подумай. Ще кілька місяців тому здавалося, що щотижня гине по кілька людей. Може, офіцери мають рацію. Та й серйозного зіткнення в нас давно не було. Заради Бога, передовий пост на пагорбі 16 отримував найбільше. Я був у складі конвою постачання до нього — справжня бійня. А тепер чув, що вони втрачають більше людей від теплових ударів, ніж від куль». Кілька чоловіків кивнули, згадуючи.\n\n«Гадаю, скоро ми поїдемо додому, передамо цю кляту діру місцевій поліції та силам безпеки. Якісь місцеві психи все одно ніколи не перестануть час від часу кидати в нас бомби — така вже їхня натура. Принаймні краще, щоб під удар потрапляв місцевий поліцейський, якому є що захищати, а не ми».\n\n«Не хочу псувати настрій, хлопці, але наступ це чи ні, ми далеко не витіснили їх із більшої частини Марокко». У відповідь пролунала какофонія стогонів."
MOR_IBR.22.a:0 "\"Та яка різниця, Франко, аби це допомогло нам вибратися з цього богом забутого місця.\""

MOR_IBR.23.t:0 "Угода з дияволом?"
MOR_IBR.23.desc:0 "Король Марокко Хасан II сидів у своєму приватному кабінеті, уважно розглядаючи карту Мавританії. Незабаром уся ця земля належатиме йому, вона стане частиною Марокко. Йому була потрібна лише крихітна підтримка Європи...\n\nВін підвівся й кілька разів пройшовся кімнатою, розмірковуючи, скільки зможе отримати з Мавританії. Європейці дадуть йому засоби для її завоювання, а він матиме вдосталь здобичі. Звісно, вони теж отримають належне — свої прибутки та інвестиції. Можливо...\n\nЙого роздуми перервав телефонний дзвінок. Він поглянув на телефон і нервово усміхнувся. Невже вони справді відмовляться від такої можливості? Невже не скористаються перспективою прив'язати Марокко до своєї сфери впливу?\n\nВін обережно взяв слухавку й підніс її до вуха, коли в його слух увірвалася іноземна мова."
MOR_IBR.23.a:0 "\"Виконайте свою частину угоди, і ви отримаєте нашу підтримку.\""
MOR_IBR.23.b:0 "\"На жаль, нас не цікавить ваша пропозиція.\""

MOR_IBR.24.t:0 "Звіт 103"
MOR_IBR.24.desc:0 "Дата: [?global.date.GetDateStringNoHourLong]\n\nМісце: мавритано-марокканський кордон.\n\nНаші війська перетнули кордон на світанку після тривалого протистояння з мавританцями. Попри нашу загальну перемогу в бою, ми зазнали 32 втрат, а більшість мавританських сил змогла відступити далі на південь країни.\n\nВідсутність сучасного спорядження майже повністю є причиною нашої нездатності здобути повну перемогу в сутичці. Наразі наше оснащення не набагато сучасніше за спорядження противника, що ставить нас у технічну рівність.\n\nПросимо надіслати нам із столиці додаткове сучасне спорядження. Технологічна перевага забезпечить менші втрати та більші оперативні здобутки в подальших боях.\n\nМи залишаємося готовими до подальших наказів.\n\nКапітан Мохамед Яктін"
MOR_IBR.24.a:0 "Відповідь благодійників Касабланки надійшла швидко: Запит схвалено"
MOR_IBR.24.b:0 "...проте кількість отриманого спорядження виявилася невтішною."
MOR_IBR.24.c:0 "Відповідь благодійників Касабланки надійшла швидко: Запит відхилено."

MOR_IBR.25.t:0 "Переможцям..."
MOR_IBR.25.desc:0 "Мавританія впала. Марокканські війська пройшли парадом вулицями Нуадібу, а солдати зайняли міські площі, оголошуючи воєнний стан через гучномовці. Маріам плакала, адже її країну розтоптали під марокканським чоботом. Але життя тривало.\n\nМинуло два тихі тижні, а все місто досі оговтувалося від шоку та нової реальності, яку встановило Марокко.\n\nМаріам намагалася бачити й хорошу сторону. Її родина була відомою у своєму районі, достатньо впливовою, щоб бути корисною окупаційній владі, на відміну від тих нещасних, яких вона бачила, як виводили з міста — Бог знає куди. Вона переконувала себе, що з ними все буде гаразд, попри все.\n\nА потім, на третьому тижні, марокканські солдати постукали у її двері. Наступне, що вона пам'ятала, — вся її родина йшла геть із міста своїх предків, несучи на спинах лише стільки речей, скільки могла забрати.\n\nЇхню спорожнілу квартиру віддали марокканській родині, а покинутий ними магазин дешево придбала іноземна компанія. Нуадібу оголосили «містом-фортецею», яке контролював марокканський уряд, а володіли ним його іноземні покровителі, перебудовуючи місто відповідно до власних потреб і бажань. Маріам гадала, чи повернеться вона коли-небудь, і чи залишиться місто, яке вона знала, тим самим, якщо їй це вдасться."
MOR_IBR.25.a:0 "За наших марокканських друзів!"

MOR_IBR.26.t:0 "Тягар поразки"
MOR_IBR.26.desc:0 "\"Неймовірний провал. Військова катастрофа. Провал століття\" — такими були заголовки різних марокканських газет, розкладених на столі генерального штабу. Обговорення, яке мало допомогти зробити висновки з їхніх помилок, швидко перетворилося на безладну сварку з криками.\n\nСкориставшись тишею в сусідній кімнаті, чоловік у військовій формі міцно стиснув телефонну слухавку, поки його іноземний зв'язковий говорив, докоряючи Марокко за його провал. «Ви повинні зрозуміти, вони, мабуть, отримали якусь допомогу... хтось, мабуть, злив наші пла—»\n\n«Як ви смієте намагатися перекласти провину на нас? Ми щедро підтримували вашу справу. Ми дали вам зброю, гроші, боєприпаси — усе, що ви могли попросити. У вас був свій шанс».\n\n«Будь ласка...» — марокканець стиснув зуби, відчуваючи пекучий сором у горлі. «Ви повинні зрозуміти, угода залежала від нашої перемоги, ми не ма—»\n\n«Я почув достатньо. Наш уряд не цікавлять ваші виправдання. Ви повернете нам усе до останньої гільзи, і крапка».\n\nЗв'язок обірвався. Генерал підвівся зі свого місця й похмуро увійшов до переповненої кімнати. За лічені миті всі замовкли. Вони боялися почути слова, які пролунають наступними: «Європейці хочуть усе назад»."
MOR_IBR.26.a:0 "Вони повернуть нам кожен цент!"

MOR_IBR.27.t:0 ""
MOR_IBR.27.desc:0 ""
MOR_IBR.27.a:0 ""

MOR_IBR.28.t:0 "Культурний туризм"
MOR_IBR.28.desc:0 "Сонце тепло пригрівало набережну, а перед ними відкривався чудовий краєвид на Гібралтарську протоку. Біля дороги невелика група іспанців розвалилася в шезлонгах, а навколо них стояв густий запах канабісу. З радіо лунала американська рок-н-рольна музика із піратських касет, придбаних на місцевих ринках. Вони провели там увесь ранок, і навколо них уже почали утворюватися невеликі купки сміття.\n\nПерехожі кидали на них несхвальні погляди, адже їхнє байдикування посеред набережної привертало чимало уваги. Місцеві жителі й туристи витріщалися на них, але їм було байдуже. Вони глузували й сміялися, слухаючи музику та насолоджуючись придбаною дурманною отрутою. Зрештою повз них проходив поліцейський, який відчув запах ще до того, як побачив компанію.\n\n«Перепрошую, ви не думаєте, що вам варто звідси забиратися?» — різко запитав він, підходячи до шезлонгів. Їхні мешканці туманно поглянули на нього, не виявляючи особливої зацікавленості.\n\n«А в тебе що, кишенькового злодія на ринку більше нема за ким ганятися?» — насмішкувато кинув хтось.\n\n«Хто це сказав?» — вимогливо запитав він. «Я хочу, щоб усі ви забралися звідси до того, як я повернуся, або—»\n\n«Гей-гей, спокійно». Один із туристів підвівся зі свого шезлонга й неквапливо підійшов до офіцера. «Ми просто добре проводимо час. Ти ж знаєш, як це робиться, правда?» Він дістав жменю купюр песет і простягнув їх поліцейському.\n\nТой усміхнувся й забрав гроші. «Так, я знаю, як добре проводити час. Просто... зробіть музику тихіше, гаразд?»\n\nТурист щасливо кивнув і зменшив гучність, проводжаючи поглядом офіцера, який відходив. Щойно той опинився поза межами чутності, турист знову викрутив музику на повну й почав повільно пританцьовувати в такт."
MOR_IBR.28.a:0 "Наступного ранку поліцейський виявив купи сміття, розкидані всюди. Запах усе ще стояв у повітрі."

MOR_IBR.29.t:0 "Атлас здригнувся"
MOR_IBR.29.desc:0 "Ніхто з них не знав, де вони перебувають. Єдиними орієнтирами були величні гори, під якими розташовувався табір. Де вони? Хто вони? Чоловіки намагалися заговорити, але швидко з'ясувалося, що не всі вони розмовляють однією мовою. У дворі сформувалися групи: іспаномовні, франкомовні та арабомовні нервово поглядали одне на одного, спостерігаючи за охоронцями у вежах, що стояли вздовж високих парканів із колючого дроту. Дехто впізнавав їхню форму — це була форма марокканської армії, — хоча всі чудово розуміли, куди спрямовані гвинтівки. Вони мріяли про тінь сусідніх казарм, але ворота до цієї секції були замкнені. За іншими воротами стояла бетонна будівля, крізь вікна якої було видно вентилятори, і їм залишалося лише уявляти прохолодне повітря.\n\nВони пеклися на сонці годинами, а пісок відбивав спеку. Деякі нещасні не мали взуття — спочатку вони знімали сорочки й ставали на них, рятуючи ноги від гарячого піску, але потім сонце починало пекти їхні оголені торси. Спрага мучила їх.\n\nЗрештою з бетонної будівлі вийшла невелика група людей, одягнених у вільну військову форму, призначену для пустелі. Вони були повною протилежністю натовпу у дворі — охайні та доглянуті на тлі їхнього лахміття. Вони пройшли через ворота в'язниці, оточені численними озброєними чоловіками. Вони з недовірою та презирством дивилися на людей у дворі, але мало хто з ув'язнених мав сили відповісти їм таким самим поглядом.\n\nБеззбройні чоловіки стали перед зібраними полоненими, і один із них заговорив іспанською.\n\n«Панове, це ваш новий дім. Ви прибули здалеку — з Касабланки, Алжиру чи Барселони. Ви хворі, ви становите небезпеку для своїх суспільств. Для вас необхідні особливі заходи. Відтепер починається ваше виправлення, а ваші вироки вже визначені. Співпраця — ваша єдина надія. Якщо ви не погодитеся, пустеля поглине вас цілком»."
MOR_IBR.29.a:0 "Привітання повторили відповідними мовами. Деякі в'язні вже були поза межами досяжності цих слів."

MOR_IBR.30.t:0 "Організований відступ"
MOR_IBR.30.desc:0 "Альберто стиснув зуби, дивлячись позаду себе на довгу чергу іберійців, які чекали посадки на корабель, що мав перевезти їх через Середземне море назад на материк. Він важко працював заради своєї комфортної посади в Марокко й тепер замислювався, чи зможе оговтатися та знайти іншу можливість для безтурботної служби. Єдине, у чому він був упевнений, — майбутнє буде важким.\n\nПозаду нього Алісія міцно обіймала матір. Дівчина народилася в Марокко й не знала іншого дому, однак батьки наполягали, незважаючи на її спротив і сльози, що вона більше ніколи не побачить свого прекрасного дому в Касабланці.\n\nНа іншому кінці портового міста Еріко стежив, щоб вантажники не пошкодили його розкішні меблі, завантажуючи їх на його приватний корабель. Сьогодні він залишить країну, а трохи згодом домовиться, щоб його три розкішні автомобілі також перевезли слідом. Він хотів, щоб існував спосіб вирвати з корінням усі будівлі, зведені на його гроші, і забрати їх із собою до Іберії, але таке життя. Свого часу він ухвалив найкраще рішення, яке міг, і не звинувачував себе в тому, що не зміг передбачити майбутнє. Він спробує ще раз десь в іншому місці.\n\nКоли кораблі відпливли, а вони стояли на палубах, дивлячись на землю, на яку більшість із них більше ніколи не ступлять, усі підраховували свої втрати та проклинали власну долю. Але ніхто навіть не поглянув за білі береги Африки — на людей, яких вони зневажали й на чиїх спинах будувалося їхнє багатство..."
MOR_IBR.30.a:0 "...І вони залишалися байдужими до мільйонів душ, які раділи їхньому падінню."

MOR_moroccowar.1.t:0 "Вторгатися чи не вторгатися? Ось у чому питання"
MOR_moroccowar.1.desc:0 "Щойно [IBR.GetLeader] ступив на авіабазу Торрехон, його оточили численні журналісти та фотографи. Навколо нього сипалися запитання про ситуацію в Марокко, про іберійські сили, які відступали на повну, та про те, які дії він збирається вжити.\n\nПробившись крізь натовп, [IBR.GetLeader] увійшов до кімнати для нарад, швидко віддав честь генералам і сів. Генерал на протилежному кінці столу почав: «Пане, наші війська зараз повністю відступають через Марокко, а багато батальйонів із усього Рифу вже переправилися через протоку на човнах і літаках. Однак у Марокко все ще залишається значна кількість особового складу, а ще кілька підрозділів дислоковані на півдні й чекають на ваш наказ».\n\n«Що ж, ви напевно вже придумали рішення. Викладайте, панове».\n\nІнший генерал виступив уперед. «Наразі в нас є два варіанти. Ми можемо наказати всьому особовому складу, що залишився, відступити й спробувати домовитися з марокканцями — перші спроби встановити контакт дали обмежені результати ще в мирний час, — або ж можемо наказати вторгнення до Марокко. Саме цього я та Генеральний штаб і пропонуємо». В його очах спалахнула лють. «Повернення Рифу має стати нашою головною метою».\n\nПопередній генерал знову взяв слово: «Хоча ми радимо вторгнутися, щоб повернути ці території, рішення залишається за вами, пане»."
MOR_moroccowar.1.a:0 "\"Я даю вам зелене світло.\""
MOR_moroccowar.1.b:0 "\"Продовжуйте переговори; мир — наш єдиний варіант.\""

MOR_moroccowar.2.t:0 "Ікар"
MOR_moroccowar.2.desc:0 "Карлос завжди вважав своє прізвисько іронічним.\n\nЩе в дитинстві він мріяв літати — мрія, що виникла з історій, які його Папá розповідав про свій час у Громадянській війні. Папá завжди застерігав його не йти його шляхом, знаючи, які небезпеки той приховував. Проте юний Карлос не слухав і подав заяву до льотної школи.\n\nКарлос стояв напоготові, очікуючи посадки, поки авіамеханіки проводили останні перевірки його літака: перевіряли правильність завантаженого озброєння, кути відхилення закрилків і справність усіх систем. Коли останні члени екіпажу поспішили до іншого літака, Карлос обережно забрався до кабіни.\n\nВін провів останню передпольотну перевірку, а потім дістав фотографію — останню, де він був разом зі своїм батьком. Ще раз пильно глянувши в очі покійного батька, він сховав її назад у кишеню й виїхав на злітну смугу.\n\nПоки він чекав, доки диспетчерський центр підготується, він почав замислюватися, які мотиви стоять за цим вторгненням, у чому полягає мета його місії та чи повернеться він додому. Батько попереджав його про небезпеку, але він усе одно пішов за своєю мрією, готовий обпектися, розмірковуючи, коли ж відбудеться його останній політ. Карлос вирвався з цих думок, почувши тріск рації."
MOR_moroccowar.2.a:0 "\"Шлях вільний, Ікар.\""

MOR_moroccowar.3.t:0 "Дуель із поразкою"
MOR_moroccowar.3.desc:0 "Люба мамо,\n\nЯ не знаю, скільки ще зможу це витримувати, мамо. Сьогодні я вперше вбив людину. Нам казали, що вони інші, що вони вороги, які бажають смерті Іберії. Єдиною його річчю була одна-єдина фотографія: він, його дружина та двоє дітей. Це нагадало мені про Папá. Невже саме такою була Громадянська війна?\n\nЛюба мамо,\n\nНаш командир наказав нам повністю відступати. Я прокинувся у своєму наметі, коли інший солдат кричав, щоб я хапав найнеобхідніше й тікав, перш ніж нас оточать марокканці. Не хвилюйся, мамо, я не забув узяти старий татів секундомір і нашу сімейну фотографію. Дивним було те, що нам наказали залишити ящики з боєприпасами та інші припаси.\n\nЛюба мамо,\n\nКомандир нарешті повідомив нам новини. Не знаю, чи дійшли вони вже до батьківщини, але нас відтіснили назад. Ми прийшли заради честі й зазнали поразки; усе це було даремно, мамо. Я бачив, як друзі вмирали поруч зі мною, бачив людей понівечених і скалічених. Але, мамо, я краще прийму безчестя заради можливості ще раз тебе обійняти — чогось, чого інші вже не матимуть."
MOR_moroccowar.3.a:0 "Підпис: Сантьяго Гальєго."

MOR_moroccowar.4.t:0 "Шрами визволення"
MOR_moroccowar.4.desc:0 "Люба мамо,\n\nЯ не знаю, скільки ще зможу це витримувати, мамо. Сьогодні я вперше вбив людину. Нам казали, що вони інші, що вони вороги, які бажають смерті Іберії. Єдиною його річчю була одна-єдина фотографія: він, його дружина та двоє дітей. Це нагадало мені про Папá. Невже саме такою була Громадянська війна?\n\nЛюба мамо,\n\nМій батальйон нарешті визволив Сеуту. Від інших я чув, що в Мелільї також є успіхи. Однак після цього марокканці не дають нам просунутися далі. Нам сказали, що ми спробуємо здійснити ще один наступ. Командири повідомили, що ми намагаємося вийти на кордон 1912 року. Риф буде нашим.\n\nЛюба мамо,\n\nДосі болить. Відтоді як я підірвався на тій міні, я лежу в лікарні, відновлюючись після поранення. Лікарі кажуть, що зможуть врятувати ногу, кажуть, що я, сподіваюся, знову зможу ходити. Я лежу в цьому ліжку й щодня молю Бога, щоб вони змогли її вилікувати. Я молюся, щоб знову зміг жити. Я не можу залишатися для тебе тягарем, не можу сидіти вдома калікою. Тут я дізнався від інших солдатів, що нам вдалося втримати анклави, але просунутися далі ми не змогли. Я чув, що війна скоро може закінчитися. Я знову побачу тебе. Скоро буду вдома.\n\nЛюблю тебе, мамо."
MOR_moroccowar.4.a:0 "Підпис: Сантьяго Гальєго."

MOR_moroccowar.5.t:0 "Жертви успіху"
MOR_moroccowar.5.desc:0 "Люба мамо,\n\nЯ не знаю, скільки ще зможу це витримувати, мамо. Сьогодні я вперше вбив людину. Нам казали, що вони інші, що вони вороги, які бажають смерті Іберії. Єдиною його річчю була одна-єдина фотографія: він, його дружина та двоє дітей. Це нагадало мені про Папá. Невже саме такою була Громадянська війна?\n\nЛюба мамо,\n\nНаступ на Сеуту та Мелілью став приголомшливим успіхом; ми повністю вибили звідти марокканців. За наші успіхи сьогодні ми навіть отримали справжню їжу — щось краще за консервовані пайки, які нам зазвичай дають. Це трохи нагадало мені дім.\n\nЛюба мамо,\n\nЗавдяки нашим успіхам у Сеуті та Мелільї нам вдалося встановити контроль над усім Рифом. Командири сказали нам, що решту Марокко захопити не вдалося, але мене запевнили, що це все одно вважається успіхом. Тим часом мене призначили утримувати Тетуан і допомагати охороняти логістику. Сподіваюся, що напишу тобі, щойно ми прибудемо.\n\nШановна Маріє Гальєго,\n\nВід імені Генерального штабу Збройних сил Іберії ми з глибоким жалем повідомляємо вам про передчасну смерть вашого сина, Сантьяго Гальєго. Він героїчно загинув поблизу Тетуана, Марокко, внаслідок нападу озброєних повстанців. Хоча наразі додаткові подробиці відсутні, ви отримаєте лист від командира вашого сина, у якому буде надано більше інформації."
MOR_moroccowar.5.a:0 "Підпис: Збройні сили Іберії."

MOR_moroccowar.6.t:0 "Рішення Генералісимуса"
MOR_moroccowar.6.desc:0 "Генеральний штаб зібрався навколо карти, яку протягом останніх кількох днів знову й знову перемальовували та виправляли. Маленькі глиняні фігурки пересувалися по Рифу. Між генералами точилися суперечки навколо одного-єдиного питання. Питання, на яке міг відповісти лише один чоловік.\n\nКімнату швидко огорнула моторошна тиша, коли увійшов Франко. Увесь штаб віддав честь Каудильйо, не опускаючи рук, доки той не сів. Начальник штабу заговорив першим. "Генералісимусе, дякуємо, що приєдналися до нас сьогодні. Як ви, напевно, вже знаєте з доповідей, ситуація в Марокко поки що складається переважно успішно. Однак виникли певні розбіжності щодо того, як діяти далі."\n\nДругий генерал подав голос. "Наразі ми маємо дві точки зору: продовжити або завершити конфлікт. Ми вже досягли кордонів 1912 року; однак можемо продовжити наступ і повернути собі все Марокко, сер. Я вважаю, що нам слід продовжувати, аби переконатися, що ця загроза більше не завдасть удару."\n\nНачальник штабу запротестував. "Навпаки, ми можемо задовольнитися нинішніми здобутками. Ми вже здобули нищівну перемогу й дали марокканцям урок. Наші лінії постачання вже починають розтягуватися, а населення не сприйме нескінченне топтання в пустелі."\n\nФранко повільно підвівся зі свого краю столу й перед тим, як вийти, вимовив лише один наказ."
MOR_moroccowar.6.a:0 ""Закінчити.""
MOR_moroccowar.6.b:0 ""Продовжити.""

MOR_moroccowar.7.t:0 "Мир вам"
MOR_moroccowar.7.desc:0 "Марія Гальєго сиділа, як і щоранку, надворі зі своїм сніданком — pan con tomate — та свіжим випуском ABC. Марія змогла прочитати лише заголовок: Мир. Каудильйо нарешті завершили війну, на вулицях почалися святкування, а звідусіль лунали вигуки слави Іберії. Та вона могла думати лише про свого сина.\n\nГортаючи газету, вона побачила, як саме висвітлювали цю подію. Скільки, як стверджувалося, пожертвували Каудильйо, про їхнє героїчне керівництво. В іншому розділі йшлося про тактичний геній Генерального штабу та про те, наскільки великою була ця перемога. І лише на останній сторінці були імена тих, хто насправді пожертвував собою, тих, хто був справжніми героями.\n\nМарія пробиралася крізь вулиці. По всьому Мадриду спалахували святкування успіху Іберії, що мали стати реваншем за попередні невдачі. Це був кінець конфлікту, незалежно від того, погоджувався хтось із його необхідністю чи ні. Усі погоджувалися, що мир — найкращий варіант. Батьки, чоловіки й сини повернуться додому, навіть якщо це буде не Сантьяго. Принаймні інші житимуть. Увійшовши до базиліки Сан-Мігель, Марія одразу попрямувала до самотньої свічки. Тієї, яку вона запалювала не так давно. Вона прошепотіла молитву, поки на вулицях за стінами продовжували лунати святкові вигуки."
MOR_moroccowar.7.a:0 "Слава Іберії."

MOR_moroccowar.8.t:0 "Опір спокусі"
MOR_moroccowar.8.desc:0 "У кімнаті, прикрашеній прапорами різних військових частин, лунали постріли корків від шампанського. Генерали вітали один одного, святкуючи успішне завершення війни. У цій кімнаті зібралися люди, які ще зовсім недавно сперечалися між собою щодо того, яким має бути її ідеальний результат.\n\nБагато хто з присутніх хотів відновити старий колоніальний уряд, захопивши все Марокко. Та попри постійні заклики Іберійська держава категорично відмовилася продовжувати війну. Немов спокуса диявола, з Марокко в ролі свіжого яблука, іберійський уряд не став слухати змія. Ніхто в цій кімнаті не зізнався б, що був одним із тих дияволів, одним із генералів, які виступали за повну анексію. Та навіщо їм це тепер? В очах населення вони вже перемогли.\n\nІ все ж, попри такий контекст, Генеральний штаб продовжив святкувати. Перемога була здобута, тверезий розум узяв гору, а Каудильйо на певний час відчепляться від них. І, можливо, це навіть принесе кілька підвищень.\n\nУ Мадриді Франко зробив ковток вина, перш ніж привітати свого співрозмовника. "Знову довелося відтягувати цих скажених псів війни від краю прірви. Хотіли забрати все Марокко. Навіть показали мені план наступу на Іфні та решту."\n\n"І що ти їм сказав, Франко?""
MOR_moroccowar.8.a:0 ""Ми не настільки дурні, щоб на це піти.""


#Новинні події Марокко
MOR_News.1.t:0 "[Get_newspaper_header]Марокко ухвалює основний закон"
MOR_News.1.desc:0 "Останніми днями уряд Марокко оголосив про перехід монархії до напівконституційної моделі після багатьох років переговорів і взаємного протистояння між королем та Істіклялем. Це сталося після придушення повстання в Рифі, що посилило переговорні позиції короля Хасана II. У результаті він досяг успіху у своїх зусиллях із прийняття конституції, яка віддає перевагу повноваженням монархії, гарантуючи, що де-факто він і надалі правитиме як автократ.\n\nОднак ані король, ані Істікляль не задоволені нинішнім компромісом. Залишається побачити, чи зможе їхня конституція витримати випробування часом."
MOR_News.1.a:0 "Чи може це стати кроком до незалежності Марокко?"

MOR_News.2.t:0 "[Get_newspaper_header]Іберія надає Марокко незалежність"
MOR_News.2.desc:0 "З Мадрида та Рабата надходять новини про те, що Іберійський Союз погодився надати Марокко незалежність. Статус протекторату Марокко офіційно припинився, а Мадрид передав марокканському уряду всі іберійські колонії в Магрибі, за винятком портів Сеута та Мелілья.\n\nОчікується, що угода про незалежність призведе до посилення політичного домінування монархії, і вже повідомляється, що корона намагається протистояти обраному уряду. Крім того, не весь іберійський вплив було усунуто. Іберія продовжує зберігати значне економічне домінування над Марокко, і жодних націоналізацій наразі не планується."
MOR_News.2.a:0 "Марокко постало перед очима всього світу."

MOR_News.4.t:0 "[Get_newspaper_header]Марокканське повстання в [1013.owner.GetAdjective] Північній Африці"
MOR_News.4.desc:0 "Протягом десятиліть Марокко перебувало під владою європейців. Живучи під іспанцями, а згодом під іберійцями, після анексії французьких територій наприкінці Другої світової війни, король Хасан II намагався здобути більшу незалежність від свого північного сюзерена. Однак ці зусилля закінчилися хаосом, оскільки самопроголошена "Армія національного визволення" захопила контроль над значними територіями центрального Марокко.\n\nІберійський контроль зберігається лише над частиною їхніх північноафриканських територій, які зазнають значного тиску з боку бойовиків, що прагнуть назавжди вигнати іберійців. Повідомляється про численні напади на іноземних громадян, а також на всіх, кого бойовики вважають колабораціоністами.\n\nМадрид засудив переворот як дії "радикалів, підтримуваних іноземцями", які дестабілізують регіон заради власної вигоди, і вже пообіцяв захищати території, що досі перебувають під іберійською владою.\n"
MOR_News.4.desc_SPA:0 "Протягом десятиліть Марокко перебувало під владою європейців. Живучи під іспанцями, а згодом під іберійцями, після анексії французьких територій наприкінці Другої світової війни, король Хасан II намагався здобути більшу незалежність від свого північного сюзерена. Однак ці зусилля закінчилися хаосом, оскільки самопроголошена "Армія національного визволення" захопила контроль над значними територіями центрального Марокко.\n\nІспанський контроль зберігається лише над частиною їхніх північноафриканських територій, які зазнають значного тиску з боку бойовиків, що прагнуть назавжди вигнати іспанців. Повідомляється про численні напади на іноземних громадян, а також на всіх, кого бойовики вважають колабораціоністами.\n\nМадрид засудив переворот як дії "радикалів, підтримуваних іноземцями", які дестабілізують регіон заради власної вигоди, і вже пообіцяв захищати території, що досі перебувають під іспанською владою.\n"
MOR_News.4.a:0 "Вогонь у Марокко розгорівся надто сильно, щоб його можна було стримати."

MOR_News.6.t:0 "[Get_newspaper_header]Марокканську монархію скинуто"
MOR_News.6.desc:0 "Повідомлення з Рабата свідчать, що Хасан II та його династія, яка правила майже 350 років, була усунута від влади внаслідок перевороту. Після падіння іберійської влади в країні монархія почала репресії проти націоналістично-республіканської партії Істікляль. Офіцери, прихильні до ідей Істіклялю, повалили короля після того, як захопили Королівську резиденцію, а також основні дороги та військові об'єкти столиці.\n\nРадіостанції повторюють заклики до спокою та оголосили воєнний стан "на час кризи". Король затриманий і утримується в досі не підтвердженому місці, а військові поширюють фотографії його арешту. Партія Істікляль оголосила про створення нового уряду, подякувала "патріотично налаштованим офіцерам" та оголосила про власні репресії проти монархістів, що залишилися, призначаючи своїх функціонерів на численні державні посади, готуючи Марокко до нового республіканського майбутнього.\n"
MOR_News.6.a:0 "З падінням династії приходить піднесення Партії."

#Tooltips
IBR_accept_independence_tt: "§YНадання §oКоролівству Марокко§! незалежності може послабити наш прямий вплив на Марокко, але це зміцнить наші зв'язки з країною.§!"
IBR_refuse_independence_tt: "§RМи не можемо дозволити собі витрати на управління §oКоролівством Марокко§!. Відмова надати їм незалежність може мати катастрофічні наслідки в майбутньому.§!"
IBR_continued_dominance_tt: "§GНаш економічний вплив на §oКоролівство Марокко§! зберігся навіть після здобуття незалежності. Ми можемо очікувати, що він і надалі залишатиметься таким.§!"
IBR_Morocco_Exodus_tt: "§Y§oКультурна карта§! §oКоролівства Марокко§! зміниться.§!"
Mezziane_protest: "§RНа знак протесту проти нашого рішення генерал Мохаммед бен Мізіан пішов у відставку з військової служби.§!"
Mezziane_goes_away: "§FГенерал Мохаммед бен Мізіан повернеться на батьківщину, до Марокко, та служитиме новому незалежному Королівству.§!"