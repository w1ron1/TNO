#Leader Bios
POLITICS_HASSAN_II_DESC:0 "Хасан II — жорстока, холодна людина. Водночас він створює образ красномовного й мудрого правителя, який дивним чином співіснує з його жахливою репутацією. У Марокко він прагне влади й контролю, не терплячи жодного непослуху своїй волі. Якщо він має бодай якусь можливість зупинити рух, що виходить за межі його бачення майбутнього Марокко, він зробить усе можливе, аби його придушити.\n\nЗвісно, Марокко — лише одна країна, і Хасан II чудово усвідомлює, що світ набагато більший за нього самого. Що стосується міжнародних відносин, його вільне володіння іспанською дозволяє йому добре орієнтуватися у становищі, відведеному Марокко як партнеру та клієнту Іберійського Союзу.\n\nУ особистій політиці Хасана II існує небагато непохитних принципів, окрім одного: монархія повинна мати якомога більше влади, наскільки це практично можливо, і ніхто не повинен мати змоги протистояти його волі як короля. Його риторика змінюється залежно від обставин та аудиторії. Перед однією юрбою він — провісник модернізації Марокко. Перед іншою — головний захисник давньої культури й традицій нації. У своєму особистому житті він сам перейняв західний спосіб життя, але це ніколи не пошириться на його правління. Марокко ніколи не дозволить традиційній владі монархії зазнати занепаду."

POLITICS_ABBAS_MESSADI_DESC: "Народившись у впливовому берберському племені в регіоні Риф, Аббас Мессааді провів усе своє життя в боротьбі як проти марокканської корони, так і проти її іспанських покровителів. У 1965 році, надихнувшись Фронтом національного визволення Алжиру, Мессааді допоміг сформувати «Армію визволення» — організацію, присвячену збройній боротьбі проти іспанського протекторату в Марокко.\n\nУ міру того як Іспанія посилювала свій контроль над маріонетковим монархом, народ Марокко втрачав віру у здатність корони захистити його. Тепер, коли справжня сутність іспанської окупації Марокко була викрита, люди закономірно звернулися до Мессааді, який опинився в ідеальному становищі, щоб перетворити цей імпульс на справжнє широкомасштабне повстання.\n\nПісля перших пострілів повстання Марокко проти своїх колишніх господарів і того, як народ почав стікатися під прапори АВН, саме Мессааді належить очолити їх. Саме Мессааді належить повести Марокко вперед, до нового майбутнього, у якому колоніальне правління буде остаточно знищене."

POLITICS_ABDALLAH_IBRAHIM_DESC: "Абдалла Ібрагім народився в Марракеші у 1918 році, за правління франкофільського аристократа Тхамі ель-Глауї. Ібрагім рано виступив проти колоніального правління, організовуючи опір феодальному уряду ель-Глауї, за що був вигнаний із Марракеша. Під час вигнання він став провідним активістом Істіклялю — націоналістичної політичної партії, яка виступала за незалежність у рамках конституційної монархії. Монархія то розпочинала репресії проти Істіклялю, то укладала з ним союзи, що швидко породило в Ібрагіма недовіру до короля Хасана.\n\nОднак на певний час особисті почуття довелося відкласти, коли Іберійський Союз занурився у громадянську війну. Як і кожен інший провідний політик Істіклялю, Абдалла Ібрагім уклав союз із королем Хасаном, щоб забезпечити незалежність. Попри цей союз, Хасан знову розпочав чистку Істіклялю, але ця зрада лише посилила республіканську фракцію партії. Ібрагім та інші республіканці почали організовувати опір королівській диктатурі.\n\nІстіклялю вдалося усунути Хасана, а Ібрагім виявився природним кандидатом на посаду президента нового республіканського уряду Марокко. Однак за відсутності як монархії, так і колоніальної адміністрації Істікляль швидко почав ідеологічно занепадати. Якщо цей занепад продовжиться, Абдалла Ібрагім та націоналістична партійна держава ризикують встановити те, що можна було б описати лише як «республіканську монархію»."

