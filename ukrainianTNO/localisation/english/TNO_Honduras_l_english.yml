 #Football War Military Win
 HON_All_Thanks_to: "Усе завдяки..."
 HON_All_Thanks_to_desc: "Гондураській армії. По всій країні в майже кожній розмові можна почути ці три слова. Як вони змогли захопити Республіку? Як вони могли забрати нашу демократію? Як думаєте, вони повернуть вибори?\n\nОстаннім часом у їхніх словах чується зміна: «Ми перемогли завдяки армії». Раніше їхнє правління було нелегітимним, бомбою уповільненої дії, яку відкладала риторика про стабілізацію, але перемога над Сальвадором виправдала режим і самого Арельяно.\n\nБільше немає потреби в сварках між партіями та безглуздому суперництві, адже саме сильна влада не дала країні загинути. Відтепер він уже не якийсь нікчемний диктатор із фіктивною партією; тепер PNH — партія національної гордості, а Арельяно — людина, яка врятувала націю."

 HON_The_Second_Somoza: "Другий Сомоса"
 HON_The_Second_Somoza_desc: "Арельяно — не просто якийсь вискочка-генерал, який повалив слабкий центральноамериканський уряд. Ні, він президент, а не каудильйо. Республіка Гондурас є саме республікою. Існує законодавча влада, представники, вибори — навіть вибори президента. Але переможець лише один. Арельяно. Так само, як сумнозвісні Сомоси в Нікарагуа, Арельяно створив бездоганну виставу демократії та законності для своєї хунти, що спирається на Partido Nacional Hondureña.\n\nБільше того, він став ідеальним американським маріонеткою, нагадуючи найвідданіші епізоди правління Сомоси, виконуючи все, що від нього вимагають, і з готовністю співпрацюючи з компаніями, які часто присутні по всій країні значно сильніше, ніж сам уряд.\n\nОпозицію переслідують, соціалістів ніде не видно, а Гондурас дедалі глибше потрапляє під контроль капітана Освальдо Арельяно з USS «Гондурас»."

 #Football War Loss
 HON_La_Tragedia_Nacional: "La Tragedia Nacional"
 HON_La_Tragedia_Nacional_desc: "Уся країна оплакує свою гордість. Можливо, Гондурас ніколи не був видатною державою і навіть не мав шансів на перемогу, але для народу це не має жодного значення. Серед людей панує гіркота: лють на сальвадорських мігрантів, що оселилися на їхній землі, лють на Сполучені Штати за удар у спину та лють на власного лідера через його нездатність скористатися перевагами країни та перетворити їх на перемогу.\n\nТепер вони бачать лише занепад — економічний і політичний. Щодня відбуваються заворушення, які влаштовують як найпалкіші комуністи, так і затяті націоналісти. Перемир'я знекровило Гондурас і не вирішило жодної з його проблем.\n\nКраїна оплакує пролиту кров і, заліковуючи свої рани, не забуде того, хто їх завдав."

 #Fascist Coup
 HON_A_New_Direction: "Новий напрямок"
 HON_A_New_Direction_desc: "Коли країну охопив хаос, єдиною силою, здатною відновити стабільність, були військові. Але цього разу вони пішли далі. Цього разу немає жодних обіцянок повернутися до демократії чи республіки. Ба більше, військові врятували Гондурас від самої республіки.\n\nНездатний цивільний уряд не зміг захистити країну, постійно покладаючись на якусь зовнішню силу, що підтримувала його при владі, але тепер її більше немає. Тепер справжні патріоти можуть взяти кермо нації у свої руки та повести її до слави. Більше ніколи націю не спіткає доля, подібна до скаліченого «перемир'я» Футбольної війни.\n\nБільше ніколи Гондурас не зазнає поразки в жодному сенсі. Нація має процвітати, і Хуан Альберто Кастро приведе її до процвітання, навіть якщо для цього доведеться тягнути її туди силоміць, поки вона відчайдушно опиратиметься. Одного дня кожна людина в його країні знову з гордістю скаже, що вона гондурасець."

 HON_Scuttling_the_Ship: "Затоплюючи корабель"
 HON_Scuttling_the_Ship_desc: "Хто винен у поразці нації? Не жалюгідний селянин і не доблесний солдат. І навіть не політики, які, попри всю свою огидність і некомпетентність у кожному значенні цього слова, просто грали за правилами тієї самої гри, у яку грали всі інші. Вина лежить на експлуататорах, імперіалістах і зарозумілих людях у Вашингтоні, які створили цю гру.\n\nЯнкі, які використовували нашу країну так, як чоловік використовує повію, зрадили націю, яку нібито прагнули стабілізувати, залишивши її беззахисною перед сальвадорськими вовками. Ми не дозволимо себе експлуатувати, поневолювати та позбавляти власної країни.\n\nГондурас буде вільним — вільним від впливу янкі, вільним від ганьби та вільним від господарів. Ми не будемо пішаками чи слугами будь-якої держави та її форпосту, бо ми затопимо й розберемо на метал USS «Гондурас»."

 HON_Tearing_at_the_Seams: "Розриваючись по швах"
 HON_Tearing_at_the_Seams_desc: "Standard Fruit, Coca-Cola, United Fruit та всі янкі-мегакорпорації, які експлуатували наш народ і нашу землю, більше цього не робитимуть. Натовпи оточують їхні регіональні штаб-квартири, селяни палять їхні врожаї, а антиамериканські настрої поширюються країною, виганяючи керівників та їхніх працівників за допомогою мачете й коктейлів Жданова.\n\nПитання полягає в тому, як Гондурас тепер зможе зібрати себе докупи? Втрата величезних корпорацій залишила економічний вакуум, який необхідно заповнити, і тепер Мельгар Кастро має вирішити, хто саме його заповнить."

 #Military Survival
 HON_Second_Somoza: "Другий Сомоса"
 HON_Second_Somoza_desc: "Арельяно — не просто якийсь вискочка-генерал, який повалив слабкий центральноамериканський уряд. Ні, він президент, а не каудильйо. Республіка Гондурас є саме республікою. Існує законодавча влада, представники, вибори — навіть вибори президента. Але переможець лише один. Арельяно.\n\nТак само, як сумнозвісні Сомоси в Нікарагуа, Арельяно створив бездоганну виставу демократії та законності для своєї хунти, що спирається на його Partido Nacional Hondureña. Ба більше, він став ідеальною маріонеткою американців, нагадуючи найвідданіші періоди правління Сомоси, виконуючи все, що від нього вимагають, і з готовністю співпрацюючи з компаніями, які часто присутні по всій країні значно сильніше, ніж сам уряд.\n\nОпозицію переслідують, соціалістів ніде не видно, а Гондурас дедалі глибше потрапляє під контроль капітана Освальдо Арельяно з USS «Гондурас»."

 HON_Rapid_Reshaping: "Стрімка перебудова"
 HON_Rapid_Reshaping_desc: "Після поразки у Футбольній війні країна спустошена. Кожен гондурасець відчуває сором — за історію своєї країни, її виступ і її лідера. На вулицях панує гнів, спрямований проти нелегітимної військової хунти Арельяно та її американських покровителів. Що має робити Арельяно? Піти у відставку? Дозволити провести вибори? Звичайно, ні, адже якщо не вийшло, треба пробувати, пробувати й пробувати знову.\n\nАрельяно таки дозволив провести вибори й перетворив свою хунту на цивільний режим — але лише фарсовий. Народ може смакувати національне приниження та оплакувати своїх загиблих, але більше ніхто не приділятиме уваги постійним прикордонним суперечкам і сальвадорським мігрантам. Будь-яка така увага буде швидко відвернута силами безпеки Арельяно, а якщо цього виявиться недостатньо — його американськими покровителями, які тепер утримують його при владі."

 #Communist Takeover
 HON_Peasants_Honduras: "Селянський Гондурас"
 HON_Peasants_Honduras_desc: "Селая ніколи не був багатієм. Він завжди виступав за аграрну реформу, бачачи злиденні простори Гондурасу за межами столиці. Він організовував селян у профспілки, виходив із ними на вулиці, підтримував їхній добробут і працю.\n\nКоли він розпочав партизанську боротьбу проти уряду, він завжди туманно сподівався, що цей день настане. День, коли він підпише накази про конфіскацію невикористовуваних земель бананових компаній, старих іноземних залізниць і земель, які так давно були відібрані в народу Гондурасу.\n\nТепер його нація належатиме селянам — країна, яка працює заради них так само, як вони працюють заради неї. Нарешті його туманна надія здійснилася, і він разом зі своєю партією доведе цю справу до кінця."

 HON_In_The_Red: "У червоному"
 HON_In_The_Red_desc: "Гондурас занурився в червоний колір у всіх можливих сенсах. Хоча Селая та новий уряд сповнені добрих намірів і надії на майбутнє, реальність виглядає зовсім інакше.\n\nНа карті Гондурас виділяється яскраво-червоним кольором як колишній союзник, що після соціалістичної революції перетворився на культурного ворога. Побоюючись втратити свої активи, ті американські компанії, чиї володіння ще не були конфісковані, за одну ніч зібралися та втекли з країни, зануривши наші фінанси в червону зону й відправивши нас у вільне падіння.\n\nПроти прибічників і репресорів колишнього режиму раніше пригноблені бачать лише червоне. Увесь Гондурас можна описати цим кольором: хаотичний, яскравий та сповнений енергії.\n\nХоча режим ідеалістичний і прагне покращити життя свого народу, залишається лише чекати й дивитися, чи зможе нова червона пляма Центральної Америки вибратися з ями, у якій опинилася."

 ##Events

 HON_forpol.1.t: "Центральна Америка та Пуерто-Плата"
 HON_forpol.1.desc: "Мікель раз у раз переводив погляд, намагаючись розібратися в цифрах у документі, перечитуючи його знову й знову. Він не спав уже кілька днів, тримаючись лише на каві у своїй чашці та палкій ненависті до фашизму у своєму серці. Заплановане втручання OFN проти чобіт Трухільйо мало відбутися лише за кілька тижнів. Як капітан Карибського легіону, він мав подбати про всі логістичні питання та непередбачені обставини, пов'язані з його підрозділом, а сон міг почекати.\n\nАмериканці та мексиканці постачали більшість боєприпасів, транспортних засобів і спорядження для вторгнення в Пуерто-Плату. Щодо якості питань не виникало, але Мікеля непокоїло, чи вистачить виділених йому боєприпасів і чи зможуть його люди розібратися з усіма недоліками своєї нової техніки до початку операції. Постійні суперечки між американськими та мексиканськими консультантами теж не допомагали. А от наші гондураські господарі, подумав Мікель, були всім, чого тільки можна було побажати, і навіть більше. Тегусігальпа професійно та ефективно виконувала свою роль, залучаючи ветеранів і добровольців, прихильних до OFN, з усієї Латинської Америки, щоб посилити спільні лави сил вторгнення. Ямайські комуністи, кубинські гайтаністи, костариканські ліві, панамські ліберали та місцеві студенти — перед лицем такого зла антифашистські сили мають бути єдиними, попри всі свої розбіжності. Гондурасці були достатньо прагматичними, щоб зрозуміти: ми не можемо дозволити собі дискримінацію. Найціннішим за все було навчання, яке проводили гондурасці. Досвідчені та компетентні офіцери гондураської армії доводили бійців Легіону, особливо новобранців, до справжньої бойової готовності. Мікель лише сподівався, що їхніх спільних зусиль буде достатньо.\n\nКоли світанкове світло почало пробиватися до кімнати Мікеля, він вимкнув лампу на столі, вийшов зі своїх покоїв і попрямував до найближчого порту. На мить він зупинився, милуючись тим, як сонячні промені відбиваються від вод узбережжя Гондурасу, мерехтливих, наче золоті самородки."
 HON_forpol.1.a: "Для народу Кіскейї ось-ось настане новий день."

 HON_forpol.2.t: "USS «Гондурас»"
 HON_forpol.2.desc: "Ранок у Старому президентському палаці. Звична тропічна спека вже насичує повітря, огортаючи зубчасті стіни, що височіють над водами річки Чолутека. Рамон Вільєда Моралес відходить від вікна, спостерігаючи за галасливим пробудженням Тегусігальпи. Він знімає важкі окуляри в роговій оправі й втомлено потирає перенісся. На масивному столі з червоного дерева лежить свіжий випуск газети, де заголовки Національної партії знову кричать про зраду.\n\n«Маріонетка Вашингтона», — заявляють вони. «Продажний син Батьківщини». Вільєда гірко хмикає, ловлячи своє відображення в темному склі. Ці критики забувають, що саме його політика «продажності» принесла соціальні пільги простому пеону та Трудовий кодекс робітникові, захистивши їх від тієї самої тиранії, яку уособлюють ці критики. Поки заможні торговці скаржаться, що американські монополії душать їх, президент бачить зовсім іншу картину.\n\nРаптом скло у високих віконних рамах починає деренчати — над містом із гуркотом пролітає ланка американських винищувачів. Орел розправив свої крила над Гондурасом. Так, його тінь величезна, часом навіть лякає, але під цим крилом країна вперше за багато років може дихати спокійно. Американські долари будують школи, а американські багнети гарантують, що жоден бунтівний генерал чи комуніст не виб'є ці двері... принаймні сьогодні."
 HON_forpol.2.a: "У світі хижаків мудрий правитель тримається ближче до найсильнішого звіра."

 HON_forpol.3.t: "Уривок із суботньої редакційної статті El Cronista"
 HON_forpol.3.desc: ""...На папері наша Конституція Гондурасу сяє чистотою, гідною музейної вітрини. Вашингтон із задоволенням киває, дивлячись на нас: погляньте, зразкова республіка, де кожні кілька років громадяни кидають свої бюлетені в урни. Але відкиньмо дипломатичні умовності й подивімося правді у вічі. Наша демократія — це закритий клуб, де вступні внески рахуються мільйонами лемпір, а швейцари при вході носять форму іноземних корпорацій.\n\nНа політичній сцені лише двом акторам дозволено грати головні ролі: Ліберальній партії (PLH) та Національній партії (PNH). «Колорадос» і «Асуляс». Ліберали, чиї зв'язки з конгломератами Бостона та Нового Орлеана не є таємницею, пропонують нам косметичний ремонт фасаду — помірковані реформи, щоб пара не зірвала кришку з казана. Націоналісти ж, спираючись на строкату коаліцію землевласників, із неприхованою заздрістю поглядають на Мексику, мріючи побудувати тут власну версію «Інституційної революції» — монолітну вертикаль, де опозиція перетвориться не більше ніж на тінь.\n\nАле не дайте їхній риториці себе обдурити. Обидві партії п'ють з одного джерела, і це джерело аж ніяк не воля народу. Поки не станеться тектонічний зсув, наш виборчий процес залишатиметься не більш ніж складним ритуалом для легітимації влади тих, кому належать бананові плантації. Стабільність? Безсумнівно. Свобода? Це залежить від того, хто оплачує бенкет..."""
 HON_forpol.3.a: "Принаймні режим стабільний."

 HON_forpol.4.t: "Збройні сили Гондурасу"
 HON_forpol.4.desc: "Полуденне сонце нещадно палить плац авіабази Тонконтін, проте взвод сержанта Рейєса стоїть нерухомо, наче теракотова армія. Рейєс машинально проводить пальцем по холодній ствольній коробці свого M1 Garand — зброї, виготовленої на далекій фабриці у Спрингфілді, за тисячі кілометрів звідси. Неподалік кремезний інструктор із Техасу мовчки спостерігає за строєм, спльовуючи тютюн на пилюку.\n\nЯкби Рейєса попросили описати його армію одним словом, він сказав би: «справна». Тут усе на своєму місці. Уздовж злітної смуги, здіймаючи хмари червоного пилу, підрулюють транспортні C-47 Skytrain, вивантажуючи ящики з консервованим м'ясом, боєприпасами та новою формою. Вілліси, радіостанції, польові посібники, навіть цигарки в нагрудних кишенях солдатів — усе відповідає єдиному стандарту. Гондураська армія стала найбільш організованою в регіоні. І найбільш залежною.\n\nНапередодні ввечері, у галасливій кантині біля ринку, один зі студентів за сусіднім столом кинув слова, які засіли в голові Рейєса, наче піщинка між зубами: «Пітіянкі. Сторожові пси бананових королів». Тоді він промовчав. Він знав, за що готовий померти — за землю, за прапор, за країну. Але сьогодні, спостерігаючи, як іноземні літаки прокреслюють лінії в його власному небі, Рейєс уперше спіймав себе на новій думці: якщо цей потік колись припиниться, якщо двигуни за океаном замовкнуть, чи не розвалиться разом із ними все те, що вони називають армією?\n\nДесь глибоко всередині вперше заворушилося почуття тривоги: честь, дисципліна й відданість багато чого варті."
 HON_forpol.4.a: "Але без кисню навіть найсуворіший солдат довго не проживе."

 HON_forpol.5.t: "Політика Гондурасу"
 HON_forpol.5.desc: "КОНФІДЕНЦІЙНО/[GetDateText]\nВІД ДИРЕКТОРА ФБР ДЖ. ЕДГАРА ГУВЕРА\nМЕМОРАНДУМ ДЛЯ ДЕРЖАВНОГО ДЕПАРТАМЕНТУ США\nТЕМА: ОЦІНКА РЕСПУБЛІКИ ГОНДУРАС\n\n1. Аналіз поточного політичного ландшафту Гондурасу свідчить про збереження біполярної системи, у якій домінують PLH та PNH. Водночас у межах обох структур спостерігаються ознаки глибокого фракційного розколу, що потребує нашої уваги.\n2. PLH традиційно лояльна до інтересів американського капіталу, однак реформістське крило на чолі з Модесто Родасом Альварадо набирає впливу всередині партії. Родас користується широкою народною підтримкою та демонструє готовність до діалогу з лівими силами, що викликає занепокоєння серед партійної Старої гвардії. Без значних зовнішніх вливань політичного капіталу його програмі загрожує саботаж із боку внутрішнього істеблішменту.\n3. PNH, що спирається на місцеву олігархію, так само розколота. Проамериканській фракції протистоїть група «іспаністів», орієнтованих на зближення з Іберією та Японією. Аналітики відзначають прагнення керівництва запозичити модель мексиканської PRI для встановлення монолітної вертикалі влади.\n4. Збройні сили Гондурасу, попри повну залежність від американської логістики, зазнають ідеологічної ерозії. Генерал Освальдо Лопес Арельяно залишається гарантом наших інтересів, тоді як група офіцерів навколо Хуана Альберто Мельгара Кастро демонструє симпатії до доктрин Сфери спільного процвітання. Будь-яке посилення ролі армії в політиці вимагатиме превентивної нейтралізації антиамериканських елементів.\n5. Несистемна опозиція, зокрема PCH, наразі не має достатнього мобілізаційного потенціалу, щоб дестабілізувати режим, але зберігає потенціал до зростання у випадку краху нинішньої двопартійної системи."
 HON_forpol.5.a: "Родас — наша людина! Дайте йому знати, що ми підтримуємо його кампанію."
 HON_forpol.5.c: "Військові гарантують, що Гондурас залишатиметься вірним другом Америки."
 HON_forpol.5.b: "Спробуймо посилити проамериканські сили PNH у протистоянні з іншими фракціями; це може врятувати нас, якщо вони переможуть."
 HON_forpol.5.d: "Гондурасці мають самі вирішувати своє майбутнє."
 HON_election_boost_tt: "§YНаш вибір вплине на майбутнє Гондурасу.§!"

 HON_forpol.6.t: "Querida Honduras"
 HON_forpol.6.desc: "Альфонсо залишив кривавий відбиток долоні на скляних дверях. Згорблений, босоніж, одягнений у тонке лахміття, яке було на кожному робітникові бананової плантації, він змусив себе дістатися стійки реєстрації.\n\n«Доброго ранку, перепрошую», — сказав він, насилу пересуваючись, поки кров стікала з боку його голови. Молода медсестра поспішила назад, кличучи на допомогу.\n\n«Наглядач мене побив», — сказав Альфонсо, не звертаючись ні до кого конкретно.\n\nЗа кілька тижнів чиновники Міністерства соціального забезпечення нишпорили плантацією й виявили, що всі там були сліпими й глухими, як і на кожному об'єкті United Fruit Company. Звіт склали. Його підшили до справи.\n\nПідбираючи залишки їжі свого начальника, замінюючи його газети та документи, Сесілія уявляла себе на його місці. Делегаткою Національного конгресу, яка потискає руки, ділиться сигаретами й отримує «спонсорство» від американців. Їй здавалося, що це така проста робота: трохи вивчити англійську, усміхатися й кивати, раз чи двічі підписати папір — а потім заплющити очі.\n\nЇх розкладали рядами під дзижчання блідих ламп. Руки простягалися й підхоплювали золоті злитки, перевертали їх то так, то сяк, шукаючи вади, нерівності, чорні плями — але не сліди крові. Пластикові кошики для товару важили значно менше, ніж чобіт наглядача. Лише повернувшись додому, вони зішкрібали з бананів клеймо United Fruit. Але з Гондурасу його вже ніколи не зітреш."
 HON_forpol.6.a: "Зрештою, це ж був знак їхніх господарів."

 HON_forpol.7.t: "Можливості всюди"
 HON_forpol.7.desc: "Такенака Куро вмів бачити можливості навіть у найскладніших місцях. Поки його брати обирали безпечний шлях, працюючи на дзайбацу та будуючи зрештою нудні кар'єри, Куро шукав шанс розбагатіти за кордоном, просто на задньому дворі самих американців. Інші думали так само, вважаючи, що їхні статки лежать за межами Японії. Дехто був науковцями, які сподівалися публікувати праці на теми від агрономії до мезоамериканської історії. Інші були професіоналами, яким не знаходилося місця в жорстких ієрархічних структурах японського корпоративного життя і які прагнули більш вільного та гнучкого підходу в умовах менших підприємств. Якби Японія могла посилити свою присутність тут, виграли б усі вони, тож Куро знав, що в разі потреби може розраховувати на громаду японських експатріантів.\n\nАле вони були не єдині. Багато людей у Центральній Америці відчували неприязнь до Сполучених Штатів та їхнього втручання. Подібно до того, як Японія зростала раніше в цьому столітті, Куро розумів, що люди, яких роками експлуатували західний шовінізм і колоніалізм, можуть стати ефективним місцевим джерелом сили для Японії. Коли робітники гнули спини на United Fruit, принаймні частина з них починала злитися. Вони питали, чому гондурасець не може володіти землею, на якій вирощують кавові зерна та банани, або керувати підприємством не гірше за будь-якого американця. Вони питали, чому почуваються громадянами другого сорту у власних країнах, тоді як американці їздять на розкішних автомобілях і п'ють дороге шампанське. Ці питання розпалювали вогонь — вогонь, здатний спалити американський контроль над країною, якщо правильно його спрямувати. А цей попіл міг би удобрити ґрунт для сакур.\n\nТож Куро терпляче чекав, налагоджуючи зв'язки та тримаючи руку на пульсі суспільства. Він купував робітникам випивку після важкого дня й був другом для кожного потенційного союзника, якого тільки міг зустріти. Якщо вони були вогнем, то Куро був пожежником, який обережно спрямовував цю енергію, забезпечуючи контрольоване горіння."
 HON_forpol.7.a: "Куро працював із точністю хірурга."

 HON_forpol.8.t: "Дисидентський іспанізм"
 HON_forpol.8.desc: "Оскар Морель усміхнувся, коли поглянув на зал засідань. Сьогоднішні збори іспаністів зібрали найбільшу кількість людей за весь час. Кілька членів явно були військовими або колишніми військовими — їхнє коротко підстрижене волосся та суворі вирази обличчя не залишали сумнівів щодо їхньої професії. Він мав пишатися цим, адже знав, що насправді рух ледве спроможний організувати щось більше за нічні мітинги в порожніх складах. Серед них були військові, але не генерали й не командири баз. Були члени PNH, але не її політичне керівництво. Вони перебували на узбіччі, лише спостерігаючи за тим, що відбувається.\n\nВін відкинув цю думку, коли вийшов на трибуну. По один бік від нього висів великий портрет двох великих людей: каудильйо Франко та президента Трухільйо, зроблений під час останнього державного візиту іберійського лідера до Домініканської Республіки. Це були люди, які не боялися триматися прямо, демонструвати силу, і саме цю силу Оскар сподівався втілити в собі та передати присутнім сьогодні ввечері. Вони не повинні були бачити його невпевненість — вони мали бачити чоловіка, настільки ж сильного лідера, як і ці двоє.\n\n«Я бачу сьогодні багато нових облич, і це викликає в мене велику гордість. Це означає, що все більше людей прозрівають і розуміють те, що ми знали завжди: ми великий народ, який живе у великій нації. Все більше людей бачать те саме, що й ми, і відчувають огиду. Куди не поглянь — всюди янкі душать наш народ і наш потенціал. Ми гаруємо на їхніх фруктових плантаціях за жалюгідну платню, поки вони від'їжджають на своїх розкішних автомобілях. Вони купують наших політиків хабарями, поки ми ледве можемо втримати дах над головою. Вони крадуть багатства нашої країни, але насправді вони намагаються вкрасти нашу гідність! Щоб у нас не залишилося нічого, на що ми могли б спертися, і тому ми мусили покладатися на них. Але я кажу їм: я гордий іспанець!»\n\nНатовпу сподобалася його позиція проти американців, але Оскар уже знав: невдовзі йому доведеться запропонувати їм щось, за що вони зможуть виступати."
 HON_forpol.8.a: "Щотижня людей приходило трохи більше, а оплески ставали трохи гучнішими."

 HON_forpol.9.t: "Безбілетник на USS «Гондурас»"
 HON_forpol.9.desc: "Віктор Уркіді поправив окуляри й сьорбнув мінеральної води, сидячи в прохолодному холі Gran Hotel Lincoln. За сусіднім столиком менеджери United Fruit голосно вимагали віскі, поводячись так, ніби їм належали не лише плантації, а й уся Тегусігальпа. Уркіді, із британською стриманістю, набутою в коридорах Лондонської школи економіки, дозволив собі лише ледь помітну посмішку.\n\nАмериканці сприймали цю країну як свій непотоплюваний авіаносець. Але через свою імперіалістичну самовпевненість вони не помітили нових пасажирів на борту. Поки янкі накликали на себе гнів націоналістів, мексиканці методично займали ніші, які гіганти вважали надто незначними.\n\nПогляд Уркіді ковзнув до вікна. Поки американці прокладали маршрути для експорту бананів, інженери з ICA тихо вигравали тендери на укладання асфальту. Фундаменти нових готелів заливали бетоном Cemex, а самі пляшки для Coca-Cola, яку пили американські туристи, виготовлялися на заводах Vitro.\n\nУркіді зробив акуратний запис у своєму блокноті. Мексиканські компанії проникли всюди. І поки «капітан» корабля оплачував квитки політичним капіталом, Мексика насолоджувалася подорожжю як безквитковий пасажир, збираючи прибутки в тіні."
 HON_forpol.9.a: "Непомітність теж має свої переваги."

 HON_forpol.10.t: "Накопичувальний ефект"
 HON_forpol.10.desc: "Навіть невеликі частки мали властивість зростати. Такенака Куро пам'ятав, як уперше прибув до Гондурасу: менш ніж одне підприємство зі ста мало японського власника. Але за кілька коротких років усе змінилося. Юридичні контори з японськими прізвищами на вивісках відкривали свої двері й приймали клієнтів, і вже ніхто не вважав це дивним. Не було незвичним побачити японського консультанта, який розмовляв із власником підприємства, обговорюючи переваги й недоліки його річної стратегії. Японці володіли вантажними суднами, японські інвестори мали частки в портах, але багатьом кораблям усе ще доводилося проходити через Канал, що подовжувало маршрут і збільшувало вартість перевезень.\n\nНіппон отримував певний прибуток від торгівлі, але не надто великий. Сфера мала широкий доступ до багатьох товарів, які Гондурас міг виробляти самостійно, що робило конкурентне середовище жорстким. Сфера вже користувалася низькою вартістю праці в Азії серед країн-учасниць, через що гондураським підприємствам було важко конкурувати з іншими державами за ціною. Найкращим способом отримати прибуток було викуповувати підприємства та надавати початковий капітал для нових проєктів; податки, які інвестори сплачували у себе на батьківщині, були головною вигодою, яку сама Японія отримувала від зусиль Куро за півсвіту від дому.\n\nНайбільшою вигодою для Японії було відсувати американців убік. У рамках боротьби та суперництва Холодної війни все, що шкодило Америці, зміцнювало Японію. Кожна велика держава живилася кров'ю іншої. Це вже саме по собі було вигодою, а разом із портфелем акцій Куро зростав і його престиж. Його брати вважали його надто великим авантюристом, щоб так далеко їхати від дому, але тепер їм доводилося замислитися: а що, як він справді відчув пульс майбутнього? Куро був сучасним пророком прибутку."
 HON_forpol.10.a: "До нових висот."

 HON_forpol.11.t: "Гондурас у складі OFN?"
 HON_forpol.11.desc: "Цієї ночі Тегусігальпа не спала. Місто накрила Червона хвиля. Тисячі прихильників Ліберальної партії, розмахуючи багряними прапорами, скандують ім'я свого кумира. Коли Модесто Родас Альварадо виходить на балкон Старого президентського палацу, рев натовпу заглушає навіть церковні дзвони.\n\nВін піднімає руки, закликаючи до тиші, і його голос лунає над площею: «Занадто довго ми жили, схиливши голови! Занадто довго нам казали, що наша доля — лише вирощувати врожай для чужих столів. Але сьогодні ми відповідаємо одностайно: досить! У наших жилах тече кров Морасана. Ми збудуємо школи там, де колись були лише казарми. Ми принесемо світло туди, де панувала прадавня темрява. Сьогодні ми перестаємо бути глядачами власної історії!»\n\nЗа годину атмосфера в кабінеті президента була зовсім іншою. Родас втомлено опустився у крісло, скинувши із себе образ голосу народу, і налив собі віскі. «Вражаюча вистава, Модесто», — усміхнувся посол Берроуз. «Наші друзі з United Fruit у Бостоні з полегшенням зітхнули, почувши, що твій «радикалізм» обмежився красивими метафорами про світло та школи».\n\nРодас зробив довгий ковток, дивлячись на американця поверх краю склянки. «Не будемо плекати ілюзій, Чарльз. Я знаю, хто платить за цей бенкет. Coca-Cola, Standard Fruit... Їм належать земля, дороги й, мабуть, навіть це крісло. Але натовпу внизу... якщо я не можу дати їм хліб прямо зараз, я мушу дати їм гордість».\n\nВін невимушено посунув до посла теку. «Членство в OFN. Для вас це нічого не коштує — просто ще один прапор на флагштоку. Але для мого народу це ілюзія, що ми сидимо за одним столом із велетнями. Дайте мені цей козир, Чарльз, дайте мені цю нагрудну відзнаку, і я гарантую, що ваші банани завантажуватимуть у портах без страйків»."
 HON_forpol.11.a: "Великі плани для великих мрій."

 HON_forpol.12.t: "Гондураський Новий курс"
 HON_forpol.12.desc: "Модесто Родас Альварадо любив Гондурас настільки, що хотів би бачити його більшим. Націю потрібно було розбудовувати, а для цього був потрібен уряд, готовий будувати масштабно й мріяти ще масштабніше. Колись, лише кілька десятиліть тому, американці мали таке саме бачення. Управління долини Теннессі принесло електроенергію в регіон, який раніше вважали глухим закутком. Була створена пенсійна програма, щоб люди похилого віку могли комфортно провести свої золоті роки, а працівники могли бути впевнені, що коли настане їхня черга, про них також подбають. Шосе, дамби, уся життєво необхідна інфраструктура, якої потребувала нація, з'явилася завдяки угоді між урядом і народом, якого він представляв. Альварадо знав, що таку саму угоду можна укласти — і доведеться укласти — між його адміністрацією та народом, якщо Гондурас хоче пізнати процвітання.\n\nСкептики сказали б, що їм бракує грошей, що їм бракує можливостей, але насправді їм бракувало віри. Історія була сповнена людьми, які могли кожному зустрічному розповісти, чого неможливо зробити. Нічого не робити було легко, саме тому так багато людей регулярно цим займалися. Коли ти щось робиш, то ризикуєш вкласти в це себе, а потім побачити, як усе провалиться, і саме ця боягузливість визначала політичне життя. Нічим не ризикувати, нічого не здобути й убезпечити себе від будь-якої шкоди — такою була панівна політична думка. Ціну за це платив народ, але то вже була його проблема.\n\nДосить. Гондурасу було потрібно щось із минулого, щоб забезпечити своє майбутнє. Це вже працювало раніше — і могло спрацювати знову. Для цього потрібна була сміливість ризикнути й повірити, що Гондурас може стати більшим, ніж він є зараз, і саме для цього один чоловік отримав мандат від народу. Альварадо лише мав піти на ризик і наважитися мислити масштабніше, ніж будь-який гондураський політик до нього."
 HON_forpol.12.a: "За тих, хто мріє."

 HON_forpol.13.t: "Ліберальне пророцтво"
 HON_forpol.13.desc: "Родас Альварадо був лідером цілої нації та політичної партії, яка нею керувала, і все ж останніми тижнями він почувався чи не найсамотнішою людиною в усьому Гондурасі.\n\nКоли після інавгурації він заговорив про необхідність запровадження нових програм, які б допомогли людям вибратися з бідності, та про будівництво великих суспільних об'єктів, якими вони могли б користуватися, весь Національний конгрес аплодував йому. Народ називав його «Будівничим» і з нетерпінням чекав на нову країну, яку він мав створити. Його власна партія називала його Великою Людиною Надії та підштовхувала вперед як новий символ PLH.\n\nТепер усе змінилося. Його власна партія почала стримувати його амбіції, висловлюючи на засіданнях комітетів занепокоєння, що він надто сильно штовхає країну вліво, що партія дедалі більше відштовхуватиме народ і втратить будь-який шанс знову отримати його мандат на наступних виборах. Він більше не був Великою Людиною Надії — тепер його, здавалося, виставляли каменем на шиї партії. Родас захищав свої програми, посилаючись на результати Сполучених Штатів у 1930-х та 1950-х роках, але це мало допомагало. На кожного чоловіка, якого йому вдавалося переконати, знаходився інший, який посилався на американські невдачі як на причину обрати інший курс. Замість того щоб приходити на засідання комітетів із надією започаткувати нові проєкти, він дедалі частіше мусив захищати власні ініціативи, часом навіть від тих самих людей, які допомагали їх розробляти.\n\nНа вулицях ситуація була ще гіршою. Там люди називали його «Безвідповідальним» і відкрито боялися інфляції та економічної рецесії. Поширювалися чутки, що він заборонить церкву або скасує приватну власність, і з кожним разом у цих чутках ставало все менше перебільшень. У Національному конгресі Родас міг навести аргументи, але як саме йому було спростовувати звинувачення в тому, що він таємно готує країну до перетворення на новий Радянський Союз? Кожну його публічну заяву опозиція висміювала, перекручувала й повертала своїм виборцям, доки Альварадо не перетворився на не більше ніж лівий привид, страшилку, якою лякають народ."
 HON_forpol.13.a: "Здавалося, його опозиція не має меж, і Альварадо дедалі більше втомлювався."

 HON_forpol.14.t: "Розлітається з полиць"
 HON_forpol.14.desc: "Гондурасці святкують перемогу Круса Уклеса з Національної партії Гондурасу на виборах 1966 року. Уклес відзначив свою перемогу в штаб-квартирі PNH у Тегусігальпі, а свою перемогу ознаменував промовою із закликом до Гондурасу утвердитися як суверенна нація. Уклес висловив скептицизм щодо нинішнього партнерства з Гондурасом, заявивши, що американська присутність послабила економічну міць Гондурасу та перешкодила його розвитку.\n\nPNH загалом розділена щодо присутності OFN. Невелика більшість виступає за скорочення зв'язків зі Сполученими Штатами та OFN без повного розриву відносин, зосереджуючись насамперед на посиленні внутрішнього контролю Гондурасу над власною економікою та просуванні гондураських підприємств замість американських компаній з іноземним капіталом. Деякі члени PNH підтримують збільшення частки гондураської власності в американських компаніях, що працюють у Гондурасі, інші виступають за протекціоністські заходи, які дали б гондураським фірмам більші конкурентні переваги. Інша, менша за чисельністю фракція підтримує офіційне погіршення відносин зі Сполученими Штатами та OFN. Дехто з цих фракцій виступає за налагодження місцевих зв'язків з іншими державами Центральної Америки, інші ж прагнуть партнерства з більшими державами з віддалених країв.\n\nТонкощі розколу PNH щодо питання Сполучених Штатів губляться в пресі, яка публікує заголовки від «Новий президент Гондурасу прагне скоротити зв'язки з OFN» до «Чи відмовиться Гондурас від статусу партнера OFN?» і аж до «Уклес зневажає Америку, прагне вийти». Тривога в країні змушує людей купувати газети, тож заголовки продовжують з'являтися, а газети — розкуповуватися. Новини, покликані інформувати, виявили, що достатня неоднозначність може бути досить прибутковою."
 HON_forpol.14.a: "Вир паперу."

 HON_forpol.15.t: "Новий бос"
 HON_forpol.15.desc: "Захопити ринок ніколи не було легко. Потрібно було пропонувати першокласний товар за чудовою ціною, а це означало мати команду першокласних працівників, відмінне обладнання та чималу частку удачі. Потрібно було точно знати, кому продавати, де встановити ціну для максимізації прибутку, а також уміти збирати інформацію швидше за всіх інших. Щоб досягти такого успіху, аби твоє ім'я стало загальним словом, потрібно було вкладати в справу всю душу.\n\nЗробити це було майже неможливо, а стабільно повторювати успіх — ще складніше. Але Мелвін Крісанто знайшов простіший спосіб — просто пожертвувати гроші правлячій політичній партії, і вона сама могла усунути конкурентів.\n\nКоли державним підприємствам були потрібні пожертви, Мелвін знав, що одного простого внеску буде достатньо, аби забезпечити собі контрольний пакет. Менші фірми часто раптово стикалися з потребою в грошах через державні регуляції, а коли вони не могли заплатити, їм доводилося продавати свої активи, і Мелвін знав, що до цього моменту вони вже будуть достатньо відчайдушними. Здавалося, всі великі фірми встановлювали однакові ціни та визначали території, де кожна могла отримати виключні права й не боятися конкуренції. Здавалося, що вони координуються якимось дивом, але насправді це була лише сила організації.\n\nPNH хотіла бачити Гондурас процвітаючою та незалежною нацією, а для цього її народ мав працювати разом. Щоб залишатися сильними, вони не могли терпіти жодних одинаків, здатних зруйнувати структуру зсередини. Ті, хто засуджував несправедливі практики, просто не розуміли, як працює ця гра. Безжальних людей вистачало всюди, а щоб скористатися перевагами, треба було самому бути безжальним. Краще Мелвін, ніж якийсь далекий янкі."
 HON_forpol.15.a: "Те саме, що й старий бос."

 HON_forpol.16.t: "Державні інституції"
 HON_forpol.16.desc: "Від: Управління у справах Центральної Америки\nМеморандум для директора\nАналітичний розвідувальний звіт: Підрив демократичних норм у Гондурасі\n\nПравляча партія Гондурасу, Національна партія Гондурасу (PNH), запровадила низку антидемократичних заходів, покликаних убезпечити її від майбутніх поразок на виборах через невдоволення населення партією та зростання популярності опозиційної Ліберальної партії Гондурасу (PLH). Ці заходи дозволять вбудувати партійний апарат PNH у раніше незалежні інституції, підірвавши довіру до виборів у країні шляхом використання соціальних важелів влади для послаблення кандидатів від опозиції.\n\nАналітики прогнозують, що ці заходи не лише послаблять демократію Гондурасу, а й знизять ефективність державних інституцій, оскільки в цих структурах лояльність поступово замінить компетентність як головний критерій для призначення на керівні посади. Аналітики прогнозують, що заходи PNH можуть у короткостроковій перспективі придушити інакомислення, але в середньо- та довгостроковій перспективі лише посилять народне невдоволення партією.\n\nРозмивання демократичних норм також створює нову загрозу американським інтересам у Гондурасі, якщо PNH відмовиться від проамериканських настроїв, намагаючись залучити прямі іноземні інвестиції з Німеччини чи Японії. Якщо до влади прийде новий лідер PNH з антиамериканськими поглядами, персоналістське керівництво партії стане чинником ризику, дозволивши швидше відвернутися від американського впливу, ніж це було б за інституціоналістського лідера. Водночас лідери опозиції, ймовірно, займуть ще більш радикальну антиамериканську позицію, якщо США й надалі підтримуватимуть позитивні робочі відносини з PNH, що дасть Німеччині, Японії чи Мексиці можливість значно легше впливати на лідерів опозиції."
 HON_forpol.16.a: "Але вони все ще проамериканські?"

 HON_forpol.17.t: "Чи може переворот врятувати демократію?"
 HON_forpol.17.desc: "Хосе надто добре пам'ятав 1960 рік. Він пам'ятав той самий липкий страх, що висів у розпеченому повітрі, і той самий металевий присмак на язиці. Він думав, що ті часи залишилися в минулому, що Гондурас переріс хворобу «генералісимусів», яка мучила його сусідів. Але сьогодні історія знову вдарила його в живіт.\n\nУсе почалося біля мерії. Жодних сирен — лише гуркіт вантажівок Studebaker та тупіт важких чобіт. Хосе стояв у натовпі, стискаючи в кишені пачку сигарет, і дивився, як мера — чоловіка, за якого він проголосував лише місяць тому, — витягли на вулицю. Сорочка чиновника була розірвана, обличчя закривавлене, але найбільше лякало вираження його очей: цілковите, нищівне нерозуміння. Поруч блідий віцемер метушився, бурмочучи щось про «тимчасові заходи», але офіцер, який керував арештом, навіть не глянув на нього. Він дивився поверх голів натовпу, наче шукав когось у протилежних вікнах.\n\nА ввечері радіо ожило голосом Освальдо Лопеса Арельяно. Той самий тембр, ті самі слова про «порятунок нації від хаосу», що й шість років тому. Наче заїжджена платівка, яку ніхто не просив вмикати. Сусід Хосе, старий докер, плюнув на землю: «Учора в порту бачили грінго. Тих самих... із валізами». Хосе мовчки кивнув. Він знав цей сценарій. Завіса стабільності впала, відкривши ту саму потворну сцену за нею, де місцеві актори танцюють під чужу мелодію. Гондурас більше не є винятком."
 HON_forpol.17.a: "Гондурас став таким самим, як і всі інші."

 HON_forpol.18.t: "Американізація"
 HON_forpol.18.desc: "У банкетному залі готелю Honduras Maya дзенькіт срібних столових приборів заглушає будь-які думки про те, що відбувається за стінами цього кондиціонованого раю. За головним столом генерал Арельяно обмінюється жартами з віцепрезидентом Standard Fruit, а офіціанти в білосніжних рукавичках розливають крижане каліфорнійське ігристе вино.\n\nЗа сусіднім столом молодий технократ, який щойно повернувся зі Штатів, палко пояснює сивочолому землевласникові: «Ви маєте зрозуміти, дон Гектор, держава — це анахронізм. Вона не повинна лікувати, навчати чи будувати. Її єдиним завданням має бути гарантування недоторканності контракту». Землевласник задоволено киває, погладжуючи вуса. Для нього ці модні слова означають одне: ніхто не питатиме, чому його робітники живуть у халупах із пальмового листя, тоді як прибутки течуть рікою.\n\nСлово «корупція» тут вважається непристойним, наче відрижка за столом. Ніхто вголос не каже, що контракт на електрифікацію півночі отримала фірма, зареєстрована на дружину міністра інфраструктури. Ніхто не згадує, що податкові пільги для United Fruit були написані юристами самої компанії в цій самій кімнаті тиждень тому. Тут це називають «партнерством», «синергією», «створенням сприятливого клімату». Це дивовижний світ, де інтереси нації якимось дивом завжди збігаються з інтересами десятка родин і двох-трьох корпорацій із Бостона.\n\nІ, мабуть, найважливіше — схвальні кивки американських гостей. Їхні посмішки сяють яскравіше за люстри. Вони бачать «тріумф вільного підприємництва». Якщо капітал задоволений, то й вони задоволені. А якщо задоволений Вашингтон, місцева еліта може спати спокійно, знаючи, що їхній маленький затишний світ надійно захищений від будь-яких бур, що вирують унизу, в долині бідності."
 HON_forpol.18.a: "Усе на краще в найкращому з усіх можливих світів."

 HON_forpol.19.t: "Загроза безпеці"
 HON_forpol.19.desc: "Полковник Мендоса з гондураської армії спостерігав із вікна свого кабінету, як унизу, на площі Морасана, патруль у новенькому американському спорядженні притиснув групу студентів обличчями до асфальту. Глухий удар кийка, потім ще один. Жодних зайвих рухів — лише холодна ефективність. Для Мендоси це видовище було найкращим доказом того, що система працює.\n\nНа його думку, життя без безпеки не варте й копійки, а американські інструктори з ФБР лише підтвердили цю істину, надавши інструменти для її забезпечення. Полковник вважав, що шлях до порядку неминуче лежить через застосування сили. Комуністи, фашисти, профспілкові агітатори — ярлики не мали значення. Значення мала лише наявність «цвяхів» для американського молотка, який тепер тримала поліція.\n\nПогляд полковника ковзнув по випадковому перехожому, який поспішав повз місце арешту. Звичайний чоловік здригнувся, але пришвидшив крок, радіючи, що сьогодні кийок не опуститься на його спину. Можливо, серед затриманих був невинний чоловік, який просто опинився не в тому місці й не в той час. Але для Мендоси це була лише статистична похибка. Поліцейська робота — брудна справа, і якщо якийсь бідолаха проведе кілька днів у камері, рахуючи синці, — це невелика ціна за загальний спокій. Зрештою, у світі Мендоси невинність була лише тимчасовим станом, а страх — найнадійнішим фундаментом порядку."
 HON_forpol.19.a: "Безпека — це ключ."

 HON_forpol.20.t: "Післямова"
 HON_forpol.20.desc: "«Вітаю з нищівною перемогою. Так, звісно...» Джеймс закотив очі. Здавалося, ентузіазму його гондураського співрозмовника не заважала навіть величезна відстань між ними.\n\n«Якщо те, що ви кажете, правда, тоді ми, безперечно, можемо очікувати, що президент Родас дотримається своєї обіцянки... так, я розумію, але я не про це. Ми значною мірою підтримували вас протягом усієї війни. Я лише питаю, чи дозволить йому, як ви кажете, здобутий політичний капітал зміцнити... так, гондурасько-американське співробітництво...» Джеймс сперся головою на одну руку, намагаючись не повністю ігнорувати все, що говорив гондурасець. Соціальні програми, демократія і...\n\n«Можете повторити останню частину? Що означає "підтримка"? Що саме вам потрібно? Війна закінчилася, і ми...» Звісно, їм хотілося більшого. Їм завжди мало. Усе, що для них уже зробили, ніколи не було достатнім. Ніколи.\n\n«Гаразд, гаразд, ви отримаєте те, що вам потрібно. Тільки, будь ласка, нагадайте президенту, що ми щиро вітаємо його і підтримуємо його бачення, як він нам його описував...» Джеймс жбурнув слухавку. «Довбані п'явки». Але зараз він не міг дозволити собі загострювати з ними відносини; Бюро не дозволило б йому цього, особливо через відносно невелику суму, яку вони просили.\n\nНа тому кінці лінії запала тиша. Хуан підвівся зі свого столу, пишаючись собою. З американцями було легко мати справу; усе, що потрібно, — знати, як із ними розмовляти. Їхня допомога сприятиме кампанії президента, а Гондурас зможе швидко оговтатися від війни. Вступ до OFN — хороша ідея хоча б з цієї причини. Американці нададуть..."
 HON_forpol.20.a: "А все, що потрібно, — просто чемно попросити."

 HON_forpol.21.t: "Гондурас просить американської допомоги"
 HON_forpol.21.desc: "ТАЄМНО/[GetDateText]\n\nВІД МОРРІСА РОБЕРСОНА\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ВІЙСЬКОВА ДОПОМОГА УРЯДУ ГОНДУРАСУ\n\n1. Ми отримали прямі запити від Гондурасу щодо подальшого посилення нашої підтримки його уряду, як шляхом збільшення постачання озброєнь, так і шляхом безпосереднього розміщення військ у регіоні. Хоча це не було прямо заявлено, таке посилення, ймовірно, також призведе до певної форми американського втручання в регіоні, принаймні в короткостроковій перспективі, щоб допомогти стабілізувати ситуацію проти Комуністичної партії Гондурасу.\n\n2. У прямому повідомленні з Гондурасу було зроблено запит на розміщення там 1 000 американських військовослужбовців, з огляду на посилення опору нинішньому режиму Освальдо Арельяно. Вони надали нам відносну свободу у виборі місця розташування бази, однак місцеві американські аташе наполягають на розширенні вже існуючих баз у регіоні, і ми, ймовірно, будемо інтегровані до гондураської міліції.\n\n3. Іноземні інтервенції завжди коштують дорого, але переваги значно переважають витрати. Тегусігальпа була непохитно лояльним союзником, а сам Арельяно був твердим союзником американських корпорацій у країні. Зростання активності КМП стало для них дедалі більшою проблемою, про що нам особливо часто повідомляє United Fruit Corporation. Додаткова підготовка до бойових дій у джунглях також допоможе нам готуватися до конфліктів у Південно-Східній Азії та Африці."
 HON_forpol.21.a: "Схоже, Гаїті знову дає про себе знати."

 HON_forpol.22.t: "Що залишилося від Оланчо"
 HON_forpol.22.desc: "Луїс намагався говорити, але кров у горлі душила його слова. Він закинув голову, а з плеча досі сочилася кров, і вчепився пальцями в землю, щоб поглянути на село, охоплене полум'ям. Незабаром повз нього пробігла мати, міцно притискаючи дитину до грудей. Він уже бачив цю жінку. Насправді, багато разів. Хіба не він позичив її родині віз минулого місяця? Постріл із пістолета перервав його спробу пригадати, тіло жінки напружилося, а потім безвольно впало на землю. Тоді в поле зору ступив чоловік у кашкеті, стискаючи в руці димлячий пістолет. Оливково-зелена форма, подумав Луїс. Він уже бачив її, а також зірки та смуги на рукаві. До кінця свого життя він ніколи цього не забуде.\n\nЗа межами Катакaмаса представники United Fruit Company оглядали плантацію на вершині сусіднього пагорба після пошкоджень, завданих страйком робітників напередодні. Поруч із випрасуваними костюмами, що намокли від джунглевої спеки, американські солдати пильно стежили за робітниками внизу, які продовжували збирати врожай. Один із робітників, засмаглий чоловік із обличчям, вкритим зморшками, підвів стомлений погляд на солдатів. У відповідь він отримав лише байдуже відсторонений погляд.\n\n«Ось там, там!» У прикордонних районах Сан-Естебана гондураські солдати оточили невеликий напівзруйнований бетонний комплекс після того, як озброєні бойовики захопили одну з будівель. У вікнах можна було побачити цивільних, що юрмилися на першому поверсі; сім'ю або навіть кілька сімей, які лежали всередині. Американський радник при цьому загоні солдатів гаркнув наказ, і до позиції піднесли M20 Super Bazooka.\n\nПісля крику «Вогонь!» ракета влетіла в одне з вікон, випустивши спалах світла й клуби диму зсередини будівлі. Бойовик, стискаючи залишки своєї закривавленої лівої руки, похитнувся, виходячи з будівлі, але його зустріла злива куль від солдатів. Спостерігаючи за сценою здалеку, американець усміхнувся."
 HON_forpol.22.a: "«Місію виконано», — кивнув він під рев полум'я."

 HON_forpol.23.t: "Ідеологи та прагматики"
 HON_forpol.23.desc: "Відтоді, як Крус Уклес переміг на виборах, посол Джозеф Джова знав, що рано чи пізно йому доведеться визначитися зі стратегією переговорів — він просто ніяк не міг зрозуміти нового президента Гондурасу. Під час передвиборчої кампанії той багато говорив про суверенітет Гондурасу та експлуатацію з боку OFN, але водночас PNH здебільшого тихо підтримувала відносини з американцями — чи то заради прибутку, чи то з прагматичних міркувань, зважаючи на те, наскільки близько знаходяться США. То він був ідеологом чи просто використовував антиамериканські настрої, бо це добре звучало для виборців?\n\nВін завжди міг перейти до жорсткої гри з новим президентом і пригрозити виведенням інвестицій з економіки Гондурасу, якщо той не погодиться на певні заходи для збереження спадкоємності. Втрата капіталу та обладнання неодмінно створила б економічний дефіцит, який прямо поклали б на нового президента, хоч би як він намагався пояснити ситуацію ЗМІ. Джова не любив грати жорстко, коли мав вибір, але знав: іноді деякі політичні гравці просто не здатні нормально співпрацювати, доки не смикнеш їх за ланцюг.\n\nЯкщо ж Крус був справжнім ідеологом, це дало б йому всю необхідну зброю для подальшого віддалення від OFN. Верacruzький пакт був би радий втрутитися, але Джова знав, що справжніми покровителями стануть члени Сфери. Лише вони мали достатньо грошей і бажання інвестувати у віддалений Гондурас, а Крус, без сумніву, проковтнув би їхню брехню за безцінь. Якщо він був ідеологом, найкращим варіантом було б запропонувати більші інвестиції у формі спільних підприємств, надавши гондурасцям більшу частку в управлінні власною економікою.\n\nЗвісно, якщо він був просто таким самим корумпованим політиком, завжди залишався варіант підкупити ключових партійних функціонерів. Американські інвестиції, що зрештою опинялися б у кишенях PNH, означали б слухняну партію, яка багато говоритиме, але зрештою нічого не змінить."
 HON_forpol.23.a: "«Можливо, кілька внесків для ключових членів PNH змінять ваше ставлення до США»."
 HON_forpol.23.b: "«Ми можемо продемонструвати наше партнерство, підтримавши кілька спільних гондурасько-американських ініціатив»."
 HON_forpol.23.c: "«Можливо, нам доведеться скоротити деякі інвестиції за відсутності чіткіших зобов'язань перед OFN»."

 HON_forpol.24.t: "Південна стратегія"
 HON_forpol.24.desc: "«Поглянь на це». Артур виплюнув ці слова, дедалі більше дратуючись, і поклав щойно надрукований звіт на стіл Роберта. Той насупився, читаючи документ, і невдовзі його обличчя скривилося в легкій гримасі. «А найгірше? Вони цілком можуть перемогти. Довбані гондурасці».\n\nУспішно мобілізувавши свій націоналістичний електорат і здобувши перемогу на виборах лише кілька років тому, Національна партія Гондурасу прагнула отримати ще один термін при владі, на превеликий жаль Федерального бюро розслідувань. Бюро справді значно інвестувало протягом попередніх років у створення стабільної Ліберальної партії, здатної як керувати, так і вести передвиборчу кампанію, але все одно недооцінило набрану націоналістами інерцію. Маючи необхідні інституції та електоральну базу для ще однієї перемоги, перспективи Ліберальної партії стрімко згасали. Треба було щось робити, інакше Бюро ризикувало залишитися ні з чим після всіх своїх зусиль.\n\nРоберт відкинувся на спинку крісла, не зводячи очей зі звіту. Потім він зчепив руки. «Ми можемо змусити це працювати», — припустив він. «Націоналісти апелюють до націоналістичного електорату? Гаразд. Нехай. Ліберали теж можуть зіграти в цю гру». Він підвівся з-за столу й рушив офісом, а Артур ішов слідом. Дійшовши до найближчого ліфта, він натиснув кнопку третього поверху; перед наступним кроком йому потрібно було проаналізувати деякі фінансові показники.\n\n«...Який саме у тебе план, Роб?» Артур підняв брову, нервово стоячи біля ліфта, коли його двері роз'їхалися. Роберт обернувся, хитро посміхаючись."
 HON_forpol.24.a: "«Здається, ми щойно знайшли новий підхід!»"
 HON_forpol.24.b: "«Залиш гондураський націоналізм націоналістам, Роб. Господь знає, що в них його й так небагато»."

 HON_forpol.25.t: "Мапа минулого та майбутнього"
 HON_forpol.25.desc: "ТАЄМНО // ЛИШЕ ДЛЯ СЛУЖБОВОГО КОРИСТУВАННЯ\nТЕМА: Оцінка післявоєнної ситуації в Гондурасі\n\nОновлені розвідувальні дані з Тегусігальпи змальовують картину, до болю знайому кожному ветерану латиноамериканського відділу. Це класична дилема, що переслідує зовнішню політику США відтоді, як ми вперше вирушили в море на пошуки чудовиськ: як узгодити наші ідеали з нашими інтересами.\n\nПеремога в конфлікті з Сальвадором радикально змінила внутрішню ситуацію. Режим генерала Лопеса Арельяно, який ми делікатно називаємо «легалістською диктатурою», виконав свою частину домовленості: порядок відновлено, кордони захищено. Формально демократичні інституції функціонують — Конгрес засідає, суди працюють, вибори проводяться. Але будьмо чесними, принаймні в межах цього кабінету: це фасад. Тінь спецслужб накриває навіть найвіддаленіші села, а політична опозиція існує лише доти, доки не стає надто гучною.\n\nТим не менш, ми змушені визнати: Арельяно переміг не лише у війні, а й у боротьбі за уми. На вулицях більше не питають, коли повернеться демократія. Генерал перетворився з узурпатора на рятівника нації, а його PNH — на єдину легітимну політичну силу.\n\nЦей банальний, але ефективний авторитаризм викликає змішані почуття. Ми створили стабільного монстра, щоб протистояти хаосу в регіоні. Єдине питання полягає в тому, чи зможемо ми коли-небудь виправити те, що самі допомогли побудувати, коли пил осяде..."
 HON_forpol.25.a: "Якщо він узагалі коли-небудь осяде."

 HON_forpol.26.t: "З особистого щоденника..."
 HON_forpol.26.desc: ""Тегусігальпа, [?global.date.GetDateStringNoHourLong].\n\nДощ барабанить по бляшаному даху, а третя склянка бурбону нарешті починає діяти. Кляте це місто. І клятий Вашингтон із їхніми памфлетами про «маяк свободи».\n\nГондурас мав стати гарною картинкою для преси. Демократичний експеримент, вітрина успіху. Місцеві кивали, усміхалися й годували нас обіцянками виборів, поки країна залишалася в стані застою. А сьогодні цей фарс завершився. Їхній слухняний Конгрес нарешті «обрав» президента. І хто в'їжджає до палацу під звуки фанфар? Освальдо Лопес. Той самий генерал, чиє повалення ми подавали як велику перемогу.\n\nПентагон зараз шаленіє. Не через страждання місцевих селян — їм до цих селян байдуже, аби тільки банани завантажували на кораблі. Вони шаленіють тому, що ми виглядаємо ідіотами. Ми витратили роки й мільйони, щоб замінити лояльного диктатора на... лояльного диктатора, тільки тепер із мандатом парламенту. Ми самі вручили йому ключі на срібній таці.\n\nПо суті, нічого не змінилося. Лопес — наш сучий син, він знає, як тримати стрій і не пускати сюди червоних чи фашистів. Але, Боже, як же паршиво усвідомлювати, що весь цей цирк із «демократизацією» був потрібен лише для того, щоб повернути старого пса до тієї самої будки.""
 HON_forpol.26.a: "Закрити записник і налити ще."

 HON_forpol.27.t: "Гондурас в ОВН"
 HON_forpol.27.desc: "Здавалося, що половина всього Гондурасу зібралася в парку Ла-Леона, оточивши платформу, де Модесто Родас Альварадо виголошував свою промову. Прохолодний вітер колихав дерева, що затіняли Родаса, і розносив його голос по всій Тегусігальпі навіть без мікрофонів.\n\nРодизм розквітав у натовпі; Родас успішно перетворив військову перемогу на масштабну програму політичних та економічних реформ, водночас завоювавши прихильність гондураської громадськості. Його останнім досягненням стало успішне завершення переговорів щодо вступу Гондурасу до ОВН як повноправного члена. Американська громадськість зацікавилася цією подією, тож, природно, на ній були присутні чимало американських журналістів.\n\nУ «Нью-Йорк Таймс» було чудове місце, досить близько до платформи й під таким кутом, щоб відблиски сонця не псували фотографії. «Лос-Анджелес Таймс» розташувалася майже впритул, і журналісти штовхалися, намагаючись отримати найкращий ракурс. А «Чикаго Триб'юн» якимось чином опинився затиснутим у натовпі усміхнених літніх індіанок, які тримали в руках чудові квіткові вінки.\n\nУ кампанії Родаса проти корупції, його економіці в дусі Нового курсу та особистій харизмі американці побачили нового ФДР — справжнього ліберального каудильйо. Це вийшло за межі простої цікавинки й переросло у щиру прихильність до нового члена альянсу проти тиранії. Того місяця Родас опинився на обкладинці журналу «Тайм»."
 HON_forpol.27.a: "Родизм і для янкі."

 HON_forpol.28.t: "Heredero Aparente"
 HON_forpol.28.desc: ""Що ж, — Артур потер щетину й зітхнув, — схоже, зрештою все склалося добре, чи не так?» Він влаштувався біля столу Роберта; десь у протилежному кінці офісу лунав віддалений телефонний дзвінок. Сам Роберт лише знизав плечима — його думки були схожими на думки Артура. Чого ще можна було очікувати від залізної хватки Родаса над Ліберальною партією Гондурасу і, через неї, над усім Гондурасом? Було цілком природно, що з'явиться наступник, прийнятний для нього, ретельно вихований відповідно до його точних мірок і стандартів, який продовжуватиме його спадщину десятиліттями. Схоже, цією людиною мав стати Роберто Суасо Кордова. Для ФБР це була просто робота. Добре виконане завдання, наскільки сприятливо все це виглядало на папері.\n\n— Не те щоб Родас після цього кудись зникне, — відповів Роберт, викликавши у Артура різке похитування головою. — Багато хто в Гондурасі бачить у ньому, ну... — потрібне слово не спадало йому на думку, і він махнув рукою в повітрі. — Державного діяча, розумієш? Джерело стабільності в Тегусігальпі. — Він тихо хмикнув від цієї думки. — Рідкісне явище, якщо говорити про Центральну Америку.\n\n— О, безперечно. — Артур дістав із лівої кишені пачку й витягнув сигарету. — Його вплив ще деякий час залишатиметься... — Він на мить подивився на Роберта з надією в очах. Зрозумівши натяк, той дістав запальничку з кишені сорочки й підпалив сигарету свого друга, поки Артур нахилявся над його столом. Зробивши затяжку, він знову зітхнув. — І все ж, що щодо комуністів? Не те щоб вони перемогли, звісно, але...\n\n— Розумію. Вони відреагують погано, — відповів Роберт, знову знизавши плечима. — Принаймні поки що Суасо з цим упорається. — З цією думкою Роберт повернувся до друкарської машинки й продовжив стукати клавішами над наполовину завершеним звітом про менш щасливих сусідів Гондурасу. — На Гондураському фронті все тихо.""
 HON_forpol.28.a: "Де підноситься Суасо, там залишається Родас."

 HON_forpol.29.t: "Звернення генерала Мельгара Кастро, 1970 рік"
 HON_forpol.29.desc: ""Громадяни Гондурасу! Сини й доньки Морасана!\n\nСьогодні я звертаюся до вас не просто як генерал, а як захисник честі, яку надто довго топтали чужоземні чоботи. Подивіться на наші порти — чи бачите ви кораблі, що відпливають, забираючи тих, хто десятиліттями вважав нас своєю власністю? Для них ми були не більше ніж садом на їхньому задньому дворі. Вони скуповували наших політиків, наче худобу, і вважали, що мають право диктувати нам, як жити.\n\nАле ми довели, що вони помилялися. У вогні війни, в окопах на кордоні ми викували дещо більше за перемогу. Ми викували гідність! Гондурас більше не стоятиме на колінах, випрошуючи подачки у Вашингтона. Сьогодні ми повертаємо собі нашу землю, наші ресурси й нашу долю.\n\nЯ знаю, що серед нас є ті, хто тремтить від страху. Ті, хто звик до нашийника господаря і тепер скиглить, коли ми скидаємо кайдани. Вони шепочуть про «права», про «свободи»... Але про чиї права вони дбають? Про права грабіжників? Нехай запам'ятають: у новому Гондурасі немає місця для п'ятої колони.\n\nПопереду важкі часи. Вони тавруватимуть нас на сторінках нью-йоркських газет, вони намагатимуться задушити нас. Але ми не самі. Світ змінюється, і в нас з'являються нові друзі, які поважають силу. Ми підемо власним шляхом — шляхом національної гордості. А якщо комусь цей шлях не до вподоби — нехай іде за своїми господарями.\n\nХай живе вільний Гондурас! Хай живуть Збройні сили!""
 HON_forpol.29.a: "Вимкнути радіо."
 
 HON_forpol.30.t: "Гондураський бізнес"
 HON_forpol.30.iberia.desc: "Гарні новини від наших організацій, що працюють у Центральній Америці — гондурасці звернулися до нашого торгового представника в Тегусігальпі з пропозицією, яку надто вигідно ігнорувати. Ми маємо діяти швидко.\n\nВ обмін на дуже вигідні тарифи на їхній експорт — зокрема фрукти та банани — до Іберії (а також далі, до Європи), вони пропонують безпрецедентний доступ до своєї економіки. Послаблення обмежень на іноземне володіння та інвестиції, зниження мит і комісій за транзакції, а також скасування низки проблемних банківських процедур, які створювали труднощі, призведуть до значного зростання вартості іберійських інвестицій, які вже знаходяться в країні. І це не кажучи про майбутні вигоди.\n\nЯкщо угоду буде прийнято, вона фактично дозволить нам замінити Сполучені Штати як головного гравця в економіці Гондурасу. Хоча це, без сумніву, спричинить певні розбіжності з американцями, вигода від угоди надто велика, щоб від неї відмовлятися. Якби нам вдалося посісти таке становище в Гондурасі, наш діловий світ отримав би чудові можливості для розширення по всій Центральній Америці.\n\nЯкою має бути наша відповідь Тегусігальпі?"
 HON_forpol.30.italy.desc: "Гарні новини від наших організацій, що працюють у Центральній Америці — гондурасці звернулися до нашого торгового представника в Тегусігальпі з пропозицією, яку надто вигідно ігнорувати. Ми маємо діяти швидко.\n\nВ обмін на дуже вигідні тарифи на їхній експорт — зокрема фрукти та банани — до Італії (а також далі, до Європи), вони пропонують безпрецедентний доступ до своєї економіки. Послаблення обмежень на іноземне володіння та інвестиції, зниження мит і комісій за транзакції, а також скасування низки проблемних банківських процедур, які створювали труднощі, призведуть до значного зростання вартості італійських інвестицій, які вже знаходяться в країні. І це не кажучи про майбутні вигоди.\n\nЯкщо угоду буде прийнято, вона фактично дозволить нам замінити Сполучені Штати як головного гравця в економіці Гондурасу. Хоча це, без сумніву, спричинить певні розбіжності з американцями, вигода від угоди надто велика, щоб від неї відмовлятися. Якби нам вдалося посісти таке становище в Гондурасі, наш діловий світ отримав би чудові можливості для розширення по всій Центральній Америці.\n\nЯкою має бути наша відповідь Тегусігальпі?"
 HON_forpol.30.germany.desc: "Гарні новини від наших організацій, що працюють у Центральній Америці — гондурасці звернулися до нашого торгового представника в Тегусігальпі з пропозицією, яку надто вигідно ігнорувати. Ми маємо діяти швидко.\n\nВ обмін на дуже вигідні тарифи на їхній експорт — зокрема фрукти та банани — до Німеччини (а також далі, до Європи), вони пропонують безпрецедентний доступ до своєї економіки. Послаблення обмежень на іноземне володіння та інвестиції, зниження мит і комісій за транзакції, а також скасування низки проблемних банківських процедур, які створювали труднощі, призведуть до значного зростання вартості німецьких інвестицій, які вже знаходяться в країні. І це не кажучи про майбутні вигоди.\n\nЯкщо угоду буде прийнято, вона фактично дозволить нам замінити Сполучені Штати як головного гравця в економіці Гондурасу. Хоча це, без сумніву, спричинить певні розбіжності з американцями, вигода від угоди надто велика, щоб від неї відмовлятися. Якби нам вдалося посісти таке становище в Гондурасі, наш діловий світ отримав би чудові можливості для розширення по всій Центральній Америці.\n\nЯкою має бути наша відповідь Тегусігальпі?"
 HON_forpol.30.japan.desc: "Гарні новини від наших організацій, що працюють у Центральній Америці — гондурасці звернулися до нашого торгового представника в Тегусігальпі з пропозицією, яку надто вигідно ігнорувати. Ми маємо діяти швидко.\n\nВ обмін на дуже вигідні тарифи на їхній експорт до Японії (а також далі, до Сфери), вони пропонують безпрецедентний доступ до своєї економіки. Послаблення обмежень на іноземне володіння та інвестиції, зниження мит і комісій за транзакції, а також скасування низки проблемних банківських процедур, які створювали труднощі, призведуть до значного зростання вартості японських інвестицій, які вже знаходяться в країні. Особливо з огляду на слабкість азійських ринків у цей момент, поява нового ринку, хай навіть невеликого, стала б потужним сигналом упевненості.\n\nЯкщо угоду буде прийнято, вона фактично дозволить нам замінити Сполучені Штати як головного гравця в економіці Гондурасу. Хоча це, без сумніву, спричинить певні розбіжності з американцями, вигода від угоди надто велика, щоб від неї відмовлятися. Якби нам вдалося посісти таке становище в Гондурасі, наш діловий світ отримав би чудові можливості для розширення по всій Центральній Америці.\n\nЯкою має бути наша відповідь Тегусігальпі?"
 HON_forpol.30.a: "Так. Організувати підписання угоди якнайшвидше."
 HON_forpol.30.b: "Ні. Ми не хочемо загострювати відносини з американцями."

 HON_forpol.31.t: "HONDURAS"
 HON_forpol.31.desc: "RESTRICTED [?global.date.GetDateStringNoHourLong]\n\nFROM JAMES ANDERS\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: STATUS OF HONDURAS WITHIN THE OFN\n\n(R) The Honduran government has cut many of its previously held ties to the OFN.\n'n(R) The Partido Nacional de Honduras (PNH) has won a second term, beating the pro-OFN Partido Liberal de Honduras (PLH)\n\n(R) While the PNH is overall far more anti-American than its rival, it maintained a decently sized pro-American faction. After an internal power struggle, this faction has been removed from power by its rivals\n\n(R) The FBI shall continue to support the remnants of the pro-American faction, as the PNH continues to expand its influence across all sectors of public life, and the prospects of a PLH victory in the future grow smaller."
 HON_forpol.31.a: "Fidelity, Bravery, Integrity."

 HON_forpol.32.t: "HONDURAS"
 HON_forpol.32.desc: "RESTRICTED [?global.date.GetDateStringNoHourLong]\n\nFROM JAMES ANDERS\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: STATUS OF HONDURAS WITHIN THE OFN\n\n(R) The Honduran government has announced that it would abide by all its previous OFN commitments.\n\nFollowing the defeat of the pro-American Partido Liberal de Honduras (PLH) to the incumbent Partido Nacional de Honduras (PNH), and the current expansion of PNH influence in all sectors of public life, it became a worry that Honduras would cut some of its extensive ties with the OFN\n\n(R) The PNH's pro-American faction has won decisively in an internal power struggle against its neutralist opponents. While it is not as pro-American as the PLH, the government has assured us through diplomatic channels that it would not seek to change Honduras' status or any agreements with the OFN\n\nThe FBI shall provide aid to the PNH in suppressing the anti-American faction to secure the United States' interests in the region."
 HON_forpol.32.a: "Fidelity, Bravery, Integrity."

 ##Football war events

 CA_Football_War.4.t: "Незгода на полі"
 CA_Football_War.4.desc: "ТАЄМНО/[GetMonth], [GetYear]\n\nВІД МАЙКЛА НАЗА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ЗАГРОЗА З БОКУ САЛЬВАДОРУ ДЛЯ ГОНДУРАСУ\n\n1. Авторитарний режим Сальвадору становить серйозну загрозу безпеці Гондурасу, нашого головного партнера в Центральній Америці. Посилаючись на нещодавні земельні реформи Тегусігальпи, унаслідок яких було виселено сальвадорських мігрантів, що незаконно займали гондураську землю, Сан-Сальвадор у гіперболізованій формі звинуватив Гондурас у геноциді та розпочав обмежену мобілізацію. (ДАЛІ)\n\nЦІЛКОМ ТАЄМНО/[GetDateText]\n\nВІД КЛЕЙТОНА ДЕЙЛА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ПОМИЛКОВА ОЦІНКА ФБР\n\n1. Доданий звіт ФБР містить серйозні помилки. Сальвадорських селян насильно виганяють із Гондурасу після того, як останній відмовився продовжити дію спільного Закону про імміграцію. За оцінкою ЦРУ, дружній уряд PCN у Сан-Сальвадорі, ймовірно, зазнає краху, якщо потік біженців різко зросте. Гондурас необхідно стримати. (ДАЛІ)"
 CA_Football_War.4.a: "Гондурас — наш головний союзник у регіоні, і він має нашу повну підтримку."
 CA_Football_War.4.b: "Обумовити військову допомогу Гондурасу поблажливим ставленням до сальвадорських мігрантів."
 CA_Football_War.4.c: "Боротьба за сфери впливу у Вашингтоні гірша, ніж у Центральній Америці! Що тут, чорт забирай, відбувається?"

 CA_Football_War.5.t: "Гра на випередження"
 CA_Football_War.5.desc: "ЦІЛКОМ ТАЄМНО/[GetDateText]\n\nВІД МАЙКЛА НАЗА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ЗАГРОЗА З БОКУ САЛЬВАДОРУ ДЛЯ ГОНДУРАСУ\n\n1. Антиамериканський авторитарний режим Сальвадору становить серйозну загрозу безпеці Гондурасу, нашого головного партнера в Центральній Америці. Посилаючись на нещодавні земельні реформи Тегусігальпи, унаслідок яких було виселено сальвадорських мігрантів, що незаконно займали гондураську землю, Сан-Сальвадор у гіперболізованій формі звинуватив Гондурас у геноциді та розпочав обмежену мобілізацію.\n\n2. Ми вважаємо, що це більше, ніж просто брязкання зброєю. Гондураські звіти, перевірені нашим військовим аташе, підтверджують, що Сальвадор переміщує свої обмежені запаси військової техніки до районів зосередження. Додаткове підтвердження могло б надати Центральне розвідувальне управління, яке, як вважається, перехопило переговори із закордонними партнерами Сальвадору. Попри неодноразові запити, вони не надали цю інформацію.\n\n3. Гондурас має чисельнішу армію, ніж Сальвадор, а також високоякісне американське озброєння. Зокрема, його військово-повітряні сили переважають сальвадорські. Однак цивільно-військові відносини в Гондурасі напружені, а самі збройні сили розколоті на угруповання. Брак командування та координації може дати Сальвадору шанс у короткочасному конфлікті.\n\n4. Спільні навчання з гондураськими силами усунули б цю слабкість, змусивши різні угруповання співпрацювати між собою. Альтернативно, надання Гондурасу додаткового військового обладнання підвищило б моральний дух і водночас безпосередньо збільшило боєготовність сил."
 CA_Football_War.5.a: "Провести навчання. З усіма нашими базами там це має бути нескладно."
 CA_Football_War.5.b: "Озброїти гондурасців. Сальвадор відступить перед обличчям американської вогневої потужності."
 CA_Football_War.5.c: "Це схоже на паніку. Нашої нинішньої підтримки достатньо."

 CA_Football_War.6.t: "Вимога із Сан-Сальвадору"
 CA_Football_War.6.desc: "Генерал Хосе Альберто Медрано був схильний до гніву навіть у добрий день, але його лють подвоювалася щоразу, коли йому доводилося мати справу з гондурасцями. «Ким ці гондураські сучі сини себе вважають? Погрожують нашим працьовитим фермерам силою, насильно виганяють їх? Кляті повії, всі до одного! Я не дозволю їм і далі принижувати нашу національну гордість, Соса; цей відбірковий матч чемпіонату світу — чудова нагода. Наш народ і так буде достатньо розлючений, і ми повинні скористатися цією можливістю, щоб показати Тегусігальпі її кляте місце — під нами!»\n\nЙого співрозмовник, старший офіцер, генерал Хуліо Фаустіно Соса, урочисто кивнув. «Я цілком погоджуюся, генерале, з кожним вашим твердженням. Але є одна серйозна проблема», — тут він продовжив, перекриваючи фиркання свого колеги, — «а саме: наші запаси боєприпасів можуть вичерпатися, якщо конфлікт затягнеться. Генерале Медрано, я мушу рекомендувати звернутися до Токіо по матеріальну та стратегічну підтримку».\n\nМедрано знову фиркнув. «Нісенітниця. Гондурасці — купка манірних, нікчемних ідіотів. Жодної загрози. Не варто витрачати сили на те, щоб турбувати Токіо».\n\nСоса стиснув підборіддя, змусивши Медрано замовкнути. «Ви так вважаєте, генерале, але я не можу розвіяти свої сумніви одним лише героїчним духом. Я попрошу Імперію надати нам усе, що вона зможе». Медрано, дещо непокірно, погодився, після чого Соса доповів японському послу про ці міркування та свої запити."
 CA_Football_War.6.a: "Так далеко? Що ж, почніть готувати товари подвійного призначення."
 CA_Football_War.6.b: "Надішліть їм аташе."
 CA_Football_War.6.c: "Ви збожеволіли — навіщо провокувати Вашингтон через таку дрібницю?"
 CA_Football_Japan_alone_tt: "\n§FОскільки наші колишні §Oіберійські§! §nпартнери§! не можуть надати нам допомогу, ми повинні подвоїти наші зусилля для підтримки нашого плацдарму в §DЦентральній Америці.§!\nДоля [ELS.GetFlag] §Bсальвадорського режиму§! цілком залежить §eвід нас.§!§!"

 CA_Football_War.7.t: "Матч принципових суперників"
 CA_Football_War.7.desc: "Образа національної гідності Сальвадору. Довгий струмінь сечі на наш прапор. Волога купа лайна, розмазана по всьому, що я—ми тут збудували, Хуліо, — генерал Хосе Альберто Медрано крокував Жовтою залою Національного палацу. — Гондурасці захоплюють землю нашого народу, викидають їх без гроша в кишені напризволяще... Цього приниження ми не потерпимо!\n\nГенерал Хуліо Фаустіно Соса кивнув: «Я цілком згоден, Хосе. Тут просто недостатньо землі, щоб розмістити всіх знедолених бідняків, яких Гондурас виганяє. Гадаю, ви викликали мене, щоб обговорити, що нам із цим робити?»\n\nМедрано подивився Сосі в очі, а потім поплескав його по плечу: «О, я чорт забирай чудово знаю, що ми з цим зробимо. Ми нападемо на Гондурас. Поставимо пістолет до голови кожного політика в Тегусігальпі, який не продовжив дію Договору про імміграцію, і так повільно натискатимемо на спуск, щоб вони обісралися зі страху ще до смерті — і після неї».\n\nСоса, приголомшений несподіваним дотиком не менше, ніж самим планом, мовчав, тож Медрано продовжив: «Ненависть до гондурасців — це зброя. І ця ненависть загостриться до вістря, коли ми зіграємо з ними у відбірковому матчі чемпіонату світу. Три гри — ми дамо їй накопичуватися, накопичуватися...» — він прибрав руку з плеча Соси, а потім різко просунув її повз його ребра, — «а тоді проткнемо цю товсту маленьку свиню!»\n\nСоса нарешті заговорив: «Я... безперечно хотів би отримати всю можливу підтримку від наших союзників. Краще написати Іберії вже зараз і попросити допомоги, оскільки на її прибуття знадобиться певний час»."
 CA_Football_War.7.a: "Гармати вирушають у довгу подорож із Севільї до Акаджутли."
 CA_Football_War.7.b: "Ящики з песетами можуть дістатися Сан-Сальвадору повітрям."
 CA_Football_War.7.c: ""Можливо, це просто були чорнила, витрачені даремно.""
 CA_Football_War_Iberia_max_aid_tt: "\n§FЗмагатися з наддержавою в обсягах допомоги може бути не в наших силах, але це буде необхідно, якщо ми не хочемо, щоб §BСальвадор§! опинився в обіймах §eяпонців.§!§!"

 CA_Football_War.8.t: "Прелюдія до футбольної війни з Мексикою 1"
 CA_Football_War.8.desc: "No need for loc yet"
 CA_Football_War.8.a: "Терміново відправити сальвадорцям боєприпаси — мир можна здобути залякуванням."
 CA_Football_War.8.b: "Ми повинні зайняти тверду моральну позицію проти насильства Гондурасу."
 CA_Football_War.8.c: "Ми маємо чудові можливості для посередництва в цій суперечці."

 CA_Football_War.9.t: "Повернення команди Б"
 CA_Football_War.9.desc: "ТАЄМНО/[GetMonth],[GetYear]\n\nВІД КЛЕЙТОНА ДЕЙЛА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: НЕМИНУЧА ВІЙНА В ЦЕНТРАЛЬНІЙ АМЕРИЦІ\n\n1. Жорстоке цькування збірної Сальвадору під час відбіркового матчу чемпіонату світу в Тегусігальпі ще більше загострило напруженість у відносинах із Гондурасом. Обидві країни готуються до війни, щоб вирішити суперечку щодо міграції. PCN Сальвадору не може піти на поступки в цьому питанні через свої зобов'язання щодо добробуту біженців. За оцінкою ЦРУ, єдиний спосіб запобігти конфлікту — припинити доступ Гондурасу до боєприпасів, необхідних для його майже виключно американського озброєння.\n\nЦІЛКОМ ТАЄМНО/[GetDateText]\n\nВІД МАЙКЛА НАЗА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: НЕТOЧНА ОЦІНКА ЦРУ\n\n1. Доданий звіт ЦРУ стосується несанкціонованої операції в регіоні Центральної Америки, який перебуває під юрисдикцією ФБР. Крім того, він фактично помилковий. Сальвадор готується до агресивної війни за власним вибором проти давнього американського партнера. Скорочення військової допомоги саме в той момент, коли вона найбільше потрібна, підірве нашу репутацію надійного союзника та прирече Гондурас на вторгнення. Оборонну мобілізацію Гондурасу слід підтримати шляхом передачі надлишкового озброєння та боєприпасів, які без проблем доступні на наших базах у країні."
 CA_Football_War.9.a: "Гондурас — наш непохитний союзник. Вивільнити необхідні їм запаси."
 CA_Football_War.9.b: "Сальвадор захищає свій народ. Тимчасово перекрити постачання Гондурасу."
 CA_Football_War.9.c: "Війну, яку нам треба закінчити, ведуть Ленглі та ФБР! Що, чорт забирай, відбувається?"

 CA_Football_War.10.t: "Остання людина"
 CA_Football_War.10.desc: "ЦІЛКОМ ТАЄМНО/[GetDateText]\n\nВІД МАЙКЛА НАЗА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: НЕГАЙНА ЗАГРОЗА ГОНДУРАСУ\n\n1. Напруженість між Сальвадором і Гондурасом різко зросла після того, як сальвадорські футбольні хулігани підпалили частину Національного стадіону імені Челато Уклеса в Тегусігальпі після перемоги Гондурасу у відбірковому матчі чемпіонату світу. Сальвадор продовжує звинувачувати Гондурас у геноциді через його спроби виселити нелегальних іммігрантів і відкидає спроби посередництва. Війна між двома центральноамериканськими державами, ймовірно, неминуча.\n\n2. ФБР вважає, що Сальвадор віддав наказ про наступ через кордон із Гондурасом, причому вторгнення має розпочатися після третього відбіркового матчу чемпіонату світу між країнами. Нам відомо, що Центральне розвідувальне управління має копію протоколу останнього засідання сальвадорського генерального штабу. Вони відмовилися надати цей документ, попри те, що їхня присутність у Сальвадорі є несанкціонованою, а Центральна Америка перебуває під юрисдикцією ФБР. Ці дії ЦРУ викликають серйозне занепокоєння та можуть поставити під загрозу інтереси національної безпеки Сполучених Штатів.\n\n3. Сальвадор — агресивний авторитарний уряд, пов'язаний із ворожими державами. Натомість Гондурас послідовно підтримує пріоритети США в ОАД, відкритий для американських інвесторів на кшталт United Fruit Company та надав нам права на використання військових баз, що забезпечують критично важливу можливість проєктування сили в Центральній Америці. Необхідні рішучі дії, такі як негайна передача військових гелікоптерів або політичне втручання для консолідації гондураських збройних сил перед лицем загрози."
 CA_Football_War.10.a: "Перевага в повітрі — головна перевага гондурасців. Надіслати їм гелікоптери."
 CA_Football_War.10.b: "Військова дисфункція — найбільша слабкість гондурасців. Зателефонувати їм."
 CA_Football_War.10.c: "Гондурас сам розбереться з цими бляшаними диктаторами. Я не втягуватиму Америку в чергове болото."

 CA_Football_War.11.t: "Сальвадорське занепокоєння"
 CA_Football_War.11.desc: "Перша перешкода виникла швидко й змусила Сальвадор похитнутися: Гондурас переміг у першому відбірковому матчі на домашньому полі в Тегусігальпі, через що розлючені сальвадорські вболівальники підпалили стадіон. Поки дипломатичні демарші та пропагандистські плакати літали туди-сюди, військові приготування Сальвадору стали надто очевидними, щоб Гондурас міг їх ігнорувати. У результаті кордон почав стрімко мілітаризуватися.\n\nХуліо Фаустіно Соса схопився за голову. «Чорт забирай, я мав би краще знати, ніж довіряти обіцянкам швидкої та легкої переможної війни. Медрано заведе нас у прірву й залишить приниженими на кордоні, якщо я нічого не зроблю».\n\nУ поле зору Соси потрапили якісь папери, і він глибоко зітхнув. Попередивши Медрано про ризик нестачі військового обладнання, Соса наказав негайно провести інвентаризацію всього матеріального забезпечення в усіх збройових складах і гарнізонах країни. Результати змусили його скреготати зубами.\n\n«Так, я знаю, японський посол сказав, що не може надати нічого більше, перебуваючи так близько до Сполучених Штатів. Чорт забирай, це б'є по моїй гордості, але, здається, у мене немає вибору», — пробурмотів Соса, стискаючи офіцерський кашкет у кулаці. «Мені потрібно знову піти до посольства й подивитися, що ще вони можуть нам надати»."
 CA_Football_War.11.a: "Кого хвилює Вашингтон? Відкрита допомога цілком прийнятна, наш союзник мусить вижити!"
 CA_Football_War.11.b: "Таємно переправити стільки, скільки тільки можливо."
 CA_Football_War.11.c: "Принаймні Медрано має чоловічу впевненість у собі; Соса — довбаний параноїк."

 CA_Football_War.12.t: "Армія в дорозі"
 CA_Football_War.12.desc: "Як і половина сальвадорців на вулицях, генерал Медрано проклинав Гондурас.\n\nОднак його думки були зайняті не поразкою 1:0, якої Сальвадор щойно зазнав у першому з трьох відбіркових матчів чемпіонату світу. А словниковий запас, що лунав у Жовтій залі Національного палацу, змусив би почервоніти навіть найзапеклішого вболівальника «Ла Селести».\n\n«Вони мобілізуються, чорт забирай! Їхні янкі-сутенери, мабуть, прошепотіли їм, що ми збираємося їм влаштувати», — Медрано вихилив ще один ковток рому. «Стільки, бляха, хвойд вони запихають у форму, що це займе місяці, щоб—»\n\nГенерал Соса, тримаючи руки над друкарською машинкою, перебив його: «Будь ласка, ближче до суті, Хосе. Мені потрібно щось, що я зможу написати генералісимусу Франко, бажано таке, через що тебе не відлучать від церкви, якщо це потрапить не в ті руки».\n\nМедрано гаркнув: «Коротше кажучи, нас менше. Звісно, ми залучимо Національну гвардію. Добровольці стоятимуть у черзі біля призовних пунктів. Але гондурасців надто багато. Ми все одно переможемо. Та вони розтягнуть нашу лінію звідси аж до найкрижанішої ями пекла. Я хочу зосередити наших людей, щоб пробитися до Тегусігальпи», — він із силою вдарив долонею по столу, — «а не завдавати дрібних ударів уздовж усього кордону».\n\nСоса підняв брову: «І як Іберія так швидко надасть нам необхідну живу силу? Не впевнений, що Франко зможе організувати повітряний міст із Марокко до Сан-Міґеля»."
 CA_Football_War.12.a: ""Каудильйо поговорить зі своїми друзями в Легіоні «Кондор».""
 CA_Football_War.12.b: ""Невже Іберія не може дозволити собі найняти кількох найманців.""
 CA_Football_War.12.c: ""Чорт забирай, Хуліо, допоможи мені думати!""

 CA_Football_War.13.t: "Прелюдія 2: Мексика"
 CA_Football_War.13.desc: "No loc needed yet"
 CA_Football_War.13.a: "Залучити весь Веракруський пакт на бік Сальвадору — паливо, боєприпаси, зброю, все!"
 CA_Football_War.13.b: "Ми підтримуємо нашого союзника, надіслати все, що можемо."
 CA_Football_War.13.c: "Ми не ставитимемо під загрозу чемпіонат світу через це."

 CA_Football_War.14.t: "Барра брава"
 CA_Football_War.14.desc: "Свист каменя тривав лише мить, а потім пролунав вибух скла.\n\nХуліо не був слабаком. Він увійшов першим, діставши кілька подряпин заради спільної справи. Заради своїх братів.\n\nХуліо не був злодієм. Злодіями були багаті сальвадорці, які крали землю по всьому Гондурасу, поки його власний народ не мав чого їсти. Він забрав би землю назад, але жив у барріо. За все життя він жодного разу не залишав Тегусігальпу — просто не міг собі цього дозволити.\n\nХуліо не був хуліганом. Так, після матчу він міг добряче розійтися. Після поразки 3:0. Після того, як сальвадорці вивісили якусь брудну ганчірку замість гондураського прапора. Після того, як ті головорізи вбили гондурасців там, де його команда зупинилася в Сан-Сальвадорі.\n\nХуліо не був убивцею. Ним був сальвадорський крамар із божевільним поглядом і пістолетом у руці. Або став би ним. Хуліо збив його з ніг і почав бити. І топтати. І вбивця перестав рухатися.\n\nХуліо був футбольним уболівальником. Коли його товариші по фанатському руху увірвалися до крамниці, хапаючи все, що могли знайти, він першим попрямував до радіо. До радіо, по якому він міг слухати третій відбірковий матч чемпіонату світу між Гондурасом і Сальвадором."
 CA_Football_War.14.a: "До радіо, по якому він почув, що Сальвадор розірвав дипломатичні відносини."

 CA_Football_War.15.t: "Офсайд"
 CA_Football_War.15.desc: "Гуркіт двох гондураських T-28 Trojan, що пролітали надто близько, змусив Марко висунути голову з вікна бульдозера. Вдивляючись у надто блакитне, надто гондураське небо, він помітив їх, коли вони віддалялися від сальвадорської колони. «Чисто!» — крикнув він, гупнувши рукою по листовому металу, привареному до борту бульдозера як броня.\n\nВін очікував, що майор загорлає, а гуркіт двадцяти двигунів заглушить гудіння літаків, які ставали дедалі тихішими, вирушаючи на пошуки інших сальвадорців, яких можна було знищити. Але наказу не надходило.\n\nПочекавши хвилину чи дві — дві хвилини без просування долиною Сула і без стрілянини по гондурасцях, — Марко відчинив двері й рушив на пошуки майора. Він знайшов старшого чоловіка, який розглядав пожовклу карту та роздоріжжя ґрунтових доріг попереду.\n\nМарко сказав: «Найкоротший шлях до нашої цілі — ліворуч, сер». Майор помітно напружився й відкрив рота — але Марко заговорив першим: «Ми жили неподалік звідси. Обробляли землю. Я ходив цими дорогами на ринок. Минулого року нас вигнали».\n\nМайор окинув його поглядом карих очей, перш ніж злегка кивнути: «Усі ліворуч!» — крикнув він.\n\nПовертаючись до бульдозера, Марко міг би відчути гордість,"
 CA_Football_War.15.a: "Якби лють не поглинула його серце."
 CA_Football_War_tt: "§FФутбольна війна між [ELS.GetFlag]§BСальвадором§! та [HON.GetFlag]§MГондурасом§! §Rрозпочалася§!§!"

 CA_Football_War.16.t: "Неочікувана перемога"
 CA_Football_War.16.desc: "ЦІЛКОМ ТАЄМНО/[GetDateText]\n\nВІД МАЙКЛА НАЗА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ПЕРЕМОГА ГОНДУРАСУ У «ФУТБОЛЬНІЙ ВІЙНІ»\n\n1. Гондурас переміг Сальвадор у короткотривалому конфлікті, використавши свою чисельнішу армію, а також американську авіацію та підготовку. Розвідувальна підтримка США через ФБР також відіграла вирішальну роль у здійсненні прориву біля Сан-Міґеля. Сальвадор запросив переговори про мир через ОАД, що дозволило нам завершити війну на умовах США.\n\n2. Ключові гондураські посадовці та громадські організації висловили вдячність за підтримку США до, під час і після війни. Мирний договір спричинив сплеск громадської підтримки уряду: репарації від уряду Сальвадору та організована репатріація нелегальних сальвадорських мігрантів розглядаються як критично важливі для збіднілої країни з обмеженими земельними ресурсами.\n\n3. Уряд Сальвадору, тісно пов'язаний із його військовими, був повністю дискредитований невдалою війною, яку сам обрав. Імовірно, повернення селян та бюджетний тягар військових репарацій дестабілізують економіку й уряд Сальвадору. Ймовірне повернення цієї країни до циклу переворотів і контрпереворотів. Комуністичні партизани FMLN також можуть спробувати скористатися ситуацією.\n\n4. Хоча конфлікт було успішно вирішено з точки зору інтересів США, несанкціонована операція ЦРУ в Сан-Сальвадорі значно ускладнила розвідувальну діяльність у регіоні. Цю операцію слід припинити, а її ресурси передати відповідним підрозділам ФБР."
 CA_Football_War.16.a: "Вірність, хоробрість, чесність."
 CA_Football_War_16_ELS_Help: "На тлі перемоги Гондурасу наш внесок у підтримку Сальвадору виглядає безглуздим."
 CA_Football_War_16_NO_Help: "Наш збалансований підхід дозволив уникнути репутаційної шкоди під час Футбольної війни."
 CA_Football_War_16_HON_Help: "Наш внесок у перемогу Гондурасу у Футбольній війні не залишився непоміченим..."

 CA_Football_War.17.t: "Підвищення та виліт"
 CA_Football_War.17.desc: "ЦІЛКОМ ТАЄМНО/[GetDateText]\n\nВІД КЛЕЙТОНА ДЕЙЛА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ПЕРЕМОГА САЛЬВАДОРУ У «ФУТБОЛЬНІЙ ВІЙНІ»\n\n1. Сальвадор переміг Гондурас у короткотривалому конфлікті. Хоча його сили були менш чисельними, вони продемонстрували вищу дисципліну та спиралися на сучаснішу, індустріально розвинену економіку. Сальвадорським військам вдалося наблизитися до Тегусігальпи та просунутися долиною Сула, змусивши Гондурас звернутися до ОАД щодо переговорів про мир. Відповідно, США змогли виступити посередником у припиненні конфлікту на вигідних умовах.\n\n2. Очікується, що правляча PCN Сальвадору отримає вигоду від військових репарацій, стягнутих із Гондурасу, спрямувавши їх на розвиток країни та її промислового хімічного сектору й давно домінуючої кавової галузі. Крім того, партія переживає сплеск народної підтримки завдяки успішному захисту прав сальвадорських мігрантів.\n\n3. Очікується, що Гондурас, який тривалий час залишався слаборозвиненим, зіткнеться з політичною нестабільністю після поразки. Цивільно-військові відносини та фракційність у військах, які й без того викликали занепокоєння, імовірно, погіршаться. Відповідно, США може бути вигідно продовжити перехід до Сальвадору як нашого пріоритетного партнера в Центральній Америці.\n\n4. Окремо варто зазначити, що помилки в оперативній роботі наших колег із ФБР у Центральній Америці викликають занепокоєння. Їхній відстоюваний монополізм і обмежена компетентність могли б призвести до того, що США прив'язали б себе до провалів Гондурасу."
 CA_Football_War.17.a: "І ПІЗНАЄТЕ ІСТИНУ, І ІСТИНА ЗРОБИТЬ ВАС ВІЛЬНИМИ."
 CA_Football_War_17_ELS_Help: "Наш внесок у перемогу Сальвадору у Футбольній війні не залишився непоміченим..."
 CA_Football_War_17_HON_Help: "На тлі перемоги Сальвадору наш внесок у підтримку Гондурасу виглядає безглуздим."

 CA_Football_War.18.t: "На лаві запасних"
 CA_Football_War.18.desc: "ЦІЛКОМ ТАЄМНО/[GetDateText]\n\nВІД МАЙКЛА НАЗА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ПЕРЕМОГА ГОНДУРАСУ У «ФУТБОЛЬНІЙ ВІЙНІ»\n\n1. Сальвадор переміг Гондурас у короткотривалому конфлікті. Завдяки прихованій підтримці свого іноземного покровителя сальвадорці стрімко рушили до Тегусігальпи та вгору долиною Сула. Загроза втручання США на боці Гондурасу змусила обидві сторони погодитися на переговори за посередництва ОАД, де наслідки поразки вдалося частково пом'якшити.\n\n2. Наслідки для Гондурасу, комерційного, політичного та військового партнера США, імовірно, будуть значними й негативними. Ліві та праві угруповання вже протестують через нездатність уряду вести війну. Представники як PLH, так і особливо PNH намагаються дистанціюватися від США, засуджуючи нашу «зраду» через ненадання належної підтримки та нав'язування мирною угодою виплати репарацій Сальвадору. Сальвадорським нелегальним мігрантам також має бути дозволено залишитися, що призупинить попередню земельну реформу.\n\n3. Натомість антиамериканський сальвадорський режим вийшов із ситуації сильнішим, зміцнивши свою військову репутацію та народну підтримку, а також укріпивши зв'язки з ворожими державами за кордоном. Для регіональної та американської безпеки необхідно посилити спостереження за Сан-Сальвадором. Це неминуче вимагатиме ліквідації несанкціонованої операції ЦРУ там та передачі всіх її ресурсів і інформації відповідному підрозділу ФБР."
 CA_Football_War.18.a: "Вірність, хоробрість, чесність."

 CA_Football_War.19.t: "Жовта картка"
 CA_Football_War.19.desc: "Генерал Медрано перестав викручувати. Крики припинилися трохи пізніше.\n\n«Ти відповіси на мої запитання, і все це закінчиться швидше», — він зробив паузу й ковтнув із фляги. Потім нахилився до понівеченого до невпізнання обличчя свого полоненого. «Як ця купка безхребетних гондураських виродків змогла дістатися околиць Сан-Міґеля? Ти допомагав їм у війні? Твої маленькі комуністичні друзі з FMLN допомагали їм?»\n\nМедрано знову почав викручувати. Те, що залишилося від людини, почало кричати. «Відповідай, шматок лайна! Відповідай, чорт забирай! Вони посилають сюди ще таких, як ти? Вони намагаються нас знищити?» Єдиною відповіддю були ридання та те, що могло бути благанням зупинитися, з того, що могло бути ротом.\n\nМедрано відійшов убік, зняв закривавлені рукавички й підняв слухавку. «Соса, ще більше прибудуть разом із біженцями. Ти це знаєш, я це знаю. А замість того, щоб купувати кулі, які можна було б пустити в голови цим комунякам, ми віддаємо половину бюджету Тегусігальпі як репарації. Підготуй листи з проханням про гроші до Токіо та Мадрида. Тепер це все, що в нас залишилося».\n\nВін кинув слухавку. І повернувся до роботи."
 CA_Football_War.19.a: "Надати Сальвадору необхідну підтримку..."
 CA_Football_War_Save_Nationalist_Regime_tt: "Або ми ризикуємо, що він §Rрозвалиться§!."
 CA_Football_War.19.b: "Більше жодного цента цим невдахам-воякам."

 CA_Football_War.20.t: "Ла Селеста"
 CA_Football_War.20.desc: "Сальвадорські національні гвардійці оточили площу Спасителя Світу, офіційно нібито для підготовки до тріумфального військового параду, який мав відбутися наступного дня. Але насправді генерал Хуліо Фаустіно Соса віддав наказ не допустити громадян до новоспеченого героя війни, який так непристойно напився просто посеред вулиці.\n\nТим часом п'яний генерал Хосе Альберто Медрано молився біля підніжжя монумента Божественного Спасителя Світу, його слова підіймалися вгору хрестоподібною колоною, повз земну кулю, до постаті Ісуса на вершині. А можливо, й далі — до самих Небес.\n\n«Господи, ми дякуємо Тобі, дякуємо за відвагу й силу, якими Ти наділив Сальвадорські збройні сили. Нехай ті, хто загинув у славній війні, знайдуть спокій у Твоїх обіймах».\n\nВін ледь розплющив очі й побачив земну кулю, на якій стояв Ісус. «І Господи, ми дякуємо Тобі за силу Японії та завзяття Іберії. Вони стояли поруч із нами, щоб захистити невинних і нашу націю. Сальвадорці збережуть землю, яку Ти їм дарував».\n\nПотім його тон став жорсткішим: «І з-знищ же гондураських псів та їхніх вашингтонських господарів. Це вони змусили нас звернутися до ОАД, замість того щоб дозволити нам увійти маршем до Тегусігальпи. Вони заплатять нам репарації, так, але ми платитимемо пенсії вдовам за ці тридцять срібняків».\n\n«Амінь», — Медрано підвівся, хитаючись,"
 CA_Football_War.20.a: "Але з грацією переможця."
 CA_Football_War_Nationalist_helped_tt: "Наш внесок у перемогу Сальвадору у Футбольній війні не залишився непоміченим..."
 CA_Football_War_Nationalist_didnt_tt: "Схоже, Сальвадор тріумфував лише завдяки Божій волі."

