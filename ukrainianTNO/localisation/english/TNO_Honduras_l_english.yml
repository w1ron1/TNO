 ##News Events
 
 HON_news.1.t: "[Get_newspaper_header]Гондураські військові оголошують про тимчасову хунту"
 HON_news.1.desc: "Рано-вранці гондураські солдати захопили радіостанції, зокрема популярну «Голос Гондурасу», щоб транслювати заяву генерала Освальдо Лопеса Арельяно про скасування виборів і запровадження військової хунти «до відновлення національної стабільності». Президент Вільєда Моралес був вдруге повалений військами, що пройшли вулицями серед колоніальної архітектури Центрального району.\n\nПереворот став наслідком розпаду двопартійної системи Гондурасу. Ліберальний кандидат Модесто Родас Альварадо відштовхнув елітних покровителів своєї партії програмою з лівим ухилом, тоді як Національна партія дедалі більше розколювалася між проамериканськими та антиамериканськими фракціями. Представники проамериканських націоналістів уже оголосили про підтримку перевороту, оскільки вважається, що Арельяно прагне зберегти союз із Вашингтоном — головним постачальником озброєнь і інструктором гондураських військових.\n"
 HON_news.1.a: "До ваших послуг."
 HON_news.1.b: "Їх недарма називають чапас."
 HON_news.1.c: "Єдине, що дивує, — Вільєда Моралес протримався так довго."

 HON_news.2.t: "[Get_newspaper_header]Військові націоналісти здійснили переворот у Гондурасі"
 HON_news.2.desc: "Принизлива поразка в нещодавній «Футбольній війні» стала смертним вироком для крихкої демократії Гондурасу. На тлі наростаючого хаосу збройні сили завдали удару.\n\nУ своєму зверненні до нації Мелгар Кастро прямо заявив, що республіканський експеримент провалився. За його словами, слабкі політики, які постійно шукали захисту іноземних держав, не змогли захистити честь країни. Тепер влада перейшла до «справжніх патріотів». Хунта обіцяє залізною рукою вивести Гондурас із бідності та приниження й побудувати процвітаючу державу.\n\nСусіди Гондурасу та міжнародні спостерігачі відкрито стежать за ситуацією з тривогою. Відверто реваншистська риторика нового уряду в Тегусігальпі загрожує підірвати й без того крихкий баланс сил у Центральній Америці.\n"
 HON_news.2.a: "Наш найнадійніший союзник у Центральній Америці стає запеклим ворогом."
 HON_news.2.b: "Гіркий і кривавий відгомін «Футбольної війни»."
 HON_news.2.c: "Сусідам варто вдвічі посилити патрулювання кордонів."

 HON_news.3.t: "[Get_newspaper_header]Соціалістична революція в Гондурасі"
 HON_news.3.desc: "Соціалістичні сили під командуванням Лоренсо Селайї встановили контроль над Тегусігальпою, ознаменувавши крах колишнього гондураського режиму. Невдовзі після цього Селайя оголосив про створення нового уряду та початок масштабної аграрної реформи. Перші декрети передбачають націоналізацію ключової інфраструктури, зокрема активів Tela Railroad Company, а також експропріацію невикористовуваних земель, що належать іноземним сільськогосподарським корпораціям.\n\nЦі дії негайно спричинили реакцію: стрімкий відтік американського капіталу, масову евакуацію іноземних спеціалістів та різке збільшення бюджетного дефіциту. Формування відверто антиамериканського уряду в Гондурасі та конфіскація приватної власності загрожують стабільності ринків Центральної Америки, залишаючи відкритим питання, чи зможе нова влада впоратися з фінансовою кризою, що насувається.\n"
 HON_news.3.a: "Ще одна бананова республіка почервоніла."
 HON_news.3.b: "Земля нарешті повертається тим, хто її обробляє."
 HON_news.3.c: "Голий ідеалізм не нагодує голодні шлунки."
 
 HON_news.4.t: "[Get_newspaper_header]Гондурас приєднується до ОВН"
 HON_news.4.desc: "Сьогодні вранці, виступаючи перед величезним натовпом у затінку дерев у парку Ла-Леона, Модесто Родас Альварадо офіційно оголосив про вступ Гондурасу до Організації Вільних Націй як повноправного члена. Цей тріумф демократії спричинив справжню сенсацію у Сполучених Штатах. Американська преса вже називає його «справжнім ліберальним каудильйо», а журнал Time розмістив його портрет на своїй обкладинці.\n\nВашингтон святкує, забезпечивши собі не просто лояльного, а й ідеологічно близького союзника. Однак ця ідилія не є абсолютною: амбітні програми громадських робіт і посилення гондураського трудового законодавства вже викликають тихе роздратування в кабінетах керівників United Fruit та інших американських компаній. Але сьогодні ці голоси тонуть у святковому гулі — ОВН радісно проголошує, що альянс вільного світу став на одну націю сильнішим.\n"
 HON_news.4.a: "Новий Рузвельт на південь від американського кордону."
 HON_news.4.b: "Цікаво, як скоро United Fruit спробує підрізати йому крила?"
 HON_news.4.c: "Я аж тремчу від страху."
 HON_news.4.d: "Давній послідовник стає союзником."

 HON_news.5.t: "[Get_newspaper_header]Модесто Родас Альварадо вступив на посаду президента Гондурасу"
 HON_news.5.desc: "Після напружених виборів між Модесто Родасом Альварадо від Ліберальної партії та Рамоном Крусом Уклесом від Національної партії перемогу здобули чинні ліберали, а нинішній президент Вільєда Моралес із радістю передав владу своєму обраному наступнику.\n\nНапруженість супроводжувала весь виборчий сезон через можливість військового втручання: Збройні сили Гондурасу з тривогою сприймали прогресивну риторику Модесто Родаса Альварадо. Однак ці побоювання так і не справдилися. Бачення Альварадо щодо майбутнього Гондурасу передбачає програми за зразком «Нового курсу» колишнього американського президента Рузвельта. Модесто Родас Альварадо вже розпочав переговори щодо зміцнення відносин і зв'язків Гондурасу зі Сполученими Штатами. Тегусігальпою вже ширяться чутки, що Альварадо зрештою планує перетворити ці зв'язки на заявку Гондурасу на вступ до ОВН.\n"
 HON_news.5.a: "Світло свободи досягає Центральної Америки."
 HON_news.5.b: "Прикро, але з цим можна працювати."
 HON_news.5.c: "Американська могутність зміцнюється."

 HON_news.6.t: "[Get_newspaper_header]Рамон Крус Уклес вступив на посаду президента Гондурасу"
 HON_news.6.desc: "Після напружених виборів між Модесто Родасом Альварадо від Ліберальної партії та Рамоном Крусом Уклесом від Національної партії Національна партія здобула несподівану перемогу. Спадщина президента Вільєди Моралеса, який лібералізував Гондурас і розширював зв'язки зі Сполученими Штатами, опинилася під загрозою після поразки його Ліберальної партії.\n\nРамон Крус Уклес здобув перемогу, виступаючи проти цих зв'язків і відстоюючи незалежну зовнішню політику Гондурасу. Однак, зважаючи на те, наскільки тісно United Fruit Company вплетена в основу гондураської економіки, а Сполучені Штати залишаються головним постачальником і покровителем гондураських збройних сил, американці все ще мають значний вплив у країні. Хоча політичний вітер і трохи змінив напрямок, Гондурас усе одно залишатиметься бастіоном американського впливу в Центральній Америці.\n"
 HON_news.6.a: "Можливо, Уклесу варто ще раз переглянути свої переконання."
 HON_news.6.b: "Вашингтонська маріонетка починає вислизати з рук."
 HON_news.6.c: "Американцям дали легкого прочухана."
 
 CA_Football_War.2.t: "[Get_newspaper_header]Футбольна війна завершилася, гондураські війська зазнали втрат"
 CA_Football_War.2.desc: "Центральна Америка оговтується від завершення короткотривалої «Футбольної війни». Напередодні відбіркового матчу чемпіонату світу з футболу 1970 року між Гондурасом і Сальвадором останній розірвав дипломатичні відносини з першим, звинувативши його у геноциді через нещодавнє виселення великої кількості сальвадорців із території Гондурасу. Подальші прикордонні сутички переросли в короткий, але жорстокий конфлікт.\n\nГондураські військові, попри багаторічну допомогу Сполучених Штатів, перевагу в повітрі та чисельну перевагу, були змушені відступити від кордону на нові позиції навколо Тегусігальпи. Південь країни опинився відкритим для Сальвадору — багатшої та більш індустріалізованої з двох держав. Однак нестача пального обмежила просування сальвадорських військ, що підштовхнуло сторони до переговорного врегулювання. Гондурас гарантуватиме права сальвадорських мігрантів, а також виплачуватиме репарації — умови, з якими бідному та розколотому Гондурасу може бути важко впоратися.\n"
 CA_Football_War.2.a: "А Сальвадор ще й вийшов на чемпіонат світу з рахунком 3:2!"

 CA_Football_War.3.t: "[Get_newspaper_header]Гондурас перемагає у Футбольній війні"
 CA_Football_War.3.desc: "Центральна Америка оговтується від завершення короткотривалої «Футбольної війни». Напередодні відбіркового матчу чемпіонату світу з футболу 1970 року між Гондурасом і Сальвадором останній розірвав дипломатичні відносини з першим, звинувативши його у геноциді через нещодавнє виселення великої кількості сальвадорців із території Гондурасу. Подальші прикордонні сутички переросли в короткий, але жорстокий конфлікт.\n\nБагатство та індустріалізація Сальвадору не змогли перетворитися на військові успіхи. Гондураські військові, які скористалися американською допомогою та перевагою в повітрі й чисельності, змогли прорвати сальвадорські лінії та створити загрозу Сан-Міґелю, змусивши Сальвадор запросити переговори про врегулювання. Окрім виплати компенсацій, Сальвадор має поступитися цінними правами на використання ресурсів у прикордонній зоні та погодитися на масову репатріацію сальвадорських мігрантів — умови, які громадськості Сальвадору може бути важко прийняти.\n"
 CA_Football_War.3.a: "Принаймні Сальвадор переміг у відборі на чемпіонат світу..."
