 # Leaders
 HON_Ramon_Villeda_Morales: "Рамон Вільєда Моралес"
 POLITICS_HON_Ramon_Villeda_Morales_DESC: "Дехто в Гондурасі називає Рамона Вільєду Моралеса нудним. Вони не чують гучних промов, закликів на захист народу чи погроз його ворогам. Він уже не молодий, його волосся посивіло, а замість традиційного вбрання кампесіно він носить свіжовипрасуваний костюм. Однак ті, хто так думає, зовсім не знають свого президента.\n\nСпокійна зовнішність Моралеса приховує політичну проникливість, сформовану як бідністю, так і привілеями, що вирізняло його серед більшості населення країни. Попри скромні статки, його батьки відправили його навчатися, де він досяг таких успіхів, що зміг вступити до Берлінського університету імені Гумбольдта напередодні Другої світової війни. Тісний і доброзичливий світ його дитинства був зруйнований державно санкціонованою ненавистю НСДАП: він чув нічні облави у квартирах і крики Гітлера з радіоприймачів. Його відраза до жорстокості та корупції привела його до Ліберальної партії Гондурасу, де він піднявся політичними сходами, аж поки не став переможцем виборів 1960 року — і водночас жертвою подальшого перевороту.\n\nПроте десятиліття доброї репутації, здавалося, переконали Бога змусити військових відійти від влади й дозволити йому повернутися до неї. З огляду на це Моралес справді тримає язик за зубами, але саме це дозволяє йому підписувати закони, які, як він знає, допоможуть його народу позбутися корупції, бідності та експлуатації. Для Моралеса і його країни є лише один шлях — уперед, ніколи назад, незалежно від темпу чи довжини їхнього кроку."
 HON_Modesto_Rodas_Alvarado: "Модесто Родас Альварадо"
 POLITICS_HON_Modesto_Rodas_Alvarado_DESC: "Модесто Родас Альварадо доклав усіх можливих зусиль, аби стати президентом Республіки. Народившись 15 березня 1921 року в маленькому скромному містечку Сабанагранде, Альварадо був підштовхнутий родиною до навчання та прагнення до більшого, ніж міг запропонувати сільський світ, у якому він виріс. Подорослішавши, він вступив до університету, але політична нестабільність змусила його та його родину втекти до Нікарагуа. Та навіть це не змусило його припинити навчання.\n\nПовернувшись на батьківщину, він на власні очі побачив становище свого народу: бідні маси, що працювали на величезних землях фруктових компаній, жебраків на вулицях і старі будинки тих, кому пощастило жити в містах. Однак Альварадо бачив інше рішення — рішення, натхненне поколінням, яке на власні очі спостерігало за смертю Ґайтана, переворотом Батісти та зануренням його континенту в диктатуру. Альварадо з головою поринув у лави Ліберальної партії, де його харизма й відданість народу проклали йому шлях до президентства Національного конгресу, де він став рушійною силою стабільних реформ Моралеса.\n\nКоли настали вибори, для PLH існував лише один природний вибір. Альварадо входить до президентського кабінету з пристрастю покоління Ґайтана, тримаючи у своєму серці свій народ, свої землі та демократію, сповнений рішучості зламати корумповані традиції своєї країни або навіки приректи її на повернення до минулого."
 HON_Roberto_Suazo_Cordova: "Роберто Суасо Кордова"
 POLITICS_HON_Roberto_Suazo_Cordova_DESC: "У країні, сповненій переворотів, полковників і каудильйо, багато хто не помічає не менш небезпечної боротьби, якою є демократія. Та на борту USS Honduras війни ведуться не лише гвинтівками — їх ведуть словами на полях битв у свідомості тих, хто намагається керувати цією країною. Побіжний погляд на Роберто Кордову міг би підказати, що його виховання як лікаря та становище правої руки Родаса Альварадо в Ліберальній партії зробили його життя чи кар'єру легкою. Це було б помилкою.\n\nКоли Альварадо залишив посаду голови Ліберальної партії, естафета безперешкодно перейшла до Кордови — людини того самого покоління, що й Родас, яка була свідком тих самих подій. Він знав боротьбу простого народу, а як і Моралес, був лікарем, що робило його ідеальним кандидатом для ліберальної політичної машини. Здобувши президентство, Суасо подумав, що все це, можливо, надто добре, щоб бути правдою, — і мав рацію. Центральна Америка вже не була тією спокійною землею, якою колись здавалася. Вона кишіла партизанами, невдоволеними селянами та людьми, які вирушили в густі джунглі, щоб боротися за власне бачення справедливості, зазвичай забарвлене в червоний колір.\n\nТепер Кордові належить вирішити неможливе: між тими у Вашингтоні та Національному палаці, які закликають його послати армію, придушити партизанів і забезпечити кордон, та янголом на його плечі, який благає подумати про бідних і гарантувати дотримання прав людини у своїй країні. Можливо, шлях до президентства був приємним, але тепер, зіткнувшись зі світом, що постійно змінюється, його шлях до збереження влади може обірватися."
 HON_Oswaldo_Lopez_Arellano: "Освальдо Лопес Арельяно"
 POLITICS_HON_Oswaldo_Lopez_Arellano_DESC: "Для будь-якого студента, що вивчає історію Латинської Америки, Арельяно міг би здатися типовим диктатором-банановим генералом, але правда набагато складніша. Арельяно не є неосвіченим грубіяном, який силоміць пробив собі шлях до президентства. Насправді він виріс у впливовій родині, але залишив комфортне життя в Тегусігальпі та у 18 років вступив до армії — напередодні Другої світової війни в Європі.\n\nПрезидентство Каріаса прищепило йому палкий націоналізм Старого Світу щодо власної країни, а завдяки освіті та вільному володінню англійською, які дозволили йому навчатися у Сполучених Штатах, він зблизився зі своїми майбутніми покровителями. Коли Національна партія почала розпадатися, Арельяно оплакував падіння людини, якій приписував розвиток і зміцнення Гондурасу. Коли Каріас проголосив військових спадкоємцями «націоналізму», ця спроба заручитися підтримкою армії зробила набагато більше для майбутнього генерала. Для Арельяно це стало покликанням — врятувати свого героя та свою батьківщину.\n\nАрельяно став «президентом» не для того, щоб збагатитися чи насолоджуватися славою влади. Арельяно прагне врятувати свою країну від усього, що вважає загрозою. Політика, законність, корупція — до біса все це. Арельяно зробить Гондурас багатим, зробить його безпечним і перетворить його на предмет заздрості сусідів. Арельяно тут, щоб робити те, що необхідно, незалежно від ціни — заради свого народу, заради Каріаса і заради своєї країни."
 HON_Juan_Alberto_Melgar_Castro: "Хуан Альберто Мельгар Кастро"
 POLITICS_HON_Juan_Alberto_Melgar_Castro_DESC: "Уявіть, що ви народилися в цілковитій бідності. Ви працюєте на важких низькооплачуваних роботах, сподіваючись щодня заробити достатньо, щоб поїсти. Ви вирішуєте, що єдиний вихід із бідності — вступити до армії, тож приходите на перший день навчання в сандалях, тоді як усі ваші товариші мають взуття. Уявіть, що ви єдиний представник корінного населення у своєму підрозділі. Ваші товариші очікують побачити дикого «червоношкірого», який б'є у військові барабани та вигукує незрозумілі бойові кличі. Натомість ви чудово навчаєтеся у військовій школі, демонструєте лідерські здібності, яких ніхто не очікував від людини вашої раси, та особисту дисципліну, якій позаздрив би будь-який генерал. Ви — Хуан Альберто Мельгар Кастро.\n\nМельгар знайшов розраду в дисципліні та найнеобхіднішому, що давала йому армія. Його надихали промови Каріаса, його слова про те, що армія є спадкоємицею націоналізму, що він сам є продовженням великих народів майя та що саме йому належить майбутнє його країни. Це майбутнє було зруйноване лібералами з їхніми добрими намірами та корумпованими безхребетними дурнями, які випадково стали генералами. Та він мовчав, виконуючи накази, аж поки більше не зміг. Коли його країну принизили, навіть зневажили сальвадорці.\n\nЙого країна відійшла далеко від того, чим була колись. Вона гнулася перед грінго, які ніколи не ступали на її береги. Вона розжиріла від корупції. Вона деградувала до стану, на який Мельгар більше не міг дивитися. Згадуючи промови, які свого часу витягли його з бідності, він зрозумів: лише він здатен її врятувати."

 HON_Ramon_Ernesto_Cruz_Uccles: "Рамон Ернесто Крус Уклес"
 POLITICS_HON_Ramon_Ernesto_Cruz_Uccles_DESC: "У піраміді потреб Маслоу, щойно людина забезпечує свої базові потреби, вона починає прагнути більшого. Каріас приніс Гондурасу розвиток, забезпечивши людей інфраструктурою та витягнувши їх із нищівної бідності — тим, що Уклес бачив на власні очі, коли ріс у Кантарранасі. Коли люди почали прагнути більшого, Ліберальна партія Гондурасу прийняла це ідеалістичне та сповнене мрій покоління до своїх лав. Уклес належить до цього покоління, але він не з тих, хто засуджує «корумповані» та «жорстокі» методи, завдяки яким ці потреби були задоволені. Навпаки, він відстоює їх навіть після того, як вони вийшли з моди.\n\nУклес бачив, до чого цей ірраціональний ідеалізм доводить нації. Він із теплотою згадує свої університетські роки в місті Гватемала й сумує, спостерігаючи за хаосом переворотів і заворушень, спричинених людьми, які мають правильні наміри, але не мають засобів для їх реалізації. Не можна просто розірвати систему на частини — з нею треба працювати. Не мрія привела Гондурас так далеко, а реальність, у якій Уклес є експертом. Робота у Верховному суді навчила його, що корупція в політиці була лише мастилом, необхідним для того, щоб механізм продовжував працювати, і що навіть ті, хто проливав кров за синьо-білий прапор, вдавалися до цієї практики. Хоча сам він утримується від цього, він не бажає обрушувати пекельний вогонь на тих, хто так робить. Його обрали, щоб зробити кращою свою країну, а не її систему, і він сповнений рішучості зробити все необхідне, аби принести своїй країні найкраще. Більше жодних ляльководів, жодної експлуатації й більше жодної країни, де літнім людям доводиться жебракувати, як на вулицях його рідного міста."
 HON_Andres_Alvarado_Puerto: "Андрес Альварадо Пуерто"
 POLITICS_HON_Andres_Alvarado_Puerto_DESC: "Андрес Альварадо Пуерто народився в заможній та впливовій родині. У дитинстві він ніколи не знав нужди — його відправили до найкращих шкіл. Він навчався разом із багатьма провідними діячами Ліберальної партії Гондурасу, що сформувало в ньому палке переконання в необхідності допомагати бідним. То чому ж тоді він опинився у списку кандидатів Національної партії, свого головного ворога протягом усієї політичної кар'єри?\n\nХоча Андрес не знав тієї гондураської бідності, яку переживали його співвітчизники, Пуерто все ж зміг вирватися з бульбашки багатства та фантазій. Роки навчання десяти заповідей, важливості чесності та справедливої Божої руки — усе це було викинуто у вікно. Яке це мало значення? Піднявши капот, Пуерто побачив справжню силу, яку політична корупція та культурне заступництво мали в його країні, і відчув безпорадність. Він був там, коли його партія програла вибори 1966 року, і відсторонено спостерігав, як партія, чиї ідеали він поділяв і за які боровся, розпадалася. Перед ним постав вибір: залишитися чи перейти на інший бік. Врятувати свою кар'єру чи продовжити марну боротьбу за свої ідеали. Ідеали не вони зробили його родину багатою.\n\nКоли він перейшов, Пуерто змінив лише партію, у якій був зареєстрований. Пуерто зберіг ті самі переконання, що й під час роботи з Вільєдою Моралесом, ніколи не втрачаючи відданості своєму народу та його добробуту. Втрачено було лише його честь — тепер він із відразою стоїть на вершині корупційної машини, яку не здатен зупинити. Та це гостре відчуття згасає, коли він заплющує очі й уявляє сім'ю, яка завдяки його останньому хабарю нарешті змогла замінити солом'яний дах або земляну підлогу."

 HON_Lorenzo_Zelaya: "Лоренсо Селая"
 POLITICS_HON_Lorenzo_Zelaya_DESC: "У Гондурасі могли існувати соціальні упередження, але ніколи не було офіційно встановлено, що селяни мають залишатися селянами, а багатії — політиками. Та все ж ті селяни, яким пощастило вміти читати, помічали в газетах одні й ті самі прізвища та риси обличчя. Коли американські компанії встановили радіоприймачі на складах і в їдальнях, молодь почала слухати промови з Гватемали, Колумбії та Куби — і в них почали з'являтися нові ідеї. Почали формуватися профспілки, з темношкірих і селянських мас почали виходити нові діячі, а найвідомішим серед них став Лоренсо Селая.\n\nВід страйків до заворушень і протестів — Селая був на чолі всього цього. У 29 років Селая створив перший у всій країні національний селянський комітет і невдовзі очолив марш протесту проти захоплення компанією Tela Railroad Company земель, на яких вони жили та працювали. Після успіху Селая посилив тиск, використовуючи паралізуючі страйки, щоб змусити уряд провести аграрну реформу. Проте така влада в руках лівого політика ніколи не закінчувалася добре в Центральній Америці, навіть коли президент поділяв його інтереси. Саме тоді прийшли солдати, а «реформістський» президент схвалив убивства людей, разом із якими виріс Селая.\n\nРоками він жив у джунглях разом із найбіднішими з бідних, рятуючись від переслідувачів і молячись, щоб оливково-зелені люди не видали себе зі сходом сонця. Він на власні очі бачив і переживав тяжке становище свого народу та присвятив себе пошуку політичного засобу від його страждань. Коли ситуація в столиці погіршилася, він нарешті побачив можливість: визволення. Визволення від прикладів рушниць і бідності. Шанс вийти на вулиці та знову зробити свою спустошену країну цілісною."

 ##National Spirits
 HON_USS_Honduras: "USS «Гондурас»"
 HON_USS_Honduras_desc: "Ніде більше в Центральній Америці не знайти такої безумовної відданості своїм господарям янкі, як в Гондурасі. Попри існування національного уряду, майже кожен політик перебуває на побігеньках у своїх покровителів у Вашингтоні, але ця відданість не позбавлена переваг.\n\nВ обмін на свою покірність армія США розміщує своїх солдатів по всій країні, придушуючи повстання ще до того, як вони почнуться, патрулює небо в пошуках японських шпигунських літаків, а також пришвартовує свої кораблі в наших гаванях, захищаючи гондураську торгівлю від домініканських піратів.\n\nСхоже, що ці унікальні відносини залишаться з нами надовго, але якщо Гондурас спіткає якась національна янкі-трагедія, їхнє симбіотичне співіснування може зазнати незворотних змін."

 HON_Banana_Kings: "Бананові королі"
 HON_Banana_Kings_desc: "United Fruit. Coca-Cola. Standard Fruit. Ці назви добре відомі по всьому регіону. Як і в багатьох країнах Центральної Америки, вони панують в економічній сфері — але ніде більше їхнє панування не є настільки всеохопним, як у Гондурасі. Понад половина придатних для обробітку земель країни належить мегакорпораціям, які правлять національною економікою так, ніби вони королі, але епоха імперій у цьому регіоні давно минула.\n\nВони забувають, що правлять не середньовічними селянами, а свідомими робітниками, які шукають натхнення в навколишньому світі. Минає час, робітники об'єднуються в профспілки, а націоналістичні настрої в країні зростають. І попри те, що ставлення до робітників тут менш драконівське, ніж в інших країнах, може настати день, коли сонце остаточно зайде над Банановими королями. Але цей день настане ще дуже нескоро."

 HON_Creeping_Colonels: "Полковники, що підкрадаються"
 HON_Creeping_Colonels_desc: "Модернізація армії за часів президента Гальвеса гарантувала, що гондураські збройні сили готові протистояти небезпекам Холодної війни. Однак короткий період військового правління у 1960 році спонукав військових внести зміни до конституції, закріпивши за своїм головнокомандувачем звання генерала замість посади президента.\n\nВідсутність цивільного контролю перетворила армію на добре відлагоджену та ефективну політичну зброю, здатну діяти у власних інтересах, а також на один із найсильніших інституційно та найбільш надійних інститутів у Гондурасі. Можливо, якщо якийсь політик наважиться надто далеко відхилитися від протоптаного шляху, ці нетерплячі офіцери знову кинуться відновлювати стабільність — як вони, здається, аж надто прагнули зробити у 1960 році."

 HON_Border_Tensions: "Прикордонна напруженість"
 HON_Border_Tensions_desc: "Сальвадор і Нікарагуа продовжують утримувати території, на які претендує Гондурас, і кожен добрий гондурасець знає, що його обов'язок — повернути їх. До того ж їхні сусіди конкурують із ними в економічній сфері, перешкоджаючи власним спробам Гондурасу провести індустріалізацію та модернізацію. Особливо це стосується Сальвадору, чиє стрімке перенаселення спричинило його поширення на західні території, відбираючи значну частину дефіцитної землі, на якій могли б жити корінні гондурасці.\n\nУ міру того як напруженість у цих районах зростає, а відповідні уряди не роблять жодних спроб допомогти виправити ситуацію, гондурасці розуміють, що це їм не друзі, а лише вовки в овечій шкурі."

 #Liberal Path
 HON_Honduran_Gaitan: "Гондураський Гайтан"
 HON_Honduran_Gaitan_desc: "З перемогою Альварадо та Ліберальної партії Гондурас довів самому собі, що, попри сусідів і власну історію, демократія може вижити в цьому регіоні. Альварадо сяє як яскравий приклад центральноамериканського союзника, яким не править якийсь деспот, а відданий демократ, що планує розпочати кампанію повільних, послідовних реформ.\n\nБудучи прихильником «Нового курсу», Альварадо планує розширити державні громадські роботи та соціальні програми, щоб полегшити становище бідних і відсталих регіонів країни, а також значно поглибити її зв'язки з ОВН.\n\nОднак він може зіткнутися з певними труднощами у відносинах із UFC та американськими інтересами в країні, попри теплий прийом із боку янкі після його приходу до президентства."
 #Oligarch Path
 HON_If_It_Aint_Broke: "Якщо воно не зламане..."
 HON_If_It_Aint_Broke_desc: "Понад 16 років Тібурсіо Каріас Андіно обіймав посаду президента Гондурасу. Значна частина відносної стабільності, економічного прогресу та всього фундаменту нашої держави може бути приписана саме йому та його політиці. Навіщо нам змінювати систему? Здається, що щоразу, коли країна відхиляється від шляху, який він для нас проклав, трапляється національна трагедія. Ліберали навіть продають нашу політику янкі.\n\nТепер народ висловив свою волю. Їм не потрібні нові шляхи чи грандіозні ідеали. Їм потрібен прагматизм. Вони хочуть роботи, стабільності та миру — і саме це Рамон Уклес та PNH прагнуть принести Гондурасу: незалежну, стабільну державу. Якщо система не зламана, навіщо намагатися її лагодити?"
 #Military Path
 HON_Just_Like_Anyone_Else: "Такі ж, як і всі інші"
 HON_Just_Like_Anyone_Else_desc: "Протягом значної частини своєї недавньої історії Гондурас користувався відносною політичною стабільністю, на відміну від своїх сусідів. Однак останні два роки стали свідками стрімкого занепаду цього благословення, дарованого американцями.\n\nЗнову PLH та PNH не можуть дійти згоди ні в чому й довели країну до повного паралічу. І знову, за благословення американців, військові втрутилися, щоб опустити завісу над нашою національною грецькою трагедією.\n\nІ знову Освальдо Арельяно постає перед нацією, присягаючись повернути демократію та стабільність і повторюючи ті самі заяви, які він робив у 1960 році. Він уже розпочав кампанію з перебудови режиму, щоб зробити його ще більш проамериканським, ніж він є зараз. Спостерігаючи, як історія повторюється просто перед їхніми очима, народ Гондурасу не може позбутися відчуття, що вони стали такими ж, як і будь-яка інша бананова «республіка» навколо них."

 #Football War Liberal Win
 HON_Sobreviviendo: "Sobreviviendo"
 HON_Sobreviviendo_desc: "Якби поглянути на карту, можна було б припустити, що під час Футбольної війни Гондурас мав перевагу — хоча б через розміри нашої країни порівняно із Сальвадором. Реальність була зовсім іншою. Ми були аутсайдерами: менш населеним, менш індустріалізованим і значно менш розвиненим державним утворенням. Та завдяки Божій волі, нашому народу й нашим покровителям ми перемогли сальвадорців, і хоча перемир'я може проголошувати «status quo ante bellum», ми чудово знаємо, хто здобув перемогу.\n\nРепарації надходять до державної скарбниці, а сальвадорці починають свій шлях назад через кордон, тоді як у Тегусігальпі натовпи радіють на площах і в парках країни. Схоже, політика розчинилася в національній гордості, а можливо, нещастя цього десятиліття просто розчиниться в історії. Попри всі шанси, Гондурас вижив."

 HON_La_Republica_Liberal: "La República Liberal"
 HON_La_Republica_Liberal_desc: "Гондурас довів світові, що держава, яку підтримує Америка, у цьому забутому Богом куточку світу не обов'язково має бути якоюсь диктатурою злиденного каудильйо. Президента Альварадо прославляють як гондураського ФДР, яскраву зірку лібералізму на темному небосхилі диктаторів.\n\nЙого республіка утвердила систему ліберальної демократії після багатьох років боротьби з корупцією та культурою каудильйо в країні, а також навіть змогла відновити цивільний контроль над військовими, через що такі люди, як Арельяно, втратили свій вплив у країні.\n\nПодейкують, що молода, але стабільна демократія планує приєднатися до OFN, долучившись до хрестового походу проти фашизму й авторитаризму, тоді як Гондурас гордо стоїть пліч-о-пліч із найвеличнішими демократіями світу."

 HON_King_Banana_Queen_Land_Reform: "Король Банан і Королева Земельна Реформа"
 HON_King_Banana_Queen_Land_Reform_desc: "Будь-який експерт міг би сказати вам, що відверта експлуатація Гондурасу компаніями United Fruit, Coca-Cola та іншими мегакорпораціями несумісна з демократією. І цей експерт має рацію, адже те, що переслідує їх, нарешті прийшло: земельна реформа.\n\nОднак рішуче проамериканський режим не прагне виганяти компанії з країни, розмахуючи мачете, адже їм належить понад половина земель країни. Натомість уряд прагне співіснувати з ними, знайти більш справедливе рішення як для народу Гондурасу, так і для компаній, які його працевлаштовують.\n\nСонце зайшло над Банановими королями, але їх не скинули з трону — до них просто приєдналася їхня нова королева."
 #Football War Oligarch Win
 HON_Viva_El_Cariacismo: "Хай живе каріасизм"
 HON_Viva_El_Cariacismo_desc: "Від моменту свого обрання у 1966 році PNH зіткнулася з опором своїй програмі «незалежної» зовнішньої політики та розширення повноважень уряду. Заяви про «реакційну політику» залишилися без уваги, коли їхня політика довела свою правильність під час захисту Гондурасу. Реформи вже випробовували — і вони провалилися. Військові намагалися захопити владу — і теж провалилися. Лише традиція, з її перевіреними часом методами, здатна привести націю до процвітання.\n\nПісля своєї перемоги народ дозволив PNH повернутися до колишнього, більш корумпованого стилю правління без жодних нарікань. Створення нового класу місцевих інвесторів і гондураських економічних картелів забезпечило їм лояльну опору.\n\nСхоже, для більшості людей базові життєві потреби, які PNH їм забезпечила, стали достатньою причиною погодитися з тим, щоб партія правила так, як вважає за потрібне. Доти, доки Гондурас зможе продовжувати свій поступ, спадщина каріасизму залишатиметься при владі."

 HON_Leaving_the_Nest: "Вилітаючи з гнізда"
 HON_Leaving_the_Nest_desc: "PNH, під впливом своїх більш націоналістичних фракцій, вирушила у хрестовий похід за створення незалежної зовнішньої політики для своєї країни. Заручившись підтримкою деяких баронів, уряд намагався об'єднати дрібні промислові підприємства та інші економічні активи під своїм крилом під приводом «самовизначення».\n\nХоча в економічному плані PNH та Гондурас, найімовірніше, залишатимуться під американським контролем, президент Уклес доклав усіх можливих зусиль, щоб проводити менш завзято проамериканську дипломатичну політику."
 HON_Leaving_the_NestEffect: "§FФракція §m, орієнтована на Америку, всередині§! §sPNH§! [Get_HON_PNH_Alignment_tt]"
