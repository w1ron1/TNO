 tno_admin_title_map_mode_same_state_tooltip: "Цей регіон уже вибрано."
 tno_admin_title_map_mode_tooltip_delayed: "Ви можете змінити вибраний регіон для цього режиму карти, натиснувши на інтерфейс адміністративного титулу іншого регіону.\n----------\n§FВизначення:\n---\n§YАдміністративний титул§! = Адміністративна одиниця першого рівня регіону. Він також може позначати адміністративну одиницю другого рівня, якщо регіон є частиною більшої адміністративної одиниці.\n§YОсновний і другорядний пов'язані регіони§! = Географічна або культурна територія, з якою пов'язаний регіон (напр.: іспанські регіони). Вони також можуть позначати адміністративну одиницю першого рівня, до якої належить регіон (напр.: китайські провінції).\n§YСубадміністративний титул§! = Адміністративні одиниці другого або третього рівня регіону. Він також може позначати адміністративні одиниці першого рівня регіону, якщо сам регіон не складається з однієї адміністративної одиниці.\n§!"

