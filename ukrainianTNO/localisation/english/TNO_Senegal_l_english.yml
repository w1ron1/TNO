 ## Leader Descs ##
 POLITICS_LEOPOLD_SEDAR_SENGHOR_DESC: "16 років поневірянь. Саме стільки часу знадобилося Леопольду Седару Сенґору, першому президентові Республіки Сенегал, щоб прибути туди, що він міг назвати домом. Поет та інтелектуал, який досконало володів французькою мовою, Сенґор був одним із небагатьох чорношкірих підданих колоніальної Франції, які мали достатньо привілеїв, щоб навчатися в Сорбонні та після закінчення стати професором французької граматики. Попри те, що він відкрито критикував расизм у французькому суспільстві, він вступив до французької армії та воював проти нацистів, вірячи в майбутнє, де до всіх людей ставитимуться як до рівних. На жаль, цього не сталося. Захоплений німцями, він та його товариші-солдати ледве уникнули страти й вирвалися з таборів для військовополонених, коли їх звільнили за медичними показаннями.\n\nКоли війна закінчилася й стало зрозуміло, що в Європі більше немає надії на визволення, Сенґор повернувся до Західної Африки, щоб відібрати контроль у бездарної колоніальної адміністрації петеністів. Нова Республіка Сенегал була країною, заснованою на принципах африканського визволення та «негритюду» — антиколоніалістської концепції, яку частково розробив сам Сенґор і яка ґрунтується на ідеї сильної африканської національної культури. Водночас президент Сенґор досі підтримує тісні зв'язки зі старою Французькою республікою, підтримуючи близькі контакти з де Ґоллем і дозволяючи деяким французьким адміністраторам входити до його уряду.\n\nЦя двозначність не уникла уваги його критиків, які швидко вказали на розбіжність між його закликами до визволення Африки та його відданістю колишнім гнобителям. Зрештою, тигр не проголошує, що він тигр; він стрибає на свою здобич. Чорній людині не потрібен дозвіл якихось нині неважливих білих, щоб правити, їй просто потрібно взяти те, що належить їй за правом. Через відсутність будь-якої сильної опозиції до Сенґора в уряді Сенегал став політично застійною державою, а панафриканські революціонери прагнуть усунути його та його французьких посіпак, щоб створити державу за моделлю Камеруну. Але тепер, коли він знайшов свій дім, Сенґор більше не хоче поневірятися. Він перетворить Сенегал на сяючий приклад для всіх африканців, і заради цього доведеться піти на деякі жертви."

