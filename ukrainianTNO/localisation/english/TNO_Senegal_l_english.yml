 ### Ideas ###
 SEN_idea_senegalese_stiffness: "Сенегальська заскорузлість"
 SEN_idea_senegalese_stiffness_desc: "Сенегал є одним із найстаріших стабільних режимів у Західній Африці, але ця стабільність побудована на хитких підвалинах. Уряд має обережно балансувати між популярною серед народу Сенґора панафриканською ідеологією негритюду та інтересами більшости волофів, які прагнуть зберегти своє привілейоване становище. Республіка Сенегал, якою вона могла б стати, все ще далека від справді рівноправної демократії."
