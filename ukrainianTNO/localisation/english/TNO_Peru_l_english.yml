  ### Leader Description ###
  POLITICS_MANUEL_PRADO_UGARTECHE_DESC: "Народжений у 1889 році в заможній родині, син колишнього президента Мануеля Іґнасіо Прадо, Мануель Прадо Уґартече — інженер-будівельник, який став одним із головних діячів перуанської політики протягом 1940-х і 50-х років. Підіймаючись політичними сходами, він був обраний президентом Оскаром Р. Бенавідесом як його наступник і переміг на виборах 1939 року. Прадо продовжив придушення заборонених АПРА та ККП, розпочате Бенавідесом. Коли нацисти вторглися до Польщі, уряд Прадо змінив курс Перу, запровадивши нову зовнішню політику. Після нападу на Перл-Гарбор Прадо публічно підтримав США та союзників, щоб зберегти добрі відносини Перу з Вашингтоном, але залишив двері відкритими для Японії як альтернативи. До 1944 року результат війни здавався невизначеним, але США все ще міцно трималися. Тож Прадо зберігав свою «нейтральну» зовнішню політику аж до фатального дня, коли Перл-Гарбор було стерто спалахом сліпучого світла, а США підписали умовну капітуляцію державам Осі.\n\nПриголомшений тим, як упав могутній північний велетень, Мануель Прадо все ж був переконаний, що зробив правильний вибір, очікуючи, що все залишиться як раніше. Після завершення його терміну він залишив Перу й вирушив до США та Канади. Здалеку він спостерігав, як його батьківщина занурювалася в хаос, а потім поверталася до подоби нормальности. Саме ця нормальність переконала його повернутися у 1956 році, щоб балотуватися на виборах 1957 року, але він не міг балотуватися без народної підтримки. Його близькі союзники переконали його укласти союз із Бельтраном під назвою Консервативно-демократичний національний союз і співпрацювати з Мануелем Одріа. Фатальний «Пакт Монтерріко» було укладено: Прадо мав перемогти на виборах як кандидат від КДНС в обмін на те, що корупцію Одріа замітуть під килим. Під час свого другого терміну Прадо скасував Закон про національну безпеку, але зберіг заборону на АПРА та РС, водночас звільнивши деяких із їхніх найпоміркованіших членів. Він також успішно працював із Педро Бельтраном над стабілізацією економіки.\n\nМинуло п'ять років відтоді, як Прадо став президентом, і все ж ще стільки всього потрібно зробити. З наближенням виборів, фракційною боротьбою в КДНС, інвестиційною війною та загрозою АПРА Прадо готується зробити свої останні кроки перед відходом із посади. Він і надалі дотримуватиметься своєї традиційної тактики — нічого не робити, доки все не повернеться до нормальности. Раніше це працювало, спрацює й цього разу. §RПравда ж?§!"

  POLITICS_FERNANDO_BELAUNDE_TERRY_DESC: "Народжений у Лімі 7 жовтня 1912 року, Фернандо Белаунде, більш відомий своїм прихильникам і перуанській пресі як Архітектор Белаунде, водночас є типовим перуанським політиком і чимось зовсім нетиповим та самобутнім. Народжений у дуже впливовій аристократичній родині, родовід якої сягає перших іспанських мешканців Ліми, та син дворазового прем'єр-міністра Перу Рафаеля Белаунде, Белаунде мав комфортне й перспективне юнацтво.\n\nПісля навчання у Сполучених Штатах Белаунде повернувся до Ліми й став заможним підприємцем, а також надзвичайно відомим завдяки своїй академічній та архітектурній діяльності. Завдяки зв'язкам свого батька він обіймав численні політичні посади, від яких йому довелося відмовитися лише за режиму Одріа. Він зайнявся політикою, заснувавши Національний фронт демократичної молоді — групу молодих активістів, налаштованих на реформи, яка висунула його кандидатуру у 1956 році проти Мануеля Прадо. Посівши друге місце на тих виборах, він перетворив НФДМ на повноцінну політичну партію — Народну дію (НД). Ґрунтуючись на своїх ідеях Перу як Доктрини, він відвідував кожне перуанське місто, у якому бував, і створював там осередки НД — а побував він у всіх. Це зробило його найвідомішим і найголоснішим противником адміністрації Прадо.\n\nТепер, після досягнення того, чого йому не вдалося у 1956 році, на Архітектора Белаунде чекає довгий шлях. Багато планів ось-ось буде запущено в дію, але лише час покаже, чи має він політичну витонченість, якої бракувало його попередникам."

  POLITICS_LUIS_BEDOYA_REYES_DESC: "Народжений 20 лютого 1919 року в перуанському портовому місті Кальяо, Луїс Фернан Бедоя Рейєс мав скромне, але впливове походження. З юного віку він був відомий як розумна й обдарована людина, що привело його до закінчення Університету Сан-Маркос, найстарішого закладу вищої освіти в Америці, з найвищими оцінками. Після цього він розпочав перспективну кар'єру юриста.\n\nНатхненний ідеалами християнської демократії ще зі студентських років, він став одним із найперших членів Християнсько-демократичної партії Перу (ХДП). Через коаліцію ХДП із Народною дією Белаунде на виборах 1963 року адміністрація Белаунде призначила його міністром юстиції. Завдяки своїй видатній роботі на міністерській посаді він став підтриманим Белаунде кандидатом на виборах мера Ліми 1964 року. Там він із великим відривом переміг популярну колишню першу леді Перу Марію Дельґадо де Одріа. Під час свого перебування на посаді він став відомий як найпродуктивніший мер в історії Ліми, здобувши захоплення країни завдяки досягненню величезних результатів без жодних зв'язків із корупцією та хабарництвом. Розчарувавшись і в Белаунде, і в ХДП, він створив власну політичну партію — Християнську народну партію (ХНП), яка мала вести країну до необхідних реформ, водночас залишаючись вірною ідеалам християнського соціального вчення.\n\nТепер він досяг того, чого багато хто міг і не міг передбачити водночас. Він справді піднявся на вершину слизького політичного стовпа — до президентства Перу. Можливо, завдяки щасливому збігу обставин або сприятливому повороту долі в часи, коли демократії світу перебувають під загрозою, Перу отримало саме ту людину, яка зможе зміцнити власну демократію та забезпечити її довговічність. Залишається лише дивуватися, чи зможе андська країна й надалі зберігати свою щасливу смугу."

  POLITICS_MANUEL_ARTURO_ODRIA_DESC: "Мануель Артуро Одріа — не хто інший, як дуже типовий представник політичної еліти Латинської Америки, як у хорошому, так і в поганому сенсі. Народжений 26 листопада 1896 року в перуанській провінції Тарма в родині з відомими військовими традиціями, він із юного віку прагнув вступити до армії, де вирізнявся серед своїх товаришів як розумний і дисциплінований солдат. Це забезпечило його поступове просування військовими званнями, аж поки під час Першої війни з Еквадором він не став одним із генералів перуанського верховного командування.\n\nУ 1947 році він став міністром війни в адміністрації президента Хосе Бустаманте-і-Ріверо після терористичної атаки АПРА. Після того як Бустаманте відмовився знову оголосити АПРА незаконною організацією, Одріа разом з рештою перуанських збройних сил усунув його в результаті перевороту в жовтні 1948 року. Після цілком чесних виборів 1950 року Одріа був легітимізований як президент Перу. Його адміністрація характеризувалася популярними інфраструктурними програмами, такими як національний стадіон Перу, та розширенням національної програми страхування Перу. Водночас вона характеризувалася переслідуванням АПРА та дуже жорстокими репресіями проти її бойовиків. Під тиском як внутрішніх, так і зовнішніх сил — ОВН та Сполучених Штатів — у 1956 році Одріа був змушений відновити демократичний лад у країні. Він передав президентство переможцю того року, Мануелю Прадо Уґартече, з яким раніше домовився мирно піти з посади в обмін на те, що Прадо не розслідуватиме численні звинувачення в корупції проти нього.\n\nТепер, після чергового провалу цивільного політичного класу Перу, Одріа повернувся на президентську посаду, і справа, яку він розпочав під час революції 48-го року, буде завершена — хоч би янкі це подобалося чи ні!"

