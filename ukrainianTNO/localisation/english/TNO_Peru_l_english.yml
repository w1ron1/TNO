  peru_skel.3.t: "Бедоя змінює Белаунде"
  peru_skel.3.desc: "Вітаємо! Це таємна подія, ви не повинні її бачити. Будь ласка, наберіться терпіння, бо одного дня ви зможете грати за Перу... але не сьогодні!\n\nДемократія живе."
  peru_skel.3.a: "Ніякого кумедного перевороту?!!1??!"

  #############################
  #####  Ideas of Peru   ######
  #############################
  PRU_idea_fake_democratic_dream: "Фальшива мрія"
  PRU_idea_fake_democratic_dream_desc: "На перший погляд Перу здається сильною та здоровою демократією. Звісно, якщо копнути глибше, правда набагато складніша. Демократію було відновлено в 1939 році після обрання президента Прадо, але невдовзі вона зіткнулася зі своїм найважчим випробуванням під час Битви за Ліму. Перуанська демократія перемогла, і народ повірив, що вона нарешті стала достатньо сильною... але чутки про фальсифікації виборів у 1950-х роках за уряду Одріа знову завдали удару по її іміджу, разом із звинуваченнями, що невидима рука постійно маніпулювала виборчими дільницями.\n\nЧи зможе Перу здійснити давню мрію про демократію, чи історія знову повториться? Ми повинні бути обережними, займаючись цим питанням. Якщо ми зазнаємо невдачі, мрія помре, §Rа разом із нею — віра народу в демократію.§! Але якщо ми досягнемо успіху, §mдемократія нарешті стане реальністю§!."
  PRU_idea_silent_liberation: "Тихе визволення"
  PRU_idea_silent_liberation_desc: "Після Битви за Ліму північні регіони, прихильні до АПРА, продовжували повставати проти урядів Бустаманте та Одріа, доки одного дня вони не припинили... і запанувала лише тиша. Наші солдати повідомляють, що перестрілок немає, наші поліцейські впевнено заявляють, що все під контролем, а громадяни продовжують жити так, ніби нічого не сталося. Але для Ліми ця тиша — погана прикмета. Нам потрібно тримати північ під контролем, §Rбо ми знаємо, що апристи все ще там, ховаються...§!"
  PRU_idea_two_super_powers_one_economy: "Дві наддержави, одна економіка"
  PRU_idea_two_super_powers_one_economy_desc: "Відтоді як було підписано угоди Акаґі та Прадо відкрив економіку для японських інвестицій, у Перу триває економічна інвестиційна війна між Америкою та Японією. На думку багатьох політичних теоретиків, Перу може стати точкою входу Японії до Південної Америки; відповідно, обидві держави активно інвестують у Перу задля досягнення своїх цілей.\n\nУпродовж 50-х років різні президенти Перу залучали інвестиції і Вранішнього Сонця, і американського Орла, причому президент Одріа залучив до Перу японські інвестиції на мільйони єн. Однак американські інвестиції залишаються значними, оскільки США не бажають без боротьби віддавати жодну країну до японської сфери впливу.\n\nАмерикансько-японські економічні зіткнення відбуваються часто, особливо в промислових та нафтопереробних зонах північного заходу в Талара. Якщо Перу зможе й надалі залучати інвестиції обох наддержав, воно може очікувати, що багатство потече до країни. Однак разом із багатством приходять проблеми: нерівність зросла, оскільки багаті японські та американські родини отримали значну частину прибутків від цих інвестицій і стали такими ж багатими, як верхівка перуанського суспільства. Хоча Перу отримує економічні вигоди, серед робітничого класу Перу зростає невдоволення, яке, якщо з ним не впоратися належним чином, може призвести до повернення насильства в Перу."
  PRU_idea_peru_diverse_problems: "Різноманітна країна з різноманітними проблемами"
  PRU_idea_peru_diverse_problems_desc: "Колись серце Імперії інків, наша прекрасна країна сповнена різноманітних культур і традицій — від наших метисів до іноземних мігрантів і корінних народів. Але з такою кількістю народів приходить і така сама кількість проблем. Попередні уряди та уряди до них нехтували аграрною реформою, інтеграцією джунглів, розвитком Андського регіону та багатьма іншими питаннями. Навіть протести людей через усі ці проблеми не могли змусити їх щось зробити. Ми не повторимо їхніх помилок! Рано чи пізно ми вирішимо ці проблеми раз і назавжди. І якщо нам це вдасться, §nми здобудемо тривалу довіру народу.§!"
  PRU_idea_death_of_dream: "Смерть мрії"
  PRU_idea_death_of_dream_desc: ""

