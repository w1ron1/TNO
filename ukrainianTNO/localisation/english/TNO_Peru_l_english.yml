  ##### Ministers Description ######
  PRU_Carlos_Moreyra_hog_desc: "§YГолова Ради міністрів\nДругий віцепрезидент\nКонсерватизм§!\n--------------\n§LНароджений у 1898 році, Морейра — інженер і політик. За правління Прадо він обіймав посаду міністра розвитку та громадських робіт, де не погоджувався з політикою Прадо, який під час Другої світової війни намагався сидіти на двох стільцях. Після війни він працював у Національному аграрному товаристві до повернення Прадо до Перу в 1956 році. Оскільки підтримка Японії залишила Прадо без підтримки землевласників, Морейра переконав його приєднатися до КДНС і став другим віцепрезидентом Прадо. Після того як Бельтран розкритикував уряд Прадо, Морейра виступив посередником, і Бельтран став міністром економіки та головою Ради міністрів, або прем'єр-міністром. Після відставки Бельтрана Морейра перебрав на себе посаду прем'єр-міністра й досі залишається близьким другом Прадо.§!"
  PRU_Alvarado_Garrido_for_desc: "§YМіністр закордонних справ\nКонсерватизм§!\n--------------\n§LНароджений у 1907 році, Альварадо Ґаррідо протягом рекордних 40 років працював юристом і дипломатом, викладав як професор у UNMSM та PUCP, а в 1950-х роках був послом у Болівії. Його довга й блискуча кар'єра справила враження на Прадо, який призначив його міністром закордонних справ у 1960 році. Альварадо доручено мати справу з еквадорцями та підтримувати добрі відносини зі США та Японією.§!"
  PRU_Gallo_Porras_eco_desc: "§YМіністр фінансів і торгівлі\nПерший віцепрезидент\nКонсерватизм§!\n--------------\n§LНароджений у 1894 році, Ґальйо Поррас — один із найвидатніших політиків Перу. Його посади мера Мірафлореса та Ліми протягом 1930-х років дали йому безцінний досвід. Він приєднався до КДНС у 1955 році та був напарником Прадо на виборах 1957 року. Після відставки Бельтрана з посади міністра економіки та фінансів Ґальйо зайняв його місце й продовжує залишатися одним із найближчих друзів Прадо в ці важкі часи.§!"
  PRU_Ricardo_Elias_sec_desc: "§YМіністр уряду та поліції\nКонсерватизм§!\n--------------\n§LНароджений у 1906 році, Еліас Апарісіо — досвідчений юрист. У 1938 році уряд Бенавідеса доручив йому дослідити кримінально-правові системи Німеччини та Італії, після чого Еліас зацікавився власною кримінально-правовою системою Перу. Це згодом привело його до роботи у війську та поліції. Призначений Прадо міністром безпеки у 1960 році, Еліас нині стурбований зловісною тишею на півночі та спорадичним тероризмом у сільській місцевості.§!"

