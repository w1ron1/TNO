 ## Leader Descs ##
 POLITICS_SOBHUZA_II_DESC: "Успадкувавши трон, коли йому було лише кілька місяців, Нґвен'яма Собхуза II з Есватіні є одним із монархів, які найдовше правили в історії світу. Він посприяв здобуттю Есватіні повної незалежности у 1953 році, а сьогодні вміло править, узгоджуючи свої інтереси з інтересами Південноафриканського королівства проти німців. Собхуза II бачив, як інші монархи народжувалися, коронувалися й були поховані, і досі веде свій народ із десятиліття в десятиліття. Ймовірно, він продовжуватиме правити ще багато років."

 ### Ideas ###
 SWZ_south_african_kingdom: "Південноафриканське королівство"
 SWZ_south_african_kingdom_desc: "Есватіні пережило бурхливу історію протягом останніх кількох років. Спочатку Королівство було чим завгодно, але тільки не незалежним, існуючи лише номінально під владою Південноафриканського королівства, а з виникненням Африканерського Фолькштаату перетворилося на ще одну експлуатовану провінцію. Однак із розпадом Фолькштаату Есватіні знову утвердило себе як повноцінну націю та сподівається побудувати справжню державу з трупа Південноафриканського королівства."

 SWZ_uncontrolled_nepotism: "Неконтрольований непотизм"
 SWZ_uncontrolled_nepotism_desc: "Протягом більшої частини своєї історії влада та гроші в Есватіні перебували в руках правлячого дому Дламіні, і навіть крізь увесь хаос останніх кількох років це залишалося незмінним. Унаслідок цього непотизм процвітає в усій державній адміністрації країни, перешкоджаючи пошуку здібних державних службовців і лідерів. Ця хронічна проблема призвела до слабкостей як у бюрократії, так і у війську."
