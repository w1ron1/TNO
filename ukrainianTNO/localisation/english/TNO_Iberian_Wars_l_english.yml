iberiawarspeace.13.d: ""
iberiawarspeace.13.a: ""

iberiawarspeace.14.t: "Matadouro"
iberiawarspeace.14.d: "Pain. A searing, awful pain that never seemed to let up. It ached deeply, piercing into his bones, threatening to split open his skin and reveal the bruised muscle and stretched sinew within his battered legs. And yet, he was nonetheless dragged from the crowd to his allotted spot upon the limestone wall, where men and women wept and glowered and cradled their arms in fright. When they finally let go of him, he slumped down against the stone. It hardly mattered if he stood. He drew a shaky hand against the wall, feeling the familiar pockmarks where bullets had once struck.\n\nCommunists, Atlantic capitalists, freemasons, and their government lackies. They would all soon receive their place against the walls of the Tower. Her towering visage loomed over the armed Blueshirts and their prisoners; if Belém had a face, all of Lisbon would surely see her weep. With little fanfare, the guards let slip the safeties of their rifles, taking aim at their prisoners. None of their cries escaped the torrent of gunfire that followed, a cruel silence settling across the square.\n\n"More," the Captain murmured, gesturing for an aide to draw closer. Upon the aide's lapel, a small, golden badge shimmered with the insignia of the PIDE. "Not enough in the crowds. Bring a bigger batch tomorrow." Drawing his gaze over the terrified onlookers nearby, the Captain's expression soured. "Empty the regional jails if you have to. Make a statement."\n\n"At once, sir." The aide grinned as nearby Blueshirts dragged the freshly executed away in trails of blood. "The disobedience of Lisbon will soon be but a distant memory. With this display, the Falange is ascendant over all of Portugal!" Such honeyed words from the aide were met only with silence from the Captain, his steely gaze still fixed upon the crowd. With every taut noose and public fusillade, the march towards purity seemed further out of reach than ever. And yet, the slaughter would continue, for they knew little else. Slaughter for the sake of slaughter. A self-fulfilling prophecy."
iberiawarspeace.14.a: "And it would never be enough."

iberiawarspeace.15.t: "The Charm"
iberiawarspeace.15.d: "The wind rustled through the leaves of Casa de Campo, sending small waves through the placid lake, painted gold by the setting sun. General Delgado was walking on the lakeside promenade alongside Chief of Staff José Miguel Vega Rodríguez, letting the precious moments of quiet wash over him. De Sena and the other suits could hash out all the necessary details of peace with their counterparts in the restored republic. He wanted to come here with a man who could understand war.\n\nThe two men turned from the lake, walking for a while under an archway of darkening gold and purple before Delgado suddenly broke the silence, looking his companion straight in the eye. "Señor Vega. A Spanish Republic has already fallen twice this century. One of those times, you even contributed to its downfall. Do you think this third republic will be able to keep itself together?"\n\nVega was taken aback for a moment, but quickly regained his composure. He let the question settle before pointing to the bullet-ridden fountain behind Delgado. "You know, Senhor Delgado... back during the first Civil War, I fought against the Republic's soldiers. They'd fought and died for their dream in this park, in this city, all around Spain. Thirty-something years later, I was the commander of the Republic's soldiers, and again, they'd been willing to die for something much greater than me or my orders. Both times, the Republic fought with its back to the sea, surrounded by enemies much stronger than it, and both times it fought with tenacity and true valor."\n\nVega took a deep breath and shook Delgado's hand. "I know the Republic's soldiers will fight just as well now." "
iberiawarspeace.15.a: ""But this time, we will be fighting together"."

iberiawarspeace.16.t: "The Unimaginable Triumph"
iberiawarspeace.16.d: "The soldiers of the Portuguese Exército were lined up along the boulevard, but they did not hide the faces of the hundreds of Spaniards behind them. On their faces was the same absence of words King Jaime Álvarez Pereira de Melo had been stricken with since the news of the Spanish surrender. The Iberia beyond the bullet-proofed windows of the royal limousine seemed more like a painted dream at times, but the looks of humiliation, confusion, and disbelief on everyone that floated by spoke to the harsh reality that the war had brought.\n\nIt was supposed to be impossible, relegated to the stuff of ahistorical wet-dreams from armchair nationalists with delusional pipe dreams of Portugal dominating its Hispanic neighbor. Yet the reincarnated Kingdom of Portugal had miraculously emerged victorious, the institutional grandfather to the Iberian Union had routed not only the Salazarists that had killed it, but their Francoist imitators in Madrid and all others who sought the levers of power for themselves.\n\nThe motorcade slowed to a stop outside the Almudena Cathedral. Inside, the leadership of the Carlist regime installed by Kaúlza waited alongside representatives of the House of Bourbon, soon to be crowned as the Kings and Queens of Spain for the first time in generations. Even if much of the pageantry was to fluff Kaúlza's ego, everyone else was just content with a defined conclusion of Iberia's collapse and the return of long-term peace.\n\nAs the rear door opened, the sun beamed brightly, almost too much so. Light shone down upon the ancient medieval frescos of one of Europe's most storied cities. Even with visible scars all across the city from the heavy fighting, Madrid's beauty remained, imperious and invincible. The King felt the artist in him come alive, his heart lightened and swelled. What happened to Iberia was a tragedy, but the beauty spoke of a true ever after: A new and beautiful future for both countries, clothed in the traditions of the old."
iberiawarspeace.16.a: "Like an old love affair, the crown heads of Spain and Portugal, united once again!"

iberiawarspeace.17.t: "Born in the Azure"
iberiawarspeace.17.d: "Far above his head, the portcullis towered over Kaúlza de Arriga, dwarfing him.\n\nSomewhere behind him, he heard the scribbling of a fountain pen. "It is done."\n\nKaúlza offered no reply, still captivated by the castle façade: Olivenza, a small town, with an inconsequential population of a few thousand. This place had been Portuguese once, ruled by the monarchy before it was seized by Napoleon and ceded to his Habsburg puppets in Madrid. At the time, it was seen as the nail in the coffin for Portugal's ability to militarily outfight the Spaniards; now Kaúlza stood before this monument to an older era, internalizing that his determination had accomplished something that had been a foregone impossibility.\n\n"It...i-it is done." The same voice, more demure, repeated behind him. Kaúlza was still lost in history as he turned to face him. The Generalissimo took the papers in hand. "Your security is assured." He said, eying the documents detailing Spain's new military regulations, as well as surrendering military equipment to the Exército. "Armies are quite expensive. It is better this way."\n\nThe poor man forced a brave smile, saying little. The PIDE agents in Madrid would make sure no one in the new regime got any ideas, but this one should have a fruitful career, so long as he played nice. "Inform your colleagues that Olivenza is under my administration, effective immediately and indefinitely." Kaúlza felt merciful, offering a stiff pat on the minister's shoulder as he left to see inside the castle for the day."
iberiawarspeace.17.a: ""Even in Olivenza, the road still leads to Rome...""

iberiawarspeace.18.t: "Remembering Names"
iberiawarspeace.18.d: "He had seen thousands of trees. Millions maybe. But this one. This one was beautiful. The jacaranda blossoms floated downwards, traversing through the infinitude of pathways, swinging left and right, until they landed on the stone tombs. And they lay there. And then another would land.\n\n José Miguel Vega Rodríguez had been in war. He had been in Russia. He had been in Morocco. But he had never been to Prazeres Cemetery.\n\n"Alejandro Luz."\n\nThe general looked up. The pastor called another name. Then another. But Alejandro. His eyes fluttered. His right cheek gave a couple of twitches. Vega closed his eyes, trying to remember where he had heard of Alejandro Luz before.\n\nRight. Ifni. They were stationed there for a couple of years. Vega tried to remember what Alejandro was like. They had maybe two conversations. Nothing memorable. Vega tried to frown, but nothing moved. He looked to his right at Delgado.\n\n"Alejandro Luz. I think I knew him. Good kid," Vega whispered to Delgado. Delgado nodded without turning his head. "But, this service, Delgado... This has been going on for hours by now. Iberia... the lives..."\n\n"Those who lie here would be proud that Iberia is finally at peace," Delgado whispered back, eyes still on the pastor. "Our Republic, General, cannot let these lives go to waste."\n\nVega nodded. That tree had disappeared. Another of the millions of trees he had seen before. He looked at the pastor.\n\n"Danilo Noceda. Emanuel Cunha. Caio Henriques...""
iberiawarspeace.18.a: "There is no greater guilt in realizing you can no longer cry."

iberiawarspeace.19.t: "Severance"
iberiawarspeace.19.d: ""Señores." General Iniesta Cano was standing on the wide steps of the neoclassical São Bento Palace, the former seat of the Portuguese parliament and cooperative chamber. He was flanked by ten Spanish Legionnaires, filling the space between him and the sculpted statues on both sides of the staircase and glowering at the audience.\n\nCano had served the Iberian military for long enough to speak passable Portuguese, but he was not here as a friendly Iberian officer, but as a conquering Spanish general. They will understand his Spanish, or live in ignorance. "I hereby proclaim that, following the recent armistice, the territory of Portugal shall be occupied by Spain for as long as necessary for a proper governing structure to be established, one that will maintain the cherished traditions of the Portuguese people and cordial relations with the Spanish state. The costs of the occupation will be indemnified to Spain in full by this government once it is established, in order to help in Spain's own post-war reconstruction."\n\nCano put down his papers, surveying the crowd that had come to hear his pronouncement -  Portuguese officers, statespeople, and civilians. Some looked at him with trepidation, others dejectedly kept their eyes on the ground, watched by his legionnaires. Yes, Portuguese officers - not Spanish, and certainly not Iberian. It was time to put that lie, which has tied Spain down for so long, in its place.\n\nHe cleared his throat, looking straight at the camera. "However, this occupation is and will never be a step towards a new Union. Spain is Spain, and Portugal is Portugal, and the folly of any attempts to hide this truth has been laid bare across the fields and trenches of this land and ours. Once Portugal's new government is able to stand on its own two feet, I will be the first to congratulate it for its independence.""
iberiawarspeace.19.a: "They will applaud him, one day."

iberiawarspeace.20.t: "Song of the Marching Requetés"
iberiawarspeace.20.d: "The streets of Porto echoed long into the night, as wine-flushed Spaniards marched through the now-occupied city. Heedless of the men they killed and people beneath their boots, one voice starts, and the rest follow:\n\n"When Javier comes king again,\nHurra! Hurra!\nWe'll give him a throne to sit on then,\nHurra! Hurra!\nAnd Spain will cheer, with Lisbon's shouts\nThe traitors, they will all be rout\nAnd we'll all feel gay when Javier comes king again!\n\n"When Franco sought to cut us out,\nHurra! Hurra!\nWhen all of Europe cast their doubts,\nHurra! Hurra!\nWe never flagged, we never failed,\nWe fought until we had prevailed,\nSo we'll all feel gay when Javier comes king again!\n\n"Get ready for the Requetés,\nHurra! Hurra!\nWe're coming home in red berets,\nHurra! Hurra!\nWith medals pinned, and victories won,\nAnd stories for the youth beyond,\nFor we'll all feel gay when Javier comes king again!""
iberiawarspeace.20.a: "For we'll all feel gay when Javier comes king again!"

iberiawars_final_peace.1.t: "History Rhymes"
iberiawars_final_peace.1.desc: "Urgent Dispatch\n[?global.date.GetDateStringNoHourLong]\n\nReichsminister,\n\nThe Spanish pretenders have formally surrendered to their rightful authority; our support has enabled the return of stability to this nation. President Cano informs me that our diplomatic staff shall return to Madrid soon. It is intended that the impending national victory parade to be held in the capital shall include a place of honor for ourselves; a large German contingent being arranged. He forwards an invitation to you, should you wish to attend the event.\n\nThe nation is decimated; many cities were subjected to mass destruction tactics and many areas of the countryside are lawless outside of core areas. I have, as instructed, offered our expertise in the stabilisation of such territories, and opened the possibilities of further financial and military cooperation with Germania. Once proposals are finalized by the Spanish, their requests shall be forwarded.\n\nTo avoid the distance developed between the Reich and Spain following their previous conflict, efforts are being taken to embed ourselves into the reconstruction process. The embassy is using the remains of war resources at our disposal to benefit officials identified as sympathetic to co-operation. We have encouraged references to racial fraternity and European cooperation in public messages from the embassy, to try and foster deeper ties between ourselves and Spain as many remain wary of the Reich's presence. Significantly, Foreign Minister Codón, remains hesitant towards Germania and continues to advocate for increased regional cooperation at the expense of the Reich - a view somewhat popular within the public. We must ensure every effort is taken to minimize this and bind them to us."
iberiawars_final_peace.1.a: "A victory rivaling 1939."

iberiawars_final_peace.2.t: "Corruption Unimpeded"
iberiawars_final_peace.2.desc: "Urgent Dispatch\n[?global.date.GetDateStringNoHourLong]\n\nReichsminister, \n\nThe mouth of the Mediterranean has finally fallen, as the last chance for the victory of the final vestiges of rightful authority on the peninsula have surrendered themselves. All embassy staff, including myself, are being expelled, and I have been notified of a number of volunteers involved in our efforts to avert this outcome that are now interred by the new government. While the wider implications, especially in regards to foreign subversive influences, remain to be seen in Spain, in the short term it will be difficult to salvage anything from within the nation.\n\nIt is recommended that we maintain a continuity of operations in Germania. Many Spanish Falange have already, or are attempting, flight due to the hostility of the new administration. The creation of an organization for them to coordinate themselves and maintain our few remaining networks within the nation is essential if there is to be any hope of a reversal of our fortunes in the future. Further, pressure must be placed upon the new government to accept a diplomatic presence from the Reich and the rightful return of its citizens be they held by central or local authorities. We may have lost our preferential  access to the nation, but we must now seek to limit the malign influences within Spain that will seek to place themselves nearer to the Reich.Our one advantage is the devastation of the nation. Many cities lie in rubble and the countryside is devastated due to the scale of this civil war. Many regions face separatist instability. It will take a long and perilous time for Spain to recover, and we must await our next opportunity to close this breach in European security."
iberiawars_final_peace.2.a: "Where Hitler triumphed, we have failed."

iberiawars_final_peace.3.t: "A Purer Peninsula"
iberiawars_final_peace.3.desc: "Urgent Dispatch\n[?global.date.GetDateStringNoHourLong]\n\nReichsminister,\n\nToday is a great day for the Reich; the final outposts of organised resistance against the Spanish National Council have surrendered. Far less timid of the Reich than the preceding junta, already they have offered us a place of honor in the victory festivities being planned, as well as making the return of our diplomatic staff to Madrid a priority. An offer has been expressed for you to attend the parade in person, as well as to the Führer, with President Arrese promising to bestow many honors. The public seem broadly supportive of the Council's proclamations of European fraternity with us, but due to the ongoing instability it is recommended that major visits be postponed.\n\nThe nation is in ruins, on a scale not seen in Europe since the Weltkrieg. Cities were already heavily damaged in earlier stages of the fighting, with the fall of the Junta bringing with it renewed destruction. Government authority is firm enough in cities; they are heavily damaged and undergoing continuing stabilization efforts. The countryside remains almost entirely lawless outside of where government military assets are present. I have offered our expertise in stabilising such conditions and contributing to their reconstruction.\n\nThe President must still be handled carefully. His duplicitous nature is on record; he may choose a personal path over a path of mutual benefit. A potential replacement is Ramón Serrano Suñer, who enjoys considerable support within the Falange. However, while firmly pro-Germania, he has had a history of difficult personal working relationships with many of the Reich's senior authorities, including Führer Hitler himself. Our victory brings great rewards, there remains possible greater rewards still, but care is still strongly advised."
iberiawars_final_peace.3.a: "A victory surpassing even that of 1939!"

iberiawars_final_peace.4.t: "The Führer's Ulcer"
iberiawars_final_peace.4.desc: "Urgent Dispatch\n[?global.date.GetDateStringNoHourLong]\n\nReichsminister,\n\nDespite the hopes that the rise of the National Council would be the first step towards a more prosperous Spain, their final vestiges of organized resistance have surrendered. All embassy staff including myself have been instructed to leave within 48 hours and many volunteers who had been involved with our efforts to rescue Spain from itself have been interred. What remains of Council forces are either surrendering or fleeing towards the French border, with many members of the government already captured or killed. President Arrese is missing, last seen attempting to flee the final National Council's Headquarters with a motorcade.\n\nThe scale of the consequences facing the Reich cannot be understated. National Council forces had been in dire need of modernization, training and equipment following the collapse of the Junta. As such their military was given access to Pakt training documentation and supply depots - much of which is now in unfriendly hands. Further, many Germans involved with aiding their forces, from combat volunteers to training officers, have been interred by local forces with fates unknown. Across the Peninsula, our assets are being seized.\n\nIt is essential that the Reich collect the remnants of the Falange who can make their escape and create a continuation organization in Germania with which to try and maintain some networks within Spain. Further, diplomatic relations must be reopened with Spain as soon as possible, so as to try and neuter the peninsula as a threat as much as possible from our now-weakened position, as well as to demand the return of interred Germans. Without the abilities such measures would give us, we would be forced to surrender the mouth of the Mediterranean to hostility indefinitely."
iberiawars_final_peace.4.a: "Where Hitler triumphed, we have failed."

iberiawars_final_peace.5.t: "All Heil the King"
iberiawars_final_peace.5.desc: "Urgent Dispatch\n[?global.date.GetDateStringNoHourLong]\n\nReichsminister,\n\nThe Kingdom is victorious. The final bastions of the southern usurpers have been expelled from Portugal; King Jaime's throne finally secured from the liberals and socialists who sought to depose him. A letter of thanks has been received from the King, while Foreign Minister Leite has discussed further cooperation. The last vestiges of resistance are being rooted out and the full extent of captured Republicans and foreign interlopers are being assessed.\n\nIt must be stressed that the Kingdom remains a somewhat uncertain ally without resolute handling from Germania. Intercepted cables have found Minister Leite is eager to avoid dependence on the Reich, regardless of the necessities of the war, and desires further Mediterranean ties. Lisbon clearly balks at the idea of closer Pakt collaboration, and seeks to establish a relative distance - if a friendly one - now that their need for us is over. The King is little more than a figurehead for now, and much of the government is made up of former Estado Novo members still committed to their ideas of neutrality.\n\nIt is absolutely essential all efforts are taken to ensure their wartime promises are followed to completion. Already, Reich assets within the nation are being directed to encourage the Portuguese not to renege upon their promises. Further, the embassy has signalled to the government our willingness to aid further with our expertise in stabilization. Efforts must be undertaken to try and entice the Kingdom away from dalliances with other powers. The potential prize is the Kingdom's hesitancy to move forward being broken, and the Reich gaining a secure Atlantic bastion."
iberiawars_final_peace.5.a: "Europe's most distant outpost is ours."

iberiawars_final_peace.6.t: "Peninsular Defiance"
iberiawars_final_peace.6.desc: "Urgent Dispatch\n[?global.date.GetDateStringNoHourLong]\n\nReichsminister,\n\nThe Kingdom to which the Reich had entrusted the repelling of foreign subversion has, as we have feared, failed. Their final bastions of organized resistance have surrendered or been eradicated by republicans. While the exact extent that the Americans and their international thralls will exploit such a victory is unknown, that they are unfriendly to us is clear with little opportunity for rapprochement in the near term. All embassy staff have been given 48 hours to leave the nation.\n\nTo be realistic, the alliance with the Kingdom was always one of convenience. Our intelligence made it clear that they worked with us only due to lack of supporters, as such the gains that may have been extracted are somewhat questionable. We can hope that a similar situation is occurring to the Americans, who now will be drawn into the degenerate conflict between the communists and capitalists which bristles in the south. The Estado Novo's doctrines, whose influence lingered even within the Kingdom, has been thoroughly rooted out and Portugal's future is now difficult to predict.\n\n Training documentation, arms and the numerous volunteers granted to the Kingdom are now in enemy hands. To mitigate this, resolute action is recommended. Lisbon must be pressured to accept a Reich diplomatic presence once again, and the Kriegsmarine must threaten their waters. Atlantic security has been undermined, only a firm hand can preserve what remains. Any dalliance with radical policy threatening Europe must be demonstrated as suicidal. Further briefings can take place upon our arrival to Germania."
iberiawars_final_peace.6.a: "Europe's most distant outpost falls into enemy hands."

iberiawars_final_peace.7.t: "A Shining Light"
iberiawars_final_peace.7.desc: "To the Secretary of State,\n\nI am writing personally in light of the resounding success democratic forces have achieved within Portugal. As you have no doubt been prior informed, the Kingdom of Portugal has collapsed and the Republic stands unopposed. President Delgado has publicly thanked Portugal's allies for their assistance, naming the US as chief among them.\n\nWork is now shifting to making the best of this opportunity, as we come to the purpose of this letter. I urge you to impress upon the President the immense importance this victory represents. Already, suggestions are being floated regarding continued American aid as the nation reconstructs, as well as the benefits that OFN assistance may bring in coming years. While the exact extent the Portuguese government will be willing to go in such matters remains to be seen, every opportunity that comes must be seized as we have gained a free, democratic nation on the European mainland.\n\nFurther, the President must be made aware of the remaining problems that may yet complicate matters. The Portuguese population remains suspicious of foreign involvement. The new government maintains communist elements who openly push back against further trans-Atlantic collaboration. Further, while Delgado was an opponent of Salazar's, he maintains a personal friendship with the head of the Portuguese Communist Party, Álvaro Cunhal.\n\n Our victory is substantial, but the President must be aware of the importance of continued vigilance. We have gained a shining light, a burning beacon, to shine into Europe; we can rest assured many will wish to snuff it out."
iberiawars_final_peace.7.a: "U.S. Embassy in Lisbon"

iberiawars_final_peace.8.t: "The General Without Fear"
iberiawars_final_peace.8.desc: ""What a joke. Guest lecture by Humberto Delgado - the guy's been beaten how many times now?"\n\n"Maybe he'll show us a new ejection technique - got the hell out of Portugal fast enough when things went south."\n\n"Delgado looks... bad. Like he's gonna die at the lectern and save us the trouble."\n\nThe shaved-headed Air Force cadets' words, louder than they assumed, about a man, whose English was far better than they assumed, cut through the dry Colorado air to his ears. General Humberto Delgado didn't flinch. He'd heard far worse in recent weeks anyway. The Air Force Academy had invited him here to speak, and that, at least, was something he could still do.\n\nDelgado stepped to the chalkboard and wrote 'Failure'. He waited one, two, three, beats and then began with a growl, "You. If you are men, if you are pilots, you will fail. Missions will go incomplete. Planes will go down. Bro-" his voice choked a little, "brothers-at-arms will die or be mauled until they are unrecognizable. Wars, wars will fail."\n\n"Does that mean the mission should not have been flown? That the plane should not have take off? That the pilot should have never joined the Air Force in the first place? That the war, this century's endless war against fascists and dictators of every stripe, is not worth fighting?"\n\n"No. No, no, and no. But you, they, America, Portugal... will suffer for every failure. I came here today to tell you to be prepared.""
iberiawars_final_peace.8.a: "Because I wasn't."

iberiawars_final_peace.9.t: "Treasure Galleon"
iberiawars_final_peace.9.desc: "News of the Republic's victory had come over the ship's tinny speakers. As had the order from Washington to proceed anyway with the delivery. The official had said that the food, medical supplies and construction materials were just as welcome as ever. What he hadn't mentioned was that the guns were as well - in the face of localized guerrilla action and an overtly hostile Pakt.\n\nBut the supplies would receive a distinctly secondary treatment. Instead, it was the sailors inside that proved the vessel's most precious cargo - for they gave a face to the anonymous American benefactors across the sea in the midst of the most raucous celebration Sevilla had ever seen.\n\nBefore the shipping containers had even been cleared from the deck, wine, women, and photographers were flowing in the other direction. Quickly plastered boys from Maryland were soon plastered against the railing by their more haggard counterparts from Malaga or Madrid, each eager to use the few English phrases they had picked up in the war over a bottle. Girls whisked more sober companions away to romantic getaways at the Towers of Gold and Silver or Parque de María Luisa.\n\nSoon, fireworks would illuminate the dusky sky and the Guadalquivir River, highlighting the sailors' awkward but earnest attempts to keep up with their sevillana partners. And two flags, flying side-by-side."
iberiawars_final_peace.9.a: "American by sea, the Republic's by land."

iberiawars_final_peace.10.t: "Bienvenido... Mr. Marshall"
iberiawars_final_peace.10.desc: "The Spaniard dragged a wooden chair along the stone floor until it almost touched the bars. But he did not sit. Just lit a cigarette and looked into his prisoner's eyes.\n\n"An indemnity for war widows and orphans. Reconstruction funds for roads and factories. That's what you and your ilk will bring in. You're worth more than your weight in gold, Señor Marshall," his Spanish captor took a long pull from his cigarette as he flipped through the pages of Marshall's passport.\n\nThe faint voice from the cell replied, "I'm a civilian contractor. I advise on debt management for J.P. -"\n\nThe Spaniard held up the passport to Mr. Marshall's face, "There are only two things I need to know about you, Mr. Marshall. You're an American citizen. And you were in the Republic's'" he spat to the side, "offices when we took Malaga. Truth be told, not even your name matters. I only learned it to be polite."\n\nThe Spaniard set down the passport and took another drag of his cigarette before continuing, "And there are only two things you need to know about me. Our European friends have offered a good deal for you. I hope, for your safety, you can convince your government to offer a better one."\n\nThe Spaniard took out and started to clean his sidearm, "Because there are more important things than money.""
iberiawars_final_peace.10.a: "And my brother died in this war with an American bullet in his head."

iberiawars_final_peace.11.t: "A Makeshift Embassy Day"
iberiawars_final_peace.11.desc: "Washington Post - Culture Section\n\nFor those new to our fair city, Embassy Day poses an opportunity to partake in the cultural, and, especially, the culinary offerings of the countries formally represented here. Yesterday, Washingtonians experienced Embassy Day in miniature, as diplomatic personnel from the newly-recognized post-Iberian republics opened their doors to the public in celebration of their independence.\n\nThese nations, war-ravaged and with scant time in existence, have not yet secured suitably prestigious real estate. But the crowds of well-wishers paid no mind - packing the office building they currently share and spilling out into the street. Several D.C. residents commented on the bravery of their fight for independence against a militarily superior foe, calling parallels to 1776 or expressing support for the U.S.'s armed backing for the republics.\n\nSamples of their national cuisines won over even those unaware of the greater significance of the event. Crema catalana, Galician octopus, and an unpronounceable Basque dish with rabbit appeared the standout favorites, as the quantities prepared ran out before noon.\n\nSatiated residents appeared delighted to welcome the republics to the community of nations, and to their own."
iberiawars_final_peace.11.a: "Independence never tasted so good."

iberiawars_final_peace.12.t: "Exile Once Again"
iberiawars_final_peace.12.desc: ""At tonight's meeting of the Council of Galicia, New York chapter, we will be hearing today from the Council's long-time head Antonio Alonso Ríos. As Vice President of the Xunta, Alonso Ríos played an invaluable role in organizing the Galician polity in a time of national emergency. Due to the threats against his life by the occupiers, he and his family have resettled for the time being."\n\n"We are also very pleased to have in attendance tonight three members of the Senate Foreign Affairs Committee. Translation services will be provided by Ms. Maruxa Ulloa Peres of the Council of Galicia. Don Alonso Ríos, we're ready for you now."\n\nThe balding nationalist took to the microphone, looking a decade older and wearier than the Council had last seen him, "I would like to thank this august body for giving me the opportunity to speak today. And in recognition of our guests, I would like to thank the Senate, and the American people that you represent, for your support in Galicia's darkest hours."\n\n"The Castilian retribution being visited upon the Galician people for daring to dream the dream of independence, of freedom is horrific. Persecution extends beyond those who supported our government, to those who merely express their Galician identity, with intent or merely by our nature. Similar persecution is occurring against our Basque, Catalan, and other neighbors."\n\n"I cannot thank America enough for supporting us in our fight for freedom. No matter how tragic the end of this chapter has been, Galicia will fight on!"\n\nThe applause line set hands in motion-"
iberiawars_final_peace.12.a: "But in the Senators' eyes, Alonso Ríos saw only pity."

iberiawars_final_peace.13.t: "Our Boys In Portugal"
iberiawars_final_peace.13.desc: "FROM THE EMBASSY IN LISBON\nON:[?global.date.GetDateStringNoHourLong]\nSECRET—URGENT\n\nIt is my pleasure to inform you that stability has returned to Portugal. The Republic has affirmed itself as the sole Portuguese government and the state of civil war can be considered over.\n\nPresident Delgado has delivered a personal thank you to myself toward the entirety of Brazil, with eager praise for our efforts to support his administration through this difficult period. He gifted a ceremonial wreath, which I have arranged to be sent to your office, and personally addressed a small group of Brazilian volunteer officers and diplomats. He desires to continue our relationship; I feel he will be in need of it. Reconstruction and friends urgently required. I have been informed that Minister of Economy Nuno Simões will propose a trade and investment deal imminently, and not merely from a sense of gratitude. While I cannot yet comment on the extent of cooperation envisaged, Lisbon knows it is in dire need of capital and resources. Due to the near bipartisan support the Republic enjoys in Brazil, in part thanks to the many former exiles who took sanctuary with us, obstructions to our developing relationship are unlikely to develop.\n\nConcerns remain upon minds in Lisbon regarding the communist element within the nation. A necessary alliance during the conflict perhaps, but there are fears that tensions may frustrate between the factions soon. The situation will be monitored, however for the moment such concerns remain merely hypothetical.\n\nOur involvement in Portugal should begin to bear much fruit in the near future. Further developments will be communicated as soon as possible."
iberiawars_final_peace.13.a: "The Atlantic is smaller than ever."

iberiawars_final_peace.14.t: "Last in Lisbon"
iberiawars_final_peace.14.desc: "FROM THE EMBASSY IN LISBON\nON: [?global.date.GetDateStringNoHourLong]\nSECRET—URGENT\n\nWith regret I must inform you of the news we have feared. The state of civil war has ended with the destruction of the Republic of Portugal. The King is soon to arrive in Lisbon and all Brazilian diplomatic and military personnel have been provided 48 hours to leave the nation.\n\nUrgent efforts are being undertaken from our last remaining secure zones near the coast to evacuate. As I write, many personnel and civilians have been safely taken to waiting naval ships or long-range aircraft. Evacuation is frustrated by the many Republican Portuguese nationals also attempting to procure evacuation and sanctuary. In such cases, efforts are being taken to prioritize high-ranking VIPs and their families. Otherwise, this office has ordered that passage must be denied when it is impossible to facilitate.\n\nWhile difficult to assess as we have no formal relationship with the Kingdom, it is apparent via the last vestiges of our intelligence apparatus that they do not seek a reset of relations due to our active support of their rival. Foreign Minister Pinto da Costa Leite has made it clear he seeks accord with the rest of Europe. While the Kingdom does possess moderate elements that may not dismiss a thaw toward us, the mere possibility of that remains distant for now.\n\nThe most difficult part of our evacuation is Lisbon, the designated return point of interred Brazilians and captured VIPs. Due to difficulties in locating and transporting some, and threats of prosecution from the Kingdom, it may be necessary for us to further expand, or prioritize, our operations. We await guidance."
iberiawars_final_peace.14.a: "The Atlantic grows dark and wide."

iberiawars_final_peace.15.t: "New Future, New Friends"
iberiawars_final_peace.15.desc: "FROM THE EMBASSY IN LISBON\nON: [?global.date.GetDateStringNoHourLong]\nSECRET—URGENT\n\nI can now notify you that the state of civil war within the Kingdom of Portugal has ended, with King Jaime's rule now secure. The King shall be returning to Lisbon in due course to mark the resumption of stability and proper governance. The King has already presented numerous honors to Brazilians who volunteered toward the war effort, from frontline volunteers to charitable donors. Further, an invitation has already been presented offering the President a state visit and decoration.\n\nForeign Minister Pinto de Costa Leite has reached out regarding possibilities for cooperation and investment in the Kingdom's reconstruction efforts. All indications are that we have won an agreeable friend in Europe; however, it is a friend that we must move quickly to assure. The Kingdom's Foreign Ministry has already planned for a diplomatic tour to a variety of European nations in light of its victory, and without quick movement from Brazilian financiers and advisors our significance and access to opportunities within the Kingdom may wane.\n\nFurther, the Kingdom is aware of the ongoing controversy of Brazil's support domestically, with a variety of individuals connected to the government reaching out to me to inquire of the present situation. While news has been broadly downplayed thus far, the continuing criticism from other parties and remaining Republican exiles will eventually become more broadly known. While the Kingdom does not appear to have a formal stance on the status of remaining exiles in Brazil yet, it seems likely that this may be an issue raised in the future, particularly should any exile congresses force the matter. The matter is urgently recommended for cabinet discussion."
iberiawars_final_peace.15.a: "Would Pedro be proud?"

iberiawars_final_peace.16.t: "A Mistaken Diversion"
iberiawars_final_peace.16.desc: "FROM THE EMBASSY IN LISBON\nON: [?global.date.GetDateStringNoHourLong]\nSECRET—URGENT\n\nIt is with heavy heart that I must inform you that the Kingdom of Portugal has finally surrendered, the Republic of Portugal now unopposed. Brazilian assets within Portugal formally aiding King Jaime's forces have been given 48 hours to leave, with our final secure areas on the coast and chartered aircraft being used to evacuate.\n\nIn addition to Brazilian nationals, notable VIPs and their dependents are being evacuated where possible. Given the loss of our Portuguese ally, abandoning those to whom we offered aid would undermine future international efforts. Many bring not-inconsiderable fortunes, to which the State may be able to glean some benefit. In fiercely monarchist areas there is considerable interest in claiming sanctuary in Brazil, many citing fears of the socialist republicanism many have equated with the South. Where possible this is facilitated, however we have begun prioritising ranking government and military personnel over civilians where resources are thin.\n\nWhile our formal relationship with the Republic remains nil, their Foreign Minister -one Jorge de Sena - has been an advocate of cooperation with Brazil in the past. While our change of outlook regarding republicanism has soured such sentiments, in time desires to thaw relations may return. Sources within Lisbon have suggested that they are aware of the controversy of Brazil's Kingdom support and community of affable Exiles. Such assets, as well as their relative deviation from Europe's hegemons, may be exploitable in order to return to some kind of pragmatic relationship.\n\nSuch prospects, however, remain hypotheticals."
iberiawars_final_peace.16.a: "To gamble boldly, and lose."

