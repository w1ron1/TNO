iberiawars_portuguese_reclamation.1.t:0 "Operation Sebastian Completes Preparations"
iberiawars_portuguese_reclamation.1.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Portuguese Confederation completes Invasion Preparations.\n\nThe Portuguese Confederation, the remnants of the Portuguese Republic that were able to evacuate to the Atlantic Archipelagos, have completed their preparations to retake the mainland. Operation Sebastian, as the invasion is codenamed, shall commence imminently unless we intervene.\n\n- Direct costs to the US are minimal as, while sponsored by the US, most committed forced source from the Portuguese themselves.\n- In the event of success, the Confederation would represent guarantee a pro-OFN Portugal, granting us a strategically significant nation within Europe.\n- In the event of failure, the US would lose very little directly beyond some material, and would be in a position to obtain new administrations within the Atlantic Archipelagos. Since a failed invasion would almost certainly collapse Confederation authority and legitimacy on the Islands, the United States would be best poised to serve as the islands' new guarantors.\n- It would be possible to use the Confederation's reliance upon us for their authority to pressure them to cease invasion preparations. Such an action would almost certainly lead to a collapse of the Government, however it would allow the UNited States to establish its authority over the islands with a much higher degree of smoothness compared to a failed invasion.\nState Department proposals on the structure of an Azores and Madeira stabilisation mission shall be provided in the coming days."
iberiawars_portuguese_reclamation.1.a:0 "The Confederation has our support and our faith. Godspeed."
iberiawars_portuguese_reclamation.1.b:0 "An invasion with few prospects threatens our position in the Atlantic. Pressure against invasion."

IBR_Wars_operation_sebastian_tt:0 "The operation will begin in 15 days."

iberiawars_portuguese_reclamation.2.t:0 "Operation Sebastian Begins"
iberiawars_portuguese_reclamation.2.desc:0 "RPP will invade the Portugal winner. This event doesn't need loc now because you aren't meant to play as RPP at this stage in the current build."
iberiawars_portuguese_reclamation.2.a:0 "Let's go"

iberiawars_portuguese_reclamation.3.t:0 "Operation Sebastian Completes Preparations"
iberiawars_portuguese_reclamation.3.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Portuguese Confederation completes Invasion Preparations.\n\nThe Portuguese Confederation, the remnants of the Portuguese Republic that were able to evacuate to the Atlantic Archipelagos, have completed their preparations to retake the mainland. Operation Sebastian, as the invasion is codenamed, shall commence imminently unless we intervene. A potentially significant development is the current mainland administration is being invaded by Spain.\n\n- Direct costs to the US are minimal as, while sponsored by the US, most committed forced source from the Portuguese themselves.\n- In the event of success, the Confederation would represent guarantee a pro-OFN Portugal, granting us a strategically significant nation within Europe.\n- In the event of failure, the US would lose very little directly beyond some material, and would be in a position to obtain new administrations within the Atlantic Archipelagos. Since a failed invasion would almost certainly collapse Confederation authority and legitimacy on the Islands, the United States would be best poised to serve as the islands' new guarantors.\n- It would be possible to use the Confederation's reliance upon us for their authority to pressure them to cease invasion preparations. Such an action would almost certainly lead to a collapse of the Government, however it would allow the UNited States to establish its authority over the islands with a much higher degree of smoothness compared to a failed invasion.\n- The current invasion of Portugal from Spain makes an invasion far more likely to succeed, however it also opens questions about what would occur in the event of a Spanish victory before the Confederation could fully establish itself. We can also pressure the Confederation to postpone the invasion until the resolution of the mainland conflict, to consider if the outcome may be to our mutual benefit."
iberiawars_portuguese_reclamation.3.a:0 "The Confederation has our support and our faith. Godspeed."
iberiawars_portuguese_reclamation.3.b:0 "A risky invasion threatens our position in the Atlantic. Pressure against invasion."
iberiawars_portuguese_reclamation.3.c:0 "Peninsula developments may give us Portugal without firing a shot. Postpone and watch for now."

#Proxy events
iberiawars_proxy.1.t:0 "El Amigo Americano"
iberiawars_proxy.1.desc:0 "In a small room in the guts of the Pearl of Andalusia's town hall, two men conversed. One spoke in his native language, the other in a language acquired and honed by training. Pío Cabanillas placed one hand on the arm of his chair and began, "Señor Fig, you must understand the situation. Our forces are bolstered with the people's will, but they need arms. Our manufactories cannot yet provide for us by themselves. We need aid from the United States, and we need it soon."\n\nAgent Frances "Fig" Coleman sat back in his chair, adjusting his square glasses slightly. "It's already on the way. The State Department approved the first shipment yesterday, and assuming it has no trouble crossing the Atlantic, you'll see it by the end of the week. The problem-" The Pennsylvania native leaned forward, his face coming into the light. "-is with members of your government. State is concerned that the more left-leaning parts of your opposition and the return of the huidos and maquisards may pose a threat to a freedom-allied Spain in the aftermath of your victory. I remember the Lincoln Battalion, and Washington does too, but we can't brook any chances that our two nations' relationship might go into jeopardy."\n\nPío gave Fig a half-smile, and then said, "Get me the guns, mines, and rockets, and I can be remarkably unstinting in my praise of the OFN."\n\nAt that, Fig gave his own half-smile, extended a hand, and said, "Then you have my answer.""
iberiawars_proxy.1.a:0 "Building a friendship on spent casings."

iberiawars_proxy.2.t:0 "The Prodigal Return"
iberiawars_proxy.2.desc:0 "José Gómez Gordoa had never liked the so-called 'Mexican' Pavilion in Sevilla. But his likes mattered little, given that it had been officially designated as the temporary embassy for Mexico and he, as the Chargé d'Affaires, was obligated to use it. Mayan stylings and all.\n\nStanding between two carved Toltec-styled serpent heads, he addressed a small audience of officials and prominent figures from the Sevillan government. Mexico City had been clear with him, and he was now clear with them, that Mexico considered the government here in Sevilla as the official successor of both the exiled republic and of Spanish democracy in general. He spoke strongly of Mexico, and how it, of course, had deep ties to Spain - and would step up to protect one of its progenitors.\n\nThis entailed direct support, along with anything else that could be provided. Mexico, he announced, stood ready to do anything in its power to expel the fascists - and any other form of fascism - from Spain once and for all. Spain had crossed the ocean once, changing Mexico forever. Mexico would now do the same, crossing in reverse to change Spain.\n\nAs he finished speaking, he took a step back to claps and cheers. Gordoa felt deep satisfaction, and he looked forward to mediating between Sevilla and Mexico City. He only wished that a better building could be found soon."
iberiawars_proxy.2.a:0 "The statues looked on."

iberiawars_proxy.3.t:0 "Washington Extends a Hand"
iberiawars_proxy.3.desc:0 "Ridgway B Knight, American Chargé d'Affaires to the newly-proclaimed Spanish Republic, shook hands with President Humberto Delgado before the acting President beckoned him to take a seat on a nearby couch. Knight had only recently arrived in Spain, and so his schedule and staff were in a chaotic state at the moment, although it seemed like the Republic was under similar circumstances. After some initial pleasantries, Knight leapt straight into the heart of their meeting today, "President Delgado, I can assure you Washington is very interested in deepening relations with the Republic. They've agreed to send military and economic aid to help the Republic defeat the Kingdom and reunify Spain under a democratic government."\n\nDelgado's face, already lit up by the confirmation that aid would be on its way, brightened even further after Knight passed him a folder containing what equipment would be arriving in the first shipments from across the pond. "Thank you, thank you, we won't forget this generosity. With America on our side, all of Spain may soon be liberated from the grip of fascism."\n\nDelgado paused for a moment, and then spoke, "About the Atlantic archipelagos," Knight's jaw tightened a bit, "is there any chance of Washington aiding in an operation to reclaim them? It's a daunting task for us alone considering the circumstances."\n\nKnight knew that Madeira and the Azores were currently under the control of Admiral Fernando, and that the OFN wasn't eager to burn that bridge just yet. Knight stood up and made his way towards the door as he gave his response, "I'm sorry, I can't comment on that just yet, and I unfortunately am needed elsewhere for another meeting with my staff." He was out the door before President Delgado had a chance to probe further."
iberiawars_proxy.3.a:0 "And just like that, the meeting was concluded."

iberiawars_proxy.4.t:0 "To Hold The Whip-Hand"
iberiawars_proxy.4.desc:0 "The gentle patter of rain upon the roof graced Lisboa as the ship pulled into port. Among her passengers was Aguinaldo Boulitreau Fragoso, a Brazilian diplomat, and receiving him in Belém Palace was Acting President Humberto Delgado.\n\nA warm smile was exchanged, and the diplomat's guard stood outside the room the two men sat down in. Delgado began, saying, "Let me first tell you how honored I am that the men of your republic have lent diplomatic support to mine. I have always said the lusophone nations must stick together, and just hosting you here has increased my standing in parliament."\n\nFragoso smiled at his flattery. "Of course, Presidente. Brazil will always be steadfast in its contributions to liberty, and that, of course, extends to our mother country. There is strong support for you and your republic in Brasília. The dockworkers are putting shipments of aid together around the clock-Jesucristo knows we want to help."\n\nFragoso leaned back in his chair and then continued, "You'll be pleased to know that your mainland exiles have also begun sending donations along with the aid. They're relatively modest in wealth, but their thoughts and hopes are with you for a free Portugal."\n\nDelgado grinned humbly. "I know we will not let them down. Thank you for your aid, and your time. If I'm ever in Recife, I trust I can look you up?" Fragoso gave an enigmatic look."
iberiawars_proxy.4.a:0 ""No doubt, Senhor. No doubt.""

iberiawars_proxy.5.t:0 "A Second Offer for a Second Civil War"
iberiawars_proxy.5.desc:0 "Tomás García Rebull, shook hands with Hans Hoffmann, someone Rebull was already familiar with considering the German diplomat's long career in both Spain and Iberia. Rebull was careful not to show that he was nervous, since this meeting could very well decide how the next few years for all of Spain would play out, let alone the fate of the National Junta itself. After greetings and sitting down, Hoffmann handed Rebull a dossier, "That is a list of all the equipment and aid Germania is willing to send over at this time," said Hoffmann.\n\nRebull flipped through the dossier, the vice-president could hardly believe his eyes as the list just kept on going and going. Rifles, economic aid, food, trucks, explosives, artillery, planes, and even tanks were all printed out on the dossier. It was such good news Rebull knew there had to be a catch. "This is quite a lot of aid. Not that we aren't grateful, but may I ask what the price tag will be for all of this? I am quite aware of the debt Spain had with Germany when you helped in the last civil war."\n\nHoffmann gave a slight chuckle and waved his hand, "There's no need to worry about that. We're not in 1936 anymore, circumstances have changed. Now it is Germania's perspective that securing your government's survival is a matter of continental security, and one of utmost importance."\n\nRebull eyed the German diplomat's expression during his response, trying to tell if the man was trying to pull the wool over his eyes. However, Hoffmann's face did not betray him, and Rebull simply could not get a read on the man. While he couldn't fully trust it, Rebull wasn't about to look a gift horse in the mouth, "Well then, we thank you again for the generosity, and you can inform your superiors they can begin the shipments as soon as possible.""
iberiawars_proxy.5.a:0 "And so the deal was signed."

iberiawars_proxy.6.t:0 "A Meeting With Rome"
iberiawars_proxy.6.desc:0 "José María Codón welcomed Francesco Cavalletti di Oliveto Sabino, the Italian Chargé d'Affaires, into his office. As foreign minister of the national Junta, it was not the most grandiose of meeting places, but the chairs were comfortable and the view outside the windows was pleasant enough for its purpose. Sabino was quick to get to business, cutting through the initial pleasantries, "I can speak on behalf of Rome when I say that the Kingdom of Italy is willing to send aid to your government in its bid to reunify Spain."\n\nCodón was sure he was smiling as he responded, "That's great news! We assure you that we will use any aid to the best of-"\n\n"However, that aid shall only arrive on one condition: That your government keeps its distance from Germany and instead stays closer to Italy."\n\nCodón couldn't say the condition was unexpected, but it was going to make things much more complicated. After trying to formulate a satisfying response, he spoke, "While I personally prefer Rome over Germania, I am but one man. I can try to express the importance of fulfilling your condition to the rest of the Junta's leadership, but I can't move mountains by myself. If you want to see us move towards Italy, your aid will need to be substantial.""
iberiawars_proxy.6.a:0 "Now it was Sabino's turn to say: "I'll see what I can do.""

iberiawars_proxy.7.t:0 "The Pakt's Oculus"
iberiawars_proxy.7.desc:0 "The evening was hardly welcoming in Porto, with the sun having fallen well past the horizon. Without the street-lamps turned on, it was a sea of darkness.\n\nIn an administrative building on the Rua de Santa Catarina, João Pinto da Costa Leite, the Foreign Affairs man in the Kingdom of Portugal, was sitting behind a broad oak desk. Before him was Herbert Müller-Roschach, the newly-appointed charge d'affaires for the Kingdom. Costa Leite began in a mild, but strained tone, "I'm sure I don't need to tell you that our Kingdom needs friends. We are alone, and the Americans' puppets in Lisbon are baying for our blood."\n\nRoschach returned that infuriatingly impassive look that it seemed all of the Reich's functionaries had mastered. "I am afraid you have been misled as to the nature of this mission. It is an observational one, not one to determine how much money and guns we funnel to you."\n\nCosta Leite narrowed his eyes, and Roschach rolled his shoulders. "But...I was not sent here to play babysitter. If the Reich weren't interested in helping, I would not have been sent over in such haste." Roschach pressed his fingers together into a diamond. "Soon, I will send my report to Germania. On my own initiative, and with approval from the Abwehr station-chief, I will recommend aid be delivered, and your guns and money will come."\n\nThe lusophone's eyes cooled, and returned to their natural quality. "I...appreciate that, Senhor. Portugal's future foreign policy will surely be decided by your aid."
iberiawars_proxy.7.a:0 "Eyes opened. Doors to follow."

iberiawars_proxy.8.t:0 "Promises Yet Unfulfilled"
iberiawars_proxy.8.desc:0 "Although the state dinner was well-attended by various government ministers, all attention was upon the foreign ambassadors present. There were not many, but each was seen as priceless, and each had to be correctly handled.\n\nEarlier that day, they had, one by one, presented their credentials to Prime Minister Tavares and had them formally accepted. The Kingdom of Portugal desperately needed legitimacy and support both, and Tavares was working tirelessly to acquire them. Of all the ambassadors, however, his focus was upon Giuseppi Cerulli Irelli, the new representative of Italy to the resurgent Kingdom. The days of the Triumvirate were not forgotten, nor was the power of Italy relative to the other states.\n\nAs such, Tavares spoke warmly and often to Irelli during every course, looking for his opportunity - which came shortly after dessert and was, to his great surprise, advanced by Irelli himself. Safely ensconced away from the other ambassadors and their sensitive ears, Irelli communicated to Tavares that Rome was very interested in ensuring the Kingdom's success. That was very well and good, of course, but to Tavares' cautious delight, Irelli informed him that Italy was preparing to send over aid. Unconditionally - at least on the surface.\n\nTavares was warm and excessive in his genuine thanks. He did hedge, however, by stating his hopes that the 'aid' promised would be something other than scraps. Portugal needed more."
iberiawars_proxy.8.a:0 "Irelli's tight smile did not give clarification."

iberiawars_proxy.9.t:0 "The Pakt's Hands"
iberiawars_proxy.9.desc:0 "The mid-morning sun had given way to a heavy rain beating down upon Porto's streets and citizens. Out of the rain and away from winds, another meeting was happening in the commercial district. Sheltered in a small, emptied cafe were the strange pair, Müller-Roschach and Costa Leite. Roschach sipped from his cold cup and looked at the Portuguese man with a grave face. "The coup was nasty business. It didn't come at such a good time, either. My friends in the Abwehr are no fools; they know Kaúlza isn't interested in integration into the Reich's European order. I'm sure you know how tenuous support is right now. Germania is still interested in providing aid, but we might be pressed to reconsider if it will just end up in the hands of a hostile state instead of a strategic partner."\n\nCosta Leite swallowed, understanding the gravity of the moment well. "Kaúlza is...difficult. But even he needs allies. Trust me when I say you are still our Kingdom's best option."\n\nHe turned his eyes away, pondering the next words briefly. "I can ensure Kaúlza sets aside his differences with you in exchange for guns. He knows, or will know, that he can't survive without help. Keep the aid flowing, and I will make Kaúlza understand the importance of our partnership with Germany."\n\nRoschach nodded, although in the recesses of his mind, he began to feel a creeping emotion: doubt. Would the Kingdom of Portugal really prove to be the correct investment at the right time, or another farce? Well, he supposed, either way, the rifles will come to Iberia. They may as well be German."
iberiawars_proxy.9.a:0 "Your right fist, O Lord, is majestic in power; Your right fist, O Lord, shattered the enemy."

iberiawars_proxy.10.t:0 "An Unimportant Change"
iberiawars_proxy.10.desc:0 "Looking out of his window, Giuseppe Cerulli Irelli surveyed what portions of Portugal he could see through the Italian embassy's gates. Gates that he had ordered closed for the time being out of polite caution.\n\nThe recent coup in the Kingdom had been very concerning, both to him and to Italy (though he considered those to be one and the same). The relationships he had formed with the government had been thrown into tumult, but upon careful examination and after receiving overtures, he was confident he had properly re-evaluated the landscape. Turning to his desk, he prepared his official missive to Rome.\n\nKaúlza, now prime minister, was of course a radical of the highest order, as were the many officers he had brought forward and installed into high government positions. That was concerning, but the reality remained that Italy was a powerful and desirable ally, and Kaúlza had made it clear that he would collaborate with anyone who could assist the Kingdom in achieving victory.\n\nOf course, whoever did so would reap the value of influence and obligation, and Cerulli intended that Italy should be the beneficiary. He summarized that Rome should continue aid and, if possible, even increase it."
iberiawars_proxy.10.a:0 "As long as Kaúlza remembers his 'friends.'"

iberiawars_proxy.11.t:0 "A Peninsular Luncheon"
iberiawars_proxy.11.desc:0 "Although Hans Hoffman was not nearly as content as he could have been, he certainly couldn't fault the luncheon that Ximénez de Sandoval, the National Council's foreign minister, had invited him to.\n\nHe knew the reason, of course. The Junta had collapsed, and all eyes were on the Reich. On whom it would support, and how strongly. Hoffman himself had been a strong supporter of the Junta, seeing it as the faction most likely to bring the war to a speedy conclusion - and thus reduce the need for the Reich to spend more treasure on the peninsula. That was no longer a possibility, though the sandwiches were quite nice.\n\nHoffman did, however, concede that the end result was not unpleasant to the Reich. After all, with the Falange taking full charge of the situation, at least ideological alignment between the governments could be well-maintained. Sandoval, for his part, was wholly focused on whether there would be any changes in German aid owing to the 'change' in government and, after another dessert, Hoffman gave his reassurances.\n\nThe Reich could hardly let its fascist brothers down, could it? Especially when they had such excellent catering."
iberiawars_proxy.11.a:0 "Relief."

iberiawars_proxy.12.t:0 "Support Between Peninsulas"
iberiawars_proxy.12.desc:0 "Although Ximénez de Sandoval did not have high hopes for his meeting with the Italian representative, Oliveto Sabino surprised him more than he had originally thought possible.\n\nThe Junta's collapse had, of course, forced all of the National Council's backers to re-evaluate their positions, and Sandoval, for his part, doggedly worked to find out what they were. In his own mind, however, he had anticipated the Italians to pull out and had largely written them off. The Junta had given them a palatable muddling of ideology to sell domestically, and he had thought the Falange a step too far.\n\nBut he had been wrong. Sabino had made it clear that, though deliberations had been intense, Rome had decided to continue its program of aid and support to the new Council. Sandoval was, of course, quick in his praise, but Sabino had stopped him. Rome hoped, he said, that this aid could show the Council that they need not just throw themselves into Germany's arms. The greater game was always in play.\n\nSandoval himself scrambled to answer as diplomatically as possible, but there Sabino stopped him as well. He simply hoped - as did Italy - that Sandoval's own early predictions would not become reality."
iberiawars_proxy.12.a:0 "As long as the aid flows."

iberiawars_proxy.13.t:0 "A Faithful Friend"
iberiawars_proxy.13.desc:0 "Carazo Hernández perspired softly in the baking heat of the day. Rays from the sun scattered gently upon the foreign minister's back as he sat in the comfortable cafe chair, dots of moisture appearing on his face. He offhandedly wished he could bring the cool air of the Palace of Viana to the sunny day, as he watched birds flit from branch to branch far above him. He dabbed at the sweat on his forehead with a handkerchief, but looked up when he saw an approaching figure.\n\nOliveto Sabino smiled a bit on his approach, and then found his seat across from the Spaniard. Hernández began, in a light tone, "A pleasure, Señor Sabino. Let me start by telling you how grateful I am for your sustained support after the demise of the Junta. Italy's help is much appreciated-in these troubled times, generosity goes a long way." A waitress arrived at the table, dropping off a pair of cups filled with cortado. The two men accepted their drinks, and Hernández indulged, the silky taste of espresso and milk eternally pleasant as he had a sip. Sabino drummed his fingers for a moment on the glass table.\n\n"To tell you the truth, I have always liked Carlism better than Falangism. The Falange, while...orderly, in its way, did not have the grace and daring of the Carlists. It's my hope that Italian rifles and Italian money can carry your Kingdom to victory over your foes in this war. After that, we can see to the creation of true friendship between our two nations."\n\nHernández smiled at the Italian, and then picked up his cup. "To friendship, Signore.""
iberiawars_proxy.13.a:0 "A clink, and then a chuckle."

iberiawars_proxy.14.t: "Foreign Assistance From [?new_supporter_id.GetName]"
iberiawars_proxy.14.desc: "FROM: Ministry of Foreign Affairs\nTO: The Council of Ministers\nSUBJECT: Foreign Assistance From [?new_supporter_id.GetName]\n\nThe Ministry of Foreign Affairs has received a foreign aid package from the [?new_supporter_id.GetAdjective] delegation to assist our ongoing war effort. This aid is intended to bolster our capacity to wage war against our enemies and defend our lands from hostile powers in Iberia.\n\n[?new_supporter_id.GetAdjective] support has taken the form of logistical assistance, material resources, and military advisors. A detailed, exhaustive list is attached to this document.\n\nThe full scope of aid coming from the government of [?new_supporter_id.GetName] may change in the future. However, its arrival shows who [?new_supporter_id.GetName] truly stands with in this conflict."
iberiawars_proxy.14.a: "Extend our deepest gratitude."

iberiawars_proxy.15.t:0 "The Oldest Alliance"
iberiawars_proxy.15.desc:0 "The two longshoremen, good friends, had long worked together at the port outside Leixões, in northern Portugal. They had seen ships from all over the world, and often wagered (in a friendly fashion) between themselves on recognition of the ships in the distance. This time, however, they had both lost their bet.\n\nFor the ships - more than one - flew the British flag. They had seen it before, of course, but it had been rare indeed in the years before all the trouble. As they helped offload the cargoes they recognized the telltale characteristics of military equipment - standardized packages, uniform stencilling, and the like. But they were both more interested in eavesdropping on the conversations between the ship's officers and the port officials.\n\nThe longshoremen shared the port captain's surprise, as nobody at Leixões had heard anything about British military aid to the Kingdom (and they all knew, but politely didn't mention, the many troubles Britain had gone, and was going through, back at home). The British captain grimly agreed, telling the officials not to expect more, given the focus of his government at home, but that the equipment was intended as a formal token of support.\n\nAfter all, he said with what even the longshoremen thought was an all-too-perfect example of British stoicism, Britain may be having troubles at the moment, but 'it has been through them before, and Britain always remembers its friends. And its obligations.' The port captain shook his hand warmly, and the longshoremen felt the warmth between the men. It was a feeling that had been shared by many compatriots in the two countries, for many centuries prior and, hopefully, hence."
iberiawars_proxy.15.a:0 "Since 1386."

IBR_wars_request_aid_tt:0 "We will now receive aid and we will be able to request aid from §Y[?new_supporter_id.GetNameWithFlag]§!."
IBR_wars_request_aid_fake_tt:0 "§Y[ENG.GetNameWithFlag]§! has sent some aid, but we won't receive or be able to request any further aid from them."

## Reaction Events

iberiawars_reaction.1.t: "Faces in the Wind"
iberiawars_reaction.1.desc: "The day was bright and warm, the sea calm. Waves tapped the shore, and João felt his own stomach undulate as he sat and watched. He flipped open a newspaper, the bright white of the new print gleaming in the sunlight. His eyes glided over the front page: more news of the war in Spain. Some battle, a short excerpt from a Franco speech, a statement from the King. He read.\n\n"The situation in Spain is most regrettable. We can only offer our prayers for the preservation of the Spanish people and for a quick resolution to this conflict."\n\nJoão flipped the page. The statement ended; the articles about battles and Franco's speech continued. He laid the paper aside and looked out to the docks. He had worked there once, during their last war. Then, the Spaniards had come. They hung about the docks, the men, women, and children, begging. He had been told only the vagrants remained; the rest found work further inland. Whatever they were, the sight of those husks that rasped pleas for money to buy some bread, only to be knocked around by police with batons, made him sick.\n\nHe spared coins for them whenever he could. How glad he was when they went away! The guilt went with them, and he could content himself that when and where they returned, they returned to intact villages, families, farms, and homes; he could imagine no other.\n\nJoão was not a sophisticated man; he did not know why they had fought then, nor did he know why now. Where he did not know. He stared into the horizon. He had heard that Portugal would not be spared this time, that already, the Republicans were mustering forces—that morning, he had read that his grandson would be enlisting in the King's forces. He picked up the paper and flipped to the sports section. The wind hurled, the waves crashed, and João huddled and read."
iberiawars_reaction.1.a: "A storm approaches."

iberiawars_reaction.2.t: "For Whom the Bell Tolls"
iberiawars_reaction.2.desc: "The Lisbon morning began as so many others had, with the soft grazing of the Tagus, the distant ringing of the church bells, and menial shifting of papers in Delgado's office, as he quietly fanned documents around, testing to see if any caught his eye. His fingers paused as he swept over a headline, coated with an ink darker than the others:\n\nCIVIL CONFLICT BREAKS OUT IN SPAIN\n\nA deep toll sounded through the city.\n\n1936. Delgado almost smiled at the title's symmetry from decades ago. What's next? Germany invading Poland, or whatever country they could get their decrepit hands on? He read further. The picture of the familiar tricolor, the Republican purple, gloriously unfurled against the sky.\n\nA resonant toll sounded through the city.\n\nDelgado picked up his pen, planting it on a sheet of paper before stopping. He could already imagine it. A letter to their leader. A pledge of unity for the Republican cause, from Lisbon to Madrid. He imagined walking onto the palace balconies to the roars of liberation. He imagined welcoming their leader to a stroll along the Tagus in Lisbon. He imagined victory.\n\nA rhythmic toll sounded through the city.\n\nVictory. A fragile word. When victory was possible in '36, '37, '38. History had a way to deceive those who believe in victory. Radiant like the light that spilled across the Tagus, but imperceptible to those blinded by only ideals. The Republicans — no, Spain — would not fall to such follies anymore. There were moments when a nation could feel itself at a precipice, at a new dawn. When the air rumbled with energy. Though the old Republicans were gone, men around Spain would allow themselves to believe in a new morning to end the Iberian nightmare."
iberiawars_reaction.2.a: "The bell tolls for thee."

iberiawars_reaction.3.t: "What Time Hath Wrought"
iberiawars_reaction.3.desc: "Francisco Franco was a harsh thing to look at in his old age. In a room with his most esteemed members of both the government and military, he knew it was something more like a den of vipers. Unlike the Franco of the thirties, bold, disciplined, and every inch the revolutionary general, the Franco sitting slumped in the chair was the exhausted administrator. Years without daring had turned him torpid, and the stress of keeping together his nation under crisis made him look at least a decade older than he truly was. "Men of Spain, we must turn to the matter of... "\n\nAcross the room was Carlos Iniesta Cano. His eyes met the gaze of another man, wearing the same expression. For both men and many more, their faith in Franco, once ironclad, had withered away. Cano was one of those who had watched the Caudillo in his youth and saw as governance sanded off the edges of his true spirit. Spain, he believed, was rotting just like Franco. A great man had to take control, or the country that Cano and the old blueshirts loved so dearly would fall further. Cano looked into the crystal glass sitting to his right, its swirling waters and scant ice cubes, and then peered up at the clock. The meeting draggedEvery second Franco remained at the helm was a second Spain strayed nearer to further trials.\n\nOn the street, a clerk at the local FET office felt his blood boil as it tended to do often nowadays. He saw men in fatigues shouting orders as soldiers piled into APCs, speeding off to beat more Spaniards. His father, a soldier in the Mixed Brigades, had taught him all he needed to know about the bastards. Conmen who had stolen Spain's future in favor of jackboots on faces. Their ego had burned the Piel de Toro in '36, and soon it would burn the land again. It was nearly enough to make him weep, but before it could, an idea took hold in the young man's mind. Perhaps this was not the only way. Perhaps Spain could still be saved. Peace, progress... and elusive democracy. There were other men, his father's friends, who had fought in the War. Maybe it was time to reach out to them again."
iberiawars_reaction.3.a: "The journey of a thousand miles..."

## Peace Events

iberiawarspeace.1.t: "Sanctuary" # POR
iberiawarspeace.1.d: "It was the first moment to himself he had all day. After the Republic and its socialists were defeated, Jaime Álvares Pereira de Melo had become the most sought-after man in Portugal. The threat of communism was vanquished, Christian rule was entrenched, and he had become a beacon to all his people. He should have welcomed his newfound status as king. But he could not.\n\nLight shone through the windows of the Sintra National Palace chapel, dragging his shadow every which way across the tiled floor. Outside the chapel doors, dueling advisors jockeyed for his favor, trying to use him as a tool to enact a democratic or authoritarian constitution. Outside the palace gates, German and Italian advisors vied for his support, Portugal and the Monarchy being nothing more than a bit piece in their struggle for Europe. And outside the royal sphere altogether, he knew that thousands of Portuguese saw him not as an emblem of heroism, but as a symbol of the men who killed their husbands, fathers, and sons.\n\nThe war may have ended, but only in the presence of God could he be free of strife.\n\nThe king looked up towards the cross above the altar. Did he really have the strength to do what must be done? Each movement of his, each little twitch of his arm, was vital to Portugal's future. He may stand at the top of the world, but he had never felt more lost in his life.\n\nSoon, he would have to leave the chapel and fight the wars still raging all around him. Soon, he would be forced to helm the ship and rebuild from the hellish conflict that devastated both the nation and the people. Soon, he would face his trial. But first, he knelt beneath the altar and whispered a prayer, his words forever between him and God alone."
iberiawarspeace.1.a: "In the coming years, he would have to savor every moment like this one."

iberiawarspeace.2.t: "Bolsas de Poeira" # RPP
iberiawarspeace.2.d: "It had been a day like no other for Humberto Delgado. Parades marching through the streets, planes flying overhead, speech after speech to exuberant crowds, all capped off by a ceremony for him at the São Bento Palace, the parliament of the newly secured Republic. Wine glasses clinked, and politicians of all stripes chatted, giving toasts to the President and all who had made the revolution possible. Slipping out through the back, he made his way across the garden, towards the Prime Minister's residence.\n\nThe mansion hadn't had a visitor in months. Dust coated everything - from the furniture, to the empty hearth in the corner, to a jacket on a coat hanger. Delgado slowly walked towards the study and opened the door.\n\nThe room was exactly how Salazar had left it. A minimalist and modest desk filled most of the study. Reports, legislation, and correspondence with Franco were sorted into neat stacks. A copy of his autobiography lay on top of a bundle of papers - his unfinished writings. In the near corner, a chessboard with scattered pieces sat next to a list of coordinates and notes, as if trying to recreate and study a position. A ceremonial saber lay on the side of the desk, and a small bookshelf and cabinet were the only other objects in the room. This was all that remained of Portugal's tyrant of nearly thirty years.\n\nDelgado reached for the saber. As if his body was moving on its own, he hacked at the desk with everything he had. Slashes sent wood splinters into the air, and letters and legislation were sliced in two. Half cackling, half shouting, Delgado screamed into the night. "I hope you can hear me in Hell, old bastard! You're fired!" Over and over he swung, until the saber was buried in the wood. Out of breath, he gave one last look towards the sword embedded in the desk, before turning around and leaving Salazar behind for good."
iberiawarspeace.2.a: "A new day dawns in Lisbon."

iberiawarspeace.3.t: "The New Portugal" # PPR
iberiawarspeace.3.d: "If one wanted to see the new society of Portugal, one would have to look no further than Commerce Square in Lisbon on the day of victory. All stripes of society mingled and chanted in the square. The pink buildings of the square, once a sign of the bourgeois order that once ruled Portugal, were being spray-painted red. New government officials, many former students no older than their early twenties, milled about with ordinary workers.\n\nCarlos Antunes was happy to be another nameless face in the crowd. From the corner of his eye, he saw an old friend - a steelworker, who had fought under Antunes in the underground against Iberia. The General Secretary hailed him over, fighting and waving to be heard over the bustling square.\n\nThe worker looked him up and down. "Well met," he deadpanned, "Mr. Secretary." Antunes broke into a smile, and the two comrades embraced.\n\nThey squeezed out of the crowd and walked down to the Tagus River. "Remember the bank robbery in Porto?" "Or the train bombing in Lisbon? I swear, the look on that waiter's face..." The two reminisced about their years of bloody struggle. The friends they made, the comrades they lost, the bodies left in their wake. The wild days of fighting in the streets and sleepless nights hiding from the police. The long, winding road from a cell of under a hundred men, to the vanguards of the revolution in Portugal - and maybe even beyond.\n\nAntunes sat down as they reached the riverbank. "Despite everything... all the pain we've been through... I would do it all again in a heartbeat." He turned to face the worker. "Because now, I can look in the face of any worker, and tell him that he's the equal of the most powerful man in Portugal.""
iberiawarspeace.3.a: "And the worker didn't just believe Antunes - he already knew."

iberiawarspeace.4.t: "Gilded Vengeance"
iberiawarspeace.4.d: "Jaime Álvares Pereira de Melo was surrounded, entirely subsumed by the theater around him. Members of the Press, members of the Clergy, the intelligentsia, corporate financiers, and community leaders from all over the country, all converging on the Sala dos Brasões at the Sintra National Palace. All stood in attendance to witness the formal resurrection of the Kingdom of Portugal, the first victim of António Salazar, now risen to deliver last rites to Estado Novo and all who dared receive them.\n\nDe Melo felt it improper to consider himself a victim per se, not with so many dead still unburied. Yet for the newly-crowned King of Portugal, the heavy finery wrapped around him only weighed him down like a silk and linen anchorhead, joined by the crown upon his brow for that inevitable, obnoxious idiom of 'heavy is the head that wears the crown.' The royal muttered the speech written for the oh-so-humble Kaúlza de Arriga after the ceremony, partly out of boredom, partly out of contempt.\n\nKaúlza's speech spelled out the broader itinerary for the GNS, similarly written in the tank columns being readied for the parade after the ceremony. Kaúlza was far from finished; the GNS's war to justify its existence was only just beginning. Portugal itself was just the beginning, and short of marching on Rio de Janeiro, Kaúlza was deadset on reclaiming the glory of Lisbon by any means necessary.\n\nIt was then the President of the Council of Ministers, haughty as ever in dress uniform, finally arrived for the ceremony meant for him, the very one Kaúlza himself proposed for himself through backchannels to receive new decorum as 'Savior of the Portuguese Nation.' By this point, King Jaime could only strive to be indifferent, as he was just another cog in a military-political machine that had no purpose or function beyond whatever contrived nonsense Kaúlza was to draw up next."
iberiawarspeace.4.a: "Promptly, Kaúlza gave a curt nod to the room, and the ceremony began."

iberiawarspeace.6.t: "Chatter"
iberiawarspeace.6.d: "From here, they could almost forget the streets below.\n\nBeneath their legs dangling over the crane's ledge, where the breadcrumbs from the tasteless bread they ate fell, the streets of Madrid seemed so distant and otherworldly besides the Almudena Cathedral they were repairing. It appeared as a different world, a vestige spied through a telescope, alien and forbidden to them. Javier and Jorge hungrily chewed, sparing no thought for the long drop before them, and mused upon the cranes in the distance.\n\n"See the Royal Palace? I had to get past that during the fighting; someone blasted holes in it. Why, that tarpaulin covers the whole thing." Javier said, smiling as he relayed the building's affairs. He felt informed, the master of a city that had been harshly reformed.\n\n"Bullshit, you just heard that from someone. Bet you barely came out of your shelter." Javier's face dropped as Jorge rebuffed his information. "Home and this cathedral are probably the most of Madrid you see nowadays. Still, downstairs isn't all bad, got to see those Margaritas earlier. Javier, now there are some women worth fighting for. Woof!"\n\nJavier hit Jorge on his head lightly, earning a soft cry of pain. "Shut up. Like you could fight with your busted leg. They could beat you, or are you going to threateningly waddle in a Republican's direction?"\n\n"I'm rebuilding the King's cathedral, piloting this crane, that'll buy me some points! Maybe I can wear a rosary too. I'll be irresistible."\n\nBoth men laughed, sparing not a thought for the approaching end of their break. Beneath them, the ruins of Madrid stretched out, untouched brick shaded brown in the soft afternoon sun."
iberiawarspeace.6.a: "The King will return to his rightful home and a coronation; the masses shall take refuge in that."

iberiawarspeace.7.t: "Mirror, Mirror"
iberiawarspeace.7.d: "The Palace of El Pardo, on the north end of Madrid, looked more like a condemned building than a warzone. Parts of the building had been entirely burnt out, and where it wasn't was utterly ransacked. Shattered glass everywhere, upturned furniture with trash and debris strewn all over the place. Here or there, a mosaic of bullet holes in the wall, spent shell casings across the floor. Carlos Iniesta Cano spied a spent shell casing as it rolled over and bounced harmlessly off the side of his boot.\n\nThe President of the newly reformed Junta looked upon the carnage with muted disbelief. Past the bullet holes and broken glass, Cano spied the velvet carpet and silk curtains, the slashed paintings and overturned liquor cart, peering into the world Francisco Franco actually lived in. This was the realm the great generalissimo had carved for himself? This was what so many of Cano's peers had religiously given their lives and their careers to protect? A coterie of backroom aristos in khaki, gorging themselves on wine and hors d'oeuvres?\n\nGenerations of service in the Exército, not just his, but many other comrades. Many of them killed in action, many of them decades ago, all flashed through Cano's mind. Dejected, Cano moved to the overturned cart, reaching down and pulling a bottle from underneath it; Chilean Red, 1899, a decent year. Bottle in hand, he spied graffiti on a distant wall in the hallway just past the doorway, surrounded with Republican slogans in bloody red, likely from sympathetic youth who couldn't take a hint.\n\nCano almost chuckled at the thought, picturing his Carlist allies just crestfallen and incensed. He realized there was no real revelation to be had here, just the confirmation of what had already, obviously, been the case after all. As he cracked the bottle and began downing small, measured gulps, he dreamt of the future Franco often spoke of, but never delivered. The future he and the Junta dreamt of delivering, the one for which no one else now stood to stop them."
iberiawarspeace.7.a: "Spain would be pure, refined, and distilled."

iberiawarspeace.8.t: "Valle de los Caídos"
iberiawarspeace.8.d: "They had parted for her when she came to Valle de los Caídos, but none knew of what she had spoken of. Only who she spoke to.\n\nAs she'd walked past the haggard prisoners digging, some of them had recognized her. They stayed silent, heads bowed as they toiled in the huge holes they tore into the earth. The pilgrims to the site moved aside, whispers passing through the crowds both ahead and behind her. When she reached the threshold of the tomb, she found it encircled but deserted within.\n\nPilar Primo de Rivera had come to visit her brother.\n\nThey had watched as she had entered, unsteady steps and heavy breaths betraying her impassive face. Eyes holding a flood none dared to comment upon, all denied seeing. They all came to see the martyr, the man whose vision would now save Spain, but this moment was not for them. They stood in the baking sun, maintaining a vigil upon the stone tomb. Battered, but standing nonetheless. They would take from its example.\n\nAfter some minutes, Rivera emerged. On the tomb's threshold, she stood stoically, but the clues of events within could be seen by those who looked. Her eyes were reddened, hints of moisture just about visible upon her cheeks. Her voice was raw, almost wavering between strength and sadness, but holding itself steady enough to trick the unobservant few.\n\nWhat words had she spoken to her brother? What confessions or regrets? Promises or pleas? It mattered little as she spoke to the surrounding pilgrims, and to all Spain. They all made their own answer, their own vision of history. Old Spain had entered, and within the voice ringing around them, they heard something new.\n\n"¡Caídos por Dios y por España!""
iberiawarspeace.8.a: "The answer came, the crowd adopting a single voice. "José Antonio—¡Presente!""

iberiawarspeace.9.t: ""
iberiawarspeace.9.d: ""
iberiawarspeace.9.a: ""

iberiawarspeace.10.t: "The Lighthouse Upon the Rocks"
iberiawarspeace.10.d: "The long room, teeming with hastily assembled attendees, fought over the limited floor space. The black and white tiles, immaculate and shiny, were invincible under the army of feet upon them. People jostled. The Palacio de San Telmo had not seen such numbers descend on it in living memory; the news of the meeting had spread far beyond the intended ears. Pio Cabanillas' 'debate club', Political Action, had gathered amongst a sea of intruders.\n\nPio stood at the end of the room, balanced on a stool. The news of the victory, the official surrender, had left no time to properly arrange this meeting. But even as the room before him brimmed past the point of occupancy, he felt unable to demand exclusivity. Today was a day for all, and he would share it with them.\n\nOver the deafening crowd, he began. "Thank you, to all here today. Even to our unexpected guests, I bid you welcome too. I am glad to have you here, for I intend to forward today a proposal for all Spain, regardless of which side they fought for." Some murmurs of approval, but most listened, hanging upon his words.\n\n"I was informed last night that the final surrender had been signed. Spain is once again free." Cheers from the PA members, as well as some of the public. "But we cannot think that this is victory. Freedom has come before to Spain, and it was lost each time. King and Caudillo have afflicted this land, this nation now reduced to ruin. We cheer, but I ask you how many have died so that we can cheer?" Silence.\n\n"Today should be a day of celebration, but we must realize the task before us. Spain needs a real debate upon what this Republic means and the values for which it will stand. We must accept responsibility for the sacrifices made for the better day we now enter. We must wash away the horror of the war, and with an election, trust our voices will make something better.""
iberiawarspeace.10.a: "Pio saw the face of Manuel Fraga in the crowd. He applauded, and the applause spread like wildfire."

iberiawarspeace.11.t: "Oracle"
iberiawarspeace.11.d: "Sitting in the small, desolate room he had been quartered in, looking at the grainy footage of Madrid on the tiny TV, Jamie dos Santos Serra almost began to regret his post. Instead of enjoying the festivities of Lisbon, Madrid, or any of the numerous cities no doubt celebrating the impending restoration of the Union, he was here. Sitting almost naked on a bed in a room that smelt of rot and mold, teetering on the edge of a cliff in the Pyrenees.\n\nHe had envisaged the Minister of Defense role to have been a bit more glamorous.\n\nIt had rained all day as he'd walked in and out of bunkers, entrenched positions, and observation posts. The geography was as familiar to him now as the contours of his own body, each valley and road thoroughly photographed and enlarged. He'd listened and nodded as maps had been brought to him, notations of French movements barely more than a few dozen kilometers away.\n\nHe shook his head and lay on the bed, trying to find some comfort in the thin mattress as he stared at the cracking paint of the ceiling. The compressed voices of Antunes and Carrillo, almost unrecognizable thanks to the poor television speaker and reception, proclaimed plans to unify Portugal and Spain once more. How grand it must be to chant in the streets of festive, liberated cities.\n\nHe ignored the footage - it seemed hollow. They celebrated like victory had come, but every day, more guns appeared across the border. International volunteers they couldn't disrupt, aerial reconnaissance they couldn't combat, material they just couldn't match. Everywhere he had seen his brothers, Portuguese and Spanish, hardened by the decades of guerrilla campaigns, amongst green troops whose hands shook. All learning the new reality of their war, unable to hide and using the salvaged remnants of the Union military. The true reckoning was yet to come; the hordes of European reaction were at the door."
iberiawarspeace.11.a: "He closed his eyes to sleep, the TV continuing unheard. A restless sleep, plagued by visions."

iberiawarspeace.12.t: "Washed Away Upon History's Current"
iberiawarspeace.12.d: "I bobbed up and down, the cold water of the Tagus controlling me completely. I was one with the river, slave to its whims, cast from my perch above. I was never to return. The bridge above us is now alien in every sense.\n\nThe streets above had burst with life as I had watched, some of those shouting even climbing upon myself to get a better view. The loud, endless chants of foreign diesel engines moved past as the people tried to climb atop them. Laughing, singing, crying, and cheering all reverberated around those metal boxes moving upon the road, the men atop them fresh-faced and grinning in the midday light. They looked different from the men I had seen leave before. They had marched, stone-faced, out of the city, and then later other men had come in their place. Hadn't there been celebration then? Hadn't there been destruction? I couldn't understand, the faces were never the same and only ever grew older.\n\nThe loud vehicles and marching men soon passed, replaced with a single convoy of open-top vehicles. Banners proclaiming these men hung above them as the spectators standing with me cried out titles for them. The old guard, the true patriots, the nation's greatest: all honors I heard thrust upon these men with long faces and worn skin. They smiled, but their eyes were weary and their waving weak.\n\nBut for me, the festival was over. Someone saw me and climbed from his vehicle, pouncing at me. When the people saw me, and who was coming for me, they cheered. There was no support in them, their apathy lost in a moment. They saw me, a bystander, and cheered as I was torn from my place and held aloft.\n\n"I, Colonel João Varela Gomes, declare this bridge liberated!" he cried to roars of approval as I was cast below, the symphony of emotion and material fading as the Tagus took me. I shared the river with many others, and together our fate was tied to the current."
iberiawarspeace.12.a: "Water lapped over the sign as it was carried away from History. Upon it was printed: Salazar Bridge."

