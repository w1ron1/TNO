Iberian_Wars_Reconstruction_idea_A:0 "Hell's Neighbor"
Iberian_Wars_Reconstruction_idea_A_desc:0 "Boundaries, thin and porous at the best of times, were all the more so in the depths of the Iberian Wars. No region, no matter how 'peaceful', escaped unharmed. Thin refugees haunt city streets, marauding deserters the hills. Famine lurks every field and plate. Buildings, roads, and rails remain in decent shape internally but the infrastructure that once carried information, commerce, and family across the peninsula lies in rubble.\n\nBut, perhaps the worst damage has been done to whatever sense of kinship once reached across those boundaries. For once a neighbor has become a monster, can one's guard ever be lowered again?"
Iberian_Wars_Reconstruction_idea_B:0 "Ashes and Granite"
Iberian_Wars_Reconstruction_idea_B_desc:0 "Sobs of anguish. They come from orphans, widows, the crippled, the hungry, the shell-shocked veteran and his hate-filled prisoner alike. They echo across broken streets, bombed-out homes, cathedrals stripped bare, and farm fields saturated with mines.\n\nBut through this veil of tears, hands are in motion. Some small, some wrinkled. Too many shaking or missing digits. Far too many coated in blood that will not wash out. But they stack stone, rev motors, and plant crops just the same."
Iberian_Wars_Reconstruction_idea_C:0 "Ashes and Ashes"
Iberian_Wars_Reconstruction_idea_C_desc:0 "Should victory taste so bitter? Should the horsemen of famine and pestilence ride so closely behind their companion of war? Should the songs of our armies be inaudible over the wails of widows and the crack of summary executions? Should the triumphal march be conducted down broken asphalt with one eye hunting for the snipers that still hunt the hollowed cityscapes? Should the touch that greets a returning hero be that of a phantom limb?\n\nThe War has ended. But all it has left us is ashes."
Iberian_Wars_Reconstruction_idea_D:0 "The Crippled Phoenix"
Iberian_Wars_Reconstruction_idea_D_desc:0 "It had always sprung from the flames. The First Spanish Republic, born from rebellion and war, died by generals' and monarchists' hands in 1874. The second Republic, born amid economic dislocation, died at the hands of traitors and Nazis in 1939. The third Republic, birthed by the Iberian Wars, died at their bloody and oscillating hand.\n\nBut as the inferno grew ever hotter, ever darker, the fourth was born. Midwifed into the world by Iberia's regional governments, this Republican phoenix surveys its ravaged land. The cities its antecedent once valiantly defended are husks. The roads and rails that served as its skeleton are broken. Fields that fed its millions lie fallow, unmarked graves their only seed. The factories and homes are gone. The Republic remains."

Iberian_Wars_dummy_idea:0 "The Iberian Wars"
Iberian_Wars_dummy_idea_desc:0 "[GetIBRWarsPoliticalPowerGain][GetIBRWarsCommandPowerGain][GetIBRWarsMaxCommandPower][GetIBRWarsRecruitablePopulation][GetIBRWarsSupplyConsumption][GetIBRWarsArmyOrganisation][GetIBRWarsArmySpeed][GetIBRWarsArmyAttack][GetIBRWarsArmyDefence][GetIBRWarsMinimumTraining][GetIBRWarsMaxEfficiency][GetIBRWarsEfficiencyGain][GetIBRWarsConstructionSpeed][GetIBRWarsUnitsGDPRatio][GetIBRWarsConsumerGoodsUse][GetIBRWarsSupplyNodeRange]§F--------------§!\nWith the Basque Uprising emboldening many other movements across Iberia -both regional and national- to rise up against the central government of Iberia, order would collapse in both Portugal and Spain, bringing forth the Iberian Civil War. From Monarchists to Republicans, Nationalists to Regionalists, and Authoritarians to Democrats; everyone from the peninsula would find itself fighting for their own cause and their own nation, for their own freedom, or for the subjugation of others.\n\nHowever, as the war drags on, the people grow restless and begin to follow increasingly radical leaders. Consequently, as the situation deteriorates, the need for a quick end to the wars is becoming increasingly obvious, as if the wars do not end soon, Iberia may bleed and die."

