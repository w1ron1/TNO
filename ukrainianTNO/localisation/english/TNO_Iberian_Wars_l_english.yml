iberiawars_OFN_SPA.1.t:0 "The Matter of Portugal"
iberiawars_OFN_SPA.1.desc:0 "The decision has been made, at the highest levels, to commence negotiations with the Americans as to the status of Portugal and our current occupation of it. The particulars of the summit are being established, but it is happening and we must ensure that we remain in the strongest possible position.\n\nIt is clear that the Americans wish for the government of the Portuguese Confederation, recognized by them as the legitimate Portuguese government but isolated to the Azores following the fall of Lisbon, to return to the continent. The potential ramifications of such a return are significant, as are the concessions that we may be able to demand for allowing it.\n\nIn any case, it will be our task to ensure that the State benefits to the greatest degree possible while also minimizing any potential OFN presence in the country. The Portuguese occupation may be ruinously expensive, yes, but we must not be distracted by that. We will not, under any circumstances, allow Portugal to become a staging ground for the OFN to pressure Iberia."
iberiawars_OFN_SPA.1.a:0 "Continue preparations for the summit."

iberiawars_OFN_SPA.2.t:0 "The Question of Portugal"
iberiawars_OFN_SPA.2.desc:0 "We have just received word that the Spanish government has accepted our offer of a summit on the future of continental Portugal - and the potential of the Confederation's return to it.\n\nThe government of the Confederation, currently in the Azores, desperately wishes to return to the metropole currently occupied by the Spaniards. Ordinarily, there would be no reason why this would even be entertained but Spain is fragile and under immense resource strain with their occupation. The occupation of Portugal is ruinously expensive - they simply cannot afford it - that gives us a window.\n\nNo doubt Spain will be watchful as to the conditions, especially any regarding future OFN presence within any potential Portuguese state, and we will have to compensate them greatly in one fashion or another. However, the rewards of securing Portuguese return cannot be understated in moral, political, or military terms. Securing Portugal would give us a foothold on the European continent itself - something worth nearly any price. We must work towards success."
iberiawars_OFN_SPA.2.a:0 "Prepare the delegation."

iberiawars_OFN_SPA.3.t:0 "Preparing the Offers"
iberiawars_OFN_SPA.3.desc:0 "As the summit nears, it is clear that the one issue that will dominate all discussions, regardless of the number of technicalities to be worked out, is the position of any Portuguese state within the OFN and what that means for the military positioning and influence of the related powers.\n\nNaturally, it would be our goal for the OFN to be strongly positioned in a future Portugal, offering a stronghold on continental Europe. With Portugal we would be able to flex our muscles on the doorstep of the Reich and the Mediterranean. Just as naturally, the Spanish goal is to minimize this and oppose the Confederation's alignment within the OFN while extracting maximum economic considerations. Understandable, given the Spanish distrust of foreign powers given their weakened position\n\nAs such, we must ensure that we have multiple options to present, allowing for our delegation to present whichever outcome they think will work best in the moment. We must not be caught out of position if these negotiations are to succeed."
iberiawars_OFN_SPA.3.a:0 "Begin drafting the options."

iberiawars_OFN_SPA.4.t:0 "The OFN in Portugal?"
iberiawars_OFN_SPA.4.desc:0 "The Americans want the Portuguese Confederation to be aligned with them and have OFN personnel stationed there. Desiring OFN troops, rather than just American troops, paints their wider designs clearly; they want Portugal absorbed into their alliance and used as a soldier in their conflicts - not just an aligned partner. Obviously we can't accept such intrusions on our borders. The question is, however, how much are we willing to let the OFN do?\n\nAs expected, the Americans wish for the Portuguese Confederation, once returned to Portugal proper from exile, to be aligned with the OFN - and even have OFN personnel stationed there. This represents an unacceptable intrusion in its unrestricted form.\n\nWe cannot have OFN forces stationed in Portugal - it is undeniable that they would use it as a staging ground for destabilization and, potentially, future subversion of the Spanish state. However, there will need to be some level of compromise for a deal to be reached, and we can certainly make the Americans pay for it.\n\nOur representatives, therefore, are asking for what potential OFN presence we may be willing to tolerate. What should our answer be?"
iberiawars_OFN_SPA.4.a:0 "This must succeed. Allow OFN observers."
iberiawars_OFN_SPA.4.b:0 "We can compromise. Allow OFN diplomats."
iberiawars_OFN_SPA.4.c:0 "No compromise. No OFN personnel at all."

iberiawars_OFN_SPA.5.t:0 "The Offer: Cash for Observers?"
iberiawars_OFN_SPA.5.desc:0 "Our representatives at the summit have returned to us a most interesting and unexpected offer on the part of the Spaniards regarding Portugal. They implore us to consider it, given the tense atmosphere regarding the Portuguese question.\n\nFundamentally, Spain will capitulate on the matter of OFN Observer status for Portugal, and even permit OFN personnel and resources on Portugal's Atlantic holdings. This would be a major accomplishment both for the OFN and four our efforts in expanding it, and given the obvious antipathy the Spanish have towards it, likely the absolute most that they would be willing to tolerate.\n\nIn exchange? Money. An extremely favorable economic agreement, which would be of near-incalculable help in supporting their almost moribund economy. The cost is significant, but not immensely so - and the rewards immense.\n\nThis is certainly the best offer that we are going to get - how should our representatives be instructed to reply?"
iberiawars_OFN_SPA.5.a:0 "It's worth the cost. Accept the offer."
iberiawars_OFN_SPA.5.b:0 "Unacceptable. Reject the offer."

iberiawars_OFN_SPA.6.t:0 "The Line: No OFN Personnel"
iberiawars_OFN_SPA.6.desc:0 "Our representatives at the negotiations concerning Portugal have returned with the Spanish position, and it is both clear and less acceptable than was hoped.\n\nFundamentally, the Spaniards accept that Portugal will be granted OFN Observer status, recognizing that inevitability. But they will not permit OFN personnel and resources to be stationed anywhere on Portuguese territories. Certainly not the metropole, and not on Atlantic holdings, either - though this second exclusion was much less strongly voiced.\n\nOur representatives thus suggest that there is the potential to obtain agreement for physical OFN presence in those Atlantic holdings - if we are willing to pay for it through a very favorable economic agreement. We could do so, or we could accept the win on Observer status and move on.\n\nHow should the diplomats be instructed?"
iberiawars_OFN_SPA.6.a:0 "Propose the compromise. See what we can get."
iberiawars_OFN_SPA.6.b:0 "Not worth it. Move on to the next issue."

iberiawars_OFN_SPA.7.t:0 "The Response: Cash for Observers?"
iberiawars_OFN_SPA.7.desc:0 "The OFN delegation has returned to us, following our last round of talks, with a counterproposal regarding the potential of OFN personnel on Portuguese territory.\n\nOur agents there were clear that we would not, and never would, agree to OFN personnel present on the Portuguese mainland - but arguments against their presence on the Atlantic holdings are much less vehement. The OFN has clearly realized this, and are proposing that we accept that presence in exchange for an extremely favorable economic agreement between ourselves and the United States.\n\nThis would be extremely impactful, potentially driving considerable economic growth. There will of course be dissent on the presence of any OFN personnel at all, but those voices can be drowned out, if we wish to do so.\n\nHow should our delegation respond?"
iberiawars_OFN_SPA.7.a:0 "That is acceptable. Accept the offer."
iberiawars_OFN_SPA.7.b:0 "No. We must hold the line. Reject the offer."

iberiawars_OFN_SPA.8.t:0 "The Line, Held Firm"
iberiawars_OFN_SPA.8.desc:0 "A quick response from the continuing talks on Portugal. And not one that we hoped to receive.\n\nThe Spanish have flatly rejected the offered compromise - OFN presence in Portugal's Atlantic holdings in exchange for an economic agreement. They simply will not accept anything beyond Portugal acquiring OFN Observer status, and have refused to negotiate further.\n\nThis is clearly a red line for them, and our delegates do not think any further movement is possible here, unless we wish to torpedo the entire summit and walk away from any deal at all."
iberiawars_OFN_SPA.8.a:0 "Understood. Accept the line and move on."
iberiawars_OFN_SPA.8.b:0 "Then we will. Walk away."

iberiawars_OFN_SPA.9.t:0 "The Neutrality Demand"
iberiawars_OFN_SPA.9.desc:0 "We have received a response from our delegates, and that response is not what was desired. The Spanish have made it clear that Portugal must remain strictly neutral with regards to the OFN.\n\nThis is of course a significant blow for us, compromising many plans intended to leverage a Portuguese OFN toehold on the Continent. Although attempts were made to find positions for compromise, all were (at least at this stage) flatly rejected by the Spanish representatives, indicating instructions from their own government as to this particular.\n\nIt is considered unlikely that there is further space for movement on this topic. We can certainly try, of course, but we must choose whether to do so, accept the current state and move forward, or walk away from the conference entirely in response.\n\nHow should our representatives be instructed?"
iberiawars_OFN_SPA.9.a:0 "We must try again. Reiterate our desire to negotiate."
iberiawars_OFN_SPA.9.b:0 "We must be realistic. Accept it and move on."
iberiawars_OFN_SPA.9.c:0 "Unacceptable. Terminate negotiations and walk out."

iberiawars_OFN_SPA.10.t:0 "Yet Another Attempt"
iberiawars_OFN_SPA.10.desc:0 "The Americans continue to push for OFN involvement in any future Portuguese state, over - and seemingly in spite of - our refusals to just that desire.\n\nYet another compromise has been offered to us, in the hopes of finally finding something palatable to our future strategic considerations. They of course wish for Portugal to be formally aligned with the OFN, of course, but should we accept that they are willing to drop requests for the presence of personnel entirely.\n\nIt is a tiring response in light of positions, indeed, but considering it is not without merit. By far the biggest threat to our future state is OFN troop presence in Portugal, but if that is surrendered, and we accept simple alignment - which is far less dangerous - we remove the threat while keeping space for future gains on our part.\n\nIt is a decision, to be sure - what should the response be?"
iberiawars_OFN_SPA.10.a:0 "We can accept alignment. But no troops."
iberiawars_OFN_SPA.10.b:0 "No. Not even alignment is acceptable."

iberiawars_OFN_SPA.11.t:0 "The Final Rejection"
iberiawars_OFN_SPA.11.desc:0 "We tried, but there was no room for maneuver. The Spanish have rejected the proposal for even OFN alignment for Portugal, let alone any other involvement.\n\nIt is obvious that they will not budge on this. They have made the decision to brook no OFN presence on their border, and are bent on ensuring total Portuguese neutrality. There is no future possibility for compromise, and this is clearly the end of the issue as far as they are concerned. We must choose whether it is the end of the issue for ourselves as well.\n\nHow should we respond?"
iberiawars_OFN_SPA.11.a:0 "We must accept this. Move on."
iberiawars_OFN_SPA.11.b:0 "Unacceptable. Walk out of the talks."

iberiawars_OFN_SPA.12.t:0 "The Question of the Military"
iberiawars_OFN_SPA.12.desc:0 "As the conference progresses, the second issue of major tension between ourselves and the Spanish concerns the future of any Portuguese armed forces.\n\nSpain's position is clear - they wish for heavy restrictions on the composition of a potential Portuguese military, and further demand to be allowed to perform inspections in order to ensure that such restrictions are enforced. This is obviously not desirable to ourselves, the OFN, or even the Portuguese people themselves, who naturally deserve a capable defense. We must find a compromise.\n\nSeveral options have been presented. We can enshrine a Portuguese commitment to self-defense only in any agreement, providing assurances against attack - which might allow us to propose removing inspections entirely. Or, if we do not wish to hamstring Portugal so, we can propose a third-party observer, from a neutral state or other organization.\n\nHow should our delegates be instructed to open the discussion on this topic?"
iberiawars_OFN_SPA.12.a:0 "We will give assurances that Portugal will not attack."
iberiawars_OFN_SPA.12.b:0 "We will offer a third-party overseer."

iberiawars_OFN_SPA.13.t:0 "The Americans Dismiss Portuguese Military Restrictions"
iberiawars_OFN_SPA.13.desc:0 "The American negotiators have come back to us, denying our request for oversight over the formation of new Portuguese armed forces. They claim that such a body would constitute a gross violation of Portuguese sovereignty; something that could have grave consequences for us both if it fosters resentment, thinly hinting at the aftermath of the First World War. Instead, they offer a US guarantee that the future Portuguese government would never attempt offensive action against us, using their own oversight as well as constitutional commitments in the new nation to only pursue self-defence.\n\nSome in our delegation believe this to be reasonable enough. The long-term purpose of such an overseeing body remains an open question, especially as we continue to be forced to fight partisans and rebuild our own country. The Portuguese are already broken and the Americans will understand the OFN cannot violently expand without the Reich intervening. This is all without mentioning our superior industry to Portugal. So long as we keep an eye on them. there should be no cause for concern.\n\nAt least, that's what our more dovish delegates believe. Other delegates have already decried this as servility, claiming that if left unchecked Portugal could serve as a backdoor for American interests, capital or even military force to penetrate our borders. Further, should the Reich even think we have become a stooge to the Yanquis would they hesitate to interfere? Would America help us despite our service? We, they say, are being used and we must make it clear that we see any form of an uninhibited Portuguese military as a grave security threat on which we will not retreat."
iberiawars_OFN_SPA.13.a:0 "This could also get us some goodwill from Uncle Sam..."
iberiawars_OFN_SPA.13.b:0 "We beat American stooges in Spain itself - we will not let them regroup in Portugal."

iberiawars_OFN_SPA.14.t:0 "The Spanish Agree to Drop Portuguese Military Restrictions"
iberiawars_OFN_SPA.14.desc:0 "After a few days of debate and consultation with Madrid, the Spanish delegates have returned to us with an answer - and it is cautiously affirmative. They say that they are willing to let the issue of Portuguese military restrictions drop, but they have also made it abundantly clear that they hold us responsible to hold Lisbon on a tight leash - they will not hold back in their response to any provocation from the Portuguese side of the border and will see us as directly responsible.\n\nOur sources in the Portuguese Confederation have informed us that they do not expect the new government to attempt any provocation, not to mention an outright attack, on the Spanish at any point in the foreseeable future - very few in Portugal wish to return to the days of the Union, and even if they did, the government will have to spend years rebuilding Portugal's devastated infrastructure and shattered institutions before they could even think about invading the much larger Spain.\n\nThat being the case, it seems that this issue has been mostly resolved. Some in our sources consider it likely that the Spanish will attempt some sort of provocation on the Portuguese border at some point - but the Spanish are just as battered as the Portuguese, and it seems that Iberia should be able to know a few years of peace at the very least."
iberiawars_OFN_SPA.14.a:0 "On to the next issue!"

iberiawars_OFN_SPA.15.t:0 "The Spanish Insist on Portuguese Military Restrictions"
iberiawars_OFN_SPA.15.desc:0 "Despite our numerous attempts to placate the Spanish, telling them that the Portuguese government would not have the will or the capacity to attempt any serious provocation, let alone an invasion, as well as offering them our guarantee to hold back the Portuguese even in the off chance that they get the idea of crossing the border, the Spanish have refused to budge. They have informed us in no uncertain terms that they will not acquiesce to any restoration of the Portuguese state that does not provide them with robust means of enforcing strict military restrictions on it.\n\nOur negotiators are quite dismayed by this development. While not our preferred contestant to come out of the wreckage of the union, many in the State Department had hoped the regime could be reasonable - apparently, this is not the case. We do, however, still have a few possible choices to make.\n\nSome delegates propose simply acquiescing to the Spanish demands - unsatisfying as it may be, it will help smooth things over with the regime and enable us to work with them in the future, pragmatically if not cordially. Others suggest we agree to the Spanish demands in principle, but demand that a more impartial third party oversee the maintenance of the military restrictions, hopefully without undermining the viability of the Portuguese state. However, a growing clique of State Department officials are now openly calling for us to walk out of the negotiations - if the Spanish believe that they can force us to bend to their every whim, they will have to learn their lesson the hard way."
iberiawars_OFN_SPA.15.a:0 "This is the Spaniards' backyard, after all..."
iberiawars_OFN_SPA.15.b:0 "We understand their legitimate concerns, but an impartial observer will have to do."
iberiawars_OFN_SPA.15.c:0 "This farce has gone on long enough."

iberiawars_OFN_SPA.16.t:0 "The Americans Offer Third Party Oversight of Military Restrictions"
iberiawars_OFN_SPA.16.desc:0 "After forwarding our demands of restrictions on the new Portuguese armed forces and of Spanish oversight of their implementation, the American delegation has come back with a suggestion of their own.\n\nThe Americans have agreed in principle to the idea of restricting the Portuguese military to avoid any future bloodshed on the peninsula. However, they claim that Spanish oversight of these restrictions would be itself unconducive to the stability of the future Portuguese state, and cite concerns for its sovereignty. Instead, they propose that a third party, trusted by both sides, be tasked with overseeing the implementation of these restrictions. This way, the Americans claim, peace on the peninsula could be maintained without undermining the viability of the Portuguese state.\n\nFor some in our delegation, this is more than acceptable - it would free up resources we could use to stabilise our own war-torn nation, and as long as the third party is trustworthy enough, there should be no cause for concern. Others, however, claim that only we have an interest to ensure the restrictions are properly upheld, and that any third party, no matter how well-intentioned, may well allow a revanchist Portuguese regime to fester under its nose - until it will explode in their faces, and in ours."
iberiawars_OFN_SPA.16.a:0 "A neutral observer would suffice."
iberiawars_OFN_SPA.16.b:0 "This American protectorate was never going to be sovereign anyways..."

iberiawars_OFN_SPA.17.t:0 "The Spanish Reject Third Party Oversight Over Portugal"
iberiawars_OFN_SPA.17.desc:0 "After offering to accept the Spanish demands for oversight over the implementation of Portuguese military restriction, but on the condition that said oversight will be undertaken by a neutral third party, there was cautious optimism in our delegation. It was hoped that the Spanish would see sense and let the Portuguese rebuild without undue interference in their affairs.\n\nThose hopes have now been dashed. In a memorandum, the Spanish delegates have informed us that Madrid considers any Portuguese government not overseen by them as a grave security risk - too grave to accept. They will have the right of supervision over the Portuguese armed forces, or there will be no agreement.\n\nOur diplomats are furious - Portugal will be too weak to attempt any provocation against the Spanish even if they had wanted to, and the Spanish demand to have direct oversight over their armed forces is a barefaced power grab. Many of them claim that the Spanish have made clear they will not be negotiating in good faith, and that there is no reason for negotiations to continue. Others claim that, even if the Spanish have shown themselves to be untrustworthy, there is still much we can gain from these negotiations - the potential of a gateway into Europe may be too enticing to pass up..."
iberiawars_OFN_SPA.17.a:0 "This is pointless."
iberiawars_OFN_SPA.17.b:0 "Do we really care about Portugal, anyway?"

iberiawars_OFN_SPA.18.t:0 "The Spanish Ask for Reparations"
iberiawars_OFN_SPA.18.desc:0 "The negotiations with the Spanish have been tense at times, but they have held so far. While we are almost ready to declare negotiations a success, the Spanish delegation have come forward with a final request: they demand that Portugal pays reparations to Spain - as the successors of the Iberian Union, the Spanish claim that the Portuguese secession has affected them adversely and that it is within their right to request a remedial payment.\n\nThe patience of many of our delegates with the Spanish diplomats was already running thin, and now many are calling for us to walk out of these negotiations entirely - the Spanish are plainly trying for a cash grab and have proven time and again that they are not acting in good faith. These delegates demand that we now confront the Spanish about their unscrupulous behavior - we can't let them extort us endlessly.\n\nWhile almost none in our delegation believe that levying this payment from the Portuguese would be desirable, even if it was possible, some claim that we can spare the money for the Spanish demands, and that this is, all things considered, not a deal breaker. They suggest that we offer the Spanish the money they desire, but through an alternative source - for a relatively small sum, we could arrive at an advantageous result in these negotiations."
iberiawars_OFN_SPA.18.a:0 "Let's sweeten the pot a little."
iberiawars_OFN_SPA.18.b:0 "Time to draw a line in the sand."

iberiawars_OFN_SPA.19.t:"The Americans Confront Us About Reperations"
iberiawars_OFN_SPA.19.desc:"The Americans have refused our requested reparations, saying that it is not only impossible to obtain that amount from Portugal, but also the damages of the war are not nearly equivalent to our requested sum. We had hoped to secure enough funding to bounce back our economy, but that is looking more and more tenuous. Many of our delegation still hold strong to the demands though, and are looking into alternatives that, while not what we may deserve from the Portuguese, could be what we need.\n\nOthers suggest walking out on the brazen Americans who are demanding so much while giving so little. They stand strong on Portuguese accountability for the civil war, though perhaps scrapping the reparations and demanding an apology and national accountability would appease them, and our people. Blame falls on them for letting the situation in Iberia spiral so disastrously out of control, and we refuse to let our national pride be damaged without any sort of redress.\n\nIt's that, or we walk out."
iberiawars_OFN_SPA.19.a:"How dare they! Leave them at the table."
iberiawars_OFN_SPA.19.b:"Our economy can deal without the money, but our people need an apology."
iberiawars_OFN_SPA.19.c:"Propose an alternative for reparations. 'Route' the money through the OFN."

iberiawars_OFN_SPA.20.t: "The Spanish Demand An Apology"
iberiawars_OFN_SPA.20.desc: "Some of the more sensible heads of the Spanish delegation have come forward and acknowledged our points on the Portuguese reparations, but they still have to appease some of their more nationalistic colleagues and have a proposal for us.\n\nThough the Confederation had no participation in the war itself, it will be the successor state to Portugal and thus the Spanish are demanding the nation take accountability for the civil war and publicly apologize for the devastation it has caused. The Spanish say that this is enough for them, and it may even give the Confederation's government some legitimacy, in a backwards sort of way.\n\nOur delegation doesn't love it, and the Portuguese even less, but we aren't gonna get a better deal. After this, we can call it closed and move to the next steps. All in all, it's worth the headache."
iberiawars_OFN_SPA.20.a: "If it'll make you happy."

iberiawars_OFN_SPA.21.t:"The Spanish Propose An Alternative"
iberiawars_OFN_SPA.21.desc: "Our protests at the reparations have borne some fruit, the Spanish are willing to make a compromise. They need money, and they need the Portuguese to take accountability for the war, but the money doesn't have to come from the Portuguese. Publicly, if we route the reparations through the OFN, we can foot the bill and put Portugal back in Iberia. It's not the best deal, but we had already considered the option in the past and it's a small price to pay to have an OFN foothold on the continent.\n\nThe Confederation are willing to publicly take accountability, though they certainly aren't happy about it. Knowing they won't collapse paying reparations though, has mollified them to the idea a bit. If we do this we can be done with negotiations and look towards the next steps, whatever those may be.\n\nThis way everyone is happy and Uncle Sam pays the tab."
iberiawars_OFN_SPA.21.a:"What else is new, where do we sign."
iberiawars_OFN_SPA.21.b:"That's not a burden we can bear right now."

iberiawars_OFN_SPA.22.t:0 "American Delegation Shuts Down The Bid"
iberiawars_OFN_SPA.22.desc:0 "Perhaps it was too obvious of Madrid's intent to ride the tiger on the negotiations, as the United States' response to the Spanish demands were anything but conciliatory; It is abundantly clear that Portuguese reparations are out of the question, with the Americans clearly growing impatient with their Spanish counterparts.\n\nThe American response was by no means unforeseen; They could clearly see the attempt to milk the situation to our betterment, evidently no pushover in shrewd brinkmanship in their own right. If nothing else, we have reaffirmed our capacity for cunning diplomacy on the world stage and shown slough in this regard either.\n\nThere is still something to be gained from this however; Even if reparations are out of our reach, we can still demand a formal apology from the Portuguese for refusing to reintegrate with Spanish leadership, thus sparking the recent conflict between Madrid and Lisbon. It would be a decent manner of which to save diplomatic face over the loss of reparations, yet some will argue that this is simply too petty on the part of the Spanish and that dropping the issue would be preferable to alienating ourselves further in the negotiations."
iberiawars_OFN_SPA.22.a:0 "We can't leave Azores/Madeira without a Portuguese admission of culpability, demand an apology."
iberiawars_OFN_SPA.22.b:0 "This is vindictive even for us, just let the matter drop."

iberiawars_OFN_SPA.23.t:0 "The United States Offers A Solution"
iberiawars_OFN_SPA.23.desc:0 "Never known for a straightforward remedy for foreign entanglements, the Washington delegation in the Azores/Madeira has presented a resolution regarding reparations for Spain. Not wanting to levy the delivery of reparations onto the Portuguese, the Americans are instead pushing for said reparations to be 'routed' through the OFN, providing Spain the desired concessions in a manner that keeps the weight of financing them off of Portugal's shoulders.\n\nOne can argue we gained more than we ought to given the circumstances; Demanding reparations was an obvious ploy, one that the Americans may be well aware of in their decision making. The United States might have an earnest interest in keeping the economic costs out of Portugal's pocket, still in recovery after the multiplicative wars following the Iberian Collapse, thus prompting the decision to use OFN channels to fulfill the Spanish demands.\n\nThe exact logistics of this are not yet set in stone however, in so much that it might be by design; It's possible that utilizing OFN channels would tie it up in OFN bureaucracy as a means to stall or stymie the reparations through a mountain of red tape. Besides, it was Portuguese obstinacy that propagated the Spanish invasion and reparations should naturally fall on their head. We could play the safe route and take the American offer as it stands, but it might be prudent to demand Portugal themselves pay if this turns out to be yet another OFN ruse."
iberiawars_OFN_SPA.23.a:0 "The Yanqui connives, the Spaniard reaps the benefit; Let the OFN pay reparations"
iberiawars_OFN_SPA.23.b:0 "We can never know how deep the OFN rabbit hole goes; Demand Portugal pay reparations."

iberiawars_OFN_SPA.24.t:0 "Portugal shuts down OFN reparations, demands that Portugal must pay."
iberiawars_OFN_SPA.24.desc:0 "Spanish shicannery in foreign policy is seemingly never not in style, as shown in the recent demands of Madrid. Despite the offer to pay reparations out of the OFN's own pocket, Spain is insistent that the Portuguese should be made to pay. Despite their insistence that Portugal is at fault for causing the war, one can assume that there are more pedestrian reasons for their demands; A combination of a financial injection combined with a desire to humiliate Portugal, maybe even as a means to depress their economy as to force them to be more reliant on Spain's.\n\nIt is perhaps still possible that the Spanish will see reason in allowing the OFN to compensate Madrid in some other way down the line; They know as well as we do they can only push this issue so far and may still bite if an offer is on the table. Then again, most wars are bound to leave scars and Spain's invasion of Portugal is only the latest chapter of violence after the Iberian collapse. They might not be willing to take no for an answer in forcing Portugal to pay.\n\nIf worse comes to worse, we can have Portugal agree to paying reparations, however appalling that might be. There are humanitarian interests within the OFN concerned with providing foreign aid on the ground to the people of Portugal, something that would hopefully take some of the sting out of the cost of meeting the Spanish demands. We need to attempt to keep Spain on a cordial basis with the west and as much as the OFN can, we should at least try to minimize the suffering in Portugal while placating the Spanish at the same time."
iberiawars_OFN_SPA.24.a:0 "Does it really matter where the money comes from? Offer OFN compensation."
iberiawars_OFN_SPA.24.b:0 "It is the OFN owes Portugal a great debt after this, whatever Madrid thinks; Have Portugal pay."

iberiawars_OFN_SPA.25.t:0 "The Failure of the Azores Negotiations"
iberiawars_OFN_SPA.25.desc:0 "The conference room was as sterile as a blank canvas, stark against the muted, faded majesty of what was otherwise bespoke, old European stylings of the building that housed it. A gray-maned party official of the National Front stood before a cramped cluster of microphones erected together on a podium. A line of journalists and media representatives from news agencies the world over sat bunched together as if attending chapel.\n\nBy late afternoon that day, many would consider doing just that; Some did, others did not.\n\nAs part of a direct correspondence from Madrid to the Spanish people, the party official announced that Spain had formally withdrawn from the negotiations in the Azores/Madeira. Placing the blame for the negotiations' failure squarely at the feet of the United States of America, whose rank, imperious greed sought to usurp Portuguese autonomy in the name of capital.\n\nWithout outwardly addressing the current state of affairs regarding the Portuguese Confederation in the south Atlantic or their allies in the OFN, the party official announced that Spanish National Forces would at last be withdrawing from Portugal effective immediately, with the government in Madrid working to establish to a new government in Lisbon.\n\nA chorus of concern followed the party official out of the room as the conference concluded, declining further inquiries where it related to the Portuguese for the time being; "Will there be war with the United States?" "Would the Azores/Madeira remain independent?" "What of the Germans or the Italians' involvement?" None of these questions would be answered right away, they simply hung in the air.\n\nAs the news representatives were quietly ushered out, a single crack in the high ceiling sent a tiny piece of decades-old plaster tumbling onto the shoulder of a young journalist making for the front door. It would be brushed off with barely a second thought, only to be vaguely remembered later. But briefly, a strange symmetry could be seen, even if not by any of the men and women there at that moment."
iberiawars_OFN_SPA.25.a:0 "Some institutions are not made to move simply because it is demanded of them, some blemishes must be tolerated until the new paint dries."

iberiawars_OFN_SPA.26.t:0 "The Failure of the Azores Negotiations"
iberiawars_OFN_SPA.26.desc:0 "To the Office of the President of the United States of America; After Action Report: The Azore Negotiations.\n\nMr. President.\n\nAs was indicated as a potentiality in previous correspondence as is the case at present, the delegation representing the Spanish government have announced their formal withdrawal from the Azores Negotiations. Despite the US' best attempts at placating Spanish demands while safeguarding OFN interests in Portugal, Madrid has proven an obstacle to any perceived encroachment within their sphere of influence.\n\nAs of yesterday, Spanish military forces have withdrawn from Occupied Portugal, beginning the process of establishing a provisional government with Spanish supervision. The Portuguese interior is still under reconstruction after the invasion, with low domestic support for the provisional government or their allies in Madrid.\n\nSo far, no inroads have been made regarding the OFN backed administration in the Azores/Madeira have been made by the Spanish leadership, but we have little reason to believe that relations will remain cordial for long so long as a rival Portuguese government in the south Atlantic continues to exist.\n\nWe advise the Office of the Presidency to consider every option at its' disposal; Joint US/OFN forces in the south Atlantic remain on standby, as do the necessary naval assets to support the Portuguese Confederation in a land invasion of mainland Portugal should conflict break out with Spanish-aligned government in Lisbon.\n\nWe are certain that whatever course of action you commit to will be the correct one in preserving the interests of both the United States of America and her OFN commitments.\n\nYours sincerely,\nThe United States Department of State."
iberiawars_OFN_SPA.26.a:0 "People have argued for years that putting up with Franco was a bad idea, maybe time is finally proving them right."

iberiawars_OFN_SPA.27.t:0 "Portugal Returns!"
iberiawars_OFN_SPA.27.desc:0 "The press conference was like so many others had been in the past. Loud, bombastic, full of smug-looking bureaucrats - and inescapable, on every channel of note. As the citizens of the State watched it over dinner, the announcements were made clear.\n\nAn agreement had been reached between Spain and Portugal, as represented by the Americans. Spain was to withdraw from Portuguese territory, and allow the Confederation to return and assume sovereignty over Portugal itself. Instructions had already been issued to the ministries and to military command, and it was expected that the withdrawal would begin shortly.\n\nThe spokesman was clear that Spain was to benefit from this agreement, economically and otherwise. Some more astute viewers, however, quickly noticed that despite his attestation that concessions were reasonable and minor in comparison to the gains made, he was careful not to detail them.\n\nThat would no doubt come in time. Those watching were torn. Many welcomed back their former Iberian brothers and sisters to the peninsula, others were cautiously optimistic over the 'benefits' that were supposedly to come. Others wondered what had been conceded. But all agreed that Spain, even under the Union, never did anything without a goal in mind."
iberiawars_OFN_SPA.27.a:0 "The State has achieved its goals."

iberiawars_OFN_SPA.28.t:0 "Successful Summit with Spain!"
iberiawars_OFN_SPA.28.desc:0 "The State Department has reported that the negotiations with Spain over the status of the Portuguese Confederation and its territory in Iberia proper have been successful.\n\nThe Spanish have agreed to allow the Confederation to return and assume full political control over Portuguese territory. It is expected that their military and civilian assets will begin the process of withdrawal imminently. This should be seen for the significant win that it is, demonstrating the commitment of the OFN to peaceful resolution of national disputes.\n\nThis victory is not without cost, however. Concessions were made in order to acquire Spanish agreement, and these will need to be paid in full. Beyond that, Portugal as a whole is still badly damaged from the conflict, and enormous investment will be needed in order to allow for proper reconstruction - investment that the Confederation will surely consider its due.\n\nOf course, however, there is opportunity even in that. Reconstruction will have to be performed by companies capable of doing so, of course. And America has so many of those that would be more than pleased to assist."
iberiawars_OFN_SPA.28.a:0 "A victory for the free world."

iberiawars_OFN_SPA.29.t:0 "Return of the Exiles"
iberiawars_OFN_SPA.29.desc:0 "FROM: Ministry of Foreign Affairs\nTO: The Council of Ministers\nSUBJECT: The Return of the Portuguese Confederation\n\nThe Ministry of Foreign Affairs has received a request from the American Department of State to negotiate the potential return of the OFN-aligned Portuguese Confederation to Spanish-occupied lands in Portugal.\n\n- The islands are under the control of the illegitimate Portuguese Confederation after their failure to seize control of Portugal during the Portuguese Civil War.\n- The Portuguese Confederation is a pro-OFN organization, with lobbies in OFN member states such as Brazil. Should the Confederation ever take power in Lisbon, it will turn Portugal into an important foothold for the OFN in Europe.\n- We will require concessions from the OFN in order to allow the return of the Portuguese Confederation to Lisbon.\n- Should we fail to negotiate with the OFN, they may prefer to deal with the Confederation without us. From the islands, the Confederation may be able to launch an invasion of Portugal if sufficiently trained and equipped.\n\nWe recommend engagement with the Americans on this issue."
iberiawars_OFN_SPA.29.a:0 "Agreed. Let's see where this gets us."
iberiawars_OFN_SPA.29.b:0 "Declined. We don't want to negotiate."

iberiawars_OFN_SPA.30.t:0 "Return of the Exiles"
iberiawars_OFN_SPA.30.desc:0 "FROM: Ministry of Foreign Affairs\nTO: The Council of Ministers\nSUBJECT: The Return of the Portuguese Confederation\n\nThe Ministry of Foreign Affairs has received a message from the American Department of State regarding the return of the OFN-aligned Portuguese Confederation to Lisbon.\n\n- The Portuguese Confederation had been exiled to the archipelagos of Azores and Madeira after their failure to seize control of Portugal during the Portuguese Civil War.\n- The Portuguese Confederation is a pro-OFN organization, with lobbies in OFN member states such as Brazil.\n- A longstanding objective of the Portuguese Confederation was to return to Portugal and establish Republican rule in Lisbon.\n- Due to friendly relations with the OFN and Portuguese Confederation, we have voluntarily returned our occupied Portuguese lands to the Portuguese Confederation.\n- All exiles in the Portuguese Confederation are pardoned and welcome to return to Iberia safely without fear of repression.\n\nThe State Department and Portuguese Ministry of Foreign Affairs express their deepest gratitude to the Iberian Council of Ministers."
iberiawars_OFN_SPA.30.a:0 "Welcome home at last."

