 iberiawars.1.t:0 "The Basque Republic Declares Independence"
 iberiawars.1.d:0 "It's no secret that the Iberian Union has been riddled with conflict in recent times. Since its inception, the Union has been a shaky alliance fraught with over-bloated bureaucracy, conflicts of interests between its member states, and insurgents at every corner. Yet, even with such glaring flaws, the Union had managed to stagger on for many years after its formation.\n\nHowever, recently the Union has seen a decline. Instability grows, popular discontent rises, and insurgent groups have become increasingly emboldened in their attempts to supplant the weak government's rule with their own; And today, one of those attempts was successful.\n\nThe strike was swift. What was reported to be small groups of mere dozens of radicals became hundreds, then thousands, then tens of thousands. Soon the meager garrisons and police forces had been overrun, and nearly the whole of the Basque Country stood under the control of triumphant revolutionaries, eager to defend their independence.\n\nWith the declaration of an independent Basque Country, the Iberian government has been thrown into utter chaos. Initial attempts to contain the uprising have thus far failed, and without an organized military response soon, a catastrophe will surely be at hand. The fate of the Union lies in the balance, and only time will tell how this conflict is resolved..."
 iberiawars.1.a:0 "Viva Iberia!"
 iberiawars.1.b:0 "Gora Euskadi!"

 iberiawars.2.t:0 "Fairweather Friends"
 iberiawars.2.d:0 "Despite being half empty, the meeting room was filled with commotion. Franco had summoned the federal cabinet to articulate a response to the Basque crisis, but glancing at the empty seats, he had the distinct feeling that he may have just walked into a much worse one.\n\nCarrero Blanco was the first to present his report and the news was grim. "As of yesterday, numerous Portuguese divisional commanders have explicitly refused to mobilize their forces in response to the emergency in the North. There has been no response from General de Spínola as of yet and, well," he glanced at a nearby empty seat, "I would not expect a positive response any time soon".\n\nFranco scowled towards one of the other empty seats. "What of our colonial forces? It would have been quite useful to have Senhor Alves attending this meeting. Any word from him?"\n\nCarrero blanched slightly. "No, sir. In fact, I've been told that Spanish officers have been denied access to federal military facilities in Cabo Verde, in São Tomé, and in Guiné. This is likely to be a deliberate policy by Minister Alves."\n\nThe frustrated Caudillo put his head between his hands. "And Senhor Caetano is 'regrettably unavailable' to answer for his side of the Union." The empty seat next to Franco was the only response for a few seconds before a junior secretary sheepishly mentioned that there has been no word from the second Caudillo of Iberia for more than a day now. The silence hung for a moment more.\n\nThe meeting was adjourned soon after. Reports were read, new problems described, and no concrete proposals made. With each new problem the gaps left by the Portuguese ministers yawned ever wider, taunting the Spaniards with their absence."
 iberiawars.2.a:0 "After leaving, the entire cabinet could hear Franco screaming at the traitors."
 iberiawars.2.b:0 "In Lisbon, another cabinet meeting was quickly being prepared"
 IBR_Wars_Regional_Play_As_Portugal_tt: "§YPlay as Portugal§!"
 
 iberiawars.3.t:0 "Portugal Abandons the Union"
 iberiawars.3.d:0 "The chronic instability created by the Basque revolt has spread throughout the entire Union, taking root inside the Iberian central government. The many Portuguese officials whose loyalty was always to their national identity and Caudillo Salazar first began to grumble as soon as the first reports of the revolt came in. The final straw was triggered when Salazar abandoned all hope of maintaining the sinking ship. Caudillo Salazar attempted to escape Madrid without much fuss but was quickly put under house arrest in his local residence in the Iberian capital. Only with the support of loyal followers was the old man able to stage a successful nighttime getaway.\n\nA mass exodus of Portuguese government officials and military personnel followed, leaving behind an administrative vacuum that Spanish bureaucrats hurriedly attempted to fill. Lisbon has now become a hotbed of revolutionary fervour. The cries for independence and self governance are resonating all across the Union. Salazar's public broadcasts have rallied the Porutgues people to form militia divisions to fight alongside the national army against Unionist forces."
 iberiawars.3.a:0 "Viva Iberia!"
 iberiawars.3.b:0 "Viva o Estado Novo!"

 iberiawars.4.t:0 "A Crossroads on the Precipice"
 iberiawars.4.d:0 "The cabinet room was once more full, the seats of the government's former Portuguese members hurriedly filled with rapidly promoted junior Spanish officials. As Franco observed the room, he noted that despite the full attendance, this cabinet meeting was not looking to be any less chaotic. If they were going to solve the Basque crisis - and now the Portuguese one, the irritated Caudillo reminded himself - they needed to decide on a course of action. Quickly. Franco summoned as much gravitas as he could. "You know why we have called this meeting. I would like to hear your proposals for the most prudent course of action necessary to save Iberia in her hour of peril."\n\nCarrero Blanco glanced furtively at the room's new occupants. "It is the government's view that this crisis demands the harshest response. We propose the declaration of martial law throughout the Union and the reinforcement of our armed forces with fresh conscripts, as well as with colonial forces. We additionally propose the initiation of offensive maneuvers towards Bilbao and Lisbon, as well as the issuing of a declaration to the rebels that we will only accept their total surrender as an alternative to bloodshed."\n\nFranco nodded, before hearing hushed whispers from a group of freshly-appointed secretaries, sitting around Manuel Fraga, Minister of Information and Tourism and one of the only consistent moderate voices in the cabinet. As the only minister in the group, Fraga pulled out a folder of his own.\n\n"Caudillo, my esteemed colleagues and I would like to offer an alternative suggestion. We believe that the declaration of martial law nation-wide would only stretch our forces further and cause increased tension. We propose only enacting martial law in the regions closest to the rebelling provinces and that the armed forces maintain their defensive positions in these regions for the time being, while negotiations are attempted to solve the crisis without massive losses in lives and property. It is our belief that acting with brute force will only further jeopardise the Union's-""
 iberiawars.4.a:0 ""Enough with this nonsense...", Franco intervened."
 iberiawars.4.b:0 "... Blanco, proceed with your plan."
 iberiawars.4.c:0 "A noble attempt, yet one the reformists knew was doomed from the start"
 IBR_Wars_Regional_Play_As_Nationalists_tt: "§YPlay as the Nationalists§!"
 IBR_Wars_Regional_Play_As_Reformists_tt: "§YPlay as the Reformists§!"

 iberiawars.10.t:0 "La Guerra ha Terminado"
 iberiawars.10.d:0 "Franco stopped pacing around his office, closing the folder provided to him by the AAS and dropping it on the table with a hefty thump. He sat down, now alone in the room, and fidgeted with the stack of papers.\n\nThe report was too long. Too many cities had erupted in furious protests after receiving the news that conscription was to be enacted in response to the Basque crisis. The Guardia Civil appeared to be stretched to its limit. A sigh emerged from deep within Franco's aged chest. How many more times would he have to save Spain from destruction? How many more times will the forces of chaos and revolution try to topple everything he and Salazar have built with the Union? How many more times would the ghosts of the Civil War come back to haunt him?\n\nFranco closed his eyes, trying to shut out a voice in the back of his mind, small but insistent. Perhaps this was Iberia's fate. Perhaps he was too old for this. Perhaps - a small shiver passed through his bones - the war never truly ended. It seemed that no matter how many traitors were arrested, deported, imprisoned, tortured, executed or disappeared, more had always come in their wake to torment Iberia. Each time they were better prepared and more determined. His Union was built on a mountain of sacrifices, growing ever higher, ever less steady as the flood threatened to finally overwhelm them. Was it time?\n\nThe Caudillo opened his eyes and gripped his telephone. His mind drifted momentarily to a spring day in Burgos, to his younger self penning those fateful words. "...The national troops have achieved their last military objectives. The war is over." He shook his head. Those words were as true today as they were then, and no wave of protests by jumped-up university students and communist agitators would change that. He had saved Spain in her darkest hour, then all of Iberia, and crushed those who would see her destroyed. He had won, erecting his own enduring place in history. The War was over."
 iberiawars.10.a:0 ""Send in the troops. Put down the Riots.""

 iberiawars.11.t:0 "Ne Plus Ultra"
 iberiawars.11.d:0 "Carrero Blanco tapped his fingers anxiously, waiting for a response from the other side of the receiver. With all of the instability at home, unrest in the colonies was the last thing the government needed - but it was only a matter of time before the calamity unfolding around him would spread to the rest of the empire too. He could only hope that things did not spiral out of control.\n\nThe other side of the line finally crackled to life. "Señor Carrero Blanco? How can I help you?"\n\nWith a sigh of relief, Carrero Blanco leaned back in his chair. Perhaps all was not yet lost. "Señor Oufkir, it is good to hear from you. Things are tense here in Madrid and we have received reports that the situation in Casablanaca is becoming less stable as well. How well can you hold? Do you believe you could spare some forces as reinforcements back here if necessary?"\n\nThe line crackled quietly for a few seconds, leaving Carrero Blanco to wonder if Oufkir had hung up before a response came. "Well, Señor Blanco... the situation has indeed developed quite rapidly. Casablanca... The King has declared a state of emergency. His forces are currently securing the borders."\n\nCarrero Blanco swallowed hard. He should have known. The King was an ambitious man and Oufkir perhaps even more so. They would have taken the first opportunity to scurry off the sinking ship that Iberia had become. And there was nothing he could do about that.\n\n"If there wasn't anything else you were wanting to ask, Señor Blanco, I must be going...""
 iberiawars.11.a:0 "Just how much worse was this going to get?"
 iberiawars.11.b:0 ""...The Kingdom needs its defense minister.""
 IBR_Wars_Regional_Play_As_Morocco_tt: "Play as the Kingdom of Morocco"

 iberiawars.12.t:0 "Estranged, Afraid"
 iberiawars.12.d:0 "What is left of a man when those he trusts the most abandon him, especially after decades of unquestionable loyalty and fervent service? Such a thing could destroy a man's psyche, to remain confident in oneself after such betrayal is nearly unthinkable. At least, this is what Carmen Polo thought, standing in the dark on the balcony of a private villa in Móstoles. This was as far as her guards would allow her away from Madrid, a scant few kilometers from the city. Her daughter, Carmen Franco, leaned on the marble railing beside her surveying the distant, rolling farmland illuminated by moonlight.\n\n"Father hasn't spoken to either of us lately, has he?" Franco sighed as before a sardonic chuckle escaped her lips. "He might soon forget we exist, given all the chaos he's been dealing with."\n\n"That isn't true," replied her mother. "A great deal is on his mind, but he still cares for us. We are safe here." The silence of the night was deafening as both considered how true that statement was. Carmen Polo frowned. Even she couldn't believe herself.\n\n"The officers won't listen to him anymore. Too busy, perhaps, with regional affairs. Others, however..." Franco's voice wavered, unwilling to finish the thought. Who could be trusted, and who was a separatist? Franco peered at her mother, who shared her uncertain expression. "We aren't safe, mother. At the least, we should consider evacuating our possessions, lest looters have their way with them."\n\nCarmen Polo exhaled slowly, considering her next move. There were trusted contacts in South America who could protect the family's riches, away from the bedlam encroached toward Iberia. Still, what of them? Of herself? Of her daughter? What of her husband, now slipping into the throes of chronic frustration and hopelessness? Carmen Polo finally nodded, looking at her daughter once more."
 iberiawars.12.a:0 ""I'll prepare the evacuation.""

 iberiawars.13.t:0 "Una Lluita"
 iberiawars.13.d:0 ""A mess. It's a goddamn mess; that's what this is." A long drag followed, and Alejandro Rodríguez de Valcárcel flicked the cigarette to the ground and crushed it beneath ink-black shoes. "Who'll tell him? Me? You, perhaps?"\n\nPedro Nieto Antúnez heaved a deep sigh, his gaze nervously dancing across the hallway. Both men stood in a silent meeting room within the Defense Ministry, a nearby window glittering with the evening sunlight across a distant horizon. One could see such a peaceful Madridian vista, beautiful and bright, and surmise that all was well in Spain. No such peace existed. Not now. Pedro feared the coming night might drown whatever peace could exist across Iberia.\n\n"We must..." Pedro paused, collecting his thoughts. "We must remain calm. The Catalonian emergency will pass; such a rebellion is a token compared to the Portuguese. We will scatter them. We must." A tinge of apprehension coated Pedro's final words.\n\n"But how will we tell him? The Caudillo, he is... he is in no state to know. Such heavy burdens already weigh greatly upon him. How could we possibly explain this—"\n\n"I don't know, damn it!" Pedro's barking retort quickly silenced Alejandro, who scowled as his gaze darted to the door. Pedro sighed once more. "Franco will arrive here for the staff officer meeting in..." He swung his arm up, quickly checking his watch. "Thirty minutes." He lowered his arm, his brow furrowing in concentration and acceptance. "I will tell him then. You need to gather whatever trusted men you can still afford. Prepare a public statement."\n\nAlejandro exhaled sharply, shaking his head as he dug into his suit for another cigarette. "None of us will hear the end of this." His mutterings continued ceaselessly as he marched out of the lobby. Pedro peered at the darkening sky outside. "Perhaps we won't," he muttered quietly in return."
 iberiawars.13.a:0 "Spain buckles further..."
 iberiawars.13.b:0 "...And Catalonia shall rise from the heap."
 IBR_Wars_Regional_Play_As_Catalonia_tt: "§YPlay as the Republic of Catalonia§!"

 iberiawars.14.t:0 "Behind the Veranda"
 iberiawars.14.d:0 "The reports were piling up again, stack after stack of intelligence summaries to military officials from every corner of the Union. Down to the letter, they all echoed the same sentiment. Men refused to put down rioters. Officers deserting with whole platoons. The imminent and total collapse of loyalty within the Iberian military.\n\nFrom outside the walls of Franco's office, high above the streets of Madrid, the ever present howling of the protestors outside could be heard, almost operatic in their chorus of profanity as they drowned under a symphony of police sirens and the distant droning of a nearby helicopter. Yet, despite the chaos at the door, Franco felt nothing. Mussolini would have set dogs on them. Hitler perhaps already opened fire. Yet the man whose office was filled with distant shouts felt utterly impotent as he read of his once-loyal men abandoning him in droves.\n\nIt was almost funny, in a perverse way, that Salazar had not lived to see it. He had peace granted him of the anarchy that was soon to follow, the collapse of all he and Franco had worked for. Franco placed down his final report, abandoning the pile as he accepted the truth. He remained to witness it unfold. Weary eyes listlessly wandered as realization came upon him.\n\nThe chaos playing out before him was not unexpected. It was not even particularly shocking. This unrest was merely just another chapter in another era of European statecraft as modernity continued to corrupt the hearts of moral men and women. Men would rage, men would lash out, men would perish. Spain needed not men, but Franco. Franco, who had rescued them from the madness of the socialists before, would respond as needed. Nothing else of note, nothing requiring fanfare. Iberia screamed outside, but only for want of a leader."
 iberiawars.14.a:0 "The Caudillo straightened his tie, indifferent to the droning of the sirens outside."

 iberiawars.15.t:0 "Orderly Withdrawal"
 iberiawars.15.d:0 "Across Jaén, a sunrise blossomed amidst brilliant glimmers of orange and red across a blueish sky. Today, the great riches of the Franco family would soon be evacuated from the town and transported overseas, where these vast treasures would be safe and secure from the chaos that threatened to consume Spain whole. At the gates of a manor on the outskirts of the town, Cristóbal Martínez-Bordiú and Nicolás Franco oversaw the evacuation of several priceless paintings into a fleet of armored vans. Both men watched the working crew enter and leave the house, careful with their possessions as they were stowed away in the cars.\n\nNicolás sighed, rubbing his chin. "To think, these heirlooms represent nearly half a century of influence and power. Now, we are spiriting them away across the ocean. An insult, really."\n\nCristóbal scoffed at this. "Oh, and you'd instead leave them here? To be inevitably looted and destroyed by the unwashed mob?" He folded his arms, shaking his head. "They will be safe in South America, and once Francisco has regained control of Iberia..." Cristóbal smirked before turning to Nicolás. "We'll return them to their rightful home. Here."\n\nNicolás shrugged at this, returning his gaze to the fleet of vans as they began leaving the estate. "What of the reformists, Cristóbal? They say that negotiations are still possible. Perhaps there won't even be a war at all."\n\nCristóbal couldn't help but laugh at this, eliciting a frown from Nicolás. Cristóbal sighed, taking him by the shoulder as he returned to the manor. "If it were up to the reformists, they'd sell off half of Spain and return to the little rocks they live under. There's no honor in their intentions. It's cowardly."\n\nNicolás looked down, nodding at this. "Still, it's yet another war. Is it really worth it?" Cristóbal tutted, now facing Nicolás directly as they stepped up to the wide doors of the manor."
 iberiawars.15.a:0 ""Ideals are the first to die in war, Nicolás. Remember that.""

 iberiawars.16.t:0 "Façade"
 iberiawars.16.d:0 "Sliding the soles of his shoes across the red carpeting beneath him, Francisco Franco Salgado-Araújo nervously sat just outside the meeting room as a nearby secretary clattered away at her typewriter. The racket of the keys barely masked the sharp, momentary shouts of anger from inside the room; evidently, his cousin was not pleased with the recent developments across Iberia. Though, how could he? The peninsula had not seen such disastrous unrest since the Civil War, and Francisco feared that his homeland was spiraling toward a fate not dissimilar to that of the Thirties. No, he thought. He feared it would be worse. Much worse.\n\nSuddenly, the door to the meeting room swung open. An officer left, a forlorn expression plastered across his wrinkled face. "You may enter, sir," nodded the secretary. Francisco rose from his chair and entered, seeing his cousin from across the wide table before him.\n\nFrancisco quickly shot up a salute. "Your Excellency." Franco, beaded with sweat and staring with bloodshot eyes, gestured for him to sit down. Seven other men sat with him, decorated with medals and uneasy amongst themselves. Franco was a disheveled mess, wobbling in his seat as he momentarily scanned the room, sighing deeply.\n\n"I have only been in regular contact with fifteen officers since the Portuguese rebellion." His lips pursed as he narrowed his eyes. "Fifteen, amidst over a hundred staff officers." A raspy chuckle came from Franco before a violent coughing fit took hold of him. Francisco couldn't help but wince; the other officers remained stone-faced. As Franco regained his composure, he sighed once more. "I apologize," he spat out. He cleared his throat before looking at Francisco. "Cousin, are you doing alright by yourself?"\n\nFrancisco frowned, shifting in his seat. "Are you?""
 iberiawars.16.a:0 "Just how long could he keep this up?"

 iberiawars.17.t:0 "To Lose One's Home"
 iberiawars.17.d:0 "For nearly his entire tenure as the undisputed leader of Iberia, Franco had dozens of officers at his disposal, ready to assist him in matters of both state and conflict, whether domestic or international. At least, this was once the case; the chaos consuming Iberia soon began to take a toll upon the staff Franco once relied upon extensively, and the number of individuals who would simply answer a phone call dwindled by the day. It bemused Franco as to why this was the case, though he felt as if he knew the answer as to why they could not—or would not—respond to his calls.\n\nAny thoughts on the matter were quickly interrupted as a knock was heard on the door to Franco's office. "Enter," he spat out. An aide, slightly disheveled, waddled into the office. He wouldn't dare look Franco in the eye, keeping his gaze thoroughly to the ground.\n\n"Your Excellency, I'm afraid..." The aide paused, biting his lip. Franco turned to face him, his interest piquing. "Galician authorities have refused to recognize your authorities over their territories. A broadcast of their declaration of independence was received an hour ago." Another pause. "They seem to have declared a republic—"\n\nSlam. Franco's fist came down hard upon the mahogany desk, quickly silencing the aide. A sharp stillness overtook the room, interrupted only by shaky breaths emanating from the Caudillo. Then, a heavy sigh. "Thank you. You may... you may leave." The aide quickly vacated the office, leaving a forlorn Franco to his own thoughts once more.\n\nGalicia was his home. His childhood in Ferrol, where the air was wet with sea breeze and the rolling countryside lay fields of meadows and farmland, still felt fresh in his memories. All that was gone, now, having slipped from between his fingers. He had failed his people. He had failed his homeland. Franco could only lay his head low, the setting sun bearing upon him as faded sunlight trickled through nearby windows."
 iberiawars.17.a:0 "Franco closed his eyes, yearning for home..."
 iberiawars.17.b:0 "...yet in Galicia, freedom filled the air."
 IBR_Wars_Regional_Play_As_Galician_tt: "§YPlay as the §YGalician Republic§!"

 iberiawars.18.t:0 "Piece by Piece"
 iberiawars.18.d:0 "The once-ostentatious living room had a quaint look, now emptied of every nook and cranny of decor. Gone were the priceless 16th-century paintings and pristine ceremonial swords that adorned the now naked walls. Or the luxurious golden-age furniture, the silver cutlery, and the Moorish-style carpets. Taking a brief peek outside, Carmen Polo saw the men loading the last pieces of the Francos' precious belongings in their armored cars. It was done. Their wealth was safe. She should be feeling relief... yet, her mind was elsewhere. Like the others, her attention was focused on what she was hearing from the device that had been brought in emergency by one of their men.\n\nAs the last words of Torcuato Fernández-Miranda faded in a roar of applause, Nicolás Franco turned off the radio, shutting down the clamors of the sevillanos and plunging the parlor into an uneasy silence. None of the four individuals assembled dared break it: all needed a moment to process what they'd just heard.\n\nSpanish Republic. Those were the words that kept echoing in their heads. It was no longer just a question of secessionists fighting for independence; this time, the rebels were calling for the complete overthrow of the government in Madrid. The reformists had turned their backs on them, joined by some of the more disgruntled officers. And it wasn't only a few malcontents in Seville: the whole southern part of Spain had just slipped from their grasp. Now, more than half of the country was up in arms against them. "I need to see Francisco. Now." blurted Nicolàs, storming past her out of the room, soon tailed by Cristóbal and her daughter, leaving her alone with her thoughts.\n\nFirst the Basque, then the Portuguese, the Catalan, Morocco and Galicia, and now... what did they have left? She took one last look through the window, watching every stripped piece of the manor being carried away. And for a moment, she felt just as naked and vulnerable as the empty walls surrounding her."
 iberiawars.18.a:0 "The ride back to Madrid was just as silent..."
 iberiawars.18.b:0 "...but the clamors in the south grew ever louder."

 iberiawars.19.t:0 "Relieved of Duty"
 iberiawars.19.d:0 "The lights were too bright. Sputtering, harsh fluorescent rays dug into Francisco Franco's vision, threatening to completely obscure the cadre of high-ranking officers before him. His family, estranged and uncertain of their presence here, stood close to him, as did the few government ministers he hadn't lost entirely. They stood awkwardly in the neglected office, tucked away on Madrid's outskirts. The men across the table had commanded he came. He wasn't sure if resignation or duty compelled him to obey.\n\n"Your Excellency," Carlos Iniesta Cano bowed slightly. His closely ranked circle of confidants soon followed. The family took their seats along a makeshift round-table, Franco and Cano opposing each other as they stared daggers. "As you may have observed, continued civilian governance over Iberia has become untenable. Iberia now faces threats that are far too numerous and far too organized for standard authorities to apply." Franco's lips pursed. He knew what was coming. He had suspected it from Cano the moment of the Sevilla Proclamation.\n\nCano folded his hands, his posture straight and his gaze unbroken. "As such, I must relieve the Iberian Federal Government of its duties, to be replaced with a provisional military administration, effective immediately." Cano turned to a guard, nodding. The guard banged on the room door and a squad of armed men entered. "I have already taken the liberty of organizing your family's safe evacuation from the continent and a plane awaits your departure near Villanubla."\n\nFranco gave a curt, halfhearted nod, and Cano rose from his seat, as did his accompanying officers. "Safe travels, my Caudillo." As the officers trickled out of the room, Carmen placed a hand on his shoulder, massaging it gently. Franco's mouth opened, yet no words escaped, until a whispered mutter came from him as he met Carmen's eyes."
 iberiawars.19.a:0 ""I have failed.""

 iberiawars.20.t:0 "Don't Worry, Darling"
 iberiawars.20.d:0 "The wind whipped through Carmen's hair as she stared into the distance, flanked by guards as they chattered incessantly. There was always too much noise, she thought. She wanted to escape from it all — the disorder, the riots, the constant blaring of a doom that threatened to overwhelm them all. The pain and sorrow of what was to come weighed her down like concrete, though her thoughts were quickly broken by a soldier taking her by the shoulder. "Señora, the plane is ready. We must leave." She remained still for a moment, yet quickly nodded.\n\nCarmen turned to see Franco, his gaze frozen to the grassy dirt beneath him, before moving to comfort his husband."Come, my love," Carmen took Franco by the hand, attempting a facile smile. "Once we're out of the country, everything will be alright for us. Our wealth, our belongings... I've been told they're all safe and secure. Carrero's already left, and—"\n\n"What will happen to my country?" Franco's voice was tinged with bitterness as he kept his eyes on the ground. Carmen massaged his hand in comfort. "Once again, she has found herself in the throes of death, and..." His frown deepened, as did Carmen's own. "I am fleeing. Like a coward."\n\n"You are no coward," pleaded Carmen. "You will return. We will return. This is our home, no matter what." Franco finally met Carmen's eyes, a faded smile soon forming. "The legacy we built is stronger than all of this. What you built will last."\n\nFranco cleared his throat, attempting to stand straight as he looked to face the airplane. An aide approached the couple, signaling them to board. Franco looked back to Carmen, nodding silently. The two smiled tiredly, marching to board the foreairstairs of the plane. Before entering the cabin, Carmen paused at the crack of an explosion in the distance. She couldn't bear to turn and face it, soon disappearing into the airplane entirely."
 iberiawars.20.a:0 "Spain will endure. It must."

 iberiawars.21.t:0 "Communist Insurgency in Asturias Escalates"
 iberiawars.21.d:0 "-CONFIDENTIAL-\n\nFor the past several weeks, a series of sabotage operations and raids on weapon caches has been reported throughout Asturias (see p. 15-22). While behind-the-lines sabotage operations have been organized by many of the separatist forces, they have usually been pacified within a reasonable timeframe and reduced to isolated cases committed by lone actors or small, isolated cells.\n\nIn this case, it has become clear that the Asturias operation was conducted by a large, organized, and cohesive force. Garrison troops were delayed in their response to raids on weapon caches by bridge and railway sabotage, clearly coordinated by the enemy in advance. With much of the military diverted to the frontlines, requests for further assistance had been deferred or outright denied (pp. 23-26).\n\nDuring the last few days, the situation has clearly reached a critical juncture. Large, disciplined columns have moved into the open, seizing towns and critical roadways and infrastructure. Propaganda leaflets and radio messages by the insurgents have sufficed to ascertain their clear socialistic and communistic ideological leanings. With troops in the region demoralized, outnumbered, and growing increasingly isolated, the commanders of the 17th and 22th Reserve Divisions have made the decision to pull their forces back and to consolidate beyond the borders of the most affected region.\n\nWith army forces withdrawn from the region, it appears that the insurgents have already proclaimed a new "workers' government" and that they are actively preparing to conduct further hostile operations against our forces in order to secure their newfound independence. It is highly recommended that all available troops be diverted to Asturias in order to dismantle their regime before it has the chance to entrench itself."
 iberiawars.21.a:0 "We will drive these cockroaches back to their holes."
 iberiawars.21.b:0 "Arise, you prisoners of want!"

 iberiawars.22.t:2 "Meet the New Boss"
 iberiawars.22.d:2 "Ane pushed her food cart through the chilly Bilbao morning, preparing for the mass of workers to make their way towards the steel factories. The precariously balanced coffee pot and foodstuffs were accompanied by her new transistor radio, bought by Ane's daughter for her birthday to lighten up her long days at the stall. Arriving at her usual spot, Ane began setting up her coffee pot and stove, humming along with the music.\n\nSuddenly, a wave of static distorted the song, much to Ane's annoyance. She tried fiddling with it, but the gray-haired vendor had never really understood how the machine worked, and soon gave up. The crackle of static was now all she could hear, until words began to coalesce from the noise.\n\n"...Council of Government. Repeat, this is José María Eskubi, speaker of the Council of Government. This is a special announcement to all citizens of the Basque Country." Ane perked up, but continued setting up her stall.\n\n"The previous government of the Basque Country has failed at defending the freedom of the Basque people from the dangers around us. For this reason, patriots have been forced to take matters into their own hands and ensure that the flame of our freedom is not extinguished. As of today, the Council of Government has been reconstituted according to the principle of maintenance of independence at all costs. All previous government members belonging to the EAJ have been relegated from their functions due to their gross negligence in exercising those functions. They have already been replaced by members of the new Council, who are sworn to uphold our principles. This is our duty to you, and to our country. Freedom or death!"\n\nAne began serving the first workers who had come for her coffee when the music thankfully returned. Governments come and go, but she had more important business to attend to."
 iberiawars.22.a:2 ""So, what was this Eskubi guy on about?""

 iberiawars.23.t:3 "The Pain of Brotherhood"
 iberiawars.23.d:3 "The door burst open without warning. An aide, pale, stumbled to Tarradellas's desk, a stack of reports in her hands. "Mister President, we have an emergency. We have not been able to contact some of our garrisons from the interior, and those we could contact are currently under attack."\n\n"By who?" The President of the Generalitat demanded. He caught one of the reports flying off from his aide's stack. "Is it the Spanish? We shouldn't have trusted them in the first place!"\n\n"No, sir." The aide cut him off. "They're calling themselves the Catalan People's Army. Militias. Workers. Deserters. They're advancing quickly without much opposition."\n\nTarradellas's eyes widened. It wasn't the Spanish People's Army. It wasn't the Portuguese People's Army. Catalan. It was the same Catalan whom he fought for all these years who threatened to march on Barcelona.\n\nHe remembered his 30s so vividly. The hope of a republic. The surge of unity coursing through the veins of the Spanish Republic. But the May Days — that disparaging churning of his stomach when he heard the firing of guns within Barcelona's streets. That tingling in his chest as he looked outside to see brother killing brother. He felt that same churning, that same agonizing tingling in the chest, hearing the Catalan People's Army.\n\nIt would not be the Spaniard who brought down Catalonia. It would be the Catalan. The Catalan who could not see eye-to-eye with his fellow countryman. The Catalan who believed in the same rotten ideas of those who had betrayed the Republic in 1937. The Catalan who was willing to shoot, pillage, and kill their people over frivolous ideology.\n\nA united Catalonia, unfortunately, needed some Catalans dead."
 iberiawars.23.a:3 "¡Alza la bandera revolucionaria!"
 iberiawars.23.b:3 "There can be no Catalan unity while the CPA exists."

 iberiawars.24.t:0 "Breaking Point"
 iberiawars.24.d:0 "Now interrupting your broadcast - an urgent message from Plácido Fernández Viagas, member of the Interprovincial Council of Andalusia.\n\n"I come to address you on the topic of the strife which has ravaged our lands. For months, generals of the Republic have thrown Andalusian men into the meat grinder of the front lines, gaining mere inches for each life lost. Andalusian households have gone hungry as food is diverted to the front, and Andalusian voices have been ignored as the government takes more and more. What have we received in return? Nothing. We have been the backbone of the war efforts for too long, and we will not take any more exploitation.\n\n"As such, the eight provincial deputations have voted with unanimity to no longer support the war effort of the Spanish Republic, and remain neutral in the Iberian Wars. Andalusian men will return home, and Andalusian factories will reorient domestically. To all factions on the peninsula, we would like to extend a message of peace - we do not wish for war, and will gladly cooperate with any government who wishes the same. Yet above all else, our priority is to ensure that Andalusia is never mistreated again. Thank you for your attention.\n\nHundreds of miles away from Sevilla, and just a few miles away from the pounding artillery of the front lines, a squad of soldiers huddled around a radio, listening in shock. One by one, their eyes turned to the youngest soldier in the group - a 19-year-old boy from Murcia, who stood frozen in place. An impossible decision stood before him - the movement he gave his life to on one end, and the world he left behind to join it on the other.\n\nThe boy steadied his breath, and made his choice."
 iberiawars.24.a:0 "He gave his comrades a weak grin, and switched the radio off."
 iberiawars.24.b:0 "His rifle fell to his feet, and without a word, he began the long walk back home."

 iberiawars.25.t:0 "Faith Through Strength"
 iberiawars.25.d:0 "The city held its breath as tanks rolled across the Dom Luís I Bridge.\n\nAs soldiers marched in formation down the Avenida da Boavista, the city watched.\n\nAs the TVs and radios declared the emergency, Porto realised there was no going back.\n\nPosters were displayed upon walls and trucks drove with speakers upon their rears. The news would be inescapable, there would be no ignorance of the new situation. Portugal itself depending on it, that was the message enforced on every street and checkpoint.\n\n"Porto, the enemies of Portugal persist! The Kingdom lies in continued peril as fear and inadequacy have ruled the hands of those entrusted to return our nation to its peace." The voice of General Kaúlza de Arriaga boomed from every possible place it could, seemingly occupying a stranglehold grip upon broadcasting. On TV screens they watched him, still as a statue behind a podium adorned with the King's colors, denouncing the men he had sworn to defend only yesterday.\n\n"To all across the nation, I give you my earnest promise. Now, myself and men who hold my complete trust guide our destiny. We serve the King, and we shall ensure his realm has its civility restored through any measures necessary. When you see the soldiers upon your streets, take heart. When you hear of my new appointments, give them your faith.""
 iberiawars.25.a:0 ""If you consider frustrating our efforts through arms or rhetoric, realise your folly and cease.""

 iberiawars.26.t:0 "The Southern Break"
 iberiawars.26.d:0 "Sitting around the meeting table, Humberto Delgado could find no trace of comfort in any of the generals sitting before him. Dour and dark, stained with frustration and effort, none of them met the eyes of his. Absorbed in reports, looking anywhere else, broken hope's miasma hung over the room.\n\nDelgardo read the report titles again, a dozen distributed before him with titles impossible to misunderstand. Attacks on Southern military encampments, many training or medical, by communist forces. "There can be no mistake? This isn't rogue radicals or a misunderstanding or -"\n\nSilence was his answer, a terrible and deep silence. He swallowed, leaning back in his chair. It was some time before one of the generals raised his voice, daring to pierce the haunting quiet.\n\n"Sir, the communists were supportive of our efforts thus far in the war, it may be possible that their opposition may not be universal."\n\nFor a moment no one replied, before the officer beside Delgardo crushed the idea. "The Algarve and Alentejo regions are in open revolt. The communists have formed a popular front; that means virtually all of them. Any communist in our territory is an enemy in waiting, while their friends press us from the South and their enemies press us from the North."\n\nOne of the generals watched the scene with sympathy, but privately mulled his own options. His sister was in the Algarve, and he had worked with the communists sometimes in the war thus far. He had some good connections - if there was ever a time to leave it was now. Stay true to the Republic, or risk disgrace with the communists? Anchor himself to a potentially sinking ship, or give himself and Portugal a fresh start?"
 iberiawars.26.a:0 "The Republic will stand so long as good men stand by it; he decided to stay at his post."
 iberiawars.26.b:0 "The right choices require the most difficult decisions; he decided to abscond south."

 iberiawars.27.t:0 "Newsstands of Spain"
 iberiawars.27.d:0 "A newsstand in Valladolid. "National Junta overthrown... Yesterday afternoon, officers of the Falange overthrew the Junta, capturing the traitorous Carlos Cano and his ilk... The new government has promised to revive the Falangist revolution, and work closely with our European brothers in Germania..."\n\nA newsstand in Zaragoza. "Kingdom proclaimed in Northwest Spain... After the betrayal of the Junta by the Falangists, Monarchist officers have revolted... José María Valiente Soriano has been chosen as acting regent of the Carlist dynasty until the end of the war... All loyal Spaniards are urged to join the fight for God, Fatherland, and King..."\n\nA newsstand in Sevilla. "Spanish National Junta collapses... After months of infighting, the reactionary government in the north has split in two, between the German-puppeted Spanish National Council and the archaic Kingdom of Spain... Both regimes have declared themselves the one legitimate government of Spain, and fighting has already been reported between the two sides..."\n\n"
 iberiawars.27.a:0 "The Falangists in the northeast retain much of the strength of the old government..."
 iberiawars.27.b:0 "Yet the Kingdom has promised not to go down without a fight."

 iberiawars.28.t: "Report from the Councilor of Defense"
 iberiawars.28.d: "[getdate]\nTopic: Alliance with other regional governments\n\nOver the past few months, the political situation in Spain has deteriorated. Actors in the region have become increasingly hostile towards our government, threatening to rob us of our newly gained independence. Outmatched and outgunned, we stand no chance in the case of a Spanish reinvasion.\n\nHowever, we are not alone in our situation. Separatists and rebels in other regions have successfully broken away from Spain as well, and share the same fear of a potential reinvasion. Due to this, the military high commands of the various breakaway states have been in contact, discussing coordination in the increasingly likely scenario of a war with Spain.\n\nRecently, all parties involved have agreed that the time is ripe to take pre-emptive action against Spain in order to prevent a counterattack and ensure our continued independence. The decision ultimately lies with you, but we advise taking action as soon as possible - Spain will only grow stronger the more we wait.\n\n"
 iberiawars.28.a: "United we stand, divided we fall."

 iberiawars.30.t:0 "Que Non Escampara"
 iberiawars.30.d:0 "A constant drizzle pattered down on the Spanish troops assembling in Ponferrada. The stone towers of the Templar Castle looming above provided scant protection from the shifting wind and immiserating droplets.\n\nTheir sergeant looked over the dripping brows and homesick eyes and spat, "And this is the army that conquered Spain?" The only response was the "plip, plip, plip" of rain on stone.\n\n"No, it damn well isn't!" the sergeant roared, "You bastards thought you were done? Galicia-" a finger jabbed west, "is in the hands of the Portuguese. First they betrayed the Union, and then they grab whatever land and women they like while we're fighting for our lives. You lazy sons-of-bitches would let them take it without drawing a gun? They'd be halfway to Madrid by now if you lot had any say!"\n\nHe walked up to a nonplussed soldier, thrusting his hand within a millimeter of the unfortunate man's face, "War's not done until I say it's done, Private Sánchez. Otherwise tugas would be overrunning Badajoz, lugging away your rusted-up motorbike and cow. They'd leave your woman, of course, on account of her being uglier than both."\n\nBefore Sánchez could respond, the sergeant was moving on to Private Serrano Ortiz. "I thought, after marching across most of the Peninsula, you'd learn how to tie your damn boots!" A quick glance down confirmed the offending lace, sodden with water, had indeed come undone. "Now I know how an imbecile survived this long, by spending the War face-down in the mud. Get it fucking fixed Serrano - or the only action you'll see is with a Galician cowpat and my tied boot up your ass!"\n\nAnd so the sergeant paraded on, prodding and assailing, until this miserable little band was praying that the order to march west arrived from HQ. At least it would get them out of here."
 iberiawars.30.a:0 "Only when truly angry did the sergeant's Gallego accent creep in."

 iberiawars.31.t: "Eleven Stars over Andalusia"
 iberiawars.31.d: "It was a good photo; that, Pío Cabanillas couldn't deny.\n\nThe clashing of the protestors and police, suspended perfectly in time. The Córdoba streets, supposedly so far from the war, with burnt draft cards and protest signs strewn on the ground. Shattered windows and barricaded shops, signifying the collapse of order in the city. And at the center of the chaos, a young man waving an Andalusian flag, his hair waving in the wind and eyes wild.\n\nHe would be more appreciative of the photography skills on display if it hadn't been plastered on the front of every newspaper in Spain.\n\nThe riots in Córdoba had sent ripples across the nation, their impact second only to the war itself. Andalusian politicians had grown more and more resistant, threatening to turn off support for the war or even secede entirely. Young activists discussed the resurrection of the Andalusian national identity, with the unnamed boy serving as a symbol of their movement. And in the cities of Spain that had previously been the center of war efforts, dozens of Córdoba bloomed.\n\nCabanillas threw the boy's photo to the side and put his head in his hands. He had ordered the police to prepare for the protests, but with most resources devoted to the front lines, there was little they could do. The peace had been kept for so long, but Spain was fraying at the seams. If the war didn't end soon, the republic tearing itself apart seemed to not be a matter of if, but when.\n\n"
 iberiawars.31.a: "They were running out of time."

 iberiawars.32.t: "Unthinkable"
 iberiawars.32.d: "TOP SECRET\nEYES ONLY\nTO AUTHORIZED MEMBERS OF THE REICHSNACHRICHTENDIENST\nUNTERNEHMEN BACALHAU\n\nIberia - Unrecognized - Recently unified under socialist occupation\n\nFollowing the collapse of organized resistance to the so-called Portuguese People's Republic's invasion of Spain, and the subsequent reunification of Iberia, assessments have been carried out regarding the possibility of regime change.\n\nSources within the nation have highlighted a weak military, worn down by two large, consecutive campaigns, while trying to professionalize. The economy is virtually nonexistent for the moment, suffering from both the destruction of the Iberian Wars as well as the immediate effects of the mass socialist reorganizations occurring. Politically, they are divided. The populace broadly lacks strong support for the government, apathy being widely reported, while leadership remains torn between competing factions.\n\nConsidering these elements, a military solution is recommended to return proper governance to the peninsula. A delay would give Iberia precious time to stabilize, by which time firm measures may be much more costly.\n\nMAY GERMANY BE IN SAFE HANDS."
 iberiawars.32.a: "The plague of socialism cannot return to Europe"

 iberiawars.100.t: "The Gates of South America Reopened"
 iberiawars.100.d: "Report on Colombian Realignment\n\nContext: Colombia's recovery from their civil war, began in 1954 and recently concluded, stalled following the dissolution of their key trade partner, the Iberian Union. Multiple nascent manufacturing operations have declared bankruptcy following the sudden withdrawal of Spanish and Portuguese capital. Additionally, the dominant agricultural sector experienced a sharp downturn as the flow of Iberian shipping, pesticides, and fertilizers ceased.\n\nEconomic Impact: In response, Colombia has pursued expanded commercial ties with our market. Shuttered industrial facilities have been temporarily nationalized, with shares then sold to our investors at favorable prices. In return, Colombian economists have hurriedly adapted an existing investment plan from Iberia's economy to our own, and our major importers are gladly purchasing Colombian inventories, especially of coffee, which should help spur a recovery. In all likelihood, these business relationships will become permanent.\n\nPolitical Impact: Relations with Colombia have markedly warmed, with Bogotá doubling the size of its diplomatic staff pending a physical expansion of their embassy. While no formal changes are expected this year, deeper alignment into our alliance structure is possible. This would be of global significance, given the strategic importance of Colombia's large Atlantic and Pacific-facing ports.\n\nAdditional Note: The instability resulting from the end of Iberian commerce and influence in Colombia is likely to be replicated in similarly reliant countries. There is a high probability Colombia is merely the first domino."
 iberiawars.100.USA: "FIDELITY, BRAVERY, INTEGRITY."
 iberiawars.100.BRA: "ORDEM E PROGRESSO"
 iberiawars.100.GER: "MAY GERMANY BE IN SAFE HANDS"
 iberiawars.100.ITA: "All roads lead to Rome."


 iberiawars.101.t: "Rerouting the Tankers"
 iberiawars.101.d: "Report on Venezuelan Realignment\n\nContext: Venezuela has seen severe instability since the fall of the Pérez Jiménez military regime in 1958. Naval Commander Wolfgang Larrazábal was unable to consolidate Venezuela's nascent democracy, and his successor was swiftly couped by General Castro León. But ill health plagued the General, and the developmentalist leaders that followed faced significant popular unrest and a communist insurgency. To address these threats, the regime aligned itself with the Iberian Union, which offered markets and limited development and military assistance.\n\nThe collapse of the Iberian Union has increased pressure on Venezuela's government and inspired its growing leftist guerilla movement, leading Caracas to seek a new foreign patron. Based on recent diplomatic communiques and commercial exchanges, our country is their preferred choice.\n\nEconomic Impact: The primary effect is expected to be heightened access to plentiful, inexpensive Venezuelan oil, though Venezuela's growing internal market will also provide a new source of demand for our manufacturers' consumer goods.\n\nPolitical Impact: Our replacement of Iberia's role represents another rebuke to the OFN, which lost influence in the country following Castro León's coup. Given the country's strategic position in the Caribbean and territorial claims on Guyana, tensions with the OFN are anticipated to escalate. While Venezuela is not currently seeking to formalize our relationship, any future attempts to do so should be managed carefully to avoid an untimely provocation of the U.S.\n\nAdditional Note: Further impacts of Iberia's dissolution are anticipated both in Venezuela and around the globe."

 #iberiawars.3.t:0 "Chaos in Guinea"
 #iberiawars.3.d:0 "The fight for independence has proven to be a strong rallying factor for the Portuguese both in the Iberian Peninsula and further abroad. Troops stationed in former Portugal colonies such as Cabo Verde and Guinea-Bissau have also rejected the mantle of Iberian unity in favour of fighting for their old homeland. The regions are now under firm control with Unionist forces yet still unable to recapture them successfully. The former Portuguese empire is enjoying a resurgence despite the instability caused by the Iberian civil war\n\nOne exception, São Tomé y Príncipe, where local forces felt compelled to fight the war on the frontlines instead of acting as a glorified garrison, has seen resistance to the re-establishment of Portuguese imperial control. Their abandonment of the colony has allowed native resistance cells to act more freely. The situation has given the PAIGC independence movement renewed strength in their previously futile mission. With their leaders sensing the opportunity as good as any to return from exile a bitter guerilla war has begun to be waged."
 #iberiawars.3.a:0 "This isn't good."
 
 #iberiawars.4.t:0 "PAIGC Takes Over Guinea!" 
 #iberiawars.4.d:0 "With the abandonment of São Tomé y Príncipe by Portuguese military forces, the PAIGC have gained a strong foothold in the region. The expanding harsh guerilla campaign fought by the rebels has incentivized the Portuguese government to take action and also withdraw forces from Cabo Verde and Guinea-Bissau. To keep up the occupation would have required continuous resupply and troop reinforcement, something the newly independent country could not afford in its battle for survival on the Peninsula.\n\nSoon after their withdrawal the PAIGC militias entered Bisáu and Praia unopposed, seizing all important administrative and military buildings. It was not long before the rebels seized the initiative and broadcasted their supposed victory over the European colonizers, calling for all patriotic freedom fighters to celebrate their newfound independence. The loss has greatly damaged our prestige even if it was seen as a necessary move by most observers. Unfortunately some in the armed forces did not share this view and have heavily criticized the decision as an act of cowardice. This faction led by general Kaúlza de Arriaga has called for regaining the colonies at the first opportune moment. They have found support and allies in the north of our nation which is known to be a conservative hotbed. Far more worryingly some towns in the region have begun to plead alignment to a movement calling itself the 'Government of National Salvation' which seems to be acting as a direct challenger for authority in Portugal."
 #iberiawars.4.a:0 "Disaster!" 

 #A_SPRING.1.t:0 "Orungu Conquers Equatorial Guinea!"
 #A_SPRING.1.d:0 "With the ever deteriorating situation on the Peninsula we have been forced to call upon all armed forces still loyal to the Union to fight on the front lines against the traitors. This has meant not just mobilising a large portion of the population but also recalling colonial garrisons.\n\nThe most experienced and willing soldiers in the Iberian holding of Equatorial Guinea have also been transported back to Europe, leaving only a meager unit to guard the colony. With the abandonment however came heightened tensions between the local population and the Iberian administration. It was not long before Orungu troops, who had offered their support to the independence revolt which had been brewing ever since Portugal had seceded, entered the region and quickly forced the remaining colonial soldiers to retreat. Sensing that the situation was beyond repairable the Iberian mission completely abandoned Equatorial Guinea in favour of attempting to salvage the situation on the homefront."
 #A_SPRING.1.a:0 "This isn't good."
 #
 #A_SPRING.2.t:0 "São Tomé Declares Independence!"
 #A_SPRING.2.d:0 "In recent days the number of colonial disasters, which had been given life by the chronic instability on the Iberian Peninsula, drastically increased. Nearly all holdings which still swore allegiance to the Union were seeing increased tensions with natives and calls for independence.\n\nThe São Tomé garrison had made it their calling to return to Iberia and fight for the sake of the dying dream. This however had allowed the opportunity for the freedom fighters which had previously been successfully suppressed to finally rise against those who they declared to be their oppressors. Under the name of the São Tomé and Príncipe Liberation Movement or MLSTP for short the various native groups have come together and forced the remaining Iberian garrisons to surrender without much of a violent confrontation. The guerillas then promptly entered the regional capital and to a jubilant civilian population publicly declared total independence from the Iberian Union."
 #A_SPRING.2.a:0 "A less than ideal situation."
 #
 #iberiawars.5.t:0 "Arriaga's Failed Coup" 
 #iberiawars.5.d:0 "Under the cover of darkness, a lone old military truck joined the convoys and the persistent businessmen on the long highway to Lisbon. Neither seeking profit in the late hours nor making its way to the front, it drove into the Portuguese capital with a single purpose.\n\nFollowing the unfortunate but necessary evacuation of Guinea in order to not get pushed into a protracted colonial conflict and to reinforce the Iberian front with hardened garrison soldiers, a military clique of disgruntled officers had formed. Under the leadership of Kaúlza de Arriaga the cabal was able to influence a number of towns in the north of the country to support the legitimacy of a new administration, the Government of National Salvation. Its mission was to wipe the stain of abandoning the Portuguese imperial holdings from the national consciousness, ensuring that every soldier and citizen could stand side by side pridefully to fight for a strong country. Loyalists to our regime have leaked plans of the clique to attempt to use their newfound support to successfully carry out a putsch. We also know exactly when they plan to execute their mission.\n\nThe driver gasped in surprise and turned quickly to his passengers. Pointing ahead to the side of the road all could see the two tanks and a large number of military personnel checking each lone passerby. With an angry grumble a man at the back of the truck waved for the driver to turn around. 'Let them have it this way,' he thought. 'Portugal and its soul could have been saved with minimal bloodshed.'"
 #iberiawars.5.a:0 "Traitors!" 
 #iberiawars.5.b:0 "We shall save the nation!"

 #iberiawars.6.t:0 "Admiral Fernando Seizes Gibraltar!" 
 #iberiawars.6.d:0 "Captains sailing the Mediterranean were shocked when they heard that there is now a "security tax" levied on ships passing through the Atlantropa Dam. Fernando de Quintanilha e Mendonça Dias, the Iberian Admiral in charge of the Mediterranean has gone rogue and seized the Dam with his men, justifying his action as the only way of guaranteeing the safety of the Mediterranean Dam and avoiding disaster.\n\nAs soon as he took control of Gibraltar, Fernando started extorting ships in the region, a heavy blow to our naval presence. In addition, the loss of this critical territory has crippled Iberia's foothold in the south, greatly damaging our ability to hold on to Andalusia and Morocco. Besides the charging of fees, rumor has it Admiral Fernando has plans to hold an auction to sell the Dam to the highest bidder!"
 #iberiawars.6.a:0 "Treason!"
 #iberiawars.6.b:0 "We are the protectors of the dam!"

 #iberiawars.7.t:0 "Morocco Demands Freedom"
 #iberiawars.7.d:0 "Amidst the chaos arising in Iberia proper, our African colonies have been bursting at the seams with opportunistic revolutionaries. Many are calling for the so-called "liberation" of what they perceive as their rightful lands. No doubt, their true goal is to destroy everything we've spent decades building and return to their former barbarous ways.\n\nHowever, many of the more sane amongst them still recognize that a full and immediate break from our influence may prove detrimental to their weak, fledgling state. Indeed, without our control, they may lack the necessary defences to resist other foreign powers. Few want to escape from the frying pan should it mean landing in the fire.\n\nUnderstanding this, Hassan II of Morocco has given us an offer: recognize Morocco's independence and gain an ally, or refuse recognition and remain alone against the revolutionary onslaught.\n\nShould we recognize Morocco, we would gain an immediate ally and prevent the opening of yet another front in this already straining war. However, it is unlikely that this alliance would last long past this conflict's resolution, meaning we'd be deprived of direct access to the nation's industry and resources going forward.\n\nEven still, a war with Morocco would be unwinnable in our current state. Our ability to reconquer the traitorous Moroccan state would hinge entirely on our ability to win the ongoing conflict in Iberia proper, which would be much easier with aid from Morocco.\n\nUltimately, after much deliberation, we've concluded that..."
 #iberiawars.7.a:0 "Give it to them so they cooperate (Play as Iberia)"
 #iberiawars.7.b:0 "Give it to them so they cooperate (Play as Morocco)" 
 
 #iberiawars.8.t:0 "Trarza Invades!" 
 #iberiawars.8.d:0 "The Iberian instability has left a terrible power vacuum in the North-African regions formerly under the European colonisers sphere of influence. Local populations have seized the opportunity to attempt a project of self-governance to varying degrees of success. Conflict however never stays too far away given the circumstances.\n\nWe have gained reports form the southern reaches of our nation that a group of insurgents was occupying towns and villages, seizing goods and in general terrorizing the local population. From the seemingly reliable information we have it seems that Mauritian nationalist guerillas are attempting to break away the south of our nation in order to unify it with Mauritania Proper. In their mission they have invited further troops from Trarza and have now become a serious threat to our national security. Bloodshed is inevitable."
 #iberiawars.8.a:0 "This is our land!"
 
 #iberiawars.9.t:0 "Catalonia Revolts"
 #iberiawars.9.d:0 "Chaos has spread like a ravenous disease all throughout the Iberian Peninsula. Wherever tensions, ethnic or otherwise, had previously taken root, there now were strong explosions of violence and insurrection. The stability which the Union had held onto was shattered, possibly beyond repair.\n\nThe Basque uprising, the first domino in an ever increasing chain reaction, seemingly has motivated other nationalists in the north of our country to also take advantage of the terrible situation. We have gained reports from Barcelona and other Catalan cities that the independence of a new Catalonian republic has been proclaimed. The revolt could have been quickly quelled had our forces stationed in the region still been present and not shifted around to the various new frontlines which had opened up across the peninsula. Some of our divisions had remained yet they seemingly were caught in the intense fervour and have joined the Catalonian independence cause.\n\nAdditionally we now know that the republic is being led by the former President of the Generalitat-in-exile Josep Tarradellas. The troublemaker quickly had returned from abroad to form a new government which would support the revolt. Unless we intervene and return the rule of law to the region this could seriously hamper our war efforts against the other traitors."
 #iberiawars.9.a:0 "Viva Iberia!"
 #iberiawars.9.b:0 "Visca Catalunya!" 

 #iberiawars.10.t:0 "The Spanish Republic Splits" 
 #iberiawars.10.d:0 "With various factions leaving the government to start uprisings or sow discord in a similar fashion to the treasonous independence fighters, the Iberian government has consequently been left as a rump administration. This rump was however not just characterised by only those loyal to the regime or the Iberian dream, it also featured prominent liberla and reformist politicians. Their calls for a peaceful solution to the ever growing conflict, despite the growing influence, has entirely fallen on death ears. With the accompanying loss of stability the reformers have begun to entirely lose their faith in fruitful Iberian governance.\n\nIn light of this a number of the politicians have drawn parallels to the Portuguese revolt as a sustainable path to divorce from this mess. Rising to fight for better and more durable ideals than what the current administration wobbles on has to be the only choice. Once the initial plans were set in place intelligence had to be gathered on the level of support a new regime on Spanish soil would hold. A good number of the population would rise at the command of a new Spanish democratic government. Large segments of the population have awoken to the grand mess that the Union has done both to the Spanish cultural identity and its institutions. We must step in now."
 #iberiawars.10.a:0 "Viva Iberia!"
 #iberiawars.10.b:0 "No Pasarán!" 

 #iberiawars.11.t:0 "Galicia Declares Neutrality"
 #iberiawars.11.d:0 "As the chaos continues to spread throughout the peninsula we have received reports of a new actor entering the stage. One of the tanks brigades we had dispatched to subdue the Portuguese revolt was stopped by local soldiers in Galicia. When our soldiers demanded to be let through they were instead arrested, apparently on the orders of the various Galician governors. Shortly afterwards Galicia blocked access to all roads to and from their provinces. Given the rapidly escalating tensions it was perhaps not surprising that the next proclamation to arrive from Santiago was a claim that the interests of Galicia no longer align with those of Madrid and that the only logical course of action was independence.\n\nThe secession of Galicia puts us in a tough spot. While their treachery can not be abided, our resources are already stretched to their breaking point. We can ill afford to open another frontline at this juncture. Luckily it seems like the Galician government is content to remain within their borders. For the time being we will have to accept their de-facto independence and only return after the current crisis has been handled."
 #iberiawars.11.a:0 "It is the prudent thing to do."
 #iberiawars.11.b:0 "Free from the tyrants at last." 

 #iberiawars.12.t:0 "The Falange Splits" 
 #iberiawars.12.d:0 "It seems the betrayal of the Republicans has not been the end of our trouble. Infuriated at what they deem to be our administration's failings and betrayal of Falangist ideals a group of reactionary generals under the leadership of Jaime Milans del Bosch have tried to coup the government. While they failed to seize complete power they did manage to install themselves as rulers of the North. They have proclaimed themselves to be the only legitimate Spanish government and vowed to "restore order to the rebelling provinces". Traitors they may be but their power is formidable. Putting them down will not be easy."
 #iberiawars.12.a:0 "The treachery never ends!"
 #iberiawars.12.b:0 "The Falange will bring order to Spain."

 #iberiawars.14.t:0 "The BTA Revolts" 
 #iberiawars.14.d:0 "A Transport Helicopter marked in military motifs approached the Cárcel Modelo de Oviedo, from it disembarked a small force of communist commandos led by a short-haired woman who quickly overtook without firing a shot the prison warden and his men, rescuing a number of prisoners from the maximum security yard including the Infamous Asturian communist leader Horacio Fernández Inguanzo, escaping with them on the aircraft. Hours later the TVI North Studios was invaded by communist cadres that forced the crew to record and broadcast a speech by Horacio Fernández calling all of Asturias to rise against "Fascist enslavement" and join the Asturian Workers' Battalions in their fight for freedom and to "make the Fascists pay for what they done to the Asturian proletariat since 1934".\n\nWhen the message was broadcasted, Asturias erupted in flames, University students erected barricades in every major urban area, potshots were taken at cargo vehicles traveling the highways; snipers stalked the rooftops firing at police officers and anyone else who looked like an authority, homemade bombs were thrown at courthouses and Guardia Civil barracks, Army depots were raided and weapons were seized to be distributed to the hands of communist militias, and Members of the Asturian Workers' Battalions stormed the Banco de Iberia Building and expropriated the Vaults.\n\nThe Situation in Asturias is unbearable, with dozens of law enforcement officers having been killed and the Government is unable to respond to the multitude of coordinated attacks against it. As a measure to prevent more losses Jefe del Bosch has ordered a withdrawal of all troops and officials from Oviedo, causing Horacio Fernández Inguanzo to declare it the start of his revolution."
 #iberiawars.14.a:0 "Communist scum!"
 #iberiawars.14.b:0 "Unite, proletarian brothers!"

 #iberiawars.13.t:0 "The National Redemption Front Rises" 
 #iberiawars.13.d:0 "The madness of the Iberian Wars enacts a great toll on the mind and for many it is a question of when they snap rather than whether they do so. Carlos Arias Navarro seems to be the latest victim of the chaos. Loudly proclaiming to all who can listen that he has personally been chosen by god to lead a crusade against those who have betrayed the church and restore order to Iberia. Thousands of desperate souls searching for hope have flocked to his side. Empowered by fanaticism the newly founded National Redemption Front promises to be a powerful new contender in Iberia."
 #iberiawars.13.a:0 "These fanatics must be put down."
 #iberiawars.13.b:0 "Only faith can save Iberia"
 
 #iberiawars.15.t:0 "Portuguese Republic Rises Up" 
 #iberiawars.15.d:0 "When we first crushed the southern traitors and proclaimed a new dawn for the Portuguese Nation many had high hopes that a new era of Portuguese greatness had begun. But as the Iberian Wars rage on and the dead pile ever seeds of doubt were sown amongst our military staff. Democratic and socialist leaning elements have formed a shaky coalition proclaimed a "Provisional Portuguese Republic". Despite their obvious betrayal of Portuguese ideals they have amassed a significant following and secured control of the South."
 #iberiawars.15.a:0 "These traitors shall be crushed."
 #iberiawars.15.b:0 "Portugal can either live free or perish." 

 #iberiawars.16.t:0 "Portuguese People's Republic Rises Up" 
 #iberiawars.16.d:0 "Despite the high hopes and proclamations of unity when our republic was founded there always existed a rift in our leadership. Both Democrats and Socialists were united in their hatred of the Government of National Salvation but had few other commonalities. As the war drags on this divide has only grown. For every battle lost another argument would split the high command. We had always hoped that these issues could be mended once victory had been obtained. But now any hope of reconciliation seems to be dead. The Left has split off their forces and proclaimed the creation of the Portueguese People's Republic. Yet another contendender for Portugal has emerged and we must now face our former allies on the battlefield."
 #iberiawars.16.a:0 "Democracy will prevail."
 #iberiawars.16.b:0 "The workers of Portugal shall rise."
 
 #iberiawars.17.t:0 "Andalusia Sues for Peace" 
 #iberiawars.17.d:0 "When our brave soldiers overthrew we did so in the belief that it would finally give Spain some stability amidst the chaos of these wars. That military rule could provide the order the Republic never granted us. The people however have not been so understanding and tensions have been boiling ever since. Now it seems like the South has had enough. A group of local leaders and politicians have gathered to denounce our regime. Claiming that the people of Andalusia have suffered enough from this senseless war they state their intention to secede. Unfortunately with the war still raging we can not spare the resources needed to suppress these rebels. For the time being the people of Andalusia will have their independence."
 #iberiawars.17.a:0 "They should treasure it while it lasts."
 #iberiawars.17.b:0 "Peace and freedom at last." 
 
 #iberiawars.18.t:0 "National Socialist Coup!" 
 #iberiawars.18.d:0 "The Falange is ailing, this much is clear to see. What started out as a quiet murmur among the soldiery has grown louder and louder as the war rages on and the loses pile ever higher. When the zealous fanatic Navarro seceded to launch his delusional crusade the whispers turned into a deafening shout. Now these voices have been organized under the leadership of José Luis Arrese. Soldiers loyal to him have seized the government and put Milands del Bosch for botching what was supposed to have been a short but glorious conquest. Arrese has promised his followers a new radical leadership, one which shall crush the pretenders and create a bold new Spanish state. One modelled not after the failed ideals of old but instead those of the Reich. Already he has enacted several harsh measures to cement his rule and begun reaching out to Germania for recognition and support."
 #iberiawars.18.a:0 "All Hail the Frente Azul"

 
 #iberiawars.19.t:0 "ETA Rises Up" 
 #iberiawars.19.d:0 "Basque independence has been a long and hard fought struggle and none have contributed more heavily to it than the soldiers of ETA. When we at last proclaimed our independence the government did so with the approval of ETA. However as the war dragged on the relationship with ETA, especially the radical wing, has rapidly deteriorated and now at last it seems that they have had enough. ETA has couped the government and announced the creation of a Basque socialist state, one they promise will be strong enough to win the war and forever secure Basque independence."
 #iberiawars.19.a:0 "Bietan jarrai"

 #iberiawars.30.t:0 "Monarchy Restored" 
 #iberiawars.30.d:0 "When first we proclaimed the Republic the citizens while not perhaps cheering our name still broadly supported us in our struggle for freedom. But as the war drags on and more and more of our soldiers return in bags that support has gradually eroded. Tensions between civilians and government forces grow everyday and protests have become a regular occurence. Something needs to change if we are to survive their anger. Desperate for any source of legitimacy the conservatives have offered up a radical proposal, restoring the monarchy by offering the throne to Juan de Borbón. While the liberals have accepted the proposal, albeit with less enthusiasm and the socialists are outraged. Their leaders loudly denounced the plan and when it became clear they could not stop it they abandoned the government in disgust. We can only hope that this move will regain enough support among the people to make up for what we just lost."
 #iberiawars.30.a:0 "One by one the promises of the republic have been broken."

 #iberiawars.31.t:0 "Military Coup!" 
 #iberiawars.31.d:0 "At first the Republic had been filled with hope for a better Spain. One free of tyrants and steered by the will of the people. But as the wars drag on and losses pile ever higher the military has grown more and more disillusioned with our dreams. Finally they have hit their breaking point. Under the leadership of Sabino Fernández Campos a group of generals have couped the government. Arguing that civilian leadership is fundamentally unsuited for the kind of conflict we are engaged in, the generals have enacted a variety of harsh measures to solidify their rule. Curfews, the abolishment of town halls and the enforcement of military governors and state control over the industry are merely some of the measures enacted. While conservative politicians have voiced cautious support for this development the liberals are clearly worried. Worst off however are the socialists. Already disillusioned by the enforcement of the monarchy the socialists have taken to the streets to oppose the government."
 #iberiawars.31.a:0 "The end of the republican dream."

 #iberiawars.32.t:0 "Catalonian People's Army Rises Up" 
 #iberiawars.32.d:0 "The industrialized heartlands of Catalonia have always been home to a strong left wing tradition. First rising to prominence during the first Spanish civil war the revolutionaries put up an admirable showing before ultimately being crushed by Franco. When we proclaimed our independence we did so with the tacit support of the many socialist factions within Catalonia. However as the war drags on our relationship with them has grown more and more strained. Thinking our leadership weak and inefficient Socialist politicians have been gradually withdrawing from our government. When we received yet another report of a loss on the frontline that was the last straw. Organizing themselves into the "Catalonian People's Army" the socialists tried to seize control of the state. While they succeeded in driving us out of Barcelona we still retain our other territories from which we can plot our return and crush these traitors."
 #iberiawars.32.a:0 "Order must be restored."
 #iberiawars.32.a:0 "The working classes will seize their freedom or die trying."

 #iberiawars.20.t:0 "Victory!" #Salazarists
 #iberiawars.20.d:0 "As the last battles draw to a close the Estado Novo reigns supreme over Portugal. The government publicly celebrates at their victory and promises an era of reconstruction that shall lead to a new era of Portuguese greatness. And while some citizens celebrate the victory most are consumed by an atmosphere of fear. After all with no more outside threats to worry about the government will be able to turn its full attention towards those who failed to fully support its cause."
 #iberiawars.20.a:0 "Long live the Estado Novo!"

 #iberiawars.21.t:0 "Victory!" #Portuguese Democrats
 #iberiawars.21.d:0 "With the fall of the last pretender we stand as the supreme masters of Portugal. The tyrants lie broken and the people are victorious. As we begin to plan out the reconstruction we must also think of our future. The Republic was founded as a coalition between the socialists and the liberals. Soon they must meet and decide on the path we should walk on. Whether to fully embrace socialism or transition into a liberal republic. But that is a task for tomorrow. Today we celebrate."
 #iberiawars.21.a:0 "Freedom has triumphed!!"

 #iberiawars.22.t:0 "Victory!" #Portuguese Communists
 #iberiawars.22.d:0 "We have passed through the crucible of war and emerged victorious as the true heir to the mantle of Portugal. The workers of Portugal have earned their freedom and can now exchange their arms for the tool with which to build the future. With the process of collectivization and expropriation underway only one task remains for us. To hold a grand Constitutional Congress where all the workers can come together and decide what Portugal's future shall be."
 #iberiawars.22.a:0 "A victory for the people."

 #iberiawars.33.t:0 "Victory!" #GNS
 #iberiawars.33.d:0 "As the guns fall silent our complete control over Portugal is finally assured. The country has suffered much but under our benevolent leadership its glory shall be restored. A new golden era awaits us but only if we are brave enough to seize it. The wars consuming Iberia have presented us with a golden opportunity. Throughout its history Portugal has always suffered under the oppressive yoke of the Spaniards. They have constantly plotted and schemed to deny us the glory which we are owed. If Portugal is to ever once again become a great power they must be subjugated. We shall launch an invasion to subjugate the divided Spanish pretender states. Once done we shall make their current division permanent and harvest their resources for the sake of our restoration."
 #iberiawars.33.a:0 "We will avenge Portugal!"

 #iberiawars.23.t:0 "Total Victory!" #GNS
 #iberiawars.23.d:0 "When first we embarked on our expedition to seize the peninsula many doubted us. Countless protests had to be dispersed and traitors dispersed. But now as the last enemy stronghold reigns supreme we have accomplished all that we set out to do. For the first time in history Iberia answers to no master but Portugal. Now we need only to solidify our rule. Naturally Galicia shall be reunited with her mother. As for the other territories their fate is one of divisions. Regional governatorates commanded by loyal generals shall be established in order to rebuild and ensure an abomination like Spain is never again allowed to form. With a steady flow of resources from the governatorates we can complete our reconstruction and plot our next step."
 #iberiawars.23.a:0 "The reclamation of the empire."

 #iberiawars.24.t:0 "Victory!" #Federales
 #iberiawars.24.d:0 "As the last guns fall silent it the impossible task is accomplished. We have brought Iberia back from the brink and reasserted our authority. In time there will be new challenges. The ruins will have to be reconstructed. The traitors purged. Necessary reforms enacted. The rebuilding of the army. But for now we can allow ourselves a moment to celebrate. Iberia endures."
 #iberiawars.24.a:0 "Never again."

 #iberiawars.25.t:0 "Victory!" #NRF
 #iberiawars.25.d:0 "Despite the doubts of the unbelievers we have emerged as supreme sovereigns of Iberia. Yet our task is far from done. The ruined nation we have liberated must be redone. And as the mad Bishop of Rome has rejected us we have no choice but to crown a new leader of the church. Thankfully one of the local bishops possess all the right qualities and has gratefully accepted his offer. Iberia has been saved and soon we shall bring the light of God to the rest of the world."
 #iberiawars.25.a:0 "Through faith mankind may yet earn salvation!"

 #iberiawars.26.t:0 "Victory!" #Falange
 #iberiawars.26.d:0 "Finally the last enemy falls and our rule over Spain has been secured. Though the cost has been great Spain is now free of the chains forced upon her by the dysfunctional union. As the reconstruction efforts begin there is only one task left to us. To come together and hand over power to those most suited to implementing the ideals of Falangism. A new golden era awaits Spain. One of strength and faith, free from the corruption of liberalism and socialism."
 #iberiawars.26.a:0 "The end of the second civil war echoes that of the first."

 #iberiawars.27.t:0 "Victory!" #Frente Azul
 #iberiawars.27.d:0 "With the surrender of the last traitor stronghold our dominion over Spain is assured. While some celebrate we know that this war is far from over. Not only do countless domestic traitors still hide in our midst but the Spanish race will never be safe so long as it does not exercise full dominion over the peninsula. The Portuguese still plot and scheme ways to assert themselves on the world stage. If we allow them to grow uncontested we may yet again be brought down to the brink of ruin. As such while we begin reconstruction efforts we must also marshall our forces and immediately move to crush the Portuguese. Their delusions and aspirations will be crushed and their land and resources will serve no master but Spain."
 #iberiawars.27.a:0 "To last a thousand years."

 #iberiawars.29.t:0 "Total Victory!" #Frente Azul
 #iberiawars.29.d:0 "Portugal has fallen and we now reign as the supreme hegemon of Iberia. The Portuguese territories are unruly still however and to pacify them we shall take inspiration from the Reich's treatment of Slovakia. A puppet republic under Kaúlza de Arriaga and the GNS shall be organized. This administration will ensure our interests are represented and that the wealth of Portugal is used only for the benefit of Spain. Truly a new golden era for the Spanish race has only just begun."
 #iberiawars.29.a:0 "The Reich claims another victim."

 #iberiawars.28.t:0 "Victory!" #Spanish Republic
 #iberiawars.28.d:0 "The last enemy lies defeated and Republicanism reigns supreme over Spain. Though the struggle has been long and bloody we have freed our people from the grips of fascism. Though the nation lies in ruin our people look toward tomorrow with hope in their eyes.. Reconstruction will commence immediately and the first free election in decades is already being planned. Envoys are already being dispatched to the remaining regionalists to discuss our future relationship. The desire for war has well and truly been sated. If any future unification commences it will only be brought forward by the pen."
 #iberiawars.28.a:0 "A new light has emerged."

 iberiawarsvalencia.1.t:0 "An Uneasy Partition"
 iberiawarsvalencia.1.d:0 "Valencia is liberated, and is now under control of the state. Mostly.\n\nTerritorial control is not absolute, being split between ourselves and the Catalonians - a state of affairs that can be described as uneasy at best. It is clear to all that this reality cannot endure, and that some decisive resolution will be required.\n\nAs both of us are members of the AFCP it is unlikely (but pointedly not impossible) that physically violent escalation will occur, especially as a split occupation will intensify demands for a referendum. The Catalonians have been pushing for just that, and it is likely that their agitators will continue their efforts with ever stronger commitment, as will ours.\n\nWe must control this process. If we can establish strong rules of shared occupation, expand our control of the region (especially if we can secure all of it), and otherwise work to de-escalate tensions, we can improve our position in the event of any future referendum. It will be an intensive process - but the potential prize cannot be denied."
 iberiawarsvalencia.1.a:0 "Start dialing."
 
 iberiawarsvalencia.2.t:0 "A Proposed Summit"
 iberiawarsvalencia.2.d:0 "An official communication has been sent to us by the Republic regarding the split occupation of Valencia. They wish to negotiate, and politically we must be receptive to this.\n\nWhile there are those in the government who think its a mistake to engage in dialogue at all, most realize the opportunity present in any negotiations, especially given the tension present in the divided region. If our representatives play their cards right, and we are very careful in what we say, promise, do and imply, we can not only preserve the split but work to expand our territory within it.\n\nWere that to happen, in the future it could be we who could call for a referendum;in such a situation the outcome could only be beneficial to our interests. As such, it has been decided. We will respond positively and should the Republic continue their course after reading our initial position we will sit down formally with them.\n\nWe must not miss the opportunity presented.\n\nTo the table we go."
 iberiawarsvalencia.2.a:0 "Lets hope this pays off"
 
 iberiawarsvalencia.3.t:0 "Setting the Terms"
 iberiawarsvalencia.3.d:0 "Catalonia has responded positively to our message and although secrecy must be maintained owing to the ongoing conflicts, talks can commence.\n\nIt is essential that beyond holding the talks in an undisclosed location, that the press remains unaware, that guests (if any) be restricted only to the most necessary, and that security be carefully controlled. In any such negotiation, information will be king and we must ensure that we are the ones who control it.\n\nBefore any of that, however, we must provide instructions to our representatives. There are only two real positions at the moment that are broadly acceptable - either we propose keeping the current split occupation (and hope to progress our control later on), or we push for full control now.\n\nBoth options have potential upsides and downsides - but one must be chosen. Which should it be?"
 iberiawarsvalencia.3.a:0 "We are willing to keep the split occupation."
 iberiawarsvalencia.3.b:0 "We demand that Catalonia withdraws."
 
 iberiawarsvalencia.4.t:0 "The Continued Divide"
 iberiawarsvalencia.4.d:0 "The Republic's position has been made clear - they wish to maintain the current split occupation.\n\nIt is likely that they, similar to ourselves, can ill-afford any additional conflict at the moment, and wish to be able to dedicate their attention elsewhere. This is understandable, and we can of course accept this reinforcement of the status quo without addition. It would certainly assist us in doing the same.\n\nOr, as has been proposed by some, we can work to achieve more, leveraging the Republic's desire to move on, and attempt to append some additional small victories to the agreement. Several figures in our government have been pushing for a reduction in commercial restrictions, and in convincing the Republic to allow Catalonian business in their occupation zones.\n\nThis could be a boon for us if accepted - or it could lead to a demand for reciprocity. What shall be our response?"
 iberiawarsvalencia.4.a:0 "Accept the deal as is."
 iberiawarsvalencia.4.b:0 "We want Catalonian businesses to operate on both sides."
 
 iberiawarsvalencia.5.t:0 "An Economic Concession?"
 iberiawarsvalencia.5.d:0 "The Catalonian response has been received - and it is positive, though it does come with a 'request' for concessions.\n\nFundamentally, they indicate that the split occupation is acceptable, but in exchange they wish for Catalan businesses to operate freely across all of Valencia. This was not a wholly unexpected request, as economic presence within the state would be extremely helpful to their nascent economy, but it must be carefully considered.\n\nVoices have emerged advocating for the Catalonian demand since, they claim, allowing such activity would not likely constitute a significant threat and demonstrate benevolence on our part. Others highlight that while perhaps insignificant in the near term, we must express caution for the long term due to the foothold this would give their Republic in our zone, and as such we should reject the condition. A third group suggests accepting the request in order to maintain the split occupation while also requesting the same treatment for Republic business within the Catalonian zones. It is only fair, after all.\n\nWhat should the Republic's official response be?"
 iberiawarsvalencia.5.a:0 "No. Catalan businesses will be treated as foreign enterprises."
 iberiawarsvalencia.5.b:0 "We can allow this - if the same treatment is given to our businesses."
 iberiawarsvalencia.5.c:0 "Yes. We will allow free access to Catalonian businesses."
 
 iberiawarsvalencia.6.t:0 "Pushing the (Military) Envelope?"
 iberiawarsvalencia.6.d:0 "Success - for now, at least.\n\nThe Republic has capitulated on the matter of economic activity within Valencia in return for our cooperation in maintaining the split occupation. Catalonian businesses will have free access to conduct affairs across the region, and this will help our nation and people tremendously. They now ask to finalize the talks. We could do that.\n\nWe could also, as some in our delegation have suggested, continue to push further. Capitulating on this issue shows weakness on the Republic's part and it is possible that we may be able to extract more concessions. In particular, our military officers have asked that we push for military jurisdiction across both occupation zones, in order to better capture saboteurs and spies.\n\nThe Republic would never accept this without reciprocity for their own forces, but that would be acceptable. The question is, do we attempt to get their 'agreement' on this?"
 iberiawarsvalencia.6.a:0 "Ask the Republic for the militaries to each have jurisdiction across zones."
 iberiawarsvalencia.6.b:0 "We've gotten enough. Don't risk it, sign the deal."
 
 iberiawarsvalencia.7.t:0 "Further Pressure"
 iberiawarsvalencia.7.d:0 "Our concession on Catalonian economic activity seems to have had the opposite result to what was intended. They are pushing further, and we must decide how to reply.\n\nIt is clear that their military has had a say in their latest communication - they wish for their forces to have cross-border jurisdiction across both Valencian occupation zones, ostensibly to better pursue and capture saboteurs, spies, and other agitators. They are smart enough to know we would never accept this unilaterally, and so offer the same rights to our forces in exchange. This 'offer', such as it is, has provoked intense discussion in our delegation.\n\nSome demand we reject it outright as a blatant attempt at pushing the interests of their Republic by the backdoor, others see value in a reduced version limited to police forces which would better allow us to contain their presence, and still others suggest we accept it in order to exploit and turn their gambit onto them - hopefully in better fashion than the Catalonians will do to us. What shall our choice be?"
 iberiawarsvalencia.7.a:0 "Absolutely not. Reject this."
 iberiawarsvalencia.7.b:0 "Suggest downgrading the cross jurisdiction to police forces."
 iberiawarsvalencia.7.c:0 "Accept this. We have ideas on how to exploit it."
 
 iberiawarsvalencia.8.t:0 "A Firm Rejection"
 iberiawarsvalencia.8.d:0 "Our request for cross-zone military jurisdiction, even with reciprocation, has been flatly rejected by the Republic.\n\nIn no way, they say, will they allow Catalonian military forces into their occupation zone. The split of Valencia, the response read, will be firm and carefully controlled, with each force strictly constrained within the zone assigned.\n\nThey further insist that their concessions on economic activity were generous as it is, and have made it very clear that no further negotiations will be acceptable or entertained. We must choose to either accept the current understanding and sign the agreement, or reject it and walk away.\n\nWhat instructions should we send to our delegates?"
 iberiawarsvalencia.8.a:0 "We've gotten enough. Sign it."
 iberiawarsvalencia.8.b:0 "Not good enough. Do not sign it."
 
 iberiawarsvalencia.9.t:0 "A Final Proposition?"
 iberiawarsvalencia.9.d:0 "The Spanish response to our offer of joint jurisdiction over both parts of the occupation has been positive. We now have guaranteed business access to all parts of the liberated zones, and the military access to back that access up in case the Spaniards try any underhanded meddling. For many in the Catalan delegation, this is a triumph in and of itself - our forces will stand on equal footing with those of the Spanish and force them to hold to their own end of the deal, and also build legitimacy with the people.\n\nHowever, some in the delegation have proposed trying to push our advantage further with a final proposal to the Spanish. They envision the establishment of a civilian council, composed of members of both sides, to oversee and manage the occupation as well as handle any breaches of the agreement. As the militarily weaker side, this will mostly benefit us - otherwise, the Spanish may still attempt to force any issue in a manner favorable to them. This council will, at least in theory, be able to tie the hands of any rogue actors on the ground and guarantee at least some stability in both zones.\n\nThe proponents of this idea claim it will provide a solid guarantee for a stable occupation and that the Spanish would not have to give up very much - they have already agreed to a shared jurisdiction, this would just be a way to officialise it further and tackle any breaches of the agreement. It would also formalize our own influence in their zone, an invaluable commodity.\n\nOn the other hand, many of the Delegation's members believe that the current agreement in place is a good enough guarantee - the Republic wouldn't want to embroil itself in another conflict while the War raged. Furthermore, trying to push through this perk has potential to backfire, with the Spanish seeing it as an unnecessary humiliation, rather than a potential benefit, which could threaten everything we have achieved so far."
 iberiawarsvalencia.9.a:0 "Sign the agreement as is."
 iberiawarsvalencia.9.b:0 "We want an overseeing civilian council."
 
 iberiawarsvalencia.10.t:0 "An Overseeing Civilian Council?"
 iberiawarsvalencia.10.d:0 "After agreeing to the Catalonian proposal for a joint military jurisdiction of the recently liberated territories, most members of our delegation believed that this was the end of it - surely, the Catalans would not be able to muster any more objections and demands. The road to a final agreement was wide open - or so we thought.\n\nThe Catalan delegation, apparently willing to go to any lengths to extract even the smallest concession, has come up with an additional request: not only do they want joint armed jurisdiction over the territory, they're now asking for the establishment of a civilian council to oversee the overall occupation, to be composed of officials from our side and theirs. This council is supposed to legally enforce the agreement, address any complaints and punish rogue actors on the ground.\n\nOn the face of it, there isn't much to oppose in this proposal - its only real purpose is the enforcement of terms we've already agreed to and would have a hard time undermining, at least while the War lasts. While disproportionately benefitting the Catalans, as the militarily weaker side of the agreement, we could use it as a forum for our own complaints and ensure they hold their own side of the deal.\n\nHowever, some in our delegation are outraged. They claim that, having approached the Catalans with an offer of friendship, this attempt to bind our hands shows that they lack the minimal level of trust required for a true alliance to take shape. They say this council will hamstring any efforts to restore order in the region and make us look weak in the defense of the national interest, diplomatically and even militarily. What the people in these territories need, they argue, is effective government and relief, not Catalonian separatists playing political games with our ability to provide for them."
 iberiawarsvalencia.10.a:0 "It's not much more of a concession than what we've already made..."
 iberiawarsvalencia.10.b:0 "We've been more than generous until now, but we're not pushovers."
 
 iberiawarsvalencia.11.t:0 "The Spanish Reject the Civilian Council!"
 iberiawarsvalencia.11.d:0 "Following a few days of deliberation, the Spanish delegation has replied to us, rejecting the idea of a civilian overseeing council.\n\nThey claim that the very request shows a "lack of trust and of responsible statesmanship" on our side. In their view, our shared struggle calls for solidarity and compromise, not attempts to stay on top of one another. Additionally, they say, even if they had wanted to undermine the joint occupation (which they promise has never been their intention), the joint armed occupation would make such an endeavor too costly - those resources would be better spent fighting the War, just as the resources the civilian council would require would be.\n\nMany in our delegation, while not pleased, can understand the Spanish viewpoint. After all, we had already been prepared to sign an agreement before deciding to add this proposal. It would be helpful to have but, as some in the military say, our forces can handle any potential rogue actors themselves and the resources could be spent elsewhere.\n\nHowever, some of the more hawkish delegates claim that this rejection shows the Spanish never intended to keep up their end of the bargain. They claim that without the oversight council, the Republic will use its superior military force to undermine the shared occupation and attempt to present us with a fait accompli in the region when the War concludes. While the Spanish claim that our request shows a lack of trust, these delegates say that this rejection shows the Spanish could not have been trusted to begin with."
 iberiawarsvalencia.11.a:0 "Forget about the oversight council, we'll handle this through the armed forces."
 iberiawarsvalencia.11.b:0 "No council, no deal."
 
 iberiawarsvalencia.12.t:0 "A Shared Police Jurisdiction?"
 iberiawarsvalencia.12.d:0 "The Spanish delegation has come back to us, after taking a couple of days to consider our request for joint military jurisdiction over the occupied region. While the delegates claim that their government is not inherently opposed to the idea of joint jurisdiction, they have mentioned various concerns with the idea of joint military control, particularly the allocation of resources better spent elsewhere in the war effort and the difficulty of coordinating both forces. Instead, they suggest that the joint jurisdiction will be shared between both of our police forces.\n\nSome in our delegation see this proposal as reasonable enough. We could also benefit by redirecting our forces elsewhere and, with help from the Spanish, our police forces should be able to handle any issues arising from the occupation. Our police forces still have similar structures and are less sensitive to sharing information, so coordinating them would be far easier than trying to coordinate our militaries. They also point out that having the police maintain order instead of the military will help return the region to normalcy sooner, better setting the grounds for a postwar referendum.\n\nHowever, other members of our delegation view this counteroffer with skepticism. They claim that the downgrading of the joint occupation force will allow the Spanish to come in and assert themselves at any point, using their superior military force, with no equivalent force on our side to prevent them from doing so. They also claim that the Spanish will have an easier time manufacturing crises if the area is under less direct military control. A few have even taken the step of claiming that the Spanish offer is an attempt to set up an incident which will allow them to sweep in and take the whole of the region for themselves."
 iberiawarsvalencia.12.a:0 "This extra manpower would be useful on the front line. Accept the compromise."
 iberiawarsvalencia.12.b:0 "We may yet have to fight this Spanish government too. Reject, and be ready."
 
 iberiawarsvalencia.13.t:0 "The Catalans Reject Joint Police Jurisdiction"
 iberiawarsvalencia.13.d:0 "When our delegates suggested downgrading the shared jurisdiction of the newly occupied territories to the police level, many of the Catalan delegates were visibly displeased. However, it was hoped that their government would see reason and cut down on the resources necessary to administer the region - resources which would be better spent on the war effort instead of political games. However, this appears not to have been the case. The Catalans have responded in the negative, saying that they will only accept a mutually-agreed, joint military occupation of the territory. Now, they have passed the onus of decision back to our side.\n\nOn the face of it, we could be flexible - we have more military resources than the Catalans, and while we would prefer using them elsewhere, this disparity could be leveraged to our advantage in any future negotiations over the region. Showing magnanimity to the small breakaway region in this way will also all but guarantee that they sign the agreement.\n\nHowever, some of our delegation's members see this as a naked attempt to weaken us in the face of a common enemy, in order to further the sectarian interests of the breakaway governments. These delegates claim that tying down our forces in the rear will put an outsized burden on our frontline military operations, forcing us to rely more heavily on the Galeusca governments. This agreement was supposed to safeguard Spain but now, they say, it may as well guarantee its dismemberment if signed as is."
 iberiawarsvalencia.13.a:0 "We'll be generous, but make it clear that we will not budge any further."
 iberiawarsvalencia.13.b:0 "We will not be held hostage by separatists!"
 
 iberiawarsvalencia.14.t:0 "The Spanish Accept Joint Military Jurisdiction"
 iberiawarsvalencia.14.d:0 "Many members of our delegation have been anxious after we have expressed our dissatisfaction at the idea of downgrading the unified jurisdiction of the occupied territories to merely a joint policing force. The Spanish could very well have considered that as an attempt to divert their forces from the frontlines and give us and the other Galeusca members further edge in future negotiations.\n\nNow, however, our delegates can breathe a sigh of relief. The Spanish have relented, whether out of genuine goodwill or as an attempt to show magnanimity. Both of our militaries are to have jurisdiction over the area, as originally planned. The more hawkish members of our delegation see this success as a vindication of their efforts to drive as hard a bargain as possible with the Spanish, perhaps attempting to set the tone of future diplomatic relations. Yet, there are limits to what hawkishness can get us, especially with the war still ongoing and our limited power compared to the Spanish. Their delegation has let us know in no uncertain terms that, while they were willing to be magnanimous, they will not be making any further concessions to us and any attempt by us to push for more will result in the immediate termination of the negotiations.\n\nWith our goals mostly achieved, most of our delegates view this as fair. Most outstanding issues can be left for later - now is the time to sign this agreement and relish our diplomatic success, and the further legitimacy it will grant us on the world stage."
 iberiawarsvalencia.14.a:0 "A toast to our foreign office!"
 
 iberiawarsvalencia.15.t:0 "The counterproposal"
 iberiawarsvalencia.15.d:0 "Instead of accepting our deal outright, the Republic has presented an interesting counterproposal. They are willing to accept the presence and operation of our businesses inside their zone, on condition that we allow their businesses to operate in ours. While this deal will surely benefit both our economies as well as provide more goods to the populace, taking some relief efforts away from the occupational authorities that can be redirected elsewhere.\n\nHowever, some remain skeptical. The fear of the Valencian economy becoming dominated by Spanish companies, even in our zone, is present within the delegation and could be a source of future Spanish agitation. Their economic power dwarfs our own and we may risk effectively losing influence in our own zone. Furthermore, some even argue that, given the right diplomatic maneuvering, we could instead get the Republic to agree to our original proposal. We must tread carefully as allies are valuable at the moment, it may be unwise to test our relations with the Republic by pushing them too far. It is equally unwise, however, to compromise our position in the region to potential imperialists."
 iberiawarsvalencia.15.a:0 "The deal sounds fair, let's accept it."
 iberiawarsvalencia.15.b:0 "Our proposal was firm but fair;, it's that or nothing."
 
 iberiawarsvalencia.16.t:0 "The Catalonian reply"
 iberiawarsvalencia.16.d:0 "TheCatalonians have rejected our offer, stating that while they respect the spirit of reciprocity, Catalan businesses must be protected due to their weaker economy. This has gone down like a lead balloon among many in our delegation, cursing that even a simple request for some reciprocity was too much for separatists. Their posture makes it difficult to hold any further negotiations as capitulation on this would appear a surrender to the Catalan government against our own interests. Numerous delegates are suggesting that this is where the negotiations should end.\n\nBut as much as we want to punish their selfishness, this might be the worst time to do it. Some members of the delegation continue to argue for acceptance of the deal and continuation of the negotiations. They argue that the Catalonians do have a point regarding our uneven economies, and that the very last thing we can use in a time like this is more enemies. But is that worth compromising one of our regions to the separatists?"
 iberiawarsvalencia.16.a:0 "Fine, accept the deal."
 iberiawarsvalencia.16.b:0 "Catalan arrogance ends here, and so do the negotiations."
 
 iberiawarsvalencia.17.t:0 "A masterclass in diplomacy"
 iberiawarsvalencia.17.d:0 "Success! The Republic has accepted our original deal. This means that we can reap all the benefits, while still having guaranteed economic dominance over our part of Valencia. This is a major victory for the Catalan economy.\n\nHowever, everything comes at a cost. While the Republic accepted our deal, they are not in the best mood after we rejected their counterproposal. We will have to be very careful with our actions in the coming months if we want to maintain any form of diplomatic relations with them. So the best course of action at this moment is to sign the deal, thank them for their cooperation and quietly leave. We have gotten what we bargained for."
 iberiawarsvalencia.17.a:0 "Another Catalan victory!"
 
 iberiawarsvalencia.18.t:0 "A disappointing answer"
 iberiawarsvalencia.18.d:0 "The Republic has denied our proposal of letting our businesses operate in all of Valencia. Our following actions have to be carefully considered if we want to keep the negotiations alive. Our strategy of trying to staple other deals to the agreement has already failed. This leaves us with three main options.\n\nThe first option is to play it safe. The Republic has clearly shown it is only interested in the split occupation and nothing more. By accepting those terms there is at least something we will gain from this diplomatic encounter.\n\nOption two is to just straight up deny the deal. Negotiations are very likely to break down as a result of this action, but it sends a message to the Republic. If they are not willing to accept our terms, then there will be no deal made with them.\n\nThe last option is to change the proposal so it is more favorable for the Republic, making them more inclined to accept it. This can be achieved by allowing Republican companies to operate in our part of Valencia. This gesture of reciprocity should be enough to win over the Republicans. However there are some that fear this could end up being worse for us as this would allow Republican companies to dominate in our part, while our companies would struggle to break through in their part."
 iberiawarsvalencia.18.a:0 "Accepting the original deal is the safest bet."
 iberiawarsvalencia.18.b:0 "Our terms were clear, the deal will be denied."
 iberiawarsvalencia.18.c:0 "Let's alter our proposal and see if it will change their minds."
 
 iberiawarsvalencia.19.t:0 "Catalonian persistence"
 iberiawarsvalencia.19.d:0 "The Catalonians are not ready to give up just yet. They have sweetened the deal by changing it so that now our businesses would also be allowed to operate in their part of Valencia. This gesture of reciprocity is very welcome and makes the deal a lot fairer. Most are ready to accept their additional proposal as it would benefit both of our economies,improving our relations with the Catalonians at a time when allies are few and enemies plenty.\n\nHowever, there remains a group which still does not want any form of economic agreement with Catalonia and leave the issue a matter of occupation. They proclaim the danger of indirectly funding separatism and this economic agreement may only bankroll future issues. Furthermore they want to send a message to the Catalan government. Our proposal was final. The constant Catalan meddling is not welcome and will not be tolerated. This firm stance will certainly prevent the Catalonians from attempting to take advantage of our generosity, but it might stress the relations with one of our few allies. Something we cannot afford right now."
 iberiawarsvalencia.19.a:0 "This seems like a fair proposal, sign it."
 iberiawarsvalencia.19.b:0 "The original deal is the only option, nothing else."
 
 iberiawarsvalencia.20.t:0 "The Spanish Refuse Free Cross-Border Trade"
 iberiawarsvalencia.20.d:0 "Despite our best efforts to compromise, allowing businesses to operate across both occupation zones, their delegation has returned a negative answer: our businesses in their zone will be treated as foreign businesses.\n\nThis is a hard pill to swallow for many in our delegation, but many have already voiced that the time to ratify has come. The Spanish have made it clear that we will not be able to extract any further concessions from them and the agreement is simply too important to let go over the issue of tariffs. A Spanish government recognizing our sovereignty, even over a part of Valencia, will be too large of a diplomatic coup to pass up even if trading with the other part will be more difficult than we had hoped.\n\nOn the other hand, some delegates claim that this outright refusal by the Spanish shows clearly that they never intended to negotiate with us in good faith. They say that the Spanish have made it clear that they will never truly bring themselves to accept the loss of "their" territory. That they will attempt to use any coercive measures to force us back into the fold and accept their oversight. For now these may be economic measures, but after the war with the fascists ends? Their questions hang over many in our delegation."
 iberiawarsvalencia.20.a:0 "Not the results we had hoped for, but this is acceptable."
 iberiawarsvalencia.20.b:0 "We will not let the Spanish corner us, neither economically nor militarily."
 
 iberiawarsvalencia.21.t:0 "The Spanish Demand to Occupy all of Valencia"
 iberiawarsvalencia.21.d:0 "When the Spanish agreed to sit at the negotiation table with us, many expected them to drive as hard of a bargain as possible. As such, they were not surprised when the Spanish delegation reached out to us with their first demand: the complete withdrawal Catalan forces from Valencia and allowing them to occupy the entire region for the duration of the War.\n\nOur delegation finds itself in a difficult position. While many delegates are hesitant to accept these maximalist demands, some demand more hawkish positions than others. Hawks say that we cannot allow ourselves to be taken advantage of by the Spanish. That we have fought with the blood of our soldiers, not theirs: it cannot have been spilled for nothing. These delegates say we must demand at least a split occupation of the region, and to make it clear that we intend to withdraw from the negotiations if that demand is not accepted.\n\nSome members are more pragmatic. They claim that we need to have the Republic on our side both during the War and after it unless we and the rest of the Galeusca nations wish to be picked off one by one. Occupying even half of Valencia would require manpower, resources and Spanish goodwill which would be better spent securing ourselves. Letting the Spanish expend their limited resources, and thanking us for the opportunity to do so, would allow us to conserve our forces and end the war with a better bargaining position.\n\nHowever, all remain wary of the maximalist Spanish attitude and do not propose that we blindly trust them to hold up their end of the bargain. They propose that if we are to accept the Spanish occupying all of Valencia, they must be made to accept a Galeusca contribution to their occupation forces. Not only will this make the Spanish occupation more palatable to the public, it will allow the Republic's 'precious allies' to keep an eye on them."
 iberiawarsvalencia.21.a:0 "The Galeusca alliance will hold the Spanish to their word."
 iberiawarsvalencia.21.b:0 "We can't have the Spanish tear our lands apart!"
 
 iberiawarsvalencia.22.t:0 "The Catalans Demand a Split Occupation"
 iberiawarsvalencia.22.d:0 "The Catalan delegation has returned to us after consulting Barcelona. Their answer is firm: Catalan soldiers died to liberate Valencia and the Catalan people still have a role to play there. They're threatening not to recognize any unilateral Spanish occupation of Valencian territory, risking the military cooperation provided for by the terms of the Anti-Fascist Cooperation Pact.\n\nOur delegates are understandably frustrated, but split on the proper response. Many believe that we should hold firm. After all, the Catalans would be near helpless without the Pact and - hopefully - they will realize this. They will have to understand that the Pact is more important to their ultimate survival than a sliver of Spanish territory. Their stance is clear: with our superior manpower, material and legitimacy we are simply far better suited to taking the strain of such an occupation while they focus on maintaining their own smaller forces, and in doing so prevent the spread of further ideas of secession Catalonia may try to foment.\n\nHowever, others call for a more conciliatory approach. Splitting the occupation might be unpopular among hawkish members of our government and public but it will help us to cement our image as a dependable, peaceful ally. It may even help prevent future friction in Iberia once the War is over and, while it is true that our resources are greater than Barcelona's, we do not possess so much as to disregard such opportunities to ensure more of it goes to the frontlines. Our magnanimity, they claim, will be richly rewarded in the long term by having the Catalans effectively subsidise our war effort, putting us in a stronger diplomatic and military position once peace returns."
 iberiawarsvalencia.22.a:0 "Catalonia is brave, but not responsible for Valencia."
 iberiawarsvalencia.22.b:0 "We cannot deny the chance for both peace and profit."
 
 iberiawarsvalencia.23.t:0 "To Be Governed"
 iberiawarsvalencia.23.d:0 "Our delegation's efforts have borne fruit. After initially demanding our forces withdraw from Valencia, we have now been informed that the Spanish are willing to commit to a split occupation and close the matter. All that is left for us to do is to formalize the agreement and end the negotiations.\n\nThe mood has been positive, our tenacious negotiators having managed to drive a hard bargain and asserting ourselves to the Spanish. They will now publicly show us to be equals, a victory not just for our Republic but all the peoples of Iberia, and the door to Valencian self-determination lies open. While there are some issues to be sorted out - border control, security cooperation, trade restrictions and the like - these are trifling details that can be discussed at a later date once the agreement itself is signed.\n\nThere remains dissent however. Some members of our delegation continue to warn against Spaniards bearing gifts, pointing out Spain's stern stance from the start. They say that the Spanish are making us accept a lesser deal while having us believe we have taken a lot. That we are being taken for fools. Despite the loss of Valencia, they argue that we must walk away from the deal to demonstrate that Catalonia cannot be manipulated through minor concessions. How will the Spanish conduct themselves in future knowing that they can easily make us think mere recognition of proper status-quos are somehow great victories? The view of this small but vocal group is clear: strength against Spain requires wisdom, and here is a true test of the Republic's."
 iberiawarsvalencia.23.a:0 "Victory! Approve the deal, with three cheers to our diplomats!"
 iberiawarsvalencia.23.b:0 "Sometimes, defeat is so nefarious that it dresses as victory. Reject the deal."
 
 iberiawarsvalencia.24.t:0 "The Spanish Refuse to Split the Occupation"
 iberiawarsvalencia.24.d:0 "It seems that our delegation's firm answer to the Spanish has been met by an equally firm response. The Spanish claim that their recognition of the Catalan government as legitimate only extends to the areas controlled by us when the Cooperation Pact was signed; that any further territory our forces take is rightfully and solely Spanish. While they do make note of and thank Catalan bravery in the liberation, they demand that we withdraw our forces from Valencia and have made it clear that they will not discuss the issue any further.\n\nIndeed, it seems that there is no more room for discussion. Many members of our delegation, furious at the apparent Spanish willingness to shed Catalan blood only to expand their own control, are prepared to walk out of the negotiations. They proclaim that there can be no recognition of the Spanish occupation of Catalan lands and no cooperation with the Spanish government, having proven itself to be untrustworthy, while it lasts.\n\nSome of our delegates, however, dispute this rage. While they too bristle at the Spanish rejection, they highlight that the justification given isn't entirely unreasonable under the terms of the Pact. Certainly not enough to disregard it. That Catalan independence, even if maimed by the lack of Valencia, is better than subjugation and the issue should have been pressed during the signing of the Pact itself. As no acknowledgement of the Catalan claim to Valencia had been drawn, is it really wise to spite the Spanish over it now? Despite the patriotic furore roused in the delegation by the Spanish rejection, these delegates warn that we simply cannot take on the Fascists alone."
 iberiawarsvalencia.24.a:0 "The Spanish can call it what they like, we recognise the stab in the back."
 iberiawarsvalencia.24.b:0 "Through gritted teeth, we must agree."
 
 iberiawarsvalencia.25.t:0 "The Catalans demand Galeusca Monitoring Mission"
 iberiawarsvalencia.25.d:0 "The Catalan delegation has agreed to our full occupation of Valencia, thankfully. While understandably unhappy they have requested a concession in order to soften the news to the Catalan public. They tell us that the Catalan public have developed a keen interest in the region; a desire to safeguard it from the return of repression, seeing it as a microcosm of the war as a whole. If we will not split the occupation, the Catalans ask that our occupation of the territory receive a Galeusca contribution.\n\nMany delegates see this as an unnecessary but harmless concession to help us rebuild bridges after straining them by refusing Catalonia. While doubts about the authenticity of the justification remain, and the fact this is transparently a monitoring mission dressed in humility, the limited nature of the request and the free resources it offers us are enough to give most pause. Not to mention the sigh of relief this will give our diplomats.\n\nHowever, it has been pointed out that the Basques and Galicians, as allies of the Catalan government, are inherently biased toward it and are unsuitable to contribute to our occupation. As aspects of the operation will be staffed by them, who under the deal will be operating in their own detachments, it could easily become a tool to undermine our occupation and foster Catalan influence under our nose. Their reach can be limited but we cannot watch these units constantly. Given the already demonstrated Catalan aggression directed at Valencia we cannot rule out intentions of foul play.\n\nA compromise candidate, the Red Cross, has been floated as a neutral party to ease Barcelona's mind as to the conduct of our occupation. If accepted, they will oversee our political efforts, reconstruction and occupation policies and freely report them. After all, if their only interest is fair treatment then on what grounds can Barcelona oppose?"
 iberiawarsvalencia.25.a:0 "Free resources and diplomatic goodwill? Approve the Galeusca contributions."
 iberiawarsvalencia.25.b:0 "An impartial body to reassure our allies should ease minds, suggest the Red Cross."
 iberiawarsvalencia.25.c:0 "They try to seize our land, now they want their friends in our blind spots? No deal."
 
 iberiawarsvalencia.26.t:0 "What about the Red Cross?"
 iberiawarsvalencia.26.d:0 "The Republic hasn't outright denied our request for some form of oversight in the region, which is a good sign. However, it's still not the answer we were hoping for. They have stated that such a Galeusca contribution could potentially bias parts of their occupation towards "minor but divisive local political movements" and could lead to instability, something they have suggested we'd surely want to avoid given our war.\n\nAs such, the Red Cross has been suggested to support their occupation instead.Some of the delegates have praised the merits of the Spanish plan, stating that while it's not ideal, the Red Cross offers a way to keep an eye on the Spanish in the region and force them to admit they can no longer act in a completely unilateral way there in future. Such a seed, while appearing minor, is just what we need to maintain Spanish acknowledgement of causes such as ours.\n\nHowever, this would eliminate most of our direct influence over the region. Therefore, many have voiced their opposition to such a settlement. We have already agreed to retreat from Valencia and have been more than reasonable in the negotiations. The Red Cross lacks the ability to assert itself the way a Galeusca contribution would and, as a non-combatant force, can be easily misdirected by the Spanish. Resultingly this 'concession' may well be little more than a thin mask for total Spanish subjugation of the region.This, it is argued, would be little more than an exploitation of our good faith."
 iberiawarsvalencia.26.a:0 "The Red Cross will do fine."
 iberiawarsvalencia.26.b:0 "No half measures."
 
 iberiawarsvalencia.27.t:0 "Nothing, Not Even a Glimpse"
 iberiawarsvalencia.27.d:0 "The Spanish response has been simple, but final. While regretting the political implications of Valencia being returned to Spain, they state that they cannot risk the stability of a Spanish region for little reason other than foreign newspaper headlines. A Galeusca contingent carries risk of frustrating the local political situation as well as distracting from the war effort of all in the Pact. They have made it clear: the occupation and rebuilding of Valencia will be a solely Spanish affair.\n\nEmotions have run high at this development, many having hoped for a compromise, and now the delegation finds itself split. While embarrassed by the Spanish refusal of their compromise, the more cooperation-motivated delegates still advocate simply accepting the situation and officialising the withdrawal. They highlight that our continued presence in Valencia will face building difficulties without legitimacy, and we do not have the resources to be frivolous.\n\nWhile our commitment to checking Spanish imperialism and fostering self-determination is without question, embroiling us in a protracted occupation without Republican support while waging war elsewhere may be a recipe for disaster, helping no one. Their call is clear: we must pick our battles.\n\nAcross from them, however, there is growing sympathy with those advocating for a maximalist stance of our own. We fight for self-determination across Iberia, and if the Spanish will stand in its way, then why should we go along with it? After all, every Catalan, Galician, or Euskadian who has fought and died thus far was one less of theirs who had to. To continue to disregard this and ignore the importance of the Galeusca cause shows the Republicans still haven't learned and don't value us as equals. The only option to maintain our position as an advocate of anti-imperialism, according to these delegates, is to walk away from the negotiations, leaving nothing signed. If the Spanish will not budge, then neither should we."
 iberiawarsvalencia.27.a:0 "Knowing when to fight and when to retreat determines ultimate victory. Sign on the dotted line."
 iberiawarsvalencia.27.b:0 "Our resolve is stronger than Spanish bluster. We won't dignify it with a signature."
 
 iberiawarsvalencia.28.t: "A Disaster Avoided"
 iberiawarsvalencia.28.desc: "Today, Vice-President Cabanillas stood in front of the press and announced, "The government would like to give a final update regarding the negotiations with the Catalan regional government regarding the occupation of Valencia." The crowd grew very quiet, knowing the next words could make or break the civil war for the republic. "After a final call last night between President Fernández and Señor Tarradellas, negotiations have concluded amicably and an agreement has been drafted that meets both parties' terms. This joint occupation has proven to Iberia that the AFCP is not just a piece of paper, but a bond between our people fighting for a common good and a future for all Iberians. The situation was always all in hand and the republic stays committed to the regional governments and the AFCP."\n\nQuestions erupted from the press about the details of the deal, how this would affect the war effort, were there going to be more split occupations, and more. The Vice-President answered to the best of his ability but, inevitably, the question arose from the crowd. "Regarding the state of regional independence following the conclusion of the civil war, has the republic made an official stance?"\n\nThe crowd immediately began to echo the same questions and before things began to spiral out of control, the Vice-President was quickly ushered off the stage under the flash of cameras.\n\nThe crowd ended the day feeling that things in the Republic were not, in fact, all in hand."
 iberiawarsvalencia.28.a: "The ink is still wet."
 
 iberiawarsvalencia.29.t:"The Future of Valencia"
 iberiawarsvalencia.29.desc:"Vice-President Barberà took the stage today to make an announcement to the press. "Late last night, the future of the joint occupation of Valencia was decided. Negotiations were hard fought, with President Tarradellas unwilling to make even the smallest compromise for our people, and the Republic has agreed fully to our terms. With this agreement signed we will, together, oversee a transition of Valencia's governance from a fascist dictatorship to a government for the people. The AFCP stands stronger, and the end of the war closer, than ever."\n\nMuch of the rest of the press conference involved detailed questions about the deal and what sort of concessions the republic had made, with the public hanging on the Vice-President's every word. For them, this was a stepping stone towards peace in Iberia and an independent future for Catalans.\n\nHeadlines noted President Tarradellas' absence from the celebrations the next day."
 iberiawarsvalencia.29.a:"The ink is still wet."
 
 iberiawarsvalencia.30.t:"The Republic, Alone"
 iberiawarsvalencia.30.desc:"The conference room was nearly empty, most of the mainstream press having been turned away for today's emergency debriefing. Cameras couldn't ask questions. In an effort to save face, neither the President, nor Vice-President was present. A nameless bureaucrat was at the podium, adjusting his tie as the dozen or so government correspondents took their places. The spokesman started speaking the moment the last person took their seat.\n\n"As of last night, the negotiations with the Catalan regional government regarding the occupation of Valencia have ceased. Catalan officials have made it clear they will accept no less than complete control over Valencia, and the Republic will not abide by another dictatorship in Iberia. As of now, the official stance of the Spanish Republic is that it is the one and only legitimate government in an Iberia overrun by fascism and extremism and we will pursue the civil war with that mindset."\n\nDevoid of questions, the crowd scratched their notepads in a fever."
 iberiawarsvalencia.30.a:"Somewhere, a receiver is smashed against a wall."
 
 iberiawarsvalencia.31.t:"Galeusca"
 iberiawarsvalencia.31.desc:"President Tarradellas stood flanked by a legion of bureaucrats, lawmakers, and soldiers. The conference room was packed with cameras and microphones capturing every angle of the speech, broadcast to every corner of Iberia. Tarradellas set his hands heavily on his podium and began to speak. "Today, the Republic of Catalonia is signing off on a significant expansion of mobilization to counter the aggressive nature of the so-called Spanish Republic. They have recently used our military alliance to occupy our city of Valencia and refused to cooperate in any sort of negotiation over its governance. They are refusing our right to govern our own people, and thus, can no longer be considered allies, but in fact, our sworn enemies. The fragile AFCP may have fallen apart, but the Galeusca pact remains strong. Together, we will bring about an Iberia devoid of dictators and monarchs. Further information on the mobilization will be coming in the following days."
 iberiawarsvalencia.31.a:"No questions, thank you."

