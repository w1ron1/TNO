 #Homefront Mechanic
 TNO_IBR_Wars_pol_mechanic_Info_tt:0 "£legitimacy_texticon §DLegitimacy§! is a measure of trust, indicating the faith which civilians under your control have in you. It must be kept as high as possible.\n\n£internal_opposition_texticon §eInternal Opposition§! is a measure of resistance, indicating the extent of rebellion within the areas you control. It must be kept as low as possible.\n\nShould your £legitimacy_texticon §DLegitimacy§! ever be lower than your £internal_opposition_texticon §eInternal Opposition§!, with the two values adding up to 100 or more, this will indicate the §Rdelegitimisation§! of your government. §xThat can only lead to doom§!.\n\n§wHomefront Commodities§! are the things needed to keep the country running. You will produce and consume given amounts per week; they can be used for decisions, but note well that their presence also has modifiers attached to them. Should you experience a deficit of §wHomefront Commodities§! - negative quantities in the reserves - you will §Rsuffer penalties§!."
