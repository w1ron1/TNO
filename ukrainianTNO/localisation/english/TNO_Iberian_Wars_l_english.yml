##Flavor Ideas

IBR_collapsing_military: "Collapsing Military Apparatus"
IBR_collapsing_military_desc: "Mass desertions plague the Iberian Armed Forces. Thousands of soldiers abandon the centralized Iberian military to instead fight for the regional armies of their homelands. Besides the desertions, which are crippling in their own right, the Armed Forces has also found themselves caught within an irreconcilable rift between reformist and hardline officers.\n\nThe two camps of officers have effectively shattered the chain of command, and now act completely independent of each other. In the streets of Madrid, Barcelona, and Bilbao, and countless other cities across the nation, chaos and banditry caused by these rogue units have become the new norm.\n\nInside El Pardo, the Caudillo of Spain sits alone. He is powerless to stop the tragedy."

IBR_Torn_Apart: "Torn Apart"
IBR_Torn_Apart_desc: "In the wake of the Basque declaration of independence, Portugal has come to realize that the Iberian Union is not long for this world. Not wishing to be dragged into the inferno alongside the Spanish, the Portuguese government instead chose to abandon the Union and try to save themselves.\n\nPortugal's departure predictably threw all sectors of the government and military into disarray. The economy had already been experiencing malaise ever since the 50s, and had fully destabilized due to the growing protests across the country. Now, the final nail has been driven into the coffin, and complete economic collapse has arrived."

IBR_last_days_nation: "Last Days of a Nation"
IBR_last_days_nation_desc: "The first Iberian Union, which spanned from 1580 to 1640, was born out of pure chance. Portugal's only viable heir just so happened to already be the King of Spain. Thus two mighty empires merged into a single personal union, creating a prosperous nation that only collapsed due to revolts.\n\nThe second Iberian Union was born not out of chance, but out of necessity. This union was supposed to allow the two nations to prosper, but alas, it was not to be.\n\nHope is dead, and over its grave lay yellow and fearful flowers. Violence has come to Iberia, born not from some external army, but instead its own people. The Iberian government has finally given up fighting for unity, and instead can only watch as the nation burns down around them."

#Decisions

## Political Decisions for Homefront 

Iberian_Wars_political_decisions_open: "   Open Political Decisions"
Iberian_Wars_political_decisions_close: "   Close Political Decisions"

Iberian_Wars_political_decisions_give_a_speech: "Give a Speech"
Iberian_Wars_political_decisions_give_a_speech_desc: "Our people must know what they are fighting for - and against."
Iberian_Wars_political_decisions_reinforce_police_patrols: "Reinforce Police Patrols"
Iberian_Wars_political_decisions_reinforce_police_patrols_desc: "Police attrition has been high as we deal with terrorists and rebels. Recruit more!"
Iberian_Wars_political_decisions_carry_out_propaganda_campaign: "Carry Out Propaganda Campaign"
Iberian_Wars_political_decisions_carry_out_propaganda_campaign_desc: "We will demonstrate the virtues of our government and the depravities of our foes."
Iberian_Wars_political_decisions_crackdown_opposition: "Crackdown on Opposition"
Iberian_Wars_political_decisions_crackdown_opposition_desc: "Deal with the protestors and the traitors within."
Iberian_Wars_political_decisions_show_gov_unity: "Show Government Unity"
Iberian_Wars_political_decisions_show_gov_unity_desc: "Joint announcements by perceived 'factions' in our government will show the fissures are not deep."
Iberian_Wars_political_decisions_investigate_civil_servants: "Investigate Civil Servants"
Iberian_Wars_political_decisions_investigate_civil_servants_desc: "Much of our bureaucracy is a holdover from the Iberian Union, make sure its loyalties are up-to-date."
Iberian_Wars_political_decisions_expand_administration_powers: "Expand Administration Powers"
Iberian_Wars_political_decisions_expand_administration_powers_desc: "Wartime has signficant exigencies. Our formal role will grow to meet them."
Iberian_Wars_political_decisions_promote_war_bonds: "Promote War Bonds"
Iberian_Wars_political_decisions_promote_war_bonds_desc: "War bonds are a patriotic exercise and, given our limited available funds and ever-growing demand, a necessity."

#Homefront Commodity Decisions for Homefront
Iberian_Wars_homefront_commodities_decisions_open: "   Open Homefront Commodity Decisions"
Iberian_Wars_homefront_commodities_decisions_close: "   Close Homefront Commodity Decisions"

Iberian_Wars_homefront_commodities_decisions_relax_rationing: "Relax Rationing Policies"
Iberian_Wars_homefront_commodities_decisions_relax_rationing_desc: "Our stockpiles are in sufficient state that we can improve morale by increasing consumption."
Iberian_Wars_homefront_commodities_decisions_harshen_rationing: "Harshen Rationing Policies"
Iberian_Wars_homefront_commodities_decisions_harshen_rationing_desc: "Time to tighten our belts, so at least there'll be something in the stockpiles tomorrow."
Iberian_Wars_homefront_commodities_decisions_liquidated_useless_assets: "Liquidate Useless Assets"
Iberian_Wars_homefront_commodities_decisions_liquidated_useless_assets_desc: "Much of the material we have on hand bears no relation to immediate survival. Swap it for what we need."
Iberian_Wars_homefront_commodities_decisions_reorganize_occupied_assets: "Reorganize Occupied Assets"
Iberian_Wars_homefront_commodities_decisions_reorganize_occupied_assets_desc: "We're seizing material and facilities faster than we can productively use them. Let's dispatch a team of officials to change that."
Iberian_Wars_homefront_commodities_decisions_oranganize_agri_loans: "Organize Agricultural Loans"
Iberian_Wars_homefront_commodities_decisions_oranganize_agri_loans_desc: "Our fields cannot fall fallow for lack of fertilizer. Our farmers will be dispatched the emergency credit they need."
Iberian_Wars_homefront_commodities_decisions_empower_gov_control_over_industry: "Empower Government Control over Industry"
Iberian_Wars_homefront_commodities_decisions_empower_gov_control_over_industry_desc: "Regardless of our feelings toward the private sector, we must direct our scarce manufacturing capacity toward wartime objectives."

#Economic Decisions for Homefront

Iberian_Wars_economic_decisions_open: "   Open Economic Decisions"
Iberian_Wars_economic_decisions_close: "   Close Economic Decisions"

Iberian_Wars_economic_decisions_relax_industrial_regulations: "Relax Industrial Regulations"
Iberian_Wars_economic_decisions_relax_industrial_regulations_desc: "Pollution will kill our citizens far slower than enemy bullets. Waive whatever rules we can."
Iberian_Wars_economic_decisions_focus_on_civ_production: "Focus on Civilian Production"
Iberian_Wars_economic_decisions_focus_on_civ_production_desc: "With plans proceeding at the front, we must ensure that popular needs are met to avoid unrest breaking out behind our lines."
Iberian_Wars_economic_decisions_focus_on_mil_production: "Focus on Military Production"
Iberian_Wars_economic_decisions_focus_on_mil_production_desc: "Converting facilities to supply our troops will end the war faster. Such a goal is worth any temporary pain."
Iberian_Wars_economic_decisions_approve_industrial_expansion_plan: "Approve Industrial Expansion Plan"
Iberian_Wars_economic_decisions_approve_industrial_expansion_plan_desc: "Our stockpile must go towards expanding our production capacity."
Iberian_Wars_economic_decisions_expand_key_location_stocks: "Expand Key Location Stocks"
Iberian_Wars_economic_decisions_expand_key_location_stocks_desc: "Disseminating our goods along the front will allow rapid resupply and decisive pushes."
Iberian_Wars_economic_decisions_tackle_inflation: "Tackle Inflation"
Iberian_Wars_economic_decisions_tackle_inflation_desc: "Price controls and strategic imports agreements should curb the worst of the inflation we're experiencing."
Iberian_Wars_economic_decisions_encourage_spending: "Encourage Spending"
Iberian_Wars_economic_decisions_encourage_spending_desc: "Businesses are collapsing due to lack of domestic demand. Reassure our citizens so that their funds are put to use."
Iberian_Wars_economic_decisions_negotiate_with_debtors: "Negotiate with Debtors"
Iberian_Wars_economic_decisions_negotiate_with_debtors_desc: "Our bargaining position may be poor, but if debtors' penny-pinching allows our government to be destroyed... we both lose."
Iberian_Wars_economic_decisions_redirect_fuel_use: "Redirect Fuel Use Towards the Military"
Iberian_Wars_economic_decisions_redirect_fuel_use_desc: "Civilian cars, tractors, and factories will slow so that our military can roll onward!"

