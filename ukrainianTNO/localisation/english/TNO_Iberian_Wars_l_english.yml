#Events for Regional Event Chain

Iberian_Wars_region_alliance.1.t:0 "An Unholy Alliance"
Iberian_Wars_region_alliance.1.d:0 "They stood around a table, an older oak creation brought in from a meeting room just as the civil war began. A creased map of Iberia was laid out, dotted pins marking the location of divisions with yellow strings marking the frontlines. The men stood, their thoughts filled with war.\n\n"Unfortunately, issues surrounding availability of trained soldiers have persisted." said Brigadier General Alejandro Obrero, looking at the map in front of him with concern. "Militia and local conscripts plug gaps, but we will struggle to move forward without trained men. If we concentrate them we risk a collapse if we're attacked elsewhere."\n\n"Indeed," responded Colonel Conejero, grabbing a pencil and pointing it toward a gap in the Junta's string. "This gap could very well be pivotal in advancing; we need to attack before it can be closed."\n\nObrero nodded, musing. "The Junta is not fated to be strong." His eyes flicked over Galicia, Catalonia and the Basque. "They're overstretched, fighting on numerous fronts with separatists and are struggling to quash partisans. We could gamble on an offensive."\n\nBrigadier General Lago looked again at the front, stroking his chin in thought, lifting it as he spoke. "But risk our frontline in the process. Perhaps... we could ally with those separatists?" A few generals lifted their eyebrows, out of curiosity more than rejection. "If we coordinate, the force multiplier could allow us to move our soldiers where we need them without fearing counter-attack elsewhere. A multiple front offensive would guarantee us the initiative."\n\nObrero frowned, struggling to find an alternative. "Possibly," he replied begrudgingly, "but we can't advance such a proposal unilaterally.""
Iberian_Wars_region_alliance.1.a:0 "And so, the notion was kicked down the road by a few days more."

Iberian_Wars_region_alliance.2.t:0 "Coalition of the Willing?"
Iberian_Wars_region_alliance.2.d:0 "It was late in the day, the sunset filtering in through a window obscured by a series of dark grey clouds. Torcuato Fernández-Miranda buried his head for a moment. Suggestions of a potential alliance with the separatist republics had circulated in a handful of meetings, but had been advanced with only the deepest caution and, admittedly, delayed as long as they could.\n\n"If we go ahead with this plan, then we have to be careful." said Pío Canabillas, looking at the notes in front of him with suspicion. "Catalonia in particular might pressure us to move out of Valencia. These are people who see little difference between us and Franco."\n\nJosé Maldonado sighed as he read through, shaking his head at both the prospect and comments. "All of them will believe that any Spanish government, fascist or democratic, would seek reintegration by any means necessary."\n\n"So, we should recognise their independence?" asked Fernández-Miranda, his voice growing quieter, more downtrodden. "After all, unless we prevail there's a Sword of Damocles over us all, separatist or not. Let's be candid, does this help us win the War?"\n\nJosé Miguel Vega Rodríguez leant forwards. "My officers all agree it would benefit us, allowing us to better allocate men and resources." He shrugged. "We would have a better idea where their soldiers are and, overly simplified, can count on more men to attack them."\n\nNodding at the comment but maintaining a blank expression, Maldonado cleared his throat to interject. "If there's no opposition to this, I'll propose a cooperation pact as soon as we establish regular contact with them.""
Iberian_Wars_region_alliance.2.a:0 "Let us only hope that this isn't a truly Faustian bargain."

Iberian_Wars_region_alliance.3.t:0 "Cooperation Pact - Basque Response"
Iberian_Wars_region_alliance.3.d:0 "FROM: Ministry of Foreign Affairs\n\nTO: Prime Minister Torcuato Fernández-Miranda\n\nTOPIC: Negotiations with the Republic of Euskadi\n\nCLASSIFIED\n\nEfforts to establish relations with the Republic of Euskadi have faced numerous difficulties. Established phone lines between Seville and Bilbao have long since been cut, and any links remaining have to rely on either connections through France, which remains relatively hostile to Basque independence, or Galicia. In order to establish firm communications, a mixture of both have been used, though greater priority has been placed on strengthening contact links through Galicia, which will likely remain more reliable.\n\nThe Republic of Euskadi is the most established of the separatists, but there are still internal concerns. Although there is staunch support for independence within the Basque Country itself, Navarra is much more split, with a much larger Spanish population and a higher proportion of supporters for the Junta who fear reprisal. Meanwhile, the government is internally split between right-wing and left-wing nationalists, and would likely buckle without the unifying presence of Lehendakari Telesforo Monzón.\n\nDespite this, there is general interest in forging an anti-Fascist Cooperation Pact. Beyond general demands for recognition and general caution in negotiating with a Spanish government, there doesn't seem to be much opposition to the formation of an alliance. Though they requested the opportunity to have broader meetings on the issue, Monzón has rejected any firm commitments until being able to contact Tarradellas and Velo about the issue. We will likely have to take their views into account as well."
Iberian_Wars_region_alliance.3.a:0 "- José Maldonado"

Iberian_Wars_region_alliance.4.t:0 "A Deal with the Devil? - To Vigo"
Iberian_Wars_region_alliance.4.d:0 "Xosé Velo looked down at the receiver in front of him, a strangely shaped and triangular device, as he cradled a phone in one hand. Discussions between his government and the Republican Spanish government in Seville had been ongoing for the past few days and he had been approached with a deal. If Velo was more naive, he wondered, he might have taken it at face value.\n\n"Well, it's a good sign that Fernández-Miranda is willing to approach us." said the voice of Tarradellas, garbled by distance and infrastructure. "We shouldn't treat this as unworthy of our backing."\n\nVelo frowned as he heard the comments. "Of course, this is a positive step, but there's a lot further for him to go." A few aides passed by him, placing down brief memos on the movement of Junta troops. "I agree with this in principle; a strong Republic could help end the war quicker, and to keep it a strictly Spanish affair. It could be the only way for us to survive during the war, but beyond it? How can we trust they don't view us as junior partners? It's only going to hurt our claims to independence in the long-term."\n\nA period of silence followed, but was subsumed as Tarradellas finally replied. "I do understand those concerns." The voice sounded slightly quieter than before, and occasional noise filtered through in the form of targeted static. "Perhaps it could work if we officially make our demands unilateral through the formation of a direct political alliance?"\n\nAnother voice crackled into barely audible life, this time from Telesforo Monzón. "That would be a wise move. Our ties are already strong enough, and already allow for some coordination. We must be assertive in such a position, and push the Republic into officially recognising us as independent before we sign any such pact." Velo considered the measure for a moment, but only long enough to fully consider the consequences before agreeing."
Iberian_Wars_region_alliance.4.a:0 "The die is cast."

Iberian_Wars_region_alliance.5.t:0 "Cooperation Pact - Catalan Response"
Iberian_Wars_region_alliance.5.d:0 "FROM: Ministry of Foreign Affairs\n\nTO: Prime Minister Torcuato Fernández-Miranda\n\nTOPIC: Negotiations with the Galician Republic\n\nCLASSIFIED\n\nEfforts to establish communications with the Catalan capital of Barcelona were made with little difficulty. Although there is still some distance in our frontlines, the Junta having cut existing phone lines between Seville and Barcelona, the Baleares have remained a viable alternative that whilst not completely without flaw, have remained mostly reliable. There may be some risk of the line being cut should naval activity resurge or become targeted, but that is unlikely at the present time.\n\nCatalonia has some issues internally. Support for independence is very high, but the war cabinet was only formed at the last minute. It seems to be mostly functional, with a broadly, but not entirely left-wing outlook, but the long period of exile for many has hampered the popularity of the government, and its abilities to adapt to pressures within Catalonia, both relating to social issues and to the issue of Pancatalanism.\n\nOverall, efforts to forge an Anti-Fascist Cooperation Pact are fruitful, but have come up short. The issue of Pancatalanism, and of annexing both Valencia and the Baleares has decreased overall interest in forming a public alliance, but overall support remains nonetheless, even if only whilst the Junta remains an active factor. Though they requested the opportunity to have broader meetings on the issue, Velo has rejected any firm commitments until being able to contact Tarradellas and Monzón about the issue. We will likely have to take their views into account as well."
Iberian_Wars_region_alliance.5.a:0 "- José Maldonado"

Iberian_Wars_region_alliance.6.t:0 "A Deal with the Devil? - To Barcelona"
Iberian_Wars_region_alliance.6.d:0 "Josep Tarradellas looked at the three-pronged device in front of him, a receiver dedicated to staging conference calls. Since Catalonia had received its independence, it had become a constant, discussions with the other separatist republics punctuated by negotiations with cabinet ministers split on the issue of Pancatalanism. Discussions between his government and the Republican Spanish government in Seville had been ongoing for the past few days, and he had been approached with a deal.\n\n"Well, it's a good sign that Fernández-Miranda is willing to approach us." he said, looking around as a few aides passed him. With how divided his cabinet was, he didn't want to risk making any firm moves on a deal. "We shouldn't treat this as unworthy of our backing."\n\n"Of course, this is a positive step, but there's a lot further for him to go." protested Xosé Velo, his line sputtering to life through a dense haze of static. I agree with this in principle; a strong Republic could help end the war quicker, and to keep it a strictly Spanish affair. It could be the only way for us to survive during the war, but beyond it? How can we trust they don't view us as junior partners? It's only going to hurt our claims to independence in the long-term."\n\nTarradellas struggled to set the assertion aside. Galicia's position was particularly tenuous, but he could not ignore the risk that Galician integration would only serve as precedent for integrating the other two separatists. As the final aide left, he lifted the phone from his ear as he asked her to stop others from entering. "I do understand those concerns. Perhaps it could work if we officially make our demands unilateral through the formation of a direct political alliance?"\n\nThe voice of Telesforo Monzón came to life, garbled though it was. "That would be a wise move. Our ties are already strong enough, and already allow for some coordination. We must be assertive in such a position, and push the Republic into officially recognising us as independent before we sign any such pact." Tarradellas considered the proposal, and then smiled as he came to accept it."
Iberian_Wars_region_alliance.6.a:0 "The die is cast."

Iberian_Wars_region_alliance.7.t:0 "Cooperation Pact - Galician Response"
Iberian_Wars_region_alliance.7.d:0 "FROM: Ministry of Foreign Affairs\n\nTO: Prime Minister Torcuato Fernández-Miranda\n\nTOPIC: Negotiations with the Galician Republic\n\nCLASSIFIED\n\nEfforts to establish contact with the Republic of Galicia were relatively difficult but have succeeded. The distance between our territory and that of the Galician capital in Vigo necessitates the use of telephone connections within Portugal. Most existing telephone connections go through the territory of the Junta, and have already been cut. That being said, those existing lines in Portugal are functional, and should remain as such for the foreseeable future.\n\nThe Galician Republic seems to have some difficulty with legitimacy. Although large portions of the population remain steadfast in opposing Franco, there seems to be less interest in forming an independent Galician state and the government that does exist was only formed at the last minute. This may provide some difficulty for it to resist pressure from the Junta, but such issues will likely be resolved by specifically focusing a joint coalition's message as being anti-fascist.\n\nOverall, efforts to forge an Anti-Fascist Cooperation Pact are fruitful, but have come up short. Beyond rallying support within Galicia, exploiting a major weakness in the frontlines of the Junta is a prospect that Prime Minister Xosé Velo and Councillor Ramón Otero Pedrayo seem to be particularly interested in. However, although they requested the opportunity to have broader meetings on the issue, Velo has rejected any firm commitments until being able to contact Tarradellas and Monzón about the issue. We will likely have to take their views into account as well."
Iberian_Wars_region_alliance.7.a:0 "- José Maldonado"

Iberian_Wars_region_alliance.8.t:0 "A Deal with the Devil? - To Vigo"
Iberian_Wars_region_alliance.8.d:0 "Xosé Velo looked down at the receiver in front of him, a strangely shaped and triangular device, as he cradled a phone in one hand. Discussions between his government and the Republican Spanish government in Seville had been ongoing for the past few days and he had been approached with a deal. If Velo was more naive, he wondered, he might have taken it at face value.\n\n"Well, it's a good sign that Fernández-Miranda is willing to approach us." said the voice of Tarradellas, garbled by distance and infrastructure. "We shouldn't treat this as unworthy of our backing."\n\nVelo frowned as he heard the comments. "Of course, this is a positive step, but there's a lot further for him to go." A few aides passed by him, placing down brief memos on the movement of Junta troops. "I agree with this in principle; a strong Republic could help end the war quicker, and to keep it a strictly Spanish affair. It could be the only way for us to survive during the war, but beyond it? How can we trust they don't view us as junior partners? It's only going to hurt our claims to independence in the long-term."\n\nA period of silence followed, but was subsumed as Tarradellas finally replied. "I do understand those concerns." The voice sounded slightly quieter than before, and occasional noise filtered through in the form of targeted static. "Perhaps it could work if we officially make our demands unilateral through the formation of a direct political alliance?"\n\nAnother voice crackled into barely audible life, this time from Telesforo Monzón. "That would be a wise move. Our ties are already strong enough, and already allow for some coordination. We must be assertive in such a position, and push the Republic into officially recognising us as independent before we sign any such pact." Velo considered the measure for a moment, but only long enough to fully consider the consequences before agreeing."
Iberian_Wars_region_alliance.8.a:0 "The die is cast."

Iberian_Wars_region_alliance.9.t:0 "Galeusca"
Iberian_Wars_region_alliance.9.d:0 "Xosé Velo sat in his sunlit office, face covered in makeup with cameras and microphones crowding out his desk and cabinets. This was their only chance. A bit of discomfort was tolerable in the pursuit of freedom.\n\n"Men and women of Galicia. I am addressing you today to proclaim a new, noble alliance of the long-oppressed peoples of Iberia. The Union is no more and the governments of Spain and Portugal are in disarray. As Galicians, this is our opportunity to seize our place in the family of free peoples, along with our Catalan and Basque compatriots."\n\nJosep Tarradellas stood in front of the assembled quorum in the richly decorated hall of the Palace of Parliament, proudly preparing to reveal one of his greatest achievements since independence.\n\n"Esteemed members! We never faltered in our commitment to freedom and national self-determination for Catalunya, even during the darkest oppression and despair. However, we are a small nation; our backs to the sea and a foe that is still determined to see us subjugated once and for all. So, we have decided to unite with the newly liberated peoples of Iberia in a military alliance. I am certain that with our combined might, we will assert ourselves as beacons of hope for all oppressed peoples."\n\nTelesforo Monzón stood on a large podium in Bilbao, addressing the crowds with tears in his eyes. This was not 1936 anymore. So many were gone. But sometimes, he reckoned, life is kind enough to give a second chance. "Basques! We were the first to rise up, after so many years of tyranny. We haven't forgotten the martyrs of the first civil war, and now we have another chance. A chance to avenge them; make the dream they died for reality. We welcome any of the free people of Iberia to aid us in our struggle, to make this land that so many have died for into one worth living for.""
Iberian_Wars_region_alliance.9.a:0 "Three nations, one hope."

Iberian_Wars_region_alliance.10.t:0 "Cutting off the Gangrenous Limb"
Iberian_Wars_region_alliance.10.d:0 "Foreign Minister José Maldonado closed the door behind him, clearly flustered. He shook his head, stood up straight, and walked to the Cabinet table. All eyes were fixed on him. "Apologies, gentlemen. Busy day."\n\nPresident Fernández quietly gestured for Maldonado to take his seat, before addressing the table. "Gentlemen, as stated in the summons, we need to discuss our response to the alliance between the Basque, Catalan and Galician republics. I trust you have all considered potential positions? This is a development we cannot leave unanswered. Señor Maldonado has requested an opportunity to put some further considerations before us before we continue."\n\nMaldonado sighed and took out his notes, muttering under his breath before finding the right page. "Let us not mince words here: this decision by the breakaway governments has put us in quite the difficult spot. We are supposed to save Spain, not dismember it. Furthermore, this agreement also means that we can't sign separate pacts with the governments - it's recognizing all three or falling out with them all. This means they will be able to demand more of us, as they now represent a sizable unified force. This wedge may... complicate the undertaking of the Anti-Fascist Cooperation Pact."\n\nFernández nodded quietly, before turning to Defense Minister José Rodríguez. "Your thoughts, General?"\n\nRodríguez immediately began talking, as if concerned someone might try to sneak in an argument before him. "With all due respect, President Fernández, this is too important for us to throw aside. Politics can come later - for now, military necessity must be prioritized. That necessity is to sign the AFCP, even if that means recognition. We need to bolster our forces, and they know they can't defeat the fascists without us;that they will lose everything by losing this alliance. We have to maintain the negotiations.""
Iberian_Wars_region_alliance.10.a:0 "The council slowly agreed."

Iberian_Wars_region_alliance.11.t:0 "Trapped with Each Other"
Iberian_Wars_region_alliance.11.d:0 "The cabinet meeting next morning was no less contentious. A decision on the recognition of the regional governments had not been reached; time was running out to lock down a valuable alliance - or so one side of the room claimed. Many others saw little but dismemberment of Spain, a faustian bargain.\n\nMaldonado leaned forward, sighing as he again waved the papers in his hand. "Our counterparts in the governing structures of the breakaway regions have made it quite clear that no alliance with our government is possible without our recognition of their legitimacy. They demand their national rights be vindicated and that we commit to respecting them as sovereign governments".\n\nPresident Fernández sighed and nodded, glaring at the ministers. "This has gone in circles too long. We need a decision." All eyed each other. None wished to repeat yesterday's argument, but such verbal carnage seemed inevitable. Arguments began to creep into their throats once more.\n\n"I have an idea - it's not perfect, but it might be our best option".\n\nAll eyes turned to Vice-President Cabanillas as he rose from his seat. "In this war, we need any advantage we can get. Bolstering our forces and extending our enemy's line is just that, but we can't be pushovers. So, when is a promise not a promise? We differentiate legitimacy and independence. We recognize them as legitimate administrations but leave the question of independence for after the war, when we can discuss the condition of Spain properly. The people now are frightened, our nation is in chaos and we have all heard the stories of the barbarity being committed by our enemies. The people should consider such a question only when peace returns and they aren't subjected to regionalist slogans playing on their fears. As for the separatists? They may not like it, but they'll know that this is the best chance they'll have.""
Iberian_Wars_region_alliance.11.a:0 "One by one, the ministers nodded."

Iberian_Wars_region_alliance.12.t:0 "The Spanish Counteroffer"
Iberian_Wars_region_alliance.12.d:0 "Velo reached gingerly for the phone. He had waited for this call for a few days, but the mere idea of negotiations with the Spanish government was unnerving. As necessary as it was, signing an agreement with the imperialists made his stomach churn. But, it had to be done.\n\n"Señor Fernández?" Velo answered as nonchalantly as he could. He would not give the Spanish leader the satisfaction of addressing him as President. Recognition would have to be mutual.\n\n"Señor Velo. The Spanish Republic has taken note of your alliance with the other separatist regions. Out of a desire to maintain good relations across the peninsula and with an eye to possible military cooperation, the government proposes the following..." Fernández sounded like he was reading off a script. Perhaps he was. Velo bristled at some of the terms used, but official talk was official talk- it helped Velo restrain the disdain that burned at every half spoken implication or euphemism. Velo swallowed his response and waited.\n\n"We offer to recognize the governing authorities of the three regions as separate governments, whose exact relationship with the Spanish Republic will be determined by popular referendums after the victorious conclusion of the War. While it lasts, the Spanish government will endeavor towards cooperation, for the better prosecution of the war effort." Fernández's voice seemed to darken, "I think we are both aware of the alternative in this war. Is this agreeable to you?"\n\nVelo paused, the question hanging over the phone line. The Galeusca alliance had demanded immediate recognition of independence and he didn't trust the Spanish to hold their side of the bargain, especially as the war ended. But did they really have a choice? This was likely the best offer they were going to get, and if the alternative was to fight the fascists alone..."
Iberian_Wars_region_alliance.12.a:0 ""You hold up your end Spaniard, and we'll hold up ours. We'll be watching.""

Iberian_Wars_region_alliance.13.t:0 "The Spanish Counteroffer"
Iberian_Wars_region_alliance.13.d:0 "Monzón reached out for the phone. The idea of negotiating with the Spanish for Euskadi's independence left a bitter taste in his mouth but this was too important. He gripped the receiver tightly. "President Fernández?"\n\n"Señor Monzón-" The Spanish President began, before his counterpart interjected. "You mean President Monzón. We negotiate as equals or not at all."\n\nThe voice was silent for a moment. "...Yes. I was intending to let you know that the Spanish Republic has taken note of your alliance with the... leaders of the Catalan and Galician regions. We wish to maintain cordial relations with all of you and cooperate against the fascists and, because of that, we have a proposition for you."\n\nMonzón could hear the condescension in the Spaniard's voice. Typical Spanish arrogance. Thinking that they could just enforce terms on his people's very existence. But, he had to admit, his people's very existence was at stake here. His knuckles whitened around the receiver as he mustered every bit of his diplomatic skill. "Go on"\n\n."We propose recognizing your governing authorities as separate governments, whose exact relationship to us will be determined by popular referendums after the war-"\n\nMonzón interjected once more. "How can we trust that you won't just take us over once the war is over? How can we trust that this referendum will even take place, or that you won't rig it? I'll put it simply - I don't trust you."\n\n"You don't have to cooperate," the voice on the other side stiffened. "Go alone if you want. But then it's you, surrounded on all sides, with no one to help you. I know who I'd take my chances with if I were you. This doesn't have to be about trust.""
Iberian_Wars_region_alliance.13.a:0 "Monzón frowned. "Tell me more about that cooperation you mentioned.""

Iberian_Wars_region_alliance.14.t:0 "The Spanish Counteroffer"
Iberian_Wars_region_alliance.14.d:0 "Tarradellas reached for the phone. This call was a few days in the making, but he had already made up his mind. He was not going to betray Catalan interests to the Spanish but this agreement was, all things considered, a Catalan interest. "President Fernández?"\n\n"Señor Tarradellas, it is good to speak with you." Tarradellas' frowned slightly at not being referred to as President, but he let it slide. This agreement was more important than his title. These things could wait for after the war. "The Government of the Spanish Republic has taken note of your alliance with the other separatist regions. We'd like to maintain cordial relations across the peninsula, and cooperate against the fascists, in whom we have a shared enemy. In order to facilitate that, we have a proposition for you."\n\nTarradellas noted his counterpart's tone, formal but rather relaxed. He could imagine that his conversations with the Basque and Galician leaders were more stressful and was happy to be the voice of reason in these circumstances.\n\nFernández continued. "We offer to recognize the governing authorities of the three regions as separate governments, whose exact relationship with us will be determined by popular referendums after we win the War. Until then, we'll make sure to concretely cooperate with these governments and make sure we do, in fact, win. What do you think?"\n\nTarradellas leaned back in his chair. Velo and Monzón would no doubt have gritted teeth over this, but to him this sounded quite reasonable. With their back to the sea, the Catalan government was in no position to refuse a hand offered in help, particularly if it was counterbalanced by the Galeusca agreement. If this was the best they were going to get, he thought, Catalonia could definitely live with that."
Iberian_Wars_region_alliance.14.a:0 ""I think that sounds quite reasonable, Señor Fernández.""

Iberian_Wars_region_alliance.15.t:0 "Cooperation, if You Can Keep it"
Iberian_Wars_region_alliance.15.d:0 "SEVILLA. - President of the Spanish Republic Torcuato Fernández-Miranda has today signed the Anti-Fascist Cooperation Pact, heralding a new era of cooperation with the Basque, Catalan, and Galician regions. Speaking to reporters in the Provisional Government Palace, his excellency proclaimed that the prospects of a quick and victorious conclusion to the war have now dramatically increased, as well as those of a peaceful resolution of the national question in Iberia afterwards...\n\nBILBAO. - ...In a speech after signing the pact, Xosé Velo has touted the agreement as necessary in the face of fascist aggression, expressing his hope that it will help cement the freedom the people of Galicia have regained after so long, along with that of the other liberated nations on the peninsula. He has also stated that, while the Spanish have promised to cooperate militarily and politically during the war and after it, it is his mission to make sure that the Galician resistance, in collaboration with Catalonia and the Basque Country, hold them to that promise...\n\nBARCELONA. - ...Speaking to the press after the fact, President Tarradellas proclaimed: "Today, we have truly taken our place among the family of peoples. This agreement will aid us in defeating the fascists who wish to swallow us once more, and help bring forth an era of friendly relations among the peoples of Iberia, one where we are treated on an equal footing..."\n\nVIGO. - ...In a radio and television broadcast following the ceremony, President Monzón addressed the Basque nation, remarking: "This pact marks a significant step in our rise as a true people, no longer the lapdogs of foreign conquerors but a sovereign people whose fate is determined by itself alone". He has also claimed that while this agreement is an important milestone, it is not the end of the struggle: the war must be fought to a successful conclusion and the liberated peoples of Iberia must hold the Republican Spanish government to its word, with all of the means at their disposal..."
Iberian_Wars_region_alliance.15.a:0 "Perhaps diplomacy isn't dead."

#####################################Flavor events
iberiawars_cityfall.1.t:0 "Fall of Girona"
iberiawars_cityfall.1.d:0 "Only the sound of heavy panting rang in the dark of the basement.\n\nA few days earlier, they had been prisoners of the People's Army. They had made the mistake of being too open about their anti-socialism during the early days of the War, be that motivated by political or moral motives. The room contained people who would have found homes in nearly every faction in Spain.\n\nThey had been thrown into the dark some days earlier, why they weren't sure. Their captors had told them to be quiet, for their own sake, and wait. Since then they had heard terrible crashes from above and the dull poundings of war. No one had come. Nothing entered the room.\n\nThey had fumbled up the steps and tried to open the door, but it would not budge. They felt the walls trying to find an escape, all they found was a once moist pipe. They tried to adjust their eyes to see if there was any way for air to enter. The inky void before them could not be penetrated.\n\nSpent, all they could do was think - and the thoughts tormented them. Reflections on past mistakes. Choices made. Memories of what salvation lay only meters away, and yet was unreachable. Those that were parents had it worse as they realized they began to desire seeing sunlight again more than their own children. In that basement, the dark held only regrets and shame.\n\nBreathing was heavy, and those that fell over bodies in the dark knew that some had already succumbed. Those that remained began to simply sit motionless, feeling their mouth dry and cradling their bloodied fingertips raw from clawing at the door and walls. They wondered if their ideals had been worth the cost. Wondered why their captors had never come back."
iberiawars_cityfall.1.a:0 "Wondered why they had to die."

iberiawars_cityfall.2.t:0 "Liberation of Girona"
iberiawars_cityfall.2.d:0 "TOP SECRET\n\nCOMMUNIQUE TO THE WAR MINISTER: FOR IMMEDIATE ATTENTION\n\nSir\n\nGirona has fallen, dealing a large blow to separatist strength in Northern Catalonia. Security forces are now beginning the slow process of preparing the city for post-separatist rule. There exist 4 notable obstacles\n\n1: There is evidence many of the city's defenders, as well as a variety of citizens, fled into the mountains near the French border. Reports on their organization are contradictory but the basic fact seems clear.\n\n2: Thanks to the prior described exodus, there remains strong paramilitary resistance in the North and West regions near the city. Safe transport via these routes is impossible.\n\n3: Hostile elements remain in the city, but contained. Due to them using cultural landmarks as shields we do not wish to use overwhelming force.\n\n4: Manpower shortages mean we cannot tackle the paramilitary problem as well as these sieges. As such firm attacks are recommended to free men for counter-terrorims action rather than protracted sieges.\n\nThe civilian population remains split, with dissidents still being present. Political prisons are being discovered in buildings, in some cases with the inhabitants already dead. Arrests are made as much as conditions allow, these found prisons being incorporated into our detainment resources, however we require clarification on the long term solution as our detainment centers approach overcrowding quickly.\n\nGeneral Carlos Fernández, Head of Military Security District Catalonia."
iberiawars_cityfall.2.a:0 "Peace, with all its severity, returns to Girona."

iberiawars_cityfall.3.t:0 "Fall of Toledo"
iberiawars_cityfall.3.d:0 "The Primatial Cathedral of Saint Mary of Toledo had been noted, in more peaceful times, for having a design that accentuated noise. Every cough, scrape and whispered voice sounded with unusual volume.\n\nToday however, the sounds were not those of peaceful services. The loud crashes of explosions from outside penetrated the stone walls and rang. Believers and non-believers all were cramped into the chapels of the Cathedral. To step through the doors to the city was to step into an inferno as the latest bombardment reduced all they knew to rubble. Those huddled into the Cathedral hoped that either God or the strong walls would protect them.\n\nIn the main chapel, many prayed. Some cried, children and adults both. Some just sat in dazed silence, ignoring the nervous conversations of those around them. The large building was lit with numerous candles, thanks to the Cathedrals large stores. The dim candlelight illuminated the golden ornaments and momentous arches. The frequent flashes through the stained windows added to the light, but did little to comfort the scared people below. Instead, they prayed that the dimness of the candlelight would be all the light there was.\n\nWithin moments it ended however. The Cathedral itself violently shook and all were thrown to the floor. The sounds of an explosion, far louder than those preceding, hung in the air. For just a moment, things stood still. Then came a crack that reverberated off the aged stones. A few in the Main Chapel had a chance to look up, to see the once beautiful ceiling fracture and fall."
iberiawars_cityfall.3.a:0 "God has left Toledo."

iberiawars_cityfall.4.t:0 "Liberation of Toledo"
iberiawars_cityfall.4.d:0 "TOP SECRET\n\nCOMMUNIQUE TO THE WAR MINISTER: FOR IMMEDIATE ATTENTION\n\nSir,\n\nToledo has been liberated from rebel control. Central Spanish position boosted as rebels have lost major logistical and defensive stronghold.\n\nUrban rebel forces well prepared. Indirect fire tactics and shock offensives utilized. High amounts of organized and irregular combatants present.\n\nDamage to the city is high. Assessments on available housing ongoing - projections suggest majority loss in high density areas. Civilian casualties high. Guerilla attacks persist. High number of displaced civilians complicating current military arrangements. Prisonersbeing documented. Identified prisoners of interest relocated for enhanced interrogations. Citizens and Prisoners being used in corpse disposal and other labor under supervision.\n\nRequest urgent delivery of artillery ammunition. Rear units required to set up monitored refugee facilities. Rations and medical equipment required to replace unexpected civilian expense.\n\nGeneral Fernando Cabrera, Head of Military Security District Center."
iberiawars_cityfall.4.a:0 "If the rebels should hide, we shall use our might to reveal them to our sun."

iberiawars_cityfall.5.t:0 "Fall of Porto"
iberiawars_cityfall.5.d:0 "Ayden had the best of the war thus far. He had been lucky enough to avoid the worst of the fighting, and had spent the war doing eventless patrols, dull sentry duties and just generally looking tough. The push for Porto had been little different.\n\nHis squad was filled with fellow residents of Lisbon. Tomás, Daniel, Eduardo and Marco. Dubbed miscreants by some, traders by others, their stock was whatever they found. It had been a fruitful skill to discover during the War, and their foraging abilities had always seen them land in safe spots. After all, even generals wanted to taste the spoils of war; why not have an arrangement with the men that could facilitate it - for a reasonable price?\n\nToday they were looking over a warehouse on the outskirts of the city, unmarked and mysterious. Ayden wanted to break in but the others were unsure. Was it worth the effort? Their loud deliberations ceased when a decrepit old man appeared wielding an aged shotgun.\n\n"Thieves! Stay away from my wine!" he cried, as he fired a shot. The recoil knocked the man back and he moaned as the force struck his fragile shoulder. The shot flew over the squad's head and they gave no thought as they calmly shouldered their rifles and shot the man dead as he struggled to regain his feet.\n\n"So, wine. Should have known, city is famous for it. Must be good if the old idiot will die for it".\n\nThe squad, satisfied there was business, commenced breaking down the door. Later friends of theirs came with trucks, and the barrels inside all disappeared.\n\nThe old man lay there. As the trucks left, the last life to grace that building for some time, none spared him a glance."
iberiawars_cityfall.5.a:0 "The ignominious end of an unknown story."

iberiawars_cityfall.6.t:0 "Liberation of Porto"
iberiawars_cityfall.6.d:0 "For the Attention of the Council of Ministers,\n\nGentleman,\n\nIt is my pleasure to declare that Porto has been secured by our forces. As one of the largest cities within our nation, this victory represents a major step forward for the people of Portugal against the Monarchists due to its major role in the organization of the illegal monarchist movement in the North.\n\nIts major urban character, industry and coastal location had made it vital for the monarchist economy. Due to land routes via Spain being closed off, it provided modest importing and exporting capability as well as a sizable population to serve in the King's armies. Through the expulsion of Monarchist forces we have deprived them of this vital resource.\n\nSevere fighting took place in the outskirts and in some areas of the city near the coast during the initial advances, however a long urban campaign was fortunately prevented. Therefore the city is in mostly good condition with a feared humanitarian situation largely avoided. Local political figures have been detained, however most of the monarchist regime successfully fled, and PoWs are in the process of being relocated away from the city.\n\nThe population broadly is cautious, however firm ideological sentiment within the general population does not seem to be present, which has eased the transfer to our administration. While some accusations of illicit behavior by locals towards our troops have been recorded, most have been found to be fabrications while a small minority are in the process of being prosecuted. Further details will be communicated once the situation becomes clearer.\n\nSigned,\n\nDefence Minister Gomes"
iberiawars_cityfall.6.a:0 "Long Live the King."

iberiawars_cityfall.7.t:0 "Fall of Aveiro"
iberiawars_cityfall.7.d:0 "An uncharacteristically cold wind rattled Father Carlos as he stumbled through the rubble of what was once the old town of Aveiro. He muttered his prayers, holding tight to his rosary, as if to shield it - and himself - from the sharp whistle of the wind, carrying the sounds of shrieking bombs and forlorn screams. The ghosts of the old city had been disturbed, joined by a multitude of new lost souls torn from this earth by the fires of war.\n\nTurning around a particularly large pile of rubble, which may once have been a building, Father Carlos gasped, reaching for his crucifix. In front of him, the moonlight cast a pale shadow over the ancient Cathedral of Aveiro, or at least, what was left of it. The Cathedral was established more than five hundred years ago, and has withstood the test of time, disasters, and regime change. But it could not stand against the destruction unleashed by war. Its shattered windows gazed at Father Carlos like horrified eyes, frozen in their last moments, and its spire stood at a precarious angle in front of him, a head cowering in submission.\n\nGlass crunched under Father Carlos's boots as he staggered towards the ancient building, tears streaming down his face. At last, he leaned against the sagging walls, caressing the charred and pockmarked stones. He could now see empty casings and dark stains scattered across the ground, punctuated by the stark moonlight. A battle took place here, at a holy place, a sanctuary. Starkly opposing visions had led men to kill and die here, trampling the vision this place was meant to uphold. Father Carlos lifted his eyes to the cold light of the moon, wondering how many more sanctuaries of God would be desecrated by the senseless ideals that brought men to kill their own brethren."
iberiawars_cityfall.7.a:0 "The wind continued on, howling its anguish around him."

iberiawars_cityfall.8.t:0 "Aveiro's House of God"
iberiawars_cityfall.8.d:0 "Trash Cans carrying fires were placed at intervals between beds around the room, casting a hazy medieval atmosphere on the once white walls.\n\nThe bins had been fed by the pews that had served the large hall, then anything wooden that could be torn away, but now the fuel was reduced to random trash. Flames dimly illuminated groaning wounded who writhed on beds stained from both their wounds and those of the departed. Orderlies dashed, carrying dishes overflowing with horrid liquids and tools stained red and black. Night had long since fallen, but no respite came.\n\nThe room stank. Aveiro Cathedral had lost its peace.\n\n"To those inside this aid station, attention." A microphone from outside suddenly blared, pausing the flurry of activity for a moment. The orderlies and few doctors stopped, but the groans didn't. The voice from outside didn't care, talking over them.\n\n"The Cathedral is surrounded by troops of the legitimate administration of Portugal." The few doctors began issuing orders to any who could walk. A pre-prepared bar was placed on the entrance, while the sparse supply crates by the altar were dragged into a rear room.\n\n"Your army has left you; we control the city. All soldiers present are invited to surrender and prevent bloodshed. Exit the building with raised hands." The men and women on the beds moaned, asking what was happening. Some of those with less terrible wounds tried to stand, desperately throwing documents or clothing into the fires. They'd heard the rumors.\n\n"Lethal force is authorized should you not." Militia soldiers entered the hall, pistols bared and taking position by pillars and behind beds, some still occupied. Their guns were trained on the entrance."
iberiawars_cityfall.8.a:0 ""Do not resist us.""

iberiawars_cityfall.9.t:0 "Fall of Badajoz"
iberiawars_cityfall.9.d:0 "The acrid smell that Javier had grown used to since the start of the war hung in the air, burning his nostrils. It was quiet, except for the dull hum of vehicles on the street below.\n\nJavier sat slumped in a chair. The room he was in was an old apartment, bare after his unit had thrown most of the furniture out onto the street in days past. The windows were shattered, the walls and ceiling were covered in impact holes from bullets and ricochets. The walls were daubed, first with a monotone brown paint, next in scarlet blood.\n\nAround the room were the remains of Javier's comrades. Some of them had been felled by bullets in the firefight, they had been lucky. It was quick. The others had pieces of their limbs around the room. A well placed couple of grenades had been lobbed into the rooms of the apartment, and the blasts had caught all but Javier. It had taken some time for them to slowly expire, and Javier had listened and watched every moment.\n\nHe had been lucky, one of his brother's bodies had absorbed the blast. He had been knocked into a wall but otherwise unhurt. Now he listened to the enemy pass by below, on their way to destroy his precious Spain, while he was slumped weakly in a corner.\n\nHe took out a picture of his wife - from a hiking trip a few years previous. She was sitting on a rock, looking up from a map. It had been a week-long trip, walking through rugged hills and woods completely disconnected from the world. There was only them. Her happy eyes and bright smile brought back the memories of that trip - the peace of the forests they had walked.\n\nIn his eyes, impotent tears welled."
iberiawars_cityfall.9.a:0 "To see her in this place..."

iberiawars_cityfall.10.t:0 "Fall of Barcelona"
iberiawars_cityfall.10.d:0 ""Have we got any flares down there, maybe we can spook 'em with that?"\n\n"What?"\n\nThe tank commander grunted in exasperation and punched the metal of his temporary prison. It was cramped, the tank stunk and they had barely moved in two hours. He had been elated when Barcalona had been taken, but even with the terrorists running for the hills it seemed they just couldn't grasp that they were beaten.\n\n"Sir?"\n\nBelow him his crew all looked at him, their wide doe eyes half his age awash with hesitation. They could barely hear each other over the roar, chanting and jeering from all directions that seemed to reverberate around the tank's interior. An earlier attempt to talk to the crowd had failed miserably, and some had even tried to open the hatch - something that a few placed shots had ended. Since then they had been locked in this standoff. They seemed satisfied to just chant slogans and block them.\n\n"Castle 1 this is Castle 2, we have people trying to climb up on us again, we can't stay here! Over" came the radio, the gruff voice tinged with fear.\n\nThe tank commander weighed up his options. He couldn't stay here. Firing shots to disperse the crowd could backfire horribly; they didn't have much ammo and there were a hell of a lot of them. What to do?\n\nHe sighed, taking the radio receiver. "All units, this is Castle 1. Follow the leader. Out."\n\n"But sir, the streets full, and there's barely anywhere for them to go. We'll run ov-"\n\n"Drive.""
iberiawars_cityfall.10.a:0 "Citizens avoided that road, for the smell hung in the air."

iberiawars_cityfall.11.t:0 "Fall of Barcelona"
iberiawars_cityfall.11.d:0 ""The convoy is nearly over the bridge."\n\n"Ok, be ready for my mark."\n\nLying in some scrub were a man and a woman, as close to the ground as possible and covered by tall grass. They were on a hill overlooking a highway, empty of the usual traffic that once marked the roads around Barcelona. Instead, a long convoy of military vehicles slowly drove along it.\n\nThe two had been part of the defense of the city they could see on the horizon, before that defense had utterly collapsed. They'd been forced to flee, but fortunately it was not an eventuality they were completely unprepared for. They had quickly relocated to one of their depots from before the war - explosives and small arms for use in the liberation of Catalonia, now to be used in its salvation.\n\nThe military convoy was made up mostly of trucks, while led and shadowed by some armored cars. Maybe they were carrying reinforcements? Ammunition or supplies for the occupiers? Neither of them cared. They were carrying something worth protecting, and that made it worth destroying.\n\nThe first armored car entered the bridge, but the mark didn't come. It made its way across, leading the convoy, until just before it left the cry came.\n\n"Mark!"\n\nWith a button press the bridge vanished in a cloud of dust and debris, a handful of vehicles caught in the blast. It was loud, and the two saboteurs couldn't resist a whistle of triumph as they watched the remaining vehicles panic, driving off the road in all directions.\n\n"That was for our people you sons of bitches!" they cried, before making their way off the hill and into the empty country."
iberiawars_cityfall.11.a:0 "Most of the food shipment was lost, as was an armored car."

iberiawars_cityfall.12.t:0 "Fall of Bilbao"
iberiawars_cityfall.12.d:0 ""Stand in line, keep your hands behind your head. If you have a baby, hold them close to your chest and make no sudden moves. Do not face away from any military personnel or their advisors. Cooperation will be noted" the loudspeaker boomed, barely audible over the din.\n\nIt was the dark early hours of the morning, yet the estate was alive. Shouting, crying children, idling vehicles with their lights illuminating the area. Locals had stirred and stood behind the corden yelling and screaming. What they said could barely be made out individually, but the barbs of their glares said everything, eager to demonstrate their opposition against the criminals amongst them.\n\nBehind the corden, a long line of people stood, perhaps 50 or 60 of many ages dragged from the apartments behind them. They had evidently been pulled from their beds, wearing little beyond underwear. Some unfortunate few wore nothing at all, but none of the soldiers cared for their shame. All shivered, either from cold or fear. Riflemen yelled that any movement meant death.\n\nAmongst the chaos of uniforms, a small group of civilians consulted with officers. They walked down the line, pointing people out - those people then dragged away and thrown into a nearby truck. A child attempted to run after his parents, stopped by a rifle crack. None of the line dared move more.\n\nThey moved down the line, half of them being thrown into the waiting trucks. A loudspeaker announced the completion of the search and the people cheered. They praised the soldiers, applauding, as the remaining men and women of the lineup hesitantly lowered their arms.\n\nThe body was thrown in the truck with the condemned."
iberiawars_cityfall.12.a:0 "The radio told of patriots, heroes, who aided in the identification of traitors to Spain."

iberiawars_cityfall.13.t:0 "Fall of Bilbao"
iberiawars_cityfall.13.d:0 "Mateo sat on the soft grass bank, disregarding the booms and cracks of weapons in the distance. Despite the darkness, the area was illuminated as though it were day.\n\nHe was a painter. Exposed in some local exhibitions, his skill was noted but he was by no means famous - something that had never dampened his spirit. He had purchased an apartment near the City's fine art museum for that reason, a regular reminder of his most cherished wish - for his paintings to be as well regarded as the art inside that fine building. Before, he had often gone there, seeing the classics. He had watched the nearby river and its traffic, the people who had once filled the area. All now absent.\n\nNow he sat before the museum as it burned, an inferno illuminating all around it like a second sun. Carlos felt flat, his emotion seemingly having run dry. He watched the fire, the smoke that disappeared into the night sky silhouetted against the stars. A stray shell? Deliberate arson? Were those classics he had once looked upon so lovingly inside the furious orange rage before him? He didn't know.\n\nOn the ground was a canvas, beside him paints and brush. As he had seen the building as he had stumbled through the streets, the fire then in its infancy but building fast, dark inspiration had struck. He had raced home, disregarding the dangers, fetching these art supplies. They were his last, maybe the last in the entire city now, but they would serve to capture the final moments of one of the few monuments to civilization that remained in the city.\n\nWithout a twitch he captured the titanic fire and its tremendous heat, the glimpses of the proud building that had once stood there. Mateo felt no emotion, his face creased in concentration rather than grief, but the painting expressed it all. A final ironic ode to beauty against the backdrop of savagery."
iberiawars_cityfall.13.a:0 "One last masterpiece amongst the devastation."

iberiawars_cityfall.14.t:0 "Fall of Cádiz"
iberiawars_cityfall.14.d:0 "The two families huddled around the fire they had built with faces blacked by grime, their clothes no more than rags. They were in a garage, connected to a large apartment bloc that had been built before the war. The fire burned in an old garbage can. A cruel act of fate meant the nights were the coldest seen in a generation.\n\nThe leader of the Ramírez family, Josephina, spoke up first. She was with her surviving children - she did not know where her husband was. They stood still, staring at the fire silently. The youngest, a girl no older than 4, clung to a disfigured doll.\n\n"We should go to the port, find a boat" Josephina said bluntly.\n\nThe leader of the Torrez family, the teenage José, simply looked at her blankly. His siblings shivered, their parents long since buried, the fire insufficient to ease their suffering. The clothes they all wore were huge, stuffed with plastic bags to try and provide some warmth from the cold night air.\n\nJosephina placed her hands as close to the scant fire as she could, refusing to look at the Torrezs. "We won't stay here. We could try and reach Portugal, or maybe Morocco is more peaceful..." She trailed off. She had no idea of where to go, or the situation anywhere outside Cádiz.\n\n"I won't stop you" José said blankly. "We are staying though. We can't run anymore. We've dug too many graves."\n\nSilence overtook them again, and soon they retired to abandoned cars they had been able to open to try and sleep as best they could. The cars were cold, and their dreams troubled.\n\nWhen the Torrez family awoke, they were alone in the garage."
iberiawars_cityfall.14.a:0 "Escape or stay? Live or die? Which is which?"

iberiawars_cityfall.15.t:0 "Fall of Cartagena"
iberiawars_cityfall.15.d:0 "The curtains were drawn, but the sounds still came through.\n\nTeresa sat still as she listened to the sounds of marching outside. She lived alone, despite her age. Fortunately, her apartment had survived the battle, but at that moment she didn't care. She was too terrified by the sounds outside.\n\nThe troops marching in the street below were singing an old song from during the previous war. They were singing joyfully, their cacophony of voices reverberating in the air, hanging in the room around Teresa despite the walls.\n\nShe had heard that song before.\n\nIn the last war, as a young girl, men singing that song had marched into her town. It had been near the end of the war; the town had taken in a small group of republican soldiers which had been routed in a recent fight. Franco's men had arrived later that day.\n\nThe troops had put up a valiant last stand, but they didn't last long. They had taken some of Franco's men however. Then, they turned their attention on the town, murdering and burning almost everything they deemed traitors. They sang as they did it. Her parents, her friends, nearly everyone she knew had died that night.\n\nShe had fled, running away desperately crying from the concert of gunshots and singing and screaming. She ran into a soldier who had been walking around the perimeter, for what reason she could never guess. In his eyes, in which her burning home was reflected as he turned and noticed her, was an evil that she had never forgotten.\n\nIn her lonely apartment, she wept. The evil had come again."
iberiawars_cityfall.15.a:0 "Look upon my works and despair."

iberiawars_cityfall.16.t:0 "Fall of Coimbra"
iberiawars_cityfall.16.d:0 "It was still, no sounds but distant rattles and the crunch of the ground underneath Mariana's feet. Her steps, heavy and unsteady, drew sounds that made her wince. To be quiet was to live - any energy with which to move lightly was gone however.\n\nShe'd walked for hours that day. She'd walked for days before that too, aimlessly. The roads of her city were unrecognizable and she was disorientated from fleeing when she had heard soldiers approaching. She never stopped to check who, she would just crouch in the dark of some building or out of the way shellhole praying they didnt stop.\n\nShe sucked from tap faucets any rancid last drops remaining in them. Her meals were whatever she could find, and she hadn't found anything in so long.\n\nShe found herself in an open area, in the center a statue missing its head. She recognised it by the name inscribed; D Denis. The surrounding buildings had chunks missing, cold and empty. Vehicles were abandoned all around, and behind her a vista of the remains of Coimbra stretched. "It's a good job the head is gone", she thought, "King Denis shouldn't see Portugal like this."\n\nAs she looked at the statue, she noticed one of the vehicles behind the headless statue, a dog food truck. She hobbled as fast as she could manage to it, praying for something to be left. She cursed as she saw the trailer's door already open, inside only a variety of weapons. She threw them aside, adrenaline fueling a frantic search for anything edible.\n\nIn a corner, she cried out as she saw it. A single, battered can of dog food. She clutched it to her breast like a child and nearly wept. Her stomach ached in anticipation. She sat against the interior wall of the trailer and looked at the vista of the city, cradling the can of jellied meat. Today was a small victory."
iberiawars_cityfall.16.a:0 "But in the face of fury, all victories seem large."

iberiawars_cityfall.17.t:0 "Rations in Coimbra"
iberiawars_cityfall.17.d:0 "Gil stood by the gate, resisting the urge to lean back on the wall behind him. Hours had passed, guarding this depot holding god knows what in this warehouse appropriated when they took the city. At least his shift was almost over, just a few more minutes by his watch. Good; his legs ached.\n\nHis attention was snatched by someone walking down the road, the first person he'd seen since exiting the truck this morning. He peered at them, trying to discern if they were a concern.\n\nThey stumbled, meandering slightly as they drifted side to side. It was a woman, not much older than a teenager. Her clothes were worn and she wore no shoes, feet grimy and bloodied. She winced as she stepped, her thin frame trembling.\n\nHer mild eyes darted awake as she registered him. She stumbled to him. Gil shouldered his rifle - the woman looked harmless, but strange. Terrorists had used similar methods as distractions.\n\n"Please," her voice was a whisper, raspy and light, "food. Is there food?"\n\nShe hunched before Gil, and pity took him. Walks could be faked, but not that voice or body. She was only a few years younger than him, yet wretched. Without responding, he rifled through his webbing for something to give her.\n\n"Hey!" a voice shouted from up the road, followed by a shot fired into the air. The Woman plunged to the ground, well practiced in the reflex. Gil moved back to the wall, rifle ready. However, running towards him was his relief; Amaro.\n\nHe reached the two. "Get moving. Nothing here for you." He gave her a light kick to motivate her. She cried out, before painfully getting up and moving on."
iberiawars_cityfall.17.a:0 ""Logistics are tough Gil, you can't be doing that. She wouldn't have done it for you.""

iberiawars_cityfall.18.t:0 "Fall of Córdoba"
iberiawars_cityfall.18.d:0 "Marco's eyes were assaulted by the sudden daylight as the truck doors were thrown open.\n\nHe had been part of the new administration of Córdoba, little more than a civil servant - much like the vast majority of the men and women cramped in the back of the truck they had been cast into. It was a standard commercial freight truck; windowless, metal and dark. They had been too slow to escape when the city was stormed. Marco had been picked up at a checkpoint as he tried to flee.\n\nThe next hours had been ones of vicious assault as they demanded him to confess secrets and plans to which he had no knowledge. All he did was review building applications. He knew nothing of strategy, he didn't even care much about the War. He just wanted to avoid the drafts.\n\nMarco and the others were ordered out. His legs were weak but he managed it. The area he saw was unfamiliar, but the river was probably the Guadalquivir. The bank was barren, a handful of green plants breaking up dirt with the only sound being the flowing river. They were clearly distant from the city. An order was barked for them to line up.\n\nAn officer stepped out of a car that was parked on the road. Marco watched him meander towards them, seemingly more interested in the area's scant greenery.\n\n"Ladies and gentleman," the Officer said absently, "you have all been tried for treason and found guilty. Your sentence will be carried out immediately. There will be no final requests."\n\nHe walked to the side. Before Marco could fully process what was said, he became aware of the sound of a rifle being cocked behind him.\n\nHe didn't hear the shot."
iberiawars_cityfall.18.a:0 "Marco was found two weeks later, caught on a tree."

iberiawars_cityfall.19.t:0 "Fall of Évora"
iberiawars_cityfall.19.d:0 "The din was overpowering, just guttural noises to João. Around him were inhuman roars, mindless yelling and moaning and chanting. He couldn't think, he could see sound, his head vibrated. "Shut the fuck up!" he yelled impotently at the crowd below him, the sea of fists and cries ceasing not a moment. He couldn't hear his own shout, only feel its vibration in his chest. Perched upon the top of his tank he looked at the line of vehicles ahead, similarly held captive by the oceans around them. All commanders were stuck in similar situations. All facing the same conundrum.\n\nWhat could he do? Below him were angry eyes, baring teeth, they looked like zoo beasts. He almost felt like throwing them some kind of raw meat. He needed to get through them; the entire convoy did, but how?\n\nHe retreated into the tank and closed the hatch, making an effort to shut out at least some of the noise. He yelled to the idling men below him.\n\n"Rotate 90 degrees, slow, we'll force our way through. Watch for my hand signals, remember orders say we can't hit civilians without cause."\n\nHe opened the hatch again, returning to the chaos. The tank rotated, slowly. The crowd was forced to shift, but the slow pace avoided panic. He used the pre-prepared hand signals. Slow. Stop.10 degrees more. 20. Full ahead, slow.\n\nThey surged backwards. A sudden collision made João nearly fall violently, barely holding on. He looked back, the tank having driven into some old wall. Above it were old columns, maybe Roman, one of which had fallen onto some of the poor bastards around him as its support disintegrated. Panic sparked. The shouts turned to screams as frenetic waves smashed into the tank and each other."
iberiawars_cityfall.19.a:0 "You stupid bastards, you've hit the Temple!" João shouted into the tank."

iberiawars_cityfall.20.t:0 "Fall of Faro"
iberiawars_cityfall.20.d:0 "The hum of the engines penetrated the metal of the aircraft, the swirling propellers a transfixing Rodrigo as he stared absently out of his window. The plane was moving onto the runway, hardly a smooth ride as the aircraft swayed and buckled. This thing was junk, a C-201 Alcotan transport. A relic of the old order, they'd had to wheel this thing out of a warehouse and pray it worked.\n\nThere were ten passengers, including him. All fellows of the Câmara Municipal, the city's now former executive council. None had looked at him and he couldn't blame them since they'd been bundled from their safehouse. Defeat could hardly be laid at his door - he was no military leader - but Faro was his city. The people had been his responsibility, something he had relished as the Republic had been proclaimed.\n\nSeemed all it had led to was slaughter.\n\nThey'd been bundled on a plane by soldiers, they didn't even have time to tell them where they were going. There were speculations of fleeing to the Azores. Going to Morocco. Some even said they would be heading North, taking chances with the dangerous airspace. Rodrigo leaned into his seat. What'll be will be.\n\nThe speed of the aircraft picked up, violently vibrating the passengers. He clutched the armrests of his ancient seat, knuckles white. He had always hated flying.\n\nFrom ahead of him he heard someone call out. "Hey, what's going on by the fe-"\n\nA chunk of the aircraft disappeared in a flash, shrapnel flying as the plane was thrown violently from its wheels. Rodrigo heard the people ahead of him scream before being silenced by the flying shards. The engines ignited into flame as the aircraft disintegrated. They exploded, igniting the fuel lines."
iberiawars_cityfall.20.a:0 "Before the flame reached him, Rodrigo was aware of tanks and soldiers storming through the fence."

iberiawars_cityfall.21.t:0 "Fall of Faro"
iberiawars_cityfall.21.d:0 "The three soldiers sat in silence, watching the pinkish sunlight illuminate the cloud of dust that never seemed to settle. There was a balcony where they could try getting some fresh air, but each worried that it would collapse, the building bearing copious wounds from the battle. Even if they stuck their heads outside, how fresh could the air really be? Faro had fallen, and the streets reeked of burned wood and gunpowder. They were hiding in an apartment that wasn't theirs in a city that no longer welcomed them: an urban limbo.\n\n"We can try for Spain," one of them muttered. "I was forced to learn Spanish as a kid. Might as well use it." He tried to joke. Nobody laughed.\n\n"Out of the frying pan..." Shifting in the armchair which once belonged to a father, the other leaned forward, clasping his hands together. "Going deeper inland is a death sentence. We are already by the sea. Why not get a boat and sail for Morocco?" There was a pause before the man quickly added "or wherever else."\n\n"Do you even know how to sail a ship?" The third man simply lay on the floor, pressing his teeth together to relieve the aching in his spine. "Either they sink us, or we end up starving to death drifting through the Atlantic." He squinted at the flicking chandelier above him. "It's over. Just surrender. We've lost."\n\nThe other men's brows furrowed at the suggestion. The soldier in the chair joined the one bound for Spain in searching for a disguise. Scavenging through the apartment, each assembled an outfit that resembled the platonic form of a civilian: ill-fitting shirts, baggy pants, and worn-out shoes that rubbed against their heels. The third just laid there like a piece of broken furniture."
iberiawars_cityfall.21.a:0 "Instead of saluting, they nodded at each other and left their separate ways."

iberiawars_cityfall.22.t:0 "Fall of Girona"
iberiawars_cityfall.22.d:0 "Silence had fallen over the Plaça de la Independacia, the city having fallen into a grim silence in recent hours as the resistance to the invaders finally ceased. Occasionally a shot would ring out, maybe returned by a volley of cracks, but mostly only a hollow silence reigned.\n\nFrom his position, Andreu surveyed the square. He had placed himself next to a 4th floor window on the Southern side, the river Onyar on his right and a square entrance blocked with rubble on his left. It was hardly the most secure position, but it was the best he could do. He sat by the window, keeping an eye on the remaining square entrances on the other side.\n\nHe had fought for Catalonia for years. He had spread the word of freedom, involving himself in underground politics as much as he could. He had even killed, when he was so ordered - his marksmanship was renowned among those that knew him. But now, the dream was falling apart around him. He hated the silence that reigned over the city.\n\nThe sounds of fight had meant it was not the end.\n\nHe had thoroughly boobytrapped the buildings. The dirt of the square was already littered with the bodies of some soldiers that had strayed into the area - the others having fled. He had come too far, done too much, to give up now. Besides, this place held symbolic meaning to the Spaniards. The name itself was a monument to when the Bonapartists were driven out. Andreu was confident - they would not destroy this building, and he would not leave.\n\nA grumble from across the square, in the streets close to the entrance, alerted him to newcomers. Some of those that escaped must have got help, a truckload at least by the sound. He shouldered his rifle, and prepared to meet destiny."
iberiawars_cityfall.22.a:0 "He had no time to think as the armored car entered, and fired its grenade launcher at him."

iberiawars_cityfall.23.t:0 "Fall of Guadalajara"
iberiawars_cityfall.23.d:0 ""My sister was at the Calle de Madrid massacre you fuck" Álvaro heard yelled at him from his fetal position as he tried to protect at least some of his body from the rain of fists and kicks that enveloped him. His body burned and his skin grew more purple. His uniform gained a steadily increasing scarlet stain as half-healed wounds opened and new ones appeared. He begged for mercy, for them to stop, but none came.\n\n"Why should we?" his tormentors questioned. Men and women both laughed and joked between each other as they took their anger out on Álvaro, finding humor in his weeping and begging.\n\nIt was over, the city was all but overrun. Álvaro's unit had received an order to withdraw, but it didn't say when or where. They had no radio, and when the man they sent with the runner to the Command Post for clarification never came back. Álvaro didn't wait for his unit to make a decision, he could see where it was going - someone had to survive, and he wasn't going to die for Francoists if he didn't have to.\n\nHe had been trying to find clothes to change out of his uniform in apartments when they found him, a small group of citizens riding out the storm - and he'd walked right to them.\n\nNow he was battered on the floor while they decided what to do with him. Moving elicited pain as if his body were filled with knives; he lacked the energy to do much more than moan at the agony. He heard them talk as if he was an observer separated from events.\n\n"Let's just throw him from the window and be done with it, it's a long way down." said the man who had mentioned his sister. Álvaro remembered that day, and could only replay it in his mind as he lay broken."
iberiawars_cityfall.23.a:0 "He couldn't resist and they lifted him up and moved to the window."

iberiawars_cityfall.24.t:0 "Fall of La Coruña"
iberiawars_cityfall.24.d:0 "The monsters marched through the streets, their long appendages crunching over the rubble on the ground, charred from their fire. The line seemed to never end, cloaked in shadows. They carried guns, the long sticks that boomed endlessly day after day. They knew well the crack it made; they knew to duck.\n\nThey watched them from the windows. Some of their friends and people they knew watched in the street despite the late hour. The dark figures chanted words that couldn't be understood, and the people below seemed to not react. However, neither did they. They peered over the window frames, ignoring the shattered glass.\n\nTheir parents had said not to worry, the monsters would be gone soon. Promised that soon they could go back to school. They all had similar stories. Dad was a soldier. Maybe Mom worked at the big factory or something. No one had seen them for some time, and the monsters had come anyway.\n\nFor some the food had run out after no one had come home, houses smeared with rotten food and cans they couldn't open. For some monsters had thrown them into the street, said their house was not theirs anymore, and taken it. Some had simply run away when the flying things had made their house collapse, their family missing.\n\nThey stared at the creatures down on the street. They all looked the same, and they couldn't see any faces. Just the same horrible bodies, and wherever they went people they knew disappeared. None of them cried. None of them moaned. None said anything at all.\n\nThey just gazed at the monsters."
iberiawars_cityfall.24.a:0 "The monsters didn't look back."

iberiawars_cityfall.25.t:0 "Fall of Leiria"
iberiawars_cityfall.25.d:0 "The pungent smell of whatever broth was being prepared under the tarpaulin ahead of them was sickly, a scent new to most of those in the line that stretched back. However, beggars couldn't be choosers, especially when there were men with guns around them.\n\nThe ramshackle tent, with a crude chimney cut into its roof emitting smoke, had been placed in a courtyard. Citizens lined up all the way into the street. They clutched whatever receptacle they could, none having been handed out. Cups, bowls, bedpans or just crudely bent metal. Many of them shivered, however there was no cold. Among them murmuring could be heard, voices just loud enough to be audible to the idling guards.\n\n"Line is longer than yesterday."\n\n"Not surprised. Bastards didn't do anything when my block burnt down, they probably burned down another one."\n\n"Anyone know what the slop is today?"\n\n"Shame they wont give us military rations. My husband always said that they were nicer than you thought."\n\n"This isn't military food? Get your husband to try this rubbish."\n\n"I can't, I don't know where he is."\n\nOne of the brave souls, a teenager, yelled from the crowd. "Bet your boss eats better than this shit!"\n\nOne of the soldiers watching over glared in the direction of the voice. "Any more like that and I'll tip over that broth myself!" he shouted back; the voice didn't come again."
iberiawars_cityfall.25.a:0 "They all wondered how long they would be allowed to speak so openly."

iberiawars_cityfall.26.t:0 "Fall of Lisbon"
iberiawars_cityfall.26.d:0 "The chain link fence could barely cope with the mass of bodies pushing against it, hordes of desperate souls shouting and pushing against the compound.\n\nIt was a small compound, not built to be that defensible. Built in a clearing on the edge of the Monsanto Forest Park, it was little more than a large shack with a fence around it, laden with signs prohibiting trespassers. Half a dozen men stood guard behind the fence, watching the crowd of hundreds anger push towards them.\n\n"Give us the food," they shouted "We can read the signs, we know it's in there, just distribute it!" The metallic ringing of the struggling fence served as a supporting cacophony to their demands.\n\nAn officer lifted a megaphone to his lips, his men noting his visible sweat, eyes fixed on the deteriorating barrier. "I'm sorry, I am not authorized to allow distribution of this depot for another two weeks. Please return to your homes."\n\nThe response was just more pushing and rage, a harmony of slurs coming from the chaotic mass on their perimeter. Some began to climb the fence. The officer turned to his men.\n\n"Gas masks on, use the tear gas." He pointed at the men climbing over the fence. "Dias, targets are a hundred meters to the front. In your own time, fire."\n\nThey carried out the orders mechanically. Seething capsules were fired from launchers into the crowd, earning cries as the white gas attacked the citizens. They broke, scrambling over each other to escape leaving some broken and motionless on the ground. The men who climbed the fence didn't get far, shot nearly as soon as they touched the ground, single shots making them drop like puppets cut from string."
iberiawars_cityfall.26.a:0 "Incident Report: Crowd dispersed. Minimal casualties."

iberiawars_cityfall.27.t:0 "Fall of Madrid"
iberiawars_cityfall.27.d:0 "The white ceiling was stained with smoke, as the pungent smell of burning filled the building.\n\nThe room was long with flickering lights hanging from the ceiling, just one of the many offices that had served the Guardia Civil in more peaceful times. The modern style, smooth walls shuddered from the distant concussions of explosions as men and women dashed around, the concussions often causing a fall, spilling paper onto the gray carpet.\n\nHere, the boring part of keeping the peace had been performed; the record keeping and the administration. Within the records of just this building were the intimate details of a score of the city. Throughout the city, similar offices held information of thousands of 'notable' individuals throughout the country.\n\nThe office was bare, the desks chopped and thrown into makeshift bin fires to sustain them. Into the fires people threw every scrap of paper and film they could find - some of them workers, others officers of the force and some citizens who had braved the chaos of the streets to burn records that could incriminate them. All sensed Madrid would soon be unsafe for those who had acted in the interests of Iberia, and none wanted to leave evidence of their conviction.\n\nThe fires weren't safe but none cared. They were out of time. Informant information, employee records, operational reports, all had to go. None of them had the time to look whose information was on what document, so the only chance was to burn it all. Nervous hands threw every binder and folder they could into the fires.\n\nFrom outside, the sounds of gunfire sounded ever closer, a closer explosion earning a worried pause from the burners before they returned to their task. The heat of the room and the tension of time drew a sweat from all of them, streaming into their red eyes."
iberiawars_cityfall.27.a:0 "The soldiers came and all were gone, but unburned papers remained on the floor."

iberiawars_cityfall.28.t:0 "Fall of Málaga"
iberiawars_cityfall.28.d:0 "Enrique walked out of the building clutching his flag, a shirt tied onto a stick. The reception, its floor coated in broken glass, proved treacherous. Once he stepped outside he longed to return to it.\n\nBefore him was a throng of soldiers, along with some vehicles. Even a tank. All were staring at him with violent eyes.\n\nOnce, he had been a doctor. When the Republic had been declared, he had become Mayor, in recognition of his democratic agitation. It had limited his career, but he hadn't cared. It was why he became a doctor - he wanted to do what was right, not what made money. Then it had all gone wrong.\n\nAs his city had burned and the military took over, he returned to the one place he could make a difference - the city's hospital. Now his beloved Republic was gone, the last soldiers who could walk having fled, and he was tired of death. The hospital was full of those who had suffered too much already. He would do his duty as a doctor first.\n\nHe stopped before the soldiers and called out. "Brothers, we surr-"\n\nA crack rang around the air, a bullet hitting one of the soldiers. Enrique was dumbfounded, before processing what happened. He looked back at the hospital and saw a soldier hanging out a window, borderline delirious and barely clutching a pistol, with a nurse trying to drag him back.\n\n"Oh god" he mumbled, before being seized by one of the soldiers. He saw troops taking positions around low walls and vehicles, the turret of the tank ominously pointing towards the hospital's windows.\n\n"No! Don't! Innocent-!" his protests were ended with the butt of a rifle."
iberiawars_cityfall.28.a:0 ""Direct all fire on enemy building, get the tank to open those walls up.""

iberiawars_cityfall.29.t:0 "Fall of Oviedo"
iberiawars_cityfall.29.d:0 ""Maria! Where are you Maria?"\n\n"Keep your head down Juan! Don't look up"\n\n"Papa? We need to move papa please!"\n\nA group of refugees lay as close to the cold pavement of the road as whistling bullets flew overhead. Around them were corpses, some uniformed and some not. Some tried to use the bodies as a shield, others attempted to slowly move to the other side of the street - there a small passage leading away from the gunfight lay, the only window of escape.\n\nThey had been trying to stay ahead of the advancing rebels, carefully making their way through a web of apartments to try and stay off the streets. All for naught; the rebels had caught up. Around them were two makeshift defensive lines, held by some of the scant few defenders left. The forward position was barren, the uniformed corpses around them all that remained. The second line, slightly elevated, still resisted with little thought for the people just below their bullets.\n\nOccasionally a stray shot would hit one of the prone figures. Nerves would break and some tried to stand and dash to the passageway, only to be immediately cut down in a crimson cloud. A few made it to the passage, and tried to encourage those still on the road.\n\nA dull rumble sounded at the end of the road, heard even above the cracks of constant gunfire; an armored vehicle coming into view. The refugees that had made it to the passage, at first so determined to stay in sight of their friends and family, all fled, disappearing into the buildings.\n\nThose left on the road heard the powerful gun of the vehicle roar and prayed as it came ever closer."
iberiawars_cityfall.29.a:0 "The survivors were taken into custody; none spoke a word."

iberiawars_cityfall.30.t:0 "Fall of Pamplona"
iberiawars_cityfall.30.d:0 "Mikel stopped to catch his breath in a grocery store's entranceway, panting but not letting down his guard. He didn't believe he could still run as quickly as he could in his youth but, he reckoned as sweat dripped down his back, mortal danger was a great motivator. The thumps of distant artillery shells rumbled his thoughts, ever calling him to flee.\n\nAs the clattering of gunfire slowed down from where he had run, Mikel allowed his shoulders, and then his whole body, to slump to the floor. The street was still, devoid of the bustle of life he was used to. Quiet hung like fog for a moment before rushing footsteps and cries in Basque and Spanish broke the silence of the ghostly street. Mikel closed his eyes, exertion starting to ravage his aged muscles. As stealthily as possible, he peeked around the corner.\n\nDirty, sunken Basque militiamen were running through the street. Some limped, some carried unmoving bodies. One man, limping with a seeping bloody gash on his right knee, locked eyes with Mikel, but said nothing. There was nothing to be said.\n\nAn engine's rumble filled the street as a truck turned in ahead, cramped militiamen huddled on its flatbed. A tattered flag fluttered from its rear, mirroring the state of the men. Most were wounded, a few of them badly, but all still clutched rifles. Mikel turned away and crawled as close to the shop door as he could. Huddling, his thoughts drifted to happier times. The truck's rumble and the soldiers' cries were a grim echo of the thundering bulls and roaring masses who rushed through the street each year. He rocked gently as he pictured the Bull Run, red neckerchiefs symbolising the spilled blood of San Fermin. Then, the parade was one of bloodied masses, screaming as they ran, with a crowd of Spaniards cheering them on. He cried out, the sound unheard as the militiamen passed him by."
iberiawars_cityfall.30.a:0 "He closed his eyes, praying to San Fermin and any other saint he could remember."

iberiawars_cityfall.31.t:0 "Fall of Pamplona"
iberiawars_cityfall.31.d:0 "They sat by the Magdalena Bridge, laughing and eating around a makeshift fire. They had been ordered to secure the bridge - something that had proved exceptionally easy as the area seemed devoid of any inhabitants. The sounds of battle had continued in the distance but for them, the battle had become purely a spectator sport.\n\nThey watched detritus flow down the river past the bridge, at some points a corpse or two. They kept watch on both sides of the Bridge, but it was easy work for the six of them. None came. The nearby convent was empty, with not much of value. It appeared people had been there before they arrived, signs of looting apparent in overturned furniture and broken items littered throughout the disheveled corridors. All they found was some old cans of soup in a pantry.\n\nNow in their third day, they lounged as if no battle was taking place. Perhaps they had been forgotten by their unit? The sounds of battle grew more distant, and they had found enough in the convent to eat for a week. They were not in a hurry.\n\nA boy stumbled up to the group. He was wearing rags, thin with a face lined with dirt. He looked as though he had been living in dirt for some days. He shambled, a desire for speed seemingly matched by fatigue.\n\n"I want to surrender!" he mumbled to the soldiers as he threw up his arms, earning a hearty laugh. He started to shout, trying to match the mocking sound. The soldiers had no interest in taking a prisoner - that would take them from this easy job. Why do that? They picked up stones and discarded cans and began to throw them at the boy.\n\n"Get out of here" they jeered, forcing him to retreat. He cried out to them, asking for some food at least, but they just continued their commands."
iberiawars_cityfall.31.a:0 "After all, why stop a good thing?"

iberiawars_cityfall.32.t:0 "Gifts of Porto"
iberiawars_cityfall.32.d:0 "Ayden moved through the building carefully, hesitating before each door and corner. No one appeared, as his imagination frequently imagined. All he found was corpses and dust.\n\nThe building was large but half constructed. Worktables and building materials were strewn all around rooms with indeterminable purpose. The building effort must have been abandoned when the War broke out.\n\nAyden coughed. He and his team had just been walking by, off to investigate a Golf Course nearby. Being miles from the frontline, they'd assumed safety - then shots had been fired from the construction site they'd been meandering past.\n\nAyden was all that was left.\n\nAyden kept investigating, nerves screaming to make sure that it was truly over, when he heard moans from a few rooms away. He fought the urge to run, creeping to the doorway the sound originated from, peering inside. A man in monarchist uniform sat facing the door, his back to the wall. A pool of blood was rapidly extending.\n\n"H...help me" he whispered, his voice gravelly with pain.\n\nAyden checked they were alone, before walking to him. He checked all around him, thoroughly examining the dying man.\n\n"Thank you" he breathed, looking up at Ayden. As he did, Ayden saw a glint of gold around his neck. Perfect. Ayden grabbed the necklace, pulling it and breaking the chain. He could get something for this.\n\nHe stood up, stuffing the necklace into his pocket. It wouldn't bring back any of the rest of his squad, poor bastards, but cash might ease his pain."
iberiawars_cityfall.32.a:0 "He ignored the pleas of the dying man behind him as he left for home."

iberiawars_cityfall.33.t:0 "Fall of Setúbal"
iberiawars_cityfall.33.d:0 "In a different Portugal, Hugo hadn't been an officer. He'd never seen himself in any kind of military role, the idea of being anywhere other than an office going over building plans had been utterly alien to him. An architecture student wanting to make Portugal beautiful, that had been his dream.\n\nThen everything went wrong.\n\nSetúbal had been occupied by the decadent Republic, fortunately this monastery had survived the battle quite well, the beautiful Manueline Gothic designs immaculate despite the chaos that had taken the country. The Monastery of Jesus of Setúbal had been somewhere he had always wanted to visit when he had been studying in Lisbon - while the circumstances were not ideal, he certainly wasn't going to pass up the opportunity.\n\nHe walked around the monastery taking in the shining stone, the white and blue tiling and ornate ceilings filling his fanciful eyes. He took sketches in a little journal he carried, gleefully trying to sketch every detail he could in the limited time he had available. He cursed not having any coloured pencils with him.\n\nEventually, he walked out. The archway was aged with two separate doors, opening into a large courtyard that was filled with men. To his left and right he could see the roads, mostly empty save for the occasional military vehicle passing through. The men filling the courtyard paid little attention to the historical monument they were next to, standing around makeshift fires cooking and resting. Fools, this place was a jewel before dross.\n\nThe idea of ignoring things like they did sickened Hugo, he was thankful that he could appreciate these things. How could they be so ignorant of beauty?"
iberiawars_cityfall.33.a:0 "As he mused, a convoy of trucks laden with political detainees passed by."

iberiawars_cityfall.34.t:0 "Fall of Sevilla"
iberiawars_cityfall.34.d:0 "The air had stopped shaking, and yet had never felt so oppressive.\n\nThe fires had been doused and the near explosions had ceased. However, the scars left were everywhere. Building skeletons still barely stood. Blackened arms penetrated out from piles of rubble in the street. Banners declaring their new masters, the only clean things in all the city, flew over the streets.\n\nSurvivors picked through the rubble, trying to recover any part of their lives. Most of them followed the commands of the new soldiers without resistance when they were given; there was no resistance left to give. In most streets there was a dull ambience of shifting rubble, stumbling footsteps and the distant hum of trucks.\n\nThere was only one place in the city that was truly silent however. Near the river, visible for a long distance thanks to the charred city, was the Seville Cathedral. During the battle it had been a sanctuary where the grace of God had been said to protect all from the horror of the city.\n\nNow, it's a dark joke against that grace. Bulging eyes watched the city, their city, from the Giralda. Before they had been members of the new democratic administration of the city. Now, suspended with rope, they lined the perimeter of the tower. Their skin, battered and bruised, was degrading fast as it was exposed to the elements. They wore nothing but a sign around their necks. The sign declared each man and woman there as an enemy of the new Spain.\n\nIt called them degenerate Jew lovers.\n\nIt called them tyrannical cowards\n\nIt called them traitors."
iberiawars_cityfall.34.a:0 "They had all believed in a brighter future once."

iberiawars_cityfall.35.t:0 "Fall of Valencia"
iberiawars_cityfall.35.d:0 "A group of Republican soldiers absently gazed at the road before them. They were sitting in rows, cross legged on the side of a road junction. The buildings around were burned down, however the fires and explosions had failed to collapse the area so the shells still stood. Around them were guards, absently meandering around in a bid to kill time. The captives had no such luxury.\n\nSoldiers were marching along the road, with the occasional vehicle and a surprising amount of horse drawn equipment. There was somewhat of an air of disorganization if one looked. Officers unfamiliar with the city even before half had been reduced to rubble struggled to make sense of maps while their men were forced to wait across the road from the captives who had recently been trying to kill them. Trucks sometimes forced their way through marching columns with a blaring horn, earning a slew of insults and the occasionally thrown rock. It was all enough to get a bitter chuckle from some of the captives.\n\nOne of them however was staring a little way down the road. There, inscribed on the wall of a building on the opposite side of a turning, was an advert for a local family Paella restaurant. Much of the color and definition had faded thanks to the violence that surrounded it but the basic mural remained.\n\nThere was a smiling face, though age or sex couldn't be made out, with a pan of steaming paella painted next to it. Below was the blotched name of the restaurant. Maybe there had once been an arrow, or a location listed, but it had since been worn away likely due to the City's considerable current struggle.\n\nThe soldier's stomach grumbled. He hadn't eaten in two days, and he was unsure when the next meal would come. A barked order to stand drew his attention away from his object of longing however, and within minutes the captives were marching down the street again."
iberiawars_cityfall.35.a:0 "War has its most common deprivations."

iberiawars_cityfall.36.t:0 "Fall of Valladolid"
iberiawars_cityfall.36.d:0 "The air, thick with dust, choked Hugo as he lay on the ground. His body burned in agony, his clothes and skin ripped away around him as he hung his mouth open, silently screaming. The dust, broken brick and blood all vyed to cover his wounds in a putrid display.\n\nMoments ago he and some others had been standing proud, defending a house against the incoming onslaught of rebels to the city. They'd been cut off from the retreat and their young hearts had decided upon a glorious last stand, none of them older than 20. They'd opened fire on the first patrol they had seen, basking in a glow of pride as they cut down a score of men forcing the patrol to flee.\n\nThe tank that soon turned the corner, fired its gun and collapsed the front of the building took that feeling away.\n\nHugo didn't know where the others were, maybe they were in the drift of rubble that he was a part of? Maybe they had fled? As Hugo tried to stand the thoughts were quickly lost in a sea of blinding mental fire. His legs twisted in strange ways, his right arm had skin hanging from it from where he had been dragged across the rubble as he'd fallen. He realized he could only see from one eye, and the pool of blood grew. He remained on the street paving, half shrouded by rubble, unable to move as every motion sent further jolts of pain.\n\nThe dust steadily began to settle, forming a blanket atop him. He heard dull groans from behind him as his mind began to fade, the pain disappearing slowly but steadily into an overwhelming numbness. Through the sullen cloud he became dimly aware of advancing figures, silhouettes he could barely focus on as he felt strangely unable to register his vision.\n\nSoon, the dark figures saw him and approached. He didn't hear the shot that followed."
iberiawars_cityfall.36.a:0 "Private Hugo Guzman, 19 years old, MIA."

iberiawars_cityfall.37.t:0 "Fall of Vigo"
iberiawars_cityfall.37.d:0 "The office was a mess, files and furniture torn all around. It shared the same fate as the factory to which it was attached. Machines destroyed, blasted into pieces and strewn around the assembly floor. The bombs and gunfire had done their work.\n\nNow it lay quiet, a liminal silence hanging from the atmosphere.\n\nIn the office the silence took on a different character. A safe that had been concealed behind a painting was revealed. It had taken some effort, but it now hung open with its contents bare to the group of soldiers that stared in awe at it. There were over a dozen of them packed into the office, all crowded around their prize.\n\n"That's a lot of cash," one muttered. The safe was stuffed, nearly bursting with the prized notes.\n\n"Must be wages. These factories were going right until the end, those workers wouldn't stick around without their cash ready" another said.\n\n"Is it some Galician currency? That stuffs worthless."\n\nOne of them stepped forwards and dug around the safe's contents. "Nope. Peseta."\n\nA rapacious cheer rose from the soldiers, ringing across the factory. They enthusiastically started distributing their spoils between each other, dreaming of its use. Some talked of saving, others vices. Some just counted their share with glee."
iberiawars_cityfall.37.a:0 "As they left they stepped over the body in the doorway, the blood on his shirt still wet."

iberiawars_cityfall.38.t:0 "Fall of Zaragoza"
iberiawars_cityfall.38.d:0 "None of them resisted as they were dragged into the street, out of the basement they had been thrown into days before. Most of them could barely stand anyway.\n\nThe street was relatively empty, but a few citizens were slowly moving past the building, an otherwise nondescript house in Zaragoza which had been conspicuously guarded by a squad of soldiers for a few days, a guard outside the door rotating every few hours. A few local residents had seen this but none asked why.\n\nThe soldiers pushed the bloodied prisoners up against the wall of the building. Some of them immediately slumped down, sitting like a doll. Others just about retained their feet, leaned up against the wall. Some coughed. Some wept. Some just spat blood and were silent. All had countless bruises and cuts, blood tried into their rags - their treatment was clear.\n\nAfter they were satisfied with their prisoners, they began to stop passersby and residents in nearby houses, creating a tiny crowd of a dozen or so.\n\n"These men and women," the soldiers' leader declared, "are guilty of working with the Iberian regime, of oppressing the spirit of Spain for their own petty power-"\n\n"We're office workers, that's all we are, we swear!" one of the prisoners meekly professed, interrupting the speech. The leader barked an order, one of his men punching the prisoner. Their head struck the brick wall behind them, drawing blood as they numbly slid down.\n\n"Citizens of Zaragoza, witness our commitment to your liberation. The Francoists will oppress us no more". With that, the soldiers turned and shouldered their rifles."
iberiawars_cityfall.38.a:0 "Within moments, the murder was completed."

iberiawars_cityfall.39.t:0 "Liberation of Aveiro"
iberiawars_cityfall.39.d:0 "They came for Afonso as night fell. Armed men, some dressed in Republican uniforms with crude red armbands and some simply in civilian clothes, hauled him from his seminary and practically threw him into the back of a truck. He recognised many of those he saw, fellow priests from the city, packed tight. There was barely enough room to breathe.\n\nThe truck drove for what felt like an eternity. Hardly anyone spoke a word. Some were dazed, a few bruised. Others simply closed their eyes, whether in sleep or contemplation Afonso couldn't tell. Night fell as they drove, a caustic blackness surrounding them all. There were no more lamplights.\n\nEventually the truck came to a stop, the armed men ordering the priests to get out. Other trucks hummed around a clearing, their lights illuminating the darkness. Poor souls disembarked from them. Shaken, Afonso couldn't gather a headcount, all thoughts banished in favor of a raw terror as he realized what they were being marched towards.\n\nA large ditch had been dug, a hellish crevice moaning with those already within. A few froze in terror - they were dealt with instantly to the horror of the captives. Regrets invaded Afonso. Why hadn't he fled? What use had he hoped to serve to his flock? What had been the point? He began panting, his chest tight and mind racing as he crept ever closer to the abyss.\n\nThey jumped in, fear controlling them. They were crammed together and the socialists began to line up along the edge of the ditch, silhouettes against the headlamps. Jostling against those next to him, Afonso clasped his hands. Perhaps he would be missed. Perhaps he could hide and survive. Vain hopes danced in his head as they did all the others in the pit. Their executioners raised their rifles, and Afonso offered a simple prayer."
iberiawars_cityfall.39.a:0 "God... save us from this madness."

iberiawars_cityfall.40.t:0 "Liberation of Badajoz"
iberiawars_cityfall.40.d:0 "TOP SECRET\n\nCOMMUNIQUE TO THE WAR MINISTER: FOR IMMEDIATE ATTENTION\n\nSir,\n\nBadajoz has been secured. Organized resistance removed from the immediate vicinity of the city. City saw a heavy amount of street fighting. Early attempts to employ indirect fire strategies ineffective. Partisan activity prevented artillery stores being adequately replenished. Close quarters fighting has left much of the city uninhabited.\n\nHigher than expected civilian deaths recorded. Civilians often trapped by rebels close to combat. Lower than expected resistance to martial law is being observed as a result. Guerilla raids continue in the immediate vicinity. Supply lines unstable. Much of the civilian population fled south or into Portugal.\n\nPrisoners will be transferred. Recommend authorization to relocate surrendered citizens unsuitable for labor to monitored camps deeper behind the lines. Unsurrendered citizens who refuse relocation are not being aided. Limited supplies amid fears of counterattack reduce scope of current operations.\n\nGeneral Fernando Cabrera, Head of Military Security District Center."
iberiawars_cityfall.40.a:0 "The shields of the rebels shall fall with them; those that remain shall work."

iberiawars_cityfall.41.t:0 "Liberation of Barcelona"
iberiawars_cityfall.41.d:0 "TOP SECRET\n\nCOMMUNIQUE TO THE WAR MINISTER: FOR IMMEDIATE ATTENTION\n\nSir\n\nBarcelona can be considered under our control as the Military Administration has taken control of all operations within the city. The situation can be considered stable, however there does remain a variety of issues which security forces are attempting to rectify.\n\n1: There remains a high amount of nationalist dissidents within the population. Any publicly espousing such views are being identified and detained where possible. Current resources make this unsustainable, as such I recommend relocation of offenders to camps elsewhere\n\n2: There remains a high terrorist presence both in the city and the surrounding area. Patrols of main routes are being prioritized as forces are insufficient to cover non essential routes and locations.Punitive actions and intelligence are still being considered.\n\n3: Some remnants of the defending army remain in cultural locations. For some indirect siege tactics are being employed, others rapid assault, depending on the risk of damage to cultural monuments.\n\nIt can be said that this city is still at war with us, even if the rebel army has been displaced. Further information will be forwarded as soon as intelligence gathering has been concluded.\n\nGeneral Carlos Fernández, Head of Military Security District Catalonia."
iberiawars_cityfall.41.a:0 "A map changes easier than a soul."

iberiawars_cityfall.42.t:0 "Liberation of Bilbao"
iberiawars_cityfall.42.d:0 "TOP SECRET\n\nCOMMUNIQUE TO THE WAR MINISTER: FOR IMMEDIATE ATTENTION\n\nSir\n\nBilbao razed. Large areas of Bilbao unfit for habitation. Disease concerns within inner city. Socialist terrorists still active in region. High sympathy for dissidents in region. Most local infrastructure damaged or destroyed.\n\nActions Taken: Mass arrests, martial law and emergency sentencing carried out. Incentives for cooperation with security forces offered with some success. Relocation of citizens from uninhabitable districts ongoing. Anti-terrorism operations ongoing.\n\nConcerns: Limited local cooperation. Civilian camp conditions degrading. Despite high expense local terrorism continues with moderate impact on operations. Insufficient means to begin reconstruction.\n\nRequest: Reconstruction Report be compiled and published. Material for 2 major civilian camp constructions. Further anti-terrorism experts be dispatched to advise operations. More details to follow in report.\n\nGeneral Emilio Huesca, Head of Military Security District Basque-Navarre."
iberiawars_cityfall.42.a:0 "The lion's den was razed, yet it stays on the hunt."

iberiawars_cityfall.43.t:0 "Liberation of Cádiz"
iberiawars_cityfall.43.d:0 "TOP SECRET\n\nCOMMUNIQUE TO THE WAR MINISTER: FOR IMMEDIATE ATTENTION\n\nSir,\n\nCádiz and its surrounding regions have been successfully transferred to the MSD. The result of the shock tactics employed with sole regard to hostile positions, and the eradication of boats trying to leave in the final moments of the battle, has resulted in a passively resistant population which may risk turning violent once more without reinforcement. Damage to the city is moderate with damage majoritively in the dense areas and docks. The Cádiz docklands can not be repaired with current resources. Security forces are spread thin as terrorism continues within the city.\n\nEfforts have been taken to trace the production sites of literature and posters slandering our forces as engaging in acts of massacres against refugees. Suspects in the spread of such misinformation have been detained and are currently being interrogated.\n\nFull suppression is difficult with current means and more units are requested urgently. Further engineers and tools to equip laborers to repair the docks, as laid out in the memorandum received last month as a priority objective should they be damaged, are also requested.\n\nGeneral Luis Delgado, Head of Military Security District South"
iberiawars_cityfall.43.a:0 "They will be made to see; only the guilty flee."

iberiawars_cityfall.44.t:0 "Liberation of Cartagena"
iberiawars_cityfall.44.d:0 "TOP SECRET\n\nCOMMUNIQUE TO THE WAR MINISTER: FOR IMMEDIATE ATTENTION\n\nSir,\n\nCartagena's placement under martial law has been simultaneously simpler and more complex than other areas in Military District East.\n\nThe military campaign that took Cartagena utilized significant force in reaction to a high concentration of rebel forces. Destruction was regrettably high, however it seems that the dispersal of terrorist cells in the region was rather more effective as a result. Local groups seem to have retreated elsewhere or been destroyed. The cost of this however is the difficulty in local administration and policing that such destruction is causing. The area surrounding the city has become a patchwork of settlements due to the danger of civilian movement. Easing the Civilian humanitarian situation in order to limit impacts on the military are limited by the difficulty in movement caused by the loss of infrastructure.\n\nMorale among citizens identifiably hostile to our administration appears low, with the desire for further anti-government action minimal. Banditry is prevalent, however they do not seem to target military movements. The few that have are swiftly destroyed, observed to be civilians armed only with salvaged small arms often. Efforts to corral at-risk populations into monitoring camps and patrolling vital routes has guaranteed that there is minimal risk of banditry to military movements. Further Engineering corps units will be required to make significant progress in the rebuilding of vital infrastructure.\n\nGeneral Carlos Costa, Head of Military Security District East."
iberiawars_cityfall.44.a:0 "We will do all we can, within the bounds of practical military necessity."

iberiawars_cityfall.45.t:0 "Liberation of Coimbra"
iberiawars_cityfall.45.d:0 "For the Attention of the Council of Ministers,\n\nGentleman,\n\nMonarchists have been expelled from the City of Coimbra, and with it one of the first lines of defense that were set up by their forces finally breached. Due to its proximity to initial contact lines it appears that the illegal administration did not invest in substantial fortifications inside the city. However, an easy campaign was not offered by this, as a mass mobilization and liberal use of ambushes and explosives saw heavy losses in all involved parties, civilian and military.\n\nMost Infrastructure, at least 20% of the city's buildings and local logistical hubs have been destroyed, with many more of the buildings in the vicinity of combat encounters are structurally unsound or damaged beyond safe use. Food, water and medicine supplies left behind by monarchists have not been found intact, many of the depots destroyed as our forces approached.\n\nHeavy losses among our troops and the catastrophic destruction of much of the area's infrastructure, further frustrated by terrorist groups continuing to operate past the withdrawal of most monarchist units, the area has already been declared a zone of humanitarian disaster. Initial efforts to redirect aid have been conducted by the military however a comprehensive response will require further planning. In the meantime, local units have been instructed to only distribute food marked for civilian distribution in order to avoid frustrating the logistics of our own troops any more than necessary. Recommendations for a response will be discussed at the next meeting.\n\nSigned,\n\nDefence Minister Gomes"
iberiawars_cityfall.45.a:0 "The weaponization of the city itself was a crime against its people."

iberiawars_cityfall.46.t:0 "Liberation of Coimbra"
iberiawars_cityfall.46.d:0 "No one had seen the list nailed to the door of the Church, hanging like a vine from the aged wood. It had appeared overnight before the Sunday Mass, and now the congregation laid their eyes upon it and stood silently in vigil.\n\nThe list was perhaps a metre long, at the top loudly emblazoned with a simple message and a hammer and sickle. "These individuals are suspected of counter-revolutionary allegiances," it said in stark red letters, "and so are wanted for public protection. Any information leading to the arrest of enemies of the People will be remembered and rewarded with official recognition that the individual is an ally of the Revolution." Below were names of dozens and dozens, falling to the ground.\n\nIt was a small Church, serving a small community located in some hills near Coimbra. They'd wanted only to be left alone; for years God granted them that wish. The concerns of Iberia passed them by. A King had returned and they'd seen hope, their Padre telling them of how a more godly Portugal awaited. Then the socialists came and for the first time since Napoleon they had seen soldiers. They'd left again, but stories from neighbouring towns trickled. The beatings. The disappearances. The broken corpses found in the streets, draped in red. They still dared to come to Mass, no one had come to outlaw it yet, but if they came once they could come again.\n\nFor the first time since Napoleon, fear hung in their hearts.\n\n"Sorry I'm late!" came a shout from behind the group. "My door got jammed somehow, nearly had to -" The Padre appeared, passing through the motionless crowd before seeing the list. His congregation remained silent as he read it, looking down the names.\n\nHe saw his own. His skin burned as he felt the eyes looking at him."
iberiawars_cityfall.46.a:0 "In a small office, a small man grinned. The reports were good, and the small cells were full."

iberiawars_cityfall.47.t:0 "Liberation of Córdoba"
iberiawars_cityfall.47.d:0 "TOP SECRET\n\nCOMMUNIQUE TO THE WAR MINISTER: FOR IMMEDIATE ATTENTION\n\nSir,\n\nConsolidation of Córdoba is ongoing as the final arrangements for the transfer to security forces are made. The breaching of the city was achieved with a rapid breakthrough of the frontline after the city was encircled. Resistance was quickly crushed. Some military units were able to break through the weaker part of the lines but most refugee and enemy routes out of the city were successfully neutralized.\n\nAs a result of the rapid assault operation we have received a number of detained city officials appointed by the rebel occupiers. They have been detained with assessments ongoing as to their value. Limited manpower restricts our ability to maintain adequate prisoner guarding, as such any defined as low-value will be liquidated.\n\nProtests have occurred against our forces by remnant Republicans. Leaders have been detained, however we are short on riot equipment. Request riot gear and rubber bullets, without it we will be forced to employ lethal methods as standard policy. Guerilla raids are harsh in the surrounding area, vital routes have frequent patrols however inadequate resources are leading to less significant areas suffering banditry. While not militarily damaging and as such not high priority, ignoring this issue could undermine our position long term. More manpower is required to police these regions effectively.\n\nGeneral Luis Delgado, Head of Military Security District South."
iberiawars_cityfall.47.a:0 "We shall cleanse the city as efficiently as we took it."

iberiawars_cityfall.48.t:0 "Liberation of Évora"
iberiawars_cityfall.48.d:0 "For the eyes of the King: Notification regarding the successful liberation of Évora.\n\nSire,\n\nRegrettably, while Évora has now been secured against continued organized resistance to our forces, I cannot report to you that the city is at peace. The assault extracted a high price from the city, resulting in the damage or destruction of large areas, notably some of its distinctive architecture. Further, it has been informed to me that the city remains unstable with a hostile population frequently acting against our security forces.\n\nInstances of protest remain frequent. Currently we are trying to limit hostile actions against dissidents for fear of escalating the situation, however our security forces are stretched thin. Further the situation seems to be resolving at a slow pace, pressing our forces further. Hopes that the difficult humanitarian situation, which while not catastrophic is certainly present with food and medical supplies scarce in some areas, would naturally calm the protests have been proven unfounded.\n\nAside from protests, terrorist attacks remain frequent, something that has been complicated by the aggressive population. While their attacks fail to fatally affect operations in the area they act as a constant draw on our resources.\n\nHowever, let me state that this does not take away from the achievement of your armed forces. Despite the odds they took and continue to hold one of Portugal's key cities.\n\nGod Save the King\n\nDefence Minister Fernando dos Santos Costa"
iberiawars_cityfall.48.a:0 "Righteousness begets struggle, struggle begets Victory."

iberiawars_cityfall.49.t:0 "Liberation of Évora"
iberiawars_cityfall.49.d:0 ""Why do you make me do this?"\n\nThe room was bright, the blue sky outside allowing in glistening sunlight. It illuminated a wretched shape tied to a central table with their limbs outstretched. Bloodied and broken, they wept openly, fueled by the putrid stench of the room and the grievous wounds upon their body. Their arms and legs were bent at perverse angles, shards of bone piercing the skin. Discarded lay a blooded bat.\n\nA man looked outside, admiring the day while fitting a belt. "I'm not a monster, friend. I enjoy many of the things you do. A nice place to work. A warm day. A drink in the evening." He turned and walked to his snivelling subject, displaying the belt of surgical tools he wore.\n\n"If you tell me where the rest of your resistance cell is, my job is done. We can talk about something far more civil." He smiled warmly. "If you people didn't persist in your folly, this wouldn't be necessary. I'd much prefer to meet as friends than rivals. After all, aren't we both subjects of the King?"\n\n"I'm not part... of any cell... I don't know... Please..." came the strained hesitant reply.\n\nThe Man sighed, drawing a scalpel from his belt. It was long and slightly curved at its end, still dripping from the alcohol it had been soaking in prior.\n\n"I am truly sorry brother, but if we have to continue this unpleasantness so be it. It's your choice." Soft, squishy tearing cried around the room, a sickening sound barely masked by the scream that accompanied it.\n\n"Where are your friends?" said the Smiling Man."
iberiawars_cityfall.49.a:0 ""I would love to meet them.""

iberiawars_cityfall.50.t:0 "Liberation of Évora"
iberiawars_cityfall.50.d:0 ""Great job, you idiot!" The staging point's leader jabbed his finger at the tank. "Do you realize how old that temple was?" In response, Gaspar made a visceral sound he didn't quite know the meaning of, looking between his other crewmates. The loader was cautiously understanding while the assistant driver looked up at the sky, maybe hoping that God would scoop him up to heaven for a few minutes. His commander—a younger man whose vocal cords had been obliterated by all the shouting he did in the cockpit—was eerily silent for once.\n\n"Sir, there were protesters all around us. They had the whole street locked down." Gaspar spoke up, remembering the inadvertent crunching of the Roman stone under the treads of his tank as he'd attempted to maneuver.\n\n"The protestors." The leader's voice was like a hyena's yelp: sharp and mocking. "João, who do you think history will remember when this war is over? You want to live long enough to see that happen, right?"\n\n"Yes sir."\n\n"So who will they remember: a few enemies of the revolution? Or the cultural vandals?" Gaspar felt a strand of sweat sliding down the nape of his neck, yet he dared not raise a hand to swipe it away. Now, it was time for the staging point's leader to make the same few visceral sounds. He looked down at his watch and sighed."
iberiawars_cityfall.50.a:0 ""Dismissed. Use some common sense in the future.""

iberiawars_cityfall.51.t:0 "Liberation of Faro"
iberiawars_cityfall.51.d:0 "For the eyes of the King: Notification regarding the successful liberation of Faro.\n\nSire,\n\nIt is my pleasure to announce that Faro has been seized from the usurpers through a rapid assault. Cessation of local hostilities has been largely achieved, and I have received reports that the rapid expulsion of republicans from the city has been a major success in our Algarve operations.\n\nThe city, with its location on the Gulf of Cádiz, represented a major republican stronghold in Southern Portugal. Our forces therefore contained the city, forming a perimeter around it and resisting attempts to break the encirclement, before staging a shock offensive with the use of mechanized units and storming units. Coordination between aerial, artillery and mobile units restricted any attempts to resist. Of note, forward units were able to seize the airport and prevent the evacuation of a variety of significant republican figures. Those who were seized alive are being relocated North for further interrogation.\n\nEffects on the civilian population have been significant, with attempts at fleeing blocked to prevent complicating local logistics any more than they already are. Those whose homes are uninhabitable are being distributed to accommodations conducive to local operations.\n\nTerrorism persists in the area, particularly among former left wing military units and sympathizers. Plans to expand our counter-terrorism operations in the area are being compiled presently and I hope that our citizens can have peace restored as soon as possible.\n\nGod Save the King\n\nDefence Minister Fernando dos Santos Costa"
iberiawars_cityfall.51.a:0 "Our Majesty shall shine to all corners of our land."

iberiawars_cityfall.52.t:0 "Liberation of Faro"
iberiawars_cityfall.52.d:0 "War had not been as young recruit Beto had imagined it. Yes, there was glory for those looking at the great maps. For his platoon, it had been a drudging, deadly boredom.\n\nRecent weeks had been little but standing sentry and the occasional patrol where nothing happened, but a tantalizing sense of finality rushed through him as he and his comrades broke the pithy resistance of the Faro Airport defenses. With a roar, he was first through the breach and charged towards the escaping plane their tank had struck, smiling. Final, scattered gunshots sounded as the final efforts at defense were made, but most were fleeing across the tarmac. He would be the first to claim any survivors as prisoners. That, at least, was his.\n\nThe smell of the burning plane wreck was repulsive. Beto saw a twisting mass amongst the flickering flames and, bracing himself against a smoldering chair, it took several moments to realize the thing was human. Amongst the debris and oozing once-peoples, it stared at him with unblinking eyes. It tried to reach out, even stand, only half-aware of its fate. With pure agony, the arm was raised, before dropping along with a dollop of sloughed-off flesh.\n\n"Help..." It twisted with the motions of Beto's guts, a voice as charred as the corpse before him, "I didn't want to. Please... ho- home, take me! Now! I'm your Mayor. Me, Rodrigo! Mama... save me..." Its rasp concluded and energy spent, it slumped, muttering.\n\nWide-eyed, Beto silently walked away. Further and further he retreated, but the horror he felt only built. Even keeling over to puke did not stop the assault on his senses. Looking back, he saw his squad following him in abandoning the wreck, pursued by more than the stench."
iberiawars_cityfall.52.a:0 "The continuing battle called them from across the tarmac, and they fled towards it."

iberiawars_cityfall.53.t:0 "Liberation of Guadalajara"
iberiawars_cityfall.53.d:0 "Communique to the Office of the President of the Spanish Republic\n\nSir,\n\nGuadalajara has been taken with the final hostile units withdrawing from the city. Our flag flies over the city and citizens are beginning to greet our units. Currently great caution is being exercised due to the potential for attacks from still-hidden isolated units or Nationalist aligned terrorists.\n\nThe city has been able to avoid substantial damage in the central areas, with most of the harsher fighting confined to the residential areas on the outskirts. A threat of encirclement thanks to a breakthrough of our forces on the Western side of the city forced a choice between withdrawal or a siege; it appears the defenders chose an ordered withdrawal.\n\nSomething that likely precipitated this choice was the high degree of civilian resistance to the troops within the city. There is evidently a high degree of enthusiasm for regime change within the city. We have testimony of multiple small uprisings in the enemy rear, of which some were successful in securing entire city areas.\n\nDisturbingly, some isolated Falange aligned troops who remained in the city began to employ civilians as mobilized soldiers. While confrontations against such groups were limited, they prompted some instances of violence. Care is being taken to shield journalists from those violent situations, however instances where civilians surrendered will be used in reports.\n\nPress Releases are being prepared. Guidelines for broadcasting the stories relating to the uprisings are being prepared, with appropriate interviewees being screened. With the right portrayal we can turn Guadalajara into a model for future urban offensives."
iberiawars_cityfall.53.a:0 "We shall give the people an example to follow."

iberiawars_cityfall.54.t:0 "Liberation of La Coruña"
iberiawars_cityfall.54.d:0 "TOP SECRET\n\nCOMMUNIQUE TO THE WAR MINISTER: FOR IMMEDIATE ATTENTION\n\nSir\n\nLa Coruña's administration has now been successfully transferred to the Military Security District. Fortunately, resistance appears to be manageable with terrorism present, but tolerable, with appropriate measures being carried out by security forces. Intelligence suggests that desire for continued dissent among the citizens is low. However active cooperation also appears low, as such marital law has been continued as a precaution. Unjustified troop transgressions against the local population have been kept to an acceptable minimum.\n\nNotable dissidents who failed to flee are currently being interrogated and will be dispatched elsewhere for enhanced interrogation. Humanitarian efforts are ongoing in the city. Citizens will be required to register in order to ease apprehension of suspected secessionists or political radicals.\n\nArmored vehicles requested to improve ability to patrol safely as terrorists seem to have a limited supply of heavy weapons.Patrol boats required to reconnaissance coast as remaining groups are suspected to be established in remote areas.\n\nGeneral Francisco de Rivera, Head of Military Security District Galicia."
iberiawars_cityfall.54.a:0 "History is a a web of anticlimax."

iberiawars_cityfall.55.t:0 "Liberation of Leiria"
iberiawars_cityfall.55.d:0 "For the eyes of the King: Notification regarding the successful liberation of Leiria.\n\nSire,\n\nIt is my pleasure to inform you that the liberation of Leiria has been successfully concluded, with all metropolitan areas secured in addition to the surrounding area. The likelihood of counter-attack at present seems minor. I have received a comprehensive report from the local commander, and summarize as thus:\n\nAs you are aware, our current strategy indicates that we wish to use this city as a hub for future efforts to rescue the areas controlled by the Republicans. To that end, care has been taken to limit damage to a practical military necessity. While some areas suffered moderate to high damage, most of these were residential areas away from major logistical infrastructure.\n\nFurther, moderation is being encouraged in the troops regarding their treatment of the citizens in order to ease integration and stability efforts. We are aware that public expressions of dissent are still occurring, however few instances have developed into any more than grumbling. As such, some of the more liberal within your administration can assure themselves. We are developing a range of plans to deal with dissident views which may be harmful to the Kingdom once the situation is further consolidated for you to view at a later date.\n\nMany of our troops call Leiria the gateway to the Republic. I share their hope that this war will soon end.\n\nGod Save the King\n\nDefence Minister Fernando dos Santos Costa"
iberiawars_cityfall.55.a:0 "The Crown recognises restraint in its benefit."

iberiawars_cityfall.56.t:0 "Leiria's Symbols"
iberiawars_cityfall.56.d:0 ""You there, man in the coat! Turn around."\n\nHe turned, a trim and lean man wearing an ill fitting overcoat, dark brown with discolored patches. His clothing underneath was at odds with the once expensive coat, a stained green shirt with beige trousers, ripped and blackened with soot and dirt.\n\nBehind him were two officers, neatly presented - at odds with the fatigued population keeping distance from them. "Your coat, give it to us." said one of them.\n\nThe lean man gave it to them without question, quickly taking it off. The officers examined it, taking interest in a lapel pin on its breast.\n\n"Where did you get this?"\n\n"My home was destroyed in the battle sirs, I've been living rough since then. The nights can get cold, so I found this coa-"\n\nThey closed the gap between them, positioning the lean man between them. He looked at them both, their brown eyes red with hostility. " This pin, it's a Republican pin." they told him, pointing to the pin they'd taken interest in.\n\nThe lean man looked at it blankly. He hadn't noticed it before. "It is?"\n\nThe answer came from the pin, an officer jamming the pin into the lean man's arm. He cried out, as a fist knocked him to the ground. The Officers threw the coat in the street, and started beating the lean man. He impotently shielded himself from their boots; the city just walked past.\n\nThe coat lay in the gutter, trampled and soiled."
iberiawars_cityfall.56.a:0 "A young girl picked it up days later."

iberiawars_cityfall.57.t:0 "Liberation of Lisbon"
iberiawars_cityfall.57.d:0 "For the eyes of the King: Notification regarding the successful liberation of Lisbon.\n\nSire, the taking of Lisbon represents a major step forward in our efforts to restore stability to Portugal and I am deeply happy to be able to report to you that our recent campaign to secure it has been a success. Our flag now flys over the city, and I have received the reports from the local commanders describing their efforts to secure the city.\n\nBoth regular and irregular forces attempted to close the peninsula and force us into a prolonged engagement, perhaps wishing for us to exhaust ourselves in preparation for a breakout. As such lines of entrenchment and fortifications had been built. Fortunately, through the gallantry of certain officers - whose names have been forwarded to you for recognition of their merit - our soldiers were able to break through Republican lines and enter the city. Due to the rapid advance most regular units of the Republican army were encircled and destroyed in the outskirts.\n\nDespite this success, irregular resistance remained high in the city resulting in a longer campaign than hoped, and even now we still suffer terrorist attacks from armed republicans. The wider population retains some hostility to our administration; as such we have had to repeatedly employ a firm response to local provocations. Fortunately however organized resistance has melted, and security forces assure me the current insecurity will soon cease. Individuals willing to serve their King and possessing useful skills are being screened to establish a new city administration. Further information on that shall be provided as and when it is available.\n\nGod Save the King\n\nDefence Minister Fernando dos Santos Costa"
iberiawars_cityfall.57.a:0 "Despite their reluctance, light shall shine on our golden city."

iberiawars_cityfall.58.t:0 "Liberation of Lisbon"
iberiawars_cityfall.58.d:0 ""At least the city looks as miserable as we are," Francisco thought to himself as he and his captured comrades marched, heads bowed and packed like cattle, through the ruins of the once beautiful city of Lisbon.\n\nEnough of the roads were cleared of rubble for the victory parade to proceed without issue, but overwhelmingly the inner city was still little more than ruins and debris, hardly resembling a place suitable for human life. From the once proud buildings to the lush parks, punctuating lunar craters and jagged wrecks declared their mockery of what had once been beautiful.\n\nBut such matters were hardly his concern anymore. He and his fellow prisoners marched through the shattered streets before the hollowed eyes of the populace until they would reach their destination and swear loyalty to the so-called King.\n\nFrancisco noticed in his quick glances that within those empty eyes of the crowd, the mood seemed to be in sync with his own. He glimpsed measured hatred in the eyes of a bold few as they watched this sham play out, standing out in the disheveled mass. Their hatred never reached their mouths or hands however as proud soldiers stood all around. Above them, brief and occasional flashes informed all of watching snipers, sentinels ensuring the sheep didn't stray away.Francisco continued on with his brothers, his shame matched only by his despondency. The heart of Portugal had been taken and soon, he would pledge himself to the idol of those who had taken it."
iberiawars_cityfall.58.a:0 "He wasn't sure what the oaths of broken men were worth."

iberiawars_cityfall.59.t:0 "Liberation of Lisbon"
iberiawars_cityfall.59.d:0 "Luís hobbled along the rubble-strewn streets of Lisbon, his makeshift wooden crutch occasionally catching on a crack in the ground or some stray brick. The ghost of his leg ached in the humid morning air, and he silently cursed his condition.\n\nHe had been a soldier for the Republic. All he had to show for it was a missing leg and red flags hanging over the city he had been fighting to protect. With sore arms, he collapsed onto a mostly intact bench to regain his strength. Across the street, he saw the local butcher sweeping broken glass in front of his shop. A woman he couldn't quite remember the name of was walking by and as she passed the butcher Luís heard an all too familiar phrase. "Long Live the Revolution!" she said, the butcher responding in kind.\n\nThroughout the rest of Luís's day as he attempted to sort out some errands, dragging himself through a city slowly trying to recover some semblance of normality, he heard it over and over again. "Long Live the Revolution!", "Long Live the Revolution!" over and over again like a religious creed said during a mass. In greetings and farewells, it seemed the revolution was ever present.\n\nThe individual words in the phrase had stopped sounding like words to Luís's ears amidst the cacophony of identical greetings, even making him wince every time he heard it. Ever since his city had been lost, it was as if the citizens had been replaced by socialist caricatures of themselves. Even Luís, always something of a cynic, hadn't expected even the most innocuous portions of everyday speech to become a political action. How fast those he'd been sworn to defend had suddenly become revolutionaries."
iberiawars_cityfall.59.a:0 "He would have laughed at the absurdity, but the phantom pain was ever present."

iberiawars_cityfall.60.t:0 "Liberation of Madrid"
iberiawars_cityfall.60.d:0 "Communique to the Office of the President of the Spanish Republic,\n\nSir,\n\nWe have successfully secured the city of Madrid. Troops and material are moving into the city. The final bastions of organized resistance have either capitulated or been neutralized.\n\nThe city was captured in a surprisingly sound condition. Resistance was fierce but that was within our expectations as we organized the assault. Numerous hostile units throughout the city used conventional and guerilla tactics to prevent our advance, fortunately most of the widespread damage has been limited to the outskirts.\n\nWe have evidence of mass intimidation and conscription of residents in an attempt to utilize them against our advance. Captured administrators and officers suspected to be involved are being relocated for further interrogation on their methods and crimes. There is a large number of irregular captives being held on the outskirts of the city awaiting the decision of the government in regards to their fate.\n\nWe discovered some local uprisings within the city that weakened enemy strongholds, with the unfortunate loss of many documents as the public took to looting and burning. Rather than criticize, a timeline has been created of the essential truth and shall be distributed by agents in cities that remain occupied in the hopes of spurring more unrest.\n\nThe Media have already submitted applications for morale boosting broadcasts and events to be filmed and aired around the city, which shall be passed to the relevant officials in due course.\n\nIn regards to civilian casualties, they were within acceptable ranges."
iberiawars_cityfall.60.a:0 "A bloodied jewel of a new crown."

iberiawars_cityfall.61.t:0 "Liberation of Málaga"
iberiawars_cityfall.61.d:0 "TOP SECRET\n\nCOMMUNIQUE TO THE WAR MINISTER: FOR IMMEDIATE ATTENTION\n\nSir,\n\nThe security situation within Málaga remains unstable despite the cessation of organized resistance within the city limits and its transfer to security forces.\n\nTHe fighting for the city was characterized by a high proportion of irregular resistance to our forces, with paramilitary confrontations at the City Hall, the regional university hospital and La Rosaleda Stadium to name three notable locations of sieges. Damage to public buildings and areas rebels identified as defensible has been considerable. With attacks from terrorists continuing proper reconstruction, as well as the consistent flow of supplies into the city, carry prohibitive risks. Morale among the ranks of security personnel has collapsed due to the heavy and consistent threat of terrorist assault, further exacerbating the difficult relationship between the population and the MSD.\n\nMore Intelligence assets and personnel are desperately required, as well as armored vehicles to make traversal through the most dangerous parts of the city less risky.Materials to begin construction of Supervised Refugee Centers outside city limits in order to disperse the populations of the more unstable districts also requested.\n\nGeneral Luis Delgado, Head of Military Security District South"
iberiawars_cityfall.61.a:0 "Cowards think not wearing uniforms will hide them. We will see them."

iberiawars_cityfall.62.t:0 "Liberation of Oviedo"
iberiawars_cityfall.62.d:0 "Communique to the Office of the President of the Spanish Republic,\n\nSir,\n\nOviedo has been secured, with positions being entrenched on the perimeter. However, it seems unlikely that any successful attack will be able to force us out in the immediate future. Attacks on local logistics remain, however military supplies remain sufficient. There is a developing humanitarian crisis developing however amongst the civilian population.\n\nOviedo saw considerable hostilities, with the city's defenses having been designed with a long siege in mind. Literature recovered from the city demonstrates this was a central propaganda tool by the defending garrison in the employment of civilian aid. As such, during our assaults we faced well entrenched positions with contact points often in close proximity to non-combatants.\n\nThe extent to which civilians were forced to remain in the city or chose to stay is as yet unclear with rivaling testimonies. Further, the exact purpose of them is also unclear as intelligence suggests they were predominantly laborers or paramilitaries, but the high number of women and children and their frequent proximities to assaults suggest a more nefarious human shield possibility. Analysis and interrogations are ongoing.\n\nRegrettably, that does mean that there was a very high number of collateral deaths despite our best efforts. The approximate numbers have been suppressed, although the Media have been provided with a more palatable lower end prediction. Most of these have been blamed on atrocities committed by the defenders. Some of the large capacity grave sites have been photographed and labeled as constructed by nationalist troops in order to avoid an unnecessary effect on public morale."
iberiawars_cityfall.62.a:0 "We gave them the propaganda number."

iberiawars_cityfall.63.t:0 "Liberation of Pamplona"
iberiawars_cityfall.63.d:0 "TOP SECRET\n\nCOMMUNIQUE TO THE WAR MINISTER: FOR IMMEDIATE ATTENTION\n\nSir\n\nLimited resources. Difficult terrain. Excess of dissidents suspected locally.\n\nOrganised resistance destroyed. Shock attacks routed forces. Hostile units suspected to have fled and reorganised.Terrorist activity significant. Improvised explosives, ambushes and assassinations frequently employed against security personnel.\n\nActions Taken: Dissident arrests and emergency sentencing, martial law, controlled demolitions. Hostile regions identified and quarantined.\n\nConcerns: Overstretched units. High attritional losses. Hostile population limits operational effectiveness outside core areas of the city.\n\nRequest: Reinforcement. Updated rules of engagement for the region. Materials for construction of 3 more detainment camps. Details shall follow in report.\n\nGeneral Emilio Huesca, Head of Military Security District Basque-Navarre."
iberiawars_cityfall.63.a:0 "From behind every wall, car or hill comes a bullet."

iberiawars_cityfall.64.t:0 "Liberation of Porto"
iberiawars_cityfall.64.d:0 "Belmiro and Hélio watched as their men squatted in front of the Porto City Hall's arches. After all the charges were in a position, they'd retreated to a safe distance to watch their handiwork. Black explosives now clung to the bricks like ticks, wires flowing inside, but there would be no slow atrophy. With a single click of the detonator, the arches crumbled inward with the hall's clock tower imploding in on itself. The decorative pool rippled before becoming soiled with a thick layer of dust, turning the greenish water grey.\n\n"Seems wasteful, doesn't it?" Belmiro muttered as his eyes flicked between the ruins and the celebrating soldiers. "You know someone is going to have to rebuild another hall, right? With our luck,after the war is over, they'll probably put us to work on it." Leaning on the railing, he shook his head. "Why was the order even given?"\n\n"Can't change the world without smashing a few monuments," Hélio reasoned something that sounded vaguely like theory. Without a concrete explanation from the high command, that was as good as anything. "Once, the castles of the old kings seemed eternal."\n\nBelmiro snorted. "But their castles are still around. Some of them are even — you know — used."\n\nHélio waved his hand dismissively toward the settling dust. "By getting rid of the old, you are making space for the new." Turning to his squadmate, he slapped his back, making Belmiro straighten up. "And if it all goes wrong, we'll just tear down whatever they build next. We — the people — are in charge now."\n\nBelmiro didn't respond right away. Instead, he stared at the rubble."
iberiawars_cityfall.64.a:0 "Maybe."

iberiawars_cityfall.65.t:0 "Liberation of Setúbal"
iberiawars_cityfall.65.d:0 "For the eyes of the King: Notification regarding the successful liberation of Setúbal.\n\nSire, Setúbal now lies securely in our control. It is my pleasure to inform you that your armed forces conducted themselves admirably in the conduct of the assault, to such an extent that our propaganda efforts shall make special mention of the success of this assault.\n\nThe securing of the city was achieved with far less need for destruction than had initially been feared. Fighting was intense in the surrounding areas of the city, however through the skill of our officers our forces could rout much of the enemy and force them to retire away from Setúbal itself. As such, our forces within the city faced a much diminished force. Our momentum carried the day with a large amount of prisoners and captured material taken. A series of Holding Camps have been constructed near the city for prisoners pending transportation to more secure sites.\n\nAs such many of Setúbal's historic monuments and buildings have remained intact, if not undamaged. This is obviously an astounding victory for Portugal herself and images of soldiers visiting some of the most notable buildings will be distributed to newspapers soon.\n\nDue to our success in taking prisoners, intelligence on established terrorist cells could be extracted swiftly and efficiently and a combination of rapid arrests and displays of force have resulted in a city far more peaceful than had been prepared for. Civilian losses were well within acceptable ranges. Also, the majority of the City's administration was unable to flee as a result of our rapid assault. They have been detained and are currently being interviewed. Discussion on what we shall do with these administrators shall be discussed at our next meeting.\n\nGod Save The King\n\nDefence Minister Fernando dos Santos Costa"
iberiawars_cityfall.65.a:0 "With God on our side, our forces are carried on the wind."

iberiawars_cityfall.66.t:0 "Liberation of Setúbal"
iberiawars_cityfall.66.d:0 "To say they were herded into this place like pigs would be inaccurate; a farmer would have at least cared enough about his animals to ensure their value. Their captors had no such concerns, something abundantly clear as they shoved them through the narrow corridors of the stadium, bumping and crashing into one another in a desperate stampede to the relative freedom of the clearing.\n\nAfonso was lucky to have made it out without being stomped or kicked to death and he savored the fresh air like it was wine, many of those who had been with him were hardly as lucky.\n\nThen came the wait.\n\nThey stood there in the middle of the stadium as more and more of their comrades were shoveled in like rats. Before long they all began talking, an attempt to make their miserable situation slightly more bearable through a veil of civility, like a losing team trying to move past humiliation.\n\n"I came here a lot before, this is the Estadio do Bonfim" said Gonzalo. Alfonso didn't know him well but unlike him was a native to the area along with many of the other captives. "My brothers and I would come here often to watch the games."\n\n"Surprised it looks so pristine, from here it looks as if there was hardly any war at all" another prisoner noted of the turf before the voice of barked angry orders silenced them all. They looked up to the stands to see men setting up machine guns across the stadium, positioned such that the entire field could be covered.\n\nSuddenly all their attempts at conversation evaporated.\n\n"
iberiawars_cityfall.66.a:0 "Game. Set. Match."

iberiawars_cityfall.67.t:0 "Liberation of Setúbal"
iberiawars_cityfall.67.d:0 "Heinrich awoke as the door cracked in two, the battering ram breaking the thin wood nearly in twain, before being kicked down. His room was little more than a closet with a bed, and he sat up in shock and fear. Armed men stood watching him in civilian clothes, no uniforms besides a red rag tied around their arms. Questions died in his throat; despite his pajamas he felt naked.\n\nKeeping their weapons visible the armed men parted, allowing a single policeman to enter. The only uniformed intruder, he carried himself with authority, completely at ease with the men around him. "Senyor, comtchamas?" he asked, calmly but firmly. Heinrich tried to get out of bed but the Officer raised his hand, an nonverbal command to stop, before repeating his question. It was a question that Heinrich couldn't understand, his slim Portuguese little help against the thick accent of the Officer.\n\n"Uh, deshculpa... no compriendo... pilot du linha-"\n\nThe officer rolled his eyes. "Twu Esh lmao reshistrado nesht epartmento?" he asked, annoyance seeping into his voice while drawing a swastika in the air with his fingers. Heinrich nervously looked back at the armed men then to the officer. The Officer had said something like "lmao" while signing a swastika...Alemao? He was asking if he was German?\n\n"Ja, uh, sim. Ich denke schon?"\n\nThe officer nodded and turned around, leaving Heinrich still frozen on his bed. "Matu" he said to the men.\n\nHeinrich had only moments to guess the meaning of the command before the men opened fire, Heinrich's ears briefly filled with furious clattering - he didn't have time to scream as bullets destroyed him."
iberiawars_cityfall.67.a:0 "The bloodied corpse was left where it was, a swastika crudely painted beside the door frame."

iberiawars_cityfall.68.t:0 "Liberation of Sevilla"
iberiawars_cityfall.68.d:0 "TOP SECRET\n\nCOMMUNIQUE TO THE WAR MINISTER: FOR IMMEDIATE ATTENTION\n\nSir,\n\nThe situation in Sevilla refuses to stabilize despite our successful capture of the city which lay at the heart of the Republican rebellion. Rebel groups from multiple factions continue to fight our security forces as well as each other. Street violence within Seville is not yet consistently suppressed.\n\nLethal force has been authorized dependent on officer initiative. Some officers have levied complaints regarding the excessive conduct of Falngist aligned troops, however given the difficult situation it has been decided to rather deploy Falangist units to the most troublesome areas rather than restrain them.\n\nSupplies are currently being lost at an average rate of 40% per shipment thanks to mines, partisan ambush and raiding. Starvation is further undermining the security situation with raids on supply depots. Attempts to create secure refugee camps outside the city continue but the local population in high risk areas remain resistant to relocation. Harsher methods may have to be taken.\n\nGeneral Luis Delgado, Head of Military Security District South"
iberiawars_cityfall.68.a:0 "If they bite the hand that feeds, we have no choice but to punish."

iberiawars_cityfall.69.t:0 "Liberation of Valencia"
iberiawars_cityfall.69.d:0 "TOP SECRET\n\nCOMMUNIQUE TO THE WAR MINISTER: FOR IMMEDIATE ATTENTION\n\nSir,\n\nValencia's capture and subsequent placement under military administration has been achieved with relative success, most notably in the strategic objectives regarding the limitation of rebel access to the Mediterranean - to which the loss of a major part is undoubtedly an achievement for our cause.\n\nRegrettably there have been complications in the cessation of active terrorist activity within the Military Zone after the establishment of martial law. With the city being secured with less destruction than was originally projected, most combat being outside of the city, it was thought that the area would be easier to stabilize. Instead large amounts of logistical sabotage in the port, city and surrounding region as well as persistent terrorist raids on convoys has created a frustrating situation where supplies from abroad hoped to enter via Valencia cannot while supplies and reinforcements from elsewhere in Spain struggle to distribute in the area.\n\nIn order to make Valencia a secure lynchpin of controlling the Spanish coast and Mediterranean access we urgently require at least 2000 men plus equipment and support for use in garrisoning duty, as well as delivery of 48 requested armored vehicles and 32 Commercial Vehicle Weapon Carriers for expansion and reinforcement of the armored cavalry assigned to convoy guarding.\n\nGeneral Carlos Costa, Head of Military Security District East."
iberiawars_cityfall.69.a:0 "We must have what we require to ease the rot."

iberiawars_cityfall.70.t:0 "Liberation of Valladolid"
iberiawars_cityfall.70.d:0 "Communique to the Office of the President of the Spanish Republic,\n\nSir,\n\nValladolid has been secured, marking a major landmark in our Northern Campaign. The city was maybe one of the most fortified cities thus far in the campaign, with our assessment being that securing the city will be a major part in guaranteeing victory in the War.\n\nThe city had become a maze of entrenched positions, ambush traps and fortified buildings. Further, the city remains home to one of the most ideologically opposed civilian populations we have reclaimed so far.\n\nThe city is a hub of monarchist sentiments leading to a large amount of paramilitary resistance in addition to the troops positioned. Heavy losses as such were incurred, requiring the usage of heavy weapons and indirect fire tactics. The result has been a large degree of damage across the city with large displacements of civilians. Food and water deprivation amongst refugees is critical, with current strategies failing to aid most.\n\nThe retreat was sudden and unexpected, apparently without prior organization suggesting either a breakdown of communications or a sudden change of strategy. Whatever the cause, the ability of enemy forces to withdraw was hindered by the large number of refugees. Some forced their way through the bands while others were slowed enough to be neutralized.\n\nDue to the large degree of radicalization within the city, as well as the degree of damage, many areas are being relocated to humanitarian camps in the surrounding area. The Media are being barred from much of the interior of the city citing security concerns as we continue to sweep for hostile units."
iberiawars_cityfall.70.a:0 "Rather free dust than enslaved opulence."

iberiawars_cityfall.71.t:0 "Liberation of Vigo"
iberiawars_cityfall.71.d:0 "TOP SECRET\n\nCOMMUNIQUE TO THE WAR MINISTER: FOR IMMEDIATE ATTENTION\n\nSir\n\nVigo is now completely under the administration of the Military Security District. Regrettably Vigo saw a higher than expected degree of irregular resistance and as such sustained a litany of losses. The industrial capacity of the city has been much affected, with the industrial areas seeing the brunt of resistance. Further, reports of troops looting have been reported, which regrettably have led to tensions between the security forces and the populace. Intelligence suggests that while not critical, Vigo will require attention for some time to be pacified.\n\nTerrorism continues, at first minimal but local stories of criminality committed by our forces have led to some increase. Efforts to combat disinformation are ongoing. The economic assessments made prior to the assault, when intelligence suggested a relatively low intensity assault, must be reassessed. Interrogations of dissidents are ongoing, with notable individuals due to be relocated to specialized facilities.\n\nA team must be sent to reassess Galicia's industrial abilities, as well as resources to establish a local media campaign to soften our image in order to prevent sympathies for dissidents causing expensive problems in the future."
iberiawars_cityfall.71.a:0 "Vigo shall cheer, for Spanish peace and prosperity has returned: we command it."

iberiawars_cityfall.72.t:0 "Liberation of Zaragoza"
iberiawars_cityfall.72.d:0 "Communique to the Office of the President of the Spanish Republic,\n\nSir,\n\nZaragoza has fallen, with our advance units confirming the total retreat of hostile forces.\n\nZaragoza has suffered substantial damage. Their units appeared to have high morale and good fortifications, with the city having been prepared to withstand a protracted conflict. This was within expectations, due to Zaragoza's symbolic value to all factions of the former regime as one of the first cities to fall in the previous Civil War.\n\nThe worst of the fighting fell in the city's historic districts, a gambit that we would not utilize substantial heavy weaponry in those areas. Limited use was permitted and maintained a mobile frontline, to the expense of the city. Losses to ambushes and guerilla tactics remained high throughout the city, increasing as the defense began to disintegrate.\n\nAll areas of the city have experienced at least some damage and there is a high risk of remaining Nationalist radicals or guerilla forces. Civilian opinion is split; while the Republic enjoys some support there is a majority in the city who are at least sympathetic to the old regime. Possible educational initiatives are being trialed to reeducate the hostile population. The collapse of local civilian logistics has aggravated this.\n\nRegrettably, there have been instances of troop reprisals against surrendered soldiers and local administrators. Such instances were without formal approval and any information related to the incidents is being controlled for fear of sparking civil unrest. Involved units will be redeployed, however in the interest of limiting any possible leak of information no formal disciplinary action shall be taken."
iberiawars_cityfall.72.a:0 "All for the greater good."

iberiawars_cityfall.73.t:0 "Liberation of Leiria"
iberiawars_cityfall.73.d:0 "Artur looked up at the sky, a dim glow being the only indication that the sun existed beyond the smoke and ash. Still, it was more pleasant than staring at the husks all around him. The grey ruins looked barely enough like buildings to notice the lost and unappreciated qualities of life, like staring into the face of a mangled corpse.\n\nThe sound of his comrades' boots set the tempo for their march: a crunch of concrete followed by the crackling of glass — like brittle ice breaking apart. Being a border city put it squarely between the barrages from both North and South, it was no wonder that Leiria ended up like this.\n\nHe had visited the city once as a kid, being utterly overwhelmed by the cacophony of cars and people. Now, Leiria was still, as if struggling to breathe. There were no chirps of birds or sloshing of the fountains. There were no children running through the streets and no yells from parents. There was nothing. There was no one — not a soul, save for his sunken-eyed comrades.\n\nHis sergeant turned to confirm that the rest of his men were still with him and that he hadn't wandered into hell by accident. He opened his mouth, searching for words, but no sound came out. Instead, he turned back and trudged forward. However, Artur had glimpsed the uncertainty in his eyes. After all, there were no landmarks to mark their way — no goal to march towards."
iberiawars_cityfall.73.a:0 "Could this still be called a city?"

iberiawars_OFN_POR.1.t:0 "Azores and Madeira"
iberiawars_OFN_POR.1.desc:0 "FROM: Ministry of Foreign Affairs\nTO: The Council of Ministers\nSUBJECT: Negotiating the return of the Azores and Madeira\n\nThe Ministry of Foreign Affairs has received a request from the American Department of State to negotiate the potential return of the illegally occupied archipelagos of Azores and Madeira ("the islands").\n\n- The islands are under the control of the illegitimate Portuguese Confederation after their failure to seize control of Portugal during our last war. This occupation is a violation of our sovereignty by an insurrectionist movement.\n- The islands are a vital component of our power projection in the Atlantic. It is imperative that we return these islands to our control as soon as possible.\n- The Portuguese Confederation is a pro-OFN organization, with lobbies in OFN member states such as Brazil. Should the Confederation ever take power, it will turn Portugal into an important foothold for the OFN in Europe.\n- While the OFN may prefer the Confederation, they are aware of the limited power of the Confederation in its current state. At the time of writing, the OFN has not engaged in direct and formal talks with the Confederation.\n- The OFN will require concessions from Lisbon in order to support recognizing our claims over the islands. Topics may include OFN access to Lajes' airfields, investment rights in Portugal, and military aid.\n- Should we fail to negotiate with the OFN, they may prefer to deal with the Confederation outright. From the islands, the Confederation may be able to launch an invasion of Portugal if sufficiently trained and equipped.\n\nWe recommend engagement with the Americans on this issue."
iberiawars_OFN_POR.1.a:0 "Agreed. Let's see where this gets us."

iberiawars_OFN_POR.2.t:0 "Azores and Madeira"
iberiawars_OFN_POR.2.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Negotiating the return of the Azores and Madeira\n\nAfter further consideration of the Portugal issue, we have opened a channel to Lisbon. They are interested in negotiating the return of the archipelagos of Azores and Madeira ("the islands").\n\n- Following the defeat of pro-Republican forces in the Portuguese Civil War, remnants of the National Portuguese Liberation Front retreated to the islands. They have since been in exile as the Portuguese Confederation, refusing Lisbon's authority.\n- Located in the Atlantic Ocean, the islands are a key component of Portugal's power projection in the Atlantic.\n- The Portuguese Confederation is a pro-OFN organization, and Lisbon fears that we may prefer what they see as an insurrectionary movement over recognizing the current government. This may make them amenable to negotiation.\n- While the Confederation has petitioned for OFN support, we have requested that they politely ignore them for the moment. At present, they are exiles with limited training and support. If we want to recognize Lisbon over them, we cannot have the OFN approaching them openly and early.\n- If we are to recognize Lisbon's claim over the islands, we will require concessions. Topics may include OFN access to Lajes Airfield, investment rights in Portugal, and military aid.\n- Should negotiations fail, we will be free to engage with the Portuguese Confederation. Options may include backing the Confederation's landing on Portugal's shores.\n\nA full State Department briefing will be organized in the coming days."
iberiawars_OFN_POR.2.a:0 "Lisbon's lovely this time of year, isn't it?""

iberiawars_OFN_POR.3.t:0 "Azores and Madeira, I: Lajes Airfield"
iberiawars_OFN_POR.3.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Azores and Madeira, I: Lajes Airfield\n\nWe have commenced negotiations with the Portuguese government in Lisbon regarding the potential return of the archipelagos of Azores and Madeira ("the islands"). Our first topic of contention is Lajes Airfield.\n\n- Located on Ilha Terceira in the Azores, the Lajes Airfield is the largest of its kind on the islands. Located less than a thousand miles off the coast of Portugal, its strategic value is immense for our ability to operate in the Atlantic.\n- As such, we require a status of forces agreement ("SOFA") that will allow American soldiers to be stationed in the base and also permits American airplanes to utilize the airfield.\n- Lisbon, already skeptical of our intentions, will undoubtedly see this as an attack on their own sovereignty. Whether they accept it as a cost of doing business with the United States is another matter.\n\n- Ideally, we want a guaranteed SOFA that will grant us full and permanent access to the airfield, without the potential for renegotiation by the Portuguese government. We expect that Lisbon will likely expect this to be our opening.\n- In order to assuage their concerns and set a better tone for further talks, we may instead opt to propose a temporary agreement, pending renegotiation at a future date. Lisbon will better appreciate this acknowledgement of their sovereignty.\n\nWe await further instructions."
iberiawars_OFN_POR.3.a:0 "Let's not be hasty here. A temporary agreement will do."
iberiawars_OFN_POR.3.b:0 "We want a proper SOFA. Lisbon just has to live with it."

iberiawars_OFN_POR.4.t:0 "Azores and Madeira, I: Lajes Airfield"
iberiawars_OFN_POR.4.desc:0 "FROM: Ministry of Foreign Affairs\nTO: The Council of Ministers\nSUBJECT: Azores and Madeira, I: Lajes Airfield\n\nWe have received the first demand from the Americans regarding the archipelagos of Azores and Madeira ("the islands"). They have demanded a full status of forces agreement ("SOFA") concerning Lajes Airfield.\n\n- Located on Ilha Terceira, Lajes Airfield is the largest of its kind on the islands. It is a fundamental component of our military capacity in the Atlantic Ocean.\n- Desiring extended capacity in the Atlantic Ocean, they wish to have an American military presence in Lajes Airfield.\n- The SOFA would permit US forces to be stationed in reserved areas of Lajes Airfield, including soldiers, vehicles, and support staff.\n- This SOFA would be binding and indefinite, ensuring that the US military will become a permanent presence in the eastern Atlantic.\n- This was expected; the airfield itself is already effectively under the OFN's control, and they wish to maintain that even if the islands are returned to our control.\n\n- An American presence in Lajes may prove to be controversial to our European neighbors. Further, it would be a perceptible blow to our sovereignty if we allowed foreign troops to be stationed in such a strategically important base. We remind the Council of Ministers that they have the authority and the freedom to defend our military sovereignty.\n- However, we currently do not control the islands. They remain illegally occupied with the implicit acceptance of the OFN. If we are to secure the islands, negotiating with the occupation's backers is necessary to avoid a military entanglement we cannot win."
iberiawars_OFN_POR.4.a:0 "We can't hold back negotiations over this. Accept it."
iberiawars_OFN_POR.4.b:0 "Lajes is on our island, not theirs. Reject this."

iberiawars_OFN_POR.5.t:0 "Azores and Madeira, I: Lajes Airfield"
iberiawars_OFN_POR.5.desc:0 "FROM: Ministry of Foreign Affairs\nTO: The Council of Ministers\nSUBJECT: Azores and Madeira, I: Lajes Airfield\n\nWe have received the first demand from the Americans concerning the archipelagos of Azores and Madeira ("the islands"). They have requested a limited status of forces agreement ("SOFA") between the United States and Portugal in Lajes Airfield.\n\n- Located on Ilha Terceira, Lajes Airfield is the largest of its kind on the islands. It is a fundamental component of our military capacity in the Atlantic Ocean.\n- Desiring extended capacity in the Atlantic Ocean, they wish to have an American military presence in Lajes Airfield.\n- The SOFA would permit US forces to be stationed in reserved areas of Lajes Airfield, including soldiers, vehicles, and support staff.\n- The Americans have offered a temporary SOFA that can be renegotiated five years after current negotiations end. This does open up the potential for future dialogue.\n- The Ministry of Foreign Affairs expected the US, who have de facto control over Lajes during this illegal occupation, to demand full control. A temporary agreement suggests a conciliatory tone.\n\n- An American presence in Lajes may prove to be controversial to our European neighbors. Further, it would be a perceptible blow to our sovereignty if we allowed foreign troops to be stationed in such a strategically important base. We remind the Council of Ministers that they have the authority and the freedom to defend our military sovereignty.\n- However, the Americans have offered terms more reasonable than we expected. A temporary agreement opens up the hope for a full restoration of sovereignty in the future."
iberiawars_OFN_POR.5.a:0 "Temporary or not, Lajes is our airfield. Reject this."
iberiawars_OFN_POR.5.b:0 "This is more reasonable than we expected. Accept this."

iberiawars_OFN_POR.6.t:0 "Azores and Madeira, I: Lajes Airfield"
iberiawars_OFN_POR.6.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Azores and Madeira, I: Lajes Airfield\n\nWe are continuing negotiations with the Portuguese government in Lisbon regarding the potential return of the archipelagos of Azores and Madeira ("the islands"). We are still engaged in discussion regarding a status of forces agreement ("SOFA") for Lajes Airfield.\n\n- We previously demanded a full SOFA that would allow for American troops to be stationed permanently in Lajes Airfield.\n- The Portuguese Ministry of Foreign Affairs has rejected this proposal, claiming that such a demand would be a violation of their military sovereignty. During our delegation's talks, they also suggested that we were effectively forcing this agreement onto them.\n- The Portuguese consider the islands to already be under an illegal occupation. American troops stationed in Lajes Airfield on a permanent basis may suggest to them that the occupation was never removed, but downscaled.\n\n- We may consider easing our current proposal to a temporary SOFA that would allow for American troops to be stationed until five years after current negotiations end, at which time the SOFA would be renegotiated.\n- Lisbon's concern about American troops on the islands is already an early obstacle, one perhaps too great to overcome at this time. If we shelve the topic now and prove ourselves a reliable partner, we may be able to revisit this topic at a later time.\n- Alternatively, we may consider withdrawing from the talks entirely. Lajes Airfield is critical to our ability to project power into the Mediterranean. If Lisbon refuses to engage further on this subject, we may still be able to acquire the airfield by other means."
iberiawars_OFN_POR.6.a:0 "Maybe we can accept something less permanent. Go with the alternative."
iberiawars_OFN_POR.6.b:0 "Let's just put this aside for the moment."
iberiawars_OFN_POR.6.c:0 "To hell with this; let's take our chances with the Confederation. Leave the talks."

iberiawars_OFN_POR.7.t:0 "Azores and Madeira, I: Lajes Airfield"
iberiawars_OFN_POR.7.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Azores and Madeira, I: Lajes Airfield\n\nWe are continuing negotiations with the Portuguese government in Lisbon regarding the potential return of the archipelagos of Azores and Madeira ("the islands"). We are still engaged in discussion regarding a status of forces agreement ("SOFA") for Lajes Airfield.\n\n- We previously demanded a temporary SOFA that would allow for American ground and air forces to be stationed in Lajes Airfield until five years after current negotiations end, at which time the SOFA would be renegotiated.\n- The Portuguese Ministry of Foreign Affairs has rejected this proposal, claiming that such a demand would be a violation of their military sovereignty. During our delegation's talks, they also suggested that we were effectively forcing this agreement onto them.\n- The Portuguese consider the islands to already be under an illegal occupation. American troops stationed in Lajes Airfield are not acceptable to them under any circumstances, whether or not the agreement is temporary.\n\n- We may offer a further compromise to our agreement: limiting our military presence in Lajes to a reduced number of on-site troops, while maintaining both a standard air presence and support staff.\n- Given the reluctance on Portugal's part to allow for an American military presence on the islands, we may wish to shelve this issue for the remainder of these negotiations. If we prove ourselves a reliable partner to Lisbon later, we may be able to revisit this topic in future talks."
iberiawars_OFN_POR.7.a:0 "Fine, let's just drop it for the moment."
iberiawars_OFN_POR.7.b:0 "Loath as we are to accept it, why not? Give them another compromise."

iberiawars_OFN_POR.8.t:0 "Azores and Madeira, I: Lajes Airfield"
iberiawars_OFN_POR.8.desc:0 "FROM: Ministry of Foreign Affairs\nTO: The Council of Ministers\nSUBJECT: Azores and Madeira, I: Lajes Airfield\n\nWe continue to discuss the first demand from the Americans concerning the archipelagos of Azores and Madeira ("the islands"). They have insisted on a limited status of forces agreement ("SOFA") between the United States and Portugal in Lajes Airfield.\n\n- Located on Ilha Terceira, Lajes Airfield is the largest of its kind on the islands. It is a fundamental component of our military capacity in the Atlantic Ocean, and the Americans have requested a continuing presence in this airfield.\n- The SOFA would permit US forces to be stationed in reserved areas of Lajes Airfield, including soldiers, vehicles, and support staff.\n- The American delegation has offered a temporary agreement that can be renegotiated five years after current negotiations end.\n- We previously rejected this proposal, as we have continuing concerns over the presence of American troops on sovereign Portuguese territory, particularly territory of significant strategic value.\n- While the Americans insist on a military presence, they have offered to severely limit the amount of ground forces that can be stationed at Lajes, while retaining the previously-proposed amount of air forces.\n\n- Though we reaffirm our concerns over American troops in Lajes, this is perhaps the best possible outcome on this topic that we can receive.\n- The Americans are insistent on a military presence and will not budge on this issue. If we cannot come to an agreement here, we will not be able to proceed with the rest of the discussion regarding the islands."
iberiawars_OFN_POR.8.a:0 "If the Americans want to blow up talks over this, fine. Withdraw our diplomats."
iberiawars_OFN_POR.8.b:0 "I suppose that's a better compromise. Accept it."

iberiawars_OFN_POR.9.t:0 "Azores and Madeira, II: Foreign Investment"
iberiawars_OFN_POR.9.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Azores and Madeira, II: Foreign Investment\n\nWe are continuing negotiations with the Portuguese government in Lisbon regarding the potential return of the archipelagos of Azores and Madeira ("the islands"). We are opening up a new topic for discussion: access to Portuguese markets for American investors.\n\n- Portugal's economy has experienced sizable growth since the end of the Second World War. Economic investment at this time was limited to internal investors within the Iberian Union and secondary investors in Europe.\n- A significant portion of its industry was destroyed during the Portuguese Civil War. It is Lisbon's priority to repair the industrial damage inflicted by this conflict. American investments may be crucial to the redevelopment of Portuguese industry.\n- By securing investment rights, America will receive an entry into European markets, which have remained closed to us since the end of the Second World War.\n- We can offer Lisbon a reconstruction plan involving substantial investment by the American government. This will require a significant amount of capital on our part, and Lisbon may regard this as an attempt at economic dominance; however, it would be our most generous offer.\n- We may also offer a limited plan attached to private investment rights, in exchange for preferential treatment towards American businesses. While Lisbon may be more hostile towards the private sector, private funds may secure more than our plan.\n- Alternatively, we can offer a far more limited plan, ensuring that American economic activity remains within levels defined by Lisbon. While economically less impactful than our other options, Lisbon may appreciate our restraint."
iberiawars_OFN_POR.9.a:0 "They need what we can give them. Let's fund it ourselves."
iberiawars_OFN_POR.9.b:0 "We can't go bankrupt bailing out Portugal. Let's get the private sector in."
iberiawars_OFN_POR.9.c:0 "Lisbon has to think we're doing them a favor. Let's send them the limited plan."

iberiawars_OFN_POR.10.t:0 "Azores and Madeira, II: Foreign Investment"
iberiawars_OFN_POR.10.desc:0 "FROM: Ministry of Foreign Affairs\nTO: The Council of Ministers\nSUBJECT: Azores and Madeira, II: Foreign Investment\n\nWe have received the second demand from the Americans concerning the archipelagos of Azores and Madeira ("the islands"). They have requested an agreement concerning American foreign investment in Portugal.\n\n- Among the damage sustained in the civil war, our industrial capacity suffered due to bombings, raids, and other acts of sabotage by our enemy. Our economy continues to shrink even as we attempt to rebuild.\n- The United States has offered a large and detailed reconstruction plan, in which the US government will extensively invest in our economy to stimulate and accelerate economic growth.\n- While American private capital may contribute via bonds and other financial instruments, the administration of these funds will be the US State Department.\n- We estimate significant economic growth over the next three years as a result of this plan; however, the Ministry remains concerned about the potential for inequitable and perhaps exploitative economic bonds placed upon us by Washington through this plan.\n\n- We can choose to accept this plan as-is. The amount of investments they propose may be what our economy needs in order to rebuild after the Civil War.\n- We may also reject this plan outright, stating to Washington that we will not agree to any terms with risks violating our economic sovereignty.\n- Alternatively, we may wish to negotiate a compromise. We can reject the recovery plan in its current form, but remain open to economic aid."
iberiawars_OFN_POR.10.a:0 "We need that capital, no matter what. Agree to the plan."
iberiawars_OFN_POR.10.b:0 "Only Portugal should manage Portugal's economy. Reject the plan."
iberiawars_OFN_POR.10.c:0 "See if we can negotiate more limited aid rather than a full plan."

iberiawars_OFN_POR.11.t:0 "Azores and Madeira, II: Foreign Investment"
iberiawars_OFN_POR.11.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Azores and Madeira, II: Foreign Investment\n\nWe are continuing negotiations with the Portuguese government in Lisbon regarding the potential return of the archipelagos of Azores and Madeira ("the islands"). We are continuing discussion regarding access to Portuguese markets for American investors.\n\n- We previously proposed an economic recovery plan, which would have involved immense investment into Portuguese industrial projects to rebuild destroyed infrastructure and industrial facilities.\n- The Portuguese government has rejected this plan, claiming that they do not wish to discuss any outsized American influence over their economy.\n- This is a flat dismissal of the topic; we will not even be able to negotiate industrial aid as a compromise position.\n\n- In light of this, we may withdraw from the talks outright. If Lisbon is unwilling to negotiate on the economy at all, even as they struggle to recover from the damage inflicted by the Portuguese Civil War, it may not bode well for future topics.\n- Alternatively, if we do not wish to walk away from the negotiations, we can move on to our final topic."
iberiawars_OFN_POR.11.a:0 "No, we still need to come to a conclusion here. Let's keep talking."
iberiawars_OFN_POR.11.b:0 "If they don't want to talk, fine. Let's walk away."

iberiawars_OFN_POR.12.t:0 "Azores and Madeira, II: Foreign Investment"
iberiawars_OFN_POR.12.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Azores and Madeira, II: Foreign Investment\n\nWe are continuing negotiations with the Portuguese government in Lisbon regarding the potential return of the archipelagos of Azores and Madeira ("the islands"). We are continuing discussion regarding access to Portuguese markets for American investors.\n\n- We previously proposed an economic recovery plan, which would have involved immense investment into Portuguese industrial projects to rebuild destroyed infrastructure and industrial facilities.\n- The Portuguese government has rejected this plan, claiming that they do not wish to discuss any outsized American influence over their economy.\n- However, they are willing to discuss an economic aid package, one which will not involve direct and immense American investment, but will assist their economic recovery efforts.\n\n- Our recommendation is a financial aid package to assist Portuguese reconstruction. In exchange, we will request privileges and preferential assistance for private American firms and investors operating in the Portuguese market. This will allow us to maintain an economic presence in Europe.\n- Alternatively, we can make clear from the outset that we will limit our private investors' activities in Portugal. Lisbon may be concerned with the kind of treatment we expect them to give to American firms. By declaring our own stringent limits, we can assure them that we do not mean to place undue restraints and boundaries on another country's markets."
iberiawars_OFN_POR.12.a:0 "Let's keep Lisbon happy. Propose the limited aid package."
iberiawars_OFN_POR.12.b:0 "We need to keep our foot in the door here. Propose the aid package and investment rights."

iberiawars_OFN_POR.13.t:0 "Azores and Madeira, II: Foreign Investment"
iberiawars_OFN_POR.13.desc:0 "FROM: Ministry of Foreign Affairs\nTO: The Council of Ministers\nSUBJECT: Azores and Madeira, II: Foreign Investment\n\nWe have received the second demand from the Americans concerning the archipelagos of Azores and Madeira ("the islands"). They have requested an agreement concerning American foreign investment in Portugal.\n\n- The United States has proposed a large economic aid package to help reconstruction efforts for Portuguese infrastructure and industry. In exchange, we will need to give investment rights to the United States, which would grant special privileges and favorable treatment to American companies and investors.\n- The package itself is sizable, though the Ministry remains concerned about the rights that the United States wishes us to give their investors. A full list of demands is attached to this document.\n- If we agree, we may incur the wrath of local proprietors across all sectors and firms of all sizes, who may view the generous attitude we will need to take with American companies as a risk to their own financial well-being.\n\n- We can accept the deal as-is. Given the economic damage we have suffered in the Civil War, any amount of aid that the Americans can grant may be worth the privileges we have to extend.\n- Alternatively, we can request a modification to the existing deal, limiting the amount of privileges given to American investors.\n- We can also reject the deal. While we need all the help we can get in rebuilding, and we need to end the threat of the Confederation, we cannot trade away our sovereignty to the Americans."
iberiawars_OFN_POR.13.a:0 "We need the money. Agree to the terms of the aid package."
iberiawars_OFN_POR.13.b:0 "Americans are capable of reason. Ask for concessions."
iberiawars_OFN_POR.13.c:0 "They're asking for too much, and they'll always ask for too much. Reject the deal."

iberiawars_OFN_POR.14.t:0 "Azores and Madeira, II: Foreign Investment"
iberiawars_OFN_POR.14.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Azores and Madeira, II: Foreign Investment\n\nWe are continuing negotiations with the Portuguese government in Lisbon regarding the potential return of the archipelagos of Azores and Madeira ("the islands"). We are continuing discussion regarding access to Portuguese markets for American investors.\n\n- We previously proposed an economic recovery plan, which would have involved special privileges and rights to American businesses in exchange for a large economic aid package.\n- The Portuguese government has rejected this plan, claiming this would threaten Portuguese sovereignty and may lead to American hegemony in their own markets.\n- However, they have presented a counteroffer, one which will have fewer rights for our firms and investors, but also requests less aid from our part.\n\n- While this offer is not as beneficial as previous plans, this may very well be our last chance at securing a deal with Lisbon over foreign investment. Accepting this deal would still allow for an American economic presence in Europe.\n- However, should we accept, our presence will be severely limited by Lisbon's demands. Without proper privileges and investment rights, American businesses will only have a limited footprint in European markets."
iberiawars_OFN_POR.14.a:0 "Lisbon's got their deal. Let's go with their counteroffer."
iberiawars_OFN_POR.14.b:0 "This charade's gone on long enough. Stick with the original deal."

iberiawars_OFN_POR.15.t:0 "Azores and Madeira, II: Foreign Investment"
iberiawars_OFN_POR.15.desc:0 "FROM: Ministry of Foreign Affairs\nTO: The Council of Ministers\nSUBJECT: Azores and Madeira, II: Foreign Investment\n\nWe continue to discuss the second demand from the Americans concerning the archipelagos of Azores and Madeira ("the islands"). They have insisted on special rights and privileges for private American businesses in Portuguese markets.\n\n- The United States has rejected our counteroffer requesting fewer rights for American businesses in exchange for requiring less economic aid.\n- Instead, the American delegation has stuck with their original deal. The United States requests that we accept their entire list of demands regarding what rights to grant private American firms and investors. In exchange, we will receive a large aid package to help with reconstruction efforts.\n- However, the Ministry still has concerns about the implications this may have for local businesses and the extent of American influence in the Portuguese economy. We advise the Council of Ministers to be cautious.\n\n- The United States stands firm on this issue. If we reject their proposal, we will be unable to move forward with the rest of the talks for the islands.\n- Alternatively, the damages incurred by the Portuguese Civil War have left our economy in ruin. Any aid the Americans can grant would be welcomed."
iberiawars_OFN_POR.15.a:0 "The ends justify the means. We must accept the deal."
iberiawars_OFN_POR.15.b:0 "Stand up and leave. We have bent too far back for the Americans."

iberiawars_OFN_POR.16.t:0 "Azores and Madeira, II: Foreign Investment"
iberiawars_OFN_POR.16.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Azores and Madeira, II: Foreign Investment\n\nWe are continuing negotiations with the Portuguese government in Lisbon regarding the potential return of the archipelagos of Azores and Madeira ("the islands"). Portugal has rejected our latest deal, and discussion regarding access to Portuguese markets for American investors have ended.\n\n- We had offered Lisbon a reconstruction plan involving an economic aid package in exchange for rights for private American firms and investors.\n- However, the Council of Ministers has dismissed this offer as an intrusion on Portuguese autonomy and that no privileges will be given to American businesses.\n- Although the Portuguese economy had been left in ruin from the Portuguese Civil War, it is unlikely they will accept any economic aid from the American government or American businesses.\n\n- The American delegation is considering withdrawing from the talks altogether. If Lisbon is unwilling to negotiate on the economy at all, even as they struggle to recover from the damage inflicted by the Portuguese Civil War, it may not bode well for future topics.\n- Alternatively, if we do not wish to walk away from the negotiations, we can move on to our final topic."
iberiawars_OFN_POR.16.a:0 "We did not come all the way here to lose. Hopefully they'll be receptive to the next topic."
iberiawars_OFN_POR.16.b:0 "Walk out. If they don't want our help, so be it."

iberiawars_OFN_POR.17.t:0 "Azores and Madeira, II: Foreign Investment"
iberiawars_OFN_POR.17.desc:0 "FROM: Ministry of Foreign Affairs\nTO: The Council of Ministers\nSUBJECT: Azores and Madeira, II: Foreign Investment\n\nWe have received the second demand from the Americans concerning the archipelagos of Azores and Madeira ("the islands"). They have requested an agreement concerning American foreign investment in Portugal.\n\n- The United States has proposed limited economic aid to help reconstruction efforts for Portuguese infrastructure and industry. In exchange, we will need to grant American businesses preferential treatment for their businesses.\n- The package itself is not large enough to cover our entire reconstruction; however, the Ministry is appreciative of the restraint the Americans show.\n- As part of their preferential treatment, American businesses are expected to receive reduced tariffs, more tax breaks, and more lax customs processes.\n- Many in the Ministry believe this to be an acceptable deal, but some warn the Council of Ministers that any offer like this may be capitulating our economic sovereignty to foreign powers.\n\n- We can accept the deal as-is. Given the amount of infrastructure and industry that must be rebuilt, any amount of aid that the Americans can grant may be worth the preferential treatment we have to extend.\n- We can also reject the deal. While the help is appreciated, the Americans may use this foot in the door to exploit our markets."
iberiawars_OFN_POR.17.a:0 "We do not need their business. We do not need their aid."
iberiawars_OFN_POR.17.b:0 "The terms could have been worse. Accept the deal."

iberiawars_OFN_POR.18.t:0 "Azores and Madeira, II: Foreign Investment"
iberiawars_OFN_POR.18.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Azores and Madeira, II: Foreign Investment\n\nWe are continuing negotiations with the Portuguese government in Lisbon regarding the potential return of the archipelagos of Azores and Madeira ("the islands"). Portugal has rejected our deal, and discussion regarding access to Portuguese markets for American investors has ended.\n\n- We had offered Lisbon a reconstruction plan involving limited economic aid in exchange for preferential treatment towards American businesses.\n- However, the Council of Ministers has dismissed this offer as an intrusion on Portuguese autonomy and that no special treatment, no matter how small, will be given to American businesses.\n- We had set the bar as low as we could, and if the Portuguese government in Lisbon will not accept this offer, it is unlikely they will accept any help from us.\n\n- The American delegation is considering withdrawing from the talks altogether. If Lisbon is unwilling to negotiate on the economy at all, even as they struggle to recover from the damage inflicted by the Portuguese Civil War, it may not bode well for future topics.\n- Alternatively, if we do not wish to walk away from the negotiations, we can move on to our final topic."
iberiawars_OFN_POR.18.a:0 "We'll strike a better deal in our next round."
iberiawars_OFN_POR.18.b:0 "Withdraw. We're not spending another day in Lisbon."

iberiawars_OFN_POR.19.t:0 "Azores and Madeira, III: Military Aid"
iberiawars_OFN_POR.19.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Azores and Madeira, III: Military Aid\n\nWe are continuing negotiations with the Portuguese government in Lisbon regarding the potential return of the archipelagos of Azores and Madeira ("the islands"). We are opening up a new topic for discussion: military aid in exchange for oversight over Portuguese foreign policy.\n\n- Portugal has been an integral part of the Iberian Union and Triumvirate alliance since the end of the Second World War. However, the Portuguese Civil War has left them politically isolated and militarily weakened.\n- With much of their industry destroyed, Portugal's capacity to equip their army is limited. The government in Lisbon will appreciate military aid from America to bolster their armed forces.\n- The Portuguese military high command could also benefit from the experience our American officers may provide via war games and training exercises.\n- By backing Portugal's military, we will have an interest in directing Portugal's foreign policy to align with our own goals.\n- Our biggest interest is securing friendly relations between Portugal and the United States. However, this may alienate Portugal from the rest of Europe, and Lisbon may not be appreciative of our influence over their foreign policy.\n\n- We can offer Lisbon a significant amount of equipment, including armored vehicles and fighter planes, along with American officer liaisons to train the Portuguese military. In exchange, Portugal would be designated a strategic ally in Atlantic security."
iberiawars_OFN_POR.19.a:0 "To a partner across the Atlantic."

iberiawars_OFN_POR.20.t:0 "Azores and Madeira, III: Military Aid"
iberiawars_OFN_POR.20.desc:0 "FROM: Ministry of Foreign Affairs\nTO: The Council of Ministers\nSUBJECT: Azores and Madeira, III: Military Aid\n\nWe have received the third demand from the Americans concerning the archipelagos of Azores and Madeira ("the islands"). They have requested an agreement concerning American military aid to Portugal.\n\n- In the wake of the Portuguese Civil War, our industry was crippled and thousands of soldiers were left dead. Lacking equipment and men, Portugal's security is threatened by foreign powers.\n- Our nation is politically isolated, and without allies, Portugal may face pressure from our European neighbors.\n- The United States has offered extensive military aid to bolster our army. The package includes shipments of armored vehicles and fighter planes. A more exhaustive list is attached to this document. The United States has also offered American personnel to help train our units.\n- However, the United States requests oversight over our foreign policy. This includes friendlier relations between the United States and Portugal, and we would consider each other strategic allies across the Atlantic Ocean.\n- The Ministry is concerned with the foreign policy restrictions, but agrees that the aid is crucial to maintaining our armed forces.\n\n- We can choose to accept the plan as-is. The American aid outweighs the restrictions on our foreign policy.\n- We may also negotiate the foreign policy part. In exchange for less aid, we can agree to stay away from European alliances.\n- Alternatively, we may also outright reject all aid. Surrendering our foreign policy threatens our sovereignty."
iberiawars_OFN_POR.20.a:0 "Who the hell do the Americans think they are? Reject the aid."
iberiawars_OFN_POR.20.b:0 "Negotiate for fewer restrictions. We won't cozy up to Germany if they don't want us to."
iberiawars_OFN_POR.20.c:0 "Get those tanks and planes, and let's sign up with Uncle Sam."

iberiawars_OFN_POR.21.t:0 "Azores and Madeira, III: Military Aid"
iberiawars_OFN_POR.21.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Azores and Madeira, III: Military Aid\n\nWe are continuing negotiations with the Portuguese government in Lisbon regarding the potential return of the archipelagos of Azores and Madeira ("the islands"). We are continuing discussion regarding American military aid to Portugal.\n\n- We previously proposed a military aid package involving large equipment shipments to bolster the Portuguese armed forces and military personnel to train Portuguese units.\n- In exchange, we had requested oversight over Portuguese foreign policy, including the formation of a strategic alliance between the United States and Portugal.\n- The Lisbon government has rejected this plan, claiming that the restrictions on foreign policy would violate its sovereignty.\n- The Lisbon government has proposed a counteroffer and is willing to reduce the amount of military aid it receives while forgoing the American liaisons.\n- In exchange, the Portuguese delegation promises they will stay away from European alliances. However, this is the only compromise they will make on foreign policy.\n\n- We may accept this counteroffer. It will be less costly for the American government, while keeping Portugal away from rival factions.\n- However, this does not accomplish our goal of keeping Portugal on friendly terms. We could push for our original deal one more time, but risk the Portuguese delegation withdrawing from the negotiations entirely."
iberiawars_OFN_POR.21.a:0 "We can take this as long as they don't join our enemies."
iberiawars_OFN_POR.21.b:0 "We're not just handing out guns here. We need more than assurances."

iberiawars_OFN_POR.22.t:0 "Azores and Madeira, III: Military Aid"
iberiawars_OFN_POR.22.desc:0 "FROM: Ministry of Foreign Affairs\nTO: The Council of Ministers\nSUBJECT: Azores and Madeira, III: Military Aid\n\nWe have received the third demand from the Americans concerning the archipelagos of Azores and Madeira ("the islands"). They have insisted on American oversight over Portuguese foreign policy in exchange for military aid.\n\n- The United States has rejected our counteroffer requesting less military aid in exchange for more freedom over our foreign policy.\n- The American delegation has stuck with their original deal. Our assurances to stay away from European alliances were not enough, and they have requested Portugal to join the United States as a strategic ally in Atlantic security in exchange for military aid.\n- However, the Ministry is still concerned about the implications this alliance may have on our European relations. Although we would receive a substantial amount of military aid, we may risk alienation from most of Europe. We advise the Council of Ministers to be cautious.\n\n- The United States is unwilling to compromise on this issue. Without any compromise, we may withdraw from the talks entirely.\n- Alternatively, the aid would substantially strengthen our military. We may as well accept the original deal to end talks on a positive note.\n- However, the restrictions may be too much. We can also agree to disagree and move on with the talks."
iberiawars_OFN_POR.22.a:0 "Take the original deal. Friendly relations with America shouldn't be a bad thing."
iberiawars_OFN_POR.22.b:0 "Agree to disagree. Let's not get bogged down on this issue."
iberiawars_OFN_POR.22.c:0 "Leave. Do they seriously think they can make us their puppet?"

iberiawars_OFN_POR.23.t:0 "Azores and Madeira, III: Military Aid"
iberiawars_OFN_POR.23.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Azores and Madeira, III: Military Aid\n\nWe are continuing negotiations with the Portuguese government in Lisbon regarding the potential return of the archipelagos of Azores and Madeira ("the islands"). We are continuing discussion regarding American military aid to Portugal.\n\n- We previously proposed a military aid package involving large equipment shipments to bolster the Portuguese armed forces and military personnel to train Portuguese units.\n- In exchange, we had requested oversight over Portuguese foreign policy, including a strategic alliance between the United States and Portugal.\n- The Lisbon government has rejected this plan, claiming that the restrictions on foreign policy would violate its sovereignty. They are unwilling to negotiate anything that compromises their foreign policy and reject our military aid package.\n- Without a deal on Portugal's foreign policy, we run the risk of Portugal aligning themselves with hostile nations.\n\n- We may accept their wishes and concede control over Portugal's foreign policy. This will mean we do not have to undergo the burden of propping up Portugal's weakened military.\n- Alternatively, we could lower the restrictions and simply request Portugal to stay away from any European alliances, in exchange for a smaller military aid package."
iberiawars_OFN_POR.23.a:0 "Lower the deal. We have not come this far to give up."
iberiawars_OFN_POR.23.b:0 "Let's just accept and finish the talks. I'm starting to get homesick."

iberiawars_OFN_POR.24.t:0 "Azores and Madeira, III: Military Aid"
iberiawars_OFN_POR.24.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Azores and Madeira, III: Military Aid\n\nWe are continuing negotiations with the Portuguese government in Lisbon regarding the potential return of the archipelagos of Azores and Madeira ("the islands"). We are continuing discussion regarding American military aid to Portugal.\n\n- We previously proposed a limited military aid package involving equipment shipments to strengthen the Portuguese armed forces.\n- In exchange, we had requested they stay away from aligning with any European alliances.\n- The Lisbon government has rejected this proposal, claiming that it will not allow any American influence on Portuguese foreign policy, no matter how small.\n- Despite the disagreements, Portugal has not walked out of the negotiations. Seeing that both sides cannot be reconciled on their positions, the Portuguese delegation has offered to drop the issue and conclude the talks."
iberiawars_OFN_POR.24.a:0 "Then we move forward."

iberiawars_OFN_POR.25.t:0 "Azores and Madeira, III: Military Aid"
iberiawars_OFN_POR.25.desc:0 "FROM: Ministry of Foreign Affairs\nTO: The Council of Ministers\nSUBJECT: Azores and Madeira, III: Military Aid\n\nWe have received the third demand from the Americans concerning the archipelagos of Azores and Madeira ("the islands"). They have proposed a counteroffer involving less military aid for fewer restrictions on Portuguese foreign policy.\n\n- Initially, we had rejected all American military aid in exchange that they would not compromise our foreign policy in any way.\n- However, the United States has proposed a counteroffer. In exchange for a small amount of military aid through equipment shipments, they request that we stay away from European alliances.\n- The Ministry is still concerned about America's influence on Portugal's foreign policy, no matter how small. A deal like this will alienate us from our European neighbors.\n- Nevertheless, this offer is much more palatable, and the military aid would still be extremely helpful in rearming our military forces.\n\n- Despite that, we may reject this deal and avoid any American interference in our foreign policy matters.\n- Still, the military aid is extremely helpful and needed at a time when our military does not have the resources to properly arm itself. American influence on our foreign policy will be minimal."
iberiawars_OFN_POR.25.a:0 "They compromised. Now we compromise and accept their deal."
iberiawars_OFN_POR.25.b:0 "Our initial statement still holds. No American will dictate Portuguese foreign matters. They'll understand."

iberiawars_OFN_POR.26.t:0 "Azores and Madeira, IV: The Atlantic Compromise"
iberiawars_OFN_POR.26.desc:0 "The flurry of camera flashes floods the stage as the Portuguese delegate walks to a podium flanked by the [?event_target:IBR_portuguese_winner.GetNameDef] and the American flag. The crowd is hushed into whispers as the spokesperson lightly taps on the microphone.\n\nHis words are brief, yet they drag the entire room with them.\n\n"Washington," the spokesperson announces, "has formally recognized the [?event_target:IBR_portuguese_winner.GetNameDef]'s sovereignty over our former archipelagos of Azores and Madeira.\n\n"They have demanded that the illegitimate Portuguese Confederation capitulate to us. Within twenty-four hours, our troops will have liberated the islands.\n\n"Efforts to restore administrative control over the islands are already underway."\n\nWhen pressed for additional details regarding the terms of the agreement, the delegate could only offer a measured smile.\n\nAs the last journalists filed out with unanswered questions, the spokesperson remained alone with his thoughts. Weeks of negotiations, choosing every word so precisely, now felt so distant.\n\nHow much had been given up, how much had remained intact, didn't matter for the newly reborn nation. In the ashes that it had risen from, it endured another trial amidst the greatest power in the New World.\n\nBut Portugal was no stranger to dealing across the Atlantic."
iberiawars_OFN_POR.26.a:0 "So we find ourselves drawing lines across the ocean again."

iberiawars_OFN_POR.27.t:0 "Azores and Madeira, IV: The Atlantic Compromise"
iberiawars_OFN_POR.27.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Azores and Madeira, IV: Conclusion of Negotiations\n\nWe report that negotiations with the Portuguese government in Lisbon regarding the potential return of the archipelagos of Azores and Madeira ("the islands") have concluded successfully. A common understanding has been achieved between the two nations, establishing a mutually acceptable framework going forward.\n\nIn accordance with the outcome:\n\n- The United States has formally withdrawn all political and material support from the illegitimate Portuguese Confederation.\n- The United States has sent an ultimatum to the illegitimate Portuguese Confederation on the islands, requesting that they peacefully surrender to the [?event_target:IBR_portuguese_winner.GetNameDef].\n- The [?event_target:IBR_portuguese_winner.GetNameDef] is recognized as the sole sovereign authority over the archipelagos of Azores and Madeira.\n- Existing arrangements reached during the course of the negotiations will govern future relations regarding the islands and both nations.\n\nThis matter is considered closed."
iberiawars_OFN_POR.27.a:0 "The Atlantic is settled."

iberiawars_OFN_POR.28.t:0 "Azores and Madeira, IV: The Atlantic Deadlock"
iberiawars_OFN_POR.28.desc:0 "The flurry of camera flashes floods the stage as the Portuguese delegate walks to a podium flanked by only the [?event_target:IBR_portuguese_winner.GetNameDef]'s flag. The crowd is hushed into whispers as the spokesperson lightly taps on the microphone.\n\nHis words are brief, yet they drag the entire room with them.\n\n"Washington," the spokesperson announces, "has refused to respect Portuguese sovereignty in key matters of national importance. Consequently... the negotiations have collapsed.\n\n"The Americans have refused to recognize our claim over the archipelagos of Azores and Madeira. They have opened up diplomatic channels with the illegitimate Portuguese Confederation that still occupies our islands.\n\n"Despite this setback, Portugal remains resolute. We are still looking to secure the islands under our control... even through other means."\n\nWhen pressed for additional details regarding the next possible steps, the delegate could only drag his feet off the stage.\n\nAs the last journalists filed out with unanswered questions, the spokesperson lingered alone with his thoughts. His mind traced the long nights he spent over the diplomatic talks. Every careful word, every concession made, all lost to the Atlantic's crashing waves.\n\nThough it didn't matter how much could have been gained for the newly reborn nation. In the ashes that it had risen from, it endured another trial amidst the greatest power in the New World.\n\nBut the New World would no longer bow to Portugal's treaties."
iberiawars_OFN_POR.28.a:0 "But we still have contingencies."

iberiawars_OFN_POR.29.t:0 "Azores and Madeira, IV: The Atlantic Deadlock"
iberiawars_OFN_POR.29.desc:0 "FROM: US State Department\nTO: President [USA.GetLeader]\nSUBJECT: Azores and Madeira, IV: Breakdown of Negotiations\n\nWe report that negotiations with the Portuguese government in Lisbon regarding the potential return of the archipelagos of Azores and Madeira ("the islands") have concluded without agreement. Talks ultimately broke down due to Lisbon's unwillingness to compromise on outstanding issues.\n\nIn accordance with the outcome:\n\n- The United States does not recognize the [?event_target:IBR_portuguese_winner.GetNameDef]'s sovereignty over the archipelagos of Azores and Madeira.\n- All prior understandings reached during the course of the negotiations have been considered void.\n- Diplomatic channels with the Portuguese Confederation have been opened, including a potential operation against the mainland. This plan is now under active consideration.\n\nThis matter remains unresolved."
iberiawars_OFN_POR.29.a:0 "We have contingencies."


