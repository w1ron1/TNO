#Leader
 GUA_Mario_Mendez_Montenegro: "Маріо Мендес Монтенеґро"
 POLITICS_GUA_Mario_Mendez_Montenegro_DESC: "Коли його термін добігає кінця, Маріо Мендес Монтенеґро готується зробити свій найважливіший внесок в Жовтневу революцію Гватемали: передати владу своєму давньому суперникові Арбенсу. Ніхто не міг би стверджувати, що це був його єдиний внесок. Мендес Монтенеґро вивчав право в Національному університеті у 1944 році, долучившись до боротьби проти диктатури генерала Убіко. Швидко ставши одним із лідерів руху, він опинився під особистою загрозою й ненадовго втік до Мексики. Після повернення Мендес Монтенеґро заснував і очолив Фронт народного визволення, щоб взяти участь у щойно звільнених виборах Гватемали, привівши доктора Аревало до президентства, а самого себе — на посаду мера міста Гватемала.\n\nМендес Монтенеґро зміцнив свою репутацію та популярність завдяки низці громадських робіт у столиці, провівши водопостачання та каналізацію до бідних районів і покращивши транспортне сполучення. Мало кого здивувало, коли його близький союзник Арана запропонував йому посаду міністра внутрішніх справ після вступу на пост президента. Настав бурхливий період, коли усунутий від влади суперник Арани, полковник Арбенс, ледь не розколов революційний рух. Мендес Монтенеґро виступив посередником у досягненні угоди, прийнятної для ворогуючих титанів: він балотуватиметься в президенти у 1956 році від ПРД, а потім передасть керівництво Арбенсу. Його власне президентство ознаменувалося розвитком і поглибленням Революції в її міських опорних пунктах. Але військові стали неспокійними, зміцнюючи зв'язки із сільською реакцією та загострюючи прикордонні конфлікти з Мексикою. Ці кілька останніх місяців стануть суворим випробуванням для Мендеса Монтенеґро та його Революції."
 
 GUA_Jacobo_Arbenz: "Хакобо Арбенс"
 POLITICS_GUA_Jacobo_Arbenz_DESC: "Що може зупинити Хакобо Арбенса? Банкрутство його родини, яке позбавило його можливости здобути університетську освіту? Арбенс натомість вступив до військової академії. Самогубство його приниженого батька? Похмура велич гострого на розум курсанта принесла йому високі почесті та швидке підвищення. Мстиве вище суспільство Гватемали після того, як цей неосвічений і збіднілий солдат одружився з Марією Крістіною Вілановою, найяскравішою та найвродливішою дебютанткою країни? Вони знайшли розраду в обіймах одне одного та у своїх мріях про справедливу Гватемалу. Військова хунта, яка мала розбити ці мрії? Він і полковник Арана штурмували Палаціо-Верде та повалили її.\n\nПевний час дехто міг би відповісти: Арана. Командувач Збройних сил, який став президентом, намагався усунути свого суперника Арбенса. Але ці роки в пустелі лише дали Арбенсу час для планування — закласти разом із Марією підвалини свого великого проєкту. Вони розподіляли землю зі свого власного маєтку, збирали реформаторів, розробляли закони та пропаганду.\n\nГенерал Ідіґорас вважав, що переворот його зупинить. Натомість Арбенс вступає на посаду президента як герой демократії, а приголомшена ПРД гуртується навколо його бачення. Бачення аграрної реформи, покликаної виправити примару нерівности та бідности, які переслідували Гватемалу ще з часів мая. United Fruit Company, права РНВ, озлоблені військові та їхні воєнізовані союзники чекають. Але досі ніщо не змогло зупинити Хакобо Арбенса."

 GUA_Oscar_Adolfo_Mijangos_Lopez: "Оскар Адольфо Міханґос Лопес"
 POLITICS_GUA_Oscar_Adolfo_Mijangos_Lopez_DESC: "Доктора Міханґоса, якого всі називають Фіто, любить випивку та жінок, він товариський чоловік, який гуляє всю ніч. Але товариськість не слід плутати з несерйозністю. Фіто, один із найкращих студентів Університету Сан-Карлос, отримав стипендію для здобуття докторського ступеня з трудового та аграрного права в Квебеку. Падіння зробило його паралізованим нижче пояса, але не змогло його спинити. Після повернення до Гватемали він заснував журнал «Combate», навколо якого згуртувалася група молодих інтелектуалів, що прагнули поширити Жовтневу революцію на бунтівні військові та феодальні внутрішні райони.\n\nОбраний депутатом від ПРД, Фіто невдовзі став усміхненою, але грізною силою на підтримку реформістської програми президента Арбенса, розслідуючи зловживання латифундистів та ухилення від перерозподілу земель. За підтримки Арбенса та завдяки активній кампанії його протеже Колома Арґети в місті Гватемала адвокат на інвалідному візку впевнено переміг на президентських виборах 1968 року.\n\nНа тлі чуток про військовий переворот доктор Міханґос присвятив свій термін захисту правового та конституційного порядку Гватемали від її давніх ворогів. Зміцнюючи престиж революційного уряду за кордоном, він прагне розірвати зв'язки змовників зі США. Вітаючи відповідальні інвестиції в гірничодобувний сектор Гватемали, він сподівається послабити ворожість бізнесу до ПРД та диверсифікувати економіку, відійшовши від залежности від United Fruit Company. А розвиваючи муніципальну демократію, Фіто прагне повалити головорізів і дрібних деспотів, які досі правлять значною частиною Гватемали."

 GUA_Julio_Mendez_Montenegro: "Хуліо Мендес Монтенеґро"
 POLITICS_GUA_Julio_Mendez_Montenegro_DESC: "«І так починається новий етап в історії славного подвигу 20 жовтня», — сказав президент Хуліо Мендес Монтенеґро, розпочинаючи П'ятий уряд Революції. Мендес Монтенеґро був там від самого початку, будучи частиною тісних студентських мереж Національного університету, які протистояли генералу Убіко та наступній хунті. Мендес Монтенеґро здобув схвалення своїх однолітків і осуд режиму, очоливши боротьбу за університетську автономію у висунутому ними диктатору ультиматумі. Згодом він став лідером нової партії свого старшого брата Маріо — Фронту народного визволення, агітуючи за тріумфальне обрання президента Аревало. Поки Аревало очолював Гватемалу, а його брат — місто Гватемала, Мендес Монтенеґро закінчив Сан-Карлос як юрист і нотаріус, після чого вирушив до Чилі для подальшого вивчення трудового права. Це та вплив Маріо забезпечили йому посаду в уряді Арани. Але коли сам Маріо став президентом, Хуліо, щоб уникнути звинувачень у непотизмі, відійшов від політики й став деканом Університету Сан-Карлос.\n\nТам Мендес Монтенеґро налагодив зв'язки з інтелектуальною та бюрократичною елітою країни. У них він побачив прагнення покласти край нескінченним конфліктам Гватемали, професіоналізувати та модернізувати Революцію. Прагнення до нового етапу — етапу, який він міг би забезпечити. За підтримки кількох міністрів ПРД він здобув президентство. Поки він намагається домовитися з військовими, амністувати партизанів та воєнізовані формування, а також примирити ПРД і США, 20 жовтня справді набуває нового напрямку."
 
 GUA_Rene_de_Leon_Schlotter: "Рене де Леон Шлоттер"
 POLITICS_GUA_Rene_de_Leon_Schlotter_DESC: "Царство Боже в Гватемалі буде збудоване смиренними руками. Смаглявими руками. Саме це було одкровенням, завдяки якому Рене де Леон Шлоттер подолав світську Революцію.\n\nУ 50-х роках його партія, Гватемальська християнсько-демократична партія, складалася переважно з релігійних студентів Університету Сан-Карлос у місті Гватемала, які прагнули християнсько-соціальної альтернативи антиклерикалізму ПРД та підтримці вищого духовенства авторитарної реакції. Ставши головою партії, він повів ГХД у новому напрямку — ці привілейовані юнаки повинні були піти до глибоко католицьких, глибоко зубожілих мая та поділитися з ними благодатною звісткою. Його дружина Кармен Ескрібано, іммігрантка з Іспанії, також поширювала її — рік за роком видаючи партійний журнал «El Pueblo».\n\nБезбожна сила ПРД робила поступ повільним. Першого разу, коли він балотувався до Конґресу в Кіче, його не обрали. Ані другого. Але зрештою він пробився, і за ним пішли інші члени ГХД. Крок за кроком вони долали соціялістів. Крок за кроком вони показували Церкві, що смиренні християни, а не генерали, врятують Гватемалу від атеїзму.\n\nШлях до президентства був вузьким, але не прямим. Де Леон Шлоттер мусив створити коаліцію, здатну перемогти ПРД, — аж до самих правих, яких він так довго засуджував. Але заради того, щоб принести віру, надію та любов усім гватемальцям, воно того варте."

 GUA_Mario_Sandaval_Alarcon: "Маріо Сандоваль Аларкон"
 POLITICS_GUA_Mario_Sandaval_Alarcon_DESC: "Маріо Сандоваль Аларкон — боєць. Інакше «Ель Міко», Мавпа, не зробив би схрещений кинджал символом свого Руху національного визволення. Він не додав би червоний до кольорів своєї партії — червоний колір крові, яку доведеться пролити за Бога, Батьківщину, Свободу. Він не пережив би тортур у в'язниці Салами. За ним не ходив би легіон охоронців, яким він платить бонус у $$50 за кожен удар.\n\nЕль Міко — боєць, тому що він білий. Вирісши на плантації на дикому сході Гватемали, він засвоїв, що нечисленні білі можуть контролювати своїх маянських робітників лише з мачете в одній руці та пістолетом в іншій. За допомогою організованого насильства. Революція загрожувала цьому порядку, загрожувала його народу, а отже, мусила піти. Тож він організував РНВ і змову за змовою планував невдалі перевороти зі своєї вітальні. Вони провалювалися.\n\nАле він не міг, не хотів зупинятися. Ель Міко вивчав стоси соціялістичної літератури, шукаючи слабкі місця, поки поруч сиділи його улюблені білі пуделі. Він відмовився від своїх колишніх симпатій до фалангістів, щоб здобути підтримку гринґо. Він розривався від обурення через кожну невдачу ПРД, залякував селян ескадронами смерті та домігся фінансування своєї кампанії від Fruit Company. Він переміг Революцію на її власних умовах, біля виборчих урн, які вона сама створила. Але тридцять років безладу та соціялізму зробили мая та ладіно гордими й бунтівними.\n\nПрезидент Маріо Сандоваль Аларкон — боєць, і його боротьба лише почалася."

 GUA_Carlos_Manuel_Arana_Osorio: "Карлос Мануель Арана Осоріо"
 POLITICS_GUA_Carlos_Manuel_Arana_Osorio_DESC: "Карлос Арана Осоріо був посередністю. Попри те, що він був племінником президента Арани, він пройшов звичайний шлях для гватемальця свого класу. Виріс на південному сході. Здобув освіту в столиці. Провалив іспити на медичний ступінь. Вступив до війська. Неквапливо дослужився до звання майора. Карлос Арана Осоріо міг би зникнути з історії, якби його не призначили командувати зоною. Якби не відкрився його талант.\n\nНа жаль для ЗРГ та МР-13, його геніальність полягала в операціях із боротьби з повстанцями. Арана Осоріо зустрічався з ранчеро та плантаторами, купцями, правими з РНВ, воєнізованими формуваннями МАНО, створюючи величезну мережу інформаторів і помічників для вистежування та знищення партизанів у своїй зоні. Повідомлення про його «перевищення повноважень» лише принесли «Шакалові» більшу славу як герою-антикомуністу.\n\nСлабкий уряд спробував після цього заслати його, приховавши його славу за посадою посла в Нікарагуа. Полковник Арана Осоріо зміцнив свої зв'язки із Сомосами та ФБР і спостерігав, як генерал Арбенс веде країну до загибелі. Як і раніше, найбільші вороги Гватемали походили зсередини. Як і раніше, він зібрав мережу. І завдав удару.\n\nКарлос Арана Осоріо більше не посередність. Він — павук у павутинні насильства, що огортає Гватемалу, єдина ланка між солдатами, ескадронами смерті, латифундистами, Fruit Company, Вашинґтоном — він рятівник Гватемали."

 GUA_Hermenegildo_Cuencia_Diaz: "Ерменехільдо Куенка Діас"
 POLITICS_HERMENEGILDO_DIAZ: "Тепер править генерал Ерменехільдо Куенка Діас, як він давно й прагнув. Чи народилася ця мрія в його дитинстві в Мехіко? Чи був він, молодий курсант Військового героїчного коледжу, натхненний маршем поруч із президентом Венустіано Каррансою назустріч останньому в Пуеблі? Чи переконався Куенка Діас у власній величі в наступних битвах, чи він шукав влади, щоб компенсувати дві рани, отримані в боях?\n\nБезперечно, Куенка Діас продемонстрував амбіції під час президентства Алемана, дослужившись до начальника президентського генерального штабу завдяки своїм зв'язкам із фракцією «Лимона». Безперечно, він плекав свою жагу під час сексеніо Кортінеса, голосно скаржачись на своє переведення до військового округу Тласкала. Безперечно, його прагнення вибухнуло за Лопеса Матеоса, коли генерал кинувся в партійну політику ПРІ у військовому окрузі Баха, домагаючись губернаторства, використовуючи старі зв'язки з Ечеверрією. Але все, чого він зміг досягти, — це посада сенатора.\n\nАж доки не почалася війна з Гватемалою і не знадобився лідер із ідеальним поєднанням прагнення, військової майстерности та жорстокости, щоб стабілізувати підкореного сусіда Мексики. Його завдання було коротким, але чітким: вистежити лівих партизанів, знищити залишки старого режиму та встановити новий, покірливий режим за зразком Мексики. І саме тому генерал Ерменехільдо Куенка Діас тепер править Гватемалою. І саме так генерал на крок наблизився до правління Мексикою, як він давно прагнув."

 GUA_Manuel_Colom_Argueta: "Мануель Колом Арґета"
 POLITICS_GUA_Manuel_Colom_Argueta_inst_dep_DESC: "Як і в кожній колоді карт, у кожній революції є свій туз. У Гватемали це Мануель Колом Арґета.\n\nРеволюційні заслуги «Меме» бездоганні. Усього в одинадцять років він добровільно регулював рух, підтримуючи Революцію 44-го. Він організовував студентів у Сан-Карлосі, очолюючи їхню підтримку прогресивних обіцянок правлячої ПРД. Коли реакція придушила цю мрію, він приєднався до «Combate», журналу свого друга доктора Фіто Міханґоса, люто викриваючи корупцію та насильство режиму, доки не був ув'язнений і засланий до Мексики.\n\nІнтелект, навички та зв'язки Колома Арґети не викликають сумнівів. Видатний студент права, він був нагороджений премією Ґальвана та використав отриману стипендію для навчання разом із мексиканською науковою елітою в УНАМ. Саме туди він повернувся у вигнанні, роблячи академічну кар'єру та водночас формуючи Демократичний революційний союз із гватемальських біженців та інтелектуалів. Навіть будучи президентом, він особисто очолює команду економістів та інженерів, які керують амбітною програмою відбудови й розвитку Гватемали.\n\nАле навіть туз може програти з поганою рукою. Переслідуваний звинуваченнями у співпраці з ворогом, харизматичні промови Колома Арґети мають присмак смутку. Опортуністи стікаються до ДРЄ — широкої коаліції, яка розширюється за межі навіть його енергійного контролю. Найгірше — це спіраль насильства: краплі гватемальської крові забруднюють навіть її найвищу карту."
 POLITICS_GUA_Manuel_Colom_Argueta_soc_DESC: "Мануель «Меме» Колом Арґета підтримував полум'я Революції 44-го яскравим протягом усіх тридцяти років її існування.\n\nМеме вперше відчув її жар ще підлітком, регулюючи святковий рух у рідному місті Гватемала. Він увійшов у саме її палаюче серце в Університеті Сан-Карлос, вийшовши звідти студентським лідером і блискучим розумом. Стипендія Ґальвана, що послідувала за цим, відправила його до УНАМ продовжувати вивчення права — але його повернення було неминучим. Його тягнуло до полум'я.\n\nНе припиняючи академічної роботи в Сан-Карлосі, Меме кинувся у динамічну й напружену адміністрацію Арбенса, ставши рідкісним політиком із міської ПРД, здатним надихнути кампесінос на підтримку масштабної аграрної реформи. У 1968 році, коли його друг і союзник доктор Міханґос Лопес балотувався в президенти, смілива кампанія Колома Арґети на посаду мера підпалила місто Гватемала. Він підтримував цей дух, втілюючи свої амбітні плани міського розвитку та зміцнюючи зв'язки з галасливими профспілками міста.\n\nЯк взірець ініціативи децентралізації Міханґоса, Колом Арґета згуртував національну муніципальну асоціацію разом із лівим крилом ПРД, щоб забезпечити висунення кандидата в президенти у 1974 році. Попри тривогу наддержав і люту опозицію РНВ, палка обіцянка Революції створити справедливу та вільну Гватемалу не згасне за його правління."

 GUA_Marco_Antonio_Yon_Sosa: "Марко Антоніо Йон Соса"
 POLITICS_GUA_Marco_Antonio_Yon_Sosa_DESC: "Цього разу команданте Марко Антоніо Йон Соса веде боротьбу на незнайомій території — у залах Палаціо-Верде. Народжений на сході Гватемали в родині китайських іммігрантів і всиновлений торговельною родиною, «Ель Чіно» жив добре, доглядаючи за крамницею та граючи у футбол. Революція прийшла, коли йому було п'ятнадцять, очолювана хоробрими солдатами та студентами Національного університету. Тож коли настав час обирати кар'єру, Йон Соса обрав армію.\n\nАрмія навчила його дисципліни, навчила цілитися зі зброї. Однак її офіцери часів Убіко сильно поступалися революційному ідеалу — вони укладали угоди з Fruit Company, олігархами та гринґо. Лейтенант Йон Соса тримав язик за зубами й продовжував навчатися на рейнджера, а суворі гори та джунглі були бажаною віддушиною від змовницьких казарм. Потім армія захопила владу. Лейтенант Йон Соса вирушив у гори та джунглі, забравши із собою кількох рейнджерів і Революцію.\n\nЙон Соса та РН-13 пішли на війну. Грабували банки, підривали казарми, підбурювали селян, перетинали мексиканський кордон, отримували благословення Арбенса на Кубі, а разом із ним — зброю та ветеранів Карибського легіону. Перестрілки на пагорбах Чикімули перетворилися на вибухи на вулицях міста Гватемала. Він вільно пересувався всією Гватемалою, надихаючи та атакуючи. Але команданте не зміг уберегти свій рух від неодноразових розколів через ідеологію. Як для партизана, це було дорого. Але тепер, коли Йон Соса очолює націю, за яку він боровся, це може коштувати його Революції перемоги."

 GUA_Miguel_Ydigoras_Fuentes: "Міґель Ідіґорас Фуентес"
 POLITICS_GUA_Miguel_Ydigoras_Fuentes_DESC: "Гватемальська чорна кава тече жилами президента Міґеля Ідіґораса Фуентеса. Патріотична вада, одна з небагатьох, придатних для генерала.\n\nНароджений наприкінці XIX століття, Ідіґорас виріс на кавовій плантації, увібравши її аристократичні цінності: він, зі своїми європейськими рисами, мав організовувати й командувати, тоді як ладіно та мая мали працювати в багнюці внизу. Кава тримала його в тонусі, живила його піднесення — він закінчив національну військову академію першим у своєму класі, отримав престижні дипломатичні призначення та став губернатором у 27 років. Ідіґорас пив і керував, керував і пив, доки генерал Убіко також не зробив його генералом.\n\nПотім Революція 1944 року повалила Убіко. Раніше, віддаючи накази серед білого дня, Ідіґорас пив каву; тепер, змовляючись уночі, він вдихав її. Його перевороти провалилися, президентські вибори він програв тому зраднику Арані, а ПРД крок за кроком занурювала викривлене коріння комунізму в ґрунт Гватемали. Але генерал Ідіґорас не впав у відчай. Він налив собі ще одну чашку, чорну, і завдав точного удару.\n\nГватемальська чорна кава тече жилами президента Міґеля Ідіґораса Фуентеса. Вона дозволяє йому працювати за десятьох, йому не потрібен кабінет. Вона робить його гірким, сповненим ненависті до людей, яких він стверджує, що захищає. Вона робить його пильним — дехто каже, параноїдальним, завжди насторожі щодо партизанів, які нишпорять у темряві. Ніч Ідіґораса довга, але завжди чекає наступна чашка."

