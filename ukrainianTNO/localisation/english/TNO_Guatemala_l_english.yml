#Ideas

 GUA_Disloyal_Military: "Нелояльні військові"
 GUA_Disloyal_Military_desc: "Військові керували Гватемалою до Революції. Під час Революції деякі офіцери, як-от Хакобо Арбенс і Франсіско Хав'єр Арана, відіграли важливу роль у тому, щоб усунути від влади поплічників Убіко. Згодом Арана керував Гватемалою протягом суперечливого президентського терміну й, можливо, досі керував би нею, якби переворот, організований його прихильниками, не провалився.\n\nВійськові, підпорядковані лише командувачеві Збройних сил, досі керують значною частиною країни. Вони контролюють кордони, стежачи за слабкістю імперіалістів або мексиканським віроломством. Вони забезпечують безпеку UFCO та її плантацій, стежачи за страйками й комуністами. І вони стежать за Палаціо-Верде, чекаючи на помилку або поворот у бік комунізму, який дозволить їм знову керувати всією Гватемалою."

 GUA_Revolutionary_Tutelage: "Революційна опіка"
 GUA_Revolutionary_Tutelage_desc: "Революція 44-го провалилася. Гватемальці знову опинилися під тиранією, і врятували їх лише рішучі зусилля північного сусіда. Мексика, їхній ворог, що став наставником, тепер показує їм, як інституціоналізувати оновлену Гватемальську Революцію, закріплюючи їхню вічну дружбу.\n\nЧапінам достатньо лише поглянути на північ, щоб побачити, що на них чекає. Демократію буде відновлено, але лише після того, як широка партія об'єднає всі революційні течії Гватемали, а вибори будуть надійно забезпечені. Військо буде відбудоване, щоб гарантувати, що воно захищатиме, а не загрожуватиме нації. Корпоратистські родичі КТМ і КНК мобілізуватимуть робітників та селян на підтримку земельної реформи, соціальної справедливости та національного суверенітету. Освічені чапіни побачать, що інституціоналізується не Революція, а фарс."

 GUA_Pleading_Pesos: "Благання про песо"
 GUA_Pleading_Pesos_desc: "Якби можна було подорожувати розбитими дорогами та зруйнованими залізницями Гватемали, покинуті будинки й ферми ніколи не зникали б із поля зору. Але інвестори, чи то японські, американські, чи кріольські, пішли й не демонструють жодних ознак повернення.\n\nЗалишаються самі мексиканські окупанти. Приватний бізнес із Монтеррея та Ґвадалахари жадає можливости швидко отримати прибуток, виснажуючи ресурси Гватемали. Натомість Мехіко неохоче витрачає дефіцитні ресурси розвитку на гуманітарну допомогу чи відбудову свого ненависного південного сусіда. Але така щедрість буде необхідною, якщо Земля вічної весни має стати довгостроковим торговельним партнером, якого прагне Мексика."

 GUA_Counterrevolutionary_Elements: "Контрреволюційні елементи"
 GUA_Counterrevolutionary_Elements_desc: "Під розлогими гілками сейби Збройні сили Мексики полюють на зростаюче гватемальське повстання. Партизани набираються з покидьків, які принизили мексиканських військових у 58-му, солдатів, які обстрілювали їх артилерійськими снарядами в короткій, але запеклій війні, що щойно завершилася, поліцейських, які масово дезертують, комуністів і фашистів, яких ця зруйнована земля породжує в достатку. І вони набираються з мая.\n\nРасові упередження офіцерів ЗСМ перетворили непорозуміння на опір, нейтралів на ворогів, а села — на попіл. Поки ладіно-дисидентів відвозять для таємних страт у військових таборах, цілі громади мая, підозрювані в переховуванні партизанів, винищуються. Воюючи з половиною Гватемали, ЗСМ виснажуються, занепадають духом і стають дедалі ненависнішими."

 GUA_20_Years_Of_Spring:0 "20 років весни"
 GUA_20_Years_Of_Spring_desc:0 "Серед похмурих днів 1944 року, коли перемоги фашистів охоплювали весь світ, гватемальський народ здобув одну перемогу за свободу. Їхня революція на захист конституції та вільних виборів об'єднала студентів, профспілки, середній клас і частину військових, щоб повалити автократичного та жорстокого диктатора Хорхе Убіко.\n\nЦе започаткувало два десятиліття демократичного відкриття Гватемали, коли Партія революційної дії розширила виборче право на жінок і неписьменних та працювала над захистом громадянських свобод. Хоча перевороти досі залишаються загрозою, довга історія військового правління країни поволі відходить у минуле. Можливо, світло й тепло цієї відлиги поширяться — подарунок Гватемали: весна в холодному та темному світі."

 GUA_That_Uncomfortable_Presence:0 "Та незручна присутність"
 GUA_That_Uncomfortable_Presence_desc:0 "Гватемала могла б стати взірцем Сполучених Штатів у Центральній Америці. Стабільна демократія, що розвивається, палко виступає проти фашизму, рішуче протистоїть Трухільйо та йому подібним і бере активну участь в ОАД.\n\nМогла б. Але між правлячою ПРД та Сполученими Штатами стоїть один клин. Клин, який володіє залізницями, портами та більш ніж половиною орних земель країни. Клин, пов'язаний із високопоставленими дипломатичними чиновниками у Вашинґтоні та з лобістським бюджетом у сотні тисяч доларів щороку. Клин на ім'я United Fruit Company.\n\nЯкщо ПРД не зможе врівноважити свої реформи з інтересами Компанії... цей клин може розколоти Гватемалу."

 GUA_Limited_Agrarian_Reform:0 "Обмежена аграрна реформа"
 GUA_Limited_Agrarian_Reform_desc:0 "Крик за землю, без жодного сумніву, є найгучнішим і найвідчайдушнішим у всій Гватемалі. Убіко та його попередники передали величезну національну спадщину United Fruit Company та дарували майже феодальні привілеї сузір'ю дрібніших землевласників. Насильство та примус забезпечували їх робочою силою.\n\nВеличезна влада UFCO перешкоджає будь-яким спробам реформувати цю жорстоку систему. Так, президенти Аревало та Монтенеґро запропонували безземельним селянам державні землі та зобов'язали будувати школи на плантаціях. Але нові трудові закони звільняють сільську робочу силу від їхньої дії, а будь-який істотний перерозподіл землі блокується. Поки злидні ладіно та особливо селян-мая тривають, радикали в уряді прагнуть сміливішого захисника. А радикали за його межами починають шукати інших засобів."

 GUA_20_Years_Extinguished:0 "20 років, що згасли"
 GUA_20_Years_Extinguished_desc:0 "У 1944 році Гватемала відклала свою довгу історію військового правління заради двадцятирічної демократичної революції. Це відхилення завершилося.\n\nЧоботи та уніформи знову патрулюють коридори влади. Вони порушують свій розмірений крок лише для того, щоб наступити на тих, хто наважується підняти голос проти цього порядку.\n\nЗа двадцять років таких зрадників побільшало. Профспілки, що розжиріли під ПРД, верещать, коли їхні даровані комуністами «права» відбирають. І тому чоботи тиснуть сильніше. Науковці та студенти Сан-Карлоса звикли висловлювати власну думку, навіть повторюючи марксистську гидоту. І тому чоботи тиснуть сильніше. Мая беруться до зброї, а біженці тікають. І тому чоботи тиснуть сильніше."

 GUA_Reign_Of_The_Fruit_Company:0 "Правління Fruit Company"
 GUA_Reign_Of_The_Fruit_Company_desc:0 "Коли страх перед радикалізмом ПРД досяг апогею, націоналістичні офіцери гватемальської армії уклали угоду з United Fruit Company проти спільного ворога. Тепер умови цього договору виконуються.\n\nUFCO використовує свій вплив у Вашинґтоні та по всій Центральній Америці, щоб забезпечити допомогу й визнання гватемальській хунті. Натомість військові надали UFCO майже абсолютну владу над її феодом — більш ніж половиною орних земель Гватемали, площа яких щодня зростає. Але зі скороченням данини UFCO у кетсалях уже не зрозуміло, хто став васалом, а хто сюзереном."

 GUA_Unequal_Land_Distribution:0 "Нерівномірний розподіл землі"
 GUA_Unequal_Land_Distribution_desc:0 "Крик за землю, без жодного сумніву, є найгучнішим і найвідчайдушнішим у всій Гватемалі. ПРД прагнула відповісти на цей крик пропозиціями аграрної реформи — від боязких до радикальних, але жодна з них не була повністю реалізована. І тому крик став гучнішим, оглушливим.\n\nГватемальська військова хунта, що прийшла їм на зміну, прагне його заглушити. Настирливі правила ПРД, які майже не виконувалися, розірвано, повертаючи країну до суворих, але прибуткових порядків епохи Убіко. Але кінець марних надій, які продавала ПРД, не змусив відчайдушне виття селянства стихнути.\n\nМожливо, це зроблять кулі воєнізованих формувань."

 GUA_The_Militarys_State:0 "Держава військових"
 GUA_The_Militarys_State_desc:0 "Захопивши державу, від якої вони після Революції фактично діяли майже автономно, військові Гватемали тепер формують уряд країни за власним образом і подобою. Дебати обмежуються на користь беззаперечного послуху хунті, особливо президентові. Заохочується пильність щодо зовнішнього ворога: імперіалістичних поселенців на сході та революційного покидька з Мексики, Куби й Карибського легіону, що чекає нагоди. А щодо внутрішнього ворога — передусім партизанів МР-13 та неспокійного селянства мая — застосовується цілковита безжальність.\n\nНе кажучи вже про певну схильність до інституційного та особистого збагачення, адже іноземна допомога та обмежений бюджет країни вливаються назад у військо та кишені генералів."

 GUA_A_Fistful_of_Pesos:0 "Жменя песо"
 GUA_A_Fistful_of_Pesos_desc:0 "Після спустошення короткої, але жорстокої мексикансько-гватемальської війни мало хто думав, що Мексика дасть більше, ніж жменю песо на відбудову свого сусіда. Гірка кров між націями текла надто глибоко, а оскільки сама Мексика була країною, що розвивалася, вважалося, що їй надто мало що можна віддати.\n\nАле Мексика відбудувала Гватемалу — на власну подобу. Маянські ехідо обробляють свої землі поруч із кооптованими латифундистами; профспілки під контролем ДРЄ керують робочою силою як приватних підприємств, так і державних корпорацій. Економісти можуть критикувати цю структуру як неефективний, суперечливий безлад, але вона є міцною. Ця жменя песо, розумно інвестована, придбала для Мексики довгострокового торговельного партнера та міцний революційний фундамент у Землі вічної весни."

 GUA_For_A_Few_Pesos_More:0 "За кілька песо більше..."
 GUA_For_A_Few_Pesos_More_desc:0 "Після спустошення короткої, але жорстокої мексикансько-гватемальської війни мало хто думав, що Мексика дасть більше, ніж жменю песо на відбудову свого сусіда. Гірка кров між націями текла надто глибоко, а оскільки сама Мексика була країною, що розвивалася, вважалося, що їй надто мало що можна віддати.\n\nО, якими наївними вони були. Натомість мексиканці обрушилися з нестримною жадібністю, щоб пограбувати Гватемалу. Латифундисти по той бік кордону кинулися захоплювати землі, відтворюючи найгірші зловживання United Fruit Company. Промисловці та заповзятливі політики ПРІ хапали будь-яку власність, до якої могли дотягнутися, розбираючи її на частини, якщо швидкого прибутку отримати не вдавалося. У міру того як Гватемала дедалі глибше занурюється в бідність і насильство, мексиканське полювання за кількома песо більше придбало для неї вічного ворога в Землі вічної весни."

 GUA_Counterrevolutionary_Elements_2:0 "Контрреволюційні елементи"
 GUA_Counterrevolutionary_Elements_2_desc:0 "Гватемальські військові, відбудовані з нуля після мексиканського вторгнення, тепер є силою Революції, а не найсмертоноснішим кинджалом, спрямованим у серце нації. Але ці віддані війська відчайдушно перевантажені боротьбою з незліченними ворогами, які прагнуть повалити Революцію: реакційними партизанами, серед яких багато добре навчених колишніх солдатів і поліцейських, комуністами, які ніколи не склали зброї, та селянами-мая, обуреними жорстокою й упередженою мексиканською окупацією, яка породила новий порядок Гватемали.\n\nЗаради національної гордости та міжнародної респектабельности Гватемала не визнає частих вторгнень мексиканських військових і сил безпеки для боротьби з цими загрозами. І ці жорстокі транскордонні операції не припиняться, доки Гватемала не зможе закріпити власну Революцію."

 GUA_Saker_Ti:0 "Сакер-Ті"
 GUA_Saker_Ti_desc:0 "Після темряви репресивного військового уряду Ідіґораса в Гватемалі настав новий світанок. Він осяює червоно-чорні прапори МР-13, що висять у Палаціо-Верде, натовпи студентів, які святкують на вулицях. Вогнепальна зброя кубинців і бійців Карибського легіону виблискує під його променями, тоді як мексиканські радники ховаються в довгих ранкових тінях.\n\nДалеко від святкувань солдати старого режиму чіпляються за свою зброю в печерах і сільських укріпленнях, досі не осяяних новим сонцем. Але поки їхні лідери метушаться у віддалених закутках за кордоном, об'єднання Гватемали під новим днем — лише питання часу."

 GUA_The_Great_Uprooting:0 "Велике викорчовування"
 GUA_The_Great_Uprooting_desc:0 "Революція, очолена МР-13, не змогла б перемогти без партизанів, які обіцяли радикальну та всеосяжну аграрну реформу. Але поки бойовики облаштовуються та створюють нові органи влади в місті Гватемала, тисячі нетерплячих мозолястих рук випереджають їхню програму та декрети, забираючи землю, яку вважають своєю.\n\nРадісні селяни та сільськогосподарські робітники захоплюють одну плантацію за іншою, тоді як захисники-воєнізовані формування ламаються при вигляді персоналу United Fruit Company та елітних землевласників, які тікають із країни. Хоча статистику в хаосі вести неможливо, різке падіння сільськогосподарського виробництва видно з нестачі бананів та кави, що накопичуються в портах. Проте новий режим закріпив глибоку лояльність у сільській місцевості, якщо не контроль."

 GUA_Men_Of_Maize:0 "Люди кукурудзи"
 GUA_Men_Of_Maize_desc:0 "Хакобо Арбенс, ключова постать у перемозі над Убіко у 44-му, здобув перемогу над іншим великим ворогом Революції — United Fruit Company. Провівши добре сплановану та поступову аграрну реформу протягом свого терміну, президент ПРД зміг експропріювати та перерозподілити необроблювані землі з величезних плантацій країни серед селян, а також підвищити заробітну плату й покращити умови праці сільських робітників.\n\nUFCO далеко не переможена, ведучи запеклу оборону разом із союзними землевласниками в судах і на полях. Але професійна та віддана бюрократія, яку Арбенс створив у Національному аграрному департаменті, та залучене селянство, що бере участь в Аграрних комітетах, готові до тривалої кампанії попереду. Їхній тріумф уже можна побачити в полі за полем стиглої кукурудзи."

 GUA_Land_Of_Eternal_Spring:0 "Земля вічної весни"
 GUA_Land_Of_Eternal_Spring_desc:0 "Демократія досягла повного розквіту в Гватемалі. Коли народ посадив зерно свободи під час Революції 1944 року, мало хто міг передбачити, що воно пустить коріння в ґрунті, оголеному десятиліттями військового правління. Але воно виросло — виборче право та освіта були розширені, а майже кріпосницьке становище її сільської бідноти було покладено край. Поки країна святкує найконкурентніші вибори у своїй історії, чапіни садитимуть нові цибулини в цьому квітучому саду.\n\nЯкий би вибір вони не зробили в цьому світі жорстоких, темних зим, гватемальський народ зробив свій дім справжньою Землею вічної весни."

