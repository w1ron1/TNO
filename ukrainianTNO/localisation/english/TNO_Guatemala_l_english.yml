 GUA_forpol.1.t: "Дилема контрабандиста"
 GUA_forpol.1.desc: "Агент Діас подув на чашку кави, перш ніж зробити ковток, переглядаючи аркуші паперу, розкладені на його столі. На кордоні з Гватемалою сталося щось дивне, і ця справа не давала йому спокою. Він узяв кулькову ручку й почав клацати нею. «Ще раз про все з початку, коротко...» Діас відірвав чистий аркуш паперу й почав писати, міцно насунувши окуляри на перенісся.\n\nУсе почалося з одного капрала Рамоса — цілком непримітного чоловіка, якщо вірити його товаришам по службі під час співбесід із DFS, — який без дозволу залишив казарми в Сьюдад-Ідальґо, захопивши вантажівку посеред ночі. Схоже, він робив це вже не вперше, але цього разу якимось чином привернув увагу вартового, тож за ним відправили людей, щоб розшукати його як можливого дезертира. Прикордонники схопили його просто перед тим, як він перетнув міст Родольфо Роблеса, обшукали його кишені та перевірили кожен закуток вантажівки за допомогою собак-шукачів та інших засобів.\n\nВони виявили, що він украв кілька ящиків боєприпасів, зброю та багато тонн динаміту — деякі шашки він навіть приклеїв до свого тіла — а також справжні фугасні боєприпаси. Капрал Рамос також мав при собі до 10 000 песо готівкою та ще більші суми в іноземній валюті. Його, звісно, заарештували, і після ночі в камері та приємної переконливої розмови він усе розповів.\n\nВиявляється, військові в Гватемалі підкуповували своїх мексиканських колег, щоб ті заплющували очі, коли вони шукали зброю та матеріали, а звичайні солдати виконували роль кур'єрів. За цей час було здійснено ще кілька арештів, але саме це не давало Діасу спокою.\n\n«Навіщо їм зброя? І чому саме від нас?» — пробурмотів він собі під ніс, нахиляючись, щоб підняти телефонну слухавку. Це було явно не його рівня.\n"
 GUA_forpol.1.a: "Розслідувати далі."

 GUA_forpol.2.t: "Таємна змова"
 GUA_forpol.2.desc: "«Ти отримав вантаж?»\n\n«Перехопили. Поліція схопила Рамоса просто перед переходом через кордон».\n\n«Чорт! Але план усе ще в силі?»\n\n«Усе закінчиться, коли я скажу, що закінчилося. Так чи інакше, друже мій, уряд упаде».\n\nНа іншому кінці лінії пролуцав клац, і зв'язок обірвався. Агент Хіменес покрутив кілька перемикачів на апаратурі прослуховування, переглядаючи щойно розшифровану ним розмову. «Отже, чутки були правдою», — пробурмотів він, швидко роблячи нотатки. Перебуваючи у відрядженні в місті Гватемала разом із DFS, Хіменес отримав інформацію про якусь контрабандну операцію через кордон — вогнепальна зброя, щось таке, — але йому не повідомили, наскільки все серйозно. Телефони, які він щойно прослуховував, належали один військовому штабу в Сан-Маркосі, а другий — власнику фазенди в містечку під назвою Сібіналь. І військові, і місцеві плантатори хотіли нашкодити ПАР і ввозили для цього зброю та вибухівку.\n\nХіменес покрутив диск телефону, і коли оператор запитав, із ким його з'єднати, на мить замовк. Діас у Чіапасі знайшов зачіпку... але той, хто першим доповість у Федеральний округ, отримає подяку.\n\nТелефон у кабінеті Фернандо Ґутьєрреса Барріоса задзвонив один раз, і той спокійно підніс слухавку до вуха. Вільною рукою на друкарській машинці вже почали з'являтися перші фрагменти звіту DFS — ЗАГРОЗА ПЕРЕВОРОТУ В ГВАТЕМАЛІ. Контрабандна зброя. Гватемальські військові, United Fruit Company, реакціонери прагнуть не допустити приходу обраного президентом лівого Арбенса до влади."
 GUA_forpol.2.a: "Рекомендувати проникнення через відомі канали контрабанди."
 GUA_forpol.2.b: "Рекомендувати посилити спостереження через операцію в місті Гватемала."

 GUA_forpol.3.t: "Прикордонний контроль"
 GUA_forpol.3.desc: "Доктор Самуель Леон Бриндіс не був дурнем. У нього були очі й вуха всюди в штаті Чіапас — зрештою, він був його губернатором, — і вони помітили численні чутки, що надходили з-за кордону. Уряд ПАР Гватемали впаде, це було гарантовано, але губернатор Бриндіс запитував себе, як можна отримати максимальну вигоду з цього хаосу. І тут його осяяло.\n\nЦі кляті контрабандисти сновигали туди-сюди через кордон, а ці прокляті гватемальці ніколи не зайдуть настільки далеко, щоб притягнути їх до відповідальности — чорт, вони, мабуть, самі в цьому замішані — і здіймуть крик про порушення їхнього суверенітету. Що ж, він дасть їм привід для крику!\n\nВін поговорив зі своїми людьми в поліції штату, і вони мали провести скоординовані рейди на різні контрабандні сховища, деякі з яких зручно розташувалися по той бік кордону. Це не було збігом. Гватемальська влада буде принижена, поставлена на місце. Поставлена на коліна. І саме йому, старому лікарю, належало завдати їм хірургічного удару.\n\nБриндіс не знав, що один із його секретарів, цілком непримітний чоловік, який, можливо, а можливо й ні, працював на DFS, читав його особисті папери й дізнався про його грандіозний план. Насправді копія цих паперів того самого дня опинилася в Лос-Пінос. Лопес Матеос замислився, що робити."
 GUA_forpol.3.a: "Провести Бриндісу виховну бесіду й організувати спільну операцію з гватемальцями."
 GUA_forpol.3.b: "Покарати його? Він отримає всю необхідну допомогу! Треба поставити цих виродків на місце."

 GUA_forpol.4.t: "Відновлення сплячої змови"
 GUA_forpol.4.desc: "ТАЄМНО/[?global.date.GetDateStringNoHourLong]\n\nВІД: ДИРЕКТОР ФБР ДЖ. ЕДҐАР ГУВЕР\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\nТЕМА: МОЖЛИВИЙ ПЕРЕВОРОТ У ГВАТЕМАЛІ\n1. Бюро стало відомо про розвиток подій у Республіці Гватемала. Розвідка повідомляє, що різні представники Збройних сил Гватемали та представники United Fruit Company (UFC) змовляються з метою повалення лівого уряду Partido Acción Revolucionaria (ПАР) після перемоги ПАР на цьогорічних виборах. Задіяні люди та мережа схожі на змову з метою перевороту, розроблену на початку 1958 року, що вказує на те, що ця нинішня змова є «відродженням» змови, яку раніше так і не було втілено в життя.\n\n\n2. Хоча відносини між ПАР та Сполученими Штатами загалом були дружніми, UFC неодноразово висловлювала занепокоєння, що її власність у Гватемалі опиниться під загрозою конфіскації, якщо обраний президентом Арбенс реалізує свою радикальну програму земельної реформи. Потенційна напруженість з Америкою та побоювання щодо внутрішньої радикалізації також спонукали проамериканських та антикомуністичних військових офіцерів до змови з метою повалення ПАР як превентивного заходу, хоча повідомлення свідчать, що новіші учасники змови не всі виступають за посилення американського впливу в країні, демонструючи більш націоналістичний характер."
 GUA_forpol.4.a: "Ми стежитимемо за ситуацією."

 GUA_forpol.5.t: "Коло стискається"
 GUA_forpol.5.desc: "Минуло чимало часу відтоді, як агенту Майклсу доводилося грати в ці шпигунські ігри. Він стежив за чоловіком від Міністерства оборони, забрав схованку біля собору, і зрештою опинився тут, у масонській ложі на пагорбах із видом на місто Гватемала. У повній формі двоє армійських офіцерів чекали на нього посеред темної зали з дубовими панелями. Він був би радий телефонному дзвінку, але хлопці, які змовляються з метою повалення уряду, завжди вважають за потрібне влаштувати ціле театральне дійство.\n\n«Гарна будівля, чи не так, мій янкі-друже?» — сказав один з офіцерів — високий і худорлявий, зі шкірою кольору молочної кави. — «У світі мафії прониклива людина мимоволі тягнеться до чудових ідей старої Європи — таких як масонство».\n\n«Я все ще чекаю, коли начальник станції мене запросить», — сухо відповів Майклс. — «Дякую, що випередили його, якщо тільки, джентльмени, ви не надто прихильні до ідей нової Європи».\n\nВисокий офіцер знизав плечима. «Немає нічого ні доброго, ні поганого, але думки роблять їх такими».\n\nІнший офіцер озвався — він був низьким і кремезним, ніби все життя просидів за письмовим столом, але поводився нетерпляче. «Годі, ми всі знаємо, навіщо тут зібралися». Він витер чоло рукавом. «Ми представляємо стурбованих патріотів Гватемали, які не хочуть сидіти склавши руки, поки ПАР перетворює нас на ще одну Кубу».\n\n«Якби тут був представник UFC», — знову заговорив високий, — «він своєю мовою розповів би вам, наскільки небезпечною є подальша самозаспокоєність Вашингтона. Допоможіть хоча б собі. Що сказав би ваш начальник станції?»"
 GUA_forpol.5.a: "«Не розраховуйте на нас, ковбої, я довіряю вашій організації ще менше, ніж ПАР»."
 GUA_forpol.5.b: "«Якщо ви можете це зробити, тоді зробіть. Поговоримо після вашої перемоги»."

 GUA_forpol.6.t: "Японська оцінка"
 GUA_forpol.6.desc: "Надходили тривожні повідомлення про можливий переворот у Гватемалі. Від японських керівників сталеливарних підприємств до місцевих текстильних робітників усі повторювали одну й ту саму тривожну картину — сутички з гватемальським гарнізоном, допити з боку його завзятих офіцерів і чутки про нову дружбу з Токіо. В усіх повідомленнях наполегливо фігурувало одне ім'я: Міґель Ідіґорас.\n\nХатано нервово перечитував кожне з них. А потім ще раз. І з кожним прочитанням його дихання ставало дедалі важчим. Він думав, що робота в Америці буде спокійнішою, ніж удома. А тепер сидів перед листами, які могли ознаменувати крах останнього осередку стабільности Центральної Америки. Чому саме переворот? Чому саме тут?\n\n«Тату?» Голос пролунав у кабінеті посольства.\n\nХатано обернувся й побачив доньку, яка стояла у дверях. Вона тримала тарілку гарячих тамалес, куплених на недільному ринку. «Чому ти досі працюєш? Хіба ти не голодний?»\n\n«Татові треба надіслати до Японії важливі речі», — Хатано вимучено засміявся. — «Вони хочуть знати, що тут відбувається».\n\nДівчинка зайшла й поставила тарілку на його стіл. Бананове листя залишило на звітах масні плями, але Хатано було байдуже. «Це означає, що нам доведеться повернутися?»\n\nХатано подивився на неї, і в його очах з'явився жаль. Його донька ніколи не бачила величі Фудзі й не блукала барвистими вулицями Токіо. У її словах уже почав з'являтися легкий іспанський акцент замість японської мелодики. Її дім був тут, у Гватемалі, і тепер його мали розірвати на шматки."
 GUA_forpol.6.a: "Дім, який він мусить захистити."
 GUA_forpol.6.b: "І заради неї Японія повинна обрати сторону переможця."
 GUA_forpol.6.c: "«Заспокойся, Хаято. Дивися на речі ширше»."

 GUA_forpol.7.t: "Парамілiтарист за сумісництвом"
 GUA_forpol.7.desc: "Як можна проїхати тисячу миль і якимось чином опинитися там само?\n\nХтось розумніший за Тенту, ймовірно, вигадав цю фразу, але що довше він там стояв, то сильніше ці слова не давали йому спокою. Шелест листя, дзижчання комах і пекуче екваторіальне сонце, яке, здавалося, мало не засуджувало сам факт його присутности. Здавалося б, непримітний службовець Ясуди, хоч і далеко від Токіо, не мав би так сильно виділятися в такій мирній країні з тропічними джунглями.\n\nОднак Тента знав краще, адже для такого місця було достатньо лише правильної чи неправильної людини, щоб воно перетворилося на зовсім іншого звіра.\n\nЧерговий постріл із гвинтівки пролунав, і уламки скла полетіли на всі боки — влучність партизанів покращувалася з кожною розбитою пляшкою. Тента витер піт із чола, поки шеренга солдатів прицілювалася й робила нові постріли перед ним, а внизу, у землі, накопичувалася розсип порожніх гільз. Важко було назвати це «підробітком» у таку годину, але що ще мав робити відставний майор Імператорської японської армії, якщо не поширювати трохи добробуту у свій вільний час?\n\nНе те щоб Ясуда не знала про військове місце відпочинку Тенти, адже вони мали отримати з цього не менше за нього. Не всі ділові зв'язки повинні бути комерційними, не кажучи вже про законність. Песо, якими вони йому платили, було небагато, але їх вистачало на американські подарунки для його родини на рідних островах. Хоча Тента й міг нарікати на погоду, яка нагадувала йому Яву, за американськими мірками це була, безперечно, прибуткова робота."
 GUA_forpol.7.a: "Випадкова думка змусила його закотити очі; Небеса — це Гватемала... можна написати це в туристичній брошурі?"

 GUA_forpol.8.t: "Співпрацювати з Мендесом?"
 GUA_forpol.8.desc: "«Доброго дня з міста Гватемала, сеньйоре. Ви, мабуть, дивуєтеся, навіщо ми користуємося гарячою лінією. Покличте начальство й передайте їм це...»\n\nДзвінок, ще один і ще один — доки всі лінії до Лос-Пінос не почали гудіти від змов. Там Великий Гуманний Президент сидів за своїм столом із червоного дерева, міцно зчепивши руки, поки капітан DFS Ґутьєррес Барріос та відповідний командир зони, генерал Барраґан, займали свої крісла.\n\n«Ваша Високосте, вони знають про агентів, які нишпорять навколо контрабандистів. Зазвичай це означало б, що вся операція провалена», — почав Барріос, — «але вони зробили нам пропозицію».\n\nБарраґан поворухнувся у своєму кріслі. «Президент Мендес Монтенегро просить розвіддані про цих змовників, усе, що ми можемо їм дати. А також вони хочуть знати, чим займаються Бюро та його агенти».\n\nЛопес Матеос підвівся, застебнув пальто й повільно почав ходити кімнатою, піднявши очі вгору, поки обмірковував ситуацію. «Це серйозне прохання, ліценціадос. Це означатиме виступити проти всієї сили ФБР у Гватемалі».\n\n«Я кажу не втручатися, Ваша Високосте. Мендес був нікчемою, коли його військово-повітряні сили обстріляли наших рибалок. І зараз він буде таким самим нікчемою», — буркнув Барраґан, скоса глянувши на Барріоса, який похитав головою.\n\n«Допомога гватемальській адміністрації означатиме, що наших агентів не депортують, генерале. Ми можемо щось передати».\n\nЗрештою, рішення залишалося за Президентом. Вони обоє замовкли, очікуючи на його владне слово."
 GUA_forpol.8.a: "«ПАР — наші друзі. Дамо їм усе, що маємо»."
 GUA_forpol.8.b: "«Обмежені розвіддані. Ми не збираємося воювати з ФБР»."
 GUA_forpol.8.c: "«Якби він хотів допомоги, то спочатку мав би приструнити своїх військових, перш ніж вони вбили мексиканців»."

 GUA_forpol.9.t: "Прощавай назавжди"
 GUA_forpol.9.desc: "«Боріться за націю», — лейтенант вдивлявся крізь імлу на тому березі річки. «Захищайте революцію». Ріо-Чіхой стрімко текла, невтомно виконуючи своє єдине завдання — розділяти дві держави: Мексику та Гватемалу. «Захищайте наро-» Хмара вибухнула. Він упав в укриття, але знадобилося лише мить, щоб зрозуміти, що ціллю був не він. Чапіни на іншому березі Чіхою стріляли один в одного.\n\nУ далекому місті Гватемала солдати заполонили вулиці. Президент Мендес не закликав лояльні до ПАР профспілки чи студентів до зброї — перша промова нової хунти стверджуватиме, що він наклав на себе руки.\n\nМатеос у своєму кабінеті читав кожен звіт, вислуховував кожну деталь від DFS та SEDENA. Усе скінчено. 1944 рік. Зник. Генерал Ідіґорас узурпував мрію, підживлений ФБР, United Fruit Company та плантаторами, він зламав революційну мрію, зламав режим ПАР. Усе скінчено — його притулок у 1929 році, коли PNR полювала на нього. Його — але все скінчено. Усе скінчено, і янкі вбили її. Єдина причина, чому він не виступив проти цього перевороту. Ці чортові ґрінґо.\n\nДумки Матеоса повернулися до сьогодення: представники двох відомств та їхні люди обіцяли йому й надалі стежити за знищеною мрією та чекати. Вони чекатимуть і дивитимуться, як розвиватиметься Гватемала без її полум'я."
 GUA_forpol.9.a: "Ще одна революція розсипається, залишаються лише сльози."

 GUA_forpol.10.t: "Інше обличчя, темніша держава"
 GUA_forpol.10.desc: "Президент Матеос відчув біль у грудях, коли підняв обіцяний звіт. Минуло майже два роки відтоді, як Ідіґорас повалив гватемальську революцію. Кожна перегорнута сторінка показувала ще один спосіб, у який він це зробив. Народ відсторонено від влади, пресу цензуровано, профспілки придушено, майя винищено. Ідіґорас утримував націю під військовою диктатурою, лояльною лише до долара United Fruit Company.\n\nОднак падіння Гватемали було чимось більшим, ніж перетворення на посудину для іноземної експлуатації. Режим Ідіґораса не був просто маріонетковою державою, він мав власну волю — перетворити всю націю на фашистське кладовище. Мобілізувати всю націю для підготовки до чогось подібного до власного Пуерто-Плати. Готуватися до конфлікту з Мексикою, Кубою, з Веракруським пактом загалом.\n\nМатеос відклав звіт. Він ненависно й безсило дивився на ім'я Ідіґораса, ніби це могло викликати генерала до Лос-Піноса, де його можна було б знищити чистою й непідробною люттю. Але ні.\n\nГватемала стала загрозою мексиканській безпеці, з чим погоджувалися працівники служб безпеки й оборони. Матеос не зможе довести це до кінця; його наступнику доведеться мати справу з реакційною загрозою. Поки що він міг лише готуватися."
 GUA_forpol.10.a: "Революція не буде згасла тут."

 GUA_forpol.11.t: "Профіль режиму Ідіґораса"
 GUA_forpol.11.desc: "ТАЄМНО/[?global.date.GetDateStringNoHourLong]\nВІД: ІСААК УЗАРЦЕВІЦ\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\nОНОВЛЕННЯ ЩОДО ГВАТЕМАЛИ\n\n1. Президент Міґель Ідіґорас зміцнив свій контроль над гватемальською політикою після того, як два роки тому очолив переворот. Попри націоналістичну риторику, його уряд прихильно ставиться до американських комерційних інтересів і поблажливо ставиться до розширення американських розвідувальних мереж та військових зв'язків. Однак його внутрішні репресії та ворожість до Веракруського пакту можуть зашкодити внутрішній і регіональній стабільності.\n\n2. Гватемальські чиновники, з якими встановлювали контакт протягом останніх чотирьох місяців, описують інших членів хунти як відсторонених генералом Ідіґорасом, а також описують параноїдальну атмосферу в уряді, що придушує будь-яку внутрішню опозицію. Окремо United Fruit Company повідомила про рекордні прибутки, а керівники в Кіче та Баха-Верапасі пов'язують це з політикою уряду Ідіґораса, сприятливою до вільного розвитку сільського господарства. Нарешті, Ідіґорас розпочинає значне військове нарощування, щоб задовольнити свою опору, боротися з дисидентами майя та партизанами на кшталт MR-13 і забезпечити безпеку кордону після загострення відносин із Мексикою на початку цього року.\n\n3. З огляду на міцність позицій Ідіґораса, зміцнення особистих зв'язків через візит високопоставленого представника адміністрації могло б істотно посилити позиції США в Гватемалі, ризикуючи негативною реакцією Веракруса. Як альтернатива, ми можемо зберігати публічну дистанцію, водночас заохочуючи інвестиції UFC та продаж зброї. Нарешті, ми можемо чинити на Ідіґораса тиск, щоб він пом'якшив свою ворожу риторику та внутрішні репресії."
 GUA_forpol.11.a: "Відправити того самого до міста Гватемала на каву з нашим партнером Ідіґорасом."
 GUA_forpol.11.b: "Проблематична, але корисна фігура. Тихо заробімо якомога більше грошей."
 GUA_forpol.11.c: "Змусити Fruit Company сказати йому, що вся ця параноя шкодить бізнесу. Це заспокоїть ситуацію."

 GUA_forpol.12.t: "УВАГА: МІНІСТРУ НАЦІОНАЛЬНОЇ ОБОРОНИ"
 GUA_forpol.12.desc: "Розслідування минулотижневої сутички завершено. Підрозділи прикордонної служби, здійснюючи стандартне патрулювання в зоні командування Кампече, натрапили на невелику кількість озброєних людей із Гватемали, які здійснювали вторгнення на нашу територію. Їхні мотиви залишаються невідомими, однак ми можемо з упевненістю сказати, що від 15 до 20 солдатів перетнули річку Усумасінту з боєприпасами та припасами. Інші прикордонні підрозділи в цьому районі не повідомляли про ворожу активність, і подальше розслідування не виявило жодних доказів протилежного.\n\nЯк зазначалося в початковому звіті, жоден із підрозділів не був озброєний, тому про серйозні втрати не повідомлялося. Таким чином, хоча гватемальський підрозділ був змушений відступити через сутичку, ситуація не переросла негайно в щось серйозніше за розгортання озброєних підрозділів.\n\nВивчення даних повітряної розвідки та місцевих спостережень після інциденту підтвердило присутність у регіоні додаткових гватемальських військових підрозділів. Є ознаки щонайменше трьох нових складів постачання, прихованих у лісах поблизу лінії зіткнення. Нещодавно на аеродромі Дос-Лаґунас приземлилися 3 B-29, на яких було помітно завантажені боєприпаси. Місцеві розвідувальні операції виявили нові патрулі та табори з гватемальського боку кордону. У цьому районі діє щонайменше 1 свіжий батальйон.\n\nНаша оцінка, яку буде представлено Президенту та Кабінету, полягає в тому, що гватемальці знають, що після інциденту за ними стежать, і подають сигнали залякування. Однак якщо вони вирішать розпочати конфлікт у цьому регіоні, використовуючи нещодавно розгорнуті сили, нам навряд чи вдасться стримати його нинішніми місцевими силами.\n\nЗ повагою, генерал Хорхе Альвес"
 GUA_forpol.12.a: "Скоротити операції в районі й повідомити послу про наші мирні наміри."
 GUA_forpol.12.b: "Викликати посла, щоб офіційно висловити протест, і продовжити нинішні операції."
 GUA_forpol.12.c: "Збільшити операції в районі, як патрулювання, так і розвідку, щоб продемонструвати нашу рішучість."
 GUA_forpol.12.d: "Мобілізувати наші місцеві сили, додавши людей і літаки, та підготувати кордон."

 GUA_forpol.13.t: "Звіт ФБР про прикордонний інцидент №0142"
 GUA_forpol.13.desc: "ТАЄМНО/[?global.date.GetDateStringNoHourLong]\nМісце: Східний Чіапас, 16°45'57.6\"N 90°46'27.7\"W\n1. Наші джерела як у Гватемалі, так і в Мексиці повідомили нам про прикордонний інцидент поблизу вказаних координат. Хоча деталі залишаються нез'ясованими, загальну ситуацію підтверджено. Дисиденти, що виступають проти ПРІ та використовують Гватемалу як безпечний притулок, спробували перетнути кордон із Мексикою через річку Усумасінту на плотах, перевозячи боєприпаси та припаси. Їх виявив мексиканський патрульний катер, після чого спалахнула перестрілка, що загострилася після прибуття групи швидкого реагування мексиканських військових. Дисиденти відступили до Гватемали, і мексиканські сили переслідували їх приблизно на милю, перш ніж були зупинені гватемальськими військами, що прибули на місце. Замість того щоб погодитися на запропоноване роззброєння та інтернування, мексиканський підрозділ відступив назад через кордон.\n\n2. Обидві сторони розгорнули в регіоні свої підрозділи, причому обидва уряди звинувачують один одного в порушенні суверенітету. Мексика звинувачує Гватемалу в тому, що вона продовжує сприяти переходам дисидентів через кордон — неперевірене твердження, — тоді як Гватемала називає мексиканське вторгнення чим завгодно, але не актом війни. Обидві сторони ще можуть змінити курс, але аналітики одностайні: ситуація може загостритися ще більше — навіть до війни.\n\n3. Підтримка Мексики може покращити відносини з державами Веракруського пакту, але мексиканське вторгнення важко виправдати відповідно до нашої доктрини вимагати дотримання міжнародних норм. Підтримка Гватемали відповідала б цій доктрині, однак також вимагала б заплющити очі на триваючу проблему мексиканських дисидентів, відчужуючи Мексику та її союзників. Мовчання в цьому питанні було б найбільш прийнятним для партнерів ОВН, забезпечивши нам нейтральність для головування в процесі врегулювання, але створює ризик, що в регіоні це сприймуть як слабкість."
 GUA_forpol.13.a: "На Мексику напали, і вона відповіла. Ідіґорас не повинен думати, що ці дії підтримуються."
 GUA_forpol.13.b: "Мексика відреагувала надмірно й ризикує розпочати війну. Вона не повинна думати, що її дії підтримуються."
 GUA_forpol.13.c: "Ні Мексика, ні Гватемала не невинні. Коли карти буде розкрито, знадобиться нейтральний голос."

 GUA_forpol.14.t: "Напруженість спадає"
 GUA_forpol.14.desc: "«Гаразд». Слова хрипко вирвалися з горла генерала Хосе Аґустіна Олачеа — чи то через вік, чи то через відсутність практики. «Три окремі звіти з Гватемали підтвердили те, що ми підозрювали — Ідіґорас не був готовий до війни, а гватемальська економіка не могла довго підтримувати воєнний стан. Очікуйте, що в найближчі тижні їхнє нарощування сповільниться, а потім піде назад».\n\nДель Росаль не зводив очей із міністра національної оборони, але було важко не кинути погляд на генерала Барраґана. Колишній лівий пробрався на цю зустріч із командирами південної зони. Ще одна ознака того, що ця людина матиме вплив у майбутній адміністрації.\n\n«Але ми дійшли до цього моменту лише завдяки нашій суворій пильності вздовж гватемальського кордону. Ви твердо тримали своїх людей, позбавивши гватемальців як можливости, так і провокації для дій», — продовжив Олачеа. «Протягом наступного періоду, коли політики та преса святкуватимуть нашу перемогу, а потім відволікатимуться на наступну завершену греблю чи чергову моду янкі, пильність повинна зберігатися».\n\n«Тому що Гватемала залишатиметься мілітаризованою та сповненою ненависти, ворогом Мексиканської революції доти, доки Ідіґорас живий. Тому що Гватемала залишатиметься...» — очі Олачеа зустрілися спочатку з очима дель Росаля, а потім Барраґана."
 GUA_forpol.14.a: "Пильність повинна зберігатися."

 GUA_forpol.15.t: "МЕМОРАНДУМ ПРО ВІДНОСИНИ США — ГВАТЕМАЛА"
 GUA_forpol.15.desc: "МЕМОРАНДУМ ДЛЯ: TS, Офіс Маямі\n\nТЕМИ:\n1. Позиція Ідіґораса щодо відносин із Мексикою\n2. Поточна американська присутність у Гватемалі\n3. Перспективи подальшого проникнення США\n\nГватемальський переворот спричинив період зростання напружености між Гватемалою та її сусідами. Нова адміністрація на чолі з генералом Міґелем Ідіґорасом Фуентесом розпочала кампанію лівої протидії в країні. Однак, попри початкові очікування, новий уряд звернувся до Мехіко, і ворожі відносини покращилися. Немає особливих ознак того, що це припиниться в осяжному майбутньому.\n\nПолітика Ідіґораса покращила доступ до ринку для американських компаній, таких як United Fruit Company, але майже не вплинула на політичні зв'язки зі США. Див. звіт 4439-1.\n\nМи перебуваємо у вигідному становищі, щоб скористатися покращенням відносин у регіоні всередині Гватемали. Використовуючи наявні ресурси, ми можемо перейти до встановлення глибших і помітніших зв'язків як у військових, так і в адміністрації, чого раніше не можна було робити. Зв'язки у військових сприятимуть поглибленню нашого розвідувального проникнення в можливості Гватемали, а також політичному впливу з огляду на вплив військових у режимі. Імовірно, здатність США впливати на політику зростатиме, якщо докласти відповідних зусиль.\n\nПідпис: BF, Офіс у місті Гватемала"
 GUA_forpol.15.a: "Вірність, відвага, чесність."

 GUA_forpol.16.t: "Неприємний сусід"
 GUA_forpol.16.desc: "ДИРЕКЦІЯ ФЕДЕРАЛЬНОЇ БЕЗПЕКИ\nПИТАННЯ: Триваюча загроза з боку Гватемали Ідіґораса\n\nУряд генерала Ідіґораса підтримує ворожі відносини зі Сполученими Мексиканськими Штатами відтоді, як прийшов до влади у 1962 році. Хоча цього року кількість прикордонних інцидентів зменшилася, збройні сили Гватемали залишаються на передових позиціях і двічі за останні три місяці порушували повітряний простір Мексики.\n\nНещодавній звіт Секретаріату зовнішніх зносин щодо Гватемали не передбачає жодних істотних можливостей для покращення відносин. Ідіґорас хибно стверджує, що наша Революція є соціялістичною, а ми та інші члени Веракруського пакту прагнемо експортувати нашу ідеологію до Гватемали та всієї Центральної Америки. Атмосфера параної призвела до посилення репресій по всій країні.\n\nТривожно, що режим, схоже, усуває економічні та військові обмеження, які змусили його відступити під час торішньої загрози війни. Трудові та комерційні гарантії, запроваджені попереднім лівоцентристським урядом ПАР, скасовано, що спричинило хвилю інвестицій американських компаній. Гватемальські офіцери армії, військово-повітряних і військово-морських сил проходять спеціалізовану підготовку у Сполучених Штатах, а американські військові об'єкти відкриваються в багатьох місцях.\n\nЗ огляду на розвиток цієї ситуації рекомендується переглянути нашу позицію щодо Гватемали. Варіанти включають: швидке, тимчасове нарощування сил на кордоні, щоб підірвати уявлення про безпеку Гватемали, що спричинить швидкий відтік інвестицій північноамериканського бізнесу; будівництво додаткових прикордонних укріплень та покращення регіональної логістики для підготовки до потенційного конфлікту, але без його провокування; та інвестиції в гватемальські розвідувальні мережі для зриву політичних і військових заходів Ідіґораса. Рішення за Ваша Високостею."
 GUA_forpol.16.a: "Продемонструвати силу."
 GUA_forpol.16.b: "Підготувати нашу оборону."
 GUA_forpol.16.c: "Зберігати непомітну підривну позицію."

 GUA_forpol.17.t: "МР-13 та Брудна війна"
 GUA_forpol.17.desc: "Міністру внутрішніх справ,\n\nПалата була рада почути ваш звіт про зусилля вашого Секретаріату в боротьбі з комуністичними партизанськими групами в нашій сільській місцевості. З огляду на загрозу ПГТ ваш фокус на північній Мексиці, особливо Чіуауа, був зрозумілим.\n\nОднак кілька депутатів із Чіапасу та Кампече хотіли б почути більше про вашу роботу в боротьбі з комуністами МР-13. Я розумію, що ваш Секретаріат міг тимчасово терпіти або навіть підтримувати таку групу через її протистояння уряду генерала Ідіґораса в Гватемалі. Якщо це правда, такі дії були б серйозною помилкою.\n\nКомуністична організація МР-13 могла бути створена в Гватемалі, але, як і всі подібні інтернаціоналістичні рухи, вона не поважає кордонів. Будь-який успіх, якого вона досягне проти Ідіґораса, швидко поставить під загрозу робітників і селян наших південних штатів.\n\nАле мені не потрібно вдаватися до припущень, МР-13 уже сьогодні загрожує життям мексиканців. МР-13 постачає зброю, кошти, припаси та новобранців так званим сапатистським партизанам на півострові Юкатан, у Табаско та Чіапасі. Місцева поліція знайшла пропаганду цієї групи в таборах гватемальських біженців — їхні заклики до соціялістичної революції тривожно нечітко визначають свою першу ціль. Відомий фермер, який володів землею поблизу кордону, був поранений і змушений залишити свою землю, щоб МР-13 могла використовувати її як базу для своїх мексиканських операцій.\n\nЯ хотів би повідомити депутатам, що це питання вирішено. Будь ласка, повідомте мені про вашу відповідь.\n\nАльфонсо Мартінес Домінґес, Голова Палати депутатів"
 GUA_forpol.17.a: "Вислати кількох гватемальських біженців, щоб він відчепився від нас."
 GUA_forpol.17.b: "Ретельне розслідування покаже, чи підтримує МР-13 наших внутрішніх ворогів."
 GUA_forpol.17.c: "Можливо, ми можемо використати наші зв'язки з МР-13, щоб вистежити місцевих партизанів."

 GUA_forpol.18.t: "Військові зв'язки"
 GUA_forpol.18.desc: "«Я поговорив із шістьма гватемальськими військово-морськими офіцерами, вони сказали, що їхній семестр за кордоном в Аннаполісі був чудовим», — повідомив аташе з питань оборони в Гватемалі. «Вісімнадцять гватемальців отримали крила десантників у Бреґґу, а шестеро пройшли школу рейнджерів». Американський посол кивнув, перегортаючи передані йому документи.\n\n«На що, на вашу думку, нам витратити решту бюджету?» — запитав посол, постукуючи по виділеній цифрі на сторінці звіту з фінансами.\n\n«Я бачу три варіанти, сер», — відповів аташе. «По-перше, ми могли б придбати землю за межами Пуерто-де-Чамперико. Побудувати спільну військово-морську базу. Таким чином, ми зможемо чинити значно більший тиск на японців у південній частині Тихого океану й, сподіваємося, стримати їх від проникнення до Центральної Америки.\n\n«Другий варіант — посилити нашу присутність військово-повітряних сил у місті Гватемала. Зараз ангари недостатньо великі для деяких наших більших літаків, і в нас є місце для будівництва кількох додаткових злітно-посадкових смуг».\n\n«Звісно, ми завжди можемо залишити цей залишок як резерв на чорний день. З огляду на те, як розвиваються дослідження й розробки, лише питання часу, коли нам знову доведеться модернізувати гватемальські військові...»"
 GUA_forpol.18.a: "Побудуймо ту спільну військово-морську базу."
 GUA_forpol.18.b: "Нашим військово-повітряним силам не завадили б ці гроші."
 GUA_forpol.18.c: "Поки що утримаємося від витрат."

 GUA_forpol.19.t: "Кубинська пропозиція"
 GUA_forpol.19.desc: "«І скільки саме у вас висадиться?» — запитав військовий аташе Ель Хефе.\n\nФідель Кастро був таким же самовпевненим, як завжди, навіть по телефону. «Близько 4 000, бійців Карибського легіону, озброєних і дуже, дуже небезпечних».\n\n«Бронетехніка?» — мексиканський посол не приховував своїх побоювань щодо цього.\n\n«Надто шумна, але протитанкових засобів вистачає». Крісло Кастро чутно заскрипіло, ймовірно, він відкинувся назад.\n\n«Ракетна зброя?» — уточнив аташе.\n\nКастро був незворушний. «РПҐ, міни, запалювальні гранати. А якщо не допоможе, динаміт там, де він працює».\n\n«А де саме це буде?» — страх посла посилювався з кожною хвилиною.\n\nКоротка пауза. «Там, де зазвичай вибухає динаміт; питання лише коли, а не стільки де».\n\n«Ваша впевненість заспокоює». Посол потер скроні, скривившись.\n\n«Можете трохи нам довіритися, ми маємо намір створити щось прекрасне». У голосі Кастро прозвучала нотка захисности.\n\n«Отже, удар із півдня?» — аташе попросив уточнити. «Операція на Юкатані, вздовж кордону?»\n\nПосол глянув на карту Північної Америки на протилежній стіні, вдивляючись у Вашинґтон, округ Колумбія, і параноїдально думаючи, що американська розвідка неодмінно слухає цю розмову. «А як щодо янкі?»"
 GUA_forpol.19.a: "«Нехай їдять попкорн!» — Кастро зарозуміло засяяв. «Гватемальці не знатимуть, що їх вдарило!»"

 GUA_forpol.20.t: "Економічний вплив"
 GUA_forpol.20.desc: "Сонячне світло заливало їдальню, де вирішувалося економічне майбутнє цілих країн. Джон М. Фокс, генеральний директор United Fruit Company, приймав гостей у своїй флоридській резиденції, підкоряючи національні економіки своїй волі. Він відкинувся в кріслі, витер рот носовичком і запропонував своєму співрозмовнику сигару.\n\n«Я мушу привітати вас, посоле. Ваша принципова позиція була вирішальною для запобігання підриву комуністами американських інтересів у Гватемалі та в усьому регіоні. Перепрошую, що запросив вас сюди під час вашої заслуженої відпустки, але сподіваюся, що їжа принаймні припала вам до смаку».\n\nДжон О. Белл, посол Сполучених Штатів у Гватемалі, люб'язно взяв запропоновану сигару. «Це зовсім не проблема, містере Фокс. Я лише виконував свій обов'язок, а їжа й справді була варта цієї подорожі. Але я припускаю, що ви запросили мене сюди не лише для того, щоб висловити свої привітання».\n\nФокс затягнувся. «Саме так, посоле. Як ви знаєте, ми вже почали відновлювати наш бізнес у Гватемалі. Їхній уряд відкрив для нас нові можливості, скасувавши трудові норми комуністів. Однак нам досі доводиться працювати з місцевою владою протягом усього процесу виробництва та експорту, що може бути... неефективним. Нам могла б допомогти участь інших американських компаній у спрощенні виробництва та зміцненні нашої присутности в Гватемалі, що також відповідало б національним інтересам. Було б чудово, якби ви поговорили з Торговою палатою й повідомили їм, що зараз Гватемала — чудове місце для відкриття бізнесу. Що скажете?»\n\nБелл відкинувся назад. Американська присутність у Гватемалі справді відповідала національним інтересам, але думка про те, що корпорації експортуватимуть свої порушення трудового законодавства за кордон, неминуче мала спричинити юридичні проблеми. Можливо, краще відсікати їх, перш ніж вони стануть тягарем?"
 GUA_forpol.20.a: "«Я поговорю з ними. Нам потрібно, щоб більше американських компаній розширювали операції в Гватемалі»."
 GUA_forpol.20.b: "«Я подивлюся, що зможу зробити, але боюся, що на цьому етапі не можу взяти на себе конкретних політичних зобов'язань»."
 GUA_forpol.20.c: "Белл подумки занотував собі зв'язатися з Міністерством юстиції та переконатися, що це питання буде належно врегульовано."

 GUA_forpol.21.t: "Економічні можливості"
 GUA_forpol.21.desc: "Хоча багато хто очікував, що гватемальська військова хунта займе більш ізоляціоністську позицію, за керівництва генерала Міґеля Ідіґораса Фуентеса нещодавні законодавчі дії, схоже, свідчать про протилежне. Оскільки режим заохочує масову приватизацію, щоб скасувати соціялістську політику, запроваджену ПАР, багато державних підприємств продаються тому, хто запропонує найвищу ціну, а для іноземних корпорацій центральноамериканська держава стала дозрілою для інвестицій.\n\n\nРозвідники в Токіо повідомили, що Сполучені Штати досі не вжили заходів для встановлення зв'язків із правлячою хунтою. Крім того, деякі економісти припустили, що негайне придбання певних гватемальських підприємств, особливо виробників сільськогосподарської продукції, може дозволити Японії закріпитися в регіоні завдяки контролю над значним обсягом споживчого експорту.\n\n\nХоча ця можливість розширити вплив КПС на незвідану економічну зону виявилася прибутковою для спекулянтів, консервативні елементи в Дієті залишаються скептичними щодо витрачання обмеженого японського капіталу на неперевірену концепцію. Оскільки запропонована ініціатива не зустрічає сильної опозиції, адміністрації належить вирішити, чи варта ця можливість того."
 GUA_forpol.21.a: "Мистецтво війни полягає в тому, щоб підривати свого ворога."
 GUA_forpol.21.b: "Непотрібний ризик, пов'язаний із непотрібною інвестицією."

 GUA_forpol.22.t: "Посольство в місті Гватемала"
 GUA_forpol.22.desc: "Хоча кутовий кабінет японського посольства мав кондиціонер, люб'язно наданий корпорацією Hitachi, пан Сакаґучі все одно віял на обличчя маленьким паперовим віялом — уродженець зимового Саппоро, він важко переносив гватемальську спеку. Його дружина сиділа поруч, як належить, приховуючи своє роздратування, тоді як працівник посольства за столом перевіряв якісь папери.\n\n«У мене не вистачило іспанської, щоб сказати тим хуліганам просто забрати наші гроші й залишити нам проїзні документи, розумієте», — люб'язно пояснив Сакаґучі. Він дивувався, як навіть ця затримка не зіпсувала його гарного настрою від відпустки, ба більше, йому навіть подобалася ця незвичність. Його дружина, завжди голос розуму, одразу взяла для них таксі до посольства, і зрештою їм вдалося зупинити одного з численних працівників, які, здавалося, постійно були зайняті.\n\nСакаґучі відчував себе чи не єдиним японцем тут, який перебував не у справах, тоді як чоловіки з портфелями потискали руки й спілкувалися в залі посольства. Імовірно, саме ці чоловіки так завантажували працівників посольства. Сакаґучі все одно не мав чого продавати — він був просто стоматологом, якому добре пощастило цього року. Він спостерігав, як якийсь важливий на вигляд чоловік спускався сходами, а працівники розступалися перед ним, оточений групою вродливих чоловіків і жінок у вишуканих кімоно, і зацікавлено тихо мугикнув.\n\n«Посол і театральна трупа з батьківщини», — пояснив працівник. — «Сьогодні ввечері вони виступатимуть кабукі в одному з великих концертних залів. Ідіґорас — почесний гість».\n\n«Хто?» — запитав Сакаґучі, усе ще розмахуючи своїм маленьким віялом.\n\nПрацівник лише похмуро подивився на нього, так само, як його дружина подивилася на нього позавчора ввечері, коли він танцював сальсу з тією карколомною місцевою дівчиною в барі."
 GUA_forpol.22.a: "Хіба щасливчик не може розважитися у відпустці?"

 GUA_forpol.23.t: "Насування потопу"
 GUA_forpol.23.desc: "ДИРЕКЦІЯ ФЕДЕРАЛЬНОЇ БЕЗПЕКИ\n\nПИТАННЯ: Гватемальська криза\n\nЗВІТ:\n\nПротягом останніх тижнів уряд Гватемали на чолі з Міґелем Ідіґорасом Фуентесом посилив свої звинувачення на адресу Пакту Веракруса та особливо Мексики. Після невдалої висадки Карибського легіону та проваленого повстання МР-13 Гватемала звинувачує Мексику та Кубу в причетності до змов із метою повалення її уряду.\n\nГватемальська військова розвідка вважає, що Дирекція проникла до її лав. Це припущення спричинило чистки в її установах. Перехоплені повідомлення свідчать про зростання параної у вищому командуванні, із конкретними наказами ліквідувати підозрюваних інфільтраторів.\n\nЗвіти з різних джерел підтверджують посилення мобілізації військ поблизу прикордонних переходів. Є докази того, що гватемальський Генеральний штаб обговорює превентивні атаки на мексиканські прикордонні пости.\n\nУ відповідь SEDENA розпочала оборонну підготовку. Позиції поблизу річки Сучіате укріплюються, додаткові війська розгортаються.\n\nВійна видається неминучою й невідворотною. Ми вважаємо, що це буде проста й швидка операція.\n\nЗ повагою, Фернандо Ґутьєррес Барріос"
 GUA_forpol.23.a: "«Негайно передати Президенту»."

 GUA_forpol.24.t: "Ворожі води"
 GUA_forpol.24.desc: "«Хосе, ти перевірив рибальські сіті?» — запитав Хав'єр, його голос ледь було чути за глибоким гуркотом дизельного двигуна «Ла Есперанси». Міцний траулер м'яко погойдувався на тихоокеанських хвилях, а призахідне сонце огортало узбережжя Чіапасу теплими барвами. Навколо інші рибальські човни розсіялися по горизонту.\n\nАле тріск перешкод перервав Хосе. Радіо одного з човнів загриміло попередженням: «Судна наближаються! Гватемальці!» Передача раптово обірвалася, змінившись тріском. Живіт Хав'єра стиснувся. Він вдивлявся в горизонт, доки не побачив їх — три гватемальські патрульні катери, що мчали до флотилії. Хав'єр крикнув Хосе приготувати сигнал, і той кинувся вниз під палубу. Люди на «Ла Есперансі» напружилися, коли патрульні катери наблизилися, їхні грізні корпуси блищали в згасаючому сонячному світлі.\n\nЧерез гучномовець різкий голос наказав: «Зупиніть двигуни, комуністичні покидьки!» Хав'єр підняв руки, показуючи, що підкоряється. Але перш ніж хтось встиг щось зробити, пролунала стрілянина.\n\nКулі прошили корпус і палубу, розщеплюючи дерево та рикошетячи від металу. Хосе, стискаючи ручну рацію, кричав у неї: «На нас напав гватемальський флот! Вони стріляють по нас—» Вибух змусив його замовкнути, коли сусідній човен охопило полум'я. Згори рев двигунів сповістив про прибуття гватемальських бомбардувальників. Вогонь і дим заповнили небо, коли бомби знищували судна, що тікали. Коли напад закінчився, море моторошно стихло, вкрите уламками та обвугленими рештками рибальського флоту.\n\nТого вечора президент [GetLeader] звернувся до країни, його голос тремтів від люті: «Сьогодні невинні мексиканці загинули в неспровокованому й боягузливому акті агресії», — заявив він. «Гватемала обрала війну, і ми зустрінемо її на полі бою. Справедливість буде швидкою»."
 GUA_forpol.24.a: "«І кров нашого народу буде помщена»."

 GUA_forpol.25.t: "Перетин межі"
 GUA_forpol.25.desc: "«Скільки ще ми маємо залишатися в цих клятих, богом забутих джунглях?» — бурчав рядовий Рамон Ортега, відганяючи невпинних комарів. Мексиканські солдати 7-го піхотного батальйону тулилися у своєму джунглевому укріпленні біля річки Сучіате. Постійне дзижчання комах і далекий шум води були єдиними звуками, доки раптовий різкий тріск стрілянини не розірвав ніч.\n\n«Контакт! Контакт!» — крикнув Рамон, перш ніж кулі розбризкали його мозок по багнюці. Гватемальські сили ринули з підліску, їхній камуфляж ідеально зливався з темними джунглями. Сержант Алехандро Крус віддавав накази, його голос залишався твердим навіть тоді, коли навколо запанував хаос. «Тримати лінію!» Мексиканці, загартовані роками підготовки, швидко відреагували. Мішки з піском та кулеметні позиції давали певне укриття, коли вони відкрили вогонь у відповідь зі своїх потертих гвинтівок по гватемальцях, що невблаганно наступали.\n\nДо світанку колись чисті води Сучіате були забарвлені змішаною кров'ю солдатів обох сторін.\n\nВідповідь була швидкою та рішучою. До середини дня Сьюдад-Текун-Уман, Ель-Кармен, Токіан-Ґранде, Сібіналь та інші міста лежали в руїнах, перетворені на тліючі уламки під невпинними мексиканськими авіаударами. Цілі громади були знищені в спробі паралізувати логістику Гватемали, не залишивши жодного складу боєприпасів чи центру постачання. Вулиці, що колись вирували життям, тепер були заповнені уламками та тілами цивільних.\n\nТим часом у Генеральному штабі в місті Мехіко генерал Хосе Аґустін Олачеа Авілес стояв на чолі столу. Генерал Марселіно Ґарсія Барраґан сидів поруч із ним. Звіти були розкидані по столу, кожен похмуріший за попередній. «Вони хотіли цієї битви», — гаркнув Олачеа, вдаривши кулаком по столу. «І ми її їм дамо. Жодного відступу. Жодної пощади»."
 GUA_forpol.25.a: "Барраґан кивнув. Тепер місця для миру не залишилося."

 GUA_forpol.26.t: "За ким дзвонить дзвін"
 GUA_forpol.26.desc: "Посол Джон О. Белл зазвичай уже спав у цей час, але сьогодні він сидів у своєму кабінеті в місті Гватемала й гарячково намагався скоординувати американську відповідь на кризу між Гватемалою та Мексикою. Не те щоб він міг заснути, навіть якби спробував, адже натовп протестувальників за межами посольства палив американські прапори й вимагав його голови. Він радів, що вікна зроблено з армованого скла, але сидів далі від вікна, ніж зазвичай, про всяк випадок.\n\nІдіґорас був цілком некерованим. Його останні дії довели поза всяким сумнівом, що він був неконтрольованою гарматою, абсолютно непридатною для просування американських інтересів у регіоні. Звісно, Белл знав це вже кілька місяців, але великі цабе в Державному департаменті просто не хотіли слухати. Усього цього безладу можна було б уникнути, якби вони допомогли привести до влади когось відповідальнішого, меншого шабельного самодура-диктатора. Когось, хто справді міг би керувати країною, не налаштовуючи все населення проти Америки, і хто не намагався б урятувати власну репутацію, капітулюючи перед цими суспільними настроями.\n\nГучний удар вирвав Белла з його роздратованих думок. Павутиння тріщин розійшлося по вікну його кабінету там, де в нього влучила цеглина. Охоронці біля входу до посольства щось закричали, перш ніж постріли — сподіваємося, лише попереджувальні — прорізали галас бунту й на мить його стихли. Він обережно рушив до свого столу, сподіваючись уникнути нових снарядів, і підняв слухавку. Він був надто глибоко занурений у безлад, який Державний департамент сам накликав на себе своєю зарозумілістю та невіглаством. Їм потрібно було дати зрозуміти їхню провину..."
 GUA_forpol.26.a: "...і, сподіваємося, доправити його в безпечне місце."

 GUA_forpol.27.t: "Ліве повстання"
 GUA_forpol.27.desc: "«Ну, там було спекотно, страшенно спекотно», — сказав Йон Соса по радіо, намагаючись охолонути в халупі, яку його бригада називала табором. Це не допомагало. «Маленька будівля, яку ви сказали нам здійснити рейд, пограбувати чи що там... Це мало бути легко, там було лише п'ятеро чи близько того людей, може, одна-дві гармати. Нічого, з чим не впоралася б бригада лівих визволителів, які постійно б'ються між собою, називаючи одне одного фашистами, іноземними підлизами чи ще якось».\n\n«Щойно Ґабріель увійшов, йому вистрілили в груди, а потім Маркосу — у живіт. Ортега застрелив клерка з тією зброєю, а потім погнався за іншим урядовцем. Вона завернула за ріг і отримала удар молотком по голові, а потім Ґабріель, той інший, якого не підстрелили першим, пішов ззаду. Я застряг, стріляючи в когось, хто ховався за рогом, виявляється, у них була друга зброя, або вони просто підхопили першу з підлоги. Більшість хлопців там убив Ґабріель. Ми забрали звідти кілька документів, вони можуть бути важливими».\n\nГолос у радіо втрутився: «Напевно, ні. Суть у тому, що офіс було спалено. Ви ж спалили його, правда?» Соса продовжив: «Так, ми спалили, але двоє людей загинули, а Маркос стікає кров'ю в цій халупі».\n\nРадіо замовкло, Йон Соса сидів в очікуванні відповіді оператора. Важке дихання Маркоса та дзижчання комах тепер були єдиними звуками в халупі.\n\n"
 GUA_forpol.27.a: "«Просто... повертайтеся на базу, подивимося, чи зможемо допомогти Маркосу»."
 GUA_forpol.27.b: "«За день до вас приїде вантажівка, вона матиме припаси, прямо з Мексики»."

 GUA_forpol.28.t: "Дешева балаканина"
 GUA_forpol.28.desc: "На превеликий шок її союзників і обурення її сусідів Мексика офіційно оголосила про умиротворення всіх гватемальських сил та успішну окупацію міста Гватемала після короткої революції, яка захопила контроль над урядом Гватемали. Розриваючись між революційними силами та іноземними солдатами, режим мало що міг зробити, коли мексиканські війська з Чіапаса та Кампече ринули до центральноамериканської держави й придушили повстання, перш ніж воно встигло розгорітися.\n\nРеакція Вашинґтона та Куби була помітно стриманою, хоча багато мешканців Гавани засудили дії Мексики як не що інше, як «акт імперіалізму». Незалежно від міжнародної реакції, Гватемальська Революція зазнала насильницького кінця, а на її місці постала інша революція — мексиканського зразка та устрою."
 GUA_forpol.28.a: "Одна закінчується, інша починається."

 GUA_forpol.29.t: "Точка неповернення"
 GUA_forpol.29.desc: ""Країна не похитнеться й не пробачить! Я можу запевнити наших відважних захисників мексиканського суверенітету, що їхній уряд не терпітиме фашистської агресії, і жодних дипломатичних боягузливих вчинків не буде! І я обіцяю вам, мої співгромадяни, що не спочину, доки цю загрозу не буде знищено, доки за наш народ не буде помщенося і доки не буде відновлено мир! ¡Viva la Revolución! ¡Viva México!" Слова Ордаса відлунювали площею, зустрічаючи громові оплески зібраного натовпу. Національне звернення завершилося, але в Національному палаці лють Його Високоповажности все ще кипіла.\n\nУсередині зали панувала напружена атмосфера. Першим заговорив Луїс Ечеверрія, міністр внутрішніх справ. «Ми мусимо діяти швидко, Ваша Високоповажносте. Зухвалість Гватемали не можна залишити без відповіді».\n\nГенерал Марселіно Ґарсія Барраґан погоджено кивнув. «Армія завдасть рішучого удару. Ми забезпечимо кордон і рушимо на місто Гватемала». Ордас сів на стілець, його виснаження на мить приховала лють. «Добре. Генерале Барраґан, ваш наказ — поставити їх на коліна. Жодних напівзаходів. Ми замінимо хунту Ідіґораса урядом, який поважає порядок».\n\n«Зрозумів, Ваша Високоповажносте», — відповів Барраґан. «Ми прагнемо швидко й жорстоко нейтралізувати їхню здатність до тривалого опору».\n\nЕчеверрія нахилився вперед. «А американці, Ваша Високоповажносте? Із Вашинґтона ми чуємо лише мовчання».\n\nОбличчя Ордаса потемніло, щелепа напружилася. «Вони дозволили цьому статися. Чи через некомпетентність, чи навмисно — я скоро дізнаюся».\n\nЗа межами кімнати Антоніо Каррільйо Флорес готував заяви, щоб об'єднати Пакт Веракруса проти спільної загрози та засудити Гватемалу в ОАД. Жереб було кинуто:"
 GUA_forpol.29.a: "Війна була не просто неминучою — вона вже почалася."

 GUA_forpol.30.t: "Військова кімната"
 GUA_forpol.30.desc: ""Досить промовисто, Ваша Високоповажносте", — сказав Алеман, — "Televisa транслюватиме це щогодини—"\n\n"Добре", — різко відповів Салінас, — "А тепер ти й Кампос Салас передайте цього листа", — він розмахував написаним власноруч листом, — "нашим японським та американським інвесторам. Я не дозволю боятися вашинґтонському маленькому фашисту знищити наш проєкт".\n\nАлеман кивнув і жестом запросив Кампоса Саласа пройти з ним до однієї з прилеглих кімнат Національного палацу. Наступним із хаосу гуркоту друкарських машинок та помічників вийшов Рейес Еролес. Голова партії був лаконічним: «Партія та громадськість цілком вас підтримують. Генеральний секретар Веласкес запропонував повну підтримку мексиканських робітників. За десять хвилин я зустрічаюся із сенатором Мадрасо, щоб обговорити, як його група може підтримати воєнні зусилля».\n\nІ з цим він пішов, поступившись місцем Ґутьєрресу Барріосу та дель Росалю. Генерал дель Росаль заговорив, а його колега мовчки погоджувався: «Коротко кажучи, ми заблокуємо порти, переріжемо їхню південну логістику, а потім завдамо хірургічного удару по місту Гватемала, щоб повалити уряд. З огляду на географію, подальша окупація країни буде складною, але рішуча сила зараз мінімізує втрати та витрати».\n\n"Дійте", — сказав Салінас, піднімаючи слухавку чорного телефону, — "Я очікую повного звіту сьогодні після обіду". Ґутьєррес Барріос затримався на мить, поклавши перед президентом звіт. Салінас устиг прочитати лише заголовок: «Попередньо: жодних доказів підтримки атаки Ідіґораса з боку США», але його губи вже скривилися, коли на лінії з'явився Марґаїн.\n\n"Очікую майже одностайної підтримки в Організації американських держав, коли о 12-й виступлю із засудженням. Ще більш дивовижною є масштабність реакції Сфери спільного процвітання, Японії та Ман—""
 GUA_forpol.30.a: ""Війна виявляє наших друзів", — зауважив Салінас, дивлячись на звіт, — "так само як і наших ворогів.""

 GUA_forpol.31.t: "Перетин Усумасінти"
 GUA_forpol.31.desc: "Помічник притримав двері відчиненими для Карлоса Мадрасо, коли той увірвався до конференц-зали в супроводі Ечеверрії та його темних окулярів. Ґутьєррес Барріос і Карденас, уже отримавши свої виклики, сиділи за великим столом. Вони підвелися, щоб привітати Його Високоповажність. Він не звернув на них уваги, крокуючи до свого місця. «Панове», — сказав Мадрасо після довгої, пронизливої паузи, — «ми у стані війни». Ніхто не заговорив, лише кивки. Президент щойно повернувся до Лос-Пінос, куди його доправили лімузином після полум'яної промови на Сокало, яку транслювали по всій країні саме тоді, коли надійшли новини про вторгнення. Сівши на чолі столу, міцно зчепивши руки від обурення, він продовжив.\n\n"Іноземні держави завжди намагалися підірвати нас, але це? Вони переступили межу!" Мадрасо постукав кісточками пальців по дубовому столу. Ечеверрія кивнув, коротко поглянув на Барріоса та Карденаса й додав своє «правильно, правильно!». Звісно, він знав, що президент помиляється, і просто дозволяв усій цій антиімперіалістичній риториці запаморочити йому голову. Ідіґорас був лише неконтрольованим гравцем — але йому було вигідно підживлювати параною Мадрасо. Циклон підвівся, потер скроні й вибачився, посилаючись на терміновий телефонний дзвінок міністрові Ґарсії Роблесу. ОАД і Пакт Веракруса мали бути мобілізовані.\n\nКарденас, Ґутьєррес Барріос та Ечеверрія залишилися обговорювати подробиці сухопутної війни, причому останній поправляв темні окуляри, поки старий революціонер говорив. «Наші збройні сили були значно модернізовані останніми роками, тож не повинно виникнути труднощів у веденні звичайної битви з гватемальськими силами. Проблема полягатиме в забезпеченні мирної окупації після їхньої капітуляції. Однак ми маємо впоратися».\n\nЕчеверрія кивав, але знав, що це не буде легкою прогулянкою."
 GUA_forpol.31.a: "Буде кров."

 GUA_forpol.32.t: "Наш чоловік у Гавані"
 GUA_forpol.32.desc: "Директор Ґутьєррес Барріос чекав, поки оператор з'єднає його, недбало тримаючи сигарету між пальцями. «Алло?»\n\n"Фернандо. Не можу сказати, що це мене дивує. Ти сказав мені кілька місяців тому, що війна станеться рано чи пізно». На іншому кінці лінії запала пауза. «Ти також чудово знаєш, що це більше, ніж політика. Це особисте. Хороші люди загинули, коли вони розгромили Легіон, і я не маю наміру дозволити їхнім жертвам бути марними».\nҐутьєррес Барріос кивнув сам до себе. «Ми можемо розраховувати на твою підтримку, звісно?»\n\nЩе одна пауза. «Тобі навіть не треба питати, мій друже. Я мобілізував флот, щоб встановити повну блокаду Атлантичного узбережжя, у нас є люди, які прямують до Чіапаса, і ще більше людей прибуде морем до кордону з Гондурасом. Їм кінець».\n\n"А Легіон допоможе?"\n\nКастро протяжно, іронічно засміявся."
 GUA_forpol.32.a: ""Вони будуть там, щоб завершити справу.""

 GUA_forpol.33.t: "Разом проти реакції"
 GUA_forpol.33.desc: "Згідно з умовами Пакту Веракруса, Сальвадор було покликано до війни проти Гватемали. Попри недавню нестабільність, схоже, правляча хунта прагне підтвердити свою відданість регіональній безпеці та самому Пакту. Сальвадорська армія, флот і військово-повітряні сили, мобілізовані на кордонах Гватемали, розпочали свої «раптові» атаки проти диктатури, змусивши її вести війну на два фронти.\n\nКораблі вже зайняли позиції, а західне узбережжя Гватемали повністю заблоковане; інтенсивно бомбардується місто Гватемала. Сальвадорські літаки можна побачити в повітряних боях із противником по всьому фронту, відтягуючи додаткові ресурси від здатности військової держави воювати з Мексикою."
 GUA_forpol.33.a: "Новий союзник проти безумства."

 GUA_forpol.34.t: "Не знати спочинку"
 GUA_forpol.34.desc: "Попри виснаження, якого зазнала Домініканська Республіка після недавнього повалення режиму Трухільйо, країна прийняла заклик до війни проти Сальвадору. Хоча вибору було мало, оскільки це було положенням Пакту Веракруса, її внесок у воєнні зусилля буде неоціненним. Хоча країна не може надати значної допомоги, її військово-повітряні сили та флот уже рухаються, щоб посилити кубинські сили в Карибському морі.\n\nРазом із цим загони Легіону всередині Домініканської Республіки починають повторну мобілізацію, щоб протистояти іншій фашистській загрозі. Усі їхні приготування — заради ще однієї висадки..."
 GUA_forpol.34.a: "Ще одне узбережжя для визволення."

 GUA_forpol.35.t: "З обох Америк..."
 GUA_forpol.35.desc: "Попри попередні сумніви, особливо через відстань, Каракас вирішив відповісти на заклик і виконати умови Пакту Веракруса. Хоча він не відіграватиме значної військової ролі в операції проти Гватемали, його дипломатична вага в ОАД неоціненна. Крім того, Венесуела пообіцяла надати значну економічну допомогу та допомогу у відбудові окупованої Гватемали після завершення війни."
 GUA_forpol.35.a: "...Лунає клич антифашизму."

 GUA_forpol.36.t: "¡Juntos Luchamos Por Victoria!"
 GUA_forpol.36.desc: "У міру того як кожна збройова фабрика виробляє дедалі більше боєприпасів, кожен чоловік вступає до війська, а всі, хто виступає проти реакції, енергійно марширують, картина подій у Центральній Америці стає дедалі яснішою: весь Пакт Веракруса об'єднався проти диктатури Гватемали. Режим обложений з усіх боків, його майбутнє похмуре, а революційна коаліція спрямовує свій погляд на державу.\n\nХоча війна ще не завершилася, ця дипломатична єдність і військова завзятість свідчать про наближення перемоги антифашизму по всій Латинській Америці.\n\nПроте демонстрація сили викликає занепокоєння у поки що стриманих Сполучених Штатів Америки, коли нова висхідна сила Мексики розправляє крила власного орла. Інші реакційні режими, особливо Нікарагуа, висловлюють лише страх перед новим станом речей."
 GUA_forpol.36.a: "Реакції не буде місця в Новому Світі."

 GUA_forpol.38.t: "Звіт про ситуацію в Гватемалі"
 GUA_forpol.38.desc: "RESTRICTED/CONFIDENTIAL/SECRET/TOP SECRET/[?global.date.GetDateStringNoHourLong]\n\nВІД: ДИРЕКТОР ФБР ДЖ. ЕДҐАР ГУВЕР\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: «ЧЕРВОНА» ГВАТЕМАЛА; ПОВЕРНЕННЯ ПЕРСОНАЛУ ПОСОЛЬСТВА США\n\n1. Після завершення боїв між урядовими та повстанськими силами в місті Гватемала евакуйований персонал повернувся до посольства США та відновив роботу, а також було здійснено перші кроки для встановлення відносин між Сполученими Штатами та новим лівим режимом. Персонал посольства на місці повідомляє, що будівля та територія здебільшого не постраждали, попри близькість до урядових центрів міста; ймовірно, повстанцям було наказано не пошкоджувати власність США.\n\n2. Перемога повстанців над урядом Ідіґораса безсумнівно стала результатом зовнішньої підтримки з боку Республіки Куба через Карибський легіон (у складі якого досі є навчені США ветерани операцій проти режиму Трухільйо на Еспаньйолі) та Сполучених Мексиканських Штатів. Кубинський та мексиканський уряди, очевидно, протягом кількох місяців спільно планували й організовували операцію з повалення уряду, орієнтованого на США.\n\n3. Лідери повстанців, як-от Марко Антоніо Йон Соса з відомої партизанської групи МР-13, заявили, що новий режим матиме соціялістичний характер, наголошуючи на національному суверенітеті, підтримці профспілок та націоналізації промисловости й орієнтуючись на Кубинську Революцію. Через значний вплив американського бізнесу в країні саме він, імовірно, стане головною мішенню нового уряду. United Fruit Company повідомила, що в деяких районах уже розпочалися захоплення земель. Водночас революціонери не налаштовані вороже до дипломатії США."
 GUA_forpol.38.a: "Хитрий трюк, але навряд чи варто здіймати через це галас."
 GUA_MEX_Alignment: "§F§&Гватемальську§! §sНаціоналістичну хунту§! було усунуто. Новий §VСоціялістичний§! режим відійде від §QОВН§! та тісніше приєднається до §KВеракруса§! §VПакту§!."

 GUA_forpol.41.t: "Звіт: операції ФБР у окупованій Мексикою Гватемалі"
 GUA_forpol.41.desc: "-СЕКРЕТНО-\n\nПісля гватемальського вторгнення до Мексики та подальшого оголошення Мексикою війни колишній президент Гватемали Міґель Ідіґорас Фуентес почав дистанціювати свій уряд від Сполучених Штатів та проамериканських діячів, посилаючись на підтримку США Мексики. Хоча деяким мережам ФБР вдалося пережити цю чистку, багато цінних агентів було усунуто від справ, скомпрометовано, вислано або ув'язнено.\n\nПісля подальшого краху уряду Ідіґораса робота ФБР у Гватемалі була ще більше порушена. Хаотичні умови на місцях і розпад адміністрації призвели до того, що різні агенти втратили свою корисність або зникли в умовах широкомасштабного насильства та суспільних потрясінь.\n\nОднак після капітуляції гватемальської армії та встановлення мексиканської адміністрації з відбудови під керівництвом генерала Ерменехільдо Куенки Діаса ФБР почало інтенсивно відновлювати місцеві розвідувальні активи та розширювати мережі, досягнувши наразі значних успіхів. Мексиканська адміністрація здебільшого була зайнята підтриманням порядку та відбудовою місцевих інституцій, дозволяючи розвідувальній роботі безперешкодно продовжуватися. Хоча розширення мереж до довоєнного рівня потребуватиме певного часу, значних труднощів не очікується.\n\nПерші повідомлення від наявних джерел свідчать, що влада з відбудови спробує закріпити Гватемалу у сфері впливу Мексики та інтегрувати її до так званого «Пакту Веракруса» і відповідного економічного блоку за співпраці Куби. Подальші плани можуть включати створення партійно-державного апарату, подібного до апарату мексиканської Інституційно-революційної партії, та узгодженого економічного розвитку.\n\n-Урізано задля стислости-"
 GUA_forpol.41.a: "Поширення революції, еге ж?"

 GUA_forpol.42.t: "МЕМОРАНДУМ ПРО АМЕРИКАНСЬКУ ПРИСУТНІСТЬ У ГВАТЕМАЛІ"
 GUA_forpol.42.desc: "МЕМОРАНДУМ ДЛЯ: Відділу TS, Маямі\nТЕМИ:\n1. Мексиканська політична відбудова\n2. Інтереси США\n3. Майбутнє\n\n1. Гватемала тепер функціонує як продовження мексиканської влади. Суверенітет скомпрометовано на багатьох рівнях управління. Хоча виконувач обов'язків мера міста Гватемала та ймовірний кандидат у президенти Мануель Колом Арґета має справжню народну підтримку, під час свого вигнання він розвинув широкі зв'язки з мексиканськими академічними та політичними колами. Додаткових призначених посадовців зі значними зв'язками з Мексикою, ідеологічними чи іншими, наведено в Додатку 1.\n\n2. Мексика мало вплинула безпосередньо на інтереси США в країні. Хоча вплив США було зменшено, наша присутність у бізнесі — якщо не враховувати воєнні перебої — майже не зазнала втручання. Представники, які зустрічалися з новими посадовцями, підтвердили, що планів виступати проти американських частин економіки немає. Посадовцям, які зберегли свої посади, гарантовано підтримку продовження впливу США.\n\n3. Присутність США в Гватемалі значно скоротилася, але мексиканський уряд продемонстрував політику поступливости та обережности щодо американських активів. Політичний вплив зменшився; слід розглянути заходи для відновлення певної політичної присутности.\n\nПідпис: BF, відділ у місті Гватемала"
 GUA_forpol.42.a: "Вірність, відвага, чесність"

 GUA_forpol.48.t: "Звіт про Гватемалу"
 GUA_forpol.48.desc: "RESTRICTED/CONFIDENTIAL/SECRET/TOP SECRET/[?global.date.GetDateStringNoHourLong]\n\nВІД: ДИРЕКТОР ФБР ДЖ. ЕДҐАР ГУВЕР\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: СТАН РЕЖИМУ АРАНИ В ГВАТЕМАЛІ\n\n1. Уряд Карлоса Арани Осоріо після свого встановлення продемонстрував себе як надійний партнер американських інтересів у країні, причому правляча хунта поглиблює зв'язки з військовими США, United Fruit Company, іншими американськими бізнес-інтересами та самим ФБР. Сили безпеки президента Арани проводять інтенсивну кампанію придушення соціялістичних та антиамериканських сил.\n\n2. Режим Арани зазнав критики міжнародної преси, а дедалі меншою мірою — внутрішньої преси, за жорсткий підхід до придушення інакомислення; достовірні повідомлення свідчать про незаконні затримання, зникнення, катування та/або позасудові вбивства осіб, серед яких продемократичні активісти, прихильники ПРД, профспілкові діячі та інші, кого підозрюють в антиурядових настроях. Відкритість таких методів може негативно позначитися на Сполучених Штатах як головному покровителі Арани. На уряд Арани можна вплинути, щоб він скоротив або приховав надмірні репресії з міркувань іміджу.\n\n3. United Fruit Company та інші скористалися приватизацією земель, конфіскаціями та більш приязним до бізнесу ставленням Арани порівняно з попереднім урядом ПРД, щоб розширити свою діяльність у Гватемалі, досягнувши рекордних прибутків. Американські компанії помічають, що Гватемала є сприятливим ринком завдяки пом'якшеним трудовим законам, експортно-орієнтованій економіці тощо. Подальше заохочення цього сектору принесло б економічну користь обом країнам.\n\n"
 GUA_forpol.48.a: "Якщо вже мусите робити такі речі, робіть це тихо, заради Бога."
 GUA_forpol.48.b: "Годі співчувати. Збирайте банани."

 GUA_forpol.49.t: "Тріумф 44-го"
 GUA_forpol.49.desc: "Ранок на контрольно-пропускному пункті був нудним. Максимо заступив на раді чергування, отримавши завдання через регулярні проміжки часу розмовляти з владою по той бік гватемальського кордону. Вони мали вийти на зв'язок саме тоді — але минула хвилина. І ще одна. І ще одна. Він перемкнув частоти. Нічого. Потім почув метушню, крики й гамір надворі, тож вискочив зі свого поста. Його колеги всі юрмилися біля сітчастого паркану, за яким чорний дим здіймався над горизонтом. Гриміла артилерія. Хтось закричав: «Вони всі б'ються між собою! Це почалося!»\n\nА потім настав день у Лос-Пінос, і минуло вже кілька годин відтоді, як з'явилися новини про путч у місті Гватемала. Лопес Матеос знову сидів за своїм столом із червоного дерева, знову вислуховуючи доповідь директора Ґутьєрреса Барріоса, генерала Барраґана та інших близьких радників.\n\n"Ідіґораса затримано, Арбенс обійняв посаду президента, як і планувалося. Жодного іноземного втручання. Просто ще один день в офісі, ліценсіадос". Президент тихо хихикнув, і вони, звісно, відповіли тим самим. Це був чудовий день роботи.\n\nБарріос поступово перестав усміхатися. «Перш ніж ви напишете ті листи підтримки, Ваша Високоповажносте, це може стати проблемою, якщо або коли новий уряд почне рухатися вліво...»\n\nЛопес Матеос відчув, як його радість змінилася неоднозначністю. Він похитав головою та махнув рукою. «Надішліть мені пізніше звіт зі своїми рекомендаціями. На цьому поки що закінчимо». Коли всі вони рушили через подвійні двері, він потягнувся до своєї авторучки та чистого аркуша паперу.\n\nШановний Ваша Високоповажносте, Хакобо Арбенс..."
 GUA_forpol.49.a: "Тріумф для бідних і знедолених усюди."

 GUA_forpol.51.t: "Випробування меж"
 GUA_forpol.51.desc: "Рамон сидів на ґанку маленького кафе, пильно стежачи за набережною. Сьюдад-Ідальґо було невеликим містечком, значно менш вражаючим, ніж можна було б припустити з його ролі воріт до Північної Америки. Його вулиці та крамниці зазвичай були тихими й сонними, попри те, що тут проходило все: від іммігрантів, які шукали кращого життя, до зброї, здатної це життя обірвати. Робота Рамона на американську розвідку теж була тихою, але принаймні вона оплачувала рахунки.\n\nЗазвичай, принаймні. Сьогодні головна вулиця Сьюдад-Ідальґо була сповнена метушні та солдатів, що поспішали. Здавалося, невеликий гарнізон міста мобілізували в повному складі до місця, де вулиця переходила в річку Сучіате, де білий канонерський човен наводив гармати просто на Рамона. Він щосили намагався зберігати байдужий вираз обличчя, але ставало дедалі важче пити каву перед гарматою, здатною рознести цей хисткий ґанок на друзки. Він прикусив губу й продовжив сидіти. Йому потрібно було побачити, чим усе це закінчиться.\n\nНарешті стара мексиканська бронемашина загуркотіла до берега річки. Офіцер визирнув із машини, тримаючи мегафон так, наче той міг прогнати небажаного порушника. «GC-505, ви перетнули міжнародний кордон і тепер перебуваєте на території Мексики без дозволу чи причини. Відійдіть назад на гватемальський бік кордону, перш ніж ми будемо змушені відкрити вогонь. Це ваше останнє попередження».\n\nРамон важко ковтнув, поки човен стояв на місці цілу вічність, як йому здавалося. Вони ж не збиралися стріляти, правда? Він майже вирішив утекти, коли корабель почав віддалятися річкою, назад до свого боку кордону. Щойно він опинився на гватемальській території, люди на борту демонстративно підняли гвинтівки й вистрілили в повітря. Якомога недбаліше підвівшись, Рамон заплатив за каву й пішов додому."
 GUA_forpol.51.a: "Янкі захочуть про це почути."
 GUA_forpol_51_tt: "Заради нашого — та §wUFC§! — впливу в §<Гватемалі§! ми повинні намагатися не загострювати §Rнапруженість§! ще більше.\n§gКраще пильно стежити за цією ситуацією.§!"

 GUA_forpol.52.t: "Профіль режиму ПРД" #Обмежені зміни для лору
 GUA_forpol.52.desc: "ДИРЕКЦІЯ ФЕДЕРАЛЬНОЇ БЕЗПЕКИ\nТЕМА: Профіль адміністрації Хакобо Арбенса\n\nДо адміністрації Арбенса вплив гватемальської революції фактично обмежувався міськими районами. Президенти Аревало та Мендес покращили умови праці та розширили політичні свободи відповідно до своєї опори на профспілки та студентів, але уникали істотних змін у сільській місцевості, де панували реакційні землевласники та домінувала United Fruit Company.\n\nПісля того як остання підтримала невдалий переворот проти нього, полковник Арбенс обрав протилежний курс, зробивши сільську реформу визначальною рисою свого президентства. Місто Гватемала прискореними темпами просуває пропозиції щодо перерозподілу земель та захисту праці ладіно й селян-мая, тоді як власники плантацій і United Fruit намагаються перешкодити їхньому виконанню за допомогою найманих головорізів та правих воєнізованих формувань, як-от Рух організованої націоналістичної дії (МАНО).\n\nУ цій гарячковій атмосфері нещодавнє проникнення озброєних гватемальських військ через кордон могло бути спробою полковника Арбенса зміцнити свою підтримку у війську або спробою військових противників дискредитувати президента. У будь-якому разі Арбенс через таємні канали звернувся до Куби по допомогу в галузі безпеки. Через наші контакти в ОКАЕ ми намагаємося визначити, чи це маневр для розколу Пакту Веракруса, справжня відповідь на внутрішню нестабільність чи спроба здобути перевагу в потенційному конфлікті з Мексикою.\n\nЗ глибокою повагою,\nФедеральний директор безпеки\nПолковник Ранґель Ескамілья"
 GUA_forpol.52.a: "Я не ризикуватиму єдністю Веракруса через гватемальські витівки. Просто стежте за ситуацією."
 GUA_forpol.52.b: "У Гавані достатньо інших радикалів, яким можна допомогти. Скажіть Фіделю триматися подалі від Гватемали."
 GUA_forpol.52.c: "Пустіть кубинців і змусьте їх розповісти нам, що, в біса, роблять гватемальці."

 GUA_forpol.53.t: "МЕМОРАНДУМ ПРО УПРАВЛІННЯ ГВАТЕМАЛОЮ ПІСЛЯ ВИБОРІВ"
 GUA_forpol.53.desc: "МЕМОРАНДУМ ДЛЯ: Відділу TS, Маямі\nТЕМИ:\n1. Вибори 1962 року\n2. Ставлення до США\n2. Американська присутність після виборів\n\n1. Вибори поновили мандат ПРД на чолі з Хакобо Арбенсом, тоді як консервативна ПНДП не змогла похитнути її домінування в гватемальській політиці. Попри те, що параноя зберігається, схоже, усі загрози організованого підриву уряду минули. Адміністрація Арбенса, ймовірно, продовжить ліві політики попередніх урядів.\n\n2. У попереднє десятиліття режим ПРД дотримувався політики обережних відносин і, схоже, продовжить цей курс. Попри відсутність антиамериканської спрямованости, слід зберігати розумну дистанцію.\n\n3. Не очікується, що Арбенс спробує здійснити цілеспрямовану кампанію проти американського впливу в політиці, оскільки нинішній стан ФБР оцінюється як стабільний. Однак параноя всередині держави не виключає можливости того, що ПРД може провести кампанію проти іноземних інтересів після невдалої спроби перевороту. Більше занепокоєння викликає економіка: присутність США є відомим джерелом суперечок у ПРД, що конфліктує з її більш соціялістичними політиками. Поєднання параної та зменшення внутрішнього опору робить можливими дії проти американської промисловости та капіталу.\n\nПідпис: BF, відділ у місті Гватемала"
 GUA_forpol.53.a: "Вірність, відвага, чесність"

 GUA_forpol.54.t: "Невдала спроба вбивства гватемальських повстанців"
 GUA_forpol.54.desc: "[GetDateText]\n\nНе секрет, що ДФС відправила кілька власних загонів до Гватемали для протидії антиурядовим осередкам, але сьогоднішня операція, ймовірно, перейшла межу, яку встановив Арбенс. Хоча його оточення все ще неохоче діє, повідомлена кількість цивільних жертв унаслідок бомбардування кордону означає, що ми не можемо виключати військової відповіді згодом.\n\nДіяльність повстанців у поєднанні із затримкою звіту від ДФС ускладнила встановлення масштабів збитків. Але гватемальці й надалі відмовляються приймати нашу версію про боротьбу з тероризмом і уважно стежать за нашим посольством у місті Гватемала навіть після розчищення зруйнованої території поблизу місця інциденту. Через затримки зв'язку операції ДФС тривали під час евакуації, повного масштабу яких я також не знаю. Попри це, Арбенс вирішив оприлюднити офіційне засудження в El Diario щодо нашого подальшого втручання на території Гватемали.\n\nЯк примітку, я помітив збільшення кількости патрулів у формі в межах міської агломерації, тож моє передбачення може бути небезпідставним. Однак наразі я продовжуватиму вести цей щоденник. Із Сокало надходить небагато інформації, і це найкращий спосіб, який я маю, щоб упорядкувати цей безлад."
 GUA_forpol.54.a: "Боже, допоможи нам, якщо справа коли-небудь дійде до руху танків."

 GUA_forpol.55.t: "Для Вашої Високоповажности,"
 GUA_forpol.55.desc: "Я пишу цього листа особисто й, як, упевнений, Ви можете зрозуміти, приватно, як представник багатьох інших.\n\nЯк Ви знаєте, ситуація на кордоні значно заспокоїлася. Хоча окремі інциденти все ще трапляються, ознак організованих вторгнень чи підривної діяльности стало значно менше. Ми, хто стежить за регіоном, почуваємося безпечніше. Такої ситуації не було роками, і це велике полегшення для всіх, хто служить на кордоні.\n\nАле розвіддані не одностайні. Відсутність у Гватемалі чіткої готовности до дій не означає, що засоби для швидкого розвороту ситуації відсутні. Аерофотознімки демонструють ознаки військових переміщень і приховані сліди, які, хоча очевидно й використовуються, неможливо повністю спостерігати, щоб визначити інтенсивність їхнього використання. Патрулі продовжують діяти поблизу кордону, а джерела у ВПС Гватемали кажуть, що вони залишаються напоготові для розгортання на півночі.\n\nЦе не означає, що розгортання відбудеться або що послаблення напружености є фальшивим, але ми повинні залишатися пильними, щоб це дуже швидко не стало зловісним; надмірна довіра до миру може накликати катастрофу. Я та багато інших наразі закликаємо не йти далі шляхом розрядки, щоб уникнути втягування в співпрацю. З огляду на їхню попередню ворожість, сліпа надія на добросовісність може дозволити їм маніпулювати нами й поставити нас у слабке становище.\n\nЯ та мої люди сподіваємося, що це не так. Ми молимося про інше, але закликаємо Вас подумати заради нас, тих, хто тримає першу лінію оборони: а що, як мир зазнає невдачі? Чи обміняємо ми ефективну оборону на порожні обіцянки? Мексика справедливо відплатить за таку зраду, однак багато моїх людей можуть не дожити до цього правосуддя.\n\nВи не поділяєте віри, яку маємо я та мої люди, але все ж ми молимося, щоб Бог направляв Вас, Ваша Високоповажносте.\nГенерал Хорхе Альвес"
 GUA_forpol.55.a: "Викликати генерала на догану; з огляду на його спроби зірвати співпрацю він має бути вдячний, що це лише догана."
 GUA_forpol.55.b: "Викликати генерала для приватного запевнення; саме це ми й маємо намір зробити."

 GUA_forpol.56.t: "Напруженість спадає"
 GUA_forpol.56.desc: "МЕМОРАНДУМ ДЛЯ: Відділу TS, Маямі\nТЕМИ:\n1. Позиція Арбенса щодо відносин із Мексикою\n2. Поточна американська присутність у Гватемалі\n2. Перспективи подальшого американського проникнення\n\nНещодавній гватемальсько-мексиканський прикордонний інцидент посилив напруженість між Гватемалою та її сусідами. Нова лівонаціоналістична адміністрація на чолі з Хакобо Арбенсом рішуче критикувала правлячу ПРІ Мексики та її кампанію антилівих репресій під час Брудної війни. Попри це, новий уряд звернувся до Мехіко, і відносини значно охололи. Немає жодних ознак того, що це припиниться в осяжному майбутньому.\nПолітика Хосе поки що мало вплинула на присутність США в політичній чи економічній сферах. Див. звіт 4439-1.\nМи перебуваємо в добрій позиції, щоб скористатися покращенням відносин у регіоні в межах Гватемали. Використовуючи наявні активи, ми можемо почати встановлювати глибші, помітніші зв'язки як у війську, так і в адміністрації, чого раніше не можна було робити. Зв'язки у війську допоможуть поглибити наше проникнення в гватемальські військові спроможності, а також політичний вплив, зважаючи на вплив військових на режим. Імовірно, здатність США впливати на політику зросте, якщо докласти відповідних зусиль.\n\nПідпис: BF, відділ у місті Гватемала"
 GUA_forpol.56.a: "Вірність, відвага, чесність"

 GUA_forpol.57.t: "Відчужений сусід"
 GUA_forpol.57.desc: "Над офісом панувала тиша, що разюче відрізнялася від денної метушні. Коридори й кабінети, де зазвичай вирувало життя державних службовців, тепер застигли в нерухомості, напівтемні та приглушені. Зовнішній шум ледве проникав усередину будівлі. Ніщо не ворушилося; тимчасова смерть.\n\nСпокійну тишу порушив кашель.\n\nХосе Сальвадор Ґальястеґі люто закашлявся, усвідомлюючи насильницьке порушення тиші, яке він спричинив. Він сидів за своїм столом, останнім із тих, кого він бачив, хто ще не пішов на ніч. Можливо, десь іще працювали інші самотні душі при світлі ламп, можливо, вони чули його кашель, що лунав коридорами — якщо так, жодна не подала знаку. Кашель припинився, і він потягнувся до кави. Він надто багато працював.\n\nНавколо нього лежало пів дюжини викинутих меморандумів, а друкарська машинка чекала наступної спроби. Поруч лежав повний звіт про нещодавні заяви ПРД на півдні. Засудження Мексики, відмова від антикомунізму, звинувачення ПРІ в політичному гнобленні. Читати це було агресивно. Страшно читати. Думки Хосе звернулися до хлопців на кордоні: невже вони просто зараз мають справу з гватемальськими вторгненнями? З партизанами? Чи допоможе Гватемала тим, хто намагається їх убити? Його думки звернулися до родини, до образу того, як його дітям повідомляють про солдатів, що насуваються на них. Страх стиснув йому горло.\n\nВін зітхнув і знову поклав пальці на клавіші друкарської машинки. До ранку Секретар захоче отримати повний виклад заяв і можливих відповідей, а він не хотів доручати таке завдання комусь іншому. Однак у міру того, як він писав, його страх лише зростав, бо він знаходив у собі дедалі менше пропозицій.\n\nГватемала розривала зв'язки, і він не був упевнений, як Мексика могла їх відновити."
 GUA_forpol.57.a: "Або навіть чи варто це робити."

 GUA_forpol.58.t: "Військові зв'язки"
 GUA_forpol.58.desc: "RESTRICTED/[GetDateText]\n\nВІД ОСТІНА КОРНЕЛЛА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: СТАН АМЕРИКАНСЬКОЇ ВЗАЄМОДІЇ ЗІ ЗБРОЙНИМИ СИЛАМИ ГВАТЕМАЛИ\n\nСпівпраця Гватемали з військовими установами США значно поглибилася останніми роками. Гватемальські офіцери продовжують проходити навчання в американських установах. Так само всі види американських збройних сил утримують об'єкти в країні.\n\nВИСНОВКИ:\n\n- Армія: кілька гватемальських офіцерів проходять навчання у Форт-Беннінґу та Форт-Лівенворті за піхотною доктриною та командною підготовкою.\n\n- ВПС: між обома країнами створено спільні програми розвідки та зв'язку. Американські зв'язкові офіцери розміщені в аеропорту Ла-Аурора.\n\n- ВМС: портові об'єкти в Пуерто-Барріосі розширено для прийому американських суден. Деякі гватемальські студенти вступили до Військово-морської академії США в Аннаполісі.\n\nГватемала фактично стала залежною від американської підготовки та доктрини. Це надає Вашинґтону значний вплив у регіоні. Ми можемо розвивати ці зв'язки далі шляхом подальшого будівництва військових баз і збільшення кількости гватемальських офіцерів у американських військових коледжах."
 GUA_forpol.58.a: "Розширити нашу присутність. Ми збережемо Гватемалу в безпеці."
 GUA_forpol.58.b: "Не варто надто заплутуватися в Гватемалі. Залишити все як є."

 GUA_forpol.59.t: "Будуючи мости"
 GUA_forpol.59.desc: "Тихий гул автомобілів панував уночі, наповнюючи тишу дивно мирним гуркотом. Жовті вуличні ліхтарі надавали Мехіко золотого сяйва, освітлюючи безлюдні дороги, якими ніхто не ходив. У цей час ночі мало хто кудись виходив, життя перемістилося в інші місця й не повернеться ще кілька годин. Відокремлена мить існування, якою мало хто з урядовців міг насолодитися в офісі, і яку Антоніо Мена дуже цінував.\n\nВін сперся на оздоблений край, відчуваючи прохолоду старовинної архітектури шкірою. Гватемала не давала йому спати, як часто й траплялося. У збоченому сенсі це було майже освіжаюче — останніми роками вони принаймні мали когось іншого, про кого треба було турбуватися, крім американців, хоча сьогоднішні роздуми принаймні не були засновані на страхах перед війною.\nВін усе ще тримав телеграму, що спричинила ці роздуми. Із президентського столу надійшла ідея знайти якісь заходи в прикордонних районах, які продемонстрували б гватемальцям добру волю. Як Секретар Гасьєнди, він зрештою відповідав за пошук грошей — відповідальність, яка давала йому вплив на те, яким буде цей задум.\n\nВійськові вже телефонували, тонко натякаючи на будівництво ще більшої кількости прикордонних укріплень. Дешевше, стимул для будівельної економіки та допомога Гватемалі у спільній проблемі дисидентів, які тікають через кордон — без жодної згадки про реакцію гватемальців на сотні додаткових гвинтівок, націлених на них. Також телефонував старий соратник Матеоса, між іншим згадавши інфраструктурний проєкт із гватемальцями, який хотів запустити: фінансування обома урядами будівництва нормальних доріг уздовж кордону. Дорожче, але з довготривалішими вигодами для місцевих економік, не кажучи вже про покращення відносин. Він не згадав, що незабаром цими дорогами можуть користуватися гватемальські танки.\n\nОчевидно, десь у бюрократії точилася ворожнеча, і Антоніо відчував, що його використовують як посередника в ній за допомогою цих зручно приурочених пропозицій. Він зітхнув, обдумуючи все це в тихій темряві. Кого слухати?"
 GUA_forpol.59.a: "Військові найкраще знають, що потрібно для кордону."
 GUA_forpol.59.b: "Бункери не створюють сили, її створюють економіка та відносини."

 GUA_forpol.60.t: "Привид UFC"
 GUA_forpol.60.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nВІД ДЖЕЙМСА КАРВЕРА\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: УСУНЕННЯ ВПЛИВУ UFC УРЯДОМ ПРД\n\nПрезидент Хакобо Арбенс та уряд ПРД у Гватемалі, як і очікувалося, почали скорочувати вплив United Fruit Company на свою країну.\n\nUFC тримає під своїм контролем виробництво фруктів і має значний вплив на гватемальську політику від початку XX століття, коли Семюель Земуррей, президент компанії з 1933 по 1951 рік, організував переворот у країні, щоб зберегти продуктивність бізнесу.\n\nХоча раніше ПРД зосереджувалася на соціялістично-лівих політиках заради своєї профспілкової та студентської бази, полковник Арбенс виступив із амбітною програмою земельної реформи. Імовірна фінансова підтримка UFC невдалої спроби перевороту проти нього в 1962 році, схоже, ще більше радикалізувала його порядок денний. Значні площі земель, оброблюваних UFC, було захоплено. Умови праці в сільській місцевості дедалі суворіше регулюються, а гватемальські операції компанії зазнали карального оподаткування. Спроби UFC домогтися правового захисту були заблоковані порушеннями належної правової процедури адміністрацією Арбенса.\n\nОбізнаність населення про вплив UFC у Гватемалі низька, а серед тих, хто про нього знає, більшість підтримує режим ПРД проти UFC.\n\n"
 GUA_forpol.60.a: "Нам не слід у це втручатися."
 GUA_forpol.60.b: "Вони думають, що можуть залякувати американську компанію?"
 GUA_Sanctions_tt: "§RЦі банани згниють на їхніх складах. Запровадити санкції.§!"

 GUA_forpol.61.t: "Відкласти це"
 GUA_forpol.61.desc: "Кімната бункера була маленькою й затіненою, стіл і дошка ледь уміщалися в ній. Різноманітні чоловіки у формі сиділи й мовчки споглядали дошку під єдиним слабким неоновим світлом, втомлені після довгої подорожі до цієї прикордонної бази, з насупленими бровами й примруженими очима, майже втупленими в карту, що висіла перед ними. Вона не несла добрих новин. Ніколи не несла.\n\nНа карті був зображений гватемальський кордон від моря до моря, з різноманітними шпильками, розставленими біля національного кордону. Майже два десятки — у найбільш сільських районах, де місцевість була складною, а доступ до Мексики легшим. Чотири нових від останньої зустрічі.\n\n«Ліценсіадос, Його Високоповажність, мабуть, доніс до нього», — сказав один із чоловіків, перериваючи свої роздуми, — «що це не може тривати. Це лише табори, які ми знаходимо; імовірно, їх більше. Ми дозволяємо Гватемалі повісити над нами Дамоклів меч».\n\nІнший чоловік підвівся, підійшов до карти й торкнувся пальцями кількох шпильок. Він повернувся до інших. «Якщо ми займемо позицію щодо цього, це ще більше ускладнить ситуацію на кордоні. Ці дисиденти достатньо розумні, щоб наразі не використовувати Гватемалу ні для чого, крім притулку. Якщо ми загостримо ситуацію, і ПРД, і ці дисиденти можуть охочіше діяти звідти, де ми не зможемо легко їм протидіяти. Не кажучи вже про можливість відкритішої підтримки чи навіть—» Він зупинився, бо найгірший сценарій ледве потребував озвучення.\n\nДехто кивнув, перш ніж двері раптом відчинилися і ввійшов помічник. Ніяковіючи, він майже не дивився на начальство в кімнаті, пробурмотівши вибачення. «Що ти тут робиш, рядовий?» — запитав генерал біля карти.\n\nВін мовчки спостерігав, як рядовий встромив у карту ще одну шпильку й пробурмотів, що виявлено ще один імовірний табір."
 GUA_forpol.61.a: ""Ага.""

 GUA_forpol.62.t: "Економічні можливості"
 GUA_forpol.62.desc: "До уваги Ради з перегляду інформації\nРікасуте Кікан\nДодаток: Огляд японської громади емігрантів у Гватемалі\n\n1. Японська громада емігрантів процвітає в Гватемалі. Подолавши початкові мовні бар'єри та культурні непорозуміння, японська громада в Гватемалі виросла й стала невід'ємною частиною професійного класу, часто досягаючи успіху в управлінських та високотехнологічних сферах.\na. Зростання помітности японців, які займають владні посади, посилило їхнє прийняття та інтеграцію в гватемальське суспільство.\nb. Японські управлінські практики стають дедалі популярнішими серед гватемальських підприємств легкої промисловости, а численні бізнес-магнати виявляють зацікавленість у вивченні найкращих практик та впровадженні їх у свою діяльність.\nc. Хоча японські емігранти не мають права працювати на державній службі, обізнані японці досягають успіху як консультанти з питань проєктів для місцевих посадовців і міських планувальників.\n\n2. Ми рекомендуємо, щоб гватемальський уряд можна було залучити до нашої сфери впливу, використовуючи належним чином розміщених японських консультантів, які непомітно спрямовуватимуть уряд за допомогою порад, що забезпечуватимуть нашу подальшу присутність.\na. Розміщувати осіб зі спеціальними регіональними знаннями в районах, де їх можна представити гватемальським державним службовцям. Найкраще проводити знайомства через уже усталених японських емігрантів із бездоганною відданістю та моральною стійкістю.\nb. Агентів слід інструктувати діяти обережно, оскільки близькість сприяє інтересам американської розвідки, а ризик викриття може значно зашкодити зовнішнім відносинам."
 GUA_forpol.62.a: "Успіх у підпільній діяльності походить від щирости."

 GUA_forpol.63.t: "Сакура серед орхідей"
 GUA_forpol.63.desc: "До уваги Ради з перегляду інформації\nРікасуте Кікан\nДодаток: Опис Маленького Токіо, місто Гватемала\n\n1. У міру подальшого розширення японської присутности в Гватемалі невеликий район швидко зріс у розмірах і значенні, утворивши японський етнічний анклав у столиці Гватемали під назвою Маленьке Токіо. У цьому районі переважно проживають японці, які пропонують японські ресторани, сфери обслуговування та, нещодавно, невелике синтоїстське святилище.\na. Район є районом середнього класу, більшість мешканців якого працюють у технічних сферах. Це спричинило значну концентрацію багатства в районі та стимулює значну частину споживчої економічної діяльности міста.\nb. Це багатство призвело до зростання культурного самовираження, появи районних фестивалів і святкувань японських свят.\nc. Відносний добробут японських емігрантів у Гватемалі призвів до того, що японська культура стала взірцем для наслідування серед корінних гватемальців. Місцеві мешканці виявляють значний інтерес до участи в японській культурі, вивчення японської мови та поглиблення зв'язків із Японією.\n\n2. Ми рекомендуємо вважати Маленьке Токіо критично важливим оплотом, який можна використати для просування інтересів Імперії в Гватемалі.\na. Агентів можна розміщувати як нових емігрантів із мінімальною підозрою, оскільки житло та прикриття у вигляді роботи доступні без особливих труднощів.\nb. Район є джерелом м'якої сили, що дозволяє поширювати культурну гегемонію Імперії в Америці.\nc. Підприємства в Маленькому Токіо охоче прийматимуть інвестиції, щоб продовжувати розширюватися та здобувати економічний вплив у Гватемалі."
 GUA_forpol.63.a: "Успіх у підпільній діяльності походить від щирости."

 GUA_forpol.65.t: "Невгасиме світло Гватемали"
 GUA_forpol.65.desc: "RESTRICTED\n\nВІД ДЖОНАТАНА ЛАКСОРА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: НАСЛІДКИ ЗАГАЛЬНИХ ВИБОРІВ У ГВАТЕМАЛІ\n\nПопри постійні чутки про підтримуваний військовими переворот, вибори в Гватемалі 1968 року пройшли без проблем. Оскар Адольфо Міханґос Лопес із Партії революційної дії (ПРД) здобув переконливу перемогу, а міжнародні спостерігачі назвали процес легітимним. Кілька представників ОАД похвалили країну як взірець демократичного дозрівання.\n\nОднак невирішені питання залишаються. Праві офіцери гватемальської армії — багато з яких пройшли навчання у американських зв'язкових офіцерів — висловлюють скептицизм щодо напрямку країни. У казармах ходять чутки, що багато офіцерів, особливо Карлос Арана Осоріо, клянуться відкинути назад «комуністичних терористів» у своїй країні.\n\nБагато цивільних висловлюють обережний оптимізм щодо перемоги на виборах. Спогади про невдалий переворот 1962 року переслідують їх, і хоча багато хто сподівався на перемогу ПРД, вони навчилися поки що не святкувати надто голосно.\n\nПосольство рекомендує негайно підтримати режим ПРД. Ми продовжимо стежити за ситуацією, але мир у Землі вічної весни не безкінечний."
 GUA_forpol.65.a: "Вірність, відвага, чесність."

 GUA_forpol.66.t: "Вибір у Землі вічної весни"
 GUA_forpol.66.desc: "СЕКРЕТНО\n\nВІД ДЖОНАТАНА ЛАКСОРА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: НАБЛИЖЕННЯ ВИБОРІВ У ГВАТЕМАЛІ\n\nВибори в Гватемалі 1974 року, ймовірно, будуть найбільш конкурентними в її історії. У міру продовження демократичної консолідації загроза військового перевороту відступила.\n\nНаближаються праймеріз домінуючої Партії революційної дії, яка керує Гватемалою з 1944 року. Президент Міханґос підтримує Мануеля Колома Арґету, харизматичного та динамічного мера міста Гватемала, як свого наступника. Однак помірковані представники ПРД гуртуються навколо Хуліо Мендеса Монтенеґро, декана Університету Сан-Карлос і брата колишнього президента Маріо Мендеса, як стабілізуючої та про-бізнесової фігури.\n\nОпозиція Гватемали також розділена, хоча готова скористатися дедалі більшими розколами в ПРД. Гватемальська християнсько-демократична партія Рене де Леона Шлоттера, християнсько-соціал-демократична партія, створила електоральну базу серед глибоко релігійного населення мая, якому президенти Арбенс і Міханґос прагнули надати виборчі права. Протистоїть їй Рух національного визволення — права організація, підтримувана плантаторами, зокрема United Fruit Company. Маріо Сандоваль Аларкон змінив тактику на електоральну, але також використовує воєнізовані формування групи для забезпечення голосів через залякування та фальсифікації.\n\nІ Мендес, і де Леон висловлювали про-ОВН настрої, тоді як Сандоваль готовий співпрацювати з американським бізнесом."
 GUA_forpol.66.a: "Шанс пом'якшити ПРД надто добрий, щоб його втрачати. Спрямувати фінансування Мендесу."
 GUA_forpol.66.b: "Християнська соціял-демократія може зцілити розколи Гватемали. Опублікувати пропаганду ГХД."
 GUA_forpol.66.c: "Дешевші банани, дешевша кава, щасливіші акціонери. Навчати хлопців РНВ."
 GUA_forpol.66.d: "Гватемала рухається в доброму напрямку. Немає потреби втручатися."
 GUA_forpol_66_tt: "\n§FЧерез величезну популярність §VПРД§!, зумовлену успіхом §<Гватемали§! у переговорах із §*Белізом,§! шанси цієї партії на перемогу на виборах мізерні.§!"

# News events

 GUA_news.1.t: "[Get_newspaper_header]Військовий переворот у Гватемалі"
 GUA_news.1.desc: "Гватемальська армія захопила Палаціо-Верде, випередивши інавгурацію нещодавно обраного полковника Хакобо Арбенса лише на кілька годин. Також повідомляється про смерть колишнього президента Гватемали Маріо Мендеса Монтенеґро. Попри окремі сутички, військові у співпраці з місцевими землевласниками та, за чутками, за фінансової підтримки United Fruit Company, схоже, взяли під контроль усі великі міста та значну частину сільської місцевості.\n\nКонсервативний генерал Міґель Ідіґорас, якого вважають головою нової військової хунти, оголосив про якнайшвидше проведення виборів і висунення власної кандидатури на пост президента. Дотепер домінуючу Партію революційної дії було заборонено, а генерал назвав земельну реформу Арбенса соціялістичною загрозою національній єдности. Міжнародна реакція виявилася неоднозначною: сусідня Мексика рішуче засудила переворот, тоді як США виступили з примирливою риторикою.\n"
 GUA_news.1.a: "Гнилий банан викидають."
 GUA_news.1.b: "Спустошливий удар по національній безпеці."
 GUA_news.1.c: "Коли маєш засоби, немає потреби в показовості."

 GUA_news.2.t: "[Get_newspaper_header]Провалений військовий переворот у Гватемалі"
 GUA_news.2.desc: "Сьогодні в Гватемалі спалахнули нетривалі бої в кількох казармах і на укріплених позиціях, коли лояльним уряду підрозділам було наказано придушити учасників військової змови, які намагалися перешкодити інавгурації нещодавно обраного полковника Хакобо Арбенса. Генерала й консервативного політика Міґеля Ідіґораса та кількох високопоставлених офіцерів заарештовано й звинувачено у спробі перевороту.\n\nПопри небезпеку, а можливо, саме через неї, гватемальці масово вийшли на вулиці, щоб відсвяткувати початок президентства Арбенса. Ліва Партія революційної дії згуртувалася навколо свого лідера у відповідь, пообіцявши повністю втілити його амбітну програму земельної реформи. Але якщо багато хто бачить у ньому героя демократії, то гватемальські землевласники та United Fruit Company звинувачують його в тиранії й стверджують, що Ідіґорас став жертвою політичних переслідувань.\n"
 GUA_news.2.a: ""United Fruit Company на кону, сер.""
 GUA_news.2.b: "Безперечно, краще за альтернативу."
 GUA_news.2.c: "Революція '44 знову робить подих."

 GUA_news.3.t: "[Get_newspaper_header]Інцидент на мексикансько-гватемальському кордоні"
 GUA_news.3.desc: "Один із найбільш мілітаризованих кордонів Америки знову бачить перекидання військ і техніки після інциденту на кордоні, який ще більше загострив напруженість між двома непростими сусідами. Мексиканські патрулі виявили невідомих бойовиків, які переправлялися через річку Усумасінта. Відступаючи до Гватемали, бойовики були переслідувані мексиканськими військовими, що прибули на місце, які самі були змушені відступити під натиском гватемальської відповіді.\n\nУряд Гватемали вже засудив мексиканське вторгнення як майже акт війни, тоді як Мексика звинувачує Гватемалу у сприянні переходу дисидентів через кордон, використовуючи повільну реакцію Гватемали як доказ. Що саме сталося, досі залишається незрозумілим, однак наслідки очевидні: обидві держави готуються до можливої війни."
 GUA_news.3.a: "Тонку межу між недовірою та конфліктом перейдено."

 GUA_news.4.t: "[Get_newspaper_header]Гватемала атакує Мексику!"
 GUA_news.4.desc: "Напруженість на гватемальсько-мексиканському кордоні протягом останніх місяців невпинно зростала, а кілька інцидентів переросли в насильство, тоді як президент Гватемали Міґель Ідіґорас постійно засуджував ""соціялістичну мексикансько-кубинську агресію"". Багато хто вважав це лише патріотичним брязканням зброєю, покликаним зміцнити внутрішню підтримку нестабільного режиму Ідіґораса та змусити Мексику піти на поступки заради регіональної стабільности.\n\nТепер ці переконання остаточно розвіяно. Сьогодні раніше підрозділи гватемальської армії атакували мексиканські прикордонні позиції, а кораблі гватемальських військово-морських сил атакували мексиканські торговельні судна далеко в мексиканських територіяльних водах. Схоже, раптовий напад застав Мексику зненацька, однак спостерігачі не впевнені, чи має Гватемала довгостроковий план, який дозволить їй вийти переможницею з конфлікту зі своїм значно більшим сусідом.\n"
 GUA_news.4.a: "Про що вони думають?"
 GUA_news.4.b: "Вони дорого за це заплатять."
 GUA_news.4.c: "Добром це не скінчиться..."

 GUA_news.5.t: "[Get_newspaper_header]Мексика придушує гватемальську революцію" #Build out further if characters allow
 GUA_news.5.desc: "Те, що мексиканські військові вважали швидкою війною проти Гватемали, відтоді перетворилося на патову ситуацію. І все ж, навіть коли гватемальські сили стримували свого значно сильнішого північного сусіда, далеко позаду лінії фронту все було далеко не ідеально.\n\nЛіві революціонери скористалися тим, що військові були відволічені, щоб розпочати повстання, змусивши гватемальську армію відвести сили з фронту для боротьби із загрозою всередині країни. Коли їхні вороги виявилися розділеними, мексиканська армія прорвала патову ситуацію, швидко розгромивши і режим, і партизанські сили."
 GUA_news.5.a: "Вистояти може лише справжня революція."

 GUA_news.6.t: "[Get_newspaper_header]Революція в Гватемалі"
 GUA_news.6.desc: "У спільній прокламації зі столиці коаліція антиурядових революціонерів у Гватемалі оголосила, що країну ""звільнено"" від військового правління. Попередній режим на чолі з генералом Ідіґорасом, який жорстоко придушував громадянські свободи та політичну опозицію, не витримав тиску внутрішнього партизанського повстання та одночасної морської висадки в Пуерто-Барріос Карибського легіону за підтримки Куби, подібної до висадки в Пуерто-Платі у 1963 році.\n\nКубинський уряд, який відкрито підтримував лівих повстанців, що тепер контролюють країну, привітав нову революційну республіку. Так само вчинила й Мексика, хоча там демонстративно не прокоментували свою ймовірну причетність до повалення Ідіґораса."
 GUA_news.6.a: "Ще одна революція в Америці для історії."
 GUA_news.6.b: "Ще один тиран мертвий."
 GUA_news.6.c: "Ці червоні всюди пролізуть."

 GUA_news.7.t: "[Get_newspaper_header]Проамериканський переворот у Гватемалі"
 GUA_news.7.desc: "Нещодавно місто Гватемала було захоплено військами під командуванням кількох високопоставлених армійських офіцерів. Під загрозою насильницького повалення колишній президент був змушений залишити країну, тоді як Збройні сили оголосили про усунення обраного уряду й почали формування перехідної хунти для ""відновлення суспільного порядку"".\n\nКерівництво хунти, більшість якого перебуває на утриманні Сполучених Штатів, схоже, походить із коаліції різнорідних військових угруповань, об'єднаних винятково фінансовими зв'язками з американськими організаціями. Популярна підтримка нового режиму залишається жалюгідно низькою, але, схоже, за підтримки північного гегемона мало що можна зробити, аби змінити курс Гватемали найближчим часом.\n"
 GUA_news.7.a: "Американське подвір'я не продається."

 GUA_news.9.t: "[Get_newspaper_header]Міханґос обраний президентом Гватемали"
 GUA_news.9.desc: "Попри бурхливий виборчий сезон, Гватемала зберегла своє крихке утримання демократії. Партія революційної дії (ПРД) на чолі з адвокатом, доктором Оскаром Адольфо Міханґосом Лопесом, який пересувається на інвалідному візку, здобула перемогу, і святкування лунають по всій невеликій країні.\n\nАле мир у Центральній Америці завжди був відносним. Серед офіцерів, які втратили свій шанс втрутитися, тліє обурення, а їхні побоювання щодо соціялізму підтримують можливість нового перевороту.\n\nНаразі ПРД зважує, до кого приєднатися — ОВН, Веракруса та інших закордонних партнерів. Світ уважно спостерігає, чи стане Гватемала доказом того, що демократія може вистояти в Центральній Америці, чи це лише пауза перед поверненням бурі.\n"
 GUA_news.9.a: "Доказ того, що це можливо."
