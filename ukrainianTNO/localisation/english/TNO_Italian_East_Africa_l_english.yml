 IEA_rebuilding_east_africa:0 "Відновлення Східної Африки"
 IEA_rebuilding_east_africa_desc:0 "Хоча повстання було придушене, шкода, завдана інфраструктурі колонії, є колосальною. Цілі міста зрівняні із землею внаслідок боїв, а дороги, залізниці, лінії електропередач та промисловість перебувають у руїнах. Перш ніж ми зможемо вважати колонію повністю підконтрольною, необхідно відновити все зруйноване."
 IEA_pacifying_east_africa:0 "Умиротворення Східної Африки"
 IEA_pacifying_east_africa_desc:0 "Хоча відкрите повстання було придушене, залишки сил, що загрожували італійському правлінню в Італійській Східній Африці, досі діють у сільській місцевості та гірських районах на півночі. Поки вони не будуть ліквідовані, існує ризик нового повстання. Тому необхідно негайно вжити заходів для знищення останніх осередків опору або хоча б максимально зменшити їхню загрозу."
 
