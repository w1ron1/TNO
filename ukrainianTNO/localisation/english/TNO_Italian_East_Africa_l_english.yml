 #Leader descriptions
 POLITICS_VICEROY_AMEDEO_DESC:0 "Амадео ді Савойя-Аоста — людина, яку можна любити або ненавидіти, але неможливо ігнорувати. Прозваний Залізним герцогом і Героєм Амба-Алагі, Амадео народився в одній із гілок італійського королівського дому, зрештою ставши генералом королівськив ВПС. У 1937 році Амадео, завдяки своєму знатному походженню, був призначений віце-королем Італійської Східної Африки, але, на відміну від свого менш щасливого брата Аймоне, він одразу взяв активну участь у керівництві колонією. Під час Другої світової війни він особисто командував італійськими військами в битвах проти британців, зупинивши їхній наступ у Східній Африці блискучою перемогою при Амба-Алагі.\n\nПісля завершення війни Амадео знову присвятив себе управлінню колонією. Як ефективний губернатор і критик фашистської системи (що принесло йому симпатію нового дуче, Галеаццо Чіано), Амадео робив усе можливе, щоб захистити місцеве населення від впливу фашистських властей та італійських компаній, які прагнули експлуатувати працю ефіопів, еритрейців і сомалійців. Саме завдяки його невтомній роботі корінне населення Східної Африки має вищий рівень життя, ніж мешканці частин Африки, що перебувають під німецьким контролем.\n\nОднак правління Амадео залишається колоніальним, що означає, що багато місцевих жителів усе ще ненавидять його та італійців. Парамілітарні угруповання та повстанці, що ховаються в горах і сільській місцевості, залишаються серйозною загрозою. Навіть ті корінні жителі, які не чинять активного опору італійському правлінню, все ще стикаються з нерівністю та бідністю порівняно з італійськими поселенцями. З віком Амадео, не маючи призначеного наступника, дедалі частіше замислюється про батьківщину й іноді задається питанням, чи не була вся його робота марною."
 POLITICS_VICEROY_ENRICO_CERULLI_DESC:0 ""
 POLITICS_VICEROY_AMEDEO_GUILLET_DESC:0 ""
 POLITICS_VICEROY_DAVIDE_FOSSA_DESC:0 "Після повторного завоювання Італійської Східної Африки Італії потрібен був надійний керівник, який би очолив колонію та гарантував, що вона більше не вислизне з-під італійського контролю. Давіде Фосса, який понад два десятиліття працював інспектором з праці в Італійській Східній Африці, а також був найважливішим партійним діячем НФП на Африканському Розі, відразу став очевидним кандидатом. Як досвідчений адміністратор і відданий партієць, він швидко був призначений віце-королем.\n\nВірячи в безсмертне право Італії на правління Африканським Рогом, Фосса негайно розпочав кампанію з відновлення порядку та відновлення італійського контролю над колонією. З одного боку, необхідно викорінити останні осередки повстанців, а з іншого — відновити інфраструктуру та забезпечити громадський порядок не через надзвичайні заходи, а через звичайне управління. Це завдання, безперечно, займе нового віце-короля, а також східноафриканську бюрократію та поліцію, щонайменше на решту десятиліття."
