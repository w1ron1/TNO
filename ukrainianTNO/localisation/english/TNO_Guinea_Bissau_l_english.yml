 ### Ideas ###
 GNB_finite_status_quo:0 "Скінченний статус-кво"
 GNB_finite_status_quo_desc:0 "Сили Спіноли були розміщені в Ґвінеї-Бісау з тим, що вони вважали простою метою: захищати колонію від імені португальського (і, відповідно, іберійського) уряду.\n\nОднак із цією місією є одна проблема: португальського уряду більше не існує. Він занурився в громадянську війну, а на материку панує хаос. Ґвінея-Бісау залишилася сама.\n\nБез уряду, який їх підтримує, лише питання часу, коли Спінола та португальські сили в Ґвінеї-Бісау будуть або розгромлені, або зазнають вторгнення зовнішніх сил." 
 GNB_fling_terrorism:0 "Тероризм FLING"
 GNB_fling_terrorism_desc:0 "ПАІҐК прийшла до влади в Ґвінеї-Бісау. Однак офіційно бути при владі — не те саме, що справді контролювати державу, і влада ПАІҐК досі значною мірою оскаржується.\n\nГоловна опозиція уряду наразі походить від іншого угруповання, відомого як FLING, яке виступає проти марксистської доктрини, якої дотримується ПАІҐК. Тому FLING нині здійснює серію нападів на уряд, намагаючись усунути ПАІҐК від влади й самим прийти до влади."
 GNB_bissau_crisis:0 "Бісауська політична криза"
 GNB_bissau_crisis_desc:0 "Португальців вигнали з Ґвінеї-Бісау, але ще багато чого належить зробити. Оскільки кілька африканських держав беруть участь у реорганізації колишньої колонії, жоден місцевий уряд не отримав можливості сформуватися, і натомість Ґвінея-Бісау стає полем битви для іншого різновиду конфлікту.\n\nРізні держави, залучені до цього конфлікту, не ведуть його шляхом прямого кровопролиття, а натомість фінансують і заохочують ті ґвінейські фракції, які найбільше відповідають їхнім власним інтересам. Поки одна зі сторін не здобуде однозначної перемоги, долю Ґвінеї-Бісау й далі тягатимуть у різні боки."
 GNB_paigc_offensive:0 "Новий наступ ПАІҐК"
 GNB_Foreign_Occupation:0 "Присутність іноземних військ"
 GNB_Foreign_Occupation_desc:0 "Після Західноафриканської війни коротка свобода Ґвінеї-Бісау від португальського ярма закінчилася тим, що її схопила інша рука. Нова рука, яка не відпустить, доки не переконається, що її хватка надійно закріпилася.\n\nА до того мешканцям Бісау доведеться терпіти постійний нагляд гарнізону іноземних солдатів, які патрулюють його вулиці, що все ще оговтуються від війни, можливо, плекаючи сумнівну надію, що цей новий господар виявиться милосерднішим за попереднього." 
 GNB_hell_on_earth:0 "Пекло на землі"
 GNB_hell_on_earth_desc:0 "Португалія відновила свій контроль над Ґвінеєю-Бісау, португальський прапор знову майорить над різними прибережними містами колонії, але якою ціною? Хоча Лісабон міг оголосити повернення успіхом, ситуацію можна описати лише як надзвичайно скрутну.\n\nПАІҐК може бути загнана в кут, але вона швидко перейшла до тактики міської партизанської боротьби, змушуючи Португалію платити кров'ю за кожен дюйм тротуару, на який поширюється її контроль. Португальські війська, які роками перебувають у цьому районі, тепер пробиваються на кораблі назад до Європи, не бажаючи більше озиратися назад. Через брак живої сили та виснажену місцеву економіку Спінола фактично є губернатором невеликої мережі прибережних поселень. Не дивно, що ніхто в Лісабоні не хоче навіть торкатися цієї проблеми."
