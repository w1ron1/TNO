  # Leader Descriptions
  POLITICS_GUADALUPE_SALCEDO_UNDA_DESC: "Попри прагнення до сильніших інституцій, латиноамериканці не можуть не захоплюватися романтичним партизанським лідером. Старші шанують Болівара й Сандіно, молодь та інтелектуали вітають Фіделя Кастро, а комуністи славлять Че Ґевару. Для багатьох колумбійців надія втілена у їхньому власному Капітані Сальседо.\n\nНароджений у скотарському селі Арауки в ліберальній родині, Сальседо, як і багато сільських хлопців, був ув'язнений за крадіжку худоби. Після звільнення його захопило святкування — доктор Ґайтан, герой селянства, став президентом. Ґайтан створив рай для багатостраждального селянства, навчив його силі прямої демократії та стримував фашистів, які загрожували його традиціям. Для Сальседо та багатьох інших, подібних до нього, Ґайтан був теплим і доброзичливим сонцем на небі — а коли Ґайтана вбили, над Колумбією настало затемнення, коли рушили чорносорочечники. Талановитий вершник, Сальседо об'єднав навколишні села й вигнав фашистів своїми відчайдушними партизанськими атаками.\n\nТепер Верховний командувач Революційних збройних сил Східних рівнин, Сальседо перед портретом свого героя присягнувся боротися за його обложені ідеали, захищати бідних, пригноблених і нещасних. Він бачить себе сучасним генералом Рондоном, який веде кінноту до патріотичного спасіння та цілковитої поразки фашистських олігархів, що прагнуть позбавити Колумбію її незалежності. Ґайтан закликав народ іти вперед до перемоги, і Сальседо очолить їхній наступ."
  POLITICS_CLL_GILBERTO_VIEIRA_WHITE_DESC: "Коли широкий світ згадує латиноамериканських каудильйо, мало хто думає про спокійного й уважного генерального секретаря Колумбійської комуністичної партії, а тим паче як про розважливого вчителя, що передає свою мудрість охочим учням. Формуючи ландшафт трудової політики відтоді, як п'ятнадцять років тому заснував Комуністичну партію, дехто може сказати, що невимушений Хільберто Вієйра Вайт був сформований своєю кар'єрою більше, ніж сам її формував, — людина, яку повністю сформувала його десятиліттями тривала праця.\n\nНароджений 1911 року в родині збіднілої аристократії, Вієйра Вайт провів дитинство в умовах глибокої ізоляції, що частково сформувало його сильне прагнення до самоосвіти протягом більшої частини життя. Завзятий читач західної класики та сучасної літератури, підлітком він познайомився з Нерудою, Міґелем Ернандесом, Рафаелем Альберті та численними ідеологами Іспанської республіки — і хоча його надихала їхня боротьба проти фашизму, саме під час Ла Віоленсії він перетворив їхні ідеї на особисті уроки.\n\nЗнаючи фашизм як повзучу корупцію, Вієйра Вайт зробив прагматичний вибір — призупинити комуністичну боротьбу заради співпраці з прогресивнішими партіями Ліберального революційного руху та Об'єднаного народного фронту. Але в глибині душі, як і кожен розсудливий революціонер до нього, за своєю терплячою оболонкою він і далі знає своє місце як червоний авангард, сподіваючись одного дня створити по-справжньому соціялістичну Колумбію."
  POLITICS_CLL_NICOLAS_BUENAVENTURA_DESC: "Правильний, ввічливий інтелектуал — нетипова постать для прапороносця радикального крила Комуністичної партії. Проте Ніколас Буенавентура став пастирем пролетарських мас — джентльменом-революціонером, мудрим, але щирим, поміркованим, але бунтівним.\n\nОтримавши комфортний старт для свого насиченого життя 25 листопада 1919 року, Буенавентура походив із родини заможних науковців і ремісників, і це середовище безперечно сприяло формуванню вільнодумного інтелектуалізму та демократичних ідеалів. Після суперечки з батьком він приєднався до Комуністичної партії, коли консерватори взяли кермо влади у 1930-х. Захоплюючись теоріями Леніна та поєднуючи їх із власними переконаннями, він поступово сформував ідею «лівої демократії» — де організація набуває форми масової дії, незалежно від її назви.\n\nНевдовзі його роль «учителя» вийшла за межі Калі й почала поширюватися по всій партії. Проте із завершенням Другої світової війни мрія про Соціялістичну Республіку спочатку розвіялася, а після Ла Віоленсії повернулася вже як насмішка. Комуністичний рух зазнав поразки, занурившись в опортунізм і декаданс, тоді як Вієйра Вайт насолоджувався «коктейльним комунізмом».\n\nТа сама жага, яка підштовхнула його приєднатися до єдиного фронту, коли Калі палав, спонукала його кинути виклик цьому падінню. Це була ставка, що принесла плоди: пленум зустрів його гучними оплесками, як і опозиція, яку привабила його обіцянка демократизації. Дорога до кращого завтра буде важкою, але Буенавентура не спочине, доки Колумбія не перетвориться на безпечну гавань і маяк, що надихає всю Південну Америку."
  POLITICS_CLL_ANTONIO_GARCIA_NOSSA_1_DESC: "Народжений 16 квітня 1912 року в родині іспанського робітника-іммігранта та його дружини-домогосподарки, Антоніо Ґарсія Носса зростав у бідності. Другий із семи дітей, він жив у родині, якій було важко забезпечувати себе навіть на тлі економічного буму кінця 1910-х, обурюючись умовами, нав'язаними йому та всім навколо.\n\nЙого гострий розум забезпечив йому місце в університеті 1930 року, посеред економічної депресії, де він часто вступав у конфлікт із консервативним духом закладу. Вивчаючи право, політику та історію, він також поринув у нові ідеї своєї епохи. Соціялізм, егалітаризм та індихенізм стали іскрами, що розпалили в юнакові невгасимий вогонь.\n\nҐайтан дав Антоніо його покликання, а його розум привів його до ролі одного з головних соратників, що відіграли важливу роль у створенні Плану Ґайтана 1947 року. Смерть його наставника та Ла Віоленсія змусили Носсу вирушити на Схід, де він продовжував об'єднувати сили Соціялізму, доки Гаванські мирні угоди не повернули його до Республіки, а тепер — до її найвищої посади. Коли Ґайтанізм знову набирає сили, а бандита Міхельсена нарешті усунуто від влади, Антоніо знає, що довга ніч Колумбії добігає кінця. Невдовзі всі зможуть купатися у світлі прийдешнього золотого світанку."
  POLITICS_CLL_ANTONIO_GARCIA_NOSSA_2_DESC: "Народжений 16 квітня 1912 року в родині іспанського робітника-іммігранта та його дружини-домогосподарки, Антоніо Ґарсія Носса зростав у бідності. Другий із семи дітей, він жив у родині, якій було важко забезпечувати себе навіть на тлі економічного буму кінця 1910-х, обурюючись умовами, нав'язаними йому та всім навколо.\n\nЙого гострий розум забезпечив йому місце в університеті 1930 року, посеред економічної депресії, де він часто вступав у конфлікт із консервативним духом закладу. Вивчаючи право, політику та історію, він також поринув у нові ідеї своєї епохи. Соціялізм, егалітаризм та індихенізм стали іскрами, що розпалили в юнакові невгасимий вогонь.\n\nҐайтан дав Антоніо його покликання, а його розум привів його до ролі одного з головних соратників, що відіграли важливу роль у створенні Плану Ґайтана 1947 року. Смерть його наставника та Ла Віоленсія змусили Носсу вирушити на Схід, де він продовжував об'єднувати сили Соціялізму, доки Гаванські мирні угоди не повернули його до Республіки, а тепер — до її найвищої посади. Із поверненням Ґайтанізму та другою поразкою Міхельсена Антоніо знає, що колумбійську демократію можна й далі плекати, а націю — зцілити миром."
  POLITICS_CLL_ALFONSO_MICHELSEN_DESC: "Часто кажуть, що кожне правило має виняток. За загальним правилом традиційний вищий клас Колумбії був консервативним і твердо захищав сам себе, але Альфонсо Лопес Міхельсен є винятком — принаймні щодо першої частини.\n\nНароджений 30 червня 1913 року, він увійшов до вищих кіл суспільства як син колишнього президента Лопеса Пумарехо, одного з найвидатніших лібералів Колумбії та батька Маршової революції. Розкішне юнацьке життя породило в голодному розумі ненаситні амбіції, і молодий Альфонсо вступив у політику лише у 25 років як член Ради Енґативи.\n\nБачачи правлячий клас, загрузлий у самозаспокоєності та нерівності, він приєднався до Альваро Урібе Руеди, підтримавши президентську кампанію Ґайтана, і ненадовго отримав посаду міністра закордонних справ. Швидко залишивши посаду, він залишився близьким до руху, а з початком Ла Віоленсії приєднався до тих, хто виступав проти консервативної традиції Колумбії у своєму східному вигнанні.\n\nХоча його подальші вчинки важко було б заперечити, мотиви завжди були джерелом численних чуток. Зважаючи на родинну репутацію людини, яка вміє вести справи й торгуватися, багато хто вбачав навіть за реформами прагнення Міхельсена та його рішучість стати обличчям ґайтаністського руху змову заради влади, а його бажання пом'якшити рух і сприяти переговорам із лібералами, які покинули їх, — зрадою обіцянки їхньої революції.\n\nТепер, як перший президент нової лівоцентристської Республіки, обраний у результаті суперечливих виборів, затьмарених фальсифікаціями та залякуванням, можна сказати, що його критики отримали підтвердження своїх слів. Попри це, найближчі до нього люди стверджуватимуть, що все це було необхідно для захисту Республіки — єдиної, чия це Республіка?"
  POLITICS_CLL_ALFONSO_MICHELSEN_DESP_DESC: "Часто кажуть, що кожне правило має виняток. За загальним правилом традиційний вищий клас Колумбії був консервативним і твердо захищав сам себе; якщо ця приказка правдива, колумбійцям ще належить це побачити.\n\nНароджений 30 червня 1913 року, він увійшов до вищих кіл суспільства як син колишнього президента Лопеса Пумарехо, одного з найвидатніших лібералів Колумбії та батька Маршової революції. Розкішне юнацьке життя породило в голодному розумі ненаситні амбіції, і молодий Альфонсо вступив у політику лише у 25 років як член Ради Енґативи.\n\nБачачи правлячий клас, загрузлий у самозаспокоєності та нерівності, він приєднався до Альваро Урібе Руеди, підтримавши президентську кампанію Ґайтана, і ненадовго отримав посаду міністра закордонних справ. Швидко залишивши посаду, він залишився близьким до руху, а з початком Ла Віоленсії приєднався до тих, хто виступав проти консервативної традиції Колумбії у своєму східному вигнанні.\n\nВідтоді його вчинки широко оспорювалися, як і мотиви, що за ними стояли. Тепер сперечатися вже нема про що. Його родинна репутація людини, яка вміє вести справи й торгуватися, виявилася властивою й Альфонсо, його жага влади виявилася сильнішою за любов до демократії чи старого Каудильйо, а дружба з військовими гарантує, що статус-кво, відкладена мрія, зберігатиметься доти, доки її народ не наважиться сподіватися на більше.\n\nРеволюцію Колумбії та її несміливі кроки до демократії було задушено в колисці, спадщину Каудильйо заплямовано кров'ю, пролитою його спадкоємцем, нація гниє, наче інфікована рана, і на старе питання вже дано відповідь. Хай живе нова ліберальна гегемонія у своїх червоних барвах — і горе мрійникам."
  POLITICS_CLL_CAMILLO_TORRES_RESTREPO_DESC: "Мабуть, важко сприймати християнство як щось інше, ніж оплот істеблішменту; від імператора Костянтина до конкістадорів Ернана Кортеса ті, хто приходив із мечем у правій руці, часто несли хрест у лівій. Мало хто вважає християнське віровчення антагоністичним до того шляху, яким досі рухалася світова історія, і ще менше ототожнюють Христа з суто революційною постаттю.\n\nНароджений 3 лютого 1929 року, Каміло Торрес Рестрепо мав щастя народитися в одному з буржуазних родів Боготи. Вихований у дусі колумбійської ліберальної партійної традиції та освічений в Університеті дель Росаріо — «колисці Республіки» Колумбії, — радикальні мученики колумбійських громадянських конфліктів XIX століття були для нього такими ж шанованими, як і невидимі святі, що надавали барв духовній тканині його глибоко пережитої католицької віри.\n\nСтавши дорослим у тіні прем'єрства Хорхе Ґайтана, політика, а ще важливіше смерть Ґайтана, відіграли величезну роль у подальшому ідеологічному становленні так званого «Священика-бунтівника». Ставши юнаком, він спостерігав за провалом і жорстоким придушенням пацифістського напряму прогресивізму у своїй рідній Колумбії, а ще більше був потрясений, коли на власні очі побачив іконоборче насильство повоєнної Європи, коли нацизм укорінювався. Будь-яка політична поміркованість, що жила в ньому, згоріла разом із Лувеном, принесена в жертву, як і багато іншого, полум'ю наступу фашизму в Європі.\n\nПовернувшись додому наприкінці 1950-х, вчасно, щоб стати свідком таких подій, як Кубинська революція, Торрес органічно приєднався до дедалі більшого табору в Колумбії, що виступав проти повернення до провалених і порожніх обіцянок лібералів та відвертої реакційної злостивості консерваторів. Багато хто в Колумбії прагнув нав'язати народу свою волю, повторюючи знайому мантру меча й хреста — Рестрепо дасть їм відповідь пригноблених і бідних вірних — хрестом і серпом."
  POLITICS_RAFAEL_NAVAS_PARDO_DESC: "Рафаель Навас Пардо — турботливий батько для військ під його командуванням і принциповий конституціоналіст для своїх противників. Командуючи полком за полком, він до межі своєї совісті дотримувався принципу «Солдати не встановлюють правила; вони лише виконують накази», давно закріпивши за собою місце одного з найстійкіших бастіонів колумбійської демократії — а тепер і відновлювача її втраченої справи.\n\nНароджений 1908 року поблизу центрального муніципалітету Мадрид, Рафаель Навас закінчив військову школу 1933 року в званні молодшого лейтенанта, після чого розпочав кар'єру у сфері національної безпеки. Почавши службу в розпал Перуанської війни, він уперше здобув відзнаку, придушивши переворот Пасто Куартеласо 1944 року — зрештою його вперта місія захисту народної інституції привела його до переходу на бік URC після битви при Флорідабланці 1955 року.\n\nЗдобуваючи перемоги на чолі корпусу Лансерос у революційній армії, він невдовзі відчув, що Комуністична партія переступила межі дозволеного, намагаючись розпустити кабільдо після того, як згасли останні жарини фашизму. Тому, хоч би яким суперечливим це не було, він вирішив відстоювати волю народу, відновити вільну Колумбію — ні Червону, ні Коричневу, — залишаючись тимчасовим лідером до повернення законної влади."

  ### EVENTS ###
 GER_colombia.1.t: "ТЕМА: Стан Другої патріотичної армії в Атлантіко"
 GER_colombia.1.SPA: "1. Приблизно о 4:00 ранку (UTC-5) Друга патріотична армія (ДПА) розпочала масштабний наступ, який за лічені години захопив безцінне портове місто Барранкілья для використання як плацдарму в її лауреаністському «відродженні» Республіки. За швидкістю та злагодженістю підрозділів ДПА значно перевершила наші очікування, зазнавши лише половини очікуваних втрат.\n\n2. Колумбія має величезне геостратегічне значення для Райху, оскільки потенційно може забезпечити доступ до Тихого океану, перешкодити зусиллям США з підтримки ультралівих угруповань в Еквадорі, Перу та Парагваї, а також сприяти поглибленню зв'язків між Германією та іншими південноамериканськими країнами. Крім того, керівництво ДПА практично беззастережно підтримує будь-якого потенційного покровителя та приватно висловило захоплену готовність поглибити зв'язки з Айхайтспактом.\n\n3. Колумбійським збройним силам досі вдавалося стримувати ДПА на північному сході, але їм бракує важкого озброєння та особового складу, необхідних для початку контрнаступу в осяжному майбутньому. Водночас цивільне населення загалом не йде на співпрацю з ДПА, а часті сутички з повстанцями швидко виснажують запаси військового обладнання. Через ці проблеми ДПА наразі не здатна розширювати свій територіальний контроль, і вони можуть стати екзистенційною загрозою для руху. Без значної зовнішньої допомоги шанси ДПА здолати Республіку невеликі.\n\n4. Враховуючи ці обставини, наші агенти наполегливо рекомендують подальшу ескалацію UNTERNEHMEN CATTLEYA. Зокрема, масштаби операцій із контрабанди зброї слід значно розширити, а цивільних радників необхідно відправити для підготовки адміністрації Урібе.\n\nХАЙ НІМЕЧЧИНА БУДЕ В НАДІЙНИХ РУКАХ"
 GER_colombia.1.COL: "1. Приблизно о 4:00 ранку (UTC-5) Друга патріотична армія (ДПА) повстала та захопила безцінне портове місто Барранкілья, щоб використати його як плацдарм у наших зусиллях із забезпечення Колумбії. За швидкістю та злагодженістю підрозділів ДПА значно перевершила наші очікування, зазнавши лише половини очікуваних втрат.\n\n2. Колумбія має величезне геостратегічне значення для Райху, оскільки потенційно може забезпечити доступ до Тихого океану, перешкодити зусиллям США з підтримки угруповань в Еквадорі, Перу та Парагваї, а також сприяти поглибленню зв'язків між Германією та іншими південноамериканськими країнами. Крім того, уряд Урданети підтримує НСДАП і приватно висловив захоплену готовність приєднатися до Айхайтспакту.\n\n3. Розрядка між лауреаністським урядом і Хосе Камачо Карреньйо змінює план використання його для приєднання Колумбії. Звіти Герібертo Швартау описують новий план дій. В обмін на допомогу в Громадянській війні PCC погодилася поглибити зв'язки з можливістю в майбутньому замінити Іберію як свого союзника.\n\n4. Враховуючи ці обставини, наші агенти наполегливо рекомендують подальшу ескалацію UNTERNEHMEN CATTLEYA. Зокрема, масштаби транспортних операцій слід значно розширити, а військових радників необхідно відправити для забезпечення орієнтації PCC.\n\nХАЙ НІМЕЧЧИНА БУДЕ В НАДІЙНИХ РУКАХ"
 GER_colombia.1.a: "Подивімося, чи витримає доктрина Монро"

 IBR_colombia.2.t: "Чоботи на землі"
 IBR_colombia.2.d: "ТАЄМНО\n\nКОМУ: Д-РУ АНТОНІУ ОЛІВЕЙРІ САЛАЗАРУ, ГЕНЕРАЛІСІМУСУ ФРАНСІСКУ ФРАНКО, МІНІСТЕРСТВУ ЗАКОРДОННИХ СПРАВ\n\nПОЧАТОК УЧАСТІ В КОЛУМБІЙСЬКІЙ ВІЙНІ\n\nЧас настав. Нещодавні події в Колумбії склалися так, що відкрили нам можливість втрутитися у війну. Уже відбулися переговори з керівництвом обраної нами сторони щодо встановлення постійних каналів зв'язку. Ми пообіцяли або готуємося пообіцяти дипломатичну, логістичну, гуманітарну та військову підтримку. Тепер лише питання конкретних заходів відділяє нас від повного залучення до конфлікту, а перед нами вже викладено варіанти того, як саме підтримати одну зі сторін. Очікуйте подальших звітів у міру того, як наша присутність розширюватиметься та закріплюватиметься."
 IBR_colombia.2.a: "Час кинути кості."

 IBR_colombia.3.t: "Добрі новини з Колумбії"
 IBR_colombia.3.d: "ТАЄМНО\n\nКОМУ: Д-РУ АНТОНІУ ОЛІВЕЙРІ САЛАЗАРУ, ГЕНЕРАЛІСІМУСУ ФРАНСІСКУ ФРАНКО, МІНІСТЕРСТВУ ОБОРОНИ\n\nКОЛУМБІЯ — ПЕРЕМОГА НА КОРДОНІ\n\nМи отримали добрі новини від наших союзників та агентів у Колумбії. Криваві сутички вздовж кордону відносно припинилися. Хоча втрати були великими, наші союзники здобули перемогу та зуміли розгромити ворожі лінії в серії дедалі більш однобічних боїв. Після розгрому основних сил противника іберійські добровольці та місцеві війська взялися викорінювати партизанів і створювати гарнізони для окупації міст у цьому районі. Хоча партизани все ще залишаються проблемою, вона достатньо незначна, щоб ми могли впевнено сказати: наша сторона перемогла в регіоні.\n\nПопри це, конфлікт продовжує загострюватися, противник переозброюється, а партизани в цьому районі не здадуться так легко. Невдовзі нам доведеться діяти, щоб утримати нашу хитку перевагу в Колумбії."
 IBR_colombia.3.a: "Принаймні тепер ми стоїмо на твердому ґрунті."

 IBR_colombia.4.t: "Похмурі новини з Колумбії"
 IBR_colombia.4.d: "ТАЄМНО\n\nКОМУ: Д-РУ АНТОНІУ ОЛІВЕЙРІ САЛАЗАРУ, ГЕНЕРАЛІСІМУСУ ФРАНСІСКУ ФРАНКО, МІНІСТЕРСТВУ ОБОРОНИ\n\nКОЛУМБІЯ — ПОРАЗКА НА КОРДОНІ\n\nНаші агенти в Колумбії підтвердили втрату ключових територій уздовж спірних кордонів трьох ворогуючих сторін. Противник зміг здолати як наших союзників, так і наших власних добровольців, завдаючи дедалі більших втрат, доки моральний стан і постачання не змусили нас залишити цей район. Хоча значна кількість партизанів залишилася позаду, щоб завдавати клопоту ворогові, який зумів створити там гарнізони, їхньої присутності недостатньо, щоб по-справжньому оскаржити контроль противника. Ми повинні визнати, що ворог переміг у цій боротьбі й тепер повністю контролює прикордонні території.\n\nПопри це, ситуація продовжує загострюватися. Ми перебуваємо у значно невигіднішому становищі, але це не повинно завадити нам готуватися до інтенсивнішого конфлікту. З огляду на це ми маємо бути готові діяти рішуче та ефективно, якщо або коли настане час."
 IBR_colombia.4.a: "Далі буде лише гірше."

  IBR_colombia.5.t: "Друга Реконкіста"
  IBR_colombia.5.desc: "Картахена веде свою історію від конкістадора Педро де Ередіа, який мандрував Вест-Індією на початку XVI століття та заснував місто з двомастами людьми. Розташована між річками Маґдалена та Сіну, Картахена мала стратегічне значення для Іспанської імперії в Америці й стрімко багатіла завдяки іспанському капіталу. Три століття потому іспанський капітал повернувся до Картахени разом із завершенням Ла Віоленсії.\n\nМожливо, несправедливо стверджувати, що тут справа винятково в іспанському капіталі. Є й португальські підрядники, як-от Атиліо Салґадо, фахівець з інфраструктури, який ходив Центральнокарибською дорогою з блокнотом у руках, записуючи ширину доріг, низьку якість гравію та пошкодження, яких вона зазнала під час битви за місто. Але більшість іберійців, які прибули до Картахени, були іспанцями. Серхіо Діас проводив таємні зустрічі з новим мером, домагаючись вигідних умов для своєї будівельної компанії. У порту Оєр Тарраґона спостерігав за пришвартуванням перших торговельних кораблів з-за Атлантики, що привозили товари з Піренейського півострова та готувалися прийняти колумбійські скарби. Б'єль Франсіско Ґальєґо зійшов з одного з кораблів, тримаючи в руці валізу, готовий увійти на цей щойно відкритий ринок.\n\nА вулицями Картахени йде молодий дипломат, у захваті від новознайденої свободи та завершення насильства, яке роками мучило цю країну. Хосе Мануель Перальта тримав у руці велику манільську папку, всередині якої лежав звіт з іберійського посольства. У ньому йдеться про новий уряд, який готує вибори, про сповнений надії настрій на вулицях, про прагнення Колумбії повернутися у світ; у ньому також йдеться про вдячність уряду Іберії та активи, які відкрила їхня лібералізація. Він зайшов до поштового відділення й передав конверт службовцю; на лицьовому боці стоїть штамп ТЕРМІНОВА ДОСТАВКА, а під ним — адреса міністерства закордонних справ Іберійського союзу. Перальта повертається до Картахени з легким серцем, прагнучи прийняти місто, яке згодом вважатиме своїм другим домом."
  IBR_colombia.5.a: "Мирна земля — стабільна земля; стабільна земля — добра для бізнесу."

  IBR_colombia.6.t: "Звістка про поразку"
  IBR_colombia.6.desc: "Звіт лежав на столі Франко нерозпечатаним. Не було сенсу його читати — він знав, що там написано. Ситуація в Колумбії погіршувалася тижнями, і цей звіт був лише остаточним вироком. Він позбавить себе кривавих подробиць.\n\nТелефон на його столі задзвонив. Це теж його не здивувало, і він точно знав, хто телефонує. Піднявши слухавку, він почув потік португальської лайки від свого побратима-каудильйо. Він поклав слухавку на стіл, дозволяючи Салазару випустити пару. Та й не можна сказати, що Франко цього не заслужив. Саме він переконав Салазара, що ця пригода в Колумбії буде варта того. Саме він говорив про повернення старої слави, про те, що Іберія знову матиме місце в Новому Світі. Але ті часи минули, і ось доказ.\n\nЗітхнувши, він знову підняв слухавку.\n\n«Я згоден, Антоніу. Це була моя помилка. Нам потрібно змиритися з втратами й забрати звідси все»."
  IBR_colombia.6.a: "Минуле не можна повторити."

  IBR_colombia.7.t: "Безглуздий хрестовий похід"
  IBR_colombia.7.desc: "Було вже пізно вночі, коли вантажний корабель із переможеними увійшов до гавані, повільно виринаючи з туману. Усіх розбудив крик «земля!», і всі зібралися біля борту, щоб поглянути на свою батьківщину, але повернення додому не викликало жодної радості. Усі почувалися спустошеними, розгубленими та втомленими.\n\nВони програли, а люди, які послали їх на цю поразку, зникли. Вони вирушали, знаючи, що підвели Іберію, — але під час подорожі додому замислювалися, за що вони взагалі воювали. Що було в Колумбії такого, заради чого варто було посилати іберійців на смерть? Їхні товариші загинули за справу, якої вони вже не могли пригадати; уцілілим залишилися лише їхні життя, невиправно понівечені цією поразкою.\n\nУдалині мерехтіли вогні гавані. Повітря було приємно холодним і сухим — бажаним полегшенням після колумбійських джунглів. Більше їм не доведеться терпіти гнітючу вологу спеку; більше не доведеться терпіти кулі та леза комуністів чи республіканців; і більше не доведеться терпіти мрії старих людей у Мадриді.\n\nКожен ніс із собою свідчення жалю, провалу й зради, які вони зберігатимуть не лише у своїх серцях, а й донесуть до всієї Іберії. Вони розповідатимуть про це в родинних домівках, де батьки переказуватимуть своїм дітям очищені від неприємних подробиць версії війни. Вони розповідатимуть про це в заїздах і пабах Іберії, де п'яні нещасні о третій ранку ридатимуть у свої кухлі за загиблими товаришами. Дехто навіть розповідатиме про це в судах, коли люди міркуватимуть, яку компенсацію вони можуть отримати за свою жертву."
  IBR_colombia.7.a: "Можливо, вони навіть розкажуть про це на іншому полі бою, ближчому до дому."

  IBR_colombia.8.t: "Аукціон грифів"
  IBR_colombia.8.desc: "Двадцять багатіїв зібралися у величезній конференц-залі найбільшого готелю Боготи, який не було розбомблено. Навпроти них стояли аукціоніст, представник уряду та карта Нової Гранади. На карту наклали номери лотів: місця розташування багатих маєтків, родючих долин і полів, найпридатніших для вирощування найкращих колумбійських культур.\n\nУ маєтках полковник насолоджується першим днем на пенсії. Він мав намір розжиріти на прибутках, здобутих під час громадянської війни, — половину з яких він украв у єврейських родин, оголошених Альсате зрадниками держави. Маєток був прекрасною колоніальною спадщиною на вершині великого пагорба, під яким розкинулися величезні поля та невелике містечко, що виросло навколо маленького озера. Але він не володів усім цим, не по-справжньому. Він знав, що лише представляє іншу людину, яка дозволяла йому грати роль поміщика за розумну плату. «Продано, джентльменові із Саппоро, за три мільйони».\n\nГрупу фермерів зупинили на узбіччі дороги. Їх обшукали, принизили, вдарили прикладом гвинтівки в живіт. Новогранадські солдати обшукали їхній обоз і забрали врожай, який вони хотіли відправити на ринок. Їхній командир вважав себе справедливим і залишив по собі рахунок із зображенням Ель Дуче. Пригнічені фермери попленталися назад до своїх полів, лише щоб знайти там інших людей із документом на землю та наказом вигнати самозахопників. «Продано, джентльменові з Мілана, за чотири мільйони».\n\nСело намагалося залишити війну позаду, але шрами залишилися. Коли вони заплющували очі, то все ще бачили, як ополченці сходять на долину, наче лавина. Коли вони пішли, семеро були мертвими. Солдати називали їх марксистськими диверсантами — їхнім єдиним злочином було те, що вони жили в селі на території URC. Але вони були бідними й вважали себе не вартими чиєїсь уваги, доки одного дня не прийшов дивний чоловік і не взяв зразки їхнього ґрунту. Потім прибули сотні спекулянтів із далеких країв. «Продано, джентльменові з Барселони, за п'ять мільйонів»."
  IBR_colombia.8.a: "Продано найбагатшим людям Старого Світу за кілька тисяч життів."

  USA_colombia.7.t: "Гірко-солодкий смак"
  USA_colombia.7.desc: "У кондиціонованому кутку Боготи, на три поверхи над містом, Дірк Голден спостерігав за рухом транспорту та сьорбав ту незмінно чудову колумбійську каву. У його друкарській машинці лежала остання сторінка звіту, який мав запустити його кар'єру в Компанії в стратосферу: звіту про успіх наших нових союзників у Колумбійській громадянській війні. Ленґлі почує про вирішальну роль, яку він відіграв у цій справі, і винагородить його за десять довгих років, проведених у тому, що він колись вважав Богом забутими джунглями. Можливо, кава була трохи гіркою, але смак перемоги був солодким.\n\nПереможці були дивною компанією: від прогресивних яструбів до ліберальних демократів, а між ними — безліч інших фракцій, що сварилися між собою. Голден запевнить начальство, що останні не завадять загальним проамериканським настроям, які зростають у країні. Сам Ґайтан був затятим панамериканістом, який прагнув зігріти свою країну смолоскипом свободи, і тепер його наступники можуть понести цей смолоскип далі. Єдине, про що Ленґлі потрібно було застерегти, — відверте втручання в їхні ринки. Він не міг не висловити власну думку: нехай колумбійці розвивають свою економіку, запропонуйте їм капітал і дозвольте їм самим вирішувати, яким іноземним компаніям дозволяти інвестувати. Ви все одно отримаєте контроль над їхньою економікою, і всі будуть задоволені.\n\nГолена змусила посміхнутися не патріотична гордість. Це була гордість за власні зусилля. Десять довгих років у Колумбії, допомагаючи керувати цією станцією, — і тепер у нього була ціла нація як доказ. Він сьорбнув своєї гіркої кави, цінного врожаю цієї країни. Спочатку він її ненавидів — колись його чашки завжди були на три чверті наповнені молоком, — але з часом навчився цінувати її сильний, насичений смак. Його любов до колумбійської кави зростала разом із його прихильністю до Колумбії: від ненависного вигнання до гордого опікуна. Америка перемогла тут, і Америка — або, принаймні, її розвідувальні служби — дізнається про життєво важливу роль, яку він відіграв у забезпеченні її позицій у Колумбії."
  USA_colombia.7.a: "Він подбав, щоб у звіті це було чітко зазначено."

  USA_colombia.8.t: "У бігах"
  USA_colombia.8.desc: "Генрі біг, рятуючи, курва, своє життя. Він мчав крізь густий ліс, ледве уникаючи коріння та гілок, що тягнулися вгору, намагаючись його підставити. Голден біг позаду нього. Генрі ніколи його не любив і в приватних розмовах називав «довбаним ЦРУшником», але тепер це не мало значення. Революціонерів розгромили, і вони були змушені тікати. Генрі чув, як урядові солдати наближаються, здавалося, просто наступаючи їм на п'яти.\n\nГолден, задихаючись, прихилився до дерева. Генрі обернувся й закричав: «Якого біса ти робиш?»\n\n«Мені просто треба перевести дух-» Слова Голдена урвалися пострілом, за яким пролунав крик. Генрі побіг удвічі швидше. Вирвавшись крізь дерева, він опинився на березі річки Оріноко. Генрі глибоко вдихнув і стрибнув із краю берега.\n\nВін планував доплисти на інший бік, але це виявилося неможливим. Очі пекли від каламутної води, а течія річки позбавила його слуху. Він намагався плисти в напрямку, де, як йому здавалося, був протилежний берег, але м'язи швидко втомилися, а легені запекли від нестачі повітря. Коли рука схопила його за спину й витягла з води, полегшення майже заглушило страх.\n\nВін лежав на палубі невеликого моторного човна, яким керував солдат. Поруч сидів інший солдат із напоготові зброєю. Генрі сів і подивився на берег, до якого вони прямували. Там він побачив ще кількох солдатів і Голдена, який сидів із закривавленою пов'язкою на нозі. Ситуація була далекою від ідеальної, але принаймні здавалося, що їх не вб'ють."
  USA_colombia.8.a: "Ганебний кінець цієї пригоди."

  USA_colombia.9.t: "Згаслий смолоскип"
  USA_colombia.9.desc: "Дірк Голден намагався викликати з пам'яті інформацію: польові посібники, навчальні фільми, розмови між ветеранами, які він підслуховував. У голові виникла лише мішанина — тисячі уривків боролися за значущість у його свідомості, поки його тіло крокувало крізь колумбійські джунглі. Його роздягли та зав'язали очі, змусивши переможці вести його крізь невблаганні джунглі. Він намагався пояснити, хто він — не агент, не солдат, а секретар. Його викрадачам було байдуже. Він ішов на смерть разом з іншими янкі.\n\nОчищена від кори деревина та опалі гілки хрускотіли й ламалися під його закривавленими ногами. Холодне дуло гвинтівки впиралося йому в спину, змушуючи йти вперед щоразу, коли тіло намагалося відпочити. Голден хотів би чітко чути птахів над головою. Він хотів померти під їхній спів, який би втішив його, але насмішки солдатів і гучний хрускіт уламків під ногами заглушували їхній спів.\n\nУ галасі його свідомості виникали нові думки — спогади про звіти, моторошно чіткіші за ті, які він намагався пригадати. Сили Нової Гранади винахідливо катували місцевих колабораціоністів. Голден читав ці звіти; він навіть написав кілька з них. Вони давно відмовилися від звичайного насильства й розробили нові способи завдавати людям болю. Вони навіть почали наслідувати середньовічні форми тортур. Він намагався відкинути ці думки, але щойно вони з'явилися, забути їх було неможливо. Ноги Голдена ледь не підкосилися, але черговий різкий поштовх дула в спину змусив його втриматися на ногах і йти назустріч жахам, про які він досі лише читав.\n\nЗа якихось чотири тисячі миль звідси звіт перетинає Стіл Резолют. Він викладає ситуацію в Колумбії простими словами: активи, які на момент написання звіту не було евакуйовано, вважаються втраченими. Смолоскип свободи не впаде на Нову Гранаду. Із сумом, гнівом чи нудьгою — мало хто вже знає, а згодом не пам'ятатиме ніхто — президент приймає цю інформацію та передає її далі по столу, наче клерк."
  USA_colombia.9.a: "Ще одна невдача до купи."

  BRA_colombia.1.t: "Внесення змін до планів"
  BRA_colombia.1.desc: "Це вже був довгий і бурхливий день для [BRA.GetLeader], адже бути лідером Бразилії — нелегке завдання. Але, схоже, тепер йому доведеться перенести свої турботи за межі землі «порядку і прогресу». Щойно він увійшов до свого кабінету в Планалту, його зустріли генерали з усіх куточків країни — від амазонських джунглів до ріу-ґрандських пампасів. На його столі лежало щонайменше десять різних карт Колумбії, які відрізнялися одна від одної лише найдрібнішими деталями.\n\n«Добрий вечір, пане президенте, сподіваюся, ваш день був спокійним. Будь ласка, сідайте», — сказав один із генералів, підсуваючи стілець для [BRA.GetLeader]. «Може, вже перейдемо до справи?»\n\n«Як вам, мабуть, відомо з новин, ілюзія миру в Колумбії ось-ось скінчиться. Сили Капітана Сальседо останні кілька днів ведуть запеклі бої з центральним урядом, і ситуація лише погіршуватиметься з кожною кулею, що вилітає з їхніх рушниць», — пояснив генерал. — «З огляду на неминучий крах перемир'я 1957 року, вкрай важливо посилити нашу участь у конфлікті та забезпечити, щоб переможець був прихильним до наших інтересів».\n\n«Я мушу рекомендувати нам підтримати Революційний союз, вони-»\n\n«Ці варґісти, які водять дружбу з комуністичними бандитами? Та годі!» — обурено вигукнув один із генералів. — «Ми не повинні допомагати цим людям, їхня єдина мета — самим займатися грабунком! Якщо хтось і збирається нам допомогти, то це уряд у Боготі. Від самого початку війни вони були бастіоном антикомунізму та стабільності. Якби не ці... »\n\n«Ви забули, що Ґайтан означав для цього клятого континенту? Він міг бути соціялістом, але він боровся за єдність Америк і демократію, а тепер на його мрію напали ті самі фашисти, про яких він нас попереджав. Ми повинні сприяти демократичним урядам на всьому континенті, а не нікчемним диктаторам».\n\nГенерал, який протестував, пирхнув, щойно інший назвав Революційний союз «демократичним», а потім звернувся до президента. «Ну то кого ж ми оберемо, пане президенте?»\n\nТримаючи підборіддя руками, [BRA.GetLeader] відповів:"
  BRA_colombia.1.a: "Революційний союз."
  BRA_colombia.1.b: "Центральний уряд."
  BRA_colombia.1.c: "«Нам треба ще над цим подумати»."
  BRA_colombia.1.e: "«Жодного з них»."
  BRA_colombia.1.e_tt: "§YЗбройним силам і так вистачає внутрішніх проблем, краще не вплутуватися ще й у Колумбію.§!"

  BRA_colombia.2.t: "Вода для Птаха"
  BRA_colombia.2.d: "«Слухайте, пане президенте, я вам кажу, що кожен інший варіант — або маріонетка іберійців, італійців, або, що ще гірше, німців», — вигукнув один із генералів Ворону, який не міг перестати каркати.\n\n«То ви кажете, що наш єдиний варіант — кляті ґайтаністи? Тоді цю війну вже програно. Я категорично цього не схвалюю. Я любив Ґайтана, як і всі інші, але вони дурні, якщо не бачать, що його послідовники гірші за варґістів!» — Ворон продовжував каркати, поки генерали знову й знову намагалися все пояснити. Минали хвилини, аж зрештою Ворон, здавалося, вичерпав сили. Один із генералів помітив це й скористався нагодою пояснити необхідність підтримати революціонерів.\n\n«Я ненавиджу цих популістських соціялістів не менше за вас, але щодо того, кого підтримувати на цьому континенті, ми повинні бути прагматичними. Ми не знаємо, чим може обернутися Колумбія, якщо просто проігноруємо її. КРУ — широкий фронт, і ґайтаністи чітко дали зрозуміти, що перебувають у союзі з цими більшовиками лише з міркувань доцільності. Доктор Міхельсен чітко заявив про намір припинити цю домовленість після завершення війни».\n\nПісля чашки води, що допомогла його захриплому голосу, Ворон цвірінькнув: «Гаразд. Гадаю, краще ризикнути з ними, ніж з'ясувати, з яким різновидом нікчемного диктатора ми зрештою матимемо справу. Тоді маєте мій дозвіл».\n\n«Дякую, пане президенте», — сказав один із генералів, виходячи з кімнати та залишаючи Ласерду наодинці з власними думками."
  BRA_colombia.2.a: "«Самозакоханий варґіст — найкраще, що ця країна змогла нашкребти...»"

  BRA_colombia.3.t: "Життя після війни"
  BRA_colombia.3.desc: "Є певна тиша, яка огортає землю одразу після війни. Люди обережно виходять зі своїх укриттів і окопів, несміливо повертаючись до старого розпорядку й інстинктивно боячись моменту, коли хаос знову повернеться. Людина може втратити контроль над своїми кіньми, її думки зайняті дружиною, яку вона втратила в сутичці, а все місто замикається у своїх домівках, рятуючись від табуна. Рибалки та збирачі каучуку вагаються, чи вирушати через кордон Амазонасу. Спалені села та міста, перетворені на руїни, розкидані по ландшафту, а пам'ять про їхнє минуле згасає з кожним днем.\n\nСпочатку Богота відчула цю тишу. Люди нерішуче ходили біля входів до будівель, готові пірнути в укриття, щойно знову почнеться стрілянина. Але поступово вони зрозуміли, що все скінчилося. Люди Бразилії перемогли в Колумбії, і в їхньому осяжному майбутньому був мир.\n\nА разом із миром прийшли іноземні інвестиції. Хоча іноземні кораблі, що насувалися до зруйнованих портів Колумбії, спершу лякали багатьох мешканців, бразильці прибули з важкими гаманцями, а не зі зброєю, готові допомогти у відбудові та отримати за це добру винагороду. Делегації зустрічалися в найменш постраждалих готелях Боготи, щоб укласти торговельні угоди, а президенти обмінювалися телефонними дзвінками, вітаючи Колумбію з нещодавньою перемогою.\n\nУ повітрі все ще відчувається нерішучість. Ла Віоленсія затьмарює думки багатьох колумбійців. Ба більше, для багатьох із тих, хто не насолоджується розкішшю міського життя, конфлікт триває. Та для небагатьох щасливців привабливо кличе інше відчуття. Поклик миру, світу, який раніше існував лише в їхніх мріях. Світу, де їм не потрібно боятися повернення парамілітарів, які спалюють родини живцем у їхніх домівках і грабують те, що залишає по собі полум'я. Світу без кошмарів..."
  BRA_colombia.3.a: "Вони працюватимуть, щоб перетворити його на реальність."

  BRA_colombia.4.t: "Дорога додому"
  BRA_colombia.4.desc: "Менш ніж за милю на північ від річки Куарі палало невелике багаття, навколо якого згуртувалися для тепла загублені сини Бразилії. Крах фронту загнав їх усіх у джунглі — жалюгідна картина паніки та дезорганізації, через яку агенти й офіцери бразильської армії опинилися самотніми в колумбійських джунглях. На краю світла від багаття лейтенант Вітор Пірес Кабрал своїм ножем із кліп-пойнтом вирізав на дереві своє ім'я та імена шістьох інших: ЛЕАЛ, АЛВАРЕС, КЛЕМЕНТЕ, МАРТІНС, ФОНТАНА, ЕСТЕВЕС. Він очікував, що всі вони загинуть; він не хотів, щоб усі вони були забуті.\n\nІнші шестеро зібралися навколо багаття та обговорювали свій наступний крок. Усі загалом погоджувалися, що мають два варіанти: йти за Куарі до Амазонки, а потім за течією до якогось населеного пункту. Ризиковано, адже вони могли потрапити в полон до ворога, який, без сумніву, патрулював околиці в пошуках відсталих бійців, розгромлених ними на полі бою. Леал запропонував інший варіант: рухатися на південь крізь джунглі й сподіватися, що вони вийдуть до Бразилії.\n\nАлварес вказав на карту, зазначивши, що вони лише за двадцять кілометрів від річки Ісана, уже в межах Бразилії. Клементе вилаяв їх обох: хіба вони не розуміють, наскільки заблукали в джунглях? Мартінс намагався всіх заспокоїти, але не міг заперечити, що вважає небезпечним заходити в місто, якщо воно підтримує новий уряд. Фонтана вказав на очевидне: яким би не був результат, якщо вони залишаться тут, то помруть.\n\nКоли Кабрал повернувся до групи, Естевес саме гасив вогонь. Він наказав йому відпочити. Вони рушать на південь із першим світлом. Він заліз у свій спальний мішок і спробував заснути, але цвірінькання комах, тихий дощ і страх перед ворожим патрулем не давали йому по-справжньому відпочити."
  BRA_colombia.4.a: "Так близько до дому, але так далеко."

  BRA_colombia.5.t: "Нове партнерство"
  BRA_colombia.5.desc: "Адемар де Баррос переставляв речі на своєму столі, коли його телефон задзвонив уже вп'яте за день. «Добрий день, пане президенте». Колумбійський посол тепло привітався. «Від усіх нас бажаємо, щоб ви добре освоїлися у своєму новому кабінеті». Адемар хихикнув, уже міркуючи, чого вони від нього хочуть. Проте вирішив підіграти.\n\n«Безперечно». Він відкинувся в шкіряному кріслі. «Так само сподіваюся, що вдома все добре». Запала незручна тиша, ніби посол збирався з духом. «Алло?»\n\n«Правду кажучи, пане президенте, справи тут могли б бути значно кращими», — визнав посол. Відірвавшись від слухавки, Адемар пирхнув і похитав головою. Це ж Колумбія, там ніколи нічого не йде добре. «Ми розуміємо, що попередня адміністрація надсилала допомогу Революційному союзу».\n\nАдемар переглянув стос паперів в одному з розвідувальних зведень і витягнув той, що стосувався Колумбії. «Ми просимо вас перенаправити вашу допомогу уряду тут, у Боготі. Це відповідає нашим спільним інтересам». Президент витягнув із стосу ще один папір, поки посол продовжував свою промову. Наполовину написана записка закликала відмовитися від лівих радикалів. «Якщо ви все ще не переконані, це також буде у ваших інтересах, пане президенте. Ми можемо гарантувати можливий... подарунок за вашу щедрість». Адемар усміхнувся, дістаючи ручку.\n\n«Маєте моє слово. Сьогоднішній день стане днем великого партнерства»."
  BRA_colombia.5.a: "«Дякую, пане президенте. Обіцяємо, що ви не пошкодуєте про це рішення»."

  BRA_colombia.6.t: "Зміна союзників"
  BRA_colombia.6.desc: "«Добрий день, пане президенте. Сподіваюся, ви добре освоюєтеся». Лінкольн Гордон привітався. Карлос Ласерда взяв блокнот і олівець. Якщо американський посол телефонував особисто, це мало бути важливо. «Мені сказали, що вас належним чином поінформували про ситуацію в Колумбії?» Ласерда видихнув.\n\n«Так, пане Ґордоне», — відповів Ласерда, затиснувши перенісся. Боже, який безлад. Досі він не змінював жодної політики попередньої адміністрації. Безпека на кордоні та зброя уряду Боготи. «Чи є ще щось, що мені потрібно знати?» На мить запала тиша, перш ніж заговорив Ґордон.\n\n«Насправді, у мене є прохання від Вашингтона, пане президенте», — відповів посол. «Ми хотіли б, щоб ви перенаправили підтримку від центрального уряду до Революційного союзу. Вони значно більш схильні до співпраці». Ласерда скривився, записуючи в блокноті «підтримка URC». «Це все, чого ми просимо, пане президенте. Гарного дня».\n\n«І вам, пане Ґордоне». Ласерда поклав слухавку, дивлячись на три літери перед собою. Він знав із власного досвіду, що соціялісти — небезпечні люди. Проте, якщо Сполучені Штати готові підтримати Союз, це означало, що вони не завдаватимуть Бразилії клопоту, якщо захоплять контроль над країною. До того ж Ласерді було б значно небезпечніше виступити проти їхнього наймогутнішого друга."
  BRA_colombia.6.a: "Він набрав номер розвідки."

  BRA_colombia.7.t: "Колумбійське питання"
  BRA_colombia.7.desc: "Палац Ітамараті був тихішим, ніж зазвичай, якщо не рахувати шелесту паперів і приглушених голосів, але президент Лотт знав, що спокій триватиме недовго. Серія карт і папок, що документували фракції колумбійської Віоленсії, захаращувала різні столи та дошки оголошень. Бразилія офіційно ще не підтримала жодну фракцію конфлікту публічно, але не мала наміру дозволяти фашизму захопити свого північного сусіда. Однак досі не було визначено, кого саме підтримувати.\n\n«Американці чітко висловили свою позицію щодо цього питання», — почав Саллес, показуючи на карту, що відображала рухи та позиції революціонерів у джунглях Колумбії. — «Ґайтаністи — їхні фаворити в цій боротьбі та наша найбезпечніша ставка, щойно лінії фронту знову почнуть зміщуватися».\n\n«Найбезпечніша? Для кого?» Жаїр Рібейро похитав головою. «Вони пов'язані з радикалами, майже такими ж поганими, як фашистські щури, і з не меншим потенціалом для шкоди». Генерал продовжив, показуючи пальцем на фотографію військового, який виступав перед натовпом у столиці Колумбії. «Якщо йдеться про те, щоб визначити, хто правитиме Боготою, ми повинні стати на бік людини, яка вже її контролює; судячи з побаченого, він стає ще одним Флоріано Пейшото».\n\nЛотт зацікавлено підняв голову й потер підборіддя, перш ніж Саллес знову заговорив. «Янкі вважають його трохи непередбачуваним; вони налаштовані працювати з червоними. Змінити їхню думку було б не неможливо, але Пінільї доведеться чимало переконувати, щоб це сталося»."
  BRA_colombia.7.a: "«У Боготи є потенціал, спробуймо налагодити між ним і Вашингтоном канал зв'язку»."
  BRA_colombia.7.b: "«Американці мають рацію, ми підтримуватимемо ґайтаністів»."

  BRA_colombia.8.t: "Колумбійський безлад"
  BRA_colombia.8.desc: "Палац Ітамараті був тихішим, ніж зазвичай, якщо не рахувати шелесту паперів і приглушених голосів. Серія карт і папок, що документували фракції колумбійської Віоленсії, захаращувала різні столи та дошки оголошень. Бразилія офіційно ще не підтримала жодну фракцію конфлікту публічно, але не мала наміру дозволяти фашизму захопити свого північного сусіда. Однак досі не було визначено, кого саме підтримувати.\n\nПрезидент Ласерда, який ніколи не любив довгого мовчання, висловив свою думку щодо цього питання. «Ці ґайтаністи нічим не кращі за тих юстиціалістів в Аргентині», — почав він із пирханням. — «Того дня, коли вони зможуть встановити дієву демократію, свині зможуть літати». Решта кімнати відповіла хоровим киванням і приглушеним бурмотінням згоди, перш ніж прорвався інший голос.\n\n«Як би там не було, американці твердо стоять за них», — Маґальяйнс знизав плечима. «Єдиний інший вибір, який не носить ледерхозен або якийсь інший різновид фашистського вбрання, — це [COL.GetLeader], і вони йому не довіряють».\n\n«І правильно роблять! Він нічим не відрізняється від виродків з Іберії!»\n\n«Як би там не було», — втрутився Ґолбері, — «якщо ми зможемо самі й разом з американцями закріпитися всередині його уряду, це може стати справжнім поштовхом для лібералів та інших поміркованих у Боготі. Можливо, вони зможуть посадити його найгірші сторони на ланцюг»."
  BRA_colombia.8.a: "«Краще за червоних, подивімося, чи зможуть він і Вашингтон порозумітися»."
  
  USA.COL_faction_support_tt: "§YЯкщо переговори завершаться успішно, ми залишимо КРУ та допоможемо Республіці під проводом [COL.GetLeader], якщо Колумбійська громадянська війна відновиться.§!"
  
  COL_USA_negotiation.0.t: "Колумбійський кандидат"
  COL_USA_negotiation.0.desc: "У Державному департаменті США рідко видавався день не метушливим, але деякі дні підкидали сюрпризи цікавіші за звичайні. Сьогодні держсекретар читав пропозицію бразильців щодо Колумбійської кризи: залишити революціонерів, які відбувають свій час у джунглях, на користь нового уряду Боготи. Офіційно відносини між Сполученими Штатами та урядом Колумбії були заморожені роками, а контакти між ними формально припинилися ще 1957 року. Пропозиція Бразилії виступити посередником була несподіваною, але віталася тими, хто мав застереження щодо озброєння соціялістичних революціонерів.\n\nТому держсекретар склав список пропозицій для нового колумбійського уряду, щоб показати, що вони готові до співпраці й хочуть дистанціюватися від фашистської диктатури, яку замінили. Він на мить переглянув скорочену версію списку, а саме два найважливіші пункти: перший — публічне засудження Германії. Сподіваємося, це буде легкою частиною. Другий — компенсація за націоналізовані американські активи. Це буде значно складніше.\n\nБез сумніву, колумбійці матимуть власні вимоги, але поки що держсекретар був задоволений тим, що мав. Потім він занотував собі ще одну думку: поставити Лінкольна Ґордона та його штаб на чолі переговорів і забезпечити йому канал зв'язку з агентом ФБР, який перебуває всередині бразильського посольства в Боготі."
  COL_USA_negotiation.0.a: "Ґордон розумний чоловік; він упорається."

  COL_USA_negotiation.1.t: "Ніч у Боготі"
  COL_USA_negotiation.1.desc: "Офіційно США відкликали весь персонал із материкової Колумбії після відкликання свого посла 1957 року. Неофіційно вони зберегли численні контакти та агентів по всій країні, найважливішим із яких було ФБР. Для Ґордона Лінкольна його контактом мав стати чоловік, який перебував усередині бразильського посольства. «Hola, sí, sí, soy Lincoln. Necesito hablar con William. Sí, esperaré en línea».\n\nМинуло ледве хвилину, перш ніж на лінії почувся виразно американський акцент. «Вільям слухає. Наскільки я розумію, у вас є певні вимоги?»\n\n«Так би мовити», — протягнув Ґордон. «Сполучені Штати зацікавлені у відновленні відносин із Колумбією, за певних умов».\n\n«Звісно. Щоб забезпечити безперебійне обговорення, я рекомендую висувати ці питання по одному».\n\n«Я думав так само. Тож гадаю, почнемо з чогось простого: публічного засудження Німеччини та її так званого Пакту єдності».\n\n«Хм. Я бачу, що уряд може це прийняти. Мало хто ставиться до лауреаністів та їхнього ґерманофільства з великою повагою. Хоча, я певен, ви розумієте, що ми аж ніяк не можемо дозволити собі відмовлятися від допомоги, яка надходить, не знайшовши спершу нового джерела»."
  COL_USA_negotiation.1.a: "«Сподіваймося, він зробить правильний вибір»."
  COL_USA_negotiation.1.tt: "Якщо вимогу прийнято:"
  COL_USA_negotiation.1.ttt: "§sКрайні праві елементи правлячої коаліції§! будуть послаблені, якщо @COL §fКолумбія§! погодиться."
  
  COL_USA_negotiation.2.t: "Розрив із Райхом?"
  
  COL_USA_negotiation.3.t: "Передайте газету"
  COL_USA_negotiation.3.desc: "Тепле повітря Бразилії запітніло вікна посольства й скропило листя кришталевими краплями роси. Лінкольн Ґордон вийшов на передні сходи з чашкою кави в руці й побачив, як американські та бразильські співробітники передають один одному ранкову газету. Він дочекався своєї черги й почав незграбно перегортати сторінки.\n\n«Як просуваються уроки португальської? Не зможеш насолоджуватися O Globo, якщо не вмієш читати», — сказав колега, штовхнувши його плечем.\n\n«Потроху», — Ґордон похитав головою, пробігаючи очима заголовки, і тут він знайшов його.\n\n«КОЛУМБІЙСЬКИЙ ЛІДЕР ЗАСУДЖУЄ ГЕРМАНІЮ».\n\nПоруч була фотографія колумбійської делегації, і коли колега запропонував перекласти, Ґордон ввічливо відмахнувся, відклавши це на потім. Звісно, знадобиться детальніший звіт, але заголовок він зрозумів достатньо добре. Богота зробила очікуване й дослухалася американської поради, і наразі у світі все було добре. Він усміхнувся, по-справжньому вдихнув смажений аромат своєї кави й передав газету наступному хлопцеві."
  COL_USA_negotiation.3.a: "Очікувано чи ні, але успіхами можна тішитися."

  COL_USA_negotiation.4.t: "Новини під час обіду"
  COL_USA_negotiation.4.desc: "«Телеграма з колумбійського посольства, пане президенте».\n\nЗазвичай [BRA.GetLeader] відмахнувся б від будь-якого помічника під час обіду, але на цю новину він давно очікував. Він відклав виделку з рисом і жестом попросив прочитати повідомлення.\n\n«Колумбійський уряд офіційно засудив Германію за її втручання в колумбійські справи, зокрема за її втручання у громадянський конфлікт». [BRA.GetLeader] прочитав уголос із дедалі ширшою усмішкою та розслабленими плечима. Він прочитав реакцію американців, які, звісно ж, були дуже задоволені, й уявив, як лютують німці.\n\nБогота, як і сподівалися, виявилася правильним вибором для інтересів Бразилії й, відповідно, Америки. Справді, це був той кінь, на якого варто було поставити. [BRA.GetLeader] подякував помічникові, вже обмірковуючи наступні етапи дипломатичного наступу в Боготі. Принаймні він був радий, що його обід не зіпсовано."
  COL_USA_negotiation.4.a: "Усе смакує солодше з присмаком перемоги."

  COL_USA_negotiation.5.t: "Підвести нашого коня до води"
  COL_USA_negotiation.5.desc: "Новини про події в Колумбії дісталися палацу Алворада швидше, ніж решти Бразиліа, а тим більше решти світу. Саме так [BRA.GetLeader] дізнався про масштаби безладу раніше за всіх.\n\n«Колумбійці категорично відмовляються робити будь-які заяви, які могли б розлютити німців», — йшлося в телеграмах із Боготи. «Переговорники США розчаровані. Ми зайшли в глухий кут».\n\n[BRA.GetLeader] замислився, куди поділася ця покірна Колумбія, яка не наважилася б образити німців, що допомагають руйнувати її країну, коли настав час вести переговори з Бразилією. Він також замислився, чи не обрала Бразилія не того коня, коли вирішила підтримати його, а не Ґайтаністів.\n\n«Якби це були Ґайтаністи, ми навіть не обговорювали б Німеччину», — пробурмотів [BRA.GetLeader]."
  COL_USA_negotiation.5.a: "Ми маємо жити з минулими рішеннями, правильними чи ні."

  COL_USA_negotiation.6.t: "Незграбна Богота"
  COL_USA_negotiation.6.desc: "Пізній нічний дзвінок ніколи не був добрим знаком. Лінкольн Ґордон, піднімаючи слухавку, вже очікував раптових поганих новин, і зітхання Вільяма на іншому кінці лінії це підтвердило.\n\n«Ти не можеш бути серйозним».\n\n«Повір, я й сам хотів би, щоб це було не так», — сказав Вільям. «Вони відмовилися. Богота зайшла в глухий кут і досі відхиляє наші пропозиції. Не хочуть розривати зв’язки з німцями».\n\n«З тими самими німцями, які підтримують їхніх супротивників, що хочуть їх убити», — пробурмотів Ґордон.\n\n«За основною версією, вони більше залежать від гаманця Фюрера, ніж ми думали». Це було настільки абсурдно, що Ґордон розсміявся б, якби не ризикував через це отримати прочухана у Вашингтоні.\n\nПосол, здавалося, помітив мішки під його очима наступного ранку й одразу ж зв’язався з бразильцями.\n\n«Це була їхня ідея вести переговори з Боготою, тож нехай краще мають план Б», — попередив Ґордон, а посол нервово смикнув комір.\n\n«Вони кажуть продовжувати переговори. Не відхилятися від курсу, доки Богота не погодиться, а вона погодиться».\n\n«Не відхилятися від курсу...» Він стримав гіркий коментар. Це ж не Бразиліа виглядала б погано в очах його начальства, якби Колумбію не вдалося приборкати. Та все ж, що йому дасть скаржитися?"
  COL_USA_negotiation.6.a: "Так чи інакше, Колумбія перестане їсти з руки, яка її била."

  COL_USA_negotiation.7.t: "Компенсація за націоналізацію"
  COL_USA_negotiation.7.desc: "Вільям із кам’яним виразом обличчя перечитав інструкції Державного департаменту. Схоже, вони наполягали на компенсації за націоналізовані активи, а саме за філії, захоплені лауреаністами ще у 50-х роках — подію, яка стала однією з головних причин розриву американсько-колумбійських відносин.\n\nВимога Державного департаменту буде дуже складною, адже вона підніме чимало поганих спогадів у обох сторін, особливо за людини на кшталт [COL.GetLeader] при владі. З усього, що йому вдалося дізнатися про нового лідера Колумбії, націоналізація іноземних активів була однією з небагатьох речей, щодо яких він і лауреаністи, здавалося, погоджувалися, і легко поступатися тут він не збирався.\n\nТа це питання було важливим, якщо їхні уряди хотіли досягти угоди. Залишалося сподіватися, що інстинкт самозбереження Боготи переважить її ідеологічну відданість."
  COL_USA_negotiation.7.a: "Простягаючи тернисту оливкову гілку..."
  COL_USA_negotiation.7.tt: "Якщо вимогу прийнято:"

  COL_USA_negotiation.8.t: "Переговори на ходу"
  COL_USA_negotiation.8.desc: "Коли ти канцлер палацу Ітамараті, то встигаєш дізнатися чимало. Одне з менш приємних відкриттів — наскільки мало спиш на цій посаді. Одне з більш тривожних — те, що дипломатія між великими державами є мистецтвом, яке вимирає, а сама кількість безтактності, яку вони здатні втиснути в одне-єдине повідомлення, майже вражає.\n\nЯнкі вимагали, щоб кожна компанія, націоналізована колумбійським урядом, якнайшвидше повернулася в американські руки. Це було настільки ж абсурдно, наскільки й образливо, і [COL.GetLeader], попри всі свої недоліки, не мав би бути неправий, якби не поступився перед чимось настільки принизливим. Канцлер постукував однією рукою по столу, обмірковуючи альтернативи.\n\nБогота відкинула б компенсацію за всі активи, але переговори не обов’язково мали на цьому завершуватися. Можливо, якби [COL.GetLeader] твердо стояв на своєму щодо повної компенсації, але мав на думці зустрічну пропозицію, можна було б досягти компромісу. Звісно, американці не були б цим задоволені. Канцлер обережно простягнув руку до телефону."
  COL_USA_negotiation.8.a: "Порадити Боготі зробити зустрічну пропозицію."
  COL_USA_negotiation.8.b: "Краще задовольнити американців."
  
  COL_USA_negotiation.9.t: "Вашингтон вимагає активи"

  COL_USA_negotiation.10.t: "Колумбійський компроміс?"
  COL_USA_negotiation.10.desc: "«Щойно отримав відповідь із Боготи, він каже, що ми вимагаємо забагато—» — почав Вільям, його голос переривався легким тріском, — «але він готовий зустрітися посередині».\n\nҐордон важко зітхнув. «Поясни, будь ласка, що ти маєш на увазі під «посередині».» Якщо останній герой Боготи не збирався завдати йому головного болю, то Ґордон мав передчуття, що відповідь Державного департаменту це зробить.\n\n«Ну, він готовий повернути частину акцій усіх компаній, які були націоналізовані». Вільям зробив паузу, щоб дати словам осісти, перш ніж продовжити. «Він наполягає, що вони будуть життєво необхідними для післявоєнної відбудови, і що Колумбія не може дозволити собі повернути все».\n\nЗізнатися, ця угода все одно була б кращою, ніж нічого не отримати. Але це не змінювало того факту, що постійний спротив палацу Наріньйо неодмінно розворушить чимало осиних гнізд. Ґордон обміркував можливі наслідки, перш ніж зробити свій вибір."
  COL_USA_negotiation.10.a: "«Гаразд, дай йому знати, що ми теж можемо зустрітися посередині»."
  COL_USA_negotiation.10.b: "«Скажи йому: або буде по-нашому, або не буде ніяк»."

  COL_USA_negotiation.11.t: "Богота відмовляється компенсувати"
  COL_USA_negotiation.11.desc: "Вільям скривився, складаючи свій останній звіт про переговори з Центральним урядом. Бразильці передали йому вимоги Державного департаменту щодо компенсації, або принаймні їхню пом’якшену версію. Та це мало що змінювало, бо Каса де Наріньйо рішуче відмовилася: колумбійський уряд за жодних обставин не поверне американські активи, які він узяв під свій контроль.\n\nВільям уже міг уявити реакцію Ґордона та решти Державного департаменту: обурення, гнів. Не здивувався б, якби дехто з них захотів завершити переговори просто зараз. У будь-якому разі це стане серйозною невдачею, і Боготі доведеться діяти обережно, якщо вона все ще хоче отримувати американську допомогу."
  COL_USA_negotiation.11.a: "Краще вже зробити ці дзвінки..."

  COL_USA_negotiation.12.t: "Ціна вступу"
  COL_USA_negotiation.12.desc: "Він справді це зробив.\n\nЛінкольн Ґордон був так само приголомшений, читаючи заяву в своїх руках, як і тоді, коли Вільям заздалегідь повідомив йому про це телефоном; розмова завершилася саме в ту мить, коли аркуш паперу опинився в нього на колінах у кабінеті посольства в Бразиліа. За всіма мірками це мало бути однозначно добре, принаймні для Вашингтона, і все ж...\n\n[COL.GetLeader] міг скільки завгодно бити себе в груди й змушувати всі державні пропагандистські канали зображати себе другим пришестям Болівара, але більшість людей уже знала, в чому річ. Жоден політичний чи військовий лідер не мав режиму, позбавленого докору. Ні колумбійці, ні іспанці чи португальці, ні італійці, навіть німці. Завжди знаходився хтось, хто надійно й потроху підточував підвалини уряду.\n\nТим більше причин, припускав Ґордон, чому Богота нарешті підкорилася американським вимогам. Колишні американські активи в Колумбії, ті самі, які [COL.GetLeader] наказав націоналізувати, мали бути беззастережно повернуті без жодних нарікань. Принаймні без нарікань самого [COL.GetLeader] — або принаймні таких, які він був готовий висловити публічно.\n\nМожливо, Ґордон просто надто все ускладнював. Це могла бути щира спроба вести переговори добросовісно, хоча б заради того, щоб здобути для себе важелі впливу. Утім, відновлення американського контролю над своїми активами в Колумбії було великим здобутком. Якщо, звісно, переговори й надалі розвиватимуться на користь Вашингтона."
  COL_USA_negotiation.12.a: "Спроба розрядки чи початок угоди про визнання провини?"

  COL_USA_negotiation.13.t: "Час висунути наші вимоги"

  COL_USA_negotiation.14.t: "Тропічна пиха Боготи"
  COL_USA_negotiation.14.desc: "Кабінет президента в Планалту зустрів новину з тихим полегшенням — рідкісним явищем у світі південноамериканської геополітики. І [BRA.GetLeader], і радник Ітамараті матимуть повні руки роботи, але, якщо все пройде гладко, Бразиліа та її союзники у Вашингтоні нарешті зможуть щось отримати від Боготи.\n\nВимоги уряду були відносно простими: колумбійський суверенітет над Сан-Андресом і навколишнім архіпелагом. Розумна вимога, зважаючи на те, що до початку Ла Віоленсії це була колумбійська територія, доки янкі не захопили її. Менш розумна вимога, якщо зважати на те, що корінні мешканці архіпелагу більше не хотіли мати нічого спільного з Боготою. Та якщо це була морквина, якою можна було принадити прихильників Республіки в Боготі, сторони могли з цим працювати.\n\nЗа дорученням [BRA.GetLeader] до Ітамараті в Ріо почали надходити телефонні дзвінки, щоб розпочати процес передачі Карибських островів. Можна сказати, що Бразилії не завадив би такий успіх — і не лише заради тепліших відносин із Колумбією. Загальне сприйняття ролі Бразилії в ОВН важко відокремити від образу Бразилії як маріонетки американських інтересів у регіоні. Зрештою, завдяки своїй ролі у владнанні угоди з [COL.GetLeader], бразильські лідери могли б позбутися частини цього тавра й додатково легітимізувати себе як повноцінного партнера у забезпеченні інтересів ОВН у Південній Америці."
  COL_USA_negotiation.14.a: "Сподіваємося, нам це вдасться."
  COL_USA_negotiation.14.tt: "§F§YSан-Андрес і Провіденсія§! будуть повернуті @COL§fКолумбії§! після завершення §RКолумбійської громадянської війни§!."

  COL_USA_negotiation.15.t: "Крапки на мапі"
  COL_USA_negotiation.15.desc: "«Пане секретарю, Богота домагається повернення Сан-Андреса та Провіденсії».\n\n«Мені потрібно трохи більше контексту. Що кажуть бразильці? Де взагалі розташовані Сан-Андрес і Провіденсія? На чому ґрунтуються претензії Колумбії? Навіщо ми там?»\n\n«Перепрошую, пане секретарю, ми не мали часу підготувати офіційний звіт. Сан-Андрес і Провіденсія — карибський архіпелаг, розташований ближче до Нікарагуа, ніж до Колумбії, але Нікарагуа визнала претензії останньої в договорі 1928 року. Коли Ла Віоленсія загострилася, ми окупували острови, щоб зберегти порядок і запобігти злочинності після того, як Богота втратила будь-яку можливість поширювати свою владу так далеко. Острови малонаселені й мають обмежену стратегічну чи економічну цінність — передусім це туристичне місце. Ітамараті наполягає на передачі, стверджуючи, що повернення цієї землі покращить нашу репутацію в усій Америці».\n\n«Зробити так, щоб Бразилія добре виглядала в процесі, я припускаю. Гаразд — дістаньте мені цей звіт і повідомте, чи не заперечуватимуть якісь сенатори проти повернення архіпелагу. За умови, що вони остаточно припинять свою громадянську війну й... і поводитимуться добре».\n\n«Так, пане секретарю, насправді кілька сенаторів уже—»"
  COL_USA_negotiation.15.a: "«Якщо у звіті не буде іншого, починайте готуватися до їхнього майбутнього повернення»."
  COL_USA_negotiation.15.b: "«Тоді залишаємо собі Сан-Андес чи як там його називають. Надішліть мені звіт для формальності»."

  COL_USA_negotiation.16.t: "Дядько Сем кидає залізні кості"
  COL_USA_negotiation.16.desc: "Образ Каса де Наріньйо повільно зникав у дзеркалі заднього виду, коли службовий автомобіль їхав вулицями Боготи, а у голові Вільяма лунали лише слова [COL.GetLeader]. Щодо угоди все, здавалося, було готово. Бразилія офіційно визнала її, США (здебільшого) дали зелене світло, і тепер [COL.GetLeader], схоже, остаточно її уклав.\n\nНавіть колумбійські військові були в захваті від угоди — рідкісна річ у власному досвіді Вільяма щодо Боготи. Він навіть отримав офіційне запрошення на вечерю, велику честь, але Вільям мав інші зобов’язання. Очевидно, Богота принаймні певною мірою щиро ставилася до американського союзу; ще краще — Колумбія в процесі отримувала територію в Карибському морі.\n\nУтім, усе це все ще було лише попереднім етапом, навіть якщо метафоричне чорнило на угоді ще не висохло. Громадянська війна все ще вирувала, і навіть якщо Богота переможе, ліві партизани та сили, підтримувані країнами Осі, ймовірно, залишатимуться проблемою ще багато років. Обложений Центральний уряд, імовірно, також покладатиметься на США в цій боротьбі, але наразі режим [COL.GetLeader] ішов уперед."
  COL_USA_negotiation.16.a: "Спадкоємці Вашингтона стали на бік учня Болівара."

  COL_USA_negotiation.17.t: "Радіонаднова"
  COL_USA_negotiation.17.desc: "МАНДАТ ОВН ЩОДО ЗБЕРЕЖЕННЯ КОНТРОЛЮ НАД СПІРНИМИ ОСТРОВАМИ\n\nЩойно Вільям прочитав статтю, він почув, як по радіо вже лунала майбутня промова. Сполучені Штати сприйняли прохання Пінільї повернути острови як крок, що заходить надто далеко. Формулювання відповіді було відносно делікатним і навіть офіційно визнавало його подальшу владу над островами, але заява, що попереджала про нестабільність, яка триватиме, та потреби регіональної безпеки, могла бути написана кров’ю.\n\n«Знову американці продемонстрували своє презирство до цілісності Колумбії», — ревів Пінілья, його лють проривалася крізь динамік. «Мої спроби просто повернути острови, несправедливо окуповані Сполученими Штатами, зазнали невдачі, і вони залишатимуться такими ще довго. Вашингтон заявляє, що захищатиме їх від тиранії націонал-соціялізму, але їхні зуби блищать світлом кинджала, поки вони жадають права розділити ще більшу частину Колумбії».\n\nВін зітхнув і зменшив гучність радіо. Звісно, бразильці також будуть розчаровані. Він не вільно володів португальською, але йому не потрібно було цього, щоб знати, скільки обіцянок Бразиліа давала йому в обмін на його пропозицію. Незалежно від того, чи містили вони пряму обіцянку, він знав, на чиєму боці вони стоятимуть, і що протягом тижня його очікуватимуть у Ріо. Він нічого не міг зробити, думав він, окрім як підготуватися до майбутнього обурення, яке висловлять йому обидві сторони.\n\n«Багато хто тебе покинув, але не я. Наразі ці острови все ще можуть бути окупованими, проте так само, як я знаю, що Колумбія не приречена на вічну громадянську війну, я знаю, що Сан-Андрес і Провіденсія не приречені на окупацію. Я й надалі наполегливо працюватиму над їхнім поверненням і продовжуватиму боротися за об’єднання Колумбії всіма необхідними засобами»."
  COL_USA_negotiation.17.a: "Обіцянка насильства, виголошена напередодні майбутньої боротьби."

  COL_USA_negotiation.18.t: "Лист із презирством до Вашингтона"
  COL_USA_negotiation.18.desc: "ВІД: ПАЛАЦУ ІТАМАРАТІ СПОЛУЧЕНИХ ШТАТІВ БРАЗИЛІЇ\n\nКОМУ: ДЕРЖАВНОМУ СЕКРЕТАРЮ СПОЛУЧЕНИХ ШТАТІВ\n\nТЕМА: ПОВЕРНЕННЯ ОСТРОВІВ САН-АНДРЕС І ПРОВІДЕНСІЯ\n\nМи глибоко стурбовані продовженням Мандату над колумбійськими територіями. Від моменту здобуття незалежності вони юридично були частиною колумбійської держави й неодноразово демонстрували свою відданість державі Колумбія, попри минулі спроби передати ці території Панамі.\n\nКолумбія може переживати заворушення, але цього самого по собі недостатньо, щоб захоплювати територію. Законний Президент Колумбії досі керує значною частиною країни, включно зі столицею Боготою. Жодних правових підстав, окрім тих, що випливають із Римсько-Берлінської Осі, для виправдання цієї окупації не існує, не кажучи вже про якісь розмиті заяви про стабільність.\n\nУряд Боготи був готовий взаємодіяти зі Сполученими Штатами Америки та Бразилією й розпочав переговори з Організацією Вільних Націй. Його вимоги не є надмірними й походять виключно з бажання об’єднати власну країну. Окупація цих островів Сполученими Штатами послабить їхні претензії та завадить їхнім зусиллям із відновлення стабільності.\n\nХоча американський уряд може не визнавати цієї претензії, Бразилія залишається непохитним союзником Колумбії й надалі вважатиме цю окупацію незаконною та свавільною. Ми підтримуємо колумбійський уряд у його зусиллях відновити контроль над країною й попереджаємо Сполучені Штати, що подальші порушення суверенітету в Латинській Америці матимуть наслідки."
  COL_USA_negotiation.18.a: "Єдиний фронт виникає з самих низів."

  COL_USA_negotiation.19.t: "Зробити правильний вибір"
  COL_USA_negotiation.19.desc: "«Дякую за ваш час», — сказав [COL.GetLeader], — «але в мене є останнє прохання. Гадаю, ви вже знаєте, яке саме». Державний секретар кивнув, поправляючи кімібайю, яку [COL.GetLeader] подарував йому. Це була одна з багатьох дрібничок, що прикрашали кабінет.\n\n[COL.GetLeader] продовжив: «Оскільки ми є Центральним урядом Колумбії, а наша громадянська війна завершилася, гадаю, буде лише справедливо, якщо нас знову приймуть до Організації американських держав».\n\nДвоє на мить замовкли, а Державний секретар постукав ручкою по столу. [COL.GetLeader] знав, що його вимога була серйозною, але вона мала сенс. Усіх радикалів уже не було, та й [COL.GetLeader] аж ніяк не був найгіршим кандидатом на перемогу. Ці новогранадські виродки не дісталися б навіть до США, не кажучи вже про Фоґґі-Боттом.\n\nДержавний секретар заговорив: «Гадаю, ми можемо погодитися на ваше повернення». [COL.GetLeader] усміхнувся й подякував Державному секретарю. «Дякую, пане». З цими словами [COL.GetLeader] усміхнувся й вийшов, радіючи майбутньому поверненню до Боготи."
  COL_USA_negotiation.19.a: "І з цим Колумбія повертається до спільноти."
  COL_USA_negotiation.19.a.tt: "@COL §fКолумбія§! приєднається до §BОрганізації американських держав§!!"
  COL_USA_negotiation.19.b: "Але все це було брехнею."

  COL_USA_negotiation.20.t: "Таємний прихильник"
  COL_USA_negotiation.20.desc: "Кілька тижнів [BRA.GetLeader] вважав, що північний кордон був напрочуд тихим. Після врегулювання суперечки щодо островів Сан-Андрес і Провіденсія канцелярія Ітамараті здебільшого переключилася на інші нагальні справи, а Богота знову замовкла. Коли пролунав стукіт у двері, за яким почувся знайомий голос, [BRA.GetLeader] зрозумів, що ця коротка передишка скінчилася.\n\n«Богота хоче знову вступити до Організації американських держав», — відповів канцлер, гортаючи папку, щоб дістати найважливіший документ. «Звісно, нічого дивного в цьому повідомленні немає. Міжнародно визнаний уряд, прихильний до Сполучених Штатів і дипломатії, хоче отримати престиж і брати участь у ширшому форумі».\n\n[BRA.GetLeader] підняв брову, пробігаючи очима по папці. «Я не бачу в цьому проблеми. Не те щоб ми приймали Ґайтаністів чи фашистів; ми легко могли б знову призупинити членство Колумбії, якщо вони прийдуть до влади. Чи відповіли американці на цей запит?»\n\n«Учора до нас звернулися і Богота, і Вашингтон», — нерішуче відповів він, — «і Вашингтон, схоже, не хоче брати на себе зобов’язань, поки Колумбія залишається нестабільною, але вони не відкинули цю ідею прямо. Вони знають нашу позицію й не згадували б про це з нами, якби хотіли повністю її відхилити».\n\n[BRA.GetLeader] похитав головою. «Я можу зрозуміти їхні побоювання, але якщо ми мовчатимемо надто довго, команда Боготи винесе це питання на публіку й поставить під загрозу будь-які переговори».\n\n«Якщо все невизначено, нам слід приватно запевнити колумбійців у нашій підтримці. Очевидно, публічно заявляти про це зараз було б безперспективно, але якщо ми приватно зв’яжемося з Каса де Наріньйо, то повинні виграти собі достатньо часу, щоб схилити американців на свій бік»."
  COL_USA_negotiation.20.a: "У цій ситуації скромність — найкраща політика."

  COL_USA_negotiation.21.t: "Приємна нічна чарка"
  COL_USA_negotiation.21.desc: "Пронизливий дзвінок телефону, здавалося, вирвав Лінкольна Ґордона з заціпеніння: очі розплющені, але свідомість поверталася лише тепер, коли його лімбічна система відчула новий подразник. Втомлені очі піднялися вгору. Невже він спав? Він поглянув на звіт у своїх руках, папір безвольно опустився назад. «Інциденти на бразильсько-африканському судноплавному маршруті», датований останніми трьома місяцями. Коли він востаннє взагалі прочитав бодай речення? Він похитав головою. Ледь прочитаний звіт опинився на столі перед ним, коли він підняв слухавку. Йому треба було поспати.\n\n«Ґордон? Вільям. У мене мало часу, тож буду коротким. Богота дуже задоволена перспективою поновлення членства в ОАД, удвічі більше — через публічну підтримку США. Серед наших людей кажуть, що ми на порозі прориву».\n\nЛінкольн усміхнувся, переклавши слухавку до іншого вуха й притиснувши її плечем, поки тягнувся до блокнота та ручки. «Зрозумів, дуже дякую. Є якась інформація про те, наскільки швидко колумбійці мають намір просунути це питання?»\n\n«Помічники в колумбійському таборі сказали моїм знайомим, що настрої серед їхніх представників позитивні, навіть захоплені. Наскільки я бачу, вони прагнуть рухатися вперед, щойно це зробимо ми. Поза вузьким колом довіри про ці розмови поки що ніхто не знає». Лінкольн нашкрябав точне формулювання свого агента FBI.\n\n«Зрозумів. Я негайно повідомлю про це Вашингтон. Будьте напоготові, пане Вільяме, можливо, сьогодні буде довга ніч». Лінкольн із усмішкою опустив слухавку, дивлячись на нашкрябані нотатки. Його втомлене заціпеніння здавалося тепер таким далеким, ніби розвіялося за секунду. Він поглянув на годинник на стіні: трохи за другу. У Вашингтоні було близько опівночі. Секретар, мабуть, уже спав або так само потерпав від вимог втоми."
  COL_USA_negotiation.21.a: "Та хіба можна відмовитися від такої нічної чарки?"

  COL_USA_negotiation.22.t: "Тягар великих очікувань"
  COL_USA_negotiation.22.desc: "Лінкольн Ґордон міг перебувати в кабінетах американського посольства в Бразиліа, але останні кілька годин його телефон звучав так, ніби він був у Боготі. Після того як Сполучені Штати повністю відкинули можливість повернення Колумбії до Організації американських держав, Пінілья став ворожим, вибухаючи тирадами на адресу кожного дипломата, якого зустрічав. Коли задзвонив телефон, Ґордон занепокоєно підняв слухавку.\n\n«Алло, це Лінкольн Ґордон. Хто це?»\n\n«Це президент Рохас Пінілья», — виплюнула слухавка, — «президент Республіки Колумбія». Ґордон задихано зітхнув і відсунув слухавку далі від вух. «Гадаю, це щодо переговорів про Ор—»\n\n«Так, і я дуже хотів би отримати відповіді. Ми були відкриті до співпраці, а натомість мене прирівняли до рівня повстанців, які намагаються знищити цю країну!»\n\n«Послухайте, я не та людина, до якої слід із цим звертатися. Я взагалі не брав участі в угоді, вам доведеться звернутися до американського консульства в Боготі за—»\n\n«Я знаю, наскільки ви впливова людина в Бразилії. Я знаю, що вони мали виступити на нашому боці. Я дуже сумніваюся, що ви не можете проштовхнути це далі».\n\nҐордон насилу знаходив відповідь. Він знав, наскільки погіршитися могла ситуація в Колумбії, і що це могло статися надто швидко, щоб він міг виправдати їхнє повернення. Але він знав, наскільки делікатними були ці переговори, і знав, скільки здобутків можна було втратити. «Такі новини не доходять до мого кабінету раніше, ніж через кілька годин після виступу президента. Боюся, вам доведеться поговорити з дипломатами деінде». У відповідь він почув лише коротке бурмотіння, після чого телефонна лінія обірвалася."
  COL_USA_negotiation.22.a: "Холодний дзвінок."

  COL_USA_negotiation.24.t: "Дзеркальні образи"
  COL_USA_negotiation.24.desc: "Був ранній ранок у палаці Планалту, теплий помаранчевий відтінок світанку ховали хмари на далекому обрії. Попиваючи каву з кухля, Енріке Лотт на хвилину дозволив недавнім труднощам залишитися десь осторонь, бодай тимчасово.\n\n«Пам’ятаєш часи Флоріану Пейшоту, Енріке?» — запитав Хаїр Дантас Рібейро, дістаючи сигару.\n\nЛотт лише розсміявся з цього питання. «Я не настільки старший за тебе, Хаїре, обережніше з такими питаннями», — зітхнув він, відкладаючи склянку. — «Але його спадщина досі помітна. Без його обережної руки, що провела Бразилію через ті роки, Мараґатоси та морські офіцери розірвали б цю країну на частини. Але навіщо ти про нього згадав?»\n\n«Я просто думав», — відповів Рібейро, відвертаючи голову, щоб відмахнутися від диму. — «Ґуставо Рохас Пінілья. Від часу свого перевороту він досяг значного прогресу. Богота міцно в його руках, його поважають на міжнародному рівні, навіть американці. Дай йому кілька років, і він цілком може стати колумбійським Залізним маршалом».\n\nЛотт на мить замислився, а потім похитав головою. «Хотів би я, щоб це було так, Рібейро. Я багато розмовляв із цим чоловіком, і його амбіції сягають значно далі. Він завжди із захопленням говорить про проєкти на десять, п’ятнадцять, двадцять років уперед. Може, навіть проживе достатньо довго, щоб побачити їх завершення». Зчепивши пальці, Лотт нахилився вперед. «Він надто могутній, щоб піти у відставку. Принаймні якщо зможе цьому завадити».\n\nРібейро здивувався такому розвитку подій. «Це тривожно, але Флоріану ніколи не стикався з таким рівнем чвар». Він знову затягнувся сигарою, не підводячи голови. «Що б не сталося, не нам вирішувати його долю. Колумбійці мають підстави, що стоять поруч із анархією, і їм вирішувати, у якому напрямку рухатися»."
  COL_USA_negotiation.24.a: "Дзеркало блищить, але кого воно відбиває — Цинцинната чи Цезаря?"

  COL_USA_negotiation.25.t: "Garganta do Diabo"
  COL_USA_negotiation.25.desc: "Було пізно вночі, але мерехтіння лампи над головою не могло заглушити докори сумління Ласерди. Він знову переглянув документи перед собою — усі файли про Колумбію, які не були спалені після одного-єдиного дзвінка. Вони знову й знову повторювали ті самі тези, розповідаючи про минуле Рохаса Пінільї, його переворот, склад його уряду, і все ж він знову їх переглядав, сподіваючись знайти якийсь новий сенс. Коли він відкинув один із них назад на стіл, то знову прийняв незмінну поразку.\n\nКолумбія, як завжди, була безладом. Держава Пінільї набирала обертів, але як він міг обманювати себе, вважаючи, що насильство завершилося? Ґайтаністи залишалися такими ж небезпечними, як і раніше, встромляючи червоний кинджал просто в серце Амазонії. Сили Хільберто Авенданьйо продовжували животіти, утримуючи свої володіння на далекому заході й жадібно поглядаючи на схід. Сили Пінільї були останньою опорою здорового глузду проти радикалізму його опонентів — заслугою, яка давно мала б здобути його повагу.\n\nІ все ж його серце не відпускало. Він читав звіти про амбіції Пінільї, і вони не обмежувалися громадянською війною. Страти поміркованих дисидентів під час перевороту та зникнення журналістів за «заколот» не давали спокою. Надто близько до того, щоб почуватися комфортно; ще ледве минуло десятиліття, і він сам легко міг спіткати таку долю. Щойно останні партизанські сили буде знищено, він знав, що Пінілья просто закріпить за собою місце серед безлічі диктаторів, що отруюють континент.\n\nЛасерда зітхнув, дивлячись назовні на Місяць. Він давно ухвалив своє рішення. Якщо він хотів залишити Пінілью без влади, час забезпечити це давно минув. Режим Пінільї був чимось більшим за саму людину, і там усе ще залишалося кілька лібералів, які чекали настання миру, щоб заявити про свою владу. За американської та бразильської підтримки, можливо, цей режим за кілька десятиліть зможе перетворитися з нестабільної диктатури на розколоту демократію."
  COL_USA_negotiation.25.a: "Диявол спустився з Джорджії, шукаючи душу..."

  COL_USA_negotiation.26.t: "Дешевше десятками"
  COL_USA_negotiation.26.desc: "Нудьгуючи, Вільям гортав книжку, чекаючи у своїй квартирі. Це був кримінальний роман 1920-х років про детектива, який розслідує вбивства між двома мафіозними родинами, водночас прагнучи визнання свого боса в часи сухого закону. Не більше ніж дешевий бульварний роман, придбаний у випадковій ятці, але це була перша англомовна книжка, яку він бачив за кілька тижнів, якщо не рахувати повідомлень Державного департаменту, і тому сама її новизна привернула його погляд. Щойно він перегорнув сторінку, позаду нього пролунав дзвінок.\n\n«Алло, Вільям?» — запитав Ґордон, лише на мить зупинившись, щоб вдихнути. — «Хотів сказати тобі, що твоя робота завершена. Усе вирішено».\n\nВільям різко підняв очі. «Тоді зустріч пройшла добре?»\n\n«Настільки добре, наскільки ти міг сподіватися. Знадобиться ще кілька днів і пресконференція, щоб зробити це офіційним, але [USA.GetLeader] погодився, що Богота є найкращою фракцією в Колумбії, і готовий визнати її уряд та надати допомогу».\n\nВільям усміхнувся, нахилившись уперед. «Радий це чути, Ґордоне! Я радий, що наша робота допомогла переконати президента стати на правильний бік у цьому питанні». Він трохи відсунув крісло, а потім зупинився. «Чи потрібно мені щось зробити перед поверненням до Вашингтона?»\n\n«Поки що ні, Вільяме. Влада Боготи все ще хитка, і ситуація легко може вийти з-під контролю. Ти залишатимешся активним у Колумбії та працюватимеш над зміцненням впливу Центрального уряду. Сподіваюся, ти розумієш».\n\nВільям спробував відповісти, але виявив, що слухавку вже поклали. Та він сприйняв це спокійно. Очевидно, він досяг успіху, і йому довірили продовжити роботу з відносною свободою. Не маючи більше чим зайнятися, він повернувся до свого роману, читаючи про те, як детектив переслідував, а потім наздогнав патріарха однієї з родин."
  COL_USA_negotiation.26.a: "Оце вже точно надбавка до платні!"

  COL_USA_negotiation.27.t: "Прикрий розвиток подій"
  COL_USA_negotiation.27.desc: "Дзвінок телефону на столі вирвав Лотта з роботи, на якій він був зосереджений. Він зрозумів, що день уже добряче добіг кінця і в кабінеті стало зовсім темно, хоча сонце ще не зайшло, тож увімкнув лампу, піднімаючи слухавку. Лотт почув свого секретаря на іншому кінці лінії. «Пане президенте, посол у Колумбії каже, що має термінові новини, про які мусить із вами поговорити. З’єднати його з вашим кабінетом?»\n\n«З’єднайте», — відповів Лотт. Якщо все пройде добре, це могло б стати великим внеском у майбутню безпеку як ОВН, так і Бразилії. Почувши, як посол привітав його на іншому кінці лінії, Лотт запитав: «Який стан переговорів із Боготою?»\n\n«Колумбійці вийшли з переговорів, а Вашингтон здався. Переговори завершено», — відповів посол. Втомлено зітхнувши, Лотт попрощався з послом і поклав слухавку.\n\nЛотт не міг сказати, що був цілком шокований таким результатом; він очікував, що переговори можуть бути складними. Але це не робило менш прикрим те, що вони не бачили лісу за деревами. Не був Лотт і особливо захоплений альтернативою, до якої тепер змушений був вдатися.\n\nВажкою рукою, освітленою лише тьмяним світлом настільної лампи, Лотт почав складати новий набір наказів. Оскільки Республіка вибула з порядку денного, єдиним варіантом залишалися Ґайтаністи, і тепер Бразилія не мала іншого вибору, окрім як підтримати їхню справу."
  COL_USA_negotiation.27.a: "Що могло б бути..."

  COL_USA_negotiation.28.t: "Жодного доброго результату"
  COL_USA_negotiation.28.desc: "Ласерда байдуже дивився на картину, що висіла за його столом. Це був модерністський витвір мистецтва із зображенням чоловіка з гітарою. У цей момент картина не викликала в Ласерди жодних почуттів. Технічне виконання було майстерним, але єдиним її впливом на Ласерду було те, що вона дозволяла йому ще на коротку мить не думати про реальність.\n\nЛасерда видав роздратований стогін. Колумбійці вийшли з переговорів. Шляху назад уже не було, і американці підтримуватимуть тих червоних каудильйо у Східній Колумбії. Америка й Бразилія підтримуватимуть поширення соціялізму лише тому, що Богота відмовилася від переговорів.\n\nДля Колумбії не буде жодних рятівників — країна просто спалить себе дотла, визначаючи, хто з паліїв правитиме попелом, а Бразилія й Америка оплачуватимуть рахунок. Що більше він про це думав, то сильніше Ласерда злився. Скроня вже пульсувала, і коли Ласерда зрозумів, що йому знову доведеться все це пояснювати Ґолбері, пульсація перетворилася на повноцінний головний біль."
  COL_USA_negotiation.28.a: "Наша армія підтримує Ґайтаністів... Неймовірно."

  COL_USA_negotiation.29.t: "З вогню та в полум’я..."
  COL_USA_negotiation.29.desc: "Була глибока ніч, і єдиним світлом залишалися Місяць та лампа над головою. Під покровом майже цілковитої тиші, породженої тривогою, він обшукував квартиру в пошуках усього, що міг залишити. Він не міг дозволити собі залишити щось, принаймні протягом наступних кількох днів. Відкривши шафу, він знайшов усередині захований звіт про перехоплені переміщення військ. Який би агент не збирав цю інформацію, йому добряче перепало б, якби це випливло назовні, особливо тепер.\n\nДе все пішло не так? Він склав сорочку у валізку. Очевидно, умови були погано узгоджені. Сполучені Штати не могли просто поступитися всім, особливо фракції в межах громадянської війни. Але невже одна-дві додаткові поступки справді завадили б? Колумбійський уряд не був принципово неприйнятним для Сполучених Штатів. Вони легко могли домовитися, зменшити найрадикальнішу вимогу й вижити. Невже Сполученим Штатам справді потрібно було утримувати острови Сан-Андрес?\n\nТепер їм явно доведеться це робити. Завершивши останню перевірку квартири, він знав, що робить. Завтра Вашингтон опублікує заяву із засудженням дій Колумбії. Наскільки довго триватиме засудження, залежатиме від того, чи будуть заарештовані дипломати, але воно відбудеться. Потім вони тихо почнуть перекидати зброю в інше місце. Фашисти Нової Гранади були очевидно непридатними, як з морального погляду, так і через свою орієнтацію, тож єдиною чіткою альтернативою, що залишилася, були Ґайтаністи Ґуадалупе Сальседо.\n\nЗачинивши за собою двері, він вагався, залишити ключ чи ні, перш ніж вирішив забрати його. Він міркував, що вони навряд чи зайдуть так далеко, щоб перевіряти його копію. Та й що вони взагалі могли б зробити, навіть якби знайшли її? Протягом дня він мав дістатися Букараманги, а потім сільської місцевості Сантандера. Там його посередник зв’яжеться з групою Ґайтаністів, де вони обговорять умови, обміняються обіцянками і, сподіваючись, дочекаються евакуації. Вийшовши навшпиньки назовні, він почув сигнал фургона й повернувся, щоб сісти всередину."
  COL_USA_negotiation.29.a: "Марнування часу на запасний план."

  COL_USA_negotiation.30.t: "Пірнання в безумство"
  COL_USA_negotiation.30.desc: "Кілька днів були довгими, а тепер дипломат мучився в ліжку. Виснажений кількома напруженими днями й тепер ще й хворий на грип, він майже нічого не міг робити, окрім як лежати, розмірковуючи про перебіг переговорів, і, коли не міг заснути, слухати радіо. Відволікали його від болю різноманітні пісні, новинні передачі та радіошоу, привезені з інших частин континенту, — усе вони зливалися в одну імлу. Коли він знову перемикав канали, голос Льераса Камарґо раптом повернув його до тями.\n\n«...олумбія — друг свободи. Ми прагнемо спільного блага для всіх і сподіваємося співпрацювати з усіма урядами, які думають так само. Роками я бачив Сполучені Штати саме такими. Обидві наші країни були засновані в боротьбі проти колоніальних господарів Європи, з метою поважати волю їхніх народів». Він перевернувся на інший бік, уважно слухаючи навіть крізь кашель. Він знав, що ось-ось мали відбутися важливі переговори, коли його усунули; можливо, йшлося саме про це?\n\nМить тиші була затьмарена всім іншим. «Але ми гордий народ. Свобода означає, що нації вільні не просто бути маріонетками більших держав, а діяти заради власних цілей. Від нас не можна вимагати поваги до інших держав, коли вони вирішують окупувати наші землі. Ми не поважаємо продовження окупації Кореї японцями, Східної Європи німцями, Африки італійцями та іберійцями. І ми не поважаємо окупацію Сан-Андреса та Провіден—»\n\nРадіо затріщало, коли він зменшив гучність, а потім вимкнув його, перш ніж сховати обличчя в долонях, знову з ясною головою. Останні кілька тижнів він ставив під сумнів накази, які отримував, але це? Льерас Камарґо, з усього, що він читав і бачив, був ідеальною людиною для Вашингтона. Ліберал, противник екстремізму, проамериканський. Що вони отримають, налаштовуючи його проти себе? Він знову ліг у ліжко, з жахом думаючи про повернення до чергового раунду переговорів."
  COL_USA_negotiation.30.a: "Союзник, якого переговорами перетворили на ворога."
  
  COL_USA_negotiation.31.t: "Без права на виправдання"
  COL_USA_negotiation.31.desc: "Сидячи у кріслі, Лінкольн Ґордон зітхнув. Останні кілька днів в американському посольстві панувала справжня напруга, і остання зустріч лише підкреслила це. Переговори в Колумбії проходили невдало, що неодноразово засуджувалося після витоків кілька днів тому. Перебування в Бразиліа дозволяло йому уникнути люті, з якою зіткнулися багато американських дипломатів у Боготі, але крижаних поглядів і двозначних зауважень багатьох бразильських дипломатів було більш ніж достатньо. Коли задзвонив телефон, він не очікував нічого доброго.\n\n«Алло, це Лінкольн Ґордон».\n\n«Пане Ґордоне, це Альберто Льерас Камарґо», — відповіла слухавка акцентованою, але вільною англійською. Ґордон різко підняв очі. «Посли з мого боку цілком мовчать, тож я хотів запитати вас. Чому нам заборонили повторно вступити до Організації американських держав?»\n\nҐордон на мить затнувся. «Ну, я, е-е, боюся, що це не до мене. Я знаю, що минулого місяця ми трохи говорили про врегулювання питань із Венесуелою та Панамою, але це було узгоджено з бразильським урядом, і я не можу обговорювати політику Вашингтона без додаткових роз’яснень».\n\n«Те саме повторюють усі інші», — швидко зітхнув Камарґо, перш ніж його перебили. — «Але я знаю, що ви проти цього. Ви знаєте, що ваш уряд зрадив свого близького союзника й партнера та завдав шкоди прагненням кожного колумбійця на місці. Просто у вас немає влади сказати це, чи не так?» Ґордон намагався заговорити, але його голос затнувся десь у горлі, доки лінія повністю не обірвалася.\n\nЦе саме по собі було відповіддю, хоча Ґордон і не скаржився. Камарґо, звісно, мав рацію; він вважав американське рішення цілком свавільним. А яку владу мав він?"
  COL_USA_negotiation.31.a: "Йому залишалося лише сподіватися, що президент не спрямує свій гнів і на Бразилію."

  COL_USA_negotiation.32.t: "Портрет палаючого президента"
  COL_USA_negotiation.32.desc: "Ще раз переглянувши свій розклад, Енріке Лотт усміхнувся. Йому залишалося прочитати кілька документів, але робота здебільшого була завершена, а завтра його розклад мав бути значно вільнішим. Переговори між Колумбією та Сполученими Штатами завершилися, і йому мали дозволити кілька днів залишатися з обома делегаціями, пропонуючи свою присутність як доповнення до бразильських зусиль. Він узяв верхній документ і одразу ж насторожився, щойно побачив його джерело.\n\nВІД: ПРЕЗИДЕНТА Альберто Льераса Камарґо\nКОМУ: ПРЕЗИДЕНТУ І ГЕНЕРАЛУ Енріке Тейшейрі Лотту\n\nЯ хочу подякувати вам за допомогу, яку ви нам запропонували. Я вже публічно висловив свою вдячність Бразилії, але хотів звернутися безпосередньо. Ваша кар’єра була присвячена протистоянню демократії тиранії, а ваше перо, очевидно, таке ж дієве, як і ваша гвинтівка. Завдяки вам та Ітамараті Колумбія знову наблизилася до того, щоб стати вільною, демократичною нацією, яка працює пліч-о-пліч зі своїми латиноамериканськими братами.\n\nУ мене є для вас останній подарунок. Розумію, що це незвично, але я вирішив присвятити вам портрет. Він має прибути до Бразилії за кілька днів, але я вирішив особисто передати його, висловлюючи подяку співробітникам бразильського посольства в Боготі. Перепрошую за його аматорський вигляд; будучи президентом, я не мав змоги практикувати свої навички до рівня Франсіско де Ґойї. Однак сподіваюся, що послання миру та співпраці все одно буде зрозумілим, навіть попри низьку якість мого мистецтва».\n\nОпустивши очі, він помітив коротке повідомлення від співробітників посольства з описом картини. Нічого особливого — його портрет у повний зріст, намальований від руки, поруч із оливковим деревом, — але, як виявилося, виконано добре. Відклавши документ, він засміявся, дістав флягу з віскі й почав наливати."
  COL_USA_negotiation.32.a: "Шкода, подумав він, що отримати його доведеться Едні."

  COL_USA_negotiation.33.t: "Зателефонувати другові"
  COL_USA_negotiation.33.desc: "Нетерпляче стоячи, Ласерда переводив погляд із годинника на телефон. Невдовзі він мав вирушити на офіційну зустріч щодо меморандуму між ОВН та урядом Колумбії в Боготі, але перед цим мав зробити один дзвінок, заздалегідь призначений на коротке вільне вікно. Щойно телефон задзвонив, Ласерда схопив слухавку.\n\n«Алло, це Льерас Камарґо», — промовив голос на іншому кінці лінії. Звісно, це був не він, а перекладач. Ласерда не говорив іспанською, а Камарґо не міг відповідати португальською, тож вони домовилися про такий спосіб спілкування. «Я хотів подякувати вам за вашу підтримку. Без неї ми опинилися б у значно гіршому становищі».\n\n«Не варто, Альберто», — тепло відповів Ласерда. — «Ми обидва раціональні люди, а в такому світі це зближує нас. Я радий, що ми змогли об’єднатися заради цього».\n\n«Зважаючи на мою опозицію, приємно мати поруч людину, яка знає, що правильно. А ще й колишнього журналіста? Я свого часу писав статті, щоб домогтися переобрання мого президента, але ніколи не заходив у це так далеко, як ви».\n\n«Якби ж я міг бути таким добрим до свого лідера!» — щиро розсміявся Ласерда. — «На жаль, коли я починав, було або Варґас, або нічого».\n\n«Ну, якби я зараз був у Бразилії, то точно не був би таким критичним до свого президента». Він зітхнув, наче випускаючи роки страждань, перш ніж продовжити. «Через десятиліття, коли спогади про цю війну згаснуть, я знаю, що колумбійці все одно повторюватимуть ваше ім’я як ім’я нашого героя. Ви маєте в собі все необхідне, щоб стати героєм усього нашого континенту».\n\nЛасерда подякував йому, перш ніж змушений був завершити розмову, коли до кімнати вбіг співробітник. На мить затримавшись після того, як поклав слухавку, він усе не міг стримати усмішку. Бразильські війська, можливо, й не марширували через гору Фудзі чи до Фольксгалле, але по-своєму він допоміг принести свободу в темний куточок світу."
  COL_USA_negotiation.33.a: "Orden y Progreso"

  COL_USA_negotiation.Lleras.tt: "Льерас — вправний і про-§mамериканський§! дипломат, що зменшує наші витрати £political_power_texticon."
  COL_USA_negotiation.Pinilla.tt: "Пінілья — непохитний §fнаціоналіст§!, що збільшує наші витрати £political_power_texticon."

  ###Volunteer Event
  COL_Volunteer.1.t: "Колумбія надсилає добровольців!"
  COL_Volunteer.1.desc: "Сьогодні з фронту надійшли добрі новини: уряд Колумбії оголосив про намір зібрати й відправити до нас батальйон добровольців для допомоги у громадянській війні, а також кілька партій продовольчих пайків і бойового спорядження нашого виробництва, яке вони отримали для власного конфлікту.\n\nХоча колумбійських військ може бути небагато, вони будуть віддані нашій справі й, що важливіше, загартовані в боях за десятиліття війни, яка спустошувала їхню батьківщину з 50-х років. Новина була тепло сприйнята Генеральним штабом, а кілька офіцерів навіть зустріли старих товаришів. Усвідомлення того, що навіть якщо Союз може бути мертвим, зв’язки, які наші народи будували протягом останніх кількох десятиліть, досі живі, принесло нашим солдатам надію.\n\nМожемо лише сподіватися, що інші наші союзники пам’ятатимуть, хто стояв поруч із ними, і приєднаються до цієї національної боротьби."
  COL_Volunteer.1.a: "Разом, ще раз."

  ###WORLD Events
    #Pre-War Republic
    COL_News.3.t: "[Get_newspaper_header]Рохас Пінілья скидає уряд Колумбії!"
    COL_News.3.desc: "Політична криза в Колумбії досягла свого завершення: генерал Ґуставо Рохас Пінілья, за очевидної одностайної підтримки збройних сил, здійснив державний переворот і сформував націоналістичну коаліцію після ухвалення PCC корпоративістської Конституції.\n\nГенерал безстроково призупинив вибори й заборонив обидві традиційні партії Колумбії, створивши натомість MAN за зразком мексиканської PRI. На диво, внутрішня опозиція вже почала розпадатися: провідні діячі тікають до Іберії, а багато хто сумнівається у своїй здатності організувати повернення.\n\nПід час своєї інавґураційної промови генерал Пінілья пообіцяв відновити порядок у Колумбії будь-якими необхідними засобами. Протягом дня бунтівному уряду було висунуто ультиматуми, і, схоже, Колумбія знову прямує до війни.\n"
    COL_News.3.a: "Від Афін Південної Америки до Спарти."

    COL_News.4.t: "[Get_newspaper_header]Новий деспот Колумбії"
    COL_News.4.desc: "Схоже, генерал Рохас Пінілья нарешті виправдав очікування. Сьогодні генерал оголосив воєнний стан і створення Ради безпеки, до якої увійшли найвищі військові командири країни, кожен із яких відданий Пінільї, для нагляду за возз’єднанням нації.\n\nОголошення пролунало після того, як усі повстанські угруповання відмовилися скласти зброю. Із запровадженням обов’язкового призову та нарощуванням промисловості очевидно, що головною метою Республіки в найближчі роки буде силове повернення цих територій.\n\nХоча генерал Пінілья заявив, що ці заходи буде скасовано після Возз’єднання, багато спостерігачів висловили сумніви. Оголошення спричинило протести в кількох містах, але, схоже, громадські настрої наразі прихильні до рішучого плану дій уряду."
    COL_News.4.a: "Цезар, а може, ще й Цинциннат."

    COL_News.1.t: "[Get_newspaper_header]Консервативна партія втримується в Колумбії"
    COL_News.1.desc: "Роки після смерті Лауреано Ґомеса були бурхливими для консервативного режиму в Колумбії. Однак нещодавнє ухвалення нової Конституції національними установчими зборами та приборкання непокірних військових угруповань, схоже, стабілізували партію й уряд, поклавши край внутрішньому насильству та дозволивши їм зміцнити контроль над Боготою та прилеглими територіями.\n\nІз кризи вийшов зміцнілий президент Урданета, який оголосив про свій намір принести мир і єдність країні під цивілістським прапором. Він також зробив кілька прихильних натяків щодо Германії, як і можна було очікувати від людини з його характером."
    COL_News.1.a: "Чи стане вона силою, що вирішує?"

    COL_News.2.t: "[Get_newspaper_header]Консерваторів-радикалів скинуто в Колумбії"
    COL_News.2.desc: "П’ятирічне протистояння нарешті завершилося в Колумбії: опозиційні сили скинули лауреаністську диктатуру та провели чистку її прибічників.\n\nНовий уряд, коаліція Ліберальної партії та поміркованих консерваторів, оголосив, що вибори відбудуться протягом наступних місяців. Багато хто очікує, що вже ослаблені помірковані консерватори стануть лише сателітами лібералів.\n\nТимчасовий президент Альберто Льєрас Камарґо також оголосив про зближення з ОВН та готовність вести переговори про мирне завершення Колумбійського конфлікту."
    COL_News.2.a: "Демократію, можливо, повернули до Колумбії, але чи достатньо цього, щоб запобігти громадянській війні?"


    COL_News.5.t: "[Get_newspaper_header]Перші вибори Національного фронту"
    COL_News.5.desc: "Колумбійські вибори 1964 року, призначені тимчасовим урядом Національного фронту після нещодавнього усунення лауреаністського уряду, сьогодні завершилися перемогою тимчасового президента Колумбії Альберто Льєраса Камарґо від Ліберальної партії.\n\nЛьєрас Камарґо пообіцяв амбітну реформаторську програму, яка охоплює все: від децентралізації через створення нових форм місцевого самоврядування до розвитку нової промислової бази для відбудови країни, а також передбачає реформи праці, банківської системи та охорони здоров’я. Новий президент також особливо зацікавлений у відновленні торговельних і дипломатичних відносин зі Сполученими Штатами.\n\nКонсервативна партія, яка не висувала кандидата на виборах, визнала їхній результат і пообіцяла співпрацювати з лібералами та допомогти відкрити нову сторінку для країни.\n"
    COL_News.5.a: "І ось колумбійці знову наважуються сподіватися."

    #US-COL Negotiations 1964
    COL_News.6.t: "[Get_newspaper_header]Початок колумбійсько-американських переговорів" #Unused
    COL_News.6.desc: "За посередництва Бразилії Сполучені Штати та Колумбія розпочали серію переговорів, спрямованих на відновлення дружніх відносин. Відносини зіпсувалися в середині 50-х після націоналізації американських компаній за попереднього, ґерманофільського лауреаністського уряду, через що Вашинґтон відкликав свого посла на знак протесту.\n\nПереговори можуть стати вирішальними для нового уряду Колумбії, який прагне міжнародної підтримки та внутрішньої легітимности для припинення Ла Віоленсії — громадянської війни низької інтенсивности, що триває. Проте Боготі буде важко врегулювати такі питання, як відносини з Германією, доля націоналізованих підприємств і повернення окупованого США острова Сан-Андрес без внутрішньополітичної реакції."
    COL_News.6.a: "Латинська Америка затамувала подих."
    
    COL_News.8.t: "[Get_newspaper_header]Відроджений дух Малларіно—Бідлака"
    COL_News.8.desc: "У тому, що, схоже, є найкращим можливим результатом, переговори між Сполученими Штатами та Республікою Колумбія завершилися майже ідеальною угодою між сторонами — кроком, який після Громадянської війни, схоже, повертає часи до нового початку, який символізував договір Малларіно—Бідлака 1854 року.\n\nУ фінальній резолюції Сполучені Штати та Колумбія домовилися співпрацювати в торговельних питаннях, реінтегрувати Колумбію в міжамериканську дипломатичну систему та утримуватися від втручання або істотного перешкоджання інтересам одна одної, заклавши основу для ефективної нормалізації та повернення постійних дипломатичних місій відповідно до Вашинґтона та Боготи.\n\nОптимізм зростає в міру реалізації угод, а історично дружні відносини розквітають після десятиліть у тіні.\n"
    COL_News.8.a: "До нового початку"

    COL_News.7.t: "[Get_newspaper_header]Колумбія та Сполучені Штати домовилися про основи"
    COL_News.7.desc: "Після переговорів між урядами Сполучених Штатів Америки та Республіки Колумбія було досягнуто угоди, хоча, схоже, попри зусилля обох сторін досягти спільних цілей, нещодавні рани в двосторонніх відносинах і напруженість минулого десятиліття завадили можливості повного примирення.\n\nОснови цієї спроби примирення були закладені після зміни адміністрації в Колумбії, яка стала прихильнішою до Сполучених Штатів, а дипломатичний клімат після громадянської війни став достатньо сприятливим для пошуку рішення, хоча наразі воно й виявилося не надто вражаючим.\n\nНаразі, коли обидва уряди вирішили підвестися з-за столу переговорів, жодних подальших умов погоджувати чи обговорювати не будуть. Однак багато хто вважає цей крок позитивним для демократії та стабільности в регіоні.\n"
    COL_News.7.a: "Усе ж краще, ніж нічого"

    COL_News.9.t: "[Get_newspaper_header]Переговори між Сполученими Штатами та Колумбією завершилися успішно"
    COL_News.9.desc: "Сьогодні переговори між Боготою та Вашинґтоном успішно завершилися, і обидві сторони подякували Бразилії за посередництво. Відносини між ними зіпсувалися в середині 50-х після націоналізації американських компаній за попереднього, ґерманофільського лауреаністського уряду. Повернення до дружніх відносин знаменує перемогу нового колумбійського уряду, а американське посольство незабаром буде відновлено.\n\nОчікується, що угода змінить розклад сил у Ла Віоленсії — громадянському конфлікті, який роками терзає Колумбію. Посилений Центральний уряд очікує ширшого доступу до американської зброї, тоді як Верховний командувач Сальседо, лідер повстанців Революційного союзу Колумбії, назвав примирення «зрадою волі колумбійського народу»."
    COL_News.9.a: "Партнерство відновлено."

    COL_News.10.t: "[Get_newspaper_header]Переговори між Сполученими Штатами та Колумбією зазнали краху"
    COL_News.10.desc: "Переговори між США та урядом Боготи в Колумбії завершилися провалом, причому кожна зі сторін звинуватила іншу в упертості. Бразильські посадовці, які виступали посередниками на переговорах, висловили розчарування тим, що двом колишнім партнерам не вдалося «подолати спадщину лауреаністської епохи» та досягти примирення.\n\nІнші сторони Ла Віоленсії, тривалого громадянського конфлікту Колумбії, радіють. Верховний командувач Сальседо, лідер повстанців Революційного союзу Колумбії, заявив, що «північноамериканці визнали безглуздість підтримки нелегітимного уряду всупереч волі колумбійського народу». Альсате з Нової Гранади атакував «готовність Боготи продати нашу націю іноземним ворогам і нездатність навіть це зробити належним чином»."
    COL_News.10.a: "Шкоду десятиліття нелегко залишити позаду."

    #Civil War Events
    COL_News.11.t: "[Get_newspaper_header]Ліберальне возз’єднання"
    COL_News.11.desc: "Сьогодні з Колумбії надійшли видатні новини: уряд НФ оголосив про успішне завершення переговорів щодо мирного возз’єднання Революційного фронту з Республікою.\n\nУряд Льєраса пообіцяв амністію багатьом членам Фронту та дозволив окремим його представникам приєднатися до Збройних сил Колумбії. У політичному плані цей крок гарантує зсув Ліберальної партії вліво та відродження ґайтаністської політики в партійному мейнстримі.\n\nГромадська реакція на оголошення була дуже позитивною, особливо з боку ОВН, яка пообіцяла допомогти новій коаліції відбудувати країну. Багато хто порівнює цей результат із новою Маршовою революцією, подібною до тієї, яку здійснив президент Пумарехо в 30-х роках.\n\nНапруженість із правим політичним спектром унаслідок цього різко зросла, хоча мало хто очікує, що Нова Гранада зможе становити загрозу цьому новому союзу.\n"
    COL_News.11.a: "Наслідок поваги до взаємних прав"

    COL_News.12.t: "[Get_newspaper_header]Новий претендент у Колумбії"
    COL_News.12.desc: "Сьогодні з Колумбії надійшли приголомшливі новини: у Ла Віоленсії з’явився новий претендент. Друга патріотична армія скористалася слабкістю уряду Боготи та захопила північне місто Барранкілью і значну частину Півночі.\n\nДруга патріотична армія складається із сил, що залишилися вірними лауреаністам, яких було усунуто від влади в 1962 році. Керівництво ДПА складається з проґерманських кадрів, причому ходять чутки, що один із ключових радників ДПА працював з Абвером, а багато інших мають зв’язки з німецькою громадою.\n\nЗ огляду на непопулярність уряду в регіоні, відомому як «гнійна рана Колумбії», зростання впливу ДПА не повинно дивувати.\n"
    COL_News.12.a: "Лауреаністи завдають удару у відповідь."
    COL_News.12.b: "Райх показує свою руку."

    COL_News.13.t: "[Get_newspaper_header]Громадянська війна в Колумбії відновлюється"
    COL_News.13.desc: "Збройний мир, у якому колумбійці жили відтоді, як у 1956 році було укладено перемир’я, завершився: три ворогуючі фракції — Центральний уряд, Революційний союз Колумбії та Нова Гранада — відновили бойові дії після ескалації жорстоких сутичок за контроль над північною Колумбією. Піднесення Другої патріотичної армії та її раптове захоплення департаменту Атлантіко лише ще більше дестабілізували регіон.\n\nЩо тепер станеться з Колумбією, невідомо, але коли ворогуючі фракції, керовані ненавистю, відчаєм і жадібністю, викинули мир за борт, країну насильно повернули до кровопролиття 50-х. І коли тіла починають накопичуватися в горах, на вулицях і в джунглях, може настати день, коли люди озирнуться на Ла Віоленсію як на кращі часи, адже ніхто не в безпеці від навислої загрози смерті та наступу армій і ополчень через спустошену землю.\n"
    COL_News.13.a: "Мирне рішення від самого початку здавалося неможливим."

    #Victory Events
    COL_News.14.t: "[Get_newspaper_header]Перемога уряду в громадянській війні в Колумбії"
    COL_News.14.desc: "Ліберальна партія Колумбії пройшла довгий шлях від початку десятиліття. Колись очікувалося, що вона зникне в довгій і бурхливій історії колумбійської політики, але їй дивом вдалося відновитися після виснаження консерваторів і здійснити неможливе: відновити верховенство права та покласти край Віоленсії, повернувши Колумбію під свій контроль військовою силою.\n\nЗа президента Льєраса Камарґо уряд пообіцяв відновити демократію та нормальне життя за допомогою реформ, а також захищати ці цінності за кордоном. Таким чином вони сподіваються забезпечити засвоєння уроків громадянської війни в Колумбії та не допустити повторення цієї трагедії."
    COL_News.14.a: "Нехай усі вони житимуть краще."

    COL_News.15.t: "[Get_newspaper_header]Перемога уряду в громадянській війні в Колумбії"
    COL_News.15.desc: "Ґуставо Рохас Пінілья, прозваний своїми солдатами «Цезарем Анд», перейшов Рубікон і поклав край Віоленсії, захопивши владу в старих урядових еліт країни та розгромивши всі протиборчі фракції на полі бою. Хоча деякі повстанці відмовилися припинити боротьбу, генерал виправдав свої невдалі кампанії 1956 та 1957 років; його обіцянки стабільности та соціальної справедливости схилили на свій бік маси.\n\nНаголошуючи на незалежності Колумбії від іноземного впливу, генералісимус не забув тих, хто стояв поруч із ним, зокрема мексиканського посла під час своєї переможної промови, натякаючи на плани тісніших відносин із північним сусідом."
    COL_News.15.a: "Порядок відновлено в Андах."

    COL_News.16.t: "[Get_newspaper_header]Перемога уряду в громадянській війні в Колумбії"
    COL_News.16.desc: "Політичний гегемон Колумбії, Консервативна партія, знову вистояла проти своїх противників. Її єдиний лідер Роберто Урданета, віцекороль Лауреано Ґомеса, оголосив про остаточну перемогу над ворогами Республіки, скасувавши втрати уряду попередніх років смути та кровопролиття.\n\nХоча партія зберегла статус політичного гегемона Колумбії та свій курс, для неї багато чого залишається невизначеним. Немає чіткої відповіді, чи призведе перемога до перестановок в уряді, чи наступність Урданети вже не підлягає сумніву. У будь-якому разі радикальне перетворення країни на диктатуру традиції, підживлену зростаючою промисловістю, стає дедалі очевиднішим для міжнародних спостерігачів."
    COL_News.16.a: "Сила, що вирішує, справді."

    COL_News.17.t: "[Get_newspaper_header]Революційна перемога в Колумбії!"
    COL_News.17.desc: "Тріумф РСУ над безліччю протиборчих сил у тривалій громадянській війні Колумбії сьогодні відзначили маршем брукованими вулицями Боготи. Колись розрізнені революційні війська продемонстрували дисципліну, а мешканці міста зібралися, щоб зустріти їх музикою та паруючими мисками чанґуа й ахіако.\n\nПарад завершився на площі Болівара, де на тлі гірських вершин і Палацу правосуддя Верховний командувач Сальседо оголосив, що через три місяці піде у відставку, після чого Народний кабільдо проведе вільні вибори. Він віддав шану жертвам своїх військ, колумбійського народу та Ґайтана, убивство якого, за словами Сальседо, нарешті було помщене."
    COL_News.17.a: "Ідеалісти виграли війну — чи зможуть вони виграти мир?"

    COL_News.18.t: "[Get_newspaper_header]Нова Гранада перемагає в громадянській війні в Колумбії"
    COL_News.18.desc: "Сьогодні громадянська війна в Колумбії нарешті завершилася: уряд Нової Гранади на чолі з «Дуче» Хільберто Альсате Авенданьйо оголосив про перемогу сьогодні вранці. Уряд, що базується в Калі, від початку конфлікту користувався підтримкою Італійської імперії, і італійський уряд уже привітав Авенданьйо.\n\nПід час сьогоднішньої промови Авенданьйо заявив, що «Новогранадська держава принесе колумбійському народу нові й старі слави». Уряд Авенданьйо вже почав упроваджувати корпоративістську політику, натхненну політикою Італії та Японії.\n\nШирока коаліція інших ультраправих партій, схоже, є крихкою, а політичні розбіжності щодо політики вже спалахують, зокрема навіть через такі дрібниці, як зміна назви країни на Нова Гранада.\n"
    COL_News.18.a: "Це наша людина!"
    COL_News.18.b: "Вони розпадуться за тиждень... правда ж?"
    COL_News.18.c: "Старій назві вдихнули нове життя."
    COL_News.18.d: "Чи хотів би цього Болівар?"

    COL_News.19.t: "[Get_newspaper_header]Перемога Другої патріотичної армії в громадянській війні в Колумбії!"
    COL_News.19.desc: "Тривожні новини надходять із Колумбії, де після завершення громадянської війни переможцем стала Друга патріотична армія. Складаючись із найправіших угруповань PCC, лауреаністів на чолі з Альфонсо Урібе Місасом та Національно-американістського руху Хосе Камачо Карреньйо, перемога ДПА знаменує тривожний відхід від компромісної політики попередніх урядів.\n\nЩе тривожнішим за їхню тоталітарну політику та невиправну ґерманофілію є те, що новий уряд успадковує націю, спустошену двома десятиліттями громадянської війни. Перспективи відбудови та здатність уряду стабілізувати країну з огляду на триваючі повстання й політичну боротьбу видаються похмурими."
    COL_News.19.a: "Наша робота лише починається."
    COL_News.19.b: "La Patria Boba."
     
    #COL Post-War
    COL_News.20.t: "[Get_newspaper_header]Спадкоємець василіска бере кермо"
    COL_News.20.desc: "Сьогодні з Колумбії надійшли важливі новини: президент Роберто Урданета оголосив про свою відставку. Урданету пам’ятатимуть за керівництво PCC відтоді, як наприкінці 50-х помер її примас Лауреано Елеутеріо Ґомес, а також за головування під час возз’єднання країни.\n\nОголошення було позитивно сприйняте передусім через його рішення затвердити сина Ґомеса, Альваро, новим президентом. Альваро відомий своєю репутацією більш поміркованої фігури, особливо порівняно з ультраконсервативною репутацією його батька. Примітно, що він також менш прихильно ставиться до зближення PCC з Германією, і багато хто очікує, що під час свого терміну він працюватиме над скасуванням цих кроків.\n\nКерівництво Альваро, ймовірно, принесе поміркованість у риторику PCC. Хоча безперечно, що її влада залишатиметься беззаперечною.\n"
    COL_News.20.a: "Нехай він принесе мир і стабільність імперії свого батька."
    COL_News.20.b: "Наскільки поміркованим насправді може бути нащадок чудовиська?"
    COL_News.20.c: "Краще б він не забував, хто привів його до перемоги в громадянській війні."

    COL_News.21A.t: "[Get_newspaper_header]Реформи Ґомеса проходять через Сенат"
    COL_News.21A.desc: "Президент Альваро Ґомес Уртадо сьогодні успішно провів свій знаковий пакет реформ через Сенат Колумбії, назвавши законодавче досягнення «розчищенням шляху для нового розвитку». Політичні оглядачі сумнівалися, що законопроєкт буде ухвалено, оскільки численні радикали в Сенаті, багато хто з яких мав довічний мандат, висловлювали своє невдоволення пропозицією. Схоже, ці сумніви були перебільшеними: партія висловила широку підтримку законопроєкту, і його ухвалили зі значним перевищенням необхідного порогу.\n\nНовий пакет реформ дозволив проводити місцеві вибори та відновив посаду віцепрезидента. Законопроєкт також запровадив мінімальну заробітну плату для боротьби з бідністю, водночас зберігши католицизм як державну релігію та закликавши всіх колумбійців відновити свою віру й любов до ближнього після жорстокої громадянської війни.\n"
    COL_News.21A.a: "З відкритими руками й вірними серцями."
    COL_News.21B.t: "[Get_newspaper_header]Реформи Ґомеса провалилися в Сенаті"
    COL_News.21B.desc: "Запропоновані президентом Колумбії Альваро Ґомесом реформи зазнали провалу після запеклого спротиву Сенату. Прийшовши до влади разом із Консервативною партією, Ґомес запропонував реформи, спрямовані на демократизацію та спрощення центрального бюрократичного апарату, зокрема відновлення посади віцепрезидента та місцевих виборів.\n\nПісля загибелі реформ Ґомес стикається з важкою боротьбою за домовленість із радикалами всередині своєї партії, а деякі оглядачі припускають, що йому доведеться піти на компроміс щодо посад у Кабінеті або ключових політичних рішень. Оскільки багато його політичних опонентів наближаються до обов’язкового пенсійного віку, Ґомес, можливо, сподівається дочекатися вигіднішої політичної ситуації для просування своїх реформ."
    COL_News.21B.a: "Такою є демократія."

    COL_News.22.t: "[Get_newspaper_header]Генерал Пінілья призначає Саласара Ґарсію"
    COL_News.22.desc: "Після того як Лосано й Пабон не змогли досягти успішного компромісу щодо керівництва Колумбією, конституційна більшість в Установчих зборах підтримала Еліаса Саласара Ґарсію, голову NCL, єдиної законної профспілки Колумбії від 1956 року, на посаду нового міністра уряду. \n\nДруг генерала Пінільї, він уперше познайомився з ним у Калі під час роботи Саласара Ґарсії агітатором. Відтоді, поєднавши колумбійський націоналізм із робітничим рухом, він став головним організатором праці в західних регіонах. Коли під час Ла Віоленсії він утік разом із лоялістами, то став улюбленцем генерала у питаннях трудових відносин. Відомий схильністю до непередбачуваних дій і бажанням розпустити CED, а також відсутністю вагань перед насильством, багато власників підприємств уже готують плани втечі, коли він приходить до влади.\n"
    COL_News.22.a: "Тільки собаку не застрель."

    COL_News.23.t: "[Get_newspaper_header]Смерть Ґуставо Рохаса Пінільї"
    COL_News.23.desc: "Про смерть колишнього колумбійського лідера Ґуставо Рохаса Пінільї було оголошено після ймовірної авіакатастрофи за тридцять миль на північ від Боготи. Ходять чутки, що Пінілья, побоюючись втрати влади через загострення конфлікту між генералом і міністром Саласаром Ґарсією через низькі експортні ціни, нібито прямував у вигнання до Мексики, коли літак зазнав катастрофи. На місці аварії Саласар Ґарсія відмовився коментувати подію. Уряд досі не заявив, чи вважає він, що могла мати місце диверсія.\n\nЧерез кілька годин після смерті Ґуставо Рохаса Пінільї було офіційно оголошено прокламацію, яка проголошувала Автентичний соціялістичний альянс єдиною правлячою партією, разом із висуненням Саласара на посаду тимчасового й, найімовірніше, довічного президента."
    COL_News.23.a: "Невже удача ніколи не всміхнеться Колумбії?"
    COL_News.23.b: "Соціялісти-змовники знову завдають удару."
    COL_News.23.c: "Прірви Колумбії ширшають."

    COL_News.24.t: "[Get_newspaper_header]Установчі збори скликано в Колумбії"
    COL_News.24.desc: "Після нещодавньої перемоги Колумбії в громадянському конфлікті генерал Пінілья, як і обіцяв, скликав Національні установчі збори, через які починається передача надзвичайних повноважень Ради безпеки назад під цивільний контроль. Спочатку їх планували скликати ще до війни, але це було відкладено донині через оголошення стану облоги, який передав контроль Раді Пінільї.\n\nОскільки загалом відбувається повернення до нормального життя, збори мають переглянути багато законів, зокрема Конституцію, на наступному засіданні. Що важливіше, саме в цей час представники Національних зборів мають обрати наступника Пінільї, що знаменуватиме повернення демократичного правління.\n"
    COL_News.24.a: "Не можна приготувати омлет, не розбивши кілька яєць."

    COL_News.25.t: "[Get_newspaper_header]Генерал Пінілья призначає Лосано"
    COL_News.25.desc: "Військове правління в Колумбії завершується, коли генерал Пінілья підписує нову Конституцію, схвалену народним голосуванням на зборах, а Хуан Лосано-і-Лосано обраний новим міністром уряду, що спричиняє негайну передачу влади, як генерал і обіцяв раніше. Як лідер відновленої Патріотичної національної економічної дії, або APEN, Лосано-і-Лосано встиг стати улюбленцем як бізнесменів, так і ліберальної інтелігенції, а під час Ла Віоленсії відіграв важливу роль у виборюванні влади Пінільї.\n\nОбраний унаслідок компромісу з Лусіо Пабоном, Лосано-і-Лосано здобув погану репутацію речника корпоративних покровителів, таких як Хуліо Маріо Санто Домінґо. Однак, зважаючи на його попередній досвід у боротьбі з CED, хоч він і є досить суперечливим кандидатом, можливо, саме він зможе забезпечити обіцяну національну процвітаючість, нечувану протягом десятиліть.\n"
    COL_News.25.a: "Терпіння окупається."

    COL_News.26.t: "[Get_newspaper_header]Генерал Пінілья призначає Пабона"
    COL_News.26.desc: "Збори чітко висловили свою волю після завершення голосування за нову Конституцію: генерал Пінілья прийняв вотум довіри та призначив Лусіо Пабона міністром уряду. Як лідер Руху національної дії, що користувався передусім підтримкою традиційного істеблішменту, Пабон здобув довіру Пінільї під час Ла Віоленсії завдяки своїй незвичайній економічній проникливості, зокрема розробивши відому як «Трирічний план» ініціативу відновлення, яку, ймовірно, невдовзі буде втілено після його вступу на посаду.\n\nЗа лаштунками призначення Пабона ледве вдалося забезпечити завдяки компромісам із Хуаном Лосано-і-Лосано, який погодився подолати глухий кут у зборах в обмін на другорядну адміністративну роль протягом наступних чотирьох років. Хоча цього очікували, багато інсайдерів зазначають, що цей непростий союз незабаром може розпастися після усунення Еліаса Саласара."
    COL_News.26.a: "Картковий будинок на ходулях."

    COL_News.27.t: "[Get_newspaper_header]Карлос Льєрас Рестрепо обраний новим президентом Колумбії" ## Event is over 1000 chars
    COL_News.27.desc: "Ліберальна партія Колумбії оголосила про перемогу після безальтернативних виборів на законодавчих виборах 1968 року. Після краху керівництва Консервативної партії Ліберальна партія залишилася єдиною законною партією на виборах. Після запеклої боротьби за лідерство Карлос Льєрас Рестрепо, колишній лідер дисидентської фракції, замінить свого далекого кузена Альберто Льєраса на посаді президента. Новий президент радісно звернувся до своїх прихильників після оголошення про перемогу, пообіцявши зберігати мир у Колумбії та надати допомогу регіонам і народам, спустошеним нещодавньою громадянською війною, сподіваючись відновити демократію в Колумбії найближчим часом.\n\nЗовнішні спостерігачі висловлюють сумніви щодо політичного курсу президента Льєраса, вважаючи, що він не зможе підтримувати мир без розширення повноважень поліції та ризикує спричинити інфляцію через свою монетарну політику, але президент зміг заручитися підтримкою Ліберальної партії та сподівається так само здобути підтримку свого народу.\n"
    COL_News.27.a: "Чи зможе білий голуб нести червону троянду?"

    COL_News.28.t: "[Get_newspaper_header]Ернандо Дуран Дуссан обраний новим президентом Колумбії"
    COL_News.28.desc: "Законодавчі вибори в Колумбії 1968 року нарешті завершилися несподіваним результатом. Хоча очікувалося, що Ліберальна партія здобуде переважну перемогу через розкол серед консерваторів, багато незалежних законодавців отримали місця в Установчих зборах. Збори назвали новим президентом Колумбії Ернандо Дурана Дуссана, який колись був вигнаний із Колумбії через свою політичну активність.\n\nПрезидент заявив, що виконає демократичний мандат Колумбії, припинивши політичні переслідування та забезпечивши повернення тих, хто був вигнаний із політичних причин. Він також пообіцяв нову економічну програму, скоротивши роль держави в індустріалізації та демонтувавши корпоративістські структури. Опоненти засуджують його економічну програму, стверджуючи, що вона збільшить бідність і нерівність, але президент не відступив, заявивши, що політична свобода потребує економічної свободи.\n"
    COL_News.28.a: "Звільняєш розум, звільняєш ринок — звільняєш народ."

    COL_News.29.t: "[Get_newspaper_header]Альберто Льєрас Камарґо йде у відставку" 
    COL_News.29.desc: "Після «вичерпання політичного капіталу» президент Альберто Льєрас Камарґо сьогодні вранці повідомив країну про свій намір піти у відставку. Багаторічний лідер Ліберальної партії та людина, якій приписують підписання Гаванських мирних угод із повстанцями Революційного союзу Колумбії, Льєрас оголосив, що обов’язки президента виконуватиме Хуліо Сесар Турбай, чинний голова Сенату, доки найближчими місяцями не буде організовано вибори.\n\nОголошення Льєраса не стало несподіванкою, оскільки плани переходу до повністю демократичного правління були окреслені ще під час підписання мирних угод. Усупереч прогнозам тих, хто вважав, що правління лібералів призведе до анархії, цей розвиток подій, схоже, демонструє напрочуд швидку стабілізацію колумбійських інституцій і політичного життя."
    COL_News.29.a: "Демократія постає з попелу."
    COL_News.29.b: "Вражаючий політичний розвиток."
    COL_News.29.c: "Один президент чи інший — Колумбія залишається скутою виродженням."
    COL_News.29.d: "Вони справді це зробили. "

    # Recontinuation of COL events - Frosty
    COL_News.67.t: "[Get_newspaper_header]Змова липня виходить на світло"
    COL_News.67.desc: "Після загострення конфлікту між Лусіо Пабоном і Хуаном Лосано-і-Лосано, що завершилося серією суперечливих повідомлень, які протягом останнього тижня перетворилися на цілковиту тишу, стали відомі подробиці того, що тепер називають «Змовою липня». Найбезпосереднішим наслідком змови стала відставка Пабона з усіх урядових посад і розпуск його Національного руху дії, що залишило APEN самостійно очолювати уряд Колумбії.\n\nЗ огляду на ці події, схоже, APEN та представники ділових кіл успішно змусили Пінілью дозволити їм створити нову олігархію, причому промисловці відіграють непропорційно велику роль у перебудові режиму. Тепер очікується, що реформи, вже запроваджені під час процесу реконструкції, наберуть обертів, а зростаюча каста промисловців ще більше розширить свою діяльність.\n"
    COL_News.67.a: "Великий проєкт генерала-інженера триває."
    COL_News.67.b: "Він піддався хватці міжнародних фінансів."
    COL_News.67.c: "Реконструкція, але якою ціною?"

    COL_News.68.t: "[Get_newspaper_header]Пабон засуджує Змову липня"
    COL_News.68.desc: "Політична криза, що назрівала в Колумбії, досягла кульмінації цього тижня після загострення конфлікту між Лусіо Пабоном і Хуаном Лосано-і-Лосано та зростання побоювань щодо краху уряду. На поспіхом організованій пресконференції Пабон оголосив приголомшливу новину про арешт Лосано та заборону його партії APEN за спробу здійснити державний переворот проти уряду.\n\nХоча, схоже, бізнес-магнати, відомі своїми зв’язками з APEN, поки що уникли прямих наслідків, усунення їхньої партії-прикриття, ймовірно, означає необхідність другого трирічного плану, і він коштуватиме їм політичного впливу. Запроваджені урядом під час процесу реконструкції реформи вільного ринку наразі не скасовано, але мало хто очікує, що тепер вони наберуть подальших обертів."
    COL_News.68.a: "Схоже, Колумбії потрібна тверда рука."
    COL_News.68.b: "Їхні дріб'язкові чвари їх занапастять."
    COL_News.68.c: "Принаймні цього разу не було громадянської війни..."

    COL_News.69.t: "[Get_newspaper_header]Загальний страйк у Колумбії"
    COL_News.69.desc: "Після кількох тижнів потрясінь, спричинених нафтовою кризою, Національна конфедерація праці під керівництвом тимчасового очільника Туліо Куеваса Ромеро оголосила загальнонаціональний страйк. Колумбія, вже ослаблена нафтовою кризою, тепер, схоже, паралізована, оскільки життя країни завмерло. Уряд Пінільї наказав поліції та збройним силам вийти на вулиці, щоб придушити страйки й заарештувати будь-яких агітаторів.\n\nПитання викликає участь колишнього профспілкового лідера Саласара Ґарсії, а також нинішнє становище Пінільї, оскільки його уряд слабшає в міру продовження цих криз."
    COL_News.69.a: "Ще один цвях у труну Колумбії."
    COL_News.69.b: "Чи зможе генерал дати відсіч?"
    COL_News.69.c: "Їм просто не щастить."

    COL_News.70.t: "[Get_newspaper_header]Еліас Саласар Ґарсія страчений під час армійського перевороту"
    COL_News.70.desc: "Після кількох тижнів паралізуючих страйків і дедалі гостріших конфліктів усередині уряду Колумбії повідомлення свідчать, що армія нарешті вирішила втрутитися. Сьогодні вранці Президентська гвардія та 13-та бригада рушили на столицю, закривши відновлений Конґрес республіки.\n\nБудь-які сумніви щодо того, хто стоїть за блокадою, розвіяв виступ генерала Пінільї на авіабазі CATAM, де він засудив страйкарів як поплічників Саласара, які мають намір повалити республіку та її уряд. Він оголосив про відновлення Ради безпеки, розпуск CNT і смерть Саласара, якого, на думку багатьох, члени відділу F2 стратили без суду у його власному будинку."
    COL_News.70.a: "Цезар Анд, вірний своєму імені."
    COL_News.70.b: "Вкотре доведено безглуздість націонал-синдикалізму."
    COL_News.70.c: "Ще одна невдача військового соціялізму."

    #URC Post-War
    COL_News.30.t: "[Get_newspaper_header]Революційний кабільдо Колумбії урочисто відкрито"
    COL_News.30.desc: "Головнокомандувач Революційних збройних сил і тимчасовий глава держави Колумбії Ґуадалупе Сальседо Унда залишив свою посаду.\n\nВідповідно до Основного закону соціялістичні революціонери, які нині правлять Колумбією, зробили ще один крок до створення формальної структури управління, оголосивши про заснування Революційного кабільдо, або урядової ради.\n\nВибори до законодавчого органу та Установчих зборів мають незабаром розпочатися. Протягом наступного року представники всієї Колумбії зберуться в Боготі, щоб обговорити статті конституції Союзу та розробити правові засади Республіки."
    COL_News.30.a: "Нехай серед революціонерів панує консенсус."

    COL_News.31.t: "[Get_newspaper_header]Ґайтаністи перемагають у Кабільдо"  #REWRITE NEEDED
    COL_News.31.desc: "Вибори до Революційного кабільдо Колумбії принесли результат — прихильники покійного каудильйо Хорхе Елієсера Ґайтана отримали більшість як в Установчих зборах, так і в Кабільдо.\n\nОчікується, що Ґайтаністи з MRL продовжать втілювати грандіозне бачення покійного Каудильйо щодо справедливої республіки, заснованої на ідеалах взаємної поваги та соціальної справедливости. Хоча звинувачення в придушенні виборців та фальсифікації виборів могли зіпсувати настрій у столиці, схоже, значна частина населення все ще святкує, що не дивно з огляду на популярність Каудильйо.\n\nХоча ОАД відмовилася коментувати звинувачення, делегації ОВН по всій Боготі приєдналися до святкувань, і багато хто очікує, що ця перемога означатиме фактичне приєднання нового члена до великого альянсу вільного світу.\n"
    COL_News.31.a: "Чи зможуть вони відповідати його спадщині?"

    COL_News.32.t: "[Get_newspaper_header]Демократичний фронт обрано в Колумбії"
    COL_News.32.desc: "Церковні дзвони лунають по всій Колумбії, коли вибори до перших Установчих зборів і Кабільдо приносять свій результат — перемогу Фронту єдности народу, коаліції соціялістичних партій, які відмовилися підкоритися MRL.\n\nКоаліція, очолювана християнськими соціялістами Каміло Торреса, пообіцяла дотримуватися демократичних практик і забезпечити церкві активну роль у збереженні революційних здобутків і протоколів через доктрину «дієвої любови».\n\nХоча багато хто праворуч засуджував його соціялістичні тенденції як збочення католицьких ідеалів, лідерство Торреса отримало широку підтримку по всій країні, особливо після того, як опозицію вразили звинувачення в придушенні виборців та фальсифікації виборів."
    COL_News.32.a: "Християнські революціонери? Оце щось нове."

    COL_News.34.t: "[Get_newspaper_header]Комуністи штурмують Капітолій у Колумбії"  #REWRITE NEEDED
    COL_News.34.desc: "Сьогодні з Колумбії надходять приголомшливі новини: комуністичні воєнізовані формування штурмували Революційне кабільдо та усунули тимчасовий уряд від влади.\n\nНапруженість між Комуністичною партією та урядом залишалася високою відтоді, як було ухвалено рішення не допустити їх до майбутніх виборів, і, схоже, нещодавні повідомлення про придушення виборців та фальсифікації виборів у кількох регіонах стали останньою краплею для їхньої співпраці.\n\nУ своїй інавґураційній промові новий президент Вієра Вайт пообіцяв звільнити колумбійський пролетаріат від кайданів і відновити вільну та демократичну Колумбію. Крім того, Президент засудив Сполучені Штати та ОАД за ігнорування так званих явних ознак недемократичних практик на виборах."
    COL_News.34.a: "Колумбія, знову держава-ізгой."

    COL_News.33.t: "[Get_newspaper_header]Тупик у Кабільдо"  #REWRITE NEEDED
    COL_News.33.desc: "Тривога в Боготі: вибори до Революційного кабільдо та Установчих зборів завершилися цілковитим тупиком, оскільки жодна фракція не отримала достатньо представників навіть для вирішальної відносної більшости. Нові збори, зібравшись, дедалі більше занурюються у взаємні звинувачення.\n\nВорожа риторика всередині фракцій дестабілізувала коаліцію. Попереднє суперництво між Ґайтаністами та комуністами загострилося й призвело до вуличних сутичок між прихильниками обох фракцій у Боготі та інших великих містах.\n\nШироко поширені побоювання, що майбутній результат, яким би він не був, може призвести до трагедії для молодої революційної республіки."
    COL_News.33.a: "Невизначеність шириться від революції."

    COL_News.35.t: "[Get_newspaper_header]Антикомуністичний переворот у Колумбії"
    COL_News.35.desc: "Схоже, напруженість у новій Республіці Колумбія знову сягнула межі, оскільки військові на чолі з Рафаелем Навасом Пардо силою повалили уряд і встановили «тимчасову» диктатуру для відновлення порядку.\n\nПосилаючись на недемократичні практики та наділення небезпечних радикалів владою як на причини перевороту, багато хто вважає, що справжньою причиною перевороту стала недовіра військових до соціялістів і комуністів. По всій країні відбулися сутички, але сили опору не можуть зрівнятися з потужністю організованої військової відповіді.\n\nЛідером нової хунти став добре відомий маршал, командувач повстанських сил FR під час війни, про-ґайтаністська постать із репутацією дисциплінованого генерала Наваса. Він пообіцяв повернутися до демократії після короткого періоду декомунізації та відновлення міжнародних зв’язків.\n"
    COL_News.35.a: "Дія, а тепер і реакція."
    COL_News.35.b: "Немає нічого демократичнішого за військову диктатуру."
    COL_News.35.c: "Блудний син повертається... знову."

    COL_News.36A.t: "[Get_newspaper_header]Альфонсо Лопес Мікельсен оголошує стан облоги"
    COL_News.36A.desc: "Схоже, останні кілька років були побудовані на марній надії. На тлі великої політичної кризи та поширення по всій Колумбії звинувачень у клієнтелізмі й корупції багато спостерігачів побоювалися хвилі протестів. Ці побоювання не справдилися, але лише завдяки тому, що президент Альфонсо Лопес Мікельсен оголосив про запровадження воєнного стану та надзвичайних повноважень.\n\nЦей крок, який призупинив право на протести, діяльність Народного кабільдо Республіки та запровадив комендантську годину з 20:00, був гучно засуджений у тих каналах, що ще збереглися, Ліберальним революційним рухом і Національною конфедерацією праці, які назвали ці заходи рівнозначними перевороту. Дивно, але партнери Колумбії не виступили із заявою у відповідь, проте присутність армії на вулицях і масові арешти політичних дисидентів доводять одне:\n"
    COL_News.36A.a: "Вкотре мрія Ґайтана лежить мертвою."
    COL_News.36B.t: "[Get_newspaper_header]Колумбійська військова хунта йде у відставку"
    COL_News.36B.desc: "Вкотре баланс сил у Колумбії змінюється. Короткочасний уряд військової хунти генерала Рафаеля Наваса Пардо оголосив про завершення періоду реконструкції та призначення Альфонсо Лопеса Мікельсена Президентом, повернувши владу значно ослабленому Народному кабільдо, разом із припиненням надзвичайних заходів, таких як система комендантської години.\n\nПопри підтримку багатьох політичних партій, що пережили цей період, Мікельсен залишається суперечливою постаттю, а його президентство загрожує загострити напруженість і ще більше розколоти країну. Звинувачення в корупції, його тісні зв’язки з військовими, а також підтримка з боку старої Ліберальної партії створюють похмуру картину в часи, коли повстанський рух уже набирає обертів, а місцеперебування більшості опозиційних лідерів досі невідоме.\n"
    COL_News.36B.a: "Ті, хто унеможливлюють мирну революцію..."

    COL_News.37.t: "[Get_newspaper_header]Хільберто Вієра Вайт затверджений на XI з’їзді Комуністичної партії Колумбії"
    COL_News.37.desc: "Після захоплення влади Колумбійським революційним союзом і чистки в армії було скликано XI з’їзд Комуністичної партії Колумбії, що стало першим випадком перебування партії при владі. Під час з’їзду партійні делегати розробили нову конституцію та висловили вотум довіри Постійно чинному Генеральному секретарю й Голові Центрального виконавчого комітету партії Хільберто Вієрі Вайту, який залишиться на обох посадах. Вайт також став головою Ради міністрів новоствореної Народної Республіки, фактично ставши лідером країни.\n\nДеякі експерти порівняли цей процес зі з’їздами Комуністичної партії нині неіснуючого Совєцького Союзу, назвавши Колумбійську комуністичну партію високоцентралізованою та «більшовизованою» організацією. Вайт, який обіймає посаду Генерального секретаря з 1947 року, стане людиною, що вестиме комунізм у Колумбії.\n"
    COL_News.37.a: "Мрія живе!"
    COL_News.37.b: "Маркс перевертається у своїй могилі."
    COL_News.37.c: "У всіх соціялістів справді такі довгі титули?"

    COL_News.38.t: "[Get_newspaper_header]Ніколас Буенавентура Альдер обраний на XI з’їзді Комуністичної партії Колумбії"
    COL_News.38.desc: "Після захоплення Колумбійською комуністичною партією Народного кабільдо та подальшої чистки в армії Колумбійська комуністична партія проводить свій XI партійний з’їзд, перший як правляча партія. На з’їзді партійні делегати розробили нову конституцію та, несподівано, проголосували за обрання Ніколаса Буенавентури Альдера новим секретарем партії та Головою Ради міністрів Народної Республіки.\n\nБуенавентура все життя був активістом і очолив ліве крило партії. Буенавентура заявив, що проводитиме «рішучий ленінський курс дій для забезпечення економічного процвітання в інтересах робітників, щоб принести перемогу комунізму з Колумбії до всього регіону». Новий Генеральний секретар також пообіцяв іти шляхом свого попередника у викоріненні лиха фашизму.\n"
    COL_News.38.a: "Інфантили повертаються."
    COL_News.38.b: "Союз живе далі!"
    COL_News.38.c: "Мантія переходить до іншого."

    COL_News.39A.t: "[Get_newspaper_header]Антоніо Ґарсія Носса перемагає на виборах у Колумбії 1970 року"
    COL_News.39A.desc: "Сьогодні по всій Боготі чути святкування, коли об’єднана ліва коаліція Патріотичного союзу перемагає на запекло конкурентних всенародних виборах, зруйнувавши більшість очікувань.\n\nНовообраний лідер Антоніо Ґарсія Носса, колишній економічний радник у кабінеті покійного каудильйо Хорхе Елієсера Ґайтана, що балотувався на ґайтаністській платформі, очолює країну після завершення хаотичного десятиліття й уже заявив про свою прихильність до сміливих соціальних та земельних реформ.\n\nПопри великі сподівання, що його перемога нарешті принесе полегшення після жахіть Ла Віоленсії, деякі міжнародні спостерігачі відреагували стриманіше, побоюючись, що нова політика може спричинити подальшу нестабільність, викликавши реакцію великої консервативної опозиції країни."
    COL_News.39A.a: "Промінь надії в морі потрясінь."
    COL_News.39B.t: "[Get_newspaper_header]Антоніо Ґарсія Носса перемагає на надзвичайних виборах 1970 року"
    COL_News.39B.desc: "У Боготі з’являється нове обличчя: соціялістичний кандидат Антоніо Ґарсія Носса стає відносно беззаперечним переможцем надзвичайних виборів, проведених Народним кабільдо, змінивши свого попередника Альфонсо Лопеса Мікельсена. Надзвичайний процес було започатковано народною постановою після того, як результати нещодавніх розслідувань змусили багатьох поставити під сумнів легітимність попередніх виборів.\n\nОчолюючи Колумбійський соціялістичний рух, міжнародні спостерігачі замислюються, чи впорається лідер еклектичної ґайтаністської коаліції, до якої також входять колишні члени Карибського легіону та донька покійного каудильйо Ґлорія Ґайтан, із завданням, коли республіка вступає в нове десятиліття. У міру повільного повернення ситуації до норми багато хто сподівається, що ця перемога нарешті спрямує крихку республіку до більш гуманного майбутнього.\n"
    COL_News.39B.a: "Буря нарешті стихає."

    COL_News.40A.t: "[Get_newspaper_header]Мікельсен забезпечує собі другий президентський термін"
    COL_News.40A.desc: "Спадщину Мікельсена забезпечено. Попри те, що його переслідували погані відносини з внутрішньою опозицією, розслідування його особистої поведінки та клієнтелізму, Президент зберіг значну підтримку серед колумбійського електорату. Дехто побоювався, що поточні розслідування поставлять під загрозу його довгострокові амбіції, але тепер, коли він тріумфує, очевидно, що вони не завадили його переобранню.\n\nХоча звинувачення у фальсифікаціях, пов’язані з виборами, були відхилені виборчою владою Колумбії, це мало допомогло вгамувати заворушення: у столиці та інших великих містах оголошено протести. Попри це, ці результати підтвердили статус Ліберального революційного руху як спадкоємця спадщини Ґайтана, але з огляду на зростання тиску лише час покаже, чи триватиме їхнє бачення країни.\n"
    COL_News.40A.a: "Libertad y Orden, збережені в Боготі."
    COL_News.40B.t: "[Get_newspaper_header]Альфонсо Лопес Мікельсен перемагає на надзвичайних виборах 1970 року"
    COL_News.40B.desc: "Після відставки президента Каміло Торреса Рестрепо Народне кабільдо провело нові вибори. Після розпаду Фронту єдности народу Рестрепо через розкол між соратниками колишнього президента Альфонсо Лопес Мікельсен і його Ліберальний революційний фронт здобули перемогу зі значною більшістю.\n\nАльфонсо Лопес Мікельсен, також відомий як «el Pollo», був помітною популярною постаттю, яку Президент Рестрепо відсунув убік після вступу на посаду. Через його популярність дехто казав, що ця перемога була лише відкладена і що саме він мав стати Президентом у 1968 році. Мікельсен, отримавши мандат, подякував своїм прихильникам і пообіцяв втілити свої ідеали в життя."
    COL_News.40B.a: "Курча летить!"
    #Both Need Writing

    #New Granada Post-War Events
    COL_News.41.t: "[Get_newspaper_header]Хільберто Альсате Авенданьйо помер!"
    COL_News.41.desc: "Завершення Ла Віоленсії принесло новий порядок в Афіни Південної Америки, але тепер виникають сумніви щодо його довговічності через смерть Ель Дуче, Хільберто Альсате Авенданьйо, після тривалої боротьби з раком, лише через кілька місяців після завершення Громадянської війни. Невдовзі після оголошення про смерть Авенданьйо Велика рада фашизму Нової Гранади оголосила, що перебере надзвичайні повноваження для обрання нового Дуче.\n\nВелика рада також оголосила про оприлюднення офіційного заповіту покійного лідера та публікацію його мемуарів у найближчі дні.\n\nЦікаво, що нещодавні засідання Великої ради продемонстрували посилення націоналістичного крила, а з огляду на те, що ANP об’єдналася зі значною частиною старого консервативного істеблішменту Республіки, багато хто тепер замислюється, що станеться з планами Дуче принести фашизм до Колумбії."
    COL_News.41.a: "Навіть після смерті ми все ще можемо жити далі."

    COL_News.42.t: "[Get_newspaper_header]Acción Nacional Popular бере гору"
    COL_News.42.desc: "Приголомшливі новини з Боготи: ANP оголосила, що спробу перевороту олігархів Верховної економічної ради було жорстоко придушено. Схоже, становище партії як гегемона Колумбії й надалі залишається непохитним.\n\nРазом із очікуваними новинами про чистки серед капіталістів та олігархів уряд оголосив про обрання нового Дуче — Аугусто Раміреса Морено, який виконував обов’язки тимчасового лідера відтоді, як помер Альсате.\n\nМорено відомий як один із засновників Лос Леопардос, групи, яка надихнула Альсате, однак Морено, схоже, дотримується поміркованіших поглядів і відомий як член Націоналістичної фракції партії. Лише час покаже, що його правління означатиме для Нової Гранади."
    COL_News.42.a: "Колос без кайданів чи гнилий зсередини?"
    #COL_News.42.b: "It seem" #Japanese Response
    #COL_News.42.c: "Those damned rats..." #Italian Response
    #COL_News.42.d: "The Invisible Hand better not give the Japanese a foothold in our backyard." #US Response
    #COL_News.42.e: "May they both rot." #Communist Response
    COL_News.42.f: "Можливо, це можна обернути нам на користь..." #Iberian Response

    COL_News.43.t: "[Get_newspaper_header]Кінець фашизму в Колумбії"
    COL_News.43.desc: "У Новій Гранаді організація, відома як Asociación Nacional de Industriales de Colombia, до складу якої входять провідні капіталісти та промисловці країни, здійснила несподіваний переворот. Цей державний переворот усунув ANP від влади, передавши діловій раді повний контроль над державою.\n\nНа чолі ANDI стоїть Дієго Ґарсес Хіральдо, творець Верховної економічної ради, органу розвитку, відповідального за величезне економічне зростання Нової Гранади. Він змінив нещодавно вбитого Хуліо Маріо Санто-Домінґо, який обіцяв повернення до демократії та лібералізації.\n\nЛише час покаже, чи нова адміністрація дотримуватиметься його обіцянок, чи її мета полягає лише у зміцненні влади останньої зграї володарів Колумбії."
    COL_News.43.a: "Відроджена свобода чи лише фасад?"
    COL_News.43.b: "Нам потрібна лише нагода." #German Response
    COL_News.43.c: "Нехай хороші часи тривають." #Japanese Response

    COL_News.44.t: "[Get_newspaper_header]Нова Колумбійська Республіка"
    COL_News.44.desc: "Нестабільність продовжує стрясати Колумбію, оскільки уряд Аугусто Раміреса Морено пережив спробу перевороту з боку жорсткого крила партії на чолі із Сільвіо Вільєґасом, близьким другом Раміреса, яке представляло бастіон фашизму в ANP. Тепер, після чистки його членів, схоже, фашизм у Колумбії дійшов кінця.\n\nНе менш дивовижно, що в наступні після спроби перевороту дні Морено оголосив широкий спектр урядових реформ, плани яких, імовірно, і спричинили переворот. Найважливішою серед цих реформ стало запровадження нової Конституції за зразком Конституції Республіки 1886 року, яка офіційно називає нову державу «Національною Республікою Колумбія».\n\nНещодавно проголошений Президент пообіцяв зберігати ідеали Альсате, водночас обіцяючи, що нова Республіка буде справді національною."
    COL_News.44.a: "Теза. Антитеза. Синтез."
    COL_News.44.b: "У коханні та політиці все дозволено." #Japanese Response
    COL_News.44.c: "Найкращий результат, на який ми могли сподіватися." #Italian Response
    COL_News.44.d: "Менше чорного, але все одно чорна пляма на континенті." #US Response
    COL_News.44.e: "Нехай вони обоє згниють." #Communist Response
    COL_News.44.f: "І ось, адіос нашому старому партнеру." #Iberian Response

    COL_News.45.t: "[Get_newspaper_header]Жорсткі лінійці здійснюють переворот проти Аугусто Раміреса Морено"
    COL_News.45.desc: "Сьогодні з Нової Гранади надходять нові новини: Аугусто Рамірес Морено, лідер країни та наступник Авенданьйо, був усунутий від влади внаслідок того, що деякі експерти називають «внутрішньопартійним переворотом». Сільвіо Вільєґас, колишній Виконавчий секретар партії, тепер склав присягу як президент.\n\nЦя зміна керівництва сталася після жорсткої внутрішньої критики Морено з боку опозиційних партій. Неочікувано було ухвалено вотум недовіри невеликою більшістю, що призвело до сходження Вільєґаса на посаду президента.\n\nВільєґас є прихильником жорсткої лінії в системі Нової Гранади, особливо порівняно з Морено. У своїй інавґураційній промові він пообіцяв «дотримуватися фашистських ідеалів нашої країни в думках і справах». Потім він пообіцяв перетворити Нову Гранаду на цілковито фашистську країну, попри численні виклики та перешкоди на її та його майбутньому шляху.\n"
    COL_News.45.a: "Я думав, що сенс фашизму — не допустити голосування за своє усунення?"
    COL_News.45.b: "Оце наш інший чоловік!"
    COL_News.45.c: "Ще більше хаосу в Колумбії?"

    COL_News.46.t: "[Get_newspaper_header]Старі консерватори здійснюють переворот проти уряду Колумбії"
    COL_News.46.desc: "Події в Колумбії продовжують дивувати, оскільки, схоже, коаліція поміркованих генералів та аристократів здійснила переворот проти уряду. Сьогодні новий уряд підтвердив, що архієпископ Рауль Самбрано Камадер очолить тимчасовий уряд національної єдности, керуючи відновленням країни після Ла Віоленсії.\n\nОднак коаліція здається нестійкою, а побоювання щодо співпраці нового уряду з фашистською ANP зростають, адже, схоже, все його керівництво походить саме з неї. Схоже, Колумбія звертатиметься до свого минулого в пошуках натхнення і, не дивно, до Піренейського півострова, оскільки новий уряд переважно складається з іспанофілів.\n\nЖодної інформації щодо повернення до цивільного правління не надано."
    COL_News.46.a: "Повернення до 1910 року?"

    COL_News.47.t: "[Get_newspaper_header]Фернандо Лондо́ньйо-і-Лондо́ньйо призначений тимчасовим лідером"
    COL_News.47.desc: "Коли президент Колумбії Сільвіо Вільєґас оголосив про намір націоналізувати всі галузі промисловості, представлені у Верховній економічній раді, він започаткував місяці економічних потрясінь і політичного галасу. Ця криза, схоже, досягла кульмінації після вотуму недовіри Вільєґасу, який усунув його від влади, але не залишив очевидного наступника.\n\nЩоб покласти край глухому куту, партія проголосувала за обрання Фернандо Лондо́ньйо-і-Лодо́ньйо, колишнього міністра пропаганди, тимчасовим главою держави. Аристократ, добре пов’язаний із колами, які спричинили падіння Вільєґаса, Лондо́ньйо користується широкою повагою в партії як об’єднавча та неамбіційна постать. У своїй інавґураційній промові він визнав кризу в партії та пообіцяв спрямувати державний корабель у спокійні води, де хтось інший зможе його змінити.\n"
    COL_News.47.a: "І коли це буде?"
    COL_News.47.b: "Сподіваюся, вони зможуть мирно владнати свої розбіжності."
    COL_News.47.c: "Коли безхребетні люди керують, уся спільнота дрейфує."
    COL_News.47.d: "Принаймні вони знову не вбивають одне одного..."

    COL_News.48.t: "[Get_newspaper_header]Подвійні перевороти в Колумбії"
    COL_News.48.desc: "Після невдач у боротьбі з повстанцями на півночі та сході Нової Гранади президента Аугусто Раміреса Морено було усунуто внаслідок військового перевороту. Генерал Ернандо Фореро Ґомес узяв під контроль країну, розпустив національні збори та зробив військових і національну поліцію єдиною владою, що бореться з повстанцями.\n\nКонтроль Ґомеса не є абсолютним, оскільки генерал Ернандо Курреа Кубідес оголосив себе тимчасовим президентом. Курреа запевнив уряд і громадськість, що має намір повернути країну до нормального життя. Невідомо, чи спробує він використати свою популярність, щоб стати президентом, чи передасть владу назад партії."
    COL_News.48.a: "Це наш третій... ні... четвертий чоловік!"
    COL_News.48.b: "Вони взагалі можуть узяти це під контроль?"

    COL_News.49.t: "[Get_newspaper_header]Ернан Харамільйо Окампо призначений наступником Морено"
    COL_News.49.desc: "Аугусто Рамірес Морено подав у відставку з посади Президента Нової Гранади після смерті свого сина. Після поступового відходу від політики його наступником було оголошено Ернана Харамільйо Окампо, вправного економіста в уряді Нової Гранади.\n\nБільшість вважає Окампо відстороненою постаттю, водночас його хвалять за підтримання зв’язків із кавовими баронами його департаменту Кальдас. Його пропозиції щодо посилення промислового розвитку Колумбії викликали здивування в партії.\n\nПопри підозри, його економічний підхід приніс стабільність та економічне зростання охопленому війною регіону. Лише час покаже, чи зможе цей економіст узяти віжки Нової Гранади."
    COL_News.49.a: "Аби тільки мені дісталася моя Folgers..."
    COL_News.49.b: "Кавовий чоловік зможе!"
    COL_News.49.c: "Чи може економіст принести мир?"

    COL_News.50.t: "[Get_newspaper_header]Беліcаріо Бетанкур призначений наступником Морено"
    COL_News.50.desc: "Аугусто Рамірес Морено офіційно подав у відставку з посади Президента Нової Гранади, назвавши вбивство свого сина головною причиною відходу з посади. Його відхід від політики очікували багато хто, хоча більшість не думала, що це займе стільки часу. Після короткої церемонії Нова Гранада оголосила його наступником Белісаріо Бетанкура Куартаса.\n\nБетанкур вважається спадкоємцем деяких ідеалів Лауреано Ґомеса. Один із 22 дітей у бідній родині, Бетанкур переймається поліпшенням становища простих людей Колумбії та заявив, що його головним завданням як Президента буде спрямувати державу на покращення умов життя бідних.\n\n"
    COL_News.50.a: "Це наш третій чоловік!"
    COL_News.50.b: "Невже ніхто не може ними керувати!?!"

    COL_News.51.t: "[Get_newspaper_header]Ернан Харамільйо Окампо змінює Сільвіо Вільєґаса"
    COL_News.51.desc: "Після безпрецедентної кампанії націоналізації власності та внутрішніх чисток президент Сільвіо Вільєґас оголосив про свою відставку, посилаючись на «завершення революційної традиціоналістської доктрини», яку він та інші Леопардос задумали в 1920-х роках.\n\nПісля відставки Вільєґаса реорганізована ANP обрала його заступника Ернана Харамільйо Окампо Президентом. Інсайдери партії описують Харамільйо як упертого й авторитарного чоловіка, націоналіста, але водночас людину, міцно вкорінену в олігархії Кальдасу. Успіх Вільєґаса тепер дозволить йому отримати безпрецедентний контроль над економікою та політичною сферою Колумбії. Очікується, що з цією стабільною та твердою рукою Харамільйо продовжить роботу свого попередника й надалі формуватиме країну за образом її нових господарів.\n"
    COL_News.51.a: "Колумбія дедалі глибше падає в прірву."
    COL_News.51.b: "Вільєґасу вдалося зірвати кайдани з Колумбії."
    COL_News.51.c: "Сильні самі творять своє майбутнє."
    COL_News.51.d: "Хто коли-небудь чув про фашиста, який добровільно пішов у відставку?"

    COL_News.52.t: "[Get_newspaper_header]Кастор Харамільйо формує новий уряд у Новій Гранаді"
    COL_News.52.desc: "Коли президент Колумбії Сільвіо Вільєґас оголосив про намір націоналізувати всі галузі промисловості, представлені у Верховній економічній раді, він започаткував місяці економічних потрясінь і політичного галасу. Ця криза, схоже, завершилася вотумом недовіри Великої ради, що призвів до усунення Вільєґаса та ретельної чистки його союзників в адміністрації.\n\nПісля цих подій Кастор Харамільйо тепер склав присягу як новий президент Колумбії. У своїй інавґураційній промові він проголосив намір співпрацювати з колумбійською аристократією, сигналізуючи про різку зміну політики правлячої партії Гранади. Аристократія старої республіки спромоглася закріпити не лише свою економічну владу над новою державою, а й політичну хватку, стрімко стираючи межі між державою та бізнесом.\n"
    COL_News.52.a: "Плоди фашизму достигають."
    COL_News.52.b: "Сподіваємося, стабільніша система."
    COL_News.52.c: "Капітал продовжує заковувати слабких у кайдани."
    COL_News.52.d: "І все це лише для повернення до старої республіки?"

    COL_News.53.t: "[Get_newspaper_header]Тимчасовий уряд іде у відставку в Колумбії"
    COL_News.53.desc: "Протягом останніх кількох місяців спостерігачі та уряди з дедалі більшим занепокоєнням стежили за протестами та страйками, що розгорталися в Колумбії, побоюючись, що вони віщують щось гірше. Сьогодні ці побоювання не справдилися, оскільки переговори між урядом і протестувальниками нарешті принесли плоди: Камадер поступився своєю посадою та подав у відставку. На його місце Національні збори призначили Ґільєрмо Леона Валенсію як його наступника.\n\nОбличчя колумбійського консерватизму, Валенсія давно є союзником олігархії, і його призначення свідчить, що відставка Камадера може бути межею поступок. Глибока релігійність Валенсії та його відносна популярність надали його сходженню вкрай необхідної легітимности. Однак чи зможе це перетворитися на стабільність і захист інтересів Національної партії — зовсім інше питання.\n"
    COL_News.53.a: "Голуб повертається, несучи оливковий листок. Але чи справді цей листок новий?"

    COL_News.54.t: "[Get_newspaper_header]Тимчасовий уряд іде у відставку в Колумбії"
    COL_News.54.desc: "Протягом останніх кількох місяців спостерігачі та уряди з дедалі більшим занепокоєнням стежили за протестами та страйками, що розгорталися в Колумбії, побоюючись, що вони віщують щось гірше. Ці побоювання справдилися, коли переговори між протестувальниками та урядом зазнали краху, а армія вдалася до жорстокого придушення протестів через масові вбивства, замахи та арешти. Засуджуючи насильство, президент Самбрано оголосив про свою відставку, але шкоди вже завдано.\n\nПісля усунення Самбрано від влади та відставки значної частини цивільної адміністрації в жаху й ганьбі генерал Ернандо Курреа Кубідес, як очікується, перебере управління країною й навряд чи віддасть його. Виснажена десятиліттями політичного насильства Колумбія, схоже, остаточно завершила епоху Національної партії при владі, а крило франкістів Курреа готується домінувати в колумбійській політиці протягом наступних років.\n"
    COL_News.54.a: "Король, якого коронують кров’ю."

    COL_News.55.t: "[Get_newspaper_header]Прийнято Конституцію Другої Республіки Колумбії"
    COL_News.55.desc: "Після тривалих дебатів новоназвана Друга Республіка Колумбії завершила розробку та ратифікувала нову конституцію держави. Нова конституція відновлює вибори губернаторів, тоді як посада президента залишається суто законодавчим процесом. Водночас вона розширює повноваження президента, надаючи необмежене право вето та можливість призначати міністрів без необхідности затвердження законодавчим органом, а також спрощує процедури імпічменту, щоб запобігти перевищенню виконавчих повноважень.\n\nЦя нова конституція з’являється в час економічного відродження Колумбії. Через величезну владу корпорацій у ще не оговтаній Колумбії конституція надала цим компаніям захист і привілеї, забезпечивши їм міцну хватку над політикою.\n\nЧинний президент Дієго Ґарсес Хіральдо оголосив, що залишиться у виконавчій владі, попри нову конституцію."
    COL_News.55.a: "Це демократія?"
    COL_News.55.b: "Унікальне колумбійське творіння."

    COL_News.56.t: "[Get_newspaper_header]Лондо́ньйо-і-Лондо́ньйо йде у відставку"
    COL_News.56.desc: "Після того як бурхлива політика Колумбії винесла його до влади, схоже, тимчасовий президент Фернандо Лондо́ньйо-і-Лондо́ньйо зумів заспокоїти бурю. У телевізійному зверненні Лондо́ньйо оголосив про свою відставку, заявивши, що партія пережила кризу і його обов’язок тепер виконано. Тепер він відійде до своєї родини, передавши посаду наступнику, якого визначить партія.\n\nНевдовзі після цього прескомюніке ANP повідомило, що Белісаріо Бетанкур був призначений Президентом більшістю голосів. Відданий державний службовець, відомий своєю увагою до прозорости та реформізму, цей вибір свідчить, що партія може послабити свою міцну хватку над владою. Компромісна натура Белісаріо, продемонстрована в його інавґураційній промові, разюче відрізняється від методів його попередників — саме цього так прагне виснажена війною країна."
    COL_News.56.a: "Нова ера чи лише новий фасад?"
    COL_News.56.b: "Сильна людина, але чи зможе вона виконати обіцяне?"
    COL_News.56.c: "Можливо, тверда рука зможе витягти Колумбію з її трясовини."
    COL_News.56.d: "Шлях до стабільности?"

    COL_News.57.t: "[Get_newspaper_header]Лондо́ньйо-і-Лондо́ньйо йде у відставку"
    COL_News.57.desc: "Після того як бурхлива політика Колумбії винесла його до влади, схоже, тимчасовий президент Фернандо Лондо́ньйо-і-Лондо́ньйо зумів заспокоїти бурю. У телевізійному зверненні Лондо́ньйо оголосив про свою відставку, заявивши, що партія пережила кризу і його обов’язок тепер виконано. Тепер він відійде до своєї родини, передавши посаду наступнику, якого визначить партія.\n\nМайже одразу ANP опублікувала заяву, у якій подякувала Лондо́ньйо за зразкову службу нації та повідомила країну про рішення призначити Ернана Харамільйо Президентом. Харамільйо відомий як упертий та авторитарний чоловік і близький союзник сільських еліт його рідного Кальдасу. Харамільйо пообіцяв використати технократичний досвід для досягнення нового економічного зростання, якого не зміг досягти його попередник, водночас продовжуючи інституціоналізувати правління ANP у всіх сферах національного життя."
    COL_News.57.a: "Ланцюги фашизму стискаються навколо Колумбії."
    COL_News.57.b: "Колумбійський повідець не послаблено."
    COL_News.57.c: "Можливо, тверда рука зможе витягти Колумбію з її трясовини."
    COL_News.57.d: "За нові часи, такі самі."

    COL_News.58.t: "[Get_newspaper_header]У Колумбії встановлено військовий уряд"
    COL_News.58.desc: "Картковий будинок нарешті обвалився в Колумбії. Після масових протестів через нездатність уряду ефективно впоратися з триваючим повстанням протести було швидко придушено. Однак після масових відставок це лише остаточно забезпечило крах попереднього уряду, а військові тепер не гаючи часу запроваджують воєнний стан і швидко закріплюють своє новонабуте становище.\n\nПереворот, організований генералом Ернандо Курреа Кубідесом, офіційно відкинув деякі тенденції, яких дотримувався його попередник, натомість оголосивши про нову підтримку Франко та пообіцявши повернення до нормального життя під твердою рукою військових, а сам Кубідес офіційно оголосив тимчасовий уряд. Однак мало хто знає, куди приведе ця рука і чи побачить Колумбія справжні кроки назад до цивільного уряду.\n"
    COL_News.58.a: "Ворон летить над головою, обіцяючи мир крізь свої терни."

    COL_News.59.t: "[Get_newspaper_header]У Колумбії встановлено військовий уряд"
    COL_News.59.desc: "Вогні палають ще яскравіше. Роками Колумбія потерпала від нестабільности та війни, і ця закономірність продовжилася ще далі. Розчарований кроками, які сприймалися як послаблення сили уряду, та постійними невдачами в придушенні соціялістичних і націоналістичних повстань, Верховний командувач Ернандо Фореро Ґомес здійснив переворот за підтримки військових і поліцейських підрозділів.\n\nХоча міністерства хитаються без чіткого негайного керівництва, мало хто сумнівається в намірах самого Фореро. Розпочавши свій перший виступ із засудження уявного виродження попереднього режиму, він пообіцяв гарантувати запровадження фаланґізму в стабільній Колумбії та покласти край багаторічному насильству, що мучить країну. Чи зможе він виконати ці обіцянки, чи військові коли-небудь припинять марширувати вулицями Боготи — одне зрозуміло:\n"
    COL_News.59.a: "Очі Головного катівника тепер жадібно нишпорять усією країною."

    COL_News.60.t: "[Get_newspaper_header]Військові зберігають владу в Колумбії"
    COL_News.60.desc: "Щупальця дедалі глибше проникають у Боготу. Багато хто міг бути приголомшений подіями навколо першого перевороту Курреа, але мало хто здивувався б результатам його останньої промови. Посилаючись на занепокоєння щодо тривалого тероризму та звинувачення в подальшій підривній діяльності, генерал Ернандо Курреа Кубідес у телевізійному виступі оголосив, що Вища військова рада безстроково продовжить своє правління.\n\nБільшість тих, хто ще виступав проти планів Курреа, замовкли, але наслідки очевидні: ANP буде відсунута на другий план, а військові та Католицька церква ділитимуть владу. На міжнародному рівні ці події зустріли стримано, за винятком Піренейського півострова, який висловив схвалення новому режиму, тоді як кардинали Католицької церкви тихо висловили сподівання, що їхня нова центральна роль буде важливою для розвитку режиму.\n"
    COL_News.60.a: "Курреа ніколи не був Цинциннатом."

    COL_News.61.t: "[Get_newspaper_header]Військові зберігають владу в Колумбії"
    COL_News.61.desc: "Листя опало, залишивши самі стовбури. Мало хто зі спостерігачів здивувався, коли зусилля Верховного командувача Ернандо Фореро Ґомеса зі встановлення військової хунти увінчалися успіхом. Попри певний стриманий опір протягом останніх місяців, тепер очевидно, що останні жарини внутрішньої боротьби за владу всередині ANP було заглушено гарматами та кийками колумбійських військових.\n\nМаючи репутацію особливо жорстокого командувача, він давно відомий своїми симпатіями, рабськи відданими фаланґізму, погляд, який він залюбки розпалював. Тепер, консолідуючи свою владу, він, схоже, неминуче прагнутиме забезпечити ідеологічну лояльність і чистоту по всій Колумбійській Республіці. Якщо не через дуло рушниці, то це неодмінно буде забезпечено підписанням чека.\n"
    COL_News.61.a: "Сокира фасцій прорубує собі шлях крізь Амазонку."

    COL_News.62.t: "[Get_newspaper_header]Військовий уряд іде у відставку в Колумбії"
    COL_News.62.desc: "Меч, можливо, знову сховано в піхви, але його блиск усе ще сяє. Оголосивши, що ситуацію стабілізовано і необхідність нагляду за адміністративним порядком зникла, військові офіційно оголосили про припинення діяльности хунти та перехід назад до цивільного правління. У відповідь ANP призначила Ернана Харамільйо Окампо Президентом як її наступника.\n\nПровідний технократ ANP, Окампо вже здобув репутацію потайного, авторитарного та впертого діяча, але тепер його буде випробувано боротьбою з тиском укоріненого апарату безпеки, поєднаним із широкою втомою від фракційності. Чи справді його репутація випереджатиме його й допоможе забезпечити реалізацію його бачення, чи військові продовжать втручатися — ще належить побачити.\n"
    COL_News.62.a: "Стерв'ятники обрали собі вовка."

    COL_News.63.t: "[Get_newspaper_header]Військовий уряд іде у відставку в Колумбії"
    COL_News.63.desc: "Меч, можливо, знову сховано в піхви, але його блиск усе ще сяє. Оголосивши, що ситуацію стабілізовано і необхідність нагляду за адміністративним порядком зникла, військові офіційно оголосили про припинення діяльности хунти та перехід назад до цивільного правління. У відповідь ANP призначила Белісаріо Бетанкура Куартаса Президентом як її наступника.\n\nНащадок реформістського блоку Морено, Белісаріо вважається відносно прозорим і дипломатичним діячем, здатним підтримувати грубе відчуття стабільности в Колумбії, і, ймовірно, послабить деякі жорсткіші механізми адміністративних репресій. Однак навіть після передачі влади військовий та силовий апарат залишається сильним і постійно виходить за межі своїх повноважень, що, ймовірно, продовжить загострювати напруженість протягом його адміністрації.\n"
    COL_News.63.a: "Мефістофель дає про себе знати."

    COL_News.64.t: "[Get_newspaper_header]Альфонсо Урібе Місас проводить чистку націонал-американістів"
    COL_News.64.desc: "Напружена багатотижнева боротьба за владу за лаштунками нового уряду Держави Колумбія сьогодні вийшла назовні після арешту Хосе Камачо Карреньйо та заборони руху націонал-американістів. У заяві для преси президент Альфонсо Урібе Місас стверджував, що служби безпеки викрили змову Камачо та його соратників із метою вбити його, і назвав його зрадником.\n\nХоча уряд намагався приховати цю справу, вважається, що джерелом суперечки були наміри Місаса реабілітувати Консервативну партію та поступово відновити структури старої республіки, що змусило радикальних націонал-американістів розірвати відносини з його режимом. Тепер, однак, схоже, шлях відкритий для Місаса, щоб посісти трон повалених лідерів Боготи та сформувати його за своїм образом."
    COL_News.64.a: "Як завжди, фашисти ніколи не можуть мирно владнати свої розбіжності."
    COL_News.64.b: "Довгий ніж треба тримати гострим."
    COL_News.64.c: "Чи повертається стара республіка?"

    COL_News.65.t: "[Get_newspaper_header]Націонал-американістський переворот у Колумбії"
    COL_News.65.desc: "Хоча відкрита війна в Колумбії завершилася, схоже, політичне насильство й далі визначає її шлях. Сьогодні новий уряд Колумбії було жорстоко повалено бойовиками, пов’язаними з радикальним рухом націонал-американістів. Лідер руху Хосе Камачо Карреньйо оголосив про смерть колишнього президента Альфонсо Урібе Місаса та «початок Національної революції», проголосивши Вільну державу Колумбія.\n\nКамачо, колишній член Лос Леопардос і Консервативної партії, давно відомий як радикал, а його репутацію богемного гульвіси лише погіршив час у в’язниці за вбивство свого шурина та політичний радикалізм. Попри його беззаперечні інтелектуальні здібності та економічні знання, вважається, що німецька політика щодо Колумбії може змінитися через схильність Камачо до непослідовних рішень, хоча з Європи поки що не пролунало жодних коментарів."
    COL_News.65.a: "Щойно ти подумав, що гірше вже не буде..."
    COL_News.65.b: "Що він, на його думку, робить?"
    COL_News.65.c: "Чи потоне Колумбія знову в крові?"

    COL_News.66.t: "[Get_newspaper_header]Армійський переворот у Колумбії"
    COL_News.66.desc: "У міру того як внутрішня ситуація дедалі більше виходить з-під контролю Боготи, а збройний конфлікт знову спустошує Колумбію, надійшли повідомлення про те, що армія усунула президента Камачо та його кабінет, передавши повноваження Державній раді, а рух націонал-американістів було піддано чистці. Генерал Діоґенес Хіль проголосив «кінець хаосу та повернення до нормального життя», попри те, що в частинах міста все ще лунають постріли.\n\nНовини надійшли після зустрічі між Камачо та німецьким послом у Колумбії щодо постачання кави та інших важливих товарів до Німеччини, яка, очевидно, завершилася невдачею, що змусило багатьох повірити, ніби Абвер доклав руку до організації перевороту. Очевидці навіть заявляли, що ймовірний колумбійсько-німецький агент Геріберт Швартай був присутній серед прихильників генерала Хіля під час здійснення перевороту."
    COL_News.66.a: "Спробуйте змусити крайніх націоналістів працювати разом..."
    COL_News.66.b: "Кризу відвернуто."
    COL_News.66.c: "Принаймні він поміркованіший..."

