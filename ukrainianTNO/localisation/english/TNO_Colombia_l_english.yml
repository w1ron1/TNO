  # Leader Descriptions
  POLITICS_COL_ROBERTO_URDANETA_DESC: "Народжений 27 червня 1890 року, Роберто Урданета Арбелаес є, мабуть, ідеальним прикладом сучасного аристократа з широкими зв'язками. Син генерала та нащадок одного з перших кріольських визволителів, Урданета вже у 26 років став депутатом конгресу від консерваторів. У 1917 році він одружився з представницею престижної родини Ольґінів, ще більше зміцнивши своє становище на самій вершині колумбійського суспільства.\n\nЛюдина суворої самодисципліни та бездоганних манер, Урданета у 1931 році був призначений міністром закордонних справ і відіграв ключову роль у завершенні конфлікту з Перу, після чого згодом став послом. У цей час він примирився з Лауреано Гомесом, своїм супротивником у PCC та випускником школи Святого Варфоломія в Боготі, завдяки спільним антикомуністичним та абсолютистським амбіціям. З часом він став найближчим до «Базиліска» з-поміж усіх, кого той міг назвати справжнім другом.\n\nЇхні долі здавалися нерозривно пов'язаними аж до смерті останнього під час громадянської війни. Та схоже, Урданета продовжив дотримуватися його бачення навіть після цього. Продовжуючи жорстокі репресії, що розривали партію на частини, підписавши безчестяне перемир'я, яке зруйнувало вірність армії, намагаючись ухвалити тоталітарну конституцію... Яка трагедія, що бачення, якого він дотримується, є баченням незліченних провалів."
  POLITICS_COL_ROBERTO_URDANETA_TWO_DESC: "Народжений 27 червня 1890 року, Роберто Урданета Арбелаес є, мабуть, ідеальним прикладом сучасного аристократа з широкими зв'язками. Син генерала та нащадок одного з перших кріольських визволителів, Урданета вже у 26 років став депутатом конгресу від консерваторів. У 1917 році він одружився з представницею престижної родини Ольґінів, ще більше зміцнивши своє становище на самій вершині колумбійського суспільства.\n\nЛюдина суворої самодисципліни та бездоганних манер, Урданета у 1931 році був призначений міністром закордонних справ і відіграв ключову роль у завершенні конфлікту з Перу, після чого згодом став послом. У цей час він примирився з Лауреано Гомесом, своїм супротивником у PCC та випускником школи Святого Варфоломія в Боготі, завдяки спільним антикомуністичним та абсолютистським амбіціям. З часом він став найближчим до «Базиліска» з-поміж усіх, кого той міг назвати справжнім другом.\n\nТепер, коли Корпоратистську конституцію ухвалено, а військових утихомирено, їхнє спільне бачення навічно увічнене. Та цього недостатньо: щоб по-справжньому перетворити PCC на левіафана, про якого вони обоє мріяли, знадобиться ще багато безсонних ночей. І не лише для нього, а й для всієї країни."
  POLITICS_COL_ALVARO_GOMEZ_DESC: "Народжений 8 травня 1919 року та син сумнозвісного Лауреано Гомеса, Альваро багато в чому пішов слідами батька, очоливши партійну газету та ставши свідком усіх його діянь.\n\nПопри своє раннє захоплення Франко та Гітлером, молодий Гомес перетворився на голос нового покоління консерваторів: він визнає вади системи, створеної його батьком, але усвідомлює, що її руйнування лише призведе до ще більшого хаосу. Його прагматична позиція дозволила йому заручитися прихильністю старої гвардії, водночас подарувавши колумбійському народу чистий аркуш завдяки своєму тихому голосу, переконливій риториці та фірмовій усмішці.\n\nУ межах своїх реформ спадкоємець Базиліска прагне позбавити PCC притаманної їй корупції та стерти образ партії, що стоїть над самими законами, які вона пише. Водночас він прагне створити сприятливе для бізнесу середовище, щоб відновити економіку країни, попри погіршення відносин із Пактом.\n\nПравду кажучи, багато його планів, здається, суперечать спадщині його батька. Насправді вони здавалися б безглуздими, якби не море проблем, у якому опинилася партія. Залишається лише сподіватися, що після десятиліть так званої «собачої дисципліни» PCC усе ще можна навчити нових трюків."

  POLITICS_COL_GUSTAVO_ROJAS_PINILLA_DESC: "Народжений у родині середнього класу в Тунсі 12 березня 1900 року, Пінілья, якого ласкаво називають «Ґурропін», стрімко просувався кар'єрними сходами колумбійської армії, а також вивчав цивільну інженерію у Сполучених Штатах. Тривала військова кар'єра Рохаса, що включала службу аташе як у Німеччині, так і в США, а також роль інтелектуального натхненника аеропорту Ель-Дорадо, зрештою привела його на посаду Верховного головнокомандувача Збройних сил.\n\nЛа Віоленсія довела, що ця посада була радше тягарем, ніж честю. Політичне втручання та чвари всередині PCC зірвали його спроби відновити порядок у сільській місцевості та затьмарили його тріумф під час відвоювання Боготи. На нього звалили всю провину за кожну невдачу, не віддавши йому жодної заслуги. Останньою плямою стало образливе перемир'я, підписане Урданетою, яке віддало повстанцям понад третину країни.\n\nТепер, коли PCC усунуто від влади, а НФ тікає з країни, Пінілья є беззаперечним господарем Колумбії. У своїй мудрості він не править сам. Військова рада, до якої увійшли найкращі генерали, промисловці та технократи Колумбії, дала Цезарю Анд на присягу виправити всі помилки його попередників. Горе тим, хто стане на його шляху."

  POLITICS_COL_LLERAS_CAMARGO: "Попри своє славетне прізвище, Альберто Єрас Камарго народився в скромній родині. Та завдяки турботі своїх дядьків Єрас зацікавився писемним словом і зміг піти слідами видатних ліберальних діячів своєї родини, ставши журналістом провідних газет Колумбії. Працюючи кореспондентом у Європі, він здобув довіру Альфонсо Лопеса Пумарехо, який згодом відкрив Камарго шлях у політику, запросивши його до свого уряду — спочатку на посаду міністра закордонних справ, а після визнання його заслуг — міністра уряду.\n\nВідданий демократ, Камарго давно виступав за розширення діалогу та співпраці між лібералами й консерваторами, прагнучи запобігти поляризації та радикалізації. Однак ця готовність принесла його партії загибель, адже його підтримка поміркованого Габріеля Турбая замість Гайтана призвела до розколу ліберальних голосів у 1946 році та перемоги консерваторів. Убивство Гайтана та імпічмент Турбая у 1955 році перетворили розкол на прірву, що розірвала партію навпіл.\n\nХаос Ла Віоленсії зробив його досвідченішою людиною, гідною свого прізвиська Ель Монарко, але водночас не позбавив його здатності мріяти. Про ту саму мрію, яку він плекав із 50-х років: звільнити країну. Звільнити її від політичних потрясінь, кричущої нерівності та дискримінації, від правління каудильйо. Тепер, як президент, він нарешті має засоби перетворити цю мрію на реальність."
  POLITICS_COL_LLERAS_RESTREPO: "Народжений у маленькому будинку в Боготі 12 квітня 1908 року, Карлос Єрас Рестрепо походить із біднішої гілки родини Єрасів, що дало йому більше досвіду щоденних труднощів, із якими стикаються колумбійці, ніж більшості політиків істеблішменту. Це знайомство з нуждою визначило його як прихильника всеосяжних планів реформ для хворих структур країни, поставивши його на лівий фланг лоялістських лібералів.\n\nПісля закінчення юридичного факультету впертий Єрас зрозумів, що не зможе здобути ще один диплом у привілейованому університеті, тож натомість став економістом-самоуком. Незабаром він зробив перші кроки в політиці на ліберальній сцені Боготи, де швидко здобув репутацію талановитого радикального агітатора.\n\nЙого репутація спадкоємця справи Гайтана всередині партії дозволила йому обійняти найвищу посаду в державі. Та Єрас не збирається дозволяти новій перспективі затьмарити його погляд. Він прагне національного перетворення, керованого масштабним державним втручанням і захистом місцевої промисловості. Перетворення, яке принесе відродження улюбленій батьківщині."
  POLITICS_COL_HERNANDO_DURAN_DUSSAN: "Із хвилі колумбійської буржуазної завзятості постав загартований воїн на ім'я Ернандо Дуран Дуссан — дивна постать, водночас авангард реформ і нащадок статус-кво. Походячи із сім'ї середнього класу, яка, як і багато інших, прагнула добробуту, він народився 17 червня 1908 року, в часи крайньої бідності, що ще з юності сформувало його непохитне бачення лібералізму. Він став людиною, не більш терпимою до відхилень від справжнього бачення вільноринкової економіки, ніж до похмурої рішучості тих, хто прагнув знищити її засади.\n\nКонсерватори вважають, що ліберали пом'якшилися через потрясіння, та Дуран Дуссан ніколи не був бездіяльним. Він давно розгадав хитрощі своїх старих ворогів і, користуючись законними повноваженнями судової влади, ніколи не вагався завдати удару у відповідь там, де це найбільше паралізувало б змій.\n\nДехто називав його диктатором, що звучало майже як оксюморон, проте його репутація «залізного кулака» Ліберальної партії безперечно заслужена. Вважаючи фашизм, імперіалізм та всі інші форми реакції, близькі чи далекі, образою своєї честі, тут самотньо стоїть лицар старого світу, що бореться за мораль нового часу — сучасний Цинциннат, який мусить вивести свою зламану націю з десятиліть занепаду."
  POLITICS_COL_ELIAS_GARCIA: "Походячи з заможної родини поселенців, де його батько був фронтирменом, який заснував місто в долині Кауки, Еліас Саласар Гарсія народився у 1919 році та виріс неподалік муніципалітету Санта-Роса-де-Кабаль, де виробив сміливу й розумну, але ніколи не войовничу манеру поведінки. До Ла Віоленсії Саласар Гарсія був помітним організатором робітників у Калі, на превеликий жаль багатьох підприємців, хоча й користувався довірою президента Гайтана, робітників і, найважливіше, генерал-лейтенанта Пінільї.\n\nТа ніхто не очікував, що такий часом збурювач, як Саласар Гарсія, здійснить настільки стрімкий злет, та й більшість не пам'ятає, як саме йому вдалося так далеко зайти. Але одне безперечно: він ніколи не був прихильником конформізму. Хоча він популярний серед нижчих класів, його ідеологічне бачення «автентичного соціялізму» не є ані старими червоними ідеалами, ані фашистським нащадком націонал-соціалізму — натомість воно слугує мостом між політикою робітництва та соціальним консерватизмом, найделікатніше поєднаними з непохитним почуттям націоналізму.\n\nОдні називають його демагогом, інші — божевільним. Але насправді його справжній намір тепер, коли він тримає кермо Колумбії, найкраще підсумувати його власними словами: «В економічному аспекті ми є переважно соціялістами, але в соціальному аспекті ми є патерналістами.»"


  POLITICS_COL_LEON_VALENCIA: "Здається доречним, що один із людей, які відіграли ключову роль у кампанії, що повалила Пінілью, тепер є президентом нової демократичної Колумбії та лідером нового різновиду консерватизму.\n\nҐільєрмо Леон Валенсія народився в заможній родині з міста Попаян, будучи сином престижного поета Ґільєрмо Валенсії Кастільйо. З ранніх років він виявляв інтерес до гуманітарних наук, таких як філософія, історія та граматика іспанської мови. Він швидко приєднався до Консервативної партії та розпочав політичну кар'єру, з часом ставши одним із найважливіших консервативних лідерів і вирізняючись як поміркований у партії, що дедалі більше схилялася до фашизму та авторитаризму.\n\nСпостерігаючи за розвитком подій останніх років, Леон Валенсія дійшов висновку, що саме він має робити під час свого президентства, аби зцілити країну після всіх цих років насильства. Старі консервативні політичні доктрини були хибними, і він виправить їхні помилки. Бог велить принести до Колумбії стабільність і порядок, а для цього йому необхідно працювати з Ліберальною партією, будуючи з нею мости, щоб подолати роки ненависті між лібералами та консерваторами."

  ## Conservatives ##
  CLC_Shoulders_of_Giants: "На плечах велетня"
  CLC_Shoulders_of_Giants_desc: "Щоб зрозуміти причини, через які Колумбія палає, слід звернутися до трьох душ, спадком яких стало насильство, що нині розгортається.\n\nПоки в інших частинах нації оплакують убивство Гайтана, у Новій Гранаді звучить реквієм за іншим чоловіком. Маріано Оспіна Перес, великий діяч консерватизму, гордий поборник боротьби проти хибних обіцянок лауреанізму. Чоловік, убитий і повішений на столичній площі натовпом, чию жагу крові Дуче та його співвітчизники досі вважають ненаситною.\n\nЯка кумедна випадковість: попри всі їхні розбіжності, консерваторів, лібералів і соціялістів об'єднує спільний клич. Смерть лакеям лжепророка Лауреано Гомеса. Смерть їхнім далеким покровителям у Германії та Мадриді. Смерть старому ладу.\n\nVeritias Vincit."

  CLC_Reactionary_Den: "Лігво реакціонерів"
  CLC_Reactionary_Den_desc: "Попри всі розмови про те, що режим Нової Гранади виступає проти виродження та хаосу ліберального й марксистського ладу, правда полягає в тому, що проєкт Альсате Авенданьйо є не чим іншим, як лігвом фашистів, реакціонерів, шпигунів, найманців, торговців зброєю та інших злочинців або покидьків з усього світу, яким більше нікуди податися.\n\nХоча це знизило політичну стабільність Нової Гранади до рівня, далекого від ідеального, у цього є свої переваги. Забезпечення та фінансування воєнних зусиль та іншої діяльності обходиться досить дешево, а міжнародні зв'язки, створені злочинними мережами, дають державі безліч можливостей для експлуатації."

  CLC_Saints_Sinners: "Війна святих і грішників"
  CLC_Saints_Sinners_desc: "Радикалізація, спричинена Ла Віоленсією, розколола колумбійське суспільство. Хоча багато воєн можуть претендувати на звання війни брата проти брата, мало які зрівняються з радикалізацією та дегуманізацією, що мучать колумбійське суспільство з середини 50-х років. Неприхована лють до тих, проти кого вони воюють, і байдужість до злочинів власних поборників досягли такого рівня, що саму війну можна уподібнити до війни святих і грішників.\n\nПограбування, бандитизм і вбивства є звичним і повсюдно ігнорованим явищем на кожному фронті. Та незалежно від того, за ким ми спостерігаємо, у розповіді залишається спільний елемент: війна, що спустошує цю країну, буде війною не на життя, а на смерть."

  #New 
  CLC_Party_Oedipus_Tyrannus: "Цар Едіп"
  CLC_Party_Oedipus_Tyrannus_desc: "У серці Нової Гранади височіє колос, відомий як ANP. Створена у 1948 році виборча коаліція зросла до єдиної політичної сили на чверті території Колумбії, а її вплив простягається далеко за її межі. Під прапорами знакової партії крайніх правих зібралися всі — від християнських демократів до нерозкаяних фашистів, об'єднані жагою до влади та націоналістичним запалом.\n\nПодібно до міфічного Едіпа, ANP прагне звільнити свою батьківщину та позбавити її найгірших ворогів, не усвідомлюючи, що цим самим ворогом, на думку значної частини Колумбії, є вона сама."

  CLC_Land_of_Blood_Coffee: "Країна крові та кави"
  CLC_Land_of_Blood_Coffee_desc: "Нова Гранада володіє найродючішими землями всієї Колумбії — багатими землями долини Кауки. По всьому департаменту розкинулися численні плантації сорго, бавовни і, найвідоміше, цукрової тростини, до яких на півночі, з центром навколо Вірменії, приєдналася зростаюча кавова промисловість.\n\nСправжнє багатство цих земель стало очевидним лише після перемир'я, адже скасування Новою Гранадою всіх законів про земельні реформи та потужне фінансування нині зростаючого класу землевласників забезпечили безпрецедентну продуктивність для Економічного буму, хай навіть ціною безпрецедентної кількості людських життів."
  CLC_Land_of_Blood_Coffee_2: "Країна крові та кави"
  CLC_Land_of_Blood_Coffee_2_desc: "Нова Гранада володіє найродючішими землями всієї Колумбії — багатими землями долини Кауки. По всьому департаменту розкинулися численні плантації сорго, бавовни і, найвідоміше, цукрової тростини, до яких на півночі, з центром навколо Вірменії, приєдналася зростаюча кавова промисловість.\n\nСправжнє багатство цих земель стало очевидним лише після перемир'я, адже скасування Новою Гранадою всіх законів про земельні реформи та потужне фінансування нині зростаючого класу землевласників забезпечили безпрецедентну продуктивність для Економічного буму, хай навіть ціною безпрецедентної кількості людських життів."
  CLC_agri_tt: "§RМи не зможемо покращити наш сільськогосподарський розвиток, доки ця ситуація не зміниться.§!"

  CLC_Promise_of_Palmaseca: "Обіцянка Пальмасеки"
  CLC_Promise_of_Palmaseca_desc: "Громадянська війна виявилася напрочуд сприятливою для промислового серця Калі, чиє полум'я заглушували його брати з Антіокії та Боготи. Розкол багатої долини Кауки та навколишніх департаментів гарантував, що вся продуктивність була переорієнтована всередину, розбудовуючи власний регіон замість допомоги віддаленим і охопленим бідністю землям, створивши умови для економічного буму після перемир'я.\n\nВінцем цієї золотої доби стала промислова зона Пальмасека — величезний промисловий комплекс, що є серцем неогранадинського виробництва, з фабриками, які виробляють усе, що може знадобитися державі, відповідно до вимог SEC — організації, відповідальної за його створення. Її обіцянка принести такий рівень зростання всій Колумбії виявляється більш ніж спокусливою."

  CLC_Birds_of_Prey_A: "Хижий птах — лише падаль і нічого більше"
  CLC_Birds_of_Prey_A_desc: "Неогранадинська армія, безперечно, витягнула найкоротшу соломинку з усіх державних інституцій. Значною мірою складаючись із ультраправих воєнізованих угруповань із сумнівною підготовкою, але безсумнівною люттю, нечисленні наявні дивізійні елементи складаються з тилової Третьої дивізії та ветеранів П'ятої. Насправді існування Нової Гранади у 60-х роках більше залежить від відсутності організації у ворогів, ніж від справжньої боєздатності.\n\nПісля кількох невдалих реформ армії сили Нової Гранади можна влучно описати як зграю, змушену покладатися на імпортовану вогневу міць та нечисленних вправних командирів, аби зрівняти шанси. Та всі командири сподіваються, що ситуація зміниться до того часу, коли війна знову розпочнеться."
  CLC_Birds_of_Prey_B: "Хижий птах — неприборкані хижаки"
  CLC_Birds_of_Prey_B_desc: "Упродовж Ла Віоленсії, що триває, було зроблено кілька спроб реформувати неогранадинську армію. Усі вони зазнали невдачі, доки командувач армії Сесар Аугусто Куельяр Веландія не взяв справу у власні руки, запровадивши цілеспрямовані реформи для перетворення простих ополченців на справжні бойові сили.\n\nПахарос та їхні численні воєнізовані й ополченські поплічники отримали підготовку та доктринальне керівництво від італійських аташе. Тим часом регулярна армія імпортувала зброю з Токіо та отримала значне поповнення, що розширило її за межі ядра ветеранів П'ятої дивізії, тим самим зміцнивши неогранадинські збройні сили. Однак, попри ці покращення, командування та управління з Калі залишаються доволі слабкими, змушуючи Нову Гранаду покладатися на ініціативу командирів на полі бою."
  CLC_Birds_of_Prey_C: "Хижий птах — андський кондор"
  CLC_Birds_of_Prey_C_desc: "Упродовж Ла Віоленсії, що триває, було зроблено кілька спроб реформувати неогранадинську армію. Усі вони зазнали невдачі, доки командувач армії Сесар Аугусто Куельяр Веландія не прибув і не взяв справу у власні руки, запровадивши цілеспрямовані реформи для перетворення простих ополченців на справжні бойові сили. Колись джерело розчарування, тепер неогранадинська армія стає гордістю Дуче.\n\nПахарос та їхні численні воєнізовані й ополченські поплічники зберегли свою лютість, але загартували її дисципліною найкращих італійських офіцерів. Чисельність армії зросла, а імпортована зброя йде пліч-о-пліч із кулями, виробленими на вітчизняних фабриках ANDI. Однак найважливішим є повний контроль командування та управління зі столиці Калі, що підняло координацію між їхніми силами на небачений раніше рівень."

  #Proxy
  CLC_Japanese_Support_dynmod: "Японська підтримка"
  CLC_Japanese_Support_dynmod_desc: "Хоча формально другорядна порівняно з допомогою, яку Італія надає державі-відступниці, Японська імперія збільшила свої зобов’язання в регіоні, коли конфлікт розгорівся, демонструючи силу.\n\nЯк військові, так і цивільні кадри тепер працюють над тим, щоб продемонструвати користь, яку Експертність Сфери може принести Америці. Якщо це допоможе Сфері спільного процвітання здобути союзника в регіоні, тим краще."

  CLC_Japanese_technical_assistance: "Японська технічна допомога"
  CLC_Japanese_training: "Японська навчальна підтримка"
  CLC_Japanese_advisors: "Японські радники"

