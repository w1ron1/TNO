  ## Colombia ##
  COL_Fall_Old_Republic: "Падіння Старої Республіки"
  COL_Fall_Old_Republic_desc: "Старий лад, хоч і недосконалий, принаймні досяг того, чого не вдавалося жодному з попередніх: він створив Республіку, національну державу, яка, попри всі свої недоліки, гарантувала певну подобу миру та забезпечувала механізми мирного розвитку законодавства.\n\nТепер цей лад лежить у руїнах, а на його місці панує хаос. Корупція, бандитизм, цинізм і залежність — занепад присутній на кожному рівні. Навіть якщо уряд зуміє вирватися з десятилітнього глухого кута, може бути вже надто пізно, щоб виправити завдану шкоду."

  COL_Paradise_City: "Синдром Райського міста"
  COL_Paradise_City_desc: "Богота постає немов сяючий оазис. Місто сталі й скла, ізольоване від палаючих навколишніх земель. Це епіцентр політичної могутності, густонайбільша міська агломерація, сповнена розкоші, де зосереджені промисловість і еліта Колумбії. На папері це рай. Насправді ж воно гниє під наглядом свого володаря.\n\nЗлочинність розростається в тіні, а на вулицях панує страх. Несправедливість вплітається в тканину травмованого суспільства, а обіцяний потенціал цього величного мегаполіса дедалі більше вислизає, поглинутий похмурою реальністю країни, що воює сама з собою."

  COL_Opium_Clouds: "Опіум у хмарах"
  COL_Opium_Clouds_desc: "Поява опіуму через нелегальні контрабандні ринки Тихоокеанського узбережжя та відкриття рекреаційного вживання марихуани на північному узбережжі призвели до широкомасштабної проблеми зростання попиту на наркотики та наслідків, які це спричинило для громадського здоров'я.\n\nВід викиднів до смертей від передозування — ця деморалізуюча вада перетворила життя нижчих класів республіки на нескінченний пошук задоволення, а їхнє оточення — на жорстоке поєднання насильства та експлуатації.\n\nТа залежність — лише симптом, спосіб для нужденного чоловіка відволіктися від невблаганної реальності, що чекає за його дверима."

  COL_Fields_Opportunity: "Поля можливостей"
  COL_Fields_Opportunity_desc: "Занепалий стан Республіки найкраще видно з її доброзичливого незнання становища у сільських районах. У міру того як вплив уряду скорочується, воєнізовані формування та бандити почали правити сільською місцевістю від імені своїх покровителів або просто заради власної жадібності.\n\nКоли фасад було знято, насильницькі захоплення стали лише малою частиною безжальності, що її демонструє новий нестабільний, але напрочуд прибутковий порядок речей. Адже хоч їх і вигнали з владних залів, старі землевласницькі класи не відмовилися від своїх претензій на них.\n\nСвого часу вони повернуться, і єдине питання — під чиїм прапором вони прикидатимуться, що йдуть, коли цей день настане."

  #Dynamic Army One
  COL_Fallen_Colossus: "Побитий колос"
  COL_Fallen_Colossus_desc: "Як найславетніший, професійний і найстійкіший інститут Колумбії, він неминуче мав зазнати змін разом із усією державою. Колись уславлені честь і доблесть збройних сил згасають, затьмарені дедалі більшою залежністю від грубого насильства та політичних кампаній для збереження свого привілейованого становища в суспільстві.\n\nТа багато в чому Колос не зміг пристосуватися. Попри незмінну перевагу над ненавченими ополченнями, армія тепер постає громіздким пережитком минулого. Вона дорога в утриманні, повільна в мобілізації та уражена пороками, що засіли глибоко в її колись шанованій душі."

  COL_Guardians_Peace: "Охоронці миру та свободи"
  COL_Guardians_Peace_desc: "Реформа Збройних сил давно вважалася необхідною, проте ніхто не сподівався, що вона відбудеться саме так. Невдалий переворот генерала Пінільї та його прибічників змусив провести чистку Збройних сил.\n\nПісля скорочення чисельності Колос було легко підкорено та перетворено на більш професійну й аполітичну силу. Зусилля з розширення реформи, включно з модернізацією, принесли несподіваний успіх завдяки відновленню американської підтримки.\n\nТепер настав час випробування бойовою стрільбою."

  COL_Grand_Army_Republic: "Велика армія Республіки"
  COL_Grand_Army_Republic_desc: "Від самого народження першої Республіки зневажливі еліти Колумбії плели змови, щоб забезпечити владу для себе, кидаючи тінь на величний задум Болівара. Їхні захоплення влади та жадібні маневри лише поглибили рани, завдані розколами 1831 та 1903 років. Тепер вони загрожують знищити останні рештки бачення єдності, цілісності та справедливості, якою мала стати Колумбія.\n\nПід пильним поглядом генерала Пінільї цей повалений колос не просто відродився. Маючи небачену досі чисельність і волю, загартовану у вогні переконань, Велика армія готова знову рушити в похід, щоб покласти край змовам тих, хто прагне побачити падіння Республіки. Немов вогняна буря, немов вивільнений гнів природи, вона очистить поля, не залишивши сліду від своїх ворогів. Республіка постане знову, захищена не лише на полі бою, а й у владних залах."

  COL_Holy_Knights: "Святі лицарі Колумбії"
  COL_Holy_Knights_desc: "Найтяжчою помилкою Колумбії став її відхід від Христа — зрада, започаткована лібералізмом і секуляризмом після Конституції Ріонегро 1863 року. Відмова від божественної вірності зруйнувала бачення великої нації — бастіону, достатньо сильного, щоб захищати свободу в Новому Світі, — і перетворила її на ослаблений суверенітет, вразливий навіть до найменшої організованої загрози.\n\nУ відповідь відроджена Консервативна гегемонія перебудувала її за образом Христа, перетворивши на вірний легіон, присвячений нескінченному хрестовому походу за мир і порядок у царині Найсвятішого Серця. Тепер кожен солдат стоїть як лицар святої справи, покликаний служити не лише зброєю, але й обладунком побожного серця та вогнем непохитної віри."

  #Treaty
  COL_The_Collapse_of_Colombo_American_Cordiality: "Крах колумбо-американської дружби"
  COL_The_Collapse_of_Colombo_American_Cordiality_desc: "Колумбія та Сполучені Штати ніколи не були настільки віддаленими одне від одного. Відтоді як у 1940 році було проголошено нейтралітет і ми відмовилися брати участь в американських воєнних зусиллях, напруженість між двома державами почала зростати, що зрештою призвело до остаточного розриву дипломатичних відносин у 1956 році, коли останнього американського дипломата було відкликано з Боготи, залишивши питання дипломатичного зближення зі старим партнером відкритим для обговорення національним урядом."

  COL_Off_to_a_Fresh_Start: "До нового початку"
  COL_Off_to_a_Fresh_Start_desc: "Після успішного переговорного процесу Сполучені Штати та Колумбія повністю відновили свої відносини, і на це нове партнерство чекає світле майбутнє."
  
  COL_Colombo_American_Treaty_on_Friendship: "Колумбо-американський договір про дружбу та дипломатичну приязнь"
  COL_Colombo_American_Treaty_on_Friendship_desc: "Наші спільні зусилля призвели до майже повного відновлення відносин зі США, а більшість нагальних питань наших порядків денних було успішно узгоджено. Починають закладатися основи здорових відносин."
  
  COL_Leaving_past_Grudges_Behind: "Залишаючи минулі образи позаду"
  COL_Leaving_past_Grudges_Behind_desc: "Після переговорів було досягнуто початкової домовленості зі Сполученими Штатами Америки, і хоча попереду на нас чекає ще довгий порядок денний, ми з великою надією можемо сказати, що відновлення нашої дружби розпочалося."

  COL_Large_Scale_Offensive: "Масштабний наступ"
  COL_Large_Scale_Offensive_desc: "Із відновленням бойових дій у Колумбії сторони, залучені до громадянської війни, посилили наступ за підтримки своїх іноземних покровителів. Конфлікт лютує серед гір і джунглів, доки не залишиться лише один."

  #Shared Between Tags
  COL_Shoulders_of_Giants: "На плечах велетнів"
  COL_Shoulders_of_Giants_desc: "Щоб зрозуміти причини, через які Колумбія палає, слід звернутися до трьох душ, спадком яких стало насильство, що нині розгортається.\n\nПоки в інших частинах нації оплакують убивство Гайтана, у Новій Гранаді звучить реквієм за іншим чоловіком. Маріано Оспіна Перес, великий діяч консерватизму, гордий поборник боротьби проти хибних обіцянок лауреанізму. Чоловік, убитий і повішений на столичній площі натовпом, чию жагу крові Дуче та його співвітчизники досі вважають ненаситною.\n\nТоді яка кумедна випадковість: попри всі їхні розбіжності, консерваторів, лібералів і соціялістів об'єднує спільний клич: смерть лакеям лжепророка Лауреано Гомеса. Смерть їхнім далеким покровителям у Германії та Мадриді. Смерть старому ладу.\n\nVeritias Vincit."

  COL_Saints_Sinners: "Війна святих і грішників"
  COL_Saints_Sinners_desc: "Радикалізація, спричинена Ла Віоленсією, розколола колумбійське суспільство. Хоча багато воєн можуть претендувати на звання війни брата проти брата, мало які зрівняються з радикалізацією та дегуманізацією, що мучать колумбійське суспільство з середини 50-х років. Неприхована лють до тих, проти кого вони воюють, і байдужість до злочинів власних поборників досягли такого рівня, що саму війну можна уподібнити до війни святих і грішників.\n\nПограбування, бандитизм і вбивства є звичним і повсюдно ігнорованим явищем на кожному фронті. Та незалежно від того, за ким ми спостерігаємо, у розповіді залишається спільний елемент: війна, що спустошує цю країну, буде війною не на життя, а на смерть."

  COL_Eastern_Frontier: "Східний кордон"
  COL_Eastern_Frontier_desc: "Перемога над Революційним фронтом і справді виявилася пірровою. Витіснивши їх із Тунхи, ми лише змусили їх відступити ще глибше в укріплені позиції серед джунглів. Знищивши їхню лінію фронту, ми залишили осередки опору по всьому Сходу. А стративши їхніх лідерів, ми лише ще більше розлютили тих солдатів, які вижили.\n\nСвідченням цієї «перемоги» стало нещодавно засноване Комісаріатство Сходу. Військовий уряд, якому доручено умиротворити тисячі кілометрів території та надано засоби для відправлення стількох людей до Суверенного Сходу, скільки буде потрібно. Не помиляйтеся: громадянська війна в Колумбії не закінчилася — вона лише перейшла в нову фазу."

