  # Bios - ministers and leaders
  CLD_Jose_Camacho_Carreno_hog_desc: "§YМіністр уряду\nПалінгенетичний нацизм§!\n--------------\n"
  #\n§LЯкщо Урібе Місас є обличчям партії, то Хосе Камачо Карреньо — її Юда. Його боротьба за політичну владу розпочалася рано: у 1920 році, будучи 17-річним першокурсником, він разом з однодумцями-правими активістами заснував «Лос Леопардос». Спочатку «Леопардос» прагнули спрямувати Консервативну партію в бік націоналізму й корпоратизму, використовуючи газети для переконання виборців. Карреньо проявив себе як чудовий оратор, ставши обличчям нового покоління консерваторів, майстерно розпалюючи натовпи палкою національною гордістю та зневагою до політики істеблішменту. У 1938 році він став одним із засновників Націоналістичної партії дії і від самого початку поступався за впливом лише Місасу.\n\nУ наступні десятиліття країни Осі перемогли Союзників, Консервативна партія не змогла втілити свою програму, а Ліберальну партію захопили ліві — усе це дозволило Карреньо дедалі більше залучати суспільну підтримку до НД та її аріокріольської місії. З початком Ла Віоленсії його попередні заклики до створення правих ополчень виявилися напрочуд далекоглядними, тоді як його обіцянки, що НД звільнить Колумбію від пороку, корупції та юдео-капіталізму, надихнули тисячі людей приєднатися до підпільної Другої патріотичної армії. Від повстання в Барранкільї сотні тисяч слухають його вечірні радіозвернення, і хоча його слухачі можуть розуміти, що лідером є Місас, насправді вони йдуть саме за Карреньо.§!"
  CLD_Klaus_Wilhelm_Lehder_eco_desc: "§YМіністр фінансів і державного кредиту\nПалінгенетичний нацизм§!"
  #\n--------------\n§LНароджений у 1904 році в Гамбурзі, Клаус Вільгельм Ледер був лише одним із багатьох німецьких фахівців, які оселилися в Колумбії в перші десятиліття XX століття. Але коли він уперше прибув сюди в 1927 році, то був одним із небагатьох націонал-соціалістів на континенті. У молодості Ледер володів популярним готелем у Кіндіо, де познайомився з низкою впливових німецьких підприємців. Серед них були Герман Кюль, фактичний очільник Німецько-колумбійського союзу, та піонер авіаційної промисловості Петер Пауль фон Бауер, який найняв Ледера інженером до своєї авіакомпанії SCADTA. Через SCADTA Ледер познайомився зі своїм співвітчизником-націоналістом Урібе Місасом, який на той час був юридичним представником фірми.\n\nКоли Місас заснував Націоналістичну партію дії, Ледер був серед перших, хто пішов за ним; його управлінські здібності виявилися безцінними для формування внутрішньої структури партії. У розпал Ла Віоленсії він керував дедалі більшим потоком награбованих товарів, які фінансували зростання НД. Коли Кюль загинув у вибуху автомобіля в 1956 році, Ледер поспішив заволодіти його активами та активами інших членів Союзу на користь партії. За це Місас пообіцяв Ледеру майбутню посаду міністра економіки після створення його аріокріольської утопії — мрії, в яку вони обоє абсолютно вірять.§!"
  CLD_Luis_Lopez_de_Mesa_Gomez_for_desc: "§YМіністр закордонних справ\nПалінгенетичний нацизм§!"
  #\n-------------- \n§LНароджений у 1884 році в заможній родині науковців, «хрещений батько аріокріольської думки» Меса провів роки формування особистості, занурений у літературу із соціальних наук. Це дитяче захоплення переросло в проєкт використання соціології для вдосконалення колумбійського суспільства. Як член Ліберальної партії, у 1917–1934 роках де Меса пройшов шлях від міського радника до члена уряду, очоливши освітні реформи під час першого президентського терміну Пумарехо та ставши міністром закордонних справ за його наступника Сантоса. Коли світ охопила війна, де Меса використав свою посаду для просування своєї расової ідеології. Він заборонив в'їзд європейським євреям — включно з тими, хто був громадянами Колумбії, — коли вони тікали від Голокосту, водночас працюючи над ізоляцією Колумбії від Сполучених Штатів. Ці вчинки зробили його легендою в очах ультраправих.\n\nРішення адміністрації Ґайтана запровадити політику відкритих кордонів ще більше зміцнило переконаність де Меси в існуванні єврейської змови з метою знищення Колумбії, і в 1951 році він приєднався до Націоналістичної партії дії. Наступне десятиліття він регулярно виступав на заходах НКС та НД і публікував праці з викладом програми часів Холодної війни для просування кріольської раси — ідей, що стали основою Аріокріольського маніфесту Місаса. Хоча нині це крихкий і хворобливий старий чоловік, де Меса залишається надзвичайно цінним активом для Другої патріотичної армії, дозволяючи їй зовні поставати як законний уряд Колумбії, а не просто терористична група під німецьким контролем.§!"
 

  Heriberto_Schwartau_sec_desc: "§YОчільник розвідки\nНаціонал-соціалізм§!\n--------------\n"
  #\n§LНароджений у 1917 році в Колумбії в родині двох німецьких іммігрантів, Геріберт Швартау Ескільдсен ще до того, як Гітлер став Фюрером, уже був зачарований націонал-соціалізмом. Після закінчення школи він придбав квиток на корабель до Гамбурга. Прибувши до Німеччини, Швартау офіційно вступив до НСДАП та пройшов підготовку для служби в армії Гітлера. У 1941 році його відкликали з Вермахту для служби в Абвері, і невдовзі Швартау знову опинився в морі, повертаючись до Колумбії для роботи на проосівській радіостанції в межах операції «Болівар». Після арешту свого начальника в 1944 році він став очільником Абверу в Колумбії.\n\nПісля хаотичних виборів 1946 року, побачивши в зростанні партійної ворожнечі та політичного насильства можливість, Абвер доручив Швартау організувати операцію «Лафітт» — місію з посилення впливу Націоналістичної партії дії та подальшого наближення її політики до політики Райху, водночас підриваючи довіру суспільства до демократії шляхом розпалювання політичного насильства. Через підставну компанію, яку він заснував у Барранкільї, Швартау почав контрабандою переправляти німецьку зброю, яку потім продавав правим ополченням та злочинним синдикатам через мережу завербованих на місцях агентів. Коли Швартау розкрив операцію «Лафітт» Урібе Місасу, вони почали тісніше співпрацювати. Розвіддані та постачання Швартау були необхідними для планування повстання в Барранкільї. Після успішного захоплення Барранкільї Місас призначив Швартау очільником нової Агенції безпеки, через яку той працює над систематичним придушенням опору новому режиму.§!"

  CLD_Adolf_Held_Jr_eco_desc: "§YМіністр фінансів і державного кредиту\nСтатистський корпоратизм§!"
 

  POLITICS_ALFONSO_URIBE_MISAS: "Народжений 26 грудня 1898 року, Альфонсо Урібе Місас — людина, для якої обіцянки Колумбії виявилися небезпечно крихкими. Народжений у достатку, він насолоджувався роками економічного підйому 1920-х, вивчав право й присвятив себе колумбійському порядку, навіть зазнавши відлучення від Католицької церкви через свою діяльність, коли в одній зі справ про цивільний шлюб, яку він затвердив, поставив колумбійське право вище за релігійне.\n\nЦя віра привела його в політику в 1929 році — саме тоді, коли його улюблена Республіка почала занурюватися в хаос і безлад. Економіка задихалася, народ ставав неспокійним, а порядок, який він так шанував, вислизав із рук. Він підіймався щаблями колумбійської політики, у глибині душі вважаючи, що багато нових радикалів, які обіцяли покласти край бідам Колумбії, помилялися. Усі вони пропонували неперевірені експерименти, чужі душі Колумбії. Натомість він почав озиратися назад.\n\nТепер він постає останнім арбітром старого порядку Колумбії. Його розрив із католиками подолано, за підтримки союзників у Європі та коаліції аристократів, радикальних консерваторів і лауреаністів він сповнений рішучості відновити Колумбію. Нова Боліваріанська держава насолоджуватиметься миром, освітою, добробутом і безпекою під його відродженою Старою Республікою."
  POLITICS_HERIBERTO_SCHWARTAU: "Хоча Геріберт Швартау народився на колумбійській землі, він ніколи не вважав країну, якою тепер править, своєю батьківщиною. Народжений у 1917 році в родині німецьких іммігрантів, підлітком він сів на корабель, що прямував до Фатерлянду, аби боротися за справу націонал-соціалізму. Призначений до Абверу, Швартау невдовзі знову опинився в Колумбії та в 1944 році став очільником усіх операцій Абверу в країні. На цій посаді він розробив операцію «Лафітт» — двадцятирічну змову з метою розпалити політичне насильство в Колумбії, підірвати віру в демократію та забезпечити зброєю і підготовкою так звану Другу патріотичну армію Урібе Місаса.\n\nЯкою б сміховинною не була його «аріокріольїзм» — викривлення націонал-соціалістичних ідеалів, — Швартау розумів необхідність співпраці з Місасом і збереження єдності альянсу Націоналістичної партії дії задля перемоги над ворогами Райху в Колумбії. Але тепер, коли ліберали й комуністи переможені, сам Місас мертвий, а Націоналістичну партію дії захопив генерал Хіль, такі ідеологічні крайнощі більше не можна терпіти. Хто, як не Геріберт Швартау, має і політичну проникливість, і арійську кров, щоб принести націонал-соціалізм до Колумбії? І хто, як не Геріберт Швартау, може гарантувати, що Богота й Германія назавжди будуть поєднані?"
  POLITICS_JOSE_CAMACHO_CARRENO: "Помилка — ось ким досі був Хосе Камачо Карреньо. Його життя являло собою поєднання випадкових подій і особистих невдач, що вилилися в низку нещасливих обставин. У нападах депресії він топив себе в озері безпросвітного жалю до себе, але водночас був дияволом, який холоднокровною образою спричинив загибель брата своєї коханої дружини. Його нині покійна дружина замість нього зазнала розплати за вбивство родича, коли загинула, потонувши на поромі, що намагався втекти з Барранкільї під час запеклої сутички з республіканцями.\n\nВін мусить із цим жити, і мало що може зробити, окрім як спорожнювати пляшку за пляшкою, використовуючи свою єдину перевагу — язик. Перетворюючи отруйні слова на мед і роблячи раціональні судження немислимими, його оманливі вистави засліпили цілу націю. Він якимось чином вигадує неймовірні, хоч і хибні, розв'язання колумбійських проблем, водночас просуваючи свої мстиві, ностальгійні ідеали. Його принципи надзвичайно небезпечні — адже вони ведуть до негайного падіння самих інституцій республіки, а не просто являють собою ще одну радикальну течію консерватизму. Першого разу як трагедія, другого — як фарс: реакціонізм завжди обіцяв мало доброго, але кошмар Камачо Карреньо ще може завершитися його шляхом самознищення... зрештою."


  ## Ліберали ##
  CLL_Shoulders_of_Giants: "На плечах велетня"
  CLL_Shoulders_of_Giants_desc: "Щоб зрозуміти причини, через які Колумбія палає, потрібно поглянути на три душі, чия спадщина — насильство, що тепер розгортається.\n\nХоча фашисти й корисливі деспоти можуть намагатися переконувати у протилежному, лише один із них по-справжньому дбав про народ, коли був президентом. Лише один прагнув захищати їхні права, незалежно від того, ким вони були і з якої землі походили. Лише один дивився їм в очі й говорив з ними як рівний, а не як володар зі своїми підданими. Лише один помер мучеником.\n\nСаме його ім'я скандують на вулицях Сходу й пошепки вимовляють за зачиненими дверима по всій країні. Саме його стяг вони піднімають і його мрію підтримують у Тунсі.\n\nАдже, за його власними словами: «Якщо я помру, помстіться за мене.»"

  CLL_Far_From_Any_Road: "Далеко від будь-якої дороги"
  CLL_Far_From_Any_Road_desc: "У глибині тихих рівнин мешкають революціонери, борючись не лише зі спекотним і вологим кліматом краю, а й із загрозою часу. Позбавлений будь-яких значних ресурсів, неосяжний Схід не пропонує найкращих умов для здійснення революції.\n\nВтім, «Дикий Схід», як його можна назвати, не варто помилково вважати ідилічним пасторальним краєм, і будь-якого чужинця, який необачно наважиться вирушити до його зеленого серця, чекає майже неминуча загибель."

  CLL_Burning_Plains: "Палаючі рівнини"
  CLL_Burning_Plains_desc: "Східні рівнини мають лише два великі скарби: свою природну красу та багатства, поховані під їхнім ґрунтом. У суворій реальності, нав'язаній революціонерам, вони пожертвували першим заради експлуатації другого, перетворивши колись незаймані ландшафти на понівечені кар'єри та безкрайні поля товарних культур.\n\nРічки міліють, серранії оголюються, а привид війни, що згущується на обрії, змушує багатьох замислитися, чи витримає ця крихка система тягар неминучого конфлікту з набагато могутнішим ворогом — чи Схід нарешті занепаде до спустошення й стане тінню своєї колишньої життєвої сили."

  CLL_Red_Rose_Army: "Червона та Рожева армія"
  CLL_Red_Rose_Army_desc: "Революційний оборонний корпус Колумбії постає не як брати, загартовані спільними ідеалами, а як товариші, пов'язані шрамами спільних страждань. Від елітних Лансерос Навеса Пардо до несамовитих рейдерів Йоси — кожна фракція побачила жорстоке обличчя Старої Республіки, обличчя, яке топтало їх під своїм чоботом.\n\nЇхня жага змін, народжена стражданнями, живить їхній невпинний рух до революції. Та навіть борючись із жорстокою нестачею ресурсів і переживаючи бурі внутрішньої боротьби, їхня жага справедливості штовхає їх уперед, готових змінити долю зламаної нації."

  CLL_Revolutionary_Coalition: "Революційна коаліція"
  CLL_Revolutionary_Coalition_desc: "Попри історичну американську ворожість до лівізму, Колумбійський революційний союз користується підтримкою панамериканської коаліції держав на чолі зі Сполученими Штатами.\n\nПродемократична та проамериканська ідеологія ґайтаністів, поряд із деспотизмом фашистських проксі, що воюють за країну, зробили Фронт найкращим шансом демократії повернути собі Афіни Південної Америки.\nНаразі ОВН, Мексика, Куба та Венесуела надали рухові значну підтримку, і якщо вони продовжать це робити, Фронт може здобути перемогу, коли гуркіт гармат знову переслідуватиме Колумбію."

  CLL_Revolutionary_Coalition_1: "Революційна коаліція" 
  CLL_Revolutionary_Coalition_1_desc: "Фронту було завдано тяжкого удару, коли Сполучені Штати припинили свої програми допомоги, які забезпечували більшу частину його військових і цивільних потреб. Оскільки держава все ще залежить від іноземної допомоги, її стрімкий поворот до Веракрузького пакту, до якого належать усі її нинішні покровителі, не має викликати подиву.\n\nХоча Пакт може бути непохитним у своїй волі, не можна заперечувати, що його допомога бліднутиме порівняно з тим, що міг надати Дядько Сем, і залишається лише сподіватися, що незгасний запал революціонерів буде достатнім, аби привести їх до перемоги."
 
  CLL_Revolutionary_Coalition_2: "Останні вірні" 
  CLL_Revolutionary_Coalition_2_desc: "Колись могутня коаліція, яка постачала Фронт, загинула від руки особистого інтересу. Венесуела — остання держава, за яку чіпляється ослаблений Фронт."

  CLL_Jewel_of_the_East: "Перлина Сходу"
  CLL_Jewel_of_the_East_desc: "Вершиною здобутків Революційної армії під час Громадянської війни стало захоплення Тунхи — міста, політична приналежність якого багато разів змінювалася протягом історії країни. Тунха, або Перлина Сходу, як її стали називати, є найбільшим оплотом Фронту і єдиним містом, звідки можна вести війну.\n\nЗа роки після перемир'я її населення стрімко зросло: сотні тисяч тікають від гнітючих урядів на заході, а її промисловість майже подвоїлася. Хоча Фронт досі беззаперечно залежить від імпорту для свого виживання, очевидно, що без міста вся військова кампанія зазнала б краху."

  CLL_Jewel_tt: "§RЯкщо ми не утримуватимемо Тунху чи будь-яке інше велике місто протягом тривалого часу, це призведе до краху наших воєнних зусиль.§!"
