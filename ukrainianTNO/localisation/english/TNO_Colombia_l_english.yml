  # Ministers
  CLC_Silvio_Villegas_hog_desc: "§YВиконавчий секретар ANP\nФалангізм§!\n--------------\n§LМало хто в ANP може зрівнятися з Дуче за репутацією, проте Сільвіо Вільєґас є одним із таких небагатьох. Один із первісних Леопардів, групи праворадикальних мислителів, які надихнули Дуче, Сільвіо вважався найбільш теоретично підкованим членом групи та відповідальним за їхні маніфести — іншими словами, її ідеологом.\n\nЙого широкі знання філософії, чудові письменницькі навички та ораторські здібності створюють образ справжнього світила революції. Це, разом із його близькою дружбою з Дуче, що бере початок ще від заснування партії, одним із перших членів якої він був, означає, що його посада виконавчого секретаря не повинна дивувати.§!"
  CLC_Carlos_Echeverri_Cortes_for_desc: "§YКанцлер Дуче\nАристократичний фашизм§!\n--------------\n§LКарлос Ечеверрі Кортес, мабуть, одна з найвідповідніших постатей для представлення Нової Гранади на світовій арені, адже він ідеально відповідає визначальним рисам правлячого класу режиму. Егоїстичний підлабузник, відомий своєю безпринципністю, затятий реакціонер та антикомуніст, поціновувач витонченого мистецтва та європейської культури, особливо італійської, в яку він закохався під час перебування на посаді посла.\n\nСаме це призначення привело його сюди, адже він був першим послом в Італії після Другої світової війни, допомагаючи Королівству зміцнювати свій вплив у Колумбії, що безпосередньо сприяло формуванню ANP. Тепер перед Ечеверрі стоїть завдання не дати Новій Гранаді забути, хто є її найбільшим благодійником.§!"
  CLC_Diego_Garces_Giraldo_eco_desc: "§YЗасновник Верховної економічної ради\nОлігархія§!\n--------------\n§LНароджений 1914 року в Калі, дон Дієго — одна з найвідоміших постатей у своєму рідному департаменті Вальє. Мільйонер і поліглот із багатим життєвим досвідом, він має докторський ступінь Триніті-коледжу та працював дипломатом, сенатором і підприємцем.\n\nДон Дієго відомий як людина, відповідальна за стрімке зростання Нової Гранади протягом останніх десяти років. Засновник Верховної економічної ради, кліки провідних промисловців Нової Гранади, він володіє JGB, єдиним постачальником фармацевтичних товарів у Новій Гранаді, а також Conciviles, її головною будівельною компанією. На краще чи на гірше, усі економічні рішення в Новій Гранаді мають пройти через нього.§!"
  CLC_Leon_Maria_Lozano_sec_desc: "§YЕль Рей де лос Пахарос\nВоєнізм§!\n--------------\n§LЛа Віоленсія залишила глибокі рани в колумбійському суспільстві, і її шрами відчуватимуться ще багато років. Лосано — один із таких шрамів. До смерті Каудильйо цей чоловік був пересічним сироваром, але скористався хаосом, щоб організувати мережу найманих убивць під своїм командуванням. Мережа, відома як Лос Пахарос, або «Птахи», служила інтересам Консервативної партії та фінансувалася безпосередньо аристократами, такими як колишній губернатор Вальє Ніколас Борреро Олано.\n\nЦя служба триває і за Нової Гранади, де організація перетворилася на чорносорочечників режиму, відповідно розширивши як масштаби операцій, так і чисельність. Незмінним залишився їхній лідер — Ель Рей де лос Пахарос, Король кондорів, Леон Марія Лосано, нині зморщений старий чоловік.§!"

