  COL_GranColombia.3.t: "Холодні вітри над Андами"
  COL_GranColombia.3.desc: "ФЕДЕРАЛЬНЕ УПРАВЛІННЯ БЕЗПЕКИ\nСПРАВА: Зростання ворожнечі між Венесуелою та Колумбією\n\nВідтоді як завершилася громадянська війна в Колумбії, напруженість між Колумбією та сусідньою Венесуелою тривожно зростає. Через збільшення військової присутности вздовж кордону та публічні словесні перепалки між військовими керівниками обох держав іноземні оглядачі побоюються можливого збройного вторгнення вздовж північних Анд.\n\nУже протягом поколінь ідеологічні розбіжності між Боготою та Каракасом були більш-менш нормою. Однак після нещодавньої громадянської війни в Колумбії відновлення країни повільно дає раду соціальним проблемам, які поглибили розкол між двома державами: від післявоєнної бідности, що спонукає людей емігрувати до Венесуели, до дедалі більшого неспокою у внутрішніх районах Колумбії.\n\nКрім того, громадянська війна в Колумбії надала достатнє прикриття для нещодавніх спроб підняти повстання у Венесуелі: підтримувані іноземцями агітатори сподівалися використати насильство, щоб таємно переправитися через кордон і сприяти зміні режиму. Це не сприяло прихильності Каракаса до післявоєнного становища Колумбії та допомогло поглибити подальший розкол.\n\nСпостерігачі зазначають, що можливість війни між Колумбією та Венесуелою, принаймні наразі, невелика. Є надія, що цей статус-кво збережеться протягом усього періоду. У разі подальшого погіршення колумбійсько-венесуельських відносин війна в північних Андах виявиться не менш, а можливо, й більш кривавою, ніж громадянська війна в Колумбії. Рекомендується продовжувати спостереження за розвитком ситуації.\n\nЗ найвищою повагою,\nФедеральний директор безпеки\nКапітан Ґутьєррес Барріос"
  COL_GranColombia.3.a: "La Patria es Primero"
  
  COL_GranColombia.4.t: "Холодні вітри над Андами"
  COL_GranColombia.4.desc: "ЦІЛКОМ ТАЄМНО\n\nВІД АГЕНТА ТОРІНО\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ЗРОСТАННЯ НАПРУЖЕНОСТИ МІЖ КОЛУМБІЄЮ ТА ВЕНЕСУЕЛОЮ\n\n1. Відтоді як Велика Колумбія розпалася в 1831 році, відносини Венесуели з Колумбією були затьмарені суперечками, коріння яких сягає культурних розбіжностей між Боготою та Каракасом. Останніми роками, коли суперечливі інтереси Холодної війни зійшлися в нещодавній громадянській війні в Колумбії, відносини Венесуели з Колумбією погіршилися.\n\n2. Післявоєнна ситуація в Колумбії призвела до різкого зростання системної бідности, через що бідніші мігранти виїжджають за венесуельський кордон, перетворюючись на довгострокову проблему для уряду в Каракасі. Тліюча напруженість у Колумбії, підживлена тривалими травмами громадянської війни, посіяла неспокій серед населення.\n\n3. Протягом останніх кількох місяців зростаюча ворожість між урядами Каракаса та Боготи дедалі більше виходить назовні, а військова активність уздовж їхнього спільного кордону посилюється. Військові керівники з обох боків відкрито почали розміщувати сили одна проти одної, спонукаючи свої уряди досягти належного врегулювання.\n\n4. Початкові оцінки свідчать, що війна між Колумбією та Венесуелою наразі малоймовірна, але ситуація все ще може змінитися. Перспективи затяжного конфлікту в Північних Андах, м’яко кажучи, похмурі. З огляду на нещодавні спроби іноземних держав використати громадянську війну в Колумбії для боротьби за вплив і в Боготі, і в Каракасі, найкращим курсом дій буде спостерігати за ситуацією протягом усього періоду."
  COL_GranColombia.4.a: "Вірність, хоробрість, чесність"

  COL_GranColombia.5.t: "Холодні вітри над Андами"
  COL_GranColombia.5.desc: "ЦІЛКОМ ТАЄМНО\nРаді міністрів\n\nКолумбія — післявоєнні наслідки громадянської війни — під впливом кількох іноземних державВідомо, що післявоєнна реконструкція після громадянської війни в Колумбії була клаптиковою, а вкорінена бідність і невдоволення виникали через шкоду колумбійській економіці та довготривалу політичну перебудову. Найгостріше це позначилося на північно-східній сусідці Колумбії — Венесуелі.\n\nВплив громадянської війни в Колумбії на Венесуелу — від передумов і початку до післявоєнних наслідків — посилив національні та ідеологічні розбіжності між Венесуелою та Колумбією, що існують від часів революції Сімона Болівара. Додатково до цього економічна ситуація в Колумбії спричинила відтік малозабезпечених колумбійців до Венесуели, що також стало тягарем для її економіки.\n\nВідомо, що іноземні сили використовували насильство громадянської війни як прикриття для підготовки зміни режиму у Венесуелі (див. додану папку). У поєднанні з навантаженням на економіку Венесуели це призвело до зростання напруженості між Боготою та Каракасом, зокрема публічних вимог військових керівників обох держав вжити заходів, а також сплеску військових маневрів уздовж їхніх кордонів.\n\nАналіз напруженості між Колумбією та Венесуелою, схоже, свідчить, що війна все ще далеко. Насильство громадянської війни в Колумбії добре задокументоване, і можна припустити, що ні Каракас, ні Богота поки не поспішають запрошувати ще один конфлікт, але це може змінитися, якщо ситуація не покращиться. Безперечно, нам буде в наших інтересах стежити за цими справами."
  COL_GranColombia.5.a: "Pátria Minha - Plus Ultra"

  COL_GranColombia.6.t: "Холодні вітри над Андами"
  COL_GranColombia.6.desc: "ЦІЛКОМ ТАЄМНО\nТІЛЬКИ ДЛЯ ОЧЕЙ\nДО ВСІХ ЧЛЕНІВ [getIntelAgencyCaps]\n\nКОЛУМБІЯ — ПІСЛЯВОЄННІ НАСЛІДКИ ГРОМАДЯНСЬКОЇ ВІЙНИ — ПІД ВПЛИВОМ КІЛЬКОХ ІНОЗЕМНИХ ДЕРЖАВ\n\nКерівництво Венесуели дедалі вороже налаштоване щодо сусідньої Колумбії, тоді як власна ворожість Боготи до Каракаса поступово стає взаємною. Військова присутність з обох боків постійно зростає, як і вимоги військових керівників до негайного вирішення проблеми.\n\nГромадянська війна в Колумбії залишила економіку в руїнах, а зусилля з реконструкції повільно долають завдану шкоду. Бідність у внутрішніх районах Колумбії висока, а населення охоплене тривогою після громадянської війни. Це спонукало багатьох емігрувати до Венесуели, що призвело до економічних проблем і взаємного обурення між двома країнами.\n\nІноземні сили намагалися скористатися громадянською війною в Колумбії, щоб спровокувати подібні події у Венесуелі, використовуючи насильство бойових дій для підтримки політичних дисидентів і таємного переправлення їх через кордон заради власних цілей (див. доданий файл). Це лише посилило ворожість між керівництвом Каракаса та Боготи.\n\nВідкритий конфлікт між Колумбією та Венесуелою залишається малоймовірним. Поки відновлення Колумбії триває, а Венесуела все ще долає наслідки нещодавніх політичних потрясінь, війна може спалахнути лише в разі подальшого погіршення нинішніх відносин між Боготою та Каракасом. Поточне спостереження за цими подіями триватиме безперервно.\n\nХАЙ НІМЕЧЧИНА БУДЕ В НАДІЙНИХ РУКАХ."
  COL_GranColombia.6.a: "Фюрер з нами"
