  CLC_Belisario_Betancur_hog_desc: "§YПрем’єр-міністр\nНаціональний консерватизм§!\n--------------\n§LСпроби Морено реформувати партію покликані вдихнути нове життя в колумбійського колоса, змусити його відповідати своїм засадничим ідеалам і новому порядку, який він проповідує. Тож цілком доречно, що його права рука, Белісаріо Бетанкур, став утіленням цього нового духу.\n\nНароджений в Антіокії 1923 року, Белісаріо належить до молодої гвардії партії та за останні десять років став її висхідною зіркою, здобувши репутацію прагматика, сміливого бійця, поета і, передусім, затятого націоналіста. Його досягнення привернули увагу Ауґусто Морено, для якого Белісаріо став свого роду протеже.§!"
  CLC_Hernan_Jaramillo_Ocampo_eco_desc: "§YМіністр фінансів і державного кредиту\nМенеджерська держава§!\n--------------\n§L§!"
  

  # Leader Descriptions
  POLITICS_GILBERTO_ALZATE_AVEDANO_DESC: "Народжений 1910 року в Старій Кальдасі, Альсате, можливо, є єдиною людиною, яка могла об’єднати праві сили колумбійської політики та домогтися створення Нової Гранади, а отже, саме він найбільше підходить для її очолення. Адвокат, який зневажав свою професію. Доктор — адже, за його власними словами, кожен колумбійський політик ним є. Сенатор і поет. Людина неабияких здібностей, найвідоміша своєю харизмою та полум’яними промовами; останні він широко використовував під час виборчої кампанії проти свого суперника Лауреано Гомеса в п’ятдесятих, а згодом і під час Ла Віоленсії.\n\nПолітично Альсате перебуває під сильним впливом праць Лос Леопардос, праворадикальних мислителів, які тепер слідують за ним у його повстанні — і справді, саме слово «повстання» найкраще описує його ідеологію, що складається з безлічі реакцій на старий порядок. Втім, головним політичним впливом для нього залишається фашизм Беніто Муссоліні — людини, з якої він змалював себе та якій залишається непохитно відданим. Його антисемітизм виявився не менш непохитним, аж до спроби влаштувати колумбійську Кришталеву ніч.\n\nПерелік його діянь, здійснених в ім’я цього повстання, чималий і включає невдалий марш на столицю, який занурив Колумбію в громадянську війну. Хоча війна застигла в стані патової ситуації, гнітюче передчуття не полишає серця багатьох. Вони знають: Альсате скоро отримує ще один шанс додати завоювання своєї країни до цього списку."
  POLITICS_GILBERTO_ALZATE_AVEDANO_N_DESC: "Народжений 1910 року в Старій Кальдасі, Альсате, можливо, є єдиною людиною, яка могла об’єднати праві сили колумбійської політики та домогтися створення Нової Гранади, а отже, саме він найбільше підходить для її очолення. Адвокат, який зневажав свою професію. Доктор — адже, за його власними словами, кожен колумбійський політик ним є. Сенатор і поет. Людина неабияких здібностей, найвідоміша своєю харизмою та полум’яними промовами; останні він широко використовував під час виборчої кампанії проти свого суперника Лауреано Гомеса в п’ятдесятих, а згодом і під час Ла Віоленсії.\n\nПолітично Альсате перебуває під сильним впливом праць Лос Леопардос, праворадикальних мислителів, які тепер слідують за ним у його повстанні — і справді, саме слово «повстання» найкраще описує його ідеологію, що складається з безлічі реакцій на старий порядок. Втім, головним політичним впливом для нього залишається фашизм Беніто Муссоліні — людини, з якої він змалював себе та якій залишається непохитно відданим. Його антисемітизм виявився не менш непохитним, аж до спроби влаштувати колумбійську Кришталеву ніч.\n\nТепер, коли ідеологічна ілюзія розбита, стає очевидно, що Альсате оточує себе не революціонерами чи ідеологами, а підлабузниками — людьми, які виконуватимуть його волю. Саме так Новій Гранаді й належить рухатися вперед: армія маріонеток, що танцює під його нитки."
  POLITICS_RAUL_ZAMBRANO_CAMADER_DESC: "Народжений 1921 року, Рауль змалку був побожним і 1944 року став висвяченим священником. Протягом наступних років він став учнем архієпископа Попаяна, допомагаючи йому створити Національний католицький союз, покликаний опікуватися громадськими роботами Церкви в Новій Гранаді. Архієпископ довірив Раулю стати першим керівником Союзу, і на цій посаді він використовував свої повноваження для будівництва нових шкіл, притулків та їдалень по всій Новій Гранаді.\n\nЙого успіх був беззаперечним, і Церква поклала на нього свою віру, проголосивши наступним архієпископом після відставки його наставника. Тепер розкаяні негідники покладають на нього свою віру, очікуючи, що після падіння ANP він поведе їх уперед.\nПереворот зігрів би серця народних мас, але питання, що не дають спокою, залишаться. Зв’язок Церкви з фашистським режимом залишається незрозумілим, як і причини перевороту. Проте ніхто не бажає відповідати на них, натомість покладаючи віру на новий мир.\n\nЗрештою, хаос, який охопив країну з п’ятдесятих років, завершився. Вся країна покладає віру на нове обличчя режиму, Рауля Самбрано Камадера, очікуючи, що він визначить курс Колумбії на шляху до зцілення. Залишається лише сподіватися, що їхня віра не виявиться марною."
  POLITICS_DIEGO_GARCES_GIRALDO_DESC: "Народжений 1914 року в Калі, Дієго є ідеальною людиною для представлення нового правлячого класу Колумбії. Син мільйонера Хорхе Ґарсеса Бореро, відомого заснуванням єдиного виробника ліків у Колумбії — фармацевтичної компанії JGB, — а також нащадок самого засновника Калі, Себастьяна де Бельалькасара. Ніхто не може заперечити, що його походження відповідає цій ролі.\n\nБуло б нерозумно думати, що він успадкував у житті все. Зрештою, він випускник Кембриджського університету та поліглот. Його заслуги як посла у Вашингтоні та на Кубі в сорокових також належать йому, і саме він розширив контроль своєї родини над рідним містом та забезпечив володіння його найбільшою будівельною компанією. Не слід забувати, що саме Дієго заснував і очолював Верховну економічну раду з п’ятдесятих років, відповідальну за стрімке зростання Нової Гранади.\n\nУ своєму рідному департаменті його люблять за те, що він надає стипендії та робочі місця своїм співгромадянам. Однак не варто сприймати це лише як доброчинність — за його привітною усмішкою приховано багато чого. Шепіт не вщухає: ходять чутки про приховані плани та замасковані діяння. Проте правда, якщо в цих чутках узагалі є якась правда, лежить за джунглями угод про нерозголошення.\n\nЙого батько створив компанію, відому по всій Колумбії, Дієго створив монополію, а з повноваженнями, наданими йому як президентові, він створить імперію."
  POLITICS_AUGUSTO_RAMIREZ_MORENO_DESC: "Народжений 1900 року в Антіокії, Ауґусто Рамірес Морено — один із небагатьох людей в ANP, чия репутація могла зрівнятися з Дуче Альсате, і на те є вагомі причини. Морено, який тепер вступає у свої 70-ті, всю свою молодість присвятив розпалюванню вогню та прокладанню шляху для революції, яка тепер претендує на Колумбію.\n\nПалкий націоналіст і прихильник нового консерватизму з 17 років, він брав участь у численних інтелектуальних клубах, найвідомішим серед яких було його членство серед засновників Лос Леопардос — групи праворадикальних мислителів, якій він дав назву та яка сформувала основу ідеології колумбійських правих. З віком він і надалі, за власними словами, потерпав від хвороби, яка «робить людину нездатною схилятися». Ця недуга змусила багатьох називати його терміном, який він сам і вигадав, — «зарозумілий джентльмен». Для нього це твердження про манери та переконання, для інших — глибоке, красномовне лицемірство.\n\nПолітично Морено є національним консерватором, адже, хоча він і підписував радикальніші маніфести групи, його особиста ідеологія значною мірою спирається на праці Бенджаміна Дізраелі, людини, яку він високо шанує. Від свого кумира він успадкував бачення майбутнього Колумбії: Колумбією має керувати аристократія доброчесності та освячена спадкоємність інтелекту.\n\nМожливо, тому навіть добре, що тепер державу очолює людина з таким послужним списком, адже Колумбії вкрай потрібен хтось, хто готовий боротися за її майбутнє."
  POLITICS_SILVIO_VILLEGAS_DESC: "Відомий ідеолог руху Лос Леопардос Сільвіо Вільєґас, народжений 19 березня 1902 року, є людиною дії, уособленням завзятості, але передусім — палким демагогом реакції. Людина, чий протеже, Хільберто Альсате, став прапороносцем його корпоратистських ідеалів, і людина, яка об’єднала крайніх правих — хоча його прихильність до Фаланги майже анахронічна, а його расизм видається незвичним для колумбійців, він усе ще височіє над своїми однодумцями попри свій вік.\n\nОдні називають його ерудитом, інші — викопною решткою, але Вільєґас був частиною реакційної революції задовго до заснування Нової Гранади. Близький соратник Альсате та один із засновників ANP, він має ідеологічне підґрунтя, що поєднує іберійський фалангізм із вільним дотриманням католицьких соціальних доктрин. Використовуючи свої риторичні здібності, він зумів переконати значну частину своїх товаришів-фашистів прийняти його вчення як частину ортодоксії, хай навіть воно й відрізняється від поглядів Альсате.\n\nПроте мудрий Вільєґас, який походив зі старомодної Кальдаси й ніс фасції, зумів здобути собі шанувальників не лише серед своїх лейтенантів і підлеглих, а й серед найнижчих безликих бюрократів. Тепер, коли його залізний кулак навис над урядом, консерватизм не просто переміг — він знайшов гідного хранителя, який дозволить йому рости ще тисячу років."
  POLITICS_FERNANDO_LONDONO_X2_DESC: "Народжений 1910 року в Манісалесі, Фернандо відомий як справжній син Старої Кальдаси. У 19 років він уже був депутатом Асамблеї Кальдаси, двічі призначався президентом губернатором департаменту й навіть був обраний на цю посаду після запровадження демократичних виборів. Безкорисливий лікар і дипломат, він обіймав посаду міністра закордонних справ за президентства Оспіни. Він прожив яскраву кар’єру, про яку мало хто міг би мріяти.\n\nПід час Ла Віоленсії його кар’єра пішла крутим схилом униз, коли повстанці почали загрожувати стабільності Республіки, і він особисто подбав про те, щоб цей хаос не дістався Кальдаси... будь-якими необхідними засобами. Згодом він приєднався до маршу ANP на столицю, підйом якої очолював разом зі своїм другом, Дуче Альсате.\n\n«Золотий дзьоб», як його стали називати, вважається одним із найкращих ораторів Колумбії. Насправді найкращим — згідно з громадським опитуванням 1941 року на цю тему, — і саме ці навички він використовує як міністр пропаганди Нової Гранади.\n\nТепер, вступаючи у свої 60-ті, дон Фернандо знову відповідає на поклик, адже Партії та Колумбії потрібен знайомий і заспокійливий голос, здатний заспокоїти її, поки зовнішні пожежі палають дедалі сильніше."
  POLITICS_BELISARIO_BETANCUR_DESC: "Двічі за п’ять років ANP вимагала чемпіона, двічі за п’ять років націоналістичне крило приймало виклик, та в Президентському палаці стоїть не постарілий деспот, а нова людина, сильна людина.\n\nБеліcаріо Бетанкур, народжений 1923 року в Антіокії, є цією людиною. Лікар, журналіст, поет і політик, який розпочав свою кар’єру як член асамблеї свого департаменту 1945 року, він продовжив своє сходження навіть після Ла Віоленсії, коли став на бік ANP Альсате. Белісаріо відомий добрими стосунками з багатьма ієрархами партії, включно з доном Фернандо та колишнім президентом Ауґусто Раміресом Морено, який став його покровителем, хоча його зв’язки простягаються ще далі.\n\nСаме репутація відважного націоналіста, політика до мозку кісток, який тримає народ близько до свого серця, дозволила йому налагодити ці зв’язки, що зміцнили його сходження до влади та забезпечили підтримку такої значної частини партії. Тепер він стоїть як чемпіон партії, уособлення відваги Альсате та прагматичного реформізму Морено, обличчя Нових правих."
  POLITICS_JARAMILLO_OCAMPO_DESC: "Менше зацікавлений людською стороною державотворення і більше — її числовим боком, Ернан Харамільйо Окампо є радше безжальним фінансистом, ніж звичайним політиком, що здіймає натовпи. Народжений 13 жовтня 1915 року, син Старої Кальдаси, географічної колиски колумбійської реакції, він зростав у середовищі, яке, цілком закономірно, від самого початку спрямувало його розум до правого авторитаризму — і, безперечно, ця ідеологічна ізоляція також зробила його винятково впертим чоловіком, ще більше, ніж багатьох його найзапекліших традиціоналістських однодумців.\n\nЙого підхід до формування політики визначають одержимість і зосередженість: Харамільйо Окампо майже ніколи не визнавав хибності власних методів і часто виявляв крайню нетерпимість до критики. Водночас він залишається провідним експертом з економічних питань Колумбії та, як не дивно, ширшої національної політики — сфери, нерозривно пов’язаної з ним через особисту дружбу з праворадикальними Леопардос та Альсате. Проте вимушена повага, яку він здобув серед колег-економістів, завжди випробовувалася його зв’язками з колумбійськими кавовими баронами.\n\nТепер, ставши президентом нової Республіки, Харамільйо успадковує незавидне становище та єдине завдання: перетворити гниль шістдесятих на золото. Час покаже, чи досягне він успіху."
  POLITICS_CASTOR_ARRUBLA_DESC: "Кожній організації потрібні люди, які виконуватимуть завдання, якими її керівники воліли б не бруднити собі руки. Одні називають їх посіпаками, інші — просто маріонетками. У будь-якому разі Кастора Харамільйо Аррублу можна віднести до них, але він є чимось більшим.\n\nНароджений 1914 року, Кастор є одним із найдавніших союзників Старої Кальдаси; він став відомим тим, що заплющував очі на насильство проти лібералів під час свого губернаторства. Дехто поспішив би назвати його фашистом, як Альсате, якому він присягнув на вірність після заснування ANP, але він є чимось більшим.\n\nЯкщо придивитися уважніше, можна побачити його багаторічне перебування на посаді міністра праці за Оспіни наприкінці сорокових і за Альсате з п’ятдесятих до післявоєнної епохи. Понад десять років служби — період, протягом якого він беззастережно проводив політику режиму, деяку з якої навіть можна було б назвати прогресивною, якщо йдеться про консерваторів. То він поміркований?\n\nТепер він стоїть як новообраний глава держави Колумбії після відходу Вільєґаса. Тепер зрозуміло, хто привів його до влади і кому він служить. Кастор — обличчя Старої Кальдаси, рука, що записує слова, сказані великими людьми. Він є одним із багатьох облич консерватизму."
  POLITICS_GUILLERMO_VALENCIA_DESC: "Освічений, сповнений помпезності та незмінно прикрашений зухвалою, хоч і поблажливою усмішкою, Ґільєрмо Леон Валенсія — це консерватизм, повернений до його коріння. Народжений 27 квітня 1909 року в родині землевласницької аристократії та політиків, його химерна, майже архаїчна манера поведінки є радше наслідуванням виховання, ніж природним проявом його характеру — він передусім навчився поєднувати дивну інтелектуальну чарівність із часто задумливим виглядом, попри щиру відсутність книжних інтересів.\n\nСин самого «Ель Маестро», чиє ім’я він носить, Ґільєрмо засвоїв чимало філософських настанов, щоб вдавати дух щирого християнина, відданого своїй справі та прихильного до більшості — і, за словами деяких його послідовників, навіть такого, що відлунює боліваріанський дух справедливого правління.\n\nЗагалом його вважають достатньо компетентним, попри очевидний непотизм, завдяки якому він опинився на троні, — через спадкоємність влади, що походить від знаті департаменту Каука, одних із первісних творців ідеалів Нової Гранади. Хоча цей «принц», як його зневажливо називали критики, можливо, і не пробився сам, його природна схильність до лідерства не повинна виявитися марною. Спрямувавши всі свої численні амбіції на теперішні президентські повноваження, Валенсія не дозволить своєму привілею пропасти даремно."
  POLITICS_HERNANDO_CURREA_CUBIDES_DESC: "Кар’єрний військовий, нагороджений герой і жорсткий правитель, Ернандо Курреа Кубідес, народжений 1919 року, десятиліттями служив Республіці крізь її злети й падіння — і йому не знадобилося багато часу, щоб усвідомити, наскільки безнадійно невиправним став статус-кво в Колумбії. Рухаючись на захід із загоном своїх солдатів, він зберігав ту саму гідність, яку мав за старого режиму, несучи в собі традиціоналізм і шляхетність, прищеплені йому з юності. Часто з’являючись на публічних візитах і конференціях у церемоніальній формі, Курреа залишався відстороненою, якщо не цілковито загадковою особистістю.\n\nПроте за зачиненими дверима Курреа є джерелом численних чуток навіть серед його найближчих зв’язкових — від звинувачень в езотеричних віруваннях до дивних розповідей про нетрадиційне поклоніння. Дехто навіть припускав, що через сумнозвісне посольство в Боготі він підтримує зв’язки з генералом Франко по той бік Атлантики. Проте його теперішнє лідерство не було вибором ні для кого, навіть для нього самого; і здебільшого він достатньо добре тримав потопаючий човен на плаву посеред національної надзвичайної ситуації, надихаючи та картаючи, коли це було потрібно. Його воля не похитнеться, доки його надійне коло союзників зможе й надалі його підтримувати."
  POLITICS_HERNANDO_CURREA_CUBIDES_NATCATH_DESC: ""
  POLITICS_HERNANDO_FORERO_GOMEZ_DESC: "Дуже мало людей насправді знають, чого вони хочуть, і ще менше знають, як силою цього досягти. Кам’яноликий Ернандо Фореро Гомес, народжений 13 жовтня 1915 року, мав настільки похмуру рішучість у боротьбі з комунізмом, що став цінним активом державного апарату Республіки. Будучи начальником поліції, він був безжальним, хоч і винахідливим робочим конем, якого майже не хвилювала ціна його роботи — він виконував будь-які поставлені завдання з клінічною точністю, навіть якщо наслідки здавалися позбавленими логіки.\n\nЗгодом, обійнявши ту саму посаду в Калі, він залишався вкрай потайним у своїх методах, прокладаючи собі шлях угору бюрократичними сходами завдяки самій силі та рішучості. Ставши більш публічною фігурою, він мусив грати роль відкритої людини, проте мало хто знає цього загартованого мілітариста за образом бездоганного служіння — ті, хто намагається зазирнути глибше, зазвичай не заходять далеко.\n\nНепохитний і мовчазний, коли він перебирає владу, Фореро ніколи не дозволяє нікому напевно знати, про що він думає або чого прагне. Але якою б сильною не була їхня цікавість, яким би не було бажання дізнатися більше про загадкового генерала, вони все одно чудово розуміють: якщо він колись віддасть наказ, його вже остаточно ухвалено."
  POLITICS_HERNANDO_FORERO_GOMEZ_FASC_DESC: ""
 #### Nazis ##
  CLD_Jupiter_Reaction: "Новий Юпітер реакції"
  CLD_Jupiter_Reaction_desc: "У наріжних каменях величного бачення Болівара ми знаходимо фундамент нашої власної боротьби. Трагічне падіння Лауреано Гомеса та Роберто Урданети залишило наш рух напризволяще, позбавивши його провідників, які вказували йому шлях.\n\nТа відчай не має над нами влади, адже з цих похмурих часів нам було даровано нового каудильйо, який поведе нас уперед. Альфонсо Урібе Місас, губернатор Антіокії, постав із попелу нашої колись великої партії, згуртовуючи нас, щоб ми вистояли та боролися за благородну справу, яку відстоювали лідери минулого."

  CLD_Heldanomics: "Ліки доктора Гельда"
  CLD_Heldanomics_desc: "Під твердим керівництвом наших німецьких союзників у діаспорі — тих, хто щедро поділився своїми технічними знаннями та присвятив свою майстерність справі відродження, — ми сміливо рухаємося вперед.\n\nНаша головна мета зрозуміла: перебудувати нашу економіку та розпочати сміливі промислові проєкти, які перетворять цю дику й прекрасну землю — край, який ми люто та гордо захищаємо."

  CLD_Last_Knights_Old_Republic: "Останні лицарі Старої Республіки"
  CLD_Last_Knights_Old_Republic_desc: "Колумбія, велика боліваріанська республіка, лежить у передсмертній агонії, зраджена своїми нібито захисниками та поглинута розбратом, відчужена від Бога й традиції. Вона спливає кров’ю просто перед нашими очима — рана, що гноїлася надто довго.\n\nУ найтемнішу її годину, коли ніхто інший не відповів на її відчайдушний заклик, невелика група ветеранів Летіційської війни — Вільямісар, Хіль, Бонітто та Бой — піднялася на її захист. Разом із вірними товаришами вони створили те, що ми тепер називаємо Другою патріотичною армією: гордість нашої справи, авангард відновлення та останню надію Старої Республіки."

  CLD_Birthplace_Old_Republic: "Колиска Колумбії"
  CLD_Birthplace_Old_Republic_desc: "Північ — Картахена, Барранкілья, Момпос — позолочений уламок славетного минулого Колумбії. Саме тут не лише вперше ступили на землю іспанці, а й знайшов прихисток союз вільних народів, якому судилося сформувати Колумбію. Поки інші регіони чіплялися за корону або занурювалися в хаос, Північ залишався бастіоном стійкості.\n\nПоетичним поворотом долі стало те, що саме тут ми, присяглі захисники цього споконвічного порядку, знайшли своїх найсильніших союзників. Серед задушливої спеки та туманних боліт Північ б’ється як серце Колумбії — і як осердя нашої справи. Так само, як і 160 років тому."

  CLD_German_Support_dynmod: "Підтримка Пакту"
  CLD_German_Support_dynmod_desc: "До антикомуністичного хрестового походу Другої патріотичної армії приєдналася коаліція держав із самого серця Європи. Іберія, Франція та Німеччина надають військову підготовку й досвідчених радників, що дадуть перевагу на полі бою.\n\nТе, що ця допомога ще більше прив’язує державу до Пакту та зміцнює вже помітну германофілію, присутню в PCC, є лише незначним побічним наслідком."

