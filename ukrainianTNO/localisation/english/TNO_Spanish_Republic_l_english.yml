 #National Spirits 
 SPR_coordinacion_democratica:0 "Coordinación Democrática"
 SPR_coordinacion_democratica_desc:0 "The Second Spanish Republic was known for one thing above all others, its internal political instability that would result in the Civil War and its subsequent collapse. This stain of party rivalry and political infighting would haunt the minds of those who defended a return to Democracy in Spain, being used as an anecdote against it.\n\nSo, with the Iberian collapse and the subsequent Republican Revolt, unity against the Nationalists was seen as paramount for victory. Establishing the CD as a vessel for coordination between the different parties, independents and clubs, the Republic was able to prove that cooperation could be achieved in good faith and avoid the mistakes of the old. However, only the future knows if it will last."
 SPR_polarized_high_command:0 "Polarized High Command"
 SPR_polarized_high_command_desc:0 "There is no doubt that among the officers of the Republic, none support the continuation of the former regime. But how their new Democracy shall work is a much-contested issue. Many of the more conservative officers were hesitant to support things like Federalism and further Secularism.\n\nWhile the majority of army officers have no real opinion on the issue, proudly loyal to the civilian government and enthusiastically supporting popular sovereignty, the looming threat of these being wooed to the side of the Conservatives could spell military intervention in case of the wrong party coming to power."
 SPR_Andalusian_Tensions: "Andalusian Tensions"
 SPR_Andalusian_Tensions_desc: "Andalusia, home of bullfighting and flamenco, is as essential to the image of Spain as California is to America; yet it is also home to a growing separatist movement which threatens the underbelly of the country.\n\nDrawing from a history of Romans, Pheonicians, Moors, and Berbers, the Andalusian national identity has historically reached its apexes amidst times of crisis in the heartland.Its people, centered in Seville, often feel at odds with those in Madrid, a pattern throughout history that has reemerged amidst the crisis of the Iberian Wars.\n\nYearning for the democratic roots of the Second Republic amidst feelings of neglect, the South feels the kindlings of unrest once more, threatening to set the country ablaze once more."
 #Ministers 
SPR_Pio_Cabanillas:0 "Pío Cabanillas"
SPR_Pio_Cabanillas_hog_desc:0 "§YVice-President for Political Affairs\nLiberal Conservatism§!\n--------------\n§LWithin the Iberian government, Pío Cabanillas acted as the right-hand man to Manuel Fraga, the Minister of Information. His lack of visibility worked in his favor, and he was appointed VP of Political Affairs of the Spanish Republic.\n\nIn his new position, he is in charge of keeping the peace within the Republic's various factions, and overseeing its internal administration. Officially, the Republic has forbidden the formation of political parties, but that has not stopped Cabanillas from creating a club of like-minded reformists called "Political Action." The club's goals are to create a centrist political party that can advocate for democracy and moderation in the years to come.§!"

SPR_Jose_Miguel_Vega:0 "José Miguel Vega Rodríguez"
SPR_Jose_Miguel_Vega_sec_desc:0 "§YMinister of Defense\nProvisional Government§!\n--------------\n§LVega proved to be a rare specimen. Among the high officers of the Iberian Army, Vega was neither a conservative nor a reactionary. In fact, he was one of the first officers to side with the reformists, already backing them as the Republic's creation was planned in secret.\n\nNow Vega works on reorganizing the various units and soldiers that sided with the Republic into a coherent force, alongside integrating the few militias that actually evolved into proper military forces. However, intentionally or not, Vega has become a leader to those who question if mere civilians and politicians are truly capable of winning a civil war. Few wish to see a repeat of the last Republic's failures.§!"

SPR_Pascual_Pery:0 "Pascual Pery Junquera"
SPR_Pascual_Pery_hog_desc:0 "§YVice-President of the Government\nProvisional Government§!\n--------------\n§LWhen Vega stepped in to save the Republic's war effort, it was understandable that some of the civilian politicians would be upset, despite Vega's reassurances that he would step down after the civil war had concluded. Like the civilian government that preceded him, Vega turned to the Vice-President of Political Affairs to keep the peace between the Republic's many political factions.\n\nEnter Pascual Pery Junquera, a moderate naval officer who had served for the past four decades. Willing to negotiate even with the Communists, Pery keeps the peace and soothes the fears of the parties, while ensuring that the goals of the military are still given the first priority in all discussions.§!"
 
SPR_Jose_Maldonado:0 "José Maldonado González"
SPR_Jose_Maldonado_for_desc:0 "§YMinister of Foreign Affairs\nSocial Radicalism§!\n--------------\n§LMaldonado's first achieved office in 1936, where he was elected as a deputy for Oviedo. As the Republic began to fall to Franco's forces, he fled to France, and fled again to Mexico, alongside the rest of the exiled government. Decades later, Maldonado was invited back by the newly revived Republic as the Minister of Foreign Affairs. His efforts now are focused on rallying support from exiles scattered across Latin America.\n\nHowever, Maldonado's invitation was a token gesture to the exiled government, who lack any influence in Spain proper. His efforts can be easily swept away after the civil war's end, if the Republic's government feels so inclined.§!"

SPR_Marcelino_Oreja:0 "Marcelino Oreja Aguirre"
SPR_Marcelino_Oreja_for_desc:0 "§YMinister of Foreign Affairs\nChristian Democracy§!\n--------------\n§LMarcelino Oreja Aguirre has had a long career in the Ministry of Foreign Affairs. When the Iberian Union began to collapse, Oreja joined up with the newborn Republic. When Vega stepped in to save the ailing war effort, many of the reformists protested the move as anti-democratic, especially when a military officer was made VP of Political Affairs.\n\nAs such, concessions were made, and Oreja was named Minister of Foreign Affairs. Oreja has focused his work on obtaining support from the OFN, despite protests from the Republic's left-wing, who believe this will set a foreign doctrine precedent that will reach far beyond the civil war's duration.§!"

SPR_Santiago_Carrillo:0 "Santiago Carrillo Solares"
SPR_Santiago_Carrillo_eco_desc:0 "§YVice-President for Economic Affairs\nCommunism§!\n--------------\n§LSantiago Carrillo, as general-secretary of the Communist Party and the leader of the largest opposition party, was able to pressure the government into allowing him to oversee the Republic's war economy. In order to dilute his power, Carrillo was only granted the position of VP of Economic Affairs, and the various other economic ministries are controlled by less revolutionary factions.\n\nRegardless, Carrillo still has the power to exert control over key industries. Carrillo's position, however, is also undermined by his fellow revolutionaries, as the communists are hardly united, and much of his time is spent wrangling the various factions within the party.§!"

SPR_Macrino_Suarez:0 "Macrino Suárez Méndez"
SPR_Macrino_Suarez_eco_desc:0 "§YMinister of Economy\nSocial Radicalism§!\n--------------\n§LWith the Republic's economy now fully subservient to the military's needs, someone must do the thankless job of managing whatever remains for the homefront. That job would fall into the hands of Macrino Suárez.\n\nDespite being born mere weeks before the 1936 civil war, and despite his father fighting against the Republic, Macrino Suárez would eventually become a member of the Republican government-in-exile after a stint in an Iberian prison. A member of a political class that never was, too radical for the reformists and yet too moderate for the opposition parties, Suárez works to build a movement out of the exiles and their sympathizers that can survive in the post-war political system.§!"

SPR_Manuel_Gutierrez_Mellado_sec_desc:0 "§YMinister of Defense\nPaternalistic Conservatism§!\n--------------\n§LManuel Gutiérrez Mellado, a conservative officer who had worked with Falangists as far back as 1935, might seem like an odd fit for the Republic. However, from the perspective of Gutiérrez, the newborn Republic was the only faction to carry out what Gutiérrez saw as long-overdue military reforms. The fact that a number of Iberian officers had negative opinions of him, however, certainly didn't make the decision more difficult.\n\nGutiérrez is focused on winning the war, and preparing the military for further reforms. As long as the civilian politicians work for the betterment of Spain, and support his reforms, Gutiérrez sees no problem in working with them.§!"

SPR_Francisco_Sintes:0 "Francisco Sintes Obrador"
SPR_Luis_Pinilla:0 "Luis Pinilla Soliveres"
SPR_Guillermo_Quintana:0 "Guillermo Quintana Lacaci"
SPR_Jose_Rodrigo:0 "José Rodrigo Rodrigo"
SPR_Jose_Saenz_Tejada:0 "José María Sáenz de Tejada"
SPR_Gonzalo_Rodriguez:0 "Gonzalo Rodríguez Martín-Granizo"
SPR_Saturnino_Suanzes:0 "Saturnino Suanzes de la Hidalga"
 #Tree 
SPR_prefiero_vencer_o_morir:0 "Vencer o Prefiero Morir"
SPR_prefiero_vencer_o_morir_desc:0 "Popular Sovereignty. It's one of the greatest advances in history, and yet we gave it up and subjected ourselves to the whims of sycophants and tyrants. Watched as all who dared stand by that idea were killed or disappeared. All across Spain for years we sat by as our brothers and sisters were oppressed and abused by those calling themselves our saviors. Idled as the arrogant malefactors we called Caudillos traded our rights for their gain.\n\nNo more."
SPR_prefiero_vencer_o_morir_tt:0 "§p¡Honor, honor a España!\n¡Viva la Libertad!\nPor rumbos de progreso,\n¡avancemos con aire triunfal!§!"

SPR_integrate_the_militias:0 "Integrate the Militias"
SPR_integrate_the_militias_desc:0 "We may have the spirit of the people behind us, however that does not extend to the full might of the army. Some soldiers deserted Spain to defend the Junta to the North. Simply put, our current professional military is not sufficient for victory.\n\nHowever, many popular organizations have formed to take Spain back from the Fascists. We will integrate these irregulars to our forces and rapidly expand our military might. Our army will truly be one of the people!"

SPR_everyone_can_serve:0 "Every Soul a Soldier"
SPR_everyone_can_serve_desc:0 "The Fascists think us disorganized and weak. They think that we are unable to govern or defend ourselves. They don't understand that what they think is our weakness is our strength. We will not discriminate or demean, anyone who wishes to fight for freedom has a place in our ranks. The Popular Front of the 1930s may have fallen to division but we have learned from their mistakes, and Spanish liberty will rise like a phoenix twice as strong.\n\nCry it on the posters, on the radio, the television and the town squares: "Junto! Juntos por la Libertad!""

SPR_adress_the_nation:0 "Tuning the Masses"
SPR_adress_the_nation_desc:0 "While there is no doubt about our resolve, we could benefit from making sure people are reminded of the importance of our fight. Unlike the Fascists in the North our society has many different groups who all have their own ideas of what the Republic should become. If we remind them that for any of us to decide that the Republic must survive first, we can put our differences aside for the common goal of Liberty."

SPR_relax_working_legislation:0 "Sweat and Grease"
SPR_relax_working_legislation_desc:0 "We started this war to save Spain from those that took advantage of the people and abused them unfairly. We wanted to protect them, and that is still our ultimate goal. However, wars are not won by ideas alone, but by the strength to defend them. We need more guns, more bullets... more of everything to be frank. While it will infuriate our Left-Wing partners we have no choice, we will have to temporarily relax worker protections so that we will have the resources we need to destroy the Fascists.\n\nAfter all, what good would our ideals be if a lack of guns allowed the despots to rule us like slaves once again?"

SPR_woo_possible_partners:0 "Los Forasteros"
SPR_woo_possible_partners_desc:0 "During the Civil War Democracy was lost because foreign support couldn't be secured. The Republic made do with scraps while the Fascists had the might of the Germans and the Italians behind them. Unlike in 1936 however, there are now nations that should support our crusade. We will reach out to the OFN and foreign nations that can help us secure a sanctuary of Democracy on the European mainland with their resources. This time we will make sure we will have what we need to win, whatever the costs or promises we must make."

SPR_invest_in_tank_brigades:0 "Rolling Over the Cordilleras"
SPR_invest_in_tank_brigades_desc:0 "While men fight wars, it is weapons that win them. That's what we learned from Germany's victory against the old Imperial Powers, and we should learn from their example. We may not be able to field our own mighty tank army currently, we will use the mothballed tanks we have been able to secure in Spain and whatever we can purchase from overseas to create our own Tank Brigade. With that we will be able to use tactics that once subjugated to Europe to instead free a part of it."

SPR_motorize_the_army:0 "Lightning Over the Mesetas"
SPR_motorize_the_army_desc:0 "Spain's expanse has been the bane of many armies, of foreign dictators like Napoleon to our own Republican army in the previous Civil War. As Germany showed the world, the key to victory is speed and not being trapped in such land expanses.\n\nTherefore, we need to rapidly increase our maneuverability to bring a swift end to this war. While the might of Germany's Panzer armies may be beyond us currently, we can begin to integrate trucks and any other vehicles we can find. With them we can prevent the Fascist's gaining an advantage and quickly restore our rightful Government."

SPR_modernize_the_cartagena_base:0 "Southern Sentinel"
SPR_modernize_the_cartagena_base_desc:0 "Iberia's modernization had been slow before the Collapse, and it was already noticeably behind compared to many of our European peers. As such much of the military infrastructure we have been able to secure is older than we would like.\n\nThe War gives us a great opportunity to develop these quickly however, and through that secure our victory. The Cartagena Naval Base in Murcia has been identified as the base we can develop the fastest. It will become a symbol of our modernizing message against the backwards Fascists while also providing us with a framework to develop our War Effort."

SPR_revitalise_the_air_force:0 "Revitalise the Airforce"
SPR_revitalise_the_air_force_desc:0 "In the previous Civil War it is undeniable the Fascists had the advantage in the air. Thanks to their foreign backers many Republicans fought with one eye in the sky at Teruel, at the Ebro and at Segovia with little ability to match them. We can not make the same mistake, so we will organize the aircraft we have been able to secure in a new Arma de Aviación. We will fight the Fascists be they on land or in the Sky."

SPR_create_special_units:0 "Create Special Units"
SPR_create_special_units_desc:0 "The European Wars of the last few years have shown us that the key to victory is to move faster than your enemy. However, many parts of Spain do not lend themselves well to this due to their terrain and easy defensibility. If we are not careful we could easily be trapped into a war of attrition, which could crush our war effort.\n\nTherefore, we will create special units of men experienced in moving across these difficult terrains. With them, we can turn the valleys and hills the Fascists hide in from safe heavens to graveyards."

SPR_the_examples_of_past_times:0 "Opening Our Closet"
SPR_the_examples_of_past_times_desc:0 "A healthy state is a state that refrains from violence and respects the fundamental rights of every man and woman, transgressions of that can only be seen as grievous crimes. It's no secret that Spain has been torn apart for decades by those that deny these things, the Fascists in the Government, the anarchist terrorists and other militants have abused the people for their own gain.\n\nToday we can begin to right the wrongs by making public the results of the Investigation into the crimes of the various militants across Spain. Maybe then Spain can begin to heal and, most importantly, see our Republic as the only deserving Government."

SPR_industrialize_andalucia:0 "Smoke Over Andalucía"
SPR_industrialize_andalucia_desc:0 "Spain has not been kind to regional identities, with the Governments of the past putting resources into crushing dissent and any who loved their region rather than their prosperity. The result is every kind of neglect that simply fed regionalism and made Spain weaker.\n\nWe shall plot a new course, investing in our regions hopefully both promoting Spanish Unity and aiding our war effort. Andualica was one such region that suffered so we shall begin there."

SPR_begin_a_war_bonds_program:0 "War Bonds Program"
SPR_begin_a_war_bonds_program_desc:0 "Money is what makes the world go around, and we are burning through it fast. War is expensive and with only a portion of the country under our control and a limited ability to trade, our money making options are slimmer than we would like.\n\nOne way to deal with this will be to start a War Bonds program. It may not completely make up our expenses but every little bit helps in the fight against the Fascists."

SPR_allow_argicultural_cooperatives:0 "Allow Agricultural Cooperatives"
SPR_allow_argicultural_cooperatives_desc:0 "Our Socialist partners have given us a proposal regarding the reformation of farming within the Republic. They state that the previous Government's anti-cooperative policies have led to widespread corruption, inefficiency and mismanagement. They have offered a comprehensive program redistributing power back into the farmers via the establishment of true co-operatives.This should allow them to contribute to the Republic and the War far more effectively.\n\nWhile we will have to moderate down some of the more radical aspects of the plan, decentralizing our agricultural administration is an idea with a great deal of merit."

SPR_expand_the_sevilla_port:0 "Expand the Sevilla Port"
SPR_expand_the_sevilla_port_desc:0 "A more forward thinking way of money making would be to expand the Sevilla Port. As one of the most important trade ports on the Southern coast of Spain, expanding it would improve our access to international goods and, perhaps more importantly, their access to ours. Being successful in this would be a huge boost to our economy and war effort."

SPR_temporary_welfare_cuts:0 "Merciless Math"
SPR_temporary_welfare_cuts_desc:0 "The faces of our economists are grave and there is a good reason for it. All the data shows that to continue the War as we are now we must cut our welfare expenditure so it can be redirected to the War Effort. We can already hear the outrage of our socialist partners but the fact of the matter is there is no choice. We will push through these cuts and hope that the Spanish people accept our total promise that this is a merely temporary state of affairs."

SPR_best_chance_for_freedom: "Best Chance for Freedom"
SPR_best_chance_for_freedom_desc: "Freedom. It has been a word, whispered by candlelight in remote places. Spoken about in hushed tones in darkened rooms. Dreamed about in disturbed dreams. Much of the nation had forgotten, those few who recalled it forced into hiding, most forgetting there had ever been a dream before the Caudillos.\n\nBut no matter how much the boot comes down upon the face of freedom, its ideal persists.\n\nThis is our chance, our best chance, to finally make that hushed idea a freedom. The road will be terrible, made terrible by those who want to hold their power within their claws. But for our nation, for our friends and for our children, we shall fight and die for freedom."

SPR_last_chance_for_freedom:0 "Last Chance for Freedom"
SPR_last_chance_for_freedom_desc:0 "Our people have worked, bled and died for the cause but it is still not enough. Still, enemies of the Republic stand oppressing our brothers and sisters. It is also no secret that we are beginning to tire, this war carrying such a huge weight on us. There are whispers against the Republic itself, with some beginning to question our methods and their 'inefficiency'. For the sake of the Republic and our values we will have to remind as many as we can that Freedom is within our grasp if we can just take it!"

SPR_arsenal_for_democracy: "Arsenal for Democracy"
SPR_arsenal_for_democracy_desc: "Our enemies want to crush our dream. They will come for us, with every terrible weapon they can scavenge, beg or build, and they will seek to destroy us. The only way that we can resist and turn back this black tide is to ensure we have every weapon possible to break them first. The Spanish people must know of the pivotal importance of our needs.\n\nIn the factories, speakers shall spread the word of our requirements of our crusade. In the streets, posters shall encourage frugality, so every possible resource may be sent to the front. Every rifle, every can of food, every shoelace that can be sent to the front shall be, and our army shall march with the full power of Democracy behind it."

SPR_expand_conscription:0 "Hombres Y Mujeres Valientes"
SPR_expand_conscription_desc:0 "So many of Spain's bravest sons and daughters lie dead all across our land, valiantly sacrificing themselves to save their brethren from the Fascist. The cost has been high however and there are serious concerns that our current manpower procurement is insufficient to maintain our military.\n\nAs much as it pains us, we must expand conscription and 'ask' those children of Spain who had previously been protected from fighting to join the war. They had been protected to ensure our future stability, but what good is that stability if we lose today?"

SPR_fires_for_liberty: "Fires for Liberty"
SPR_fires_for_liberty_desc: "The State should protect its people, and regulations to ensure their safety, good environment and protection from unfair employer treatment is surely one of the greatest steps of progress from the old world. However, the fires of progress burn far less fervently than the fires of war, and difficult questions must be made regarding the balance between efficiency and morality.\n\nA committee shall convene to determine which regulations are significant bottlenecks in our war economy, and temporarily overturn them. Our factories must work around the clock, every resource exploited and every possible sliver of productivity extracted if we are to win. After all, should we fail, who comes next shall feel far less inclined towards the true wellbeing of the Spanish people. The total necessity of the action will be impressed nationwide; there will be no misunderstanding."

SPR_everything_for_the_military:0 "Everything for the Military"
SPR_everything_for_the_military_desc:0 "Across Spain the crack of rifles can still be heard. The rumble of artillery is unmistakable. The war goes on, and every day all of Spain teeters closer to the abyss. Everything we have, either industrial material or scraps from our homes, must be directed to the military so that we can free Spain.\n\nSo that the guns stop, we must ensure all we have goes towards silencing the guns of others before disaster befalls us all."

SPR_no_more_distraction:0 "Cut the Noise"
SPR_no_more_distraction_desc:0 "The time has come. Freedom for the people has not developed into freedom for the nation. The fact we are giving liberty to our enemies and the lack of discipline within our Republic means we have no choice. To ensure the future of our Republic we must temporarily suspend all relevant civil liberties until our enemies are crushed."

SPR_no_parasan:0 "¡No Pasarán!"
SPR_no_parasan_desc:0 "Every soldier. Every gun. All of it must be pointed at our enemies. We are tired. We are beaten down. We have lost so much. All of it at the hands of the Fascist. No more. We will all commit ourselves body and soul to this final effort to free our nation of the Fascist. No more will they torture us and all of Spain. Now we will show them the meaning of fear as they flee in terror from our final glorious push, or we will die trying.\n\nAs those that came before us proclaimed in their darkest hour, so too will we. "¡No pasarán!""

 #######EVENTS
 #These are Pre-War Events
 SPW_wars.1.t:0 "Like Water"
 SPW_wars.1.d:0 "José Miguel Vega Rodríguez was a deeply military man, adherent to an austere lifestyle, as he found it the condition which focused his mind the most. He was at his desk in a muster camp constructed just outside Valencia, a tent adorned only with a bed, desk, lamp, service rifle and papers.\n\nAt this desk he sat, trying to settle his mind as he read his new orders multiple times. He and many of his men had suspected their purpose when they deployed earlier in the day, now he had confirmation.\n\n"QUELL RIOTERS. ALL MEASURES AUTHORIZED. COMMUNICATE SUCCESS IMMEDIATELY."\n\nAn impossible request phrased so simply, local police liaisons had informed him that central Valencia was effectively lost to them. Some of the rioters had already attacked the police and Guardia Civil. He and his men had been forced to muster outside the city as the risk of moving inside without combat readiness was just too great. The euphemism of the order was clear; a bad fight was expected. That was why they had been sent.\n\nIn the last decades he had swallowed the Caudillos despite some misgivings because he thought they would preserve Spanish freedom from Germany. Now he was being ordered to shoot his own. Had he been worried about the wrong party? Will it even matter?\n\nHe listened for a moment to the sounds of soldiers outside. Many of these men would die when they marched into Valencia. What for? José had hoped that his ideal of freedom for his country was a star that Iberia had tried to attain. Freedom for their country from Germany or others at least. Maybe he had been mistaken in his priorities, and now his soldiers would pay that price."
 SPW_wars.1.a:0 "Perhaps, like a river, his ideal had merely flowed past."

 SPW_wars.2.t:0 "Give 'em Enough Rope"
 SPW_wars.2.d:0 "The room was barely lit, the curtains drawn with only a gas lamp illuminating the room. This room was in an isolated cabin, far from the lights of Madrid where the occupants had come from. Sat around the room were various minor politicians, each of whom had been waiting for an opportunity to change Spain. Most felt their time was here, but some still held reservations. They had sat in the room debating if the time had come to seek allies and escalate their efforts to force reforms. Doing so would expose them however, and each one feared striking too soon.\n\n"I respect the opinion of García, but this is just too risky. Spain has had rioting before, and it has survived. Sure, Portugal has gone but the Union was uneven anyway, this might just consolidate Franco. I will be the first to say that this situation is an opportunity but we must be careful not to push too far or we lose everything we've fought for!" said one of the more cautious in the room, a career politician called Pedro. He remained unconvinced despite the hours of effort\n\n"Oh Pedro, if it were for you we wouldn't walk for fear of falling" retorted the man called García. He was one of the more proactive, he'd called the meeting. The others murmured in agreement. In previous hours they had all been convinced to begin seeking larger allies.\n\nTheir debating was interrupted by the sudden sound of a car on dirt, and a flash of light outside. The men panicked fearing the Guardia Civil and they all darted to the door, only for García to find one of his colleagues.\n\n"It's Morocco,they've done it!" he said with a mix of shock and enthusiasm. "They've declared independence! This is real!" Everyone in the room turned to Pedro, whose mouth hung open."
 SPW_wars.2.a:0 ""Maybe this really is it""
 SPW_wars.2.b:0 "A New Domino Enters the World"
 #These Are Pre-Coup Events
 SPR_wars.10.t:0 "Desperate Times"
 SPR_wars.10.d:0 "These nights were always the worst ones. The type of summer nights that weren't just hot, but wet as well. The general stepped outside of the scorching planning tent, where his comrades continued to plan out new offensives, new tactics and new ways to win the war. The warm breeze mingled with the sweat running down his face, as he took a handkerchief to his brow. The makeshift camp was on the pavilion of an old manorial house, high in the mountains. Overlooking the valley below it, the balcony would have provided a once-in-a-lifetime view, if it had been during the daytime.\n\n"Hot for you as well?" Huddled over the edge, another figure was still, his angled profile and general cap only being faintly illuminated by the dim amber of his cigarette. "Yeah, I don't understand how the young ones stand it either. Maybe they just have warmer blood than us reptiles."\n\n"This war's gone sour, you know. I'd have thought that the entirety of Iberia would have risen up against the Fascists, although I never expected it to be bloodless. But we've stalled. We can't keep this up, and if we lose..."\n\n"Then we get hung, like the traitors we are. Just like the last leaders of the Republic. But, we aren't in their shoes yet. This 'provisional government' of ours is driving us there, though. All the umming, all the urring. All the politics..." the man on the balcony spat, venom driving his last word.\n\nThe general said nothing, only moving towards the balcony himself and hunching over it. There was nothing but the dark, and the faint lights of the village below them to guide his visage. The man offered a lighter, but he declined with a wave.\n\n"If we allow ourselves to be run like a military dictatorship, we'll have put ourselves on track to becoming one. But...maybe you're right about some things...""
 SPR_wars.10.a:0 "Maybe it's time to make the hard decisions."

 SPR_wars.11.t: "In Defense of Liberty"
 SPR_wars.11.d: "The López family was sitting around the radio, the sunset light flooding their small kitchen in red. Antonio was out with the troops, so when Evita told Pablo and Gabi to come listen to the special announcement her boss said would be coming tonight, they had plenty of room. The siblings teased each other when the radio crackled to life.\n\nCitizens of Spain, loyal sons and daughters of the Republic. This is Jose Miguel Vega Rodríguez, former Minister of Defense." Evita raised an eyebrow; former? Her coworkers at the finance ministry hadn't said anything about him being sacked. "It is my duty to inform you that our esteemed president, Torcuato Fernández-Miranda, has decided to resign from his position, citing his inability to prosecute the Republic's war effort to its successful conclusion. In his stead, the cabinet of ministers has seen fit to name me as the provisional president."\n\nWith wide eyes, Gabi blustered out: "Does this mean that we're also going to have generals in charge now like the fascists? This isn't what we-"\n\n"If the politicians can't handle the war, maybe the soldiers need to show them how it's done," Pablo interjected before their mother could hush both of them. "Enough! Let's hear what he has to say."\n\n"...to provide the armed forces greater input into the war effort, in the certainty that this will allow us to bring about a quicker and more successful conclusion to the cataclysm which has engulfed all of us." The radio went silent for a moment. "However, I wish to stress beyond all else that we are still fighting for the freedom of all Spaniards. As President, I pledge that no measures that will encroach on citizens' rights or put their freedoms in jeopardy shall be implemented. We shall defeat the tyrants without stooping to their level. For liberty!" The address was cut off."
 SPR_wars.11.a: ""Does this mean Dad will be in the government now?""
 SPR_Junta_tt: "§RTheir patience is over.§!"

 #Everything Below is for Events from the Actual War Focus Tree
 SPR_wars.12.t:0 "To Liberty"
 SPR_wars.12.d:0 "If Liberty had a face, her newfound followers hoped she was smiling on them.\n\nIn Cádiz, men and women who had for years kept their allegiances secret gathered at the seafront, declaring a new revolution under a red banner that had not seen the light of day in decades. The sound of gulls and the swaying of the sea reverberated as many speakers spoke for this new war. They all felt fear and elation in equal droves as they declared for this new Republic. "¡Hacia la Libertad!" they cried.\n\nIn Sevilla, a crowd watched as armed men stormed the aged City Hall building. Some in the crowd fled while others watched on in a daze. More quickly came to witness. The swelling crowd could barely believe it when portraits were thrown out of windows and murmurs of an uprising spread. A thin suited man read a speech to the crowd declaring an end to the Union and the start of a new Republic. By evening, the crowd sang when they set alight their effigies and paintings of their former masters. "¡Hacia la Libertad!" they cried.\n\nIn Granada, a young boy watched as a sea of people marched past him through the historic streets. Some were uniformed, many not, but all were singing as they marched to a new war. Despite their destination they sang happy songs and the young boy waved his flag to their rhythms - a small tricolor flag, fashioned from rags. It was a flag he had never seen raised but had been told so much about. "¡Hacia la Libertad!" he cried.\n\nIn Málaga, nervous politicians argued who to send as representatives to the new Emergency Cortes. Victory required wisdom, but few could agree what that was and fear of defeat gripped them all. Socialist clashed with Moderate. Moderate clashed with Conservative. Conservative clashed with Socialist. Soon however, with their eyes set to the future, compromise was reached. As they chose, all in the chamber cried out with one voice."
 SPR_wars.12.a:0 "¡Hacia La Libertad!"

 SPR_wars.13.t:0 "Nosotros Luchamos"
 SPR_wars.13.d:0 "Report: Week 13 of Operation (REDACTED), Officers of the (REDACTED) Brigade Reporting Transcripts, attached to Partisan forces in the (REDACTED) region\n\nDay 13: Communists are untidy and unregulated. Risk to us and others. Resistant to initial introductions, evidence of distrust. Tactics unseemly. Preparation for assault on Objective (REDACTED) begun\n\nDay 3: Communist Partisans aided in evacuating a village near the conflict zone. Measured in their actions, but harsh to espoused Union Loyalists. No noted cruelty, however a close eye will be maintained.\n\nDay 4: Partisans rescued Officer despite orders not to. Officer had been wounded a day ago and captured. Decision was made to keep moving to Objective (REDACTED) however they absconded in the night. No casualties. Partisans were ready for punishment however any decision of that nature was postponed to after the attack.\n\nDay 6: Attack on Objective (REDACTED) a success. Near catastrophe when Irregular Forces were suppressed by surprise armored elements, however quick coordination between Officers and local Anti-Tank elements avoided disaster.\n\nDay 7: No punishment will be taken for previous contradiction of orders. Citations for Outstanding Conduct will be requested shortly.\n\nDay 130: Troops rested and morale is high."
 SPR_wars.13.a:0 "No walls will divide us, neither stone nor class."

 SPR_wars.14.t:0 "W.C."
 SPR_wars.14.d:0 "Rodrigo stepped off the boat that had been his home for weeks, down the walkway to the solid ground of the port. It felt good, although his body still felt like swaying despite the steadfast condition land offered to him. Behind him, still on the ship his crew lined against the railing, taking a moment to relax until they got the signal to offload their cargo with the port workers. Walking towards Rodrigo was an older man in uniform, wearing the colors of the New Republic. It was roughly stitched, with Rodrigo still seeing the slight discoloration on the fabric where the old Iberian flag had once settled.\n\n"Sir, are you Captain Rodrigo Torres?" the incoming officer asked promptly, all business. The sun reflected off the Officer's spectacles into Rodrigo's eyes but, besides moving himself, he paid it no mind.\n\n"You've found him, you are Major Cortez? Can I sign off this cargo and let my men do their job now?" Behind him his men gazed as port workers began to assemble along the dock.\n\n"Certainly, I'll just have to inspect the inventory and we can get to work. Any issues before you left?"\n\n"No, although I think they were a little puzzled why a Spanish ship was sailing away with shipping crates full of toilets. They didn't ask any questions though, thank goodness. I won't lie, I didn't believe this ruse would work."\n\nRodrigo led the officer through his ship to the cargo hold, respectfully answering his inquiries to the outside world, before reaching the first of many shipping containers. He opened the door, and shone a torch inside.\n\n"I did this in the last war, you know. For some reason, if you say anything is a toilet, no one wants to check" mused Major Cortez with amusement, as the torch beam illuminated one of the Republic's new tanks."
 SPR_wars.14.a:0 "Fool me twice, shame on who?"

 SPR_wars.15.t:0 "Campeador"
 SPR_wars.15.d:0 "The sharp impacts of bullets vibrated the air around the huddled soldiers, crouched behind any cover they could reach. Their assault on the enemy supply depot had seemed like a huge risk with such limited forces but they needed to secure this area. They needed this depot.\n\n"Juan, what the hell are you doing?!" shouted the squad leader, Rodrigo. He had glanced around his squad and noticed the newest recruit, a young mechanic from Murcia, crawling away with one of his NCOs who had the Squad's Republican banner hanging from his rucksack. If they heard him they gave no sign.\n\nMinutes of exchanging fire passed and the two didn't return. Rodrigo wanted to scream now that his squad was turning to desertion. All of their dreams had been to fight the fascist, and instead they were going to die huddled in a corner or being hunted like cowards. He prayed to God that the Fascists hadn't flanked them.\n\nSuddenly, he heard a cranked mechanical scream not unlike a rusty lion's roar. Bursting through a hanger door between them and the enemy came a battered truck. On the passenger side the roof had been cut open to field a .30 LMG which an enthused, laughing Juan found himself blazing at a surprised enemy.\n\nRodrigo saw his chance. He blew his whistle and ordered the attack which would route the enemy from the Republic's new depot. He stepped into the open, firing at the faltering enemy and he urged his men forwards. Together they advanced."
 SPR_wars.15.a:0 "As he ran he saw the flag of a newborn nation proudly hanging from the truck's side."

 SPR_wars.16.t:0 "I'm Not Down"
 SPR_wars.16.d:0 "The room was hanging on every word Torcuato Fernández-Miranda said, and he felt it. Before him were a flurry of microphones broadcasting to all Spain. In the meeting hall around him were the leadership and numerous cadres of every political group that was part of this new Republic.\n\n"Brothers and Sisters," Torcuato continued, "I will not lie to you. These are hard times. However, I ask you, when were they ever easy? Now we finally have the freedom to proclaim our dissatisfaction to those that tried to oppress us, to take away our humanity!"\n\nA cry of agreement and applause came from the socialists and some of the moderates, but some in the audience were noticeably quiet, particularly the Military, Torcuato noted.\n\n"But with this freedom comes responsibility. We cannot act like how the Fascist claim us to be, weak and disunited. Spain is a land of tradition, a land of unity where we know to reject the ideas of those who would take what is ours!"\n\nA courteous round of applause came from the Military and many of the other moderates, the ghost of agreement upon their faces.\n\n"I have carried my responsibility to lead this Republic for only a short time, but I feel every insult and injury the Fascist does to us. It will not break me however, rather it emboldens me to make them pay for every crime they commit. I'm not down. My fellow Republicans, are you?" A resounding no cried out around the room.\n\n"Then let us rid this country of the Fascist together!" Torcuato proclaimed. Across the room representatives stood and applauded, with various patriotic chants ringing across the room. Silently Torcuato hoped his words would have similar effects across Spain, but he allowed himself a moment to feel the energy of the room."
 SPR_wars.16.a:0 "A strong Republic requires a strong people."

 SPR_wars.17.t:0 "Spanish Bombs"
 SPR_wars.17.d:0 "It had been a long time since Federico had actually listened to the radio, much less owned one. As a student, there always felt like there were far better expenses, food for instance, with which to spend his budgeted pittance. However this month he had decided to accept the cost, otherwise he would miss what had become a bizarrely anticipated broadcast around the University.\n\n"That was our findings for crimes against the people in Murcia. Following will be the findings for the region of Andalusia..."\n\nSuch a broadcast would have been impossible only months ago, a public presentation on the violence inflicted by both the Government and the radicals who had fought them. They had only covered one region so far but the picture of assassination, torture and other crimes had been palpable. Federico had been slow to accept the fall of Iberia but the things the radio had said the Government had done? Often with eyewitness testimony? There had always been strict punishments and that had suited Federico fine but many of the findings were nothing more than malicious.\n\n"In Andalusia, there has been a battleground of violence since the Civil War. For example the Church Bombing campaign of 1947 which killed 39 innocent churchgoers rather than the reported 11. We found it to have been perpetrated by an isolated wing of former CNT-FAI members. The Government reacted with mass arrests and torture, and in a handful of cases summary executions, due to the religious nature of the attacks. The full extent of what occurred will be described in the following account of a former civil servant, whose name we have retracted, who will describe what happened."\n\nFederico settled back into his seat. If even half of what this broadcast said was true, then maybe the Republic wasn't such a bad thing."
 SPR_wars.17.a:0 "Sic Semper Tyrannis."

 SPR_wars.18.t:0 "That's Just the Beat of Time"
 SPR_wars.18.d:0 "The echoing clanks and whirrs of the factory bounced all around the workers, forming a beat to their work as they all performed their tasks. Some were operating larger machines, others at tables carefully crafting with hand tools. This factory had a quota of rifles to meet, and it was currently running slow.\n\nSome of the workers dreamed of American factories, with all their high-tech efficient machines that they had heard so much about, but such a factory was far from their power. Their machines were old, their tools were worn and the sun had long since set. They all had hoped to be home hours ago.\n\nWhen the War had first started the new Government had given their managers stricter rules on how much they could work amongst a flurry of other regulations but they had been quietly suspended in recent weeks. They were all attentive to the news so the meaning was clear. The war was still raging and the Republic was still struggling. A rapid victory had been unlikely anyway they supposed, but the reality was their soldiers needed more weapons.\n\nThey satisfied themselves however and accepted the situation. The Soldiers at the front were fighting and dying. The workers were comparatively lucky. Their workplace had still become more equitable, even if the new protections were being suspended. Such was war, but the box had been opened and they all knew it. They could revisit the regulations when their flag was safely flying in Madrid. As long as they did their best and the Republic stayed strong, time was on their side.\n\nSo, they continued to work, the cranks and bangs sounding late until the night. The quota would be met no longer how long it took, and the men and women fighting for them would have every gun they could give them."
 SPR_wars.18.a:0 "Victory would bring liberty."

 SPR_wars.19.t:0 "Grapes that Go Ripe in the Sun"
 SPR_wars.19.d:0 "The day had begun just like any other in Seville. People had walked to work and soldiers on leave lounged enjoying their time away from the front lines. Children played games with sticks fashioned into guns all across Seville all staging their own little storming of Madrid. The war had touched Seville, but a status quo had formed and compared to much of what had come to be called the 'Frontier' areas of the Republic that saw much more conflict it was an oasis.\n\nIn the afternoon however, word spread quickly about a handful of ships that had come into port a little earlier. First the children had gone, then curious adults followed the exodus. Soon a flurry of phone calls and messengers had brought much of who was left.\n\nBy the evening, it seemed like half of Seville had found their way to the Port. In the waters were a handful of ships, not large but sizable nonetheless, waving flags unmistakably foreign. Cranes and men carried boxes off the ships, the men clearly struggling under the weight. It had not taken long for most in the crowds to realize what this was, but when one of the ship's crewmen awkwardly but enthusiastically shouted "Viva la República" to the crowd it was like a spark.\n\nA party-like atmosphere descended as while the crowds maintained a distance away from the unloading, half out of respect and half because the very openly armed guards maintained a perimeter, many chose to have a public celebration in the shadow of the ships. Dancing and music soon broke out around the Seville Port.\n\nThe World had not forgotten them like last time. The World would not abandon Spanish Liberty like it had last time. Already the mistakes of the past were being made right."
 SPR_wars.19.a:0 "From the old men to the children, all smiled at what that promised."

 SPR_wars.20.t:0 "Let Fury Have the Hour Cause Anger Can Be Power"
 SPR_wars.20.d:0 "Defense Minister José Miguel Vega Rodríguez sighed inwardly as he saw the state of his leader. Torcuato was looking at papers strewn haphazardly around the table with desperate and darting eyes. Numerous maps, reports and lists, most brimming with news of delays and shortages. Around the table was the sound of bitter argument as Ministers and Generals fought over increased military powers. This war was taking a toll on them, and without a fast end he feared the cost for Spain. José had imagined that they would be in Madrid safely running a new Republic by now. Instead they were still fighting a grueling Civil War and a simmering anger could be felt. After all, they had asked Spain to give them everything and it had - so where was victory?\n\nThere were more whispers of doubt now, even from inside the military. Some had even begun to ask him if he was willing to do 'more' for the Republic should the situation evolve. José didn't want to think about what that meant. Reality was getting harder to ignore - they could only do more with harsher war measures, but how far dare they go?\n\n"Silence!" José cried out, with the room's cacophony uniformly stopping. José walked over to the leader of the Republic, who was now straightening himself. José observed him taking a steadying breath.\n\n"Torcuato, what we've been doing has not worked. We need to make decisions," José turned to look around the room, "not arguing here like petulant schoolboys!". An embarrassed silence lingered.\n\n"Do whatever you need."\n\nTorcuato placed fists back on the table and glared at José and the others in the room. He raised an accusatory finger around the room. "Everyone, do whatever needs to be done. Anything for the Republic." With that he stormed out avoiding José's pitying and surprised eyes. No one had the chance to question him or the order."
 SPR_wars.20.a:0 "Eyes fell on José."

 SPR_wars.21.t:0 "The Ragged Army"
 SPR_wars.21.d:0 "The length of the marching column would have appeared somewhat majestic to any onlookers who would have been in the empty countryside of Spain. Fresh from training, and remarkably disciplined given the rapid pace of it, they continued marching methodically along an ominously empty highway.\n\n"Couldn't we be using a truck?" muttered a man to Victoria's right, speaking to no one in particular. The girl silently related to the man, whose name escaped her, but otherwise kept her mouth shut. She instead tried to keep all her efforts focused on continuing the march. Victoria had never been a physical creature, more comfortable in a study room than a gymnasium. She'd even avoided the war thus far since she'd had a husband and a family. Had.\n\nThe call up notice had arrived merely three weeks ago. Training done in two, and now she was marching... somewhere. All around her were men and women in mixed-gendered battalions who had also been so far spared the war - minor factory managers, policemen, junior civil servants, housewives, students and so forth.\n\nVictoria tried not to think about the implications of that too much as she marched, as she was sure the others did too. She had studied the mass conscriptions in the final days of the Soviet Union. The People's Army that had attempted to fight the Germans in the United Kingdom. It wasn't hard to start drawing some unsettling conclusions.\n\nHowever, around her the others seemed to not give into her own fears. Despite the groans there were smiles. Behind her some were even singing. She cast the dark thoughts away and focused on the march. Who knew when the next rest was after all?"
 SPR_wars.21.a:0 "The fellowship gave each other a strength they cherished."

 SPR_wars.22.t:0 "Clampdown"
 SPR_wars.22.d:0 "The Cortez was, in a word, chaos.\n\n"You are a pig, Rodríguez!" screamed Josep. "A scum eating pig!" Anger seeped out of his very being and he raised his fist, one of many in the room as all of the more radical Socialists stood against the man standing at the podium - their new 'leader' Abraham Rodríguez.\n\n"Gentleman, I assure you that this is a merely temporary measure, and has been agreed unanimously by the Council, but - " Abraham tried to regain control of the narrative bouncing around the room but the futility was self-evident, something Josep relished in. A veteran of the Seville Socialist Movement, he was furious to hear of the new policies being forced through. A large list of new 'Civil Offences', which notably stripped many of the liberties they had just obtained. Military tribunals, summary punishments. It may as well have been written by Franco himself.\n\nJosep stepped forward from the mass of deriders and strode towards the podium. He saw Abraham's soldiers run towards him from the side and he knew he would have mere seconds. He hoped that the sullenly silent moderates in the room might finally intercede but they sat still as rock. Most averted their eyes.\n\nHe grabbed onto the podium, just as a soldier tried to tackle him. "Traitor," he branded Abraham, as the military man grimaced.\n\nJosep was pulled away and out of the room, shouting his brand at all those who did nothing. The soldiers, the moderates; the cowards. He saw Abraham motion to his side, and soldiers began to push out his protesting comrades."
 SPR_wars.22.a:0 "A dam bursts."

 SPR_wars.23.t:0 "Death or Glory"
 SPR_wars.23.d:0 "At the start of the war many workplaces had sung while they worked. Patriotic songs and songs of labor. The air had been filled with a rhythm of work and hope. Most were silent now. Many of those workers had been sent to the front, and the replacements of the young and old felt deep fatigue and struggled in their tasks.\n\nThere were no songs.\n\nIn the streets there were no more newsboys declaring the new advances of the Republic as they had done in the past. People shuffled past broken and empty buildings. So many had been sent to the front. So many more were dead. Gone were the parades and celebrations that had started the War.\n\nThere were no songs.\n\nIn trenches and dugouts across the frontline, soldiers huddled in their cover. Each man wondered how much the others still believed after watching so many die. They clutched their equipment, in various states of disrepair, and prayed to see tomorrow.\n\nThere were no songs.\n\nInstead of songs, in the heart of every worker, citizen and soldier was a chant. Like a fire, in every move they made they felt the chant get louder. As they thought of the dead, what they had lost and what the enemy still wanted to do to them each heart screamed one thing in union. They remembered their forebears who had fought the same fight and each man and woman understood they fought with them even now, lending them strength with their memory.\n\nTogether all of the Republic chanted silently."
 SPR_wars.23.a:0 ""¡No pasarán!""

 SPR_wars.24.t:0 "Career Opportunities"
 SPR_wars.24.d:0 "They came early, with smiles and a jovial tone. The village didn't see many outsiders, being agricultural primarily and deep in the Spanish countryside. The soldiers that arrived were the talk of the town, at first only immediate townsfolk were there to see them. Soon, many of the nearby residents of farms and remote houses had ventured to the town.\n\nThe soldiers were odd. Their equipment was a mixture of weapons, as was their uniforms. Some had no uniform at all. They claimed to represent the Republic, yet none of them seemed to speak in the military way that they saw on the TV and heard on the radio.\n\nThey reasoned that it was wartime. Soldiers had to live rough and use what they found.\n\nThey spoke of bold fights. Courageous victories and heroes. They spoke of the importance of brotherhood, of collective action against the fascist and the new society they wanted. Some of the young men were enthused, and volunteered when asked as the soldiers promised the world.\n\nThen a man with a list walked to the speaker, with a dour face. He whispered something, and the bright face of the speaker darkened. He said that they had higher hopes of the community, that they would partake in the revolution. Instead they were hiding while letting others fight. There were not enough volunteers. However, all would fight to free Spain.\n\nIn seconds the soldiers surged, grabbing boys and men from their mothers and wives, casting them into trucks. The old and the women who resisted were beaten, to the cries of "Fascist!" by the soldiers.\n\nWithin minutes it was over. The trucks drove away. A silent town remained, with shocked women and the horrified old picking themselves up. Almost half the town had been taken."
 SPR_wars.24.a:0 "How many would come back?"

 SPR_wars.25.t:0 "Hateful"
 SPR_wars.25.d:0 "Diego led his men through the house, clearing it. All they found were bullet holes, a burning smell and dead men. One of Diego's men, an old soldier called Marco, spat on each corpse he found while the others tried to avoid staring at the gruesome sights.\n\nUpstairs, sprawled in one of the bedrooms, was an officer - bleeding out and coughing heavily. Diego doubted he would make it. The officer turned around and simply stared as Diego came through the door, before lifting up a concealed pistol.\n\nThe officer fired one shot, hitting Diego in the arm and the man behind him in the chest, a man called Lorenzo. The officer tried to fire again, but the pistol slide showed he was out of bullets. Diego swore, feeling an anger he hadn't felt before upon seeing his fallen comrade. He kicked the pistol out of the man's hand while his squad checked Lorenzo.\n\n"He's dead," said Marco in a wavering voice. He drew a knife. "The bastard killed him." He began advancing on the Officer, who began to meekly crawl away under the bed.\n\n"Stop Marco," one of the teenage conscripts called Hugo said and placed a hand on his shoulder, "he's defenseless now, don't do it."\n\n"You young boys don't remember the last war, the things these monsters did. They haven't changed." Marco shrugged Hugo's hand away and advanced again on the officer, eyes full of decades of fury. "Sir, get someone to look at your wound, I'll finish him off."\n\n"You can't let him, Sir," said Hugo with pleading eyes, "aren't we meant to be better than this?"\n\nDiego clutched his bleeding arm, his anger and his mercy competing for his favor."
 SPR_wars.25.a:0 "He made his choice, and one man left the room with a dead expression."

 SPR_wars.26.t: "Interrogations in Sevilla"
 SPR_wars.26.d: "A punch to the gut brought Sebastián back to reality he had been so mercifully slipping from.\n\nHe was tied to a chair on the roof of what had once been his apartment building. His face. purple and bloated, let blood trickle unimpeded onto his dirtied shirt. The others in his building, who had worked with him in the Civil Service, had left telling him it was better to risk the streets than stay here. Why didn't he-\n\n"Stay with us now, You've been so helpful to us" his tormenter goaded as he coughed. The voice was soft, at odds with the brutality he was still shaking from his fists. Around them was a collection of stern faced men, all glaring.\n\n"I've said it all, there's no more safehouses for my department" Sebastián mumbled, spitting out a tooth that had painfully but steadfastly hung on his gum. His head pounded and his vision grayed.\n\n"I believe you."\n\n"So you will let me go?" Sebastián looked up. The dim sun was behind his interrogator, his face hidden in the glare and his own failing vision.\n\n"Sevilla was a Republican nest before the war. Still is. Now I don't know if you are one of them, or if you're just some guy trying to get by. Does not matter. Point is, your cooperation has inspired me. Me and my friends, we're gonna vote on it!" He was gleeful, his tongue hung on the edge of a giggle. He gestured to the men, earning a deep laugh from all around.\n\nSebastián tilted his head back. "Vote on what?" he asked meekly."
 SPR_wars.26.a: "Sebastián's ruptured body would lie at the bottom of the building for some days"

 SPR_wars.27.t: "Cádiz Warnings"
 SPR_wars.27.d: "Isabel just sat in the furious twilight looking over the bay on the Avenue de la Bahia, ignoring the acrid stench of Cádiz.\n\nFires roared in the city, licking the sky, with various smaller flames on the water. Slowly those were going out as the sea claimed their fuel, but still enough were illuminated to make out. Silhouettes of wrecks could be made out in the moonlight. Isabel watched them all; she had almost joined them.\n\nWhen word had spread that the Fascists were finally advancing on Cádiz itself, that the N-IV highway was open to them, those final few who had not fled flocked to the boats. Isabel had been alone for some days, her family was buried in their old building. She hadn't known what to do, so she had stayed at a neighbor's house who had been friendly with her family. He was gone. For days she had lived off scraps, her only lifeline being her neighbor's small radio.\n\nThe radio had told her to run for the boats, disregard the danger of the streets and run; but she didn't listen. Fear held her in place. Once she dared to crawl out, once the booms ended, she found the boats were gone. They hadn't got far.\n\nTanks and men were all around the bay, paying her no mind. Soldiers broke into buildings, shot into the air cheering while machines bigger than any Isabel had ever seen before drove past. She didn't look at them. She looked only at the bay.\n\nAll across the bay ships burned. Tiny ships, anything that could float, all had tried to flee; and now they burned. She watched them all night, the smell never wavering as they slipped under the water.\n\nAn announcement played for hours, always on repeat. To all who remained, look upon the water. See the fate of traitors."
 SPR_wars.27.a: ""You will join us in Spain's cause""

 SPR_wars.28.t: "Disappearances in Málaga"
 SPR_wars.28.d: ""Papers? Are you kidding me, papers? Look around you, you fucking idiots. Where the hell am I going to get papers?!"\n\nThe checkpoint was quiet, a crude gate with guards on the Málaga outskirts. Night had fallen and floodlights, so strong that day seemed constant in those areas unlucky enough to be in their beam, burned. The darkness outside their beams was absolute. Before the gate was a car, battered and loaded with possessions attached haphazardly. Its family stood by it nervously, mother and children glancing nervously at the armed soldiers around them, as the father argued.\n\n"Announcements were made. No citizen can leave the interior without a signed authorization form from your addresses' assigned monitoring officer-" explained the checkpoint's officer. His voice was tired, hints of frustration coloured his tone. His eyes stared daggers into the father, who returned the gesture.\n\n"Address? There's nothing left, just this!" the driver kicked the car in emphasis. "Where the hell am I going to get papers, you've blown up half the city you -"\n\n"Ortega, Ruiz, put them under arrest. I won't tolerate this contempt any longer."\n\n"Wh-" Two soldiers came forward. One of them struck the father with the butt of his rifle before dragging him out of the light's beam. It was a hard blow, drawing blood, the father crumpling as though a puppet's strings had been cut, earning a cry from the family. The other soldier walked to the family, drew his weapon, and motioned them to follow him. They timidly walked into the darkness, opposite from where the father had been dragged.\n\nAs the darkness enveloped both parties, the Officer just sighed in relief as he called once more into the inky void."
 SPR_wars.28.a: ""Gil, see if there's anything useful in the car then get it off the road. I don't want this junk there all night""

 SPR_wars.29.t: "Dazed in Barcelona"
 SPR_wars.29.d: "The column slowly trundled down the street, an eclectic procession through the battered city. There was little uniformity, the vehicles all being scavenged from all across the country. Civilian vehicles crudely painted, some not even trucks, loaded with men and supplies slowly trundling through the Barcelona maze. Men walked with the column on both sides, steps unsteady from fatigue.\n\nThe street was barely marked now, brick shadows of buildings all that remained. But even so, every soft settling of rubble, every distant crack drew a worried glance. The city was taken but the ruins weren't safe - the nest was still full of traitors.\n\nTwo of the soldiers following the column stopped, puzzlement overtaking them. Just ahead of them, looking past the moving vehicles and the walking men was a single soldier, sitting on a pile of rubble. His uniform was tattered and unkempt, the face sullen and gray with dust, but the red sash on his arm was unmistakable. A handgun was stuffed into his belt yet he made no attempt to use it. He just watched his sworn enemy shuffle by.\n\n"Hey, hey you!" one of the pair shouted as they strode towards him, readying their rifles at the motionless figure. "Show us your hands, stand up" they bellowed as they arrived, giving his leg a motivating kick, yet the man didn't stir.\n\n"No. Can't leave her," he said, eyes continuing to burn ahead.\n\nThe soldiers glanced at each other before shrugging, a single shot following before they continued on. They left the man's crumpled body where it was, open eyes continuing to stare. They'd seen dozens of his kin in recent days, but he was unique. After all, he wasn't dead when they reached him.\n\n"What the hell was that about?" they idly mused."
 SPR_wars.29.a: "They didn't notice the arm in the rubble across the road; even in death the man's gaze held."

 SPR_wars.30.t: "Final Moments of Girona"
 SPR_wars.30.d: "The heat of hell encased Yolanda, her vision nothing but a haze of orange and black. Coughing, wheezing, and bleeding she stumbled toward the thin light ahead of her. She prayed another spray of fire would not come from it.\n\nBehind was a cacophony of screaming, her comrades begging, pleading, for salvation or a bullet as they burned. Yolanda felt her eyes trying to create tears but the heat stopped them - the hellfire refused anything but pain to exist in that place. But still, she sobbed, clawing for the thin shaft of light before her.\n\nHer vision clouded and her breathing limited, she tripped over obstacles that were burning hot from the heat. Metal-cooked exposed skin as she screamed. Her clothes, little more than a shirt and shorts, threatened to set alight at any moment as she tried to move past the rapidly spreading burning.\n\nBut the light got closer, she screamed and cried for it as she crawled out of the window, falling heavily onto the pavement outside. Her body felt on fire, her legs, exposed from the thigh, looked horrifically burned and her uniform singed - but she'd made it. She praised whatever God had seen her as she coughed and sobbed.\n\n"One of them got out! Tonta, why don't they die?" a voice came from her side, bringing her back to that ruined square. A group of soldiers stood next to an armored vehicle just meters away. The vehicle was still spraying fire into the building, one of a few facing the building.\n\nShe tried to get up to run but her legs couldn't support her. She whined in agony, being able to do little more than crawl with senses red from pain. They laughed behind her, mocking her, and as she turned she saw the vehicle had stopped spraying fire. The nozzle was instead turning toward her. She tried to crawl as fast as she could; now the tears fell."
 SPR_wars.30.a: "Nothing remained of those tears by the end"

 SPR_wars.31.t: "The Spoils of Pamplona"
 SPR_wars.31.d: "They were a sorry bunch, the men starting before the sergeant, however Emilio allowed a smile to cross his face. They held various tools, all would be needed to break the hard earth of the mountains nearby. They swayed in the midday sun, eyes glazed and faces creased in fatigue. A tired man wasn't a rebellious man, and Emilio ran a tight ship with his prisoners, something he prided himself on.\n\nThe idea of their fatigue brought a smile to his face. The terrorists had continued to hound them, preventing the movement of men and supplies across liberated Spain, and now those same terrorists would lay the first stones of the new Spain. Rich in irony, and yet also somewhat heartwarming - even those that betrayed Spain in body and mind could still be part of the national rejuvenation.\n\nEmilio looked at each man in turn. Could he imagine them as a comrade? A brother in the new Spain? If he was honest, he felt no brotherhood with the slouched men standing on parade. In them was no sign of the dignity of Spain, but he conceded their work isn't complete yet. Perhaps their work would develop them into proper citizens.\n\nEmilio stood up from the chair he was lounging in. "Carry on sergeant, you'll be relieved at sunset." A terse nod received the order, and a shrill voice commanded the men to turn and march. Hundreds of men turned and shuffled meekly out of the square towards the distant hills, watched by the amused eye of their Warden.\n\nAfter they had filed out, Emilio meandered to his car, his mind full of paperwork. Lists of procurement, materials and expired prisoners, his own labour would take him deep into the night, much to his chagrin. He sat at the wheel, thinking of the midnight oil he would have to burn. His mind didn't have the chance to comprehend the fireball that erupted once he turned the car key."
 SPR_wars.31.a: "Rejuvenation cannot be stopped, despite the efforts of ants"

 SPR_wars.32.t: "Bilbao Labor"
 SPR_wars.32.d: "The clanging of tools ran around the area, a melody that invaded the workers minds. They were grateful for it however. It masked the sounds of their own labored moans.\n\nMost of them were shirtless, decrepit with sweat and grime. Their last bath was a distant memory, the last fitful sleep a dream. It wasn't particularly hot, but the exertion of the work drove their bodies and minds almost to madness. A fire of fatigue plagued their souls; off the shirts came.\n\nTheir stomachs growled but they barely seemed to register it. They lifted no eyes to the guards who would leisurely patrol the area, or sit on the embankment overlooking them. The ground was rocky, and they wanted to build a road. They were tasked with digging and clearing rocks from the topsoil. To some it had seemed strange, but a few corpses after questions had quelled such naysayers.\n\nWithin these men there was only one real desire; to not stagger. To stagger risked a fall, and a man who falls is a man who disappears. Few could stand up again once they did, it was difficult enough in the mornings - doing so in the workday practically impossible. Such men were dragged away, and they weren't seen again.\n\nThe guards spared no thought for them. Republicans, monarchists, communists, all were united on the long worksite that crested the hill. They found it rather amusing, at first joking that they had finally achieved their United Front. The jokes had died down eventually; monotony had killed them. Monotony had killed almost all their enthusiasm, themselves being little more than a disorganized rabble of former militiamen whose only amusement was the occasional taunting of prisoners.\n\n"How can they give us this assignment," the prisoners sometimes heard them moan as they fanned themselves, "don't they know we're dying out here?""
 SPR_wars.32.a: "All have their part to play in our national enterprise"

 SPR_wars.33.t: "Iconoclasm in Valladolid"
 SPR_wars.33.d: "This city was a den of monarchism, of faith in the alleged King of Spain. Scratch the surface of the city and one could easily find portraits, writings and even opinions in support of the Carlist menace.\n\nWhere was their King now?\n\nThroughout the city streets dotted small bonfires, an orange hue hanging in the sky as they illuminated the city like a beacon. They were in various sizes and held various fuels, but all carried a similar theme - each was an object branded by the monarchy. Be it books, portraits, mementos or, in some cases, monarchists themselves, all were thrown into the fire to cleanse the city of the darkness that had held its citizens' souls.\n\nIn public places around the city, public executions were carried out before muted crowds. All were compelled to look upon a litany of monarchists, some clad in dirt encrusted uniforms, beheaded on stages illuminated by the street beacons. Between each axe swing one statement was read out, appealing to the populace.\n\n"The King has fled, placing himself before the Nation. Is this a man worthy of you?" they said.\n\n"God and King is a fantasy designed to control you, to make you reject reason and progress!" they proselytized.\n\nIt took all night for the city scaffolds to exhaust their supply of condemned and the fires to die, but the citizens saw it all - guards ensured it. Before they were permitted to depart however, came the most important commandment, a message hoped to ignite hope after a night of firm discipline.\n\n"You will reject the darkness, and walk with us into enlightenment". Blood pooled below the scaffolds."
 SPR_wars.33.a: "Men and Machines have no use for Gods or Kings"

 SPR_wars.34.t: "Silence of Oviedo"
 SPR_wars.34.d: ""Attention. This city is now placed under Martial Law by the authority of the legitimate Government of Spain. Follow the instructions of members of the military where they are issued. Make yourselves familiar with the regulations in your area."\n\nThe droning voice sounded across the city, an orchestra of the same addresses blaring from set up loudspeakers all across Oviedo. The voice was monotone, its sound coming in waves as the speaker left unnaturally long pauses between every sentence.\n\nUnder the gray sky the sound seemed to bounce off the still buildings. Few walked the streets, despite it being noon. Only soldiers and the occasional citizen forced upon some errand dared to walk the broken streets. The soldiers wore fierce expressions, looking upon any ununiformed passerby with suspicion and contempt. The citizens kept their faces down, walking quickly and listening to the city-wide voice of their new overseers.\n\nOviedo had been a makeshift fortress before. All the reports had said there was a highly motivated populace, resistant to correction. They were armed and they knew the streets well, everyone had expected a grinding slaughter. The fighting in the outskirts had shown that, and there was a whole city left to take.\n\nSo why risk it? The artillery had spoken and the bombs had been dropped; the spirit was crushed as all that remained was a concrete graveyard. In the chaos of those days many had fled, soldiers and civilians both had run or commandeered any vehicle they could find or take. They chose the anarchy of the countryside over the suicide of the city.\n\nThe loudspeakers spoke all day. Its instructions were to be followed. In many areas of the city, only the breeze shifting the rubble answered it."
 SPR_wars.34.a: "It moved through cracked buildings as a ghost"

 SPR_wars.35.t: "Refugees near Vigo"
 SPR_wars.35.d: "They looked like ants.\n\nA swarm of black specs, sweeping over the rough terrain, farmland long since abandoned. Through the binoculars, their almost pulsating mass looked absurd. How many were there? A hundred? Two hundred? A thousand?\n\nDavid raised his binoculars from his vantage point, a dirt road overlooking the area. Ahead of the fleeing group, a few kilometers perhaps, was a river with some already crossing it. Boats or swimming, safety was cast away it seemed. David lowered his binoculars and turned around.\n\nBehind him trucks idled, drivers and troops leaning against them smoking and procrastinating glumly. They were worn, faces taut and nostrils filled with the stench of exhaust and gasoline. Blackened hands shook slightly for many of them.\n\n"That's the Minho isn't it? Portugal?" David called to one of the men, his driver Jorge. A small man, he glared at David for breaking his reverie and put out his cigarette, dropping it to the ground and stamping on it. He didn't speak, simply nodding while walking to the edge of the road to look at the river.\n\n"We can't allow them to run. Why would they run? Terrorists maybe?" David mused to himself. Jorge grunted, just staring at the rough land and occasional buildings between them and the river. He began to point out other groups, all racing toward the river.\n\n"Hmm, maybe we can't get them all, but we can't just allow fugitives to get away.'' He turned away from Jorge and shouted. "Get ready and load up, we have some ducks to hunt!""
 SPR_wars.35.a: "The trucks drove all around the roads and fields, rifles cracking as they went"

 SPR_wars.36.t: "Power in La Coruña"
 SPR_wars.36.d: "A rather pleasant day, all things considered. The weather hadn't been too inclement and the city generally intact. The guide was reasonably intelligent too. Lucky, given he was just some guy with glasses Esteban had commandeered. A man with a battlefield commission, he had seen his share of ruins in previous months, seeing the detritus of his Spain hurt - a sting that had perforated every battle.\n\nLa Coruña, mercifully, had been spared the fate of too much of Spain's civilization. Most fighting here had been relegated to the outskirts and surrounding settlements, Betanzos suffering the brunt of the assault. The city itself had given up as the perimeter broke.\n\nThe Torre de Hercules, San Nicola Church and the Obelisco dos Cantons had been sublime. As he walked with his guide he had considered himself and this city. La Coruña had seen the last stand against the Napoleonic scourge when the French had raped and looted their way through Northern Spain so long ago. Abandoned by the British, their so-called allies sailed away. Still, Spain had persisted. It was hard not to feel camaraderie with his historical brethren. Were they not the same, facing overwhelming odds for the soul of Spain? Esteban wasn't a great student of history but it seemed self-evident.\n\nEsteban stood by his car with his guide, thanking him profusely for the tour, his driver preparing to depart back to his billet. His unit had some much deserved leave so they would be busy terrorizing some place, perhaps he should join them? The thought made him chuckle. He stepped into his car and he saw his departing guide turn; for just a moment a flash of unease took him. Behind the glasses, he swore he saw contempt. His eyes gave a glare, perhaps? A trick of the light? Why risk it?\n\n"Fidel, that guide seems suspicious. Before we leave, shoot him. Don't worry about the body, someone'll move him""
 SPR_wars.36.a: "He told Fidel to cruise around until he saw a restaurant he liked"

 SPR_wars.37.t: "Food in Valencia"
 SPR_wars.37.d: "Minutes from the Meeting of the Valencia Reconstruction Authority, Dated [REDACTED]\n\nA: "The next item on the agenda is that of food distribution. As you all know, unrest in the surrounding regions has been high. Food for the garrisons and the populace cannot get into the city. So, what shall our position be?"\n\nE: "Still? Didn't we agree to raise patrols last month?"\n\nF: "We did. It had a limited effect, and we have new shipments of Laborers to feed. There isn't enough to keep the current rations."\n\nA: "What is the mood of the soldiers? Can we drop the Laborer rations?"\n\nF: "I wouldn't drop the troop rations, they're already antsy about the previous ones. If we drop the Labor rations any more they won't be able to do much more, might as well shoot them."\n\nJ: "We need to look at this with an eye for practical military necessity. Most of the populace aren't necessary to the rebuilding efforts. Drop their ration. It's empty calories that people earning their keep will need anyway."\n\nA: "Fair point. What's the current ration?"\n\nF: "Around 1500 calories a day for non-essential citizenry, give or take."\n\nA: "I see. [REDACTED], I want you to run the numbers and make a new ration amount that balances the shipments. Can you do that?"\n\nE: "By tomorrow.""
 SPR_wars.37.a: "Within a week, the citizen ration was roughly 800 calories a day"

 #Leader descs
 POLITICS_TORCUATO_FERNANDEZ_MIRANDA_SPR_DESC:0 "At first glance, the leadership of a former member of the Francoist regime appears contrary to the promises made by the Republic to restore democracy and break with the history of the Nationalists. However, considering the circumstances, Fernández-Miranda is arguably exactly what Spain needs.\n\nFernández-Miranda has long been a fellow-traveler of reformists within Iberia, although he had always tended to stay above factional politics. Those who wished for reform had long asked for even the most moderate of measures to be implemented, and yet were consistently denied, even as the Iberian government's own policies clearly led the nation into chaos. Seeing Iberia's inevitable fate, the reformists would declare the Third Spanish Republic, rallying around a democratic future for Spain.\n\nBeing chosen to lead thanks to his relative neutrality and apoliticism, provisionally occupying both the role of President of the Republic and Council of Ministers, unity within the various political movements has been Fernández-Miranda's foremost priority. In this pursuit, the President has avoided voicing any unnecessary personal opinions on politics and policy, serving as a non-partisan figure in the government and allowing his diverse ministers to act with substantial independence. While this has maintained his sought-after unity, it has resulted in a growing sense of frustration with the President's "passive" demeanor, as the line between a neutral and an indecisive leader is thin."
 POLITICS_JOSE_MIGUEL_VEGA_DESC:0 "The military had watched as Iberia fell into chaos. The military continued to watch as civilians with grand ideas had rallied supporters to their causes. The military could no longer stand to watch as those same civilians led their followers into a stagnant, failing campaign, wasting both lives and resources. As the Armed Forces suffered, the Republic's economy soon followed, weakening the Homefront.\n\nThe solution was clear, as regrettable as it might seem. A group of officers and politicians convinced President Fernández-Miranda to step down, and name José Miguel Vega Rodríguez in his place. Vega accepted this responsibility, and reshuffled the Republic's cabinet. No factions were evicted, but the more radical firebrands were given lower posts, and those truly committed to the Republic's victory rose to the top. The Republic's government was now wholly devoted to winning the civil war. That included enacting harsher policies to keep the homefront under control.\n\nHowever, Vega had been genuine in his support for reform, and had been one of the first to join the Republic out of a shared vision for Spain's future. Vega has repeatedly made his intent clear that he will step down and return to military duties once the war is over, and once Spain is stable. It is simply a matter of how quickly those objectives can be achieved. In Vega's eyes, hardship in the present is necessary in order to guarantee Spain's people a bright future."

 ## Civil War Events
 SPR_wars.1.t:0 "Command Collapse"
 SPR_wars.1.d:0 "Luis Pinilla Soliveres waited patiently at his desk as the phone continued to ring, hoping that Manuel Díez-Alegría could still even answer a phone call. Operator service had been dwindling for the past few weeks; more and more dropped calls meant communications were being disrupted across the entire peninsula. He feared such a collapse in communication would precipitate a rout in the armed forces. Finally, the phone clicked.\n\n"Soliveres," crackled Manuel Díez-Alegría from the speaker. "Glad you're still alive, did you get my report from Valencia?"\n\nA chuckle came from Luis, who wiped his brow of stray beads of sweat. "Alive somehow, and I did," he replied. "Another battalion disappearing off the map." He momentarily massaged his temples. They couldn't be rebelling. Another communication disruption, surely. "There's no other way of regaining contact with them? I'll resort to carrier pigeons if I must!"\n\n"Actually, I wanted you to call me about the Balearic General Command. They've been maneuvering without orders for six days commandeering civilian vessels and instituting new patrol routes. It's unwarranted and needless, let alone disobedient."\n\nLuis sighed. "I suppose the officers are finally panicking, taking control of the situation themselves. So much for chain of command." Luis paused as he scanned the emptiness of his office; outside the windows, night had already fallen. "At this rate," muttered Luis with fervent worry, "this will affect re-establishing order.." Another chuckle resonated from the phone's speaker, confusing Luis. After a sigh, Manuel cleared his throat with another crackle."
 SPR_wars.1.a:0 ""You know what it means. It's only a matter of time, Luis.""

 SPR_wars.2.t:0 "Like Father, Like Son"
 SPR_wars.2.d:0 ""Are you not listening to me? There are soldiers out there shooting people! This isn't a game, Diego!" Antonio said as his son set his foot on the doorframe. He had hoped to never have this kind of conversation. He knew Diego had always had fire in his blood, but recently the young man's political convictions had only grown stronger as the political scene became more dangerous and volatile.\n\n"I can't stand by and let the people suffer any longer. We deserve to have our voices heard! I'm not scared of the government's guns, I'm only afraid to let my countrymen down and let history pass me by." Antonio recognized the passionate fury in his son's voice, for he had been the one that had nurtured it. And yet, the danger Diego was putting himself in...\n\n"You are my son, I-"\n\n"And you, my father, are a man who once fought for the Republic, who fought for democracy! When did the dream die for you, huh? "\n\nHis father cast his eyes toward the ground. "The dream's not dead for me, father."\n\nIt was a long couple of minutes after Diego set out into the streets of Alicante alone, silently ruminating on his frustrations, until he suddenly heard a voice from behind him: "Wait, Diego!"\n\nWhen Diego turned, he was shocked to see his father running up to him, his old medals jingling against his jacket, an old roll of fabric draped under one arm. The father and son again regarded each other, and they both shared a soft, understanding smile which lifted a weight off Diego's shoulders. Antonio bashfully scratched his grey beard and silently unfurled the rag, and presented it to Diego, as strong a vote of confidence as he could give to his son;"
 SPR_wars.2.a:0 "It was a Republican tricolor, kept hidden for thirty years."

 SPR_wars.3.t:0 "It's Always Your Own"
 SPR_wars.3.d:0 "The barracks hung in silence before Torres, the men stood at attention maintaining blank expressions as he eyeballed them. He'd called a meeting of the squad leaders but neglected to tell them why. The thought of these men trembling in his presence was the kind of respect Torres reveled in it; their lack of it now annoyed him. How ignorant they were of the threat.\n\n"Here is a pamphlet. Later I will use it to wipe my ass, but it has come to my attention that men across the base may also be in possession of such contraband. I expect all to follow my example; otherwise may God have mercy on your soul because I will leave that man and his squad leader whimpering like a mutt."\n\nThe pamphlet was garish and amateur. "A good soldier doesn't follow orders to open fire on his family! A good soldier protects his own!" loudly cried on its cover. Torres was most angered by the fact that this pamphlet was found in the administration building - under a printer. His own men were trying to pull the rug out from under him!\n\n"Someone wrote this pamphlet," he looked at men picturing each as the traitor with disgust, "and it could even be one of you. He is an idiot. But they did write one truth: A good soldier protects *his own*! Only among the uniforms you see around you, should you regard anyone as your own. Your family are your comrades — your brothers — and me, your father!"\n\n"In that case, I think your daughter might be guilty of incest, Sir!"\n\nThe room erupted in laughter, the blank faces cracking. Torres strode toward the voice, clouded with fantasies of retribution, before hearing the doors crash open behind him. He turned to see uniformed men, their eyes filled with hate and contempt. The squad leaders continued laughing."
 SPR_wars.3.a:0 ""I think that pamphlet is more popular than you think" laughed a squad leader as Torres was swarmed with a yelp"

 SPR_wars.4.t:0 "Spain Will Never Understand Us"
 SPR_wars.4.d:0 "The forest clearing near Sant Martí Vell had been converted into a makeshift operating base remarkably quickly, Ferran reflected, as he absently gazed forward into the depths of the sea of trees. He stood as one of many as they were barked at by their commander. An aged man, some said a veteran from the Civil War, telling of the rebelling local units marching to nearby Girona. Their mission, from God and Iberia, to defend their homes from the marauding traitors.\n\nFerran glanced amongst the men. Around him stood his platoon, mostly fellow Catalans, silently listening to their orders. Catalonia was Ferran's home, their home, and the ongoing chaos of mass mutinies scared them all. The thought of spilling the blood of his brothers and sisters? It terrified him more than the thought of punishment. More than being killed. He clenched his fists, his thoughts filling with family and friends. Perhaps they too marched to Girona.\n\nAs gently as the wind breeze pushed around the canopies, he unslung his rifle. Without leaving a moment for anyone to contemplate his intentions, he blew a hole through his superior's chest. The Spanish officer's words were interrupted by a shocked gasp, his mean expression melting with his denunciations as he staggered back until the trees devoured his corpse.\n\nFerran's squamates flinched, baring their weapons, but most didn't raise their aim at him. The few that did barked commands to drop the weapon but most just stood with weapons ready, looking between Ferran and their comrades demanding his surrender. Ferran stood, unmoving and unspeaking but looking towards the Catalans among the men. Those who had shown their loyalty to Iberia soon felt barrels of cold steel pressed against their necks.\n\nShort bursts of bullets finally disturbed the peace of the forest encampment, followed by a command to dismantle the camp and prepare to march within the hour."
 SPR_wars.4.a:0 "They left the Spanish where they lay for the birds..."
 SPR_wars.4.b:0 "... and the merry band marched to Girona, singing songs of home. "

 SPR_wars.5.t:0 "Discussing Current Events"
 SPR_wars.5.d:0 "The local chapter of the PCE did not advertise its nightly meetings. If they did, they'd all be imprisoned by the next morning. Regardless, the chapter met in the basement of the house of one of their members, which, though cramped, provided the space and privacy the cadre needed, and so everyone that could be trusted to be discreet sat huddled around the yellow light of an old lamp.\n\n"Can you believe it?" one of them said, struggling to maintain a whisper as he almost shook from excitement. "The Basque Country and Portugal have both declared independence! This is our chance!".\n\n"It's great news, for certain, but we can't spring into action without something more concrete on our end. If the other chapters don't give signals, we can't risk it," said another, a cautious father of two. He turned to another member, who had contact with reformist elements in the civil service, "What have you heard?"\n\nThe comrade spoke up, smiling youthfully, "More good news. The government's completely shutting out the advice of the reformists, and they're not taking it well. Attitudes in the city are becoming more radical, things people previously wouldn't have dared to say. People are getting serious." At this the huddled cadre conferred with each other, thrilled with what they heard.\n\nAmongst them, one more comrade stood up and took the floor. "You've all heard the rumor that Party Secretary Santiago Carrillo has returned to Spain?" "Well, when I visited my brother in the city, he said that he spotted Carrillo. His exile is over." Everyone's hearts and minds were racing - each new report was a sign pointing towards a future that at each moment became more tantalizingly possible."
 SPR_wars.5.a:0 "If Carrillo was back, something big was on its way."

 SPR_wars.6.t:0 "Minutes to Midnight"
 SPR_wars.6.d:0 "The meeting hall at the outskirts of Seville was densely packed, with groups of reformists packed in. Discussions on potential concession points with rebel forces had tested relations, but most were willing to concede ground, and beneath the din of blaring sirens and rolling tanks few wished to test their luck with any real infighting.\n\n"...with that in mind, we have to be careful with our considerations here." whispered Yago in regimented form, a grizzled veteran still clinging to an assortment of medals in an ill-fitting military garb. He looked upwards out of reflex, and then back down in a rehearsed motion. "If we move too fast or too intensely with our proposals, it could risk a reaction from the Caudillo."\n\n"I don't see why we have to fear Franco's wrath so intensely here." spoke Cesar, a stout man in his thirties and Chief Editor of a small, regional newspaper known for running on the edge of censorship laws. "At this point, he's the weakest he's ever been since the Civil War. Given recent events, we need to push hard to maintain language rights beyond Spanish."\n\nYago ruminated in thought momentarily. "I hope that I don't...hamstring the manifesto here. We shouldn't make this into a call for complete reform, but there needs to be change."\n\nLooking down, and much younger than either of them, Monica looked with mild derision, before leaning forwards. "I don't need to worry much about Franco. We've seen how weak one Caudillo can be and once we proclaim a republic, he'll be irrelevant."\n\nYago turned to her with shock, but Diniz simply laughed. "Well, I wouldn't normally be as optimistic." He turned towards a typewriter, slamming through an introduction uninterrupted by a few distant gunshots. "But if we don't immediately collapse, a new Republic could very well be an inevitability.""
 SPR_wars.6.a:0 ""Spaniards, Portuguese, and all members of the collapsing Union. The disastrous leadership of Franco has horrified us...""

 SPR_wars.7.t:0 "A Wire Snapped"
 SPR_wars.7.d:0 "SOLIVERES, 17:19: "Hello, who is this?"\n\nGUTIÉRREZ MELLADO, 17:19: "This is Manuel Gutiérrez Mellado. With me is Quintana Lacaci".\n\nSOLIVERES, 17:19: "What do you want to speak about?"\n\nLACACI, 17:19: "It's about Francisco Franco. He's aware of your actions, of you ignoring orders in recent days."\n\nSOLIVERES, 17:20: "I see. Why are you alerting me of this here?"\n\nLACICI, 17:20: "We are military men. Regardless of our personal opinions, our loyalty must be to the Caudillos. However, said Caudillos also have a duty to the country to fulfil themselves, and Franco has failed in fulfilling those aims. I disapprove of you being so forthright, but I don't blame your conclusion."\n\nSOLIVERES, 17:21: "I don't follow, sorry."\n\nGUTIÉRREZ MELLADO, 17:21: "He called an emergency meeting over reports of your reluctance to follow orders. He spent it rambling about treason and duty, calling for purges and reprisals with seemingly no rhyme or reason. These aren't the comments of a measured, reasonable leader."\n\nSOLIVERES, 17:22: "I suppose that's a lesson most of us are learning. But why call me to warn of it?"\n\nGUTIÉRREZ MELLADO, 17:22: "Because we wanted to support you. I feel uncomfortable with these radicals, but if a figure like you is able to hold enough influence, they'll be much better than Franco.""
 SPR_wars.7.a:0 "A wiretap of a meeting quickly sent for higher-ups to consider, and discarded even quicker."

 SPR_wars.8.t:0 "Preparing for the Final Curtain"
 SPR_wars.8.d:0 "The meeting hall was thinned out slightly, but not for a want of support. A few reformists still remained paranoid of potential subversion or discovery, but most had moved past that, and organised openly. As a trio of new faces entered, veterans exiled following the Spanish Civil War proudly emblazoned with Republican memorabilia, a din of noise erupted from reformists and partisans alike.\n\n"This is the perfect time for us to push for serious reform." exclaimed Pío Canabillas, smiling as he struggled against the background noise surrounding him. "Franco may be on his last legs, but we cannot abandon our current progress or caution."\n\nJosé Maldonado strained to hear Canabillas's comments, leaning to his left as he tried to avoid the uproar of a few more excited organisers, but nodding at what he could. "Now is the perfect time for our defeat in 1939 to be avenged. We must restore the Republic, and bring Spain back to a position of strength."\n\nJosé Miguel Vega Rodríguez sat upright, nodding curtly at his comment. "We'll invite as many exiled party officials and soldiers as possible. We should be able to secure a base around Seville itself, and, with the support of militia, we'll likely be able to extend our reach much further."\n\nTorcuato Fernandéz-Miranda sat at the head of the table, smiling warmly as he looked across the room. None were willing to betray their excitement, but even he struggled to fully define the eclectic mix of figures in front of him; a mix of reformists, communists and generals. Suddenly, a few observers standing above them left. Voiceless and nameless, Torcuato nonetheless watched with curiosity before one stopped and called out to the room. "Galicia just declared independence. I support you, but my family lives in La Coruña. I need to help them.""
 SPR_wars.8.a:0 ""Understood. We'll hold down the fort over here.""
 SPR_wars.8.b:0 ""Understood. Blood is thicker than water.""

 SPR_wars.9.t:0 "¡No Pasarán!"
 SPR_wars.9.d:0 "The day was warm and eerily quiet across Sevilla, with the background noise of military maneuvers and attacks mostly silenced. Torcuato Fernández-Miranda had been reassured that it was a sign of their new regional dominance, but he still found the silence, which had been so absent recently, odd. Shaking his fears aside, he stood in front of a small gathering;, a crowd left cautiously optimistic by recent developments. He gave a brief thanks to the bystanders around him, before beginning his speech.\n\n"Francisco Franco has failed Spain. The collapse of the Iberian Union serves only as the final marker of his mismanagement. His failed policies have only led to loss, to the detriment of Spain." He turned to his left. Santiago Carrillo stood proudly, with a discarded wig of deprecated value half falling off the chair. "We must move past his autocratic governance. We must move away from such a strong embrace of the past, and move happily into the future."\n\nHe then looked to his right. Pío Cabanillas clasped his hands behind him, a hint of pride melting over his long face. Behind them, the town hall stood, a mesh of pillars serving as a facade to a building now morphing into a flurry of revolutionary activity. "These coming times will be tough. We face a significant struggle. But, I promise you, it will be worth it. Spain will proudly enter a new, golden era, - one where a person does not have to fear the truncheon in the dead of night."\n\nHe looked forward. The crowd in front of him had grown in optimism and mass, applauding every clause, and were surrounded on either end by a few soldiers, turned towards and away from him in equal measure. "We must fight for a free Spain, one that defeats the corruption and repressions of years past. We must fight for a fair Spain, one where success goes beyond the prestige of a person's heritage or faith. Only together will we be able to liberate Spain. May Madrid become a beating heart of liberty!""
 SPR_wars.9.a:0 ""Long live the union of all anti-fascists!""
