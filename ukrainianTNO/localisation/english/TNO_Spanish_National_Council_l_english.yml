 #Ministers
 FZL_Jose_Luis_Arrese:0 "Хосе Луїс Арресе"
 POLITICS_Jose_Luis_Arrese_DESC:0 ""Я заслуговую на це. Я завжди цього заслуговував."\n\nПіднявшись по спинах колишніх союзників, Хосе Луїс де Арресе пробився на вершину. Виступивши проти Франко, він спершу підтримав Мануеля Еділью, а потім свого рятівника, Серрано Суньєра. Щоразу він виходив сухим із води. Щоразу він укладав угоду. Завжди приємний і покірний, він змовлявся з Франко проти кожного зі своїх покровителів по черзі, ставши секретарем ФЕТ у 40-х роках, а потім виступивши проти свого останнього покровителя, коли той відкинув його.\n\nУсе це принесло свої плоди. За допомогою останнього великого обману Арресе організував підтриманий Німеччиною переворот проти хунти. Нарешті справжній спадкоємець Прімо де Рівери засідає як президент Національної ради повністю фалангістської держави. Самовдоволений успіхом, підтриманий антифранкістськими синерубашечниками та ультракатолик із юності, він нагадає останнім перешкодам на шляху до його влади про християнську цінність справедливого насильства.\n\nПозбавлений усіх паразитів, справжній тоталітарний фаланґізм неодмінно здобуде повну перемогу. І зробить це зі зброєю Райху. Арресе охоче приєднується до Нового порядку, наповнюючи свій уряд радниками й навіть поєднуючи свастику з ярмом і стрілами. Чи то колабораціоніст, чи непримиренний, франкіст чи прихильник Райху, він не перебіжчик; це його власний плащ, хоч би як його вивертали. Однак, зміцнюючи свою владу, відкриваючи шлюзи для німецької допомоги та впливу, він побоюється, що після закінчення війни просто проміняє одного покровителя на іншого."

 FZL_Unorganized: "Неорганізоване керівництво"

 FZL_Serrano_Suner:0 "Рамон Серрано Суньєр"
 FZL_Serrano_Suner_hog_desc:0 "§YГенеральний секретар Фаланги\nФаланґізм§!\n--------------\n§LРамон Серрано Суньєр колись був «Куньядісімо»: «головним зятем» Франко та його правою рукою. Тепер, за жорстокою небесною іронією, він є заступником чоловіка, який зруйнував його мрії у 40-х. Фалангісти, що стоять поза колом прибічників Арресе, закликали його очолити Генеральний секретаріат, прагнучи мати людину, яка ніколи не відхилялася від тоталітаризму, тож старий чоловік стискає ніс заради єдности. Поки що.\n\nФранко, прихильник Райху, «міністр Осі» Суньєр був стриманий суперечливими умовами вступу Іспанії у війну під час своїх дипломатичних листувань. У Германії все ще жива ненависть, яку він породив; Гітлер зневажливо називав його «єзуїтським» і невдячним. Однак тепер, коли Франко немає, а чоботи вже ступили на землю, він виявляється готовнішим до співпраці, ніж Арресе. Тоді, як і тепер, Серрано Суньєр вважає, що Іберія має багато чого запропонувати як рівноправний партнер. І німці це помічають.§!"

 FZL_Jose_Antonio_Giron_De_Velasco:0 "Хосе Антоніо Хірон де Веласко"
 FZL_Jose_Antonio_Giron_De_Velasco_eco_desc:0 "§YМіністр економічних справ\nФаланґізм§!\n--------------\n§LБагаторічний очільник Міністерства праці та видатний союзник Арресе, Хосе Антоніо Хірон де Веласко тепер вирушив у похід за цілком фалангістською економікою. На превеликий жаль небагатьох підприємців, союзних із Радою, він нікого не щадить, і єдиною його перешкодою є сам хаос війни. Сам командир ополчення на зорі режиму, Хірон зробить усе заради своєї «Незавершеної революції».§!"

 FZL_Felipe_Ximenez:0 "Феліпе Хіменес де Сандоваль"
 FZL_Felipe_Ximenez_for_desc:0 "§YМіністр закордонних справ\nФаланґізм§!\n--------------\n§LУчергове кар'єра Феліпе Хіменеса де Сандоваля трималася на висхідній зірці Серрано Суньєра. Призначений головою дипломатичного кабінету міністра закордонних справ Серрано, він став головним помічником міністра. Ця відданість пережила їхню політичну пустелю, чому допоміг спільний винуватець — Арресе. Тепер він посідає міністерську посаду свого наставника та є його ключовим союзником в уряді.\n\nПліч-о-пліч зі своїм начальником Хіменес де Сандоваль проводить дні, підтримуючи та збільшуючи потік військових матеріалів із Німеччини, не зважаючи на жодні закулісні рукостискання. Ба більше, після підвищення Серрано він став національним делегатом Закордонної служби Фаланги та членом Іспанської ради, і тепер використовує цей досвід, щоб відновити зв'язки з ультраправими Латинської Америки. Він прагне відновлення Ради, щоб місце Іспанії як духовної осі іспаномовного світу могло бути реалізоване.§!"

 FZL_Agustin_Aznar: "Агустін Аснар"
 FZL_Agustin_Aznar_sec_desc:" "§YСекретар у справах війни\nФаланґізм§!\n--------------\n§LАгустін Аснар Гернер, хоча й відомий своїм радикальним фаланґізмом, однак є ідеальним кандидатом для демонстрації сили у військовий час, оскільки вважається нейтральним голосом у протистоянні між Арресе та Суньєром. Присутність жодного з них наразі не дасть переваги іншому.\n\nЗамість участи в палацових боротьбах Гернер зосередився на залученні досвіду з Германії, щоб сформувати іспанську армію за зразком сил своєї улюбленої світової держави й таким чином принести грім над Іспанією, сповіщаючи про завершення війни.§!"

 FZL_Antonio_Garcia:0 "Антоніо Ґарсія Наварро"
 FZL_Miguel_Ezquerra:0 "Міґель Ескера"

 #National Spirits 
 FZL_bloodied_administration:0 "Закривавлена адміністрація"
 FZL_bloodied_administration_desc:0 "Хоча переворот із метою усунення хунти та встановлення фалангістського уряду був успішним, він створив для Національної ради ще кілька проблем, із якими довелося розбиратися. Під час хаосу карлісти захопили контроль над частиною території, проголосивши конкуруючий уряд.\n\nКрім того, кількох урядовців із антифалангістськими настроями довелося усунути, щоб забезпечити лояльність. Їхня заміна не відбувається миттєво, і ці чистки звели роботу адміністрації до повзання, доки не буде знайдено придатних замінників."

 FZL_germany_footsteps:0 "Слідами Німеччини"
 FZL_germany_footsteps_desc:0 "Іспанська національна рада давно прагнула наслідувати приклад Третього Райху. Підтримка нацистами фалангістів була не лише матеріальною допомогою справі, а й принесла німецькі політичні, економічні та адміністративні нововведення, які Рада сповнена рішучости застосувати як засіб створення світлішого майбутнього. Німецька воєнна економіка одночасно мобілізувала мільйони людей, створивши найпотужнішу військову силу, яку коли-небудь бачила світова історія, та її найдинамічнішу економіку; саме цю модель Рада прагнутиме наслідувати. Чи можна успішно впровадити методи, використані в Німеччині для консолідації влади тридцять років тому, в сучасній Іберії, невідомо, зважаючи на порівняно обмежені простір, ресурси та інституційну підтримку, якими володіє Рада. Попри це, міністр Веласко та міністр оборони Аснар не відступають. Іберія готова для захоплення. Фалангістське суспільство має бути побудоване!"

 #Tree
 FZL_one_final_chance_of_salvation:0 "Останній шанс на спасіння"
 FZL_one_final_chance_of_salvation_desc:0 "Національна хунта вважала себе багато чим. Рятівницею Іспанії, навіть Іберії, далекоглядним рухом, який захистить Іспанію від облоги.\n\nТепер майже очевидно, що Національна хунта зазнала невдачі. Обіцянки Національної хунти провалилися, залишивши нашу націю на межі краху — але там, де над Іспанією пробивається світанок, світло також осяює вирішення проблеми. Переворот Фаланги довів свою необхідність для відновлення порядку та стабільности, але опозиція й вороги все ще підривають нашу єдність і суверенітет.\n\nЛише непохитна рішучість і незламна відданість, а також верховенство волі, дозволять нам постати з попелу й викувати нову Велику Іспанію."
 FZL_one_final_chance_of_salvation_tt:0 "§rЯ фалангіст, фалангіст до самої смерти або перемоги.§!"

 FZL_the_party_above_all:0 "Партія понад усе"
 FZL_the_party_above_all_desc:0 "Партія представляє вершину нашого руху та авангард нашої ідеологічної боротьби — інтеліґенцію, яка визначає напрямок нашого руху. З огляду на дедалі нагальнішу потребу централізувати панування Партії в державі, ми не повинні забувати скористатися цією чудовою можливістю, щоб об'єднати партійні інституції Фаланги з державними та укорінити Фалангу, безпосередньо пов'язавши її долю з долею Іспанії.\n\nЗвісно, це матиме наслідки для всіх органів іспанського уряду, і найнагальнішим для нас буде політизація війська. Як сказав Александр — армія овець, яку веде лев, сильніша за армію левів, яку ведуть вівці, і ідеологічний фанатизм Фаланги має відігравати більшу роль у доктрині нашої військової стратегії."

 FZL_spanish_national_socialism:0 "Іспанський націонал-синдикалізм"
 FZL_spanish_national_socialism_desc:0 "Покоління спроб умилостивити франкістські амбіції призвело до занепаду ідеалів Фаланги — ціни, яку патріотичні іспанські праві заплатили заради національної єдности. Якою б необхідною не була терпимість до его Каудильйо після останньої громадянської війни, досить, і настав час силам найвідданіших націоналістів Іспанії скасувати цю образу її честі та відновити її право повернути собі славу.\n\nНе дивно, що Фаланга знову знаходить союзника в Третьому Райху, адже Батьківщина пройшла довгий шлях від часів інституційного застою, за яким послідувала власна громадянська війна. Однак наслідування ідеології Райху не є метою; натомість повернення до доктринальних коренів нашої ідеології, повернення до націонал-синдикалізму, стане шляхом, який приведе до національного відродження."

 FZL_la_comunidad_popular:0 "Ла Комунідад Популар"
 FZL_la_comunidad_popular_desc:0 "Цілком очевидно, що Іберійський союз зробив далеко недостатньо для примирення між суспільними класами, у чому ми, ймовірно, також можемо звинуватити байдужість Каудильйо Франко та Салазара. Нестерпно, що соціялісти та інші повстанці так проникли в іспанське суспільство, тож необхідно розглянути програму запровадження та примусового забезпечення національної єдности між суспільними верствами Іспанії.\n\nНімецька концепція Фольксґемайншафт могла виникнути ще під час Першої світової війни, але саме гітлерівський режим наступних десятиліть прийняв її всіма силами. Хоча іспанська культура надто фундаментально космополітична, щоб із таким самим завзяттям прийняти нацистську расову ідеологію, структура для організації суспільства на основі здібностей, власности чи професії без класового конфлікту — Ла Комунідад Популар — це те, що цілком може бути застосоване в новій Іспанії."

 FZL_national_cleansing:0 "Національне очищення"
 FZL_national_cleansing_desc:0 "Хоча ідеали фалангістської революції мають першорядне значення, елементи, які приведуть до національного відродження, значно менш відірвані від реальности. Якщо у вас є лише молоток, кожна проблема здається цвяхом. Оскільки повстанські фракції по всьому півострову кожна являє собою давню скалку в боці іспанських правих, більш грубий підхід до забезпечення національного спасіння вже здійснюється.\n\nБеручи приклад із чорносорочечників і коричневосорочечників, синерубашечникам Фаланги буде надано позасудові повноваження для виявлення зрадників у тилу. Отримавши від уряду зелене світло в рамках кампанії проти опозиції, синерубашечники матимуть повноваження здійснювати затримання, проводити суди та виконувати негайні страти всіх, кого вважатимуть загрозою національній революції."
 
 FZL_saving_spain_from_itself:0 "Врятувати Іспанію від самої себе"
 FZL_saving_spain_from_itself_desc:0 "Що ще можна сказати про занепад Іспанії від статусу світової держави, чого вже не було сказано? Колись шанована нація, яка свого часу називала майже весь Новий Світ своєю імперією, була принижена колоніяльними потрясіннями та американським проникненням і осоромлена декадентством Республіки. Навіть Франсіско Франко, колись вважаний титаном європейської гегемонії та рятівником Іспанії, виявився надто безсилим, щоб зробити необхідне й відтягнути Іберію від краю прірви.\n\nМи не дозволимо слабкості перетворити прекрасну Еспанью на нового хворого чоловіка Європи, доки бодай один чоловік Фаланги дихає. Режим Іспанської ради не шукатиме виправдань і не робитиме винятків для тих, кого вважає найбільш винними у зраді іспанської нації, а всі вороги незабаром будуть назавжди випалені з іберійської землі."

 FZL_all_will_be_in_agreement:0 "Усі будуть згодні"
 FZL_all_will_be_in_agreement_desc:0 "Справжня причина провалу іберійського експерименту полягає не лише в самовдоволенні Каудильйо чи правлячої бюрократії, а й у свідомості мас, які їм не вдалося належним чином контролювати. Інакше як соціялістичні агітатори та республіканські зрадники змогли б залучити таку значну частину населення навіть через покоління після останньої громадянської війни?\n\nНе існує засобу досягнення мети, який не можна було б розглянути, і не буде покарання за протидію національному відродженню, яке залишиться безкарним. Триваюча пропагандистська війна проти войовничости повстанців лише посилюватиметься в міру наближення війни до завершення, як і покарання для тих, хто стає на шляху її неминучих переможців."

 FZL_they_will_have_to_learn:0 "Покоління Фаланги"
 FZL_they_will_have_to_learn_desc:0 "Друга громадянська війна поволі добігає кінця, але ще одне покоління іспанських дітей було змушене побачити, як їхні батьки або гинуть, або отримують незворотні травми в конфлікті, ще жорстокішому за попередній. У житті горе є такою ж жорстокістю, як і неминучою частиною людського існування. Але такі величезні страждання здатні сприяти... здоровому переосмисленню уявлень про суспільство.\n\nОскільки так багато іспанської молоді залишилося сиротами або без функціональної батьківської фігури, яка могла б їх спрямовувати, обов'язком іспанської нації є дати заблукалій молоді можливість виховати глибоку відданість нації, за яку загинули їхні батьки. Фаланга вже розробляє програму розширення доступу до освіти для нового покоління іспанських дітей, яка включатиме методику збереження націоналістичного духу в їхніх серцях, щоб вони якомога краще відповідали веденню державних справ."

 FZL_and_only_the_spanish_will_remain:0 "Залишаться лише іспанці"
 FZL_and_only_the_spanish_will_remain_desc:0 "У міру того як громадянська війна стрімко наближається до завершення, терпіння Фаланги щодо всіх, хто наважується їй протистояти, також вичерпується. Хто ще серед повстанців залишився, щоб кинути виклик Новій Іспанії? Що повзає серед уламків і руїн, намагаючись повалити все, що ми так тяжко працювали побудувати?\n\nНерелевантність — найгірше з усіх тавр, що можуть заразити народ Нової Іспанії.\n\nПовстанцям тепер майже нічого захищати, громадянська війна вже практично завершилася. Але так само, як Німеччина дала урок тим, хто прагнув завдати їй шкоди, нація Еспаньї також повинна застосувати подібний засіб проти пошесті нерелевантности. Чи то кайданами й ланцюгами, чи кулею та петлею, Іспанія та її діти нарешті будуть чистими."

 FZL_and_they_will_know_their_place:0 "Знайте своє місце"
 FZL_and_they_will_know_their_place_desc:0 "Кожен має пам'ятати, що саме відсутність стабільности та безпеки призвела до загибелі Іберійського союзу. Повстання басків — хоч і здавалося локалізованим бунтом — продемонструвало гниль, на якій стояв Іберійський союз, і це швидко переросло у пожежу, в якій ми опинилися сьогодні.\n\nНам варто не повторювати помилок старого Союзу, тримаючи народ на короткому повідку, адже те, що сталося, чітко показало: необхідно встановити ще кілька засобів контролю. Закладення основ для посиленого нагляду та поліцейського контролю здається одним із найпростіших доступних рішень. Громадянська війна дала нам безліч виправдань для побудови апарату більш тоталітарного режиму — зрештою, іспанці більш ніж раді пожертвувати кількома особистими свободами заради власної безпеки та життя, чи не так?"

 FZL_reconvene_falange:0 "Відновити Фалангу"
 FZL_reconvene_falange_desc:0 "Небагато хто в наших лавах сьогодні пам'ятає Іспанську Фалангу такою, якою вона була в 1933 році — році її заснування.\n\nПрімо де Рівера, засновник, постав перед нами як месія, що мав місію врятувати Іспанію. Хоча його життя було обірване гнилою Республікою, яку він прагнув повалити, зрештою Фаланга захопила свою долю в усій Іспанії, а невдовзі об'єдналася з Португалією, утворивши Іберійський союз.\n\nОднак не можна заперечувати, що на цьому шляху ідеологія Фаланги була розмита під правлінням Каудильйо — Франко та Салазара. У цьому процесі Фаланга об'єдналася з різними іншими реакційними силами, утворивши єдиний фронт проти головного ворога: клятих республіканців та їхніх юдео-большевицьких покровителів. Зрештою це призвело до змішання основоположної ідеології Фаланги, перетворивши колись укорінений фашистський рух на ідеологію, яка зрештою призвела до краху Союзу.\n\nДля Фаланги більше не може бути прийнятним такий стан речей. Якщо ми маємо прийняти свою долю як авангард і рятівник усієї Іспанії, ми повинні повернутися до того, що спочатку привело нас до перемоги."

 FZL_a_phone_call_to_germania:0 "Телефонний дзвінок до Германії"
 FZL_a_phone_call_to_germania_desc:0 "Наші німецькі товариші під час початкової громадянської війни передали нам низку технологій. Пікірувальні бомбардувальники, кулемети — усе, що дала нам Легіон «Кондор». Тепер, коли ми знову опинилися в громадянській війні, ми повинні звернутися до того, що спочатку принесло нам перемогу.\n\nХоча ми, безперечно, не можемо поводитися як нужденні й просити Німеччину про масштабну військову допомогу, було б мудро нагадати їм про нашу спільну ідеологічну долю та про те, що наші цілі переплетені. Продемонструвавши, що наша перемога була б для них надзвичайно сприятливим результатом, ми можемо переконати їх підтримати нашу справу.\n\nТак само, як вони зробили кілька десятиліть тому, з невеликою часткою німецької магії ми цілком можемо знову бути на шляху до відновлення нашого панування над Іберією."

 FZL_a_national_push:0 "Національний ривок"
 FZL_a_national_push_desc:0 "Хоча німці є всесвітньо відомою державою, яка започаткувала багато ідей і технологій, якщо є щось, що нам варто в них перейняти, то це їхні методи ведення війни та економічної організації. Після заклику їхнього далекоглядного доктора Ґеббельса до тотальної війни — Totalen Krieg — німці по всьому Райху одразу ж реорганізували всю свою економіку, відмовившись від споживацьких розкошів заради свого Endsieg. Усе це досягло кульмінації після кількох виснажливих і довгих років боротьби проти юдео-большевицької змії на сході та гедоністичного капіталістичного щура на заході, яку вони вели мечем, названим бліцкриґом.\n\nМи можемо багато чого перейняти у наших німецьких товаришів, якщо вивчимо їхні методи. Негайно звернімося до німецької літератури та німецької методології, адже результати не лише багатообіцяльні, а й довели свою ефективність у нищенні ворогів Іспанії всюди."

 FZL_the_national_army_takes_shape:0 "Національна армія набуває форми"
 FZL_the_national_army_takes_shape_desc:0 "Німецька армія продемонструвала значний подвиг доблести своїми безсмертними діяннями в останній Великій війні. Як їй це вдалося проти орд червоних та юдейських шпигунів? Саме відданість і усвідомлення своєї ідеологічної спадщини підтримували бойовий дух німецьких солдатів — і цього вони досягли завдяки політичним комісарам, які постійно контролювали ідеологічну відданість їхніх офіцерів та солдатів. Очевидно, що реорганізація війська для запровадження подібних структур і методів, щоб узгодити його з німецькими, була б для нас найнадійнішим шляхом до успіху.\n\nПідривні елементи зринали на кожному кроці — зрештою, саме вони кинули Союз у хаос. Сподіваємося, що, міцно закарбувавши ідеологію в нашому війську, ми зможемо назавжди запобігти повторенню такої катастрофи."

 FZL_total_war_economy:0 "Економіка тотальної війни"
 FZL_total_war_economy_desc:0 "У часи відчаю потрібно розглядати всі варіанти, і ніщо не можна вважати немислимим. Хоча цивільний сектор протестуватиме й обурюватиметься нашим рішенням, стає очевидно, що для контролю над економікою необхідно застосувати жорсткішу руку, яким би непопулярним це не виявилося серед чоловіків і жінок, що залишилися за лінією фронту.\n\nТож ми змушені ухвалити рішення спрямувати всі ті мізерні ресурси, якими володіємо, на наші воєнні зусилля. Нормування продовольства та товарів повсякденного вжитку буде необхідним для контролю споживання, і хоча це неодмінно викличе протести серед нашого народу, іншого вибору в нас немає."

 FZL_saving_spain_from_its_enemies:0 "Врятувати Іспанію від її ворогів"
 FZL_saving_spain_from_its_enemies_desc:0 "Світ змовляється проти Іспанії... Зрештою, чим іще можна пояснити низку нещасть і трагедій, які спіткали Іберію? Хоча наші перші дні після пронунсіам'єнто були тріумфальними в славі нашої перемоги, тепер ми опинилися самі після того, як підступні італійці залишили нас у темряві, поки ми поволі продовжували розпадатися. Іноземні сили, мов стерв'ятники, кинулися вниз і скористалися нагодою, щоб утвердити свої інтереси в Іберії — вороги, з якими ми боремося зараз, є тими самими іноземними маріонетками, які прагнуть втягнути нас у нову сферу впливу.\n\nНаші дії виправдовують самі себе... Зрештою, якщо наші вороги грають нечесно, ми не можемо прибирати жодної карти зі столу."

 FZL_taking_lessons_from_german_industry:0 "Уроки німецької промисловости"
 FZL_taking_lessons_from_german_industry_desc:0 "Раз по раз доводилося, що німецька промисловість є найкращою у світі — хоча це не обов'язково проявлялося у виборі вироблюваного спорядження, її промислова доктрина допомогла досягти необхідного балансу для забезпечення їхньої військової кампанії.\n\nНімецька трудова дисципліна сувора, жорстока й непохитна, так само як наша власна відданість новій Великій Іспанії. Щоб відповідати їй, ми переймемо цю саму дисципліну та завзяття, які можуть по-справжньому конкурувати з нашими північними наставниками, а це означає більшу централізацію та впорядкування наших засобів виробництва, а також ліквідацію існуючих роздутих механізмів і бюрократій, які нічого не робили, окрім як паралізували наші зусилля."

 FZL_not_taking_one_step_back:0 "Ставайте до строю"
 FZL_not_taking_one_step_back_desc:0 "Хоча ми воліли б іншого, надійшли звіти з великим і вичерпним масивом статистики про нашу чисельність, що несуть жахливі новини — хоча кількість зібраних нами чоловіків, безумовно, виглядає вражаючою, зважаючи на мізерні ресурси та землі, якими ми володіємо, реальність така, що результати на полі бою були вкрай неефективними, якщо звіти правдиві.\n\nІ хоча деякі наші чоловіки хоробро продемонстрували свою гідність перед іспанською нацією, інші були... м'яко кажучи, недостатніми. Ми терпіли їхню дурість набагато довше, ніж слід було. Необхідно вжити значно жорсткіших заходів, якщо ми справді хочемо продемонструвати нашу нетерпимість до їхнього цілковитого, некомпетентного безглуздя.\n\nЗрадники, боягузи та некомпетентні — їм краще пригнути голови, якщо не заради Іспанії, то заради власного життя."

 FZL_and_some_may_be_controversial:0 "Вирішення трудової проблеми"
 FZL_and_some_may_be_controversial_desc:0 "На тлі пожежі, що охопила Піренейський півострів, ми виявили, що наша робоча сила серйозно підірвана, оскільки мобілізувати й організувати кваліфікованих робітників у районах, що перебувають під нашим безпосереднім контролем, стало на порядок складніше. Водночас нагальна потреба в ще більшій промисловій мобілізації для забезпечення виживання та безперервности наших воєнних зусиль досягла безпрецедентно важкого рівня.\n\nДля цього ми максимально збільшимо промислове виробництво шляхом масового запровадження примусової праці по всьому військово-промисловому сектору. Різноманітні підневільні працівники — від засуджених, які відбувають покарання за злочини, що не передбачають смертної кари, до полонених із ворожих фракцій — дозволять нам залучити ще більшу кількість робочої сили для зміцнення наших стратегічних галузей.\n\nБез сумніву, це зустріне опір уже неспокійного населення, обуреного нашим посиленням контролю над його засобами до існування. Однак мета виправдовує засоби — а наша справа є метою, виправданою нашою боротьбою."
 
 FZL_and_the_people_clamor_to_join:0 "Дух вестґотів"
 FZL_and_the_people_clamor_to_join_desc:0 "У часи пізньої античности давнє германське плем'я, відоме як вестґоти, з'явилося на Балканах, а згодом прибуло на Піренейський півострів. Природжений народ воїнів, спочатку вони воювали за Римську імперію, але згодом розірвали зв'язки зі своїми римськими сюзеренами, посприявши нищівній вирішальній поразці римлян під Адріанополем.\n\nХоча вестґоти зрештою зустріли свою загибель від рук арабів, до того вони встигли закласти підвалини того, що згодом стало сучасним іспанським народом і культурою. Їхня культура та їхня кров живуть і течуть у нас, іспанському народі, — і ми маємо безліч військових подвигів, які це доводять. Сьогодні, однак, іспанці забули своє давнє кредо народу-воїна, а традиції вестґотів із плином часу згасли.\n\nМи відродимо нашу спадщину народу-воїна, централізувавши військо в нашій новій іспанській культурі та розгорнувши масштабну пропагандистську кампанію, щоб закарбувати це в серцях нашого народу. Як спартанці й як вестґоти, ми єдині й нас багато — і нехай усі іспанці, як і наші вороги, знають, що це правда."

 FZL_sin_relevo_posible_hasta_la_extincin:0 "Sin Relevo Posible, Hasta La Extinción"
 FZL_sin_relevo_posible_hasta_la_extincin_desc:0 "Перемога ще ніколи не була так близько, але ми не повинні святкувати надто рано. Навколо нас наші вороги продовжують падати, а ті, хто становить екзистенційну загрозу нашому майбутньому, незабаром зникнуть. Завдавши останнього удару, ми завдамо їм вирішальної поразки — але для цього нам потрібна ще більша відданість і самозаспокоєність народу.\n\nПроведімо останню велику кампанію на внутрішньому фронті, щоб заручитися підтримкою, необхідною для перемоги. Іспанський народ жадає довгоочікуваного тріумфу над большевицькою наволоччю, зрадниками та іншими силами, що залишаються в темряві, і, заручившись їхньою обіцянкою віддати всі сили, ми нарешті зможемо знищити їх раз і назавжди."

 #Events 
 FZL_wars.1.t:0 "Книжковий клуб"
 FZL_wars.1.d:0 "Хосе Луїс де Арресе сидів у своєму маленькому фалангістському книжковому клубі. Стільці були присунуті до його офісного столу, час від часу чувся звук чиїхось записів, коли чоловіки кивали головами, мов псевдофілософи. Поміж блокнотами лежало безліч примірників нацистської літератури — від загальновідомої «Майн Кампф» до більш маловідомих праць. Час від часу вони виділяли цікавий уривок, викреслюючи решту.\n\nБула певна енергія, яку він прагнув відтворити, — чужоземний дух, який Арресе хотів принести до Іберії. У цьому й полягала чудова річ у читанні ідеології такого чоловіка, як Гітлер: можна було взяти лише найкорисніші аспекти його дивної, мутованої версії фашизму, відкинувши решту, наче садівник, що вибирає здорові плоди з гнилих.\n\nОдним із таких гнилих плодів була його зневага до римо-католицизму. Цього вони не могли залишити. Звичайно, ні. Іберія була католицькою нацією (Німеччина мала бути протестантською, але та гілка була штучною й створеною людиною). «Майн Кампф» не стане їхньою Біблією. У них уже була справжня.\n\nАле, кажіть що хочете про нацистів, вони були ефективними. Гітлер був не просто політиком, а скам'янілим утіленням німецької волі: справжнім лідером — Фюрером. Він майже вважав Канцлера радше явищем, ніж людиною (попри те, що зустрічався з ним). Чи міг їхній Лідер зрівнятися з ним? А якщо ні, то як зробити так, щоб зрівнявся?\n\nАрресе відкинувся на спинку крісла — жорстка шкіра заскрипіла під ним. «Запам'ятайте це, друзі», — Хосе сприйняв це як імпровізовану перерву від дрібних чорних літер, потираючи очі. «Ми не німці. Ми не італійці.»"
 FZL_wars.1.a:0 ""Ми іспанці.""

 FZL_wars.2.t:0 "Очі до сонця"
 FZL_wars.2.d:0 "Ранкове сонце відкидало довгі тіні на подвір'я, коли діти вишикувалися в охайні ряди в межах ранкового ритуалу. Декого з них захоплювала нова, свіжа військова форма, тоді як інші смикали свої жорсткі чорні коміри та червоні пов'язки, які завжди здавалися трохи затісними. Незалежно від того, на чиєму боці вони були, усі моторошно завмерли, коли з гучномовця почала верещати «Cara al Sol».\n\nЦе був сигнал для змученого на вигляд учителя підійти до основи флагштока зі складеним прапором. Ніхто особливо не звертав уваги на стовп, поки його встановлювали, але, мабуть, це тому, що флагшток без прапора — лише велика металева палиця. Діти мовчки дивилися, не відриваючи очей від прапора, який поволі розгортався під час підйому — червоно-золото-червоний на тлі свіжого ранкового неба.\n\nВони намагалися — і не змогли — одночасно підняти руки, утворивши безладне море тремтливих фашистських вітань. Принаймні половина дітей використовувала витягнуті долоні лише для того, щоб прикрити обличчя від палючого сонця, тоді як решта тримала їх просто над ніжними очима. Коли останні ноти гімну стихли, пролунало кілька полегшених зітхань; для дитини три хвилини нерухомого стояння можуть здаватися вічністю.\n\nНастрій залишався офіційним, коли учні заходили до школи під пильними поглядами вчителів. У кожному класі плакати із зображеннями Хосе Луїса Арресе та Прімо де Рівери, що висіли на стіні, вимагали їхньої уваги. Звичайно, більшість із них не знала, хто з цих старих був Хосе, а хто Прімо, але вони, мабуть, були важливими."
 FZL_wars.2.a:0 "Кольорові фотографії були значно якіснішими за ті, які могли дозволити собі їхні батьки."

 FZL_wars.3.t:0 "Бійтеся цензора"
 FZL_wars.3.d:0 "Тьмяна, вицвіла офісна лампа лише частково освітлювала стіл цензора, який старанно записував долі кількох вибраних літературних творів, знайдених у підпільному обігу. У більшості випадків вимагалася заборона; спалення, допити власників, усе це випробування. Після годин тихої роботи він нарешті дістався останнього твору: книги, яка широко розповсюджувалася серед підпільних осередків опору і була нещодавно конфіскована під час звичайного рейду в нетрях Сараґоси.\n\nЦензор перегортав кожну сторінку, відзначаючи все цікаве, що потрапляло йому на очі, — чи то відомості про окремих осіб, чи тему, якої вона стосувалася. Це був звичайний сепаратистський трактат, приправлений комуністичним духом, який атакував суспільну мораль і підривав авторитет Національної ради. Цікаво, що в його конкретному примірнику кілька імен були закреслені чорним маркером, без сумніву, остання спроба захистити особи, які входили до тієї структури командування, на яку натякала книга.\n\nВисновок був однозначним. Потрібна була повна заборона цього видання, усі вилучені примірники мали бути спалені, а щодо будь-яких примірників, які все ще перебували в обігу, слід було оголосити активний розшук. Перед тим як закрити звіт на ніч, цензор залишив запис із наказом скласти список власників цього твору для подальших допитів. Зрештою, такі повстанські наративи навряд чи існували у вакуумі; там, де можна знайти одного, за достатньої наполегливости та людських ресурсів можна розкопати безліч інших."
 FZL_wars.3.a:0 "Чого вони не знають, того не можуть боятися."

 FZL_wars.4.t:0 "Мовчазний мандат"
 FZL_wars.4.d:0 "Одного разу Арресе навчили певної хитрощі. Простого мовчання під час виходу на трибуну було достатньо, щоб скам'яніла зала — щоб зберегти її напруженість. Раніше він у це не вірив, але в повітрі відчувалася майже матеріальна енергія, поки численні обличчя чекали на його вердикт.\n\n«Ми стали слухняними», — нарешті заговорив чоловік, оглядаючи членів Ради Фаланги. «Можливо, цього й слід було очікувати. Можливо, це доля кожної великої держави». Він нахилився до трибуни, дозволяючи брудному білому світлу, що лилося згори, осявати його обличчя. «Але я хочу, щоб кожен політик і солдат — кожен чоловік, присутній тут, — зрозумів: це не війна за сфери впливу, ресурси чи гордість. Це не якийсь далекий конфлікт, який ми можемо ігнорувати».\n\nЩе одна розрахована пауза захопила залу. «Востаннє наш спосіб життя зазнавав такої екзистенційної загрози під час громадянської війни». Для багатьох чоловіків 1936–1939 роки були лише темою для розмов. Для Хосе вони були далекою реальністю, що римувалася з їхніми недавніми бідами. «Тож я кажу: це війна за виживання».\n\nКоли натовп вибухнув оваціями, Арресе дозволив своєму обличчю пом'якшитися, набувши вигляду батька, який ось-ось повідомить погані новини. «І саме тому ми повинні мобілізувати як військо, так і економіку». За сигналом пролунали неспокійні гримаси та незграбне потирання рук. «З мого досвіду, завжди важко переконати народ вкладати кошти в армію», — він похитав головою, немов розмірковуючи вголос. «Чому? Тому що армія — як здоров'я. Ви розумієте її цінність лише після того, як вона вас підведе». Глибоко вдихнувши, чоловік міцно поклав руки на трибуну.\n\n"
 FZL_wars.4.a:0 ""Це не та війна, яку можна програти. Невже ви не розумієте?""

 FZL_wars.5.t:0 "" #Наразі не використовується
 FZL_wars.5.d:0 ""
 FZL_wars.5.a:0 ""

 FZL_wars.6.t:0 "Спартак"
 FZL_wars.6.d:0 "Сонце зникло.\n\nНавколо покинутої автомагістралі світ був сірим, над небом, здавалося, навис мертвий шар хмар. Дощу не було, але здавалося, ніби світ затамував подих перед бурею. Панувала тиша; жодної машини не було видно.\n\nПоволі сім'я рухалася розбитою автомагістраллю з жалюгідним візком і мізерними припасами. Порожнеча тривожила їх, але вони продовжували йти. Зупинитися означало померти, їхні нервові очі бігали за кожним звуком. Проте такі явища були рідкісними — навіть тварини, здавалося, покинули ці місця. Лише холодний вітер, що час від часу пролітав повз, свідчив про те, що у світі ще є життя.\n\nЗа винятком випадкової паніки, коли легкий вітерець зрушував камінь або неочікувано рипів рідкісний візок, вони не відривали очей від землі. Упродовж усіх своїх днів, тижнів ходи вони отримували мало новин про перебіг війни. Питання їжі та безпеки мали значно вищий пріоритет, поки вони тулилися в будь-яких імпровізованих укриттях, які могли знайти. У спустошеній сільській місцевості такі речі ставали дедалі рідкіснішими.\n\nНаймолодший у сім'ї впав — на мить спіткнувся, бо виснажений розум охопило запаморочення. Він лежав приголомшений якусь мить, а коли знову підвівся, був змушений поглянути на свою аудиторію — на очі, які стежили за ними протягом багатьох миль.\n\nНа кожному ліхтарному стовпі, що простягалися далеко в обидва боки, з шиї висіли тіла. Деякі носили символи Республіки. Деякі — символи соціялістів. Інші навіть носили символ так званого короля. На кожній шиї висіла табличка, табличка, яку вся сім'я намагалася не помічати, просуваючись уперед. Вони не знали, хто їх повісив, але все одно боялися їх."
 FZL_wars.6.a:0 "На них було написано: "Я сумнівався в нас. Я сумнівався в Іспанії.""

 FZL_wars.7.t:0 "Пекло"
 FZL_wars.7.d:0 "Першою ознакою того, що щось було не так, стало наростаюче гарчання в повітрі. Воно почалося ледь чутно, непомітно, але за кілька хвилин уже все село чуло, як ревіння стає дедалі гучнішим.\n\nВони з'явилися з-за найближчого пагорба — металеві чудовиська з суворими чоловіками, що звисали з їхніх корпусів. Їхня форма й спорядження були брудними, вкритими багнюкою та кіптявою, очі втомлені, але палаючі. Вони не відпочивали й не зупинялися, перетинаючи країну, а тепер побачили свою ціль.\n\nЖителі села одразу зрозуміли, хто вони. Дехто закликав до дій, але не було ні зброї, ні тих, хто міг би нею скористатися. Кожен, хто міг воювати, давно пішов. Вони почали тікати: матері витягували розгублених дітей із будинків, а старі намагалися докульгати до полів.\n\nМеталеві звірі увірвалися до містечка, і їхні гвинтівки одразу розстрілювали кожного, хто тікав. Вони замикали двері крамниць і будинків, а потім кидали підготовлені жданови через розбиті вікна на тих, хто залишився всередині.\n\nЗлі очі дивилися на кожну жертву, яка була надто повільною, щоб утекти, коли звірі та люди накидалися на кожного, кого їхні гвинтівки могли дістати на полях і вулицях. За годину від села мало що залишилося, крім палаючих будинків, схлипів небагатьох живих і пострілу, який змусив їх замовкнути. Солдати поїхали геть, розмовляючи й сміючись між собою.\n\nЗ одного дерева, на яке жодне з чудовиськ не додумалося поглянути, одна дитина спостерігала за їхнім відходом."
 FZL_wars.7.a:0 "Вона не плакала, лише дивувалася — чому. Вогонь не дав відповіді."

 FZL_wars.8.t:0 "Сльози Мадрида"
 FZL_wars.8.d:0 "Дощ лив без упину, а гуркіт грому лунав над містом, мов удар батога. Колона визволителів мовчки рухалася вперед, освітлювана лише випадковими іскрами від пошкоджених вуличних ліхтарів або спалахами блискавки.\n\nДорога спускалася вниз, колись прекрасно вимощена, а тепер розбита й нерівна. Район уникнув масованого бомбардування, але кульові отвори та неприбрані трупи все ще вкривали узбіччя, повз які проходила колона. Потоки дощової води, що стікали дорогою, омивали тіла, понівечені обличчя та зламані кінцівки, майже не зустрічаючи опору, але мало хто з учасників маршу звертав на них увагу. Вони були надто зайняті тим, що намагалися втриматися на ногах у слизькому потоці.\n\nЄдиними тілами, вільними від річки, були ті, що висіли з вікон. Мертві від різних причин — хоча в сутінках це було важко визначити — з табличками, які проголошували, що такою буде доля кожного, хто зрадить Іспанію. Попередження нападникам і, можливо, також захисникам.\n\nЯка битва точилася там, на тій маленькій вулиці? Мертві не давали відповіді, їхні місця спочинку потопали в какофонії хлюпання, що супроводжувала війська. Порожній звук відбивався від безлюдного жовтуватого каменю, і жодного прояву життя не було видно. Ні живих, ні мертвих там уже давно не залишилося.\n\nВони йшли мовчки, мов привиди в нічному повітрі, їхні виснажені очі шукали шлях крізь зливу. Їхні похмурі вирази видавали відступ у свідомість, якому вони всі піддалися. Де було свято перемоги? Де було захоплення визволенням? Де були всі? Холод і вода були єдиними ознаками чогось природного на вулицях. Душа Мадрида, здавалося, була відсутня, змита геть. Звуки недавнього конфлікту зникли, кров загубилася в річці.\n\nЗалишилася лише тиша."
 FZL_wars.8.a:0 "Тиша пасує мертвим, бо мертві говорять нею."

 FZL_wars.9.t:0 "Діти Гвадалахари"
 FZL_wars.9.d:0 "Центр міста був сповнений активности: вантажівки й чоловіки пересувалися вулицями, а цивільні намагалися щосили триматися осторонь і тих, і інших. Над містом усе ще лунали постріли з гвинтівок, але вони були організованими й буденними. Лише громадяни звертали на них увагу.\n\nДесь серед міської забудови фонтанна площа вирувала від діяльности. У кутку було встановлено імпровізований намет, де адміністративний персонал та офіцери постачання намагалися навести лад серед усіх новоприбулих. Увесь день чоловіки входили в хаос розпеченої сонцем площі та виходили з нього з усіх напрямків. Один із цих новоприбулих, сержант Ортіс, виснажений після цілого дня ходи, насилу дістався фонтану. Він був усім, що залишилося від його відділення після битви. Однак перш ніж бодай на секунду спробувати привести себе до ладу, його погляд упав на дитину, що сиділа навпроти порожнього басейну.\n\nНе одна, а два десятки дітей сиділи, сховавши голови в долонях. Дехто, здавалося, ридав, тоді як інші сиділи цілковито нерухомо. Старші носили завеликі військові куртки поверх цивільного одягу, тоді як на молодших був лише військовий ремінь, обмотаний навколо них наче патронташ для військового спорядження. Навколо них снували солдати з гвинтівками, не знаючи, як поводитися, але явно наглядаючи за ними.\n\nЗацікавлений Ортіс підійшов до найближчого вартового. «Що з дітьми?» — запитав він.\n\nВартовий похмуро поглянув на дітей, перш ніж відповісти. «Вони хотіли використати дітей. Виродки. Але їхній офіцер утік».\n\nОртіс кивнув. Він уже бачив таку тактику в сільській місцевості. «Їм пощастило».\n\nВартовий подивився на нього, роздратований його безтурботністю. Він повернув голову, щоб знову поглянути на дітей, і махнув Ортісу гвинтівкою, наказуючи йти далі. Сержант послухався."
 FZL_wars.9.a:0 ""Я не записувався, щоб воювати з дітьми", — прошепотів вартовий сам до себе."

 FZL_wars.10.t:0 "Моя війна в Сараґосі"
 FZL_wars.10.d:0 "Святкування тривало далеко за північ, і, попри руйнування, багато громадян приєдналися до гулянь. Останні війська Фаланги були вибиті з міста, і, попри всі зусилля деяких офіцерів, серед громадян та парамілітарних підрозділів спалахнуло стихійне святкування. Незабаром до них приєдналося багато організованих військ.\n\nОсторонь вулиці самотній солдат похитнувся в провулок. Його почуття були притуплені, а дух — піднесений, і він ненадійно стискав напівпорожню пляшку бурбону. Зазвичай це був не його напій, але після битви особливо вибирати не доводилося. Чоловіки й жінки пили те, що могли знайти, незалежно від уподобань, і були цьому раді.\n\nСолдат був молодим, не звиклим до міцного алкоголю. Він подолав половину провулка, перш ніж похитнутися й упасти на холодну бруківку, небезпечно близько до блювання. Він стримав його, туманно усвідомлюючи, що досі носить військову форму, і не бажаючи ще більше її забруднювати. Краєм ока він побачив пару чобіт, що поволі наближалися з глибини провулка.\n\n«Солдате?» — запитав хрипкий голос. Молодий солдат радісно кивнув: сьогодні його вже стільки разів про це питали, а за цим часто слідувала випивка. Він підвів погляд. Над ним стояв чоловік у пошарпаному вбранні, цивільному, за винятком куртки — на ній був герб Фаланги.\n\nУ молодого солдата перехопило подих, коли він це побачив. Хрипкий чоловік став навколішки й вихопив ніж, поглядаючи на сп'янілого солдата й радісно спостерігаючи, як у його тьмяних очах спалахує жах. Ніж був вкритий засохлою кров'ю.\n\n«Ви святкуєте свою перемогу над виродженістю надто рано», — прошепотів він застиглому солдатові, — «бо не всі солдати Іспанії пішли»."
 FZL_wars.10.a:0 "Вранці знайшли пів дюжини понівечених трупів. Усі — солдати."

 FZL_wars.11.t:0 "Руїни Толедо"
 FZL_wars.11.d:0 "Пил осів кілька годин тому, і сонце почало сідати біля зруйнованого собору. Бомбардування попередньої ночі було жахливим: глухі удари артилерії заглушували крики, коли каміння обвалювалося на тих, хто був усередині. Крики тривали й після припинення обстрілу, і навіть тепер здавалося, що в моторошній тиші міста можна відчути цей відчай. Проте звук був невловимим, якщо він узагалі був, його можна було почути лише на коротку мить.\n\nНа купі уламків сиділа жінка. Її лахміття, ледве придатне для того, щоб називатися одягом, було вкрите пилом і посіріло після того, як вона виповзла з руїн; здавалося, вона була єдиною, хто вижив. Їй пощастило, але вона не могла піти звідси. Спочатку гуркіт снарядів змушував її тулилися до собору, але тепер залишилося лише заціпеніння. Вона хотіла, щоб крики тих, хто опинився під завалами, припинилися, але тепер бажала бодай чогось, що порушило б тишу.\n\nПоволі наблизилися звуки маршу, і разом із їхньою гучністю підвелася й жінка. Раніше вона боялася таких звуків, але солдати означали організованих людей, людей, які могли допомогти. Можливо, когось іще можна врятувати? Серед спустошених вулиць вона побачила колону Фаланги, що наближалася. Раніше такий вигляд сповнив би її жахом, але тепер вона вітала їх, попри втому кинувшись уперед.\n\n«Будь ласка, ви повинні мені допомогти», — благала вона офіцера колони, відчайдушно хапаючи його та відводячи вбік. «У соборі є люди, ми все ще можемо врятувати декого з них, нам потрібно —»\n\nРізкий ляпас змусив її замовкнути, після чого офіцер штовхнув її на землю. «Геть із дороги», — просто сказав він, повертаючись до колони, яка глузливо освистувала її. Вони погрожували їй невимовними речами, насміхалися з її зниклих друзів і родини; колона й жах, здавалося, не мали кінця, поки проходили повз. На собор вони навіть не поглянули."
 FZL_wars.11.a:0 "Вона не плакала й не кричала. Вона мовчки сиділа, доки доля не прийшла по неї."

 FZL_wars.12.t:0 "Нагадування в Бадахосі"
 FZL_wars.12.d:0 "Карлос лежав на зеленій траві, і на мить Війна зупинилася.\n\nУ повітрі було чути далекий тріск і поодинокі постріли, але запах зарослого газону та усамітнення цього місця стали ліками, яких Карлос і не знав, що потребував. За багато місяців його розум ще жодного разу не почувався так спокійно. Він розслаблено лежав, забувши про своє патрулювання хоча б на кілька хвилин. Дорога назад до Бадахоса була важкою. Він міг дозволити собі кілька хвилин для себе.\n\nДо війни його батько приводив його сюди, на стадіон «Ель-Віверо», щоб дивитися матчі, коли він був хлопчиком. Перегляд цих футбольних матчів був одним із найдорожчих його спогадів. Його батько загинув на ранніх етапах Війни, коли вся родина намагалася втекти з Бадахоса через зв'язки батька з Фалангою, але те, що стадіон уцілів, означало, що бодай частина його батька залишилася тут. Карлос сподівався, що батько посміхається йому, дивлячись на повернення їхньої армії.\n\nЦей безтурботний образ дещо псувала жменька роздутих трупів, що сиділи, прихилившись до краю поля. Вони були голими, їхні кінцівки роздулися до розмірів бочок з-під нафти, а сморід був огидним, але, на щастя, він не долинав аж до Карлоса. Він бачив чимало трупів і знав, що краще не зосереджуватися на такому моторошному видовищі. Натомість він думав лише про тепле сонце на своєму обличчі та відчуття зарослої трави під собою.\n\nНезабаром йому доведеться повернутися до патрулювання. Зрештою, після оголошення міста відкритим це була розвідка одним солдатом — життєво важливе завдання. Його командир не переставав про це говорити. Фактично його цілеспрямовано відібрали для цього завдання через його знання місцевости. Проте його спокійний розум на мить звільнився від практичних військових потреб.\n\nЩе кілька хвилин спокою не завадять."
 FZL_wars.12.a:0 "Навіть у найпохмуріші часи сонце все одно зійде."

 FZL_wars.13.t:0 "Стратегічна нейтралізація району в Картахені"
 FZL_wars.13.d:0 "Вони спостерігали за далекими вибухами в біноклі, за кілька кілометрів від артилерії. Гуркіт гармат викликав усмішки на їхніх обличчях, коли вони бачили результати, адже пагорб, на якому вони стояли, забезпечував чудовий огляд.\n\nЧастини Картахени пережили початковий штурм відносно неушкодженими через відсутність опору. Вони з відтінком похмурої втіхи відзначили, що майже можна було побачити шлях, яким армія пройшла через місто: руїни було видно з будь-якої точки огляду. Втрата такої спадщини засмучувала їх, думка про те, скільки Іспанії їм довелося зруйнувати, щоб її врятувати, навряд чи була приємною, але їхній успіх давав достатню розраду.\n\nОднак їхні люди продовжували стикатися з опором. Поодинокий стрілець? Терорист-смертник? Навіть ідіоти, які чинили пасивний опір, переходячи дороги перед життєво важливими конвоями. Хоча організованих ворогів Іспанії було усунуто, здавалося, багато хто з їхніх зіпсованих мешканців ще не засвоїв урок. Один співробітник штабу, помітивши, що саме в певних неушкоджених районах траплялося найбільше таких злочинів, запропонував це досить геніальне рішення. Дивлячись, як падає чергова будівля, вони розмірковували над тим, яке послання це передасть усім дисидентам, що залишилися.\n\nОдин офіцер, кадровий, а не підвищений під час війни, як решта, висловився проти плану, вказавши, що їхнім наказом було ефективно, але пропорційно застосовувати силу. На щастя, його відхилили, хоча й дратувало, що він відмовився спостерігати. Безумовно, чоловікам потрібно було побачити, що всі вони єдині?\n\nУсі вони одностайно погодилися додати його складний характер до свого звіту."
 FZL_wars.13.a:0 "Щоб урятувати тіло, руку потрібно відсікти."

 FZL_wars.14.t:0 "Глас народу Кордови"
 FZL_wars.14.d:0 "Вони мовчки й відсторонено йшли туманними вулицями. Вони стискали зброю, а темні очі визирали крізь протигази, оточені їдким білим димом сльозогінного газу. Позаду них повільно гуркотіли вантажівки, грубо перероблені для встановлених на їхніх кузовах кулеметів. Навколо них лежали трупи. Деякі опинилися під колесами повільно рухомих вантажівок, створюючи моторошний хрускіт і різкі поштовхи для солдата, який керував кулеметом. Усі вони ігнорували це, лише швидко поглядаючи, щоб переконатися в смерті.\n\nЧас від часу крізь гудіння важко працюючих, погано доглянутих двигунів вони чули кашель. Хтось, хто прикинувся мертвим або пораненим і ще не втратив усю кров. Часом навіть хтось стискав зброю, можливо, сподіваючись чинити непокірний опір. Газ виводив усіх із ладу, а солдати, що йшли пішки, швидко добивали їх.\n\nДехто робив це з ненавистю, їхні душі палали від люті до дурнів, які розбестили Іспанію. Навіть зазнавши поразки, вони продовжували протистояти спасінню своєї країни. Вони із задоволенням натискали на спускові гачки.\n\nІнші робили це зі співчуттям. Побачити, як стільки людей було обмануто брехнею монархістів, юдеїв чи комуністів — кого б не слухав цей натовп, — було сумно. Стільки добрих іспанців було зіпсовано заради чужоземних господарів, яким до них не було жодного діла. Вони сумно натискали на спускові гачки.\n\nЩе кілька хвилин тому ця вулиця була сповнена криками. Ніхто не міг згадати, чиї гасла лунали, та мало кого це хвилювало. Усе, що знадобилося, — стратегічне застосування сльозогінного газу та сили, щоб розчистити шлях. Чи продовжать ті, хто успішно втік, чинити опір деінде? Можливо.\n\nАле сьогодні Кордові було надіслано послання. Незалежно від того, як солдати виправдовували це перед собою, вони сподівалися, що це востаннє."
 FZL_wars.14.a:0 "Хто шкодує різки, той псує дитину."

 FZL_wars.100.t: "Відроджений Союз в Його ім'я"
 FZL_wars.100.desc: ""Сьогодні!"\n\nЦемент Вільямайора здригнувся від гучного голосу, що відлунював по Золотому місту Іспанії та крізь зали Ла-Клересії.\n\n"Є день нашого відродження!" Худорлявий чоловік стояв біля вівтаря, стискаючи трибуну. Він поглянув на натовп, сповнений як загартованих у боях ветеранів, так і зелених новобранців, молодих і з безпомилковим виразом рішучости... чи, можливо, наївности.\n\n"З Божої милости... і крові наших братів ми повернулися як господарі цієї нації." Чоловік швидко склав руки в молитві, перш ніж знову звернутися до слухачів. "Але ми ще не покінчили зі зрадниками на нашому півострові."\n\n"Ми повинні покласти край португальському режиму, який потурає безладу!" Лавами прокотився вигук. Рохкання. Крики. "Вони брехали! Брехали нам прямо в обличчя! Брехали, аж доки марксистські негідники не піднялися в Країні Басків! Там... там португальці показали свою лояльність... свою зраду... свою готовність залишити нас помирати в нашому хрестовому поході проти цих невірних виродків!"\n\nОвації ставали ще гучнішими. Лунали постріли, кулі рикошетили в Домі Божому. Тупіт гримів проходом, стаючи дедалі швидшим, переповнений силою, яка могла лише наслідувати частку Його Божественного Гніву.\n\n"Усі повстанці, що залишилися, схиляться перед Іспанською національною радою! Бо саме ця війна, і лише ця війна, дарує їм спасіння від комуністичного та чужоземного поневолення й повертає їх до лона як частину нашого Святого Союзу!""
 FZL_wars.100.a: "В ім'я Отця, і Сина, і Святого Духа."
#Tooltips
FZL_Portugal_War_Ready: "§YТепер ми можемо вторгнутися до будь-яких слабких режимів, що гризуться за Лісабон.§!"
