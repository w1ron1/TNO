 #Ministers
 FZL_Jose_Luis_Arrese:0 "José Luis Arrese"
 POLITICS_Jose_Luis_Arrese_DESC:0 ""I deserve this. I have always deserved this."\n\nOver the backs of erstwhile allies, José Luis de Arrese has climbed to the top. Against Franco, he first backed Manuel Hedilla and then his saviour, Serrano Suñer. Each time he landed on his feet. Each time he made a deal. Ever pleasant and servile, he connived with Franco against each of his patrons in turn, becoming FET secretary in the 40s before turning on his final patron as he was discarded.\n\nIt has all paid off. With one last grand deception, Arrese masterminded the German-backed coup of the junta. At last, Primo de Rivera's true heir sits as President of the National Council of a fully Falangist state. Smug in success, backed by the anti-Francoist Blueshirts, and ultra-Catholic since his youth, he will remind his last obstacles to his power of the Christian value of just violence.\n\nShorn of all parasites, true totalitarian Falangism is sure to achieve total victory. And it will do so with the Reich's weapons. Arrese eagerly aligns with the New Order, stuffing his government with advisors, and even pairing the swastika with the yoke and arrows. Whether collaborator or intransigent, Francoist or pro-Reich, he is no turncoat; it is his coat, no matter how you turn it. However, shoring up his power by opening the floodgate of German aid and influence, he worries that once the war ends, he will have merely traded one patron for another."
 
 FZL_Unorganized: "Disorganized Leadership"

 FZL_Serrano_Suner:0 "Ramón Serrano Suñer"
 FZL_Serrano_Suner_hog_desc:0 "§YGeneral Secretary of the Falange\nFalangism§!\n--------------\n§LRamón Serrano Suñer was once the "Cuñadísimo": Franco's "brother-in-law in-chief" and right-hand-man. Now, in some cruel celestial irony, he is deputy to the man who dashed his dreams in the 40s. Urged to take up the General Secretariat by those Falangists lying outside of Arrese's cronies, eager for a man who has never strayed from totalitarianism, the old man holds his nose for unity. For now.\n\nFranco's pro-Reich "minister of the Axis", Serrano was restrained by competing conditions for Spanish entry into the war during his diplomatic correspondences. In Germania there still lingers the hatred that cultivated; Hitler derided him as "Jesuitical" and ungrateful. However, now with Franco gone and boots on the ground, he is proving a more willing collaborator than Arrese. Then, as now, Serrano Suñer believes Iberia has much to offer as an equal partner. And the Germans are taking note.§!"

 FZL_Jose_Antonio_Giron_De_Velasco:0 "José Antonio Girón de Velasco"
 FZL_Jose_Antonio_Giron_De_Velasco_eco_desc:0 "§YMinister of Economic Affairs\nFalangism§!\n--------------\n§LLongtime scion of the Ministry of Labor, and prominent ally of Arrese, José Antonio Girón de Velasco has now set off on his quest for an entirely falangist economy. Much to the chagrin of the few businessmen allied with the Council he takes no prisoners, his only obstacle being the chaos of the war itself. A militia commander himself during the regime's genesis, Girón will do anything for the sake of his 'Pending Revolution'.§!"
 
 FZL_Felipe_Ximenez:0 "Felipe Ximénez de Sandoval"
 FZL_Felipe_Ximenez_for_desc:0 "§YMinister of the Foreign Affairs\nFalangism§!\n--------------\n§LOnce again, Felipe Ximénez de Sandoval's career has ridden the coattails of Serrano Suñer's rising star. Named head of the diplomatic cabinet for Minister of Foreign Affairs Serrano, he became the minister's chief lieutenant. That loyalty weathered their political wilderness, helped by the shared culprit: Arrese. Now he occupies the ministry of his mentor, and is his key ally in the government.\n\nIn lock-step with his chief, Ximénez de Sandoval's days are occupied with maintaining and boosting the flow of war matériel from Germany, further backroom handshakes be damned. Moreover, made national delegate of the Falange Foreign Service and member of the Hispanic Council after his promotion by Serrano, he calls on that experience to reconnect with the far-right of Latin America. He seeks the Council's restoration, so that Spain's place as the Hispanic World's spiritual axis might be realised.§!"
 
 FZL_Agustin_Aznar: "Agustín Aznar"
 FZL_Agustin_Aznar_sec_desc:" "§YSecretary of War\nFalangism§!\n--------------\n§LAgustín Aznar Gerner, though known for his radical falangism, is nonetheless a perfect candidate to throw weight around in the wartime military, being considered a neutral voice in the dichotomy between Arrese and Suñer. Neither of the two will gain a leg up from his presence, for now.\n\nRather than participate in palace struggles, Gerner has focused on enlisting expertise from Germania to shape the Spanish military after his favored world power's own force, and thus bring a thunder across Spain to signal the war's close.§!"
 
 FZL_Antonio_Garcia:0 "Antonio García Navarro"
 FZL_Miguel_Ezquerra:0 "Miguel Ezquerra"

 #National Spirits 
 FZL_bloodied_administration:0 "Bloodied Administration"
 FZL_bloodied_administration_desc:0 "Although the coup to oust the junta and install a Falangist government was successful, it created several more issues for the National Council to handle. During the chaos, Carlists seized control of part of the territory, proclaiming a rival government.\n\nIn addition, several government workers with anti-falangist tendencies had to be purged to ensure loyalty. Replacing them isn't instantaneous, and these purges have reduced administration to a crawl until suitable replacements can be found."

 FZL_germany_footsteps:0 "In Germany's Footsteps"
 FZL_germany_footsteps_desc:0 "The Spanish National Council has long aspired towards the example of the Third Reich. Nazi support for the Falangists was more than just material support to the cause but also introduced German political, economic, and administrative innovations that the Council is determined to employ as a means to bring about a brighter future. The German war economy simultaneously mobilized millions to create the most powerful military force the world has ever seen and its most dynamic economy; this is the model the Council will pursue. Whether the methods used in Germany to consolidate power thirty years ago can be successfully implemented in Iberia today is not certain, given the comparatively limited space, resources, and institutional backing the Council possesses. Regardless, Minister Velasco and Defense Minister Aznar are undeterred. Iberia is there for the taking. Falangist society must be built!" 

 #Tree
 FZL_one_final_chance_of_salvation:0 "One Final Chance of Salvation"
 FZL_one_final_chance_of_salvation_desc:0 "The National Junta fancied itself as many things. The saviour of Spain, of Iberia even, the visionary movement which would defend Spain from the siege.\n\nIt now becomes all but clear that the National Junta has failed. The promises of the National Junta have faltered, leaving our nation teetering on the brink of collapse - but where a dawn breaks upon Spain, so too does the light cast upon a solution. The Falange coup vindicated itself as necessary to restore order and stability, but opposition and enemies which otherwise undermine our unity and sovereignty.\n\nOnly with unwavering resolve and unyielding commitment, but also supremacy of will, will we arise from the ashes and forge a new Great Spain."
 FZL_one_final_chance_of_salvation_tt:0 "§rFalangista soy, falangista hasta morir o vencer.§!"

 FZL_the_party_above_all:0 "The Party Above All"
 FZL_the_party_above_all_desc:0 "The Party represents the zenith of our movement and the vanguard of our ideological struggle - the intelligentsia which dictate the direction in which we move. With the increasingly pressing matter of centralising the Party's domination in the state, we mustn't forget to seize this ripe opportunity to merge the Falange party institutions with the states and entrench the Falange, by tying its destiny directly to that of Spain's.\n\nOf course, this will have ramifications across the entirety of the organs of the Spanish government, most impendingly critical to us the politicisation of the military. Like Alexander said - an army of sheep led by a lion is stronger than an army of lions led by sheep, and the ideological fanaticism of the Falange is to play a greater role in the doctrine of our military strategy."
 
 FZL_spanish_national_socialism:0 "Spanish National Syndcalism"
 FZL_spanish_national_socialism_desc:0 "A generation of attempting to appease Francoist ambitions has led to a degradation of ideals among the Falange, the price paid by the patriotic Spanish rightists in the name of national unity. However necessary the tolerance for the Caudillo's ego might have been after the last Civil War, enough is enough and it is time for the forces of Spain's most committed nationalists to undo this insult on her honor and right the right to reclaim her glory.\n\nIt is of no surprise that the Falange once again finds an ally in the Third Reich, for the Fatherland has come a long way from the days of institutional stagnation followed by their own Civil War. Yet mirroring the Reich's ideology is no goal, instead returning to the doctrinal roots of our ideology, returning to National Syndicalism, will be that path that will lead to national regeneration."
 
 FZL_la_comunidad_popular:0 "La Comunidad Popular"
 FZL_la_comunidad_popular_desc:0 "It is quite clear that the Iberian Union did not do nearly enough to bring about reconciliation between the social classes, something else we can likely blame on the indifference of the Caudillos Franco and Salazar. It is intolerable that socialists and other rebels have infiltrated Spanish society as they have, thus a program to induce and enforce national unity among Spain's social strata must be considered.\n\nThe German concept of Volksgemeinschaft might have originated during World War 1, but it was the Hitlerian regime of the following decades that embraced it tooth and claw. While Spanish culture is too fundamentally cosmopolitan to embrace Nazi racial ideology with the same zeal, a framework to organize society based on talent, property or profession without class conflict - La Comunidad Popular - this is something that can absolutely find applicability in the new Spain."
 
 FZL_national_cleansing:0 "National Cleansing"
 FZL_national_cleansing_desc:0 "As much as the ideals of the Falangist revolution are paramount, the elements of what will bring about the national regeneration are far less pie-in-the-sky. If all you have is a hammer, every problem looks like a nail. With the rebel factions across the peninsula each representing a long-time thorn in the side of Spanish rightists, a more blunt approach to ensure national salvation is already underway.\n\nTaking cues from the Black and Brownshirts, the Blueshirts of the Falange are to be given extrajudicial authority to root out traitors behind the lines. Given the greenlight by the government as part of an anti-opposition campaign, the Blueshirts will have the authority to impose detentions, conduct trials and carry out summary executions of anyone considered a threat to the national revolution."
 
 FZL_saving_spain_from_itself:0 "Saving Spain From Itself"
 FZL_saving_spain_from_itself_desc:0 "What else could be said of Spain's decline from status as world class power that hasn't been said already? The once venerable nation that once claimed nearly the whole of the New World as empire, humbled through colonial upheaval and American encroachment and humiliated by the decadence of the Republic. Even Francisco Franco, once considered a titan of European hegemony and the savior of Spain, proved too impotent to do what was needed to pull Iberia back from the brink.\n\nWe will not allow weakness to reduce fair España to becoming the new sick man of Europe, not so long as a single man of the Falange draws breath. The Regime of the Spanish Council shall make no excuses nor exceptions for those they know most guilty for betraying the Spanish nation, with any and all enemies of her soon to be forever scorched from Iberia's soil."
 
 FZL_all_will_be_in_agreement:0 "All Will Be in Agreement"
 FZL_all_will_be_in_agreement_desc:0 "The true fault in the failure of the Iberian experiment lies not merely in the complacency of The Caudillos or the ruling bureaucracy, but in the minds of the masses they failed to properly control. How else would socialist agitators and republican traitors be able to co-opt such a large swath of the population, even a generation after the last Civil War?\n\nThere is no means to the end that can not be considered, no penalty for detraction with the national regeneration that will not be punished. The ongoing propaganda war against rebel belligerency will only intensify as the war inches towards its conclusion, as will the punishment for those who stand in the way of its inevitable victors."
 
 FZL_they_will_have_to_learn:0 "The Falange Generation"
 FZL_they_will_have_to_learn_desc:0 "With the second Civil War slowly drawing to a close, yet another generation of Spanish children have been forced to see their fathers either perish or be irrevocably scarred in a conflict even more brutal than the last. In one's life, grief is as much a cruelty as it is a matter of course. But such immense torment has the power to facilitate a... healthy realignment of one's precepts of society.\n\nWith so many Spanish youths left orphaned or without a functional paternal figure to guide them, it is the duty of the Spanish nation to give the wayward young an outlet to nurture a deep loyalty to the nation their fathers died for. The Falange already have a program in the works to expand access to education for a new generation Spanish children, one to incorporate a methodology for preserving a nationalist ethos in their hearts as to be most complementary in the conduct of state affairs."
 
 FZL_and_only_the_spanish_will_remain:0 "Only the Spanish Will Remain"
 FZL_and_only_the_spanish_will_remain_desc:0 "As the Civil War rapidly reaches its terminus point, so too does the patience of the Falange for all those who dain to oppose them. Who else is left among the rebels to challenge the New Spain? What crawls amidst the wreckage and ruins that would try to topple everything we have worked so hard to build?\n\nIrrelevency, the worst of all stigmata to infect the people of the New Spain.\n\nThe rebels have little left to defend themselves now, the Civil War all but over even now. But just as Germany taught a lesson to those who would do it harm, so too must the nation of España meet out a similar remedy against the corrosion of irrelevancy. Be it by ball and chain or by bullet and the noose, Spain and her children will finally be pure."
 
 FZL_and_they_will_know_their_place:0 "Know Your Place"
 FZL_and_they_will_know_their_place_desc:0 "Anyone should remember that it was the lack of stability and security which led to the demise of the Iberian Union. The uprising of the Basques - though seemingly a localised riot, demonstrated the rot upon which the Iberian Union was situated, and this quickly festered into the conflagration which we find ourselves today.\n\nWe would be wise not to repeat the mistakes of the old Union by keeping the people on a tight leash, because what happened made it clear that a few more controls will be necessary. Laying the groundwork for greater surveillance and policing seems one of the more straight-forward solutions at hand. The Civil War has given us plenty of excuses to build the apparatus for a more totalitarian regime - after all, the Spaniards are more than delighted to sacrifice a few personal freedoms for their own security and life, right?"
 
 FZL_reconvene_falange:0 "Reconvene Falange"
 FZL_reconvene_falange_desc:0 "Not many in our ranks today remember the Falange Española as it was back in 1933 - the year of its foundation.\n\nPrimo de Rivera, the founder, appeared before us as a messiah on a mission to save Spain. Though his life was cut short by the rotten Republic he worked to overthrow, at long last the Falange seized its destiny over the entirety of Spain, and soon merged with Portugal to form the Iberian Union.\n\nAlong the way, however, it cannot be unsaid that the Falange's ideology had been diluted under the reign of the Caudillos - those being Franco and Salazar. In its process, the Falange had merged itself with various other reactionary forces to form a united front against the primary enemy: the bastardly Republicans and their Judeo-Bolshevik backers. This ultimately resulted in the miscegenation of the prime ideology of the Falange, turning what once was a rooted fascist movement into the ideology which ultimately led to the collapse of the Union.\n\nNo more can this be a tolerable state for the Falange. If we are to assume our destiny as the vanguard and saviour of all of Spain, we must return to what initially brought us to victory."
 
 FZL_a_phone_call_to_germania:0 "A Phone Call to Germania"
 FZL_a_phone_call_to_germania_desc:0 "Our German comrades brought to us during the original civil war several technologies. The dive bombers, the machine guns, everything that the Condor Legion gave us. Now that we find ourselves once more in a civil war, we must look towards what initially achieved our victory in the first place.\n\nThough we certainly cannot be needy to ask Germany for extensive military aid, it would be wise to remind them of our ideological destinies, and that our goals are intertwined. By demonstrating that our victory would be a highly favourable outcome to them, we can convince them to back our cause.\n\nJust as they had done a few decades back, with a little bit of German magic, we could be well on our way to re-establishing our mandate over Iberia once more."
 
 FZL_a_national_push:0 "A National Push"
 FZL_a_national_push_desc:0 "Though the Germans are a world-renowned power who pioneered many ideas and technologies, if there's one thing we ought to adopt from them, it is their methods of war and economic organisation. Upon their visionary Dr Goebbels' call for a total war - Totalen Krieg, Germans across the Reich at once reorganised their entire economy, relinquishing their consumer luxuries all for the good of their Endsieg. All this culminated after several arduous and long years of fighting against a Judeo-Bolshevik snake to the East and a hedonistic capitalist rat to the West, which they accomplished with the sword they called, the Blitzkrieg.\n\nThere is much that we can adopt from our German comrades, if we study their methods. At once, let us dive into German literature and German methodology, for the results have not only been promising, but proven, to have demonstrable results in crushing the enemies of Spain everywhere."
 
 FZL_the_national_army_takes_shape:0 "The National Army Takes Shape"
 FZL_the_national_army_takes_shape_desc:0 "The German Army demonstrated a significant feat of valiance through its immortal deeds in the last Great War. How could it have done so, against the hordes of Reds and Judean spooks? Devotion and consciousness in its ideological heritage are what kept German soldiers resolute in fighting spirit - and this it achieved with political commissars, that kept the ideological adheration of its officers and soldiers in check constantly. Clearly, a reorganisation of the military to adopt similar structures and methods so that they align with the German ones, would be the most viable path towards success for us.\n\nSubversive elements have been ripe at every turn - after all, this is what sent the Union spiraling down into chaos. Hopefully, by engraving the ideology firmly into our military, we can prevent such a calamity from ever manifesting itself ever again."
 
 FZL_total_war_economy:0 "Total War Economy"
 FZL_total_war_economy_desc:0 "In times of desperation all options must be considered and nothing is unthinkable. As much as the civilian sector will protest and resent our decision, it is become clear that a heavier hand must be played with controlling the economy, as unpopular as it may prove to be among the men and women behind the fighting lines.\n\nThus, we are forced to make the decision of allocating all of what little resources we have in our possession towards our war effort. Rationing food and common supplies will be necessary to control consumption, and while they may certainly be met with protest from our people we are left with no other choice."
 
 FZL_saving_spain_from_its_enemies:0 "Saving Spain From Its Enemies"
 FZL_saving_spain_from_its_enemies_desc:0 "The world is conspiring against Spain... After all, what else could explain the series of misfortunes and tragedies that befell Iberia? Though our first days after the pronunciamento were triumphant in the glory of our victory, we now found ourselves alone after the treacherous Italians left us in the dark, as we slowly continued falling apart. Foreign forces, like vultures, swooped down and seized the opportunity to establish their interests in Iberia - the enemies we fight now, are the same foreign proxies who wish to tangle us into a new sphere of influence.\n\nOur actions justify themselves... After all, if our enemies will play dirty, then we cannot take any cards off the table."
 
 FZL_taking_lessons_from_german_industry:0 "Taking Leasons From German Industry"
 FZL_taking_lessons_from_german_industry_desc:0 "Time and time again it's been proven that German industry is the greatest in the world - while not necessarily exemplified in its choices of equipment production, its industrial doctrine helped achieve the adequate balance needed towards fueling their military campaign.\n\nThe German work discipline is harsh, brutal and stalwart, much like our own conviction to a new Great Spain. To match this, we will adopt this same discipline and vigour that may truly rival our Northern mentors, and that means a greater centralisation and streamlining of our means of production, and liquidation of the existing bloated mechanisms and bureaucracies that have done nothing but cripple our efforts."
 
 FZL_not_taking_one_step_back:0 "Get with the Program"
 FZL_not_taking_one_step_back_desc:0 "As much as we would prefer otherwise, reports have come in bearing extensive and comprehensive statistics on our numbers bearing appalling news - while the numbers of men we have gathered certainly look impressive given what little resources and land we have, the reality is that the results on the battlefield have been certainly inefficient if the reports hold true.\n\nAnd while some of our men have demonstrated their worthiness to the Spanish nation valiantly, others have been... lacking, to say the least. We have tolerated their nonsense for far longer than we should have. Much more harsh measures must be taken if we are to really demonstrate our intolerance for their abject, incompetent tomfoolery.\n\nFor the treacherous, the cowardice, and the incompetent, they better keep their heads down, if not for Spain, then for their own life."
 
 FZL_and_some_may_be_controversial:0 "Solving the Labor Problem"
 FZL_and_some_may_be_controversial_desc:0 "In the wake of the conflagration engulfing the Iberian Peninsula, we found our workforce crippled severely as the means to mobilise and organise skilled workers in and around the areas under our direct control have been magnitudes more difficult. That being said, the imperative need for even greater industrial mobilisation to ensure survival and continuity of our war effort has reached unprecedentedly strenuous levels.\n\nTo accomplish this we will maximise our industrial output through a mass introduction of forced labour all around the military-industrial sector. Various indentured servants, ranging from convicted criminals serving non-capital sentences to captured prisoners from enemy factions will allow us to harness an even greater manpower to bolster our strategic industries.\n\nThis will no doubt be met with resistance from an already restless population resentful of our tightening grip on their livelihoods. However, the ends justify the means - and our cause is an end justified by our struggle."
 
 FZL_and_the_people_clamor_to_join:0 "The Spirit of the Visigoths"
 FZL_and_the_people_clamor_to_join_desc:0 "In the days of Late Antiquity, the ancient Germanic tribe known as the Visigoths appeared in the Balkans and later arrived in the Iberian Peninsula. A natural people of warriors, initially fighting for the Roman Empire they later broke from their Roman overlords, contributing to the stunning decisive defeat of the Romans at Adrianople.\n\nThough the Visigoths eventually met their demise at the hands of the Arabs, it was not before they had laid the grounds for what would become the modern Spanish people and culture. Their culture and their blood lives and flows within us, the Spanish people - and we have countless militaristic feats to show for it. Today, however, the Spaniards have forgotten their ancient creed as a warrior nation, and what is more, is that the traditions of the Visigoths have faded with the passing of time.\n\nWe shall revive our heritage of a warrior nation by centralising the military in our new Spanish culture and making an extensive propaganda effort to cement this in the hearts of our people. Like the Spartans, and like the Visigoths, we are one and we are many - and let all Spaniards and our enemies too know this to be true."

 FZL_sin_relevo_posible_hasta_la_extincin:0 "Sin Relevo Posible, Hasta La Extinción"
 FZL_sin_relevo_posible_hasta_la_extincin_desc:0 "Victory has never been this close at hand, but we must not celebrate too soon. Around us our enemies continue to fall, and those who pose an existential threat to our future are soon to be no more. With a final strike, we will bring about their decisive defeat - but to do so we require even greater commitment and complacency from the people.\n\nLet us have one last great campaign on the home front to gather the support we need to achieve victory. The Spanish people are clamouring for their much-awaited triumph against the Bolshevist scum, the traitors, and the other forces which remain in the darkness, and by gaining their pledge to commit, we will finally be able to wipe them out once and for all."

 #Events 
 FZL_wars.1.t:0 "Book Club"
 FZL_wars.1.d:0 "José Luis de Arrese sat around his little Falangist book club. Chairs were pushed up against his office desk, with the occasional sound of something being scribbled down as the men nodded their heads like faux philosophers. Between notepads, there sat many copies of Nazi literature — from the mainstream Mein Kampf to more obscure works. They occasionally highlighted a passage of interest while crossing out the rest.\n\nThere was a certain energy that he wanted to replicate — a foreign flavor that Arrese sought to bring over to Iberia. This was the great thing about reading the ideology of a man like Hitler: you could pick only the most useful aspects of his weird little mutated version of fascism while cutting out the rest, like a gardener picking the healthy fruits from the rotten ones.\n\nOne such rotten fruit was his disdain towards Roman Catholicism. They couldn't keep that. Of course not. Iberia was a Catholic nation (Germany was supposed to be a Protestant one, but that branch was plastic and man-made). Mein Kampf would not become their Bible. They already had the real deal.\n\nBut, say whatever you wish about the Nazis, they were efficient. Hitler wasn't just a politician, but a calcified representation of the German will: a true leader — a Führer. He almost thought about the Chancellor as a phenomenon more so than a person (despite having met him). Could their Líder compare? And if not, how could they make it so he did?\n\nArrese leaned back in his chair — the stiff leather creaking beneath him. "Remember this, friends," José treated this as an impromptu break from the small black letters, rubbing his eyes. "We are not Germans. We are not Italians.""
 FZL_wars.1.a:0 ""We are Spaniards.""

 FZL_wars.2.t:0 "Eyes to the Sun"
 FZL_wars.2.d:0 "The morning sun cast long shadows across the courtyard as the children lined up in neat rows as part of the morning ritual. Some of them found the new, crisp, militaristic uniforms exciting, while others tucked on their stiff black collars and red armbands that always seemed just a little too tight. No matter which side you were on, everyone went eerily still as Cara al Sol began screeching from the loudspeaker.\n\nThis was the cue for an exhausted-looking teacher to approach the flagpole's base with a folded-up flag. None of them had paid much attention to the pole as it was being put up, but that's probably just because a flagpole without a flag is just a big metal stick. The children watched in silence, their eyes fixed on the flag as it slowly unfurled during its ascent — red-gold-red against the fresh morning sky.\n\nThey tried — and failed — to raise their hands in unison, resulting in a messy sea of shaky Fascist salutes. At least half of the kids were only using their extended palms to shield their faces from the harsh sun, while the other vigilant hovered them just above their delicate eyes. When the last notes of the anthem faded, there were a few sighs of relief; for a kid, three minutes of standing still might as well be an eternity.\n\nThe mood remained formal as the students entered the school under the watchful gazes of their teachers. In each classroom, posters of José Luis Arrese and Primo de Rivera hanging on the wall demanded their attention. Of course, most of them didn't know which of the old men was José and which was Primo, but they must have been important."
 FZL_wars.2.a:0 "The colored photographs were of much higher quality than those their parents could afford."

 FZL_wars.3.t:0 "Fear the Censor"
 FZL_wars.3.d:0 "A dingy, faded office lamp only partially illuminated the desk of the censor at work, scrawling away across documents stipulating the fates of several choice pieces of literature found in underground circulation. In most cases, a ban was required; burnings, interrogations of owners, the whole ordeal. After hours of quiet work, he had finally reached his last piece to cover: a book that had seen extensive circulation amongst underground resistance circles, seized only recently during a routine raid in the slums of Zaragoza.\n\nThe censor flipped through each page, noting anything of interest that caught his eye, be it details of individuals or the topic at hand. It was your average separatist treatise, splashed with a communist flair that attacked public morality and undermined the authority of the National Council. Interestingly, his specific copy had several names struck out with black marker, no doubt a last-ditch effort to protect the identities of whatever command structure the book alluded to.\n\nThe verdict was straightforward. A full ban of this publication was required, with all requisitioned copies burned and an active search order given for any copies still in circulation. Before closing the report for the night, the censor left a note to tabulate the owners of this piece for further interrogation. After all, such insurrectionist narratives hardly existed in a vacuum; where one can be found, a multitude of others can be unearthed with enough diligence and manpower."
 FZL_wars.3.a:0 "What they do not know cannot hurt them."

 FZL_wars.4.t:0 "Silent Mandate"
 FZL_wars.4.d:0 "There was a certain trick Arrese was taught once. The simple act of saying nothing while taking the podium was enough to calcify the room — to preserve its tension. He didn't use to believe, but there was a tactile energy in the air as the many faces awaited his verdict.\n\n"We have grown compliant," the man finally spoke up, looking over the members of the Falange Council. "Perhaps that was to be expected. Perhaps that is the fate of every great state." He leaned into the podium, basking his face in the filthy white light which flooded above him. "But I want every politician and soldier — every man present here — to understand that this isn't a war of spheres or resources or pride. This isn't some distant conflict we can ignore."\n\nAnother calculated pause drew the room into his grasp. "The last time our way of life came under such an existential threat was during the Civil War." For many men, the years 1936-1939 were just a talking point. For José, they were a distant reality that rhymed with their recent woes. "So I say: this is a war of survival."\n\nAs the crowd erupted into cheers, Arrese allowed his face to soften, looking like a father about to convey bad news. "And this is why we must mobilize both the military and economy." On cue, there came the uneasy winces and awkward rubbing of hands. "In my experience, it has always been a struggle to convince the people to invest in the army," he shook his head in a stream of consciousness. "Why? Because the army is like health. You only understand its value after it has failed you." Taking a deep breath, the man placed his hands firmly on the podium.\n\n"
 FZL_wars.4.a:0 ""It's not a war that can be lost. Don't you understand?""

