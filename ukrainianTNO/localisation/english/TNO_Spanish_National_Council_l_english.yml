 FZL_wars.6.t:0 "Spartacus"
 FZL_wars.6.d:0 "The Sun was gone.\n\nThe world was gray around this abandoned highway, a dead layer of cloud seemingly lying over the sky. No rain fell, but the world seemed to hold its breath before a storm. Silence ruled; no cars seemed to come.\n\nSlowly, a family moved along the battered highway with a pitiful cart of few provisions. The emptiness unnerved them, but they kept moving. To stay still was to die, their nervous eyes darting to any bit of sound. Such events were rare however - even animals seemed to have departed. Only a cold wind sometimes passing demonstrated any life in the world.\n\nExcept for the occasional panic at the soft breeze shifting a stone or the unexpected squeak of the sparse cart, they kept their eyes down to the ground. For all their days, weeks of walking they had received little news of the going of the War. Matters such as food and safety had taken far more precedence as they cowered in whatever makeshift shelters they could. In the desolate countryside, such things seemed rarer by the day.\n\nThe youngest in the family fell, a momentary stumble as their exhausted mind had a moment of dizziness. They lay dazed for a moment and as they stood back up they were forced to look upon their audience; the eyes that had followed them for miles.\n\nFrom every light post, stretching far in both directions, bodies hung from the neck. Some wore symbols of the Republic. Some wore symbols of the Socialists. Others even wore the symbol of the so-called King. Around each neck was a sign, a sign which all the family tried to ignore as they shuffled forward. They knew not who hung them, but they feared them nonetheless."
 FZL_wars.6.a:0 "They read: "I doubted us. I doubted Spain.""

 FZL_wars.7.t:0 "Inferno"
 FZL_wars.7.d:0 "The first sign anything was wrong had been an ascending growl in the air. It had started subtle, unnoticed, but within minutes all the village could hear the roar growing louder.\n\nThey came over a nearby hill, metal monsters with stern-faced men hanging off their bodies. Their uniforms and equipment were dirty, caked in mud and grime, their eyes weary yet ablaze. They had not rested nor stopped as they had moved across the country and now they saw their target.\n\nThe people of the village immediately realized what they were. Some called for action, but there were no weapons or anyone to use them. Anyone who could fight had long since left. They began to flee, mothers dragging confused children out of houses while the old tried to hobble towards the fields.\n\nThe metal beasts came upon the town, and their rifles immediately shot anyone who ran. They locked the doors of stores and houses, before throwing prepared Zhdanovs through smashed windows onto any trapped inside.\n\nEvil eyes looked upon any victim too slow to flee as they were dragged away. Screams came about as the beasts and men set upon anyone their rifles could catch in the fields and streets. Within an hour, little remained of the village except for burning houses, whimpers of the few living and the gunshot that silenced them. The soldiers rode away, talking and laughing amongst themselves.\n\nFrom a single tree, that none of the monsters had thought to look in, a single child watched them leave."
 FZL_wars.7.a:0 "She did not cry, just wondered why. The fires gave no answer."

 FZL_wars.8.t:0 "Tears of Madrid"
 FZL_wars.8.d:0 "The rain poured relentlessly, the crack of thunder sounding like a whip upon the city. The column of liberators moved silently, illuminated only by the occasional spark from a damaged street lamp or strike of thunder.\n\nThe road slanted down, once beautifully paved but now broken and jagged. The area had been spared mass bombardment, but the bullet holes and uncollected corpses still riddled the paths to the side of the street, past a marching column. The flowing rainwater following the road washed over the bodies, twisted faces and broken limbs offering little resistance to the flow, but few of the marchers paid them any mind. They were too busy trying to keep their footing in the slippy torrent.\n\nThe only bodies free from the river were the few that hung from the windows. Dead from various means - though that was hard to tell in the twilight - with signs declaring they were the fate of all who betrayed Spain. A warning to the attackers and, perhaps, the defenders too.\n\nWhat battle had been fought there, in that small street? The dead gave no answer, their resting places drowned in the cacophony of splashes that accompanied the troops. The empty sound bounced off the desolate tanned stone, no life appearing. For the living and the dead, none had for some time.\n\nThey walked in silence, as ghosts upon the nightly air, their gaunt eyes peering a way through the downpour. Their grim expressions betrayed a retreat into the mind they had all surrendered to. Where was the festivity of victory? Where was the adulation of liberation? Where was anyone? The cold and the water were the only indications of anything natural in the streets. Madrid's soul seemed absent, washed away. The sounds of recent conflict were gone, the blood lost in a river.\n\nAll that remained was silence."
 FZL_wars.8.a:0 "Silence suits the dead, for the dead speak it."

 FZL_wars.9.t:0 "Children of Guadalajara"
 FZL_wars.9.d:0 "The center of the city was full of activity, trucks and men moving through with civilians trying their best to stay out of the way of both. Rifle cracks could still be heard over the city but they were organized and routine. Only the citizens paid them any mind.\n\nSomewhere in the sprawl, a fountain square was abuzz with activity. A makeshift tent was set up in the corner with administration staff and supply officers trying to bring some order to all the newcomers. Men entered and left the chaos from all directions of the sunbaked square all day. One of these newcomers, a Sargento Ortiz, stumbled to the fountain exhausted from a day of walking. He was all that was left of his squad from the battle. He tried adjusting himself for merely a second however before his eye caught a child sitting across the empty basin.\n\nMore than one, two dozen children sat with their heads buried in their hands. Some of them seemed to sob while others sat completely still. The older ones wore oversized military jackets over casual clothes, while the younger ones had merely a military belt wrapped around them like a bandolier for military gear. Soldiers with rifles milled around them, unsure of themselves but clearly watching over them.\n\nOrtiz, struck with curiosity, walked over to the nearest guard. "What's with the kids?" he asked.\n\nThe guard looked over the children morosely before he answered. "They wanted to use the kids. Bastards. Their officer ran off though."\n\nOrtiz nodded. He'd seen such tactics before in the countryside. "That was lucky."\n\nThe guard looked at him, vexed at his nonchalance. He turned his head to look back at the kids, waving his rifle at Ortiz to move on. The Sargento complied."
 FZL_wars.9.a:0 ""I didn't sign up to fight kids" the guard whispered to himself."

 FZL_wars.10.t:0 "My War in Zaragoza"
 FZL_wars.10.d:0 "The celebrations had continued late into the night, and despite the destruction many citizens had joined in the festivities. The last falange troops had been routed from the city, and despite the best efforts of some officers a spontaneous celebration had broken out among the citizenry and paramilitary units. Many of the organized troops soon followed.\n\nOff the street, a lone soldier stumbled into an alley. His senses were dulled and his spirit high, precariously clutching a half empty bottle of bourbon. It wasn't usually his drink of choice but in the aftermath of battle there wasn't much choice. Men and women drank what could be found regardless of preference and they were glad for it.\n\nThe soldier was young, unused to the strong liquor. He made it halfway down the alley before stumbling onto the cold paving, dangerously close to vomiting. He held it in, dimly aware he was still wearing his military fatigues and unwilling to dirty them further. Out of the corner of his eye, a pair of boots slowly walked towards him from deeper in the alley.\n\n"Soldier?" a gruff voice asked. The young soldier gleefully nodded, he'd been asked that so many times tonight and a drink often followed. He looked up. Above him was a man in a tattered outfit, civilian except for the jacket - which carried the emblem of the Falange.\n\nThe young soldier's breath hitched as he saw it. The gruff speaker knelt down and brandished a knife to the intoxicated soldier, gleefully watching the dull eyes light with terror. The knife was caked with dried blood.\n\n"You celebrate your degeneracy winning prematurely," he whispered to the frozen soldier, "because not all of Spain's soldiers have left.""
 FZL_wars.10.a:0 "In the morning they found half a dozen mutilated corpses. All soldiers."

 FZL_wars.11.t:0 "Ruins of Toledo"
 FZL_wars.11.d:0 "The dust had settled a few hours ago and the sun had started to set beside the collapsed cathedral. The previous night's bombardment had been terrible, the deep booms of the artillery muffling the screams as stone collapsed on those within. The cries had continued after the bombardment had ceased, and even now it seemed that in the eerie silence of the city that distress could be sensed. The sound however was elusive, caught only for a fleeting moment if it was there at all.\n\nOn a pile of rubble a woman sat. Her rags, barely clothes, were dust covered and gray from when she had crawled out from the ruin; seemingly the only one. She had been lucky, but unable to move away. At first the crescendo of shells had kept her huddled to the Cathedral, but now just numbness. She had wanted the cries of the trapped to stop, but now she wished for anything to break the silence.\n\nThe sounds of marching slowly approached, and with their rising volume so rose the woman. She had feared such sounds before but soldiers meant organized men, people who could help. Perhaps some could be saved? Through the devastated streets she watched the approaching Falange column. Before such a sight would have filled her with dread but now she welcomed them, rushing forwards despite her fatigue.\n\n"Please, you have to help me," she pleaded with the column's Officer, desperately grabbing him and dragging him to the side. "There's people in the cathedral, we can still save some of them, we need to -"\n\nA sharp slap silenced her, the officer then pushing her to the ground. "Out of the way" he said simply, rejoining the column which jeered at her mockingly. They threatened her with unspeakable things, mocked her missing friends and family; the column and the terror seemed endless as they passed by. They spared the cathedral no glance."
 FZL_wars.11.a:0 "She didn't cry or scream. She sat silently, until fate came for her."

 FZL_wars.12.t:0 "Reminders in Badajoz"
 FZL_wars.12.d:0 "Carlos lay on the green grass, and for a moment the War had stopped.\n\nThe distant crackle and pops of sporadic gunfire sounded in the air, but the smell of the overgrown turf and the isolation of the area was a remedy that Carlos had not realized he needed. His mind hadn't felt so at ease in months. He lay relaxed, uncaring of his patrol for just a few minutes. It had been a hard road back to Badajoz. He could take a few moments for himself.\n\nHis father had brought him here, the Estadio El Vivero Stadium, to watch games before the War when he had been a boy. Watching those football games were some of his most cherished memories. His father had died in the early stages of the War, when the family had all tried to flee Badajoz due to his father's Falange associations, but the survival of the stadium meant that at least some of his father remained. Carlos hoped his father was smiling on him as their army had returned.\n\nThe serene image was sullied somewhat by a handful of bloated corpses sat against the side of the pitch. They were nude, their limbs the size of oil drums and the smell grotesque, but thankfully the smell didn't carry as far as Carlos. He had seen his fair share of corpses, and he knew better than to focus on such a ghastly sight. Instead, all he thought about was the warm sun on his face and the feel of the overgrown grass beneath him.\n\nHe would have to return to his patrol soon.After all, it was a one-man reconnaissance after the city was declared open; a vital task. His commanding officer had not shut up about that. He had been practically headhunted for it due to his familiarity with the area. However his eased mind was, for a moment, absent from practical military necessities.\n\nA few more minutes of peace wouldn't hurt."
 FZL_wars.12.a:0 "Even in the bleakest times, the sun will still rise."

 FZL_wars.13.t:0 "Strategic Area Neutralisation in Cartagena"
 FZL_wars.13.d:0 "They watched the distant blasts through the binoculars, a few kilometers from the artillery. The boom of the guns brought smiles to their faces as they saw the results, the hill upon which they stood offering an excellent vantage point.\n\nParts of Cartagena had survived relatively intact in the initial assault, on account of a lack of resistance. They noted with a hint of dark amusement that you could almost see the path the army had taken through the city, the ruin visible from any vantage point. The loss of such heritage saddened them, the thought of how much of Spain they had to destroy to save it hardly a happy thought, but their success offered ample condolence.\n\nHowever, their men had continued to encounter resistance. A lone gunman perhaps? A suicide bomber? Even idiots practicing passive resistance, crossing roads before vital convoys. Though the organized enemies of Spain had been removed it seemed many of their corrupted denizens had yet to learn the lesson. A staffer, observing that certain undamaged districts seemed to have the most cases of such criminality, had offered this rather ingenious solution. As they watched another building fall they reflected on the message this would send to all remaining dissidents.\n\nOne officer, a career one rather than a wartime promotion like the rest of them, had voiced opposition to the plan by pointing out their orders were to utilize force effectively but proportionally. Fortunately he had been overruled, even if it was frustrating that he had refused to watch. Surely the men needed to see that they were all united?\n\nThey all collectively agreed to include his difficult attitude in their report."
 FZL_wars.13.a:0 "To save the body, the arm must be removed."

 FZL_wars.14.t:0 "Córdoba's Vox Populi"
 FZL_wars.14.d:0 "They walked through the fogged streets, silent and aloof. They clutched their weapons and dark eyes looked through gas masks, surrounded by the stinging white smoke of tear gas. Behind them slowly trundled trucks, crudely redesigned for the machine guns strapped to their rears. Scattered around them were corpses. Some were caught beneath the wheels of the slowly moving trucks, creating sickening crunches and sharp bumps for the soldier operating the gun.All ignored them beyond a quick glance to verify death.\n\nOccasionally, over the drone of the struggling, ill maintained engines they heard coughing. Someone who had played dead or wounded who had not yet bled out. Occasionally even someone clutching a weapon, perhaps hoping to make a defiant stand. The gas incapacitated all and the walking soldiers quickly dispatched them.\n\nSome of them did so out of hatred, souls afire for the fools who had corrupted Spain. That even when defeated they continued to oppose their countries salvation. They pulled their triggers with satisfaction.\n\nOthers did it with pity. To see so many lost to the lies of monarchists, jews or communists - whoever this gathering had listened to - made them sad. So many good Spanish corrupted for foreign masters who cared nothing for them. They pulled their triggers with sadness.\n\nMinutes earlier this street had been alive with shouting. None could remember whose slogans had been shouted and few of them cared. All it had taken was strategic use of tear gas and application of force to clear the way. Would the survivors who had successfully fled continue elsewhere? Maybe.\n\nBut today a message had been sent to Córdoba. Regardless of how the soldiers justified it to themselves, they hoped this would be the last time."
 FZL_wars.14.a:0 "To spare the rod would spoil the child."

 FZL_wars.100.t: "A Union Reborn in His Name"
 FZL_wars.100.desc: ""Today!"\n\nThe Villamayor cement trembled from the booming voice, reverberating across Spain's Golden City, and through the halls of La Clerecía.\n\n"Is the day of our rebirth!" A skinny man stood at the altar, gripping the podium. He looked at the crowd, full of both battle-hardened veterans and green recruits, young and with the unmistakable look of determination... or perhaps of naïveté.\n\n"Through the grace of God... and the blood of our brothers, we have returned as the masters of this nation." The man moved his hands in a quick prayer before addressing his audience again. "But we have not yet dealt with the traitors on our peninsula."\n\n"We must end the Portuguese regime that acquiesces to disorder!" A chant sounded through the pews. Grunts. Yells.  "They lied! Lied to our faces with deceit! Lied until the Marxist wretches in the Basque rose up! There... there the Portuguese showed their loyalties... their treachery... their willingness to leave us to die in our crusade against the infidel bastards!"\n\nThe cheers grew even louder. Firearms cracked, and bullets ricocheted in the House of God. Stomps rumbled through the aisle, growing faster and faster, brimming with an intensity that could only mimic a fraction of His Divine Wrath.\n\n"All remaining rebels will bow down to the Spanish National Council! For it will be this war, and this war alone, that they earn salvation from communist and foreign subjugation, and be brought back to the fold as part of our Holy Union!""
 FZL_wars.100.a: "In nomine Patris, et Filii, et Spiritus Sancti."
#Tooltips
FZL_Portugal_War_Ready: "§YWe may now invade whatever weak regimes squabble over Lisbon.§!"
