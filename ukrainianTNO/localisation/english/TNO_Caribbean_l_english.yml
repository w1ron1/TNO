 JAM_flavor.25.t: "Why?"
 JAM_flavor.25.desc: ""Why did I drag myself to this fucking island? Augustin had been asking himself this question for the entire past week. Right now, he was shaking inside an armored bus that was slowly ramming through an endless human crowd with a strained roar. Rocks, pieces of rebar, and other trash drummed like hail against the plating. Next to him, gripping their assault rifles with white-knuckled fingers, sat two armed guards - raw recruits, younger than himself. A sea raged outside the windows: thousands of fired miners and their embittered, starving families had blockaded the streets of Kingston. The police were nowhere to be seen - along with the economic collapse, a complete collapse of the Jamaican state had arrived.\n\nWhy is there no news from out there? Augustin had received his last letter from home exactly two weeks ago, and then all communications were cut. Back in the motherland, communists, Falangists, republicans, monarchists - it seemed the entire political spectrum had mixed in the primordial soup of the Iberian Wars. When Madrid and Lisbon went up in flames, the state corporations cut off the oxygen. One hundred and seventy-five. One hundred and seventy-five mines on the island ground to a halt overnight, spitting tens of thousands of destitute workers onto the streets.\n\nWhy do they look at us like that? To the Black Jamaicans, the few Iberians who still remained on the island had overnight become traitors and the embodiment of pure evil, because they, unlike the locals, somehow still had jobs. The malice-contorted faces beyond the bulletproof glass didn't know the most important thing: these jobs would last a month at most. Investors were panic-dumping their assets, and the last corporation was also about to flee the sinking island. To the muffled thuds of rocks striking the bus, Augustin could only pray that the company, while evacuating its capital, wouldn't leave him behind on this cursed island.""
 JAM_flavor.25.a: ""Why him, of all people?""

 JAM_flavor.26.t: "Busta Busted"
 JAM_flavor.26.desc: "FBI Intelligence Report: Bustamante's Plea\n\nFollowing the collapse of the Iberian Union and the peninsula's subsequent economic breakdown, Jamaica's central bank has entered a state of bankruptcy. The suspension of many national programs and other government-funded projects due to a withdrawal of Iberian corporate investments precedes a surge in unemployment, and in other cases, criminality. Alexander Bustamante's Jamaican Labour Party cabinet is seeking an American bailout, without other options.\n\nBustamante has, therefore, requested a meeting with American ambassadors in order to convey the current crisis in Jamaica as a humanitarian concern, citing the nation's reliance on foreign funding, and its current lack thereof, to be in the interest of the United States for mending its relations with the island nation. He offers to provide the same concession as was provided to enterprises of the Iberian Union if the United States government guarantees renewed support to the JLP-led government. However, he refused any suggestion of regime change or internal reforms.\n\nOn account of the JLP's current domestic unpopularity and Bustamante's unwillingness to accept American counsel, Jamaica will likely face significant political instability and undergo a depression, provided Bustamante remains in his position as head of state. The country is predicted to be at a high risk of social collapse in the short term."
 JAM_flavor.26.a: "Stubborn as always, not a bit of humility in his mouth."
 JAM_flavor_26_tt: "Due to the collapse of the §nIbe§!§Orian§! §fUnion§!, §dBustamante§! has come crawling back to us!\n...But we have not forgotten about his defiance, and a §Rtraitor§! is always owed his due."

 JAM_flavor.27.t: "Red Sky in Morning"
 JAM_flavor.27.desc: ""We, for one, are impressed with Billy Strachan. Few men have shown such a firm capacity to resist fascism, and few men have shown such a strong commitment to the ideals of decolonization and pan-Africanism as Strachan. Washington will find itself far more challenged than it may expect..." - The Black Panther, Editorial, [GetDateText]...\n\n"...and I completely condemn Billy Strachan's coup in Jamaica. Bolshevism has failed Russia, failed China, and is now due to fail Jamaica. When radicals like the Black Panther Movement claim to want equality, all they want is equality in tying your noose. The Bolshevist strand of equality will not be satisfied with one island..." - Remarks from Richard Russell Jr., 14:00 [GetDateText]...\n\n"The United States was stuck. The natural impulse was to issue a condemnation, but anything further and public would stretch American diplomatic efforts. Cuba and Mexico were both already distant enough from the American sphere, and Castro made particular note to commend the Jamaican revolutionaries. As such, American efforts against Strachan drifted towards espionage." - Potemkin in Portmore: The United States and the Caribbean Left, 1959-72...\n\n"The Act Condemning Jamaican Extremism, which will implement sanctions on a number of Jamaican products and will issue an explicit condemnation of its new government, passed through the House of Representatives by a margin of 432-0, and is expected to pass through the Senate today unanimously. However, civil rights organizations have lambasted it as an unconscionable violation of Jamaican sovereignty..." - ABC Television Broadcast, [GetDateText], 15:00"
 JAM_flavor.27.a: "A revolution abroad, a convulsion within."

 JAM_flavor.28.t: "By the Skin of His Teeth"
 JAM_flavor.28.desc: "Leaning down slightly, Luis González-Mata struggled to hide himself from the cameras held by journalists, their chorus failing to pierce the wall of the Iberian security forces fleeing around him. Above them, the blades of a helicopter whirred impatiently, drowning out the questions being fielded at them. As he entered the vehicle, he slinked out of view, hiding behind the door, unable to justify sitting down to himself. Not that the journalists would stay much longer, he thought. As soon as the Bolshevists had their way, they'd be out. Or else.\n\nThat a Jamaican Revolution had even occurred was his first mistake. He had followed the growing radicalization of the Jamaican populace for months, but had never expected it to be nearly this advanced, or to proceed so rapidly. By the time street protests had devolved into revolution, he was only just getting in touch with what members of his spy network hadn't already been killed. Bustamante was to blame for that. He was never a secure ally, thought González-Mata, and always liked to pretend he had more control than he actually did.\n\nOf course, his immediate priority was escaping. His helicopter was chartered to land a few kilometers out from Managua, but the journey back could not be chartered in time. He had an identity planned, of course; for the next day, he would be Miguel Ortega-Iglesias, a businessman and owner of a car factory in Valladolid, visiting Managua to discuss the idea of using natural rubber, and now looking to return through Madrid. But what was to come of him once he was back?\n\nIberia had lost a major ally in the Caribbean, with no warning, and a lot of good agents alongside them. He knew they'd want a scapegoat of some kind, and that he was perfect for a cull. He didn't know whether to expect a demotion to another branch of Iberia's spy network in America, or to expect his imminent removal. As the helicopter took off, he finally crumpled down, head planted firmly in his hands.\n"
 JAM_flavor.28.a: "And as the revolution claimed the mind of one more individual."

 JAM_flavor.29.t: "Smiles And What Lies Behind"
 JAM_flavor.29.desc: "On the streets of Queens, there was the smell of grilled meat and the sight of green and black triangles flanked by golden stripes flooding the air. The Jamaican emigre community had taken the foundation of the new republic with impromptu block parties, excited at the success of the revolution. As the food and beer passed from hand to hand, there was one man, smiling and joking with the revelers, who was not smiling.\n\nLincoln Bullock's family had emigrated from Jamaica when he was a boy, and he had made a name for himself as both a bright kid and a popular one. He had been recruited by the FBI right out of school, not that he needed much convincing after his father had been shot by two Nazi sympathizers during an anti-fascist rally. He was bilingual, easy-going, and above all, a patriot. A natural fit to work, in his own small way, for the Caribbean office.\n\nAfter the revolution, there had been fear that the PNP, always close with the emigre communities in the US, would feel emboldened and create domestic unrest for the United States. If they had joined hands with the black nationalist movements, they might pose a problem. Some dreaming fools might believe a revolution could succeed anywhere, but what Lincoln feared was the smaller things - violent protest that left another little boy without a father.\n\n"Isn't it crazy what's going on on the island? Finally got a place that's ours, nobody else's. I'm thinking of going back, once I save up. Best I see it for myself."\n\n"Not a bad idea," Lincoln lied, "though I think I'll wait a bit for things to calm down first. You never know, you know?""
 JAM_flavor.29.a: "Lincoln smiled, he joked, but above all, he listened."

 JAM_flavor.30.t: ""
 JAM_flavor.30.desc: ""
 JAM_flavor.30.a: ""

 JAM_flavor.31.t: "Preacherman"
 JAM_flavor.31.desc: "In the smoky halls of San Juan Station, Theodore Shackley read the report in his hands. Operation Rotten Cardinal had finally finished moving money to keep the JLP propped up. Manley had hoped to decimate the JLP with the riots and secure an uncontested political future for himself. An easy enough idea, but Manley should have learned from the success of his own movement: killing an idea was hard work.\n\nMoney didn't talk, but it did make words easier to hear. Labor unions listened when Manley discussed working conditions, but when an FBI operative pointed out that Manley would pressure the union to ensure that his people were put in leadership roles, that had made them receptive to propping up the JLP to hedge their bets, with a little cash in their pockets, of course. Organized crime was a fact of life in Jamaica, and when the FBI pointed out that Manley would use them as a scapegoat to score political points for himself, they became a bit more receptive to their talking points and their bribes. Other politicians were the easiest of all; Manley made no secret about his ambitions. Any politician with ambition of his own would know that there couldn't be two suns in the sky, but anyone who even wanted to genuinely serve his country would know that losing favor could mean the end of everything, and that meant insurance through the JLP was a safe bet.\n\nA tailored homily for every group, and now all they needed was a figurehead to rally behind. After Bustamante's spectacular fall, a new figure needed to arise from the ashes, and this time, it had to be someone much more reliable. A figure perhaps, that already had ties to the San Juan office and so could benefit from analysis from back home, and that could reliably ensure that the flock would be sufficiently motivated to work for the greater good of all."
 JAM_flavor.31.a: ""Edward Seaga. He's who we want for this." Shackley extinguished his cigarette and put the file down."

 JAM_flavor.32.t: ""
 JAM_flavor.32.desc: ""
 JAM_flavor.32.a: ""

 JAM_flavor.33.t: "Waking Reality"
 JAM_flavor.33.desc: "A dream years in the making was coming to an end. Peter sighed as he hung up the phone, closing yet another business account and getting the money out of the country. He tried to ignore the sounds of the construction crews taking the kitchen out the back, piece by piece. He could have left it behind, but it was worth enough on the resale that it was worth getting out of Jamaica before the hammer came down.\n\nAll Peter wanted was to own a hotel, to bring people joy on their vacations and make a living in the process. And for a while, life had been good. Profits were up and he was hoping to expand, but then came Manley and the revolution. Instability was bad in the short term, but when Manley took over and started his rhetoric, Peter knew his days were numbered. The banks would be broken into, and all foreign-held assets would be seized, and anything Manley wanted, especially if it was owned by an American, would be taken without compensation. So all his hard work, up in smoke because one man's greed could never be sated.\n\nOver the radio, the announcer gave the news that the tungsten mines on the island were to be nationalized. They played back Manley's quote, where he spoke of tungsten's national importance and his promise to improve working conditions in the mines. Then he stated, "We seek a democratic path to socialism, we seek equality and dignity for all. We are not tyrants here to say that we shall take everything. All we want is for our workers to be treated like people, for them to own and achieve their own fulfillment just like any other man would." Just words, thought Peter. Since a foreigner and a businessman didn't count as a person, then he was most certainly exempt from Manley's high-minded protestations. He didn't want to hurt Jamaica, but they seemed intent on harming him."
 JAM_flavor.33.a: "Peter could hear Manley's voice over the radio quiver. The bastard didn't even have the decency to lie well."

