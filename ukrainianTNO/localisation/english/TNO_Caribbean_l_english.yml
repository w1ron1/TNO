 JAM_flavor.71.t: "People's Freedom Party Wins 1972 Jamaican Election"
 JAM_flavor.71.desc: "SECRET/[GetDateText]\n\nFROM THEODORE SHACKLEY\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: VICTORY OF JAMAICAN RADICALS IN ELECTION\n\n1. Our previous efforts to platform moderates within the Jamaican Popular Republic were in vain. The People's Freedom Movement has won with a resounding victory and will ensure that Richard Hart remains Prime Minister. Moderate elements have been largely secluded and will only come to power via regime change.\n\n2. The elections were conducted with relatively little state interference, but those classed as dissidents were totally barred from participating, and only Michael Manley provided a meaningful alternative. Richard Hart declared victory early, but his initial confidence was well-founded. Further collectivization and nationalization efforts are due, and Hart has explicitly condemned American efforts.\n\n3. At this stage, the only means of gaining a sympathetic ally in Jamaica will be through a coup. Opposition to Hart's rule is disorganized, but present, and should be given far greater funding. Michael Manley is unwilling to engage in a coup, but deputies in the People's National Party, as well as exiled opposition figures like Edward Seaga, could be viable successors."
 JAM_flavor.71.a: "FIDELITY, BRAVERY, INTEGRITY"

