 Caribbean_flavor.238.a: ""

 Caribbean_flavor.239.t: "Яструб Бриджтауна"
 Caribbean_flavor.239.desc: "Ейлін Р. Донован стояла під сяйливими люстрами Великої зали асамблеї Бриджтауна, її вираз обличчя був непроникним, але її присутність неможливо було не помітити. Вона відвідала десятки подібних церемоній, але мало які з них мали таку вагу, як сьогоднішня: офіційне представлення Карибського щита, пакту про взаємну оборону між членами ВІКУ.\n\nКолись молода дівчина з Бостона, Ейлін, яка свого часу була аташе, що пробирався крізь охоплений морозом хаос сибірської інтервенції, пробилася до вищих ешелонів дипломатичної служби; одна з небагатьох жінок, кому це вдалося, і ще менше тих, хто мав її репутацію. Вона була прихильницею жорсткої лінії та невблаганною, живим доказом того, що жінка може легко зайняти чоловіче місце.\n\nКоли прем'єр-міністр Том Адамс завершив свій виступ, красномовний заклик до єдності та пильності, Ейлін швидко пройшла крізь натовп дипломатів. Її рукостискання було твердим, її привітання щирим. Вона нахилилася рівно настільки, щоб чітко донести свою думку: "Америка з Барбадосом. І з вами."\n\nКариби змінювалися, і не на краще. Ейлін знала, що за посмішками та промовами регіон готується до чогось похмурішого.\n\n"
 Caribbean_flavor.239.a: "І вона була на передовій."

 Caribbean_flavor.240.t: "Шосте велике озеро Америки"
 Caribbean_flavor.240.desc: "Колись молода дівчина з Бостона, Ейлін Р. Донован стояла під сяйливими люстрами Великої зали асамблеї Бриджтауна, разючий контраст із її часом як аташе, що пробирався крізь охоплений морозом хаос сибірської інтервенції. Її вираз обличчя був непроникним, але її присутність неможливо було не помітити.\n\nЕйлін пробилася крізь дипломатичну службу, ставши однією з небагатьох жінок, які обіймали посаду посла. Вона була надзвичайно прихильна до жорсткої лінії та невблаганна, а її світогляд сформувався під час перебування в Сибіру.\n\nВона відвідала десятки подібних церемоній, але мало які з них мали таку вагу, як сьогоднішня: офіційне розширення ВІКУ з метою включення більшої політичної інтеграції, що ознаменувало початок наднаціональної федерації.\n\nКоли прем'єр-міністр Том Адамс завершив свій виступ, прямий заклик до єдності та інтеграції між карибськими державами, Ейлін швидко пройшла крізь натовп дипломатів. Її рукостискання було твердим, її привітання щирим. Вона нахилилася рівно настільки, щоб чітко донести свою думку: "Ми, американці, раді чути, що Барбадос пам'ятає про американські інтереси."\n\nАдамс твердо потиснув її руку, насолоджуючись схваленням американців, а Ейлін подумки відзначила захват Адамса, продовжуючи нишпорити залом, стежачи за іншими дипломатами, відмічаючи, хто потискав руки, вигукував похвалу, а хто — ні.\n\nКоли зустріч завершилася, Ейлін була впевнена у своїй оцінці інших дипломатів і в тому, що Кариби повільно спрямовуються до того, щоб стати американським озером. Подобається їм це чи ні.\n\n"
 Caribbean_flavor.240.a: "Так і має бути."

 ### Caribbean News Events
 #Remember, all News Events must have the header in their title loc piece
 #Also remember to add matching event options to the event itself in the TNO_Caribbean event file
 Caribbean_News.1.t: "[Get_newspaper_header]Хаос охоплює Британську Вест-Індію"
 Caribbean_News.1.desc: "У Вест-Індії спалахнули протести після вторгнення Карибського легіону до Домініканської Республіки, а страйки на бананових плантаціях Навітряних островів, масові демонстрації проти чинної адміністрації Бустаманте на Ямайці та спроби блокувати ворота військової бази Чаґуарамас у Тринідаді переросли в скоординований спалах заворушень у багатьох міських районах островів.\n\nВлада намагалася контролювати спалах безладу під вигуки, що закликали до фундаментальних реформ, більшого добробуту та припинення нерівного правління. Також широко повідомлялося про мародерство та вандалізм, а в'язниці, за повідомленнями, були переповнені затриманими. Хоча місцеві адміністрації поспішили охарактеризувати заворушення просто як прояви злочинного oportunізму, навіть найвідданіші лоялістські видання регіону визнали, що вони демонструють необхідність справжніх реформ, інакше ті, хто штовхає натовп, досягнуть свого.\n"
 Caribbean_News.1.a: "Кариби схиляються перед бурею..."

 Caribbean_News.2.t: "[Get_newspaper_header]Анґілья відокремлюється від Підвітряних островів"
 Caribbean_News.2.desc: "Постійні зустрічні вітри, що сколихують Вест-Індію, досягли, здавалося б, тихого острова Анґілья. Повідомляється, що місцева палата зборів, розчарована тим, що вона називає "постійним перешкоджанням" її правам і розвитку з боку уряду Федеральної колонії Підвітряних островів у Сент-Джонсі, проголосувала за відокремлення від федерації та вигнала представників центрального уряду, заявивши, що тепер підпорядковуватиметься лише безпосередньо канадському уряду.\n\nПісля голосування тимчасовий головний міністр Рональд Вебстер подав уряду Канади петицію із закликом до Оттави "відновити порядок" на острові, щоб "забезпечити його стабільний розвиток", обійшовши посередників у Сент-Джонсі та передавши острів під пряме канадське правління. Канадська влада досі не надала відповіді, і багато спостерігачів вважають, що вона буде обережною, перш ніж знову змінювати статус-кво в Карибському басейні.\n"
 Caribbean_News.2.a: "Якщо це воля народу..."
 Caribbean_News.2.b: "Навіть у власному дворі ОВН дає збій."
 Caribbean_News.2.c: "Виразний запах можливостей..."
 Caribbean_News.2.d: "Співдружність вистоїть."

 Caribbean_News.3.t: "[Get_newspaper_header]Автономію Анґільї визнано"
 Caribbean_News.3.desc: "Сьогодні сепаратистське повстання на Анґільї завершилося, коли Оттава несподівано поступилася вимогам місцевих лідерів щодо прямого контролю з боку їхніх колишніх сюзеренів на Підвітряних островах, гарантуючи острову автономію.\n\nХоча це рішення загалом позитивно сприйняли в Карибському басейні та Америці, над Співдружністю все ще нависає тінь нестабільності через чутки, що американський тиск був головним чинником цього рішення, тим самим підриваючи суспільну довіру до суверенітету Оттави в її ролі опікуна.\n\nХоча достовірність чуток не може бути підтверджена, цей результат свідчить про надії на реформи. Зростають побоювання щодо потенційного краху усталеного післявоєнного порядку у Вест-Індії, оскільки регіон повільно руйнується під тиском суперницьких гегемоній.\n"
 Caribbean_News.3.a: "Найкращий результат, на який ми могли сподіватися."
 Caribbean_News.3.b: "Як би вони не намагалися, тріщини не зафарбувати."
 Caribbean_News.3.c: "Бунтівна Співдружність моргнула першою."

 Caribbean_News.4.t: "[Get_newspaper_header]Кінець відокремлення Анґільї"
 Caribbean_News.4.desc: "Коли уряд острова Анґілья відокремився від Федеральної колонії Підвітряних островів і закликав Оттаву встановити пряме правління над островом, багато хто вважав, що канадський уряд буде змушений прийняти вимогу, адже вона була висунута як вираження народної волі. Однак ці сподівання тепер рішуче розвіяно: канадський представник засудив повстанців і заявив про підтримку суверенітету Федерації Підвітряних островів.\n\nПозбавлений підтримки Канади, головний міністр Анґільї Девід Вебстер неохоче оголосив, що острів готовий повернутися до Федерації, попросивши амністію для повстанців і повагу до місцевої автономії. Хоча Сент-Джонс наразі може зітхнути з полегшенням, повстання стривожило багатьох у регіоні, посиливши побоювання, що конфлікт може стати болючим місцем на довгі роки.\n"
 Caribbean_News.4.a: "Порядок у Карибському басейні має зберігатися."
 Caribbean_News.4.b: "Катастрофу знешкоджено чи лише відкладено?"
 Caribbean_News.4.c: "Крики англосаксів про "самовизначення" справді порожні..."

 Caribbean_News.5.t: "[Get_newspaper_header]Фарс Анґільї"
 Caribbean_News.5.desc: "Після того як острів Анґілья проголосував за відокремлення від Федерації Підвітряних островів і закликав Канаду керувати його справами, багато хто вважав, що рішення Канади визначить долю або знищить сепаратистський рух. Однак заклик Канади до Анґільї повернутися до Федерації викликав величезну лють на острові, а головний міністр Девід Вебстер заявив, що "вірні сини імперії були зраджені самою короною, якій вони вірно служили".\n\nОскільки Анґілья тепер вирішила оголосити себе повністю незалежною республікою, Канада мобілізувала свої сили для вторгнення на острів і придушення повстання. Хоча Оттава заявляє, що такий курс необхідний, щоб не допустити занурення Вест-Індії в хаос, канадська громадськість та міжнародна думка, схоже, не переконані, що крихітний острів вартий вторгнення, і протести вже почали стрясати канадські міста.\n"
 Caribbean_News.5.a: "Навіть найменші острови можуть стати найнестабільнішими пороховими бочками..."
 Caribbean_News.5.b: "Розтрачені, вкрадені перлини меншої половини Імперії."
 Caribbean_News.5.c: "Англосаксонський імперіалізм демонструє свою слабкість."

 Caribbean_News.6.t: "[Get_newspaper_header]Плани Федерації Вест-Індії оформлено"
 Caribbean_News.6.desc: "Мальовничий курорт «Крейн» на Барбадосі став тлом для переломного моменту в історії Британської Вест-Індії. Делегати Крейнської конференції вирішили створити федерацію між карибськими островами, що залишилися під владою Канади, залишивши осторонь лише Багами. Концепція, заснована на пропозиціях, написаних домінованою США Комісією Вест-Індії, створить високодецентралізовану федерацію островів із суттєвим канадським наглядом, але все ж незалежну.\n\nПісля встановлення дати конституційної конвенції оптимізм панує як серед урядів ОВН, так і серед народів Вест-Індії. Будь-які скептики, занепокоєні подальшим економічним домінуванням у регіоні чи експлуатованим вакуумом влади, були заглушені захопленням потенційною незалежністю."
 Caribbean_News.6.a: "Свобода давно назріла."
 Caribbean_News.6.b: "Занадто далеко, занадто швидко."
 Caribbean_News.6.c: "Подивімося, як далеко вони зайдуть."

 Caribbean_News.7.t: "[Get_newspaper_header]Антиурядові протести в Кінґстоні, Ямайка"
 Caribbean_News.7.desc: "У Кінґстоні спалахнули заворушення після того, як сили безпеки жорстоко розігнали протестувальників, які вимагали виборів перед конституційною конвенцією Федерації Вест-Індії, убивши активіста Генрі Ґантера. Вважається, що багаторічний прем'єр Александер Бустаманте санкціонував напад поліції та озброєних членів своєї Ямайської лейбористської партії, а тепер попереджає, що не виявлятиме милосердя до тих, хто загрожує Ямайці.\n\nМайкл Менлі з опозиційної Народної національної партії зажадав відставки Бустаманте, тоді як деякі канадські чиновники назвали жорстоку тактику прикрою, але виправданою, посилаючись на присутність комуністів із бригади Чорної зірки серед протестувальників. Враховуючи центральну роль Кінґстона в запланованій Федерації, зіткнення на вулицях столиці можуть визначити не лише майбутнє Ямайки, а й усієї Вест-Індії.\n"
 Caribbean_News.7.a: "Бустаманте міг просто провести кляті вибори — тепер він має піти." #US
 Caribbean_News.7.b: "Подивимося, чи вистачить Бустаманте того, що потрібно, щоб стати ямайським каудильйо." #Iberia
 Caribbean_News.7.c: "Між деспотом і бригадою Чорної зірки... національна революція — єдиний шлях уперед." #Mexico
 Caribbean_News.7.d: "Монарх Кінґстона дивиться в очі революції." #Other

 Caribbean_News.8.t: "[Get_newspaper_header]Різанина в Кінґстоні, оголошено воєнний стан"
 Caribbean_News.8.desc: "Заворушення в Кінґстоні, Ямайка, проти прем'єра Бустаманте завершилися криваво після того, як Бустаманте наказав поліції відкрити вогонь по протестувальниках. За оцінками, 126 протестувальників були вбиті поліцією під час жорстокого протесту в районі Тіволі-Ґарденс столиці.\n\nПісля цього Бустаманте оголосив надзвичайний стан і заявив про заборону всіх опозиційних партій. ОАД виступила із засудженням дій, а США вирішили призупинити допомогу в розвитку обложеному острову. Ізольований прем'єр тепер звертається до своїх раніше таємних союзників в Іберійському Союзі як до останньої лінії підтримки. Експерти припускають, що незабаром Ямайка проголосить незалежність, дозволивши Бустаманте закріпити свою владу через нову конституцію. Криза в Кінґстоні, схоже, стала цвяхом у труні американських зусиль зі створення Федерації Вест-Індії з британських карибських колоній.\n"
 Caribbean_News.8.a: "Від одного господаря до іншого."
 Caribbean_News.8.b: "Падає ще одне доміно..."
 Caribbean_News.8.c: "Актив чи тягар?"

 Caribbean_News.9.t: "[Get_newspaper_header]Чорна зірка піднята над Кінґстоном"
 Caribbean_News.9.desc: "Заворушення на Ямайці завершилися одним із найнесподіваніших способів: бригада Чорної зірки взяла владу на Ямайці. Бригада Чорної зірки є комуністичним чорним націоналістичним крилом на периферії Карибського легіону. Їм вдалося взяти контроль над Ямайкою після боротьби проти невдалого самоперевороту Бустаманте.\n\nЛідер бригади Чорної зірки, Біллі Страчен, служив у Королівських військово-повітряних силах під час Другої світової війни, перш ніж служити в Карибському легіоні та стати політично активним на Ямайці. Він запросив Майкла Менлі та його соціал-демократичну ННП приєднатися до нового уряду, але поміркованих уже обійшли зліва..\n\nНовий уряд опинився в хиткому становищі, маючи мало або зовсім не маючи союзників і небагато сусідів із подібною ідеологією. Багато хто очікує, що країна розпадеться найближчим часом.\n"
 Caribbean_News.9.a: "Хто це такі?!"
 Caribbean_News.9.b: "Приємний сюрприз."

 Caribbean_News.10.t: "[Get_newspaper_header]Ямайка скасовує монархію, проголошує повну незалежність від Британії"
 Caribbean_News.10.desc: "Після місяців протестів, як насильницьких, так і словесних, та референдуму з переважною підтримкою скасування британської монархії Ямайка нарешті проголосила незалежність, призначивши свого першого обраного прем'єр-міністра Майкла Менлі, лідера ННП. Прийшовши до влади з обіцянкою відбудувати країну після тривалої революції, Менлі є фабіанським соціалістом, зосередженим на рівності в економічному розвитку при збереженні дружньої зовнішньої політики.\n\nХоча Менлі висловлював недовіру до американської гегемонії в Карибському басейні, він вирішив зберегти всі нинішні зв'язки, водночас поступово зближуючись із Мексикою, яка надала підтримку ННП під час виборчої кампанії. Хоча ЯЛП Бустаманте все ще існує після його поразки, її домінуюче становище було назавжди заплямоване, і вона, ймовірно, вже ніколи не відновиться."
 Caribbean_News.10.a: "Старий порядок здригається."
 Caribbean_News.10.b: "Ми можемо з цим працювати... можливо."
 Caribbean_News.10.c: "Вільна Ямайка для всіх."

 Caribbean_News.11.t: "[Get_newspaper_header]Бустаманте йде у відставку, заворушення в Кінґстоні згасають"
 Caribbean_News.11.desc: "Місяці насильства, що стрясали серце Ямайки, сьогодні, схоже, нарешті завершилися, коли прем'єр Бустаманте офіційно подав у відставку, залишивши на своєму місці свого протеже Дональда Сенґстера. Сенґстер є давнім прихильником ЯЛП Бустаманте, але вже пообіцяв поступові реформи та розпочав переговори з учасниками заворушень.\n\nСША надіслали Сенґстеру привітання, а той, своєю чергою, зобов'язався взяти участь у Конституційній конвенції Вест-Індії. Схоже, плани щодо Федерації Вест-Індії близькі до здійснення.\n"
 Caribbean_News.11.a: "Чи справді щось змінилося?"
 Caribbean_News.11.b: "Демократія перемагає!"

 Caribbean_News.12.t: "[Get_newspaper_header]Карибська осінь"
 Caribbean_News.12.desc: "Мрія про Федерацію Вест-Індії, схоже, померла після того, як конституційна конвенція запропонованої країни перетворилася на суперечки та сварки між карибськими державами. Усе це відбувається на тлі відсутності в регіоні великої економіки, що нависає над майбутнім.\n\nЦя нестабільність виникла після того, як Ямайка, стрижень запропонованої федерації, вийшла з конвенції після заворушень проти Бустаманте. До американських і канадських чиновників не вдалося додзвонитися для коментаря, але можна припустити, що вони розчаровані розвитком подій. Майбутнє Карибського басейну, схоже, полягає в незалежності та роз'єднаності."
 Caribbean_News.12.a: "Ще одна вільсонівська ідея зазнає краху."
 Caribbean_News.12.b: "Невже вони просто не можуть хоч раз працювати разом?"
 Caribbean_News.12.c: "Хто намагався б об'єднати стільки різних народів?"
 Caribbean_News.12.d: "Ямайка, як Давид, перемагає Ґоліафа колоніалізму."

 Caribbean_News.13.t: "[Get_newspaper_header]Створення Федерації Вест-Індії"
 Caribbean_News.13.desc: "Сьогодні неможливе стало можливим із утворенням Федерації Вест-Індії. Через нестабільність у регіоні після заворушень у Кінґстоні вважалося малоймовірним, що стабільність чи компроміс повернуться до регіону найближчим часом — угоди вдалося досягти лише завдяки практично дипломатичному диву.\n\nОб'єднавши більшість різноманітних британських колоній у Вест-Індії під єдиним федеральним урядом, що перебуває під наглядом британської монархії, ВІФ надає тубільцям найбільше самоврядування з часів колонізації. На честь цього королева Єлизавета провела урочисту церемонію в Бриджтауні, Барбадос, новій столиці країни, передавши естафету незалежності народам Карибського басейну.\n\nІснування ВІФ є величезною перемогою для американців в Атлантиці. Однак, з огляду на більші повноваження, які британці можуть використовувати в управлінні, вони неминуче колись зіткнуться з тубільцями.\n"
 Caribbean_News.13.a: "Маленькі острови, які змогли."
 Caribbean_News.13.b: "Принаймні цей розділ закрито."

 Caribbean_News.14.t: "[Get_newspaper_header]Федерацію Вест-Індії рятують США та Канада"
 Caribbean_News.14.desc: "Поки світ усе ще оговтується від нафтової кризи, глобальна нестабільність, що зростає, вдарила по Вест-Індії вздовж Карибського басейну. Щоб запобігти банкрутству Федерації Вест-Індії, Сполучені Штати Америки та Канадська Співдружність надали уряду в Бриджтауні фінансову допомогу.\n\nУ результаті канадський уряд отримав непропорційно великий ступінь контролю над урядом Вест-Індії, використовуючи свій вплив, щоб в односторонньому порядку продати великі ділянки землі ОВН для будівництва військових об'єктів на островах. Ліва опозиційна Федеральна лейбористська партія, яку підтримують провідні діячі Майкл Менлі та Ерік Вільямс, розкритикувала спільні американсько-канадські заходи як акт неоімперіалізму, тоді як широке невдоволення цим рішенням уже поширилося Карибським басейном, імовірно, створюючи проблеми в майбутньому.\n"
 Caribbean_News.14.a: "Історія пригноблених народів та експлуататорських чужинців віддзеркалюється крізь вогонь і дим."
 Caribbean_News.14.b: "Необхідність перед лицем негараздів."

 Caribbean_News.15.t: "[Get_newspaper_header]Повстання Чорної сили придушене полком Вест-Індії"
 Caribbean_News.15.desc: "Вулиці Тобаґо знову тихі, коли Федерація Вест-Індії оголошує про перемогу над повстанням Чорної сили. Народжена зі спалаху антиамериканських настроїв і бажання відокремитися від решти ВІФ, самопроголошена Народна Республіка марунів була знову включена до ВІФ — але якою ціною.\n\nЧерез те, що військо Федерації було відносно новим і неорганізованим, операція ВІФ швидко перетворилася на дорогу, криваву справу для обох сторін. Заручники, цивільні та військовополонені були вбиті через неорганізованість операції, залишивши після себе зруйновану пустку на Тобаґо. Оскільки і сила, і репутація ВІФ були підірвані, малоймовірно, що стабільність повернеться до регіону протягом тривалого часу."
 Caribbean_News.15.a: "Усе це кровопролиття — і заради чого?"

 Caribbean_News.16.t: "[Get_newspaper_header]Повстання Чорної сили придушене інтервенцією США"
 Caribbean_News.16.desc: "Сьогодні надії на незалежний Тобаґо було розбито, коли на острів увійшли військові сили Сполучених Штатів, придушили революціонерів і звільнили заручників. Самопроголошена Соціялістична Республіка марунів, що виникла після спалаху антиамериканських настроїв на острові, була розбита силами американських морських піхотинців, повернувши його до Федерації Вест-Індії.\n\nХоча кризу було врегульовано, на міжнародному рівні все ще залишаються сумніви щодо того, чому і як ситуація у ВІФ погіршилася до такого рівня, а особливо щодо ролі канадського та американського урядів у всій цій справі від самого початку. Крім того, придушення Республіки спричинило хвилю античорних контрпротестів проти активістів за громадянські права чорних у всій Америці. Яким би не був результат, малоймовірно, що репутація ВІФ найближчим часом відновиться.\n"
 Caribbean_News.16.a: "Червону зірку загашено."
 Caribbean_News.16.b: "Нехай не розірветься жоден ланцюг, щоб решта не пішла за ним."

 Caribbean_News.17.t: "[Get_newspaper_header]Тринідад і Тобаґо відокремлюються від Федерації Вест-Індії на тлі кризи банкрутства"
 Caribbean_News.17.desc: "У відповідь на політичний тиск Сполучених Штатів Америки з метою запровадження масштабних економічних і політичних реформ у Карибському басейні уряд Еріка Вільямса в Порт-оф-Спейні офіційно оголосив про відокремлення Тринідаду і Тобаґо від Федерації Вест-Індії.\n\nСпочатку американська відповідь у Вест-Індії мала зробити їх фінансово спроможними отримати фінансову допомогу як контрзахід проти наслідків нафтової кризи. Тепер, попри попередні невдачі програми реформ тринідадського уряду, відомий радикал Вільямс використав американське втручання як привід для суперечливого кроку до незалежності. Наслідки цього, ймовірно, будуть серйозними, оскільки Тринідад і Тобаґо становили значну частину політичного та економічного організму Вест-Індії, а їхній вихід тепер ставить майбутнє федерації під загрозу.\n"
 Caribbean_News.17.a: "Колись просто ще один ідилічний острівний рай, тепер епіцентр переломного моменту в історії Карибського басейну."

 Caribbean_News.18.t: "[Get_newspaper_header]Кризу банкрутства Вест-Індії вирішено, оголошено про реформи"
 Caribbean_News.18.desc: "З Карибського басейну надходять насичені подіями новини після нафтової кризи та подій, що за нею послідували, — фінансова допомога Сполучених Штатів Америки для економіки Федерації Вест-Індії, що перебуває на межі краху. Ціна економічного втручання США виявилася, однак, високою, оскільки ціною повернення економіки Федерації на правильний шлях стало запровадження масштабних політичних та економічних реформ.\n\nОкрім скорочення торговельних бар'єрів і бюрократичної тяганини, це включає переписування федеральної конституції для централізації влади за зразком американської виконавчої гілки. Реформи також передбачають, що кожен із окремих островів, від Барбадосу до Ямайки та Тринідаду і Тобаґо, має привести свої фінанси до ладу після нафтової кризи. Хоча помітні страх і невизначеність щодо майбутнього, разом із ними приходять певне полегшення та обережна надія на майбутнє.\n"
 Caribbean_News.18.a: "Ми маємо знаходити втіху там, де можемо, навіть у раю."

 Caribbean_News.19.t: "[Get_newspaper_header]Федерація Вест-Індії приймає План Вільямса"
 Caribbean_News.19.desc: "Федерація Вест-Індії прийняла вимоги Еріка Вільямса, уникнувши потенційного розпаду. Уже занурена в економічний хаос через нафтову кризу, яка поставила Федерацію на межу банкрутства, суперечливі пропозиції Томаса Соуелла щодо лібералізації ринку були зустрінуті прямими погрозами відокремлення з боку Еріка Вільямса, губернатора Тринідаду і Тобаґо, самого ключового виробника нафти, а також альтернативною економічною пропозицією, яку підтримували Сполучені Штати та Канада.\n\nУ результаті Федерація Вест-Індії тепер проводитиме політику розвитку, зосереджену на інфраструктурі та тарифах, а Вільямс досяг успіху в мобілізації міжнародної підтримки. Продемонструвавши свою силу в цій суперечці та за значної централізації навколо Бриджтауна, його союзники в лівій Федеральній лейбористській партії Вест-Індії очікують отримати мандат на майбутніх виборах.\n"
 Caribbean_News.19.a: "Федерація готується вітати свого колишнього айсберга."

 Caribbean_News.20.t: "[Get_newspaper_header]Самопереворот на Антиґуа"
 Caribbean_News.20.desc: "Прем'єр-міністр Антиґуа та лідер Лейбористської партії Антиґуа Вір Берд сьогодні оголосив на острові надзвичайний стан, призупинивши вибори до подальшого повідомлення. Оскільки його першою дією став арешт провідних членів Прогресивної ліберальної партії, зокрема лідера партії Джорджа Волтера, багато хто вважає це ледь прихованою спробою створити диктатуру.\n\nЦя нестабільність виникла після краху запропонованої Федерації Вест-Індії, а такі сильні лідери, як Бустаманте з Ямайки, Адамс із Барбадосу та сам Берд, були важливими опорами цього проєкту. Схоже, що без федерації ці сильні лідери намагаються відновити своє правління через авторитаризм.\n\n"
 Caribbean_News.20.a: "Американський вплив може зайти лише так далеко."

 Caribbean_News.21.t: "[Get_newspaper_header]Утворено Федерацію Підвітряних островів"
 Caribbean_News.21.desc: "Через економічні та безпекові побоювання, що виникли внаслідок нафтової кризи, прем'єр-міністри Вір Берд з Антиґуа і Барбуди та Вільям Герберт із Сент-Кіттсу, Невісу й Анґільї погодилися об'єднати свої держави в обмежену Федерацію Підвітряних островів.\n\nЙмовірно, частково підживлений тривалим розчаруванням через крах проєкту Федерації Вест-Індії, цей новий союз, хоча й обмежений за масштабом і засобами, став несподіваною перемогою федералістського руху, а переговори про потенційне членство Монтсеррату та Віргінських островів уже тривають.\n\nОднак цей розвиток подій залишається затьмареним суперечками навколо обох його архітекторів, які, можливо, цілком доречно, відійшли від керівництва, залишивши його в значно менш суперечливих руках Фредеріка Альберта Філліпса."
 Caribbean_News.21.a: "Ще одне з того самого."

 Caribbean_News.22.t: "[Get_newspaper_header]Сент-Кіттс відбиває вторгнення найманців"
 Caribbean_News.22.desc: "З нещодавно незалежного Сент-Кіттсу і Невісу надходять драматичні сцени: озброєне вторгнення було відбито в перестрілці. Очолюваний американським найманцем, невдалий переворот отримав підтримку як невісських сепаратистів, так і консервативного Народного руху дії та мав на меті викрадення, а потім примусову відставку суперечливого прем'єр-міністра Роберта Ллевелліна Бредшоу, але був зупинений біля офіційної резиденції прем'єр-міністра.\n\nМаючи майже дюжину жертв, найманецькі сили були розгромлені, але події, що їм передували, викликали значне занепокоєння серед лівих сил Кіттса. Сполучені Штати засудили дії та пообіцяли притягнути винних до відповідальності, але настрій у Бастеррі набагато панічніший, а Бредшоу оголосив надзвичайний стан, щоб викорінити американський вплив."
 Caribbean_News.22.a: "Схоже, не всі острови можна купити грошима чи силою."

 Caribbean_News.23.t: "[Get_newspaper_header]Карибський флібустьєрський похід зірвано"
 Caribbean_News.23.desc: "Потенційна катастрофа минулої ночі в Сент-Кіттсі і Невісі перетворилася на фарс, коли очевидна спроба повалити його зароджуваний політичний порядок повністю провалилася. Очолюваний загоном найманців і, за повідомленнями, підтриманий невісськими сепаратистами та прихильниками Народного руху дії, переворот, як повідомляється, планував усунути суперечливого лівого прем'єр-міністра Роберта Ллевелліна Бредшоу, але провалився на першій же перешкоді.\n\nМіжнародна реакція майже не вважала це подією, вартою уваги. Бредшоу засудив дії разом з американським урядом, який заперечив будь-яку причетність і пообіцяв переслідувати причетних. Окрім кількох майбутніх арештів, однак, повна відсутність розвитку подій викликала мало інтересу, і поширена думка в регіоні схиляється до того, щоб просто звести цей фарс до історичної примітки.\n"
 Caribbean_News.23.a: "Вільям Вокер знову вирушає в похід — і знову зазнає невдачі."

 Caribbean_News.24.t: "[Get_newspaper_header]Прем'єр-міністра Домініки усунуто в парламентському перевороті"
 Caribbean_News.24.desc: "Через звинувачення в корупції та змові проти держави Едвард Леблан, популістський лейбористський лідер Домініки, був змушений піти у відставку членами власної Демократичної лейбористської партії. Ніколсон Дюкре, поміркований член партії, перебрав на себе попередні обов'язки Леблана та оголосив про намір поступово згорнути програми націоналізації та культурні програми Леблана.\n\nРаніше розкритикований американськими аналітиками за агресивний підхід до усунення іноземного впливу, включно з плантаційними підприємствами, які є невід'ємною частиною економіки острова, Куба та Мексика оприлюднили заяви, засуджуючи усунення Леблана як організовану, недемократичну акцію та натякнули на причетність США. Білий дім досі не опублікував жодної контрзаяви."
 Caribbean_News.24.a: "Гратися з вогнем ніколи не було гарною ідеєю."

 Caribbean_News.25.t: "[Get_newspaper_header]Створено другу Домініканську Республіку"
 Caribbean_News.25.desc: "У постколоніальному карибському ландшафті ще одна Домініканська Республіка виходить на перший план, коли прем'єр-міністр Едвард Олівер ЛеБлан проголошує незалежність Домініки від британської монархії. Відокремлення значною мірою є результатом нещодавніх конституційних реформ, які дозволили ЛеБлану запровадити на острові модель управління за прикладом Мексики, наслідуючи як хороше, так і погане.\n\nЦей повний розрив із системою Співдружності дозволив ЛеБлану ще більше інституціоналізувати домінування Домініканської лейбористської партії, водночас стримуючи інакодумство через поступки Мексиці та Кубі. Поки Розо називає свою масштабну кампанію націоналізації та дедалі більш диктаторські тенденції частиною ширшої "культурної революції", Сполучені Штати та їхні союзники засуджують поворот Домініки до деспотизму.\n"
 Caribbean_News.25.a: "Навіть диктатури скорочують витрати в цій економіці."
 Caribbean_News.25.b: "Сумніваюся, що Карибський легіон тут допоможе."

 Caribbean_News.26.t: "[Get_newspaper_header]Політична династія повертається на Барбадос"
 Caribbean_News.26.desc: "Том Адамс, син колишнього прем'єр-міністра Барбадосу Ґрантлі Адамса, також був обраний прем'єр-міністром країни. Це ще більше закріплює Лейбористську партію Барбадосу як провідну партію країни. Адамси повернулися до Іларо.\n\nОчікується, що Том Адамс продовжить ліберальне правління свого батька, водночас поглиблюючи вже міцні зв'язки з Канадою та Сполученими Штатами. Під час своєї інавґурації Адамс пообіцяв подальшу співпрацю та інтеграцію між державами WICU, причому роль Барбадосу як лідера ставатиме дедалі важливішою.\n\n"
 Caribbean_News.26.a: "Та просто вже дайте йому корону."

 Caribbean_News.27.t: "[Get_newspaper_header]Створення Карибської Спільноти"
 Caribbean_News.27.desc: "Після провалу Федерації Вест-Індії колишній прем'єр-міністр Барбадосу Ґрантлі Адамс створив Карибську Спільноту, митний союз, покликаний сприяти подальшій інтеграції її членів. Це сталося після нещодавнього створення Тринідадом Східнокарибського Союзу, якому новий блок прагне протистояти. Оскільки проєкт Адамса підтримує ОВН, схоже, що Холодна війна приходить до Карибів."
 Caribbean_News.27.a: "Чи зможе щось об'єднати острови?"

 Caribbean_News.29.t: "[Get_newspaper_header]Оголошено про створення Східнокарибського Союзу"
 Caribbean_News.29.desc: "Кидаючи виклик спільній долі відсталості, держави Тринідад і Тобаґо, Ґренада та Сент-Вінсент і Ґренадини увійшли до політичного союзу на тлі зростання нестабільності в регіоні. Під керівництвом прем'єр-міністра Тринідаду Еріка Вільямса Східнокарибський Союз прагне конкурувати з Федерацією Вест-Індії завдяки більш централізованому управлінню, зосередженому на соціальному та інфраструктурному розвитку його членів, що зрештою має перетворити острови на одну національну державу.\n\nОднак припущення, а також внутрішні звіти свідчать, що союз є експансіоністським кроком виключно на користь уряду Тринідаду, зважаючи на його непропорційно великі багатство та населення порівняно з рештою молодших партнерів. Незважаючи на це, це шлях геть від британців та американців, і без сумніву всі його члени приєдналися заради власної економічної вигоди.\n"  
 Caribbean_News.29.a: "Невелика, місцева імперія на півдні." 

 Caribbean_News.30.t: "[Get_newspaper_header]Дисиденти захопили Ґренаду, проголосили незалежність від Східнокарибського Союзу"
 Caribbean_News.30.desc: "Об'єднана лейбористська партія Ґренади Еріка Ґейрі згуртувала повстання флібустьерів, щоб відокремитися від Східнокарибського Союзу на знак протесту проти триваючої централізації під керівництвом Порт-оф-Спейна. Будучи відомим критиком членства Ґренади в СКС від самого його заснування, Ґейрі заперечив участь іноземних сторін у повстанні, приписавши його успіх волі народу.\n\nСхіднокарибський Союз засудив відокремлення Ґренади як акт американського імперіалізму, здійснений у відповідь на суперечку Тринідаду зі Сполученими Штатами щодо півострова Чаґуарамас. Вашинґтон закликає до екстреного засідання ОАД, щоб мирно врегулювати конфлікт."
 Caribbean_News.30.a: "Не будуйте замків із піску на задньому дворі Америки." 

 Caribbean_News.32.t: "[Get_newspaper_header]Ґренаду реінтегровано до СКС за підтримки ОАД"
 Caribbean_News.32.desc: "Ґренадські революціонери, попри свої завзяті марші, зустріли свого найбільшого ворога: бюрократів. Вважаючи захист суверенітету цієї малої держави тягарем для поточних операцій, Організація американських держав вирішила втрутитися на боці Східнокарибського Союзу під час Ґренадської кризи. Під загрозою військової сили Ерік Ґейрі був змушений здатися та піти у вигнання. Без свого колишнього лідера значна частина місцевого опору та найманців розсіялася.\n\nУспіх Вільямса у мирному запобіганні відокремленню Ґренади приніс йому похвалу на міжнародній арені, а громадяни вдома починають прихильно ставитися до його панкарибських амбіцій. Можливо, є надія, що його мрія про єдність може існувати поза світом фантазій.\n"
 Caribbean_News.32.a: "Зберігайте спокій і продовжуйте." 

 Caribbean_News.33.t: "[Get_newspaper_header]Порядок у Ґренаді відновлено після спільної мексикансько-СКС операції"
 Caribbean_News.33.desc: "Флібустьери Еріка Ґейрі були вигнані з Ґренади після військової операції СКС за підтримки Мексики. Коли мексиканські та тринідадські війська висадилися в Сент-Джорджесі, повернувши територію під контроль Вільямса, найманці Ґейрі здебільшого розсіялися або здалися перед обличчям підготовленої армії.\n\nОднак у сільських районах острова все ще залишилося кілька головорізів, які чинять останній опір. Тепер їм бракує сил для значної відплати, оскільки Ґейрі зникає за кордоном після провалу свого повстання. Банда Мангуст повністю розпалася, а контроль СКС над її територією нарешті став надійним."
 Caribbean_News.33.a: "Не нехтуйте більшою рибою у ставку."

 Caribbean_News.34.t: "[Get_newspaper_header]Ґренада відбиває спільне вторгнення СКС і Мексики, незалежність забезпечено"
 Caribbean_News.34.desc: "Легіонери «Кондора», бандити з банди Мангуст та іспанські добровольці — строката компанія, що складала ґренадських флібустьерів, — зробили немислиме: вигнали тринідадських загарбників, водночас стримавши мексиканське підкріплення. Після прибуття наступних іберійських військ для підтримки острівної держави після відбиття першої хвилі східнокарибських сил Ерік Вільямс, який поступався чисельністю, був змушений відмовитися від свого плану повернення Ґренади.\n\nТепер Ґренада стоїть як непохитний союзник Іберії в Карибах, тоді як британський вплив у регіоні слабшає, залишаючись болючим місцем між заднім двором Америки та її амбітними мексиканськими сусідами. Це лише невелика пробоїна в непроникній стіні Атлантики, але водночас вирішальний момент для панкарибської мрії Вільямса, яка тепер може безславно загинути ще в зародку."
 Caribbean_News.34.a: "Не пощастило, Еріку."

 Caribbean_News.35.t: "[Get_newspaper_header]У Тринідаді проведено Загальнокарибську народну конференцію"
 Caribbean_News.35.desc: "Прем'єр-міністр Тринідаду Ерік Вільямс нещодавно оголосив про свій план розширення Східнокарибського Союзу на Загальнокарибській народній конференції, що відбулася в Порт-оф-Спейні. У своїй вступній промові Вільямс наголосив на важливості того, щоб карибські держави зайняли активну позицію проти "нового імперіалізму", який підриває довіру між новими незалежними режимами. У відповідь він закликає до пильності та співпраці між усіма присутніми державами.\n\nВід самого заснування Східнокарибський Союз підтримує стабільне економічне зростання та внутрішню стабільність. Багато гостей хвалили управлінські здібності Вільямса, а інші висловлювали захоплення твердою позицією Союзу щодо колоніалізму. Оскільки Вільямс рішуче зближується з Мексикою, водночас протистоячи Сполученим Штатам, можливо, одного дня він зможе завдати удару по американській гегемонії."
 Caribbean_News.35.a: "Влада, що набирає силу, між затокою."

 Caribbean_News.36.t: "[Get_newspaper_header]Східнокарибський Союз федералізується"
 Caribbean_News.36.desc: "За підтримки доктора Еріка Вільямса Східнокарибський Союз різко переорієнтував свою внутрішню та зовнішню політику протягом останніх тижнів. Раніше жорстко централізовані в столиці Тринідаду, Порт-оф-Спейні, острови-члени отримали юридичну автономію. Ця Федерація також прагнула до розрядки з конкурентом — базованою на Барбадосі митною спілкою Карибською Спільнотою, уклавши невелику торговельну угоду, зосереджену на нафті. Посадовці СКС, які не побажали називати своїх імен публічно, пояснюють обидва кроки тиском США після невдалої спроби відокремлення Еріком Ґейрі Ґренади.\n\nОскільки його наполегливу зовнішню політику було обмежено, а його контрольний стиль управління — стримано, репутація "Дока" Вільямса, схоже, постраждала, а діячі опозиції у Федерації, такі як Саган Марадж, стали сміливішими."
 Caribbean_News.36.a: "Саме це Док і прописав?"

 Caribbean_News.37.t: "[Get_newspaper_header]Розпуск Східнокарибського Союзу"
 Caribbean_News.37.desc: "Під тиском сепаратистських голосів із Сент-Вінсенту і Ґренадин та ґренадської революції Ерік Вільямс поступився народним протестам і з ганьбою пішов у відставку з посади прем'єр-міністра. Його особистий проєкт, Східнокарибський Союз, невдовзі після цього розпався, залишившись без керівника. Після відходу Вільямса Сент-Вінсент відокремився від Порт-оф-Спейна, оскільки Народний національний рух втратив владу на дострокових виборах.\n\nДЛП, партія, в якій переважають індо-тринідадці та яка була головною опозицією Вільямса, прийшла до влади під керівництвом Бгадейса Сагана Мараджа. Новий прем'єр-міністр обіцяє з часом стабілізувати як внутрішній хаос, так і дипломатичні катастрофи, але багато хто не впевнений у майбутніх перспективах Тринідаду\n."
 Caribbean_News.37.a: "Було б дивніше, якби це спрацювало." 

 Caribbean_News.38.t: "[Get_newspaper_header]У Східнокарибському Союзі оголошено надзвичайний стан" #Aplomb - I rewrote this to align with the lore
 Caribbean_News.38.desc: "Після успішного захоплення Ґренади Еріком Ґейрі та відокремлення острова від Східнокарибського Союзу лідер СКС, доктор Ерік Вільямс, оголосив надзвичайний стан. Посилаючись на загрозу подальшого втручання імперіалістичних держав, Вільямс призупинив автономію островів-членів та запровадив обмеження на політичну діяльність. Як повідомляється, таємна поліція "Дока" Вільямса, відома як Летючі загони, була направлена до Сент-Вінсенту і Тобаґо для забезпечення виконання цих положень.\n\nВеракруський пакт ухвалив резолюцію, в якій хвалить "рішучу відповідь Вільямса на захист суверенітету СКС", тоді як дипломати США та Іберії засудили заходи Порт-оф-Спейна як "дестабілізуючу надмірну реакцію".\n"
 Caribbean_News.38.a: "Ще одна смерть у раю?"

 Caribbean_News.39.t: "[Get_newspaper_header]Організація американських держав визнає Ґренаду"
 Caribbean_News.39.desc: "Після виходу Ґренади зі Східнокарибського Союзу риторика Тринідаду ставала дедалі агресивнішою з кожним днем. Прагнучи забезпечити відновлену незалежність перед обличчям потенційних військових дій, уряд Ґренади звернувся по допомогу до Організації американських держав. Натомість ОАД пообіцяла втрутитися на боці Ґренади у разі ескалації та негайно визнала її державність.\n\nОскільки повернення Ґренади стає неможливим, Ерік Вільямс стикається з внутрішньою критикою через його бездіяльність, яку йому приписують у протистоянні сепаратистам, тоді як протестувальники вдома стають сміливішими на тлі його слабкості. Майбутнє Східнокарибського Союзу висить на волосині.\n"
 Caribbean_News.39.a: "Завжди знайдеться хтось із більшим запасом гармат."

