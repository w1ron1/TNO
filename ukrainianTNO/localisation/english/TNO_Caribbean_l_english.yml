 ## General Proxy Chain
 #US Events
 Caribbean_flavor.33.t: "A Report from Kingston"
 Caribbean_flavor.33.desc: "CONFIDENTIAL/[?global.date.GetDateStringNoHourLong]\n\nFROM RICHARD T. CLEMENT\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: FOREIGN INFLUENCES AMID POLITICAL UNREST IN JAMAICA.\n\nBoth sides in the violent confrontations in Kingston enjoy material and diplomatic support from outside powers. Militant anti-government groups are receiving aid from Cuba, as well as the Black Star Brigade, a communist, black nationalist formation within the Caribbean Legion. Bustamante has also obtained weapons of Iberian-origin. Michael Manley, anti-Bustamante moderate, has gained Mexican diplomatic support for his attempts to push for a peaceful transition of power.\n\nMexican officials have clearly signalled their support for Manley and his peace agenda. However, sources within the anti-Bustamante movement have brought to our attention the ties of radical sectors to the Black Star Brigade. If the radicals arm themselves, violent escalation is inevitable. The flow of weapons into Jamaica is being facilitated by government officials, and we've traced smuggling routes back to Iberian manufacturing.\n\nThe proliferation of weapons and spread of black nationalist forces is a threat to stability in the Caribbean. These same groups undermine the unity of the West Indies and fervently oppose U.S interests.\n\nThe U.S is tentatively supporting Mexico and Manley to achieve a peaceful transition that disempowers the radicals. Canada's hardline support for Bustamante is not conducive to this goal. Canadian interference should be kept to a minimum."
 Caribbean_flavor.33.a: "And ye shall know the truth and the truth shall make you free."

 Caribbean_flavor.34.t: "Unbottled Rage"
 Caribbean_flavor.34.desc: ""If you offered us enough freedom to actually respond to these attacks, William," Molson groaned, his tone almost turning to the guttural as he pointed wildly at settlements in Jamaica between Kingston and Portmore, "we would have crushed these radicals by now."\n\nWilliam Hastie sighed. For the last few minutes, he had been trying to talk Molson down, to convince him that full American intervention wouldn't help to keep the peace. "You'd have a few martyrs, and an island filled with people who'd only hate you more." Moving the map to his left, Hastie forced himself forwards. "We have to be careful. Our presence will be more than enough."\n\n"Really? Do you really think that these hooligans are going to be deterred by a few men with gruff faces?" Molson took a step back, shaking his head. "You know, Hastie, if I didn't know any better, I'd presume that you Americans were trying to make sure that Manley seized power to make sure Canada never thought about leaving your sphere again."\n\n"You know what, Hugh? Maybe me and Manley aren't so far apart after all." Now rising from his chair, and virtually shouting Hastie stabbed a finger into Molson's chest. "Because we've both long grown tired of Canada's failure to take care of the Caribbean. You've squandered every crisis since the 1940s, you've allowed these places to fall into racism and stagnation, and every time you fail, you just whine to us about the nineteenth century."\n\nMolson stood up in turn, his face turned yet further upwards in disgust. "Do you really think you lot could do any better? It's not your men whose lives are on the line. It's not your men working to keep these islands functional every night." Walking away, Molson remained silent only for a moment. "Your support in the Caribbean will dry up the moment Manley climbs a podium.""
 Caribbean_flavor.34.a: "The Riots move beyond Jamaica."

 Caribbean_flavor.35.t: "The Man Who Made Tivoli Gardens"
 Caribbean_flavor.35.desc: ""I wouldn't say I 'made' Tivoli Gardens, no." Jamaican Minister of Development Edward Seaga smiled humbly at the American reporter and his television crew. "Many talented engineers, architects, professionals, and all sorts laid the foundations for that development. But it's the people of Tivoli Gardens who make that community what it is. Families, students, teachers..."\n\n"Tivoli Gardens is considered a stronghold of support for your party, the ruling JLP, is that correct Mr. Seaga?" The man from CBS asked.\n\n"I haven't been door-knocking there recently, but if you're right then I appreciate their support."\n\n"Some of the JLP's critics allege that Tivoli residents have been heavily involved in the violence since the riots broke out in Kingston. With murder rates unprecedented across the island. They allege you're using the community to build an army. How do you respond?"\n\n"If Communists and gangsters were causing havoc in any given American city, you wouldn't blame any decent citizen for defending his home or his family, would you?" Seaga regarded the naive expression of the American newsman, the kind of aimless ignorance in his eyes. "Your audience should understand, this kind of savage lawlessness isn't tolerated anywhere - blood answers for blood, you see? The brave people of Tivoli Gardens understand that. They understand that this community is the first line of defense against Communism and international bandits. If Tivoli Gardens falls, then Kingston falls, and should that occur...""
 Caribbean_flavor.35.a: "New York is sure to follow."

 #Mexican Events
 Caribbean_flavor.36.t: "Making Peace and Trouble"
 Caribbean_flavor.36.desc: ""We are walking a tightrope in Jamaica, gentlemen."\n\nAlejandro Gómez Maganda, consul to Jamaica, adjusted an already impeccable tie. He surveyed the room the consulate had hastily prepared for them, packed by assorted diplomatic staff, and even a representative of the president's office. A high-ranking audience, compared to his usual.\n\nFrom the back, a hand raised. "Won't we step on America's toes by supporting Mr. Manley?"\n\n"We may," Maganda said, smiling. "The Americans would prefer to bury their heads in the sand and hope the violence dies down. We can't afford that."\n\nMaganda laid an open folder onto the table, picking off the first page, and raising it for all to see. "These," he said, "are reports detailing the recent actions of the Black Star Brigade in Jamaica. Communists from the Caribbean Legion. They have Havana's blessing."\n\nThe files were passed around, while Maganda circled the room. "Michael Manley and the PMM have the same goal as the Black Star Brigade: the end of Bustamante's abuses. We support him because he will achieve that peacefully."\n\n"Unless he switches up on us and joins the radicals," someone noted. Maganda nodded. Right there was the tight rope.\n\nThe Americans thought of the Caribbean as their fish pond, but flinched when it was time to keep the waters calm. Meanwhile, the Cubans weren't afraid to make waves, even if Mexico gave them a friendly signal to back off. Now it was up to them to play the balancing act."
 Caribbean_flavor.36.a: "We stay the adults in the room for as long as we can."

 Caribbean_flavor.37.t: "Outside of Frame"
 Caribbean_flavor.37.desc: ""Mexico City to Kingston. Do you hear us, Kingston?"\n\nA harsh burst of static. Then, a response. "Kingston to Mexico City. We hear you from Tivoli Gardens, a poverty-stricken neighborhood made the epicenter of the Bustamante regime's repression of the protest movement."\n\nSilence, as listeners caught the sound of flames and shouting. "Tell us what you see."\n\nCamera flashes followed the aid workers sprinting into the smoldering street. Police officers, Bustamante's mercenaries, as Mexican press called them, stood ways off. They fled at the sight of vests with the word "PRESS" painted on them. It was a respite from the violence which amateur paramedics and volunteers from local hospitals took to act.\n\nThe images of young students with bruised faces, blood pouring from rubber-bullet wounds, reached the screens of the Americas faster than Bustamante could deny them. Burnt apartments, desecrated shacks, and twisted corpses stained Mexico City's newspapers. Their correspondents made sure to capture the faces of those responsible, seeking not just policemen but the roving bands of Bustamante loyalists terrorizing Tivoli Gardens.\n\nThe cameras missed a graffiti of the pan-African colors behind the burning houses. They ignored the images of Marx, and slogans in red bold letters. No Mexican reporter interviewed the anti-Bustanante militants who took potshots at the constabulary."
 Caribbean_flavor.37.a: "The Mexican government wanted a story of passive victims."

 Caribbean_flavor.38.t: "Tremors in Kingston, Echos in Havana, Scars in Mexico City."
 Caribbean_flavor.38.desc: "Coronel La Mugre was not a figure to be easily rattled, when you live a live aspiring to be better and to make better than the sum of the New World Order, you had to be tough if you couldn't be smart. Lucky for him, or unlucky for him depending on his mood, he proved to be both. An accomplished career officer in the Mexican Ejército and as good of a military attache the Cubanos could ask for.\n\nThe clouds were merciful enough in hiding the afternoon sun during the exercise, the rolling mountains and distant skyline of Havana in the distance. The Brigadistas were, by La Mugre's estimations, doing well. He had been observing the Cubano instructors running weapons drills and small unit exercises most of that day, readying them for the inevitable deployment in Kingston to reinforce the Black Star Brigade in the ongoing riots in Tivoli Gardens.\n\nOccam's Razor would suggest that La Mugre should have been of the hard-bitten cynical set, most revolutionaries are. But there had to be room for high ideals somewhere, even if reality rarely rose to meet such expectations. The Jamaicans had every right in the world to fight for a future of their choosing, but how much of Jamaica would be fundamentally altered by the end of it?\n\nLa Mugre lived with the bright and vivid memories of his abuela's retelling of Calles' pogroms back in the 20s, imagery that was running through his head on seeing photos of what Havana looked like after Castro's partisans marched through it. Looking down at the clipboard in his hand and the otherwise benign numbers and dispositions scrawled through it, he couldn't get the footage from Kingston out of his head. Maybe he was overthinking it, but events like these weren't going to disappear from one's memory as soon as the fires fade away."
 Caribbean_flavor.38.a: "La Mugre made a point to stick to his observations that day, forcing his reservations to the back of his mind."

 #Iberian Events
 Caribbean_flavor.39.t: "Calling Back Home"
 Caribbean_flavor.39.desc: "East of Old Harbour was a small roadside bar: purple neon sign, mento music on the radio, the smell of jerked meats and bammy. Even in the phone booth on the other side of the road, Luis M. González-Mata still saw, heard and smelled these things. On the other end of the phone was a man who will never see, hear and smell things as Mata did.\n\n"Good morning, Mr. Mata." Mata looked out the phone booth window: the sun was down, the sky was dark. Three in the morning here, probably nine over there. "What news from Jamaica?"\n\n"Chaos," said Mata, two fingers up and down the phone cord. "Protests are daily, and they're threatening to break out into a riot. Bustamante's frothing with rage. He wants any excuse to sic riot police on the protests."\n\nA pause. "Is he growing frustrated with the Americans?"\n\n"He hasn't said anything specific, no. But he does complain of things holding him back." Mata transferred the phone from one hand to the other. "I've had a look at these protests. He wants an excuse, but the cops are afraid of escalating without backup. If we want to help him, we need to outfit his allies."\n\nAnother, longer pause. Mata tried to imagine the office his handler sat in; he saw nothing but a desk, a phone and a shadow. "Are these allies trustworthy?"\n\n"Hardly, but we don't need to enter into long-term pacts. We just need to give his crooks and paramilitaries some guns, and they can do the dirty work the cops won't be caught dead doing."\n\n"Good." No pause. "We'll arrange a drop. Fifty thousand in US dollars, fifty rifles. Will this be sufficient?""
 Caribbean_flavor.39.a: "Mata pursed his lips. "It's a start.""

 Caribbean_flavor.40.t: "Another Humid Night in Jamaica"
 Caribbean_flavor.40.desc: "An overcast night presided over a meeting in an alleyway. "Customs have been handled already." Santos lit a cigarette, casting his shadow over the open trunk of a car, a street light droning faintly overhead.\n\n"Is there more to arrive?" Bustamante's crony, a local police captain, crossed his arms, leaning forward to inspect the delivery.\n\n"Naturally, there should be another arrival about a week from now." The steel arms of a dockyard crane loomed over them, the bustle of Kingston Port audible in the distance.\n\nThe car's boot held a cache of weapons: rifles, shotguns, handguns along with boxes and boxes of ammunition. Santos typically smuggled in larger shipments, but this was no small order.\n\n"These headed to Tivoli Gardens?" Santos tilted his head, eying the line of parked vehicles along the alleyway, all stocked to the brim with imported weapons like this one.\n\n"You catch on quick." Bustamante's contact turned a revolver over in his hand, inspecting it.\n\n"I listen to the news." Santos listlessly scratched at his nose. "Little else to pay attention to after we made it out of Lisbon."\n\n"Sounded relaxing." The contact spun the revolver chamber before locking it in place. "Could I have your job?"\n\nSantos almost felt sympathetic. "Bad day tomorrow?""
 Caribbean_flavor.40.a: "The contact gestured to the pile of guns in front of them both. "You tell me...""

 Caribbean_flavor.41.t: "Staring Down Your End"
 Caribbean_flavor.41.desc: "Luis M. González-Mata couldn't be seen with Alexander Bustamante during the ongoing riots, and neither of them could afford to leave Kingston with the riots ongoing. After weeks of silence, Mata finally broke his rule about their clandestine meetings. He dressed himself up as a temporary servant and drove through crowded streets into the Vale Royal. There he saw Alexander Bustamante in a western drawing room, his hand cradling a full glass.\n\n"What the hell did I do to them?" Bustamante slammed his drink back. "What the hell did I do to the OFN?"\n\n"What do you mean?" Mata watched Bustamante sway, struggling not to slur his words; he wondered when was the last time the old man went sober for more than a day.\n\n"It's that bloody Michael Manley. He's been talking. Talking with them." He poured another drink. "I knew it. They've been fucking with me this whole time. The Americans want me out," jabbing the surface of his table with a finger, "and they're going to have Norman's runt take my place. They drummed up this whole bullshit riot just to get rid of me."\n\n"We're not going to let that happen," said Mata. Bustamante looked at him, and the ghosts behind him.\n\n"Of course." He poured a new glass. "You know how to deal with this. You know what to do when these things happen."\n\n"You have to stop them from walking all over you." Mata closed the distance between himself and Bustamante, and used this proximity to gently push the bottle away. "All the rioting's around Tivoli Gardens, no? Fill it with cops. Fill it with guns. Suffocate them. Strangle out any dissent that might pop out from there, and you'll pacify the city.""
 Caribbean_flavor.41.a: ""Strangle," repeated Bustamante."

 #Climax
 Caribbean_flavor.42.t: "Jamaica Farewell"
 Caribbean_flavor.42.desc: "In the state of Jamaica, a nation sat paralysed with anticipation. Corruption and repression under Premier Alexander Bustamante had brought it to a breaking point. Nowhere was this felt more than in the seat of his power, where all eyes in-country were now turned.\n\nIn the city of Kingston, at the center of this coiling frustration, protesters converged upon the nexuses of JLP power. Neighbourhoods were marked off on police maps like occupied territory. The leader of the country was nowhere to be seen. Rumours placed him somewhere in the Vale Royal, an old estate remade as headquarters for this war in the streets.\n\nIn the neighbourhood of Tivoli Gardens, Bustamante's men fortified its borders and filled its streets with gun-toting harbingers of order. Edward Seaga, JLP head headbreaker, brought with him the party's best enforcers to the Gardens. Civilians were ordered in their homes, where they could hear distant shouting and cries against the government. Shotgun-toting cops brushed shoulders with bat-bearing criminals, united under Bustamante's patronage. The JLP were like chains for some; for others, a bandage. At its edge were protesters, demanding an end to the old man's premiership. In the shadows of the alleys were another kind of dissenter; one armed under a black star, one waiting to see if they could break the deadlock.\n\nWhere Spanish Town Road met North Street, a row of riot cops held back protesters. In the middle was a cop and a protester—equivalent in age, both Kingston natives, whose names history would not recall. They looked at each other. The cop held a gun; the protester held a sign. Their hands tightened around their implements of war. All around them, fervour coiled and anger compressed into a single point, and they all waited for the moment when it exploded."
 Caribbean_flavor.42.a: "Miles away, a power substation experienced a fault. The lights went out for only a second."

 #Iberia Wins
 Caribbean_flavor.43.t: "Sounds of Laughter Everywhere"
 Caribbean_flavor.43.desc: "Where Spanish Town Road met North Street, a gunshot echoed across the intersection. When the lights came back on, the cop was staring at a dead protester. The crowd took a step back. He saw the protester's dying eyes, wide and confused. The cops took a step forward. From now until ten years later, when he finally put his gun in his mouth, he would be haunted by those eyes. The cops rushed past him. A smoke grenade was lobbed into the crowd. Those caught in the cloud soon felt batons rain upon them.\n\nIn the neighbourhood of Tivoli Gardens, standing orders for Bustamante's men varied by group. The cops were assigned to keep order; they pushed back the rioters away from Tivoli's streets. The gangs were told to fuck up anyone who looked at them funny; they brought out their guns and fired into the thickest of the crowd. The border around Tivoli receded and vanished against this march.\n\nIn the city of Kingston, Bustamante's men burst from their pens and smothered the opposition. Order was imparted by bullet and bludgeon. In hours, there was no longer resistance; it either fled the city, buried itself deep underground or lay unblinking in the streets. Dozens of corpses entered pauper's graves and crematoriums. Hundreds flooded the hospitals and clinics. Somewhere in Vale Royal, an old man chortled and held in his wrinkled hands the sand he stole for his hourglass.\n\nIn the state of Jamaica, radios that once fell silent or played calming hold music buzzed with changing static. An official government decree called for a state of emergency. The military mobilised to secure the cities, but in the streets paramilitaries and criminals beat anything that emerged from the shadows. In those shadows between Bustamante's reassertion of order, eyes peered through gaps and whispers floated through the air. Northern traffic has stopped; Uncle Sam's pissed. But eastern traffic flows faster and thicker."
 Caribbean_flavor.43.a: "And if you peer through the cracks in the halls of power and lean one ear out, you'll hear Spanish."
 IBR_Consequences_Jamaica_tt: "\n§RPartaking in such corrupt affairs will have consequences for the §OUni§!§non§!'s stability.§!"

 Caribbean_flavor.44.t: "Fly on the Wall"
 Caribbean_flavor.44.desc: "PIDE Surveillance Recording, Emergency Meeting OAS Office: "Response to Kingston Massacre." Georgetown, Washington D.C, The United States of America.\n\n13:33:12 Voice 1: "Bustamante's already making his move? Are the bodies on the ground even cold yet?"\n\n13:34:33 Voice 2: Opposition parties are sitting on their hands, people are frightened. The regime is running out of obstacles in their way, consolidating their power in the executive."\n\n13:34:57 Voice 1: "Congress?"\n\n13:35:07 Voice 3: "Joint resolution to join the OAS in condemning the violence, signed off by POTUS, Mexico City's resolution will be joining within the hour."\n\n13:35:45 Voice 1: "Madrid?"\n\n13:35:55 Voice 3: "Smuggling guns into the Caribbean mostly, off the books. Rumor is Port of Kingston was on their itinerary."\n\n13:36:11 Voice 4: "Bustamante getting into Franco's pocket?"\n\n13:36:48 Voice 1: "(sighing) ...It's Santo Domingo all over again."\n\n13:37:05 Voice 2: "Get whatever humanitarian aid corps who'll listen on the horn whenever you can, there's a non-zero chance that this is going to go south fast.""
 Caribbean_flavor.44.a: "The situation deteriorates."

 #Red-volution / Nobody Wins
 Caribbean_flavor.45.t: "I Must Declare My Heart Is There"
 Caribbean_flavor.45.desc: "Where Spanish Town Road met North Street, the lights went out, and the crowd heard a flurry of gunshots. When the lights went back on, the police had been peppered with small arms fire. The cop coughed blood onto the protester and fell over. The ones who survived ran. Out from the darkness stepped a man in a leather jacket, Black Stars pin on his lapel. He turned to face south, and asked if they wanted to join him. The protester followed, and soon so did the crowd.\n\nIn the neighbourhood of Tivoli Gardens, the motley garrison found itself surrounded. Orders came down from the top: we're taking control, move on the crowd. But the vanguard of cops that stepped out into the streets soon found themselves before an angry crowd. The gangs tried to run cover, the paramilitaries tried to pick off leaders, but guns in the crowd fired back. The crowd around Tivoli Gardens moved forward, compressing their opposition, smothering them.\n\nIn the city of Kingston, all sources of Bustamante's authority were overrun by an emboldened protest-turned-rebellion. The old man had tried to send out orders, tried to call for a state of emergency over the radio, but nobody was listening. Soon, the crowd came for Vale Royal, Black Star militants kicking open the doors. Bustamante himself was halfway out of the city, lying flat on his aching back, covered up by tarpaulin and bound for the nearest airfield.\n\nIn the state of Jamaica, cities beyond Kingston held their breath. News of Bustamante's flight left the authorities decapitated. Some were already packing up, some were already practicing their speeches. Three hours after Vale Royal had been breached, two new voices played over the airwaves. They called themselves William Strachan and Richard Hart. They called themselves the People's Free Movement. They said that there was a new government now, one that served the people of Jamaica, and that neither empire nor capital would find a vessel here."
 Caribbean_flavor.45.a: "Now destiny was in their hands."

 #Mexico Wins
 Caribbean_flavor.46.t: "Won't Be Back for Many a Day"
 Caribbean_flavor.46.desc: "Where Spanish Town Road met North Street, the lights came back on, and the protester saw the cop's gun on the ground. He looked at her, said nothing. The protester blinked. The cop walked to the side, standing on the sidewalk. Other cops followed suit; some ran, others stood off to the side, and a brave few even joined them. The protester turned to the crowd, called for them to advance.\n\nIn the neighbourhood of Tivoli Gardens, frustration from within the garrison had finally broken its defenders. The cops, seeing history facing them, put down their guns, went back home or joined the protest. The gangs fled, fearing recrimination; the paramilitaries retreated, licking their wounds. The neighbourhood had been claimed inside of an hour, and new supporters emerged from their homes and boltholes. The crowd turned and headed up the northern streets.\n\nIn the city of Kingston, the protest swelled and roared. The waves moved north and east. It surrounded Vale Royal, King's House, all the organs of government; the waves crashed upon the gates and broke through. Authorities put up little resistance; what elements of the government were loyal to Bustamante were already out of the city, and in a few hours out of the country.\n\nIn the state of Jamaica, all eyes turned to the capital and all ears were tuned to the Jamaica Broadcasting Corporation. They did not wait long; two hours after Vale Royal was seized, the Jamaican people heard a familiar voice over the radio. Michael Manley, leader of the People's National Party, thanked his supporters for rising against tyranny. He promised prosperity, economic justice and reform befitting a democratic nation. He denounced the Bustamante regime and its foreign backers, and declared for all to hear a new chapter in their nation's history."
 Caribbean_flavor.46.a: "A day later, a new flag flew all over Jamaica."
 IBR_Consequences_Jamaica_Loss_tt: "§FFortunately, due to our lack of existing ties with Jamaica, this loss will not burden us greatly.§!"

 #Follow-up if the US Lost
 Caribbean_flavor.47.t: "One Futile Convention"
 Caribbean_flavor.47.desc: "It had already been too long a conference when Eric Williams, Premier of Trinidad, took the podium. Half of the delegates to constitutional convention had vacated the conference room, only a sad assortment of limp, wrinkled flags attesting to their presence.\n\n"To those of you who still remain," Williams spoke, "I'd like to thank you for keeping our people in your minds. The peoples of the Antilles placed their hopes on us to steer their future towards unity and independence. This is why I stand before you all, uncaring if you've already given up."\n\nThe Premier's voice resounded through the empty room, and escaped into vast halls which the rapacious press bathed in camera lights, reporters shouting over each other to ask questions to the delegations already leaving for the airport.\n\nWilliam H. Hastie heard the ruckus through the doors, and laid his chin on his hands while watching the shine on the Premier's forehead, the way his hands maneuvered as he spoke, his neck tense with passionate words.\n\nBut inevitably, when he returned to sit with the Trinidanian delegation, all eyes returned to the seats labeled for Jamaica: conspicuously empty since the beginning. The others could speak with the most fiery words, but with Jamaica barred from attendance, the fate of the federation was already sealed.\n\nThe bells tolled less than an hour later, with the delegates withdrawing without anything except the assurance that the West Indies will remain disunited. As Hastie picked up his suitcase and left, he locked stares with Baron Molson across the crowd of delegates. Molson shook his head, muttering something under his breath."
 Caribbean_flavor.47.a: ""Blasted Yanks.""

 Caribbean_flavor.48.t: "Return to Trinidad"
 Caribbean_flavor.48.desc: "Eric Williams squeezed through a mass of flashing cameras and waving mics. Climbing the rickety stairs to his aircraft, he turned to the crowd and shouted above the drum of the engines.\n\n"The project of unity and independent cooperation in the West Indies has been dealt a heavy blow. It will take many more for me to give it up!"\n\nWaiting inside was consul Maganda and the Mexican observers who witnessed the constitutional convention, the apparent funeral of any dreams for a federation in the West Indies to everyone but Williams.\n\n"It is not over, friend," said the Premier of Trinidad, firmly shaking Maganda's hand. "It's far from over."\n\n"You have never been one to give up," Maganda said, earning the widest smile from Williams. The two sat across from each other, the vibrant blue of the Caribbean shining from the window.\n\nThe white of lazy clouds reflected in Williams' dark glasses. "I have gathered support in Grenada, and made friends in Saint Vincent. We will forge ahead with our own union. It will be a close-knit family."\n\nMaganda raised a glass of whiskey. "And you will have Mexico's full support."\n\nThe Premier nodded, and then seemed to deflate in his seat. He laid his head in his hand. The ocean spread far into the horizon, its edges glimmering faint, almost disappearing into the sky.\n\n"We could have been great," Williams said."
 Caribbean_flavor.48.a: "Decolonial dreams, cast into the seas."

 #US Wins
 Caribbean_flavor.49.t: "Gritted Teeth, Forced Smiles"
 Caribbean_flavor.49.desc: "Throughout his career, William H. Hastie had encountered many arrogant little lords. Dismissive, entitled, haughty - any interaction with them would be guaranteed to end in a headache at least. But every single time, he would simply have to hold his tongue and nod along, for the greater good. It was on a stuffy morning that he yet again found himself in this situation - although, to be frank, Baron Molson was one of the better ones. Mostly.\n\n"Well it's rather about time the situation settled down," the Canadian Baron said, as he and Hastie briskly walked through the corridors of the parliament building. "I did tell you, my man. Washington was far too heavy-handed. I know precious little can be done to stop the Jamaicans' proclivity for outrage, but there were far more subtler approaches you could have taken."\n\nHastie suppressed a wince. There it was. "At least they have settled, now. With Bustamante out of the way and Sangster being as useless as he is, we'll be able to continue proceeding with the plans for federation immediately." That, at least, was true. Donald Sangster was practically toothless in comparison to Bustamante. It would be like comparing a grape to a melon.\n\nMolson stopped off at a water cooler filling a cup up. "Yes, that is a relief. It'll be sad, I suppose, seeing the colonies go," he said, taking a sip. "Feels like seeing a child leaving home. I still don't believe that they're ready, yet. These riots remind me of what's happening in the American South. Like children having a tantrum. No, they still need to be taught. And we will teach them, won't we?"\n\nHastie clenched his fist."
 Caribbean_flavor.49.a: ""Respectfully, I'll have to disagree.""

 Caribbean_flavor.50.t: "Murphy's Law in the Land of Jah"
 Caribbean_flavor.50.desc: "In spite of the combined efforts of the dueling halves of the Latino sphere, one half in Madrid and the other in Mexico City, the characteristic avarice of the Yanquis reveals itself yet again in their stranglehold over the island of Jamaica. The impudence of the American Monroe Doctrine has foiled a fledgling Caribbean nation's designs on independence yet again, toppling the efforts of both Nationalist and Leftist efforts to seed Jamaica's liberation.\n\nThe Iberian scheme to prop up Bustamante's attempt at dictatorship quickly found itself upended before it began, with his exile and the trial of his conspirators following soon after. The Cuban-spearheaded plot to kick off a revolution in Kingston was similarly rooted out, nixing the groundswell for a popular revolt could really get off the ground.\n\nThe reaction from either camp is not difficult to assume. Mexico's allies in Havana are livid at the West Indian victory over the attempted revolution, while Madrid's supporters in Central America and the Andes are similarly vexed by the American's meddling. All the while, the American allies in the West Indies continue to consolidate their support along the Antilles and beyond, hoping to secure itself against further encroachment from foreign actors.\n\nThis is by no means the end of Mexico or Iberia's ambitions in the Caribbean, yet one would be justified in worrying as to what lengths either side might go to in avenging the failures in Jamaica...and who else might be caught in the crossfire when the next regional conflict springs up."
 Caribbean_flavor.50.a: "The episode in Jamaica was a grim one already, but the Caribbean is not out of the woods yet..."

 ### Federation Formed Events
 Caribbean_flavor.51.t: "A Savage Journey To The Heart of the Caribbean"
 Caribbean_flavor.51.desc: "The air had been hot and thick for several days in Kingston, so Thompson anticipated the rain that was starting to wash away all the trash left behind after the riots. As he ducked under one of the many scrap metal roofs that made up Kingston's slums, Thompson saw that there were a bunch of gangsters inside already. He wondered what the over-under on the average life expectancy in this shithole being above 30 might be.\n\nThese are the types of stupid grim things that fill your head when you're in amphetamine psychosis. PNP and JLP-affiliated hoodlums had been battling Black Star Brigade, unarmed protestors, and each other non-stop until a few nights ago. Manley's gangs got hit the hardest. Bustamante's posses and the Communists had submachine guns, and the PNP thugs were lucky if they had machetes.\n\nThompson had been in Kingston for the National Observer for months now, ostensibly to get a sense of life in this town. But all he'd really been doing was trying to escape everything he saw. Naked women breastfeeding babies not even three feet away from rotting corpses. Old men getting shot on the street for debts they probably didn't owe. Hungry kids fighting over a stale cracker. Haunting rocksteady music and the most godforsaken smells surround you. This is hell on earth. No wonder why everyone here's trying to get stoned; you'd go crazy if you were straight.\n\nRemembering he had a job to do, Thompson tried to start a conversation with one of the friendlier-looking Shower thugs. As they were talking, they both noticed a white geek across the street, no doubt from one of the many NGOs arriving from abroad, stood over a dead body while taking notes on a ledger. The Shower thug laughed. "These men think they can fix things. Rude boys gonna eat them alive." As Thompson left, he took out his notepad and swallowed some uppers. After thinking a bit, he came up with a good title for what he was about to write."
 Caribbean_flavor.51.a: ""Fear and Loathing in Kingston...""

 Caribbean_flavor.52.t: "Turning Ship"
 Caribbean_flavor.52.desc: "Rumination. Norman Manley had sat there, ruminating about his next choice of action. The effervescent Kingston Revolution, led by ordinary Jamaicans who finally took Bustamante and the JLP out of the spotlight for good, did not reflect how stoic Norman felt, peering at the rotary dial early in the morning for a good few minutes.\n\nLooking back at the brief insights of Hastie's character and the scant moments of knowing him face-to-face, he knew him to be a dove in the cast of hawks in D.C. that holds the Caribbean with a vice grip. He was one of the few within the West Indies Commission who understood the damage the injustice caused. With this, it only tightened his knots. As Norman is a transitional figure with decades of political experience under his belt, he knows he must shape the nation's new foundation for the entire world to see before stepping down to allow his son to succeed. This confession to Hastie will not be easy.\n\n"Mr. Manley, is there a reason for you to call me at this moment?" Hastie's tone, beleaguered with the outcome of the riots not quite favorable to the Commission's interests, yet Manley mustered on, as much as he could.\n\n"Mr. Hastie, since the protests have ended, our government has been at work repairing our infrastructure and communication networks to this day. While we tally up the damages, lamentably..." Manley clenches his jaw, dreading what must be said. "We have to abstain from the upcoming constitutional convention, despite our wish for further Caribbean integration, considering... this event would only limit our independence from British dominion. I only pray you understand our reasoning."Ten seconds passed by without a peep from the two.\n\nA short and defeated sentence came from Hastie. "I understand." The call was then unceremoniously cut."
 Caribbean_flavor.52.a: "In another world, they would've been buddies."

 Caribbean_flavor.53.t: "Thanks For All The Fish"
 Caribbean_flavor.53.desc: "The tension in Bustamante's office was so thick, a knife could cut through it. On the surface, it was calm. The man himself was reclined backwards on his chair, puffing away at one of the cigars that González had brought as a token of goodwill. Their association had reached its natural conclusion, and it felt appropriate to commemorate the day as such. But he was deeply angry. That, González could tell.\n\nTaking one last drag of his cigar and placing it into the ashtray, Bustamante stood up, and moved to look out the window. "So that is it, hmm?" he asked, his voice unusually flat. "You were fucking useless. Get out of my office and go back to Spain. I never want to see you again."\n\nGonzález knew that he'd be receiving that kind of treatment as soon as the new premier made it exactly clear how they felt about his presence in the government, but it didn't lessen the sting. He'd grown rather fond of the old man in his time in the West Indies - he didn't consider him a friend, but his disdain was still unwelcome. "Look, I know that the situation didn't develop exactly as we had hoped-"\n\nHe could not finish his sentence, before the elderly man leaped forward and punched him square in the jaw, knocking him to the floor. "Shut up! You sank everything I've worked for the minute you suckered me into those crackdowns you twit! Just go! Go!" the old man screamed at González' now bloodied face. Wiping the remaining blood onto his suit, he nodded, standing up and moving to leave the office.\n\n"Wait." Bustamante said, his voice now frail. González turned around, seeing that Bustamante had now collapsed into his office chair, visibly exhausted."
 Caribbean_flavor.53.a: "Thank you for the cigars."

 Caribbean_flavor.54.t: "Big Dreams"
 Caribbean_flavor.54.desc: "William H. Hastie entered the large conference room, dominated by a gargantuan wooden table, to find only two individuals inside. A familiar face in Grantley Adams sat at the table in front of a pile of documents large enough to give Hastie a headache just by looking at it. It was hard to not be excited though, as even though the room was near empty, the energy in Adams' face filled it up more than enough. The only other occupant of the sparse room, a young man who bore a striking resemblance to Adams, stood behind him, an identical smile lighting up his face.\n\nAs soon as Hastie fully stepped in the room Adams stood and hurried over to him, giving him a vigorous handshake that would make even the most gregarious in Washington red in the ears. "Williams! I'm so glad you made it, we have so much to discuss, and I have even more to thank you for!" Adams laughed and made his way back to the table before gesturing to the young man. "This is my son, Tom. Tom, meet William Hastie, the man who is making our dreams come true today. Without his political guile Barbados never would have been the seat of the federation."\n\nHastie smiled warmly at the young Adams, knowing full well the weight that would one day fall on his shoulders. Tom took Hastie's hand as well, "Mr. Hastie, I have heard so much about you and hope I get the honor of working with you like my father has. We are so pleased to have an American gentleman such as yourself to keep all this together. Your wisdom is what's gonna make all this work, I am sure of it."\n\nHastie thanked the young man for his kind words, and he swiftly retreated back into his father's shadow, which he hoped to one day overcome. Hastie sat down and began to piece through the many documents that were being prepared for the constitutional congress, including many drafts of the constitution itself. It was going to be a long night."
 Caribbean_flavor.54.a: "Can we get some coffee?"

 Caribbean_flavor.55.t: "West Indies Constitutional Congress"
 Caribbean_flavor.55.desc: "The once empty conference room now was filled to the brim in a scene that was almost purposely reminiscent of Howard Chandler's Signing of the U.S. Constitution. As Grantley Adams was the host, it was only natural that he would be drawing upon such imagery, and it was certainly not lost on the participants of the room, as many faces were alight with every spectrum of emotion. Eric Williams of Trinidad looked especially peeved at the set up, his protests only hushed by the excited clamor of the room. Adams himself stood at the podium, shadowed by the American lawyer William Hastie, one of the architects of what would be the West Indies Federation's constitution.\n\n"Friends! Today is truly a momentous day, only to be overshadowed by every day that follows. Every day that our federation lives on and moves forward will be a greater and greater day. But it all starts here. You all have your drafts of the constitution and I have given you your time to think and revise, so I open the floor to debate." Adams took his seat behind the podium and did his best to control the ensuing chaos. Everyone wanted their voice heard, even if they had little to nothing to say. Groups of murmuring politicians filled the room, punctuated by the occasional raised hand and grandiose speech, followed then by yelling.\n\nThe most prominent of the yellers was Eric Williams, who was starkly against undue American influence in the federation. Hector Allard, surprising everyone, was the one to offer a solution. "Why don't we lean on the British Monarchy? It will appease the Canadians and the British, while the proximity of the U.S. will give them plenty of influence to keep them happy." Even more shocking, there was a slow agreement to the idea, it would keep the federation as independent as possible.\n\nHugh Shearer retorted just as fast, "I know a solution and a perfect man for it. Tomas Beale Jr. is an old hand in American politics and can act as ambassador, his connections will be enough."
 Caribbean_flavor.55.a: "Mr. Beale, who was in the corner, could feel the headache already."

 Caribbean_flavor.56.t: "The Results Are In!"
 Caribbean_flavor.56.desc: "Tomas Beale Jr., recently appointed ambassador to the new West Indies Federation, made sure he was the first voice Prime Minister-Elect Hugh Shearer would hear after the results were called. He had done this before, and would do it again. He had sat next to the phone for nearly two hours, his people live reporting the results to him. In an ideal world, he would call the new Prime Minister before he had even known he'd won.\n\n"Prime Minister-Elect Shearer! It's Tomas, calling to congratulate you on your victory and toast to a long and productive partnership!"\n\n"Beale! You old fox, I should've figured it was you! And it wasn't just me who won, it was Labour, and the people. My team worked long and hard, but they are almost as old of hands as you are, so to them it was just another day's work.\n\n"You are too humble old friend, well I will leave you to your champagne and your speeches, congratulations again Hugh."\n\nThank you for calling Beale, me and you, we will do great things.""
 Caribbean_flavor.56.a: "A click and a sigh."

 Caribbean_flavor.57.t: "A State of Confusion"
 Caribbean_flavor.57.desc: "Scott Harris stumbled between his half-broken Creole and accented English as he argued with the security agent at the Barbados airport. He was an American expat, and had several thousand US dollars in his suitcase that he had come to Barbados to invest. The security guard finally called over a clerk to explain the situation.\n\n"Sir, you need a passport to enter Barbados from Jamaica. It isn't any more complicated than that; it is standard international travel."\n\nScott shook his head, his teeth grinding, "No, see, the clerks at the Jamaican airport said I would be fine, that you had open borders now? I need to get through now, I have a meeting I'm already late for."\n\n"No sir, no state of open borders exists between Jamaica and Barbados, not any that we have received word of here. We cannot let you through. We will need to put you on a return flight."\n\nScott stood there in shock as the clerk handed him a bill for the next flight back, the same plane he had just departed. "What the hell? First, you don't let me through, and now you are gonna bill me for it? Expect a lawsuit to be coming through to you along with my money then!" Scott then turned and walked back onto the plane."
 Caribbean_flavor.57.a: "The clerk sighed and went back to her desk to file a report."

 Caribbean_flavor.58.t: "The End of the West Indies Commission"
 Caribbean_flavor.58.desc: "William H. Hastie stepped into the familiar conference room of the West Indies Commission and immediately knew there was little chance of saving it, but he would certainly try. The long faces on what was left of the commission spoke volumes, already half disbanded as several had been scouted by the federation. Of these stragglers only a few seemed intent to hold onto the commission's dwindling purpose and with them Hastie found himself in an unlikely crowd, many faces he had grown to dislike over his years in the commission joining him. With a sigh he called for the start of the conference.\n\n"To start with a briefing as always, work on the federation has been incredibly successful, though there is still instability in Jamaica after the riots, the new nation is showing upward stability and cohesion. Our subcommittee regarding foreign influence though, has recently reported that even with our precautions our country is still a ship at mercy of the sea. Outside influence seems to work its way into every decision in some way and we are a long way from anything nearing complete independence, and of course Williams is still causing problems and rocking the boat. As well, the attention we do want from the U.S. and others we aren't getting. Foreign aid is drying up and our finances seem to be on a trend toward what I can only call disaster. This, and more, is why I am asking for the commission to consider reforming and continuing its work to combat these issues."\n\nThe room was in a long silence as many tired eyes stared back at Hastie, then the last person Hastie expected to speak broke the tension, Baron Molson. "I, for once, agree with William."\n\nImmediately, he was interrupted as numerous voices spoke out, overwhelming the stragglers with a simple declaration."
 Caribbean_flavor.58.a: ""It's time to disband the commission.""

 Caribbean_flavor.59.t: "Too Many Cooks"
 Caribbean_flavor.59.desc: "'...I took to the business of espionage as a duck would take to water. But it is in my older years that I reflect on my activities and wonder if I was truly in the right.'\n\nLuis González-Mata paused, scratching his chin thoughtfully. After his somewhat dramatic exit from Jamaica and the Caribbean, he had been welcomed back to an empty study, a half-hearted dismissal from the intelligence services, and a desire to just rest. And so, the only sensible thing he could think to begin filling his hours with was writing it all down.\n\nHe had toyed with the idea of writing a book documenting his experiences for years. He had, after all, led a very interesting life - hell, the Trujillos still sent him a birthday card every year. But the most recent episode in Jamaica had left him without much of a drive to carry on, and it was unlikely he would even get close to publishing the manuscript in front of him for several years anyway - so, González-Mata thought, why not?\n\nThere would be few liberties taken, of course. He already knew he would have to play down his role in Bustamante's regime - thankfully, it was already so mired in JLP corruption and other foreign interference that he was barely registered. He had, for all intents and purposes, gotten away scott free, which was certainly a relief. Still, he didn't want to risk stoking things even further. In an ideal world, he'd go back to the Caribbean once things had settled down over there. Not on official business, but just to relax.\n\nPushing up his reading glasses, he continued to scratch away at the paper, telling and retelling his many daring exploits to an audience of one - himself."
 Caribbean_flavor.59.a: "Slippery customer."

 Caribbean_flavor.60.t: "The Ragged Edge"
 Caribbean_flavor.60.desc: "Shearer dropped the loose cigarette over the balcony of the Crane Resort, falling two dozen stories and landing between some AC units with a small pile of other butts. Tomas Beale stood by the door behind him, looking at the ragged Prime Minister. "It seems that the resort turned out well, Mr. Shearer. I'm sure these rooms will be full of paying Americans sooner than you think."\n\n"I don't think I care much about the resort, Tomas. Need to focus on keeping the Federation together."\n\n"Trouble with the islands, Prime Minister?"\n\n"Trouble with everything, Tomas. The central government is impotent, the Kingston riots still have the Federation torn in half, Williams and Manley are both a single wrong step away from secession. I just don't know anymore, Tomas."\n\nHe took a long moment to think before he responded, sliding up towards the balcony next to Hugh. He was a firm rock to Shearer's anxious shaking. "Hugh, I wish I could help you more, but I wasn't made to have a role like that. Still, I think you are too hard on yourself. Great things take hard work, and you are building something truly great here in the Federation, a country united, islands of mismatched peoples forged into one whole."\n\n"If I can keep it together." Tomas nodded, "If you can keep it together. But I mean, even America didn't stay together all the way through. I'm sure that the founding fathers were in a position not too dissimilar to your own right now, trying to keep all the colonies from eating each other. You might be able to learn something from them. I'll have my copy of Democracy in America sent to your office. Give it a read, Hugh."\n\n"I suppose I can take a look.""
 Caribbean_flavor.60.a: "His tone told Beale that he would not even open the package."

 Caribbean_flavor.61.t: "Time and a Place"
 Caribbean_flavor.61.desc: "Two sharp knocks jolted Thomas Sowell awake from his desk. Blearily, he checked the time - it was well into the night and he had once again forgotten to leave at a reasonable time. And evidently, someone was equally as insane. Hurriedly fixing his appearance, Sowell shouted for the visitor to come in. It was William Hastie, of all people. "Apologies for the timing," Hastie said, grinning apologetically. "But I was working late as well, and thought I ought to check in with the Commission's newest rising star. What are you up to?"\n\nSowell tried to suppress the irritation welling up inside him. The man was speaking to him as if he were a gifted schoolboy. "It isn't a problem, sir. I was outlining the new proposal for labor in the federation. Can I help you with anything-"\n\nBefore he could continue, Hastie strode on over, skimming what Sowell had written thus far. He pursed his lips, nodding approvingly. "All great, so far. Although I'd advise that you reconsider..." he pointed at a section outlining sick pay on a federal level. "That part. The Commission can only do so much in an advisory capacity. And, well..." Hastie shot him the most condescending look. "You'll already be under a lot of scrutiny, especially. It won't be easy-"\n\n"Mr. Hastie, I am fully aware of my responsibilities, as I was informed of them upon taking this position. I haven't the faintest idea of what you could mean by me being under... scrutiny." That was a lie. They were two black men in the West Indies in a commission dominated by whites, it wasn't hard. "But I am sure that I can handle it. It is very late, and I want to finish this so I can go home. Would you kindly leave me to it?"\n\nHastie looked as if Sowell had slapped him. He blinked. "Oh. Very well, then." He plodded out, glancing back at Sowell sadly as he left."
 Caribbean_flavor.61.a: "First impressions matter."

 Caribbean_flavor.62.t: "One Love"
 Caribbean_flavor.62.desc: "Bridgetown is alive in a way it has never been before. Streets that once fell silent after sundown now echo with the rhythms of steel drums, the thrum of bass, and the calls of street vendors selling pepperpot and fried plantains. The first Pan-Caribbean Music Festival has drawn thousands from across the islands and beyond. Among them are a new breed of American visitors, affluent, long-haired, and draped in tie-dye, hip young seekers of 'authenticity', eager to bask in a culture they have only known through imported records and second-hand tales. They wander the narrow lanes, mingle with locals, and eagerly piss away Mom and Dad's hard earned dollars.\n\nAs dusk falls over the harbour, the crowd surges toward the main stage, an open-air platform strung with lights that gleam against the gathering dark. Bob Marley steps forward, dreadlocks catching the lamplight, a guitar slung casually across his shoulder. The cheers are deafening, but he waits for quiet. He speaks first in praise, the festival, the people, the dream of a united Caribbean whose borders are bridges, not barriers. His words are warm, but his gaze is steady, and soon his tone deepens. Poverty, prejudice, the lingering ghosts of colonialism: these, he warns, cannot be drowned out by music alone. "Only together, as one people, as sons and daughters of Almighty Jah, can we free ourselves from the devil that surrounds us."\n\nThe silence that follows feels heavy, though by this point half the crowd is thoroughly inebriated. Then the first chords strike, and they erupts in cheers, tears, and dancing. Somewhere in the mass of people, an American student clutches a camera, taking the shot that will make his career and propel Marley from star to icon."
 Caribbean_flavor.62.a: "Jah? Who's that?"

 Caribbean_flavor.63.t: "The New Pirates"
 Caribbean_flavor.63.desc: "Manhattan never slept, though the men huddled around the conference table in their rumpled suits certainly wished they had. Sitting in front of them was an advance fax of tomorrow's Wall Street Journal, the paper's usual detachment shattered by a brash, oversized headline:\n\n"WIF AT THE BRINK - WEST INDIES FACES FISCAL COLLAPSE"\n\nThe West Indies Federation, once hailed as the Caribbean Miracle, had gone from the darling of Wall Street to a complete basket case. Tourism had slowed with oil prices gouging air travel, debt repayments had soared, and the government's swollen bureaucracy could neither tax effectively nor cut spending. Printing more money was the only option left, and now the Caribbean dollar was spiralling toward worthlessness. Fortunes were at stake. Resorts half-built, bonds unsecured, loans hanging in limbo - and many of these loans coming from sources that considered breaking legs a better alternative to calling lawyers. Despite this, one man at the table did not share the air of despair. Leaning back and nursing his scotch, a hazy blur began to develop into something resembling a plan.\n\nLater, at a quiet restaurant uptown, the idea took sharper shape. Over steak and wine, the Wall Street man dined with an unusual guest: a young black economist, recently attached to the Federation Commission, Mr. Sowell, who offered some... unorthodox ideas. Kill the regulations. Put the unions back in their place. Re-mould the WIF as something more than a bureaucratic relic of empire somewhere between imperialism and socialism. A place where investments were protected first. He had answers to everything: how to recover the currency, how to get the gangs off the streets, and most importantly, how to get the band of Guidos that wanted their new casinos built off everyone's back. The Wall Street man listened. It all made sense. And most importantly, Sowell was the first person who didn't speak of 'salvaging' and 'minimising loss'. He saw an opportunity. What was more American than that? Tomorrow's markets would still bleed red. The dollar would still sink. But perhaps the man from Manhattan had found his next step."
 Caribbean_flavor.63.a: "Uncle Sam's always got a plan."

 Caribbean_flavor.64.t: "Crisis in Kingston"
 Caribbean_flavor.64.desc: "The chamber was suffocating. Not for lack of air, though the Caribbean humidity clung heavy in every corner, but from the barely veiled desperation that sat across every face in the Commission's emergency meeting. Sir Baron Molson, silver-haired and grave, rose to speak.\n\n"The United States must be convinced to extend a bailout. In return, Canada will shoulder the role of guarantor. Under the Federation's constitution, Ottawa will hold emergency authority sell tracts of unused Crown land to Washington as collateral, ensuring our partners in Washington their security. At the same time, our oversight of the Federation's finances will expand, imposing order where Kingston has clearly failed."\n\nA murmur of approval rippled through the chamber. The plan was safe, familiar, responsible. The unravelling young Federation steadied by the hand of the trusted elder dominion. And then, a new voice broke in - that of Thomas Sowell.\n\n"This is not a liquidity problem, gentlemen," he declared, "it is a structural one. Papering over this debt with Canadian bonds will do nothing but postpone the inveritable. The Federation itself is rotting from within with its choking bureaucracy and maedieval labour organisation. If America is to offer a bailout, it must come with fundamental restructuring along American business principles."\n\nThe room shifted uneasily. Sowell was not a senior member - and he wasn't even Caribbean himself, though he was one of the few in the room who wouldn't turn bright pink under the sun. The islands were fragile. Push too hard, and the whole federation might collapse under the weight of unrest. More importantly, his suggestion sounded an awful lot like imperialism under a different name. Back and forth the arguments went. The Canadians pressed for slow and steady. Sowell's allies demanded immediate change. Somehwere in the middle, Hastie, betraying his name, toed a middle line suggesting a gradual shift to more free-market principles. In the end, all eyes turned outward, beyond Kingston, beyond Ottawa, across the sea to Washington. The United States would have the final say."
 Caribbean_flavor.64.a: "Sowell's fire and brimstone is nonsense. We'll work with Molson."
 Caribbean_flavor.64.b: "We're not making the same mistakes again. Bring in Sowell."
 USA_Canadian_Plan_tt: "§YWe will pursue the §ZCanadian§! Plan, offering the §MWest Indies Federation§! a much-needed bailout using §ZCanadian§! funds in exchange for increased §ZCanadian§! influence.§!"
 USA_American_Plan_tt: "§YWe will pursue the §mSowell Plan§!, forcing the §MWest Indies Federation§! to the negotiating table and demanding privatizations in exchange for the bailout.§!"

 Caribbean_flavor.65.t: "Breaking Ground"
 Caribbean_flavor.65.desc: ""Mighty fine, what we'll have here." Staff Sergeant Compton, of the Army Corps of Engineers, kicked unsettled soil under his heel. Palm trees and shrubs fell away to the hack of the axes and roll of the saws.\n\nLieutenant Vincent of the Federation Navy smiled. "A joint base project will logically dwarf any of the older installations, no?"\n\nThe waves beat against the shores of Tobago, here where the inspectors from America, Canada and the West Indies came to visit Site 10, the chosen spot for a new, joint naval base to replace the run-down facilities of the islands. Old Glory and the Federation's banner interlaced in the summer wind, above a sign extolling the virtues of joint-security in the Caribbean.\n\nOutside grew a teeming crowd. Their chants for the soldiers to leave their island were drowned out by incessant drills and hammers. Their clamor for the government in Trinidad to hear them was silenced by the roar of fighter jets overhead. The shouts for secession were almost shut down by helicopter landings. Almost.\n\nCompton pointed to the tiny crowd of protestors, a blip in the cleared landscape. "Those the, uh, Tobagonians?"\n\nVincent laughed. "All ten of them, yes.""
 Caribbean_flavor.65.a: "A handful of islanders shouldn't be a problem."

 Caribbean_flavor.66.t: "The Maroons of Tobago"
 Caribbean_flavor.66.desc: "Staff Sergeant Compton did not expect a bludgeon to his office window as the morning greetings.\n\nThe men wore the camo of the West Indian military. They tore in, barking out orders, and Compton sank to the ground with a steel barrel pressed on his forehead.\n\n"So, mutiny?" He asked, hands together on his scalp, as they led him out.\n\nOne of the soldiers smiled, raising a tight fist. "Liberation."\n\nSite 10 was taken over in minutes, with no shots fired. Compton found Vincent among the shaken prisoners: officers and workers, all made to sit on the ground in the middle of the field, amidst the freshly laid foundations of their base to-be. It was first-row seating to the liberation of all of Tobago, as the mutineers donned red bandanas and flags and marched inland.\n\nAs the sun's glare neared the distant ocean, a soldier took to a makeshift podium.\n\n"Brothers," he addressed the civilians who'd come watch. "You are witness to the beginning of a new history for our islands. We, the Maroons, have started the first match in a liberatory fire that will sweep this country. From Trinidad and Tobago to Jamaica, let the West Indies be free from colonialism now and forever!"\n\nVincent thanked one of the Maroons, as they distributed water and food to the prisoners. He paused, and looked at Compton, who chewed his sandwich."
 Caribbean_flavor.66.a: "I suppose there have been worse hostage situations."

 Caribbean_flavor.67.t: "Fear of a Black Paradise"
 Caribbean_flavor.67.desc: "White House Oval Office Recordings: West Indies Crisis, Maroon Uprisings.\n\n(PRESIDENT): "How many hostages are we talking about?"\n(ADVISER 1): "Far too many, a time bomb waiting to go off if this gets any worse."\nPOTUS: "And the Mexican involvement? Castro?"\n(ADVISOR 2): "At this point? Hard to know. SNI's gotten quiet, as have Havana's agents in the south."\n(ADVISER 3): "The bare minimum of plausible deniability, just in case it back fires, as if we don't know where the insurgents got their guns from..."\n(POTUS): "What are our options, this needs a force appropriate response ASAP."\n(A2): "The Marines would settle the matter quickly."\n(A3): And invite PR hellfire straight to Washington, everyone already sees the US presence there as an occupation.\n(A1): "US Marines on the ground in Tobago might as well be the Wehrmacht stomping around as far as the press are concerned."\n(POTUS): "And the West Indies Defense Force?"\n(A2): "Greener than grass, but trained just for this situation."\n(A1): "Generous assessment, can they get the hostages out?"\n(A3): "If they don't, it'll be a blood bath."\n(A1): "We can't have a repeat of Cuba."\n(A2): "(Sighs) Pentagon will be expecting a response within the hour, we got to have our ducks in a row by then.""
 Caribbean_flavor.67.a: "We have to be careful not to overstep, let the WIDF do their job."
 Caribbean_flavor.67.b: "We can't take any chances, send in the Marines."
 USA_WIF_Intervention_tt: "§RWe will opt to form a Pan-Caribbean Intervention force, in spite of the risks that come with involving our inexperienced partners.§!"
 USA_American_Intervention_tt: "§RWe will opt to handle the Intervention directly, this will have dire consequences.§!"

 Caribbean_flavor.68.t: "The Merits of Timekeeping"
 Caribbean_flavor.68.desc: ""What the fuck do you mean they aren't here yet? The operation is in 20 hours and they're still in some goddamn jungle?!" Colonel Trubshaw's voice carried with the thrown clipboard, forcing the young West Indian lieutenant to duck. Venomous, ethereal spikes flew from the American aided by his copious desk fans. The lieutenant swallowed, nowhere to run with an angry bull before him.\n\n"No sir, not a jungle. Last minute intelligence led to the decision that more specific training could be performed at-"\n\n"I. don't give. a fuck. This is a military operation. These engineers, Americans, have been kidnapped for how long? Who screwed up our timetable based on hearsay I haven't even received?" Trubshaw seethed. For days, mistakes after oversight after incompetence. Required signatures of men at different ends of the Caribbean that turned out to not be so required after all, difficulties locating personnel, the struggle finding a clear operational timetable - that alone had taken almost days. Now he was being told someone had just disregarded it?\n\nWhy had he ever been sent to advise these amateurs?\n\nThe lieutenant saluted, his deerlike expression struggling to remain upon the Colonel. "Everything will be in place sir!"\n\nTrubshaw fell into his chair, leaving the lieutenant awkwardly motionless for a moment. Exasperation took him, nightmares of tomorrow plaguing him. "Get out" he said sullenly, cradling his head in his hands. Another fuck up. He listened to the lieutenant walk out the office and down the hall, before a final terrible thought flashed in his mind. He dashed to the door, shouting impotently down the now empty corridor.\n\n"Wait, you didn't say who gave the order! Who, who did it?""
 Caribbean_flavor.68.a: ""Who has the authority?""

 Caribbean_flavor.69.t: "For a Feast at the Port of Pigs."
 Caribbean_flavor.69.desc: "NEWFLASH: American hostages slain as botched WIDF response to Maroon Uprising ends in disaster!\n\nDATELINE - TRINIDAD: Hell and damnation reigns in paradise as the Black Power rebellion of the Maroon Uprising on the island of Tobago was met by the West Indies Defence Force as the counter-insurgency operation went murderously sideways! What was supposed to be a highly-trained national guard force, backed up by American military funding and combat expertise, saw the hostage rescue mission backfire as the Afro-Caribbean revolutionaries managed to wrong foot the WIDF far worse than anyone could have predicted.\n\nThe breadth of the disaster can by measured by the bodies that litter the beaches and byways where the fighting in Tobago was at its heaviest, with too many of the dead being members of the US Army Engineering Corps having been caught in the crossfire of WIDF soldiers and rebel militiamen. While the Maroon Uprising was eventually defeated, outmanned and outgunned as they were by the WIDF responders, the sloppy performance of the American-backed defence force was unable to do so without incurring civilian casualties during the intense fighting on the ground.\n\nExtensive analysis of the counter-terrorism blunder by the WIDF is ongoing, but the visible evidence paints an already vivid picture of the lack of preparation or coherence on display in Tobago. A chronic lack of efficient organization and coordination can immediately be blamed for the poor performance of the WIDF in Tobago, as can communications failures and overburdened command structure. Regardless, this tragedy points to systemic issues plaguing the West Indies' defence apparatus and America's involvement with them, likely to remain a dark day in the history of United States' security commitments along the Caribbean."
 Caribbean_flavor.69.a: "...prepare our heartfelt condolences to the families of those killed in Tobago."

 Caribbean_flavor.70.t: "Blood on Their Hands"
 Caribbean_flavor.70.desc: "The center of Richmond had been clogged, the city's arteries clogged with marchers moving steadily towards their rally in Monroe Park. Chants had filled the air, angry derisions of Washington and the suits that had got their boys killed. One of them, David Waterman, had been born here after all; his mother Jane waited at the Park to make an address while thousands of people moved to show their support to her. Herbert looked at the photographers and news cameras at the edge of the park, capturing the tide of people as they moved in. What a picture they would show.\n\nHe'd flown down from New York specifically for this, eager to get involved ever since he'd read about the debacle in his dorm room. It had been damning stuff, the US had allowed the West Indies to fumble their way to a hostage massacre, and for what? So their leader and the President could feel more equal? Well they certainly were equal now, in his eyes. The New York University Republicans had been apoplectic at the decision; what had possessed the military? But despite being their secretary, he had come home alone; this was a moment for the community.\n\nThe throngs took some time to settle, both in the park and around it before the small makeshift stage erected on one of the grass areas. Herbert could barely see for the trees, but speakers had been placed around the area for listeners. He pushed his way to the stage, seeing Jane sat and looking rather small upon her chair. She held a photo of David amongst a group of men he didn't recognise. One of them made the first address.\n\n"Welcome, real Americans," he declared to the crowd, "to this opportunity to show the Feds that a bunch of brownies and negro terrorists shouldn't be responsible for American lives. We look after our own, and today, across the nation, we will show that!" He spoke with a rural southwestern twang, Herbert recognised it well, raising an eyebrow and looking around. Some shared his shock at the shift; this was unexpected."
 Caribbean_flavor.70.a: "But many others cheered around them, as the crowd demanded their justice."

 Caribbean_flavor.71.t: "Wet Work"
 Caribbean_flavor.71.desc: "It hadn't been that bad, honestly. In fact, nothing much had changed: the "cell" he'd been consigned to was the same barrack room he'd slept in since his unit was sent to oversee the base's construction. In many ways, being relieved of engineering duty could even be seen as an improvement. At worst, some days could be a little dull, with hours spent staring at the ceiling from the comfort of his bed frame. Then again, on most days, he could look forward to some time of banter with Kofi.\n\nIt had only taken a week to know him by name; by the end of the second one, it was as if they'd been familiar a lifetime. Twice a day, when the young guard brought his meal, the pair would pass the next half-hour jesting about the absurdity of their respective situations. He had quickly dissipated the idea that his group had any intent to hurt them; he and his "comrades" only needed the hostages as insurance until Washington ceded to their long-due independence. "Any day now", he kept repeating, with an honest smile and a spark in his eyes that almost convinced him too, as he left today's plate as usual on the nearby desk. The next instant was one of white, dizzying blur.\n\nHe could barely register a few muffled pops through the ringing in his ears. Any other sense had been torn away from him as he stumbled to the ground in a maze of confusion. It only took a few seconds before he felt his body being lifted back up again. With his sight still recovering from the flash, he nonetheless managed to notice the insignia of the U.S Marine Corps padding the arm that assisted his weight.\n\n"Hey. You alright?" voiced the figure as it guided his shaky steps toward the exit. "C'mon, you're safe, now. Cavalry is here," it added with a wink that tried its best to be comforting. He wouldn't notice it, though; his own attention had been maintained on from the pool of blood that had formed around the corpse he'd been joking with mere minutes ago, soaking the scattered remains of his still-warm lunch."
 Caribbean_flavor.71.a: "By duskfall, the only shade of maroon left on the island was the paint coating the sand."

 Caribbean_flavor.72.t: "The Wake"
 Caribbean_flavor.72.desc: ""I must stress that the situation is under our express control. It has been handled swiftly by the assistance of our troops, with, fortunately, minimal collateral casualties." Daniel's job was to put out fires. That's what he would grow convinced of after years working as a representative to the U.S OAS mission. Today's flame had been sparked by the latest intervention on Tobago, which he now found himself having to defend in the face of an entire flock of vultures ready to tear him down.\n\n"Our delegation shares unease on the act of directly sending American personnel instead of trusting local military forces to address a, again, very *local* crisis." Of all of these preying birds, none was more voracious than the representative from Mexico, who had seemingly taken a gleeful pleasure in torturing him for the past hour. "Some members of this body might worry that it further proves their previously voiced concerns about a rather overbearing U.S attitude in Caribbean affairs."\n\n"I would like to remind the assembly that our administration's primary concern is to ensure the stability of the region and the safety of its member states." Even Daniel could see the strength of his own arguments erode at sight, which only emboldened the man to continue his blows. What was he supposed to say? Admitting the West Indies military had been poorly conditioned to handle the rebels would further stoke the storm. "Again, I am not at liberty to discuss-"\n\n"You might say that, but some of us could also question the US's recent economic involvement in the Federation, and its role in the leading events. Some might even go as far as to claim American presence is a direct contributing factor in the insecurity you're mentioning." The room erupted into chaos once more, delegates screaming at each other as the general secretary tried in vain to call for order. And among all, he could still see the gaze of the Mexican official piercing through him, barely trying to conceal the hint of a smile."
 Caribbean_flavor.72.a: "No point in trying to maintain a mask that has already fallen once."

 Caribbean_flavor.73.t: "Ripples Across The Pond"
 Caribbean_flavor.73.desc: "In Birmingham, Alabama, there were three buildings, positioned at opposite ends of the city. One was the home of single mother Esther Williams and her two kids, another was the Stag Head Inn, and the other was the home of one George Fish - a younger man of 32, living by himself. While geographically speaking they were polar opposites, the mood that filled the three buildings on a sticky Saturday night could not be more different.\n\nThe Stag Head Inn was bursting with life. Its patrons were all happily toasting and enjoying a night of relaxation after a long week of work. They were all men, and all white, of course. And as their beer bottles and whiskey glasses clinked, they all felt an indiscernible sense of relief. One that few of them liked to acknowledge, but one that they all felt. If the military could crush the blacks in the Caribbean, then they'd surely do the same at home with those rioters, right?\n\nAcross the city, Esther Williams ushered in her kids an hour earlier. She had seen some white men lurking around the area that most certainly didn't live there, and she sure as hell wasn't about to take any risks. While mentally totting up the cost for that week's groceries, she made sure to double lock the doors - the LeBlanc's down the street had been broken into the week before, after all. It was never easy to exist as a black family in the South, but it felt like it just kept getting harder and harder.\n\nAround the outskirts of the city, George Fish sat polishing one of his many rifles. He had been watching the news for information on the riots in the West Indies like a hawk, and had only gotten more and more excited the more he found out. When he heard they had finally put the blacks down, he knew what he had to do. Even if he couldn't join the military, he could help his country in other ways. There was due to be a civil rights march across the city in a couple of days, and he and his buddies were gonna do what they needed to. They would restore order."
 Caribbean_flavor.73.a: "Actions have consequences."

 Caribbean_flavor.74.t: "Hugh Shearer Resigns"
 Caribbean_flavor.74.desc: "Shearer looked half dead behind his desk as he gestured for Hastie to sit down. He wasn't here in a fully official capacity, more as a courtesy. Hastie deserved an explanation, to hear why Shearer was giving up.\n\n"Tell me what's going on, Hugh. We got so far, I know not everything is going right-"\n\n"Not going right, William? I'm barely even Prime Minister after the bailout. My Canadian handlers drag me around everyday; I have barely any control left of my own office, of my own life. Independence was a dream, a dream we are waking up from. We just aren't big enough, we don't have the economy, we don't have the political weight to throw around. We just don't, Hastie." Shearer put his head in his hands.\n\n"Hugh, I get it. Things looked a lot brighter a year ago. I'm not here to convince you, I know when your mind is made up about something. Just promise me. Promise me that you will pull through to the end. For the people. If they must see you resign, let them think the dream is still alive."\n\n"You want me to lie to them William?"\n\n"Yes sir, I do. If they can still dream, then maybe one day we will make it a reality."\n\nHugh Shearer, first Prime Minister of the West Indies Federation, nodded his head and slid over his resignation to Hastie."
 Caribbean_flavor.74.a: "As much as he hated to admit it, Hastie found himself envious."

 Caribbean_flavor.75.t: "The Sowell Plan"
 Caribbean_flavor.75.desc: "Hastie had been away from the Commission for quite some time, a behavior he tried not to make a habit of. In truth, they hadn't even been meeting much in recent times, too much chaos to be able to get that many important people in a room. Finally though, they had gotten everyone together for the first time since the bailout from the U.S. It was pressure from the Americans that had really pushed for this meeting to even take place, making sure every single member of the commission would be there to read the newest report from Thomas Sowell.\n\nThe room was quiet as Sowell read through the report line by line and page by page. No one interrupted him as he read, most knowing that this wasn't really a recommendation for the commission to debate. This was the 'Long arm of Liberty' as the Americans liked to say, their reforms that they are going to strongarm through first the commission, and then the federation's parliament. The commission was just here to make sure everyone knew the plan going forward and to act as glorified grammar checkers for the legal and bureaucratic language of the reform plan.\n\nTo Hastie, the report wasn't even the worst part of the meeting. It was Sowell. He read the report like he knew he had won, like he would finally be able to sell the federation to the highest bidder like he had always dreamed. But Hastie wasn't worried, not yet. There was something Sowell had forgotten about, someone who hated him more than even Hastie did."
 Caribbean_flavor.75.a: "Wait until Eric Williams hears about this."

 Caribbean_flavor.76.t: "Threats of Secession"
 Caribbean_flavor.76.desc: "Thomas Beale Jr. wanted to go one day without another headache. Eric Williams was keen to keep that from him. "This is an outrage Beale! Is this really what the U.S. wants? This reform would be the end of the federation as we know it, we would just be puppets to the larger economies, with no ground to stand on of our own." Williams threw his hands up in the air, waving the report packet around like a flag.\n\n"Mr. Williams, this reform was not put forward by the U.S. alone, it sought the help of members of the commission to put a plan forward that would stabilize the federation's economy and make the best use of the aid that the United States is supplying."\n\n"You sought Sowell, barely a member of the commission and practically a vulture who would sell out to whoever is willing to pay without a second thought. I hardly believe that the U.S. was not aware of his radical economic ideas."\n\n"Mr. Sowell does not have radical ideas. Does he think that the federation's current economy is incapable of supporting its own weight? Yes, and it seems he may be right."\n\nWilliams stared at Beale for a moment, "Well Thomas, we are not going to just take this lying down. If the U.S. wants a reform plan, I'll give them one that can stabilize the economy and bring us out of the Oil Crisis. The U.S. is gonna support this plan Beale, and if they don't, then I don't see a future for the federation that includes Trinidad and Tobago."\n\nBeale felt his eyes grow wide, "Eric, you can't seriously be threatening secession. That would break the federation in half, is that what you want?"\n\n"It doesn't matter what I want, what matters is what you are going to do Thomas.""
 Caribbean_flavor.76.a: ""This isn't gonna work Eric, we aren't just gonna roll over on this one.""
 USA_Sowell_Reform_tt: "§YWe will proceed with the §mSowell Plan§!, this may have dire consequences if Williams holds true to his promise.§!"
 Caribbean_flavor.76.b: ""Fine, tell me about this plan then. I'll have to make some calls.""
 USA_Williams_Reform_tt: "§YWe will proceed with the §MWilliams Plan§!, helping to create a more independent Caribbean.§!"

 Caribbean_flavor.77.t: "The Federation Fractures"
 Caribbean_flavor.77.desc: "William H. Hastie was done waiting. He had been pacing in Sowell's reception room for nearly fifteen minutes, the assistant at the desk scribbling away at a pile of ledgers. Hastie looked between the distracted desk clerk and the door of Sowell's office, and just walked in. The door closed behind him before the assistant looked up from his screen.\n\nInside the opulent office sat Sowell, a huge pile of signed papers piled high next to him. He looked up from his writing and frowned, "Mr. Hastie, I am a bit busy..."\n\nWilliam walked up to Sowell, and swiped the pile of papers off his desk before slamming his hand on the table, "Sowell, are you really locked away in your office while your reforms wreak havoc on the Federation!"\n\n"William, what the hell! What are you even talking about?"\n\n"You really have been locked away, haven't you? Eric Williams seceded, Sowell. Trinidad and Tobago has left the Federation, our economy is on the verge of collapse, half of our administrative staff gutted, and the millions of dollars we had invested in projects there are gone."\n\nSowell sputtered, then stopped and stared at Hastie, the gears visibly turning in his head, a tremor running through his hands. "We... we can survive this. Williams' economy was a weight on us anyway. With it no longer dragging us down we will go even further than predicted." Sowell looked up, meeting Hastie's eye, "The Federation will become a model economy. We can, we must, thrive, and we will, Hastie. We will."\n\nHastie could do nothing but stare at the resolution, the madness, in Sowell's eyes. Without a word, he turned and left."
 Caribbean_flavor.77.a: "If this is the future, I'm not sure if I can be a part of it."

 Caribbean_flavor.78.t: ""
 Caribbean_flavor.78.desc: ""
 Caribbean_flavor.78.a: ""

 Caribbean_flavor.79.t: "Sowell Gets His Way"
 Caribbean_flavor.79.desc: "Thomas Sowell couldn't be happier. He was in his new office reading over the reports following through his economic reformation plans getting jammed through the West Indies Parliament. It took more political maneuvering and favors than should have been necessary, but it was all worth it. Finally, a path forward for the federation had opened up out of the crisis. A new foundation for their economy could be built on foreign investment and aggressive expansion. There was so much value in these islands that was simply being left on the table, while the people could be eating off the fruits of that land.\n\nTo make matters all the sweeter, Williams didn't even follow through on his threat, leaving the political turmoil almost nonexistent. Sowell shook the bucket, and he knew that some of the old fossils wouldn't be too happy, but change needed to happen and it needed to happen fast, lest the whole federation crumble less than a decade from when it started. The hard part though, was over. Convincing everyone of the right path was done, now it was just about the follow through."
 Caribbean_flavor.79.a: "Sowell lit a cigar and started signing papers."

 Caribbean_flavor.80.t: "The Results Are In! Again."
 Caribbean_flavor.80.desc: "If Tomas Beale Jr. was a younger man, when he was a younger man, he would have been waiting at the phone, drumming his hands on his leather chair till it was worn thin, waiting for the first word about the election results. Those days had since passed and so it was that when he called Prime Minister-Elect Tom Adams to congratulate him on his victory he was already home from celebrating. The phone rang an inordinate amount of time before finally it was answered.\n\n"Prime Minister-Elect! I wanted to congratulate you on your victory, it was quite close there for a little bit."\n\n"Mr. Beale! I almost didn't expect to hear from you today, but yes it got a little hairy, and between you and me if Shearer's leadership didn't end the way it did, I don't know if I would be here right now!" There was humor in Adams' voice, but Beale knew the truth of those words better than anyone.\n\n"Well I wanted to let you know that you are the right man for the job, I've seen you grow up with your old man, and even outgrow him and build your own path. He would be proud of you, he was a good man."\n\n"Thank you, Mr. Beale. That means a lot coming from you. I want you to know I'm continuing where he left off and more. We are pushing through the reforms and by the end of my term, the federation will be not only caught up with the world, but ahead of it. Alongside the rest of the OFN of course."\n\n"I'm happy to hear it, Prime Minister-Elect. I can't wait to work with you and see it done. It'll be a dream come true.""
 Caribbean_flavor.80.a: ""I've been dreaming for a long time, Mr. Beale. It's time to make it a reality.""

 Caribbean_flavor.81.t: "A Career"
 Caribbean_flavor.81.desc: "William H. Hastie was in a hard hat for the fourth time in his life, and most likely the last. Perhaps it was better to say that only four times ever did one of the construction projects the West Indies Commission occasionally oversaw demand a member of the commission come out for a day and stand around looking like he knew anything about construction. Hastie was a lawyer, not an architect.\n\nThis new construction was nothing special, a nice hotel catering to foreigners, but it struck something in him as he spent the day staring at the slowly forming silhouette of the federation's future. This was the path forward, like it or not. Hastie had fought to the end to avoid giving away the country to corporate strongmen and international greed, and he had lost. Maybe he was an idealist? He certainly didn't feel like one. He felt like the suit that he had worn everyday for the better part of a century, reliable, methodical. Hastie was a lawyer and he didn't do idealism for idealism's sake. He had seen potential and worked out all the steps to reach it. But here he was, overseeing the first steps of the new prerogative of the West Indies Commission. Sowell had gotten his way at last and surely he was in some boardroom gloating about the amount of money that would pour into the economy soon.\n\nHastie did not like being in a hard hat in the heat, watching another man's dream tear his own apart, but he would do it. At the end of the day, Hastie was not a lawyer, and had not been a lawyer for a very long time. He was a suit, doing his job until his age no longer let him. The new commission would have to make do without his steady hand, and maybe would be better for it. He could only hope.\n\nHastie watched the workers, looking like ants swarming over the tower and thinks:"
 Caribbean_flavor.81.a: ""Maybe I should've just been a lawyer.""

 Caribbean_flavor.82.t: ""
 Caribbean_flavor.82.desc: ""
 Caribbean_flavor.82.a: ""

 Caribbean_flavor.83.t: "The Williams Plan"
 Caribbean_flavor.83.desc: "The West Indies Commission was in an uproar. Eric Williams' reform plans had passed in parliament and the political and economic ripples already were spreading across the Federation. Sowell was fuming as he laid into the commission.\n\n"This is only going to accelerate the problems! We need to decrease spending, stabilize the economy with steady trade, and radically reforming the economy isn't going to do anything but push us over the edge. This is a coup, plain and simple. Williams is taking over the Federation."\n\nMore level heads protested, but in a similar uproar was Baron Molson who echoed Sowell's sentiment, saying that the reforms would tear the federation away from the U.S., whose backing was one of the most stabilizing forces in the West Indies.\n\nHastie, who was the quietest amongst those present, just had a headache from it all. He had done this for too long and was getting far too old to be yelling in a crowded boardroom."
 Caribbean_flavor.83.a: "Really, he just needed to retire."

 Caribbean_flavor.84.t: "The Results Are In! Again."
 Caribbean_flavor.84.desc: "If Tomas Beale Jr. was a younger man, when he was a younger man, he would have been waiting at the phone, drumming his hands on his leather chair till it was worn thin, waiting for the first word about the election results. Those days had since passed and so it was that when he called Prime Minister-Elect Michael Manley to congratulate him on his victory he was already home from celebrating. The phone was answered quickly.\n\n"Prime Minister-Elect! It's Tomas Beale, calling to congratulate you on your victory, it was quite the pull ahead you got there at the end, I almost thought it was going to come down to the last few votes!"\n\n"Mr. Beale! I was expecting your call sometime today, I imagine we have a good bit to talk about. Something tells me working with you will be... eventful."\n\n"I don't know about that Mr. Manley, I know we disagree in practice, simply based on our positions, but I think we can find a way to work together that makes everyone happy."\n\n"Well, maybe not everyone, Mr. Beale, as I'm sure you know we are going to be pushing for more centralization and self reliance, not enough to put you out of a job mind you." The Prime Minister-Elect's laugh felt practiced.\n\n"Oh I know, I know, trust me I haven't heard the end of it. Just promise me something Michael, don't let Eric push you around okay? He might be the architect of the reforms, but you won the people over to them.""
 Caribbean_flavor.84.a: ""I won't, Mr. Beale. I won't.""

 Caribbean_flavor.85.t: ""
 Caribbean_flavor.85.desc: ""
 Caribbean_flavor.85.a: ""

 Caribbean_flavor.86.t: "Vacation Troubles"
 Caribbean_flavor.86.desc: "In Kingston, Jamaica, there were two places of stark difference that defined the mood of the day. One was the breezy veranda of one of the many local hotels, where a group of American tourists sipped rum punch and tried to make sense of the chaos unfolding below. The other was the crowded streets outside Gordon House, where thousands of Jamaican Labour Party supporters surged forward in protest.\n\nThe hotel had promised escape—sun, sea, and the illusion of tranquility. Its guests had come to forget the tensions of home, not to stumble into someone else's. But as the chants from the streets grew louder—"Down with Williams! No to Federation Coup!"—the mood shifted.\n\nA retired schoolteacher from Ohio nervously leaned over to ask the bartender what was going on. He shrugged, poured another drink, and muttered something about "politics and power." Another man, a wealthy southern landlord, began to speak loudly about "order" and "discipline," drawing uncomfortable glances and making the bartender quietly drift to the other side of the bar.\n\nSome peered over the balcony, watching the swelling crowd with a mix of curiosity and unease. Others retreated to their rooms, drawing the curtains and turning up the air conditioning to drown out the noise. The hotel manager, calm but firm, advised guests to remain indoors and avoid the city center. His voice was practiced, he had seen this before.\n\n"
 Caribbean_flavor.86.a: "Even on vacation, we can't escape conflict."

 Caribbean_flavor.87.t: "A Quiet Exit"
 Caribbean_flavor.87.desc: "CONFIDENTIAL/[?global.date.GetDateStringNoHourLong]\n\nFROM FBI DIRECTOR J.EDGAR HOOVER\n\nMEMORANDUM FOR THE U.S DEPARTMENT OF STATE\n\nSUBJECT: WORRYING AUTONOMIST RESURGENCE IN THE WEST INDIES FEDERATION\n\n1. Following the aftermath of the Oil Crisis, the Federation's central government has been granted more control over its local constituents as part of a grander set of reforms. With the stated goal of more harmonious economic planning, these policies, pioneered by then Prime Minister of Trinidad and Tobago Eric Williams, have led to a massive concentration of power in the once decentralized administration, to the concern of some of its member states.\n\n2. With last year's elections confirming Michael Manley of the Federal Labour Party as head of state, Eric Williams has officially taken a step back from power, leaving it in the hands of his former ally. However, it is believed that he retains his position behind the scenes, pulling the strings as a sort of shadow PM. The situation is further concerning considering Williams' strong stance against the American sphere, and is corroborated by rising autonomist attitudes across the Federation.\n\n3. This, coupled with the central government's new developmentalist strategy, is predicted to lead to an increasing series of nationalization programs that could cripple our long-term involvement in the region, especially if it reaches sectors critical to our interests like the oil and bauxite industries.\n\n4. While we remain vigilant in our efforts to closely monitor the situation, I believe it is of the utmost importance that a contingency plan is prepared in case the West Indies Federation were to act on its recent anti-US sentiment."
 Caribbean_flavor.87.a: "Fidelity, Bravery, Integrity" 

 Caribbean_flavor.88.t: "A Blow In Our Backyard"
 Caribbean_flavor.88.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM ALLEN MACPHERSON\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: INSIGHT INTO EAST CARIBBEAN UNION\n\n1. The former British colony of Trinidad and Tobago and the former member states of the Windward Islands, Grenada, and Saint Vincent and the Grenadines had declared independence, uniting into a political union under the influence of Trinidadian governor Eric Williams, named the East Caribbean Union. Williams now leads the union and made overtures towards Mexico to seek economic coordination by joining the Veracruz Pact, promoting "anti-imperialist" leadership.\n\n2. Williams revealed his skepticism towards the United States during open dialogue, with one of the reasons being that the leasing of the Chaguaramas peninsula on Trinidadian territory for use as a naval base undermined Trinidadian governance. \n\n3. Williams' leadership style is more akin to a liberal democracy rather than a revolutionary state, yet their succession from the OFN and openness to invite more Caribbean islands into the union may still further jeopardize the West Indies Commission's oversight in the region.\n\n4. Trinidad's oil reserves continue to finance the union's infrastructure and social development, allowing further centralization of other member states in the union and combat opposition from non-Trinidadians. Though the calls for leaving the East Caribbean Union remain a minority, local opposition can still raise awareness of the negatives of Williams' centralization. Suggested methods include bribing politicians, funding demonstrations and protests by Indo-Caribbeans, etc."
 Caribbean_flavor.88.a: "Fidelity, Bravery, Integrity."
 
 Caribbean_flavor.89.t: "To Protect Your Flock"
 Caribbean_flavor.89.desc: "Shouting and banging. This is what welcomes the first moments of the West Indies Commission meeting. William Hastie recognizes that decorum has been abandoned at the drop of a hat, so he mostly sits idly by while more passionate members can spew out their thoughts regarding a group of tiny island nations abandoning the OFN to form their own union and be done with it.\n\nGrantley Adams, at the far side of the oval-shaped table, mirrors the same solemn complexion as Hastie's. The gentleman from Tennessee recognizes this as a defiance of the manners of the rest of the Commission. Two men who knew, despite the inexorable bickering, that the Commission must find a way to salvage a dire situation, to leave their amateur successors a decent situation to start their tenure. Hastie, to Sowell. Grantley, to Tom. Does not matter how their principles clash; it is simply their duty.\n\n"Grantley, sorry to keep you longer in this room." Hastie had to pull Adams back in before he could plod out. "Want to get you in on an idea in layman's terms. We need a new union to rival Williams'."\n\n"Wouldn't this already complicate this situation? A cold war, right in the West Indies, won't benefit anyone overall." Suspicion is detected from Adams' tone, despite still highlighting a genuine interest.\n\n"Politically and economically speaking, overall, it only strengthens your standing and the West Indies' on the world stage. This new union, the Caribbean Community, would be led by yours truly. Your policies, and perhaps one day your son's, can bear fruit in other communities as well." A brief pause. "But you did not hear this from me.""
 Caribbean_flavor.89.a: "Adams, with half the spirit in his eyes, nodded in response."

 Caribbean_flavor.90.t: "To Protect Your Flock"
 Caribbean_flavor.90.desc: "Shouting and banging. This is what welcomes the first moments of the West Indies Commission meeting. William Hastie recognizes that decorum has been abandoned at the drop of a hat, so he mostly sits idly by while more passionate members can spew out their thoughts regarding a group of tiny island nations abandoning the OFN to form their own union and be done with it.\n\nGrantley Adams, at the far side of the oval-shaped table, mirrors the same solemn complexion as Hastie's. The gentleman from Tennessee recognizes this as a defiance of the manners of the rest of the Commission. Two men who knew, despite the inexorable bickering, that the Commission must find a way to salvage a dire situation, to leave their amateur successors a decent situation to start their tenure. Hastie, to Sowell. Grantley, to Tom. Does not matter how their principles clash; it is simply their duty.\n\n"Grantley, sorry to keep you longer in this room." Hastie had to pull Adams back in before he could plod out. "Want to get you in on an idea in layman's terms. We need a new union to rival Williams'."\n\n"Wouldn't this already complicate this situation? A cold war, right in the West Indies, won't benefit anyone overall." Suspicion is detected from Adams' tone, despite still highlighting a genuine interest.\n\n"Politically and economically speaking, overall, it only strengthens your standing and the West Indies' on the world stage. This new union, the Caribbean Community, would be led by yours truly. Your policies, and perhaps one day your son's, can bear fruit in other communities as well." A brief pause. "But you did not hear this from me.""
 Caribbean_flavor.90.a: "Adams, with half the spirit in his eyes, nodded in response."

