 JAM_flavor.60.t: "A Hairdo"
 JAM_flavor.60.desc: "This was clearly a mistake.\n\nOh, of course, she'd already known long before she'd even booked the flight down to Kingston with her meager doctoral stipend. Yes, she was young, much younger than most attendees. A woman, no less, and not a name carrying any of the weight of Archimède or Madame Blouin. Worst of all sins: she was a Yank, hailing from the very imperialist heart those gathered here were plotting the fall.\n\nYet she'd also done more than her own fair share of organizing. Fellow students had rallied and marched down the streets of San Diego to her call, roaring for the rights of those suffering under the same oppressive yoke. She'd clashed against those of her civil rights comrades who denied a woman's lot deserved just as much to be fought for, as she'd sneered at the others who'd dismissed her peddling of dialectics and class consciousness as a white man's thing.\n\nBut witnessing the fire, pure and unbridled, that had just occurred within these four walls had seemingly rendered it all so pointless.\n\nNot just hers, but the whole struggle back home that still dared label itself revolutionary. While all they could ever hope to achieve was to propel a slightly less bigoted suit to the White House and earn some token recognition that'd never shield them from a Klan bonfire, the people assembled here were kindling something so, so much more; so why was she walking down the steps of a lecture hall still half-full of the firebrands of Caribbean socialism, trying to chance a meet with-\n\n"A word, Mr. Strachan?" But as soon as the sentence had left her mouth, so did the doubts from her mind, once more replaced by the same poise and confidence that had already brought her so far. Because if she could bring but a spark of this fire home... "Oh, I apologize. Where are my manners?""
 JAM_flavor.60.a: ""Angela Davis," she continued, raising her hand for a shake. "CPUSA.""

 JAM_flavor.61.t: "Bob Marley Denied Entry to the United States"
 JAM_flavor.61.desc: "BY JOHN LINQUIST\n\nMIAMI, [GetDateText] — Bob Marley, founding member and leader of the Wailers, arrived at Miami International at around 3 p.m. from Strachan International to commence his tour to promote his upcoming album, Soul Rebels. However, TSA agents stationed there had denied passage for the musician on grounds of "geopolitical concerns". The Wailers thereafter announced the cancellation of the tour appearances soon after returning to Kingston.\n\nA spokesman on behalf of the Transportation Security Administration, in response to outcry from fans of the reggae artist, stated the dangerous affiliations with the Strachan regime as the main factor for denied entrance.\n\n"To ensure the stability of our nation's political atmosphere, it is prudent to not allow any alleged unespied persons-of-interest to inoculate any radical ways of thought into the American people." — an excerpt from the published statement.\n\nCivil rights organizations had decried the decision to disallow the tour and impute the Wailers as unjust. Whitney Young, executive director of the National Urban League, a flagship organization aimed at promoting civic equality, expressed his dissatisfaction through a phone interview. Mr. Young described the move as a "hindrance to Black empowerment" and expressed that the cancellations of the tour may enervate the public's attention to racial equality.\n\nSince the violent revolution had overthrown Bustamante from power, the nascent left-wing regime in Jamaica had a continuously contentious bilateral relationship with the United States..."
 JAM_flavor.61.a: "The shadow cloaks on the Yardies."

