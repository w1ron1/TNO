 JAM_flavor.79.t: "Ямайка просить про фінансову допомогу"
 JAM_flavor.79.desc: "CONFIDENTIAL\nДЛЯ МІНІСТРА ЗАКОРДОННИХ СПРАВ\n\nЯмайка — Кариби\n\nНедавній обвал цін на нафту та спричинена ним економічна криза тепер поширилися й на Кариби. Недавні повідомлення з Кінґстона свідчать, що Ямайка особливо сильно постраждала від цих подій. Бустаманте почав тиснути на іберійських дипломатів у регіоні, вимагаючи від нас надати Ямайці фінансову допомогу та пробачити борги, натомість пропонуючи значні поступки щодо доступу до плантацій, якщо ми погодимося.\n\nХоча приватно він представляє це як частину заходів із надання допомоги, справжня причина майже не пов'язана з цим. Безрозсудні витрати означають, що тепер він ризикує втратити контроль над бандами, яким платить, а без цієї допомоги вони стануть значно нахабнішими, загрожуючи його центральній владі. Без фінансової допомоги ми також ризикуємо підштовхнути Бустаманте до Сполучених Штатів або Мексики, що, ймовірно, призведе до загострення ризиків міграційної кризи. Обидві країни мають доступ до значних запасів нафти, як і Ґаяна та Венесуела, і охоче повернуть собі вплив у регіоні. У цій ситуації неминучими програвшими будемо ми, як і наші компанії в регіоні.\n\nЧи маємо ми кошти, щоб дозволити собі таку допомогу, — сумнівно, але так само сумнівно, чи можемо ми дозволити собі її втратити. Буде важко виправдати надання будь-якої іноземної допомоги як серед економістів, так і серед широкої громадськості, незалежно від минулих зв'язків із Ямайкою, особливо з огляду на нинішню нестабільність ринку. Однак Ямайка є цінним місцевим союзником; її втрата була б значною. Витрати також відносно невеликі, а вигода від фінансової допомоги може значно покращити наш міжнародний імідж, особливо якщо Сполучені Штати вдадуться до політики жорсткої економії."
 JAM_flavor.79.a: "Надати їм допомогу, але подбати, щоб наші компанії могли дати відсіч цим бандитам, якщо буде потрібно."
 JAM_flavor.79.b: "Ще жодної клятої песети!"


