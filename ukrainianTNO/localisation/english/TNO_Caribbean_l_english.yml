 Caribbean_flavor.95.t: "Bellum"
 Caribbean_flavor.95.desc: ""Сан-Хуан не має дозволу на це," — сказав агент тихим голосом. "Ти справді думаєш, що це правильний крок?"\n\n"Я знаю, що це правильний крок", — сказав Шеклі. Він зважив варіанти. Він розумів ризики. Дозвіл Білого дому за таких ставок був просто формальністю; безглузда паперова тяганина, яка лише сповільнювала його операцію.\n\nАгент видихнув. "Для нас це не звичайна справа, Теде. Ми говоримо про повномасштабне вторгнення. Висадки. Опір. Щось, що ось-ось потрапить у міжнародні заголовки, а ти не хочеш, щоб Вашинґтон про це знав?"\n\nШеклі відкинувся назад, жуючи сигару. "Ми це контролюємо, Ріґсбі. Ми вже робили це одного разу з Карибським легіоном. Та сама стара вистава з маленьким Трині. Це просто буде символічна сила для Ґейрі, щоб розпалити якийсь опір у Ґренаді."\n\nАгент Ріґсбі похитав головою. "Вони скоро про це дізнаються, Теде. Я хочу, щоб спочатку вони почули це від нас, а не з якоїсь довбаної газети Washington Post."\n\n"Тоді ми надішлемо їм це завтра вранці!" Шеклі грюкнув текою. "Скажи їм, що наші телефонні лінії перерізали чи щось таке, Ріґсбі. Це наш шанс прибрати Тринідад і решту Карибів під свій контроль, тож я впевнений, що цей крок належить до моєї компетенції. Впевнений, що тут час має набагато, набагато більше значення, ніж якийсь бюрократ, який скаже мені, що я отримав дозвіл. Впевнений, що хтось має запалити цю іскру!"\n\nШеклі відкинувся в кріслі, дозволивши собі тонку, майже непомітну посмішку. У грі, якою були Кариби, не було часу розмірковувати, якою буде наступна карта, перш ніж бити чи зупинятися. Іноді подвоїти ставку було просто правильним ходом."
 Caribbean_flavor.95.a: "Наступного ранку не було надіслано жодної передачі чи телефонного дзвінка."

 Caribbean_flavor.96.t: "Aut Vincere, Aut Mori"
 Caribbean_flavor.96.desc: "Зі свого місця Ерік Ґейрі спостерігав, як сонце повільно сходило, забарвлюючи червоний горизонт, що переходив у помаранчевий, а відображення та заломлення морського світла малювали мерехтливу лінію до їхнього пункту призначення. Коли LCI, що перевозив Ґейрі та його власний гарнізон, наближався до берега, він витріщався на гай зелених дерев, пальм та мангрових заростей, що затіняли силуети дороги попереду.\n\nКоли десантний корабель усе ближче підходив до піщаних пляжів, Ґейрі відчув докори сумління. Бути ланцюговим псом ФБР, пробиратися на батьківщину як підступний загарбник, убивати власних співвітчизників, щоб самому захопити владу — невже справді все добре, що добре закінчується? Що станеться з його спадщиною, якщо він програє цю ставку? Він подивився на свій легіон солдатів: власних ґренадських перебіжчиків, найманців зі США та звідусіль, і навіть вигнанців із Тринідаду та Сент-Вінсенту, яких переслідували люди Вільямса. Ґейрі зайшов так далеко, коли скликав зустріч у Сан-Хуані; другі думки вже не личили його мундиру.\n\nЧоботи рушили вперед в унісон, щойно ніс торкнувся піщинок, а танки M41 котилися поруч із полками назустріч долі. Коли заколотники зникли під листям на шляху до дороги, постріли та підтримка B-26B від американських льотчиків заглушили ідилічну пляжну атмосферу, поки люди Ґейрі атакували вогнем із-за укриттів.\n\nВпевненість Ґейрі в операції відновилася завдяки цьому стабільному початку. Добре навчені люди під його командуванням і висадки інших дивізій по всій східній Ґренаді сприяли втраті Силами оборони Східних Карибів контролю над цією землею.\n\nСаме тоді він зрозумів, що до прибуття сюди ніколи не милувався пишнотою безхмарної золотої години."
 Caribbean_flavor.96.a: "Перша зупинка: Ґранд-Мал-Бей."
 
 Caribbean_flavor.98.t: "Incontinens"
 Caribbean_flavor.98.desc: "Телефони дзвонили. Меморандуми надсилалися. А ще сотня коробок піци прибула до дверей Державного департаменту, пропонуючи працівникам пізню вечерю, поки вони невтомно працювали над вирішенням ситуації.\n\nВисадка в Ґренаді вже тривала, і міжнародна спільнота вказувала пальцями на Сполучені Штати. Однак ніхто в Білому домі не пригадував, щоб санкціонував таку дію. Невелика кімната чиновників обговорювала подальший курс дій. Без сумніву, Організація американських держав мала негайно зібратися.\n\nАле обговорити що саме? Дехто закликав стримати вторгнення Ґейрі до Ґренади, тоді як інші чиновники бачили в цьому можливість змусити Вільямса відмовитися від своєї націоналістичної риторики. Обидві дії несли ризик. Вторгнення вже тривало, а відступ міг поставити американську зовнішню політику в незручне становище. Але скористатися ослабленням Східнокарибського Союзу й вимагати поступок щодо Чаґуарамаса могло породити ворожість, особливо якщо Мексика почала б підтримувати Вільямса.\n\nЛід був тонким, і рішення Вашинґтона тут могло визначити відносини з СКС, Мексикою та, можливо, всім Карибським басейном на найближчі місяці, якщо не роки.\n\nЗа тисячі миль звідси, на станції в Сан-Хуані, Шеклі поклав слухавку після розмови з розпачливим працівником Державного департаменту. Лише тоді він згадав, що меморандум так і не було надіслано до Білого дому. На мить він подумав скласти його — заради формальності. Але момент уже минув."
 Caribbean_flavor.98.a: "Здавалося, дозвіл не стосувався таких людей, як він."
 
 Caribbean_flavor.99.t: "Inter Aquilas"
 Caribbean_flavor.99.desc: "Телефони знову задзвонили, але цього разу слухавки підняли в Бразилії, Гавані та Мехіко.\n\nСотні делегатів стікалися до зали, поки американські дипломати тихо готували свої пропозиції щодо того, що вони називали Ґренадською кризою. Організація американських держав не збиралася через дрібниці. Здавалося, всі — кожна нація — у кімнаті розуміли серйозність ситуації, наслідки того, якщо дозволити будь-якому з Ерікiв домогтися свого.\n\nДля Америки та Мексики, однак, Ґренада стала б зіткненням за вільний світ; два орли, що кружляють над карибським озером.\n\nПерша пропозиція передбачала тиск на Вільямса, щоб він поступився в питанні Чаґуарамаса, дозволивши американській військовій базі залишатися дієздатною в Тринідаді. Пом'якшення його націоналістичної риторики в обмін на американську підтримку. Вільямс вважав би це перемогою. Однак Вашинґтону цілком підходило б повернути дружній уряд у Порт-оф-Спейн.\n\nДруга пропозиція повністю підтверджувала американську підтримку незалежності Ґренади та одностороннє визнання державами-членами Організації американських держав. Це відштовхнуло б Східнокарибський Союз — та решту Веракруського пакту, але зараз був не час демонструвати слабкість перед такими можновладцями, як Вільямс.\n\nТретя пропозиція рекомендувала стриманість. Провести голосування. Нехай усе йде своїм ходом, навіть якщо результат буде несприятливим для американських інтересів."
 Caribbean_flavor.99.a: ""Подивімося, яку угоду ми зможемо укласти з Вільямсом.""
 Caribbean_flavor.99.b: ""Тепер уже надто пізно відмовлятися від нашої людини в Ґренаді.""
 Caribbean_flavor.99.c: ""Ми збережемо нейтральну позицію. Гемісферна стабільність має залежати від ОАД.""

 Caribbean_flavor.101.t: "Fortuna Audacis"
 Caribbean_flavor.101.desc: "Голосування навіть близько не було.\n\nМексика говорила довго. Так само й представники Східних Карибів. Прецедент. Незаконний характер вторгнення. Їхні заперечення були внесені до протоколу, але не були нічим більшим за прості слова.\n\nСантьяґо став у стрій. Монтевідео став у стрій. Навіть Бразилія та Буенос-Айрес змогли дійти згоди щодо цього питання.\n\nҐренада мала бути в односторонньому порядку визнана Організацією американських держав і негайно прийнята до її складу. Будь-яка спроба скасувати результат вважалася б загрозою стабільності півкулі. У разі необхідності розглядалася б інтервенція.\n\nЗа тисячі миль звідси Шеклі почув новини по радіо.\n\nЖодної догани; жодного протистояння.\n\nВашинґтон зумів укласти угоду, яку підготував Шеклі. Завдяки цій авантюрі Америка змогла забрати всі карибські фішки собі."
 Caribbean_flavor.101.a: "А Шеклі мав увійти в історію як герой."
 
 Caribbean_flavor.102.t: "Calculus"
 Caribbean_flavor.102.desc: "Голосування було близьким.\n\nМексика виступила першою. Потім Східнокарибський Союз. Однак питання не подавалося як повстання. Відновлення. Регіональний порядок. Примирення. Кожне слово було кроком назад від ескалації, що спиралося на попереднє, щоб зустрітися посередині з американцями.\n\nАмериканська делегація також не намагалася загострювати ситуацію. Про інтервенцію не йшлося. Визнання Ґренади не згадувалося. Вони просто дозволили дебатам іти природним шляхом.\n\nІ резолюція була ухвалена з полегшеним зітханням усіх сторін.\n\nҐренада мала бути негайно повернута до складу Східнокарибського Союзу. Натомість Ґейрі та його соратники отримали б амністію в Союзі. Уряд Вільямса безпечно залишався б у Порт-оф-Спейні ціною поступок щодо американської нафти та півострова Чаґуарамас. Прем'єр-міністр присягнув більше ніколи не говорити про націоналізацію.\n\nЗа тисячі миль звідси Шеклі почув новини по радіо.\n\nЖодної догани. Жодного протистояння. Але й жодної похвали.\n\nЕрік Вільямс ухилився від кулі Дядька Сема й забезпечив собі безпеку в Карибському басейні. Америка не отримала стільки, скільки хотіла.\n\nАле Ґренада була лише одним островом із тисячі."
 Caribbean_flavor.102.a: ""А Шеклі мав увійти в історію як суперечлива постать.""
 
 Caribbean_flavor.103.t: "Interregnum"
 Caribbean_flavor.103.desc: "Голосування не змогло зібрати чіткої більшості.\n\nМексика не поступилася. Америка також. Проте гостра риторика лише розколола залу імені Сімона Болівара.\n\nМайже не мало значення, як це формулювали: Визволення чи вторгнення. Свобода чи імперіалізм. Порядок чи хаос. Зрештою жодна зі сторін не змогла сформувати переконливої більшості проти іншої.\n\nНе було ні визнання незалежності Ґренади, ні поступок з боку Східнокарибського Союзу.\n\nОрганізація американських держав завершила засідання без результату. Репортери галасували надворі, чекаючи відповідей, яких ніхто не мав. Клапани по всьому Тринідаду залишалися закритими. Води навколо Ґренади стали ще трохи темнішими відтінками червоного.\n\nА на станції в Сан-Хуані лежав Шеклі. Радіомовчання вже розповіло йому достатньо про результат."
 Caribbean_flavor.103.a: "А Шеклі мав увійти в історію як невдаха." 
 
 Caribbean_flavor.104.t: "Periculum"
 Caribbean_flavor.104.desc: "ЦІЛКОМ ТАЄМНО/[GetDateText]\n\nВІД ОСКАРА КОТТОНА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ЗРОСТАННЯ НАПРУЖЕНОСТІ ЗІ СХІДНОКАРИБСЬКИМ СОЮЗОМ\n\n1. Голосування в Організації американських держав (ОАД) щодо незалежності Ґренади зайшло в глухий кут. Відносини між ОВН та Веракруським пактом продовжують погіршуватися, причому обидві сторони (Східнокарибський Союз та Ґренада) не бажають досягати остаточного консенсусу.\n\n2. Розвідка оцінює це як прорахунок щодо американської доброї волі та впливу, включно з непідтвердженими звинуваченнями в американській підтримці філібастерського повстання Ґейрі в Ґренаді, що змусило держави-члени ОАД сформувати незалежні школи думки щодо ґренадської справи.\n\n3. У відповідь на цей політичний інцидент держави-члени Веракруського пакту організували односторонній бойкот американських товарів, щоб ""осудити ганебні дії Америки"". Карибські держави-спостерігачі можуть бути спокушені вийти з-під американського впливу, оскільки можуть сприйняти цю подію як ""зраду демократичних принципів"".\n\n4. Перший варіант протидії ситуації — укласти таємну угоду з союзом Вільямса, щоб заручитися нашою підтримкою проти Ґренади, хоча це вимагатиме відмови від надійного союзника на периферії Союзу. Другим варіантом буде підтвердити тверду підтримку Ґренади, потенційно ціною подальшого дипломатичного зближення Вільямса з Мексикою. Нашим останнім варіантом буде перечекати й дозволити Вільямсу під тиском погодитися з цим новим геополітичним становищем."
 Caribbean_flavor.104.a: "Влаштуймо бійку на зустрічі з Вільямсом."
 Caribbean_flavor.104.b: "Немає причин втрачати Ґренаду після всього цього."
 Caribbean_flavor.104.c: "Нехай Вільямс помучиться."
 
 Caribbean_flavor.106.t: "Бик у ямі"
 Caribbean_flavor.106.desc: "Американська оренда, американська нафта. Вони грали Чаґуарамасом і економікою Тринідаду як грою в карти. Навіть якщо янкі ніколи не обіцяли бути альтруїстичним сюзереном, Вільямс думав, що мексиканці нададуть достатню підтримку, щоб зламати ґренадців. Такий короткозорий, такий наївний. Він мав почути американську армаду за милі. Невже він був глухий навіть до реальності?\n\nПрацювати проти всього ОВН, проти Вільного світу було б сизіфовою працею. Тринідад означав для американських бюрократів усе й нічого. Один рух із Вашинґтона міг бездумно розчавити Порт-оф-Спейн. Більше не має значення, чи хтось вважає його безхребетним, чи чи пошкодує він незабаром про поступки тим імперіалістам. Він обрав неправильну боротьбу. Іберійці й самі були б лютими супротивниками. Стоси паперів, ще більше стосів надзвичайних ситуацій. СКС потрібно було відступити, перш ніж він загине. Вільямс не припустився жодної помилки, якої він не міг би припуститися.\n\nГазети мовчать про угоду, Ґейрі мовчить приблизно так само. Один лише помах руки з Білого дому, схоже, відрізав Ґейрі від решти світу. Скам'янілі, маловідомі скандали просочувалися крізь жорсткі рамки ґренадських ЗМІ. Та крихта поваги, яку здобули філібастери, розчинилася за одну ніч. Ґренадці тепер хочуть, щоб їхні так звані визволителі забралися.\n\nҐейрі отримав квиток в один кінець. Не вагаючись, він вирушив на зеленіші пасовища. Тиша. Лише насмішкувата тиша. Те, що здавалося найбільшою кризою для виживання Союзу, виявилося просто капітуляцією обох сторін. Ґренадців перед тринідадцями, східних карибців перед своїм господарем. Північний гігант випотрошив обох. Монро, можливо, більше немає, але його дух живе."
 Caribbean_flavor.106.a: "Навіть найлютиший звір мусить підкорятися в Колізеї."

 Caribbean_flavor.107.t: "Дипломатія з биком"
 Caribbean_flavor.107.desc: "Дипломати наполягали днями; Вільямс не допускав їх тижнями. Зрештою, Ґренада — це шматок скелі — для СКС важливо довести, що він є чимось більшим за ланцюгового пса будь-якого колоніального сюзерена. Вільямсу не доводилося слухати безликих людей, які в одну мить вихваляли його, а в іншу — ображали. Правда була проста: ґренадці — той самий народ, що й тринідадці; вони східні карибці. Філібастери не були популярними, але Вільямсу потрібно було лише показати світові правду, щоб припинити надходження їхньої зброї з Вашинґтона.\n\nКоли Вільямс дійшов цього висновку, янкі перейшли від пропозицій послуг до погроз силою. Вони зірвали маску цивілізації, щоб показати світові, якими вони є псами. Вони гавкали на Вільямса через Чаґуарамас, гарчали на нього через барелі бітуму. Торгуючись, як звір зі своєю здобиччю, Вільямс у відповідь дав їм стільки поваги, скільки вони заслуговували. Коли ті тварини дали йому варіанти «так» і «ні» щодо поступок їхнім умовам, чи справді вони мали на увазі це як варіанти, чи це мало бути погрозою? З кожним кроком, коли Вільямс відмовлявся відступати, світ дедалі більше бачив справжнє обличчя янкі.\n\nЗухвалість. Зухвалість була гріхом, який скоїли ті янкі. Світ накопичив достатньо терпимості до несправедливості, але не до дволиких брехунів. Вони намагалися захопити багатства й землі Тринідаду, а отже, не заслуговували ні на те, ні на інше. Коли Вільямс оприлюднив їхні переговори перед світом, чому ж вони раптом змінили свою думку й більше не бажали надавати ґренадцям їхнє так зване самовизначення? За кілька років вони коронують себе ще одним імператором і повернуться як найзухваліший головоріз Карибів, але не сьогодні."
 Caribbean_flavor.107.a: "Ланцюгів недостатньо для буйного бика."

 Caribbean_flavor.108.t: "Gradus"
 Caribbean_flavor.108.desc: "0812\n\nМексиканські судна помічені біля півострова Юкатан.\nЇхній курс вказував на рух у напрямку Малих Антильських островів.\nЗашифрований радіообмін свідчив про координацію зі Східнокарибським Союзом.\n\n0936\n\nДванадцять невпізнаних F-100 Super Sabre увійшли в повітряний простір Ґренади.\nТраєкторії польоту відповідають розвідці перед висадкою.\n\n0952\n\nЕрік Вільямс звернувся до нації з Порт-оф-Спейна.\nВін засудив Ґренаду за відмову від усіх пропозицій досягти дипломатичної угоди.\nВільямс заявив, що сила стала необхідністю.1122\n\nВійськово-морська розвідка США підтвердила, що мексиканські есмінці пришвартувалися в Тринідаді.\nНа палубі було видно десантні кораблі.\n\n1534\n\nПрибережне радіо Ґренади замовкло."
 Caribbean_flavor.108.a: "Шеклі загасив сигару ще до того, як надійшов третій звіт."
 
 Caribbean_flavor.110.t: "Umbra"
 Caribbean_flavor.110.desc: "Сесару було дев'ятнадцять, коли осколок розірвав його ногу. Він ледве встиг побачити фронт, перш ніж його відправили на лікарняне ліжко, де він провів решту війни, позбавлений честі та слави.\n\nКоли він знову навчився ходити, Іспанія — точніше, Іберійський Союз — уже пішла далі без нього. Під час Громадянської війни в кожного була своя історія. Сесар міг розповідати лише про те, наскільки рідкою була лікарняна каша.\n\nВін підвів погляд. Узбережжя повільно зменшувалося на горизонті, розчиняючись у глибокій синяві Атлантики. Чайки над гаванню ставали тонкими рисками на тлі неба. Відстань змушувала все здаватися менш важливим.\n\nРозгорнувши зім'ятий аркуш паперу, він знову прочитав листівку, перевіряючи деталі. Вицвілі літери складалися в назву острова: Ґренада. Колись він уявляв, як помирає за Ґранаду, але Ґренада була більш-менш тим самим. Але на борт його привела не грошова винагорода найманця. Не ідеологія. Здатність. Здатність зробити те, що історія не дозволила йому зробити.\n\nСесар ніколи не мав здатності воювати у війні. Сесар ніколи не мав здатності знайти собі роботу, яка його задовольняла. Сесар ніколи не мав здатності не опинитися на вулиці. Сесар ніколи не мав здатності знайти чоловіка своєї мрії.\n\nАле тут у нього була здатність. Здатність творити історію, хай і малу. Здатність розповідати історії, хай і здалеку. Здатність контролювати щось, хай і невідоме.\n\nВін лише сподівався, що цього разу снаряд упаде далі."
 Caribbean_flavor.110.a: "Деякі привиди ніколи не знаходять спокою."

 ### Federation NOT Formed

 Caribbean_flavor.114.t: "Так минає мирська слава"
 Caribbean_flavor.114.desc: "Сесар вдихнув повітря. Сіль. Кордит. Гниль. Це було нудотно, так, але Сесар придушив усе, що міг. Флотилія десантних катерів уже кілька годин тому відступила. Тіла вкривали пляжі, ліниво присипані піском, який здіймався під час сутички.\n\nДзвін у вухах, що не припинявся відтоді, як закінчилася битва, зник. Він підслухав розмову кількох офіцерів, що проходили повз. Мексиканські та східнокарибські сили вже відмовилися від подальших планів щодо острова. Ерік Ґейрі, лідер Гренади, присягнув на вірність Іберійському Союзу. Якісь гарантії безпеки. Передова оперативна база в Карибах. Карти мали бути перемальовані через один-єдиний острів.\n\nАле Сесара не цікавила реальна політика, що стояла за всім цим. Гренада не була Ґранадою. Не було художників, які б увічнили боротьбу. Не було пісень, які б несли далі її кров, піт і сльози.\n\nВін поворушив плечем. Воно боліло там, де його забило віддачею. Він майже забув, що годинами стріляв зі своєї зброї, захищаючи клаптик землі, на який ступив лише тиждень тому.\n\nАле цього разу не було нош, щоб винести його звідси.\n\nСесар дивився, як хвилі відступають від пляжу, несучи зброю та гранати в океан. Уперше у своєму житті він мав змогу щось змінити."
 Caribbean_flavor.114.a: "Veni, vidi, vici."
 Caribbean_flavor.114A.t: "У порох повернешся"
 Caribbean_flavor.114A.desc: "Якщо й було щось, що Сесар ненавидів у Гренаді, то це комарі. Принаймні кулі були швидкими й гострими. Комарі дошкуляли тобі й поверталися за добавкою.\n\nІберійська інтервенція завершилася повним провалом. Не було атаки. Не було жодної спроби по-справжньому захистити острів. Вигляд мексиканських військових кораблів і східнокарибських десантних катерів, здавалося, налякав усіх найманців і бійців Легіону Кондор.\n\nУсе, що Сесар міг згадати, — це порожні клацання, коли його гвинтівка зрештою залишилася без набоїв. Ударник відчайдушно вимагав нових набоїв, поки всі товариші Сесара тікали. Але цього й слід було очікувати від найманців.\n\nВін провів пальцями по шраму на нозі. Старому, з 1937-го. Принаймні та війна залишила йому щось, чим можна було похвалитися. Сесар відкинувся назад і заплющив очі.\n\nТри дні на чужій землі. Три дні, щоб щось зробити зі своїм життям. Тепер він з нетерпінням чекав трьох років, проведених у гнитті в цьому таборі для військовополонених.\n\nВони могли забрати острів. Вислати того боягузливого сучого сина Ґейрі до Іберії. Анексувати Гренаду. Йому було байдуже.\n\nАле вони не могли забрати це. Це відчуття. Цей приплив сил.\n\nСесар прийшов. Сесар стріляв. Сесар залишився."
 Caribbean_flavor.114A.a: "Non omnis moriar."

 Caribbean_flavor.117.t: "Після факту"
 Caribbean_flavor.117.desc: "Попільничка була вже повна. Каламутний серпанок прилип до стелі, тонкими завитками тягнучи дим і розмиваючи флуоресцентні лампи нагорі. Манільські папки були розкидані по столу. Хтось колись їх упорядкував, але той час давно минув.\n\nПриглушений телевізор у кутку показував анімованого Еріка Вільямса, який вихвалявся своїми успіхами перед народом Тринідаду і, певною мірою, перед народами Карибів.\n\nПапку передавали столом американські чиновники в костюмах. Багато хто навіть не потурбувався поглянути на неї. Нафтопереробні заводи Тринідаду більше не належали Дядькові Сему. Вільямс зараз контролював чорне золото. В іншому звіті ходили чутки, що Вільямс купує Домініку та Сент-Люсію до Союзу за нафтові гроші.\n\nПередали ще одну папку. З неї висипалися фотографії. Зернисті, але крізь чорно-біле проступало червоне сонце. Японський прапор майорів на кораблі, що причалював у Порт-оф-Спейні. Рукостискання між Вільямсом і делегацією азійських чоловіків у костюмах.\n\nПередали останню папку, помітно тоншу за попередні. Станція Сан-Хуан. Ніхто не хотів про це говорити. Ніхто не хотів про це знати. Криза вже сталася, а наслідки для Шеклі вже були визначені.\n\nНіхто в конференц-залі не хотів обмінюватися словами про ганьбу, якою була Гренадська криза. І тому стільці заскреготіли по підлозі, піджаки зняли з вішаків, а Потомак продовжив текти так само, як і завжди."
 Caribbean_flavor.117.a: "Цього не можна було сказати про Кариби."

 Caribbean_flavor.118.t: "Гордість перед падінням"
 Caribbean_flavor.118.desc: ""То це шосте родовище?" Американський геолог витер туман із окулярів. Серед усіх насосних станків у ґрунті Тринідаду була певна природна краса. Принаймні в тому, що від неї залишилося.\n\nТринідадський керівник кивнув. "Це ви тепер так його називаєте."\n\n"Видобуток виглядає перспективно." Геолог перегорнув зелені графіки й таблиці даних. "Він подвоїться, щойно ми привеземо наше обладнання. Чув коли-небудь про сланцеву нафту, синку?"\n\nЧоловік похитав головою. "Ні, сер."\n\n"Що ж, це буде найкращим, чорт забирай, що коли-небудь траплялося з цим островом." Американець поплескав його по спині. "Скільки ти працюєш на цьому родовищі, містере..."\n\n"Андесон." Тринідадець відвів погляд удалину, спостерігаючи за полями, що простягалися до горизонту. "І я працюю на цих полях відтоді, як працював мій батя. До нафти ми вирощували цукрову тростину."\n\n"Що ж, прибутковішого за нафту не буває." Геолог хихикнув, перш ніж поглянути на групу робітників, що зібралися й спостерігали за розмовою двох чоловіків. "Твоїм робітникам не заважає, що я ходжу тут?"\n\n"Вони просто спостерігають," — зауважив Андерсон. "Вони ніколи не бачили такого чупіда, як ти."\n\nГеолог усміхнувся, махнувши байдужим робітникам. "Що ж, я просто хотів ще раз подякувати вам, містере Андерсоне, за ваш час. Ваша країна зробила правильний вибір на користь Америки."\n\nАндерсон повільно кивнув, усе ще відмовляючись дивитися геологу в очі. "Довга мотузка для магґа-кози, американець.""
 Caribbean_flavor.118.a: ""Це означає «дякую» тринідадською.""

 Caribbean_flavor.119.t: "Нехай впаде небо"
 Caribbean_flavor.119.desc: "Навпроти Еріка Вільямса Каллавей занотовував щось у своїй папці. "Довгий переліт, прем'єр-міністре Вільямсе?" Американський дипломат кашлянув, його очі залишалися байдужими до відповіді. Він посунув до Вільямса невелику пачку документів.\n\n"Дев'ять годин і двадцять сім хвилин." Вільямс відкинувся на спинку крісла, дивлячись на стельові лампи, доки очі не почали боліти. "І мене зустрічають лише інструкції, нагадування та меморандуми."\n\nКаллавей поглянув на свої нотатки. "Що ж, президент просто хоче переконатися, що ми не зіткнемося з жодними непорозуміннями. Не так давно ми були по різні боки-"\n\n"І це все добре, містере Каллавею," — тихо засміявся Вільямс. Його пальці забарабанили по столу. "Гадаю, якби я залишився по інший бік, американські чоботи невдовзі ступили б на пляжі."\n\nКаллавей завагався. "Ви здаєтеся... занепокоєним, сер. Чи хотіли б ви-"\n\n"Занепокоєним? Ні." Вільямс випростався у кріслі. "Гадаю, американці в Чаґуарамасі кращі, ніж американці по всій моїй країні."\n\nКаллавей мовчки щось занотував.\n\n"Але дозвольте одну пораду, містере Каллавею." Вільямс дістав ручку й нашкрябав свій підпис на договорах перед собою, майже не читаючи їх. "Хоча це можу бути не я..." Вільямс сильніше натиснув на ручку. "Хтось інший боротиметься за Кариби."\n\nНаконечник ручки розколовся. Чорнило розлилося по всьому столу."
 Caribbean_flavor.119.a: "Fiat justitia."

 Caribbean_flavor.120.t: ""
 Caribbean_flavor.120.desc: ""
 Caribbean_flavor.120.a: ""

 Caribbean_flavor.121.t: "Наше море"
 Caribbean_flavor.121.desc: "Ерік Ґейрі послабив краватку. Він досі чув рев оплесків, що лунав від стін. Він досі пам'ятав, як усміхався перед камерами, можливо, трохи надто сильно. Він досі пам'ятав, як потискав руки американським делегатам, можливо, надто захоплено. Але найкраще він пам'ятав людей, які вигукували їхню новонабуту ідентичність. Більше не громадяни тієї проклятої Східнокарибської Унії.\n\nГренадці. Це звучало краще.\n\nҐейрі підняв келих і зробив ковток. Він дозволив алкоголю затриматися на язиці, насолоджуючись теплим печінням. Потім — дуб; карамель; цитрус. Важко було перевершити місцевий гренадський ром.\n\nТижнями за ним полювали всі солдати, яких лише міг зібрати Веракрус. Але після всього тиску, який Східнокарибський Союз чинив на нього, після всього, що Ґейрі зробив, щоб тримати їх на відстані, йому залишилися лише солодкі плоди незалежності Гренади.\n\nВін відкинувся в шкіряному кріслі. Його зап'ястя досі боліло від усіх угод, які він підписав того ранку. Він навіть не потурбувався прочитати жодну з них. Торговельні угоди. Військовий доступ. Взаємна оборона. Що б американці не запропонували, усе було лише в інтересах Гренади. Принаймні набагато краще за те, чому Вільямс піддав Гренаду.\n\nҐейрі досі пам'ятав, як прибув до Сан-Хуана лише в одязі на собі й, можливо, з трохи надто великою енергією. Але ця енергія привернула увагу агента Шеклі, і Шеклі здійснив для нього чортове диво.\n\nУперше від початку вигнання він відчув себе... живим. Ні. Живий — не те слово. Живим було його вигнання, його втеча від Вільямса.\n\nСпокій. Він відчував спокій."
 Caribbean_flavor.121.a: "Хвилі відступали, як завжди."

 Caribbean_flavor.122.t: "Нова тінь"
 Caribbean_flavor.122.desc: ""Ти не торкнувся кави, Стівенсе." Горторн жестом указав на кухоль, що вже охолов. "Не плануєш сьогодні не спати?"\n\n"Що тут робити сьогодні вночі?" — фиркнув Стівенс, відсуваючи кухоль. Офіцер розвідки не мав наміру розслідувати гренадське фіаско більше, ніж уже розслідував. Ніхто не мав.\n\n"Що ж, мені треба написати дещо для Державного департаменту. Краще правильно зазначити деталі, тож давай закінчимо цю розмову..." Горторн видихнув. "...Що, чорт забирай, сталося в Сан-Хуані?"\n\nСтівенс зітхнув. Скільки разів йому ще треба було переказувати цю історію? Дюжину? Ні, набагато більше за дюжину. Щоразу, коли він її розповідав, вона звучала ще абсурдніше, ніж раніше. Як, чорт забирай, Шеклі "забув" попросити дозволу Білого дому?\n\n"Президенту не варто через це турбуватися." Стівенс ухилився від відповіді. Він переглянув папки й витягнув зернисте фото. "Це точно не американський прапор на Гренаді."\n\nГорторн придивився ближче. На чорно-білому зображенні виднілися зелений, жовтий і червоний. Новий претендент у Карибах. "Ти жартуєш зі мною, Стівенсе?"\n\n"Боюся, що ні," — відповів Стівенс. Іберійський Союз мав історію втручання в справи Західної півкулі. Це було більше, ніж втручання. Це Іберія справляла нужду на задньому дворі Америки. "Слухай, ми вже маємо плани щодо Шеклі та його головорізів. У ФБР немає планів щодо цих іспанських виродків. Це вже тобі й президенту вирішувати."\n\nГорторн не відповів. Він продовжував дивитися на фотографії, сподіваючись, що прапор зміниться. "Це лише острів," — нарешті пробурмотів він."
 Caribbean_flavor.122.a: ""Ми з тобою знаємо, що це набагато більше, приятелю.""

 Caribbean_flavor.123.t: "Моє королівство"
 Caribbean_flavor.123.desc: "Приплив накотився на Ґранд-Анс. Карибський пісок сяяв, наче золото, під післяобіднім сонцем. Ґейрі зробив ковток бренді, просто з Хереса. Він віддавав йому перевагу перед будь-яким місцевим напоєм у Гренаді.\n\nПозаду нього двоє легіонерів Легіону Кондор чіплялися до групи місцевих. Штовханина. Якісь суперечки. Кілька розбитих голів. Раніше Гренаді бракувало такого порядку. Він зробив ще один ковток бренді.\n\nСьогодні був день відпочинку. Жодних промов у цьому морському бризі. Жодних святкувань у цій спокійній погоді. Була певна звукова, точніше тиха, якість, яку несла стабільність. Зрештою, він переміг. Що ще було робити?\n\nВільямс завжди називав його безрозсудним. Вашинґтон ніколи по-справжньому йому не довіряв. А ОАД? Вони не вміли нічого, крім як сидіти на паркані й бігати за кожною палицею, яку Дядько Сем чи Веракрус кидали їм.\n\nБез Іберії Гренада була б нічим. З Іберією Гренада була його. Його королівство, яким він мав керувати. Його королівство, яким він мав правити.\n\nЙого королівство не цікавилося людьми, яких воно затримувало. Його королівство не цікавилося репортерами, яких побили минулої ночі. Його королівство цікавила лише стабілізована на карті Гренада. Його королівство було полотном.\n\nА Іберія не мала нічого проти того, щоб віддати пензель."
 Caribbean_flavor.123.a: "Він пив, доки нічого не залишилося."

 Caribbean_flavor.124.t: "Дядько Сем у Порт-оф-Спейні"
 Caribbean_flavor.124.desc: "Часткова стенограма промови прем'єр-міністра [TRI.GetLeader] на мітингу, з Бібліотеки Конгресу США, архівна дата [GetYear].\n\n"-і завжди будуть проблеми, особливо в нинішньому політичному кліматі в усьому світі. Колумбія була жалюгідною, жахливою справою. Нестабільність у Венесуелі, так близько до наших берегів, була ще одним джерелом трагедії, яка надто часто спустошувала регіон. Тим часом каудильйо в Іберії, імператор у Токіо та Фюрер у Германії сходяться на Карибах, оголивши зуби, наче акули у воді.\n\nСаме тому дружба Вест-Індії зі Сполученими Штатами є одним із наших найвищих пріоритетів. Тринідадська нафта є одним із найбільших ресурсів нашого острова, і взаємовигідна угода з Вашинґтоном — це найменше, що їхній народ і наш можуть зробити, щоб пристосуватися один до одного. Мені не потрібно пояснювати вам усі причини цього.\n\nЯ говоритиму з вами прямо. Ці антиамериканські протести всередині країни тривають уже кілька місяців і є більш ніж тимчасовим занепокоєнням. Я впевнений, що країни ОВН мають лише найкращі наміри щодо нашого богобоязливого острова і що ми можемо розраховувати на всіх вас у забезпеченні безпеки нашого народу, якщо політичне насильство коли-небудь стане реальністю. Крім то-""
 Caribbean_flavor.124.a: "КІНЕЦЬ ЗАПИСУ"

 Caribbean_flavor.125.t: "Страх перед тим, що прийде"
 Caribbean_flavor.125.desc: "Гренадська криза спричинила численні гарячкові наради Державного департаменту. Вільямс швидкими темпами консолідував владу, а його риторика наголошувала на протистоянні з американцями та суверенітеті над їхнім островом. Військовим планувальникам не подобалася думка, що армійська база або військово-морська верф у Чаґуарамасі потенційно можуть опинитися під загрозою з боку гренадців. Регіональна оборона в Карибах, від боротьби з повстанцями до контрабанди наркотиків, залежала від гренадських позицій. Їхня втрата стала б серйозною невдачею для регіону.\n\n"Я не думаю, що він справді спробує захопити якісь ключові об'єкти," — Грегорі О'Браєн, чиновник Державного департаменту, нервово потер руки. "Він просто грає на свою аудиторію."\n\nГенерал-лейтенант Френк Нельсон, помічник SOUTHCOM, був менш оптимістичним. "Я не будую нашу оборонну підготовку на оптимістичних припущеннях, містере О'Браєн, я маю думати про життя людей! Ми посилимо нашу оборонну готовність на випадок, якщо він почне діяти навколо бази."\n\n"Саме цього він і хоче — щоб ми зробили агресивний крок, ще більше розпалили його владу та чинили тиск на Вашинґтон. Ми не можемо ризикувати." — заперечив О'Браєн.\n\n"Панове, думаю, час діяти м'якше," — пролунало від Віктора Блека, зв'язкового ЦРУ. "Нам слід звернутися до більш... таємних методів забезпечення власної безпеки. Якщо ми позбудемося Вільямса, перед островом постануть набагато нагальніші проблеми, ніж пара військових баз.""
 Caribbean_flavor.125.a: "Залишмо всі варіанти відкритими."

 Caribbean_flavor.127.t: "Розтяжка"
 Caribbean_flavor.127.d: "Усмішка Еріка Ґейрі була широка, наче горизонт, а очі сяяли, дивлячись на яскраво-блакитне небо, кришталево чисті води та соковито-зелені дерева гавані Сент-Джордж, що слугували тлом. Його прихильники метушилися навколо нього, розмахуючи прапорами й вигукуючи його ім'я, наче це було благословенням всемогутнього Бога. Але найбільше — чоловіки з Корпусу морської піхоти США, вишикувані вздовж платформи, наче дорогий фарфор, виглядали як стовпи, що підтримують його щойно відновлений уряд.\n\nУсе це говорило про одну й ту саму мету: план Веракрусського пакту підтримати повалення Східнокарибського Союзу в Гренаді потонув. Присутність американських флібустьєрських військ була живою червоною лінією проти іноземної інтервенції чи внутрішнього повстання, яка могла не лише рішуче придушити державний переворот, очолюваний Мехіко та Гаваною, але навіть у разі його невдачі дала б США casus belli для негайного зміцнення режиму Ґейрі.\n\nДиво в раю: Гренада була звільнена від зазіхань централізації Вільямса і, роблячи це, підтвердила незалежність острова від решти Східнокарибського Союзу. Дивовижно, але шалена ставка Ґейрі на американське втручання якимось чином спрацювала, і маленький тропічний атол тепер належав йому."
 Caribbean_flavor.127.a: "Ще один день садівництва на задньому дворі Америки."

 Caribbean_flavor.129.t: "Коли доміно впало на рай"
 Caribbean_flavor.129.d: "Та довбана газетна фотографія Еріка Ґейрі в гавані Сент-Джордж досі дивилася на нього, насміхаючись із нього, коли Вільям Гасті грюкнув слухавкою. Протягом останніх трьох тижнів він говорив майже з кожним розлюченим голосом від західного Барбадосу до Порт-оф-Спейна, а барвисті акценти й ще барвистіша лайка майже всіх людей Карибів досі дзвеніли у його вухах.\n\nҐейрі уклав угоду з дияволом у вигляді людей, які придбали личину ангела ціною крові майже кожної нації та етнічної групи Вест-Індії. Заяви держав з усього вільного світу, навіть тих, що входили до ОВН, вказували на американських морських піхотинців у Гренаді як на навмисну провокацію з метою дестабілізації Східнокарибського Союзу та водночас зірвати плани Веракрусського пакту.\n\nГасті проштовхнувся крізь двері на веранду, де чисте блакитне море вирувало білою піною об скелі під ним. Того дня було похмуро, як і протягом останніх трьох тижнів. Головна думка, яку телефонні розмови втовкмачували йому в голову, тепер стала єдиною думкою, що крутилася в ній, поки він дивився на далекий горизонт.\n\nХто буде наступним?\n\nКуба, Нікарагуа, Венесуела, Панама, Гренада. Карибам не бракувало жертв американського «дипломатичного» маршруту, і вони були його мимовільними учасниками задовго до цього. Правдоподібне заперечення було остаточно викинуте за борт; усі ставки скасовано. Увесь цей глибокий хаос, цей переворот усього, просто через американську параною щодо бази в Чаґуарамасі, через сварки із сусідами за неї, наче за дитячу іграшку?"
 Caribbean_flavor.129.a: "Карибські моря простягалися далеко, як і страх та гнів людей, що там жили."

 #
 Caribbean_flavor.200.t: "Погляд згори"
 Caribbean_flavor.200.desc: "Для такого маленького острова маєток Теодора Шеклі, подумав Вір Берд, був безумовно вражаючим. Сама будівля була відносно невеликою, і значна її частина залишалася майже порожньою, але, проходячи нею, він усе ще міг бачити мебльовані подарунки від канадських та американських чиновників, виставлені на почесному місці в залах, повз які він швидко проходив. Із розпадом Федерації Вест-Індії його турбували важливіші за реліквії питання.\n\n"Радий бачити тебе тут, Теодоре", — сказав Берд, піднявши голову лише після того, як закінчив речення. "Тобі справді слід було повідомити мене про свій візит раніше; я із задоволенням провів би для тебе повну екскурсію."\n\n"Можливо, я зроблю це згодом, Віре, але ситуація зараз термінова," — відповів Берд, насупившись, коли сів. "Ми спостерігали за твоїм управлінням цими островами, і вважаємо, що такі сильні люди, як ти, найкраще підходять для того, щоб утримувати... раціональний дискурс на цих островах."\n\n"Радий чути про твою підтримку," — відповів Берд, тепло усміхаючись. "Я тебе не підведу. Але скажу, що я не маю всієї влади у світі, навіть на власній парі островів."\n\n"Ні?"\n\n"Прогресивний лейбористський рух останнім часом набирає сили, і нічого доброго від них не буде." Обличчя Берда похмурнішало, коли він опустив голову. "Якщо вони не марширують нашими вулицями, то вихваляють Кастро. І вони продовжують набирати підтримку. Якщо вони виграють ці наступні вибори..."\n\nШеклі зустрів занепокоєння Берда мовчанням, що повисло в повітрі. Кастро наразі був достатньо надійним партнером, але він знав, що щойно Кастро матиме партнерів для проведення радикальнішої політики, такі зв'язки швидко ослабнуть."
 Caribbean_flavor.200.a: ""Можливо, ФБР могло б із цим допомогти, Віре.""

 Caribbean_flavor.201.t: "Операція «Котяча м'ята»"
 Caribbean_flavor.201.desc: "КОНФІДЕНЦІЙНО/[?global.date.GetDateStringNoHourLong]\n\nВІД СЕМЮЕЛЯ РОУЗА\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ОПЕРАЦІЯ «КОТЯЧА М'ЯТА»\n\nПрем'єр-міністру Антиґуа Віру Берду гарантовано перемогу на майбутніх виборах завдяки роботі його власної Лейбористської партії Антиґуа та завдяки роботі американських розвідувальних служб.\n\nХоча використовувалися звичайні тактики, такі як шпигунство, вкидання бюлетенів, підкуп, шантаж і позбавлення виборчих прав, проти Джорджа Волтера та його союзників також застосовувалися нові тактики, спрямовані на делегітимізацію та ізоляцію Прогресивної ліберальної партії.\n\nРепортерів підкуповували, щоб вони звинувачували ПЛП у тому, що вони бухарінці, нацисти, анти-ОВН, фашисти та прихильники інших провокативних ідеологій. Через це кампанія ПЛП здебільшого була витрачена на захист від звинувачень, тоді як проти Лейбористської партії Антиґуа майже не проводилася кампанія.\n\n"
 Caribbean_flavor.201.a: "Я б не голосував за бухарінського нациста."

 Caribbean_flavor.202.t: "Звичайні справи"
 Caribbean_flavor.202.desc: "Для туристів, що сиділи на Джоллі-Біч, це був просто ще один день відпочинку. Сонце продовжувало палити натовпи, що відпочивали на кожному пляжі, і лише сонячні опіки змушували декого ховатися під парасолями. Радіо грало музику над барами, що розливали коктейлі, лише зрідка перериваючись короткими повідомленнями про конституційну кризу Антиґуа і Барбуди між малозначними сюжетами про Сполучені Штати. Хвилі лагідно накочувалися на пляжі з майже вибіленим білим піском, а їхній рух м'яко відлунював у вітрі.\n\nПотім тишу було порушено. Проїхали автомобілі, а потім прогриміли вантажівки. Невеликі групи солдатів ішли попереду, і увага людей почала переключатися з пляжів та напоїв. Поки військові машини спорожнювали зазвичай жваві вулиці, деякі туристи почали перемовлятися між собою, непокоячись через неминучий хаос, необхідність забронювати рейси з країни, необхідність зв'язатися з друзями, родиною та репортерами щодо того, що відбувається на Антиґуа.\n\nЗрештою, коли кілька туристів почали збирати речі, підійшла жменька поліцейських, один із яких представився місцевим лідером. Тепло усміхаючись, він розвів руки, запевняючи, що жодної реальної загрози для них немає. Поки вони залишатимуться на пляжах і продовжуватимуть насолоджуватися теплою атмосферою Антиґуа, сказав він, їм нічого боятися. Вони могли повернутися до своїх напоїв, не переймаючись проблемами, які їх не стосувалися.\n\nТож туристи знову влаштувалися, роблячи мало що, крім як притримувати свої капелюхи. Дехто все ще бурмотів про необхідність привести паспорти до ладу, але більшість просто списала події на кумедний випадок, на місцеву політику, яка їх не стосувалася. Для більшості легкі хмаринки просто розчинилися на задньому плані під новими хвилями та свіжими коктейлями. А під усім цим радіо продовжувало грати музику, більше не перериваючись внутрішніми повідомленнями про місцеву політику."
 Caribbean_flavor.202.a: "Для туристів, що сиділи на Джоллі-Біч, це все ще був день відпочинку."

 Caribbean_flavor.203.t: "Усі витрати сплачено наперед"
 Caribbean_flavor.203.desc: "Протягом останніх кількох місяців, подумав Берд, його зустрічі з Теодором Шеклі ставали дедалі рідшими, але це було те, чому можна було радіти. Це було ознакою того, що безпосередня криза розпаду Федерації завершилася і що ФБР звикло до нових інституцій. Переглядаючи звіт про арешт активістів Прогресивного лейбористського руху, Берд усміхнувся.\n\n"Мушу сказати, Теодоре, твої дії були для нас надзвичайно корисними," — сказав Берд, порушуючи тишу. "Вони справді допомогли не дати цій країні впасти в оманливий більшовизм Кастро. Наша країна та Сполучені Штати стануть чудовими партнерами на наступні десятиліття."\n\n"Що ж, радий це чути," — відповів Шеклі рівним голосом, видихаючи, коли відкинувся назад. "Тепер, коли робота починає заспокоюватися і наші агенти не очікують жодних криз тут у найближчі місяці, ми з дружиною говорили про коротку відпустку десь."\n\n"Ти хочеш поїхати у відпустку? Чому ти не сказав раніше?" — відповів Берд, дещо здивований. "У мене тут є близькі друзі на високих посадах, а небагато місць стоять вище за туризм. Є кілька вільних номерів в одному готелі з окремими зручностями, і я зможу забронювати для вас місце. Зазвичай отримати таке обслуговування можна лише за великі гроші, але ви більш ніж відплатили нам за свої послуги."\n\nШеклі на мить замислився, але дозволив своїй нерішучості перетворитися на дипломатію. "Що ж, моя дружина говорила про те, щоб відпочити від роботи..."\n\n"І ви саме це й зробите! Хто б не оцінив відпочинок біля одних із найкращих пляжів та океанів у світі, під опікою одних із найкращих працівників по цей бік світу?" Рука Шеклі залишалася притиснутою до підборіддя, але Берд бачив, що той починає погоджуватися."
 Caribbean_flavor.203.a: "Кампанія з перескакування по островах нового типу?"

 Caribbean_flavor.204.t: "Північна міграція"
 Caribbean_flavor.204.desc: ""Оце так удар!" — вигукнув Вір Берд своєму кедді. Це була 12-та лунка для колишнього прем'єр-міністра та компанії бельгійців, які також були вигнані зі своєї старої країни. Це їх не надто пригнічувало: гольф-клуб округу Салліван був хорошим місцем для проведення пенсії. Нова Англія була притулком для вигнанців, дозволяючи їм спілкуватися й тертися плечима одне об одного, залишаючись осторонь політики.\n\nЗдалеку до групи біг чоловік, задихаючись і вигукуючи "містере Берд". Коли він наздогнав групу, то пояснив себе: "Вітаю," — задихано сказав він, — "я репортер New York Times, я-я сподівався поставити вам кілька запитань."\n\nБерд на секунду замислився і відмахнувся від друзів: "Я наздожену вас пізніше," — сказав він їм, перш ніж повернутися до репортера: "Що ви хотіли запитати?\n\n"Багато хто цікавиться, чому ви залишили Антиґуа після нещодавньої поразки, чи не хочете пояснити?" — запитав репортер, витираючи піт із чола.\n\nБерд засміявся, а потім раптом став серйозним: "Якщо ви думаєте, що я поїхав через якісь ображені почуття, ви помиляєтеся! Джордж Волтер — диктатор у процесі становлення, протеже Гітлера й тому подібне! Якби я ступив на Антиґуа, він ув'язнив би мене й убив протягом години!"\n\nРепортер швидко зробив нотатки, перш ніж запитати: "Дехто каже, що ви приїхали до Сполучених Штатів через звинувачення в корупції з боку уряду Волтера, причому нібито приїхали сюди з розкраденими коштами."\n\nБерд не засміявся й подивився на репортера з байдужим виразом обличчя, перш ніж сказати...\n\n"
 Caribbean_flavor.204.a: ""Це брехня.""

 Caribbean_flavor.205.t: "Збираючи уламки"
 Caribbean_flavor.205.desc: "Він кілька років не бував у залах Комісії Вест-Індії, але Вільям Герберт не мав потреби бути там до цього моменту. Федерація Вест-Індії роками вирішувала це питання за нього, і він не бачив потреби втручатися в їхні справи. Звісно, це було тоді, коли федерація ще існувала. Тепер, зіткнувшись із поглядами спеціально відібраного комітету американських та канадських дипломатів, він намагався знайти спосіб продовжити роботу.\n\n"Шкода, що Федерація розпалася так швидко," — почав він, чекаючи, поки решта комітету закінчить читати підготовлені нотатки. "Є межа того, наскільки держави нашого розміру можуть зайти у прагненні зберегти себе, і я покладав великі надії на те, що наша федерація допоможе Карибам процвітати."\n\nОдин із членів, Бенсон Рассел, кивнув. "Коли ми це узгоджували, ми очікували, що Федерація стане довгостроковим устроєм. Прикро бачити, як швидко вона розпалася, особливо з огляду на те, наскільки сильно на міжнародну стабільність вплинула Нафтова криза."\n\n"Навіть менший устрій має свої проблеми." — похмуро продовжив Герберт. "Якщо поглянете на сторінку 10, побачите, наскільки важко мені було запобігти відокремленню Анґільї, а глибинні напруження та занепокоєння залишаються."\n\n"Це також нас непокоїть," — відповів Гасті. Герберт промовчав, пильно розглядаючи чоловіка; останнє десятиліття не надто добре обійшлося з Гасті. "Ми думаємо, що інші форми регіонального співробітництва, а особливо союз Навітряних островів, усе ще можуть спрацювати. Він не матиме тих самих проблем із географією чи демографією, що й ФВІ."\n\nГерберт кивнув, але лише ледь. "Це могло б спрацювати, але я все ще вагаюся. Я зустрічався з Віром Бердом, і якщо те, що він розповідає мені про ситуацію на Антиґуа, правда, то незабаром нам, можливо, доведеться мати справу з ворожим урядом." Коли він порушив це питання, кілька людей почали сперечатися, обговорюючи можливі відповіді на такий крах."
 Caribbean_flavor.205.a: "Ланцюг непередбачених обставин породжує нові непередбачені обставини."

 Caribbean_flavor.206.t: "Скарга клієнта"
 Caribbean_flavor.206.desc: ""Без цієї федерації обіцянка, яку я дав своєму народу, порушена," — сказав Вільям Герберт іншій стороні. Після того як Федерації Вест-Індії не вдалося об'єднатися через ситуацію на Ямайці, він був розлючений, розлючений на ямайців і США, які дозволили проєкту провалитися. "Мені кінець."\n\n"Я розумію, містере Герб-" — державний секретар почав говорити, перш ніж його перебив телефон, — "я не думаю, що розумієте. Це було б найбільшою подією на Карибах відтоді, як європейці пішли, а ви відмовилися від цього, бо одна країна вийшла." Секретар мовчки слухав, краще було дозволити йому виговоритися.\n\n"Кілька суперечок на конференції — і ви надто злякалися, щоб рухатися вперед. Ми все ще можемо створити федерацію з печерними людьми, які керують Ямайкою, чи без них!" Розмова ще деякий час тривала в такому ж дусі, прем'єр-міністр лаявся та кричав. Коли він нарешті зупинився, державний секретар із полегшенням видихнув і сказав..."
 Caribbean_flavor.206.a: ""Дякую за ваші коментарі.""

 Caribbean_flavor.207.t: "Повернення до середнього"
 Caribbean_flavor.207.desc: "Жовте сяйво Місяця важко лежало на хвилях, заломлюючись на морі. Великий човен прокладав собі шлях крізь нього, здіймаючись над морем. Дивлячись через корму, кілька американських найманців підняли зброю, перевіряючи, чи ніхто їх не помітив і чи не наближається згори жодна загроза. Відплисти зі своєї схованки на Барбуді непоміченими було ризиковано, але кілька вдало розставлених хабарів змогли це вирішити.\n\nЗа обрієм попереду тьмяно постав острів Невіс. Це була перша частина їхнього плану і, можливо, найбільш чутлива до часу. Кілька сепаратистів із Невісу звернулися до них, запропонувавши гроші та подальше покровительство, якщо вони допоможуть захопити острів. Це швидко переросло в набагато вигіднішу пропозицію від Руху народної дії: повна свобода дій на Невісі та більша сума грошей, щоб допомогти викрасти Роберта Ллевелліна Бредшоу, змусити його піти у відставку та встановити поміркованого, прихильного лідера.\n\nРудольф Сарджент, ватажок, повернувся до кількох чоловіків навколо себе. Вони очікували більше добровольців, але навіть їхньої нинішньої кількості було достатньо. Поки вони чекали, вони бурчали про історії, які чули про Бредшоу: його націоналізації, бездушне поводження з дисидентами, внутрішні проблеми в його профспілці та політичній партії. Деякі з них були правдою, кілька в це вірили, а парі навіть було не байдуже. Будь-які сумніви, що залишалися, з лишком перекривалися доларами.\n\nОстрів уже височів над ними, човен плавно причалив. Витративши мить, щоб залишити корабель, Сарджент простяг порожню руку для рукостискання людям навколо нього, які представляли обидві групи, обмінюючись лише підтвердженнями щодо зброї, перш ніж перевести їх на човен. Невелика група, хоч і ненадійна, залишилася на острові, нібито віддана захопленню Невісу. У якийсь момент цих націоналістів доведеться зрадити, щоб забезпечити найманцям належну їм винагороду."
 Caribbean_flavor.207.a: "Найкраще, якщо ця зрада прийде через порожню зброю"

 Caribbean_flavor.208.t: "Спершу як трагедія..."
 Caribbean_flavor.208.desc: "Схід сонця повільно просувався над островом Сент-Кітс, а загін найманців відповідав на нього гіркою тишею. Рудольф Сарджент вдивлявся в навколишній ландшафт. Окрім гуркоту хвиль позаду нього та шелесту дерев праворуч, у повітрі панувала цілковита тиша. Він скривився: сонячне світло лише показувало, що ліс перед ним був позбавлений усього, крім палиць.\n\n"Досі нічого," — пробурчав Сарджент, глянувши ліворуч, а потім на годинник. Члени ПАН, з якими він зустрічався, сказали йому, що хтось має пройти повз. Йому обіцяли, що сепаратисти Невісу вже захоплять урядову будівлю, радіовежу або щось подібне. Все, що він отримав, — це тиша.\n\nДо цього часу загін найманців уже почав нервувати. "То коли ми насправді збираємося їх скинути?" — застогнав один, змушуючи себе підвестися.\n\n"Коли вони прийдуть, гаразд!" — огризнувся Сарджент, крутячи ручку радіоприймача. У них був щільний графік, і вони вже відставали на годину від моменту, коли Бредшоу мав опинитися під їхньою вартою. Сент-Кітс і Невіс мали прокинутися в новому політичному порядку, підтриманому зброєю найманців, але тепер у них було лише кілька розгублених чоловіків, не кращих за туристів.\n\n"Ми, мабуть, усе ще можемо це зробити, якщо поквапимося, знаєте," — відповів інший, трохи притискаючи рушницю до грудей. "Буде неохайно, але не схоже, що у кітітян вистачить живої сили, щоб по-справжньому відбити нас."\n\nСарджент похитав головою. "Зараз? Поліції буде достатньо, щоб перекрити дороги, і це дасть Бредшоу достатньо часу, щоб покликати на допомогу. Якщо нас не застрелять, ми застрягнемо там, доки хтось нас не заарештує." Поки він говорив, зліва в поле зору різко в'їхала поліцейська машина. Єдине прокляття, пробурмотане Сарджентом собі під ніс, стало останнім цвяхом."
 Caribbean_flavor.208.a: "Застряглі в об'єкті власної зневаги."

 Caribbean_flavor.209.t: "Виправлення шкоди"
 Caribbean_flavor.209.desc: "Посол Фінч незручно сидів у своєму кріслі, оббивка якого була яскраво-червоною із зеленим візерунком, намагаючись стримати своє роздратування. Він не заперечував проти самого дипломатичного заходу чи своєї присутності на ньому. Зрештою, він був послом у Сент-Кітсі й Невісі, а ці найманці погрожували відкинути американські відносини на Карибах на десятиліття назад. Радше його непокоїло те, наскільки довго й голосно тривало засідання кабінету Кітітти, і наскільки довшим здавалося очікування, поки його члени підуть.\n\n"Заходьте," — виплюнув Роберт Ллевеллін Бредшоу, коли двері нарешті грюкнули.\n\nОдразу увійшовши, Фінч простягнув руку, але у відповідь отримав лише легку насупленість. "Радий знову вас бачити, хоча обставини..." — Фінч на мить зам'явся, намагаючись сформулювати питання, — "...не такі приємні."\n\nБредшоу перевів на нього погляд, і його насупленість перетворилася на гримасу. "Я так розумію, ви сподівалися бути з тими найманцями на Невісі?"\n\n"Містере Бредшоу, запевняю вас, ми не мали жодного стосунку до спроби перевороту," — відповів Фінч, байдуже оглядаючись навколо. Насправді не так уже й багато тримало цього чоловіка при владі, подумав він, і Бредшоу навряд чи міг дати відсіч. "Це була жменька агентів-відступників, які скористалися примхами кількох невісійських радикалів. Ми не брали участі й намагатимемося переслідувати їх якомога суворіше."\n\nБредшоу на мить замовк, але знизав плечима. "Що ж, якщо ви наполягаєте. Гадаю, для кількох сліпих плям можна зробити виняток, особливо з такими людьми." Тепер він був упевнений; Сполучені Штати могли скинути Бредшоу. "Ми отримали більш ніж достатньо, щоб списати це на звичайний збій." Цього разу він простягнув руку, і її потиснули."
 Caribbean_flavor.209.a: "І так зчеплені пальці розтиснулися."

 Caribbean_flavor.210.t: "Безнадійна справа"
 Caribbean_flavor.210.desc: ""Роберт тут!" — прошепотів Рудольф Сарджент, опускаючи рушницю. Висадка поки що пройшла так добре, як вони сподівалися, не рахуючи кількох безпорадних поліцейських. Вони йшли за графіком, без непередбачених труднощів і без жертв. Він не бачив жодних новин із Невісу, але й не хотів їх бачити. Особняк прем'єр-міністра височів перед ними, і він зн-\n\n-БАХ-\n\nПостріл пролунав ізсередини будинку. Перший порив Сарджента закликати до спокою на мить приніс тишу, яку швидко перервав повний залп з обох боків. Відкинувшись назад убік, він на мить заглянув у коридор. Ті самі поліцейські, яких він бачив раніше, тепер були в центральному вестибюлі, а позаду них стояв ще один ряд офіцерів зі щитами. Він на мить опустив погляд і побачив тіло, з якого текла кров, перш ніж випадкова куля змусила його знову підняти голову.\n\nСарджент спробував це раціоналізувати. Його люди все ще чисельно переважали противника й усе ще мали вогневу міць. "Особняк" був крихітним, і якщо Бредшоу був живий, далеко він не міг піти. Стріляючи навмання, він спробував згуртувати своїх людей, але вони вагалися. Спочатку одного збили ударом у ногу, а потім іншого в груди. Чоловіки, що оточували будівлю, просто зникли. Поглянувши ще раз, він побачив, як тіло тягнуть назад; це був не Бредшоу, а лише його друкар, який стогнав від болю.\n\nСарджент змусив себе вийти зі схованки, намагаючись сховатися за тілом одного зі своїх найманців, але це лише оточило його ще більшим болем. До цього часу він явно опинився в меншості, але варіантів, окрім прориву вперед, не залишилося. Якби тільки вони могли прорватися, вигукував він, арешт усе ще був би дитячою забавкою. Він востаннє озирнувся назад і побачив, як його найманецька сила стрімко танула через смерть і дезертирство, перш ніж куля чисто пробила його череп, убивши на місці."
 Caribbean_flavor.210.a: "Флібустьєра смертельно нафлібустьєрили."

 Caribbean_flavor.211.t: "Несанкціонований переворот у Сент-Кітсі й Невісі"
 Caribbean_flavor.211.desc: "ТАЄМНО/[GetDateText]\n\nВІД ОСКАРА КОТТОНА\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ПОМИЛКОВА СПРОБА ПЕРЕВОРОТУ В СЕНТ-КІТСІ Й НЕВІСІ\n\n1. Минулої ночі невеликий загін найманців спробував повалити уряд Кітітти, викравши прем'єр-міністра Роберта Ллевелліна Бредшоу, отримавши при цьому певну допомогу від опозиційних груп. Хоча спробу було швидко придушено, раптовий характер цього інциденту стурбував багатьох на Карибах, і дії могли б запобігти ширшому дипломатичному фіаско.\n\n2. Переворот жодним чином не був санкціонований нами, але їхні зв'язки були глибокими. Більшість діячів регіону передчасно припустили, що за цим стоїть американська підтримка, і тепер вони або мертві, або дистанціювалися від цього. Бредшоу, схоже, стривожений і параноїдальний, але все ще готовий співпрацювати з нашою місією в Бастеррі.\n\n3. Швидкий провал перевороту звів його до жарту в нашій пресі. Однак інформаційні агентства по всьому Карибському регіону визначили це як центральний елемент нашої політики, а мексиканські агенти використали це для подальшого посилення регіональної недовіри до нас. Наша невинуватість, імовірно, буде широко прийнята в будь-якому разі, але нова партія допомоги, особливо зброї для сил безпеки Кітітти, безсумнівно, допомогла б нашій справі."
 Caribbean_flavor.211.a: "Надішліть їм додаткову допомогу. Доведіть, що ми все ще на їхньому боці."
 Caribbean_flavor.211.b: "Такий крок ризикує створити враження, що ми рятуємо обличчя. Ми невинні; нам слід утриматися від їхнього шантажу."

 Caribbean_flavor.212.t: "Під замком і ключем"
 Caribbean_flavor.212.desc: "Камера Аласдера Кіна являла собою моторошне видовище. Принаймні її вже звільнили від інших ув'язнених, але потріскані, вкриті мохом стіни, погане освітлення та ковдра замість ліжка робили його самотність лише слабким благословенням. Під час перестрілки випадкова куля відкинула його назад, влучивши в плече, але він вижив; його важке дихання було чутно крізь руїни, а після того як йому дали мінімум, необхідний, щоб переконатися, що він не стікає кров'ю, його просто кинули до в'язниці, де його ніхто не бачив, крім охоронця, який не приховував своєї огиди.\n\nРаптом двері камери силоміць відчинилися. "До тебе прийшли друзі!" — байдуже крикнув охоронець, коли всередину кинули дев'ятьох людей, відтіснивши Кіна назад і спричинивши пекучий біль у його лівому плечі. Він міг упізнати кількох, хай лише за обличчями, з перевороту — половина невісійців, половина з ПАН, — але знайшов себе серед інших захоплених найманців.\n\n"Аласдер?" — запитав один приглушений голос, намагаючись проштовхнутися ближче. "Це я, Колін Томкінс!" Аласдер спробував сам пробитися вперед, підвищивши голос на знак підтвердження. "Як довго ти тут сидиш?"\n\n"Відтоді, як мене підстрелили в це кляте плече." До цього часу вони приблизно протиснулися на свої місця. "Гадаю, ваш напад провалився?"\n\nКолін спробував похитати головою, і це почуття майже просочилося крізь нього. "Були близько, але щойно я почув по радіо про перестрілку, зрозумів, що все скінчено." Колін вказав на рушницю охоронця. "Бачиш? Нова модель. Кажуть, її зараз випробовують американські військові. Навіть поліції такого не дають."\n\nКін похитав головою. Очевидно, це була нова зброя. Настільки нова, що її навіть не використали проти них. Якщо це так, подумав він, тоді було зрозуміло, на чиєму боці Америка в цій спробі перевороту і як далеко вона готова зайти, щоб повернути їх."
 Caribbean_flavor.212.a: "Застряглі в чужій країні"

