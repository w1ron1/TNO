 Caribbean_flavor.93.t: "Ignitio"
 Caribbean_flavor.93.desc: "Перший кабель надійшов.\n\nПрацівники нафтової промисловості в Тринідаді залишили свої робочі місця. Переробка сповільнилася. Танкерні судна гойдалися на воді, очікуючи дозволу пришвартуватися в Порт-оф-Спейні. Проблема, але нічого надзвичайного.\n\nНадійшов другий кабель.\n\nТаємні переговори. Чаґуарамас. Націоналізація. Теодор Шеклі підняв брову.\n\nНадійшов третій кабель.\n\nСтенограма промови Еріка Вільямса. Координований страйк проти американської нафти. Масовий протест проти американських баз у Тринідаді.\n\nШеклі прочитав кожне повідомлення. Вільямс зробив гамбіт, подумав Шеклі. Хороший гамбіт у його становищі. У нього була нафта; у нього були люди. Але пара королів не виграє партію в блекджек. Такий гамбіт не дає автоматично місця за столом з американською делегацією.\n\nШеклі повільно закрив теку. Одного страйку було недостатньо, щоб змусити Америку схилити коліно перед маленьким старим Тринідадом. Але це був невеликий сплеск в американському озері, здатний відлунити по всьому його простору. А Шеклі не міг допустити нічого подібного в Карибському басейні.\n\nНафта могла затримати кораблі. Але нафта не затримала б американську відповідь. І якщо Східнокарибський Союз хотів говорити мовою важелів впливу, Шеклі не мав би проблем відповісти їм їхнім власним діалектом.\n\nІ поки клапани залишалися закритими за сотні миль звідси, Шеклі нікуди не поспішав повертати їх у дію."
 Caribbean_flavor.93.a: "Вільямс розкрив свої карти. Дозвольмо нам розкрити свої."

