 JAM_flavor.13.t: "Випробування від Джа"
 JAM_flavor.13.desc: "Чиста вода океану мерехтіла й сяяла, а сонце відбивалося в ній ідеальною кулею. Човен сильно хитався серед хлюпотіння та плюскоту хвиль, через що вода час від часу заливала емігрантів і потрапляла всередину. Окрім звуків природи та неминучого плачу дітей, на човні панувала цілковита тиша. Сьогодні тут перебували 172 растафаріанські біженці. Жоден із них не хотів опинитися тут, ніхто не хотів, щоб усе дійшло до цього, але ось вони тут.\n\nМаркус нервово крутив у руках скрутку з травою, проводячи пальцями по ній. Хвиля різко хитнула човен, вибивши канабіс із його рук. Його миттєва реакція врятувала його, коли він упіймав його в повітрі, лише за три фути над безмежною прірвою моря. Він обережно опустився назад на своє місце, водночас відчуваючи полегшення й шок. Повернувшись до свого джойнта, він поглянув через палубу на біженців.\n\nОдин чоловік особливо привернув увагу Маркуса — Боб Марлі, який сидів у човні на самому передньому краї цієї громади, на вістрі списа. Маркус почав згадувати ті тихі часи, коли слухав його пісні по радіо. У ті сумні дні на Ямайці — коли він ставив під сумнів свою віру і відчував, що все втрачено, — ці пісні завжди повертали його до реальності. Чого б він зараз не віддав за те знайоме відчуття.\n\nА потім його погляд привернуло ще дещо: просто перед усіма човнами нарешті з'явився краєвид узбережжя Флориди. Після подорожі, яка здавалася тривалішою за дні, якщо не за тижні, попри те, що насправді ще не минуло й дня, усе нарешті добігало кінця. Це схвильоване полегшення Маркуса виявилося заразним, і всі інші біженці почали вставати, святкуючи. Потім до берега під'їхало кілька машин, наповнених озброєними американцями, і тоді Маркус усвідомив."
 JAM_flavor.13.a: "Наша боротьба лише починається."

