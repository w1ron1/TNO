 JAM_News.5.t: "[Get_newspaper_header]Jamaica Declares Independence from Britain, Bustamante Declared President"
 JAM_News.5.desc: "Following the mass riots in Kingston, Prime Minister Bustamante has cemented his rule in Jamaica, a task he's undertaken since he first took office years ago. Declaring full independence from Britain and declaring Jamaica a republic, with himself as its president, replacing the governor general. A protégé of Bustamante, Donald Sangster, has taken up the role of Prime Minister.\n\nWith Jamaica now breaking off from the OFN, Jamaica has found a new ally with the Iberian Union. After stating in an address that the Kingston Riots were "spurred on by Washington in an attempt to overthrow the government," Bustamante was photographed with Iberian diplomats visiting the King's House, the newly declared presidential home. When asked for comment, officials from Washington 'are saddened to see Jamaica side with authoritarianism.'"
 JAM_News.5.a: "I think Mr. Seaga will be interested in hearing our "concerns" on this matter."
 JAM_News.5.b: "Time to do some business."
 JAM_News.5.c: "From one colonial master to another."

