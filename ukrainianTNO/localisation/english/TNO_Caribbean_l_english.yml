 # Antigua and Barbuda
 POLITICS_ANT_GEORGE_WALTER_DESC: "Якщо хтось і знає, що наполегливість може окупитися, то це Джордж Герберт Волтер. Очільник Прогресивного лейбористського руху та багаторічна ключова фігура опозиції проти колишнього президента Вера Берда, Волтеру було нелегко дістатися туди, де він перебуває сьогодні. Прогресивний ліберал, який виступав проти американської гегемонії та федеративної моделі управління, Волтер не міг бути далі від того, що уособлював режим Берда — лише роки репресій і диво 1972 року дозволили Волтеру та ПЛР прийти до влади.\n\nТепер він успадковує спустошені залишки раю колишнього диктатора. Брудні відбитки Берда все ще залишаються по всій правовій системі, а його зв'язки й досі перетворюють життя на пекло, навіть коли сам він перебуває у вигнанні. На Волтера чекає чимало роботи, якщо він хоче повернути острови в напрямку свого бачення — але чи вистачить йому духу довести справу до кінця, це вже зовсім інше питання."
 POLITICS_ANT_VERE_BIRD_DESC: "Вер Берд, семифутовий, бідний, неосвічений профспілковий активіст, який став політиком, є найважливішою людиною за всю історію Антигуа. Важливішою за Христофора Колумба, який відкрив острів, впливовішою за Томаса Ворнера, першого губернатора, і могутнішою за короля Чарльза, який проголосив острів своїм. Протягом 20 років він правив за допомогою армії середніх управлінців, які працювали лише за його гроші.\n\nБерд народився в бідному районі Сент-Джонса. Він отримав мало формальної освіти й зрештою приєднався до профспілкового руху Антигуа, ставши одним із засновників Профспілки торгівлі та праці Антигуа. Після того як Антигуа отримала виборче право, Берд створив Лейбористську партію Антигуа, після чого почав домінувати на політичній сцені острова.\n\nКоли колоніальні еліти острова почали залишати його після Другої світової війни, Берд створив новий клас — клептократичних середніх управлінців і профспілковців. Разом із ними він зміцнив своє правління за допомогою корупції, водночас забезпечивши свою родину частиною багатств, отриманих від його правління.\n\nТепер Берд прагне втриматися при владі, навіть коли Федерація Вест-Індії зазнає краху, а регіон занурюється в невизначене майбутнє."

 ###ІДЕЇ###
 WFI_Political_Purgatory: "Політичне чистилище"
 WFI_Political_Purgatory_desc: "В останні дні Другої світової війни, коли Сполучене Королівство було перетворене на раба Райху, союзні держави санкціонували операцію «Вектор», допомагаючи канадцям окупувати Британську Вест-Індію. Щоб не допустити потрапляння підчерев'я континенту до рук держав Осі, канадці заявили сумнівне право представляти справжню Британську імперію та зберегли багато її структур і установ у первозданному вигляді. Два десятиліття потому мало що змінилося. Чи то через відсутність законних прав, чи через політичну волю, Канада зберігала цей дивний статус-кво, обмежуючи будь-які дії, які могли б похитнути її контроль.\n\nПобоюючись повільного розпаду Імперії та втрати такого важливого важеля впливу, канадці не поспішали домагатися серйозних реформ задля незалежності, попри зростаючий тиск з боку США. Але така обережність має свої межі, і народ Вест-Індії з кожним днем дедалі більше втомлюється від канадського зволікання, поки вітри незалежності набирають сили."

 WFI_Apres_le_Deluge: "Après le Déluge"
 WFI_Apres_le_Deluge_desc: "Крах Кінґстонської конференції на тлі ширшої нестабільності по всьому Карибському басейну позбавив залишків легітимності регіональний статус-кво та підтвердив розпуск Федерації Вест-Індії. Після того як острови Карибського басейну отримали незалежність на регіональній основі, справжня невизначеність стала повсякденністю, оскільки нові, менші утворення намагаються впоратися з економічною нестабільністю, політичною неузгодженістю та слабкими зв'язками з Віндзорською династією, що править з Оттави.\n\nПопри все це Комісія Вест-Індії продовжує працювати. Серед хаосу вона сподівається забезпечити економічну допомогу та політичну єдність заради спільних цілей. І попри все це вона зазнає невдачі, адже розчарування більшості перспективою карибської єдності просто відкриває шлях до нового майбутнього за межами того, що залишилося від її примх. Яким би воно не було, воно постане на новому ґрунті."

 #Багами
 BAH_Mobsters_Paradise: "Рай мафіозі"
 BAH_Mobsters_Paradise_desc: "Кінець 50-х років був часом кризи для американської організованої злочинності, оскільки подвійний удар кампанії Кефовера та революції Кастро поставив мафію на межу краху. Казино та борделі від Вегаса до Гавани були закриті, а великі імперії гріха перетворилися на пил. Але не все було втрачено, адже на тих, кому пощастило або хто був достатньо хитрим, щоб утекти від Джонні Закону, чекала нова обітована земля: Багами.\n\nНассау, притулок для негідників ще з часів Золотої доби піратства, був ідеальним місцем для мафіозної діаспори, щоб облаштувати свій новий дім. Олігархи Бей-стріт, які керували всім цим, були більш ніж готові дозволити своїм новим партнерам по злочинах оговтатися на ногах в обмін на обов'язкову данину. Казино, борделі та наркопритони вкривають землю, поки її нові мешканці працюють над створенням раю розпусти, здатного конкурувати із Содомом і Гоморрою."

 BAH_Rule_Bay_Street: "Правління з Бей-стріт"
 BAH_Rule_Bay_Street_desc: "Пережиток суспільства колоніальної доби, нащадки білих політичних династій сформували правлячий клас, відомий як хлопці з Бей-стріт. Неофіційно вони створили мережу еліт, яка через маріонеткову Об'єднану Багамську партію контролює кожен аспект державних справ. Здійснюючи майже необмежену владу над островами за допомогою джеррімендерінгу та інших незаконних засобів, вони нині найбільше зацікавлені у збереженні влади білих та наповненні своїх кишень будь-якими способами."

 BAH_Sandcastle: "Замок Сендз"
 BAH_Sandcastle_desc: "Відтоді як розпочався далекоглядний термін Стаффорда Сендзa на посаді міністра фінансів, Багами перейшли до неофіційної політики необмеженого «вільного» капіталізму задля розвитку своїх бурхливих туристичної та гральної індустрій. Поки скарбниця центрального уряду та його спільників невпинно зростає, мінливі піски островів продовжують ховати населення під гниючою корупцією та бідністю."

 BAH_Closing_Bay_Street: "Закриття Бей-стріт"
 BAH_Closing_Bay_Street_desc: "Після розпуску ОБП та перетворення хлопців з Бей-стріт на історичну примітку багамці вперше за всю свою історію опинилися під владою, яка бодай нагадує справжню демократію.\n\nХоча нове правління більшості залишається недосконалим, оскільки білі еліти й надалі мають непропорційно великий вплив, правляча ПЛП усе ж змогла зберегти сильну підтримку громадськості. Однак через харизматичне, але владне керівництво, яке домінує над кожним аспектом партії, дехто побоюється, що Багами незабаром знову опиняться під владою однопартійної системи."

 BAH_Knocking_Sandcastle: "Знесення замку Сендз"
 BAH_Knocking_Sandcastle_desc: "Нині на Багамах домінують інтереси туристів і фінансових магнатів, а Ліндон Піндлінґ невтомно працює над тим, щоб приборкати нерегульований кошмар «зеленої лінії», створений Стаффордом Сендзом, — його мета полягає в перерозподілі прибутків на широку користь народу. Звісно, ці зусилля вже спричинили конфлікт із тими небагатьма, хто досі пожинав багатства нації. Якщо він прагне довести ці реформи до кінця, барони не підуть без спротиву."

 BAH_Repaving_Bay_Street: "Перебудова Бей-стріт"
 BAH_Repaving_Bay_Street_desc: "Олігархія Бей-стріт у Нассау, якою тривалий час домінували білі еліти, що таким чином контролювали економіку островів, продемонструвала готовність до реформ, зокрема до надання більшої ролі темношкірим вискочкам. Однак, хоча очевидно, що старі білі плутократи навіть зараз керують усім із тіні, незрозуміло, як довго така ситуація може тривати. Наскільки сильні вітри змін?"

 #Ямайка
 JAM_political_violence: "Політичне насильство"
 JAM_political_violence_desc: "На Ямайці є дві партії, які справді мають значення. З одного боку — соціал-демократична Народна національна партія; з іншого — консервативна Ямайська лейбористська партія. Ці дві фракції, давні суперники, вже не раз вели політичні битви, але ще один аспект ямайської політики залишається поза офіційними записами — не закулісні домовленості, а стрілянина в провулках, яка стала лише частішою в політично напружені часи, в які ми живемо.\n\nЩодня молодіжні банди виходять на вулиці, одягнені в кольори своїх улюблених партій, готові провокувати суперників, озброєні свинцевими трубами, ножами та пістолетами. Бічні вулиці Ямайки стають місцями бійок, спалахів насильства, які перериваються тріском пострілів і криками поліції. Рівень убивств стрімко зріс, і насильство не демонструє жодних ознак припинення, попри зусилля обох партій відмежуватися від своїх насильницьких прихильників. Схоже, лише спокійніші часи зможуть виправити цей кривавий розкол — або, принаймні, повернути його до звичного рівня."

 JAM_miracle: "Диво на річці Гоуп"
 JAM_miracle_desc: "Поки світ дедалі глибше занурювався в хаос і конфлікти, ці буремні часи, здається, вберегли Ямайку від найгірших їхніх наслідків. Справді, однією з головних причин нашого виходу з Федерації став раптовий успіх нашої економіки — економіки, яка тепер працює на благо Ямайки й лише Ямайки.\n\nНіколи раніше народ не користувався таким багатством, як тепер, коли торгівля надходить зі Сполучених Штатів та інших карибських держав, а туристи стікаються до наших золотих пляжів і ясного блакитного неба. Багатства нашого острова, як видимі, так і ресурсні, підштовхують наше економічне зростання до дедалі нових висот. Коли гроші течуть рікою, ми можемо підняти келих за процвітання та спокійно жити, знаючи, що Ямайка ніколи не була такою вільною чи заможною, як сьогодні."

 JAM_rastafarian_repression: "Репресії растафаріан"
 JAM_rastafarian_repression_desc: "Ямайська культура нерозривно пов'язана з растафаріанами. Народжена в бідних темношкірих громадах початку XX століття, ця унікальна релігія десятиліттями привертала увагу завдяки поклонінню імператору Хайле Селассіє як месії, курінню «ґанджі» та характерному діалекту. Колись ці віруючі були не більш ніж цікавою субкультурою, що трималася осторонь і мирно збиралася для поширення своїх переконань, але растафарі значно вийшли за межі свого скромного коріння.\n\nВідносини між релігією та урядом завжди були напруженими: віруючі вважали невіруючих інструментами декадентського Вавилону, а невіруючі вважали віруючих марновірними, але останні події лише посилили цю напруженість. Багато хто вірив, що вигнаний Селассіє, будучи Месією, ніколи не помре, і його смерть розколола частину растафаріан на мстиві, агресивні секти з різними поясненнями того, що сталося — від припущення, що він був лише втіленням Джа, до тверджень, що Селассіє інсценував свою смерть і тепер керує масштабним антиіталійським опором. Ці відгалуження регулярно вступають у сутички з перевантаженою поліцією, яка дедалі жорсткіше переслідує всіх растафаріан, незалежно від їхніх особистих дій. Ця спіраль лише погіршується з кожним інцидентом, і жодна зі сторін не має довіри чи симпатії до іншої.\n\nЯкщо рішення не буде знайдено, напруженість може вибухнути смертельним чином."

 JAM_jamaica_first: "Ні Федерації, ні панів"
 JAM_jamaica_first_desc: "Спочатку це були іспанці. Вони прибули сотні років тому на своїх величезних військових кораблях, принісши смертоносні хвороби, гармати та рабів. Таїно та втікачі-раби чинили опір у горах, уникаючи їхньої влади та борючись із нею — саме з цієї боротьби виникла перша корінна ямайська ідентичність.\n\nПотім прийшли британці, які замінили іспанців лише за назвою, але аж ніяк не за жорстокістю. З'явилися плантації, а разом із ними тисячі й тисячі поселенців і рабів, що значно збільшили населення острова. Та ямайська ідентичність вистояла в непомітних закутках і глухих місцях, розростаючись там, куди британці не дісталися.\n\nЧас минав. Британці послабили хватку, скасували рабство на острові, провели нові реформи — а потім, наче буря, були змиті хаосом Другої світової війни, і на їхнє місце прийшли американці. Ямайку втягнули в незграбну, нефункціональну Федерацію, створену для того, щоб забирати багатства ямайців і відправляти їх кудись подалі. Вкотре Ямайка відкинула цю імперіалістичну мрію та вражаючим чином вирвалася з-під своїх репресорів.\n\nТепер Ямайка вільна. Більше не залишилося імперій, які треба було б відтісняти. Після століть боротьби Скеля сама прокладе свій шлях і визначить власну долю.\n\nЧи є щось солодше за смак свободи?"

 #New Skeleton Jamaica
 JAM_Busta_Backbone: "Хребет Басти"
 JAM_Busta_Backbone_desc: "Популізм у поєднанні з експлуататорським оптимізмом перетворив Ямайську лейбористську партію Александера Бастаманте на імперію невпинного панування та контролю, гегемонію, що проникла в життя кожного простолюдина, оскільки його самопроголошена «Індустріальна профспілка Бастаманте» фактично підпорядкувала значну частину робітничих секторів країни одній авторитарній владі — терпимій, хоча зрештою й огидній, частині реальності.\n\nВплив його машини гниє, розростаючись, поки останні уламки нефункціональної колоніальної адміністрації шукають готового господаря, використовуючи весь вплив, який у них залишився — і найчастіше вони знаходили Басту готовим виконати їхні вимоги, якщо йому платили чесно й наперед. Пряник і батіг працювали протягом останніх кількох десятиліть, а його виконавець вважає їх надто вигідними, щоб щось змінювати."

 JAM_Reform_Failures: "Провал за табелем"
 JAM_Reform_Failures_desc: "Після низки післявоєнних заворушень США та їхні колоніальні союзники прагнули реалізувати сміливий план реформ, щоб сприяти розвитку та привести острови у XX століття. Через безгосподарність, корупцію та недостатнє фінансування результати були, м'яко кажучи, неоднозначними, але мало де ці плани зазнали такого катастрофічного провалу, як на Ямайці.\n\nРозрив у багатстві продовжує стрімко зростати, панування білих і креольських еліт зміцнюється, а острів залишається пронизаним бідністю та злочинністю. Тим часом політичні розбіжності стають дедалі радикальнішими, а поверх усього цього ЯЛП продовжує підкидати дрова у вогонь.\n\nКолись перлина англійського Карибського басейну, Ямайка тепер є свідченням нездатності післявоєнного порядку по-справжньому сприяти розвитку регіону."

 JAM_Kingston_Renaissance: "Кінґстонський ренесанс"
 JAM_Kingston_Renaissance_desc: "Натхненні строкатою сумішшю культурних рухів — від завезеного з Франції негритюду до таких місцевих явищ, як гарвеїзм, — вулиці Кінґстона переживають ренесанс, зумовлений як зростанням карибського націоналізму, так і появою місцевого інтелектуального класу, який поступово реформувався в міру того, як англосакси продовжують послаблювати свою хватку над останніми уламками колоніальних володінь.\n\nПрофспілки та політичні організації дедалі частіше пов'язують себе з новонародженою афрокарибською ідентичністю, а ідентифікаційні рухи на кшталт растафаріанства набирають популярності серед мас, привертаючи увагу відомих діячів як удома, так і за океаном — незалежно від того, позитивною чи негативною вона є. Хоча Кінґстон продовжує потерпати від постколоніальної бідності, попри все він став культурною наддержавою — або, як дехто великодушно його називає, Меккою афрокарибської культури."

 JAM_Posses_Gather: "Збори посе"
 JAM_Posses_Gather_desc: "По всьому Кінґстону банди тепер здійснюють свою владу. Ямайка сильно дестабілізована хвилею демонстрацій проти Бастаманте. Бандитське насильство стало повсякденністю, як і його подальші наслідки. Злочинність усіх видів процвітає та регулярно спрямовується проти цивільних, зброя вільно доступна, а контроль над наркотиками мінімальний. На папері законна влада все ще існує, але не виходить за межі паперу, на якому написані документи.\n\nНатомість справжня роль уряду полягає в переміщенні грошей між кількома відомствами — або поліції в районах, які вона все ще контролює, або як хабарів бандам, які тимчасово перебувають у союзі з урядом і готові воювати. З часом ці виплати можуть змінитися, але бандитська війна залишатиметься поширеною та звичною проблемою. Однак доки ця система продовжується, єдиними, хто програватиме, залишатимуться ямайські цивільні."

 JAM_The_Tropical_Fabian: "Тропічний фабіанець"
 JAM_The_Tropical_Fabian_desc: "Друга світова війна не підірвала вплив, який британська лейбористська політика має на Ямайці. Після приходу Майкла Менлі до влади в Кінґстоні він та Народна національна партія спрямують ямайську політику в бік старого Фабіанського товариства. Зосередившись на забезпеченні виживання демократичних інститутів і поміркованості порівняно з іншими фракціями Ямайської народної республіки, Кінґстон дотримуватиметься демократично-соціалістичного бачення.\n\nПід впливом девелопменталізму мексиканської ІРП та Фіделя Кастро Менлі приділятиме значну увагу розбудові громадських інститутів, спрямованих на подолання бідності, покращення освіти та розвиток інфраструктури. Фінансування цього також надходитиме завдяки збільшенню видатків і тарифів, спрямованих на масштабне розширення туризму та видобутку бокситів — обох галузей, які вже мають значний вплив на ямайську економіку та привертають увагу світових корпорацій."

 JAM_The_New_Machine: "Нова машина"
 JAM_The_New_Machine_desc: "Намагаючись витіснити вплив Ямайської лейбористської партії, Народна національна партія була змушена відійти від ідеалів, яких колись дотримувалася. Представники ННП та їхні родичі були призначені на ключові державні посади, профспілкам було надано значний контроль, а радикали-бригадисти працюють над залякуванням опонентів, змушуючи їх голосувати за них або зніматися з виборів посеред виборчої кампанії.\n\nУ певних аспектах це спрацювало. ЯЛП втратила той вплив, який колись мала по всій країні, і дедалі більше перетворюється на порожню оболонку. Але для пересічного ямайця наслідки успіху цього плану лише нагадують про наслідки минулого плану Бастаманте щодо процвітання. За пишномовною риторикою та цілями, заявленими Менлі, багато ямайців просто бачать залізний кулак, який колись їх гнобив, лише прикритий оксамитовою рукавичкою."

 JAM_Black_Star_Red_Flag: "Чорна зірка, червоний прапор"
 JAM_Black_Star_Red_Flag_desc: "Новий правлячий уряд Ямайки не має сильної згуртованості. Створений Біллі Страченом, лідером Чорної зоряної бригади Карибського легіону та давнім противником колишнього режиму, його уряд є строкатою сумішшю більшовиків, чорних націоналістів, поміркованих соціалістів та різноманітних діячів, яким вдалося інтегруватися до його офіцерського корпусу, і кожен тепер бореться за власний вплив у революційному уряді.\n\nНамагаючись приховати ці тріщини, сили Біллі Страчена здебільшого правлять указами. Страх перед прихильниками Бастаманте, що вижили, або втручанням Вашингтона створив простір для виправдання надзвичайних заходів, а запал швидко перетворюється на мобілізацію, тоді як демократичну конституцію офіційно призупинено. Якою б не була реакція, уряд Кінґстона буде готовий відповісти відповідним чином."

 JAM_The_Maroons_Return: "Повернення марунів"
 JAM_The_Maroons_Return_desc: "Хоча наші гнобителі переконували себе, що вони поклали край рабству, вони не зробили нічого подібного. Плантаційна економіка збереглася, ямайців змушували працювати в умовах експлуатації лише задля виживання, і лише наша перемога змогла вигнати це варварство. Ми пронесли факел повстань рабів-марунів, остаточно знищивши інструменти рабства та переваги білих.\n\nАле боротьба на цьому не може закінчитися. Нова економіка має бути сформована за образом тих давніх повстань рабів, які боролися проти британців. Націоналізація та державний нагляд мають проникнути в економіку й навіть домінувати в ній, щоб несправедливість знищувалася так швидко, як тільки виникає. Так, підприємства тікають, а економіка занурюється в хаос, але це лише зерно змін. Як каже Страчен, «зміни ніколи не приходять без болю»."

 JAM_Revolutionary_Democracy: "Революційна демократія"
 JAM_Revolutionary_Democracy_desc: "Демократія є плодом народу, і Ямайка нарешті може насолодитися її справжнім смаком. Усі громадяни, які мають право голосу, будуть вільні голосувати так, як забажають, якщо тільки вони не прагнуть підірвати це визволення через такі групи, як ЯЛП. Однак через молодість нашої новозвільненої держави під опікою Комуністичного народного національного руху було сформовано народний фронт, щоб належним чином сформувати цю нову демократію.\n\nОднак напруженість залишається. Багато соціал-демократів вагаються через агресивні революції фронту, тоді як традиційні лейбористські діячі, такі як Майкл Менлі, з підозрою дивляться на наш марксистський вплив і виступають за забарвлений реакційністю англійський профспілковий рух минулого. Такі тертя загрожують єдності нашого визволення, не кажучи вже про якість його наставництва. Питання про те, як вирішити такі суперечності, нависає над кожною партією фронту, і на нього необхідно відповісти."

 JAM_The_Independence_Debt: "Борг незалежності"
 JAM_The_Independence_Debt_desc: "Те, що гнобителі бояться тих, хто набуває сили, щоб кинути їм виклик, є універсальною істиною, такою ж правдивою зараз, як і під час повстань рабів на Гаїті. Вони змовлятимуться, щоб блокувати цих хоробрих людей і морити їх голодом, так само як вони змовлялися проти Гаїті. І тому, як і Гаїті, ми погодимося на деякі поступки в інтересах загального блага революції.\n\nЦе обмежує масштаби націоналізації та економічних реформ, які можуть бути проведені. Іноземні бізнесмени можуть і надалі ходити нашими вулицями, хоча й у невеликій кількості, висміюючи нашу соціальну революцію. Мало хто сумнівається в необхідності таких заходів у короткостроковій перспективі, адже вони продадуть нам засоби, щоб і надалі кидати їм виклик, а наша нова економіка залишається молодою та слабкою. Однак питання про те, як довго можна терпіти такі поступки, залишається суперечливим."

 JAM_Den_of_Thieves: "Лігво злодіїв"
 JAM_Den_of_Thieves_desc: "Понад 250 років тому Карибський басейн був відомий як лігво злочинності та пороку, де пірати вільно грабували та плюндрували. З поверненням Іберії на Ямайку як покровителя Бастаманте європейці знову ставляться до Карибського басейну як до беззаконного майданчика для розваг.\n\nКорупція та контрабанда стали невід'ємною частиною ямайської економіки. Кошти від незаконного продажу зброї та наркотиків наповнюють скарбниці лідерів банд, державних чиновників та іберійських кримінальних босів. Європейські туристи стікаються на острів, насолоджуючись сяючими водами Карибського моря в закритих курортах, тоді як їхні співвітчизники експлуатують і тероризують місцеве населення в нетрях просто за мурами. Залізний кулак та оксамитова рукавичка Америки зникли з острова, а на їхнє місце повертається європейський імперіалізм у своїй найбільш первісній формі."

 JAM_Bent_Backbone: "Зламаний хребет"
 JAM_Bent_Backbone_desc: "Маска ямайської машини впала. Режим вдався до відкритих репресій, використовуючи державні банди та іберійських найманців для придушення будь-якого інакомислення. Корупція процвітає на очах у всіх, а злочинність не просто ігнорується, а й заохочується, якщо вона служить волі партії. Стара система патронажних мереж і профспілкового примусу еволюціонувала, і корумпована диктатура ЯЛП панує на очах у всього світу.\n\nЛюдина, що стоїть за всім цим, Александер Бастаманте, править країною, яка підкоряється кожному його слову, за допомогою хабарництва та насильства. Проте його час спливає, а за його спиною вже ходять чутки про його близьку смерть. Партійні функціонери розкраюють частини імперії Бастаманте, поки кривий режим ледве плентається вперед."

 JAM_The_Seaga_Spine: "Хребет Сіґи"
 JAM_The_Seaga_Spine_desc: "Едвард Сіґа приходить до влади як прем'єр у складний час. Його незначна перемога залишає його пов'язаним із значною частиною спадщини його попередника, а масова опозиція як на вулицях, так і в урядових залах зв'язує йому руки в багатьох важливих справах. Дехто навіть передбачає, що його падіння — це не питання «чи», а лише «коли».\n\nАле Сіґа не з тих, хто здається. Патронажні мережі та державні воєнізовані банди використовуються для зміцнення його контролю — тактики, засвоєної від його колишнього наставника Бастаманте. Сіґа прагне втриматися при владі будь-якою ціною й щодня дедалі глибше впивається пазурами в державу. Якщо політична ситуація коли-небудь досягне точки кипіння, Сіґа подбав про те, щоб не піти без боротьби."

 JAM_Sunrise_Over_Montego_Bay: "Світанок над Монтего-Бей"
 JAM_Sunrise_Over_Montego_Bay_desc: "Едвард Сіґа малює нове обличчя Ямайки. Дні регулювання минули. Дні праці минули. Сьогоднішня Ямайка — це Ямайка, відкрита для американського туризму. Корупцію та злочинність прибирають із поля зору, замінюючи їх білбордами й рекламою, що закликає інвестувати в нові галузі на острові.\n\nНіде це не видно так чітко, як у місті Монтего-Бей, де американські інвестиції будують курорти вздовж усього узбережжя та фінансують масштабні кампанії з міської реконструкції. За підтримки американських підприємців Сіґа прагне перетворити Монтего-Бей не просто на осередок туризму, а на зразкове місто, яке представлятиме Ямайку на світовій арені, приховуючи кримінальне підґрунтя в самому серці ЯЛП."

 #Підвітряні острови
 SKN_Patchwork_Colony: "Латанa колонія"
 SKN_Patchwork_Colony_desc: "Роз'єднаний продукт колоніального безгосподарства, Підвітряні острови є адміністративним союзом, що складається з численних малонаселених островів, розкиданих північно-східними просторами Карибського басейну.\n\nНаче монстр Франкенштейна, зібраний із розрізнених держав, місцеві уряди островів постійно обурюються один на одного. Поки Невіс та Ангілья продовжують чинити опір політичному домінуванню Сент-Джонса, постійна напруженість між адміністраціями перетворила єдиний антиколоніальний фронт на вічну мрію, яка ніколи не втілюється в реальність."

 SKN_Underdevelopment: "Карибська глушина"
 SKN_Underdevelopment_desc: "Хоча плантаційна економіка, заснована на низькооплачуваній праці, була життєздатною практикою за колоніального режиму, така примітивна система, що спиралася винятково на експорт цукру, не забезпечила сприятливого торговельного балансу для нещасливих Підвітряних островів. Падіння Британії та Франції вже позбавило острови їхнього єдиного джерела іноземних доходів, а нездатність Канади розвинути життєздатні галузі на заміну ще більше погіршила перспективи населення вибратися з крайньої бідності.\n\nМаси обурені англосаксонськими елітами — як через їхню невиправдану пиху, так і через їхню низку провалів в управлінні. Тепер, майже без зовнішньої підтримки, ізольоване дворянство остаточно перетворилося на ізгоїв-меншість, зневажену всіма, крім своїх. Оскільки достатньо заможні білі, щоб швидко перебратися на північ, вирішують забрати із собою незаконно нажиті статки, багато представників професійних сфер також почали масово емігрувати разом із від'їздом своєї постійної клієнтури."

 #Сент-Кітс і Невіс
 SKN_Under_Microscope: "Під мікроскопом"
 SKN_Under_Microscope_desc: "Наче оселя для мурах, Сент-Кітс і Невіс є мікродержавою в усіх сенсах цього слова. З постійним населенням трохи менше сорока тисяч і майже без великих промислових підприємств будь-який зовнішній вплив легко може спричинити непропорційні наслідки для розвитку островів — як позитивні, так і негативні.\n\nЧерез свою вкрай мізерну економіку, нещодавню нестачу коштів, спрямованих на її підтримку, та постійне скорочення канадської допомоги рівень життя мешканців Сент-Кітсу постраждав особливо сильно порівняно з іншими острівними державами Підвітряних островів. Крім того, життєздатність суверенітету островів також виявилася суперечливим питанням, оскільки їхня повна залежність від іноземної підтримки поставила під сумнів межу між колонією та державою."

 SKN_Malliouhana_Prey: "Жертва Маліуани"
 SKN_Malliouhana_Prey_desc: "Анґілья, бунтівний острів, колись названий Маліуаною його первісними аравацькими мешканцями на честь легендарного морського змія, розірвала Сент-Кітс і Невіс на частини. Острів відокремився, забравши із собою значну частину населення та чималу частину національної гордості.\n\nЦі рани ще не встигли повністю загоїтися. Маневр Маліуани легітимізував саму концепцію відокремлення в політичному дискурсі, особливо після того, як уряд Бредшоу посилив централістську політику. Невісські сепаратисти збираються в тіні, очікуючи на свій момент, щоб піти слідом за змієм."

 SKN_Little_Davids_Throw: "Кидок малого Давида"
 SKN_Little_Davids_Throw_desc: "Уряд Бредшоу розпочав амбітний план економічного розвитку для такого маленького острова. Він прагне використати обмежені державні ресурси для підтримки занепалої цукрової промисловості та її профспілок, водночас використовуючи прибутки для створення скромної держави загального добробуту.\n\nАле поки Давид прицілюється, Голіаф піднімає свою потворну голову. Політичне інакомислення з боку поміркованих сил та величезне навантаження на бюджет загрожують розірвати націю навпіл, але, можливо, за достатньої рішучості камінь малого Давида влучить у ціль."

 SKN_Sugar_Mass: "Цукровий мас"
 SKN_Sugar_Mass_desc: "Щоб компенсувати майже неіснуючий внутрішній ринок Сент-Кітсу, кілька блискучих економістів вигадали ідею фестивалю під назвою «Цукровий мас», щоб привабити північноамериканських туристів до цієї мальовничої маленької держави далеко на півдні. Змішавши в одну суміш приблизно карибські звичаї, «Цукровий мас» став карнавальним святкуванням, покликаним принести яскраву, оновлену атмосферу до й без того непримітних пам'яток Сент-Кітсу.\n\nЗавдяки готовності як американського, так і канадського капіталу долучитися до цього відносно малоризикового економічного проєкту, він виявився досить популярним серед нічого не підозрюючих туристів ззовні, хоча деякі місцеві досі вважають це штучне творіння не чим іншим, як самоприниженням."

 SKN_Malliouhana_Slumbers: "Сон Маліуани"
 SKN_Malliouhana_Slumbers_desc: "Анґілья, бунтівний острів, колись названий Маліуаною його первісними аравацькими мешканцями на честь легендарного морського змія, на певний час була приборкана, а її відокремлення придушене. Уряд РД доклав значних зусиль для збереження її автономії та створення справді федералістської форми правління.\n\nАле тінь Маліуани все ще ховається просто під поверхнею води, і багато хто боїться дня, коли вона повернеться з глибин, щоб завдати удару."

 #Федерація Підвітряних островів
 SKN_Federalist_Bulwark: "Федералістський бастіон"
 SKN_Federalist_Bulwark_desc: "Створена частково на противагу ідеї Тринідаду щодо лівонаціоналістичного Східнокарибського союзу та більш розрізненому співробітництву Барбадосу в рамках КАРІКОМ, Федерація Підвітряних островів шукає середній шлях. Шлях, який об'єднає острови навколо спільних консервативних цінностей і духу братнього патріотизму.\n\nЦя протидія лібералізуючим та націоналізуючим тенденціям постає водночас як новий потенційний шлях для регіону та повернення до традицій. Наслідування британської моделі для нової епохи."

 SKN_Pepperpot_Stew: "Рагу з пеперпоту"
 SKN_Pepperpot_Stew_desc: "Подібно до британської колонії Підвітряних островів до неї, Федерація Підвітряних островів є пухким об'єднанням невеликих островів із власними унікальними культурами, політикою та економіками. Однак, на відміну від незв'язного псевдофедералізму попередньої адміністрації, цей новий союз прагне використати ситуацію якнайкраще. Об'єднати щось більше, ніж проста сума його складових.\n\nНе маючи міцної основи центрального управління та вже потерпаючи від напруженості, залишається побачити, чи це рагу з пеперпоту спокійно довариться, чи переллється через край."

 #Віндвардські острови
 SVI_Banana_Boom: "Банановий бум"
 SVI_Banana_Boom_desc: "Цукрова промисловість Віндвардських островів помирала, а конкуренція з боку Карибського басейну та зростання виробництва цукрових буряків повільно виснажували острови. Лише масштабні іноземні інвестиції у виробництво бананів змогли зупинити кровотечу.\n\nВідтоді острови були глибоко перетворені так званим «банановим бумом», разом із яким надходили капітал та інвестиції в інфраструктуру — але бананові компанії, найвідоміша з яких — сумнозвісна United Fruit Company, не сиділи без діла й тепер мають значну вагу в політичних та соціальних питаннях."

 SVI_Neocolonial_Backlash: "Неоколоніальна реакція"
 SVI_Neocolonial_Backlash_desc: "Відродження старого плантаційного землеробства у формі вирощування бананів принесло великі багатства, але різко посилило соціальну напруженість. Захист прав працівників на островах ніколи не був значним, а це разом із мізерним політичним представництвом — навіть за карибськими стандартами — довело ситуацію до точки кипіння. Під блискучою поверхнею зріє реакція проти цього нового, «процвітаючого» порядку."

#Saint Vincent
 SVI_Sifting_Through_The_Ashes: "Перебираючи попіл"
 SVI_Sifting_Through_The_Ashes_desc: "У 1902 році вулкан Ла-Суфрієр вивергнувся, убивши близько 1 600 людей, залишивши ще 4 000 без домівок і знищивши бавовняну промисловість Сент-Вінсенту. У [year when this event happens] році Федерація Вест-Індії розпалася ще до того, як її взагалі встигли створити, а під уламками опинилися Сент-Вінсент та його економіка, заснована на ароруті й бананах. Для решти своїх побратимів із Віндвардських островів Сент-Вінсент є попередженням про те, до чого може призвести недостатньо розвинена та недиверсифікована економіка.\n\nТепер острів майже цілком залежить від іноземної допомоги, переважно від Комісії Вест-Індії, щоб не збанкрутувати. Щодня представники Сент-Вінсенту звертаються по допомогу до інших держав, і щоразу ті відповідають: «Побачимо», а Сент-Вінсенту залишається сподіватися, що вони будуть щедрими, аби острів не пішов на дно."

 SVI_Shadow_of_La_Soufriere: "У тіні Ла-Суфрієр"
 SVI_Shadow_of_La_Soufriere_desc: "Коли говорять про Сент-Вінсент і Ґренадини, про Ґренадини майже не згадують, якщо згадують узагалі. Майже вся економіка та політична структура держави залежить від Сент-Вінсенту, тоді як інші острови залишаються нерозвиненими та віддаленими від центрального уряду. Деякі острови навіть залишаються недоторканими з XIX століття.\n\nНечисленні мешканці цих островів рідко називають себе вінсентійцями, а також почали формувати власні сепаратистські групи. Поки Ґренадини можуть дрімати, невдовзі вони вийдуть із берегів і поглинуть Сент-Вінсент, наче Ла-Суфрієр у 1902 році."

#Barbados
 BRB_Acing_the_Report_Card: "Відмінний табель"
 BRB_Acing_the_Report_Card_desc: "Після хвилі заворушень по всьому Карибському басейну в 1952 році спільний канадсько-американський консультативний комітет, відомий як Комісія Вест-Індії, створив амбітний план розвитку, покликаний перебудувати регіон. Через десять років результати, м'яко кажучи, виявилися нерівномірними: брак фінансування та реакційні адміністратори поставили ці грандіозні плани під загрозу. І все ж, попри всі труднощі, молода держава Барбадос височіє над рештою, забезпечуючи своєму населенню сучасний рівень освіти, охорони здоров'я та економічної мобільності.\n\nВодночас дедалі сприятливіша для інвесторів економіка призвела до того, що американський капітал почав масово надходити до Бриджтауна, допомагаючи розвитку держави, а владні іноземні радники та бізнесмени диктують політику згори. Деякі баяни починають замислюватися, чи справді розвиток вартий ціни нового колоніалізму."

 BRB_Growing_National_Consciouness: "Зростання національної свідомості"
 BRB_Growing_National_Consciouness_desc: "У міру того як Кариби об'єднуються в боротьбі за те, щоб залишити позаду застарілий колоніалізм, на Барбадосі стає очевидним дедалі сильніший попит на автономію, що виникає разом із формуванням баянької патріотичної традиції. Місцеві жителі всіх каст усвідомлюють байдужість оттавських господарів до потреб своїх південних підданих, і баяньська громадськість підхопила заклик панкарибізму, що поширюється по всьому регіону. Усвідомлюючи стратегічні переваги держави, активісти Бриджтауна особливо наголошують на провідній ролі Барбадосу як взірця економічної та політичної свободи.\n\nЗагалом більшість баянів стали певною мірою прихильними до ідеї подальшої інтеграції в ширшу незалежну карибську спільноту, а для сміливців, які мріють про об'єднані острівні держави, ця мрія вже не здається чимось за межами найсміливішої уяви."

 BRB_Party_Monopoly: "Монополія партії"
 BRB_Party_Monopoly_desc: "Одностороннє перехрестя — найкращий спосіб описати партійну політику Барбадосу; часто тут залишається менше ілюзії вибору, ніж штучної видимості такого вибору. Будучи єдиною силою, що визначала правила гри на Барбадосі з 1930-х років, Барбадоська лейбористська партія перетворила своє повне панування над практично всією державою на відкритий секрет за правління Ґрантлі Адамса та його протеже.\n\nПопри відносно прогресивний підхід до соціальних питань, англофільські схильності Адамса так і не змогли підкорити собі значну частину молодших, більш незалежно налаштованих баянів — протягом останніх років громадська підтримка дедалі більше вислизала з його рук. Проте усунути БЛП від влади буде дуже складно через послуги та важелі впливу, які вона накопичила протягом багатьох років."

#Trinidad
 TRI_undersea_riches: "Тринідадська смола"
 TRI_undersea_riches_desc: "Фюрер безрозсудно боровся за бакинську нафту, а Дуче жадібно зазіхав на чорне золото Лівії — з необхідності керівництво Тринідаду також поставило майбутнє держави на нафтохімічну промисловість, і це вражаюче окупилося. Хоча видобуток значних нафтових запасів Тринідаду субсидує непомірні витрати на базове соціальне забезпечення та державні інвестиції, хліб і видовища також висять на волосині від того, щоб стати причиною заворушень, адже більшість трині вже звикла покладатися на ці блага.\n\nПопри солодкі слова з півночі, англоси виступають проти розвитку незалежної держави Тринідад через подальше зменшення економічного впливу. Оскільки Канада та США активно намагаються відібрати в держави контроль над видобутком нафти, виживання однієї з більш заможних економік Карибського басейну залишається невизначеним."

 TRI_disunited_front: "Роз'єднаний фронт"
 TRI_disunited_front_desc: "Ерік Вільямс вибув — на шок мільйонів людей по всьому Карибському басейну, а його колись славетна спадщина була втоптана в багнюку волею народу, обуреного його бездіяльністю. На його місці постає широка коаліція лівих і консерваторів, які виступають проти Вільямса, об'єднаних палким бажанням усунути Вільямса та домогтися змін у Тринідаді.\n\nПроблема, звісно, полягає у визначенні того, якими саме будуть ці зміни.\n\nПрофспілки, страйк яких зупинив економіку, вимагають додаткових гарантій і пільг для себе та своїх працівників. Керівники армії, чий заколот завдав останнього удару та повалив режим Вільямса, вимагають передати владу аполітичним силам — їм самим — так само голосно, як їхні солдати вимагають змін. Рух чорної сили, чиї протести започаткували цей ланцюг подій, вимагає прийняти та втілити їхні вимоги щодо соціальних змін.\n\nУ центрі цього вируючого хаосу тимчасовому уряду Дааґи належить прокласти неможливий шлях крізь безлад. Майбутній шлях Тринідаду залежить від їхнього успіху або провалу."

 TRI_pnm_dominance: "Домінування ННР"
 TRI_pnm_dominance_desc: "Тринідад є демократією, безсумнівно, але за недавніми результатами виборів цього важко сказати. ННР домінує на політичній сцені в кожному аспекті та на кожній посаді, з майже хірургічною точністю обеззброюючи своїх опонентів. Очолювана надзвичайно популярним Еріком Вільямсом, президентом і так званим «Батьком нації», ННР користується стабільною популярністю від самого створення ФВІ та не має справжніх суперників, здатних їй протистояти.\n\nЗвісно, ніщо не триває вічно, і націоналістичний, лівий ухил ННР має чимало противників, як і сам Ерік Вільямс. Однак, доки ці противники не зможуть організуватися — або доки їм не вдасться схилити більшість народу на свій бік, — Ерік Вільямс і ННР, схоже, домінуватимуть у найближчому майбутньому Тринідаду."

 TRI_Fragmented_Politics: "З хаосу"
 TRI_Fragmented_Politics_desc: "У політиці, визначеній етнорелігійною відданістю, дисципліною та впертістю, Народний національний рух Еріка Вільямса ледь випередив своїх суперників. ННР, що спирається на афро-тринідадський робітничий клас і підтримується частиною профспілок та інтелігенції острова, опинився проти глибоко розколотої опозиції, особливо серед значної індо-тринідадської меншини.\n\nХоча Вільямс заявляє, що хоче побудувати Тринідад для всіх його жителів, меншини вже побоюються, що гігант ННР спробує встановити афро-тринідадське правління. Поки опозиція свариться між собою, Вільямс уже проводить реформи — від соціальної сфери до економіки, зосереджуючись на подоланні тривалих наслідків рабства на островах.\n\nВикористовуючи ці реформи, а також зв'язки з профспілками та лідерами рухів, Вільямс продовжує зміцнювати свою владу."

 TRI_OFN_Outpost: "Чаґуарамас"
 TRI_OFN_Outpost_desc: "Орендований Сполученими Штатами у британців у найвідчайдушніші періоди Другої світової війни, Чаґуарамас був простим портом, побудованим винятково для підтримання американської присутності у власному задньому дворі Америки та, звісно, для полегшення зростаючих боргів, які накопичив Королівський флот.\n\nПроте з роками, коли Європа остаточно опинилася під владою фашизму, а увага ОВН змістилася назад до власної території, Чаґуарамас перетворився на одне з найважливіших протичовнових укріплень у всьому Карибському басейні — особливо очевидно це стало тоді, коли підводні човни зруйнували всі залишки ланцюгів постачання в останні роки війни.\n\nСьогодні, оснащений найкращими можливостями американської військово-морської експертизи, для тринідадців він є радше болючим місцем, ніж прекрасною прикрасою, через своє будівництво, що межує з колоніальним. Але знаючи, що Вашингтон не створюватиме проблем, доки місцеві господарі отримують достатньо щедру платню, скасування чогось, що є не більше ніж реліквією, видається досить безглуздим."

 #East Caribbean Union

 TRI_Beyond_Slavery_and_Capitalism: "За межами рабства й капіталізму"
 TRI_Beyond_Slavery_and_Capitalism_desc: "Наслідуючи шлях багатьох революційних держав, Східнокарибський Союз став девелопменталістською економікою, подібною до мексиканської. Націоналізації, особливо тринідадської нафти, стали невід'ємною частиною нової держави, а Тринідад став першою ціллю нового економічного плану.\n\nКошти, отримані від цих націоналізованих галузей, потім витрачаються на соціальні програми або на розвиток інших, менш розвинених островів Союзу. Хоча багато хто підтримує розвиток інших островів, вважаючи його позитивним для економіки Союзу в цілому, деякі тринідадці обурені цією політикою, оскільки вважають, що їхні гроші витрачаються не на них.\n\n"

 TRI_First_Among_Unequals: "Перший серед нерівних"
 TRI_First_Among_Unequals_desc: "Визволення робітників — непростий шлях, принаймні для східних карибців. Як і багато інших соціалістичних держав, Союз обрав централізований підхід до управління, причому влада походить із багатого на нафту Тринідаду. Схоже, що іншим островам такий порядок не до вподоби так само, як самому Тринідаду.\n\nУ Ґренаді, Тобаґо, Сент-Вінсенті та Ґренадинах через океан чути нарікання робітників та їхніх представників. На жаль для них, тринідадська нафта далеко сягає, і іншим островам доведеться миритися з Тринідадом на чолі, принаймні поки що."

 TRI_Doc_Knows_Best: "Док знає краще"
 TRI_Doc_Knows_Best_desc: "Доктор Ерік Вільямс, якого деякі його послідовники ласкаво називають «Док», править [TRI.GetNameDef], поєднуючи залізний кулак із оксамитовою рукавичкою. Керуючи через складну політичну машину та силу своєї знаменитої харизми, Вільямс спрямовує свої амбіції на щось більше за те, що вже має: досягнення єдності всього Карибського басейну.\n\nПереконаний націоналіст, абсолютно впевнений у правдивості власних переконань, Вільямс має мало терпіння до опозиції. Демократія функціонує більш-менш нормально, але вплив Дока є всеохопним, а його слово — підкріплене лояльною, відданою надбільшістю на всіх рівнях влади — є законом. На краще чи на гірше, культ особи Еріка Вільямса є сонцем, навколо якого обертається всесвіт політики [TRI.GetName]."

 TRI_Doc_Without_Borders: "Док без кордонів"
 TRI_Doc_Without_Borders_desc: "Доктора Еріка Вільямса деякі його послідовники ласкаво називають «Док» — їх стало більше, ніж будь-коли раніше, після його успішного відбиття того, що він назвав «імперіалістичною спробою розірвати Східнокарибський Союз у Ґренаді». Його ім'я шанують майже на рівні з іменем Джорджа Вашинґтона чи імператора Педро, а його слово має в Східнокарибському Союзі ще більшу силу закону, ніж раніше.\n\nОстанній проєкт Вільямса — ширший фронт між державами та народами Карибського басейну. Оскільки Східнокарибський Союз став таким успішним, «Док» сподівається розширити його та поширити дух антиімперіалізму мексиканського зразка по всьому регіону. Водночас Вільямс розвинув свій уже всюдисущий культ особи, стаючи дедалі авторитарнішим на захист свого масштабного бачення."

 TRI_Generalissimo_Williams: "Генералісимус Вільямс"
 TRI_Generalissimo_Williams_desc: "Після успішного вторгнення Еріка Ґейрі до Ґренади, яке відокремило острів від Східнокарибського Союзу, прихильність, завдяки якій деякі послідовники доктора Еріка Вільямса називали його «Док», здебільшого змінилася страхом різного ступеня. Ще до втрати Ґренади правління Еріка Вільямса мало деякі авторитарні тенденції, але тепер він прийняв їх повністю.\n\nПолітичні партії, які й без того були затиснуті з усіх боків прихильниками Еріка Вільямса, тепер жорстоко придушуються, а модель псевдодемократії за зразком ПРІ витісняє відносно функціональну систему, що існувала раніше. З цією метою таємна поліція Вільямса, названа «Летючими загонами», розширюється до безпрецедентного рівня і тепер така ж всюдисуща, як пропагандистські плакати. Кожен крок Вільямса в ці дні видає страх перед американською операцією з його повалення."

 TRI_Paging_Doc_Williams: "Викликайте доктора Вільямса"
 TRI_Paging_Doc_Williams_desc: "Будучи змушеним піти на поступки Сполученим Штатам задля завершення Ґренадської кризи, прихильність, завдяки якій деякі послідовники доктора Еріка Вільямса називали його «Док», дедалі більше змінюється презирством; саме прізвисько повільно перетворюється на образливе.\n\nЙого амбіції зазнали краху, Вільямс став замкнутим і похмурим, не бажаючи брати участь у державному управлінні. Висловлювання Вільямса втратили будь-яку енергію та дедалі більше нагадують шаблонні комюніке. Політична опозиція, яка раніше здавалася нездійсненною мрією, тепер зростає в тіні, оскільки Вільямс більше не бере настільки особистої участі в управлінні. Тим часом пересічний громадянин Східнокарибського Союзу спостерігає, як американські компанії отримують повну свободу дій, і втрачає віру в людину, яку колись лестливо називали «Док»; культ особи розвіявся, як і всі надії та мрії Еріка Вільямса."
 

 #French West Indies
 FWI_Spirit_Third_Republic: "Дух Третьої республіки"
 FWI_Spirit_Third_Republic_desc: "Після падіння материкової Франції перед фашизмом у 1940 році її заморські колоніальні володіння спіткала різна доля — у випадку Французької Вест-Індії (зокрема Гваделупи та Мартиніки) було застосовано закон Тревенюка 1872 року, який передав контроль над островами кільком надзвичайним радам, що продовжують демократично керувати ними в рамках Третьої республіки. Принаймні на папері.\n\nНасправді питання антильського самоврядування значно складніше, ніж здається на перший погляд. Сполучені Штати взяли контроль над островами до подальшого повідомлення, використавши закон Шорт-Фулбрайта 1947 року як правову підставу для цього. Хоча Антильські острови офіційно можуть керувати собою самостійно, роблять вони це під пильним американським наглядом."

 FWI_An_Ugly_American: "Потворний американець"
 FWI_An_Ugly_American_desc: "Вони всюди в наш час. На ваших екранах, у ваших газетах, навіть у вашому клятому уряді. Від них не втекти. Вони вриваються без найменшої турботи про те, що ви можете думати чи в що вірити, і роблять те, що вважають правильним.\n\nАмериканці.\n\nЛайман Лемніцер — один із таких американців. Як цивільний верховний комісар США на Антильських островах, він має приємне обличчя, привітну посмішку та готовність діяти; справжній взірець політики у колишніх французьких колоніях. Але він американець — до того ж високопоставлений військовий. А разом із цим приходять проблеми, притаманні американським методам. Його схильність втручатися в місцеві питання призвела до досить напружених відносин між наявними інституціями островів та американською цивільною адміністрацією. Коротше кажучи, він — втручання. Таке, від якого багато хто на Антильських островах уже починає втомлюватися."

 FWI_Corporate_Cartels_Labor_Unions: "Корпоративні картелі та профспілки"
 FWI_Corporate_Cartels_Labor_Unions_desc: "Не секрет, що верховний комісар і весь його генеральний штаб прихильні до часів Нового курсу, і це очевидно в повсякденному житті на Антильських островах. Через роки експериментів у дусі Нового курсу як капіталістичні картелі, так і профспілки фактично стали політичними утвореннями самі по собі, особливо коли йдеться про місцеву політику.\n\nПорівняно з іншими територіями, керованими Сполученими Штатами, це є визначним явищем і створює відчуття гармонії між адміністрацією, бізнесом і працею. Однак це має і свої проблеми — якщо обидві сторони зіткнуться між собою або виступлять проти адміністрації, придушити їх буде практично неможливо."

 FWI_Stagnating_Plantation_Economy: "Застійна плантаційна економіка"
 FWI_Stagnating_Plantation_Economy_desc: "У 1960 році Сполучені Штати спробували вдруге зловити блискавку в пляшку. Американські економічні планувальники запровадили на Антильських островах ініціативу під назвою «Операція Піднесення», подібну до ініціативи «Операція Бутстреп», запровадженої в Пуерто-Рико кількома роками раніше. Прагнучи інвестувати державні кошти в інфраструктуру, яка призвела б до економіки, виразно зосередженої на корпораціях, торгівлі та виробництві, адміністратори сподівалися, що проєкт принесе островам більше економічного процвітання та підвищить продуктивність.\n\nПроте вашингтонські чиновники, які мислили високими ідеями, не знали, що це лише зашкодить антильцям. Коли працівники масово залишали плантації на більш аграрних островах заради міст, невдовзі просто не залишилося достатньо робочих місць для всіх. У міру того як розвивався стратифікований класовий поділ між міськими жителями та фермерами, а економіка невдовзі почала падати, «Піднесення» лише зашкодило економіці та породило серед місцевих затяжне обурення."

 FWI_Squabbling_Few: "Сварливі небагато"
 FWI_Squabbling_Few_desc: "Серед усіх критиків і повстанців плантократія Альбрана, здається, має лише одного постійного противника — самих плантаторів. Децентралізація та фаворитизм зробили плантократів беззаперечними господарями держави, і тепер їм не залишається ворога, з яким можна боротися, окрім самих себе.\n\nКоаліції, групи інтересів і патронажні мережі виникають та поширюються всередині вищого класу держави. Хоча вони часто є лише продуктом племінного мислення, у пошуках покровителів вони нерідко звертаються до іноземних держав, у справи яких сам Альбран не наважується втручатися. Якщо ця сварка вийде з-під контролю, Медар Альбран увійде в підручники історії не ким іншим, як невдахою."

 FWI_Retreat_Planteurs: "Відступ плантаторів"
 FWI_Retreat_Planteurs_desc: "Плантократію було викорінено з політичної сфери Антильських островів після приходу Поля Валентино до влади, що спричинило масове обурення правих. Спираючись на нижчі касти Конфедерації, опозиція тепер мобілізується проти платформи Валентино, натхненної Новим курсом, заявляючи, що прем'єр-міністр є маріонеткою американського імперіалізму — фальшивим популістом, який краде у вразливих.\n\nДля більшості антильців немає нічого огиднішого за Джима Кроу за межами лінії Мейсона—Діксона. Проамериканськість Валентино полегшила ототожнення його з однією з найбільших загроз для простого народу, до якої тепер апелює права опозиція. Чи то наклеп, чи правда, цей ненавмисний багаж зіпсував сприйняття багатьма їхнього нового прем'єр-міністра."

 FWI_Peoples_Triumph: "Тріумф народу"
 FWI_Peoples_Triumph_desc: "Створений свого часу для збереження мертвої плоті архаїчного європеїзму, американський проєкт федералізації Антильських островів обернувся проти своїх творців, якимось чином перейшовши під контроль франкомовних соціалістів регіону, які з ентузіазмом навіть очолили реалізацію цієї ініціативи.\n\nЗвернувши інструменти гнобителів проти них самих, колишні інституції колоніальної бюрократії були перетворені на простір толерантності та доброзичливого братерства різноманітними лівими рухами, які тепер охоплюють їх. Поки що західноіндійським соціалістам є чому радіти, тоді як їхні праві побратими зі страхом туляться, поки над Карибами гордо майорять червоні прапори."

 FWI_Socialized_Colonial_Economy: "Соціалізована колоніальна економіка"
 FWI_Socialized_Colonial_Economy_desc: "Плантаційна економіка була спадщиною колоніалізму та найвищого приниження. Для антильця вважати, що вона залишилася лише реліквією, є не просто спогадом про найпохмуріші години Антильських островів, а громадянським обов'язком. Коли землі плантацій повернулися до їхніх обробників, а експорт сировини, що приносив прибуток, було націоналізовано задля добробуту мас, можливо, за кілька поколінь більше не буде потреби будувати економіку держави лише на товарних культурах.\n\nПоки ми ламаємо собі спини, прибутки від нашої нинішньої праці годуватимуть мільйон ротів у кращі часи. Nous avons osé être libres, osons l'être par nous-mêmes et pour nous-mêmes."

 FWI_Broad_Front_Opposition: "Широкофронтова опозиція"
 FWI_Broad_Front_Opposition_desc: "АПФ справді стала символом єдності, хоча й у союзі, якого сама не створювала. Усі капіталістичні сили тепер збирають свої сили, чи то космополітичні ліберали, непохитні плантатори чи поважні консерватори — ніхто з них більше не має терпіння до неможливої програми червоних, спрямованої на перетворення карибців на своїх.\n\nОб'єднавшись у широкий правий фронт з єдиною метою повалити спільного ворога, АПФ стикається із серйозними труднощами під час усіх законодавчих процедур, оскільки філібастери та бойкоти стають дедалі частішими й нестерпними в усіх відомствах. Ті, хто присягнув на вірність капіталу, не спочинуть, доки не побачать усунення соціалістів від влади."

 FWI_Beyond_The_Third_Republic: "За межами Третьої республіки"
 FWI_Beyond_The_Third_Republic_desc: "Попри весь свій націоналістичний запал і новознайдені свободи, антильське верховенство права є лише крихтою від туші Французької Третьої республіки — назви, що з часу її падіння у 1940 році викликає лише приниження. Активісти Чорної сили намагаються, а націоналісти підштовхують, але жоден рух не може по-справжньому втекти від спадщини рабовласницької системи, яку колишній сюзерен укорінював протягом усього свого існування.\n\nЛише по-справжньому оптимістичні можуть передбачити майбутнє без французьких залишків, та й соціалісти не вважають практичним знести всі наявні установи за одну мить. Важко сказати, чи знадобиться для цього п'ять років, чи п'ять десятиліть, але цей час деколонізації, попри все, є останнім шансом залишити старі часи там, де їм і місце."

 FWI_Exiled_Opposition: "Опозиція у вигнанні"
 FWI_Exiled_Opposition_desc: "Здавалося, боягузтво Республіканської партії в одну мить забезпечило світліше майбутнє. Але насправді все було не так просто. Ці прислужники рабовласницьких плантаторів та їхніх господарів, позбавлені захисту, втекли з Антильських островів. Їх не стільки повалили, скільки вони скористалися нагодою емігрувати, коли робітники штурмували їхні поля.\n\nРП та плантаторські еліти можуть здаватися історією, але вони забрали із собою найпотужнішу зброю — капітал. Втікши через Кариби з привласненим значним обсягом багатств Гваделупи та Мартиніки, тепер вони невтомно працюють над закликами до знищення свого нового уряду з-за моря."

 FWI_A_Revolution_Secured: "Революція убезпечена"
 FWI_A_Revolution_Secured_desc: "Після провалу контрреволюціонерів у забезпеченні своєї перемоги ППА нарешті може виявити та успішно викорінити залишкові реакційні елементи, вбудовані в адміністрацію. Оскільки коротке, але тиранічне правління путчистів підштовхнуло всіх, крім найбільш фанатичних правих, підтримати фронт Архімед, революціонери тепер нарешті опинилися в справді безпечному становищі.\n\nОднак домінування Сполучених Штатів у регіоні залишається загрозою, що нависає, і будь-які помилки щодо їхнього курсу означають неминучу загибель революції знову. Тому Конфедерація змушена підтримувати помірковану зовнішню політику, доки не з'явиться шанс позбутися гегемона."

 FWI_Confederations_of_Federations: "Конфедерація федерацій"
 FWI_Confederations_of_Federations_desc: "Антильська держава — це не просто конфедерація двох островів, а заплутаний союз двох автономних федеративних держав, які мають між собою мало спільного в адміністративному плані. Конфедерація, що фактично існує лише завдяки непохитним елітам Гваделупи та Мартиніки, за своєю структурою є хаосом лабіринтоподібних апаратів, розділених у всіх своїх функціях фундаментальною штучністю.\n\nРезультатом цієї дисфункції є надзвичайно слабка виконавча влада Союзу, яку місцеві еліти легко можуть корумпувати, якщо забажають. Чи може уряд справді служити народу, якщо він є не більше ніж ті самі старі бандити в новому вбранні?"

 FWI_Outmoded_Plantocracy: "Застаріла плантократія"
 FWI_Outmoded_Plantocracy_desc: "Деякі люди виживають, але ніколи не пристосовуються. Плантократи Конфедерації залишаються єдиною найвпливовішою групою, попри те, що їхні економічні практики відстають від сучасних тенденцій на століття. Для більшості з них покращення добробуту своїх підлеглих ніколи навіть не спадало на думку, а відходи мало кого хвилюють, доки вони можуть набити ними власні кишені.\n\nЦі практики ненавидить більшість населення — від низів до верхів, — які всі сприймають плантократію не інакше як колоніальне правління. Але доки Республіканська партія не знайде кращого покровителя для своїх починань, ця відстала каста панів продовжуватиме правити антильською економікою."

 FWI_Victorious_Counter_Revolution: "Переможна контрреволюція"
 FWI_Victorious_Counter_Revolution_desc: "За підтримки плантаторської аристократії Республіканська партія успішно здійснила державний переворот проти уряду Архімед, встановивши нову «ліберальну республіку». Віддячуючи землевласникам за їхню підтримку, нинішній уряд пообіцяв мінімізувати своє втручання в їхні внутрішні справи відповідно до його політики фінансового laissez-faire.\n\nПопри те, що номінальна свобода слова та торгівлі наразі зберігається, економічна нерівність стрімко зростає, оскільки державні програми закриваються через брак фінансування. Утопія для плантократів, але не надто приємне місце для всіх інших."

 FWI_Underground_Popular_Front: "Підпільний народний фронт"
 FWI_Underground_Popular_Front_desc: "Після незаконного повалення її лівого кабінету Жерті Архімед пішла в підпілля разом із кількома революційними бойовиками, готуючись до повномасштабної відплати путчистам. Коли повстанці починають наступ у сільській місцевості, серед плантократів зростає страх, що придушена опозиція все ще може об'єднатися в справжній єдиний фронт.\n\nАнтильські острови — невелика держава, і для повалення нинішнього режиму не знадобиться багато людей, не кажучи вже про протистояння добре навченій воєнізованій організації. Без подальшої допомоги від войовничих покровителів Вашингтона антильський уряд не має жодної надії пережити це повстання."

 FWI_Insular_Federalism: "Острівний федералізм"
 FWI_Insular_Federalism_desc: "Об'єднання Антильських островів в єдину державу створило адміністративне навантаження, яке жоден із її окремих складових не мав ресурсів самостійно врегулювати. За порадою північноамериканських радників Антильські острови вирішили запровадити модель управління, що значною мірою нагадує федерально-штатну систему Сполучених Штатів: окремі острови розглядаються як напівавтономні штати.\n\nХарактерно, що виконавча влада центрального уряду отримує значні повноваження щодо судової та законодавчої гілок, тоді як останні мають визначатися островами самостійно, за винятком надзвичайних обставин."

 FWI_An_Ugly_Shadow: "Потворна тінь"
 FWI_An_Ugly_Shadow_desc: "Білий дім може вдавати, що нічого не знає, скільки завгодно, але після того, як пил осів, люди просто перетворилися на долари, а іноземна окупаційна влада стала корумпованим місцевим урядом. Під виглядом гуманітарної допомоги Сполучені Штати фактично перетворили ключові інституції антильського уряду на своїх васалів. Чи то військові, які гуртуються навколо своїх офіцерів, навчених Америкою, чи політики, які шукають нью-йоркських лобістів для фінансування своїх починань.\n\nКолоніалізм більше не в моді, але підприємництво — так. Північні підприємства бачать в Антильських островах фронтир для втілення свого бачення необмеженого капіталізму, і вони не віддадуть його без боротьби."

 FWI_Corporatized_Colonial_Economy: "Корпоратизована колоніальна економіка"
 FWI_Corporatized_Colonial_Economy_desc: "Прогрес не обов'язково означає покращення, іноді це просто означає, що справи відхилилися від свого початкового курсу. Конфедерація прийняла розумне рішення диверсифікуватися та відійти від феодальної плантаційної системи, за якою жили держави, замінивши її системою державної власності, хартій та більшої кількості активів на папері — речами, породженими корпоратократичною уявою.\n\nЯкщо не брати до уваги нічого іншого, то принаймні система державного контролю, безперечно, розподіляє фінансову корупцію від кількох десятків баронів між багатьма сотнями офісних працівників. Безсумнівно, хорошою новиною є те, що більше громадян отримують право голосу в економічних питаннях, адже в модернізованому середовищі завжди бракує свіжих думок."

 FWI_Guilliods_Presidential_Republic: "Президентська республіка Ґійо"
 FWI_Guilliods_Presidential_Republic_desc: "Демократія — це фарс для немитих мас, рою личинок і мурах, які заслуговують на захист, але не на право вести собі подібних до загибелі, яку вони неодмінно спричинять. У всій своїй мудрості кабінет Ґійо відійшов від марного федералізму — системи, від початку скаліченої масами — до більш відповідної форми правління у вигляді президентської республіки, де президент справді є першим серед рівних.\n\nЗвісно, народ усе ще повинен мати право голосу при обранні того, кого він хоче залишити при владі, але мало що зміниться, незалежно від того, буде це ім'я Раймона Ґійо чи ні. Усі нитки рано чи пізно ведуть назад до ляльковода."

 FWI_Strange_Bedfellows: "Дивні союзники"
 FWI_Strange_Bedfellows_desc: "Людина з неясними поглядами не збирає багато друзів у світі чорно-білого мислення, а вороги реформ Ґійо атакують його з обох боків. Червоні ненавидять людину, яка руйнує їхню уявну утопію, червоношиї ненавидять його за те, що він придушує економічне джерело життя, якому вже століття, — тим часом боязкі консерватори надто боягузливі, щоб виступити на захист свого друга при владі.\n\nРаймон Ґійо — централістський тиран чи деспотичний силач? Це питання, на яке жоден з опозиціонерів не може дати однозначної відповіді. Але доки вони продовжують нинішній курс і придушують будь-які ініціативи, які бачать у роботі кабінету, навряд чи статус-кво Конфедерації втримається."

 FWI_Antillean_Developmentalism: "Антильський девелопменталізм"
 FWI_Antillean_Developmentalism_desc: "Кабінет Ґійо не має наміру поступатися радикалам чи реакціонерам, хай як голосно вони протестують. Було б цілковитою дурістю ставити добробут антильців нижче за задобрювання цих кількох неспокійних меншин. Замість соціалізму та феодалізму нинішній курс на ліберальну подвійну політику — туризм і приватизацію — привів до економіки значні північноамериканські інвестиції.\n\nОскільки іноземні підприємці прагнуть отримувати довгостроковий прибуток, Вільний ринок поступово вбудовує власні механізми в самопідтримувану модель. Конфедерація процвітатиме незалежно від своїх критиків!"

 FWI_Actually_Existing_Gaullism: "Практично існуючий ґоллізм"
 FWI_Actually_Existing_Gaullism_desc: "Раймон Ґійо застряг у чистилищі двох взаємовиключних друзів, яких він мусить заспокоювати за будь-яку ціну. Вільні французькі вигнанці, які підтримують Ґійо, закономірно очікували компенсації від кабінету, а в процесі пошуку високих посад у уряді Ґійо для заповнення вони створили атмосферу клік, де кожен прагне лише допомогти власному протеже, майже не зважаючи на інших претендентів.\n\nІнший покровитель Ґійо — Білий дім — тепер незадоволений вигнанцями, які ускладнюють призначення підтримуваних США чиновників, із презирством дивлячись на їхню спробу захопити контроль над Антильськими островами. Тепер Ґійо мусить бути посередником між амбіціями Вільної Франції та новим американським колоніалізмом, випиваючи обидві отрути замість того, щоб обрати одну."

 #Anguilla
 AGL_Reluctant_Revolution: "Неохоча революція"
 AGL_Reluctant_Revolution_desc: "Політики Ангільї не прагнули відокремлювати свою організацію від Підвітряних островів, але й народ не міг змиритися з відвертою зневагою з боку тих, хто сидів у своїй вежі зі слонової кістки. Тоді як більшість інших так званих революцій зазвичай є результатом міжнародного втручання, відокремлення острова від його побратимів було неохочим, але неминучим наслідком десятиліття недбалості, яка довела народ до краю.\n\nПопри дипломатичну ізоляцію після фактичного здобуття незалежності, відчай породив революційний дух, про існування якого сам народ навіть не здогадувався. Надія на розвиток горить яскравіше, ніж будь-коли, попри остракізм з боку сусідів, адже доки держава стоїть, жодні труднощі не будуть надто великими, щоб їх витримати."

 #Dominica
 DMI_Cultural_Revolution: "Карибська культурна революція"
 DMI_Cultural_Revolution_desc: "Щоб допомогти Домініці позбутися обтяжливої та застарілої колоніальної ідентичності, прем'єр-міністр ЛеБлан розпочав масштабну операцію із залучення популярного руху Чорної сили до громадянсько-патріотичної традиції молодої держави, яку багато хто вирішив називати «домініканською культурою».\n\nЗадля створення ідеалу, що здається цілком відмінним від усього іншого, ЛеБлан також привласнив образи індіанців для цієї штучної домініканської культури, попри часто сумнівну автентичність таких уявлень. Чи збережеться в майбутньому домініканська нація, що розмовляє квейольською, ще належить побачити, але будь-який прогрес у цьому проєкті безперечно вимагатиме значної участі цивільного населення."

 DMI_Peeling_Banana: "Очищення банана"
 DMI_Peeling_Banana_desc: "Бананові плантатори є пошестю для прагнення створити сучасну домініканську націю, і, дивлячись на наших сусідів, краще позбутися їх зараз, ніж страждати від їхньої шкоди пізніше. Прем'єр-міністр ЛеБлан, зі свого боку, визнає необхідність вчитися на прикладах інших навколишніх держав, навіть тих, з якими Домініка не має найкращих відносин.\n\nНаслідуючи приклади Мексики та Куби, головний міністр почав об'єднувати соціально-економічні сили сільської місцевості проти плантаційної системи, майже не зважаючи на її вплив на традиційне джерело доходів країни. Хоча безпосередня участь ЛеБлана в цьому питанні принесла йому похвалу від сільських громад, дехто також вважає його жорсткі заходи небезпечно близькими до диктатури."

 DMI_Growing_Dissent: "Зростання незгоди" #Не надходить у MT
 DMI_Growing_Dissent_desc: ""

 #Saint Lucia
 SLU_Two_Faces_Labour: "Два обличчя лейборизму"
 SLU_Two_Faces_Labour_desc: "Політичне середовище Сент-Люсії перебуває під владою дволикої діархії, яка формально залишається об'єднаною під прапором лейборизму. Останніми роками, у міру того як антиколоніальні настрої стали особливо привабливими для популістських сегментів лівої партії, крило Чорної сили неминуче відокремилося від початкової профспілкової течії, фактично створивши рівноправну фракційну боротьбу всередині Лейбористської партії Сент-Люсії.\n\nЦя ідеологічна боротьба всередині партії підпалює порохову бочку на острові, де вони беззаперечно правлять, сварячись між собою — будь-який конфлікт між ними майже напевно завдасть хаосу крихкій рівновазі, яка стримує найгірші крайнощі Сент-Люсії."

 SLU_Ruins_Metayage: "Руїни метайажу"
 SLU_Ruins_Metayage_desc: "У часи свого аграрного минулого Сент-Люсія змогла уникнути перетворення на повністю плантаційну економіку, пристосувавши форму орендарського землеробства, відому сьогодні як метайаж, який, попри більш егалітарний вигляд, також призвів до серйозного економічного застою. Ба більше, він створив різкий поділ між переважно орієнтованими на майбутнє міськими жителями та селянством загалом.\n\nПочинаючи з 1950-х років, у спробі пролетаризувати сільських бананових фермерів і стимулювати розвиток земель, система була офіційно скасована Кастрі, а за недотримання нових правил часто застосовували жорсткі заходи. Унаслідок цього навіть через понад десятиліття перехід залишається непопулярним у сільській місцевості, попри його беззаперечні економічні плоди."

#Grenada
 GND_Mongoose_Revolution: "Революція манґуста"
 GND_Mongoose_Revolution_desc: "Йдучи за своєю зграєю головорізів, відомою в народі як Легіон манґуста, Ерік Ґейрі захопив владу на Ґренаді з єдиною метою — усунути східнокарибську присутність з острова через її постійне перевищення повноважень під керівництвом Еріка Вільямса. Підтриманий переважно флібустьєрами, найманцями, а також чималою частиною невдоволених, низькооплачуваних поліцейських, Ґейрі аж ніяк не може похвалитися народною підтримкою свого права на лідерство.\n\nХоча весь острів було переведено на надзвичайний стан через нібито наявні докази неминучої помсти з боку тринідадських сил, нинішнє диктаторське правління Ґейрі залишається за лічені миті від краху, якщо йому коли-небудь не вдасться задовольнити свою опору."

 GND_Grenadian_Connection: "Ґренадський зв'язок"
 GND_Grenadian_Connection_desc: "Революція Еріка Ґейрі не була суто народною, низка чуток розповідає про його зв'язки з іноземними розвідками — від Америки до Іберії — та загальну причетність до організованої злочинності. Чи здатна економіка утримувати себе на чорних грошах і контрабанді — відкрите питання та ключовий рушій прагнення Ґейрі до легітимності. "

 #Antigua
 ANT_Tourist_Wasteland: "Туристична пустка"
 ANT_Tourist_Wasteland_desc: "Хоча Антигуа завжди залежала від іноземних держав у торгівлі, принаймні в минулому її економіка спиралася на два стовпи. Однак до того часу, коли дзвони незалежності сповістили про настання нової епохи, один із них уже давно перетворився на порох. Без зрошення, інфраструктури чи консолідації тут майже не виробляється жодних основних сільськогосподарських культур, що робить місцеву економіку та життя мешканців острова цілковито залежними від іноземної допомоги.\n\nЄдиним порятунком для Антигуа є її туристична індустрія, яка, хоча й досі програє більшості інших карибських держав у конкуренції, забезпечує необхідний дохід, щоб принаймні частина населення острова залишалася заможною."

 ANT_Magpie_Treasure: "Скарб сороки"
 ANT_Magpie_Treasure_desc: "Корупція на Антигуа процвітає, і це аж ніяк не секрет. Вер Берд десятиліттями керував островом, а його родина входить до числа найбагатших мешканців острова, до яких приєднався новий клас еліт, що заповнив престоли, спорожнілі після краху плантацій. Профспілковці та адміністратори, віддані лише долару й лише доти, доки він наповнює їхні кишені. Берд може бути обличчям і поборником цього статус-кво, але він аж ніяк не є його єдиним претендентом."

 ANT_Reign_Rooster: "Правління Півня"
 ANT_Reign_Rooster_desc: "Вер Берд, авторитарний прем'єр-міністр Антигуа і Барбуди, править нацією залізною рукою ще з часів своєї роботи профспілковим лідером під час війни. Він та його родина панують над островом, наче феодальна династія, використовуючи свій подвійний контроль над Антигуа-Трейд енд Лейбор Юніон та Лейбористською партією Антигуа для домінування на політичній арені країни.\n\nЦей статус-кво було лише трохи похитнуто з приходом незалежності та запізнілим піднесенням конкуруючої партії — Прогресивного лейбористського руху. Однак скинути старого Берда з його сідала буде зовсім не просто."

 ANT_Northern_Migration: "Міграція на північ"
 ANT_Northern_Migration_desc: "Джордж Волтер здійснив неможливе, усунувши Вера Берда, і в гіркій трагедії тепер мусить зробити це ще раз. Після своєї поразки Берд утік до Нью-Йорка, і він аж ніяк не був єдиним, хто зробив те саме. Зі значною частиною державного апарату в хаосі та пограбованими державними резервами Волтер виявив, що відсутність Вера виявилася для нього такою ж поганою.\n\nХоча зараз можуть литися сльози, трагедія все ще може погіршитися й перетворитися на фарс. Зрештою, якщо йому не вдасться відбудувати країну, що завадить народу просто повернути Берда та його прибічників до влади на наступних виборах?"

 ##WIF ##
 WIN_Palm_Maple_Oak: "Пальма, клен, дуб"
 WIN_Palm_Maple_Oak_desc: "Попри здобуття номінальної незалежності, Федерація Вест-Індії все ще залишається в нещасливих лещатах конкуруючих впливів, у нескінченній боротьбі за політичні послуги та ненаситні бізнесові ініціативи.\n\nТоді як канадська влада все ще чіпляється за будь-яку міру контролю, яку вона може зберегти над своїми колишніми колоніями, гарантуючи, що вони не надто віддалятимуться від Співдружності, інша сторона бачить, як США хапаються за можливість спрямувати архіпелаг під свій безпосередній вплив.\n\nА прямо посередині, затиснуті між руками, що тягнуть із кожного боку, залишаються забуті небагато тих, хто називає острови своїм домом, і кожен ривок посилює зростаюче роздратування тих, хто поволі починає усвідомлювати, що їхня новознайдена автономія може бути лише номінальною."
 
 WIN_Caribbean_Shield: "Карибський щит"
 WIN_Caribbean_Shield_desc: "Для американської оборонної доктрини Кариби є і завжди були першим бастіоном проти будь-якої загрози військового проникнення з боку Атлантики.\n\nПопри те, що їхні дні як театру підводної війни під час Другої світової війни давно минули, ця стратегічна цінність не змінилася; але обставини, безумовно, змінилися.\n\nЯкщо новостворена Федерація досі погоджувалася й надалі виконувати попередню роль своєї території як критично важливого морського опорного пункту для ОВН, то лише питання часу, коли люди, що живуть на островах, захочуть взяти питання її оборони у власні руки."

 WIN_Shadow_Federation: "Тіньова Федерація"
 WIN_Shadow_Federation_desc: "У серцях багатьох її мешканців заснування Федерації Вест-Індії сприймається як момент вирішального тріумфу, здійснення двадцятирічної мрії про самоуправління, здобуте з-під ярма США та Канади.\n\nАле після того, як феєрверки згасли, а вигуки стихли, нова адміністрація зіткнулася з непростою реальністю: тепер вона мала de jure владу над низкою островів, над якими не мала абсолютно жодного реального контролю.\n\nНа практиці майже нічого не змінилося, і здебільшого повсякденне управління все ще здійснюють ті самі місцеві ради, що й раніше, тоді як центральний уряд федерації бореться під вагою власних політичних чвар."

 WIN_Lost_at_Sea: "Загублені в морі"
 WIN_Lost_at_Sea_desc: "Відсутність справжньої влади центрального уряду Федерації означає, що на практиці кожна місцева адміністрація залишається сама по собі, особливо в питаннях економічного планування.\n\nБез будь-якого єдиного напряму архіпелаг перетворився на лабіринт суперечливих політик, де один острівець дотримується власної ретельно контрольованої схеми розвитку, тоді як його сусід процвітає як осередок вільноринкового laissez-faire.\n\nОкрім того, що такий дисгармонійний розвиток є адміністративним головним болем для відстеження, він стає серйозною перешкодою для будь-якої організованої торгівлі між островами або навіть для таких нешкідливих питань, як встановлення узгодженої митної чи імміграційної доктрини."

 WIN_Pan_Caribbean_Dream: "Панкарибська мрія"
 WIN_Pan_Caribbean_Dream_desc: "Вперше в історії народи Вест-Індії були об'єднані як одне ціле, в країні, яку вони можуть назвати своєю. Факт, що залишатиметься правдою навіть перед обличчям усіх серйозних проблем, що турбують новонароджену Федерацію.\n\nЇї численні держави-члени можуть і далі зберігати ті самі міжострівні суперництва, що й раніше, а її уряд може бути не більш ніж оболонкою, що стикається з опором будь-якій реальній мірі контролю, яку він намагатиметься встановити над місцевими радами.\n\nТа попри ці постійні суперечки, кожен із конкуруючих голосів, що закликають до власного шляху майбутнього архіпелагу, робить це з ентузіазмом щодо мрії, спільної для всіх: справді карибської нації, як за назвою, так і за духом."

 #Oil Crisis
 WIN_Enter_Hurricane: "Увійти в ураган"
 WIN_Enter_Hurricane_desc: "Стійко пройшовши крізь чвари, що супроводжували її заснування, новонароджена Федерація Вест-Індії вступила б у наступне десятиліття з очима, що сяяли обіцянками світлого та процвітаючого майбутнього для її мешканців.\n\nАж поки нафтова криза не стерла всі ці надії.\n\nТепер від цих ідеалістичних засад залишилася адміністрація, що намагається витягнути безліч островів під своєю владою з-під загрози економічного краху. Якщо вона не знайде засобів реформувати свої занепалі інституції або рятівної руки зовнішнього благодійника, схоже, центральний уряд буде безсилим запобігти тому, щоб ці мрії про незалежність не завершилися трагічною катастрофою."

 #Canadian Bailout Path
 WIN_Maple_Autumn: "Кленова осінь"
 WIN_Maple_Autumn_desc: "Після того як пил осів, а офіційні документи та комюніке сповільнилися достатньо, щоб їх можна було прочитати, стало зрозуміло, що статус-кво Федерації Вест-Індії буде продовжено під пильнішим канадським наглядом. Після остаточного ухвалення цього рішення Домініон Канади, схоже, посилює своє покровительство та вплив над федерацією. Ліберально-шовіністичне бачення, якого всі партії канадського парламенту дотримувалися щодо управління та майбутнього Федерації Вест-Індії, здається непохитним.\n\nХоча пересічний канадський ентузіаст зовнішньої політики може радіти продовженню того, що Канада «виконує свій обов'язок піднести й просвітити» народи Федерації Вест-Індії, самі ці народи аж ніяк не такі захоплені. Великі верстви населення обурюються очевидним неоколоніалізмом нової системи. Ще більшою проблемою, яку значна частина парламенту, здається, наразі ігнорує, є американський скептицизм. Спостерігаючи з Ленґлі, Фоґґі-Боттом та інших місць у долині річки Потомак, дядько Сем не приховує своїх сумнівів щодо того, що Канада зможе впоратися вдруге."

 WIN_Follow_North_Star: "Слідувати за Полярною зіркою"
 WIN_Follow_North_Star_desc: "На тлі хаосу нафтової кризи та економічного краху, що її супроводжує, канадський уряд вжив заходів для стабілізації ситуації у Вест-Індії. Взявши на себе загальне економічне планування, канадці розпродали проблемні державні активи канадським та американським корпораціям і забезпечили дотримання дедалі меншої кількості санкціонованих державою монополій.\n\nБагато мешканців Вест-Індії вважають канадські заходи неоімперіалістичними за своєю природою, більше зосередженими на кінцевому результаті канадського Міністерства фінансів, ніж на добробуті тих, кому Канада нібито «допомагає». Інші, зауважуючи, що Канада також підтримала наявні соціальні мережі безпеки позиками та наглядом, вважають канадське економічне командування та контроль кращими за повний економічний крах. "
 #American Reforms Path
 WIN_Sturdy_Oak: "Міцний дуб"
 WIN_Sturdy_Oak_desc: "Кленове дерево канадського домінування у Федерації Вест-Індії впало, перетворившись на обгорілий пень під тиском нафтової кризи. На його місці довелося підперти міцний дуб — американське правління. Америка береться за це завдання без особливого ентузіазму; не бажаючи витрачати час чи ресурси на політичний розвиток регіону, Вашингтон був задоволений тим, що залишив це Канаді... аж поки під наглядом Канади все не пішло шкереберть. Оттава непридатна для цієї роботи. Народи Карибів навряд чи перебувають у кращому становищі, розірвані розбіжностями й змучені економічною нестабільністю. Як би сильно Америка не билася в істериці, саме дядькові Сему належить зробити концепцію «американського озера» реальністю."

 WIN_New_Captain: "Новий капітан"
 WIN_New_Captain_desc: "Федерація Вест-Індії не мала особливого вибору у рішеннях, які вона приймала. Раніше умови їй диктувала Оттава; сьогодні цю роль перебрав Вашингтон. Нинішні часи не є винятком: в обмін на очолювану Америкою фінансову допомогу Федерацію Вест-Індії «запросили» прийняти план масштабної економічної перебудови, розроблений висхідною зіркою економіки Томасом Соуеллом.\n\nСоуелл, економіст із чиказькою освітою, має намір перетворити Вест-Індію на показовий приклад свого радикального економічного лібералізму. З цією метою він нав'язливо зосереджується на демонтажі протекціоністських заходів та інших подібних торговельних бар'єрів, скороченні податків і «бюрократичної тяганини», а також знищенні «колективістських» профспілок, які, на його думку, ускладнюють інвестиції. Подобається це Вест-Індії чи ні, на цих островах настала нова, більш капіталістична ера. "

 WIN_United_States_Caribbean: "Сполучені Штати Карибів"
 WIN_United_States_Caribbean_desc: "Окрім інших економічних і політичних змін, спричинених заміною канадського патерналізму під впливом еміграції на американський патерналізм під впливом Чикаґо, Федерація Вест-Індії також зазнала повної перебудови свого державного апарату. Нова Федерація Вест-Індії є більш суворою федерацією; посилені повноваження були централізовані в столиці, водночас більше управління було передано різним островам.\n\nАмериканська федералістська модель виявилася достатньою для американських цілей, але частково це пояснюється взаємопов'язаністю та відносною однорідністю Сполучених Штатів порівняно з Карибами. Федерація Вест-Індії повністю складається з непов'язаних між собою островів і має більше етнічних груп на одному острові, ніж Америка часто має в кількох штатах; відповідно, ще належить побачити, чи справді ця нова система управління підійде Вест-Індії."

 #Williams Path
 WIN_Young_Palm: "Молода пальма"
 WIN_Young_Palm_desc: "Ледве уникнувши неминучої економічної загибелі завдяки своєчасній фінансовій допомозі, нестабільний архіпелаг тепер змушений самостійно прокладати шлях із нещодавньої кризи, тоді як канадська та американська влада вирішила зайняти більш невтручальну позицію, попри тривалу нестабільність.\n\nОднак це дратує як тих, хто сподівався отримати можливість провести давно назрілі реформи хиткої структури Федерації, так і тих, хто вважає черговий приплив грошей із заходу черговим доказом того, що нависла тінь їхніх колоніальних володарів ніколи не буває достатньо далеко."

 WIN_Federate_or_Die: "Федералізуйся або помри"
 WIN_Federate_or_Die_desc: "Після схвалення планів реформ, спільно запропонованих Еріком Вільямсом і Федеральною лейбористською партією, Федерація тепер проходить процес швидкої централізації, прагнучи залишити уряд у Бриджтауні краще оснащеним для управління численними окремими державами-членами архіпелагу.\n\nЦе, звичайно, викликає невдоволення тих, хто цінував відносну автономію, якою їхні острови досі користувалися, що призводить до зростання занепокоєння в міру зміщення балансу між прихильниками посилення державного контролю та тими, хто виступає за збереження децентралізованого статус-кво."

 WIN_Charting_Course: "Прокладаючи курс"
 WIN_Charting_Course_desc: "Вперше Федерація Вест-Індії може заявити, що є господарем у власному домі. Вона має намір ухопитися за цю новознайдену свободу обома руками. Озброєна новими повноваженнями та збільшеними доходами, нова централізована Федерація Вест-Індії планує сміливу нову еру економічного розвитку, що поширюватиметься зі столиці Бриджтауна.\n\nНатхненна тринідадськими державницькими планами девелопменталізму та підкріплена нафтовими грошима Тринідаду, Федерація Вест-Індії розпочала важку роботу з відходу від старої плантаційної економіки та перетворення Вест-Індії на сучасну націю, що надає соціальні послуги всім своїм громадянам. Цей шлях буде затягнутий питаннями фінансування та опором укорінених економічних інтересів, але Федерація Вест-Індії, схоже, налаштована залишатися на цьому курсі будь-якою ціною. "


