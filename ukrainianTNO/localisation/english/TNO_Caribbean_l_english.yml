 ## FWI Flavor Events
 #KD's Notes - If I see shitty formatting in this file again, you'll be sleeping with the fishes
 FWI_forpol.1.t: "Trouble in Paradise"
 FWI_forpol.1.desc: "CONFIDENTIAL/[?global.date.GetDateStringNoHourLong]\n\nOFFICE OF THE HIGH COMMISSIONER, US ANTILLES MEMORANDUM FOR THE UNDER SECRETARY OF STATE\n\nSUB: UNREST IN FORMER FRENCH WEST INDIES\n\n1. The political situation of the former French West Indies is steadily worsening. An economic program introduced by the Americans in 1960 under the umbrella of "Project: Uplift" to increase economic activity and help bring the islands into the modern market have instead had the opposite effect. The strength of the Antillean economy has declined in the last two years, with the project exacerbating a class-based divide between the locals. We advise Washington to prepare for immediate unrest.\n\n2. This deteriorating situation has done little to endear the islanders to our presence in the islands. The insistence of General Lemnitzer, the High Civil Commissioner of the islands on intervening on local matters whenever he chooses has further complicated matters. The political gap on the ground between those opposed to American presence and those in favour of it is rapidly widening, as both sides have begun to resent each other over whether they choose to support the administration or not.\n\n3. These tensions will likely worsen within the next two years. The Short-Fulbright Act of 1947 that granted administrative control of the islands will expire in 1964. Already, pro-independence and anti-independence advocacy groups have begun organising and campaigning, inciting riots, vandalism, and civil disobedience.\n\n4. If the current relationship continues, then current tensions could escalate into something gravely serious. It is advised that the government maintains a close watch on the islands to ensure that the situation does not escalate further."
 FWI_forpol.1.a: "Everywhere we go, there's something new."

 FWI_forpol.2.t: "Salt in the Sugar"
 FWI_forpol.2.desc: ""Excuse me... excuse me, please, I need to get through... excuse me!" Jean murmured, pushing through the throng that had gathered in the streets of Basse-Terre. The moment it had been announced that the Americans were staying in the Antilles, there had been an eruption of anger across the islands, and wherever you went it was seemingly inescapable.\n\nJean? He just wanted to get to work.\n\nPushing up his glasses, he made sure not to make too much eye contact with the protestors. "Best to keep your head down," his maman used to say, before patting him on the head and sending him to school. Coming from one of the more well-to-do local families but never amounting to anything beyond a managerial job at a moderately successful firm that came with the Uplift plans, he had never quite felt the need to partake in these displays. Either way, it felt as if the Americans would never leave.\n\nDesperately trying to squeeze through a mass of sweaty bodies without attracting any attention, he quashed the irritation that was starting to brew. He could sympathise with them. Truly. Sure, this time they had promised that the President had appointed a special group of people to think about whether the people on their islands deserved independence or not, but he doubted many believed that anything would come of it. The Americans still planned on staying regardless - something their whole congress agreed on. It was an impossible situation, and Jean was sick and tired of it.\n\nAfter what felt like an eternity he arrived at his workplace: a modest, yet official looking building. But as he approached, his heart sank as he noticed the sign in the door window."
 FWI_forpol.2.a: """CLOSED DUE TO RIOTS. WILL REMAIN UNTIL FURTHER NOTICE.""

 FWI_forpol.3.t: "Something's Gotta Give"
 FWI_forpol.3.desc: "General Lyman Lemnitzer was tired of losing control.\n\nThe General was used to being tested. It could be a soul-crushing job. He had bore witness to American forces crumbling in defence of the British isles alongside Eisenhower himself. He had been there arranging the terms of surrender, defeat weighing on his heart like a boulder. And when President Kefauver subtly kicked him to the curb by giving him stewardship of a pair of tiny islands in the West Indies, he had taken it with nothing but grace, endeavouring to manage them with dignity and honour.\n\nAnd yet, as it turned out, he couldn't even stop that from going to shit.\n\nHe collapsed onto his hotel bed, nursing a glass of bourbon, neat. Going before Congress was nothing new to him, but it still always felt like he was a naughty schoolboy being judged by his teachers. As he went into detail of the situation in the Antilles, he could feel their stares and sneers. He was doing all he could.\n\nTruth be told, the uproar on Martinique and Guadeloupe had dimmed somewhat, on the national scale. Once the initial outburst of riots and demonstrations after it was announced that the United States would maintain its presence on the island had passed, the tension had fizzled down to a local level. But now that independence had entered the public conversation, it could not be put away again. The jar was open, the cat was out the bag, and the pooch had been thoroughly screwed.\n\nMassaging his forehead, he took another sip. It wasn't as if they had planned to occupy the islands forever, anyway. Soon, his duty would be done."
 FWI_forpol.3.a: "Can't lose something you never really had."

 FWI_forpol.4.t: "Empty Promises"
 FWI_forpol.4.desc: ""This has to be a joke." Richard Nixon's eyes kept going over the lines of the paper that he held in front of him. A proposed amendment to the Short-Fulbright Act, introducing a referendum for the autonomy of the islands formerly belonging to the French Antilles. A region he'd done his best to markedly ignore since the beginning of his term. "I'm going insane with this mess in South Africa, and you're wasting my time with... what? And you're telling me Congress passed it?"\n\n'All they need is your signature," said the Vice President calmly as he pointedly gazed at the pen in Nixon's hand, which had been somewhat irritatingly tapping against the table for the past few minutes. "The referendum is planned to be held next year.", he continued. Nixon dropped the bill back on his desk, taking some time to massage his temple. He just wanted a break. "And why exactly are we even considering this? We just gamble our hold in the Caribbean because of a few malcontents?"\n\nJohn did his best to keep his cool. He knew the President was completely unaware of how bad the situation had recently been in Guadeloupe and Martinique. How it was a foreign policy crisis in the making. Instead, as usual, he maintained a trained, composed smile. "Actually, the High Commissioner himself testified directly before Congress asking for some kind of concession to the locals..."\n\n"Isn't that incompetent buffoon the reason we're in this mess in the first place?" Letting out a resigned sigh, the President went to pick up his pen again, preparing to adorn the bill with his signature... but his hand stopped mid-track, as his eyes locked again on a small part of the text. The referendum's binding status agreement. An idea germinated in his mind. Some of the locals might not buy it, but a sham vote might help cool the tension for a little while, not forcing their hand to do anything about the result until they damn pleased. And if all else failed, he could always just send the marines."
 FWI_forpol.4.a: "The next day, the unsigned bill was returned to Congress."

 FWI_forpol.5.t: "Kill the Devil"
 FWI_forpol.5.desc: "The bar in Basse-Terre was unusually silent; a rare sight these days, even at this late hour, where the beachside drinking den was usually still animated by raucous discourse on independence and self-governance. No, tonight, the regular patrons had taken their protests to the front of the High Commissioner's residence, leaving the place solely occupied by its graying tenant Gaspard, with his old comrade René enjoying his usual nighttime rum in welcome serenity. A strong spirit that burned like hell and tasted even better.\n\n'Short-Fulbright Amendment Vetoed', the headline said. In an even more unusual occurrence for a man who prided himself on purposefully ignoring the news, deftly avoiding political prattle, old René had taken to reading the day's newspaper to further spice up this peaceful respite. 'Following Presidential objections, the renewed bill passes Congress with supermajority, with an agreement set on a non-binding referendum.' René kept reading aloud, in a slightly amused tone. 'That's what the boys were arguing about earlier, right? Before they left.' he asked. 'Hmm-hmm' acquiesced the old bartender, without raising his face from the glass he'd been cleaning.\n\n'I mean, I kind of get them. They must really take us for fools. Nothing ever changes, eh?' René threw a playful smile at his old fox of a companion, but wasn't offered any answer. Giving up, he turned his attention back to his glass, downing what remained in a single move, savoring every drop as his throat combusted from the fiery golden liquid. 'So... what happens if the Yankees refuse to leave?'\n\nWithout answering, Gaspard methodically removed the cloth from the now spotless glass to stuff it inside the half-full bottle of rum he'd been serving to his friend for the past hour. Then, he grabbed his lighter, and René's eyes widened for just a moment as the small flame danced ever closer to the liquor-ridden rag. Instead, he just lit himself a cigarette, not before addressing a brief wink to his dumbfounded peer."
 FWI_forpol.5.a: ""Another glass?""

 FWI_forpol.7.t: "Innocence Lost"
 FWI_forpol.7.desc: "Private Cain was a simple man. A young lad from Ohio, with a fresh face and a sweet smile, raised on his father's stories of the horrors of Sea Lion. When asked what he'd do with his god-given life, of course he'd answer that he would serve his country and help ensure nothing of the sort ever happened again.\n\nWhen he was finally enlisted in the US Marine Corps, he took to the vigorous training with the same determination that had driven him his entire life. He rose early, crawled in the mud and did what he was told, and none could deny that there was ever a more loyal recruit.\n\nWhen they assigned him to the Expeditionary Force, his eyes were beaming with pride. That was it. He had reached his goal, and would dutifully help defend the ideals of freedom and democracy across the globe, freeing the nations of the world from the encroaching fascist threat.\n\nWhen he learned that he was being sent to Martinique, he took it with the grace of a soldier. Though perhaps quite a far cry from what he'd imagined, he was never one for questioning orders. After all, the Antilles were still OFN territory, and he'd ward them with as much discipline as would be required to ensure it never fell into the Pakt's hands.\n\nWhen he instead found himself facing a crowd of protesters was when he first started to harbor doubts. Even then, he stood among his peers with trained stoicism, and followed suit when he was asked to raise his M16, though perhaps at a more hesitant pace than the others.\n\nIf the swarm of indignant cries for an "End to the Unlawful Occupation" and "Death to the American Oppressors" were slowly eroding at his faith, he tried his best not to show it, just as he ignored the shake in his hands as he obediently pointed the weapon at the faces shouting at him."
 FWI_forpol.7.a: "When he first pulled the trigger was when his whole world finally shattered."

 FWI_forpol.8.t: "The Heady Taste of USAID"
 FWI_forpol.8.desc: "In the office on the top floor of the brand-new 'Royal Martinique' in Fort-de-France, a Westinghouse air conditioner hummed-an unaffordable luxury for the locals, but a mere trifle for Arthur Banks. The owner of a mid-sized hotel chain with assets stretching from bungalows in Bahamas to the perennially tourist-packed 'San Juan Plaza' in Puerto Rico, he was contentedly balancing his quarterly books.\n\nThe massive modernization program launched by Washington had turned Martinique into a gold mine for American capital. Banks had purchased the land for this resort for next to nothing, paying with generous USAID federal grants. For the first few months, while the hotel sat idle, staff salaries were covered by stabilization funds. And now, a laughable 1.5% tax on tourism revenue made his net profit nearly indecent.\n\nArthur flicked his cigar ash and walked to the panoramic window. Across the street, workers were boarding up the windows of a bar. But nature abhors a vacuum: a banner was already draped across the facade announcing the imminent opening of a Whataburger's. Vultures from across the States were flocking to the Antilles, and indigenous small businesses were dying out by the block, giving way to sterile, franchised eateries.\n\nIndependent economic newspapers were already writing: when the Washington tap runs dry, these 'investments' will never pay off, and the region will be engulfed in a devastating debt crisis. Banks, however, couldn't care less. Even if this bubble burst, his 'San Juan Plaza' was booked solid for a year.\n\n"God bless America and Lyman Lemnitzer," Arthur smirked, pouring a splash of local rum into his glass. Let the idealists and bankrupts weep for tomorrow."
 FWI_forpol.8.a: "And Nassau is waiting for him."

 FWI_forpol.9.t: "CBS Evening News Special Report: The Antilles"
 FWI_forpol.9.desc: ""...And so the instructor said: the difference between an artilleryman and a diplomat is that the former hits the grid square first and apologizes for the miss later, while the latter manages to miss without even loading the gun," General Lyman Lemnitzer's baritone filled the television studio, prompting a restrained smile from Walter Cronkite.\n\n"Speaking of precise hits, General," Cronkite leaned forward. "The recent triumph in Iceland. Washington is jubilant. But what is the true, global significance of this victory?"\n\n"Strategic control over the North Atlantic is undeniable," Lemnitzer stated flatly. "But more importantly, it is a signal to the world. The Organization of Free Nations is not the Reich's Pact or Tokyo's Co-Prosperity Sphere, built on the bones of slaves and the bayonets of executioners. The OFN is a family of free democracies. And we are proving that belonging to this family means being under ironclad protection."\n\n"A family of free democracies..." Cronkite nodded. "General, many critics abroad - and here at home - ask: how does this rhetoric square with your own administration in the Antilles? You've built a stable economy, but some call your regime in Martinique and Guadeloupe a mere military governorship."\n\nLemnitzer's face remained inscrutable. "Walter, the status of these territories has been uncertain for decades. In a world where tyranny waits for our weakness, the United States must defend not only its shores, but the very foundation of democracy in the Caribbean. We have given the islands stability. And that is why, evaluating the work done, the President has made a final decision regarding the political future of the Antilles."\n\nA heavy silence hung in the studio - millions of Americans were glued to their screens, waiting for the verdict.""
 FWI_forpol.9.a: "Integration as a U.S. territory."
 FWI_forpol.9.b: ""Self-determination: We must respect the local choice.""

 FWI_forpol.10.t: "Sand, Sea and Stormclouds"
 FWI_forpol.10.desc: "The heat in Pointe-à-Pitre's Place de la Victoire was unbearable, but the crowd of thousands showed no sign of dispersing. Above a sea of straw hats, work shirts, and colorful scarves, the voice of Gerty Archimède thundered. The lifelong leader of the anti-American resistance was striking like lightning.\n\n"They call themselves the shield of democracy!" Gerty's voice rose to a scream, immediately drowned out by the roar of the crowd. "But whom do they protect besides their own wallets?! Look to the North! Iceland - a nation the Yanks thought was their pocket base - found the pride to tell Washington to 'get out'! And the occupiers tucked their tails! If Iceland could force them to retreat, why do we continue to endure their boot on our necks?!"\n\nArchimède struck the podium: "Enough! We will not let our islands be turned into a cheap casino! We will not be voiceless slaves like our brothers in Puerto Rico, breaking their backs for cents! Down with the exploiters! Down with the occupiers!"\n\nThe crowd of ordinary Guadaloupeans - dockers, fishermen, small traders - erupted in a thousand-voiced chant bordering on open riot. On the periphery, in the shade of sprawling palms, the objects of these curses watched the boiling sea of popular rage in silence. A platoon of American 'peacekeepers' in full gear leaned lazily against their jeeps, smoking. They didn't intervene. For now. But the Icelandic precedent had already done its work."
 FWI_forpol.10.a: "The myth of the unshakability of the American order has cracked."

 FWI_forpol.11.t: "A Guiding Hand"
 FWI_forpol.11.desc: "The shuffling of papers and dragging of chairs belied the importance of this moment. Paul Valentino put down his files, straightened his suit, and looked at the first meeting of the transitional cabinet of the United States Antilles. These were the people who were going to guide the islands and their people to the future and oversee the final push from American control to an independent confederation. And he was chosen to stand at the forefront of that process.\n\nIt was true that the people of Guadeloupe and Martinique hadn't chosen him. Valentino had been appointed by the American Commissioner, Lemnitzer, and the American Civil Administration continued to function for the duration of the transition period. But this was still the result of a fair referendum among the people of the islands, and as the cabinet meeting began, with members presenting their points, offering suggestions, and even arguing, Valentino could not help but feel immense pride to be the first native the US Antilles to be chairing a government meeting. They were doing it, without the Americans-\n\nA discussion on fishing rights between two of Guadeloupe's arrondissements was interrupted when the door to the cabinet room opened. Lyman Lemnitzer, the American Commissioner, stepped inside, accompanied by three more members of the American Civil Administration. The discussion froze instantly, and Valentino looked with trepidation at the uninvited guests. Surely, he thought, something was wrong. Perhaps there was a chaotic protest outside and the meeting needed to be adjourned. But Lemnitzer simply marched to the other side of the room, picked up an empty chair, and sat quietly. Valentino tried to return to the subject, but the ministers were looking to Lemnitzer, not him. The discussion could only continue when Lemnitzer, leaning back in his chair, smiled and said:"
 FWI_forpol.11.a: ""Please, continue where we've interrupted. Pretend I'm not here.""
 FWI_referendum_lost: "§RThe Referendum has ended and US influence within the Antilles is now unchallengeable once more.§!"

 FWI_forpol.12.t: "Gratuitous Gratitude"
 FWI_forpol.12.desc: "The assembly hall for the Antillean constituent assembly was lit up against the sunset, casting its glow over the crowd of distinguished dignitaries who had been invited to attend the independence ceremony of the Antillean Confederation. Outgoing head of the American Civil Administration, Lyman Lemnitzer, was the star of the show, glad-handing the Guadeloupean and Martinican notables and standing at the gates to welcome the American Secretary of State and discuss the development of the Antilles with him.\n\nAs the sun descended over the Caribbean, the doors to the assembly hall opened and the members of the new government of the Antillean Confederation stepped forth onto the porch, headed by incoming Prime Minister Paul Valentino. The attendees slowly quietened, before the newly-christened chief justice of the Confederation administered the oath of office.\n\nAfter solemnly swearing before God and the attendees to faithfully execute the office of Prime Minister, and to preserve, protect and defend the constitution and laws of the Confederation, the chief justice placed the sash of the new office upon Valentino's shoulders. The usually stern man smiled widely as Lemnitzer walked up to shake his hand, as fireworks began going off in the night sky.\n\nAfter the ceremony was over, and the chatter of men and women once more filled the air, Valentino made his way to the Secretary of State. "I wanted to thank you for coming here, sir. I am honored by your presence, as I have been for the help of the United States for securing our people's self-determination. I know how hard it is to be responsible for the foreign relations of a power such as the United States, and how thankless. But you have done the right thing here.""
 FWI_forpol.12.a: "At least this once."

 FWI_forpol.13.t: "Time to Get to Work"
 FWI_forpol.13.desc: "The people of the new Antillean Nation had spoken. Fort-de-France and Basse-Terre's streets were covered in blue banners and confetti, as its people celebrated the news that the center-right bloc behind Raymond Guilliod's PUG had won a majority.\n\nBack at PUG headquarters, which was raucous with celebration, Guilliod was quietly enjoying his party's victory with a healthy helping of cane liquor. He felt a deep satisfaction knowing that Gerty's wacko communists and Valentino's lily-livered establishment politicians had been knocked down. Yet he knew that the threats to the Antillean Confederation's future was still not down for the count. Realizing their total defeat through the transformation of Antilles's administration would be the culmination of his government's agenda.\n\nOne of Guilliod's managed to squeeze past the other celebrating party members and handed over a folder. "Here's the report you'd requested, Mr. Prime Minister." Guilliod silently opened it and began glazing over the report's contents. The papers inside summarized the PUG's plans to strengthen the Confederation through expanding the powers of the executive branch, the ultimate goal of which was the country's centralization and eventual transformation into a presidential republic. The strongmen in the region threatened his country, and the only way to save it was to become one himself.\n\nOnce again, the same assistant came hobbling over through the crowd. "Mr. Prime Minister, the American ambassador is on the phone! He wants to congratulate you on our victory". Guilliod realized he'd been blankly staring at the last page of the report for almost a quarter of an hour now. He smirked, quickly shook his head left and right, and then proceeded to take a swig of cane liquor."
 FWI_forpol.13.a: ""Tell him I'm busy!""

 FWI_forpol.14.t: "Monsieur le Président"
 FWI_forpol.14.desc: ""Another day, another victory," Guilliod chuckled to himself. The front page of the newspaper in his hands read "NEW CONSTITUTION RATIFIED: GUILLIOD ELECTED PRESIDENT". Many doubted this day would ever come, but then again, even fewer thought Guilliod's coalition would come to power in the first place.\n\nThe left would call him a dictator and the liberals would wring their hands over "creeping authoritarianism"; in the end, the Antillean people, the only group that mattered, voted in the PUG government's favor. The islands needed strong and decisive leadership if they were to beat back the sharks that surrounded them and pave the path towards a promising future, and that was precisely what Guilliod's reforms would achieve. By synthesizing the ideals of the 3rd Republic with an American-style executive branch, the Antillean Confederation's Presidential system would represent the best of both worlds.\n\nOne of the major aims of strengthening the executive through the new constitution was to overcome hurdles constructed by parliament, particularly as they related to new investment. Guilliod knew it was imperative that he facilitate the flow of capital and knowledge transfer to the islands if his country was to thrive, and he knew just how to get it. Guilliod ran his fingers across his rotary phone and called up his Finance Minister.\n\n"Bonjour Monsieur le Président, comment ça va?""
 FWI_forpol.14.a: "It was time to open up to the French exiles..."

 FWI_forpol.15.t: "Big Houses on Small Islands"
 FWI_forpol.15.desc: "As long as Jean remembered, there was always the big house. Its gabled roof sat snug on the white walls, elegant flower beds for feet. The windows were so fine too, but only the turning on and off of the lights could be noticed, lest he receive a blackjack in the back.\n\nHis dad remembered the same sight too, so did his dad, and his dad, and his own dad when he was brought off the boat and unshackled. All that's changed for Jean is the shackles were a bit longer, a bit looser, and the house got a new coat of white paint. In that respect, he was on the cutting edge of liberalization in the Antilles.\n\nOf course, no one told him anything: he wasn't someone, he couldn't even vote — his ballot went straight to the big house. Yet, he heard whispers, what others told each other. He'd hear French voices spill hints, arguing about whose turn it was to run, mentioning the same few families running the islands. Recently, he heard American voices, ordering people around like products.\n\nAmerica, that nation that fought fascism abroad, that leader of the free. Jean didn't know what it was to be free, just that he wasn't, nor was anyone he was close to. Maybe, if they had a war here, America would come. And do what? He never thought that far ahead, not wanting to think about it, not wanting to think they would just put the blackjack to his back as well.\n\nSo, he looked at that big house — so big it could be seen from Washington — and got back to work for them. Maybe, it would be different for his son. Probably not."
 FWI_forpol.15.a: "Big powers, big houses, and the little people in between."

 FWI_forpol.16.t: "The Island Party"
 FWI_forpol.16.desc: "RESTRICTED/[GetDateText]\n\nFROM THEODORE SHACKLEY\nMEMORANDUM FOR THE PRESIDENT\n\n1. Following the Parti Républicain's victory in the Antilles elections last year, our informants in Guadalupe and Martinique are reporting a shift in the party's activities. The PR attained the presidency through legal methods, and maintains the multi-party system that has shaped the Antillean Confederation since its independence. However, the party's agenda appears to be consolidating permanent executive and legislative authority through populist economic policies.\n\n2. There is proof of large-scale corruption within the PR's government aimed at keeping the party in power over the long term. Planters receive sinecures and handouts in exchange for support, and across the islands the Parti is constructing local political machines so that the party becomes a solid, unified force for future elections.\n\n3. Nevertheless, the Antilles' PR government strives to keep a friendly relationship with the US, leaving OFN-affiliated conglomerates and investments untouched at large and maintaining their security commitments in the Caribbean as a proof of goodwill toward Washington.\n\n4. While the PR is currently challenging Guadalupe and Martinique's democratic pillars, the party is still far from being a threat to the region's stability or US interests."
 FWI_forpol.16.a: "Fidelity, Bravery, Integrity."

 FWI_forpol.17.t: "A New Day in the US Antilles"
 FWI_forpol.17.desc: "The ocean breeze wafted through a nearby window as he listened to Valentino over the phone: "Thank you, Lyman."\n\n"You've noticed by now I'm not a difficult read, no?" former Commissioner Lemnizter said to his successor. "Congratulations are the least I can do, water under the bridge."\n\nLemnizter could sense Paul Valentino's eyebrow raising on the other line: "Must be a large bridge, knowing where you live."\n\n"I wouldn't put it past the Yanquis to try building one." Lemnizter rubbed his chin. "Always with the grand dreams."\n\n"I'd welcome it. Americans love a good work project." Valentino ought to know; his help with the Confederation plan did miracles for Martinique and Guadeloupe.\n\nLemnizter blinked: "Socialist Party means to continue the partnership?"\n\n"And with the referendum as well, they are not exclusive." Valentino and SP were emerging as the preeminent party. Opposition across the islands was coalescing around them.\n\nIt seemed Washington's ally in the Antilles was set to become something more: "And the U.S. military presence?""
 FWI_forpol.17.a: ""You've seen images of Colombia." Valentino replied. "Whatever else they are, they are our protectors.""

 FWI_forpol.18.t: "New Dealism in the Antilles"
 FWI_forpol.18.desc: "Paul Valentino stared out at the sandy shores of Guadeloupe from the balcony of his vacation house. He had been working nonstop for the past several months, and it was time to sit back and enjoy the beauty of the island's beaches for a change. The sun was shining, the tide was calm, the birds were singing, and his administration's reforms were beginning to bear fruit. Empowered unions and stronger labor regulations would improve the health and sense of self-esteem of Antillean workers. Massive works programs employed the Antillean Confederation's people to build resort and leisure infrastructure that would bring foreign tourists out from their dull, grey countries and their money into the nation's pockets. Affordable housing schemes ensured that what were once slums would be transformed into real neighborhoods whose residents would be proud to live in. Yeah, things were good, and they were going to get even better. At the same time, Valentino understood better than anyone that these ambitious initiatives were being made by taking out equally massive loans from the Americans, and that this debt wouldn't be easy to pay. His Antilles had been under U.S. administration just a few years ago, and finding financing for the projects needed to develop the country wasn't exactly easy to come by. This all weighed heavily on him. Sure, the Antillean Confederation needed to be sovereign, but those responsible for the islands had to be pragmatic. That's what radicals like Archimède and Césaire could never understand. Bah, forget it, Valentino thought to himself. He knew he did what was right for his country. The prime minister puffed his cigar, took a sip of his drink, and sighed with deep satisfaction."
 FWI_forpol.18.a: "Things are gonna work out just fine..."

 FWI_forpol.19.t: "Red Islands"
 FWI_forpol.19.desc: "The open streets of Fort-de-France were decked in red. Outside of polling stations, around bars and warehouses, and surrounding government buildings, the masses of the West Indies hoisted the fluttering crimson of peace, independence, and socialism.\n\nNewly-elected Prime Minister Gerty Archimède addressed the people with a poppy red ribbon on her proud chest, voice floating above cheers, clattering pots and pans, and beeping cars.\n\n"From this day and forevermore, we will heed not the slavemaster's whip nor the market's whim," she said, and her beaming smile looked almost shocked at the great chorus of applause. "Starting today, the Antilles belong to her people!"\n\nThe islands would be in frenzied movement for the entire week, moved by the thousand steps of the popular front, from the communist party to the progressives, parading for the slogans of decolonization and development. The roaring, strained chants for equality shook the marble and wood foundations of the plantations, from which opposition leaders called for resistance and non-collaboration.\n\nThe U.S consul closed the blinds of his office, having had enough of watching the old street sign outside thrown out and replaced by "Anti-imperialism St." The elections weren't even called yet, and still, here they were.\n\nAmerican expats watched from the concrete walls of the embassy, where they could still stand taller than the people. The masses saw and asked each other, slowly standing upright, "How much longer now?""
 FWI_forpol.19.a: "For once they could answer, "Not long, comrade. Not long at all.""

 FWI_forpol.20.t: "Paint It Red"
 FWI_forpol.20.desc: "CONFIDENTIAL/[?global.date.GetDateStringNoHourLong]\n\nFROM FBI DIRECTOR J.EDGAR HOOVER\nMEMORANDUM FOR THE PRESIDENT OF THE UNITED STATES\n\nSUBJECT: RECENT UNREST IN THE ANTILLEAN CONFEDERATION\n\n1. Despite ardent opposition, the pan-leftist government led by communist attorney Gerty Archimède has found early success in the implementation of its planned policies. Committed to a strong anti-colonialist platform, the rogue administration is vocally hostile to any perceived element of US influence, having severed all ties to the OFN that they consider as yet another extension of American imperialism.\n\n2. While proving highly popular in the island of Martinique, Guadeloupe's larger population remains more skeptical in its support of the reforms. In particular, the dispropriated landowners of the former plantocracy have shown unsurprising hostility to the new regime, with some of its members covertly spending the remainder of their wealth to support sabotage efforts across the confederation.\n\n3. The rising instability has led to an attempted putsch against the authorities in Guadeloupe, leading to the formation of a new temporary government by various opposition parties. The island remains the site of frequent clashes between socialist militias and mercenaries backed by the plantocracy. It is expected that an invasion force will be sent to Guadeloupe in the next few months to deal with the insurgency before it earns the chance to secure its position.\n\n4. This situation leaves us with a unique opportunity. If we act quickly, a platoon of US forces could be sent to Martinique to displace the Archimède government under the guise of restoring order, ensuring that the confederation returns under our sphere."
 FWI_forpol.20.a: "Fidelity, Bravery, Integrity."

 FWI_forpol.22.t: "Where The Heart Is"
 FWI_forpol.22.desc: "Through the car window, Lucette Michaux-Chevry silently observed the crowded streets that the vehicle was struggling to carve a path through. All around her, Pointe-à-Pitre's colorful alleys were filled to the brim with the cheers and chants of communist partisans and other sycophants of Archimède's clique.\n\nHer bodyguards had assured her that the black-tinted glass was absolutely impossible to see through from the outside; yet she kept a lingering fear that even one of them could gaze right back at her at any instant. She couldn't shake off her mind the reports on the fate that occurred to other party members unfortunate enough to get caught during their flight.\n\nYet with the road packed with people and parades, they had barely moved at all for the past hour, leaving her with no other occupation than gazing at the city that feasted on her collapsing government. So she kept her eyes on the world outside, peeking at a cheerful group of teenagers who had gathered around a hastily graffitied, grotesque depiction of Uncle Sam on a nearby wall, his head popping off the hole of a mock guillotine.\n\nAll her life, all she had done, she had done for her home. For Guadeloupe and the Antilles. That had been the single constant that had driven her entire career, even until that ill-attempted putsch. She loathed the Americans just as much as any of them; yet she had been the one to swallow her pride and pragmatically try to tend to a lasting partnership with them. Ensuring their help and investments would help the confederation thrive. A dream that was collapsing before her very eyes.\n\nAs the jam finally began to clear, the vehicle started moving again. Yet she couldn't take her eyes off another graffiti on the side. Her own face, under which a single word was carved in bright crimson red. A word that kept reappearing in her head long after they left."
 FWI_forpol.22.a: "'TRAITOR'"

 FWI_forpol.21.t: "The Right Thing"
 FWI_forpol.21.desc: "At barely 30, Lucette Michaux-Chevry had clawed her way to the council of her small town of Saint-Claude, becoming the youngest woman ever elected to the position. The following decade, Guadeloupe's so-called Iron Lady had come to be known amidst the islands' emerging political scene for her raw charisma, ruthless negotiating skills, and her unflinching resolve in her fight for her home, until her meteoric rise led her to the close ranks of Albrand's PR.\n\nWhen the confederation was finally ratified a year ago, it was a dream materialized: her long-held hope, to one day see the Antilles stand as an equal partner to the free nations of the West, just within grasp. Only for Archimède's goons to almost take all of that away.\n\nIn the street below, a grinning pair of US Marines was pushing a handcuffed man towards the back of a nearby jeep, where half a dozen more bruised guerrillas clad in scarlet scarves sat in silence. When the man refused to enter the vehicle, spitting at the face of one of his captors, she did her best to ignore the odd feeling in her gut as his insults turned to desperate pleas, squirming on the paved ground under the soldiers' blows. She averted her gaze, shaking away the growing guilt. She had done what was necessary.\n\nInstead, she watched the last of the red banners adorning the streets slowly being brought down to be replaced once more by the waving star of the confederation's flag. And right next to it floated just as brightly the one of the OFN, with its promise of renewed economic investment and opportunities that would finally allow the confederation to thrive, while on the ground laid piles upon piles of the discarded crimson standard of those that had proudly taken a stance against that prosperous future.\n\nYes. Despite her lingering doubts, she found some measure of comfort knowing that in the end, it was still a victory for her people."
 FWI_forpol.21.a: "...So why didn't it feel that way?"

 FWI_forpol.24.t: "A Guiding Hand"
 FWI_forpol.24.desc: "The building that once hosted the headquarters of the United States Antilles Civil Administration had been turned into a battleground; though perhaps of a slightly different kind than the one that had raged in the former French West Indies for the past three years. Instead of riot gear and Zhdanov cocktails, the battles here were waged with honeyed words, empty promises, fake grins, and firm handshakes.\n\nYet the stakes remained all the same.\n\nThe question of autonomy had gone from being debated in the streets to being confined to the walls of this improvised chamber, one floor below the High Commissioner's office, where delegates from the councils of Guadeloupe and Martinique were discussing the terms of their own upcoming independence.\n\nThe islands were to be granted self-rule, that had already been ratified; the matter that remained unsolved was the actual stretch of that very self-rule. And as always, none of the conversations happened outside of the ever-watchful eye of Uncle Sam.\n\nIt was an odd game. Whenever the councils negotiated among themselves, eager representatives from Washington would find a way to chime in on the conversation. Whenever asked for leeway in American control over the independence process, they would offer a sorry, but sympathetic smile as they reminded them of funny legal terms that made their request, understandably, far more complicated than it sounded.\n\nAt the end of the day, the delegates would come back home with their head filled with new juridical muddle that they'd never heard of, and without feeling any progress had been made toward their goal."
 FWI_forpol.24.a: "Your freedom, our terms."
 FWI_forpol.24.b: "The first step and certainly not the last."
 FWI_forpol.24.c: "An ember of France relit so far from home."

 FWI_forpol.25.t: "Homecoming"
 FWI_forpol.25.desc: "The last time General Lemnitzer had been in Washington, it was to sweet-talk half of Congress into agreeing to a scheme he himself half-believed in. Months of planning and preparation, of number-gathering, paper-inking, and repeating well-manicured words in front of his hotel room's mirror to ensure his arguments were as spotless as his smile. Today was different; all he had to do was listen.\n\nHis work had been finished as soon as he shook the President's hand in front of the cameras a few minutes ago. Now, he could just sit back and relax, sipping on a deftly grabbed glass of celebratory champagne as the President concluded the opening speech.\nAfter a few further quips on the ushering of a new era in American-Antillean relationship were received in thunderous applause by the almost completely white audience, the microphone was left in the hands of newly appointed leaders Victor Sablé and Médard Albrand.\n\nNot him, though, obviously. He hadn't been granted the honor to say a word for the entire ceremony. Not that he would have had anything to say. His years of efforts in the region had only been worth a few off-handed commendations earlier, of course omitting to mention the almost calamitous civil war that had narrowly been avoided. That was the extent of his importance, both here and there: being the awkward man in the middle.\n\nHe had just begun to notice how he had barely touched his glass for the past few minutes. Nor had he listened to much, honestly. More words on planned economic recovery programs for the now autonomous Antilles and US investment proposals just passed right by him in a blur as he kept on smiling. That was it. The epitome of his career had been to serve in a losing war on the hills of Britain, with the crowning finale of failing to hold the tiny pair of islands he was sent to oversee so they could get rid of him. He was nearing 68; he would never see another engagement. He would quietly retire by the end of the year, or they would force him to."
 FWI_forpol.25.a: "And that's all he would ever be remembered for."

 FWI_forpol.26.t: "Another Door Opens"
 FWI_forpol.26.desc: "The streets of Guadeloupe and Martinique had never, in their entire history, been as full of joy as they were on [?global.date.GetDateStringNoHourLong].\n\nFireworks had started being set off the moment the last of the American boats had set off in the early hours of the morning. For nearly half a week, the two islands were engulfed in a wave of celebrations; drinks were drank, parades were held, and tears were shed. For the first time in centuries, they had no foreign powers dictating their lives, neither French nor American. The two islands were finally free to choose their own destinies, independent from one another.\n\nOf course, those native to the islands were not the only ones celebrating the newfound independence. As American boots finally drudged themselves away from the islands, sleek new shoes were quickly moving in to replace them. All across the world, people were noticing yet another potential chink in Uncle Sam's armor.\n\nLocal power networks would soon begin to shift. As the loud, bossy Americans began to leave, their vacuums would soon start to be filled by men from Madrid or Mexico City, offering friendship and solidarity. The situation on the islands had been blown right open - it was just a matter of who would step in to take advantage."
 FWI_forpol.26.a: "One domino at a time."

 FWI_forpol.27.t: "A Bitter Past"
 FWI_forpol.27.desc: "Alphonse Dupré's fingers had long rubbed raw from handling sugarcane stalks. Sweet dust clung to his skin like it was seeping out from his blood. In the corner of the warehouse, a battered shortwave radio crackled with election results from Basse-Terre. Alphonse found himself listening to the tallies as he worked, hoping vainly for some sign of change. His spirits fell as the radio whined onward, minute after minute. Médard Albrand's coalition was sweeping the elections, a marker that things in Guadeloupe would remain stuck in the muck for at least three more years. The same names, the old Béké dynasties, rolled off the announcer's tongue, an echo from the poor youth of Alphonse's grandfather, and great grandfather. It was the obvious result. The one that all those who had let themselves be spurned by hope before expected. Still, Alphonse couldn't help but slump at his counter, his fingers falling away from the press.\n\nMadeleine, one of Alphonse's few friends, perched on a crate of molasses, exhaled smoke into the heavy air. "So that's it. They'll never put down their whips. They'll work us and our children all to death. The Americans will booze themselves into the grave." The grimy woman let out an angry laugh.\n\nBeyond the warehouse walls, the harbor glimmered under muted lamps as freighters waited to haul their cargo north to hungry American mouths. Somewhere, an Iberian trade representative had begun drafting another contract. In Washington, a clerk ticked another box labelled "SUPPLY CHAIN STABLE." The island of Guadeloupe settled into a familiar routine: harvest, transport, obey.\n\nListening to the new president drone on about a renewed parliament to lead the island into a new era, Madeleine roughly stubbed out her cigarette, and glanced into the darkness beyond the scratched window. "You ever think it'll change?" Outside, Alphonse could hear rows of sugarcane rustling in the warm night breeze."
 FWI_forpol.27.a: "As the radio crackled off, the woman waited for a response that would never come."

 FWI_forpol.28.t: "The Taste of Change"
 FWI_forpol.28.desc: "The streets of Basse-Terre buzzed under the heavy Caribbean sun as radios roared out with the unbelievable. Against all forecasts, the entrenched Albrand coalition had fallen in the most recent election. In its place, the fiery populist leader Raymond Guilliod surged into first place, triumphing in the polls with his tantalizing offer of change to a desperate population. His program, which he delivered in a series of fervent addresses across the island, promised national reform and an end to corruption, state-building, and the reduction of foreign control. In the streets, the crowds gathered in the capital's central marketplace were beginning impromptu celebrations, with supporters quickly overwhelming the limited police force.\n\nIn his packed campaign office, Raymond Guilliod leaned over his desk, blissfully unaware of the pandemonium his victory was provoking outside. Sweat dripped onto maps of the island's neglected roads and ports. Steeling his resolve, the man moved to the dingy microphone in the room and signalled to an aide to begin his broadcast. It was time to address the hungry nation.\n\n"People of Guadeloupe, we have heard your voice!" Raymond thundered into the radio, speaking to it as though it was a roaring crowd of hundreds. "I promise you this: this election is no empty promise! No more of the same. It is time for the people of this island to own the land we work on. It is time to build our nation, not strip it for parts to sell overseas. My people, now is the time for hope. Our journey has only just begun." Around him, his aides exchanged nervous glances, fearful that success had not seemed to curb the man's radicalism. Despite the coming American backlash, though, a sense of hope had filled the room.\n\nOutside, an uproar emerged among the crowds of the capital in response to the broadcast. People began chanting Guilliod's name, pushing against the stalls of the market in a frenzy.\n\nAcross the sea, the atmosphere was somber. Iberian and Mexican diplomats wrote tense telegrams discussing the development. In Washington, a clerk underlined a single phrase in red ink: "potentially hostile executive." The island had begun to shift."
 FWI_forpol.28.a: "The sweaty demand their sugar."

 FWI_forpol.29.t: "Tying the Knots"
 FWI_forpol.29.desc: "The grandeur of the Organization of Free Nation's central assembly hall in New York was pierced only by the echoing of footsteps as President Albrand and his delegation approached the elaborate dais under the gaze of hundreds of eyes. The Guadeloupean flag, hastily stitched and still stiff, hung beside the stars-and-stripes and the shimmering blue OFN banner that dominated the wall and ceiling in the back of the hall.\n\nAn OFN commissioner stepped forward, offering a handshake to the President. "On this day, the Organization of Free Nations formally welcomes Guadeloupe into its alliance. May our partnership help safeguard freedom and prosperity in the world."\n\nFinally dropping the handshake, the gray-haired former president stepped forward and addressed the assembly. "Honorable representatives of the OFN, Guadeloupe extends a warm thanks to all who have offered aid to our new nation and sent congratulations following our recent election. We look forward to strengthening our ties with all free nations of the world. Despite our small size, it is my firm hope that you will all soon see Guadeloupe as your equals in the fight for freedom."\n\nAt the back, a junior delegate from the United States murmured to the man next to him. "Equals?"\n\nA thin smile answered. "Equal enough that they'll keep the ships humming along. That's what matters."\n\nThe signatures were penned, the cameras flashed, and reserved applause rose from most in the hall. Beyond the high windows, a light rain traced silver streaks against the skyline. The Caribbean's newest OFN partner had just accepted its place in the bulwark."
 FWI_forpol.29.a: "Wars are won by small victories."

 FWI_forpol.30.t: "Fair-Weather Friends"
 FWI_forpol.30.desc: ""So... are we really doing this?" There was an uncomfortable tension in the corridor. Politely waiting in front of the desk upon which stood the deal, the representative from the United Mexican States anxiously shifted from one side of the chair to the other as the two of them had stepped outside to ponder a little more.\n\n"Again: a temporary partnership. Nothing more. One born out of shared interests and common foes.", she dismissed with a hand wave. In truth, Gerty Archimède felt just as unsure as her foreign minister. Yes, it was an odd choice of partner, and most definitely a far cry from their own platform of revolutionary anti-colonialism; but the Mexicans remained aligned with their aims of eroding the American sphere. Still, neither of them could shake away the feeling that they were just about to replace one master with another.\n\n"The boys aren't going to buy that, and you know it very well", he concluded, before entering the room again. "I... just hope you're making the right choice." Despite barely months ago, it felt like an eternity since they had torn the broken left away from Valentino's sinking ship. Allying themselves with the reformist cowards of the PS had already felt like a small betrayal; and she, too, feared that they were already brewing a second one.\n\nYet, however loudly they had cheered after the coalition led by their own party had won last year's election, and however high the poppy banners now floated along the streets of Basse-Terre in scarlet defiance against American hegemony; the truth was, Guadeloupe was small. And alone. They needed allies; and anything was better than the Yankees, right?\n\n"I hope so too," were the words she wished she could have answered before the pen had finished inking the paper, prompting an eager smile from the Mexican envoy who stood up to shake their hands."
 FWI_forpol.30.a: "Welcome to the Pact of Veracruz."

 FWI_forpol.31.t: "Une Tempête"
 FWI_forpol.31.desc: "Mirroring the streets of Fort-De-France, across which newly erected red banners flowed over the singing crowds, the headquarters of the Parti Progressiste Martiniquais were abuzz with raucous cheers and chants after the election results had slowly unraveled.\n\nOn Aimé Césaire's desk, a newspaper whose headline confirmed the sweeping victory achieved by the socialist coalition. And not only had it propelled itself at the head of the newly sovereign island, but it had done so in a way that entrenched it with a certain majority in Martinique's legislative council, smothering any hope for Sablé's liberal bloc and other US-backed opposition groups to block their incoming radical reforms.\n\nYet, a noticeable absent from the ongoing festivities was the man himself. Despite the best efforts of his party's co-members, he remained stuck in his room, lost in thought, reluctant to partake in the celebrations or even share their enthusiasm about their landslide success. In fact, he struggled to consider it a victory at all.\n\nVictory would come when the people of Martinique would be finally freed from any trace of the American grip, followed by the rest of their comrades scattered across the Antilles and the West Indies. It went even further than that; victory would come when black consciousness had finally taken root in all the African diaspora. And not just them; when each and every individual now suffering under colonial yoke all across the world would be freed from their chains. When the future that had been stolen from them would be taken back by grasping at their masters' throats.\n\nNo, it was no victory at all; not yet, at any rate. For their tiny home of Martinique to become this shining red beacon against imperialism, they would have to wait longer still. Play nice with the Yankees. Share their pretty smiles and shake their hands while hiding the daggers behind their back. So for now, all he could do was bide his time..."
 FWI_forpol.31.a: "...and hope it was only the calm before the coming storm."

 FWI_forpol.32.t: "An Address to Friends"
 FWI_forpol.32.desc: "Across Martinique, thousands were huddled around radios and the occasional television. Through commentator description or live feed, all were fixed upon the same spot, all at the gates of Martinique Prefecture Hotel. It was thronged with jostling journalists and waiting watchers, all trying to get a preferential view of the speaker's microphone. None watched more intently than those at the embassies, every official watching or listening above piles of assessments attempting to predict the future.\n\nVictor Sablé. Who was he? What was he? Who were his friends?\n\nRadio journalists spoke quickly into their microphones as Sablé approached the gates that swung open to meet him, a cheer from some of those watching beckoning him to the set up microphones. His mirth was evident; he grinned into the TV cameras and smiled at the audience. "Ladies and Gentleman," he began, "I come to tell you today about our future."\n\n"I want to thank every person who placed their faith in the Parti Républicain. I swear to you all that Martinique shall not become a small nation dominated by despots obeying foreign whims. My vision, to share with you all, is a Martinique where all are truly free. Where the government and the economy work hand in hand and our affairs are discussed openly through the assembly, not in some shady backroom. Where all classes come together, realizing that regardless of condition or status; we are all of Martinique." He paused, cameras flashing around him.\n\n"To my friends that support me in this mission, to our OFN friends that helped us to come this far, I say thank you. To those who wish to bend me against the interests of my national family, I say I shall stand against you. To those who have placed their well-being, the well-being of their family and the well-being of their future in me, I say that I will give all that I can for you.""
 FWI_forpol.32.a: "Quotations colored reports from Washington to Madrid, with very different descriptions"

 FWI_forpol.33.t: "Robinel Victorious in Martinique"
 FWI_forpol.33.desc: "From beneath a broad tent erected in La Savane park, Tertulien Robinel, head of the Socialist Federation of Martinique, addressed a sea of umbrellas in the pattering rain. "The Civil Administration has passed. And I am proud that you, the people of Martinique, have chosen myself and the FSM, to lead you through these first, critical years of independence. Today, you have chosen a new future for Martinique - one of rapid and thorough reform. Social, economic, political. One where the people own the farms and the factories where they labor, and where the fruits of that labor belongs to them."\n\nOut of the corner of his eye, he could see the U.S. ambassador squirming in the front row of folding chairs, flanked by his rather-more pleased Mexican counterpart and a stone-faced Iberian.\n\nBut this speech was not for them. He looked out at the crowd, at all the exuberant faces of Fort-de-France. From humble workers, who had trusted his steady promises over the wild revolution offered by the PPM, to sharply-dressed bureaucrats and professionals, who defected from the hithero dominant Parti Républicain, Robinel sought the words to unite them all.\n\n"To Martinique! May her prosperity grow as green and as open as La Savane!"
 FWI_forpol.33.a: "In Martinique, the middle-of-the-road is on the left."
 
 FWI_forpol.34.t: "Martinique Joins the OFN"
 FWI_forpol.34.desc: "Tertulien Robinel strode through the doors of the OFN headquarters, shrugging off his heavy coat to the waiting doorman with a smile. New York... New York was cold. Cold for a man from Martinique. Wall Street colder still to a socialist who had nationalized vast swathes of an island economy, and taxed what remained in private hands to fund his development program.\n\nIn here though... everything was warm. Each hand proffered to him, most pudgy and white, heated his frigid black fingers. Smiles and nods from the host of diplomats congratulating Robinel on his second term, on the solidification of Martinique's democracy.\n\nHe imagined that the toasts, the toasts welcoming his island nation would be with champagne. But after all the years spent waiting, calling, writing, and cajoling to show that Martinique was indeed worthy of being part of the Organization of Free Nations, Robinel felt comfortable, entitled even, to approach a suited member of the building's staff, put on an easy smile, and say,\n\n"One mulled wine, please.""
 FWI_forpol.34.a: "The warmth of community."
 
 FWI_forpol.35.t: "A New French Indies"
 FWI_forpol.35.desc: "Excerpt from a recent translation exercise from a university level French course:\n\n'A peculiar coalition of Francophiles, liberals, reactionaries, and landowners has taken power in Martinique under the UPM led by Edmond Valcin. The new government has begun to attempt to restructure their movement into a proper party, though they have replaced many public servants in their attempts to do so, further destabilizing their rule. Backed by Iberia, the new Martinique is by far the strangest of the bloc's allies, the island nation being nominally progressive and democratic. So far though, they have managed to resist collapse and are embracing themselves as a unique gem in the crown of the Caribbean. What is left of Free France has taken an immense interest in the island nation and the two have reportedly been having talks for quite some time. What the future of Martinique looks like is anyone's guess, but it certainly worth keeping an eye on.'\n\n'France is alive, somewhere at least.'"
 FWI_forpol.35.a: "Where is our professor getting news from Martinique?"

 FWI_forpol.36.t: "The Chain Snaps"
 FWI_forpol.36.desc: "Guilliod stood at the open shutters of the old governor's hall, staring at the harbor below. The sunset washed the water in gold, casting the freighters, heavy with sugar and rum bound for America, in brilliant light. His brain was buzzing from the speech he had just delivered, demanding sovereignty for the nation of Guadeloupe and formally dissolving the defensive pacts binding the island to the United States. With the people's support confirmed in last year's election and his growing power in the executive, he was more certain than ever that it was time to chart a new course for the nation.\n\nA knock at the door. His foreign minister slipped inside, face drawn tight. "The Americans are furious. The Iberians..." He hesitated. "They're interested. One of their envoys has arrived downstairs. The French have also sent a telegram. It seems your declaration has caught their attention."\n\nGuilliod turned back to the window, letting the humid air press against the satisfaction etched on his face. "Let them sweat for a moment. It's good to let our former masters pace." He poured himself a measure of cane liquor and downed it in a single swallow. After a few minutes, he finally turned back and opened the door to the lower floor. It was time to reap the benefits of Guadeloupe's independence."
 FWI_forpol.36.a: "Guadeloupe will fly."


 ### FWI News Events
 FWI_news.1.t: "[Get_newspaper_header]Antillean Confederation Declares Independence"
 FWI_news.1.desc: "Martinique and Guadeloupe are rocked by red parades today, as newly-elected Prime Minister Gerty Archimède announced the Antillean Confederation's independence. This marks the end of years of U.S occupation, and centuries of colonialism, and the beginning of a new page in the difficult history of the West Indies.\n\nWashington has issued a muted response, expressing concern for the safety of American citizens and Archimède's political opponents in the islands. Tense popular demonstrations have surrounded the U.S embassy, but as international congratulations flow in, the people seem more concerned with cheering the new government's slogan of development, decolonization, and equality.\n"
 FWI_news.1.a: "We didn't need them, anyway."
 FWI_news.1.b: "Irrelevant Bolshevists."
 FWI_news.1.c: "Solidarity, comrades!"
 FWI_news.1.d: "A small blow to U.S hegemony..."

 FWI_news.2.t: "[Get_newspaper_header]Antillean Confederation Declares Independence"
 FWI_news.2.desc: "Martinique and Guadeloupe are rocked by parades today, as newly re-elected Prime Minister Paul Valentino announced the Antillean Confederation's independence. This marks the end of years of U.S. governance over the Islands, and the beginning of a new page in the difficult history of the West Indies. Valentino's government was quick to reaffirm the Confederation's special relationship with the United States, as the newly independent islands continue to rely heavily on the Americans for defense.\n\nWashington welcomed the announcement, as while they may no longer run the Antilles directly, the U.S. can rest assured knowing its influence over Caribbean affairs will remain largely intact, now without the burdens of responsibility over the islands' administration.\n"
 FWI_news.2.a: "Good for them."
 FWI_news.2.b: "To a new day!"
 FWI_news.2.c: "Independence at last, but is it just an illusion?"
 FWI_news.2.d: "Whatever."

 FWI_news.3.t: "[Get_newspaper_header]Antillean Confederation Gains Independence from the United States"
 FWI_news.3.desc: "President Paul Valentino of the Antillean Confederation has announced in an address that the islands, long under the rule of the United States, have "joined the free nations of the world." Head of the Parti Républicain (PR), Paul Valentino has led the party to stunning victory in the islands of Martinique and Guadeloupe.\n\nWhile still firmly tied to the US, the Antillean Confederation has now reaped the benefits from its new integration into the world market, a long held promise by the PR. Along with free trade, the PR has promised to build up the institutions of the islands, while creating an inter-class political base for the party.\n\nWith the immense success in the recent elections, the PR may be in charge of the Antilles Confederation for years to come, with some leftist critics calling the nation a one party state.\n"
 FWI_news.3.a: "I have a timeshare there!"

 FWI_news.4.t: "[Get_newspaper_header]Antillean Confederation Declares Independence from United States"
 FWI_news.4.desc: "This morning, hundreds of thousands of Antilleans woke up to their new president, Raymond Guilliod of the Parti Unifié Guadeloupéen (PUG) party. As a new dawn shines over the now independent Antillean Confederation, Guilliod seeks to move away from American influence.\n\nDuring his campaign, Guilliod has emphasized heavy-handed policies to promote a new French Antillean identity along with grassroots national development outside of America's sphere. Notably, Guilliod has pushed for Creole education within its schools and encouraged tourism of Creole and French heritage sites.\n\nThe world—especially America—looks at the new nation with anticipation. Although another batch of maps has been made obsolete, a new one is being etched within the hearts and souls of Antilleans.\n"
 FWI_news.4.a: "We will respect their choice as long as they respect us."

 FWI_news.5.t: "[Get_newspaper_header]Guadeloupe Declares Independence From United States"
 FWI_news.5.desc: "Shock waves reverberated in the waters of the Caribbean today as the small island nation of Guadeloupe officially declared independence from its protector, the United States, loosening long-term economic and political ties. Prime Minister Médard Albrand, who has long dominated the island's politics, pledged to carry forward the democratic traditions of the exiled French Republic as Guadeloupe enters the world stage as a sovereign nation.\n\nDespite the surprise of the announcement, analysts report that the ruling coalition is still firmly in control of the political apparatus in the country, and that sugar and rum exports to the United States are not likely to decrease. For many on the island, doubt remains on whether this declaration will bring about any lasting changes.\n"
 FWI_news.5.a: "We wish them luck."

 FWI_news.6.t: "[Get_newspaper_header]Guadeloupe Severs Ties with the United States"
 FWI_news.6.desc: "Shock travelled north across the Caribbean today as the island of Guadeloupe officially declared independence, severing decades-long ties between the United States and the island's French plantation owners. The announcement came under the auspices of the newly victorious Parti d'Unité Gaulliste (PUG), a populist conservative movement led by the fiery Raymond Guilliod.\n\nIn his address, Guilliod pledged to expand domestic ownership of industry, build a strong state apparatus, and pursue an independent foreign policy. Analysts in the region note that Guilliod's multi-ethnic backing reflects the island's growing shift towards self-determination and racial liberation, trends mirrored closely across the Caribbean. Though Washington expressed "measured concern," Guilliod's speech offered continued trade with the United States if "significant rebalancing" was involved. The president concluded his address by declaring a new era for Guadeloupean sovereignty.\n"
 FWI_news.6.a: "We wish them luck — they'll need it!"

 FWI_news.7.t: "[Get_newspaper_header]Martinique Independent"
 FWI_news.7.desc: "In the aftermath of the historic referendum taken in the former US Administration of the Antilles, and the subsequent dissolution of the Civil Administration, the island-nation of Martinique has inaugurated its independence with its first ever election. Now under the bold rule of the charismatic socialist Aimé Césaire, the island has both nominally and practically separated from the United States and former master France, and faces an uncertain future isolated in the region.\n\nInternational observers, initially predicting a win for opposition leader Victor Sablé and a smooth reintegration into the OFN, now note Césaire's strong socialist stance and opposition to most American prerequisites to aid. Attempts to draft a treaty of friendship with the US have failed in the Conseil Général, and it is unlikely that the experiment will be revived. Martinique will march a lonely road ahead, separated from the rest of its peers in the Caribbean protected under the long shadow of Washington.\n" 
 FWI_news.7.a: "Bold move for a little island."

 FWI_news.9.t: "[Get_newspaper_header]Martinique Independent"
 FWI_news.9.desc: "In the aftermath of the historic referendum taken in the former US Administration of the Antilles, and the subsequent dissolution of the Civil Administration, the island-nation of Martinique has inaugurated its independence with its first ever election. Now under the control of the liberal candidate Victor Sablé, the island has nominally separated from both the United States and France, though retaining extremely strong American ties.\n\nInternational observers had predicted Sablé's victory even before polls began, noting his platform of liberal developmentalism built on much the same grounds as the American Democratic party. The island has acceded to the OFN, and will likely soon host a small military delegation. Though some decry foreign influence, Sablé's programme of national development funded through foreign aid and development of institutions remains popular and grants his party a blank cheque to lead the country through its tenuous first years of independence.\n"
 FWI_news.9.a: "...Status quo ante bellum?"

 FWI_news.10.t: "[Get_newspaper_header]Martinique Independent"
 FWI_news.10.desc: "In the aftermath of the historic referendum taken in the former US Administration of the Antilles, and the subsequent dissolution of the Civil Administration, the island-nation of Martinique has inaugurated its independence with its first ever election. Now under the control of the reformist socialist Tertulien Robinel, the island has nominally separated from both the United States and France, though retaining considerable American ties.\n\nInternational observers, initially predicting a win for opposition leader Victor Sablé and a smooth reintegration into the OFN, now note Robinel's moderate ideological approach and well-negotiated nationalisation of former American assets. Though opting not to fully join the OFN, the new government is touted by some as a demonstration of American state-building, remaining ideologically independent from the former administrator. More cynical publications note the strong influence of New Dealers and requests already made for financial aid.\n"
 FWI_news.10.a: "Only time will tell if this was a good choice."

 FWI_news.8.t: "[Get_newspaper_header]The People's Republic of Martinique"
 FWI_news.8.desc: "The overwhelming electoral victory of Aimé Césaire in the recent national elections for the island-nation of Martinique have resulted in the complete socialisation of the nation. Immediately after the swearing in of new deputies and officials, Césaire has proclaimed the formation of the 'People's Republic' of Martinique, backed by a new constitution officially affirming the country as a one-party socialist democratic republic.\n\nInternational response has been muted, with unofficial sources from Washington suspecting electoral fraud and foreign interference from unnamed countries. Regardless of this, the new nation's outsized place as a Caribbean hub for Francophone leftism will undoubtedly send ripples throughout the region, and reports of labour organisation and student activism in nearby countries have already begun to sprout up.\n" #Adding \n just in case here as many of the others needed it
 FWI_news.8.a: "Uncle Sam must be fuming..."

 #FWI Referendum Proxy Events
 FWI_proxy.2.t: "Solèy Kouché, Malè Pa Ka Kouché"
 FWI_proxy.2.desc: "CONFIDENTIAL/[?global.date.GetDateStringNoHourLong]\n\nFROM FBI DIRECTOR J.EDGAR HOOVER\nMEMORANDUM FOR THE PRESIDENT OF THE UNITED STATES\n\nSUBJECT: UPCOMING REFERENDUM FOR AUTONOMY OF FORMER FRENCH WEST INDIES\n\n1. Political activity in the islands has reached an all-time high in the months leading up to the vote, with notable spikes of protests in the population centers of Guadeloupe and Martinique. In spite of this, the local administrator, High Commissioner Lyman Lemnitzer, has reasonably managed to maintain order as of the time of writing.\n\n2. Radical anti-US sentiment is rampant among the islanders, but not unanimous, leading to regular clashes between pro-independence and anti-independence groups. These advocates for continued American presence might prove to be a useful playcard in swaying public opinion for the impending ballot.\n\n3. Our control over the civil administration allows us a high degree of freedom in the potential for covert action to steer the vote's result in our favor. Even in the case of an unfavorable outcome, the referendum's non-binding status means the situation generally remains of medium to low concern.\n\n4. However, high levels of foreign influence is to be expected. Meddling from countries in the Mexican sphere of influence, and competing interests from European powers like Iberia might express a shift in the voter base, and should still be approached with caution."
 FWI_proxy.2.a: "Fidelity, Bravery, Integrity."

 FWI_proxy.3.t: "Report on the French Antilles Referendum"
 FWI_proxy.3.desc: "DIRECCIÓN FEDERAL DE SEGURIDAD\nISSUE: U.S-organized referendum will decide the fate of the French Antilles.\n\nWeeks of civil unrest have rocked Guadeloupe and Martinique, as the population expresses their grievances against the American occupation. The French Antilles have been under U.S "protection" since the Second World War, languishing in mediocre economic waters for years. It seems the recent tension has finally forced Washington's hand, and the population expects the upcoming referendum to bring decisive change.\n\nThere are two choices for the soon-to-be independent Antilles. The U.S favors a federation to keep Martinique and Guadeloupe united, retaining most of the structure of the existing American administration, ensuring their continued influence. Alternatively, the islands may vote to part ways as their own polities.\n\nMexico will put diplomatic and material support behind the democratic drive of the people of the Antilles, as they strive to achieve full independence. The anti-federationists represent the opposition to an American-orchestrated, artificial union. Backing them not only strengthens regional autonomy, but will provide Mexico with new economic and political associates, particularly in Martinique.\n\nVery Respectfully,\nRegional Director of Security\nColonel Emilio Torres."
 FWI_proxy.3.a: "Speeding along this Antillean divorce."

 FWI_proxy.4.t: "Iberia to the Antilles"
 FWI_proxy.4.desc: "CONFIDENTIAL\n\nTO THE AMBASSADOR TO THE UNITED STATES\n\nFRENCH ANTILLES - MARTINIQUE AND GUADELOUPE, UNDER U.S OCCUPATION\n\nA fresh opportunity to advance Iberian interests in the Caribbean presents itself with the incoming referendum on the status of the French Antilles. After recent civil unrest stemming from years of economic woe and frustration with the American occupation, the fate of the islands rests on the ballot box. Martinique and Guadeloupe will either become a federation beholden to American interests, or split into independent states.\n\nThe ambassador should notify the union government that limited resources should be put behind the anti-federationist campaign. The failure of Washington's federation scheme would break its hold over the islands' future and free them for Iberian investment. Adrift, the new power structures post-independence will also seek realignment. They'll find Iberia's arms wide open.\n\nSupporting the anti-federationists in Martinique and Guadeloupe is the foremost priority for the Iberian government in the Caribbean."
 FWI_proxy.4.a: "We want a drink from America's watering hole."

 FWI_proxy.5.t: "Meet the New Antilles"
 FWI_proxy.5.desc: "Twelve hours after the referendum, the streets of Guadeloupe and Martinique were mostly quiet. The rising sun greeted the posters and flyers which have dominated the streets of Basse-Terre and of Fort-de-France, now left for the street sweepers and the annals of history. The people of the United States Antilles began filling the streets and going about their day as usual. The referendum came and went, not leaving much of a trace on the people's daily lives.\n\nTwenty-four hours after the referendum, Commissioner Lyman Lemnitzer took to the airwaves, commending the people for fulfilling their democratic right and duty, and thanking them for believing in the future of the confederation. Lemnitzer reiterated that many of the institutions of the current Civil Administration will be retained, in order to speed up the transition to independence and a semi-presidential system.\n\nTwo days after the referendum, A group of three middle-aged men sitting in a cafe in Pointe-à-Pitre discussed their island's future. Two of them had voted for the confederation and the third against, but the debate was cordial enough. Things were looking up, the two supporters of the confederation said, and there was no point in rocking the boat. The third man wasn't convinced, but he couldn't convince them otherwise, either.\n\nFive days after the referendum, a young man was hauled before the local court for having attempted to torch a police car in Le Lamentin. When questioned, he said he was acting in protest against the colonial authorities and of the confederation scheme, which, he claimed, "would only let the Americans press the boot on us more efficiently". He was sentenced to two months in the local prison, joining his companions who had been imprisoned before the referendum took place."
 FWI_proxy.5.a: "...same as the old Antilles."

 FWI_proxy.6.t: "A Civil Departure"
 FWI_proxy.6.desc: "The headquarters of the United States Antilles Civil Administration was abuzz with frantic activity as the results of the recent referendum came in. In an unexpected setback to commissioner Lyman Lemnitzer's plans for the path of the islands towards independence, voters had rejected the Confederation scheme he had proposed. Now, the administration was put into a tailspin, having to rejigger its schedule and tie down the torn-up loose ends created by the result.\n\nThe first step in this process was currently taking place in Lemnitzer's office. The sleepless commissioner was receiving delegates from the island councils of Guadeloupe and Martinique, who had come to deliver almost identical resolutions - both islands would move to seek self-government as sovereign polities. Mustering his diplomatic skill, Lemnitzer smiled, shook hands, and then smiled once more for the cameras and proclaimed something about how "The United States of America remains a steadfast guarantor of democratic rights and the right to self-determination". But he couldn't help but feel defeated.\n\nWith the failure of his plan, Lemnitzer knew his services would not be required here very soon. He had come to enjoy his job, but he was more worried about the ability of the islands to establish stable, cordial systems of government without America's - his - backing. The Caribbean was a geopolitical battleground, and small nations tended to get swept up in the storm.\n\nAs the representatives of the two islands left, Lemnitzer sat down, alone and exhausted. The two large files were now sitting on his desk, waiting for him to deliver them to D.C. He almost wanted to refuse. To keep the files here, maintain a strong hand, and help the people of these islands achieve their independence with the help of America's guiding hand. But he knew it couldn't be done. He had asked the people what they wanted, and they wanted him out. He wasn't in control anymore."
 FWI_proxy.6.a: "And soon, Congress would ratify that fact." #USA
 FWI_proxy.6.b: "The Caribbean grows a little choppier. And that suits us just fine." #IBR
 FWI_proxy.6.c: "Another blow dealt to imperialism. A small step for sovereignty in our hemisphere." #MEX
 
 FWI_proxy.8.t: "Sing Me A Song, Oh Pianoman"
 FWI_proxy.8.desc: "The horizon began to turn a vague shade of orange, tinged with the blue still pervading, and with his eyes turned towards it, Salvador Gallástegui left work. It was a slight liberty, of course, he was heading out early. But he had already fulfilled what Mexico had really wanted that day - a few statements welcoming Martiniquan and Guadelopean independence, a few photoshoots with nationalist politicians, a meeting discussing potential issues that might split them diplomatically. He could have ten minutes to himself.\n\nTaking a moment, he strolled across the waterfront of the Canal Levessoir, looking out towards the waves. Distant, exuberant crowds talked among themselves, talking excitedly about the future. Those who had opposed it, of course, wouldn't be out. He took a brief look at the American embassy, lights still on but lacking movement at the front beyond one intern. Clearly, his efforts at supporting Antillean independence had paid off, and it was only his low ranking that stopped the contingency meeting from taking place.\n\nThere were a few hours where the result looked a little narrower, and where the United States mulled emphasizing that it was a nonbinding referendum. But as soon as rumor got around, the streets were packed with demonstrators disguising their fury under celebration, marching by his office, and they decided to climb down and accept the terms.\n\nSitting on a bench overlooking the Palais de Justice, he took out a guitar, and began to strum. It was an idle tune, a handful of chords connected only by the echoes of his notes. Nonetheless, people slowly began to gather, listening to the tune, couples clapping as he came to the end of one flourish and individuals humming to it as they slowed. As he took another look around, he began to take mental notes about the crowds and sorted their growing relief into the outline for a later report."
 FWI_proxy.8.a: "Even a stubbed toe may fell a prizefighter."
 
 FWI_proxy.9.t: "Distant Disconnection"
 FWI_proxy.9.desc: "Fernando María Castiella's room echoed with laughter. First out of shock, and then out of relief, Castiella laughed at the report in front of him. Antillean voters had chosen to reject American plans to centralize, and had instead chosen independence. No images were provided, but the report provided details on how wide the celebrating crowds were, and how strong the result was. Across every island, a decisive majority had pushed for independence, and were only just beginning to retire for the evening.\n\nTaking a moment to relax, he poured himself a wine, derived from a 1960 Portuguese vintage. It wasn't particularly old, but it was still a year to commend. He savoured the taste before moving to write some messages. The network of planters across Martinique and Guadeloupe he had contacted had definitely pulled through, and that deserved some reward. A few trade deals, some travel permits, some gifts. Enough to reward them for their work smuggling Iberian propaganda and goods into the Caribbean.\n\nFor a moment, he had feared all of his work would be lost. In the last days of the campaign, the Americans had begun to campaign - first through sympathetic media outlets and then through ambassadors - that it was a non-binding referendum, and he had lost all hope. But with how decisive this margin was? With how large the demonstrations were? He picked his old plans back up. If anything, he began daring to expand them. He just had to find his notes first, and-\n\nThe laughter was replaced by a swear. Of course! He'd lost his notes! Over the last few months, as the referendum looked likely, he had begun researching and developing plans for building political and economic ties to the Antilles! When the Americans had tried to downplay it, he threw them away! Scrambling to the phone, he called his secretary, demanding that she search through the rubbish. No matter how stained or crumpled, he needed those notes if he were to move ahead."
 FWI_proxy.9.a: "No time to waste."

 FWI_proxy.10.t: "If You Truly Love Something..."
 FWI_proxy.10.desc: "The two officials sat in a nondescript restaurant on the outskirts of Washington, D.C., a growing pile of cigarettes filling the ashtray between them. Sometimes, the small, dark place allowed for more open conversation than halls of the State Department headquarters, with less prying eyes and more loud chatter.\n\nOne of the men stubbed another cigarette on the table. "This thing with the Antilles shouldn't have gone the way it did, man. It wouldn't have been too hard, either. Just annul the results and go forward with the more responsible plan. We've protected them from the fascists for two decades now, they should have known better. Maybe we could have let them have a little referendum to ratify everything when it's all said and done".\n\nHis companion raised an eyebrow. "Really, John? We let them have this referendum, and the results were clear. You can't just erase 67 percent of the vote like that. Once we've gone ahead with the vote, we've committed ourselves to respecting the results. Even if they've let irresponsible demagogues get their way."\n\nJohn nodded bitterly. "Oh, get off that high horse, Bruce. The president wanted to annul the results too, until the FBI told him about a "high chance of violence" if he did. Suddenly he praises the results and promises a smooth transition to self-rule. Violence, my ass. The fascists are just going to jump at the opportunity the moment we're gone and build another Dominican Republic. All because we've been too cowardly to truly defend democracy."\n\nBruce leaned back. "I don't know, man. I think you're overreacting a bit. They'll still be in the OFN, after all. And if they really slide towards fascism..."
 FWI_proxy.10.a: ""...We could always come back.""

 FWI_proxy.11.t: "Middle Man"
 FWI_proxy.11.desc: "Guadeloupe knew no seasons. Its soaring heat remained constant year-round, from which General Lyman Lemnitzer's little nocturnal ritual was the only relief, as he took his usual fresh night air bath on the hotel's balcony. He also didn't mind the view from this modest observatory, where he could gaze upon most of Basse-Terre's dormant streets.\n\nHis own little slice of the Caribbean, the unwanted prize for years of service overseeing America's finest defeats. It pained him to admit it, but he had started growing rather fond of the humble little fiefdom. It had never liked him back, of course; yet at times like this, where the quiet was undisturbed, he could almost convince himself otherwise.\n\nPerhaps that was why he felt a hint of sadness knowing that as soon as morning came, these very streets would never be so peaceful again.\n\nIt was no surprise, really. Though a part of him had wished differently, his impromptu séjour to the Antilles wasn't going to be interrupted any time soon. In an unusual display of consideration, the heads in Washington had even given him advance notice of the President's decision to ignore the referendum's results and enforce a renewal of the Short-Fulbright Act. So now, until the statement's release at dawn, he had an entire sleepless night to ponder where it had all gone wrong.\n\nPerhaps he was to blame for even submitting the proposal to Congress to begin with. For entertaining any hope that it wouldn't backfire as spectacularly as it did. No, maybe he was actually to blame for creating the situation that led to this in the first place. For mishandling the domain he was so generously granted by old Kefauver. He knew the locals definitely blamed him for all their troubles, the manifest representative of everything they hated about the American intruders. He sighed, taking one last look at the serene small town."
 FWI_proxy.11.a: "Most of all, he knew he would take the fall for what was going to happen next."
 FWI_proxy_finished_veto: "§RThe United States have declared the Referendum non-binding, our efforts have been for naught.§!"

## Bahamas Flavor Events

 BAH_forpol.1.t: "Wired Up"
 BAH_forpol.1.desc: "Vincent Teresa's suite on the top floor of the Flamingo Hotel only sought to affirm its reputation. Filled with every amenity and constantly inhabited by a mixture of informants, mafia members and hotel staff, it overlooked the back half of Paradise Island. Sitting above the bridge to Nassau and the heart of the Bahamas, it came as the height of luxury. As a new band of cleaners left the room, knowing better than to intervene in mob affairs, a fresh band of informants waltzed in.\n\n"This doesn't come cheap, you know," murmured Teresa, so casual as to almost become inaudible, rolling a burning cigar in his hand as he looked down at the streets below him, awash with people featureless beyond their presence. "I'm a wealthy man, but even my money has its limits."\n\n"And our associates' accounts are even deeper," replied one, almost rehearsed in its diplomatic tact. "Trust me, Vincent, you're an esteemed guest, and none of us want anything other than the best for you. But our boss expects something in return."\n\n"I presumed as much," responded Teresa, chuckling to himself. "What do you want? Looking for a hit on somebody?"\n\n"He wants to expand into the Caribbean, but he's been butting up against some people from here," replied another, a false Italian twang stretching almost too far to be believed. "I'm no man to bite the hands that feed, but this very hotel is a real headache for us. You'll have to tell us who Bugsy Siegel really works for."\n\nTeresa pondered the issue for one moment, drawing from his cigar once more, before giving in. "Alright, fine, I'll talk. When he was shut down in Vegas, he didn't just rebuild his casino here for fun. The man's got a deal with Symonette." Most agents remained silent, waiting for him to continue. "If I do more than talk, I'll be sticking my head out. But with the right deal, I'll prove it.""
 BAH_forpol.1.a: "Time to make an offer he can't refuse."

 BAH_forpol.2.t: "The Goods"
 BAH_forpol.2.desc: "It had been a long day for Percy Dunn. He had been expecting the report on the mafia's ties to Symonette to be given for a while. What he had instead received was a much larger report, superficially explaining that before then highlighting their ties to fascists across Latin America, and to the Iberian Union.\n\n"Virtually every name is here. Symonette...Duvalier...Batista...Stroessner...you'd be hard pressed to find a fascist not involved in Latin America," he continued to Theodore Allan absentmindedly. "The ties we have to figures in Florida would be concerning enough; but this? This goes so much further than we expected." Finally looking up, he grinned slightly.\n\n"So, what do we do about this?" asked Theodore Allan, himself deep in a page about deals between a state representative from Louisiana and an Iberian diplomat.\n\n"Well, we have to convince the government to publish these findings. Failing that, find some journalist. We've redacted enough for our mafia informants to keep the important ones safe, but the magnitude of this report is too great to just leave in an archive."\n\nAllan shook his head. "Look, none of this is good. We need to get the Iberians out of the Caribbean, and any compromised American asset away from any sphere of influence." He dropped the report, and leant back into his chair. "Yet if we just reveal it, we'll lose any leverage we have when the Bahamian government collapses. Besides, the Iberian government is bad, but would you rather Japan get their tendrils there instead?\n\nDunn looked with some scepticism, but shrugged his shoulders. "I can get your worry. It's not our choice, anyway." Opening a flask, he poured a glass of whiskey before leaving it to simmer in his hand for a moment. "Whatever we want, it's the FBI Director's choice.""
 BAH_forpol.2.a: "We can't tolerate this. Seek out the American government; this must be made public."
 BAH_forpol.2.b: "This has more use as blackmail than a headline. The threat should get the Bahamas back in line."

 BAH_forpol.3.t: "All In On Red"
 BAH_forpol.3.desc: "Around a roulette table, empty laughter bellowed loud enough to echo across rooms. A small group had emerged: a trio of local American mobsters brought over to the Bahamas by Bugsy Siegel, an Iberian businessman looking to expand his business with likeminded gentlemen, and a croupier who waxed polemic about the fall of nearby lands to communism. They joked, laughed and relaxed into each other's company, but they all knew it was a lie.\n\n"You ever kill a man?" asked one, Albert, as conversation picked up around them. The Iberian businessman looked ahead with mild confusion, before indicating that he continued as the ball landed on 36 Red.\n\nAlbert bet on black as the Iberian stuck to red, and then momentarily pondered his next move. "Yeah, we've all killed a few. We had this one guy, big name in Newark, but couldn't keep his mouth shut 'round coppers. So we took him out to the woods. Told him we were taking a hit out on another rat. And then, when he shot the guy, I shot him as well. Two birds with one stone, gone."\n\n13 Black. The Iberian grimaced, both at the loss and at his strategy. "Pretty risky strategy, no?" asked Alfonso, as he called a large bet on Red.\n\nAlbert shrugged, before his group moved forwards most of their stakes. "I'm a guy who likes taking risks."\n\nAlfonso smiled, placing forth a similar bet. "I was too young to fight against the Bolsheviks or to take back Gibraltar, but I was old enough to trick the army into thinking I was old enough in 1944. I was stationed outside of Bamako when a sandstorm came in. Unlike most people, I took the risk." The ball lingered for a moment, before stopping at 2 Red, drawing an angry eye from the mobsters. "Three fewer American troops walking those streets today, let me say.""
 BAH_forpol.3.a: "Alfonso then placed his largest bet yet."
 BAH_forpol.3.b: "Memories of a war once fought, and warnings of the war yet to be fought."

 BAH_forpol.4.t: "New Beginnings"
 BAH_forpol.4.desc: "The relative wealth of the streets around Madrid drew Armando Gaona's attention, but only superficially. He never needed to feel that shared wealth to take in his own splendour. None of his group did. But times were changing; with the Caribbean Legion now in control of the Dominican Republic, he and his group of Trujillist businessmen had to find a new place to go. Madrid was just a provisional stop booked at the last minute.\n\n"It was a real shame to see Rafael Trujillo fall, you know," grumbled Joaquín Carballar, lighting a cigar. "Never knew the man myself, but he was the perfect man to help my business expand over there."\n\n"Yeah, it was. Few men were ever as big a help as us," replied Maximiliano Illescas, spewing from a cigar in turn. "Madrid is a nice city, but we still have business in the Caribbean. Any places you'd recommend?"\n\nCarballar thought for a second, and then leant into Illescas' ear, still speaking loud enough to be heard by all. "If you're willing to take a less...conventional route, then try the Bahamas. For the right price, you can get anything." He tapped his nose, before leaning back.\n\nThe group murmured, intrigued by the suggestion, but their responses took on a more hesitant tone. "I'm sure you can, Joaquín, but will he be accommodating to us?" asked Armando. "He's an American, and we wouldn't be talking about this if America had stayed away."\n\nArmando tried to continue, but was hushed by Joaquín as he spoke. "Symonette doesn't care about America. As long as you help to bring business into Nassau and keep those lawless savages he lives with down, he won't care if you're Franco or Salazar." Murmuring repeated itself once more, hesitance now replaced by nodding and interest."
 BAH_forpol.4.a: "The next country on an ignominious list."

 BAH_forpol.5.t: "Funhouse"
 BAH_forpol.5.desc: "From the moment Vincent Teresa had started talking, he knew it was only a matter of time until his associates caught on. He noticed it everywhere; he could see it in his handshakes with other mobsters, he could feel it in their glares. Yet he could not help but hold onto hope. Just cutting himself off from other mobsters would only raise suspicion, and so, he tried to pretend that nothing had happened. Only when his latest frenetic jabberings had stopped did he realise just how far out to sea his yacht had become.\n\n"Alright, let's stop playing around like this," sighed one as he raised his gun, a motion almost instantly echoed by the rest of the yacht.\n\nHe knew it. Might as well fight the inevitable, he thought. "Woah, what are you doing?" exclaimed Teresa, taking one step backwards.\n\n"We know what you've been doing, Vince," replied the first man, barely moving as he raised his gun. "We've been told what you've been doing by the boss. The Spanish are telling me you've been ratting their friends out to the feds. Awful thing to bite the hands feeding you."\n\n"What? I would never!" responded Teresa, feigning shock. Suddenly, the realisation had come to him. He'd been conned. "Come on, I'd never do that, believe me. Hey, let's not mess ar-"\n\n-BANG-\n\nPain seared through Teresa's chest, paralysing him in shock. He stumbled back, one step, then two, before the second man lowered his gun and pushed him off. They lingered for a moment more, watching the blood red fade into a murkier blue, before the shapes drove off, their grumbles about the upcoming loss of such a good boat obscured beneath waves and a fading consciousness."
 BAH_forpol.5.a: "The sea's hunger is sated once more."

 BAH_forpol.6.t: "Cold Case"
 BAH_forpol.6.desc: "They should've known not to wait too long. From the moment their agents in the Bahamas had suddenly gone silent, they should've known that something was up with their connection to Vincent Teresa. By the time the FBI had realised, Teresa's yacht was long gone from harbour. His reservations at the Flamingo Hotel had been totally emptied and new adverts for his exclusive suite had been plastered over newspapers. A clandestine group of agents slowly gathered, preparing to account for the worst.\n\nThe room had been totally ransacked, the only sign of care being an initially locked door and a carefully shuttered set of curtains. Virtually everything else was upturned, spilt, or missing. As they flicked through the cabinets and drawers, any evidence of the files they had once seen were totally gone, with only a single manila folder that had fluttered beneath the bed and a pair of empty clothes hangers being evidence that anything beyond a tsunami had ever been present in the room.\n\nWhat had happened was clear. Vincent Teresa, at some stage, had acted suspicious, and the FBI had prepared too slowly. Iberian agents had doubtlessly organised his disappearance, probably throwing him off of his yacht to drown, before then moving on. They waited in the room for a moment, waiting to see if any other staff members would come, hoping to see if they could explain something. Nobody arrived. For now, the staff were smart enough not to intervene in mob affairs.\n\nDefeated, they slinked out of the ransacked suite, complaining about missed opportunities in hesitant whispers. They knew something was afoot, but now they had no solid leads. If the other informants hadn't already been purged, Teresa's death would give them too much cause. Their leads on Symonette's ties to Iberia or the Mafia were completely gone. As they limped down the stairs, their gazes shifted to his empty table at the casino. And so, their minds turned to an evening of gambling."
 BAH_forpol.6.a: "And as evening turned to night, the agents bet all of their winnings on black."

 BAH_forpol.7.t: "Changing of the Guard"
 BAH_forpol.7.desc: "Roland Symonette reclined in his chair, studying Kendal Isaacs, a black member of the UBP, and his handpicked successor, to discuss the transition to majority rule for the nation.\n\n"At this rate, Kendal," Symonette began, voice low and weary in a way that felt more practiced than sincere. "The people want majority rule, and they want a face that reflects it. An old white man like me at the helm... well, it's no longer tenable. So, as a compromise, I'll step back from the forefront and let you take the premiership."\n\nIsaacs leaned forward in his chair. "Well, thank you for your service, Symonette-"\n\nSymonette cut him off with a limp wave. "My service is not finished. Don't misunderstand. I may be leaving the public eye of the premiership, but I will still be... let's say, guiding matters, giving advice. Just making sure the country stays on its present course." Leaning forward, voice sharpening. "Stability is essential. You'll need my hand on certain matters, even if the populace sees yours."\n\nA flicker of irritation crossed Isaacs's face before he smothered it. He had known this was coming. "Of course," Isaacs said, forcing a polite smile. "I'll keep you informed." Isaacs knew he needed Symonette's graces if he wished to lead the UBP."
 BAH_forpol.7.a: "Even if it meant bowing for now."

 BAH_forpol.8.t: "A Loose Leash Is Still a Leash"
 BAH_forpol.8.desc: "The conference hall was filled with a buzz of diplomats and elites, flags of the West Indies Federation hung in adjacent with those of the Bahamas. Kendal Isaacs meticulously looked over the details of his speech; this was his moment of history. His moment to put the Bahamas on his path. Behind him stood Roland Symonette, a man without position, yet he was able to strongarm his way here. Shaking hands with old friends and foreign dignitaries from across the Caribbean, taking every photo and every deal that he could. Although joining the Federation wasn't something he'd have done in office, he allowed Isaacs to pursue the idea.\n\n"Roland," Isaacs murmured under his breath, "I thought you said you'd keep a low profile."\n\nSymonette didn't bother hiding his amusement. "And I will. But let's not pretend the Bahamas has something to gain from these eager diplomats. Best to get as much as I can before it ends." Before Isaacs could respond, another influential Anglophile strode over, beaming at Symonette.\n\n"Roland, old chap! I heard you'd stepped back, but here you are, still keeping the ship steady."\n\nSymonette accepted the compliment with a gracious nod. "Merely offering guidance where needed. Kendal, here is the future, of course."\n\nIsaacs stood beside them, smiling thinly, feeling the ground shift beneath him. Every time he tried to interject, the Anglophile's attention slid back to Symonette. Every agreement Symonette hinted at, however unofficial, made Isaacs's task harder. He needed the Bahamas to appear sovereign, confident, and fully committed to the Federation. Instead, Symonette's shadow loomed over every conversation. And sooner or later, he would have to step out of Symonette's shadow."
 BAH_forpol.8.a: "Whether Symonette allowed it or not."

 BAH_forpol.9.t: ""
 BAH_forpol.9.desc: ""
 BAH_forpol.9.a: ""

 BAH_forpol.10.t: "Foxhunt"
 BAH_forpol.10.desc: "Darnell Fox looked over his shoulder and licked his lips nervously. Was the person he had seen a block ago another passerby or a tail? Had he seen that car before on another street? He was in a safehouse, a dingy nondescript building in a poor neighborhood on the outskirts of Nassau, but was it truly safe? Everything seemed normal, but if he was being followed by a pro, then he wouldn't know that he was being followed, would he? He dialed a long stream of numbers to contact his American contact, Freeman.\n\nThe Bay Street Boys were the ruling clique on the islands, and while everyone knew that they washed money for the American syndicates and took in guns from other murderous Latin American strongmen, it was one thing to know, and another thing to have proof. If there was any hope of a Bahamian People's Republic, then the people needed to know that the Bay Street Boys were killing their people at the behest of the Americans, and the American public needed to know that their precious leaders were letting criminals run rampant over the natives. In the States, there were people talking about the right for the Black Man to stand up for himself, to achieve everything that life had to offer, not whatever scraps the White Man saw fit to toss his way. He heard the phone crackle with connection\n\nDarnell believed in the cause when he had volunteered to surveil the Bay Street Boys's warehouse in Prince George port. Even now, his heart welling up in his throat, he still believed. The faith in the cause is what gave him the strength to even imagine standing up to the Bay Street Boys. When he delivered his observations, that faith would spread across the islands and beyond, and finally place the Bahamas in the hands of people like him. A state for people who looked like him.\n\nDarnell only felt a slight touch from a cold barrel before the bullet shattered his skull. All he had seen and heard; now, he would never do either ever again because of what he hadn't."
 BAH_forpol.10.a: "Freeman dropped the handset in utter shock, his heart gripped in his chest, and, fearful, looked over his own shoulder."

 BAH_forpol.11.t: "A Universal Language"
 BAH_forpol.11.desc: ""Well, the beaches around Florida were a wonderful place to grow up. Really acclimatises you to this place," mused Roland Symonette, idly looking at his glass of wine. Ezequiel de Sousa nodded along, growing tired of pleasantries. Iberia had sought a discreet route of exports to Jamaica, and knew better than to take Symonette's claims of reform seriously.\n\n"I have happy memories from my own childhood, Roland, but we can do better than reminisce," replied de Sousa, struggling to conceal his accent. "Let's talk business."\n\nSymonette's eyes returned to de Sousa, but his tone remained flat. "Of course. A small island chain like mine can't survive without business. What kind of venture were you proposing?"\n\nDe Sousa struggled to broach the topic. "Well, we wanted to ship some goods through Freeport down to Jamaica, but it must be discreet."\n\n"Trade is important, Ezequiel," replied Symonette, even flatter than before. "If it wants to prosper, the Caribbean will need it."\n\n"I won't deny that," replied de Sousa, struggling not to roll his eyes. "If we can come to a deal, I can assure you that Iberian ships will happily pass through your ports."\n\nSymonette turned back to his glass, spinning the liquid inside around, before taking a lengthy sip. "I welcome the idea of doing business with all nations, and it would be nice to see more Iberians with us." He wanted more.\n\n"Alright, Roland, how much money do you want!?" snapped De Souza, tired of the exchanges. For a moment, he held his breath, worrying that his lack of decorum had broken the deal, but Symonette's arms suddenly broadened."
 BAH_forpol.11.a: ""Glad we can do business together, Ezequiel.""

 BAH_forpol.12.t: "Kicking Back"
 BAH_forpol.12.desc: "From the stories he eavesdropped on outside bars. From the squawks of seagulls flying overhead. From the tiniest of slits between the hotel gates. Ajani had only known the beach from Nassau's dankest alleyways, a beach littered with wealth and cocktails that only welcomed white tourists.\n\nBut today, only a sign declaring "PRIVATE PROPERTY" stopped Ajani from occupying the sandy waterfront.\n\nAjani was the first to step past the invisible line in the sand. A wall to separate white and black folks like himself. He was twelve. Not much younger than the folks in America who would do sit-ins at bars. The others followed. Cousins, classmates, and cricket teammates he'd play with on the weekends. The ocean's ebbs hissed as it scratched at the sands.\n\n"Off the sand!" A man roared. Two more followed behind him, holding a nailed bat and a crowbar. "Your kind can't read the damn sign?"\n\nSome scrambled away. But Ajani met the man's gaze. He dug his soles in the sand. The sand reciprocated, giving way to his ankles and rooting him safely. A boy shouted back. "We can read alri-"\n\nA baton slammed into the boy's jaw.\n\nAjani didn't remember deciding to move. He only remembered the sands pushing him forward. He only remembered his fist connecting. He only remembered ripping the crowbar out of one of their hands and swinging it blindly.\n\nBut the boys remained on the dunes. The red had already been washed away, creating a murky purple in the waters. Ajani looked down at his hands. They shook. The sign still stood at the edge of the beach. Ajani walked up to it, crowbar in hand."
 BAH_forpol.12.a: "And with one swing, he knocked down the first wall."

 BAH_forpol.13.t: "Run for the Border"
 BAH_forpol.13.desc: "Shoving a filled suitcase shut and shunting it to the side, Roland Symonette looked around frantically, trying to find another one. Money this time, of course, most possessions worth keeping had been sent off long ago. Most of his familiar places had long since been emptied, but as he sifted through the bedsheets and floorboards, loose notes still came out. For a moment, Symonette allowed himself time for pause, looking outside at Nassau. The streets were empty, but he knew that most were simply inside, celebrating with family.\n\nNot that he had ever wanted to join them, of course. As soon as the Bahama Papers had been released, he'd been totally abandoned. Iberian diplomats had been unceremoniously dumped, mafia members had been arrested, American representatives had resigned. All for show, of course. He knew how deep his ties had run previously, but that didn't matter in the face of public outrage. With Pindling's landslide, his ship had finally crashed; no use staying in the country now.\n\nSymonette rummaged through his drawers one last time, grabbing suits for wads of cash and cramming them into another suitcase. He could feel the glares of his Bahamian staff, but cared not to answer them. No matter their silence, he knew how they had voted, and knew he would never see them again past today. Whisking his hand, he ordered an entering employee to bring it down, and then took a deep breath. Nothing was left beyond walls, empty cabinets and an unmade bed.\n\nIn turn, he shut off the light, and rushed out of the building. The Learjet behind him was still being filled with luggage, but was otherwise primed to take flight. Not everybody had abandoned him, thankfully; an American businessman was more than happy to allow him access to a spare home until the press surrounding him had died down. As he clambered up the stairs, he took a final moment to take in the warm air surrounding him, before leaving as he watched a pair of fresh cars arrive."
 BAH_forpol.13.a: "One last crime before surrendering the spotlight."

 BAH_forpol.14.t: "Closing Time"
 BAH_forpol.14.desc: "The soft glow of sunset washed through the windows of the Grande Cove Casino, tinting the rooms within a burning orange from the seas of the Exuma Sound. Few lights were on; even fewer people complained. A stream of guests had gambled away, but their numbers were thinning, and nobody was replacing them. Overlooking the crowd, in a private suite, the trio of American businessmen who owned the casino silently commiserated on their upcoming loss.\n\n"Well, the bastard's going through with it," grumbled Archie Miller, cleaning his spectacles. "Pindling's going to nationalize the place, and maybe give us a boat out of the Bahamas."\n\n"A paddleboat, maybe," complained Kenneth O'Neil, stabbing his fork at his plate. "You can see how a fool like him got elected by this lot." He waved his hand widely, pointing only vaguely to a waitress walking down the aisle. "Too lazy to wait for anything but handouts!"\n\nMiller nodded. "We would've never had this problem with Symonette still in power. He would've sorted it out in a second for a few thousand bucks."\n\nClarence Blankenship looked at the empty aisles in front of him, watching a crowd that had slowly dwindled into a pair exchange their final hands, and sighed. "You know, maybe it's for the best. Now that Pindling's in charge, these workers are shiftless. They think the country's theirs - I've even heard them laugh about forming a union." Eyebrows raised around him as he shook his head. "These natives always plot to rob you behind your backs, let me tell you."\n\nO'Neil's face became muddled, but he sighed. "Maybe you're right. I don't like it, but perhaps all things have their ends." He turned to his wine, drinking deeply and swallowing hard. "It's not like Pindling was being fair with his tax demands, anyway.""
 BAH_forpol.14.a: "Texas Fold 'em."

 BAH_forpol.15.t: "Two Types of File"
 BAH_forpol.15.desc: ""You know, it may have moved off of your pages once the Bahama Papers hit, but there's a lot more to say about that story in the Bahamas than came forth," said Donald Calegari, slicing into his plate of pizza. He had reached out to the New York Times with the promise of a newspaper, but even as he sat in a restaurant owned by a close friend in Brooklyn, he didn't want to wait until dessert.\n\n"What more is there to say?" asked Alexander Hinton, drawing his knife through the crust in front of him. "Symonette worked with a bunch of fascists, several people got arrested and he lost in a landslide. Nobody's interested in rereading old news."\n\nAs Hinton finished, Calegiri heartily laughed. "You really think it ends with Symonette? I've been doing some digging of my own, and Pindling's even worse. Since he nationalized the place, he's been giving contracts to the most corrupt men in the Caribbean." He brought out a large wad of documents, barely sorted into a number of folders.\n\n"There's a saying, Donald, about throwing stones in glass houses," responded Joe Leon, through a mouthful of parmesan cheese. "For a laundromat, you sure have dirty hands. You've been arrested for blatant corruption. I have a friend in the police department talking about another investigation."\n\nHinton nodded. "Nobody's ever been able to stick you with them yet, but everyone can see your ties to the mafia. We know they've been angry since they lost the Bahamas; why should we trust you?"\n\n"Hey, I'm not asking for glory," shrugged Calegari, pushing himself back from his chair as he rummaged through his black coat. "You've seen my record. You know I've already gotten mine." He threw an envelope onto the table, bulging with notes and rubber bands, as he walked away. "Just say it's from an anonymous source.""
 BAH_forpol.15.a: "Press and Gang."

 BAH_forpol.16.t: "Shut It Down"
 BAH_forpol.16.desc: "When he was sent to the Bahamas, the Iberian agent had been told who to expect and where to meet him. Vincent Centanni had been described to him as a gregarious man, his formal suits contrasted with a constant humour and a wide smile. Looking down at the image, he saw that his old visage had long since evaporated. Alone on a stool in a casino with little business, Centanni looked shrunken and sullen, his hair unkempt and his blazer practically hanging off his shoulders.\n\n"Centanni?" A brief look upwards was all that was needed to confirm his apparent downfall. "Madrid sent me. We're getting troubling news regarding our deal with shipments to Jamaica."\n\nThe words barely seemed to get through to Centanni, but he nodded regardless. "A lot of big names were arrested recently," said Rabellini, looking through his list. "Sergi, Roibén, Emilio, Micolau... these were good agents, Omero. What happened?"\n\n"Look, whatever your name is, this isn't a good time. We don't know who, but somebody's been ratting us out. Direct line to the FBI, and they likely know it. It's probably a big name too, with how many people are getting hit."\n\nHis brow furrowed. "That is concerning. Any idea who the rat is?"\n\n"No, and we won't be finding out soon. If we intervene, the Americans will just arrest everyone involved. If we try finding the rat ourselves, we'll end up killing ourselves in a fit of paranoia." Centanni took out a cigarette, desperately fiddling with the lighter as he placed it in his mouth. "If you want to keep throwing men into American prisons, be my guest, but the mafia's not in the place to protect your ships anymore."
 BAH_forpol.16.a: "The agent's brow furrowed, mourning the lost profits."

 BAH_forpol.17.t: "Pulled"
 BAH_forpol.17.desc: "11:22 - Bahamian police given brief on strategy, significant equipment and locations of key smugglers. Presence of direct FBI agents minimal, but Bahamian police seem invested in raid despite conscription.\n\n17:55 - Protests in Jamaica over repressive policy of Alexander Bustamante begin to rise in intensity. Attention of those within Jamaica, including smugglers, should be overstretched by this point. Raids to begin from this point forwards.\n\n18:21 - First major anti-smuggler raid in Montego Bay. Large supply of illicit substances, especially cocaine. Twelve smugglers arrested, two killed in fighting. Significant cache of weaponry discovered and taken in.\n\n19:10 - Second and third major anti-smuggler raids occur, targeting depots outside Mandeville and Ocho Rios.\n\nFew supplies found in either case and only five people arrested, but high number of vehicles captured. Two smugglers escaped, but were quickly killed in a shootout.\n\n21:42 - Fourth major anti-smuggler raid, targeting cell in Blue Mountains closest to Kingston. Seems to have been the heart of the operation, with fifty arrests. High proportion of presumed Iberian agents, who have been forwarded to regular channels, and large numbers of weapons and supplies seized.\n\n23:39 - Last major anti-smuggler operation in Dry Harbour Mountains. Smaller presence, but had most organised defence, killing three before being captured. Limited supplies, but had high quantity of dollars; was likely informed of earlier raids.\n\n23:40-01:00 - Cleanup operations, focused on incarcerating those targeted, removing the Bahamian police from Jamaica and constructing press release. Select individuals likely free, but not enough to sustain ring."
 BAH_forpol.17.a: "A total success."

 BAH_forpol.18.t: "Muckraking"
 BAH_forpol.18.desc: "When he had first gotten the call, John Ramsey's ears picked up at what they implied. Any journalist worth the articles they write would've been intrigued by what the press release alone indicated; the American government had found a hidden network tying Latin American fascists and mobsters to the Iberian Union, tied together by the Bahamas? The promise, and capacity to access, the full papers only drew his attention further. Ramsay was sure that there was more to this story than the thick tomes alone.\n\nPouring through, his interest only grew further. Press releases smoothed out any concerns and replaced them with harsh condemnations of Franco and Symonette, but beneath it, the real gravity of the Bahama Papers were clear. American officials and American politicians were clearly shown as being happy to collaborate with fascists and the mafia where there was a profit to be made. The ties between some of the Senators listed alone would be enough to fill headlines for a full week the nation over.\n\nOr so he thought. As soon as he tried to extend his reporting beyond the small cast President [USA.GetLeader] had recited, he found his reports shut down. It wasn't their field, they claimed, or the reporting had too little meat to it to genuinely be published, or that it was a crypto-Japanese plot, or was tabloid-level, or that they couldn't pay the subsequent legal fees to defend from claims of libel. No matter how he tried to appeal, no matter who he talked to, nobody would listen.\n\nA few days later, Ramsey reached out to the Village Voice. His offering and background was unconventional, and he found himself uncomfortable at just how left-wing the paper was, but he saw it as better than nothing, and was assured that his own writing would be largely unaffected by the crowd. Within the day, news of the story broke across telephone lines and networks, and within the week, the story was front page news across countercultural newspapers the country over."
 BAH_forpol.18.a: "But to the reading public, the headline had long since faded."

 BAH_forpol.19.t: "Alliances Rekindled"
 BAH_forpol.19.desc: "Warm air bucketed Theodore Allan as he marched through the lobby of the Flamingo Hotel. Its shine felt a world removed from the dirt roads he had been driven through after reaching the Bahamas, but it sank away as he threw Siegel's door open. After a cry of protest over his interruption, Allan quickly turned to speak.\n\n"Bugsy Siegel, I'm with the FBI. I know you've been smuggling goods into Jamaica alongside Iberia." Allan slammed a document down. "Emilio Escribano. Micolau Vicedo. Davi-"\n\n"I work with a lot of guys." Siegel kept a cool face, but a hint of concern betrayed him. "I'm a businessman. What do you want me to say?"\n\nAllan raised a file. "I could take this to the FBI Director and have him leak the whole thing. The Nevada police were pissed that we let you go free in the first place, and now this? Treason carries a death sentence, you know. Or, you can talk."\n\n"Why talk?" asked Siegel, nervously, ordering the door to be shut.\n\n"We'll let you keep all of this. We might even turn a blind eye to what your men have been doing in Queens lately." Allan leaned in, poking a finger directly into Siegel's chest. "But you'll tell us every last area here that Iberia influences."\n\nBugsy Siegel looked downtrodden, sinking into his chair. "By the time I'd get enough information to work with, my associates will know who the rat is, and the-"\n\n"You're dead already, Bugsy. Where would you rather be shot? Your throne or the chair?" Allan pointed to a phone number. "I know what you mobsters are like. You'll give me what I want soon enough.""
 BAH_forpol.19.a: "A dirty deal done dirt cheap."

 ## Bahamas News Events
 
 BAH_News.1.t: "[Get_newspaper_header]Majority Rule Achieved in the Bahamas Amidst Scandal"
 BAH_News.1.desc: "Following a recent scandal involving several Bahamian government officials, Roland Symonette's cabinet has collectively stepped down in disgrace, marking the end of the United Bahamian Party's hegemony and white rule. Corresponding with other decolonization movements in the region, investigations revealed the Symonette family's dealings with the American mafia, which has led to rumors of American pressure playing a key role in the UBP's fall.\n\nLynden Pindling has been appointed the first Black Prime Minister under popular mandate and vows to build a Bahamas that serves its people. However, the holdovers from the old power base remain a constant obstacle against real reforms through their empire of crimes and vices. It will be an uphill battle to reform an economy entirely intertwined with the old colonial ways.\n"
 BAH_News.1.a: "The good fight never stops if we are still fighting."

 BAH_News.2.t: "[Get_newspaper_header]White Rule Limps on in the Bahamas"
 BAH_News.2.desc: "Against the Free World's pressure and her own people's cries of protest, the Bahamas remains unrepentant in its commitment to white rule as the latest election brings another scion of the Symonette dynasty, Robert "Bobby" Symonette, to the seat of Prime Minister. Known for his connections to crime syndicates as well as maintaining a litany of misconduct accusations, the late Roland Symonette's yacht-loving son has been called out by dissidents lately as a "mafioso unfit for governance."\n\nFollowing Symonette's inauguration in the ministerial position, commentators have also noted the family's continued collaboration with the Bahamas' long-standing political clique, known as the Bay Street Boys, to be further eroding domestic opinion on the current minority regime. For now, however, the Princeling can sit tight on his throne, carefree as always.\n"
 BAH_News.2.a: "Who needs popularity when your pops had friends?"

 BAH_News.3.t: "[Get_newspaper_header]First Black Prime Minister of the Bahamas"
 BAH_News.3.desc: "The Bahamas has achieved a historical milestone as the recent election brings "majority rule" to the small state. While the United Bahamian Party remains in power, the state sees its first black Prime Minister, Kendal Isaacs, sidelining the Bay Street Boys oligarchy back into obscurity.\n\nThis outcome was driven by the increased US influence in the region following the downfall of British colonial authorities. The UBP's decision to appoint Isaacs as a candidate is reportedly to be a move towards appeasing Washington and distancing itself from the white-minority rule that had characterized the party. Many speculate, although unsubstantiated, that the Bay Street Boys still hold de facto sway over the newly-shuffled cabinet, and Isaacs remains nothing more than a pawn.\n"
 BAH_News.3.a: "A sunnier day with a brighter face."

## Jamaica Flavor Events

 JAM_flavor.1.t: "Volte-Face"
 JAM_flavor.1.desc: "Alexander Bustamante stands with conviction, as the umbras of the Headquarters House looming over him and his cabinet slowly recede. The damages caused by the riots left Jamaica with a shoestring budget. Many expect Bustamante to announce assistance from the OFN to mitigate the damages caused by the riots. Bustamante's printed speech will leave these rumors unfounded.\n\n"The independent committee had carried out a thorough investigation into those responsible for the fatal tragedies in our society, and our findings have uncovered a blatant attempt and betrayal of our autonomy!" His hallmark lofty and emphatic tone was there; somehow, an ominous undertone was also present. "We concluded that these groups of interest were indeed wholly supported, supplied, and contacted by foreign forces, mainly the intelligence departments from the United States of America."\n\nAs CBS telecasts the monumental speech by Bustamante to millions of homes in the United States, the on-site reporter only blanched when Bustamante made the shocking accusation that his most reliable ally would attempt to usurp him, when the embers from the riots were barely snuffed out. No commentary was required to understand the gravity of his upcoming declaration.\n\n"Jamaicans should not have every facet of their society further dictated by malevolent strangers from abroad, neither by America nor Britain. We must take the unfortunate step of separating from British control and chart our own paths forward by declaring independence as a republic, without pause or delay!" The hue and cry quickly masked the few cheers from the audience. "To preserve our sovereignty, we must withdraw our attendance from the negotiations of the West Indies Federation!"\n\nAs the situation has not calmed down from the protests of the audience, a photojournalist in the fray has captured his photogenic moment:"
 JAM_flavor.1.a: "Bustamante in the sunlight, his cabinet in the shadows."

 JAM_flavor.4.t: "A New Savior"
 JAM_flavor.4.desc: "Canadians, Americans, and British. The delegates belonged to the now-defunct West Indies Commission, somberly traipsed towards the planes that made a one-way trip back to their home countries. To the Iberian ambassador to Jamaica, it paints a small smile on his face to see them fly away, possibly never to come back.\n\nBustamante's flagrant speech made headlines in both America and Iberia, not just for the sudden turn in foreign policy, but for the Jamaican delegation making headlong advances towards the Iberian Union. The Iberian ambassador, in return, was to make an attendance for the conference for the signing of the new constitution.\n\nThe whole charade of this new constitution is smoke and mirrors of what it really signified: the legalization of Bustamante's carte blanche of permanent control. It is outlined in plain sight that he is made "president for life", no longer the mere premier of Jamaica, but declared the "national founder" of Jamaica. His protégé and second-in-command, Donald Sangster, would replace him as prime minister. No one expected Sangster to have real power when Bustamante was the one to retain a significant amount of it. Not even Sangster expected it.\n\nA cacophony of camera flashes welcomed the ambassador as he arrived at the Jamaica House with his motorcade. Making his way to the august tables, he noticed Sangster and the JLP delegation from his vantage point. Stiff shoulders and mostly silent, with a few rictus smiles. It simply does not matter to the ambassador if they get strung along unwillingly, as he sat down on his designated seat. As Bustamante made his opening speech, he declared, rather emphatically, that since America foiled "their" plan of having him deposed, he welcomed the Iberians to further assist in Jamaica's development."
 JAM_flavor.4.a: "The ambassador could not help but make a curt smile."

 JAM_flavor.5.t: "Indirect Action"
 JAM_flavor.5.desc: "Normally, a trip from Jamaica to Puerto Rico was quick and easy, but today, Edward Seaga had to travel incognito. If anyone knew where he was going or who he was meeting, the chances of him reaching fifty would drop significantly.\n\nAfter he had reached San Juan, Seaga took a circuitous route to his meet location and surreptitiously left a mark on the side of a building to signal he was ready. Five minutes later, a car showed up to take Seaga to the FBI station house. After being searched, Seaga was brought in to meet with Theodore Shackley, station chief.\n\n"Apologies for the roundabout methods, Mr. Seaga, but you can never be too careful."\n\nSeaga brushed off the concerns. "No need, it's purely rational. That's a tune I'm willing to hear. These days, all I'm left with is Busta's insanity." Seaga coughed to clear his throat before continuing. "The man seems to change his mind at the drop of a hat, then change it again when he picks it back up. Dumping an alliance with America for what? The Iberians? The man is half-senile, for God's sake."\n\nShackley countered. "Still, he does have a lot of enduring public support."\n\n"Not among the JLP. The core of the party still exists and is just waiting to pull the rug out from under him. Sangster is Bustamante's pet Prime Minister, but few respect him; I'm not sure he has an independent thought of his own. If we can count on the US's support, we can ensure that Jamaica can come back into the fold, away from Iberia. Otherwise, Jamaica will become poorer, and the United States's position in the Caribbean will diminish. I don't think, Mr. Shackley, that this is in either of our interests.""
 JAM_flavor.5.a: "You are correct, Mr. Seaga, it certainly isn't."
 JAM_flavor_5_tt: "Our position in §&Jamaica§! may have been weakened, but we're not out yet.\nWe'll collaborate with §aEdward Seaga§! to get rid of §dBustamante.§!"

 JAM_flavor.6.t: ""
 JAM_flavor.6.desc: ""
 JAM_flavor.6.a: ""

 JAM_flavor.7.t: "The Price of Blue Gold"
 JAM_flavor.7.desc: "The fanfare outside the King's House did little to mask the unease. Beneath the sun-bleached bunting, the crowd of civil servants and businessmen knew that today was not in fact a celebration, but an elaborate sale. Inside, Sir Alexander Bustamante scrawled his name across the last page of the Iberian Trade Accords. The signature was bold and confident, but the pen trembled slightly as he passed it back to the waiting Iberian envoy, before he shook hands with the ambassador from Madrid and grinned into the blinding light of the cameras.\n\nOn paper the deal was fairly straightforward. Iberian corporations would purchase controlling stakes in Jamaica's cobalt mines and refining facilities. In return, the island would receive a lifeline: foreign currency, industrial machinery, and an assurance of "mutual economic development". Euphemisms aside, the deal was technically far more beneficial to the Jamaicans than the Iberians, who knew perfectly well that cobalt was by no means the island's greatest mineral export, and the mines themselves were unprofitable waste heaps.\n\nThe reality behind the deal was that years of crackdowns on dissent had driven the island's investors abroad; the treasury was hollow, and the army was tired of waiting for their pay. The cobalt mines were simply collateral for Jamaica to let in an old colonial master under somewhat better terms than the previous arrangement. As far as Madrid was concerned, they now had an outpost in the Caribbean after only about a century's gap, and the means to begin forcing their way into its economy.\n\nFor the workers lying in their shacks and shanties around the mines, the news came as an echo down the shafts. Another foreign name painted on the equipment, another flag stitched on the helmets. \n\nBustamante stood on the veranda as the Iberian delegation's motorcade rolled away, a faint breeze tugging at his coat. The bay glittered below, blue and endless. Somewhere in the back of his mind, he wondered if he had only begun a pattern of selling the island away, piece by piece, to those uninterested in her welfare.\nThen he pushed those thoughts away and downed a gin and tonic."
 JAM_flavor.7.a: "And then he had another one."

 JAM_flavor.8.t: "The Sound of Industry"
 JAM_flavor.8.desc: "Kingston Harbour was quiet except for the sound of the tide hitting the hulls. A single bulb flickered above the customs shed and irritated Donnie Clarke. There was barely any electricity in the Gardens, but apparently they could spare some for this shithole. They stood around a nondescript crate, stamped with Spanish markings that no one could read. Not that that mattered, since they could hear the rattle of empty magazines inside.\n\nA black car pulled up. Two men stepped out, one of them wearing a pressed shirt despite the heat, the other a six-foot brick of pure muscle. The man in the pressed shirt didn't greet anyone, and only opened his briefcase and handed Clarke an envelope.\n\n"That's for this month," he said. "The rest moves on the next freighter. The police will be far away the pier for forty-eight hours."\n\nClarke counted the notes without looking up. "Last month you said the same," he said. "Then Customs raided two of my boys' boats."\n\nPressed-Shirt didn't argue. He placed another smaller envelope on top of the first. "Consider that an apology."\n\nClarke smiled, thin and humourless. "I don't really care who runs the show," he said. "Just don't make promises you can't keep. My people hear that name, González-Mata - they start thinking someone else owns this place. Some little fop from Spain or Portugal."\n\n"Someone does," said the man in the shirt, then nodded toward the crate. "Get it loaded. The ship leaves before dawn."\n\nClarke's posse moved quickly. Within minutes, the crate disappeared into a truck and the shed emptied. The two men lingered for a moment, watching from the car through a haze of cigar smoke. By the time they drove off, the only sound left was the water against the pier and the distant echo of drunken laughter from the gangs unloading another shipment. The trade would never stop now. Not at night."
 JAM_flavor.8.a: "Not ever."

 JAM_flavor.9.t: "Plata O Plomo"
 JAM_flavor.9.desc: "Though the Prime Minister's office was playing host to an unusual gathering of people, it remained silent. The Inspector-General of the JCF stood by the window, reading through the latest police reports. Fewer shootings, fewer strikes, fewer headlines. On the surface, things were improving.\n\nAcross the table, Luis M. González-Mata flicked ash into a glass tray and waited. "You see?" he said finally. "The numbers speak for themselves."\n\nThe Chief of Defence Staff frowned. "You're paying them to behave. That isn't governance."\n\n"It's cheaper than a war. And the Prime Minister agrees."\n\nThe door opened. Bustamante entered, moving slower than he used to. "Gentlemen," he said, taking his seat. "The treasury reports order in Kingston. The docks are working again. People are being fed. That is what matters."\n\n"At what cost? These gangsters think they're the government now. They collect our payments and call them tribute. We've sold off our - "\n\nBustamante cut him off and nodded at an advisor. "We can fight them," the advisor said, "but we'll bleed the island dry. I've completed a preliminary report here, if you want to consult it. But my conclusion is, simply: they want money, not power. Let's give them what they understand."\n\nThe Prime Minister closed his eyes for a moment, then spoke quietly. "If the people can sleep, we'll call it peace."\n\nLater that night, an envelope left the Ministry of Finance under police escort. It would reach a warehouse in Tivoli Gardens by morning, one of dozens delivered that week. The men who received it didn't wear uniforms, but they kept their streets quiet.\n\nOn the radio, the government announced a "period of stability." In the alleys, the gangs called it tribute season, and greedily licked their lips. But for now, Jamaica slept."
 JAM_flavor.9.a: "A fitful sleep is still sleep."

 JAM_flavor.10.t: "When All You Have is a Banana"
 JAM_flavor.10.desc: "It was half-past three when Edward Seaga walked into the San Juan station, a smile on his face visible despite his drawn hood. He had grown to enjoy these meetings, despite the hassle of traveling incognito. Though now, Bustamante had more things to worry about than what Edward Seaga was up to.\n\nThe preparation for Operation Banana Split had been a complete success. The FBI had successfully cultivated multiple sources in Bustamante's government. Whenever an unflattering report was written, it would be less than a day before it would be exposed by a journalist's "anonymous source." Busta's labor union was similarly penetrated, and discussions abounded about the lack of faith that the workers had in the President's willingness to defend labor rights, particularly when it came to defending native Jamaicans against Iberian businesses willing to exploit them.\n\nSeaga was even able to suborn criminal organizations to work for him. The most notable of which, the Shower Posse, were happy to burn rival ganja fields and enforce a brutal sort of order in the poorer sections of town and among the unsavory elements. Shackley hadn't been too fond of that element of the operation, but the practical part of his mind quieted his objections; criminals were going to exist, better that they be working for you than against you.\n\n"Mr. Seaga. Let's talk about the future of Jamaica...""
 JAM_flavor.10.a: "Shackley and Seaga. A match made in heaven."

