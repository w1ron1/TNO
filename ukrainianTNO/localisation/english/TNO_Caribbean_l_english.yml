 JAM_News.11.t: "[Get_newspaper_header]Jamaican PM Perishes Amidst Nationwide Blackout"
 JAM_News.11.desc: "Faced with a hurricane, nationwide blackouts from the Oil Crisis, rumors of a failed coup during the storm, and mass gang violence, the JLP has been hammered yet again with the sudden death of Prime Minister Donald Sangster. The mounting crisis has caused new Prime Minister Hugh Shearer to make a public address calling for civility and reconciliation between the militant factions of Jamaica.\n\nThe Iberian Union has sent aid to the island, reaffirming their relationship despite the disaster. President Bustamante has been notable absent during the crisis, with reports of his health declining. Shearer now faces the risk of losing another public figure to shore up his diminishing government."
 JAM_News.11.a: "How can so much go so wrong so fast?"

 JAM_News.12.t: "[Get_newspaper_header]Pro-American Coup in Jamaica Amidst Nationwide Blackout"
 JAM_News.12.desc: "Faced with a hurricane, nationwide blackouts from the Oil Crisis, mass gang violence, and the sudden death of Prime Minister Donald Sangster by heart attack the JLP regime has been overthrown by the Jamaican Labour Party. The coup's leader, a prominent JLP member named Edward Seaga, has announced "a new era of liberalism, dignity and safety," in his first public address to the nation.\n\nRegional experts fear that Seaga will be just as authoritative as Bustamante, with the only difference being his American backing instead of an Iberian one. President Bustamante remains President, but is under house arrest and has made no comment on the unraveling political situation."
 JAM_News.12.a: "The banana has been split."
 JAM_News.12.b: "We had a good thing going there..."
 JAM_News.12.c: "In Kingston, the fog densifies."

