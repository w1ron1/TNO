 POLITICS_ERIC_WILLIAMS_TRI_DESC: ""

 WIN_ANR_Robinson: "А. Н. Р. Робінсон"
 POLITICS_WIN_ANR_Robinson_DESC: "Артур Натан Реймонд Робінсон, народжений 1926 року на острові Тобаго, вже давно є фігурою, за якою варто стежити в політиці Тринідаду. Попри хвороби, що переслідували його протягом усього дитинства, Робінсон досяг успіхів у школі, яку очолював його батько, і зрештою отримав стипендію на вивчення права в Університеті Макґілла в Монреалі, де керував зусиллями зі сприяння створенню міжнародного кримінального органу при університеті.\n\nПісля нетривалої кар'єри помічника адвоката він звернувся до вивчення політики в Гарварді, а потім повернувся на Тобаго, де балотувався за старою англо-канадською системою як переконаний прихильник карибської автономії — позиції, якої він дотримувався і після вступу на посаду у Вест-Індській федерації. Але після Чорної силової революції на Тобаго та падіння уряду Ширера Робінсон був змушений знову піднятися кар'єрними сходами, ставши людиною, відповідальною за відновлення порядку після потрясінь.\n\nГаньба, що спіткала його попередника, лише посилила тягар, від якого Робінсон тепер відчайдушно сподівається звільнитися. Його дружба з Еріком Вільямсом дедалі більше руйнується, і Робінсона почали сприймати як помірковану альтернативу іншим тринідадським політикам. Будучи реформатором, який критикує як придушення Чорної силової революції, так і неоколоніалізм, він може виявити, що тиск, якого зазнає Вест-Індська федерація, вже знищив його політичний порядок денний, перш ніж той по-справжньому встиг розпочатися."

