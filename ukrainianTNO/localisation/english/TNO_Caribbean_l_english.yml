 JAM_flavor.13.t: "A Test From Jah"
 JAM_flavor.13.desc: "The pristine water from the ocean shimmered and gleamed, the sun a perfect orb in its reflection. The boat rocked intensely amidst the swishing and sloshing of the waves, causing some water to splash onto the emigres and into the boat. Apart from the sounds of the natural world and the inevitable cries from children, the boat was completely silent. 172 Rastafarian refugees were here today. Not one of them wanted to be here, for it to have come to this, yet here they were.\n\nMarcus fiddled with a roll of dope in his hand, rubbing his fingers over it in anxiousness. The waves gave the boat a violent shake, jolting the cannabis from his hands. His knee-jerk reflexes gave him grace, as he caught it mid-air, only three feet above the vast abyss of the sea. He cautiously sunk back into his seat, both out of relief and shock. As he went back to fiddling with his joint, he looked across the deck to see the refugees.\n\nOne particular man caught Marcus's eye, Bob Marley, sitting in a boat at the very front of this congregation, the tip of the spear. Marcus began to recollect over those quiet times as he listened to his songs over the radio. In those sorrowful days back in Jamaica — when he questioned his faith and felt all was lost — those songs always brought him back to earth. What he'd give for that familiar feeling right now.\n\nAnother thing then catched his eye, just in front of all of the boats the sight of the Florida coastline finally came into view. After a trip that felt like days, if not weeks, despite certainly not being within the time frame of even one day, it's finally coming to an end. That excited relief within Marcus proved contagious, as all the other refugees began to stand in celebration. Then, multiple cars, filled with armed Americans came to the shore, that's when Marcus realized."
 JAM_flavor.13.a: "Our struggle is only just beginning."

