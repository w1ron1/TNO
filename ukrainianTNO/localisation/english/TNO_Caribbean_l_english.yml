 JAM_News.5.t: "[Get_newspaper_header]Ямайка проголошує незалежність від Британії, Бустаманте оголошено президентом"
 JAM_News.5.desc: "Після масових заворушень у Кінґстоні прем'єр-міністр Бустаманте закріпив своє правління на Ямайці — завдання, за яке він узявся ще після свого першого приходу до влади кілька років тому. Він проголосив повну незалежність від Британії та проголосив Ямайку республікою, ставши її президентом замість генерал-губернатора. Протеже Бустаманте, Дональд Сенґстер, обійняв посаду прем'єр-міністра.\n\nТепер, коли Ямайка виходить з ОВН, вона знайшла нового союзника в Іберійському Союзі. Після заяви у своїй промові про те, що Кінґстонські заворушення були «підбурені Вашинґтоном зі спробою повалити уряд», Бустаманте сфотографували з іберійськими дипломатами, які відвідали Кінґс-Гаус, нещодавно оголошену президентською резиденцією. На прохання прокоментувати ситуацію представники Вашинґтона заявили, що «засмучені бачити, як Ямайка стає на бік авторитаризму»."
 JAM_News.5.a: "Думаю, містеру Сіґі буде цікаво почути наші «занепокоєння» з цього приводу."
 JAM_News.5.b: "Час зайнятися справами."
 JAM_News.5.c: "Від одного колоніального господаря до іншого."

