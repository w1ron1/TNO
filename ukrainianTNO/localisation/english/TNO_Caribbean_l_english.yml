 Caribbean_flavor.93.t: "Ignitio"
 Caribbean_flavor.93.desc: "The first cable came.\n\nOil workers in Trinidad left their stations. Distilling slowed down. Tankers bobbed up and down in the waters, waiting for permission to dock in Port of Spain. A problem, but nothing out of the ordinary.\n\nThe second cable came.\n\nBackdoor talks. Chaguaramas. Nationalization. Theodore Shackley raised an eyebrow.\n\nThe third cable came.\n\nA transcript of Eric Williams' speech. A coordinated strike on American oil. A grassroots protest against American bases in Trinidad.\n\nShackley read each dispatch. Williams made a gambit, Shackley thought. A good gambit in his position. He had the oil; he had the people. But a pair of kings doesn't win you a hand of blackjack. A gambit like this doesn't automatically give you a seat at the table with the American delegation.\n\nShackley closed the folder slowly. One strike wasn't enough to have America bending the knee to little old Trinidad. But it was a small splash in the American lake, one that could reverberate across its entire body. And Shackley can't have any of that in the Caribbean.\n\nOil could stall ships. But oil would not stall the American response. And if the East Caribbean Union wished to speak the language of leverage, Shackley wouldn't have any problem answering them in their own dialect.\n\nAnd while the valves remained shut hundreds of miles away, Shackley was in no rush to turn them back on again."
 Caribbean_flavor.93.a: "Williams has revealed his cards. Let us reveal ours."

 Caribbean_flavor.94.t: ""
 Caribbean_flavor.94.desc: ""
 Caribbean_flavor.94.a: ""

 Caribbean_flavor.95.t: "Bellum"
 Caribbean_flavor.95.desc: ""San Juan doesn't have the authorization for this," the agent said in a low voice. "You really think this is the right move?"\n\n"I know this is the right move," Shackley said. He weighed the options. He understood the risks. Authorization from the White House was simply ceremonial with stakes like these; mindless paperwork that simply slowed his operation down.\n\nThe agent exhaled. "This isn't routine for us, Ted. We're talking about a full-blown invasion here. Landings. Resistance. Something that's about to make international headlines, and you don't want Washington to know about this?"\n\nShackley leaned back, chewing on his cigar. "We've got this under control, Rigsby. We did it once with the Caribbean Legion. Same old shtick with little Trini. It'll just be a token force for Gairy to rile up some kind of resistance in Grenada."\n\nAgent Rigsby shook his head. "They'll learn about it soon, Ted. I want them to hear it from us first instead of some bullshit Washington Post paper."\n\n"So we'll send it to them tomorrow morning!" Shackley slammed his folder shut. "Say our telephone lines got cut or something, Rigsby. This is our chance to reel in Trinidad and the rest of the Caribbean, so I'm certain this move falls under my purview. Certain that the timing here is much, much more crucial than some bureaucrat telling me I got permission. Certain that someone's gotta get this spark going!"\n\nShackley leaned back in his chair, allowing himself a thin, almost imperceptible smile. In the game that was the Caribbean, there was no time to ponder what the next card was before hitting or standing. Sometimes, doubling down was just the right play."
 Caribbean_flavor.95.a: "No transmission or phone call would be sent the next morning."

 Caribbean_flavor.96.t: "Aut Vincere, Aut Mori"
 Caribbean_flavor.96.desc: "From Eric Gairy's vantage point, the sun slowly rose, painting the red background, which faded to orange, with the sea's reflection and refraction painting a shimmering line towards their destination. As the LCI carrying Gairy and his own garrison sailed closer to the shore, he gaped towards the copse of verdant trees, cabbage palm, and seagrove, overshadowing the silhouettes of the road up ahead.\n\nA compunction crept up within Gairy when the landing craft inched ever closer to the sandy beaches. To be the FBI's lapdog, to creep into your homeland as a nefarious invader, killing your own countrymen to steal control for yourself, would it really be all's well that ends well? What would be of his legacy if he loses this bet? He looked down at his legion of soldiers: his own Grenadian defectors, mercenaries from the U.S. and everywhere, and even exiles from Trinidad and Saint Vincent persecuted by Williams' men. Gairy had made it this far when he called for a meeting in San Juan; second thoughts would not do his uniform good now.\n\nThe boots marched forward in unison as soon as the bow touched the grains of sand, with M41 tanks rolling alongside regiments toward destiny. As mutineers disappeared under the foliage towards the road, gunshots and B-26B's assistance from America's airmen snuffed out the quaint beach atmosphere while Gairy's men attacked with defilade fire.\n\nGairy's confidence in the operation rebounded with this steady start. Well-trained men under his command and landings of other divisions all over East Grenada were conducive to the East Caribbean Defense Force losing control of this land.\n\nIt was there that he realized he never admired the cloudless golden hour's splendor before arriving here."
 Caribbean_flavor.96.a: "First Stop: Grand Mal Bay."
 
 Caribbean_flavor.98.t: "Incontinens"
 Caribbean_flavor.98.desc: "Phones rang. Memos were sent. And another hundred boxes of pizza arrived at State Department doors, offering the employees a late-night meal as they worked tirelessly to deal with the situation at hand.\n\nA landing was already underway in Grenada, and the international community pointed its fingers at the United States. However, no one in the White House recalled authorizing such an action. A small room of officials debated about the next course of action. No doubt, the Organization of American States was to convene immediately.\n\nBut discuss what, exactly? Some called to contain Gairy's invasion of Grenada, while others officials saw this as an opportunity to push Williams to back down on his nationalist rhetoric. Both actions carried risk. The invasion was already underway, and backing down could embarrass American foreign policy. But taking advantage of a weakened East Caribbean Union and demanding concessions on Chaguaramas could create hostility, especially if Mexico started backing Williams.\n\nThe ice was thin, and Washington's decision here could define relations with the ECU, Mexico, and maybe the entire Caribbean for the coming months, if not years.\n\nThousands of miles away in San Juan station, Shackley hung up on a frantic State Department employee. Only then did he remember that the memo was never sent to the White House. For a moment, he considered drafting it — for formality. But the moment had already passed."
 Caribbean_flavor.98.a: "Authorization, it seemed, did not apply to men like him."
 
 Caribbean_flavor.99.t: "Inter Aquilas"
 Caribbean_flavor.99.desc: "The phones rang again, but this time, Brasília, Havana, and Mexico City picked up.\n\nHundreds of delegates streamed in while American diplomats quietly prepared their proposals on what they deemed the Grenada Crisis. The Organization of American States did not convene for light matters. Everyone — every nation — in the room seemed to understand the gravity of the situation, the consequences of letting either Eric have their way.\n\nFor America and Mexico, however, Grenada would be a clash over the free world; two eagles circling the Caribbean lake.\n\nThe first proposal suggested putting pressure on Williams to concede on the Chaguaramas issue, thereby allowing the American military base to remain operational in Trinidad. A tempering of his nationalist rhetoric in exchange for American backing. Williams would consider it a win. However, Washington was just fine with getting a friendly government back in Port of Spain.\n\nThe second proposal fully affirmed American support for Grenadian independence and unilateral recognition by the Organization of American States members. It would push the East Caribbean Union — and the rest of the Veracruz Pact — away, but now was not the time to show weakness to strongmen like Williams.\n\nThe third proposal recommended restraint. Call up a vote. Let the chips fall, even if the outcome was unfavorable to American interests."
 Caribbean_flavor.99.a: ""Let's see what deal we can strike with Williams.""
 Caribbean_flavor.99.b: ""It's too late to give up on our man in Grenada now.""
 Caribbean_flavor.99.c: ""We'll keep our stance neutral. Hemispheric stability should fall on the OAS.""

 Caribbean_flavor.101.t: "Fortuna Audacis"
 Caribbean_flavor.101.desc: "The vote wasn't even close.\n\nMexico spoke at length. So did the East Caribbean representatives. Precedent. The illegal nature of the invasion. Their objections were written into the record, but were nothing more than mere words.\n\nSantiago fell in line. Montevideo fell in line. Even Brasília and Buenos Aires managed to agree on the issue.\n\nGrenada was to be unilaterally recognized by the Organization of American States and granted membership immediately. Any attempt to reverse the outcome would be considered a threat to the stability of the hemisphere. Intervention would be considered if necessary.\n\nThousands of miles away, Shackley heard the news over the radio.\n\nNo reprimand; no confrontation.\n\nWashington had managed to seal the deal that Shackley wrote up. Because of the gamble, America managed to take all the Caribbean chips for herself."
 Caribbean_flavor.101.a: "And Shackley was to go down a hero."
 
 Caribbean_flavor.102.t: "Calculus"
 Caribbean_flavor.102.desc: "The vote was close.\n\nMexico spoke first. Then the East Caribbean Union. However, the matter wasn't framed as a rebellion. Restoration. Regional order. Reconciliation. Each word a step back from escalation, bridging off of each other to meet in the middle with the Americans.\n\nThe American delegation made no attempt to escalate either. Intervention was never spoken of. Grenadian recognition was never mentioned. They simply allowed the debate to go where it naturally went.\n\nAnd the resolution passed with a sigh of relief from all sides.\n\nGrenada was to be reinstated in the East Caribbean Union immediately. In exchange, Gairy and his associates would be granted amnesty in the Union. The Williams government would safely remain in Port of Spain, at the cost of concessions regarding American oil and the Chaguaramas peninsula. The Prime Minister swore to never speak of nationalization again.\n\nThousands of miles away, Shackley heard the news over the radio.\n\nNo reprimand. No confrontation. But no commendation either.\n\nEric Williams had dodged Uncle Sam's bullet and won themselves security within the Caribbean. America hadn't gotten as much as they wanted.\n\nBut Grenada was only one island out of a thousand."
 Caribbean_flavor.102.a: ""And Shackley was to go down a controversy.""
 
 Caribbean_flavor.103.t: "Interregnum"
 Caribbean_flavor.103.desc: "The vote failed to gather a clear consensus.\n\nMexico did not yield. Neither did America. Yet, the sharp rhetoric served only to split the Simón Bolívar room.\n\nIt hardly mattered how it was phrased: Liberation or invasion. Freedom or imperialism. Order or chaos. In the end, neither side could force a commanding consensus over their opponent.\n\nThere was neither a recognition of Grenada's independence, nor a concession from the East Caribbean Union.\n\nThe Organization of American States adjourned without conclusion. Reporters clamored outside, awaiting for answers that no one had. Valves across Trinidad remained shut. The waters surrounding Grenada turned an ever so slight darker shade of red.\n\nAnd in San Juan station lay Shackley. The radio silence already told him enough about the outcome."
 Caribbean_flavor.103.a: "And Shackley was to go down a failure." 
 
 Caribbean_flavor.104.t: "Periculum"
 Caribbean_flavor.104.desc: "TOP SECRET/[GetDateText]\n\nFROM OSCAR COTTON\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: RISING TENSIONS WITH EAST CARIBBEAN UNION\n\n1. The vote in the Organization of American States (OAS) regarding Grenada's independence had reached a deadlock. Relations between the OFN and the Veracruz Pact continue to worsen, with both parties (East Caribbean Union and Grenada) unwilling to reach a final consensus.\n\n2. Intelligence assays a miscalculation of American goodwill and influence, including unconfirmed accusations of American support in Gairy's filibuster revolt in Grenada, leading OAS member states to conclude independent schools of thought in the Grenadian affair.\n\n3. In reaction to this political incident, member states of the Veracruz Pact had organized a unilateral boycott of American goods to "reprobate America's deplorable actions." Bystander Caribbean nations may be tempted to defect from American influence, as they may see the event as a "betrayal of democratic principles."\n\n4. The first option to counter the situation is to enter a covert deal with Williams' union to gain our backing against Grenada, although it would require the abandonment of a reliable ally in the periphery of the Union. The second option will be to recommit to a firmly supportive relationship with Grenada, at the potential cost of Williams making further diplomatic advances with Mexico. Our final option would be to bide our time and let Williams be pressured into acquiescing in this new geopolitical standpoint."
 Caribbean_flavor.104.a: "Bring the fisticuffs in a meeting with Williams."
 Caribbean_flavor.104.b: "No reason to lose Grenada after all of this."
 Caribbean_flavor.104.c: "Let Williams squirm."
 
 Caribbean_flavor.106.t: "Bull in a Pit"
 Caribbean_flavor.106.desc: "American lease, American oil. They played Chaguaramas and the Trinidadian economy as a game of cards. Even if the Yanks never promised to be an altruistic overlord, Williams thought the Mexicans would have given enough backing to break the Grenadians. So short-sighted, so naive. He should have heard the American Armada miles away. Was he deaf to even reality?\n\nWorking against the whole OFN, against the Free World would be Sisyphean. Trinidad meant everything and nothing to American bureaucrats. Just a stir from Washington could thoughtlessly crush the Port of Spain. It no longer matters if anyone thinks of him as gutless or if he will soon regret sparing concessions to those imperials. He picked the wrong fight. The Iberians would have made fierce opponents alone. Piles of paperwork, many more stacks of emergencies. The ECU needed to back out before its demise. Williams made no mistake he could not have.\n\nNewspapers are quiet on the deal, Gairy is about as quiet. A mere handwave from the White House had seemingly cut off Gairy from the rest of the world. Fossilized, obscure scandals seeped through the rigid bounds of Grenadian media. What little respect the filibusters earned disintegrated overnight. Grenadians now want their so-called liberators out.\n\nGairy got a one-way ticket out. Without hesitation, he took off for greener pastures. Silence. Just mocking silence. What appeared to be the greatest crisis for the Union's survival was merely a surrender on both sides. Grenadians to Trinidadians, East Caribbeans to their master. The Northern Giant eviscerated both. Monroe may no longer be, but his spirit endures."
 Caribbean_flavor.106.a: "Even the most ferocious beast must obey in the colosseum."

 Caribbean_flavor.107.t: "Diplomacy with a Bull"
 Caribbean_flavor.107.desc: "Diplomats pressed on for days; Williams shut them out for weeks. Ultimately, Grenada is a piece of rock — what matters for the ECU is to prove itself as more than a lapdog to any colonial overlord. Williams did not have to listen to faceless men praising him one moment and insulting him in another. The truth was simple: Grenadians are the same people as Trinidadians; they are East Caribbeans. The filibusters were not popular, but Williams merely had to show the world the truth to stop their guns from flowing in from Washington.\n\nWhen Williams had this revelation, the Yanks turned from offering favors to threatening with force. They ripped off their mask of civilization to show the world the dogs they are. They barked at Williams for Chaguaramas, they snarled at him for barrels of tar. Bargaining like a beast with its prey, and in turn, Williams gave them as much respect as they deserved. When those animals gave him the options of yes and no for conceding to their terms, did they ever intend them as options, or were they meant as a threat? Every step Williams refused to back down, the world came to see more of the Yanks' true face.\n\nInsolence. Insolence was the sin those Yanks had committed. The world had built up enough tolerance for injustices, but none for two-faced liars. They tried to commandeer Trinidad's wealth and lands, and thus deserved neither. When Williams published their dialogues to the world, why was it that they suddenly changed their hearts and no longer wished to grant the Grenadians their so-called self-determination? In a few years, they will crown themselves another emperor, and they will be back as the Caribbean's boldest thug, but that is not today."
 Caribbean_flavor.107.a: "Chains are not enough for a rowdy bull."
 
 Caribbean_flavor.108.t: "Gradus"
 Caribbean_flavor.108.desc: "0812\n\nMexican vessels were spotted off the Yucatan peninsula.\nTheir heading indicated a course towards the Lesser Antilles.\nEncrypted radio traffic indicated coordination with the East Caribbean Union.\n\n0936\n\nTwelve unidentified F-100 Super Sabres entered Grenadian airspace.\nFlight paths consistent with pre-landing reconnaissance.\n\n0952\n\nEric Williams addressed the nation from Port of Spain.\nHe denounced Grenada for refusing all requests to come to a diplomatic agreement.\nWilliams declared that force had become a necessity.1122\n\nUS Naval Intelligence has confirmed Mexican destroyers docked in Trinidad.\nLanding craft were visible on deck.\n\n1534\n\nGrenadian coastal radio has gone silent."
 Caribbean_flavor.108.a: "Shackley extinguished his cigar before the third report had arrived."
 
 Caribbean_flavor.110.t: "Umbra"
 Caribbean_flavor.110.desc: "César was nineteen when the shrapnel tore through his leg. He'd hardly seen the front before he was forced into a hospital bed, sitting out the remainder of the war, devoid of honor and glory.\n\nBy the time he learned to walk again, Spain — or rather the Iberian Union — had already moved on without him. Everyone had a story during the Civil War. César could only talk about how mushy the hospital porridge was.\n\nHe looked up. The coast slowly shrank into the horizon, dissolved by the Atlantic's deep blue. The harbor seagulls became thin scratches against the sky. Distance made everything seem less important.\n\nUnfolding a crumpled piece of paper, he read the leaflet again, double-checking the details. The faded letters spelled an island: Grenada. He once imagined dying for Granada, but Grenada was more or less the same.But it wasn't the cash prize from being a mercenary that drove him on board. It wasn't ideology either. It was ability. Ability to do something history had shut him out of.\n\nCésar never had the ability to fight in the war. César never had the ability to find himself a job that he found satisfactory. César never had the ability to keep himself off the streets. César never had the ability to find himself the man of his dreams.\n\nBut he had ability here. Ability to write history, though small. Ability to tell stories, though distant. Ability to be in control of something, though unknown.\n\nHe only hoped that this time, the shell would land further away."
 Caribbean_flavor.110.a: "Some ghosts never find peace."

 ### Federation NOT Formed

 Caribbean_flavor.114.t: "Sic Transit Gloria Mundi"
 Caribbean_flavor.114.desc: "César inhaled the air. Salt. Cordite. Rot. It was nauseating, yes, but César repressed what he could. The landing craft flotilla had retreated hours ago already. Bodies littered the beaches, lazily covered by any sand kicked up during the skirmish.\n\nThe ringing in his ears since the battle had gone away. He eavesdropped on some passing officers. The Mexican and East Caribbean forces had already abandoned further plans to commit to the island. Eric Gairy, the Grenadian leader, pledged allegiance to the Iberian Union. Some security guarantees. A forward operating base in the Caribbean. Maps to be redrawn over a single island.\n\nBut César didn't find interest in the realpolitik behind it all. Grenada was no Granada. No painters to immortalize the struggle. No songs to carry on its blood, sweat, and tears.\n\nHe flexed his shoulder. It ached where the recoil bruised him. He almost forgot he had fired his gun for hours, defending a patch of land he hadn't set foot on until a week ago.\n\nBut there was no stretcher to carry him out this time.\n\nCésar watched the waves ebb onto the beach, carrying guns and grenades out into the ocean. For once in his life, he had the ability to change something."
 Caribbean_flavor.114.a: "Veni, vidi, vici."
 Caribbean_flavor.114A.t: "In Pulverem Reverteris"
 Caribbean_flavor.114A.desc: "If there was one thing César hated about Grenada, it was the mosquitoes. At least bullets were quick and sharp. Mosquitoes pestered you and would come back for seconds.\n\nThe Iberian intervention had ended in complete failure. There was no charge. There was no effort to actually defend the island. The sight of Mexican warships and East Caribbean landing craft seemed to scare all the mercenaries and Condor Legion fighters away.\n\nAll César could remember were the empty clicks when his rifle inevitably ran out of ammo. The firing pin desperately demanding more ammo as all of César's comrades ran away. But that was to be expected from mercenaries.\n\nHe traced the scar on his leg. The old one from '37. At least that war gave him something to show off. César leaned back and closed his eyes.\n\nThree days in foreign lands. Three days to do something with his life. Now, he's looking forward to spending three years rotting away in this prisoner camp.\n\nThey could take the island. Exile that cowardly bitch Gairy to Iberia. Annex Grenada. He didn't care.\n\nBut they could not take that. That feeling. That rush.\n\nCésar had come. César had fired. César had stayed."
 Caribbean_flavor.114A.a: "Non omnis moriar."

 Caribbean_flavor.117.t: "Post Factum"
 Caribbean_flavor.117.desc: "The ashtray was full now. A cloudy haze clung to the ceiling, wisping and curling its smoke to blur the fluorescent lights above. Manila folders lay scattered across the table. Someone had once organized them, but that time had long passed.\n\nThe muted television in the corner showed an animated Eric Williams flaunting his successes to the people of Trinidad, and to an extent, the people of the Caribbean.\n\nA folder was passed down the table through American suits. Many didn't bother taking a glimpse at it. The refineries in Trinidad were no longer Uncle Sam's. Williams had the premium on black gold right now. Another report rumored that Williams was buying Dominica and St. Lucia into the Union with oil money.\n\nAnother folder was passed. Photos leaked out. Grainy, but a red sun shone through the black and white. The Japanese banner flew high on a ship docking in Port of Spain. Handshakes between Williams and a delegation of besuited Asian men.\n\nThe last of the folders was passed, though noticeably thinner than the previous. San Juan Station. No one wanted to talk about it. No one wanted to know about it. The crisis had already happened, and there were consequences already set out for Shackley.\n\nNo one in the conference room wanted to exchange words about the embarrassment that was the Grenada Crisis. And so, chairs scraped along the floor, jackets were taken from the coat racks, and the Potomac would flow just as it always had."
 Caribbean_flavor.117.a: "The same could not be said about the Caribbean."

 Caribbean_flavor.118.t: "Superbia Ante Ruinam"
 Caribbean_flavor.118.desc: "So this is Field Six?" The American surveyor wiped the fog from his glasses. Through all the pumpjacks, there was a kind of natural beauty to the Trinidadian soil. At least what beauty was left of it.\n\nThe Trinidadian manager nodded. "That's what allyuh call it now."\n\n"Output looks promising." The surveyor flipped through green graphs and data tables. "It'll double once we bring in our equipment. Ever heard of shale, son?"\n\nThe man shook his head. "No, sir."\n\n"Well, it'll be the best goddamned thing to happen to this island." The American clapped him on the back. "How long you been working this field, mister..."\n\n"Anderson." The Trinidadian looked away into the distance, observing the fields up to the horizon. "And I been in these fields since my faddah. Before the oil, we used to plant the sugarcane."\n\n"Well, it doesn't get more profitable than oil." The surveyor chuckled before glancing towards a group of gathered workers, watching the pair's conversation. "Your workers don't mind me walking the site?"\n\n"They jus' observing," Anderson commented. "They ain't ever seen a chupid fella like you before."\n\nThe surveyor smiled, waving to the nonchalant workers. "Well, I'd just like to thank you again, mister Anderson, for your time. Your country's made the right call with America."\n\nAnderson nodded slowly, still refusing to look the surveyor in the eye. "Long rope for magga goat, American." 
 Caribbean_flavor.118.a: ""Means thank you in Trini.""

 Caribbean_flavor.119.t: "Ruat Caelum"
 Caribbean_flavor.119.desc: "Across from Eric Williams, Callaway scribbled some notes down in his folder. "Long flight, Prime Minister Williams?" The American diplomat coughed, eyes impartial to his answer. He pushed forward a small batch of documents to Williams.\n\n"Nine hours and twenty-seven minutes." Williams leaned back in his chair, staring at the ceiling lights until his eyes ached. "And I am greeted with nothing but instructions, and reminders, and memos."\n\nCallaway glanced down at his notes. "Well, the President just wants to make sure we don't run into any misunderstandings. Not too long ago, we were on opposite sides-"\n\n"And that's all well and good, mister Callaway," Williams chuckled softly. His fingers drummed the table. "I suppose if I stayed on the opposite side, it wouldn't have been long before American boots hit the beaches." \n\nCallaway hesitated. "You seem... uneasy, sir. Would you like-"\n\n"Uneasy? No." Williams sat up in his chair. "I suppose having Americans in Chaguaramas beats having Americans all over my country."\n\nCallaway scribbled something down in silence.\n\n"But, a word of advice, mister Callaway." Williams took his pen out, scribbling his signature on the treaties in front of him, hardly reading through them. "Although it may not be me..." Williams pressed harder on his pen. "Someone else will fight for the Caribbean."\n\nThe pen tip shattered. Ink spilled all over the table."
 Caribbean_flavor.119.a: "Fiat justitia."

 Caribbean_flavor.120.t: ""
 Caribbean_flavor.120.desc: ""
 Caribbean_flavor.120.a: ""

 Caribbean_flavor.121.t: "Mare Nostrum"
 Caribbean_flavor.121.desc: "Eric Gairy loosened his tie. He could still hear the roars of applause echoing off the walls. He could still remember smiling for the cameras, maybe a bit too much. He could still remember shaking the American delegates' hands, maybe too excitedly. But he remembered best of all the people chanting their newfound identity. No longer citizens of that dastardly East Caribbean Union.\n\nGrenadians. It had a better ring to it.\n\nGairy lifted his glass, taking a sip from it. He let the liquor sit on his tongue, savoring the warm burn. Then came the oak; the caramel; the citrus. It was hard to beat local Grenadian rum.\n\nFor weeks, he'd been hunted by whatever soldiers Veracruz could muster. But after all the heat the East Caribbean Union had given him, after all Gairy had done to keep them at bay, he was left with only the sweet fruits of Grenadian independence.\n\nHe leaned back in his leather chair. His wrist still ached from all the agreements he signed earlier that morning. He didn't even bother reading any of them. Trade agreements. Military access. Mutual defense. Whatever the Americans offered was only in the interest of Grenada. At least much better than whatever Williams had subjected Grenada to.\n\nGairy still remembered arriving at San Juan with only the clothes on his back, and maybe a bit too much energy. But that energy got the attention of Agent Shackley, and Shackley pulled off one hell of a miracle for him.\n\nFor the first time since his exile, he felt... alive. No. Alive wasn't the right word. Alive was his exile, his escape from Williams.\n\nCalm. He felt calm."
 Caribbean_flavor.121.a: "The waves would ebb as they always had."

 Caribbean_flavor.122.t: "Nova Umbra"
 Caribbean_flavor.122.desc: ""You haven't touched your coffee, Stevens." Hathorne gestured to the now-cold mug. "Not planning on staying up tonight?"\n\n"What's there to do tonight?" Stevens scoffed, pushing the mug away. The intelligence officer had no intention to investigate the Grenada debacle any further than he already had. No one did.\n\n"Well, I gotta write up something for the State Department. Best I get the details right, so let's get this discussion wrapped up..." Hathorne exhaled. "...What the hell happened in San Juan?"\n\nStevens sighed. How many times did he have to retell the story? A dozen? No, it was much more than a dozen. Every time he told it, it seemed to sound more absurd than the last. How the hell did Shackley "forget" to ask the White House for authorization?\n\n"President shouldn't be concerned with that." Stevens deflected. He sifted through the folders and picked out a grainy photo. "That for sure ain't an American flag on Grenada."\n\nHathorne took a closer look. In the black-and-white was the green, yellow, and red. A new contender in the Caribbean. "You're shitting me, aren't you, Stevens?"\n\n"Afraid not," Stevens replied. The Iberian Union had a history of meddling with the Western hemisphere. This was more than meddling. This was Iberia taking a piss in America's backyard. "Listen, we've already got plans lined up for Shackley and his goons. FBI's don't got plans for these Spanish fucks. That's for you and the president to figure out."\n\nHathorne didn't answer. He kept staring at the photos, hoping the flag would change. "It's just an island," he finally muttered."
 Caribbean_flavor.122.a: ""You and I know it's a lot more than that, pal.""

 Caribbean_flavor.123.t: "Regnum Meum"
 Caribbean_flavor.123.desc: "The tide rolled onto the Grand Anse. The Caribbean sand shimmered like gold under the afternoon sun. Gairy took a sip from his brandy, straight from Jerez. He preferred it over any local brew in Grenada.\n\nBehind him, a pair of Condor Legionnaires harassed a group of locals. There was some shoving. Some exchanges. Some cracked skulls. Grenada had lacked that kind of order before. He took another sip of his brandy.\n\nToday was a rest day. No speeches in this sea breeze. No celebrations in this calm weather. There was a kind of sound, or rather silence, that stability carried. He'd won after all. What was there more to do?\n\nWilliams had always called him reckless. Washington never truly trusted him. And the OAS? They didn't know how to do anything but sit on the fence and chase after every stick Uncle Sam or Veracruz had thrown at them.\n\nWithout Iberia, Grenada would have been nothing. With Iberia, Grenada was his. His kingdom to oversee. His kingdom to rule.\n\nHis kingdom did not concern itself with the men it detained. His kingdom did not concern itself with the reporters beaten last night. His kingdom only cared about a Grenada stabilized on the map. His kingdom was a canvas.\n\nAnd Iberia had no qualms with giving up the brush."
 Caribbean_flavor.123.a: "He sipped until nothing was left."

 Caribbean_flavor.124.t: "Uncle Sam at the Port of Spain"
 Caribbean_flavor.124.desc: "Partial transcript of Prime Minister [TRI.GetLeader]'s speech from a rally, from the United States Library of Congress, archival date [GetYear].\n\n"-nd there will always be problems, especially in the current political climate around the world. Colombia was a miserly, awful affair. The instability in Venezuela, so close to our shores, was yet another vehicle for tragedy that has ravaged the region far too often. All the while, the Caudillos in Iberia, the Emperor in Tokyo, and the Führer in Germania all converge on the Caribbean, teeth bared like sharks in the water.\n\nThis is precisely why the West Indian friendship with the United States is among our highest priorities. Trinidadian Oil is one of our island's greatest resources, and a mutually beneficial deal with Washington is the least that their people and ours can do to accommodate one another. I need not impart unto you all the reasons for this.\n\nI will speak plainly to all of you. These anti-American protests in the interior have been ongoing for several months now and are more than a passing concern. I am confident that the OFN nations have only the best interests of our godly island at heart and that we can count on all of you to ensure the security of our people if political violence ever becomes a reality. Furthermor-""
 Caribbean_flavor.124.a: "END OF RECORDING"

 Caribbean_flavor.125.t: "Fear of What is to Come"
 Caribbean_flavor.125.desc: "The Grenada Crisis had provoked many frantic State Department meetings. Williams had been consolidating power at a rapid rate, and his rhetoric had emphasized confrontation with the Americans and sovereignty over their island. Military planners had not liked the idea that either the army base or the naval yard on Chaguaramas would be potentially under threat by the Grenadians. Regional defenses in the Caribbean, from counter-insurgency to drug smuggling, depended on Grenadian positions. Losing those would be a key setback for the region.\n\n"I don't think he'll actually look to seize any key assets," Gregory O'Brien, a State Department official, rubbed his hands nervously. "He's just playing to his base."\n\nLieutenant General Frank Nelson, SOUTHCOM aide, was less sanguine. "I'm not staging our defensive preparations on optimistic maybes, Mister O'Brien, I have men's lives to consider! We'll be upping our defensive posture in the event that he makes moves around the base."\n\n"That's what he wants, to have us make an aggressive move to further rile up his power and put pressure on Washington. We can't risk it." O'Brien countered.\n\n"Gentleman, I think it's time for a lighter touch," came the voice of Victor Black, the CIA liaison. "We should look to more...covert methods of securing ourselves. Should we rid ourselves of Williams, the island would find itself with far more pressing concerns than a pair of military bases.""
 Caribbean_flavor.125.a: "Keep our options open."

 Caribbean_flavor.127.t: "Tightrope Tripwire"
 Caribbean_flavor.127.d: "Eric Gairy's smile was as broad as the horizon, his eyes beaming at a bright blue sky, the crystal clear waters and verdant green trees on St. George's Harbor as a backdrop. His supporters bounded around him, waving flags and shouting his name like it was a blessing from almighty God. But most of all, the men of the U.S. Marine Corps, lined up along the platform like fine China, appeared like pillars holding up his newly reestablished government.\n\nAll of it spoke to the same prerogative: The Veracruz Pact's plot to back the ECU overthrow in Grenada was dead in the water. The presence of U.S. filibuster troops was a walking hard line against foreign intervention or domestic insurrection, one that could not only resoundingly put down a coup d'etat spearheaded by Mexico City and Havana, but even if that somehow failed, the U.S. would have a casus belli to reinforce Gairy's regime at a moment's notice.\n\nA miracle in paradise, Grenada was freed from encroachment by Williams's centralization and, in so doing, affirmed the island's independence from the rest of the East Caribbean Union. Amazingly, Gairy's wild, outside bet on American involvement somehow worked, and the tiny, tropical atoll belonged to him now."
 Caribbean_flavor.127.a: "Another day of gardening in America's backyard."

 Caribbean_flavor.129.t: "When the Domino fell on Paradise"
 Caribbean_flavor.129.d: "That perennial God-damned press photo of Eric Gairy at St. George's Harbor was still looking at him, laughing at him, when William Hastie slammed the telephone down. He had been on the line with just about every voice of anger from western Barbados to the Port of Spain for the past three weeks, the colorful accents and even more colorful profanity of almost everyone in the Caribbean still ringing in his ears.\n\nGairy had a deal with the devil in the people who purchased the guise of an angel through the blood of nearly every nation and ethnicity in the West Indies. Statements from nations all over the free world, even those within the OFN, all pointed to the U.S. Marines in Grenada as deliberate provocation to destabilize the East Caribbean Union and put the boot to the Veracruz Pact's plans in the process.\n\nHastie pushed his way out the door onto the veranda, the clear blue sea churning white against the rocks beneath him. It was overcast that day, just like it had been the past three weeks. The principal thought buffeted at him over the phone was now the singular thought running through his head, staring out of the distant horizon.\n\nWho would be next?\n\nCuba, Nicaragua, Venezuela, Panama, Grenada. The Caribbean had no shortage of victims of the American 'diplomatic' itinerary and had been unwilling participants in it long before now. Plausible deniability was fully out the window; all bets were off. All of this profound chaos, this upending of everything, just because of the American paranoia over the base at Chaguaramas, squabbling with their neighbors over it like a child's toy?"
 Caribbean_flavor.129.a: "The seas of the Caribbean stretched far away, as did the fear and anger of the people who lived there."

 #
 Caribbean_flavor.200.t: "A Bird's Eye View"
 Caribbean_flavor.200.desc: "For such a small island, Theodore Shackley thought, Vere Bird's estate was certainly striking. The building itself was relatively small, and much of it remained largely empty, but walking through, he could still see furnished gifts from Canadian and American functionaries given centre-stage in the halls that he quickly moved away from. With the collapse of the West Indies Federation, he had issues in mind more important than heirlooms.\n\n"It's good to see you here, Theodore." spoke Bird, looking up only after he finished his sentence. "You really should have notified me of your visit sooner; I would have loved to give you a full tour."\n\n"Perhaps I will soon enough, Vere, but the situation is urgent right now," replied Bird, furrowing his brow as he sat down. "We've been watching your administration of these islands, and we think that strongmen like you are the people best suited to keeping a hold of...rational discourse in these isles."\n\n"I'm glad to hear of your endorsement," responded Bird, smiling warmly. "I won't let you down. But I will say that I don't have all the power in the world, even in my own pair of islands."\n\n"No?"\n\n"The Progressive Labour Movement have been getting powerful recently, and nothing good can come out of them." Bird's face grew cloudier as he turned his head downwards. "If they're not marching down our streets, they're praising Castro. And they continue to climb in support. If they win this next election..."\n\nShackley met Bird's concern, silence hanging in the air. Castro was a reasonably trustworthy partner for now, but he knew that once he had the partners to work on a more radical policy with, such ties would fast falter."
 Caribbean_flavor.200.a: ""Perhaps the FBI could help with that, Vere.""

 Caribbean_flavor.201.t: "Operation Catnip"
 Caribbean_flavor.201.desc: "CONFIDENTIAL/[?global.date.GetDateStringNoHourLong]\n\nFROM SAMUEL ROSE\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: OPERATION CATNIP\n\nPrime Minister of Antigua, Vere Bird, has been guaranteed to win the upcoming election due to the work of his own Antigua Labour Party and due to the work of US intelligence services.\n\nWhile common tactics like spying, ballot stuffing, bribery, blackmail, and disenfranchisement have been used, new tactics focusing on delegitimizing and alienating the Progressive Liberal Party have also been used against George Walter and his allies.\n\nReporters have been bribed to accuse the PLP of being Bukharinists, Nazis, Anti-OFN, Fascists, and other inflammatory ideologies. Due to this, the PLP campaign has mostly been spent defending themselves from the accusations, while doing little campaigning against the ALP.\n\n"
 Caribbean_flavor.201.a: "I wouldn't vote for a Bukharinist Nazi." 

 Caribbean_flavor.202.t: "Business as Usual"
 Caribbean_flavor.202.desc: "For the tourists sitting on Jolly Beach, it was just another relaxing day. The sun continued to beat down on the crowds relaxing at each beach, with only sunburns prompting some to huddle beneath their umbrellas. Radios played music over bars pouring out cocktails, only occasionally interspersed with brief reports detailing Antigua & Barbuda's constitutional crisis between low-grade stories about the United States. Waves gently washed over beaches with sands almost bleached white, their course softly echoing in the wind.\n\nThen, the silence was broken. Cars drove past, then trucks thundered down. Small bands of soldiers, marched ahead behind them, attention beginning to turn people away from their beaches and drinks. As military vehicles worked to empty otherwise busy streets, some tourists began to talk among themselves, worrying about impending chaos, about the need to book flights out of the country, on how they needed to contact friends, family and reporters about what was happening in Antigua.\n\nEventually, as a few tourists began to pack up, a handful of policemen walked over, one making himself known as a local leader. Smiling warmly, he opened his arms out, pledging that there wasn't any real threat to them. As long as they stayed on their beaches and continued to soak in the warm atmosphere of Antigua, he stated, they would have nothing to fear. They could return to their drinks, unimpeded by concerns over issues beyond the need for their concern.\n\nSo, the tourists settled once more, doing little beyond holding onto their hats. A few still murmured about getting their passports in order, but most simply shrugged off the events as a funny occurrence, as local politics that did not concern them. For most, the wispy clouds simply faded into the background beneath new waves and fresh cocktails. And beneath it all, the radio continued to play its music, no longer staggered by internecine reports on local politics."
 Caribbean_flavor.202.a: "For the tourists sitting on Jolly Beach, it was still another relaxing day."

 Caribbean_flavor.203.t: "All Expenses, Paid Up Front"
 Caribbean_flavor.203.desc: "In the last few months, Bird thought, his meetings with Theodore Shackley had been drying up, but it was something to welcome. It was a sign that the immediate crisis of the Federation's collapse had ended, and that the FBI had gotten used to its new institutions. Skimming over a report detailing the arrest of activists from the Progressive Labour Movement, Bird smiled.\n\n"I have to say, Theodore, your actions have been so helpful to us." said Bird, breaking the silence. "They've really helped stop this country from falling to Castro's deluded Bolshevism. Our country and the United States are going to be wonderful partners in the decades to come."\n\n"Well, that is good to hear," replied Shackley, flat but exhaling as he leaned backwards. "Now that work is starting to calm down, and that our agents aren't expecting there to be any crises in the months to come over here, me and my wife have been talking about a short holiday somewhere."\n\n"You're looking to go on holiday? Why didn't you say so earlier?" replied Bird, taken slightly aback. "I have some close friends in high places here, and few places are higher than tourism here. There are a few vacancies for this one ensuite hotel, and I should be able to book you a slot. Normally, you'd only be able to get this care with a lot of money, but you've more than paid your dues to us."\n\nShackley pondered for a moment, but let his indecision turn to diplomacy. "Well, my wife has talked about getting away from work..."\n\n"And you would be! What person wouldn't appreciate a holiday next to some of the best beaches and oceans in the world, tended to by some of the finest staff this side of the world?" Shackley's hand remained clasped on his chin, but Bird could tell that he was being won over."
 Caribbean_flavor.203.a: "An island-hopping campaign of a new kind?"

 Caribbean_flavor.204.t: "Northern Migration"
 Caribbean_flavor.204.desc: ""That's a Birdie!" Vere Bird yelled out to his cabby. It was hole 12 for the ex-Prime Minister and a gang of Belgians who had also been exiled from their old country. It didn't put them down much, Sullivan County Golf Club was a good place to spend their retirements. New England was a haven for exiles, letting them hobnob and brush shoulders while still being out of politics.\n\nFrom the distance, a man was jogging towards the group, out of breath and shouting for "Mr. Bird." When he caught up with the group, he explained himself, "Hello," he panted, "I'm a reporter for the New York Times, I-I was hoping to ask you a few questions."\n\nBird thought for a second, and waved off his friends, "I'll catch up with you all later," he told them before turning back to the reporter, "What did you want to ask?\n\n"Many have been wondering why you've left Antigua after your recent loss, do you care to explain?" Asked the reporter, wiping some sweat from his brow.\n\nBird laughed before suddenly getting serious, "If you think that I left because of some butthurt feelings you'd be wrong! George Walter is a dictator in the making, a protégé of Hitler and the like! If I stepped foot in Antigua he'd have me imprisoned and killed within the hour!"\n\nThe reporter quickly took down notes before asking, "Some have said that the reason you've come to the United States is because of corruption charges by the Walter government, with you allegedly coming here with embezzled funds."\n\nBird didn't laugh, and looked at the reporter with a flat expression before saying...\n\n"
 Caribbean_flavor.204.a: ""That is a lie.""

 Caribbean_flavor.205.t: "Picking up the Pieces"
 Caribbean_flavor.205.desc: "He hadn't been in the halls of the West Indies Commission for a few years, but William Herbert hadn't needed to be there until now. The West Indies Federation had dealt with the issue for him for years, and he saw no need to intervene in their affairs. That was, of course, when the federation still existed. Now, faced with the glares of a selected committee of American and Canadian diplomats, he struggled to find a way to continue.\n\n"It's a shame that the Federation fell apart so quickly." he began, waiting for the rest of the committee to finish reading their prepared notes. "There's only so far that nations of our size can go to preserve ourselves, and I had high hopes that our federation could help the Caribbean to prosper."\n\nOne member, Benson Russell, nodded. "When we were negotiating this, we expected the Federation to be a long-term settlement. It is disheartening to see just how quickly it fell apart, especially with how damaging the Oil Crisis has been for international stability."\n\n"Even a smaller settlement has its issues." Herbert continued, grimly. "If you look at Page 10, you can see just how difficult it was for me to prevent Anguilla from seceding itself, and the underlying tensions and concerns remain."\n\n"That worries us too," responded Hastie. Herbert remained quiet as he scrutinised the man; the past decade had not treated Hastie well. "We think other forms of regional cooperation, and especially a union of the Leeward Islands could still work out. It wouldn't face the same issues with geography or demographics the WIF did."\n\nHerbert nodded, but only softly. "That could work, but I'm still hesitant. I've met with Vere Bird, and if what he tells me about the situation in Antigua is true, then we might have to deal with a hostile government soon." As he raised the point, a few began to dispute the issue, highlighting potential responses to such a collapse."
 Caribbean_flavor.205.a: "Contingencies spinning out of contingencies."

 Caribbean_flavor.206.t: "A Customer's Complaint"
 Caribbean_flavor.206.desc: ""Without this federation, the promise I made to my people is broken," William Herbert said to the other line. After the West Indies Federation failed to unite due to Jamaica's situation, he was angry, angry at the Jamaicans and the US who had let the project fail. "I am screwed."\n\n"I understand that Mr. Herb-" the secretary of state spoke before being cut off by the phone, "I don't think you do. This would be the biggest thing to happen in the Caribbeans since the Europeans left and you gave up on it because one country left." The secretary listened silently, it was better to let him burn himself out.\n\n"A few arguments at the conference and you get too scared to go forward. We can still make a federation with or without the cavemen that run Jamaica!" The call continued like this for a while with the Prime Minister ranting and yelling. When he finally stopped, the secretary of state breathed a sigh of relief and said..."
 Caribbean_flavor.206.a: ""Thank you for your comments.""

 Caribbean_flavor.207.t: "Reversing to the Mean"
 Caribbean_flavor.207.desc: "The yellow glow of the Moon rested heavy on the waves, refracted across the seas. A large boat plowed through, cresting the seas beneath. Looking over the stern, a handful of American mercenaries reared guns, checking that nobody had detected them, and that no threat was coming overhead. Departing from their hideout in Barbuda without being discovered was risky, but nothing that a few well-placed bribes were unable to resolve.\n\nOver the horizon, the island of Nevis dully rose ahead. That was the first part of their plan, and perhaps their most time-sensitive. A few separatists from Nevis had reached out to them, offering money and continued patronage should they help to secure the island. That rapidly developed into a much more lucrative offer from the People's Action Movement: free rein over Nevis and a greater amount of money to help kidnap Robert Llewellyn Bradshaw, force his resignation, and install a moderate, amenable leader.\n\nRudolph Sargeant, the ringleader, turned to a handful of men around him. They were expecting more volunteers, but even their present numbers were enough. As they waited, they grumbled about the stories they'd heard about Bradshaw: his nationalizations, his callous treatment of dissenters, the internal issues within his trade union and political party. Some of them were true, a handful believed them, and a couple even cared. What doubt lingered was more than plastered over with dollars.\n\nThe island loomed overhead now, the boat landing smoothly. Taking a moment to leave the ship, Sargeant gave an empty handshake to the people around him, representing both groups, exchanging mere confirmations of weaponry before moving them onto the boat. A small handful, unreliable though they were, stayed on the island, ostensibly dedicated to seizing Nevis. At some point, those nationalists would have to be betrayed to ensure the mercenaries received their due."
 Caribbean_flavor.207.a: "Best if that betrayal came through an empty gun"

 Caribbean_flavor.208.t: "First as Tragedy..."
 Caribbean_flavor.208.desc: "Sunrise slowly inched over the island of St. Kitts, responded to by the band of mercenaries with a tone of bitter silence. Rudolph Sargeant peered across the landscape around him. Beyond the crashes of the waves behind him and the rustles of trees to his right, total silence pervaded the air. He grimaced, the sunlight only revealing that the forest in front of him was barren of anything other than sticks.\n\n"Still nothing," grumbled Sargeant, taking a look to his left and then to his watch. He had been told by the PAN members he had met with that somebody would come past. He had been promised that the Nevisian separatists would've seized a government office, or a radio tower, or something by now. All he had gotten was silence.\n\nBy now, the band of mercenaries had grown restless. "So, when are we actually going to coup them?" groaned one, forcing himself up.\n\n"When they get here, alright!" snapped Sargeant, fiddling with the radio dial. They had a tight schedule, and had already fallen an hour behind the point Bradshaw was meant to be in their custody. St. Kitts and Nevis was meant to wake to a new political order, backed by mercenary arms, but what they now had were a few confused men, no better than tourists.\n\n"We could probably still do this if we're quick, you know," replied another, tugging his gun slightly to his chest. "It'll be sloppy, but it's not like the Kittitians will have enough manpower to really repel us."\n\nSargeant shook his head. "At this time? There'll be enough police to block the roads, and that'll give Bradshaw enough time to call for help. If we don't get shot, we'll be stuck there until somebody arrests us." As he spoke, a police car swerved into view from his left. A single swear muttered under Sargeant's breath struck in the final nail."
 Caribbean_flavor.208.a: "Stranded in the object of their derision."

 Caribbean_flavor.209.t: "Repairing the Damage"
 Caribbean_flavor.209.desc: "Ambassador Finch sat uncomfortably in his chair, its cushioning a bright red patterned with green, struggling to contain his frustration. It wasn't the diplomatic measure itself that he opposed, nor his presence in it. He was the ambassador to St. Kitts and Nevis, after all, and those mercenaries threatened to set back American relations in the Caribbean by decades. Rather, it was just how long, and how loudly, the meeting of the Kittitian cabinet seemed to roll through, and how much longer it felt it took for the members to leave.\n\n"Come in," spat Robert Llewellyn Bradshaw as the door finally slammed shut.\n\nImmediately following through, Finch offered an outreached hand, but only received a slight frown in return. "It's a pleasure to see you again, though the circumstances are..." Finch meandered for a moment, struggling to manage the question, "...not so pleasant."\n\nBradshaw turned his gaze, his frown turning to a grimace. "I presume you were hoping to be with those mercenaries in Nevis instead?"\n\n"Mr. Bradshaw, I can assure you that we had no part in the attempted coup," replied Finch, his mind dismissive as he looked around. There really wasn't that much keeping the man in office, he thought, and little Bradshaw could surely do to fight back. "Those were a handful of rogue agents, exploiting the whims of a few Nevisian radicals. We had no involvement, and will seek to prosecute them as harshly as possible."\n\nBradshaw remained silent for a moment, but shrugged his shoulders. "Well, if you insist. I suppose there's room for a few blind spots to come through, especially with men of this kind." He was now certain; the United States could have overthrown Bradshaw. "We've gotten more than enough to shrug this off as a mere blip." He offered an outreached hand, one met this time."
 Caribbean_flavor.209.a: "And so, the clasped fingers grew unclenched."

 Caribbean_flavor.210.t: "A Lost Cause"
 Caribbean_flavor.210.desc: ""Robert's in here!" whispered Rudolph Sargeant, lowering his gun. The landing had gone as well as they had hoped so far, a handful of hapless police officers notwithstanding. They were on schedule, with no unforeseen difficulties, and with no casualties. He'd seen no news from Nevis, but wanted none to begin with. The Prime Minister's mansion loomed, and he kn-\n\n-BANG-\n\nThe shot came from within the house. Sargeant's immediate impulse to call for calm brought silence for a moment, quickly met with a full volley of gunfire on both sides. As he threw himself back to the sidelines, he took a moment to look into the corridor. Those same police officers he had seen earlier were now in the central lobby, backed up by another row of officers holding shields. He looked down for a moment, seeing a body bleeding out, before a stray bullet forced his head back.\n\nSargeant tried to rationalize it. His men were still numerically superior and still had the firepower. The "mansion" was tiny, and if Bradshaw were alive, he couldn't get far. Firing blindly, he attempted to rally his men, but they faltered. First, one was struck down by a blow to the leg, and then another in the chest. The men surrounding the building simply disappeared. As he took another look, he saw the body being dragged back; it wasn't Bradshaw, but merely his typist, groaning in pain.\n\nSargeant forced himself out of his hiding position, trying to hide behind the body of one of his mercenaries, but that simply surrounded him with more pain. By now, he was clearly outnumbered, but was out of options beyond pushing through. If only they could push through, he called out, the arrest would still be child's play. He got one last look back, seeing his mercenary force rapidly dwindling to death and desertion, before a bullet cleanly burst through his skull, killing him on the spot."
 Caribbean_flavor.210.a: "The fillibuster gets fatally fillibustered."

 Caribbean_flavor.211.t: "Unsanctioned Coup in St. Kitts and Nevis"
 Caribbean_flavor.211.desc: "SECRET/[GetDateText]\n\nFROM OSCAR COTTON\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: ERRONEOUS ATTEMPTED COUP IN ST. KITTS AND NEVIS\n\n1. A small band of mercenaries attempted to overthrow the Kittitian government last night by kidnapping Prime Minister Robert Llewellyn Bradshaw, receiving some aid from opposition groups in the process. Although swiftly quashed, the sudden nature of this incident has concerned many in the Caribbean, and action could avert a wider diplomatic fiasco.\n\n2. The coup attempt was not sanctioned in any way by us, but their connections ran deep. Most actors in the region prematurely assumed this to have American backing, and are either dead or have distanced themselves. Bradshaw seems to be shaken and paranoid, but is still willing to engage with our mission in Basseterre.\n\n3. The coup's quick failure has relegated it to a joke in our press. However, news agencies across the Caribbean have identified this as central to our policy, and Mexican agents have used that to further regional distrust of us. Our innocence will likely be broadly accepted regardless, but a new shipment of aid, especially surrounding arms for Kittitian security forces, would doubtlessly help our case."
 Caribbean_flavor.211.a: "Send them additional aid. Let's prove that we're still on their side."
 Caribbean_flavor.211.b: "Making a move like that risks appearing like we're saving face. We're innocent; we should hold off on their attempted blackmail."

 Caribbean_flavor.212.t: "Under Lock and Key"
 Caribbean_flavor.212.desc: "Alasdair Keene's cell was a grizzly sight. It had at least been emptied of its other inmates, but between the cracked, mossy walls, poor lighting, and the blanket bed, his solitude was a bare blessing. During the gunfire, he had been thrown back by a stray shot to his shoulder, but he'd survived, his gasps audible through the wreckage, and after being given the bare minimum to ensure he wasn't bleeding out, he had been thrown directly into prison, seen by nobody but a guard flaunting his disgust.\n\nSuddenly, the cell's door was forced open. "Some of your friends came by to visit!" shouted the guard, dismissively, as nine people were thrown in, forcing Keene to the back and searing his left shoulder in pain. He could recognize a few, if only their faces, from the coup - half the Nevisians, half from the PAN - but found himself associating with the remaining, captured mercenaries.\n\n"Alasdair?" asked one muffled voice attempting to jostle his way closer. "It's me, Colin Tomkins!" Alasdair attempted to break through himself, raising his voice in confirmation. "How long have you been stuck here?"\n\n"Since I was blasted in that damn shoulder." By now, the pair had roughly pushed themselves into place. "I'm guessing your charge failed?"\n\nColin tried shaking his head, and the sentiment almost bled through. "Got close, but the moment I heard the radio blare about a shootout, I knew it was over." Colin pointed at the guard's gun. "Notice that? New model. Apparently being tested by the American military right now. Not even the police get that much."\n\nKeene shook his head. Obviously, that was new equipment. So new that it hadn't even been used against them. If that was the case, he thought then it was clear where America stood on the coup attempt, and how far it would go to recover them."
 Caribbean_flavor.212.a: "Stranded in a country"

 Caribbean_flavor.213.t: ""
 Caribbean_flavor.213.desc: ""
 Caribbean_flavor.213.a: ""

 Caribbean_flavor.214.t: "St. Kitts and Nevis Embracing Mexico and Cuba"
 Caribbean_flavor.214.desc: "TOP SECRET/[GetDateText]\n\nFROM OSCAR COTTON\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: MEXICAN AND CUBAN AID REACHING ST. KITTS AND NEVIS\n\n1. Security forces in St. Kitts and Nevis have begun seeking aid from Mexico, rather than established dedicated channels, and Kittitian security forces have begun to increasingly work with Cuban training programme. Repression of political dissidents, including pro-American voices, has risen greatly. This policy marks a clear geopolitical realignment, and indicates that their prior shift will not be momentary.\n\n2. Frustration with Sargeant's attempted filibuster has been a regional constant, and our lack of direct response to it beyond public condemnation has furthered established conspiracies. Meanwhile, Mexican weaponry has increasingly been used within the Kittitian security forces, which has begun training in Cuban territory. Prime Minister Bradshaw has also made numerous visits to Havana in recent weeks, extolling the virtues of their alliance and calling for Caribbean unity.\n\n3. A sudden policy change from us will likely not restore our past ties. Recent diplomatic overtures have indicated that Bradshaw is deeply paranoid of a second coup attempt and is the key barrier blocking American investment. With him consolidating power, it's likely that a purge of the diplomatic corps is imminent, and that a firm drift away from us will be ensured."
 Caribbean_flavor.214.a: "FIDELITY, BRAVERY, INTEGRITY"
 
 Caribbean_flavor.215.t: "Homesick"
 Caribbean_flavor.215.desc: "As the din of conversation around her lit up, Catherine Octalien struggled to take her mind off the day behind her. For how little pay she got for it, working as a cleaner in a high school was a tough job. Today, a number of students had brought in nearly a keg of alcohol, but had failed to keep it down, forcing her to clean until late at night. Her sole indulgences were spending Friday nights at her local diner and reading the Caribbean Onlooker, a small newspaper written for the Caribbean diaspora across Miami.\n\nGEORGE CHARLES TO SEEK LAND REFORM IN ST. LUCIA\n\nOctalien read through the headline with surprise, then excitement. She had once followed Charles' career with some interest, and had even considered volunteering to join the St. Lucia Labour Party, but demands on her homestead forced her to reconsider, simply watching with some excitement from the sidelines. Of course, that was back when she could still afford to live in her country. Before the privatizations.\n\nNothing hurt as harshly as the letter of eviction she received. After the Metayage land her family had farmed for generations was sold off, it was seized by the United Fruit Company, then immediately razed and replaced with a banana farm, being subsumed into the growing mass around her. With that, she was forced out for employment, first to Castries and then, once that failed, to the United States.\n\nThis news, however, offered hope. Perhaps she could finally return home? She looked up from her paper and towards the plate served in front of her, feeling a churn at the fruit flung onto their side. The United Fruit Company had spent millions buying out half of the island for its own uses, and had the resources, the international backing, and the grit to push back. Even if she did return to St. Lucia, there was no chance that she'd get it back without going through every lawyer associated with the company."
 Caribbean_flavor.215.a: "And so, once again, she had to content herself with watching from the sidelines."
 
 Caribbean_flavor.216.t: "A Sickly Green"
 Caribbean_flavor.216.desc: "TOP SECRET/[GetDateText]\n\nFROM OSCAR COTTON\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: SUCCESSFUL ORGANIZATION OF ANTI-BOLSHEVIST ACTIVISTS IN ST. LUCIA\n\n1. Our efforts to organize opposition to St. Lucia Prime Minister George Charles' nationalization plan have succeeded. A pair of demonstrations organized in both the capital of Castries and Bisée have exceeded expected figures, and offer valuable insight into both who regionally oppose Charles' agenda and what messaging will be most effective.\n\n2. Two demonstrations were organized in the largest settlements on the island, Castries and Bisée, with aid from sympathetic politicians and agents in the Progressive Party. No counts were taken, but the number of participants in both exceeded a thousand, gathered from the middle class and wealthier peasants who raised concerns over losing land and of radicalism.\n\n3. The consequences of this meeting should be clear. The message of our efforts from this point forward should focus primarily on economic concerns, highlighting the risk that nationalization would bring to the agricultural base that drives St. Lucia's economy. We should also seek to raise the profile of John Compton, the leader of the Progressive Party, and currently a viable and popular opposition figure."
 Caribbean_flavor.216.a: "FIDELITY, BRAVERY, INTEGRITY"

