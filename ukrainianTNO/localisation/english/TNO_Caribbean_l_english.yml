 JAM_News.18.t: "[Get_newspaper_header]Left Wing PNP Claims Victory in Jamaican Elections"
 JAM_News.18.desc: "Once more, the People's National Party was proclaimed victorious in recently held elections, retaining the helm it has held over the Republic of Jamaica since the island earned its independence five years prior and entrenching its Democratic Socialist course.\n\nThis outcome is bound to further infuriate those opposing the young nation's recent economic reforms, which reelected leader Michael Manley has confirmed he had no intention to stall, despite facing significant strain in the aftermath of the Oil Crisis.\n\nIn a context of growing protests and rising political violence, exacerbated by street gangs in loose association with the ruling party, many observers fear that the Prime Minister's hasty populist policies will soon take their toll on the country's prospects for long-term stability."
 JAM_News.18.a: "Bustamante's legacy has finally been extinguished."
 JAM_News.18.b: ""Damn it Seaga - This was our only shot!""
 JAM_News.18.c: "Trying too much, and too soon."

 JAM_News.19.t: "[Get_newspaper_header]Right Wing Returns to Power in Jamaica in Surprise Victory"
 JAM_News.19.desc: "In a surprising turn, Michael Manley of the People's National Party failed to secure reelection, conceding the nation's leadership to the Jamaican Labour Party's Edward Seaga. While many have attributed this outcome to rising political violence and economic strain in the aftermath of the Oil Crisis, several PNP figures voiced claims of foreign influence and electoral meddling.\n\nA music producer and company owner of West Indies Records Limited, the Prime Minister-elect comes as an unusual newcomer in the Jamaican political scene. Marking a notable distancing of the party from its previous Bustamante-era platform, Seaga has confirmed his intent to steer the country toward a more pro-American position, while maintaining ongoing diplomatic ties with the Veracruz Pact. However, the JLP's narrow majority and its contested legitimacy might prove an additional challenge to future governance."
 JAM_News.19.a: "Just when you thought you got rid of them."
 JAM_News.19.b: ""Get the prime minister elect on the line, I want to congratulate him personally.""
 JAM_News.19.c: "A fresh face bearing Uncle Sam's shadow."

 JAM_News.20.t: "[Get_newspaper_header]Far-Left Victory in Jamaican Elections"
 JAM_News.20.desc: "Richard Hart of the People's Freedom Movement claims victory in the recently held Jamaican snap elections, following the collapse of the ruling coalition formed between his group and the now rivaling People's National Party.\n\nThe newly elected leader blamed American involvement while addressing the current economic and political struggles plaguing the nation, even going as far as to claim his opponent Michael Manley was nothing more than a "puppet" to Washington's interests.\n\nThis outcome is bound to further degrade the already frigid diplomatic ties between the island and the United States, with Hart promising much more aggressive nationalization policies and a firmer stance against what he considers attempts at "bourgeois subversion"."
 JAM_News.20.a: "David incenses Goliath."

 JAM_News.21.t: "[Get_newspaper_header]Moderate Socialist Victory in Jamaican Elections"
 JAM_News.21.desc: "Following the collapse of the PFM-PNP coalition, Richard Hart of the PFP, a splinter party from the PNP, has managed to win the snap election by a narrow margin. As Hart largely maintains a socialist approach, like his predecessor, in domestic decision-making, his foreign policy is marked by a staunch, populist anti-Americanism, pointing the source of Jamaica's current woes to Washington's meddlings.\n\nHart has accused the former Prime Minister Michael Manley to have been under the sway of American intelligence agencies while criticizing him for inaction on social matters. He vows to expand the ongoing nationalization programs while creating a sustainable welfare state. Although his dedication to social justice has won over many voters, some worry that his antagonism may isolate Jamaica from one of her most important benefactors."
 JAM_News.21.a: "We'll keep the red flag flying here."

 JAM_News.22.t: "[Get_newspaper_header]Jamaican Popular Republic Declares Emergency Following Canadian Skirmish"
 JAM_News.22.desc: "In response to increasingly fierce military clashes between the Jamaican Popular Republic and Canadian authorities, the rogue government helmed by former Royal Air Force pilot William Strachan has established a state of emergency. According to local reports, the announcement correlates with a significant uptick in repressive crackdowns against the dissent sparked by the recent crisis.\n\nThese events follow the island's earlier declaration of independence after the collapse of negotiations over the West Indies Federation proposal. The act, as well as the state's sweeping new collectivisation policies, has earned firm condemnation from Washington officials, while Strachan has declared the situation as only being the result of attempts at US subversion."
 JAM_News.22.a: "The Jewel bleeds red."

 JAM_News.23.t: "[Get_newspaper_header]All-Caribbean People's Conference Held in Jamaica"
 JAM_News.23.desc: "Earlier today, left-wing representatives from all across the West Indies assembled in Kingston to join under the first All-Caribbean People's Conference.\n\nInvited at the behest of Jamaican leader William Strachan, many socialist and even pan-African movements were given a platform to share their grievances and voice their support for revolutionary causes both near and worldwide.\n\nAs the conference concluded, the most recurring issues were calls for a drastic end to acts of "British imperialism" across the region, and a shared hope for closer cooperative bonds among the young island-nations."
 JAM_News.23.a: "Another step toward Caribbean unity?"

 JAM_News.24.t: "[Get_newspaper_header]Elections Held in Jamaican Popular Republic"
 JAM_News.24.desc: "The transitional Prime Minister of the Jamaican Popular Republic, Billy Strachan, has stepped down from his position following the government's full reorganization. With Bustamante's Jamaican Labour Party banned from participation and its membership split into successor parties, a coalition government was formed between the social-democratic People's National Party and the socialist People's Freedom Movement. Richard Hart, a former PNP member and a communist, has been chosen as the new Prime Minister.\n\nAs a longtime friend of Strachan, Hart upholds similar principles of egalitarianism and workers' solidarity—having been one of the few expelled from the PNP in the '50s for his self-declared Marxist views. Although he now has to work with the same party that rejected him years ago, Hart declares it to be "just what it takes to rebuild a democracy."\n"
 JAM_News.24.a: "I really wish Busta was still here."
 JAM_News.24.b: "Good or bad, at least it is not Busta."

