 JAM_flavor.18.t: "Jamaican Cries"
 JAM_flavor.18.desc: "CONFIDENTIAL\nTO THE MINISTER OF FOREIGN AFFAIRS\n\nJAMAICA - UNSTABLE SOCIETY\n\nIn a recorded telephone call between the Iberian ambassador to Jamaica and Hugh Shearer, Shearer pledged to honor and resume the covert arrangements between the Jamaican government and the Jamaican gangs to keep crime rates low, with remuneration provided to the groups. Despite this, the national yearly rates of extortion, larceny, and murder have reached their highest levels in a decade, with the proliferation of "gang wars" by the dons in support of or against the JLP.\n\nThe destruction caused by both the blackout and the hurricane resulted in a big boon for the posses; victims who suffered personally and economically were recruited in droves to gangs rivaling posses in exchange for high payment. This encumbering situation is exacerbated by JLP and PNP party members, including Edward Seaga, a JLP celebrity and former housing minister, who used his connections in Tivoli Gardens to allow loyal posses to expand their territories violently.\n\nHugh Shearer's cabinet relocated some of the posses' funding to the reconstruction of social services and wrecked infrastructure, stalling the scheme's efficacy. Current economic forecasts foresee little to no growth in Jamaica's economy due to a lack of investors and a dwindling tourism industry.\n\nFor the time being, we cannot recommend any actions to reverse this course."
 JAM_flavor.18.a: "You can't nurture a nation with lies forever."

 JAM_flavor.19.t: "Lignum Putrescit"
 JAM_flavor.19.desc: "The diplomats in the Half Moon resort were having a period of rest after a lackluster meeting with Shearer's ministers. The Sugar Mill Restaurant was a decent choice for the diplomats to have an impromptu meeting, due to the lack of paying customers.\n\n"You know that the old man can barely speak with that illness wearing him down? I'd be surprised if he'll make it to the end of the year, with the drastic weight loss over the months." Luis M. González-Mata was busy trying to light a cigar while gossiping with the others.\n\n"And we know Shearer doesn't have the buoyancy nor seniority to handle this untenable mess." The gentleman speaking donned a navy blazer as he blew his own smoke. "Though that promise of reforming the authoritarian state and releasing some political prisoners may woo some liberals, it does not mean he has it under control with other nefarious groups."\n\n"The communists?" A bespectacled diplomat questions him.\n\n"Fucking donkey, the massives!" Luis's sudden outburst made the garçon whip his head towards the table from afar. "The feeble fool I once trusted can't handle the deal properly, so now they are running amok again in the streets." Luiz pours scorn in a hushed tone, brooding to his audience.\n\n"So that's it?" The bald diplomat in a tan suit quietly exclaimed. "We just let Bustamante get pushed into the shadows while we let his successor, the highfalutin baboso, try to keep America at bay by stopping them from pushing cocaine?"\n\nNo words were exchanged for the rest of the meeting. At the end, the garçon simply glanced at them when they left the premises."
 JAM_flavor.19.a: "They're just going to watch the ships pass by."

 JAM_flavor.20.t: "Faux Idyllic"
 JAM_flavor.20.desc: "RESTRICTED/[GetDateText]\n\nFROM AGENT DUNNE\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: INTEL REPORT ON JAMAICA\n\n1. Hugh Shearer, assuming the role of Prime Minister of Jamaica following Donald Sangster's passing during the blackout wave, had relaxed the country's censorship laws and promised further social and economic reforms after taking office. However, he will not respond to demands to amend Sir Alexander Bustamante's titles as president for life and national founder, maintaining Bustamante's legacy as a "liberator" and "champion of Jamaicans".\n\n2. Leaked sources point out that Shearer had not changed the tenuous relationship with the criminal gangs responsible for the increased drug and weapon smuggling into the United States. He still maintains the agreement to provide capital to the gangs in exchange for social stability. Intelligence also investigated Bustamante's dwindling public appearances and discovered he suffers from a "long illness". It is predicted that he now wields less executive control over Shearer as his health further deteriorates. Our political ally in the JLP, Edward Seaga, now holds less influence in the party since Shearer's ascension and is unable to impact Shearer's rule. Seaga's reduced role will affect any future operations in Jamaica.\n\n3. Despite continued financing and support from the Iberian Union, high-level corruption is the main issue surrounding Kingston, which showcases that criminal gangs now hold considerable sway over the nation. Jamaica's internal situation continues to show no signs of improvement, and its future remains unpredictable."
 JAM_flavor.20.a: "Fidelity, Bravery, Integrity."

 JAM_flavor.21.t: "The Gold Must Flow"
 JAM_flavor.21.desc: "A turbulent journey from rubbing shoulders with syndicates of Tivoli Gardens to finally molding the country himself, with Shackley utilising the political chaos, beginning with the hurricane darkening the entire island, as the corollary. Seaga now sat across from the ambassador and diplomats, pinned with the American flag next to their right lapel.\n\nA diplomat from the other side questioned Bustamante's absence during the meeting. "That old man is too old to hold a pen for a minute longer." A few chuckles can be heard from both aisles, from Seaga's dry quip.\n\n"The Treaty of Kingston is a stepping stone to restoring our nations' amicable relations, and a stronger economic partnership between the U.S and Jamaica is requisite for enough opportunities to bring derelict neighbourhoods on the mend." Seaga stood in front of the podium beside the American ambassador, shortly after signing the new treaty, reciting an inconspicuous Aesopian speech with a robotic tone for the cameras.\n\nThe blackout allowed the posses to wreak havoc in the streets once again, especially with the newfound instability of Sangster's unfortunate passing. With increased crime rates and the interminable smuggling of cocaine and marijuana northwards, Seaga used his connections with Tivoli Gardens to handle it, in exchange for opportunities to overpower rival gangs' unreconstructed loyalty to the PNP and Iberia. For Jamaica and the Don of the Shadow Posse, it was a win-win deal.\n\n"Mr. Prime Minister, with investors still wary regarding reported shootouts and kidnappings in neighbourhoods all over Jamaica, how can you respond to this concern?" The ABC logo on the microphone identified who the reporter was when he hid behind the camera flashes as he posed his unbidden query. Seaga's practiced cadence in his response masked his great displeasure."
 JAM_flavor.21.a: ""Firstly, these criminals will be dealt with in time...""

 JAM_flavor.22.t: "Judge Dread"
 JAM_flavor.22.desc: "The sunlight from the clear blue sky felt overbearing on Luis González-Mata's head. Six years of work guiding Bustamante in Iberia's orbit had gone to waste, as the men from the JCF accompanied him to his flight back home.\n\nSangster's death and Bustamante's disappearance practically plunged Jamaica into chaos. He witnessed Seaga make the derisive chess move to overthrow the lackey and consolidate control in the JLP. By then, the writing on the wall spells out that Mata will be the first snakebit target. With the old man out of reach during the bout of anarchy, his hands were tied, and fate rewarded him by being declared "persona non grata".\n\nHe carried a resigned expression as the men in blue marched him from the tarmac towards the passenger door. Seaga had outed him as a spy who bribed gangs responsible for the deaths of hundreds and millions in damages in the midst of the blackout. To implicate Mata as the scapegoat? For the same crime, the great Augean stable of the JLP took part in? He found it quite sardonic.\n\nWhat now? Being ousted by a former ally of your nation is a black mark on anyone's portfolio, so he expected an early retirement from SECED once he returned to Madrid. Busta will rot away in house arrest while he keeps his nominal titles, so history might show that in the end, he was all hat and no cattle. Mata won't miss working with a fool like him.\n\nA pensive smile crept in as he peered through his window at his seat. He will miss this side of the Atlantic Ocean."
 JAM_flavor.22.a: "Now take four hundred years!"

