 #French West Indies


 # Antigua and Barbuda
 POLITICS_ANT_GEORGE_WALTER_DESC: "If there is anyone who knows that perseverance can pay off, it's George Herbert Walter. Head of the Progressive Labour Movement and a central figure of the opposition against former president Vere Bird for years, Walter has not had an easy time making it to where he is today. A progressive liberal opposing American hegemony and the federal model of governance, Walter could not have been further away from what the Bird regime stood for - it was only after years of repression and a miracle in 1972 that got Walter and the PLM into office.\n\nNow, he inherits the hollowed out remains of a former dictator's paradise. With Bird's grubby fingerprints still all over the legal system and his connections still making life a living hell even while the man is in exile, Walter certainly has his work cut out for him in turning the islands towards his vision - but whether he will have the nerve to stick it out is another question entirely."
 POLITICS_ANT_VERE_BIRD_DESC: "Vere Bird, a seven-foot-tall, poor, uneducated, union activist turned politician, is the most important person in Antigua's entire history. More important than Christopher Columbus, who discovered the island, more influential than Thomas Warner, the first governor, and more powerful than King Charles, who claimed the island. For 20 years, he has ruled with an army of middle managers working only for his coin.\n\nBird was born in a poor neighborhood in St. John. He received little formal education and ended up joining with Antigua's unionists, becoming a founding member of Antigua Trades and Labour Union. After Antigua gained suffrage, Bird created the Antigua Labour Party and from there dominated the island's political scene.\n\nAs the island's colonial elites left after the Second World War a new class was founded by Bird, one of the kleptocratic middle managers and union men. With them, he has solidified his rule with corruption, while giving his family some of the riches of his rule.\n\nNow, Bird seeks to hold onto power, even as the West Indies Federation fails, and the region falls into an uncertain future."
 
 ###IDEAS###
 WFI_Political_Purgatory: "Political Purgatory"
 WFI_Political_Purgatory_desc: "In the waning days of WW2, as the United Kingdom was reduced to a slave to the Reich, the allied powers authorized Operation Vector, assisting the Canadians in occupying the British West Indies. In order to keep the continent's underbelly out of Axis hands, the Canadians claimed the dubious right of representing the true British Empire and maintained many of its structures and institutions in pristine form. Two decades later, little has changed. Whether out of a lack of legal rights or political will, Canada has maintained this curious status quo, limiting any action that may disrupt their hold.\n\nFearing the slow collapse of the Empire and losing such a significant bargaining chip, the Canadians have been hesitant to push for serious reform towards independence, despite growing pressure from the US. But such caution has its limits, and the people of the West Indies grow weary by the day with Canadian procrastination as the winds of independence pick up pace."

 WFI_Apres_le_Deluge: "Après le Déluge"
 WFI_Apres_le_Deluge_desc: "The collapse of the Kingston Conference amidst wider instability across the Caribbean has shorn away what legitimacy remained for the regional status quo, and has confirmed the dissolution of the West Indies Federation. With the islands of the Caribbean granted independence on a regional basis, real uncertainty is now commonplace as new, smaller units struggle through economic uncertainty, political incoherence and weak ties to the Windsor Dynasty ruling from Ottawa.\n\nThrough all of this, the West Indies Commission continues to work. Through the chaos, it hopes to provide economic assistance and political unity for distinct, common ends. And through all of this, it is failing, the disillusionment of most towards the prospect of Caribbean unity simply opening the remit for a new future beyond what remains of its whims. Whatever it will be, it will be on new ground."

 #Bahamas
 BAH_Mobsters_Paradise: "Mobster's Paradise"
 BAH_Mobsters_Paradise_desc: "The late 50s were a time of crisis for American organized crime as the one-two punch of Kefauver's crackdown and Castro's revolution left the mafia reeling. Casinos and brothels from Vegas to Havana were shuttered, and great empires of sin were reduced to dust. But all was not lost, for a new promised land awaited those fortunate or cunning enough to escape Johnny Law: the Bahamas.\n\nNassau, a haven for ne'er-do-wells since the Golden Age of Piracy, was the perfect locale for the mafia diaspora to make their new home. The Bay Street oligarchs who ran the joint were more than willing to let their new partners in crime get back on their feet in exchange for some obligatory graft. Casinos, brothels, and drug dens blot the land as her new residents labor to create a paradise of debauchery to rival Sodom and Gomorrah."

 BAH_Rule_Bay_Street: "Rule from Bay Street"
 BAH_Rule_Bay_Street_desc: "A remnant of colonial-era society, the progeny of white political dynasties have formed a ruling class known as the Bay Street Boys. Unofficially, they have created a network of elites to control every facet of national affairs by proxy via the puppet United Bahamian Party. Exercising almost unlimited power over the islands through gerrymandering and other illicit means, they are currently most interested in maintaining white rule and filling their coffers by any means."

 BAH_Sandcastle: "Sands' Castle"
 BAH_Sandcastle_desc: "Since Stafford Sands' visionary tenure as the Minister of Finance began, the Bahamas has transitioned into an unofficial policy of unfettered "free-range" capitalism to foster its burgeoning tourism and gambling industries. As the coffers of the central government and her collaborators steadily grow, the shifting sands of the islands continue to bury the citizenry under festering corruption and poverty."

 BAH_Closing_Bay_Street: "Closing Bay Street"
 BAH_Closing_Bay_Street_desc: "With the UBP dissolved and the Bay Street Boys a historical footnote, the Bahamians have, for the first time throughout their history, found themselves ruled under a semblance of real democracy.\n\nAlthough the new majority rule remains imperfect as the white elites continue to hold disproportionate influence, the ruling PLP has nonetheless been able to maintain a strong public opinion. However, with a charismatic yet overbearing leadership dominating over every aspect of the party, some fear that the Bahamas will soon fall under another uniparty system."

 BAH_Knocking_Sandcastle: "Knocking Down the Sandcastle"
 BAH_Knocking_Sandcastle_desc: "The Bahamas are presently dominated by the interests of tourists and financial moguls, and Lynden Pindling now works tirelessly to reign in the unregulated green line nightmare Stafford Sands created—his goal is to redistribute the profit for the people's broad benefit. Of course, this effort has already brought conflict with those few who until now have reaped the nation's bounty. If he seeks to see these reforms through, the barons will not go gently."

 BAH_Repaving_Bay_Street: "Repaving Bay Street"
 BAH_Repaving_Bay_Street_desc: "The Bay Street oligarchy in Nassau, long dominated by white elites who have thus controlled the islands' economy, has shown a willingness towards reform, including a larger role for black up-and-comers. However, while it's clear that the old, white plutocrats run the show from the shadows even now, what isn't clear is how long this situation can stand. How strong are the winds of change?"

 #Jamaica
 JAM_political_violence: "Political Violence"
 JAM_political_violence_desc: "There are two parties in Jamaica that truly matter. One one side is the social-democratic People's National Party; on the other is the conservative Jamaica Labour Party. These two factions, longtime rivals, have engaged in many political battles before, but another facet of Jamaican politics is left off official records - not back-room deals, but back-alley shootings, which have only become more common in the politically tense times we live in.\n\nEach day, youth gangs take to the streets clad in the colors of their favored party, ready to agitate their rivals, packing lead pipes, knives, and pistols to use. Jamaican side streets are the scenes of brawls, flurries of violence that break apart with the crack of guns and the shouts of police. The murder rate has skyrocketed, and the violence shows no sign of abating, despite the efforts of both parties to disavow their violent supporters. It seems only calmer times will fix this bloody rupture - or, at least, return it to its normal rate."

 JAM_miracle: "Miracle on the Hope River"
 JAM_miracle_desc: "While the world has spiraled further and further in chaos and conflict, these interesting times seem to have spared Jamaica from its worst effects. Indeed, a major reason of our secession from the Federation goes back to the sudden success of our economy - an economy that is now for Jamaica's benefit, and Jamaica alone.\n\nNever before have the people enjoyed such wealth as they do now, as trade rolls in from the United States and the other Caribbean nations and tourists flock to our golden beaches and clear blue skies. The wealth of our island, both in appearance and in resources, spurs our economic growth to greater and greater heights. As the money rolls in, we can raise a glass to prosperity, and relax secure in the knowledge that Jamaica has never been more free or wealthy than it is today."

 JAM_rastafarian_repression: "Rastafarian Repression"
 JAM_rastafarian_repression_desc: "Jamaican culture is inexorably tied to the Rastafarians. Born in the impoverished Black communities of the early 20th century, this unique religion has been the cause of interest for decades, with their worship of Emperor Haile Selassie as the messiah, smoking of "ganja", and distinctive dialect. These worshippers used to be little more than a curious subculture, keeping to themselves and meeting peacefully to spread their beliefs - but the Rastafari have grown far beyond their humble roots.\n\nThe relationship between the religion and the government has always been strained, with the believers seeing non-believers as instruments of the decadent Babylon and non-believers seeing believers as delusional, but recent events have only amplified that tense relationship. Many believed that the exiled Selassie, being the Messiah, would never die, and his death has splintered parts of the Rastafari into vengeful, aggressive sects with differing explanations on what happened - from postulating that he was only an incarnation of Jah to claiming that Selassie faked his death and now orchestrates massive anti-Italian resistance. These offshoots regularly clash with the overworked police, who increasingly crack down on all Rastafarians, regardless of their personal actions. This spiral only worsens with every incident, and neither side has any trust or love lost for the other.\n\nIf a solution is not found, tensions could boil over in a deadly way."

 JAM_jamaica_first: "No Federation, No Masters"
 JAM_jamaica_first_desc: "First, it was the Spanish. They arrived hundreds of years ago in their massive warships, bringing deadly disease, cannons, and slaves. Taíno and escaped slaves held out in the hills, escaping and resisting their clutches - the first native Jamaican identity emerging from their fight.\n\nThen it was the British, who replaced the Spanish in name but no less in cruelty. Plantations sprung up, along with thousands upon thousands of settlers and slaves, expanding the island massively in population. Still, the Jamaican identity held out in the overlooked nooks and crannies, growing in the places the British did not go.\n\nTime passed. The British loosened their grip, ended slavery on the island, passed more reforms - and then, like a storm, they were swept away in the chaos of the Second World War, and the Americans swooped in to replace them. Jamaica was roped into an ungainly, dysfunctional Federation, designed to take the wealth from Jamaicans and bundle it away. Once again, Jamaica rejected this imperialist dream, and broke free of its repression in spectacular fashion.\n\nNow, Jamaica is free. There are no more empires left to beat back. After centuries of struggle, the Rock will chart its own course and plan its own destiny.\n\nIs there anything sweeter than the taste of freedom?"

 #New Skeleton Jamaica
 JAM_Busta_Backbone: "The Busta-Backbone"
 JAM_Busta_Backbone_desc: "Populism alongside exploitative optimism had transformed Alexander Bustamante's Jamaica Labour Party into an empire of relentless dominance and command, a hegemony permeating into the livelihoods of the everyman as his self-styled "Bustamante Industrial Trade Union" effectively placed much of the nation's working sectors into one authoritarian grasp — a tolerated, if ultimately nasty, piece of reality.\n\nThe influence of his machine festers, swelling as few final remnants of the dysfunctional colonial administration seek a willing host with what influence they have left — and more often than not, they'd found Busta obliging to their demands so long as he's compensated fair and upfront. Carrots with sticks had worked for the last few decades, and its enforcer finds it much too beneficial for change."

 JAM_Reform_Failures: "Flunking the Report Card"
 JAM_Reform_Failures_desc: "Following a series of post-war riots, the US and its colonial allies sought to implement a bold plan of reforms to foster development and bring the islands into the 20th century. Through mismanagement, corruption, and underfunding, the results have been mixed to say the least, but in few places did the schemes go so disastrously as in Jamaica.\n\nThe wealth gap continues to rocket, dominance of the white and creole elites solidifies, and the island remains riddled with poverty and crime. All the while, political divisions are growing more extreme, and atop it all, the JLP keeps throwing logs onto the fire.\n\nOnce the jewel of the English Caribbean, Jamaica now stands as a testament to the post-war order's failure to truly promote development in the region."

 JAM_Kingston_Renaissance: "Kingston Renaissance"
 JAM_Kingston_Renaissance_desc: "Inspired by a motley of cultural movements, from the French-imported Négritude to homegrown products such as Garveyism, the streets of Kingston are undergoing a renaissance, motivated by both growing Caribbean nationalism and the emergence of a domestic intellectual class, which has gradually reformed as the Anglos continue loosening their grasp on the last scraps of colonial holdings.\n\nLabor unions and political organizations increasingly attach themselves to the nascent Afro-Caribbean label as identitarian movements such as Rastafarianism gain traction amongst the masses, garnering attention from notables both home and across the pond, whether positively or not. While Kingston continues to be plagued by post-colonial poverty, it has nonetheless made itself, despite everything, a cultural heavyweight — or as some generously call it, the Mecca of Afro-Caribbean culture."

 JAM_Posses_Gather: "The Posses Gather"
 JAM_Posses_Gather_desc: "Across Kingston, gangs now exert their authority. With Jamaica heavily destabilized by the wave of demonstrations against Bustamante. Gang violence has become commonplace, as have its subsequent consequences. Crime of all forms is rampant and regularly targeted at civilians, weapons are freely available, and minimal drug control exists. On paper, legal authority still exists, but it goes no farther than the paper the documents are written upon.\n\nInstead, the real role of governance is to shuffle money across a handful of departments, either to the police in areas they still control or as bribes to gangs momentarily aligned with the government and willing to fight. In time, these donations may shift, but gang warfare will remain a common and widespread issue. As long as this system continues, though, the only people to lose will be Jamaican civilians."

 JAM_The_Tropical_Fabian: "The Tropical Fabian"
 JAM_The_Tropical_Fabian_desc: "The Second World War has not eaten away at the influence that British labour politics holds. With Michael Manley lifted to power in Kingston, he and the People's National Party will push Jamaican politics in the direction of the old Fabian Society. Focused on ensuring the survival of democratic apparati and moderation compared to other factions in the Jamaican Popular Republic, Kingston will follow a Democratic Socialist vision.\n\nInfluenced by the developmentalism of the Mexican PRI and of Fidel Castro, Manley will place high attention on building civic apparati aimed at alleviating poverty, improving education, and building infrastructure. Funding for this will also come through increased spending and tariffs, targeted towards large expansions to tourism and bauxite, both industries that already have significant sway within the Jamaican economy and interest from global corporations."

 JAM_The_New_Machine: "The New Machine"
 JAM_The_New_Machine_desc: "In attempting to supplant the influence of the Jamaica Labour Party, the People's National Party has had to move beyond the ideals it once held for itself. Figures within the PNP and their relatives have been appointed to key institutional posts, labour unions have been given major strangleholds, and Brigadista radicals work to intimidate opponents into voting for them, or into standing down mid-election.\n\nIn some respects, this has worked. The JLP has lost the hold it once had across the country, and is increasingly an empty vessel. But to the average Jamaican, the consequences of this plan working merely echoes the consequences of Bustamante's past plan to prosper. Through the lofty rhetoric and goals claimed by Manley, many Jamaicans simply see the iron fist that once repressed them merely cloaked in a velvet glove."

 JAM_Black_Star_Red_Flag: "Black Star, Red Flag"
 JAM_Black_Star_Red_Flag_desc: "Jamaica's new ruling government does not have strong cohesion. Formed by Billy Strachan, leader of the Caribbean Legion's Black Star Brigade and a long opponent to the former regime, his government is an eclectic mix of Bolsheviks, black nationalists, moderate socialists and whatever miscellaneous figures have been able to integrate into its officer corps, each now vying for their own influence within the revolutionary government.\n\nIn an effort to paper over these cracks, the forces of Billy Strachan largely rule via decree. Fears of surviving loyalists to Bustamante or an intervention from Washington have brought room for emergency measures to be justified, with fervour quickly being melded into mobilization and with the democratic constitution officially suspended. Whatever reaction may arise, Kingston's government will be ready to react in turn."

 JAM_The_Maroons_Return: "The Maroons' Return"
 JAM_The_Maroons_Return_desc: "While our oppressors told themselves that they had ended slavery, they had done no such thing. The plantation economy persisted, Jamaicans forced into exploitation just to survive, and it is only with our triumph that such barbarity has been driven out. We have carried the torch of the Maroon slave revolts, finally eradicated the tools of slavery and white supremacy.\n\nBut the struggle cannot end there. A new economy must be formed in the image of those slave revolts of old that fought against the British. Nationalisations and state oversight must permeate, even dominate the economy to ensure injustice is destroyed as quickly as it appears. Yes, businesses are fleeing and the economy is descending into chaos, but that is merely the seed for change. As Strachan says, "change never comes without pain"."

 JAM_Revolutionary_Democracy: "Revolutionary Democracy"
 JAM_Revolutionary_Democracy_desc: "Democracy is the fruit of the people, and Jamaica can finally enjoy its true flavor. All eligible citizens shall be free to vote however they wish, unless they seek to subvert this liberation through groups like the JLP. Due to the youth of our newly liberated state however, a popular front has been formed under the tutelage of the Communist People's National Movement, in order to properly form this new democracy.\n\nTensions remain however. Many social democrats hesitate upon the aggressive revolutions of the front, while traditional labour stalwarts such as Michael Manley look upon our Marxist influences with suspicion and advocate for the reactionary-tainted anglo unionism of before. Such friction threatens our liberation's unity, not to mention the quality of its tutelage. The question of how to resolve such tensions hangs over every party within the front, and it must be answered."

 JAM_The_Independence_Debt: "The Independence Debt"
 JAM_The_Independence_Debt_desc: "That oppressors fear those who gain the strength to defy them is a universal truth, as true now as it was during the Haitian slave revolts. They will conspire to blockade those brave few and starve them, as they conspired with Haiti. And so, like Haiti, we shall accede to some concessions in the interests of the greater good of the revolution.\n\nThis limits the scope of the nationalisations and economic reforms that can be carried out. Foreign businessmen may continue walking our streets, albeit few in number, making a mockery of our social revolution. Few doubt the necessity of such measures in the short term, after all they shall sell us the means to defy them yet further and our new economy remains young and weak. However, how long such concessions can be tolerated remains a contentious question."

 JAM_Den_of_Thieves: "Den of Thieves"
 JAM_Den_of_Thieves_desc: "Over 250 years ago, the Caribbean was known as a den of crime and vice, where pirates looted and pillaged freely. With Iberia's return to Jamaica as Bustamante's backers, Europeans once again treat the Caribbean as a lawless playground.\n\nCorruption and smuggling have become integral to the Jamaican economy. Funds from illegal weapons and narcotics sales fill the coffers of gang leaders, government officials, and Iberian crimelords alike. European tourists flock to the island, enjoying the sparkling waters of the Caribbean in closed-off resorts, while their countrymen exploit and terrorize the local population in slums just outside the walls. The iron fist and velvet glove of America has disappeared from the island, and in its place, European imperialism returns in its most primal form."

 JAM_Bent_Backbone: "Busted Backbone"
 JAM_Bent_Backbone_desc: "The mask has fallen from the Jamaican machine. The regime has turned to outright repression, as state-backed gangs and Iberian mercenaries are used to suppress any and all dissent. Corruption flourishes in plain view, and crime is not just ignored but endorsed, as long as it serves the parties' will. The old system of patronage networks and union coercion has evolved, and the corrupt dictatorship of the JLP dominates for all the world to see.\n\nThe man behind it all, Alexander Bustamante, rules over a country bending to his every word, through bribery and violence. Yet his time grows short, and whispers behind his back speculate on his impending death. Party functionaries carve out pieces of Bustamante's empire, as the crooked regime shambles yet forward."

 JAM_The_Seaga_Spine: "The Seaga-Spine"
 JAM_The_Seaga_Spine_desc: "Edward Seaga ascends to the Premiership in a difficult time. His narrow victory leaves him tied to much of his predecessor's legacy, and massive opposition in both the streets and halls of government leaves his hands tied in many important affairs. Some even predict that his fall is not a matter of if, but when.\n\nBut Seaga is no quitter. Patronage networks and state-backed paramilitary gangs are used to consolidate his control, tactics learned from his once-mentor Bustamante. Seaga aims to hold on to power no matter the cost, and digs his claws deeper into the state every day. If the political situation ever reaches a boiling point, Seaga has ensured that he will not be going down without a fight."

 JAM_Sunrise_Over_Montego_Bay: "Sunrise over Montego Bay"
 JAM_Sunrise_Over_Montego_Bay_desc: "Edward Seaga is painting a new face over Jamaica. Gone are the days of regulations. Gone are the days of labor. The Jamaica of today is a Jamaica open for American tourism. Corruption and crime are shuffled out of view, replaced by billboards and advertisements soliciting investment into new industries on the island.\n\nNowhere is this more clear than in the city of Montego Bay, where American investments build resorts all across the coastline and fund massive urban redevelopment campaigns. With the backing of American entrepreneurs, Seaga aims to turn Montego Bay into not just a hotspot of tourism, but a model city to represent Jamaica on the world stage, glossing over the criminal underbelly at the heart of the JLP."

 #Leeward Islands
 SKN_Patchwork_Colony: "Patchwork Colony"
 SKN_Patchwork_Colony_desc: "A disjointed product created from colonial mismanagement, the Leeward Islands is an administrative union composed of the many sparsely populated islands dotted across the northeastern stretches of the Caribbean.\n\nLike a Frankenstein's monster of disparate states, the local governments of the islands are constantly resentful of one another. As Nevis and Anguilla remain defiant of St. John's political dominance, the continuous tension between the administrations has rendered an anti-colonial united front eternally an ideal, never manifesting into reality."

 SKN_Underdevelopment: "Caribbean Backwater"
 SKN_Underdevelopment_desc: "While a plantation economy that ran on low-wage labor was a sustainable practice during the colonial regime, such a rudimentary system based solely on sugar export had not produced a healthy trade balance for the unfortunate Leewards. Whereas the fall of Britain and France had already cut off the sole source of foreign income of the islands, Canada's failure to redevelop viable replacement sectors had further damaged the prospects for the populace to escape severe poverty.\n\nThe masses are resentful of the Anglo elites, both for their unwarranted arrogance and their litany of mismanagement. Now, with little outside backing, the isolated gentry have outright turned into an ostracized minority, spurned by everyone save their own. As the whites wealthy enough to quickly move north choose to take along their ill-gotten fortunes, many in professional sectors have also begun emigrating en masse with the departure of their regular clientele."

 #St. Kitts & Neves
 SKN_Under_Microscope: "Under the Microscope"
 SKN_Under_Microscope_desc: "Like a dwelling for ants, Saint Kitts and Nevis is a microstate in every sense of the term. With a permanent population hovering just under forty-thousand and having close to no major industries, any outside influences can easily bring about disproportionate consequences to the islands' development, whether good or ill.\n\nDue to its desperately minuscule economy, the recent lack of funds dedicated to its upkeep and ever-dwindling Canadian assistance had impacted Saint Kitts' locals' quality-of-life particularly severely in comparison to other Leeward statelets. Furthermore, the sustainability of the islands' sovereignty had also proven to be a controversial matter, with its complete reliance on foreign support bringing into question the line between a colony and a state."

 SKN_Malliouhana_Prey: "Malliouhana's Prey"
 SKN_Malliouhana_Prey_desc: "Anguilla, the rebellious island, once named Malliouhana by its original Arawak inhabitants after a legendary sea serpent, has torn St. Kitts and Nevis asunder. The island has split off and taken with it a not insignificant part of the population and a hefty chunk of the nation's pride.\n\nThese are wounds that have yet to fully heal. Malliouhana's gambit has legitimized the concept of secession in the political discourse, especially as the Bradshaw government has doubled down on centralist policies. Nevisian separatists gather in the shadows, waiting for their moment to follow in the serpent's wake "

 SKN_Little_Davids_Throw: "Little David's Throw"
 SKN_Little_Davids_Throw_desc: "The Bradshaw government has embarked on an ambitious plan of economic development for such a small island. Aiming to use his limited state resources to bolster the flailing sugar industry and its labor unions while utilizing the profits to form a meager welfare state.\n\nBut as David takes his aim, a Goliath rears his ugly head. Political dissent from moderates and the sheer strain on the budget threaten to tear the nation in two, but perhaps with enough gumption, Little David's stone will hit its mark. "

 SKN_Sugar_Mass: "The Sugar Mass"
 SKN_Sugar_Mass_desc: "Making up for the almost nonexistent domestic Saint Kitts market, some few brilliant economists had come up with the idea of an invented festival by the name of 'Sugar Mas' to garner North American tourists to this quaint statelet far down south. By blending down a slurry of vaguely Caribbean customs, Sugar Mas is a carnival celebration aiming to bring a vibrant, rejuvenated air to the otherwise unremarkable attractions of Saint Kitts.\n\nThanks to a willingness from both American and Canadian capital to become involved in this relatively low-stake economic project, it had proven quite popular with outside, unsuspecting tourists, though some locals still deem this artificial creation to be a little more than self-degradation."

 SKN_Malliouhana_Slumbers: "Malliouhana Slumbers"
 SKN_Malliouhana_Slumbers_desc: "Anguilla, the rebellious island once named Malliouhana by her original Arawak inhabitants after a legendary sea serpent, has been tamed for the time being, its secession crushed. The PAM government has made great efforts to conserve her autonomy and create a genuinely federalist form of government.\n\nBut Malliouhana's shadow still lurks just below the water, and many fear the day she will return from the depths to strike"

 #Leeward Federation
 SKN_Federalist_Bulwark: "Federalist Bulwark"
 SKN_Federalist_Bulwark_desc: "Formed in part in opposition to Trinidad's ideal of a left-leaning nationalist East Caribbean Union and the more disparate cooperation of Barbados's CARICOM, the Leeward Federation seeks out a middle path. One that unites the islands around shared conservative values and a spirit of brotherly patriotism.\n\nThis opposition to the liberalizing and nationalizing trends stands out as both a new potential path for the region and a return to tradition. An emulation of the British model for a new era."

 SKN_Pepperpot_Stew: "Pepperpot Stew"
 SKN_Pepperpot_Stew_desc: "Like the British Leeward Islands colony before it, the Leeward Federation is a loose collection of small islands with their own unique cultures, politics, and economies. However, unlike the previous administration's incoherent pseudo-federalism, this new union strives to make the best of the situation. To bring together something greater than the sum of its parts.\n\nLacking a strong basis of central administration and with tensions already bubbling, it remains to be seen if this Pepperpot stew will simmer to completion or boil over."

 #Windward Islands
 SVI_Banana_Boom: "Banana Boom"
 SVI_Banana_Boom_desc: "The Windward Islands' sugar industry was dying, the gutshot of Caribbean competition and the rise of sugar beets were slowly draining the islands dry. Only through the large-scale foreign investment in the production of bananas was the bleeding plugged.\n\nThe islands have since been profoundly transformed by the so-called 'Banana Boom', with capital and infrastructure development flowing in—but the banana firms, most notably the infamous United Fruit Company, have not been idle, and now throw around significant weight in political and social matters."

 SVI_Neocolonial_Backlash: "Neo-Colonial Backlash"
 SVI_Neocolonial_Backlash_desc: "The plantation farming of old's revival in the form of the banana harvest has brought great wealth, but skyrocketed social tensions. Worker protections in the islands have never been substantial, and this, combined with negligible political representation—even by the Caribbean's standards—has brought things to a low boil. A backlash against this new, 'prosperous' order stirs beneath the glittering surface."

 #Saint Vincent
 SVI_Sifting_Through_The_Ashes: "Sifting Through the Ashes"
 SVI_Sifting_Through_The_Ashes_desc: "In 1902, the volcano La Soufrière erupted, killing some 1,600 people, making another 4,000 homeless, and destroying St. Vincent's cotton industry. In [year when this event happens], the West Indies Federation collapsed before it could even be created, and under the rubble lay St. Vincent and its arrowroot and banana economy. To the rest of its Windward island brethren, St. Vincent lies as a warning of what an underdeveloped and undiverse economy may do to them.\n\nNow the island is almost entirely reliant on foreign aid, mostly from the West Indies Commission, to stay out of bankruptcy. Everyday, representatives from St. Vincent request aid from other nations, and each time the nations respond, "We'll see," and St. Vincent must hope that they feel generous, lest the island sink."

 SVI_Shadow_of_La_Soufriere: "In the Shadow of La Soufrière"
 SVI_Shadow_of_La_Soufriere_desc: "When one talks about St. Vincent and the Grenadines, the Grenadines are scarcely mentioned, if at all. Nearly the entire economy and political structure of the nation relies on St. Vincent, with its other islands being underdeveloped and distant from the central government. Some islands have even remained untouched since the 19th century.\n\nThe few inhabitants of these islands rarely call themselves Vincentian, and they've also begun to form their own separatist groups. While the Grenadines may lay dormant for now, they'll overflow soon and engulf St. Vincent like La Soufrière in 1902."

 #Barbados
 BRB_Acing_the_Report_Card: "Acing the Report Card"
 BRB_Acing_the_Report_Card_desc: "Following a wave of riots across the Caribbean in 1952, the joint Canadian-American advisory committee known as the West Indies Commission created an ambitious development plan to remake the region. Ten years later, the results have been uneven to say the least, lack of funding and reactionary administrators have stymied these grand plans. And yet, despite the odds, the fledgling state of Barbados stands above the rest, providing a modern level of education, healthcare, and economic mobility for its population.\n\nAt the same time, with an increasingly investor-friendly economy, American capital has begun flowing into Bridgetown in droves to aid in the nation's development, and overbearing foreign advisors and businessmen dictate policy from above. Some Bajans are beginning to wonder if development is truly worth the price of a new colonialism."

 BRB_Growing_National_Consciouness: "Growing National Consciousness"
 BRB_Growing_National_Consciouness_desc: "As the Caribbean joins in a united struggle to leave behind antiquated colonialism, a growing demand for autonomy has become apparent in Barbados in the advent of a gestating Bajan patriotic tradition. With locals from all castes realizing the indifference of the Ottawan bosses regarding the needs of their southern subjects, the Bajan public has come under the rallying call of pan-Caribbeanism, propagating throughout the region. Conscious of the nation's strategic strengths, Bridgetown's activists particularly emphasize the leading role of Barbados as a role model of economic and political freedom.\n\nBy and large, most Bajans have become somewhat receptive to the idea of further integration into the broader independent Caribbean community, and for the courageous, dreaming of the island-states united is not far beyond their wildest imagination."

 BRB_Party_Monopoly: "Party Monopoly"
 BRB_Party_Monopoly_desc: "A one-way crossroad is the best way to describe the party politics of Barbados; oftentimes, there's less of an illusion of choice than an artificial pretense of such. Having been the sole power-broker in Barbados' playground since the 1930s, the Barbados Labour Party had made its full command over essentially the entire nation an open secret under the jurisdiction of Grantley Adams and his protégés.\n\nDespite employing a relatively progressive approach to social concerns, Adams' Anglophile tendencies never managed to win over much of the younger, more independent-minded Bajans — having become increasingly unsupported by the public throughout the past years. It will nevertheless be very difficult, however, to remove the BLP from a position of power, on account of the favors and leverage it'd gathered throughout the years."

 #Trinidad
 TRI_undersea_riches: "Trinidadian Tar"
 TRI_undersea_riches_desc: "The Führer fought recklessly for Baku's oil, and the Duce turned greedy over Libya's black gold — out of necessity, the leadership of Trinidad also vested the nation's future on the petrochemical industry, and it had paid off dramatically. Though the exploitation of Trinidad's sizable oil reserve subsidizes the exorbitant cost of basic welfare and state investment, the bread and circus is also a hanging thread away from slipping into a cause for unrest, as most Trinis have grown reliant on the benefits.\n\nDespite honeyed words from the north, the Anglos have stood as an opponent to Trinidad's independent state development due to the consequent decline of economic leverage. With Canada and the U.S. both actively attempting to wrestle away the state's control over its oil extraction, the survival of one of the Caribbean's better-off economies is uncertain."

 TRI_disunited_front: "A Disunited Front"
 TRI_disunited_front_desc: "Eric Williams is out, to the shock of millions around the Caribbean, his once-illustrious legacy tossed into the mud by the will of a people furious with his inaction. In his place rises a large coalition of anti-Williams leftists and conservatives alike, united by their burning will to see Williams out and change come to Trinidad.\n\nThe problem, of course, is deciding what this change actually will be.\n\nThe unions, whose strike ground the economy to a halt, demand further protections and benefits for them and their workers. The leaders of the Army, whose mutiny struck the final blow and toppled the Williams regime, demand that power be put into apolitical hands - their hands - as loudly as their soldiers cry for change. The Black Power movement, whose protests started this chain of events, demand that their cries for social change are accepted and implemented.\n\nIn the middle of this whirlpool, it falls to the interim Daaga government to chart an impossible course through the chaos. The future path of Trinidad hinges on their success or failure."

 TRI_pnm_dominance: "PNM Dominance"
 TRI_pnm_dominance_desc: "Trinidad is a democracy, undeniably, but it's hard to tell if one looks at the recent electoral results. The PNM dominates the political scene in every facet and position, disarming its opposition with an almost surgical precision. Led by the immensely popular Eric Williams, President and so-called "Father of the Nation", the PNM has enjoyed consistent popularity since the formation of the WIF, and has no challengers to truly oppose it.\n\nOf course, nothing lasts forever, and the nationalist, left-wing slant of the PNM has its fair share of opponents, as does Eric Williams himself. However, until these opponents are able to organize themselves - or until they're able to coax a majority of the people to their side - Eric Williams and the PNM look set to dominate the near future of Trinidad."

 TRI_Fragmented_Politics: "Out of the Chaos"
 TRI_Fragmented_Politics_desc: "In a politics defined by ethno-religious loyalties through discipline and stubbornness, Eric Williams' People's National Movement has barely edged out its rivals. The PNM, anchored in the Afro-Trinidadian working class and supported by elements of the island's unions and intelligentsia, finds itself pitted against a highly divided opposition, particularly among the substantial Indo-Trinidadian minority.\n\nWhile William's claims to want to build a Trinidad for all its people, minorities already fear that the PNM behemoth will attempt to assert Afro-Trinidadian rule.While the opposition squabbles among itself, Williams has already been leveraging reforms ranging from social aspects to economic reform, focusing on reversing the long-lasting impacts of slavery on the islands.\n\nUsing these reforms as well as connections to unions and movement leaders, Williams continues to cement his power."

 TRI_OFN_Outpost: "Chaguaramas"
 TRI_OFN_Outpost_desc: "Rented to the United States by the Brits during the most desperate parts of the Second World War, Chaguaramas was a simple port constructed solely to maintain a presence over America's backyard, and of course, to alleviate the mounting debts the Royal Navy had incurred.\n\nThroughout the years, however, as Europe proper became overrun by fascism and the OFN's focus shifted back towards its home turf, Chaguaramas had transformed into one of the most important anti-submarine fortifications across the Caribbean — particularly evident when U-boats devastated all semblances of a supply chain during the latter parts of the war.\n\nFitted nowadays with the best American naval expertise has to offer, it is less a beautiful jewelry to Trinidadians than a sore spot for its borderline colonial construction. But knowing that Washington won't see any trouble so long as the local bosses get paid well enough, it does seem rather pointless to abolish something amounting to little more than a relic."

 #East Caribbean Union

 TRI_Beyond_Slavery_and_Capitalism: "Beyond Slavery and Capitalism"
 TRI_Beyond_Slavery_and_Capitalism_desc: "Following the course of many a revolutionary country, the East Caribbean Union has become a developmentalist economy, like that of Mexico's. Nationalizations, especially of Trinidadian oil, have become staple of the new state, with Trinidad being the first target of the new economic plan.\n\nThe funds gained from these nationalized industries are then spent on social programs or on the enrichment of the other, less developed, islands in the union. While many support the development of other islands, viewing it as positive to the economy of the union as a whole, some Trinidadians are angered by this policy, as they view their money not being spent on them.\n\n"

 TRI_First_Among_Unequals: "First Among Unequals"
 TRI_First_Among_Unequals_desc: "Worker's liberation isn't an easy path, at least not for the East Caribbeans. Like many of their fellow socialist nations, the Union has taken on a centralized approach to government, with the power coming from the oil-rich Trinidad. It seems that the other islands aren't as fond of the arrangement as Trinidad itself.\n\nIn Grenada, Tobago, St. Vincent, and the Grenadines, grumbles of the workers and their representatives can be heard across the ocean. Unfortunately for them, the Trinidad's oil goes far, and the other islands will just have to deal with Trinidad on top, at least for now."

 TRI_Doc_Knows_Best: "The Doc Knows Best"
 TRI_Doc_Knows_Best_desc: "Dr. Eric Williams, affectionately called "the Doc" by some of his followers, rules over [TRI.GetNameDef] with an approach somewhere between an iron fist and a velvet glove. Governing through an elaborate political machine and the force of his renowned charisma, Williams' ambitions are directed at something greater than he already has: the attainment of unity across the entire Caribbean.\n\nA strident nationalist utterly convinced of the veracity of his beliefs, Williams has little patience for opposition. Democracy functions more or less as normal, but the Doc's influence is overwhelming, and his word—backed by loyal, devout supermajorities at all levels of government—is law. For better or for worse, the cult of personality around Eric Williams is the sun around which the universe of [TRI.GetName] politics revolves."

 TRI_Doc_Without_Borders: "The Doc Without Borders"
 TRI_Doc_Without_Borders_desc: "Dr. Eric Williams is affectionately called "the Doc" by some of his followers, a constituency that is larger than ever before in the aftermath of his successful repulse of what he has termed the "imperialist attempt to tear the East Caribbean Union apart in Grenada". His name is venerated almost on a level with that of a George Washington or an Emperor Pedro, and his word is even more law in the East Caribbean Union than it already was.\n\nWilliams' latest project is a broader front among the nations and peoples of the Caribbean. Since the East Caribbean Union has been such a success, "the Doc" hopes to expand it and promote a general spirit of anti-imperialism on Mexican lines throughout the region. At the same time, Williams has built on his already omnipresent cult of personality, becoming more and more authoritarian in defense of his expansive vision."

 TRI_Generalissimo_Williams: "Generalissimo Williams"
 TRI_Generalissimo_Williams_desc: "After Eric Gairy's successful invasion of Grenada that split the island from the ECU, the affection that led Dr. Eric Williams to be named "the Doc" by some of his followers has mostly been supplanted by fear of varying degrees. Even before the loss of Grenada, Eric Williams' governance exhibited some authoritarian tendencies, but now he has embraced them.\n\nPolitical parties, already hemmed in on all sides by the devotees of Eric Williams, are now violently suppressed, with the PRI model of pseudo-democracy supplanting the relatively functional system previously present. To that end, Williams' secret police, christened the "Flying Squads", are being expanded to an unprecedented level and are now as ubiquitous as propaganda posters. Every act Williams takes these days evinces fear of an American-backed operation to overthrow him."

 TRI_Paging_Doc_Williams: "Paging Dr. Williams"
 TRI_Paging_Doc_Williams_desc: "Having been forced into making concessions by the United States in order to end the Greanada Crisis, the affection that led Dr. Eric Williams to be "the Doc" by some of his followers is increasingly supplanted by contempt; the very nickname itself is slowly turning into a pejorative.\n\nHis ambitions stymied, Williams has grown withdrawn and sullen, unwilling to partake in the work of government. Williams' pronunciations have lost all energy and sound more like boilerplate communiqués. Political opposition, formerly a pipe dream, now grows in the shadows as Williams no longer takes as much of a personal hand in governance. Meanwhile, the average citizen of the East Caribbean Union watches American companies get free reign and loses faith in the man once called "the Doc" as flattery; the personality cult has been blown away like all of Eric Williams' hopes and dreams. "
 

 #French West Indies
 FWI_Spirit_Third_Republic: "Spirit of the Third Republic"
 FWI_Spirit_Third_Republic_desc: "Since the fall of mainland France to fascism in 1940, her colonial possessions overseas have met varying fates - in the case of the French West Indies (specifically Guadeloupe and Martinique), the Tréveneuc Law of 1872 was invoked, handing control of the islands over to several emergency councils that continue to govern them democratically and within the framework of the 3rd Republic. On paper, at least.\n\nIn reality, the matter of Antillean self-government is far more complex than it appears on the surface. The United States assumed control of the islands until further notice, using the Short-Fulbright Act of 1947 to provide a legal basis for doing so. While the Antilles may officially be self-governing, they are doing so under heavy American supervision."

 FWI_An_Ugly_American: "An Ugly American"
 FWI_An_Ugly_American_desc: "They're everywhere nowadays. On your screens, in your newspapers, even in your damn government. You can't escape them. They barge in, no care whatsoever for what you may think or believe, and do what they feel is right.\n\nAmericans.\n\nLyman Lemnitzer is one such American. As the Civil High Commissioner for the U.S. Antilles, he has a pleasant face, a welcoming smile, and a can-do attitude; a veritable role model for policy in the former French colonies. But he is an American - a high-ranking one in the military, at that. And with that comes the issues endemic to American methods. His tendency to intervene in local issues has built up a rather tense relationship between the islands' existing institutions and the American Civil Administration. He is, in short, an intrusion. One that many in the Antilles find themselves growing sick of."

 FWI_Corporate_Cartels_Labor_Unions: "Corporate Cartels and Labor Unions"
 FWI_Corporate_Cartels_Labor_Unions_desc: "It is no secret that the High Commissioner and his general staff all hold an affinity for the time of the New Deal, and this can be seen obviously in day-to-day life in the Antilles. Owing to years of New Deal workshopping, both capitalist cartels and labor unions are essentially political entities in and of themselves, especially when it comes to local politics.\n\nIn comparison to other United States-run entities, this is remarkable and creates a sense of harmony between the administration, business, and labor. However, this comes with its problems - should both elements clash or turn against the administration, it would be nigh-impossible to quell them."

 FWI_Stagnating_Plantation_Economy: "Stagnating Plantation Economy"
 FWI_Stagnating_Plantation_Economy_desc: "In 1960, the United States attempted to recapture lightning in a bottle. American economic planners implemented an initiative in the Antilles called Operation Uplift, similar to the Operation Bootstrap initiative introduced in Puerto Rico years earlier. Aiming to invest state funding in infrastructure that would lead to a decidedly more corporate, commerce, and production-focused economy, administrators hoped that the project would bring the islands greater economic prosperity and increase productivity.\n\nUnbeknownst to the high-minded pencil-pushers in Washington, however, this would only harm the Antillians. As workers left the plantations on the more agricultural islands in droves for the cities, there soon were simply not enough jobs left to go around. With a stratified class divide between the urbanites and farmers developing and the economy soon tumbling in turn, Uplift has only damaged the economy and led to a sense of lingering resentment amongst the locals."

 FWI_Squabbling_Few: "The Squabbling Few"
 FWI_Squabbling_Few_desc: "Out of all the critics and rebels, Albrand's plantocracy seems to face only one persistent opponent, the planters themselves. Decentralization and favoritism made the plantocrats the nation's undisputed masters, and now there is no enemy to fight against but their own.\n\nCoalitions, interest groups, and patronage networks spring up and spread out within the state's upper-class society. Though often only a product of tribalistic thinking, in search of sponsors, they often appeal to foreign powers that Albrand himself dare not meddle with. If this squabbling spirals out of control, Médard Albrand will enter the history books as nothing but a failure."

 FWI_Retreat_Planteurs: "Retreat of the Planteurs"
 FWI_Retreat_Planteurs_desc: "Plantocracy has been eradicated from the Antillean political sphere following Paul Valentino's ascendance to leadership, leading to mass outrage from the right-wing. Drawing from the Confederation's lower castes, the opposition now mobilizes against Valentino's New Deal-inspired platform by claiming the Prime Minister to be a pawn of American imperialism — a false populist stealing from the vulnerable.\n\nFor most Antilleans, there exists nothing as abhorrent as Jim Crow beyond the Mason-Dixon. The pro-Americanism of Valentino had made it easy to associate him with one of the deepest threats to the grassroots that the right opposition now appeals to. Whether it is slander or truth, this unintended baggage has soured many's perception of their new Prime Minister."

 FWI_Peoples_Triumph: "People's Triumph"
 FWI_Peoples_Triumph_desc: "Once created to preserve the dead flesh of archaic Europeanism, the American project of Antillean federalization has backfired, somehow being appropriated by Francophone socialists in the region as they take the lead in implementing the initiative, enthusiastically even.\n\nTurning the tools of the oppressors against their own, the original institutions of colonial bureaucracy have been made a space of tolerance and good-natured fraternity by the various left-wing movements which it now encompasses. For the time being, West Indian socialists have much to rejoice over while their rightist kinsmen huddle in fear as red flags proudly fly over the Caribbean."

 FWI_Socialized_Colonial_Economy: "Socialized Colonial Economy"
 FWI_Socialized_Colonial_Economy_desc: "The plantation economy was the legacy of colonialism and utmost humiliation. As a reminder of the Antilles' grimmest hours, being glad that it is but a relic is nothing short of an Antillean's civic duty. With the plantations' lands back to their tillers and its extractive exports nationalized for the masses' welfare, in a few generations, perhaps there will be no need for a state to hold its economy on cash crops alone.\n\nAs we now break our backs, the profits of our present toil shall sustain a million mouths in a better time. Nous avons osé être libres, osons l'être par nous-mêmes et pour nous-mêmes."

 FWI_Broad_Front_Opposition: "Broad-Front Opposition"
 FWI_Broad_Front_Opposition_desc: "The APF has truly become a symbol of unity, merely for an alliance not of their own. All capitalist forces now muster their arms, whether it be the cosmopolitan liberals, the unyielding planters, or the distinguished conservatives, none have any patience left for the impossible agenda of the Reds to make the Caribbeans their own.\n\nForming into a broad-sweeping rightist front with the sole goal of bringing one common enemy down, the APF faces severe challenges in all legislative actions as filibusters and boycotts grow increasingly frequent, and intolerable across all departments. Those who swore allegiance to the capital will not rest until they see to the socialists' removal from power."

 FWI_Beyond_The_Third_Republic: "Beyond the Third Republic"
 FWI_Beyond_The_Third_Republic_desc: "For all her nationalistic pride and newfound liberties, Antillean rule of law is but a morsel out of the carcass that is the French Third Republic, a name that evokes little but humiliation since its fall in 1940. The Black Power activists try and the nationalists nudge, but no movement can truly escape the legacy of the slaving system that their former overlord had ingrained through its existence.\n\nNone except the truly optimistic can foresee a future without French remnants, and neither do the socialists think it is practical to demolish all existing agencies at one instant. It is hard to tell whether it would take five years or five decades, but this time of decolonization is, regardless, the last chance to leave the old times where they belong."

 FWI_Exiled_Opposition: "Exiled Opposition"
 FWI_Exiled_Opposition_desc: "The cowardice of Parti Républicain seemed to have secured a brighter future in a blink. But in truth, it was never that simple. Those stooges for the slaving planters and their bosses, bereft of protection, fled the Antilles. They were not so much overthrown as they took the chance to migrate when the workers stormed their fields.\n\nThe PR and the planter elites might seem to be history, but they took with them a most potent weapon — capital. Fleeing across the Caribbean with a bulk of Guadeloupe and Martinique's wealth embezzled, they are now working tirelessly to call for their new government's destruction from across the sea."

 FWI_A_Revolution_Secured: "A Revolution Secured"
 FWI_A_Revolution_Secured_desc: "With the failure of the counterrevolutionaries to secure their victory, the PPA can finally identify and successfully root out the remnant reactionary elements embedded within the administration. As the putschists' brief but tyrannical rule had pushed all but the most fanatical rightists into supporting Archimede's front, the revolutionaries are now finally in a truly secure position.\n\nHowever, the dominance of the United States in the region remains a looming threat, and any missteps against its direction spell imminent doom for the revolution again. It is, therefore, an unfortunate decision that the Confederation must maintain a moderate foreign policy until there is a chance to get rid of the hegemon."

 FWI_Confederations_of_Federations: "Confederation of Federations"
 FWI_Confederations_of_Federations_desc: "The Antillean nation is not merely a two-island confederation, it is an entangled union of two autonomous federal states with little in the way bureaucratic commonality. Essentially only in existence because of Guadeloupe and Martinique's unyielding elites, the Confederation's structure is, in effect, a mess of labyrinthine apparatuses separated in all their functions by a fundamental artificiality.\n\nThe product of this dysfunction culminates into an impossibly feeble executive branch in the union, one easily corruptible by local elites if they so choose. Can a government truly serve the people if it were no more than the same old gangsters in a fresh coat of paint?"

 FWI_Outmoded_Plantocracy: "Outmoded Plantocracy"
 FWI_Outmoded_Plantocracy_desc: "Some people survive, yet never adapt. The plantocrats of the Confederation remain the single most influential group despite maintaining economic practices centuries behind the trend. For most of them, improving their underlings' livelihoods had never come across their minds, and wastes matter little so long as they can stuff themselves full.\n\nThese practices are despised by the majority of the populace, from the bottom to the top, who all perceive the plantocracy as being no different from colonial rule. But so long as the Parti Républicain cannot find a better backer for their ventures, this backward caste of lords will continue their rule over the Antillean economy."

 FWI_Victorious_Counter_Revolution: "Victorious Counter-Revolution"
 FWI_Victorious_Counter_Revolution_desc: "Supported by the planter aristocracy, the Parti Républicain has successfully executed its coup d'etat against the Archimède government to establish a new "liberal republic". Returning in kind to the landowners' patronage, the current government has pledged to minimize its interference with the group's internal affairs as a policy aligned with its laissez-faire financial approach.\n\nDespite nominal freedom of speech and commerce being upheld as of present, economic inequality grows rampant as government programmes shut down due to a lack of funding. An utopia for the plantocrats, but not much of a place to be for anyone else."

 FWI_Underground_Popular_Front: "Underground Popular Front"
 FWI_Underground_Popular_Front_desc: "Following the illegal deposition of her left-wing cabinet, Gerty Archimède has gone underground with a few revolutionary militants in preparation for a full-scale retaliation against the putschists. As insurgents begin their offensive at the countryside, there is a fear amongst the plantocrats that the quelled opposition may yet consolidate into a true united front.\n\nThe Antilles is not a large state, and it will not take many to topple the regime as is, let alone being pitted against a well-trained paramilitary organization. Without further aid from Washington's hawkish sponsors, there is no hope for the Antillean government to survive this insurgency."

 FWI_Insular_Federalism: "Insular Federalism"
 FWI_Insular_Federalism_desc: "The unification of the Antillean islands into a single polity has resulted in an administrative strain that none of its individual constituents had the resources to moderate on their own. Under the advice of North American advisors, the Antilles opted to take on a governing model closely resembling that of the United States' federal-state system: individual islands treated as semi-autonomous states.\n\nCharacteristically, the executive branch of the central government is given significant power over the judiciary and the legislature, which are to be dictated by the islands independently, save in extraordinary circumstances."

 FWI_An_Ugly_Shadow: "An Ugly Shadow"
 FWI_An_Ugly_Shadow_desc: "The White House can feign ignorance for as long as it likes, but after the dust settled, men merely turned into dollars, and the foreign occupation authority became the corrupt local government. Under the guise of humanitarian aid, the United States has all but vassalized the integral institutions of the Antillean government. Be that the military rallying around their America-trained officers, or the politicians seeking New York lobbyists to fund their ventures.\n\nColonialism is no longer fashionable, but entrepreneurship is. Northern businesses find in the Antilles a frontier to fulfill their vision of unfettered capitalism, and they will not let it go without a fight."

 FWI_Corporatized_Colonial_Economy: "Corporatized Colonial Economy"
 FWI_Corporatized_Colonial_Economy_desc: "Progress does not necessarily mean improvement, sometimes it simply means matters have steered from its origin. The Confederation has made the reasonable decision of diversifying away from the feudalistic plantation system which the states had operated under, and in its place came a system of state-ownership, charters, and more assets on the paper trail — things of a corporatocratic imagination.\n\nIf nothing else, at the very least, a state-controlled system undoubtedly spreads financial corruption out from a few dozen barons to many hundreds of desk jockeys. It is assured to be good news that more citizens are getting a say in economic matters, for there is always a shortage of fresh minds in a modernizing landscape."

 FWI_Guilliods_Presidential_Republic: "Guilliod's Presidential Republic"
 FWI_Guilliods_Presidential_Republic_desc: "Democracy is a sham for the unwashed masses, a swarm of larvae and ants deserving of protection, but not the right to lead their own kind to a ruin which themselves surely shall bring about. In all their wisdom, the Guilliod cabinet has moved away from useless federalism, a system inherently hamstrung by the masses, to the more appropriate governance of a presidential republic, where the president is truly the first among equals.\n\nOf course, the people should still have a say in electing someone they wish to keep in power, but it will matter little whether that name is Raymond Guilliod or not. All the strings come back to their puppetmaster, whether that be sooner or later."

 FWI_Strange_Bedfellows: "Strange Bedfellows"
 FWI_Strange_Bedfellows_desc: "A man of unclear inclinations does not gather many friends in a world of black-and-white, and enemies to Guilliod's reforms strike him from both sides. Red flags hate the man tearing their imagined utopia asunder, red necks hate the man for quieting a century-old economic lifeblood — meanwhile, the meekish conservatives are too cowardly to stand up for their friend in power.\n\nIs Raymond Guilliod a centralist tyrant or is he a despotic strongman? That is a question to which none of the opposition can provide a uniform answer. But so long as they run the current course and crush whatever initiatives they see the cabinet pursuing, it is unlikely that the Confederation's status quo will stand."

 FWI_Antillean_Developmentalism: "Antillean Developmentalism"
 FWI_Antillean_Developmentalism_desc: "Guilliod's cabinet is not keen on giving in to the radicals or the reactionaries, no matter how loud they protest. It is beyond foolish to place Antillean livelihood beneath placating those few restless minorities. In the place of socialism and feudalism, the current pursuit of a liberal twin policy, that of tourism and privatization, has brought significant North American investment into the economy.\n\nWith foreign entrepreneurs being keen on turning a long-term profit, the Free Market gradually lards its own cogs into a self-sustaining model. The Confederation will prosper regardless of her naysayers!"

 FWI_Actually_Existing_Gaullism: "Actually Existing Gaullism"
 FWI_Actually_Existing_Gaullism_desc: "Raymond Guilliod is stuck in a purgatory of two mutually-exclusive friends, both of whom he must keep placated at all cost. The Free French exiles backing Guilliod naturally expected compensation from the cabinet, and in their process of finding high ranks in Guilliod's government to fill, they have built an atmosphere of cliques where each only desires to benefit their own protégé, with little regard for other contenders.\n\nThe other backer of Guilliod, the White House, is now displeased with the exiles for making inserting US-backed officials difficult, viewing their attempt of taking over the Antilles with little but contempt. Now Guilliod must act as a middleman between the Free French ambition and America's new colonialism, to drink both poisons rather than picking."

 #Anguilla
 AGL_Reluctant_Revolution: "The Reluctant Revolution"
 AGL_Reluctant_Revolution_desc: "The policymakers of Anguilla were not keen on moving their organization away from the Leeward Islands, yet neither could the people stomach a blatant contempt from those who rested upon the ivory tower. While most other so-called revolutions tend to be the products of international meddling, the secession of the island from its brethren was reluctant, yet an inevitable consequence of a decade-long negligence that had pushed the masses to the brink.\n\nDespite being diplomatically isolated following its de facto independence, desperation had brought out a revolutionary spirit which the people themselves knew not they had. Hope for development burns brighter than ever despite ostracism from her peers, for so long as the nation stands, no hardship will be too great to endure."

 #Dominica
 DMI_Cultural_Revolution: "The Caribbean Cultural Revolution"
 DMI_Cultural_Revolution_desc: "In order to aid Dominica in the pursuit to separate from her burdensome and antiquated colonial identity, Prime Minister LeBlanc has initiated a broad-sweep operation to co-opt the popular Black Power movement into the infant state's civic-patriot tradition, which many had chosen to brand as "Dominican culture".\n\nFor the sake of creating an ideal which appears entirely distinct, LeBlanc had also appropriated Amerindian images into this artificial Dominican culture, despite the often questionable authenticity of such perceptions. Whether a Kwéyòl-speaking Dominican nation will persist into the future remains to be seen, but any progress in this project will certainly require a great deal of civilian involvement."

 DMI_Peeling_Banana: "Peeling the Banana"
 DMI_Peeling_Banana_desc: "Banana planters are a pestilence to the pursuit of a modern Dominican nation, and looking to our neighbors, it is better to be rid of them now than to suffer their harm later. Prime Minister LeBlanc, for one, recognizes a need to learn from the precedents of other surrounding nations, even those with whom Dominica is not on the best of terms.\n\nTaking after the examples of Mexico and Cuba, the Chief Minister has begun consolidating the countryside's socioeconomic forces against the plantation system with little regard for its disturbance to the country's traditional income stream. Although LeBlanc's direct concern in the matter has earned him praise from rural communities, a few also see his strong-armed measures as dangerously close to becoming dictatorial."

 DMI_Growing_Dissent: "Growing Dissent" #Not Coming In MT
 DMI_Growing_Dissent_desc: ""

 #Saint Lucia
 SLU_Two_Faces_Labour: "The Two Faces of Labour"
 SLU_Two_Faces_Labour_desc: "Saint Lucia's political habitat is ruled by a Janus-faced diarchy that remains nominally united under the Labour banner. In recent years, as anticolonial sentiment has become especially alluring to the left-wing party's populist segments, a Black Power wing has inevitably split from the original, unionist strand, effectively creating an equal-chanced factionalism within the SLLP.\n\nThis ideological struggle within the party ignites a powder keg on the island where they reign undisputedly while bickering amongst themselves — any conflict they may have will most certainly wreak havoc on the fragile balance keeping Saint Lucia's worst excesses in check."

 SLU_Ruins_Metayage: "Ruins of the Metayage"
 SLU_Ruins_Metayage_desc: "During its agrarian days, Saint Lucia had managed to avoid becoming a full plantation economy by adapting a form of sharecropping known nowadays as métayage, which, despite its more egalitarian outlook, had also resulted in severe economic stagnation. Moreover, it had created a stark divide between the prevalently forward-looking city dwellers and the general peasantry.\n\nSince the 1950s, in an attempt to proletarianize the rural banana farmers and to encourage land development, the system had been officially abolished by Castries, with non-compliance often being met with harsh enforcement. As a consequence, even after more than a decade, the transition remains unpopular with the countryside despite its undeniable economic fruits."

 #Grenada
 GND_Mongoose_Revolution: "The Mongoose Revolution"
 GND_Mongoose_Revolution_desc: "Running with his posse of thugs, colloquially known as the Mongoose Legion, Eric Gairy had seized power in Grenada under the sole mandate of removing East Caribbean presence from the island due to its continuous overreach under Eric Williams' direction. Supported primarily by filibusters, mercenaries, as well as a fair share of disgruntled, underpaid police officers, Gairy's right to leadership is far from a popularly supported one.\n\nThough the entire island has been placed under a state of emergency due to supposed evidence of imminent retaliation from Trinidadian forces, Gairy's current dictatorial rule remains merely moments away from slipping if he ever fails to satisfy his base."

 GND_Grenadian_Connection: "The Grenadian Connection"
 GND_Grenadian_Connection_desc: "Eric Gairy's revolution was not a purely grassroots one, rumors abound of his connections to foreign intelligence from America to Iberia and general association with organized crime. Whether an economy can maintain itself on dark money and smuggling is an open question and a key driver of Gairy's quest for legitimacy. "

 #Antigua
 ANT_Tourist_Wasteland: "Tourist Wasteland"
 ANT_Tourist_Wasteland_desc: "While Antigua has always been reliant on foreign powers for trade, at least in the past its economy relied on two pillars. By the time the bells of indepence ushered a new epoch, however, one of the had long since turned to dust. Without irrigation, infrastructure, or consolidation, there are almost no staple crops being produced in the area, making the local economy and the lives of the island's inhabitants totally dependent on foreign aid.\n\nThe one saving grace for Antigua is its tourist industry, which, while still outcompeted by most other Caribbean nations, provides the necessary income to keep at least a portion of the island's population affluent."

 ANT_Magpie_Treasure: "Magpie's Treasure"
 ANT_Magpie_Treasure_desc: "Corruption is rampant within Antigua and it is by no means a secret. Vere Bird has been in charge of the island for decades, with his family numbering among the island's richest inhabitants, joined by by the new class of elites that filled the thrones left desolate following the collapse of the plantations. Union men and administrators, loyal only to the dollar, and only as long as it lines their pockets. Bird may be the face and champion of this status quo, but he is by no means the sole claimant to it."

 ANT_Reign_Rooster: "Reign of the Rooster"
 ANT_Reign_Rooster_desc: "Vere Bird, the strongman Prime Minister of Antigua and Barbuda, has ruled the nation with an iron fist since his days as a union boss during the war. He and his family lord over the island like a feudal dynasty, using his dual control over both the Antigua Trade and Labour Union and the Antigua Labour Party to dominate the country's political scene.\n\nThis status quo has only been slightly shaken with the coming of independence and the belated rise of a rival party, the Progressive Labour Movement. However, tossing the old Bird from his roost will be no small feat."

 ANT_Northern_Migration: "Northern Migration"
 ANT_Northern_Migration_desc: "George Walter has achieved the impossible in unseating Vere Bird, and in a bitter tragedy must now achieve it once more. Following his defeat, Bird has fled to New York, and he was by no means the sole one to do so. With a significant portion of the state apparatus in chaos and the country's reserves sacked, Walter has found Vere's absence to be just as worse.\n\nThough tears may be shed now, the tragedy may yet worsen and transform into a farce. After all, if he fails to rebuild the country, what's to stop the people from merely voting Bird and his cronies back into power during the next election?"

 ##WIF ##
 WIN_Palm_Maple_Oak: "Palm, Maple, Oak"
 WIN_Palm_Maple_Oak_desc: "Despite achieving nominal independence, the West Indies Federation still remains under the unfortunate grip of competing influences, in an unceasing tug of war of political favors and ravenous business initiatives.\n\nWhile Canadian authorities still claw at any measure of control it can retain over their former colonies, ensuring they don't venture too far from the Commonwealth, the opposite side sees the US grasping at an opportunity to steer the archipelago towards its own direct sway.\n\nAnd right in the middle, stuck between the hands pulling from each flank are the forgotten few that call the islands their home, with each pull peeling at the growing chafe felt by those slowly starting to realize that their newfound autonomy might only be in name."
 
 WIN_Caribbean_Shield: "Caribbean Shield"
 WIN_Caribbean_Shield_desc: "For the American defense doctrine, the Caribbean is, and always has been, its first bulwark against any threat of military insertion coming from the Atlantic.\n\nDespite its days as a theater for submarine warfare during the Second World War being long gone, this strategic value hasn't changed; but the circumstances most certainly did.\n\nIf the newly founded Federation has as of yet complied in continuing to fulfill its territory's previous role as a critical maritime holdfast for the OFN, it's only a matter of time before the people living on the islands want to take the matter of its defense into their own hands."

 WIN_Shadow_Federation: "Shadow Federation"
 WIN_Shadow_Federation_desc: "In the heart of many of its inhabitants, the founding of the West Indies Federation is shared as a moment of pivotal triumph, the achievement of a two-decade-old dream of self-rule achieved from the yoke of the US and Canada.\n\nBut after the fireworks had faded and the chants grown silent, the new administration was faced with a challenging reality: they now held de jure authority over a series of islands upon which they held absolutely no real control.\n\nIn practice, things have barely changed, and in most cases, day-to-day rule is still exercised by the same local councils as before, while the federation's central government struggles under the weight of its own political squabbles."

 WIN_Lost_at_Sea: "Lost At Sea"
 WIN_Lost_at_Sea_desc: "The lack of genuine authority exercised by the Federation's central government means that in practice, each local administration is left to its own devices, especially in matters pertaining to economic planning.\n\nWithout any kind of unified direction, the archipelago has turned into a maze of conflicting policies, with one islet following its own carefully monitored development scheme while its neighbour thrives as a hotbed of free market laissez-faire.\n\nBeyond being an administrative headache to keep track of, this disharmonious development proves to be a serious hindrance to any kind of organized trade between the islands, or even in issues as benign as establishing a coherent customs or immigration doctrine."

 WIN_Pan_Caribbean_Dream: "The Pan-Caribbean Dream"
 WIN_Pan_Caribbean_Dream_desc: "For the first time in history, the people of the West Indies have been united as one, in a country that they may call their own. A fact that will remain true even in the face of all the severe issues troubling the newborn Federation.\n\nIts myriad member states might linger on the same inter-island rivalries as prior, and its government be no more than a shell facing backlash at any real measure of control it may try to assert over the local councils.\n\nYet despite these constant quarrels, each of the competing voices urging their own path for the archipelago's future does so in enthusiasm toward a dream shared by all: that of a truly Caribbean nation, both in name and spirit."

 #Oil Crisis
 WIN_Enter_Hurricane: "Enter the Hurricane"
 WIN_Enter_Hurricane_desc: "Stalwartly emerging through the strife surrounding its establishment, the newborn West Indies Federation would enter the next decade with its eyes shining with promises of a bright and prosperous future for its denizens.\n\nOnly for the Oil Crisis to wipe all of these hopes away.\n\nNow, what remains of these idealistic foundations is an administration struggling to pull the myriad of islands under its authority away from impending economic collapse. Unless it finds the means to reform its crumbling institutions or the salvatory hand of an outside benefactor, it seems the central government will be powerless to stop these dreams of independence from ending in tragic disaster."

 #Canadian Bailout Path
 WIN_Maple_Autumn: "The Maple Autumn"
 WIN_Maple_Autumn_desc: "After the dust settled and the white papers and communiqués slowed down enough to be legible, it became clear that the status quo of the West Indies Federation was to be continued under closer Canadian supervision. With this decision being finalised, the Dominion of Canada seems ascendant in their patronage and influence over the federation. The liberal chauvinistic vision all parties in the Canadian Parliament have held in respect to the governance and future of the WIF appears unshakeable.\n\nThough the average foreign-policy enthusiast in Canada may be joyful at the continuance of Canada "fulfilling its duty to uplift and enlighten" the peoples of the WIF, said peoples are nowhere near as enthusiastic. Large swathes of the citizenry chafe at the seeming neocolonialism of the new system. A greater problem that large swathes of Parliament seem ignorant of at the moment is American skepticism. Looking on from Langley, Foggy Bottom, and elsewhere in the Potomac River valley, Uncle Sam makes no secret of his doubt that Canada will be able to hack it a second time."

 WIN_Follow_North_Star: "Follow the North Star"
 WIN_Follow_North_Star_desc: "Amidst the chaos of the Oil Crisis and accompanying economic collapse, the Canadian government has taken action to stabilise the situation in the West Indies. Assuming control for general economic planning, the Canadians have sold off distressed state assets to Canadian and American corporations and enforcing a diminishing number of state-sanctioned monopolies.\n\nMany citizens of the West Indies regard the Canadian measures as neo-imperialistic in nature, more focused with the Canadian Department of Finance's bottom line than the welfare of those Canada purports to "help". Others, observing that Canada has also propped up the preexisting social-safety nets with loans and oversight, consider Canadian economic command and control to be preferable to complete economic collapse. "
 #American Reforms Path
 WIN_Sturdy_Oak: "The Sturdy Oak"
 WIN_Sturdy_Oak_desc: "The maple tree of Canadian dominance in the West Indian Federation has fallen over, reduced to a blasted stump under the strain of the Oil Crisis. A sturdy oak—American rule—has had to be propped up in its place. America takes up this task with little enthusiasm; not desirous of wasting time or resources on the region's political development, Washington had been content to leave it to Canada... until things went to hell on Canada's watch. Ottawa is unfit for purpose. The peoples of the Caribbean are hardly any better off, riven by division and tortured by economic uncertainty. No matter how much America might kick and scream, it falls to Uncle Sam to make the concept of the "American lake" a reality."

 WIN_New_Captain: "A New Captain"
 WIN_New_Captain_desc: "The West Indies Federation has not had much choice in the decisions it takes. Before, it was Ottawa that would dictate terms to it; today, Washington has taken that role. These days are no exception: in exchange for an American-led bailout, the WIF has been "invited" to accept a plan of massive economic overhaul pioneered by the rising economic star Thomas Sowell.\n\nSowell, a Chicago-educated economist, intends to turn the West Indies into a showpiece for his radical economic liberalism. To that end he focuses obsessively on breaking down protectionist measures and other such trade barriers, slashing taxes and "red tape", and busting the "collectivist" unions that he perceives as making investment difficult. Whether the West Indies like it or not, a new, more capitalist era has dawned in these islands. "

 WIN_United_States_Caribbean: "United States of the Caribbean"
 WIN_United_States_Caribbean_desc: "Further to other economic and political changes brought about by the replacement of exile-influenced Canadian paternalism with Chicago-influenced American paternalism, the West Indies Federation has also undergone a total rework of its governing apparatus. The new WIF is more strictly a federation; increased power has been centralised upon the capital, while at the same time more governance is devolved upon the various islands.\n\nThe American federalist model has sufficed for American purposes, but part of that is brought about by the connectedness and relative homogeneity of the United States compared to the Caribbean. The WIF is composed entirely of discontiguous islands, and has more ethnic groups in a single island than America often hosts in several states; accordingly, whether this new governance will actually be a good fit for the West Indies remains to be seen."

 #Williams Path
 WIN_Young_Palm: "The Young Palm"
 WIN_Young_Palm_desc: "Narrowly avoiding certain economic demise with the help of a providential bail-out, the precarious archipelago now finds itself left to carve its own way out of the recent crisis, with both Canadian and American authorities choosing to take a more hands-off approach despite the lingering instability.\n\nHowever, this comes at the irritation of both those who would have hoped for the opportunity of some long-overdue reform to the Federation's quivering structure, and those who consider yet another influx of money from the west as further proof that the looming shadow of their colonial overlords is never quite far."

 WIN_Federate_or_Die: "Federate or Die"
 WIN_Federate_or_Die_desc: "With the approval of the reform plans jointly proposed by Eric Williams and the Federal Labour Party, the Federation now undergoes a process of rapid centralisation, aiming to leave the government in Bridgetown more adequately equipped to administer the archipelago's many individual member states.\n\nThis, of course, comes at the chafe of those who cherished the relative autonomy that their own islands had until now enjoyed, leading to growing concerns as the balance shifts between proponents of increased state control and those advocating for preserving the decentralised status quo."

 WIN_Charting_Course: "Charting a Course"
 WIN_Charting_Course_desc: "For the first time, the West Indies Federation can make a claim of being master in its own house. It intends to take this newfound freedom with both hands. Armed with newfound powers and increased revenue generation, the newly-centralising West Indies Federation plans for a bold new era of economic development radiating out from its capital of Bridgetown.\n\nInspired by Trinidadian state-driven developmentalist plans and backed by Trinidad's oil money, the WIF has begun the hard work of moving away from the plantation economy of old and turning the West Indies into a modern nation providing social services to all its citizens. The journey will be protracted by funding questions and the resistance of entrenched economic interests, but the West Indies Federation seems set on staying this course no matter the cost. "


 #### EVENTS ####
 # Caribbean Flavor events - Hereth Lie the Deprecated Bob Marley Event Chain, RIP
 
 wif_crisis.300.t: "Speak to the Moment"
 wif_crisis.300.d: ""There's no reason to go crazy," Bunny Wailer said. "It's our first album."\n\n"I get that, but we need to do something that makes us stand out," Peter Tosh contested with a snort. "Yeah, do some covers, but we need something... distinctive. Memorable." It was something that Bob Marley agreed with.\n\nThe Wailers had enough of a following that an album would probably do well - but that laid upon the assumption that they would even get to that point. As it turned out though, figuring out exactly what that album was going to be was easier said than done as the hours of argument had proven.\n\n"We're doing this wrong," Bob finally interrupted. "We're talking about doing what everyone else has done before. Why not something on our own? Something actually Jamaican?"\n\n"No one wants that." Bunny dismissed.\n\n"No one?" Bob contested, gesturing outside. "Have you seen the referendum? We might have our own country soon. There isn't going to be a better time for something like this."\n\n"I'm on board," Peter said. "It's a risk, but fuck it. Bob's right, there's a moment here we should take."\n\n"I'd rather be remembered as trying to do something different, even if it doesn't work," Bob finished. "I want to make something that is ours - not American, German, or Japanese."\n\nBunny exhaled, but it was resigned - the sound that he knew meant that he would concede. "Alright then, if we're going to do this - we better make it the best damn album on the island." Bob grinned. This was going to be his defining moment - he could feel it."
 wif_crisis.300.a: ""Don't worry Bunny, we're not shooting for anything less.""

 wif_crisis.301.t: "Right Man, Right Moment, Right Music"
 wif_crisis.301.d: "The best art was that which met the moment, and Bob Marley considered himself someone who had been the right man to capitalize on such moments. Of course, there had been a certain element of luck to it - after all, what were the chances that they'd be making an album right when a historic referendum was taking place?\n\nHe patted Bunny on the back as they celebrated. "Told you it was the right time."\n\nHis mate smiled. "For once, I'm glad that I was wrong."\n\nAs it turned out, his unconventional album idea had been exactly what the people were looking for. Something that was Jamaican. In the days since release, the album had become a point of national pride - and an international hit. Bob remembered walking down the streets, and hearing their music playing in restaurants, bars, on car radios, and even along street corners. They'd become celebrities, welcomed with applause and cheers wherever they went to perform.\n\n"Money, fame, and a label," Peter smiled as they drank. "I don't think we could ask for more."\n\n"No," Bob mused. "I don't think we could do better than this." They'd already been approached by a Japanese studio to sign them to a label. Something they hadn't expected to be even considered for years. Not one of the biggest labels in the Sphere.\n\nAs they celebrated, he wondered if anything would match this success. Well - only if he was content to keep everything the same. No, this was just the start. Whatever the future held, he would never become stagnant. There were many other artists who they were connecting with now, ones he looked forward to collaborating, learning, and being inspired from. It was a uniquely special time, and he felt that the best was yet to come."
 wif_crisis.301.a: "A uniquely Jamaican moment."
 
 wif_crisis.302.t: "Tempered Success"
 wif_crisis.302.d: "Bob Marley sighed. "Go on, say it. I know you want to."\n\nBunny's lips were fixed in an unhappy smile. "Told you so."\n\n"Yeah," Bob rubbed his eyes. "I suppose you did." Now that the initial numbers had come in, the numbers were... fine? Decent? Passable? The album was a success on paper - barely. However, they'd been told that for a first album, it wasn't bad. Most didn't even make their money back.\n\n"It's not a failure," Peter said, being the optimistic one. "More people know who we are now. And we won't be sleeping on the street."\n\n"Always looking on the bright side," Bunny said wryly.\n\nBob supposed that Bunny had been right in the end. People just didn't want this. There'd been a brief period of national Jamaican pride at the start of the whole referendum business, but that had faded. That made him... sad? Disappointed? Resigned? He wasn't sure, but it felt like an end of something. Forever.\n\n"We got lucky we broke even," Bunny said. "Next time? We're sticking with what works. Either of you disagree?"\n\n"Nope," Peter said. "Too bad, but I guess people want the familiar. Or at least... some of the familiar." Bob unfortunately agreed with that, though it was more resignation. Maybe in a few years, with a few more successes, they would be able to do something like this again. He supposed it was a learning experience for them all. It was time to move on."
 wif_crisis.302.a: "Plans for the future."
 
 wif_crisis.303.t: "The Curse of Caring"
 wif_crisis.303.d: "Cool wind blew as Bob Marley walked alone as night fell upon Jamaica. It was a cloudless night, and the stars shined brightly upon the island. He walked without aim or purpose, his mind distracted. He should have been celebrating with his mates at the respectable success of the album. Maybe not as big as they might have hoped, but a lot of people were enjoying it. The Wailers were definitely a known name now, and the band was happy.\n\nAll of them, except him. No, no, that wasn't quite right. He was happy it was doing well, but he was... distracted. What happened with the referendum overshadowed everything. The United States crushing the idea of an independent Jamaica from even forming bothered him. He nor his mates had ever been very political, and something like this shouldn't really bother him. Politics was for the rich, the suits, and the politicians.\n\nHe shouldn't care, he didn't think he would care, but he did.\n\nIt seemed a cruel joke that an album that had such a Jamaican inspiration was released at a time when Jamaican independence was gone. It made something like an album seem unimportant in comparison. It made him think about the whole situation. Politics. He didn't really know what to do with this feeling now. It was all he could think about, and he couldn't ignore it. He cared. So he should do something, right? But what?\n\nSomething caught his eye, and he paused along a street corner. A pamphlet splattered with direct and water stains was plastered on the side of a wall, but perfectly legible. Something from the Labourarty, which condemned the US decision. The words spoke to his newfound frustration and anger. He'd never really given them much thought before, but... why not now? His hand reached up and took it down, and shoved it into his pocket before he turned, and began making his way home."
 wif_crisis.303.a: "He had much to think about."

 wif_crisis.304.t: "Deterioration"
 wif_crisis.304.d: "Robert Graham Miner, U.S. Ambassador to the West Indies Federation, read the report in front of him with a growing sense of alarm and trepidation.\n\n"REPORTS OF VIOLENCE AGAINST MEMBERS THE CURRENTLY-RULING PARTY, TO WHICH THE PRIME MINISTER OF JAMAICA BELONGS, ARE INCREASING DAILY. IF CURRENT INCREASING TREND CONTINUES HAVE EVERY REASON TO SUSPECT A POTENTIAL OUTBREAK OF WIDESPREAD POLITICAL VIOLENCE ON THE ISLAND."\n\nHe threw it down and grabbed his phone. Hopefully the Prime Minister would be able to clarify the situation and provide needed reassurance that it was under control.\n\nAfter a brief dial tone, the phone was picked up not by the PM but by his secretary. "I'm sorry, Ambassador Miner, but the Prime Minister is visiting his minister of the interior, who as I'm sure you know just got sent to the hospital. Would you like to leave a message, by any chance?"\n\nRobert shook his head. "No, thank you. I think it can wait." As he said that, he was already planning a trip to Kingston to confer personally with the Prime Minister.\n\nAs Robert passed by a cabinet, his eyes fell on a .38 revolver with six bullets left next to it. He abhorred violence, so it galled him beyond belief to have to consider it. Despite this he took the gun and its holster and put the bullets in a place where he could easily access them."
 wif_crisis.304.a: "Just as a safety precaution, he thought."
 
 wif_crisis.305.t: "I Shot the Sheriff"
 wif_crisis.305.d: "The crowd had swelled in the past hour. Bob Marley didn't know who had organized it, but considering that the Rastafari made up a substantial majority, he could make an accurate guess. The growing repression and apathetic nature of the Jamaican government was hitting them hard. A line of police stood at the end of the streets and on corners, watching warily as the crowd chanted slogans and demands, tense and clutching their batons and rifles tightly.\n\nBob was only one of many in the crowds, but even he could feel the mood of the protest slowly shift. It had been growing for a long time, well before today, simmering on both sides, as the crowd began turning their ire on the police. There were no politicians here to listen to them, so the next logical target presented itself.\n\nThen it snapped. One of the protestors who'd gotten close to scream at the officer suddenly found himself grabbed and dragged away as the police immediately closed ranks as the fervor of the crowd grew to a fever pitch. It was unfair. It was an injustice, and Bob knew only that if nothing was done, that man would only be the first taken. He reached down, and picked up a brick.\n\nThe stone flew through the air, and directly hit the head of one of the officers. Bob could almost imagine the soft thunk as stone met flesh, before the officer collapsed. The crowd went silent, and sound seemed to fade as Bob looked at what he'd done. The anger he'd felt faded to horror at the knowledge that he might have just killed a man. He realized someone was grabbing his arm.\n\n"Hey!" It was another protestor, who was pulling him away. "Come on! We gotta get outta here now!" Bob looked up as the numb shock was shattered, and saw the police raise their rifles. They fired without hesitation, rubber bullets spraying the crowd as they marched forward. Hunting for the one who threw the brick. Hunting him as he fled."
 wif_crisis.305.a: "And as he fled, the outrage built once more."
 
 wif_crisis.306.t: "...But I Didn't Shoot the Deputy"
 wif_crisis.306.d: ""What were you thinking, man?" Was the first words from Bunny when he'd gotten back to the band, exhausted, scraped, but the fire still burning. The words had been followed by a hug, and words of relief. "I told you these protests were bad news."\n\nBob didn't have an excuse. "It was something I had to do."\n\n"You're gonna get hurt if you keep doing this," Peter shook his head. "You're doing some good here, but you're gonna get hurt."\n\n"Yeah, Bob," Bunny shook his head. "You got lucky today, but it's only getting worse. Bad attention or no, I'm glad you're safe."\n\nBob was relieved that neither of them were too mad at him for what he'd done - especially when he'd realized his picture had been taken, and was on the front page of the daily paper. Were they mad he'd dragged the Wailers into controversy? That he'd been there at all? Clearly, but at the end of the day, he was their mate, and he was now safe.\n\nIt had been touching to realize that. Which was going to make what came next all the harder. "I can't keep doing this with you," he finally said, looking down. "I... can't pretend I don't care. About this. And I don't want to drag you down because of my choices. Besides..." he paused. "This is what I want to do. I see that now. I won't change anything through music. Maybe I can another way."\n\nBunny gave a somber nod, and Peter closed his eyes briefly. "Not gonna be the same without you... but I understand," Peter said. Neither of them seemed surprised, even if saddened. Bob knew he would remember the early days fondly, but life was full of surprises, and sometimes, it was time to just move on. With handshakes and hugs, he received one last farewell from Bunny."
 wif_crisis.306.a: ""Take care of yourself Bob, and stop by if you're ever in the neighborhood.""
 
 wif_crisis.307.t: "Reggae Craze" # OFN View 
 wif_crisis.307.d: "Emerging from the multicultural traditions of Jamaica, musician Bob Marley has begun to take the world by storm with his new musical genre called "Reggae," which Marley claims is based on a Spanish word for "the king's music," though etymologists and musicians question this. Splitting off from musical group The Wailers to start his own solo career, Marley's style combines jazz, blues, and traditional Jamaican "mento" genre into a new musical style that is rooted in the Rastafari religion, helping bring the otherwise obscure pan-Africanist religion to prominence.\n\nAfter achieving widespread popularity throughout Jamaica and the West Indies, Marley's music spread to the United States, where it has become associated with youthful subcultures aiming to rebel against the norms of American society, and heavily associated with African-American liberation movements. While no one is quite sure how reggae got so popular so quickly, it's sure to not be disappearing anytime soon."
 wif_crisis.307.a: "The kids sure seem to like it."
 
 wif_crisis.308.t: "Reggae Craze" # Sphere View
 wif_crisis.308.d: "Emerging from the multicultural traditions of Jamaica, musician Bob Marley has begun to take the world by storm with his new musical genre called "Reggae," which Marley claims is based on a Spanish word for "the king's music," though etymologists and musicians question this. Splitting off from musical group The Wailers to start his own solo career, Marley's style combines jazz, blues, and traditional Jamaican "mento" genre into a new musical style that is rooted in the Rastafari religion, helping bring the otherwise obscure pan-Africanist religion to prominence.\n\nAfter achieving widespread popularity throughout Jamaica and the West Indies, Marley's music spread to the United States, where it has become associated with youthful subcultures aiming to rebel against the norms of American society, and heavily associated with African-American liberation movements. While no one is quite sure how reggae got so popular so quickly, it's sure to not be disappearing anytime soon."
 wif_crisis.308.a: "What the hell are those Americans doing?"
 
