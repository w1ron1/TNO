 #French West Indies
 FWI_Lyman_Lemnitzer: "Lyman Lemnitzer"
 POLITICS_FWI_LYMAN_LEMNITZER_DESC: "A man driven by duty if nothing else, General Lyman Lemnitzer is one of the last remaining bastions of the Eisenhower administration and what it represented - at least, he would like to think so. Born in August 1899, Lemnitzer fought alongside Eisenhower himself during the Second World War, later serving as part of his Joint Chiefs of Staff from 1949 to 1953. Lemnitzer has borne witness to loss after loss for America; ceasefire talks following the war, the evacuation of American forces from Britain, the withdrawal of troops from East Siberia - General Lemnitzer oversaw them all.\n\nPerhaps this is what made him accept his exile to the former French Antilles as High Commissioner under Kefauver so well. A set of relatively small islands far away from the continental United States, many other generals who were removed during Kefauver's purge would have handled the situation with significantly less grace. Lemnitzer, however, took it in stride and oversaw the islands of Guadeloupe and Martinique with what he considered to be a firm—but fair—hand.\n\nLemnitzer's Antilles are a place where the New Deal lives on. Policymakers plan and conduct class-cooperative economic ventures, as if the 1930s never ended, with labor and business happily holding hands. Backed by the local French power holders, the status quo seems solid - for now."

