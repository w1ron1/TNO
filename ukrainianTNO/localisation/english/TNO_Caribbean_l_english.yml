 ###LEADER DESCRIPTIONS###
 POLITICS_GRANTLEY_ADAMS_WIF2_DESC: "Allies and opponents alike were shocked to hear that Prime Minister Grantley Herbert Adams had rejected the US. Following the disastrous departures of both Jamaica and Trinidad and Tobago, collectively the two wealthiest constituents in the Federation, the US no doubt assumed that Adams, its longtime partner on the islands, would meekly accept their offer of greater support - and all the strings attached to it. But for whatever reason, be it weariness of US dominance or perhaps just plain optimism, Grantley politely declined the Americans. Of course, this has not changed the already existing status quo arrangement between the US and the West Indies, but it is seen as a sign of greater independence to come on behalf of the Caribbean islands.\n\nStill, for all the hope that such a move might inspire in regional nationalists, the consequences of such a rejection may come back to bite Adams and his people. The 'Little Ten' are, after all, just that: little. With their two largest economies gone it may be all they can do to keep afloat in the volatile global economy. Far-seeing or arrogant, principled or reckless? It will be for history to vindicate or condemn Grantley now."
 POLITICS_GRANTLEY_ADAMS_WIF3_DESC: "Grantley Herbert Adams' decision to tie what remained of the West Indies Federation to the United States was the safe, correct choice. It was also the validation of all that his political opponents had ever claimed about him in the eyes of many. The deal he accepted guaranteed the economic survival of the Federation in the wake of the desertion of first Jamaica and then Trinidad and Tobago, but it came at the cost of placing the islands under near direct authority from Washington. Every move Grantley's government wishes to make must be approved by Uncle Sam, every budget must go through the US Congress, and even the Federation's modest defence force is now under the jurisdiction of USSOUTHCOM. West Indian sovereignty, already a point of frustration among independence minded activists, has been effectively torn to shreds, left to exist in only the most nominal of fashions as if in mocking jest.\n\nStill, Adams reasons, the price needed to be paid. The loss of autonomy is grating but it truly was the only way to ensure the continued existence of the Federation as an entity. At least, so he hopes."
 POLITICS_ERIC_WILLIAMS_WIF_DESC: "Public servant, scholar, Father of the Union: Eric Williams, Prime Minister of the Caribbean Union, has certainly had many accomplishments so far in life. Born in 1911 to a well-to-do family of French Creole descent he initially seemed to be on the path of a scholar rather than a politician. A gifted academic, Williams won a scholarship to study at the University of Oxford, England. He went on to earn his B.A. in history in 1935 and completed his Ph.D in 1938. His thesis, The Economic Aspects of the Abolition of the Slave Trade and West Indian Slavery, has since become a landmark text in the historiography of the British Empire and slavery practiced under it.\n\nLife for Eric Williams would change dramatically following the end of World War Two and the collapse of the United Kingdom. By the time of the West Indies Federation's creation as a way to manage the Caribbean territories of the defeated British, Dutch, and French, Williams had become a leading figure in Trinidadian and Tobagonian politics, arguing for majority rule by the native peoples of the islands within the Federation.\n\nFollowing the success of his gambit to reform the Federation as a singular unitary Caribbean Union, Williams has emerged as the nation's first Prime Minister. The brilliant academic will certainly have his hands full as he works to ease the pain this full political and economic merge will entail."
 POLITICS_NORMAN_MANLEY_WIF_DESC: "If Jamaica was the glue that held the West Indies Federation together, it would only be fair to say that Norman Manley is the man most responsible for the continued existence of the West Indies as a single political entity. Despite what his critics would like to forget, Manley's history of fighting for the people of Jamaica - his people - has been an extensive one. During the Great Depression Manley helped to co-found the People's National Party and worked side by side with his cousin, Alexander Bustamante, and his Industrial Trade Union.\n\nThe 1940s would prove to be a decade of great change for Manley and Jamaica. First came the 1943 split between the PNP and Bustamante's JLP, then there was the approval of universal suffrage in 1944, and then in the latter half of the decade came the moment that would irreversibly change the destiny of Jamaica and its neighbor islands. The end of the Second World War left Jamaica without a mother country for the first time in over two centuries. With Jamaica now nominally independent, Manley won the election to become its first ever Prime Minister. However, it was not long before the United States came calling with its plan to establish the West Indies Federation to comprise all of the former colonial island holdings in the region. As Prime Minister of the largest economy in the Federation, Manley enjoyed a prominent role, although he was often in conflict with his cordial rival Bustamante.\n\nThe failure of the proposed independence referendum has only served to bring Norman Manley to new heights. With its defeat, Manley saw his mandate secured, allowing him to push for a rewrite of the Federation Constitution to create a united West Indies Commonwealth. While many derided him as little more than Washington's lapdog, Manley has confidence that in the years to come, the positive results of his decisions will speak for themselves."
 #Jamaica
 POLITICS_ALEXANDER_BUSTAMANTE_DESC: "Either the best Jamaica has to offer in its relatively compact list of competent politicians or a fossil, depending on which part of the town one may gander over, Alexander Bustamante nonetheless remains one of the tireless workhorses who have kept Jamaica's status quo afloat for years. For a few, he personifies everything wrong with Ottawa's system, but for many others, Busta represents stability, even if it does not come from the finest fellow around.\n\nBorn to a Hanoverian planter family in 1884, Busta was never much settled to a life of comfort despite a privileged upbringing, having spent much of his youth before the 1930s traveling across the Caribbean in various odd jobs, ranging from a salesman to a Cuban gendarmerie. Though the truthfulness of his working tales, just as much of his pedigree, remains questionable, he did return home a talented negotiator, turning himself from another rising star in the Jamaica Labour Party into the sun that the nation's politics orbit within the past decades.\n\nConsolidated nowadays primarily by his self-titled "Bustamante Industrial Trade Union", he sees himself as a pragmatist more than an Anglo-appeaser, only giving as many concessions as needed to keep himself useful. On the other hand, Busta has also found himself to be a counterweight to Norman Manley's PNP, which he had grown genuinely resentful towards throughout the decades, having even resulted in episodes of irrational outbursts on occasion. As he grows older and more irritable, there are perhaps more than a few reasons for him to let the JLP continue flourishing on its own — but what is an artist without his paintings?"
 POLITICS_JAM_ALEXANDER_BUSTAMANTE_AUTHDEM_DESC: "Regardless of one's thoughts on the man himself it cannot be denied that Alexander Bustamante will be remembered as one of defining figures in Jamaican history. Born William Alexander Clarke in 1884, the Jamaican Labour politician is actually the first cousin of former Prime Minister Norman Manley. Bustamante first began to make a name for himself as an outspoken against British colonial rule in Jamaica in the 1930s. His pro-independence activities would see him imprisoned starting in 1940 and lasting for three years.\n\nIn the years since Britain's defeat in the War and the formation of the West Indies Federation Bustamante did not cease in his agitation for a free and independent Jamaica. The only difference was the target: where once he haranguaged Britain he had now to contend with the Federation and its American master.\n\nAlexander Bustamante has always wanted independence for Jamaica, but he had never envisioned it coming about in the way that it now has. He naturally supported the Black Power protests that emerged against his longtime rival Norman Manley. As the violence of these protests increased however, Bustamante found himself unable to control the movement he was nominally the spokesman of. It was only the agreement of Manley to step down in favor of Bustamante and the protestors that calmed the worst of the chaos. Now the leader of an independent Jamaica, unbound by the US and its OFN, Bustamante has seemingly achieved his long-hoped for dream. And yet, it is only all too obvious to all observers, not least Bustamante himself, that the ills that plague Jamaica have only been treated, not cured."

 #Windward Islands
 POLITICS_SVI_HECTOR_ALLARD_DESC: "Born in 1902 in Canada, Hector Allard spent much of his time as a young adult in universities across the Francophone world, studying in Strasbourg and Geneva. After briefly returning to Canada to teach French, he became a member of the diplomatic corps in 1932, serving in Canadian embassies and then in an assortment of posts across the Caribbean, before eventually being appointed to the position of Governor-General of the Windward Islands.\n\nIn many ways, Allard's ascension has not come easy. His diplomatic experience has not easily transferred to the administration of the Windward Islands, and he has only managed to assuage the concerns of those tied within the complex web of regional politics. His heritage as a French-Canadian has also brought frustrations from the Colonial Office and has left him more alienated from the colonial bureaucracy than most of his predecessors.\n\nHowever, such limitations have failed to fully prevent him from implementing reforms. With regional agricultural reforms implemented around the growth and export of bananas, there has been a major growth in that sector since his ascendancy to the office. However, old internal frustrations remain problematic elsewhere and have slowed down the adoption of the metrics set in place by the West Indies Commission, leaving the island to lag in social and political reforms."

 #Barbados
 POLITICS_BRB_HEBERT_GRANTLEY_ADAMS_DESC: "A new dawn faces Barbados, but the same sun rises overhead. Born in the dying days of the nineteenth century and entering politics as a devout Liberal studying at Oxford, Grantley Adams has been at the forefront of Barbadian politics for decades. Although initially aligned with conservative groups in Barbados upon his return in the 1930s, his sympathies shifted to the left, bringing him to the head of the Barbados Workers' Union in 1941 and into a pivotal role in quashing the influence of the planters.\n\nSince then, Adams has remained a prominent force within Caribbean politics. Aside from his role as head of the BWU, Adams has made his opposition to communism apparent and remains intensely supportive of the British monarchy's enhanced role. Finally appointed as Premier of Barbados in 1954, Adams's work in pushing for increased self-determination has succeeded in reducing the strength of the West Indies Commission.\n\nToday, Adams' continued presence is an oxymoron. A man whose legacy was once constrained by the decades past, he continues to espouse his dreams for a future that remains steeped in the traditions of a world that brought him into national prominence. With dreams of a unified, prosperous, and liberal Caribbean still in mind, it seems that this elder statesman has yet to withdraw into a grey eminence."

 #Trinidad
 POLITICS_TRI_ERIC_WILLIAMS_DESC: "Politicians who won't compromise often can't survive long, but those who can't compromise can prove surprisingly enduring, and there is no better evidence to support the claim than the unyielding premier of Trinidad and Tobago, Eric Williams.\n\nIn his youth, Williams had dreams of becoming a professional soccer player, only leaving it behind following an injury that had rendered him partially deaf. Nevertheless, he carried on his stubborn determination into the rest of his career, becoming a prominent academic in the study of colonial history with the seminal work "Capitalism and Slavery". He even attracted the attention of the West Indies Commission, which, eager to bring on more native voices in their ambitious development plans, offered him a seat. They soon came to regret the decision as Williams proved a stubborn nationalist, frequently sparring with the overbearing Yanks and desiccated British aristocrats on the Commission.\n\nAfter leaving the Council in frustration, Williams worked to create change from the ground up, founding the People's National Movement in Trinidad. Achieving premiership as Ottawa was forced to loosen its leash on the Caribbeans, Williams has been ruling Trinidad with a strong hand and an express goal to modernize the homeland he so adores. Utilizing a political machine centered around the PNM, he has managed to leverage the islands' oil wealth to fund ambitious development projects and form a stranglehold on island politics."
 POLITICS_TRI_MAKANDAL_DAAGA_DESC: "Makandal Daaga, founder of the National Joint Action Committee, had never expected that he would be the one left to take charge of Trinidad and Tobago in the wake of the revolution. Truth be told, the Black Power movement that he had helped to lead had neither planned for nor instigated the fall of the Williams government - and yet it had fallen all the same. The unexpected mutiny by disgruntled elements of the Trinidad Defense Regiment sympathetic to the protestors and the weight of an ongoing general strike had snowballed into a catastrophe that had forced Williams to resign.\n\nDespite lacking a firm plan for proceeding after achieving victory in such a surprising fashion, Daaga did not let himself become paralyzed by indecision. With the help of the Regiment he announced himself as the interim President in the interest of establishing a new government that could bring some peace to the beleaguered islands as the fallout of the Revolution continued. Daaga has made his gamble, seizing the moment in the hope of bringing about a better future for Afro and Indo peoples of Trinidad and Tobago. He will have his work cut out for him."
 POLITICS_TRI_BHADASE_SAGAN_MARAJ_DESC: "The colossus came crashing down, but Bhadase Sagan Maraj did not outwit his opponent—he just lived on. Born on 29 February 1920 to a Brahmin family in Central Trinidad, Sagan Maraj had a volatile youth. At thirteen, his father was killed by a Muslim gang. To distance him from the violence, he was sent to church schools and placed under his grandmother's custody much of his teenage years.\n\nDetermined to survive, he became a wrestler by twenty, taking up ditchdigging as a trade. During the Second World War, he made a fortune from Chaguaramas contracts. With his wealth from military work, he became a millionaire before thirty. By then, he recognized a need to show concern for the welfare of his Hindu brethren, who had long been an illiterate underclass. He thus founded the Sanatan Dharma Maha Sabha, a place for learning and uplifting.\n\nSeeing parliamentary politics as another tool for emancipation, he founded the Hindu People's Democratic Party in 1953. Four years later, the party joined the Democratic Labour Party, where it became the leading force. Despite his relentless advocacy and work, Sagan Maraj is a sickly man. He has endured many bouts of illness, looking almost feeble compared to his political nemesis, Eric Williams. Yet, the bonfire of his mission outlasted the wildfire of his rival, and now it's his turn in Port of Spain."

