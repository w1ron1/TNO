 ## Coming Storm ##
 Caribbean_flavor.1.t: "Вождь і шпигун"
 Caribbean_flavor.1.desc: "Щовівторка двоє старих авантюристів збиралися в пентхаусі готелю в Кінґстоні. Вони обрали це місце подалі від своїх домівок, де таємно зустрічалися, щоб обговорювати справи, неприйнятні для їхнього офіційного чи особистого життя. По один бік столу ямайський прем'єр-міністр Александер Бустаманте реготав над твердим тістовим хлібом. Луїс М. Ґонсалес-Мата, що сидів навпроти нього, розважав його історією про громадянську війну в Іспанії — історією, яка почалася з любовної пригоди в монастирі й завершилася дюжиною загиблих республіканців.\n\nВони завжди починали свої вівторкові вечері з історії, щоразу унікальної, завжди скандальної або сенсаційної. Бустаманте завжди насолоджувався ними; завдяки диким словам Ґонсалеса-Мати та власним спогадам він знову ставав молодим чоловіком, який мандрує європейським та американським континентами. Підтвердження кваліфікації один одного робило решту вечора легшою. Коли їхні історії закінчувалися, вони обговорювали поточні справи в тонах, які краще було чути за межами їхнього звичайного життя.\n\n"На початку цього тижня я розмовляв із контрабандистом", — сказав Ґонсалес-Мата, наливаючи ще одну склянку рому. "Подякував йому за службу. Сказав, що ямайська економіка не була б такою самою без нього."\n\n"Ти цього не зробив", — удавано недовірливо сказав Бустаманте, і з його потрісканих губ вирвався ще один регіт. "Христе. Ну, чорт забирай, це ж правда, чи не так?" Він відірвав шматок хліба, покручені пальці насилу пробивалися крізь скоринку. "Принаймні контрабандисти тихі й повертають щось в економіку. Мене непокоять інші покидьки. Банди, радикали. Агітатори." Його голос ненадовго впав до шепоту. "Іберійцям легко, знаєш. Трухільйо теж. З ними немає метушні. Вони вирішують свої проблеми.""
 Caribbean_flavor.1.a: ""Ти теж міг би." Ґонсалес-Мата усміхнувся, оголивши зуби. "Є способи.""

 Caribbean_flavor.2.t: "День звіту"
 Caribbean_flavor.2.desc: "Прохолода вентилятора щосили намагалася розігнати гаряче повітря, але Вільям Гасті майже не відчував її зусиль, читаючи щойно опублікований звіт. Вмостившись на дивані у своєму кабінеті й приготувавшись до тривалого читання, він навіть дозволив собі бути оптимістом, коли подивився на його обкладинку. На ній гордо красувався напис «Комісія Вест-Індії — звіт за 10 років», а її печатка обіцяла прогрес Нового Світу; підсумок років зустрічей, спостережень і напруженої роботи. Результат?\n\nКожна сторінка здавалася гіршою за попередню, кров Гасті кипіла, коли всі невдачі поставали перед ним.\n\nЯмайка була недорозвиненою пороховою бочкою, що чекала на іскру, а політична машина Бустаманте, яка займалася корумпованим обструкціонізмом, була описана настільки детально, що навіть Гасті був здивований її масштабами. Віндвардські острови демонстрували перспективні економічні показники, бананова промисловість процвітала, аж поки звіт не пояснив, як саме ліберальна аграрна політика спиралася на експлуататорські практики плантацій та зростаюче невдоволення — навіть насильство — з боку робітничих організацій. Здавалося, Багами перетворювалися не більше ніж на нову Кубу Батісти. Навіть так звані історії успіху Барбадосу та Тринідаду, здавалося, були побудовані на піску: Барбадос тримався на милицях свого старіючого прем'єра Ґрантлі Адамса, тоді як Тринідад був переповнений популістською агітацією та відкритою співпрацею з мексиканцями.\n\nГасті кинув звіт на диван поруч із собою, піт на його чолі незручно стікав униз. Вологість оточувала його, огортаючи тривогою. Він не мав би бути надто здивованим, адже значна частина складових звіту була йому відома, але побачити все це викладеним ось так? Чого досягла його комісія за ці роки? Чого досяг він? Здавалося, майже нічого порівняно з тим, з чого вони починали; вони просто наглядали за архаїчним пережитком.\n\nВін зітхнув, підвівся з дивана й підійшов до столу. Треба було зробити дзвінки, і він знав, кому має подзвонити першому."
 Caribbean_flavor.2.a: ""Пане Молсон? Це Гасті. Чи могли б ми незабаром зустрітися, щоб обговорити звіт Комісії?""

 Caribbean_flavor.3.t: "Зв'язки, що єднають"
 Caribbean_flavor.3.desc: "Секретар Салінас Лосано закотив очі, коли секретар зовнішніх зносин Тельйо Баррауд попросив його зустрітися з Еріком Вільямсом, прем'єром Тринідаду і Тобаґо, щоб обговорити спільні плани розвитку. Але, розмірковуючи над своєю полуденною сигарою, нортеньйо зрозумів, що якщо цей візит приверне достатньо уваги, може здатися, що він здобув підтримку Баррауда щодо спадкоємності.\n\nА ніде не було більш людно, ніж на ринку Ла-Мерсед опівдні. "Ці громадські ринки є джерелом доходів для Федерального округу та значно полегшують нам контроль за цінами." Палець Салінаса завис над качанами кукурудзи продавця. "Через CONASUPO ми забезпечуємо стабільні доходи для нашого селянства, водночас стримуючи вартість харчів у місті."\n\nСам Вільямс, афрокарибський чоловік із помітними слуховими апаратами та бездоганно пошитим костюмом, безумовно привертав необхідну увагу. Прем'єр оглядав торговий ряд з одягом, перш ніж знову звернути увагу на Салінаса: "Ви також, здається, стримуєте потік дешевих товарів від нашого північного сусіда. Хотілося б, щоб моя країна могла сказати те саме."\n\n"За це слід дякувати стратегічно встановленим тарифам, покликаним підтримувати наші молоді галузі. А також постійним субсидіям нашим виробникам, що фінансуються за рахунок нашого сільськогосподарського експорту та нафтових багатств." На обличчі Вільямса з'явилася широка усмішка; Салінас молився, щоб фотограф був присутній, коли він підійшов до продавця й кинув на стіл пачку купюр. Значно більше песо, ніж було потрібно за дещо неякісну зелену бавовняну краватку, яку Салінас узяв і передав Вільямсу.\n\nВільямс на мить підняв брову, перш ніж знову усміхнутися, оглядаючи зворотний бік. "Зроблено в Мексиці." Помітивши натовп, що збирався, прем'єр потиснув Салінасу руку й проголосив із сумішшю теплоти та рішучості,"
 Caribbean_flavor.3.a: "Одного дня я віддячу тобі краваткою, зробленою в Тринідаді і Тобаґо."

 Caribbean_flavor.4.t: "Вождь і дипломат"
 Caribbean_flavor.4.desc: "Половина Вейл-Роял була завішана пластиковими полотнищами; інша половина вже була на складі в очікуванні перенесення до нового палацу. Посол Вільям К. Доерті почувався так, ніби втручається на похорон, але прем'єр-міністр Александер Бустаманте зустрів його жвавими, хоч і кульгавими рухами. Вони сіли в порожній вітальні; Доерті на дивані, а Бустаманте у кріслі, єдиних меблях у кімнаті.\n\nДоерті прокашлявся. "Пане прем'єр-міністре, я хотів поговорити з вами про... нещодавні події." Він нахилився ближче. "Сполучені Штати вже деякий час пильно стежать за Карибами. Ми прагнемо дещо посилити підтримку наших союзників тут."\n\n"Так, так", — сказав Бустаманте, коли рідина хлюпнула в його склянці. "Знаєте, цей чоловік, Трухільйо? Немає часу на нього, немає часу. Але ви чуєте всіляке, пане Доерті. Щодня я чую: «Америка повинна щось зробити», «Куба повинна». Це смішно, нісенітниця." Доерті склав руки на колінах. Вільна рука Бустаманте шалено металася в повітрі. "Знаєте, ми тут піклуємося про американців. Я тримаю United Fruit задоволеною. Цей уряд робить тут усе безпечним і сприятливим для ОВН. Але коли ми чуємо про американців на карибській землі, ми починаємо думати: коли це обернеться проти нас?"\n\n"Запевняю вас, пане прем'єр-міністре, Америка не має жодних планів щодо Ямайки—"\n\n"Я цього не кажу, ні, ні. Але, знаєте, коли до сусіда чіпляються, уява людей починає блукати."\n\nІ уява Бустаманте блукала — темними лісами й холодними річками. Уже деякий час він дозволяв собі поглинутися видіннями американських десантників-командос, які спускаються на парашутах на галявину Вейл-Роял, а його кров стікає по побілених стінах. У нього ще так багато справ. Йому ще так багато треба виправити. Він не міг не замислюватися, що зроблять американці, якщо коли-небудь дізнаються про його іберійські зв'язки."
 Caribbean_flavor.4.a: "Доерті вийшов із Вейл-Роял, стривожений і прагнучи зробити кілька дзвінків."

 Caribbean_flavor.5.t: "Троє вигнанців на Ямайці"
 Caribbean_flavor.5.desc: "Дейл Редден барабанив пальцями по столу, звук луною відбивався від стін складу. Він працював у Бюро дванадцять років і обурювався цим останнім призначенням; те, що мало бути коротким відрядженням до мафії поблизу його родини в Небрасці, перетворилося на карибську пригоду з підтримки ямайського авторитарного диктатора. Коли його роздуми закінчилися, він узяв пакунок зі столу й вийшов за двері. В іншому кінці міста самотній друкарський верстат ковтав чистий папір і випльовував бюлетені. Троє текстильників забрали додому вдвічі більшу зарплату лише за те, щоб поставити маленьку позначку поруч з іменами друзів Бустаманте. Бюлетені зібрали, необхідність зберігати таємницю підтвердили, і Дейл Редден відніс їх назад на склад.\n\nУсередині він побачив Ірвінґа Аллейна, який виносив із складу речовий мішок. Дейл запитав, чи не хоче той пізніше випити; Ірвінґ чемно відмовився, пославшись на довгу поїздку та ще довшу ніч. У нього було двадцять зупинок по всьому місту — сузір'я представників профспілки Басти, яким потрібні були гроші. Він не зводив очей із дороги, проїжджаючи повз людей, розчарованих постійною хваткою Бустаманте над їхньою країною. Ірвінґ давно перестав перейматися тим, що вони думають про людей, яких підтримувало Бюро; здебільшого вони їх ненавиділи, і він перестав вважати їхню думку важливою ще багато років тому.\n\nКоли Ірвінґ повернувся на склад, надворі вже було темно. Горіла лише одна лампа: Керрол Лакетт, найменший член цього пункту прослуховування, перевіряв свою зброю. Він із гуркотом вставив магазин назад у руків'я. Вони не дивилися один на одного. Поки Ірвінґ запихав порожній речовий мішок у шафку, Керрол уже виходив за двері. На схід від міста, біля забутого причалу, освітленого лише пришвартованим човном, двоє чоловіків здійснювали обмін. Керрол Лакетт тримався осторонь із пістолетом у руці, спостерігаючи за процесом. Від чоловіка на човні надійшов ящик із гвинтівками; від чоловіка на причалі — речовий мішок із готівкою. Гвинтівки могли вирушити на південь; готівку поділять навпіл — половина Бюро, половина виборчого фонду Бустаманте."
 Caribbean_flavor.5.a: "Керрол міг думати лише про те, що це було багато зусиль заради людини, яка, здавалося, нікому не подобалася."

 Caribbean_flavor.6.t: "Досконаліша федерація"
 Caribbean_flavor.6.desc: ""...але чи справді Антильські острови можуть рухатися далі після всього, що сталося?" Студійне освітлення робило Вільяма Ф. Баклі таким же незворушним, як завжди. "Це довга історія кровопролиття, яку ще треба пережити, а люди мають довгу пам'ять..."\n\n"Мене можна було б у цьому переконати, якби Вашингтон сам так добре пам'ятав." Усмішка Ґрантлі Адамса обвила все його обличчя. "І все ж вони не відмовилися від свого обов'язку виступати за майбутнє Вест-Індії, як і я."\n\n"Що ж, боже правий, ця відставка тривала недовго." Глядачі щиро засміялися.\n\n"Я маю на увазі, не пригадую, щоб більшу частину свого життя я був непотрібний." Іронічно піднята брова Адамса, ще один сплеск сміху. "Америка завжди була нам майже як родина в наших зусиллях посіяти здорове внутрішнє життя Федерації, заради карибської демократії, якої ми так довго прагнули, і я вдячний їм. Ми назавжди залишатимемося в їхньому боргу."\n\n"І це має лягти на плечі пана Спенґлера?" — підказав Баклі.\n\nАдамс був незворушним: "Кращого поборника майбутнього Антильських островів ви не знайдете, Г'ю — один із найсвітліших умів Карибів, кращого не можна й бажати.\n\n"Ви звучите досить оптимістично щодо Вест-Індії, можна навіть сказати — пихато!"\n\nУ відповідь Адамс не мав жодних сумнівів: "Справжній рай не просто падає з неба, навіть якщо Кариби виглядають так, наче він упав туди, коли вони перебувають у своїй найпрекраснішій формі. Смію сказати, я бачу в Барбадосі те, що багато інших бачать на американському континенті. Я бачу те сяюче місто на пагорбі, цю найчудернацькішу з амбіцій... мріяти. Так, до раю ще далеченько, але, їй-богу, ми докладаємо всіх зусиль, і нам не слід погоджуватися на менше."\n\nВільям Баклі подивився на глядачів. "Що ж, їй-богу, сподіваюся, ваш народ знайде цей рай.""
 Caribbean_flavor.6.a: ""Пані та панове, шановний Ґрантлі Адамс.""
 Caribbean_flavor.6.tt: "§D§GСтабільність§! у §BКарибах§! має першочергове значення для збереження нашого контролю над регіоном.§!"

 Caribbean_flavor.7.t: "Незграбний загін"
 Caribbean_flavor.7.desc: "Фелікс Ґальван зібрався з духом. Він прибув на віддалений полігон ямайського контингенту Карибського легіону, бригади Чорної зірки, на дві години раніше. Більшість не говорила іспанською. Більшість була зеленими новобранцями. Більшість була червоними комуністами. Більшість була чорношкірою. Жоден із них не перебував під його командуванням. Але більшість наслідків їхньої неминучої невдачі перемогти елітні сили Трухільйо лягла б на військового аташе, тобто на нього.\n\nҐальван хруснув пальцями й відчинив двері вантажівки — час було надати цій зграї хоч трохи дисципліни. Та замість цього він ледь не потрапив у засідку двадцяти ямайців, які вийшли з табору привітати його, тримаючи руки по швах. Принаймні вони знали, як нести варту.\n\nДо нього накульгуючи підійшов темношкірий чоловік зі світлішою шкірою, шрамованим обличчям і легкою усмішкою, простягнув руку й терпимою іспанською мовою сказав: "Я Біллі Страчен; я очолюю бригаду. Ласкаво просимо."\n\nҐальван потиснув мозолясту руку Страчена й відповів: "Я полковник Фелікс Ґальван. З огляду на мій досвід на полі бою та в Міжамериканському оборонному коледжі, мене обрали допомогти вам підготувати ваших людей, поки вони перебувають на мексиканській землі."\n\nСтрачен говорив повільно, але чітко: "Мій бойовий досвід обмежувався боями проти нацистських літаків, тож ваш досвід допоможе нам перемогти Трухільйо. Дякую за вашу допомогу і вашій країні за те, що дала нам можливість битися. Домініканська Республіка — перша битва у нашій війні за вільні Кариби." З новою усмішкою він повторив останню фразу англійською, а чоловіки позаду нього хором підхопили її.\n\nҐальван підняв брову."
 Caribbean_flavor.7.a: "Можливо, перемога була б небезпечнішою за поразку."

 Caribbean_flavor.8.t: "Помста Трухільйо на Ямайці"
 Caribbean_flavor.8.desc: "Луїс М. Ґонсалес-Мата рідко зустрічався з Трухільйо безпосередньо, але після катастрофи в Пуерто-Платі його таємно викликали на віллу старого в Санто-Домінґо, де той розпинався про зраду метисів і змову янкі. Він віддав накази — "тримай Бусту в узді, а решту роздовбай" — і партію гвинтівок, щоб посприяти і тому, і іншому. Ґонсалес-Мата повернувся на вантажному судні з ямою в животі й тисячею доларів, щоб цю яму заповнити. Гвинтівки доставили просто на його аеродром на південь від Очо-Ріоса. Наступного дня він уже знайшов покупця для зброї. Через два дні він був на аеродромі, чекаючи на покупця, який, за його словами, мав прибути ще пів години тому. Люди тут товпилися біля краю ангара. Вони курили, грали в карти й намагалися не дивитися на зброю або її нервового продавця.\n\n"Літак!" Його люди, контрабандисти наркоти й руйнувань, першими побачили його крізь хмари, через сорок п'ять хвилин після очікуваного часу прибуття. Деякі з них направили власну зброю на літак, коли той почав знижуватися; Ґонсалес-Мата опустив її вниз, схопивши за цівки. Самотній літак, на якому були всі належні позначки, з легким поштовхом приземлився на злітну смугу.\n\nТурбулентність над затокою була їхнім виправданням. Вони здавалися невмотивованими, лише трохи роздратованими затримкою; вони не помічали й не переймалися тим, що люди Ґонсалес-Мати от-от луснуть від збудженого занепокоєння. Екіпаж завантажив гвинтівки у вантажний відсік, і після перевірки пілот кинув Ґонсалес-Маті валізу з готівкою. Той відкрив її й переконався, що порахував гроші перед ними, перш ніж вони полетіли. Американські долари заповнювали валізу.\n\nКоли літак знову зник у хмарах, Ґонсалес-Мата роздав екіпажу те, що їм належало: кожному по пачці, по п'ятсот у кожній пачці. Свою частку він поклав до кишені, а решту валізи поніс до своєї машини. Кінґстон був приблизно за годину на південний захід від аеродрому. Йому потрібно було віднести це своєму банкіру, який передав би гроші банкіру Бустаманте, а той подбав би, щоб інший старий залишався задоволеним другом."
 Caribbean_flavor.8.a: "Ґонсалес-Мата сів у машину, перевірив свій пістолет і побачив, що він досі заряджений."
 Caribbean_Destabilization_tt: "§GМайбутні спроби дестабілізувати контроль ОВН над Карибами будуть ефективнішими.§!"

 Caribbean_flavor.9.t: "Привид Трухільйо на Ямайці"
 Caribbean_flavor.9.desc: "Луїс М. Ґонсалес-Мата вже годину спостерігав за повільним плином моря, з непідпаленого рота звисала сигарета. Човен, на якому він плив, поволі виходив із Кінґстона, прямуючи на захід до Центральної Америки з трюмом, повним сигар угорі й гвинтівок унизу. Чиста вода опівдні; його відображення коливалося разом із хвилями, надто далеко, щоб розгледіти ефект кривого дзеркала, який вода створювала на його обличчі чи на обличчях інших курців на палубі поруч із ним.\n\nВін думав про Трухільйо, черв'ячу їжу в братській могилі. Його ланцюг підпорядкування було розірвано, а іберійці швидше, ніж він очікував, знову причепили йому повідок. Тепер він був їхнім контрабандистом; жодних посередників, лише схованки й одноразові шифроблокноти між ним і Мадридом. Він заробляв більше грошей, ніж будь-коли за наказами Трухільйо. Але почав втрачати набагато більше сну й завжди тримав пістолет при собі, коли заповзав під ковдри.\n\n"Човен", — сказав один із його товаришів-курців. Ґонсалес-Матина голова різко піднялася від води. На горизонті він побачив далеку фігуру, круглу й довгу, надто далеку, щоб розгледіти щось більше за загальний силует небезпеки. Курці одразу викинули сигарети за борт і зайняли бойові пости, вдаючи, що працюють, і не спускаючи очей із лівого борту.\n\nРука Ґонсалес-Мати потягнулася до кобури під пахвою. Далекий човен плив уздовж горизонту на північ. Капітан наказав їхньому човну сповільнитися; "ще повільніше", — сказав один із членів екіпажу, — "і доведеться кидати якір". Він знову гаркнув наказ. Ґонсалес-Мата міцніше стиснув руків'я пістолета.\n\nВони залишалися в цій підвішеній ситуації п'ять хвилин і побачили, як гостра й округла фігура вдалині пропливла повз без привітань. Вона перетворилася на обрій, зникнувши за ним. Полегшення прийшло разом із західним вітром, омиваючи й огортаючи екіпаж. Капітан наказав збільшити швидкість. Радист повідомив, що у звичайному ефірі нічого немає."
 Caribbean_flavor.9.a: "Ґонсалес-Мата повернувся до своєї каюти, дістав пістолет і ліг на койку."

