 JAM_flavor.31.t: "Проповідник"
 JAM_flavor.31.desc: "У задимлених коридорах станції в Сан-Хуані Теодор Шеклі читав звіт у своїх руках. Операція «Гнилий кардинал» нарешті завершила переказ грошей для підтримки ЯЛП. Менлі сподівався знищити ЯЛП завдяки заворушенням і забезпечити собі беззаперечне політичне майбутнє. Ідея досить проста, але Менлі мав би навчитися з успіху власного руху: вбити ідею — важка робота.\n\nГроші не говорили, але завдяки їм слова було легше почути. Профспілки слухали, коли Менлі говорив про умови праці, але коли агент FBI вказав, що Менлі тиснутиме на профспілку, щоб забезпечити призначення його людей на керівні посади, це зробило їх більш схильними підтримати ЯЛП як страховку, звісно, з невеликою сумою готівки в кишені. Організована злочинність була фактом життя на Ямайці, і коли FBI вказало, що Менлі використає її як цапа-відбувайла, щоб здобути політичні очки, вони стали трохи прихильнішими до їхніх аргументів та хабарів. Інші політики були найпростішими з усіх; Менлі не приховував своїх амбіцій. Будь-який політик із власними амбіціями знав би, що двом сонцям на небі не бути, але будь-хто, хто справді хотів служити своїй країні, знав би, що втрата прихильності могла означати кінець усього, а отже, страховка через ЯЛП була безпечною ставкою.\n\nДля кожної групи — своя ретельно підібрана проповідь, і тепер їм залишалося лише знайти фігуру, навколо якої можна було б об'єднатися. Після видовищного падіння Бустаманте з попелу мала постати нова фігура, і цього разу це мав бути хтось значно надійніший. Можливо, хтось, хто вже мав зв'язки зі станцією в Сан-Хуані й міг користуватися аналітикою з батьківщини, а також надійно забезпечити достатню мотивацію отари працювати заради загального блага."
 JAM_flavor.31.a: "«Едвард Сіґа. Ось кого ми хочемо на цю роль». Шеклі загасив сигарету й поклав теку."

