 Caribbean_flavor.217.t: "Back Together"
 Caribbean_flavor.217.desc: "The lights in the small resort standing over Basseterre were still glowing a warm yellow, but only barely. In past weeks, concern over the Oil Crisis had only grown in the region, with spiraling prices and limited American support pushing some areas into rolling blackouts. The conference held to discuss this was active, but small, and most involved were hesitant to do anything other than repeat statements. As the sun set in front of him, William Herbert turned around, hoping to get firmer answers on the fate of the Leeward Union.\n\n"I suppose your proposal makes sense, William." said Vere Bird, responding to no comment in particular. "We don't have the wealth, population or resources to survive on our own."\n\n"I agree." continued Herbert, his voice flat. "There's only so much strength our governments have. At least by unifying, our pooled resources might be able to do something."\n\nSilence emerged for a second more. "So then, our next goal should be to announce this to the conference? Shouldn't be too hard to raise this as an issue."\n\n"Of course. It was Hastie's idea in the first place, so he should at least be made aware of this. But beyond that, we should probably start focus on a timeline."\n\nBird nodded, placing the report onto the table in front of him. "Indeed. We could probably phase this in through loosened immigration controls and police collaboration in months."\n\nHerbert raised his head, but his face remained motionless as he reached out for a handshake. "I know a few other Prime Ministers are talking about a regional union elsewhere, but I don't think there's going to be any appetite for a restored Federation. That ship sailed a while ago.""
 Caribbean_flavor.217.a: "An echo lingers in an area that once was."

 Caribbean_flavor.218.t: "Oil and Opportunity"
 Caribbean_flavor.218.desc: "Following his recent re-election, a glitzy New Orleans restaurant might not have been where one would expect to find Vere Bird, Prime Minister of Antigua and Barbuda. But here he was, leaving from a graceful black limousine and immediately slinking to one of the back booths. Of course, Bird was not interested in being where he was easily found.\n\nHis accomplice and fellow Caribbean PM, William Herbert of St. Kitts, Nevis, and Anguilla, was already scanning the menu. "Nice place you've found for us here, Vere."\n\n"The owner's a good guy. Made sure nobody's listening in." Bird eased into his seat, his imposing frame making the table seem almost comically small. "Wouldn't want our conversation plastered on every newspaper in the Caribbean by tomorrow."\n\nA glass of good wine later, as the two men finished tearing into their steaks, Herbert finally touched upon the cause of their conversation. "You know as well as me that things are bad. With oil prices staying where they are and with all the trouble that's going to bring, Caribbean economies are in for a rough ride for a few years at least. Maybe more than we can handle on our own."\n\nBird remained silent for a moment before responding. "It's gonna be a handful, yeah. But I think we agree that handling this crisis on our own isn't the plan."\n\nHerbert nodded. "Absolutely. This can and should be an opportunity. We could begin pooling together resources, and also get closer to each other politically. Help each other when some nasty journalist tries to wash the dirty laundry at a moment of national crisis."\n\nBird offered his hand. "Exactly what I was thinking. For a stable future together, William"."
 Caribbean_flavor.218.a: ""For a stable future together, Vere.""
 
