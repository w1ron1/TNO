 Caribbean_flavor.11.t: "Grassroots from Astroturf"
 Caribbean_flavor.11.desc: "RESTRICTED/[GetDateText]\n\nFROM: FRANK WILEY\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: PROTESTS IN THE PORT OF SPAIN\n\nProtests against the U.S. Military Base in the Port of Spain in Trinidad are becoming an increasingly common sight. The base was a point of contention previously, but tensions have ratcheted recently following American involvement in recent conflicts abroad. Premier Eric Williams' comparison of the base to a colonial plantation has only exacerbated our problems.\n\nOur intelligence suggests that the source of this spike in protests comes from foreign agitators and provocateurs. An agent investigating a known safehouse used by protestors discovered an Iberian passport belonging to a figure spotted rabblerousing outside the base on several occasions. Literature on the Cuban Revolution was also found.\n\nWe suspect that Iberia and Cuba are working separately on using these protests to force Premier Eric Williams to divorce himself from American aid and trade, in favor of their respective blocs. Currently, we lack enough proof to tie either government to these efforts without making a diplomatic spectacle. Therefore, we recommend that the situation is observed carefully for the time being."
 Caribbean_flavor.11.a: "Fidelity, Bravery, Integrity."

 Caribbean_flavor.12.t: "On the JM WAVEs"
 Caribbean_flavor.12.desc: "MEMORANDUM FOR: TS, MIAMI Office\n\nSUBJECTS: 1. Jamaican Domestic Stability\n\n2. Future Stability Recommendations\n\nInformants within groups hostile to Bustamante report rising recruitment and resources. Public meetings are increasingly well attended, some as yet unidentified members of the Jamaican establishment have offered support to some more prominent groups. Investigations into extra-American involvement, likely Iberian or Cuban, continue. Bustamante's position remains, in the short-term, stable with few credible threats to his power within the current political framework but all indications show rising support for opposition groups coalescing around Michael Manley's PNP. Radical groups currently being observed enjoy less success than the PNP and affiliates, however they too are benefiting. At current trends anti-establishment groups will likely represent a threat to Jamaica within 5 years. It is likely the situation will further frustrate however; domestic stability may be lost much sooner.\n\nAmerican interests in Jamaica require regional continuity. Resistance to the current status quo makes the current arrangement likely untenable. Incorporation into a West Indies Federation is likely the primary route preserving American interests while placating most unrest. In the short term, increased covert action will likely be required should the situation display any indications of increased deterioration. Recommend increased investment into monitoring activities and the firm identification of Persons of Interest and Organisations of Interest to be acted upon should the need arise.\n\nSIGNED: IF, Kingston Office"
 Caribbean_flavor.12.a: "Fidelity, Bravery, Integrity."

 Caribbean_flavor.13.t: "The Jamaican Without a Tie"
 Caribbean_flavor.13.desc: "Siempre! is pleased to present the following exclusive interview with Michael Manley, head of the opposition People's National Party in Jamaica. Manley's remarks have been translated into Spanish, but are otherwise unedited.\n\nJosé Pagés Llergo, Interviewer: "What should our readers know about you and your party?\n\nMichael Manley: "I've served as an aviator in the fight against fascism, and as a newspaper editor and union leader in the fight against capitalism. I'm proud to continue those fights alongside the great men and women of the People's National Party. We stand for a democratic, socialist future for Jamaica, and are a voice for serious change in a Caribbean held stagnant by imperialist forces."\n\nPagés Llergo: "How would you describe the situation in Jamaica?"\n\nManley: "Alexander Bustamante and his Jamaican Labour Party have adopted a policy of subservience toward Canada, and rely on naked repression to enforce it. Several polls demonstrate majority support for an independent, Jamaican republic, but the JLP's thugs and gerrymandering continue to frustrate the will of the people. Frankly, things are reaching a breaking point."\n\nPagés Llergo: "How does Mexico play into you and your party's strategy?"\n\nManley: "From your own national experience, Mexicans have spoken consistently and influentially against the ills of colonialism and authoritarianism in our hemisphere and our world.""
 Caribbean_flavor.13.a: ""As our neighbor, I know you will be a powerful ally in Jamaica's fight.""

 Caribbean_flavor.14.t: "Foul Winds along the Windwards"
 Caribbean_flavor.14.desc: "RESTRICTED/[GetDateText]\n\nFROM THEODORE SHACKLEY\nMEMORANDUM FOR THE PRESIDENT\n\n1. Protests are breaking out across the Canadian-administered Windward Islands with an epicentre in Dominica, where the United Fruit Company's West Indies branch has a strong presence.\n\n2. Agriculture is the largest employer in the region. With the decline of traditional sugar cultivation in the face of competition, investments into banana farming have brought renewed growth and development, being responsible for the construction of the majority of roads and railways within the region. The United Fruit Company (UFC), a motor for the economy and infrastructure in Dominica, currently holds about half of the total banana production in the island.\n\n3. The banana fieldworkers at UFC's plantations in Dominica have joined forces with other local banana farmers to protest low wages and poor working conditions, and allegedly, political interference and manipulation by UFC. The same narrative is spreading in other Caribbean islands where UFC is present, requiring a response from the US.\n\n4. Our government could respond to these protests by encouraging the UFC to make concessions, potentially securing stability through higher living standards. Or diplomatic staff could engage the Governor-General to ensure US business interests in the region are protected."
 Caribbean_flavor.14.a: "The hard-working peoples of the Indies deserve something for their trouble."
 Caribbean_flavor.14.b: "America's financial investments in the Indies are a priority."

 Caribbean_flavor.15.t: "From Kingston to Harlem"
 Caribbean_flavor.15.desc: "Richard Hart stood at the podium, it was a large crowd, made up of Black Panthers and other radicals, maybe the small room made it seem larger than it was. Nevertheless, he spoke determinedly "I've come here to speak to you all today," he said with a thick accent, "I am not from America, as many of you have noticed. I am from Jamaica, and while many of our brothers and sisters are oppressed here, the same goes in Jamaica, coordinated by the same white men in Washington," he slammed his fist down on the podium.\n\n"The so-called 'Jamaica Labour Party' is an enemy to the Jamaican people! It's nothing but a bootlicking puppet for the racists in Washington profiting off of us Jamaicans! And just as our brothers and sisters struggle here in America, with riots in Detroit and right here in Harlem, our brothers and sisters in Jamaica struggle with riots in Spanish Town and Kingston!"\n\nHe raised a fist in the air as the crowd erupted into applause, before stepping away for the next speaker. In the corner was a quiet man, watching, making no comments, and cheering little. He was a plant, and he had no clue why no one confronted him. That didn't matter though, he got what he came for, and he left, tape recorder in tow."
 Caribbean_flavor.15.a: "It takes one rotten appple..."

 ## Anguilla Crisis ##
 Caribbean_flavor.16.t: "Devious Decolonisation"
 Caribbean_flavor.16.desc: "Baron Molson, Canadian representative to the West Indies Commission, closed the door behind him as he entered the office, clumsily holding onto a large folder with his other hand. The usually impeccable aristocrat seemed almost frazzled as he sat down in front of William Hastie, one of the American representatives, and offered a distracted handshake. "Thank you for arranging this meeting on short notice, Mr. Hastie. Things are moving quickly and Ottawa has been badgering me for a policy proposal for days now."\n\nHastie flicked through the files in Molson's open folder. "Glad to be of service, Mr. Molson. Let us cut to the chase, then, shall we?"\n\nMolson nodded. "Indeed we shall. The Anguillans have made it quite clear that they have no wish to remain part of the Leeward Federation, and Mr. Webster had appealed for direct rule from Ottawa. In principle, I do not see a reason to object - they've been complaining about rule from St. John's for years now. But the present situation offers its own set of complications."\n\n"The main issue is the fact that this would be accepting an illegal secession as a fait accompli. If we agree to Webster's appeal, we'd be affirming the rule of might in the Caribbean and creating a dangerous precedent for the future stability of the Caribbean. And of course, St. John's would be furious - we may be pacifying Anguilla by setting the rest of the West Indies on fire."\n\nHastie leaned back. His hunch was correct - Molson was prepared to sacrifice the pawn of Anguilla for the greater cause of continued order in the rest of the region. How absurdly typical of the colonial bureaucracy. But here they were, and his advice was requested. "I'd never thought he'd see the day when you would consider turning down a call to place the Union Jack over a willing population, Sir Molson. But if I were you...""
 Caribbean_flavor.16.a: ""I'd tell Ottawa to take them under their wing. We wouldn't want this to remain a sore spot.""
 Caribbean_flavor_Canadian_Occupation_tt: "§YCanada will take over Anguilla. This will pacify the island, but prove to others that the existing order in the Caribbean is only as strong as the papers that codify it.§!"
 Caribbean_flavor.16.b: ""I'd tell Ottawa to get them back into the Federation, if they want it to survive.""
 Caribbean_flavor_Federation_tt: "§YAnguilla will be told to rejoin the Leeward Federation; let us hope they accept a return to the old order peacefully.§!"

 Caribbean_flavor.17.t: "The Voice of Reason"
 Caribbean_flavor.17.desc: "From his luxurious Kingston apartment, Luis M. González-Mata leaned back on his couch and produced a Cuban cigar. The arduous process of searching the room for bugs finally over with, he could at last move onto the only slightly less mind-numbing task at hand. Dealing with Trujillo's thuggish excuse for intelligence officers was always a chore. Those knuckle-dragging jackboots thought themselves invincible after Puerto Plata. It was with good reason that Madrid suggested they consult González before trying any more harebrained schemes. Before him was a large radio transceiver, antiquated by standards of modern intelligence, but working for Iberian intelligence meant having to make do.\n\nAfter a convoluted chain of code words was exchanged, González was communing with the disembodied voice of a hard-smoking SIM agent. "Good afternoon, señor. I've checked with my sources in Anguilla, as you've requested." González said with as much politeness as he could muster.\n\nThe voice crackled on the other side of the line. "Well, what's the outlook? Will they accept our aid?"\n\nGonzález took a long drag on his cigar. "I regret to inform you that Señor Webster seems to have no interest in armed rebellion. While Anguilla has issues with the governance of the Leeward Federation, he and his government remain loyal servants of the British crown, for whatever that means these days. I would suggest sending your guns elsewhere."\n\nA moment passed before the muted huff rang from the receiver. "Very well then. Let them rot on their little island prison and try to hold on against the Yankees on their own. If they're so loyal to their little crown, they can try and beg it for scraps. And you - do better next time. Franco hadn't sent you here to let the Yankees walk all over the place." The conversation ended with a click. Not for the first time, González was left with a thought..."
 Caribbean_flavor.17.a: "Perhaps he should have let Trujillo die that fateful day."

 Caribbean_flavor.18.t: "Clarity"
 Caribbean_flavor.18.desc: "Mexico's representative to the Organization of American States brandished the packet as if it were a gun. His voice fired out, "These are photos. Photos taken this week in Anguilla. Photos of an independent Caribbean Republic being conquered, the clear wishes of its people denied. Photos of an outmoded empire enforcing its crude will against a smaller nation - a theme so many here will recall from their own national histories."\n\n"But photos do not use such words. Until I can show them to you, I must translate what they have to say into Spanish."\n\n"Three Anguillan girls wait at the gates of The Valley Secondary School in white shirts and plaid dresses. Their teacher is not there, only Canadian soldiers with guns pointed into the air."\n\n"A paratrooper shoves two Anguillan men against a wall, their hands-upraised. Children look on."\n\n"Perhaps a hundred Anguillans march down a dirt road to protest the reimposition of imperial rule. Under the beating sun, some wear hats, some carry parasols. Still more carry signs decrying the foreign governors who have brought them only neglect, never development."\n\n"Here is Anguillian Chief Minister Ronald Webster, a stern man wearing a striped shirt and tie. The rightful leader of a sovereign country is surrounded by his people, who hold signs saying, 'Shame on Canada.' This photo was taken just before the invasion. None have been taken of him since - Webster's whereabouts are unknown.""
 Caribbean_flavor.18.a: "The U.S. representative could only grit his teeth and imagine how they would look in tomorrow's papers."

 ## Crane Conference
 Caribbean_flavor.19.t: "Painting Over the Cracks"
 Caribbean_flavor.19.desc: "As the Commission meeting began, figures washed over William Hastie's mind. He had heard the glib discussions among diplomats briefly shuffled over from Port-au-Prince or Havana for years, but he had grown to accept they had a point. As wary of American encroachment as he was, even he accepted the need for an alternative.\n\n"Whilst not all economic programmes have failed, we have noted a continual stagnation within the region." This was a vast understatement, of course, but "Beyond a few minor successes, Anguilla and British Honduras in particular have remained underdeveloped, and we view this as a major concern in the years to come."\n\nAs Hastie finished, Hector Allard immediately turned to speak. "In addition, recent instability in Jamaica has filled most of us with deep concern. I don't think handling these developments are impossible with our present resources, but they are quickly spiraling out of our control. "\n\nHastie furrowed his brow. "However, we must also accept that we no longer live in the nineteenth century. With Canada's evolving ties to the United Kingdom, it's difficult to see it maintaining the same role it previously did." The topic was a risk, but he knew better than to delay the inevitable. "With this in mind, I wanted to suggest the possibility of turning the committee into a transitional body whilst we prepare to grant self-governance to the Caribbean."\n\nAs he finished, Hastie expected some murmurs to at least warn him, but was surprised by the relative silence across the room. "It would be a great shame for us to lose these colonies, but even I can see the direction that this country is going in," responded Molson, mute as he looked downwards. "With recent events, it seems that the best move will be to prepare the formation of a local federation to help manage affairs." Hastie was silenced by shock for a moment, but quickly moved onto discussing a new constitution."
 Caribbean_flavor.19.a: "A country born in a boardroom."

 Caribbean_flavor.20.t: "Finding a Middle Ground"
 Caribbean_flavor.20.desc: "William Hastie had long grown used to Alexander Bustamante's aversion to having firm opinions, but this particular conversation took that habit even further than normal. Every attempt to ensure support was rebuffed with scepticism, and any attempts to assuage that was met with uptight endorsement.\n\n"Well, William," asked Bustamante, halting only to spew out a cloud of cigar smoke, "My role is to serve the people of Jamaica, and I fear that this conglomeration would simply overstretch my priorities."\n\n"Such a proposal would not need to elevate you to the position of Prime Minister, Mr. Bustamante," responded Hastie, flatly. In truth, he knew that it was a man trying to avoid the inevitable, but Bustamante himself still had a lot of fight left. "But with recent instability in Jamaica, the Commission has become concerned that a fragmented Caribbean would not be able to resist the threat of extremism."\n\nTo this, Bustamante nodded. "Indeed. I have grown concerned about how far those union radicals can go, and what they would do should they accede to power." He took out a pen and began to write a brief memorandum, but halted before finishing the first word.\n\nHastie nodded in turn. "Doing so would also help to integrate Jamaica into the wider economy, and would be invaluable in developing the Jamaican economy."\n\n"Jamaica's got its economic woes, yes, but tying us with destitute islands across the region will only worsen that," replied Bustamante, furrowing his brow but halting before he reached an inevitable conclusion. "But we won't get much further within this current situation. If you can guarantee that Jamaica remains in a powerful position, then I'll be willing to back a federation." Reaching out for a handshake, the pair responded tentatively before affirming the eventual agreement."
 Caribbean_flavor.20.a: "The wavering ends, if only for a brief moment."

 Caribbean_flavor.21.t: "The Final Curtain"
 Caribbean_flavor.21.desc: ""So, if there is no further opposition, I suppose we can move on with our final settlement." continued William Hastie, mostly by rote as he looked ahead. The Conference was densely packed, filled with diplomats and regional leaders, yet most discussion had felt nominal at best, confirming changes that had already been functionally pursued. "We will seek the formation of a West Indies Federation in Port of Spain. This federation will form in the coming months and should be fasttracked for membership in the Organisation of Free Nations."\n\nEric Williams lowered a finger from his ear, before clasping his arms together. "I'm still hesitant to support this ruling." he responded with audible fatigue. "We may be granted freedom to run our own elections, but by forcing us into the OFN, I can't see this measure as anything other than curtain dressing." William Hastie turned towards the Canadian delegation, filled with doughy figures who seemed disconnected from the discussions. He could tell their plans wouldn't be ruined by last-minute objections from a regional leader.\n\nGrimacing, Alexander Bustamante nodded. "Indeed. This measure won't do anything but spread our economies thin, and will leave Jamaica split between wealth and destitution." Williams raised an eyebrow, but nodded regardless. A few quiet murmurs echoed, mostly casting doubt on Bustamante's continued relevance. "We can't expect our invitations to the Canadians to amount to much if we then slam the door on them."\n\n"We have discussed arrangements from the Canadians, and there doesn't seem to be any real issue with the proposal," responded Hastie, raising a paper detailing a set of discussion but not turning to read from it. As he smoothed over the final objections, he turned to ask for a final, informal vote, his hollow endorsement eventually echoed across the room. Whatever suspicions he had over the true fate of the West Indies, they had now been taken from his hands."
 Caribbean_flavor.21.a: "A full conference, bereft of meaning."

 Caribbean_flavor.22.t: "Pawn to B5"
 Caribbean_flavor.22.desc: "It hadn't taken long for news of the planned withdrawal of the West Indies Commission to come to light across Mexico. Beyond a few internal celebrations among diplomats and staffers posted to the region, ambiguity dominated across most perceptions. Sitting as the chair of a meeting, Alejandro Gómez Maganda knew such confusion couldn't escalate so high.\n\n"We shouldn't oppose American efforts, at least not publicly," responded one diplomat, a man Maganda recognised only from his placement, marking him as Eustacio. "There doesn't seem to have been much opposition from Allard or Molson, but many British and Canadian officials further down might slow what progress is made."\n\nThe crowd around them nodded in unison, but struggled to continue. "We should look to direct the eventual settlement upon dissolution," replied Maganda, struggling to hide his nerves. These developments presented his best opportunity, perhaps, but also risked giving [MEX.GetLeader] the justification to oust him from politics entirely. "We can't risk having the British or Canadians direct this eventual settlement. A strong, centralised Union is pivotal for regional stability and prosperity."\n\nEustacio raised a hand again as Maganda finished, but responded almost immediately. "I agree. Eric Williams has enough sway internally to potentially direct the eventual settlement, and could direct long-term policy towards us."\n\n"But we must remember that we have options here beyond him as well." continued another, a man who Maganda could more easily recognise as Gilberto Rondes. "Michael Manley seems to be a natural successor to Bustamante, and has grown increasingly jaded with imperial rule." Maganda nodded for a moment, but then took towards refastening his tie. "As long as he remembers to speak as a member of the lower aristocracy, he should also be an invaluable ally.""
 Caribbean_flavor.22.a: "A chain in check?"

 Caribbean_flavor.23.t: "Mirror Image"
 Caribbean_flavor.23.desc: "Walking through the crowds of diplomats gathering for idle conversation at the Crane Conference, a sense of unease permeated through Luis González-Mata as he stepped into a secluded corridor. He may have been at the Conference for diplomatic purposes, but the undertones of his latest conversations with Madrid made clear their demands; to find a way to prevent the transition. But did it feel right for a man serving a federation to work on its behalf to smother another in its cradle?\n\n"Have you got any updates on the present situation?" asked a man, interrupting his thoughts, dressed in the attire of a waiter present at the Conference, now adopting a demeanour that betrayed his true nature as an Iberian spy.\n\nGonzález-Mata sighed. "Not to any significant degree. Decolonisation of the West Indies is now a matter of months, a year at most, with only a few minor concerns on provincial arrangement still pervading. They're looking at a regional federation, from Jamaica to Trinidad." Looking around, the pair made sure that nobody was coming before continuing. "America won't feel any real change from this, but Mexico might try to push themselves in, whatever their regional objectives are."\n\nThe spy sighed in turn, clearly expecting more guidance. "Any real internal opposition at this point? All discussions I have overheard highlight a general disregard for Canadian opinion, but anything beyond that?"\n\n"Not much beyond the planters and colonial bureaucrats, but they've been out of favour since the war," responded González-Mata. "I have noted that Bustamante was more reluctant than others in the region. Obviously only wants to push his retirement back a few months, but that could give us a valuable route to influence with his successor. With how important Jamaica is to the regional economy..." The pair went silent, but the implications needed no elucidation."
 Caribbean_flavor.23.a: "A third power joins the fray?"

 ##Proxy Build-up After Patriation
 Caribbean_flavor.24.t: "Pressing Concerns"
 Caribbean_flavor.24.desc: "William Hastie's slightly stuffy office in Washington D.C. has become the scene of almost nonstop commotion and meetings ever since the Crane Committee has concluded. A swarm of secretaries, officials, diplomats, and politicians have come and gone, each attempting to put their own foot in the door. Some proposals were reasonable, others clearly an attempt at power and money grabbing, but some, such as the one currently being elaborated in front of him, were crucial.\n\nNorman Manley, veteran of decades of Jamaican politics, has come all the way from Kingston to make his case personally to Hastie. "You know well that I have called for a process such as this to take place for many years, Mr. Hastie. I still believe that it is the best path forward for the West Indies in general and for Jamaica in particular. However, there is one thing which I believe must occur before any move towards Federation: Jamaica needs to have a free and fair election."\n\nHastie nodded. He was aware of Manley's position on this issue and could not help but agree. Bustamante was using increasingly authoritarian measures to maintain power in Jamaica. If he remained premier when the island was integrated into the Federation, he could support himself with its institutional pillars and better hide the foreign support Hastie was sure he was receiving, perhaps indefinitely. "I agree. America will support the organization of new elections in Jamaica before she accedes to the West Indies Federation."\n\nManley nearly sprang up from his chair with excitement. "Thank you very much, Mr. Hastie. Your support is highly appreciated, and I pledge to support the Federation project likewise with all of my power..."
 Caribbean_flavor.24.a: ""... but we will have to throw out the despot first.""

 Caribbean_flavor.25.t: "Dangerous Headwinds"
 Caribbean_flavor.25.desc: "The pile of papers growing on William H. Hastie's desk ever since the Crane Conference was enough of a headache, but now, as he picked up the receiver and dialled Kingston, he prepared himself for a true migraine. "Good day, Sir Bustamante. This is William Hastie of the West Indies Commission speaking.'\n\n"Good day, William. What is it this time?'\n\nHastie took a deep breath. "I hope you are well, Sir Bustamante. I wished to talk with you about the possibility of setting up elections before Jamaica's accession into the West Indies Federation. I don't need to tell you how heated the political climate is at the moment. The situation may easily deteriorate in the coming months, and we'll need to act carefully to avoid that.'\n\nA moment passed before Bustamante roared into the phone, almost unintelligible through his accent. "Is this a threat, William? Are you pressuring me to fold to the rabble? Jamaica has elected me, William. Remember that when you talk about elections.'\n\nHastie massaged his temples. At least Bustamante hadn't hung up on him. "Of course, Sir. But you must understand our concerns about the situation. Please, don't do anything rash.'\n\nBustamante's speech had an air of urgency to it now. "I am like a father to this country, William. I've dedicated my whole life to her. Don't you think I would know what's best for her? Can't you trust me at all?" The line went quiet for a moment, before Busta's now-tired voice returned. "But you might be right. Maybe I should be the bigger man and all that. I'll have to think about it. Good day.'\n\nHastie's head pounded as he put down the phone. This was out of his hands now. All he could do was hope."
 Caribbean_flavor.25.a: "Hastie's sweat-drenched hand reached out for the drawer where he kept his painkillers."

 Caribbean_flavor.26.t: "The Chief's Discipline"
 Caribbean_flavor.26.desc: ""They think I'm a puppet! A fucking puppet!" Alexander Bustamante slammed a wizened fist on his desk, wincing and shaking it in the air. "How dare they?" His advisors glanced at each other briefly, registering the worry on their faces. "They" were either Mexico or the protesters outside—one implied it, the others said it outright. When they turned back to their Premier, his hands were raised in mock questioning. "Have I not done every Goddamn thing for these ungrateful brats out in the streets?" A finger snapped to the window outside. An inaudible chant rode the wind through their office.\n\n"With respect," said one of the advisors, standing in front of the Bustamante Express, "... internal polling is still strong, despite... despite everything. We could still win the election-"\n\n"Could! I could win the election!" He slouched down in his chair, his head kept low. "And if I lost? No, no. Jamaica still needs me. I need to help shepherd Jamaica through this federation. God only knows what would happen if a less steady hand was on the till here."\n\nThe other advisor cleared his throat, held up the folder in his hand. "There's still the matter of the protests. I have the reports from the Constabulary here-"\n\n"Save it," said Bustamante. The advisor tucked the folder back into his lap. "There's only one thing I need to know. Can they deal with them?"\n\nThe advisors looked at each other again, then turned to Bustamante. "Yes, they could. But Mr. Hastie was pretty clear about-"\n\n"Does Hastie want his federation or not?" Bustamante sighed, his eyes turning to the work on his desk. "Keep dissent to a minimum, at least until the Federation's ratified...""
 Caribbean_flavor.26.a: ""... And do it just like my friends east. They need to learn.""

 Caribbean_flavor.27.t: "Winds of Change"
 Caribbean_flavor.27.desc: "A calm breeze filtered through the streets of Kingston, offering Alejandro Gómez Maganda respite from the humid heat. He took a sip of his coffee and smiled at his counterpart. "It's actually happening, huh? The Crane Commission, the independent federation, all that. Didn't believe I'd see the day when the Anglos actually implement forward-looking policy. Your father must be thrilled."\n\nMichael Manley, chairman of the People's National Party, winced slightly. "He is, yes. And I should have been too - we've worked for something like this for years. It could be a great opportunity for Jamaica, and I agree that it's long past due that we've stepped out of Canada's shadow. But I can't help but feel that this... might not be an opportune moment."\n\nThe breeze stopped, and Gómez took out his handkerchief to wipe his brow. "Why is that?"\n\nManley fidgeted with his cup. "If the West Indies Constitutional Congress takes place in mid-1967, as is currently planned, it would mean that Jamaica will be incorporated into the federation before it has a chance to reform itself out of the colonial political structure... and before it can rid itself of Bustamante and his cronies." Manley looked around nervously for a moment. He had requested to have this meeting at this nondescript cafe, and Gómez could now understand why. "I fear that independence and federation without the necessary reform might even lead to violence down the line."\n\nGómez leaned forward. "I understand. If the Canadians are going to try keeping their finger in the pie through Bustamante, we're going to have to try and - metaphorically, of course - slap it out. Mexico will support Jamaica's sovereignty no matter what. You can be sure of that.""
 Caribbean_flavor.27.a: "The breeze came back to life."

 Caribbean_flavor.28.t: "Report on the Jamaican Political Situation Following the Crane Conference"
 Caribbean_flavor.28.desc: "DIRECCIÓN FEDERAL DE SEGURIDAD\n\nISSUE: Political developments in Jamaica\n\nFollowing the conclusion of the Crane Conference, the political situation in Jamaica has been shifting rapidly. The imminent formation of the West Indies Federation and various issues concerning Jamaica's accession to it have come to dominate political discussion on the island. Among these issues, none had become as salient as the question of elections.\n\nTheoretically, longstanding Jamaican Premier Alexander Bustamante is set to hold his position until the elections of 1967. However, a growing movement within the island has begun calling for early elections, before Jamaica's accession to the Federation. These politicians, activists and public figures have castigated Bustamante as a despot who has only held on to power through the intervention of the Colonial Office in Ottawa, and are concerned that accession to the Federation before the holding of elections will only allow him to further entrench his position in the region's new power structures.\n\nRecently, this movement, centered around the opposition People's National Party and their leader, Michael Manley, has begun organizing large protests and strikes on the island, calling for elections to be held or even directly for Bustamante's removal. While these protests have been peaceful to date, their growing size and Bustamante's ego and temper have increasingly endangered the peace. It may not take much for protests to spiral out of control.\n\nVery respectfully,\n\nThe Federal Director of Security"
 Caribbean_flavor.28.a: "As usual, the imperialists leave a mess behind them."

 Caribbean_flavor.29.t: "Throwing the First Stone"
 Caribbean_flavor.29.desc: "The Mexican consul to the Caribbean's throat was suddenly dry. Challenging Canadian policy in the West Indies so directly was a diplomatic gamble. The Americans were on his side, privately, but they would disapprove of such public criticism of their northern neighbor's colonial clients. And yet the actions of Jamaica's premier had crossed a line; someone needed to take a stand for the Jamaican people. Alejandro Gómez Maganda took a long breath and began to speak.\n\n"Good evening. I have called this press conference in order to sharply condemn the escalation of violence and rejection of democratic norms seen in Jamaica. The scenes of repression and brutality committed by police and armed thugs sent by Premier Bustamante against peaceful protestors have been deeply shocking. It has been a display of violence that reminds one of Europe's jackbooted regimes. It has made one thing clear - Premier Bustamante is not fit to govern Jamaica. He must step down from his position and allow the holding of free and fair elections."\n\nA few minutes later, when the journalists had the opportunity to ask questions, a reporter for La Prensa raised her hand. "Licenciado, is your stance shared by our neighbors? The Canadians have been known to be supportive of Bustamante and his government in the past."\n\nGómez took a breath. Any criticism here could be received as a direct attack on Ottawa and, by extension, on Washington itself, no matter how veiled. But he could feel the determination building inside him, a righteous anger, and the will to act.\n\n"I am here to iterate Mexico's position. Unfortunately, not all of our friends see things exactly as we do. Premier Bustamante has been a convenient accomplice in several initiatives that have served to entrench the presence of foreign powers in the region, and some of these foreign powers would certainly wish to see him remain. However...""
 Caribbean_flavor.29.a: "Mexico will not stand for the repression of people's self-determination".

 Caribbean_flavor.30.t: "Re-stoking the Embers"
 Caribbean_flavor.30.desc: "Luis M. González-Mata's stash of Cuban cigars has been dwindling ever since Batista fell and his connections on the island were cut to the bone, but it was occasions like this that made him glad he hadn't wasted the last of them. Alexander Bustamante could be a difficult man, but a good cigar could mellow out most people.\n\n"Thank you, Luis. I needed this break. Things are heating up around here, and the Yankees are stirring the pot against me. I'm starting to have doubts about this whole affair."\n\nGonzález-Mata puffed out a perfect ring of smoke. "The Federation? Well, I believe this is still a good opportunity for you. As long as the Americans don't take direct action, you should be able to hold on, maybe with some help from Ottawa. And once the Federation is established, you're going to have many more avenues to exert power - you should be practically unassailable at that point."\n\nBustamante squinted into the setting sun. "That's the thing, Luis. I'm not sure. Maybe I should just have this election to shut the Manleys up. I'll win the election and let everyone see who the Jamaican people trust. If we enter the Federation without elections, they might just think the same as you and turn to less legitimate means to get me out of here."\n\nGonzález-Mata turned to Bustamante, eyebrow raised. "Really, Mr. Bustamante? I would say you shouldn't get into that mess. If these elections are sponsored by the Yankees, do you really think they'll let you win?"\n\nBustamante snorted. "They have until now. But then again, even letting them hold their elections might make the people believe that I've given up. Those PLP bastards will think that this is their opportunity." He looked at his dwindling cigar."
 Caribbean_flavor.30.a: ""Well, they have another thing coming.""

 Caribbean_flavor.31.t: "The Kingston Shuffle"
 Caribbean_flavor.31.desc: "Santos had learned a long time ago to numb himself to the kind of carnage mounting outside his window, this dingy second-floor hotel room overlooking Kingston Square and the ongoing protests against the recent election cancellation as they escalated outside. A table fan hummed on a distant end table, the smell of cigarette smoke soaking into the wooden paneling and cheap plaster that lined the walls. Not exactly ideal vacation logging, but it worked well enough to keep tabs on what was happening on a street level.\n\nThe protesters were going at it yet again, the afternoon sun hidden beneath an overcast sky as line after line of riot police filled the streets.. Santos thought that might have been a small blessing in a sense, as things were going to get hot enough already, even before the tropical humidity hit. The fires had not broken out yet like they had in previous demonstrations, but that didn't stop clouds of smoke wafting up the picket in the far distance where tear gas had already been deployed, flashing police lights and droning sirens as a backdrop.\n\nThrough the slits in the blinds, Santos' eyes narrowed, memories of Catalonia and Morocco echoing in his brain, or maybe he was just being paranoid? Instinctually, he reached for the phone, dialing the number of his contacts in Madrid, only to realize the line was dead. He then realized the wail of the sirens was multiplying, reinforcements en route, perhaps responding to whatever just knocked out the phone line. Santos started packing, gathering up false IDs and passports for the flight back to Iberia."
 Caribbean_flavor.31.a: ""Bustamante really riled them up this time," he thought dully."

 Caribbean_flavor.32.t: "This Is the End"
 Caribbean_flavor.32.desc: "He ran.\n\nChaos surrounded him, all thought and sense departed as the material met the hysterical. All around him were scrambling bodies, shoving and dashing in vain attempts to find small backroads or darkened alcoves in which to disappear into the darkness of Kingston. The night air was afire with the screaming of sirens, of loudspeakers indeterminably far demanding cooperation - cooperation with the armoured wave that pressed against them from all directions.\n\nThe night had begun with such hope. Hundreds gathered listening to him and many others calling for change, the end of Ottawa's neglect and Bustamente's stranglehold over the West Indies; a true early election to allow the people's will be heard. After all, hadn't he told them? Under the federation, how could such a man as Bustamante ever be removed, with all the powers of such a state behind him?\n\nHe couldn't remember when it had all gone wrong. Was it a policeman misreading the situation? One of his brothers deciding to strike them? No, he didn't want to believe it. He stopped running, spying an alleyway that seemed empty and bent around at the end; a possible escape.Whatever had happened, the police had surged and, despite his attempts to plead for them to stop, after one had struck him in the nose he'd seen the only thing to do was run.\n\nHe jogged around the corner, squarely into a group of men idling unseen around the corner. Without hesitation they grabbed him and threw him to the ground, leering at him. "Weren't you that know-it-all on the stage? The commie?" one of them said. The man saw that they held a variety of proudly brandished pipes. "You should have thought about who you were doing."\n\nThe utterance of a plea died in the man's throat as a metal pipe crashed into his face. Then another. And another."
 Caribbean_flavor.32.a: "Name: Henry Gunter. Status: DOA - Attempted to flee, killed while resisting arresting deputies."
 JAM_Kingston_Riots_Started_tt: "\n§YWith fires raging across Kingston, an opportunity presents itself...§!"

