 JAM_flavor.65.t: "A Matter of Appearances"
 JAM_flavor.65.desc: "National Security Council Meeting Transcript, [GetDateText]\n\n"...I'll give it to the Jamaicans, even teetering on the edge of economic ruin, the eggshell is still holding. They're completely isolated, they have both an energy and a fuel crisis, and yet, the people won't simply just get rid of Strachan."\n\n"Well, killing your opposition will do that. True believers will starve rather than admit failure."\n\n"Despite the fact that they can barely function domestically, they still manage to cause instability when they can. Whether it's fellow reds in the Caribbean or expatriates in the United States, they can certainly cause a lot of problems for all of us. We'd better nip this in the bud before someone else does it for us."\n\n"Well, there's always the direct approach. A full naval invasion of the island due to Strachan's actions is a possibility. Jamaica doesn't have the manpower to resist a Marine landing."\n\n"That would kill our reputation on the world stage. If we're worried about domestic discontent stirred up from Jamaica, imagine what it could do when the Japanese and the Mexicans would have inroads into the very same communities...with deeper pockets."\n\n"Edward Seaga has bands of exiles willing to fight for him. If we could provide naval and air support for a landing, we could allow them to fight, then assist them in establishing a pliable government. He already has most of the expertise needed in his cadre. A higher risk of failure, of course, but much less pushback - it looks like a Jamaican internal dispute. Everyone knows it isn't, but appearance counts for a lot.""
 JAM_flavor.65.a: "The discussion continued, and plans were drawn."

