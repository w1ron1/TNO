 ## FWI Flavor Events
 #KD's Notes - If I see shitty formatting in this file again, you'll be sleeping with the fishes
 FWI_forpol.1.t: "Проблеми в раю"
 FWI_forpol.1.desc: "CONFIDENTIAL/[?global.date.GetDateStringNoHourLong]\n\nOFFICE OF THE HIGH COMMISSIONER, US ANTILLES MEMORANDUM FOR THE UNDER SECRETARY OF STATE\n\nSUB: UNREST IN FORMER FRENCH WEST INDIES\n\n1. Політична ситуація в колишній Французькій Вест-Індії постійно погіршується. Економічна програма, запроваджена американцями у 1960 році під егідою "Проєкту: Підйом" для збільшення економічної активності та допомоги островам у переході до сучасного ринку, натомість мала протилежний ефект. За останні два роки сила антильської економіки знизилася, а проєкт посилив класовий розкол серед місцевих жителів. Ми радимо Вашинґтону готуватися до негайних заворушень.\n\n2. Ця ситуація, що погіршується, мало сприяла прихильності остров'ян до нашої присутності на островах. Наполягання генерала Лемніцера, Верховного цивільного комісара островів, на втручанні в місцеві справи щоразу, коли він забажає, ще більше ускладнило ситуацію. Політична прірва на місцях між тими, хто виступає проти американської присутності, і тими, хто її підтримує, швидко розширюється, оскільки обидві сторони почали обурюватися одна на одну через те, чи вирішують вони підтримувати адміністрацію, чи ні.\n\n3. Ця напруженість, імовірно, посилиться протягом наступних двох років. Термін дії Акту Шорта—Фулбрайта 1947 року, який надав адміністративний контроль над островами, спливе у 1964 році. Вже зараз групи, що виступають за незалежність та проти незалежності, почали організовуватися та проводити кампанії, провокуючи заворушення, вандалізм і громадянську непокору.\n\n4. Якщо нинішні відносини триватимуть, поточна напруженість може перерости в щось надзвичайно серйозне. Рекомендується, щоб уряд пильно стежив за островами, аби забезпечити подальшу ескалацію ситуації."
 FWI_forpol.1.a: "Куди б ми не пішли, скрізь щось нове."

 FWI_forpol.2.t: "Сіль у цукрі"
 FWI_forpol.2.desc: ""Перепрошую... перепрошую, будь ласка, мені треба пройти... перепрошую!" — пробурмотів Жан, пробираючись крізь натовп, що зібрався на вулицях Бас-Тера. Щойно було оголошено, що американці залишаються на Антильських островах, острови охопив спалах гніву, і, куди б ти не пішов, здавалося, від нього нікуди не втекти.\n\nЖан? Він просто хотів потрапити на роботу.\n\nПоправивши окуляри, він намагався не зустрічатися поглядом із протестувальниками. "Краще тримай голову опущеною", — казала його мама, поплескуючи його по голові та відправляючи до школи. Походячи з однієї з більш заможних місцевих родин, але так і не досягнувши нічого більшого за управлінську посаду в помірно успішній компанії, що з'явилася завдяки планам "Підйому", він ніколи особливо не відчував потреби брати участь у таких демонстраціях. Так чи інакше, здавалося, американці ніколи не підуть.\n\nВідчайдушно намагаючись протиснутися крізь масу спітнілих тіл, не привертаючи уваги, він придушив роздратування, що починало закипати. Він міг їм співчувати. Справді. Авжеж, цього разу вони пообіцяли, що президент призначив спеціальну групу, щоб розглянути, чи заслуговують люди на їхніх островах на незалежність чи ні, але він сумнівався, що багато хто вірив у якісь результати. Американці все одно планували залишатися — у цьому була згода всього їхнього Конґресу. Це була безвихідна ситуація, і Жан уже втомився від неї.\n\nПісля того, що здавалося цілою вічністю, він дістався свого місця роботи: скромної, але офіційної на вигляд будівлі. Але коли він наблизився, його серце впало, коли він помітив табличку у вікні дверей."
 FWI_forpol.2.a: """ЗАЧИНЕНО ЧЕРЕЗ ЗАВОРУШЕННЯ. ЗАЛИШАТИМЕТЬСЯ ЗАЧИНЕНИМ ДО ПОДАЛЬШОГО ПОВІДОМЛЕННЯ."""

 FWI_forpol.3.t: "Щось має змінитися"
 FWI_forpol.3.desc: "Генерал Лайман Лемніцер втомився втрачати контроль.\n\nГенерал звик до випробувань. Це могла бути нищівна робота. Він був свідком того, як американські війська зазнали краху під час захисту Британських островів пліч-о-пліч із самим Ейзенхауером. Він був там, коли домовлялися про умови капітуляції, а поразка лежала на його серці, мов брила. І коли президент Кефовер тонко відсунув його вбік, доручивши йому управління парою крихітних островів у Вест-Індії, він прийняв це з нічим іншим, окрім гідності, намагаючись керувати ними з честю та достоїнством.\n\nІ все ж, як виявилося, він навіть не зміг запобігти тому, щоб усе це пішло до біса.\n\nВін упав на готельне ліжко, тримаючи склянку чистого бурбону. Виступати перед Конґресом для нього не було чимось новим, але щоразу це все одно нагадувало йому про неслухняного школяра, якого судять учителі. Коли він розповідав про ситуацію на Антильських островах у деталях, він відчував на собі їхні погляди та глузування. Він робив усе, що міг.\n\nПравду кажучи, заворушення на Мартиніці та Ґваделупі дещо вщухли на загальнонаціональному рівні. Після того як минув початковий спалах заворушень і демонстрацій через оголошення про те, що Сполучені Штати збережуть свою присутність на острові, напруженість зійшла нанівець, обмежившись місцевим рівнем. Але тепер, коли незалежність увійшла до публічного обговорення, її вже не можна було просто прибрати назад. Банку відкрито, кішку випущено з мішка, а песика ґрунтовно трахнули.\n\nМасажуючи чоло, він зробив ще один ковток. Не те щоб вони планували окупувати острови назавжди. У будь-якому разі, незабаром його обов'язок буде виконано."
 FWI_forpol.3.a: "Не можна втратити те, чого ти ніколи насправді не мав."

 FWI_forpol.4.t: "Порожні обіцянки"
 FWI_forpol.4.desc: ""Це має бути жарт." Очі Річарда Ніксона знову й знову пробігали рядками паперу, який він тримав перед собою. Запропонована поправка до Акту Шорта—Фулбрайта, що вводила референдум щодо автономії островів, які раніше належали Французькій Антилії. Регіону, який він від самого початку свого терміну намагався демонстративно ігнорувати. "Я божеволію від цього безладу в Південній Африці, а ви марнуєте мій час на... що? І ви кажете, що Конґрес це ухвалив?"\n\n"Їм потрібен лише ваш підпис", — спокійно сказав віцепрезидент, багатозначно дивлячись на ручку в руці Ніксона, яка дещо дратівливо постукувала по столу останні кілька хвилин. "Референдум планують провести наступного року", — продовжив він. Ніксон кинув законопроєкт назад на стіл, на деякий час масажуючи скроню. Він просто хотів перепочити. "А чому ми взагалі це розглядаємо? Ми просто поставимо під загрозу наш контроль над Карибами через кількох незадоволених?"\n\nДжон щосили намагався зберігати спокій. Він знав, що президент абсолютно не усвідомлював, наскільки поганою останнім часом була ситуація на Ґваделупі та Мартиніці. Як вона перетворювалася на зовнішньополітичну кризу. Натомість, як завжди, він зберігав натреновану, стриману усмішку. "Насправді сам Верховний комісар особисто виступив перед Конґресом, просячи про якісь поступки місцевим жителям..."\n\n"Хіба цей некомпетентний бовдур не є причиною того, що ми взагалі опинилися в цій халепі?" — із змиреним зітханням президент знову потягнувся по ручку, готуючись прикрасити законопроєкт своїм підписом... але його рука зупинилася на півдорозі, коли його очі знову зупинилися на невеликій частині тексту. Положенні про обов'язковість референдуму. У його голові зародилася ідея. Деякі місцеві жителі можуть у це не повірити, але фіктивне голосування могло б на деякий час знизити напруженість, не змушуючи їх нічого робити з результатом, доки їм, у біса, не заманеться. А якщо все інше не спрацює, він завжди міг просто відправити морських піхотинців."
 FWI_forpol.4.a: "Наступного дня непідписаний законопроєкт повернули до Конґресу."

 FWI_forpol.5.t: "Убити диявола"
 FWI_forpol.5.desc: "Бар у Бас-Тері був незвично тихим; рідкісне видовище в ці дні навіть у таку пізню годину, коли прибережна питна забігайлівка зазвичай усе ще вирувала галасливими дискусіями про незалежність і самоврядування. Ні, сьогодні постійні відвідувачі перенесли свої протести до входу в резиденцію Верховного комісара, залишивши місце зайнятим лише його сивіючим орендарем Гаспаром, а його старий товариш Рене спокійно насолоджувався своїм звичним нічним ромом. Міцний напій, що палив, мов пекло, і був ще смачнішим.\n\n"Шорту—Фулбрайта заблоковано президентським вето", — говорив заголовок. За ще незвичнішої обставини для людини, яка пишалася тим, що навмисно ігнорує новини, спритно уникаючи політичної балаканини, старий Рене взявся читати сьогоднішню газету, щоб ще більше урізноманітнити цей мирний перепочинок. "Після президентських заперечень оновлений законопроєкт проходить Конґрес кваліфікованою більшістю, із домовленістю про необов'язковий референдум", — читав уголос Рене дещо насмішкуватим тоном. "Це ж про те хлопці сперечалися раніше, так? Перед тим як пішли", — запитав він. "М-м-м", — погодився старий бармен, не підводячи обличчя від склянки, яку він протирав.\n\n"Ну, я їх певною мірою розумію. Вони справді, мабуть, вважають нас дурнями. Нічого ніколи не змінюється, еге ж?" Рене грайливо усміхнувся своєму старому хитрому товаришеві, але відповіді не отримав. Здавшись, він знову звернув увагу на свою склянку, одним рухом випивши все, що залишилося, смакуючи кожну краплю, поки його горло не запалало від вогняної золотої рідини. "То... що станеться, якщо янкі відмовляться йти?"\n\nНе відповідаючи, Гаспар методично зняв тканину з уже бездоганно чистої склянки, щоб запхати її всередину наполовину повної пляшки рому, який він подавав своєму другові протягом останньої години. Потім він дістав запальничку, і очі Рене на мить розширилися, коли маленьке полум'я почало наближатися до просоченої алкоголем ганчірки. Натомість він просто прикурив собі сигарету, перед тим як коротко підморгнути своєму приголомшеному товаришеві."
 FWI_forpol.5.a: ""Ще одну склянку?""

 FWI_forpol.7.t: "Втрачена невинність"
 FWI_forpol.7.desc: "Рядовий Кейн був простою людиною. Молодий хлопець з Огайо, зі свіжим обличчям і милою усмішкою, вихований на батькових розповідях про жахи «Морського лева». Коли його запитували, що він зробить із дарованим Богом життям, він, звісно, відповідав би, що служитиме своїй країні та допоможе зробити так, щоб нічого подібного більше ніколи не сталося.\n\nКоли його нарешті призвали до Корпусу морської піхоти США, він узявся за виснажливу підготовку з тією самою рішучістю, яка вела його все життя. Він рано вставав, повзав у багнюці та робив те, що йому казали, і ніхто не міг заперечити, що коли-небудь існував лояльніший рекрут.\n\nКоли його призначили до Експедиційних сил, його очі сяяли від гордості. Ось воно. Він досяг своєї мети й сумлінно допомагатиме захищати ідеали свободи та демократії по всьому світу, звільняючи народи світу від фашистської загрози, що насувається.\n\nКоли він дізнався, що його відправляють на Мартиніку, він прийняв це з гідністю солдата. Хоча це, можливо, дуже відрізнялося від того, що він уявляв, він ніколи не був схильний ставити під сумнів накази. Зрештою, Антильські острови все ще були територією ОВН, і він охоронятиме їх із такою дисципліною, яка буде необхідна, щоб вони ніколи не потрапили до рук Пакту.\n\nКоли ж натомість він опинився перед натовпом протестувальників, тоді в ньому вперше почали зароджуватися сумніви. Навіть тоді він стояв серед своїх товаришів із натренованою стоїчністю та підкорився, коли йому наказали підняти M16, хоча, можливо, дещо нерішучіше за інших.\n\nЯкщо рій обурених криків про "Припинення незаконної окупації" та "Смерть американським гнобителям" поволі підточував його віру, він щосили намагався цього не показувати, так само як ігнорував тремтіння в руках, слухняно направляючи зброю на обличчя тих, хто кричав на нього."
 FWI_forpol.7.a: "Коли він уперше натиснув на спусковий гачок, тоді весь його світ нарешті розлетівся на друзки."

 FWI_forpol.8.t: "П'янкий смак USAID"
 FWI_forpol.8.desc: "У кабінеті на верхньому поверсі абсолютно нового "Royal Martinique" у Фор-де-Франс гудів кондиціонер Westinghouse — недоступна розкіш для місцевих, але дрібниця для Артура Бенкса. Власник мережі готелів середнього розміру з активами від бунгало на Багамах до вічно переповненої туристами "San Juan Plaza" у Пуерто-Рико, він задоволено зводив свої квартальні рахунки.\n\nМасштабна програма модернізації, запущена Вашинґтоном, перетворила Мартиніку на золоту жилу для американського капіталу. Бенкс придбав землю для цього курорту майже за безцінь, заплативши щедрими федеральними грантами USAID. Протягом перших кількох місяців, поки готель простоював, зарплати персоналу покривалися стабілізаційними фондами. А тепер сміховинний податок у 1,5% на туристичні доходи зробив його чистий прибуток майже непристойним.\n\nАртур струсив попіл із сигари й підійшов до панорамного вікна. Через дорогу робітники забивали дошками вікна бару. Але природа не терпить порожнечі: на фасаді вже висів банер, що оголошував про неминуче відкриття Whataburger. Стерв'ятники з усіх куточків Штатів зліталися на Антильські острови, а місцеві малі підприємства вимирали квартал за кварталом, поступаючись місцем стерильним франчайзинговим закладам.\n\nНезалежні економічні газети вже писали: коли вашинґтонський кран пересохне, ці "інвестиції" ніколи не окупляться, а регіон охопить руйнівна боргова криза. Однак Бенксу було байдуже. Навіть якщо ця бульбашка лусне, його "San Juan Plaza" буде повністю заброньована на рік.\n\n"Боже, бережи Америку і Лаймана Лемніцера", — посміхнувся Артур, наливаючи у свою склянку трохи місцевого рому. Нехай ідеалісти та банкрути плачуть за завтрашнім днем."
 FWI_forpol.8.a: "А Нассау чекає на нього."

 FWI_forpol.9.t: "Спеціальний випуск вечірніх новин CBS: Антильські острови"
 FWI_forpol.9.desc: ""...І ось інструктор сказав: різниця між артилеристом і дипломатом полягає в тому, що перший спочатку влучає в квадрат сітки, а потім вибачається за промах, тоді як другий примудряється промахнутися, навіть не зарядивши гармату", — баритон генерала Лаймана Лемніцера наповнив телевізійну студію, викликавши стриману усмішку Волтера Кронкайта.\n\n"Говорячи про точні влучання, генерале, — Кронкайт нахилився вперед. — Нещодавня перемога в Ісландії. Вашинґтон тріумфує. Але яке справжнє глобальне значення цієї перемоги?"\n\n"Стратегічний контроль над Північною Атлантикою безсумнівний, — сухо заявив Лемніцер. — Але що важливіше, це сигнал для світу. Організація Вільних Націй — не Пакт Райху і не Сфера спільного процвітання Токіо, побудовані на кістках рабів і багнетах катів. ОВН — це сім'я вільних демократій. І ми доводимо, що належати до цієї сім'ї означає перебувати під залізною гарантією захисту."\n\n"Сім'я вільних демократій..." Кронкайт кивнув. "Генерале, багато критиків за кордоном — і тут, удома — запитують: як ця риторика узгоджується з вашою власною адміністрацією на Антильських островах? Ви створили стабільну економіку, але дехто називає ваш режим на Мартиніці та Ґваделупі просто військовим губернаторством."\n\nОбличчя Лемніцера залишалося непроникним. "Волтере, статус цих територій був невизначеним десятиліттями. У світі, де тиранія чекає на нашу слабкість, Сполучені Штати повинні захищати не лише свої береги, а й саму основу демократії в Карибах. Ми дали островам стабільність. І саме тому, оцінивши виконану роботу, президент ухвалив остаточне рішення щодо політичного майбутнього Антильських островів."\n\nУ студії повисла важка тиша — мільйони американців приклеїлися до екранів, очікуючи на вердикт.""
 FWI_forpol.9.a: "Інтеграція як території США."
 FWI_forpol.9.b: ""Самовизначення: ми повинні поважати вибір місцевих жителів.""

 FWI_forpol.10.t: "Пісок, море та грозові хмари"
 FWI_forpol.10.desc: "Спека на Площі Перемоги в Пуан-а-Пітрі була нестерпною, але натовп із тисяч людей не демонстрував жодних ознак розходження. Над морем солом'яних капелюхів, робочих сорочок і різнокольорових шарфів гримів голос Ґерті Архімед. Багаторічна лідерка антиамериканського опору била, мов блискавка.\n\n"Вони називають себе щитом демократії!" — голос Ґерті піднявся до крику, одразу потонувши в реві натовпу. "Але кого вони захищають, крім власних гаманців?! Подивіться на Північ! Ісландія — країна, яку янкі вважали своєю кишеньковою базою, — знайшла в собі гордість сказати Вашинґтону "забирайтеся геть"! А окупанти підібгали хвости! Якщо Ісландія могла змусити їх відступити, чому ми й далі терпимо їхній чобіт на своїй шиї?!"\n\nАрхімед ударила по трибуні: "Досить! Ми не дозволимо перетворити наші острови на дешеве казино! Ми не будемо безголосими рабами, як наші брати в Пуерто-Рико, які гнуть спини за копійки! Геть експлуататорів! Геть окупантів!"\n\nНатовп звичайних ґваделупців — докерів, рибалок, дрібних торговців — вибухнув тисячоголосим скандуванням, що межувало з відкритим бунтом. На периферії, у тіні розлогих пальм, об'єкти цих прокльонів мовчки спостерігали за киплячим морем народної люті. Взвод американських "миротворців" у повному спорядженні ліниво спирався на свої джипи, курячи. Вони не втручалися. Поки що. Але ісландський прецедент уже зробив свою справу."
 FWI_forpol.10.a: "Міф про непохитність американського порядку дав тріщину."

 FWI_forpol.11.t: "Провідна рука"
 FWI_forpol.11.desc: "Шурхіт паперів і скрегіт стільців приховували важливість цієї миті. Пол Валентіно відклав свої папки, поправив костюм і подивився на перше засідання перехідного кабінету Сполучених Штатів Антильських островів. Це були люди, які мали вести острови та їхній народ у майбутнє й наглядати за завершальним переходом від американського контролю до незалежної конфедерації. І його обрали, щоб очолити цей процес.\n\nПравда полягала в тому, що народи Ґваделупи та Мартиніки не обирали його. Валентіно був призначений американським комісаром Лемніцером, а Американська цивільна адміністрація продовжувала функціонувати протягом перехідного періоду. Але це все одно було результатом чесного референдуму серед населення островів, і коли почалося засідання кабінету, члени якого представляли свої позиції, пропонували пропозиції й навіть сперечалися, Валентіно не міг не відчути величезної гордості, ставши першим корінним жителем Сполучених Штатів Антильських островів, який головував на засіданні уряду. Вони це зробили, без американців-\n\nОбговорення прав на риболовлю між двома арондисманами Ґваделупи перервалося, коли відчинилися двері до зали кабінету. Усередину увійшов Лайман Лемніцер, американський комісар, у супроводі ще трьох членів Американської цивільної адміністрації. Обговорення миттєво завмерло, а Валентіно з побоюванням подивився на непроханих гостей. Напевно, подумав він, щось не так. Можливо, надворі хаотичний протест, і засідання потрібно перервати. Але Лемніцер просто пройшов на інший бік кімнати, підняв порожній стілець і тихо сів. Валентіно спробував повернутися до теми, але міністри дивилися на Лемніцера, а не на нього. Обговорення могло продовжитися лише після того, як Лемніцер, відкинувшись на спинку стільця, усміхнувся і сказав:"
 FWI_forpol.11.a: ""Будь ласка, продовжуйте з того місця, де ми вас перервали. Уявіть, що мене тут немає.""
 FWI_referendum_lost: "§RРеферендум завершено, і вплив США на Антильських островах знову не має собі рівних.§!"

 FWI_forpol.12.t: "Невиправдана вдячність"
 FWI_forpol.12.desc: "Зала засідань установчих зборів Антильських островів була освітлена променями заходу сонця, що осявали натовп високоповажних гостей, запрошених на церемонію незалежності Антильської Конфедерації. Голова Американської цивільної адміністрації, що залишав посаду, Лайман Лемніцер, був головною зіркою заходу, потискаючи руки ґваделупським і мартинікським достойникам та стоячи біля воріт, щоб привітати державного секретаря США й обговорити з ним розвиток Антильських островів.\n\nКоли сонце опустилося над Карибами, двері до зали засідань відчинилися, і члени нового уряду Антильської Конфедерації вийшли на ґанок на чолі з новопризначеним прем'єр-міністром Полом Валентіно. Присутні поволі стихли, після чого новопризначений головний суддя Конфедерації провів церемонію складання присяги.\n\nУрочисто присягнувши перед Богом і присутніми сумлінно виконувати обов'язки прем'єр-міністра та зберігати, захищати й обороняти конституцію та закони Конфедерації, головний суддя поклав на плечі Валентіно стрічку нової посади. Зазвичай суворий чоловік широко усміхнувся, коли Лемніцер підійшов потиснути йому руку, а в нічному небі почали вибухати феєрверки.\n\nПісля завершення церемонії, коли повітря знову наповнилося розмовами чоловіків і жінок, Валентіно підійшов до державного секретаря. "Я хотів подякувати вам за те, що ви прийшли сюди, сер. Для мене честь бачити вас тут, так само як я вдячний Сполученим Штатам за допомогу в забезпеченні самовизначення нашого народу. Я знаю, наскільки важко відповідати за зовнішні відносини такої держави, як Сполучені Штати, і наскільки це невдячна справа. Але тут ви вчинили правильно.""
 FWI_forpol.12.a: "Принаймні цього разу."

 FWI_forpol.13.t: "Час братися до роботи"
 FWI_forpol.13.desc: "Народ нової Антильської держави висловив свою волю. Вулиці Фор-де-Франса та Бас-Тера були вкриті блакитними прапорами й конфеті, оскільки її народ святкував новину про те, що правоцентристський блок за ПУҐ Раймона Ґійо здобув більшість.\n\nПовернувшись до штаб-квартири ПУҐ, де вирувало святкування, Ґійо тихо насолоджувався перемогою своєї партії, запиваючи її щедрою порцією тростинного алкоголю. Він відчував глибоке задоволення, знаючи, що божевільних комуністів Ґерті та безхребетних політиків істеблішменту Валентіно було повалено. Та він знав, що загрози майбутньому Антильської Конфедерації все ще не переможені. Усвідомлення їхньої повної поразки через трансформацію адміністрації Антильських островів мало стати кульмінацією порядку денного його уряду.\n\nОдин із людей Ґійо зміг протиснутися крізь інших членів партії, які святкували, і передав папку. "Ось звіт, який ви просили, пане прем'єр-міністре". Ґійо мовчки відкрив його й почав побіжно переглядати зміст звіту. Документи всередині підсумовували плани ПУҐ щодо зміцнення Конфедерації шляхом розширення повноважень виконавчої гілки влади, кінцевою метою чого були централізація країни та її подальше перетворення на президентську республіку. Сильні лідери регіону загрожували його країні, і єдиним способом урятувати її було самому стати одним із них.\n\nЗнову той самий помічник пробирався крізь натовп. "Пане прем'єр-міністре, американський посол на телефоні! Він хоче привітати вас із нашою перемогою". Ґійо усвідомив, що вже майже чверть години бездумно дивиться на останню сторінку звіту. Він усміхнувся, швидко похитав головою ліворуч і праворуч, а потім зробив ковток тростинного алкоголю."
 FWI_forpol.13.a: ""Скажіть йому, що я зайнятий!""

 FWI_forpol.14.t: "Мсьє Президент"
 FWI_forpol.14.desc: ""Ще один день, ще одна перемога", — хихикнув про себе Ґійо. На першій шпальті газети в його руках було написано: "НОВУ КОНСТИТУЦІЮ РАТИФІКОВАНО: ҐІЙО ОБРАНО ПРЕЗИДЕНТОМ". Багато хто сумнівався, що цей день коли-небудь настане, але, з іншого боку, ще менше людей думали, що коаліція Ґійо взагалі прийде до влади.\n\nЛіві називали б його диктатором, а ліберали заламували б руки через "повзучий авторитаризм"; зрештою, антильський народ, єдина група, що мала значення, проголосував на користь уряду ПУГ. Островам було потрібне сильне й рішуче керівництво, якщо вони мали дати відсіч акулам, що їх оточували, та прокласти шлях до багатообіцяючого майбутнього, і саме цього мали досягти реформи Ґійо. Поєднавши ідеали Третьої республіки з виконавчою владою американського зразка, президентська система Антильської конфедерації мала поєднати найкраще з обох світів.\n\nОднією з головних цілей посилення виконавчої влади через нову конституцію було подолання перешкод, створених парламентом, особливо тих, що стосувалися нових інвестицій. Ґійо знав, що для процвітання його країни вкрай важливо забезпечити потік капіталу та передачу знань на острови, і він знав, як саме цього досягти. Ґійо провів пальцями по своєму дисковому телефону й зателефонував своєму міністру фінансів.\n\n"Bonjour Monsieur le Président, comment ça va?"" 
 FWI_forpol.14.a: "Настав час відкритися для французьких вигнанців..."

 FWI_forpol.15.t: "Великі будинки на маленьких островах"
 FWI_forpol.15.desc: "Скільки Жан себе пам'ятав, великий будинок завжди був там. Його двосхилий дах затишно височів над білими стінами, а біля ніг красувалися елегантні клумби. Вікна теж були чудовими, але можна було помітити лише вмикання та вимикання світла, аби не отримати удар кийком по спині.\n\nЙого батько теж пам'ятав цей самий краєвид, як і його батько, і його батько, і його власний батько, коли його зняли з корабля та звільнили від кайданів. Для Жана змінилося лише те, що кайдани стали трохи довшими, трохи вільнішими, а будинок отримав новий шар білої фарби. У цьому сенсі він був на передовому краї лібералізації в Антильських островах.\n\nЗвісно, ніхто нічого йому не розповідав: він був ніким, він навіть не міг голосувати — його бюлетень ішов просто до великого будинку. Та він чув шепіт, те, що люди розповідали одне одному. Він чув французькі голоси, які натякали на те, чия черга керувати, згадуючи ті самі кілька сімей, що правили островами. Нещодавно він чув американські голоси, які розпоряджалися людьми, наче товарами.\n\nАмерика, та сама нація, що боролася з фашизмом за кордоном, той самий лідер вільного світу. Жан не знав, що таке бути вільним, лише знав, що він не був вільним, як і ніхто з тих, хто був йому близький. Можливо, якби тут почалася війна, Америка прийшла б. І що б вона зробила? Він ніколи не заходив так далеко у своїх думках, не бажаючи про це думати, не бажаючи думати, що вони просто вдарять кийком і по його спині.\n\nТож він подивився на той великий будинок — такий великий, що його було видно з Вашинґтона, — і повернувся до роботи на них. Можливо, для його сина все буде інакше. Напевно, ні."
 FWI_forpol.15.a: "Великі держави, великі будинки й маленькі люди між ними."

 FWI_forpol.16.t: "Острівна партія"
 FWI_forpol.16.desc: "RESTRICTED/[GetDateText]\n\nВІД ТЕОДОРА ШЕКЛІ\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\n1. Після перемоги Республіканської партії на виборах в Антильських островах минулого року наші інформатори в Ґваделупі та Мартиніці повідомляють про зміну діяльності партії. РП здобула президентство законним шляхом і зберігає багатопартійну систему, яка формувала Антильську конфедерацію від часу її незалежності. Однак програма партії, схоже, спрямована на закріплення постійного контролю над виконавчою та законодавчою владою через популістські економічні заходи.\n\n2. Є докази масштабної корупції в уряді РП, спрямованої на те, щоб утримувати партію при владі в довгостроковій перспективі. Плантатори отримують синекури та подачки в обмін на підтримку, а по всіх островах Республіканська партія створює місцеві політичні машини, щоб партія стала міцною, єдиною силою на майбутніх виборах.\n\n3. Попри це, уряд РП в Антильських островах прагне підтримувати дружні відносини зі США, не зачіпаючи значною мірою пов'язані з ОВН конгломерати та інвестиції й зберігаючи свої зобов'язання щодо безпеки в Карибському регіоні як доказ доброї волі щодо Вашинґтона.\n\n4. Хоча РП наразі кидає виклик демократичним підвалинам Ґваделупи та Мартиніки, партія все ще далека від того, щоб бути загрозою стабільності регіону чи інтересам США."
 FWI_forpol.16.a: "Вірність, хоробрість, чесність."

 FWI_forpol.17.t: "Новий день в Американських Антильських островах"
 FWI_forpol.17.desc: "Морський бриз проникав крізь найближче вікно, поки він слухав Валентино телефоном: "Дякую, Лаймане."\n\n"Ви вже помітили, що мене неважко прочитати, чи не так?" — сказав колишній комісар Лемніцер своєму наступнику. "Це найменше, що я міг зробити. Вода під мостом."\n\nЛемніцер відчув, як Пол Валентино підняв брову на іншому кінці лінії: "Мабуть, міст великий, якщо знати, де ти живеш."\n\n"Я б не став виключати, що янкі спробують його побудувати". Лемніцер потер підборіддя. "Завжди з їхніми грандіозними мріями."\n\n"Я був би не проти. Американці люблять хороші громадські роботи". Валентино мав би це знати; його допомога з планом Конфедерації творила дива для Мартиніки та Ґваделупи.\n\nЛемніцер кліпнув: "Соціалістична партія має намір продовжити партнерство?"\n\n"І з референдумом також, вони не виключають одне одного". Валентино та СП ставали провідною партією. Опозиція по всіх островах гуртувалася навколо них.\n\nЗдавалося, союзник Вашинґтона в Антильських островах мав стати чимось більшим: "А військова присутність США?""
 FWI_forpol.17.a: ""Ви бачили зображення Колумбії", — відповів Валентино. "Хто б вони не були, вони наші захисники.""

 FWI_forpol.18.t: "Нью-Дилізм в Антильських островах"
 FWI_forpol.18.desc: "Пол Валентино дивився з балкона свого заміського будинку на піщані береги Ґваделупи. Останні кілька місяців він працював без упину, і настав час трохи відпочити та насолодитися красою пляжів острова. Сонце сяяло, приплив був спокійним, птахи співали, а реформи його адміністрації починали приносити плоди. Профспілки, наділені повноваженнями, та посилене трудове законодавство покращили б добробут і почуття власної гідності антильських робітників. Масштабні програми громадських робіт залучали людей Антильської конфедерації до будівництва курортної та рекреаційної інфраструктури, яка мала привести іноземних туристів із їхніх нудних, сірих країн, а їхні гроші — до кишень нації. Програми доступного житла гарантували, що колишні нетрі перетворяться на справжні райони, мешканці яких пишатимуться своїм місцем проживання. Так, справи йшли добре, і вони мали стати ще кращими. Водночас Валентино краще за будь-кого розумів, що ці амбітні ініціативи здійснювалися за рахунок таких самих величезних позик від американців, і цей борг буде нелегко виплатити. Його Антильські острови ще кілька років тому перебували під адміністрацією США, і знайти фінансування для проєктів, необхідних для розвитку країни, було не так просто. Усе це важко його обтяжувало. Безумовно, Антильська конфедерація мала бути суверенною, але ті, хто відповідав за острови, мусили бути прагматичними. Саме цього такі радикали, як Аршимед і Сезер, ніколи не могли зрозуміти. А втім, забудь, подумав про себе Валентино. Він знав, що робить правильне для своєї країни. Прем'єр-міністр затягнувся сигарою, зробив ковток напою і зітхнув із глибоким задоволенням."
 FWI_forpol.18.a: "Усе складеться просто чудово..."

 FWI_forpol.19.t: "Червоні острови"
 FWI_forpol.19.desc: "Відкриті вулиці Фор-де-Франса були прикрашені червоним. Біля виборчих дільниць, навколо барів і складів та навколо урядових будівель маси Вест-Індії піднімали майоріючий багряний колір миру, незалежності та соціалізму.\n\nНовобрана прем'єр-міністерка Ґерті Аршимед звернулася до народу з яскраво-червоною стрічкою на гордих грудях, а її голос лунав над вигуками, гуркотом каструль і сковорідок та гудками автомобілів.\n\n"Від цього дня й назавжди ми не зважатимемо ні на батіг рабовласника, ні на примхи ринку", — сказала вона, і її сяюча усмішка здавалася майже здивованою від потужного хору оплесків. "Відсьогодні Антильські острови належать їхньому народові!"\n\nОстрови весь тиждень перебували б у шаленому русі, охоплені тисячами кроків народного фронту — від комуністичної партії до прогресистів, — що крокували під гаслами деколонізації та розвитку. Гучні, напружені вигуки про рівність стрясали мармурові та дерев'яні підвалини плантацій, звідки лідери опозиції закликали до опору та відмови від співпраці.\n\nКонсул США закрив жалюзі свого офісу, досхочу надивившись на старий вуличний знак надворі, який викинули й замінили на "вулицю «Антиімперіалізму»". Вибори ще навіть не були оголошені, а вони вже були тут.\n\nАмериканські експати спостерігали з бетонних стін посольства, де все ще могли стояти вище за народ. Маси побачили це й запитали одне одного, поволі випростовуючись: "Скільки ще?""
 FWI_forpol.19.a: "Цього разу вони могли відповісти: "Недовго, товаришу. Зовсім недовго.""

 FWI_forpol.20.t: "Пофарбувати в червоне"
 FWI_forpol.20.desc: "КОНФІДЕНЦІЙНО/[?global.date.GetDateStringNoHourLong]\n\nВІД ДИРЕКТОРА FBI ДЖ. ЕДҐАРА ГУВЕРА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА СПОЛУЧЕНИХ ШТАТІВ\n\nТЕМА: НЕЩОДАВНІ ЗАВОРУШЕННЯ В АНТИЛЬСЬКІЙ КОНФЕДЕРАЦІЇ\n\n1. Попри запеклу опозицію, панлівий уряд на чолі з адвокаткою-комуністкою Ґерті Аршимед досяг ранніх успіхів у реалізації запланованої політики. Віддана рішучій антиколоніалістській платформі, непокірна адміністрація відкрито вороже ставиться до будь-якого елемента впливу США, який вона вважає таким, що розірвала всі зв'язки з ОВН, яку вони розглядають як чергове продовження американського імперіалізму.\n\n2. Попри високу популярність на острові Мартиніка, значно чисельніше населення Ґваделупи залишається більш скептичним щодо підтримки реформ. Зокрема, позбавлені власності землевласники колишньої плантократії продемонстрували очікувану ворожість до нового режиму, причому деякі з них таємно витрачають решту своїх статків на підтримку диверсійних дій по всій конфедерації.\n\n3. Зростання нестабільності призвело до спроби путчу проти влади в Ґваделупі, що спричинило формування нового тимчасового уряду різними опозиційними партіями. Острів залишається місцем частих сутичок між соціалістичними ополченнями та найманцями, яких підтримує плантократія. Очікується, що протягом наступних кількох місяців до Ґваделупи буде направлено сили вторгнення, щоб придушити повстання, перш ніж воно отримає шанс закріпити свої позиції.\n\n4. Ця ситуація дає нам унікальну можливість. Якщо ми діятимемо швидко, взвод сил США може бути направлений до Мартиніки, щоб усунути уряд Аршимед під приводом відновлення порядку, гарантуючи повернення конфедерації до нашої сфери впливу."
 FWI_forpol.20.a: "Вірність, хоробрість, чесність."

 FWI_forpol.22.t: "Де серце"
 FWI_forpol.22.desc: "Крізь вікно автомобіля Люсетт Мішо-Шеврі мовчки спостерігала за переповненими вулицями, крізь які автомобіль насилу прокладав собі шлях. Навколо неї барвисті провулки Пуент-а-Пітра були вщерть заповнені вигуками та піснями комуністичних партійців та інших підлабузників кліки Аршимед.\n\nЇї охоронці запевнили її, що крізь затемнене скло абсолютно неможливо щось побачити ззовні; та все ж вона не могла позбутися страху, що будь-хто з них у будь-яку мить може подивитися просто на неї. Вона не могла викинути з голови повідомлення про долю інших членів партії, яким не пощастило потрапити в полон під час втечі.\n\nТа через переповнену людьми дорогу й паради вони майже не рухалися протягом останньої години, залишивши їй лише можливість дивитися на місто, яке бенкетувало на руїнах її уряду. Тож вона не відводила погляду від зовнішнього світу, час від часу поглядаючи на веселу групу підлітків, що зібралася навколо поспіхом намальованого гротескного зображення Дядька Сема на найближчій стіні, з його головою, що стирчала з отвору бутафорської гільйотини.\n\nУсе своє життя, усе, що вона робила, вона робила для свого дому. Для Ґваделупи та Антильських островів. Це було єдине незмінне, що визначало всю її кар'єру, навіть під час того невдалого путчу. Вона ненавиділа американців не менше за будь-кого з них; та саме їй довелося проковтнути свою гордість і прагматично спробувати підтримувати тривале партнерство з ними. Гарантувати їхню допомогу та інвестиції, які допомогли б конфедерації процвітати. Мрія, що руйнувалася просто на її очах.\n\nКоли затор нарешті почав розсмоктуватися, автомобіль знову рушив. Та вона не могла відвести погляду від іншого графіті на узбіччі. Її власне обличчя, під яким яскраво-багряним кольором було вирізане одне слово. Слово, яке продовжувало з'являтися в її голові ще довго після того, як вони поїхали."
 FWI_forpol.22.a: "'ЗРАДНИЦЯ'"

 FWI_forpol.21.t: "Правильний вчинок"
 FWI_forpol.21.desc: "Ледве досягнувши 30 років, Люсетт Мішо-Шеврі пробилася до ради свого маленького містечка Сен-Клод, ставши наймолодшою жінкою, коли-небудь обраною на цю посаду. Протягом наступного десятиліття так звана Залізна леді Ґваделупи стала відомою на політичній сцені островів, що формувалася, своєю природною харизмою, безжальними навичками ведення переговорів та непохитною рішучістю у боротьбі за свій дім, доки її стрімке сходження не привело її до лав РП Альбрана.\n\nКоли конфедерацію нарешті ратифікували рік тому, мрія втілилася: її давня надія одного дня побачити Антильські острови рівноправним партнером вільних держав Заходу була зовсім поруч. І тут головорізи Аршимед ледь не забрали все це.\n\nНа вулиці внизу пара усміхнених морських піхотинців США штовхала чоловіка в кайданках до задньої частини найближчого джипа, де мовчки сиділи ще півдюжини побитих партизанів у червоних шарфах. Коли чоловік відмовився сідати в автомобіль, плюнувши в обличчя одному зі своїх викрадачів, вона щосили намагалася ігнорувати дивне відчуття в животі, коли його образи перетворилися на відчайдушні благання, а сам він звивався на брукованій землі під ударами солдатів. Вона відвела погляд, струшуючи з себе зростаюче почуття провини. Вона зробила те, що було необхідно.\n\nНатомість вона спостерігала, як останні червоні прапори, що прикрашали вулиці, поволі знімають, щоб знову замінити їх майоріючою зіркою прапора конфедерації. А поруч із ним так само яскраво майорів прапор ОВН, із його обіцянкою відновлених економічних інвестицій та можливостей, які нарешті дозволили б конфедерації процвітати, тоді як на землі лежали купи покинутого багряного стяга тих, хто гордо виступив проти цього процвітаючого майбутнього.\n\nТак. Попри сумніви, що не полишали її, вона знаходила певну втіху в усвідомленні того, що зрештою це все ж була перемога її народу."
 FWI_forpol.21.a: "...То чому ж це не відчувалося так?"

 FWI_forpol.24.t: "Рука, що веде"
 FWI_forpol.24.desc: "Будівлю, де колись розташовувалася штаб-квартира Американської цивільної адміністрації Американських Антильських островів, перетворили на поле бою; хоча, можливо, трохи іншого типу, ніж те, що вирувало в колишній Французькій Вест-Індії протягом останніх трьох років. Замість спорядження для придушення заворушень і коктейлів Жданова битви тут велися солодкими словами, порожніми обіцянками, фальшивими посмішками та міцними рукостисканнями.\n\nТа ставки залишалися тими самими.\n\nПитання автономії перейшло від дебатів на вулицях до стін цієї імпровізованої зали, поверхом нижче кабінету верховного комісара, де делегати від рад Ґваделупи та Мартиніки обговорювали умови своєї майбутньої незалежності.\n\nОстровам мали надати самоврядування, це вже було ратифіковано; невирішеним залишалося питання фактичного обсягу цього самоврядування. І, як завжди, жодна розмова не відбувалася поза пильним оком Дядька Сема.\n\nЦе була дивна гра. Щоразу, коли ради вели переговори між собою, охочі представники з Вашинґтона знаходили спосіб втрутитися в розмову. Щоразу, коли їх просили про свободу дій щодо американського контролю над процесом незалежності, вони відповідали сумною, але співчутливою посмішкою, нагадуючи їм про кумедні юридичні терміни, які, цілком зрозуміло, робили їхнє прохання набагато складнішим, ніж воно здавалося.\n\nЗрештою делегати поверталися додому з головою, набитою новою юридичною плутаниною, про яку вони ніколи раніше не чули, і без відчуття, що їм вдалося просунутися до своєї мети."
 FWI_forpol.24.a: "Ваша свобода, наші умови."
 FWI_forpol.24.b: "Перший крок, і точно не останній."
 FWI_forpol.24.c: "Жаринка Франції, знову запалена так далеко від дому."

 FWI_forpol.25.t: "Повернення додому"
 FWI_forpol.25.desc: "Коли генерал Лемніцер востаннє був у Вашинґтоні, він намагався умовити половину Конґресу погодитися на план, у який сам вірив лише наполовину. Місяці планування та підготовки, збирання цифр, заповнення паперів і повторення ретельно відшліфованих слів перед дзеркалом у готельному номері, щоб його аргументи були такими ж бездоганними, як і його посмішка. Сьогодні все було інакше; усе, що йому залишалося, — слухати.\n\nЙого робота була завершена одразу після того, як кілька хвилин тому він потиснув руку президенту перед камерами. Тепер він міг просто відкинутися назад і розслабитися, сьорбаючи вправно вихоплений келих святкового шампанського, поки президент завершував вступну промову.\nПісля ще кількох жартів про початок нової ери в американсько-антильських відносинах, які майже повністю біла аудиторія зустріла громовими оплесками, мікрофон передали новопризначеним лідерам Віктору Сабле та Медару Альбрану.\n\nАле не йому, звісно. Йому не надали честі сказати бодай слово протягом усієї церемонії. Та й не те щоб йому було що сказати. Його багаторічні зусилля в регіоні були варті лише кількох побіжних похвал раніше, причому, звісно, без згадки про майже катастрофічну громадянську війну, якої вдалося уникнути в останню мить. Ось і весь його ступінь важливості — і тут, і там: бути незграбним чоловіком посередині.\n\nВін щойно почав помічати, що майже не торкався свого келиха протягом останніх кількох хвилин. Та й слухав він, чесно кажучи, небагато. Нові слова про заплановані програми економічного відновлення для тепер автономних Антильських островів і пропозиції американських інвестицій просто промайнули повз нього суцільною плямою, поки він продовжував усміхатися. Ось і все. Кульмінацією його кар'єри була служба у програній війні на пагорбах Британії, а фінальним акордом — нездатність утримати крихітну пару островів, які йому доручили контролювати, щоб позбутися його. Йому наближалося 68; він більше ніколи не побачить бойових дій. Він тихо піде у відставку до кінця року, або його змусять це зробити."
 FWI_forpol.25.a: "І це все, чим його коли-небудь запам'ятають."

 FWI_forpol.26.t: "Відкриваються нові двері"
 FWI_forpol.26.desc: "Вулиці Ґваделупи та Мартиніки ніколи за всю свою історію не були такими сповненими радості, як [?global.date.GetDateStringNoHourLong].\n\nФеєрверки почали запускати в ту ж мить, коли останні американські човни вирушили в ранні години ранку. Майже пів тижня два острови були охоплені хвилею святкувань; пили напої, проводили паради й проливали сльози. Вперше за століття жодна іноземна держава не диктувала їм, як жити — ні французька, ні американська. Два острови нарешті отримали свободу обирати власну долю, незалежно один від одного.\n\nЗвісно, не лише уродженці островів святкували новонабуту незалежність. Коли американські чоботи нарешті забралися з островів, їх швидко почали замінювати нові елегантні черевики. По всьому світу люди помічали ще одну потенційну щілину в броні Дядька Сема.\n\nМісцеві мережі впливу невдовзі почали б змінюватися. Коли галасливі, владні американці почали залишати острови, їхній вакуум влади невдовзі почали б заповнювати люди з Мадрида або Мехіко, пропонуючи дружбу та солідарність. Ситуація на островах була повністю відкрита — залишалося лише питання, хто втрутиться, щоб скористатися цим."
 FWI_forpol.26.a: "По одному доміно за раз."

 FWI_forpol.27.t: "Гірке минуле"
 FWI_forpol.27.desc: "Пальці Альфонса Дюпре давно стерлися до крові від роботи зі стеблами цукрової тростини. Солодкий пил чіплявся до його шкіри, наче сочився з його крові. У кутку складу потріскувало побите короткохвильове радіо, передаючи результати виборів із Бас-Тера. Альфонс слухав підрахунок голосів під час роботи, марно сподіваючись на якийсь знак змін. Його настрій падав у міру того, як радіо гуділо хвилина за хвилиною. Коаліція Медара Альбрана переконливо перемагала на виборах — ознака того, що справи в Ґваделупі залишатимуться в багнюці ще щонайменше три роки. Ті самі імена, старі династії беків, злітали з язика диктора, відлунюючи бідне дитинство діда й прадіда Альфонса. Це був очевидний результат. Саме той, якого очікували всі, хто раніше дозволив надії обдурити себе. Та Альфонс усе одно не міг не згорбитися над своїм прилавком, опустивши пальці від преса.\n\nМадлен, одна з небагатьох друзів Альфонса, примостилася на ящику з патокою й видихнула дим у важке повітря. "Ось і все. Вони ніколи не опустять своїх батогів. Вони замордують до смерті нас і наших дітей. Американці сп'яніють до смерті". Забруднена жінка сердито розсміялася.\n\nЗа стінами складу гавань мерехтіла під приглушеними лампами, поки вантажні судна чекали, щоб повезти свій вантаж на північ, до голодних американських ротів. Десь представник іберійської торгівлі вже почав складати черговий контракт. У Вашинґтоні клерк поставив ще одну галочку біля пункту "ЛАНЦЮГ ПОСТАВОК СТАБІЛЬНИЙ". Острів Ґваделупа повернувся до знайомого порядку: збирай, транспортуй, підкоряйся.\n\nСлухаючи, як новий президент монотонно розповідає про оновлений парламент, який має вести острів у нову еру, Мадлен грубо загасила сигарету й поглянула в темряву за подряпаним вікном. "Ти коли-небудь думаєш, що це зміниться?" Надворі Альфонс чув, як ряди цукрової тростини шелестіли в теплому нічному бризі."
 FWI_forpol.27.a: "Коли радіо замовкло з потріскуванням, жінка чекала на відповідь, яка ніколи не пролунає."

 FWI_forpol.28.t: "Смак змін"
 FWI_forpol.28.desc: "Вулиці Бас-Тера гули під палючим карибським сонцем, коли радіоприймачі оголошували неймовірну новину. Попри всі прогнози, укорінена коаліція Альбрана зазнала поразки на останніх виборах. На її місце вийшов палкий популістський лідер Раймон Ґійо, який посів перше місце, тріумфально перемігши на виборах завдяки своїй спокусливій пропозиції змін для зневіреного населення. Його програма, яку він представив у серії палких промов по всьому острову, обіцяла національні реформи та кінець корупції, розбудову держави й зменшення іноземного контролю. На вулицях натовпи, що зібралися на центральному ринку столиці, починали стихійні святкування, а прихильники швидко перевищили чисельність обмежених сил поліції.\n\nУ переповненому передвиборчому штабі Раймон Ґійо схилився над своїм столом, блаженно не усвідомлюючи хаосу, який його перемога спричиняла назовні. Піт капав на карти занедбаних доріг і портів острова. Зібравши рішучість, чоловік підійшов до пошарпаного мікрофона в кімнаті й подав помічникові знак почати трансляцію. Настав час звернутися до голодної нації.\n\n"Народе Ґваделупи, ми почули ваш голос!" — гримів Раймон у радіо, звертаючись до нього так, наче перед ним був ревучий натовп із сотень людей. "Я обіцяю вам це: ці вибори — не порожня обіцянка! Більше ніякого того самого. Настав час народу цього острова володіти землею, на якій ми працюємо. Настав час будувати нашу націю, а не розбирати її на частини для продажу за кордон. Народе мій, тепер час для надії. Наша подорож лише почалася". Навколо нього його помічники обмінялися нервовими поглядами, побоюючись, що успіх, схоже, не приборкав радикалізм чоловіка. Та попри майбутню американську реакцію кімнату наповнило відчуття надії.\n\nНадворі у відповідь на трансляцію серед натовпу столиці здійнявся галас. Люди почали скандувати ім'я Ґійо, шалено тиснучись на ринкові ятки.\n\nЗа морем атмосфера була похмурою. Іберійські та мексиканські дипломати писали напружені телеграми, обговорюючи розвиток подій. У Вашинґтоні клерк підкреслив червоним чорнилом одну фразу: "потенційно ворожий керівник". Острів почав змінюватися."
 FWI_forpol.28.a: "Спітнілі вимагають свого цукру."

 FWI_forpol.29.t: "Зав’язуючи вузли"
 FWI_forpol.29.desc: "Велич центральної зали асамблеї Організації Вільних Націй у Нью-Йорку порушувало лише відлуння кроків, коли президент Альбран і його делегація наближалися до оздобленого помосту під поглядами сотень людей. Прапор Ґваделупи, поспіхом пошитий і ще жорсткий, висів поруч із зоряно-смугастим прапором та мерехтливим синім стягом ОВН, що панував над стіною та стелею в задній частині зали.\n\nКомісар ОВН виступив уперед, простягаючи руку президенту. "Цього дня Організація Вільних Націй офіційно вітає Ґваделупу у своєму альянсі. Нехай наше партнерство допоможе захистити свободу й процвітання у світі."\n\nНарешті відпустивши руку, сивий колишній президент виступив уперед і звернувся до асамблеї. "Шановні представники ОВН, Ґваделупа висловлює щиру подяку всім, хто надав допомогу нашій новій нації та надіслав привітання після наших нещодавніх виборів. Ми прагнемо зміцнювати наші зв’язки з усіма вільними націями світу. Попри наш невеликий розмір, я твердо сподіваюся, що незабаром ви всі побачите в Ґваделупі рівних вам у боротьбі за свободу."\n\nПозаду молодший делегат зі Сполучених Штатів пробурмотів чоловікові поруч із ним. "Рівних?"\n\nТонка посмішка була відповіддю. "Достатньо рівних, щоб кораблі продовжували ходити. Ось що має значення."\n\nПідписи були поставлені, камери спалахнули, а стримані оплески пролунали від більшості присутніх у залі. За високими вікнами легкий дощ залишав сріблясті смуги на тлі міського горизонту. Найновіший карибський партнер ОВН щойно посів своє місце в бастіоні."
 FWI_forpol.29.a: "Війни виграють маленькими перемогами."

 FWI_forpol.30.t: "Друзі лише за гарної погоди"
 FWI_forpol.30.desc: ""То... ми справді це робимо?" У коридорі панувала незручна напруга. Чемно чекаючи перед столом, на якому лежала угода, представник Сполучених Мексиканських Штатів нервово переминався з ноги на ногу, поки вони обоє вийшли назовні, щоб ще трохи все обміркувати.\n\n"Ще раз: тимчасове партнерство. Нічого більше. Народжене зі спільних інтересів і спільних ворогів", — відмахнулася вона рукою. Насправді Ґерті Аршимед почувалася так само невпевнено, як і її міністр закордонних справ. Так, це був дивний вибір партнера і безумовно далекий від їхньої власної платформи революційного антиколоніалізму; але мексиканці залишалися на одному боці з ними у прагненні підірвати американську сферу впливу. Та жоден із них не міг позбутися відчуття, що вони ось-ось замінять одного господаря іншим.\n\n"Хлопці в це не повірять, і ти це чудово знаєш", — підсумував він, перш ніж знову увійти до кімнати. "Я... просто сподіваюся, що ти робиш правильний вибір". Хоча минуло лише кілька місяців, здавалося, що ціла вічність минула відтоді, як вони відірвали розколотих лівих від потопаючого корабля Валентино. Союз із реформістськими боягузами СП уже здавався невеликою зрадою; і вона теж боялася, що вони вже готують другу.\n\nТа хоч би як голосно вони святкували після того, як коаліція на чолі з їхньою власною партією перемогла на торішніх виборах, і хоч би як високо тепер майоріли маково-червоні прапори вздовж вулиць Бас-Тера, кидаючи багряний виклик американській гегемонії; правда полягала в тому, що Ґваделупа була маленькою. І самотньою. Їм були потрібні союзники; а все було краще за янкі, чи не так?\n\n"Я теж на це сподіваюся", — ось що вона хотіла б відповісти, перш ніж перо закінчило виводити чорнило на папері, викликавши задоволену посмішку мексиканського посланця, який підвівся потиснути їм руки."
 FWI_forpol.30.a: "Ласкаво просимо до Веракруського пакту."

 FWI_forpol.31.t: "Буря"
 FWI_forpol.31.desc: "Подібно до вулиць Фор-де-Франса, над якими щойно встановлені червоні прапори майоріли над співучими натовпами, штаб-квартира Прогресивної партії Мартиніки вирувала гучними вигуками та піснями після того, як результати виборів поступово ставали відомими.\n\nНа столі Еме Сезера лежала газета, заголовок якої підтверджував переконливу перемогу соціалістичної коаліції. І не просто вивів її на чолі новоствореного суверенного острова — вона зробила це так, що закріпила за собою певну більшість у законодавчій раді Мартиніки, знищивши будь-яку надію ліберального блоку Сабле та інших опозиційних груп, підтримуваних США, заблокувати майбутні радикальні реформи.\n\nТа помітною відсутньою постаттю на цих святкуваннях був сам чоловік. Попри всі зусилля його однопартійців, він залишався у своїй кімнаті, занурений у думки, не бажаючи брати участь у святкуваннях або навіть поділяти їхній ентузіазм щодо їхнього нищівного успіху. Насправді йому було важко взагалі вважати це перемогою.\n\nПеремога прийде, коли народ Мартиніки нарешті звільниться від будь-яких слідів американського впливу, а за ним — решта їхніх товаришів, розкиданих по Антильських островах та Вест-Індії. І це було ще не все; перемога прийде, коли чорна свідомість нарешті пустить коріння серед усієї африканської діаспори. І не лише серед них; коли кожна людина, яка нині страждає під колоніальним ярмом по всьому світу, буде звільнена від своїх кайданів. Коли вкрадене в них майбутнє буде повернуте, вчепившись у горла їхніх господарів.\n\nНі, це зовсім не була перемога; принаймні поки що. Щоб їхній маленький дім, Мартиніка, став сяючим червоним маяком проти імперіалізму, їм доведеться ще почекати. Поводитися чемно з янкі. Дарувати їм красиві посмішки та потискати руки, ховаючи кинджали за спиною. Тож поки що все, що він міг зробити, — це чекати свого часу..."
 FWI_forpol.31.a: "...і сподіватися, що це лише затишшя перед бурею."

 FWI_forpol.32.t: "Звернення до друзів"
 FWI_forpol.32.desc: "По всій Мартиніці тисячі людей тулилися навколо радіоприймачів і поодиноких телевізорів. За описом коментатора чи прямою трансляцією всі стежили за одним і тим самим місцем — воротами готелю префектури Мартиніки. Там юрмилися журналісти, що штовхалися, та глядачі, які чекали, намагаючись отримати кращий огляд мікрофона промовця. Ніхто не стежив уважніше за людьми в посольствах: кожен чиновник дивився або слухав, сидячи над стосами оцінок, що мали передбачити майбутнє.\n\nВіктор Сабле. Хто він? Що він собою являє? Хто його друзі?\n\nРадійні журналісти швидко говорили у свої мікрофони, коли Сабле наблизився до воріт, які розчинилися перед ним, а вигуки деяких присутніх підштовхнули його до встановлених мікрофонів. Його веселий настрій був очевидним; він усміхнувся телекамерам і глядачам. "Пані та панове", — почав він, "сьогодні я прийшов розповісти вам про наше майбутнє."\n\n"Я хочу подякувати кожному, хто повірив у Республіканську партію. Я присягаюся вам усім, що Мартиніка не стане маленькою державою, якою керують деспоти, що підкоряються чужим примхам. Моє бачення, яким я хочу поділитися з усіма вами, — це Мартиніка, де всі по-справжньому вільні. Де уряд та економіка працюють пліч-о-пліч, а наші справи відкрито обговорюються через асамблею, а не в якійсь темній закулісній кімнаті. Де всі класи об'єднуються, усвідомлюючи, що незалежно від стану чи статусу, ми всі — Мартиніка." Він зробив паузу, поки навколо нього спалахували камери.\n\n"Моїм друзям, які підтримують мене в цій місії, нашим друзям з ОВН, які допомогли нам дійти так далеко, я кажу: дякую. Тим, хто хоче схилити мене проти інтересів моєї національної родини, я кажу: я виступлю проти вас. Тим, хто довірив мені своє благополуччя, благополуччя своєї родини та благополуччя свого майбутнього, я кажу: я зроблю для вас усе, що зможу.""
 FWI_forpol.32.a: "Цитати забарвили звіти від Вашинґтона до Мадрида, з дуже різними описами"

 FWI_forpol.33.t: "Робінель перемагає на Мартиніці"
 FWI_forpol.33.desc: "Під широким наметом, встановленим у парку Ла-Саван, Тертюльєн Робінель, очільник Соціалістичної федерації Мартиніки, звернувся до моря парасольок під безперервним дощем. "Цивільна адміністрація завершилася. І я пишаюся тим, що ви, народ Мартиніки, обрали мене та СФМ, щоб провести вас через ці перші, критично важливі роки незалежності. Сьогодні ви обрали нове майбутнє для Мартиніки — майбутнє швидких і ґрунтовних реформ. Соціальних, економічних, політичних. Майбутнє, де народ володіє фермами та фабриками, на яких він працює, і де плоди цієї праці належать йому."\n\nКраєм ока він бачив, як посол США совався в першому ряду складних стільців, а поруч із ним сиділи значно задоволеніший мексиканський колега та непроникний іберієць.\n\nАле ця промова була не для них. Він подивився на натовп, на всі ці захоплені обличчя Фор-де-Франса. Від простих робітників, які довірилися його стриманим обіцянкам замість шаленої революції, запропонованої ППМ, до елегантно вдягнених бюрократів і професіоналів, які перейшли від доти панівної Республіканської партії, Робінель шукав слова, які об'єднали б їх усіх.\n\n"За Мартиніку! Нехай її добробут зростає таким же зеленим і відкритим, як Ла-Саван!""
 FWI_forpol.33.a: "На Мартиніці центр політичного спектра — ліворуч."
 
 FWI_forpol.34.t: "Мартиніка приєднується до ОВН"
 FWI_forpol.34.desc: "Тертюльєн Робінель пройшов крізь двері штаб-квартири ОВН, з усмішкою передаючи свій важкий плащ швейцарові. Нью-Йорк... Нью-Йорк був холодним. Холодним для людини з Мартиніки. Уолл-стріт був іще холоднішим для соціаліста, який націоналізував величезні частини економіки острова й обклав податками те, що залишилося в приватних руках, щоб фінансувати свою програму розвитку.\n\nАле тут... усе було теплим. Кожна простягнута до нього рука, здебільшого пухка й біла, зігрівала його холодні чорні пальці. Усмішки та кивки численних дипломатів, які вітали Робінеля з другим терміном і зміцненням демократії Мартиніки.\n\nВін уявляв, що тости на честь його острівної нації будуть із шампанським. Але після всіх років очікування, дзвінків, листів і вмовлянь, аби довести, що Мартиніка справді гідна бути частиною Організації Вільних Націй, Робінель відчув себе достатньо впевнено, навіть уповноваженим, щоб підійти до добре вдягненого працівника будівлі, невимушено усміхнутися й сказати,\n\n"Одне глінтвейну, будь ласка.""
 FWI_forpol.34.a: "Тепло спільноти."
 
 FWI_forpol.35.t: "Нова Французька Вест-Індія"
 FWI_forpol.35.desc: "Уривок із нещодавньої вправи з перекладу в університетському курсі французької мови:\n\n'Своєрідна коаліція франкофілів, лібералів, реакціонерів та землевласників прийшла до влади на Мартиніці під керівництвом ППМ на чолі з Едмоном Вальсеном. Новий уряд почав намагатися перебудувати свій рух у повноцінну партію, хоча при цьому звільнив багатьох державних службовців, що ще більше дестабілізувало його правління. За підтримки Іберії нова Мартиніка є безумовно найдивнішим союзником блоку, оскільки острівна держава номінально є прогресивною та демократичною. Поки що, однак, їй вдалося уникнути краху, і вона сприймає себе як унікальну перлину в короні Карибського басейну. Те, що залишилося від Вільної Франції, виявляє величезний інтерес до острівної держави, і, як повідомляється, вони вже досить давно ведуть переговори. Яким буде майбутнє Мартиніки — можна лише здогадуватися, але за ним безперечно варто стежити.'\n\n'Франція жива, десь принаймні.'"
 FWI_forpol.35.a: "Звідки наш професор отримує новини з Мартиніки?"
 
 FWI_forpol.36.t: "Ланцюг рветься"
 FWI_forpol.36.desc: "Ґійо стояв біля відчинених віконниць старої губернаторської зали, дивлячись на гавань унизу. Захід сонця забарвлював воду золотом, заливаючи яскравим світлом вантажні судна, навантажені цукром і ромом та направлені до Америки. Його голова гуділа після щойно виголошеної промови, у якій він вимагав суверенітету для нації Ґваделупи та офіційно розривав оборонні пакти, що пов'язували острів зі Сполученими Штатами. Після підтвердженої підтримки народу на торішніх виборах і зростання його влади у виконавчій гілці він як ніколи був упевнений, що настав час прокласти для нації новий курс.\n\nСтук у двері. Його міністр закордонних справ прослизнув усередину, його обличчя було напруженим. "Американці лютують. Іберійці..." Він вагався. "Вони зацікавлені. Один із їхніх посланців уже прибув униз. Французи також надіслали телеграму. Схоже, ваша декларація привернула їхню увагу."\n\nҐійо повернувся до вікна, дозволяючи вологому повітрю торкатися задоволення, викарбуваного на його обличчі. "Нехай трохи попотіють. Корисно дозволити нашим колишнім господарям походити туди-сюди". Він налив собі трохи тростинного алкоголю й випив одним ковтком. За кілька хвилин він нарешті повернувся, відчинивши двері на нижній поверх. Настав час пожинати плоди незалежності Ґваделупи."
 FWI_forpol.36.a: "Ґваделупа майорітиме."


 ### FWI News Events
 FWI_news.1.t: "[Get_newspaper_header]Антильська конфедерація проголошує незалежність"
 FWI_news.1.desc: "Сьогодні Мартиніка та Ґваделупа здригаються від червоних парадів, коли новообрана прем'єр-міністерка Ґерті Аршимед оголосила про незалежність Антильської конфедерації. Це знаменує кінець років американської окупації та століть колоніалізму, а також початок нової сторінки у складній історії Вест-Індії.\n\nВашинґтон відреагував стримано, висловивши занепокоєння щодо безпеки американських громадян та політичних опонентів Аршимед на островах. Навколо посольства США відбуваються напружені масові демонстрації, але в міру того, як надходять міжнародні привітання, люди, схоже, більше переймаються святкуванням гасел нового уряду — розвитку, деколонізації та рівності.\n"
 FWI_news.1.a: "Вони нам і не були потрібні."
 FWI_news.1.b: "Нікчемні більшовики."
 FWI_news.1.c: "Солідарність, товариші!"
 FWI_news.1.d: "Невеликий удар по гегемонії США..."

 FWI_news.2.t: "[Get_newspaper_header]Антильська конфедерація проголошує незалежність"
 FWI_news.2.desc: "Сьогодні Мартиніка та Ґваделупа здригаються від парадів, коли новообраний прем'єр-міністр Пол Валентино оголосив про незалежність Антильської конфедерації. Це знаменує кінець років американського управління островами та початок нової сторінки у складній історії Вест-Індії. Уряд Валентино поспішив підтвердити особливі відносини конфедерації зі Сполученими Штатами, оскільки новонезалежні острови продовжують значною мірою покладатися на американців у питаннях оборони.\n\nВашинґтон привітав цю заяву, адже хоча США більше не керуватимуть Антильськими островами безпосередньо, вони можуть бути спокійні, знаючи, що їхній вплив на карибські справи здебільшого залишиться незмінним, але тепер без тягаря відповідальності за управління островами.\n"
 FWI_news.2.a: "Добре для них."
 FWI_news.2.b: "За новий день!"
 FWI_news.2.c: "Нарешті незалежність, але чи це лише ілюзія?"
 FWI_news.2.d: "Байдуже."

 FWI_news.3.t: "[Get_newspaper_header]Антильська конфедерація здобуває незалежність від Сполучених Штатів"
 FWI_news.3.desc: "Президент Антильської конфедерації Пол Валентино оголосив у своїй промові, що острови, які тривалий час перебували під владою Сполучених Штатів, "приєдналися до вільних націй світу". Очільник Республіканської партії (РП) Пол Валентино привів партію до приголомшливої перемоги на островах Мартиніка та Ґваделупа.\n\nПопри те, що Антильська конфедерація все ще міцно пов'язана зі США, вона вже пожинає плоди своєї нової інтеграції у світовий ринок — давньої обіцянки РП. Окрім вільної торгівлі, РП пообіцяла розбудувати інституції островів, одночасно створюючи міжкласову політичну базу для партії.\n\nЗавдяки величезному успіху на нещодавніх виборах РП може залишатися при владі в Антильській конфедерації роками, через що деякі ліві критики називають країну однопартійною державою.\n"
 FWI_news.3.a: "У мене там таймшер!"

 FWI_news.4.t: "[Get_newspaper_header]Антильська конфедерація проголошує незалежність від Сполучених Штатів"
 FWI_news.4.desc: "Сьогодні вранці сотні тисяч антильців прокинулися разом із новим президентом — Раймоном Ґійо з партії ПУГ. Коли над тепер незалежною Антильською конфедерацією сходить нова зоря, Ґійо прагне відійти від американського впливу.\n\nПід час своєї кампанії Ґійо наголошував на жорстких заходах для просування нової французько-антильської ідентичності разом із низовим національним розвитком поза сферою впливу Америки. Примітно, що Ґійо виступав за креольську освіту в школах та заохочував туризм до місць, пов'язаних із креольською та французькою спадщиною.\n\nСвіт — особливо Америка — дивиться на нову націю з очікуванням. Хоча чергова партія карт стала застарілою, нова карта вже викарбовується в серцях і душах антильців.\n"
 FWI_news.4.a: "Ми поважатимемо їхній вибір, доки вони поважатимуть нас."

 FWI_news.5.t: "[Get_newspaper_header]Ґваделупа проголошує незалежність від Сполучених Штатів"
 FWI_news.5.desc: "Сьогодні Карибське море сколихнули ударні хвилі, коли невелика острівна держава Ґваделупа офіційно проголосила незалежність від свого покровителя — Сполучених Штатів, послабивши багаторічні економічні та політичні зв'язки. Прем'єр-міністр Медар Альбран, який тривалий час домінував у політиці острова, пообіцяв продовжити демократичні традиції вигнаної Французької республіки, коли Ґваделупа виходить на світову арену як суверенна держава.\n\nПопри несподіваність заяви, аналітики повідомляють, що правляча коаліція все ще міцно контролює політичний апарат країни, а експорт цукру та рому до Сполучених Штатів, імовірно, не скоротиться. Для багатьох на острові залишається питання, чи принесе ця декларація якісь тривалі зміни.\n"
 FWI_news.5.a: "Бажаємо їм удачі."

 FWI_news.6.t: "[Get_newspaper_header]Ґваделупа розриває зв'язки зі Сполученими Штатами"
 FWI_news.6.desc: "Сьогодні шок прокотився на північ через Кариби, коли острів Ґваделупа офіційно проголосив незалежність, розірвавши багаторічні зв'язки між Сполученими Штатами та французькими власниками плантацій на острові. Заява пролунала під егідою нещодавно переможної Партії голлістської єдності (ПУГ), популістського консервативного руху на чолі з палким Раймоном Ґійо.\n\nУ своїй промові Ґійо пообіцяв розширити внутрішнє володіння промисловістю, створити сильний державний апарат та проводити незалежну зовнішню політику. Аналітики регіону зазначають, що багатoетнічна підтримка Ґійо відображає зростаючий рух острова до самовизначення та расового визволення — тенденції, що чітко віддзеркалюються по всьому Карибському регіону. Хоча Вашинґтон висловив "стримане занепокоєння", у своїй промові Ґійо запропонував продовжити торгівлю зі Сполученими Штатами за умови "значного перебалансування". Президент завершив свою промову, проголосивши нову еру суверенітету Ґваделупи.\n"
 FWI_news.6.a: "Бажаємо їм удачі — вона їм знадобиться!"

 FWI_news.7.t: "[Get_newspaper_header]Мартиніка незалежна"
 FWI_news.7.desc: "Після історичного референдуму, проведеного в колишній Американській адміністрації Антильських островів, та подальшого розпуску Цивільної адміністрації острівна держава Мартиніка ознаменувала свою незалежність першими в історії виборами. Тепер під сміливим правлінням харизматичного соціаліста Еме Сезера острів як номінально, так і фактично відокремився від Сполучених Штатів та колишнього господаря — Франції, і зіткнувся з невизначеним майбутнім, ізольований у регіоні.\n\nМіжнародні спостерігачі, які спочатку прогнозували перемогу опозиційного лідера Віктора Сабле та плавну реінтеграцію до ОВН, тепер відзначають тверду соціалістичну позицію Сезера та його протидію більшості американських умов для отримання допомоги. Спроби укласти договір про дружбу зі США провалилися в Генеральній раді, і малоймовірно, що цей експеримент буде відновлено. На Мартиніку чекає самотній шлях, відокремлений від решти її побратимів у Карибському басейні, захищених довгою тінню Вашинґтона.\n" 
 FWI_news.7.a: "Сміливий крок для маленького острова."

 FWI_news.9.t: "[Get_newspaper_header]Мартиніка незалежна"
 FWI_news.9.desc: "Після історичного референдуму, проведеного в колишній Американській адміністрації Антильських островів, та подальшого розпуску Цивільної адміністрації острівна держава Мартиніка ознаменувала свою незалежність першими в історії виборами. Тепер під контролем ліберального кандидата Віктора Сабле острів номінально відокремився як від Сполучених Штатів, так і від Франції, хоча й зберіг надзвичайно міцні американські зв'язки.\n\nМіжнародні спостерігачі прогнозували перемогу Сабле ще до початку голосування, відзначаючи його платформу ліберального девелопменталізму, побудовану приблизно на тих самих засадах, що й Демократична партія США. Острів приєднався до ОВН і, ймовірно, незабаром прийме невелику військову делегацію. Хоча дехто засуджує іноземний вплив, програма Сабле з національного розвитку, що фінансується за рахунок іноземної допомоги та розбудови інституцій, залишається популярною та дає його партії карт-бланш на керівництво країною в її нестійкі перші роки незалежності.\n"
 FWI_news.9.a: "...Статус-кво до війни?"

 FWI_news.10.t: "[Get_newspaper_header]Мартиніка незалежна"
 FWI_news.10.desc: "Після історичного референдуму, проведеного в колишній Американській адміністрації Антильських островів, та подальшого розпуску Цивільної адміністрації острівна держава Мартиніка ознаменувала свою незалежність першими в історії виборами. Тепер під контролем реформістського соціаліста Тертюльєна Робінеля острів номінально відокремився як від Сполучених Штатів, так і від Франції, хоча й зберіг значні американські зв'язки.\n\nМіжнародні спостерігачі, які спочатку прогнозували перемогу опозиційного лідера Віктора Сабле та плавну реінтеграцію до ОВН, тепер відзначають поміркований ідеологічний підхід Робінеля та добре проведену націоналізацію колишніх американських активів. Не вступаючи повністю до ОВН, новий уряд деякі вважають демонстрацією американського державотворення, залишаючись ідеологічно незалежним від колишнього адміністратора. Більш цинічні видання відзначають сильний вплив прихильників Нового курсу та вже подані запити на фінансову допомогу.\n"
 FWI_news.10.a: "Лише час покаже, чи був це правильний вибір."

 FWI_news.8.t: "[Get_newspaper_header]Народна Республіка Мартиніки"
 FWI_news.8.desc: "Приголомшлива перемога Еме Сезера на нещодавніх загальнонаціональних виборах в острівній державі Мартиніка призвела до повної соціалізації країни. Одразу після складання присяги новими депутатами та посадовцями Сезер проголосив створення "Народної Республіки" Мартиніки, підкріпленої новою конституцією, яка офіційно затвердила країну як однопартійну соціалістичну демократичну республіку.\n\nМіжнародна реакція була стриманою, а неофіційні джерела з Вашинґтона висловлюють підозри щодо фальсифікації виборів та іноземного втручання з боку неназваних країн. Незалежно від цього, непропорційно велика роль нової держави як карибського осередку франкомовного лівого руху, безсумнівно, поширить хвилі по всьому регіону, і повідомлення про організацію робітників та студентську активність у сусідніх країнах уже почали з'являтися.\n" #Додаємо \n просто на випадок, бо багатьом іншим він був потрібен
 FWI_news.8.a: "Дядько Сем, мабуть, лютує..."

 #FWI Referendum Proxy Events
 FWI_proxy.2.t: "Сонце заходить, а нещастя не заходить"
 FWI_proxy.2.desc: "КОНФІДЕНЦІЙНО/[?global.date.GetDateStringNoHourLong]\n\nВІД ДИРЕКТОРА FBI ДЖ. ЕДҐАРА ГУВЕРА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА СПОЛУЧЕНИХ ШТАТІВ\n\nТЕМА: МАЙБУТНІЙ РЕФЕРЕНДУМ ЩОДО АВТОНОМІЇ КОЛИШНЬОЇ ФРАНЦУЗЬКОЇ ВЕСТ-ІНДІЇ\n\n1. Політична активність на островах досягла історичного максимуму в місяці, що передують голосуванню, з помітними сплесками протестів у населених пунктах Ґваделупи та Мартиніки. Попри це, місцевий адміністратор, верховний комісар Лайман Лемніцер, на момент написання цього документа зміг цілком задовільно підтримувати порядок.\n\n2. Радикальні антиамериканські настрої широко поширені серед остров'ян, але не є одностайними, що призводить до регулярних сутичок між прихильниками та противниками незалежності. Ці прихильники продовження американської присутності можуть виявитися корисним козирем для впливу на громадську думку перед майбутнім голосуванням.\n\n3. Наш контроль над цивільною адміністрацією дає нам значну свободу дій для проведення потенційних таємних операцій з метою схилити результати голосування на нашу користь. Навіть у разі несприятливого результату необов'язковий статус референдуму означає, що ситуація загалом залишається такою, що викликає середнє або низьке занепокоєння.\n\n4. Однак слід очікувати значного іноземного впливу. Втручання країн зі сфери впливу Мексики та конкуруючі інтереси європейських держав, таких як Іберія, можуть свідчити про зміни в електоральній базі, і до цього все одно слід ставитися з обережністю."
 FWI_proxy.2.a: "Вірність, хоробрість, чесність."

 FWI_proxy.3.t: "Звіт про референдум у Французькій Вест-Індії"
 FWI_proxy.3.desc: "ФЕДЕРАЛЬНЕ УПРАВЛІННЯ БЕЗПЕКИ\nТЕМА: Референдум, організований США, вирішить долю Французької Вест-Індії.\n\nҐваделупу та Мартиніку протягом кількох тижнів сколихують громадські заворушення, оскільки населення висловлює своє невдоволення американською окупацією. Французька Вест-Індія перебуває під "захистом" США від часів Другої світової війни, роками животіючи в умовах посереднього економічного становища. Схоже, нещодавня напруженість нарешті змусила Вашинґтон діяти, і населення очікує, що майбутній референдум принесе рішучі зміни.\n\nПеред майбутніми незалежними Антильськими островами постають два варіанти. США виступають за федерацію, щоб зберегти Мартиніку та Ґваделупу разом, залишивши більшу частину структури нинішньої американської адміністрації та забезпечивши збереження свого впливу. В іншому випадку острови можуть проголосувати за те, щоб розійтися й стати окремими політичними утвореннями.\n\nМексика надасть дипломатичну та матеріальну підтримку демократичному прагненню народів Антильських островів до повної незалежності. Антифедералісти виступають проти штучного об'єднання, організованого Америкою. Їхня підтримка не лише зміцнить регіональну автономію, а й забезпечить Мексиці нових економічних і політичних партнерів, особливо на Мартиніці.\n\nЗ повагою,\nРегіональний директор безпеки\nполковник Еміліо Торрес."
 FWI_proxy.3.a: "Пришвидшимо це антильське розлучення."

 FWI_proxy.4.t: "Іберія на Антильських островах"
 FWI_proxy.4.desc: "КОНФІДЕНЦІЙНО\n\nДО ПОСЛА У СПОЛУЧЕНИХ ШТАТАХ\n\nФРАНЦУЗЬКІ АНТИЛЬСЬКІ ОСТРОВИ — МАРТИНІКА ТА ҐВАДЕЛУПА, ПІД АМЕРИКАНСЬКОЮ ОКУПАЦІЄЮ\n\nЗ майбутнім референдумом щодо статусу Французьких Антильських островів відкривається нова можливість просунути інтереси Іберії в Карибському басейні. Після нещодавніх громадських заворушень, спричинених роками економічних труднощів і невдоволення американською окупацією, доля островів залежить від виборчої урни. Мартиніка та Ґваделупа або стануть федерацією, залежною від американських інтересів, або розділяться на незалежні держави.\n\nПосол має повідомити уряду Союзу, що обмежені ресурси слід спрямувати на підтримку антифедералістської кампанії. Провал федеративного плану Вашинґтона зруйнує його контроль над майбутнім островів і відкриє їх для іберійських інвестицій. Опинившись напризволяще, нові структури влади після здобуття незалежності також шукатимуть нового зовнішньополітичного курсу. І вони знайдуть широко розпростерті обійми Іберії.\n\nПідтримка антифедералістів на Мартиніці та Ґваделупі є головним пріоритетом уряду Іберії в Карибському басейні."
 FWI_proxy.4.a: "Ми хочемо випити з американського колодязя."

 FWI_proxy.5.t: "Зустрічайте нові Антильські острови"
 FWI_proxy.5.desc: "Через дванадцять годин після референдуму вулиці Ґваделупи та Мартиніки здебільшого стихли. Схід сонця привітав плакати й листівки, що заповнювали вулиці Бас-Тера та Фор-де-Франса, а тепер залишилися лише двірникам і сторінкам історії. Жителі Американських Антильських островів почали заповнювати вулиці та займатися своїми справами, як зазвичай. Референдум прийшов і пішов, майже не залишивши сліду в повсякденному житті людей.\n\nЧерез двадцять чотири години після референдуму комісар Лайман Лемніцер виступив в ефірі, похваливши народ за виконання свого демократичного права й обов'язку та подякувавши йому за віру в майбутнє конфедерації. Лемніцер повторив, що багато інституцій нинішньої Цивільної адміністрації буде збережено, аби пришвидшити перехід до незалежності та напівпрезидентської системи.\n\nЧерез два дні після референдуму група з трьох чоловіків середнього віку, що сиділи в кафе в Пуент-а-Пітрі, обговорювала майбутнє свого острова. Двоє з них проголосували за конфедерацію, а третій — проти, але дискусія була достатньо доброзичливою. Справи йшли вгору, казали двоє прихильників конфедерації, і не було сенсу розгойдувати човен. Третій чоловік не був переконаний, але й переконати їх у протилежному не зміг.\n\nЧерез п'ять днів після референдуму молодого чоловіка доставили до місцевого суду за спробу підпалити поліцейську машину в Ле-Ламантені. На допиті він заявив, що діяв на знак протесту проти колоніальної влади та плану конфедерації, який, за його словами, "лише дозволить американцям ефективніше притискати нас чоботом". Його засудили до двох місяців у місцевій в'язниці, де він приєднався до своїх товаришів, ув'язнених ще до проведення референдуму."
 FWI_proxy.5.a: "...те саме, що й старі Антильські острови."

 FWI_proxy.6.t: "Цивільний відхід"
 FWI_proxy.6.desc: "Штаб-квартира Цивільної адміністрації Американських Антильських островів вирувала від шаленої діяльності, коли почали надходити результати нещодавнього референдуму. Неочікувана невдача для планів комісара Лаймана Лемніцера щодо шляху островів до незалежності полягала в тому, що виборці відхилили запропонований ним план конфедерації. Тепер адміністрація опинилася в стані хаосу, змушена перебудовувати свій графік і закріплювати розірвані кінці, залишені результатом.\n\nПерший крок цього процесу відбувався саме зараз у кабінеті Лемніцера. Комісар, який не спав, приймав делегатів від острівних рад Ґваделупи та Мартиніки, які прийшли передати майже ідентичні резолюції — обидва острови прагнутимуть самоврядування як суверенні політичні утворення. Зібравши всю свою дипломатичну майстерність, Лемніцер усміхнувся, потиснув руки, а потім ще раз усміхнувся камерам і проголосив щось про те, що "Сполучені Штати Америки залишаються непохитним гарантом демократичних прав і права на самовизначення". Але він не міг позбутися відчуття поразки.\n\nПісля провалу свого плану Лемніцер знав, що його послуги тут дуже скоро не знадобляться. Йому почала подобатися його робота, але більше його турбувала здатність островів створити стабільні, дружні системи правління без американської — його — підтримки. Кариби були геополітичним полем битви, а малі держави мали схильність бути захопленими штормом.\n\nКоли представники двох островів пішли, Лемніцер сів, самотній і виснажений. Дві великі папки тепер лежали на його столі, чекаючи, поки він доставить їх до Вашинґтона. Він майже хотів відмовитися. Залишити папки тут, зберегти тверду руку й допомогти народам цих островів здобути незалежність за допомогою керівної руки Америки. Але він знав, що цього не можна зробити. Він запитав людей, чого вони хочуть, і вони хотіли, щоб він пішов. Він більше не контролював ситуацію."
 FWI_proxy.6.a: "І невдовзі Конґрес ратифікував би цей факт." #USA
 FWI_proxy.6.b: "Кариби стають трохи бурхливішими. І нас це цілком влаштовує." #IBR
 FWI_proxy.6.c: "Ще один удар по імперіалізму. Маленький крок до суверенітету в нашій півкулі." #MEX
 
 FWI_proxy.8.t: "Заспівай мені пісню, о піаністе"
 FWI_proxy.8.desc: "Горизонт почав набувати слабкого помаранчевого відтінку, все ще пронизаного синявою, і, дивлячись у той бік, Сальвадор Ґальястеґі залишив роботу. Це була невелика вільність, звісно, він ішов раніше. Але він уже виконав те, чого Мексика насправді хотіла того дня — кілька заяв із привітаннями незалежності Мартиніки та Ґваделупи, кілька фотосесій із націоналістичними політиками, зустріч для обговорення потенційних проблем, які могли б дипломатично розділити їх. Він міг присвятити десять хвилин собі.\n\nНа мить зупинившись, він прогулявся набережною каналу Левессуара, дивлячись на хвилі. Вдалині захоплені натовпи розмовляли між собою, схвильовано обговорюючи майбутнє. Ті, хто виступав проти цього, звісно, не вийшли б на вулиці. Він коротко поглянув на американське посольство — світло все ще горіло, але спереду не було жодного руху, окрім одного стажера. Очевидно, його зусилля з підтримки незалежності Антильських островів принесли результат, і лише його невисокий ранг завадив проведенню кризової наради.\n\nБули кілька годин, коли результат виглядав трохи менш переконливим, а Сполучені Штати обмірковували, чи наголосити на тому, що референдум був необов'язковим. Але щойно чутки поширилися, вулиці заповнилися демонстрантами, які приховували свою лють під святкуванням, проходили повз його офіс, і вони вирішили відступити та прийняти умови.\n\nСидячи на лавці з видом на Палац правосуддя, він дістав гітару й почав перебирати струни. Це була невимушена мелодія, жменька акордів, пов'язаних лише відлунням його нот. Попри це, люди поступово почали збиратися, слухаючи мелодію, пари плескали, коли він завершував черговий пасаж, а окремі люди наспівували її, сповільнюючи крок. Ще раз озирнувшись навколо, він почав подумки занотовувати відомості про натовпи та впорядковувати їхнє зростаюче полегшення в основу майбутнього звіту."
 FWI_proxy.8.a: "Навіть забитий палець ноги може звалити боксера."

 FWI_proxy.9.t: "Віддалене роз'єднання"
 FWI_proxy.9.desc: "Кімната Фернандо Марії Кастіельї лунала сміхом. Спочатку від шоку, а потім від полегшення, Кастіелья засміявся, прочитавши звіт перед собою. Антильські виборці вирішили відхилити американські плани централізації й натомість обрали незалежність. Жодних зображень не було надано, але звіт містив деталі про масштаби святкових натовпів і силу результату. На кожному острові вирішальна більшість виступила за незалежність і лише починала розходитися на вечір.\n\nНа мить розслабившись, він налив собі вина, виготовленого з португальського врожаю 1960 року. Воно не було особливо старим, але все одно це був рік, який варто було відзначити. Він насолодився смаком, перш ніж узятися за написання кількох повідомлень. Мережа плантаторів по всій Мартиніці та Ґваделупі, з якими він зв'язався, безумовно, спрацювала, і це заслуговувало на певну винагороду. Кілька торговельних угод, кілька дозволів на подорожі, кілька подарунків. Достатньо, щоб винагородити їх за роботу з контрабанди іберійської пропаганди та товарів до Карибського басейну.\n\nНа мить він боявся, що вся його робота буде марною. В останні дні кампанії американці почали агітацію — спочатку через прихильні засоби масової інформації, а потім через послів — наголошуючи, що це необов'язковий референдум, і він утратив будь-яку надію. Але з таким переконливим відривом? З такими масштабними демонстраціями? Він знову дістав свої старі плани. Якщо вже на те пішло, він почав наважуватися розширити їх. Йому просто треба було спершу знайти свої нотатки, і-\n\nСміх змінився лайкою. Звісно! Він загубив свої нотатки! Протягом останніх кількох місяців, коли референдум здавався дедалі ймовірнішим, він почав досліджувати й розробляти плани щодо встановлення політичних та економічних зв'язків з Антильськими островами! Коли американці спробували применшити його значення, він їх викинув! Кинувшись до телефону, він зателефонував секретарці, вимагаючи, щоб вона пошукала їх у смітті. Байдуже, наскільки забрудненими чи зім'ятими вони будуть, йому потрібні ці нотатки, якщо він хоче рухатися далі."
 FWI_proxy.9.a: "Немає часу гаяти."

 FWI_proxy.10.t: "Якщо ти справді щось любиш..."
 FWI_proxy.10.desc: "Двоє чиновників сиділи в нічим не примітному ресторані на околиці Вашинґтона, округ Колумбія, а попільничка між ними наповнювалася дедалі більшою купою сигарет. Іноді це маленьке, темне місце дозволяло говорити відвертіше, ніж зали штаб-квартири Державного департаменту, з меншою кількістю допитливих очей і більшим галасом.\n\nОдин із чоловіків загасив чергову сигарету об стіл. "Ця історія з Антильськими островами не мала закінчитися так, чоловіче. Це не було б так складно. Просто скасувати результати й рухатися далі з більш відповідальним планом. Ми вже два десятиліття захищаємо їх від фашистів, вони мали б краще знати. Можливо, ми могли б дозволити їм провести невеликий референдум для ратифікації всього, коли все буде завершено".\n\nЙого супутник підняв брову. "Справді, Джоне? Ми дозволили їм провести цей референдум, і результати були однозначними. Не можна просто стерти 67 відсотків голосів. Щойно ми провели голосування, ми взяли на себе зобов'язання поважати результати. Навіть якщо вони дозволили безвідповідальним демагогам домогтися свого."\n\nДжон гірко кивнув. "О, спустися з цього високого коня, Брюсе. Президент теж хотів скасувати результати, доки FBI не повідомило йому про "високу ймовірність насильства", якщо він це зробить. Раптом він почав хвалити результати й обіцяти плавний перехід до самоврядування. Насильство, та ну. Фашисти просто скористаються можливістю в ту ж мить, коли ми підемо, і створять ще одну Домініканську Республіку. І все тому, що ми були надто боягузливими, щоб по-справжньому захистити демократію."\n\nБрюс відкинувся назад. "Не знаю, чоловіче. Думаю, ти трохи перебільшуєш. Зрештою, вони все ще будуть в ОВН. А якщо вони справді скотяться до фашизму..."
 FWI_proxy.10.a: ""...Ми завжди можемо повернутися.""

 FWI_proxy.11.t: "Посередник"
 FWI_proxy.11.desc: "Ґваделупа не знала пір року. Її палюча спека залишалася незмінною цілий рік, і єдиним порятунком від неї був маленький нічний ритуал генерала Лаймана Лемніцера, який щоночі виходив на балкон готелю подихати свіжим повітрям. Йому також подобався краєвид із цієї скромної оглядової точки, звідки він міг бачити більшість сонних вулиць Бас-Тера.\n\nЙого власний маленький шматочок Карибів, небажаний приз за роки служби, протягом яких він наглядав за найвидатнішими поразками Америки. Йому було боляче це визнавати, але він почав неабияк прив'язуватися до цього скромного маленького феоду. Він ніколи не відповідав йому взаємністю, звісно; але в такі моменти, коли тишу нічого не порушувало, він майже міг переконати себе у протилежному.\n\nМожливо, саме тому йому було трохи сумно від думки, що щойно настане ранок, ці самі вулиці вже ніколи не будуть такими спокійними.\n\nНасправді це не було несподіванкою. Хоча частина його хотіла б іншого, його імпровізоване séjour на Антильських островах не мало найближчим часом перериватися. У незвичному прояві турботи вашинґтонські керівники навіть заздалегідь повідомили йому про рішення президента проігнорувати результати референдуму та запровадити поновлення Акту Шорта—Фулбрайта. Тож тепер, до оприлюднення заяви на світанку, він мав цілу безсонну ніч, щоб розмірковувати, де все пішло не так.\n\nМожливо, він був винен уже в тому, що взагалі подав пропозицію до Конґресу. У тому, що дозволив собі сподіватися, ніби все це не обернеться настільки грандіозним провалом. Ні, можливо, насправді він був винен у створенні ситуації, яка до цього призвела. У тому, що неправильно розпорядився територією, так щедро дарованою йому старим Кефаувером. Він знав, що місцеві безперечно звинувачували його в усіх своїх бідах, уособленні всього, що вони ненавиділи в американських загарбниках. Він зітхнув, востаннє поглянувши на тихе маленьке містечко."
 FWI_proxy.11.a: "Найбільше він знав, що саме на нього звалять провину за те, що станеться далі."
 FWI_proxy_finished_veto: "§RСполучені Штати оголосили референдум необов'язковим, наші зусилля виявилися марними.§!"

## Bahamas Flavor Events

 BAH_forpol.1.t: "На дроті"
 BAH_forpol.1.desc: "Номер Вінсента Терези на верхньому поверсі готелю «Фламінґо» лише підтверджував його репутацію. Наповнений усіма можливими зручностями та постійно зайнятий сумішшю інформаторів, членів мафії й персоналу готелю, він виходив на задню частину Парадайз-Айленда. Розташований над мостом до Нассау та самим серцем Багамських островів, він був вершиною розкоші. Коли з кімнати вийшла нова група прибиральників, які краще за інших знали, що не варто втручатися у справи мафії, всередину ввійшла нова група інформаторів.\n\n"Це недешево, знаєте", — пробурмотів Тереза, майже нечутно, перекочуючи в руці палаючу сигару й дивлячись на вулиці внизу, заповнені людьми, чиї обличчя губилися в натовпі. "Я заможна людина, але навіть мої гроші мають межі."\n\n"А рахунки наших партнерів ще глибші", — відповів один із них, майже відрепетирувавши свою дипломатичну тактовність. "Повірте, Вінсенте, ви почесний гість, і ніхто з нас не хоче для вас нічого, крім найкращого. Але наш бос очікує чогось натомість."\n\n"Я так і припускав", — відповів Тереза, тихо сміючись. "Чого ви хочете? Шукаєте когось, кого треба прибрати?"\n\n"Він хоче розширитися в Карибському басейні, але наштовхнувся на деяких людей звідси", — відповів інший, із фальшивим італійським акцентом, натягнутим майже до межі правдоподібності. "Я не з тих, хто кусає руку, що його годує, але цей самий готель завдає нам справжнього клопоту. Вам доведеться сказати нам, на кого насправді працює Багсі Сіґел."\n\nТереза на мить замислився над питанням, знову затягнувшись сигарою, перш ніж здатися. "Гаразд, добре, я поговорю. Коли його прикрили у Веґасі, він не просто так перебудував тут своє казино заради розваги. Цей чоловік має угоду із Саймонеттом." Більшість агентів мовчала, чекаючи, поки він продовжить. "Але якщо я зроблю більше, ніж просто поговорю, я висуну голову. Та за правильної угоди я це доведу.""
 BAH_forpol.1.a: "Час зробити пропозицію, від якої він не зможе відмовитися."

 BAH_forpol.2.t: "Матеріали"
 BAH_forpol.2.desc: "Для Персі Данна це був довгий день. Він уже деякий час очікував на звіт про зв'язки мафії із Саймонеттом. Натомість він отримав набагато більший звіт, який спочатку поверхово пояснював усе, а потім висвітлював їхні зв'язки з фашистами по всій Латинській Америці та з Іберійським Союзом.\n\n"Тут практично кожне ім'я. Саймонетт... Дювальє... Батіста... Стресснер... Важко знайти фашиста, не пов'язаного з Латинською Америкою", — продовжував він розсіяно до Теодора Аллана. "Зв'язки з фігурами у Флориді й без того викликали б занепокоєння; але це? Це набагато масштабніше, ніж ми очікували." Нарешті піднявши погляд, він ледь усміхнувся.\n\n"Отже, що нам із цим робити?" — запитав Теодор Аллан, сам заглиблений у сторінку про угоди між представником штату Луїзіана та іберійським дипломатом.\n\n"Що ж, ми повинні переконати уряд оприлюднити ці висновки. Якщо не вийде — знайти якогось журналіста. Ми достатньо вилучили, щоб захистити важливих людей для наших інформаторів із мафії, але масштаб цього звіту надто великий, щоб просто залишити його в архіві."\n\nАллан похитав головою. "Послухай, нічого хорошого тут немає. Нам потрібно прибрати іберійців із Карибського басейну та вивести будь-який скомпрометований американський актив зі сфери впливу." Він кинув звіт і відкинувся на спинку крісла. "Але якщо ми просто все розкриємо, то втратимо всі важелі впливу, які матимемо, коли багамський уряд розвалиться. До того ж іберійський уряд поганий, але хіба ти волів би, щоб замість нього там з'явилася Японія?"\n\nДанн подивився зі скептицизмом, але знизав плечима. "Я розумію твоє занепокоєння. Все одно це не наш вибір." Відкривши флягу, він налив склянку віскі й на мить залишив її в руці. "Чого б ми не хотіли, вирішувати буде директор FBI.""
 BAH_forpol.2.a: "Ми не можемо цього терпіти. Зверніться до американського уряду; це має стати публічним."
 BAH_forpol.2.b: "Це корисніше як шантаж, ніж як заголовок. Ця загроза має повернути Багами в стрій."

 BAH_forpol.3.t: "Усе на червоне"
 BAH_forpol.3.desc: "За рулетковим столом порожній сміх лунав так голосно, що відбивався луною в сусідніх кімнатах. Зібралася невелика компанія: троє місцевих американських мафіозі, привезених на Багами Багсі Сіґелом, іберійський бізнесмен, який прагнув розширити свій бізнес із однодумцями, та круп'є, який полемічно просторікував про падіння сусідніх земель перед комунізмом. Вони жартували, сміялися й невимушено проводили час разом, але всі знали, що це була брехня.\n\n"Ти коли-небудь убивав людину?" — запитав один із них, Альберт, коли розмова пожвавилася навколо них. Іберійський бізнесмен дивився вперед із легким здивуванням, перш ніж показати, що продовжує гру, коли кулька впала на 36 червоне.\n\nАльберт поставив на чорне, тоді як іберієць залишився на червоному, і на мить замислився над своїм наступним ходом. "Так, ми всі декого вбивали. Був у нас один тип, велика шишка в Ньюарку, але він не міг тримати язик за зубами перед копами. Тож ми вивезли його в ліс. Сказали, що збираємося прибрати іншого щура. А потім, коли він застрелив того хлопця, я застрелив і його. Двох зайців одним пострілом — і готово."\n\n13 чорне. Іберієць скривився — і через програш, і через свою стратегію. "Досить ризикована стратегія, чи не так?" — запитав Альфонсо, ставлячи велику ставку на червоне.\n\nАльберт знизав плечима, перш ніж його група пересунула вперед більшу частину своїх ставок. "Я хлопець, який любить ризикувати."\n\nАльфонсо усміхнувся, поставивши аналогічну ставку. "Я був надто молодий, щоб воювати проти більшовиків або відбити Гібралтар, але був достатньо дорослим, щоб у 1944 році обдурити армію й переконати її, що я достатньо дорослий. Я був дислокований під Бамако, коли налетіла піщана буря. На відміну від більшості людей, я пішов на ризик." Кулька на мить затрималася, перш ніж зупинитися на 2 червоному, викликавши розлючений погляд мафіозі. "Трьома американськими солдатами менше, що ходять цими вулицями сьогодні, скажімо так.""
 BAH_forpol.3.a: "Альфонсо тоді поставив свою найбільшу ставку."
 BAH_forpol.3.b: "Спогади про війну, яку вже вели, і попередження про війну, яку ще доведеться вести."

 BAH_forpol.4.t: "Нові початки"
 BAH_forpol.4.desc: "Відносне багатство вулиць навколо Мадрида привернуло увагу Армандо Ґаони, але лише поверхово. Йому ніколи не було потрібно відчувати це спільне багатство, щоб насолоджуватися власною пишністю. Нікому з його групи не було. Але часи змінювалися; тепер, коли Карибський легіон контролював Домініканську Республіку, йому та його групі підприємців-трухільїстів довелося шукати нове місце. Мадрид був лише тимчасовою зупинкою, заброньованою в останню хвилину.\n\n"Справді шкода було бачити падіння Рафаеля Трухільйо, знаєш", — пробурмотів Хоакін Карбальяр, запалюючи сигару. "Сам я його ніколи не знав, але він був ідеальною людиною для допомоги моєму бізнесу розширитися там."\n\n"Ага, так і було. Мало хто коли-небудь допомагав нам так, як ми допомагали іншим", — відповів Максиміліано Ільєскас, також видихаючи дим із сигари. "Мадрид — гарне місто, але в нас усе ще є справи в Карибському басейні. Можеш порадити якісь місця?"\n\nКарбальяр на секунду замислився, а потім нахилився до вуха Ільєскаса, продовжуючи говорити достатньо голосно, щоб його чули всі. "Якщо готовий обрати менш... звичайний шлях, спробуй Багами. За правильну ціну там можна отримати що завгодно." Він постукав себе по носі й відкинувся назад.\n\nГрупа загомоніла, зацікавлена пропозицією, але їхні відповіді набули більш вагомого відтінку сумніву. "Я впевнений, що можна, Хоакіне, але чи піде він нам назустріч?" — запитав Армандо. "Він американець, і ми б не говорили про це, якби Америка трималася подалі."\n\nАрмандо спробував продовжити, але Хоакін змусив його замовкнути, говорячи далі. "Саймонетту байдуже до Америки. Поки ви допомагаєте вести бізнес до Нассау й тримаєте в узді тих беззаконних дикунів, з якими він живе, йому буде байдуже, чи ви Франко, чи Салазар." Знову пролунало бурмотіння, але тепер вагання змінилося кивками та зацікавленістю."
 BAH_forpol.4.a: "Наступна країна в ганебному списку."

 BAH_forpol.5.t: "Кімната сміху"
 BAH_forpol.5.desc: "Відтоді, як Вінсент Тереза почав говорити, він знав, що було лише питанням часу, коли його партнери все зрозуміють. Він помічав це всюди; бачив у рукостисканнях з іншими мафіозі, відчував у їхніх поглядах. Та все одно не міг не триматися за надію. Просто відрізати себе від інших мафіозі означало б лише викликати підозру, тож він намагався вдавати, ніби нічого не сталося. Лише коли його останнє нервове базікання припинилося, він зрозумів, наскільки далеко в морі опинилася його яхта.\n\n"Гаразд, припинімо так гратися", — зітхнув один із них, піднімаючи пістолет, і решта яхти майже миттєво повторила цей рух.\n\nВін знав це. Мабуть, краще боротися з неминучим, подумав він. "Ого, що ви робите?" — вигукнув Тереза, відступаючи на крок.\n\n"Ми знаємо, чим ти займався, Вінсе", — відповів перший чоловік, майже не рухаючись, коли підняв пістолет. "Бос розповів нам, чим ти займався. Іспанці кажуть, що ти здавав федералам їхніх друзів. Погано кусати руки, які тебе годують."\n\n"Що? Я б ніколи!" — відповів Тереза, удаючи шок. Раптом його осяяло. Його обдурили. "Та годі, я б ніколи такого не зробив, повірте мені. Гей, давайте не будемо..." \n\n-БАХ-\n\nБіль пронизав груди Терези, паралізувавши його від шоку. Він хитнувся назад, один крок, потім другий, перш ніж другий чоловік опустив пістолет і зіштовхнув його за борт. Вони ще мить стояли, спостерігаючи, як криваво-червоний колір тьмяніє в мутнішій синяві, перш ніж фігури поїхали геть, а їхнє бурмотіння про майбутню втрату такого хорошого човна загубилося під хвилями та згасаючою свідомістю."
 BAH_forpol.5.a: "Голод моря знову втамовано."

 BAH_forpol.6.t: "Нерозкрита справа"
 BAH_forpol.6.desc: "Вони мали знати, що не варто чекати надто довго. Відтоді, як їхні агенти на Багамах раптово замовкли, вони мали здогадатися, що з їхнім зв'язком із Вінсентом Терезою щось не так. На той час, коли FBI це зрозуміло, яхта Терези вже давно зникла з гавані. Його бронювання в готелі «Фламінґо» було повністю анульовано, а нові оголошення про його ексклюзивний номер уже з'явилися в газетах. Таємна група агентів повільно зібралася, готуючись до найгіршого.\n\nКімната була повністю перевернута догори дриґом, єдиними ознаками обережності були спочатку замкнені двері та ретельно зашторені фіранки. Практично все інше було перекинуто, розлито або зникло. Переглядаючи шафки та шухляди, вони не знайшли жодних слідів папок, які колись бачили, — лише одна папка з манільського паперу, що випала з-під ліжка, та пара порожніх вішаків свідчили про те, що в кімнаті взагалі було щось, окрім наслідків цунамі.\n\nЩо сталося, було зрозуміло. Вінсент Тереза в якийсь момент почав поводитися підозріло, а FBI надто повільно відреагувало. Іберійські агенти, без сумніву, організували його зникнення, ймовірно, скинувши його з яхти, щоб він потонув, а потім пішли далі. Вони деякий час чекали в кімнаті, чи не прийдуть інші працівники, сподіваючись, що ті зможуть щось пояснити. Ніхто не прийшов. Поки що персонал був достатньо розумним, щоб не втручатися у справи мафії.\n\nПереможені, вони вислизнули з розгромленого номера, пошепки нарікаючи на втрачені можливості. Вони знали, що щось відбувається, але тепер не мали жодної надійної зачіпки. Якщо інших інформаторів ще не зачистили, смерть Терези дасть їм надто багато причин для цього. Їхні зачіпки щодо зв'язків Саймонетта з Іберією або мафією повністю зникли. Спускаючись сходами, вони перевели погляди на його порожній столик у казино. І так їхні думки звернулися до вечора азартних ігор."
 BAH_forpol.6.a: "А коли вечір змінився ніччю, агенти поставили весь свій виграш на чорне."

 BAH_forpol.7.t: "Зміна варти"
 BAH_forpol.7.desc: "Роланд Саймонетт відкинувся у своєму кріслі, вивчаючи Кендалла Айзекса, темношкірого члена ОЄП та особисто обраного ним наступника, щоб обговорити перехід до правління більшості в країні.\n\n"За нинішніх обставин, Кендалле, — почав Саймонетт, його голос був тихим і втомленим, хоча це здавалося радше відпрацьованим, ніж щирим. — Народ хоче правління більшості, і він хоче обличчя, яке це відображатиме. Старий білий чоловік на чолі... що ж, це вже неприйнятно. Тож як компроміс я відійду з переднього плану й дозволю тобі стати прем'єр-міністром."\n\nАйзекс нахилився вперед у кріслі. "Що ж, дякую за службу, Саймонетте-"\n\nСаймонетт перебив його млявим помахом руки. "Моя служба не закінчилася. Не зрозумій неправильно. Я можу залишити публічне поле прем'єрства, але все одно буду... скажімо, спрямовувати справи, давати поради. Просто стежити, щоб країна залишалася на своєму нинішньому курсі." Нахилившись уперед, він загострив голос. "Стабільність є необхідною. Тобі знадобиться моя рука в певних питаннях, навіть якщо населення бачитиме твою."\n\nНа обличчі Айзекса промайнула тінь роздратування, але він її приховав. Він знав, що це станеться. "Звісно", — сказав Айзекс, вимушено посміхнувшись. "Я триматиму вас у курсі." Айзекс знав, що йому потрібна прихильність Саймонетта, якщо він хоче очолити ОЄП."
 BAH_forpol.7.a: "Навіть якщо це означало поки що схиляти голову."

 BAH_forpol.8.t: "Вільний повід — це все одно повід"
 BAH_forpol.8.desc: "Конференц-зала була сповнена гомону дипломатів та еліт, прапори Федерації Вест-Індії висіли поруч із прапорами Багамських островів. Кендалл Айзекс ретельно переглядав деталі своєї промови; це був його історичний момент. Його момент спрямувати Багами власним шляхом. Позаду нього стояв Роланд Саймонетт, людина без посади, яка все ж змогла пробити собі сюди дорогу силою. Він потискав руки старим друзям і іноземним високопосадовцям з усього Карибського басейну, роблячи кожне можливе фото та укладаючи кожну можливу угоду. Хоча вступ до Федерації не був би тим, що він зробив би на посаді, він дозволив Айзексу просувати цю ідею.\n\n"Роланде, — пробурмотів Айзекс, — я думав, ти казав, що триматимешся в тіні."\n\nСаймонетт навіть не став приховувати своєї втіхи. "І буду. Але не будемо вдавати, що Багамам є що отримати від цих нетерплячих дипломатів. Краще взяти від них якомога більше, поки все не закінчилося." Перш ніж Айзекс устиг відповісти, до них підійшов інший впливовий англофіл, сяючи усмішкою до Саймонетта.\n\n"Роланде, старий друже! Я чув, що ти відійшов убік, але ось ти тут, усе ще тримаєш корабель на курсі."\n\nСаймонетт прийняв комплімент із люб'язним кивком. "Лише даю поради там, де це потрібно. А Кендалл, звісно, — майбутнє."\n\nАйзекс стояв поруч із ними, тонко усміхаючись і відчуваючи, як земля вислизає з-під ніг. Щоразу, коли він намагався втрутитися, увага англофіла поверталася до Саймонетта. Кожна угода, на яку Саймонетт натякав, хай навіть неофіційно, ускладнювала завдання Айзекса. Йому потрібно було, щоб Багами виглядали суверенними, впевненими та повністю відданими Федерації. Натомість тінь Саймонетта нависала над кожною розмовою. І рано чи пізно йому доведеться вийти з тіні Саймонетта."
 BAH_forpol.8.a: "Дозволить це Саймонетт чи ні."

 BAH_forpol.9.t: ""
 BAH_forpol.9.desc: ""
 BAH_forpol.9.a: ""

 BAH_forpol.10.t: "Полювання на Фокса"
 BAH_forpol.10.desc: "Дарнелл Фокс озирнувся через плече й нервово облизав губи. Чи була людина, яку він побачив квартал тому, просто перехожим чи стеженням? Чи бачив він ту машину раніше, на іншій вулиці? Він перебував у конспіративній квартирі, непоказній похмурій будівлі в бідному районі на околиці Нассау, але чи справді тут було безпечно? Усе здавалося нормальним, але якщо за ним стежив професіонал, він би не знав, що за ним стежать, чи не так? Він набрав довгу послідовність цифр, щоб зв’язатися зі своїм американським контактом, Фріменом.\n\nBay Street Boys були правлячою клікою на островах, і хоча всі знали, що вони відмивали гроші для американських синдикатів і отримували зброю від інших убивчих латиноамериканських сильних лідерів, знати це — одне, а мати докази — зовсім інше. Якщо Багамська Народна Республіка взагалі мала шанс на існування, народ мав знати, що Bay Street Boys вбивали їхніх людей за наказом американців, а американська громадськість мала знати, що її дорогоцінні лідери дозволяли злочинцям безкарно панувати над місцевими. У Штатах люди говорили про право чорношкірої людини постояти за себе, досягти всього, що могло запропонувати життя, а не задовольнятися тим, що біла людина вважала за потрібне їй кинути. Він почув потріскування телефону, що сповіщало про з'єднання.\n\nДарнелл вірив у цю справу, коли зголосився стежити за складом Bay Street Boys у порту Принс-Джордж. Навіть зараз, коли серце підступало до горла, він усе ще вірив. Віра в справу давала йому сили навіть уявити, як він виступить проти Bay Street Boys. Коли він передасть свої спостереження, ця віра пошириться островами й за їхні межі та зрештою передасть Багамські острови до рук таких людей, як він. Держава для людей, схожих на нього.\n\nДарнелл лише відчув легкий дотик холодного ствола, перш ніж куля розтрощила йому череп. Усе, що він бачив і чув, — тепер він уже ніколи не робитиме ні того, ні іншого через те, чого не побачив."
 BAH_forpol.10.a: "Фрімен у цілковитому шоці кинув слухавку, серце стислося в грудях, і він перелякано озирнувся через плече."

 BAH_forpol.11.t: "Універсальна мова"
 BAH_forpol.11.desc: ""Ну, пляжі Флориди були чудовим місцем для дорослішання. Справді добре готуєшся до такого місця," — задумливо сказав Роланд Саймонетт, байдуже дивлячись на свій келих вина. Езек'єль де Соуза кивнув, втомившись від люб'язностей. Іберія шукала непомітний шлях для експорту до Ямайки й чудово розуміла, що не варто сприймати серйозно заяви Саймонетта про реформи.\n\n"У мене теж є приємні спогади з дитинства, Роланде, але ми можемо обійтися без ностальгії," — відповів де Соуза, намагаючись приховати свій акцент. "Поговорімо про справу."\n\nОчі Саймонетта повернулися до де Соуза, але тон залишився рівним. "Звісно. Такий маленький острівний ланцюг, як мій, не може вижити без торгівлі. Яку угоду ви пропонуєте?"\n\nДе Соуза вагався, переходячи до суті. "Ну, ми хотіли б перевозити деякі товари через Фріпорт до Ямайки, але це має бути непомітно."\n\n"Торгівля важлива, Езек'єлю," — відповів Саймонетт, ще пласкіше, ніж раніше. "Якщо Кариби хочуть процвітати, їм вона буде потрібна."\n\n"Не заперечуватиму," — відповів де Соуза, намагаючись не закотити очі. "Якщо ми домовимося, можу запевнити вас, що іберійські кораблі охоче проходитимуть через ваші порти."\n\nСаймонетт знову повернувся до свого келиха, обертаючи в ньому рідину, перш ніж зробити довгий ковток. "Я вітаю ідею вести бізнес з усіма націями, і було б приємно бачити більше іберійців серед нас." Він хотів більшого.\n\n"Гаразд, Роланде, скільки грошей ти хочеш!?" — огризнувся де Соуза, втомившись від цих обмінів. На мить він затамував подих, побоюючись, що його неввічливість зруйнувала угоду, але руки Саймонетта раптом широко розкинулися."
 BAH_forpol.11.a: ""Радий, що ми можемо вести справи разом, Езек'єлю.""

 BAH_forpol.12.t: "Відпочинок"
 BAH_forpol.12.desc: "Із розповідей, які він підслуховував біля барів. Із криків чайок, що пролітали над головою. Із найменших щілин між воротами готелів. Аджані знав пляж лише з найпохмуріших провулків Нассау — пляж, захаращений багатством і коктейлями, який вітав лише білих туристів.\n\nАле сьогодні лише табличка з написом "ПРИВАТНА ВЛАСНІСТЬ" заважала Аджані зайняти піщаний берег.\n\nАджані був першим, хто переступив невидиму лінію на піску. Стіну, що мала відділяти білих від таких чорношкірих людей, як він. Йому було дванадцять. Не набагато менше, ніж хлопцям в Америці, які влаштовували сидячі протести в барах. Інші пішли за ним. Двоюрідні брати, однокласники та товариші по крикету, з якими він грав на вихідних. Припливи океану шипіли, дряпаючи пісок.\n\n"Геть із піску!" — заревів чоловік. За ним ішли ще двоє, озброєні битою з цвяхами та ломом. "Ваші, що, кляту табличку читати не вміють?"\n\nДехто кинувся геть. Але Аджані зустрівся з чоловіком поглядом. Він уперся підошвами в пісок. Пісок відповів, просівши до його щиколоток і надійно вкорінивши його. Хлопець крикнув у відповідь. "Ми чудово вміємо читати—"\n\nДубинка врізалася хлопцеві в щелепу.\n\nАджані не пам'ятав, як вирішив рушити. Він лише пам'ятав, як пісок штовхнув його вперед. Він лише пам'ятав, як його кулак влучив у ціль. Він лише пам'ятав, як вихопив лом з рук одного з них і почав сліпо ним розмахувати.\n\nАле хлопці залишилися на дюнах. Червоне вже змили хвилі, утворивши у воді каламутний пурпуровий колір. Аджані подивився на свої руки. Вони тремтіли. Табличка все ще стояла на краю пляжу. Аджані підійшов до неї з ломом у руці."
 BAH_forpol.12.a: "І одним ударом він зламав першу стіну."

 BAH_forpol.13.t: "Втеча до кордону"
 BAH_forpol.13.desc: "Заштовхнувши повну валізу й відсунувши її вбік, Роланд Саймонетт гарячково озирнувся, намагаючись знайти ще одну. Цього разу гроші, звісно; більшість речей, які варто було зберегти, давно вже вивезли. Більшість знайомих йому місць давно спорожніли, але, перетрушуючи простирадла та підлогові дошки, він усе ще знаходив окремі купюри. На мить Саймонетт дозволив собі зупинитися, дивлячись на Нассау. Вулиці були порожні, але він знав, що більшість людей просто сиділи всередині, святкуючи з родинами.\n\nНе те щоб він коли-небудь хотів до них приєднатися, звісно. Щойно були оприлюднені Багамські документи, його повністю покинули. Іберійських дипломатів без церемоній відправили геть, членів мафії заарештували, американські представники пішли у відставку. Усе це, звісно, лише для показухи. Він знав, наскільки глибокими раніше були його зв'язки, але перед обличчям суспільного обурення це вже не мало значення. Після нищівної перемоги Піндлінга його корабель нарешті розбився; тепер не було сенсу залишатися в країні.\n\nСаймонетт востаннє перерив свої шухляди, вихоплюючи костюми заради пачок готівки й запихаючи їх до іншої валізи. Він відчував погляди своїх багамських працівників, але не збирався на них відповідати. Попри їхнє мовчання, він знав, як вони проголосували, і знав, що більше ніколи не побачить їх після сьогоднішнього дня. Помахом руки він наказав працівникові, що увійшов, винести валізу, а потім глибоко вдихнув. Нічого не залишилося, крім стін, порожніх шаф і незаправленого ліжка.\n\nПотім він вимкнув світло й кинувся з будівлі. Learjet позаду нього все ще завантажували багажем, але загалом він уже був готовий до польоту. На щастя, не всі його покинули; американський бізнесмен охоче дозволив йому скористатися запасним будинком, доки увага преси до нього не вщухне. Піднімаючись сходами, він востаннє дозволив собі відчути тепле повітря навколо, а потім пішов, спостерігаючи, як під'їжджає пара нових автомобілів."
 BAH_forpol.13.a: "Останній злочин перед тим, як поступитися увагою публіки."

 BAH_forpol.14.t: "Час закриття"
 BAH_forpol.14.desc: "М'яке сяйво заходу сонця заливало вікна казино Grande Cove, забарвлюючи приміщення палаючим помаранчевим відблиском морів затоки Ексума. Світла було мало; ще менше було тих, хто скаржився. Потік гостей програвав свої гроші, але їх ставало дедалі менше, і ніхто не приходив їм на заміну. Спостерігаючи за натовпом із приватної кімнати, троє американських бізнесменів, яким належало казино, мовчки журилися через майбутні збитки.\n\n"Ну, цей покидьок доводить справу до кінця," — пробурмотів Арчі Міллер, протираючи окуляри. "Піндлінг націоналізує заклад і, можливо, дасть нам човен, щоб вибратися з Багамських островів."\n\n"Педальний човен, хіба що," — поскаржився Кеннет О'Ніл, тицьнувши виделкою у свою тарілку. "Тепер зрозуміло, як такого дурня обрали ці люди." Він широко махнув рукою, вказуючи лише приблизно на офіціантку, що йшла проходом. "Надто ліниві, щоб на щось чекати, крім подачок!"\n\nМіллер кивнув. "У нас ніколи не було б цієї проблеми, якби Саймонетт досі був при владі. Він би владнав усе за секунду за кілька тисяч баксів."\n\nКларенс Бланкеншип подивився на порожні проходи перед собою, спостерігаючи за натовпом, який поступово скоротився до пари людей, що розігрували останні руки, і зітхнув. "Знаєте, можливо, це й на краще. Тепер, коли Піндлінг при владі, ці працівники стали ледачими. Вони думають, що країна належить їм — я навіть чув, як вони сміялися з приводу створення профспілки." Навколо нього піднялися брови, коли він похитав головою. "Ці тубільці завжди плетуть змови, щоб обікрасти вас за спиною, кажу вам."\n\nОбличчя О'Ніла стало похмурим, але він зітхнув. "Можливо, ти маєш рацію. Мені це не подобається, але, мабуть, у всього є свій кінець." Він повернувся до вина, глибоко ковтнувши й важко проковтнувши. "Та й Піндлінг був несправедливим зі своїми податковими вимогами.""
 BAH_forpol.14.a: "Техаський холдем."

 BAH_forpol.15.t: "Два типи справ"
 BAH_forpol.15.desc: ""Знаєш, можливо, після Багамських документів ця історія зникла з твоїх шпальт, але в історії Багамських островів є ще багато чого, що не стало відомим," — сказав Дональд Каллеґарі, розрізаючи піцу на своїй тарілці. Він зв'язався з New York Times, пообіцявши газетний матеріал, але навіть сидячи в ресторані, що належав його близькому другові в Брукліні, не хотів чекати до десерту.\n\n"Що ще тут можна сказати?" — запитав Александер Гінтон, проводячи ножем по скоринці перед собою. "Саймонетт працював із купою фашистів, кількох людей заарештували, і він програв із нищівною перевагою. Ніхто не зацікавлений перечитувати старі новини."\n\nКоли Гінтон закінчив, Каллеґір сердечно розсміявся. "Ти справді думаєш, що все закінчується на Саймонетті? Я сам трохи покопався, і Піндлінг ще гірший. Відколи він націоналізував це місце, він роздає контракти найбільш корумпованим людям Карибів." Він дістав велику пачку документів, ледь розсортованих по кількох папках.\n\n"Є така приказка, Дональде, про те, що не варто кидати каміння, живучи в скляному будинку," — відповів Джо Леон, пережовуючи пармезан. "Для пральні у тебе напрочуд брудні руки. Тебе заарештовували за відверту корупцію. У мене є друг у поліції, який розповідає про ще одне розслідування."\n\nГінтон кивнув. "Тобі досі нікому не вдалося пришити це, але всі бачать твої зв'язки з мафією. Ми знаємо, що вони розлючені після втрати Багамських островів; чому ми маємо тобі довіряти?"\n\n"Гей, я не прошу слави," — знизав плечима Каллеґарі, відкинувшись на стільці й порпаючись у чорному пальті. "Ти бачив моє досьє. Ти знаєш, що я вже отримав своє." Він кинув на стіл конверт, роздутий від купюр і гумок, і пішов. "Просто скажіть, що це від анонімного джерела.""
 BAH_forpol.15.a: "Преса та банда."

 BAH_forpol.16.t: "Закрити справу"
 BAH_forpol.16.desc: "Коли іберійського агента відправили на Багамські острови, йому сказали, кого очікувати і де з ним зустрітися. Вінсент Сентанні був описаний йому як товариська людина, чиї офіційні костюми контрастували з постійним почуттям гумору та широкою усмішкою. Поглянувши на фотографію, він побачив, що колишній образ давно зник. На самоті сидячи на табуреті в казино, де майже не було клієнтів, Сентанні виглядав зморщеним і похмурим, його волосся було скуйовджене, а піджак практично висів на плечах.\n\n"Сентанні?" Короткого погляду вгору було достатньо, щоб підтвердити його очевидне падіння. "Мадрид мене прислав. Ми отримуємо тривожні новини щодо нашої угоди про поставки до Ямайки."\n\nЗдавалося, слова ледве доходили до Сентанні, але він все одно кивнув. "Нещодавно заарештували багато важливих людей," — сказав Рабелліні, переглядаючи свій список. "Серджі, Ройбен, Еміліо, Міколау... це були хороші агенти, Омеро. Що сталося?"\n\n"Слухай, ким би ти там не був, зараз не найкращий час. Ми не знаємо хто, але хтось нас здав. Пряма лінія до FBI, і вони, ймовірно, вже про це знають. Напевно, це ще й хтось важливий, зважаючи на те, скільки людей накривають."\n\nЙого брови насупилися. "Це тривожно. Є ідеї, хто зрадник?"\n\n"Ні, і скоро ми не дізнаємося. Якщо ми втрутимося, американці просто заарештують усіх причетних. Якщо спробуємо самі знайти зрадника, то зрештою переб'ємо одне одного в нападі параної." Сентанні дістав сигарету, відчайдушно вовтузячись із запальничкою, коли підніс її до рота. "Якщо хочеш і далі кидати людей в американські в'язниці — будь ласка, але мафія вже не в тому становищі, щоб захищати твої кораблі."
 BAH_forpol.16.a: "Агент насупився, оплакуючи втрачені прибутки."

 BAH_forpol.17.t: "Зачистка"
 BAH_forpol.17.desc: "11:22 — Багамську поліцію ознайомлено зі стратегією, надано значне спорядження та інформацію про місцезнаходження ключових контрабандистів. Присутність безпосередніх агентів FBI мінімальна, але, схоже, багамська поліція зацікавлена в рейді, попри призов.\n\n17:55 — Протести на Ямайці проти репресивної політики Александера Бустаманте починають набирати сили. Увага тих, хто перебуває на Ямайці, включно з контрабандистами, до цього моменту має бути розпорошена. Відтепер починаються рейди.\n\n18:21 — Перший великий рейд проти контрабандистів у Монтего-Бей. Виявлено велику кількість заборонених речовин, особливо кокаїну. Дванадцятьох контрабандистів заарештовано, двох убито під час перестрілки. Виявлено та вилучено значний сховок зброї.\n\n19:10 — Відбуваються другий і третій великі рейди проти контрабандистів, спрямовані на склади за межами Мандевілля та Очо-Ріос.\n\nВ обох випадках знайдено небагато припасів і заарештовано лише п'ятьох людей, але захоплено велику кількість транспортних засобів. Двоє контрабандистів утекли, але невдовзі були вбиті під час перестрілки.\n\n21:42 — Четвертий великий рейд проти контрабандистів, спрямований на осередок у Блакитних горах, найближчий до Кінґстона. Схоже, це було серце операції: заарештовано п'ятдесят людей. Значна частина — ймовірні іберійські агенти, яких передано звичайним каналам, а також вилучено велику кількість зброї та припасів.\n\n23:39 — Остання велика операція проти контрабандистів у горах Драй-Гарбор. Сил було менше, але оборона була найбільш організованою: троє загинули до того, як осередок захопили. Припасів небагато, але виявлено велику кількість доларів; імовірно, осередок був попереджений про попередні рейди.\n\n23:40–01:00 — Операції із зачистки, зосереджені на ув'язненні тих, хто був ціллю, виведенні багамської поліції з Ямайки та підготовці пресрелізу. Окремі особи, ймовірно, залишилися на волі, але їх недостатньо, щоб зберегти мережу."
 BAH_forpol.17.a: "Повний успіх."

 BAH_forpol.18.t: "Розслідування"
 BAH_forpol.18.desc: "Коли Джон Ремзі вперше отримав дзвінок, його вуха насторожилися від того, що стояло за цими словами. Будь-який журналіст, гідний написаних ним статей, зацікавився б уже тим, що випливало з самого пресрелізу; американський уряд виявив приховану мережу, що пов'язувала латиноамериканських фашистів і мафіозі з Іберійським Союзом, об'єднаних через Багамські острови? Обіцянка отримати доступ до повних документів лише посилила його увагу. Ремзі був упевнений, що за цими товстими томами ховається щось більше.\n\nЧим більше він читав, тим сильніше зростав його інтерес. Пресрелізи згладжували будь-які сумніви, замінюючи їх жорсткими засудженнями Франко та Саймонетта, але під ними була очевидна справжня вага Багамських документів. Було чітко показано, що американські чиновники та американські політики охоче співпрацювали з фашистами й мафією, коли це приносило прибуток. Самих зв'язків між деякими переліченими сенаторами вистачило б, щоб заповнити заголовки на цілий тиждень по всій країні.\n\nПринаймні, так він думав. Щойно він спробував розширити своє розслідування за межі невеликого кола, про яке розповів президент [USA.GetLeader], його матеріали почали блокувати. Йому казали, що це не їхня сфера, або що в матеріалі недостатньо змісту для справжньої публікації, або що це криптояпонська змова, або що це рівень жовтої преси, або що вони не можуть оплатити подальші судові витрати для захисту від позовів про наклеп. Як би він не намагався переконати їх, із ким би не говорив, ніхто не слухав.\n\nЗа кілька днів Ремзі звернувся до Village Voice. Його матеріал і досвід були нетиповими, і йому було незручно через те, наскільки лівою була газета, але він вважав це кращим за нічого, а його запевнили, що власне написання значною мірою не залежатиме від редакційного колективу. Протягом дня новина про історію розійшлася телефонними лініями та мережами, а протягом тижня матеріал уже був на перших шпальтах контркультурних газет по всій країні."
 BAH_forpol.18.a: "Але для читачів заголовок уже давно згас."

 BAH_forpol.19.t: "Відновлення союзів"
 BAH_forpol.19.desc: "Тепле повітря огортало Теодора Аллана, коли він ішов через вестибюль готелю Flamingo. Його розкіш здавалася іншим світом порівняно з ґрунтовими дорогами, якими його везли після прибуття на Багамські острови, але все це зникло, коли він відчинив двері Сіґела. Після обуреного вигуку через його втручання Аллан швидко заговорив.\n\n"Багсі Сіґел, я з FBI. Я знаю, що ти контрабандою переправляв товари на Ямайку разом з Іберією." Аллан грюкнув документом по столу. "Еміліо Ескрібано. Міколау Віседо. Даві—"\n\n"Я працюю з багатьма хлопцями." Сіґел зберігав спокій, але легкий натяк на занепокоєння його видавав. "Я бізнесмен. Що ти хочеш, щоб я сказав?"\n\nАллан підняв папку. "Я можу віднести це директору FBI і змусити його злити все це в пресу. Поліція Невади була в люті, що ми відпустили тебе на волю з самого початку, а тепер це? За державну зраду передбачена смертна кара, знаєш. Або ти можеш говорити."\n\n"Навіщо говорити?" — запитав Сіґел, нервово наказуючи зачинити двері.\n\n"Ми дозволимо тобі залишити все це собі. Можливо, навіть заплющимо очі на те, чим твої люди останнім часом займаються в Квінсі." Аллан нахилився, тикнувши пальцем просто в груди Сіґела. "Але ти розкажеш нам про кожен район тут, на який має вплив Іберія."\n\nБагсі Сіґел похнюпився, опустившись у крісло. "До того часу, коли я зберу достатньо інформації для роботи, мої спільники дізнаються, хто зрадник, і—"\n\n"Ти вже мертвий, Багсі. Де ти волієш отримати кулю? На своєму троні чи на стільці?" Аллан вказав на номер телефону. "Я знаю, які ви, мафіозі. Ти досить скоро даси мені те, чого я хочу.""
 BAH_forpol.19.a: "Брудна угода за безцінь."

 ## Bahamas News Events
 
 BAH_News.1.t: "[Get_newspaper_header]На Багамських островах встановлено правління більшості на тлі скандалу"
 BAH_News.1.desc: "Після нещодавнього скандалу, пов'язаного з кількома багамськими урядовцями, кабінет Роланда Саймонетта колективно подав у відставку з ганьбою, поклавши край гегемонії Об'єднаної багамської партії та правлінню білих. Водночас із іншими рухами за деколонізацію в регіоні розслідування виявили зв'язки родини Саймонеттів з американською мафією, що породило чутки про те, що американський тиск відіграв ключову роль у падінні UBP.\n\nЛінден Піндлінг був призначений першим чорношкірим прем'єр-міністром за народним мандатом і пообіцяв побудувати Багамські острови, які служитимуть своєму народу. Однак залишки старої владної бази залишаються постійною перешкодою для справжніх реформ через свою імперію злочинів і пороків. Реформувати економіку, цілком переплетену зі старими колоніальними порядками, буде важкою боротьбою.\n"
 BAH_News.1.a: "Добра боротьба ніколи не припиняється, доки ми продовжуємо боротися."

 BAH_News.2.t: "[Get_newspaper_header]Правління білих на Багамських островах ледве животіє"
 BAH_News.2.desc: "Попри тиск Вільного світу та крики протесту власного народу, Багамські острови залишаються непохитними у своїй прихильності до правління білих, оскільки останні вибори приводять ще одного представника династії Саймонеттів, Роберта "Боббі" Саймонетта, на посаду прем'єр-міністра. Відомий своїми зв'язками зі злочинними синдикатами, а також численними звинуваченнями в неправомірній поведінці, син покійного Роланда Саймонетта, який любив яхти, останнім часом зазнав нападок з боку дисидентів, які називали його "мафіозі, непридатним до управління".\n\nПісля вступу Саймонетта на міністерську посаду оглядачі також відзначили, що подальша співпраця родини з давньою політичною клікою Багамських островів, відомою як Bay Street Boys, ще більше підриває внутрішню підтримку нинішнього режиму меншості. Поки що, однак, принц може спокійно сидіти на своєму троні, безтурботний, як завжди.\n"
 BAH_News.2.a: "Кому потрібна популярність, коли у твого татка були друзі?"

 BAH_News.3.t: "[Get_newspaper_header]Перший чорношкірий прем'єр-міністр Багамських островів"
 BAH_News.3.desc: "Багамські острови досягли історичної віхи, оскільки нещодавні вибори принесли "правління більшості" цій маленькій державі. Хоча Об'єднана багамська партія залишається при владі, держава отримала свого першого чорношкірого прем'єр-міністра, Кендалла Айзекса, який відтіснив олігархію Bay Street Boys назад у невідомість.\n\nЦей результат був зумовлений посиленням впливу США в регіоні після падіння британської колоніальної влади. Рішення UBP висунути Айзекса кандидатом, як повідомляється, було кроком до задобрювання Вашинґтона та дистанціювання від правління білої меншості, яке характеризувало партію. Багато хто припускає, хоча й без підтверджень, що Bay Street Boys досі мають де-факто вплив на оновлений кабінет, а Айзекс залишається не більше ніж маріонеткою.\n"
 BAH_News.3.a: "Сонячніший день із яскравішим обличчям."

## Jamaica Flavor Events

 JAM_flavor.1.t: "Різка зміна курсу"
 JAM_flavor.1.desc: "Александер Бустаманте стоїть непохитно, поки тіні Будинку штаб-квартири, що нависає над ним і його кабінетом, повільно відступають. Збитки, завдані заворушеннями, залишили Ямайку з мізерним бюджетом. Багато хто очікує, що Бустаманте оголосить про допомогу від ОВН, щоб компенсувати збитки, завдані заворушеннями. Надрукована промова Бустаманте спростує ці чутки.\n\n"Незалежний комітет провів ретельне розслідування відповідальних за трагічні смерті в нашому суспільстві, і наші висновки виявили кричущу спробу та зраду нашої автономії!" Його характерний пишномовний і піднесений тон був на місці; однак якимось чином у ньому також звучала зловісна нотка. "Ми дійшли висновку, що ці зацікавлені групи справді отримували повну підтримку, постачання та зв'язок від іноземних сил, головним чином від розвідувальних відомств Сполучених Штатів Америки."\n\nКоли CBS транслювала монументальну промову Бустаманте мільйонам американських домівок, репортер на місці лише зблід, коли Бустаманте висунув шокуюче звинувачення, що його найнадійніший союзник намагався усунути його від влади, коли жар заворушень ледь згас. Не потрібні були жодні коментарі, щоб зрозуміти серйозність його майбутньої заяви.\n\n"Ямайці не повинні дозволяти, щоб кожен аспект їхнього суспільства надалі диктували зловмисні чужинці з-за кордону — ні Америка, ні Британія. Ми повинні зробити прикрий крок і відокремитися від британського контролю та прокласти власний шлях уперед, проголосивши незалежність як республіка, без пауз і зволікань!" Обурені вигуки швидко заглушили нечисленні оплески аудиторії. "Щоб зберегти наш суверенітет, ми повинні вийти з переговорів щодо Федерації Вест-Індії!"\n\nОскільки ситуація не заспокоїлася після протестів аудиторії, фотожурналіст у самій гущавині подій зафіксував його фотогенічну мить:"
 JAM_flavor.1.a: "Бустаманте на сонці, його кабінет у тіні."

 JAM_flavor.4.t: "Новий рятівник"
 JAM_flavor.4.desc: "Канадці, американці та британці. Делегати належали до вже неіснуючої Комісії Вест-Індії та похмуро прямували до літаків, які мали в один бік повернути їх до рідних країн. Для іберійського посла на Ямайці їхній відліт викликав легку усмішку — можливо, вони вже ніколи не повернуться.\n\nЗухвала промова Бустаманте потрапила на перші шпальти як в Америці, так і в Іберії не лише через раптову зміну зовнішньої політики, а й через те, що ямайська делегація стрімко зблизилася з Іберійським Союзом. У відповідь іберійський посол мав бути присутнім на конференції з підписання нової конституції.\n\nУся ця вистава з новою конституцією була димовою завісою, що приховувала її справжнє значення: легалізацію необмеженого права Бустаманте на постійне правління. У ній прямо зазначалося, що він стає "президентом довічно", більше не просто прем'єром Ямайки, а проголошується "національним засновником" Ямайки. Його протеже та заступник, Дональд Сенґстер, мав замінити його на посаді прем'єр-міністра. Ніхто не очікував, що Сенґстер матиме реальну владу, коли Бустаманте зберігав значну її частину. Навіть Сенґстер цього не очікував.\n\nКакафонія спалахів камер зустріла посла, коли той прибув до Jamaica House зі своїм кортежем. Пробираючись до урочистих столів, він зі свого місця помітив Сенґстера та делегацію ЯЛП. Напружені плечі та переважно мовчання, з кількома натягнутими усмішками. Послу було байдуже, якщо їх протягнуть через це проти їхньої волі, коли він сів на відведене йому місце. Коли Бустаманте виголосив вступну промову, він досить наполегливо заявив, що, оскільки Америка зірвала "їхній" план усунути його від влади, він вітає подальшу допомогу іберійців у розвитку Ямайки."
 JAM_flavor.4.a: "Посол не зміг стримати короткої усмішки."

 JAM_flavor.5.t: "Непрямі дії"
 JAM_flavor.5.desc: "Зазвичай подорож із Ямайки до Пуерто-Рико була швидкою та легкою, але сьогодні Едварду Сіґа довелося подорожувати інкогніто. Якби хтось знав, куди він прямує або з ким зустрічається, шанси дожити до п'ятдесяти років значно зменшилися б.\n\nПісля прибуття до Сан-Хуана Сіґа об'їзним шляхом дістався місця зустрічі та непомітно залишив знак на стіні будівлі, щоб повідомити, що він готовий. Через п'ять хвилин під'їхала машина, щоб відвезти Сіґу до відділення FBI. Після обшуку Сіґу провели всередину на зустріч із Теодором Шеклі, начальником відділення.\n\n"Перепрошую за обхідні методи, містере Сіґа, але обережність ніколи не завадить."\n\nСіґа відмахнувся від побоювань. "Не треба, це цілком раціонально. Таку мелодію я готовий слухати. Цими днями мені залишається лише божевілля Басти." Сіґа кашлянув, прочищаючи горло, перш ніж продовжити. "Цей чоловік, здається, змінює свою думку за помахом капелюха, а потім змінює її знову, коли підіймає його. Відмовитися від союзу з Америкою заради чого? Іберійців? Цей чоловік напівбожевільний, заради Бога."\n\nШеклі заперечив. "І все ж він має значну стійку громадську підтримку."\n\n"Не серед ЯЛП. Ядро партії все ще існує й лише чекає нагоди вибити з-під нього ґрунт. Сенґстер — кишеньковий прем'єр-міністр Бустаманте, але мало хто його поважає; я не впевнений, що він здатен на самостійну думку. Якщо ми можемо розраховувати на підтримку США, ми зможемо повернути Ямайку до нашого табору, подалі від Іберії. Інакше Ямайка стане біднішою, а позиції Сполучених Штатів у Карибах ослабнуть. Не думаю, містере Шеклі, що це відповідає інтересам будь-кого з нас.""
 JAM_flavor.5.a: "Ви маєте рацію, містере Сіґа, безперечно не відповідає."
 JAM_flavor_5_tt: "Наші позиції в §&Ямайці§! могли ослабнути, але ми ще не вибули з гри.\nМи співпрацюватимемо з §aЕдвардом Сіґою§!, щоб позбутися §dБустаманте.§!"

