# Багами
 BAH_Roland_Theodore_Symonette: "Роланд Теодор Саймонет"
 POLITICS_BAH_ROLAND_THEODORE_SYMONETTE_DESC: "Від часів контрабанди алкоголю під час сухого закону до посади прем'єр-міністра Багам Роланд Т. Саймонет завжди залишався бізнесменом у душі. Відтоді як острови отримали самоврядування у 1950-х роках, Саймонет утримував при владі білу аристократію Об'єднаної Багамської партії, також відому як «Хлопці Бей-стріт», використовуючи безжальні методи, які часто нагадують методи його покровителів із організованої злочинності.\n\nПопри расове джеррімендерінґ та корупцію, Саймонет безперечно сприяв розвитку економіки Багам. Розкішні казино та пишні пляжні курорти привабили туристів з усіх куточків Америки, але мало цього багатства вийшло за межі особняків на Бей-стріт.\n\nТак, бізнес процвітає, але Саймонет знає, що він не безсмертний. Як і належить доброму аристократу, він уже почав намагатися навчити свого сина Боббі Саймонета тонкощів управління державою — принаймні тоді, коли йому вдається відірвати зухвалого плейбоя від канатів на його яхті."

 BAH_Bobby_Symonette: "Боббі Саймонет"
 POLITICS_BAH_BOBBY_SYMONETTE_DESC: "Мало хто викликає такий образ, як Роберт Саймонет. Очевидний спадкоємець статків імперії Саймонетів, Боббі сходження до влади давалося майже так само природно, як і його захоплення яхтингом. Народившись 1925 року, завдяки багаторічному впливу його батька в Палаті представників Багам Боббі зміг не лише увійти до її складу, а й повністю посісти посаду спікера, ще тісніше пов'язавши цю інституцію з прізвищем родини. Підтримуваний корпоративним впливом, таємним фінансуванням від казино та установами по всіх Бага́мах, Боббі мчить уперед за попутним вітром.\n\nТож цілком доречно, що життя Боббі значною мірою поглинає одна з небагатьох інституцій — яхтинг. Один із засновників Яхтової асоціації, Боббі Саймонет є постійним і вправним учасником Олімпійських ігор та вже привіз додому чимало золотих медалей. У багатьох колах Саймонета регулярно обговорюють як визначну постать, але лише в небагатьох із них йдеться про політичну сферу.\n\nЩе менше людей викликають такий рівень ненависті, як Саймонет. Спадкоємець білої політичної династії, яка десятиліттями допомагала домінувати в політиці Багам, він викликає дедалі більше роздратування своїми міжнародними пригодами та привілеями, які вони уособлюють. Поки багамці продовжують потерпати від гострих нестатків, вони втомлюються від новин про те, як він здобуває золото для себе на Олімпійських турнірах по всьому світу. Коли люди чують про його пригоди, вони бачать лише наймолодшого з «Хлопців Бей-стріт», якого вперед веде непотизм."

 BAH_Kendal_Isaacs: "Кендал Айзекс"
 POLITICS_BAH_KENDAL_ISAACS_DESC: "Старий порядок залишається, але його новий нахил очевидний. Народившись 1925 року, Кендал Айзекс став одним із небагатьох, хто навчався в урядовій середній школі, і після цього його лояльність залишалася незмінною. Під час Другої світової війни він служив у Північнокарибських силах, але лише наслідки операції «Морський лев» змусили його змінити плани. Після цього він вивчав право, спочатку вступив на державну службу, а 1961 року був призначений генеральним соліситором, а 1963 року — генеральним прокурором.\n\nЗвідси його вступ у політику не був надто складним, як і встановлення його подальших зв'язків. Швидко влившись у потрібні кола, Айзекс зрештою зміг піднятися до вершин Об'єднаної Багамської партії, щоб допомогти їй зовні дистанціюватися від свого минулого. Партія може погодитися на відхід своїх колишніх публічних діячів, але її фундамент і надалі міцно проникає у свідомість багамської нації.\n\nНа папері від Айзекса очікують захисту інтересів традиційних аристократичних еліт, які продовжують підтримувати ОБП, аж до його палкого захоплення тенісом. Однак Айзекс не задовольняється простим дотриманням лінії партії. Під тиском реформаторів і Піндлінґа, що дедалі посилюється, Айзекс швидко звернув до повної поміркованості, сподіваючись знайти прийнятний компроміс для обох сторін. Лише час покаже, чи допоможе такий крок зберегти частину його старих політичних союзників."
 
 BAH_Lyndon_Pindling: "Ліндон Піндлінґ"
 POLITICS_BAH_LYNDON_PINDLING_DESC: "Багамська терпимість до старого порядку згасла, а разом із нею Піндлінґ знову опинився на новому місці. Син ямайського батька та матері з Аклінса, Піндлінґ провів значну частину юності, переходячи з однієї школи до іншої, аж поки не став одним із лише двадцяти учнів, які вступили до Урядової середньої школи. Після отримання права на адвокатську практику в Кінгс-коледжі Піндлінґ приєднався до Прогресивної ліберальної партії як юридичний радник у 1953 році, перш ніж у 1956 році увійти до парламенту й невдовзі бути проголошеним лідером.\n\nСкандал, що огорнув його попередника, можливо, й хапав його за ноги, але Піндлінґ залишається відданим баченню, яке відривається від спадщини аристократичної еліти. Прагнучи зрештою здобути незалежність Багамських Островів, Піндлінґ просуває перерозподільче бачення, прагнучи спрямувати прибутки від туризму на покращення життя пересічного багамця. Однак Піндлінґ не є революціонером; його бачення все ще зберігає багато попередніх економічних порядків та здобутків, які вони приносили.\n\nНе всі вітали його успіх. Його відносна ворожість до туризму не залишилася непоміченою численними американськими та канадськими корпораціями, що працюють тут, і багато хто почав писати про нього, навіть усередині партії, якою він керує, як про простий синонім Фіделя Кастро. Для багатьох корінних багамців, однак, Піндлінґ є рятівником, батьком-засновником, оповитим знаменами, які справжній національний герой лише й міг би нести."

 
