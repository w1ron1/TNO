 JAM_flavor.60.t: "Зачіска"
 JAM_flavor.60.desc: "Це явно була помилка.\n\nО, звісно, вона знала це ще задовго до того, як придбала квиток на рейс до Кінґстона на свою мізерну докторську стипендію. Так, вона була молода, значно молодша за більшість присутніх. До того ж жінка, та ще й не настільки відома, щоб її ім'я мало вагу Аршимед чи мадам Блуен. І найгірше з усіх гріхів: вона була янкі, родом із самого імперіалістичного серця, падіння якого тут зібралися планувати.\n\nТа все ж вона зробила більше, ніж належало б на її долю організаторської роботи. Її однокурсники за її закликом виходили на вулиці Сан-Дієґо, маршували й ревіли, вимагаючи прав для тих, хто страждав під тим самим гнітючим ярмом. Вона конфліктувала зі своїми товаришами по руху за громадянські права, які заперечували, що за права жінок варто боротися так само, як і за інші, і зневажливо дивилася на тих, хто відкидав її пропагування діалектики та класової свідомості як чоловічу білу справу.\n\nАле спостереження за тим чистим і неприборканим вогнем, що щойно палав у цих чотирьох стінах, немов зробило все це абсолютно безглуздим.\n\nНе лише її боротьбу, а й усю боротьбу вдома, яка досі насмілювалася називати себе революційною. Поки все, чого вони могли сподіватися досягти, — це привести до Білого дому трохи менш упередженого костюма й отримати якесь символічне визнання, яке ніколи не захистило б їх від багаття Ку-клукс-клану, люди, що зібралися тут, розпалювали щось значно, значно більше; тож чому вона спускалася сходами лекційної зали, досі наповненої вогнем карибських соціалістів, намагаючись домовитися про зустріч із—\n\n«Містере Страчен, можна вас на слово?» Але щойно речення злетіло з її вуст, сумніви так само покинули її думки, знову поступившись місцем тій самій витримці й упевненості, які вже привели її так далеко. Бо якщо вона зможе принести додому хоча б іскру цього вогню... «О, перепрошую. Де мої манери?»"
 JAM_flavor.60.a: ""Анжела Девіс", — продовжила вона, простягаючи руку для рукостискання. — "CPUSA.""

 JAM_flavor.61.t: "Бобу Марлі відмовлено у в'їзді до Сполучених Штатів"
 JAM_flavor.61.desc: "ВІД ДЖОНА ЛІНКВІСТА\n\nМАЯМІ, [GetDateText] — Боб Марлі, засновник і лідер The Wailers, прибув до Міжнародного аеропорту Маямі близько 15:00 із міжнародного аеропорту Страчена, щоб розпочати своє турне на підтримку майбутнього альбому Soul Rebels. Однак агенти TSA, що перебували там, відмовили музикантові у пропуску на підставі «геополітичних міркувань». Після повернення до Кінґстона The Wailers невдовзі оголосили про скасування виступів у межах турне.\n\nПредставник Управління транспортної безпеки у відповідь на обурення шанувальників реґі-виконавця заявив, що небезпечні зв'язки з режимом Страчена стали головною причиною відмови у в'їзді.\n\n«Для забезпечення стабільності політичної атмосфери нашої держави доцільно не дозволяти будь-яким нібито невиявленим особам, що становлять інтерес, прищеплювати американському народу радикальні способи мислення». — уривок із опублікованої заяви.\n\nОрганізації із захисту громадянських прав засудили рішення заборонити турне та несправедливо звинуватити The Wailers. Вітні Янґ, виконавчий директор Національної міської ліги, провідної організації, спрямованої на сприяння громадянській рівності, висловив своє невдоволення в телефонному інтерв'ю. Пан Янґ назвав цей крок «перешкодою для розширення прав чорношкірих» і висловив думку, що скасування турне може послабити увагу громадськості до расової рівності.\n\nВідтоді як насильницька революція скинула Бустаманте з влади, новий лівий режим на Ямайці постійно перебуває у суперечливих двосторонніх відносинах зі Сполученими Штатами..."
 JAM_flavor.61.a: "Тінь накриває Ярді."

