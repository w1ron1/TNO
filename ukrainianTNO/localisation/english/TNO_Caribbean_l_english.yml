 JAM_flavor.16A.t: "Назад у чорне"
 JAM_flavor.16A.desc: "Едвард Сіґа сидів у своєму офісі й набирав номер 787, військової бази в Сан-Хуані. Йому було нестерпно спекотно, вентилятор працював, а вікна були відчинені, поки він чекав на ремонт свого кондиціонера. Ззовні було чути приглушені постріли. Ямайка балансувала на краю забуття. «Алло? Полковнику Гарту? Це пан Сіґа», — сказав він у слухавку.\n\nВін почув, як полковник прочистив горло, перш ніж відповісти: «Пане Сіґа, як ви? Ми здивовані, що чуємо від вас—» Едвард перебив: «Через відключення електрики? Урядові будівлі мають аварійні генератори та все таке». Він визирнув у вікно й побачив море чорряви. Світло в будівлях Кінґстона зникло, а на його місці тепер були палаючі бочки та крики в темряві.\n\n«У будь-якому разі, я телефоную, щоб повідомити, що чутки про Дональда Сенґстера правдиві. Він помер від інсульту кілька годин тому. З Бустаманте також ніхто не може зв'язатися. Схоже, ніхто не хоче очолювати Ямайку».\n\n«В-він помер? О чорт, я маю поставити вас на утримання на секунду—» Полковника перебив Сіґа."
 JAM_flavor.16A.a: "«Не хвилюйтеся, я скоро знову візьму кермо у свої руки»."
 JAM_flavor.16B.t: "У центрі уваги"
 JAM_flavor.16B.desc: "Луїс Ґонсалес-Мата поспішав Кінґстоном, намагаючись не привертати уваги. На купах уламків чоловіки стріляли й кололи одне одного, освітлені лише вогнем із бочок. Люди вибігали на вулиці, щоб відкрити пожежні гідранти й отримати полегшення від суворої літньої спеки. Здавалося, ніби вся Ямайка зламалася після смерті Дональда Сенґстера.\n\nСам Бустаманте зник — можливо, мертвий, можливо, переховується. Коли почалися відключення електрики, він зник. Луїс прямував до Г’ю Ширера. Якщо хтось і міг повернути хоч якусь стабільність, то це був він, або принаймні Луїс сподівався на це.\n\nЛуїс вважав себе кращим за пересічну людину, пробираючись крізь темряву наляканим, поки звичайні люди сиділи замкнені у своїх квартирах. Він був розумною людиною, яка прожила життя, сповнене сміливих пригод в інших країнах. Тепер він був нічим не кращий за людей Ямайки, яких вважав дурнями, з усіма їхніми надіями, зосередженими на одній людині."
 JAM_flavor.16B.a: "Луїс вийшов праворуч."
 JAM_flavor_16_tt: "Результати наших зусиль у §&Ямайці§! будуть розкриті незабаром." #To any better writer than me, feel free to improve my lines

