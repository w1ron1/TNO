 JAM_Norman_Manley: "Норман Менлі"
 POLITICS_JAM_NORMAN_MANLEY_DESC: "Походячи з мулатської родини та отримавши академічне виховання, Норман Менлі був головним покровителем Александра Бастаманте до Другої світової війни. Від самого початку своєї кар'єри він розглядав профспілковий рух як боротьбу за всіх і заради цієї справи вів численні законодавчі битви, щоб зберегти його як опору прогресивізму. Але він так і не зміг повністю передбачити зраду власного двоюрідного брата, який мав виступати головним представником цього ідеалу, але зрадив його заради крихти влади, що стікала з Оттави.\n\nХоча відокремлення Ямайської лейбористської партії від ННП саме по собі навряд чи було ганебним, Менлі бачив це інакше. Для Менлі його двадцятирічне суперництво з Бастаманте було не лише через підтримку Бастаманте уряду, рішуче налаштованого придушити мирну кампанію за загальне виборче право. Це була трагедія, коли близький родич виявився зрадником. Протягом 50-х і 60-х років він безперервно виступав як найсильніша опозиція Бастаманте, водночас виховуючи свого сина Майкла, щоб той продовжив його місію зі повалення ЯЛП.\n\nФедераліст і класичний фабіанський соціаліст, Менлі не є радикалом, не більше за тих, хто зрадив свою справу заради консервативного елітизму. Тепер, коли машина Басти падає, а на її місці постає Ямайська республіка, спадщина Менлі, якщо не його принципова опозиція, стане спадщиною засновника нації — символічного тимчасового президента. Хоча його дні полічені, він принаймні може померти щасливим, знаючи, що Ямайка рухається до справедливішого устрою, який є чимось більшим за обман."

 JAM_Michael_Manley: "Майкл Менлі"
 POLITICS_JAM_MICHAEL_MANLEY_DESC: "Син ветерана-державника Нормана Менлі, Майкл Менлі, народжений 10 грудня 1924 року, є ходячим визначенням шампанського соціаліста — заради народу, через народ, але ніколи не з народу. Під час Другої світової війни, коли політична кар'єра його батька змістилася від лідерства до дисидентства після переходу Бастаманте від Народної націоналістичної партії, Майкл здобував політичну репутацію в Королівських військово-повітряних силах. Під час служби він завів багато англійських друзів і, на свій жаль, також несвідомо перейняв манери стриманих британців зі свого кола.\n\nПихатий та англізований, Майкл усе ще вважає Ямайку своєю батьківщиною. У міру того як Канада продовжувала підтримувати диктатуру Бастаманте, стаючи дедалі замкнутішою за рахунок ямайських реформаторських зусиль, Майкл і його батько, не маючи кращих варіантів, присягнули на підтримку республіканської справи. На відміну від безсоромно привілейованого Нормана, Майкл прагне позбавити ННП репутації лівої партії еліти, тепер, коли партія більше не бореться лише за те, щоб втриматися на плаву.\n\nТака мета була б сизіфовою, поки Союз Басти тримав би робітничий клас у лещатах, але після повалення Бастаманте ННП під керівництвом Майкла робить кроки до запровадження популістської риторики. Хоча Майкл не хоче ставати ще одним Бастою, він не бачить проблеми в тому, щоб заплющити очі, якщо його проблеми зникнуть непомітно. У його демократичній Ямайці північним корпораціям і місцевим порушникам спокою не надають більшої поваги, ніж вони заслуговують."
 POLITICS_WIN_MICHAEL_MANLEY_DESC: "Син ветерана-державника Нормана Менлі, Майкл Менлі, народжений 10 грудня 1924 року, є ходячим визначенням шампанського соціаліста — заради народу, через народ, але ніколи не з народу. Під час Другої світової війни, коли політична кар'єра його батька змістилася від лідерства до дисидентства після переходу Бастаманте від Народної націоналістичної партії, Майкл здобував політичну репутацію в Королівських військово-повітряних силах. Під час служби він завів багато англійських друзів і, на свій жаль, також несвідомо перейняв манери стриманих британців зі свого кола.\n\nПихатий та англізований, Майкл усе ще вважає Ямайку своєю батьківщиною. У міру того як Канада продовжувала підтримувати диктатуру Бастаманте, стаючи дедалі замкнутішою за рахунок ямайських реформаторських зусиль, Майкл і його батько, не маючи кращих варіантів, присягнули на підтримку республіканської справи, а зрештою й Федерації Вест-Індії, залишивши його виборчим голосом західноіндійських лівих.\n\nПопри свої сумніви, Менлі тепер править об'єднаною Федерацією Вест-Індії, яку підтримує його тринідадський союзник Ерік Вільямс. Через вагання американських і канадських союзників він прагнутиме централізованої, орієнтованої на розвиток Федерації. Приватно Менлі переконує себе, що це здійснення мрії його батька про процвітаючі Кариби, але в міру того як його американські союзники дедалі більше відсторонюють його, а вплив Вільямса та центральне значення тринідадської нафти лише зростають, Менлі побоюється, наскільки справдяться його очікування."

 JAM_Donald_Sangster: "Дональд Сенґстер"
 JAM_Hugh_Shearer: "Г'ю Ширер"
 POLITICS_JAM_HUGH_SHEARER_DESC: "Країна — це корабель; їй потрібна вправна рука, щоб ним керувати. Це особливо актуально для нації, розділеної морем, як Федерація Вест-Індії. Народжений у 1923 році, Г'ю Ширер виріс поблизу Трелоні, зрештою здобувши юридичну освіту в Університеті Говарда у Вашингтоні, округ Колумбія, але присвятив свою увагу своїй газеті «Ямайський робітник», вибудовуючи зв'язки з ямайським робітничим класом і, що важливіше, потрапивши під опіку Александра Бастаманте.\n\nНаступні десятиліття його життя були визначені цим союзом, який поволі заплямовував його корупцією, навіть коли він здобував прихильність ширшого робітничого руху. Вперше обраний до Палати представників Ямайки у 1955 році, він поступово піднімався кар'єрними сходами Ямайської лейбористської партії, зрештою отримавши призначення до Сенату після поразки на виборах. Кінґстонська конференція офіційно зробила його правою рукою Бастаманте, а невдовзі він став головною силою карибських і ямайських правих.\n\nКоли Г'ю Ширер дивиться в майбутнє, він бачить лише бурю, що насувається на горизонті. Лівізм і панафриканізм загрожують розірвати хитку єдність Федерації, тоді як радикальні політики та діячі постають айсбергами, кожен із яких загрожує потопити її вже й так безладні інституції та економіку. Тепер, будучи прем'єр-міністром, Ширер наближає Кінґстон до Вашингтона й Оттави. У його розумінні, можливо, це приведе державний корабель до безпеки."
 
 JAM_William_Strachan: "Вільям Страчен"
 POLITICS_JAM_WILLIAM_STRACHAN_DESC: "Біллі Страчен — нова людина нової ери. Людина на кшталт Леніна, Че чи Хо Ші Міна. Народжений у 1921 році в переважно білому районі Кінґстона, Страчен навчався у престижній чоловічій середній школі Волмера. Будучи одним із небагатьох темношкірих учнів, під час навчання він зіткнувся з расизмом, а також став свідком масових заворушень, спричинених Великою депресією, і навіть побачив формування Народної національної партії.\n\nПопри майбутнє революціонера та дитинство, сповнене расизму, після початку війни з Німеччиною Страчен вступив до Королівських військово-повітряних сил. За час служби він пережив авіакатастрофи, обстріли, бомбардування та зіткнення в повітрі. Прослуживши Британії до її падіння, він був евакуйований на Захід, назад на Ямайку, де побачив систему, надто схожу на британський колоніалізм.\n\nВідтоді він швидко став визначною постаттю антиканадських і антибастамантистських лівих. Разом зі своїм однодумцем-лівим Річардом Гартом вони заснували Рух народної свободи, відмовившись від ННП, яку вважали надто поміркованою. Не дивно, що Бастаманте заборонив організацію, а Страчен, проти якого вже було видано ордер на арешт, вирушив у вигнання та допомагав кубинцям у їхній революції. Потім він приєднався до Карибського легіону та створив власний виключно чорний контингент — Бригаду Чорної Зірки.\n\nТепер він повернувся, наче Наполеон з Ельби чи Ленін із Заходу. На трупі Бастаманте та в коаліції чорних націоналістів, комуністів і поміркованих соціалістів Біллі має показати світові нову Ямайку, поки американці тягнуться до кобури. Для соціалістів це не буде легким шляхом: Страчен уже стикається з тиском авангардистського та демократичного крил своєї коаліції, але якщо й існує людина, здатна їх об'єднати, то це Біллі."

 JAM_Edward_Seaga: "Едвард Сіґа"
 POLITICS_JAM_EDWARD_SEAGA_DESC: "Едвард Сіґа, народжений у 1930 році в родині янкі змішаного походження, — сучасний ямайський універсал: інтриган, музичний продюсер і, що найважливіше, спадкоємець ЯЛП. Бастаманте вважав Сіґу хлопчиком на побігеньках, який мікрокерував районами Кінґстона, але майстерність Сіґи у використанні патронажу допомогла йому створити імперію завдяки закулісним угодам та обмінам. У Тіволі-Ґарден він перетворив бідну громаду на власне феодальне володіння. Потім, завдяки тій самій невтомній праці, знову й знову, численні громади впали до його ніг.\n\nЗавдяки своєму вмінню планувати, посеред заворушень на Ямайці, Сіґа є ключем до того, щоб утримати Лейбористську партію на ногах і серед простих людей. Але він був лише інструментом, а не продуктом. Ще кілька місяців тому ніхто не вважав його наступником Басти, але Сіґа не впав у відчай. Йому не потрібно було доводити їхню неправоту полум'яними словами — він знав свою перевагу й вирішив нею скористатися. Один лише зовнішній вигляд, що дозволяє сприймати його за білого, значно полегшує сприйняття партії як іноземцями, так і виборцями.\n\nПрихильники Сіґи знають його за обличчям, а він знає їх за основними цінностями. Хоча він навчався в Гарварді афрокарибської культури, він є політичним реакціонером — незвичним серед своїх однолітків, але добре пристосованим до ямайських умов. Він проголошує пуританські цінності, але ніколи нікого не дискримінує. Післябастамантистській ЯЛП знадобиться поміркований консерватизм, щоб вписатися в дедалі прагматичніший світ, а за правильних стратегій зробити його популярним може бути не складніше, ніж вивести реґі на широку сцену."

 JAM_Richard_Hart: "Річард Гарт"
 POLITICS_JAM_RICHARD_HART_DESC: "Річард Гарт увійшов у ямайську політику в 1937 році після здобуття освіти в Англії. Разом із Норманом Менлі Гарт став одним із засновників Народної національної партії — широкої партії, що виступала як більш ліва альтернатива ЯЛП. Попри те, що раніше він підтримував боротьбу Бастаманте за незалежність, залізна хватка, яку той встановив над островом після приходу до влади, змусила Гарта виступити проти його правління. Річард Гарт відкрито дотримувався марксистських поглядів, і дедалі очевиднішим ставало, що в Бастамантистській Ямайці це більше неприйнятно. Піддавшись зовнішньому тиску, ННП у 1954 році виключила Річарда Гарта та ще чотирьох осіб із партії. Натомість Річард Гарт знайшов спільну справу з Вільямом «Біллі» Страченом, і разом вони заснували Рух народної свободи. Партія запропонувала радикальніший, марксистський напрям, ніж могла запропонувати ННП, і активно протистояла диктатурі Бастаманте. За це партію швидко заборонили, змусивши керівництво РНС втекти до Мексики. Попри цю невдачу, Гарт продовжував боротися за визволення Ямайки протягом усього свого вигнання.\n\nПровал Федерації Вест-Індії створив ключову можливість для повернення Руху народної свободи на Ямайку, і невдовзі острів прийняв революцію. Коли Страчен відійшов убік, щоб сприяти переходу до демократії, він передав кермо Гарту, аби той продовжив втілювати бачення РНС щодо майбутнього Ямайки. Якщо Ямайка має процвітати під пильним поглядом американців, Гарт і його партія повинні вистояти перед прийдешніми випробуваннями."

 #Leeward Islands
 SKN_Kenneth_Blackburne: "Кеннет Блекберн"
 POLITICS_SKN_KENNETH_BLACKBURNE_DESC: "Передсмертний хрип Британської імперії продовжує стогнати на Підвітряних островах. Син англіканського священнослужителя, народжений у Гемпширі в 1907 році, Блекберн вступив до Колоніального управління лише у 1930 році, але швидко почав переміщатися імперією, побувавши в Нігерії, Палестині та Гамбії, перш ніж у 1940-х роках його призначили до колоніальної інформаційної служби на Ямайці, пов'язавши острів із вицвілими стовпами імперії, яку роздирала операція «Морський лев».\n\nЗалишившись на Ямайці після Другої світової війни, Блекберн став одним із ключових учасників переходу від управління з боку британського уряду у вигнанні до Канади та впливовою фігурою в ямайській політиці, перш ніж його піднесли до Вест-Індійської комісії. Звідти, поступово відсторонений карибськими справами, він продовжував переходити з однієї посади на іншу в регіоні, перш ніж зрештою був призначений генерал-губернатором Підвітряних островів.\n\nКеннет Блекберн — останнє обличчя вимираючої породи. Оскільки колоніальні управління Карибського басейну дедалі більше укомплектовуються американськими представниками, а канадські дипломати перевантажені роботою, Блекберн, можливо, є останньою ознакою порядку, що походив із Лондона, а не з Вашингтона чи Оттави. Однак такі ознаки й надалі пронизують його поведінку та світогляд і залишили Підвітряні острови в стані застою, де реформи, запропоновані його ж Вест-Індійською комісією, впроваджуються безладно."

 #Saint Kitts
 SKN_William_Herbert: "Вільям Герберт"
 POLITICS_SKN_WILLIAM_HERBERT_DESC: "У політиці не буває надто молодих, і доктор Вільям «Біллі» Герберт це довів. Його досвід у галузі права дав недосвідченому Герберту унікальну можливість взяти участь у розробці Антильської конституції. Відображаючи його сильні федералістські переконання, його внесок допоміг створити децентралізовану структуру, яка сьогодні керує Сент-Кітсом, Невісом та Ангільєю, причому останні дві користуються особливо широкою автономією. Його переконання в децентралізованій федеративній державі поставили його в конфлікт із Робертом Бредшоу, але Герберта досі вважають бажаним компромісним кандидатом завдяки його повільній, виваженій політиці та конституціоналістському іміджу."
 SKN_Robert_Llewellyn_Bradshaw: "Роберт Ллевеллін Бредшоу"
 POLITICS_SKN_ROBERT_LLEWELLYN_BRADSHAW_DESC: "Роберт Ллевеллін Бредшоу вважає, що єдність полягає в силі народу. Він знову й знову бачив цю істину — від боротьби робітників цукрових плантацій після війни до болісного народження незалежності з колоніального лона. Саме спільна праця людей дозволила рухати колесо західноіндійської історії.\n\nОднак уперше за свою кар'єру політика й організатора робітничого руху Бредшоу побоюється за єдність своєї країни. Відокремлення Ангільї похитнуло підвалини того, що він вважав найбільшим досягненням свого життя. Будучи головним міністром, він пообіцяв об'єднати народи Сент-Кітсу та Невісу в єдину націю, проводячи масштабні централізаторські реформи. Ці зміни зіткнулися з молодим націоналістичним рухом на Невісі, натхненним шляхом Ангільї. Для головного міністра Бредшоу це чергова імперіалістична схема: розділяй і володарюй — ось як це називається."
 SKN_Frederick_Albert_Phillips: "Фредерік Альберт Філліпс"
 POLITICS_SKN_FREDERICK_ALBERT_PHILLIPS_DESC: "Народжений у 1918 році в сільській родині на Сент-Вінсенті, Фредерік Альберт Філліпс тим не менш зробив собі ім'я в академічному світі, навчаючись у гімназії, перш ніж здобути юридичну освіту в галузі цивільного та конституційного права. Працюючи заради різних справ на Сент-Вінсенті, він здобув собі ім'я й зрештою привернув увагу канадських адміністраторів, які шукали нових кандидатів на посади.\n\nПризначений до Вест-Індійської комісії, він швидко став впливовою фігурою у Федерації Вест-Індії, але його зірка не згасла остаточно після її розпаду. Спочатку ставши реєстратором Вест-Індійського університету, у 1966 році він був призначений адміністратором Підвітряних островів. Значною мірою номінальна посада на час розробки конституційного устрою регіону, він зберіг її та отримав повноваження губернатора після об'єднання регіону.\n\nФілліпс утримується на своїй посаді лише завдяки тому, чого йому бракує. У Федерації Підвітряних островів і далі домінують консервативні сильні лідери Вер Берд і Вільям Герберт, кожен із яких прагне впливати один на одного та на західноіндійське суспільство. У цьому Філліпс виступає загалом популярним посередником, організовуючи цей обмін. Однак із часом зростає тиск, аби хтось із них прийшов до влади. Чи зможе Філліпс зберегти над цим контроль, чи все вийде з-під його рук і Федерація Підвітряних островів спіткає доля її попередниці — цього навіть він поки що не може сказати."

 #Anguilla
 AGL_Ronald_Webster: "Рональд Вебстер"
 POLITICS_AGL_RONALD_WEBSTER_DESC: "Походячи з родини, що нажила скромні статки на молочному господарстві, Рональд Вебстер є уродженцем Ангільї, який виріс на Сен-Мартені. Майже три десятиліття Вебстер був відірваний від своєї батьківщини, доглядаючи за своїм скромним маєтком, успадкованим від прийомних батьків. Коли він нарешті повернувся на Ангілью у 1960 році, то знайшов занедбане місце, яке ледве міг упізнати, — нерозвинену ділянку землі, спустошену зловживаннями та корупцією Підвітряних островів.\n\nВірний Короні не менше за будь-якого іншого справжнього англійця, неохочий Вебстер, який згодом став посереднім бюрократом, узяв на себе ініціативу очолити революцію проти правління Підвітряних островів, яке принесло його співвітчизникам лише нещастя. Коли його революція зрештою на диво обійшлася майже без кровопролиття, Вебстер став популярною фігурою як перший головний міністр звільненої держави завдяки своїм зусиллям зі збереження автономії Ангільї, навіть якщо цього було досягнуто шляхом відокремлення острова від решти Вест-Індії.\n\nПопри своє нинішнє домінування в політиці Ангільї, Вебстер не має особливих причин грати роль дрібного диктатора на такій незначній сцені. Він дивиться на своїх сусідів і бачить лише нехтування з боку американців та канадців. Тепер він закликає до реформ, яких його народ давно прагнув. Вебстер не зупиниться ні перед чим, аби цього досягти."

