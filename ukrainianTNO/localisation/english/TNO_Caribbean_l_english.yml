 JAM_flavor.71.t: "Рух народної свободи перемагає на ямайських виборах 1972 року"
 JAM_flavor.71.desc: "SECRET/[GetDateText]\n\nВІД ТЕОДОРА ШЕКЛІ\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ПЕРЕМОГА ЯМАЙСЬКИХ РАДИКАЛІВ НА ВИБОРАХ\n\n1. Наші попередні зусилля з висунення поміркованих сил у Ямайській Народній Республіці виявилися марними. Рух народної свободи здобув переконливу перемогу та забезпечить збереження Річарда Гарта на посаді прем'єр-міністра. Помірковані елементи були значною мірою усунені від участі й зможуть прийти до влади лише через зміну режиму.\n\n2. Вибори відбулися з відносно незначним втручанням держави, але тим, кого вважали дисидентами, повністю заборонили брати участь, і лише Майкл Менлі запропонував змістовну альтернативу. Річард Гарт достроково оголосив про перемогу, але його початкова впевненість виявилася виправданою. Очікуються подальші заходи з колективізації та націоналізації, а Гарт прямо засудив американські зусилля.\n\n3. На цьому етапі єдиним способом здобути прихильного союзника на Ямайці буде переворот. Опозиція правлінню Гарта неорганізована, але існує, і їй слід надати значно більше фінансування. Майкл Менлі не бажає брати участь у перевороті, але депутати Народної національної партії, а також такі емігранти-опозиціонери, як Едвард Сіґа, можуть стати прийнятними наступниками."
 JAM_flavor.71.a: "ВІРНІСТЬ, ХОРОБРІСТЬ, ЧЕСНІСТЬ"

