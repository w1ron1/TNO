 Caribbean_flavor.226.t: "Бананова справа"
 Caribbean_flavor.226.desc: "У штаб-квартирі United Fruit щомісячний фінансовий брифінг нічим не відрізнявся від звичайного — кілька притуплених бюрократів випльовували безглузді фрази жаргону, а клерки намагалися розібратися в цих незв'язних просторікуваннях. Акціонери уважно дивилися, але ніколи не виявляли ентузіазму — все було гаразд, доки не настав звіт про інвестиції на Сент-Люсію, який представив огрядний чоловік, що насилу підвівся зі свого місця.\n\n"...як було зазначено у брифінгу минулого місяця, Сент-Люсія продовжує залишатися одним із наших найменш прибуткових регіонів через протекціоністську політику прем'єр-міністра Комптона. Моя команда пропонує припинити подальше фінансування Народної прогресивної партії, доки ситуація не буде виправлена за порадами UFC."\n\nОдна за одною його заяви мали на меті змусити Вежу зі слонової кістки переглянути свої усмішки для так званого доброго друга. "Коротше кажучи, Комптон став параноїком і хоче, щоб ми забралися з його острова." Бурмотіння наповнило статичну тишу, коли бюрократ перестав просторікувати. Розмови про "рожевих" і "повісити цього виродка" ледь чутно прокочувалися кімнатою, протести ставали дедалі голоснішими, доки не стали справді нестерпними. Кілька менш... балакучих членів комітету незабаром почали один за одним залишати кімнату, коли все перетворилося на змагання в образах.\n\nНевдовзі огрядний чоловік також перейняв поведінку своїх колег. Бути єдиним розсудливим у кімнаті палаючих фанатиків було невесело, а якщо світ перевертається догори дриґом, то, мабуть, обов'язково треба з цим плисти."
 Caribbean_flavor.226.a: "Вирощувати банани й бути бананами."

 Caribbean_flavor.229.t: "Домініка прагне націоналізації"
 Caribbean_flavor.229.desc: "ЦІЛКОМ ТАЄМНО/[GetDateText]\n\nВІД ОСКАРА КОТТОНА\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: НАБЛИЖЕННЯ ЛІВИХ РЕФОРМ У ДОМІНІЦІ\n\n1. Останніми тижнями уряд Домініки почав прагнути до впровадження кількох значних економічних реформ, домагаючись націоналізації основних галузей промисловості, найважливішою з яких є торгівля бананами. Інші закони мають значно посилити владу новоствореної республіканської виконавчої влади та зосередити уряд Домініки навколо Едварда ЛеБлана, який відкрито називав себе подібним до Фіделя Кастро.\n\n2. Багато з цих планів були оголошені публічно, але повні подробиці значною мірою приховувалися за межами правлячої Демократичної лейбористської партії, до якої, на щастя, було впроваджено агентів. Акціонери United Fruit Company також висловили занепокоєння Федеральній торговій комісії, звертаючи нашу увагу на заяви, що прямо загрожують американським позиціям у регіоні та відкидають запити на відшкодування.\n\n3. Якщо ми хочемо це зупинити, у нас є лише коротке вікно, перш ніж це стане законом. ЛеБлан має високі рейтинги схвалення, але всередині ДЛП є значна опозиція щодо того, скільки влади вона передає виконавчій владі, ризику революційної Домініки та значного фінансування від UFC. Якщо ми діятимемо швидко, то зможемо мобілізувати парламентську та ділову опозицію, щоб усунути його й запобігти цьому, — але ми не можемо зволікати."
 Caribbean_flavor.229.a: "Принесіть мені телефон. Нам треба зателефонувати кільком людям у Розо та Новому Орлеані."

 Caribbean_flavor.230.t: "Змова формується в Домініці"
 Caribbean_flavor.230.desc: "ЦІЛКОМ ТАЄМНО/[GetDateText]\n\nВІД ОСКАРА КОТТОНА\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ПЛАНИ ЩОДО УСУНЕННЯ ПРЕМ'ЄР-МІНІСТРА ДОМІНІКИ\n\n1. Наразі організовується запланована спроба оголосити імпічмент чинному прем'єр-міністру Домініки Едварду ЛеБлану, перш ніж він зможе провести свої заплановані реформи. Цю спробу організувала суміш поміркованих членів Демократичної лейбористської партії разом з усіма незалежними депутатами та членами Об'єднаної народної партії. Її ухвалення не гарантоване, але, ймовірно, відбудеться протягом наступного тижня.\n\n2. Група невелика й відносно непублічна, але погодилася обговорити свої плани з нами після того, як ми надали запевнення щодо нашого походження. Ті, з ким ми розмовляли, були представниками Демократичної лейбористської партії та висловлювали справжнє занепокоєння зростанням сили самого ЛеБлана. Наразі вони мають на своєму боці п'ятьох із одинадцяти членів, але очікують, що до голосування до них приєднаються ще.\n\n3. Ми мало що можемо зробити для прямої підтримки цієї спроби, особливо не створюючи додаткової організації для прихильників ЛеБлана, але United Fruit Company поінформована й вливає значні ресурси тим, хто готовий перейти. Передача влади має бути безшовною: заступник прем'єр-міністра Ніколсон Дюкрі, прогресивний політик, який підтримує ці зусилля, буде призначений замість нього."
 Caribbean_flavor.230.a: "ВІРНІСТЬ, ХОРОБРІСТЬ, ЧЕСНІСТЬ"

