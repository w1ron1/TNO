 ### FLAVOR EVENTS ###
 ## Coming Storm ##
 Caribbean_flavor.1.t: "The Chief and the Spy"
 Caribbean_flavor.1.desc: "Every Tuesday, two old adventurers gathered in a Kingston hotel penthouse. They chose this place away from their homes, where they met in secrecy to discuss matters unfit for their official or personal lives. On one side of the table, Jamaican Premier Alexander Bustamante cackled over hard dough bread. Luis M. González-Mata, sitting in front of him, had been regaling him with a tale of the Spanish Civil War—a tale that began with a dalliance in a nunnery and ended in a dozen dead republicans.\n\nThey always began their Tuesday dinners with a story, always unique, always scandalous or sensational. Bustamante always enjoyed them; through González-Mata's wild words and through his own recollection, he was once again a young man, travelling the European and American continents. Reaffirming each other's credentials made the rest of the night go smoother. When their stories were done, they discussed current affairs in tones best spoken outside their normal lives.\n\n"I spoke with a smuggler earlier this week," said González-Mata, pouring another glass of rum. "Thanked him for his service. Told him the Jamaican economy wouldn't be the same without him."\n\n"You didn't," said Bustamante in mock incredulity, another cackle escaping his cracked lips. "Christ. Well, hell, it's true, isn't it?" He tore off a piece of bread, gnarled fingers struggling to break through the crust. "At least the smugglers are quiet and put back something into the economy. It's the other scum that concerns me. The gangs, the radicals. Agitators." His voice briefly dropped into a whisper. "The Iberians have it easy, you know. Trujillo, too. There's no fussing about, not with them. They deal with their problems.""
 Caribbean_flavor.1.a: ""You could, too." González-Mata smiled, baring teeth. "There are ways.""

 Caribbean_flavor.2.t: "Report Day"
 Caribbean_flavor.2.desc: "The coolness of the fan did its best to break the hot air, but William Hastie felt little of its efforts as he read the newly published report. Lounging on his office sofa, prepared for the lengthy read before him, he'd dared to even be optimistic as he had looked upon its cover. 'West Indies Commission - 10 Year Report' was proudly emblazoned upon it, its seal promising the New World's progress; a culmination of years of meetings, observations and stress. The result?\n\nEvery page seemed worse than the last, Hastie's blood boiling as every failing was laid bare.\n\nJamaica was an underdeveloped cinderbox awaiting a spark, Bustamante's political machine engaging in corrupt obstructionism detailed such that even Hastie was surprised at its extent. The Windward Islands had promising economic figures, the banana industry booming, until the report outlined exactly how the liberal agricultural policies were underscored by exploitative plantation practices and growing discontent - even violence - from labor groups. The Bahamas seemed to be becoming little more than a new Batistaist Cuba. Even the so-called success stories in Barbados and Trinidad seemed built on sand, Barbados being crutched on its aging premier Grantley Adams while Trinidad was awash in populist agitation and open cooperation with the Mexicans.\n\nHastie dropped the report onto the sofa next to him, sweat on his brow sliding uncomfortably down his head. The humidity surrounded him, enclosing him in worry. He shouldn't have been too surprised, indeed much of the report's components had been known to him, but to see it all outlined as such? What had his commission achieved these past years? What had he achieved? Little more than what they had when they started it seemed; overseeing an archaic relic.\n\nHe sighed, standing from his sofa to his desk. Calls had to be made, and he knew who the first one had to be."
 Caribbean_flavor.2.a: ""Mr. Molson? It's Hastie. Could we arrange to meet soon to discuss the Commission's report?""

 Caribbean_flavor.3.t: "The Ties That Bind"
 Caribbean_flavor.3.desc: "Secretary Salinas Lozano had rolled his eyes when Secretary of External Relations Tello Barraud asked him to meet with Eric Williams, the Premier of Trinidad and Tobago, to discuss joint development plans. But, reflecting over his noon cigar, the norteño realized that if this visit drew enough publicity, it could appear that he'd won Barraud's backing for the succession.\n\nAnd nowhere was more public than La Merced Market at midday. "These public marketplaces serve a revenue source for the Federal District, and make our price controls significantly easier to enforce." Salinas' finger lingered above a vendor's ears of corn, "Through CONASUPO, we're ensuring stable earnings for our peasantry, while holding down the cost of food in the city."\n\nWilliams himself, an Afro-Caribbean man with prominent hearing aids and a sharply-tailored suit, was certainly drawing the requisite attention. The Premier browsed a clothing stall before turning his attention back to Salinas, "You also seem to be holding out against the flood of cheap wares from our northern neighbor. I wish my country could say the same."\n\n"Tariffs, strategically placed to support our infant industries, are to thank. And continuous subsidies for our manufacturers, funded from our agricultural exports and oil wealth." Williams' face had broken into a grin; Salinas prayed a photographer was present as he approached the vendor and threw down a wad of bills. Far more pesos than were needed for the somewhat shoddy green cotton tie Salinas took and handed to Williams.\n\nWilliams raised an eyebrow momentarily before he smiled again, checking the reverse side. "Made in Mexico." Noting the gathering crowd, the Premier shook Salinas' hand and pronounced with a mix of warmth and determination,"
 Caribbean_flavor.3.a: "I'll pay you back one day, with a tie made in Trinidad and Tobago."

 Caribbean_flavor.4.t: "The Chief and the Diplomat"
 Caribbean_flavor.4.desc: "Half the Vale Royal had been draped in plastic sheets; the other half was already in storage, awaiting transfer to a new palace. Ambassador William C. Doherty felt like he was intruding on a funeral, but Premier Alexander Bustamante welcomed him in with lively if hobbled movements. They sat in an empty drawing room; Doherty on a couch and Bustamante on an armchair, the only furniture in the room.\n\nDoherty cleared his throat. "Mr. Premier, I wanted to talk with you about... recent developments." He leaned in close. "The United States has been keeping a close eye on the Caribbean for some time. We're looking to put a bit more support into our allies here."\n\n"Yes, yes," said Bustamante, liquid sloshing around his glass. "Look, that man, Trujillo? No time for him, no time. But you hear things, Mr. Doherty. Every day, I hear 'America should do something', 'Cuba should'. It's ridiculous, nonsense." Doherty folded his hands in his lap. Bustamante's free hand went wild in the air. "You know, we look after Americans here. I keep United Fruit happy. This government's making things safe and happy for the OFN here. But when we hear about Americans on Caribbean soil, we start thinking, when's it going to turn on us?"\n\n"I assure you, Mr. Premier, America has no designs for Jamaica-"\n\n"I'm not saying that, no, no. But, you know, a neighbour starts being hassled, people's imaginations wander."\n\nAnd Bustamante's imagination was wandering, into dark forests and cold rivers. He'd let himself be consumed by visions of American commandos paratrooping on the Vale Royal lawn for some time now, his blood over the whitewashed walls. He still had so much to do. He still had so much to fix. He could not help but wonder what the Americans would do if they ever found his Iberian connections."
 Caribbean_flavor.4.a: "Doherty walked out of the Vale Royal, perturbed and eager to make some calls."

 Caribbean_flavor.5.t: "Three Exiles in Jamaica"
 Caribbean_flavor.5.desc: "Dale Redden drummed his fingers on the table, the sound bouncing along the warehouse walls. He had been with the Bureau for twelve years, and resented this most recent posting; what had meant to be a mob tour close to his family in Nebraska turned into a Caribbean adventure, propping up Jamaica's strongman dictator. After his ruminating was up, he took the package from his desk and walked out the door. Across town, a lone printing press swallowed blank paper and spat out ballots. Three textile workers took home twice their paycheck just to put a little tick next to the names of Bustamante's friends. The ballots were collected, the need for secrecy was reaffirmed, and Dale Redden took them back to the warehouse.\n\nInside, he saw Irving Alleyne, carrying a duffel bag out of the warehouse. Dale asked if he wanted to grab a drink later; Irving politely rejected, citing a long trip and a longer night. He had twenty stops dotted all across the city, a constellation of Busta Union reps in need of cash. He kept his eye on the road, cruising past people frustrated with Bustamante's continued stranglehold over their country. Irving had long since stopped caring about what they thought of the Bureau's preferred men; most of the time, they hated them, and he'd stopped thinking their opinion mattered years ago.\n\nBy the time Irving came back to the warehouse, it was dark outside. Only a single lamplight was on: Carroll Luckett, the runt of this listening post, was checking his gun. He slammed the magazine back into the well. They did not look at each other. As Irving stuffed the empty duffel bag into a locker, Carroll was on his way out the door. East of the city, at a forgotten jetty illuminated only by its docked boat, two men were making a trade. Carroll Luckett hung back, pistol in hand, watching the proceedings. From the man on the boat came a crate of rifles; from the man on the jetty came a duffel bag of cash. The rifles might find their way down south; the cash would be split in two, half to the Bureau and half to Bustamante's campaign coffers."
 Caribbean_flavor.5.a: "All Carroll could think was that it was a lot of effort for a man who nobody seemed to like."

 Caribbean_flavor.6.t: "A More Perfect Federation"
 Caribbean_flavor.6.desc: ""...but can the Antilles truly be able to move on in light of all that's transpired?" The studio lighting made William F. Buckley look as unflappable as ever. "This is a long history of bloodshed to live down and people have long memories..."\n\n"Might have fooled me for the way Washington remembers things." Grantley Adams' smile wrapped right around his head. "Even still, they have not abdicated their duty in advocating for the future of the West Indies and neither have I."\n\n"Well, good lord, that retirement didn't last long." The audience laughed heartily.\n\n"I mean, I do not recall my person not being needed most of my life." A wry eyebrow from Adams, another pang of laughter. "America has only ever been as close as family in our efforts to seed a healthy inner life for the Federation, for the Caribbean democracy we have longed for after so long, they have my thanks. We shall forever be in their debt."\n\n"And that should fall on Mr. Spangler's shoulders?" Buckley prompted.\n\nAdams was nonplussed: "A better advocate for the future of the Antilles you shall not find, Hugh is among the brightest minds in the Caribbean, you could not ask for someone better.\n\n"You sound rather optimistic on the matter of the West Indies, haughty one might say!"\n\nThere was not a doubt in Adams' mind as he replied: "A true paradise does not merely fall out of the sky, even if the Caribbean looks like it did when it is at its most beautiful. I dare say, I see in Barbados what many others see on the American continent. I see that shining city on a hill, that most silly of ambitions... to dream. Yes, paradise is a bit of a ways off, but by God, we are making a show of it and we should not settle for anything less."\n\nWilliam Buckley looked at the audience. "Well, by God, I hope your people find that paradise.""
 Caribbean_flavor.6.a: ""Ladies and Gentlemen, the honorable Grantley Adams.""
 Caribbean_flavor.6.tt: "§D§GStability§! in the §BCaribbean§! is paramount to keeping our hold on the region.§!"

 Caribbean_flavor.7.t: "The Awkward Squad"
 Caribbean_flavor.7.desc: "Félix Galván steeled himself. He had arrived two hours early at the remote training grounds of the Jamaican contingent of the Caribbean Legion, the Black Star Brigade. Most spoke no Spanish. Most were green recruits. Most were red communists. Most were black. None of them were his to command. But most of the blowback from their inevitable failure to defeat Trujillo's crack forces would fall on their military attaché, him.\n\nGalván gave his knuckles a crack and threw open the truck's door - time to give this lot a modicum of discipline. Only to be nigh-ambushed by twenty Jamaicans emerging from the camp to greet him, arms at attention. At least they knew how to keep watch.\n\nA fairer-skinned black man with a scarred face and easy smile limped toward him with an outstretched hand and tolerable Spanish, "I'm Billy Strachan; I lead the Brigade. Welcome."\n\nGalván shook Strachan's callused hand, and replied, "I am Colonel Félix Galván. Given my experience on the battlefield and at the Inter-American Defense College, I was selected to assist you in preparing your men while they remain on Mexican soil."\n\nStrachan spoke slowly, but clearly, "My combat experience was against Nazi planes, so yours will help us defeat Trujillo. Thank you for your assistance, and your country for giving us the chance to fight. The Dominican Republic is the first battle in our war for a free Caribbean." With another smile, he repeated the final phrase in English, the men behind him taking it up in unison.\n\nGalván arched an eyebrow."
 Caribbean_flavor.7.a: "Perhaps victory would be more dangerous than defeat."

 Caribbean_flavor.8.t: "Trujillo's Vengeance in Jamaica"
 Caribbean_flavor.8.desc: "Luis M. Gonzaléz-Mata had rarely met Trujillo directly, but after the Puerto Plata disaster he had been called surreptitiously to his Santo Domingo villa, where the old man ranted about mestizo treachery and Yankee conspiracy. He gave his orders—"keep Busta in line, fuck the rest up"—and a shipment of rifles to facilitate both. González-Mata came back on a supply boat with a pit in his stomach and a thousand dollars to fill that pit. The rifles were shipped directly to his airfield south of Ocho Rios. He'd lined up a buyer for the guns the following day. Two days later he was at the airfield, waiting for a buyer that said they would arrive half an hour ago. The crew here milled around at the edge of the hangar. They smoked, played cards, and tried not to look at the hardware or its nervous seller.\n\n"Plane!" His own men, smugglers of dope and destruction, saw it first through the clouds, fourty-five minutes after their ETA. Some of them pointed their own weapons at the plane as it descended; González-Mata pushed them down by their handguards. The lone plane, bearing all the right marks, landed with a little bump along the runway.\n\nTurbulence over the Gulf was their excuse. They seemed undisturbed, slightly annoyed for the delay; they did not notice or care that González-Mata's men were about to pop with excitable concern. The crew loaded the rifles into cargo, and once it had been verified the pilot threw González-Mata a briefcase of cash. He opened it up and made sure to count in front of them before they left. American dollars lined and filled the case.\n\nAs the plane flew back into the clouds, González-Mata handed out what the crew was owed: a bundle each, five hundred in each bundle. He pocketed his own share, and took the rest of the case to his car. Kingston was about an hour south-west of the airfield. He needed to get this to his banker, who would get it to Bustamante's banker, who would ensure that the other old man would remain a satisfied friend."
 Caribbean_flavor.8.a: "González-Mata got in the car, checked his pistol, saw it was still loaded."
 Caribbean_Destabilization_tt: "§GFuture efforts to destabilize the OFN hold on the Caribbean will be more effective.§!"

 Caribbean_flavor.9.t: "Trujillo's Ghost in Jamaica"
 Caribbean_flavor.9.desc: "Luis M. González-Mata had been watching the slow crawl of the sea for an hour, an unlit cigarette hanging limp from his mouth. The boat he rode on had been inching its way out of Kingston, prowling west towards Central America with a cargo hold full of cigars above and rifles below. Clear water at noon; his reflection rippled with the waves, too distant to make out the funhouse mirror effect it had on his face, or on the faces of the other smokers on deck beside him.\n\nHe was thinking about Trujillo, wormfood in a mass grave. His chain of custody was broken, and the Iberians moved quicker than he expected to refasten his leash. He was their smuggler now; no intermediary, just dead drops and one-time pads between him and Madrid. He was making more money than he ever did at Trujillo's beck and call. But he'd started losing a lot more sleep, and always kept his gun on him when he slithered under the covers.\n\n"Boat," said one of his fellow smoking buddies. González-Mata's head snapped up from the water. He saw on the horizon a distant figure, round and long, too distant to make out more than a general profile of danger. At once the smokers threw their cigarettes overboard and manned battlestations, playing at work and keeping their eyes portside.\n\nGonzález-Mata's hand went to his shoulder holster. The distant boat sailed along the horizon, travelling northerly. The captain called their boat to slow down; "any slower," said a crewmate, "and we'll have to drop anchor." He barked the order again. González-Mata tightened the grip on his pistol.\n\nThey stayed in this limbo for five minutes, and saw the sharp and round thing in the distance sail past without greetings. It turned into the horizon, disappearing over it. Relief came with the westerly wind, washing over and around the crew. The captain gave the orders to increase speed. The radioman reported nothing over standard comms."
 Caribbean_flavor.9.a: "González-Mata went back to his cabin, pulled out his pistol and laid down on his cot."

