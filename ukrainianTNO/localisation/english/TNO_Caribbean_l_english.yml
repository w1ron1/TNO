 #French West Indies
 FWI_Lyman_Lemnitzer: "Лайман Лемніцер"
 POLITICS_FWI_LYMAN_LEMNITZER_DESC: "Людина, якою понад усе рухає почуття обов'язку, генерал Лайман Лемніцер є одним із останніх оплотів адміністрації Ейзенхауера та всього, що вона уособлювала — принаймні, саме так йому хотілося б думати. Народжений у серпні 1899 року, Лемніцер воював пліч-о-пліч із самим Ейзенхауером під час Другої світової війни, а згодом служив у складі його Об'єднаного комітету начальників штабів з 1949 до 1953 року. Лемніцер був свідком втрати за втратою, що спіткали Америку: переговорів про припинення вогню після війни, евакуації американських сил із Британії, виведення військ зі Східного Сибіру — генерал Лемніцер спостерігав за всім цим.\n\nМожливо, саме це змусило його так спокійно прийняти вигнання до колишніх Французьких Антил як верховного комісара за Кефовера. Набір відносно невеликих островів далеко від континентальних Сполучених Штатів — багато інших генералів, усунених під час чистки Кефовера, поставилися б до цієї ситуації значно менш гідно. Лемніцер, однак, сприйняв це спокійно й керував островами Гваделупа та Мартиніка твердою — але, на його думку, справедливою — рукою.\n\nАнтильські острови Лемніцера — це місце, де Новий курс продовжує жити. Політики планують і здійснюють економічні проєкти, засновані на співпраці класів, наче 1930-ті ніколи не закінчувалися, а праця та бізнес щасливо тримаються за руки. За підтримки місцевих французьких можновладців статус-кво здається міцним — наразі."

