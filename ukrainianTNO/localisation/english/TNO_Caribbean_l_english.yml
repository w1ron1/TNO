 JAM_flavor.65.t: "Справа зовнішності"
 JAM_flavor.65.desc: "Стенограма засідання Ради національної безпеки, [GetDateText]\n\n«...Віддам ямайцям належне: навіть балансуючи на межі економічного краху, шкаралупа все ще тримається. Вони повністю ізольовані, у них і енергетична, і паливна криза, і все ж люди просто не позбавляються Страчена».\n\n«Що ж, убивство опозиції до цього спонукає. Справжні віруючі радше голодуватимуть, ніж визнають поразку».\n\n«Попри те, що всередині країни вони ледве функціонують, їм усе ще вдається спричиняти нестабільність, коли випадає нагода. Чи то їхні товариші-червоні в Карибах, чи то емігранти у Сполучених Штатах — вони безперечно можуть завдати нам чимало проблем. Нам краще придушити це в зародку, перш ніж хтось інший зробить це за нас».\n\n«Що ж, завжди є прямий підхід. Повномасштабне морське вторгнення на острів через дії Страчена є можливим. На Ямайці недостатньо живої сили, щоб протистояти висадці морської піхоти».\n\n«Це знищить нашу репутацію на світовій арені. Якщо ми занепокоєні внутрішнім невдоволенням, яке розпалює Ямайка, уявіть, що станеться, коли японці та мексиканці отримають доступ до тих самих спільнот... із глибшими кишенями».\n\n«Едвард Сіґа має загони емігрантів, готових за нього воювати. Якщо ми зможемо забезпечити морську та повітряну підтримку висадки, ми дозволимо їм воювати, а потім допоможемо їм встановити уряд, який можна буде контролювати. У його кадрах уже є більшість необхідних фахівців. Ризик провалу, звісно, вищий, але протидія буде значно меншою — це виглядатиме як внутрішня ямайська суперечка. Усі знають, що це не так, але зовнішність багато значить»."
 JAM_flavor.65.a: "Обговорення тривало, а плани були накреслені."

