 # Caribbean Flavor events - Hereth Lie the Deprecated Bob Marley Event Chain, RIP
 
 wif_crisis.300.t: "Відповідати моменту"
 wif_crisis.300.d: ""Немає причин сходити з глузду", — сказав Банні Вейлер. "Це наш перший альбом."\n\n"Розумію, але нам потрібно зробити щось, що виділить нас", — заперечив Пітер Тош із фирканням. "Так, зробімо кілька каверів, але нам потрібно щось... особливе. Незабутнє." Боб Марлі погоджувався з цим.\n\nУ Вейлерів було достатньо прихильників, тож альбом, імовірно, мав би успіх — але це передбачало, що вони взагалі до цього дійдуть. Однак, як виявилося, визначитися з тим, яким саме буде цей альбом, було легше сказати, ніж зробити, що й довели години суперечок.\n\n"Ми робимо це неправильно", — нарешті перебив Боб. "Ми говоримо про те, щоб робити те, що всі інші вже робили раніше. Чому б не зробити щось своє? Щось справді ямайське?"\n\n"Нікому це не потрібно", — відмахнувся Банні.\n\n"Нікому?" — заперечив Боб, жестикулюючи назовні. "Ти бачив референдум? Незабаром у нас може з'явитися власна країна. Кращого часу для чогось такого не буде."\n\n"Я в справі", — сказав Пітер. "Це ризик, але до біса. Боб має рацію, тут є момент, яким ми маємо скористатися."\n\n"Я волів би, щоб мене запам'ятали за спробу зробити щось інше, навіть якщо це не спрацює", — завершив Боб. "Я хочу створити щось наше — не американське, німецьке чи японське."\n\nБанні видихнув, але це був змирений видих — звук, який означав, що він знав, що поступиться. "Гаразд, якщо ми це робитимемо — краще зробімо найкращий клятий альбом на острові." Боб усміхнувся. Це мав бути його визначальний момент — він це відчував."
 wif_crisis.300.a: ""Не хвилюйся, Банні, ми не націлюємося на щось менше.""

 wif_crisis.301.t: "Правильна людина, правильний момент, правильна музика"
 wif_crisis.301.d: "Найкращим було те мистецтво, яке відповідало моменту, і Боб Марлі вважав себе людиною, яка вміла користуватися такими моментами. Звісно, тут була певна частка удачі — зрештою, які були шанси, що вони записуватимуть альбом саме тоді, коли відбуватиметься історичний референдум?\n\nВін поплескав Банні по спині, коли вони святкували. "Я ж казав, що це правильний час."\n\nЙого приятель усміхнувся. "Хоч раз я радий, що помилявся."\n\nЯк виявилося, його нетрадиційна ідея для альбому була саме тим, чого прагнули люди. Чимось ямайським. За кілька днів після релізу альбом став предметом національної гордості — та міжнародним хітом. Боб пам'ятав, як ішов вулицями й чув їхню музику в ресторанах, барах, автомобільних радіоприймачах і навіть на вуличних перехрестях. Вони стали знаменитостями, яких усюди, де вони виступали, зустрічали оплесками та вигуками.\n\n"Гроші, слава й лейбл", — усміхнувся Пітер, коли вони пили. "Не думаю, що ми могли б просити більшого."\n\n"Ні", — замислено сказав Боб. "Не думаю, що ми могли б зробити краще за це." До них уже звернулася японська студія з пропозицією підписати їх на лейбл. Те, на що вони навіть не очікували претендувати протягом кількох років. І це був не один із найбільших лейблів у Сфері.\n\nСвяткуючи, він замислився, чи зможе щось зрівнятися з цим успіхом. Що ж — лише якщо він буде задоволений тим, щоб залишити все як є. Ні, це було лише початком. Яким би не було майбутнє, він ніколи не стане застійним. Тепер вони спілкувалися з багатьма іншими артистами, з якими він прагнув співпрацювати, вчитися та надихатися. Це був унікальний особливий час, і він відчував, що найкраще ще попереду."
 wif_crisis.301.a: "Унікальний ямайський момент."
 
 wif_crisis.302.t: "Помірний успіх"
 wif_crisis.302.d: "Боб Марлі зітхнув. "Ну давай, кажи. Я знаю, що хочеш."\n\nНа губах Банні застигла невесела посмішка. "Я ж казав."\n\n"Так", — Боб потер очі. "Гадаю, ти мав рацію." Тепер, коли надійшли перші цифри, цифри були... нормальними? Пристойними? Прийнятними? На папері альбом був успішним — ледь-ледь. Однак їм сказали, що для першого альбому це непогано. Більшість навіть не відбиває своїх витрат.\n\n"Це не провал", — сказав Пітер, будучи оптимістом. "Тепер більше людей знають, хто ми. І ми не спатимемо на вулиці."\n\n"Завжди дивишся на світлу сторону", — сухо сказав Банні.\n\nБоб припустив, що зрештою Банні мав рацію. Людям просто цього не хотілося. На початку всієї цієї історії з референдумом був короткий період національної ямайської гордості, але він згас. Це змусило його відчувати... смуток? Розчарування? Змирення? Він не був упевнений, але це відчувалося як кінець чогось. Назавжди.\n\n"Нам пощастило вийти в нуль", — сказав Банні. "Наступного разу? Тримаємося того, що працює. Хтось із вас не згоден?"\n\n"Ні", — сказав Пітер. "Шкода, але, гадаю, люди хочуть знайомого. Або принаймні... чогось знайомого." Боб, на жаль, погодився з цим, хоча це було радше змирення. Можливо, за кілька років, після кількох нових успіхів, вони зможуть зробити щось подібне знову. Він припустив, що це був навчальний досвід для них усіх. Час було рухатися далі."
 wif_crisis.302.a: "Плани на майбутнє."
 
 wif_crisis.303.t: "Прокляття небайдужості"
 wif_crisis.303.d: "Прохолодний вітер дув, коли Боб Марлі сам ішов вулицею, а над Ямайкою опускалася ніч. Небо було безхмарним, і зорі яскраво сяяли над островом. Він ішов без мети чи призначення, його думки були розсіяні. Він мав би святкувати зі своїми приятелями пристойний успіх альбому. Можливо, не такий великий, на який вони могли сподіватися, але багатьом людям він подобався. Вейлери тепер безперечно були відомим гуртом, і гурт був щасливий.\n\nУсі, крім нього. Ні, ні, це було не зовсім правильно. Він був радий, що альбом мав успіх, але він був... відволічений. Те, що сталося з референдумом, затьмарювало все інше. Його непокоїло, що Сполучені Штати розтоптали саму ідею незалежної Ямайки ще до того, як вона змогла сформуватися. Ні він, ні його приятелі ніколи не були надто політичними, і щось подібне не мало б його особливо турбувати. Політика була для багатих, костюмів і політиків.\n\nВін не мав би перейматися, він думав, що не перейматиметься, але він переймався.\n\nЗдавалося жорстоким жартом, що альбом, натхненний самою Ямайкою, вийшов у час, коли незалежність Ямайки зникла. Через це щось на кшталт альбому здавалося неважливим у порівнянні. Це змусило його замислитися над усією ситуацією. Політика. Він насправді не знав, що тепер робити з цим почуттям. Це було все, про що він міг думати, і він не міг це ігнорувати. Йому було небайдуже. Тож він мав щось зробити, так? Але що?\n\nЩось привернуло його увагу, і він зупинився на розі вулиці. На боці стіни був приліплений листок, заляпаний брудом і плямами від води, але цілком розбірливий. Щось від Лейбористської партії, яка засуджувала рішення США. Слова відгукнулися його новознайденому розчаруванню та гніву. Раніше він ніколи особливо не замислювався про них, але... чому б не зробити це тепер? Його рука піднялася й зняла його, а потім він засунув його до кишені, розвернувся та попрямував додому."
 wif_crisis.303.a: "Йому було над чим подумати."

 wif_crisis.304.t: "Погіршення"
 wif_crisis.304.d: "Роберт Ґрем Майнер, посол США у Федерації Вест-Індії, прочитав доповідь перед собою з дедалі більшим занепокоєнням і тривогою.\n\n"ПОВІДОМЛЕННЯ ПРО НАСИЛЬСТВО ПРОТИ ЧЛЕНІВ НИНІШНЬОЇ ПРАВЛЯЧОЇ ПАРТІЇ, ДО ЯКОЇ НАЛЕЖИТЬ ПРЕМ'ЄР-МІНІСТР ЯМАЙКИ, ЩОДНЯ ЗРОСТАЮТЬ. ЯКЩО НИНІШНЯ ТЕНДЕНЦІЯ ДО ЗРОСТАННЯ ПРОДОВЖИТЬСЯ, МАЄМО ВСІ ПІДСТАВИ ПІДОЗРЮВАТИ МОЖЛИВИЙ СПАЛАХ МАСШТАБНОГО ПОЛІТИЧНОГО НАСИЛЬСТВА НА ОСТРОВІ."\n\nВін кинув її та схопив телефон. Сподівався, що прем'єр-міністр зможе прояснити ситуацію й надати необхідні запевнення, що вона перебуває під контролем.\n\nПісля коротких гудків слухавку взяв не прем'єр-міністр, а його секретар. "Перепрошую, посол Майнер, але прем'єр-міністр відвідує свого міністра внутрішніх справ, якого, як вам, напевно, відомо, щойно відправили до лікарні. Бажаєте залишити повідомлення?"\n\nРоберт похитав головою. "Ні, дякую. Думаю, це може почекати." Сказавши це, він уже планував поїздку до Кінґстона, щоб особисто зустрітися з прем'єр-міністром.\n\nПроходячи повз шафу, Роберт побачив .38 револьвер із шістьма кулями поруч. Він ненавидів насильство, тому сама думка про це неймовірно його дратувала. Попри це, він узяв пістолет і кобуру та поклав кулі в місце, звідки міг легко їх дістати."
 wif_crisis.304.a: "Лише як запобіжний захід, подумав він."
 
 wif_crisis.305.t: "Я застрелив шерифа"
 wif_crisis.305.d: "За останню годину натовп зріс. Боб Марлі не знав, хто його організував, але, враховуючи, що растафарі становили значну більшість, він міг зробити обґрунтоване припущення. Зростаючі репресії та байдужість ямайського уряду сильно на них тиснули. Наприкінці вулиць і на перехрестях стояла лінія поліцейських, насторожено спостерігаючи за натовпом, який вигукував гасла й вимоги, напружено стискаючи кийки та гвинтівки.\n\nБоб був лише одним із багатьох у натовпі, але навіть він міг відчути, як настрій протесту поволі змінювався. Він зростав уже давно, задовго до сьогоднішнього дня, киплячи з обох боків, коли натовп почав спрямовувати свій гнів на поліцію. Тут не було політиків, які б їх вислухали, тож наступна логічна ціль постала сама собою.\n\nА потім усе зірвалося. Одного з протестувальників, який підійшов близько, щоб кричати на офіцера, раптом схопили й потягли геть, коли поліція негайно зімкнула ряди, а запал натовпу досяг апогею. Це було несправедливо. Це була несправедливість, і Боб знав лише те, що якщо нічого не зробити, цей чоловік буде лише першим із тих, кого заберуть. Він нахилився й підняв цеглину.\n\nКамінь полетів у повітря й прямо влучив у голову одного з офіцерів. Боб майже міг уявити м'який глухий звук удару каменю об плоть, перш ніж офіцер упав. Натовп замовк, і здавалося, що звук згас, коли Боб подивився на те, що він зробив. Гнів, який він відчував, змінився жахом від усвідомлення, що він щойно міг убити людину. Він зрозумів, що хтось схопив його за руку.\n\n"Гей!" Це був інший протестувальник, який тягнув його геть. "Давай! Нам треба забиратися звідси зараз!" Боб підвів очі, коли заціпеніння розвіялося, і побачив, як поліцейські підняли гвинтівки. Вони без вагань відкрили вогонь, гумові кулі посипалися на натовп, коли вони рушили вперед. Вони полювали на того, хто кинув цеглину. Полювали на нього, поки він тікав."
 wif_crisis.305.a: "А коли він тікав, обурення знову наростало."
 
 wif_crisis.306.t: "...Але я не застрелив помічника"
 wif_crisis.306.d: ""Про що ти думав, чоловіче?" — це були перші слова Банні, коли Боб повернувся до гурту, виснажений, подряпаний, але все ще охоплений вогнем. За словами пішли обійми та слова полегшення. "Я ж казав тобі, що ці протести — погана новина."\n\nБобу не було чим виправдатися. "Я мусив це зробити."\n\n"Ти постраждаєш, якщо продовжиш це робити", — похитав головою Пітер. "Ти тут робиш дещо хороше, але ти постраждаєш."\n\n"Так, Боб", — похитав головою Банні. "Тобі сьогодні пощастило, але все лише погіршується. Погана увага чи ні, я радий, що ти в безпеці."\n\nБоб відчув полегшення, що жоден із них не надто сердився на нього через те, що він зробив — особливо коли він зрозумів, що його фотографію було зроблено і вона опинилася на першій шпальті щоденної газети. Чи сердилися вони через те, що він втягнув Вейлерів у суперечку? Через те, що він узагалі там був? Очевидно, але зрештою він був їхнім приятелем і тепер був у безпеці.\n\nБуло зворушливо це усвідомити. І саме це зробить те, що мало відбутися далі, ще важчим. "Я не можу продовжувати це разом із вами", — нарешті сказав він, дивлячись униз. "Я... не можу вдавати, що мені байдуже. До цього. І я не хочу тягнути вас униз через свої рішення. До того ж..." — він замовк. "Це те, чим я хочу займатися. Тепер я це бачу. Я нічого не зміню музикою. Можливо, я зможу зробити це іншим шляхом."\n\nБанні похмуро кивнув, а Пітер на мить заплющив очі. "Без тебе все буде не так... але я розумію", — сказав Пітер. Жоден із них, здавалося, не був здивований, навіть якщо засмучений. Боб знав, що згадуватиме перші дні з теплотою, але життя сповнене несподіванок, і іноді просто настав час рухатися далі. Потисками рук та обіймами він отримав останнє прощання від Банні."
 wif_crisis.306.a: ""Бережи себе, Бобе, і заходь, якщо коли-небудь будеш поблизу.""
 
 wif_crisis.307.t: "Регей-манія" # Погляд ОВН
 wif_crisis.307.d: "Виникнувши з мультикультурних традицій Ямайки, музикант Боб Марлі почав підкорювати світ своїм новим музичним жанром, який називається «реґей». Марлі стверджує, що назва походить від іспанського слова, що означає «музика короля», хоча етимологи та музиканти ставлять це під сумнів. Відокремившись від музичного гурту Вейлери, щоб розпочати сольну кар'єру, стиль Марлі поєднує джаз, блюз і традиційний ямайський жанр «менто» в новому музичному стилі, що бере коріння в релігії растафарі, допомагаючи вивести маловідому до цього панафриканську релігію на чільне місце.\n\nПісля здобуття широкої популярності по всій Ямайці та Вест-Індії музика Марлі поширилася до Сполучених Штатів, де її почали пов'язувати з молодіжними субкультурами, що прагнуть повстати проти норм американського суспільства, а також із визвольними рухами афроамериканців. Хоча ніхто достеменно не знає, як реґей так швидко став настільки популярним, схоже, він не зникне найближчим часом."
 wif_crisis.307.a: "Схоже, дітям це подобається."
 
 wif_crisis.308.t: "Регей-манія" # Погляд Сфери
 wif_crisis.308.d: "Виникнувши з мультикультурних традицій Ямайки, музикант Боб Марлі почав підкорювати світ своїм новим музичним жанром, який називається «реґей». Марлі стверджує, що назва походить від іспанського слова, що означає «музика короля», хоча етимологи та музиканти ставлять це під сумнів. Відокремившись від музичного гурту Вейлери, щоб розпочати сольну кар'єру, стиль Марлі поєднує джаз, блюз і традиційний ямайський жанр «менто» в новому музичному стилі, що бере коріння в релігії растафарі, допомагаючи вивести маловідому до цього панaфриканську релігію на чільне місце.\n\nПісля здобуття широкої популярності по всій Ямайці та Вест-Індії музика Марлі поширилася до Сполучених Штатів, де її почали пов'язувати з молодіжними субкультурами, що прагнуть повстати проти норм американського суспільства, а також із визвольними рухами афроамериканців. Хоча ніхто достеменно не знає, як реґей так швидко став настільки популярним, схоже, він не зникне найближчим часом."
 wif_crisis.308.a: "Що, в біса, роблять ці американці?"
 
