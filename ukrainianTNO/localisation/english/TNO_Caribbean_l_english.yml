# Домініка
 DMI_Patrick_Roland_John: "Патрік Роланд Джон"
 DMI_Eugenia_Charles: "Юджинія Чарльз"
 POLITICS_DMI_EUGENIA_CHARLES_DESC: "Залізна леді може й запізнюватися, але Юджинія Чарльз могла б погодитися з твердженням, що краще пізно, ніж ніколи. Народившись 1919 року наймолодшою з чотирьох дітей у заможній родині, вона зацікавилася правом лише після закінчення єдиної на Домініці школи для дівчат — завдяки роботі в магістратському суді. Вона отримала акредитацію в Університеті Торонто, ставши першою жінкою-адвокатом із Барбадосу, і заснувала юридичну фірму, що спеціалізувалася на корпоративних судових справах.\n\nЇї увага змістилася з початком правління ЛеБлана. Коли той почав схилятися до авторитаризму, вона стала його гучною опоненткою — спочатку через газетні колонки, потім приєднавшись до Борців за свободу, а згодом підтримавши Партію свободи Домініки. Після звинувачень у підбурюванні до заколоту та американській підтримці вона проводила кампанію за демократизацію та проти корупції, зрештою досягнувши успіху, коли усунення ЛеБлана зруйнувало єдність ослабленої Лейбористської партії та дозволило їй завершити своє сходження до влади.\n\nГазети можуть називати її першопрохідницею, але її амбіції виходять за межі одного успіху. Натомість вона сподівається, що її перебування на посаді підтвердить тенденцію, започатковану її попередником. Замість того щоб продовжувати хрестові походи ЛеБлана, вона прагнутиме налагодити зв'язки зі Сполученими Штатами та зосередиться на забезпеченні більшої прозорості в конституції Домініки. Завдяки цьому вона прагнутиме до процвітання, незалежно від послідовності подій, що передували їй та її приходу до влади."

 DMI_Nicholson_Ducreay: "Ніколсон Дюкре"
 POLITICS_DMI_NICHOLSON_DUCREAY_DESC: "Кожен радикал рано чи пізно бачить реакційний поворот колишнього союзника. У Цезаря був Брут, у Робесп'єра — Баррас, а в Едварда ЛеБлана — Ніколсон Дюкре. Народившись 1930 року у відносно заможній родині, Дюкре став учителем у Розо, перш ніж увійти в політику. Хоча він завжди був ситуативним союзником ЛеБлана, його роль у лісовій промисловості завжди передвіщала розкол. Приєднавшись до Лейбористської партії Домініки як видатний оратор, він пристосувався до розбіжностей і намагався їх примирити.\n\nЗайнявши посаду міністра торгівлі та виробництва, він став свідком значних змін протягом свого перебування на посаді, перш ніж у 1967 році його призначили віцепрем'єр-міністром, і він часто замінював свого наставника, поки той брав участь у далеких дипломатичних самітах. Але після цього їхні стосунки урвалися. Побоюючись дедалі більшого авторитаризму ЛеБлана та його зростаючої ворожості до іноземного бізнесу, Дюкре організував парламентський переворот разом із членами Партії свободи Домініки, ставши тимчасовим лідером за його відсутності. Тепер собака наздогнав автомобіль. Хоча план перевороту Дюкре був добре продуманий, його плани щодо управління країною виявилися слабшими. Гнів через його дії широко поширився Домінікою, навіть у лавах його власних прихильників, а його коаліція починає розпадатися. Водночас американська допомога почала надходити на острів у безпрецедентних масштабах. Дюкре переконаний, що, уклавши достатньо угод з усіма необхідними силами американського суспільства, він зможе приховати тріщини, спричинені його діями, та зберегти свій вплив."

 DMI_Edward_Oliver_LeBlanc: "Едвард Олівер ЛеБлан"

 POLITICS_DMI_EDWARD_OLIVER_LEBLANC_DESC: "На півночі, у В'єй-Казі, він став свідком злиденного життя народу. Занедбаної інфраструктури та відсутності належних умов для мешканців сіл. Саме це спонукало молодого Едварда ЛеБлана розпочати свій політичний шлях.\n\nЯк член Домініканської асоціації виробників бананів, ЛеБлан став свідком нахабних дій United Fruit проти бананових фермерів. Бачачи, як багатства Домініки привласнює іноземний покупець, ЛеБлан використав Домініканську лейбористську партію, щоб привернути увагу до колоніальної несправедливості та налагодити зв'язки з різними вітчизняними галузями. Згодом його зусилля привели ДЛП до посади прем'єр-міністра Домініки.\n\nМаючи чимало роботи, ЛеБлан прагнув відродити Домініку, поставивши культурне та економічне відновлення на чільне місце свого порядку денного. Він виступав за креольську мову креоль як офіційну мову, ширше використання місцевих звичаїв, націоналізацію бананової промисловості та покращення трудових прав домініканців. Уже тоді багато хто звинувачував ЛеБлана в диктаторських прагненнях. Наразі ці згубні звинувачення можна залишити без уваги, але його особиста популярність і згубне втручання Америки одного дня можуть змусити його діяти."

# Сент-Люсія
 SLU_George_Charles: "Джордж Чарльз"
 POLITICS_SLU_GEORGE_CHARLES_DESC: "Сент-Люсія ще довго пам'ятатиме ім'я сера Джорджа Чарльза. Хоча він здобув ґрунтовну освіту в першій середній школі острова, коледжі Сент-Мері, Чарльз, як і багато його ровесників, вирушив на жваві нафтові родовища Аруби, де вперше познайомився з організованим робітничим рухом. Повернувшись до Сент-Люсії після війни, він стрімко піднявся до керівництва Робітничою спілкою Сент-Люсії. Звідси до заснування Лейбористської партії Сент-Люсії був лише один крок. Партія здобула підтримку робітників і дрібних землевласників системи метаяжу, виступаючи проти наступу корпорацій.\n\nБудучи першим головним міністром після здобуття незалежності, Чарльз намагається врегулювати гострий конфлікт між поміркованими та радикалами у своїй партії, які вимагають націоналізації та політики розвитку. Його земельні реформи зламали втручання United Fruit, але водночас викликали гнів його колишніх прихильників із числа дрібних землевласників. Політична пустка чекає на Джорджа Чарльза, який веде Сент-Люсію за руку в сучасність."
 SLU_John_Compton: "Джон Комптон"
 POLITICS_SLU_JOHN_COMPTON_DESC: "Цього разу Джон Комптон — людина, яка не відокремлена від правлячого порядку. Народившись 1929 року на Кануані, ближче до Сент-Вінсенту, він переїхав до Сент-Люсії у віці десяти років, а згодом знову виїхав, щоб вивчати право та економіку в університеті. Розпочавши кар'єру як адвокат, що представляв інтереси робітників, він приєднався до Лейбористської партії та увійшов до парламенту в 1954 році, швидко здобувши популярність після того, як був заарештований і оштрафований за участь у страйку разом із цукровими робітниками.\n\nСпочатку він піднімався серед своїх однопартійців і був призначений заступником прем'єр-міністра, але його дедалі більше обурювала корупція колег, призначення Джорджем Чарльзом членів кабінету та зростання впливу самого Чарльза. Зрештою він повністю розірвав із партією, натомість об'єднавшись із консерваторами. Комптон підтримав дрібних землевласників, які намагалися зберегти занепадну систему метаяжу, і використав їхнє обурення загрозами з боку програм модернізації сільського господарства, щоб прийти до влади.\n\nНаразі Комптон є центром політики Сент-Люсії, але він знає, що так буде недовго. Його підтримка метаяжу залишається непохитною, і хоча великий бізнес сприймав його як необхідне зло для стримування соціалізму його попередника, він уже втомився від опору Комптона їхнім зусиллям із приватизації. У зовнішній політиці Комптон намагався зблизитися з Канадою та Сполученими Штатами, але його аграризм дедалі більше клинить його від United Fruit. З часом, можливо, диня розколеться навпіл."

# Гренада
 GND_Herbert_Blaize: "Герберт Блейз"
 POLITICS_GND_HERBERT_BLAIZE_DESC: "Компроміс нічого не виправляє, але це клейка стрічка, якою можна стримати жахливі випробування. Що було гірше — мати справу зі зрадою Вільямса чи приректи Гренаду власною пихатістю? Народившись 1918 року на Карріаку, Герберт Блейз був сином Гренадин, виріс на цих островах і навчився любити їх так само, як і своїх земляків. Як і його противник Ерік Ґейрі, у молодості Блейз працював на Арубі, але повернувся звідти не з уроком протистояння, а з розумінням необхідності поміркованості. Дехто вважає його надто обережним, особливо для політика, але це частина його характеру — зрештою, єдиною причиною існування Національної партії Гренади було протистояння войовничому націоналізму Ґейрі.\n\nОсобисті політичні погляди Блейза помірковані. Він націоналіст, але не радикал — він не має любові до влади Навітряних островів, але вважає за необхідне співпрацювати з володарем Гренадин та діяти в обхід нього, а не вести марну боротьбу. У фінансових і соціальних питаннях він консерватор із ліберальними поглядами, натхненними Новим курсом, і часто виступає за реформи, де це можливо.\n\nНасправді амбіція Блейза досі полягає в тому, щоб зробити Гренаду суверенною країною, але він розуміє, що маленька острівна держава не може відштовхувати від себе підтримку. Щоб утримати економіку на плаву, поки Канада відходить із Карибського регіону, він уклав угоду з тринідадським дияволом, попри ідеологічні розбіжності та ризик бути поглинутим. Цей крок, хоч і необхідний, коштував йому майже всього політичного капіталу, і Ґейрі неодмінно завдасть удару. Питання лише в тому — коли?"

 GND_Eric_Gairy: "Ерік Ґейрі"
 POLITICS_GND_ERIC_GAIRY_DESC: "Народжений 1922 року та вихований як побожний римо-католик, опортунізм Еріка Ґейрі не личить доброму християнину, але саме цього й потребує запальний прихильник відокремлення. У молодості він працював за кордоном на нафтовій компанії на Арубі, а коли повернувся до Гренади як профспілковий організатор, зрозумів своє справжнє покликання: не бути робітником, а підбурювати натовп. Він побудував індустріальну імперію на Спілці ручних і розумових працівників Гренади, лише щоб використати її як інструмент для початку свого хрестового походу — саме він спровокував «Дні червоного неба», як називали численні підпалені будівлі під час трудових протестів у 1950-х.\n\nНе звиклий досягати своєї мети звичайними методами, Ґейрі, щоб увійти в парламентську політику, заснував ліву націоналістичну Об'єднану лейбористську партію Гренади як політичне крило своєї профспілки. Як політик, що виступав за незалежність, він вів безперервну боротьбу як проти влади Навітряних островів, так і проти свого заклятого ворога Герберта Блейза, розцінюючи його співпрацю з Тринідадом як зраду.\n\nЯк і всі застарілі речі, ліву риторику довелося відкинути, коли націоналізм став вигіднішим. Він зібрав невелику армію найманців, головорізів і політичних союзників у самопроголошену антитринідадську коаліцію — флібустьєрську кампанію, яка вигнала гарнізон Еріка Вільямса з островів. Дехто вважав неймовірним, що Ґейрі міг зібрати такі сили без іноземного покровителя, та й сам він так вважав. Але тепер Гренада — його коронний діамант, і йому залишається лише втримати її такою."

 BRM_Mr_Bermuda: "Містер Бермуда"
