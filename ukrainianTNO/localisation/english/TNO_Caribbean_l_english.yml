 JAM_flavor.50.t: "That Old Dance Routine"
 JAM_flavor.50.desc: "Edward Seaga was recognized when he traveled, so when he needed to meet with people that Manley didn't want him to meet, it meant a little razzle-dazzle. He'd send one of his bodyguards out in a hat and his coat to buy something inconspicuous - a six-pack of beer or some junk food, anything that a man who worked as hard as he did would need to take the edge off at 11 at night. Then he'd wear a wig and pad his coat and drive off, as if he were one of his staff taking off for the night. A simple shake of his tail, then he could meet his benefactors. Manley had been more and more on edge lately as his situation deteriorated. It wouldn't be long before Seaga would need to put more effort into his steps.\n\n"Gentleman, how fares Mister Shackley?" Seaga greeted the three stone-faced FBI agents. Shackley had been arranging more meetings of late, and that had plenty of portents, both for fair and for foul.\n\n"He's well. But we're not here for pleasantries, Mister Seaga. We think it might actually be time to start making arrangements for a more...active role in the changing of the leadership situation."\n\nIf Shackley's assets were this clinical, it meant that something was serious. Shackley was amiable enough, but the mission's importance always meant that his smoother edges were worn down when it came time to get something done. It made him a great station chief, and why he'd never make director of the Bureau.\n\n"Of course. Let's outline our options. Despite everything, Manley retains support among his loyal cadre, so we should keep in mind that even if the entire island hates him, there will be plenty of people willing to dance to his tune. If you like the song, it seems, then you can't help but tap your feet.""
 JAM_flavor.50.a: "In the night, the FBI laid out the steps, and Seaga wondered if it would be enough to carry the floor."

 JAM_flavor.51.t: "Sharks in Paradise"
 JAM_flavor.51.desc: "Office of the Central Intelligence Agency, surveillance recording transcript.\nRecorded on site in downtown Georgetown, relevant names redacted for posterity.\n\nREDACTED 1: "-re not blind to what's been going on in Kingston."\nSEAGA: (Pointed) "Aren't you now?"\nREDACTED 2: "It's the reason we are all here, we can sort you out, sort this out."\nREDACTED 1: "Jamaica is going to get the sweetheart treatment, humanitarian aid camps, development subsidies, trade deals. No big announcements per se, just things coming down the pipe."\nSEAGA: (Pause) "And the violence?"\nREDACTED 1: (Longer Pause) "I'm sorry?"\nSEAGA: "The violence in Kingston, reports on the crime rate."\nREDACTED 2: "I-I've bits of it on CNN..."\nSEAGA: (Hushed) "Look, I am not ungrateful and I speak on behalf of our people-"\nREDACTED 2: "Oh, n-no. We understand! Very clearly."\nSEAGA: "I don't need to remind you of everything that's happened lately in the Caribbean. Santa Domingo, Havana...Kingston is not there yet, thank God, but if this gets any worse..."\nREDACTED 1: (Pause) "...I see."\nREDACTED 2: "We can only promise so much, we'll see what we can do. Hopefully, it won't come to that."
 JAM_flavor.51.a: "END OF RECORDING"

 JAM_flavor.52.t: "Kingston's Liberty in Chains Discovered"
 JAM_flavor.52.desc: "For a few days after the Jamaican Revolution had begun in earnest, the offices of the Jamaican Labour Party had been left in a state of limbo, occupied only by a few members of the Black Star Brigade awaiting orders. Upon new orders, however, this silence was broken. Almost suddenly, each desk drawer was harvested in turn, each paper in each office torn apart for signs of dissent, or of gifts, or of imports, thrown onto piles and sent away in turn. Nails in a coffin.\n\nBy the morning, Billy Strachan roared onto the radio with stunning revelations. The Jamaican Labour Party, and especially Alexander Bustamante, had happily tied itself to the Iberian government, allowing Iberia to smuggle goods through its ports in return for a premium on embargoed goods. In reports echoed by excited newsanchors, fascism had lost its anchoring with the revolution. From Jamaica, it could finally be uprooted, expunged and consigned to history.\n\nThroughout the afternoon, Montego Bay Airport swelled from full to bursting. What few Iberian citizens had yet to leave quickly found themselves overwhelmed by members of the Jamaican Labour Party, hoping to stretch their local campaigns to pivotal trades in Lisbon or Madrid or Casablanca, or to stunning subversions of fascism in New York, or Toronto, or to wherever would take them. As the sky turned a burning orange, queues buckled to haggling as confusion mounted. Few would have their questions answered.\n\nAs night fell once again, and as Jamaican air traffic was shuttered, the arrests began. At first, it was only the mid-level functionaries, those specifically named by diplomats and spies as helping with their cause in some way. Their testimonies only allowed for such remit to be extended. Over the next day, a full list of Jamaican Labour Party members was drawn up. Most were visited and questioned, and many were arrested, charged with reactionary practice, and sentenced to life in prison."
 JAM_flavor.52.a: "One side of the Atlantic loses its wire to its other half."

 JAM_flavor.53.t: "From Distant Shores"
 JAM_flavor.53.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM THOMAS COBELn\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: STATE OF JAMAICAN POPULAR REPUBLIC AND ITS EXILES\n\nAfter the recent overthrow of the government, the JPR has been steadily stabilizing its regime. The government is unlikely to collapse on its own unless intervention is used. With the new government in power, JLP members, business elites, and disaffected liberals from the PNP have fled to Miami.\n\nThe FBI has been in contact with these exiles, with JLP member Edward Seaga being an important asset for the bureau. Some exiles have made requests and petitions to the government to help them return to Jamaica by helping enact a counterrevolution. Agents have reported a close camaraderie and extreme desire to return among the group.\n\nIf aided, the exiles could create unrest and help with subversive activities in Jamaica, perhaps even leading to their requested counterrevolution, or an invasion of the island."
 JAM_flavor.53.a: "FIDELITY, BRAVERY, INTEGRITY."

 JAM_flavor.54.t: "Jamaican Opposition Movements Begin to Organize"
 JAM_flavor.54.desc: "TOP SECRET/[GetDateText]\n\nFROM THEODORE SHACKLEY\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: COORDINATION OF ANTI-BOLSHEVIST FORCES IN JAMAICA\n\n1. A group of Jamaican exiles amenable to CIA efforts has landed in Jamaica in recent days and has succeeded in coordinating opposition to the Strachan regime. There is a definite opposition within the island, but a combination of geography, government repression, and personal infighting has greatly limited their capacities.\n\n2. Our communication has been limited, but consistent, and provides a clear picture of Jamaica's opposition. Although reduced, Iberian smuggling networks have survived and are still actively spreading weaponry, though they are vying with numerous homegrown gangs for hegemony. A number of former Jamaican Labour Party supporters have also begun to form small entities, though they have yet to become firmly militant.\n\n3. Existing criminal networks will not be viable governing partners, but their organization and their capacity to reduce government strength make them a potential ally for now. Iberia seems to have abandoned the country entirely, which will provide an easy offramp for the JLP to become far more amenable to American influence."
 JAM_flavor.54.a: "FIDELITY, BRAVERY, INTEGRITY."

 JAM_flavor.55.t: "Let Bygones Be Bygones?"
 JAM_flavor.55.desc: "Winston nervously fiddled with the handle of his worn leather briefcase. This entire week had felt like elaborate torture. It began with a humiliating economy-class flight on a standard commercial airliner, and continued with seven days of waiting in a faceless Washington motel. For seven days, he and his colleagues had worked the phones non-stop, fawning over junior senators' clerks and begging for meetings with the very American businessmen whose assets the people's republic had so proudly expropriated.\n\nAnd now, the heavy oak doors opened. Winston stepped into the office of the US Secretary of State and almost choked. Sitting to the left of the host were them - the leaders of the Jamaican exile community from Miami, flashing smug smirks. No chairs had been provided for the delegation from Kingston.\n\nLooking into the eyes of the American minister, Winston was already visualizing the impending interrogation minute by minute. He knew exactly what was coming. Dry, striking questions about what they wanted, why Washington should believe them, and what concessions they were willing to make. And he would have to, swallowing the remnants of his revolutionary pride, lay it all out: begging for loans, promising sweeping privatization in favor of US corporations, and swearing to return Jamaica to the fold of the OFN. He frantically rehearsed the hardest answer in his mind-for the moment the Secretary would nod at the beaming exiles and demand their return to the government.\n\nWinston exhaled and took a step forward. The doors closed behind the delegation.\n\nAnd the meeting ended...""
 JAM_flavor.55.a: "...with an uncompromising ultimatum: America demands the full return of the exiles to power"
 JAM_flavor.55.b: "...with a cynical deal: money doesn't stink, and we are ready to work with the new regime."

 JAM_flavor.56.t: "Brief Skirmish Between Jamaican and Canadian Forces"
 JAM_flavor.56.desc: "SECRET/[GetDateText]\n\nFROM THEODORE SHACKLEY\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: SHOOTOUT BETWEEN RED JAMAICAN MILITIAS AND EVACUATING ANGLO-CANADIAN FORCES\n\n1. Canadian efforts to evacuate Canadian and British civilians have met resistance from Jamaica's Black Star Brigade, headed by revolutionary leader Billy Strachan, with a shootout happening at 03:45 last night around Ocho Rios. Casualties did occur, but were limited and didn't seem to have dramatically impacted the course of this operation.\n\n2. RCMP marines have been involved in the evacuations and have adhered to their expected schedule. The shootout occurred largely between individuals, but our communique with Ottawa indicates that this was likely an ambush. Both sides only experienced the loss of individual soldiers, who are now being posthumously valorized, and both have declared victory.\n\n3. Such developments are troubling, but our options are limited. Canadian strategy with this evacuation was reckless, but hasn't led to any civilian harm, and any criticism will likely be met with a harsh backlash from Canada. Our own efforts to evacuate personnel from Jamaica should be hastened, but no other changes should be imminently made."
 JAM_flavor.56.a: "Issue a condemnation of the Jamaican Popular Republic. We can't do anything else at this time."

 JAM_flavor.57.t: "Strachan's Firm Course"
 JAM_flavor.57.desc: "Cigarette smoke drifted lazily toward the ceiling. Marcus, a functionary of the People's National Party, stared at the Canadian investor sitting across from him. The man was spewing curses and threats, but Marcus merely waited patiently for a pause.\n\n"Listen, Mr. Davis. We are offering to buy out seventy-five percent of the shares in your tungsten mine at, let's say, government rates," Marcus intertwined his fingers. "The state takes over all management, logistics, and union relations. You do absolutely nothing and simply collect your dividends from the remaining share."\n\nThe Canadian turned purple, calling it legalized robbery. After a tense but predictable negotiation, they settled on fifty-five percent in favor of Kingston. Marcus barely hid a smile: this was the exact figure the party had initially planned due to a banal lack of funds for a full buyout. As a guarantee, a copy of a fresh government decree was slid across the table-Strachan's official order suspending forced nationalization. Weighing the risks, the Canadian realized: it was better to earn passive income and retain the option to sell the rest later than to lose everything right here and now. He gave a curt nod, scribbled his signature, and left the room.\n\nLeft alone, Marcus let out a sigh of relief and clicked the knob on the radio. Yes, the denizens of the White House still didn't trust Strachan and considered them radicals, but now few people cared. The economy had avoided collapse, and rumors of an imminent counterrevolution had dissipated. Suddenly, the solemn voice of an announcer came through the speaker: the Revolutionary Committee was officially relinquishing its emergency powers. The country was preparing for the first free elections in the history of the new Jamaica."
 JAM_flavor.57.a: "Putting the house in order doesn't mean burning it down."

