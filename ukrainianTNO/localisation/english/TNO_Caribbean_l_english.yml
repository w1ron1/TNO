 ###Characters###
 WIN_Grantley_Herbert_Adams: "Grantley Herbert Adams"
 WIN_Norman_Manley: "Norman Manley"
 WIN_Eric_Williams: "Eric Williams" #Also used for Trinidad
 POLITICS_ERIC_WILLIAMS_TRI_DESC: ""

 WIN_ANR_Robinson: "A.N.R. Robinson"
 POLITICS_WIN_ANR_Robinson_DESC: "Born in 1926 on the island of Tobago, Arthur Nathan Raymond Robinson has long been a name to watch in Trinidadean politics. Wracked by illness throughout his childhood, Robinson nonetheless thrived in the school headed by his father, eventually receiving a scholarship to study law at McGill University in Montreal, where he directed efforts to encourage the creation of an international criminal body within his university.\n\nFollowing a brief career as a law clerk, he turned to studying politics at Harvard before returning to Tobago, where he ran for office under the old Anglo-Canadian system as a staunch supporter of Caribbean autonomy, a streak he maintained once entering office in the West Indies Federation. But with the Black Power Revolution on Tobago and the downfall of Shearer's government, Robinson was forced upwards once again, becoming the man responsible for picking up the pieces.\n\nThe disgrace of his predecessor has only tightened the strings that Robinson now desperately hopes to cut loose. With his friendship with Eric Williams increasingly eroding, Robinson has become perceived as the moderate alternative to other Trinidadeans. A reformer critical of both the repression of the Black Power Revolution and of neocolonialism, the pressures imposed on the West Indies Federation may have already crushed his agenda before it truly began."

 #Antigua
 ANT_Vere_Bird: "Vere Bird"
 ANT_George_Walter: "George Walter"
 
 #Dominica
 DMI_Patrick_Roland_John: "Patrick Roland John"
 DMI_Eugenia_Charles: "Eugenia Charles"
 POLITICS_DMI_EUGENIA_CHARLES_DESC: "The Iron Lady may be late, but Eugenia Charles would back the assertion that it is better late than never. Born in 1919 as the youngest of four children to a wealthy family, her interest in law only came after her graduation from Dominica's only girl's school, a result of her work in the magistrate's court. She received accreditation from the University of Toronto, becoming the first female Bajan lawyer, and setting up a law firm focused on corporate litigation.\n\nHer attention would drift as LeBlanc's tenure set in. As he drifted towards authoritarianism, she became a vocal opponent, first in newspaper columns before joining the Freedom Fighters, and then backing the Dominica Freedom Party. Through accusations of sedition and American backing, she campaigned on a ticket of democratization and anti-corruption, finally prospering as LeBlanc's removal shattered the unity of the ailing Labour Party, and allowed her to finish her ascendancy.\n\nNewspapers may register her as a trailblazer, but she has ambition beyond just coasting on a single success.  Instead, she hopes that her term in office will confirm the trend of her predecessor. Rather than embracing the crusades of LaBlanc, she will seek to build ties with the United States, and will focus on building greater transparency into the Dominican constitution. Through this, she will seek prosperity, no matter the sequence of events that preceded her and her rise."

 DMI_Nicholson_Ducreay: "Nicholson Ducreay"
 POLITICS_DMI_NICHOLSON_DUCREAY_DESC: "Every radical sees a reactionary turn from a former ally. Caesar had Brutus, Robespierre had Barras, and Edward LeBlanc had Nicholson Ducreay. Born in a relatively prosperous family in 1930, Ducreay became a teacher in Roseau before entering into politics. Although always a loose ally to LeBlanc, his role in the logging industry always presaged a divide. Joining the Dominica Labour Party as a prominent public speaker, he adapted to the division and sought to reconcile them.\n\nSettling into the role as Minister for Trade and Production, he saw significant developments throughout his tenure, before being appointed as Deputy Prime Minister in 1967, often filling in whilst his mentor engaged on far-flung diplomatic summits. From there, though, the relationship snapped. Wary of LeBlanc's growing authoritarianism, and fearful of his budding hostility to foreign business, Ducreay orchestrated a parliamentary coup alongside members of the Dominica Freedom Party, becoming interim leader in his absence.Now, the dog has caught the car. Although his plan for the coup was refined, his plans for office have been found lacking. Anger at his actions is widespread in Dominica, even within his own ranks, and his coalition is beginning to fracture. American aid, however, has begun reaching the island to unprecedented levels. Ducreay is certain that, with enough deals with all necessary pillars of American society, he can paper over the cracks his actions have caused and secure his influence."
 
 DMI_Edward_Oliver_LeBlanc: "Edward Oliver Leblanc"

 POLITICS_DMI_EDWARD_OLIVER_LEBLANC_DESC: "Up north in Vielle Case, he witnessed the people's despondent lifestyle. Of derelict infrastructure and lack of decent facilities for the villagers. It provided the impetus for young Edward Leblanc to begin his journey in politics.\n\nAs a member of the Dominican Banana Growers Association, Leblanc witnessed United Fruit's flagrant ventures against banana farmers. Seeing Dominica's riches pilfered by a foreign bidder, Leblanc would bring the Dominican Labour Party to highlight colonial injustice and make connections to various domestic industries. His efforts would later reward the DLP with the Dominican premiership.\n\nWith his work cut out for him, Leblanc sought to revitalize Dominica, with policies of cultural and economic rejuvenation put at the forefront of his agenda. Favoring Kwéyòl as the official language, featuring more local customs, nationalizing the banana industry, and improving labor rights for his Dominicans. Already, many accused Leblanc of his dictatorial aspirations. These pernicious accusations are for the birds for now, yet his personal popularity and America's miscreant meddling may force his hand one day."

 #Saint Lucia
 SLU_George_Charles: "George Charles"
 POLITICS_SLU_GEORGE_CHARLES_DESC: "Saint Lucia will long remember the name of Sir George Charles. Though he enjoyed a thorough education in the island's first secondary school, Saint Mary's College, Charles followed others of his generation to the ever-busy oilfields of Aruba, and there made his first contact with organized workers. Returning to Saint Lucia after the war, he'd see a meteoric rise to the head of the Saint Lucia Workers' Union. From there it wasn't a big leap to the founding of the Saint Lucia Labour Party, which earned the loyalty of workers and the petty landowners of the Metayage system by fighting back corporate encroachment.\n\nAs the first Chief Minister post-independence, Charles mediates a harsh moderate-radical split in his party, which demands nationalizations and a developmentalism. While his land reforms broke the meddling hand of United Fruit, they have also incurred the wrath of his former smallholder backers. A political wilderness awaits as George Charles leads Saint Lucia by the hand into modernity."
 SLU_John_Compton: "John Compton"
 POLITICS_SLU_JOHN_COMPTON_DESC: "For once, John Compton is a man not disconnected from the ruling order. Born in 1929 on Canouan, closer to St. Vincent, he moved to St. Lucia at the age of ten, before moving out once more to study law and economics in university. Starting his career as a labour lawyer, he joined the Labour Party and entered into Parliament in 1954, quickly making a name for himself after being arrested and fined for participating in a strike alongside sugar workers.\n\nAt first rising among his peers, being appointed as Deputy Premier, his growing disgust with the corruption of his peers, with appointments made by George Charles to the cabinet and his concern over Charles' growing strength, he split from the party entirely, instead choosing to align himself with the conservatives as he embraced the cause of the smallholders holding onto the declining Metayage scheme, and using their fury at threats from agrarian modernisation programmes to propel himself into office.\n\nFor now, Compton is the centre of St. Lucian politics, but he knows it won't be for long. His support for Metayage is solid, and whilst large businesses saw him as a necessary evil to ward off the socialism of his predecessor, they have grown tired of his opposition to their efforts at privatization. In foreign policy, Compton has attempted to draw closer to Canada and the United States, but his agrarianism has increasingly put a wedge between him and United Fruit. With time, perhaps the melon will split altogether. "

 #Grenada
 GND_Herbert_Blaize: "Herbert Blaize"
 POLITICS_GND_HERBERT_BLAIZE_DESC: "Compromising does not fix anything, but it is the duct tape to hold back dreadful ordeals. Was dealing with Williams' treason, or dooming Grenada with his own hubris, worse? Born on Carriacou in 1918, Herbert Blaize was a son of the Grenadines, raised on the islands and learning to love them as much as his fellow men. Like his nemesis Eric Gairy, Blaize spent time in his youth working in Aruba, but he returned not with a lesson of trouble, but with an understanding of moderation. Some call him overly cautious, especially for a politician, but it is part of his character—after all, the sole reason for the Grenada National Party's existence was to counteract Gairy's firebrand nationalism.\n\nBlaize's personal politics are moderate. He is a nationalist, but not a radical—he has no love for the Windward Islands authority, but sees the need to work with, and around, the Grenadines' overlord rather than fighting futilely. Fiscally and socially, he is a conservative with New Deal–inspired liberal leanings, often promoting reforms where possible.\n\nIn truth, Blaize's ambition is still to make Grenada a sovereign country, but he understands a small island nation cannot alienate support. To keep the economy afloat as Canada withdraws from the Caribbean, he made a deal with the Trinidadian devil, despite ideological disagreements and the risk of being subsumed. This act, though necessary, cost him nearly all political capital, and Gairy will surely strike soon. The only question is, when?"

 GND_Eric_Gairy: "Eric Gairy"
 POLITICS_GND_ERIC_GAIRY_DESC: "Born in 1922 and brought up as a devout Roman Catholic, Eric Gairy's opportunism is unbefitting of a good Christian, but just so happens to be what a secessionist firebrand needs. As a youth, he worked abroad in Aruba for an oil company, and when he returned to Grenada as a union organizer, he realized his true calling was not to be a worker, but a rabble-rouser. He built an industrial kingdom off the Grenada Manual and Mental Workers' Union, only to use it as a tool for starting his crusade—he was the one who instigated the "Sky Red Days", or so they called the many burning buildings during the labor protests in the '50s.\n\nNo stranger to achieving his goal by unconventional means, in order to enter parliamentary politics, Gairy founded the left-wing nationalist Grenada United Labour Party as the political branch of his union. As a pro-independence politician, he fought in a perpetual war against both the Windward Islands authority and his nemesis, Herbert Blaize, taking his collaboration with Trinidad as treason.\n\nAs with all obsolete things, the leftist posturing had to go when nationalism was more profitable. He rallied a small army of mercenaries, ruffians, and political allies in a self-proclaimed anti-Trinidadian coalition, a filibuster that expelled Eric Williams' garrison from the islands. A few found it improbable that Gairy could gather force without a foreign sponsor, and so did he. But Grenada is now his crown jewel, it just has to stay that way."
 
 BRM_Mr_Bermuda: "Mr. Bermuda"
 PUR_Mr_Puerto_Rico: "Mr. Puerto Rico"

 #Bahamas
 BAH_Roland_Theodore_Symonette: "Roland Theodore Symonette"
 POLITICS_BAH_ROLAND_THEODORE_SYMONETTE_DESC: "From his bootlegging days during prohibition to his premiership of the Bahamas, Roland T. Symonette has always been a businessman at heart. Since the islands achieved self-governance in the 1950s, Symonette has kept the white aristocracy of the United Bahamian Party, also known as the Bay Street Boys, in power through cutthroat practices that often mirror those of his patrons in organized crime.\n\nDespite the racial gerrymandering and corruption, Symonette has undoubtedly boosted the economy of the Bahamas. Luxury casinos and lavish beach resorts have drawn tourists from all across the Americas, but little of this wealth has trickled out of the mansions on Bay Street.\n\nYes business is booming but Symonette knows that he is not immortal. Like all good aristocrats has begun to attempt to show his son Bobby Symonette the ropes of governance, at least whenever he can get the brash playboy away from ropes on his yacht."
 
 BAH_Bobby_Symonette: "Bobby Symonette"
 POLITICS_BAH_BOBBY_SYMONETTE_DESC: "Few men conjure up quite the image that Robert Symonette has. The heir apparent to the fortune of the Symonette Empire, Bobby's ascendancy to power came almost as naturally to him as his yachting. Born in 1925, his father's long-running strength in the Bahamian House allowed for Bobby to ascend not only to his ranks, but to the post of Speaker entirely, tying the institution even closer to the family name. Buoyed by corporate influence, clandestine funding from casinos and by institutions across the Bahamas, the wind is in Bobby's sails.\n\nIt is fitting, then, that Bobby's life is consumed by few institutions as that of yachting. One of the founders of the Yachting Association, Bobby Symonette is a regular and proficient contender in the Olympics, and has already brought home numerous gold medals. In many circles, Symonette is regularly discussed as a decisive icon, but few of them are truly in the political sphere.\n\nFewer men conjure up the level of hatred that Symonette has. The heir to a white political dynasty that has helped to dominate Bahamian politics for decades, many have grown tired of his international escapades, and the privilege that it represents. Whilst Bahamians continue to struggle with intense deprivation, they grow tired of the news stories of him winning gold for himself at Olympic tournaments the world over. When people hear of his escapades, they simply hear of the youngest of the Bay Street Boys, nepotism guiding him forwards."

 BAH_Kendal_Isaacs: "Kendal Isaacs"
 POLITICS_BAH_KENDAL_ISAACS_DESC: "The old order remains, but its newfound tilt is clear. Born in 1925, Kendal Isaacs became one of only a few to attend Government High School, and his loyalties remained clear after that. Serving in the North Caribbean Force during the Second World War, only the consequences of Operation Sea Lion pushed him elsewhere. Studying law afterwards, he first entered the civil service, before being appointed as Solicitor-General in 1961, then as Attorney-General in 1963.\n\nFrom there, his entrance into politics was not too difficult, nor were his eventual ties overly difficult to ascertain. Quickly ingratiating himself with the right circles, Isaacs was eventually capable of pushing himself to the heights of the United Bahamian Party as a means for them to aesthetically distance themselves from their past. Whilst the party will accept the withdrawal of its past public figures, its foundations continue to cleanly bore into the Bahamian national consciousness.\n\nOn paper, Isaacs is expected to maintain the interests of the traditional, aristocratic elites that continue to back the UBP, even to the extent of his avid interest in tennis. However, Isaacs is not satisfied with simply toeing the line. With pressure from reformists and from Pindling mounting, Isaacs has quickly turned to total moderation, hoping to cleanly accommodate the pair. Only time will tell if such a measure works to maintain some of his old political allies."

 BAH_Lyndon_Pindling: "Lyndon Pindling"
 POLITICS_BAH_LYNDON_PINDLING_DESC: "The Bahamian tolerance for the old order has faded away, and with it, Pindling has been brought once again to a new location. The son of a Jamaican father and an Acklins mother, Pindling spent much of his youth being shuffled around a number of schools until finally becoming one of only twenty to enter Government High School. After being called to the Bar at King's College, Pindling joined the Progressive Liberal Party as a legal advisor in 1953, before entering into Parliament in 1956, being coronated as leader shortly afterwards.\n\nThe scandal that had enveloped his predecessor may have clawed at his feet, but Pindling remains committed to a vision dragging itself away from the legacy of an aristocratic elite. With the aim of eventual Bahamian independence, Pindling has pushed through a redistributive vision, aiming to move gains from tourism over to the lives of the average Bahamian person. Pindling is no revolutionary, however; his vision is one that still maintains many of the prior economic trappings, and its economic gains.\n\nNot all have welcomed his success. His relative hostility to tourism has not gone unnoticed by the many American and Canadian corporations functioning within, and many have begun to write of him, even within the party he rules, as a mere synonym for Fidel Castro. To many native Bahamianians, though, Pindling is a saviour, a founding father wrapped in the banners that only a national hero truly could."

 
 #Jamaica
 JAM_Alexander_Bustamante: "Alexander Bustamante"

 JAM_Norman_Manley: "Norman Manley"
 POLITICS_JAM_NORMAN_MANLEY_DESC: "Coming from a mulatto family in 1893 with a scholarly upbringing, Norman Manley was Alexander Bustamante's main backer until the Second World War. He saw trade unionism as a fight for all since the beginning of his career—and for that cause, he fought many legislative battles to keep it an anchor for progressivism. But never did he fully anticipate his own first cousin, who was supposed to act as a chief representative of the ideal, to betray the world for a morsel of power trickled down from Ottawa.\n\nAlthough the Jamaican Labour Party's split from the PNP was hardly detestable alone, Manley saw it differently. For Manley, his two-decade rivalry with Bustamante was not just about Bustamante's endorsement of a government deadset on crushing a benign mission for universal suffrage. It was the tragedy of seeing a close kin prove a turncoat. Throughout the '50s and '60s, he had run continuously as Bustamante's strongest opposition while cultivating his son, Michael, to continue his mission of toppling the JLP.\n\nA federalist and classical Fabian socialist, Manley is not a radical, no more than those who betrayed their cause to conservative elitism. Now, as the Busta machine falls and a Jamaican Republic rises in its place, Manley's legacy, if not his principled opposition, will be that of a nation's founder, as a symbolic interim president. Though his days are numbered, he can at least die happy knowing Jamaica is heading towards an equitable direction that is more than a ruse."

 JAM_Michael_Manley: "Michael Manley"
 POLITICS_JAM_MICHAEL_MANLEY_DESC: "The son of veteran statesman Norman Manley, Michael Manley, born December 10, 1924, is a dictionary champagne socialist—for the people, by the people, but never of the people. During the Second World War, when his father's political career shifted from leadership to dissidence after Bustamante's defection from the People's Nationalist Party, Michael was gathering political repute in the Royal Air Force. He made many English friends during his service, and to his chagrin, also unconsciously adopted the demeanor of the stiff-lipped Brits in his circle.\n\nHaughty and anglicized, Michael still sees Jamaica as his homeland. As Canada continued supporting Bustamante's dictatorship while growing insular, at the expense of Jamaican reformist efforts, Michael and his father, lacking better options, pledged support to the republican cause. Unlike the unapologetically privileged Norman, Michael is eager to rid the PNP of its reputation as the elite's left-wing party, now that the party is not struggling to just keep afloat.\n\nSuch a goal would have been Sisyphean while the Busta Union held its stranglehold on the working class, but with Bustamante's overthrow, the PNP under Michael is making strides in adopting a populist rhetoric. Though averse to becoming another Busta, Michael sees no issue with turning a blind eye if his issues were to disappear without notice. In his democratic Jamaica, northern corporates and local troublemakers are not given more respect than they deserve."
 POLITICS_WIN_MICHAEL_MANLEY_DESC: "The son of veteran statesman Norman Manley, Michael Manley, born December 10, 1924, is a dictionary champagne socialist—for the people, by the people, but never of the people. During the Second World War, when his father's political career shifted from leadership to dissidence after Bustamante's defection from the People's Nationalist Party, Michael was gathering political repute in the Royal Air Force. He made many English friends during his service, and to his chagrin, also unconsciously adopted the demeanor of the stiff-lipped Brits in his circle.\n\nHaughty and Anglicized, Michael still sees Jamaica as his homeland. As Canada continued supporting Bustamante's dictatorship while growing insular, at the expense of Jamaican reformist efforts, Michael and his father, lacking better options, pledged support to the republican cause, and ultimately, towards the West Indies Federation, leaving him as the electoral voice of the West Indian left.\n\nDespite his misgivings, Manley now rules over a united West Indies Federation, propped up by his Trinidadian ally, Eric Williams. Through the hesitation of American and Canadian allies, he will seek a centralized, developmentalist Federation. Privately, Manley tells himself that this is the realisation of his father's dream of a prosperous Caribbean, but as his American allies increasingly shut him out, and as Williams' profile and the centrality of Trinidadian oil only grows stronger, Manley fears how true his expectations really are."

 JAM_Donald_Sangster: "Donald Sangster"
 JAM_Hugh_Shearer: "Hugh Shearer"
 POLITICS_JAM_HUGH_SHEARER_DESC: "A country is a ship; it needs an able hand to steer it. This concern is no less true for a nation as divided by the sea as the West Indies Federation. Born in 1923, Hugh Shearer was raised around Trelawney, Jamaica, eventually receiving a law degree at Howard University in Washington D.C., but dedicated his attention to his newspaper, the Jamaican Worker, forging alliances with the Jamaican working class and, importantly, bringing him under the tutelage of Alexander Bustamante.\n\nThe next decades of his life were defined by this alliance, slowly tainting him with corruption even as he endeared himself to the wider labour movement. First raised to the House of Representatives of Jamaica in 1955, he found himself slowly rising the ranks of the Jamaican Labour Party, eventually being appointed to the Senate after an electoral defeat. The Kingston Conference saw him officially raised to being Bustamante's right-hand man, and succeed him as the primary force of the Caribbean and Jamaican right shortly afterwards.\n\nWhen Hugh Shearer looks to the future, he can only see the storm sweeping over the horizon. Leftism and pan-Africanism threaten to shatter the Federation's precarious unity asunder, whilst radical politicians and figures stand as icebergs, each threatening to sink its already haphazard institutions and economy. Now the Prime Minister, Shearer drives Kingston closer to Washington and Ottawa. In his mind, perhaps that will guide the ship of state to safety."

 JAM_William_Strachan: "William Strachan"
 POLITICS_JAM_WILLIAM_STRACHAN_DESC: "Billy Strachan is a new man of the era. A man like Lenin, Che, or Ho Chi Minh. Born in 1921 in a predominantly white area of Kingston, Strachan went to the prestigious Wolmer's Boys' High School. Being one of only a few black students, he was faced with racism during his schooling, while also witnessing mass riots surrounding the Great Depression, even seeing the formation of the People's National Party.\n\nDespite his future life as a revolutionary, and his childhood riddled with racism, Strachan joined the RAF upon the outbreak of war with Germany. During his career he survived crashes, shootings, bombings, and a mid-air collision. Having served Britain until its fall, he was evacuated West, back to Jamaica where he saw a system all too similar to Britain's colonialism.\n\nFrom there, he quickly became a prominent figure in the Anti-Canadian and Anti-Bustamante left. With his fellow leftist, Richard Hart, the two founded the People's Freedom Movement, abandoning the PNP which they believed to be too moderate. Unsurprisingly, Bustamante banned the organization and Strachan, now with a warrant out for his arrest, went into exile and aided the Cubans in their revolution. He then joined up with the Caribbean Legion, and created his own black only contingent, the Black Star Brigade.\n\nNow he has returned, like Napoleon from Elba or Lenin from the west. With a coalition of black nationalists, communists, and moderate socialists on the corpse of Bustamante, Billy must bring a new Jamaica to the world while the Americans reach for their holster. It will not be an easy path for the socialists, with Strachan already facing pressure from vanguardist and democratic wings of his coalition, but if there was one man to unite them, it would be Billy."

 JAM_Edward_Seaga: "Edward Seaga"
 POLITICS_JAM_EDWARD_SEAGA_DESC: "Edward Seaga, born in 1930 to a mixed Yankee household, is Jamaica's modern polymath—conniver, music producer, and, most importantly, heir to the JLP. Bustamante saw Seaga as an errand boy who micromanaged Kingston's neighborhoods, but Seaga's skill with patronage helped him build an empire through backroom deals and trades. In Tivoli Garden, he turned the impoverished community into his own fief. Then, through the same tireless effort, rinse and repeat, many a community fell before his heels.\n\nWith his skillful planning, amidst Jamaica's unrest, Seaga is the key to keeping the Labour Party on its feet with the common masses. Yet, he was merely the tool, not the product. Only months ago, no one considered him as a successor to Busta's mantle, but Seaga did not despair. He did not have to prove them wrong with fiery words—he knew his edge, then made it count. Just with a white-passing look, it goes a long way in making the party more palatable for foreigners and voters alike.\n\nSeaga's supporters know him by his face, and he knows them by their core values. Although trained at Harvard in Afro-Caribbean culture, he is a political reactionary, unusual among his peers but well-suited to Jamaica's climate. He claims puritanical values but never discriminates. The post-Busta JLP will need moderate conservatism to fit into an increasingly pragmatic world, and with the right strategies, making that popular may be as doable as bringing reggae to the mainstream."

 JAM_Richard_Hart: "Richard Hart"
 POLITICS_JAM_RICHARD_HART_DESC: "Richard Hart would enter into Jamaican politics in 1937, after pursuing education abroad in England. Alongside Norman Manley, Hart would become a founding member of the People's National Party, a broad party that acted as a more left-wing alternative to the JLP. Despite previously supporting Bustamante's independence activism, the iron grasp the man had acquired over the island once in power caused Hart to campaign against his rule. Richard Hart possessed openly Marxist views, and it became increasingly clear that in Bustamante's Jamaica that was no longer acceptable. Succumbing to external pressure, the PNP would expel Richard Hart and four others from the party in 1954. Instead, Richard Hart would find common cause with William "Billy" Strachan and together they founded the People's Freedom Movement. The party provided a more radical, Marxist direction than what the PNP could offer, and stood in active opposition to Bustamante's dictatorship. For this, the party would swiftly be banned, forcing the PFM's leadership to flee to Mexico. Despite this setback, Hart continued to agitate for Jamaican liberation throughout his exile.\n\nThe failure of the West Indies Federation provided a key opportunity for the People's Freedom Movement to return to Jamaica, and soon the island had embraced revolution. When Strachan stepped down to facilitate a transition towards democracy, and handed the reins to Hart to carry the PFM's vision for Jamaica onwards. If Jamaica is to thrive beneath the gaze of the Americans, then Hart and his party must hold strong before the coming trials."

 #Leeward Islands
 SKN_Kenneth_Blackburne: "Kenneth Blackburne"
 POLITICS_SKN_KENNETH_BLACKBURNE_DESC: "The death rattle of the British Empire continues to groan within the Leeward Islands. The son of an Anglican clergyman born in Hampshire in 1907, Blackburne only entered the Colonial Office in 1930, but was quickly cycled across the Empire, being moved to Nigeria, Palestine and the Gambia before being appointed to the colonial information services in Jamaica in the 1940s, tying the island to the fading pillars of an empire being torn apart by Operation Sea Lion.\n\nRemaining in Jamaica after the Second World War, Blackburne was a major player in the transition from stewardship under an exiled British government to Canada, and became an influential figure within Jamaican politics before being elevated to the West Indies Commission. From there, slowly sidelined by affairs within the Caribbean, he continued to cycle throughout posts in the region, before finally being assigned as the Governor-General of the Leeward Islands.\n\nKenneth Blackburne is the last face of a dying breed. With the colonial offices of the Caribbean increasingly staffed by American interlocutors and overstretched Canadian diplomats, Blackburne is perhaps the last sign of an order that emanated from London, rather than Washington or Ottawa. Such signs, however, continue to permeate his demeanour and outlook, and have left the Leeward Islands continuing to stagnate, haphazardly implementing the reforms pushed by his own West Indies Commission."

 #Saint Kitts
 SKN_William_Herbert: "William Herbert"
 POLITICS_SKN_WILLIAM_HERBERT_DESC: "There's no such thing as too young in politics, and Dr. William "Billy" Herbert has proven it. His background as a legal scholar gave an inexperienced Herbert the unique opportunity to participate in the drafting of the Antillean constitution. Reflecting his strong federalist convictions, his contributions helped create the decentralized structure that today rules in St. Kitts, Nevis, and Anguilla, the latter two being the principal benefactors of outsized autonomy. His belief in a decentralized federal polity has put him in the crosshairs with Robert Bradshaw, but Herbert is still seen as a preferred compromise candidate, with his slow, measured policies and constitutionalist brand."
 SKN_Robert_Llewellyn_Bradshaw: "Robert Llewellyn Bradshaw"
 POLITICS_SKN_ROBERT_LLEWELLYN_BRADSHAW_DESC: "Robert Llewellyn Bradshaw believes that unity is in the strength of the people. He has seen this truth time and time again, from the struggle of the sugar plantation workers after the war to the tortured birth of independence from the colonial womb. It took the people working together to move the wheel of West Indian history.\n\nYet for the first time in his career as a politician and labor organizer, Bradshaw fears for the unity of his country. The secession of Anguilla shook the foundations of what he considered the greatest achievement of his life. As Chief Minister, he has vowed to weld the people of St. Kitts and Nevis into a single nation, carrying out sweeping centralizing reforms. These changes have run afoul of a fledgling nationalist movement in Nevis, inspired to follow the path of Anguilla. To Chief Minister Bradshaw, this is yet another imperialist scheme: divide and conquer's what it's called."
 SKN_Frederick_Albert_Phillips: "Frederick Albert Phillips"
 POLITICS_SKN_FREDERICK_ALBERT_PHILLIPS_DESC: "Born in 1918 into a rural family on Saint Vincent, Frederick Albert Phillips nonetheless made a name for himself in the academic world, attending a grammar school before becoming trained as a lawyer in civil and constitutional law. Working for a number of causes across St. Vincent, he made a name for himself, eventually drawing attention from Canadian administrators looking for new appointments on their work.\n\n Nominated into the West Indies Commission, he was quickly elevated as a senior figure within the West Indies Federation, but his star did not totally fade with its collapse. First becoming Registrar for the University of the West Indies, he was appointed as Administrator for the Leeward Islands in 1966. Largely an titular role whilst the constitutional settlement of the region was worked out, he was retained and empowered as Governor upon the region's unification.\n\nPhillips holds onto his position only because of what he lacks. The Leeward Federation remains dominated by the conservative strongmen of Vere Bird and William Herbert, each vying for influence across each other, and across West Indian society. In this, Phillips acts as a broadly popular mediator, convening this exchange. However, as time goes on, pressure is growing for either to come to power. Whether Phillips will be able to maintain control on this, or if it'll spiral out of his hands and see the Leeward Federation meet the fate of its predecessor, is something even he can't yet rule on."

 #Anguilla
 AGL_Ronald_Webster: "Ronald Webster"
 POLITICS_AGL_RONALD_WEBSTER_DESC: "Coming from a humble dairy fortune, Ronald Webster is a native of Anguilla raised on Saint Martin. For the better part of three decades, Webster had been isolated from his homeland, tending to his meager estate, which he had inherited from his foster parents. When he finally returned to Anguilla in 1960, he found a derelict place he could barely recognize, an undeveloped parcel of land battered by the Leeward Islands' abuses and corruption.\n\nLoyal to the Crown as much as any other true Englishman may be, the reluctant Webster, who had made himself a middling bureaucrat after some while, took the initiative of leading a revolution against Leeward's rule, one which had brought little but misery to his countrymen. As his revolution eventually took a surprisingly bloodless turn, Webster became a popular figure as the freed state's first Chief Minister for his efforts in preserving Anguillan autonomy, even if it was achieved through a secession that isolated the island from the rest of the West Indies.\n\nDespite his present dominance in Anguillan politics, Webster has little reason to play the tinpot dictator on such an inconsequential stage. He looks to his neighbours and sees only neglect from the Americans and Canadians. Now calling for the reforms which his people have long yearned for. Webster will stop at nothing to make that happen."

 #Windward Islands
 SVI_Hector_Allard: "Hector Allard"

 #Saint Vincent
 SVI_Robert_Milton_Cato: "Robert Milton Cato"
 SVI_Ebenezer_Joshua: "Ebenezer Joshua"
 POLITICS_SVI_EBENEZER_JOSHUA_DESC: "The Windward Islands have hardly seen a fighter like Ebenezer Joshua. Born in Saint Lucia, his first taste of politics would be the preaching of old Buzz Butler in Trinidad, then the epicenter of a radical labor movement, which Joshua would come to dedicate his life to. As a militant in the Oilfield Workers' Trade Union during the war years, he learned the lessons that turned him into a leader of Saint Lucia's radicals after his return in 1950.\n\nThey wrested unionization and political rights from the colonial administration's white hands and, with his wife, Ivy, a wry politician and agitator of her own accord, forged the Eighth Army of Liberation to bring change to the island. They also led strike action by the Federated Industrial Allied Workers Union, uniting agricultural and shipyard workers against the colonial yoke.\n\nToday, Joshua and his wife, Ivy, a wry politician of her own, watch with concern the rise of a reactionary plantocracy in Saint Lucia, backed by foreign imperialists. If his increasingly frequent conversations with firebrand Eric Williams about a political union with Trinidad indicate anything, Ebenezer Joshua might return to his days of political action across the islands, for he sees only one way to guard the independence of his home and the gains of the working classes: Caribbean unification."

 #Barbados
 BRB_Errol_Barrow: "Errol Barrow"
 BRB_Hugh_Springer: "Hugh Springer"
 POLITICS_BRB_HUGH_SPRINGER_DESC: "Born in Saint Michael in 1913, Springer's eyes have always extended beyond his island. Receiving a scholarship to study at Oxford, he prepared to become a tutor in Greek, but racism and the Second World War ensured his return to Barbados. Once back, he would be called to the bar in 1938, working as a lawyer just before forming the Progressive League alongside Grantley Adams, himself soon to become an electoral titan.\n\nFocusing his attention on the Barbados Worker's Union that formed out of the Progressive League, he channeled nationalism into a role in government as the Barbados Labour Party formed a government in 1946. Although he resigned to help administer a university until 1962, he remained a key figure, both in his alliance to the juggernaut that has defined Bajan politics and in the ill-fated West Indies Federation. With its collapse, he commiserated before refocusing his attention inwards just as Adams finally tired of his tenure.\n\nNow, Springer stands alone. Springer sees the value in maintaining Barbados as a strong, liberal, chauvinistic American ally in the region, but this is not the limit to his ambition. Some critics see him merely as a seatwarmer, as a slightly younger face to hold office until Grantley's son is old enough to run, but Springer rejects that. Through his pushes for greater Caribbean cooperation, he hopes to see Bridgetown as not a channel, but the harbour to which the stray ships of the Caribbean will come home."
 BRB_Grantley_Hebert_Adams: "Grantley Herbert Adams"
 BRB_Tom_Adams: "Tom Adams"
 POLITICS_BRB_TOM_ADAMS_DESC: "One would be excused to consider Prime Minister Tom Adams as merely climbing out of the shadow of his father. Indeed, much of his own upbringing was spent as his sire's political protégé, molded from teenagehood to succeed his role as Barbados's foremost liberal firebrand.\n\nBarred from the same Oxford education that had been granted to his old man by the unfortunate outcome of the Second World War, a young Tom Adams would be educated right here in Barbados, in the much more modest Harrison College, which wouldn't prevent him from acquiring a robust philosophical and historical academic training.\n\nFrom there, he would then go on to pursue a career as a lawyer in the United States, with the years filling him with a growing fascination for the country's institutions, and most of all an eagerness to bring these values back home with him.\n\nIn spite of the failure of the West Indies Constitutional Congress, the newly elected Prime Minister remains nonetheless committed to the archipelago's harmonious cooperation, all the while steering it ever closer to America's looming shade.\n\nFor his supporters, a sprinkle of tactful progress and careful reform in a generally very conservative political battlefield. For his decriers, his voice will unfortunately only ever echo the will of Uncle Sam."
 POLITICS_WIN_TOM_ADAMS_DESC: "One would be excused to consider Prime Minister Tom Adams as merely climbing out of the shadow of his father. Indeed, much of his own upbringing was spent as his sire's political protégé, molded from teenagehood to succeed his role as Barbados's foremost liberal firebrand. With the establishment of the West Indies Federation, the burgeoning scion would find himself with a consequently larger pair of shoes that he may feel perhaps too enthusiastic to prove he's ready to fill.\n\nA successful lawyer grown enamored with the United States that had hosted his entire career, he would return with his heart filled with promises of a prosperous future for his home, if it only just threaded in the path of its westward hegemon. Now struggling to affirm himself as his own man in the gargantuan void left by his senior, Tom Adams nonetheless finds allies in those supporting his platform of economic laissez-faire, sweeping privatization programs, measured social reforms and continued alignment to the American sphere.\n\nAnd above all, in a firm resolve to see his father's legacy endure in the face of crippling instability, lingering harm from the Oil Crisis, as well as all manners of communists and other radical demagogues threatening to tear it all apart."

