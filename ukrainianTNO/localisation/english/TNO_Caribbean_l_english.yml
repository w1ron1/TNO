 ###LEADER DESCRIPTIONS###
 POLITICS_GRANTLEY_ADAMS_WIF2_DESC: "І союзники, і противники були шоковані, почувши, що прем'єр-міністр Ґрантлі Герберт Адамс відкинув США. Після катастрофічного виходу Ямайки та Тринідаду і Тобаго, разом двох найбагатших членів Федерації, США, без сумніву, припускали, що Адамс, їхній давній партнер на островах, покірно прийме їхню пропозицію про більшу підтримку — і всі прив'язані до неї умови. Але з якої б причини це не сталося — чи то втома від американського домінування, чи, можливо, просто звичайний оптимізм — Ґрантлі ввічливо відмовив американцям. Звісно, це не змінило вже наявних відносин між США та Вест-Індією, але це розглядається як ознака майбутньої більшої незалежності карибських островів.\n\nІ все ж, попри всю надію, яку такий крок може породити серед регіональних націоналістів, наслідки такої відмови можуть ще боляче вдарити по Адамсу та його народові. «Мала десятка» є, зрештою, саме такою: малою. Після втрати двох найбільших економік вони можуть лише намагатися втриматися на плаву у нестабільній світовій економіці. Далекоглядність чи зарозумілість, принциповість чи безрозсудність? Тепер історія має виправдати або засудити Ґрантлі."
 POLITICS_GRANTLEY_ADAMS_WIF3_DESC: "Рішення Ґрантлі Герберта Адамса прив'язати те, що залишилося від Федерації Вест-Індії, до Сполучених Штатів було безпечним і правильним вибором. Для багатьох воно також стало підтвердженням усього, що його політичні противники коли-небудь про нього казали. Угода, яку він прийняв, гарантувала економічне виживання Федерації після втечі спочатку Ямайки, а потім Тринідаду і Тобаго, але ціною передачі островів майже під пряме управління Вашингтона. Кожен крок, який бажає зробити уряд Ґрантлі, має бути схвалений дядечком Семом, кожен бюджет повинен пройти через Конгрес США, а навіть скромні сили оборони Федерації тепер перебувають під юрисдикцією Південного командування США. Суверенітет Вест-Індії, який і без того був джерелом розчарування для прихильників незалежності, фактично розірвано на шматки, залишивши від нього лише номінальне існування, наче насмішку.\n\nІ все ж Адамс міркує, що ціну довелося заплатити. Втрата автономії дратує, але це справді був єдиний спосіб забезпечити подальше існування Федерації як єдиного утворення. Принаймні, він на це сподівається."
 POLITICS_ERIC_WILLIAMS_WIF_DESC: "Державний службовець, науковець, Батько Союзу: Ерік Вільямс, прем'єр-міністр Карибського Союзу, безумовно, вже чимало досягнув у своєму житті. Народжений у 1911 році в заможній родині французько-креольського походження, спочатку він, здавалося, йшов шляхом науковця, а не політика. Обдарований академік, Вільямс отримав стипендію для навчання в Оксфордському університеті в Англії. У 1935 році він здобув ступінь бакалавра з історії, а в 1938 році завершив докторську дисертацію. Його праця «Економічні аспекти скасування работоргівлі та рабства у Вест-Індії» відтоді стала знаковим текстом в історіографії Британської імперії та рабства, що практикувалося під її владою.\n\nЖиття Еріка Вільямса кардинально змінилося після завершення Другої світової війни та розпаду Сполученого Королівства. На час створення Федерації Вест-Індії як способу управління карибськими територіями переможених британців, голландців і французів Вільямс уже став провідною фігурою в політиці Тринідаду і Тобаго, виступаючи за правління більшості корінних народів островів у межах Федерації.\n\nПісля успіху його задуму реформувати Федерацію в єдиний унітарний Карибський Союз Вільямс став першим прем'єр-міністром держави. Блискучому науковцеві, безумовно, буде чим зайнятися, поки він працюватиме над пом'якшенням труднощів, яких спричинить це повне політичне та економічне злиття."
 POLITICS_NORMAN_MANLEY_WIF_DESC: "Якщо Ямайка була клеєм, що утримував Федерацію Вест-Індії разом, то буде справедливо сказати, що Норман Менлі — людина, найбільш відповідальна за подальше існування Вест-Індії як єдиного політичного утворення. Попри те, що хотіли б забути його критики, історія боротьби Менлі за народ Ямайки — його народ — є довгою. Під час Великої депресії Менлі допоміг заснувати Народну національну партію та працював пліч-о-пліч зі своїм двоюрідним братом Александром Бастаманте та його Індустріальною профспілкою.\n\n1940-ві стали десятиліттям великих змін для Менлі та Ямайки. Спочатку відбувся розкол між ННП і ЯЛП Бастаманте у 1943 році, потім у 1944 році було схвалено загальне виборче право, а в другій половині десятиліття настав момент, який безповоротно змінив долю Ямайки та сусідніх островів. Після завершення Другої світової війни Ямайка вперше за понад два століття залишилася без метрополії. Тепер номінально незалежна Ямайка, Менлі переміг на виборах і став її першим в історії прем'єр-міністром. Однак невдовзі Сполучені Штати звернулися до нього зі своїм планом створення Федерації Вест-Індії, яка мала об'єднати всі колишні колоніальні острівні володіння регіону. Як прем'єр-міністр найбільшої економіки Федерації, Менлі відігравав помітну роль, хоча часто конфліктував зі своїм доброзичливим суперником Бастаманте.\n\nПровал запропонованого референдуму про незалежність лише підніс Нормана Менлі на нові висоти. Після поразки референдуму Менлі побачив підтвердження свого мандата, що дозволило йому домогтися переписування Конституції Федерації задля створення об'єднаної Співдружності Вест-Індії. Хоча багато хто висміював його як не більше ніж вашингтонського посіпаку, Менлі впевнений, що в наступні роки позитивні результати його рішень говоритимуть самі за себе."
 #Jamaica
 POLITICS_ALEXANDER_BUSTAMANTE_DESC: "Чи не найкраще, що Ямайка може запропонувати у своєму відносно короткому списку компетентних політиків, чи просто викопний залишок — залежно від того, з якої частини міста дивитися, — Александр Бастаманте все ж залишається одним із невтомних робочих коней, які роками підтримували статус-кво Ямайки на плаву. Для одних він уособлює все, що не так із системою Оттави, але для багатьох інших Баста символізує стабільність, навіть якщо сам він далеко не найкраща людина навколо.\n\nНароджений у родині гановерських плантаторів у 1884 році, Баста попри привілейоване виховання ніколи особливо не прагнув комфортного життя, провівши більшу частину своєї молодості до 1930-х років у мандрах Карибами та виконуючи різноманітну випадкову роботу — від продавця до жандарма на Кубі. Хоча правдивість його трудових байок, так само як і його походження, залишається сумнівною, додому він повернувся талановитим перемовником, перетворившись із чергової висхідної зірки Ямайської лейбористської партії на сонце, навколо якого впродовж останніх десятиліть обертається політика країни.\n\nНині він тримається при владі передусім завдяки своїй самоназваній «Індустріальній профспілці Бастаманте», і вважає себе радше прагматиком, ніж англофілом, надаючи рівно стільки поступок, скільки потрібно, аби залишатися корисним. З іншого боку, Баста також став противагою ННП Нормана Менлі, до якої протягом десятиліть відчував справжню образу, що часом навіть призводила до нападів ірраціональної люті. У міру того як він старіє та стає дратівливішим, у нього, можливо, є не одна причина дозволити ЯЛП процвітати самостійно — але що таке художник без своїх картин?"
 POLITICS_JAM_ALEXANDER_BUSTAMANTE_AUTHDEM_DESC: "Незалежно від думки про самого чоловіка, не можна заперечувати, що Александра Бастаманте пам'ятатимуть як одну з визначальних постатей ямайської історії. Народжений як Вільям Александер Кларк у 1884 році, цей ямайський політик від Лейбористської партії є двоюрідним братом колишнього прем'єр-міністра Нормана Менлі. Бастаманте вперше почав здобувати популярність як відвертий противник британського колоніального правління на Ямайці у 1930-х роках. Його діяльність на підтримку незалежності призвела до ув'язнення у 1940 році, де він пробув три роки.\n\nУ роки після поразки Британії у війні та створення Федерації Вест-Індії Бастаманте не припинив боротьби за вільну та незалежну Ямайку. Змінилася лише ціль: якщо раніше він виступав проти Британії, то тепер мусив протистояти Федерації та її американському господареві.\n\nАлександр Бастаманте завжди хотів незалежності для Ямайки, але ніколи не уявляв, що вона прийде саме так, як тепер. Він природно підтримав протести «Чорної сили», що спалахнули проти його давнього суперника Нормана Менлі. Однак у міру посилення насильства під час цих протестів Бастаманте виявився нездатним контролювати рух, речником якого він формально був. Лише згода Менлі піти у відставку на користь Бастаманте та протестувальників заспокоїла найгірший хаос. Тепер, ставши лідером незалежної Ямайки, не пов'язаної з США та їхньою ОВН, Бастаманте, здається, здійснив свою давню мрію. І все ж усім спостерігачам, не в останню чергу самому Бастаманте, надто очевидно, що хвороби, які мучать Ямайку, були лише приглушені, а не вилікувані."

#Віндвардські острови
POLITICS_SVI_HECTOR_ALLARD_DESC: "Народившись у 1902 році в Канаді, Гектор Аллар провів значну частину своєї молодості в університетах франкомовного світу, навчаючись у Страсбурзі та Женеві. Після короткого повернення до Канади, де він викладав французьку мову, у 1932 році він став членом дипломатичного корпусу, працюючи в канадських посольствах, а потім на низці посад по всьому Карибському басейну, перш ніж зрештою бути призначеним на посаду генерал-губернатора Віндвардських островів.\n\nУ багатьох відношеннях сходження Аллара до влади не було легким. Його дипломатичний досвід нелегко перенісся на управління Віндвардськими островами, і йому вдалося лише частково заспокоїти побоювання тих, хто був пов'язаний зі складною мережею регіональної політики. Його франкоканадське походження також викликало роздратування в Колоніальному відомстві й зробило його більш відчуженим від колоніальної бюрократії, ніж більшість його попередників.\n\nОднак такі обмеження не змогли повністю перешкодити йому проводити реформи. Після впровадження регіональних аграрних реформ, зосереджених на вирощуванні та експорті бананів, цей сектор значно зріс відтоді, як він обійняв посаду. Однак старі внутрішні проблеми й надалі залишаються складними в інших сферах і сповільнили впровадження показників, встановлених Комісією Вест-Індії, через що острови відстають у соціальних та політичних реформах."

#Барбадос
POLITICS_BRB_HEBERT_GRANTLEY_ADAMS_DESC: "Перед Барбадосом постає новий світанок, але те саме сонце сходить над ним. Народжений в останні роки дев'ятнадцятого століття та прийшовши в політику як побожний ліберал, що навчався в Оксфорді, Ґрантлі Адамс десятиліттями перебуває в авангарді барбадоської політики. Хоча після повернення в 1930-х роках він спочатку був пов'язаний із консервативними групами на Барбадосі, його симпатії змістилися вліво, привівши його до керівництва Барбадоською робітничою спілкою у 1941 році та до ключової ролі в придушенні впливу плантаторів.\n\nВідтоді Адамс залишається помітною силою в карибській політиці. Окрім ролі голови БРС, Адамс чітко демонструє свою опозицію комунізму та залишається палким прихильником посилення ролі британської монархії. Зрештою призначений прем'єром Барбадосу в 1954 році, Адамс своєю роботою задля розширення самовизначення зумів послабити вплив Комісії Вест-Індії.\n\nСьогодні подальша присутність Адамса є оксюмороном. Людина, чия спадщина колись була обмежена минулими десятиліттями, продовжує відстоювати свої мрії про майбутнє, яке залишається просякнутим традиціями світу, що приніс йому національну популярність. Маючи й досі мрії про єдиний, процвітаючий і ліберальний Карибський басейн, здається, що цей державний діяч похилого віку ще не збирається відійти в тінь."

#Тринідад
POLITICS_TRI_ERIC_WILLIAMS_DESC: "Політики, які не бажають іти на компроміси, часто не здатні довго втриматися, але ті, хто не може йти на компроміси, можуть виявитися напрочуд стійкими, і немає кращого доказу цього твердження, ніж непохитний прем'єр Тринідаду і Тобаго Ерік Вільямс.\n\nУ молодості Вільямс мріяв стати професійним футболістом, залишивши цю мрію лише після травми, яка частково позбавила його слуху. Проте свою вперту рішучість він проніс через усю подальшу кар'єру, ставши видатним ученим у галузі дослідження колоніальної історії завдяки фундаментальній праці "Капіталізм і рабство". Він навіть привернув увагу Комісії Вест-Індії, яка, прагнучи залучити більше голосів місцевого населення до своїх амбітних планів розвитку, запропонувала йому місце. Незабаром вони пошкодували про це рішення, оскільки Вільямс виявився впертим націоналістом, який часто вступав у суперечки з владними янкі та виснаженими британськими аристократами в Комісії.\n\nПісля того як він розчаровано залишив Раду, Вільямс працював над створенням змін знизу, заснувавши Народний національний рух на Тринідаді. Здобувши посаду прем'єра після того, як Оттава була змушена послабити поводи над Карибським басейном, Вільямс править Тринідадом твердою рукою, маючи чітку мету модернізувати батьківщину, яку він так обожнює. Використовуючи політичну машину, зосереджену навколо ННР, йому вдалося використати нафтові багатства островів для фінансування амбітних проєктів розвитку та встановити цупку хватку над острівною політикою."
POLITICS_TRI_MAKANDAL_DAAGA_DESC: "Макандал Дааґа, засновник Національного об'єднаного комітету дій, ніколи не очікував, що саме йому доведеться взяти на себе керівництво Тринідадом і Тобаго після революції. Правду кажучи, рух Чорної сили, який він допомагав очолювати, ані не планував, ані не спричинив падіння уряду Вільямса — і все ж воно відбулося. Несподіваний заколот незадоволених елементів Тринідадського оборонного полку, які симпатизували протестувальникам, і тиск загального страйку, що тривав, переросли в катастрофу, яка змусила Вільямса піти у відставку.\n\nПопри відсутність чіткого плану дій після такої несподіваної перемоги, Дааґа не дозволив собі бути паралізованим нерішучістю. За допомогою Полку він проголосив себе тимчасовим президентом, прагнучи створити новий уряд, який міг би принести бодай трохи спокою багатостраждальним островам, поки наслідки Революції продовжувалися. Дааґа зробив свою ставку, скориставшись моментом у надії створити краще майбутнє для афро- та індо-тринідадців. На нього чекає чимало роботи."
POLITICS_TRI_BHADASE_SAGAN_MARAJ_DESC: "Колос упав із гуркотом, але Бгадейс Саґан Марадж не перехитрив свого суперника — він просто пережив його. Народившись 29 лютого 1920 року в родині брахманів у центральній частині Тринідаду, Саґан Марадж мав бурхливу юність. У тринадцять років його батька вбила мусульманська банда. Щоб віддалити його від насильства, його віддали до церковних шкіл і більшу частину підліткових років він провів під опікою бабусі.\n\nСповнений рішучості вижити, до двадцяти років він став борцем, паралельно заробляючи на життя копанням канав. Під час Другої світової війни він розбагатів на контрактах у Чагуарамасі. Завдяки статкам, отриманим на військових роботах, до тридцяти років він став мільйонером. До того часу він усвідомив потребу піклуватися про добробут своїх індуїстських побратимів, які тривалий час залишалися неписьменною нижчою верствою. Так він заснував Санатан Дгарма Маха Сабгу, місце для навчання та піднесення.\n\nВбачаючи в парламентській політиці ще один інструмент визволення, у 1953 році він заснував Індуїстську народну демократичну партію. Через чотири роки партія приєдналася до Демократичної лейбористської партії, де стала провідною силою. Попри свою невтомну діяльність і боротьбу, Саґан Марадж є хворобливим чоловіком. Він пережив численні напади хвороб, виглядаючи майже немічним у порівнянні зі своїм політичним ворогом Еріком Вільямсом. Та багаття його справи пережило пожежу його суперника, і тепер його черга в Порт-оф-Спейні."

