 JAM_flavor.36.t: "Jamaican Provocateur Plays in Harlem"
 JAM_flavor.36.desc: "America continues to play a light hand against communists from the West Indies\n\nAdam McCray, Cultural Correspondent, National Review\n\nNo matter what this government claims, it is clear that [USA.GetLeader] doesn't truly care about combatting extremism. Nothing about this is clearer than them allowing for Bob Marley to play songs over here. In the West Indies, Bob Marley has already become a household name, as has his band. Playing a new genre of music called "reggae," a style of music notable for having a far slower tempo, and for its heavy reliance on drums and bass guitars for its melody.\n\nBob Marley first became active in 1963, and has published a number of albums with his band, The Wailers, but it was his own work that played over the bar in Harlem today, with his singles reaching record numbers. In 1966, he converted from Catholicism to Rastafarianism, a fringe cult that believes the former King of Ethiopia is the second coming, and that God exists in everyone.\n\nAny biography has to consider his fringe views. A devout communist, he is a vocal supporter of groups such as the African National Congress and has staunchly condemned South Africa's struggle against their extremism. He has also attacked the United States as being "as imperialist as Germany and Japan," and also openly smokes pot for "meditation."\n\nMen such as this are adored by hippies and pot-smokers nationally, and he has become a figurehead for these bums, but he does admittedly have some musical talent. If you still want to listen to this new wave riling up hippies across the nation, Bob Marley will be playing again at Harlem on Tuesday, and will play in bars in Chicago, Boston, Los Angeles, and Montreal over the next two weeks."
 JAM_flavor.36.a: "Just take care to step over any vagrants high on his work."

 JAM_flavor.37.t: ""
 JAM_flavor.37.desc: ""
 JAM_flavor.37.a: ""

 JAM_flavor.38.t: "A Double-Edged Sword"
 JAM_flavor.38.desc: "Compared to the streets of Kingston, the American embassy was remarkably refined. A shame, Michael Manley thought, that such development didn't extend much further. He knew that talks with the American ambassador on debt relief and on economic aid would come with implicit demands, but hoped that he could at least swing them into patience. He received no such welcome.\n\n"We have a lot of money, Michael," replied the ambassador, interrupting an outreached hand, "but we won't just plug the holes of an economic basketcase."\n\nMichael Manley knew what was going to come, but pushed aside his concerns. "Give us a few years, and I know we'll exceed your expectations."\n\n"I hope your optimism is well placed." The ambassador threw up a V sign. "We won't negotiate on either of these. We want full democratization, and we expect you to change track on your hostility to American business."\nHalting for a second, Michael Manley tried to work the issue. "I arrested those responsible for the worst excesses, and I guarantee that nex-"\n\n"I'm not stupid, Mike." Raising a finger, he muted the discussion. "You can flatter me all you like, but American businesses have been rankling at the way you've been nationalizing your country's economy." With a flick of his hand, he drew out a cigar. "Reverse your recent nationalizations, or else you'll have to command your plantations penniless."\n\nMichael Manley shook his head as he considered a path forward. Surrendering Jamaica's sovereignty over its economy was disastrous, but the ambassador had a point. Jamaica needed the aid too desperately. And so, squirming in his chair painted red, he surrendered his time to preserve ambition."
 JAM_flavor.38.a: "The King issues a proclamation from his Castle."

