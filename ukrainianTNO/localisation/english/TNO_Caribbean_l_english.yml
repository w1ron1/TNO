 JAM_flavor.25.t: "Чому?"
 JAM_flavor.25.desc: "«Чому я взагалі поперся на цей клятий острів?» Авґустін ставив собі це питання весь останній тиждень. Зараз він трясся всередині броньованого автобуса, який повільно протискувався крізь нескінченний людський натовп із натужним ревом. Каміння, шматки арматури та інше сміття барабанили по броні, наче град. Поруч із ним, стискаючи штурмові гвинтівки побілілими пальцями, сиділи двоє озброєних охоронців — новобранці, молодші за нього. За вікнами вирувало море: тисячі звільнених шахтарів та їхні озлоблені, голодні сім'ї заблокували вулиці Кінґстона. Поліції ніде не було видно — разом з економічним крахом настав повний розпад ямайської держави.\n\nЧому звідти немає жодних новин? Авґустін отримав останнього листа з дому рівно два тижні тому, а потім усі комунікації обірвалися. На батьківщині комуністи, фалангісти, республіканці, монархісти — здавалося, весь політичний спектр змішався в первісному супі Іберійських воєн. Коли Мадрид і Лісабон охопило полум'я, державні корпорації перекрили кисень. Сто сімдесят п'ять. Сто сімдесят п'ять шахт на острові зупинилися за одну ніч, викинувши на вулиці десятки тисяч знедолених робітників.\n\nЧому вони так на нас дивляться? Для чорних ямайців ті кілька іберійців, що ще залишалися на острові, за одну ніч стали зрадниками та втіленням чистого зла, бо вони, на відміну від місцевих, якимось чином усе ще мали роботу. Спотворені злобою обличчя за куленепробивним склом не знали найважливішого: ця робота триватиме щонайбільше місяць. Інвестори в паніці позбувалися своїх активів, і остання корпорація також була готова втекти із тонучого острова. Під приглушений стукіт каміння об автобус Авґустін міг лише молитися, щоб компанія, евакуюючи свій капітал, не залишила його на цьому проклятому острові.»"
 JAM_flavor.25.a: "«Чому саме він?»"

 JAM_flavor.26.t: "Бустаманте розбитий"
 JAM_flavor.26.desc: "Звіт розвідки FBI: прохання Бустаманте\n\nПісля розпаду Іберійського Союзу та подальшого економічного краху півострова центральний банк Ямайки оголосив про банкрутство. Призупинення багатьох національних програм та інших проєктів, що фінансувалися урядом, через припинення інвестицій іберійських корпорацій передувало сплеску безробіття, а в інших випадках — злочинності. Кабінет Ямайської лейбористської партії Александера Бустаманте просить американської фінансової допомоги, не маючи інших варіантів.\n\nТому Бустаманте попросив про зустріч з американськими послами, щоб повідомити про поточну кризу на Ямайці як про гуманітарну проблему, посилаючись на залежність країни від іноземного фінансування та його нинішню відсутність, що, на його думку, відповідає інтересам Сполучених Штатів у відновленні відносин з острівною державою. Він пропонує надати ту саму концесію, яку було надано підприємствам Іберійського Союзу, якщо уряд Сполучених Штатів гарантує відновлення підтримки уряду під керівництвом ЯЛП. Однак він відкинув будь-які пропозиції щодо зміни режиму чи внутрішніх реформ.\n\nЗ огляду на нинішню непопулярність ЯЛП усередині країни та небажання Бустаманте дослухатися до американських порад, на Ямайку, ймовірно, чекає значна політична нестабільність та депресія, якщо Бустаманте залишиться главою держави. Очікується, що найближчим часом країна матиме високий ризик суспільного колапсу."
 JAM_flavor.26.a: "Упертий, як завжди, жодної краплі смирення в роті."
 JAM_flavor_26_tt: "Через розпад §nІбер§!§Oійського§! §fСоюзу§! §dБустаманте§! приповз назад до нас!\n...Але ми не забули про його непокору, і §Rзраднику§! завжди віддається належне."

 JAM_flavor.27.t: "Червоне небо вранці"
 JAM_flavor.27.desc: "«Ми, зі свого боку, вражені Біллі Страченом. Мало хто продемонстрував таку непохитну здатність чинити опір фашизму, і мало хто виявив таку сильну відданість ідеалам деколонізації та панафриканізму, як Страчен. Вашинґтон зіткнеться з набагато більшими труднощами, ніж може очікувати...» — The Black Panther, редакційна стаття, [GetDateText]...\n\n«...і я цілковито засуджую переворот Біллі Страчена на Ямайці. Большевізм зазнав поразки в Росії, зазнав поразки в Китаї, і тепер йому судилося зазнати поразки на Ямайці. Коли радикали на кшталт Руху «Чорної пантери» заявляють, що хочуть рівності, усе, чого вони хочуть, — це рівність у тому, щоб затягувати вашу петлю. Большевицька течія рівності не задовольниться одним островом...» — заяви Річарда Рассела-молодшого, 14:00 [GetDateText]...\n\n«Сполучені Штати опинилися в глухому куті. Природним імпульсом було б оголосити осуд, але будь-які подальші публічні дії надмірно розтягнули б американські дипломатичні зусилля. Куба та Мексика вже достатньо віддалилися від американської сфери, а Кастро особливо відзначив, що схвалює ямайських революціонерів. Тому американські зусилля проти Страчена змістилися в бік шпигунства». — Potemkin in Portmore: The United States and the Caribbean Left, 1959-72...\n\n«Акт про засудження ямайського екстремізму, який запровадить санкції проти низки ямайських товарів і міститиме пряме засудження нового уряду, пройшов через Палату представників із перевагою 432-0 і, як очікується, сьогодні одностайно пройде через Сенат. Однак правозахисні організації розкритикували його як неприпустиме порушення суверенітету Ямайки...» — телетрансляція ABC, [GetDateText], 15:00"
 JAM_flavor.27.a: "Революція за кордоном, конвульсія всередині."

 JAM_flavor.28.t: "Лише дивом"
 JAM_flavor.28.desc: "Трохи нахилившись, Луїс Ґонсалес-Мата щосили намагався сховатися від камер журналістів, чиї вигуки не могли пробитися крізь стіну іберійських сил безпеки, що метушилися навколо нього. Над ними нетерпляче гули лопаті гелікоптера, заглушаючи запитання, які йому ставили. Коли він увійшов до машини, то прослизнув із поля зору, сховавшись за дверима, і не міг змусити себе сісти. Не те щоб журналісти залишалися там надовго, подумав він. Щойно большевики досягнуть свого, вони заберуться. Або ж інакше.\n\nТе, що Ямайська революція взагалі відбулася, було його першою помилкою. Він місяцями стежив за зростанням радикалізації ямайського населення, але ніколи не очікував, що вона зайде настільки далеко й розвиватиметься так швидко. До того часу, коли вуличні протести переросли в революцію, він лише починав виходити на зв'язок із тими членами його шпигунської мережі, яких ще не вбили. У цьому був винен Бустаманте. Він ніколи не був надійним союзником, думав Ґонсалес-Мата, і завжди любив удавати, що контролює більше, ніж насправді.\n\nЗвісно, його безпосереднім пріоритетом була втеча. Його гелікоптер мав приземлитися за кілька кілометрів від Манагуа, але зворотну подорож уже не можна було зафрахтувати вчасно. Звісно, він уже підготував особистість: наступного дня він стане Міґелем Ортего-Іґлесіасом, підприємцем і власником автомобільного заводу у Вальядоліді, який прибув до Манагуа обговорити можливість використання натурального каучуку, а тепер планує повернутися через Мадрид. Але що з ним станеться після повернення?\n\nІберія без попередження втратила важливого союзника в Карибах, разом із великою кількістю хороших агентів. Він знав, що їм знадобиться якийсь цап-відбувайло, і він ідеально підходив для чистки. Він не знав, чи варто очікувати пониження до іншої філії іберійської шпигунської мережі в Америці, чи готуватися до неминучого усунення. Коли гелікоптер злетів, він нарешті згорнувся, міцно обхопивши голову руками.\n"
 JAM_flavor.28.a: "І поки революція забирала розум ще однієї людини."

 JAM_flavor.29.t: "Усмішки й те, що за ними"
 JAM_flavor.29.desc: "На вулицях Квінсі пахло смаженим м'ясом, а в повітрі майоріли зелені та чорні трикутники, обрамлені золотими смугами. Ямайська емігрантська громада відзначала створення нової республіки імпровізованими вуличними вечірками, радіючи успіху революції. Поки їжа та пиво переходили з рук у руки, один чоловік усміхався та жартував із гуляками, але насправді не усміхався.\n\nРодина Лінкольна Буллока емігрувала з Ямайки, коли він був хлопчиком, і він здобув репутацію як розумної та популярної дитини. Його завербували до FBI одразу після школи, хоча його й не треба було особливо переконувати після того, як його батька застрелили двоє нацистських симпатиків під час антифашистського мітингу. Він був двомовним, невимушеним і, перш за все, патріотом. Природний кандидат на те, щоб по-своєму працювати в карибському відділі.\n\nПісля революції виник страх, що ННП, яка завжди підтримувала тісні зв'язки з емігрантськими громадами у США, відчує себе сміливішою та створить внутрішні заворушення у Сполучених Штатах. Якби вони об'єдналися з чорними націоналістичними рухами, це могло б стати проблемою. Деякі мрійливі дурні могли вірити, що революція може перемогти будь-де, але Лінкольн боявся меншого — насильницького протесту, після якого ще один маленький хлопчик залишиться без батька.\n\n«Хіба не божевілля те, що відбувається на острові? Нарешті маємо місце, яке наше, і більше нічий. Думаю повернутися, коли трохи назбираю. Найкраще самому все побачити».\n\n«Непогана ідея», — збрехав Лінкольн, — «хоча я, мабуть, трохи почекаю, поки все заспокоїться. Ніколи не знаєш, розумієш?»"
 JAM_flavor.29.a: "Лінкольн усміхався, жартував, але понад усе — слухав."

