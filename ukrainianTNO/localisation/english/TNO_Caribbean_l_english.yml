 Caribbean_flavor.231.a: ""

 Caribbean_flavor.232.t: "Paradise Lost"
 Caribbean_flavor.232.desc: "THE MOVEMENT - PAGE 13 - [GetDateText] - INTERVIEW WITH FORMER DOMINICAN PM\n\nCompared to the hectic end of Edward LeBlanc's term as Prime Minister of Dominica, his current life is much quieter. Now living in Havana, LeBlanc writes for English-language periodicals and is trying to learn Spanish. However, his opinions towards justice for Afro-Caribbeans have not cooled.\n\n"My goals were always to improve the Caribbean, and Dominica," he says. "Colonization and slavery have impoverished us, but I know that we will prosper once those boots are lifted from our neck."\n\nHe always had a poor reputation among American diplomats, he explained, even with the appeals Castro made on his behalf. "Whenever I passed laws for Dominica's welfare, they always warned me of the planters and of economic turmoil. But when I tried nationalizing the production of fruit, they stopped talking entirely. The only Americans I heard from afterwards were from the United Fruit Company."\n\nMillions rolled in, and the American press charged him with Bolshevism. Boosted by bribes and veiled threats from American forces, he was ousted and replaced by a puppet in Nicholson Ducreay. "I always had my concerns about him, but never expected him to be a traitor," he explained, disgust evident in his voice. "The FBI always saw the only issue with our isle as being an Anglo-Canadian, and not American, colony."\n\nWhen asked about his views on his party, he was equally as unsympathetic. "A total sham. The Democratic Labour Party has become a shadow of its former self, and I disavow it completely." However, he warned, "don't expect America to be immune. Millions went into overthrowing Dominica. Imagine how many billions they would spend to buy a world power. They did it to Germany, after all.""
 Caribbean_flavor.232.a: "A Boy Who Cries Wolf, or a modern Cassandra?"

 Caribbean_flavor.233.t: "Gaming the Misers"
 Caribbean_flavor.233.desc: "LeBlanc's crimson banners are gone — the dust has settled, but what now? Eugenia Charles of the Dominican Freedom Party is a pragmatic woman. It's time to work with the United Fruit Company to get Dominica back on track. Her leftist predecessors created chaos at the negotiating table — hopefully, some simple courtesy can resolve it.\n\n"The United Fruit Company demands that the Dominican government return all state-held stakes," spoke one of the representatives, who then glanced at one of his contemporaries to continue.\n\n"The nationalization policy under your predecessor—our superiors want it gone," echoed the other representative. Each tried to secure a chance to speak for the Company's good name, but none had the guts to proceed. Their glances darted back and forth, waiting for someone to break Charles's silence.\n\nPast a round of half-quiet chattering, Charles sighed as the suited foreigners looked on. "Dominica is willing to work with the Company for our mutual benefit. However, a hasty course is not what our economy needs currently."\n\n"What is it that you ask then? In your words, we ought to cleave the plantations in half!" Most other representatives were unimpressed, and the room grew silent again as the speaker was buried in passing jeers. Nevertheless, Charles gave a customary nod before returning to her statement.\n\n"Nationalization can be a slowed course, but not entirely halted." Sneers followed, but no objection — Charles called her secretary to put forth the DFP proposition. "The United Fruit, as our population's largest employer, ought to understand that it relies upon our work to operate here. We can always choose another employer, and you can always leave if you don't want us to have a stake.""
 Caribbean_flavor.233.a: "The Company did not leave."

 Caribbean_flavor.234.t: "The Hitler of Dominica?"
 Caribbean_flavor.234.desc: "One detects, in the recent maneuvers of Dominica's Edward Oliver LeBlanc, the unmistakable aroma of a statesman who discovered the narcotic pleasures of unchecked authority. What began as a modest program of rural uplift has metastasized into a full-fledged campaign of political consolidation, executed with the serene confidence of a man who believes history has personally anointed him as the custodian of the island's destiny.\n\nNo, LeBlanc is not a Hitlerite in the bow down to Germania sense. But it is unmistakably cultivating the habits of one: the centralization of economic life, the stigmatization of American partnership, the constriction of political space. These are not the gestures of a man looking for the benefit of his people, but of a political despot hell-bent on consolidating himself and antagonizing America to the benefit of Germania.\n\nEqually troubling is the Premier's sudden enthusiasm for anti‑American sentiment. Mass nationalizations of all private property, foreign or domestic, will befall the island. Forcing a complete withdrawal of American companies and land owners for a consolidation in his own political class. LeBlanc has framed this as strides towards growth and well-being, but those were the same phrases used by Hitler when he attacked Germany's industries decades ago. LeBlanc has made it fashionable to denounce the United States as a meddling colossus, a convenient foil for every domestic shortcoming. One suspects that LeBlanc's speechwriters have been cribbing from the more theatrical pamphleteers of Europe.\n\nThe Caribbean has seen this drama before, and it rarely ends well for anyone. Dominica's friends, of which the United States has long been one, would be derelict if they failed to note the trajectory. A leader who once promised empowerment now appears intent on ensuring that the only empowered institution on the island is one of Anti-Americanism. - William F. Buckley"
 Caribbean_flavor.234.a: "Conservative firebrands had found yet another target."

 Caribbean_flavor.237.t: "The Bajans Declaration"
 Caribbean_flavor.237.desc: "Tom Adams, son of Grantley Adams and the new prime minister of Barbados stood before the Organization of American States and delivered the speech that would define his political career.\n\n"My father Grantley, believed in the dream of a firmly united Caribbean, one where it is not plagued by constant infighting but of the belief of unity and prosperity for all the islands. I carry his belief forward that the only way forward for these islands is to unite under a singular flag." Adams took a quick sip before continuing.\n\n"We also firmly believe that the American republic, for all its trials, has stood as a bulwark against tyranny in the Caribbean, a beacon for the oppressed, and a partner to those who seek peace through liberty. We in Barbados do not forget this. We honor it."\n\n"The Caribbean and the United States must strive for a new era of principled cooperation, a new era built not on dependency to one, but on shared liberal values of freedom. Across the Caribbean we have seen the constant temptations of isolationism and extremism, but my fellow leaders and representatives, we must all embrace a democratic model and preserve stability and prosperity across this hemisphere."\n\nAdams quickly glanced at the American delegation before continuing, "Barbados cannot give enough praise to our American friends shepherding of the Caribbean, a constant stabilizing force that without, the Caribbean would fall into chaos."\n\n"Thank you."\n\nThe speech was met with thunderous applause from American delegates and quiet admiration from many others. In many American foreign diplomatic circles, Adams was being hailed as a rising liberal voice in the region, one who realizes the importance of America in the region."
 Caribbean_flavor.237.a: "Someone down there gets it."

