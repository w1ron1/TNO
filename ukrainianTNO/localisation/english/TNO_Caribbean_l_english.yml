 Caribbean_flavor.213.a: ""

 Caribbean_flavor.214.t: "Сент-Кітс і Невіс зближуються з Мексикою та Кубою"
 Caribbean_flavor.214.desc: "ЦІЛКОМ ТАЄМНО/[GetDateText]\n\nВІД ОСКАРА КОТТОНА\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: МЕКСИКАНСЬКА ТА КУБИНСЬКА ДОПОМОГА ДОСТИГАЄ СЕНТ-КІТСУ Й НЕВІСУ\n\n1. Сили безпеки Сент-Кітсу й Невісу почали шукати допомоги в Мексиці, а не використовувати встановлені канали, і сили безпеки Кітітти почали дедалі активніше співпрацювати з кубинською програмою підготовки. Репресії проти політичних дисидентів, включно з проамериканськими голосами, значно посилилися. Ця політика означає чітке геополітичне перегрупування та свідчить, що попередній поворот не буде тимчасовим.\n\n2. Розчарування через спробу флібустьєрського перевороту Сарджента було постійним явищем у регіоні, а наша відсутність прямої відповіді на нього, окрім публічного засудження, ще більше посилила вже наявні змови. Тим часом мексиканське озброєння дедалі активніше використовується силами безпеки Кітітти, які почали проходити підготовку на кубинській території. Прем'єр-міністр Бредшоу також неодноразово відвідував Гавану останніми тижнями, вихваляючи переваги їхнього союзу та закликаючи до карибської єдності.\n\n3. Раптова зміна нашої політики, ймовірно, не відновить колишніх зв'язків. Нещодавні дипломатичні контакти свідчать, що Бредшоу глибоко боїться другої спроби перевороту і є головною перешкодою для американських інвестицій. У міру консолідації його влади, ймовірно, наближається чистка дипломатичного корпусу, а твердий відхід від нас буде забезпечено."
 Caribbean_flavor.214.a: "ВІРНІСТЬ, ХОРОБРІСТЬ, ЧЕСНІСТЬ"

 Caribbean_flavor.215.t: "Туга за домом"
 Caribbean_flavor.215.desc: "Коли навколо неї ожив гомін розмов, Кетрін Окталієн намагалася відволіктися від минулого дня. За ті мізерні гроші, які вона отримувала, робота прибиральницею у старшій школі була важкою. Сьогодні кілька учнів принесли майже цілу бочку алкоголю, але не змогли її втримати в собі, змусивши її прибирати до пізньої ночі. Єдиними її маленькими радощами були п'ятничні вечори в місцевій закусочній і читання Caribbean Onlooker, невеликої газети для карибської діаспори по всьому Маямі.\n\nДЖОРДЖ ЧАРЛЬЗ ПЛАНУЄ ПРОВЕСТИ ЗЕМЕЛЬНУ РЕФОРМУ НА СЕНТ-ЛЮСІЇ\n\nОкталієн здивовано, а потім схвильовано прочитала заголовок. Колись вона з певним інтересом стежила за кар'єрою Чарльза і навіть думала добровільно вступити до Лейбористської партії Сент-Люсії, але обов'язки щодо її господарства змусили її передумати, просто спостерігаючи з певним хвилюванням осторонь. Звісно, це було тоді, коли вона ще могла дозволити собі жити у своїй країні. До приватизацій.\n\nНіщо не завдало такого болю, як лист про виселення, який вона отримала. Після того як землі метаяжу, які її родина обробляла поколіннями, продали, їх захопила United Fruit Company, а потім негайно зрівняла із землею та замінила банановою фермою, поглинаючи їх у дедалі більший масив навколо неї. Через це вона була змушена виїхати в пошуках роботи, спочатку до Кастрі, а потім, коли це не вдалося, до Сполучених Штатів.\n\nОднак ця новина дала надію. Можливо, вона нарешті зможе повернутися додому? Вона підняла погляд від газети на тарілку перед собою, відчуваючи клубок у животі через фрукти, кинуті на їхній бік. United Fruit Company витратила мільйони на викуп половини острова для власних потреб і мала ресурси, міжнародну підтримку та завзятість, щоб чинити опір. Навіть якщо вона повернеться на Сент-Люсію, у неї не буде жодного шансу повернути її без проходження через кожного юриста, пов'язаного з компанією."
 Caribbean_flavor.215.a: "І так, знову, їй довелося задовольнятися спостереженням осторонь."

 Caribbean_flavor.216.t: "Хворобливий зелений"
 Caribbean_flavor.216.desc: "ЦІЛКОМ ТАЄМНО/[GetDateText]\n\nВІД ОСКАРА КОТТОНА\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: УСПІШНА ОРГАНІЗАЦІЯ АНТИБІЛЬШОВИЦЬКИХ АКТИВІСТІВ НА СЕНТ-ЛЮСІЇ\n\n1. Наші зусилля з організації опозиції плану націоналізації прем'єр-міністра Сент-Люсії Джорджа Чарльза увінчалися успіхом. Дві демонстрації, організовані в столиці Кастрі та в Бізе, перевищили очікувану кількість учасників і дають цінне уявлення як про тих, хто в регіоні виступає проти порядку денного Чарльза, так і про те, які повідомлення будуть найефективнішими.\n\n2. Дві демонстрації були організовані в найбільших поселеннях острова, Кастрі та Бізе, за допомогою прихильних політиків та агентів у Прогресивній партії. Підрахунків не проводили, але кількість учасників на обох перевищила тисячу; це були представники середнього класу та заможніші селяни, які висловлювали занепокоєння через втрату землі та радикалізм.\n\n3. Наслідки цієї зустрічі мають бути зрозумілими. Відтепер наше повідомлення має зосереджуватися передусім на економічних питаннях, підкреслюючи ризик, який націоналізація створить для сільськогосподарської бази, що забезпечує економіку Сент-Люсії. Ми також повинні прагнути підвищити впізнаваність Джона Комптона, лідера Прогресивної партії та нині життєздатної й популярної опозиційної фігури."
 Caribbean_flavor.216.a: "ВІРНІСТЬ, ХОРОБРІСТЬ, ЧЕСНІСТЬ"

 ### Я не знаю контексту цих:
 Caribbean_flavor.217.t: "Знову разом"
 Caribbean_flavor.217.desc: "Вогні невеликого курорту над Бастерром усе ще світилися теплим жовтим, але лише ледь-ледь. Останніми тижнями занепокоєння через нафтову кризу в регіоні лише зростало: стрімке зростання цін та обмежена американська підтримка штовхали деякі райони до віялових відключень електроенергії. Конференція, скликана для обговорення цього питання, була активною, але невеликою, і більшість учасників не хотіли робити нічого, крім повторення заяв. Коли сонце сідало перед ним, Вільям Герберт обернувся, сподіваючись отримати чіткіші відповіді щодо долі Союзу Підвітряних островів.\n\n"Гадаю, ваша пропозиція має сенс, Вільям," — сказав Вір Берд, відповідаючи ні на що конкретне. "У нас немає багатства, населення чи ресурсів, щоб вижити самостійно."\n\n"Я згоден," — продовжив Герберт рівним голосом. "Є межа сили наших урядів. Принаймні, об'єднавшись, наші спільні ресурси, можливо, зможуть щось зробити."\n\nЩе на секунду запала тиша. "Отже, нашою наступною метою має бути оголосити про це конференції? Не повинно бути надто складно винести це питання на обговорення."\n\n"Звичайно. Це була ідея Гасті від самого початку, тож його принаймні слід поінформувати про це. Але крім того, нам, мабуть, слід почати зосереджуватися на графіку."\n\nБерд кивнув, поклавши звіт на стіл перед собою. "Справді. Ми, мабуть, могли б поступово запровадити це через послаблення імміграційного контролю та співпрацю поліції протягом кількох місяців."\n\nГерберт підняв голову, але його обличчя залишалося нерухомим, коли він простягнув руку для рукостискання. "Я знаю, що кілька інших прем'єр-міністрів говорять про регіональний союз деінде, але не думаю, що буде бажання відновлювати Федерацію. Цей корабель відплив давним-давно.""
 Caribbean_flavor.217.a: "Відлуння залишається в місці, якого більше немає."

 Caribbean_flavor.218.t: "Нафта та можливості"
 Caribbean_flavor.218.desc: "Після нещодавнього переобрання блискучий ресторан у Новому Орлеані, мабуть, був не тим місцем, де можна було очікувати побачити Віра Берда, прем'єр-міністра Антиґуа і Барбуди. Але ось він, виходячи з елегантного чорного лімузина й одразу прямуючи до однієї із задніх кабінок. Звісно, Берд не хотів опинятися там, де його легко знайти.\n\nЙого спільник і колега-прем'єр-міністр Карибів, Вільям Герберт із Сент-Кітсу, Невісу та Анґільї, уже переглядав меню. "Гарне місце ти знайшов для нас, Віре."\n\n"Власник — хороший хлопець. Подбав, щоб ніхто не підслуховував." Берд сів на своє місце, його значна статура робила стіл майже комічно маленьким. "Не хотілося б, щоб завтра нашу розмову надрукували в кожній газеті на Карибах."\n\nЧерез келих хорошого вина, коли двоє чоловіків закінчили знищувати свої стейки, Герберт нарешті перейшов до причини їхньої розмови. "Ти так само добре, як і я, знаєш, що справи погані. Якщо ціни на нафту залишатимуться на нинішньому рівні та з усіма проблемами, які це принесе, на карибські економіки чекають важкі часи щонайменше кілька років. Можливо, більше, ніж ми зможемо витримати самостійно."\n\nБерд на мить замовк, перш ніж відповісти. "Буде нелегко, так. Але думаю, ми погоджуємося, що самостійне подолання цієї кризи — не план."\n\nГерберт кивнув. "Безумовно. Це може й повинно стати можливістю. Ми могли б почати об'єднувати ресурси, а також політично зблизитися. Допомагати одне одному, коли якийсь паскудний журналіст намагається винести брудну білизну назовні в момент національної кризи."\n\nБерд простягнув руку. "Саме про це я й думав. За стабільне спільне майбутнє, Вільям"."
 Caribbean_flavor.218.a: ""За стабільне спільне майбутнє, Віре.""

 Caribbean_flavor.224.t: "Туга за домом" #Наразі закоментовано, оскільки ці події використовувалися для налаштування та завершення операції «Шингл»
