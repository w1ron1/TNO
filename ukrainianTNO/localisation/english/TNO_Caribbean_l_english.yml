 JAM_flavor.18.t: "Ямайські крики"
 JAM_flavor.18.desc: "КОНФІДЕНЦІЙНО\nДО МІНІСТРА ЗАКОРДОННИХ СПРАВ\n\nЯМАЙКА — НЕСТАБІЛЬНЕ СУСПІЛЬСТВО\n\nУ записаній телефонній розмові між іберійським послом на Ямайці та Г’ю Ширером Ширер пообіцяв дотримуватися та відновити таємні домовленості між урядом Ямайки та ямайськими бандами щодо підтримання низького рівня злочинності, з виплатою винагороди цим угрупованням. Попри це, національні річні показники вимагання, крадіжок і вбивств досягли найвищого рівня за десятиліття, а поширення «бандитських війн» між донами на підтримку або проти ЯЛП лише посилюється.\n\nРуйнування, спричинені як відключенням електрики, так і ураганом, стали великим благом для поссе; жертви, які постраждали особисто та економічно, масово вербувалися до банд, що конкурували з поссе, в обмін на високу плату. Цю обтяжливу ситуацію погіршують члени ЯЛП та ННП, зокрема Едвард Сіґа, знаменитість ЯЛП і колишній міністр житлового господарства, який використав свої зв'язки в Тіволі-Ґарденс, щоб дозволити лояльним поссе насильницьки розширювати свої території.\n\nКабінет Г’ю Ширера перенаправив частину фінансування поссе на відновлення соціальних служб та зруйнованої інфраструктури, стримуючи ефективність схеми. Поточні економічні прогнози передбачають незначне або нульове зростання економіки Ямайки через брак інвесторів і занепад туристичної галузі.\n\nНаразі ми не можемо рекомендувати жодних дій для зміни цього курсу."
 JAM_flavor.18.a: "Брехнею не можна вічно плекати націю."

 JAM_flavor.19.t: "Lignum Putrescit"
 JAM_flavor.19.desc: "Дипломати на курорті Half Moon відпочивали після безрезультатної зустрічі з міністрами Ширера. Ресторан Sugar Mill був цілком пристойним місцем для імпровізованої зустрічі дипломатів через брак клієнтів.\n\n«Ви ж знаєте, що старий ледве може говорити через хворобу, яка його виснажує? Я здивуюся, якщо він доживе до кінця року, з такою різкою втратою ваги за останні місяці». Луїс М. Ґонсалес-Мата намагався запалити сигару, пліткуючи з іншими.\n\n«І ми знаємо, що Ширер не має ані впливу, ані старшинства, щоб упоратися з цим неприйнятним безладом». Чоловік, який говорив, був у темно-синьому піджаку й випускав власний дим. «Хоча обіцянка реформувати авторитарну державу та звільнити деяких політичних в'язнів може привабити певних лібералів, це не означає, що він контролює ситуацію з іншими підступними угрупованнями».\n\n«Комуністи?» — запитав його дипломат в окулярах.\n\n«Довбаний осел, масиви!» Раптовий вибух Луїса змусив garçon здалеку повернути голову до столу. «Кволий дурень, якому я колись довіряв, не може нормально вести угоду, тож тепер вони знову безчинствують на вулицях». Луїс тихим голосом висловлював зневагу, похмуро звертаючись до своєї аудиторії.\n\n«То це все?» — тихо вигукнув лисий дипломат у костюмі кольору хакі. «Ми просто дозволимо Бустаманте відійти в тінь, поки його наступник, цей пихатий baboso, намагатиметься тримати Америку на відстані, не даючи їй проштовхувати кокаїн?»\n\nДо кінця зустрічі не було сказано жодного слова. Наприкінці garçon лише поглянув на них, коли вони залишили приміщення."
 JAM_flavor.19.a: "Вони просто спостерігатимуть, як кораблі проходять повз."

 JAM_flavor.20.t: "Faux Idyllic"
 JAM_flavor.20.desc: "ОБМЕЖЕНИЙ ДОСТУП/[GetDateText]\n\nВІД АГЕНТА ДАННА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: РОЗВІДУВАЛЬНИЙ ЗВІТ ПРО ЯМАЙКУ\n\n1. Г’ю Ширер, який обійняв посаду прем'єр-міністра Ямайки після смерті Дональда Сенґстера під час хвилі відключень електрики, послабив цензурні закони країни та пообіцяв подальші соціальні й економічні реформи після вступу на посаду. Однак він відмовляється реагувати на вимоги змінити титули сера Александера Бустаманте як довічного президента та національного засновника, зберігаючи спадщину Бустаманте як «визволителя» та «захисника ямайців».\n\n2. Витік джерел вказує на те, що Ширер не змінив хиткі відносини зі злочинними бандами, відповідальними за збільшення контрабанди наркотиків та зброї до Сполучених Штатів. Він досі дотримується угоди про надання капіталу бандам в обмін на суспільну стабільність. Розвідка також дослідила рідкісні публічні появи Бустаманте й виявила, що він страждає від «тривалої хвороби». Передбачається, що тепер він має менший виконавчий контроль над Ширером у міру подальшого погіршення його здоров'я. Наш політичний союзник у ЯЛП, Едвард Сіґа, тепер має менший вплив у партії після приходу Ширера й не здатен впливати на його правління. Зменшення ролі Сіґи вплине на будь-які майбутні операції на Ямайці.\n\n3. Попри постійне фінансування та підтримку з боку Іберійського Союзу, масштабна корупція є головною проблемою Кінґстона, що демонструє значний вплив злочинних банд на країну. Внутрішня ситуація на Ямайці продовжує не демонструвати жодних ознак покращення, а її майбутнє залишається непередбачуваним."
 JAM_flavor.20.a: "Вірність, хоробрість, чесність."

 JAM_flavor.21.t: "Золото має текти"
 JAM_flavor.21.desc: "Бурхливий шлях від спілкування з синдикатами Тіволі-Ґарденс до остаточного формування країни власноруч, причому Шеклі використав політичний хаос, що почався з урагану, який занурив увесь острів у темряву, як наслідок. Сіґа тепер сидів навпроти посла та дипломатів, із американським прапором, приколотим праворуч на лацкані.\n\nДипломат з іншого боку запитав про відсутність Бустаманте на зустрічі. «Той старий уже надто старий, щоб тримати ручку ще хоч хвилину». З обох боків пролунало кілька смішків після сухого жарту Сіґи.\n\n«Кінґстонський договір є сходинкою до відновлення дружніх відносин між нашими державами, а міцніше економічне партнерство між США та Ямайкою є необхідною умовою для створення достатніх можливостей для відновлення занедбаних районів». Сіґа стояв за трибуною поруч з американським послом, невдовзі після підписання нового договору, декламуючи непомітну езопову промову роботизованим тоном перед камерами.\n\nВідключення електрики дозволило поссе знову влаштувати безлад на вулицях, особливо через нову нестабільність після нещасливої смерті Сенґстера. Через зростання рівня злочинності та нескінченну контрабанду кокаїну й марихуани на північ Сіґа використав свої зв'язки з Тіволі-Ґарденс, щоб упоратися з цим в обмін на можливість послабити непохитну лояльність конкуруючих банд до ННП та Іберії. Для Ямайки та Дона Тіньового поссе це була безпрограшна угода.\n\n«Пане прем'єр-міністре, якщо інвестори досі насторожено ставляться до повідомлень про перестрілки та викрадення людей у районах по всій Ямайці, як ви можете відповісти на це занепокоєння?» Логотип ABC на мікрофоні ідентифікував репортера, коли той сховався за спалахами камер, ставлячи своє непроханe запитання. Відпрацьована манера Сіґи у відповіді приховала його сильне невдоволення."
 JAM_flavor.21.a: "«По-перше, з цими злочинцями буде покінчено свого часу...»"

 JAM_flavor.22.t: "Суддя Дред"
 JAM_flavor.22.desc: "Сонячне світло ясного блакитного неба здавалося нестерпним на голові Луїса Ґонсалеса-Мати. Шість років роботи з наставляння Бустаманте в орбіту Іберії пішли нанівець, коли чоловіки з JCF супроводили його до літака додому.\n\nСмерть Сенґстера та зникнення Бустаманте практично занурили Ямайку в хаос. Він став свідком того, як Сіґа зробив зневажливий шаховий хід, щоб повалити маріонетку та консолідувати контроль над ЯЛП. До того часу все вже вказувало на те, що Мата стане першою мішенню. Поки старий був недосяжним під час спалаху анархії, його руки були зв'язані, і доля винагородила його, оголосивши «persona non grata».\n\nВін мав змирений вираз обличчя, коли чоловіки в синьому провели його з льотного поля до пасажирських дверей. Сіґа викрив його як шпигуна, який підкуповував банди, відповідальні за сотні смертей і мільйони збитків посеред відключення електрики. Зробити Мату цапом-відбувайлом? За той самий злочин, у якому брала участь уся авгієва стайня ЯЛП? Він знаходив це досить саркастичним.\n\nЩо тепер? Бути вигнаним колишнім союзником своєї держави — чорна пляма в резюме будь-кого, тож після повернення до Мадрида він очікував дострокового звільнення з SECED. Буста згниє під домашнім арештом, зберігаючи свої номінальні титули, тож історія може показати, що зрештою він був лише капелюхом без худоби. Мата не сумуватиме за роботою з таким дурнем.\n\nЗамислена усмішка з'явилася на його обличчі, коли він поглянув у вікно зі свого місця. Він сумуватиме за цим боком Атлантичного океану."
 JAM_flavor.22.a: "А тепер чотириста років!"

