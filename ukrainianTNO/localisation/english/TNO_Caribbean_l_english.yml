 JAM_flavor.6.a: ""

 JAM_flavor.7.t: "Ціна блакитного золота"
 JAM_flavor.7.desc: "Фанфари біля Будинку короля мало приховували тривогу. Під вибіленими сонцем прапорцями натовп державних службовців і бізнесменів знав, що сьогодні насправді не святкування, а ретельно організований продаж. Усередині сер Александер Бустаманте виводив своє ім'я на останній сторінці Іберійських торговельних угод. Підпис був сміливим і впевненим, але перо трохи тремтіло, коли він повертав його іберійському посланцеві, що чекав, перш ніж потиснути руку послу з Мадрида й усміхнутися в сліпуче світло камер.\n\nНа папері угода була досить простою. Іберійські корпорації придбають контрольні пакети акцій у кобальтових шахтах і на підприємствах із його переробки на Ямайці. Натомість острів отримає рятівний круг: іноземну валюту, промислове обладнання та запевнення в "взаємному економічному розвитку". Евфемізми евфемізмами, технічно угода була значно вигіднішою для ямайців, ніж для іберійців, які чудово знали, що кобальт аж ніяк не був найбільшим мінеральним експортом острова, а самі шахти були збитковими купами відходів.\n\nРеальність за угодою полягала в тому, що роки придушення інакодумства змусили інвесторів острова виїхати за кордон; скарбниця була порожня, а армія втомилася чекати на виплати. Кобальтові шахти були лише заставою за дозвіл Ямайці впустити старого колоніального господаря на дещо кращих умовах, ніж за попередньою домовленістю. З погляду Мадрида, тепер вони отримали форпост у Карибах після приблизно столітньої перерви та засоби для початку проникнення у її економіку.\n\nДля робітників, що лежали у своїх халупах і нетрях навколо шахт, новина прийшла луною вниз по шахтах. Ще одне іноземне ім'я, намальоване на обладнанні, ще один прапор, пришитий до касок. \n\nБустаманте стояв на веранді, коли кортеж іберійської делегації віддалявся, а легкий вітерець ворушив його пальто. Затока внизу блищала, синя й безкрая. Десь у глибині душі він замислився, чи не започаткував він лише схему розпродажу острова, шматок за шматком, тим, кому було байдуже до його добробуту.\nПотім він відкинув ці думки й випив джин із тоніком."
 JAM_flavor.7.a: "А потім випив ще один."

 JAM_flavor.8.t: "Звук промисловості"
 JAM_flavor.8.desc: "У гавані Кінґстона було тихо, якщо не рахувати звуку припливу, що бився об корпуси кораблів. Єдина лампочка блимала над митним складом і дратувала Донні Кларка. У Тіволі-Ґарденс майже не було електрики, але, виявляється, трохи вони могли витратити на цю кляту діру. Вони стояли навколо непоказного ящика, позначеного іспанськими написами, яких ніхто не міг прочитати. Та це й не мало значення, оскільки всередині було чути брязкіт порожніх магазинів.\n\nПід'їхала чорна машина. З неї вийшли двоє чоловіків: один у випрасуваній сорочці, попри спеку, інший — двометрова брила суцільних м'язів. Чоловік у випрасуваній сорочці нікого не привітав, а лише відкрив свій портфель і передав Кларку конверт.\n\n"Це за цей місяць," — сказав він. "Решта прибуде наступним вантажним судном. Поліція буде далеко від причалу протягом сорока восьми годин."\n\nКларк перерахував купюри, не підводячи очей. "Минулого місяця ти сказав те саме," — сказав він. "А потім митники обшукали човни двох моїх хлопців."\n\nЧоловік у випрасуваній сорочці не сперечався. Він поклав ще один, менший конверт поверх першого. "Вважай це вибаченням."\n\nКларк усміхнувся тонко й безрадісно. "Мені насправді байдуже, хто тут усім заправляє," — сказав він. "Просто не давай обіцянок, яких не можеш виконати. Мої люди чують ім'я Ґонсалес-Мата — і починають думати, що хтось інший володіє цим місцем. Якийсь маленький франт з Іспанії чи Португалії."\n\n"Хтось і володіє," — сказав чоловік у сорочці, а потім кивнув у бік ящика. "Завантажуйте. Корабель вирушає до світанку."\n\nЛюди Кларка швидко взялися до роботи. За кілька хвилин ящик зник у вантажівці, а склад спорожнів. Двоє чоловіків ще мить затрималися, спостерігаючи з машини крізь серпанок сигарного диму. Коли вони поїхали, єдиними звуками, що залишилися, були вода біля причалу та віддалена луна п'яного сміху банд, які розвантажували ще одну партію. Тепер торгівля вже ніколи не припиниться. Навіть уночі."
 JAM_flavor.8.a: "Ніколи."

 JAM_flavor.9.t: "Срібло чи свинець"
 JAM_flavor.9.desc: "Хоча офіс прем'єр-міністра приймав незвичне зібрання людей, у ньому панувала тиша. Генеральний інспектор JCF стояв біля вікна, перечитуючи останні поліцейські звіти. Менше стрілянини, менше страйків, менше заголовків. На перший погляд, справи покращувалися.\n\nЗа столом навпроти Луїс М. Ґонсалес-Мата струшував попіл у скляну попільничку й чекав. "Бачите?" — нарешті сказав він. "Цифри говорять самі за себе."\n\nНачальник штабу оборони насупився. "Ви платите їм за те, щоб вони поводилися пристойно. Це не управління."\n\n"Це дешевше за війну. І прем'єр-міністр погоджується."\n\nДвері відчинилися. Бустаманте увійшов, рухаючись повільніше, ніж раніше. "Панове," — сказав він, сідаючи на своє місце. "Звіти скарбниці свідчать про порядок у Кінґстоні. Докери знову працюють. Люди нагодовані. Ось що має значення."\n\n"Якою ціною? Ці гангстери думають, що тепер вони уряд. Вони збирають наші виплати й називають їх даниною. Ми продали наші — "\n\nБустаманте перебив його й кивнув раднику. "Ми можемо битися з ними," — сказав радник, "але це виснажить острів до краплі крові. Я підготував тут попередній звіт, якщо хочете з ним ознайомитися. Але мій висновок простий: їм потрібні гроші, а не влада. Дамо їм те, що вони розуміють."\n\nПрем'єр-міністр на мить заплющив очі, а потім тихо промовив. "Якщо люди можуть спати, назвімо це миром."\n\nПізніше тієї ночі конверт залишив Міністерство фінансів під охороною поліції. До ранку він мав потрапити на склад у Тіволі-Ґарденс, один із десятків, доставлених того тижня. Чоловіки, які його отримали, не носили форми, але вони тримали свої вулиці в тиші.\n\nПо радіо уряд оголосив про "період стабільності". У провулках банди називали це сезоном данини й жадібно облизували губи. Але поки що Ямайка спала."
 JAM_flavor.9.a: "Неспокійний сон — це все одно сон."

 JAM_flavor.10.t: "Коли все, що в тебе є, — банан"
 JAM_flavor.10.desc: "Було пів на четверту, коли Едвард Сіґа увійшов до станції в Сан-Хуані, з усмішкою на обличчі, яку було видно навіть попри каптур, що закривав його обличчя. Він уже встиг полюбити ці зустрічі, попри клопоти з подорожами інкогніто. Щоправда, тепер Бустаманте мав більше приводів для занепокоєння, ніж те, чим займався Едвард Сіґа.\n\nПідготовка до Операції «Банановий спліт» пройшла цілком успішно. FBI успішно завербувало кількох інформаторів у уряді Бустаманте. Щоразу, коли писався невтішний звіт, не минав і день, перш ніж його оприлюднював журналіст через «анонімне джерело». Профспілка Бустаманте також була пронизана агентурою, і точилися численні розмови про брак довіри робітників до готовності президента захищати права працівників, особливо коли йшлося про захист корінних ямайців від іберійських підприємств, готових їх експлуатувати.\n\nСіґа навіть зміг підпорядкувати собі злочинні організації, змусивши їх працювати на нього. Найпомітнішою з них була Shower Posse, яка охоче спалювала поля конопель конкурентів і підтримувала жорстокий порядок у бідніших районах міста та серед сумнівних елементів. Шеклі не надто схвалював цю частину операції, але практична сторона його розуму змусила замовкнути заперечення; злочинці все одно існуватимуть, краще нехай працюють на тебе, а не проти тебе.\n\n«Пане Сіґа. Поговорімо про майбутнє Ямайки...»"
 JAM_flavor.10.a: "Шеклі та Сіґа. Пара, створена на небесах."

