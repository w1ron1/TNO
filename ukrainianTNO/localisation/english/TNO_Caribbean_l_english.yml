 Caribbean_flavor.226.t: "Going Bananas"
 Caribbean_flavor.226.desc: "At the United Fruit headquarters, the monthly financial briefing is no different from the usual — a few numbed bureaucrats spitting meaningless lines of jargon and clerks attempting to make sense of those incoherent ramblings. Stockholders looked on intently but never visibly enthusiastic — all was well until there came the investment report on Saint Lucia, prefaced by a hefty man lugging himself out of the seat to present his findings.\n\n"...as it had been noted in the previous month's briefing, Saint Lucia continues to be one of our lowest-performing areas due to Prime Minister Compton's protectionist policies. My team suggests withholding further sponsorship to the People's Progressive Party until the situation is rectified under the UFC's advice."\n\nOne claim after another, he made a point for the Ivory Tower to revise their smiles for their so-called good friend. "In short, Compton got paranoid and wants us out of his island." Chattering noises filled the static as the bureaucrat's rambling stopped. A vague ripple of "pinko" and "hang that bastard" permeated the conversations within the board room, protests growing louder until it became truly intolerable. A few less... talkative members of the committee soon began vacating the room one after another as it turned into a competition of insults.\n\nSoon enough, the fat one took to the ways of his peers as well. It was no fun being the straight man in a room of burning zealots, and if the world is turning upside down, it might as well be mandatory to go along."
 Caribbean_flavor.226.a: "Planting bananas, and being bananas."

 Caribbean_flavor.229.t: "Dominica Seeks Nationalizations"
 Caribbean_flavor.229.desc: "TOP SECRET/[GetDateText]\n\nFROM OSCAR COTTON\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: IMPENDING LEFT-WING REFORMS IN DOMINICA\n\n1. In recent weeks, the Dominican government has begun to seek the implementation of several significant economic reforms, seeking the nationalisation of major industries, most significantly the banana trade. Other laws seek to greatly raise the power of a newly republican executive, and to center the Dominican government around Edward LeBlanc, who has openly identified himself as being comparable to Fidel Castro.\n\n2. Many of these plans have been publicly announced, but the full specifics have been largely hidden outside of the ruling Democratic Labour Party, which has been thankfully infiltrated. Shareholders in the United Fruit Company have also raised concerns with the Federal Trade Commission, directing us to statements explicitly threatening American positions within the region and rejecting requests for reimbursement.\n\n3. If we want to stop this, we only have a brief window before this becomes law. LeBlanc has high approval ratings, but there is a lot of internal opposition within the DLP over how much power it invests in the executive and the risk of a revolutionary Dominica, and significant funding from the UFC. If we act fast, we should be able to rally parliamentary and business opposition to oust him and prevent this - but we cannot delay."
 Caribbean_flavor.229.a: "Bring me the phone. We have some men in Roseau and New Orleans to call."

 Caribbean_flavor.230.t: "Conspiracy Gathering in Dominica"
 Caribbean_flavor.230.desc: "TOP SECRET/[GetDateText]\n\nFROM OSCAR COTTON\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: INCOMING PLANS FOR REMOVAL OF DOMINICAN PRIME MINISTER\n\n1. A planned effort to impeach incumbent Dominican Prime Minister Edward LeBlanc before he can pass his attempted reforms is currently being organized. This effort has been organized by a mixture of moderates within the Democratic Labour Party, alongside all Independents and the members of the United People's Party. Its passage is not certain, but is likely to come within the next week.\n\n2. The group is small and relatively private, but was willing to discuss their plans with us once reassurance of our origins was given. Those we talked with were from the Democratic Labour Party and indicated real concern over the growing strength that LeBlanc himself had. They currently have five of the eleven members on their side, but expect more to come in the timeframe before the vote.\n\n3. There is little we can do to directly support this effort, especially without bringing further organization for LeBlanc's loyalists, but the United Fruit Company has been informed and is pouring in significant resources to those willing to switch. The succession should be seamless, and will see Deputy Premier Nicholson Ducreay, a progressive supportive of the efforts, appointed in his stead."
 Caribbean_flavor.230.a: "FIDELITY, BRAVERY, INTEGRITY"

