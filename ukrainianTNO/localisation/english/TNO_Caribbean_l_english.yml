 JAM_News.18.t: "[Get_newspaper_header]Ліва ННП здобуває перемогу на виборах на Ямайці"
 JAM_News.18.desc: "Знову Народну національну партію було проголошено переможцем нещодавно проведених виборів, зберігши кермо влади над Республікою Ямайка, яке вона тримає від здобуття островом незалежності п'ять років тому, та закріпивши свій демократично-соціалістичний курс.\n\nЦей результат неодмінно ще більше розлютить тих, хто виступає проти нещодавніх економічних реформ молодої держави, які переобраний лідер Майкл Менлі підтвердив, що не має наміру зупиняти, попри значний тиск після нафтової кризи.\n\nНа тлі зростання протестів і політичного насильства, яке посилюють вуличні банди, що мають неформальні зв'язки з правлячою партією, багато спостерігачів побоюються, що поспішна популістська політика прем'єр-міністра незабаром позначиться на перспективах довгострокової стабільності країни."
 JAM_News.18.a: "Спадщину Бустаманте нарешті знищено."
 JAM_News.18.b: ""Клятий Сіґа — це був наш єдиний шанс!""
 JAM_News.18.c: "Надто багато й надто рано."

 JAM_News.19.t: "[Get_newspaper_header]Праві повертаються до влади на Ямайці завдяки несподіваній перемозі"
 JAM_News.19.desc: "У несподіваному повороті Майклу Менлі з Народної національної партії не вдалося домогтися переобрання, поступившись керівництвом країною Едварду Сіґі з Ямайської лейбористської партії. Хоча багато хто пов'язує цей результат зі зростанням політичного насильства та економічними труднощами після нафтової кризи, кілька діячів ННП заявили про іноземний вплив і втручання у вибори.\n\nПродюсер і власник West Indies Records Limited, новообраний прем'єр-міністр є незвичним новачком на ямайській політичній сцені. Позначаючи помітне віддалення партії від її платформи часів Бустаманте, Сіґа підтвердив свій намір спрямувати країну до більш проамериканської позиції, водночас підтримуючи дипломатичні зв'язки з Веракруським пактом. Однак незначна більшість ЯЛП та оскаржувана легітимність можуть стати додатковим викликом для майбутнього управління."
 JAM_News.19.a: "Якраз коли ти думав, що позбувся їх."
 JAM_News.19.b: ""З'єднайте мене з новообраним прем'єр-міністром, я хочу особисто його привітати.""
 JAM_News.19.c: "Свіже обличчя, що несе тінь Дядька Сема."

 JAM_News.20.t: "[Get_newspaper_header]Перемога ультралівих на виборах на Ямайці"
 JAM_News.20.desc: "Річард Гарт із Руху народної свободи заявив про перемогу на нещодавно проведених дострокових виборах на Ямайці після розпаду правлячої коаліції, утвореної між його групою та Народною національною партією, яка тепер стала суперником.\n\nНовий обраний лідер, виступаючи щодо нинішніх економічних і політичних проблем, що переслідують країну, звинуватив американське втручання, зайшовши настільки далеко, що назвав свого опонента Майкла Менлі не більш ніж «маріонеткою» вашинґтонських інтересів.\n\nЦей результат неодмінно ще більше погіршить і без того крижані дипломатичні відносини між островом і Сполученими Штатами, оскільки Гарт пообіцяв значно агресивнішу політику націоналізації та жорсткішу позицію проти того, що він вважає спробами «буржуазної підривної діяльності»."
 JAM_News.20.a: "Давид розпалює гнів Ґоліафа."

 JAM_News.21.t: "[Get_newspaper_header]Перемога поміркованих соціалістів на виборах на Ямайці"
 JAM_News.21.desc: "Після розпаду коаліції ПНС-ННП Річард Гарт із ПНС, партії, що відкололася від ННП, зумів із незначною перевагою перемогти на дострокових виборах. Хоча Гарт значною мірою дотримується соціалістичного підходу, як і його попередник, у внутрішній політиці, його зовнішню політику вирізняє рішучий популістський антиамериканізм, який покладає відповідальність за нинішні проблеми Ямайки на втручання Вашинґтона.\n\nГарт звинуватив колишнього прем'єр-міністра Майкла Менлі в тому, що той перебував під впливом американських розвідувальних служб, водночас критикуючи його за бездіяльність у соціальних питаннях. Він обіцяє розширити поточні програми націоналізації та створити сталу державу добробуту. Хоча його відданість соціальній справедливості здобула йому підтримку багатьох виборців, дехто побоюється, що його антагонізм може ізолювати Ямайку від одного з її найважливіших благодійників."
 JAM_News.21.a: "Ми й надалі майорітимемо тут червоним прапором."

 JAM_News.22.t: "[Get_newspaper_header]Ямайська Народна Республіка оголошує надзвичайний стан після сутички з Канадою"
 JAM_News.22.desc: "У відповідь на дедалі запекліші військові зіткнення між Ямайською Народною Республікою та канадською владою уряд-ізгой на чолі з колишнім пілотом Королівських ВПС Вільямом Страченом запровадив надзвичайний стан. За місцевими повідомленнями, ця заява збігається зі значним посиленням репресивних заходів проти інакодумства, спровокованого недавньою кризою.\n\nЦі події сталися після проголошення островом незалежності через провал переговорів щодо пропозиції про створення Федерації Вест-Індії. Цей акт, як і масштабна нова політика колективізації держави, викликав рішуче засудження з боку представників Вашинґтона, тоді як Страчен заявив, що ситуація є лише результатом спроб підривної діяльності з боку США."
 JAM_News.22.a: "Коштовність стікає червоною кров'ю."

 JAM_News.23.t: "[Get_newspaper_header]У Ямайці проведено Загальнокарибську народну конференцію"
 JAM_News.23.desc: "Сьогодні ліві представники з усієї Вест-Індії зібралися в Кінґстоні, щоб взяти участь у першій Загальнокарибській народній конференції.\n\nНа запрошення ямайського лідера Вільяма Страчена багато соціалістичних і навіть панафриканських рухів отримали платформу для того, щоб поділитися своїми претензіями та висловити підтримку революційним справам як поблизу, так і в усьому світі.\n\nПісля завершення конференції найчастіше лунали заклики до рішучого припинення актів «британського імперіалізму» в усьому регіоні та спільна надія на тісніші зв'язки співпраці між молодими острівними державами."
 JAM_News.23.a: "Ще один крок до карибської єдності?"

 JAM_News.24.t: "[Get_newspaper_header]У Ямайській Народній Республіці проведено вибори"
 JAM_News.24.desc: "Перехідний прем'єр-міністр Ямайської Народної Республіки Біллі Страчен залишив свою посаду після повної реорганізації уряду. Партію Бустаманте, Ямайську лейбористську партію, було заборонено брати участь у виборах, а її членство розділилося між партіями-наступницями, після чого було сформовано коаліційний уряд між соціал-демократичною Народною національною партією та соціалістичним Рухом народної свободи. Новим прем'єр-міністром було обрано Річарда Гарта, колишнього члена ННП і комуніста.\n\nЯк давній друг Страчена, Гарт дотримується схожих принципів егалітаризму та солідарності робітників — він був одним із небагатьох, кого виключили з ННП у 1950-х роках за його самопроголошені марксистські погляди. Хоча тепер йому доводиться працювати з тією самою партією, яка відкинула його багато років тому, Гарт заявляє, що це «саме те, що потрібно, щоб відбудувати демократію».\n"
 JAM_News.24.a: "Я справді хотів би, щоб Буста досі був тут."
 JAM_News.24.b: "Добре це чи погано, але принаймні це не Буста."

