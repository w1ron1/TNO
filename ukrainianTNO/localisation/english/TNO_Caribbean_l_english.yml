 JAM_News.11.t: "[Get_newspaper_header]Прем'єр-міністр Ямайки гине під час загальнонаціонального блекауту"
 JAM_News.11.desc: "Зіткнувшись із ураганом, загальнонаціональними відключеннями електроенергії через нафтову кризу, чутками про невдалий переворот під час шторму та масовим бандитським насильством, ЯЛП знову зазнала удару через раптову смерть прем'єр-міністра Дональда Сенґстера. Загострення кризи змусило нового прем'єр-міністра Г'ю Ширера виступити з публічним зверненням із закликом до стриманості та примирення між войовничими угрупованнями Ямайки.\n\nІберійський Союз надіслав допомогу острову, підтверджуючи свої відносини попри катастрофу. Президент Бустаманте був помітно відсутній під час кризи, а з'явилися повідомлення про погіршення його здоров'я. Тепер Ширер ризикує втратити ще одну публічну фігуру, яка допомагала підтримувати його уряд, що слабшає."
 JAM_News.11.a: "Як могло стільки всього піти не так за такий короткий час?"

 JAM_News.12.t: "[Get_newspaper_header]Проамериканський переворот на Ямайці під час загальнонаціонального блекауту"
 JAM_News.12.desc: "Зіткнувшись із ураганом, загальнонаціональними відключеннями електроенергії через нафтову кризу, масовим бандитським насильством та раптовою смертю прем'єр-міністра Дональда Сенґстера від серцевого нападу, режим ЯЛП було повалено Ямайською лейбористською партією. Лідер перевороту, впливовий член ЯЛП Едвард Сіґа, у своєму першому публічному зверненні до нації проголосив «нову еру лібералізму, гідності та безпеки».\n\nРегіональні експерти побоюються, що Сіґа буде таким самим авторитарним, як і Бустаманте, з єдиною відмінністю — американською підтримкою замість іберійської. Президент Бустаманте залишається президентом, але перебуває під домашнім арештом і не коментує політичний розпад."
 JAM_News.12.a: "Банан був розрізаний."
 JAM_News.12.b: "У нас там усе так добре складалося..."
 JAM_News.12.c: "У Кінґстоні туман густішає."

