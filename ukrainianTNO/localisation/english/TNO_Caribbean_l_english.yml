 JAM_flavor.68.t: "Cracking Under Pressure"
 JAM_flavor.68.desc: "From: Office of South American Affairs\nMemorandum for the Director\nSubject: Jamaican Trends and Future Operations\n\nThe self-proclaimed Jamaican Popular Republic has moderated its previous radical communist attitudes in the recent past. However, the leadership remains committed to hardline beliefs, and it is believed that the moderate direction is a concession to practicality and avoids foreign and domestic blowback. Prime Minister Richard Hart is believed to hold sincere belief in communism and is unlikely to abandon nationalization efforts or utilizing anti-American rhetoric to buttress domestic support and distract the population from concerns of food scarcity and political repression. Jamaica, under Richard Hart, remains a threat to American-owned property in the Caribbean, and a base of operation for future subversive activity and potential foreign intelligence in the region.\n\nHowever, Hart's political party, the People's Freedom Movement, requires coalition support from the moderate People's National Party under their leader, Michael Manley. The FBI has proposed to provide political support to Manley's PNP in the hopes of fracturing the PNP-PFM coalition, increasing political gridlock and eroding confidence in the PFM and Hart's political leadership. If the PNP can become a more effective and capable political faction, then Hart and the PFM can become discredited in the eyes of the Jamaican people, and they can be returned to a more pro-American alignment.\n\nThe proposal involves simple electioneering support, bankrolling political materials, and helping underwrite the cost of electoral staff and campaign workers. The risk of exposure is minimal, and most options operate well within Jamaican domestic law."
 JAM_flavor.68.a: "Fidelity, Bravery, Integrity."

 JAM_flavor.69.t: "Fire-Treated"
 JAM_flavor.69.desc: ""The PFM have promised us prosperity, and look what they've given us. Hart speaks of the struggle of the workers, but grows rich while we suffer. Half of us fear for our jobs, the other half have nothing to eat but his empty words! Where is the workers' paradise he promised? His red fire has burned us, and the People's National Party is the only path to prosperity and pride!" The stump speech had been making the rounds across the country, attacking the PFM and Hart in particular. In different neighborhoods, the speech was tweaked and crafted to fit the audience, but the thesis was always the same. Hart had ruined Jamaica with his extreme beliefs, and the PNP would do better by breaking off from the coalition and running the country themselves. To any outside observer, it was the natural backlash to Hart's economic failure. Few things could galvanize a people like shared hardship.\n\nOne thing that could was the electioneering support of the American government. Smartly-printed pamphlets and posters filled every PNP office. Talking points and demographic research found their way into the hands of speechwriters and campaign managers. Letters from Jamaican emigres abroad found their way to family members still on the island, urging them to switch their vote and save their home. The fire in the PNP was very real, but it was stoked and fed carefully by hands from Washington DC.\n\nThe largest cracks began to form when Edward Seaga endorsed former members of the Jamaican Labour Party to join the PNP. This groundswell of support gave the PNP the chance to contest the PFM on their own terms. If the PNP left the coalition, it could trigger new elections that the PFM had a very real shot of losing. Hart had projected a strong front, but while the exterior was hardened by fire, the core seemed almost ready to snap under the heat."
 JAM_flavor.69.a: "To break by rendering brittle."

