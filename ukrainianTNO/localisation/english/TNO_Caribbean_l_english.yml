 JAM_flavor.79.t: "Jamaica Requests Bailout"
 JAM_flavor.79.desc: "CONFIDENTIAL\nTO THE MINISTER OF FOREIGN AFFAIRS\n\nJamaica - Caribbean\n\nThe recent collapse of oil prices and the resulting economic crisis it has brought has now been extended to the Caribbean. Recent reports from Kingston indicate that Jamaica has been hit particularly hard by these developments. Bustamante has begun placing pressure on Iberian diplomats in the area, pushing for us to bailout Jamaica and to issue debt forgiveness, in return offering some significant concessions on access to plantations should we accede.\n\nAlthough he has privately presented this as part of relief efforts, the root cause is barely related. Reckless spending means he now risks losing control over the gangs he pays off, and without this relief, they will become far more assertive, threatening his central authority. Without a bailout, we also risk Bustamante turning towards the United States or towards Mexico, likely highlighting the risks of a refugee crisis. Both countries have access to significant oil reserves, as do Guyana and Venezuela, and would be happy to reclaim influence in the area. We would be the inevitable losers in this exchange, as would our companies in the area.\n\nWhether we have the funds to afford such a bailout is questionable, but whether we can afford to lose them is also questionable. It will be difficult to justify sending any foreign aid, both among economists and the general populace, regardless of Jamaica's past ties, and especially when considering current market volatility. However, Jamaica is a valuable local ally; losing them would be significant. The costs are also fairly low, and the benefits of a bailout could greatly boost our international image, especially if the United States turns to austerity."
 JAM_flavor.79.a: "Bail them out, but make sure our companies can fend off these gangsters if necessary."
 JAM_flavor.79.b: "Not another damn peseta!"


