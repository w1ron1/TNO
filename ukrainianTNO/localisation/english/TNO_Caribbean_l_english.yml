 JAM_flavor.50.t: "Та стара танцювальна рутина"
 JAM_flavor.50.desc: "Едварда Сіґу впізнавали під час його поїздок, тож коли йому потрібно було зустрітися з людьми, з якими Менлі не хотів, щоб він зустрічався, доводилося трохи пустити пил в очі. Він відправляв одного зі своїх охоронців у капелюсі та пальті купити щось непомітне — упаковку з шістьма пляшками пива чи якийсь фастфуд, усе, що чоловікові, який так багато працював, могло знадобитися об 11-й вечора, щоб трохи розслабитися. Потім він надягав перуку, підкладав щось під пальто й виїжджав, наче хтось із його працівників вирушав додому на ніч. Трохи заплутати слід — і він уже міг зустрітися зі своїми благодійниками. Останнім часом Менлі дедалі більше нервував, оскільки його становище погіршувалося. Невдовзі Сіґі доведеться докласти більше зусиль до своїх кроків.\n\n«Панове, як поживає містер Шеклі?» — привітав Сіґа трьох агентів FBI із кам'яними обличчями. Останнім часом Шеклі організовував дедалі більше зустрічей, а це віщувало багато чого — як доброго, так і поганого.\n\n«Він у порядку. Але ми тут не для люб'язностей, містере Сіґа. Ми вважаємо, що, можливо, настав час почати готуватися до більш...активної ролі у зміні керівництва».\n\nЯкщо агенти Шеклі були настільки клінічно прямолінійними, це означало, що справа серйозна. Шеклі був досить привітним, але важливість місії завжди стирала його м'якші риси, коли наставала пора щось робити. Це робило його чудовим начальником резидентури, але саме тому директором Бюро він ніколи не стане.\n\n«Звісно. Давайте окреслимо наші варіанти. Попри все, Менлі зберігає підтримку серед своїх відданих кадрів, тож ми повинні пам'ятати, що навіть якщо весь острів його ненавидить, знайдеться чимало людей, готових танцювати під його дудку. Якщо вам подобається пісня, схоже, ви не можете не притупувати ногою»."
 JAM_flavor.50.a: "Уночі FBI розклало перед ним кроки танцю, і Сіґа замислився, чи вистачить їх, щоб утриматися на танцполі."

 JAM_flavor.51.t: "Акули в раю"
 JAM_flavor.51.desc: "Офіс Центрального розвідувального управління, стенограма запису спостереження.\nЗапис зроблено на місці в центрі Джорджтауна, відповідні імена вилучено для нащадків.\n\nВИЛУЧЕНО 1: «-ми не сліпі до того, що відбувається в Кінґстоні».\nСІҐА: (різко) «Хіба?»\nВИЛУЧЕНО 2: «Саме тому ми всі тут, ми можемо розібратися з вами, розібратися з цим».\nВИЛУЧЕНО 1: «Ямайка отримає особливе ставлення: табори гуманітарної допомоги, субсидії на розвиток, торговельні угоди. Жодних гучних оголошень як таких, просто дещо поступово надходитиме».\nСІҐА: (пауза) «А насильство?»\nВИЛУЧЕНО 1: (довша пауза) «Перепрошую?»\nСІҐА: «Насильство в Кінґстоні, повідомлення про рівень злочинності».\nВИЛУЧЕНО 2: «Я-я бачив дещо про це на CNN...»\nСІҐА: (пошепки) «Послухайте, я не невдячний і говорю від імені нашого народу—»\nВИЛУЧЕНО 2: «О-о, ні. Ми розуміємо! Дуже добре».\nСІҐА: «Мені не потрібно нагадувати вам про все, що останнім часом відбувається в Карибах. Санта-Домінґо, Гавана... Кінґстон ще не там, слава Богу, але якщо все стане ще гірше...»\nВИЛУЧЕНО 1: (пауза) «...Розумію».\nВИЛУЧЕНО 2: «Ми можемо обіцяти лише певну міру, побачимо, що зможемо зробити. Сподіваємося, до цього не дійде.»"
 JAM_flavor.51.a: "КІНЕЦЬ ЗАПИСУ"

 JAM_flavor.52.t: "Виявлено кайдани Кінґстонської свободи"
 JAM_flavor.52.desc: "Протягом кількох днів після того, як Ямайська революція по-справжньому розпочалася, офіси Ямайської лейбористської партії перебували у стані невизначеності, зайняті лише кількома членами бригади Чорної зірки, які чекали на накази. Однак після надходження нових наказів цю тишу було порушено. Майже раптово кожну шухляду столу одну за одною спустошували, кожен папірець у кожному кабінеті розривали в пошуках ознак інакомислення, подарунків чи імпорту, складали у стоси й один за одним відправляли геть. Ще один цвях у домовину.\n\nДо ранку Біллі Страчен із приголомшливими викриттями гримів на радіо. Ямайська лейбористська партія, а особливо Александер Бустаманте, охоче пов'язали себе з іберійським урядом, дозволяючи Іберії провозити товари через свої порти в обмін на надбавку до цін на товари, що перебували під ембарго. У повідомленнях, які схвильовано повторювали диктори новин, фашизм втратив свою опору разом із революцією. З Ямайки його нарешті можна було викорінити, знищити та віддати історії.\n\nПротягом дня аеропорт Монтего-Бей розростався від повного до переповненого. Ті небагато громадян Іберії, які ще не встигли виїхати, швидко опинилися оточеними членами Ямайської лейбористської партії, які сподівалися розширити свої місцеві кампанії до доленосних домовленостей у Лісабоні, Мадриді чи Касабланці, до вражаючих підривних дій проти фашизму в Нью-Йорку, Торонто чи будь-де, де їх погодилися б прийняти. Коли небо забарвилося в палаючий помаранчевий, черги ламалися під натиском торгів, а розгубленість зростала. Мало хто отримав би відповіді на свої запитання.\n\nКоли знову настала ніч і ямайський повітряний рух було припинено, почалися арешти. Спочатку це були лише чиновники середньої ланки, конкретно названі дипломатами та шпигунами як ті, хто в певний спосіб допомагав їхній справі. Їхні свідчення дозволили розширити масштаби переслідувань. Наступного дня було складено повний список членів Ямайської лейбористської партії. Більшість відвідали та допитали, багатьох заарештували, звинуватили в реакційній діяльності та засудили до довічного ув'язнення."
 JAM_flavor.52.a: "Одна сторона Атлантики втрачає зв'язок зі своєю іншою половиною."

 JAM_flavor.53.t: "Із далеких берегів"
 JAM_flavor.53.desc: "CONFIDENTIAL/[GetDateText]\n\nВІД ТОМАСА КОБЕЛА\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: СТАН ЯМАЙСЬКОЇ НАРОДНОЇ РЕСПУБЛІКИ ТА ЇЇ ЕМІГРАНТІВ\n\nПісля недавнього повалення уряду ЯНР поступово стабілізує свій режим. Уряд навряд чи розпадеться сам по собі, якщо не буде застосовано втручання. Після приходу нового уряду до влади члени Ямайської лейбористської партії, представники ділової еліти та незадоволені ліберали з ННП втекли до Маямі.\n\nFBI підтримує зв'язок із цими емігрантами, причому член Ямайської лейбористської партії Едвард Сіґа є важливим активом Бюро. Деякі емігранти звернулися до уряду з проханнями та петиціями допомогти їм повернутися на Ямайку шляхом сприяння контрреволюції. Агенти повідомляють про тісне товариство та надзвичайне бажання групи повернутися.\n\nУ разі надання допомоги емігранти могли б спричинити заворушення та допомогти з підривною діяльністю на Ямайці, можливо, навіть призвести до бажаної ними контрреволюції або вторгнення на острів."
 JAM_flavor.53.a: "ВІРНІСТЬ, ХОРОБРІСТЬ, ЧЕСНІСТЬ."

 JAM_flavor.54.t: "Ямайські опозиційні рухи починають організовуватися"
 JAM_flavor.54.desc: "TOP SECRET/[GetDateText]\n\nВІД ТЕОДОРА ШЕКЛІ\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: КООРДИНАЦІЯ АНТИБОЛЬШЕВИЦЬКИХ СИЛ НА ЯМАЙЦІ\n\n1. Група ямайських емігрантів, прихильних до зусиль ЦРУ, прибула на Ямайку останніми днями та змогла скоординувати опозицію режиму Страчена. На острові існує чітко виражена опозиція, але поєднання географії, урядових репресій та особистих чвар значно обмежило її можливості.\n\n2. Наш зв'язок був обмеженим, але стабільним і дає чітке уявлення про ямайську опозицію. Попри послаблення, іберійські контрабандні мережі вижили й досі активно поширюють зброю, хоча вони змагаються за панування з численними місцевими бандами. Деякі колишні прихильники Ямайської лейбористської партії також почали створювати невеликі угруповання, хоча вони ще не стали по-справжньому бойовими.\n\n3. Наявні злочинні мережі не стануть життєздатними партнерами в управлінні, але їхня організація та здатність послаблювати уряд роблять їх потенційними союзниками наразі. Іберія, схоже, повністю залишила країну, що відкриє легкий шлях для ЯЛП до значно більшої прихильності до американського впливу."
 JAM_flavor.54.a: "ВІРНІСТЬ, ХОРОБРІСТЬ, ЧЕСНІСТЬ."

 JAM_flavor.55.t: "Забути минуле й рухатися далі?"
 JAM_flavor.55.desc: "Вінстон нервово крутив ручку свого потертих шкіряного портфеля. Увесь цей тиждень здавався витонченою тортурами. Він почався з принизливого польоту економкласом на звичайному пасажирському літаку, а продовжився сімома днями очікування в безликому вашинґтонському мотелі. Сім днів він і його колеги безперервно обривали телефони, підлещуючись до клерків молодших сенаторів та благаючи про зустрічі з тими самими американськими бізнесменами, чиї активи Народна Республіка так гордо експропріювала.\n\nІ ось важкі дубові двері відчинилися. Вінстон увійшов до кабінету держсекретаря США й мало не захлинувся. Ліворуч від господаря сиділи вони — лідери ямайської емігрантської громади з Маямі, самовдоволено всміхаючись. Для делегації з Кінґстона стільців не передбачили.\n\nДивлячись в очі американському міністру, Вінстон уже уявляв майбутній допит, хвилина за хвилиною. Він точно знав, що буде далі. Сухі, гострі запитання про те, чого вони хочуть, чому Вашинґтон має їм вірити та на які поступки вони готові піти. І йому доведеться, проковтнувши залишки революційної гордості, викласти все: благати про кредити, обіцяти масштабну приватизацію на користь американських корпорацій та присягатися повернути Ямайку до лав ОВН. Він гарячково репетирував у думках найважчу відповідь — момент, коли держсекретар кивне сяючим емігрантам і зажадає їхнього повернення до уряду.\n\nВінстон видихнув і зробив крок уперед. Двері за делегацією зачинилися.\n\nІ зустріч закінчилася..."
 JAM_flavor.55.a: "...безкомпромісним ультиматумом: Америка вимагає повного повернення емігрантів до влади"
 JAM_flavor.55.b: "...цинічною угодою: гроші не пахнуть, і ми готові працювати з новим режимом."

 JAM_flavor.56.t: "Коротка сутичка між ямайськими та канадськими силами"
 JAM_flavor.56.desc: "SECRET/[GetDateText]\n\nВІД ТЕОДОРА ШЕКЛІ\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ПЕРЕСТРІЛКА МІЖ ЧЕРВОНИМИ ЯМАЙСЬКИМИ ОПОЛЧЕНЦЯМИ ТА СИЛАМИ АНГЛО-КАНАДСЬКОЇ ЕВАКУАЦІЇ\n\n1. Канадські спроби евакуювати канадських і британських цивільних зіткнулися з опором бригади Чорної зірки Ямайки, очолюваної революційним лідером Біллі Страченом, а о 03:45 минулої ночі біля Очо-Ріоса сталася перестрілка. Були жертви, але їхня кількість була обмеженою, і, схоже, вони не мали значного впливу на перебіг операції.\n\n2. Морські піхотинці RCMP брали участь в евакуації та дотримувалися запланованого графіка. Перестрілка відбулася переважно між окремими особами, але наші повідомлення з Оттавою вказують, що це, ймовірно, була засідка. Обидві сторони втратили лише окремих солдатів, яких тепер посмертно прославляють, і обидві оголосили про перемогу.\n\n3. Такі події викликають занепокоєння, але наші можливості обмежені. Канадська стратегія цієї евакуації була безрозсудною, але не призвела до шкоди цивільним, і будь-яка критика, ймовірно, викличе різку реакцію Канади. Наші власні зусилля з евакуації персоналу з Ямайки слід прискорити, але жодних інших змін наразі вносити не слід."
 JAM_flavor.56.a: "Винести осуд Ямайській Народній Республіці. Зараз ми більше нічого не можемо зробити."

 JAM_flavor.57.t: "Твердий курс Страчена"
 JAM_flavor.57.desc: "Сигаретний дим ліниво плив до стелі. Маркус, функціонер Народної національної партії, дивився на канадського інвестора, який сидів навпроти. Чоловік сипав прокльонами та погрозами, але Маркус терпляче чекав на паузу.\n\n«Послухайте, містере Девіс. Ми пропонуємо викупити сімдесят п'ять відсотків акцій вашої вольфрамової копальні за, скажімо, державними розцінками», — Маркус переплів пальці. «Держава перебирає на себе все управління, логістику та відносини з профспілкою. Ви абсолютно нічого не робите й просто отримуєте дивіденди від решти акцій».\n\nКанадець почервонів, назвавши це узаконеним пограбуванням. Після напружених, але передбачуваних переговорів вони зійшлися на п'ятдесяти п'яти відсотках на користь Кінґстона. Маркус ледве приховав усмішку: саме ця цифра була початковим планом партії через банальну нестачу коштів для повного викупу. Як гарантію на стіл поклали копію свіжого урядового указу — офіційного наказу Страчена про призупинення примусової націоналізації. Зваживши ризики, канадець зрозумів: краще отримувати пасивний дохід і зберегти можливість продати решту пізніше, ніж втратити все прямо зараз. Він коротко кивнув, нашкрябав свій підпис і вийшов із кімнати.\n\nЗалишившись сам, Маркус із полегшенням зітхнув і повернув ручку радіоприймача. Так, мешканці Білого дому все ще не довіряли Страчену й вважали їх радикалами, але тепер мало кого це хвилювало. Економіка уникнула краху, а чутки про неминучу контрреволюцію розвіялися. Раптом із динаміка залунав урочистий голос диктора: Революційний комітет офіційно відмовлявся від своїх надзвичайних повноважень. Країна готувалася до перших вільних виборів в історії нової Ямайки."
 JAM_flavor.57.a: "Навести лад у домі — не означає спалити його."

