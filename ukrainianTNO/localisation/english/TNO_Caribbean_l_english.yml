 #Saint Vincent
 SVI_Robert_Milton_Cato: "Роберт Мілтон Като"
 SVI_Ebenezer_Joshua: "Ебенезер Джошуа"
 POLITICS_SVI_EBENEZER_JOSHUA_DESC: "Підвітряні острови навряд чи бачили такого борця, як Ебенезер Джошуа. Народжений на Сент-Люсії, першим смаком політики для нього стали проповіді старого Базза Батлера на Тринідаді, тодішньому епіцентрі радикального робітничого руху, якому Джошуа згодом присвятив своє життя. Будучи активістом Профспілки нафтовиків у роки війни, він засвоїв уроки, які після повернення у 1950 році перетворили його на лідера радикалів Сент-Люсії.\n\nВони вирвали право на профспілкову організацію та політичні права з білих рук колоніальної адміністрації та разом із його дружиною Айві, дотепною політикинею й агітаторкою, створили Восьму армію визволення, щоб принести зміни на острів. Вони також очолили страйковий рух Об'єднаної федерації промислових профспілок, об'єднавши сільськогосподарських і суднобудівних робітників проти колоніального ярма.\n\nСьогодні Джошуа та його дружина Айві, така ж дотепна політикиня, із занепокоєнням спостерігають за піднесенням реакційної плантократії на Сент-Люсії, яку підтримують іноземні імперіалісти. Якщо його дедалі частіші розмови з полум'яним Еріком Вільямсом про політичний союз із Тринідадом щось означають, Ебенезер Джошуа може повернутися до своїх днів політичної боротьби на островах, адже він бачить лише один спосіб захистити незалежність своєї батьківщини та здобутки робітничих класів: об'єднання Карибів."

 #Barbados
 BRB_Errol_Barrow: "Еррол Барроу"
 BRB_Hugh_Springer: "Г'ю Спрінґер"
 POLITICS_BRB_HUGH_SPRINGER_DESC: "Народжений у Сент-Майклі в 1913 році, Спрінґер завжди дивився за межі свого острова. Отримавши стипендію для навчання в Оксфорді, він готувався стати викладачем грецької мови, але расизм і Друга світова війна забезпечили його повернення на Барбадос. Повернувшись, у 1938 році він отримав право на адвокатську практику та працював юристом, перш ніж разом із Ґрантлі Адамсом заснувати Прогресивну лігу, який сам невдовзі мав стати виборчим титаном.\n\nЗосередивши свою увагу на Профспілці робітників Барбадосу, що виникла з Прогресивної ліги, він спрямував націоналізм у державне русло, коли Барбадоська лейбористська партія сформувала уряд у 1946 році. Хоча у 1962 році він пішов у відставку, щоб допомогти керувати університетом, він залишався ключовою фігурою — як завдяки своєму союзу з політичним гігантом, що визначав політику Барбадосу, так і завдяки своїй ролі в нещасливій Федерації Вест-Індії. Після її краху він посумував, перш ніж знову звернути увагу на внутрішні справи, саме тоді, коли Адамс нарешті втомився від свого перебування при владі.\n\nТепер Спрінґер стоїть сам. Спрінґер бачить цінність у збереженні Барбадосу як сильного, ліберального, шовіністичного американського союзника в регіоні, але це не межа його амбіцій. Деякі критики бачать у ньому лише тимчасову заміну, дещо молодше обличчя на посаді, яке має протриматися там, доки син Ґрантлі не стане достатньо дорослим для участі у виборах, але Спрінґер це відкидає. Завдяки своїм закликам до тіснішої карибської співпраці він сподівається побачити Бриджтаун не каналом, а гаванню, до якої повернуться заблукалі кораблі Карибів."
 BRB_Grantley_Hebert_Adams: "Ґрантлі Герберт Адамс"
 BRB_Tom_Adams: "Том Адамс"
 POLITICS_BRB_TOM_ADAMS_DESC: "Тома Адамса, прем'єр-міністра, можна було б пробачити за те, що він просто намагається вийти з тіні свого батька. І справді, значну частину свого виховання він провів як політичний протеже батька, з підліткового віку формуючись для того, щоб успадкувати його роль головного ліберального борця Барбадосу.\n\nЧерез нещасливий результат Другої світової війни молодому Тому Адамсу було відмовлено в тому самому оксфордському навчанні, яке свого часу отримав його батько, тож освіту він здобував тут, на Барбадосі, у значно скромнішому Гаррісон-коледжі. Це, однак, не завадило йому отримати ґрунтовну академічну підготовку з філософії та історії.\n\nЗвідти він вирушив будувати кар'єру юриста у Сполучених Штатах, і з роками дедалі більше захоплювався американськими інституціями, а найбільше — прагненням повернути ці цінності додому.\n\nПопри провал Конституційного конгресу Вест-Індії, новообраний прем'єр-міністр залишається відданим гармонійній співпраці архіпелагу, водночас дедалі ближче підводячи його до навислої американської тіні.\n\nДля його прихильників — трохи тактовного прогресу та обережних реформ на загалом дуже консервативному політичному полі. Для його критиків — його голос, на жаль, лише лунатиме волею дядечка Сема."
 POLITICS_WIN_TOM_ADAMS_DESC: "Тома Адамса, прем'єр-міністра, можна було б пробачити за те, що він просто намагається вийти з тіні свого батька. І справді, значну частину свого виховання він провів як політичний протеже батька, з підліткового віку формуючись для того, щоб успадкувати його роль головного ліберального борця Барбадосу. Із заснуванням Федерації Вест-Індії молодий спадкоємець опинився перед відповідно більшою парою черевиків, які, можливо, надто завзято прагне довести, що готовий наповнити.\n\nУспішний юрист, який закохався у Сполучені Штати, де минула вся його кар'єра, він повернувся із серцем, сповненим обіцянок процвітаючого майбутнього для своєї батьківщини, якщо лише вона ступатиме шляхом свого західного гегемона. Тепер, намагаючись утвердитися як самостійна людина у величезній порожнечі, залишеній його старшим, Том Адамс усе ж знаходить союзників серед тих, хто підтримує його платформу економічного laissez-faire, масштабних програм приватизації, виважених соціальних реформ і подальшої орієнтації на американську сферу.\n\nІ понад усе — у твердій рішучості зберегти спадщину свого батька перед обличчям руйнівної нестабільності, тривалої шкоди від нафтової кризи, а також усіляких комуністів та інших радикальних демагогів, які загрожують розірвати все це на шматки."

