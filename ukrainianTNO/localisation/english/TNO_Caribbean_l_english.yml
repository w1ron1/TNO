 JAM_flavor.36.t: "Ямайський провокатор виступає в Гарлемі"
 JAM_flavor.36.desc: "Америка й далі поблажливо ставиться до комуністів із Вест-Індії\n\nАдам МакКрей, культурний кореспондент, National Review\n\nЩо б не стверджував цей уряд, очевидно, що [USA.GetLeader] насправді не переймається боротьбою з екстремізмом. Ніщо не демонструє цього краще, ніж їхній дозвіл Бобу Марлі виступати тут із піснями. У Вест-Індії Боб Марлі вже став загальновідомим, як і його гурт. Вони грають у новому жанрі музики, що називається «реґі», стилі, який вирізняється значно повільнішим темпом і значною опорою на барабани та бас-гітари як основу мелодії.\n\nБоб Марлі почав активно виступати у 1963 році та випустив низку альбомів зі своїм гуртом The Wailers, але сьогодні в барі Гарлема звучала саме його сольна творчість, а його сингли досягли рекордних показників. У 1966 році він перейшов від католицизму до растафаріанства, маргінального культу, який вірить, що колишній король Ефіопії є другим пришестям, а Бог існує в кожному.\n\nБудь-яка біографія має враховувати його маргінальні погляди. Відданий комуніст, він відкрито підтримує такі групи, як Африканський національний конґрес, і рішуче засуджує боротьбу Південної Африки з їхнім екстремізмом. Він також атакував Сполучені Штати, назвавши їх «такими ж імперіалістичними, як Німеччина та Японія», а також відкрито курить траву для «медитації».\n\nТаких людей по всій країні обожнюють хіпі та курці трави, і він став для цих нероб своєрідною фігурою, але, треба визнати, певний музичний талант у нього є. Якщо ви все ще хочете слухати цю нову хвилю, що розпалює хіпі по всій країні, Боб Марлі знову виступатиме в Гарлемі у вівторок, а протягом наступних двох тижнів виступить у барах Чикаґо, Бостона, Лос-Анджелеса та Монреаля."
 JAM_flavor.36.a: "Тільки дивіться, щоб не переступити через безхатченків під кайфом від його творчості."

