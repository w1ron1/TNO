 JAM_flavor.16A.t: "Back In Black"
 JAM_flavor.16A.desc: "Edward Seaga sat in his office and dialed the 787 number, a military base in San Juan. The heat was unbearable for him, his fan on and windows open as he was waiting for his AC to be fixed. He could hear faint gunshots from outside. Jamaica was teetering on the edge of oblivion. "Hello? Colonel Hart? It's Mr. Seaga," he said into the phone.\n\nHe heard a throat clearing before the colonel responded, "Mr. Seaga, how are you? We're surprised to be hearing from you-" Edward cut in, "Because of the black out? The government buildings have emergency generators and the like." He looked out the window and saw a sea of black. The lights from Kingston's buildings were gone, now replaced with barrels on fire and screams in the dark.\n\n"Anyways, I've called to tell you that the rumors about Donald Sangster are true. He's died of a stroke a few hours ago. Bustamante can't be contacted by anyone either. No one wants to lead Jamaica it seems."\n\n"He-he's dead? Oh shit, I've got to put you on hold for a second-" The colonel was cut off by Seaga."
 JAM_flavor.16A.a: ""Don't worry, I'll be taking the reins back soon.""
 JAM_flavor.16B.t: "In the Spotlight"
 JAM_flavor.16B.desc: "Luis González-Mata hurried through Kingston, trying to keep low. Upon piles of rubble men shot and stabbed each other, lit only by fire from barrels. People ran out into the streets to break open fire hydrants, getting relief from the summer's harsh heat. It seemed as if the whole of Jamaica broke when Donald Sangster died.\n\nBustamante was himself gone, maybe dead, maybe hiding. When the black outs happened he disappeared. Luis was going to Hugh Shearer. If there was anyone who could bring back some stability it would be him, or at least Luis hoped he could.\n\nLuis thought himself better than the average person, scuttling through the darkness terrified, staying holed up in their apartments. He was a smart man, one who lived a life of daring adventures in other countries. Now he was no better than the people of Jamaica he thought were fools, with all their hopes pooled in one man."
 JAM_flavor.16B.a: "Luis exited to the right."
 JAM_flavor_16_tt: "The results of our efforts in §&Jamaica§! will be revealed soon." #To any better writer than me, feel free to improve my lines

