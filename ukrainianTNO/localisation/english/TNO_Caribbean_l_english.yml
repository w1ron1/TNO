 JAM_flavor.38.t: "Двосічний меч"
 JAM_flavor.38.desc: "Порівняно з вулицями Кінґстона американське посольство було напрочуд вишуканим. Шкода, думав Майкл Менлі, що цей розвиток не поширювався набагато далі. Він знав, що переговори з американським послом про полегшення боргового тягаря та економічну допомогу супроводжуватимуться неявними вимогами, але сподівався хоча б схилити їх до терпіння. На нього такого прийому не чекало.\n\n«У нас багато грошей, Майкле», — відповів посол, перебивши простягнуту руку, — «але ми не будемо просто затикати дірки в економічному банкруті».\n\nМайкл Менлі знав, що має прозвучати далі, але відкинув свої побоювання. «Дайте нам кілька років, і я знаю, що ми перевершимо ваші очікування».\n\n«Сподіваюся, твій оптимізм має підстави». Посол підняв руку, показавши знак V. «Ми не будемо вести переговори щодо жодного з цих питань. Ми хочемо повної демократизації, і очікуємо, що ви зміните курс щодо своєї ворожості до американського бізнесу».\nЗупинившись на мить, Майкл Менлі спробував вирішити проблему. «Я заарештував відповідальних за найгірші зловживання, і гарантую, що незабаро—»\n\n«Я не дурний, Майку». Піднявши палець, він припинив дискусію. «Можеш скільки завгодно мені лестити, але американський бізнес уже давно дратується через те, як ти націоналізуєш економіку своєї країни». Помахом руки він дістав сигару. «Скасуй свої нещодавні націоналізації, інакше тобі доведеться керувати своїми плантаціями без копійки».\n\nМайкл Менлі похитав головою, обдумуючи подальший шлях. Відмова від суверенітету Ямайки над її економікою була згубною, але посол мав рацію. Ямайка надто відчайдушно потребувала допомоги. І тому, соваючись у своєму пофарбованому в червоне кріслі, він поступився своїм часом, щоб зберегти свої амбіції."
 JAM_flavor.38.a: "Король видає прокламацію зі свого замку."

