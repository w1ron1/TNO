 Caribbean_flavor.238.a: ""

 Caribbean_flavor.239.t: "The Hawk Of Bridgetown"
 Caribbean_flavor.239.desc: "Eileen R. Donovan stood poised beneath the glittering chandeliers of Bridgetown's Grand Assembly Hall, her expression unreadable but her presence unmistakable. She had attended dozens of ceremonies like this, but few carried the weight of tonight's: the formal unveiling of the Caribbean Shield, a mutual defense pact among WICU members.\n\nThe young girl from Boston, once an attaché trudging through the frostbitten chaos of the Siberian intervention, Eileen had clawed her way into the upper echelons of the foreign service; one of the few women to do so, and fewer still with her reputation. She was hawkish and unrelenting, living proof that a woman could easily fill a man's shoes.\n\nAs Prime Minister Tom Adams concluded his address, an eloquent appeal to unity and vigilance, Eileen moved swiftly through the crowd of diplomats. Her handshake was firm, her congratulations sincere. She leaned in just enough to make her point clear: "America stands with Barbados. And with you."\n\nThe Caribbean was changing, and not for the better. Eileen knew that behind the smiles and speeches, the region was bracing for something darker.\n\n"
 Caribbean_flavor.239.a: "And she was on the front lines."

 Caribbean_flavor.240.t: "America's Sixth Great Lake"
 Caribbean_flavor.240.desc: "Once a young girl from Boston, Eileen R. Donovan stood poised beneath the glittering chandeliers of Bridgetown's Grand Assembly Hall, a stark contrast to her time as an attaché trudging through the frostbitten chaos of the Siberian intervention. Her expression was unreadable but her presence unmistakable.\n\nEileen had clawed her way through the foreign service, becoming one of the few women to hold the title of ambassador. She was extremely hawkish and unrelenting, a worldview formed from her time in Siberia.\n\nShe had attended dozens of ceremonies like this, but few carried the weight of tonight's: the formal expansion of the WICU to include greater political integration, signalling the start of a supranational federation.\n\nAs Prime Minister Tom Adams concluded his address, a direct appeal to unity and integration among Caribbean nations, Eileen moved swiftly through the crowd of diplomats. Her handshake was firm, her congratulations sincere. She leaned in just enough to make her point clear: "Us Americans are pleased to hear Barbados is keeping American interests in mind."\n\nAdams firmly shook back basking in the Americans' approval, Eileen mentally noted the Adams glee while continuing to stalk the room monitoring fellow diplomats, keeping track of which were shaking hands, shouting praise and which weren't.\n\nAs the meeting wrapped up Eileen was confident in her exams of other diplomats, and making sure that the Caribbean was being guided slowly towards becoming America's lake. Whether they liked it or not.\n\n"
 Caribbean_flavor.240.a: "As it is meant to be."

 ### Caribbean News Events
 #Remember, all News Events must have the header in their title loc piece
 #Also remember to add matching event options to the event itself in the TNO_Caribbean event file
 Caribbean_News.1.t: "[Get_newspaper_header]Chaos Grips the British West Indies"
 Caribbean_News.1.desc: "Protests have erupted across the West Indies in the wake of the Caribbean Legion's invasion of the Dominican Republic, with strikes across banana plantations on the Windward Islands, public demonstrations against Jamaica's incumbent Bustamante administration and efforts to blockade the gates of Chaguaramus Military Base in Trinidad escalating into a collated outbreak of rioting across many of the islands' urban areas.\n\nAuthorities struggled to control the outbreak of disorder amidst chants calling for fundamental reform, greater prosperity and the end to unequal governorship. Looting and vandalism were also widely reported with jails reportedly full of the apprehended. While local administrations have been quick to characterise the riots simply as examples of criminal opportunism, even the most loyalist publications in the region have admitted that they display that true reform must be pursued, lest those pushing the mob get their way.\n"
 Caribbean_News.1.a: "The Caribbean buckles for a storm..."

 Caribbean_News.2.t: "[Get_newspaper_header]Anguilla Secedes from the Leeward Islands"
 Caribbean_News.2.desc: "The continuous headwinds roiling the West Indies have reached the seemingly quiet island of Anguilla. Reports indicate that the local house of assembly, disappointed by what they claim is the "continuous obstruction" of their rights and development by the government of the Federal Colony of the Leeward Islands in St. John's, has voted to secede from the federation and expelled representatives of the central government, claiming to now only answer to the Canadian government directly.\n\nFollowing the vote, the provisional chief minister, Ronald Webster, has presented a petition to the government of Canada, calling on Ottawa to "bring back order" in the island in order to "enable its stable development," circumventing the middlemen in St. John's and placing the island under direct Canadian rule. No response had arrived from the Canadian authorities as of yet, and many observers believe that they will exercise care before rearranging the status quo in the Caribbean once again.\n\n"
 Caribbean_News.2.a: "If it's the will of the people..."
 Caribbean_News.2.b: "Even in its own backyard, the OFN falters."
 Caribbean_News.2.c: "The distinct ring of opportunity..."
 Caribbean_News.2.d: "The Commonwealth will endure."

 Caribbean_News.3.t: "[Get_newspaper_header]Anguillan Autonomy Recognized"
 Caribbean_News.3.desc: "The secessionist uprising in Anguilla has ended today, with Ottawa surprisingly conceding to the demands of local leaders for direct control from their former overlords in the Leeward Islands, guaranteeing the island's autonomy.\n\nWhile the decision has been received positively within the Caribbean and Americas as a whole, the shadow of instability yet hangs over the Commonwealth with rumors of American pressure being the leading factor behind the decision, thus eroding the public confidence in the Ottawa's sovereignty in its custodian role.\n\nWhile the validty of the rumors cannot be confirmed, this outcome suggests the hopes for reforms. Concerns of a potential collapse of the established post-war order in the West Indies grow as the region slowly crumbles under the pressure of vying hegemonies.\n"
 Caribbean_News.3.a: "The best outcome we could have hoped for."
 Caribbean_News.3.b: "Try as they might, they can't paint over the cracks."
 Caribbean_News.3.c: "The Rogue Commonwealth blinked first."

 Caribbean_News.4.t: "[Get_newspaper_header]End of the Anguillian Secession"
 Caribbean_News.4.desc: "When the government of the island of Anguilla seceded from the Federal Colony of the Leeward Islands and called on Ottawa to implement direct rule over the island, many believed that the Canadian government would be hard-pressed to refuse the demand, made as it was as a representation of the popular will. However, those beliefs have now been decisively dashed, with a Canadian spokesperson denouncing the rebels and announcing its support for the Leeward Federation's sovereignty.\n\nLacking support from Canada, Anguillian Chief Minister David Webster has reluctantly announced that the island would be willing to return to the Federation, requesting an amnesty for the rebels and respect for local autonomy. While St. John's can breath a sigh of relief for now, the uprising has startled many in the region, raising fears of the conflict becoming a sore spot for years to come.\n"
 Caribbean_News.4.a: "The order in the Caribbean must hold."
 Caribbean_News.4.b: "A disaster defused, or merely delayed?"
 Caribbean_News.4.c: "The Anglo's cries of "self-determination" truly are hollow..."

 Caribbean_News.5.t: "[Get_newspaper_header]The Anguillian Farce"
 Caribbean_News.5.desc: "After the island of Anguilla voted to secede from the Leeward Federation and called on Canada to run its affairs, many believed that Canada's decision would make or break the secessionist movement. However, Canada's call for Anguilla to rejoin the Leeward Federation has caused immense fury in the island, with chief minister David Webster claiming that the "loyal sons of the empire have been betrayed by the very crown they have faithfully served".\n\nWith Anguilla now opting to declare a fully independent republic, Canada has mobilized its forces to invade the island and end the rebellion. While Ottawa claims that this course of action is necessary to prevent the West Indies from spiralling into chaos, the Canadian public and international opinion do not seem convinced that the tiny island is worth invading, and protests have already begun to rock Canada's cities.\n"
 Caribbean_News.5.a: "The tiniest of islands can make the most volatile of powderkegs..."
 Caribbean_News.5.b: "The squandered, stolen pearls of an Empire's lesser half."
 Caribbean_News.5.c: "Anglo imperialism shows its weakness."

 Caribbean_News.6.t: "[Get_newspaper_header]Plans for a West Indies Federation Formalized"
 Caribbean_News.6.desc: "Barbados's picturesque Crane Resort serves as a backdrop for a turning point in the history of the British West Indies. The delegates of the Crane Conference have decided to form a federation among the Caribbean islands left under Canada's purview, with only the Bahamas being left behind. The concept, based on proposals written by the US-dominated West Indies Commission will create a highly decentralized federation of islands, with substantial Canadian oversight, but one that is nonetheless independent.\n\nWith a date set for constitutional convention, optimism is high amongst both the governments of the OFN and the people of the West Indies. Any skeptics concerned about the continued economic dominance of the region or an exploitable power vacuum have been drowned out by excitement about potential independence."
 Caribbean_News.6.a: "Freedom is long overdue."
 Caribbean_News.6.b: "Too far, too fast."
 Caribbean_News.6.c: "Let's see how far they get."

 Caribbean_News.7.t: "[Get_newspaper_header]Anti-Government Protests in Kingston, Jamaica"
 Caribbean_News.7.desc: "Rioting has erupted in Kingston after security forces violently dispersed protestors calling for an election ahead of the West Indies Federation constitutional convention, killing activist Henry Gunter. Long-serving Premier Alexander Bustamante is believed to have authorized police and armed members of his Jamaican Labour Party to perform the attack, and now warns that he will show no mercy to those threatening Jamaica.\n\nMichael Manley of the opposition People's National Party has demanded that Bustamante step down, while some Canadian officials have called the harsh tact regrettable but justified, citing the presence of Black Star Brigade communists among the protestors. Given its central role in the planned Federation, confrontations in Kingston's streets may decide not only Jamaica's future, but that of the entire West Indies.\n"
 Caribbean_News.7.a: "Bustamante could have just held the damn election - now he has to go." #US
 Caribbean_News.7.b: "We'll see if Bustamante has what it takes to be a Jamaican Caudillo." #Iberia
 Caribbean_News.7.c: "Between the despot and the Black Star Brigade... national revolution is the only way forward." #Mexico
 Caribbean_News.7.d: "Kingston's monarch stares down a revolution." #Other
 
 Caribbean_News.8.t: "[Get_newspaper_header]Massacre in Kingston, Martial Law Declared"
 Caribbean_News.8.desc: "The riots in Kingston, Jamaica, against Premier Bustamante have come to a bloody end after Bustamante ordered police to fire on protesters. An estimated 126 protesters have been killed by police during a violent protest in the Tivoli Gardens neighborhood of capital.\n\nFollowing this, Bustamante declared a state of emergency and announced the banning of all opposition parties. The OAS has issued a condemnation of the action and the US moved to pause development aid to the beleaguered island. The isolated Premier now turns to its previously covert allies in the Iberian Union as a last line of support. Experts speculate that Jamaica will shortly declare independence, allowing Bustamante to cement his power through a new constitution. The Kingston crisis appears to be the nail in the coffin of US efforts to forge a West Indies Federation of the British Caribbean colonies.\n"
 Caribbean_News.8.a: "From one master to another."
 Caribbean_News.8.b: "Another domino falls..."
 Caribbean_News.8.c: "An asset or liability?"
 
 Caribbean_News.9.t: "[Get_newspaper_header]Black Star Raised Over Kingston"
 Caribbean_News.9.desc: "The riots in Jamaica have ended in of the most unexpected ways, with the Black Star Brigade taking power in Jamaica. The BSB is a communist black nationalist wing on the fringes of the Caribbean Legion. They've managed to take control of Jamaica after fighting against a failed self-coup by Bustamante.\n\nThe leader of the BSB, Billy Strachen, served in the Royal Air Force during World War 2, before serving in the Caribbean Legion and becoming politically active in Jamaica. He's invited Michael Manley and his social-democraticPNP to join his new government, but the moderates have already been outflanked by the left..\n\nThe new government finds itself in a precarious position, with little to no allies and few neighbors sharing a similar ideology. Many expect the country to collapse in the coming times.\n"
 Caribbean_News.9.a: "Who are these guys?!"
 Caribbean_News.9.b: "A welcome surprise."

 Caribbean_News.10.t: "[Get_newspaper_header]Jamaica Abolishes Monarchy, Declares Full independence from Britain"
 Caribbean_News.10.desc: "After months of protests, both violent and vocal, and a referendum overwhelmingly in support of abolishing the British monarchy, Jamaica has finally declared independence with the appointment of her first elected Prime Minister, Michael Manley, the leader of the PNP. Coming into power with the promise of rebuilding the country after the long revolution, Manley is a Fabian socialist with a focus on equity in economic development while maintaining a cordial foreign policy.\n\nAlthough Manley had expressed distrust against American hegemony in the Caribbean, he chose to maintain all current ties while gradually realigning with Mexico, who had provided support to the PNP during the electoral campaign. Although Bustamante's JLP still exists after his loss, its dominant position has been permanently tarnished and will likely never recover."
 Caribbean_News.10.a: "The old order shudders."
 Caribbean_News.10.b: "We can work with this...maybe."
 Caribbean_News.10.c: "A free Jamaica for everyone."

 Caribbean_News.11.t: "[Get_newspaper_header]Bustamante Resigns, Kingston Riots Peeter Out"
 Caribbean_News.11.desc: "The months of violence shaking the heart of Jamaica seem to have finally come to an end today as Premier Bustamante has officially resigned, leaving his protégé, Donald Sangster, in his place. Sangster is a longtime stalwart of Bustamante's JLP, but has already promised gradual reforms and opened negotiations with the rioters.\n\nThe USA has sent a congratulation to Sangster, who in turn has committed to attending the West Indies Constitutional Convention. It seems that the plans for a West Indies Federation are close to fruition.\n"
 Caribbean_News.11.a: "Has anything really changed?"
 Caribbean_News.11.b: "Democracy prevails!"

 Caribbean_News.12.t: "[Get_newspaper_header]Caribbean Autumn"
 Caribbean_News.12.desc: "The dream of a West Indies Federation seems to have died after a constitutional convention for the proposed country devolved into arguments and bickering between the Caribbean nations. This has all happened as the region's lack of a major economy hangs in the shadows of the future.\n\nThis instability came after Jamaica, the lynchpin of the proposed federation, bowed out of the convention following riots against Bustamante. American and Canadian officials couldn't be reached for comment, but one can assume they are disappointed in the development. The future of the Caribbean appears to be one of independence, and disunity."
 Caribbean_News.12.a: "Another Wilsonian idea fails."
 Caribbean_News.12.b: "Can't they just work together for once?"
 Caribbean_News.12.c: "Who would try to unite so many different peoples?"
 Caribbean_News.12.d: "Jamaica, like David, defeats the Goliath of colonialism."

 Caribbean_News.13.t: "[Get_newspaper_header]Establishment of West Indies Federation"
 Caribbean_News.13.desc: "The impossible has been made possible today with the formation of the West Indies Federation. Due to the instability in the region following the Kingston riots, it was thought unlikely that stability or compromise would return to the region any time soon - it was only through what was practically a diplomatic miracle that an agreement could be reached.\n\nUniting most of Britain's various colonies in the West Indies underneath a singular federal government overseen by the British monarchy, the WIF grants the natives the most self-governance they have had since colonization. To celebrate, Queen Elizabeth officiated a grand ceremony held in Bridgetown, Barbados, the country's new capital, passing the baton of independence to the people of the Caribbean.\n\nThe WIF's existence is a tremendous victory for the Americans in the Atlantic. However, owing to the greater powers the British are able to leverage in governance, they are bound to clash with the natives at some point.\n"
 Caribbean_News.13.a: "The little islands that could."
 Caribbean_News.13.b: "That's one chapter closed, at least."

 Caribbean_News.14.t: "[Get_newspaper_header]West Indies Federation Bailed Out by US and Canada"
 Caribbean_News.14.desc: "With the world still reeling from the Oil Crisis, the mounting global instability has hit the West Indies along the Caribbean. As a measure to prevent the West Indies Federation fallling into bankruptcy, the United States of America and the Commonwealth of Canada have issued a bailout for the government in Bridgetown.\n\nAs a result, the Canadian government has gained an outsized degree of control over the government in the West Indies, using their leverage to unilaterally sell off large parcels of land to the OFN for the construction of military installations across the islands. The left-leaning opposition Federal Labour Party, backed up by leading figures Michael Manley and Eric Williams, have castigated the joint American-Canadian measure as an act of neo-imperialism just as widespread discontent over the decision has now spread across the Caribbean, likely to cause issues in the future.\n"
 Caribbean_News.14.a: "A history of maligned peoples and exploitative foreigners are mirrored through the fires and smoke."
 Caribbean_News.14.b: "A necessity in the face of adversity."

 Caribbean_News.15.t: "[Get_newspaper_header]Black Power Revolt Defeated by West Indies Regiment"
 Caribbean_News.15.desc: "The streets of Tobago are once again silent as the West Indies Federation declares victory over the Black Power revolt. Born from an outburst of anti-American sentiment and a desire to be separate from the rest of the WIF, the self-styled Maroon People's Republic has been re-subsumed into the WIF - but at a cost.\n\nDue to the Federation's military being relatively new and disorganised, the WIF operation quickly degraded into a costly, bloody affair for both sides. Hostages, civilians, and POWs alike were killed due to the disorganisation of the operation, leaving Tobago a ruined wasteland in its wake. With both the strength and reputation of the WIF tanked, it is unlikely that stability will return to the region for a long time."
 Caribbean_News.15.a: "All that bloodshed, and for what?"

 Caribbean_News.16.t: "[Get_newspaper_header]Black Power Revolt Crushed By U.S. Intervention"
 Caribbean_News.16.desc: "Hopes for an independent Tobago have been dashed today, as a United States military intervention has moved in on the island, crushing the revolutionaries and freeing the hostages. Coming into existence following an outburst of anti-American sentiment on the island, the self-styled Maroon Socialist Republic was defeated by a force of American marines, bringing them back into the West Indies Federation.\n\nAlthough the crisis has been resolved, doubts still linger internationally as to both why and how the situation within the WIF deteriorated to the point that it did, with questions being levied especially on both the Canadian and American governments as to their involvement in the whole affair from the beginning. In addition, the crushing of the Republic has sparked a wave of anti-black counter-protests against black civil rights activists across the Americas. Whatever the result, it is unlikely that the WIF's reputation will recover from this any time soon.\n"
 Caribbean_News.16.a: "The red star has been snuffed out."
 Caribbean_News.16.b: "Let not one chain break, lest the rest follow suit."

 Caribbean_News.17.t: "[Get_newspaper_header]Trinidad and Tobago Secedes From West Indies Federation Amidst Bankruptcy Crisis"
 Caribbean_News.17.desc: "In response to political pressure from the United States of America to enforce major economic and political reforms along the Caribbean, the government of Eric Williams in Port of Spain has formally announced the secession of Trinidad and Tobago from the West Indies Federation.\n\nInitially, the American response in the West Indies was meant to render them financially solvent for a bailout as a countermeasure to the fallout from the Oil Crisis. Now, despite the previous failures of the Trinidadian government reform agenda, the known firebrand Williams has used the American interference as pretense for the controversial play for independence. The consequences for this are likely to be severe, as Trinidad and Tobago made up a significant portion of the West Indies political and economic body, with their departure now placing the future of the federation in jeopardy.\n"
 Caribbean_News.17.a: "Once just another idyllic island paradise, now the epicenter of a transformative moment in Caribbean history."

 Caribbean_News.18.t: "[Get_newspaper_header]West Indies Bankruptcy Crisis Resolved, Reforms Announced"
 Caribbean_News.18.desc: "Eventful news arriving from the Caribbean in the wake of the Oil Crisis and the events that followed, a bailout from the United States of America for the flatlining economy of the West Indies Federation. The prices of the US' economic intervention has proven steep however, as the price of getting the Federation's economy back on track has been the institution of sweeping political and economic reforms.\n\nIn addition to the slashing of both trade barriers and bureaucratic red tape, it includes the rewriting of the Federal constitution to centralize power in the fashion of the American executive branch. The reforms furthermore stipulate that each of the individual islands, from Barbados to Jamaica to Trinidad and Tobago, to get their finances in order following the Oil Crisis. While there is a noticeable fear and uncertainty about the future, there comes with it a measure of relief and cautious hope for the future.\n"
 Caribbean_News.18.a: "We have to take what solace where we can, even in paradise."

 Caribbean_News.19.t: "[Get_newspaper_header]West Indies Federation Adopts Williams Plan"
 Caribbean_News.19.desc: "The West Indies Federation has accepted Eric Williams' demands, averting a potential dissolution. Already thrown into economic turmoil as the Oil Crisis has brought the Federation to the brink of bankruptcy, controversial proposals from Thomas Sowell for market liberalization were met with direct threats to secede from Eric Williams, the Governor of Trinidad and Tobago, itself a key producer of oil, and an alternate economic proposal backed by the United States and Canada.\n\nAs a result, the West Indies Federation will now pursue a developmentalist model, focusing on infrastructure and tariffs, with Williams succeeding in rallying international support. With his muscle flexed in this exchange, and with significant centralization around Bridgetown, his allies in the left-leaning West Indies Federal Labour Party look forward to securing their mandate in the upcoming election.\n"
 Caribbean_News.19.a: "A Federation prepares to cheer for its former iceberg."

 Caribbean_News.20.t: "[Get_newspaper_header]Self-Coup in Antigua"
 Caribbean_News.20.desc: "Prime Minister of Antigua and leader of the Antigua Labour Party, Vere Bird, has declared a state of emergency in the island today, suspending elections until further notice. With his first action being to arrest prominent members of the Progressive Liberal Party, including the party leader George Walter, many believe that this is a barely disguised attempt to create a dictatorship.\n\nThis instability comes after the collapse of the proposed West Indies Federation, with strongmen like Bustamante of Jamaica, Adams of Barbados, and Bird himself serving as important lynchpins in the project. It seems that without the federation, these strongmen are attempting to reassert their rule through authoritarianism.\n\n"
 Caribbean_News.20.a: "American influence can only go so far."

 Caribbean_News.21.t: "[Get_newspaper_header]Leeward Federation Formed"
 Caribbean_News.21.desc: "Owing to economic and security concerns emanating from the Oil Crisis, Prime Ministers Vere Bird of Antigua & Barbuda, as well as William Herbert of St. Kitts, Neves & Anguilla, concurred to join their states in a limited Leeward Federation.\n\nLikely fueled in part by lingering frustration at the collapse of the West Indies Federation project, this new union, while restricted in scope and means, proves to be an unexpected victory for the Federalist movement, with talks already ongoing for granting potential membership to Montserrat and the Virgin Islands.\n\nHowever, this development remains eclipsed by the controversy surrounding both of its architects, who have perhaps fittingly taken a step back from leadership, leaving it in the far less contentious hands of Frederick Albert Phillips."
 Caribbean_News.21.a: "More of the same."

 Caribbean_News.22.t: "[Get_newspaper_header]St. Kitts Fends off Mercenary Invasion"
 Caribbean_News.22.desc: "Dramatic scenes have come from the newly independent St. Kitts and Nevis, as an armed invasion was held off by a shootout. Headed by an American mercenary, the attempted coup had backing from both Nevisian separatists and the conservative People's Action Movement, and was aimed at kidnapping and then forcing the resignation of its divisive Prime Minister, Robert Llewellyn Bradshaw, but was halted at the Prime Minister's official residence.\n\nWith almost a dozen casualties, the mercenary force was quashed, but the events leading up to it have brought significant consternation from the Kittitian left. The United States has condemned the actions and has pledged to bring those responsible to justice, but the mood within Basseterre is far more panicked, with Bradshaw declaring a state of emergency to root out American influence."
 Caribbean_News.22.a: "It seems that not all islands can be bought with money or strength."

 Caribbean_News.23.t: "[Get_newspaper_header]Caribbean Filibuster Foiled"
 Caribbean_News.23.desc: "A potential catastrophe collapsed into farce last night in St. Kitts and Nevis, as an apparent attempt to overthrow its nascent political order had totally failed. Headed by a band of mercenaries, and reportedly claiming to have received support from Nevisian separatists and backers of the People's Action Movement, the coup was reportedly planned to oust the divisive and left-leaning Prime Minister Robert Llewellyn Bradshaw, but collapsed at the first hurdle.\n\nInternational reception has barely regarded this as a story of note. Bradshaw has condemned the measures alongside the American government, which has denied any complicity and has pledged to prosecute those involved. Beyond a few upcoming arrests, however, the total lack of momentum has brought about little interest, and common perceptions in the region look towards just relegating this farce to being a historical footnote.\n"
 Caribbean_News.23.a: "William Walker rides once more, and fails once again."

 Caribbean_News.24.t: "[Get_newspaper_header]Dominica Prime Minister Removed in Parliamentary Coup"
 Caribbean_News.24.desc: "Due to charges of corruption and accusations of conspiracy against the state, Edward LeBlanc, the populist Labour leader of Dominica, was forced to resign by members of his own Democratic Labour Party. Nicholson Ducreay, a moderate member of the party, has assumed LeBlanc's previous duties and announced his intent to gradually roll back LeBlanc's nationalization and cultural programs.\n\nPreviously criticized by American analysts for his aggressive approach to removing foreign influences, including the plantation businesses which are integral to the island's economy, Cuba and Mexico have released statements denouncing the removal of LeBlanc as an orchestrated, undemocratic action and hinted towards American involvement. The White House has yet to publish any counterstatement."
 Caribbean_News.24.a: "Playing with fire was never a good idea."

 Caribbean_News.25.t: "[Get_newspaper_header]A Second Dominican Republic Established"
 Caribbean_News.25.desc: "In the post-colonial Caribbean landscape, another Dominican Republic rises into prominence as Prime Minister Edward Oliver LeBlanc declares Dominica's independence from the British monarchy. The secession is largely a result of recent constitutional reforms, which have allowed LeBlanc to instate a Mexico-inspired governing model on the island, imitating both the good and the ill.\n\nThis full split from the Commonwealth's system has allowed LeBlanc to further institutionalize the dominant Dominican Labour Party while keeping dissent at bay through appeasement to Mexico and Cuba. As Roseau claims its sweeping nationalization campaign and increasing dictatorial tendencies as a part of a broader "cultural revolution," the United States and her allies condemn Dominica's swing towards despotism.\n"
 Caribbean_News.25.a: "Even dictatorships are downsizing in this economy."
 Caribbean_News.25.b: "I doubt the Caribbean Legion will help with this one."

 Caribbean_News.26.t: "[Get_newspaper_header]A Political Dynasty Returns to Barbados"
 Caribbean_News.26.desc: "Tom Adams, son of previous Barbadian Prime Minister Grantley Adams, has too been elected as the nation's Prime Minister. Thus further cementing the Barbados Labour Party as the premier party of the nation. The Adams' have returned to the Ilaro.\n\nTom Adams is expected to continue his father's liberal administration, while furthering already strong ties to Canada and the United States. At his inauguration, Adams promised for further cooperation and integration among the nations of WICU, with Barbados' role as leader becoming more and more important.\n\n"
 Caribbean_News.26.a: "Just give him a crown already."

 Caribbean_News.27.t: "[Get_newspaper_header]Formation of the Caribbean Community"
 Caribbean_News.27.desc: "With the West Indies Federation failing, former Premier of Barbados, Grantley Adams, has created the Caribbean Community, a customs union aimed to further integrate its members. This comes after the recent establishment of the East Caribbean Union by Trinidad, which the new bloc seeks to counteract. With Adams' project being backed by the OFN, it seems like the Cold War is coming to the Caribbean."
 Caribbean_News.27.a: "Will anything unite the islands?"

 Caribbean_News.29.t: "[Get_newspaper_header]Formation of an East Caribbean Union Announced"
 Caribbean_News.29.desc: "Defying a common fate of backwardness, the nations of Trinidad and Tobago, Grenada, and St. Vincent and the Grenadines have entered a political union amidst the region's increasing instability. Under Trinidadian Prime Minister Eric Williams' leadership, the East Caribbean Union intends to rival the West Indies Federation through a more centralized direction focusing on its members' social and infrastructural development, which means to eventually make the islands into one nation-state.\n\nSpeculations, as well as internal reports, however, suggest the union as an expansionist move solely to the benefit of the Trinidadian government, given its outsized wealth and population compared to the rest of its junior partners. Regardless, it is a path away from the British and the Americans, and no doubt all its members joined for their own economic good.\n"  
 Caribbean_News.29.a: "A small, homegrown empire down south." 

 Caribbean_News.30.t: "[Get_newspaper_header]Dissidents Capture Grenada, Declare Independence from the East Caribbean Union"
 Caribbean_News.30.desc: "Eric Gairy's Grenada United Labour Party has rallied a filibuster revolt to secede from the East Caribbean Union in protest of ongoing centralization under Port of Spain's direction. A prominent critic of Grenada's membership in the ECU since its establishment, Gairy has denied involvement of foreign parties in the revolt, attributing its success to the people's will.\n\nThe East Caribbean Union has decried the Grenadian secession as an act of American imperialism conducted in retaliation for Trinidad's dispute with the United States over the Chaguaramas peninsula. Washington calls for an OAS emergency meeting to resolve the conflict peacefully."
 Caribbean_News.30.a: "Don't build sandcastles in America's backyard." 

 Caribbean_News.32.t: "[Get_newspaper_header]Grenada Reintegrated into ECU with OAS Support"
 Caribbean_News.32.desc: "The Grenadian revolutionaries, despite their zealous marches, have met their greatest enemy: bureaucrats. Seeing the protection of the statelet's sovereignty as a liability to current operations, the Organization of American States chose to intervene on the East Caribbean Union's behalf in the Grenadian Crisis. Under the threat of military force, Eric Gairy was forced to surrender and go into exile. Without their former leader, much of the local resistance and hirelings dissipated.\n\nWilliams' success in preventing the Grenadian secession peacefully has won him praises on the international stage, and citizens at home begin warming up to his pan-Caribbean ambitions. Maybe there is hope that his dream of unity can belong outside a fantasy world.\n"
 Caribbean_News.32.a: "Keep calm and carry on." 

 Caribbean_News.33.t: "[Get_newspaper_header]Order Restored to Grenada after Mexican and ECU Joint Operation"
 Caribbean_News.33.desc: "Eric Gairy's filibusters have been expelled from Grenada following a Mexico-sponsored ECU military operation. As Mexican and Trinidadian troops landed on St. George's, bringing the area back into Williams' fold, Gairy's hirelings have largely scattered or surrendered in the presence of a trained army.\n\nThere remain a few thugs who are making a last stand in the rural parts of the island, however, they now lack the force to launch a significant retaliation as Gairy disappears abroad following his insurgency's failure. The Mongoose Gang has completely dissipated, and ECU's hold over its turf is finally secure."
 Caribbean_News.33.a: "Don't overlook the bigger fish in the pond."

 Caribbean_News.34.t: "[Get_newspaper_header]Grenada Defeats Joint ECU-Mexican Invasion, Independence Secured"
 Caribbean_News.34.desc: "The Condor Legionnaires, Mongoose Gangsters, and Spanish volunteers, the motley crew that made up the Grenadian filibusters, have done the unthinkable: expelling the Trinidadian invaders while keeping Mexican reinforcements at bay. With subsequent Iberian troops arriving to support the island nation after repelling the first wave of East Caribbeans, an outnumbered Eric Williams had to call off his plan to reclaim Grenada.\n\nNow, Grenada stands as a staunch Iberian ally in the Caribbean as British influence in the region crumbles, acting as a sore spot between America's backyard and their ambitious Mexican neighbors. It is merely a small hole against the impenetrable wall of the Atlantic, but the make-or-break for Williams' pan-Caribbean dream, which may now face an unceremonious demise in its infancy."
 Caribbean_News.34.a: "Tough luck, Eric."

 Caribbean_News.35.t: "[Get_newspaper_header]All-Caribbean Peoples Conference Held in Trinidad"
 Caribbean_News.35.desc: "Trinidadian Prime Minister Eric Williams has recently announced his expansion plan for the East Caribbean Union in the All-Caribbean Peoples Conference held at Port of Spain. In his opening speech, Williams emphasized the importance for Caribbean nations to take an active stance against "a new imperialism" eroding the trust between newly independent regimes. In response, he calls for vigilance and collaboration between all attending nations.\n\nSince its establishment, the East Caribbean Union has maintained a steady economic growth and domestic stability. Many guests praised Williams' managerial expertise, and others expressed admiration for the Union's firm stance against colonialism. As Williams aligns firmly with Mexico while struggling against the United States, maybe he can deal a blow to the American hegemony one day."
 Caribbean_News.35.a: "A burgeoning power between the gulf."

 Caribbean_News.36.t: "[Get_newspaper_header]East Caribbean Union Federalizes"
 Caribbean_News.36.desc: "With Dr. Eric Williams' backing, the East Caribbean Union has sharply reoriented its domestic and foreign policies in recent weeks. Formerly tightly centralized in Trinidad's capital of Port of Spain, member islands have been granted legal autonomy. This Federation has also sought detente with its rival, the Barbados-based Caribbean Community customs union, establishing a small trade agreement centered on oil. ECU officials, unwilling to be named on the record, attribute both moves to U.S. pressure following Eric's Gairy's failed secession attempt in Grenada.\n\nWith his strident foreign policy curtailed and his controlling managerial style impeded, "Doc" Williams' reputation appears dented, and Federation opposition figures like Sagan Maraj have grown emboldened."
 Caribbean_News.36.a: "Just what the Doc ordered?"

 Caribbean_News.37.t: "[Get_newspaper_header]Dissolution of the East Caribbean Union"
 Caribbean_News.37.desc: "Between secessionist voices from St. Vincent and the Grenadines and the Grenadian revolution, Eric Williams succumbed to popular protest and resigned from his duty as Prime Minister in disgrace. His personal project, the East Caribbean Union, collapsed shortly after, with no one at its helm. Following Williams' departure, St. Vincent has broken away from Port of Spain as the People's National Movement lost power in a snap election.\n\nThe DLP, an Indo-Trinidadian-dominated party which acted as Williams' main opposition, has taken over under Bhadase Sagan Maraj. The new Prime Minister vows to stabilize both the domestic chaos and diplomatic disasters in due time, but many are uncertain of Trinidad's future prospects\n."
 Caribbean_News.37.a: "Would be more surprising if that worked out."

 Caribbean_News.38.t: "[Get_newspaper_header]State of Emergency Declared in East Caribbean Union" #Aplomb - I rewrote this to align with the lore
 Caribbean_News.38.desc: "With Eric Gairy's successful takeover of Grenada and the island's secession from the East Caribbean Union, the ECU's leader, Dr. Eric Williams, has declared a state of emergency. Citing the threat of further intervention by imperialist powers, Williams has suspended member islands' autonomy and placed restrictions on political organizing. 'Doc' Williams' secret police, known as the Flying Squads, have reportedly been dispatched to St. Vincent and Tobago to enforce these provisions.\n\nThe Veracruz Pact has passed a resolution praising Williams' 'decisive response to protect ECU sovereignty', while U.S. and Iberian diplomants have condemned Port of Spain's measures as a 'destabilizing overeaction'.\n"
 Caribbean_News.38.a: "One more death in Paradise?"

 Caribbean_News.39.t: "[Get_newspaper_header]Organization of American States Recognizes Grenada"
 Caribbean_News.39.desc: "Following Grenada's departure from the East Caribbean Union, Trinidad's rhetoric had become increasingly aggressive day by day. Hoping to secure its regained independence against potential military actions, the Grenadian government sought assistance from the Organization of American States. In return, the OAS promised to intervene on behalf of Grenada should escalation occur and immediately recognized its statehood.\n\nAs retaking Grenada becomes an impossibility, Eric Williams faces domestic scrutiny for his perceived inaction against the secessionists while protestors at home grow bolder under his weakness. The future of the East Caribbean Union hangs precariously in balance.\n"
 Caribbean_News.39.a: "There is always someone with more guns out there."

