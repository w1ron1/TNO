 Caribbean_flavor.11.t: "Коріння з астротурфу"
 Caribbean_flavor.11.desc: "ОБМЕЖЕНИЙ ДОСТУП/[GetDateText]\n\nВІД: ФРЕНКА ВАЙЛІ\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ПРОТЕСТИ В ПОРТ-ОВ-СПЕЙНІ\n\nПротести проти військової бази США в Порт-ов-Спейні на Тринідаді стають дедалі звичнішим видовищем. База вже була предметом суперечок, але останнім часом напруженість зросла після участі американців у нещодавніх конфліктах за кордоном. Порівняння прем'єр-міністром Еріком Вільямсом бази з колоніальною плантацією лише погіршило наші проблеми.\n\nНаша розвідка припускає, що джерелом цього сплеску протестів є іноземні агітатори та провокатори. Агент, який розслідував відомий конспіративний будинок, що використовувався протестувальниками, виявив іберійський паспорт, що належав людині, яку кілька разів помічали за підбурюванням натовпу біля бази. Також було знайдено літературу про Кубинську революцію.\n\nМи підозрюємо, що Іберія та Куба окремо працюють над використанням цих протестів, щоб змусити прем'єр-міністра Еріка Вільямса відмовитися від американської допомоги й торгівлі на користь їхніх відповідних блоків. Наразі нам бракує достатніх доказів, щоб пов'язати будь-який із урядів із цими зусиллями, не влаштувавши дипломатичного скандалу. Тому ми рекомендуємо поки що уважно спостерігати за ситуацією."
 Caribbean_flavor.11.a: "Вірність, хоробрість, чесність."

 Caribbean_flavor.12.t: "На хвилях Ямайки"
 Caribbean_flavor.12.desc: "МЕМОРАНДУМ ДЛЯ: Відділ TS, офіс у Маямі\n\nТЕМИ: 1. Внутрішня стабільність Ямайки\n\n2. Рекомендації щодо майбутньої стабільності\n\nНаші інформатори в групах, ворожих до Бустаманте, повідомляють про зростання вербування та ресурсів. Публічні зібрання дедалі краще відвідуються, деякі ще не ідентифіковані представники ямайського істеблішменту запропонували підтримку деяким впливовішим групам. Розслідування зовнішньоамериканського втручання, ймовірно іберійського або кубинського, тривають. Позиція Бустаманте в короткостроковій перспективі залишається стабільною, з небагатьма достовірними загрозами його владі в межах нинішньої політичної системи, але всі ознаки вказують на зростання підтримки опозиційних груп, що об'єднуються навколо ННП Майкла Менлі. Радикальні групи, за якими наразі ведеться спостереження, мають менший успіх, ніж ННП та її союзники, однак вони також отримують вигоду. За нинішніх тенденцій антиістеблішментські групи, ймовірно, становитимуть загрозу для Ямайки протягом 5 років. Цілком імовірно, що ситуація ще більше розчарує; внутрішня стабільність може бути втрачена значно раніше.\n\nАмериканські інтереси на Ямайці потребують регіональної безперервності. Опір нинішньому статус-кво робить нинішню систему, ймовірно, нежиттєздатною. Інкорпорація до Федерації Вест-Індії, ймовірно, є основним шляхом збереження американських інтересів, водночас заспокоюючи більшість заворушень. У короткостроковій перспективі, ймовірно, знадобляться посилені таємні дії, якщо ситуація демонструватиме будь-які ознаки погіршення. Рекомендуємо збільшити інвестиції в моніторингову діяльність і чітко ідентифікувати Осіб, що становлять інтерес, та Організації, що становлять інтерес, щоб діяти щодо них у разі виникнення потреби.\n\nПІДПИС: IF, офіс у Кінґстоні"
 Caribbean_flavor.12.a: "Вірність, хоробрість, чесність."

 Caribbean_flavor.13.t: "Ямаєць без краватки"
 Caribbean_flavor.13.desc: "Siempre! із задоволенням представляє наступне ексклюзивне інтерв'ю з Майклом Менлі, головою опозиційної Народної національної партії на Ямайці. Висловлювання Менлі перекладено іспанською, але в іншому вони не редагувалися.\n\nХосе Паґес Єрґо, інтерв'юер: "Що наші читачі мають знати про вас і вашу партію?\n\nМайкл Менлі: "Я служив авіатором у боротьбі проти фашизму, а також редактором газети й профспілковим лідером у боротьбі проти капіталізму. Я пишаюся тим, що продовжую ці боротьбу разом із великими чоловіками й жінками Народної національної партії. Ми виступаємо за демократичне, соціалістичне майбутнє Ямайки та є голосом за серйозні зміни в Карибах, що перебувають у стані застою через імперіалістичні сили."\n\nПаґес Єрґо: "Як би ви описали ситуацію на Ямайці?"\n\nМенлі: "Александер Бустаманте та його Ямайська лейбористська партія проводять політику підпорядкування Канаді й покладаються на неприховані репресії для її забезпечення. Кілька опитувань демонструють підтримку більшістю незалежної Ямайської республіки, але головорізи ЯЛП і джеррімендерінґ продовжують перешкоджати волі народу. Відверто кажучи, ситуація наближається до точки неповернення."\n\nПаґес Єрґо: "Яку роль Мексика відіграє у стратегії вас і вашої партії?"\n\nМенлі: "З огляду на ваш власний національний досвід, мексиканці послідовно й впливово виступали проти вад колоніалізму й авторитаризму в нашій півкулі та у світі.""
 Caribbean_flavor.13.a: ""Як наш сусід, я знаю, що ви будете могутнім союзником у боротьбі Ямайки.""

 Caribbean_flavor.14.t: "Недобрі вітри над Віндвардськими островами"
 Caribbean_flavor.14.desc: "ОБМЕЖЕНИЙ ДОСТУП/[GetDateText]\n\nВІД ТЕОДОРА ШЕКЛІ\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\n1. По всіх керованих Канадою Віндвардських островах спалахують протести, епіцентр яких знаходиться на Домініці, де західноіндійське відділення United Fruit Company має значну присутність.\n\n2. Сільське господарство є найбільшим роботодавцем у регіоні. Зі занепадом традиційного вирощування цукру перед лицем конкуренції інвестиції в бананове господарство принесли нове зростання й розвиток, ставши причиною будівництва більшості доріг і залізниць у регіоні. United Fruit Company (UFC), рушій економіки та інфраструктури Домініки, наразі контролює близько половини всього виробництва бананів на острові.\n\n3. Робітники бананових плантацій UFC на Домініці об'єдналися з іншими місцевими виробниками бананів, щоб протестувати проти низьких зарплат і поганих умов праці, а також, за твердженнями, проти політичного втручання та маніпуляцій з боку UFC. Та сама риторика поширюється на інших карибських островах, де присутня UFC, що вимагає від США відповіді.\n\n4. Наш уряд міг би відповісти на ці протести, заохотивши UFC піти на поступки, потенційно забезпечивши стабільність через підвищення рівня життя. Або дипломатичний персонал міг би взаємодіяти з генерал-губернатором, щоб забезпечити захист інтересів американського бізнесу в регіоні."
 Caribbean_flavor.14.a: "Працьовиті народи Індій заслуговують на щось за свої клопоти."
 Caribbean_flavor.14.b: "Фінансові інвестиції Америки в Індії є пріоритетом."

 Caribbean_flavor.15.t: "Від Кінґстона до Гарлема"
 Caribbean_flavor.15.desc: "Річард Гарт стояв за трибуною, перед ним був великий натовп, що складався з Чорних пантер та інших радикалів; можливо, маленька кімната змушувала його здаватися більшим, ніж він був. Попри це, він рішуче заговорив: "Я прийшов сюди сьогодні поговорити з усіма вами", — сказав він із сильним акцентом. "Я не з Америки, як багато хто з вас уже помітив. Я з Ямайки, і хоча багато наших братів і сестер тут пригноблені, те саме відбувається на Ямайці, організоване тими самими білими чоловіками у Вашинґтоні", — він ударив кулаком по трибуні.\n\n"Так звана 'Ямайська лейбористська партія' — ворог ямайського народу! Це не що інше, як лакейська маріонетка расистів у Вашинґтоні, які наживаються на нас, ямайцях! І так само, як наші брати й сестри борються тут, в Америці, з заворушеннями в Детройті та прямо тут, у Гарлемі, наші брати й сестри на Ямайці борються із заворушеннями в Спаніш-Тауні та Кінґстоні!"\n\nВін підняв кулак у повітря, коли натовп вибухнув оплесками, після чого відійшов убік для наступного промовця. У кутку стояв мовчазний чоловік, спостерігав, нічого не коментував і майже не аплодував. Він був підсадною особою і гадки не мав, чому ніхто не виступив проти нього. Але це не мало значення: він отримав те, за чим прийшов, і пішов, забравши із собою магнітофон."
 Caribbean_flavor.15.a: "Одне гниле яблуко..."

 ## Ангільська криза ##
 Caribbean_flavor.16.t: "Підступна деколонізація"
 Caribbean_flavor.16.desc: "Барон Молсон, канадський представник у Комісії Вест-Індії, зачинив за собою двері, входячи до кабінету, незграбно тримаючи в іншій руці велику теку. Зазвичай бездоганний аристократ виглядав майже розгубленим, коли сів навпроти Вільяма Гасті, одного з американських представників, і розсіяно потиснув йому руку. "Дякую, що організували цю зустріч у такий короткий термін, містере Гасті. Події розвиваються швидко, а Оттава вже кілька днів дошкуляє мені, вимагаючи пропозиції щодо політики."\n\nГасті переглянув документи у відкритій теці Молсона. "Радий бути корисним, містере Молсон. Тож перейдемо одразу до суті, чи не так?"\n\nМолсон кивнув. "Так і зробимо. Анґільці дали зрозуміти, що не бажають залишатися частиною Федерації Підвітряних островів, а містер Вебстер звернувся з проханням про пряме правління з Оттави. В принципі, я не бачу причин заперечувати — вони роками скаржилися на правління зі Сент-Джонса. Але нинішня ситуація має власний набір ускладнень."\n\n"Головна проблема полягає в тому, що це означало б визнати незаконне відокремлення доконаним фактом. Якщо ми погодимося на звернення Вебстера, ми підтвердимо правління сили в Карибах і створимо небезпечний прецедент для майбутньої стабільності Карибів. І, звичайно, Сент-Джонс буде в люті — ми можемо заспокоїти Анґілью, підпаливши решту Вест-Індії."\n\nГасті відкинувся назад. Його здогад був правильним — Молсон був готовий пожертвувати пішаком у вигляді Анґільї заради більшої справи — збереження порядку в решті регіону. Як же типово для колоніальної бюрократії. Але ось вони тут, і його поради просили. "Я ніколи не думав, що доживу до дня, коли ви подумаєте про те, щоб відмовити у заклику розмістити Юніон Джек над населенням, яке цього бажає, сере Молсоне. Але на вашому місці я б...""
 Caribbean_flavor.16.a: ""Я б сказав Оттаві взяти їх під своє крило. Не варто дозволяти цьому залишатися болючим місцем.""
 Caribbean_flavor_Canadian_Occupation_tt: "§YКанада візьме Анґілью під свій контроль. Це заспокоїть острів, але доведе іншим, що існуючий порядок у Карибах настільки міцний, наскільки міцні папери, що його закріплюють.§!"
 Caribbean_flavor.16.b: ""Я б сказав Оттаві повернути їх до Федерації, якщо вона хоче вижити.""
 Caribbean_flavor_Federation_tt: "§YАнґільї скажуть повторно приєднатися до Федерації Підвітряних островів; сподіватимемося, що вони мирно приймуть повернення до старого порядку.§!"

 Caribbean_flavor.17.t: "Голос розуму"
 Caribbean_flavor.17.desc: "У своїй розкішній квартирі в Кінґстоні Луїс М. Ґонсалес-Мата відкинувся на дивані й дістав кубинську сигару. Виснажливий процес пошуку прослуховувальних пристроїв у кімнаті нарешті завершився, і тепер він міг перейти до єдиного трохи менш нудного завдання. Мати справу з головорізами, що видавали себе за розвідників Трухільйо, завжди було морокою. Ці недолугі чобітники вважали себе непереможними після Пуерто-Плати. Недарма Мадрид радив їм консультуватися з Ґонсалесом, перш ніж випробовувати чергові божевільні схеми. Перед ним стояв великий радіопередавач, за мірками сучасної розвідки вже застарілий, але робота на іберійську розвідку означала необхідність обходитися тим, що є.\n\nПісля складного обміну кодовими словами Ґонсалес спілкувався з безтілесним голосом агента SIM, який багато курив. "Добрий день, сеньйоре. Я перевірив свої джерела в Анґільї, як ви й просили", — сказав Ґонсалес із такою ввічливістю, яку лише міг вичавити із себе.\n\nГолос затріщав на іншому кінці лінії. "Ну, які перспективи? Вони приймуть нашу допомогу?"\n\nҐонсалес затягнувся сигарою. "Мушу з жалем повідомити, що сеньйор Вебстер, схоже, не зацікавлений у збройному повстанні. Хоча Анґілья має проблеми з управлінням Федерації Підвітряних островів, він і його уряд залишаються вірними слугами британської корони, що б це не означало в наші дні. Я б запропонував відправити вашу зброю кудись в інше місце."\n\nМинув момент, перш ніж у приймачі пролунав приглушений видих. "Що ж, тоді нехай гниють на своєму маленькому острівному ув'язненні й самі намагаються втриматися проти янкі. Якщо вони такі віддані своїй маленькій короні, нехай спробують випросити в неї крихти. А ти — наступного разу краще. Франко не послав тебе сюди, щоб дозволити янкі ходити тут як у себе вдома." Розмова завершилася клацанням. Не вперше Ґонсалес залишився з однією думкою..."
 Caribbean_flavor.17.a: "Можливо, йому слід було дозволити Трухільйо померти того фатального дня."

 Caribbean_flavor.18.t: "Ясність"
 Caribbean_flavor.18.desc: "Представник Мексики в Організації американських держав розмахував пакунком так, ніби це була зброя. Його голос вистрілив: "Це фотографії. Фотографії, зроблені цього тижня на Анґільї. Фотографії незалежної карибської республіки, яку завойовують, а чітко виражену волю її народу заперечують. Фотографії застарілої імперії, що нав'язує свою грубу волю меншій нації — тема, яку багато хто тут згадає з власної національної історії."\n\n"Але фотографії не використовують таких слів. Поки я не можу показати їх вам, я мушу перекласти те, що вони говорять, іспанською."\n\n"Три анґільські дівчини чекають біля воріт середньої школи The Valley у білих сорочках і картатих сукнях. Їхнього вчителя там немає, лише канадські солдати зі зброєю, спрямованою в повітря."\n\n"Десантник штовхає двох анґільців до стіни, їхні руки підняті. Діти спостерігають."\n\n"Близько сотні анґільців ідуть ґрунтовою дорогою, протестуючи проти відновлення імперського правління. Під палючим сонцем дехто носить капелюхи, дехто тримає парасолі. Ще більше несуть плакати, що засуджують іноземних губернаторів, які принесли їм лише занедбаність, а не розвиток."\n\n"А ось головний міністр Анґільї Рональд Вебстер, суворий чоловік у смугастій сорочці та краватці. Законний лідер суверенної країни оточений своїм народом, який тримає плакати зі словами: 'Ганьба Канаді'. Цю фотографію було зроблено безпосередньо перед вторгненням. Відтоді його більше не фотографували — місцезнаходження Вебстера невідоме.""
 Caribbean_flavor.18.a: "Представнику США залишалося лише скреготіти зубами й уявляти, як вони виглядатимуть у завтрашніх газетах."

 ## Конференція Крейна
 Caribbean_flavor.19.t: "Зафарбовуючи тріщини"
 Caribbean_flavor.19.desc: "Коли засідання Комісії розпочалося, у думках Вільяма Гасті виникали різні постаті. Він роками чув гладкі промови дипломатів, яких ненадовго переводили з Порт-о-Пренса чи Гавани, але з часом змирився з тим, що в них є своя рація. Яким би настороженим він не був щодо американського втручання, навіть він визнавав потребу в альтернативі.\n\n"Хоча не всі економічні програми зазнали невдачі, ми помітили постійний застій у регіоні." Це, звісно, було величезним применшенням, але "За винятком кількох незначних успіхів, Анґілья та Британський Гондурас, зокрема, залишаються нерозвиненими, і ми вважаємо це серйозною проблемою на наступні роки."\n\nКоли Гасті закінчив, Гектор Аллард одразу ж заговорив. "Крім того, нещодавня нестабільність на Ямайці викликала глибоке занепокоєння у більшості з нас. Я не думаю, що впоратися з цими подіями неможливо за наших нинішніх ресурсів, але вони швидко виходять з-під нашого контролю."\n\nГасті насупив брови. "Однак ми також мусимо визнати, що більше не живемо в дев'ятнадцятому столітті. З огляду на розвиток зв'язків Канади зі Сполученим Королівством, важко уявити, що вона збереже ту саму роль, яку відігравала раніше." Тема була ризикованою, але він знав, що краще не відкладати неминуче. "З огляду на це я хотів би запропонувати можливість перетворити комітет на перехідний орган, поки ми готуємося надати Карибам самоврядування."\n\nЗакінчивши, Гасті очікував хоча б якогось невдоволеного гулу, який попередив би його, але був здивований відносною тишею в кімнаті. "Було б великою прикрістю для нас втратити ці колонії, але навіть я бачу, в якому напрямку рухається ця країна", — відповів Молсон, мовчазний, опустивши погляд. "З огляду на останні події, схоже, найкращим кроком буде підготувати створення місцевої федерації, яка допоможе керувати справами." Гасті на мить онімів від шоку, але швидко перейшов до обговорення нової конституції."
 Caribbean_flavor.19.a: "Країна, народжена в залі засідань."

 Caribbean_flavor.20.t: "Пошук золотої середини"
 Caribbean_flavor.20.desc: "Вільям Гасті давно звик до відрази Александера Бустаманте до чітких позицій, але ця конкретна розмова вивела цю звичку далеко за межі звичайного. Кожна спроба заручитися підтримкою відбивалася скептицизмом, а будь-які спроби заспокоїти його зустрічали напруженим схваленням.\n\n"Що ж, Вільяме", — запитав Бустаманте, лише на мить припинивши випускати хмару сигарного диму, — "Моя роль — служити народу Ямайки, і я побоююся, що це об'єднання просто надмірно розширить коло моїх пріоритетів."\n\n"Така пропозиція не вимагатиме призначати вас прем'єр-міністром, містере Бустаманте", — сухо відповів Гасті. Насправді він знав, що це людина, яка намагається уникнути неминучого, але сам Бустаманте все ще мав чимало сил для боротьби. "Але з огляду на нещодавню нестабільність на Ямайці Комісія занепокоєна тим, що роздроблені Кариби не зможуть протистояти загрозі екстремізму."\n\nНа це Бустаманте кивнув. "Справді. Я дедалі більше занепокоєний тим, як далеко можуть зайти ці профспілкові радикали і що вони робитимуть, якщо прийдуть до влади." Він дістав ручку й почав писати короткий меморандум, але зупинився, не дописавши першого слова.\n\nГасті своєю чергою кивнув. "Це також допоможе інтегрувати Ямайку в ширшу економіку й буде безцінним для розвитку ямайської економіки."\n\n"У Ямайки є свої економічні проблеми, так, але зв'язати нас із зубожілими островами по всьому регіону означатиме лише погіршити їх", — відповів Бустаманте, насупивши брови, але зупинившись перед неминучим висновком. "Але в нинішній ситуації ми далеко не просунемося. Якщо ви можете гарантувати, що Ямайка залишатиметься в сильній позиції, тоді я буду готовий підтримати федерацію." Простягнувши руку для рукостискання, вони невпевнено відповіли одне одному, перш ніж підтвердити остаточну угоду."
 Caribbean_flavor.20.a: "Коливання припиняється, хоча б на коротку мить."

 Caribbean_flavor.21.t: "Фінальна завіса"
 Caribbean_flavor.21.desc: ""Отже, якщо більше немає заперечень, гадаю, ми можемо перейти до нашого остаточного врегулювання", — продовжив Вільям Гасті, здебільшого за звичкою дивлячись перед собою. Конференція була переповнена дипломатами та регіональними лідерами, проте більшість обговорень видавалися щонайбільше формальністю, підтверджуючи зміни, які вже фактично здійснювалися. "Ми прагнутимемо створення Федерації Вест-Індії в Порт-ов-Спейні. Ця федерація буде створена в найближчі місяці, і її вступ до Організації вільних націй має бути прискорений."\n\nЕрік Вільямс опустив палець від вуха, перш ніж схрестити руки. "Я все ще неохоче підтримую це рішення", — відповів він із чутною втомою. "Нам можуть надати свободу проводити власні вибори, але, змушуючи нас вступити до ОВН, я не можу сприймати цей захід інакше, ніж як прикрашання завіси." Вільям Гасті повернувся до канадської делегації, сповненої кремезних постатей, які, здавалося, були відірвані від обговорень. Він міг сказати, що їхні плани не будуть зруйновані запереченнями регіонального лідера в останню хвилину.\n\nСкривившись, Александер Бустаманте кивнув. "Справді. Цей захід нічого не зробить, окрім як розпорошить наші економіки й залишить Ямайку розділеною між багатством і злиднями." Вільямс підняв брову, але все одно кивнув. Кілька тихих голосів пролунали луною, здебільшого висловлюючи сумнів у подальшій значущості Бустаманте. "Ми не можемо очікувати, що наші запрошення канадцям матимуть велике значення, якщо потім грюкнемо перед ними дверима."\n\n"Ми обговорили домовленості з канадцями, і, схоже, з пропозицією немає жодних реальних проблем", — відповів Гасті, піднявши папір із викладом низки обговорень, але не повертаючись до нього, щоб прочитати. Згладивши останні заперечення, він звернувся до залу із проханням про остаточне неформальне голосування, і його порожнє схвалення зрештою пролунало луною по кімнаті. Які б підозри він не мав щодо справжньої долі Вест-Індії, тепер їх було вилучено з його рук."
 Caribbean_flavor.21.a: "Повноцінна конференція, позбавлена сенсу."

 Caribbean_flavor.22.t: "Пішак на B5"
 Caribbean_flavor.22.desc: "Не минуло багато часу, перш ніж звістка про запланований вихід Комісії Вест-Індії стала відомою по всій Мексиці. За винятком кількох внутрішніх святкувань серед дипломатів і співробітників, відряджених до регіону, у більшості сприйняттів панувала неоднозначність. Сидячи головою наради, Алехандро Ґомес Маґанда знав, що не можна дозволити такій плутанині зайти надто далеко.\n\n"Ми не повинні протидіяти американським зусиллям, принаймні публічно", — відповів один із дипломатів, чоловік, якого Маґанда впізнавав лише за його призначенням, що вказувало на те, що його звали Еустасіо. "Здається, Аллард чи Молсон не надто опиралися, але багато британських і канадських чиновників нижчого рівня можуть уповільнити досягнутий прогрес."\n\nНатовп навколо них синхронно кивнув, але не знав, як продовжити. "Нам слід прагнути безпосередньо спрямувати остаточне врегулювання після розпуску", — відповів Маґанда, намагаючись приховати нервозність. Ці події, можливо, були його найкращою можливістю, але також ризикували дати [MEX.GetLeader] виправдання, щоб повністю усунути його з політики. "Ми не можемо ризикувати, дозволяючи британцям чи канадцям спрямовувати це остаточне врегулювання. Сильний, централізований Союз має вирішальне значення для регіональної стабільності та процвітання."\n\nЕустасіо знову підняв руку, коли Маґанда закінчив, але відповів майже одразу. "Я згоден. Ерік Вільямс має достатньо впливу всередині країни, щоб потенційно спрямувати остаточне врегулювання, а також може спрямувати довгострокову політику на нашу користь."\n\n"Але ми повинні пам'ятати, що крім нього у нас тут також є варіанти", — продовжив інший, чоловік, якого Маґанда легше впізнав як Ґільберто Рондеса. "Майкл Менлі, схоже, є природним наступником Бустаманте й дедалі більше розчаровується імперським правлінням." Маґанда на мить кивнув, але потім потягнувся, щоб знову поправити краватку. "Поки він пам'ятатиме говорити як представник нижчої аристократії, він також буде безцінним союзником.""
 Caribbean_flavor.22.a: "Ланцюг під шахом?"

 Caribbean_flavor.23.t: "Дзеркальне відображення"
 Caribbean_flavor.23.desc: "Пробираючись крізь натовп дипломатів, які збиралися для невимушених розмов на Конференції Крейна, Луїс Ґонсалес-Мата відчув тривогу, коли зайшов у відокремлений коридор. Він міг перебувати на Конференції з дипломатичних причин, але підтекст його останніх розмов із Мадридом чітко давав зрозуміти їхні вимоги: знайти спосіб запобігти переходу. Але чи правильно це — людині, яка служить федерації, працювати на її користь, щоб придушити іншу в момент її народження?\n\n"У вас є якісь оновлення щодо нинішньої ситуації?" — запитав чоловік, який був одягнений як офіціант, присутній на Конференції, але тепер перейняв поведінку, що видавала його справжню природу іберійського шпигуна.\n\nҐонсалес-Мата зітхнув. "Нічого суттєвого. Деколонізація Вест-Індії тепер є питанням місяців, максимум року, і лише кілька незначних питань щодо провінційного устрою все ще залишаються. Вони розглядають регіональну федерацію від Ямайки до Тринідаду." Озирнувшись, вони переконалися, що ніхто не наближається, перш ніж продовжити. "Америка не відчує від цього жодних реальних змін, але Мексика може спробувати втрутитися, хоч би якими були її регіональні цілі."\n\nШпигун своєю чергою зітхнув, явно очікуючи більшого керівництва. "Якась реальна внутрішня опозиція на цьому етапі? Усі розмови, які я чув, вказують на загальне нехтування канадською думкою, але щось більше за це?"\n\n"Не надто багато, окрім плантаторів і колоніальних бюрократів, але вони втратили прихильність ще після війни", — відповів Ґонсалес-Мата. "Я помітив, що Бустаманте був неохочішим за інших у регіоні. Очевидно, він просто хоче відкласти свій вихід на пенсію ще на кілька місяців, але це може дати нам цінний шлях до впливу через його наступника. З огляду на те, наскільки важлива Ямайка для регіональної економіки..." Пара замовкла, але наслідки не потребували пояснень."
 Caribbean_flavor.23.a: "Третя сила вступає в боротьбу?"

 ##Проксі-нарощування після патріації
 Caribbean_flavor.24.t: "Нагальні питання"
 Caribbean_flavor.24.desc: "Трохи задушливий кабінет Вільяма Гасті у Вашинґтоні, округ Колумбія, став місцем майже безперервної метушні та зустрічей відтоді, як Комітет Крейна завершив роботу. Рій секретарів, чиновників, дипломатів і політиків приходив і йшов, кожен намагаючись просунути власні інтереси. Деякі пропозиції були розумними, інші явно були спробами захопити владу й гроші, але деякі, як та, що зараз обговорювалася перед ним, були вирішальними.\n\nНорман Менлі, ветеран десятиліть ямайської політики, приїхав аж із Кінґстона, щоб особисто викласти Гасті свої аргументи. "Ви добре знаєте, що я закликаю провести такий процес уже багато років, містере Гасті. Я й досі вважаю, що це найкращий шлях уперед для Вест-Індії загалом і для Ямайки зокрема. Однак є одна річ, яка, на мою думку, має відбутися до будь-якого руху до Федерації: Ямайка повинна провести вільні та чесні вибори."\n\nГасті кивнув. Він знав позицію Менлі щодо цього питання і не міг не погодитися. Бустаманте дедалі більше вдавався до авторитарних заходів, щоб утримувати владу на Ямайці. Якщо він залишиться прем'єром, коли острів буде інтегровано до Федерації, він зможе спиратися на її інституційні опори й краще приховувати іноземну підтримку, яку, як був упевнений Гасті, він отримував, можливо, безстроково. "Я згоден. Америка підтримає організацію нових виборів на Ямайці до її приєднання до Федерації Вест-Індії."\n\nМенлі майже схопився зі стільця від хвилювання. "Щиро дякую, містере Гасті. Я дуже ціную вашу підтримку й обіцяю так само всіма силами підтримувати проєкт Федерації..."
 Caribbean_flavor.24.a: ""... але спочатку нам доведеться викинути деспота.""

 Caribbean_flavor.25.t: "Небезпечний зустрічний вітер"
 Caribbean_flavor.25.desc: "Стос паперів, що зростав на столі Вільяма Г. Гасті відтоді, як завершилася Конференція Крейна, уже був достатнім головним болем, але тепер, піднімаючи слухавку й набираючи номер Кінґстона, він готувався до справжньої мігрені. "Добрий день, сере Бустаманте. Це Вільям Гасті з Комісії Вест-Індії".\n\n"Добрий день, Вільяме. Чого цього разу?"\n\nГасті глибоко вдихнув. "Сподіваюся, у вас усе добре, сере Бустаманте. Я хотів поговорити з вами про можливість проведення виборів до вступу Ямайки до Федерації Вест-Індії. Мені не потрібно пояснювати вам, наскільки напруженою зараз є політична ситуація. Найближчими місяцями ситуація може легко погіршитися, і нам потрібно буде діяти обережно, щоб цього уникнути."\n\nПісля короткої паузи Бустаманте загарчав у слухавку, майже нерозбірливо через свій акцент. "Це погроза, Вільяме? Ви тиснете на мене, щоб я поступився натовпу? Ямайка обрала мене, Вільяме. Пам'ятайте про це, коли говорите про вибори."\n\nГасті потер скроні. Принаймні Бустаманте не кинув слухавку. "Звичайно, сере. Але ви повинні зрозуміти наше занепокоєння ситуацією. Будь ласка, не робіть нічого необачного."\n\nТепер у промові Бустаманте з'явилася нотка нагальності. "Я для цієї країни як батько, Вільяме. Я присвятив їй усе своє життя. Невже ви думаєте, що я не знаю, що для неї найкраще? Невже ви зовсім не можете мені довіряти?" На мить у слухавці запала тиша, перш ніж знову пролунав уже втомлений голос Басти. "Але, можливо, ви маєте рацію. Може, мені слід бути вищим за це й усе таке. Мені доведеться подумати. Добрий день."\n\nУ Гасті гуділа голова, коли він поклав слухавку. Тепер це було поза його контролем. Залишалося лише сподіватися."
 Caribbean_flavor.25.a: "Змокла від поту рука Гасті потягнулася до шухляди, де він тримав знеболювальні."

 Caribbean_flavor.26.t: "Дисципліна вождя"
 Caribbean_flavor.26.desc: ""Вони вважають мене маріонеткою! Довбаною маріонеткою!" Александер Бустаманте вдарив зморщеним кулаком по столу, скривившись і трусячи ним у повітрі. "Як вони сміють?" Його радники на мить переглянулися, помітивши занепокоєння на своїх обличчях. "Вони" — це або Мексика, або протестувальники надворі — перші це лише натякали, інші говорили прямо. Коли вони знову повернулися до свого прем'єра, його руки були підняті в удаваному запитанні. "Хіба я не зробив усе, чорт забирай, для цих невдячних виродків на вулицях?" Палець смикнувся в бік вікна. Нечутне скандування долинало вітром через їхній кабінет.\n\n"З повагою", — сказав один із радників, стоячи перед Бустаманте Експрес, "... внутрішні опитування все ще сильні, попри... попри все. Ми все ще можемо перемогти на виборах—"\n\n"Можемо! Я можу перемогти на виборах!" Він сповз у кріслі, низько схиливши голову. "А якщо я програю? Ні, ні. Ямайка все ще потребує мене. Я повинен допомогти провести Ямайку через цю федерацію. Бог знає, що станеться, якщо тут кермо опиниться в менш надійних руках."\n\nІнший радник прокашлявся, підняв теку в руці. "Ще залишається питання протестів. У мене тут звіти від Констебулярії—"\n\n"Облиш", — сказав Бустаманте. Радник повернув теку собі на коліна. "Є лише одне, що мені потрібно знати. Вони можуть із цим упоратися?"\n\nРадники знову переглянулися, а потім повернулися до Бустаманте. "Так, можуть. Але містер Гасті досить чітко дав зрозуміти—"\n\n"Гасті хоче свою федерацію чи ні?" Бустаманте зітхнув, перевівши погляд на роботу на столі. "Тримайте незгоду на мінімальному рівні, принаймні до ратифікації Федерації...""
 Caribbean_flavor.26.a: ""... І робіть це так само, як мої друзі на сході. Вони мають навчитися.""

 Caribbean_flavor.27.t: "Вітри змін"
 Caribbean_flavor.27.desc: "Спокійний вітерець просочувався вулицями Кінґстона, даруючи Алехандро Ґомесу Маґанді перепочинок від вологого тепла. Він ковтнув кави й усміхнувся своєму співрозмовнику. "Це справді відбувається, так? Комісія Крейна, незалежна федерація, усе це. Не думав, що доживу до дня, коли англосакси справді проводитимуть далекоглядну політику. Твій батько, мабуть, у захваті."\n\nМайкл Менлі, голова Народної національної партії, злегка скривився. "Так. І я теж мав би бути — ми роками працювали заради чогось подібного. Це може бути чудовою можливістю для Ямайки, і я погоджуюся, що давно настав час вийти з тіні Канади. Але я не можу позбутися відчуття, що цей... момент може бути не найсприятливішим."\n\nВітер припинився, і Ґомес дістав носовичок, щоб витерти чоло. "Чому?"\n\nМенлі нервово крутив чашку. "Якщо Конгрес Вест-Індійської конституції відбудеться в середині 1967 року, як зараз планується, це означатиме, що Ямайка буде включена до федерації, перш ніж матиме шанс реформуватися, вийшовши з колоніальної політичної структури... і перш ніж зможе позбутися Бустаманте та його прибічників." Менлі на мить нервово озирнувся. Він попросив провести цю зустріч у непримітному кафе, і тепер Ґомес зрозумів чому. "Я боюся, що незалежність і федерація без необхідної реформи зрештою можуть навіть призвести до насильства."\n\nҐомес нахилився вперед. "Я розумію. Якщо канадці збираються намагатися тримати палець у пирозі через Бустаманте, нам доведеться спробувати — метафорично, звісно — відбити його. Мексика підтримуватиме суверенітет Ямайки за будь-яких обставин. Можеш бути в цьому певен.""
 Caribbean_flavor.27.a: "Вітерець ожив знову."

 Caribbean_flavor.28.t: "Звіт про політичну ситуацію на Ямайці після конференції Крейна"
 Caribbean_flavor.28.desc: "ФЕДЕРАЛЬНА ДИРЕКЦІЯ БЕЗПЕКИ\n\nТЕМА: Політичні події на Ямайці\n\nПісля завершення конференції Крейна політична ситуація на Ямайці стрімко змінюється. Неминуче утворення Федерації Вест-Індії та різні питання, пов'язані зі вступом Ямайки до неї, стали домінувати в політичних дискусіях на острові. Серед цих питань жодне не стало настільки нагальним, як питання виборів.\n\nТеоретично багаторічний прем'єр Ямайки Александер Бустаманте має залишатися на своїй посаді до виборів 1967 року. Однак на острові почав набирати силу рух, який закликає провести дострокові вибори, до вступу Ямайки до Федерації. Ці політики, активісти та громадські діячі звинувачують Бустаманте в деспотизмі та в тому, що він утримує владу лише завдяки втручанню Колоніального відомства в Оттаві, і побоюються, що вступ до Федерації до проведення виборів лише дозволить йому ще більше закріпити своє становище в нових структурах влади регіону.\n\nНещодавно цей рух, зосереджений навколо опозиційної Народної національної партії та її лідера Майкла Менлі, почав організовувати на острові масштабні протести й страйки, вимагаючи проведення виборів або навіть безпосередньо відставки Бустаманте. Хоча досі ці протести були мирними, їхній масштаб, що зростає, а також его та запальний характер Бустаманте дедалі більше загрожують миру. Потрібно зовсім небагато, щоб протести вийшли з-під контролю.\n\nЗ глибокою повагою,\n\nФедеральний директор безпеки"
 Caribbean_flavor.28.a: "Як завжди, імперіалісти залишають після себе безлад."

 Caribbean_flavor.29.t: "Кинути перший камінь"
 Caribbean_flavor.29.desc: "У мексиканського консула в Карибах раптом пересохло в горлі. Відкрито кинути виклик канадській політиці у Вест-Індії було дипломатичною авантюрою. Американці приватно були на його боці, але вони не схвалили б такої публічної критики своїх північних сусідів та їхніх колоніальних клієнтів. І все ж дії прем'єра Ямайки перейшли межу; хтось мав виступити на захист ямайського народу. Алехандро Ґомес Маґанда глибоко вдихнув і почав говорити.\n\n"Добрий вечір. Я скликав цю пресконференцію, щоб рішуче засудити ескалацію насильства та нехтування демократичними нормами, які ми спостерігаємо на Ямайці. Сцени репресій і жорстокості, вчинені поліцією та озброєними бандитами, яких прем'єр Бустаманте відправив проти мирних протестувальників, глибоко шокують. Це демонстрація насильства, яка нагадує про європейські режими в чоботях. Вона чітко показала одне — прем'єр Бустаманте не придатний для управління Ямайкою. Він має піти зі своєї посади й дозволити провести вільні та чесні вибори."\n\nЗа кілька хвилин, коли журналісти отримали можливість поставити запитання, репортерка La Prensa підняла руку. "Ліценціадо, чи поділяють нашу позицію наші сусіди? Відомо, що канадці в минулому підтримували Бустаманте та його уряд."\n\nҐомес вдихнув. Будь-яка критика тут могла бути сприйнята як прямий напад на Оттаву і, відповідно, на сам Вашинґтон, хоч би наскільки завуальованою вона була. Але він відчував, як усередині нього зростає рішучість, праведний гнів і воля діяти.\n\n"Я тут, щоб повторити позицію Мексики. На жаль, не всі наші друзі бачать речі так само, як ми. Прем'єр Бустаманте був зручним спільником у кількох ініціативах, які слугували закріпленню присутності іноземних держав у регіоні, і деякі з цих іноземних держав, безперечно, хотіли б бачити його на посаді. Однак...""
 Caribbean_flavor.29.a: "Мексика не миритиметься з придушенням права народу на самовизначення".

 Caribbean_flavor.30.t: "Роздмухуючи жар"
 Caribbean_flavor.30.desc: "Запас кубинських сигар Луїса М. Ґонсалеса-Мати вичерпувався відтоді, як упав Батіста, а його зв'язки на острові були зведені нанівець, але саме в такі моменти він радів, що не змарнував останні з них. Александер Бустаманте міг бути складною людиною, але хороша сигара могла заспокоїти більшість людей.\n\n"Дякую, Луїсе. Мені потрібна була ця перерва. Тут усе загострюється, а янкі підбурюють людей проти мене. Я починаю сумніватися в усій цій справі."\n\nҐонсалес-Мата випустив ідеальне кільце диму. "Федерація? Що ж, я вважаю, що це все ще хороша можливість для тебе. Поки американці не втрутяться безпосередньо, ти маєш бути здатен утриматися, можливо, з певною допомогою Оттави. А коли Федерацію буде створено, у тебе з'явиться набагато більше способів здійснювати владу — на той момент ти практично станеш недоторканним."\n\nБустаманте примружився, дивлячись на сонце, що сідало. "Ось у чому річ, Луїсе. Я не впевнений. Можливо, мені просто варто провести ці вибори, щоб заткнути Менлі. Я виграю вибори й дозволю всім побачити, кому довіряє ямайський народ. Якщо ми вступимо до Федерації без виборів, вони можуть подумати так само, як ти, і вдатися до менш законних способів, щоб позбутися мене."\n\nҐонсалес-Мата повернувся до Бустаманте, піднявши брову. "Справді, містере Бустаманте? Я б сказав, що вам не варто в це вплутуватися. Якщо ці вибори спонсорують янкі, ви справді думаєте, що вони дозволять вам перемогти?"\n\nБустаманте фиркнув. "Досі дозволяли. Але, з іншого боку, навіть якщо дозволити їм провести свої вибори, люди можуть подумати, що я здався. Ці виродки з ПЛП подумають, що це їхня можливість." Він поглянув на свою сигару, що догорала."
 Caribbean_flavor.30.a: ""Ну, на них чекає сюрприз.""

 Caribbean_flavor.31.t: "Кінґстонська рокіровка"
 Caribbean_flavor.31.desc: "Сантос давно навчився не реагувати на подібну різанину, що наростала за його вікном, у цьому похмурому готельному номері на другому поверсі з видом на Кінґстон-сквер і протести проти нещодавнього скасування виборів, які тим часом загострювалися на вулиці. Настільний вентилятор гудів на далекому столику, запах сигаретного диму вбирався в дерев'яні панелі та дешеву штукатурку, якими були облицьовані стіни. Не зовсім ідеальне місце для відпочинку, але цілком придатне, щоб стежити за тим, що відбувається на рівні вулиці.\n\nПротестувальники знову взялися за своє, післяобіднє сонце сховалося за похмурим небом, а лінія за лінією поліцейські для боротьби з заворушеннями заповнювали вулиці. Сантос подумав, що в певному сенсі це могло бути невеликим благословенням, адже все й так мало стати достатньо гарячим, ще до того, як додасться тропічна вологість. Пожежі ще не спалахнули, як під час попередніх демонстрацій, але це не завадило хмарам диму підніматися над пікетом удалині, де вже застосували сльозогінний газ, а спалахуючі поліцейські вогні та монотонне виття сирен створювали фон.\n\nКрізь щілини жалюзі Сантос примружив очі, спогади про Каталонію та Марокко відлунювали в його мозку, або, можливо, він просто ставав параноїком? Інстинктивно він потягнувся до телефону, набираючи номер своїх контактів у Мадриді, лише щоб зрозуміти, що лінія не працює. Тоді він усвідомив, що виття сирен множиться — прибуває підкріплення, можливо, у відповідь на те, що щойно вивело телефонну лінію з ладу. Сантос почав пакуватися, збираючи фальшиві посвідчення та паспорти для польоту назад до Іберії."
 Caribbean_flavor.31.a: ""Цього разу Бустаманте справді їх розлютив", — мляво подумав він."

 Caribbean_flavor.32.t: "Це кінець"
 Caribbean_flavor.32.desc: "Він біг.\n\nНавколо нього панував хаос, усі думки й здоровий глузд зникли, коли матеріальне зіткнулося з істеричним. Навколо нього метушилися люди, штовхаючись і марно намагаючись знайти маленькі провулки чи темні закутки, де можна було б зникнути в темряві Кінґстона. Нічне повітря палало криками сирен, гучномовцями, що вимагали співпраці десь невизначено далеко, — співпраці з броньованою хвилею, яка насувалася на них з усіх боків.\n\nНіч починалася з такою надією. Сотні людей зібралися, слухаючи його та багатьох інших, які закликали до змін, до кінця нехтування Оттави та хватки Бустаманте над Вест-Індією; до справжніх дострокових виборів, які дозволили б почути волю народу. Зрештою, хіба він не казав їм? За умов Федерації, як можна було б усунути такого чоловіка, як Бустаманте, коли за ним стоятимуть усі повноваження такої держави?\n\nВін не міг згадати, коли все пішло шкереберть. Чи то поліцейський неправильно оцінив ситуацію? Чи один із його братів вирішив ударити їх? Ні, він не хотів у це вірити. Він припинив бігти, помітивши провулок, який, здавалося, був порожнім і завертав за ріг; можливий шлях до втечі. Що б не сталося, поліція пішла в наступ, і, попри його спроби благати їх зупинитися, після того як один із них ударив його в ніс, він побачив лише один вихід — бігти.\n\nВін завернув за ріг і прямо наткнувся на групу чоловіків, які непомітно сиділи там без діла. Не вагаючись, вони схопили його й кинули на землю, глузуючи з нього. "Ти ж був тим всезнайком на сцені? Комуністом?" — сказав один із них. Чоловік побачив, що вони тримають різноманітні гордо виставлені напоказ труби. "Треба було подумати, з ким ти зв'язувався."\n\nБлагання завмерло в горлі чоловіка, коли металева труба врізалася йому в обличчя. Потім ще одна. І ще одна."
 Caribbean_flavor.32.a: "Ім'я: Генрі Ґантер. Статус: МЕРТВИЙ ДО ПРИБУТТЯ — намагався втекти, загинув під час опору при затриманні."
 JAM_Kingston_Riots_Started_tt: "\n§YКоли Кінґстон охоплюють пожежі, з'являється можливість...§!"

 ## Події ямайських заворушень ##
 ## Загальний проксі-ланцюг
 #Події США
 Caribbean_flavor.33.t: "Звіт із Кінґстона"
 Caribbean_flavor.33.desc: "КОНФІДЕНЦІЙНО/[?global.date.GetDateStringNoHourLong]\n\nВІД РІЧАРДА Т. КЛЕМЕНТА\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ІНОЗЕМНИЙ ВПЛИВ НА ТЛІ ПОЛІТИЧНИХ ЗАВОРУШЕНЬ НА ЯМАЙЦІ.\n\nОбидві сторони в жорстоких сутичках у Кінґстоні користуються матеріальною та дипломатичною підтримкою іноземних держав. Бойові антиурядові групи отримують допомогу від Куби, а також від бригади Чорної зірки — комуністичного, чорного націоналістичного формування в складі Карибського легіону. Бустаманте також отримав зброю іберійського походження. Майкл Менлі, поміркований противник Бустаманте, заручився дипломатичною підтримкою Мексики у своїх спробах домогтися мирної передачі влади.\n\nМексиканські посадовці чітко продемонстрували свою підтримку Менлі та його мирної програми. Однак джерела в антибустамантівському русі звернули нашу увагу на зв'язки радикальних секторів із бригадою Чорної зірки. Якщо радикали озброяться, насильницька ескалація неминуча. Потік зброї на Ямайку забезпечується державними посадовцями, а маршрути контрабанди ведуть до іберійського виробництва.\n\nПоширення зброї та чорних націоналістичних сил становить загрозу стабільності в Карибах. Ці самі групи підривають єдність Вест-Індії та палко виступають проти інтересів США.\n\nСША обережно підтримують Мексику та Менлі, щоб досягти мирної передачі влади, яка позбавить радикалів впливу. Жорстка підтримка Бустаманте з боку Канади не сприяє цій меті. Канадське втручання слід звести до мінімуму."
 Caribbean_flavor.33.a: "І пізнаєте істину, і істина визволить вас."

 Caribbean_flavor.34.t: "Нестримна лють"
 Caribbean_flavor.34.desc: ""Якби ви дали нам достатньо свободи, щоб ми могли належно відповісти на ці атаки, Вільяме, — простогнав Молсон, його тон майже перетворився на гарчання, коли він шалено вказував на поселення на Ямайці між Кінґстоном і Портмором, — ми б уже розгромили цих радикалів."\n\nВільям Гасті зітхнув. Останні кілька хвилин він намагався заспокоїти Молсона, переконати його, що повномасштабне американське втручання не допоможе зберегти мир. "У вас було б кілька мучеників і острів, наповнений людьми, які лише ще більше вас ненавидітимуть." Пересунувши карту ліворуч, Гасті змусив себе продовжити. "Ми маємо бути обережними. Нашої присутності буде більш ніж достатньо."\n\n"Справді? Ти справді думаєш, що цих хуліганів відлякає кілька чоловіків із суворими обличчями?" Молсон відступив на крок, хитаючи головою. "Знаєш, Гасті, якби я не знав нічого кращого, я б припустив, що ви, американці, намагаєтеся переконатися, що Менлі захопить владу, щоб Канада більше ніколи не думала про вихід із вашої сфери."\n\n"Знаєш що, Г'ю? Можливо, ми з Менлі не такі вже й далекі один від одного." Гасті підвівся зі стільця й, майже кричачи, ткнув пальцем Молсону в груди. "Бо ми обоє давно втомилися від нездатності Канади подбати про Кариби. Ви змарнували кожну кризу з 1940-х років, дозволили цим місцям загрузнути в расизмі та застої, а щоразу, коли ви зазнаєте невдачі, просто ниєте нам про дев'ятнадцяте століття."\n\nМолсон теж підвівся, ще більше задерши обличчя в огиді. "Ви справді думаєте, що зможете зробити краще? Не ваші люди ризикують життям. Не ваші люди щоночі працюють, щоб утримувати ці острови в робочому стані." Відійшовши, Молсон лише на мить замовк. "Ваша підтримка в Карибах висохне тієї ж миті, коли Менлі підніметься на трибуну.""
 Caribbean_flavor.34.a: "Заворушення виходять за межі Ямайки."

 Caribbean_flavor.35.t: "Людина, яка створила Тіволі-Ґарденс"
 Caribbean_flavor.35.desc: ""Я б не сказав, що саме я «створив» Тіволі-Ґарденс." Міністр розвитку Ямайки Едвард Сіґа скромно усміхнувся американському репортеру та його телевізійній групі. "Чимало талановитих інженерів, архітекторів, професіоналів та всіляких інших людей заклали основи цього розвитку. Але саме люди Тіволі-Ґарденс роблять цю громаду такою, якою вона є. Сім'ї, студенти, вчителі..."\n\n"Тіволі-Ґарденс вважається оплотом підтримки вашої партії, правлячої ЯЛП, чи не так, містере Сіґа?" — запитав чоловік із CBS.\n\n"Останнім часом я там не ходив від дверей до дверей, але якщо ви маєте рацію, то я ціную їхню підтримку."\n\n"Деякі критики ЯЛП стверджують, що мешканці Тіволі були активно залучені до насильства від початку заворушень у Кінґстоні. Рівень убивств безпрецедентний для всього острова. Вони стверджують, що ви використовуєте громаду для створення армії. Як ви відповісте?"\n\n"Якби комуністи та гангстери сіяли хаос у будь-якому американському місті, ви б не звинувачували жодного порядного громадянина в захисті свого дому чи своєї родини, чи не так?" Сіґа дивився на наївний вираз обличчя американського журналіста, на безцільне невігластво в його очах. "Ваша аудиторія має зрозуміти: такого дикого беззаконня не терплять ніде — кров відповідає за кров, розумієте? Хоробрі люди Тіволі-Ґарденс це розуміють. Вони розуміють, що ця громада є першою лінією оборони проти комунізму та міжнародних бандитів. Якщо Тіволі-Ґарденс впаде, Кінґстон впаде, і якщо це станеться...""
 Caribbean_flavor.35.a: "Нью-Йорк неодмінно буде наступним."

 #Події Мексики
 Caribbean_flavor.36.t: "Мир і неприємності"
 Caribbean_flavor.36.desc: ""Ми ходимо по канату на Ямайці, джентльмени."\n\nАлехандро Ґомес Маґанда, консул на Ямайці, поправив і без того бездоганну краватку. Він оглянув кімнату в консульстві, яку поспіхом підготували для них, заповнену різноманітними дипломатичними працівниками й навіть представником канцелярії президента. Аудиторія високого рівня, порівняно з його звичайною.\n\nІз заднього ряду піднялася рука. "Хіба ми не наступимо Америці на мозоль, підтримуючи містера Менлі?"\n\n"Можливо, — сказав Маґанда, усміхаючись. — Американці воліли б сховати голову в пісок і сподіватися, що насильство вщухне. Ми не можемо собі цього дозволити."\n\nМаґанда поклав на стіл відкриту папку, витягнув першу сторінку й підняв її, щоб усі могли побачити. "Це, — сказав він, — звіти, що детально описують нещодавні дії бригади Чорної зірки на Ямайці. Комуністи з Карибського легіону. Вони мають благословення Гавани."\n\nДокументи передавали по колу, поки Маґанда обходив кімнату. "Майкл Менлі та ПММ мають ту саму мету, що й бригада Чорної зірки: покласти край зловживанням Бустаманте. Ми підтримуємо його, бо він досягне цього мирним шляхом."\n\n"Якщо тільки він не змінить курс і не приєднається до радикалів", — зауважив хтось. Маґанда кивнув. Ось де був канат.\n\nАмериканці вважали Кариби своїм ставком, але здригалися, коли настав час підтримувати спокій у водах. Тим часом кубинці не боялися здіймати хвилі, навіть якщо Мексика дала їм дружній сигнал відступити. Тепер їм належало втримати рівновагу."
 Caribbean_flavor.36.a: "Ми залишатимемося дорослими в кімнаті стільки, скільки зможемо."

 Caribbean_flavor.37.t: "Поза кадром"
 Caribbean_flavor.37.desc: ""Мехіко до Кінґстона. Ви чуєте нас, Кінґстон?"\n\nРізкий сплеск статичних перешкод. Потім відповідь. "Кінґстон до Мехіко. Ми виходимо до вас із Тіволі-Ґарденс, бідного району, що став епіцентром репресій режиму Бустаманте проти протестного руху."\n\nТиша, поки слухачі вловлювали звуки полум'я та криків. "Розкажіть, що ви бачите."\n\nСпалахи камер супроводжували працівників допомоги, які бігли в тліючу вулицю. Поліцейські, яких мексиканська преса називала найманцями Бустаманте, стояли неподалік. Вони втекли, побачивши жилети зі словом "ПРЕСА". Це була перепочинок від насильства, яким скористалися аматорські медики та волонтери з місцевих лікарень.\n\nЗображення молодих студентів із побитими обличчями, кров, що текла з ран від гумових куль, досягли екранів Америк швидше, ніж Бустаманте встиг їх заперечити. Обгорілі квартири, сплюндровані халупи та понівечені трупи заповнили газети Мехіко. Їхні кореспонденти подбали про те, щоб зафіксувати обличчя відповідальних, шукаючи не лише поліцейських, а й банди прихильників Бустаманте, що блукали Тіволі-Ґарденс і тероризували його мешканців.\n\nКамери не помітили графіті в панафриканських кольорах позаду палаючих будинків. Вони проігнорували зображення Маркса та гасла, написані великими червоними літерами. Жоден мексиканський репортер не взяв інтерв'ю в антибустамантівських бойовиків, які стріляли по поліцейських."
 Caribbean_flavor.37.a: "Мексиканський уряд хотів історію про пасивних жертв."

 Caribbean_flavor.38.t: "Поштовхи в Кінґстоні, відлуння в Гавані, шрами в Мехіко."
 Caribbean_flavor.38.desc: "Полковник Ла Муґре не був людиною, яку легко було вивести з рівноваги. Коли живеш життям, прагнучи бути кращим і зробити світ кращим за суму складових Нового світового порядку, треба бути витривалим, якщо не можеш бути розумним. На його щастя — або на його нещастя, залежно від настрою, — він був і тим, і іншим. Досвідчений кадровий офіцер мексиканської Ехерсіто та такий військовий аташе, якого могли побажати собі кубинці.\n\nХмари милосердно приховували післяобіднє сонце під час навчань, а вдалині виднілися гори та обриси Гавани. За оцінками Ла Муґре, бригадисти працювали добре. Більшу частину дня він спостерігав за кубинськими інструкторами, які проводили тренування зі зброєю та навчання малих підрозділів, готуючи їх до неминучого розгортання в Кінґстоні для посилення бригади Чорної зірки в ході заворушень у Тіволі-Ґарденс.\n\nБритва Оккама підказувала б, що Ла Муґре мав би належати до загартованих циніків — більшість революціонерів такими й були. Але десь мало залишатися місце для високих ідеалів, навіть якщо реальність рідко піднімалася до рівня таких очікувань. Ямайці мали повне право у світі боротися за майбутнє, яке вони обирали самі, але наскільки сильно буде фундаментально змінена Ямайка після цього?\n\nЛа Муґре жив із яскравими й живими спогадами про розповіді своєї абуели про погроми Кальєса у 20-х роках — образи, що проносилися в його голові, коли він дивився на фотографії того, як виглядала Гавана після того, як партизани Кастро пройшли через неї. Опустивши погляд на планшет у руці та загалом безневинні цифри й розташування, нашкрябані на ньому, він не міг викинути з голови кадри з Кінґстона. Можливо, він надто багато про це думав, але такі події не зникали з пам'яті одразу після того, як згасало полум'я."
 Caribbean_flavor.38.a: "Ла Муґре вирішив того дня триматися своїх спостережень, відсунувши сумніви на задній план."

 #Iberian Events
 Caribbean_flavor.39.t: "Дзвінок додому"
 Caribbean_flavor.39.desc: "На схід від Олд-Гарбору стояв невеликий придорожній бар: фіолетова неонова вивіска, музика менто по радіо, запах джерку та баммі. Навіть у телефонній будці на іншому боці дороги Луїс М. Ґонсалес-Мата все ще бачив, чув і відчував запах цих речей. На іншому кінці телефону був чоловік, який ніколи не зможе бачити, чути й відчувати запахи так, як Мата.\n\n"Доброго ранку, містере Мата." Мата визирнув у вікно телефонної будки: сонце вже зайшло, небо було темним. Тут третя година ночі, там, мабуть, дев'ята. "Які новини з Ямайки?"\n\n"Хаос", — сказав Мата, перебираючи двома пальцями телефонний шнур. "Протести відбуваються щодня, і вони загрожують перерости в заворушення. Бустаманте кипить від люті. Він хоче будь-якого приводу кинути поліцію для боротьби із заворушеннями проти протестувальників."\n\nПауза. "Він розчаровується в американцях?"\n\n"Нічого конкретного він не казав. Але скаржиться, що деякі речі його стримують." Мата переклав телефон з однієї руки в іншу. "Я придивився до цих протестів. Він хоче привід, але копи бояться ескалації без підкріплення. Якщо ми хочемо йому допомогти, нам потрібно озброїти його союзників."\n\nЩе одна, довша пауза. Мата спробував уявити офіс, у якому сидів його куратор; він не бачив нічого, крім столу, телефону й тіні. "Ці союзники надійні?"\n\n"Навряд, але нам не потрібно укладати довгострокові пакти. Нам просто треба дати його бандитам і воєнізованим формуванням трохи зброї, і вони зроблять брудну роботу, яку копи ні за що не стануть виконувати."\n\n"Добре." Без паузи. "Ми організуємо поставку. П'ятдесят тисяч доларів США, п'ятдесят гвинтівок. Цього буде достатньо?""
 Caribbean_flavor.39.a: "Мата стиснув губи. "Це початок.""

 Caribbean_flavor.40.t: "Ще одна волога ніч на Ямайці"
 Caribbean_flavor.40.desc: "Похмура ніч нависала над зустріччю в провулку. "Митницю вже пройдено." Сантос запалив сигарету, відкидаючи свою тінь на відкритий багажник автомобіля, а вуличний ліхтар тихо гудів над головою.\n\n"Ще щось має прибути?" Спільник Бустаманте, місцевий капітан поліції, схрестив руки й нахилився вперед, щоб оглянути вантаж.\n\n"Звісно, ще одна поставка має прибути приблизно за тиждень." Сталеві конструкції портового крана височіли над ними, а вдалині було чути метушню порту Кінґстона.\n\nУ багажнику автомобіля лежав запас зброї: гвинтівки, рушниці, пістолети, а також коробки за коробками боєприпасів. Зазвичай Сантос переправляв контрабандою більші вантажі, але й це замовлення було чималим.\n\n"Це все прямує до Тіволі-Ґарденс?" Сантос нахилив голову, дивлячись на ряд припаркованих уздовж провулка автомобілів, усі вщерть забиті імпортованою зброєю, як і цей.\n\n"Швидко вчишся." Контакт Бустаманте перевернув у руці револьвер, оглядаючи його.\n\n"Я слухаю новини." Сантос байдуже почухав ніс. "Після того, як ми вибралися з Лісабона, мало що ще привертає увагу."\n\n"Звучить розслаблююче." Контакт покрутив барабан револьвера, перш ніж зафіксувати його на місці. "Можна мені твою роботу?"\n\nСантос майже відчув співчуття. "Завтра буде поганий день?""
 Caribbean_flavor.40.a: "Контакт жестом вказав на купу зброї перед ними обома. "Сам скажи...""

 Caribbean_flavor.41.t: "Дивлячись у вічі кінцю"
 Caribbean_flavor.41.desc: "Луїс М. Ґонсалес-Мата не міг з'являтися разом з Александером Бустаманте під час заворушень, і жоден із них не міг дозволити собі залишити Кінґстон, поки заворушення тривали. Після кількох тижнів мовчання Мата нарешті порушив своє правило щодо їхніх таємних зустрічей. Він переодягнувся в тимчасового слугу й проїхав переповненими вулицями до Вейл-Роял. Там він побачив Александера Бустаманте у вітальні в західному стилі, який тримав у руці повну склянку.\n\n"Що, в біса, я їм зробив?" Бустаманте вихилив свій напій. "Що, в біса, я зробив ОВН?"\n\n"Що ти маєш на увазі?" Мата спостерігав, як Бустаманте хитається, намагаючись не заплітати язика; він замислився, коли востаннє старий чоловік залишався тверезим більше доби.\n\n"Цей клятий Майкл Менлі. Він розмовляє. Розмовляє з ними." Він налив собі ще одну порцію. "Я знав це. Вони весь цей час грали проти мене. Американці хочуть мене прибрати", — він тицьнув пальцем у поверхню столу, — "і вони збираються поставити на моє місце норманового виродка. Вони влаштували всі ці довбані заворушення лише для того, щоб позбутися мене."\n\n"Ми не дозволимо цьому статися", — сказав Мата. Бустаманте подивився на нього й на примари за його спиною.\n\n"Звісно." Він налив нову склянку. "Ти знаєш, як із цим впоратися. Ти знаєш, що робити, коли трапляються такі речі."\n\n"Ти маєш не дозволити їм витирати об тебе ноги." Мата скоротив відстань між собою та Бустаманте й скористався цією близькістю, щоб обережно відсунути пляшку. "Усі заворушення навколо Тіволі-Ґарденс, так? Заповни його копами. Заповни його зброєю. Души їх. Придуши будь-яке інакомислення, яке може звідти вирватися, і ти умиротвориш місто.""
 Caribbean_flavor.41.a: ""Души", — повторив Бустаманте."

 #Кульмінація
 Caribbean_flavor.42.t: "Ямайка, прощавай"
 Caribbean_flavor.42.desc: "У державі Ямайка нація завмерла в очікуванні. Корупція та репресії за прем'єрства Александера Бустаманте довели її до точки кипіння. Ніде це не відчувалося сильніше, ніж у центрі його влади, куди тепер були спрямовані всі погляди в країні.\n\nУ місті Кінґстон, у центрі цього наростаючого невдоволення, протестувальники зійшлися до осередків влади ЯЛП. Райони були позначені на поліцейських картах як окупована територія. Лідера країни ніде не було видно. Чутки поміщали його десь у Вейл-Роял, старому маєтку, перетвореному на штаб цієї вуличної війни.\n\nУ районі Тіволі-Ґарденс люди Бустаманте укріпили його кордони й заповнили вулиці озброєними провісниками порядку. Едвард Сіґа, головний головоріз ЯЛП, привів із собою найкращих силовиків партії до Ґарденс. Цивільним наказали залишатися у своїх домівках, де вони могли чути віддалені крики та вигуки проти уряду. Поліцейські з рушницями терлися плечима об злочинців із битами, об'єднаних під патронатом Бустаманте. Для одних ЯЛП була ланцюгами; для інших — пов'язкою. На її межі стояли протестувальники, вимагаючи припинення правління старого чоловіка. У тінях провулків був інший тип інакодумців; один озброєний під чорною зіркою, інший чекав, щоб побачити, чи зможуть вони зламати глухий кут.\n\nТам, де Спеніш-Таун-роуд перетиналася з Норт-стріт, ряд поліцейських для боротьби із заворушеннями стримував протестувальників. У центрі стояли поліцейський і протестувальник — ровесники, обидва уродженці Кінґстона, чиї імена історія не запам'ятає. Вони подивилися один на одного. Поліцейський тримав рушницю; протестувальник — плакат. Їхні руки міцніше стиснули знаряддя війни. Навколо них запал стискався, а гнів концентрувався в одній точці, і всі вони чекали моменту, коли він вибухне."
 Caribbean_flavor.42.a: "За багато миль звідси на електропідстанції сталася несправність. Світло згасло лише на секунду."

 #Перемога Іберії
 Caribbean_flavor.43.t: "Звуки сміху всюди"
 Caribbean_flavor.43.desc: "Там, де Спеніш-Таун-роуд перетиналася з Норт-стріт, постріл пролунав на все перехрестя. Коли світло повернулося, поліцейський дивився на мертвого протестувальника. Натовп відступив на крок. Він побачив широко розплющені, спантеличені очі протестувальника, що помирав. Поліцейські зробили крок уперед. Відтепер і до десяти років потому, коли він нарешті встромив собі пістолет у рот, його переслідуватимуть ці очі. Поліцейські пронеслися повз нього. У натовп полетіла димова граната. Ті, кого огорнула хмара, невдовзі відчули, як на них посипався град кийків.\n\nУ районі Тіволі-Ґарденс накази людям Бустаманте відрізнялися залежно від групи. Поліції доручили підтримувати порядок; вони відтісняли бунтівників від вулиць Тіволі. Бандами було наказано бити кожного, хто дивився на них криво; вони дістали зброю й відкрили вогонь у найгустіші частини натовпу. Кордон навколо Тіволі відступав і зникав перед цим маршем.\n\nУ місті Кінґстон люди Бустаманте вирвалися зі своїх загонів і придушили опозицію. Порядок встановлювали кулями та кийками. За лічені години опору більше не було; він або втік із міста, або глибоко підпілля, або лежав невидющим на вулицях. Десятки трупів потрапили до могил для бідних і крематоріїв. Сотні заповнили лікарні та клініки. Десь у Вейл-Роял старий чоловік хихотів і тримав у зморшкуватих руках пісок, який він украв для свого пісочного годинника.\n\nУ державі Ямайка радіоприймачі, які раніше замовкали або програвали заспокійливу музику очікування, загуділи мінливою статицою. Офіційний урядовий указ оголосив надзвичайний стан. Військові мобілізувалися для забезпечення безпеки міст, але на вулицях воєнізовані формування та злочинці били все, що виходило з тіней. У тих тінях між повторним встановленням порядку Бустаманте очі визирали крізь щілини, а шепіт ширився повітрям. Північний рух зупинився; Дядько Сем розлючений. Але східний рух стає швидшим і густішим."
 Caribbean_flavor.43.a: "І якщо зазирнути крізь щілини в залах влади й прихилити одне вухо, можна почути іспанську."
 IBR_Consequences_Jamaica_tt: "\n§RУчасть у таких корумпованих справах матиме наслідки для стабільності §OОб'єднання§!§!§R.§!"

 Caribbean_flavor.44.t: "Муха на стіні"
 Caribbean_flavor.44.desc: "Запис спостереження PIDE, екстрене засідання офісу ОАД: "Реакція на різанину в Кінґстоні." Джорджтаун, Вашинґтон, округ Колумбія, Сполучені Штати Америки.\n\n13:33:12 Голос 1: "Бустаманте вже починає діяти? Тіла ще навіть охолонути не встигли?"\n\n13:34:33 Голос 2: "Опозиційні партії сидять склавши руки, люди налякані. Режим позбавляється останніх перешкод на своєму шляху, консолідуючи владу у виконавчій гілці."\n\n13:34:57 Голос 1: "Конгрес?"\n\n13:35:07 Голос 3: "Спільна резолюція про приєднання до ОАД у засудженні насильства, підписана POTUS, резолюція Мехіко приєднається протягом години."\n\n13:35:45 Голос 1: "Мадрид?"\n\n13:35:55 Голос 3: "Переважно контрабандою переправляють зброю до Карибів, поза офіційними каналами. Подейкують, що порт Кінґстона був у їхньому маршруті."\n\n13:36:11 Голос 4: "Бустаманте лізе до кишені Франко?"\n\n13:36:48 Голос 1: "(зітхає) ...Знову Санто-Домінґо."\n\n13:37:05 Голос 2: "Зв'яжіться з будь-якими гуманітарними корпусами, які погодяться слухати, щойно зможете. Є ненульова ймовірність, що все це швидко піде шкереберть.""
 Caribbean_flavor.44.a: "Ситуація погіршується."

 #Червона-волюція / Ніхто не перемагає
 Caribbean_flavor.45.t: "Мушу зізнатися, моє серце там"
 Caribbean_flavor.45.desc: "Там, де Спеніш-Таун-роуд перетиналася з Норт-стріт, світло згасло, і натовп почув шквал пострілів. Коли світло знову ввімкнулося, поліцію було зрешечено вогнем зі стрілецької зброї. Поліцейський відкашляв кров на протестувальника й упав. Ті, хто вижив, побігли. Із темряви вийшов чоловік у шкіряній куртці, із значком Чорної зірки на лацкані. Він повернувся на південь і запитав, чи хочуть вони приєднатися до нього. Протестувальник пішов за ним, а невдовзі за ними рушив і натовп.\n\nУ районі Тіволі-Ґарденс строкатий гарнізон опинився в оточенні. Згори надійшов наказ: ми беремо контроль, рушайте на натовп. Але авангард поліцейських, що вийшов на вулиці, невдовзі опинився перед розлюченим натовпом. Банди намагалися прикрити відступ, воєнізовані формування намагалися вибивати лідерів, але натовп відповів вогнем. Натовп навколо Тіволі-Ґарденс рушив уперед, стискаючи своїх супротивників і душачи їх.\n\nУ місті Кінґстон усі джерела влади Бустаманте були захоплені протестом, що перетворився на повстання. Старий чоловік намагався віддавати накази, намагався оголосити надзвичайний стан по радіо, але ніхто не слухав. Невдовзі натовп прийшов до Вейл-Роял, а бойовики Чорної зірки вибивали двері. Сам Бустаманте був уже на півдорозі з міста, лежачи на своїй хворій спині, накритий брезентом і прямуючи до найближчого аеродрому.\n\nУ державі Ямайка міста за межами Кінґстона затамували подих. Звістка про втечу Бустаманте обезголовила владу. Дехто вже пакував речі, дехто вже репетирував свої промови. Через три години після захоплення Вейл-Роял в ефірі пролунали два нових голоси. Вони назвали себе Вільямом Страченом і Річардом Гартом. Вони назвали себе Рухом народної свободи. Вони сказали, що тепер існує новий уряд, уряд, який служить народу Ямайки, і що ані імперія, ані капітал не знайдуть тут свого посуду."
 Caribbean_flavor.45.a: "Тепер доля була в їхніх руках."

 #Перемога Мексики
 Caribbean_flavor.46.t: "Довго не повернеться"
 Caribbean_flavor.46.desc: "Там, де Спеніш-Таун-роуд перетиналася з Норт-стріт, світло знову ввімкнулося, і протестувальник побачив пістолет поліцейського на землі. Він подивився на неї, нічого не сказав. Протестувальниця кліпнула очима. Поліцейський відійшов убік, ставши на тротуарі. Інші поліцейські зробили те саме; дехто побіг, інші відійшли вбік, а кілька сміливців навіть приєдналися до них. Протестувальниця повернулася до натовпу й закликала його рухатися вперед.\n\nУ районі Тіволі-Ґарденс розчарування всередині гарнізону нарешті зламало його захисників. Поліцейські, побачивши перед собою історію, поклали зброю, повернулися додому або приєдналися до протесту. Банди втекли, побоюючись помсти; воєнізовані формування відступили, зализуючи рани. Район було захоплено менш ніж за годину, а з будинків та сховків почали виходити нові прихильники. Натовп розвернувся й рушив північними вулицями.\n\nУ місті Кінґстон протест розростався й ревів. Хвилі рухалися на північ і схід. Вони оточили Вейл-Роял, Кінґс-Гаус та всі державні органи; хвилі розбилися об ворота й прорвалися крізь них. Влада чинила незначний опір; ті елементи уряду, які залишалися вірними Бустаманте, вже виїхали з міста, а за кілька годин — і з країни.\n\nУ державі Ямайка всі погляди звернулися до столиці, а всі вуха налаштувалися на Ямайську мовну корпорацію. Довго чекати не довелося; через дві години після захоплення Вейл-Роял ямайський народ почув знайомий голос по радіо. Майкл Менлі, лідер Народної національної партії, подякував своїм прихильникам за повстання проти тиранії. Він пообіцяв процвітання, економічну справедливість і реформи, гідні демократичної нації. Він засудив режим Бустаманте та його іноземних покровителів і проголосив на весь світ нову сторінку в історії своєї нації."
 Caribbean_flavor.46.a: "Наступного дня новий прапор майорів над усією Ямайкою."
 IBR_Consequences_Jamaica_Loss_tt: "§FНа щастя, через відсутність у нас існуючих зв'язків із Ямайкою ця втрата не стане для нас значним тягарем.§!"

 #Продовження, якщо США програли
 Caribbean_flavor.47.t: "Одна марна конвенція"
 Caribbean_flavor.47.desc: "Конференція вже тривала надто довго, коли прем'єр Тринідаду Ерік Вільямс піднявся на трибуну. Половина делегатів конституційної конвенції покинула конференц-зал, і лише жалюгідна колекція млявих, пом'ятих прапорів свідчила про їхню присутність.\n\n"Тим із вас, хто все ще залишається, — промовив Вільямс, — я хотів би подякувати за те, що ви не забуваєте про наші народи. Народи Антилів поклали на нас свої надії, щоб ми спрямували їхнє майбутнє до єдності та незалежності. Саме тому я стою перед усіма вами, не переймаючись тим, що ви вже здалися."\n\nГолос прем'єра лунав порожнім залом і виривався у величезні коридори, де ненаситна преса заливала все світлом камер, а репортери перекрикували один одного, намагаючись поставити запитання делегаціям, які вже прямували до аеропорту.\n\nВільям Г. Гасті почув гамір крізь двері й поклав підборіддя на руки, спостерігаючи за блиском на чолі прем'єра, за тим, як рухалися його руки під час промови, за напруженою шиєю, коли він виголошував пристрасні слова.\n\nАле неминуче, коли він повернувся й сів разом із тринідадською делегацією, усі погляди знову звернулися до місць, позначених для Ямайки: демонстративно порожніх від самого початку. Інші могли говорити найпалкішими словами, але за заборони Ямайці бути присутньою доля Федерації вже була вирішена.\n\nМенш ніж за годину потому задзвонили дзвони, а делегати розійшлися, не отримавши нічого, крім запевнення, що Вест-Індія залишатиметься роз'єднаною. Коли Гасті підняв свою валізу й вийшов, він зустрівся поглядами з бароном Молсоном через натовп делегатів. Молсон похитав головою, пробурмотівши щось собі під ніс."
 Caribbean_flavor.47.a: ""Прокляті янкі.""

 Caribbean_flavor.48.t: "Повернення до Тринідаду"
 Caribbean_flavor.48.desc: "Ерік Вільямс пробирався крізь масу спалахуючих камер і простягнутих мікрофонів. Підіймаючись хиткими сходами до свого літака, він повернувся до натовпу й перекричав гуркіт двигунів.\n\n"Проєкту єдності та незалежного співробітництва у Вест-Індії завдано важкого удару. Але знадобиться набагато більше, щоб я від нього відмовився!"\n\nУсередині на нього чекали консул Маґанда та мексиканські спостерігачі, які були свідками конституційної конвенції — очевидного похорону всіх мрій про Федерацію у Вест-Індії для всіх, крім Вільямса.\n\n"Це ще не кінець, друже", — сказав прем'єр Тринідаду, міцно потискаючи руку Маґанди. "Далеко не кінець."\n\n"Ти ніколи не був тим, хто здається", — сказав Маґанда, заслуживши найширшу усмішку Вільямса. Вони сіли один навпроти одного, а яскрава синь Карибського моря сяяла з вікна.\n\nБілизна лінивих хмар відбивалася в темних окулярах Вільямса. "Я заручився підтримкою Ґренади та знайшов друзів на Сент-Вінсенті. Ми продовжимо рухатися вперед із власним союзом. Це буде згуртована сім'я."\n\nМаґанда підняв келих віскі. "І ти матимеш повну підтримку Мексики."\n\nПрем'єр кивнув, а потім, здавалося, знітився у своєму кріслі. Він поклав голову на руку. Океан простягався далеко до обрію, його краї ледь мерехтіли, майже зникаючи в небі.\n\n"Ми могли стати великими", — сказав Вільямс."
 Caribbean_flavor.48.a: "Антиколоніальні мрії, кинуті в моря."

 #Перемога США
 Caribbean_flavor.49.t: "Стиснуті зуби, вимушені посмішки"
 Caribbean_flavor.49.desc: "Протягом своєї кар'єри Вільям Г. Гасті зустрічав чимало зарозумілих дрібних лордів. Зневажливих, самовпевнених, пихатих — будь-яка взаємодія з ними гарантовано завершувалася принаймні головним болем. Але щоразу він мусив просто тримати язик за зубами й кивати, заради вищого блага. Саме задушливого ранку він знову опинився в такій ситуації — хоча, якщо чесно, барон Молсон був одним із кращих. Переважно.\n\n"Що ж, уже давно настав час, щоб ситуація заспокоїлася", — сказав канадський барон, коли вони з Гасті швидко йшли коридорами парламентської будівлі. "Я ж вам казав, друже мій. Ваш Вашинґтон був надто грубим. Я знаю, що мало що можна зробити, щоб зупинити схильність ямайців до обурення, але ви могли застосувати набагато тонші підходи."\n\nГасті стримав гримасу. Ось воно. "Принаймні тепер вони заспокоїлися. Тепер, коли Бустаманте усунутий, а Сенґстер такий же безпорадний, як він є, ми зможемо негайно продовжити реалізацію планів Федерації." Це, принаймні, було правдою. Дональд Сенґстер був практично беззубим порівняно з Бустаманте. Це було б як порівнювати виноград із динею.\n\nМолсон зупинився біля кулера з водою й наповнив чашку. "Так, це полегшення. Напевно, буде сумно бачити, як колонії йдуть", — сказав він, зробивши ковток. "Наче дитина залишає дім. Я все ще не вважаю, що вони готові. Ці заворушення нагадують мені те, що відбувається на американському Півдні. Наче діти влаштували істерику. Ні, їх усе ще потрібно навчати. І ми їх навчимо, чи не так?"\n\nГасті стиснув кулак."
 Caribbean_flavor.49.a: ""З повагою, я змушений не погодитися.""

 Caribbean_flavor.50.t: "Закон Мерфі в країні Джа"
 Caribbean_flavor.50.desc: "Попри спільні зусилля двох суперницьких половин латиноамериканської сфери, одна в Мадриді, а інша в Мехіко, характерна жадібність янкі знову проявляється в їхній хватці над островом Ямайка. Нахабство американської доктрини Монро знову зірвало плани молодої карибської нації щодо незалежності, звівши нанівець зусилля як націоналістів, так і лівих, спрямовані на започаткування визволення Ямайки.\n\nІберійський план підтримати спробу Бустаманте встановити диктатуру швидко розвалився ще до того, як почався, після чого невдовзі відбулося його вигнання та суд над змовниками. Так само було викрито очолювану Кубою змову, спрямовану на початок революції в Кінґстоні, що знищило основу, на якій народне повстання могло б справді розгорнутися.\n\nРеакцію обох таборів нескладно передбачити. Союзники Мексики в Гавані шаленіють через перемогу Вест-Індії над спробою революції, тоді як прихильники Мадрида в Центральній Америці та Андах так само роздратовані американським втручанням. Тим часом американські союзники у Вест-Індії продовжують консолідувати свою підтримку на Антильських островах та за їх межами, сподіваючись убезпечити себе від подальшого втручання іноземних сил.\n\nЦе аж ніяк не кінець амбіцій Мексики чи Іберії в Карибах, але можна було б обґрунтовано побоюватися, до яких меж може дійти будь-яка зі сторін, прагнучи помститися за провали на Ямайці... і хто ще може опинитися під перехресним вогнем, коли спалахне наступний регіональний конфлікт."
 Caribbean_flavor.50.a: "Події на Ямайці й без того були похмурими, але Кариби ще не вийшли з лісу..."

 ### Federation Formed Events
 Caribbean_flavor.51.t: "Дике паломництво до серця Карибів"
 Caribbean_flavor.51.desc: "У Кінґстоні вже кілька днів стояла спекотна й густа атмосфера, тож Томпсон очікував дощу, який починав змивати все сміття, що залишилося після заворушень. Сховавшись під одним із численних дахів із брухту, що вкривали нетрі Кінґстона, Томпсон побачив, що всередині вже була купа гангстерів. Він замислився, яким був би овер-андер щодо того, чи перевищує середня тривалість життя в цій довбаній дірі 30 років.\n\nЦе ті дурні похмурі думки, які заповнюють твою голову, коли ти перебуваєш у амфетаміновому психозі. Бандити, пов'язані з ННП та ЯЛП, безперервно билися з бригадою Чорної зірки, беззбройними протестувальниками та один з одним, аж до кількох ночей тому. Найсильніше дісталося бандам Менлі. У людей Бустаманте та комуністів були пістолети-кулемети, а головорізам ННП пощастило, якщо вони мали мачете.\n\nТомпсон уже кілька місяців перебував у Кінґстоні від Національного оглядача, нібито щоб зрозуміти, як живеться в цьому місті. Але насправді він лише намагався втекти від усього, що бачив. Оголені жінки годують грудьми немовлят, навіть не за три фути від трупів, що розкладаються. Старих чоловіків застрелюють на вулиці через борги, яких вони, ймовірно, навіть не мали. Голодні діти б'ються за черствий крекер. Навколо тебе лунає моторошна рокстеді-музика та найклятіші запахи. Це пекло на землі. Не дивно, що всі тут намагаються накуритися; ти б збожеволів, якби був тверезим.\n\nЗгадавши, що йому треба працювати, Томпсон спробував завести розмову з одним із на вигляд дружелюбніших головорізів Шауерів. Поки вони розмовляли, обоє помітили через дорогу білого ботана, без сумніву, з однієї з численних НУО, що прибували з-за кордону, який стояв над мертвим тілом, записуючи щось у реєстр. Головоріз Шауерів засміявся. "Ці люди думають, що можуть усе виправити. Погані хлопці їх живцем з'їдять." Коли Томпсон пішов, він дістав свій блокнот і проковтнув трохи стимуляторів. Трохи подумавши, він придумав гарну назву для того, що збирався написати."
 Caribbean_flavor.51.a: ""Страх і відраза в Кінґстоні...""

 Caribbean_flavor.52.t: "Зміна курсу"
 Caribbean_flavor.52.desc: "Роздуми. Норман Менлі сидів там, розмірковуючи про свій наступний крок. Бурхлива Кінґстонська революція, очолювана звичайними ямайцями, які нарешті назавжди усунули Бустаманте та ЯЛП з поля зору, не відображала того, наскільки стоїчним почувався Норман, кілька хвилин рано-вранці дивлячись на дисковий телефон.\n\nЗгадуючи короткі відомості про характер Гасті та ті мізерні моменти, коли він знав його особисто, він знав його як голуба серед яструбів у Вашинґтоні, які тримають Кариби в лещатах. Він був одним із небагатьох у Комісії Вест-Індії, хто розумів шкоду, завдану несправедливістю. І це лише сильніше затягувало його вузли. Як перехідна фігура з десятиліттями політичного досвіду за плечима, Норман знає, що повинен сформувати новий фундамент нації на очах усього світу, перш ніж відійти вбік і дозволити своєму синові стати його наступником. Це зізнання Гасті буде нелегким.\n\n"Пане Менлі, чи є причина, через яку ви телефонуєте мені саме зараз?" — тон Гасті, обтяжений не надто сприятливим для інтересів Комісії результатом заворушень, усе ж не зупинив Менлі, наскільки б важко йому це не було.\n\n"Пане Гасті, відколи протести закінчилися, наш уряд і досі працює над відновленням нашої інфраструктури та комунікаційних мереж. Поки ми підраховуємо збитки, на жаль..." Менлі стиснув щелепи, боячись того, що мусить сказати. "Ми повинні утриматися від участі в майбутньому конституційному конгресі, попри наше бажання подальшої карибської інтеграції, оскільки... ця подія лише обмежила б нашу незалежність від британського панування. Я лише молюся, щоб ви зрозуміли наші міркування." Десять секунд минули без жодного звуку з обох боків.\n\nВід Гасті пролунало коротке й переможене речення. "Я розумію." Розмову тоді безцеремонно перервали."
 Caribbean_flavor.52.a: "В іншому світі вони могли б стати друзями."

 Caribbean_flavor.53.t: "Дякую за всю рибу"
 Caribbean_flavor.53.desc: "Напруга в кабінеті Бустаманте була такою густою, що її можна було різати ножем. На поверхні панував спокій. Сам чоловік відкинувся в кріслі, затягуючись однією із сигар, які Ґонсалес приніс як знак доброї волі. Їхній зв'язок досяг свого природного кінця, і здавалося доречним відзначити цей день саме так. Але він був глибоко розлючений. Ґонсалес міг це зрозуміти.\n\nЗробивши останню затяжку й поклавши сигару в попільничку, Бустаманте підвівся та підійшов до вікна. "То це все, гм?" — запитав він незвично байдужим голосом. "Ти був довбано непотрібним. Вийди з мого кабінету й повертайся до Іспанії. Я більше ніколи не хочу тебе бачити."\n\nҐонсалес знав, що отримає таке ставлення, щойно новий прем'єр чітко дасть зрозуміти, що думає про його присутність в уряді, але це не зробило удар менш болючим. За час перебування у Вест-Індії він встиг неабияк прив'язатися до старого; він не вважав його другом, але його презирство все одно було небажаним. "Послухайте, я знаю, що ситуація розвинулася не зовсім так, як ми сподівалися—"\n\nВін не встиг закінчити речення, перш ніж літній чоловік кинувся вперед і вдарив його просто в щелепу, збивши з ніг. "Замовкни! Ти потопив усе, над чим я працював, тієї миті, коли підбив мене на ті репресії, йолопе! Просто йди! Іди!" — кричав старий на закривавлене обличчя Ґонсалеса. Витерши залишки крові об свій костюм, той кивнув, підвівся та попрямував до виходу з кабінету.\n\n"Зачекай", — сказав Бустаманте, і його голос тепер був слабким. Ґонсалес обернувся й побачив, що Бустаманте вже впав у своє офісне крісло, явно виснажений."
 Caribbean_flavor.53.a: "Дякую за сигари."

 Caribbean_flavor.54.t: "Великі мрії"
 Caribbean_flavor.54.desc: "Вільям Г. Гасті увійшов до великої конференц-зали, яку займав величезний дерев'яний стіл, і виявив усередині лише двох людей. За столом перед купою документів, достатньо великою, щоб від одного погляду на неї у Гасті заболіла голова, сиділо знайоме обличчя — Ґрантлі Адамс. Важко було не зрадіти, адже хоча кімната була майже порожньою, енергія на обличчі Адамса заповнювала її більш ніж достатньо. Єдиний інший мешканець цієї просторої кімнати, молодий чоловік, разюче схожий на Адамса, стояв позаду нього, з ідентичною посмішкою на обличчі.\n\nЩойно Гасті повністю увійшов до кімнати, Адамс підвівся й поспішив йому назустріч, енергійно потиснувши руку так, що навіть найтовариськіші люди у Вашинґтоні почервоніли б до вух. "Вільяме! Я такий радий, що ти приїхав, нам так багато треба обговорити, і я маю ще більше за що тобі подякувати!" — засміявся Адамс і повернувся до столу, перш ніж жестом вказати на молодого чоловіка. "Це мій син, Том. Томе, познайомся з Вільямом Гасті, людиною, яка сьогодні втілює наші мрії в життя. Без його політичної хитрості Барбадос ніколи б не став місцем перебування федерації."\n\nГасті тепло посміхнувся молодому Адамсу, чудово розуміючи тягар, який одного дня впаде на його плечі. Том також потиснув руку Гасті: "Пане Гасті, я так багато про вас чув і сподіваюся, що матиму честь працювати з вами, як мій батько. Ми дуже раді, що такий американський джентльмен, як ви, допомагає всьому цьому триматися разом. Ваша мудрість — це те, що змусить усе це працювати, я в цьому впевнений."\n\nГасті подякував молодому чоловікові за добрі слова, і той швидко відступив назад у тінь свого батька, яку сподівався одного дня подолати. Гасті сів і почав розбирати численні документи, які готувалися до конституційного конгресу, включно з багатьма проєктами самої конституції. Ніч мала бути довгою."
 Caribbean_flavor.54.a: "Можна нам трохи кави?"

 Caribbean_flavor.55.t: "Конституційний конгрес Вест-Індії"
 Caribbean_flavor.55.desc: "Колись порожня конференц-зала тепер була переповнена сценою, яка майже навмисно нагадувала картину Говарда Чандлера "Підписання Конституції США". Оскільки Ґрантлі Адамс був господарем, цілком природно, що він звертався до подібних образів, і учасники заходу це чудово розуміли, адже численні обличчя світилися всіма відтінками емоцій. Ерік Вільямс із Тринідаду виглядав особливо роздратованим таким оформленням, і лише збуджений гомін зали змушував його замовкнути. Сам Адамс стояв за трибуною, у тіні американського юриста Вільяма Гасті, одного з архітекторів майбутньої конституції Федерації Вест-Індії.\n\n"Друзі! Сьогодні справді знаменний день, який затьмарить лише кожен наступний день. Кожен день, коли наша федерація житиме й рухатиметься вперед, буде дедалі величнішим днем. Але все починається тут. Усі ви маєте свої проєкти конституції, і я дав вам час подумати та внести зміни, тож я відкриваю дебати." Адамс сів за трибуною та зробив усе можливе, щоб контролювати подальший хаос. Кожен хотів, щоб його голос почули, навіть якщо йому майже не було чого сказати. Групи політиків, що перемовлялися, заповнили кімнату, час від часу їх переривали піднята рука та пишномовна промова, за якими неодмінно слідували крики.\n\nНайгучнішим із тих, хто кричав, був Ерік Вільямс, який категорично виступав проти надмірного американського впливу у федерації. Гектор Аллард, здивувавши всіх, запропонував рішення. "Чому б нам не спертися на британську монархію? Це задовольнить канадців і британців, а близькість США дасть їм достатньо впливу, щоб вони залишилися задоволеними." Ще більш дивним було те, що ідея повільно здобувала підтримку, адже вона дозволила б федерації залишатися якомога незалежнішою.\n\nГ'ю Ширер так само швидко заперечив: "Я знаю рішення і знаю ідеального чоловіка для нього. Томас Білл-молодший — старий гравець американської політики й може виступати послом, його зв'язків буде достатньо.""
 Caribbean_flavor.55.a: "Містер Білл, який стояв у кутку, вже відчував головний біль."

 Caribbean_flavor.56.t: "Результати оголошено!"
 Caribbean_flavor.56.desc: "Томас Білл-молодший, нещодавно призначений послом у новій Федерації Вест-Індії, подбав про те, щоб він став першим голосом, який почує новообраний прем'єр-міністр Г'ю Ширер після оголошення результатів. Він уже робив це раніше й зробить це знову. Він просидів біля телефону майже дві години, а його люди в прямому ефірі повідомляли йому результати. В ідеальному світі він зателефонував би новому прем'єр-міністру ще до того, як той дізнався, що переміг.\n\n"Новобраний прем'єр-міністр Ширер! Це Томас, телефоную привітати вас із перемогою та випити за довге й плідне партнерство!"\n\n"Білл! Старий лисе, я мав здогадатися, що це ти! І переміг не лише я, а й лейбористи та народ. Моя команда працювала довго й наполегливо, але вони майже такі ж старі гравці, як і ти, тож для них це була просто ще одна робоча доба.\n\n"Ти надто скромний, старий друже. Що ж, залишу тебе до твого шампанського та промов, ще раз вітаю, Г'ю."\n\n"Дякую за дзвінок, Білле. Ми з тобою творитимемо великі справи.""
 Caribbean_flavor.56.a: "Клацання і зітхання."

 Caribbean_flavor.57.t: "Стан розгубленості"
 Caribbean_flavor.57.desc: "Скотт Гарріс, переходячи між своєю напівзламаною креольською та англійською з акцентом, сперечався з працівником служби безпеки в аеропорту Барбадосу. Він був американським експатом і мав у валізі кілька тисяч доларів США, з якими приїхав на Барбадос, щоб інвестувати їх. Працівник служби безпеки зрештою покликав клерка пояснити ситуацію.\n\n"Сер, вам потрібен паспорт, щоб в'їхати на Барбадос із Ямайки. Нічого складнішого тут немає; це стандартна міжнародна подорож."\n\nСкотт похитав головою, скрегочучи зубами: "Ні, розумієте, клерки в ямайському аеропорту сказали, що все буде гаразд, що у вас тепер відкриті кордони? Мені треба пройти зараз, у мене вже запізнюється зустріч."\n\n"Ні, сер, між Ямайкою та Барбадосом не існує режиму відкритих кордонів, принаймні такого, про який нам тут повідомили. Ми не можемо вас пропустити. Нам доведеться посадити вас на зворотний рейс."\n\nСкотт стояв у шоці, коли клерк вручив йому рахунок за наступний рейс назад, той самий літак, з якого він щойно вийшов. "Якого біса? Спочатку ви мене не пропускаєте, а тепер ще й виставляєте мені за це рахунок? Чекайте на позов разом із моїми грошима!" Скотт розвернувся й повернувся на літак."
 Caribbean_flavor.57.a: "Клерк зітхнула й повернулася до свого столу, щоб оформити звіт."

 Caribbean_flavor.58.t: "Кінець Комісії Вест-Індії"
 Caribbean_flavor.58.desc: "Вільям Г. Гасті увійшов до знайомої конференц-зали Комісії Вест-Індії й одразу зрозумів, що шансів урятувати її мало, але він неодмінно спробує. Похмурі обличчя тих, хто залишився в Комісії, говорили самі за себе: вона вже була наполовину розпущена, оскільки федерація переманила кількох її членів. Серед цих залишків лише деякі, здавалося, мали намір утримати Комісію та її згасаючу мету, і разом із ними Гасті опинився в несподіваній компанії — до нього приєдналися багато людей, яких він за роки роботи в Комісії встиг недолюблювати. Зітхнувши, він оголосив початок конференції.\n\n"Для початку, як завжди, короткий звіт. Робота над федерацією була надзвичайно успішною, хоча після заворушень у Ямайці все ще зберігається нестабільність, нова нація демонструє зростання стабільності та згуртованості. Однак наша підкомісія з питань іноземного впливу нещодавно повідомила, що, попри наші запобіжні заходи, наша країна все ще є кораблем, відданим на волю моря. Зовнішній вплив так чи інакше проникає в кожне рішення, і нам ще дуже далеко до будь-чого, що нагадувало б повну незалежність, і, звісно, Вільямс усе ще створює проблеми та розгойдує човен. Крім того, тієї уваги з боку США та інших країн, якої ми справді хочемо, ми не отримуємо. Іноземна допомога вичерпується, а наші фінанси, схоже, рухаються до того, що я можу назвати лише катастрофою. Саме тому, та через багато іншого, я прошу Комісію розглянути можливість реформування й продовження її роботи для боротьби з цими проблемами."\n\nУ кімнаті запанувала довга тиша, поки численні втомлені очі дивилися на Гасті, аж тоді напругу порушив останній, від кого Гасті очікував цього, — барон Молсон. "Я, вперше за весь час, погоджуюся з Вільямом."\n\nВін одразу був перерваний, коли численні голоси заговорили одночасно, заглушуючи решту простою заявою."
 Caribbean_flavor.58.a: ""Час розпустити Комісію.""

 Caribbean_flavor.59.t: "Забагато кухарів"
 Caribbean_flavor.59.desc: "'...Я взявся за шпигунську справу так, як качка береться до води. Але тепер, у старшому віці, я озираюся на свою діяльність і замислююся, чи справді я був на правильному боці.'\n\nЛуїс Ґонсалес-Мата замислено зробив паузу, потерши підборіддя. Після свого дещо драматичного відходу з Ямайки та Карибів він повернувся додому, де на нього чекали порожній кабінет, напівщире звільнення зі спецслужб і бажання просто відпочити. І тому єдине розумне заняття, яке він міг придумати, щоб заповнити свої години, — записати все це.\n\nВін роками обмірковував ідею написати книгу, яка документувала б його досвід. Зрештою, він прожив дуже цікаве життя — чорт забирай, Трухільйо досі щороку надсилають йому вітальну листівку на день народження. Але останній епізод на Ямайці позбавив його значної частини бажання продовжувати, та й навряд чи він наблизився б до публікації рукопису перед ним упродовж кількох наступних років — тож, подумав Ґонсалес-Мата, чому б і ні?\n\nЗвісно, вільностей буде небагато. Він уже знав, що йому доведеться применшити свою роль у режимі Бустаманте — на щастя, той і без того був настільки загруз у корупції ЯЛП та іншому іноземному втручанні, що його участь ледве була помітною. По суті, він уникнув покарання, що, безумовно, було полегшенням. І все ж він не хотів ризикувати й розпалювати ситуацію ще більше. В ідеальному світі він повернувся б до Карибів, коли там усе заспокоїться. Не у службових справах, а просто відпочити.\n\nПідсунувши окуляри для читання, він продовжив дряпати пером по паперу, розповідаючи й переповідаючи свої численні відчайдушні пригоди єдиному слухачеві — самому собі."
 Caribbean_flavor.59.a: "Слизький тип."

 Caribbean_flavor.60.t: "На самому краю"
 Caribbean_flavor.60.desc: "Ширер кинув недопалок із балкона курорту «Крейн», той пролетів два десятки поверхів і впав між кількома блоками кондиціонерів, де вже лежала невелика купа недопалків. Томас Білл стояв біля дверей позаду нього, дивлячись на пошарпаного прем'єр-міністра. "Схоже, курорт вийшов добре, містере Ширер. Я впевнений, що ці номери будуть заповнені американцями, які платять, раніше, ніж ви думаєте."\n\n"Не думаю, що мене особливо хвилює курорт, Томасе. Треба зосередитися на тому, щоб утримати Федерацію разом."\n\n"Проблеми з островами, прем'єр-міністре?"\n\n"Проблеми з усім, Томасе. Центральний уряд безсилий, кінґстонські заворушення досі розривають Федерацію навпіл, Вільямс і Менлі обоє за один хибний крок від відокремлення. Я вже просто не знаю, Томасе."\n\nВін на мить замислився, перш ніж відповісти, наближаючись до балкона поруч із Г'ю. Він був міцною скелею для тривожного тремтіння Ширера. "Г'ю, я хотів би допомогти тобі більше, але мене не створено для такої ролі. І все ж я думаю, що ти надто суворий до себе. Великі справи потребують важкої праці, а ти будуєш тут, у Федерації, щось справді велике — країну, об'єднану, острови несхожих народів, сплавлені в одне ціле."\n\n"Якщо я зможу втримати її разом." Томас кивнув: "Якщо зможеш втримати її разом. Але навіть Америка не залишалася єдиною весь час. Я впевнений, що батьки-засновники опинилися свого часу в не надто відмінному від твого становищі, намагаючись не дати колоніям пожерти одна одну. Можливо, ти зможеш чогось у них навчитися. Я надішлю до твого кабінету свій примірник "Демократії в Америці". Прочитай її, Г'ю."\n\n"Гадаю, я можу поглянути.""
 Caribbean_flavor.60.a: "Його тон сказав Біллу, що він навіть не відкриє посилку."

 Caribbean_flavor.61.t: "Час і місце"
 Caribbean_flavor.61.desc: "Два різкі удари змусили Томаса Соуелла прокинутися за робочим столом. Сонно він перевірив час — була глибока ніч, і він знову забув піти в розумний час. І, очевидно, хтось був так само божевільний. Поспіхом привівши себе до ладу, Соуелл крикнув відвідувачеві зайти. Це, з усіх людей, був Вільям Гасті. "Вибачте за час, — сказав Гасті з винуватою посмішкою. — Але я теж працював допізна й подумав, що маю перевірити, як там нова висхідна зірка Комісії. Над чим працюєте?"\n\nСоуелл намагався придушити роздратування, що наростало всередині. Чоловік говорив із ним так, наче він був обдарованим школярем. "Це не проблема, сер. Я окреслював нову пропозицію щодо праці у федерації. Чи можу я чимось допомогти—"\n\nПерш ніж він зміг продовжити, Гасті підійшов і побіжно переглянув те, що Соуелл уже написав. Він стиснув губи й схвально кивнув. "Поки що все чудово. Хоча я радив би вам переглянути..." він вказав на розділ про лікарняні на федеральному рівні. "Оцю частину. Комісія може зробити лише стільки в дорадчій ролі. І, ну..." Гасті кинув на нього найбільш поблажливий погляд. "Ви й так будете під пильним наглядом, особливо. Це буде нелегко—"\n\n"Містере Гасті, я повністю усвідомлюю свої обов'язки, оскільки мені повідомили про них під час призначення на цю посаду. Я й гадки не маю, що ви могли мати на увазі, кажучи про те, що я буду під... наглядом." Це була брехня. Вони були двома чорношкірими чоловіками у Вест-Індії, у Комісії, де домінували білі, тож це було нескладно зрозуміти. "Але я впевнений, що зможу впоратися. Уже дуже пізно, і я хочу закінчити це, щоб піти додому. Не могли б ви залишити мене з цим?"\n\nГасті виглядав так, ніби Соуелл його вдарив. Він моргнув. "О. Що ж, добре." Він поплентався геть, сумно озираючись на Соуелла, коли виходив."
 Caribbean_flavor.61.a: "Перше враження має значення."

 Caribbean_flavor.62.t: "Одна любов"
 Caribbean_flavor.62.desc: "Бриджтаун живе так, як ніколи раніше. Вулиці, які колись стихали після заходу сонця, тепер відлунюють ритмами сталевих барабанів, гулом басів і вигуками вуличних торговців, які продають пеперпот і смажені плантани. Перший Панкарибський музичний фестиваль зібрав тисячі людей з усіх островів та з-за їхніх меж. Серед них — нова порода американських відвідувачів: заможні, довговолосі, закутані в тай-дай, модні молоді шукачі "автентичності", які прагнуть зануритися в культуру, яку знали лише через привезені платівки та перекази з других рук. Вони блукають вузькими провулками, спілкуються з місцевими та охоче спускають важко зароблені мамині й татусеві долари.\n\nКоли сутінки опускаються на гавань, натовп рушає до головної сцени — відкритої платформи, обвішаної вогнями, що сяють на тлі темряви, яка згущується. Боб Марлі виходить уперед, його дреди ловлять світло ліхтарів, а гітара недбало висить через плече. Вітання оглушливі, але він чекає тиші. Спочатку він говорить із похвалою про фестиваль, людей, мрію про об'єднані Кариби, чиї кордони є мостами, а не бар'єрами. Його слова теплі, але погляд твердий, і невдовзі його тон стає глибшим. Бідність, упередження, примарні тіні колоніалізму: він попереджає, що їх неможливо заглушити самою лише музикою. "Лише разом, як один народ, як сини й доньки всемогутнього Джа, ми можемо звільнитися від диявола, який нас оточує."\n\nТиша, що настає після цього, здається важкою, хоча на цей момент половина натовпу вже добряче напилася. Потім лунають перші акорди, і натовп вибухає криками, сльозами й танцями. Десь серед маси людей американський студент стискає фотоапарат, роблячи знімок, який зробить його кар'єру й перетворить Марлі із зірки на ікону."
 Caribbean_flavor.62.a: "Джа? Хто це?"

 Caribbean_flavor.63.t: "Нові пірати"
 Caribbean_flavor.63.desc: "Мангеттен ніколи не спав, хоча чоловіки, що тулилися навколо конференц-столу у своїх пом'ятих костюмах, безперечно, хотіли б поспати. Перед ними лежав попередній факс завтрашнього Wall Street Journal, звична відстороненість газети була зруйнована нахабним, величезним заголовком:\n\n"ФВІФ НА МЕЖІ — ВЕСТ-ІНДІЇ ЗІТКНУЛИСЯ З ФІНАНСОВИМ КОЛАПСОМ"\n\nФедерація Вест-Індії, яку колись називали Карибським дивом, перетворилася з улюблениці Волл-стріт на повну фінансову катастрофу. Туризм сповільнився через зростання цін на нафту, що вдарило по авіаперевезеннях, виплати за боргами різко зросли, а роздута бюрократія уряду не могла ані ефективно збирати податки, ані скорочувати видатки. Друкування більшої кількості грошей було єдиним варіантом, що залишився, і тепер карибський долар стрімко котився до нікчемності. На кону стояли статки. Недобудовані курорти, незабезпечені облігації, позики, що зависли в підвішеному стані, — і багато з цих позик надходили від джерел, які вважали переламування ніг кращою альтернативою зверненню до адвокатів. Попри це, один чоловік за столом не поділяв атмосферу відчаю. Відкинувшись назад і сьорбаючи скотч, він почав бачити в тумані обриси чогось схожого на план.\n\nПізніше, у тихому ресторані в центрі міста, ідея набула чіткіших обрисів. За стейком і вином чоловік із Волл-стріт вечеряв із незвичним гостем: молодим чорношкірим економістом, нещодавно залученим до Комісії Федерації, містером Соуеллом, який запропонував деякі... неортодоксальні ідеї. Прибрати регулювання. Поставити профспілки на їхнє місце. Переробити ФВІФ на щось більше, ніж бюрократичний пережиток імперії десь між імперіалізмом і соціалізмом. Місце, де інвестиції передусім захищені. У нього були відповіді на все: як відновити валюту, як прибрати банди з вулиць і, найважливіше, як позбутися зграї Ґвідо, які хотіли побудувати свої нові казино. Чоловік із Волл-стріт слухав. Усе це мало сенс. І найважливіше — Соуелл був першою людиною, яка не говорила про "порятунок" і "мінімізацію втрат". Він бачив можливість. Що може бути більш американським? Завтрашні ринки все одно кровоточитимуть червоним. Долар і далі падатиме. Але, можливо, чоловік із Мангеттена знайшов свій наступний крок."
 Caribbean_flavor.63.a: "У Дядька Сема завжди є план."

 Caribbean_flavor.64.t: "Криза в Кінґстоні"
 Caribbean_flavor.64.desc: "У залі засідань було душно. Не через нестачу повітря, хоча карибська вологість важко висіла в кожному кутку, а через ледве прихований відчай, що читався на кожному обличчі під час екстреного засідання Комісії. Сивоволосий і похмурий сер барон Молсон підвівся, щоб виступити.\n\n"Сполучені Штати необхідно переконати надати допомогу. Натомість Канада візьме на себе роль гаранта. Відповідно до конституції Федерації, Оттава отримає надзвичайні повноваження продавати Вашинґтону ділянки невикористовуваної коронної землі як заставу, гарантуючи нашим партнерам у Вашинґтоні їхню безпеку. Водночас наш нагляд за фінансами Федерації буде розширено, щоб навести порядок там, де Кінґстон явно зазнав невдачі."\n\nЗалою прокотилося схвальне гудіння. План був безпечним, знайомим, відповідальним. Федерація, що розвалювалася, стабілізована рукою надійного старшого домініону. І тоді пролунав новий голос — голос Томаса Соуелла.\n\n"Це не проблема ліквідності, панове, — заявив він, — це структурна проблема. Замазування цього боргу канадськими облігаціями нічого не зробить, крім відтермінування неминучого. Сама Федерація гниє зсередини через свою задушливу бюрократію та середньовічну організацію праці. Якщо Америка збирається надати допомогу, вона повинна супроводжуватися фундаментальною перебудовою за принципами американського бізнесу."\n\nУ кімнаті запанувала тривога. Соуелл не був старшим членом — і навіть не був карибцем, хоча був одним із небагатьох у кімнаті, хто не почервонів би яскраво-рожевим під сонцем. Острови були крихкими. Натиснути надто сильно — і вся федерація могла б зруйнуватися під вагою заворушень. Що важливіше, його пропозиція дуже скидалася на імперіалізм під іншою назвою. Аргументи ходили туди й назад. Канадці наполягали на повільному й поступовому русі. Союзники Соуелла вимагали негайних змін. Десь посередині Гасті, зраджуючи своє ім'я, тримався середньої лінії, пропонуючи поступовий перехід до більш вільноринкових принципів. Зрештою всі погляди звернулися назовні, за межі Кінґстона, за межі Оттави, через море до Вашинґтона. Сполучені Штати матимуть останнє слово."
 Caribbean_flavor.64.a: "Полум'яна проповідь Соуелла — нісенітниця. Ми працюватимемо з Молсоном."
 Caribbean_flavor.64.b: "Ми не повторюватимемо тих самих помилок. Залучіть Соуелла."
 USA_Canadian_Plan_tt: "§YМи оберемо §ZКанадський§! план, запропонувавши §MФедерації Вест-Індії§! вкрай необхідну допомогу за рахунок §Zканадських§! коштів в обмін на посилення §Zканадського§! впливу.§!"
 USA_American_Plan_tt: "§YМи оберемо §mплан Соуелла§!, змусивши §MФедерацію Вест-Індії§! сісти за стіл переговорів і вимагаючи приватизації в обмін на допомогу.§!"

 Caribbean_flavor.65.t: "Початок будівництва"
 Caribbean_flavor.65.desc: ""Чудове місце, що ж тут буде." Штаб-сержант Комптон із Корпусу інженерів армії копнув носком черевика розпушену землю. Пальми й чагарники зникали під ударами сокир і гуркотом пилок.\n\nЛейтенант Вінсент із ВМС Федерації посміхнувся. "Спільний проєкт бази логічно буде набагато більшим за будь-які старіші об'єкти, чи не так?"\n\nХвилі билися об береги Тобаго, куди інспектори з Америки, Канади та Вест-Індії приїхали оглянути Ділянку 10 — обране місце для нової спільної військово-морської бази, яка мала замінити занедбані об'єкти островів. Старий Славний і прапор Федерації перепліталися в літньому вітрі над табличкою, що вихваляла переваги спільної безпеки в Карибах.\n\nНазовні виріс натовп, що виріс. Їхні вигуки з вимогою, щоб солдати залишили острів, тонули в безперервному гуркоті дрилів і молотків. Їхній крик до уряду в Тринідаді почути їх заглушував рев винищувачів над головою. Крики за відокремлення майже заглушувалися посадками гелікоптерів. Майже.\n\nКомптон вказав на крихітний натовп протестувальників, цятку на розчищеному ландшафті. "Це, е-е, тобагонці?"\n\nВінсент засміявся. "Усі десятеро, так.""
 Caribbean_flavor.65.a: "Жменька острів'ян не повинна бути проблемою."

 Caribbean_flavor.66.t: "Марони Тобаго"
 Caribbean_flavor.66.desc: "Штаб-сержант Комптон не очікував, що ранковим привітанням стане удар кийком по вікну його кабінету.\n\nЧоловіки були одягнені в камуфляж військових Вест-Індії. Вони увірвалися всередину, викрикуючи накази, і Комптон опустився на підлогу, коли сталевий ствол уперся йому в лоб.\n\n"То що, заколот?" — запитав він, склавши руки на потилиці, коли вони виводили його назовні.\n\nОдин із солдатів посміхнувся, піднявши стиснутий кулак. "Визволення."\n\nДілянку 10 захопили за лічені хвилини, не зробивши жодного пострілу. Комптон знайшов Вінсента серед приголомшених полонених: офіцерів і робітників, яких змусили сидіти на землі посеред поля, серед свіжозалитих фундаментів їхньої майбутньої бази. Це були місця в першому ряду на визволенні всього Тобаго, коли заколотники надягли червоні бандани, підняли прапори й рушили вглиб острова.\n\nКоли сонячне світло наблизилося до далекого океану, один із солдатів піднявся на імпровізовану трибуну.\n\n"Брати, — звернувся він до цивільних, які прийшли подивитися. — Ви стали свідками початку нової історії наших островів. Ми, марони, запалили перший сірник визвольного вогню, який охопить цю країну. Від Тринідаду й Тобаго до Ямайки — нехай Вест-Індія буде вільною від колоніалізму нині й навіки!"\n\nВінсент подякував одному з маронів, коли ті роздавали полоненим воду та їжу. Він зупинився й подивився на Комптона, який жував свій бутерброд."
 Caribbean_flavor.66.a: "Гадаю, бували й гірші ситуації із заручниками."

 Caribbean_flavor.67.t: "Страх перед чорним раєм"
 Caribbean_flavor.67.desc: "Записи Овального кабінету Білого дому: Карибська криза, повстання маронів.\n\n(ПРЕЗИДЕНТ): "Про скількох заручників ідеться?"\n(РАДНИК 1): "Занадто багато, це бомба уповільненої дії, яка чекає на вибух, якщо ситуація погіршиться."\nPOTUS: "А мексиканська участь? Кастро?"\n(РАДНИК 2): "На цей момент? Важко сказати. SNI замовкли, як і агенти Гавани на півдні."\n(РАДНИК 3): "Мінімум правдоподібного заперечення, про всяк випадок, якщо це дасть зворотний ефект, наче ми не знаємо, звідки повстанці взяли зброю..."\n(ПРЕЗИДЕНТ): "Які в нас варіанти, тут потрібна відповідна сила ЯКНАЙШВИДШЕ."\n(A2): "Морська піхота швидко вирішить це питання."\n(A3): "І запросить пекельний піарний вогонь прямо на Вашинґтон, усі й так сприймають присутність США там як окупацію."\n(A1): "Американські морпіхи на землі Тобаго для преси можуть так само бути вермахтом, що тупотить навколо."\n(ПРЕЗИДЕНТ): "А Сили оборони Вест-Індії?"\n(A2): "Зеленіші за траву, але навчені саме для цієї ситуації."\n(A1): "Щедра оцінка. Вони зможуть витягнути заручників?"\n(A3): "Якщо ні, це буде кривава баня."\n(A1): "Ми не можемо допустити повторення Куби."\n(A2): "(Зітхає) Пентагон очікуватиме на відповідь протягом години, до того часу ми маємо все підготувати.""
 Caribbean_flavor.67.a: "Ми повинні бути обережними й не переступати межу, нехай Сили оборони Вест-Індії зроблять свою роботу."
 Caribbean_flavor.67.b: "Ми не можемо ризикувати, введіть морську піхоту."
 USA_WIF_Intervention_tt: "§RМи вирішимо сформувати Панкарибські інтервенційні сили, попри ризики, пов'язані із залученням наших недосвідчених партнерів.§!"
 USA_American_Intervention_tt: "§RМи вирішимо безпосередньо провести інтервенцію, що матиме жахливі наслідки.§!"

 Caribbean_flavor.68.t: "Переваги пунктуальності"
 Caribbean_flavor.68.desc: ""Що, бляха, означає, що їх досі немає? Операція через 20 годин, а вони все ще в якійсь довбаній джунглях?!" Голос полковника Трабшоу полетів услід за кинутою текою, змусивши молодого вест-індійського лейтенанта пригнутися. Отруйні, ефірні шипи летіли від американця, якого обдували численні настільні вентилятори. Лейтенант ковтнув, не маючи куди тікати від розлюченого бика перед собою.\n\n"Ні, сер, не в джунглях. Розвіддані, отримані в останню хвилину, призвели до рішення, що більш спеціалізовану підготовку можна було б провести-"\n\n"Мені. до. сраки. Це військова операція. Цих інженерів, американців, як довго тримають у заручниках? Хто зіпсував наш розклад на основі чуток, про які я навіть не отримував доповіді?" — шипів Трабшоу. День за днем помилка за недоглядом за некомпетентністю. Необхідні підписи людей з різних кінців Карибів, які зрештою виявилися не такими вже й необхідними, труднощі з пошуком персоналу, боротьба за створення чіткого оперативного розкладу — лише це зайняло майже кілька днів. А тепер йому повідомляли, що хтось просто проігнорував його?\n\nНавіщо його взагалі послали радити цим аматорам?\n\nЛейтенант віддав честь, намагаючись зберегти свій оленячий вираз обличчя перед полковником. "Усе буде готово, сер!"\n\nТрабшоу впав у крісло, залишивши лейтенанта незграбно нерухомим на мить. Його охопило роздратування, кошмари завтрашнього дня мучили його. "Вийди", — похмуро сказав він, тримаючи голову в руках. Ще один прорахунок. Він почув, як лейтенант вийшов із кабінету й пішов коридором, перш ніж у його голові промайнула остання жахлива думка. Він кинувся до дверей, безпорадно кричачи в уже порожній коридор.\n\n"Зачекай, ти не сказав, хто віддав наказ! Хто, хто це зробив?""
 Caribbean_flavor.68.a: ""Хто має повноваження?""

 Caribbean_flavor.69.t: "На бенкет у Порту Свиней."
 Caribbean_flavor.69.desc: "НОВИНИ: Американські заручники вбиті через провальну відповідь Сил оборони Вест-Індії на повстання маронів, що завершилася катастрофою!\n\nТРИПІЛЛЯ — ТРИНІДАД: У раю панують пекло й прокляття, оскільки повстання чорної сили маронів на острові Тобаго було зустрінуте Силами оборони Вест-Індії, а операція з придушення повстання обернулася кривавою катастрофою! Те, що мало бути високопрофесійними національними гвардійськими силами, підкріпленими американським військовим фінансуванням і бойовим досвідом, перетворилося на провал операції зі звільнення заручників, коли афрокарибські революціонери змогли застати Сили оборони Вест-Індії зненацька значно сильніше, ніж хтось міг передбачити.\n\nМасштаб катастрофи можна виміряти тілами, що вкривають пляжі та дороги, де бої на Тобаго були найзапеклішими, причому надто багато загиблих були членами інженерного корпусу армії США, які потрапили під перехресний вогонь солдатів Сил оборони Вест-Індії та повстанських ополченців. Хоча повстання маронів зрештою було придушене, будучи значно меншими за чисельністю та озброєнням, ніж сили Вест-Індії, американській підтримці яких вони протистояли, недбала робота підтримуваних Америкою сил оборони не дозволила зробити це без цивільних жертв під час запеклих наземних боїв.\n\nТриває масштабний аналіз помилки Сил оборони Вест-Індії в боротьбі з тероризмом, але видимі докази вже дають яскраву картину відсутності підготовки та злагодженості, продемонстрованих на Тобаго. За погану роботу Сил оборони Вест-Індії на Тобаго можна одразу звинуватити хронічну нестачу ефективної організації та координації, а також проблеми зі зв'язком і перевантажену структуру командування. У будь-якому разі ця трагедія вказує на системні проблеми, що мучать оборонний апарат Вест-Індії та участь Америки в ньому, і, ймовірно, залишиться похмурим днем в історії зобов'язань Сполучених Штатів щодо безпеки в Карибському регіоні."
 Caribbean_flavor.69.a: "...підготуйте наші щирі співчуття родинам загиблих на Тобаго."

 Caribbean_flavor.70.t: "Кров на їхніх руках"
 Caribbean_flavor.70.desc: "Центр Ричмонда був заблокований, міські артерії заповнилися демонстрантами, які невпинно рухалися до свого мітингу в парку Монро. Повітря наповнювали вигуки, гнівні образи на адресу Вашинґтона та костюмів, через яких їхні хлопці загинули. Один із них, Девід Вотерман, зрештою народився саме тут; його мати Джейн чекала в парку, щоб виступити з промовою, поки тисячі людей ішли висловити їй свою підтримку. Герберт подивився на фотографів і телевізійні камери на краю парку, які фіксували потік людей, що заходили всередину. Яку картину вони покажуть.\n\nВін спеціально прилетів сюди з Нью-Йорка, прагнучи долучитися відтоді, як прочитав про цю катастрофу у своїй кімнаті в гуртожитку. Справи були викривальними: США дозволили Вест-Індії незграбно довести ситуацію до різанини заручників, і заради чого? Щоб їхній лідер і президент могли почуватися рівними? Що ж, тепер вони справді були рівними в його очах. Республіканці Нью-Йоркського університету були шалені від цього рішення; що взагалі думали військові? Але попри те, що він був їхнім секретарем, він приїхав додому сам; це був момент для громади.\n\nНатовпу знадобився певний час, щоб розміститися, і в парку, і навколо нього, перш ніж на одній із трав'яних ділянок встановили невелику імпровізовану сцену. Герберт ледве бачив через дерева, але навколо розставили гучномовці для слухачів. Він проштовхнувся до сцени, побачивши Джейн, яка сиділа й здавалася зовсім маленькою на своєму стільці. Вона тримала фотографію Девіда серед групи чоловіків, яких він не впізнав. Один із них виступив першим.\n\n"Вітаю, справжні американці, — заявив він натовпу, — з цією можливістю показати федералам, що купка чорномазих і негритянських терористів не повинна відповідати за американські життя. Ми дбаємо про своїх, і сьогодні по всій країні ми це покажемо!" Він говорив із сільським південно-західним акцентом, Герберт добре його впізнав, піднявши брову й озирнувшись. Деякі поділяли його шок від цієї зміни; цього ніхто не очікував."
 Caribbean_flavor.70.a: "Але багато інших навколо них радісно вигукували, вимагаючи справедливості для натовпу."

 Caribbean_flavor.71.t: "Мокра робота"
 Caribbean_flavor.71.desc: "Чесно кажучи, усе було не так уже й погано. Насправді майже нічого не змінилося: "камера", до якої його запроторили, була тією самою казарменною кімнатою, де він спав відтоді, як його підрозділ відправили наглядати за будівництвом бази. Багато в чому звільнення від інженерних обов'язків навіть можна було вважати покращенням. У найгіршому разі деякі дні могли бути трохи нудними, з годинами, проведеними в спогляданні стелі з комфорту свого ліжка. З іншого боку, у більшість днів він міг розраховувати на деякий час для жартів із Кофі.\n\nЙому знадобився лише тиждень, щоб дізнатися його ім'я; до кінця другого тижня здавалося, ніби вони були знайомі все життя. Двічі на день, коли молодий охоронець приносив йому їжу, вони проводили наступні пів години, жартуючи про абсурдність їхніх відповідних ситуацій. Він швидко розвіяв думку, що його група має намір завдати їм шкоди; йому та його "товаришам" потрібні були заручники лише як страховка, поки Вашинґтон не поступиться їхній давно заслуженій незалежності. "Ось-ось", — постійно повторював він із щирою посмішкою та іскрою в очах, яка майже переконувала навіть його, залишаючи сьогоднішню тарілку, як завжди, на сусідньому столі. Наступна мить була білим, запаморочливим розмиттям.\n\nВін ледве міг розрізнити кілька приглушених хлопків крізь дзвін у вухах. Усі інші відчуття були вирвані з нього, коли він спіткнувся й упав на землю в лабіринті розгубленості. Минуло лише кілька секунд, перш ніж він відчув, як його тіло знову піднімають. Зір усе ще відновлювався після спалаху, але він усе ж зміг помітити знаки Корпусу морської піхоти США на рукаві, який підтримував його вагу.\n\n"Гей. Ти в порядку?" — промовила постать, ведучи його хиткими кроками до виходу. "Ну ж бо, тепер ти в безпеці. Кавалерія прибула", — додала вона з підморгуванням, яке щосили намагалося бути втішним. Але він цього не помітив; його увага була прикута до калюжі крові, що утворилася навколо трупа, з яким він жартував лише кілька хвилин тому, просочуючи розкидані рештки його ще теплого обіду."
 Caribbean_flavor.71.a: "До сутінків єдиним відтінком марунового, що залишився на острові, була фарба, якою вкрили пісок."

 Caribbean_flavor.72.t: "Поминальна служба"
 Caribbean_flavor.72.desc: ""Я мушу наголосити, що ситуація перебуває під нашим повним контролем. Її було швидко врегульовано за допомогою наших військ, на щастя, з мінімальними супутніми втратами." Робота Даніеля полягала в тому, щоб гасити пожежі. Саме в цьому він переконався за роки роботи представником при місії США в ОАД. Сьогоднішнє полум'я було запалене останньою інтервенцією на Тобаго, яку тепер йому доводилося захищати перед цілою зграєю грифів, готових його розірвати.\n\n"Наша делегація поділяє занепокоєння щодо прямого відправлення американського персоналу замість того, щоб довірити місцевим військовим вирішення, знову ж таки, дуже *місцевої* кризи." Серед усіх цих хижих птахів не було жодного ненаситнішого за представника Мексики, який, здавалося, отримував садистське задоволення, катуючи його протягом останньої години. "Деякі члени цього органу можуть побоюватися, що це ще більше підтверджує їхні раніше висловлені побоювання щодо досить владної позиції США у справах Карибів."\n\n"Я хотів би нагадати асамблеї, що головним занепокоєнням нашої адміністрації є забезпечення стабільності регіону та безпеки його держав-членів." Навіть Даніель міг бачити, як сила його власних аргументів тане на очах, що лише заохочувало чоловіка продовжувати свої удари. Що він мав сказати? Визнання того, що військові Вест-Індії були погано підготовлені до боротьби з повстанцями, лише сильніше розпалило б бурю. "Знову ж таки, я не маю права обговорювати—"\n\n"Ви можете так казати, але дехто з нас також міг би поставити під сумнів нещодавню економічну участь США у Федерації та її роль у подіях, що призвели до цього. Дехто навіть може зайти так далеко, щоб заявити, що американська присутність є прямим фактором, що сприяє тій нестабільності, про яку ви говорите." Зала знову вибухнула хаосом, делегати кричали один на одного, поки генеральний секретар марно намагався закликати до порядку. І серед усього цього він усе ще бачив погляд мексиканського чиновника, що пронизував його, ледве намагаючись приховати натяк на посмішку."
 Caribbean_flavor.72.a: "Немає сенсу намагатися підтримувати маску, яка вже одного разу впала."

 Caribbean_flavor.73.t: "Хвилі через океан"
 Caribbean_flavor.73.desc: "У Бірмінгемі, штат Алабама, було три будівлі, розташовані на протилежних кінцях міста. Однією був будинок матері-одиначки Естер Вільямс та її двох дітей, іншою — трактир «Оленяча голова», а третьою — будинок якогось Джорджа Фіша, 32-річного молодого чоловіка, який жив сам. Хоча географічно вони були на протилежних кінцях міста, атмосфера, що панувала в цих трьох будівлях липкої суботньої ночі, не могла бути більш різною.\n\nУ трактирі «Оленяча голова» вирувало життя. Його відвідувачі весело цокалися келихами й насолоджувалися ніччю відпочинку після довгого робочого тижня. Усі вони були чоловіками й, звісно, білими. І коли їхні пляшки пива та склянки віскі дзенькали, усі вони відчували невизначене полегшення. Те, яке мало хто з них любив визнавати, але яке відчували всі. Якщо військові могли придушити чорних на Карибах, то вдома вони напевно зроблять те саме з цими бунтівниками, чи не так?\n\nНа іншому кінці міста Естер Вільямс забрала дітей додому на годину раніше. Вона бачила кількох білих чоловіків, що нишпорили в районі й точно там не жили, і, чорт забирай, не збиралася ризикувати. Мислено підраховуючи вартість продуктів за той тиждень, вона переконалася, що двічі замкнула двері — зрештою, минулого тижня будинок Лебланків унизу вулицею пограбували. Ніколи не було легко бути чорною сім'єю на Півдні, але здавалося, що це ставало дедалі важче.\n\nНа околиці міста Джордж Фіш сидів і полірував одну зі своїх численних гвинтівок. Він стежив за новинами про заворушення у Вест-Індії, як яструб, і що більше дізнавався, то сильніше збуджувався. Коли він почув, що чорних нарешті придушили, він зрозумів, що має робити. Навіть якщо він не міг вступити до армії, він міг допомогти своїй країні іншими способами. Через кілька днів у місті мав відбутися марш за громадянські права, і він зі своїми приятелями збиралися зробити те, що було потрібно. Вони відновлять порядок."
 Caribbean_flavor.73.a: "Дії мають наслідки."

 Caribbean_flavor.74.t: "Г'ю Ширер іде у відставку"
 Caribbean_flavor.74.desc: "Ширер виглядав напівмертвим за своїм столом, коли жестом запросив Гасті сісти. Він був тут не в цілком офіційній якості, радше з ввічливості. Гасті заслуговував на пояснення, на те, щоб почути, чому Ширер здається.\n\n"Розкажи мені, що відбувається, Г'ю. Ми так далеко зайшли, я знаю, що не все йде добре—"\n\n"Не йде добре, Вільяме? Після допомоги я ледве взагалі прем'єр-міністр. Мої канадські куратори щодня тягають мене за собою; я майже не маю контролю над власним кабінетом, над власним життям. Незалежність була мрією, від якої ми зараз прокидаємося. Ми просто недостатньо великі, у нас немає економіки, у нас немає політичної ваги, якою можна розмахувати. Просто немає, Гасті." Ширер опустив голову в руки.\n\n"Г'ю, я розумію. Рік тому все виглядало набагато світліше. Я не тут, щоб тебе переконувати, я знаю, коли ти вже щось вирішив. Просто пообіцяй мені. Пообіцяй, що ти протримаєшся до кінця. Заради людей. Якщо вони мусять побачити, як ти йдеш у відставку, нехай думають, що мрія все ще жива."\n\n"Ти хочеш, щоб я їм брехав, Вільяме?"\n\n"Так, сер, хочу. Якщо вони все ще можуть мріяти, то, можливо, одного дня ми перетворимо це на реальність."\n\nГ'ю Ширер, перший прем'єр-міністр Федерації Вест-Індії, кивнув і передав Гасті свою заяву про відставку."
 Caribbean_flavor.74.a: "Як би сильно він не ненавидів це визнавати, Гасті відчув, що заздрить."

 Caribbean_flavor.75.t: "План Соуелла"
 Caribbean_flavor.75.desc: "Гасті вже досить довго не був у Комісії, поведінка, яку він намагався не перетворювати на звичку. Правду кажучи, останнім часом вони навіть нечасто збиралися, надто багато хаосу, щоб зібрати стільки важливих людей в одній кімнаті. Нарешті, однак, вони зібрали всіх разом уперше після допомоги від США. Саме тиск американців насправді підштовхнув до проведення цієї зустрічі, переконавшись, що кожен член Комісії буде присутній, щоб прочитати новий звіт Томаса Соуелла.\n\nУ кімнаті було тихо, поки Соуелл читав звіт рядок за рядком і сторінка за сторінкою. Ніхто його не перебивав, більшість розуміла, що це насправді не рекомендація для обговорення Комісією. Це була "Довга рука Свободи", як любили казати американці, їхні реформи, які вони збиралися продавити спочатку через Комісію, а потім через парламент Федерації. Комісія була тут лише для того, щоб переконатися, що всі знають план подальших дій, і виконувати роль уславлених перевіряльників граматики для юридичної та бюрократичної мови плану реформ.\n\nДля Гасті звіт навіть не був найгіршою частиною зустрічі. Це був Соуелл. Він читав звіт так, ніби знав, що переміг, ніби нарешті зможе продати федерацію тому, хто запропонує найвищу ціну, як завжди мріяв. Але Гасті ще не хвилювався. Поки що. Соуелл забув про дещо, про когось, хто ненавидів його навіть більше, ніж Гасті."
 Caribbean_flavor.75.a: "Зачекайте, поки Ерік Вільямс про це дізнається."

 Caribbean_flavor.76.t: "Загрози відокремлення"
 Caribbean_flavor.76.desc: "Томас Білл-молодший хотів хоча б один день прожити без нового головного болю. Ерік Вільямс дуже хотів йому в цьому перешкодити. "Це обурливо, Білле! Це справді те, чого хочуть США? Ця реформа покладе край федерації, якою ми її знаємо, ми просто станемо маріонетками більших економік, не маючи власного ґрунту під ногами." Вільямс розвів руками, розмахуючи пакетом зі звітом, наче прапором.\n\n"Містере Вільямс, цю реформу запропонували не самі США, вона була підготовлена за допомогою членів Комісії, щоб запропонувати план, який стабілізує економіку федерації та дозволить якнайкраще використати допомогу, яку надають Сполучені Штати."\n\n"Ви залучили Соуелла, ледь не члена Комісії та фактично грифа, який продасться тому, хто готовий заплатити, не замислюючись. Я ледве вірю, що США не знали про його радикальні економічні ідеї."\n\n"Містер Соуелл не має радикальних ідей. Чи вважає він, що нинішня економіка федерації нездатна самостійно триматися на плаву? Так, і, схоже, він може мати рацію."\n\nВільямс на мить витріщився на Білла. "Що ж, Томасе, ми не збираємося просто лежати й дозволяти цьому відбуватися. Якщо США хочуть план реформ, я дам їм такий, що зможе стабілізувати економіку та вивести нас із нафтової кризи. США підтримають цей план, Білле, а якщо ні, то я не бачу майбутнього федерації, до якого входять Тринідад і Тобаго."\n\nБілл відчув, як його очі широко розкрилися. "Еріку, ти ж не можеш серйозно погрожувати відокремленням. Це розколе федерацію навпіл, ти цього хочеш?"\n\n"Не має значення, чого я хочу, має значення те, що ти збираєшся зробити, Томасе.""
 Caribbean_flavor.76.a: ""Це не спрацює, Еріку, ми не збираємося просто здатися цього разу.""
 USA_Sowell_Reform_tt: "§YМи продовжимо з §mпланом Соуелла§!, це може мати жахливі наслідки, якщо Вільямс дотримається своєї обіцянки.§!"
 Caribbean_flavor.76.b: ""Гаразд, тоді розкажи мені про цей план. Мені доведеться зробити кілька дзвінків.""
 USA_Williams_Reform_tt: "§YМи продовжимо з §Mпланом Вільямса§!, допомагаючи створити більш незалежні Кариби.§!"

 Caribbean_flavor.77.t: "Федерація розколюється"
 Caribbean_flavor.77.desc: "Вільям Г. Гасті втомився чекати. Він майже п'ятнадцять хвилин ходив туди-сюди приймальнею Соуелла, поки асистент за столом щось записував у купі бухгалтерських книг. Гасті перевів погляд із заклопотаного клерка за столом на двері кабінету Соуелла й просто зайшов. Двері зачинилися за ним, перш ніж асистент підвів погляд від свого екрана.\n\nУсередині розкішного кабінету сидів Соуелл, поруч із ним височіла величезна купа підписаних паперів. Він відірвався від письма й насупився: "Містере Гасті, я трохи зайнятий..."\n\nВільям підійшов до Соуелла й змахнув купу паперів із його столу, перш ніж грюкнути рукою по столу: "Соуелле, ти справді замкнувся у своєму кабінеті, поки твої реформи сіють хаос у Федерації!"\n\n"Вільяме, якого біса! Про що ти взагалі говориш?"\n\n"Ти справді сидів замкнений тут, чи не так? Ерік Вільямс відокремився, Соуелле. Тринідад і Тобаго покинули Федерацію, наша економіка на межі краху, половину нашого адміністративного персоналу вирізано, а мільйони доларів, які ми вклали в проєкти там, зникли."\n\nСоуелл затнувся, потім замовк і витріщився на Гасті, у його голові було помітно, як шестерні починають обертатися, а руками пробігло тремтіння. "Ми... ми переживемо це. Економіка Вільямса все одно була для нас тягарем. Тепер, коли вона більше не тягне нас вниз, ми підемо навіть далі, ніж прогнозувалося." Соуелл підвів погляд, зустрівшись очима з Гасті. "Федерація стане взірцевою економікою. Ми можемо, ми повинні процвітати, і ми будемо, Гасті. Будемо."\n\nГасті не міг нічого, крім як дивитися на рішучість, на безумство в очах Соуелла. Не сказавши ні слова, він розвернувся й пішов."
 Caribbean_flavor.77.a: "Якщо це майбутнє, я не впевнений, що зможу бути його частиною."

 Caribbean_flavor.78.t: ""
 Caribbean_flavor.78.desc: ""
 Caribbean_flavor.78.a: ""

 Caribbean_flavor.79.t: "Соуелл досягає свого"
 Caribbean_flavor.79.desc: "Томас Соуелл не міг бути щасливішим. Він сидів у своєму новому кабінеті, перечитуючи звіти про те, як його плани економічних реформ проштовхувалися через Парламент Вест-Індії. Це вимагало більше політичних маневрів і послуг у відповідь, ніж мало б бути необхідно, але воно того варте. Нарешті з кризи відкрився шлях уперед для федерації. Новий фундамент для її економіки можна було побудувати на іноземних інвестиціях та агресивному розширенні. На цих островах було стільки цінного, що просто залишалося невикористаним, тоді як люди могли б харчуватися плодами цієї землі.\n\nДо всього іншого, Вільямс навіть не виконав свою погрозу, залишивши політичні заворушення майже неіснуючими. Соуелл потряс відром, і він знав, що деякі старі викопні не будуть надто щасливі, але зміни мали відбутися, і вони мали відбутися швидко, аби вся федерація не розпалася менш ніж через десятиліття після свого заснування. Найважча частина, однак, була позаду. Переконати всіх у правильності цього шляху було зроблено, тепер залишалося лише довести справу до кінця."
 Caribbean_flavor.79.a: "Соуелл запалив сигару й почав підписувати папери."

 Caribbean_flavor.80.t: "Результати відомі! Знову."
 Caribbean_flavor.80.desc: "Якби Томас Біл-молодший був молодшим, коли він був молодшим, він би чекав біля телефону, барабанячи руками по своєму шкіряному кріслу, доки воно не зносилося б, чекаючи на перше слово про результати виборів. Ті часи давно минули, тож коли він зателефонував прем'єр-міністру-обранцю Тому Адамсу, щоб привітати його з перемогою, той уже повернувся додому після святкування. Телефон дзвонив надзвичайно довго, перш ніж на нього нарешті відповіли.\n\n""Прем'єр-міністре-обранцю! Я хотів привітати вас із перемогою, якийсь час там було досить близько.""\n\n""Пане Біл! Я майже не очікував почути від вас сьогодні, але так, усе було трохи напружено, і, між нами кажучи, якби керівництво Ширера не закінчилося так, як закінчилося, я не знаю, чи був би я зараз тут!"" В голосі Адамса звучав гумор, але Біл знав правду цих слів краще за будь-кого.\n\n""Що ж, я хотів повідомити вам, що ви правильна людина для цієї роботи. Я бачив, як ви виросли поруч зі своїм старим, і навіть перевершили його та проклали власний шлях. Він би вами пишався, він був хорошою людиною.""\n\n""Дякую, пане Біл. Для мене багато значить почути це від вас. Я хочу, щоб ви знали: я продовжую те, на чому він зупинився, і навіть більше. Ми проштовхуємо реформи, і до кінця мого терміну федерація буде не лише на рівні зі світом, а й випереджатиме його. Разом з рештою ОВН, звісно.""\n\n""Я радий це чути, прем'єр-міністре-обранцю. Не можу дочекатися, щоб попрацювати з вами й побачити це здійсненим. Це буде мрією, що стала реальністю."""
 Caribbean_flavor.80.a: ""Я мріяв про це вже давно, пане Біл. Час втілити це в реальність."""

 Caribbean_flavor.81.t: "Кар'єра"
 Caribbean_flavor.81.desc: "Вільям Г. Гасті вчетверте у своєму житті, і, найімовірніше, востаннє, був у касці. Можливо, правильніше було б сказати, що лише чотири рази за весь час один із будівельних проєктів, за якими час від часу наглядала Комісія Вест-Індії, вимагав, щоб член комісії приїхав на день і постояв навколо, вдаючи, що він щось тямить у будівництві. Гасті був юристом, а не архітектором.\n\nЦе нове будівництво не було чимось особливим, просто гарний готель для іноземців, але воно зачепило щось у ньому, коли він цілий день дивився на силует майбутнього федерації, що поволі формувався. Це був шлях уперед, подобалося це йому чи ні. Гасті боровся до кінця, щоб не віддати країну корпоративним можновладцям та міжнародній жадібності, і програв. Можливо, він був ідеалістом? Він точно не відчував себе таким. Він відчував себе як костюм, який носив щодня протягом більшої частини століття, надійний, методичний. Гасті був юристом, і він не займався ідеалізмом заради самого ідеалізму. Він бачив потенціал і продумав усі кроки для його реалізації. Але ось він тут, наглядає за першими кроками нових повноважень Комісії Вест-Індії. Соуелл нарешті досяг свого, і, безсумнівно, десь у якійсь раді директорів він хизувався сумою грошей, яка невдовзі мала влитися в економіку.\n\nГасті не подобалося бути в касці під спекою, спостерігаючи, як мрія іншого чоловіка розриває його власну на частини, але він це зробить. Зрештою, Гасті був не юристом і вже дуже давно не був юристом. Він був костюмом, який виконував свою роботу, доки вік більше не дозволить йому цього. Новій комісії доведеться обходитися без його твердої руки, і, можливо, це піде їй на користь. Він міг лише сподіватися.\n\nГасті спостерігав за робітниками, схожими на мурах, що рояться навколо вежі, і думає:"
 Caribbean_flavor.81.a: ""Можливо, мені варто було просто залишитися юристом."""

 Caribbean_flavor.82.t: ""
 Caribbean_flavor.82.desc: ""
 Caribbean_flavor.82.a: ""

 Caribbean_flavor.83.t: "План Вільямса"
 Caribbean_flavor.83.desc: "У Комісії Вест-Індії панував хаос. Плани реформ Еріка Вільямса пройшли через парламент, і політичні та економічні кола вже поширювалися Федерацією. Соуелл лютував, влаштовуючи рознос комісії.\n\n""Це лише прискорить проблеми! Нам потрібно скоротити витрати, стабілізувати економіку за допомогою стабільної торгівлі, а радикальне реформування економіки не зробить нічого, крім як підштовхне нас до краю. Це переворот, просто й ясно. Вільямс захоплює Федерацію.""\n\nБільш урівноважені голови протестували, але в такому ж сум'ятті перебував і барон Молсон, який повторював думку Соуелла, заявляючи, що реформи відірвуть федерацію від США, чия підтримка була однією з найбільш стабілізуючих сил у Вест-Індії.\n\nГасті, який був наймовчазнішим серед присутніх, просто мав від усього цього головний біль. Він займався цим надто довго і став надто старим, щоб кричати в переповненій залі засідань."
 Caribbean_flavor.83.a: "Справді, йому просто потрібно було піти на пенсію."

 Caribbean_flavor.84.t: "Результати відомі! Знову."
 Caribbean_flavor.84.desc: "Якби Томас Біл-молодший був молодшим, коли він був молодшим, він би чекав біля телефону, барабанячи руками по своєму шкіряному крісу, доки воно не зносилося б, чекаючи на перше слово про результати виборів. Ті часи давно минули, тож коли він зателефонував прем'єр-міністру-обранцю Майклу Менлі, щоб привітати його з перемогою, той уже повернувся додому після святкування. На телефон швидко відповіли.\n\n""Прем'єр-міністре-обранцю! Це Томас Біл, телефоную привітати вас із перемогою. Ви досить сильно вирвалися вперед наприкінці, я майже думав, що все вирішиться останніми кількома голосами!""\n\n""Пане Біл! Я очікував на ваш дзвінок сьогодні, гадаю, нам є про що поговорити. Щось підказує мені, що працювати з вами буде... цікаво.""\n\n""Не знаю щодо цього, пане Менлі. Я знаю, що ми не погоджуємося на практиці, просто виходячи з наших позицій, але думаю, ми зможемо знайти спосіб працювати разом так, щоб усі були задоволені.""\n\n""Ну, можливо, не всі, пане Біл, оскільки, як ви, напевно, знаєте, ми наполягатимемо на більшій централізації та самодостатності, хоча й не настільки, щоб позбавити вас роботи, майте на увазі."" Сміх прем'єр-міністра-обранця здавався завченим.\n\n""О, я знаю, знаю, повірте, я ще не чув кінця цьому. Просто пообіцяйте мені дещо, Майкле: не дозволяйте Еріку вами командувати, гаразд? Можливо, він і є архітектором реформ, але це ви переконали людей підтримати їх."""
 Caribbean_flavor.84.a: ""Я не дозволю, пане Біл. Не дозволю."""

 Caribbean_flavor.85.t: ""
 Caribbean_flavor.85.desc: ""
 Caribbean_flavor.85.a: ""

 Caribbean_flavor.86.t: "Проблеми на відпочинку"
 Caribbean_flavor.86.desc: "У Кінґстоні, Ямайка, були два місця, які різко відрізнялися й визначали настрій цього дня. Одним була продувана веранда одного з численних місцевих готелів, де група американських туристів сьорбала ромовий пунш і намагалася зрозуміти хаос, що розгортався внизу. Іншим були переповнені вулиці біля Ґордон-Гаус, де тисячі прихильників Ямайської лейбористської партії ринули вперед у знак протесту.\n\nГотель обіцяв втечу — сонце, море та ілюзію спокою. Його гості приїхали, щоб забути про напруженість удома, а не потрапити у чиюсь чужу. Але коли вигуки з вулиць стали гучнішими — ""Геть Вільямса! Ні перевороту у Федерації!"" — настрій змінився.\n\nКолишній шкільний учитель з Огайо нервово нахилився до бармена й запитав, що відбувається. Той знизав плечима, налив ще один напій і пробурмотів щось про ""політику та владу"". Інший чоловік, заможний південний землевласник, почав голосно говорити про ""порядок"" і ""дисципліну"", викликаючи незручні погляди та змушуючи бармена тихо перебратися на інший бік бару.\n\nДехто визирав із балкона, спостерігаючи за натовпом, що зростав, із сумішшю цікавості та тривоги. Інші поверталися до своїх кімнат, засмикували штори й вмикали кондиціонери сильніше, щоб заглушити шум. Менеджер готелю, спокійний, але рішучий, порадив гостям залишатися всередині та уникати центру міста. Його голос звучав завчено, він уже бачив таке раніше.\n\n"
 Caribbean_flavor.86.a: "Навіть на відпочинку ми не можемо втекти від конфлікту."

 Caribbean_flavor.87.t: "Тихий вихід"
 Caribbean_flavor.87.desc: "КОНФІДЕНЦІЙНО/[?global.date.GetDateStringNoHourLong]\n\nВІД ДИРЕКТОРА ФБР ДЖ. ЕДҐАРА ГУВЕРА\n\nМЕМОРАНДУМ ДЛЯ ДЕРЖАВНОГО ДЕПАРТАМЕНТУ США\n\nТЕМА: ТРИВОЖНЕ ВІДРОДЖЕННЯ АВТОНОМІЗМУ У ФЕДЕРАЦІЇ ВЕСТ-ІНДІЇ\n\n1. Після наслідків нафтової кризи центральний уряд Федерації отримав більше контролю над своїми місцевими складовими в рамках масштабнішого комплексу реформ. Із заявленою метою гармонізації економічного планування ці політики, започатковані тодішнім прем'єр-міністром Тринідаду і Тобаґо Еріком Вільямсом, призвели до значної концентрації влади в колись децентралізованій адміністрації, що викликає занепокоєння деяких держав-членів.\n\n2. Минулорічні вибори, які підтвердили Майкла Менлі з Федеральної лейбористської партії на посаді глави держави, офіційно відсторонили Еріка Вільямса від влади, передавши її до рук його колишнього союзника. Однак вважається, що він зберігає своє становище за лаштунками, смикаючи за ниточки як свого роду тіньовий прем'єр-міністр. Ситуація ще більше викликає занепокоєння через сильну позицію Вільямса проти американської сфери, що підтверджується зростанням автономістських настроїв по всій Федерації.\n\n3. Це, у поєднанні з новою стратегією розвитку центрального уряду, як очікується, призведе до дедалі більшої кількості програм націоналізації, які можуть підірвати нашу довгострокову участь у регіоні, особливо якщо вони торкнуться критично важливих для наших інтересів секторів, таких як нафтова та бокситова промисловість.\n\n4. Хоча ми залишаємося пильними у своїх зусиллях уважно стежити за ситуацією, я вважаю надзвичайно важливим підготувати план на випадок надзвичайних обставин, якщо Федерація Вест-Індії вирішить діяти відповідно до своїх нещодавніх антиамериканських настроїв."
 Caribbean_flavor.87.a: "Вірність, Хоробрість, Чесність"

 Caribbean_flavor.88.t: "Удар на нашому подвір'ї"
 Caribbean_flavor.88.desc: "КОНФІДЕНЦІЙНО/[GetDateText]\n\nВІД АЛЛЕНА МАКФЕРСОНА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ВІДОМОСТІ ПРО СХІДНОКАРИБСЬКИЙ СОЮЗ\n\n1. Колишня британська колонія Тринідад і Тобаґо та колишні держави-члени Навітряних островів, Ґренада, а також Сент-Вінсент і Ґренадіни проголосили незалежність, об'єднавшись у політичний союз під впливом губернатора Тринідаду Еріка Вільямса, названий Східнокарибським Союзом. Вільямс тепер очолює союз і зробив кроки назустріч Мексиці з метою економічної координації шляхом приєднання до Веракруського пакту, просуваючи ""антиімперіалістичне"" керівництво.\n\n2. Вільямс відкрито продемонстрував свій скептицизм щодо Сполучених Штатів під час відкритого діалогу, однією з причин якого було те, що оренда півострова Чаґуарамас на території Тринідаду для використання як військово-морської бази підривала управління Тринідадом.\n\n3. Стиль керівництва Вільямса більше нагадує ліберальну демократію, ніж революційну державу, однак їхній вихід з ОВН та готовність запрошувати до союзу більше карибських островів все ще можуть додатково поставити під загрозу нагляд Комісії Вест-Індії в регіоні.\n\n4. Запаси нафти Тринідаду продовжують фінансувати інфраструктуру та соціальний розвиток союзу, дозволяючи подальшу централізацію інших держав-членів союзу та протидію опозиції з боку нетринідадців. Хоча заклики залишити Східнокарибський Союз залишаються позицією меншості, місцева опозиція все ще може привертати увагу до негативних наслідків централізації Вільямса. Запропоновані методи включають підкуп політиків, фінансування демонстрацій і протестів індо-карибців тощо."
 Caribbean_flavor.88.a: "Вірність, Хоробрість, Чесність."
 
 Caribbean_flavor.89.t: "Щоб захистити свою отару"
 Caribbean_flavor.89.desc: "Крики й стукіт. Саме це зустрічає перші миті засідання Комісії Вест-Індії. Вільям Гасті розуміє, що пристойність була відкинута вмить, тож здебільшого просто сидить без діла, поки більш пристрасні члени можуть вивергати свої думки щодо групи крихітних острівних держав, які залишають ОВН, щоб створити власний союз і покінчити з цим.\n\nҐрантлі Адамс, на дальньому кінці овального столу, має такий самий похмурий вираз обличчя, як і Гасті. Джентльмен із Теннессі розуміє це як непокору правилам поведінки решти Комісії. Двоє чоловіків, які знали, що, попри невпинні суперечки, Комісія мусить знайти спосіб врятувати скрутну ситуацію, щоб залишити своїм недосвідченим наступникам пристойну ситуацію для початку їхнього терміну. Гасті — Соуеллу. Ґрантлі — Тому. Не має значення, наскільки їхні принципи суперечать одне одному; це просто їхній обов'язок.\n\n""Ґрантлі, вибач, що затримую тебе в цій кімнаті."" Гасті мусив повернути Адамса назад, перш ніж той встиг вийти. ""Хочу залучити тебе до однієї ідеї, якщо висловлюватися просто. Нам потрібен новий союз, щоб протистояти союзу Вільямса.""\n\n""Хіба це вже не ускладнить ситуацію? Холодна війна прямо у Вест-Індії не піде на користь нікому загалом."" У тоні Адамса відчувається підозра, попри те, що він усе ще демонструє щирий інтерес.\n\n""Якщо говорити політично та економічно, загалом це лише зміцнить твоє становище та становище Вест-Індії на світовій арені. Цей новий союз, Карибське співтовариство, очолюватиму я. Твої політики, а можливо, одного дня й політики твого сина, зможуть принести плоди й в інших громадах."" Коротка пауза. ""Але ти не чув цього від мене."""
 Caribbean_flavor.89.a: "Адамс, із половиною духу в очах, кивнув у відповідь."

 Caribbean_flavor.90.t: "Щоб захистити свою отару"
 Caribbean_flavor.90.desc: "Крики й стукіт. Саме це зустрічає перші миті засідання Комісії Вест-Індії. Вільям Гасті розуміє, що пристойність була відкинута вмить, тож здебільшого просто сидить без діла, поки більш пристрасні члени можуть вивергати свої думки щодо групи крихітних острівних держав, які залишають ОВН, щоб створити власний союз і покінчити з цим.\n\nҐрантлі Адамс, на дальньому кінці овального столу, має такий самий похмурий вираз обличчя, як і Гасті. Джентльмен із Теннессі розуміє це як непокору правилам поведінки решти Комісії. Двоє чоловіків, які знали, що, попри невпинні суперечки, Комісія мусить знайти спосіб врятувати скрутну ситуацію, щоб залишити своїм недосвідченим наступникам пристойну ситуацію для початку їхнього терміну. Гасті — Соуеллу. Ґрантлі — Тому. Не має значення, наскільки їхні принципи суперечать одне одному; це просто їхній обов'язок.\n\n""Ґрантлі, вибач, що затримую тебе в цій кімнаті."" Гасті мусив повернути Адамса назад, перш ніж той встиг вийти. ""Хочу залучити тебе до однієї ідеї, якщо висловлюватися просто. Нам потрібен новий союз, щоб протистояти союзу Вільямса.""\n\n""Хіба це вже не ускладнить ситуацію? Холодна війна прямо у Вест-Індії не піде на користь нікому загалом."" У тоні Адамса відчувається підозра, попри те, що він усе ще демонструє щирий інтерес.\n\n""Якщо говорити політично та економічно, загалом це лише зміцнить твоє становище та становище Вест-Індії на світовій арені. Цей новий союз, Карибське співтовариство, очолюватиму я. Твої політики, а можливо, одного дня й політики твого сина, зможуть принести плоди й в інших громадах."" Коротка пауза. ""Але ти не чув цього від мене."""
