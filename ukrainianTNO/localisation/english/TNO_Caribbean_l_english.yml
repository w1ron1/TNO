 JAM_flavor.33.t: "Пробудження реальності"
 JAM_flavor.33.desc: "Мрія, на створення якої пішли роки, добігала кінця. Пітер зітхнув, поклавши слухавку, закриваючи черговий бізнес-рахунок і виводячи гроші з країни. Він намагався не зважати на звуки будівельників, які по частинах виносили кухню через задні двері. Він міг залишити її, але під час перепродажу вона коштувала достатньо, щоб варто було вивезти її з Ямайки до того, як почнеться розправа.\n\nПітер хотів лише володіти готелем, дарувати людям радість під час відпусток і водночас заробляти собі на життя. І деякий час життя було хорошим. Прибутки зростали, і він сподівався розширитися, але потім прийшов Менлі та революція. У короткостроковій перспективі нестабільність була поганою, але коли Менлі прийшов до влади й почав виголошувати свої промови, Пітер зрозумів, що його дні полічені. Банки будуть пограбовані, а всі активи, що належать іноземцям, конфіскують, і все, чого захоче Менлі, особливо якщо це належатиме американцеві, заберуть без компенсації. Тож усі його тяжкі труди пішли нанівець через те, що жадібність однієї людини ніколи не могла бути втамована.\n\nПо радіо диктор повідомив, що вольфрамові шахти на острові буде націоналізовано. Вони відтворили цитату Менлі, де він говорив про національне значення вольфраму та свою обіцянку покращити умови праці в шахтах. Потім він заявив: «Ми прагнемо демократичного шляху до соціалізму, прагнемо рівності та гідності для всіх. Ми не тирани, які прийшли сказати, що заберуть усе. Усе, чого ми хочемо, — щоб із нашими робітниками поводилися як із людьми, щоб вони володіли власністю та могли досягати самореалізації, як і будь-яка інша людина». Просто слова, подумав Пітер. Оскільки іноземець і підприємець не вважався людиною, то його, безперечно, не стосувалися високопарні заяви Менлі. Він не хотів завдавати шкоди Ямайці, але, здавалося, вони мали намір завдати шкоди йому."
 JAM_flavor.33.a: "Пітер чув, як голос Менлі по радіо тремтів. Цей виродок навіть не мав порядності добре брехати."

