 Caribbean_flavor.232.t: "Втрачений рай"
 Caribbean_flavor.232.desc: "THE MOVEMENT — СТОРІНКА 13 — [GetDateText] — ІНТЕРВ'Ю З КОЛИШНІМ ПРЕМ'ЄР-МІНІСТРОМ ДОМІНІКИ\n\nПорівняно з метушливим завершенням терміну Едварда ЛеБлана на посаді прем'єр-міністра Домініки, його теперішнє життя набагато тихіше. Тепер, живучи в Гавані, ЛеБлан пише для англомовних періодичних видань і намагається вивчати іспанську. Однак його погляди на справедливість для афрокарибців не охололи.\n\n"Моїми цілями завжди було покращити Кариби та Домініку," — каже він. "Колонізація та рабство збіднили нас, але я знаю, що ми процвітатимемо, щойно ці чоботи приберуть із наших ший."\n\nВін пояснив, що завжди мав погану репутацію серед американських дипломатів, навіть попри заклики Кастро на його користь. "Щоразу, коли я ухвалював закони заради добробуту Домініки, вони завжди попереджали мене про плантаторів та економічні потрясіння. Але коли я спробував націоналізувати виробництво фруктів, вони взагалі перестали говорити. Єдині американці, від яких я почув щось після цього, були з United Fruit Company."\n\nНадійшли мільйони, а американська преса звинуватила його в більшовизмі. За підтримки хабарів та завуальованих погроз з боку американських сил його усунули й замінили маріонеткою Ніколсоном Дюкрі. "У мене завжди були щодо нього сумніви, але я ніколи не очікував, що він буде зрадником," — пояснив він, відраза була очевидна в його голосі. "FBI завжди вбачало єдину проблему нашого острова в тому, що це англо-канадська, а не американська колонія."\n\nКоли його запитали про погляди на власну партію, він був так само неспівчутливим. "Повна фікція. Демократична лейбористська партія стала тінню самої себе, і я повністю від неї відмежовуюся." Однак він попередив: "не думайте, що Америка застрахована. Мільйони пішли на повалення Домініки. Уявіть, скільки мільярдів вони витратили б на купівлю світової держави. Зрештою, вони зробили це з Німеччиною.""
 Caribbean_flavor.232.a: "Хлопчик, що кричить «вовк», чи сучасна Кассандра?"

 Caribbean_flavor.233.t: "Гра з скупими"
 Caribbean_flavor.233.desc: "Багряні прапори ЛеБлана зникли — пил осів, але що тепер? Євгенія Чарльз із Домініканської партії свободи — прагматична жінка. Час працювати з United Fruit Company, щоб повернути Домініку на правильний шлях. Її ліві попередники створили хаос за столом переговорів — сподіваємося, що проста ввічливість зможе його вирішити.\n\n"United Fruit Company вимагає, щоб уряд Домініки повернув усі державні частки," — сказав один із представників, після чого поглянув на одного зі своїх колег, щоб той продовжив.\n\n"Політика націоналізації за вашого попередника — наше керівництво хоче, щоб її скасували," — відлунало від іншого представника. Кожен намагався вибороти можливість виступити на захист доброго імені Компанії, але ніхто не мав сміливості продовжити. Їхні погляди металися туди-сюди, очікуючи, поки хтось порушить мовчання Чарльз.\n\nПісля раунду напівтихого бурмотіння Чарльз зітхнула, поки одягнені в костюми іноземці дивилися на неї. "Домініка готова працювати з Компанією заради нашої взаємної вигоди. Однак поспішний курс — не те, що зараз потрібно нашій економіці."\n\n"То чого ж ви тоді просите? За вашими словами, ми маємо розділити плантації навпіл!" Більшість інших представників не були вражені, і кімната знову стихла, коли промовця поховали під глузливими вигуками. Попри це, Чарльз звично кивнула, перш ніж повернутися до своєї заяви.\n\n"Націоналізацію можна сповільнити, але не зупинити повністю." Послідували глузування, але не заперечення — Чарльз покликала секретаря, щоб викласти пропозицію ДПС. "United Fruit, як найбільший роботодавець нашого населення, повинна розуміти, що для роботи тут вона залежить від нашої праці. Ми завжди можемо обрати іншого роботодавця, а ви завжди можете піти, якщо не хочете, щоб ми мали частку.""
 Caribbean_flavor.233.a: "Компанія не пішла."

 Caribbean_flavor.234.t: "Гітлер Домініки?"
 Caribbean_flavor.234.desc: "У нещодавніх маневрах Едварда Олівера ЛеБлана з Домініки вчувається безпомилковий аромат державного діяча, який відкрив для себе наркотичні насолоди необмеженої влади. Те, що починалося як скромна програма розвитку села, перетворилося на повномасштабну кампанію політичної консолідації, здійснювану зі спокійною впевненістю людини, яка вважає, що сама історія особисто призначила її хранителем долі острова.\n\nНі, ЛеБлан не є гітлерівцем у сенсі схиляння перед Німеччиною. Але він безпомилково переймає звички такого: централізацію економічного життя, таврування американського партнерства, звуження політичного простору. Це не жести людини, яка шукає користі для свого народу, а політичного деспота, який прагне консолідувати себе й протиставити Америці Домініку на користь Німеччини.\n\nНе менш тривожним є раптовий ентузіазм прем'єра щодо антиамериканських настроїв. Масові націоналізації всієї приватної власності, іноземної чи внутрішньої, спіткають острів. Американські компанії та землевласники будуть змушені повністю піти заради консолідації у власному політичному класі. ЛеБлан представляє це як кроки до зростання та добробуту, але ті самі фрази використовував Гітлер, коли десятиліттями тому атакував промисловість Німеччини. ЛеБлан зробив модним засуджувати Сполучені Штати як втручального колоса, зручного цапа-відбувайла за кожен внутрішній недолік. Можна запідозрити, що спічрайтери ЛеБлана списують із більш театральних памфлетистів Європи.\n\nКариби вже бачили цю драму, і для будь-кого вона рідко закінчується добре. Друзі Домініки, одним із яких Сполучені Штати були протягом тривалого часу, проявили б недбалість, якби не звернули увагу на цю траєкторію. Лідер, який колись обіцяв розширення прав і можливостей, тепер, схоже, прагне забезпечити, щоб єдиною наділеною владою інституцією на острові був антиамериканізм. — Вільям Ф. Баклі"
 Caribbean_flavor.234.a: "Консервативні запальні оратори знайшли ще одну ціль."

 Caribbean_flavor.237.t: "Барбадоська декларація"
 Caribbean_flavor.237.desc: "Том Адамс, син Ґрантлі Адамса та новий прем'єр-міністр Барбадосу, постав перед Організацією американських держав і виголосив промову, яка мала визначити його політичну кар'єру.\n\n"Мій батько Ґрантлі вірив у мрію про міцно об'єднані Кариби, де немає постійної боротьби, а панує віра в єдність і процвітання всіх островів. Я продовжую його віру в те, що єдиний шлях уперед для цих островів — об'єднатися під одним прапором." Адамс швидко ковтнув, перш ніж продовжити.\n\n"Ми також твердо віримо, що американська республіка, попри всі свої випробування, була оплотом проти тиранії на Карибах, маяком для пригноблених і партнером для тих, хто прагне миру через свободу. Ми на Барбадосі цього не забуваємо. Ми вшановуємо це."\n\n"Кариби та Сполучені Штати повинні прагнути до нової ери принципової співпраці, нової ери, побудованої не на залежності від когось одного, а на спільних ліберальних цінностях свободи. По всьому Карибському регіону ми бачили постійні спокуси ізоляціонізму та екстремізму, але, мої колеги-лідери та представники, ми всі повинні прийняти демократичну модель і зберегти стабільність та процвітання в цій півкулі."\n\nАдамс швидко глянув на американську делегацію, перш ніж продовжити: "Барбадос не може достатньо хвалити наших американських друзів за їхнє керівництво Карибами, постійну стабілізуючу силу, без якої Кариби занурилися б у хаос."\n\n"Дякую."\n\nПромова була зустрінута громом оплесків американських делегатів і тихим захопленням багатьох інших. У багатьох американських дипломатичних колах Адамса називали новим ліберальним голосом регіону, тим, хто усвідомлює важливість Америки в регіоні."
 Caribbean_flavor.237.a: "Хтось там унизу це розуміє."

