 JAM_flavor.68.t: "Ламаючись під тиском"
 JAM_flavor.68.desc: "Від: Управління у справах Південної Америки\nМеморандум для директора\nТема: Ямайські тенденції та майбутні операції\n\nСамопроголошена Ямайська Народна Республіка останнім часом пом'якшила свої попередні радикальні комуністичні погляди. Однак керівництво залишається відданим жорстким переконанням, і вважається, що поміркований курс є поступкою практичності та способом уникнути іноземної й внутрішньої негативної реакції. Вважається, що прем'єр-міністр Річард Гарт щиро вірить у комунізм і навряд чи відмовиться від зусиль із націоналізації або використання антиамериканської риторики для зміцнення внутрішньої підтримки та відволікання населення від проблем нестачі продовольства й політичних репресій. Ямайка за Річарда Гарта залишається загрозою американській власності в Карибах, а також базою для майбутньої підривної діяльності та потенційної іноземної розвідки в регіоні.\n\nОднак політична партія Гарта, Рух народної свободи, потребує підтримки коаліції з боку поміркованої Народної національної партії під керівництвом Майкла Менлі. FBI запропонувало надати політичну підтримку ННП Менлі в надії розколоти коаліцію ННП—РНТ, посилити політичний глухий кут і підірвати довіру до РНТ та політичного керівництва Гарта. Якщо ННП зможе стати ефективнішою та спроможнішою політичною фракцією, Гарт і РНТ можуть втратити довіру в очах ямайського народу, а країна може повернутися до більш проамериканської орієнтації.\n\nПропозиція передбачає просту підтримку виборчої кампанії, фінансування політичних матеріалів і допомогу в покритті витрат на виборчий персонал та агітаторів. Ризик викриття мінімальний, а більшість варіантів цілком відповідає внутрішньому законодавству Ямайки."
 JAM_flavor.68.a: "Вірність, Хоробрість, Чесність."

 JAM_flavor.69.t: "Загартовані вогнем"
 JAM_flavor.69.desc: "«РНТ обіцяли нам процвітання, а подивіться, що вони нам дали. Гарт говорить про боротьбу робітників, але багатіє, поки ми страждаємо. Половина з нас боїться за свої робочі місця, а іншій половині нічого їсти, крім його порожніх слів! Де ж рай для робітників, який він обіцяв? Його червоний вогонь обпалив нас, а Народна національна партія — єдиний шлях до процвітання та гордості!» Ця промова вже обійшла всю країну, атакуючи РНТ і особливо Гарта. У різних районах промову коригували й підлаштовували під аудиторію, але теза завжди залишалася тією самою. Гарт зруйнував Ямайку своїми екстремальними переконаннями, а ННП досягла б більшого, якби вийшла з коаліції та самостійно керувала країною. Для будь-якого стороннього спостерігача це була природна реакція на економічний провал Гарта. Мало що здатне так згуртувати народ, як спільні труднощі.\n\nАле дещо могло — підтримка виборчої кампанії з боку американського уряду. Акуратно надруковані брошури та плакати заповнили кожен офіс ННП. Тези для виступів і демографічні дослідження опинилися в руках спічрайтерів та керівників кампаній. Листи від ямайських емігрантів за кордоном потрапляли до їхніх родичів, які все ще перебували на острові, закликаючи їх змінити свій голос і врятувати батьківщину. Вогонь у ННП був цілком справжнім, але його ретельно роздмухували та підживлювали руки з Вашинґтона.\n\nНайбільші тріщини почали з'являтися, коли Едвард Сіґа підтримав вступ колишніх членів Ямайської лейбористської партії до ННП. Ця хвиля підтримки дала ННП можливість кинути виклик РНТ на власних умовах. Якщо ННП вийде з коаліції, це може спричинити нові вибори, на яких РНТ цілком реально могла програти. Гарт демонстрував міцний фасад, але поки зовнішня оболонка загартовувалася вогнем, серцевина, здавалося, була майже готова тріснути від спеки."
 JAM_flavor.69.a: "Зламати, зробивши крихким."

