 ## Leader Descs ##
 POLITICS_SNS_COUNCIL_DESC: "Сирійська Національна Держава виникла через зраду.\n\nСирійці з жахом спостерігали, як турецькі солдати марширують до палацу Аль-Азм без допомоги з боку Німеччини - попри обіцяну незалежність в обмін на підтримку німців. У місці народження повстання проти Франції, утворилася Сирійська Національна Держава під управлінням Туреччини - це породило НАСІЛ, рух опору сирійської держави.\n\nCНД відіграла критичну роль в Іракській війні 1952 року: турецькі армії затримувались в Іраку, доки сирійський офіційний представник - Тайфур Сокмен, не розробив план вторгнення в Ірак через Сирію, що допомогло виграти війну. Сокмен був ліквідованим НАСІЛ, що призвело до жорстоких репресій проти всіх супротивників і антитурецьких настроїв, через політичні переслідування, військову силу й навіть публічну страту.\n\nСьогодні СНД очолюється радою, до якої входять: Хусні-аль-Заїм, Адіб Шішаклі, Фаузі Селу та Самі-аль-Хіннаві, кожен із котрих має свої амбіції щодо Сирії. Але присутні шепоти про те, що залишки НАСІЛ знову здіймаються - шепоти, які загрожують зруйнувати нестабільні основи Сирійської Національної Держави."