 ### Leader Descriptions ###
 POLITICS_ALEXANDER_MEN_DESC: "Алєксандр Владімірович Мєнь ніколи не просив бути пастирем для стількох людей, не просив, щоб йому довірили життя цілої пастви, ані щоб на його плечі ліг тягар Небес. І все ж він став усім цим - Отцем Півночі.\n\nТа так було не завжди. Єврейська дитина, охрещена ще немовлям, Мєнь утратив батька у шість років: того за неправдивими звинуваченнями забрав НКВД і відправив до ГУЛАГу. Це назавжди прищепило хлопцеві непримиренність до страху й тиранії, від яких страждало стільки людей у всьому світі. Попри небезпеку підпільного богослужіння в Союзі, Мєнь лишався побожним християнином, хоч і вельми неортодоксальним. Він твердо вірив у рівність, що стоїть вище за клас, стать, расу й навіть віру, а такі погляди були майже нечуваними і в Церкві, і в самому Союзі.\n\nУ темні часи після загибелі Союзу Мєнь опинився на замерзлій Півночі, втішаючи селян, які боролися за виживання, несучи їм Божу любов, а тим, хто не міг її прийняти, - власні слова. Він розповідав їм про свою надію на землю справді вільних чоловіків і жінок, землю рівности, край комун і сіл, де з усіх буде скинуто кайдани.\n\nЙого переконання й учинки почали знаходити відгук серед віддалених громад Сибіру. Спершу поволі, а тоді раптом одна за одною північні громади почали присягати у вірності своєму Отцеві.\n\nСьогодні Північ виступає проти хаосу, що так довго охоплював Святу Батьківщину. Під пильним поглядом свого Отця вони принесуть визволення й спасіння всім, хто страждає."

 POLITICS_GURZHAP_OCHIROV_COLLAPSE_DESC: "Скільки себе пам'ятає, Гуржап Ванюшкеєвіч Очіров жив по той бік закону. Замолоду він був простим бандитом, грабуючи торговців, які наважувалися відходити далеко від останніх осередків знайомої їм цивілізації. Згодом його доля змінилася, коли Яґода у відчаї завербував його очолити загін бурятів для охорони віддаленого села Алдан. Коли більшовики повернули контроль над поселенням, Очірова завербував непокірний солдат на ім'я Судоплатов. Поки його командир мріяв викувати єдину Росію під знаменом отця Мєня, справжню вірність Очіров зберігав лише своїй батьківщині - Бурятії.\n\nТепер, коли його командир зрадив Отця, Очіров вийшов із тіні, повернувся до Алдана й зібрав загін патріотів для визволення Бурятії. Його супротивник Ґомбоєв стверджує, що будує нове майбутнє для бурятів за прикладом Мєня, але Очіров бачить його брехню наскрізь. Він знає, що християни ніколи не зможуть бути справжніми друзями його народу. Він більше не терпітиме жодних чужоземних окупантів чи жалюгідних колабораціоністів. Очіров виборе майбутнє для бурятів або загине, намагаючись це зробити."
 
 POLITICS_LEONID_CHERNYKH_COLLAPSE_DESC: "Експедиція Лєоніда Ніколаєвіча Чєрниха стала вже другим випадком, коли сили Білої армії перетнули Амур і ввійшли до диких, неприборканих земель постсовєцької Росії. Однак цілі Чєрниха разюче відрізняються від цілей його товаришів по зброї десятиліттями раніше. Усупереч небагатьом принципам, які Біла армія колись берегла, Чєрних підкорився владі комуніста - Павєла Судоплатова.\n\nМайже повне знищення Білої армії та її повернення у вигнання стали протверезним досвідом, і Чєрних замислився, чи має білий рух у Харбіні взагалі якісь підстави продовжувати існування. Крах так званого Божого царства в Сибіру Алєксандра Мєня докорінно змінив погляди залишків білого руху, і офіцери, що лишилися, раптом почали благати Чєрниха знову рушити на північ.\n\nТа після повернення на Далекий Схід Чєрних швидко зрозумів, що його сили не здатні вести серйозні воєнні дії. Він негайно надіслав повідомлення Судоплатову й НКВД, запропонувавши допомогу своїх людей у стабілізації регіону в обмін на продовольство й припаси. Лєонід Чєрних майже розгубив усі переконання, за які колись був готовий віддати життя. Його більше не хвилює ні відновлення царської влади, ні мрія про Білу Росію. Чєрних прагне лише захистити своїх людей від невизначености анархії."
 
 POLITICS_ZHAMBAL_GOMBOEV_COLLAPSE_DESC: "Жамбал-Доржи Ґомбоєв, відданий совєцькій владі буддист і ветеран війни, ніколи не думав, що одного дня піде під знаменом служителя Христа. Свою кар'єру він починав простим лакеєм НКВД, призначеним Яґодою номінальним представником буддистів Далекого Сходу. Коли чимало його земляків-бурятів приєдналися до божевільного повстання Сабліна, Ґомбоєв лишився на боці Яґоди - можливо, з почуття вірности.\n\nКоли надійшла звістка про повстання християнських селян на півночі, Ґомбоєв згуртував своїх одновірців проти Отця, адже його народ добре пам'ятав, як із ним поводилися християни. Та коли Отець розгромив залишки більшовиків, Ґомбоєва зустріли не ненавистю, а милосердям. Бажаючи дати місце людям усіх віросповідань, отець Мєнь поновив Ґомбоєва на посаді головного представника буддизму в Росії.\n\nПісля зради Отця Ґомбоєв спритно зіграв на суперечностях між Якуніним і Судоплатовим, відволікаючи їхню увагу від своєї спроби побудувати буддійську соціялістичну державу для бурятського народу, аж доки партизан Очіров не вигнав його з власного дому. Тепер він і його проєкт борються за саме своє існування проти людини, яка навряд чи піде на компроміс."
 
 POLITICS_NIKOLAY_IVANOVSKY_COLLAPSE_DESC: "Тихоокеанський флот ніколи не був найважливішою частиною Червоного флоту, але колись був славетною й грізною армадою порівняно з жалюгідними рештками іржавих кораблів, що тепер без діла стоять у гаванях Камчатки. Ніколай Стєпановіч Івановскій - адмірал цієї примарної флотилії, який посилає кілька ще придатних до плавання кораблів нишпорити замерзлими водами Арктики в пошуках здобичі.\n\nКоли Боже царство в Сибіру почало розпадатися, зневірений Павєл Судоплатов хапався за будь-якого союзника, якого тільки міг знайти. Побачивши в місцевому піратському угрупованні Івановского можливого союзника, Судоплатов допоміг йому повернути владу на Камчатці в обмін на взаємний захист. Однак Судоплатов не усвідомлював, що Івановскому не довіряли навіть його товариші з колишнього режиму Тихоокеанського флоту. Попереднє пониження за «грубе порушення військової дисципліни» було достатнім свідченням цієї недовіри.\n\nВірний своїй натурі, Івановскій не гаяв ані секунди, перш ніж ударити союзника в спину, заперечивши саме існування союзу й оголосивши сили Судоплатова законною здобиччю. Адмірал не плекає жодних ілюзій щодо повернення до нормального життя. Для Івановского комунізм - безглузда химера, коли на кону саме виживання. А щоб вижити, Тихоокеанський флот мусить забирати все, що знайде, хоч би в кого."
 
 POLITICS_PAVEL_SUDOPLATOV_COLLAPSE_DESC: "Павєл Анатолієвіч Судоплатов колись був послідовником отця Мєня - або, принаймні, так він стверджував. Насправді ж він устами своїми наближався до Отця й до Бога, але серце його було далеко від них. Бачачи, та не пізнаючи, чуючи, та не розуміючи, він переконав себе, що його провідник - лише наївний ідеаліст, якого треба тримати в узді, і діяв відповідно.\n\nПресвята Богородице, як же він помилявся.\n\nТепер Судоплатова проклинають як нового Юду, зрадника бачення покійного Отця. Хоч він і намагається все відбудувати, зводить він на піску, і з кожним днем усе довкола валиться дедалі швидше. І хоч Судоплатов волає до Бога: «Не ховай же від мене обличчя Свого, у гніві Свого раба не відкинь!», - це вже нічого не важить: ні з Неба, ні з землі допомоги не буде. Весь усесвіт відвернувся від нього.\n\nНавіть його так звані послідовники, ті, хто служив із ним у НКВД та деінде, більше йому не довіряють. Вони використовують рештки його влади задля власних цілей. Та Павєл Судоплатов уже й не заперечує цього. У ньому померла всяка надія. Він не об'єднає Росію. Ні, рано чи пізно він помре, і запам'ятають його таким, яким він був: зрадницьким убивцею, який навіки знищив цілий рух.\n\nСудоплатов, простершись у каятті біля могили святої людини, яку він зрадив, і сам не міг із цим не погодитися."
 
 POLITICS_IVAN_NIKISHOV_COLLAPSE_DESC: "Іван Фьодоровіч Нікішов, директор Колимської зони освоєння, загруз у справі, що виявилася йому не до снаги.\n\nКолись давно Нікішов очолював Головне управління будівництва на Крайній Півночі. Коли Директорат зазнав краху й на його місці постало Боже царство в Сибіру, Судоплатов відправив Нікішова на північ розвивати історично збіднілий регіон. Нікішов, не надто вражений Судоплатовим, мав лише один задум: знову пограбувати край, як уже робив колись.\n\nТа Нікішов знав цей край лише покірним і залежним. Тепер його мешканці накопичують зброю й здійснюють набіги, майже без зусиль і втрат обриваючи тонкі нитки, на яких тримається незаконна влада Нікішова. Відчай, породжений безрозсудною розправою Судоплатова над Отцем, не вгамував їхнього християнського запалу проти таких «гнобителів», як Нікішов.\n\nНікішов не наважується сказати це вголос, але надто добре розуміє своє становище. Хоч Братського союзу отця Алєксандра Мєня більше немає - його знищив самовпевнений недоумок на чолі розвідки, який вважав себе хитрішим за всіх, - та наслідок його існування - пробуджена серед людей Далекого Сходу надія на краще життя - нікуди не зник, і з ним доведеться рахуватися ще довго. А найпершим наслідком цієї надії цілком може стати падіння уряду Нікішова."
 
 POLITICS_GLEB_YAKUNIN_COLLAPSE_DESC: "Отцю Ґлєбу Павловічу Якуніну не вперше доводиться рятувати власне життя втечею. У молодості всю його родину переселили з Москви до Ірктурська перед наступом німецьких військ. Коли Яґода встановив цілковитий контроль над Президією, отець Якунін разом зі своїм наставником, отцем Мєнєм, зник у лісах, рятуючись від жорстокої долі в руках НКВД. На якийсь час він знайшов прихисток серед правовірних далекої Півночі, та божественна місія отця Мєня знову покликала його далі.\n\nТепер отець Якунін здійснив подорож, яка, як він сподівається, стане останньою. Він і сам не знає, як йому одному вдалося вислизнути з рук головорізів Судоплатова - врятувати його міг лише Бог. Тепер він опинився в Маґадані, серед останніх уламків Мєневого видіння. Він веде власну паству, проповідуючи, що для вірян надія ще жива.\n\nТа ці слова звучать порожньо, бо отець Якунін не має ані пророчого дару, ані реформаторської сили Мєня. Його розуміння православної віри значно ближче до Царської Церкви, чиї гріхи накликали на неї гнів Божий. Хай яким вправним проповідником є отець Якунін, він ніколи не об'єднає Батьківщину. Для світу він лишиться тільки сумним нагадуванням про рух, який міг урятувати душу Росії."
 
 POLITICS_VLADIMIR_KUROEDOV_COLLAPSE_DESC: "Після розпаду Божого царства в Сибіру Судоплатов обрав Владіміра Алєксєєвіча Куроєдова командувачем своєї 1-ї армії. Судоплатов відчайдушно сподівався, що досвід Куроєдова в церковному управлінні допоможе втихомирити місцевих і схилити їх на свій бік.\n\nТа натомість старий командувач поводиться дедалі дивніше. Замість того щоб поводитися як генерал, чиновник Священного Синоду чи бодай хтось, кого можна було б очікувати на його місці, він створив собі новий публічний образ - хитрого й ревного проповідника, який сипле цитатами зі Святого Письма та Апостольських Отців і в усьому намагається наслідувати покійного Отця. Хоч мало хто сприймає цю показну виставу за чисту монету, її мета очевидна.\n\nПоки порядок на Далекому Сході стає дедалі віддаленішим спогадом, а Куроєдов усе частіше нехтує донесеннями з Амуру, всім стає очевидно: найімовірніший суперник Сібірского Защітного Комітєта вже перебуває всередині його власних мурів."

