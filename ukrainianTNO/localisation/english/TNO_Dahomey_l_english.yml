 ### Ideas ###
 GBE_idea_ghosts_republic_dahomey: "Привиди Дагомеи"
 GBE_idea_ghosts_republic_dahomey_desc: "Згідно з офіційною лінією нового уряду, нещодавній переворот став результатом вимоги змін від народу, яку Хачеме та його угруповання сумлінно виконали. Подібним чином, стара Республіка Дагомея була мало чим більше, ніж корумпованою ямою, що служила багатим аристократам, а не громадянам, які ледь зводили кінці з кінцями під бомбами німців. Однак, відвідавши вулиці Ломе, можна помітити, що громадська думка зазвичай дуже далека від того, що Хачеме проголошує. Так, визнають, Республіка мала свої проблеми, але хоча б була мрія про стабільність і процвітання в майбутньому. Щонайменше, системи були справедливими, на відміну від сьогоднішнього дагонейського уряду. Таке незадоволення потрібно швидко лікувати режимом Хачеме, адже нація, у якої є широка ностальгія за попереднім урядом, є нацією, що повернеться, коли тільки зможе."
 GBE_idea_militia_based_army: "Армія на основі міліції"
 GBE_idea_militia_based_army_desc: "У війні все повинно бути використано для перемоги. Часто очевидні проблеми відсуваються в майбутнє заради короткострокових рішень, оскільки кожна фракція бореться за виживання та спробує вийти з кривавого конфлікту переможцем. Таку фаустівську угоду уклав Бабангіда на початку війни, коли питання міліцій стало гострою темою. Маючи вибір між тим, щоб дозволити місцевим міліціям, які контролюються здебільшого автономними генералами та адміністраторами, вести військові дії, або ж спробувати реформувати свої сили в єдину армію під час війни, Хачеме зробив розумний вибір, залишивши все як є на той час, але тепер, коли війна позаду, проблеми повернулися. Фракціоналізм і корупція проявляються серед генералів і їхніх сил, оскільки коаліція без ворога, з яким потрібно боротися, починає розколюватися. Якщо нічого не зробити, у Дагомеи буде озброєна сила, що більше нагадуватиме натовп, ніж армію. Реформи, хоч і болісні, повинні бути прийняті, якщо нація хоче знову захистити себе."
