 ## Leader Descs ##
 POLITICS_JEAN_BAPTISTE_HACHEME_DESC: "Народжений в родині фону в Порто-Ново, на території колишньої Французької Дагомеї, Жан-Батист Хачеме був ще підлітком, коли французи виїхали. Він виріс за часів Республіки Дагомея, досить стабільної і функціонуючої демократії, якою він пишався. Однак, з часом, коли Республіка продовжувала підтримувати відносини з ненависними силами Вільної Франції в Абіджані, підтримка уряду Дагомеї серед людей поступово знижувалася. Коли Хачеме приєднався до лав генералів, невдоволення переросло в безкровний військовий переворот, що розірвав відносини з колишніми колонізаторами, і очікувалося, що його очолить шановний генерал Крістоф Согло. Однак Согло, разом з кількома іншими старшими генералами, відмовилися від цієї посади, залишивши президентське місце вільним і поділивши армію на два табори — один за переворот, інший проти нього. Оскільки ніхто не виступив на цю посаду, прихильники перевороту номінували Хачеме, і він неохоче прийняв її, ставши президентом у віці 32 років у 1961 році. Він незабаром пожалкує про свій вибір. Багато труднощів підштовхують новостворену Дагомею до межі руйнування. Антипереворотний табір, очолюваний знаменитим і популярним Согло, залишає серйозну загрозу для суперечливого режиму Бабангіди. Спогади про Дагомею все ще живуть в умах людей, які пам'ятають свої відносні свободи порівняно з нинішньою ситуацією. Вплив Хачеме в армії досить слабкий, особливо в порівнянні з Согло. І навіть це, німці продовжують регулярно бомбити країну, що ставить під загрозу життя людей і економіку. Здається, що Дагомея приречена на ранню загибель. І все ж, Дагомея — це мрія, сплетена з надій пригноблених, спроба загоїти розділення серед різних дагомейських етносів, накладених європейськими імперіями. І незалежно від того, наскільки ця мрія виглядає абсурдною чи безглуздою, Хачеме буде боротися за її реалізацію."

