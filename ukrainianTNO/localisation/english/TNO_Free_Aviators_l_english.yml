 FAV_prioritize_ground_crew_training: "Підвищити пріоритет підготовки наземного екіпажу"
 FAV_balance_training_priorities: "Пріоритети тренувань з метою ребалансу"
 
 FAV_deployment_category: "Боротьба"
 FAV_deployment_category_desc: "Метою наших операцій є боротьба з німецьким лихом у повітрі всіма можливими засобами. Розгортання літаків для боротьби з німцями і управління втратами важливо для запобігання повного зникнення Батьківщини під нацистською рукавичкою.\n\nКількість §BБазових літаків§! в резерві: [?FAVBasicAirReserves]\nКількість §Mпросунутих літаків§! в резерві: [?FAVAdvancedAirReserves]\nКількість розгорнутих §BБазових літаків§! [?FAVBasicAirDeployed]\nКількість розгорнутих §MПросунутих літаків§! [?FAVAdvancedAirDeployed]\nВсього §Yрозгорнутих літаків§! [?FAVTotalAirDeployed]\n\nУ нас є [?FAVUsablePilots] доступних §PПілотів§! для розгортання.\nУ нас є [?FAVRecruitedPilots] всього §PПілотів§!."
 FAV_next_wave_mission: "Німецьке повітряне вторгнення"
 
 FAV_diplomacy_category: "Дипломатія"
 FAV_diplomacy_category_desc: ""
 
 FAV_tutorial_open: "Вільні Авіатори є головним захисником Росії від постійних нацистських вторгнень у Західну Росію. Базуючись на територіях польових командирів, вони дають відсіч Люфтваффе та стримують подальші спроби знищити Батьківщину.\n\nУ меню ВИРОБНИЦТВО нижче можна виготовляти літаки різної якості, використовуючи зібраний по російських пустках §gметалобрухт§!. §gМеталобрухт§! можна отримати, збиваючи німецькі літаки, або через пожертви від інших польових командирів, що підвищить їхній §Yвплив§! на Вільних Авіаторів.\n\nМеню ПІДГОТОВКА охоплює процес навчання та підготовки нових пілотів. Людські ресурси дефіцитні й цінні, тому Вільні Авіатори повинні ретельно балансувати між §Gназемним персоналом§! і §Pпілотами§!, щоб забезпечити боєготовність та здатність поповнювати втрати. Нові пілоти та наземний персонал набиратимуться кожні 30 днів.\n\nМеню БІЙ охоплює місії проти німців. У цьому меню літаки можна відправити безпосередньо в бій або залишити в резерві для подальшого використання. Задіяні безпосередньо літаки зможуть вилітати на перехоплення німецьких вторгнень — кожні 30 днів відбуватиметься подія розвідки щодо активності німців. Літаки в резерві не можуть воювати, але захищені від знищення. Потужність бомбардувань Західної Росії силами Люфтваффе напряму залежатиме від того, наскільки успішно ви з цим впораєтеся.\n\nНарешті, меню ДИПЛОМАТІЯ слугуватиме способом отримання §gметалобрухту§!, додаткових §Pпілотів§! та §Gназемного персоналу§!, а також літаків ціною зміни §Yвпливу§! різних польових командирів на Вільних Авіаторів. Це вплине на процес об'єднання Росії, коли настане час.\n\n"
 FAV_tutorial_closed: "Базовий огляд стану організації "Вільні Авіатори", згрупований за секторами, може бути представлений наступним чином:\n\n"
