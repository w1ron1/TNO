 FAV_tutorial_category_desc: "[GetFAVTutorial]ВИРОБНИЦТВО:\nЗапас §gметалобрухту§!: [?FAVScrapMetalBank]\nПрогнозований щомісячний приріст §gметалобрухту§!: [?FAVScrapMetalGain]\nКількість §Bбазових літаків§!: [?FAVBasicAircraft]\nКількість §Mвдосконалених літаків:§! [?FAVAdvancedAircraft]\n\nПІДГОТОВКА:\nКількість §Pпілотів§!: [?FAVRecruitedPilots]\nЩомісячний приріст §Pпілотів§!: [?FAVPilotGain]\nКількість §Gназемного персоналу§!: [?FAVRecruitedGround]\nЩомісячний приріст §Gназемного персоналу§!: [?FAVGroundGain]\n\nРОЗГОРТАННЯ:\nКількість §Bбазових літаків§! у резерві: [?FAVBasicAirReserves]\nКількість §Mвдосконалених літаків§! у резерві: [?FAVAdvancedAirReserves]\nКількість розгорнутих §Bбазових літаків§!: [?FAVBasicAirDeployed]\nКількість розгорнутих §Mвдосконалених літаків§!: [?FAVAdvancedAirDeployed]\nУсього §Yрозгорнутих літаків§!: [?FAVTotalAirDeployed]"
 FAV_minimize_tutorial: "Зменшити навчання"
 FAV_maximize_tutorial: "Збільшити навчання"
 
 FAV_production_category: "Продукція"
 FAV_production_category_desc: "Підтримання запасів матеріалів і літаків має вирішальне значення для забезпечення надійної оборони від німців. Нижче можна виготовляти літаки та відстежувати прогрес збору §gметалобрухту§!.\nЗапас §gметалобрухту§!: [?FAVScrapMetalBank]\nПрогнозований щомісячний приріст §gметалобрухту§!: [?FAVScrapMetalGain]\nКількість §Bбазових літаків§!: [?FAVBasicAircraft]\nКількість §Mвдосконалених літаків:§! [?FAVAdvancedAircraft]\n\nНаразі ми маємо [?FAVRecruitedGround] осіб §Gназемного персоналу§!, кожен з яких виробляє по 0.1 одиниці §gметалобрухту§!, і ми плануємо набирати ще по [?FAVGroundGain] на місяць.\n\nНижче можна виготовити §Bбазовий літак§! за 20 одиниць §gметалобрухту§!, а §Mвдосконалений літак§! — за 45 одиниць §gметалобрухту§!."
 FAV_gathering_mission: "Збір металобрухту"
