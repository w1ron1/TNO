 FAV_training_category: "Навчання"
 FAV_training_category_desc: "У нас мало вільної робочої сили, і кожен працівник та пілот для нас на вагу золота. Тому критично важливо підтримувати постійний приплив новобранців для роботи в складі §Gназемного персоналу§! або §Pпілотів§!. У той час як §Pпілоти§! потрібні для бойових вильотів проти Німеччини, §Gназемний персонал§! необхідний для підтримання здатності ремонтувати та виробляти літаки.\n\nКількість §Pпілотів§!: [?FAVRecruitedPilots]\nЩомісячний приріст §Pпілотів§!: [?FAVPilotGain]\nКількість §Gназемного персоналу§!: [?FAVRecruitedGround]\nЩомісячний приріст §Gназемного персоналу§!: [?FAVGroundGain]\n\nНаразі ми [GetFAVPilotGroundFavor]."
