 #SPS.1.t:0 "A Long Time Coming"
 #SPS.1.d:0 "Today saw the beginning of a new era for Spain. At first light, in the central plaza of Pamplona, hundreds of blue-shirted militia began to congregate, just as they had thirty years prior. Trucks and buses quickly filled the streets, discharging squad after squad of Falangists. Individuals, many grey-haired veterans of the last war, could be seen forming up in their old units on the outskirts of the city before marching in an orderly fashion to join their comrades.\n\nBy eight o'clock, the plaza was packed with militiamen. The majority were younger fellows who milled about and chatted with one another excitedly; for years, their only knowledge of the war had come from propaganda and the tales of their fathers, many of whom had died fighting the Reds and secessionists. In peacetime, the FET-JONS had been little more than a club for politically active citizens, but its martial tradition had never died and most of the youths who signed up believed wholeheartedly in the promise that they would eventually be called to fight in the name of the Fatherland someday. Now, that time had come. Behind their thronging mass, the old shirts looked on with a mixture of pride and concern - the Falange clearly had a long way to go before it could live up to the standards held in their glory days.\n\nHalf an hour later, a sudden silence fell over the plaza. One final vehicle arrived: an armoured, black-painted government car with little Falange flags fluttering upon its bonnet. From the passenger's side, out stepped a tall, plain-faced Falangist carrying a roll of cloth. He marched to the centre of the plaza and, with practiced motions, swiftly lowered the Iberian flag fluttering in the morning breeze. A moment later, a new flag was raised in its place - one not seen flying in public for decades. Red-black-red in vertical bars, in its centre was the yoke and arrows of the Falange. As one, every man in the plaza snapped to attention and raised his outstretched right arm in the fascist salute."
 #SPS.1.a:0 "Thus began the new Spain."
 #
 #SPS.2.t:0 "The Jefe Speaks"
 #SPS.2.d:0 ""My people... sons and daughters of Spain. For many years, we have been a crippled nation. Shunned by the Caudillo, our ideals were oppressed and throttled by the boot of reaction on our neck. Thirty years ago, José Antonio embarked on the greatest journey of any man in Spanish history, seeking to redefine our nation through his revolutionary ideals and reconcile the strata of society, that our years of strife might finally come to an end. It was a journey in the pursuit of freedom - the Falange became that freedom given form! Freedom from tyrants! Freedom from socialism! Freedom from chaos, uncertainty and fear!"\n\n"When the chance to split from the Caudillo came, I asked as your new Jefe for time, and that time was granted by you: the strength in my arm, the holders of my dreams. At first, it appeared that our cause was doomed, but in fact the struggle to claim our Navarrese heartlands only made us stronger! Now, with the time you have given me, I shall rebuild our nation... I shall rebuild our strength... I shall rebuild OUR PRIDE!"\n\n"On this day, we stand united once more. On this day, those driven to divide us will hear our voice! On this day, we shall act as one and we shall be ignored no more! Defenders of José Antonio's dream... NOW IS OUR TIME!""
 #SPS.2.a:0 "ARRIBA! ARRIBA ESPAÑA! VIVA EL JEFE!"
 #
 #SPS.3.t:0 "Spain Reawakens"
 #SPS.3.d:0 "The rebirth, the reimagining and the... reawakening of the Falange meant one thing and one thing only. The start of a reformation so grandiose, so ambitious and so revolutionary it has not been dreamt of since the death of José Antonio. Now things are different. We hold the reigns and rest assured, we will not let go of them until every ravenous Red, subversive snake and disloyal dog is expelled from our new state. The new and glorious Jefe Jaime Milans del Bosch is at the helm and he will be a far superior successor for our cause than that treacherous apostate Franco. With the first building blocks to our resurrection in place, the real work can now begin.\n\nThe call has been given out to all those who dream of a new Spain, it is being shouted out across the land and it is being called upon. Across the nation, we have begun the process that will bring the Falange back into the lives of the resilient Spanish people who have lived for too long under the yoke of a maldito despot. Our Blueshirts are rejuvenated and the ideals of José Antonio are being rekindled with the Spanish masses. The sleeping giant that is the Falangist ideology has become invigorated by the sight of Blueshirts marching, of barricades being set up and of the red and black flag. No doubt the rats in our lands cower before this magnificent spectacle but have no doubt that this disgusting fifth column's days are numbered. The fearsome forces of the Falange are to be bolstered and the unfaithful unionists and bedevilled Bolsheviks will have no place to run. History is marching and it marches with us."
 #SPS.3.a:0 "Cara al Sol, Arriba, escuadras, a vencer!"
 #
 #SPS.4.t:0 "Digging Up Old Grudges"
 #SPS.4.d:0 ""Big Brother" Ramón wheezed and coughed against the dust that filled the air of his old office in Madrid as he wrenched the old, rusted-out filing cabinet open. It had been three decades since he had last set foot in the building, but it had remained untouched ever since - a back alley party office, forgotten about by both the party and the government as rebuilding had taken priority. The search for any kind of documentation on the Falange's enemies from the last war had led him to some interesting places, but none had yet borne fruit. Hopefully, that would be about to change.\n\nRamón flicked through row after row of thick envelopes. As the office clerk thirty years prior, he had stuffed the filing cabinet's drawers without much concern for what went where - after all, neither he nor anyone else working in the office could have foreseen a second civil war within their lifetimes. Finances, hit lists, weapons shipments... there!\n\nHe lifted the black envelope in worn, callused hands. A quick glance at the contents spread a satisfied grin across his face - there, in his own carefully written letters, was a list of names in the hundreds: all of them leftists and minorities who had been 'rehabilitated' in concentration camps after the war and subsequently released into society. Ramón slammed the filing cabinet shut and marched out of the abandoned office, holding the envelope aloft to the approval and relief of his escorts. The night that was to follow had been a long time coming for the traitors who escaped true justice."
 #SPS.4.a:0 "The Falange has not forgotten those who wronged Spain."
 #
 #SPS.5.t:0 "A Knock At The Door"
 #SPS.5.d:0 "Pedro had not slept for 3 days. He was forever awaiting that dreaded knock on his door that would signal the arrival of those fanatics that made up the newly reborn Blueshirts. News of their purges had begun to spread, that anyone not deemed worthy of the new Spanish State was to be removed by any means necessary. Pedro knew his former loyalties to the Franco regime made him public enemy number one in the eyes of his new overlords. He had become essentially an enforcer of Francoism, making sure the cogs in the Union regime turned as well as they could. The new bosses though were clearly corrupted by a dogmatic ideology, hell bent on a destructive reformation that would sweep away Pedro with the rest of Spain. For three long, excruciating days Pedro lay on his bed waiting for his imminent death. On the 4th day that fearful knock finally arrived.\n\nPedro, his hands abnormally sweating and face red with worry, opened the door to find two young Blueshirts with papers in their hands.\n\n"Listen dog, you are to report to the ministry for instructions on your new role in El Jefe's glorious new state. Failure to do so will mean the execution of you and your loved ones. Do NOT disappoint us. Arriba España."\n\nAnd like that the door was shut and they were gone. Pedro put the papers that detailed his new job down on his desk and began to weep."
 #SPS.5.a:0 "The Falange sometimes forgives, but it never forgets."
 #
 #SPS.6.t:0 "The Hangmen Show No Reprieve"
 #SPS.6.d:0 "Carabanchel Prison has had a long history of keeping some of the most heinous and abhorrent fifth columnists that dared to plague Spain behind bars. The prison once housed (and thankfully got rid of) thousands of communists, anarchists and other snakes. In its glory days, the prison greatly achieved its purpose of protecting Spain from the heathenish fifth column. Now, many years later, it will accomplish another great mission for Spain. The decaying wretches of the old regime are to feel the wrath of Carabanchel Prison, just like the perfidious worms of the last war.\n\nTrucks arrived to the prison from across the nation, carrying the bureaucratic entities that wished Spain ill. Hundreds of bureaucratic bastards, implicit in the crimes of Franco and his corrupt regime, were herded into the prison cells like the animals they are. One by one their names were called out and one by one they stepped out to meet their fate. The dogs do not even deserve the luxury of a trial, everyone of them knows their crime and everyone of them knows of our justice. With the first batch of names read out, the mass hangings of Spain's vermin had begun.\n\nIt did not matter if this process would take days, weeks, months, or by God even years. These hangings represent something greater than any sense of justice against our enemies. It would also be the hanging of the old regime, it would be the strangulation of the decaying vestiges of Francoism, it would be the death of a venal Spain and the birth of a new glorious España." 
 #SPS.6.a:0 "For the good of the nation, let them hang."
 #
 #SPS.7.t:0 "All Quiet on the Home Front"
 #SPS.7.d:0 "The streets are quiet, orderly, cold. The only sound of life is the occasional bark of a dog - one of the few beings not subject to the harsh security measures imposed on this Catalan village by the Falange. The only time that the blue-shirted patrols see anyone is at dawn and just before dusk, when wives and mothers dart out to fetch groceries and the men head to and from their occupations before withdrawing to the confines of their homes. At night, if one should creep close to one of the dimly-lit homes unnoticed, fearful whispering in Catalan may be heard; the villagers dare not allow their language to be heard within earshot of the patrols, be they Guardia Civil or Blueshirts.\n\nThe villagers, despite all this, consider themselves fortunate. So long as the Falangists' new laws are followed, they keep to themselves, allowing for the Catalans to go about their daily business... albeit in a highly subdued manner. For as long as the peace is kept, no more blood will spatter the cemetery wall to the sound of the firing squad."
 #SPS.7.a:0 "A model minority."
 #
 #SPS.8.t:0 "To Drive Them Before Us"
 #SPS.8.d:0 "The attack struck as lightning from a clear blue sky. The first that any of the villagers knew of the Falangist assault was when a storm of 105mm artillery shells began to hammer down amongst the morning fog. Buildings were toppled in an instant, collapsing atop the residents who had just awoken in sweat-drenched terror. The unfortunates caught in the street are crushed by flying rubble, or simply cease to be as shells land right at their feet. Airburst shells are mixed in with the conventional explosives, sending down torrents of lead that reduce anyone caught in their path to bloody mulch.\n\nAs the barrage subsides, the Falangists charge. The wounded and dying who litter the shattered pavement are riddled with bullets or have their throats slit to bleed out like pigs. The door of a home that survived the artillery is unceremoniously kicked in, with the shrill pleading of the inhabitants drowned out by the vicious bark of assault rifles as the room is hosed down by stone-faced Blueshirts.\n\nWhen the last wretched Catalan has ceased its squealing, the Falangists' trucks roll into town. Corpses and ruined structures alike are doused in petrol. As the last Blueshirt climbs up to take his seat, he flicks away the butt of his cigarette, consigning the miserable village to the flames. Thus always, said the Jefe, to traitors."
 #SPS.8.a:0 "Let the fire enlighten."
 #
 #SPS.9.t:0 "Allies to Our Aid?"
 #SPS.9.d:0 "As the war from Spain's future grinds on, issues such as a lack of arms and volunteers may become a more alarming issue if we do not finish off our enemies soon. For that reason, we can turn to like minded Fascist brethren abroad in order to supply us with vital aid at this critical juncture in the war. However, recent instability in both Italy and Germany may put a spanner in the works when it comes to foreign aid. Whilst we could previously once have a guarantee of men and guns, this is likely to be no longer the case unless our cause has remained true in the hearts of our former allies. This is to be doubly true if traitors have risen to power whilst ourselves alone have been fulfilling the work needed to establish true Fascism. Circumstances are certainly different to that of 1936, but we must try anyway. It's our nation's soul that is on the line and we must be willing to accept any aid possible to achieve Spain's resurgence."
 #SPS.9.a:0 "Send out the message, the Falange seeks support"
#
 #
 #SPS.10.t:0 "The Training Of Spain's Finest"
 #SPS.10.d:0 "The Blueshirt company stood standing in formation as a ragtag band ranging from young Falangist ideologues to old veterans of the last civil war. Each and every one of them were there for the same reason, to revitalize España in the vision of José Antonio. To do so however, they were not to be merely some untrained army of naive dreamers. No, they were to be part of the armed nuclei of the Falangist movement. They were to be soldiers armed not just with the maxims of José Antonio but also the skills needed to take back Spain from its treasonous and corrupt elements. To do so meant putting this would be militia, that was to be the backbone of the new Spanish army, through its paces.\n\nNo matter what their age was, how privileged their background or how many lines they knew of José Antonio's poems, it did not matter. If these men were to be the saviours of the Falange then they had damn well better prove they could become so. Each and every man was to be trained every day to the point of exhaustion. From daily combat sports to constant fitness tests, the would-be soldiers of El Jefe would not repeat the failures of the unorganized and untrained militias from the last war. They were not the leftist cockroaches, disorganized in their little poet battalions and divided by ism and schism. Each man was to prove himself a soldier and each man who proved themselves to be a true Falangist did just that. The rest, the weakling layabouts, were drummed out or simply died during training. A necessary sacrifice for Spain, we're sure. For this intensification represents one thing and one thing only. The final defeat of Spain's enemies, brought on by the new glorious Spanish army."
 #SPS.10.a:0 "The Blueshirts march on, stronger than ever!"
 #
 #SPS.11.t:0 "Retaining the Structure"
 #SPS.11.d:0 "A long line of Falangists in civilian clothing stretches around the block from the city hall, growing in length with every passing minute as news of the Jefe's decree spreads. All carry their standard-issue blue shirts folded over their arms. While the few grey-haired veterans amongst them can be heard grumbling, most are excitedly chatting amongst themselves as the line gradually shuffles through the city hall's entrance. Within, everything has been cleared away from the floor space to make room for row after row of desks. Seated at each is a blue-uniformed female auxiliary operating a sewing machine.\n\nAs each Falangist enters, their name and rank is checked. One swipe of a pen later and they are handed an appropriate set of chevrons, then directed to find a free worker. One young man, Comrade Valdez, slips past the crowd attempting to get at the row of desks nearest the entrance, wisely deciding to head for an unoccupied brunette girl at the far end of the hall. She smiles proudly up at the militiaman as he sets his shirt face-up on the desk with a twinned chevron patch atop it. With practiced skill, it takes the girl only moments to rip the old patch free and stitch the new one into place.\n\nValdez lifts the shirt to admire it, beaming with pride. "Congratulations, Comrade," says the girl cheerily. "I'm sure you'll do us all proud, Corporal Valdez.""
 #SPS.11.a:0 "Now, none shall doubt our legitimacy as an army!"
 #
 #SPS.12.t:0 "Rip It Up And Start Again"
 #SPS.12.d:0 "The latest in a long line of Blueshirt parades was unlike any other seen previously. The everlastingly embittered group who had seen their prestige fall wayside under the Union now constituted themselves as a professional army, armed not only with dangerous ideology but also the skills and techniques of a modern combat force. The parade, from its visions of in sync marching Blueshirts to extravagant flag displays of the red and black, showcased to all those present that the Spain of old was gone. The bureaucratic and unenthusiastic armed forces of the Iberian Union had been replaced in these lands by the staunch adherents of National Syndicalism. Fanatical, dogmatic and well trained, these Blueshirts now made up the base of El Jefe's España.\n\nIn a speech to the large mass of veteran Blueshirts, El Jefe Jaime Milans del Bosch himself stated to the enthusiastic Falangists that...\n\n"The rebirth of the Blueshirts as the protectors of Spain from the ills of democracy and communism embodies the birth of a new Spain. One of National Syndicalism and impelled by the spirit of José Antonio. Not one step back now my brothers, the enemy is poisonous and deceitful but they are not armed with the character of the Falangist movement. Blueshirts, march on... to victory!"\n\nWith that final shout, the Blueshirts roared right back. The flags of the Falange waved high as Cara al Sol was sung loud and proud by El Jefe's militants. This was to be the new face of the Spanish army and, by proxy, the face of his New Spain."
 #SPS.12.a:0 "Every Blueshirt a soldier, every soldier a zealot."
 #
 #SPS.13.t:0 "Recruitment By Force"
 #SPS.13.d:0 "Álvaro just wanted to keep his head down and trudge through this cursed war. The instability, the riots, the purges and the hardliners combat squads all now dominated life in Spain but he had somehow managed to avoid the worst of this. His brother had not been so lucky, caught up in the crossfire from the street battles between the left and right at the wars start. He was determined that he would not meet the same fate, that he would carry on his family's name and live his life fully in spite of the destruction that seemed to surround him. The Blueshirts however, had other ideas.\nAt first it started with simple leaflets through the door. Álvaro simply ripped them up and tossed them in the bin, it was fanatical rubbish after all. But the leaflets did not stop, every day they arrived and everyday Álvaro tossed them away. Next, however, came a knock at the door. A teenage Blueshirt, no older than 16, greeted Álvaro with a Falangist salute as he opened the door.\n\n"Morning brother, it's your lucky day. You are called upon by El Jefe's España to sign up for the glorious war effort. It will be a great day for you to finally meet your Blueshirt brothers..."\n\n"No thanks." interrupted Álvaro. "I think I'll pass."\n\n"B...b..but..." the Blueshirt stuttered as Álvaro shut the door on him. If "El Jefe" thinks he can ruin his life that easily he would have to try harder. The next day however, there was no knock at the door. Only the violent clash of boots against wood. Three Blueshirts burst into Álvaro's home with batons and beat him bloody and senseless.\n\n"Listen you fucking worm." Shouted one of the men. "You'll sign up to the army tomorrow or I swear to God, we'll cut off your fingers and throw you in a fucking ditch. You'll be given your new orders shortly."\n\nIn that very instance, Álvaro knew his life was over. This war would be the death of him. Just as it would be for many, many others."
 #SPS.13.a:0 "No-one can escape this war; it has become the essence of Spanish life."
 #
 #SPS.14.t:0 "For The Greater Good of Spain"
 #SPS.14.d:0 "The viciousness of the Blueshirts recruitment drive took new heights as a decree by El Jefe deemed that anyone able to fight for the Falangist cause must do so. Old men, women, sometimes even abled children were sent out to the frontlines in order to stop the crisis of a Falangist defeat. It was deemed that a newly bolstered army of abled recruits would guarantee final victory in this crucial stage of the war. To the zealots at home who were previously denied such a service in the army, this was music to their ears as they eagerly rushed to the frontlines. But how did the Blueshirts achieve such a mass conscription of what used to be the chunk of uncommitted non-combatants who had no interest in the Falangist cause? Through the tried and tested means of fear and death.\n\nThose that disobeyed the Falange, decrying that the war was futile folly and had needlessly torn Spain apart, suffered the fate of whatever was deemed just by the fanatical Blueshirts who were now utterly consumed by total war. It was not an unfamiliar sight to see littered around Spain, the corpses of old men publicly hung with written signs pointing out their alleged cowardice. Fearing the Falange more than the frontline, yet more Spaniards were sent to the killing fields to die for the glory of José Antonio and his "enlightened" ideas. Hopped up on a combination of blind patriotism, naïve idealism and utter fear, the Falangist army began its new push to conquer Spain under the red and black flag."
 #SPS.14.a:0 "Dulce et decorum est pro patria mori"
 #
 #SPS.15.t:0 "The Bloody Blueshirt Breakthrough"
 #SPS.15.d:0 "The advancing paces of the Falangist forces had come at a heavy price. In order to finally smash through the enemy lines, hordes of barely trained pensioners and teenagers ran straight at enemy positions to allow for the advance of more veteran forces in scenes eerily reminiscent of the bloodbaths of previous great wars. The newly bolstered brigades of Blueshirts gave as good as they got though. Lacking any sort of moralism or discipline, the fanatical war-weary militants committed act after act of brutality in this war of brothers. Villagers were razed, POW's were tortured and all was deemed necessary by El Jefe's commandments. Harking back to the writings of the long since deceased José Antonio, the mass uncontrolled violence was merely part of the "dialectics of fists and guns". This was all part of Spain's rejuvenation and "if this has to be achieved through violence, we shall not be stopped by violence". With this message ringing out to the Blueshirt army, the usual sadisms brought upon by ideological war reared their head once again. White Terror swarmed Spain once again and this time, it would not relent one bit.\n\nWith victory in sight, the Blueshirt army was filled by a newfound confidence that allowed for their most lustful intentions of revenge to take place. The Blueshirts, more frenzied and rabid than they had every been, went on a rampage of rape and murder unseen in Spain since the last war. The very worst of the Falangist war machine was displayed for all to see as the bullish Blueshirts ran rampant through the streets of their newly conquered domains. Incidents of head shavings, gang rape, the beating of pregnant women, and the parading of "war trophies" became all too common. The Blueshirts were urged on the old radio broadcasts of Gonzalo Queipo de Llanowith a clear message that was taken up by every ferocious Falangist.
 #SPS.15.a:0 ""I authorize you to kill like any dog who resists you, that if you do so, you will be exempt from all guilt." - Gonzalo Queipo de Llano"
 #
 #SPS.16.t:0 "A Spanish Phoenix Rejuvenates The Nation"
 #SPS.16.d:0 "As the last bastions of resistance to Falangist rule were being systematically extinguished by the victories Blueshirts, El Jefe began his first speech as the undisputed leader of Spain.\n\n"Brothers and sisters, a new dawn is upon us. The dawn of a rejuvenated Spain which will be free of the woes of war. Today, my fellow patriots, I speak to you as El Jefe of all of God's Spain just as he intended. The immortal sacrifice of the Spanish people against the forces of liberalism, separatism and communism will be rewarded with our final victory over the Godless traitors. This grand triumph guaranteed by our fallen compatriots, who have been canonized for their heroism. But now, my Blueshirt brethren, we must not rest easy. Lick your wounds and mourn your dead for the real work to establish José Antonio's dream is upon us. Do not let the deaths of our loved ones be in vain, for it is your job to make this dream a reality! Let us work now for the good of the Falange, and for our new Spain. España una! España grande! España libre! Arriba España!"\n\nWith that last cry of the final lyrics of Cara al Sol, the broadcast was echoed around Spain leading to parades of triumphant Blueshirts and the subsequent executions of their enemies."
 #SPS.16.a:0 "Hemos pasado"
 
 SPS_wars.1.t:0 "He Who Is Without Sin"
 SPS_wars.1.d:0 "Lieutenant Jorge paced anxiously around his cramped office in Toledo, frantically flipping through the pile of reports and folders he was holding. He was searching for something, anything, to solve the unfolding chaos within the broadly useless documents. As if in an echo of his frantic thoughts, his once-meticulous office was awash with abandoned papers, chattering officers, and noise. So much noise.\n\nJorge turned to see a young, nervous corporal attempting to maneuver in the chaos, defensively clutching a fresh pile of reports. He wasn't who Jorge would usually ask to see, but who knew where half his staff were. Beggars couldn't be choosers, and he needed this message sent. Jorge stormed through the crowd, much less gracefully than the corporal, and began barking at him.\n\n'Corporal! Tell the bastards over at the Alcázar that we need them at Avenida de la Union! Reds have started barricading the avenue and shooting! If the pigs don't show up soon we'll have to destroy the whole neighborhood to dislodge them! Tell them they're letting the communists take the fucking city!' The corporal nodded anxiously, dashing away.\n\nJorge stopped for a moment to catch his breath. How did it all come to this? This was not supposed to be his job. He was supposed to be with his troops at the front line now, squashing rebellious Basques or Portuguese. This was Guardia Civil nonsense, but they were slovenly absent; a useless waste of money and ammunition.\n\nHow could the Caudillo let it get this bad? He had saved Spain once - but perhaps what other officers were whispering was true. Perhaps the Caudillo was getting old. The Guardia Civil's absence brought images of American support and Jewish money to Jorge's mind. A chilling thought ran down the Lieutenant's spine."
 SPS_wars.1.a:0 "Was the Caudillo still fit to rule Spain?"

 SPS_wars.2.t:0 "Purgatory"
 SPS_wars.2.d:0 "Colonel Alfonso buried his face in the frigate's railing, closing his eyes to the blazing sun and the flag flying above the hot metal deck. His soldiers were safe; but he had failed. Tangier was lost. They had lost.\n\nAs the ship sailed into the ocean, the steel railing's heat grew unbearable. Alfonso welcomed it. A small price to burn clean his failure. The pale faces, Joaquín and Pablo's terrified screams and the stampede towards the ship kept flashing in his mind, as well as a question: How?\n\nAn answer came to his mind. Tangier had been effectively abandoned by the Iberians for weeks now, only the port still being held by his skeleton crew. "Too strategic to abandon, hold until relieved", his orders had said, as he'd been forced to abandon nearly every defensible position they had in the city. He had waited too long to ask for reinforcements from across the strait. By the time he had, it was already too late. His hesitation had brought ruin.\n\nA merciful breeze crossed Alfonso's face, but the heat underneath him grew too harsh to bear. He opened his eyes and slowly stood up straight, feeling the eyes of his soldiers fixed on him - he could not tell whether in admiration, curiosity, or disgust. He leaned over the rail and emptied himself into the Atlantic Ocean, letting out a silent scream of loathing as vomit floated on the blue water.\n\nHolding tight to the rail with one hand, Alfonso grabbed binoculars from one of the sailors with the other, searching for the increasingly distant port just in time to see the dark red Moroccan flag being raised over the Port Office. He watched the fluttering flag for a few minutes.\n\nThe Empire was gone, and they had gone with it."
 SPS_wars.2.a:0 "He was so tired."
 SPS_wars.2.b:0 "In the port's waters, a lone Iberian flag was sinking."

 SPS_wars.3.t:0 "General Mayhem"
 SPS_wars.3.d:0 "Lieutenant-General Jaime Milans del Bosch stood in his command tent, along with three other officers. His table was almost invisible under the piles of maps and notes, yet he seemed able to navigate the mess. His subordinates followed with their eyes as he traced a front line on the largest map before them.\n\n'If we move our forces from Galicia in time, we could consolidate in western Cantabria and take the fight to the Basques. What do you think?'\n\nOne of the junior officers piped up. "Sir, doesn't that expose our western flank? Aren't we supposed to stay here and counterattack when possible?'\n\nMilans del Bosch smirked. "The Portuguese are traitors, but they're little more than a house of cards. The Basques' - Milans almost spat out the word - "are more dangerous. Their uprising caused all of this chaos in the first place, and is threatening the unity of Spain itself! Understood?'\n\nSilence hung. 'Sir', another officer interjected. "What about our positions here? What should we tell Madrid?'\n\nMilans del Bosch pinched his nose for a moment and sighed, before looking up. "Lieutenant, what is this map?'\n\n'A map of the Union, Sir'.\n\n'Wrong.' Milans del Bosch picked up the map and tore it in half, clawing at the paper in the face of his shocked subordinates. "The Union is gone. Weak men couldn't hold this land together, and the traitors have come out of hiding. The only government left is that which can assert itself. We have the opportunity to consolidate Spain and assert ourselves. Then, and only then, can we recover what's ours. That which belongs to Spain. Arriba España!'"
 SPS_wars.3.a:0 "That evening, Lieutenant-General Milans del Bosch's command began marching east."

 SPS_wars.4.t:0 "A Momentary Setback"
 SPS_wars.4.d:0 "Antonio Barroso y Sánchez-Guerra was enraged. He slammed the door behind him with a grunt, and practically tossed a chair sitting askew to the sole table, slumping down onto it. In one hand, he held a report recounting events he had personally witnessed, personally agonised over, reduced to detached statistics. Taking a breath and peering into nothing, Sánchez-Guerra took a deep breath, mulling over what few revelations it could give him, hoping to steel himself for days ahead.\n\nHis unit had been assigned to Catalonia for some time, assigned to countering partisan activity. Even as funds and resources dried up, overstretched by vigorous activity nationwide, he nonetheless managed to retain a vague modicum of control over the province. Security was strong, and managed by high morale. Through the thick haze of disappearances, public trials and executions, he had managed to make a name for himself as relative peace was secured around Girona.\n\nBut then the Basque seceded, the weakness of a few regiments in the north condemning the Union. Suddenly, his regiment found itself facing renewed opposition, rapidly depleting as partisan activity rose alongside desertions, their names marked in deteriorating detail. To the backdrop of budding pressure, both within the province and against the supposed failures of his compatriots, they were forced to disperse across the country. His forces had been forced into Toledo. Far from their actual base, and close to Franco.\n\nHe set the report down one last time. He knew that he would return to Catalonia. Franco's mad quest to unify Iberia had been madness, but that would not sink him. A new leader had to be installed at some point, one willing to lead Spain back to its former glory. In his mind, he could see decorated men goose-stepping over the mangled corpses of Catalan separatists, through quiet, respectful streets."
 SPS_wars.4.a:0 "And then, he considered an offensive aimed at cutting off Barcelona."
 SPS_wars.4.b:0 "And so, he agonised over how they would defend against him."

 SPS_wars.5.t:0 "A Call of Duty"
 SPS_wars.5.d:0 "Lieutenant Oscar Cápitan lifted off his cap, wafting it toward his head as he watched the silhouettes of a few soldiers march beneath the tinted, setting sun. The past few weeks had been a blur, the past few days an utter nightmare. Past failures had emboldened separatists, and had only excited rioters. He refused to betray his emotions so openly, but struggled to stop his face turning to displeasure.\n\n"Commandant Sandoval, sir," spoke one, snappy and regimented as he halted in front of Cápitan. "You wanted to speak to us?"\n\nOscar's mouth tugged upwards, but only fleetingly. "Of course. I've received reports of rioters down in Asturias. No separatists there yet, but we both know it's only a matter of time."\n\n"Indeed, sir," responded Álvaro, an echo in tone and disgust.\n\nOscar looked over his shoulders to watch over the others that had accompanied him. None seemed willing to refute their claim, but they looked at him with suspicion. "Police forces have been pooled in where they can be afforded, but it isn't enough. We're needed to boost numbers, and to ensure order is maintained."\n\nAnother man refused to stay silent. "But sir, we can't just attack rioters," responded Ferran Blázquez, a reservist drawn in at the last minute as Spanish forces had evacuated Catalonia..\n\n"We could still negotiate with a few of the-"\n\n"Did I not give you an order?" snapped Oscar, "You are a soldier loyal to Iberia, you do not question orders." Ferran gave a brief apology, voice wavering, but the disobedience stuck in Oscar's mind as the small troupe marched out."
 SPS_wars.5.a:0 "Perhaps the rot really was spreading downwards."

 SPS_wars.6.t:0 "Sharks in the Water"
 SPS_wars.6.d:0 "Walking around the table, populated with emptied glasses and strewn papers, Tomás García Rebull found himself taken aback. He had expected fewer people to come; the remnants of the Iberian military was only ever getting more overstretched by the hour. However not one man had missed the meeting, placing a degree of welcome strain on Rebull himself.\n\n"Well, Tomás, did you find that useful?" asked Manuel Valdés Larrañaga, still standing in the doorway and surprised at Rebull's slow pace as he turned around. "I definitely found some positions to be... fascinating, shall we say.."\n\n"I think these officers have had enough, Manuel," replied Rebull, moving towards Larrañaga. "This government has lost the confidence of everybody, even those in the military. Those loyal to Spain have grown tired."\n\nLarrañaga shrugged slightly, an attempt to save face. He had been worried by the decision, fearing it to be too visible a statement against Franco's authority, but had finally consented. "I agree. I really did expect better from Franco and had always set aside my concerns with the Union over his leadership. But who can justify some of his moves here? Seems some of the wider officer corps share the feeling."\n\nRebull folded his arms as he raised an eyebrow. Shaking his head, he returned to a walking pace. "You underestimate. We can't squander this opportunity. This is the perfect time for us to strike. These officers are ready for Franco to leave, whether or not his body gives out first."\n\nLarrañaga sighed, filled with fatigue for the regime. "I'll move ahead with our plans, then. I'll contact Pérez-Viñeta and Codón, and will start to negotiate with a much wider section of the army first.""
 SPS_wars.6.a:0 ""...I'm sure something else will crack for Franco first, though.""

 SPS_wars.7.t:0 "Last Call at the Inn"
 SPS_wars.7.d:0 "The room around Carlos Iniesta Cano was small, yet the lack of attendance helped to inflate its size. Franco had tried to call a meeting, ostensibly to coordinate those actively engaged in fighting, but Cano thought he could recognise attempts to secure preserved loyalty. As he visibly struggled to get comfortable at the head of the table, Cano briefly wondered if it was him expecting more generals to come.\n\n"I'm glad that you were able to spare the time to meet, gentleman," said Franco, his anger palpable. "Some within our midst think that they're too important, but I'm glad that not every bastard ignores their Caudillo. Any updates on strategy?" His voice was raspy, his face bitter, but the room still erupted into silenced shock. Cano looked ahead with suspicion.\n\n"Well, we managed to suppress riots in León," responded one of the few attendees, identified via name card as being Vergara, a junior officer who still seemed to be nervous. Definitely not the first call; Cano questioned if he was second. "We want to send forces to help those in Vigo."\n\nFranco looked at him for a second. Cano struggled to make out if he was even trying to speak as the Caudillo's eyes seemed to be tinted with mist. "That will be good. We need strong men to stop the León riots." Another moment of silence extended itself, eyes looking around in bewilderment as Franco offered no further input.\n\nThe meeting continued, and then concluded. Cano watched in horror as the scene continued, listening as whispering officials with eyes of traitorous thoughts rushed out from the farce. Franco himself winced, struggling to limp away. His posture looked shrunken, his body limp and head wrinkled. Cano walked behind him, no longer wondering why so few members of the military wanted to be reminded of their leader."
 SPS_wars.7.a:0 "Franco couldn't defend a village now, let alone a country."

 SPS_wars.8.t:0 "Ghost in the Machine"
 SPS_wars.8.d:0 "The topic of discussion within the heart of an impromptu military base in Valladolid had long since slipped away from its official pretence, but nobody paid it any heed. Rooms had been slapped together, with the jagged ruins of abandoned villages extended by white tarps thrown over wooden pikes on either end. Groups of Falangists and Carlists huddled together, distancing themselves as much as possible around tables, with gaps filled by some sceptical officers brooding with stolid dread.\n\n"I have support from practically every man under my command, as well as many in Franco's cabinet," said Carlos Iniesta Cano, bluntly. "It's not a decision I take lightly, but forming a junta now would stop the bleeding. The situation could be resolved in our favour within a few days should we apply pressure carefully.\n\nJosé María Valiente clutched his hands tightly, bringing them closer towards him. "We don't have many figures able to rally the country quite like Franco..." he replied, monotonously. "I have men in meetings with the Duke of Madrid right now. If we can afford to wait slightly longer, we could have him coronated." A few protests came from Falangists, mostly ignored by Valiente and actively hushed by the moderates among them.\n\nSuddenly, a junior officer rushed in, carrying a radio in one arm sputtering poorly transmitted whispers blurring the line with static. "Hello? Hel... is Colonel Ordóñez... Galicia is lost..." snarled the one clear voice, silencing the meeting. "Separatists have seized La Co... withdrawal from Orense... new republic headed by Xosé Velo..."\n\nThe meeting stewed in silence for a moment, stunned by the development. Finally, José María Valiente relented. "I understand now. I thought we still had time, but we can afford a later coronation. Franco must go. A Junta needs to be proclaimed now.""
 SPS_wars.8.a:0 ""Whilst there's still a Kingdom to be ruled.""
 SPS_wars.8.b:0 "Flee from this madness to the mists of Galicia."

 SPS_wars.9.t:0 "Truth on Austerity"
 SPS_wars.9.d:0 "The time for Franco to leave had long since passed, and yet he continued to linger. Despite that, Cano did not put much stock into the issue. His time as Caudillo was coming to an end, with significant efforts to motivate that end among the Iberian military. Even still, as he moved to phone Luis Carrero Blanco through the halls of a small, cramped bunker, he feared the potential response, and feared a last rally that could still sink them both yet.\n\n"I don't have all day, Carlos." said Blanco through the line in a hushed tone. "I've got enough on my plate even ignoring the latest developments."\n\nCano sighed. "I've heard. A republic has been declared in Seville, and has been rapidly gaining support across the south." An exaggeration, he thought, but only barely. "Franco will not be safe remaining in Madrid."\n\nSilence came down the phone line, one that could be ill afforded. "Maybe, but leaving wouldn't be wise, Carlos," responded Blanco, audibly nervous yet still frustrated at the question. "By withdrawing so soon, we risk dissolving our support with most loyalists remaining in the country."\n\nThe response came almost as a relief. These concerns were practically capitulation. "Their numbers are dwindling anyway," spoke Cano, allowing himself to smile slightly. "Most officers I've been in contact with are actively pushing for a coup. I know a few regiments outside the city might still be loyal, but fifth columnists are teeming in Madrid."\n\nA groan came down the line, followed by a few muffled shouts, and then silence for another brief moment. "I will talk with Franco, but if what you say is true, then it might be wisest for us to leave after all, until loyalty is secured in the region." Blanco continued with minutiae, demanding purges and names, pushing for a loyalty that Cano had long since lacked."
 SPS_wars.9.a:0 "All of that melted away in Cano's mind, now awash with the next step."

 SPS_wars.10.t:0 "Finishing Touches"
 SPS_wars.10.d:0 "From the vantage point of a small tower, one of the few remaining relics of a small military base that had long since been scuttled, Carlos Iniesta Cano watched the commotion beneath him with arms clenched behind his back. A few small figures pushed carts into the gaping maw of a plane, whilst a few more escorted other small figures that he knew were Franco and his family. A handful more swept the area, looking for potential assassins, keeping watch elsewhere. Cano allowed Franco that luxury.\n\n"Sir!" shouted an aide, breathless as he rushed forwards. "I've got reports from Valladolid."\n\n"I presume that this is about the coup?" Cano responded, grinning. With Franco leaving the city, and the country itself, he struggled to see any opposition remaining.\n\n"Yes, it is." Cano considered leaving the thought to linger for a moment, the notion of now being the most influential figure in the Junta simmering in his mind, but decided against it. "It was successful. A few isolated pockets tried to resist, but quickly surrendered and with minimal casualties on either side."\n\nCano turned around to face the aide, mulling over the information. "I suppose there's some benefit to loyalty even when misguided. We should purge the most dangerous, but in these difficult times, we can't purge soldiers too freely." He walked forwards slightly, stroking his chin as he considered any further vulnerabilities. "Any news on the front?"\n\nThe aide cringed slightly, but continued. "Nothing significant. The rebels and republicans have pushed slightly further, but are being held off." No newfound pledges of loyalty; the issue seemed to have been worse than initially thought. But even still, thought Cano as he left to attend an imminent cabinet meeting in Valladolid, he had stopped the bleeding."
 SPS_wars.10.a:0 "Franco's plane left the country, unnoticed by his successor."

 SPS_wars.12.t: "Shopping Lists"
 SPS_wars.12.d: "To all officers assigned to Zone 8 Block 3 in accordance with Emergency Directive 31.\n\nMr Juan Puebles, Floor 2 Room 23. Lives alone, veteran. Risk of firearms on premises.\n\nMr and Mrs Hugo López, Floor 2 Room 29. Mrs López, first name María, is suspected to be in an affair with a suspected communist. Bring both in. Mrs López should be capable of answering questions immediately so observe restraint.\n\nMr Javier Pérez, Floor 5 Room 50. Reported subversion tendencies. Family is to be left alone.\n\nMr Dario Sánchez, Floor 6 Room 62. Only son of resident Sánchez family, identified in underground student organization. High priority.\n\nMrs Marco Hernández. American born, first name Emily, 10 years residency. Possible involvement in socialist literature dispersal.\n\nMr Vidal Delgado, Floor 7, Room 70. Building proprietor. Due to the high number of suspected residents further interrogation required.\n\nIn all cases use of coercive force is authorized. Should local evidence suggest others at the address are possible suspects, under Clause 8 of the Emergency Directive officers are permitted to expand the number of detainees at the discretion of the nominated Zone Officer."
 SPS_wars.12.a: "Options: With mathematical efficiency, the city shall be cleansed"

 SPS_wars.13.t: "Nightfall"
 SPS_wars.13.d: "They stood in a line, blocking the path continuing down the Calle de Madrid. The street seemed claustrophobic to them all, the brick walls on both sides imposing down on them as they shared the red hue of the setting sun's sky.\n\nThe shouting could be heard before the mass could be seen.\n\nThe voices were young and light, demanding changes. A litany of banners and flags waved above the sea of student faces. Some flew red flags. Some flew black flags. Some flew the flag of the old republic, crudely made but unmistakable. Banners called for socialism. The end of martial law and dictatorship. Despite the diverse ideas they all chanted for one thing; liberty from the Francoists.\n\nMany of the soldiers blocking them were of similar age, and shifted nervously. The command came to make ready, and they raised their rifles. An officer walked through a gap in the wall of soldiers, megaphone in hand, commanding the approaching column to disperse the illegal gathering. If not they would be fired upon - a threat met by jeering.\n\nA lifetime passed and the crowd moved closer. The officer spoke again, some of the soldiers noting the masked pleading for the column to stop. The chanting instead called for the soldiers to break their chains and join them. Nervous eyes glanced at their comrades. Rifle barrels wavered.\n\nThe officer dropped the megaphone and put his head in his hands, walking behind the line of men. The column did not stop. 100 meters. 80 meters. 60 meters.\n\nThe order was given."
 SPS_wars.13.a: "Option: The protest was dispersed"
