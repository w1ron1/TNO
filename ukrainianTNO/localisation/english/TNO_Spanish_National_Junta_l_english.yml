 #National Spirits 
 SPS_heirs_18_july:0 "Heirs of the 18th of July"
 SPS_heirs_18_july_desc:0 "In 1936, the patriotic Nationalist generals would rise against the degenerate Republican government in a bid to save Holy Spain from destruction. Carlos Iniesta Cano follows in their footsteps, stepping in against the failing government of Franco in order to save the Spanish state from falling into anarchy.\n\nWith this spirit of historical inheritance unites the people and politicians under the Junta, ordained by history to come out victorious like the one before it, unity is paramount to the vast coalition of the state. However, this unity remains dependent on one thing alone; the victories at the front."
 SPS_german_contacts:0 "German Contacts"
 SPS_german_contacts_desc:0 "The Reich and Iberia have not had the best relations. This coldness however came near entirely from the Portuguese side of the peninsula, with its Spanish counterpart housing many that had supported the Nazis ever since the outbreak of the Civil War.\n\nThus, with the peninsula falling into anarchy, the old ally of the Nationalists would once come to their aid, with German arms fueling the war effort against the Republicans. However, with their influence growing by the day, it is far from a secret that the aid isn't free and sooner or later the Junta will need to pay back the Hun, one way or another."

