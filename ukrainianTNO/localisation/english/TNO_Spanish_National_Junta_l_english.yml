 SPS.12.t:0 "No Coats Left Unturned"
 SPS.12.d:0 "If you squinted, past the scratches and the flecks of water stains that marked the window to José Luis Arrese's office, you could just make out a small, black cloud rising over the horizon. In peacetime, it would have caught the attention of every soul in the area. Now, the burning corpse of a town of hundreds, and their citizens, was another site to see - no different from an oddly shaped cloud, or a landmark.\n\nAway from the carnage, Arrese - massaging his face, which was currently failing to fight against both the terrors of balding and greying hairs - sat at his desk. A small piece of paper, pockmarked with hastily drawn phrases and even hastier scribble outs, sat in front of him. Propaganda. Such an ugly word, one that does it a disservice. The war that Spain - its people, its history, its culture - faced would decide whether it would live or die! Anything and everything should be on the table for the survival of one's people, for the era they lived in now decided whether Spain lived or died. Propaganda was not a nice word. But they didn't live in nice times, did they?\n\nSighing, Arrese reclined in his chair. How many times had he done this? The same song and dance. Before this, he was Franco's greatest friend. Before that, he was his greatest enemy. Everything he had done was for the greater good, no? A true soldier was prepared to sacrifice everything and anything for his goals, including his morals. Morality, in the face of total war, was nothing but a binding agreement that had just recently expired. He looked at the grandfather clock in the corner, dominating the room with its hand carved curves and wooden varnish. Almost a quarter to five. The sunset cast orange light into the dusty, dark office - highlighting every fleck of dust in the sunbeam. Staring off into the distance, Arrese could not help but hear a whisper, a faint note in the wind, if he turned his head just so. It was, of course, the same thing he heard every day."
 SPS.12.a:0 "You are a shell."

 SPS.13.t:0 "Just a Social Call"
 SPS.13.d:0 ""How's the weather up there, Javier?"\n\n"It's cold, it rains nearly always and I'm surrounded by would-be Englishmen and fake Frenchmen. If Hell froze over, José - this is what it would like. At least tell me you've brought me good news" Javier de Borbón answered back, his sardonic tone barely masking his rage against the circumstances he found himself in.\n\n"The war is going... fine. But I fear that, that's not what you came to call me about it. Is it?" José María Valiente lowered his voice, almost to a hush - as if someone was listening into their conversation.\n\n"This happened before, did it not? Just like in 1939, we somehow win and lose, at the same time. When is the last time a Carlist had any sort of influence over Franco's policies, hm? God is on my side, and yet he seems to trip me over constantly a step before the finish line!" de Borbón brought his voice to a crescendo, in defiance to Valiente's tact.\n\n"Calm down, please. They won't try anything like that again, not now, at least. Let us focus on winning this damn war and then we can deal with those that want to meddle in the affairs of Spain, for their own profit." Valiente sighed, inaudible to the recipient.\n\nThe truth was, he had no idea if the Junta would make good on their promise to further include the Carlists inside their new regime. What was to stop them from scorning them again, just using them as pawns for their own goals? But that wasn't something that should be dwelt on, not in times of such apocalyptic struggle like now.\n\n"And what happens after the War? What happens if they try to repeat History, José?""
 SPS.13.a:0 "God's Mercy is Infinite, Javier. Ours is not."

