 #Ministers
 SPS_Carlos_Iniesta:0 "Carlos Iniesta Cano"
 SPS_Jose_Maria_Valiente:0 "José María Valiente"
 SPS_Raimundo_Fernandez_Cuesta:0 "Raimundo Fernández-Cuesta"
 SPS_Unorganized:0 "Disorganized Leadership"

 SPS_Tomas_Rebull:0 "Tomás García Rebull"
 SPS_Tomas_Rebull_hog_desc:0 "§YPresident of the National Junta\nCorporate Statism§!\n--------------\n§LThe bulwark of civilisation is threatened. To arms! Veteran of the Spanish Civil War, the Eastern Front, and now the Iberian Wars, Tomás García Rebull is keenly aware of what will come should the forces of order fail. Among the original young Blueshirt combatants, the oldshirt is the premier Falangist inside the junta, striving for legislative and combative victory so that Spain may see a new spring dawn.\n\nLieutenant General García is also the ideal Falangist collaborator for the junta. This is because the blue general still holds a purified version of the old regime as perfect. A perfect blend of Falangism and military leadership, who stand above and beyond petty party politics. Thus, he will typically put the interests of the army first, trying to redirect National Syndicalist energy toward loyalty to the regime, and leveraging Falangist policies for his service.§!"

 SPS_Jose_Codon:0 "José María Codón"
 SPS_Jose_Codon_for_desc:0 "§YSecretary of Foreign Affairs\nAbsolute Monarchy§!\n--------------\n§LOf all Christian virtues, José María Codón embraces temperance. Despite intransigent Carlist complaints, only in tandem with the Spanish far-right was liberalism's march halted, and traditionalists afforded political posts. Thus, he preaches a rare sermon of a Falangist-Carlist fraternity forming the spine of Spain; for this, the Falangists tolerate him, assured he has not taken the ministry to stymy them.\n\nAs foreign minister, María Codón is perfectly suited and perfectly powerless. A Carlist long estranged from Carlism due to his immoderate Francoism, and an enthusiast of the junta, he represents Nationalists well. However, much to the Falangists' glee, the Carlist minister is consumed by difficulties. He must keep German aid flowing and avoid dependency, seeking wider fascist support. Due to the wars, those formerly in Iberia's orbit are ignoring his attempts to reestablish ties.§!"

 SPS_Manuel_Valdes_Larranaga:0 "Manuel Valdés Larrañaga"
 SPS_Manuel_Valdes_Larranaga_eco_desc:0 "§YCoordinator of the Economic Commissions\nCorporate Statism§!\n--------------\n§LNumbering among the Falange's founders and gunmen during the Second Republic, Manuel Valdés Larrañaga knows collaboration is not a dirty word. From the first instance, he knew that the vision of a unitary Spain lay in synthesis, not the doomed agitation of intransigents. While disloyal Falangists were eased out, the oldshirt does not feel marginalized to have been made an ambassador duty in 1950, but rewarded for his loyalty to Franco.\n\nIt is for that loyal service record that Valdés has been made minister of economy. In 1941, he was called upon to tame the corporatist Sindicato Vertical, bringing them closer to the conservative-religious consensus. Therefore, having weighed what Falangists they could abide in government, the army called upon the stout collaborator to yet again discipline the slavish Germanophilia and revolutionary national syndicalism swirling in fascist trade unionism.§!"

 SPS_Alfonso_Perez:0 "Alfonso Pérez-Viñeta"
 SPS_Alfonso_Perez_sec_desc:0 "§YSecretary of War\nFascism§!\n--------------\n§LPeace has been taken from Spain, from Lieutenant General Alfonso Pérez-Viñeta. First fighting in the First Spanish Civil War as a battalion commander, he sits among his colleagues in the army's high command, sharing their trajectory, sharing their view of the fiery remains of their nation, sharing in their fury. In that, he is García Rebull's man, following him into reactionary politics and a subordination of Falangist interests to the army's.\n\nCarrying the cross of Primo de Rivera's crusade, Pérez has sworn to be remembered as the bane of all who would render Spain. As Minister of the Army, he has taken an absolutist approach, dedicating every resource he can get toward crushing the rebellions. Hungry for peace, the junta has unleashed his burning zeal upon Spain, so that the movement might impress, requisition, and divert from budget and civilian alike. War is here, with all it brings.§!"

 SPS_Agustin_Aznar:0 "Agustín Aznar"
 SPS_Luis_Torres:0 "Luis Torres Rojas"
 SPS_Angel_Ramirez_Cartagena:0 "Ángel Ramírez de Cartagena y Marcaida"
 SPS_Jaime_Milans:0 "Jaime Milans del Bosch"
 SPS_Jaime_Bofill:0 "Jaime Bofill-Gasset y Amil"
 SPS_Juan_Atares:0 "Juan Atarés Peña"
 SPS_Camilo_Menendez:0 "Camilo Menéndez Vives"

 #Leader descs
 POLITICS_CARLOS_INIESTA_CANO_DESC:0 "Carlos Iniesta Cano is at the heart of the Nationalist cause, having served in the famed "Black Hand" 13th Division during the Civil War, resulting in his promotion and eventual government positions. The national catastrophe diminished his faith in the Francoist government. As such, he was among the first army officers contacted by Falangist oldshirts. Spear-headed by the army, the Nationalist coalition is reborn. Having convinced the Francoists to flee to Valladolid, the conspiracy relieved them of their duties and established a junta, investing Iniesta as the new Caudillo.\n\nThe marriage, however, is not happy. The tripartite factions have become well-acquainted and well-frustrated with each other after decades of fraught collaboration; the Falangists are now established and insistent, and the Carlists independent agents, determined to never be sidelined again.\n\nThe army, meanwhile, marches as one. The virile combatants of the Spanish Civil War have taken up the helm from their aged commanders. And, unlike the confused and uncertain early days of the last uprising, General Iniesta Cano leads a force bound by common cause, to preserve the legacy of July 18th. The glorious Spain which won the first civil war was eroded, polluted by the petty politicians and class strife it had risen against to begin with. No matter. With the destruction of the secessionist Catalan, Basque, and Galician states and the so-called Third Republic, that Spain will rise once more."

 #War Tree
 SPS_the_burning_peninsula:0 "The Burning Peninsula"
 SPS_the_burning_peninsula_desc:0 "Our Spain burns in the fires of civil conflict, brother seeking to tear apart his brother as the malign tendrils of treachery infect the very lifeblood of our nation. How many towns have been leveled so far? How many patriots murdered in their beds?\n\nNo more.\n\nSpain's salvation has come, peace will soon be at hand. Across the nation the call shall go out that, finally, Spain's most loyal children no longer fear themselves. But soon, Spain's enemies will learn to fear them, for every traitor deserves the terror of justice."
 SPS_the_burning_peninsula_tt:0 "§OEspaña, una, grande y libre.§!"

 SPS_the_end_of_weakness:0 "The End of Weakness"
 SPS_the_end_of_weakness_desc:0 "How did we get here? How was Spain allowed to fall to such horror and despair? The legacy is written in blood, and we can read it well. Did we assert ourselves after saving the nation in the 30s? Did we confront the challenges of the post-war world proudly, as men of Spain ought to? No, we cowered. We begged the Portuguese to justify us, cared more about making councils and committees for old men to argue than doing what was necessary. Spain failed because her people were led by the weak.\n\nBut Spain need not fear, for her surgeons see her malady. Spain shall not be prostrated upon the tides of history, helpless against enemies exterior and interior. No more will she beg and weep for proper governance. There will be no more compromise. No more bickering.\n\nNo more weakness."

 SPS_the_restoration_of_falangism:0 "The Restoration of La Patria"
 SPS_the_restoration_of_falangism_desc:0 "Iberia, of what use was such a union to Spain? Rather than uniting the peninsula under strong Spanish rule, Franco simply made new factions of government to frustrate the proper administration of our proud nation. Portugal's weaker revenues, frustrating policies, endless commitments; who could possibly defend such an arrangement with a nation so paralysed by itself?\n\nThe notion of Iberia is abolished; it never existed to begin with. This artificial creation to enrich the corrupt heart of Spain will finally be brought into proper light, and the People will reject the madness that it evidently was. Spain has found her heart again, reclaimed it from her abusers, and with this new heart a proud, independent Spain shall once more be heard."

 SPS_the_beginning_of_a_new_iberia:0 "La Reconquista Comienza"
 SPS_the_beginning_of_a_new_iberia_desc:0 "War required energy. There is nothing in this world that is not becoming something new, and war represents the primary proof of that. A new Spain is needed, one molded by the horror of our current peninsula to become all the stronger, to never forget the orgy of chaos by which we find ourselves beset by. Our children must never again experience such terror, all must be safeguarded from such a cruel fate as that which has been dealt to us.\n\nThe War must become a core foundational myth for ourselves, etched into the consciousness of all those who love Spain. This War must not become an uncomfortable memory to be sidelined, as too many did for the last one. The steel, the blood and the screams must never be washed from our hearts as we move into the future. Our future is united, our fate is unified, and only by strength can we avoid shared terror."

 SPS_in_the_souls_of_the_people:0 "Beneath the Mantle"
 SPS_in_the_souls_of_the_people_desc:0 "While much of the former Iberian Armed Forces has answered our call to defend our homeland, the morale and skill of our brave boys at the front is not enough if we want to reign over Spain when the war is over. The army is always hungry for new equipment and new men in order to expand, and, unfortunately, replace those who gave their lives for the cause.\n\nIn order to sustain the war effort, we absolutely must keep the home front on our side, or at least make sure that enough of the civilian population acquiesces to our rule. The people will see that we care for them, beyond the empty slogans of liberals and communists, and in turn, they will reward us with their support and their service.\n\nSpare no expense when it comes to the battlefront, making sure that our enemies stand no chance against us. Only a swift and decisive victory will allow us to continue building a strong Spain."

 SPS_and_on_the_battlefields:0 "And On the Battlefields"
 SPS_and_on_the_battlefields_desc:0 "While the home front is vital, the war will be won or lost on the frontline. We have under our control a large part of the former Federal Armed Forces, and with continued investment and support, we will cement our place as the strongest and most experienced military power on the peninsula.\n\nHowever, as strong as we are, we must also be quick. Spain will be reforged in the fires of war, but we must not let those flames burn it for too long. A drawn-out campaign will leave the country devastated and our legitimacy contested. Spain must be able to stand on its own two feet and look forward to a unified destiny as soon as possible, and for that to happen, we must pursue a quick and decisive victory.\n\nThe "silent majority" that live in our territory does not pose a threat to our government but they certainly aren't enthusiastic about the war. We have to invest in convincing these people so that they will fully participate in the war effort."

 SPS_convincing_the_unconvinced:0 "Convincing the Unconvinced"
 SPS_convincing_the_unconvinced_desc:0 "While plutocratic liberals and godless communists threaten us on the front and attempt to spread their venom from within, our greatest enemy is apathy. Most people who live in the territories we control do not pose a threat to our government, but they will not take up arms for our cause, either. That must change.\n\nWe will coordinate a campaign of propaganda and social policies targeted directly at this "silent majority." If we are to win this war, it is not enough that they don't stand against us - we must convince them that we are the only hope for a strong, prosperous, and free Spain, and that this hope is bright enough for them to fully participate in making it into a reality.\n\nUse any possible avenue to spread propaganda. Presses from banned newspapers will be given to friendly publications. Radios will be forced to increase the amount of "patriotic programming". TV schedules will focus solely on our victories and what we will do once the war is over."
 
 SPS_spreading_the_good_word:0 "Spreading the Good Word"
 SPS_spreading_the_good_word_desc:0 "In order to mobilize as much of our population as possible and make them willing participants in our great work, we must reach them. We will direct our propagandists to make sure that our message reaches every crowded apartment and every peasant household, and make use of all available means to help them in this endeavor.\n\nPrinting presses confiscated from traitorous newspapers will be given to more friendly publications. Radios will be directed to give more airtime to specially written, patriotic programming. Televisions will only show the people our great victories and the great future awaiting Spain once we have vanquished the Reds and the secessionists. Whatever it takes, the people will know who they should side with.\n\nCreate a temporary organization to aid police forces to root out possible dissidents and keep an eye over the population to make sure they work towards our victory."

 SPS_agencia_por_la_limpieza_social:0 "Agencia Por La Limpieza Social"
 SPS_agencia_por_la_limpieza_social_desc:0 "While our propaganda department works night and day to bring our message and convince the people of our just cause, there must also be a stick to accompany the carrot. Dissidents and enemy agents still infest our territories, undermining our work among the civilian populace and weakening the morale of our boys on the front, and a strong hand is required to make sure they are rooted out as efficiently as possible.\n\nTo that end, we will set up the Agency for Social Purity - a temporary, wartime organization whose stated objective will be to aid our police forces in their hunt for traitorous and enemy elements in our rear. They will be granted significant powers of oversight over the population, punishing displays of unpatriotic behavior and making sure that all Spaniards contribute to our final victory."

 SPS_elevating_the_cause:0 "Elevating the Cause"
 SPS_elevating_the_cause_desc:0 "This is not a petty conflict over simply earthly affairs, the very soul of Spain is at stake! With such dire stakes, it only makes sense that we must turn to those most learned in salvation to guide our people. We must turn to the Church.\n\nThe clergy shall become partners in our ministry, placing the true faith into its proper position in this war. From every pulpit, sermons shall condemn the degeneracy of the South. Every missal will ensure the People's proper commitment both to God and the State that supports him. From dusk till dawn we shall word for God, ever will we fight for him, and the Church will ensure all Spain knows it. Should any priests or Church organizations dissent from this undoubtedly holy duty?\n\nTreason remains an earthly affair."

 SPS_the_foundations_of_a_state:0 "Cogs of a Machine"
 SPS_the_foundations_of_a_state_desc:0 "While much focus is placed on the mind of a state, all too often its limbs rot forgotten beneath the weight. An effective civil service is essential to the efficient governance required to win this war, and yet so much of our apparatus fled south to indulge in their treachery. Such a state of affairs will not do.\n\nLarge recruitment drives shall be carried out, our net cast wide in order to find candidates of proper commitment, ability and morality to be the arms of the new Spanish State. With such a renaissance of morality in our administration, only the virtuous ideas of ours will permeate the apparatus. A golden age lies waiting."

 SPS_with_allies_amidst_the_union:0 "With Allies Amidst the Union"
 SPS_with_allies_amidst_the_union_desc:0 "Spain is cracked apart, that is a state of affairs few need reminding. However, not all cracks are immediately visible. There remain many power brokers yet uncommitted, factions that view the Republic with disdain but are yet to be entirely convinced of our efficacy. While such hesitation is frustrating, it is an obstacle that can certainly be overcome.\n\nDirectives shall be implemented with the intentions of improving our image. Public, selective displays of mercy. Operations to gain control of their influence networks. Outreach to their most agreeable figures. They shall come to love us, and with that love aid us in crushing the Republic before it can corrupt more of our precious nation."

 SPS_with_traitors_surrounding_us:0 "With Traitors Surrounding Us"
 SPS_with_traitors_surrounding_us_desc:0 "We are not inhuman. It pains us to see the corruption infesting so many of our citizenry, however like an infected arm we would be unwise to allow sentimentality to permit further spread of the sepsis. From farm to street, traitors must be found and rooted out. Any official, politician or officer who has not demonstrated themselves as singularly loyal to great Spain must be removed. Public safety operations and propaganda will be stepped up, encouraging new waves of reports and arrests of any likely spies or infiltrators.\n\nOnly a clean Spain can win this fight. A Spain clean of the infestations of liberalism and socialism. A Spain pure in the hands of true believers."

 SPS_the_militias_take_hold:0 "Una Nación de Héroes"
 SPS_the_militias_take_hold_desc:0 "Spanish men at arms form a key part of the national pacification, true patriots rising to fight corruption where they see it without waiting for the rigidity of military organisation to direct them. Such enthusiasm should inspire us all, and in the early days of our conflict surely made a difference. However, to win the war rather than merely survive our first days, greater coordination must be achieved.\n\nRather than integrate militias directly and entrap ourselves within an organisational quagmire, we shall form a special place in our structure for such militias. While our core military shall meet the brunt of our enemy, the militia's both in our territory and the enemy's shall prepare the way. From policing to raiding, pressure shall be taken from our professional forces, freeing up crucial manpower and resources while ever sapping theirs, allowing our military to lead us to victory."

 SPS_a_page_from_the_civil_war:0 "A Page from the Civil War"
 SPS_a_page_from_the_civil_war_desc:0 "During the First Civil War, militias ran free across the countryside. They were used en masse, fielded in large numbers, and died en masse as they were thrown into frontline combat. Wise men that we undoubtedly are, we have learned from those days. The General Staff has conceived of a new way to use the militiamen.\n\nBecause most trained soldiers are required for frontline work, the militiamen should be used in place of them. Their new duties will include acting as garrisons, infiltrating enemy lines and doing damage, and scouting work. These jobs are more suited to irregular forces, as our commando program remains tiny and we have no other dedicated garrison troops or scouts."

 SPS_a_cohesive_fighting_force:0 "A Cohesive Fighting Force"
 SPS_a_cohesive_fighting_force_desc:0 "The militias, while useful initially, have become a liability. They are too undisciplined to be properly controlled, and the moment when the decision was made to allow them to act independently, while useful for the circumstances it was originally conceived in, has passed.\n\n Our militias will be disbanded and heavy weapons returned to government control. To ensure a secure transition, officers in the militia who also had ranks in the Iberian Union military will receive that same rank in our new army."

 SPS_maintaining_the_frontline:0 "Piedra, Cal Y Sangre"
 SPS_maintaining_the_frontline_desc:0 "As in all civil wars, ours has produced utter chaos. With the outbreak of open armed conflict, we were at least able to tell who our enemies are - those being the men wearing uniforms unlike our own. With that open armed conflict, however, there has come a new kind of chaos.\n\nStrategic planning in our nascent state is constantly a challenge, due to the fluid nature of the lines, but it is crucial we maintain order and keep our frontlines fully-manned, for even a minute gap in the lines could be exploited by the enemy."

 SPS_a_spanish_war_economy:0 "Turn the Heat Up"
 SPS_a_spanish_war_economy_desc:0 "In these times, even the most optimistic of military planners recognizes that we need equipment. Speaking broadly, there are two sources for that equipment: domestic production and foreign shipments. The latter can be held up in blockade, stymied by embargo, etc. The former operates under no such restrictions, and at this juncture, quantity is more important than quality when it comes to military materiel.\n\nIt is for this reason that it is necessary to divert a large portion of the industry to produce weapons, trucks, planes, and all the necessary bits and bobs we need to save Spain from those who would besmirch her. If that means taking resources from civilian production to prioritize military industry, so be it; after all, we cannot stop the enemy's advances through hope and happy populations."

 SPS_making_use_of_international_aid:0 "Alms for Our Crusade"
 SPS_making_use_of_international_aid_desc:0 "As the true leaders of Spain, we enjoy a wide variety of foreign networks ranging from supporting nations to sensible organizations. As heirs to the Union, our military and economy require all they can get, especially to outpace the usurpers. The eyes of the world have turned to our suffering homeland. It is essential that those eyes see the necessity of aiding our cause.\n\nFrom overseas, crucial armaments and resources untouched by the chaos of our collapse can be sourced. Our soldiers will have access to high quality weapons with which to retake our homes. Our economy will have access to the resources required to supply the reclamation. The voice of Spain has called out, its harvest will help us march into the day."

 SPS_mobilize_the_industries:0 "Mobilize the Industries"
 SPS_mobilize_the_industries_desc:0 "The core of a nation is their industry, the lifeblood of its people, and with the core of Spain divided so too is that lifeblood. Across the nation, usurpers and traitors have overtaken cities and towns where once the heart of our industry pumped. Spanish factories produce arms to fight Spanish patriots, from the large factories of the Republic to the small workshops of local terrorists.\n\nBut, all is far from lost. We were able to protect much of our industry during the collapse and it now stands ready to fuel the national pacification. In our secured territory rests the potential of numerous industrial complexes and small manufacturers waiting to be seized. Through legislation reorganizing the factories, through money to fund their owners and through campaigns to inspire their workers, every bit of manufacturing power we have will have one guiding purpose; liberation."
 SPS_mobilize_the_industries_tt:0 "We will §Ggain§! 2 £tt_prod_unit production units."

 SPS_the_question_of_logistics:0 "The Question of Logistics"
 SPS_the_question_of_logistics_desc:0 "Our nation is no doubt one of diverse challenges, and the chaos of civil strife merely accentuates this, especially when trying to consider how to keep the pacification efforts coordinated and supplied. The huge variety of terrains, levels of development, regional economies, local political leanings, resistance movements, militias, our own military - the list of complications imposes upon even the most determined planner. It's enough to make heads spin, and yet it is essential that we master them.\n\nSupply routes nationally will be considered and laid out. All maps and intelligence we can get our hands on will be employed to create our networks, both for our territory and territory soon to be taken, so our soldiers will always know where their next meal and bullet can be found. The Homefront will be rationed and controlled if necessary; everything needed for the front shall make it there."

 SPS_the_old_guard_rises_strong:0 "The Old Guard Rises Strong"
 SPS_the_old_guard_rises_strong_desc:0 "In recent years, the Union has regrettably shut down many men due to the vigor of their convictions. Particularly, the 'Blue' faction of the military and their loyalty to the ideals of the Falange earned them shunning from officers outside of their cliques. Iberia saw them as liabilities. However, now Spain needs men of such proud patriotism.\n\nThe Blue faction fully controls our military and will actively shape it around the ideals of fraternity and national freedom, to ensure the men who protect Spain carry its greatest beliefs with them wherever they go. Unified around a clear cause and common methodology, we shall avoid replicating the disjointed chaos of the other factions."

 SPS_pulling_from_the_unions_ranks:0 "Pulling from the Union's Ranks"
 SPS_pulling_from_the_unions_ranks_desc:0 "Not all of those who served Iberia have reenlisted with our forces. Many of these revealed themselves as traitors, fleeing to join the Republic. However, some have remained in our territory, refusing to betray us but evidently hesitant to join us as well. Further, many in government share those sentiments, looking upon these idle soldiers with distrust due to their questionable loyalty.\n\nDespite the conflicts, now is the time for solidarity; we need men, skilled men. All can agree that the Republic risks the soul of Spain itself, and these men will be encouraged to reenlist upon that premise. They have demonstrated their loyalty to the nation and will surely fight with all their hearts for it. Should anyone's loyalty to the State flounder, then such individuals can easily be removed."

 SPS_a_pure_movement:0 "A Pure Movement"
 SPS_a_pure_movement_desc:0 "We may commiserate with any soldier willing to shed their blood for our movement of restoring Spain, especially in such a perilous time. Then again, the spirit of the fighting bull can be harmed not just by obvious predators, but parasites that are just as mortally wounding. Officers in our enlistment could have their spirits falter by mere cowardice in times of need, and their tardiness to defend our territories would be more damning than a mere loss in a battle.\n\nThe remnants of our armed forces, no matter the size, must maintain its purity. Only known members of patriotic groups, such as the Falange or CT, may ever be promoted to higher command. Foot soldiers with no such hope for promotion can merely show no sign of perfidious behavior, as that is the most they can do."

 SPS_a_competent_high_command:0 "Succession by the Sword"
 SPS_a_competent_high_command_desc:0 "Withstanding enemy forces bound to wreck our crumbling pillars of a new Spain may not be a pie-in-the-sky situation, but only with the rectification of the mode of command can this be achieved. Men may bicker and vacillate over whether High Command can put the spirit of Falange on a high pedestal, when the time wasted on diatribes could have helped turn the tide of the civil strife around, and the question of our ideology can be discussed in a more ideal time.\n\nOfficers who could demonstrate a dexterous level of command may find their chances of promotion improved, as even loyalists may not render their overzealous actions as officious. With our best leading our troops to succeed in their objectives, a blind eye can be turned on High Command for now."

 SPS_a_defensive_doctrine:0 "Bleed the Red Spring"
 SPS_a_defensive_doctrine_desc:0 "The fighting spirit of the fine soldiers and loyal militia forms the greatest backbone of our military campaign, and it is crucial that we do not let it go to waste in a series of unnecessary and costly assaults. While we may not be able to overwhelm the rebels for now, we can still make use of the many opportunities that arise on the battlefield. Minimizing offensive operations and focusing on exploiting enemy mistakes can ensure that the fighting valor of the fine Iberian man will no longer be bled dry in quixotic assaults on fortified positions, securing a strong basis for decisive battles to follow.\n\nArmy officers must realize that prudence is not cowardice, and withholding forces in anticipation of future opportunities does not equal reticence. We shall instill a defensive doctrine that will punish the rebels' every mistake while minimizing our own losses."

 SPS_grinding_at_the_union:0 "A Duel with Cudgels"
 SPS_grinding_at_the_union_desc:0 "Favorable outcomes of the past campaign cycle meant that our forces now outnumber the rebels, and now it is time to exploit our advantage. We must not allow the enemy an opportunity to recuperate and reorganize their forces. Instead, our commanders will aggressively assault the enemy, making every passing day as costly as possible for the rebel war effort. This will help us maintain our numerical superiority while bleeding the rebels dry, to the point that they are powerless to stop our next offensive.\n\nWar is bloody business, and no battles are won without making heroic sacrifices in epic proportions. The attacks may not yield significant results and frontlines may stagnate, but ideology and zealotry will fortify our men and enable them to reach the final breakthrough. Our brave and loyal martyrs will sacrifice themselves and, in doing so, secure the final victory for our beloved Iberian state.\n\nArmy officers must be instructed to order assaults on enemy positions whenever troop morale and equipment stockpiles allow for such actions, provided that there exists a significant numerical superiority. Even when the frontline stagnates, repeated assaults will still be effective in depleting enemy stockpile, paving the road for easier victories in the future."

 SPS_breaking_the_stalemates:0 "Torrent of Iron"
 SPS_breaking_the_stalemates_desc:0 "The rebel army is on the verge of rout, and all it takes is one last decisive operation to break its back. We must reinforce key battlefields where our troops have reached an impasse and use the fresh manpower to break through enemy lines. Exploiting our numerical advantage, we will embark on several such operations at once. The enemy will be powerless to stop us as we achieve the long-awaited breakthrough and allow our forces to advance quickly, bringing a decisive end to this drawn-out war.\n\nThese assaults will be pivotal for the future of Iberia. If we fail to achieve a breakthrough, all the accumulation and strategizing we conducted will be for nought. The choice lies with us – to seize the victory with a decisive breakthrough, or to let the conflict stagnate into a pointless bloodbath. The following days will decide it all."

 SPS_striking_down_from_the_skies:0 "The Wrath of Our Archangels"
 SPS_striking_down_from_the_skies_desc:0 "If the rebels still cannot accept their fate, then let us rain hellfire from above. Our fighters will pave the way to secure control over the air, following which we shall ensure that every facet of their illegitimate regime is faced with the stark reality of the war. Our bombers shall strike not just their forces at the front, but also their important economic centers supplying guns and resources for their desperate last attempt to maintain a facade of resistance at the fronts. As the supply of guns and rations to the frontlines ceases, how long will rebel grit last?"

 SPS_por_la_patria_el_pan_y_la_justicia:0 "Por La Patria, El Pan Y La Justicia"
 SPS_por_la_patria_el_pan_y_la_justicia_desc:0 "From brimstone and gunsmoke rose the Spanish State as it defeated its corrupt predecessor, and from hellfire and ruins arises the Spanish State once more as it completes a National Revival to secure Spanish sovereignty in the Iberian Peninsula. Victory is within our grasp, and we shall grasp it with both hands as we establish a strong and free Iberia liberated from the malignant influence of corrupt foreign powers.\n\nThe rebels who denounce us seek only to return Spain to its weak and subjugated state prior to the Second World War. Their plan must not be allowed to reach fruition. In the vision of Caudillo Franco, we shall restore Spain to its prominent position on the global stage as a strong, prosperous, and, most importantly, independent power. None must be allowed to stand in our path. For Fatherland and Justice!"
 
