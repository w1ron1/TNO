 ## Leader Desc ##
 #################
 POLITICS_KAULZA_DE_ARRIAGA_DESC:0 "Once just the son of a sculptor and a family of goldsmiths to a young engineering student and later a soldier in the Portuguese Army, Kaúlza de Arriaga makes his debut as the face of the Portuguese overseas empire. Having served a long career in the Portuguese Army, Arriaga never faltered in his loyalty to Salazar, continuing his service into the Iberian Union and climbing the ranks, becoming one of the most fervent pushers for reforms and modernisations within the Armed Forces.\n\nHowever, Arriaga's political ambitions have manifested themselves with his desires to achieve his goals. Carrying out the coup with the support of the Portuguese military officers and the monarchists and old guard of the Estado Novo, Arriaga presents himself as the reconciliatory figure Portugal so desperately needs in these times of disunity, rallying his cause as a defender of the Empire and making his desire to work with anyone willing to defend Portugal's sovereignty known.\n\nAnd yet, he finds himself surrounded by the democratic monarchists which he despises, with the King on a close collar to him."
 
