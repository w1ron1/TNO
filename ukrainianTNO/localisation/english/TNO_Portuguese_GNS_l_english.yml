 GNS_Kaulza_Arriaga:0 "Kaúlza de Arriaga"

 GNS_Joao_Bruno:0 "João de Almeida Bruno"

 GNS_Guilherme_Calvao:0 "Guilherme Almor de Alpoim Calvão"
 GNS_Guilherme_Calvao_sec_desc:0 "§YMinister of Defense\nMilitary Junta§!\n--------------\n§LBesieged on all fronts is the Kingdom of Portugal - and the man behind the Kingdom's continued resistance in the face of this unfortunate turn of events is Guilherme Almor de Alpoim Calvão.\n\nA long time Marine and Special Forces officer with an extensive history combatting the PAIGC in Guinea, Calvão leverages his ties with the PIDE to cement his position within the Estado Novo and reform Portugal as Arriaga sees fit. Now the Defence Minister, Calvão is not afraid to crack a few eggs to make an omelette - something his predecessor, Santos Costa, failed at.\n\nA natural born leader, admired by the men he commands, Calvão is renowned for his recklessness, of which he has cheated the Reaper every time. Now, he leads Portugal into one last Wild Ride, and may his divine luck see to it that she returns victorious with all of Calvão's exploits.§!"

 GNS_Jaime_Neves:0 "Jaime Neves"
 GNS_Jaime_Neves_for_desc:0 "§YMinister of Foreign Affairs\nDespotism§!"

 GNS_Jose_Manuel_Bettencourt_Rodrigues:0 "José Manuel Bettencourt Rodrigues"
 GNS_Jose_Manuel_Bettencourt_Rodrigues_eco_desc:0 "§YMinister of Economy\nMilitary Junta§!\n--------------\n§LThe Army is known for making strong men of tough times, and José Manuel Bettencourt Rodrigues is no exception to this. Tracing his military roots back to his military preparatory studies in the University of Lisbon, Rodrigues demonstrated excellence at his military academy, placing first place and becoming a distinguished student among the General Staff class in the Iberian Army.\n\nHowever, Rodrigues's new line of service is no longer on either end of the rifle, but rather behind the desks and stacks of papers, as the Minister of Economy of the Kingdom of Portugal. There, may he serve the Empire faithfully with the pen rather than the sword - and faithfully has he sought to serve, redirecting and orienting the economy towards extensive support for the Armed Forces.\n\nWar has come to Portugal, and only one man can keep its people afloat among the flood.§!"

 GNS_Silvino_Marques:0 "Silvino Silvério Marques"

 GNS_Rafael_Durao:0 "Rafael Ferreira Durão"

 GNS_Armando_Roboredo:0 "Armando Júlio de Roboredo e Silva"

 GNS_Antonio_Goncalves_Rapazote:0 "António Gonçalves Rapazote"
 GNS_Antonio_Goncalves_Rapazote_hog_desc:0 "§YMinister of the Presidency\nAristocratic Conservatism§!\n--------------\n§LOnce an Integralist in the 30s, the turbulence that shook the destiny of Spain - and with the formation of Iberia, Portugal too - came as a rude awakening to Rapazote's view of the world. A close ally of Arriaga, Rapazote came from a position in the background - working in the periphery rather as the face of anything, Arriaga later appointed Rapazote to the position of Minister of the Presidency, superseding the Ministry of the Interior. For the majority of his career, Rapazote has been the one to Arriaga's hands clean, carrying out the anti-dissident activities being the one to call the shots on arrests and sentences - though it is at the very least an open secret who gives Rapazote the orders to execute.\n\nThough, in the midst of the chaos which now unfolds across all of Iberia, Rapazote's purpose in the Kingdom of Portugal becomes clearer with every passing day - and even when the Kingdom triumphs his service will continue.§!"

 GNS_Joao_Costa_Leite_for_desc:0 "§YMinister of Foreign Affairs\nAristocratic Conservatism§!\n--------------\n§LJoão Pinto da Costa Leite was once a man who looked the future in the eyes as a crusader for the Monarchist faction of the Estado Novo.\n\nToday, however, he can only be described as but a shell of his former glory. Having once boasted a significant presence within the upper echelons of the Estado Novo as a champion of monarchism, Arriaga's reduction of the King's powers spelt the end of Leite's political career within the ranks of the Kingdom's leadership - or so it was thought.\n\nLeite continues his fight as a devout monarchist, though at a greater distance than previously and in a new post as the Foreign Minister. He makes his call, depoliticising the monarchy and severing its association from Arriaga, aware that Arriaga has made no commitment to maintaining the monarchy long term.§!"
 
