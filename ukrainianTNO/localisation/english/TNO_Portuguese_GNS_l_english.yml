 #National Spirits 
 GNS_restrained_king:0 "A Restrained King"
 GNS_restrained_king_desc:0 "General Arriaga's choice to allow King Jaime to remain on the throne of Portugal was a calculated one. Indeed, if Arriaga's government was to overcome the ravages of war and restore Portugal's sovereignty, neither the democratic monarchists nor Jaime could be allowed to stand in the way. At the same time, however, Jaime had never possessed much in the way of political ambition, and always let the Kingdom's cabinet operate without much interference prior to Arriaga's coup. The monarchy also still had its uses, insofar as it helped mobilize the public in support of the National Salvation Government's war effort and lent the GNS legitimacy. Therefore, it made sense to keep Jaime around, as long as he was kept under strict surveillance and military escort at all times in the unfortunate event that some disgruntled elements attempted to instrumentalize the King in a counter-coup."
 GNS_state_limbo:0 "A State in Limbo"
 GNS_state_limbo_desc:0 "The Governo de Salvação Nacional is intrinsically a war-time government. While the state apparatus still nominally exists, Arriaga's determination to win the war has led to the complete freeze of most non-crucial governmental institutions. As time goes by, the state's ability to rule over the territory it holds becomes ever more eroded. If civilian functions are not swiftly restored, the entire structure could collapse under its own weight, and Arriaga's efforts will have all been for nothing."
 
 GNS_all_for_empire:0 "All for the Empire"
 GNS_all_for_empire_desc:0 "For all his magnanomy, General Kaúlza is a simple man with an even simpler goal: the national regeneration of the Portuguese state and her colonial possessions. The Iberian Collapse may have dealt a great deal of damage to Portugal's military capability, but her ambitions remain very much intact. From the Azores and Madeira to São Tomé and beyond, Lisbon has no intention of abdicating her sovereignty over the South Atlantic and the Gulf of Guinea in the wake of her temporary weakness.\n\nKaúlza is as much a man of the nation as he is the empire, thus he means to see them both restored."

