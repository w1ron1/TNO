 ############
 ## Events ##
 ############
 
 GNS_wars.1.t:0 "Smoke and Fire"
 GNS_wars.1.d:0 "The soldiers could smell the stench of burning paper as soon as they climbed the stairs. Rifles drummed against their uniforms as they approached its source. Bringing an entire squad for a raid like this was an overreaction — Sergeant Justino knew that much. Still, they were dealing with PIDE remnants, and who knew if they had some weapons stashed.\n\nWith one swift kick, the door came swinging open — the cracking wood making one Private throw down his battering ram as soldiers flooded the room. Inside, a group of employees stood around a bin overstuffed with smoldering documents. Their shirts were unbuttoned to bear the heat, making the sweat-soaked faces appear all the more pathetic.\n\n"Drop everything!" Justino barked as the others leveled their rifles at the group. Some froze; others clasped their hands together and wept. There was one, however, who chose to fight. Kicking the burning bin, scraps of paper and grey ash floated in the air — the setting sun shining through the windows accentuating the thick crimson air. Then, he ran.\n\nJustino gave chase, hearing the tactile thud of rifle butts against skulls which assured him his men had the rest covered. There was no forethought in the escapee's movements. The only reason he went down rather than up the stairs was because he didn't want to climb; his aching muscles wouldn't permit it. The man burst through a side door into a cluttered office, gripping the smooth wooden desk with his wet palms. His body pulsated with adrenaline — the cruel chemical telling him that something was wrong while offering no solution as warm spit built up in his mouth."
 GNS_wars.1.a:0 "Outside, there came the slow, deliberate pounding of the Sergeant's boots."

 GNS_wars.2.t:0 "Making Amends"
 GNS_wars.2.d:0 "The rhythmic clicking of jackboots echoed through the narrow concrete corridors of the Forte de Monsanto jail in Lisbon, heralding the arrival of a military officer holding a clipboard. The square-jawed man came to a stop in front of a small, dark cell and squinted through the bars to see three disheveled men looking at him with varying degrees of interest.\n\n"António Pereira Costa, João Borges Almeida, and Pedro Silva Melo?"\n\nOne of the men, an unkempt and grimy character, smirked and nodded. He was lying on the cell's only bed, ignoring his two cellmates. The pair were sitting on the floor, awkwardly glancing at each other before one of them stood up. "Listen sir, we think there's been a mistake, we shouldn-"\n\nThe officer held a hand up to silence them and confirmed them on his clipboard, before opening a folder and handing each of them a piece of paper. "My friends, it is too bad that you are wasting your days in here. I have a proposition for you."\n\nIt was an official-looking form, outlining how their sentences could be reduced for every day served in new rectification battalions. The unkempt prisoner quickly put the paper aside, his eyes bitter. "Rectification Battalions? You want us in the Penal Brigades?" Meanwhile, his cellmates read furiously, speaking in hushed tones.\n\n"We saw the charges against all of you, but we are still offering you an opportunity. If you sign, prove your worth to Portugal and keep your head down, you can return home as heroes. Heroes don't have criminal records. ""
 GNS_wars.2.a:0 "One by one, for their own reasons, the three inmates signed their names"

 GNS_wars.3.t:0 "Brought to Light"
 GNS_wars.3.d:0 "Kazula noted the small, dusty military base had attempted to be as orderly as possible for the ceremony as the driver brought him and the King into the encampment. Cars were clumsily repainted, weeds poorly pruned and unwashed uniforms shoddily ironed. Kaúlza scowled. The army was in dire straits; a paint job was not going to change that.\n\nAfter halting, the King and Kaúlza stepped out of their car to the blaring of trumpets. A small band stood to the side playing a lively march while soldiers stood in a stiff line of dress uniforms lining the path to a small adorned podium. The King and Kaúlza began walking towards the distant base's commander upon it.\n\nAnxious soldiers. They clutched rifles with sweaty hands while doing everything in their power to face forward unseeing - except a young soldier, standing firmly and, for a moment, meeting Kaúlza's eyes with a unique spark.\n\nKaúlza stopped before the man, the King stumbling to match him. This one was different; the spark dimmed as soon as it was noticed, but it had been there. He examined the soldier. Well maintained rifle, uniform better kept. Even polished buttons. "Is there something wrong, soldier?"\n\nThe soldier responded, almost mechanically. "No, sir. Nothing at all." Was there a hint of disdain in the voice? Caution? Simply discipline?\n\n"Do you love the Kingdom? Are you satisfied with it?" Kazula spoke lightly but suspicion leaked. What was this soldier thinking to make him so distinct?\n\nThe soldier shook his head. He was distantly aware of the King quietly encouraging him away, but Kaúlza's scowl only deepened."
 GNS_wars.3.a:0 ""I'll be keeping an eye on you.""

 GNS_wars.4.t:0 "Rehabilitation"
 GNS_wars.4.d:0 "A small parade filed out of the doors of the Supreme Court of Justice and into the Praça do Comércio. At its center was a group of men, handcuffed and attempting to shield themselves from the sudden exposure to the sun and the stabbing eyes of the public, to varying degrees of success. They were surrounded by police officers, guiding them towards two black vans parked nearby and attempting to rebuff the continuous onslaught of questions, microphones and cameras from the gaggle of journalists who had waited before the Court's doors.\n\nWith some difficulty, the policemen managed to drag the convicts through the crowd and into the vans. After ignoring a final attempt at a question, the two vans drove off and left the disappointed journalists to disperse before the court's doors opened once more, revealing a young, bespectacled man.\n\n"Good afternoon, all. I represent the State Prosecution. Please direct all questions to me." He smiled like a cat, his eyes suggesting an alluring craftiness that captured the energy of the journalists.\n\n"Have these men been arrested because of their opposition to the Government's rearmament plans?"\n\n"Absolutely not. They've been convicted of abusing their rank in the Ministry of Finance to embezzle public funds and attempting to bribe the police upon discovery. Such corruption must be cleansed from Portugal without any connection to the government's policy preferences."\n\n"Senhor, what have these men been sentenced to?"\n\n"Two of them have accepted a life sentence, they are inside in holding cells...""
 GNS_wars.4.a:0 ""...The other five have agreed to serve in a rectification battalion; they're on their way now"."

 GNS_wars.5.t:0 "The Phantom of the Forest"
 GNS_wars.5.d:0 "Francisco Daniel Roxo trudged through the long grass, dew soaking his fatigues, before he and his men arrived at the clearing; the tall blades they had just traversed stopped before a small plain, separating the quaint farmland they had been marauding and terrorizing from the deep forest up ahead. His binoculars zeroed in on the rustling treeline ahead. Just like Guinea-Bissau; only this time it was for sport — not a government bounty. His quarry was an Iberian lynx, though it made little difference to him from the guerrillas he had poached in the swamps and slaughtered in the savanna.\n\nHe saw his men look at him doe-eyed. "The game here is mediocre compared to Africa, boys. I've shot bigger cats than the runts you'll find out here, so don't get your hopes up!" Unraveling the satchel tucked at his shoulder, Roxo grabbed his scoped Mauser and shot a quick glance through the lens. "Get kitted out! They're fierce when cornered and we're not dragging your sorry asses back to HQ with your arms and legs hanging off!"\n\nThey all laughed. He too, leaving his gun to reach for the cigarette in his breast pocket as his adjutant caught his attention, all tight in the face with a wrinkled brow. Roxo's stare compelled him to speak. "Comandante, shouldn't we be focusing on other affairs? All due respect, but we should be at HQ hunting army groups, not random cats."\n\nDanny Roxo's cigarette flew into the tall grass. "I call the shots in this sector, Lieutenant, and as for men with my experience," he paused to throw up his hands, "Portugal is in short supply. I'm not worrying. I'm king." The two swung their heads toward the treeline as the rustling grew more vigorous. Near serpent-like hissing set them on edge before their prey jumped out, wild-eyed and swift on the grass. He grabbed his gun again, all manic in the face, but paused a beat to give the adjutant a tight, arm-twisting grip on the shoulder. "Now let's run along and start fucking shooting!""
 GNS_wars.5.a:0 "The lynx met its end in a hail of bullets."

 GNS_wars.100.t:0 "A Front-Row Seat"
 GNS_wars.100.d:0 "General Kaúlza was walking in circles around the King's temporary office, hands behind his back, rattling off his planned campaign like bullets from a machine gun. "...and after cutting off the coast, the 3rd Division will march from Santiago de Compostela to La Coruña while the 7th proceeds from Ourense to Lugo to cover its eastern flank. We estimate to be in full control of Galicia in a matter of three to five weeks, and to be prepared for formal annexation within two months at the latest. Your Majesty."\n\nKing Jaime fidgeted with the papers the general had provided him regarding the planned takeover of Galicia, a headache blooming behind his temples. This could not have been a good idea. He had been shut out of any military decision-making for months now, but he was still king, was he not? "Are... are you sure this is a good idea, General Kaúlza? What if the campaign is delayed? The Spanish are also war-weary, but if this takes long enough for them to get dragged into this, we might find ourselves in a very difficult situation. Wouldn't it be better-"\n\n"It wouldn't." Kaúlza interrupted the king. "There is no point in trying to stop this campaign. The planning has concluded and the orders have already been given. We will go on the offensive in the coming days." He had stopped walking, eyes directly on the man who was supposedly Portugal's head of state, betraying a hint of anger before reasserting decorum.\n\n"I apologize, your Majesty. Protocol demands that I inform your Majesty of any strategic-level planning the military council has seen fit to authorize. It does not demand a separate authorization by royal assent. I suggest that your Majesty continue to delegate military decision-making to those who are competent to execute it.""
 GNS_wars.100.a:0 ""Good day, your Majesty.""

 GNS_wars.101.t:0 "A Backstage Backtrack"
 GNS_wars.101.d:0 "A small desk lantern was the only source of light in Kaúlza's office. It was well past midnight, but the General was nowhere near ready to retire to his quarters. The invasion of Galicia was almost ready to be launched, and it was his duty to make sure that it did without a hitch. Suppressing a yawn, he continued scanning the day's reports from his commanders on the ground and his intelligence briefings.\n\nIt did not look good. The main news of the day was an agreement being reached between Santiago de Compostela and Madrid for Galicia's reincorporation into Spain. This was a massive spanner in the works - an invasion of Spain was going to be a whole different beast than the takeover of Galicia - but it did not end there.\n\nReports from the frontline units were complaining about a lack of supply trucks, fuel, and even basic ammunition. If this was the situation now, before the attack was even underway, how could they keep supplying the troops all the way to the northern coast? How far, and how long, would the army have to march before Spain could be persuaded to give Galicia away? The reports provided no answers.\n\nKaúlza massaged his temples. He had crafted an immaculate operation. Galicia should have been - was going to be - restored to its rightful owners. But now, the plans simply did not add up in his head. The Spanish takeover on the one hand, and the Portuguese army's inability to prosecute a protracted campaign on the other, stood like two shadows behind his back. He wanted to crumple all the papers, call every officer on the ground, and tell them to launch the offensive right now, and that they'll get a bullet to the head if they dared to stop before reaching the sea.\n\nInstead, he opened his drawer, and with shaking hands, stamped all of the documents with an instruction to destroy any trace of them and of the operation that would never come to pass."
 GNS_wars.101.a:0 "The office went dark."

 GNS_wars.102.t:0 "Breaking Point"
 GNS_wars.102.d:0 "The small concrete bunker had sat unused ever since the last civil war, covered by the dirt and leaves of the sun-dappled grove which had grown around it since. Even now, with war once again engulfing Iberia, it was too far away from any meaningful action to be disturbed by anything except birds, rodents, and the occasional fox.\n\nAs such, it was the perfect spot for clandestine meetings like the one taking place in it now. Two armored cars had trudged off the road from different sides of the grove, and two men came off of them and made their way to the old bunker. They acknowledged each other, nodded, and together forced open the rusted hulk that might have once been a door. After making sure that no one was listening, the officer who had come from the north, a large, sweaty, balding man wearing a Spanish uniform, began talking.\n\n"Well, Senhor. It seems that this war of yours hasn't exactly gone according to plan, has it not?"\n\nHis counterpart, a younger, swarthy Portuguese officer with a small moustache, grunted uncommittedly. The Spanish officer seemed to take that as a confirmation. "All of your forces have been pushed out of Galicia, and we are now poised to strike directly into the Portuguese heartlands. But this doesn't have to happen."\n\nThe officer pulled out a file, stamped with the seal of the government in Madrid, and handed it to the Portuguese representative. "The Spanish government is more than willing to open diplomatic channels to end this war as soon as possible. Both sides will recognize the pre-war borders, relations will be normalized, and everything will be as it should be."\n\nSeeing the suspicious, slightly defiant look in the Portuguese officer's eyes, the Spaniard shrugged. "Or we could not do that. What do you say?""
 GNS_wars.102.a:0 ""You have yourselves a deal.""
 GNS_wars.102.b:0 ""Just you wait. Galicia will be ours.""

 #################
 ## Focus Trees ##
 #################
 
 #War Tree
 GNS_a_guerra_iberica:0 "A Guerra Ibérica"
 GNS_a_guerra_iberica_desc:0 "After decades of being forced to the sidelines by Iberian political wrangling, the armed forces of Portugal have taken up the mantle of reestablishing order through the institution of a military government. The King and his supporters have been contained, along with their lofty ambitions towards restoration (at least for now). It will not be the high ideals of the Monarchy that will save Portugal from the collapse, nor the low morals of the Salazarists. When the Carrot failed, the Stick will provide\n\n.General Kaúlza sits at the head of a military junta tasked with undoing the inefficiencies of the Estado Novo and restoring order to the nation. Without the Caudillo to constrain him or his troops, the Portuguese military is free to execute their campaign of toppling the rebel forces and enforcing security for the people of Portugal."

 GNS_o_exercito:0 "O Exército"
 GNS_o_exercito_desc:0 "It has been no secret that the Caudillo and the Estado Novo were rarely on the same page with the military, with Salazar focusing on developing his economic model at the expense of allowing the armed forces to flounder with slashed funding and irregular upkeep. Its expected for the finger to be pointed at the military leadership in response to failures on the battlefield, something the Estado Novo seems incapable of applying inwardly in taking responsibility for Its failings.\n\nIt falls on the shoulders of Gaulza's Junta to bring the armed forces up to par, a taxing task even in times of peace, nevermind while in the grips of Civil War. The army in particular has spent a generation rotated from one colonial garrison duty to the next, they will have to brace themselves for some of the heaviest fighting any military will ever have to face."

 GNS_hunt_down_the_pide_remnants:0 "A Clean Slate"
 GNS_hunt_down_the_pide_remnants_desc:0 "Nowhere does the dishonor of the Estado Novo's worst elements rear their ugly head than in the infesting presence of the Portuguese secret police. Despite the government's best efforts to stamp out the Caudillo's private button men, the cut-throats of PIDE continue to shuffle along like vampires, skulking amidst the rubble of the Iberian experiment.\n\nIf Portugal is ever to live past the legacy of Salazar, these boogeymen must be rooted out. Kaúlza has been working with his inner circle around the clock to respond to the threat posed by the PIDE, for there are only so many places they can hide before the men of the army come battering down their doors."

 GNS_a_bloody_massacre:0 "A Bloody Massacre"
 GNS_a_bloody_massacre_desc:0 "The fighting in Portugal has only intensified in recent months with no clear sign of letting up, enough for the physical toll of the combat on the ground is beginning to take Its toll. Row after row of body bags fill the lens of every press camera on either side of the battlelines, with every fighter lost only piling on more weight on the conscience of both the high command and the average soldier on the ground.\n\nThe true evil of a Civil War is that every soldier dead on the ground is a child of Portugal, even those on the other side of the line. This cruel reality is precisely what makes the enemy's cause so vile, which is exactly why our only recourse is to up the ante; No matter where we fight or if we even win, we must leave more of them slain than us. The price is high even if our cause is just, the end must be made to justify the means."

 GNS_a_loose_command_structure:0 "A Loose Command Structure"
 GNS_a_loose_command_structure_desc:0 "Part of what makes a Civil War so ugly is that the battlelines are seldom drawn for convenience, one need only look at our eastern neighbor in '36, or more recently in Germany, to see that the frontline shifts in manners most unpredictable. Attempting to maintain a centralized chain of command for troops on the ground can be tricky even in standard forms of warfare, yet the ephemeral nature of the front in Portugal means that a less rigid structure is of utmost necessity.\n\nPortuguese military leadership can sort out the restructuring of proper command channels along conventional lines once the state is consolidated. Until then, our field officers require the flexibility to perform their duties even if cut off from Command HQ. Granting the officers autonomy should give our units greater ability to prosecute the war, perhaps it is just what is needed to shift the momentum in our favor."

 GNS_a_clean_war:0 "A Clean War"
 GNS_a_clean_war_desc:0 "Ever since the First World War, more and more military powers have been abandoning any semblance of basic military decorum. From the Wehrmacht to Regio Esercito, to the IJA and even the US Army at times. Basic human decency and respect for international laws of war have been increasingly ignored in the processes of the Cold War, even Portugal and General Gaulza himself are very much aware that they themselves are not immune to such hypocrisy.\n\nYet with the fall of the Iberian Union and the Civil War, an opportunity presents itself for Gaulza's men to prove to the great powers that the conduct of a military doesn't need to be the sum of the world's political climate. We will not allow the harsh realities of modern war steal what remaining valor the Caudillos' rule didn't sap from our souls; Portugal's war will be fought and won with honor and dignity, not with ruthlessness or for revenge."

 GNS_a_tight_and_orderly_army:0 "A Tight and Orderly Army"
 GNS_a_tight_and_orderly_army_desc:0 "The whole of General Kaúlza's war for Portugal is reliant on his supporters within the military and the central command that leads it. Even as the frontlines move and shift in unpredictable ways, a concrete command structure between the soldier and commander is vital to keep the enemy off their backs.\n\nThe only way to properly ensure Kaúlza's victory is for the central command to take the situation in hand, preserving the command chain even as the fighting at the front intensifies. The Portuguese military in particular is forced to fight against their perceived inadequacy as a second or third rate fighting force, such that enforcing military hierarchy will aid them in reforging the military into a modern and professionalized fighting force."

 GNS_create_penal_battalions:0 "Create Penal Battalions"
 GNS_create_penal_battalions_desc:0 "Yet another evil of the Civil War is that in addition to our fellow countrymen being forced to kill their neighbors, it manifests a veritable flood of captured prisoners of war streaming into our military facilities. As much as we might hate and resent the enemy for their corruption of our people, it is too costly to allow Portuguese military prisons to overflow with P.O.Ws and prosecute the war at the same time.\n\nIn order to prevent a humanitarian crisis in the midst of a national one, Kaúlza and the High Command have signed off on the creation of penal battalions for those behind bars still capable of fighting. This might run the risk of spreading enemy propaganda to the GNS soldiers at the front, yet the tactical placement of these battalions at the vanguard opposite the enemy should, among other things, keep fraternization to a minimum."

 GNS_a_economia:0 "A Economia"
 GNS_a_economia_desc:0 "With the levers of power firmly in the hands of Kaúlza and his supporters, the question of remedying the ailing Portuguese economy now comes to the fore. Public animosity with the inefficiencies of Salazar's corporatist framework are well established, doubtlessly contributing to the social agitation that culminated in Iberia's collapse into Civil War.\n\nHow the Junta means to tackle the issue remains an open question; Some favor restructuring it along military lines to better propagate the war, while others entertain detente with free enterprise. Either plan has Its share of both support and detractors among Kaúlza's clique, as well as potential to reinvigorate the economy once the fighting in Iberia subsides."

 GNS_economics_for_an_army:0 "Economics for an Army"
 GNS_economics_for_an_army_desc:0 "Even if Portugal had not degenerated into Civil War, the failure of the Estado Novo and the Corporatist Model has been laid bare for all to see. But like everything else in what used to be Salazar's Portugal, the former Caudillo's mismanagement of economy has come back to haunt the army he used to command.\n\nJust as Salazar's aloofness of military affairs would lead to Kaúlza's Junta taking command, so too did the economic program the Caudillo initiated lead to logistical issues in every place touched by the Civil War. With shortages of equipment and supplies across the board, Kaúlza and the High Command have begun the process of reorganizing the economy around the Portuguese war machine to see the ongoing conflict resolved.\n\nTalk of bread and roses can come later, we have a war to win."

 GNS_a_sustainable_model:0 "A Sustainable Model"
 GNS_a_sustainable_model_desc:0 "As much as the more hardline leaders among Kaúlza's circle might grouse at the prospect, Portugal requires capital, as much to fight the Civil War as to rebuild one it concludes. We can not risk an economic crisis throwing a spanner in the works of Portuguese war production, therefore a plan that takes both the present catastrophe and future prospects at the same time.\n\nA generation or more of Salazarist rule has made the idea of reentry into a free market model a lukewarm premise to most Portuguese, even amidst the rubble of Estado Novo economics. Capitalism is scarcely a welcome alternative this side of the Atlantic and it will take some time before the benefits of it are made to bear fruit."

 GNS_enact_mass_privatizations:0 "Enact Mass Privatizations"
 GNS_enact_mass_privatizations_desc:0 "If the Portuguese Junta is to survive to the end of the Civil War and beyond it, the government has to redirect Its expenses to better allocate funding for military expansion. To achieve this, sweeping privatization measures for Portugal's industry will proceed as detailed by General Kaúlza and the High Command.\n\nSome are concerned at the prospect of a military industrial complex developing on Portugal's soil, but Kaúlza and his clique aren't so intimidated at the prospect of a conglomerate or two working to build up Portuguese military might; one of the benefits of a European society trained to be skeptical of capitalist interlopers is the knowledge that their success is secured entirely at our discretion."

 GNS_a_means_to_an_end:0 "A Means to an End"
 GNS_a_means_to_an_end_desc:0 "We are in a struggle for our very survival. Against forces of weakness, of decadence, of retreat from what the state, from what we, truly deserve. The economists in the war cabinet are very careful to talk at length about economic restraint, without realizing that there will be no economy - and no future for anyone - if the war is lost.\n\nVictory in this existential conflict is all that matters now, any decision that furthers it will be taken, no matter the future cost. When the war is won, those economists can do their part to fix the damages inflicted.\n\nBut first it will, it must be won."

 GNS_debt_is_no_issue:0 "Debt Won't Be an Issue"
 GNS_debt_is_no_issue_desc:0 "It is an obvious fact that debt can crush an economy. A country. But so too does military defeat and occupation, and it does so far more quickly. We must concern ourselves with the latter until the struggle is won, and to do so we must have supplies. Equipment. Personnel. We will issue whatever currency we need to, and take on whatever obligations we must, in order to secure victory.\n\nNo doubt there will be a reckoning for such action. But if such does come, if we must crush the people under the weight of repayment obligations, it will come in the aftermath of victory. To put it bluntly, debt won't be an issue, for us.."

 GNS_use_pows_as_forced_labor:0 "Put POWs to Work"
 GNS_use_pows_as_forced_labor_desc:0 "As the war continues, we find ourselves in possession of ever increasing numbers of prisoners from the forces that oppose us. They are expensive to maintain, they eat tremendous amounts of needed supplies, they conspire and foment dissent among their captors, and they have given nothing back. That ends now.\n\nThey will be put to work. They will repair roads, rails, and factories. They will build equipment and stamp munitions. They will grow food. They will earn the largesse we have granted them, helping with the war effort, and in doing so contribute to our inevitable victory."

 GNS_o_general:0 "O General"
 GNS_o_general_desc:0 "General de Arriaga is a patriot above all others. A man as loyal to the King as he is to the country. To Portugal. A figure truly above the political squabbles that, perhaps more than anything else, defined the old Union. And he knows very well how important it is that the people - from the common man to the diverse membership of the government - understand that.\n\nHe has taken care to ensure that the King's authority is properly exercised through the President's office. That the King understands the need to always appear alongside his President. That the always supportive relationship is clearly understood - and thereby legitimized. Strengthened.\n\nFor in that strength lies victory in all things."

 GNS_point_out_dissidents:0 "Point Out Dissidents"
 GNS_point_out_dissidents_desc:0 "Stability demands the removal of destabilizing elements. That is true in every sphere of state administration, and we must keep it in mind. It is no secret that there are many who would see us fail from within. Adherents to the old regime, those who do not understand the bright future we promise, and more spread dissent and disinformation.\n\nIf we are to catch them, we must first identify them, and so we must mobilize the people. We will make them aware of these traitors in their midst, we will demonstrate the risks they pose, and we will rely on informers - on a societal scale - to identify those we must arrest."

 GNS_the_military_loyalty_pledge:0 "The Military Loyalty Pledge"
 GNS_the_military_loyalty_pledge_desc:0 "The military is central to our new state, and none would be foolish enough to call its loyalty into question. It is, however, important to formalize their inherent obligations for future stability, and as such the General has decreed that a personal pledge of loyalty to the nation is mandatory for all officers, and across all branches.\n\nSuch a pledge will ensure that they all, to a one, remember what they are fighting for, and what their obligations are. It will also ensure that any acts of disloyalty, whatever forms they may take - be they active sabotage or insufficient pursuit - can and will be harshly punished."

 GNS_renew_bureaucracy:0 "Renew the Bureaucracy"
 GNS_renew_bureaucracy_desc:0 "The state's current bureaucracy is workable, but unfortunately possesses a very dangerous characteristic - that being the unknown reliability of the majority of its staff. Very few of them are what could be considered truly loyal, as many more of them began their careers under the old administration, the Estado Novo, or the Iberian authorities.\n\nThis cannot stand. If we are to achieve victory we must have an efficient and reliable civil service, and we will. We will remove those remnants of the past and replace them with people we know to be loyal. People who know what the new state means - and what it promises."

 GNS_rule_by_favors:0 "Rule by Favors"
 GNS_rule_by_favors_desc:0 "Since time immemorial, influence and wealth has been traded for action - and even today it is no different. Many would claim that the only way we, the only way that the General, can achieve assistance or collaboration is through naked intimidation. This is not only false, it is unnecessary.\n\nAll that is needed to enable those with abilities to assist in the march to victory is the payment of the variable price that every person has. And, of course, doing so instead of using force has many other benefits besides."

 GNS_rule_by_example:0 "Rule by Example"
 GNS_rule_by_example_desc:0 "Inevitably, as the blunt authoritarianism of Kaúlza's Junta continues to calcify, unflattering comparisons to Salazar and the Estado Novo begin to resurface. In truth, part of what made the Caudillo such a contemptible figure was that he, like many ideologues, seemed incapable of taking responsibility for either his own excesses or that of his party..\n\nThe military regime in Portugal is not so venal as to make excuses; Portugal is a nation at the westernmost terminus point of a Nazi-dominated european polity that would tear any perceived rival asunder, it won't be long at all until Lisbon begins to feel that pressure mounting. Harshness in governance is simply a necessary evil in this climate. So long as the Hun and their acolytes loom beyond the Pyrenees, Portugal is not safe unless national discipline is enforced."

 GNS_a_modern_nationalism:0 "Modern Nationalism"
 GNS_a_modern_nationalism_desc:0 "A generation has passed since the Caudillos France and Salazar united the Iberian continent, a joint national and military countermeasure between to gird the region against the madness and avarice of Germania and Rome respectively. With the Reich and the Mare Nostrum having waned in strength over the interregnum, the Iberian experiment promptly came to an end, restoring the Portuguese nation state through a most bloody rebirthing process.\n\nIt falls on Kaúlza's regime to lick the wounds of a scarred nation, reconstituting Portuguese nationalism in the wake of the Iberian collapse. Ostensibly an easy task for the military government, yet Estado Novo's political wrangling has made calls for patriotism ring hollow in the ears of the average person. New avenues for a national regeneration will have to be pondered, for the people need to remember that theirs is still a nation worth dying for."

 GNS_enforce_military_rule:0 "Enforce Military Rule"
 GNS_enforce_military_rule_desc:0 "Kaúlza has been careful to ensure the military government maintains an otherwise healthy relationship with the civilians in Portugal, if for no other reason than to at least appear transparent after generations of Salazar's hands-off approach to populism. But that doesn't mean the Junta is any less of a threat to any perceived danger posed to the newly independent Portugal.\n\nThe military need not be a source of fear or anxiety as the predecessors were, but neither can they appear weak. Kaúlza's word remains law and the high command has every intent of following it to the letter. The people of Portugal will always remain our highest priority, regardless of any animosity over individual rights that might linger."

 GNS_let_them_fear_our_will:0 "Let Them Fear Our Will"
 GNS_let_them_fear_our_will_desc:0 "As the fighting in Portugal reaches a fever pitch, Kaúlza intends to ensure that both the enemy on the frontlines and the civilian population on either side of them need reminders of the validity of the General's cause. Nothing but absolute victory over the enemy will suffice if we are to ensure the security of the Portuguese people.\n\nGrand parades and rallies are to be scheduled over the coming months, with General Kaúlza's most ardent supporters taking the stage to show solidarity with the war effort. No longer will the enemies of Portugal be able to slam the government as one who does not fight for Its people, for the people will exhort our advance as the long-arm of Portuguese military might crushes the opposition in the final battle for the nation's future."

 GNS_operacao_viriato:0 "Operação Viriato"
 GNS_operacao_viriato_desc:0 "The pestilential warfare in western Iberia has gone on long enough, the line is to be drawn here, here and no further! The people stand behind us, while the finest of the nation's fighting forces ready themselves for the onslaught to come. General Kaúlza and the high command have done all they can to stiffen the backbones of the man at the front, who now await the order to march forth and retake the last holdouts opposite the battlelines.\n\nBy the authority of General Kaúlza and the military government, those orders are to be carried out in swift fashion. The storm of the Civil War has been a hard one to weather already, one that will leave marks on the nation for generations to come; In truth, this is not the end of the nation's woes even if victorious. If anything, this final campaign marks a new beginning as Portugal forces itself back on the world stage through force of will."
 
