 ### Ideas ###
 TUN_the_second_treaty_of_bardo:0 "Другий Бардоський договір"
 TUN_the_second_treaty_of_bardo_desc:0 "У 1881 році Бардоський договір, підписаний французами та беєм, цілковито вихолостив Туніс, повністю позбавивши його автономії. Можна було б наївно подумати, що повна поразка французів покращить ситуацію, але все, що сталося, — це нове приниження.\n\nІталійці перетворили бея на безвладного регента, а їхні економічні інтереси, чи то в промисловості, сільському господарстві або туризмі, виснажили Туніс, якими б мізерними не були прибутки.\n\nОднак чутки про туніську нафту можуть покращити грошові потоки..."

 TUN_destour_hegemony:0 "Гегемонія Дестуру"
 TUN_destour_hegemony_desc:0 "Партія Дестур зазнала доволі іронічної долі; спочатку задумана для організації арабів проти французького колоніялізму, вона стала мимовільним партнером італійського колоніялізму.\n\nЄдина легальна політична партія після того, як крах Нео-Дестуру змусив їх об'єднатися, Дестур дедалі більше дестабілізується політичним насильством і внутрішньою напруженістю, причому розрізнені крила розривають її зсередини, а інші сили, як-от комуністичний рух, тиснуть на неї ззовні."

 TUN_the_italo_tunisians:0 "Італо-тунісці"
 TUN_the_italo_tunisians_desc:0 "Століттями Туніс був привабливим притулком для італійців, яким не було куди йти та нічого втрачати. За французької колоніяльної адміністрації з італо-тунісцями поводилися жахливо, тому спочатку вони були зачаровані обіцянками фашизму щодо слави та зв'язку з батьківщиною.\n\nТепер, фактично перебуваючи під італійським правлінням, громада стала значно більш розділеною, оскільки антифашистські та ліві ідеї набирають популярности серед тих, для кого високі обіцянки фашизму залишаються цілковито невиконаними. Італійці Тунісу розділилися на два запекло протилежні табори, і лише боротьба визначить, хто переможе."
  
