 ### Leader Bios ###
 POLITICS_MUHAMMAD_VIII_DESC:0 "Як то кажуть, Туніс ухилився від краплі дощу лише для того, щоб сховатися в канаві. Він із запалом скинув французьке ярмо, коли війська Осі пройшли через Північну Африку, лише для того, щоб замінити його суворішим правлінням Риму. Весь європейський порядок за останні тридцять років був розтрощений і перебудований у форму, яку ледве можна впізнати; попри все це, деякі речі в Тунісі залишаються такими самими, як завжди. Ця застиглість посеред потрясінь проявляється в особі Мухаммеда VII аль-Аміна, останнього бея династії Хусейнідів.\n\nБільш відомий як Ламін Бей, він опинився в центрі уваги у 1940-х роках як кузен і обраний спадкоємець Монсефа Бея. Його попередник, національний герой за свої зусилля зі звільнення від французької гегемонії під час війни, визначив післявоєнний Туніс, хоча його домовленості з італійцями спричинили значне невдоволення серед частини населення. Після того як погано спланована спроба італійців інтегрувати Лівію до своїх африканських володінь завершилася провалом, Рим обрав Ламіна Бея регентом у режимі протекторату, іронічно дуже схожому на той, який французи встановили багато років тому.\n\nТуніс був визволений і поневолений італійцями, а Ламін Бей є одночасно їхнім спільником і противником. Хоча юридично він править як представник короля в Римі, Ламін Бей поділяє амбіції свого кузена щодо вільного Тунісу, бажано здобутого шляхом переговорів з італійцями. Його зв'язки в партії Дестур, яка водночас є апаратом колаборації та справжньою націоналістичною силою, прагнуть обережного, законного шляху до вільної батьківщини. Однак Туніс є дуже поляризованим місцем, а бей старіє. Якщо він залишить політичну арену, ретельно вибудуваний баланс партії Дестур може раптово й кардинально розпастися."

