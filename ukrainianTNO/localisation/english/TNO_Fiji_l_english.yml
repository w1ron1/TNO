# Leaders
POLITICS_A_D_PATEL_DESC: "Як і багато його співвітчизників Фіджо-індійців, А.Д. Патель не є корінним жителем своєї острівної батьківщини, але присвятив своє життя тому, щоб зробити Фіджі кращим місцем для всіх її громадян. Народився в Гуджараті, Індія, його сім'я іммігрувала на Фіджі, коли він був ще дитиною. Під час навчання в Індії його надихали реформаторські лідери ІНК, Неру та Ганді. Повернувшись на Фіджі з новим запалом, він став політиком, організовуючи маргіналізовану індо-фіджійську популяцію проти щоденної гноблення з боку білих і корінних жителів. Після закінчення війни, коли цукрові плантації зруйнувалися, а напруження між корінними жителями і новими урядами зростало, Патель став одним з основних голосів за не тільки незалежність, але й за масштабні соціально-політичні реформи.\n\nНевдалий замах на життя Пателя став вирішальним для отримання підтримки ОВН, яка спонсорувала незалежність Фіджі під президентською республікою, що призвело до того, що Патель став першим президентом Фіджі, хоча його часто називали «Джорджем Вашингтоном Фіджі» в американській пресі. Патель залишається спірною фігурою. Його спроби швидких соціальних реформ часто порушували традиційні привілеї вже ворожих корінних фіджійців, а звинувачення в корупції в його партії розділили його індо-фіджійську електоральну базу."

FIJ_A_D_Patel: "А.Д. Патель"

# Ідеї
FIJ_divided_islands: "Поділені острови"
FIJ_divided_islands_desc: "Під час колоніального періоду британці імпортували тисячі контрактерів з Південної Азії для роботи на своїх величезних цукрових плантаціях. Сьогодні їх нащадки, незважаючи на те, що складають незначну більшість на острові, живуть у злиднях, стикаючись з фактичним расовим кастовим системою нижче корінних фіджійців. Тим часом корінне населення Фіджі має свої претензії, оскільки вони бачать, як їхні традиційні права та привілеї загрожують амбітним реформам нової республіки для виправлення минулих дискримінацій."
FIJ_the_pacific_vanguard: "Тихоокеанський авангард"
FIJ_the_pacific_vanguard_desc: "Як найбільша передова військова база ОВН на Тихому океані, лише в кам'яному кидку від японських територій, маленька острівна республіка стала фортецею, яка має кілька військових баз і постійну охорону повітряним та морським шляхом. Проте близькість японців та час від часу вторгнення японських рибалок залишають острівців у стані постійної тривоги."
FIJ_economic_doldrums: "Економічний застій"
FIJ_economic_doldrums_desc: "Після розпаду Британської імперії та краху торгівлі поза межами скорочуваного Вільного світу, колишня процвітаюча економіка цукрових плантацій на Фіджі потрапила в кризу, що спричинило величезні соціально-політичні заворушення в 1950-х роках. Введення капіталовкладень ОВН і військових доларів від військових баз стабілізувало ситуацію, але острів ще не знайшов свою нішу у зміненому світі. Майбутнє виглядає нестабільним, оскільки економіка застоюється."

