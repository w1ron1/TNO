 ### Character Loc ###
 # Leaders #
 VOL_Vasily_Ivanov: "Василь Іванов"
 POLITICS_VASILY_IVANOV_DESC: "Василь Миколайович Іванов почав свій шлях як простий сільський швець, перш ніж у 1920-х роках був призваний до Червоної армії. У наступні роки він зміг вступити до офіцерської академії та поступово просувався по службі, отримавши звання полковника до моменту німецького вторгнення. Він та його бригада брали участь у нещасливій обороні Москви, але змогли здійснити відносно організований відступ, коли Можайська лінія впала, а Вермахт ринув уперед. Вони рушили в протилежному від багатьох інших ветеранів напрямку та відступили на північ, приєднавшись до сил маршала Єгорова. Іванов отримав звання генерала в новонародженому Західноросійському революційному фронті й був одним із командирів, які очолили наступ проти німців.\n\nОднак цей наступальний порив не тривав довго. Зрада та внутрішня боротьба за владу послабили Фронт, і німці та їхні колабораціоністи невдовзі змогли переломити хід війни. Вже звільнивши та окупувавши рідну Вологду, Іванов ухвалив важке рішення залишити свою справу, а його армія вийшла з Фронту та проголосила нейтралітет. Для нього подальша участь у Фронті, який стрімко розпадався, лише принесла б ще більше кровопролиття в регіон, який уже зазнав стількох страждань.\n\nЦей крок приніс Іванову похвалу жителів Вологди, які бачать у ньому одночасно визволителя свого міста від нацистської тиранії та оплот, що стримує хаос інших воєначальників. Його позицію також неохоче прийняли і Фронт, і Райхскомісаріат Московія, які визнають корисність буферної держави, що існує між ними. Але хоча ця політика збройного нейтралітету останніми роками була успішним стримувальним фактором, це лише питання часу, коли якийсь воєначальник розкусить його блеф і піддасть його армію випробуванню."

 POLITICS_PAVEL_BELYAYEV_DESC: "Під час Великої Вітчизняної війни, під час евакуації Москви, Павло Іванович Бєляєв був ніким — курсантом льотної школи, людиною, якої не варто було боятися. Під час Західноросійської війни він здобув популярність як один із найздібніших пілотів Іванова, зрештою закріпивши за собою місце серед його найближчих радників. Коли Іванов заснував Державу Вологда, Павло весь цей час стояв поруч із ним, ставши хрещеним батьком новоствореного уряду. У цей ранній період він віддано служив Іванову, обіцяючи бути вище політики та продовжувати якомога краще радити засновникові.\n\nПавло порушив цю обіцянку лише через кілька років після заснування, частково через страх стати непотрібним, а частково через розчарування нерішучістю Держави. Його обрали до Народних зборів, законодавчого органу Вологди. Ніхто, принаймні публічно, не сумнівався в його відданості Іванову. Однак у самій палаті він дедалі критичніше ставився до майже пацифістського бачення Івановим Вологди як "нейтральної зони" для всіх росіян. Він приєднався до мілітаристів і, завдяки своєму престижу як хрещеного батька Держави, піднявся сходами їхньої ієрархії, ставши їхнім лідером.\n\nТепер, як лідер мілітаристів, він виступає за щось радикально відмінне від інших парламентських фракцій. Він вважає їхню політику "нейтралітету" та "ліберальної демократії" каменями спотикання, які приведуть Державу до занепаду. Натомість він палко виступає за ірредентизм. Для нього війна та сила є найбезпечнішою гарантією для Вологди, але не всі в цьому так упевнені."

 POLITICS_ANATOLY_DRYGIN_DESC: "Анатолій Семенович Дриґін — суперечлива постать у Вологді. Для його прихильників він є рідкісним людяним обличчям у війську, справжнім прихильником демократії та захисту звичайних людей держави. Для його противників він наївний мрійник, який не має відповідей на нагальні безпекові питання Вологди. Однак єдине, що ніхто не може заперечити, — Дриґін завжди благородно боровся за те, що вважав правильним.\n\nНародившись у великій селянській родині в Саратові, Дриґін спочатку вивчав агрономію та став фахівцем із вирощування ягід (хобі, яким він досі займається у вільний час), але був призваний до Червоної армії, коли німці почали вторгнення, продовжив боротьбу за Західноросійський революційний фронт після розпаду Совєцького Союзу та зрештою служив під командуванням генерала Василя Іванова. Від природи ніколи не будучи військовим, він навчився придушувати власні ідеали заради блага Росії, проходячи через одні з найжорстокіших битв проти Райху, жодного разу не поставивши під сумнів накази.\n\nДля Дриґіна проголошення Івановим нейтралітету в Західноросійській війні стало одкровенням. Побачивши, як військові здобутки приносяться в жертву заради збереження людських життів, він надихнувся, а його загартований війною цинізм швидко розвіявся. Майже одразу після заснування Народних зборів він висунув свою кандидатуру та став засновником їхньої демократичної фракції, палко просуваючи реформи для селянського населення території.\n\nДриґін давно мріяв перетворити Вологду на демократичну перлину західної Росії. Тепер, коли він консолідував владу в Народних зборах, він має всі можливості втілити ці мрії в життя."

