 ### Ideas ###
 VOL_neutral_zone: "Нейтральна зона"
 VOL_neutral_zone_desc: "Досить кровопролиття; цими словами генерал Іванов наказав припинити бойові дії в секторі під його командуванням. Більше ми не проливатимемо російську кров, коли ненависний німець уже зламав хребет Батьківщини, а цивільні бояться за свої життя. Ні — ми захистимо тих, хто перебуває під нашою опікою, і чекатимемо кращих часів. Тоді, і лише тоді, ми завдамо удару."

 ###post onega###
 VOL_ONG_Miklay_Kazakov: "Міклай Казаков"
 POLITICS_MIKLAY_KAZAKOV_DESC: "Марійський народ довгий час був позбавлений власної державности кожною російською державою та її наступниками, які ним правили. Чи носили вони червоний прапор соціялізму, чи триколор — усе було однаково, але Міклай Іванович Казаков зробив це справою свого життя. Коли перемога Антикомуністичної гвардії в Західній Росії стала майже неминучою, він згуртував етнічних марійців по всьому регіону, щоб вони приєдналися до Марійського полку, який воював разом із Гвардією.\n\nСпіввітчизники прозвали Казакова "поетом-воїном", оскільки він завжди зберігав пристрасть до поезії та літератури. Він був очевидним вибором на посаду лідера першої етнічно марійської держави — і ним став.\n\nРеспубліка стала ще однією історією успіху Північної Росії, оскільки Казаков стабілізував її та звертає погляд на інші держави Ідель-Уралу, а також Архангельськ, шукаючи співпраці та солідарности."

