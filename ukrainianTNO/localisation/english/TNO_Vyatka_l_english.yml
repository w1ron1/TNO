 VYT_Vladimir_Kharzhevsky_hog: "Владімір Харжєвскій"
 VYT_Vladimir_Kharzhevsky_hog_desc: "§YГолова уряду\nАристократичний консерватизм§!\n--------------\n§LВетеран обох світових воєн, Громадянської війни в Росії та Західноросійської війни, Владімір Харжєвскій нині сидить праворуч самого царя. Служив на фронті Пьотра Вранґєля генерал-майором і командиром Дроздовської дивізії, а після евакуації з Криму разом із Вранґєлем та своїми людьми втік у вигнання. У 20-х і 30-х Владімір безцільно поневірявся Европою. Справжнє покликання знайшов лише тоді, коли Владімір III проголосив себе царем і погодився співпрацювати з німцями. Переїхавши до Німеччини, невдовзі надіслав пропозицію до РОВС, і його швидко знову призначили генерал-майором та командиром відродженого Дроздовського полку.\n\nВладімір вірно служив цареві, понад десятиліття воюючи в лавах РОВС разом із їхніми німецькими господарями. Навіть зблизився з монархом особисто, ставши одним із найближчих політичних радників. Коли наприкінці Західноросійської війни РОВС вирішив відірватися від німецьких ліній і захопити Вятку, його голова Алєксєй Алєксандровіч фон Лампе склав командування через незгоду з розривом стосунків із німцями. Тож Владімір став очевидним наступником Алєксєя на чолі РОВС, а отже й фактичним головою уряду новоствореного Вятського князівства.\n\nНині Владімір сидить поруч зі своїм царем і радить другові. Його також дратують сварки еміґрантських фракцій, та хай що з ними станеться, цар завжди матиме союзника в найвірнішому другові.§!"
 VYT_Roman_Gul: "Роман Ґуль"
 VYT_Roman_Gul_for_desc: "§YМіністр закордонних справ\nОлігархічний лібералізм§!\n--------------\n§LЧи можна водночас бути білоеміґрантом і лібералом? Познайомтеся з Романом Борісовічем Ґулем, ветераном Першої світової та Громадянської війни в Росії. Воював в Ударному полку Лавра Корнілова під час Першого Кубанського походу, еміґрував до Берліна й став ліберальним письменником. Це накликало гнів Райху після приходу нацистів до влади у 1930-х, і за свої тексти його швидко кинули до концтабору. Ледве врятувавши життя, втік із Німеччини до Франції й писав для кількох ліберальних еміґрантських журналів. Коли німці успішно вторглися до Франції 1941 року, Ґуль мусив ховатися від полону, працюючи на скляному заводі під новим ім'ям.\n\nКоли цар офіційно підтримав німців, Роман відчув нагоду. Ризикуючи, написав цареві Владіміру: в обмін на помилування від Райху стане міністром пропаґанди РОВС. Цар звернувся до німців, Райх неохоче задовольнив прохання, і Роман став міністром пропаґанди всього РОВС.\n\nТа Роман ніколи не зрікався ліберальних ідеалів чи ненависти до мерзенних німців. Коли царисти дістали нагоду порвати з німцями й спробувати створити власну державу, він палко це обстоював. Після захоплення Вятки Роман та однодумці-еміґранти відродили стару ліберально-монархічну партію кадетів; нині він найвизначніший ліберальний реформатор Вятки й веде дедалі гостріше суперництво з реакційнішими фракціями. Час покаже, чи піде Вятка шляхом Ґуля, чи лишить його позаду.§!"
