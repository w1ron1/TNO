 VYT_Gleb_Rar: "Ґлєб Рар"
 VYT_Gleb_Rar_eco_desc: "§YМіністр економіки\nСолідаризм§!\n--------------\n§LХай що ще скажуть про Ґлєба Алєксандровіча Рара, понад усе він надійний солідарист до кісток. Народився в родині середнього класу скандинавського походження; 1924 року його родину вислали із Совєцького Союзу, і вона осіла в Балтії, де він закінчив школу, яку підтримували німці. Коли 1940 року Балтію захопили, ця освіта разом із германським звучанням імени дозволила втекти до самої Німеччини.\n\n1942 року, навчаючись у Бреславському університеті, приєднався до солідаристів; це, разом зі зростанням православної віри, поволі привело його до кола монархістів, які ще були під німецьким захистом. Під час Західноросійської війни долучився до воєнних зусиль царя Владіміра, а після перемоги пішов за ними до Вятки й оселився там.\n\nЗдобутої репутації вірности й надійности вистачило для піднесення до Імператорської ради, де він нині вірно служить представником солідаристів.§!"

