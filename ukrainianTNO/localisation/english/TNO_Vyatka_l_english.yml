 VYT_foreign_trade_desc: "Завдяки створенню Імперського дипломатичного корпусу ми можемо налагоджувати дипломатичні відносини зі світом поза межами Росії. Важливим чинником нашого розвитку як держави є економіка, яку можна зміцнити торгівлею з іншими країнами. Тому в наших інтересах укласти якомога більше торговельних угод, щоб сприяти економічному відродженню."

