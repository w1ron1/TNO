 VYT.1000.t: "Ми живемо в общєстві"
 VYT.1000.desc: "Свєтлано це тв\n\nій останній шанс відповісти на мої повідомлення чому ти кинула мене джентльмена ґеймера заради того тупого ревізіоністського чада Жданова пішла ти нхауй"
 VYT.1000.a: "Сусловці, повстаньте."
