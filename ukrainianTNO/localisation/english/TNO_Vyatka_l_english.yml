 ### Starting tree ###
 VYT_return_of_the_tsar: "Повернення імператора"
 VYT_return_of_the_tsar_desc: "Поява Вятки, монархічної держави, у країні, яка стратила своїх попередніх монархів, була одним із найдивніших наслідків Західноросійської війни. І все ж для багатьох це було зрозуміло.\n\nКомунізм цілковито підвів російський народ, привівши його до поневолення чужоземним режимом, і повернення до давніших часів, коли Росія нав'язувала свою волю іншим, а не корилася чужій, саме собою вабило.\n\nЦар Владімір продемонстрував народові риси, яких очікують від імператора, розділивши його біль і гнів через німецькі бомбардувальники, що реґулярно його тероризують. І він пообіцяв, що свого часу очистить їхнє небо, поверне їхню землю, а їхній імперський орел гордо майорітиме від Волги до Амуру."

 VYT_an_economic_graveyard: "Кладовище економіки"
 VYT_an_economic_graveyard_desc: "По всій Західній Росії реґулярні бомбардувальні вильоти німецьких Люфтваффе унеможливлюють підтримання економіки хоч якогось помітного масштабу чи складності. Усе, що нагадує завод, виявляють, беруть на приціл і знищують. Саме так і задумано. Німці знають: якщо вони не дадуть нам індустріялізуватися, то й не дадуть об'єднатися проти них.\n\nМожливо, зараз ми й не здатні створити промислову базу, але це не означає, що маємо сидіти склавши руки. Ми можемо оцінити свої ресурси, знайти кваліфікованих робітників і спланувати майбутні майданчики забудови. Ми можемо підготуватися настільки, наскільки нам до снаги. Щоб повернути Росію династії Романових, нам потрібна промисловість.\n\nОдного дня бомбардування припиняться, мусять припинитися. І коли це станеться, ми будемо готові."

 VYT_the_vyatka_distillery: "Вятська винокурня"
 VYT_the_vyatka_distillery_desc: "Для багатьох росіян стабільне постачання якісної горілки так само необхідне, як і сама їжа. Через спустошення, спричинене і війною, і німецькими бомбардувальними кампаніями, цей продукт став дефіцитом. І саме тут криється нагода, якою цар запропонував скористатися.\n\nКартоплю садитимуть і вирощуватимуть у великих обсягах, забезпечуючи їжу, робочі місця й сировину для спиртного. Винокурні повернуть до роботи й відновлять, щоб перетворювати цю сировину на високоякісну горілку, створюючи ще більше робочих місць, задовольняючи внутрішній попит і забезпечуючи державу цінним - і дуже бажаним - товаром.\n\nДоходи від продажу горілки по всій Росії фінансуватимуть інші проєкти, а з кожною проданою пляшкою ще один росіянин дізнаватиметься, що його цар розуміє його потреби."

 VYT_alternative_uses: "Інші застосування"
 VYT_alternative_uses_desc: "Високоякісний спирт, який виробляють державні винокурні, надзвичайно цінний для торгівлі, але може також слугувати ефективним антисептиком. У Росії, де травми є частиною повсякдення, а медична інфраструктура часто ненадійна, його цінність майже не має рівних.\n\nЗбудувавши лабораторії поруч із нашими новими винокурнями, ми зможемо переробляти частину виробленого спирту на дезінфекційний засіб медичної якості й надійно та безперебійно постачати його цивільним і військовим лікарням. Так само частину можна фасувати на експорт, розширюючи торгівлю, залучаючи капітал і, можливо, бодай трохи роблячи війну в Росії цивілізованішою."

 VYT_the_imperial_potato_act: "Картопляний указ імператора"
 VYT_the_imperial_potato_act_desc: "Царська ініціятива розвитку винокурної промисловості виявилася успішною. Надто успішною. Зайнятість зросла, а вкрай потрібна тверда валюта, зароблена на експорті, нарешті почала надходити в економіку, проте ми маємо серйозну проблему. Картоплі просто бракує, щоб задовольнити попит. Треба діяти.\n\nРішенням є Картопляний указ імператора, що передбачає дедалі більшу підтримку податковими пільгами, землею й робочою силою для фермерів, які погодяться відвести певну частку своєї ріллі під картоплю.\n\nЗбільшення виробництва дозволить розливати більше горілки, а отже, і почати нарощувати її експорт. Невдовзі голландці, французи, німці й інші погодяться: найкраща російська горілка походить із Вятки."

 VYT_find_new_markets: "Пошук нових ринків"
 VYT_find_new_markets_desc: "Нещодавнє вдосконалення вятських винокурень ще більше збільшило виробництво. Ми просто не можемо продати все це ані на внутрішньому, ані на сусідніх зовнішніх ринках без неприйнятного зниження ціни. Отже, рішення треба шукати далі.\n\nНідерланди, чи те, що від них залишилося під владою Райху, останніми роками утвердилися як осередок законної й позазаконної торгівлі, і це відкриває можливість. Хоча продажі навряд чи сягнуть російського рівня, вони допоможуть скоротити наші величезні запаси, захистити ціни й до того ж принести тверду валюту."

 VYT_rolling_on_the_river: "Річкові перевезення"
 VYT_rolling_on_the_river_desc: "Річковий транспорт здавна був опорою російської комерції й торгівлі. Пересуватися річками часто значно швидше, ніж суходолом, а нині це справедливо подвійно, з огляду на стан російської інфраструктури. Хоча ми вже не контролюємо таких великих річок, як Дніпро, Дон чи Волга, ми контролюємо Вятку, яка сполучається з розлогою мережею інших річок Західної Росії.\n\nВідкривши знову міські пристані й заохочуючи будівництво річкових барж та інших торговельних суден, ми зможемо компенсувати недоліки нашої інфраструктури та розширити внутрішню й зовнішню торгівлю. Можливо, згодом сама Вятка стане осередком цієї діяльності."

 VYT_the_kostroma_pipeline: "Костромський канал збуту"
 VYT_the_kostroma_pipeline_desc: "Налагодження торговельних зв'язків із голландцями виявилося дуже вигідним, давши нам ринок збуту надлишків як спиртного, так і інших товарів. Але Нідерланди далеко, а перевезення туди товарів саме собою ризиковане. Нам потрібне ближче місце.\n\nКострома, місто на межі німецької сфери впливу, має ідеальне розташування. Через слабко контрольований кордон легко перевозити товари до Райху, і хоча німці більше не наші друзі, їхні гроші нічим не гірші за будь-чиї інші. Ми їх братимемо. Доки імперія не стане достатньо сильною, щоб більше цього не потребувати."

 VYT_a_new_hub_of_trade: "Новий торговельний центр"
 VYT_a_new_hub_of_trade_desc: "Наші зусилля з розвитку торгівлі виявилися надзвичайно успішними. Завдяки визначенню пріоритетних ключових товарів, розвитку міжнародних зв'язків і створенню швидких та ефективних торговельних артерій на російських водних шляхах Вятку охопило бурхливе пожвавлення. На міських пристанях вирує життя, купці перевозять дедалі більші вантажі, а доходи зростають щомісяця. Проте цар і його радники завжди дивляться вперед.\n\nБуло висунуто й схвалено план перетворення Вятки на центральний торговельний вузол Західної Росії. Інфраструктуру значно розширять, що дозволить відповідно збільшити торгівлю й іншу комерційну діяльність, забезпечить Вятці як місту панівне становище в майбутньому та допоможе створити міцну фінансову основу для прийдешніх кампаній."

 VYT_imperial_austerity: "Імперська жорстка економія"
 VYT_imperial_austerity_desc: "Після вичерпного аудиту всієї економіки князівства і цар, і його міністри були вражені, дізнавшись про її справжній, украй занепалий стан. Заводи стоять покинуті, а ремісники виробляють ті крихти, які їм до снаги, у підвальних майстернях. Поля лежать необроблені, а селяни зосереджені на натуральному господарстві, щоб прогодувати себе та свої родини. Якщо не діяти, наша крихка економіка невдовзі цілковито завалиться.\n\nЩоб зарадити цьому, цареві подали план жорсткої економії. Значне скорочення видатків на послуги, освіту й безпеку буде болючим, особливо для багатьох із тих, хто вже страждає. Але воно необхідне. І цар висловився цілком чітко: воно не триватиме вічно."

 VYT_moderate_austerity_programs: "Програми помірної економії"
 VYT_moderate_austerity_programs_desc: "Цар і його уряд згодні: для запобігання економічному краху потрібна програма жорсткої економії. Проте слід також зважати на її вплив на наш народ, який уже витерпів роки страждань. Цар ухвалив рішення щодо суворості заходів економії.\n\nІ він вирішив пом'якшити пропозицію. Скорочення будуть, деякі доволі болючі, але їх проводитимуть так, щоб якнайменше вдарити по населенню. Цар не покладе на свій народ надмірного тягаря, а сфери, визнані критично важливими для основних потреб населення, вбережуть від найгірших скорочень. Росія без свого народу - зовсім не Росія."

 VYT_public_works_projects: "Програми громадських робіт"
 VYT_public_works_projects_desc: "Дві жахливі війни, розпад центральної влади й реґулярні німецькі бомбардування всього цінного майже цілковито знищили будь-яку російську інфраструктуру, гідну цієї назви. Як у нашій державі, так і деінде звичайні росіяни здебільшого подорожують місцевими стежками за допомогою провідників. Звісно, це душить торгівлю, промисловий та економічний розвиток і військові операції. Цьому треба зарадити.\n\nДля цього цар і його уряд фінансуватимуть програми громадських робіт по всьому князівству, будуючи нову інфраструктуру й ремонтуючи стару та водночас забезпечуючи робочі місця. Звичайно, німці знищать частину збудованого, але ми не відступимо, хоч би якою була ціна. Цього вимагає майбутнє."

 VYT_imperial_bank_of_russia: "Імперський банк Росії"
 VYT_imperial_bank_of_russia_desc: "Розпад промислової економіки Росії супроводжувався розпадом будь-якої надійної банківської системи. Наслідком стали майже цілковита відсутність помітних інвестицій чи кредитування, недовіра до валют, повернення до накопичення дорогоцінних металів і розвиток бартерної економіки серед громадян.\n\nПісля запровадження громадських робіт і програм економії наступним кроком має стати розв'язання цієї критичної проблеми шляхом створення центрального банку. Він допоможе утвердити нашу валюту, зміцнити довіру до неї й визначати політику щодо неї. Крім того, він дозволить як стимулювати, так і реґулювати комерційних та приватних кредиторів, заохочуючи економічне зростання в усіх сферах."

 VYT_more_extreme_measures: "Жорсткіші заходи"
 VYT_more_extreme_measures_desc: "Цар і його уряд згодні: для запобігання економічному краху потрібна програма жорсткої економії. Проте слід також зважати на її вплив на наш народ, який уже витерпів роки страждань. Цар ухвалив рішення щодо суворості заходів економії.\n\nІ він зробив цей важкий вибір. Видатки на інфраструктуру, охорону здоров'я, соціальні програми й багато іншого уріжуть до краю, щоб забезпечити фінансову безпеку держави та закласти основу наших майбутніх планів повернення територій. Народ буде невдоволений, але з часом зрозуміє, що цар дбає про його майбутнє не менше, ніж про власне."

 VYT_divert_funds_to_the_military: "Перенаправити кошти війську"
 VYT_divert_funds_to_the_military_desc: "Наше різке скорочення державного бюджету було болючим, але дало нам надлишок коштів, які можна розподілити. Передати їх війську - очевидний вибір: без надійного контролю над нашими землями ми не досягнемо нічого значущого. Додаткові ресурси дозволять набрати більше солдатів, придбати більше спорядження та підвищити боєготовність.\n\nПроте ми очікуємо негативної реакції громадськості, зважаючи на те, чим їй довелося поступитися, щоб це розширення війська стало можливим. Утім, ми сповнені рішучості: хоч би яким непопулярним був цей крок, ми готуємося до майбутнього всієї Росії, і з часом громадськість це зрозуміє."

 VYT_tax_the_commoners: "Підвищити податки"
 VYT_tax_the_commoners_desc: "Попри суворі заходи жорсткої економії, ми недостатньо скоротили видатки. Отже, доходи мають зрости, а єдиний відчутний спосіб цього досягти - значно підвищити оподаткування. Зборів із широкого переліку основних і споживчих товарів має вистачити, і хоча це спричинить подальше народне невдоволення, іншого вибору зараз немає.\n\nОднак вважається, що цей захід має бути останнім необхідним для отримання коштів на значні державні інвестиції, які згодом дозволять послабити програми економії. Ми покажемо нашим громадянам, що їхній гнів був недоречним. Але їм треба потерпіти ще трохи."

 VYT_start_of_the_recovery: "Початок відновлення"
 VYT_start_of_the_recovery_desc: "Нарешті видніється світло. Хоча запроваджені нами заходи жорсткої економії були болючими, вони дозволили уникнути цілковитого краху, а стратегічні інвестиції нарешті починають давати результат. Економічна активність різко зросла, і нові майстерні та галузі почали виникати природним шляхом.\n\nПроте ми мусимо залишатися пильними, розширювати раніше урізані програми зі зростанням доходів і впроваджувати реформи за потреби. Шлях до повного об'єднання під владою царя довгий і таким залишиться, але ми зробили все можливе, щоб дати собі та своєму народові якнайкращий початок."

 VYT_legacy_of_the_tsardom: "Спадщина імперії"
 VYT_legacy_of_the_tsardom_desc: "Десятиліття тому Росія, Третій Рим, була великою країною. А потім комуністи її зруйнували. Вони спокусили її селян брехнею. Вони загарбали великі багатства її освічених верств. Вони вбили її правителів, немов звичайних злочинців. А тоді двічі не спромоглися захистити її від хижих загарбників.\n\nХоча шрами від їхніх злочинів залишилися, надія ще є. Цар Владімір, гордий нащадок Романових, повернувся. Правити Росією та її народом - його божественне право, і коли випаде нагода, він розчавить бандитів, фашистів, комуністів і фанатиків, що змовилися розірвати Росію на шматки.\n\nТретій Рим знову постане."

 VYT_a_tangled_web: "Заплутана павутина"
 VYT_a_tangled_web_desc: "Падіння старої імперії прискорила слабкість управління, яка дозволила поширитися і економічному занепадові, і комуністичному екстремізмові. Якщо не брати до уваги самого царя, ми бачимо це й у князівстві: багато «тимчасових» урядових органів, заснованих роки тому, досі діють. Ми мусимо вчитися на минулому й не дозволити йому повторитися.\n\nТож ми рішуче візьмемося розплутувати цю павутину, ліквідовуючи зайві установи, офіційно закріплюючи потрібні державні служби й усуваючи марнотратні надмірності. Так ми зміцнимо свій контроль і над нинішньою, і над майбутньою територією."

 VYT_the_great_game: "Велика гра"
 VYT_the_great_game_desc: "Торгівля впливом притаманна будь-якому урядові, і царська адміністрація не виняток. Щодня численні посадовці нашої держави укладають і порушують домовленості, обмінюються послугами та інформацією.\n\nАле всьому є межа, і останнім часом розмах цих обмінів загрожує неприпустимо глибоко розколоти уряд. Цар це бачить і знає, що такі заняття відвертають увагу від будь-яких майбутніх зусиль з об'єднання країни. Але він також знає, що спроба їх обмежити може дати протилежний результат. Потрібна обачність.\n\nТому він публічно висловить невдоволення такими діями, послабивши позиції їхніх учасників без провокування конфлікту. Але він не забуде, і коли держава зміцніє, настане час розплати."

 VYT_fifty_shades_of_monarchism: "Різні відтінки монархізму"
 VYT_fifty_shades_of_monarchism_desc: "Монархізм сам собою не є ідеологією, тож зазвичай гуртує коаліцію людей із найрізноманітнішими політичними переконаннями. Наше князівство не виняток. Усі згодні, що цар Владімір - законний правитель усієї Росії, але не згодні щодо того, як має виявлятися його влада.\n\nАбсолютисти вважають, що вона має бути необмеженою, тоді як конституціоналісти вважають за потрібне встановити для неї обмеження. Фашисти, соціялісти та інші теж реґулярно висловлюють власні погляди. Усі ці форми монархії та ще багато інших постійно знаходять прихильників. Але ніхто не може сказати, яка з них зрештою візьме гору над рештою."

 VYT_utilize_the_okhrana: "Задіяти Охрану"
 VYT_utilize_the_okhrana_desc: "Попри праведне царське правління, є ті, хто хотів би скувати його, скинути з престолу чи й гірше. У кожному суспільстві є інакодумці, і за ними треба наглядати. Охрану - царську таємну поліцію - створили, щоб стежити за діями тих, хто прагнув знищення Росії, та стримувати їх. Хоча вона не виконала свого завдання, уроків цієї невдачі не забули.\n\nДля боротьби з цими інакодумцями Охрану відновлять, а проблеми, які призвели до її попередньої невдачі, усунуть. Вона знову пильнуватиме й оберігатиме нашого царя, нашу державу та наш спосіб життя. І цим забезпечить стабільність нашого князівства, а одного дня - і нашої імперії."

 VYT_form_the_imperial_council: "Створити Імператорську раду"
 VYT_form_the_imperial_council_desc: "Навіть така віддана й праведна людина, як цар Владімір, не може правити самотужки. Потрібні вірні слуги - і для управління територіями, і для порад у державних справах. Тому буде створено Імператорську раду, яка дозволить зібрати найкращі уми князівства й залучити їх до розв'язання найважливіших питань.\n\nСеред обраних будуть видатні діячі мистецтва й науки, досвідчені урядовці, вправні військові офіцери та інші. Їхні ґрунтовні поради допоможуть цареві дізнатися про все, що йому невідоме, а якщо він із будь-якої причини втратить здатність виконувати свої обов'язки, їм можна буде довірити реґентство, доки цар не зможе знову їх перебрати."

 VYT_the_peoples_tsar: "Народний цар"
 VYT_the_peoples_tsar_desc: "Хоча цар - людина, благословенна й обрана Богом, щоб вести Росію вперед, він, як і його піддані, росіянин. Він розуміє потреби простої людини й добре знає: якби не божественний вибір, він був би серед них у полі, на заводі чи в громадському клубі. Він більше не залишатиметься у своєму палаці. Він подорожуватиме вздовж і впоперек країни, говоритиме безпосередньо з прохачами й особисто демонструватиме свою любов до країни та народу.\n\nТак він самим своїм прикладом спростує пропаґанду наших ворогів, які зображають його далеким, тиранічним і байдужим деспотом. І він згуртує наш народ, поведе його в майбутнє та забезпечить мир і добробут усім росіянам - і великим, і малим."

 VYT_imperial_detachment: "Імператорська відстороненість"
 VYT_imperial_detachment_desc: "Так, цар - росіянин, але він і дещо більше. Він - символ. Ідеал. Постать, до якої можна прагнути й наближатися працею, але якої ніколи не досягти. Йому можна довіряти: він залишиться вищим за дрібні суперечки, фракційну боротьбу й особисті інтереси та неупереджено розгляне питання з усіх боків, перш ніж ухвалити якнайкраще рішення. Цю сутність, цей образ треба берегти.\n\nЦар залишатиметься осторонь народу, взаємодіючи з ним через міністрів, посадовців і офіцерів. Так він завжди буде присутній у його думках, заспокійливо нагадуючи про себе щоразу, коли люди бачать наш прапор чи розмовляють із представником держави. Саме так ми вбережемо Росію від руйнування, яке колись її поглинуло, і саме так ґарантуємо добробут і мир нашим дітям."

 VYT_a_cultured_court: "Культурний двір"
 VYT_a_cultured_court_desc: "Упродовж поколінь Імператорський двір Росії був відомий усьому світові своєю пишнотою, розкішшю й скупченням митців та інтелектуалів довкола нього. Якщо наша мета - відродити тіло Росії, почати слід із відродження її духу, а отже, і відновлення її культурного та інтелектуального серця.\n\nМи запровадимо й роздаватимемо щедрі ґранти художникам, поетам, музикантам та інтелектуалам. Ми запросимо їх до нашого двору, надамо їм громадянство в наших землях і замовимо величезну кількість мистецьких творів, музики, поезії та багато іншого. Ми відкриємо шлях новому поколінню російської культури, і з часом Росія знову заживе слави світоча культури й мистецтв, а цар - їхнього найбільшого покровителя."

 VYT_the_tsars_speech: "Промова царя"
 VYT_the_tsars_speech_desc: "Часті радіозвернення царя до князівства, звісно ж, дуже втішають його громадян, показуючи їм, що монарх повсякчас думає про них. Після чергового німецького бомбардування він вирішив виступити знову.\n\nНезвично те, що він активно долучився до підготовки промови, ретельно визначаючи і зміст, і спосіб подачі, а чутки вже сповіщають: це звернення навряд чи буде схоже на решту. У всіх куточках нашої держави царські піддані туляться довкола радіоприймачів, саморобних і не тільки.\n\nІ чекають на слова свого суверена."

 VYT_the_bishop_of_vyatka: "Єпископ Вятський"
 VYT_the_bishop_of_vyatka_desc: "Історично Православна церква посідала в російській державі майже таке саме центральне місце, як і сама монархія. Попри це, відносини царя з церквою останніми роками були якщо не ворожими, то доволі холодними. Багато хто в її лавах вважає царя недостатньо побожним, і це починає впливати на сприйняття його леґітимності. Треба знайти вихід, і швидко.\n\nВятська єпархія нині не має очільника, і призначення єпископа не лише публічно підтвердило б відданість царя церкві та зміцнило його зв'язок із нею, а й дало б цінний моральний провід нашим громадянам, яким повсякчас загрожує небезпека збитися зі шляху."

 VYT_emigre_support: "Підтримка еміґрантів"
 VYT_emigre_support_desc: "Падіння старої імперії змусило сотні тисяч найкращих і найобдарованіших людей Росії вирушити у вигнання до всіх куточків світу. Багато хто забрав із собою свої багатства, а ще багато хто знайшов достаток і успіх на новій батьківщині. Але старої вони не забули.\n\nЦар досі має зв'язки з часів свого життя в Пакті й через них зможе сконтактувати з найвидатнішими з цих людей. Багато хто з них прагне знову побачити імперського орла над об'єднаною Росією та готовий надати і фінансову, і політичну підтримку."

 VYT_mother_russia_bleeds: "Росія-Мати кровоточить"
 VYT_mother_russia_bleeds_desc: "Росія розбита. Від європейських територій до Далекого Сходу її народ тремтить від страху перед бандитами, грабіжниками й воєначальниками дрібних уділів. Те, що наша колись велика країна дійшла до такого, - незмірна трагедія, але надію ще не втрачено. Росії не звикати до страждань чи до нового початку, але для цього їй потрібен сильний і шляхетний провід. І ми його дамо.\n\nЯк Пьотр Великий підніс Росію до заслуженого становища світової держави, так само вчинить і цар Владімір. Він дасть зрозуміти: порядок, сила, добробут і віра повернуться до нашої країни, хоч би якою була ціна.\n\nМи повернемо те, що належить нам від народження."

 VYT_seize_illegal_convoys: "Перехопити контрабанду"
 VYT_seize_illegal_convoys_desc: "Політичний хаос у Республіці Комі призвів до вибухового зростання контрабанди вздовж нашого кордону з нею. Тут сотні «торговців» відверто нехтують законами князівства, позбавляючи нашу державу податків і законної торгівлі. Настав час відповісти. Рішуче.\n\nМи посилимо військову й поліційну присутність на кордоні, заарештовуватимемо відомих ділків, перевірятимемо всі вантажі, що його перетинають, і проводитимемо облави на виявлені сховки. Конфісковані товари продаватимуть або долучатимуть до запасів за потреби. Крім того, розігнавши контрабандистів, ми заохочуватимемо й розвиватимемо натомість законну торгівлю, перетворивши слабкість на силу."

 VYT_white_army_traditions: "Традиції Білої армії"
 VYT_white_army_traditions_desc: "Колись давно Російська армія - добре навчена, надзвичайно дисциплінована й щедро оснащена - була грізним знаряддям війни. Потім почалося гниття. До 1917 року воно зайшло так далеко, що навіть особисте втручання тодішнього царя не змогло її врятувати, а нищівна поразка від комуністичних революціонерів оголила всі її вади. Але її давніша спадщина досі жива.\n\nМи відновимо порядки, завдяки яким імператорські армії колись були великими, і запровадимо суворі правила, щоб не допустити повторення практик, які призвели до невдачі. Ми продовжимо традиції давньої Російської армії, і під цим прапором наші хоробрі солдати підуть уперед та повернуть Батьківщину собі, своїй державі й своєму цареві."

 VYT_our_pride_untarnished: "Незаплямована гордість"
 VYT_our_pride_untarnished_desc: "Попри скромні розміри, царське князівство - один із небагатьох бастіонів цивілізації, миру й стабільності в Росії. На відміну від володінь воєначальників і бандитів довкола нас, наша територія захищена, злочинців карають, а наш уряд складається з освічених людей, які ставлять благо держави вище за власні інтереси. Ми пронесли смолоскип Російської імперії крізь найтемніші дні й вийшли до світла сильними та готовими знову рушити вперед.\n\nМи підготуємося до прийдешніх кампаній, до зусиль із поширення культури й пишноти, які ми створили тут, російської пишноти й культури, серед усіх росіян. Під проводом царя ми є хранителями цієї великої країни й повернемо їй велич!"

 VYT_the_eagle_flies_once_more: "Орел здіймається знов"
 VYT_the_eagle_flies_once_more_desc: "Імперську славу відновлено, і це видно в кожній грані життя нашого князівства. Цар захищає свій народ і пам'ятає про його інтереси, а народ натомість довіряє йому та працює без нарікань. Саме цей зв'язок взаємної віри дає нам силу й забезпечує стабільність наших земель. Але цих земель замало. Росія - величезна країна, і значна її частина лежить розбита й зламана під п'ятою екстремістів, фанатиків і злочинців.\n\nЦар більше не може дивитися на такі страждання свого народу. Доки імперський орел не злетить від німецького кордону до Далекого Сходу, його й наша місія не буде завершена. Наші дисципліновані армії за підтримки відданого населення готові нести царський стяг уперед, і їм потрібен лише наказ виступати.\n\nS nami Bog!"
 
 ### Post-Bombing tree ###
 VYT_climb_from_the_pit: "Видертися з ями"
 VYT_climb_from_the_pit_desc: "Західна Росія, яка десятиліттями потерпає від німецьких бомбардувальників, загалом є краєм беззаконня й слабкої промисловості. На цьому тлі реформи та розвиток Вятки перетворили князівство на своєрідну дивину - безпечне місце з доволі заможною економікою.\n\nАле ми не можемо зупинятися. За нашими кордонами, у законних царських землях, мільйони росіян розчавлені чоботом гноблення й злиднів, і їх треба врятувати. Наші вороги самі рушають це робити, тож ми мусимо вдарити першими.\n\nЧас розмов минув. Імператорську раду скличуть, і вона складе плани наступу. Росію буде здобуто для народу, для царя й для дому Романових!"
 VYT_climb_from_the_pit_tt: "Час навести лад у власному домі."

 VYT_call_the_council: "Скликати раду"
 VYT_call_the_council_desc: "Імператорська рада стала надзвичайно вдалим творінням для царя, дозволяючи делегувати дрібні питання й отримувати поради щодо більших. Але тепер на неї чекає справжнє випробування. Об'єднання вже на обрії, і цареві знадобиться вся можлива допомога.\n\nЦе буде колективне зусилля всієї ради: треба розв'язати питання внутрішньої та зовнішньої політики, а військо необхідно стабілізувати. Такий царський указ, і рада мусить успішно втілити його в життя."

 VYT_put_an_end_to_the_assassinations: "Покласти край убивствам"
 VYT_put_an_end_to_the_assassinations_desc: "Сумна дійсність така: офіцери нашої армії часто ладні перегризти один одному горлянки. Нерідко цілком буквально.\n\nУже не одного старшого офіцера вбив колеґа чи підлеглий, а військові кліки подекуди прикривали цих убивць. Це цілковито неприйнятно.\n\nРада доручить Охрані створити наглядову службу в структурі військового командування, щоб виявляти в ній і кліки, і злочинців та притягати їх до відповідальності. Армія буде, мусить бути єдиною, неподільною й вірною лише Богові та цареві!"

 VYT_reign_in_the_officers: "Приборкати офіцерів"
 VYT_reign_in_the_officers_desc: "Наприкінці свого існування армія Російської імперії не була по-справжньому професійною. Дисципліна була слабкою, відданості бракувало, а офіцерів мало що спонукало, окрім власного просування. Багато наших нинішніх офіцерів вийшли з цієї «традиції» й, на жаль, принесли її із собою. Якщо цар має повернути Росію, не можна дозволити цьому тривати.\n\nРада видасть директиви, щоб покласти край найгіршим проявам безладу, а офіцерів, у яких побачать реформаторів, підвищать. Армія, від рядового до генерала, підкориться порядкові й діятиме як єдине ціле, інакше на неї чекає відповідна кара!"

 VYT_the_tsars_authority: "Влада імператора"
 VYT_the_tsars_authority_desc: "Від самого прибуття до Вятки цар фактично правив князівством як диктатор. Певний час це працювало, але заклики до реформ і демократії дедалі посилювалися, і цар дослухався. Утім, усьому свій час і місце, а нині, коли на обрії війна, час для демократії ще не настав.\n\nРада видасть директиви, що чітко дадуть зрозуміти: політична реформа наближається й неодмінно відбудеться, проте лише після закріплення контролю над регіоном та централізації царського уряду."

 VYT_meet_with_the_leaders: "Зустрітися з лідерами"
 VYT_meet_with_the_leaders_desc: "Еміґрантський рух ніколи не мав єдиного бачення відновленої Росії. Хоча всі визнають цінність монархії, кожен по-своєму бачить її форму, і ці розбіжності в деяких прикрих випадках призводили до насильства. Це неприйнятно.\n\nУсі ми росіяни, які прагнуть однієї мети, тож рада разом із царем організує запрошення лідерів кожної фракції до палацу так, щоб не спровокувати подальшого конфлікту чи підозр щодо чужих намірів. Цар чітко викладе свої плани й вимоги та цим стабілізує нашу політичну ситуацію перед майбутніми завоюваннями."

 VYT_an_uneasy_peace: "Крихкий мир"
 VYT_an_uneasy_peace_desc: "Зусиллями царя та Імператорської ради у князівстві вдалося встановити мир, принаймні поки що. Протилежні політичні фракції поводяться одна з одною хоча б чемно, а військо позбулося значної частини колишнього безладу й неефективності.\n\nАле ми не повинні заспокоюватися. Розбіжності й далі існують під поверхнею, і з часом нам доведеться з ними розібратися. Проте наразі всі єдині в підтримці наших цілей: і закріпити контроль над регіоном, і створити основу для справжнього поширення царської влади на всю Росію. Цього мусить вистачити, принаймні поки що."

 VYT_the_imperial_russian_army: "Російська імператорська армія"
 VYT_the_imperial_russian_army_desc: "Росія має давню й славетну військову традицію боротьби, успіхів і далекоглядного командування. На жаль, проте, ані військо пізньої імперії, ані наше власне не можна назвати гідним цієї спадщини. Наші солдати погано навчені, спорядження застаріле, доктрина негнучка, а підрозділів забезпечення майже немає.\n\nЯкщо ми хочемо поширити свій вплив на довколишні дрібні держави, не кажучи вже про всю Росію, цьому треба зарадити. Ми визначимо послідовну доктрину, поліпшимо навчальні програми й укріпимо ключові ділянки. Так ми матимемо міцну основу для початку зовнішніх кампаній."

 VYT_defence_plan_kutuzov: "План оборони «Кутузов»"
 VYT_defence_plan_kutuzov_desc: "Міхаіл Кутузов був одним із найвидатніших російських генералів. Його оборонні дії під час Наполеонового вторгнення стали леґендою, призвівши до майже цілковитого знищення армії, яку спочатку вважали значно сильнішою за його власну. Щоб захистити нашу територію від нападу, поки наша армія буде в поході, ми мусимо підготувати належну оборону.\n\nТож буде ухвалено План оборони «Кутузов», а вздовж наших кордонів збудують низку укріплень, нехай і простих. Якщо на нас нападуть у мить слабкості, вони дадуть достатньо часу, щоб належно відповісти."
 #VYT_defence_plan_kutuzov_tt: "We will begin construction."

 VYT_the_vyatka_general_staff_academy: "Вятська академія Генерального штабу"
 VYT_the_vyatka_general_staff_academy_desc: "Не таємниця, що майже цілковитий провал і самого командування, і підготовки командирів скалічив Російську армію у Великій війні. На жаль, надто багато наших офіцерів здобули свої «навички» в тій системі або ж просувалися взагалі без жодної системи, а отже, загрожують ефективності нашої власної армії. Ми вживемо заходів, щоб це виправити.\n\nСпівпрацюючи і з досвідченими старшими, і з новаторськими молодшими офіцерами, ми розробимо навчальну програму для нашого офіцерського корпусу й зробимо її проходження обов'язковим для офіцерів усіх звань. З часом випускники Вятської академії Генерального штабу заживуть слави одних із найкомпетентніших офіцерів усієї Росії!"

 VYT_lessons_from_the_past: "Уроки минулого"
 VYT_lessons_from_the_past_desc: "Невдач російської держави у Великій війні було безліч. Командування, бойовий дух, доктрина й багато іншого були слабкими. І все ж за певних обставин, коли армії застосовували належним чином, вони досягали великих успіхів проти ворогів. Невдачі були наслідком виконання, а не засад.\n\nНам не потрібно перебудовувати весь наш підхід. Перевірені часом російські підходи до війни й далі дієві. Їм потрібні лише незначна модернізація та оптимізація, щоб повернути повну ефективність і таким чином привести нас до перемоги."

 VYT_strength_in_numbers: "Сила в чисельності"
 VYT_strength_in_numbers_desc: "У воєнний час Росія завжди покладалася на своє численне, переважно землеробське населення. Із сильних, витривалих чоловіків виходять сильні, витривалі солдати, готові виконувати накази й хоробро наступати під вогнем.\n\nЦілком природно й далі використовувати цю перевагу. Звісно, доба масових піхотних атак давно минула, проте чисельна перевага відкриває безліч стратегічних і тактичних можливостей, інакше недоступних.\n\nТому майбутня Російська армія буде настільки великою, наскільки це розумно, здатною вести масштабні наступи на широких фронтах. Так вона цілковито придушить наших ворогів і понесе царський стяг уперед, до перемоги!"

 VYT_a_new_age_of_war: "Війна нової доби"
 VYT_a_new_age_of_war_desc: "Дії російських армій у Великій війні, Другій світовій війні та Західноросійській війні недвозначно показали: наші попередні підходи до війни застаріли. Ми мусимо пристосуватися.\n\nМи приборкаємо гордість, подолаємо спротив старших офіцерів і вивчатимемо тактику, стратегію та підходи американців, британців, японців і, так, німців. Часи й війна змінилися, і ми змінимося разом із ними.\n\nІз сучасними підходами до одвічних проблем ми принаймні станемо нарівні з нашими ворогами, що дозволить іншим нашим перевагам привести нас до перемоги."

 VYT_imperial_commandos: "Імперські командос"
 VYT_imperial_commandos_desc: "Сучасна війна неодноразово доводила цінність спеціяльних, добре навчених солдатських формувань, призначених для конкретних завдань. Наші офіцери чітко заявили, що, на їхню думку, створення власних таких формувань надзвичайно допомогло б у прийдешніх кампаніях, і ми не маємо підстав їм не вірити.\n\nТому ми вивчимо структуру й доктрину іноземних підрозділів спеціяльного призначення, за потреби пристосуємо їх до наших умов і застосуємо у формуваннях із мотивованих та досвідчених добровольців. Наші вороги не очікуватимуть зустріти імперських гірських стрільців, морських піхотинців чи десантників, і ця несподіванка дозволить нам здобути перемогу ще швидше."
 VYT_create_unit_airborne_tt: "§YЕлітний підрозділ командос з'явиться у Вятці або поблизу неї.§!\n"

 VYT_russias_finest: "Найкращі в Росії"
 VYT_russias_finest_desc: "Під час першої інспекції царське військо було в справді жалюгідному стані. Застаріла підготовка, плутані доктрини, слабке командування й брак належних об'єктів серйозно заважали його ефективності в боях. Але все змінилося.\n\nНаші реформи майже цілковито змінили і сприйняття, і справжні можливості війська. Наші солдати тепер марширують дисциплінованими лавами, ними опікуються вправні, мотивовані й новаторські офіцери, а самі вони пишаються і своєю країною, і своїм царем. Справді, це найкращі люди всієї Росії.\n\nДо Сибіру далеко, і на шляху буде чимало випробувань, але Імператорська армія тепер готова зустріти їх настільки, наскільки це взагалі можливо."

 VYT_begin_the_reclamation: "Час повертати землі"
 VYT_begin_the_reclamation_desc: "Держава готова.\n\nПолітичної стабільності досягнуто, принаймні тимчасово. Військо стабілізовано, модернізовано й підготовлено до походу. Ми готові настільки, наскільки можемо бути.\n\nШлях повернення буде довгим і важким. На нас чекає тяжка боротьба і на полі бою, і поза ним. Кожного росіянина буде випробувано, і знадобляться всі його мужність, сила й віра, щоб не схибити.\n\nУтім, зрештою ми переможемо. Росія лише одна, так само як є лише один законний спадкоємець її спадщини. Пам'ятаючи про це, ми не можемо не перемогти врешті-решт.\n\nУсі дивляться на царя, чекаючи миті, коли він накаже виступати. S nami Bog!"
 VYT_begin_the_reclamation_tt: "Ми почнемо об'єднання земель, що належать нам по праву!"
 
 #Smuta Tree
 VYT_the_imperial_march: "Імперський марш"
 VYT_the_imperial_march_desc: "Умови в тилу нарешті достатньо стабілізувалися, тож тепер ми можемо звернутися до важливішої справи - об'єднання. Готуючись до прийдешніх воєн, Його Величність особисто відвідає в супроводі своїх генералів найвеличніший військовий парад із усіх, що ми досі проводили.\n\nМи не пошкодуємо коштів, щоб це повернення імперської влади до західної частини Росії запам'яталося всім, адже воно ознаменує повернення до влади законних спадкоємців Російської імперії. Якщо ми хочемо успіху, мусимо показати силу й рішучість, а перший крок - твердо переконати наш народ, що ми є тією силою, яка здатна об'єднати росіян - від західних околиць Росії до Далекого Сходу."

 VYT_define_the_enemy: "Визначити ворога"
 VYT_define_the_enemy_desc: "Наші вороги хотіли б переконати людей, що в наших очах усі становлять загрозу. Що ми нікого не розрізняємо. Що ми просто стріляємо на ураження. Ці твердження далекі від правди. Ми точно знаємо, хто наші вороги.\n\nЦе большевицькі рештки на півночі, нацистська загроза на сході, заблукалі воєначальники на заході й німецькі посіпаки на півдні. Натомість людей, які живуть у їхніх землях, ми прагнемо захистити й показати їм, що ми кращі. Його Величність це проголосив, і так буде. Народ Вятки заслуговує на спокій, знаючи, що ми не скривдимо його співвітчизників, які не ототожнюють себе з гнобителями."

 VYT_to_restore_our_glory: "Відродити нашу славу"
 VYT_to_restore_our_glory_desc: "Комуністи вирвали Росію з-під влади монархії й, безперечно, зруйнували її ґрунтовніше, ніж навіть німці, коли штурмували Москву й Пєтроґрад. Хіба не комуністи дозволили настільки ослабити Росію? Більше не буде місця слабкій Росії, у цьому ми присягаємося, і ми зробимо те, що мали зробити давним-давно. Щоб відвести Росію від прірви, треба відновити імперію, і насамперед ми мусимо докласти зусиль, щоб ця істина вкоренилася в межах нашої держави.\n\nДержавні медії, журналісти, радіопередачі - все буде використано для поширення цього послання, адже наші вороги неодмінно намагатимуться його підважити. Наш народ мусить його зрозуміти, перш ніж ми підемо на війну - або заговорять ворожі гармати."

 VYT_visits_to_the_front: "Відвідини фронту"
 VYT_visits_to_the_front_desc: "Покійний Ніколай II краще за більшість монархів Першої світової війни розумів важливість бойового духу військ.\n\nХоча він робив усе можливе, бажаного результату йому, на жаль, досягти так і не вдалося - але Владімір III неодмінно досягне. Ми організуємо відвідини фронтів, де б'ються наші солдати, й покажемо їм, що їхній імператор не ховається в палаці, а особисто проводжає їх; говорить із ними перед виступом і додає наснаги там, де її вкрай бракує. Звичайно, зусиллями Охрани ми забезпечимо безпеку Його Величності в кожній поїздці, адже наші вороги неодмінно чекатимуть нагоди вдарити."

 VYT_authorize_the_imperial_tribunals: "Уповноважити імперські трибунали"
 VYT_authorize_the_imperial_tribunals_desc: "З кожною перемогою ми здобуваємо більше території, а разом із цим захоплюємо дедалі більше ворожих офіцерів та урядовців. Це ставить перед нами питання: що з ними робити?\n\nМожна просто їх розстріляти, але користі в цьому небагато. Натомість ми судитимемо їх за їхні злочини й відокремимо тих, хто ще може виправитися, від тих, хто отримає справедливу кару.\n\nДля цього Владімір III дозволить скликати спеціяльний трибунал, який наглядатиме за судами над нашими ворогами й винесенням вироків. Кожного його члена особисто оберуть із наших найкращих законодавців, що нині служать в уряді, і їм нададуть досьє на кожного, хто постане в їхній залі."

 VYT_the_emperors_mercy: "Милість імператора"
 VYT_the_emperors_mercy_desc: "Трибунал створено, і тепер ми віч-на-віч із реаліями нашого становища: треба вирішити, що має робити Його Величність, якщо взагалі має втручатися. Яку позицію займе імператор і як спрямує трибунал?\n\nЗвісно, більшості з них ми дамо можливість пояснити свої вчинки, а трибуналові й імператорові - вислухати їх. Зрештою, принаймні деякі з тих, хто постане перед ними, є жертвами обставин, і це слід врахувати. Адже імператор - милосердна людина, і слушно буде поставити цю вдумливість та увагу до обставин на перше місце в будь-якому рішенні, якщо людина на них заслуговує."

 VYT_the_emperors_neutrality: "Нейтралітет імператора"
 VYT_the_emperors_neutrality_desc: "Трибунал створено, і тепер ми віч-на-віч із реаліями нашого становища: треба вирішити, що має робити Його Величність, якщо взагалі має втручатися. Яку позицію займе імператор і як спрямує трибунал?\n\nХоча праведний осуд чи милосердне помилування імператора могли б вирішити долі багатьох, ми вирішили забезпечити цим людям справедливий суд перед справді неупередженим трибуналом. Тому імператор не втручатиметься в його наради після кожного процесу й прийме винесене рішення як чесне та справедливе."

 VYT_the_emperors_judgement: "Вирок імператора"
 VYT_the_emperors_judgement_desc: "Трибунал створено, і тепер ми віч-на-віч із реаліями нашого становища: треба вирішити, що має робити Його Величність, якщо взагалі має втручатися. Яку позицію займе імператор і як спрямує трибунал?\n\nДеякі з цих людей не були винні в конкретних злочинах, але так чи інакше були відповідальні за доведення Росії до нинішнього стану. Ті, хто ще може виправитися, отримають порятунок, але решта, що знищила російську націю, звісно ж, отримає лише заслужене. Якщо трибунал розм'якне, якщо відчує співчуття до когось із цих людей, імператор швидко нагадає йому про обов'язок перед імперією."

 VYT_all_shall_face_justice: "Усі постануть перед судом"
 VYT_all_shall_face_justice_desc: "Тепер, коли імператор чітко висловив свою позицію й погляди, ми підійшли до важливого питання: кого взагалі допускати до суду. Одні в нашому уряді висловили занепокоєння, що судовий процес може леґітимізувати декого з полонених, інші ж доводили, що чесний і справедливий суд для кожного необхідний, аби леґітимізувати нас самих в очах народу.\n\nВинні чи невинні - для тих, хто не заслуговує на нашу увагу, це навряд чи мало б значення, адже в будь-якому разі вироки й покарання їм визначатимуть упорядковано. Від очільників цих зрадницьких державок до офіцерів найнижчого рангу - усі постануть перед справедливим судом трибуналу, під наглядом Його Величності, який буде задоволений, знаючи, що справедливість здійсниться."

 VYT_preemptive_sentences: "Превентивні вироки"
 VYT_preemptive_sentences_desc: "Сумна правда полягає в тому, що дехто з наших полонених становив би загрозу на лаві підсудних, і саме з ними треба розібратися найперше, ще до того, як вони постануть перед трибуналом. Ми визначимо таких людей і спрямуємо до них Охрану, а вона подбає про порушників спокою. Не можна судити людину, яку задушили інші в'язні, чи того, хто став жертвою хвороби, про яку ніхто не знав. Хоч би яка нещаслива доля спіткала цих людей, вони ніколи не постануть перед судом, бо їхні злочини були надто тяжкими й загрожували б стабільності самої держави."

 VYT_cleanse_the_socialist_rot: "Викорінити соціялістичну гниль"
 VYT_cleanse_the_socialist_rot_desc: "Соціялісти вбили Ніколая II, розірвали імперію, а їхнім останнім провалом стало те, що вони піднесли п'яту частину Росії німецькому орлові на срібній таці, а решту чотири п'ятих розбили на зграю воєначальників, які гризуться між собою. Цю гниль, яка й далі заражає Росію, треба негайно вирізати, якщо ми хочемо об'єднати решту країни!\n\nУ новинах, по радіо й за допомогою пропаґанди ми демонізуватимемо комуністичну справу разом із їхньою Жовтневою революцією та зведемо їхню отруйну ідеологію в могилу. Вони не зможуть затягнути нас іще глибше в бездонну прірву, якщо більше не існуватимуть, а головне - не зможуть відновитися, якщо ми досягнемо цієї мети."

 VYT_an_economy_tuned_for_war: "Економіка на воєнних рейках"
 VYT_an_economy_tuned_for_war_desc: "Ми насолодилися тим миром, який лише був можливий за наших обставин, і за це маємо бути вдячні. Але тепер, коли настав час об'єднання західних земель Росії, ми мусимо звернутися до справ державної ваги - тобто до війни.\n\nНаша економіка має перейти від цивільної до більш воєнізованої - і швидко. Нам потрібні люди, потрібні робітники, потрібні солдати, потрібно, щоб усі розуміли: затишок і безпека не повернуться, доки ми не виграємо нашу війну. Забезпечити готовність країни до цього - вирішальний крок, щоб завершити цей перехід якомога плавніше й швидше."

 VYT_replenish_the_soldiers: "Озброїти солдатів"
 VYT_replenish_the_soldiers_desc: "Так, війни виграють стратегією, а ще їх виграють логістикою. Але ані стратегія, ані логістика нічого не важать, якщо армії бракує чистої, невпинної й нестримної вогневої міці.\n\nЩоб підтримувати нинішні операції, нам треба озброїти кожного солдата на передовій тим, що нам так відчайдушно потрібне: рушницями, артилерією й боєприпасами. Наша стратегія зосередиться на задоволенні цих основних потреб, і для цього ми мусимо розширити можливості виробництва озброєнь, щоб дати нашим солдатам якнайбільше. Якщо в них закінчиться спорядження, ми програємо війну - і програємо швидко."

 VYT_supply_the_fronts: "Забезпечити фронти"
 VYT_supply_the_fronts_desc: "Нове спорядження для солдатів - добра річ, як і думка, що кожен солдат може тримати в руках рушницю. На жаль, це не реальність війни в російській анархії.\n\nЯкщо наші солдати не отримуватимуть нічого, навіть основних припасів, тоді ми справді й остаточно програли війну. Перш ніж плекати думку про рушницю в руках кожного, ми мусимо насамперед задовольнити свої логістичні потреби. Жодна армія не може йти в похід на порожній шлунок, і жодна армія не може воювати без спорядження. Ми перевіримо залізниці й дороги, що ведуть до передової; визначимо найкращі місця для спорудження опорних пунктів, аби припаси й далі надходили на фронт. Зрештою, перевага за тим, у кого краща логістика."

 VYT_give_more_for_the_emperor: "Більше для імператора!"
 VYT_give_more_for_the_emperor_desc: "Можливо, ми вже обклали народ чималими податками, але мусимо зробити більше! Жодна війна не обходиться без ризиків і наслідків, проте для нашої перемоги Його Величності потрібне все, що тільки можна дати. Більше збройових заводів, більше робітників, більше уваги воєнним зусиллям - усе, щоб ми змогли вільно зітхнути, коли війни нарешті скінчаться. Так, вимоги суворі, але це триватиме вже недовго.\n\nНам потрібно лише трохи більше часу, рівно стільки, щоб нарешті здобути перемогу; завдати останнього удару в саме серце ворога й прорвати його лави. Ось про що ми просимо. Нам потрібно більше, щоб ми змогли дати ще більше, коли все буде завершено."

 VYT_wisdom_from_failures: "Мудрість поразок"
 VYT_wisdom_from_failures_desc: "У кожній поразці лежить зерно майбутньої перемоги. Поки Росія сповзає в бездонну яму, ми вдивляємося в її минуле й визначаємо, що пішло не так і чого ніколи не слід повторювати, щоб уникнути тієї самої долі. Від нашої поразки в Жовтневій революції до розгрому совєтів у війні проти Німеччини та їхньої зрештою марної спроби визволення в Західноросійській війні - ми вчитимемося й пристосовуватимемося.\n\nЧаси змінюються, і ми теж мусимо, бо поразок у нас надто багато. Ще одна невдача - і ми станемо предметом чужого аналізу того, чого не слід робити. Краще витратити дні на визначення свого шляху, ніж ціле життя шкодувати про брак мудрості - якщо ми взагалі залишимося живі."

 VYT_an_army_of_virtue: "Армія чеснот"
 VYT_an_army_of_virtue_desc: "Гордість Вятки - наша армія, і що ж за армія в нас! Його Величність справді благословенний, адже має настільки дисциплінованих людей, чий дух і бойову наснагу ніхто не зламає. Генеральські серця спокійні: вони знають, що наші вояки професійні, віддані, компетентні й беззаперечно виконують свої обов'язки.\n\nУся імперія пишається їхнім співчуттям, умінням виявляти милосердя, коли це доречно й потрібно, готовністю дотримуватися належних правил бою та хоробрістю перед жорстокістю, що не поступалася жорстокості тевтонського гнобителя далі на заході.\n\nНехай народ знає про їхні чесноти, щоб усюди зустрічати їх із розкритими обіймами як визволителів."

 VYT_an_army_of_vengeance: "Армія помсти"
 VYT_an_army_of_vengeance_desc: "Спадщина Романових - це кров, пролита за справи, які Бог оголосив справедливими. Тепер наше військо мусить прийняти цю спадщину й отримати настанови, як найкраще нею скористатися.\n\nРоками наші вороги намагалися нас здолати: від ранніх днів династії Романових до Жовтневої революції й тепер, у роздертій війною Росії. Наші сили стоятимуть непохитно, і на будь-яку аґресію проти нас вороги отримають удесятеро сильнішу відповідь. Милосердя не буде, бо вони не виявили б його до нас. Вони вважають нас надто слабкими, щоб забруднити руки, - ми покажемо їм безглуздість цієї думки, коли наші руки заплямує їхня кров."

 VYT_the_imperial_rail_system: "Імперська залізнична система"
 VYT_the_imperial_rail_system_desc: "Сказати, що наші залізниці не в доброму стані, - означає заплющувати очі на очевидне применшення. Значну частину залізничної мережі держави пошкодили німецькі бомбардувальники, а ще більша частина залишається занедбаною від самого початкового вторгнення. Щоб вести будь-яку війну, оборонну чи іншу, ми мусимо відбудувати зруйноване, починаючи з колій. Із благословення імператора буде створено спеціяльну організацію для подолання цієї проблеми й відновлення робочого стану залізниць, а за достатнього часу - навіть їхньої модернізації."

 VYT_let_the_past_fade: "Нехай минуле згасне"
 VYT_let_the_past_fade_desc: "Монархія перемогла свого найбільшого ворога, можливо, востаннє. Комуністів розбито, їхня ідеологія лежить у руїнах, тож час повернутися до нашої початкової мети й збудувати гідну Російську імперію. Зациклення на ідеології, за якої Росію було знищено, не послужить нікому, а подальше зосередження на ній лише розділятиме наших співвітчизників і налаштовуватиме їх одне проти одного в гарячих дискусіях та суперечках. Ні, якщо ми просто триматимемося курсу й вважатимемо їх черговим ворогом, із яким ми впоралися, то задушимо жар соціялізму значно краще, ніж власними спробами залити вогонь.\n\nТі, хто хоче стати мучениками за справу, мусять звеличити себе випробуванням вогнем. Таких людей найкраще долає забуття, і коли вони стануть лише спогадом, наша остаточна перемога над соціялізмом буде завершена."

 VYT_bind_them_through_memory: "Єдність через пам'ять"
 VYT_bind_them_through_memory_desc: "Механізм війни поволі зупиняється, і ми знову звертаємося до внутрішньої політики. Численні фракції й політичні сили довкола імператора знову починають чубитися, і ми повертаємося до колишнього стану. Сподіватися на тривалий мир було нерозумно, але ми ще можемо продовжити його бодай трохи. Ми роздмухаємо жар ненависті, перебільшимо загрозу внутрішнього ворога, викличемо тінь Лєніна - усе, щоб згуртувати найближче царське оточення для останнього удару по комуністах. Кого обходить, що вони не можуть дати відсіч? Їхня ідеологія ще востаннє послужить нашим інтересам із могили.\n\nБо царі минулого всміхаються нам із небес, а Лєнін плаче."

 VYT_the_empire_strikes_back: "Імперія завдає удару у відповідь"
 VYT_the_empire_strikes_back_desc: "Уперше від 1917 року Романов знову контролює значну частину Батьківщини. Ми пройшли довгий шлях від скромного початку у Вятці й далі прагнутимемо повного об'єднання країни, яка лежить під владою тих, із ким ми ще не зустрічалися.\n\nПоки що Західна Росія стане нашим новим осердям, осяйним феніксом, що постає з попелу, щоб відродити імперію, нашу імперію - імперію Його Величності, імператора Владіміра III. Тепер нам потрібно лише зосередитися на тому, яким шляхом піде ця нова Росія, а для цього знову звернути увагу всередину.\n\nХай там як, це була справжня перемога не лише для нас - а й для Росії загалом."
 
