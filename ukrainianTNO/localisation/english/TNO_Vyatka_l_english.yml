 ##=====| Superregional Trees |=====##
 #####################################

 ### Solidarist tree ###
 VYT_the_solidarist_revolution: "Солідаристська революція"
 VYT_the_solidarist_revolution_desc: "Наша перемога на Волоґодському конґресі й призначення нашого лідера Алєксандра Солженіцина першим прем'єр-міністром держави нарешті дозволили нашим переконанням стати державною політикою.\n\nНевдовзі ми представимо нашу програму народові Росії та підготуємо інформаційну кампанію, яка забезпечить її підтримку. Ми призначатимемо і власних, і прихильних до нас посадовців на впливові посади, щоб інші фракції в державі не намагалися чинити перешкоди.\n\nСправді, настав світанок великої доби."

 VYT_zemskaya_democracy: "Земська демократія"
 VYT_zemskaya_democracy_desc: "«Земства», систему губернських зібрань, створену за старої імперії, багато хто вважав неефективними й недоречними. Проте вони розв'язували чимало місцевих проблем, тож і далі можуть бути дієвими - якщо запровадити реформи.\n\nТому ми відновимо земства по всій імперії й дозволимо вільно обирати до них усіх, хто не має антимонархічних симпатій. Крім того, систему буде поширено на загальнодержавний рівень, що дозволить створити національний законодавчий орган, який діятиме відповідно до конституції під головуванням царя."

 VYT_lessons_from_stolypin: "Уроки Столипіна"
 VYT_lessons_from_stolypin_desc: "Пьотр Столипін, прем'єр-міністр старої імперії, досі відомий реформами, які запровадив у Думі, тодішньому законодавчому органі. Змінивши виборчі закони й таким чином зменшивши виборчу вагу певних класів, він зробив Думу відданою програмі уряду, а отже, й царя. Ми можемо наслідувати цей приклад.\n\nЗмінивши невеликі частини наших власних виборчих законів, ми можемо забезпечити законодавчу підтримку солідаристської програми, водночас зберігаючи демократію як загальний інститут. Просто тепер вона буде дещо «правильнішою» демократією."

 VYT_the_political_integration_of_the_military: "Політична інтеграція війська"
 VYT_the_political_integration_of_the_military_desc: "Для захисту загальної стабільності й цілісності держави вкрай важливо забезпечити їй підтримку війська. Багато найвищих посад у нашому війську обіймають люди, яких ми не вважаємо прихильниками солідаристського руху, і це треба виправити.\n\nТому ми сприятимемо відставці багатьох із цих старших офіцерів, водночас підтримуючи кандидатури відомих членів або прихильників солідаристського руху їм на заміну. Так буде забезпечено політичну надійність війська щодо нашого руху й уряду, що не дозволить іншим фракціям намагатися дестабілізувати державу."

 VYT_the_principles_of_dirigisme: "Принципи дирижизму"
 VYT_the_principles_of_dirigisme_desc: "Хоча всі без винятку комуністичні заходи цілковито нездійсненні в будь-якій раціонально організованій сучасній економіці, це не означає, що державна участь в економічних справах має бути зовсім відсутня. Реґулювання й тверде спрямування чинників розвитку критично важливі для збереження стабільності, і ми подбаємо про їх підтримання.\n\nРозробивши й утіливши цю політику «дирижизму», ми забезпечимо, щоб наша економіка, вільна від задушливого втручання й здатна реагувати на ринкові чинники, водночас рухалася в напрямку, що відповідає інтересам держави та нашого уряду."

 VYT_the_guiding_strata: "Провідна верства"
 VYT_the_guiding_strata_desc: "У ці важкі часи Росії потрібен сильний і здібний провід, спроможний швидко ухвалювати рішення. Застосувавши суворі принципи класової координації, на яких було засновано солідаристський рух, ми можемо дати їй такий провід.\n\nСтворивши жорстку, але ретельно визначену ієрархію у виконавчій владі, урядовій бюрократії та війську, ми забезпечимо здатність держави належно реагувати на будь-яку ситуацію. Хоча це, звісно, зменшить безпосередню політичну участь деяких верств, коли широкий загал побачить мудрість цієї політики, він неодмінно зрозуміє й прийме її."

 VYT_the_spiritual_restoration: "Духовне відродження"
 VYT_the_spiritual_restoration_desc: "Хоча об'єднати Росію під сильною й централізованою імперською владою було важко, ту війну ми виграли. Проте тепер мусимо здобути перемогу й у мирі, а наш уряд усвідомив, що чимало людей у державі або відкрито не схвалюють нашої влади, або байдужі до неї. Це мусить змінитися й зміниться.\n\nМи здійснимо цю зміну, нагадавши російському народові про його традиційні моральні й суспільні цінності. Громада, родина, вірність і наполеглива праця - усі засади солідаризму - це чесноти, які колись визначали російський народ і єднали його в одне ціле. За належних кампаній вони ще можуть зробити це знову."

 VYT_the_russian_question: "Російське питання"
 VYT_the_russian_question_desc: "Великою Росією колись називали осердя старої імперії, яке простягалося від Санкт-Пєтєрбурґа до України й забезпечувало значну частину промислової та сільськогосподарської продукції тодішньої держави. Нині цю землю окупував і систематично гнобить Райх. Хоча ми ще не маємо засобів повернути її, це не означає, що маємо сидіти без діла.\n\nРозповідаючи нашому народові про тяжку долю його братів і сестер за кордоном, ми розпалюватимемо в ньому почуття належного солідаристського націоналізму й так зміцнюватимемо підтримку майбутніх воєн."

 VYT_the_moral_purification: "Моральне очищення"
 VYT_the_moral_purification_desc: "Десятиліття комуністичної влади, совєцької чи іншої, залишили в серцях і думках російського народу ракову пухлину революційних ідеалів. Ми мусимо її вирізати й так знищити отруйне мислення, яке колись знищило цю країну.\n\nЗвернувшись до численних відомих колишніх комуністів і революціонерів у наших в'язницях та запропонувавши їм амністію в обмін на публічне зречення, ми покажемо і милосердя нашого уряду, і легкість, із якою можна відмовитися від таких ідеалів. Супроводивши це належною пропаґандистською кампанією та підкріпивши повним знищенням будь-якої літератури чи предметів потенційно комуністичного характеру, ми невдовзі викорінимо цю мерзоту з наших земель."

 VYT_the_reinvigorated_sobornost: "Відроджена соборність"
 VYT_the_reinvigorated_sobornost_desc: "Соборність - давнє поняття, що описує спільну духовну громаду живих росіян. Воно наголошувало на потребі співпраці між усіма слов'янськими народами Росії задля взаємної користі. І коли стільки з них живе під гнітом, у німецьких землях чи деінде, ця потреба співпраці не могла б бути гострішою.\n\nМи підтримаємо цю політику й включимо її до соціальної та економічної політики нашого уряду. Так ми тісніше згуртуємо нашу країну й підготуємо її до часу, коли вона зможе прийняти й неодмінно прийме всіх своїх братів і сестер назад додому."

 VYT_our_august_leader: "Наш августійший цар"
 VYT_our_august_leader_desc: "За старої імперії царська воля була абсолютною. Це давало цареві великі можливості перетворювати Росію, але також дозволяло надзвичайно легко зловживати своїм становищем, викликати народну ворожнечу й зрештою породити ракову пухлину комунізму. Ці спогади досі живуть серед деяких наших громадян, послаблюючи підтримку царя, а отже, й нашого уряду.\n\nЩоб протидіяти цьому, ми сприятимемо переосмисленню ролі й становища царя. Його мають сприймати й сприйматимуть як утілення національної колективної волі та непохитного оборонця Імперської конституції. Ми чітко дамо зрозуміти: на різку противагу старій імперії цар нової послуговується своєю божественною владою заради блага народу й свого уряду, а не власного."
 
 VYT_reconquest_of_the_urals: "Відвоювання Уралу"
 VYT_reconquest_of_the_urals_desc: "Землі довкола Уралу століттями були складовими імперії, і коротке переривання нашого права на владу комуністами, німцями та іншими дрібними державами нічого не важить. Це російські землі, заселені росіянами, які волають про визволення справжніми росіянами. І ми відповімо.\n\nМи чітко дамо зрозуміти «правителям» цих земель, що вони підкоряться імперській владі й передадуть світське управління ними царському урядові. Так ми принесемо цим мільйонам росіян освічене врядування, на яке вони заслуговують.\n\nА якщо бандити відмовляться, з ними розправляться якнайсуворіше."
 
 VYT_optimal_assistance: "Оптимальна допомога"
 VYT_optimal_assistance_desc: "Хоча Урал є критично важливим проходом між окремими частинами нашої імперії, він давно занедбаний і слаборозвинений. Наші громадяни, які живуть там, поколіннями були забуті центральним урядом і виживали як могли. У сучасну добу такий спосіб виживання більше не життєздатний.\n\nМи принесемо на Урал промисловість і поставимо перед його мешканцями завдання долучитися до неї. Завдяки притаманним росіянам стійкості й наполегливій праці та невеликій допомозі менш спроможним ми приведемо цих наших братів і сестер до сучасної Росії."
 
 VYT_political_investigation_campaign: "Кампанія політичних перевірок"
 VYT_political_investigation_campaign_desc: "Попри численні зусилля протилежного спрямування, у багатьох наших містах і територіях досі залишаються політичні інакодумці з розлогої мозаїки дрібних держав, завойованих нашими силами. Хоча більшість із них нині не створює проблем, це може швидко змінитися, і ми не дозволимо небезпечним ідеологіям зберігати основу для розбудови в разі зміни внутрішніх обставин.\n\nВідповідно, Охрані нададуть повну свободу розслідувати, виявляти, розшукувати, заарештовувати й усувати ці ідеології, забезпечивши, щоб після завершення залишилися лише політичні доктрини, нині представлені в нашому уряді."

 VYT_groundwork_for_the_new_russia: "Підвалини нової Росії"
 VYT_groundwork_for_the_new_russia_desc: "Створювати цілком нову політичну інфраструктуру, як ми вже не раз робили, завжди важко. Треба встановити ієрархії, закріпити юрисдикції, створити правила й знайти людей. Ніде це не помітно так виразно, як у наших власних зусиллях сформувати національний уряд під владою царя й закріпити в ньому принципи солідаризму.\n\nХоча, на відміну від багатьох новоздобутих територій, конституція може обмежувати наші дії на загальнодержавному рівні, ми все одно можемо працювати заради наших цілей. Належні кандидати на впливових посадах, просування потрібних законопроєктів і панування наших прихильників у потрібних комітетах - усе це сприятиме закладанню основ нової Росії. Такої, де ми будемо на чолі."

 VYT_rebuilding_russia: "Відбудова Росії"
 VYT_rebuilding_russia_desc: "Навіть після всього зробленого нами в політичній, економічній і військовій сферах зрозуміло: Росія, скута стількома роками конфліктів і спустошення, просто не може зрівнятися з великими світовими державами, хоча має і населення, і ресурсну базу, щоб бути однією з них.\n\nТа попри це наші перспективи багатообіцяльні. Політична стабільність невпинно зростає. Наша промислова база стрімко розвивається. Наші навчальні заклади випускають більше науковців, інженерів і лікарів. Наше військо розширюється й стає дедалі професійнішим. А якість життя звичайних росіян, усіх цих мільйонів, вища, ніж будь-коли за останні десятиліття. Імперський прапор високо майорить над Вяткою та імперією.\n\nІ одного дня він майорітиме й над Москвою."

 ### Kadet tree ###
 VYT_for_the_benefit_of_the_motherland: "На благо Батьківщини"
 VYT_for_the_benefit_of_the_motherland_desc: "Для всіх народів імперії настав новий день.\n\nЗ нашою перемогою на конґресі й утвердженням контролю нашого уряду над усім регіоном тепер ми можемо звернути увагу на реформи, яких він відчайдушно потребує.\n\nТепер можна розв'язати численні проблеми, що такою мірою спричинили нерівність і несправедливість старої імперії, а отже, безпосередньо привели до повстань і революцій, які поклали їй край.\n\nМи можемо й будемо зосереджуватися на корупції, економічному занепаді, бідності й правах численних меншин у наших кордонах, і так зробимо Росію рівноправнішою та справедливішою країною."
 
 VYT_do_not_forget_the_poor_man: "Не забудемо про бідних..."
 VYT_do_not_forget_the_poor_man_desc: "У наших щойно об'єднаних землях живуть мільйони росіян, які страждали під режимами, байдужими і до їхнього добробуту, і до їхніх страждань. Які до того ж бачили, як роки німецьких бомбардувань знищували їхні мізерні статки. Ми більше не можемо терпіти такого становища.\n\nЗаради всього нашого народу й щоб подати приклад тим, кого невдовзі буде визволено, ми мусимо вкладати кошти в усі види соціальних послуг. Підняті таким чином із бідності, ці мільйони самі робитимуть внесок у країну, розширюючи можливості всіх."
 
 VYT_nor_abandon_the_disenfranchised: "...Не полишимо безправних..."
 VYT_nor_abandon_the_disenfranchised_desc: "Однією з найогидніших практик старої імперії було її ставлення до меншин. Прагнучи лише мирно жити згідно зі своїми традиціями, вони невпинно зазнавали гноблення й витіснення на узбіччя. А коли зрештою неминуче повставали, їх масово вирізали.\n\nМи не дозволимо цьому повторитися. Віднині меншини в імперії матимуть право на обмежене самоврядування й автономію, і ці права буде закріплено законом. Росія - країна для всіх її мешканців, і ми це доведемо."
 
 VYT_nor_lay_down_the_sword: "...Не складемо меча..."
 VYT_nor_lay_down_the_sword_desc: "Хоча ми маємо намір зосередитися на численних внутрішніх несправедливостях і нерівностях, яким давно не давали належної ради, ми не можемо забути й не забудемо нашої місії об'єднання. Проте для її здійснення потрібне сучасне військо, яке підтримує країну, і треба вжити заходів, щоб забезпечити його існування.\n\nКорупційні й реакційні елементи давно вкорінилися в самій тканині імперських сил і далі обтяжують наші установи.\n\nМи мусимо усунути ці впливи й таким чином забезпечити військо, політично підпорядковане демократично обраному урядові."
 
 VYT_who_will_build_the_empire: "...Ті, хто збудує імперію..."
 VYT_who_will_build_the_empire_desc: "Імперська економіка значно зросла за час нашого регіонального об'єднання. Розширення промисловості, торговельні зв'язки й об'єднання робочої сили принесли нашому народові великий добробут, особливо порівняно з тими, хто нас оточує.\n\nПроте ми більше не мала країна з обмеженими засобами, і потреби та виклики нашої економічної парадигми докорінно змінилися. Тому ми мусимо перебудувати й переорієнтувати наші економічні плани та процедури, щоб дати їм раду.\n\nВідповідно, наш бюджет змінять, щоб фінансувати комплексні промислові починання по всій країні й зменшувати бар'єри, які заважають зростанню бізнесу."
 
 VYT_and_rebuild_the_spoiled_land: "...І відновить сплюндровану землю..."
 VYT_and_rebuild_the_spoiled_land_desc: "Навіть через роки видимі й невидимі наслідки десятиліть німецьких терористичних бомбардувань досі лишають шрами на нашій країні. Конфлікти регіонального об'єднання лише посилили їх.\n\nОдного з найважливіших ударів було завдано належному використанню ріллі. Значна її частина нині лежить необробленою або використовується погано, що спричиняє повсюдну нестачу надійного продовольчого забезпечення в імперії. Це треба виправити якнайшвидше.\n\nМи вкладатимемо кошти у відновлення й механізацію сільського господарства та заохочуватимемо селян повертатися на свої поля."
 
 VYT_who_will_defend_the_empire: "...Ті, хто захистить імперію..."
 VYT_who_will_defend_the_empire_desc: "Хоча імперські сили перемогли під час регіонального об'єднання, вони мусять і далі вдосконалювати свої можливості, якщо ми хочемо повернути землі, на які претендують наші суперники. Це вдосконалення вимагатиме розширення - і особового складу, і матеріяльної частини.\n\nДля цього ми збільшимо фінансування розширення виробничих потужностей. Так ми забезпечимо, щоб у міру набору й навчання нових людей для них були доступні потрібні зброя та спорядження."
 
 VYT_and_bring_ruin_to_the_enemy: "...І принесе загибель ворогам..."
 VYT_and_bring_ruin_to_the_enemy_desc: "Попри всі наші реформи й досягнення, факт залишається фактом: імперські сили в нинішньому вигляді просто не дорівнюють силам інших великих держав. Особливо це стосується передового озброєння й стратегічних можливостей.\n\nЯкщо ми хочемо, щоб нас визнали великою чи навіть регіональною державою, треба рішуче продовжувати програми модернізації та технічного новаторства. Для цього буде виділено додаткові кошти й ресурси."
 
 VYT_for_the_eternal_russian_tsar: "...За вічного російського царя!"
 VYT_for_the_eternal_russian_tsar_desc: "Імперія знову живе!\n\nХоча колись він загубився у вогні революції, вторгнення й громадянської війни, дух монархізму, пронизаний лібералізмом і збережений у постаті царя та нашому уряді, виявився сильнішим за все.\n\nНаше військо не має рівних у Росії, наш проґресивний уряд працює, щоб забезпечити добробут і демократичні права всіх своїх громадян, а наша економіка невпинно зростає. Сьогодні ми стоїмо як пам'ятник силі й мужності російського духу.\n\nЗа вічного російського царя!"
 
 VYT_reassure_the_emperor: "Запевнити царя"
 VYT_reassure_the_emperor_desc: "Не таємниця, що цар Владімір не підтримує нашої програми. Проте, незалежно від його особистих поглядів, народ обрав нас для формування уряду, і він мусить це прийняти. Люди мусять бачити, що він це прийняв.\n\nАле нам не обов'язково примушувати його й посилювати розбрат. Прем'єр-міністр Ґуль особисто звернеться до царя в інтересах країни й запевнить його: хоч би якими були наші особисті політичні розбіжності, ми дбаємо лише про довгострокові інтереси імперії."
 
 VYT_roll_back_on_the_okhrana: "Скоротити Охрану"
 VYT_roll_back_on_the_okhrana_desc: "Хоча Охрана показала високу спроможність захищати державу, вона також виявилася майже некерованою, діючи практично автономно й надмірно жорстоко. Наша адміністрація більше не може цього терпіти, до того ж це загрожує стабільності.\n\nТому ми проведемо повне й незалежне розслідування її операцій та справ, а після його завершення різко скоротимо її бюджет. Охрана виживе, але стане меншим і відповідальнішим знаряддям держави."
 
 VYT_guarantee_personal_freedoms: "Гарантувати особисті свободи"
 VYT_guarantee_personal_freedoms_desc: "Повертаючи Охрану під належний нагляд і контроль та на належне їй місце, ми мусимо забезпечити й зміну правових практик, які дозволили їй стати такою могутньою.\n\nМи ухвалимо законодавство, що ґарантує більше особистих свобод усім громадянам, особливо щодо незаконного затримання та їхніх прав під час допиту чи арешту.\n\nХоча такі права здаються незначними, у майбутньому вони допомагатимуть запобігати колишнім зловживанням, а отже, захищатимуть демократичну державу загалом."
 
 VYT_the_ural_drive: "Уральський ривок"
 VYT_the_ural_drive_desc: "І Західна Росія, і Західний Сибір - багаті землі, не лише за мінеральними й сільськогосподарськими ресурсами, а й за населенням. Проте інфраструктура обох регіонів жахливо слаборозвинена, що відокремлює ці самі ресурси й людей від держави.\n\nМи мусимо повернути їх до спільного життя узгодженим зусиллям із будівництва, ремонту й перебудови інфраструктури. Це не лише поліпшить видобувні можливості, а й покаже цим людям, що життя під владою імперії більше не означає занедбаності та застою, а означає інвестиції й вічний поступ."
 
 VYT_trans_russian_railroads: "Трансросійські залізниці"
 VYT_trans_russian_railroads_desc: "Незаперечно, одним із найбільших досягнень старої імперії стало будівництво Транссибірської залізниці, яка поєднала Москву й Владівосток - а отже, і всю країну - у небачений доти спосіб.\n\nДокладаючи зусиль до подальшого розширення державної інфраструктури, ми, можливо, зможемо сполучити й об'єднати старі та нові мережі.\n\nТак, працюючи над створенням всеохопної Трансросійської залізниці, ми поєднаємо мільйони наших громадян, як ніколи раніше, й скористаємося соціальними, економічними та військовими вигодами, які це принесе."
 
 VYT_the_rights_of_loyal_subjects: "Права вірнопідданих"
 VYT_the_rights_of_loyal_subjects_desc: "Від початкового встановлення імперської влади у Вятці всі види медій перебували під наглядом і певним державним контролем. Неможливо по-справжньому називати себе демократією, доки преса скута, тож ми усунемо ці обмеження й запровадимо законодавство для захисту прав вільної преси.\n\nХоча цар, імовірно, вагатиметься підтримати такий крок з огляду на попередній досвід, ми переконаємо його в необхідності цих реформ. Права громадян ставити під сумнів чи критикувати свій обраний уряд ніколи не мають бути під загрозою, а свободу слова також треба захищати."
 
 VYT_the_emperor_and_his_people: "Цар і його народ"
 VYT_the_emperor_and_his_people_desc: "Імперія знову постає, звертаючись до минулого по стабільні установи й водночас до майбутнього - по сучасне врядування.\n\nМи усуваємо шкоду, завдану нашим заводам та інфраструктурі. Ми зцілюємо травми минулих воєн і водночас модернізуємо та збільшуємо армію для воєн прийдешніх.\n\nНайголовніше, ми визнали гріхи колишніх царів та імперії, взяли на себе відповідальність і виправили заподіяне. Усі наші зусилля справді вплинули на життя громадян, і тепер багато росіян відчуває те, чого не відчували дуже давно:\n\nОптимізм."

 ### Shulgin tree ###
 VYT_the_empire_never_died: "Імперія ніколи не вмирала"
 VYT_the_empire_never_died_desc: "Імперія знову постає.\n\nЗ нашою перемогою на конґресі й призначенням нашого лідера Васілія Шульґіна прем'єр-міністром тепер ми можемо принести стабільність і добробут усій державі, зберігаючи принципи й установи, які колись зробили Росію великою державою та зроблять це знову.\n\nМи доведемо, що імперія насправді ніколи не вмирала - вона лише впала в сплячку. Тепер російський ведмідь прокинувся. І всі почують його рев."
 
 VYT_but_the_spirit_shriveled: "Та дух її занепав"
 VYT_but_the_spirit_shriveled_desc: "Хоча народи Росії здавна любили свого царя, десятиліття радикальної влади, як большевиків, так і інших, призвели до згасання цієї любові.\n\nБагато хто з них як слід не пам'ятає старої імперії, не пам'ятає її сили, гідності й могутності. Не пам'ятає Росії на вершині величі. Ми це виправимо. Народові нагадають, і коли це станеться, як він зможе не підтримати її відновлення?"
 
 VYT_revisionist_propaganda: "Ревізіоністська пропаганда"
 VYT_revisionist_propaganda_desc: "Багато хто твердить, що на вершині могутності імперія була сильною зовні, але гнилою всередині. Що її «застаріла» система врядування й відмова від реформ прирекли монархію на катастрофу. Це цілковита неправда.\n\nСтабільність імперії не було втрачено - її вкрали. Большевики. Ліберали. Ті в її власному уряді, хто не зберіг віри в царя. Ми подбаємо, щоб ті, хто таке твердить, це зрозуміли. Нехай ніхто не забуває: імперія не дозволить такому повторитися!"
 
 VYT_reshuffle_the_ministries: "Перетасувати міністерства"
 VYT_reshuffle_the_ministries_desc: "Попри сформований нами уряд, серед представників і посадовців, що симпатизують кадетам чи солідаристам, досі є незгодні. Їхня незгода не лише перешкоджає нашим законодавчим та іншим зусиллям повернути імперії гідність, а й виставляє нас слабкими на світовій сцені.\n\nМи виправимо це, «підвищивши» помітних діячів обох фракцій до посад, на яких вони зможуть завдати мало шкоди. Звісно, вони й далі можуть служити імперії. Просто в доречніший спосіб."
 
 VYT_please_the_moderates: "Задобрити поміркованих"
 VYT_please_the_moderates_desc: "Попри всі наші зусилля, ліберальніші політики й далі перешкоджають нам та чинять опір, атакуючи прем'єр-міністра Шульґіна на кожному кроці й за кожної нагоди. Це загрожує і громадському порядкові, і стабільності, й ми більше не можемо просто чекати, доки вони вгамуються.\n\nПотрібна інша стратегія. Тому ми звернемося до них і почнемо переговори. Хоча ні ми, ні вони не будемо цілком задоволені, якщо вдасться досягти розумного компромісу й виправити ситуацію, такий результат буде вартий зусиль."
 
 VYT_accept_limited_reforms: "Прийняти обмежені реформи"
 VYT_accept_limited_reforms_desc: "Хоча ми твердо віримо в продовження традицій і політики старої імперії, і ми, і прем'єр-міністр Шульґін бачимо виклики сучасної доби. Деякі з них просто не існували роки тому, але розв'язувати їх усе одно треба.\n\nДля збереження стабільності необхідні деякі реформи, обмежені за масштабом і чітко спрямовані. Додаткова вигода полягає в тому, що вони також можуть заспокоїти ліберальніших політиків. На якийсь час."
 
 VYT_trivial_pursuits_of_an_outdated_system: "Марні забаганки старого ладу"
 VYT_trivial_pursuits_of_an_outdated_system_desc: "На відміну від наших суперників і праворуч, і ліворуч, ми розуміємо, що установи нової імперії, засновані на старих, не є хибними за своєю природою. Проте є певні речі, які, як колись кріпацтво, краще залишити в минулому. Одна з них - призначення некомпетентних дворян на урядові посади.\n\nЦі дворяни побачили наше піднесення й уже просять впливу, який вважають своїм правом. Ми знайдемо їм відповідні посади, з високими титулами й без влади, і так усунемо їх від будь-якого реального керування державними справами."
 
 VYT_work_with_the_emperor: "Працювати з царем"
 VYT_work_with_the_emperor_desc: "Цар - велика людина, та ще й сильний правитель, але навіть таким велетням потрібна допомога, щоб бути належно обізнаними з усіма справами у своїй компетенції.\n\nУправління такою державою, як Росія, справді складне, і не можна очікувати, що цар робитиме все сам, та й сам він не може на це сподіватися. Тож ми працюватимемо над перетворенням посади прем'єр-міністра на таку, що якомога тісніше співпрацює з монархом, зміцнюючи цим леґітимність ініціятив обох."
 
 VYT_the_will_to_live: "Воля до життя"
 VYT_the_will_to_live_desc: "Наша мрія, мрія прем'єр-міністра Шульґіна, майже здійснилася. Повільно, але впевнено, завдяки нашим численним ініціятивам і нагадуванням душа імперії повертається до Росії.\n\nПопулярність царя і як особи, і як інституту стрімко зростає, і тепер багато хто звертається до царя Владіміра по настанови в найрізноманітніших справах. Ми ще дужче заохочуватимемо цю тенденцію, оживлюючи загальний імперський дух громадян.\n\nЦар повернувся, цар набирає сили, і цар залишиться назавжди!"
 
 VYT_a_sovereigns_authority: "Влада суверена"
 VYT_a_sovereigns_authority_desc: "Хоча багато в чому ми звертаємося до прикладів старої імперії, наша держава, попри твердження недоброзичливців, не є самодержавством. Нова Російська імперія - конституційна монархія, у якій справжню владу має прем'єр-міністр Шульґін.\n\nПроте ні ми, ні прем'єр-міністр не вважаємо, що роль царя має бути суто номінальною. Цар Владімір - розумний, начитаний і рішучий правитель, який, безсумнівно, може дати своєму урядові багато порад, і відкидати їх було б марнотратством.\n\nМи дослухатимемося до його слів і пропозицій щодо нашої політики, адже цар - утілення імператорської влади, і зрештою все робиться від його імені."
 
 VYT_a_just_cause: "Справедлива справа"
 VYT_a_just_cause_desc: "Зовсім недавно імперські сили перейшли Урал, подолавши великі труднощі на шляху до остаточної перемоги. Величезні землі повернулися під наш контроль, і, вигравши війну, тепер ми мусимо здобути перемогу в мирі.\n\nТутешні люди недовірливі, і цілком справедливо, адже вони так довго терпіли всіляких тиранів. Але ми доведемо їм нашу рішучість повернути під імперською егідою стабільність і справедливість, яких їх так довго позбавляли."
 
 VYT_a_rightful_intention: "Праведний намір"
 VYT_a_rightful_intention_desc: "У межах кампанії зі здобуття підтримки й довіри народів Західного Сибіру ми маємо намір чітко показати їм: цар Владімір дбає про них так само, як про будь-кого іншого зі своїх підданих.\n\nДля донесення цієї ясної думки буде використано ретельно керовану медійну кампанію з різними засобами комунікації. Ми сподіваємося, що з часом ці люди навчаться цінувати стабільність імперської влади й так звільняться від страху."
 
 VYT_the_will_to_power: "Воля до влади"
 VYT_the_will_to_power_desc: "Ворог, із яким ми зіткнулися в Західному Сибіру, був справді грізним, проте рішучість, майстерність і хоробрість імперських сил привели їх до перемоги всупереч величезним труднощам.\n\nЦя перемога знову підтвердила вже широко відоме: імперські сили, армія й решта, - найкращі в усій Росії. Тож віддаймо шану цим звитяжним юнакам і пам'ятаймо їхні жертви на службі своєму цареві!"

 VYT_izhevsk_model_industry: "Зразкова промисловість Іжевска"
 VYT_izhevsk_model_industry_desc: "Багато років, попри крах большевиків, повернення імперської влади й інші події, Іжевскій механічний завод був великим виробником, серед іншого, стрілецької зброї й артилерії. Хоча він давно працює відносно справно, тепер ми можемо вимагати й досягти значно більшого.\n\nРозширивши заводські потужності, оновивши обладнання й модернізувавши інструменти, ми можемо значно збільшити виробничу спроможність Іжевска. Це дозволить легше оснащувати наше невпинно зростаюче військо, а отже, є гідним починанням."
 
 VYT_hire_the_udmurt: "Найняти удмуртів"
 VYT_hire_the_udmurt_desc: "Розширюючи промисловий комплекс в Іжевску, ми муситимемо забезпечити більше робітників для роботи на ньому. Сам Іжевск лежить в Удмуртії, тож для розв'язання цієї проблеми було запропоновано звернутися до місцевих удмуртів.\n\nБагато років вони мали мало економічних можливостей, і хоча вони не росіяни, вони все ж царські піддані. За належного заохочення на них можна покластися в задоволенні потреб нашої промислової бази, що розширюється в регіоні."
 
 VYT_ufa_arms_plant: "Уфімський збройовий завод"
 VYT_ufa_arms_plant_desc: "Величезні промислові підприємства Іжевска добре служили й далі служать потребам імперських сил. Проте в міру подальшого зростання війська, а також зі стратегічних міркувань треба визначити й розбудувати додаткові потужності для виробництва спорядження.\n\nІдеальне місце для такого об'єкта з погляду інфраструктури й доступності ресурсів було знайдено в місті Уфа. На його будівництво буде виділено кошти."
 
 VYT_redraw_municipal_borders: "Перекроїти муніципальні кордони"
 VYT_redraw_municipal_borders_desc: "Наш уряд під умілим проводом прем'єр-міністра Шульґіна вже багато зробив, щоб принести імперії мир і добробут та водночас забезпечити сильну центральну адміністрацію. Проте наш контроль далеко не надійний, і це загрожує звести нанівець увесь досягнутий поступ.\n\nНагода зарадити цьому виникла під час майбутнього перегляду виборчих округів. Змінивши межі певних округів, ми можемо забезпечити собі значну виборчу перевагу в осяжному майбутньому й водночас цілковито зберегти демократію в Росії."
 
 VYT_work_programs_for_little_russians: "Трудові програми для малоросів"
 VYT_work_programs_for_little_russians_desc: "«Малороси» - велика українська меншина в наших кордонах, що складається і з тих, хто живе тут поколіннями, і з тих, хто прибув, утікаючи від нацистської тиранії. Багато хто роками зазнає тяжких економічних труднощів, і не можна дозволити цьому становищу тривати.\n\nУсі росіяни заслуговують на оплачувану й належну роботу, і малороси не виняток. Спеціяльна програма зайнятості забезпечить їм цю можливість і доведе нашим численним недоброзичливцям, що ми дбаємо про потреби багатьох різноманітних меншин на нашій території."
 
 VYT_settler_incentives: "Заохочення переселенців"
 VYT_settler_incentives_desc: "Хоча наші ініціятиви розширення промислової бази імперії й далі дають добрі результати, вони також спричинили гостру нестачу робочої сили, що загрожує звести нанівець значну частину досягнутого. Спираючись на попередні успіхи, було запропоновано заохочувати внутрішнє переселення росіян із місць, де мало роботи, до районів зростання промисловості, передусім у Татарстані й Башкірії.\n\nТака кампанія не лише послабить напруження з робочою силою в цих землях, а й сприятиме поширенню російської культури та загальній асиміляції наявних меншин. Справді, обидві цілі похвальні."
 
 VYT_the_tsars_golden_purse: "Золота калита царя"
 VYT_the_tsars_golden_purse_desc: "Раніше цар згадував про своє бажання зробити внесок у відродження імперської економіки власними статками. Це шляхетна й справедлива мета, тож і ми, і прем'єр-міністр Шульґін заохочуватимемо та підтримуватимемо її.\n\nЗавдяки щедрим царським інвестиціям певні галузі по всій імперії отримають і значне зростання, і нові можливості. Це також стане прикладом особистої відданості царя державі й потенційно створить суспільне очікування подібних дій від заможних людей."
 
 VYT_shovels_and_pickaxes: "Лопати й кирки"
 VYT_shovels_and_pickaxes_desc: "Попри всі зусилля нашого уряду зі збільшення кількості, підвищення якості й ефективності заводських комплексів у країні, ми порівняно мало дбали про те саме щодо інструментів, якими користуються їхні робітники. Справді, у багатьох випадках вони обходяться тими самими інструментами, що й за старої імперії, немов десятиліть удосконалень відтоді й не було.\n\nЦе не лише неприйнятно, а й серйозно обмежує загальні можливості поліпшення. Якщо Росія має рушити до нового майбутнього, ми мусимо забезпечити, щоб разом із нею рушили й її робітники."
 
 VYT_roofs_and_food: "Дах і їжа"
 VYT_roofs_and_food_desc: "Сам факт, що так багато мешканців імперії реґулярно не має достатньо їжі чи житла, є не лише суспільною ганьбою, а й надзвичайною політичною незручністю.\n\nСам цар особливо приголомшений цим і дуже зацікавлений у сприянні значним інвестиціям як у сільське господарство, так і в житлове будівництво, вважаючи забезпечення обома критично важливим для основоположної стабільності держави. Наш уряд згоден і працюватиме над виділенням державних коштів на ці цілі, подбавши водночас, щоб заслугу в їх забезпеченні приписували цареві."
 
 VYT_the_will_to_prosper: "Воля до процвітання"
 VYT_the_will_to_prosper_desc: "Ще зовсім недавно і цар, і багато членів нашого уряду ледь контролювали землі довкола Вятки, оточені комуністами, зрадниками, сектантами та ще й сепаратистами.\n\nСьогодні ми разом безроздільно пануємо над мільйонами квадратних кілометрів території та мільйонами росіян, що живуть на ній. Голод відступає, економіка зростає, а стабільність нарешті повертається до наших земель.\n\nІмперія утвердилася як яскраве світло в темряві, що поглинула Росію, і хоча нам ще далеко йти, наше загальне становище справді вселяє оптимізм."
 
 VYT_undoing_the_great_mutilation: "Подолати велике каліцтво"
 VYT_undoing_the_great_mutilation_desc: "Тепер, бачачи повний вплив наших ініціятив і політики, ми можемо остаточно стверджувати: наша держава внутрішньо захищена, і за це маємо дякувати невтомним зусиллям царя та прем'єр-міністра Шульґіна. Проте назовні нашу роботу ще не завершено.\n\nІнші уряди на сході й далі оспорюють наше право бути законним урядом і, за повідомленнями, готуються вдарити по нас. Ми виступимо першими.\n\nІмперські сили знову пошлють на схід, і цього разу вони не зупиняться, доки не дістануться Тихого океану - доки Батьківщина знову не стане цілою!"
 
