 ########################

 VYT.1.t: "Усі дороги ведуть до Романова"
 VYT.1.desc: "17 липня 1918 року імператора Ніколая II було вбито. Громадянська війна в Росії, що настала за цим, і зрештою перемога совєтів у ній для багатьох стали похоронним дзвоном російського монархізму.\n\nМожливо, так і було б, якби не дії однієї людини. Великий князь Владімір Кірілловіч Романов, хоч і народився у вигнанні, спостерігаючи спершу з Франції, а потім із Бретані, як комунізм розчавлює землю його предків під ганебною тиранією, але нарешті він повернувся додому.\n\nНазвавши себе царем Владіміром III та зібравши за німецької підтримки військо вигнанців, еміґрантів і всіх інших, хто погодився б воювати, він захопив місто Вятка серед хаосу Західноросійської війни. Невдовзі він проголосив відродження Російської імперії в місті та довколишніх землях.\n\nНа початку 1962 року цар стоїть перед низкою величезних завдань. Він мусить дати раду скаліченій російській економіці, відкрито бунтівному губернаторові, ворожим сусіднім дрібним державам, розколотій армії, байдужому населенню і, найголовніше, знайти шлях до своєї мети - майбутнього об'єднання Росії під владою династії Романових.\n\nСмерть Ніколая II вкинула Росію в хаос, від якого вона так і не оговталася, але з поверненням Владіміра III, можливо, цей хаос удасться вгамувати, а з попелу постане нова сильна імперська російська держава!"
 VYT.1.a: "За тебе помстяться, дядьку."
 
 VYT.2.t: "висота 483"
 VYT.2.desc: "Від самого повернення царя Владіміра до Росії - одночасно з німецькою військовою відповіддю в Західноросійській війні - він, що не дивно, стикається зі звинуваченнями, нібито ні він, ні його військо недостатньо відмежувалися від сил Райху. Багато наших офіцерів носять німецьке спорядження й пройшли німецьку підготовку, тож ми давно шукали нагоди продемонструвати нашу відокремленість від німецького режиму. Хоча ми вагаємося назвати її «щасливою», така нагода з'явилася.\n\nНаші командири отримали повідомлення, що на невелику громаду на вершині пагорба поблизу Іжевска напала група зі звичною нацистською символікою. Невідомо, чи це німецький рейдовий загін, чи просто бандити з-поміж пєрмських фанатиків, але відомо, що нині вони тримають поселення в облозі й воно не зможе довго протриматися.\n\nУ відповідь цар наказав відправити невелику оперативну групу чисельністю 300 осіб, оснащену важкою зброєю, щоб зняти облогу поселення, позначеного на військових картах як висота 483. Так цар не лише захистить свій народ, а й доведе, що ні він, ні його військо більше не мають жодних симпатій до нацизму чи огидних осіб, які його сповідують."
 VYT.2.a: "Перший крок у великій подорожі."

 VYT.3.t: "Висота 483 - успіх!"
 VYT.3.desc: "Після початкової розвідки спеціяльна оперативна група, відряджена царем, вступила в бій із нападниками на схилах висоти 483.\n\nХоча нападники, схоже, усвідомлювали власну чисельну слабкість, вони вирішили втримувати позицію, покладаючись і на місцевість, і на власні грубі укріплення. Вони явно не очікували, що наші сили приведуть артилерію.\n\nЗатиснуті між нашими солдатами й ополченням громади, яку вони взяли в облогу, ті нападники, яких не знищила артилерія, швидко полягли під вогнем спереду або з тилу, а вцілілі швидко здалися.\n\nХоча сутичка була невеликою, громада зустріла наших вояків як героїв; вони продемонстрували свою компетентність і професіоналізм та показали і власну, і царську готовність безпосередньо протистояти нацизмові на захист народу."
 VYT.3.a: "Чудовий результат."

 VYT.4.t: "Висота 483 - невдача!"
 VYT.4.desc: "Після початкової розвідки спеціяльна оперативна група, відряджена царем, вступила в бій із нападниками на схилах висоти 483.\n\nХоча нападники, схоже, усвідомлювали власну чисельну слабкість, вони вирішили втримувати позицію, покладаючись і на місцевість, і на власні грубі укріплення. Озираючись назад, це явно був найкращий вибір.\n\nКоли наші вояки пішли вперед, командир артилерії відмовився виконати наказ відкрити вогонь, пославшись на неприпустимий ризик. Без підтримки наші солдати опинилися притиснутими кулеметним вогнем і зазнали тяжких втрат, перш ніж були змушені відступити. Підбадьорені цим нападники швидко здолали цивільне ополчення на вершині висоти 483 й розграбували поселення, після чого залишили поле бою.\n\nХоча сутичка була невеликою, наші дії спричинили звинувачення і в можливій некомпетентності, і в нацистських симпатіях у нашому війську. Крім того, здається, наші сусіди теж звернули увагу на те, як ми щойно себе показали."
 VYT.4.a: "Оце халепа."

 VYT.5.t: "Імператорська пожертва"
 VYT.5.desc: "Через хаос і насильство, що панують у Західній Росії, люди охоче переповідають і прикрашають історії та подвиги тих, кого вважають леґендами. Однією з таких груп є Вільні авіатори - колишні льотчики Червоних повітряних сил, які зі своїх аеродромів на крижаній півночі здіймаються в бій із німецькими бомбардувальниками, що сіють терор, коли й де тільки можуть, зокрема й над нашою територією.\n\nХоча вони комуністи, на відміну від багатьох своїх ідеологічних побратимів, вони самовіддано борються, захищаючи і Росію, і росіян від чужоземних загарбників. Тож, прагнучи поліпшити свій образ серед громадськості, здобути додаткову леґітимність і підтримати цих хоробрих льотчиків, цар власним коштом придбав кілька раніше списаних літаків, а також багато запасних частин до них.\n\nУсе це він безоплатно відправить Вільним авіаторам і так допоможе їм боротися за країну, якою одного дня має намір правити цілком."
 VYT.5.a: "Героїзм завжди заслуговує на визнання."

 VYT.6.t: "Імператор по радіо"
 VYT.6.desc: "Після низки спроб продемонструвати, що ми не большевицькі чи фашистські воєначальники, які прийшли завдати російському народові ще більше лиха, та на тлі сталого зростання народної підтримки імператор Владімір вирішив звернутися по радіо до народу Вятки й за її межами. Голос імператора Владіміра в радіоетері аж ніяк не новина для російського народу: багато хто чув, як під час війни він підспівував Райхові. Але тепер імператор має намір виголосити перед своїм народом зовсім іншу промову."
 VYT.6.a: "В етері за три, два, один..."

 VYT.7.t: "Промова царя"
 VYT.7.desc: "«Мої співвітчизники, доброго вечора. У ці важкі часи дякую вам, що знайшли час вислухати мене, хоч би де ви були. Я розумію, що багато хто з вас не вважає мене людиною, якій можна довіряти, вважає мене байдужим до вашого добробуту, тож на кілька наступних хвилин прошу дозволити мені говорити з вами не як ваш цар, а як співвітчизник-росіянин».\n\n«Майже двадцять років нас чавить тягар гноблення. Для совєтів ми були лише ґвинтиками в машині, а німці бачили й досі бачать у нас майже самих лише тварин. Так, певний час я справді співпрацював із німцями. Тоді я виправдовував це використанням одного ворога проти іншого. Це було неправильно, і тепер я розумію чому. Лише росіянин може зрозуміти глибину страждань і міру потреб цієї великої країни, і тепер я добре розумію і те, й інше. Тепер я присягаю присвятити всі свої зусилля подоланню цих страждань і задоволенню цих потреб».\n\n«Ви, ми - усі росіяни. Ми не ґвинтики в машині. Ми не тварини, на яких полюють. Ми люди, які прагнуть лише того миру й добробуту, який стільки інших сприймає як належне, і разом ми його здобудемо».\n\n«Я не прошу вас сліпо довіряти мені, бо знаю: просити росіянина про довіру без учинків - безглуздя. Прошу лише спостерігати, як я цю довіру заслужу. Прошу лише дозволити мені довести, що я гідний становища, яке довірили мені родина й Бог».\n\n«Росія в тіні, і гадаю, ніхто з цим не сперечатиметься. Але разом ми знайдемо світло, і я прошу, щоб із часом ви довірили мені вести вас до нього. Нехай Бог оберігає нас усіх»."
 VYT.7.a: "Гарно сказано, Ваша Імператорська Величносте."

 VYT.8.t: "Мова двору"
 VYT.8.desc: "Цар зміцнює свою владу й береться впорядковувати придворні процедури та вимоги, і раптом постало питання мови.\n\nХоча на землях, які ми контролюємо, звичайно, переважають етнічні росіяни, Росія загалом охоплює значно більше етнічних груп і мов.\n\nТож було порушено питання офіційної мови двору. Багатьох дивує, що його взагалі розглядають: вони твердо переконані, що Росія - країна для росіян і що, оскільки російська однаково є мовою більшості при дворі, вона сама собою є його офіційною мовою.\n\nІнші придворні, переважно молодші й ліберальніші, вважають, що закріплення російської як єдиної мови стало б кроком назад у наших спробах пристосувати імперську систему до сучасної доби.\n\nОбидва доводи мають вагу, тож те, яке саме рішення ухвалить цар, стало предметом палких суперечок."
 VYT.8.a: "Росія говорить російською, і двір говоритиме так само!"
 VYT.8.b: "Якщо імператор може говорити кількома мовами, то й двір може."

 VYT.9.t: "Рівність перед законом"
 VYT.9.desc: "Перед царським двором постало чергове питання, цього разу про привілеї аристократії та правовий кодекс.\n\nВиявляється, один із наших аристократів доволі жорстоко побив чоловіка, якого підозрював у зв'язку зі своєю дружиною. Хоча його заарештували на місці, невдовзі відпустили через суперечності в законі щодо його застосування до осіб із дворянським титулом.\n\nЦей випадок викликав обурення серед мешканців Вятки й розколов двір. Реформісти, як завжди виступаючи за відкритіше й ліберальніше суспільство, твердо вважають, що закон має однаково поширюватися на всіх, незалежно від становища. Натомість багато старших аристократів переконані, що задля стабільності й наступности правлячим класам треба надавати певні винятки.\n\nФракції не можуть дійти згоди, тож рішення мусить ухвалити цар."
 VYT.9.a: "Чіпляння за минуле згубило колишніх Романових - забезпечити верховенство права!"
 VYT.9.b: "Не можна нехтувати правами аристократії - вона матиме свої винятки."

 VYT.10.t: "Вятська винокурня"
 VYT.10.desc: "Імператор доручив своїм радникам розробити економічні стратегії для пожвавлення нашої скаліченої економіки, але, прагнучи подати власний приклад, висунув їм і власну пропозицію.\n\nКоли наші сили відвоювали Вятку в большевиків, один із підрозділів натрапив у місті на бандитське виробництво самогону в старій винокурні. Спроби вигнати бандитів призвели до перестрілки й загибелі їх усіх, але значна частина обладнання та будівлі залишилася цілою.\n\nОскільки бомбардування Люфтваффе унеможливлюють велику промисловість, імператор наказав нарешті відкрити винокурню й налагодити виробництво одного з найцінніших ресурсів Росії: високоякісної горілки. Імператор вважає, що таке мале виробництво зі значним ринком збуту по всій Росії чудово підштовхне нашу економіку й відкриє шлях до потужнішої промисловості в майбутньому.\n\nМине певний час, перш ніж ми зможемо масово виробляти горілку належної якості, але імператор уже дозволив необхідні субсидії та інвестиції для початку виробництва. Залишається лише прибрати винокурню й узятися до роботи."
 VYT.10.a: "Продавати горілку росіянам? Та це ж рідке золото!"

 VYT.11.t: "Із Берліна з любов'ю"
 VYT.11.desc: "Як і всюди в Західній Росії, німецькі Люфтваффе реґулярно пролітають над князівством, сіючи згори терор, горе й смерть.\n\nВони бомблять усе, що бачать, і ніщо не уникає їхніх ударів. Ні школи, ні лікарні, ні заводи, ні будинки й ферми, ані будь-що інше, що можна вважати економічно, військово чи суспільно цінним, не уникло їх.\n\nЦе триває двадцять років, формуючи думки й звички цілого покоління та цілковито знищуючи будь-яку можливість створення справжньої промислової бази на нашій чи будь-чиїй іншій території. Ми не можемо їх зупинити, але це не означає, що мусимо сидіти без діла.\n\nМи можемо досліджувати інші економічні методи, планувати майбутнє розширення й закладати основу стрімкого розвитку, коли, а не якщо, бомбардувальники зупиняться. Ресурси Райху не безмежні, хоча багатьом нашим громадянам може так здаватися, і коли настане день, у який наше небо знову стане чистим, ми будемо готові."
 VYT.11.a: "Одного дня бомби перестануть падати. Одного дня."

 VYT.12.t: "Імперська жорстка економія"
 VYT.12.desc: "З огляду на жалюгідний стан нинішньої економіки царські радники одностайні: треба негайно запровадити програму жорсткої економії, щоб запобігти неминучому повному крахові. Просто немає грошей, які можна витрачати, а щоб отримати капітал для інвестицій і розвитку, треба скоротити інші сфери. Питання лише в тому, наскільки суворою має бути ця економія.\n\nБільшість радників запропонувала поміркованість: значне, але розумне скорочення різних суспільних послуг, зокрема освіти й охорони здоров'я. Проте дехто порадив цареві: надзвичайні часи вимагають надзвичайних заходів, а єдиний спосіб забезпечити успіх - це граничне урізання бюджетів усіх державних служб, окрім лише війська та окремо визначених ініціятив.\n\nНарод не зустріне прихильно жодних скорочень, тож цар мусить вирішити, скільки нестатків, на його думку, готові витерпіти його піддані."
 VYT.12.a: "Вистачить помірної програми економії."
 VYT.12.b: "Крайня програма економії - наш єдиний вибір."

 VYT.13.t: "Ризики торгівлі"
 VYT.13.desc: "Уперше за десятиліття в річкових портах Вятки вирує торгівля. Вантажники переносять товари, обмінюючись грубими жартами суворих чоловіків. Суднові скарбники снують уздовж набережних, перевіряючи й переперевіряючи вантажні списки. Чиновники роблять те саме, шукаючи контрабандистів і пильнуючи належну сплату податків. Довкола всіх них гуде двигун торгівлі.\n\nЗ імператорської баржі, хай якою скромною вона була, цар Владімір дивився, як його люди задоволено працюють, і дозволяв собі відчути гордість за те, що дав їм таку змогу, хоча у скроні пульсувала чергова міґрень. Поглинутий цим, цар не помітив, як до нього підійшов гість, капітан торговельного судна.\n\n«Ваша Величносте? - запитав капітан. - З вами все гаразд?»\n\nВладімір відмахнувся. «Усе добре, - збрехав він. - Дякую». Він широко повів рукою, показуючи на доки. «Про що ви говорили раніше, капітане?»\n\n«Пірати, Ваша Величносте, - відповів капітан. - Відомо, що нижче за течією, вздовж головних річкових торговельних шляхів, діють річкові пірати. І я, й інші купці просили більше охоронних загонів, відряджених з імперських армій».\n\nЦар приховав розпач, досить сильний, щоб пробитися навіть крізь гострий біль міґрені. Щоб отримати такі загони, доведеться змусити Ґуля, Шульґіна й Солженіцина до компромісу. Та, поки голова й далі пульсує, він відповідає:"
 VYT.13.a: "І ви їх отримаєте."
 VYT.13.b: "Доведеться обійтися без них."

 VYT.14.t: "Напад на Вятці - нападників відбито!"
 VYT.14.desc: "Нападники підкралися до імперської торговельної баржі глупої ночі, з почорненими обличчями, на маленьких човнах, що низько сиділи у воді. Уникаючи світла баржі, вони порівнялися з нею й закинули гаки за борт із відпрацьованою легкістю людей, які робили це десятки разів. Проте цього разу все мало бути інакше.\n\nНа палубі один із додаткових охоронців, призначених царем, почув шум і, придивившись, побачив гаки. Здійнявши тривогу, він відкинув гак ногою й почав стріляти в темряву; невдовзі до нього долучилися і команда баржі, і решта охоронців. Коли все стихло й почало сходити сонце, охоронці виявили, що пірати відступили без втрат.\n\nАле бодай цього разу здобич їм не дісталася. І піде чутка, що тепер царські солдати захищають річкові судна."
 VYT.14.a: "Ще одна царська перемога."

 VYT.15.t: "Напад на Вятці - нападники перемогли!"
 VYT.15.desc: "Доповідь щойно надійшла.\n\nВійськовий патруль знайшов одну з річкових барж - ту, що належала капітанові, з яким він розмовляв лише кілька днів тому, - викинутою на берег і розграбованою. Поруч купою лежали тіла її команди, серед них і капітана: вони або загинули під час нападу, або були страчені після здачі. Робота річкових піратів - тих самих, яких боявся капітан. І якими він знехтував.\n\nВантаж зник, його вже не повернути, а самі пірати, ймовірно, певний час не діятимуть у князівстві - уникнувши таким чином покарання. Царя накрило почуття провини.\n\nОсівши в кріслі, він відчув, як воно поглинає його думки. Він послав на смерть добрих і вірних людей, людей, які повірили в його програму річкової торгівлі. Він проіґнорував їхні побоювання. І хоча він знав, що важливішим наслідком стане втрата купецької довіри до всієї програми, обличчя капітана не йшло йому з голови.\n\nВін поклав доповідь і знову зітхнув. Починалася міґрень."
 VYT.15.a: "Страшна ціна за дрібну помилку."

 VYT.16.t: "Закон цієї землі"
 VYT.16.desc: "Солдати ввійшли до його села три дні тому, заявивши, що служать цареві. Він не був певний, що вони мають на увазі, - останнього царя комуністи розстріляли десятиліття тому, - але вони поки що нічого не намагалися вкрасти. Ба більше, пообіцяли захист від бандитів, які роками дошкуляли поселенню. А натомість попросили лише притулку.\n\nЧоловік дозволив одному з них оселитися у своєму домі, в кімнаті покійної дружини. Щоранку вони разом їли, перш ніж солдат приєднувався до товаришів у патрулі, а після його повернення знову ділили трапезу. Два тижні цей ритуал повторювався, і він навіть запитав солдата, чому той узагалі тут, але у відповідь той лише знизав плечима.\n\nЗрештою відповідь знайшлася. Неподалік помітили озброєних людей під дивним прапором, і солдати швидко зайняли позиції, які готували тижнями. Коли нападники - вдягнені в чорне чоловіки з ненависницьким фанатизмом в очах - прибули, вони стрімголов кинулися в село. Їх скосили там, де вони стояли.\n\nПотім солдати зібралися на перекличку, і всі були на місці - крім одного. Пошуки швидко привели до нього: він лежав за земляним укріпленням, із простреленими грудьми й порожніми очима, що дивилися в небо. Чоловік упізнав солдата, з яким ділив трапези, але приховав почуття з легкістю людини, яка давно в цьому вправлялася.\n\nНаступного ранку він зголосився викопати солдатові могилу й змайстрував грубий хрест, щоб її позначити."
 VYT.16.a: "Кожна перемога має свою ціну."

 VYT.17.t: "Єпископ Вятський"
 VYT.17.desc: "Новопризначений єпископ Вятський, завершивши Божественну літургію, вийшов перед зібраними парафіянами. Перед ним стояли православні віряни міста, люди всіх станів і занять. Собор був простий, усередині без оздоб. Але хрест і вівтар - ось усе, що справді було потрібно.\n\n«Друзі, - почав єпископ, піднявши руки, - брати у Христі, не таємниця, що Росія, цей бастіон істинної Господньої віри, у великій небезпеці. Ми воюємо між собою, а, - він указав на небо, - самі дияволові шакали сиплють на нас смерть із височини. Та не все втрачено! Є одна людина, один вірний слуга Божий, що стоїть проти темряви, немов маяк».\n\n«Ця людина - цар Владімір! Він благословив нас своїм покровительством, а його армії захищали вірян як могли, перетворивши це місто на бастіон побожності. Навіть зараз наша паства зростає, несучи спасіння, перепочинок і розраду всім, хто цього потребує». Він ступив уперед, по черзі дивлячись на кожного з присутніх. «Цар поведе нас уперед і осяє Господнім світлом усі темні кутки Росії, де його придушували».\n\nЄпископ стишив голос, надаючи своїм словам завершальності. «Тож щоночі моліться за царя, мої вірні. Бо він молиться за вас, молиться за Росію й молиться, щоб Божа благодать повернулася на цю землю!»"
 VYT.17.a: "Амінь."

 VYT.18.t: "Візантійська бюрократія"
 VYT.18.desc: "Лейтенант Чєрдєнко втретє притиснув слухавку до вуха, нетерпляче чекаючи відповіді командира. Нарешті, через час, що здався годинами, він почув голос. «Ґаврілов слухає».\n\n«Пане командире, це Чєрдєнко. За вашим дорученням я намагаюся отримати ті рушниці, які ми придбали минулого тижня. На жаль, мушу доповісти: мине ще трохи часу, перш ніж вони дістануться воякам». Чєрдєнко щосили приховував роздратування.\n\n«Не розумію, лейтенанте, - відповів Ґаврілов. - Зброя на складі. Вам треба було лише розписатися й забрати її. То що вас затримує?»\n\nЧєрдєнко зітхнув. «Затримує те, пане командире, що, схоже, ніхто не має повноважень справді видати мені рушниці. Кожне відомство відсилає мене до іншого бюро, а кожне бюро - до іншого відділу. І всі, здається, потребують схвалення одне одного». Він ризикнув. «Я ще ніколи не бачив стільки тяганини, пане командире!»\n\nУ слухавці Чєрдєнко почув хмикання. «Заспокойся, синку, - сказав Ґаврілов. - Розумію твоє роздратування, але тут усе так працює. Я зроблю кілька дзвінків, а ти просто проходь усі процедури, доки не отримаємо нашу зброю. Зрозуміло?» Тон Ґаврілова був недвозначний.\n\n«Так, пане командире, - відповів Чєрдєнко. - Зроблю». Коли Ґаврілов поклав слухавку, Чєрдєнко знову зітхнув. Його робота лише починалася."
 VYT.18.a: "Оце халепа."

 VYT.19.t: "Гадюче гніздо"
 VYT.19.desc: "Хоча він приховував це з відпрацьованою ґрацією монарха, який висидів тисячу рад, цар Владімір був виснажений. Ця зустріч, чергова з багатьох між представниками найпомітніших політичних фракцій князівства, а саме Романом Ґулем, Алєксандром Солженіциним і Васілієм Шульґіним, передбачувано перетворилася майже на саме лише перекрикування.\n\n«Ви пропонуєте говорити про “лібералізацію” й “демократію”, коли ми ледве убезпечили свої кордони?» - недовірливо вигукнув Солженіцин.\n\nҐуль підхопився на знак протесту. «Так! - вигукнув він. - На кону майбутнє Росії, а ви пропонуєте лише те саме мислення, яке свого часу привело до влади комуністів!» Обличчя Солженіцина побагровіло від люті, а Владімір відчув наближення міґрені, яку загострив стрес. Та раптове втручання Шульґіна повернуло його увагу до зустрічі.\n\n«Государю, - шанобливо промовив той, - чи не бажаєте додати свої міркування до цієї розмови? Сьогодні ви були доволі мовчазні». Владімір подумки вилаявся. Звісно, Шульґін рішуче його підтримував, але старий ніколи не розумів, коли йому просто хотілося, щоб його залишили в спокої. Після довгої паузи цар заговорив.\n\n«Сьогодні ви всі говорили добре, - почав він давно завченими словами, - і мені знадобиться час, щоб обміркувати сказане. Цей час я відведу собі просто зараз». Підвівшись і пішовши під шанобливими поглядами всіх присутніх, Владімір відступив коридором, а позаду знову почулися приглушені крики.\n\nМіґрень гупала у скронях. Можливо, варто попросити лікаря якось полегшити біль."
 VYT.19.a: "Коли скінчаться ці чвари?"

 VYT.20.t: "Вигідна пропозиція"
 VYT.20.desc: "Наші аґенти в Костромі повідомили, що до них звернулися з доволі цікавою пропозицією з найнесподіванішого джерела: Вятки. Схоже, уряд імператора Владіміра нещодавно збудував на своїй території горілчану винокурню й шукає покупців. Що ж, якщо їхня мета - контрабандою вивозити алкоголь із Росії, кращих виконавців вони навряд чи знайшли б. Питання лише в тому, чи приймемо ми угоду.\n\nЛюди імператора вміють торгуватися: від закінчення Другої світової війни горілка російського виробництва на Заході в дефіциті. Справді, вже перша отримана партія, імовірно, окупиться в кілька разів. Співпраця з одним із небагатьох осередків монархізму, що залишилися в Росії, також допоможе прихилити до нас білоеміґрантів, багато з яких сидить на великих купах грошей. Можливості, які може відкрити торгівля з Вяткою, численні, але й ризики теж.\n\nОкрім ресурсів, потрібних для налагодження маршруту, найбільшою проблемою буде взагалі доправити горілку через Європу - небезпечною дорогою через окуповану німцями територію та охоплену бандитизмом Росію. Втрата навіть дванадцяти ящиків щомісяця може відчутно урізати наші прибутки. Є ще й проблема загальної нестабільності Росії. За пів десятиліття Вятка цілком може припинити існування, а наші відносини з нею навряд чи сподобаються тому, хто прийде їй на зміну.\n\nЗ огляду на все це, чи варто прийняти пропозицію імператора, потиснувши руку, чи чемно відмовити й пошукати кращих можливостей? Наші люди в Костромі з нетерпінням чекають відповіді."
 VYT.20.a: "На добре спиртне попит постійний, і це може стати надійним джерелом."
 VYT.20.b: "Торгувати з монархістами? Яка нісенітниця."

 VYT.21.t: "Голландський зв'язок"
 VYT.21.desc: "Наші контакти в Костромі повідомили про успіх. Після запеклих переговорів голландці погодилися стати посередниками для експорту великих обсягів спиртного по всьому світу. Хоча вони, звичайно, забиратимуть значну частку, ми можемо очікувати великих надходжень іноземного капіталу, щойно канал запрацює.\n\nТож ми мусимо запустити цей канал. Першу партію вятської горілки вже передано під голландський контроль, і невдовзі вона почне довгу подорож до Нідерландів. Там її підготують до експорту, а голландці продадуть усім, хто захоче купити.\n\nГолландці пообіцяли першу виплату за місяць, і царські радники вже визначають найкращий спосіб інвестувати виручку та методи поліпшення виробництва, якщо попит виявиться достатньо високим.\n\nНевдовзі весь світ почує про наше князівство, а якість нашого продукту подбає про те, щоб його згадували з теплотою."
 VYT.21.a: "Новий головний експортний товар Росії."

 VYT.22.t: "Відхилена пропозиція"
 VYT.22.desc: "На жаль, схоже, голландцям забракло мудрості прийняти нашу більш ніж щедру пропозицію. Наші аґенти в Костромі повідомили, що їхню взаємовигідну пропозицію чемно відхилили навіть після значних поступок із нашого боку. Послалися на ризики перевезення горілки через Європу й нашу «сумнівну спроможність задовольнити попит». Звісно, це тяжка помилка Нідерландів, але, здається, вони вже визначилися.\n\nОтже, нашій винокурні, схоже, доведеться й далі зосереджуватися на виробництві для внутрішнього ринку. Загалом це стало значним ударом по наших зусиллях із залучення іноземної валюти, і в осяжному майбутньому, здається, доведеться й далі покладатися на надходження від еміґрантів за кордоном.\n\nПроте винокурня й далі виправдовує вкладені кошти, а надію продавати нашу горілку за кордон ще не втрачено. Дехто з ближчих сусідів може зацікавитися придбанням більшої кількості алкогольних напоїв, а зі зростанням нашої сили ми цілком можемо самі робити те, в чому зараз мусимо покладатися на голландців."
 VYT.22.a: "Можливо, краще уникнути зв'язків із чорним ринком."

 VYT.23.t: "Чорна робота"
 VYT.23.desc: "У непомітній селянській садибі неподалік Вятки аґенти несли тіла до неглибоких могил, підготовлених раніше. Жоден із них не співчував убитим чоловікам. Зрештою, як казав їм Смисловскій, в Охрані треба бути жорстким. Ворогам держави не можна виявляти милосердя, інакше пошириться безлад.\n\nНа цих чоловіків вони вийшли після однієї з численних облав на ймовірні комуністичні конспіративні квартири: знайдений там шифрований лист після розшифрування привів їх до складу. Там і знайшли цих людей, запідозрених у намірі підірвати царський режим за наказами з Архангельська. Як усі переконані «революціонери», чоловіки опиралися. Але аґенти знали своє завдання й знали, що кожен зрештою ламається. І один із них зламався.\n\nПеред смертю він розкрив існування у Вятці революційного осередку, кінцевою метою якого було повалити царський уряд і встановити владу Революційного фронту. Його товариш, якого допитували окремо, підтвердив цю історію, перш ніж піти з життя в подібний спосіб.\n\nПоховавши тіла, аґенти підготували доповідь. Ці люди були лише початком, і попереду чекало ще багато роботи."
 VYT.23.a: "Стабільність треба забезпечити."

 VYT.24.t: "Державні справи"
 VYT.24.desc: "Усю Західну Росію убезпечено, створення тимчасового цивільного уряду вже далеко просунулося, і до життя тих, хто перебував під владою царя, повернулося відчуття нормальности.\n\nІз цивільним правлінням з'явилися додаткові дорадчі органи для царя, і один із них збирався сьогодні. Прибуваючи, його члени тихо перемовлялися. Цар чітко дав зрозуміти: він хоче розв'язати численні внутрішні проблеми Суверенної Держави, перш ніж узагалі дозволити розмови про подальше об'єднання, і політична боротьба за позиції вже почалася.\n\nКоли цар прибув і засідання розпочалося, один член запропонував зосередити зусилля держави на інфраструктурі, інший хотів зосередитися на внутрішній безпеці, а решта бажала уваги й до інших справ. Коли за кілька годин засідання закінчилося, у деяких із цих питань було досягнуто певного поступу - меншого, ніж сподівалися, але більшого, ніж боялися.\n\nПізніше того вечора Владімір думав про події дня. Були різні погляди, суперечки й найрізноманітніші дебати. Але всі були віддані Суверенній Державі, йому та підготовці країни до її кінцевої мети - об'єднання на схід, незалежно від особистих інтересів.\n\nЦе його влаштовувало."
 VYT.24.a: "Розбудовується справжня держава."

 VYT.25.t: "Обіцянки конґресу"
 VYT.25.desc: "Було вкрай незвично, щоб цар скликав засідання ради без заздалегідь визначеного порядку денного. Тож коли він це зробив, як-от щойно, представники політичних фракцій Вятки зрозуміли: має статися щось важливе.\n\nКоли Роман Ґуль, Алєксандр Солженіцин і Васілій Шульґін сіли навпроти нього, він привітав кожного по черзі, глибоко вдихнув і заговорив.\n\n«Я покликав вас сюди, - почав він, - бо вважаю, що невдовзі настане час скликати загальний конґрес. Я, як і ви, чув, як день у день посилюються заклики до демократії, і не вірю, що сучасна Росія може витримати жорстке самодержавство моїх предків».\n\nҐуль, вічний реформатор, заговорив першим. «Ваша Величносте, - сказав він із сяйливими очима й усмішкою, що розпливалася на обличчі, - це чудова звістка, до того ж дуже підбадьорлива. Народ глибоко шануватиме цей вибір. Але...»\n\n«Коли це станеться?» - перебив Солженіцин, примруживши очі.\n\n«Щойно ми будемо в безпеці». Владімір указав угору. «Із припиненням бомбардувань генерали кажуть мені, що нам украй важливо швидко взяти під контроль регіон, перш ніж те саме зроблять інші. Щойно цього буде досягнуто, конґрес скличуть». Говорили ще чимало, але найголовніше послання вже прозвучало.\n\nКоли троє чоловіків виходили з кімнати, Шульґін затримався, перш ніж зачинити за собою двері, і заговорив. «Ваша Величносте, я хотів подякувати вам. Те, що ви сказали тут сьогодні, допомогло старому повірити, що його життя, присвячене служінню, не минуло марно».\n\nЗнову залишившись на самоті, Владімір поглянув у вікно. Якщо пощастить, зовсім скоро його володіння й справді сягатимуть значно далі."
 VYT.25.a: "Завжди до майбутнього."

 #VYT.26.t: "Less Frequent Bombings"
 #VYT.26.desc: ""
 #VYT.26.a: ""

 VYT.27.t: "Неспокійна корона"
 VYT.27.desc: "Як уже стало тривожно звичним, цар Владімір прокинувся від жахливого гупання в голові. Потягнувшись до пляшечки знеболювальних, до яких удавався вже надто реґулярно, він проковтнув піґулку й відчув, як біль стихає. Поки що.\n\nОстаннім часом міґрень, здавалося, викликало все. Засідання ради, що закінчувалися перекрикуванням радників. Доповіді про невдоволення й плутанину у війську. А може, думав цар, навіть Божа кара за численні гріхи. Тепер вона не давала йому спокою навіть уві сні.\n\nКоли він уперше ввійшов до Вятки всі ті роки тому, то й уявити не міг, що все буде так. Він виріс на розповідях про дива монархії й царську могутність. Тепер він знав, що це брехня. Його уряд був розколотий, армія паралізована, а народ знедолений. І дуже часто він почувався так, ніби взагалі не мав влади, був лише спостерігачем у чужій подорожі.\n\nАле ті розповіді про славу й могутність завжди супроводжувалися дуже серйозними розмовами про обов'язок. Він мав обов'язок перед своїм народом і Росією, і їх просто не можна було покинути, хоч як йому часом хотілося поїхати й повернутися до Бретані чи кудись іще далі.\n\nВін був царем і мав свій обов'язок.\n\nЯкий, принаймні зараз, полягав у тому, щоб підвестися з ліжка й підготуватися до дня."
 VYT.27.a: "Справді шляхетний тягар."

 VYT.28.t: "Мито"
 VYT.28.desc: "Попри владу цієї посади та її вирішальну роль у державній безпеці, майже повсюдною правдою є те, що прикордонникам мало платять і їм часто страшенно нудно; прикордонники Вятки не були винятком. Але посада мала одну вигоду - таку, яку голосно заперечували б, якби поруч був якийсь офіцер, здатний це почути.\n\nЧас від часу до певних переходів, відомих своєю поступливістю, у години, коли певні офіцери, як відомо, чергували, а інші, як відомо, ні, під'їжджали визначені вантажівки. Зупинившись перед воротами, водій усміхався охоронцям і разом із посвідченням та вантажним списком простягав конверт.\n\nОхоронці перевіряли документи й вантажний список та повертали їх, а конверт якимось чином зникав. Потім вони відчиняли ворота, й вантажівка проїжджала: вважалося, що товари у списку справді є товарами у вантажівці.\n\nТак, бути прикордонником означало приректи себе на малу платню й отуплюючі періоди бездіяльности. Але цінність тієї єдиної вигоди справді могла все компенсувати."
 VYT.28.a: "Так і шириться корупція."

 VYT.29.t: "Березниківський блюз"
 VYT.29.desc: "Алєксандр Казєм-Бєк, російський білоеміґрант, уперше долучився до політики ще до Другої світової війни як лідер младоросів. Їхні переконання охоплюють увесь політичний спектр, деякі з них доволі радикальні, тож багатьом важко зрозуміти ідеологію й кінцеві прагнення і руху, і відповідно його самого.\n\nПопри це, він був вірним прибічником царя під час Західноросійської війни, після якої отримав у винагороду губернаторство Березників. Березники, прикордонну територію в оточенні радикалів, Казєм-Бєк і його послідовники зрештою втихомирили, і всупереч усім очікуванням ця територія, тепер віцекоролівство младоросів, і вижила, і розквітла.\n\nСправді, у звітах царського представника Боріса Скосирєва описано і значний промисловий розвиток, і стале використання місцевих природних ресурсів. Ці ресурси, зокрема критично важливі нафта й нафтопродукти, реґулярно відправляють до князівства під пильним політичним наглядом самого Казєм-Бєка. Отже, він необхідний і для збереження миру в регіоні, і для постачання ресурсів із нього, і доки він це робить під ретельним наглядом Скосирєва, він зберігатиме свою посаду.\n\nПроте підозри членів нашого уряду щодо Казєм-Бєка не зникають, і багато хто каже, що постачання ресурсів триватиме лише до нагоди цілковито позбутися царської влади. Та поки що справжні мотиви Казєм-Бєка залишаються незрозумілими."
 VYT.29.a: "Невже він наважиться виступити проти нас?"

 VYT.30.t: "Зрада младоросів"
 VYT.30.desc: "Боріс Скосирєв, офіційний царський представник у Березниках, дивився у вікна свого кабінету й бачив, як швидко наближаються солдати «губернатора» Алєксандра Казєм-Бєка.\n\nДавно побоювалися, що одного дня незалежний у своїх поглядах Казєм-Бєк перестане слухати, відповідати й надсилати ресурси центральному урядові у Вятці. І цей день настав. Доповідь і попередження Охрани про неминучий прояв нелояльности Казєм-Бєка спеціяльний посланець приніс менш ніж годину тому. Надто пізно, щоб це дало якусь користь. Але часу якраз вистачило, щоб спалити все цінне.\n\nВін зітхнув. Казєм-Бєк ніколи не був прийнятним вибором на посаду губернатора. Його віра в синкретизм монархічних ідеалів із комуністичними впливами була не лише сміховинною, а й вихідною точкою, з якої сьогоднішній кінець був неминучим. Скосирєв лише сподівався, що цар устигне повернути непокірну територію, перш ніж на неї рушать релігійні фанатики з півночі чи ідеологічні фанатики з півдня.\n\nВідвернувшись від солдатів, Скосирєв кинув останній документ у вогонь поруч, підхопив наплічник і перевірив рушницю біля дверей. Можливо, він і не хотів дожити до цього дня, але готувався до нього. Шлях через ліс було розвідано, а човен біля річки заховано. Якщо пощастить, він невдовзі дістанеться кордону з Вяткою, а якщо пощастить більше - йому дозволять супроводжувати армію під час повернення до Березників.\n\nВід цієї думки Скосирєв усміхнувся. Він хотів бути там, коли Казєм-Бєка повісять."
 VYT.30.a: "Зраду не прощають."
 
 #Okhrana chain
 VYT.31.t: "Вятка: таємні справи"
 VYT.31.desc: "Валєнтін і Євґєній, аґенти Охрани, не розуміли, чому їх викликали розслідувати вбивство. Сам злочин не був у Росії особливо рідкісним і зазвичай належав до компетенції звичайної поліції. Євґєній прибув першим, і, посвідчивши свою особу перед поліціянтами, які раптом занервували, лише за кілька митей зрозумів, чому його покликали. Прибувши пізніше, Валєнтін зрозумів так само швидко.\n\nНещодавно було виявлено революційний осередок, відданий поваленню царя. Ім'я загиблого, чиновника Міністерства фінансів, було позначене як пов'язане з ним, а оскільки обох аґентів призначили до оперативної групи, що розслідувала діяльність осередку, вони відразу зрозуміли: зв'язок мусить бути. Чому цього чоловіка вбили й хто саме, досі було неясно.\n\nАле для осередку це був величезний ризик, і мусила бути причина. Причина, яку можна виявити, зрозуміти й простежити. Причина, яка з часом могла привести їх до ресурсів і зв'язків осередку, а отже, знищити його."
 VYT.31.a: "Це може бути важливішим, ніж здається."

 VYT.32.t: "Перевірка зачіпок"
 VYT.32.desc: "Валєнтін і Євґєній почали розслідування з обшуку будинку, де знайшли тіло. Дотримуючись підготовки, яку дали їм інструктори Смисловского, вони насамперед узялися визначити місце та знаряддя вбивства. Принаймні це виявилося простим.\n\nЧоловіка застрелили ззаду на кухні, судячи з рани - з малокаліберного пістолета. Гільзу поклали до пакета для дослідження, яке мало визначити тип і походження зброї. Наступним кроком був пошук доказів зв'язку чоловіка з осередком, щоб підтвердити підозри, які виникли щодо нього ще до смерти.\n\nЇх так само знайшли в коробці листів. Серед численних листів від рідних і друзів один вирізнявся. Надісланий «Качєствєнной доставкой», імпортно-експортною компанією, яка працювала по всій Західній Росії, він указував, що чоловік допомагав їй перевозити невизначені вантажі до промислового міста Іжевск і з нього.\n\nЩе один такий лист указував, що нещодавно він допоміг компанії придбати невеликий склад тут, у самій Вятці, й окремо подбав, щоб той розташовувався в малолюдній частині міста. Обидві зачіпки були багатообіцяльними, але аґентам треба було обрати, за якою йти самим."
 VYT.32.a: "Негайно вирушити до Іжевска."
 VYT.32.b: "Тоді до складу."

 VYT.33.t: "Складські зачіпки"
 VYT.33.desc: "Після кількох днів спостереження Валєнтін і Євґєній дійшли висновку, що склад покинутий. Упевнившись, вони швидко зламали замок на одних дверях і ввійшли. Величезний простір усередині був переважно порожній, тож аґенти почали шукати в конторі записи про відправлення.\n\nЗачіпка знайшлася швидко. Серед численних буденних вантажних списків виявилася низка перевезень між складом «Качєствєнной доставкі» й місцями в Іжевску, усі за сприяння того самого чоловіка - Коронованного Брюха.\n\nХоча аґенти підозрювали, що ім'я вигадане, помітивши його ще в кількох документах, вони повернулися до установи Охрани, щоб переглянути офіційні записи. Невдовзі вони знайшли його знову - у реєстрі адрес. Не зволікаючи, вони вирушили шукати чоловіка з дивним ім'ям."
 VYT.33.a: "Підемо слідом."

 VYT.34.t: "Обшук помешкання"
 VYT.34.desc: "«Помешкання Коронованного Брюха» було чим завгодно, тільки не помешканням. Невеликий будинок, хоч і доглянутий зовні, усередині був майже порожній: лише найнеобхідніші речі й майже нічого більше. Для тренованих очей Валєнтіна та Євґєнія це означало одне з двох. Або чоловік був крайнім аскетом, або, що ймовірніше, це була конспіративна квартира.\n\nСпираючись на підготовку й досвід, вони почали шукати в будинку зачіпки, матеріяльні чи інші, і невдовзі знайшли добре приховану потайну панель у підлозі. Під нею драбина вела до грубо викопаного льоху, де вони й знайшли те, по що прийшли.\n\nНа столі, заваленому картами й теками, одна тека особливо впадала в око. Папери в теці зі штампом «Таємно - план “Орел”», схоже, описували майбутню диверсію на промисловому заводі в Іжевску із застосуванням матеріялів, доставлених зі складу, який вони обстежили раніше. Розуміючи, що часу обмаль, аґенти зібрали теки й повернулися до штаб-квартири Охрани. Треба було негайно доповісти Смисловскому."
 VYT.34.a: "Нарешті щось конкретне."

 VYT.35.t: "Іжевський зв'язок"
 VYT.35.desc: "У князівстві промислове місто Іжевск добре відоме численними заводами, які тримаються навіть попри німецькі бомбардування. Серед них жоден не був важливішим за Іжевскій механічний завод, і, прибувши до міста, Валєнтін та Євґєній знали: якщо змова простяглася й сюди, завод, імовірно, є принаймні однією з її цілей.\n\nЗв'язок загиблого чиновника Міністерства фінансів з Іжевском слід було перевірити незалежно від інших здобутих відомостей, тож аґенти провели день, перевіряючи всіх його міських знайомих. Інших представників міністерства делікатно опитали, з компаніями, із якими він працював, сконтактували, а його колишні контори обшукали - усе безуспішно.\n\nПроте залишалося кілька конкретних заводів, згаданих у його листах, які ще можна було перевірити. Можливо, там знайдуться додаткові зачіпки."
 VYT.35.a: "Продовжити пошуки."
 VYT.35.b: "Попередити місцеву владу про план диверсії!"

 VYT.36.t: "Вибух на заводі!"
 VYT.36.desc: "На цьому заводі, як і на всіх інших, які Валєнтін і Євґєній перевірили за час перебування в Іжевску, кипіла робота. І, як і на всіх інших, ретельний пошук у документах не дав нічого цікавого. Усе змінилося в одну мить, коли вибух струсонув будівлю, перекосив підлогу й збив аґентів із ніг.\n\nРозуміючи, що час вибуху надто вдало обраний для випадковости, і до того ж усвідомлюючи, як їм пощастило опинитися на місці саме зараз, а не прибути згодом, аґенти квапливо отямлювалися. Біжучи проти натовпу робітників до місця вибуху, Євґєній помітив постать неподалік. Постать, яка здавалася аж надто спокійною.\n\nГукнувши Валєнтіна, Євґєній вихопив зброю й кинувся до неї. Він знав, як може знати лише слідчий, що ця людина причетна. Він не дасть їй утекти."
 VYT.36.a: "Він напевно належить до шпигунської мережі!"

 VYT.37.t: "Підозріла діяльність"
 VYT.37.desc: "Вирішивши відмовитися від перевірки контактів убитого чиновника й зосередитися на виявленому плані диверсії, Євґєній і Валєнтін повідомили місцеве бюро Охрани про розкриту змову.\n\nРазом із місцевими аґентами вони зібрали й відправили невеликі групи на багато найважливіших заводів міста, щоб шукати підозрілу діяльність і негайно діяти в разі її виявлення. Самі приєднавшись до однієї з груп, аґенти спостерігали за одним із таких заводів - головною ціллю, зазначеною у знайденому у Вятці плані.\n\nЗавдяки давно набутим і добре відпрацьованим навичкам спостереження Євґєній невдовзі побачив постать, що спершу наблизилася, а потім увійшла на завод. Євґєній, Валєнтін і група підтримки швидко пішли слідом. Наблизившись, Євґєній зрозумів, що людина прикріплює пристрій до одного із заводських паливних баків, і вихопив пістолет, гукнувши їй зупинитися. Постать миттю кинулася навтьоки.\n\nЄвґєній і Валєнтін почали переслідування, а місцеві аґенти взялися до пристрою. Євґєній подумки подякував за те, що аґенти були тут і допомогли. Йому не хотілося думати, що могло статися без них."
 VYT.37.a: "Ловіть його!"

 VYT.38.t: "Погоня"
 VYT.38.desc: "Помітивши наближення Євґєнія, постать кинулася бігти заводським комплексом, використовуючи численні труби, машини й інші перешкоди, щоб зникнути з поля зору та спробувати втекти. Але якщо ця людина думала, що так вийде, її явно ще ніколи не переслідувала Охрана.\n\nГнавши постать через поверх, крізь аварійні двері й далі вниз сходами, Євґєній уперше зміг добре роздивитися свою здобич. Чоловік був молодим, імовірно, йому ще не було тридцяти, і явно дуже фізично підготовленим. Настільки, що відривався від аґента.\n\nВибігши в холодне іжевське повітря з Валєнтіном одразу позаду, Євґєній зрозумів, що мусить вирішити, як найкраще впіймати ймовірного диверсанта."
 VYT.38.a: "І далі бігти за ним."
 VYT.38.b: "Розділитися й спробувати перехопити його."

 VYT.39.t: "Диверсант утік"
 VYT.39.desc: "Сподіваючись, що обрав правильно, Євґєній швидко пояснив Валєнтіну, що робити, і поновив переслідування диверсанта. На жаль, хоча він напружував тіло до краю, диверсант і далі відривався.\n\nКоли вони наблизилися до виходу із заводської території, диверсант віддалився ще більше. Євґєній зрозумів, що має чисту лінію вогню, і, знаючи, що ворожого аґента краще ліквідувати, якщо не можна запобігти втечі, сповільнився, щоб краще прицілитися, і за мить вистрілив тричі.\n\nОдин постріл влучив у плече диверсантові, але перш ніж Євґєній зміг вистрілити знову, постать, зробивши кілька непевних кроків, зникла в тіні. Євґєній вилаявся, а Валєнтін зупинився поруч, такий самий розлючений.\n\nОбидва аґенти знали, що залучать міських поліціянтів до пошуків диверсанта, і обидва знали, що це навряд чи приведе до арешту. Диверсант уже мав виконувати план утечі й за кілька годин буде глибоко в російських лісах, якщо не взагалі на території іншої держави.\n\nЄвґєній і Валєнтін перезирнулися з однаковими ґримасами. Це була велика поразка."
 VYT.39.a: "Глухий кут розслідування."

 VYT.40.t: "Дострокова відставка"
 VYT.40.desc: "Євґєній і Валєнтін стояли в кабінеті начальника, знаючи, що станеться. Обоє багато разів бачили, як це трапляється з іншими. Але, як і ті інші, завжди вірили, що з ними такого не буде.\n\nНачальник вислухав їхню розповідь. Як вони були на місці під час нападу в Іжевску. Як виявили диверсанта. А потім - як вони, що непростимо, дозволили йому втекти, позбавивши Охрану можливости допитати його й виявити інших членів осередку. Невдовзі їх звільнили.\n\nМинуло кілька днів, перш ніж рішення справді ухвалили, але всі знали, яким воно буде. Послуги Євґєнія та Валєнтіна більше не потрібні. Вони показали нездатність захистити царя і його країну, а Охрана не терпіла невдах у своїх лавах.\n\nТепер, ставши цивільними, аґенти муситимуть знайти нову мету життя. Мету, не пов'язану зі світом таємниць та інтриґ. Вони показали, що не мають для нього хисту."
 VYT.40.a: "У цьому середовищі успіх - необхідність."

 VYT.41.t: "Догана аґентам"
 VYT.41.desc: "Хоча спробу підриву іжевського заводу було зірвано, після повернення до штаб-квартири Охрани Євґєнія й Валєнтіна зустріли холодно.\n\nНа перший погляд, тиждень був вдалий. Великий напад, спробу підтримуваного з-за кордону антиурядового осередку дестабілізувати царську країну, було виявлено й відбито. Але диверсант утік, а разом із ним зник будь-який шанс Охрани глибше проникнути до осередку, а отже, і розгромити його. Охрана не славилася добротою до тих, хто не виконував свої завдання до кінця, і тепер до таких належали Євґєній та Валєнтін.\n\nПопри їхні здобутки, шанованими оборонцями країни їх не визнають. Ні, їх переведуть на канцелярську роботу до регіональної установи, далеко від столиці й будь-яких важливих розслідувань.\n\nЗвісно, вони й далі служитимуть цареві, але в спосіб, що більше личить їхнім «навичкам»."
 VYT.41.a: "Охрана не терпить дурнів."

 VYT.42.t: "Диверсанта схоплено"
 VYT.42.desc: "Сподіваючись, що обрав правильно, Євґєній швидко пояснив Валєнтіну, що робити, і поновив переслідування диверсанта. Поки Євґєній напружував себе й своє тіло до краю, диверсант намагався залишати позаду перешкоди, щоб сповільнити аґента. Це було помилкою.\n\nНа бігу Євґєній подумки почув голос Смисловского, який лаяв іншого аґента за те саме. Такі спроби лише сповільнюють тебе самого, казав він, і часто майже не заважають погоні. Тож, попри очевидну різницю у фізичній підготовці, Євґєній почав наздоганяти диверсанта. Він зрозумів, що за бажання міг би безперешкодно вистрілити.\n\nАле йому, їм, цей чоловік був потрібен живим. Він був їхнім зв'язком, наступною ланкою в ланцюгу осередку. Не можна було дозволити йому втекти. І, наближаючись до виходу із заводської території, Євґєній побачив, що той і не втече. Раптом з'явившись перед ним завдяки надлюдському зусиллю, Валєнтін врізався в диверсанта, повалив його й притиснув до землі.\n\nЄвґєній підбіг і притиснув пістолет до голови диверсанта, а Валєнтін приготував пута. Вони усміхнулися один одному. Це була велика перемога."
 VYT.42.a: "Він заговорить. Зрештою вони завжди говорять."

 VYT.43.t: "Помірний успіх Охрани"
 VYT.43.desc: "Наступного дня після вибуху на заводі це стало важливою новиною. Жахлива аварія, проголошували грубо друковані газети й радіостанції, що захлиналися перешкодами. Але те, що для громадськості було аварією, для Охрани було значно серйознішою справою.\n\nУспішне захоплення й подальший допит диверсанта дозволили Іжевській справі, як її стали називати, стати основою наступу Охрани на революційний осередок, виявлений певний час тому. Як аґент осередку, що, як тепер стало відомо, складався і з прониклих аґентів Революційного фронту, і з місцевих комуністичних та соціялістичних інакодумців, він зміг розповісти про його діяльність і надати відомості для встановлення особи своїх безпосередніх контактів.\n\nЗавдяки швидким діям в Іжевску Євґєній і Валєнтін разом із багатьма іншими вірними аґентами змогли за короткий час провести низку додаткових арештів і просунутися вище ланцюгом. Невдовзі здатність осередку проводити операції була суттєво підірвана, і хоча кілька його членів утекли, спроможність становити серйозну загрозу царському режимові було знищено.\n\nТож, попри нездатність зупинити напад в Іжевску, Охрана вважала загальний результат перемогою для себе, царя й непорушности монархізму як інституту."
 VYT.43.a: "Іноді доводиться жертвувати."

 VYT.44.t: "Величезна перемога Охрани"
 VYT.44.desc: "У країні, спустошеній громадянською війною, шпигунство є критично важливим знаряддям держави. Однак не менш важливий захист цієї держави від чужого шпигунства. Судячи зі швидких, рішучих і успішних дій, мало хто міг забезпечити такий захист уміліше за Охрану.\n\nІжевську справу, як її стали називати, згодом використовували як хрестоматійний приклад виняткової оперативної майстерности. Спираючись і на підготовку, і на інтуїцію, Євґєній та Валєнтін швидко перевірили зачіпки, отримані під час розслідування смерти чиновника. Так вони не лише запобігли серйозному терактові на критично важливому виробничому об'єкті, а й захопили ймовірного диверсанта для допиту.\n\nДопиту, який невдовзі привів до арештів інших - усі вони були членами досвідченого й відданого підривного осередку. Його знищення багато зробило для захисту держави, водночас засліпивши її ворогів і послабивши їхні зусилля.\n\nСамих аґентів щедро винагородили, хоча й таємно, з огляду на засекреченість усієї операції. Обох підвищили у званні, і вони працювали над удосконаленням відповідних відділів, підвищуючи їхню ефективність і майстерність у захисті держави, а завдяки цим зусиллям - і самого царя."
 VYT.44.a: "Люди мусять працювати на імператора, а не проти нього."

 VYT.45.t: "Завжди ще одна робота"
 VYT.45.desc: "«Мокрою роботою» називали низку численних непривабливих завдань, за які відповідала Охрана. Тож набуття вправности в мокрій роботі, хоч би якою вона була, і ще більшої вправности у збереженні таємниці про зроблене було головним способом здобути капітал, потрібний для внутрішнього просування. Євґєній і Валєнтін користувалися цією системою й раніше користувалися нею з великою користю для своєї кар'єри.\n\nІноді завдання були простими. Перехоплювати повідомлення, проводити облави на ймовірні конспіративні квартири, допитувати інакодумців, на яких донесли, тощо. Іноді - ні. Часом людей треба було знайти, загнати й доправити начальству, хоч би якою була побічна шкода для родин чи друзів їхньої здобичі. Майже всіх цих людей більше ніколи не бачили.\n\nТак, Охрана цінувала ефективність, а Євґєній і Валєнтін опанували це мистецтво завдяки підготовці, практиці й довгим годинам справжньої роботи. Як інакше назвати подвиг здобуття вирішальної зачіпки в наступі на підтримуваний з-за кордону повстанський осередок?\n\nЗ кожним виконаним завданням, із кожним знешкодженим ворогом Євґєній і Валєнтін піднімалися ще трохи вище в ієрархії Охрани, маючи кінцеву мету служити цареві й захищати його, хоч би якою була ціна чи наслідки."
 VYT.45.a: "Завжди знайдеться ще одна робота."
 
 #Gamer Vyatka events
 VYT.46.t: "Один день із життя Якова Рівкіна"
 VYT.46.desc: "Обережно, дбайливо Яков Рівкін поставив дві свічки в металеві свічники, які самі були дорогоцінним спадком від батька. За двадцять хвилин сонце зайде, робота припиниться й почнеться субота.\n\nЗапаливши сірник, він підніс його до свічок; тепло в руках нагадало про дружину й родину та почуття до них, які він вважав давно забутими. Коли свічки зайнялися, а сонце почало сідати, по кімнаті затанцювали тіні. Дві цятки світла перед ним стали палахкими вежами, кличучи до молитви перед очима Господа - і перед початком дня відпочинку.\n\n«Благословенний Ти, Господи, Боже наш, - почав він, глибоко вдихнувши й заплющивши очі, - Царю всесвіту, що освятив нас Своїми заповідями й наказав нам запалювати суботні свічки».\n\nСубота почалася, але Яков не розплющив очей. Він думав про євреїв світу, про стількох, кого забрали. Думав про дружину й дітей, перетворених на попіл. І, починаючи останнє благословення, не міг спинити сліз, що котилися щоками."
 VYT.46.a: "Тиха молитва супроти світового гамору."

 VYT.47.t: "Напад"
 VYT.47.desc: "Почувши вигук позаду, Яков Рівкін подумав, що знає, що зараз станеться. Люди з Російського охоронного корпусу, антисемітської банди головорізів, що видавала себе за монархічне ополчення, взяли за звичку чіплятися до нього на вулиці, знаючи про його походження. Вони ображали його, заступали шлях і взагалі поводилися так, щоб завдати якнайбільше клопоту. Але сьогодні все мало бути зовсім інакше. Значно гірше.\n\nКоли вони почали оточувати його, він спробував піти, але вперше один із них схопив його за плече. Міцно. Коли той відпустив, Якова вже оточили. А потім почалися образи, і Яков злякався. Цього разу вони не лише сипалися швидше - їх радше викрикували, ніж промовляли.\n\nОдин із чоловіків, відомий нащадок родини із заможної частини міста, близької до царя, витяг із кишені смужку бекону й запропонував Якову, лише щоб побачити, як той у відповідь хитає головою.\n\nІнший головоріз засміявся. «Борісе, - звернувся він до нащадка, - здається, брудний жид не цінує твоєї щедрости». Перш ніж Яков устиг заговорити, спробувати заперечити ці слова, Боріс вихопив із-за пояса кийок і вдарив. Коли Яков упав на землю, хапаючись від болю за голову, решта чоловіків дістали власні кийки й теж почали бити.\n\nКоли вони скінчили й почали шукати на його тілі золото, рублі чи інші цінності, Яков був непритомний. Люди на вулиці не втрутилися, боячись впливу родини Боріса.\n\nТа з непомітного кутка камера зафіксувала цю сцену й обличчя нападників. Нехай і чорно-біло, зате чітко."
 VYT.47.a: "Настане час розплати."

 VYT.48.t: "Імператорська відповідь"
 VYT.48.desc: "Цар Владімір сидів у приголомшеній тиші, поки Боріс Можаєв, син одного з його старших радників, розповідав про свої вчинки.\n\nСвітлина, на якій він із кількома іншими жорстоко бив одного з єврейських підданих царя, після публікації поширилася блискавично. І хоча цар завжди знав юнака як ідіота, раніше він не знав, що той затятий антисеміт. Про зв'язок батька юнака з ним самим говорили дедалі більше, і Владімір знав: треба діяти, і швидко. Коли він це сказав, очі юнака розширилися.\n\n«Государю, - почав він тремтячим голосом, - я знаю, що завдав вам і шкоди, і клопоту. Але благаю виявити милосердя. Якщо не заради мене, то заради мого батька, який пройшов із вами весь шлях від Бретані до вашого палацу тут». Він махнув рукою до вікна. «Наша родина завжди підтримувала корону, і якщо ви змилуєтеся, присягаю, що батько, а після нього і я завжди будемо перед вами в боргу, хоч би що знадобилося. Прошу, Ваша Величносте, не дозвольте справі одного жида перекреслити все, що ми зробили для вас».\n\nВладімір довго обмірковував його слова. Звичайно, він мусив виявити жаль щодо скривдженого чоловіка. Але родина Можаєва була впливовою, і нажити в ній ворогів після стількох років вірности могло спонукати інших запитати, чи до їхньої власної тривалої відданости поставляться так само погано. Помовчавши, він заговорив.\n\n«Гаразд. Я буду милосердним. Цього разу. Це не повториться. А тепер можете йти. Ми зайняті». Захлинаючись вдячністю, Можаєв швидко відступив, а цар покликав секретаря, щоб скласти листа скривдженому чоловікові.\n\nВін сподівався, що цього вистачить."
 VYT.48.a: "Але чи вистачить?"

 VYT.49.t: "Протести у Вятці"
 VYT.49.desc: "Сидячи за столом у кабінеті, цар Владімір чув натовпи надворі, що вимагали рішучішої відповіді на напад на Якова Рівкіна.\n\nХоча вони залишалися мирними й охоронці, які за ними стежили, не повідомляли про безлад, він хотів, щоб вони пішли. Він не думав, що міґрень мине, доки вони не підуть. Відкривши шухляду столу, він дістав чергове знеболювальне й швидко проковтнув піґулку. За мить стукіт у двері повернув його увагу, і він запросив відвідувача ввійти. Невдовзі всередину ступив Роман Ґуль, лідер реформістів.\n\n«Так? - запитав цар, не здатний приховати втому в голосі. - Раді щось потрібно?»\n\nҐуль похитав головою. «Ні, государю, наразі ні». Він усміхнувся й розвів руками. «Мене лише попросили провідати вас. Усі ми знаємо, як це важко». Обличчям міністра промайнула збентеженість. «Я хотів сказати: ми всі певні, що в несподіваній ситуації ви зробили все, що могли. У Росії, яку я пам'ятаю з дитинства, нікому й на думку не спало б протестувати за права єврея».\n\n«Тепер часи інші, - різко відповів цар. - Очевидно».\n\nҐуль кивнув. «Так, государю, інші. І, я б сказав, кращі. Навіть якщо спочатку, можливо, можна було впоратися краще, я, ми, знаємо, що ви вчините правильно».\n\nҐуль знову відчинив двері й, коротко вклонившись, вийшов, залишивши царя з думками, гамором натовпу надворі й міґренню. Вона не переставала гупати.\n\nВін знову відкрив шухляду й дістав чергове знеболювальне."
 VYT.49.a: "Як імператорові вчинити правильно?"

 VYT.50.t: "Колаборація імператора"
 VYT.50.desc: "ІМПЕРАТОР ВИЯВИВСЯ КОЛАБОРАНТОМ!\n\nПродовжуючи розслідувати обставини нападу на Якова Рівкіна та незмінну безкарність Боріса Можаєва, «Вятська трибуна» виявила приголомшливі масштаби минулої, а потенційно й нинішньої співпраці з Німецьким Райхом на найвищому рівні.\n\nНе таємниця, що цар Владімір III, правитель князівства й претендент на російський престол, допомагав силам Райху під час Західноросійської війни. Проте він стверджував, що ця допомога не була з його боку цілком добровільною. Документи, отримані «Трибуною», чітко свідчать: ці твердження неправдиві.\n\nКопії повідомлень, якими обмінювалися цар і німецькі представники в Бретані, колишньому місці царського проживання в роки вигнання, докладно змальовують історію амбітного монарха, готового поступитися і своїми ідеалами, і безпекою власної країни заради особистої влади.\n\nДокументи передруковано повністю в...\n\n(продовження на сторінці 2)"
 VYT.50.a: "Лавина набирає сили."

 VYT.51.t: "Мінімізація шкоди"
 VYT.51.desc: "«Це цілковитий безлад, - сказав Роман Ґуль, кинувши останній випуск “Вятської трибуни” на стіл перед зібраними палацовими посадовцями, - і цар хоче, щоб із цим розібралися. Зараз».\n\nРоки тому Ґуль працював у кількох совєцьких та інших виданнях, і цього досвіду, очевидно, вистачило цареві, щоб доручити йому мінімізувати наслідки.\n\n«Наразі, - почав він, - позбавте “Трибуну” акредитації, а на будь-які запити щодо цієї історії відповідайте, що це наклеп». Деякі посадовці заворушилися. «А потім, - продовжив він, - домовтеся про інтерв'ю з їхніми головними конкурентами. Нам треба донести свою версію подій».\n\nПеред працівниками довкола Ґуль демонстрував упевненість. Але подумки він знав: перемоги тут не буде. Звинувачення вже оприлюднені, шкоди вже завдано. І вже з'являлися нові твердження.\n\n«Трибуна» разом із багатьма іншими антиурядовими виданнями, що згуртувалися навколо неї, почала друкувати історії про царську родину. Про інші риси його вдачі. Про самого Ґуля, щойно його втягнули у вир.\n\nВін знав, що зрештою зможе зупинити потік неґативної преси. Кожній газеті потрібен доступ до уряду, щоб бути чимось більшим за крамольний листок, і «Трибуна» не виняток. Вони це невдовзі зрозуміють. Але його непокоїв час до того, як це станеться.\n\nІ єдиним, хто міг скоротити цей період, звернувшись просто до джерела всієї справи, був сам цар. Ґуль лише сподівався, що той ухвалить правильне рішення."
 VYT.51.a: "Принаймні хтось робить свою справу як слід."

 VYT.52.t: "Інший підхід?"
 VYT.52.desc: "Цар Владімір сидів за столом і дивився на лист перед собою. Останні кілька тижнів були нескінченним пеклом. Преса, рада, піддані й навіть нечисленні «посли» у князівстві не давали йому вирватися бодай на мить.\n\nСпершу напад на Рівкіна й те, як він повівся з Можаєвим. Потім його зв'язки з німцями під час життя в Бретані. А тоді - сама його відповідь на ці події! Якби не вірна служба Романа Ґуля, Владімір не думав, що витримав би. Але радник довів відданість, а ще дав добру пораду. Пораду, яка тепер лежала на столі.\n\nВін написав особистого листа Якову Рівкіну. Розповів про свої невдачі, жаль і смиренно запропонував відшкодування, просячи чоловіка про прощення. Звісно, лист стане відомим і його передрукують, а його знову цькуватимуть за спроби пом'якшити наслідки. За спроби приховати. Але серцем цар однаково знав: надіслати його - правильно. Він знав, що мав зробити це від самого початку.\n\nПроте коли знову почала насуватися міґрень, частина його збунтувалася. Чому він, цар і гордий член дому Романових, мусить принижуватися перед простолюдином? Чому б не спалити цей лист зараз і не поставитися до справи з тією самою зневагою, яку його родина виявила б п'ятдесят років тому?\n\nВін знав, що мусить ухвалити рішення. Міґрень убивала його..."
 VYT.52.a: "Надіслати листа."
 VYT.52.b: "Спалити листа."

 VYT.53.t: "Один лист із життя Якова Рівкіна"
 VYT.53.desc: "Дорогий пане Рівкін,\n\nШановний громадянине імперії,\n\nКілька тижнів тому на вулицях нашої столиці на Вас напали негідники через Ваше етнічне походження й релігію - подія, яку Ви, без сумніву, згадуєте з великим болем і мукою. Як Ваш суверен, ми просимо вибачення від імені нашої корони, а також за бездушний лист, написаний не нашою рукою, який ми надіслали без серйозного обміркування.\n\nВідтоді ми вагалися між засудженням ненависти, що скривдила Вас, і захистом власного становища, і за це також хочемо попросити у Вас вибачення.\n\nМи також усвідомлюємо, що наші вибачення, імовірно, мало важитимуть для Вас без учинків. Тому ми діятимемо. Вам і Вашій родині ми відшкодуємо будь-які втрати, завдані нападом. Особисто Вам ми надамо посаду, яку захищатиме моя імператорська влада. Заради всіх євреїв нашої імперії ми засудимо ненависть, яка так довго шкодила їхньому добробутові й виживанню.\n\nНаш довірений радник Роман Ґуль від самого початку благав нас “учинити правильно”. Справді туманне поняття для монарха, який не має заглиблюватися в моральність своїх дій.\n\nПроте цей останній абзац я присвячую Вам не як Ваш цар, а як одна людина іншій. Не знаю, чи буде Вам досить цього листа, але якщо Ви дасте мені можливість спокутувати свої минулі вчинки, я обіцяю перед Богом, якого ми обоє шануємо по-різному, що спробую.\n\nПідпис: Владімір Кірілловіч Романов."
 VYT.53.a: "Хоч якась подоба справедливости."

 VYT.54.t: "Краща доля"
 VYT.54.desc: "Яков Рівкін обернувся, щоб востаннє поглянути на ліси й річки довкола Вятки, столиці новонародженої «імперії» та його багаторічної домівки. Але вже не домівки.\n\nОдна рука досі була на перев'язі, а другою він підхопив велику шкіряну валізу з обома батьковими свічниками й усім іншим цінним, що мав. Вітер, який продував місто, колись нагадував йому про давній дім. Знову про колишню родину. Тоді його життя вже змінилося раз, а тепер змінювалося знову.\n\n«Якове! - гукнув голос. - Не йди сам наперед!» Поруч ішла Рахель, вдова Західноросійської війни й, на його думку, ангел, посланий Богом. Побачивши його, вона засміялася. «Твої руки ще не зовсім здорові, Якове, - дорікнула вона. - Давай. Допоможу». Забравши валізу, вона теж обернулася до міста. Вона доглядала його, коли ніхто інший не хотів, а коли він розповів їй про свої плани, попросилася з ним. Ангел, посланий Богом.\n\nПодорож до нового дому, хоч би де він був, буде довгою й небезпечною. Але Яков не боявся. Стільки років він зберігав віру в Бога, а Бог натомість зберігав вірність йому. Хоча він і хотів би залишитися.\n\nЗгадався бездушний, сухий лист, надісланий царем. Яков розумів і справді вірив, що сам цар не ненавидить ні його, ні його народ. Але двір чітко показав, що антисемітизм серед росіян досі живе й процвітає. Тому він мусив піти.\n\nВостаннє повернувшись до міста спиною, із Рахель поруч, Яков рушив назустріч новому життю."
 VYT.54.a: "Можливо, він знайде кращий дім."

 VYT.55.t: "Палкий аґітатор"
 VYT.55.desc: "Алєксандра Ісаєвіча Солженіцина оточували соратники з Національного союзу солідаристів (НТС), але будь-якому спостерігачеві однаково було ясно, що і баченням, і підтримкою він стоїть вище за них.\n\nХоч би куди він ішов, Алєксандра, людину скромного походження, вітали з досягненнями. Насправді він багато досяг на чолі НТС, який очолив після поспішного «від'їзду» попередника до Республіки Комі внаслідок чергової невдалої авантюри.\n\nПроте сьогодні він виступав на партійній конференції, і коли піднявся до трибуни, слухачі чекали слів свого харизматичного лідера. Але навіть вони не очікували, що він так виразно заговорить про майбутнє й кінцеву мету всієї партії.\n\nВін говорив про численні, незліченні вади комуністичного режиму. Говорив про численні, незліченні вади старої імперії. І нарешті заговорив про бачення майбутнього. Про відроджену Росію, збудовану на міцному підмурку націоналістичної гордости й військової сили, яка рушить повертати всі свої складові землі.\n\nКоли він закінчив, усі присутні, зокрема й він сам, не могли не бути певні: Росія неминуче знову повернеться до слави. І НТС під проводом Солженіцина очолить цей наступ."
 VYT.55.a: "Шлях повернення важкий."

 VYT.56.t: "Реформатор"
 VYT.56.desc: "Роман Борісовіч Ґуль знову був на вулицях Вятки, виступаючи зі своїми прихильниками за демократію й права меншин - та нехтуючи постійною загрозою нальотів німецьких бомбардувальників. Рушаючи до центру міста, він дбав, щоб усі, хто його бачить, знали: у своїй основі його заклик - це рівність у князівстві.\n\nПоки хода тривала, його підбадьорювали численні громадяни, які прямо чи інакше висловлювали підтримку й захоплення його зусиллями. Він сподівався, що одного дня цар Владімір скаже те саме. Хоча й не очікував цього скоро.\n\nДля Романа, який підтримував цю програму реформ від самого заснування князівства після Західноросійської війни, вести такі марші й закликати до реформ стало другою натурою. Справді, навіть не вважаючи власні дії новаторськими, він знав: якби тільки вдалося здобути прихильність царя та його міністрів, до Вятки можна було б принести справжні зміни.\n\nТінь авторитаризму розвіє світло демократії, а завдяки встановленню конституційної монархії Росія зможе шанувати минуле й водночас крокувати до майбутнього."
 VYT.56.a: "Шляхетна мета."

 VYT.57.t: "Мудрець"
 VYT.57.desc: "Додаючи останні штрихи до документа, Васілій Вітальєвіч Шульґін поглянув у вікно кабінету й спостерігав за людьми та автомобілями в центрі Вятки.\n\nВін хотів, щоб щойно завершену відозву прочитали всі мешканці князівства, а можливо, й люди деінде в Росії, тож вона мусила бути бездоганною. Так мало ще живих людей пам'ятало часи колишніх Романових: решту здолали вік, комуністична пропаґанда Бухаріна чи насильство й війна, які поглинули Росію. І Шульґін вважав своїм обов'язком, своїм призначенням знову поширити це знання. На його думку, якби він зумів це зробити, якби показав народові альтернативу нестабільності й чварам та шлях до величі, він міг би посприяти майбутньому відновленню царської влади над усією Росією.\n\nПісля годин перегляду Шульґін востаннє перевірив документ. Горда декларація стійкости російського народу й слави монархізму, вона, без сумніву, зміцнить дух громадян князівства. Шульґін не був пропаґандистом, але добре розумів: у важкі часи народові треба нагадувати і про відданість царя йому, і про таку саму відданість, якої очікують від нього натомість.\n\nУсім своїм єством Шульґін вірив, що врятувати Росію може лише повернення до імперії, у якій він колись жив, і до сильної центральної влади царя.\n\nІз глибокою повагою він підписав документ і залишив на столі. Завтра він відправить його до друкарні."
 VYT.57.a: "Повернення до давніх порядків."

 VYT.58.t: "Райх висадився на Місяці!"
 VYT.58.desc: "Росіянина, розчавленого десятиліттями гноблення, бідности, війни й терору, мало що ще може вразити, а отже, привернути його увагу. І все ж така подія сталася: оголошено, що Райх висадив людину на Місяці, розширивши межі людської присутности в Сонячній системі.\n\nХоча багато хто в уряді й країні, оточений руйнуванням та нуждою, сприйняв це як чергове нагадування про глибину падіння Росії, не всі реагують так само. Навпаки, інших це спонукає діяти.\n\nСеред них і сам цар, який прочитав численні доповіді про раптовий сплеск зацікавлення наукою, авіяційною інженерією та іншими складовими вищої освіти серед населення. Тому він заохотив розширення викладання цих галузей у школах князівства настільки, наскільки це практично можливо.\n\nІ хто знає? Може, а раптом, одного дня й росіянин дістанеться космосу."
 VYT.58.a: "Одного дня."

 VYT.59.t: "Західноросійська суверенна держава"
 VYT.59.desc: "Цар Владімір утретє поправив комір, хоча знав, що його ніхто не побачить.\n\nВін щойно закінчив запис звернення до своєї країни - тепер Західноросійської суверенної держави - і подивився на техніків, чекаючи підтвердження, що запис зроблено належно. Коли ті кивнули у відповідь, надто зосереджені на електронному обладнанні, щоб виявити належну пошану, цар підвівся й вийшов із кімнати.\n\nІдучи коридором, він думав, скільки мільйонів його почує. Звісно, усі росіяни в його власних землях. Так само росіяни й інші люди в Америці, Японії, Німеччині та Італії, коли звернення повторно передадуть пізніше того дня. Але чи дістанеться воно росіян на сході, розпорошених від Уралу до Тихого океану? Чи дозволять це тамтешні правителі, які здебільшого вже об'єднали власні держави? Він сподівався, що так, хоча й знав: протилежне ймовірніше.\n\nАле він також знав, що з часом дістанеться до них. Монархізм давно не був популярним у Росії, і все ж тут він переміг. Він вселив у людей віру в себе. У династію. Він допоможе повірити й їм.\n\nВін повернув увагу до сьогодення. Східні кампанії були в далекому майбутньому. Тут досі залишалося багато справ: від дебатів про майбутнє демократії до решток партизанів численних держав та ідеологій, розчавлених імперськими силами, і постійних суперечок про торгівлю та комерцію.\n\nВладімір знав, що для розв'язання цих та інших проблем доведеться зробити ще багато важких виборів. Він лише сподівався, що готовий їх зробити."
 VYT.59.a: "Із великою владою приходить велика відповідальність."
 
 VYT.60.t: "Очільник розвідки"
 VYT.60.desc: "Будівля була непоказною, а кабінет у ній - без оздоб. Чоловік, що стояв у дверях, нічим не вирізнявся. Стіл, на який він дивився, теж був невибагливий: простий дерев'яний брус із вицвілою підкладкою зверху. Але один предмет на ньому втримував його увагу - маленька бронзова табличка з вигравіюваним ім'ям: Боріс Смисловскій.\n\nДля будь-кого іншого ця будівля, цей кабінет були б неприйнятними, але для Смисловского, новопризначеного голови царської Охрани, вони були ідеальними. Це стало підсумком десятиліть праці, двох воєн, нескінченних політичних махінацій і до того ж вельми прикрої співпраці з німцями. Але все це було в минулому, а він дивився лише в майбутнє.\n\nСідаючи за стіл, він почав уявляти речі, які невдовзі через нього пройдуть. Карти. Списки. Числа. І багато іншого. Попри буденний вигляд будівлі, столу й чоловіка, невдовзі всі троє будуть залучені до деяких із найважливіших справ у всій Росії. Від цієї думки на обличчі Смисловского з'явилася рідкісна усмішка.\n\nО так. Йому сподобається бути головою Охрани."
 VYT.60.a: "Підозрюваний № 1, Фьодор Васільєв."

 VYT.61.t: "З далеких берегів"
 VYT.61.desc: "Коли невелике транспортне судно ввійшло до перської гавані, ніхто не звернув уваги на сивого вусатого старого, який заплатив п'ятнадцять доларів за проїзд, але не двадцять за каюту. Якби звернули, то могли б помітити і вогонь у його очах, і на диво м'язисту постать, яку не міг цілком приховати дещо пошарпаний одяг.\n\nНіколаю Румянцеву від народження судилося бути солдатом. Народжений за часів старої Російської імперії, він бачив корупцію та гниль своєї батьківщини й не міг із ними змиритися. Не терплячи армії своєї країни, але все ж прагнучи воювати, він вступив до Французького іноземного леґіону.\n\nМаршируючи від одного пустельного форту до іншого, наживаючи і друзів, і ворогів, він із часом став вважати Францію новим домом і ніколи не думав, що повернеться до Росії. Але війна змінила все. З німецькою перемогою леґіон охопив занепад, і зрештою Румянцев знову опинився без прихистку. Він думав знайти якусь іншу малу війну, щоб у ній загинути, але поразка пробудила щось давно забуте. Він був солдатом, так, але також росіянином.\n\nКоли до нього дійшла звістка про повернення царя Владіміра й створення в Росії монархічної держави, що присвятила себе боротьбі і з комуністами, і з фашистами, він зрештою зрозумів: мусить повернутися до землі свого народження, знайти свого царя й послужити йому в останній війні.\n\nХоч би яким був результат, він помре так, як жив: борючись."
 VYT.61.a: "Остання надія старого."

 VYT.62.t: "Зламане крило"
 VYT.62.desc: "Місячного зимового ранку небо здригалося від реву сотні двигунів. У російській анархії літаки над головою не були дивиною, але зазвичай вони віщували прибуття бомбардувальників Люфтваффе, одержимих руйнуванням. Лунали сирени, цивільні шукали укриття, а солдати стріляли з рушниць, намагаючись відігнати ворога. Коли німці вдосталь розважалися, оцінювали збитки. Заводи ремонтували, загиблих оплакували, і життя тривало. Але не сьогодні.\n\nСьогодні був день чистого неба й задоволеного народу. Літаки імперських повітряних сил ширяли вгорі, лишаючи димні сліди, коли перетиналися в повітрі, а кожен маневр глядачі внизу зустрічали здивованими вигуками й оплесками. Показ запланували на честь царя як демонстрацію сили новонароджених повітряних сил, але він також став рідкісною розвагою для мешканців Вятки. Усім працівникам, не зайнятим на життєво важливій роботі, дозволили прийти безоплатно, хоча країна, звісно, витратила на цей захід чималу частку пального й запасних частин.\n\nНа жаль для винуватця урочистости, авіяшоу було неабияким випробуванням нервів. Цар Владімір пишався підлеглим йому парком літаків, одним із найбільших у Росії, але не мав ілюзій щодо реальности. Ненадійні довоєнні винищувачі пілотували недовчені льотчики, які, здавалося, будь-якої миті були за кілька секунд від зіткнення. Уже те, що стільки літаків підняли в повітря без катастрофи, було дивом.\n\nІ все ж, навіть упиваючись пальцями в бильце крісла, Владімір не міг заперечити красу, яку бачив у їхньому потенціялі. Можливо, за належного фінансування й підготовки ця вбога зграя орлів навчиться панувати в небі."
 VYT.62.a: "Зламане крило можна зцілити."

 VYT.63.t: "Хто наважується, той перемагає"
 VYT.63.desc: "Хоча на їхніх одностроях красувався імперський орел, над чоловіками, що тулилися до стіни зі зчеплених колод, панувала тиша. Кожен стояв напоготові з рушницею в руках, тривожно чекаючи сигналу, який того дня вже чув сотню разів.\n\nПролунав свисток. Солдати рушили як один. Ривок до дальньої стіни - зброю тримати піднятою. Не зупинятися до надійного укриття. Дихати. Стежити за фланґами. Вишикуватися біля дверей. Перший вибиває петлі пострілом. Передовий боєць виламує ногою залишки й веде всередину. Решта заходить по одному. Двоє лишаються біля входу, пильнуючи несподіванки. Кожен рух стриманий, точний. Відпрацьований. Очі перевіряють усі кути, зброя прикриває кожен закуток. Усі, крім одного.\n\nДо шиї передового бійця притиснувся холодний металевий ствол. «Бах, ти мертвий», - пролунав страхітливий докір. «Ви всі мертві. Вам пиздець. Знаєте чому?» Чоловіки дивилися на чоботи чи в небо, але ніхто не наважувався глянути в очі лейтенантові Матвєєву. «Вам пиздець, бо ви поводитеся як звичайні солдати, а не імперські командос. Дев'яносто дев'ять разів зачищаєте будинок однаково. Свисток, біг, шикування, штурм. Ви перетворили це на рутину. То що станеться всоте, коли ваш любий лейтенант чекатиме в шафі, а не в кінці коридору?»\n\n«Нам... пиздець?» - нервово озвався хтось позаду зібраних солдатів.\n\nЛейтенант Матвєєв засміявся. Може, з них іще вийдуть бійці спеціяльних сил. «Вам пиздець. Добре. Повертайтеся на початок. Повторюємо»."
 VYT.63.a: "Попереду в них довгі дні."

 VYT.64.t: "Палиці й каміння"
 VYT.64.desc: "Працювати під дощем проіржавілими пилками й щербатими сокирами було невдячною справою, але необхідною теж. Для Алєксія й Кірілла це була єдина робота, яку вони знали від призову. Розбирати покинуті будівлі, щоб урятувати матеріяли, копати окопи й зміцнювати будь-яку можливу оборону - усе, аби укріпити кордони Вятки проти загроз, що чатували ззовні.\n\n«Не знаю, - сказав Алєксій. - Хіба раніше він не був трохи... більшим?» Молодий призовник не помилявся. Старий бункер бачив кращі дні. Підземна основа сховища справді була розлогою - лабіринт укріплень, придатний для понад сотні людей. Вони витратили більшу частину дня, розгрібаючи завали там, де обвалився дах. Тепер у бункері житимуть ті, кого зможуть виділити для вартової служби, а дах був низкою колод, обмазаних багном для захисту від дощу.\n\n«Був, - відповів Кірілл. - Але доведеться обійтися. Ми ж не з бетону зроблені». У російській пустці припасів завжди бракувало. Хто хотів вижити, вчився обходитися тим, що мав. У спорудженні укріплень це означало використовувати старі совєцькі об'єкти. Якщо не було бетону, шукали міцне каміння. Якщо каміння було нестійким, решту робили з дерева. А коли залишалася сама земля, копали окопи й обкладали їх мішками, набитими тією самою землею.\n\nНинішній об'єкт був значно кращим, ніж тоді, коли вони вперше прибули. Те, що починалося як купа розбитого бетону й іржавих металевих скоб, тепер стало напівпристойним редутом на північному кордоні Вятки. Рішучого штурму він не зупинить, але змусити потенційних нападників двічі подумати - для цього його вистачить. І цим доведеться задовольнитися."
 VYT.64.a: "Покваптеся, нам ще копати й копати."

 VYT.65.t: "Куля - дурепа"
 VYT.65.desc: "Капрал Ісаак Вєдєнін ненавидів нацистів. Можливо, тому, що був євреєм. Можливо, тому, що нацисти вбили його батька. Та найімовірніше тому, що десятки їх зараз намагалися вбити його.\n\nВони хвилями ринули через кордон, шалено мчачи до окопів, які охороняли східний фронт Вятки. Васілій побачив їх першим і здійняв тривогу. Невдовзі Васілію прострелили шию. Решта ґарнізону зайняла позиції. У вухах Ісаака дзвеніло, але він бачив, що товариші стріляють. Тож він теж стріляв. Натиснув на спуск. Хлоп. Натиснув знову. Нічого. Рушницю заклинило? Він розгублено глянув на неї. А, затвор. Треба пересмикнути затвор. Пересмикнув. Знову вистрілив. Нацист упав. Вони тікали. Вони перемогли?\n\n«ПРИПИНИТИ ВОГОНЬ! - кричав сержант Ісмайлов. - У нас мало набоїв!» Ісаак хотів запитати сержанта, як таке можливо, але тут пролунав тріск, і половина голови сержанта Ісмайлова зникла. Кров. Мізки. Його знудило. Інші кричали. Ідуть нові? Він визирнув за бруствер. Вони наближалися. Скільки їх? Він знову підняв рушницю. Руки тремтіли. Натиснув на спуск. Тепер на одного менше. Не забув пересмикнути затвор. Натиск. Клац. Нічого. Він подивився на інших. Потрібні ще кулі. Більше куль, щоб убити більше нацистів.\n\nУ всіх було порожньо. У вухах Ісаака й далі дзвеніло. Товариші виглядали наляканими. Кулі в них закінчилися раніше, ніж у нацистів закінчилися нацисти. Що нам робити, питали вони. Ісаак не знав. Сказав те, що спало на думку. «Багнети примкнути!» Вони розгубилися. Може, не почули. Він повторив голосніше. Вони примкнули багнети. А потім вистрибнули з окопу. Мчали вперед, кричали, піднявши рушниці. Скорочували відстань. Нацисти не хотіли, щоб їх закололи. Нацисти втекли."
 VYT.65.a: "А багнет - молодець!"

 VYT.66.t: "Стара ґвардія"
 VYT.66.desc: "Цар прокинувся від стуку в двері.\n\nВладімір уже звик, що його турбують рано-вранці. Він не міг пригадати жодної повністю проспаної ночі від заснування своєї юної імперії у Вятці. Завжди знаходилася якась справа, що потребувала його уваги. Терористичні бомбардування Люфтваффе були загрозою, якій вони ще не могли протистояти, і хоча вояки Імператорської армії стерегли кордони, надто часто за це доводилося платити кров'ю. І це ще не кажучи про внутрішні проблеми Вятки: від нескінченних чвар про майбутню роль монархії до розбитої економіки - важелями влади треба було керувати обережно. Тож попри нестерпну міґрень цар відкинув ковдру, вдягнувся й відчинив двері.\n\n«Ваша Величносте, - сказав збентежений ґвардієць, - прошу пробачення за перешкоду, але надворі чоловік, який вимагає особистої авдієнції. Відмовляється йти, не слухає голосу розуму».\n\nВладімір насупився. Такі вперті прохачі траплялися й раніше, але зазвичай, якщо не поступалися, то «слухали голосу розуму» під дулом рушниці. Невже його власна лейбґвардія боїться одного настирливого аґітатора? «І чому ви не змусили його піти?» - запитав цар із погано прихованим роздратуванням.\n\n«Ваша Величносте, цей чоловік стверджує, що служив в Імператорській ґвардії вашого кузена».\n\nЦе змусило його замислитися. Таких уцілілих залишилося зовсім мало. Ті, хто не перебіг до большевиків, билися з ними в кривавому вирі після їхньої революції. Багато хто почав нове життя в еміґрації. Ще більше загинуло. Якщо цей чоловік справді той, за кого себе видає, то чого він шукає?"
 VYT.66.a: "Впустіть його. Я поговорю з цим чоловіком."

 VYT.67.t: "Авдієнція з привидом"
 VYT.67.desc: "Стєпан Алєксандровіч Новіков виявився не таким, як очікував цар Владімір. Він був обвітреним уламком минулого, що спирався на давно несправну рушницю, аби втримати власну вагу. На лівій руці бракувало двох пальців, на правій - ще одного. Борода була сива й кумедно нерівна, немов він намагався підрівняти її до авдієнції. Найдивніше ж те, що старий був доволі балакучим - риса, якої нечасто шукають у ґвардійцях і не цінують у присутності імператорів. Відколи він відрекомендувався, то майже не спинявся, щоб перевести подих.\n\nСтєпан говорив про гордість, яку відчув, коли його обрали до Імператорської ґвардії царя Ніколая II. Говорив про огиду, коли сотні товаришів покинули монарха перед лицем революції. Говорив про полегшення, що знову міг битися за царя в Білій армії, а тоді про скорботу через їхню гірку поразку. Говорив про відмову служити Союзові й роки еміґрації у Франції. Говорив про повернення до Росії після падіння Франції. Говорив про довгі роки на батьківщині, яка більше не здавалася його власною, про те, як дивився, коли її рвали спершу гнобленням, а потім вторгненням. Говорив про тисячі чоловіків і жінок, що на його очах гинули за режим, який їх не цінував. Говорив про війну, різанину й крах, про розбиту Росію, якій потрібна надія. Говорив про спробу приєднатися до монархістів у Західноросійській війні й про полон у совєтів, перш ніж устиг це зробити. Говорив про в'язницю, каторгу й тортури. Говорив про зухвалу втечу, яка ледь не коштувала йому життя, і подорож до Вятки. Говорив, доки Владімір його не перебив.\n\n«Чого ви хотіли б нас попросити?»\n\nСтєпан нарешті спинився перевести подих."
 VYT.67.a: "«Ваша Величносте, я хотів би служити у вашій лейбґвардії»."

 VYT.68.t: "Довірена особа імператора"
 VYT.68.desc: "У Вятці дощило. Хоча зазвичай звуки бурі заспокоювали, для Владіміра вони стали тортурами. Часті царські міґрені останнім часом погіршилися, і кожна крапля, що вдаряла у вікно, була немов удар кулаком у голову. Хіба мало того, що вдень він мусив давати раду лютим перекрикуванням і жахливим бюджетним звітам? Невже хоча б ночі не могли належати йому? Знову вдарив грім. У своїх покоях Владімір спочинку не знайде. Він підвівся з ліжка й узяв портсиґар. Може, допоможе прогулянка.\n\nКоридори імператорської резиденції були розлогі, хоч і бідно оздоблені. Називати її палацом було смішно - Владімір відмовлявся наділяти цим почесним найменуванням своє нинішнє осіддя влади. Але воно було його - усі потріскані сходи й кожен вицвілий портрет. Невже такою буде його спадщина? Пил на його подобі в якомусь забутому залі?\n\nЦарські роздуми перервав знайомий голос. «Ваша Величносте, - прохрипів Стєпан Новіков із добре відпрацьованим військовим вітанням. - Усе гаразд? Уже пізно».\n\nНайновішому й водночас найстаршому членові Владімірової лейбґвардії пильности точно не бракувало. За тижні від вступу він довів, що цілком здатен виконувати обов'язки, на які нарікали вдвічі молодші чоловіки. Владімір замислився над запитанням. Що поганого в тому, щоб бути відвертим із людиною, що склала йому присягу? «Ні. Голова, блядь, просто вбиває мене».\n\n«Послати по лікаря, Ваша Величносте?» В очах була тривога. Щира.\n\nВладімір недбало махнув рукою, дістав цигарку з портсиґара й запропонував її поважному захисникові. «Ні. Але можете покурити зі мною. І можете послухати»."
 VYT.68.a: "Та сну немає голові в короні."

 VYT.69.t: "Візит на фронт"
 VYT.69.desc: "У російській анархії ніколи не можна було бути спокійним. Це було правдою і для людини, і для держави, і ніде не виявлялося так виразно, як на східному кордоні Вятки. За низкою бункерів та окопів лежав мерзенний уділ Арійського Братства. Останнім часом вони знахабніли, і хоча кожен їхній наступ стримували, без втрат неминуче не обходилося. Тож цар зі своїм почтом вирушив відвідати вояків, які захищали імперію від невимовного жаху.\n\nРадники Владіміра заперечували проти його рішення відвідати фронт. Це небезпечно, застерігали вони. Ще більше вони заперечували проти того, кого він обрав для супроводу. Вони не вважали Стєпана Новікова придатним для його захисту. Багато молодших і сильніших чоловіків радо віддали б за нього життя. Але на кордоні Владімірові потрібна була не молодеча сила. Йому потрібні були пильне око й уважне вухо. Стєпан мав і те, й інше.\n\nЗастава була готова до його прибуття. Перед казармою гордо майорів прапор Вятки, а під ним сорок солдатів стояли струнко - шляхетні оборонці, які лише два дні тому відбили арійський рейд. Цар проходив повз них одного за одним, даруючи теплу усмішку чи міцно кладучи руку на плече. Проте подія залишалася урочисто-сумною. Він не сумнівався, що кожен тут утратив на фронті друга. Йдучи далі вздовж лави, він побачив, як солдат лізе до кишені. Подарунок?\n\nА потім Владімір уже був на землі. Кілька пострілів. Крики. Він спробував підвестися. Кров. Стільки крови. Його? Ні. Стрільця повалили на землю. Дванадцять чоловіків оточили царя. Але не Стєпан. Де Стєпан?\n\nТієї миті Владімір зрозумів, чия кров заплямувала його одяг."
 VYT.69.a: "Остання жертва лейбґвардійця."

 VYT.70.t: "Звитяга цілого життя"
 VYT.70.desc: "У Вятці дощило.\n\nУ такий скорботний день небесам личило плакати. Стєпан Новіков, лейбґвардієць царя Ніколая II й царя Владіміра III, приніс найвищу жертву. Завдяки його пильності й швидким діям імператор досі жив. Похорон старого солдата був величною подією, публічним заходом, що наповнив вулиці Вятки скорботними людьми. Солдати вишикувалися вздовж доріг, охороняючи процесію на чолі з каретою на її шляху до імператорської резиденції.\n\nВладімір знав, що наприкінці процесії від нього чекають промови. Але думати міг лише про миті, які мали стати його останніми. Тріск. Крики. Кров. Кров Стєпана. Шляхетного чоловіка, який понад чотири десятиліття шукав нагоди служити законному цареві. Хороброго чоловіка, який помер лише через кілька місяців після того, як знайшов шукане. Що можна сказати про нього, аби належно вшанувати таку душу? Що можна сказати, чого вже не показали його вчинки? За короткий час знайомства Владіміра зі Стєпаном Новіковим того вела одна непорушна засада - служіння. Служіння своєму цареві, своїй Батьківщині, її народові. Він віддавав усе тому, у що вірив.\n\nКоли похоронна процесія наблизилася, Владімір підійшов до краю балкона. Він бачив, як дощ б'є по будівлях із дірявими дахами й недостатньо утепленими стінами. Бачив сотні солдатів, що марширували в надто тонких куртках із надто старими рушницями. Бачив тисячі чоловіків і жінок, які йшли за ними у зношеному взутті й із порожніми шлунками. Бачив майбутнє Росії. Бачив Вятку. Бачив країну, якій потрібне служіння. Країну, якій він служитиме.\n\nВладімір став за трибуну й приготувався говорити."
 VYT.70.a: "Ми зібралися сьогодні, щоб ушанувати життя Стєпана Алєксандровіча Новікова..."
 
 VYT.71.t: "Годі сваритися"
 VYT.71.desc: "Цар Владімір III сидів у своєму кабінеті в Імператорському палаці Вятки. Він чекав на лідерів політичних фракцій князівства, яких скликав обговорити майбутнє країни. О дванадцятій почув за дверима підвищений голос Солженіцина. Той, без сумніву, був спритним політиком, але, Боже ж мій, яким гучним. Двері кабінету розчахнулися, і троє наймогутніших людей Вятки ввійшли до кімнати. На щастя, увійшовши, Солженіцин стих. Вони привітали царя й сіли.\n\n«Вітаю, панове, дякую всім, що прийшли», - почав цар. Обмінявшись звичними люб'язностями, Владімір заговорив знову. «Як усім вам добре відомо, у прийдешні місяці ми готові почати повернення Росії. Проте, щоб мати хоч якийсь шанс на успіх у цьому випробуванні, ми мусимо виступити єдиним фронтом. Зрадники й сектанти, які нас оточують, використають будь-яку ознаку розколу, щоб нас знищити. Благаю кожного з вас: відкладіть поки що ваші розбіжності. Усі наші зусилля мають бути спрямовані на втихомирення й об'єднання Росії».\n\nНа мить він побачив на їхніх обличчях сліди подиву: вони не звикли до такого твердого тону. Першим озвався Роман. «Певен, я говорю за всіх нас, коли кажу, що ми радо відкладемо розбіжності заради блага Росії». Шульґін і Солженіцин кивали, хоча Солженіцин, здавалося, неохоче. «Проте, мій царю, усі ми розуміємо, що в довгостроковій перспективі нинішній стан нестійкий. Щойно Західна Росія опиниться в наших руках, мусить бути якесь розв'язання».\n\nВладімір згідливо кивнув. «Згоден. Коли війни за Західну Росію скінчаться, ми мусимо нарешті визначити майбутнє імперії». Зустріч затягнеться до пізнього вечора, і, готуючись піти до своїх покоїв на ніч, Владімір проковтнув особливо велику дозу знеболювального, щоб приглушити міґрень, із якою прожив увесь день."
 VYT.71.a: "Тимчасове рішення."
 
 VYT.72.t: "Зроби свій внесок!"
 VYT.72.desc: "Алєксандр Іґорєвіч Самарін сидів у вітальні після довгого робочого дня на заводі. Він нахилився, увімкнув старе пошарпане батькове радіо й слухав музику. За якийсь час вона урвалася на рекламу. Алєксандр уже збирався пропустити її повз вуха, коли заграв бадьорий військовий марш. Трохи здригнувшись, він уважно прислухався до слів.\n\n«Молоді чоловіки Росії відгукуються на поклик обов'язку перед своїм царем і країною, щоб принести спасіння всій Росії. Від найвіддаленіших сіл до найжвавіших міст і юнаки, і ветерани вступають до Імператорської армії. У ці непевні часи чвар і війни ми мусимо залишатися пильними. Нацисти й комуністи нападають на нашу велику імперію, і саме від вас може залежати, що чекає нас - перемога чи рабство».\n\n«Хоробрі душі, які запишуться сьогодні, отримають нагоду служити ближнім у великих царських арміях! Збудувати міцну дружбу й відчути братерство з товаришами-солдатами! Захистити близьких від зазіхань і фашистів, і комуністів!»\n\n«Усі, хто вступить, матимуть право на додаткові пайки для родини, пенсію та різноманітні інші довгострокові пільги. Бажаєте здобути освіту вищу за початкову? Усім новобранцям буде надано субсидовану середню й вищу освіту. Бажаєте знати більше? Тоді завітайте до найближчого призовного пункту вже сьогодні! І пам'ятайте: служба ґарантує добробут!»\n\nКоли реклама стихла й знову заграла музика, Алєксандр не міг не поринути в думки про вступ. Річ була не обов'язково в патріотизмі - політика йому, правду кажучи, була байдужа, - але пільги приваблювали. Буде небезпечно, та він не міг не думати про батьків. Вони старіли, і допомога їм точно згодилася б.\n\nВін просидів там годинами, все зважуючи, а потім схопив пальто й вийшов у холодне повітря, уже вирішивши. Рано наступного дня його відправили до навчального табору - воювати за царя."
 VYT.72.a: "Маркетинґ у найкращому вигляді."
 
 VYT.73.t: "Марш чобіт"
 VYT.73.desc: "Дімітрій дивився зі своєї квартири, як вулицями марширує Імператорська ґвардія. Уперше в житті він бачив їх такими... жвавими. Сам він був лише робітником: ледве заробляв на життя у Вятці наймитом, перш ніж прийшов працювати до імператорської винокурні. Навіть коли він був наймитом, військо з'являлося рідко й лише для збору податків чи вигнання бандитів. У місті воно радше виконувало поліційні обов'язки, але аж таким суворо дисциплінованим усе ж не було. Тепер це була справжня дисциплінована армія.\n\nВід декого з друзів він чув, що заводи переорієнтовують на військове виробництво. По всьому місту було видно пропаґандистські листівки й чути радіорекламу, яка закликала таких юнаків, як він, вступати до війська. Дімітрія це не цікавило: він хотів жити. Зрештою, він дочекався кінця бомбардувань, із якими вчився миритися все життя, і не збирався помирати тепер, коли бомби щойно перестали падати.\n\nПроте він також знав, що це означає для міста. Вятка стояла на відкритому місці, й напасти на неї було легко. Бандити не пробували через власну неорганізованість і міську оборону, але Вятка не планувала воювати з бандитами. Ні, цар хотів піти війною на ворогів заради відновлення своєї влади над усією Росією. Це означало воєнний стан у місті й армію, яка захищатиме його від будь-якого ворога. Він боявся, що місто навіть може стати полем бою, розірваним на шматки артилерійськими снарядами.\n\nТа не було сенсу тривожитися через те, що може статися: це пішло б на користь його розумові. Мати завжди казала, що розум часом є найбільшим ворогом людини, і мала рацію. Треба було далі працювати, бо хто знає, що станеться, якщо ні. Тож він пішов на роботу до винокурні, а солдати й далі марширували вулицями, офіцери вигукували накази, і сама війна була в них на вустах."
 VYT.73.a: "Барабани війни б'ють дедалі гучніше."
 
 #Smuta tree events
 vyatka.smuta.1.t: "Вятський парад"
 vyatka.smuta.1.desc: "Чекаючи початку параду, Владімір сидів на краєчку сидіння - і буквально, і від хвилювання.\n\nНа передньому сидінні кутастого автомобіля, нещодавно пристосованого до цієї нагоди, Владімір міг думати лише про те, що може піти не так. Справедливости заради, причин хвилюватися було більш ніж досить. Значну частину армії становили новобранці, юні хлопці, які ще навіть не брали участи в параді, не кажучи вже про війну.\n\nБагато хто сумнівався у здатності країни об'єднати довколишні дрібні держави - не лише його вороги, а й люди всередині країни. Цей парад мав довести їм, що його армія щонайменше не поступається іншим. Отже, успіх був критично важливим.\n\nТа коли автомобіль рушив дорогою під вітання натовпу, страх і скепсис почали танути, поступаючись обережному оптимізмові. Довкола колони солдатів у щойно випрасуваних одностроях марширували дисципліновано й злагоджено, а звук чобіт відбивав рівний ритм метронома. На обличчях була сталева, незламна рішучість. Якби Владімір не знав правди, то вирішив би, що це парад справжньої європейської армії чи навіть давньої Російської імператорської армії.\n\nАвтомобіль зупинився перед сценою, і цар розмірено підійшов до трибуни. Навмисно: сидячи в машині, він зрозумів, що промова, яку так ретельно готував минулого вечора, повна всіляких закликів до вдосконалення, марна. Він підійшов до мікрофона й раз постукав по ньому, перш ніж заговорити.\n\n«Вірні громадяни. Чекати довелося довго».\n\nВін дав тиші повиснути в повітрі; зібраний натовп аж розпирало від очікування."
 vyatka.smuta.1.a: "«Ми готові. Час повернути нашу країну»."
 
 vyatka.smuta.2.t: "Солдатський цар"
 vyatka.smuta.2.desc: "Якби його запитали - наодинці, щоб не почули бюрократи, - Владімір, мабуть, визнав би, що ця частина роботи подобається йому більше за звичайну. Звісно, інтелектуальний виклик великої стратегії й амбітних планів має свої переваги, але тривале перебування в палаці неймовірно відривало від життя.\n\nКрім того, часом Владімірові потрібна була правда, а що може бути ближчим до правди, ніж на власні очі побачити своїх солдатів? Принаймні так він думав до прибуття. Цей конкретний візит на одну з передових здавався настільки ретельно поставленим, що цар почувався черговою лялькою в чиємусь дитячому наборі для гри.\n\nБагато солдатів, здавалося, передусім благоговіли. Намагаючись виглядати велично на танку, Владімір на мить поринув у власні думки, але погляд на сталеві обличчя вояків швидко повернув його до реальности. Так, ця робота нудна, але солдатське завдання - битися, страждати, помирати за свою країну. Він же тут лише для кількох світлин і, якщо вдасться, невеликого піднесення їхнього духу. Невже це так важко?\n\nТож він усміхався солдатам, легко рухаючись крізь натовп і тиснучи руки. Формальності зникли, натомість прийшла вся привітність, на яку він був здатний. Розмови плинули природно, щохвилини стаючи легшими. Було видно, що солдатам це подобається, та й йому самому, правду кажучи, теж.\n\nКоли час добіг кінця й радники хутко повели його геть, він розмірковував про ту єдину годину, проведену там. Вона, безперечно, здалася значно коротшою. І хоча він не міг сказати, що вони вважатимуть його другом, сподівався, що принаймні бачитимуть у ньому людину з народу."
 vyatka.smuta.2.a: "Для них - день, якого ніколи не забудуть. Для нього - черговий вівторок."
 
 vyatka.smuta.3.t: "Імперське правосуддя"
 vyatka.smuta.3.desc: "Хоча день лише починався, усі - і двір, і представники медій, і решта присутніх - прибули вчасно, ущент заповнивши велику залу. Сам цар теж був тут, сьогодні в повних реґаліях. Його обличчя, суворе, як у шкільного вчителя, навіть у найщасливіші дні, тепер застигло в непроникній задумі.\n\nКоли всі сіли, Владімір почав говорити, помітно відкинувши формальності й читаючи підготовлений текст.\n\n«Доброго ранку, - почав Владімір. - Друзі, за останні кілька років наша країна значно зросла. Нам є що святкувати. Але разом із нашим добробутом і силою зростали й наші вороги. Саме тому ми сьогодні тут».\n\nВін замовк. Коли заговорив знову, голос став сильнішим, владнішим.\n\n«Ті, хто й далі зухвало виступає проти імперії, слухайте! Ви можете ухилятися від нас, ховаючись від давно заслуженого правосуддя, але не втечете назавжди. І коли вас упіймають - а вас упіймають, - ви постанете перед народним судом імперських трибуналів».\n\nЗібраний натовп підвівся з оплесками, пролунали радісні вигуки, а ляскіт долонь відлунював залою. Владімір не втримався від усмішки, а тоді на мить зібрався. Коли оплески вщухли й натовп сів, він приготував наступні слова: рішучі, але тихіші за попередні.\n\n«Не помиляйтеся щодо нас. Ми не поспішаємо гніватися, але не ухилятимемося від обов'язку перед народом. Бандитів, колаборантів і комуністичних зрадників судитимуть - але судитимуть справедливо! Будьте вдячні: вас судитиму не я, а справедливе народне правосуддя»."
 vyatka.smuta.3.a: "«Зло не залишиться безкарним. Народ про це подбає»."
 
 vyatka.smuta.4.t: "Ось так кінчається світ"
 vyatka.smuta.4.desc: "Спочатку зі старим комуністом поводилися добре. Він отримав їжу, ковдру й навіть жарт-другий від молодого гладко виголеного солдата, який, очевидно, був його допитувачем. Усе це триватиме, сказав юнак, якщо він просто вчинить правильно.\n\nОстанні кілька годин були зовсім іншими за тоном - і методом. Він не знав напевне, скільки часу минуло від початку допиту, але короткі спалахи болю наче розтягувалися у вічність, уривчасто стихаючи лише для того, щоб юнак прошепотів, як легко все це зупинити. Щоб триматися, потрібні були всі сили, але багаторічний досвід добре йому прислужився. Він не здасться так легко.\n\nРаптом, нарешті, біль припинився. Юнак підвівся й зібрався йти. Попри відсутність поступу, він здавався напрочуд спокійним і навіть посміювався на виході. Хоч яким слабким був старий Лєонід, це його стривожило, і він запитав юнака, чому той такий веселий.\n\nЧоловік затримався, а тоді обернувся. «Ти лише поглянь на себе! Такий гордий, такий сильний, такий непокірний. Але з такими, як ти, ми вже мали справу: кожен має свою межу».\n\nВін зневажливо похитав головою. «Ти опираєшся, а заради чого? Мертвої країни? Друзів, які розбіглися за найменшої скрути? І на мить не думай, що хтось тебе врятує. Твій комунізм такий самий мертвий, як твої гнилі товариші, більшість яких плазувала в нас у ногах. А тепер на добраніч. Певен, ти ухвалиш правильне рішення».\n\nДвері зачинилися, і старий Лєонід залишився думати на самоті. Навіть намагаючись заснути, він не міг позбутися цієї думки. У глибині душі, якщо бути чесним із собою, в одному цей чоловік мав рацію."
 vyatka.smuta.4.a: "У Західній Росії для комунізму не залишилося надії."
 
 vyatka.smuta.5.t: "Останні подихи революції"
 vyatka.smuta.5.desc: "Часом аґент Олєґ хотів мати іншу роботу. Його праця була важливою, але часто ризикованою - і безумовно брудною. Вони з колеґою щойно прикінчили ворожого офіцера в провулку. Початковий план - «перевести» офіцера туди, де його було б легше ліквідувати, - провалився, тож Олєґ одразу перейшов до плану Б: вистрілив бідоласі в обличчя з пістолета.\n\n«Який жах, еге ж?» - видихнув колеґа, штовхнувши тіло ногою. «Товстенький. Забагато їв: багато крови в ньому було. Треба було стріляти ближче до канави. Тепер цього товстуна важко буде пересунути. Гей, допоможеш?»\n\n«Не знаю, друже», - неспокійно відповів Олєґ. Кров збиралася біля ніг трупа густими потворними згустками; солодкавий металевий запах розносився нічним вітерцем. «Просто здається, що є легший спосіб. Хіба в нас немає в'язниць, судів? Ми ж можемо цілком упоратися з ними там».\n\nКолеґа спинився й витріщився на нього. «Послухай. Припустімо, ми залишимо когось із цих людей живим. Що, на твою думку, вони зроблять? Нагадаю: ти підданий тієї самої імперії, яку комуністи намагалися розібрати. Вони прийдуть по нас! Одного разу вони вже ледь не знищили Росію. Отримають нагоду - зроблять це знову».\n\nОлєґ не відповів, у повітрі зависла незручна пауза. Зітхнувши, колеґа продовжив, цього разу стриманіше.\n\n«Слухай, просто пам'ятай: не те щоб у нас був вибір. Здається, що це небагато, але наша робота зберігає стабільність країни. Вважай нас щитом суспільства. Пам'ятай наш провідний принцип: усе для імперії».\n\nОлєґ голосно зітхнув, кивнув, а тоді нахилився, щоб узяти тіло."
 vyatka.smuta.5.a: "Краще вони, ніж ми."
 
 vyatka.smuta.6.t: "Сонце сходить"
 vyatka.smuta.6.desc: "Вони це зробили.\n\nУперше за роки Західна Росія тепер об'єдналася під одним прапором. Погляд назад дав йому усвідомити масштаб досягнення. Вони пройшли від уділу до справжньої держави, здавалося, за мить, усупереч усім очікуванням, зокрема його власним. Комуністи думали, що давно вбили імперію, що імперський режим мертвий і похований. Натомість, немов Лазар, Російська імперія знову постала, повернувшись на належне місце: справжнє диво, та й годі.\n\nТа ці роздуми привели й до інших думок, насамперед про те, скільки ще лишилося зробити. Звісно, Західна Росія була досягненням, але більший виклик чекав у прийдешні роки. Одна річ об'єднати цей регіон - зовсім інша простягнути кордони за Уральські гори, не кажучи вже про тисячі кілометрів походу до Тихого океану.\n\nНагальнішим клопотом було те, що заплутана політика Вятки знову підніме свою потворну голову. Більше їх уже не задобрити: треба починати перетворення Вятки на належну конституційну монархію й проводити перші вибори. Владімір цього аж ніяк не чекав із радістю. Доведеться втрутитися в цю справу й по лікті зануритися в багно, щоб видобути з нього бодай якийсь порядок. Неприємно, але необхідно, бо який іще в нього вибір?\n\nГоловний біль повернувся - той проклятий пронизливий біль у передній частині голови. Він підвівся шукати ліки, вирішивши поки що відкинути ці думки. Зрештою, клопоти можуть почекати до іншого дня."
 vyatka.smuta.6.a: "Сьогодні він насолоджуватиметься перемогою."

 #Expansion tree events
 vyatkaexp.1.t: "Пропозиція від царя"
 vyatkaexp.1.desc: "Багато років Алєксандр Казєм-Бєк і цар Владімір III із Вятки були політичними союзниками. Саме цар призначив Казєм-Бєка губернатором Березників і дозволив йому далі розвивати там рух младоросів.\n\nХоча відносини певний час тому зруйнувалися й Казєм-Бєк відокремив нас від центрального уряду у Вятці, цар, здається, рішуче прагне так чи інакше повернути свою владу до Березників.\n\nМи готові битися, але царська армія значно більша й краще оснащена за нашу, тож пропозиція зустрічі Казєм-Бєка з царем для обговорення умов була бажаною. Якщо ми зможемо домогтися поступок і захисту від царя, навіть погодившись повернутися до його держави, то й далі зможемо поширювати наші переконання в мирі й безпеці.\n\nБагато старших діячів руху висловили підтримку переговорам, і залишається лише побачити, чи погодиться Казєм-Бєк, чий голос важить більше за всі інші разом."
 vyatkaexp.1.a: "Прийняти. Ми поговоримо з царем."
 vyatkaexp.1.b: "Відмовити. Жодних зустрічей із реакціонерами!"

 vyatkaexp.2.t: "Младороси поступилися"
 vyatkaexp.2.desc: "Хоча зустріч Казєм-Бєка з царем була напруженою, зрештою вдалося досягти угоди. Узгоджені умови не задовольнили цілком жодну зі сторін, але їх вистачило для згоди.\n\nКазєм-Бєк погодився, що він і його младороси повернуть Березники під державний контроль, дозволять нам призначити центральних адміністраторів для нагляду за територією та усунуться від її нинішнього уряду.\n\nНатомість цар амністує членів руху, ґарантує йому рівну політичну участь у будь-яких майбутніх виборах без переслідувань чи перешкод із боку державних органів і, найважливіше, послабить обмеження на створення та діяльність профспілок на державній території.\n\nХоча царськими поступками задоволені не всі, більшість згодна, що безкровне розв'язання ситуації значно краще за альтернативу, і ніхто не може заперечити проти відновлення надходжень ресурсів із губернаторства."
 vyatkaexp.2.a: "Мирне розв'язання."

 vyatkaexp.3.t: "Непокірний Казєм-Бєк"
 vyatkaexp.3.desc: "Зустріч Казєм-Бєка з царем почалася напружено й такою залишалася весь час. Жодних умов не узгодили, і тепер війна видається майже неминучою.\n\nПісля військової наради невдовзі по поверненні цар чітко дав зрозуміти: тепер він офіційно вважає Березники державою, яка намагається відокремитися, і наказав урядові докласти всіх зусиль, щоб якнайшвидше повернути їх під центральний контроль.\n\nВійськові частини вже рухаються до Березників, і очікується, що невдовзі вони зустрінуться з ополченням младоросів. Казєм-Бєк зробив свій вибір, і тепер, схоже, через нього постраждають обидві держави."
 vyatkaexp.3.a: "Іншого виходу немає."

 vyatkaexp.4.t: "Суд над Казєм-Бєком"
 vyatkaexp.4.desc: "«Алєксандре Львовічу Казєм-Бєк, - почав суддя, - вас визнано винним у заколоті, зловживанні владою, державній зраді...» Суддя продовжував, завершуючи словами процес, результат якого ніколи не викликав сумнівів.\n\nСидячи навпроти в залі суду, Казєм-Бєк слухав мовчки. Він знав, що вчинив правильно, хоч би де тепер опинився. Народові його країни потрібне було визволення від режимів, які його розчавлювали, і це визволення не прийде з рук царя, так само як не прийде з рук комуніста. Воно прийде з того, чого він прагнув: чогось посередині. На жаль, Росія просто ще не була готова це почути.\n\nКоли суддя оголосив вирок - довічне ув'язнення, - Казєм-Бєк високо тримав голову. Він знав, що має рацію. Знав, що завжди мав і завжди матиме. І одного дня, коли нестримній царській тиранії покладуть край успішніші люди, такі як він, він знав, що вийде на свободу, виправданий усіма.\n\nКоли охоронці виводили досі непокірного Казєм-Бєка із зали до транспорту, що чекав, усі очі були прикуті до нього. Ніхто не помітив насупленого чоловіка в кутку, на обличчі якого читалося розчарування. Боріс Скосирєв сподівався побачити Казєм-Бєка на шибениці, але прийняв, що все одно доведеться задовольнитися цим результатом."
 vyatkaexp.4.a: "Правосуддя?"

 vyatkaexp.5.t: "Авдієнція з великим маґістром"
 vyatkaexp.5.desc: "Залишивши своїх ченців надворі разом із царськими посадовцями, великий маґістр Антіпін з Ордену святого Георгія ввійшов до пишно оздобленої кімнати й привітав царя. Той відповів із повагою, належною старшому духовному діячеві, а потім жестом запропонував сісти й сів сам.\n\nКоли чоловіки заговорили, спершу про дрібниці, а тоді дедалі більше про світські справи, цар почав краще розуміти священнослужителя. Це була турботлива людина, але турботу стримувала відстороненість, необхідна тому, хто мусить ухвалювати доленосні рішення. І палким прихильником монархії він не був. Принаймні поки що.\n\nРозмова тривала, і невдовзі прозвучало справжнє питання: що цареві треба зробити, щоб забезпечити мирне входження ордену до його держави? Антіпін відповів одразу, явно підготувавши відповідь заздалегідь.\n\nНа півдні, у Пєрмі та довкола, лежали землі Арійського «Братства» - фанатичної й явно божевільної секти, яка давно непокоїла і царя, і тих, кого захищав орден. Якщо цар хоче довести свою побожність і Богові, і орденові, якщо хоче довести відданість простим людям Росії, він мусить винищити цю мерзоту до кореня.\n\nЦар Владімір уважно обміркував слова Антіпіна. Чи прийме він такий виклик, щоб здобути прихильність ордену?"
 vyatkaexp.5.a: "Ми доведемо свою побожність. Ми згодні."
 vyatkaexp.5.b: "Зараз ми цього не можемо. Ми відмовляємося."

 vyatkaexp.6.t: "Привиди Ґайн"
 vyatkaexp.6.desc: "Ліси за Ґайнами були темними, коли Данііл, колишній брат нині знищеного Ордену святого Георгія, мовчки йшов ними, щосили уникаючи солдатів, які тепер патрулювали ці землі.\n\nЗагибель прийшла до ордену з рук царя Владіміра, самопроголошеного спадкоємця Романових. Так, він міг мати належну кров, але лише Бог міг зробити царя законним, а Бог, без сумніву, давно віддав «царя» Владіміра дияволові. Як інакше той міг вирішити вторгнутися до земель ордену, розграбувати фортецю-монастир і вбити стількох Даніілових братів-ченців?\n\nБільшу частину юного життя Данііл провів в ордені, беззастережно вірячи в його святу місію захищати слабких і пригноблених від шакалів довкола. Але він зазнав невдачі. Вони зазнали невдачі. І тепер, звертаючись до Бога, він не чув у відповідь нічого, крім криків братів, яких розстрілювали солдати.\n\nАле він досі живий і помститься за них. До Вятки далеко, через важкопрохідну місцевість і ще суворіших солдатів. Та він дістанеться. Він знав, що дістанеться. Він поворухнувся, відчувши, як рушниця впирається в бік. Саме у Вятці оселився фальшивий цар, і хоча Данііл знав, що помре, він також знав про свій обов'язок захистити мільйони інших росіян від солодких слів і брехливих обіцянок цього ненависного Романова.\n\nЙому потрібен був лише один постріл."
 vyatkaexp.6.a: "Він навіть близько не підійшов."

 vyatkaexp.7.t: "Великий маґістр відмовляє в авдієнції!"
 vyatkaexp.7.desc: "Нашим представникам повідомили прикру новину після відрядження імперського посланця до земель Ордену святого Георгія. Посланцю, який намагався влаштувати зустріч великого маґістра ордену Антіпіна з царем Владіміром, повідомили, що така зустріч неможлива.\n\nДії царського уряду щодо повернення прихильників руху младоросів у Березниках, схоже, дуже обурили орден, який войовниче виступає проти комунізму в будь-якій формі. Особливе обурення, здається, викликали й царські поступки рухові щодо профспілок.\n\nХоча ми намагалися пояснити позицію уряду в цій справі, орден дав зрозуміти, що не зацікавлений у подальшому спілкуванні. Зовнішні відносини між нашими державами тепер відсутні, і, схоже, єдиним способом здобути землі довкола Ґайн буде війна."
 vyatkaexp.7.a: "Утрачена нагода."

 vyatkaexp.8.t: "Виклик подолано"
 vyatkaexp.8.desc: "Великий маґістр Антіпін поринув у молитву, коли його перервав брат, повідомивши, що до монастиря прибули царські представники.\n\nВийшовши привітати гостей, невелику групу імперських офіцерів на кількох автомобілях, він раптом упав у шалений гнів, коли їхній очільник після шанобливого вітання витяг із машини пошарпаний прапор. Пошарпаний прапор із гачкуватим хрестом і триколором із нерівними смугами Арійського Братства.\n\nРозлючений тим, що такий образ богохульства принесли до його земель, великий маґістр спинився лише тоді, коли офіцер широко всміхнувся. «Ви не розумієте, великий маґістре, - сказав він із сяйливими очима, - це був перший прапор братства. Взятий з особистих покоїв їхнього “фюрера”. Їх переможено».\n\nГнів спав так само швидко, як виник, і Антіпін хутко вихопив прапор та кинув у вогонь неподалік. Поки той горів, він дякував Богові, що шакалів перемогла така праведна людина, як цар Владімір, і дав офіцерові відповідь, якої, він знав, той хотів.\n\nЦар довів свою гідність, тож Орден святого Георгія приєднається до нього заради блага всієї Росії."
 vyatkaexp.8.a: "Праведне діло."

 vyatkaexp.9.t: "Спадщина свастики"
 vyatkaexp.9.desc: "Минуло кілька днів відтоді, як Вадім востаннє бачив сонце. Чи кілька тижнів? Зрештою, у землях братства легко втратити відлік часу.\n\nНа заводі Вадіма день у день змушували складати боєприпаси для жорстоких чоловіків у німецьких одностроях. Сон був розкішшю. Їжа - благом. Днів без побиття не існувало. Проте саме сьогодні охоронців було значно менше, ніж зазвичай, і Вадім замислився, чи не пов'язано це з вибухами вдалині. Вибухами, які щодня наближалися.\n\nЗгодом Вадім раптом усвідомив, що охоронці, усі до одного, зникли. Ворота залишили відчиненими. І поки він дивився на них, крізь них ступив чоловік у незнайомому однострої. За ним ішли інші й почали розходитися комплексом. Приголомшений, переповнений почуттями, Вадім стояв нерухомо, застигши на місці. Доки з найвищої вежі, тієї, що охоронці використовували як снайперське гніздо, не зірвали прапор із ненависною свастикою й не розгорнули триколор імперської держави.\n\nВадім упав навколішки, м'язи раптом ослабли, а обличчям потекли сльози. Він, як і всі інші на заводі, нарешті, нарешті був вільним."
 vyatkaexp.9.a: "Нарешті вільні."

 vyatkaexp.10.t: "Права меншин?"
 vyatkaexp.10.desc: "Частини Ідель-Уралу переходять під контроль держави разом із великою кількістю татар і башкирів, і між фракціями нашого уряду спалахнули запеклі дебати про державну позицію щодо двох пов'язаних питань: культурної асиміляції й регіональної автономії.\n\nРеформістські кадети під проводом Романа Ґуля вказують на давню й самобутню історію тюркських народів та радять, доки ті залишаються вірними державі, дозволити їм і регіональну автономію, і можливість дотримуватися своїх культурних традицій без втручання.\n\nКонсерватори під проводом Васілія Шульґіна вважають, що регіони слід інтеґрувати як звичайні губернаторства та запровадити політику загальної русифікації через освіту, мовні обмеження й заборону певних культурних практик.\n\nНарешті, НТС під проводом Алєксандра Солженіцина порадив середній шлях: відкинути і автономію, і русифікаційну політику, закріпивши права на самобутні культурні практики.\n\nЯк і в багатьох таких випадках раніше, остаточне рішення мусять ухвалити цар та його радники."
 vyatkaexp.10.a: "Стати на бік кадетів."
 vyatkaexp.10.b: "Стати на бік консерваторів."
 vyatkaexp.10.c: "Стати на бік солідаристів."

 vyatkaexp.11.t: "Свобода віросповідання?"
 vyatkaexp.11.desc: "Ідель-Урал і далі переходить під державний контроль, і ми отримуємо не лише культурні, а й релігійні меншини. Тепер у наших землях живе багато вірних мусульман, і як начебто православна християнська країна ми мусимо вирішити, що з ними робити.\n\nЯк завжди, кадети Романа Ґуля запропонували царському урядові прийняти політику цілковитої й повної свободи віросповідання для всіх підданих.\n\nСолідаристи Алєксандра Солженіцина, чий рух засновано на принципах християнського солідаризму, обстоюють помірний підхід: дозволити свободу віросповідання, але офіційно визнати історичне значення Православної церкви й включити це до шкільних навчальних програм.\n\nКонсерватори Васілія Шульґіна, серед яких є багато побожних православних вірян, а також людей з антисемітськими поглядами, підтримують закріплення православного християнства як державної релігії та заохочення меншин до навернення.\n\nПоки що цар відмовляється коментувати. Але рішення треба ухвалити, і скоро."
 vyatkaexp.11.a: "Стати на бік кадетів - підтримати повну свободу віросповідання."
 vyatkaexp.11.b: "Стати на бік консерваторів - закріпити православ'я як державну релігію."
 vyatkaexp.11.c: "Стати на бік солідаристів - визнати православ'я панівним."
 vyatkaexp.11.d: "Дослухатися до Ордену святого Георгія."

 vyatkaexp.12.t: "Радикали Комі"
 vyatkaexp.12.desc: "Прослуживши в царській армії кілька кампаній, Міхаіл добре звик до звуку пострілів. Але ці були іншими. У бою стріляли швидко й нечасто. Під час страт - повільно й рівно. Ці були саме такими.\n\nСиктивкар мали втихомирити ще тижні тому, коли уряд наказав залишити відповідальність за місто, окрім території безпосередньо довкола військового ґарнізону Міхаіла, місцевим колаборантам із так званої «Роялістської ґвардії Сиктивкара». Та постріли тривали. Зібравши невелику групу солдатів, він рушив на звук, і що ближче підходив, то більше стискалося серце. До пострілів долучилися крики.\n\nКоли він нарешті дістався джерела шуму, то відразу зрозумів, що це: чистка. Загін Роялістської ґвардії зігнав групу громадян і після коротких «допитів» страчував їх.\n\nКинувшись уперед, він зажадав припинити стрілянину, а також пояснити, що відбувається. Командир лише всміхнувся й показав перепустку, підписану військовим губернатором міста. Полонені - соціялісти, сказав він, члени й диверсанти Революційного фронту, а він просто дає їм раду.\n\nМіхаіл бачив, що тут не має влади. Чи справді полонені соціялісти? Справді диверсанти? Чи просто політичні вороги з колишньої республіки? Або особисті вороги? По радіо надійшов наказ повернутися на базу, і, востаннє глянувши на нажаханих полонених, він підкорився.\n\nКолись Міхаіл думав, що використання колаборантів означатиме менше кровопролиття. Він більше ніколи не хотів говорити з жодним із них."
 vyatkaexp.12.a: "Ось вона, ціна довіри до радикалів."

 vyatkaexp.13.t: "Монарші помилування"
 vyatkaexp.13.desc: "Коли цар радився з генералами про майбутні штурми останніх позицій Російської визвольної армії (РОА), раптом постало питання, якого він раніше не розглядав.\n\nБагатьох офіцерів РОА, особливо старших, захопили в боях. Дехто пропонував з огляду і на їхню компетентність, і на беззастережну ворожість до комунізму потенційно залучити їх до Імператорської армії. Цар знав, що пропозиція має й особисті причини: зрештою, багато полонених офіцерів колись служили поряд із його власними під час Західноросійської війни. Але в ній була справжня користь. Багато генералів справді були дуже вправними.\n\nІнші генерали люто заперечували. На відміну і від них, і від самого царя, ці люди не відмовлялися від співпраці з німцями, доки їх не змусили, та ще й загалом тяжіли до фашизму. Перед Владіміром постала дилема. Чи знехтує він минулим генералів РОА заради прагматизму? Чи вирішить, що ціна не варта вигоди?\n\nВін мусив вирішити."
 vyatkaexp.13.a: "Вони заплямовані. Хай гниють у в'язниці."
 vyatkaexp.13.b: "Залучити наших колишніх союзників."

 vyatkaexp.14.t: "Міністерство для Казєм-Бєка?"
 vyatkaexp.14.desc: "Переговори з Казєм-Бєком тривають, і хоча угода вже близько, він висунув останню умову - місце в урядовому кабінеті для себе.\n\nВимога мала сенс. Цей чоловік був дуже здібним політиком і адміністратором. А в уряді він міг би і проповідувати розв'язання загальнодержавних проблем у дусі младоросів, і виявляти прихильних політиків та посадовців.\n\nБагато чиновників, що не дивно, критикує пропозицію надати високу урядову посаду тому, кого вони вважають і радикалом, і зрадником; інші бачать у ній необхідну поступку заради державних планів об'єднання Західної Росії. Казєм-Бєк не дурень, і якщо на цю поступку підуть до зустрічі з царем, він не прийме посаду в кабінеті без значного впливу.\n\nОтже, головним стало питання: чи приймемо ми лідера младоросів як впливову постать нашого уряду в обмін на остаточне завершення кризи довкола його непокірного губернаторства?"
 vyatkaexp.14.a: "Погодитися й дати йому міністерство в управління."
 vyatkaexp.14.b: "Відмовити й пояснити йому чому."

 vyatkaexp.15.t: "Помститися за полеглих"
 vyatkaexp.15.desc: "Суд над старшими командирами Революційного фронту відбувся у Вятці за найсуворіших заходів безпеки. Присутні були всі, хто не загинув, не наклав на себе рук і не втік із ганьбою.\n\nКожного привели перед суддю й звинуватили у злочинах за десятиліття, декого - аж від громадянської війни в Росії. Докази проти них, свідчення очевидців та інші, були нищівними, і їх дуже переконливо підкріпили документами із самарських архівів, які Охрана ретельно впорядкувала й перевірила.\n\nКілька революціонерів, давно звичних до гучних промов, годинами розводилися про власні досягнення, царські невдачі, відсутність повноважень у суду та багато іншого. Але результат ніколи не викликав сумнівів. І не міг викликати.\n\nКоли зачитували вироки, революціонери слухали з кам'яними обличчями. Вони посилали тисячі на смерть після подібних процесів і знали, що чекає попереду. Для більшости - смерть. Для декого - довічне ув'язнення. Для небагатьох - тривалі строки, щоб послабити звинувачення в навмисній суворості. Вони присвятили життя боротьбі із самою ідеєю імперської держави, і тепер вона нарешті їх карала.\n\nПо всій Росії, і в царських володіннях, і за їхніми межами, антикомуністи раділи. Навіть якщо особисто не підтримували царя, то принаймні відчували полегшення: нарешті справедливість здійснилася щодо багатьох найгірших злочинів комуністичної доби."
 vyatkaexp.15.a: "Доба царя."

 vyatkaexp.16.t: "Цар відвідує війська"
 vyatkaexp.16.desc: "631-му батальйону доручили охоронні операції уздовж одного з найважливіших державних автошляхів до Уральських гір.\n\nТака служба передбачала часті сутички з бандитами, розрізненими рештками братства, комуністичними партизанами та іншими. Його вояки здобули багато нагород і не раз довели вірність цареві. Тож це був ідеальний підрозділ для його візиту.\n\nУ супроводі і охоронців, і старших офіцерів Владімір прибув до батальйонного табору на початку пообіддя, почавши з огляду укріплень і загального облаштування. Потім він знайшов час зустрітися із солдатами, представленими до нагород, і, перебравши цю відповідальність від командира підрозділу, особисто вручив їм нагороди; весь цей час робили світлини.\n\nКоли він поїхав пізніше того вечора, багато солдатів батальйону, здавалося, стали впевненішими, зосередженішими й рішучішими виконати своє завдання.\n\nВізит визнали дуже успішним не лише серед самих військових, а й з огляду на те, як громадськість почала бачити свого царя: людиною, готовою залишити палац і зустрітися з тими, хто справді за нього воює, на різку противагу багатьом колишнім Романовим."
 vyatkaexp.16.a: "Буде влаштовано більше візитів."

 vyatkaexp.17.t: "Ситуація в Березниках"
 vyatkaexp.17.desc: "Багато царських генералів, за кількома винятками, були ветеранами громадянської війни в Росії. І всіх їх єднала ненависть до комунізму в кожній його формі.\n\nЦе ускладнювало справи з Березниками. Територію та її цінні ресурси треба було повернути під державний контроль, але спосіб викликав суперечки. Синкретична ідеологія монархізму й соціялізму, яку сповідував непокірний губернатор Алєксандр Казєм-Бєк, була для війська неприйнятною, і майже всі радили цареві наказати підготувати й здійснити вторгнення.\n\nІнші, поміркованіші члени уряду вважали, що можна звернутися до тих самих монархічних переконань Казєм-Бєка й домовитися про мирне повернення території. Проте вони визнавали, що для цього потрібні певні поступки.\n\nЗрештою, як майже в усьому, остаточне рішення ухвалив цар."
 vyatkaexp.17.a: "Мирне розв'язання можна знайти."
 vyatkaexp.17.b: "Потрібне військове розв'язання."
 
 vyatkaexp.18.t: "Боріс, бари й здоровенні фіни"
 vyatkaexp.18.desc: "Боріс Скосирєв сидів за стійкою й замовляв третю чарку горілки. Тиждень минув у дорозі через Онегу, перш ніж він нарешті прибув до Гельсінкі обговорити онезьку ситуацію. Після годин нудних переговорів Боріс радів нагоді розслабитися й випити кілька чарок.\n\nБоріс спробував підвестися, рука безладно сіпнулася й перекинула напій чоловіка поруч, розливши все на підлогу. «Гей, обережніше!» - сказав російською той чоловік, дебелий фін, на вигляд старий ветеран Зимової війни. «Ти перекинув мій напій, дурний кареле! Ти за це заплатиш!»\n\n«Карел? Я не карел!» - випалив Боріс, п'яно хитаючись. «Я головний міністр закордонних справ царя на дипломатичній місії й не мушу платити за напій ЖОДНОГО фіна!»\n\n«Он як, маленький росіянине?» - сказав фін, засукуючи рукави. «А я на війні вбив тридцять росіян, коли вони намагалися забрати нашу землю. Додати до списку ще одного буде неважко».\n\n«Тридцять, кажеш?» Боріс похитався до натовпу, який почав збиратися, чекаючи його наступних слів. «Коли Російська армія прорветься через Онегу, побачите, на що Росія насправді здатна! Ви, фіни, - варвари й вороги російського народу! Можете вбити тридцять наших, але за кожного вбитого росіянина впаде п'ятдесят ваших, щойно ми дістанемося Гельсінкі!»\n\nДехто в натовпі ахнув, дедалі більше людей оточувало Боріса, який і далі розпатякував. «То ви, росіяни, знову плануєте на нас напасти, га? - сказав здоровенний фін. - Може, якщо ми на тобі покажемо приклад, ваші двічі подумають, перш ніж знову вторгатися до Фінляндії»."
 vyatkaexp.18.a: "...Мабуть, я просто повернуся до готелю."

 #Regional events
 vyatkareg.1.t: "Конґрес починається"
 vyatkareg.1.desc: "Цар оголосив про негайне скликання Волоґодського конґресу, щоб дати раду тривалим суперечкам довкола його особистого правління.\n\nОбіцяний царем ще до кампаній регіонального об'єднання, конґрес має визначити перший імперський уряд через обрання делеґатів загальним голосуванням. Три партії виступили зі своїми виборчими програмами.\n\nКонституційні демократи, відоміші як «кадети», під проводом Романа Ґуля пообіцяли йти на вибори з програмою лібералізації й реформ, продовжуючи розвиток конституційної монархії.\n\nВсєроссійскій национальний союз під проводом Васілія Шульґіна, як очікується, висуне значно консервативнішу програму, зосереджену на поверненні до цінностей та організаційної структури старої імперії із сильним царем на чолі.\n\nНаціональний союз солідаристів під проводом Алєксандра Солженіцина обіцяє національну силу й безпеку, російську державу, убезпечену для росіян під владою посиленого центрального уряду.\n\nХоча ніхто не може бути певним, яка партія переможе, усі згодні: результат конґресу надзвичайно вплине на напрямок розвитку відродженої імперської держави."
 vyatkareg.1.a: "Нехай кампанії починаються!"
 
 vyatkareg.2.t: "Результати виборів [GetYear] року"
 vyatkareg.2.desc: "У міру роботи Волоґодського конґресу делеґати різних фракцій доносили свої голоси й позиції, кожен намагаючись вплинути на волю російського народу та здобути його підтримку. Кожному дали змогу виступити, і кожен у душі вірив у свою перемогу.\n\nКонституційні демократи, відоміші як «кадети», під проводом вічного реформіста Романа Ґуля обіцяють зробити Росію місцем для всіх її народів, і російського, й неросійських. Вони обіцяють регіональну автономію, повагу до культурних і релігійних традицій та лібералізацію царського режиму, вірячи, що так створять державу, приналежністю до якої зможуть пишатися всі.\n\nКонсерватори під проводом старого імперського бюрократа Васілія Шульґіна пообіцяли повернення до цінностей Російської імперії. Вони присягнули забезпечити силу й стабільність під проводом сильного централізованого уряду, за яким наглядатиме не менш сильний і владний цар.\n\nСолідаристи під проводом палкого аґітатора Алєксандра Солженіцина запропонували інший напрямок, заснований на антикомуністичній думці. Вони пообіцяли великі перемоги й нову славу Росії та її народові під керівною рукою царя та його уряду.\n\nКонґрес наближався до кінця, мільйони голосів, поданих по всій Суверенній Державі, підрахували, а делеґати чекали, затамувавши подих."
 vyatkareg.2.a: "Голоси підраховано!"

 vyatkareg.3.t: "Солідаристи перемогли!"
 vyatkareg.3.desc: "Серед тисяч прихильників Алєксандра Солженіцина, що зібралися у великій залі засідань конґресу, був юнак на ім'я Міхаіл.\n\nМіхаіл став солідаристом від тієї миті, як відкрив для себе політику у Вятці, цілком зачарований і полум'яною риторикою Солженіцина, і величним майбутнім та добробутом Росії, які вона обіцяла.\n\nВін бачив, як його друзів спокушали старі пережитки, що згуртувалися навколо Шульґіна, або жіноподібні «західні» слабаки, які підтримували Ґуля, і не розумів цього. Солідаристи пропонували майбутнє, а інші - лише застій або крах відповідно.\n\nКоли оголосили результати й Солженіцина проголосили обраним прем'єр-міністром, Міхаіл мусив знайти, де сісти: його переповнили почуття.\n\nУсе, чого він сподівався для Росії, від ранніх днів у Вятці крізь звістки про імперські завоювання по всій нинішній Суверенній Державі, тепер от-от мало здійснитися. Солженіцин і солідаристи з умілою допомогою таких людей, як він, принесуть Росії славу й силу, хоч би що казали чи пробували невдахи з інших фракцій.\n\nІ так здобудуть майбутнє для себе."
 vyatkareg.3.a: "До слави!"

 vyatkareg.4.t: "Стара ґвардія"
 vyatkareg.4.desc: "У великій залі зібрань у Волоґді Васілій Шульґін сидів зі своїми соратниками із Всєроссійского национального союзу, чекаючи миті, до якої йшов майже п'ятдесят років.\n\nВін не бажав нічого більше, ніж послужити іншому носієві царської корони, правителеві гідного спадкоємця імперії його юности, і коли чиновник увійшов до зали й підійшов до трибуни, Шульґін не міг відвести очей. Із майже болісною повільністю чоловік приготувався говорити.\n\n«Волею російського народу, - сказав чиновник, - Всєроссійскій национальний союз сформує цей перший імперський уряд». Приховуючи запаморочення, під оплески всіх присутніх Шульґін за мить зайняв трибуну.\n\n«Мої співвітчизники-росіяни, - почав він, дбаючи, щоб чітко вимовити кожне слово, - для мене буде честю сформувати цей перший уряд і стати вашим прем'єр-міністром. Це день великої радости для всіх царських підданих і для всіх, хто прагне сильної та стабільної Росії. Разом ми знову об'єднаємо нашу розколоту батьківщину!»\n\nГоворячи далі, Шульґін відчував, як повертається частина давнього вогню його юности, який він вважав давно згаслим. Тепер він знав, що зможе прожити останні роки без жалю."
 vyatkareg.4.a: "Стара ґвардія повертається."

 vyatkareg.5.t: "Демократична імперія"
 vyatkareg.5.desc: "Далеко від Волоґодського конґресу, в місті, знову знаному як Пєрмь, Алєксандр Мєдвєдєв сидів перед своїм маленьким радіо.\n\nКолишній червоноармієць і партизан повернувся до звичайного життя після поразки потворного Арійського «Братства», відклавши рушницю й знову взявшись до колишнього ремесла лісоруба. Переживши вже два невдалі й жорстокі режими, він був готовий дати так званому цареві шанс. Поки що, наскільки він міг судити, нащадок Романових діяв на благо народу Росії.\n\nЙого увага повернулася до радіо, коли оголосили результати конґресу. Перемога, напрочуд виразною більшістю, конституційних демократів, або кадетів.\n\nМєдвєдєв такого не очікував. Совєти давно вчили, що монархізм за своєю природою й неминуче реакційний. Натомість ця нова імперія, здавалося, крокувала в протилежному напрямку, до лібералізму й демократії. Він ще не знав, як сприймати таку зміну, але знав, що з нетерпінням чекає побачити її справжнє значення.\n\nІз цією думкою Мєдвєдєв допив чай і пішов спати. Завтра новий день, і треба зрубати ще багато дерев."
 vyatkareg.5.a: "Новий світанок для Святої Русі."

 vyatkareg.6.t: "Ненавмисна помилка"
 vyatkareg.6.desc: "Уривок зі звіту Охрани від 14 листопада (ВИЛУЧЕНО):\n\n«Підозрюваний 39: ФЄДЄРОВ, Алєксандр Івановіч. Стать: чоловіча. Вік: 39.\n\nПідозрюваного затримано 4 жовтня поблизу об'єкта № 5 (див. додаток). За останні сім (7) днів підозрюваного бачили при виході з об'єкта № 5 загалом сім (7) разів. Розслідування аґентів ІВАНОВА й МАЦЄВА виявило наявність підривних елементів на об'єкті № 5. Подальше затримання трьох (3) колишніх оперативників Західноросійського революційного фронту (ЗРРФ) привело до рішення затримати підозрюваного.\n\nПідозрюваного допитував тридцять дві (32) години аґент ІВАНОВ. Застосовано посилені методи. Підозрюваний зізнався у відвідуванні зібрань прихильників ЗРРФ у прибудові до об'єкта № 5. Підозрюваного відправлено до (ВИЛУЧЕНО) для подальшого допиту.\n\nДОДАТОК:\n\nНа підставі інформації підозрюваного на об'єкті № 5 та в його прибудові проведено обшук і вилучення. На об'єкті № 5 знайдено матеріяли на підтримку ЗРРФ. У прибудові містилася благодійна медична клініка Православної церкви. Підозрюваного ідентифіковано як добровільного помічника клініки. Інформація, надана підозрюваним під час допиту, ймовірно, неправдива.\n\nРозслідування причин триває»."
 vyatkareg.6.a: "«Безумовно, ненавмисна помилка»."
 
 vyatkareg.7.t: "Охрану приборкано"
 vyatkareg.7.desc: "Алєксєй Алєксандров, щойно найнятий аґент відділу внутрішніх розслідувань Охрани, ввійшов до непоказної будівлі, пройшов до свого кабінету й сів за стіл. Ранкові справи вже надійшли.\n\nЧитаючи теку, він знову подумки дякував за те, що відділ іще розширили. Коли він починав, справ для нього й інших слідчих було надто, надто, надто багато, і він знав, що через це службові злочини часто залишалися безкарними. Навантаження навіть зараз було значним, але з ним можна було впоратися, а отже, належно приділяти увагу дорученим йому справам.\n\nНаприклад, нинішній, яка описувала приголомшливо недбалі дії одного оперативного аґента, що коштували державі мільйонів рублів і до того ж завдали ушкоджень трьом громадянам. Побачивши, що цей аґент порушує не вперше, Алєксєй рекомендував негайно його допитати й почав готувати ймовірне звільнення.\n\nВін глянув на стос інших справ поруч. День буде довгим."
 vyatkareg.7.a: "Новий день - нова справа."
 
 vyatkareg.8.t: "Проблема з партизанами"
 vyatkareg.8.desc: "За наводкою інформаторів Андрєй Бобров повів своїх людей до хатини за Пєрм'ю, шукаючи підривні елементи.\n\nПриготувавшись до входу, Андрєй підхопив рушницю й вибив двері ногою, вдаривши чоловіка за ними, а тоді кинувся всередину; його люди йшли впритул слідом. Він побачив, що явно перервав зібрання, і, помітивши, як один з учасників піднімає власну рушницю, затиснув спуск.\n\nПерестрілка була жорстокою і завдяки дії автоматичної зброї в тісному приміщенні надзвичайно короткою. Коли все скінчилося, Андрєй нарахував шістьох загиблих партизанів, серед них хлопця не старшого за п'ятнадцять.\n\nВін подумки вилаявся: вбивати хлопчаків, яких самих, імовірно, змусили брати участь, не входило до плану. Але сталося саме це. Виставивши вартових зовні, він з іншими почав шукати документи, повідомлення, радіочастоти чи будь-що, що могло привести до інших груп.\n\nЗгори надійшов наказ зосередитися на таких пошуках, а Андрєй не був людиною, яка порушує накази."
 vyatkareg.8.a: "Це лише початок."
 
 vyatkareg.9.t: "Імперія постала наново"
 vyatkareg.9.desc: "Над Західною Росією, тепер знаною як Західноросійська суверенна держава, зійшов новий день - день миру.\n\nСпадщина Російської імперії, яку колись вважали втраченою назавжди, повернулася, і плоди її зусиль якнайвиразніше видно людям, яких вона тепер зараховує до своїх громадян.\n\nПолітична стабілізація настала завдяки зусиллям демократично обраного уряду та запровадженню Імперської конституції. Внутрішньої безпеки досягнуто зусиллями війська й служб безпеки в боротьбі з бандитами, партизанами та революціонерами всіх ґатунків.\n\nЗавдяки цьому мільйони росіян в імперських кордонах відчувають те, чого не відчували дуже давно: надію.\n\nСуверенна Держава рушає в добу, коли дієздатна й об'єднана Російська імперія вже в межах її досяжности. Постануть нові виклики, і, як завжди, доведеться ухвалювати важкі рішення. Але в єдності довкола уряду й присутности царя Владіміра III, незмінного джерела стабільности й милосердя, майбутнє світле.\n\nХай живе цар!"
 vyatkareg.9.a: "Завжди вперед!"
 
 vyatkareg.10.t: "Стан економіки"
 vyatkareg.10.desc: "Хоча військовими й політичними зусиллями ми перемогли в Західній Росії, це слабка розрада для численних росіян, що залишилися без роботи, житла й їжі.\n\nЕкономіка багатьох регіонів за межами самої Вятки була, є й залишається майже цілковито знищеною, із жахливими умовами життя та майже відсутніми перспективами поступу для мешканців. Проте за царським дорученням Імперський комітет відновлення розробив комплексний план будівництва й реформ.\n\nЙого члени обіцяють зосередитися на ремонті й розбудові вітчизняної промисловости, відновленні повноцінної науково-освітньої бази та запровадженні значних грошових і фінансових реформ. Також наполегливо домагатимуться прямих іноземних інвестицій.\n\nХоча буде дуже важко й доведеться ухвалювати складні рішення, експерти комітету впевнені: якщо триматися курсу, їхній план матиме успіх. Вони також заявляють, що цей успіх не лише послужить мільйонам росіян, які волають про добробут, а й забезпечить економічну основу, потрібну для розумного продовження зусиль з об'єднання. Цар, який сам зібрав комітет для цієї мети, не має підстав сумніватися в них."
 vyatkareg.10.a: "Час братися до роботи."
 
 vyatkareg.11.t: "Стан збройних сил"
 vyatkareg.11.desc: "Імперські збройні сили чудово показали себе в кампаніях об'єднання Західної Росії, але прийдешні кампанії будуть справді зовсім іншими. На них чекають величезні відстані, надзвичайно різноманітна місцевість і сильніші вороги, і військо мусить бути готовим до всього цього.\n\nМи мусимо провести всебічну оцінку наших дотеперішніх зусиль і визначити необхідні напрямки вдосконалення. Мусимо рішуче визначитися з єдиною доктриною для наших формувань. Мусимо зміцнити народну довіру й підтримку. Мусимо створити підрозділи забезпечення. Мусимо розширити виробництво, навчити нових офіцерів і до того ж оновити спорядження.\n\nОчевидно, роботи багато. Але ми рішучі й віддані справі та розв'язуватимемо кожне питання по черзі. Хоча доведеться проводити болючі перевірки й робити болючі визнання, кожне принесе поліпшення, і наприкінці цього довгого шляху ми зможемо бути певні своєї здатности донести царський стяг аж до Далекого Сходу."
 vyatkareg.11.a: "Чоботи в Сибіру до 1972 року."
 
 vyatkareg.12.t: "Готові до дипломатії"
 vyatkareg.12.desc: "Внутрішня політична ситуація в Суверенній Державі стабілізувалася, і тепер ми можемо зробити те, чого росіяни не робили багато років: поглянути назовні.\n\nМи маємо намір спробувати налагодити відносини всюди, де зможемо, і з новими друзями, і зі старими, надаючи пріоритет і дипломатичному визнанню, і торговельним зв'язкам. Леґітимність, критично важливу для наших претензій на решту Росії, можна здобути через зв'язки як з Організацією вільних націй, так і з низкою європейських монархій.\n\nЩо більше добрих відносин ми збудуємо, то сильнішою буде наша країна. Кожним новим договором, угодою, порозумінням і дружбою цар Владімір демонструє своє лідерство, а отже, і своє право - понад саме походження - правити всією Росією."
 vyatkareg.12.a: "Суверенна Держава відкрита для ділових зв'язків!"
 
 vyatkareg.13.t: "Імперський дипломатичний корпус"
 vyatkareg.13.desc: "Як начебто законна країна, Суверенна Держава мусить відкритися світові: і виходячи назовні, і впускаючи інших усередину. Але для цього потрібні вміння й досвід.\n\nЇх надасть Імперський дипломатичний корпус, щойно створений імператорським та урядовим указом. Корпус діятиме всередині країни й за її межами, щоб поліпшити і образ Суверенної Держави, і її зв'язки з усіма, хто готовий до того чи іншого. Проте, звісно, за потреби він також зосереджуватиме зусилля на визначених для нього конкретних цілях, регіонах чи країнах, і деякі такі напрямки вже розглядають.\n\nЯкщо його компетентність і наше міжнародне становище достатньо розвинуться, можливо, вдасться навіть почати діялог з іншими режимами, які займають російську територію на сході. Це може звучати сміховинно, але якби об'єднання можна було досягти без кровопролиття, це була б гідна мета."
 vyatkareg.13.a: "Дипломатія необхідна."
 
 vyatkareg.14.t: "Торгівля з ОВН"
 vyatkareg.14.desc: "ОВН, або Організація вільних націй, - глобальний союз, до якого, дивлячись у майбутнє, нам слід прагнути.\n\nНімеччина й Японія - природні союзники і вороги Росії, тож протистояння їм природно робить ОВН привабливою. Натомість ми можемо запропонувати їм не лише ресурси, а й потенційно дружню країну, ближчу до їхніх ворогів, ніж вони самі.\n\nТож нам слід почати налагоджувати добрі відносини через торговельні угоди зі Сполученими Штатами та іншими членами ОВН. Промислові знання, військове спорядження й зв'язки далі у світі - усе це можливі плоди такої торгівлі, і все стане в пригоді нашій новій зростаючій країні.\n\nПроте треба залишатися пильними. Надто швидкий рух може відштовхнути американців, а такий результат був би справжньою катастрофою."
 vyatkareg.14.a: "Можливо, одного дня ми навіть приєднаємося до ОВН."
 
 vyatkareg.15.t: "Посольство від Суверенної Держави?"
 vyatkareg.15.desc: "Західноросійська суверенна держава офіційно звернулася до нас із проханням і про дипломатичне визнання, і про можливість збудувати посольство у Вашинґтоні.\n\nСуверенна Держава - назва, яку прийняв монархічний режим на чолі з царем Владіміром III, раніше з осідком у Вятці, - успішно об'єднала Західну Росію під своїм прапором і тепер, без сумніву, прагне зміцнити становище. Рекомендації Державного департаменту щодо можливої відповіді різняться.\n\nБагато хто підтримує пропозицію, посилаючись на відносно прийнятний характер режиму, особливо порівняно з іншими можливостями. Вони також указують на цінні ресурси, які можна обмінювати на американські знання й допомогу в розвитку, та на основоположну користь від подальшого поширення ідеї ОВН - вільного самовизначення народів.\n\nІнші твердять, що визнання уряду Суверенної Держави на цьому етапі було б передчасним і могло б спричинити дипломатичне тертя з Німеччиною в час, коли напруга вже висока. Вони також заявляють: якщо Суверенна Держава не досягне мети об'єднання, це може зашкодити американському престижеві за кордоном.\n\nТреба ухвалити рішення."
 vyatkareg.15.a: "Дозволити будівництво посольства й відкрити дипломатичні канали."
 vyatkareg.15.b: "Можливо, зараз не час."
 
 vyatkareg.16.t: "Американці дозволяють посольство!"
 vyatkareg.16.desc: "Чудові новини! Американці надали нам дипломатичне визнання й схвалили наше прохання збудувати посольство у Вашинґтоні!\n\nМи почнемо якнайшвидше - ця нагода надто цінна, щоб зволікати. Завдяки американському визнанню, а отже, невдовзі й визнанню ОВН, леґітимність Суверенної Держави та царя надзвичайно зросла.\n\nУже зараз ми отримуємо запити від численних менших країн про початок торговельних переговорів. Це значно допоможе нашій країні майже в кожному аспекті, і всім цим ми завдячуємо чудовим зусиллям Імперського дипломатичного корпусу!"
 vyatkareg.16.a: "Америка вітає нас на своїх берегах."
 
 vyatkareg.17.t: "Американці відмовляють у посольстві!"
 vyatkareg.17.desc: "Надійшли прикрі новини. Сполучені Штати офіційно відхилили наше прохання про офіційне визнання й заснування посольства у Вашинґтоні.\n\nХоча причин не назвали, Імперський дипломатичний корпус вважає, що вони не хочуть втручатися в російську політику, доки не визначиться явний фаворит майбутнього об'єднання. Корпус також припускає, що американці не бажають посилювати дипломатичну напругу з Німеччиною, яку визнання нашої держави неодмінно спричинило б.\n\nПроте хоч би якою була причина, факт відмови залишається. Це боляче, але ми вже багато досягли без визнання й досягатимемо надалі."
 vyatkareg.17.a: "Зрештою, що посієш, те й пожнеш."
 
 vyatkareg.18.t: "Зв'язки з іншими монархами"
 vyatkareg.18.desc: "Історичні зв'язки й відносини, родинні чи інші, між династією Романових і династіями інших європейських монархів, що досі сидять на престолах, дають державі унікальну нагоду.\n\nВикористовуючи ці відносини, а також дружні еміґрантські мережі, дедалі більший склад і досвід Імперського дипломатичного корпусу, ми можемо розпочати скоординовану кампанію зі здобуття підтримки їхніх країн. Хоча здебільшого вони, можливо, й не мають такої безпосередньої влади, як наш цар, вони все ж монархи, а всіх монархів єднає спільний зв'язок.\n\nТому зусилля в цьому напрямку почнуться. Невдовзі наші дипломати роз'їдуться старими столицями Європи, сподіваємося, з великим успіхом утверджуючи і репутацію Суверенної Держави, і цінність налагодження відносин із нею."
 vyatkareg.18.a: "До взаємної користи!"
 
 vyatkareg.19.t: "Подорож до Стокгольма"
 vyatkareg.19.desc: "Коли царський кортеж прибув до Королівського палацу в Стокгольмі, цар не міг не захопитися його простою красою. Красою палацу, якого ніколи не грабували революціонери.\n\nВін щосили намагався здаватися відстороненим, але насправді дуже нервував: він зустрічався з іншим монархом і мусив показати і власну силу, і силу Росії. Поки його шанобливо проводили до королівського кабінету, де мала відбутися справжня розмова, він збирався з духом.\n\nКороль Ґустав прийняв його тепло, говорячи чудовою російською. Тепліше, ніж він очікував. Невдовзі стало очевидно, що королеві дуже подобається приймати людину, особливо іншого монарха, яка не належить до німецької сфери. Незабаром Владімір зрозумів, що знайшов зі Швецією надійний ґрунт для порозуміння, і розмова перейшла до торгівлі.\n\nДо кінця дня угоду уклали. Російські ресурси, особливо нафта, в обмін на шведські технічні знання й інвестиції. Справді чудовий обмін."
 vyatkareg.19.a: "Якби ж усі зустрічі проходили так добре."
 
 vyatkareg.20.t: "Римські канікули"
 vyatkareg.20.desc: "Цар Владімір на мить перепросив своїх супровідників і пішов сісти на лавку з краєвидом на італійську столицю.\n\nХоча він знав, що Росія надзвичайно покращала порівняно з колишнім станом, нічого схожого на Рим вона не мала. Нічого схожого на хмарочоси. Нічого схожого на таку кількість машин. А понад усе - нічого схожого на це відчуття спокою. Йому хотілося провести більше часу в цьому прекрасному місті.\n\nАле, нагадав він собі, він приїхав не у відпустку. Він тут заради свого народу. Тут, щоб здобути і дипломатичне визнання, і економічні можливості. Та поступ був повільним, і це його дратувало, хоч як часто радники нагадували, що в дипломатії це нормально. Тож думки знову зверталися до краси Риму.\n\nОдного дня, пообіцяв він собі, Росія матиме такі будівлі, такі міста. Чи було б це вже можливим, якби комуністи, а потім німці не знищили всього на своєму шляху? Якби його родина втримала престол?\n\nВін відсунув ці думки й натомість уявив Вятку, над якою панують хмарочоси. Ця думка йому подобалася."
 vyatkareg.20.a: "Чи стане Росія колись такою?"
 
 vyatkareg.21.t: "Невдалі пригоди Боріса Скосирєва"
 vyatkareg.21.desc: "Уперше за багато років повернувшись до Іберії, Боріс Скосирєв вийшов із літака й потиснув руку Франсіско Серрано, іберійському представникові.\n\nОбмінюючись люб'язностями іспанською, якої Скосирєв давно не практикував, вони пройшли до автомобіля Серрано й поїхали до центру Мадрида. Скосирєв помітив відстороненість Серрано й подумав, що знає причину.\n\n«Франсіско, - почав він, - я хочу, щоб ця місія вдалася, тож, гадаю, нам слід обговорити минуле». Серрано мовчав, а він продовжив. «Та історія з Андоррою була багато, багато років тому. Та я певен, новий єпископ навіть не пам'ятає, що сталося! І, знаєте, якби ви допомогли заспокоїти інших, у кого ще лишилася образа, я був би дуже вдячний...»\n\nОчі Серрано на мить відірвалися від дороги, поки він швидко оглянув тугий сувій грошей, який Скосирєв дістав із кишені. «Ви намагаєтеся мене підкупити, Скосирєве? - засміявся він. - Ніхто не пам'ятає Андорри, я просто давно не водив. А якщо ви справді це задумали, слід було краще подумати. Курс російських грошей не надто вигідний». Скосирєв недовірливо глянув на купюри. Рублі! Яка користь із фальшивомонетної справи, якщо вона навіть не друкує потрібних грошей!\n\nПоки Скосирєв проклинав свого «надійного» фальшивомонетника в Архангельську, Серрано їхав далі."
 vyatkareg.21.a: "Чому ми мусили послати саме його?"
 
 vyatkareg.22.t: "Імперія і світ"
 vyatkareg.22.desc: "Зосереджені й рішучі зусилля Імперського дипломатичного корпусу за наказами царя та уряду увінчалися значним успіхом.\n\nБагато країн тепер бачить у нас законний уряд Західної Росії, а отже, неявно - ймовірного кандидата на національне об'єднання. Наші відносини з країнами поза німецькою сферою впливу, і в Європі, і деінде, значно зміцніли, і тепер ми дуже відрізняємося від численних дрібних держав, що передували нам.\n\nЦе розширення міжнародних політичних зв'язків супроводжувалося відповідним зростанням економічних відносин. Величезні ресурси наших земель знайшли багато ринків за кордоном, а до Суверенної Держави натомість надходять і технічні знання, і іноземний капітал, даючи можливості та добробут і нашому урядові, і мільйонам росіян.\n\nСправді великий успіх і провісник прийдешнього майбутнього."
 vyatkareg.22.a: "Росія повертає своє законне місце."

 vyatkareg.23.t: "Музей"
 vyatkareg.23.desc: "У маєтку Вікторії Авєр'янової відбувалася головна подія сезону. Рідкісний мирний вечір в анархії дозволив спадкоємиці виставити свою вишукану колекцію безцінних творів мистецтва. Осяйна в рубіновій сукні, вона стояла в центрі ґалереї. Твори, що оточували її та гостей, належали найкращим російським митцям і були врятовані з вогню пєрмських нацистів.\n\nБагато виставлених робіт походило з часів давніх царів. Твори таких великих художників, як Іван Шишкін і Валєнтін Сєров, шедеври Ісаака Лєвітана й кілька нечисленних робіт великого Васілія Кандінского. Гості були зачаровані мистецтвом довкола; дехто з найстарших пам'ятав великі виставки колишнього Імператорського двору, які цей вечір намагався відтворити. Повітря було насичене ностальґією за давніми днями, коли Російська імперія стояла велично, а її народ не гнувся перед чужоземними загарбниками. Панувала туга за найкращим із минулих часів, але під усім цим текла надія. Коли численні дворяни нової імперії проходили повз мистецтво предків, коли туга полишала їхні серця, їх сповнювала дивна рішучість. Росія їхніх дідів не померла, хоч як її вороги намагалися її вбити, - вона лише спала в серцях свого народу.\n\nСпілкуючись із численним дворянством, Вікторія підійшла до головного експоната виставки. Останнього твору, врятованого з Пєрмі, коли культ Ваґнера спалював шедеври російського минулого. Значно давнішого за решту виставленого, під охороною брата Ордену святого Георгія, - ікони Христа Спасителя. У серцях усіх присутніх незмінним залишалося бажання повернути імперії гідність в очах Бога й народу.\n\nКоли вечір добіг кінця, Вікторія знову опинилася перед іконою, молячись, щоб майбутнє виправдало все це."
 vyatkareg.23.a: "Гарний вечір для ностальґії."
 
 vyatkareg.24.t: "Оливкова гілка"
 vyatkareg.24.desc: "Глибоко в лісах довкола Архангельська капітан Павєл Кірілловіч Шєповалов сидів зі своїми людьми, зігнувшись біля вогнища. Павєл служив у ЗРРФ від Західноросійської війни, і коли царисти взяли його рідний Архангельськ, присягнув битися до кінця, навіть після того, як маршала змусили здатися. Спочатку було легко. Царські сили розтягнулися надто широко й не могли впоратися з партизанською війною, яку вели він та інші рештки Червоної армії. Останнім часом імперські сили поповнили й посилили новою зброєю та ветеранськими частинами. Через це напади на імперські шляхи постачання ставали дедалі складнішими. Його люди голодували, а боєприпасів до їхньої зброї лишалося небезпечно мало. Тож коли один із вояків передав йому листа від самого царя, він не кинув його відразу у вогонь. Павєл зламав печатку й почав читати.\n\n«Звитяжним солдатам Західноросійського революційного фронту,\n\nПопри нашу ворожнечу, я не можу не відчувати щирого захоплення вашими звитягою й завзятістю. Ви й далі билися всупереч усьому, ще довго після того, як будь-яка розсудлива людина вважала б вашу справу завершеною.\n\nЯ знаю, що у вас немає причин довіряти імперській системі: вад старої імперії було багато, і народ дуже через них страждав. Проте я мушу попросити вас скласти зброю заради блага російського народу. На кону майбутнє Росії, і щоб зменшити шкоду для людей, ми мусимо примиритися.\n\nВ інтересах миру й єдности імперії я пропоную вам і всім вашим товаришам амністію від усіх звинувачень, які могли б вам висунути, в обмін на здачу. Даю слово, що не дозволю завдати вам жодної шкоди.\n\nПідпис: цар Владімір III».\n\nПавєл пильно дивився на лист у руках, зважуючи можливості. Зрештою саме голод, що гриз нутрощі, змусив його діяти. Він кинув лист у вогонь і наказав людям зібратися. Їхня війна скінчилася."
 vyatkareg.24.a: "Самими ідеалами шлунка не наповниш."
 
 vyatkareg.25.t: "Старі добрі часи"
 vyatkareg.25.desc: "Цар Владімір III сидів у кабінеті зі своїм прем'єр-міністром Васілієм Шульґіним, який щойно склав присягу. Перемога консерваторів на Волоґодському конґресі викликала в царя дивне занепокоєння. Хоча думка повернутися до давніх порядків предків приваблювала, він не міг позбутися тривоги, яку вона несла. Руйнівний і кривавий кінець старого царства важко тиснув на його думки.\n\nНемов відчувши страх, Шульґін заговорив. «Мій царю, я розумію ваше хвилювання. Хоча я згадую ті дні з великою теплотою, я не сліпий до вад і зловживань старої імперії. Нам дали шанс відбудуватися й використати засвоєні уроки для створення сильнішої імперії. Я знаю, що перехід буде незвичним для всіх нас: досі ви правили майже так само, як колись ваші предки». Шульґін надто добре знав страхи свого царя. До конґресу той був беззаперечним володарем Вятки, кожне його слово було законом. Відмовитися від цього було б важко навіть найчистішій людині.\n\nШульґін знав: навіть більше, ніж утрати особистої влади, цар боявся нездатности його партії захистити народ. Хоч би що можна було сказати про царя та його помилки, неможливо було перебільшити одне - його турботу про людей. Маючи одноосібну владу, він міг безпосередньо дбати про них. Тепер доводилося довіряти політичним створінням на кшталт Шульґіна та його партії. «Розумію, що вам важко покластися на мене. Ви мусите знати: я зроблю все від мене залежне, щоб забезпечити добробут і захист нашого народу».\n\nЦар певний час мовчав, обмірковуючи тисячу й більше думок. Він знав, що надалі його привілеї й повноваження будуть обмежені, але водночас консервативна конституція дасть йому широкі можливості подбати, щоб його бачення країни вижило. Тоді Владімір поглянув на Шульґіна й мусив визнати: принаймні досвід для забезпечення добробуту імперії та її народу той мав."
 vyatkareg.25.a: "За стабільну імперію."
 
 vyatkareg.26.t: "Права рука царя"
 vyatkareg.26.desc: "Цар із радою сиділи в залі нарад Імператорського палацу. Прем'єр-міністр Солженіцин скликав засідання ради, щоб обговорити майбутнє імперії. Двері відчинилися, і прем'єр-міністр увійшов із невеликою групою партійних функціонерів позаду. Після звичного обміну люб'язностями він почав засідання.\n\n«Шановні члени ради, певен, усім вам цікава мета цієї зустрічі. Я прибув просто з останнього засідання Думи зі звісткою, життєво важливою для цієї імперії». Члени ради з певною тривогою перезирнулися. Зазвичай вони знали, що відбувається в Думі, але сьогодні їх викликали рано, перш ніж хтось устиг почути новини із засідання. Солженіцин продовжив: «Із завершенням сьогоднішнього законодавчого засідання мені надано надзвичайні повноваження для одноосібних дій в імперії. Дума надала мені їх, щоб імперія могла краще покінчити з нестабільністю, яка панує в Росії останні десятиліття. Знайте: я приймаю ці повноваження з великим небажанням і відмовлюся від них, коли криза мине й Росію буде об'єднано під нашою владою».\n\nНа обличчях присутніх читався подив. Сам цар ледь зберіг самовладання, почувши слова прем'єр-міністра. Солженіцин говорив так, ніби йому на плечі поклали великий тягар, але Владімір бачив задоволення в його очах. Він нагадував кота, який щойно впіймав канарку: така самовдоволеність суперечила образові, який він демонстрував іншим членам ради.\n\nПопри заспокійливі слова прем'єр-міністра, Владімір відчував лише холодний тягар, що осідав у животі. Він мовчав усе засідання, не спромігшись як слід озватися. Коли все скінчилося, він пішов до кабінету давати раду міґрені, яка мучила його весь день."
 vyatkareg.26.a: "Молода демократія помирає, задушена в колисці."
 
 vyatkareg.27.t: "Робити гроші"
 vyatkareg.27.desc: "Повітря повнилося криками, поки друкарські машини працювали якнайшвидше. «Ворушіться!» - кричав Боріс Скосирєв, роздратований повільністю своєї справи. «Що більше надрукуємо, то більше в мене грошей - тобто... у нас. Не виконаєте норми - знаєте, що буде! Я в себе в кабінеті».\n\nЗачинивши двері, щоб мати бодай трохи тиші, Боріс визирнув у вікно, спостерігаючи за робітниками - переважно бідними безробітними селянами, які не могли зайнятися нічим іншим. Він лише сподівався, що вони досить добре виконають його бездоганний план. Це була його найкраща ідея!\n\nУ двері постукали, і ввійшов помічник. «Пане, у нас, можливо, невеличка проблема. Змінили оформлення п'ятисотрублівок, тож доведеться всі їх викинути».\n\n«ВОНИ ЩО ЗРОБИЛИ?» - закричав Боріс. «Дай-но новий зразок». Переглядаючи його, Боріс лютував: нове оформлення цілковито відрізнялося від старого. «Скажи всім, що наступного тижня працюватимуть понаднормово. І хочу, щоб усі старі спалили, аби не лишилося жодних доказів».\n\n«Так, звичайно, - відповів помічник. - А, до речі, вам варто перевірити тисячорублівки, які хлопці надрукували». Він простягнув одну купюру.\n\n«Це має бути Владімір?! Він схожий на маленьку дівчинку!» Боріс порвав купюру на шматки й кинув у смітник.\n\n«І останнє: хлопці щойно виявили, що на п'ятитисячних надрукували голову Ніколая догори дриґом. Не хвилюйтеся, перш ніж помітити, надрукували лише кілька тисяч»."
 vyatkareg.27.a: "Просто дайте йому розважитися."
 
 vyatkareg.28.t: "Конґрес починається"
 vyatkareg.28.desc: "Волоґодський конґрес розпочався. Подія відбувалася доволі передбачувано: спершу прибували різні чиновники з усього нашого зростаючого царства. Більшість представників трьох головних фракцій була присутня, добре підготувавшись до конґресової роботи. Коли гомінкий натовп учасників затих, прозвучали вступні заяви, протоколи й інші обов'язкові представлення, перш ніж перейти до суті - викладу арґументів трьома фракціями.\n\nПершими почали кадети. Передбачувано, їхня риторика тяжіла до реформ. Вони пропонували права для меншин, рух до проґресивного майбутнього й, найважливіше, створення конституційної монархії із сильною демократичною системою.\n\nВНС у своїй чопорній манері палко обстоював власні тези. Апелюючи до ностальґії за старою імперією, його представники чітко дали зрозуміти, що борються за консервативні, але демократичні цінності. У їхній заяві майже не було доводів за реформи, і зрештою вони виразно утвердилися як прихильники збереження наявного стану.\n\nДалі прозвучала промова НТС. Популізм, націоналізм, свобода й монархізм були чотирма ключовими засадами. Вони твердо обстоювали відмову від ідей і лібералізму, і комунізму, ставлячи російську людину вище за будь-яку таку систему. Проте й у них були заяви на користь демократії; наскільки щирими є чи будуть ці твердження та їх утілення, неясно.\n\nНаразі реакції різняться, і лише час покаже, хто доможеться свого."
 vyatkareg.28.a: "Хай там як, крок до змін."
 
 vyatkareg.29.t: "Привиди минулого"
 vyatkareg.29.desc: "Сєрґєй бачив усе. Старий чоловік, він за життя побачив багато. Народжений на зламі століть у простій селянській родині, більшу частину молодости він намагався обробляти холодну тверду землю на півночі, довкола Архангельська. Життя було важке, але просте: не треба було хвилюватися, чи не знесуть тобі голову пострілом завтра вранці.\n\nВін виріс біля міста, на фермі трохи південніше. Сєрґєй пам'ятав своє життя щасливим, доки його не змусили воювати за царя в Першій світовій війні. Пам'ятав, як бився: спершу за царя, потім за Тимчасовий уряд, а тоді за большевиків. Пам'ятав кровопролиття, як вони билися й програвали, і як тепер він був змушений жебрати на вулицях, щоб вижити.\n\nТому він нічого не сказав, коли фронт знову піднявся й упав, і залишався мовчазним, коли імперський орел знову злетів над містом. Сєрґєй більше не вірив у комуністичну мрію, але ці люди... вони билися за чоловіка, який воював на боці німців під час Західноросійської війни; вони несли в собі надію. Він тихо засміявся, сидячи на розі вулиці, поки нею марширували війська. За життя він засвоїв одне, одну просту істину: політики й генерали воюють, але про таких, як він, зрештою завжди забувають. Та, дивлячись на усмішки цих юнаків, він відчував сум'яття. Можливо... можливо, зрештою вони будуть іншими. Може, цинізм старого виявиться хибним.\n\nВін відкинувся назад, і, коли повіки важчали, а дихання ставало важким, думав про дім. Думав про родину, і з цими думками старий Сєрґєй востаннє усміхнувся, поринаючи у вічний сон."
 vyatkareg.29.a: "Старий привид отримує заслужений спочинок."
 
 vyatkareg.30.t: "Нова доба"
 vyatkareg.30.desc: "Роман Ґуль устиг побути багатьма: солдатом Великої війни на царській службі, письменником і журналістом, в'язнем, що вижив у концтаборі, поборником та активістом демократизації Вятки й нарешті прем'єр-міністром Західної Росії. Чвари й війна були постійними супутниками його життя, від яких він рідко ухилявся, та, йдучи проходом до покоїв Його Імператорської Величности, відчув легке хвилювання в грудях, готуючись до призначеної зустрічі. Перш ніж увійти до кабінету Владіміра, Ґуль глибоко вдихнув.\n\nНемов увійти до іншого світу, застиглого в часі: реліквії іншої доби оточували кожного, хто наважувався зайти, імператорські меблі впадали Романові в очі. А ось і його государ за столом, схоже, чекав прибуття прем'єр-міністра.\n\n«Ваша Імператорська Величносте! - сказав він за імператорським етикетом. - Сподіваюся, сьогодні ви добре почуваєтеся?»\n\n«Прем'єр-міністре Ґуль, - офіційно відповів Владімір, - легка міґрень, але нічого, нічого надто серйозного. Прошу, сідайте, певен, вам багато про що мені розповісти».\n\nҐуль виконав прохання. Думки мчали в голові, коли Роман почав викладати цареві свої плани реформ:\n\n«Як я вже згадував, Ваша Імператорська Величносте, ми не можемо й далі миритися з тим, як мало в Росії цінують особисті свободи: народ - і російськомовні, і неросійськомовні громадяни - є й завжди має залишатися нашим пріоритетом. Кожен без винятку ваш підданий заслуговує на краще життя, світліше майбутнє, і хоча за вашого правління зроблено багато, абсолютна влада й заходи жорсткої економії не можуть бути нормою вічно. Тепер, коли Західна Росія стабільна, я прийшов просити вашого благословення й допомоги у створенні кращого завтра для співвітчизників. Інакше ми знову впадемо в хаос і чвари, якщо їхні слова не зможуть до нас дійти».\n\nҐуль мав рацію: Західна Росія була цілком під контролем, а ті надокучливі заходи економії можна було послабити, якщо не скасувати зовсім. Та втомлений цар середнього віку, намагаючись зберігати спокійний вигляд, усе ж дещо непокоївся тим, як далеко підуть Романові реформи коштом влади корони."
 vyatkareg.30.a: "«Ви маєте моє благословення»."
 
 vyatkareg.31.t: "Інший шлях"
 vyatkareg.31.desc: "Документи у Владімірових руках були, за всіма ознаками, простими. Їх було неважко читати, вони не були ані багатослівними, ані драматичними за тоном. Проте саме зміст змусив царську руку на мить здригнутися. Слова на кшталт «надзвичайні повноваження», «перебудова згори» та інші авторитарні, самодержавні терміни миготіли на аркушах червоним чорнилом.\n\nЩо довше він дивився, то більше мимоволі згадував комюніке з минулого, коли рушив до Росії, - і це його не заспокоювало. «Мій царю». Голос перервав його роздуми: Алєксандр Солженіцин зробив два кроки до нього й переданих йому документів. «Розумію ваше вагання чи будь-які побоювання, але Росія потерпає від нестабільности, і ці заходи - важливий крок до забезпечення майбутнього всіх». У словах Алєксандра була певна логіка, але тон став холоднішим, і Владімір відчув у глибині свідомости укол непевности - немов сирена, немов маленький тривожний дзвіночок, що не замовкав, навіть поки Алєксандр говорив. «Запевняю вас, ці перебудовчі заходи лише заради спільного блага, і щойно Росію буде об'єднано, вони стануть менш обмежувальними...»"
 vyatkareg.31.a: "І навіть коли Владімір кивнув, дзвіночок усе ще дзвенів."
 
 vyatkareg.32.t: "Бути лідером"
 vyatkareg.32.desc: "Цар Владімір і його прем'єр-міністр Васілій Шульґін прогулювалися садами Імператорського палацу. Шульґін дав цареві закінчити прогулянку й сісти на лавку з краєвидом на сад, перш ніж заговорити. «Мій царю, сподіваюся, сьогодні ви добре почуваєтеся?»\n\n«Так, Васілію. Останнім часом я почуваюся на повітрі значно краще. Марія теж насолоджується ясною погодою. Давно не бачив її такою щасливою». Від думки про доньку царське обличчя осяяла рідкісна усмішка. Васілія підбадьорив добрий царський настрій, і тепер йому було ще легше розмовляти.\n\n«Радий чути, що ваша родина здорова. Не хочеться відривати вас від таких щасливих думок, але сьогодні я прийшов не просто так, мій царю. Треба поговорити про вашу роль у новому уряді. Як ми обоє знаємо, дні абсолютного монарха скінчилися. Проте вкрай важливо, щоб ви залишалися діяльним в управлінні імперією. Ви будете ключовою складовою імперського уряду й матимете останнє слово в імперії. Не можна просто задоволено стояти осторонь». Шульґін передусім обстоював стабільність імперії. Цар був її найбільшим об'єднавчим символом, а його щира участь в уряді - ключем до забезпечення стабільности.\n\nЦар на мить зібрався з думками. «Я розумію свої обов'язки, Васілію. Знаю, що мушу робити заради успіху імперії, але я лише одна людина. Не маю жодного бажання керувати кожним аспектом життя країни». Владімір надто добре розумів, що чекає наприкінці того шляху: смерть і злигодні.\n\n«Звичайно, мій царю. Дума керуватиме повсякденними справами уряду, але ваш голос завжди матиме найбільшу вагу». Шульґін попрощався з царем і повернувся до свого кабінету, залишивши царя в глибоких роздумах про майбутнє."
 vyatkareg.32.a: "Є робота, яку треба зробити, мій царю."
 
 vyatkareg.33.t: "Усі ми росіяни"
 vyatkareg.33.desc: "Фєрдінант Ґіматов сидів із друзями за столом у себе вдома. Радіо тихо грало музику, а п'ятеро друзів сьорбали чай і розмовляли. Тімур, Фєрдінантів свояк, зашикав на них, коли музика урвалася й заграв державний гімн. Усі вони чули про перемогу кадетів на виборах, навіть голосували за них і з нетерпінням чекали слів прем'єр-міністра, який щойно склав присягу.\n\nРадіо потріскувало й шипіло, коли гімн змінив голос прем'єр-міністра Романа Ґуля. «...Цієї надзвичайно щасливої ночі маю честь стояти перед усіма народами Росії як їхній представник. Мене обрали зі сподіванням, що до людей імперії, росіян чи інших, ставитимуться так, як вони того заслуговують. Стара імперія потерпала від шовінізму й ненависти до меншин, які допомагали робити її сильною. Тут і зараз ми маємо шанс збудувати кращу державу для всього народу Росії». Фєрдінант слухав голос прем'єр-міністра дещо відсторонено. Його слова були добрі й гарні, але ті самі слова вони чули поколіннями.\n\nТімур виглядав схвильованим. Навіть якщо вже чув усе це, він завжди був найоптимістичнішим із них. Прем'єр-міністр продовжив: «Поки я говорю, розробляється низка ініціятив, які забезпечать свободу кожного громадянина цієї імперії. У парламенті ухвалюють закони, що закріплюють права етнічних меншин імперії. Дні, коли татар і башкирів дискримінували за віру та звичаї, скінчилися. Ми бачимо початок світлішого майбутнього для всіх численних народів імперії, і для мене найбільша честь допомогти привести імперію до цього нового майбутнього».\n\nТімур хвилювався ще більше, ніж зазвичай. Зазвичай Фєрдінант закликав би його заспокоїтися й стримати оптимізм, але тепер і сам не міг не відчувати надії. Він почув пристрасть у голосі цієї людини."
 vyatkareg.33.a: "Може, майбутнє буде кращим за минуле?"
 
 vyatkareg.34.t: "Потяг умів"
 vyatkareg.34.desc: "«Наступна зупинка - Вятка!»\n\nПровідник прогримів оголошення в мікрофон, і воно відлунювало всім потягом. Поки той гуркотів далі, на одному із сидінь можна було побачити чоловіка з донькою-підлітком, яка спала в нього на плечі. Це був Міхаіл Вальцвіч, російський еміґрант, як і решта пасажирів. Потяг гуркотів, а Міхаіл тихо сміявся. Він ніколи не очікував повернутися до Росії з донькою. Він утік під час громадянської війни з родиною, а тепер, після смерти дружини, приїхав сюди по нове життя для себе й доньки.\n\nТож ось вони вдвох у «потязі умів», повному науковців-еміґрантів, що прямували до Вятки. Вони дісталися через Архангельськ - єдиний безпечний шлях до Вятки через недавні війни. Потяг раптом зі скреготом зупинився; провідник повідомив пасажирам про прибуття, Міхаіл розбудив Алєксандру, і обоє вийшли. На станцію падав сніг, коли Алєксандра повернулася до батька:\n\n«То... це Вятка, так?»\n\nМіхаіл кивнув. «Так, це вона».\n\n«Ти бував тут замолоду?»\n\n«Ні, коли я був хлопцем, люди нижчих верств рідко виїжджали зі своїх околиць».\n\nАлєксандра невдовзі почала ходити станцією, вдивляючись у снігопад, і сказала: «Уперше в житті бачу сніг... тут завжди було так узимку?»\n\n«Так, сніг тут падає майже щороку».\n\nВони на мить замовкли, а тоді Алєксандра нарешті запитала:\n\n«Думаєш, мама й бабуся раділи б, що ми це зробили?»\n\nМіхаіл затримався, намагаючись вирішити, що сказати. Він поглянув на доньку, сльоза скотилася щокою, і він сумно промовив:\n\n«Я... я думаю, раділи б, якби ми були щасливі. Я щасливий, але... а ти?»\n\nІз ледь помітною усмішкою й сльозою, що теж ковзнула щокою, Алєксандра відповіла: «Так... щаслива, тату... щаслива»."
 vyatkareg.34.a: "І вони обійнялися під снігом."
 
 vyatkareg.35.t: "Імперія мислячої людини"
 vyatkareg.35.desc: "Цар Владімір III стояв на сходах щойно відкритої Імперської академії наук у Казані. Він дивився на натовп перед собою, на обличчя майбутнього Росії. Наступне покоління російської інтеліґенції готувалося розпочати шлях у науку.\n\nПерш ніж почати промову, цар глибоко вдихнув. «Дивлячись на вас, я бачу майбутнє імперії. Кожного без винятку з вас обрано вирушити в подорож, щоб дослідити глибини наук. Ви будете рушійною силою розвитку російської науки, носіями смолоскипа поступу». Владімір замовк і навмисно оглянув натовп. «Колись Росія могла похвалитися найкращими науковими умами цілого світу. Досягнення старої імперії вивели Росію з темряви. Ця наукова традиція пережила Велику війну, пережила большевиків і процвітатиме в нову добу відродження».\n\n«Є ті, хто називає російський народ варварами й дикунами, каже, що нам нічого дати науковій спільноті. Ці люди - найбільші дурні з усіх. Ми доведемо їм усім, що вони помиляються, відбудувавши велику наукову спільноту в нашій новій імперії». Царська промова завершилася, і натовп вибухнув оплесками. Студенти нетерпляче чекали початку свого шляху у світ наук. Багато хто народився в анархії і, хоч жив краще за більшість, не міг здобути нічого понад просту освіту. Вихідці з дворянства були краще підготовлені до прийдешніх днів, але навіть їм велося гірше, ніж колись їхнім батькам.\n\nНайкраще з усіх були підготовлені викладачі. Усі вони належали до старої інтеліґенції й пам'ятали дні, коли Росія була провідною науковою країною. Якщо це залежатиме від них, уже в недалекому майбутньому наукова спільнота знову благатиме про увагу імперських науковців."
 vyatkareg.35.a: "Наука - російська традиція."
 
 vyatkareg.36.t: "Відчинені двері"
 vyatkareg.36.desc: "У Росії було холодно, аж пиздець.\n\nТак думав Вейлон Андерсон, американський представник зі зв'язків із громадськістю «Anheuser-Busch», виробника «Budweiser». Він приїхав укласти угоду з імперським урядом про виняткову ліцензію на експорт вятської горілки до Сполучених Штатів. Як «Budweiser» був звичним пивом американської публіки, так вятська горілка стала улюбленою горілкою публіки Західної Росії. «Anheuser-Busch» сподівалася, що, здобувши виняткову ліцензію від Суверенної Держави, зможе прибрати до рук ринок дешевого алкоголю США.\n\nСаме тому послали Вейлона: він був одним із небагатьох працівників зі зв'язків із громадськістю, які трохи знали російську. Вейлон ніколи не бував у Росії й знав мову лише тому, що вивчав її поряд із німецькою, іспанською та італійською. Звиклому до теплого літа й м'якої зими Каліфорнії Росія зі своєю зимою здавалася ляпасом. Не допомагало й те, що місцеві у Вятці завжди просто... витріщалися на нього. Він припускав, що більшість ніколи не бачила іноземця, і поруч із ним вони явно ніяковіли.\n\nПроте це не мало значення: Вейлон приїхав по горілку, а не по людей. Зрештою він дістався Вятської винокурні, де його зустрів здоровенний чоловік із вигуком: «Вітаю, мій американський друже! Ласкаво просимо до Росії, де горілка щодня п'є вас!»\n\nВейлон подивився на нього. «Е-е, що?»\n\nЧоловік на секунду розгубився, а тоді похитав головою. «О, пробачте, друже! Я хотів сказати, що ви щодня п'єте горілку! Моя англійська недобра, перепрошую».\n\n«Ні, ви...»\n\nРаптом здоровенний чоловік стиснув Вейлона в міцних, теплих ведмежих обіймах. Зітхнувши, Вейлон подумав:"
 vyatkareg.36.a: "Боже мій, можна мені вже назад до кабінету, будь ласка?"

 #Superregional events
 vyatkasuper.1.t: "Імперський тріумф"
 vyatkasuper.1.desc: "Наблизивши вуста до мікрофона, прем'єр-міністр Алєксандр Солженіцин приготувався звернутися до країни й коротко звеличити перемоги свого солідаристського уряду в сибірських кампаніях.\n\nЦар Владімір поїхав до Омська, де мав оглянути захоплені заводські комплекси й зустрітися з місцевими політичними прихильниками, які довго й добре приховували монархічну відданість за попередніх режимів. Наступні кілька днів він відвідуватиме багато міст регіону, показуючи людям, що монарх прибув повернути їх до законного російського уряду.\n\n«Доброго вечора, народе імперії, - почав Солженіцин. - Сьогодні я говорю до вас про перемогу в багатьох формах. Спершу я говорю до вас про військову перемогу, адже останні рештки ворожої держави здалися офіцерам нашої хороброї Імператорської армії. Я говорю до вас про економічну перемогу, адже виробництво споживчих товарів досягло найвищих зафіксованих за весь час рівнів. Я говорю до вас про суспільну перемогу, адже мільйони росіян визволено з тиранії й повернуто до їхніх законних братів і сестер».\n\n«Знайте: у прийдешні дні подробиці цих перемог буде розкрито. Знайте також: це не кінець. Попереду ще перемоги, які треба здобути, - і їх здобудуть. Проте поки що тіштеся самими перемогами, можливими лише завдяки вашій незмінній відданості й наполегливій праці для держави, царя й одне одного».\n\nСолженіцин вимкнув мікрофон і відкинувся на спинку крісла. Йому здалося, що впорався він доволі добре."
 vyatkasuper.1.a: "Солідаризм - і цар - привели нас до перемоги!"

 vyatkasuper.2.t: "Імператор у клітці"
 vyatkasuper.2.desc: "Цар Владімір сидів у тьмяно освітленому кабінеті, прийняв знеболювальне від чергової міґрені й впав у розпач.\n\nУсе пішло не так, як він очікував. Коли він уперше прибув до Росії, коли повів свій народ із похмурих земель довкола Вятки до панування над усією Західною Росією, він був монархом із владою. Справжньою владою, як у колишніх Романових. Але від завершення Волоґодського конґресу цю владу забирали в нього шматок за шматком.\n\nСолідаристи перемогли, їхній заклик до національної сили й повернення земель знайшов відгук у народу - його народу, - а Солженіцин швидко взявся зміцнювати владу свого уряду і в межах конституції, і поза нею.\n\nЙого іменем ухвалювали «тимчасові» закони, а ініціятиви «національної безпеки» обмежували права мільйонів росіян. І він нічого не міг із цим удіяти.\n\nО так, він виголошував промови, відвідував заводи й головував у тепер уже беззубій раді. Але промови приносили готовими, екскурсії вели визначеним шляхом, а раду наповнили прихильниками солідаристів. Він знав, що предки ніколи не дозволили б такому статися. Але він, очевидно, зовсім не був на них схожий.\n\nТож він сидів у темряві, розмірковуючи, ким був і ким ніколи не стане."
 vyatkasuper.2.a: "Чергова міґрень."

 vyatkasuper.3.t: "Декомунізація"
 vyatkasuper.3.desc: "Державні зусилля з повернення нових територій уже далеко просунулися, і тепер увагу звернули на ворогів, які залишилися в наших кордонах.\n\nХоча більшість мільйонів росіян у нашій країні підтримує царя та його уряд, багато хто досі вірний попереднім ідеологіям. Зокрема, залишається чимало прихильників великої ракової пухлини комунізму. Їх треба викорінити, щоб ідеологія, яка привела Росію до ганебної руїни й тиранії, не піднялася знову й не повторила цього.\n\nБуде вжито випереджувальних заходів. У дію запустять поєднання пропаґанди й загальнодержавної кампанії перевиховання разом зі скоординованим наступом Охрани, звичайної поліції та військових сил. Комунізм буде знищено, а на його місці закріплять новий російський дух, що згуртує народ для світлого майбутнього попереду."
 vyatkasuper.3.a: "Справедливість здійсниться."

 vyatkasuper.4.t: "Звіт про стан справ"
 vyatkasuper.4.desc: "Прем'єр-міністрові Алєксандру Солженіцину:\n\nНаші зусилля на щойно завойованих територіях Західного Сибіру загалом успішні: ми використовуємо щедро надану урядом політичну й фінансову підтримку для виявлення інформаторів, невикористовуваних архівів та інших джерел розвідданих про колишніх оперативників і членів екстремістських організацій, що раніше діяли в регіоні.\n\nНа сьогодні наші аґенти розшукали й захопили сотні осіб, пов'язаних із місцевими комуністичними партіями, а також із Чорною Лігою. Допити цих осіб, своєю чергою, дають додаткові відомості про інших, тож темп наших зусиль зростає.\n\nПроте мусимо також доповісти: спроби здобути місцеву підтримку цільовими інформаційними кампаніями виявилися менш успішними, що, ймовірно, пояснюється антимонархічними настроями, підсиленими попередніми режимами. Утім, попри витрати, ми вважаємо продовження їх до досягнення ефективности гідною інвестицією. Коли місцеві мешканці перестануть постійно відкидати ваш уряд, а в регіон надійдуть заплановані додаткові економічні вкладення, із часом можна буде здобути підтримку.\n\nУ будь-якому разі ми й далі забезпечуватимемо безпеку держави.\n\nЗ повагою,\nБоріс Смисловскій\nГолова Охрани."
 vyatkasuper.4.a: "За імперію."

 vyatkasuper.5.t: "Сильна імперія"
 vyatkasuper.5.desc: "Хоча багато хто назвав би Алєксандра Солженіцина жорстоким, сам прем'єр-міністр так про себе не думав.\n\nЗрештою, солідаристи твердо вірили в громаду й співпрацю, а природним наслідком цього були дії, настільки рішучі, наскільки потрібно, проти тих, хто не належав до цієї громади. Для Солженіцина це означало всіх поза солідаристським рухом.\n\nНа різку противагу, в самому русі його бачили героєм, єдиною людиною, готовою зробити необхідне для безпеки й стабільности імперії. Зробити необхідне, щоб підготувати її до безсумнівно жахливих злигоднів і конфліктів попереду. Та якби вони знали, що він справді думає, він сумнівався, що його так обожнювали б.\n\nВін добре усвідомлював смертність і власну, і свого руху. Авторитарний у самій основі, він знав, що історичні книги прийдешніх поколінь навряд чи будуть до нього добрі. Але цю ціну він був готовий заплатити. Зараз Росія мусила бути сильною. Не доброю, не рівноправною, навіть не чесною. А сильною. В осяжному майбутньому виживання було важливішим за щастя чи свободу.\n\nВін глянув у вікно на захід, де, як він знав, робітничі бригади мали рушати будувати дороги, які він дозволив раніше того дня. Дороги, якими одного дня Імператорська армія піде до Москви.\n\nЙого країна знову була сильною й невдовзі стане цілою. Що хто про нього думав, не мало ані найменшого значення."
 vyatkasuper.5.a: "Усе для Росії."

 vyatkasuper.6.t: "Зустріч із царем"
 vyatkasuper.6.desc: "Васілій Шульґін, тепер прем'єр-міністр Шульґін, сидів у царській приймальні, готуючись до першої офіційної зустрічі з монархом у новій ролі голови уряду. Вона була значно, значно менш розкішною за ту, яку він пам'ятав багато років тому. Можливо, у цьому й був задум.\n\nВін підвівся, коли ввійшов цар, і завмер, побачивши свого суверена не в офіційних державних реґаліях. У вільній сорочці й зручному взутті він здавався майже звичайною людиною. Шульґін знав, що такого не можна дозволяти поза цими приватними кімнатами.\n\nВін дивився, як цар відпустив камердинера, перетнув кімнату й сів у крісло. «Сідайте, Васілію», - наказав Владімір із легкою усмішкою. Шульґін підкорився.\n\n«Ваша Величносте, - відповів він, - дякую, що знайшли для мене час. Дуже радий запрошенню сформувати ваш уряд і присягаю вірно служити вам та цій імперії». Він не міг не відчувати ваги й відповідальности цих слів.\n\nВладімір знову всміхнувся, і Шульґін на мить мимоволі побачив у цареві хлопчика. Хлопчика з родини, яку він колись, давно-давно, підвів. Родини, яку був рішуче налаштований більше ніколи не підвести.\n\nЦар подякував йому й запитав про плани і щодо кабінету, і щодо країни загалом. Минуло багато годин, перш ніж хтось із них залишив кімнату."
 vyatkasuper.6.a: "Нарешті, нарешті прем'єр-міністр для Романових."

 vyatkasuper.7.t: "Змарнований потенціял"
 vyatkasuper.7.desc: "Уже вкотре Роман Ґуль знову переглядав виборчі цифри конґресу. Немов вони з нього глузували.\n\nУсі вважали його та конституційних демократів аутсайдерами, але вони спростували цю оцінку, значно перевершивши прогнози майже в кожному окрузі, від Архангельська до Самари. Вони підійшли так близько, так близько до здобуття влади, з якої можна було б просувати справжні зміни. Але зрештою цього не вистачило.\n\nНарод обрав традицію замість поступу, й уряд формуватимуть не кадети, а Шульґін із консерваторами. Та, думав він, не все втрачено. Кадетів обрали досить, щоб утворити великий владний блок, і він сподівався, що вони зможуть і домовлятися про добрі реформи, і, де можливо, перешкоджати застою. А потім він отримав «престижне» призначення до Сиктивкара - від самого царя.\n\nВід імператорського призначення не відмовляються, тож він зібрав валізи, дістався завойованої столиці й обійняв, як швидко виявилося, безвладну посаду. Шульґін відіслав його туди, де він не міг створювати клопоту. Не міг просувати своєї програми. Але навіть у внутрішньому засланні Ґуль не дозволить забути ідеали, яким присвятив життя.\n\nБагато хто в Комі зазнавав дискримінації, і якщо він вчасно подасть звіт, залишиться шанс, що хтось зі справжньою владою щось із цим зробить.\n\nРаніше він ризикував і з меншими шансами."
 vyatkasuper.7.a: "Ідеаліст за будь-яких обставин."

 vyatkasuper.8.t: "Царське звернення"
 vyatkasuper.8.desc: "«Доброго вечора, громадяни Росії, хоч би де ви були. Сьогодні я говорю з вами і про ваш уряд, і про ваше майбутнє та сподіваюся, що ви знайдете кілька хвилин вислухати мене».\n\n«Як вам, певен, відомо, уряд, обраний на Волоґодському конґресі, уже мав певний час для втілення своєї політики. Її наслідки вже встигли стати помітними, і, працюючи заради амбітного майбутнього, яке колись обіцяв, прем'єр-міністр Шульґін і далі має мою повну довіру».\n\n«Але ми ще не дісталися того майбутнього й мусимо далі для нього працювати. Це майбутнє возз'єднаних земель. Майбутнє возз'єднаних родин і народу. Майбутнє визволення мільйонів, що живуть під тиранією і окупантів, і самозваних деспотів. До цього майбутнього ми крокуватимемо разом, єдині в меті».\n\n«Справді, це майбутнє, у яке кожен із вас уже зробив внесок. Кожен, хто подав голос, чи то селянин, робітник, солдат, лікар, політик, чи цар, довів свою відданість нашій великій країні, коли вона виходила зі свого кокона».\n\n«Останні кілька років були нелегкими, і я не можу пообіцяти, що попереду не буде таких самих важких часів. Проте можу пообіцяти: ні я, ні прем'єр-міністр не спочинемо, доки Росія не возз'єднається, а весь наш народ не пізнає свободи, яку тепер пізнали всі ви. Прошу зберігати віру і в нього, і в мене до того великого дня».\n\n«Просячи ваших молитов, бажаю доброї ночі»."
 vyatkasuper.8.a: "Здається, починається новий день."

 vyatkasuper.9.t: "Пам'ять про трагедію"
 vyatkasuper.9.desc: "Відпрацьованим рухом людини, яка робила це сотні разів, Ґріґорій однією рукою притиснув до стіни плакат і цвях, а другою замахнувся молотком.\n\nВін не знав, наскільки впливає кампанія, але точно знав, скільки чоловік від уряду платить за кожен плакат, і цього вистачало. Поруч його друг Константін теж прибивав плакати, хоча значно розслабленіше й менш вправно. Ґріґорій штовхнув його ліктем у бік.\n\n«Швидше! - просичав він. - Не закінчимо цю вулицю за годину - не дадуть наступної коробки».\n\nКонстантін у відповідь знизав плечима. «Знаєш, не розумію, навіщо вони взагалі з цим морочаться, - сказав він. - Їх ніхто навіть не читає. Люди не перестануть називати його Свєрдловском, то навіщо мер це робить?»\n\nҐріґорій недовірливо глянув на нього. «Не знаєш? Як...» Він глибоко вдихнув і прибив ще один плакат, перш ніж продовжити. «У Свєрдловску большевики розстріляли старого царя. На наступну річницю планують велике вшанування, а мер намагається вислужитися, повернувши назву, яку вони змінили».\n\nКонстантін здивувався. «Гм. А я думав, старого царя з родиною повісили в Москві. Наприкінці великого суду».\n\nҐріґорій знову зітхнув. «От і ні». Він передав Константінові половину решти плакатів. «А тепер годі гаяти час, прибивай їх, щоб ми отримали гроші й пішли додому»."
 vyatkasuper.9.a: "З поверненням, Єкатєрінбурґу."

 vyatkasuper.10.t: "Нові клієнти"
 vyatkasuper.10.desc: "Спочатку Вен радів пожвавленню справ у своїй майстерні. Доки не зрозумів, що майже всі нові клієнти - росіяни.\n\nУдмурт серед башкирів в Уфі, Вен добре знав, що означає бути меншиною. Він також добре навчився визначати етнічний склад місць, де жив. І ця навичка підказувала, що росіян в Уфі раптом стало значно більше, ніж зовсім недавно.\n\nЗвісно, думав він, Уфа зростала й до об'єднання, але не настільки, щоб так швидко привабити стількох російських переселенців. Настільки швидко, що за збереження тенденції етнічні росіяни становитимуть найбільшу групу саме до муніципальних виборів.\n\nВін глянув на конверт на прилавку - лист від сестри з Іжевска. Він роками не повертався до удмуртських земель, бо досі дуже любив жити в Уфі. Він не був схожий на башкирів і не молився тому самому богові, але його однаково прийняли. В Уфі всіх, хто так довго жив у тіні росіян, запрошували розділити сонячне світло.\n\nАле тепер росіяни повернулися, на краще чи на гірше, і скільки мине часу, перш ніж його знову бачитимуть чужинцем у російському місті? Ні, він краще житиме серед людей, які приймають його за свого, навіть якщо доведеться залишити це життя позаду.\n\nНастав час збирати валізи."
 vyatkasuper.10.a: "Час додому."

 vyatkasuper.11.t: "Велике каліцтво"
 vyatkasuper.11.desc: "Натовп гримів оплесками, коли прем'єр-міністр Васілій Шульґін перетнув сцену й підійшов до трибуни.\n\nДіставши з піджака промову й окуляри, він оглянув людей перед собою. Багато хто був звичайним громадянином, але були й представники кожної газети, радіостанції та вперше - телевізійних станцій, чиї камери зосередилися на ньому. Він знав: усі почують його промову. І всі зрозуміють велич того, що вона обіцяє.\n\n«Громадяни імперії, - почав він, - сьогодні я говорю до вас про велике каліцтво. Велике каліцтво, завдане Росії силами і зсередини, і ззовні».\n\n«Зсередини - большевиками, які підступно вбили свого царя й занурили країну в темряву своєю некомпетентністю, дурістю й кровожерністю. Ззовні - нацистами, які відірвали мільйони росіян від їхньої землі, віддали їх в огидне рабство й до того ж украли їхнє, та й ваше, майбутнє. І я кажу вам: годі!»\n\n«Цар, а отже, й мій уряд, не спочине, доки ми не повернемо те, що належить нам по праву. Доки всіх його підданих не буде визволено, а всі його землі, від Санкт-Пєтєрбурґа до Владівостока, не возз'єднаються й не розквітнуть. Це каліцтво буде зцілено. Зцілено вами. Зцілено моїм урядом. Зцілено Його Імператорською Величністю!»\n\n«Тож, народе імперії, приєднуйтеся до мене в цій праведній боротьбі! Бог і цар із нами, і коли вони приєднаються до дітей батьківщини, що крокують в одному строю, усіх нас разом не зупинити! Росія знову буде славною!»\n\nПромова тривала, але насправді її вже ніхто не чув: голос Шульґіна тонув у какофонії вітальних вигуків."
 vyatkasuper.11.a: "Навіть цю рану можна зцілити."

 vyatkasuper.12.t: "Звернення до народу"
 vyatkasuper.12.desc: "До Пєрмі повернувся вечір, завершивши ще один день руйнування. Руйнування жахливої спадщини ненависного Арійського «Братства» - справа, необхідна і для Росії, і для тих, хто жив у колись величному місті, яке з часом могло знову стати величним.\n\nНа околиці міста Алєксандр Мєдвєдєв повертався додому, вшанувавши пам'ять покійної дружини. Як і щовечора від обрання прем'єр-міністра Ґуля та його кадетів, Мєдвєдєв приготував просту вечерю й сів перед радіо. Але сьогодні, на відміну від інших вечорів, мали передавати промову того самого прем'єр-міністра. І після короткого переходу вона почалася.\n\n«Доброго вечора, співгромадяни, - почав Ґуль. - Сьогодні я говорю з вами як ваш прем'єр-міністр, щоб дати обіцянку. Обіцянку, яку стверджую перед усіма народами Росії, від Архангельська до Самари й від Москви до Владівостока: ви пізнаєте краще завтра».\n\n«Мій уряд у тісній співпраці з царем, людиною, чия відданість визволенню ніколи не хиталася, забезпечить основні й заслужені свободи кожного громадянина імперії. Віра чи культура людини не мають значення, бо всі ці люди, як і ви, - росіяни. Усі росіяни, які одного дня, вже скоро, житимуть у мирі й добробуті під імперським прапором!»\n\nХоча радіо Мєдвєдєва було простим, навіть він чув, як щирість Ґулевих слів лунає кімнатою. І вперше від повернення царської влади до Пєрмі відчув надію.\n\nВін знав, що й решта Росії не може не відчувати того самого."
 vyatkasuper.12.a: "Надія повертається до Росії."

 vyatkasuper.13.t: "Меланхолія сталевого серця"
 vyatkasuper.13.desc: "Генерал Ніколай Румянцев більшу частину життя був солдатом, спочатку французів, а тепер царя, і за цей час добре пізнав і вершини людської звитяги, і глибини ницости.\n\nВін пам'ятав праведний гнів, який так довго вів його від самої Франції до пекла Північної Африки, навіть коли все здавалося, та й справді було, втраченим. А тепер, спостерігаючи за новобранцями на початковій підготовці, він відчував глибоку меланхолію.\n\nВін вірив у справу царя Владіміра - забезпечити майбутнє землі предків, - але не міг забути життів, уже втрачених на цьому шляху, і тих, які ще буде втрачено в міру його продовження. Особливо коли почнеться неминуча кампанія за здобуття окупованих німцями земель на заході.\n\nХлопці перед ним були сильними чоловіками, сповненими праведного гніву, і їх добре навчать. Але він знав: вони не готові зустріти справжню ницість німецької загрози. Не готові до м'ясорубки, у яку їх кинуть.\n\nТа він не дозволить цьому себе зупинити. День остаточного зіткнення Росії з Німеччиною швидко наближався, і він підготує їх до нього якнайкраще."
 vyatkasuper.13.a: "Наша робота ніколи не скінчиться."

 vyatkasuper.14.t: "Ознака кращих днів"
 vyatkasuper.14.desc: "Знову йдучи вулицями Вятки, Яков Рівкін не міг не дивуватися змінам, що охопили місто. Він бачив їх на кожному кроці.\n\nБачив у цілковитій відсутності ворожих поглядів, які колись його переслідували. Бачив у відсутності головорізів, що колись тероризували єврейський квартал. І бачив, увійшовши до кошерної м'ясної крамниці, на обличчі Ісаака: очі засяяли, а усмішка розширилася так, як Яков не бачив уже багато років.\n\n«Якове! - вигукнув Ісаак. - Як ти, друже?»\n\n«Давно не почувався так добре, Ісааку», - чесно відповів Яков. Дні після жорстокого побиття людьми з Російського охоронного корпусу справді принесли зміни і в його життя, і в життя ширшого єврейського населення Вятки. «Мені знову як завжди. Ми з Рахель сьогодні вечеряємо разом». Він глянув у вікно. «Я помітив, що РОК тут, здається, більше немає».\n\nЗбираючи Якові покупки, Ісаак у відповідь засміявся. «Немає, більше немає. Поліція нещодавно їх забрала. Прем'єр-міністр, здається, серйозно ставиться до обіцянок». Він продовжив, складаючи товари в пакунок. «Знаєш, від його обрання в мене побільшало клієнтів. Навіть неєвреїв».\n\nЦе здивувало Якова, хоча й дуже підбадьорило. Побажавши м'ясникові доброї ночі, він пішов додому.\n\nТільки тепер він не поспішатиме, а насолодиться прогулянкою."
 vyatkasuper.14.a: "Гарний вечір для домашньої вечері."

 vyatkasuper.15.t: "Зустріч із царем"
 vyatkasuper.15.desc: "Хоча він усе життя працював, щоб дістатися нинішньої посади, прем'єр-міністр Роман Ґуль не міг стримати хвилювання, входячи до царського кабінету.\n\nВін знав, що його політика докорінно відрізняється від царської, і лише сподівався, що монарх погодиться вислухати. Коли Владімір сердечно привітав його й запросив сісти, Ґуль висловив пошану та заговорив.\n\n«Дякую за цю зустріч, Ваша Величносте. Знаю, що багато в чому ми не сходимося, але хочу, щоб ви знали: і я, і мій уряд нічого не бажаємо більше, ніж привести імперію в сучасну добу».\n\nЦар повільно кивнув. «Розумію, пане прем'єр-міністре, - сказав він дещо скуто. - Я покладаю... великі надії на ваше урядування».\n\nҐуль вирішив говорити прямо. «Радий це чути, Ваша Величносте. Знаю, що я, точніше ми, навряд чи були вашим особистим вибором для формування уряду, але ми цілком поділяємо ваші погляди на рішуче досягнення об'єднання. Проте мушу наголосити: помилкам минулого, негнучкості політики, яка дозволила і комунізмові, і фашизмові розділити Росію, не дозволять укорінитися знову. А для забезпечення стабільности люди мусять бачити, що монархія підтримує програму свого уряду».\n\nЦар довго мовчав, і Ґуль боявся найгіршого. А тоді Владімір знову кивнув, цього разу з більшою задумою на обличчі. «Розумію, Романе, - сказав він, явно ухваливши рішення. - Ми працюватимемо разом».\n\nЗустріч триватиме далі, але коли за багато годин вона закінчилася, Роман Ґуль уперше за довгий час відчув упевненість, що все справді ось-ось покращає."
 vyatkasuper.15.a: "Порозуміння між дуже різними людьми."

 vyatkasuper.16.t: "Поганий вечір"
 vyatkasuper.16.desc: "Сидячи за своєю маленькою бронзовою табличкою, Боріс Смисловскій лютував. Йому щойно сказали: Ґуль планує урізати їхній бюджет. Значно. Майже до нуля.\n\nТакі люди, ліберали, як Ґуль, були всі однакові. Ідеалісти неспроможних систем, вони вірили в перенаправлення ресурсів із безпеки на соціальні програми. При цьому все, чого вони досягали, чого будь-коли досягли, - робили державу вразливою до підривної аґентури. Для інакодумців. Для комуністів!\n\nКоли Ґуль закінчить, фінансування Охрани ледве вистачатиме на основну діяльність, не кажучи вже про повноцінні розслідування чи вербування аґентів. Гірше того, ті, хто досі співчував справжньому призначенню Охрани, сказали йому, що Ґуль має намір вимагати його відставки.\n\nЙого! Його, що збудував Охрану з нічого до однієї з найефективніших і найстрашніших служб, які коли-небудь бачила Росія. Його, що захищав державу й царя від незліченних змов! Його, що аж ніяк не мав наміру йти у відставку.\n\nАле попри всю проникливість Смисловского у світі розвідки, політиком він не був, і коли спробував зателефонувати людям, яких вважав союзниками, намагаючись уникнути неминучого, ніхто не відповів на його дзвінок. Тож коли зрештою зателефонували з кабінету Ґуля, вибору в нього не було.\n\nОхрану випатрали, і він міг лише змиритися."
 vyatkasuper.16.a: "Кінець доби."

 vyatkasuper.17.t: "День для роздумів"
 vyatkasuper.17.desc: "Цар Владімір III сидів за столом, відчуваючи те, чого давно не відчував, - справжнє вдоволення.\n\nОдразу після обрання кадетів він хвилювався. Він не поділяв політичної позиції Ґуля й думав, що стабільність, за яку так завзято боровся, опиниться під загрозою. І все ж усе склалося добре. Краще, ніж очікувалося.\n\nҐуль виявився надзвичайно здібним адміністратором, а його відданість забезпеченню стабільности й добробуту і держави, і російського народу не викликала сумнівів. Владімір знав, що з ним чи без нього імперія розширюватиметься й ставатиме кращим місцем для всіх своїх людей, росіян чи інших. Це буде імперія, у якій він із гордістю дивитиметься, як росте його донька.\n\nПроте, думаючи про це майбутнє, цар думав і про минуле. Про темні дні колаборації. Про помилкові рішення. Про численні питання, які ставив собі. І виявив, що ближчий, ніж будь-коли, до відповіді на багато з них. Імперії ще далеко йти, а йому належав іще довший шлях. Але він пройде його з високо піднятою головою.\n\nВладімір підвівся й побачив шухляду. Він раптом усвідомив, що вже багато днів не брав піґулок, а тоді зрозумів, що й не потребував їх.\n\nМіґрені більше не приходили."
 vyatkasuper.17.a: "Сьогодні гарний день. Завтра буде ще кращим."
 
 vyatkasuper.18.t: "Лист від Скосирєва"
 vyatkasuper.18.desc: "Цареві Владіміру III, цареві всієї Русі, Божою милістю, підкорювачеві большевиків і переможцеві зрадників\n\nЯ, Боріс Скосирєв, палко прошу надати мені володіння містом Омськ і прилеглими територіями, а також титул князя та його щедрі винагороди.\n\nМені відомо, що вам потрібна допомога в управлінні щойно приєднаними територіями, і я бажаю служити вашим васалом в управлінні містом Омськ. Завжди моїм найзаповітнішим бажанням було служити російській монархії як вельможа, і це було одним із головних прагнень мого життя. В обмін на це володіння я присягну вам у вічній вірності. Також присягну, що за мого правління Омськ перетвориться на найзаможніше місто царства, і ви побачите великі плоди мого керівництва.\n\nПрошу вас пам'ятати про моє служіння вам, обмірковуючи це рішення, і згадати, яким вірним я був у часи боротьби. Якщо ви удостоїте мене такої милости, я неодмінно відплачу сповна.\n\nВаш шановний головний міністр закордонних справ, колишній князь Андорри, колишній граф Оранжу, барон Боріс Міхаіловіч Скосирєв-Маврусов."
 vyatkasuper.18.a: "Ким він себе вважає?"
 
 vyatkasuper.19.t: "Боріс попався!"
 vyatkasuper.19.desc: "Ми отримали звістку, що нашого головного посадовця із закордонних справ Боріса Скосирєва, відрядженого до Сполучених Штатів зі звичайною дипломатичною місією, заарештували американські аґенти в аеропорту, коли він повертався до Росії. Заарештований за спробу контрабандою вивезти наркотики з країни, він нині перебуває в американській в'язниці. Один із помічників повідомив нам, що «він просто хотів добре розважитися».\n\nВідряджений розвивати відносини зі Сполученими Штатами й рештою ОВН, Боріс, здається, не надто добре виконує роботу. Подальші повідомлення свідчать, що більшу частину часу в Америці він гуляв на вечірках, а не працював. Та чого ще тепер очікувати?\n\nВитягти його з країни без жодних звинувачень буде дорого, але в нас має бути досить добрих домовленостей зі США, щоб витягти його, відбувшись лише грошовими витратами. Деякі міністри кажуть, що треба просто залишити його там: від нього переважно самі перешкоди. Проте Владімір III вирішив повернути його до Росії. Може, цього разу він навіть чогось навчився?"
 vyatkasuper.19.a: "Знаючи Скосирєва, сумніваюся."
 
 vyatkasuper.20.t: "Віч-на-віч із дійсністю"
 vyatkasuper.20.desc: "У спогадах про Російську імперію абсолютна влада зосереджувалася в руках царя - сумлінного правителя, відданого народові, своєрідної батьківської постаті.\n\nПринаймні так її пам'ятали деякі люди або так їх навчили думати. Наприклад, цар Владімір Романов, народжений після падіння самодержавства, досі тримався ідеї царя як могутнього правителя, що сумлінно працює заради блага народу. Проте цю ідею ставили під сумнів Ґуль і його реформи, які невпинно перетворювали російську монархію на конституційну.\n\nЦар і прем'єр-міністр сиділи на канапі в імперському стилі, яка перейшла у власність Владіміра, - своєрідній пам'ятці минулої доби, якої він особисто ніколи не знав. Він домовився про зустріч із Ґулем щодо привілеїв своєї родини й себе самого, бо останніми днями його почали мучити страхи, що їх скоротять, якщо не скасують зовсім.\n\n«Ваша Імператорська Величносте, розумію ваш страх утратити монарші привілеї, особливо коли повноваження, що належали вам до недавніх реформ, забирають, аби полегшити тягар на плечах Вашої Величности. Проте запевняю: їх не заберуть за жодних обставин, бо ви передусім залишаєтеся царем, а ще тому, що ви символ для народу».\n\nВладімір дуже уважно слухав, киваючи на запевнення Ґуля, а невеликий тягар спадав із грудей. Можливо, прем'єр-міністр був із ним не зовсім чесним, і лише час покаже, чи це так, але зараз Владімір майже повністю довіряв словам Ґуля."
 vyatkasuper.20.a: "Дійсність і вигадка - речі мінливі."
 
