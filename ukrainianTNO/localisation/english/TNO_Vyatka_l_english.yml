 # Leaders
 VYT_Vladimir_III: "Владімір III"
 POLITICS_TSAR_VLADIMIR_DESC: "Народжений у вигнанні 1917 року, великий князь Владімір Кірілловіч Романов очолив Російський імператорський дім у вигнанні 1938 року після смерти батька Кірілла Владіміровіча, двоюрідного брата покійного царя Ніколая II.\n\nКоли почалася Друга світова війна, він мешкав у Бретані й невдовзі разом із родиною опинився під німецькою вартою. На «наполягання» німецької влади невдовзі почав співпрацювати: виступав по радіо, закликаючи росіян покидати совєцький режим. Наприкінці війни йому запропонували реґентство в Україні, але він відмовився, бо це неприйнятно розділило б Росію.\n\nПроте навіть після війни Владімір не міг повернутися до Росії: німці побоювалися, що його популярність, як уже сталося з Власовим, може підірвати їхнє панування. Лише під час Західноросійської війни він переконав їх дозволити зібрати дивізію монархістів і білих вигнанців для надзвичайно успішного контрнаступу. Наступ Вермахту зупинився, а Владімірів - ні: він прорвався й утворив осередок монархічної влади в Росії.\n\nЗа подальші роки новопроголошений цар Владімір III мало досяг у розширенні цього осередку, натомість дістав іще й чимало внутрішніх клопотів. Тепер цар чекає слушного часу, коли зможе вдарити й повернути всю Росію - свою за божественним правом народження."
 
 VYT_Boris_I: "Боріс I"
 POLITICS_BORIS_SKOSSYREFF_DESC: "Історія останнього монарха Західної Росії, Боріса I, дивна, але захоплива. Боріс Міхаіловіч Скосирєв народився в заможній родині у Вільні, тоді частині Російської імперії. Хоч його родина належала до дворянства, від народження він не мав прав на жоден престол; та чого не дав родовід, те здобуде сам.\n\nКоли спалахнула Жовтнева революція, Боріс утік і став одним із численних еміґрантів. Невдовзі відзначився в Британському міністерстві закордонних справ, виконав чимало місій, прибув до Нідерландів, а потім знайшов місце своєї досі найвідомішої пригоди: країну Андорру. Ретельно все спланувавши, у 1930-х за народної підтримки взяв князівський титул і пообіцяв привести Андорру в сучасну добу. Невдовзі його заарештували й ув'язнили, але, на щастя, після кількох років у в'язницях Західної Европи нацистська окупаційна влада звільнила його, і він почав із нею співпрацювати. Коли почалися Західноросійська війна й похід царя Владіміра, радо приєднався й стояв поруч як вірний зв'язковий - доки це не стало незручно.\n\nСкосирєв не сидів без діла, поки Антикомуністична гвардія здобувала перемогу за перемогою. Одного дня, коли війська наблизилися до Вятки, він із пострілами прийшов до центру міста й оголосив кінець колишньої західноросійської влади: її замінила армія Кірпічнікова. Замість корумпованих міських правителів тепер Боріс I править як князь Вятки й охоронець прикордоння від імени Антикомуністичної гвардії та російського народу. Скільки проіснує це князівство - хто знає."

