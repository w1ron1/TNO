 ### Regional political tree ###
 VYT_the_sovereignty: "Суверенна Держава"
 VYT_the_sovereignty_desc: "Абсолютна влада, можливо, й годилася в перші відчайдушні дні у Вятці, але тепер уже ні. Суверенна Держава - справжня країна, з усіма вимогами, які це накладає, а одна людина не може правити мільйонами.\n\nЦе дає нам нагоду створити перший законний, та ще й імперський, російський уряд від закінчення громадянської війни в Росії. Хоча нашу владу ще належить зміцнити, можна сформувати належний кабінет і побудувати справжній уряд. Якщо все піде добре, переговори з політичними фракціями в нашому уряді мають пройти гладко."

 VYT_the_congress_of_vologda: "Волоґодський конґрес"
 VYT_the_congress_of_vologda_desc: "До нашого завоювання Волоґда й Нейтральна зона довкола неї здобули репутацію місця миру та стабільності. Ми можемо скористатися цим. Конґрес, обіцяний так давно, мусить відбутися, і відбутися він може у Волоґді.\n\nНа нього запросять представників усіх головних політичних фракцій, а обговорення триватимуть, доки не буде сформовано кабінет першого справжнього царського уряду. Очікується, що між фракціями, ймовірно, виникнуть значні суперечки, але хоч би що сталося, Волоґодський конґрес стане історичною подією - створенням першого монархічного уряду в Росії за сорок років.\n\nМи не втратимо цієї нагоди."

 VYT_the_bright_hour_knocks: "Б'є світла година"
 VYT_the_bright_hour_knocks_desc: "Як багато хто й очікував за монархічного режиму, в Суверенній Державі перемогли реакційні настрої. Після тижнів дебатів у Волоґді переможцем вийшов непохитно консервативний Національний союз солідаристів під проводом Алєксандра Солженіцина, на жах багатьох ліберальніших кандидатів.\n\nСолідаристи заявили про підтримку громадянських свобод і демократичних цінностей, водночас проголосивши прагнення посилити роль православного християнства та співпрацю між суспільними класами.\n\nСолженіцину, наділеному повною довірою царя, тепер доручено зміцнити довіру до його політики та її підтримку. Проте ще невідомо, чи прийме російський народ загалом такий різкий поворот до традиціоналістської політики."

 VYT_for_the_good_of_the_cause: "Заради спільної справи"
 VYT_for_the_good_of_the_cause_desc: "На думку солідаристів, довгі роки війни й злиднів призвели до різкого занепаду традиційної російської моралі. Занепаду, який треба подолати, якщо країна має процвітати. Тепер, отримавши справжню політичну владу, вони нарешті можуть це зробити.\n\nРелігія знову посяде чільне місце, з абсурдністю класового поділу боротимуться, а традиційні цінності, осердя російського духу, утверджуватимуть. Свого часу, попри нарікання ліберальніших фракцій уряду, російський народ побачить цінність у тому, щоб згадати своє коріння й повернутися до нього."

 VYT_a_temporary_dictatorship: "Тимчасова диктатура"
 VYT_a_temporary_dictatorship_desc: "Росія й далі в хаосі, і перший крок до його подолання - забезпечити порядок і стабільність у царському уряді. Без сильного й милосердного лідера демократію неминуче поглинуть демаґоґія, популізм або, що гірше, соціялізм. Цар може бути таким лідером, але йому потрібна допомога солідаристів.\n\nТому прем'єр-міністр Солженіцин подав законопроєкт про надання собі надзвичайних повноважень на цей час нестабільності. Його опоненти називають його диктатором, але вони просто не розуміють величезних проблем, які нині стоять перед Росією."

 VYT_the_old_ways_triumphant: "Тріюмф старих порядків"
 VYT_the_old_ways_triumphant_desc: "Обравши середній шлях між реформістськими й реакційними настроями, Волоґодський конґрес доручив сформувати уряд консервативному Всєроссійскому национальному союзу під проводом Васілія Шульґіна.\n\nНаділені давно бажаною владою, його діячі зберігатимуть і зміцнюватимуть монархічні установи та триматимуть царя і його бажання в центрі урядової політики, водночас здійснюючи програму націоналістичного об'єднання.\n\nОчікується, що Шульґін і цар тісно й плідно співпрацюватимуть, придушуючи чи блокуючи вплив і пропозиції як кадетів, так і солідаристів."

 VYT_ensure_stability: "Забезпечити стабільність"
 VYT_ensure_stability_desc: "Хоча імперська влада нарешті повернулася до Росії, багато хто досі вагається її прийняти. Люди бачать лише невдачі большевицької революції, а не успіхи попередніх століть. Їм треба нагадати.\n\nХоча на це знадобиться час і кілька суто символічних реформ, народ невдовзі побачить, що консервативний монархізм старої традиції може й буде забезпечувати стабільність, якої Росія дуже давно не знала.\n\nЗрештою, влада Романових тривала століттями. Вона може тривати ще століття."

 VYT_the_status_quo_secured: "Статус-кво збережено"
 VYT_the_status_quo_secured_desc: "Забезпечивши політичну владу центрові, не віддавши її квазісоціялістичним кадетам і квазіфашистським солідаристам, союз зберіг стабільність держави. І зберігатиме її надалі.\n\nРадикальні пропозиції обох сторін можуть призвести лише до руїни, тож союз подивиться в інший бік: у минуле. Він покладатиметься на перевірені методи замість небезпечних реформ. Царя і його двір берегтимуть та радитимуть їм. У ці небезпечні часи чинити інакше було б нерозумно."

 VYT_victory_for_the_kadets: "Перемога кадетів!"
 VYT_victory_for_the_kadets_desc: "На подив багатьох, особливо в монархічній державі, на Волоґодському конґресі переміг лібералізм. Конституційні демократи, відоміші як кадети, під проводом Романа Ґуля здобули підтримку більшості делеґатів і невдовзі сформують уряд.\n\nКадети оголосили про намір запровадити реформи, за які давно виступали, і збираються зосередити переважну увагу на сприянні соціальній мобільності й особистим свободам.\n\nХоча відносини Ґуля з царем, імовірно, будуть непростими, цар прийняв і підтримав результати виборів. Проте ще невідомо, чи готова країна загалом до такої різкої зміни урядових пріоритетів, і Ґулю доведеться докласти чимало зусиль, щоб довести їхню цінність."

 VYT_begin_the_reforms: "Розпочати реформи"
 VYT_begin_the_reforms_desc: "Після років політичної ізоляції кадети всупереч усім очікуванням здобули мандат на урядування. Наділені цим мандатом, тепер вони можуть узятися до реформ, які вважають давно назрілими.\n\nПоряд із багатьма іншими реформами буде закріплено й розширено демократичні принципи та послаблено ринкове реґулювання. Хоча це викличе гнів і реакційних, і консервативних сил, із часом вони побачать цінність у наданні звичайному росіянинові гідності та свободи.\n\nБо коли сили здобуває людина, їх здобуває й нація."

 VYT_an_empire_of_equals: "Імперія рівних"
 VYT_an_empire_of_equals_desc: "Реформи вже йдуть повним ходом, і кадети звернули увагу на населення, яке часто однаково іґнорують і гноблять і уряд, і громадяни: етнічні меншини.\n\nВідповідно до принципів рівності вони внесли законопроєкт, що надасть офіційне визнання й захист різноманітним групам меншин у державі.\n\nУсі народи імперії насправді є росіянами. Посягання на права одних - це посягання на права всіх, і більше такого не дозволять."

 VYT_the_imperial_constitution: "Імперська конституція"
 VYT_the_imperial_constitution_desc: "Історичний Волоґодський конґрес завершено, кабінет обрано, прем'єр-міністра й урядову партію призначено, тож настав час останнього кроку - розроблення конституції.\n\nДо цього не можна ставитися легковажно, адже ця Імперська конституція, установчий документ російського монархізму, визначатиме політику держави на роки вперед. Коли дебати починаються, усі погляди прикуті до делеґацій."

 VYT_securing_the_realm: "Убезпечити державу"
 VYT_securing_the_realm_desc: "Щоб забезпечити стабільність у Суверенній Державі, украй важливо зосередитися на розв'язанні внутрішніх проблем, перша з яких - належне управління нашою територією. Її просто забагато для ефективного контролю, і вона повниться бандитами та рештками колишніх ворогів. Ми мусимо діяти.\n\nДля цього ми зосередимо політичну, економічну й військову міць на безпеці нашої держави. Об'єднавши зусилля Імператорської армії, Охрани й леґіонів адміністраторів, які нині вступають на урядову службу, ми забезпечимо стабільність нашої держави всупереч партизанам та інакодумцям, які їй загрожують!"

 VYT_carte_blanche_for_smyslovsky: "Карт-бланш Смисловскому"
 VYT_carte_blanche_for_smyslovsky_desc: "Голова Охрани Боріс Смисловскій довів, що є вірним і відданим слугою царя. Під його наглядом у нашій країні виявляли й усували інакодумців, партизанів, диверсантів і шпигунів. А з додатковою підтримкою він може бути ще ефективнішим.\n\nЗбільшивши фінансування Охрани й розширивши її свободу дій, Смисловскій зможе ефективніше давати раду проблемам, перш ніж вони виникнуть. Можливо, його завзяття дещо зашкодить царському образові серед народу, але ми вважаємо, що стабільність, яку воно принесе, цілком варта цієї ціни."

 VYT_reign_in_the_okhrana: "Приборкати Охрану"
 VYT_reign_in_the_okhrana_desc: "Хоча Охрана під умілим проводом Боріса Смисловского останніми роками, безсумнівно, діяла ефективно, вона також створювала нам проблеми. У часи війни й кризи її послуги життєво необхідні, а на «помилки» від надмірного завзяття можна заплющити очі. Але в мирний час це вже не так.\n\nЗловживання Охрани можуть підірвати підтримку уряду серед громадськості, тож Смисловскому дадуть чітко зрозуміти: йому більше не дозволять діяти без нагляду. Ефективність дещо постраждає, але це невелика ціна за те, щоб гнів не обернувся проти уряду чи царя."

 VYT_the_partisan_problem: "Партизанська проблема"
 VYT_the_partisan_problem_desc: "Хоча ми перемогли своїх ворогів, не всіх їхніх прихильників було вбито. На жаль, через це від Архангельська на півночі до Самари на півдні простягнулася низка партизанських осередків - мозаїка укріплень, бандитів і решток безправних солдатів, які сповідують безліч ідеологій та зберігають вірність тому чи іншому діячеві; у цих осередках є комуністи, фашисти й навіть радикальні демократи.\n\nВони становили б проблему, навіть якби не грабували наші каравани, не нападали на села, що проголосили нам вірність, і не вирізали солдатів за кожної нагоди. Але нині вони зовсім розперезалися. Треба якнайшвидше розв'язати цю проблему, щоб забезпечити царську владу."

 VYT_root_them_out: "Викорінити їх"
 VYT_root_them_out_desc: "Виявилося, що перемогти партизанів важче, ніж ми очікували. Їх надто багато, і вони надто добре ховаються у великих лісах, що вкривають Суверенну Державу. Треба вдатися до рішучіших заходів.\n\nМи використаємо всі наявні засоби. Охрану, колаборантів, нищівну перевагу у військовій силі - усе, що знадобиться. Це дорого коштуватиме, і крові проллється більше, ніж, імовірно, потрібно, але з цією проблемою треба покінчити. Через неї держава здається слабкою, а в оточенні потенційних ворогів, як у нас, такого враження допустити не можна."

 VYT_offers_of_amnesty: "Запропонувати амністію"
 VYT_offers_of_amnesty_desc: "Виявилося, що перемогти партизанів важче, ніж ми очікували. Їх надто багато, і вони надто добре ховаються у великих лісах, що вкривають Суверенну Державу. Треба вдатися до рішучіших заходів.\n\nТа просто застосувати більше сили було б контрпродуктивно. Натомість запропонуймо амністію кожному, хто зголоситься. Непримиренні, звичайно, відмовляться, але співвітчизники, які вагаються, - ні. І що більше амністій буде надано, то менше банди зможуть проводити великі операції й то легше місцевим силам буде їх перемогти, що в довгостроковій перспективі приведе до перемоги."

 VYT_the_emperors_peace: "Імператорський мир"
 VYT_the_emperors_peace_desc: "Наполегливою працею й зосередженими зусиллями ми спромоглися втихомирити багато партизанських загонів, які дошкуляли нашій країні. Хоча бандити й злочинці існуватимуть завжди, припинення масштабного безладу означає відповідне зростання народної довіри до уряду та його політичної підтримки.\n\nТепер ми можемо зосередитися на одній із багатьох інших справ, що потребують уваги, певні того, що принаймні всередині країни ситуацію з безпекою виправлено."

 VYT_an_empire_reborn: "Відроджена імперія" 
 VYT_an_empire_reborn_desc: "Із завершенням Волоґодського конґресу й розв'язанням партизанської проблеми Суверенна Держава нарешті, ціною великої крові, забезпечила і внутрішню фізичну безпеку, і політичну стабільність.\n\nДесятиліттями Західна Росія майже не знала ні того, ні іншого, і тепер, коли люди усвідомлюють їхню наявність, народна й політична підтримка уряду зростає в усіх сферах і суспільних групах. Звичайно, проблем іще багато, але для багатьох вони менш важливі за основну фізичну безпеку їх самих та їхніх родин, і цар може тішитися тим, що нарешті дав її мільйонам росіян, які так довго її не мали."

 ### Regional economy tree ###
 VYT_the_imperial_recovery_committee: "Імперський комітет відновлення"
 VYT_the_imperial_recovery_committee_desc: "Зі створенням Суверенної Держави ми більше не можемо покладатися на горілчану винокурню як на джерело значної частини державного бюджету. Натомість мусимо розробити й здійснити комплексний економічний план загальнодержавного масштабу.\n\nДля цього цар оголосив про створення Імперської економічної ради, яка збере експертів і з країни, і з еміґрантських громад та доручить їм наглядати за цією розробкою й упровадженням. Завдяки розумному й послідовному плануванню зростатимуть і економіка, і промислова база, поліпшуючи життя звичайних росіян та водночас готуючи нас до майбутньої кампанії національного об'єднання."

 VYT_economic_recovery: "Економічне відновлення"
 VYT_economic_recovery_desc: "Перші заходи Імперського комітету відновлення вже дали результат. Хоча зменшення бідності й голоду та відповідне збільшення промислового випуску й зростання зарплат мінімальні, вони все ж помітні.\n\nАле ми не можемо зупинитися на цьому. Роботи ще багато, і праця комітету тільки почалася. Та вона вже змінила на краще життя багатьох наших громадян, і це слід вітати."

 VYT_invite_foreign_capital: "Залучити іноземний капітал"
 VYT_invite_foreign_capital_desc: "Серед багатьох інших проблем Суверенна Держава потерпає від майже цілковитої відсутності іноземних капіталовкладень. Їх залучення дозволило б різко прискорити економічний розвиток, тож Імперський комітет відновлення попросив царя й Міністерство закордонних справ звернутися до іноземних держав, близьких і далеких, та запропонувати значні стимули для заохочення інвестицій.\n\nКрім безсумнівної значної економічної користі, визначено й численні додаткові вигоди, зокрема ширше міжнародне визнання та швидше скорочення безробіття."

 VYT_the_witte_currency_reform: "Валютна реформа Вітте"
 VYT_the_witte_currency_reform_desc: "Грошова реформа Вітте, названа на честь члена Імперського комітету відновлення, який її розробив, міністра ради й члена Імперського комітету відновлення, який її запропонував, зосереджена і на запровадженні єдиної централізованої валюти, і на визначенні її єдиним законним платіжним засобом у Суверенній Державі.\n\nЦе сприятиме боротьбі з подальшим використанням регіональних валют, нерівномірною стабільністю купівельної спроможності, а також із чорноринковими операціями й обміном. Обіцяно, що після початкового періоду безладу під час переходу системи результатом стане загальне зростання узгодженої економічної активності."

 VYT_reorganize_the_ministry_of_finance: "Реорганізувати Міністерство фінансів"
 VYT_reorganize_the_ministry_of_finance_desc: "Міністерство фінансів спочатку створили для управління економікою Вятки та прилеглих земель за часів німецьких бомбардувальних кампаній. Ті дні давно минули, але міністерство досі організоване так само, як тоді, - у спосіб, цілком непридатний для управління економікою справді загальнодержавного масштабу.\n\nНа прохання Імперського комітету відновлення міністерство реорганізують, створивши належні місцеві, регіональні та загальнодержавні ієрархії, щоб краще розв'язувати економічні проблеми різних частин країни. Воно також оцінить навички своїх працівників і найме нових, аби забезпечити ефективну й безперервну роботу на всій нашій території."

 VYT_the_principles_of_solidarism: "Принципи солідаризму"
 VYT_the_principles_of_solidarism_desc: "Перемога солідаристів Алєксандра Солженіцина на Волоґодському конґресі вплинула на Імперський комітет відновлення, як і на всі інші аспекти нашого урядування. Твердо віддані корпоративістським ідеалам, солідаристи вимагають утілення їх у будь-якому плані економічного відновлення.\n\nОчікується, що завдяки зосередженню на організації економіки довкола визначених груп інтересів і виробничих галузей загальна ефективність нашої промислової бази зросте."

 VYT_continue_the_austerity_programs: "Продовжити жорстку економію"
 VYT_continue_the_austerity_programs_desc: "Після перемоги Всєроссійского национального союзу Васілія Шульґіна на Волоґодському конґресі Імперський комітет відновлення отримав нові директиви. Давно запроваджені програми жорсткої економії слід продовжувати, доки уряд не вирішить інакше.\n\nХоча цей крок непопулярний, Всєроссійскій национальний союз непохитний: доки військову ситуацію не можна буде вважати врегульованою, про відхід від пріоритету військового виробництва на користь соціальних чи економічних програм не може бути й мови."

 VYT_economic_liberalisation: "Економічна лібералізація"
 VYT_economic_liberalisation_desc: "Перемога кадетів під проводом Романа Ґуля на Волоґодському конґресі відкрила шлях до включення економічної лібералізації в політику Імперського комітету відновлення.\n\nЗосередившись на заохоченні принципів вільного ринку, припиненні заходів жорсткої економії та нормалізації ринків, кадети сподіваються спонукати економіку Суверенної Держави до стрімкого зростання й пожати плоди цього зростання."

 VYT_the_miracle_on_the_vyatka: "Диво на Вятці"
 VYT_the_miracle_on_the_vyatka_desc: "Попри певний політичний спротив, зусилля Імперського комітету відновлення справили реальний і значний вплив на загальний економічний стан Суверенної Держави. Внутрішній продукт різко зріс, технологічний рівень нашої промисловості підвищився, а іноземний капітал нарешті знову надходить до Росії.\n\nЦі здобутки разом із різким підвищенням ефективності управління завдяки подальшим реформам дали країні міцну, спрямовану в майбутнє промислову базу для майбутнього об'єднання.\n\nЦар розпочав підготовку до вручення кожному без винятку членові комітету державної нагороди, яку він передасть особисто. Якщо солдат може отримати медаль за допомогу одному співвітчизникові-росіянину, то й комітет може - за допомогу мільйонам!"

 VYT_academic_recovery: "Відновлення освіти"
 VYT_academic_recovery_desc: "Дуже довго освіта в Росії була доступна лише мінімально, якщо взагалі була доступна. Наша економіка й далі відновлюється, тож тепер цьому недолікові можна й треба зарадити. Без освічених громадян ми не зможемо розвивати економіку далі за рівень простого виживання, а отже, вкладатимемо кошти в освіту.\n\nНа вимогу Імперського комітету відновлення буде створено комплексний план розвитку національної освітньої інфраструктури, від початкової до вищої освіти, і виділено ресурси на його втілення. Так ми зможемо підготуватися до майбутнього й залишити частиною своєї спадщини покоління розумних, новаторських і далекоглядних росіян."

 VYT_reopen_the_universities: "Знову відкрити університети"
 VYT_reopen_the_universities_desc: "Тепер, коли на освіту є значне фінансування, ми мусимо відкрити численні вищі навчальні заклади Західної Росії, які давно зачинилися. Ці заклади, якими не користувалися й яких не потребували впродовж багатьох років розколу та конфлікту в регіоні, необхідні, якщо ми хочемо дати Суверенній Державі засоби для підготовки наступного покоління адміністраторів, промисловців, дослідників і багатьох інших.\n\nБуде проведено інвентаризацію університетських містечок, після чого визначено пріоритети відбудови. Коли вони запрацюють, ми, імовірно, помітимо зростання нашої здатності знаходити новаторські рішення проблем чи вдосконалювати наявні."

 VYT_the_kazan_science_academy_idea: "Казанська академія наук"
 VYT_the_kazan_science_academy_idea_desc: "Російська академія наук багато років була найвизначнішою освітньою установою імперії, що виховала багатьох великих винахідників, інженерів, мислителів і знакових діячів культури. Тепер ця академія далеко за німецькими лініями й цілковито недоступна. Щоб завершити наш план академічного відродження, ми замінимо цю втрачену установу новою.\n\nЦар указав збудувати нову академію наук, цього разу в Казані. З часом, терпінням, фінансуванням і часткою удачі вона стане світочем поступу й доведе світові, що Росія більше не є країною з відсталим мисленням."

 VYT_industrial_recovery: "Відновлення промисловости"
 VYT_industrial_recovery_desc: "Промисловість Західної Росії ще навіть не повністю оговталася від німецьких бомбардувальних кампаній, не кажучи вже про спустошення під час регіонального об'єднання. Тому Імперський комітет відновлення визначив докорінну відбудову наявної промислової бази головною метою, щоб вона могла зробити внесок у подальші проєкти.\n\nВиділено фінансування, аби відбудову завершили якнайшвидше. Це лише перший крок до стрімкого розширення, але його все одно треба зробити."

 VYT_connecting_our_realm: "Сполучити нашу державу"
 VYT_connecting_our_realm_desc: "Повсюдне руйнування державної інфраструктури - ще одна спадщина хаосу, який колись охопив Західну Росію. Воно серйозно обмежує цивільну економіку - і її загальний масштаб, і потенціял розширення та розвитку. Тож увагу буде зосереджено на будівництві нових залізниць та автошляхів між нашими головними економічними центрами й портами.\n\nЦе сприятиме якнайшвидшому переміщенню якомога більшої кількості людей і товарів, а отже, заохочуватиме подальше економічне зростання в Суверенній Державі."

 VYT_rebuilding_the_civilian_sector: "Відбудувати цивільний сектор"
 VYT_rebuilding_the_civilian_sector_desc: "Завдяки нашим попереднім зусиллям із відбудови наявної промисловості й спорудження нових інфраструктурних коридорів тепер ми можемо взятися до розширення цивільної економіки. Стратегічними видатками й привабливими субсидіями ми можемо заохочувати будівництво заводів, зосереджених на виробництві товарів для внутрішнього споживання.\n\nНе слід недооцінювати значення навіть найелементарніших побутових благ для суспільної стабільності й народної підтримки уряду. Заохочуючи їх виробництво, ми не лише здобуваємо цю підтримку, а й збільшуємо зайнятість і внутрішній продукт."

 VYT_invest_in_russian_business: "Інвестувати в російський бізнес"
 VYT_invest_in_russian_business_desc: "Російський бізнес довгий час ледь існував. Власники втрачали свої заводи або через комуністичну експропріацію, або через німецькі бомбардувальники. Але часи змінилися. Навіть за відносно короткий час після об'єднання ми спостерігаємо природний розвиток дрібної промисловості серед деяких із наших підприємливіших громадян. Це відкриває можливість.\n\nІнвестуючи в ці підприємства й субсидуючи створення нових, ми можемо прискорити розвиток вітчизняної промисловості силами громадян замість прямого втручання уряду. Імперський комітет відновлення недвозначно заявив, що саме це є шляхом до справжнього економічного зростання, і ні ми, ні цар не маємо підстав не погоджуватися."
 
 ### Regional armed forces tree ###
 VYT_reevaluate_the_armed_forces: "Переглянути стан збройних сил"
 VYT_reevaluate_the_armed_forces_desc: "Дії Імператорської армії, яка здобула територію нинішньої Суверенної Держави, були похвальними й заслуговують на визнання. Але це не означає, що можна не зважати на можливості вдосконалення. На шляху до національного об'єднання нам належить довгий і тяжкий похід до Тихого океану, і ми мусимо бути готові.\n\nТому ми розпочнемо ретельний розгляд наших кампаній і знову ухвалимо узгоджені рішення щодо загальної стратегії розвитку та розширення імперських збройних сил, як уже робили раніше. Той розгляд дозволив нам здобути перемогу, і цей не може не дати такого самого результату."

 VYT_learning_from_the_western_reclamation: "Уроки повернення західних земель"
 VYT_learning_from_the_western_reclamation_desc: "Тріумф повернення західних земель, утвердження царської влади над нашим регіоном, став великою перемогою, яку подарували нам імперські сили. Щоб прийдешні кампанії національного об'єднання були так само успішними, ми ще раз найретельніше вивчимо західні кампанії.\n\nТак ми дізнаємося, у чому наші офіцери, солдати, спорядження й доктрина показали себе найкраще, а в чому виявилися недостатніми. Хоч як важко буде визнати наші невдачі й визначити шляхи вдосконалення, ми мусимо це зробити - і заради майбутнього Суверенної Держави, і заради успіху царя."

 VYT_sticking_to_our_guns: "Триматися свого"
 VYT_sticking_to_our_guns_desc: "Деякий час тому ми розглядали можливість орієнтувати наше військо на забезпечення чисельної переваги, використовуючи традиційну перевагу Росії над ворогами за кількістю населення. Відтоді ми здобули мільйони нових громадян, що потенційно робить цей підхід ще сильнішим.\n\nТому, попри заперечення деяких із наших новаторськіших офіцерів, ми рішуче оберемо орієнтацію Імператорської армії на масові формування. Хоча це, імовірно, створить певне адміністративне навантаження на дивізійні штаби, зате забезпечить швидке поповнення наших формувань, що, безсумнівно, стане в пригоді в майбутній довгій подорожі на схід."

 VYT_new_schools_of_thought: "Нові школи думки"
 VYT_new_schools_of_thought_desc: "Деякий час тому ми розглядали можливість орієнтувати наше військо на уроки, засвоєні з вивчення підходів інших країн, таких як Америка, Британія, Німеччина та Японія. Відтоді ми здобули величезні нові території та їхні промислові бази, критично важливі для виробництва спорядження, потрібного для сучасної війни.\n\nТому, попри заперечення деяких із наших традиціоналістських офіцерів, ми рішуче оберемо орієнтацію Імператорської армії на спеціяльну підготовку й відбір. Хоча це, імовірно, скоротить набір через суворі вимоги таких програм, зате забезпечить цим спеціяльним формуванням здатність діяти краще, ніж можна було б очікувати за інших умов."

 VYT_celebrate_the_heroes: "Вшанувати героїв"
 VYT_celebrate_the_heroes_desc: "Імператорська армія - ніщо без своїх звитяжних солдатів. Людей, які могли віддати й віддавали життя за Бога, країну й царя в кампаніях регіонального об'єднання. Ми мусимо зробити історії цих героїв відомими.\n\nТак не лише наших нинішніх і майбутніх солдатів надихатимуть розповіді про попередників, а й спроститься здобуття підтримки наших кампаній. Широкі верстви населення не зможуть не підтримати цілі нашого війська, дізнавшись про численні історії шляхетних учинків і самопожертви в його лавах."

 VYT_the_imperial_navy: "Російський імператорський флот"
 VYT_the_imperial_navy_desc: "Минуло майже сорок років відтоді, як морями ходило судно під прапором імперської Росії. Тепер, коли під час регіонального об'єднання ми захопили великі порти, цьому слід зарадити. Тому кошти буде вкладено в розвиток морських технологій і створено адміністративну інфраструктуру, потрібну для флоту.\n\nМожливо, ще багато років ми не зможемо зрівнятися розмірами з великими флотами, але зможемо розвивати й захищати торгівлю, убезпечити наші територіяльні води й нести наш прапор по світу, сповіщаючи всіх про повернення царя."

 VYT_the_imperial_air_service: "Російська імператорська повітряна служба"
 VYT_the_imperial_air_service_desc: "Особливості Західної Росії багато років надзвичайно ускладнювали утримання будь-якої повітряної служби. Протидія німецьким ударам, обслуговування й навчання, виробництво та ремонт техніки - усе це часто, принаймні частково, перевищувало наші ресурси. Тепер ситуація змінилася. Значно.\n\nСуверенна Держава тепер об'єднана й принаймні відносно захищена, тож настав час вкласти кошти у створення офіційної повітряної служби шляхом прямих державних інвестицій в авіяційні технології. Хоча така служба почне з малого й, імовірно, ще певний час такою залишатиметься, і наші солдати, і цивільні можуть підбадьоритися, знаючи, що високо над ними летять хоробрі співвітчизники, оберігаючи їх від лиха - і завдаючи його ворогові."

 VYT_modern_training_methods: "Сучасні методи підготовки"
 VYT_modern_training_methods_desc: "Дисципліна - ключова для будь-якого війська. Без неї на солдатів не можна покластися, офіцери можуть не коритися наказам, а ширші тактичні й стратегічні плани приречені на провал. У минулому ми помічали кілька проявів недисциплінованості в імперських силах, і хоча колись це, можливо, було прийнятним, тепер уже ні.\n\nВідповідно, ми переорієнтуємо програми військової підготовки, приділивши більше уваги дисципліні й згуртованості підрозділів. Так ми забезпечимо збереження цілісності наших формувань, коли почнуться східні кампанії, навіть попри величезні відстані, які на них чекатимуть."

 VYT_expand_the_special_forces: "Розширити спеціяльні сили"
 VYT_expand_the_special_forces_desc: "Створення й застосування спеціяльних формувань, таких як славетні «Палії мостів», під час нашого регіонального завоювання виявилися надзвичайно ефективними для досягнення перемоги. Тому було запропоновано розширити ці формування. Цю пропозицію буде прийнято.\n\nПрямими інвестиціями ми оптимізуємо структуру, доктрину й потреби цих формувань у спорядженні, сприяючи створенню більшої їх кількості в структурі військового командування. Коли почнуться великі кампанії національного об'єднання, вони полегшать наш рух до перемоги завдяки діям, сповненим великої майстерності й відваги, якими й уславилися."

 VYT_invest_in_izhmekh: "Інвестувати в ІЖМЄХ"
 VYT_invest_in_izhmekh_desc: "Іжевскій механічний завод багато років був ключовим чинником належного оснащення, а отже, і перемог імперських збройних сил. Тепер у нашому розпорядженні ресурси Суверенної Держави, і ми можемо інвестувати в завод та розширити його, щоб примножити переваги, які він нам дає.\n\nРозширивши промислові потужності на території комплексу й довкола нього, ми значно збільшимо здатність держави виробляти величезні обсяги спорядження, потрібні для сучасної війни та нашого майбутнього походу на схід. Потрібне лише царське слово."

 VYT_a_new_generation_of_officers: "Нове покоління офіцерів"
 VYT_a_new_generation_of_officers_desc: "Вище командування нашого війська старіє, тож украй важливо забезпечити нове покоління новаторських, вірних і вправних офіцерів йому на зміну. Створена роки тому Вятська академія Генерального штабу надзвичайно допомогла в цьому, але зі зростанням нашої країни зросли й вимоги до командування. Потрібні інвестиції.\n\nТому поточний бюджет академії значно збільшать, що дозволить їй не лише випускати більше офіцерів для командування, а й краще навчати їх у численних галузях, з якими офіцер мусить бути обізнаний. Коли ми почнемо похід, щоб донести царський прапор до Тихого океану, можемо бути певні: наступ очолять найкращі офіцери Росії."

 VYT_updating_our_designs: "Оновити наші розробки"
 VYT_updating_our_designs_desc: "Майже цілковите знищення промислової й академічної бази Західної Росії призвело, серед іншого, до відповідного браку новаторства у військових розробках. Багато зразків копіювали з іноземних або ж це були грубі тимчасові рішення, які виробляли децентралізовано. Проте нинішнє становище дозволяє нам це виправити.\n\nКошти вкладатимуть у розроблення різних видів спорядження, а для сприяння їхньому виробництву буде створено координаційні ради з військовими виробниками. Так ми забезпечимо, щоб російські розробки виготовляли російські заводи для російської армії, яка діє в російських умовах. Справді, більшого й годі бажати."

 VYT_the_imperial_army_marches_on: "Імператорська армія крокує вперед"
 VYT_the_imperial_army_marches_on_desc: "Завдяки реформам та інвестиціям у доктрину, спорядження й командування ми знову досягли визначної модернізації та професіоналізації імперських збройних сил. Оперативні плани складають і виконують швидше, управління формуваннями з боку штабного апарату поліпшилося, а позиції наших сил значно зміцнилися.\n\nВійсько підготовлене й готове розпочати неминучі кампанії національного об'єднання. І хоча ніхто не може сказати, із чим чи з ким воно зіткнеться, усі впевнені в його здатності здобути перемогу в ім'я царя."
 
 ### Regional foreign diplomacy tree ###
 VYT_reestablishing_contacts: "Відновити зв'язки"
 VYT_reestablishing_contacts_desc: "Суверенну Державу створено, її політичну стабільність забезпечено, і тепер настав час зробити те, чого давно не робила жодна російська держава, - розпочати скоординовану глобальну дипломатичну кампанію. Ми маємо багато ресурсів, які можемо запропонувати світові, і потребуємо не менше досягнень та інвестицій натомість.\n\nЗнадобляться серйозні вкладення і у створення надійної дипломатичної інфраструктури, і в стандартизацію договорів про визнання, торгівлю та представництво за кордоном. Їх буде здійснено. Росія більше не стоятиме самотньо на світовій сцені."

 VYT_the_imperial_diplomatic_corps: "Імперський дипломатичний корпус"
 VYT_the_imperial_diplomatic_corps_desc: "Щоб досягти дипломатичних цілей і відкрити нашу країну світові, Суверенна Держава мусить мати здібний і професійний дипломатичний корпус. Тому буде здійснено достатні інвестиції, щоб це забезпечити.\n\nІмперському дипломатичному корпусу нададуть пріоритет, аби він приваблював найкращих і найобдарованіших, а вони, вирушивши по всьому світу, забезпечуватимуть вигоди для держави. Ми можемо й будемо домагатися угод про дипломатичне визнання, торгівлю, взаємний захист і, можливо, згодом глобальний союз. Так Росія знову доведе, що вона щонайменше регіональна держава й переговори з нею слід вести відповідно."

 VYT_trade_with_the_ofn: "Торгівля з ОВН"
 VYT_trade_with_the_ofn_desc: "ОВН - природна глобальна противага «союзам» Німеччини та Японії. Навіть якщо не зважати на злочини обох проти російського народу, після національного об'єднання вони належатимуть до наших найбільших суперників. Тож зближення з цим блоком буде корисним не лише тепер, а й у майбутньому.\n\nМи можемо почати з неофіційних торговельних угод, спрямовуючи вантажі через порт Архангельська. Поступово звикаючи одне до одного й зміцнюючи взаємну довіру, ми закладемо основу для майбутньої співпраці. Хто знає, що принесе майбутнє?"

 VYT_an_embassy_in_washington: "Посольство у Вашинґтоні"
 VYT_an_embassy_in_washington_desc: "Прагнучи прихилити до себе ОВН, а отже, й американців, ми домагатимемося офіційного дипломатичного визнання Сполученими Штатами нас як законного російського уряду. Коли його буде здобуто, ми попросимо надати нам, як і будь-якому іншому законному урядові, право заснувати посольство у Вашинґтоні.\n\nДосягти цієї мети буде нелегко, але ми зосередимо на ній усі ресурси дипломатичного корпусу. Визнання американців надзвичайно зміцнило б наші претензії на російські землі на міжнародній сцені, дозволило б відкрити ширші економічні й торговельні можливості та неодмінно сприяло б тіснішій співпраці з ними в прийдешні роки."

 VYT_european_overtures: "Європейське зближення"
 VYT_european_overtures_desc: "Європа здавна була континентом монархій, навіть якщо Райх, який тепер займає таку значну її частину, зневажає саму ідею цього інституту. Проте деякі монархії залишилися, і завдяки приналежності до великого роду Романових наш цар пов'язаний із багатьма з них давніми шлюбами, союзами й партнерствами.\n\nБагато років ці відносини дрімали, але тепер час відродити їх для сучасної доби. За допомогою дедалі досвідченіших працівників Імперського дипломатичного корпусу ми налагодимо відносини з цими країнами, започаткуємо взаємовигідні ініціятиви й закріпимо свій статус регіональної держави. Звісно ж, не відмовляючись від мрій про подальше розширення."

 VYT_swedish_royal_ties: "Шведські королівські зв'язки"
 VYT_swedish_royal_ties_desc: "Королівство Швеція, одна з небагатьох європейських країн, що уникли хватки німецької тиранії, - ідеальний кандидат для одного з наших перших дипломатичних кроків. Король Ґустав VI Адольф, хоч і є конституційним монархом, за повідомленнями, має помірковану вдачу, а неприналежність країни до будь-якого геополітичного угруповання ґарантує, що, розвиваючи відносини, ми не наживемо ворогів.\n\nТому ухвалено рішення, що цар особисто відвідає країну, вирушивши кораблем з Архангельська. Його візит не лише сприятиме підготовці офіційного визнання й торговельних угод зі шведами, а й додатково зміцнить нашу леґітимність на світовій сцені."

 VYT_roman_holiday: "Римські канікули"
 VYT_roman_holiday_desc: "Італія, хоч і була колись серед країн, що вторглися на нашу землю, є й залишається наймогутнішою монархією Європи. Багато в чому вона втілює цілі самого царя: сильна й заможна країна, що має великі території для забезпечення ресурсами та люблячий народ, який демократично бере участь в урядуванні під владою шанованого короля. Тому ми звернемося до неї.\n\nЧлени дипломатичного корпусу вирушать до Риму й докладуть усіх зусиль, щоб установити офіційні відносини. Якщо їм це вдасться, ми зможемо здобути відповідне посилення леґітимності нашої держави разом із перспективами вигідної торгівлі в майбутньому."

 VYT_a_trip_to_madrid: "Подорож до Мадрида"
 VYT_a_trip_to_madrid_desc: "Ухвалено рішення далі зосередити зусилля дипломатичного корпусу на Іберії, відправивши місію до Мадрида. Як велика регіональна держава Європи, що водночас не пов'язана з німецьким блоком, вона є ідеальним кандидатом для встановлення сприятливих відносин із нашою країною.\n\nНашу дипломатичну місію очолить такий собі Боріс Скосирєв - один із членів корпусу, що і розмовляє іспанською, і має досвід в Іберії. Хоча дехто висловив занепокоєння, що його сумнівне минуле в Андоррі може ускладнити справу, Скосирєв відкинув ці побоювання. Час покаже, чи правильно його обрали."

 VYT_our_place_in_the_world: "Наше місце у світі"
 VYT_our_place_in_the_world_desc: "Гарячкові зусилля Імперського дипломатичного корпусу за останні місяці загалом виявилися дуже успішними. Попри деякі невдачі, держава здебільшого побачила розвиток успішних торговельних відносин як із великими, так і з малими країнами, розширення офіційного визнання та багато іншого.\n\nУ міру подальшого розширення нашої світської влади і над власними землями, і над землями на сході ми, без сумніву, зіткнемося з новими дипломатичними викликами. Але, як і досі, дипломатичний корпус подолає їх в ім'я держави й царя."

