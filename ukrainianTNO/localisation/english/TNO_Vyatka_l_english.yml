 ### Ideas ###
 VYT_unrepentant_reaction: "Непримиренна реакція"
 VYT_unrepentant_reaction_desc: "Від самого падіння старої імперії Росія страждала, розчавлена владою одного тирана за іншим. Комунізм та його замаскований поплічник соціалізм невтомно відбирали в російського народу ті крихти, що в нього залишилися, і на це цар проголосив: «Годі!» Імперія знову постане, комуністів буде знищено, а зі справедливим царським правлінням на цю величну землю знову повернеться мир."

 VYT_Imperial_Market: "Багатства імперії - світові!"
 VYT_Imperial_Market_desc: "Думка, що монархія не здатна конкурувати на ринку з його жорстокою боротьбою, у кращому разі наївна, а в гіршому - невігласька, адже Російська імперія стоїть на чи не найбагатших у світі покладах природних ресурсів: сталь, нафта - багатства Росії дістаються тим, хто запропонує найбільше. Їхні повні скрині поповнюють скарбницю, щоб згодом повернутися у вигляді інвестицій, які приведуть царство й Росію в сучасну добу.\n\nНевдовзі настане час, коли ми будемо не постачальником, а продавцем, та поки що згодиться й так."

 VYT_officer_infighting: "Військові чвари"
 VYT_officer_infighting_desc: "Біла армія, чи те, що від неї залишилося, ніколи не була єдиним фронтом. Хоча її вояків єднає спільна ненависть до комунізму, питання про те, як слід правити об'єднаною Росією, загрожує розколоти царські війська. Одні вірять у старі ідеали, інші домагаються демократії, а дехто навіть говорить про сильні сторони фашистських режимів. Лише цар тримає їх у покорі, та й то ледве. Зрозуміло, що для відбудови колись утраченого держава мусить забезпечити єдність армії."

 VYT_officers_reigned_in: "Офіцерство приборкано"
 VYT_officers_reigned_in_desc: "Попри труднощі, держава спромоглася приборкати і найгірші впливи свого офіцерського корпусу, і його найгірші дії. На це ще знадобляться час і політичний вплив, а звільнення чи судове переслідування проблемних офіцерів спричинить кадрові перебої, проте цар може бути певний: невдовзі його офіцерів єднатиме спільна мета. Розбрат серед командування більше не шкодитиме нашим арміям."

 VYT_the_tsar_and_himself: "Цар і лише він"
 VYT_the_tsar_and_himself_desc: "Як і за давніх часів, цар править, маючи абсолютну владу. Проте останнім часом він бачить, як у серцях і думках його підданих ширяться лібералізм та демократичні ідеали. Хоча багато хто радить йому взагалі не зважати на ці зміни, цар добре знає, що стоїть на краю прірви: любов народу може дуже швидко обернутися ненавистю, як уже бувало раніше. Тому невдовзі він мусить обрати: правити самотужки, як його предки, чи дати народові право голосу у своєму уряді."

 VYT_the_peoples_tsar_idea: "Народний імператор"
 VYT_the_peoples_tsar_idea_desc: "Прагнучи продемонструвати солідарність із кожним зі своїх численних підданих, цар вирушив у стрімку подорож численними заводами й промисловими підприємствами держави, зустрічаючись із робітниками та вживаючи заходів для розв'язання найнагальніших для них проблем. Ніхто не заперечує політичної користі таких дій, а особиста увага царя, безсумнівно, спонукатиме заводи щосили демонструвати зростання виробництва, проте раптове втілення проголошених «рішень», імовірно, зашкодить ефективності."

 VYT_imperial_detachment_idea: "Імператорська відстороненість"
 VYT_imperial_detachment_idea_desc: "Цар вирішив зберегти ту невловну рису вдачі, що має вирішальне значення для його ролі монарха, а також зосередитися на державних справах, а не на публічності. Тому він особисто усунувся від багатьох заходів, хоча всі присутні й далі думають про нього. Без сумніву, це заспокоює багатьох: вони можуть бути певні, що їхній цар розв'язує проблеми ще до того, як їх помітить суспільство загалом. Утім, донесення його позиції до громадськості через посадовців таки потребує додаткових зусиль."

 VYT_kirov_vodka: "Вятська горілка"
 VYT_kirov_vodka_desc: "Вятські ґуральні працюють на повну потужність, виробляючи величезні обсяги високоякісних спиртних напоїв, які можна споживати вдома, експортувати за кордон або використовувати в медицині та війську як високоякісний антисептик. Хоча декому це може видатися кумедним, горілка - невіддільна частина російського життя, і думки про об'єднану батьківщину, що супроводжують кожну випиту пляшку, надихають усіх наполегливіше працювати й менше марнувати, прагнучи здійснити мрію про об'єднання."

 VYT_modern_age_okhrana: "Охрана нової доби"
 VYT_modern_age_okhrana_desc: "Цар мудро відновив Охрану - імперську розвідку й контрреволюційну поліцію. Маючи виділені для цього ресурси й усвідомлюючи, що захищають державу від зовнішніх і внутрішніх ворогів, її працівники поліпшуватимуть криптографічні можливості держави, а також зводитимуть до мінімуму напади бандитів і партизанів на її війська. Крім того, передаючи здобуту інформацію, вони допомагатимуть військовим командирам вигідніше розміщувати сили на полі бою."

 VYT_modern_age_okhrana_2: "Охрана на припоні"
 VYT_modern_age_okhrana_2_desc: "Хоча Охрана має вирішальне значення для національної безпеки, не можна дозволяти їй діяти безконтрольно. Тому для запобігання зловживанням створено наглядовий орган. Звісно, це знижує її ефективність, але така ціна невелика, якщо вона гарантує, що надмірне завзяття не загрожуватиме політичній стабільності."

 VYT_modern_age_okhrana_3: "Посилена Охрана"
 VYT_modern_age_okhrana_3_desc: "Без постійної пильності Охрани царський уряд давно вже впав би від рук революціонерів, зрадників або й гірших ворогів. Тому їй слід надати широкі повноваження, щоб виявляти й усувати потенційні загрози, перш ніж вони стануть реальними. Хоча певних «помилок», імовірно, не уникнути, це невелика ціна за безпеку держави."

 VYT_modern_age_okhrana_kadet: "Охрана на припоні"
 VYT_modern_age_okhrana_kadet_desc: "Хоча Охрана має вирішальне значення для національної безпеки, не можна дозволяти їй діяти безконтрольно. Тому для запобігання зловживанням створено наглядовий орган. Звісно, це знижує її ефективність, але така ціна невелика, якщо вона гарантує, що надмірне завзяття не загрожуватиме політичній стабільності."

 VYT_white_army_traditions_idea: "Традиції Білої армії"
 VYT_white_army_traditions_idea_desc: "Безпосередньо пов'язавши армійські традиції з традиціями старої, ще не спотвореної імперської держави, цар сприяв формуванню справжньої сучасної армії з російським світовідчуттям. Дисциплінована, горда, меритократична й добре організована, вона значно перевершує «армії» численних дрібних російських держав і гордо нестиме прапор як європейською Росією, так і на довгому шляху до Далекого Сходу."

 VYT_white_army_traditions_idea2: "Традиції Білої армії"
 VYT_white_army_traditions_idea2_desc: "Безпосередньо пов'язавши армійські традиції з традиціями старої, ще не спотвореної імперської держави, цар сприяв формуванню справжньої сучасної армії з російським світовідчуттям. Дисциплінована, горда, меритократична й добре організована, вона значно перевершує «армії» численних дрібних російських держав і гордо нестиме прапор як європейською Росією, так і на довгому шляху до Далекого Сходу."

 VYT_white_army_traditions_idea_kadet: "Традиції Білої армії"
 VYT_white_army_traditions_idea_kadet_desc: "Безпосередньо пов'язавши армійські традиції з традиціями старої, ще не спотвореної імперської держави, цар сприяв формуванню справжньої сучасної армії з російським світовідчуттям. Дисциплінована, горда, меритократична й добре організована, вона значно перевершує «армії» численних дрібних російських держав і гордо нестиме прапор як європейською Росією, так і на довгому шляху до Далекого Сходу."

 VYT_imperial_special_forces: "Імперські спеціяльні сили"
 VYT_imperial_special_forces_desc: "У межах переорієнтації держави з традицій на сучасні підходи до ведення війни посилено увагу до відбору й підготовки спеціяльних формувань. Це, безумовно, підвищує ефективність цих спеціяльних підрозділів, проте суворі вимоги до вступу в них призвели, принаймні тимчасово, до загального скорочення набору."

 VYT_strength_in_numbers_idea: "Сила в чисельності"
 VYT_strength_in_numbers_idea_desc: "Зберігаючи вірність традиційній російській ставці на людські ресурси й чисельну перевагу, збройні сили держави значно розширили набір, послабивши вимоги та шукаючи новобранців поза звичними місцями. Завдяки цьому до царських армій вступатиме значно більше солдатів, проте їхня ефективність, принаймні на деякий час, імовірно, дещо знизиться, бо навантаження на навчальні програми перевищує їхні природні можливості."

 VYT_general_staff_academy: "Вятська академія Генерального штабу"
 VYT_general_staff_academy_desc: "Запровадження єдиної та загальної навчальної програми для офіцерів збройних сил держави очікувано сприяло загальному зростанню боєздатності. Належно навчені офіцери, що спираються на спільні засади, довели свою майстерність у всьому: від адміністративної організації й облаштування окопів до виявлення майбутніх командирів. Упевненість зростає."

 VYT_general_staff_academy2: "Вятська академія Генерального штабу"
 VYT_general_staff_academy2_desc: "Запровадження єдиної та загальної навчальної програми для офіцерів збройних сил держави очікувано сприяло загальному зростанню боєздатності. Належно навчені офіцери, що спираються на спільні засади, довели свою майстерність у всьому: від адміністративної організації й облаштування окопів до виявлення майбутніх командирів. Упевненість зростає."

 VYT_fortified_position: "Укріплена позиція"
 VYT_fortified_position_desc: "Після нещодавніх здобутків держава взялася закріплювати контроль над своєю територією. Тому військові формування переорієнтовано на оборону, поки зміцнюються шляхи постачання, знищуються партизани й бандити та визначаються майбутні пріоритети."

 VYT_archives_of_samara: "Самарські архіви"
 VYT_archives_of_samara_desc: "Під час краху Совєцького Союзу в Другій світовій війні Самара слугувала пунктом евакуації совєцьких державних документів. Захопивши місто й ретельно вивчивши ці архіви, держава здобула цінні відомості про діячів Західноросійського революційного фронту (ЗРРФ) та їхні реакції, які допоможуть у майбутній боротьбі проти нього."

 VYT_the_bridgeburners: "Палії мостів"
 VYT_the_bridgeburners_desc: "Імперський підрозділ спеціяльних операцій, відоміший як «Палії мостів», - це спеціяльне формування з військовослужбовців і працівників Охрани, якому доручено проводити прямі бойові операції в тилу ворога. Нападаючи на колони, вбиваючи поодиноких офіцерів і, так, знищуючи мости, вони послаблюватимуть оборонні можливості ворогів держави ще до того, як наші солдати дістануться до них і вступлять у бій."

 VYT_solidarist_constitution: "Імперська конституція"
 VYT_solidarist_constitution_desc: "Держава успішно розробила першу Імперську конституцію відродженої Російської імперії. Хоч би якими були її окремі положення, це величезне досягнення, яке свідчить про повернення політичної стабільності до Росії - під владою царя й династії Романових!"

 VYT_unionist_constitution: "Імперська конституція"
 VYT_unionist_constitution_desc: "Держава успішно розробила першу Імперську конституцію відродженої Російської імперії. Хоч би якими були її окремі положення, це величезне досягнення, яке свідчить про повернення політичної стабільності до Росії - під владою царя й династії Романових!"

 VYT_kadet_constitution: "Імперська конституція"
 VYT_kadet_constitution_desc: "Держава успішно розробила першу Імперську конституцію відродженої Російської імперії. Хоч би якими були її окремі положення, це величезне досягнення, яке свідчить про повернення політичної стабільності до Росії - під владою царя й династії Романових!"

 VYT_solidarist_economy: "Планова економіка"
 VYT_solidarist_economy_desc: "Застосовуючи свою корпоративістську політику до планів Імперського комітету відновлення, солідаристи закріпили участь груп інтересів і галузей із високою концентрацією виробництва у промисловому плануванні. Це відповідно підвищує ефективність, адже увага зосереджується на спільному прагненні зменшити марнотратство."

 VYT_unionist_economy: "Заходи жорсткої економії"
 VYT_unionist_economy_desc: "Продовжуючи попередню політику жорсткої економії, тепер уже під наглядом Імперського комітету відновлення, Всєроссійскій национальний союз і далі обмежує державні видатки майже в усіх соціальних сферах. Хоча політично це непросто, завдяки цьому дедалі більшу частку промисловості вдалося спрямувати на військові потреби."

 VYT_kadet_economy: "Ліберальна економіка"
 VYT_kadet_economy_desc: "Застосовуючи свою політику лібералізації до планів Імперського комітету відновлення, кадети припинили попередні програми жорсткої економії та водночас запровадили реформи вільного ринку. Хоча дехто вважає ці зміни радикальними, вони сприяли значному економічному зростанню, яке вже помітне у відповідному збільшенні обсягів виробництва."

 VYT_kadet_economy_2: "Ліберальна економіка"
 VYT_kadet_economy_2_desc: "Застосовуючи свою політику лібералізації до планів Імперського комітету відновлення, кадети припинили попередні програми жорсткої економії та водночас запровадили реформи вільного ринку. Хоча дехто вважає ці зміни радикальними, вони сприяли значному економічному зростанню, яке вже помітне у відповідному збільшенні обсягів виробництва."

 VYT_kadet_economy_3: "Ліберальна економіка"
 VYT_kadet_economy_3_desc: "Застосовуючи свою політику лібералізації до планів Імперського комітету відновлення, кадети припинили попередні програми жорсткої економії та водночас запровадили реформи вільного ринку. Хоча дехто вважає ці зміни радикальними, вони сприяли значному економічному зростанню, яке вже помітне у відповідному збільшенні обсягів виробництва."

 VYT_kadest_victory: "Ліберальна економіка"
 VYT_kadest_victory_desc: "Застосовуючи свою політику лібералізації до планів Імперського комітету відновлення, кадети припинили попередні програми жорсткої економії та водночас запровадили реформи вільного ринку. Хоча дехто вважає ці зміни радикальними, вони сприяли значному економічному зростанню, яке вже помітне у відповідному збільшенні обсягів виробництва."

 VYT_reopened_universities: "Відновлені університети"
 VYT_reopened_universities_desc: "Університети, давно закриті серед хаосу Західної Росії, знову відчинили двері завдяки зусиллям царя. Охочі студенти вже подають заяви на вступ, тож майбутнє російської освіти забезпечено."

 VYT_the_kazan_science_academy: "Казанська академія наук"
 VYT_the_kazan_science_academy_desc: "Ми заснували Казанську академію наук як спадкоємицю колись величної Російської академії наук. Ми сподіваємося створити ідеальне середовище, у якому блискучі молоді уми зможуть сповна застосувати свій інтелект і розробляти нові досягнення для країни. Згодом ці нові генії нестимуть просвітництво Росії, а можливо, й усьому світові."

 VYT_revitalizing_the_russian_spirit: "Відродження російського духу"
 VYT_revitalizing_the_russian_spirit_desc: "Зусилля Всєроссійского национального союзу нагадати народові про дух довіри до імперії, що колись пронизував усе суспільство, увінчалися успіхом. Держава вже спостерігає зростання самопожертви, відданості наполегливій праці й довіри до царського уряду, яких не бачила десятиліттями."

 VYT_tsars_golden_purse_idea: "Золота калита царя"
 VYT_tsars_golden_purse_idea_desc: "Особисті інвестиції самого царя в державні промислові починання дали значний результат. Профінансовані вдосконалення безпосередньо й помітно підвищили економічну ефективність та загальний промисловий випуск. Хоча це не може тривати вічно, на найближче майбутнє така допомога винятково цінна."

 VYT_ural_drive_program: "Уральська програма розвитку"
 VYT_ural_drive_program_desc: "Уральська програма розвитку, спрямована на відновлення зв'язків між ізольованими громадами й землями довкола Уралу, дозволила спрямувати значні кошти та інші ресурси й зосередити увагу на розбудові інфраструктури по всій державі, суттєво прискоривши її."

 VYT_ural_drive_program_2: "Уральська програма розвитку"
 VYT_ural_drive_program_2_desc: "Уральська програма розвитку, спрямована на відновлення зв'язків між ізольованими громадами й землями довкола Уралу, дозволила спрямувати значні кошти та інші ресурси й зосередити увагу на розбудові інфраструктури по всій державі."

 VYT_decommunization: "Декомунізація"
 VYT_decommunization_desc: "Прагнучи очистити країну від революційних елементів комуністичного спрямування, держава розпочала офіційну програму декомунізації. Літературу, пам'ятники й усе інше, пов'язане з колишніми комуністичними режимами, знищують, а колишніх комуністичних посадовців перевіряють, щоб визначити, чи заслуговують вони на амністію - звичайно ж, після публічного зречення."

 VYT_ural_reconstruction_program: "Уральська програма відбудови"
 VYT_ural_reconstruction_program_desc: "Після завоювання регіонів довкола Уральських гір держава розпочала програму швидкої відбудови із залученням військових формувань, щоб привести промисловість регіону до рівня решти країни. Хоча це потребує значних вкладень, упродовж дії програма, імовірно, позитивно впливатиме і на ефективність промисловості, і на безпеку формувань."

