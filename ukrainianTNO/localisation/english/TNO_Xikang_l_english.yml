### Leader Desc ###
 POLITICS_LIU_WENHUI_DESC:0 "Народжений у 1895-му році, Лю Веньхуей є армійською людиною до самих кісток. Випустившись з Військової академії Баодіну в 1916-му, він повернувся заідти до Сичуаню, де спочатку доєднався до Сичуанської кліки Лю Цюньхоу. Пізніше вступив у Ґоміньдан в 1926-му році, стрімко піднявшись за званнями Національно-революційної армії - Лю було затверджено на посаду командира 24-ї армії НРА, а правителем цілої провінції Сичуань назначено в 1929-му році. Запекле протистояння понад 5 інших варлордів нагрянуло на провінцію Сичуань, зробивши її до краю нестійкою й розплідником конфліктів. Коаліції, контркоаліції, суперечки та політичні викрутаси - це все визначило його правління Сичуанем у намаганнях утримати владу. Він усе таки втратив її в 1934-му році, коли його заступив племінник Лю Сян і вигнали з Сичуаню, натомість змінивши свою посаду на правителя провінції Сікан. Відносини Лю з Чаном Кайші, як і Сичуань, були нестабільним. Через далеку відстань від центрального уряду,Лю мав можливість чимало разів не зважати на накази Чана.\n\nПід час Другої Японо-китайської війни, Лю Веньхуей був обачливим і піклувався про те, аби його війська вступали в бій якомога менше. Коли японці підійшли до Сичуаню в рамках наступу "Ґо-Ґо", Лю Веньхуей - як найздібніший із командирів, що залишилися, зібрав своїх людей і відступив углиб Сікану, де таборувався в малому містечкові Січан. Лю відмовився здатися японцям, а самі японці не вбачали потреби в крихітній гірській провінції, і вирішили не переслідувати його.\n\nВже більш ніж десятиліттям пізніше після японського наступу в Сичуань, Лю Веньхуей перебуває відокремленим від них, будучи останнім із вільних варлордів у Китаї. Його батьківщина Сичуань простягнулася вздовж кордону, і незважаючи на прямий контроль уряду знову поринула в безлад, із багатьма фракціями й партизанами, що жадають контролю над нею. Навіть якщо Лю кортів би бачити вільний Китай, він сам стоїть проти багатьох підлеглих, які вважають ворожнечу з Японією самогубством. Знадобилось би поістину диво, аби Лю Веньхуей знову взяв до рук зброю..."

