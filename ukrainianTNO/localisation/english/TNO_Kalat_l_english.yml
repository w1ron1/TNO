 ### Ідеї ###
 KLT_sandemans_spectre: "Привид Сандемана"
 KLT_sandemans_spectre_desc: "Вплив британського колоніального чиновника Роберта Гроувса Сандемана, найбільш відомого своїм втручанням у справи Белуджистану, відчутний і сьогодні. Союз Балочських Держав досі керується за системою «племінного умиротворення» Сандемана, згідно з якою субсидії спрямовуються від трону Калату до лояльних кланів, а до нелояльних застосовується жорстокість.\n\nБалочське суспільство за цією системою ґрунтується на родинних зв’язках і фракційності. Міжкланове насильство активно заохочується правлячими князями Союзу, що дозволяє їм утримувати свої трони."

 KLT_not_a_nation_but_an_alliance: "Не нація, а союз"
 KLT_not_a_nation_but_an_alliance_desc: "Союз Балочських Держав не є нацією у традиційному розумінні, оскільки не має жодної централізації, окрім питань зовнішньої політики, які визначає хан Калату або його посланець. Навіть такі питання, як валюта та оборона, що зазвичай залишаються централізованими в конфедеративних або федеративних утвореннях, тут повністю передані на рівень складових держав Союзу.\n\nФактично, Союз – це об'єднання князівств Белуджистану. Вони гуртуються навколо хана Калату задля власного виживання та збереження традицій і старих порядків, якими б реакційними вони не були – зокрема, таких, як узаконене рабство. Очевидно, що таке державне утворення також не має ані демократії, ані підзвітності, а являє собою лише групу дрібних тиранів, які вже давно втратили актуальність, але вперто чіпляються за владу."

 ## Біографії лідерів ##
 POLITICS_MIR_AHMAD_YAR_KHAN_DESC: "Дехто може вважати, що Союз Балочських Держав, або Ханство Калат, – це не більше ніж група дрібних тиранів, які давно втратили свою значущість і відчайдушно тримаються за владу та «традиції». Мір Ахмад Яр Хан, хан Калату та президент Союзу, лише сміється їм в обличчя й продовжує правити, як і раніше.\n\nБудучи абсолютним правителем на своїх землях, він керує залізною рукою, втручаючись лише тоді, коли це вигідно, наприклад, коли йдеться про міжкланові конфлікти. Як перший серед рівних серед інших князів, він бере на себе відповідальність лише за зовнішню політику.\n\nОдна з його ключових позицій, у якій він є непохитним, – це питання Руху за Пакистан. Дехто серед князів симпатизує цьому руху, але Мір Ахмад Яр Хан ставиться до нього стримано. Хоча він і не є відкрито ворожим, хан вважає, що його власний суверенітет набагато цінніший за мрію про ісламську державу, яку довелося б ділити з синдхами та панджабцями. Тому він, імовірно, чинитиме опір будь-яким спробам більш прихильних до Пакистану князів домогтися приєднання Калату."  
