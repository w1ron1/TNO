 POLITICS_XIA_WEI_DESC:0 "Ся Вей - людина вірності. Завжди нею був.\n\nВін був відданий своїм приятелям дитинства, Бай Чунсі й Хуан Шаохуну, оскільки ця трійця пройшла разом крізь випробування й злигодні початку 20-го століття разом: спершу як однокласники, потім як товариші. Він був відданий Новій провінції Ґуансі й усьому, що вона відстоювала, віддавши себе в її ініціативах і боях, як проти пішаків Чан Кайші, так і проти комуністичних розбійників. Але якщо існувало щось таке, чому він був беззаперечно відданим, так це Китай; урешті-решт, хіба не він воював заради цієї землі, як і решта Національно-революційної армії, коли під небесами вирувала Війна опору проти японської агресії?\n\nТа вірність не врятувала Китай від тиранії; замість цього, вона виграла лише достатньо часу для Ґуансі, аби 11-та, 19-та, 20-та, 29-та, 31-ша й 38-ма групи армій здійснили останній переможний наступ і прогнали Імперську Японську армію за її межі. Коли курява почала осідати, Ся виявив, що він - остання високопоставлена людина Нової провінції Ґуансі, що залишилася; безпорадний, і зі солдатами Імператора все ще на порозі, його схилили до переговорів. Там перед ним представили остаточне питання: чи не впокориться він до самого кінця, або ж, виступивши від "вільної" провінції Ґуансі, складе присягу єдиному законному урядові Китайської республіки? На це Ся міг видати лише гірку посмішку. Вони хочуть вірності? Вони отримають свою вірність.\n\nТо ж Ся надав їм свій підпис, але ніколи не надав свого серця; ні. Його вірність не належить ані маріонеткам на нитках, ані комуністам-запроданцям; вона належить мрії, вічному прагненню визволення, що покоїться й понині, коли він залізною рукою править своєю рідною провінцією. Неважливо, що народ втомився від надвисоких податків і безпідставного призову. Неважливо, що Ґуансі фактично перетворилося в машину для ведення війни. Що важливо, так це те, що Китай більше ніколи не служитиме іноземцеві; Ся Вей - людина вірності, відданості справі, і в її здійсненні жодна жертва не видасться надто надмірною.\n\nЦе єдине, за що ще можна триматися."

