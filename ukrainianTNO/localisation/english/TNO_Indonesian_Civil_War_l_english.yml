POLITICS_ABDUL_KAHAR_MUZAKKAR_DESC: "Історія Робіна Гуда була актуальною в Південному Сулавесі вже настільки довго, як і Абдул Кахар Музакакар, жорстокий землевласник, якого обожнюють місцеві селяни за його антикріпосницький ісламський соціалізм і відомі партизанські дії. Ці люди та їхні прихильники складають Партизанський загін Південного Сулавесі — ісламську організацію, що виступає проти уряду Джакарти та його маріонеток на Сулавесі.\n\nКоли уряд Сукарно почав розпадатися, ПЗПС використав момент для спроби насильницького захоплення влади в Макассарі, головному місті Сулавесі, тільки щоб бути відкинутими з часом, коли місцева влада Південного Сулавесі, маріонетка Сукарно, відновила свої позиції. Незважаючи на цей невдачу, рух Музакакара є другою основною групою Вільної Індонезії, що бореться на Сулавесі; однак, через відсутність ресурсів, якими володіє Перместа, вони знаходяться в набагато більш небезпечному становищі.\n\nЦя проблема зробила мрію Музакакара — створення ісламської держави з соціалістичними елементами в Індонезії, вільної від голландців, японців, яванців або американців — все більш і більш відкладеним питанням, оскільки конфлікт на Сулавесі все більше нагадує боротьбу за виживання. Єдине негайне полегшення, яке Музакакар може знайти зараз, крім захисту від Аллаха, це те, що маріонетки Сукарно в Макассарі такі ж відчайдушні, як і він."

