POLITICS_AHMAD_HUSEIN_DESC: "Ахмад Хусейн, лідер фракції Гіюгун індонезійської армії — офіцери, здебільшого суматрійського походження, що сформувалися з японської Гіюгун — не завжди був на військовому повстанні проти уряду Індонезії.\n\nСпочатку, коли японці прийшли і поклали кінець голландському імперіалізму, він і Сукарно були на одній стороні. Але двадцять років правління Сукарно призвели до поступової втрати самоврядності Суматри та військових постачань на користь офіцерів PETA в Джакарті. Це також змусило полковників Гіюгун покладатися все більше на угоди з Індією, Австралією та Америкою за місцевий копру і гуму, використовуючи своє стратегічне розташування біля Індійського океану на свою користь.\n\nАхмад Хусейн придумав ідею використати Хатту як лідера Вільної Індонезії. Коли Сукарно оголосив воєнний стан, Хусейн уклав угоду з військовими технократами, повстанцями Спеціальних сил у Сілівангі та Перместою. За підтримки ЦРУ і використовуючи ненависть Сутана Сяхріра до Сукарно, Хатту було викрадено і поставлено лідером нової Індонезії.\n\nЦе сталося, і тепер Хусейн переходить до наступного завдання: боротися, поки Сукарно не буде знищено. Копра і гума будуть надходити, а сили Суматри і її Гіюгун покладуть кінець правлінню Карно."

