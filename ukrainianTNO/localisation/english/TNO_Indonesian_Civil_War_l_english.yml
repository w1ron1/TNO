POLITICS_VENTJE_SUMUAL_DESC: "Коли японці допомогли Сукарно створити вільний уряд, солдати, такі як Вент'є Сумуал, з нетерпінням чекали нової ери без голландців для індонезійських островів. Ця мрія тривала приблизно десятиліття, поки в 1953 році Сукарно не централізував владу у своїх руках і дозволив японцям отримати економічне домінування над Індонезією.\n\nВідповіддю на це в Північному Сулавесі став Перместа — рух Перджуанган Алам Семеста (Вселенська боротьба), що бореться за справедливіший розподіл ресурсів та кінець урядування Сукарно, зосередженого на Яві, яке залишало їх без влади. Спочатку ця боротьба була мирною, поки Сукарно не оголосив воєнний стан; тоді Перместа, не знаходячи мирного виходу з давно назріваючого конфлікту, приєдналася до повстання Суматри в рамках руху Вільної Індонезії.\n\nВент'є і Перместа не є сепаратистами; їхнє бажання не в знищенні Індонезії, а в її фундаментальній реформі та позбавленні від японського ярма. Це робить їх ідеальним шляхом для втручання американців і австралійців, але їм варто остерігатися гостроти характеру Вент'є в їхніх угодах з ним."

#SLS
SLS: "Партизанський загін Південного Сулавесі"
SLS_DEF: "Партизанський загін Південного Сулавесі"
