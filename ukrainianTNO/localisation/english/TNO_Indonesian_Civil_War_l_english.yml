POLITICS_MOHAMMAD_HATTA_ICW_DESC: "Чи був Мохаммад Хатта викрадений чи приєднався до PRIM за своєю волею, залишиться загадкою, але що залишилося зараз, так це те, що він став обличчям Вільної Індонезії, як всередині архіпелагу, так і за кордоном. І все ж, як це сталося?\n\nКолись надійний союзник, друг і довірена особа Сукарно, Мохаммад Хатта тепер стоїть як найбільший ворог Президента. Незалежно від того, що хто-небудь може стверджувати, однак, іншого шляху не було. Як тільки прагнення Сукарно до національної величі перетворилося на інструмент його особистого престижу, хтось повинен був встати, щоб захистити те, що ще залишалося справедливим і правильним для Індонезії; і хто інший, як не Хатта, міг це зробити?\n\nВільний уряд Хатти Індонезії, однак, все ще несе на собі тягар кулеметів. Впливова кліка Гіюгун, глибоко в суматранських джунглях, складає хребет руху через військові ради, і мрії Хатти про вільну республіку необхідно досягти з їх підтримкою.\n\nХатта може лише сподіватися, що вони це дозволять."
POLITICS_MOHAMMAD_HATTA_POSTWAR_DESC: "Війна виграна, і ім'я Сукарно було віднесено до списку потенційних тиранів історії. Свята тривають у містах та селах, і вперше, як здається, за вічність, Індонезія знову є вільною.\n\nАле чи справді це так?\n\nМохаммад Хатта, за лаштунками загальної ейфорії, бачить, як багато з його колишніх союзників жадібно поглядають на палац Мердека, оскільки стабільність новоствореної республіки все ще висить на волосині. Адже союзники під час війни важливі тільки доти, поки конфлікт триває, а ідеологічні суперечності мають неприємну звичку спалахувати в найневідповідніші моменти: це Хатта добре розуміє.\n\nТепер кожен крок президента буде вимагати великої обережності, інакше його велика ідея демократичної Індонезії згасне, як пил у вітрі. Хоча він не новачок у політичних інтригах, саме ставки цього "тихого конфлікту", як називають його деякі з його близьких радників, змушують Хатту перейти на новий рівень.\n\nЩо має значення перемога у війні, якщо ви в результаті програєте світ?"
FRI_spirit_of_1949: "Дух 1949 року"
FRI_spirit_of_1949_desc: "Хатта бунтує не тому, що він хоче повернутися до якогось неправильно згаданого періоду процвітання, що існує лише в уяві дурнів і наївних. Хатта бунтує, тому що час Індонезії для величі давно настав. Разом з ідеалами Сяхіра та Натсіра про фабіанське та сучасне ісламське суспільство, Хатта прагне вивести Індонезію на шлях сучасності, повертаючи Конституцію Парламенту 1949 року. Індонезія більше не буде відсталою."
FRI_growing_pains_rebel: "Розвиткові болі повстанця"
FRI_growing_pains_rebel_desc: "Наша армія може бути відданою, але їй не вистачає ані чисельності, ані підготовки, яку мають наші вороги. Наші професійні солдати зазнають поразок — чи то від смерті, чи від відчаю. Через це нам доводиться все більше покладатися на війська військової ради PRIM. Ще гірше, нам доводиться покладатися на Дарул Іслам — навіть якщо це через стиснуті зуби."
FRI_government_of_administrators: "Уряд адміністраторів"
FRI_government_of_administrators_desc: "Уряд Хатти — це гідра. Небезпечна, хитра і багатоголова, це смертельна сила, з якою треба рахуватися. Складений з технократів, юристів і конституціоналістів, це маленьке диво, що вони можуть погодитися з одним питанням: Індонезією має керувати Конституція — здатна, сильна Конституція, яка не схиляється ані перед Суллою, ані перед Цезарем. Це також — на жаль — одне з небагатьох питань, що об’єднує їх."
FRI_indian_ocean_connection: "Індійський океан як зв'язок"
FRI_indian_ocean_connection_desc: "Зброя, транспортні засоби, економічна допомога — все це надходить до Вільної Індонезії через Західну Індію та Індійський океан. Австралія, США та вся Організація Вільних Націй докладають максимум зусиль, щоб допомогти цій нації — найкращим чином, яким вони можуть.\n\nВони не роблять це з доброти душі. Бізнес-концесії, права на корисні копалини, політичні обіцянки — все це було вилучено з уряду повстанців.\n\nЧи будуть вони виконані, звичайно, покаже час..."

