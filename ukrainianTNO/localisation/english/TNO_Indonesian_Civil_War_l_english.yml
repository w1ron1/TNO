POLITICS_ANDI_PANGERANG_DESC: "Анджі Панґеранґ, губернатор Південного Сулусі, стоїть у своєму укріпленому місті Маккасар, чекаючи, коли ситуація врешті-решт покращиться, і коли центральний уряд Сукарно переможе. Адже це лише питання часу, так?\n\nЗ тінню Пермести, що загрозливо насувається з півночі, і ісламськими партизанами, які спричиняють чимало проблем, позиція Уряду надзвичайного стану, який підтримує Сукарно, є крихкою, і, хоча ситуація стабілізувалася, зокрема завдяки важливій дезертиції офіцера Пермести Джусуа, губернатор може лише чекати.\n\nОднак, як довго ще Маккасар може витримати? І скільки часу ще Сукарно знадобиться, щоб врятувати Індонезію? Щодня, коли руйнування ще більше охоплює країну, губернатор дивиться і не знаходить відповіді; адже що ще йому залишається робити?"
POLITICS_MOHAMMAD_JUSUF_DESC: "Колись Мохаммад Джусф був генералом, пов'язаним з рухом Перместа в Сулусі. Все було добре, коли рух був лише мирним зібранням військових офіцерів та інших осіб, які намагалися запобігти занепаду Сулусі через відсутність постачання та відокремленість від центрів влади.\n\nАле хаос Індонезійської війни зробив більше, ніж будь-яка пропаганда, щоб потрясти його лояльність. Через короткий проміжок часу стало ясно Мохаммаду Джусфу, що він більше не може терпіти; тому він перейшов на бік центрального уряду та став військовим начальником Уряду надзвичайного стану Південного Сулусі до падіння Маккасара.\n\nМаккасар втрачено, і вся регіональна ситуація в хаосі. Анджі Панґеранґ зник, ймовірно потрапив до рук повстанців. Тепер єдине, що може зробити Мохаммад Джусф, крім того, щоб запитати, де він помилився, — це очолити залишки уряду на Сулусі та намагатися витримати в кількох залишкових містах і селах, які він ще контролює. Це буде нелегко, і Джусф хоче, щоб все це вже закінчилося, але який вибір у нього є? Він сам зробив свій вибір, і тепер йому доведеться розплачуватись за це."

