#Duumvirate incoming uhoh
TT_ICW_Common.200.t: "Рушання"
TT_ICW_Common.200.desc: "Що таке Індонезія після років війни?\n\nТам, де колись стояли міста з цегли та каменю, тепер стоять розрушені руїни, населені трупами і знищені полум'ям. Там, де джунглі колись приховували невинні небезпеки для тих, хто їх знає, тепер вони ховають незліченні злі загрози: чоловік може переступити через трос, уникнути шипів, але зустрітися в обличчя з міною.\n\nДитина може стати сиротою та вбивцею за один день; батьки поховають своїх синів та дочок одного тижня, а наступного відправлять десятки інших на ранні могили. Японці вбивали вас через те, що вважали вас незаслуженими; американці вбивали вас через те, що вважали вас рабами.\n\nДля тих, хто знаходиться за океаном, Індонезія існувала як гротескна маріонетка в глобальній ляльковій виставі. Вона танцювала та вигиналась під мелодію іноземних господарів, поки зв'язки її народу не лопалися і тіло її землі не тріскалося до неживої шкаралупи, що повинна бути викинута.\n\nІ - в темних залах влади в Джакарті та на повстанських радах через палаюче архіпелаг - були ті, хто не був задоволений тим, що їхня країна та народ стали жертвами різні руки історії."
TT_ICW_Common.200.a: "Війна наближається до свого завершення.\nТак чи інакше."

#Duumvirate Lubis-aligned - army radicals killed generals, Sukarno calling emergency
TT_ICW_Common.201.t: "Розв'язка"
TT_ICW_Common.201.desc: "День почався з різкого звуку пострілів біля Президентського палацу, залишаючи глядачів збентеженими, коли солдати в уніформі Президентської гвардії покинули свої пости, щоб вбивати своїх командирів, а потім самі були застрелені.\n\nДо середини ранку коронери оголосили про смерть шести високопоставлених генералів в Індонезійських Збройних силах — їхній звіт був єдиним фактом, який був очевидний серед бурі чуток, що оберталися в Джакарті. Чутки на вулицях, або, принаймні, у цензурованих газетах і радіостанціях: націоналісти в уряді, незадоволені надто м'яким підходом до повстанців, вирішили вжити ініціативу і позбутися своїх суперників.\n\nДо полудня багато хто очікував, що повстанці спробують використати плутанину в уряді Сукарно, але цього не сталося. Чутки про безлад поширювались, і Мохаммад Хатта не з'являвся, щоб розвіяти непорозуміння. Його не могли знайти зовсім.\n\nДо вечора надійшов наказ з Президентського палацу — Сукарно оголошує новий надзвичайний стан, скликаючи своїх найбільш лояльних генералів та міністрів через змову. Але одне ім'я серед них — Зулькіфлі Лубіс, вільний індонезійський генерал — тільки додав палива вогню.\n\nІ коли оголосили, що Хатту захопили, а згодом він був помилуваний благородством Сукарно на ім’я порятунку індонезійської нації, ніхто вже не знав, що й думати.\n\nА потім знову почався стрілянина."
TT_ICW_Common.201.a: "Що б не відбувалося, благородство Сукарно було розбите."

#Duumvirate Suharto-aligned - leftist radicals killed generals, Sukarno calling emergency
TT_ICW_Common.202.t: "Розв'язка"
TT_ICW_Common.202.desc: "День почався з різкого звуку пострілів біля Президентського палацу, залишаючи глядачів збентеженими, коли солдати в уніформі Президентської гвардії покинули свої пости, щоб вбивати своїх командирів, а потім самі були застрелені.\n\nДо середини ранку коронери оголосили про смерть шести високопоставлених генералів в Індонезійських Збройних силах — їхній звіт був єдиним фактом, який був очевидний серед бурі чуток, що оберталися в Джакарті. Чутки на вулицях, або, принаймні, у цензурованих газетах і радіостанціях: ліві та радикали звернулися до масового терору, щоб влаштувати повстання.\n\nДо полудня місто заповнили повідомлення про саме таке повстання по всій Яві. Вся робота припинилася, коли громадяни поспішали додому, щоб забити вікна і придбати необхідне перед наступом повстанців, який неминуче мав початися, хоча ніхто не міг сказати, чи буде це через годину, через день, або ж воно вже йшло.\n\nДо вечора страх сам собі живив. 'Наглядові загони' вирушили на вулиці разом з армійськими пошуковими командами, направленими генералом Сухарто, щоб шукати зрадників серед населення — і вершити правосуддя за своїм розсудом. Громадський порядок зник до півночі, і Президентський палац скликав своїх найбільш лояльних генералів і міністрів через анархію.\n\nІ коли згодом уряд вільної Індонезії оголосив, що насильство поширилося на Суматру, що вимагає термінового припинення вогню, вбивства досягли піку."
TT_ICW_Common.202.a: "Сукарно — і Хатта — втратили контроль."

#Escalation events. War is hell.
TT_ICW_Common.300.t: "Добре провітрюйте"
TT_ICW_Common.300.desc: "Якщо ви чули літаки, що пролітають над Індонезією, ви падали на землю і затримували дихання. Якщо вам пощастило, ви ще могли дихати повітрям через хвилину.\n\nЯкщо ні, то ви залишалися з тим, що було в ваших легенях, оскільки кисень у повітрі вибухав або заміщався випарами стиролу. Якщо вам пощастило, ви могли втратити свідомість і померти без почуттів.\n\nАле вогонь — ревучі полум'я, розгорнуті напалмом, що запалюють будівлі та кістки однаково — ускладнювали це. Кожен хотів би закричати, відчуваючи, як їхня шкіра лопається і чорніє, відкриваючи зварене м'ясо всередині. Але якщо б вони це зробили, вони могли б смажитися зсередини або задихатися від отруйних парів.\n\nНі, всі жителі одного селища на Суматрі — військово безцінного до випадкового зміщення лінії фронту — могли лише затримати дихання і бігти. Бігти від вулиць, що палахкотіли, і вигорілих провулків, до більш холодного та чистого повітря на околицях лісу.\n\nВони зрозуміли, коли виривалися з пекельної в'язниці в обірваній, змученій лінії, що достатнє провітрювання приносило полегшення."
TT_ICW_Common.300.a: "Провітрювання — вимірюється калібрами куль і ранами виходу."

TT_ICW_Common.301.t: "Випадкові допити"
TT_ICW_Common.301.desc: "Очікування в чергах на контрольних пунктах безпеки в містах тривало годинами, до такої міри, що індонезійці, які стояли в черзі, почали дивуватися, чи взагалі хтось проходить. Черга рухалась вперед за маленькими кроками, даючи спостерігачам час розглянути навколишнє середовище.\n\nВсі побачили, як сержант спочатку двічі, а потім тричі дивився на пару, яка перетинала контрольний пункт, а потім крикнув їм зупинитися і підняти руки. Кілька солдатів спрямували свої рушниці на пару, коли ті тряслися, виконуючи наказ; інший солдат наказав усім відступити, кричачи 'пояс-замах' через незадоволені грюкі натовпу.\n\nЧоловіка грубо обшукали, стиснувши всі його кінцівки, після чого його штовхнули на землю і тримали під дулом. Жінка не отримала більше делікатності, хоча її провели через 'інспекцію' всередині контрольної будки. Натовп робив вигляд, що не чує її сліз від приниження.\n\n"Скажи, звідки ти прийшов!" — кулак сержанта вдарив по обличчю затриманого чоловіка з огидним хрустом.\n\n"Скажи, з ким ти живеш!" — приклад рушниці вдарив чоловіка по животу, змушуючи його зігнутися.\n\n"Скажи нам все." — Натовп бурчав, коли два солдати схопили чоловіка за під пахви, тягнучи його в очікуючий фургон, його супроводжувала жінка. Вони спостерігали, як фургон мчить вдалечінь за опущеними багнетами на контрольно-пропускному пункті."
TT_ICW_Common.301.a: ""Наступний!""

TT_ICW_Common.302.t: "Надзвичайні обставини"
TT_ICW_Common.302.desc: "Натовп вже кілька годин збирався перед поліцейським відділком, коли прибув іноземний полковник, а поліція намагалася утримати свій кордон, поки офіцер поспішав всередину.\n\nВсі знали, що сталося. Місто — далеко за лінією фронту — і його бари та клуби були тероризовані іноземцем, який ображався на кожну уявну образу — або іноді на що завгодно. Спочатку це пояснювали пияцтвом, як це звикли робити всі іноземні солдати та моряки, але коли з’явився певний шаблон, деякі сумнівалися, що винуватець потребував хоча б ковтка перед тим, як нападати на свою поточну жертву.\n\nСьогодні його знайшли кровавим за сміттєвим баком, верхом на чорному та забитому купі, що вже давно перестала рухатися. Він відправив п'ятьох чоловіків до лікарні, коли ті намагалися його приборкати, а потім поліція прибула і забрала його.\n\nНатовп вимагав правосуддя. Скільки їхніх чоловіків і жінок опинилися в лікарні через цього монстра? Але поліція стримувала їх — не тому, що вони хотіли цього, а тому, що командир поліції був чітко повідомлений про 'надзвичайні обставини.'\n\nНатовп ревів від люті, коли іноземний полковник вийшов із будівлі, а звір ішов за ним, з психічною посмішкою на обличчі. Вони тиснули на поліцейську лінію, коли іноземці залізли до чекаючого автомобіля, кричачи, поки він віддалявся вдалечінь.\n\nПравосуддя носило уніформу в Індонезії — за винятком тих, хто носив зовсім іншу уніформу."
TT_ICW_Common.302.a: "Ще один злочин серед багатьох."

TT_ICW_Common.303.t: "Сині на синіх"
TT_ICW_Common.303.desc: "Цей солдат був тихим, говорили всі. Не часто спілкувався з іншими, ніколи не говорив, звідки він, і чому приєднався до армії. Хоча ніхто й не запитував — усе, що тепер було важливим для індонезійців, особливо для іноземних радників, це те, щоб ти міг взяти зброю, націлити її і натискати на курок.\n\nВін був у цьому гарним, погоджувалися всі. Досить гарним, щоб отримати хлопання по спині і безкоштовні напої в пабі — від радників, вони були єдиними, хто мав достатньо грошей для цього. Спочатку він пив, достатньо, щоб вивести слона — і заробив собі два дні покарання за це.\n\nПізніше він зовсім не чіпав алкоголь. Радники були задоволені; вони сказали йому, що він звик до вбивства, як і вони. Коли ти міг насолоджуватися повним використанням своїх відчуттів, навіть після того, як спостерігав за монтажем смерті і жахіть, тоді ти знав, що знову 'нормальний'.\n\nЩоранку солдати слухали доповіді про зміни на лінії фронту. В основному це стосувалося їхнього конкретного сектору, але іноді згадували захоплення або знищення віддаленого міста. Нагадування, як говорили офіцери, про те, за що вони борються.\n\nЦе був день, як будь-який інший, коли солдати йшли, залишаючи іноземних радників обговорювати денні завдання — до того моменту, поки солдат не прострелив їм мозки з його служби, розмальовуючи намет червоним, перед тим як додати свою власну кров до цього змішування."
TT_ICW_Common.303.a: "Затушено, як рідне місто, якого ніхто не знав."

USA_INS.1.t: "Індонезійська загроза"
USA_INS.1.desc: "Шеф Генрі Галлер готував набір клубних сендвічів для виїзду. Страви з делікатесів не були його спеціальністю, але раптово відбулася важлива нарада вгорі, і він не мав багато часу для приготування більш вишуканої їжі. 'Хвилиночку!' — крикнув він своєму добре відомому швейцару. 'Ми ще готуємо салат.' Він зітхнув. 'Що взагалі відбувається в Овальному кабінеті?'\n\n'Індонезія, Генрі,' — сказав швейцар Євгені Аллен. 'Оборона, Держдепартамент, ЦРУ — всі там.'\n\n'Це те саме, що з пілотом та австралійським кораблем?' Аллен кивнув. 'Отже, ми, нарешті, втомилися від них, чи що?'\n\n'Можливо, але це просто ще одна катастрофа, щоб додати до купи. Африка — це хаос, ми застрягли там, а тепер у нас є ще одна війна на горизонті в далекому місці. Не думаю, що вступити в неї буде дуже популярно.'\n\n'Тобто, якщо це ситуація, то, мабуть, ми залишимося осторонь.' Галлер завершив накладати останні порції салату. 'Є забагато війн, ми не можемо виграти всі, і ми не можемо ввійти в усі.'\n\n'Саме це і турбує Президента, але секретарі кажуть йому інше.' Аллен складав тарілки на піднос. 'Я був там, вони казали, що австралійці, наприклад — вони не будуть щасливі з відмовою. Вони хочуть побачити цього Сукарно за межами, так само, як ми хотіли побачити мертвілою Хюттіга. І вони кажуть, що Сполученим Штатам просто не можна залишити все на них, або японці заберуть весь регіон.'\n\nГаллер мовчав, поки завершував накладати останні порції. 'Добре, Аллене, я думаю, що ти повинен сказати мені, яке рішення прийме Президент.'"
USA_INS.1.a: "Загострити ситуацію."
USA_INS.1.b: "Дати час на роздуми."

USA_INS.2.t: "Свобода в Індонезії"
USA_INS.2.desc: "Оплески щасливих співробітників Білого дому були чутні знизу, коли шеф-кухар Галлер готував святкову їжу. Нассі горенг з яйцем, креветкові чіпси та мариновані овочі. Ікан бакар — грильовану рибу. Суп з овочами сайюр асем. Рис на парі в банановому листі. Це не зовсім типова їжа, яку він уявляв, що готуватиме в Сполучених Штатах, і, безумовно, деякі рецепти він уперше почув після початку війни. Але ця приготована їжа не піде на смітник. Це була святкування — всі ті довгі ночі, стреси й невдачі, все це закінчилося.\n\n'Це ще одна перемога, Генрі!' — крикнув Аллен, коли зайшов. 'Ми перемогли японців, Сукарно, всіх цих головорізів! Я не бачив цього місця таким щасливим, з часів, коли Айзенхауер переобрався.'\n\n'І я припускаю, що місто також радіє?' \n\n'Я подзвонив Хелені, і всі на вулиці в захваті. Більшість із них знають когось у службі, і вони повертаються. Вони можуть сперечатися, було це правильно чи ні, але ми виграли, і все це закінчилося.'\n\n'Можливо,' — сказав Галлер, смакуючи сайюр асем. 'Але кажуть, що Хатта може залишитися в Сфері після всього цього. Це справді так? Чи варто було все це?' \n\n'Хатта може потрапити в Сферу, але це буде на його умовах, а не Токіо. І є багато людей, які за ним, і вони знають, хто допоміг йому потрапити туди.' Він взяв піднос. 'Динаміт може вирішити, що він хоче, але кухня готує це так, як подобається шефу.'\n\n'Цілком вірно, містер Аллен,' — усміхнувся Галлер."
USA_INS.2.a: "Подавайте з гарніром із самбалу."

USA_INS.3.t: "Запах невдачі"
USA_INS.3.desc: "Були дні, коли Євгені Аллен ненавидів свою роботу. Дисонанс спостерігати, як чоловіки його кольору шкіри борються і помирають за свої права, коли він мав робити вигляд, що все нормально, для еліти Сполучених Штатів. Коли Кеннеді помер, він організував прийом на похорон. І сьогодні буде один із тих днів, коли він дивиться на сумні обличчя солдатів, дипломатів, австралійських високопосадовців і різноманітних співробітників Білого дому, які дивляться на екран телевізора.\n\nЦе був CBS News. Кадри, що показують, як гелікоптери Хьюї покидають архіпелаг Індонезії, вивозять останні війська ОФН, поки світ замикається. Кадри танків урядових військ, що входять до міст, які колись контролювали Вільні Індонезійці. Натовпи біженців, людей, які колись були вірні справі, що благають втекти на аеродромі, хапаючи колеса літаків і тиснучи на борти C-130. І ось вони тут, на іншому кінці світу, спостерігають, як все руйнується, поки Аллен подає легкі алкогольні напої з підноса.\n\nЄвгені ненавидів цей сюрреалістичний фантастичний світ, але коли він повернеться додому, він знав, що буде ще гірше. Він знав, що на його вулиці є люди, у яких сини служать за кордоном. Дехто з них на останніх рейсах. Дехто з них ніколи не вийде, або вже лежать на Арлінгтонському кладовищі. Вони були обурені всім цим, і вони перенесуть своє обурення на нього. Один із хороших, дядько Том, чорний раб, хтось далеко від цього світу болю, в якому вони змушені були жити.\n\nСвіт свободи зазнав поразки, його кров, бомби і зв’язки не принесли результатів. Люди в цій кімнаті не змогли перемогти Сферу за величезну ціну. І Євгені доводилося турбуватися, як він подивиться своєму сину в очі і скаже — так, це найбільша країна на землі — і не матиме нічого щирого, щоб це підтвердити."
USA_INS.3.a: "Все згоріло."

USA_INS.4.t: "Наш диктатор виграє"
USA_INS.4.desc: "У Білому домі, в кімнаті для нарад було тихо, лише голос секретаря з Міністерства закордонних справ порушував тишу. Спокійно слухали його Президент, його кабінет та австралійський посол. Новини про завершення Індонезійської війни нарешті дійшли до Вашингтона, і тепер усі чекали, що буде далі.\n\n'Коротко кажучи, Вільна Індонезія виграла.' Слова секретаря викликали хвилю оплесків від присутніх. Проте чоловік, що говорив, не поділяв їхнього захоплення. Коли шум стих, він продовжив читати. 'Але уряд очолює Зулкіфлі Лубіс, а не Хатта. Зважаючи на його співпрацю з Сухарто, невідомо, скільки йому можна довіряти.'\n\nОстаннє повідомлення швидко зіпсувало настрій у кімнаті. Раптом їхні інвестиції здавалися набагато сумнівнішими, особливо враховуючи, що деякі про-японські елементи могли залишатися в тіні разом із Сухарто. Ніхто не хотів звертатися до цього питання.\n\nОкрім австралійського посла, який і порушив мовчання.\n\n'Ну, можливо, це не наш бажаний кандидат, але, принаймні, ми дали Токіо чіткий урок. Це хоча б щось, що ми можемо передати громадськості, навіть якщо це не заспокоїть родини загиблих. Я задоволений, панове.'\n\nКоли посол вийшов, Президент поглянув на свого секретаря з усієї цієї ситуації. Обидва чоловіки мали заплутані вирази облич, але жоден з них не міг сказати, що посол був неправий. Коли Президент розпустив нараду, він почав думати про те, що було для них більшим досягненням у конфлікті — Індонезія чи Австралія."
USA_INS.4.a: "Це хоча б перемога."

USA_INS.5.t: "Далеке світло свободи"
USA_INS.5.desc: "Це було смішно, подумав шеф-кухар Галлер. Раніше він завжди обирав свої інгредієнти дуже ретельно, працюючи в готелях. Звісно, йому довелося прийняти певні обмеження, коли він почав працювати в Білому домі. Питання безпеки не дозволяли йому використовувати того ж постачальника чи торговця занадто часто, але у нього все ж була загальна lista місць, де він любив купувати продукти. Але в їдальні був тільки один вид кави, і він не знав, звідки вона походить. Він подивився на чашку і замислився. Гватемала? Мексика? Бразилія? А може - \n\n"Ви думаєте, ми будемо отримувати яванську каву, містере Аллен?" - подумав він вголос, посилаючись на новини дня.\n\nЄвгені Аллен знизав плечима. "Можливо, індонезійці продадуть нам каву тепер, коли вони перемогли," - сказав він. "Але чомусь... багато людей не дуже радіють цьому тут."\n\n"Як саме?" - запитав шеф-кухар Галлер.\n\n"Вони, здається, думають, що пропустили можливість," - пояснив Едвард. "Якби Президент пішов на все, вони могли б відкрити двері на ширину і перемогти японців, що дало б величезний політичний приріст. І не кажучи вже про те, що більше індонезійців залежали б від Сполучених Штатів за допомогу у досягненні цієї мети."\n\nГаллер обміркував це, відкусивши пончик. "Містере Аллен," - сказав він, - "коли я був молодшим, я служив в армії Швейцарії, після того як мене призвали на війну. Кожен раз, коли я потрапляв у театри воєнних дій, я бачив, як Варшава, Роттердам, Лондон, Москва, всі великі міста Європи палають, нацисти проривали будь-який опір, і я хвилювався, що ми — маленька Швейцарія — будемо наступними. І я боявся, що помру молодим, так і не здійснивши своїх мрій. Але на щастя, війна не сталася, і я виріс, і отримав одну з найбільших робіт на землі. Ви розумієте мене?"\n\nЄвгені кивнув. "Думаю, я розумію. Ми виграли війну, яку не вели.""
USA_INS.5.a: "Подавайте після того, як дасться настоюватися."

USA_INS.6.t: "Свобода згасла"
USA_INS.6.desc: "Напруга в Білому домі була настільки велика, що можна було... ні, подумав шеф-кухар Галлер, коли нарізав цибулю для чилі Президента. Занадто очевидно, занадто банально, занадто, що ж, легке для цього жалюгідного дня.\n\nКоли він прочитав новини, він зрозумів, що цей день буде жахливим. Усі знали, що ОФН зазнав поразки на далекому сході, і всі були сердиті через це. Одні вірили, що індонезійці зазнали поразки, інші - що австралійці не завершили справу до кінця. Але інші мали власні думки. Вони були тими, хто закликав до втручання США, що вони могли б виграти конфлікт, якби США взяли на себе участь.\n\nТепер конфлікт був втрачений, і, можливо, всі мали рацію щодо того, як він провалився. А можливо, ніхто з них не був правий. Але ті, хто стверджував, що Президент зазнав поразки, були найгучнішими. Якби вони послухали їх, Індонезія могла б бути вільною, японці були б вигнані з островів, і Токіо хвилювалося б, а не вони. Вони мали свою групу в Білому домі, що перетиналася через широкий спектр людей, які приходили та йшли сьогодні, і, безумовно, кожен був готовий вибухнути.\n\nЄвгені Аллен зайшов у своєму слузькому костюмі, не кажучи ані слова, пройшов прямо до шафи з алкоголем. Він подивився Галлеру прямо в очі, вираз взаєморозуміння. Він витягнув лід та склянки, потім зупинився, глибоко замислившись. Євгені запитав: "Хочете дізнатися, що я думаю?"\n\n"Що ви думаєте, містере Аллен?"\n\n"Якщо б ми програли... і наші сини та батьки були б там..." \n\nАллен похитав головою і пішов, залишаючи Галлера в кухні з цибулею."
USA_INS.6.a: "Не помішувалося постійно в котлі."

USA_INS.7.t: "Їхній диктатор виграє"
USA_INS.7.desc: "Ось вони, Президент, його кабінет і австралійці, всі мовчки рухаються до кімнати. Холодна реальність ситуації змусила їх усіх прокинутися, бути дуже тверезими, щоб усвідомити те, що сталося.\n\n"СУХАРТО ВИГРАЄ." Два простих чорних слова на ранковій газеті окреслювали нову реальність. Вони витратили багато часу, як на цій нараді, так і на інших, розмірковуючи про те, що пішло не так і як вони втратили так багато. Було правдою, що протягом цієї довгої, затягнутої війни — війни, що коштувала багато американських життів і ще більше життів самих індонезійців — були моменти, коли здавалося, що ситуація змінюється на краще, що вони дійсно могли виграти.\n\nНе через це вони відправляли так багато своїх синів воювати в джунглях? Чи було їхнє впевнення так помилковим? Що ж тоді вони скажуть родинам, які зустрічають труни з тілами вдома? Чи було все це марно?\n\nНу, вони могли б сказати їм правду. Що Сухарто ніколи не був зацікавлений у співпраці з Америкою ще до війни. Що, усунувши всі загрози своїй владі, Сухарто поведе Індонезію в своєму напрямку, який буде максимально віддалений від ОФН. Що, зрештою, Токіо виграло цю боротьбу, і американські хлопці загинули даремно.\n\nЗвісно, вони не могли б сказати їм цього. Вони б сказали ті самі банальні плати, які завжди говорили, і сподівалися, що це допоможе. Але жодна кліше не може стерти те, що всі — як у кімнаті, так і за її межами — знали:"
USA_INS.7.a: "Це була трагедія."

USA_INS.8.t: "Король попелу"
USA_INS.8.desc: ""Зачекайте: я хочу переконатися, що я розумію це правильно. Тобто після того, як Лубіс і Сухарто фактично здійснили переворот в індонезійському уряді і вигнали Сукарно — після всього, що сталося за останні кілька років — вони потім програють, причому кому, як не опозиції?" — Президент [USA.GetLeader] перервав брифінг державного секретаря, виглядаючи так само збентежено, як і Кабінет. Описати атмосферу в ситуаційній кімнаті як заплутану, мабуть, було б занадто м’яким висловом для того, що виразно можна було побачити на обличчях усіх присутніх.\n\nДержавний секретар прочистив горло. "Так, здається, саме так. Це не повинно було бути можливим, але з іншого боку, ніхто не очікував, що Лубіс і Сухарто підуть на цей захват влади".\n\n"Підсумовуючи, ситуація на місцях швидко виходить з-під контролю," — продовжив він. "Ми сумніваємося, що новий уряд зможе контролювати хаос хоча б трохи краще, ніж попередні. Навіть якщо ми й хочемо допомогти, вони взагалі не зверталися до нас. Не думаю, що вони зацікавлені".\n\nПрезидент переглянув численні документи на столі. Їх не треба було читати докладно: фотографії зруйнованої Джакарти добре розповідали свою історію. Після того, як він зітхнув, вони заговорили, чітко виявляючи своє розчарування.\n\n"Давайте зробимо крок назад. Ви розумієте, що це означає? Це була тріщина в броні Сфери. Це мала бути наша точка входу в Сферу! Хоча б Токіо не має цього: це було б набагато гірше.""
USA_INS.8.a: "Але сумніваюся, що ми коли-небудь отримаємо таку можливість знову."

USA_INS.9.t: "Кого ви будете дзвонити?"
USA_INS.9.desc: "Державний департамент наповнений хаосом, оскільки індонезійська громадянська війна набуває новий, несподіваний поворот. Збентежені та розгнівані дипломати ходять по своїх офісах, телефонуючи контактам в Індонезії, на які не отримують відповідей. Навіть ЦРУ не знає, що з усім цим робити, адже контакти на місцях повідомляють про таку ж відсутність інформації. Для Президента та громадськості образ подій був досить нервовим.\n\nНаші австралійські союзники також розчаровані цією ситуацією, бачачи, як одна з основних інтересів у регіоні, здавалося, йде в пламени, незважаючи на наші інвестиції. Вони підтримують нас і Президента в чистому розчаруванні через останні події.\n\nХатта, здається, втратив будь-який контроль над урядом Вільної Індонезії, так само, як і Сукарно над індонезійським урядом. Під керівництвом Зулкіфлі Лубіса і Сухарто контекст війни був повністю переосмислений, і тепер у Джакарті стоїть режим, дуже віддалений від того, що ми хотіли, коли почали відправляти людей і матеріали в Індонезію.\n\nХоча б Лубіс — Президент Лубіс — виглядає тим, хто більше контролює ситуацію з обох, і він має певні симпатії до ОФН завдяки всій допомозі, яку йому надали. Однак це мало втішає Державний департамент, Президента, солдатів, що повертаються додому, і людей, які тепер вимагають відповідей щодо того, що сталося з індонезійським конфліктом після всіх цих поворотів."
USA_INS.9.a: "Щонайменше це щось."

USA_INS.10.t: "Кого ви будете дзвонити?"
USA_INS.10.desc: "Державний департамент наповнений хаосом, оскільки індонезійська громадянська війна набуває новий, несподіваний поворот. Збентежені та розгнівані дипломати ходять по своїх офісах, телефонуючи контактам в Індонезії, на які не отримують відповідей. Навіть ЦРУ не знає, що з усім цим робити, адже контакти на місцях повідомляють про таку ж відсутність інформації. Для Президента та громадськості образ подій був досить нервовим.\n\nНаші австралійські союзники також розчаровані цією ситуацією, бачачи, як одна з основних інтересів у регіоні, здавалося, йде в пламени, незважаючи на наші інвестиції. Вони підтримують нас і Президента в чистому розчаруванні через останні події.\n\nХатта, здається, втратив будь-який контроль над урядом Вільної Індонезії, так само, як і Сукарно над індонезійським урядом. Під керівництвом Сухарто і Зулкіфлі Лубіса контекст війни був повністю переосмислений, і тепер у Джакарті стоїть режим, дуже віддалений від того, що ми хотіли, коли почали відправляти людей і матеріали.\n\nЩе гірше, Сухарто — тепер Президент Сухарто — здається, поглинув те, що залишилося від уряду Вільної Індонезії, завдяки тому, що Лубіс підставив нас. На жаль для наших радників, Сухарто, ймовірно, знову наблизиться до Японії. Більше нема що сказати, окрім того, що нас обдурили. Все, що залишилося, це для Президента звернутися до нації і спробувати пояснити наші попередні дії так, щоб заспокоїти гнів виборців."
USA_INS.10.a: "Підступно обмануті найгіршим чином."

USA_INS.11.t: "Посміхатися і терпіти"
USA_INS.11.desc: "Незручна тиша заповнила ситуаційну кімнату, коли останній доповідач завершив свою презентацію. Хтось кашлянув, потім швидко придушив це, відчуваючи важливість ситуації. Усі погляди були прикути до Президента, який кілька моментів обробляв все, що відбувається.\n\nНа початку війни витрати здавалося, що можна було б витримати. Вони були важкими, звісно, але все ще прийнятними, навіть благородними — поки вони не зростали. Але місяць за місяцем доповіді ставали все довшими і довшими, досягнувши піку минулого місяця, коли показники загиблих і втраченого обладнання були настільки високими, що це здивувало навіть зазвичай спокійний Національний безпековий комітет.\n\nЦього місяця доповіді, на які вони сподівалися, мали б змінити цю тенденцію. Натомість тенденція тільки посилилася. Президент [USA.GetLeader] взяв одну з доповідей. Було зрозуміло, що бої зараз розповсюджуються по всій країні, і все більше і більше їхніх хлопців повинні були заповнювати прогалини в армії Вільної Індонезії Хатти — із відповідними втратами.\n\nСтала нав’язуватися одна дивна ідея: а що як США вийдуть з війни, просто згорнуть свої втрати і втечуть? Цю думку одразу відкинули. Навіть якщо не враховувати величезні ставки, Америка вже заплатила занадто високу ціну, щоб піти без нічого.\n\nОтже, вони будуть продовжувати: ще більше їхніх хлопців помре в індонезійських джунглях. Америка повинна витримати. Усі погляди були прикути до Президента, всі в тривожному очікуванні того, яке буде рішення. Слова, які він промовив, не залишили сумнівів щодо їхньої рішучості."
USA_INS.11.a: "Ми повинні виграти цю війну. Відступу немає."

USA_INS.12.t: "Хвилини до півночі"
USA_INS.12.desc: ""З усією повагою, посол Фукуда, наші докази абсолютно незаперечні," — сказав Президент. "Америка вимагає, як мінімум, офіційних вибачень, значної компенсації за наші втрати і повного виведення всіх японських військ з Індонезії".\n\nЯпонський посол був обурений. "Які брехні! Ми невинні. Ми повинні вибачатися перед вами? Ах, це мало б бути навпаки! Ви звинувачуєте нас у вбивстві ваших людей, коли очевидно, що саме ви вбиваєте наших солдатів. Але забутьте це. Це втрата часу". Перш ніж Президент встиг відповісти, посол підвівся і пішов, грубо зачиняючи двері.\n\nПісля того, як посол грюкнув дверима, Президент [Root.GetLeader] видихнув, навіть не знаючи, що тримав подих. Ця зустріч була набагато напруженішою, ніж будь-яка інша, яку він мав за останній час, але на це були вагомі причини для тривоги.\n\nДо цього часу навіть загальна публіка усвідомлювала, що і Америка, і Японія мають солдатів в Індонезії. Більшість людей була абсолютно неосвічена щодо глибших наслідків. Без жодного поміченого, те, що раніше було немислимим, стало реальністю. Американські та японські солдати стріляють один в одного, вбиваючи один одного.\n\nЗвісно, вони не могли сказати це вголос. І Президент, і посол розуміли, що станеться, якщо вони це зроблять: це буде гонка до найвищої точки ескалації, де єдиним призом буде ядерне знищення. Навіть коли їхні армії різали одна одну з усією руйнівною силою, яку може дати лише сучасна війна, обидві сторони повинні були робити вигляд, що це не війна.\n\nОсь вони, Америка і Японія, заплутані в цьому незручному пас-де-дьє."
USA_INS.12.a: "Треба було турбуватися про те, як довго ця маска може тривати."

USA_INS.100.t: "Рух Перместа"
USA_INS.100.desc: "КЛАСИФІКАЦІЯ: ТОП-СЕКРЕТ\n\nЦЕНТРАЛЬНЕ РОЗВІДНИКОВЕ УПРАВЛІННЯ | ДИРЕКТОРАТ РОЗВІДКИ\nТема: Перместа та Північний Сулавесі\n\nЗростаюча хвиля незгоди з режимом Сукарно продовжує створювати особливі можливості для нас, щоб підривати уряд, підтримуваний Токіо, у Джакарті. Одним із таких напрямків є рух Всесвітнього Струмового Хартії (також відомий як Перместа), лідери якого прагнуть протистояти та боротися з обмежувальними економічними політиками, що шкодять їхньому місцевому бізнесу. Крім того, відзначено, що популярне незадоволення режимом охопило провінцію Північний Сулавесі, що дає нам можливість вирішити дві проблеми одночасно.\n\nЯкщо операція під кодовою назвою "Пожежна розпродажа" отримає зелене світло, вона буде здійснюватися двома напрямками. По-перше, ми надамо місцевій групі Перместа постачання зброї та обладнання, а також невеликий підрозділ військових інструкторів, щоб навчити повстанців користуватися цими засобами, якщо почнеться громадянська війна. По-друге, ми будемо використовувати регіон Північного Сулавесі як логістичний хаб для надання нашій армії в USFIP на Мінданао необхідної підтримки в їхній боротьбі проти філіппінської гарнізонної армії.\n\nЗа вашим словом, пане Президенте, ми можемо розпочати операцію негайно."
USA_INS.100.a: "Дайте цим хлопцям їхні рушниці та патрони."
USA_INS.100.b: "Немає потреби."

USA_INS.101.t: "Конкуренція в ІАФ"
USA_INS.101.desc: "КЛАСИФІКАЦІЯ: ТОП-СЕКРЕТ\n\nЦЕНТРАЛЬНЕ РОЗВІДНИКОВЕ УПРАВЛІННЯ | ДИРЕКТОРАТ РОЗВІДКИ\nТема: Копра Колонели\n\nНашим агентам вдалося успішно встановити контакт з елементами Індонезійської армії на Суматрі, що належать до "Копра Колонелів": конкуренційної фракції, проти пануючого клік ПЕТА генералів, які диктують військову політику з Яви (див. Меморандум - Фракціоналізм в Індонезійських збройних силах). Після того, як нам вдалося завоювати довіру Копра Колонелів, ми змогли встановити прямий контакт з лідерами групи, серед яких був полковник Ахмад Хусейн.\n\nПолковник Хусейн висловив зростаюче невдоволення серед своїх людей через недостатні ресурси, надані йому урядом для виконання своїх обов'язків, і почав шукати фінансування для досягнення цієї мети. Після обговорення можливості отримання американських коштів серед інших для інвестування в його сили, полковник продемонстрував готовність "діяти" на основі свого незадоволення проти Джакарти, якщо ми запропонуємо кращі переваги для переконання його.\n\nТакий хід може бути безцінним для підриву єдності Індонезійської армії та ослаблення контролю режиму над регіоном. За вашим словом, пане Президенте, ми можемо розпочати процес подальших переговорів."
USA_INS.101.a: "Чудово. Давайте почнемо переговори."
USA_INS.101.b: "У нас є інші пріоритети."

USA_INS.102.t: "Об'єднана дисгармонія"
USA_INS.102.desc: "КЛАСИФІКАЦІЯ: ТОП-СЕКРЕТ\n\nЦЕНТРАЛЬНЕ РОЗВІДНИКОВЕ УПРАВЛІННЯ | ДИРЕКТОРАТ РОЗВІДКИ\nТема: Відсутність лідерства серед повстанських фракцій\n\nБез сумніву, індонезійський народ не має ніякої любові до нинішнього уряду під керівництвом Сукарно, його жорсткі політики, що експлуатують сільські провінції на їхній шкоду, в той час як його фаворитизм призводить до зростаючих розбіжностей серед більшості гілок уряду. Більше того, багато хто вважає уряд просто лялькою для Токіо, чиє нав'язливе вплив на відчувається як в індустріальному секторі, так і в збройних силах.\n\nТим не менше, навіть незважаючи на єдину причину для повстання, жоден лідер серед повстанських фракцій не виявився здатним справді об'єднати всю силу опозиції Сукарно. Кожна група має надто різні цілі і завдання, що робить перспективу створення популярно/елітарної коаліції проти режиму наразі віддаленою можливістю.\n\nМи продовжимо моніторинг ситуації, поки не з'являться нові розробки."
USA_INS.102.a: "Продовжити."

USA_INS.103.t: "Заспокоєння Червоного Привида"
USA_INS.103.desc: "КЛАСИФІКАЦІЯ: ТОП-СЕКРЕТ\n\nЦЕНТРАЛЬНЕ РОЗВІДНИКОВЕ УПРАВЛІННЯ | ДИРЕКТОРАТ РОЗВІДКИ\nТема: Контакт з лідером PDAF\n\nПісля кількох спроб зв'язатися, не кажучи вже про те, щоб знайти людину, яка керує Народними Демократичними Збройними Силами, наші оперативники змогли встановити контакт з elusive лідером цієї соціалістичної повстанської групи: Аміром Сжафруддіном.\n\nНезважаючи на очевидну потребу PDAF у нашій підтримці, Сжафруддін був дуже скептичним у прийнятті будь-якої пропозиції з нашого боку, безсумнівно через його ідеологічні переконання. Ми можемо спробувати переконати його, представивши нашу конкретну допомогу UMAJF в Малаї, щоб розвіяти будь-які сумніви щодо нашої відданості.\n\nМи повідомимо про будь-які подальші розробки, коли вони з'являться."
USA_INS.103.a: "Продовжити."

USA_INS.104.t: "Коли невдача приносить користь"
USA_INS.104.desc: "КЛАСИФІКАЦІЯ: ТОП-СЕКРЕТ\n\nЦЕНТРАЛЬНЕ РОЗВІДНИКОВЕ УПРАВЛІННЯ | ДИРЕКТОРАТ РОЗВІДКИ\nТема: Кілька агентів скомпрометовано\n\nПісля нещодавнього оголошення воєнного стану Сукарно та повної націоналізації японських активів по всій країні, ми з сумом повідомляємо, що кілька наших інформаторів, а також один оператор, були скомпрометовані через поточний хаос, що призвело до їх арешту місцевими силами безпеки. Однак, на наше здивування, вони звернулися до нас з пропозицією.\n\nОдин Зулкіфлі Лубіс, директор Індонезійського розвідувального директорату, запропонував, що в обмін на ширшу підтримку повстанських груп у регіоні Суматра наші агенти будуть звільнені з полону. Це справжнє везіння для нас — мати союзника в такій високій посаді в уряді, і ми вжили відповідних заходів, щоб скористатися цією золотою можливістю.\n\nОднак слід зазначити в записах, що удача далека від дієвої політики для нашої професії."
USA_INS.104.a: "Говорити про щасливий випадок!"

USA_INS.105.t: "Блудний Повстанець"
USA_INS.105.desc: "КЛАСИФІКАЦІЯ: ТОП-СЕКРЕТ\n\nЦЕНТРАЛЬНЕ РОЗВІДНИКОВЕ УПРАВЛІННЯ | ДИРЕКТОРАТ РОЗВІДКИ\nТема: Звіт про ситуацію в Індонезії\n\nПоширений хаос після недавнього введення воєнного стану та націоналізації великих японських корпоративних активів призвів до зростання непопулярності режиму Сукарно, з протестами навіть серед його власних рядів у відповідь на цей жорсткий зміщення політики. Серед них є єдина політична фігура, яка залишається шанованою серед індонезійського населення: віце-президент Мохаммад Хатта.\n\nЗа даними розвідки, Хатта висловив сильну опозицію до нещодавно впроваджених політик Сукарно, а також відзначено, що він став значно більш віддаленим від свого революційного друга, ніж був раніше. Завдяки своєму бездоганному становищу в очах громадськості, ми вважаємо, що ми нарешті знайшли фігуру для початку повстання.\n\nАгентство радить спробувати звернутися до віце-президента Хатти, безпосередньо, якщо це можливо, але ймовірніше за все через повстанські групи на Суматрі або Сулавесі. Завдяки його громадському становищу, він стане фігурою, яка очолить самостійний рух, здатний протистояти Сукарно."
USA_INS.105.a: "Зробіть це."

USA_INS.106.t: "Лінії Життя для Революції"
USA_INS.106.desc: "КЛАСИФІКАЦІЯ: ТОП-СЕКРЕТ\n\nЦЕНТРАЛЬНЕ РОЗВІДНИКОВЕ УПРАВЛІННЯ | ДИРЕКТОРАТ РОЗВІДКИ\nТема: Постійні поставки зброї до повстанських сил\n\nНаші оперативники в Спеціальному підрозділі діяльності, разом з оперативниками Австралійської служби секретної розвідки, відновили поставки зброї до повстанських груп Перместа, що знаходяться на півночі Сулавесі через Арафурське море, а також до повстанських сил на заході Суматри через Шрі-Ланку. За допомогою посередників нам вдалося уникнути виявлення індонезійськими патрульними кораблями, а також уникнути недавно надісланих флотів Імператорського японського флоту.\n\nПопри обережність, ми відзначили, що кілька партій зброї не дісталися до своєї цілі у встановлений термін і пропали. Ми не сумніваємося, що деякі з цих поставок могли бути перехоплені під час їх переходу невідомими третіми сторонами, але ми вважаємо, що такі втрати мають незначну важливість порівняно з бездоганною операційною безпекою.\n\nМи продовжимо вести звіти про ситуацію."
USA_INS.106.a: "Краще бути в безпеці, ніж шкодувати."

USA_INS.200.t: "Тримання на гальмах"
USA_INS.200.desc: "У холодній кімнаті десь у величезних залах Державного департаменту стоїть великий стіл, вкритий картами, малюнками та роздруківками. Оточуючи цей стіл, стоять чоловіки в темних костюмах, зібравшись уважно слухати, і по всій кімнаті їх обличчя серйозні, а розум повністю зосереджений на завданні. Сміт — керівник департаменту міжнародної безпеки — був попереду, виглядаючи найбільш серйозно і готовий розпочати ранкову нараду.\n\n"Дякую, що прийшли сьогодні. Я вірю, що всі ви бачили недавні заяви уряду Австралії, що закликають до масштабного втручання", — почав Сміт. "Це на перших сторінках кожної газети в цій країні".\n\n"Я хочу скористатися можливістю, щоб уточнити офіційну позицію нашого департаменту. Хоча ми цінуємо їхній ентузіазм, ми не будемо рекомендувати пряме втручання в Індонезії."\n\nПо кімнаті прокотилися шерехи: деякі з кам'яних обличчях показали тривожні ознаки. Чи не буде Америка нерішучою в часи великої потреби?\n\n"Не сумнівайтеся: ми так само віддані війні, як і австралійці. Ця позиція може змінитися в майбутньому. Але ми розуміємо, що ескалація війни так швидко несе занадто великі ризики, щоб їх можна було витримати. Щоб сказати прямо, ми ризикуємо війною з Японією". Це здалося заспокоїти кімнату, і Сміт продовжив.\n\n"Це не означає, що ми не будемо ескалувати конфлікт - ми будемо, але поступово. Сподіваюся, ви добре зможете пояснити це австралійцям", — майже закінчив Сміт, і чоловіки були готові йти. Перш ніж вони пішли до своїх завдань, Сміт виголосив останнє послання."
USA_INS.200.a: "Пам'ятайте: повільно та виважено перемагає гонку."

USA_INS.201.t: "Продовжуйте йти"
USA_INS.201.desc: ""Привіт і доброго ранку. Можу поговорити з полковником Джоупом Варуовом? Це агент Томпсон - я з ЦРУ."\n\nТривалий час не було жодної відповіді, навіть після того, як Томпсон чекав, що виглядало як кілька хвилин, і він замислювався, чи не помилився він з номером. Однак це завдання було достатньо важливим, щоб почекати.\n\nЯкщо Америка повинна була перемогти в Індонезії, їй потрібні були зв'язки, а в Північному Сулавесі не було нікого більш про-ОФН, ніж полковник Варуов. Тому він продовжував терпляче чекати, чуючи шурхіт стільців і приглушені розмови на фоні.\n\nРаптом в лінії з'явився голос молодого чоловіка: він говорив чіткою, злегка акцентованою англійською. "Це перекладач полковника. Хто ви?"\n\nТомпсон був здивований, але швидко зібрався. "А, так, дякую. Я агент Томпсон. ЦРУ. Ми відстежуємо ситуацію у вашій країні вже деякий час: вся Америка вражена відвагою та силою вашого руху.\n\n"Я хочу повідомити, що ми вас повністю підтримуємо. Ми будемо надсилати вам постачання повітрям і підводними човнами: ви повинні отримати їх незабаром. Це має допомогти вам утримати позиції проти режиму Сухарто. Якщо вам знадобиться щось, просто зателефонуйте за цим номером, і ми подивимось, що можемо зробити для вас."\n\nБуло ще одне затримання, перед тим як молодий чоловік знову заговорив. "Полковник дуже вдячний вам за вашу щедру допомогу. Ми обіцяємо, що ваша допомога не буде марною. Давайте залишатися на зв'язку."\n\nВони трохи поспілкувались після цього, обмінюючись люб'язностями, перш ніж розірвати зв'язок. І коли агент Томпсон ішов назад додому в пізню ніч, він відчував величезне задоволення від виконаної роботи."
USA_INS.201.a: "Ми зробили свою частину, подумав він. Тепер все залежить від них."

USA_INS.202.t: "Ми не йдемо"
USA_INS.202.desc: "Це було досить скромне відкриття, насправді. Лише кілька офіцерів, не більше п’ятдесяти, зібралися в тіні на пластикових стільцях, готові до початку заходу. Цей відносно скромний захід — на маленькому полі на Суматрі — приховував важливість того, що ось-ось повинно було статися. Це була урочиста відкриття першої гілки MACI-SOG, Спеціальної операційної групи Командування військової допомоги Індонезії.\n\nГенерал вийшов на сцену, постукав мікрофон і почав виступати з підготовлених зауважень. "Дякую всім за прихід сьогодні. Для мене велика честь відкрити це прекрасне командування.\n\nОсновна мета MACI-SOG - навчати відважних вільних індонезійських солдатів, щоб вони могли виграти цю війну. Ми подбаємо про те, щоб вільні індонезійці отримали найкраще навчання, яке вони можуть отримати: отже, ми будемо навчати їх безпосередньо."\n\nВін на хвилину замовк. "Наша друга мета — організувати наші сили. Це командування несе відповідальність за те, щоб наше втручання було ефективним."\n\n"Це командування — потужний знак. Воно показує нашим союзникам — і нашим ворогам — рішуче і повне зобов'язання Америки у війні. Насправді, щоб продемонструвати це зобов'язання", — сказав генерал, вказуючи на натовп. "Це відділення не буде нашим єдиним. Незабаром буде відкрито ще два відділення: одне на Сулавесі, а інше на Західній Папуа."\n\nЦя фраза викликала ввічливі аплодисменти. Посміхаючись, він продовжив з фінальними словами."
USA_INS.202.a: "Америка не йде. Ви можете бути в цьому впевнені."

#Japan Events


JAP_ICW.1.t: "Індонезія в полум'ї"
JAP_ICW.1.desc: "Офіс прем'єр-міністра був охоплений какофонією, коли помічники та офіцери увійшли і вийшли з просторого офісу безперервним потоком. Дехто приносив новини з посольства в Джакарті, описуючи спорадичні стрілянини на вулицях і політичний хаос. Інші приносили доповіді з японських баз на архіпелазі, де охоронці нервово тримали зброю, спрямовану на зону між ними.\n\nПрем'єр-міністр [JAP.GetLeader] стримував позиви до нудоти при думці про Сукарно. Проголошення ним воєнного стану — і націоналізація японських активів — були ножем у спину, крім наслідків після Ясуди, і ті, у кого була коротка пам'ять, ледь стримувалися від радісних емоцій через невдачу Сукарно. Ті, хто був обачнішим, вже закликали до обережності — чи є зараз час витрачати багатства на ще одну іноземну авантюру?\n\nТі, хто мав довгу пам'ять — або мав доступ до військових і зовнішньополітичних звітів — ставилися до ситуації значно серйозніше. Стратегі виступали проти будь-якої радості від невдач Сукарно, і генеральний штаб злилися на доповіді про те, як японські війська були викликані для боротьби в деяких з міст Суматри, критикуючи прем'єр-міністра за те, що японська кров може бути пролитою без наслідків.\n\nІ тут ще й американці — і австралійці. Вони давно мали свої інтереси в Індонезії, і вони, ймовірно, не дозволять цій кризі пройти даремно. Або, ще гірше, що гарантія, що цей хаос не є частиною їхніх великих планів, щоб поставити Японію на коліна?"
JAP_ICW.1.a: "Починається ще одна криза."

JAP_ICW.2.t: "Порядок в Індонезії"
JAP_ICW.2.desc: ""За заявами уряду Індонезії, держава тепер повністю контролює всі частини індонезійського архіпелагу. Хоча операції з ліквідації непокори можуть тривати деякий час, участь японських підрозділів у фронтових бойових діях більше не є необхідною."\n\nНезважаючи на клінічний характер доповіді армійського генерала, зібраний кабінет прем'єр-міністра [JAP.GetLeader] був у гарному настрої, відчуваючи полегшення та радість. Дехто смакував перспективу дуже потрібної перемоги над американцями в японській сфері впливу; інші були вдячні за те, що японські солдати повернуться додому живими під оплески, замість того, щоб зникнути в крематоріях серед ридань родин.\n\n"Я впевнений, що індонезійський посол прийде подякувати нам за нашу допомогу особисто," сказав прем'єр-міністр [JAP.GetLeader]. "І якщо вони не зроблять це цього тижня, нагадайте їм."\n\n"Звичайно," відповів міністр закордонних справ. "Сукарно скоро не забуде, що ми для нього зробили.""
JAP_ICW.2.a: "Лояльність куплена кров'ю."

JAP_ICW.3.t: "Стратегічний перерозподіл"
JAP_ICW.3.desc: ""Прес-секретар уряду не прийняв жодних запитань після оголошення про те, що військові сили будуть стратегічно перерозподілені назад на японські військові бази в Індонезії, незважаючи на докази того, що до Джакарти наближаються повстанці. Посольство Японії, яке вже працювало на мінімальному складі, було евакуйоване - "\n\nПомічник прем'єр-міністра [JAP.GetLeader] поспішно вимкнув телевізор, побачивши, як вираз прем'єр-міністра став усе більш похмурим. Незалежно від того, що говорила пропаганда — а її вже майже не було, після того, як Джакарта впала — це була тонка фарба, що покривала очевидну реальність: Японія втратила Індонезію.\n\nВже почали прибувати кораблі до Японії з багатими та розореними індонезійцями — співпрацівниками, які тікали від 'милосердя', яке повстанці, без сумніву, готували для них. Декілька повідомлень від представників Мохаммада Хатти лежали на столі прем'єр-міністра, чекаючи на офіційне визнання Японією реальності, що ера Сукарно закінчилася.\n\nІ хоч Хатта обіцяв залишатися на добрих умовах з Японією, що гіркота війни завжди була питанням внутрішньої політики Індонезії і не порушить її місце в Сфері, неможливо було не помітити тінь американців і австралійців над кожним кроком Хатти.\n\nЛише дурень міг би повірити, що нічого не зміниться — з тієї простої причини, що в Холодній війні "перерозподіл" означав "поразку"."
JAP_ICW.3.a: "Рана, що кровоточить."

JAP_ICW.4.t: "Будь ласка, тримайте лінію"
JAP_ICW.4.desc: ""Чи є які-небудь новини з посольства про новини від нового президента? Що значить — нічого - "\n\n"Скажіть нашим людям утримати вогонь. Так, повернутись на свої передові бази. Прямі накази президента. Поки ситуація в Джакарті не стабілізується, ми не можемо - "\n\n"У нас немає людей у столиці, щоб захистити японських експатів, де вони знаходяться. Розішліть повідомлення, щоб всі вирушили на територію посольства або залишалися на місці, якщо -"\n\nПрем'єр-міністр [JAP.GetLeader] відчував, що його голова ось-ось лусне від величезної кількості звітів і новин, що надходили з Джакарти, потік інформації, що загрожував перевантажити його почуття. Він не міг точно відрізнити чутки від фактів — і не міг цього зробити й більшість звітів.\n\nЄдине, що було очевидним, поза всією плутаниною та насильством, яке охоплювало Джакарту, це факт, що Сукарно більше не мав контролю. Один Зулкіфлі Лубіс — полковник, колишній повстанець — з'явився в Джакарті і... був проголошений президентом? Ніхто не міг точно пояснити, як повстанець — навіть такої важливої постаті, як Лубіс — міг стати президентом за кілька днів.\n\nІ навіть коли вони намагалися зрозуміти, як вони опинилися так далеко від подій, прем'єр-міністр відчував порожнечу в животі від того, що буде далі. "Президент" Лубіс вже відвів японські війська назад до їхніх баз, поки політична ситуація не стабілізується — але [JAP.GetLeader] не чув про те, щоб війська ОФН були виведені з Індонезії."
JAP_ICW.4.a: "Все більше ставши спостерігачем, а не актором."

JAP_ICW.5.t: "Будь ласка, тримайте лінію"
JAP_ICW.5.desc: ""Чи є які-небудь новини з посольства про новини щодо Сухарто? Що значить — він не бере наші дзвінки - "\n\n"Розумію ваше розчарування, але це накази нового президента. Так, тримайте свої позиції, поки не буде вказівок інакше. Не вступайте в насильницькі зіткнення — ми розуміємо, що повстанці мертві, це щось інше - - "\n\n"Небезпечно бути на вулиці в столиці. Будь-яким японським експатам потрібно залишатись на місці або вирушати на територію посольства. Показ доказів японського громадянства може допомогти, але краще бути в безпеці —"\n\nПрем'єр-міністр [JAP.GetLeader] відчував, що його голова ось-ось лусне від величезної кількості звітів і новин, що надходили з Джакарти, потік інформації, що загрожував перевантажити його почуття. Він не міг точно відрізнити чутки від фактів — і не міг цього зробити й більшість звітів.\n\nЄдине, що було очевидним, поза всією плутаниною та насильством, яке охоплювало Джакарту, це факт, що Сукарно більше не мав контролю. Сухарто — полковник, колишній станційований в Джогджакарті — з'явився в Джакарті і... був проголошений президентом? Ніхто не міг точно пояснити, як полковник міг стати президентом за кілька днів.\n\nІ навіть попри те, що Сухарто був відомою фігурою в Токіо — він, принаймні, пообіцяв продовжити співпрацю з японськими радниками в Індонезії — погроми, що супроводжували його підйом до влади, турбували всіх. Сухарто заявив, що Індонезія стикається з екзистенційною загрозою з боку лівих радикалів — але таким чином, що в Індонезії може не залишитись нічого, коли пил осіде."
JAP_ICW.5.a: "Хоча б він наш пес в цій битві?"

JAP_ICW.6.t: "Щотижневий список"
JAP_ICW.6.desc: ""...а тепер, будь ласка, перейдіть до матеріалів, наданих Генеральними Штабами Армії та ВМС. Також надані додатки від Міністерства фінансів та Міністерства закордонних справ."\n\nПрем'єр-міністр [JAP.GetLeader] майже чув, як зібраний кабінет пригнічує стогін, почувши ці слова, які безперервно повторювались на кожному щотижневому засіданні кабінету. Те, що почалося як поверхнева перевірка особового складу, зброї та фінансування, наданих уряду Сукарно, перетворилося на безперервний список втрат, зниклого обладнання та невиконаних запитів бюджету.\n\n"Конфлікт в Індонезії триває, незважаючи на найкращі зусилля уряду Сукарно та наших власних радників. Те, що колись було спорадичним насильством, переросло в постійні бойові дії на кількох лініях зіткнення - "\n\nПрем'єр-міністр [JAP.GetLeader] зрозумів, що ця війна не буде швидкою. Яка війна була швидкою на момент її початку? Недооцінювати рішучість ворога — це була страшна помилка, яку зробили його попередники, через яку майже втратили все.\n\n"...втрати лікуються як на берегових об'єктах, так і на спеціально створеному госпітальному кораблі ВМС Японії, щоб лікувати важкі випадки до реабілітації на рідних островах. Оцінки довгострокового догляду за інвалідами та пенсій для тих, хто втратив близьких, також надані - "\n\nА що сказав би [JAP.GetLeader] тим, хто втратив близьких, якби не повідомити їм, що Індонезія в безпеці в японських руках? Громадяни Імперії, можливо, назавжди залишаться вірними Імператору, як і він сам — але вони не були вірні йому, і інші лідери фракцій в YSK добре це знали."
JAP_ICW.6.a: "Деескалація була просто неможливою."

JAP_ICW.7.t: "Миті до опівночі"
JAP_ICW.7.desc: ""Вашингтон вимагає, щоб було вжито заходів щодо загибелі американців в Індонезії від рук японських військових." Посол США в Японії був розлючений, його різкий тон вимагав відповідей, на які прем'єр-міністр [JAP.GetLeader] не мав настрою відповідати.\n\n"Смерть ваших співвітчизників — трагедія, але не секрет, що Індонезія є зоною бойових дій. Наші війська перебувають в Індонезії за запрошенням уряду Індонезії; я раджу вашим громадянам покинути країну, якщо вони не хочуть потрапити під вогонь."\n\nДва чоловіки стояли один перед одним мовчки, буря звинувачень і докорів крутилась між ними. Що ще можна було сказати? Присутність японських військ в Індонезії була відкритим секретом — так само як і присутність американських та австралійських військ.\n\nІ все ж ні один, ні інший не могли визнати очевидну правду, яку це ставить на порядок денний — що в джунглях, містах і небі Індонезії американські та японські війська ведуть прямі бої, вбиваючи одне одного у війні, яку жоден уряд не міг офіційно визнати, боячись розпочати апокаліпсис.\n\n"Вважайте це офіційним протестом від мого уряду до вашого." Посол встав, відмахуючись від руки помічника, який намагався провести його до дверей. "І це буде не останній протест."\n\n"Ваші скарги зафіксовані, пане Посол," сказав прем'єр-міністр [JAP.GetLeader]. "З нетерпінням чекаю вашого наступного візиту.""
JAP_ICW.7.a: "Ще одна брехня на горі інших."

JAP_ICW.8.t: "Наш диктатор перемагає"
JAP_ICW.8.desc: "Перемога в Індонезії.\n\nЯк довго чекав [JAP.GetLeader], щоб прочитати ці слова в ранкових газетах? Роки, принаймні — занадто довго для його вподобань, адже новина не принесла йому радості, якої він очікував. Було лише полегшення, що це закінчилося.\n\nВійськові надали свої оцінки, коли війська могли бути виведені з Індонезії, тепер, коли генерал - президент - Сухарто встановив контроль над країною. Вони згадали, що Сухарто вже попросив кілька радників залишитись для контролю над операціями з ліквідації — прохання, яке, навіть якщо воно йде всупереч політичним настроям вдома, буде задоволено.\n\nАдже, зрештою, краще тримати під оком людину, яка вже зрадила їхнього господаря один раз.\n\nВсе, що Японії потрібно — це щоб Сухарто тримав австралійців і американців на відстані, лікуючи свої рани через море Арафури. І якщо він зможе це виконати, тоді [JAP.GetLeader] зможе з цим змиритися — не зважаючи на те, скільки тіл Сухарто кинув у піч на цьому шляху."
JAP_ICW.8.a: "Краще диявол, якого ти знаєш."

JAP_ICW.9.t: "Мир без честі"
JAP_ICW.9.desc: ""ПОВСТАНЦІ ПЕРЕМАГАЮТЬ В ІНДОНЕЗІЇ; Сукарно ТІКАЄ З КРАЇНИ"\n\n"Шокуючі сцени з Джакарти сьогодні, коли повстанці входять в центр міста з мінімальним опором. Японським громадянам радять залишатися вдома -"\n\n"Наші вірні солдати були залучені у напружені протистояння з повстанцями, які захопили Індонезію. Навіть перед лицем неймовірних труднощів вони залишаються непохитними на своїх постах, чекаючи наказів Генерального штабу -"\n\nПрем'єр-міністр [JAP.GetLeader] вимкнув телевізор, опускаючись у одне з крісел перед своїм столом. Він був радий, що вранці в кімнаті не було нікого іншого — він зміг би пережити шок від поразки в Індонезії на самоті.\n\nВін побоювався майбутнього засідання кабінету — звинувачення від офіцерів Армії та ВМС за те, що вони дозволили Індонезії, цьому життєво важливому бастіону Спільної процвітаючої сфери проти Австралії, випасти з рук Токіо. Дієта була б у піднесеному стані, хоча б для того, щоб використати його невдачі в своїх цілях.\n\nА народ? Ну, навіть якщо він міг би стверджувати, що не відправив жодного з них померти в іншій війні за кордоном, це означало, що більше голосів готові осудити його за те, що він пожертвував честю Імперії."
JAP_ICW.9.a: "Всі критики, чи не так?"

JAP_ICW.10.t: "Вимагаючи задоволення"
JAP_ICW.10.desc: ""Президент Сукарно оголосив про перемогу над повстанцями в Індонезії сьогодні, оспівуючи стійкість індонезійської армії та народу в боротьбі за визволення -"\n\n"Настрій в Джакарті - це радість і полегшення - і виклик. Де Сукарно залишається беззаперечним лідером нації, зірка Японії згасла в порівнянні -"\n\n"Прем'єр-міністр надіслав офіційне телеграму уряду Індонезії, приписуючи перемогу Індонезії їх непереможному духу та рокам підготовки під японським керівництвом -"\n\nПрем'єр-міністр [JAP.GetLeader] вимкнув телевізор, знову сівши за свій стіл з кислою мімікою. Було важко не помітити критику в заголовках, якою б святковою вона не була, що відбирала будь-яку радість, яку можна було б отримати від перемоги Індонезії.\n\nГенерали та адмірали, без сумніву, запитали б його - з повагою, звісно - чи не могло б результат бути досягнуто швидше за підтримки Японії. Політики привітали б Сукарно з його важкою перемогою, в той час як шепотіли б про його імпотентність і невизначеність.\n\nА Сукарно, звісно, не був би таким ввічливим. Він би — приватно, надіємось — звинуватив Японію в тому, що вона була другом лише на гарну погоду, зацікавленим у своїй вигоді понад усе. Його подальша вірність не буде дешевою.\n\nІ хто, власне, міг би його звинуватити?"
JAP_ICW.10.a: "Навіть у перемозі є ціна."

JAP_ICW.11.t: "Їхній диктатор перемагає"
JAP_ICW.11.desc: "Поразка.\n\nПрем'єр-міністр [JAP.GetLeader] ледве зміг змусити себе прочитати ранкові газети, всі з яких несли це обурливе слово на перших сторінках. Мільйони єн, тисячі життів і роки зусиль, все змарновано в індонезійських джунглях.\n\nНе було нічого, що можна було б врятувати з цієї ситуації. Новий уряд Індонезії видав накази про обмеження присутності залишкових японських військ у їхніх базах, навіть коли американським дипломатам було надано доступ до нового президента. Зулкіфлі Лубіс дав зрозуміти, що він не має потреби в японцях, приєднавшись до повстанців, і не було причин сподіватися на зміну його позиції як президента.\n\n"Собака Вашингтона" у цій боротьбі, можна сказати, перемогла.\n\nВсе, що залишалось Японії, це спостерігати з боку, лизати свої рани, поки австралійці та американці претендували на південні ворота ширшої Сфери.\n\nАле для родин загиблих у війні все, що мало значення, це єдине слово, яке буде мучити їх так само, як і втрата їхніх близьких:"
JAP_ICW.11.a: "Поразка."

JAP_ICW.12.t: "Цар попелу"
JAP_ICW.12.desc: "Вдруге за пам'ятю [JAP.GetLeader] Індонезія отримала нового господаря.\n\nДе панував хаос і плутанина після відставки Сукарно на користь нечистої угоди між Зулкіфлі Лубісом і Сухарто, офіс Прем'єр-міністра зараз поглинений втомленим прийняттям — усвідомленням того, що події в Індонезії вийшли далеко за межі чийогось контролю.\n\nЧи міг хтось очікувати, що осередки опору узурпаторам фактично досягнуть успіху у своїй безрозсудній кампанії опору? Ні — але, з іншого боку, ніхто не чекав, що Лубіс і Сухарто перевернуть хід конфлікту. Можливо, з миром більше не буде несподіванок.\n\nАле не буде й нагород. Новий уряд в Джакарті не запропонував нічого більше, ніж найосновнішу кореспонденцію з Японією — і з США, якщо вірити розвідці з Вашингтона. З країною в руїнах новий лідер Індонезії витрачатиме роки просто на те, щоб зібрати Індонезію до купи — і вони зробили дуже чітко зрозумілим своє неприязне ставлення до іноземного втручання.\n\nПрем'єр-міністр [JAP.GetLeader] щипав свій ніс. Руйнування Індонезії означало, що вона більше не зможе виконувати свою роль південного бастіону Сфери впродовж багатьох років — не кажучи вже про те, щоб повернутися до статусу ресурсо-центру, яким вона була до війни. Єдине холодне втішення — це те, що американці знайдуть своє прийняття в Індонезії рівно таким же неприязним."
JAP_ICW.12.a: "Коли б'ються слони, трава потерпає."

JAP_ICW.100.t: "План Джуанди"
JAP_ICW.100.desc: "Прем'єр-міністр [JAP.GetLeader] ігнорував конкретну стопку документів на своєму столі протягом всього місяця, поки Міністр закордонних справ не попросив його дати відповідь до кінця тижня.\n\nПрем'єр-міністр зітхнув — йому потрібно було підписати запит від індонезійців, крім бюджетних запитів? — але якщо це треба було зробити, він це зробить. Якось. Він повернувся до титульної сторінки документа, на якій був герб Республіки Індонезія — потім перегорнув підсумки, що додавались до кожного розділу документа.\n\nВитрати на інфраструктуру. Промисловий розвиток. Підвищення кваліфікації робочої сили. Пропозиція від Прем'єр-міністра Джуанди відповідала всім важливим вимогам щодо розвитку Індонезії.\n\nЗгідно з індонезійським дизайном, зазначив [JAP.GetLeader]. Повний намір поступово ліквідувати систему ромуша, яку заїбату стали використовувати, і розвивати ресурси Індонезії на власний розсуд, викличе певне невдоволення в бізнесовому світі, що має відголоски в Дієті та YSK.\n\nІ, звісно, це не буде дешевим. Навіть якщо обіцяні повернення від ресурсів і виробництва в Індонезії зможуть зацікавити заїбату підписати капітальну участь, кількість грошей, яку вони повинні будуть витратити на початку, змусить їх звернутися до уряду за якимось гарантіями — за частину гри."
JAP_ICW.100.a: "Уряд поведе Японію, Inc. в Індонезію"
JAP_ICW.100.b: "Нехай ця пропозиція помре в комітеті."

JAP_ICW.101.t: "ЗВІТ IN-92-N"
JAP_ICW.101.desc: "ІМПЕРІАЛЬНИЙ ЯПОНСЬКИЙ ФЛОТ\nXXXXX ДЕТАЧМЕНТ, РАБАУЛ\n\nУВАГА: Генеральний штаб ІЯФ\n\nТЕМА: Перехоплення контрабанди в Індонезії\n\n1. Морські патрулі в прибережних водах навколо віддалених островів Індонезії повідомляють про зростання кількості перехоплень контрабандистів, перевищуючи здатність місцевих індонезійських сил обробляти їх.\n\n2. Більшість контрабандистів повідомляють про депресивні економічні умови на віддалених островах Індонезії як основну причину, що змусила їх звернутися до кримінальної діяльності, головним чином, для контрабанди 'копри' - сушеного кокосового м'яса - на інші острови.\n\n3. Однак кілька патрулів ІЯФ повідомили про збройні інциденти, коли контрабандисти відкривали вогонь або намагалися потопити свої судна у відповідь на перевірки. Подальші абордажні дії підтвердили наявність вибухових речовин та вогнепальної зброї американського або австралійського походження.\n\n4. Контрабанда озброєнь ОФН на архіпелазі Індонезії — це явно тривожний розвиток подій у контексті політичної нестабільності в Індонезії та погано свідчить про контроль індонезійських сил безпеки над морською діяльністю.\n\n5. Терміново запитуються додаткові ресурси до Рабаулу для виконання обов'язків морської перехоплюючої служби."
JAP_ICW.101.a: "Примітно."

JAP_ICW.102.t: "Напалм з Індонезії"
JAP_ICW.102.desc: "ІМПЕРІАЛЬНА ЯПОНСЬКА АРМІЯ\nШОНАН-МАРАЙ ГУНСЕЙБУ, ШОНАН-ТО\n\nУВАГА: Генеральний штаб ІЯА\nТема: Офшорне розміщення авіаційних сил\n\n1. Продовження бойових дій в районі під контролем Гунсейбу загрожує аеродромам на Малакійському півострові, якщо місцеві гіюгун і парамілітарні сили не зможуть забезпечити достатню охорону тилів.\n\n2. Аеродроми на самій Шонан-то можуть прийняти авіаційні сили в разі загальної евакуації, але з суттєвим перевантаженням; кількість вильотів буде меншою за оптимальну для ефективної оборони позицій.\n\n3. Аеродроми під контролем Імперіальної японської армії та індонезійських військ на Суматрі ідеально розташовані для використання як другорядні місця для розміщення — як для збільшення кількості вильотів у звичайних умовах, так і для резервних позицій, якщо це стане необхідним. (Див. додаток.)\n\n4. Однак загальний занедбаний стан і відсутність необхідних умов на вказаних аеродромах вимагає термінового ремонту та розширення для їх повного запуску. Оцінка витрат та людських ресурсів додається.\n\n5. Запит на дозвіл виділення бюджетних коштів та розподілення робочої сили Ромуші для початку відновлювальних робіт на вказаних військових об'єктах."
JAP_ICW.102.a: "Дозволити розширення."
JAP_ICW.102.b: "Вони будуть змушені обійтися тим, що мають."

JAP_ICW.103.t: "Списання"
JAP_ICW.103.desc: "\"Індонезійці зробили що?\"\n\nРевний вигук прем'єр-міністра [JAP.GetLeader] можна було почути з коридору поза його кабінетом, що налякало кількох помічників, що проходили поруч.\n\n"Сукарно оголосив про воєнний стан, пане прем'єр-міністре." Міністр закордонних справ нервово потягнув за своє краватку. "Запроваджені комендантські години без дійсних документів - "\n\n"Не воєнний стан!" [JAP.GetLeader] виплюнув, перегорнувши бюлетень Міністерства закордонних справ і зупинившись на відповідному тексті. "Націоналізація японських активів. Чи отримав міністерство будь-яке попередження про це?"\n\n"Ні зовсім," сказав міністр, намагаючись виправдати свою позицію перед прем'єр-міністром. "Ми зараз зв'язуємося з посольством для підтвердження деталей -"\n\n"Вони краще це зроблять! У мене зустріч з керівниками Міцубісі та Міцсуї цього післяобіду, і якщо до того часу я не матиму відповіді, то ми з вами на лінії в завтрашніх ранкових газетах." \n\nМіністр закордонних справ швидко кивнув. "А що щодо військових? Вони, напевно, будуть натискати, щоб 'переконати' Сукарно переглянути своє рішення - "\n\n"Чим? Як би добре не були навчені наші військові, індонезійська армія набагато більша за нашу - і, незважаючи на всі поділи серед них, наші дії проти Сукарно об'єднають їх проти нас." Прем'єр-міністр вдарив долонею по столу, щоб підкреслити свою точку. "Знайдіть будь-які дипломатичні шляхи, які ми можемо використати проти Сукарно, поки ситуація не стане абсолютно незворотною.""
JAP_ICW.103.a: "Це обурливий поворот подій."

JAP_ICW.104.t: "Шляхи до примирення"
JAP_ICW.104.desc: "О 15 хвилин після години прем'єр-міністр [JAP.GetLeader] мляво підняв очі від своїх документів, щоб покликати свого секретаря. "Скажіть індонезійському послу, що я готовий прийняти його." \n\nПісля того, як посла ввели до кабінету прем'єр-міністра, він стояв на увазі ще хвилину. Якщо посол і проявив будь-які ознаки роздратування через те, що його тримали в очікуванні, то він був достатньо розумним, щоб цього не показувати.\n\n"Що я можу для вас зробити, пане посол?" [JAP.GetLeader] зробив вигляд, що постукує своєю ручкою по столу, щоб повністю підкреслити індонезійському посланцю ступінь того, наскільки він втручався в терпіння Японії.\n\n"Попри рішення нашого президента націоналізувати промисловість на користь Індонезійської революції, ми хочемо запевнити Імперію Японії, що ми продовжуємо залишатися відданими справі паназійської солідарності," сказав посол, витираючи піт зі свого лоба. "Але якщо Індонезія має служити південним бастіоном проти імперіалістів в Австралії, нам потрібно переглянути наші угоди щодо оборонної співпраці, особливо коли наша внутрішня ситуація така напружена, що вимагає введення воєнного стану."\n\n"Оборонна співпраця" — це коротка форма для прохання про японську військову допомогу, без жодної пропозиції повернути націоналізовані активи. Але, так чи інакше, якщо ситуація в Індонезії після оголошення воєнного стану — та невдалої спроби перевороту проти Сукарно — справді така складна, то Індонезії не можна дозволити виглядати слабо перед ОФН."
JAP_ICW.104.a: ""Я подбаю про те, щоб наші збройні сили зв'язалися з вами.""
JAP_ICW.104.b: ""Мені шкода, але тут нема про що говорити. Добрий день.""

JAP_ICW.105.t: "ЗВІТ IN-115-N"
JAP_ICW.105.desc: "ІМПЕРІАЛЬНИЙ ЯПОНСЬКИЙ ФЛОТ\nXXXXX ДЕТАЧМЕНТ, РАБАУЛ\n\nУВАГА: Генеральний штаб ІЯФ\n\nТЕМА: Поставки зброї ОФН на Суматрі / Сулавеїсі\n\n1. Відновлення повного обсягу морських патрулів після виділення коштів на 1964 рік вказує на значне погіршення безпеки на морі навколо Індонезії.\n\n2. Повідомлення про затримання контрабанди зброї ОФН на півночі Сулавеїсі (ймовірно, з Австралії) та на заході Суматри (ймовірно, з Індії). Затримання значно перевищують попередні і вказують на систематичні зусилля з доставки зброї ОФН до Індонезії, ймовірно, у зв'язку з недавнім оголошенням воєнного стану.\n\n3. Військово-морські сили Республіки Індонезія або не здатні, або не бажають здійснювати контроль над морськими кордонами. Відсутність помітного зниження кількості індонезійських військових сил дає змогу розвідці припустити останнє - що є тривожним свідченням розподілу в лавах союзницької армії.\n\n4. Результати 3 підтверджуються контактами в індонезійському військовому середовищі, що свідчать про загострення фракційних розбіжностей у армії після введення воєнного стану. Тривожні питання щодо лояльності військ, розташованих на Суматрі, хоча Військово-морський флот залишається під контролем вірних Сукарно.\n\n5. ТЕРМІНОВО запитуються додаткові ресурси для перехоплення підозрілих вантажів."
JAP_ICW.105.a: "Дозволено, конфіскуйте стільки, скільки зможете!"

JAP_ICW.200.t: "Зустріч з покинутою людиною"
JAP_ICW.200.desc: "Вулиці Джакарти були туманно спокійними, оточеними боязким відчуттям страху, коли японський кортеж їхав повз численні контрольно-пропускні пункти на шляху до президентського палацу. Навіть із офіційною японською делегацією на вулицях солдати не ризикували, ретельно перевіряючи кожен документ і перевіряючи кожен автомобіль на наявність вибухівки.\n\nСукарно ніколи не був щедрий на довіру, але це? Кавашима Сьодзіро міг тільки припустити, що його друг став значно більш параноїдальним з того часу, як вони останній раз спілкувалися, коли Джуанда все ще був прем'єр-міністром.\n\n"Ти здаєшся спокійнішим, ніж солдати зовні." Кавашима з полегшенням побачив, як Сукарно занурюється в карти, записуючи замітки та накази, додаючи їх до все зростаючої купи.\n\n"Занадто пізно бігати за тінями, Кавашима," зітхнув Сукарно, розтираючи важкі мішки під очима. "Тепер мені треба прибирати ту купу бруду, що залишилася. Навіть якщо це виглядає, як відрізати власну руку."\n\n"Я співчуваю," сказав Кавашима, намагаючись знайти належну глибину емоцій перед болем Сукарно. "Дай мені список всього, що тобі потрібно, і я впевнюся, що це потрапить на найвищі рівні в Токіо.""
JAP_ICW.200.a: ""Все," сказав Сукарно, його погляд затвердів."

JAP_ICW.201.t: "Охорона периметра"
JAP_ICW.201.desc: "Молодший сержант Нісідіма боровся з тим, щоб не заснути, стоячи на варті в окопах, дивлячись у чорну ніч поза базою Імперіальної армії поблизу Палембанга.\n\nПерші дні були надзвичайно тихими. Оголошення повстання «вільного індонезійського уряду» по всій Суматрі було сприйняте з повною плутаниною, принаймні, поки не почали лунати вибухи з сусіднього міста. Нісідіма та його взвод отримали повне бойове спорядження і були наказані копати окопи за колючим дротом, що оточував установку, а потім - чекати. Наказів атакувати або надійного нападу повстанців не було, принаймні, на початку.\n\nПовстанці спробували півсили атакувати через тиждень після початку війни. Розсіяний вогонь змусив японських вартових бігти до своїх окопів, в той час як випадкова ракета підірвала одну з вартових башт на осколки. Нісідіма та його товариші відповідали більш дисципліновано, притискаючи повстанців, поки один із танків гарнізону не зруйнував їх укриття, змусивши їх відступити.\n\nЦе було два тижні тому, і поки що немає ознак того, коли відбудеться наступна ротація. Час від часу тріск нагадував йому про наслідки неуважності - іноді за ним слідував крик нещасного солдата, якого знімав снайпер повстанців. Тепер жодні офіцери не підходили, щоб розбудити його, тому якщо Нісідіма не хоче знайти собі порізане горло, йому доведеться самим робити важку роботу, щоб не заснути.\n\nВідпочинку сьогодні не буде - і завтра, і через день. Тільки за умови, що накази залишаться такими, як є - без дозволу на наступ, щоб забезпечити трохи вільного простору - ніхто на передовій установці не отримає жодного відпочинку."
JAP_ICW.201.a: "Вічна вартова служба триває."

JAP_ICW.202.t: "Мир на морі"
JAP_ICW.202.desc: "... і за допомогою наших шановних паназійських партнерів, Імперіального японського флоту, ми забезпечимо, що узбережжя Індонезії буде безпечним для всього законного товарообігу - і що повстанці не знайдуть підтримки від своїх закордонних покровителів."\n\nІндонезійський урядовий чиновник закінчив читати свій текст перед розсіяним аплодисментами, зійшовши з поспіхом зведеної трибуни перед фрегатом ІЯФ, пришвартованим на індонезійській морській базі на Яві. Людей було мало - лише маленька, ретельно відібрана група фотожурналістів, що робила знімки для великої ілюзії, що значно відрізнялася від поспішного характеру заходу.\n\nТакож вони ретельно уникали показувати будь-які фотографії Імперіальних японських армійських охоронців, розташованих по всьому порту, забезпечуючи охорону кожної частини події, яка офіційно належала індонезійському уряду. Довіра до індонезійського уряду була ще однією частиною цієї ілюзії.\n\nКапітан ІЯФ віддав честь японському послу, який вислухав накази для експедиційної групи, стоячи на увазі. Вся справа з початку до кінця була заздалегідь репетованою та спланованою подією - велика контрастність до неспокійних хвиль та небес навколо індонезійського архіпелагу, в якій ІЯФ незабаром кинеться вперед, шукаючи американських і австралійських порушників."
JAP_ICW.202.a: "Мир також був ілюзією."

#Криза в Арафурійському морі

TT_ICW_Arafura.1.t: "Затримано"
TT_ICW_Arafura.1.desc: ""Що робити?" запитав радист, поглянувши на капітана, очікуючи підтвердження. Він не отримав відповіді, оскільки капітан сидів із порожнім поглядом на містку, спостерігаючи за індонезійським судном, яке наближалося до їхнього корабля. "Вони повторюють своє прохання, сер." \n\n"Чорт, так, дозвольте їм піднятися," забармотів австралійський капітан, покриваючись холодним потом. "І скажіть екіпажу, щоб усе було належним чином приховано." Радист кивнув і почав передавати накази. Екіпаж метнувся вниз та на палубу, щоб забезпечити вантаж і зайняти свої позиції, якщо виникне насильство. На борту іншого судна, що було кораблем Індонезії, капітан також мав свої переговори зі своєю командою.\n\n"Ці австралійці справді думали, що їм вдасться провести цей номер, піднімаючи індійський прапор," сказав він своєму радисту, незабаром після того, як завершив зв'язок з "індійцями". "Ну, ви знаєте, що робити." Були віддані нові накази, і досить швидко мала індонезійська група десантників була на палубі австралійського судна. Австралійці були без зброї, що значно спростило завдання індонезійців. Як зграя скоординованих мисливців, вони розподілилися по судну, тоді як двоє залишилися, щоб тримати полонених під контролем.\n\nСеред них був виконавчий офіцер, який обшарював палуби з рештою своїх людей. "Сер! Ми знайшли це!" оголосив він.\n\n"Що саме?" запитав капітан Індонезії, хоча він і так знав відповідь, і прямував до кімнати, звідки пролунало це повідомлення. Незабаром він опинився на кухні, де один з його людей відсунув морозильну камеру і відкрив вільну панель у стіні. Він помахав виконавчому офіцеру, і той схилився, щоб оглянути відкритий ящик. Вони витягли його зі стіни і відчинили. Там були вогнепальні зброї - зброя ОФН. Офіцер поплескав свого солдата по плечу, "Скажіть хлопцям забрати екіпаж в полон.""
TT_ICW_Arafura.1.a: ""Чекаємо наказів з Джакарти.""

TT_ICW_Arafura.2.t: "Питання ескалації"
TT_ICW_Arafura.2.desc: "Ситуація вибухнула, як скажений бик, без будь-якої тонкої обробки та з такою швидкістю.\n\nАвстралійське-індійське контрабандне судно і індонезійський патрульний корабель перетворилися на те, що можна було б назвати битвою двох флотів, що дивляться один на одного. Індонезійський прикордонник став занадто недбалим і не помітив, як радіооператор вислизнув, щоб надіслати сигнал лиха. Австралійський флот відповів за наказом від агресивних адміралів, і Індонезія не мала вибору, як відповісти, і потроху води ставали все більш переповненими, а ті, хто їх борознив, все більш войовничими. Пальці були на спускових гачках, і конфлікт був лише за кілька секунд. Як і в кожній битві, всі боялися, але були готові її почати.\n\nОсь таке повідомлення лежало на столі [JAP.GetLeader]. Він дивився на нього вже півгодини, переглядаючи варіанти, і його голова вже боліла. Індонезія була в їхній сфері, і дозволити їй впоратися самій означало б втратити країну для ОФН, що стало б величезним ударом по японській гегемонії. Очевидно, відповідь полягала в тому, щоб втрутитися і змусити Австралію відступити. Однак це могло призвести до того, що Японія також потрапить в конфлікт, тому відповідь полягала в тому, щоб дозволити індонезійцям самостійно вирішити цю проблему. Цей цикл суперечностей тривав, поки його не змусив діяти голос.\n\n"Які ваші накази, сер?" запитав офіційний представник, якого [JAP.GetLeader] вже забув, що він навіть був там. Він подивився вниз на звіт і мав спокусу підкинути монету. Замість цього він подивився вгору і відповів,"
TT_ICW_Arafura.2.a: ""Зв'яжіться з австралійцями і вимагайте, щоб вони відступили.""
TT_ICW_Arafura.2.b: ""Ми не можемо ризикувати занадто втручатися; нехай індонезійці вирішать це.""

TT_ICW_Arafura.3.t: "Туманне море, блакитні води"
TT_ICW_Arafura.3.desc: "Чутки швидко поширилися серед моряків австралійських та індонезійських кораблів, що брали участь у новозаснованому протистоянні в Арафурійському морі. В обговореннях серед офіцерів на містках та серед чуток на палубах активно обговорювалася тема японського ультиматуму. Для моряків це була заблудла тема, туманна як води під ними. Основна суть була зрозуміла: відступити або зіткнутися з наслідками. Поширювались чутки про повну японську військову інтервенцію, навіть зі зброєю.\n\nОфіцери мали значно кращу уяву про те, що могло статися, або, точніше, що могло б статися. Японці нарешті висунули австралійцям ультиматум - дозволити індонезійцям конфіскувати судно та вантаж, після чого екіпаж буде звільнений, і не буде жодних проблем. Відтоді вони чекали, балансуючи на межі катастрофи. Адже все, що вони могли робити - це чекати. Кожен дзвінок та радіосигнал супроводжувався очікуванням, оскільки будь-який з них міг бути рішенням уряду щодо ультиматуму.\n\nСам віце-адмірал Австралії був, мабуть, найбільш обізнаний про ситуацію. Щоранку він прокидався, очікуючи повідомлення, і щоночі засинав, чекаючи пробудження до пострілів. Та ось одного дня на містку він дивився на море. Воно здавалося таким спокійним. Йому було все одно, чи розійдуться кораблі або вибухнуть. Воно залишиться таким блакитним, яким було завжди. Його роздуми були перервані дзвінком телефону, і він підняв слухавку тремтячою рукою."
TT_ICW_Arafura.3.a: ""Віце-адмірале, уряд ухвалив своє рішення.""
TT_ICW_Arafura.3.b: ""Віце-адмірале, уряд ухвалив своє рішення.""

TT_ICW_Arafura.4.t: "Майже зіткнення"
TT_ICW_Arafura.4.desc: ""'Безпечний прохід', ви отримали дозвіл на вихід. Дякуємо за вашу співпрацю," – пролунало через радіо на судні контрабандистів. Капітан та весь екіпаж відчули полегшення і задали курс додому. Після кількох днів, коли індонезійські морські піхотинці досліджували їхнє судно, поки вони сиділи в темному карцері, і ще кількох після того, як їх випустили після того, як уряд нарешті досяг угоди про відступ, запах морського повітря став приємним сигналом про їхнє повернення в безпеку. Останні кілька днів пройшли в підготовці судна до виходу з вод Індонезії, працюючи обережно з властями і повільно повертаючись до самого краю моря під супроводом індонезійських кораблів.\n\nЦе відчувалося, як кінець ери для інших австралійських та індонезійських суден, коли вони розійшлися, хоч і неповноцінно. Тягар невідворотного конфлікту був знятий, але жодна зі сторін не досягла особливих досягнень. Індонезійські офіцери картали себе за те, що не змогли привести австралійців до правосуддя, за те, що дозволили японцям прийняти рішення за них і показали слабкість перед обличчям небезпеки. Австралійські офіцери були раді вибратися з небезпеки, але їхні плани були зірвані через поєднання некомпетентності та сприйнятої боягузливості.\n\nКоли флоти повернулися додому, нова ситуація все ще не була надто відмінною. ОФН та Індонезія все ще пильно спостерігали один за одним, готові натискати на спусковий гачок, тільки тепер на більшій відстані."
TT_ICW_Arafura.4.a: "Деякі дисиденти будуть сумувати за своїми поставками зброї..."

TT_ICW_Arafura.5.t: "Ваша справа, сер"
TT_ICW_Arafura.5.desc: ""Сер, австралійці чітко висловили свою позицію," сказав один із радників у переповненому кабінеті прем'єр-міністра. "Поки вони продовжують наполягати на тому, що це просто вантаж для Канади, ми не зможемо змусити їх змінити свою думку." \n\n"Я не вірю в це ані на йоту," вставив інший радник. "Чому вони тоді підняли чужий прапор і ховали зброю в стінах, якщо все це було чесно?" \n\n"Я теж в це не вірю," визнав [JAP.GetLeader], "але чи можемо ми ризикувати тиснути на це питання? Я маю на увазі, що наш найкращий сценарій – це вони просто продовжують відмовляти нам, а найгірший сценарій..." \n\n"Немислиме," завершив перший радник. "Я згоден." \n\n"Не будьте такими песимістами. Я думаю, якщо ми покажемо силу, ми зможемо змусити їх відступити. Я маю на увазі, що ця зброя не буде останньою поставкою для повстанців, і, ймовірно, вона не була і першою. Якщо ми дозволимо цьому пройти, це означатиме дозволити пройти й іншим поставкам, і це лише ускладнить ситуацію в майбутньому, чи не так?" – заперечив другий радник. \n\n"Отже, ви хочете ескалувати ситуацію? Ми можемо опинитися у війні!" \n\n"Шанси, що війна в Індонезії все одно відбудеться, і якщо ми будемо продовжувати пропускати зброю, шанси, що ми програємо, зростають." \n\n"Добре, добре, досить суперечок," перебив [JAP.GetLeader]. "Я вважаю, що нам краще..."
TT_ICW_Arafura.5.a: ""Дозвольте їм йти. Ми не можемо ризикувати ескалацією.""
TT_ICW_Arafura.5.b: ""Повторіть ультиматум, подивимося, чи не зможемо ми змусити їх до співпраці.""
TT_ICW_Arafura.5.c: ""Відправимо флот, покажемо, що ми не жартуємо.""

TT_ICW_Arafura.6.t: "Безпечний прохід"
TT_ICW_Arafura.6.desc: ""'Безпечний прохід', ви отримали дозвіл на відхід. Уряди Індонезії та Японії висловлюють свої щирі вибачення," – пролунало через радіо на австралійському судні, яке останні кілька днів балансувало між двома долями: захопленням чи свободою. На щастя, для них, прийшло друге. Офіційний запис відзначить, що зброя, як визнали японці, була легітимним вантажем, призначеним для Канади. Більшість людей з обох боків знали, що це нонсенс, але вони також не були зацікавлені в міжнародному інциденті. Або ж, більше інцидентів.\n\nОбидва флоти поступово розійшлися з переповнених вод, і піт стирався з лобів всюди. Незабаром австралійське судно знову опинилося наодинці, його екіпаж дякував Богу і продовжував шлях блакитними водами. Як і очікувалося, вони не прямували до Канади. Індонезійські повстанці були вдячні і, до того ж, здивовані, коли зброя прибула. Це було диво для них, як і для екіпажу Safe Passage та австралійського уряду.\n\nЗвісно, індонезійці не були зовсім щасливі, оскільки флоти повернулися додому з нічим, окрім знання того, що повстанці лише зміцнюватимуться. Той факт, що їхня доля була визначена японцями, а не ними самими, також викликав невдоволення. Проте ніхто не був убитий, і це було достатньо для багатьох моряків і морських піхотинців на відповідних кораблях."
TT_ICW_Arafura.6.a: "А тим часом зброя була розвантажена в іншому місці..."

TT_ICW_Arafura.7.t: "Живе включення новин Domei"
TT_ICW_Arafura.7.desc: "Репортерка очистила горло та відкинула волосся, яке постійно закривало її обличчя через агресивні морські вітри. Оператор подав знак, і вона почала: "Це Уено Хана, репортаж наживо з KRI Gadjah Mada, після його повернення з нещодавнього конфлікту з австралійським флотом, що тепер називають Інцидентом у морі Арафура," – позаду неї був палуба згаданого корабля, досить чиста, за винятком ряду кульових отворів на стіні. "Сьогодні ми маємо змогу взяти інтерв'ю у капітана судна для повного звіту."\n\nКамера слідувала за нею через палуби, поки вони не дісталися до кабінету капітана. Він був несподівано молодим офіцером, хоча, якби камера була вищої якості, можна було б побачити важкі темні кола під його очима. "Доброго вечора, капітане. Ми маємо кілька запитань до вас, якщо це нормально," сказала Хана, сідаючи. Капітан посміхнувся і погодився, хоча його очі залишалися мертвими. "Давайте почнемо з короткого підсумку подій останніх кількох тижнів, гаразд?"\n\n"Звісно. Кілька тижнів тому наше судно виявило контрабанду на австралійському кораблі, і їм було надано ультиматум покинути наші води. Вони відмовилися, і виникла суперечка та непорозуміння, що призвели до короткої перестрілки. Загинули люди з обох боків," – підсумував він.\n\n"Це справжня трагедія. Як ви ставитеся до заяви Організації Свободних Націй та Спільноти Процвітання, що інцидент був просто незначною сутичкою між двома суверенними націями, яка не загрожує світовому миру?"\n\nКапітан затримав погляд. Образ помираючого моряка з відстріленою щелепою, який намагався кричати на допомогу, але не міг вимовити жодного слова, залишався в його пам'яті з того часу. Він стиснув зуби і намагався посміхнутися, "Так. Хоча це була трагедія, втрати були мінімальними, і це слід сприймати лише як урок деескалації.""
TT_ICW_Arafura.7.a: "Антикліматичний, хоча й неприємний, кінець."

TT_ICW_Arafura.8.t: "Мир, куплений за ціною"
TT_ICW_Arafura.8.desc: "Нарешті австралійське судно 'Safe Passage' змогло покинути небезпечні води, відступаючи в тіні японських кораблів, які прибули на допомогу індонезійцям. Після довгих днів, коли вони дивилися в стволи величезного флоту, готового їх знищити за найменшою провокацією, екіпажу було майже дивно відчувати себе в безпеці. Звісно, вони покидали води, ставши на кілька сотень фунтів легшими, з усією конфіскованою зброєю, але все одно це відчувалося як перемога для тих, чиї життя були під загрозою.\n\nЦе була зовсім інша історія для тих, чії життя на той момент не були під загрозою. Газети по всій Австралії називали інцидент трагедією, заявляючи, що якби уряд мав хоч трохи розуму, він би не дозволив японцям на них тиснути. Летіли звинувачення в боягузтві та некомпетентності. В офісах та бюро чиновники сперечалися, чи варто було здобути удачу для повстанців, яких вони не дуже приховано підтримували, чи варто було взагалі відступати, коли японський флот міг бути лише "паперовим тигром".\n\nДля Японії все було, наче нічого не сталося, частково тому, що вони точно знали, що не є паперовими тиграми. Вони приїхали готовими до бою, і не було необхідності воювати. Ситуація не змінилася. Єдині різниці — це гіркота австралійців і їхня неспроможність підтримати повстанців, яких вони так явно підтримували. Світ продовжує обертатися, і вода в морі Арафура залишається спокійною і блакитною."
TT_ICW_Arafura.8.a: "А хтось чекав на зброю, яка ніколи не прийде."

TT_ICW_Arafura.9.t: "Швидко чекайте"
TT_ICW_Arafura.9.desc: ""Ну, японці не допомагають," – зітхнув віце-адмірал індонезійського флоту в морі Арафура, коли він поклав трубку, поглянувши на кілька офіцерів на його мосту. Він завжди був досить балакучим командиром, тому його мовчазне визнання того, що він тільки що закінчив розмову, було неспокійним для всіх присутніх.\n\n"Тепер нас віддадуть на поталу?" – запитав його заступник.\n\n"Схоже на те. Здається, що ми отримаємо накази з Джакарти."\n\n"Хех, бюрократи зараз напевно метушаться," сказав XO з сухим гумором.\n\n"Уявляю. Я вже дещо бачив, і є два варіанти розвитку подій," – відповів віце-адмірал, з характерною для нього багатослівністю поклавши руки на поручні і поглянувши на ворожу групу австралійських суден, що чекали. "Жоден з них не особливо хороший. Або вони спробують кумедно позувати та поставлять наші життя під загрозу, або вони дозволять австралійцям піти, і ми виглядатимемо слабкими."\n\nXO намагався не інформувати свого начальника, що він вже сказав очевидне. Замість цього він сказав: "Ну, інших варіантів майже немає."\n\n"Я добре розумію, це не означає, що я не можу поскаржитись. Я просто бажаю, щоб ми мали право висловити свою думку замість якихось адміралів на кріслі, які не знають, що роблять."\n\n"Згоден, сер. Чи є якісь накази на цей час?"\n\nВіце-адмірал на мить задумався: "Проводьте більше навчань. Якщо це загостриться, я хочу, щоб ми перемогли. А поки що, чекайте.""
TT_ICW_Arafura.9.a: "Чекайте на нові інструкції, як було наказано."
TT_ICW_Arafura.9.b: "Що таке одна жива стрілянина?"

#Криза Аллена Поупа

TT_ICW_AP.1.t: "Втеча"
TT_ICW_AP.1.desc: "Це був гарний політ. Рано вранці його Douglas A-26 пішов на низький захід, скидаючи свою бойову навантаження на індонезійський патрульний катер. Коли супроводжуючий ескортний корабель відкрив вогонь, він повернувся і обстріляв палубу з кулеметів. Кров стікала й капала через кулеві отвори, яскраво контрастуючи з металевим сірим кольором. Це була успішна вилазка. Invader був солодким, смертоносним апаратом.\n\nАле на зворотному шляху його стрілець повідомив, що на хвості у них ворог, швидкий. Чорт, – пробурмотів він. Як ці сволоти дістали один з тих? Стрілець невидимо знизав плечима, перш ніж авіаційні гармати вистрілили, задаючи ритм катастрофи.\n\n"Повернись на свою позицію," – прошипів він. Він знову пішов низько, на величезну зелено-синю поверхню внизу. Кулі та боєприпаси рвали фюзеляж, кулемети приєднувалися до гуркоту авіаційних гармат у хорі вибухів. За ним пролунав крик по всьому літаку. Потім тиша. Він чув тільки два двигуни, які шипіли, ніби вони тікали. Він відчував, як тепло піднімається в кабіні, піт заливав його комбінезон. Ледь чутні потріскування вогню.\n\nЧерез секунду, як за сигналом, знову почали стріляти авіаційні гармати. Вони вирвали ліве крило літака, і він почав падати, вниз, вниз до безкраїх блакитних вод. Сонце було золотим диском, що висів серед піднімаючих хвиль. Чорт забирай. Він застібнув парашут і стрибнув. Коли земля наближалася, він розкрив парашут і завис у повітрі, чекаючи, коли термінальна швидкість виконає свою справу. Він націлився на галявину поруч з пляжем внизу, але промахнувся на кілька ярдів.\n\nДо того, як він досягнув землі, пальмові дерева зачепили підвісні мотузки парашута, залишивши його на кілька футів над землею. Коли він розрізав мотузки, він приземлився з тріском на праву ногу. Він застерігся. Він спробував встати, коли відчув себе краще, і впав на обличчя. Він сів, глибоко вдихнувши. Його руки опустилися до кобури. Порожньо.\n\nКоли вони прийшли за ним, вони запитали його ім'я. Він плюнув. Що вам до цього? – сказав він, дивлячись. Зробіть це. Кінець вже."
TT_ICW_AP.1.a: "Він отримав швидкий удар по скроні."

TT_ICW_AP.2.t: "Вердикт"
TT_ICW_AP.2.desc: "Його перенесли на носилках до місцевої в'язниці, руки закуто в кайдани вище торсу. Там військовий лікар оглянув його зламану ногу і наклав на неї шину. Без гіпсу. Йому дали милицю, перш ніж повели до камери. Коли двері залізли на місце, він оглянув своє оточення. Відро, дерев'яне ліжко, яке складалося в стіну, і маленьке забране вікно на задній стіні. Ланцюги дзенькали, коли він поклав свою постіль. Він сів на неї і зітхнув, дивлячись у вузьке синє небо.\n\nВін відмовився говорити своє ім'я. Хоча це було вже неважливо. Його собачі мітки говорили за нього, коли його рот не міг. Атмосфера в військовій в'язниці була похмурою та ворожою. Він здогадався, що між дебатами в їхніх кімнатах для допитів, емоції виражалися жестами, що супроводжувалися переривчастою, агресивною англійською мовою. Через тиждень допити припинилися.\n\nОдного ранку, керівник в'язниці і його охоронці увійшли в його кімнату. Він став на увагу, спершись на милицю. Вперше він побачив їх в доброму настрої. "Містер Аллен Поуп," – сказав начальник в'язниці, посміхаючись, – "ви йдете на суд."\n\nЙому надали юридичного консультанта і перекладача. Після тижня свідчень, його привели до судді. За три спекотних дні вони оголосять його вердикт. Він стояв, пітнів у білій бавовняній сорочці, яку йому дали, коли суддя проголосив дивною мовою цього місця вирок, який він має відсидіти. "Вибачте," – сказав перекладач, подивившись йому в очі, перш ніж відійти, наче соромлячись. "Цей суд вважає вас винним у злочинах проти індонезійського народу..."
TT_ICW_AP.2.a: "...і тому вважає за необхідне засудити вас до смертної кари через повішення."

TT_ICW_AP.3.t: "Зв'язок"
TT_ICW_AP.3.desc: "Ранок, Вашингтон. День тільки починався в японському посольстві. Працівники та персонал проходили через вхід. Молодші дипломати сідали в свої офіси, секретарі інформували їх про плани на день. Коли Такеучі Рюджі, посол Японії в Сполучених Штатах, сів за свій стіл, він знайшов на ньому запечатану меморандум від Домашніх островів.\n\nВідкриваючи печатку, він розірвав конверт. Повідомлення від Прем'єр-міністра. Американський пілот Аллен Поуп був збитий під час бомбардувальних місій над Індонезією. Індонезійці були розлючені, але уряд відчуває можливість. Його завдання: передати ці факти Сполученим Штатам і вимагати від них поступок. Переконати їх припинити постачати зброю повстанцям в сільській місцевості.\n\nТакеучі відкинувся в крісло. Йому доведеться подумати. Беручи телефон, він набрав номер Державного секретаря США. "Привіт," – сказав він у слухавку, намагаючись створити дружелюбний тон. "Це японське посольство в Сполучених Штатах. У нас є інформація, яка може вас зацікавити..."
TT_ICW_AP.3.a: "А тепер чекаємо."

TT_ICW_AP.4.t: "Меморандум IN-AP1"
TT_ICW_AP.4.desc: "ВІД: Такеучі Рюджі, Посол Японії в Сполучених Штатах\nДО: [Root.GetLeader], Прем'єр-міністр Японії\n\nЩодо питання, яке ми обговорювали раніше, схоже, що американці не реагують на жодні запропоновані умови. Уряд відмовився від будь-якої угоди про викуп, окрім найменших сум, і пропонує лише неофіційну вибачення за всю цю справу. Натомість вони вимагали негайного звільнення Поупа та попередження: якщо з ним щось станеться під час утримання, США вважатимуть Японію частково відповідальною за його смерть.\n\nДостатньо сказати, що ми лише втратимо обличчя, якщо погодимося на їхню угоду. Тиша витисне їх: вони не можуть ризикувати американським громадянином, якому загрожує страта. Якщо уряд бажає, я зроблю все можливе, щоб в цьому моменті натискати на них, поки не буде досягнуто угоди, що буде вигідною для імперських інтересів. Я довіряю нашому уряду, що зробить правильний вибір у цьому питанні.\n\nПідписано, Такеучі Рюджі."
TT_ICW_AP.4.a: "Випустіть Поупа."
TT_ICW_AP.4.b: "Чекайте."

TT_ICW_AP.5.t: "За горизонтом"
TT_ICW_AP.5.desc: "Вони провели його до причалу, на транспортний човен. Перед тим, як він ступив на борт, вони відкрили його наручники. Йому хотілося сміятися їм у вічі. Усі ці години в пекельній жарі, а тепер вони його відпускають. У яскравому полуденному світлі їхні обличчя були попелястими на фоні моря та неба. Пальмові дерева прощалися з ним зеленими, розсипними пальцями, що хвилювались на вітрі. Він зітхнув з полегшенням, коли човен набрав швидкість, і побачив, як ці люди зникають у відстані.\n\nАллен Поуп? – привітав його командир судна. Сподіваюся, вони не сильно тебе там побили. Капітан посміхнувся, поглядаючи на його ногу, яку тримав гіпсовий лангет.\n\nЧортів сини майже мене вбили. Навіть не знав, що у них є Ki-200 в повітрі. Він потягнувся. Лінії застрягли в пальмах, коли я стрибав. Поламав свої чортові ноги, коли їх відрізав.\n\nВони не будуть раді. – пробурмотів капітан.\n\nЧорт, що вони можуть зробити?\n\nКапітан замовк. І він теж. Вони спостерігали, як острів зникає в тонку зелену лінію, перш ніж впасти за кривизну землі."
TT_ICW_AP.5.a: "Деескалація, але за яку ціну?"

TT_ICW_AP.6.t: "Меморандум IN-AP2"
TT_ICW_AP.6.desc: "ВІД: Такеучі Рюджі, Посол Японії в Сполучених Штатах\nДО: [Root.GetLeader], Прем'єр-міністр Японії\n\nЯк і очікувалося, з менш ніж тижнем до страти Поупа, американці нарешті піддалися під тиском. Тепер вони пропонують деескалацію своєї підтримки повстанським елементам у Республіці Індонезія, а також значну суму викупу, яка піде до казни Республіки. Також буде випущено офіційне вибачення. В обмін вони надішлють літак до Джакарти, щоб забрати Поупа.\n\nЦі поступки є важливими і корисними. Сукарно буде потребувати кожної допомоги. Кабінет може прийняти угоду такою, яка є, або вимагати більше. Проте слід остерігатися, що американці мають свої межі. Я вірю в уряд, що зробить наймудріше рішення в цьому питанні.\n\nПідписано, Такеучі Рюджі."
TT_ICW_AP.6.a: "Прийняти угоду, вивезти його звідти."
TT_ICW_AP.6.b: "Відмовитися від угоди, змусити їх зробити більше."

TT_ICW_AP.7.t: "Повернення в небо"
TT_ICW_AP.7.desc: "Вони були люб'язні дати йому дві сигарети та ковток кави. Після сніданку в'язничний наглядач торкнувся його плеча. Пішли. Запізнимося. Він кивнув. Охоронці провели його до машини, зношеного японського автомобіля якогось виду. Потім вони поїхали під хмарним небом, дрібний дощ капав на вулиці, які вони проїжджали. Вгору, вгору. До військової авіабази. Він сидів на задньому сидінні та слухав розмови охоронців, поки розмова не стихла. Ледь чутні гуркіт грому за вікнами.\n\nЛітак уже приземлився, коли вони приїхали. Grumman C-1 Trader, авіаносний літак для доставки. Він стримав бажання посвистати від побаченого. Вони підтягують всі важелі, тільки для нього. Вчора, серед криків і гомону солдатів, він чув, що його уряд вибачився за його вчинки там. Він пирхнув. Немає потреби. Він був щасливим вбивцею, якщо так можна сказати.\n\nВін і пілот увійшли до літака. Коли двигуни набрали обертів і вони почали підніматися, він побачив, як ці солдати махають йому з вікон порту. Смішний жест.\n\nЩо там внизу? – запитав пілот через гул двигунів.\n\nЯк нічого, чого я коли-небудь знав, – пробурмотів він."
TT_ICW_AP.7.a: "Дружнє рішення, якого тільки можна було б досягти."

TT_ICW_AP.8.t: "З неба, на землю"
TT_ICW_AP.8.desc: "Це було питання просто поставити одну ногу перед іншою. Позаду нього йшли солдати, чиї відполіровані гвинтівки і лакові, набряклі шкірою тіла викликали у нього гнів. Окрім цього, він, напевно, мав би сказати, що це був гарний день для того, щоб померти. Небо було чистим, стійкі купи хмар пливли вітром. Журналісти, з камерами, підвішеними на ремінцях, потрясли руку з наглядачем.\n\nВони затягнули петлю навколо його шиї. "Останні слова?" - сказав наглядач.\n\nВін похитав головою. Ні. Вони зачитали його вирок. Саботаж проти Республіки. Підтримка сепаратизму, вбивство через необережність. Священик помолився за його душу. Амінь. Він кивнув, хоча не розумів. Наглядач кивнув своєму кату, і платформа під ним розійшлася, супроводжуючись клацанням камер.\n\nВін майже не чинив опору. Їх забрали його і поховали без ознак на могилі, під гілками та папороттю."
TT_ICW_AP.8.a: "Не було іншого виходу."

TT_ICW_AP.9.t: "Сповідь"
TT_ICW_AP.9.desc: ""Отже, цей Аллен Поуп потрапив в Індонезію. Розумію терміновість, пане директоре, але я не бачу, чому це так терміново. Ви, мабуть, можете залучити своїх друзів з ФРІ, щоб забрати його і провести до безпеки?" - Президент [USA.GetLeader] виглядав не враженим. Тримати напругу під контролем уже було досить стресовим, чому його повинні інформувати про таку дрібницю?\n\nВиснажений і нетерплячий, директор ЦРУ відповів на погляд Президента з очікуванням. "Ну, справа не тільки в цьому. Згідно з інформацією, японці вже знайшли і засудили його до смерті. Якщо його страчують, преса розірве вас на шматки. Не кажучи вже про те, як це посилить напруженість на місці."\n\nРаптом намір директора став зрозумілішим. Нахилившись вперед у своєму кріслі, Президент підняв брову, запитуючи: "Отже, що ми можемо зробити?"\n\nУсмішка з'явилася на обличчі директора, нарешті відчувши завершення формальностей останніх годин. "Я можу підготувати операцію порятунку через кілька днів. Активи ФРІ вже поінформовані про ситуацію і готові провести атаку. Все, що мені потрібно, це трохи більше розвідданих і кілька ресурсів. О, і ваше дозволення, звісно."\n\nПрезидент поглянув на свій стіл, обмірковуючи слова директора. Поуп служив їх країні, і така відданість не повинна бути забута — але все ж ризик відправити ще більше лояльних людей на милість індонезійцям... Врешті-решт, Президент поглянув на директора суворим поглядом і дав свою остаточну відповідь."
TT_ICW_AP.9.a: "Дійте."

TT_ICW_AP.10.t: "Плани втечі"
TT_ICW_AP.10.desc: ""Вибачте мене, директоре, але мої знання про Індонезію не є справжньою науковою дисципліною. Так що ж це за в'язниця в Джогджакарті, про яку ви говорите?" - запитав Президент [USA.GetLeader], нахиляючись через свій стіл.\n\n"Ну, це не Алькатрас, але це все ж не звичайна окружна в'язниця. Вона розташована на околицях міста, оточена полями з усіх боків. Має охорону, яка озброєна і завжди на сторожі 24 години на добу, з бетонними стінами та камерами. Є тільки два входи до закладу, обидва охороняються турелями з кулеметами на вартових вежах."\n\nПрезидент відкинувся назад, обмірковуючи інформацію. "Добре, а що можна зробити? Я припускаю, що ви не описали б таку фортецю, якби у вас не було плану."\n\nЗ усмішкою директор ЦРУ розповів Президенту свої плани з усім захопленням, яке дозволяв його суворий офіс. "Ну, найпростіше було б залишити це на місцеву групу ФРІ. Вони знають місцевість та в'язницю краще за нас, хоча чи достатньо у них матеріальних можливостей — це інше питання. Альтернативно, ми можемо відправити спеціальний загін із ФРІ, хоча це буде дорого і створить нам більше проблем, якщо нас спіймають."\n\nДивлячись на нього в роздумах, Президент залишив директора на момент мовчання. Скільки коштує життя однієї людини, подумав Президент. Чи варто це кількох додаткових американських життів, чи лише кількох індонезійських? Директор, здається, довіряв ФРІ, мабуть, вони вистачать. Хоча кілька додаткових людей не зашкодять. З важким зітханням він розкрив рота і дав директору свою відповідь."
TT_ICW_AP.10.a: "Не варто покладатися на випадок."
TT_ICW_AP.10.b: "ФРІ більше, ніж здатні."

TT_ICW_AP.11.t: "Передчасне детонування"
TT_ICW_AP.11.desc: "З додатковою паличкою Аллен Поуп вирізав риску на підлозі своєї камери. Ще три дні до страти, думав він. Всі свої попередні рази він був обережним, але одного разу став трохи самовпевненим і в результаті отримав смертний вирок. Життя справді несправедливе, підтвердив він для себе.\n\nЙого думки були перервані звуком вибуху, коли земля здригнулася. Обережно підходячи до вікна своєї камери, він подивився на метушню. Зовні він міг розрізнити розкидані постріли між групою ФРІ і деякими охоронцями в'язниці. Серце Поупа почало тріпотіти. Він знав, що його не забудуть, він повертається додому!\n\nАле ця оптимістичність швидко згасла. З часом він спостерігав, як світло від пострілів зникає одне за одним, поки не був відданий наказ про відступ, і його рятівники зникли. Так швидко, як піднялася його надія, так швидко впало його серце. Ні, він у біді, подумав він собі. Як дурно було вірити, що життя дасть йому шанс.\n\n- - -\n\nТим часом у Білому домі Президент сидів в своєму кабінеті, коли секретар держави раптово проголосив новину про невдалу атаку. Це було неприємно і вимагало розмови з директором ЦРУ, але зробити нічого було неможливо. Це стало до того моменту, як він почув наступні слова секретаря.\n\n"Японці зробили пропозицію звільнити Поупа в обмін на компенсацію за тих, хто був убитий під час нашої невдалої спроби порятунку. Ця пропозиція допоможе знизити напругу, хоч і трохи принизливо. Яке ваше рішення?"\n\nПрезидент нахилився назад і подумав кілька секунд. Секретар держави мав рацію щодо її переваг. З іншого боку, Поуп був лише однією людиною, жертви завжди очікувані. Знову нахилившись вперед, Президент дав свою відповідь."
TT_ICW_AP.11.a: "Справедлива угода — це угода, прийміть їхню пропозицію."
TT_ICW_AP.11.b: "Як ми можемо вести переговори з ними через одну людину!"

TT_ICW_AP.12.t: "Підбір і обіцянки"
TT_ICW_AP.12.desc: "Після невдалої спроби порятунку, кінець не був таким, як очікував Аллен Поуп.\n\nІндонезійські охоронці - тепер завжди сумні і постійно озброєні - відчинили його двері камери, кинувши йому чисту сорочку і штани до ніг. Він мав одягнутися і вийти за п’ять хвилин - на що Аллен підняв свої закутості руки. Як він, чорт забирай, мав це зробити?\n\nВони наставили на нього зброю за це, але інший солдат обережно зняв з нього кайдани. Вони тримали зброю націленою на нього, поки він закінчував перевдягання, а потім супроводжували його через увесь комплекс, поки не заштовхали в чекаючу машину на вході до в'язниці.\n\n"Ви їдете додому, містер Поуп", - сказав чоловік поруч із водієм.\n\n"Дякую Богу," - сказав Аллен. "Після перестрілки -"\n\n"І ви залишатиметеся вдома," - перебив його чоловік. "Боже, скільки людей ми втратили, щоб витягнути вас уперше."\n\nАллен переварював новину. "Чия обіцянка? Люди, за яких я працюю -"\n\n"ЦРУ працює на Президента," - сміявся чоловік з присмаком гіркоти. "І коли Президент дає обіцянку - "
TT_ICW_AP.12.a: ""- тільки Президент має право її порушити.""

TT_ICW_AP.13.t: "Наступна глава"
TT_ICW_AP.13.desc: ""...вони це зробили, пане Президенте."\n\nПрезидент [USA.GetLeader] не відповідав кілька секунд, його рука застигла над меморандумом, який він анотуючи. Ці слова були достатніми, щоб відволікти його від миттєвого спокою, який він знайшов у цьому жахливому кошмарі, що охопив Білий дім протягом місяців, і який тепер досяг свого страшного завершення.\n\n"Коли японці сказали 'в будь-який час', вони мали на увазі це, так?" - тихо сказав Президент [USA.GetLeader], більше переконуючи себе, ніж когось іншого.\n\nОвальний офіс був тихий, окрім тикання годинника на стіні. Тепер уже нічого не можна було зробити, щоб врятувати мертвого чоловіка; все, що залишалося, - це те, що буде далі, від обробки розжареної преси до того, якою буде офіційна відповідь Америки щодо Індонезії - і неофіційна по відношенню до Японії.\n\n"Нагадайте директора ЦРУ," - сказав Президент [USA.GetLeader] після довгої паузи. "Нехай підготує все, що ми маємо для Південно-Східної Азії та Індонезії.""
TT_ICW_AP.13.a: ""Якщо японці збираються грати брудно, то й ми будемо.""

TT_ICW_AP.14.t: "Втеча"
TT_ICW_AP.14.desc: "Перший знак того, що щось не так, з’явився, коли вимкнули електрику - за тридцять хвилин до відключення світла в камерах.\n\nЦе було достатньо, щоб охоронці почали хвилюватися, але вони не мали жодного уявлення про те, що ще може бути не так, поки двері до блоку камер не відчинилися. "Забезпечте американця! Вони -"\n\nГолова кричучого охоронця вибухнула, а охоронці зовні камери Аллена Поупа були схожим чином повалені пострілами, які пробивали їх тіла двічі і один раз по голові. Як тільки ув’язнені закричали від виду смерті своїх мучителів, п’ятеро чоловіків обшукали блок камер, зупинившись біля камери Аллена.\n\n"Ми забираємо тебе." Чоловік відчинив двері камери, а потім вистрілив зі зброї в бездиханне тіло охоронця, призначеного для Аллена. "Просто для впевненості. Можеш рухатися?"\n\n"Так, я можу рухатися. Я можу використовувати зброю - "\n\n"Не потрібно. Без образ, але ми не потребуємо більше сюрпризів в цій операції. Тепер - "\n\nСвітло повернулося, за секунду після цього загриміли сирени в’язниці. Аллен кинувся до центру групи спецназу США, поплескавши того, хто говорив, по плечу, щоб дати зрозуміти, що він готовий.\n\n"Будь поруч, і рухайся, коли ми скажемо. Слідуй нашим наказам, поки не дійдемо до - "
TT_ICW_AP.14.a: ""- човна.""
TT_ICW_AP.14.b: ""- літака.""

TT_ICW_AP.15.t: "Робота на дикий"
TT_ICW_AP.15.desc: "Серце Аллена Поупа опустилося, коли він побачив швидкохідний човен, поспіхом пришвартований на пристані, до якої під’їхала група американських чорних операцій. Вони змогли обігнати численні індонезійські патрулі, які по черзі різко зупинялися від майстерно влучених пострілів у водіїв голови, що зробило поїздку для Аллена дуже неприємною.\n\nШвидкохідний човен не обіцяв полегшення, і, як він і очікував, човен розігнався по морю на максимальній швидкості. Вогні на березі потонули вдалині, коли човен мчав у чорну безодню ночі; щоразу, коли човен розгойдувався після того, як подолав хвилю, Аллен ковтав порцію морської спреї, оглухнувши від реву мотора на задньому плані.\n\nНарешті, шум мотора перейшов у низький гул, супроводжуваний сліпучим світлом прожекторів, спрямованих на човен. Він відчув легке ударне поштовх, коли швидкохідний човен підійшов до більшого траулера - на кормі якого майоріла австралійська національна прапор.\n\n"Легко, легко!" - попередив один з американських командос австралійського моряка, поки Поупа піднімали по канатній сходах на більший корабель. "Чоловік дезорієнтований після втечі."\n\n"Ми тебе маємо, містер Поуп." - австралійський моряк, що несе Поупа на спині, поставив його на палубу, а потім повернувся з чашкою чаю. "Ми забираємо тебе додому.""
TT_ICW_AP.15.a: "Смак свободи."

TT_ICW_AP.16.t: "Небесний круїз"
TT_ICW_AP.16.desc: "Серце Аллена Поупа трохи підскочило, коли він побачив безмарковий C-47, що з’явився на горизонті, а технічний персонал проводив останні перевірки повітряного судна. Їм довелося обігнати численні індонезійські патрулі по дорозі - кожен з яких рвучко вивертався на узбіччя через майстерно влучені постріли в голови водіїв - що зробило поїздку для Аллена дуже неприємною.\n\nУ порівнянні з цим, перспектива стабільного круїзу в небі була дуже привабливою.\n\nКоли Аллен піднявся на борт, американські командоси провели остаточну перевірку повітряного судна, а потім сіли самі та жестом вказали пілотові злітати. З ревом поршневих двигунів, алюмінієвий фюзеляж рвонув у небо, ледь очищаючи ліси в кінці злітної смуги на кілька футів.\n\n"Як себе почуваєте, містере Поуп?" Командос, який відчинив двері камери Поупа, сів навпроти, поклавши свою гвинтівку на спартанське сидіння. "Обіцяю, це буде краща поїздка, ніж остання."\n\n"Сподіваюся," - сказав Поуп, масажуючи шию. "Скільки часу до Австралії -"\n\nПоуп не пам'ятав, що сказав солдат далі, оскільки його мозок намагався осмислити заглушений вибух зовні з одночасними розривами та розтягуваннями, що проходили через фюзеляж літака. Літак різко похитнувся вниз, виштовхуючи Поупа з його місця.\n\n"Контролі," - подумав Поуп. Навіть якщо він не був кваліфікованим пілотом для C-47, наскільки складно це може бути -\n\nТоді він побачив, як вся передня частина літака відірвалася від задньої частини, літак розпадаючись з голосним скреготом металу, залишаючи його падати на землю з єдиною думкою:"
TT_ICW_AP.16.a: ""Я повинен був загинути з першого разу.""

