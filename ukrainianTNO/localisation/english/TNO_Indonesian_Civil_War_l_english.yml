POLITICS_ABDUL_MANAF_LUBIS_DESC: "Бути відповідальним за бойові дії глибоко в місці народження PRIM — це далеко не легке завдання, але якщо хтось може з цим впоратися, то це Абдул Манаф Лубіс.\n\nТриматися в надії, що центральний уряд Сукарно зможе відкрити трасу на південь Суматри через ключове місто Палембанг, яке пережило початковий наступ PRIM тільки завдяки японським військовим базам, багато хто в 1-му Регіональному Військовому Командуванні вважає, що вони живуть на позичений час. Як довго, вони запитують, поки не прибуде японська підтримка?\n\nНезважаючи на всі свої військові таланти, Лубіс не знає. І незважаючи на могутність його сил, він добре розуміє, що сокіл не може витримати бурю: таким чином, він може лише зробити все можливе в поганій ситуації і сподіватися, що поставки імператора надійдуть якнайшвидше.\n\nАле коли вони настануть, дні PRIM будуть полічені."

