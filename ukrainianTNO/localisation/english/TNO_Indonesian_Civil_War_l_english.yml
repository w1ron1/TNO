### Заплановані події Дуумвірату

INS_scripted.6.t: "Підйом Дуумвірату"
INS_scripted.6.desc: "це подія-заповнювач, де має бути видно тільки заголовок. ніхто не повинен бачити опис і опцію місця"
INS_scripted.6.a: "якщо ви побачите цю подію, відкрийте нову проблему на баг-трекері"