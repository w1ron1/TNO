POLITICS_SUKARNO_ICW_DESC: "Застрягши в Джакарті, оточений вірними та підлесниками, адже вони всі, хто йому залишився, і з країною, що знаходиться під загрозою війни: така ситуація, без сумніву, не та, яку Сукарно б хотів, але саме це він має. Однак є й один позитив: жорстокий конфлікт, в якому Індонезія опинилася, дозволив Президенту дізнатися, де насправді полягають лояльності його колишніх союзників.\n\nМохамед Хатта, якого він колись вважав другом, виявився нічим більше, ніж маріонеткою різних жадібних до влади генералів. Якими б не були його причини, однак, було занадто пізно повернути назад: цей космополіт-вершник нарешті показав свої справжні кольори, і його останні дні минуть в тюремній камері, і він більше не побачить висот, до яких піднялася нація, яку він зрадив. Щонайменше, це та мантра, яку Президент повторює знову і знову, щоб втихомирити зламані спогади хоча б на деякий час.\n\nОднак, оскільки ситуація виглядає більш серйозною, ніж будь-коли, багато хто, навіть серед найближчих радників Президента, починає сумніватися, чи ще можливе досягнення його широких амбіцій. Дехто вважає, що час покаже, але Сукарно знає, що такі приємності безглузді, адже лише Індонезія визнає свого лідера."
POLITICS_SUKARNO_POSTWAR_DESC: "Невірність була відкинута до сміттєвого ящика історії, і як космополіти, так і військові перебіжчики знайшли своє місце на дні безіменних могил. Війна була вигнана з узбережжя, і екваторіальний смарагд знову сяє. Сукарно переміг, і разом з ним перемогла Індонезія.\n\nПитання вартості, за якої ця перемога була досягнута, залишиться для істориків, адже амбіції Президента чекали достатньо довго. Зрадники будуть покарані, і буде введено централізацію, бо дрібний регіоналізм приніс достатньо страждань. Індонезія отримає своє законне місце на світовій арені, бо так звані «велики» держави вже достатньо з нею гралися. Простими словами, компроміси показали свої межі, і їхні найбільші прихильники були викриті як зрадники.\n\nПрезидент, тепер більш популярний ніж будь-коли серед народу завдяки своїй безстрашності, показав, що немає нічого, що могло б зупинити непохитну силу індонезійського суверенітету. Бо Бунг Карно показав свій дух - свою Гелору - той, що освітить націю назавжди."
POLITICS_ZULKIFLI_LUBIS_DVR_DESC: "Зулкіфлі Лубіс - це розвідник, навчений у Голландії, і лідер військової технократії в Республіці Індонезія. Точніше, таким він був, поки не досяг угоди з суматранськими повстанцями для повстання проти уряду Сукарно.\n\nПриєднавшись до Свобідної Індонезії через угоду, посередництвом ЦРУ, Лубіс' Сілівангійська дивізія підняла повстання на заході Яви, поруч з штабом Сукарно в Джакарті, і виступила проти більшої сили. Оточений кількістю, Лубіс зі своїми військовими програмами, орієнтуючись на якість, став перед своїм найбільшим випробуванням. Модель Сілівангі хоча б дозволила Лубісу та його людям вижити, але не змогла завершити війну - а час лише злостив Лубіса більше і більше.\n\nОчевидно, що група Хатти зазнала поразки, і настав час для Лубіса зробити хід. Порушивши свою угоду з Свободною Індонезією, Лубіс розпочав процес відновлення миру в Індонезії своїм шляхом — через силу, хитрість та нечистий альянс з Сухарто. Вже деякі успіхи були досягнуті; Сукарно був скинутий, а союзники Лубіса вже починають контролювати уряд Індонезії в Джакарті. Все, що залишилось для Лубіса — це закріпити свою владу."
POLITICS_ZULKIFLI_LUBIS_POSTWAR_DESC: "Якби Зулкіфлі Лубісу сказали в 1955 році, що в наступне десятиліття в Індонезії буде громадянська війна, що вона триватиме так довго, що початкові фракції війни розпадуться через відсутність довіри, і що він, Лубіс, повинен буде взяти на себе обов'язок зібрати уламки, які Хатта та Сукарно розбили по всьому підлозі, тодішній полковник виплюнув би всю свою каву.\n\nАле саме це Лубісу довелося пережити. Війна затяглася занадто довго; країна майже стала непізнаваною, а сепаратисти та інші підривні елементи здобували довіру. Хатта та Сукарно мали бути усунені, особливо оскільки люди останнього чинили опір їх усуненню з владних кабінетів у Джакарті. Тепер Лубіс міцно тримає контроль і сидить у Джакарті як новий Президент.\n\nЗавдання Зулкіфлі Лубіса буде важким, але його плани чіткі: визначити новий політичний порядок, незалежний від розмов про децентралізацію і без збереження спадщини Сукарно, і формувати майбутнє Індонезії власними руками і лише своїми. Останнє десятиліття чітко показало, що ніхто інший не може бути довірений цим обов'язком."
POLITICS_SUHARTO_DVR_DESC: "Генерал Сухарто був молодшим членом впливової ПЕТА, військової кліки, що домінувала на Яві. Спочатку дислокований у нейтральному спеціальному регіоні Джогджакарта, хаос війни змусив Сухарто захопити владу - спочатку в Джогджакарті, а потім і в самій Джакарті після спалаху насильства, яке було приписано лівим агітаторам.\n\nСухарто стверджує, що він аполітичний, набагато вище дрібних політичних суперечок, в які постійно потрапляють інші члени його кліки. І справді, на початку він мав мало політичного впливу, особливо порівняно зі своїм високим військовим ранґом. Але багато хто підозрює, що цей статус є лише прикриттям, щоб відвести увагу, і що амбіції Сухарто значно більші, ніж він дозволяє собі вірити.\n\nЗ урахуванням того, що Свобідна Індонезія стикається з подібним розподілом під командуванням генерала Зулкіфлі Лубіса, громадянська війна в Індонезії вступила в нову й більш криваву стадію. Враховуючи поточну ситуацію, ці два генерали - один у Свободній Індонезії, інший в Джогджакарті - кожен з них готується завершити війну своїм способом."
POLITICS_SUHARTO_POSTWAR_DESC: "Індонезія знову цілісна. Один чоловік стоїть на чолі всього цього - Президент Сухарто.\n\nПісля хаосу, що виник через появу «соціалістів», які поширювалися по все більше виснаженій війною Індонезії, було оголошено надзвичайний стан. Сухарто став лідером уряду, і він дав чітко зрозуміти, що зробить усе, що в його силах, щоб стабілізувати Індонезію - все заради національної єдності.\n\nАмбіції Сухарто були добре відомі, і, здається, вони нарешті здійснилися. Повстання Хатти розпалося зсередини після відходу Зулкіфлі Лубіса. Сам Лубіс зараз в адміністрації. Із своїми суперниками, що більше не заважають, Сухарто відкрито претендує на спадщину Сукарно як свою - щоб продовжити боротьбу Індонезії своїм шляхом."
POLITICS_ABDUL_HARRIS_NASUTION_DVRDEF_DESC: "Для тих, хто уважно слідкує за індонезійською війною або знайомий з військовою історією молодої індонезійської нації, ім'я генерала Абдула Харіса Насуціона дуже добре відоме. Насутіон, навчений у Голландії військовий технократ, який був проти політизації армії Сукарно, був ветераном боротьби за незалежність Індонезії, а пізніше - і бунту Хатти проти уряду Сукарно.\n\nЦе була б верхня межа біографії Насуціона, якби Сукарно не був скинутий Сухарто в Джакарті. Наступний хаос і чистки лівих не тільки позбавили людей Сукарно і вивели соціалістичний вплив - вони підсмикнули підвалини Свободної Індонезії за ніч, в результаті чого повстання розпалося, а Хатта втік за кордон.\n\nАле не Насуціон. Він залишився, очоливши опір проти Нового порядку Сухарто - і так чи інакше повалив його силою зброї. Тепер він є Президентом Індонезії, і його обов'язок ясний: країна не буде в безпеці, поки кожен слід від Сухарто не буде вирізаний з індонезійського архіпелагу."
POLITICS_BAMBANG_SOEPENO_DVRDEF_DESC: "Месником єдине, що має значення для генерала Бамбана Супено, після всього, що сталося з Індонезією і з його далеким родичем Сукарно.\n\nЦе не завжди було так. Супено терпів розбурхану фракціональність до громадянської війни в Індонезії в надії, що в кінці кінців Сукарно зрозуміє і підніме дух індонезійського народу. Але все пішло зовсім не так. Сукарно був викинутий переворотом, очоленим повстанцем і опортуністом, передавши націю Індонезії на волю радикалів і лівих - і ці два виродки ще й насмілились звинуватити його, Супено, у невиправданому хаосі, який стався!\n\nНе дивно, що Супено відступив з різними правими опірними групами, що залишилися після того, як його так підставили. Очоливши цих солдатів, він вигнав президента Лубіса силою - і тепер новий президент має власні ідеї, як нарешті покласти край епосі хаосу в Індонезії.\n\nЦе велике шкода для супротивників Супено, що всі ці ідеї включають насильство."


