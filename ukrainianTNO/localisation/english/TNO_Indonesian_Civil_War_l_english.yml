JJK_paternalism_party_long: "Партія Націоналістів Індонезії - Партія Національної Єдності"
JJK_despotism_party: "КОДАМ III/Діпонегоро"
JJK_despotism_party_long: "Командування Округу Військ V/Діпонегоро"
POLITICS_HAMENGKUBUWONO_IX_DESC: "Найбільш ідіосинкратичним та наполегливим з усіх регіонів Індонезії є регіон Джогджака в Південній Яві. Завдяки мудрості дев'яти спадкоємних султанів, усі з титулом Хаменгкубувоно, султанат пережив як голландське колоніальне, так і японське імперське правління як напівнезалежне утворення; у теперішньому режимі Джогджака зберігає свій статус, визнаючи суверенітет і сюзеренітет індонезійського уряду.\n\nХаменгкубувоно IX, народжений Густі Раден Мас Дороджатун, є султаном цього унікального утворення. Хоча він здобув освіту на Заході, Хаменгкубувоно завжди прагнув виставити себе як місцевого жителя Яви перед усім іншим; це допомогло йому як під час японського правління, так і в уряді Сукарно після японців. Султан — хитрий чоловік. Коли він був молодий, він глузував з уряду Голландської Ост-Індії і відкрито кидав виклик місцевим губернаторам. Коли японці окупували Індонезію, він теж їм протистояв, а коли вони пішли, він охоче ставив під сумнів і самого Сукарно.\n\nЗараз Індонезія горить, і Джогджака використовує свої унікальні привілеї та ідентичність, щоб уникати бойових дій наскільки це можливо. Але, безсумнівно, султан, який був сміливим і турботливим, коли завадив японським планам перетворити своїх підданих на робітників-ромушу під час війни, не є байдужим до страждань, яких війна завдає з плином часу."
