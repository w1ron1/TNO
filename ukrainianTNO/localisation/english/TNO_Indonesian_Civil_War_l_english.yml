POLITICS_DAUD_BEUREUEH_DESC: "Це було за волею Аллаха — прославленого і возвеличеного Його ім'я — що Ачех виник. Це була та ж благодать, яка дозволила Дауду Беуреху взяти на себе відповідальність за його благополуччя. І саме цією благодаттю Сукарно привів до падіння своє правління над північним краєм Суматри, що дало можливість повернути істинне ісламське право — благородний Сяріат Іслам — в Ачех Даруссалам.\n\nДауд Беурех був залучений до політичного ісламу ще до Другої світової війни. Якби Сукарно утримав владу, це стало б для Беуреха остаточною поразкою після закінчення війни. Наполегливе дотримання Беурехом Сяріату Іслам понад усе було анафемою для Сукарно, який був занадто зайнятий 'збереженням влади' та 'незважаючи на розподіл нації' під час її централізації. Це були дурні, безбожні поняття.\n\nЗрештою, дурість Сукарно настигла його. Повстання Вільної Індонезії дало Беуреху можливість, яку він потребував, щоб відновити божественно встановлений порядок в Ачеху. Поки Хатта і Сукарно борються між собою до смерті, Беурех буде піддавати поважну увагу останньому, але його справжня мета буде зосереджена на тому, щоб зробити Ачех справжнім Даруссалам знову, незважаючи на всі витрати."

#ABD
