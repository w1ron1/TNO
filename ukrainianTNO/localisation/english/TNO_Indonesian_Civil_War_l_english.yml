POLITICS_AMIR_SJARIFUDDIN_DESC: "Святим обов'язком Амір Сjarifuddin Харехапа є очолити Анґкатан Берсенджата Демокраси Ракджат — Народні Демократичні Збройні Сили, які є єдиною соціалістичною повстанською групою, що діє в нинішньому індонезійському конфлікті.\n\nНе очікували б, що людина на кшталт Сjarifuddin стане лідером соціалістичних повстанців. Адже він був членом колишньої земельної еліти, яка володіла всім, що не належало голландцям на острові Ява. Його аристократичне походження допомогло здобути освіту в тоді престижному університеті Лейдена, що теоретично також мало б бути ще однією перешкодою. Але зрештою все це не завадило Сjarifuddin знайти своє соціалістичне прозріння, яке надихнуло його працювати як лівий журналіст в Індонезії до війни.\n\nПід час Другої світової війни Сjarifuddin воював проти японців; зрозуміло, коли війна закінчилась японською перемогою, він став персоной нон-грата. Але цього було недостатньо, щоб зламати Сjarifuddin; замість того, щоб капітулювати, він продовжував мобілізувати підтримку на Яві прямо під носом у Сукарно. Хаос воєнного стану Сукарно, у поєднанні з повстанням Вільної Індонезії, надав Сjarifuddin ідеальну можливість створити соціалістську базу влади в Центральній Яві — і він скористається цією можливістю на повну."

#JJK
JJK: "Рег. Джогджака"
