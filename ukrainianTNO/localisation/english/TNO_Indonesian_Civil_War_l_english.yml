POLITICS_SUNGKONO_DESC: "Взявши під контроль територію, охоплену партизанською діяльністю, генерал Сунконо стикається з важкою ситуацією. Важкою не лише через впертість партизан, але й через самого місцевого губернатора, губернатора Вонгсонегора, чия корпоратівістська та захоплена приязнь до Японії не здобула йому прихильності серед місцевого населення. Ось така ціна за вірність, здається.\n\nВідрізаний від Яви і маючи в своєму розпорядженні лише сміливість звичайного солдата для боротьби з партизанами та умиротворення мас, генерал має багато роботи: Його найбільший союзник, безсумнівно, це флот, але морська артилерія може зробити тільки так багато проти повторюваних наступів ABDR, і навіть найсміливіший флот не може виграти війну самотужки. Загалом, Сунконо є лише частиною великої гри за душу Індонезії, і він знає це надто добре.\n\nЯкщо все, що є у звичайного солдата, це його сміливість, то генерал поведе за собою як приклад. Адже хто ще може покладатися на його людей, коли Сукарно так далеко?"

