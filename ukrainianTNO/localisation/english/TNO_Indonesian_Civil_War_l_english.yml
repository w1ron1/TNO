POLITICS_ZULKIFLI_LUBIS_ICW_DESC: "Зулкіфлі Лубіс — військовий розвідник, підготовлений голландцями, і лідер військової технократії в Республіці Індонезія. Принаймні, таким він був, поки не досягнув угоди з суматранськими повстанцями про підйом проти уряду Сукарно.\n\nЦе було логічно, що Лубіс скористається такою можливістю. Він уже кілька років кричав у порожнечу про необхідність професіоналізації та підготовки збройних сил Індонезії на більш високий стандарт, ніж політизована організація, якою вони були з самого початку. Хоча це не вдалося, Лубіс знаходить втіху в тому, що він та генерал Абдул Харіс Насутіон хоча б змогли очолити належну військову форму самі — дивізію Сілівангі, одну з небагатьох дивізій в армії, сформовану за моделлю Лубіса та Насутіона.\n\nАле тепер такі питання є дрібницями порівняно з завданням, яке стоїть перед Лубісом. Після того, як він приєднався до повстанців через угоду, що була посередництвом ЦРУ, дивізія Сілівангі піднялася на повстання в Західній Яві, поруч з столицею Джакартою, і оточена з усіх боків силами Сукарно. Оточений кількістю, Лубіс' зосереджений на якості військових програм тепер стикається з їх остаточним тестом."


#PMT
PMT: "Військова Рада Перместа"
