 PAR_invasion.1.t: "Великі розмови на малому острові"
 PAR_invasion.1.desc: "Малий розмір острова Мартін-Гарсія робив присутність військових споруд на ньому майже кумедною. Все ж, завдяки своєму розташуванню у гирлі річки Ла-Плата, цей маленький острів був ретельно охоронюваний аргентинським військовим, і, в свою чергу, оспорювався Уругваєм.\n\nСьогодні, однак, це було місце, де господар Плати приїхав для досягнення згоди, а не для суперечок. Дійсно, мало хто міг би уявити ситуацію, за якої прибуття бразильського літака на острівний аеродром було б так тепло прийнято. Для полковника Карлоса де Мейра Маттоса, пасажира літака, це також було так. Як зірка, що сходить, бразильської армії, Маттос, мабуть, швидше очікував, що буде захоплювати острів, ніж вести переговори на ньому.\n\nІнший чоловік, який би радше пішов на війну зі своїм співрозмовником, ніж обговорював з ним питання, був Едуардо «Боча» Урібуру, нещодавно підвищений до звання бригадного генерала та командира, і, можливо, найсерйозніший представник націоналізму в аргентинській армії. Охоче супроводжуючи міністра закордонних справ Маріо Амадо, Урібуру привітав бразильського полковника, як і двох уругвайських генералів, Омара Порсіункулу та Хуго Тірібоччі, які прибули на човні з Колонії кілька годин тому.\n\nОфіцери морського та авіаційного служб, а також бюрократи міністерств закордонних справ усіх трьох країн, зібралися в будівлі Морського штабу, і, відкинувши формальності, перейшли до обговорення питання, яке стало настільки нагальним, що змусило їх до співпраці: Чорна вівця Плату, Парагвай.\n\n«Як було зазначено в нашому меморандумі до міністерств закордонних справ Бразилії та Уругваю, перемога комунізму в Парагваї буде неприпустимою для Аргентини. Однак ми не хочемо діяти проти цього у такому випадку без згоди та, дійсно, допомоги наших сусідів». Амадо, відомий як зразок націоналізму, тим не менше, був розумним геополітиком, і був готовий використовувати механізми консультацій, які стали більш поширеними після війни - мабуть, саме це робило його таким корисним для аргентинського міністерства закордонних справ.\n\n«Хоча ми не хочемо спішних дій — ми в бразильській армії не можемо погодитися на уряд такого типу в Парагваї». Маттос видихнув дим з цигарки, поки пара поклонників Ітамарі кивала головами в знак визнання контролю армії над зовнішньою політикою. «Це потребує більш детального обговорення».\n\n«Звісно». Відповідь Амадо була наповнена самовдоволеним, і трохи образливим відчуттям підтвердження, яке перекладач намагався зменшити. «Ніхто з нас не хоче повторення 1870 року».
 PAR_invasion.1.a: "Про що це говорять аргентинці?"

 PAR_invasion.2.t: "Розподіл Парагваю"
 PAR_invasion.2.desc: "З початком зустрічей на Мартін-Гарсія кілька місяців тому представники ще гіпотетичного військового союзу Потрійного Альянсу почали дещо захоплюватися своєю справою. Дійсно, деяких можна було б звинуватити у тому, що вони таємно сподівалися на перемогу комуністів у Парагваї, щоб їхня підготовка не була марною.\n\nСеред аргентинських представників, зокрема, було певне переконання, що така ймовірність може забезпечити остаточне вирішення проблеми Парагваю як геополітичної одиниці. Дійсно, протягом наступних місяців їхні зусилля були спрямовані на забезпечення Аргентині основної частини території Парагваю як зони окупації. Однак вони були змушені поступитися через бразильську непоступливість, що столиця, Асунсьйон, потрапить до уругвайської зони окупації. Мабуть, найбільш загальною ознакою серед аргентинських переговорників було глибоке обурення через подвійний обман бразильців в кінці останньої парагвайської війни, якого вони прагнули уникнути.\n\nЧастково через цей незвичайний військовий апетит генерала Урібуру бразильські полковники, присутні на зустрічах, стали дещо неохоче йти вперед з проектом. Вони були відмовлені від цього лише при прибутті генерала Альбукерке-Ліма, затятого антикомуніста, якщо вже так сказати. Тим не менш, новоприбулий генерал більше зацікавився в розробці планів для повернення до нормальності в Парагваї, включаючи його повне відновлення як незалежної держави.\n\nЩо стосується уругвайських дипломатичних і військових представників, які брали участь у зустрічі, то вони, очевидно, поділялися на два табори. Націоналісти навколо Порсіункулії раділи з того, як вдома їх сприймуть як героїв, тоді як ліберали під Тірібоччі все більше занепокоювалися тенденцією як Урібуру, так і Альбукерке-Ліма розглядати вирази та тенденції парагвайської опозиції, що були цілком нормальними аспектами уругвайської політики, як комуністичні до такої міри, щоб виправдати втручання з їхнього боку. У будь-якому разі їхнім першим пріоритетом було забезпечити, щоб націоналісти не забрали всю славу, щоб уникнути катастрофи, що призвела б до націоналістичного захоплення збройних сил. Нестача поваги до уругвайського суверенітету з боку їхніх сусідів було проблемою на майбутнє."
 PAR_invasion.2.a: "Майбутнє не виглядає яскравим для малих держав."

 PAR_invasion.3.t: "Реальна політика"
 PAR_invasion.3.desc: "«Це безглуздо!» — сказав Гуларт, стукаючи по столу. «Ви хочете, щоб я скоїв злочин імперіалізму, щоб зупинити імперіалізм? Ви не бачите проблеми з цією маленькою ідеєю?»\n\n«Вибачте, сеньоре, але ви повинні думати про армію. Вони починають тривожитися через Парагвай, і незалежно від того, чи втручатимемося ми, чи ні, аргентинські черевики все одно перетнуть кордон. Це не станеться зараз, але це станеться незабаром», — благав Аргеміро, міністр війни Гуларта.\n\n«І що? Ви хочете, щоб я вторгся, щоб втішити армію? Боже, вони вже хочуть мене вбити, Аргеміро. Вони б мене задушили цим самим телефонним шнуром, ви розумієте?»\n\n«Я розумію, сеньоре! Але червоний Парагвай — це занадто для більшості генштабу. Якщо ми дозволимо Аргентині розірвати Парагвай, вони приставлять ніж прямо до наших сердець. Прошу вас, сеньоре, я вас благаю. Просто підпишіть наказ. Не думайте про це як про вторгнення, думайте про це як про гуманітарне втручання!»\n\n«О, я не зрозумів, що ви родичі братів Даллес!» — із цими словами Гуларт зітхнув, потерши чоло. «Ех, поговоримо пізніше. Лицем до лиця, наступного разу».\n\nГуларт поклав телефон і спочив на руці. Дивлячись у вікно, Гуларт не міг не замислитися. Скільки його вчинків було спричинено справжнім бажанням робити добро? І скільки з його вчинків; спричинено чистою, дикою необхідністю? Тільки щоб утримати контроль над тим фактом, що він прокинеться завтра Президентом Бразилії — а не якимось ув'язненим у лапах жандармів ОВН, що захоплять країну.\n\nТепер йому доведеться боротися, щоб зберегти цей факт. І якщо те, що сказав Аргеміро, було правдою, то й решті країни також.\n\nПарагвай нічого поганого йому чи Бразилії не зробив. Нічого особливого чи особистого. Але особливості та особистості не мали значення. Парагвай був знаряддям для тиску на армію. Це був його рятувальний круг, що тримав його на плаву. Чорт забирай, був би він кимось іншим."
 PAR_invasion.3.a: "Дайте наказ."

 PAR_invasion.4.t: "Тінь над Південною Америкою"
 PAR_invasion.4.desc: "Попри все, ОФНВ здобули перемогу, знищивши всіх, хто намагався їм протистояти. Партизанська війна в Парагваї завершилася, і ОФНВ оголошують про свою славу з Асунсьйона на весь континент. Проте страх перед ізольованим «червоним» Парагваєм розвіявся — і у найгірший спосіб. З тіні парагвайських джунглів виступив Че Гевара, відкривши себе як справжнього лідера ОФНВ.\n\nСитуація набула абсолютно критичного характеру. Че відкрито говорить про те, що весь континент має піти шляхом Парагваю. Його точне місцезнаходження невідоме, але цілком можливо, що революційні осередки вже тренуються для створення хаосу. Боротися з тероризмом на наших кордонах було б марним завданням, коли чорне, гниле серце знаходиться у нашій досяжності.\n\nЩоб зустріти майбутнє, потрібно звернутися до минулого. Необхідно відродити Потрійний союз, щоб протистояти парагвайській загрозі. Уже розробляються плани переговорів у Монтевідео для обговорення наступних кроків. З Аргентиною, яка повністю підтримує союз, залишилося лише питання часу, коли до коаліції приєднаються Бразилія та Уругвай. Здається, якщо Че хоче війни народів, він її отримає."
 PAR_invasion.4.a: "Південна Америка крокує до війни."

 PAR_invasion.5.t: "Згода на незгоду"
 PAR_invasion.5.desc: "У тісній задній кімнаті Монтевідео назавжди змінювалася доля Південної Америки. Дипломати сіли у три групи: Бразилія зліва, Уругвай посередині, Аргентина справа. У центрі на міцному махагоновому столі лежала велика спрощена мапа Парагваю. Усі в кімнаті хотіли і потребували приборкати Гевару. Як це зробити, було досить простою справою для Генерального штабу Потрійного союзу. Набагато складніше було вирішити, що робити після цього.\n\n«Ліберали-фебреристи — наш єдиний варіант, якщо ми хочемо запобігти краху Парагваю», — зазначив бразильський дипломат, вказуючи на великі затемнені точки, що простяглися вздовж кордону Парагваю та його сусідів. «Можливо, нам доведеться надати допомогу, якщо у них виникнуть труднощі з управлінням. Нейтральний Парагвай під управлінням лібералів-фебреристів цілком підійде».\n\n«Навіщо нам віддавати Парагвай? Ми можемо просто домовитися про розподіл країни і розійтися, чи не так? Відновлення Парагваю після такого порушення — це безумство», — заперечив аргентинський колега. Багато членів аргентинської — і навіть частина бразильської — делегації кивнули і зашепотіли в знак згоди.\n\n«Вторгнення у суверенну країну — це одне. Утримання її — це зовсім інше. Якщо ви хочете воювати у вкрай непопулярній партизанській війні проти сил Че, будь ласка. Але відновлення країни — це найдешевший і найнадійніший варіант для всіх нас», — відповів бразилець.\n\nАргентинський дипломат замовк і вказав на Асунсьйон.\n\n«Що тоді з серцем усієї справи? Якщо тільки ви не хочете, щоб усі ми, пліч-о-пліч, ділили місто, потрібно щось робити».\n\n«Тоді віддайте його нам», — втрутився уругвайський генерал. «Ви двоє роздерете одне одного через Асунсьйон. Ви могли б довірити місто тим, у кого ще не заплямовані руки».\n\nБразильці та аргентинці подивилися на уругвайця. Знизавши плечима, обидва скрутили карту і відклали її убік."
 PAR_invasion.5.a: "Якщо Парагвай не може визначити свої кордони, це зробить хтось інший."

 PAR_invasion.6.t: "Поділ шкури невбитого ведмедя"
 PAR_invasion.6.desc: "Другий день. Як і вчора, дипломати сіли на свої місця. Кілька хвилин за кавою, ще кілька — за порожніми розмовами. Як і вчора, зрештою приємності поступилися холодній дипломатії.\n\nБразильський представник розгорнув ту саму карту Парагваю, що і вчора. На карті лінії та штрихи перетиналися з поспішними нотатками та доповненнями, накресленими по всій країні. Це були свідчення безлічі невдалих ініціатив і пропозицій з кожного боку.\n\n«Можливо, ми зможемо зрушити з місця у цьому питанні впливу, яке нас тут турбує», — сказав аргентинський представник, очі якого не могли приховати відсутності сну. «Ми не можемо дозволити собі витратити ще один день на суперечки про те, хто отримає який шматок!»\n\nВперше всі в кімнаті погодилися, киваючи. Звісно, всі хотіли угоди. Але вона мала бути на їхніх умовах.\n\n«Тож ви погоджуєтесь з нашими умовами? Ви займаєте Парагвай, а ми залишаємо за собою Асунсьйон? Хіба це не найсправедливіший спосіб поділити його?» — відповів бразилець. У кімнаті знову запанувала тиша.\n\n«Ви хочете, щоб нас обстрілювали веселі партизани Че, поки ви грабуєте Асунсьйон? Чому б вам тоді не захопити Буенос-Айрес, якщо ви так відчайдушно цього прагнете?»\n\nУругвайський представник зробив крок уперед, тримаючи маркер. Мовчки він провів лінію прямо через Парагвай. На півдні він позначив «А» — Аргентина. На півночі написав «B» для Бразилії. Потім він обвів маленьке коло навколо Асунсьйона і написав «У» для Уругваю.\n\n«Або це, або нічого. У всякому разі, це найближче до того, що ми можемо назвати угодою, з якою згодні всі».\n\nЯк і вчора, вони довго дивилися на пропозицію. Спочатку бразилець поступився і знову сів. Аргентинець, роблячи вигляд, що він найбільш упертий у кімнаті, неохоче поступився і пішов."
 PAR_invasion.6.a: "Ще одне питання вирішено."

 PAR_invasion.7.t: "Кінець конференції"
 PAR_invasion.7.desc: "Сьогодні завершується конференція в Монтевідео. За винятком наркозбуту в Сан-Паулу, навряд чи коли-небудь на південноамериканській землі збереться такий жалюгідний клуб інтриг і зрад. Тим не менш, усі представники можуть повернутися до своїх господарів з усмішками на обличчях і перспективами на підвищення. Доля Парагваю вирішена, і чорний шторм війни збирається навколо ОФНВ.\n\nЗа добре прихованими залежностями від азартних ігор, заплямованими італійськими костюмами і напівзаклеєним волоссям наші дипломати добре виконали свою роль. Вони мали гарантувати, що більшовизм залишиться невиразною, вмираючою ідеологією, яка ніколи не стане чимось більшим, ніж історичним курйозом, що виник із кривавої агонії імперії царя.\n\nУмови, що були узгоджені, прості. Якщо більшовики виграють свою громадянську війну в Парагваї, це створить найсерйознішу загрозу безпеці всього континенту. Тому єдиним виходом має бути настільки ж рішучий крок. Необхідно створити новий, оновлений Потрійний союз проти Парагваю. Армії Аргентини, Бразилії та Уругваю об'єднаються, щоб звільнити народ від нечестивої ідеології Маркса і Лєніна. Ми повалимо ОФНВ і відновимо щиру, ліберальну демократію в Парагваї, залежну тільки від себе!\n\nА поки що ми можемо лише спостерігати. Подивимося, чи зможе Парагвай самостійно визначити свою долю. Якщо ні, ми зробимо це за них."
 PAR_invasion.7.a: "Сцена готова."

 PAR_invasion.8.t: "Початок кінця"
 PAR_invasion.8.desc: "З Парагваю надійшли тривожні новини. ОФНВ розгромила своїх ворогів в Асунсьйоні. Битва за Асунсьйон — якщо вірити нашим кореспондентам — була найжорстокішою та найзапеклішою боротьбою, яку коли-небудь бачили на південноамериканській землі. Настільки жорстокою і запеклою була битва, що міжнародна преса назвала її «Паулюсбурґ-на-Пількомайо», очевидно, проводячи паралелі з жахами Західноросійської війни. Як би там не було, більшовики перемогли.\n\nДні наших планів і координації не пройдуть марно. Договір, підписаний нами з нашими союзниками по Троїстому союзу, набуде чинності за кілька тижнів, якщо не днів. Тепер це питання не того, чи вторгнемося ми в Парагвай, а коли. Наша армія перебуває у стані найвищої готовності, а наша авіація готова бомбити парагвайців усіма наявними у нас бомбами.\n\nЄдине, що нам потрібно зробити, — це правильно розташувати нашу армію на кордоні. Немає сенсу тренувати наших людей, якщо вони навіть не знаходяться поблизу Парагваю. Коли ми будемо готові, угоди активуються — включаючи підпункт, що дозволяє Уругваю проводити свої війська через наші кордони на час війни — і почнеться Друга війна Потрійного союзу. Нам лише потрібно віддати наказ."
 PAR_invasion.8.a: "Барабанний бій війни стає голоснішим з кожним днем."

 PAR_invasion.801.t: "Із тіні"
 PAR_invasion.801.desc: "Документи не брехали. І, читаючи доповіді Ґелена, Шпеєр переконався, що і південноамериканці теж. Ледь чутка про можливе втручання в Парагваї у разі перемоги ОФНВ перетворилася на факт. Факт, що Південна Америка не прийме цієї поразки лежачи. Перегортаючи сторінки, як дитина книжку з малюнками, Шпеєр знав, що армії Потрійного союзу готуються до жорстокої боротьби за свої долі. Наступні місяці визначать долю Південної Америки — на брудних, вибоїстих дорогах в Асунсьйоні та навколо нього, у вологих, задушливих джунглях, що оточують місто. Доля континентів кувалася на перетині страшних обставин і людської доблесті.\n\n«Ми маємо агентів у місті, але вони ризикують бути спійманими, якщо завершать свою місію», — лунав голос Ґелена у Шпеєровій уяві. «Склади постачання Гевари розкидані долиною. Наші агенти належно обладнані для саботажу цих складів, коли почнеться вторгнення».\n\nПравда полягала в тому, що Шпеєра мало цікавили тонкощі міжнародної дипломатії. Можливо, це була старість, але було все важче слухати нескінченні промови Ґелена про переміщення активів чи вибір пістолета для агентів. Він був архітектором. Величезний, масштабний особняк мав значення для нього, а не те, яким різцем його вирізали. Парагвайська війна була ще одним будівельним проектом для Фюрера. Не мало значення, як саме вона відбулася, тому що сам факт її завершення перевершував усе. Більшовизм був занадто небезпечним вірусом, щоб процвітати у вмираючій, застійній політиці Латинської Америки. Метод знищення мало цікавив його.\n\n«Ми можемо гарантувати перемогу Потрійному союзу, чи як там вони себе називають?» — перебив Шпеєр.\n\n«Ні», — відповів Ґелен. «Однак це найкраще, що ми маємо. Промисловість, ключові комунікаційні зв’язки, ра-»\n\nШпеєр підняв руку, перебиваючи Ґелена."
 PAR_invasion.801.a: "«Тоді цього достатньо для нас. Нехай південноамериканці завершать те, що ми почали»."

 PAR_invasion.9.t: "Майже час"
 PAR_invasion.9.desc: "Президент поклав листа, зітхнувши. Аргентина кликала їх. Їхні війська, як він прочитав у листі, маршували до кордону. Колони чоловіків, танків і вантажівок простягалися до горизонту. У листі не було нічого особливо шокуючого. Аргентина та навіть мізерний Уругвай готові до початку вторгнення. Усе, що їм було потрібно, — це Бразилія. Президент глянув за вікно, у бік Бразилії. Сонце заходило за ним, занурюючи столицю в блискучі відтінки помаранчевого, рожевого та червоного. Зовні вогні автомобілів рухалися додому, то зупиняючись, то рушаючи вперед.\n\nВони не розуміли, в якому світі живуть. Звісно, простий народ знав про свій світ. Вони читали газети, поглинали репортажі та дивилися телевізор. Це був очищений світ. Ілюзія, яку він і його міністри — разом зі своїми попередниками — створили, наче майстерні ремісники. Чому вони повинні знати? Чому вони повинні знати, наскільки крихкими були їхні життя, і що при найменшій зміні вітру їхні життя могли б розвалитися в руїни? У певному сенсі їм можна було навіть позаздрити.\n\nЗвісно, Гевара не був дурнем. Повітряна розвідка виявила десятки, якщо не сотні літаків на напіввідремонтованих аеродромах. За кілька місяців парагвайська армія перетворилася з розрізнених, але фанатичних студентів коледжу на добре підготовлений підрозділ, який включав справжню авіацію. Це було вражаюче. Але цього буде недостатньо.\n\nПрезидент зробив ковток із пляшки. Гірке, як попіл, але в цьому ж і був сенс; чи не так? За сім днів бразильська армія збереться прямо на парагвайському кордоні. Через сім днів вони сурмитимуть сурми війни, і річка Парагвай почервоніє від крові їхніх співвітчизників. Через сім днів вся Південна Америка піде на війну. Що б не сталося далі — добре чи погане — цілком лежить на їхніх плечах."
 PAR_invasion.9.a: "Спершу як трагедія. Потім - як фарс."

 PAR_invasion.10.t: "Друга війна Потрійного союзу"
 PAR_invasion.10.desc: "Все вело до цього моменту. О 3 годині дня Аргентина, Бразилія та Уругвай офіційно оголосять війну Парагваю. Усі наші війська заполонили кордон з гарматами, літаками та танками. Через п’ять хвилин — ні більше, ні менше — армії Потрійного союзу перетнуть кордон із Парагваєм. Кожен чоловік знає свою роль і своє завдання. Чи то стріляти, чи бомбити, чи прориватися прямо до домену Че, це буде однією з найсмертоносніших воєн в історії Південної Америки. Поки наші сили тренуються, так само роблять і сили Че. Було б нерозумно очікувати, що сили Че будуть вести звичайну війну з окопами та наступами, що женуть нас назад.\n\nНі, Гевара використає всі свої останні засоби, щоб захистити себе. Ми маємо бути — і ми є — готові до кожного сценарію, який може застосувати проти нас парагвайська армія. Підготовлені підрозділи, озброєні знаннями з розмінування пасток і боротьби з партизанами, чекають нашого наказу. Однак багато хто в нашому уряді побоюється, що цього недостатньо. Гевара не той чоловік, якого слід сприймати легковажно. Його легенда має таку ж, якщо не більшу вагу, ніж справи самого революціонера. Найстрашніше побоювання — це те, що він розкриє якусь секретну зброю чи тактику з найтемніших куточків Парагваю, готову знищити наших людей у будь-який момент.\n\nХоча ми знаємо, що це нісенітниця, мало хто в нашому командуванні очікує, що це буде легка війна. Це не буде війна, яку вивчатимуть наші онуки на уроках історії. Це не буде війна, створена з відважних героїв і сміливих кавалерійських атак. Це буде війна, просякнута загадковістю та кровопролиттям. Боротьба, де кожен труп є перемогою для будь-якої сторони. Конфлікт, де межі між цивільними та бійцями розмиті та заплутані. Будуть звірства. І їх буде багато. Вони не будуть випадковими. Вони стануть нормою. За кожного чоловіка, якого вб’є Гевара, ми вб’ємо десятки його. Поки ми не виженемо більшовизм із Південної Америки, жоден із членів Потрійного союзу не зупиниться.\n\nМи спалили всі мости за собою. У Південній Америці більше немає шляху, крім як вперед."
 PAR_invasion.10.a: "Підніметься і грізно закричить «Звільнення» – і спустить псів війни."

 PAR_invasion.11.t:0 "Тост за перемогу"
 PAR_invasion.11.desc:0 "Фрота осушив свій келих шампанського. Воно було дивно солодким, як полуниці в шоколаді. Напій виявився міцнішим, ніж він очікував, що змусило генерала скривитися. Поруч із ним Фігейреду усміхнувся, оглядаючи Фроту. «Міцний, чи не так?» – хихикнув Фігейреду. «Французьке з Африки, якщо ти можеш у це повірити. Я не звинувачую їх за те, що вони роблять такі міцні напої. Те, що йде з Темного континенту... це робить усе тутешнє нікчемним у порівнянні». Святкування – хоча це більше схоже на зустріч 50-річних чоловіків, ніж на студентську вечірку – було у розпалі. На сцені оперна співачка виконувала свої арії. Вона була прекрасною, як Фрота собі уявляв співачок у Вагнерівських операх. Було дивно бачити, як ці зазвичай стримані й суворі чоловіки радісно виконують імпровізовані танго, але нагода була особливою. Бразильська армія знищила більшовизм, відкинувши його у суху пустелю забуття. «Тут?» – сказав Фрота. «Тут у нас усе гаразд. Ми вбили кілок у серце Че й принесли мир континенту. Не знаю, що відбувається в Африці, але у Південній Америці ми показали світу, що ми не такі вже й простачки. Кажи що хочеш, але ми не здаємося». «Трохи драматично, але я згоден. Парагвай тепер наш. Хоча я постійно отримую звіти про так звані напади партизанів. Відсотків 80 із них виявляються марними тривогами чи надмірно ревними солдатами, які бачать хлопця з рушницею. Або, в одному випадку, це був шкільний жарт. Одягнувшись у маскувальні костюми, вони озброїлися феєрверками й ледь не були застрелені товаришами. І цілком заслужено». «А решта 20%? Що вони собою являють?» «Неважливо», – сказав Фігейреду, виходячи зі своєї задумливості. Стукнувши ложкою по келиху, він змусив усіх замовкнути. «Товариші! Ми добре впоралися із групою жалюгідних покидьків! Але де б ми були без нашого улюбленого Президента? Він – спільний біль у наших дупах і, нібито, найгірший гравець у покер у Південній півкулі! Але... саме він знищив більшовизм у Латинській Америці». Фігейреду підняв келих, і Фрота та всі присутні зробили те саме."
 PAR_invasion.11.a:0 "За Президента Бразилії!"

 PAR_invasion.12.t:0 "Жахлива катастрофа"
 PAR_invasion.12.desc:0 "Генерал Фігейреду зробив ковток із пляшки шампанського. З французької Африки — або, принаймні, з того, що від неї залишилося. Це була найдивніша суміш гострої солодкості й одного з найміцніших напоїв, які він коли-небудь куштував. Здавалося, що ця солодкість поступово роз'їдає його нутрощі. З огляду на те, що це з маленького феодального володіння де Голля, це, мабуть, стало полегшенням для тих, хто його купував. Не було жодного способу, щоб Гевара міг виграти, як це сталося. Усе й завжди було проти нього. Жоден чинник не міг зіграти на користь Гевари. Чисельність, якість зброї, тактика. І все ж кожна патрульна місія завершувалася тим, що чоловіки поверталися частинами або не поверталися зовсім. Партизани зникали безслідно, щоразу коли проводилися місії пошуку й знищення, а ті, хто їх проводив, зазвичай опинялися у пастці з пунджі. Це було непростимо, це було неможливо, але все це відбувалося просто на його очах. Генерал зробив ще один ковток із пляшки. Найгіршими були фотографії тіл. Кістки стирчали з місць, про які він навіть не знав, що вони існують. Купи кінцівок і частин тіла складалися в груду до його пояса, всі вони були насаджені на палі, покриті екскрементами. Очі, о, вони були найгіршими. Вони були не просто ще однією частиною тіла. Це був останній знімок у свідомість хлопців — лише хлопців — відправлених на завдання без жодної надії на успіх. Чи були вони прикріплені до тіла, чи ні, очі завжди, здавалося, дивилися прямо в камеру. Вони не розповідали історії героїв, які впали в бою, чи нещасного випадку, якого не можна було уникнути. Ні. Ці трупи знали, хто їх убив, хто переконався, що тисячі батьків більше ніколи не зможуть потримати за руку свою дитину. Він згрішив, і вся Південна Америка це знатиме. Ще один ковток. Генерали тут не винні. Вони просто виконували накази, чи не так? З самого верху, від людини, обраної народом Бразилії. Президент продовжував посилати більше людей на смерть, бо якщо він не робив цього, то заради чого тоді загинули попередні? Він був м'ясником тисяч. Руки генерала були залиті смертю, і навіть не він порушив людяність. Ні, він не згрішив. Але Президент згрішив."
 PAR_invasion.12.a:0 "Ножі точаться."

 PAR_invasion.401.t:0 "Фюрер і революціонер"
 PAR_invasion.401.desc:0 "Шпеєр переглядав фотографії та документи, розкладені на його столі. Це не могло бути правдою. Йому навіть не потрібно було читати жодного рядка звіту, щоб зрозуміти, що сталося. Нездари. Чортові нездари, які навіть не змогли встояти проти жменьки майже не тренованих студентів зі зброєю часів Першої світової. Шпеєр намагався приховати свій гнів від зовнішнього світу. Це не спрацьовувало. Перед ним Ґелен запалив сигару в кабінеті фюрера. «Наш єдиний союзник на цьому континенті. Зник. Зміщений ким саме, Ґелене?» — запитав Шпеєр, відкладаючи папери. «Че Гевара? Я навіть не знав, що він живий, якщо чесно. А тут він, керує країною...» Ґелен нахилився вперед, знявши свої окуляри. Очі шпигуна були червоними, кровоносні судини проступали, як гілки хворого, вмираючого дуба. Безсонні ночі й виснажливі дні взяли своє. Але він був тут. Павук, завжди уважний до останньої ниточки в своїй розгалуженій, колосальній павутині. І він не терпітиме жодної загрози. «Хоча наш союзник може бути втрачений, мій фюрере», — кашлянув Ґелен, — «Ті, хто утримував його при владі - ні. У схованці, у маскуванні чи в іншому місці, ми все ще маємо вікно в Парагвай. Що б ви не захотіли дізнатися, мій фюрере, наші агенти це з'ясують. Ба більше, я маю для вас хороші новини». Ґелен передав Шпеєру нову папку. Відкривши її, він побачив розшифровки й чорно-білі фотографії генералів і полковників разом. «Непередбачені події», «Парагвайське питання», «Мобілізація проти Червоної загрози». Це був перший знак перемоги після низки поразок. Бразилія й Аргентина не залишать цю новину без уваги. Вони розуміли, як і він, небезпеку амбіцій Гевари. Південна Америка давала відсіч. «Це чудово! Я сподівався, що вони могли впоратися з цим раніше, але байдуже. Гевара не має шансів проти них. І я не буду стояти осторонь, поки вирішується доля Латинського світу. Ви вільні, директоре. Мені треба зателефонувати Шмідту». «Що ви йому скажете, мій фюрере?»"
 PAR_invasion.401.a:0 "«Щоби той запевнився, що Південна Америка знає, на чиєму ми боці."

 PAR_invasion.402.t:0 "Історія двох генералів"
 PAR_invasion.402.desc:0 "Фрота набрав номер Фігейреду на своєму особистому телефоні. Це було один-сім-шість чи... ні, звісно, ні. Бразильський генерал приклав два пальці до скроні, заплющивши очі. Який же його номер, знову? Він десь його записав, але прибиральник, мабуть, викинув записку. Із усіх днів, щоб забути чийсь номер. Фрота перебрав усі можливі комбінації, доки не почув глибокий, хрипкий голос, який вимагав представитися.\n\n«Це Фрота. Ви бачили новини, я припускаю? Що йому від нас треба? Від Парагваю? Я знаю, що німці, як ніхто інший, не переносять соціялізму, але чому саме тут?» — сказав Фрота, вимкнувши радіо, де Альберт Шпеєр зачитував явно підготовлену заздалегідь промову.\n\n«Я знаю, чому вони нас підтримують. Але річ у тім, що Буенос-Айрес цього не робить. Я щойно розмовляв зі своїм контактом із аргентинської армії. Познайомився з ним на новорічній вечірці в Росаріо. Хороший чоловік. Абсолютний легковаговик, хоча. Він каже, що вони сприймають це як позитив! Шампанське і все таке». — сказав Фігейреду.\n\n«Що? Вечірки? Ми будемо вторгатися в суверенну країну, а не святкувати, чорт забирай, бар-міцву", — зітхнув Фрота.\n\n«Я знаю, але скажи це їм. Тим не менше, здається, що Німеччина хоче розширити свої крила, залізши й на наш чудовий континент. Вони займають ту ж стійку, що й після війни. Хоча тоді це було тільки в Європі та на Близькому Сході. Я не знаю, що сталося в Європі, і не хочу знати, але можу сказати тобі, що це не буде добре для нас. Зовсім не буде. Мені треба йти. Побачимось пізніше».\n\nФрота поклав трубку. Це було... складно, м'яко кажучи. Це була абсолютна правда, що Німеччина мала агентів по всій Південній Америці, і особливо в Парагваї. Навіть після завоювання Че мережа, ймовірно, залишалася хоча б частково цілою. Однак це була угода, яку вони змушені були прийняти. Вашингтон завжди був метою для Фроти. Жодна супердержава не принесла б такої користі Бразилії, як Америка, і вона здебільшого трималася б осторонь від бразильських справ. В основному. Шпеєр змусив їх прийняти рішення, навіть змусив їх відчути подяку. Це ще повернеться їм. Але зараз? Вони були товаришами по зброї."
 PAR_invasion.402.a:0 "Людина рідко розпізнає диявола, коли він кладе руку на твоє плече."

 PAR_invasion.802.t:0 "Серце з бетону"
 PAR_invasion.802.desc:0 "Ось вона, Ґерманія. Шпеєр ходив навколо своєї моделі Ґерманії, яка залишалася в ідеальному стані. Тридцять років. Тридцять років пройшло з тих золотих днів його життя. Показуючи своєму Фюреру чудеса світу, який ще мав настати, кожен захоплений і вражений кивок голови був відзнакою гордості для старого архітектора. Ідея — така ж міцна та щира, як і бетон, з якого вона була складена — але зовсім недосяжна. Це було схоже на відображення чогось у воді, майже досягнуте, але ніколи не зовсім реальне.\n\nҐерманія була серцем усього. Як Ґерманія в’янула й руйнувалася, так само й Райх. Але поки метрополія жваво працювала й сяяла, Європа також оживала. Сьогодні надійшли новини про розгромну поразку Парагваю. Він подбав, щоб кожна газета в ще населених місцях Райху дізналася про це. Вже не буде так, як раніше; це — вічна спадщина Че для Парагваю. Він сумував за смертю фашизму, але Шпеєр знаходив втіху в тому, що той поділить свою домовину з його вбивцею. Болшевизм більше не забруднить Південну Америку своїм декадентством.\n\nНе мало значення, що нації Південної Америки воліли б лизати яскраві черевики Вашингтона. Ні, це не мало значення. Архітектор ніколи не залишав справи на останній момент. Німецькі агенти, глибоко вбудовані в Аргентину, переконали б їх... переглянути свою позицію. Вони побачать світло, блиск блискучих вогнів Ґерманії. Вони побачать рішучість Німеччини, навіть коли шанси були проти неї. Вони побачать себе в Райху. Нація, обложена з усіх боків своїми нижчими. Континент, що за правом належить їм, але затримується світовими силами. Світ, який готовий прийняти їх велич. Все, що їм потрібно, — це лідер. Як Гітлер у 1930-х. Як він сам, прямо зараз.\n\n«Мій Фюрере», — увійшов Ґелен, — «наші агенти знайшли повідомлення, що кажуть, що Аргентина та Бразилія прагнуть наблизитись до Вашингтону. Навіть після всієї нашої допомоги, вони все ще відмовляються від наших пропозицій. Що нам робити?»\n\nҐелен виглядав більш упевненим. Підстриженні волосся, чисто виголене обличчя і очі, приховані окулярами. Павук повністю контролював свою павутину, з кожним останнім пальцем, що рухався під контролем кожної тонкої нитки. Так, Ґерманія була серцем світу. І тільки Фюрер міг забезпечити, щоб воно продовжувало битися."
 PAR_invasion.802.a:0 "Зробіть так, щоб вони були вдячні за нашу допомогу. Так чи інакше."

 PAR_invasion.803.t:0 "Нікчемні бразильці"
 PAR_invasion.803.desc:0 "«Повна, абсолютна некомпетентність! Повна, абсолютна некомпетентність, Директоре!» — кричав Шпеєр. «Наскільки треба бути некомпетентним, щоби зазнати такої поразки? Че був прямо там; вони могли б його застрелити, розбомбити або зробити йому будь-що ще! Чому він досі живий, Директоре?»\n\nҐелен мовчав. Шпеєр мав рацію, чи не так? Аргентинці та бразильці, як вони говорили, поспішно втікали з Парагваю, залишаючи все й усіх. У нього більше не було сумнівів, що німецькі — його — активи в регіоні мертві. Можливо, не зараз, можливо, вони ще проіснують кілька наступних років. Але вони були мертві. Якщо він їх добре навчав - вони вмруть від своєї ж руки.\n\n«Мій Фюрере, ви не можете звинувачувати себе за це. Ми дали бразильцям і аргентинцям карти, позиції підрозділів, фотографії, все. Все, що їм було потрібно для виконання місії. Вони не справились. Ні-»\n\n«Ти правий, Ґелене. Я не звинувачую себе за це. Я звинувачую тебе». Шпеєр встав зі свого місця. Повільно наближаючись до найближчого вікна, він подивився на Ґерманію. Ґелен впізнав вираз Шпеєра. Це був погляд людей, чия поразка вирвана з самого рота.\n\n«Мій Фюрере, німецька розвідка не винна в цьому. Че—»\n\n«У тебе є діти, Ґелене?» — перервав Шпеєр, все ще дивлячись на Ґерманію. «Тобі не потрібно відповідати на це питання. Ти усвідомлюєш, що трапиться, якщо ми будемо продовжувати робити такі помилки? Якщо ми дозволимо большевизму — який мав померти з тим виродком Бухаріним — процвітати по всій планеті? Що трапиться з Німеччиною та її народом, якщо ми не зробимо свою роботу?»\n\n«Що, мій Фюрере?» — спитав Ґелен.\n\n«Ми всі згинемо, Директоре. Вашингтон викопає наші могили, а Токіо прочитає молитву над нашими трунами. Большевизм знищить усе, що ти любиш, і якщо ми будемо продовжувати помилятися, ми побудуємо свої гробниці. Ти можеш взяти своїх дітей і застрелити їх у потилицю. Один за одним. Альтернатива набагато гірша», — сказав Шпеєр. Відійшовши від вікна, він відмахнувся від Ґелена."
 PAR_invasion.803.a:0 "Ви вільні, пане Директор."

