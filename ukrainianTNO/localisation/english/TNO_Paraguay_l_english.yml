 ARP_Adolfo_Philippeaux: "Адольфо Філіпо"
 POLITICS_BENJAMIN_RATTENBACH: "Дотримання традицій у політиці є головним інстинктом Аргентини, і вибір генерал-лейтенанта Бенхаміна Раттенбаха для управління парагвайськими територіями — лише один із прикладів. Народившись наприкінці XIX століття й присвятивши все життя військовій кар’єрі, Раттенбах є католиком, націоналістом і членом військової фракції «Асуль» — саме в такому порядку. Понад усе він вірить у свій обов’язок: він майже зовсім не розглядав свою посаду як сходинку до чогось більшого.\n\nВтім, у Вілья-Орієнталі на нього чекає чимало роботи. Керуючи смугою землі вздовж кордону з країною, якій він підпорядковується, він стикається з тінями FULNA та війни, що передувала їй, як з однією проблемою; місцеве управління досі залишається недієздатним, а найтривожніше — парагвайська Церква й досі заплямована впливом червоних. Перемога в мирі вимагає мислення як на перспективу, так і назад, і саме йому належить показати аргентинському уряду, що він здатен на обидва."
 BRP_Carlos_de_Meira_Mattos: "Карлос де Мейра Маттос"
 POLITICS_CARLOS_MATTOS: "Генерал-майор Карлос де Мейра Маттос — найнебезпечніший тип людини: людина дії, яка мислить. Рука молодого чоловіка миттєво піднялася, коли його штат, Сан-Паулу, закликав на допомогу під час Конституційної революції 1932 року. Рік потому він вступив до Військової школи Реаленґу, увібравши її настанови, дисципліну та відчуття власної переваги, й вийшов звідти офіцером Бразильської армії. Будучи лише капітаном, де Мейра Маттос відіграватиме ключову роль в організації експедиційних сил «Курців змій» під час Другої світової війни та сам побачить бої в Середземномор’ї. Викладання піхотного курсу в наступниці Реаленґу та служба аташе в Болівії ще більше загострили його військову філософію.\n\nНезрозуміло, чи саме характер де Мейра Маттоса, його досвід або чутки про його участь у військових інтригах Бразилії привели його до командування бразильською окупаційною зоною Парагваю. Однак мало хто міг би заперечити, що полковник із завзяттям узявся за цю роль. Щодня колишніх членів фашистського або комуністичного режимів вистежують, висувають їм звинувачення і часто страчують. Попри мовні бар’єри, за організаціями та пресою стежать на предмет екстремізму й опору окупаційній владі, після чого відповідно вживаються заходи. Такий енергійний підхід досі не забезпечив стабільності й не призвів до помітного зменшення кількості партизанських атак, що дошкуляють його силам. І якщо ця стратегія не дасть результату, де Мейра Маттос викує іншу. Більш пристосовану, більш безжальну й більш жорстку за все, що було до неї. Для Парагваю він справді небезпечна людина."
 URP_Fernando_Levi_Ruffinelli: "Фернандо Леві Руффінеллі"
 POLITICS_FERNANDO_RUFFINELLI: "Щоб вижити в Парагваї Морініґо, потрібен був компроміс. Щоб пережити комуністів, потрібен був стрімкий від’їзд за кордон — те, що дехто назвав би боягузтвом.\n\nІ доктор Фернандо Леві Руффінеллі вижив. Юрист із Вільярріки, він трохи займався журналістикою, трохи політикою. Його критика уряду була достатньо м’якою, а підтримка Ліберальної партії — достатньо незначною, щоб продовжувати жити далі. А коли Війна Чако завершилася захопленням Асунсьйона комуністами, його академічна робота над демаркацією парагвайсько-бразильського кордону привела його достатньо близько до безпеки, щоб уникнути похмурої долі своїх колег.\n\nЦе поєднання удачі та гнучкості переконало ОАД, що Леві Руффінеллі — людина, здатна очолити перехідний уряд Парагваю. Парагвайців це не переконало: вони вважають його безхребетним колаборантом аргентинських і бразильських окупантів.\n\nАле Леві Руффінеллі робить для них усе, що може. Він лестить, нарікає, потай засуджує порушення прав людини військами ОАД. Якби тільки перехідний уряд мав бодай трохи більше автономії, якби тільки лібералізм країни не був настільки обезголовленим. Якби тільки парагвайці мали щось більше, ніж Леві Руффінеллі."

