##################
## LEADER DESCS ##
##################

 POLITICS_HIGINIO_MORINIGO_DESC: "Порядок — надає державі її форму. Дисципліна — надає нації її морального характеру. Ієрархія — надає народові структуру. Президент Іхініо Морініґо, той, хто дарував Парагваю ці три чесноти, є людиною, що стоїть на вершині цієї ієрархії.\n\nВін не отримав цю позицію за одну ніч, уперше привернувши увагу громадськості після того, як відшукав останки парагвайського героя Франсіско Солано Лопеса, завдяки чому здобув прихильність президента Хосе Фелікса Естіґаррібії. Коли Естіґаррібія пішов у відставку, Морініґо був призначений Ліберальною партією тимчасовим президентом. Для більшості інших людей на цьому їхня історія завершилася б.\n\nОднак така велика людина була призначена для значно більшого, зрадивши олігархів, захопивши абсолютну владу й відправивши їх у вигнання. Його раса — пригноблені ґуарані — надто довго страждала від їхніх рук, а Європа показала йому, як вести їх до величі. Його порядок заново сформував Парагвай, створивши цілковито фашистську державу, загартовану ще більше провалом Америки повалити її під час вторгнення біля водоспадів Ґуайра.\n\nТа попри — або через — ці досягнення Морініґо деградував від героя війни до озлобленого старого, що ліниво лежить на вершині свого нового порядку. У кожному куточку він бачить лише ворогів, жалюгідних політиків і генералів, які розжиріли на його перемогах. Загнаний у кут, він, здається, вже рахує свої останні дні, що спливають, доки його правління не змінить корисливий опортуніст або, що ще гірше, залишаючи його з останньою думкою:\n\n"Що станеться з Парагваєм, коли мене не стане?""
 POLITICS_CHE_GUEVARA_DESC: "Життя Ернесто «Че» Ґевари визначалося любов’ю до революції — любов’ю, яку живила ненаситна допитливість, що провела його через капіталістичні держави та марксистські ідеології, старі дружби й нові війни. Колись радикальний юнак, який сподівався на мирний перехід до комунізму, Че пустив коріння своїм революційним переконанням серед пролитої крові Колумбійської громадянської війни, коли комуністичне сектантство затягнуло мільйони людей у роки циклічного насильства. Че залишив Колумбію іншою людиною: людиною, яка житиме й дихатиме своєю ідеологією.\n\nПісля навчання в джунглях Юкатану Че супроводжував Фіделя Кастро від початкової поразки біля «Ґранми» до остаточної перемоги в Гавані. На Кубі він прославився своєю енергійною, безжальною відданістю комуністичній справі, часто проводячи голосування серед своїх товаришів-революціонерів, щоб вирішити долю полоненого, і ніколи не відводячи погляду від очей людей, засуджених до смерті авангардом народу.\n\nПісля від’їзду з Куби Че мандрував Південною Америкою як мандрівний партизан, навчаючи молодих революціонерів і перетворюючи їх на кістяк міцних визвольних рухів, як-от FULNA. Тепер, переживши ув’язнення в Чилі та насильство парагвайського захоплення влади, Че відмовляється покинути свою розколоту, нестабільну революцію через страх, що вона відхилиться від шляху Куби. Безумовно, цьому мандрівному революціонерові ще багато чого належить зробити."
 POLITICS_OSCAR_CREYDT_DESC: "Президент Оскар Крейдт був зайнятий роботою в Палаці уряду після революційної перемоги в битві за Асунсьйон, намагаючись застосувати на практиці весь свій життєвий досвід організаторської та агітаційної роботи з державного крісла. Генеральний секретар Парагвайської комуністичної партії, Крейдт вважався очевидним вибором на роль національного лідера для Че Ґевари, якому в будь-якому разі було зручніше в полі, ніж за письмовим столом.\n\nЛіва агітація Крейдта давно привела його до підписання Nuevo Ideario Nacional, анархо-синдикалістського маніфесту, що закликав до соціального та етнічного конфлікту між сільськими масами, що розмовляли ґуарані, та елітами під європейським впливом, які становили клас експлуататорів. Під час періодичних арештів і вигнання він став переконаним марксистом і встановив зв’язки з комуністичними колами по всій Латинській Америці, включно з Аргентиною та Бразилією.\n\nТепер Крейдт перебуває саме там, де йому потрібно бути. Хоча його не люблять усі в PCP — критики називають його нарцисичним і засуджують його автократичні тенденції та схильність до культу особи, — він рішуче налаштований використати владу, яка тепер у його розпорядженні, для здійснення соціальної революції. Саме за це боролися партія, партизани та ґуарані-маси — за це боровся і він."
 POLITICS_ALFREDO_STROESSNER_DESC: "Маючи німецьку та ґуаранську кров, Стресснер є солдатом насамперед і президентом уже потім. «Ель Рубіо» вступив до армії у шістнадцять років, а у дев’ятнадцять воював у Чакській війні.\n\nУ молодості Стресснер виявив свою безмежну жагу до влади, прагнучи піднятися якомога вище військовою драбиною. Він стрімко просувався крізь лави, зрештою отримавши від Морініґо звання генерала. Стресснер зібрав навколо себе коло відданих військових союзників — старих друзів із Чакської війни та Легіону Кондор і нових друзів, які поділяли його ґерманофільські погляди. За допомогою цих союзників Стресснер тепер є найвпливовішою людиною в Парагваї.\n\nЯк владний батько Парагваю, Стресснер обіцяв «мир, працю та добробут». Насправді Стресснер лише створив видимість цього завдяки своїм безжальним антикомуністичним кампаніям, спрямовуючи приціл як на лівих агітаторів, так і на звичайних дисидентів. За наказами Стресснера ворогів держави викрадають, катують і вбивають. Часто їхні моторошні допити відбуваються перед самим президентом або їхні крики відтворюють телефоном для його задоволення.\n\nНавіть на найвищій посаді Стресснер живе аскетично: за чутками, він не користується гарячою водою й відмовляється від анестезії під час операцій. Стресснер бореться за збереження образу ідеального здоров’я та залізної волі. Такий спартанський спосіб життя є вимогою, яку Стресснер висуває лише до себе, що видно з розкішних витрат його наближених за рахунок держави."
 POLITICS_FULNA_PROVISIONAL_JUNTA_DESC: "Багато союзів виникають радше через вигоду, ніж через товариство, і тимчасова хунта FULNA не є винятком. Після перемоги у Війні бушу FULNA створила тимчасовий уряд на чолі з Че Ґеварою, Рафаелем Франко та Альфредо Рамосом. Їх об’єднує лише боротьба проти колишнього уряду, тож справжнім дивом є вже те, що вони взагалі дійшли до цієї стадії.\n\nЧе Ґевара — людина, яка не потребує особливого представлення. Попри народження в заможній аргентинській родині, Ґевара бореться за бідних. Народний герой серед революціонерів Латинської Америки й лиходій для землевласників та державних діячів, мандри Ґевари привели його до Парагваю заради визволення пригноблених цієї країни\n\nРафаель Франко — колишній президент і генерал, а також лідер революційної фебреристської партії. Він виступає за права бідних і модернізацію парагвайської армії, хоча є значно поміркованішим за Че Ґевару.\n\nАльфредо Рамос — колишній генерал і член Ліберальної партії, безперечно найпоміркованіший із трьох чоловіків. Рамос із 40-х років очолював численні невдалі спроби повалити режим Іхініо Морініґо й кілька разів був ув’язнений у Пенья-Ермосі — одного разу за наказом Рафаеля Франко.\n\nУсі троє чоловіків надзвичайно не довіряють один одному. У міру того як напруження всередині хунти лише зростає, майбутнє молодого уряду Парагваю залишається невизначеним."
 POLITICS_JUAN_MANUEL_FRUTOS_PANE_DESC: "Падіння Іхініо Морініґо не лише започаткувало нову еру для Парагваю, а й вивело незначного члена Гіон Рохо на передній план великої політики. Щоправда, ненадовго, адже Хуан Мануель Фрутос Пане є тимчасовим главою держави Парагваю, який має піти у відставку після інавгурації новообраного президента Наталісіо Ґонсалеса.\n\nПисьменник, музикант, драматург, інтелектуал і член Партії Колорадо, Мануель Фрутос Пане йде політичним шляхом свого батька, Хуана Мануеля Фрутоса, служачи державі як політик, сповідуючи подібні консервативні переконання і, можливо, ще більшу любов до країни. Він зробив внесок до парагвайського культурного канону театральними постановками та сарсуелами, особливо оспівуючи його фольклор, селянство та Пинанді — «воїнів-землеробів», пов’язаних із рухом Колорадо у 1940-х роках."
 POLITICS_JUAN_NATALICIO_GONZALEZ_DESC: "Важко уявити бездушну людину, яка стане кимось іншим, крім раба; заможна людина без стійкості — ледве людина взагалі. Серед багатьох своїх сучасників лише Хуан Наталісіо Ґонсалес знає силу, яку породжує вольова — якщо й не нерозважлива — людина, особливо після того, як став свідком млявої відставки слабкого Іхініо Морініґо.\n\nНезвично багато подорожуючи та залишаючись стриманим, водночас перебуваючи в межах культури ультранаціоналістичних думок, яку плекала Партія Колорадо, Наталісіо Ґонсалес був досить відомим журналістом, який заснував культурний журнал Guarania, відомий багатьом як рупор найбільш догматичних консерваторів Парагваю. Витративши роки на розширення своїх горизонтів, він також зміг розвинути відкритий спосіб мислення — якість, особливо рідкісну серед багатьох інших революційних діячів. Запозичуючи різноманітні впливи від Мораса, PRI і навіть подекуди самого Дуче, його важко сприймати кимось іншим, окрім як видатним ідеологом Гіон Рохо.\n\nПрозваний «тендота» своїм неймовірно відданим культом особи, серед його прихильників поширена приказка: «мечами чи кулями, Наталісіо — до палацу». Попри такий фанатизм, Наталісіо Ґонсалес має порівняно конкретну особисту амбіцію як лідер — принести ґуаранській расі перемогу над змовами міжнародного капіталізму. Він щиро знає потенціал парагвайського народу, і його доля — розкрити найкращі якості цього товариського народу воїнів-землеробів."
 POLITICS_EDGAR_YNSFRAN_DESC: "Після смерті Наталісіо Ґонсалеса Едґар Інсфран є настільки ж надійною гарантією продовження політичної програми покійного президента, наскільки це взагалі можливо. За освітою він юрист, після чого працював на державній службі, але цього важко було б очікувати від людини з настільки палкими політичними переконаннями.\n\nВін не з тих, кого легко шокує жорстокість, і як права рука та протеже Ґонсалеса використовував ескадрони смерті Колорадо (або, за словами Інсфрана, «життєву кров партії»), щоб знищувати дисидентів і партизанські групи на своєму шляху під час Війни бушу, навіть зберігаючи александрійську бібліотеку книг, викрадених у них. Очевидно, однак, що ті часи минули, і останнім часом він став одним із головних діячів Колорадо, водночас застосовуючи своє вміння працювати пером як письменник для партійного журналу.\n\nІнтелектуал, а отже ідеолог свого руху, він серйозно ставиться до цінностей партійної єдності та дисципліни: навіть його противники підтвердять його енергійність, але особливо — його безжальність, коли випадає нагода. Якщо нічого іншого, то Інсфран неодмінно стане південноамериканським лідером, якого поважатимуть навіть у коридорах влади Буенос-Айреса та Бразиліа."
 POLITICS_VICTORIANO_BENITEZ_VERA_DESC: "Для крихкої країни мало хто об’єднує її сильніше за старих героїв війни. Сама лише здатність згуртувати націю та розповісти історію про причини пишатися нею — це здатність, якою від народження наділені небагато. Але Вікторіано Бенітес Вера має її, і все ж йому довелося пробиватися на саму вершину; після вимушеної відставки багаторічного президента Іхініо Морініґо його піднесення визначалося боротьбою однієї ворогуючої фракції проти іншої.\n\nЦя боротьба, однак, почалася на полях битв Чакської війни, яка для нього була позначена особистим віднайденням останків його брата, після чого він звернувся до Вермахту, який вважав взірцем сили та моделлю для наслідування. Його статус і відданість армії згодом зростали, і в 1941 році сам Морініґо призначив його командиром 1-ї кавалерійської дивізії. Потім він став лідером Frente de Guerra, угруповання військових командирів із агресивно фашистськими переконаннями, де також планував свій вихід у політику.\n\nОчікується, що його порядок денний буде зосереджений на консолідації парагвайського фашизму засобами, які він знає найкраще: державою та її військом, навіть коли йому доводиться протистояти силам, у багато разів більшим за нього самого. Але такої мети неможливо досягти без рішучого лідера попереду, і, як він сам каже, «збройні сили керують урядом. Кавалерія говорить від імені збройних сил. А я — кавалерія.»"
 POLITICS_EPIFANIO_MENDEZ_FLEITAS_DESC: "Є багато причин, чому Епіфаніо Мендес Флейтас не здавався б людиною, призначеною для високої посади в Парагваї: він народився бідним, був вигнаний із країни й, можливо, просто більше цікавиться мистецтвом, ніж політикою, будучи завзятим письменником, поетом і музикантом. Попри всі ці обмеження, тепер він сидить у Палаці Лопеса після перевороту, здійсненого поміркованими членами Партії Колорадо, і більше не залишається місця для сумнівів у ньому.\n\nПісля таємного повернення до країни та схвалення старійшини політики й лідера демократів Федеріко Чавеса він прийшов у час великої потреби для партії. Його об’єднавчий вплив і репутація відвертого критика Гіон Рохо та Морініґо з 1940-х років цілком можуть заспокоїти як молодих радикалів, так і старих консерваторів у його русі.\n\nВтім, якщо його товариші-колорадо вважають його об’єднавчою фігурою, сусіди напевно так не вважатимуть. «Антиімперіаліст», який припустив, що наслідки операції «Морський лев» були «кармою» за вторгнення Потрійного альянсу на його рідну землю, він ненавидить Сполучені Штати та Бразилію, що принесе йому небагато товаришів у ліберальному світі. Його щира підтримка Аргентини не зменшила його суперечливості. Мендеса Флейтаса можна звинувачувати в багатьох речах, але не в тому, що він нецікавий."
 POLITICS_ALFREDO_RAMOS_DESC: "Хід історії сповнений сюрпризів. Якби ви вирушили в будь-яке місце Парагваю в 1950-х роках і сказали людям, що всього за кілька років їхнім президентом стане ліберал, вони б висміяли вас. Але Альфредо Рамос залишив своїх критиків спантеличеними. Єдина втіха, що залишилася цинікам, полягає в тому, що цей військовий конфлікт справді залишив при владі військового генерала.\n\nРамос провів чимало битв, і не лише нещодавню битву за Асунсьйон — боротьбу за владу після падіння попередньої диктатури. У тридцять із лишком років він став героєм Чакської війни після битви при Ібібобо, а згодом командував кавалерійським полком. Навіть тепер він прагне вести парагвайців уперед, хоча бажано не на полі бою: у своїх перших зверненнях до нації як глава держави він наголошував на важливості порядку, стабільності та модернізації, щоб нація могла встигати за мінливими часами.\n\nДля Рамоса це, однак, означає й самому внести кілька змін. Активний член Ліберальної партії та її політичного життя, загартований роками політичного ув’язнення в Пенья-Ермосі, він, м’яко кажучи, не надто прихильно ставиться до комуністів чи фебреристів, яких свого часу придушував. Не через байдужість, а через прагматизм, сказав би він, адже зрештою змінювати означає протистояти минулому. Неможливо чинити опір, не протистоячи бодай чомусь."
 POLITICS_GUSTAVO_GONZALEZ_DESC: "Важка голова, що носить корону. Це не просто вікова істина про владу, а й фізичний опис Ґуставо Ґонсалеса, чия слабкість у старості додає ще один тягар до його долі. Він ніколи не мав стати президентом, принаймні спочатку, але після відходу Альфредо Рамоса в задимлені кулуари та отримання ним нової посади військового керівника після останніх виборів він був змушений пожертвувати приватністю заради своєї країни та справи.\n\nЦе виявиться не таким безпроблемним завданням, як можна було б припустити з огляду на його безсуперечливий і шанований статус серед товаришів-лібералів, і вік — не єдина проблема. Він не бажає нав’язувати свою волю чи збирати голоси, якими потенційно міг би розпоряджатися, оскільки пролом, залишений Рамосом після його відходу, залишив двері надзвичайно широко відчиненими для фракційності. Крім того, його прихильність до аграрної реформи чи подальшого державного економічного планування багатьох його товаришів по партії налаштувала проти нього, і ще належить побачити, чи зможе він заручитися їхньою підтримкою.\n\nУ будь-якому разі він президент, який понад усе уособлює надію Парагваю. Він модернізатор, але водночас раціоналіст, який, як і багато інших, став ветераном Чакської війни як санітар, а потім антропологом, паралельно займаючи високу посаду в партії. Його вороги, якщо вони в нього є, не бажають ставати на заваді такій можливості залишити позаду конфлікт, який так довго стримував країну. Час руйнувати минув, тепер настав час будувати."
 POLITICS_RAFAEL_FRANCO_DESC: "Стати генералом у спустошеній війною країні, прийти до влади, політично зміцнитися завдяки зверненням до націоналістично-популістських настроїв, а потім носити прізвище Франко — це безумовно моторошне повторення історії у випадку Рафаеля де ла Крус Франко Охеди. Утім, усі подібності очевидні, але їхні історії аж ніяк не однакові.\n\nУ випадку цього парагвайця його військові подвиги в Чако також зробили його популярним і впливовим, хоча зрештою він став зневаженим вигнанцем через ліберальний уряд, який ревнував до його впливу. Але цей уряд було повалено, його привели до присяги, лише щоб ліберали знищили його через упертість і змусили знову залишити рідну землю. Цей цикл Уробороса завершився його фебреристською партією, заснованою за кордоном, яка після подій FULNA зрештою все ж править країною.\n\nФранко пройшов через політичні битви, яких не знав жоден інший чоловік. Він укладав союзи, йшов на компроміси, зраджував і завдавав ударів у спину по всьому політичному спектру, тоді як військова стара гвардія, комуністи та помірковані Парагваю по черзі переходили з однієї категорії до іншої. Він здолав PCP і лібералів, яких Війна бушу зробила творцями влади, а тепер трон належить йому одному. Хай довго він править — або, принаймні, так він сподівається."
 POLITICS_MIGUEL_ANGEL_SOLER: "Коли пил від другої битви за Асунсьйон осів, переможна комуністична партія обрала нового президента Парагваю, обравши Міґеля Анхеля Солера очолити парагвайську революцію.\n\nНароджений у 1922 році, Міґель Анхель Солер увійшов у політику в молодості як студентський агітатор і фебрерист. Усередині PRF Солер разом зі своїм батьком і сестрою Кармен Солер очолював марксистську фракцію, відому як Bloque Liberación. У 1951 році марксистів було виключено з PRF, і Солер вирішив приєднатися до PCP разом з іншими колишніми фебреристами. Солер став письменником партійної газети Adelante, а під час Війни бушу допомагав організовувати партизанів PCP.\n\nПісля революційного захоплення влади PCP Солер став свідком переходу Крейдта до персоналістського правління. Об’єднавшись з Обдуліо Барте, вони повалили Крейдта, а Солера обрали замість нього завдяки підтримці Барте. Однак їхній союз є крихким, і Солер продовжує не довіряти Барте. Тепер Солер прагне усунути свого єдиного потенційного суперника всередині партії та здобути повний контроль над парагвайською революцією."

#######################
## IDEAS & MINISTERS ##
#######################

 PAR_la_ley_del_mbarete: "La Ley del Mbareté"
 PAR_la_ley_del_mbarete_desc: "У Парагваї є два типи людей: ті, хто носить чобіт, і ті, хто змушений його терпіти. Переважна більшість парагвайців належить до останньої категорії, терплячи кийок так само неминуче, як податки, що сплачуються місцевим елітам заради їхньої фінансової вигоди та задоволення в обмін на подобу нормальності, яку місцеві інституції не здатні забезпечити.\n\nПерша категорія живе у власному світі, іноді задовольняючись власними дрібними феодальними володіннями, якими можна правити й вимагати данину, але зазвичай змагаючись з іншими за владу, щоб збільшити свою частку пирога. У них є свої люди — куплена лояльність — і є ті, хто стоїть над ними, аж до самої вершини. А для парагвайців це так само природно, як вдихати повітря."
 PAR_arcadian_backwater: "Аркадійська глушина"
 PAR_arcadian_backwater_desc: "Асунсьйон існує як бульбашка, пам’ятник тому, яким решта Парагваю могла б бути, але не є. Його землі існують у стані застою — сільські ідилії, замкнені на сто років у минулому, — час від часу благословенні сучасними дивами техніки, зазвичай у вигляді ствола рушниці. Їхня бідність абсолютна, занедбана десятиліттями бездіяльності уряду, за винятком рідкісного опіуму урядової ініціативи для придушення невдоволення.\n\nСелянство прийняло це як свою долю, задовольняючись життям у блаженній ізоляції та важкою працею на землях, повністю відомих лише їм самим. Уряди приходять і йдуть, прапори підіймаються й падають, але їхній ґрунт іще сто років здебільшого залишатиметься осторонь руху до індустріалізації."
 PAR_condor_legion: "Легіон Кондор"
 PAR_condor_legion_desc: "По всій Латинській Америці молоді стають у стрій, щоб вести війни старих, борючись за фашизм. Це Легіон Кондор.\n\nДітище Юнкерської школи в Парагваї, військового коледжу та пронацистського аналітичного центру, Легіон Кондор був офіційно сформований після Першого латиноамериканського конгресу фашистської молоді. Спочатку організований і навчений у Парагваї, але пов’язаний із силами по всьому континенту, Легіон мобілізувався для захисту фашистських режимів, яким загрожує втручання Заходу, водночас сприяючи падінню лівих урядів.\n\nПолітично рух приймає майже всі течії радикальної правої ідеології — від Фаланґізму до Націонал-соціалізму — із сумнівним винятком Інтегралізму через його несумісність із відверто нацистськими нахилами Легіону. Економічно Легіон виживає завдяки субсидіям від прихильних урядів і фінансистів, а також контрабанді. Практично Легіон житиме доти, доки молоді чоловіки будуть готові помирати за націю."
 TNO_condor_legion_tt: "§RВласник цього національного духу зможе відправляти добровольців до фашистських рухів по всьому іспаномовному світу.§!"
 PAR_new_national_state_morinigo: "El Nuevo Estado Nacionalista"
 PAR_new_national_state_morinigo_desc: "Дисципліна. Ієрархія. Порядок. Це стовпи, що керують Парагваєм, фундамент його національної революції. Над цими стовпами стоїть Іхініо Морініґо — постать, яка в Парагваї поступається лише Богові.\n\nПісля десятиліть при владі Морініґо повернув Парагвай до знайомого персоналізму минулого, пристосованого до сучасних стандартів, створивши нову націоналістичну державу, здатну пережити новий світовий порядок. Вірні марширують вулицями, щоб витоптувати слабких і деформованих, нездатних або неохочих відповідати моделі Морініґо, винагороджувані за шалену лють і стримувані лише клієнтелістськими вимогами. У його жорстокості немає жодних вад; усе це цілком задумано."
 PAR_new_national_state_benitez_vera: "El Nuevo Estado Nacionalista"
 PAR_new_national_state_benitez_vera_desc: "Дисципліна. Ієрархія. Порядок. Це були стовпи, що керували Парагваєм, фундамент його національної революції, але будь-який монумент, який не підтримують із часом, слабшає. Іхініо Морініґо ослаб — саме те, що він зневажав, — і його довелося замінити новою людиною, Вікторіано Бенітесом Верою.\n\nПоки наступник Гітлера готується до себе в Германії, Бенітес Вера з новою енергією приймає мантію лідера. Саме Німеччина є наддержавою, а не Іберія чи Італія, і тому Парагвай має наслідувати лише найсильнішого. Єдина прийнятна модель ближче до дому — Аргентина Перона.\n\nЇхнє насильство чисте, їхній терор показовий, а їхня влада абсолютна. І незабаром Парагвай приєднається до них."
 PAR_the_barefoot_revolution: "Босонога революція"
 PAR_the_barefoot_revolution_desc: "Селянство було джерелом влади, значною мірою невикористаним Партією Колорадо, але ці часи добігають кінця, коли Босонога революція наближається до їхніх земель. Під Гіон Рохо ці «воїни-землероби» стали основою соціальної революції, що прагне перетворити Парагвай на націю, яка гордо стоїть на повний зріст перед іноземним впливом американських маріонеток, таких як Бразилія.\n\nІдеалізовані як нові зразкові люди, вони прикрашають розмальованими обличчями стіни та плакати, де пропаганда зображує їх взірцями, борцями проти тиранії міжнародних фінансів. Вони становлять життєву силу парагвайської економіки й назавжди залишатимуться непохитними перед загрозою олігархів, які захопили кермо такої кількості інших країн."
 PAR_battling_for_democracy: "Боротьба за демократію"
 PAR_battling_for_democracy_desc: "Партія Колорадо була рушійною силою попередньої диктатури Парагваю, але чи може вона також стати інструментом демократії? Саме це питання Епіфаніо Мендес Флейтас ставить перед своєю нацією, виступаючи за демократичні інституції, що представляють волю народу, а не волю одного правителя.\n\nРухаючи Партію Колорадо в бік справжнього популізму, Флейтас, схоже, має намір демонтувати диктаторський режим, який йому передував, на користь повернення до традиційних практик Колорадо, де політикою керують голоси, а не гармати. Однак, з огляду на все ще всепроникну присутність Партії Колорадо в парагвайському суспільстві та відсутність життєздатних альтернатив, ще належить побачити, чи буде справжня зміна, а не лише слова."
 PAR_peace_and_progress: "Paz y Progreso"
 PAR_peace_and_progress_desc: "Слова «мир і прогрес» без кінця повторюються, вибиваючись із кожного пропагандистського матеріалу Партії Колорадо, наче повторення зрештою дозволить їм перетворитися на факти. Звісно, метою новітнього доброзичливого диктатора та провідника парагвайської нації, Альфредо Стресснера, є не створення миру й прогресу, а змусити народ повірити, що мир і прогрес існують у Парагваї.\n\nДля Стресснера справжній прихід миру й прогресу за його правління був би приємним доповненням до його пропагандистських зусиль, але навряд чи станеться. Наявні інституції, створені для прославляння великих людей, не потрібно демонтувати, якщо вдосконалити їх, прибравши найбільш очевидні образи фашизму та перепрофілювавши для його потреб. Як Парагвай був нічим без Морініґо, так він буде нічим без Стресснера."
 PAR_second_liberal_revolution: "Друга революція '04"
 PAR_second_liberal_revolution_desc: "Цілком доречно, що Партія Колорадо вдруге зустрічає свій кінець від рук знайомого ворога: Ліберальної партії. Знову організована вигнанцями, цього разу базованими в Бразилії, а не в Аргентині, Друга ліберальна революція поклала край десятиліттям персоналістського правління в Парагваї на користь нового початку, позначеного примарами минулого.\n\nОднією з примар, що одразу впадають у вічі більшості, є консолідація влади в руках Ліберальної партії. Нібито для захисту Парагваю від сильних правителів і популістів, звинувачення в захопленні влади олігархами та фінансовому імперіалізмі з боку Бразилії лунають повсюдно, оскільки колишні покровителі, схоже, мають намір пожинати свої винагороди. Без радикальних змін Парагвай, схоже, приречений на десятиліття правління Ліберальної партії, а не ліберального правління."
 PAR_second_february_revolution: "Друга Лютнева революція"
 PAR_second_february_revolution_desc: "На дворі 1936 рік, Рафаеля Франко привела до влади революція, сповнена рішучості знищити олігархічний контроль і повернути землю народові. На дворі 1964 рік, Рафаеля Франко революція знову повернула до влади, сповнена рішучості раз і назавжди завершити Лютневу революцію.\n\nПодібно до і водночас не так, як Франко з Іберії, Рафаель швидко перебрав на себе роль популістського каудильйо, людини мас, яка правитиме замість них. Не можна довіряти ні комуністам, ні лібералам у виконанні волі народу, адже вони підкоряються лише іноземним господарям. Франко розуміє, що необхідно для здійснення справжньої національної революції, для Парагваю, вільного від імперіалістичних практик його сусідів, і для землі, повернутої її народові."
 PAR_new_national_ideology: "Nuevo Ideario Nacional"
 PAR_new_national_ideology_desc: "Парагвайська комуністична партія чудово усвідомлює реальні матеріальні умови своєї нації й, за відсутності промислового пролетаріату, що працює на фабриках, звернула свій погляд до селянства, яке працює в сільських районах Парагваю. Романтизуючи сільські маси, що розмовляють ґуарані, PCP прагне зробити їх основою революційного Парагваю майбутнього.\n\nПлями колоніалізму, довго панівні течії європейського впливу та пекучий слід фашизму буде викорінено. Парагвайська модель комунізму може вважатися неортодоксальною щодо правління Бухаріна в Совєцькому Союзі, але націоналістичні тенденції всередині партії вважаються необхідними корективами, істотними для завершення національної революції перед переходом до соціялістичної революції."
 PAR_price_of_peace: "Ціна миру..."
 PAR_price_of_peace_desc: "...це вічна пильність. Цей вислів зазвичай завершують члени збройних сил Парагваю, виправдовуючи свою всюдисущу присутність у всіх аспектах суспільства. Стволи рушниць нишпорять вулицями Асунсьйона, такі ж всюдисущі, як тупіт чобота, сповзаючи з плечей мілікос, доки їм не знадобиться продемонструвати свій вплив на невдачливого крамаря. Цей державний бандитизм є нормою аж до вищого командування.\n\nЦе звір. Військовим потрібно дедалі більше й більше, вони набивають генералів підвищеннями платні та земельними ділянками з ярликом «аграрна реформа», заплющуючи очі на їхні рекетирські схеми. Натомість вони тримають своїх людей у строю, обмежуючи бандитизм і мобілізуючи їх проти будь-яких загроз. Це жорстоко й несправедливо, але це працює, то чому хтось мав би це змінювати?"
 PAR_makeshift_military: "Імпровізовані збройні сили"
 PAR_makeshift_military_desc: "Парагвайські військові були прогнили до самого нутра, пронизані фашизмом і під командуванням цілої низки гітлерів-самозванців. Після захоплення влади FULNA військо було розірвано на частини й створено з нуля. Генералів і полковників відправили до розстрільних загонів, інших повісили на флагштоках, тоді як ті, хто був нижче них, або отримали амністію, або втекли на коричневіші пасовища. Інституцію було ґрунтовно очищено й знову поставлено під контроль цивільного управління.\n\nОднак після такого ретельного очищення новий уряд залишився з військом, яке в найкращі дні більше нагадує партизанський загін. Війна бушу вже спустошила значну частину інфраструктури та обладнання, необхідних для забезпечення порядку, змушуючи уряд відновлювати жалюгідні промислові потужності Парагваю, щоб зберегти монополію на насильство. Це буде нелегко, але альтернативи немає."
 PAR_the_chokehold_communists: "Задушливі лещата"
 PAR_the_chokehold_communists_desc: "Протягом більшої частини недавньої історії Парагваю його ізоляція була самонав’язаною — він виступав проти іноземного імперіалізму через автаркію. За комуністичного правління решта Південної Америки відгородилася від Парагваю, замурувавши його, щоб компенсувати нездатність насильницьки усунути його від влади. Його лідери засуджують ексцеси PCP, чи то через огиду до її чужої ідеології, чи то через страх, що революція просочиться до їхньої нації, якщо її не стримати.\n\nХоч це й не ідеально, Парагвайська комуністична партія стверджує, що дії цих капіталістичних держав лише підтвердили правильність її теорій, головною з яких є те, що Парагвай має навчитися покладатися лише на себе. Їхні сусіди перейняли американські та європейські моделі поведінки, наслідуючи імперіалістів, проти яких, як вони стверджують, виступають, водночас погрожуючи гордому народу ґуарані знищенням.\n\nЯкщо вони мусять залишатися на самоті, нехай так і буде; вони залишаться в безпеці."
 PAR_the_chokehold: "Задушливі лещата"
 PAR_the_chokehold_desc: "З 1869 року Парагвай економічно та політично підпорядковувався тому чи іншому зі своїх сусідів. Найпомітніша з них — Аргентина, його останній гегемон. Аргентинські інтереси становлять непропорційно велику частину економіки Парагваю, позбавленої конкуренції з боку сусідніх держав і такої, що дозволяє їхнім компаніям процвітати. Їхні маєтки контролюють величезні простори землі, будучи феодальними володіннями самі по собі.\n\nВізуально це панування найкраще демонструє річка Парана. Підпорядкованість Парагваю державі-протектору дозволяє Аргентині використовувати всю протяжність річки для впливу на сполучені регіони через торгівлю. Це стало серйозною причиною невдоволення для бразильського Ітамараті, обмеживши його здатність прокладати дипломатичні шляхи, що змусило найбільш яструбиних із них відвернутися від пера й звернутися до меча для розв’язання цього питання."
 PAR_bush_war: "Війна бушу"
 PAR_bush_war_desc: "Один вогонь гасить інший, один цвях вибиває інший, а одна імперська держава прагне викорінити іншу в Парагваї.\n\nТіні невдалого вторгнення біля водоспадів Ґуайра 1954 року тяжіють над Парагваєм, коли нація знову занурюється в хаос. Повстанці та інсургенти, організовані й навчені у вигнанні — об’єднані під прапором FULNA, — проникли в країну. Фінансовані іноземними покровителями та готові битися до смерті, їхня поява стала найбільшим випробуванням для правлячого режиму за десятиліття.\n\nЗвернувшись по допомогу до Аргентини, уряд бореться за своє життя, щоб зберегти свою хватку над Парагваєм, тоді як Бразилія намагається витіснити оплот фашизму зі свого кордону. Кожна провінція стала полем бою, сторони змінюються так само, як день змінюється ніччю, тоді як конфлікт низької інтенсивності триває на задньому плані парагвайського життя. Це буде некрасиво, але ніхто ніколи не вдавав, що буде інакше."

 ### Старі національні духи
 
 PAR_bastion_of_latin_american_fascism: "Бастіон латиноамериканського фашизму"
 PAR_bastion_of_latin_american_fascism_desc: "Парагвай гордо й непокірно височіє як єдиний захисник великого фашистського ідеалу на американському континенті, наче острів, оточений декадентськими плутократіями, що плазують біля ніг своїх господарів з ОВН. До нашої держави-фортеці прибувають німецькі радники, оперативники, інженери й торговці, а також праві вигнанці з усього континенту. Наважившись стати на захист нашого народу, ми ізолювали себе від сусідів, але це мало важить — адже Парагвай є бастіоном проти виродження."
 PAR_bastion_of_latin_american_fascism_tt: "§YМоже підтримувати фашизм на регіональному рівні.§!"
  
 PAR_avanee: "Avañe'e"
 PAR_avanee_desc: "Avañe'e — це мова ґуарані, що буквально перекладається як «Мова народу». Унікально для континенту, нею говорять на всіх рівнях суспільства навіть ширше, ніж «Мовою господаря» Karaiñe'e, або іспанською. Тоді як наші сусіди відкидають свою корінну спадщину в божевільній гонитві за європейським виглядом, ми визнаємо, що наш однорідний народ є сплавом великих іберійської та американської рас. Унікальність нашої культури й мови дає нам силу, єдність і виразний національний характер."
 PAR_political_tarot: "Політичне таро"
 PAR_political_tarot_desc: "Диктатура Морініґо побудована не лише на компромісах і співпраці, а й на виживанні найсильнішого. На практиці це означає політику спроб догодити всім одночасно, але поки що постійний приплив німецького капіталу дозволяв режиму успішно згладжувати ці суперечності.\n\nТрон багнетів може бути не вічним, адже окультні сили організовуються всередині та за межами Фатерлянду, щоб повалити Колесо Фортуни."

 ##Occupation Tag Spirits
 URP_king_without_country: "Король без країни"
 URP_king_without_country_desc: "Родина Лопесів у XIX столітті та Морініґо у XX столітті здобули для себе майже абсолютну владу над Парагваєм. Наскільки ж низько впали їхні наступники.\n\nНакази та закони, що виходять із Палацу Лопеса та Законодавчого палацу, сягають лише меж міста Асунсьйон. За ними вони набувають чинності лише відповідно до примх бразильських чи аргентинських військових властей.\n\nА в межах цих обмежених кордонів завзята люстрація позбавила місто старших посадовців, а провали військових зусиль очистили його від молодших. Єдиною силою, здатною діяти, залишаються миротворці ОАД. Які, звісно, не підпорядковуються жодній парагвайській владі."
 
 URP_duel_marionettes: "Двобій маріонеток"
 URP_duel_marionettes_desc: "Кожна течія парагвайської думки знайшла своє вираження в новому тимчасовому уряді. Але ця інклюзивність мало що означає, враховуючи прикріплені до нього лялькові нитки.\n\nЗа тонкою завісою структури ОАД Бразиліа та Буенос-Айрес спрямовують протилежні угруповання колаборантів через безліч інтриг і суперечок. Вказівки зі сцени, на які час від часу посилаються американські держави з інших країв, здебільшого ігноруються, поки обидві сили розривають зв’язки, що прив’язують Асунсьйон до їхнього суперника.\n\nА парагвайські громадяни, які грають роль глядачів цієї фарси? Заплутані — так. Розлючені — безумовно. Розважені? Аж ніяк."
 
 URP_reascension: "Відродження"
 URP_reascension_desc: "Поля, де колись росли соя, маніок і бавовна, лежать занедбаними. Звуки арф стають дедалі тихішими. Поява поліцейського чи листоноші тепер уже вважається розкішшю.\n\nТаким є стан Парагваю за межами Асунсьйона, спустошеного епіцентру громадянських та іноземних війн. Руїни не прибрали навіть із Палацу Лопеса, не кажучи вже про вулиці. Електроенергія подається в найкращому разі з перебоями, а пошкодження каналізаційної системи породило побоювання щодо хвороб. Безліч голодних блукає містом, полюючи на цівку допомоги, яку ОАД доставляє розбитими дорогами, або на пожертвувану миротворцем половину пайка. Та навіть ці крихти приносять більше полегшення, ніж чергова порожня заява їхнього власного уряду."
 
 BRP_rural_insurgency: "Сільське повстання"
 BRP_rural_insurgency_desc: "Щось знайоме проростає в червоній землі та пишних полях Парагваю. Повстання.\n\nМаючи коріння, що сягає Війни Потрійного альянсу, партизанські рухи знову розквітли через іноземну окупацію. Хоча їх рясно удобрюють дисиденти колишніх комуністичного та фашистського режимів, опір переважно підтримується широко поширеними націоналістичними настроями.\n\nЦе похмуре цвітіння поставило перехідний уряд у скрутне становище. Чим довше залишаються бразильці та аргентинці, тим більше виснажується його легітимність. Але якщо він вимагатиме їхнього відходу... що ж, бур’яни збройної опозиції можуть просто задушити його саме життя."
 
 BRP_forced_liberalisation: "Примусова лібералізація"
 BRP_forced_liberalisation_desc: "Щоб дарувати Парагваю його ліберальне майбутнє, окупанти сповнені рішучості викорінити зловісне минуле нації. Посадовців фашистської диктатури Морініґо та короткочасного комуністичного режиму без зайвих роздумів піддають чистці, а їхні ініціативи різко припиняють. Деякі з них, як-от спроби червоних колективізувати землю, поспішно повертають назад. Корпоративні структури, які ще вчора з тоталітарною енергією правили країною, сьогодні не більше ніж абревіатура та забиті дошками двері офісу.\n\nПанують розгубленість і розпач, коли знайоме та функціональне зникає. Можливо, їхнє місце посяде новий і кращий Парагвай. Але поки що — хаос."
 
 BRP_brain_drain: "Відтік мізків"
 BRP_brain_drain_desc: "Якщо прагнення Бразилії до ліберального, демократичного та стабільного Парагваю мають здійснитися, у неї немає важливішого партнера, ніж парагвайський професійний клас. Кілька ініціатив, зокрема непропорційна увага до відновлення Асунсьйона, були спрямовані на зміцнення та закріплення зв’язків із цією освіченою елітою.\n\nОднак багато парагвайських професіоналів використовують ці зв’язки, щоб переселитися безпосередньо до Бразилії. Сан-Паулу та Куритиба пропонують значно більше економічних можливостей і вищу якість життя, ніж їхня зруйнована земля.\n\nА тепер, спостерігаючи за насильством, що охоплює сільську місцевість, багато голодних і відчайдушних парагвайців без таких навичок усвідомлюють те саме..."
 
 ARP_casados_estate: "Маєток Касадосів"
 ARP_casados_estate_desc: "Ще до проголошення перемоги над Парагваєм аргентинський уряд уже мав на думці родину, яка допоможе йому нав’язати свою волю Парагваю; Касадосів.\n\nМаючи вплив ще від першого вторгнення до Парагваю, Касадоси стали надзвичайно впливовими завдяки своїм діловим зв’язкам і лобіюванню в аргентинському Міністерстві закордонних справ. Касадоси пропонують уряду список придатних колаборантів для найму. У відповідь вони вимагають автономії у своїх справах, яку Буенос-Айрес визнав за доцільне надати."
 
 ARP_king_cotton: "Король бавовни"
 ARP_king_cotton_desc: "Буенос-айреські бізнесмени, які профінансували втручання Аргентини в Парагвай, тепер прагнуть отримати максимум від свого розширеного володіння. Їхньою винагородою, таким чином, стала бавовна, їхня частка виробництва значно перевищує частку місцевих фермерів, яких похитнули роки кризи та занедбаності. Для місцевих жителів це ще одна витрата, що виходить із їхніх кишень, тоді як Король Бавовни та його міністри далеко звідси розраховують нажити статки."
