 PAR_OAS.24.t: "Залишаючись окупованими"
 PAR_OAS.24.desc: "Будь поважним. Будь пильним. Не заводь друзів. Це були три принципи, які втовкмачували рядовому Анхелю Ортезі під час брифінгів перед його відправленням до Асунсьйона. Ортега вважав, що їм варто було додати четвертий: "навчися розважати себе". Його робота полягала в тому, щоб копати камінці й крутити пальцями під час патрулювання району приблизно за милю від Сільвіо Петтіроссі. Дні, здавалося, зливалися в одне — змушуючи Ортегу бажати або хоч трохи дії, або оголошення, що вони нарешті зібрали достатньо компетентних поліцейських, щоб американські миротворці могли піти.\n\nЦе був або четвер, або п'ятниця, коли футбольний м'яч викотився з поля просто перед його ногами. Ортега повернув голову й побачив гурт дітей віком приблизно від восьми до дванадцяти років, які сперечалися, хто винен у тому, що м'яч залетів аж сюди. Сварка поступово стихла, а потім усі діти витріщилися на Ортегу. Група худорлявих дітей його не залякала. "Хочете його назад?" — запитав він іспанською, вказуючи на м'яч біля своїх ніг. Лише тиша й погляди. Ортега фиркнув і копнув м'яч назад до дітей. Чорно-білий м'яч підкотився до їхніх ніг, але вони його не підняли. Вони просто продовжували дивитися й хмуритися. Гаразд. Як хочете. Ортега продовжив іти. Він почув більше розмов і сміху за рогом. Щойно він завернув за нього, троє чоловіків на ґанку кутового будинку перестали сміятися й просто витріщилися на нього, так само як діти. Ортега так само похмуро подивився на них і продовжив іти, копнувши камінець зі свого шляху. Нічого, з чим він не був знайомий."
 PAR_OAS.24.a: "Підтримуючи хиткий мир."
 
 PAR_OAS.25.t: "Розділений Будинок Америк"
 PAR_OAS.25.desc: "Коли Альфонсо Ґарсія Роблес підвівся, гомін делегатів, що сиділи поруч і перед ним у трикутному розташуванні Будинку Америк, стих. Як міністр закордонних справ і досвідчений дипломат, він добре знав штаб-квартиру ОАД у Вашинґтоні, хоча рідко мав нагоду звертатися до всього органу. Але вторгнення до Парагваю було саме такою нагодою.\n\n"Мої колеги-делегати, дозвольте чітко висловити позицію Мексиканської Республіки." Ґарсія Роблес говорив прямо. "Ми рішуче засуджуємо заплановане вторгнення до Парагваю. Ми розумі-"\n\nДеякі інші делегати заглузували. "Ми розуміємо позицію Аргентини та Бразилії й розуміємо небезпеку, яку становить комуністичний режим в Асунсьйоні. Ніхто з нас не радий бачити, як ця бідна нація переходить від однієї крайності до іншої. Але така агресивна відповідь уб'є та прирече на злидні тисячі невинних! Вона створить покоління мучеників! Натомість ми повинні поважати національний суверенітет Парагваю та негайно розпочати діалог із новим режимом, щоб запропонувати шлях до поміркованості."\n\n"Нісенітниця", — сказав Араужу Кастру, бразильський представник за столом навпроти. Ґарсія Роблес прямо повернувся до нього, але його погляд був майже співчутливим.\n\n"Мій добрий друже, боляче чути, як ви це кажете, адже ми так добре ладнали під час мого перебування на посаді посла у вашій великій країні. Я знаю бразильців як народ миру! Ми можемо позбавити цей прекрасний континент ще однієї кривавої плями, якщо ви лише зміните свою думку!"\n\nКімната вибухнула перехресними вигуками та образами. Кубинський представник радісно закричав і зааплодував. Аргентинський та бразильський делегати почали гнівно засуджувати промову. Американський голова просто дивився у вікно, явно роздратований."
 PAR_OAS.25.a: "Голос проти мілітаризму, відданий наперекір течії."
 
 PAR_OAS.26.t: "Термінал"
 PAR_OAS.26.desc: "Погляд Уґо Б. Марґаїна нетерпляче метався від перону за вікном до радіотелефону поруч із ним у салоні літака, що прямував до Вашинґтона й застиг на злітній смузі аеропорту. Ранкове світло щойно здіймалося над терміналом, а міністр закордонних справ зробив ще один ковток кави. Президент Салінас, безперечно, мав зателефонувати будь-якої хвилини, але час спливав. Йому потрібно було бути в повітрі через пів години, якщо він хотів встигнути на екстрений саміт ОАД.\n\nМарґаїн одразу вирушив до Салінаса, щойно саміт було скликано, і обидва чоловіки провели більшу частину попередньої ночі, обговорюючи несподівану новину — американцям вдалося посередництвом укласти угоду між ворогуючими урядами Аргентини та Бразилії про координацію під егідою ОАД вторгнення до Парагваю з метою повалення нового комуністичного режиму. Резолюцію щодо операції, заради процедури, мали винести на голосування всіх держав-членів ОАД, і Марґаїн проклинав незручне становище, у яке це ставило Мексику.\n\nДебати щодо того, як голосувати, тривали всю ніч, аргументи зважувалися знову й знову — голосування проти на основі доктрини Естради про невтручання розлютило б дружніх до Янкі бізнесменів та важливих потенційних торговельних партнерів у Латинській Америці. Сам Марґаїн постраждав би, ризикуючи контактами й навіть дружбою у Штатах. І все ж він віддавав цьому перевагу перед боязким утриманням, яке було б непопулярним удома та серед решти Пакту Веракруса, — вони сказали б, що це ще одна зрада революційних ідеалів уряду Салінаса. Це була та погана преса, якої їм слід було уникати.\n\nПрезидент, усе ще невпевнений, планував проконсультуватися з Алеманом, Барріосом та іншими перед ухваленням остаточного рішення — рішення, на яке Марґаїн неспокійно чекав того ранку на пероні."
 PAR_OAS.26.a: "Коли дзвінок нарешті пролунав, Салінас сказав йому утриматися."
 PAR_OAS.26.b: "Коли дзвінок нарешті пролунав, Салінас сказав йому проголосувати проти резолюції."
 
 PAR_OAS.27.t: "Тривога щодо виступу"
 PAR_OAS.27.desc: ""Ви можете в це повірити, Ваша Високосте?" — голос Антоніо Каррільйо Флореса затріщав у слухавці. "Бразилія та Аргентина нарешті знайшли щось, у чому вони погоджуються."\n\nОрдас постукав по столу й лише ствердно промимрив у відповідь своєму міністру закордонних справ. Каррільйо знову заповнив тишу, телефонуючи захищеною лінією безпосередньо з мексиканського посольства у Вашинґтоні.\n\n"Шкода, що їхньою спільною позицією є вторгнення до Парагваю, але від них не можна очікувати, що вони терпітимуть зграю комуністичних партизанів як сусідів. Наші друзі тут нагорі в захваті від того, що вони уклали угоду, тож уся операція відбуватиметься під егідою ОАД. Державам-членам ОАД, звичайно, ще потрібно проголосувати за неї завтра."\n\n"Це майже як хрещення, чи не так?" — нарешті похмуро відповів Ордас. "Гадаю, ваші нинішні співрозмовники схиляють нас проголосувати за?"\n\n"Вони віддали б цьому перевагу, так, хоча принаймні деякі з них чули про доктрину Естради й розуміють наше делікатне становище. Тихе, без зайвого галасу утримання в Будинку Америк не повинно надто роздратувати нікого тут чи вдома."\n\nПопри слова міністра, в голові Ордаса визрівала думка — голосування за операцію дало б зрозуміти, що Мексика не терпить екстремізму, і цілком могло б здобути прихильність американців. Але слова застрягли в нього в горлі. Питання зовнішньої політики завжди давалися йому нелегко, особливо після того принизливого епізоду з Алеутами. Ліві протестуватимуть — і кубинці також — він міг очікувати лише кількох розлючених дзвінків із Гавани.\n\n"Ваша Високосте? Щось не так із лінією? Я вас не почув.""
 PAR_OAS.27.a: ""Звичайно, ви маєте рацію. Дайте зрозуміти, що Мексика утримується.""
 PAR_OAS.27.b: ""Насправді, Каррільйо, ми проголосуємо за резолюцію.""
 

