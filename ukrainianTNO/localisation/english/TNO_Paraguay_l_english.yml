 ##Starting Spirits
 
 PAR_bastion_of_latin_american_fascism: "Оплот латиноамериканського фашизму" 
 PAR_bastion_of_latin_american_fascism_desc: "Парагвай стоїть високо, гордий і непокірний, як єдиний захисник великої фашистської ідеї на американському континенті, як острівець серед розбещених плутократій, що принижуються перед своїми господарями з ОВН. До нашої фортеці приїжджають німецькі радники, оперативники, інженери та торговці, а також праві вигнанці з усього континенту. Осмілюючись виступити на захист нашого народу, ми відгородилися від сусідів, але це мало що значить, адже Парагвай є бастіоном проти деградації." 
 PAR_bastion_of_latin_american_fascism_tt: "§YМожуть підтримувати фашизм на регіональному рівні.§!" 

 PAR_avanee: "Аваньє" 
 PAR_avanee_desc: "Аваньє — це мова гуарані, яка в дослівному перекладі означає «Мова народу». Унікально для континенту, вона використовується в усіх шарах суспільства і поширена навіть більше, ніж «Мова панів» Караїньє'е, або іспанська. Поки наші сусіди відкидають свою корінну спадщину в божевільному прагненні здаватися європейцями, ми визнаємо, що наш однорідний народ є сплавом великих іберійських та американських рас. Унікальність нашої культури та мови дає нам силу, єдність і виразний національний характер." 
 PAR_the_chokehold: "Тіньова провінція" 
 PAR_the_chokehold_desc: "З моменту входу союзних військ до Асунсьйона в 1869 році, Парагвай економічно та політично підкоряється одному з його сусідів. З 1930-х років це Аргентина, яка фактично стала гегемоном. Аргентинські економічні інтереси переважають у майже всіх аспектах економічного життя, де аргентинські компанії або аргентинські філії транснаціональних корпорацій мають монополії на перевезення, комунікації, транспорт і нафтопереробку, а також володіють практично всією землею в Гран-Чако. Дипломатична ізоляція Парагваю змусила його все більше покладатись на Аргентину. Військова та дипломатична підтримка Аргентини є абсолютно необхідною для забезпечення продовження, а тим більше успіху зовнішньої політики Парагваю та виживання його режиму." 
 PAR_political_tarot: "Політичне Таро" 
 PAR_political_tarot_desc: "Диктатура Морініго не збудована лише на компромісах і співпраці, але й на виживанні найсильніших. На практиці це означає політику, спрямовану на спробу задовольнити всіх одночасно, але поки що стабільний приплив німецького капіталу дозволяє режиму успішно згладжувати ці суперечності. Трон багнетів може бути не вічним, адже окультні сили організовуються як всередині, так і поза межами Вітчизни, щоб покласти край колесу фортуни."

 PAR_bush_war: "Війна Буша" 
 PAR_bush_war_desc: "Повстанці та інсургенти, організовані та натреновані в екзилі, проникли до Парагваю та завдали удару по парагвайському режиму, який страждає від внутрішніх суперечок і нестабільності. Ведучи партизанську війну з наміром повалити уряд, існування національної революційної держави під загрозою. Для їх успіху вони повинні відновити контроль - і рішуче придушити повстанців, які прагнуть їхнього знищення."

 ##Ministers
 PAR_Juan_Natalicio_Gonzalez_hog_desc: "§YГлава уряду\nФашистський популізм§!\n--------------\n§LМабуть, немає нікого, хто був би більш відповідальний за сучасний Парагвай, ніж Хуан Наталісіо Гонсалес, навіть сам Морініго — адже Морініго є лише грубим силачем, що утримує Парагвай на його теперішньому курсі, в той час як Наталісіо — це той, хто визначив цей курс.\n\nНаталісіо — видатний поет і есеїст покоління 1900-х, який протягом усієї своєї кар'єри пропагував шляхетність того, що він називає «гуараніською расою», і стверджував, що вона має тенденцію процвітати під авторитаризмом. Він заснував культурний журнал Guarania для поширення своїх ідей і парамілітарну групу Guardia Urbana для їхнього захисту; і тепер, будучи розумом для сил Морініго, Наталісіо проведе Парагвай до своєї візії нового золотого віку.§!"
 PAR_Rodney_Elipdio_Acevedo_for_desc: "§YМіністр закордонних справ\nКорпоративний статизм§!"
 PAR_Epifanio_Mendez_Fleitas_eco_desc: "§YМіністр економіки\nПеронізм§!\n--------------\n§LEпіфаній Мендес Флейтас, директор центрального банку, є дивним явищем у кабінеті Морініго. Він пероніст, виступає за централізоване планування та контроль за цінами, єдиний голос на користь Аргентини та єдиний професійний класичний гітарист.\n\nХоча Флейтас відіграв важливу роль у підйомі Морініго до влади, все ж його бідне сільське походження стало його орієнтиром протягом багатьох років стримування режиму зсередини. Його фракція Епіфаністів відображає його політичний хист у включенні популістів як зліва, так і справа, і дозволила Флейтасу пережити два десятиліття чисток і репресій.§!"
 PAR_Auguste_Ricord_sec_desc: "§YМіністр безпеки\nКорпоративний статизм§!\n--------------\n§LВідомий своїм парагвайським колегам як "Ель франсес" або "Ель Команданте", Рікор служить у Парагваї як один із численних радників Райху для найбільш ганебного фашистського режиму Америки. Наразі є членом дивізії СС-Шарлемань на спеціальному закордонному завданні, Рікор був набраний з підрозділу Шарлемань після його розпуску під час формування Орденштату в 1958 році. З 1961 року він відзначився у керівництві Національною поліцією Парагваю, використовуючи своє знайомство як з операціями проти партизанів, так і з міжнародним кримінальним підпіллям, що принесло великий успіх.§!"
 
