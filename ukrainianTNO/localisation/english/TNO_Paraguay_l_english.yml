 PAR_invasion.1.t: "Великі слова на Малому острові"
 PAR_invasion.1.desc: "Невеликі розміри острова Мартін-Ґарсія робили непропорційно велику присутність військових об'єктів на ньому майже комічною. Та все ж цей невеликий острів завдовжки 2 кілометри, завдяки своєму розташуванню в гирлі річки Ла-Плата, ревно охоронявся аргентинськими військовими, а зі свого боку оскаржувався Уругваєм. Сьогодні, однак, це було місце, куди володар Ла-Плати прибув не для суперечки, а для домовленості. Мало хто міг уявити ситуацію, за якої прибуття літака ВПС Бразилії на злітну смугу острова було б зустрінуте настільки тепло. Для полковника Карлоса де Мейри Маттоса, пасажира цього літака, усе було так само. Як висхідна зірка бразильських військових, Маттос радше очікував вторгнення на острів, ніж переговорів на ньому.\n\nІншим чоловіком, який радше пішов би на війну зі своїм співрозмовником, ніж розмовляв би з ним, був Едуардо «Боча» Урібуру, нещодавно підвищений до бригадного генерала і, можливо, найзатятіший представник націоналізму в Аргентинській армії. Неохоче супроводжуючи міністра закордонних справ Маріо Амадео, Урібуру привітав бразильського полковника та двох уругвайських генералів, Омара Порсінкулу й Уґо Тірібоккі, які раніше прибули човном із Колонії.\n\nОфіцери військово-морських і повітряних сил, а також чиновники міністерств закордонних справ усіх трьох країн, що тепер зібралися в будівлі штабу ВМС, перейшли до обговорення питання, яке стало настільки нагальним, що змусило їх співпрацювати: чорної вівці Ла-Плати — Парагваю.\n\n«Як зазначено в нашому меморандумі до бразильського та уругвайського міністерств закордонних справ, перемога комунізму в Парагваї була б неприйнятною для Аргентини. Однак у такому випадку ми не хотіли б діяти проти нього без згоди й, більше того, допомоги наших сусідів». Амадео, відомий націоналіст, був, утім, розумним геополітичним діячем, і його готовність використовувати механізми консультацій, що стали більш поширеними після Війни, мабуть, і робила його такою корисною людиною на посаді міністра закордонних справ Аргентини.\n\n«Хоча ми не хотіли б поспішних дій — ми, бразильські військові, також не можемо погодитися з урядом таких характеристик у Парагваї». Маттос випустив дим зі своєї сигарети, поки пара підлабузників з Ітамараті кивала головами на знак згоди з контролем військових над зовнішньою політикою. «Це потребує детальнішого обговорення».\n\n«Безперечно». У відповідь Амадео відчувалося самовдоволене й дещо ображене підтвердження, яке перекладачка, що втрутилася, щосили намагалася пом'якшити. «Ніхто з нас не хоче повторення 1870 року»."
 PAR_invasion.1.a: "Про що це взагалі аргентинці?"

 PAR_invasion.2.t: "Поділ Парагваю"
 PAR_invasion.2.desc: "Відтоді як кілька місяців тому почалися перші зустрічі в Мартін-Ґарсія, представники військових сил усе ще гіпотетичного Потрійного союзу дещо захопилися своїм завданням. Дійсно, декого цілком справедливо можна було б звинуватити в тому, що вони сподівалися на перемогу комуністів у Парагваї, аби вся їхня підготовча робота не виявилася марною.\n\nСеред аргентинських представників, зокрема, існувала думка, що такий розвиток подій може назавжди розв'язати проблему Парагваю як геополітичного утворення. Протягом наступних місяців їхні зусилля були спрямовані радше на забезпечення Аргентині левової частки населеного центру Парагваю як окупаційної зони. Однак через бразильську непоступливість їм довелося погодитися на те, що столиця, Асунсьйон, опиниться в уругвайській зоні окупації. Мабуть, найпоширенішою рисою серед аргентинських переговорників була глибока образа через бразильський обман наприкінці останньої парагвайської війни, якого вони, здавалося, були сповнені рішучості уникнути.\n\nЧастково через цю незвичну жагу до війни з боку генерала Урібуру присутні на зустрічах бразильські полковники стали дещо неохочими продовжувати цей проєкт. Від цього їх відмовив лише прибуття генерала Албукерке Ліми, запеклого антикомуніста, яких ще пошукати. Проте новоприбулий генерал, здавалося, більше цікавився планами повернення Парагваю до нормального життя, включно з його повним відновленням як незалежної держави.\n\nЩодо уругвайського дипломатичного та військового персоналу, який брав участь у зустрічі, то вони були чітко поділені на два табори. Націоналісти навколо Порсінкули переживали найкращі часи, розповідаючи про те, якими героями їх вважатимуть удома, тоді як ліберали під керівництвом Тірібоккі дедалі більше були стривожені схильністю Урібуру та Албукерке Ліми вважати прояви й тенденції парагвайської опозиції, цілком нормальні для уругвайської політики, достатньо комуністичними, щоб самі по собі виправдати інтервенцію. У будь-якому разі їхнім першим пріоритетом було не дати націоналістам привласнити всю славу, щоб уникнути катастрофи, якою стало б захоплення Збройних сил націоналістами. Відсутність поваги їхніх сусідів до уругвайського суверенітету була проблемою майбутнього."
 PAR_invasion.2.a: "Майбутнє малих держав не видається світлим."
 
 PAR_invasion.3.t: "Реалполітика"
 PAR_invasion.3.desc: "«Це безглуздя!» — вигукнув Ґуларт, ударивши кулаком по столу. «Ви хочете, щоб я скоїв злочин імперіалізму, аби зупинити імперіалізм? Ви не бачите проблеми в цій маленькій ідеї?»\n\n«Перепрошую, пане, але ви повинні думати про військових. Вони дедалі більше нервують через Парагвай, і незалежно від того, втрутимося ми чи ні, аргентинські чоботи перетнуть кордон. Це станеться не зараз, але вже скоро». Арґеміро, військовий міністр Ґуларта, благав його.\n\n«І що? Ви хочете, щоб я вторгся, аби задобрити армію? Ісусе на небесах, вони вже хочуть мене вбити, Арґеміро. Вони задушили б мене цим самим телефонним дротом, розумієте?»\n\n«Я розумію, пане! Але Червоний Парагвай — це занадто для більшості Генерального штабу. Якщо ми дозволимо Аргентині розшматувати Парагвай, вони приставлять кинджал просто до нашого серця. Будь ласка, пане, я вас благаю. Просто підпишіть наказ. Не думайте про це як про вторгнення, думайте про це як про гуманітарну інтервенцію!»\n\n«О, я й не знав, що ви родич братів Даллесів!» — зітхнув Ґуларт, потираючи чоло. «Ех, я поговорю з вами пізніше. Наступного разу особисто».\n\nҐуларт поклав слухавку й сперся рукою на голову. Дивлячись назовні, Ґуларт не міг не замислитися. Скільки його дій було продиктовано щирим бажанням робити добро? А скільки його дій — чистою, дикою необхідністю? Лише для того, щоб зберегти контроль над фактом, що завтра він прокинеться Президентом Бразилії — а не якимось в'язнем маріонеткової хунти ОВН, яка прийде до влади.\n\nТепер йому доводилося боротися, щоб зберегти контроль над цим фактом. І якщо Арґеміро мав рацію, то так само доведеться вчинити й решті країни. Парагвай не зробив йому чи Бразилії нічого поганого. Принаймні безпосередньо. Але безпосередні обставини не мали значення. Парагвай був інструментом тиску на військових. Його рятівним кругом, що тримав його на плаву. Прокляття на будь-кого іншого."
 PAR_invasion.3.a: "Віддати наказ."

 PAR_invasion.4.t: "Тінь над Південною Америкою"
 PAR_invasion.4.desc: "Попри все, ФУЛНА вийшла переможницею, змивши всіх, хто їй протистояв. Парагвайська Війна в джунглях завершилася, а ФУЛНА транслювала свої тріумфи з Асунсьйона решті континенту. Однак усі страхи щодо локалізованого, ізольованого Червоного Парагваю розбилися — і в найгірший можливий спосіб. Вийшовши з тіней парагвайських джунглів, Че Ґевара розкрив себе як справжнього лідера ФУЛНА.\n\nСитуація стала абсолютно жахливою. Че відкрито говорить про те, що весь континент має піти тим самим шляхом, що й Парагвай. Його точне місцеперебування невідоме, але не було б дивно, якби революційні осередки вже пройшли підготовку, щоб здійняти пекло. Боротися з тероризмом у наших кордонах було б марною справою, коли чорне, гниле серце знаходиться в межах нашої досяжності.\n\nЩоб зустріти майбутнє, потрібно звернутися до минулого. Відродження Потрійного союзу для протистояння парагвайській загрозі має бути відновлено. Вже почалися плани переговорів у Монтевідео, щоб обговорити наступний крок. Якщо Аргентина вже цілком готова, то це лише питання часу, коли Бразилія та Уругвай приєднаються до коаліції. Схоже, якщо Че хоче Народної війни, він неодмінно її отримає."
 PAR_invasion.4.a: "Південна Америка йде на війну."

 PAR_invasion.5.t:0 "Погоджуємося не погоджуватися"
 PAR_invasion.5.desc:0 "У тісній задній кімнаті в Монтевідео доля Південної Америки змінювалася назавжди. Дипломати сіли на трьох рядах стільців. Бразилія ліворуч. Уругвай посередині. Аргентина праворуч. У центрі міцний стіл із червоного дерева тримав розкладену велику, просту карту Парагваю. Усі в кімнаті хотіли й мусили поставити Ґевару на коліна. Як саме — дуже просте питання, яке мав вирішити Генеральний штаб Потрійного союзу. Складніше було питання, що робити після цього.\n\n«Ліберали-фебреристи — наш єдиний варіант, якщо ми хочемо не дати Парагваю розвалитися зсередини», — бразильський дипломат вказав на великі заштриховані точки, що перетинали кордон Парагваю та його сусідів. «Можливо, нам доведеться надати їм певну допомогу в управлінні, якщо все піде для них надто погано. Нейтральний Парагвай, яким керуватимуть ліберали-фебреристи, вирішить проблему».\n\n«Навіщо нам відмовлятися від Парагваю? Ми можемо просто погодитися на розкол держави й розійтися кожен своїм шляхом, хіба ні? Відновлювати Парагвай після такого злочину — це для мене божевілля», — заперечив аргентинський колега. Багато хто з аргентинської — і навіть дехто з бразильської — команди кивнув і пробурмотів на знак згоди.\n\n«Вторгнутися до суверенної країни — це одне. Утримувати її — зовсім інше. Якщо ви хочете вести глибоко непопулярну партизанську війну проти сил Че — вперед. Але відновлення країни — найдешевший і найнадійніший варіант для всіх нас», — заперечив бразилець.\n\nАргентинський дипломат замовк і вказав на Асунсьйон.\n\n«А як щодо самого серця всього цього? Якщо тільки ви не хочете, щоб усі ми, пліч-о-пліч, ділили між собою місто, тут потрібно щось зробити».\n\n«Тоді віддайте його нам», — перебив уругвайський генерал. «Ви двоє перегризете одне одному горлянки через Асунсьйон. Можете так само віддати місто тому, чиї руки ще не в крові».\n\nБразилець та аргентинець подивилися на уругвайця. Знизавши плечима, вони згорнули карту й прибрали її."
 PAR_invasion.5.a:0 "Якщо Парагвай не зміг визначити свої кордони, то це зробить хтось інший."

 PAR_invasion.6.t:0 "Суперечки через дрібниці"
 PAR_invasion.6.desc:0 "День другий. Усе так само, як учора: дипломати сіли на своїх звичних місцях. Кілька хвилин кави, ще кілька — порожньої розмови. Як і вчора, зрештою люб'язності поступилися місцем холодній дипломатії.\n\nБразильський представник розгорнув ту саму карту Парагваю, що й учора. На карті нашвидкуруч нашкрябані лінії та риски стикалися з поспішними нотатками й доповненнями, нанесеними по всій країні. Свідчення незліченних невдалих пропозицій і планів кожної зі сторін.\n\n«Можливо, ми зможемо кудись просунутися з цим... питанням впливу, яке тут виникло», — сказав аргентинський представник, і його очі не могли приховати недосипу. «Ми не можемо дозволити собі витратити ще один день на суперечки про те, кому дістанеться який шматок!»\n\nВперше вся кімната була єдина у своїй згоді, киваючи. Звісно, усі хотіли угоди. Просто вона мала бути на їхніх умовах.\n\n«Отже, ви погоджуєтеся з нашими умовами? Ви окуповуєте Парагвай, але ми зберігаємо окупацію Асунсьйона? Хіба це не буде найсправедливішим способом його поділу?» — відповів бразилець. Кімната знову стихла.\n\n«Ви хочете, щоб нас розстрілювали веселі партизани Че, поки ви грабуватимете Асунсьйон? Чому б тоді не захопити Буенос-Айрес, якщо ви так відчайдушно цього хочете?»\n\nУругвайський представник ступив уперед, тримаючи маркер. Мовчки він провів лінію просто через Парагвай. На півдні було позначено A — Аргентина. На півночі — B, для Бразилії. Потім він намалював маленьке коло навколо Асунсьйона. U — Уругвай.\n\n«Беріть або залишайте. У будь-якому разі це найближче до угоди, чого ми досягнемо».\n\nЯк і вчора, вони хвилину дивилися на пропозицію. Першим поступився бразилець і знову сів. Аргентинець, переконавшись, що виглядає найупертішим у кімнаті, неохоче поступився й пішов."
 PAR_invasion.6.a:0 "Ще одне питання вирішено."
 
 PAR_invasion.7.t:0 "Кінець конференції"
 PAR_invasion.7.desc:0 "Сьогодні знаменує кінець Монтевідеоської конференції. Якщо не брати до уваги наркопритон у Сан-Паулу, ніколи ще на південноамериканській землі не збиралася така жалюгідна купа махінацій і ударів у спину. Утім, усі представники можуть повернутися до своїх господарів, із посмішками на обличчях і підвищеннями в майбутньому. Доля Парагваю запечатана, а чорна буря війни збирається навколо ФУЛНА.\n\nЗа добре прихованими ігровими залежностями, забрудненими італійськими костюмами та наполовину пригладженим волоссям наші дипломати добре зіграли свою роль. Їхнім завданням було гарантувати, що більшовизм залишатиметься незрозумілою, вмираючою ідеологією, яка ніколи не стане нічим більшим за історичну дивину, що народилася з пінистої, жорстокої смерті Царської імперії.\n\nУмови, про які було домовлено, прості. Якщо більшовики коли-небудь переможуть у своїй громадянській війні в Парагваї, це становитиме найсерйознішу загрозу безпеці всього континенту. Тому єдиним можливим заходом має стати настільки ж драматичний крок. Має бути створено новий, відроджений Потрійний союз проти Парагваю. Армії Аргентини, Бразилії та Уругваю разом рушать, щоб визволити народ від богопротивної ідеології Маркса й Леніна. Ми повалимо ФУЛНА та відновимо по-справжньому вільну, ліберальну демократію в Парагваї, підвладну не якійсь силі, а лише самим собі!\n\nАле поки що все, що ми можемо робити, — це спостерігати. Подивімося, чи зможе Парагвай належним чином визначити свою долю. Якщо ні, ми зробимо це самі."
 PAR_invasion.7.a:0 "Сцена готова."

 PAR_invasion.8.t:0 "Початок кінця"
 PAR_invasion.8.desc:0 "З Парагваю надійшли жахливі новини. ФУЛНА розгромила своїх ворогів в Асунсьйоні. Битва за Асунсьйон — якщо вірити нашим кореспондентам — була найжорстокішими й найкривавішими боями, які коли-небудь точилися на південноамериканській землі. Настільки жорстокою та запеклою була битва, що міжнародна преса назвала її «Паулюсбургом на Пількомайо», очевидно, посилаючись на жахіття Західноросійської війни. У будь-якому разі більшовики перемогли.\n\nНаші дні планування та координації не минуть даремно. Договір, який ми підписали з нашими союзниками по Потрійному союзу, набуде чинності протягом кількох тижнів, якщо не днів. Тепер питання вже не в тому, чи вторгнемося ми до Парагваю, а в тому, коли. Наша армія перебуває в найвищій бойовій готовності, а наші ВПС готові обрушити на парагвайців кожну бомбу з нашого арсеналу.\n\nЄдине, що нам потрібно, — належним чином розташувати військових на кордоні. Немає сенсу тренувати наших людей до дня, який настане, якщо наші солдати навіть не перебувають поблизу самого Парагваю. Коли ми будемо готові, угоди набудуть чинності — включно з підпунктом, за яким Уругвай має право проводити свої війська через наші кордони протягом усього часу війни, — і розпочнеться Друга війна Потрійного союзу. Нам залишається лише віддати наказ."
 PAR_invasion.8.a:0 "Барабанний бій війни лунає дедалі гучніше з кожним днем."

 PAR_invasion.801.t:0 "Із тіней"
 PAR_invasion.801.desc:0 "Документи не брехали. І коли Шпеєр читав звіти Ґелена, південноамериканці теж не брехали. Практично миттєво слабка чутка про можливу інтервенцію в Парагвай у разі перемоги ФУЛНА перетворилася на факт. Факт, що Південна Америка не змириться з цією поразкою. Поки Шпеєр перегортав сторінки, немов дитина книжку з картинками, армії Потрійного союзу готувалися до жорстокої боротьби за свої долі. Наступні місяці визначать долю Південної Америки. На брудних, вибоїстих дорогах до Асунсьйона та назад і у вологих, задушливих джунглях навколо міста. Саме на перетині жахливих обставин і людської відваги кувалася доля континентів.\n\n«У нас, однак, є агенти всередині міста, але вони ризикують бути схопленими, якщо завершать свою місію», — голос Ґелена повернувся до уяви Шпеєра. «Склади постачання Ґевари розкидані по всій долині. Наші агенти належним чином оснащені, щоб саботувати ці склади, коли почнеться вторгнення».\n\nПравда полягала в тому, що Шпеєра не цікавили тонкощі міжнародної дипломатії. Можливо, річ була у його віці, але йому було дедалі важче слухати, як Ґелен просторікує про переміщення цього активу до цих координат або про те, який тип пістолета має використовувати кожен агент. Він був архітектором. Колосальний, розлогий палац — ось що мало для нього значення, а не те, яким різцем користувалися. Парагвайська війна була лише черговим будівельним проєктом для Фюрера. Не мало значення, як це станеться; бо сам факт завершення переважував усе інше. Більшовизм був надто небезпечним вірусом, щоб процвітати вмираючій, застійній політиці Латинської Америки. Він поширювався б і розмножувався, доки не залишилося б нікого, хто побачив би його кінець. Метод його знищення мало його цікавив.\n\n«Чи можемо ми гарантувати перемогу Потрійного союзу, чи як вони там себе називають?» — перебив Шпеєр.\n\n«Ні», — сказав Ґелен. «Однак це найкраще з другого, що в нас є. Промисловість, життєво важливі комунікаційні лінії, ра-»\n\nШпеєр підняв руку, перериваючи Ґелена."
 PAR_invasion.801.a:0 "«Тоді цього нам достатньо. Нехай південноамериканці завершать розпочату нами роботу»."

 PAR_invasion.9.t:0 "Майже час"
 PAR_invasion.9.desc:0 "Президент відклав листа, зітхнувши. Аргентина дала про себе знати. Як він прочитав у листі, їхні війська прямували до кордону. Колони людей, танків і вантажівок тягнулися до самого горизонту. У листі не було нічого особливо шокуючого. Аргентина й навіть крихітний Уругвай уже підготували свої військові сили до початку вторгнення. Їм бракувало лише Бразилії. Президент подивився назовні, у бік Бразиліа. Сонце сідало за його спиною, купаючи столицю в яскравих відтінках помаранчевого, рожевого й червоного. Назовні цятки фар автомобілів поволі поверталися додому, то згущуючись, то розріджуючись разом із рухом. Стоп. Потім рух. Стоп. Потім знову рух.\n\nВони не розуміли, у якому світі живуть. Звісно, простолюдин знав про їхній світ. Вони читали газети, поглинали звіти й споживали телебачення. Це був санітизований світ. Ілюзія, яку він та його міністри — разом із їхніми попередниками — створили, немов майстерний ремісник. Незалежно від того, знали вони про це чи хотіли цього, головним завданням Президента було тримати вовну на очах свого народу, водночас просуваючи їхні інтереси. Навіщо їм знати? Навіщо їм знати, наскільки насправді крихким було їхнє життя і що за найменшої зміни вітру їхні життя могли обернутися на руїни? У певному сенсі цьому майже можна було заздрити.\n\nЗвісно, Ґевара не був дурнем. Повітряна розвідка виявила десятки, якщо не сотні літаків на напіввідремонтованих авіабазах. За кілька місяців військові Парагваю перетворилися з розрізненої, але фанатичної групи студентів коледжу на висококваліфікований підрозділ, що включав справжні, повноцінні ВПС. Це було вражаюче. Цього було недостатньо.\n\nПрезидент зробив ковток зі своєї пляшки. Гірке, як попіл, але в цьому й полягала привабливість, чи не так? Через сім днів Бразильська армія збереться просто біля парагвайського кордону. Через сім днів вони затрублять у сурми війни й дозволять річці Парагвай почервоніти від крові їхніх співвітчизників. Через сім днів уся Південна Америка вирушить на війну. Що б не сталося далі — добре чи погане — усе це буде на їхніх плечах."
 PAR_invasion.9.a:0 "Спочатку трагедія. Потім фарс."

 PAR_invasion.10.t:0 "Друга війна Потрійного союзу"
 PAR_invasion.10.desc:0 "Усе вело до цього моменту. О 15:00 Аргентина, Бразилія та Уругвай офіційно оголосять війну Парагваю. Усі наші війська заповнили кордон гарматами, літаками й танками. Через п'ять хвилин — ні більше, ні менше — армії Потрійного союзу перетнуть кордон із Парагваєм. Кожен чоловік знає свою роль і своє завдання. Чи то стріляти, бомбити або їхати просто до Домініону Че, це буде одна з найкривавіших воєн в історії Південної Америки. Поки наші сили тренуються, те саме роблять сили Че. Було б нерозумно очікувати, що сили Че вестимуть звичайну війну з окопами й масштабними наступами, щоб витіснити нас.\n\nНі, Ґевара використає кожну останню зброю у своєму арсеналі, щоб захистити себе. Ми повинні бути — і ми є — готовими до кожної можливої тактики, яку парагвайська армія використає проти нас. Навчені підрозділи, озброєні знаннями про знешкодження пасток і боротьбу з партизанами, чекають на наш наказ. Однак багато хто в нашому уряді побоюється, що цього недостатньо. До Ґевари не можна ставитися легковажно. Його легенда має не меншу, а можливо, навіть більшу вагу, ніж діяння самого революціонера. Найжахливіше побоювання полягає в тому, що він дістане якусь таємну зброю чи тактику з найтемніших закутків Парагваю, готову знищити наших людей за першої ж нагоди.\n\nХоча ми знаємо, що це нісенітниця, мало хто з нашого командування очікує, що ця війна буде легкою. Це не буде війна, про яку наші онуки читатимуть у підручниках історії. Це не буде війна, що складатиметься з відважних героїв і сміливих кавалерійських атак. Це буде війна, пронизана таємницею й кровопролиттям. Боротьба, де кожен труп є перемогою тієї чи іншої сторони. Конфлікт, де межі між цивільними та бійцями розмиті й переплутані. Звірства відбуватимуться. І їх не буде мало й рідко. Вони не будуть прикрими. Вони стануть ходом подій надалі. За кожного чоловіка, якого вб'є Ґевара, ми вбиватимемо десятки його людей. Поки ми не виженемо більшовизм із Південної Америки, ніхто з нашого Потрійного союзу не зупиниться.\n\nМи спалили мости за собою. Південній Америці не залишається нічого, крім руху вперед."
 PAR_invasion.10.a:0 "Кричіть «Визволення», але спустіть гончих війни."

 PAR_invasion.11.t:0 "Напій за перемогу"
 PAR_invasion.11.desc:0 "Фрота одним духом випив келих шампанського. Воно було дивно солодким, наче полуниця в шоколаді. Воно також виявилося міцнішим, ніж він очікував, змусивши генерала скривити обличчя. Поруч Фіґейреду посміхався, розглядаючи Фроту.\n\n«Міцне, еге ж?» — засміявся Фіґейреду. «Із Французької Африки, якщо можеш повірити. Я не звинувачую їх у тому, що вони роблять такі міцні напої. Те, що походить із Темного континенту... порівняно з цим усе тут здається безневинним».\n\nВечірка — хоча, якщо врахувати, що це зібрання п'ятдесятирічних чоловіків, її важко було б порівняти з вечором у студентському братстві — була в розпалі. На сцені оперна співачка ревіла свої партії. Вона була прекрасна, саме такою Фрота уявляв собі оперних співачок Ваґнера. Дивно було бачити, як ці зазвичай стоїчні й жорсткі чоловіки весело починають імпровізовані танґо, але це була особлива нагода. Бразильська армія розгромила більшовизм; вигнала його в посушливу пустелю безвісності.\n\n«Тут?» — сказав Фрота. «Тут у нас усе чудово. Ми пробили кілок крізь серце Че й принесли мир континенту. Я не знаю, що там відбувається в Африці, але Південна Америка? Ми довели світові, на що здатні. Кажіть що хочете, але ми не слабаки».\n\n«Трохи драматично, але я згоден. Парагвай тепер наш. Я, щоправда, постійно отримую повідомлення про так звані партизанські атаки. Добрих 80% виявляються або спостереженнями, або надмірно завзятими солдатами, які побачили сільського хлопця зі зброєю. А в одному випадку це був жарт школярів. Вони вдягнулися в камуфляж і озброїлися купою феєрверків. Ледь не були застрелені своїми ж товаришами. І цілком заслужено».\n\n«А решта 20%? На що вони виявляються?»\n\n«Не має значення», — сказав Фіґейреду, виходячи зі свого заціпеніння. Стукнувши ложкою по келиху, він змусив кімнату стихнути. «Товариші! Ми непогано впоралися як для купки нещасних виродків! Але де б ми були без нашого улюбленого Президента? Він колективно сидить у нас у печінках і, як кажуть, найгірший гравець у покер у Південній півкулі! Але... саме він убив більшовизм у Латинській Америці».\n\nФіґейреду підняв келих, а разом із ним — Фрота та решта присутніх."
 PAR_invasion.11.a:0 "«За Президента Бразилії!»"

 PAR_invasion.12.t:0 "Жахлива катастрофа"
 PAR_invasion.12.desc:0 "Генерал Фіґейреду зробив ковток шампанського зі своєї пляшки. Із Французької Африки — або принаймні з того, що від неї залишилося. Це була найдивніша суміш гострої солодкості й одного з найміцніших напоїв, які він коли-небудь ковтав. Здавалося, ніби солодкість роз'їдала його нутрощі шматочок за шматочком. Враховуючи, що воно походило з крихітного феоду де Ґолля, для тих, хто його купив, це, мабуть, було полегшенням.\n\nНе було жодного можливого способу, яким Ґевара міг перемогти, як він це зробив. Усе й будь-що було проти нього. Жоден чинник не міг зіграти на користь Ґевари. Людські ресурси, якість зброї, тактика. І все ж кожна патрульна місія закінчувалася тим, що люди поверталися пошматованими або не поверталися взагалі. Партизани зникали в повітрі щоразу, коли проводилися пошуково-ударні операції, а люди, які їх проводили, зазвичай опинялися на кінці пунджі-пастки. Це було непробачно, неможливо, і все це відбувалося просто перед його очима.\n\nГенерал зробив ще один ковток із пляшки. Фотографії тіл були найгіршою частиною. Кістки стирчали з місць, про існування яких він навіть не знав. Купи кінцівок і частин тіл сягали йому до живота, усі лежали насадженими на вкриті фекаліями палі. Очі... о, вони безперечно були найгіршою частиною. Це була не просто ще одна частина тіла. Це був останній відбиток психіки хлопців — просто хлопців — відправлених на завдання без жодної можливої надії на успіх. Незалежно від того, чи були вони прикріплені до тіла, очі завжди, здавалося, дивилися в камеру. Вони не розповідали історію героїв, що впали в бою з ворогом, чи нещасного випадку, якого неможливо було запобігти. Ні. Ці трупи знали, хто їх убивця, хто зробив так, що тисячі батьків більше ніколи не зможуть тримати своїх дітей за руку. Він згрішив, і вся Південна Америка дізнається про це.\n\nЩе один ковток. Генералів не можна було звинувачувати. Вони просто виконували накази, чи не так? Згори, від людини, яку сам народ Бразилії наділив владою. Президент продовжував посилати людей на смерть, бо якщо він цього не робитиме, то заради чого тоді була смерть останнього чоловіка? Він був м'ясником тисяч. Руки генерала були залиті смертю, і навіть не він переступив межу людяності. Ні, він не згрішив. Але Президент — так."
 PAR_invasion.12.a:0 "Ножі гостряться."

 PAR_invasion.401.t:0 "Фюрер і революціонер"
 PAR_invasion.401.desc:0 "Шпеєр переглядав фотографії та папери, розкладені на його столі. Цього не могло бути. Йому навіть не потрібно було читати жодного речення звіту, щоб знати, що сталося. Нездари. Довбані нездари, які не змогли навіть вистояти проти купки ледь навчених студентів зі зброєю часів Першої світової війни. Шпеєр намагався приховати свою лють від зовнішнього світу. Не виходило. Перед ним Ґелен запалив сигару в кабінеті Фюрера.\n\n«Наш єдиний союзник на тому континенті. Повержений. І ким саме, Ґелен?» — запитав Шпеєр, відкладаючи папери. «Че Ґеварою? Якщо бути цілком чесним, я навіть не знав, що він живий. А ось він, керує країною...»\n\nҐелен нахилився вперед, складаючи сонцезахисні окуляри. Очі розвідника були червоні, кровоносні судини панували над ними, мов гілки хворого, вмираючого дуба. Безсонні ночі та невтомні дні, які пережив Ґелен, далися чоловікові взнаки. Та ось він тут. Павук, завжди обережний, щоб перевірити кожну останню делікатну нитку у своїй розлогій, колосальній павутині. І він не потерпів би жодної загрози їй.\n\n«Хоча нашого союзника більше немає, мій Фюрере, — кашлянув Ґелен. — Особи, які утримували його при владі, нікуди не зникли. У схованці, під прикриттям чи в іншому місці, ми все ще маємо чудове вікно в Парагвай. Що б вам не потрібно було дізнатися, мій Фюрере, наші агенти це виявлять. Власне, у мене є для вас хороші новини».\n\nҐелен передав Шпеєру нову манільську папку. Відкривши її, він побачив стенограми й монохромні фотографії генералів і полковників разом. «Непередбачені події», «Парагвайське питання», «Мобілізація проти Червоної загрози». Це був перший знак перемоги після низки поразок. Бразилія та Аргентина не змиряться з цією новиною. Вони усвідомлювали, так само як і він, небезпеку амбіцій Ґевари. Південна Америка давала відсіч.\n\n«Це фантастика! Я сподівався, що вони могли розібратися з цим раніше, але байдуже. Ґевара не має проти них жодного шансу. І я не стоятиму осторонь, поки вирішується доля Латинського світу. Ви вільні, директоре. Мені потрібно зателефонувати Шмідту».\n\n«Що ви скажете, мій Фюрере?»"
 PAR_invasion.401.a:0 "«Щоб переконатися, що Південна Америка знає, де ми стоїмо»."

 PAR_invasion.402.t:0 "Історія двох генералів"
 PAR_invasion.402.desc:0 "Фрота набрав номер Фіґейреду на своєму особистому стаціонарному телефоні. Було один-сім-шість, чи... ні, звісно, не так. Бразильський генерал приклав два пальці до скроні й заплющив очі. Який у нього знову номер? Він десь його зберіг, але прибиральник, мабуть, викинув. І треба ж було саме сьогодні забути чийсь номер. Фрота перебрав усі можливі комбінації, поки його не привітав глибокий, хрипкий голос із проханням назватися.\n\n«Це Фрота. Ви бачили новини, я припускаю? Чого, в біса, він від нас хоче? Від Парагваю? Я знаю, що німці з усіх людей не прихильні до соціалізму, але чому саме тут?» — сказав Фрота. Потягнувшись, він вимкнув радіо, де Альберт Шпеєр продовжував зачитувати очевидно заздалегідь підготовлену промову.\n\n«Я знаю, чому вони нас підтримують. Річ у тому, що я не думаю, що Буенос-Айрес це робить. Я щойно говорив телефоном зі своїм контактом у аргентинських військових. Познайомився з ним на новорічній вечірці в Росаріо. Хороший чоловік. Щоправда, зовсім не вміє пити. Він каже, що вони сприймають це позитивно! Шампанське і все таке», — сказав Фіґейреду.\n\n«Що? Вечірки? Ми збираємося вторгнутися до суверенної держави, а не святкувати довбаний бар-міцва», — зітхнув Фрота.\n\n«Знаю, але скажи це їм. У будь-якому разі, схоже, Німеччина хоче розправити крила над нашим прекрасним континентом. Вони знову демонструють силу, як робили після війни. Тільки тоді це було лише в Європі та на Близькому Сході. Я не знаю, що сталося в Європі, і не хочу знати, але можу сказати тобі, що для нас це не буде добре. Анітрохи. Мені треба йти. Поговоримо пізніше».\n\nФрота поклав слухавку. Це було... м'яко кажучи, складно. Німеччина безперечно мала агентів по всій Південній Америці, а особливо в Парагваї. Навіть після завоювання Че ця мережа мала бодай частково зберегтися. Та це була фаустівська угода, яку вони були змушені прийняти. Вашинґтон завжди був метою Фроти. Жодна наддержава не була б настільки вигідною для Бразилії, як Америка, і вони здебільшого трималися б осторонь бразильських справ. Здебільшого. Шпеєр змусив їх зробити вибір, змусив навіть бути йому вдячними. Це ще повернеться, щоб переслідувати їх. Але поки що? Вони були побратимами по зброї."
 PAR_invasion.402.a:0 "Рідко хто впізнає диявола, коли той кладе руку йому на плече."

 PAR_invasion.802.t:0 "Бетонне серце"
 PAR_invasion.802.desc:0 "Ось вона, Германія. Шпеєр ходив навколо своєї моделі Германії, яка досі залишалася в ідеальному стані. Тридцять років. Тридцять років минуло відтоді, як були золоті дні його життя. Показуючи своєму Фюреру дива світу, що мав настати, кожен подив і здивований кивок його голови були знаком гордості старого архітектора. Ідея — така ж тверда й щира, як бетон, із якого вона була складена, — була лише трохи поза досяжністю. Це було наче бачити відображення чогось у воді, такого близького до реальності. Але ніколи цілком не реального.\n\nГерманія була серцем усього. Коли Германія в'янула й руйнувалася, те саме відбувалося з Райхом. Але коли метрополія вирувала й сяяла, те саме робила Європа. Сьогодні надійшли новини про нищівну поразку Парагваю. Він подбав, щоб кожна газета в тих частинах Райху, де все ще можна було жити, повідомила про це. Ніколи більше все не буде так, як раніше; тривала спадщина Че для Парагваю. Він оплакував смерть фашизму, але Шпеєр знаходив розраду в тому, що той розділить могилу зі своїм убивцею. Більшовизм більше не заплямує Південну Америку своєю декадентністю.\n\nНе мало значення, що народи Південної Америки воліли б лизати блискучі черевики Вашинґтона. Ні, це не мало значення. Архітектор ніколи не залишав нічого на останню хвилину. Німецькі агенти, глибоко вкорінені в Аргентині, переконають їх... переглянути свою позицію. Вони побачать світло, гламур сяючих прожекторів Германії. Вони побачать боротьбу Німеччини проти всього, що їй протистоїть, навіть коли шанси були проти неї. Вони побачать себе в Райху. Націю, обложену з усіх боків своїми нижчими. Континент, який по праву належав їм, але стримувався світовими державами. Світ, надто стиглий, щоб прийняти їхню велич. Їм потрібен був лише лідер. Як Гітлер у 1930-х. Як він сам зараз.\n\n«Мій Фюрере», — увійшов до кімнати Ґелен. «Наші агенти виявили звіти, згідно з якими Аргентина та Бразилія прагнуть зблизитися з Вашинґтоном. Навіть після всієї нашої допомоги вони досі відкидають наші пропозиції. Що нам робити?»\n\nҐелен виглядав упевненіше. Зачесане назад волосся, гладко виголене обличчя й очі, прикриті сонцезахисними окулярами. Павук повністю контролював свою павутину, кожна остання звужена кінцівка була під контролем кожної делікатної нитки. Так, Германія була серцем світу. І Фюрер був єдиним, хто міг підтримувати його биття."
 PAR_invasion.802.a:0 "Переконайтеся, що вони вдячні за нашу допомогу. Так чи інакше."
 
 PAR_invasion.803.t:0 "Нікчемні бразильці"
 PAR_invasion.803.desc:0 "«Повні довбані нездари! Повні, абсолютні нездари, директоре!» — кричав Шпеєр. «Наскільки ж незграбним треба бути, щоб зазнати невдачі? Ґевара був просто там; вони могли застрелити, бомбардувати його чи зробити що завгодно! Чому він досі живий, директоре?»\n\nҐелен мовчав. Шпеєр мав рацію, чи не так? Аргентинці та бразильці, як вони говорили, поспіхом вибиралися з Парагваю, залишаючи по собі все. У його свідомості більше не залишалося жодного сумніву щодо того, що німецькі — його — активи в регіоні мертві. Можливо, не зараз, можливо, лише через роки. Але вони загинули. Якщо він добре їх навчив, то це станеться від їхньої ж руки.\n\n«Мій Фюрере, ви не можете звинувачувати себе в цьому. Ми дали бразильцям та аргентинцям карти, позиції підрозділів, фотографії, усе. Усе, що їм було потрібно для виконання місії. Вони зазнали невдачі. Ні-»\n\n«Ти маєш рацію, Ґелен. Я не звинувачую себе в цьому. Я звинувачую тебе». Шпеєр підвівся зі свого крісла. Кульгаючи до найближчого вікна, він подивився назовні, на Германію. Ґелен упізнав вираз обличчя Шпеєра. Це був погляд людей, чию поразку вирвали з пащі перемоги.\n\n«Мій Фюрере, німецька розвідка тут ні до чого. Ґевара —»\n\n«У тебе є діти, Ґелен?» — перебив Шпеєр, усе ще дивлячись назовні. «Тобі не потрібно відповідати на це питання. Ти усвідомлюєш, що станеться, якщо ми продовжимо припускатися таких помилок? Якщо дозволимо більшовизму — який мав померти разом із тим виродком Бухаріним — процвітати по всій планеті? Що станеться з Німеччиною та її народом, якщо ми не виконуватимемо свою роботу?»\n\n«Що, мій Фюрере?» — сказав Ґелен.\n\n«Ми всі мертві, директоре. Вашинґтон викопає нам могили, а Токіо виголосить надгробну промову. Більшовизм уб'є все, що ти любиш, і якщо ми продовжимо зазнавати невдач, ми побудуємо собі могили. Можеш так само взяти своїх дітей і стріляти їм у потилицю. Одного за одним. Альтернатива значно гірша», — сказав Шпеєр. Повернувшись до Ґелена спиною, він махнув йому, щоб той ішов."
 PAR_invasion.803.a:0 "Ви вільні, директоре."
 
 PAR_OAS.1.t: "Кінець ОАД-стракізму"
 PAR_OAS.1.desc: "«Я розумію ваші побоювання, Вальтере», — сказав посол США з ледь помітною посмішкою. «Але ми запросимо Аргентину приєднатися до Організації американських держав за першої ж можливості».\n\nМіністр закордонних справ Вальтер Морейра Саллес відчув, як напружилася його щелепа. Додати це до і без того звичайної розмови в посольстві, не демонструючи жодної готовності поступитися... Морейра Саллес глибоко вдихнув і сказав: «Аргентина — держава-ізгой, яка лише заважатиме роботі ОАД. Легітимізувати її таким чином —»\n\nПосол перебив його: «У неї буде обмежена можливість щось порушувати. Ми приймаємо її лише як члена на випробувальному терміні — без права голосу. А щодо вашого аргументу про легітимність», — він на мить замовк, дивлячись у вікно, що виходило на схід, — «якщо ми не приймемо її до своїх лав, її єдиними варіантами залишаться наші вороги. Вашинґтон воліє мати проблемного партнера, ніж союзника Германії, Рима чи Токіо у вас під боком. Якщо Бразиліа думає так само, ми були б вдячні за ваш голос на підтримку на наступній конференції ОАД».\n\nМорейра Саллес замовк, а потім похитав головою. «Найкраще, що ми можемо запропонувати, — утриматися»."
 PAR_OAS.1.a: "Посмішка стала ще тоншою: «Дуже добре. У нас уже були голоси»."
 
 PAR_OAS.2.t: "Привиди Снайпа"
 PAR_OAS.2.desc: "Надзвичайна сесія Організації американських держав щойно вступила у свою п'яту годину. Втома вже починала проступати на обличчях делегатів. Лідери й представники з усіх куточків Америк зібралися у Вашинґтоні, округ Колумбія, щоб вирішити, чи приймати Аргентину до ОАД. Араужу Кастру, бразильський представник в ОАД, потягнув за комір сорочки. Кімната була наповнена сигаретним димом, кава вже давно охолола, а спина кожного делегата була вкрита потом. Аргументи за й проти прийняття Аргентини літали туди-сюди весь день, кульмінацією чого став виступ чилійського посла Енріке Вільярроеля.\n\n«Шановні делегати», — сказав Вільярроель із надзвичайною серйозністю. «У 1958 році ми зустрічалися в цій самій кімнаті, щоб засудити жахливі, підступні, цинічні напади Аргентини на мою країну. Дійсно, я бачу тут багато тих самих облич. Як ми взагалі можемо розглядати думку про прийняття цих негідників, цих бандитів до такого заснованого на правилах органу? Імперіалістична агресія Аргентини не вгамувалася кров'ю, пролитою під час Війни за Снайп. Вони постійно переслідували наш персонал на нашій суверенній антарктичній території. Вони порушували наші територіальні води своїми військовими кораблями та жорстокими китобоями». Він зробив паузу, щоб перевести подих, і кожен досвідчений оратор у кімнаті знав, що кульмінація його промови настала. Вільярроель жестом показав праворуч, і його колега-посол Марсіаль Міранда підвівся, щоб приєднатися до нього. З неквапливістю могильника Міранда поставив на підставку серію великих фотографій, щоб усі могли їх побачити. Кімнату заповнили вигуки подиву. «Це, — сказав Вільярроель, — фотографії наших постів на островах Вінке та Аделаїда, наших співвітчизників, убитих холоднокровно, викинутих у крижане море або спалених дотла у своїх помешканнях. Як ці збори можуть прийняти цих чудовиськ до наших лав?»\n\nНастав момент голосування, і Кастру, як і було заплановано, але з величезною неохотою та соромом, утримався від голосування від імені Бразилії, забезпечивши прийняття Аргентини, хоча й на випробувальний термін без права голосу. Їх завжди можна буде виключити пізніше, повторював Кастру сам собі."
 PAR_OAS.2.a: "Маленька втіха для мертвих Аделаїди."
 
 PAR_OAS.3.t: "Перша шпальта Folha"
 PAR_OAS.3.desc: "Із Асунсьйона продовжують надходити жахливі новини, оскільки Революційний трибунал оголосив про нову хвилю публічних страт. Троє чоловіків були повішені після закритого слухання, на якому їх визнали винними у шпигунстві та діяльності як незареєстрованих іноземних агентів. Чотирьох священників також повісили після того, як їх звинуватили в належності до реакційної організації. Семеро колишніх чиновників Морініґо та шестеро колишніх працівників фінансового сектору за невизначені злочини проти Робітника на користь Капіталу були публічно обвинувачені у своїх злочинах і проведені вулицями перед тим, як їх поставили перед розстрільною командою під глузування та радісні вигуки захопленого натовпу. Найболючіше те, що 14-річного хлопчика на ім'я Абеліно Брускетті було повішено за Спадкову Реакцію через те, що він був сином Едулфо Брускетті, забудовника та землевласника, який зник після комуністичного захоплення влади й досі вважається зниклим безвісти. Таким чином, загальна кількість страчених перевищила вісімсот, не враховуючи масштабних каральних убивств, що відбулися в наступні дні та тижні після успішного захоплення країни Че Ґеварою. Кількість біженців, які втекли до Аргентини та Бразилії, обчислюється десятками тисяч.\n\nМи у Folha також хотіли б скористатися нагодою, щоб нагадати нашим читачам, що наш кореспондент Ісаіас Мадруґа да Фонсека досі перебуває в руках Парагваю, звинувачений у злочині друку підривних матеріалів та пропаганді буржуазного націоналізму. Окрім Ісаіаса, ще дванадцять громадян Бразилії підтверджено утримуються під вартою парагвайською владою, а близько п'ятдесяти наразі вважаються зниклими безвісти, і їхній поточний статус невідомий."\n\nУґо Андраде Мадруґа склав газету й випив кави, сподіваючись змити кислотний присмак із рота. На мить він замислився над агонією, яку переживала б його дружина, якби він перебував у Парагваї в той час. Чи звелася б його хитка ситуація до одного речення в газеті? Чи став би він епітафією для цих тринадцяти невдачливих душ?"
 PAR_OAS.3.a: "Нове обличчя в натовпі на наступному протесті та новий голос, що закликатиме Бразилію діяти, щоб урятувати їх."
 
 PAR_OAS.4.t: "Трон Дамокла"
 PAR_OAS.4.desc: "Інтерком на столі [BRA.GetLeader] затріщав. "Генерал Ґайзел тут, щоб обговорити парагвайську ситуацію. Запросити його?" Президент кивнув помічникові, який приніс останній розвідувальний звіт щодо ситуації й одразу вийшов із кімнати. Увійшов генерал Ґайзел і мовчки віддав честь своєму головнокомандувачу. Президент кивнув, і Ґайзел лише трохи розслабив поставу.\n\n"Мій Президенте, чи мали ви можливість ознайомитися з розвідувальними звітами? Зростає занепокоєння щодо того, що Парагвай переправляє кошти й зброю радикалам, сподіваючись паралізувати нашу країну та зробити її придатною для комуністичного перевороту. Багато старших генералів сподіваються мобілізуватися та втрутитися в Парагваї, перш ніж ситуація погіршиться ще більше."\n\n"Я їх прочитав, генерале." Президент [BRA.GetLeader] кивнув, жестом вказуючи на звіт на столі. "Негайні дії можуть бути не наймудрішим рішенням. Місцевість складна, і будь-які наші дії можуть загострити напруженість, можливо, навіть підбадьоривши повстанські угруповання ще більше, ніж це коли-небудь міг зробити Че Ґевара."\n\n"Якщо ми не діятимемо, це може зробити Аргентина, і тоді ми опинимося в ще гіршій ситуації. Аргентина мобілізувалася безпосередньо біля наших кордонів. Якщо наші власні війська не будуть готові, ми можемо опинитися в ситуації, коли Аргентина буде готова вторгнутися до нашої країни."\n\n"Віддалена можливість. Якщо Аргентина і ми обидва вторгнемося, то один артилерійський снаряд, що відхилився від цілі, або авіаудар з будь-якого боку може втягнути обидві наші країни у війну."\n\nҐайзел на мить замовк, перш ніж промовити. "Звичайно, остаточне рішення залишається за вами. Пам'ятайте, що ви очолюєте військо завдяки нашій упевненості в тому, що як головнокомандувач ви захистите нашу націю від шкоди. Якщо військові повірять, що ви більше не здатні виконувати цю функцію, що ж...""
 PAR_OAS.4.a: "Ґайзел залишив Президента наодинці з його думками, хоча й не без чіткого, іронічного салюту."
 
 PAR_OAS.5.t: "Американське рішення"
 PAR_OAS.5.desc: "Над Асунсьйоном майорів червоний прапор. Біженці хлинули з Парагваю, а радикальні заяви нового уряду відлунювали по всьому континенту. Бразильське верховне командування переслідувало свого президента, прагнучи військового втручання, щоб придушити революцію в зародку. Була одна велика проблема — аргентинське верховне командування мало абсолютно ту саму ідею.\n\nЦе було головною перепоною для тих, хто ухвалював рішення в Бразиліа, як серед цивільних, так і військових; розвідувальні звіти свідчили, що Аргентина мобілізується до війни. Хоча всі погоджувалися, що некерована комуністична держава на кордоні Бразилії є неприйнятною, бразильське втручання в Парагвай відбувалося б одночасно з аргентинським втручанням — щойно повстанців було б розгромлено, дві армії зустрілися б на полі бою, і ситуація, найімовірніше, загострилася б. І це не враховувало очевидної ціни окупації Парагваю, доки не було б відновлено порядок.\n\nПісля годин дебатів і роздумів американський посол Лінкольн Ґордон прибув, щоб представити пропозицію Президенту [BRA.GetLeader] та генеральному штабу. Бразильці та аргентинці самі ніколи б не співпрацювали — але якщо втручання в Парагвай відбувалося б під егідою Організації американських держав, інтереси двох країн були б узгоджені третьою стороною. Вашинґтон особливо не переймався долею Парагваю, але не хотів, щоб у Південній Америці спалахнула війна. Ґордон пообіцяв, що США матимуть достатньо голосів і впливу, щоб забезпечити це.\n\nЗвичайно, деякі генерали відкинули цей план. Дехто був обурений самою ідеєю, що Бразилії доведеться запрошувати решту Америк, щоб розв'язати проблему у власному дворі. Було зазначено, що саме американське втручання змусило Бразилію запросити комуністів до FULNA — тепер Бразилія пожинала наслідки. І все ж правова основа для втручання без ризику ширшої війни була привабливою перспективою, якщо вона спрацює."
 PAR_OAS.5.a: "Незабаром було скликано екстрений саміт ОАД — бразильці погодилися з планом Ґордона."
 PAR_OAS.5.b: "План було відхилено — бразильці продовжать боротьбу без Вашинґтона"
 
 PAR_OAS.6.t: "Належні канали"
 PAR_OAS.6.desc: "Пробившись повз інших делегатів, Араужу Кастру поспіхом залишив конференц-зал Будинку Америк, штаб-квартири ОАД у Вашинґтоні, округ Колумбія. Американський помічник потягнув Кастру за руку, і він пішов за молодою жінкою геть від переповнених коридорів.\n\nКастру послабив комір, виснажений щойно завершеною зустріччю. Голосування переконливо склалося на його користь, але не без інцидентів. Він сказав помічниці своєю акцентованою англійською: "Ти мала б почути там кубинського делегата. Кричав, мов коза. І впертий, як коза. Подивіться через океан, якщо хочете побачити 'імперіалізм', еге ж?"\n\nЖінка не відповіла, натомість відімкнула двері в тихому коридорі, запросивши Кастру до маленького кабінету. Вона вказала на телефон на столі; "Ваш дзвінок до Бразиліа, як і обіцяли."\n\n"Він захищений?" — запитав Кастру. Помічниця кивнула й пішла, і невдовзі Кастру вже говорив із Палацом Планалту.\n\n"Добрі новини, пане Президенте, резолюцію ухвалено. Ви та генеральний штаб незабаром почуєте від американців щодо координації вторгнення з Аргентиною. Вони показали мені карти запропонованих зон окупації — там було звичайне сміття про те, що Парагвай залишиться 'суверенним і незалежним' під блискучим новим тимчасовим урядом ОАД, наче саме їхні хлопці будуть на місцях. Ще одна умова — жодних територіальних поступок, тож болівійці будуть незадоволені. Можливо, вам зателефонують щодо їхніх претензій на Чако. Просто попереджаю. Ось така позиція ОАД щодо Парагваю, пане Президенте...""
 PAR_OAS.6.a: ""Це все цілком законно, та й зрештою все це заради їхнього ж блага.""
 
 PAR_OAS.7.t: "Точка розлому"
 PAR_OAS.7.desc: "Наша головна новина сьогодні ввечері: по всій країні спалахнули протести після того, як ОАД проголосувала за дозвіл на спільне вторгнення до Парагваю за участю бразильської та аргентинської армій у конфлікті. Невеликі протести тривали протягом саміту ОАД, але після оголошення результату та заяви Президента [BRA.GetLeader] про згоду з голосуванням бразильський народ масово вийшов на вулиці по всій країні. Від Белена до Сан-Паулу країну охопила хвиля протестів проти цього кроку."\n\n"Багато з цих протестів були організовані лівими партіями та активістськими організаціями, які засудили адміністрацію за вторгнення та закликали бразильський народ визнати волю парагвайського народу й висловити солідарність із його новим урядом. Інші протестувальники були менш ідеологічними, віддаючи перевагу заявам про свою опозицію до війни та висловлюючи занепокоєння щодо неминучих жертв, до яких вона призведе. Невелика кількість антиаргентинських протестувальників, переважно в Південному регіоні, заявляли про свою підозру щодо співпраці з Аргентинською армією та закликали посилити кордон."\n\n"Кілька протестів стали насильницькими: протестувальники кидали пляшки й каміння в поліцейських або розбивали вікна й автомобілі, що вимагало направлення загонів боротьби з масовими заворушеннями для стримування спалаху. Найбільший бунт стався в Ріо-де-Жанейро, де військових довелося викликати на допомогу, внаслідок чого було поранено чотирьох поліцейських і військовослужбовців та вісімдесят п'ять протестувальників. Офіційні заяви начальника поліції не виключають іноземного підбурювання з боку парагвайських диверсантів серед невдоволених і наголошують на обережності та пильності населення."\n\n"Безперечно, це визначний час, і ми тут, на Tupi, неодмінно триматимемо громадськість у курсі цих подій, що стрімко змінюються.""
 PAR_OAS.7.a: "Нації об'єднані, нація — навряд чи."
 
 PAR_OAS.8.t: "Перший серед рівних"
 PAR_OAS.8.desc: "Родріґо Ґутьєррес мав головний біль і запізнювався. Взаємодія з бразильцями та аргентинцями як головного аташе ОАД завжди спричиняла йому головний біль, коли йому доводилося бути посередником в Операції Туїуті. Він запізнився, бо сподівався не мати справи з двома запальними людьми, які очолювали армії. Що, можливо, було несправедливо, адже за інших обставин ці двоє могли бути цілком приємними людьми. Але вони сперечалися через усе, навіть через місце цієї зустрічі, доки Родріґо не запропонував американську військову базу як прийнятну нейтральну територію. Він чув, як чоловіки кричали, ще до того, як нарешті увійшов до конференц-залу.\n\n"Можливо, ви поясните, чому аргентинським військовим потрібно монополізувати стільки елементів логістики? Хіба ви не можете забезпечити власні припаси?" — пробурмотів генерал-майор Карлос де Мейра Маттос.\n\n"Аргентина надає більшість спеціалізованої піхоти для високогір'я. Ми сподівалися, що в дусі цього союзу Бразилія зможе виділити більше людей на логістичні перевезення. Зрештою, більшість комуністичних сил — ледве навчені партизани. Якщо в нас буде пальне, наші машини матимуть достатній захист. Але нам потрібно переконатися, що пальне буде, а більша частина аргентинського пального потрібна для місій авіаційної підтримки, які ми виконуватимемо", — заперечив генерал Раттенбах.\n\n"Чого б не було проблемою, якби ми погодилися на спільне повітряне патрулювання, як я пропонував раніше."\n\nГенерал Раттенбах перекинув чашку, а потім похитав головою. "Ми нікуди не рухаємося, зробімо десятихвилинну перерву, вип'ємо води й охолонемо. Потім переглянемо спільні пропозиції."\n\nВін вийшов із кімнати після того, як двоє генералів, що ворогували, пішли; йому потрібно було викурити сигарету й заспокоїтися. Ідучи, із сигаретою в руці, він проходив повз кількох військових поліцейських, які тягли до гауптвахти бразильських та аргентинських рядових із набряклими очима та закривавленими кісточками пальців, і відчув, як насувається ще один головний біль."
 PAR_OAS.8.a: "Кому потрібен Парагвай, коли в нас і так достатньо ворогів просто поруч?"
 
 PAR_OAS.9.t: "Розплата"
 PAR_OAS.9.desc: "Це був початок кінця для Парагваю. Прикордонне місто Педро-Хуан-Кабальєро палало від безперервного артилерійського вогню та авіабомбардувань. Однак це не витіснило всіх партизанів. Капітан Рейєс та його люди опинилися притиснутими за фонтаном бійцями, що засіли у вежі — з кулеметом на даху. Допомога підрозділу прибула швидко. Спочатку пролунав гуркіт гвинтів вертольота, потім рев гармат бойового вертольота, що розірвав вежу. Рейєс не міг не вигукнути разом зі своїми людьми, коли залп ракет остаточно змусив позицію замовкнути.\n\nЛейтенант Карвалью так сильно кохав свою дівчину, що брав її фотографію всюди, куди б не вирушав, — навіть на кілька тисяч футів у повітрі на F4 Phantom. Слідуючи за ведучим, він направив свій літак у пікірування, прорізаючи хмари. Унизу парагвайці на залізничній станції розбігалися в пошуках укриття, тоді як деякі марно стріляли зі своїх гвинтівок. Карвалью подбав, щоб відвернути фотографію від лобового скла. Зрештою, вона ненавиділа вигляд насильства.\n\nM60 завернув за ріг, і сержант, який ним командував, наказав навідникові повернути башту. Там вони помітили свою ціль. Партизани спорудили барикаду з кількох вантажівок. Бразильські солдати, які намагалися виманити їх звідти, побачили своє спасіння й відскочили вбік. Сержант гаркнув наказ відкрити вогонь, і фугасний снаряд розірвав барикаду. Водій рушив уперед, щоб відсунути перешкоду бульдозерними відвалами танка."
 PAR_OAS.9.a: "Гусениці розчавлювали уламки, мертвих і тих, хто помирав."
 
 PAR_OAS.10.t: "Останні серед багатьох"
 PAR_OAS.10.desc: "Настрій на екстреному саміті ОАД був напруженим. На вустах у всіх була новина про болівійське вторгнення до Чако. Оскільки Парагвай відправив свої сили захищатися від атак ОАД на північному та південному напрямках, його оборона в Чако вздовж болівійського кордону була скорочена до символічних гарнізонів, щоб виділити більше людей для оборони. Після того як болівійці відбили Санта-Крус і повалили підтримуваного Парагваєм маріонеткового правителя, їхня армія продовжила наступ, просуваючись на парагвайську територію.\n\n"Це жахливо", — пролунав голос Родріґо Ґутьєрреса, його зазвичай спокійний голос переходив у вереск. "Болівійці вимагають анексії парагвайської території як репарацій за Санта-Крус. Тепер увесь світ бачить вторгнення як спосіб розділити Парагвай між його учасниками."\n\n"Заспокойтеся. Ми не можемо втрачати голову." Карлос де Мейра Маттос похитав головою. "Ми повинні негайно зв'язатися з послами й недвозначно дати зрозуміти, що якщо вони продовжать просуватися в Чако, ми будемо дуже незадоволені. Заради їхньої нації та безпеки їхньої армії вони повинні сповільнити наступ і координувати свої дії з нами."\n\n"Я погоджуюся", — кивнув генерал Раттенбах. "Болівійська армія може бути рівною решткам сил Ґевари, але вони надто довго були пошарпаним військом. Загрози конфлікту, ймовірно, буде достатньо, щоб зупинити їх і забезпечити, що вторгнення продовжиться за планом. Не думаю, що вони захочуть випробовувати долю."\n\nРодріґо не міг повірити. Аргентинська та бразильська делегації вперше за раз погодилися в чомусь. "Гаразд, я також скоординую це через ОАД."\n\nРаттенбах усміхнувся: "Схоже, парагвайці побачать Другу війну Потрійного альянсу.""
 PAR_OAS.10.a: ""Перша так добре для них закінчилася", — погодився де Мейра Маттос із тихим сміхом."
 
 PAR_OAS.11.t: "Консепсьйон"
 PAR_OAS.11.desc: "Щоб знати, що бразильська перемога настала, підкорені мали побачити війська. Війська мали побачити свого генерала. А генерал-майор Карлос де Мейра Маттос мав побачити місто.\n\nКонсепсьйон, не Асунсьйон. Столиця була відведена для міжнародних миротворців ОАД і безсилого перехідного уряду. Місце де Мейра Маттоса було тут, перед статуєю Діви, що прикрашала центр міста, де він приймав захоплення своїх людей. Мінімальні бразильські втрати та купи знищених комуністів заслужили йому їхню повагу.\n\nМісце де Мейра Маттоса було на задньому сидінні штабного автомобіля, що гуркотів уздовж влучно названої вулиці Кає Бразил у напрямку річки Парагвай. Його суворий погляд зустрічався з боязкими поглядами парагвайців, кидаючи виклик будь-якому потенційному комуністичному герою спробувати зробити постріл. Двоє хлопців із Віторії, тепер наділені хижими очима ветеранів і сидячи по обидва боки від нього, першими поклали б його. Це було не його місце — демонструвати страх, він мав бути для партизанів.\n\nЙого місце було в темному кабінеті, де у вухах відлунювали привітальний телефонний дзвінок Президента та хлопки корків шампанського. Він переглядав звіти про пошкодження та плани відбудови Консепсьйона й усієї бразильської окупаційної зони. Читав досьє на комуністів і фашистів, які, як вважалося, досі переховувалися. Розкладав останню карту аргентинських позицій на півдні. Проводив пальцем уздовж маршруту Трансчакоського шосе до Асунсьйона.\n\nВійна закінчилася."
 PAR_OAS.11.a: "Але справжня війна за Парагвай ще мала народитися."
 
 PAR_OAS.12.t: "Ворог мого ворога"
 PAR_OAS.12.desc: "Камера клацнула, коли капітан Рейєс усміхнувся, тримаючи в руках захоплену гвинтівку парагвайських партизанів. Він ще раз підняв гвинтівку для фотографії, перш ніж кинути її в купу, звідки її взяв. Журналісти та фотографи стікалися до місця, де зустрілися бразильські й аргентинські сили, — сподіваючись отримати фотографії товариськості після очевидної поразки їхнього спільного ворога.\n\nНатомість вони знайшли дві виснажені та недовірливі армії. Бразильці трималися свого боку, а аргентинці — свого. Ніхто не плескав іншого по спині й не бажав своїм 'братам' успіху. Рейєс уже збирався наказати своїм людям повернутися до табору, коли почув свист з іншого боку.\n\n"Гей, ти!" — покликав молодий аргентинський офіцер, підходячи до кордону окупаційних зон. "Вітаю з тріумфом!" Якби чоловік говорив іспанською, Рейєс зміг би його зрозуміти. Натомість аргентинець говорив ламаною, неприродною португальською. Офіцер простягнув руку для рукостискання. Рейєс подивився на руку аргентинця, а потім на його обличчя.\n\nВін почув спалах камери позаду себе, коли розвернувся й пішов геть від аргентинця. Йому було байдуже. Він просто хотів повернутися до табору й надолужити весь сон, якого йому бракувало."
 PAR_OAS.12.a: "Союзник — не друг."
 
 PAR_OAS.13.t: "Жодних втрат серед своїх"
 PAR_OAS.13.desc: "Дим усе ще здіймався з кульових отворів у старому камені відокремленої ферми. У повітрі лунав крик тропічних птахів, наляканих перестрілкою. Капітан Рейєс почув сигнал про відсутність загрози від своїх товаришів, які прорвалися до підвалу, і піднявся з-за перекинутого воза, щоб приєднатися до них, тримаючи гвинтівку біля грудей.\n\nУ задній частині будинку, сховавшись за тюками сіна, Рейєс пригнувшись пробрався до підземної кімнати, виритої в землі, і, увійшовши до просторішої камери, побачив, як двоє його людей, їхня оливкова форма заляпана червоним, кивнули у відповідь. Гвинтівки повстанців були старими німецькими моделями, погано доглянутими. Один партизан лежав розпластаним на підлозі, кров струменіла з його шиї. Інший впав спиною на стіл, накритий картами й кількома ящиками боєприпасів, — партизанові було, мабуть, дев'ятнадцять, його широкі, місцеві риси були викривлені смертю.\n\nЩоразу більше загонів боротьби з повстанцями, які Бразилія розгортала в Парагваї, повідомляли про те саме; колись вони знаходили комуністську атрибутику — брошури чи прапори, червоні пов'язки на бійцях, — але через кілька місяців після вторгнення це траплялося рідше. Рейєс точно не зміг знайти нічого на цьому маєтку, а решта розвідданих була переважно марною. Селяни за кілька кілометрів униз дорогою також продовжували казати, що нічого не знають про партизанів у цьому районі, незалежно від того, скільки побоїв завдавали їм люди Рейєса.\n\nНе треба було бути військовим генієм, щоб зрозуміти, що зростаючий партизанський рух більше не складався з прихильників Крейдта, а з розлючених місцевих, які хотіли, щоб іноземці забралися з Парагваю, — за чутками в казармах, за аргентинської підтримки. Щодо самого Рейєса, він ненавидів цю країну і був би радий якнайшвидше звідси піти, але всі вказівки від розумників у Бразиліа полягали в тому, щоб готуватися до довгої боротьби."
 PAR_OAS.13.a: "Звіт капітана Рейєса про рейд був лаконічним: усі вороги знищені, втрат серед своїх немає."
 
 PAR_OAS.14.t: "Добрі наміри"
 PAR_OAS.14.desc: "Елоїза Лейтан де Кампус хотіла допомогти. Після звільнення Парагваю вона зголосилася працювати як працівниця гуманітарної допомоги, щоб допомогти народу Парагваю. Коли вона вирушала, то уявляла себе справжньою героїнею, людей, які скандують її ім'я, коли Парагвай відбудовує себе з-під тіні комуністів. Робота буде важкою, але вона стане святою.\n\nРеальність швидко витягла її з мрій. Цими днями вона ледве мала час на щось. Карлос де Мейра Маттос постійно перенаправляв пожертви продовольства та грошей на свої окупаційні війська, щоб гарантувати їм достатню винагороду за полювання на партизанів. Їжі чи ковдр ніколи не вистачало на всіх, ліки доводилося видавати по половині або чверті дози, аби вони не закінчилися, а іноді все, що Елоїза могла запропонувати, — це жалюгідне вибачення.\n\nВибачення давно вичерпало свою гостинність. Кінцеві терміни припинення воєнного стану знову й знову відкладалися. Людям були потрібні перепустки, щоб залишати свої домівки після настання темряви, дозволи на будь-які зібрання понад сім осіб, які майже завжди відхилялися, якщо це не були церковні служби. Селяни, які отримали землю, коли комуністи її конфіскували, тепер були змушені повернути її, і багато хто залишився без можливості працювати. Елоїза не могла не помічати цієї іронії, але коли бачила голод і відчай у їхніх очах, не могла не визнати, що їхній гнів мав сенс.\n\nКоли вона принесла свої припаси до наступного пункту розподілу, натовп парагвайських чоловіків дивився на неї з ненавистю в очах. "Панове, у мене є їжа і..."\n\nЇхня відповідь була миттєвою: порожні бляшанки та інше сміття полетіли в її бік. "Забирайся звідси, бразильська свиня! Забирай свою їжу, забирай свої війська й забирайся!"\n\nСтрах підступив до горла Елоїзи. Оскільки війська залишалися у своїх гарнізонах або патрулювали в пошуках партизанів, вона була самотня й у меншості. Багатьох гуманітарних працівників били, вона навіть чула, що кількох убили."
 PAR_OAS.14.a: "Вона втекла, залишивши свої мрії позаду."
 
 PAR_OAS.15.t: "Зло"
 PAR_OAS.15.desc: "Він був лише ще одним обличчям у натовпі. Майже ніхто не помітив, як він пробирався крізь юрбу паулістів, не зводячи очей із сенатора, а правою рукою стискаючи револьвер у кишені піджака. Сенатор стояв на помості перед новою школою, оточений муніципальними лідерами, вчителями та місцевими дітьми. Його промову перервав крик гуарані — "Вільний Парагвай!"\n\nПролунав один постріл, потім люди закричали. Сенатор похитнувся назад, схопившись за місце, куди влучила куля в плече, і його швидко відвели. Майже ніхто не помітив потенційного вбивцю, але в момент, коли він натиснув на спуск, його руку відтягнули, а потім охоронці сенатора повалили його на землю. Люди побігли вниз вулицею, у провулки; діти плакали.\n\nУ поліцейській дільниці він говорив відверто, хоча на пошуки перекладача пішов певний час. Він був ще одним обличчям у натовпі — він приїхав до Сан-Паулу два роки тому з села в Амамбаї. Працював водієм вантажівки. Більшість заробітку він надсилав додому, оскільки їхній урожай бавовни продавався дешевше, а їхню землю конфіскували під час післяреволюційних компенсацій землевласникам. Він майже нікого не знав у Бразилії.\n\nКілька років тому, зазначали журналісти та критики, напади такого роду відбувалися в окупаційній зоні або прикордонних містах. Це був перший такий випадок у бразильському мегаполісі. Це не сприяло б зростанню непопулярності окупації, оскільки по обидва боки кордону багато хто очікував її можливого завершення у 1971 році; фактично, ідея дострокового припинення окупації не була цілковито маргінальною.\n\nПід час допиту вони докучали йому питаннями про те, наскільки зло було наражати дітей на небезпеку — наприклад, якби він схибив. Він у відповідь запитав: а що щодо дітей Парагваю? Яке право мали сусіди Парагваю, душачи їх і продаючи їхнє майбутнє?"
 PAR_OAS.15.a: "На це піде ціле життя."
 
 PAR_OAS.16.t: "Непрохані"
 PAR_OAS.16.desc: "Просторий Будинок Америк у Вашинґтоні, округ Колумбія, зібрав під високими стелями та прапором Організації американських держав усіх визначних людей Західної півкулі. Двоє цих представників ОАД, один із Ріо-де-Жанейро, а інший із Санта-Фе, швидко йшли мармуровою підлогою, тихо перемовляючись. Бразилець Араужу Кастру помітив вільну кімнату й жестом запросив свого американського колегу йти за ним.\n\nКоли важкі дубові двері зачинилися за ними, Араужу Кастру вигукнув цілком пристойною англійською: "Цього не можна допустити. Не можна! Перону та його поплічникам не буде дозволено підірвати цю організацію, інакше Бразилія та я більше не матимемо в ній жодної участі."\n\nПредставник Нью-Мексико повільно кивнув: "О, я погоджуюся. І люди в Білому домі також."\n\nАраужу Кастру трохи знітився. "Добре", — це все, що йому вдалося сказати.\n\nАмериканець, здавалося, загубився у своїх думках, дивлячись на оздоблення стін в ацтекському стилі. "Уся ця справа — така марна трата. Перон відкидає найбільший шанс на мир, який мав ваш континент, заради мертвої хватки Європи."\n\nАраужу Кастру вже відчиняв двері: "Він не міг би вчинити інакше. Ходімо, нам потрібно попередити уругвайців.""
 PAR_OAS.16.a: "Будинок Америк недостатньо великий для однієї людини. Перон."
 
 PAR_OAS.17.t: "Парагвайська дилема"
 PAR_OAS.17.desc: ""Пане Президенте, ми не можемо перебільшити, наскільки це небезпечно." Мундир наголосив Президенту Бразилії. "Це не якісь звичайні навчання. Ми фотографували потяги. Ми вивчали схеми польотів їхніх ВПС. Ми бачили цифри, які надала наша розвідка щодо логістики." Мундир перевів подих. "Аргентина ось-ось вторгнеться до Парагваю. Ми оцінюємо, що без нашого втручання вони будуть на Парані за тиждень."\n\nІнший мундир подав голос. "Якщо ми завдамо удару до того, як це зможуть зробити аргентинці, ми зможемо убезпечити наші кордони." Костюм із Міністерства закордонних справ прокашлявся. "Якщо дозволите, пане Президенте, відправлення військових до Парагваю дуже небезпечне. Аргентинці без вагань оголосять нам війну, якщо відчують загрозу через втручання в Парагвай. Натомість ми можемо просто використати саму ідею удару як важіль тиску на них."\n\nПрезидент відкинувся на спинку крісла. Якщо бразильські війська увійдуть до Парагваю, ймовірно, Аргентина перетворить це на повномасштабну війну в Південній Америці. Але що, якщо Аргентина не злякається погроз Бразилії? Що, якщо вони не зупиняться на Парані? Це було важке рішення, але заради Бразилії..."
 PAR_OAS.17.a: "...Буенос-Айрес треба було змусити погрозами схаменутися."
 PAR_OAS.17.b: "...потрібно було завдати превентивного удару по Парагваю."
 
 PAR_OAS.18.t: "Момент істини"
 PAR_OAS.18.desc: "Очі світу були прикуті до Південної Америки.\n\nУ Європі люди дивилися зі своїх віталень, як телерепортер німецького мовника RRG ішов уздовж лінії аргентинських артилерійських батарей, а на задньому плані було видно кордон Парагваю.\n\nЗнімальна група японського телебачення нишпорила продуктовими магазинами Ріо-де-Жанейро, фіксуючи довгі черги біля входів і нерішучість на обличчях тих, кого охопив страх війни.\n\nЗа тисячі кілометрів від них прес-секретар Білого дому намагався стримати натовп журналістів, запевняючи націю, що виконавча влада дуже серйозно ставиться до ситуації в Південній Америці.\n\nУ Бразиліа Президент [BRA.GetLeader] похмуро дивився на стіл, вкритий картами, фотографіями спостереження та розвідувальними звітами. Навколо снували військові офіцери, передаючи факти в міру їхнього надходження; якщо Аргентина вторгнеться до Парагваю, за кілька днів вони опиняться біля бразильського кордону. Через конфіденційні дипломатичні канали [BRA.GetLeader] повідомив своєму колезі в Буенос-Айресі — якщо вони перетнуть кордон Парагваю, Бразилія не матиме іншого вибору, окрім як розпочати власне вторгнення. Він стискав стіл побілілими кісточками пальців. Він сподівався, що йому не доведеться дотримуватися цієї обіцянки.\n\nСвіт затамував подих, навіть коли Палац гудів від активності. Похмура фантазія про зустріч аргентинських і бразильських сил на полі бою, серед руїн меншої держави, затиснутої під перехресним вогнем, здавалася дедалі ближчою до реальності. Попри спеку, крізь шум пролунав дзвінок. Генерал підніс слухавку до вуха й заговорив. "Пане Президенте, вони відступають. Аргентинці припиняють наступ.""
 PAR_OAS.18.a: "Комуністичний режим Парагваю житиме далі, але так само житимуть усі інші."
 
 PAR_OAS.19.t: "По той бік лінії"
 PAR_OAS.19.desc: "Близько дюжини солдатів зайняли селянський будинок — лише дві кімнати — що стояв, залитий сонцем, біля ґрунтової дороги. Навколо були бавовняні поля, а на горизонті подекуди виднілися такі самі прості оселі селян, які їх обробляли. Коли надійшла звістка про революцію в Асунсьйоні, вони спонтанно вирішили втопити місцевого землевласника в найближчій річці. Тепер і селяни зникли, витіснені подвійним вторгненням або сховавшись у лісі.\n\nВід розгортання на бразильсько-парагвайському кордоні й до самого вторгнення капітан Рейєс та його рота вважали операцію здебільшого безпроблемною. Фактично вони нарахували одну втрату — радист щойно зліг із розладом шлунка. Тож Рейєс опинився задіяним із громіздкою радіостанцією в головній кімнаті хатини.\n\n"Штаб, чуєте мене? Це... координати..." — знову й знову повторював Рейєс у рацію, дедалі більше дратуючись через перешкоди. Біля вхідних дверей двоє солдатів курили, сидячи на піщаних мішках заввишки до пояса. З іншої кімнати, де всі спали, долинала невимушена розмова.\n\n"-Підтверджено через Чако... Ворог на переправі через Парану..." — прошепотіло радіо, і Рейєс зосередився. Він обережно крутив регулятори, намагаючись відшукати голос. Почулися знайомі слова бразильською португальською; "-Брак придатних для дії розвідданих... Кілька позицій на лінії... Сутичка..."\n\nСутички через лінію? Востаннє, коли Рейєс перевіряв, комуністи залягли. Поки Рейєс ламав голову над уривчастим повідомленням, один із солдатів, що курили, закричав.\n\nРейєс обернувся й побачив за дверною рамою, за кулеметною позицією, за бавовняним полем колону танків, що викочувалася з-за горизонту, руйнуючи ґрунтову дорогу."
 PAR_OAS.19.a: "Хто почав стрілянину? Аргентинська броня все одно рушила вперед."
 
