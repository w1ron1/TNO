## LEADER DESCS ##
##################
  Paraguay_Higinio_Morinigo_desc: "Народився в 1897 році в родині середнього торговця, Морініго обрав військову кар'єру і до початку війни з Болівією в 1932 році став полковником. Він провів Чакську війну в генеральному штабі, піднявшись до звання маршала до перемир’я 1935 року. Ця престижна посада зробила його, в очах Ліберальної партії, хорошим кандидатом на тимчасову посаду президента під час політичного хаосу після падіння уряду фебреристів у 1937 році. Але Морініго мав підтримку армії, і замість проведення виборів він захопив абсолютну владу в результаті самоперевороту, таким чином встановивши в Парагваї фашистську державу. Морініго побудував шість концентраційних таборів і заповнив їх дощенту; його політичні противники або втекли, або були вбиті внаслідок терору, який він розв’язав. Морініго завжди захоплювався нацистами, тому за його наказом вони зробили Парагвай своїм плацдармом на континенті. Протягом наступних двадцяти років його дедалі жорстокіший режим відчужив усіх можливих друзів, окрім Гітлера. Морініго байдуже ставиться до цієї ізоляції — «нехай боягузи сміються», — говорить він. На його думку, чим більше іноземці називають його «грубим тираном», тим більше його власний народ вірить у його силу. Тож нехай намагаються знищити Морініго — його удача ще не вичерпана!"
  Paraguay_Federico_Chaves_desc: "ПЛЕЙСХОЛДЕР"
  Paraguay_Alfredo_Stroessner_desc: "ПЛЕЙСХОЛДЕР"
  Paraguay_Miguel_Angel_Soler_desc: "ПЛЕЙСХОЛДЕР"
  Paraguay_Rafael_Franco_desc: "ПЛЕЙСХОЛДЕР"
  Paraguay_Mutsuhito_Villasboa_desc: "ПЛЕЙСХОЛДЕР"
  Paraguay_Juan_Natalicio_Gonzalez_desc: "ПЛЕЙСХОЛДЕР"
  Paraguay_Felix_Estigarribia_desc: "ПЛЕЙСХОЛДЕР"
  Paraguay_Che_desc: "Життя Ернесто «Че» Гевари було визначене любов'ю до революції - любов'ю, яку живила його ненаситна цікавість, що перевозила його через капіталістичні країни та марксистські ідеології, старі дружби та нові війни. Будучи радикальним юнаком, який сподівався на мирний перехід до комунізму, революційні переконання Че знайшли своє коріння серед пролитої крові Колумбійської громадянської війни, коли комуністичний сектаціонізм затримував мільйони людей у багаторічному циклічному насильстві. Че залишив Колумбію зміненим чоловіком: таким, що жив і дихав своєю ідеологією. Після тренувань у джунглях Юкатану, Че супроводжував Фіделя Кастро від початкової поразки на Гранмі до остаточної перемоги в Гавані. На Кубі він став відомим своєю енергійною, безжальною відданістю комуністичній справі, часто проводячи голосування серед своїх товаришів по революції щодо виконання вироків щодо полонених і ніколи не відводячи погляду від очей чоловіків, яких засудив до смерті авангард народу. Залишивши Кубу, Че подорожував Південною Америкою як блукаючий партизан, пропонуючи навчання майбутнім революціонерам і перетворюючи їх у кістки стійких визвольних рухів, як це було з ФУЛНА. Тепер, після того, як він пережив ув'язнення в Чилі та насильство парагвайського перевороту, Че відмовляється залишити свою розділену, нестабільну революцію, побоюючись, що вона відхилиться так, як це сталося з Кубою. Звісно, цей мандрівний революціонер ще має багато чого зробити."
  Paraguay_Juan_Manuel_Frutos_desc: "ПЛЕЙСХОЛДЕР"
