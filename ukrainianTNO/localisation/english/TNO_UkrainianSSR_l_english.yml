 UKS_lessons_of_the_long_march_idea_desc: "Уроки Великого Походу"

 UKS_scouts_0: "Розвідники на заході"
 UKS_scouts_0_desc: "Як казав колись Сунь-дзи: "Той, хто знає ворога й себе, ніколи не програє війни". Набуття знань й розвідданих про поточні справи та запити німецької адміністрації, забезпечить достойну перевагу над їхніми силами - навіть за умов більш професійного оснащення й достатку в забезпеченні.\n\nУ такий спосіб ми будемо надсилати розвідників глибоко в ворожий тил, аби звідувати необхідні відомості, які нададуть нам перевагу в розвідці над ворогом. Цього буде досягнуто з максимальною секретністю й тишею - адже німці не зможуть вразити те, чого не бачитимуть".

 UKS_scouts_1: "Посилення розвідувальних операцій"
 UKS_scouts_1_desc: "Як терміти нищать деревину й роблять шкоду в будинку, так і наші розвідувачі - на їхній превеликий жаль, осквернили безпеку німецької адміністрації! Завдяки величезній кількості відомостей, отриманих від розвідників - ми зможемо не тільки передбачити, але й знати задуми німців. Дані від розвідувачів, безумовно, стануть безцінним засобом проти німців.\n\nХай полчища нацистської погані й реакціонерів насуваються, бо жоден їхній замисел не вберегти від наших вух. Німці не усвідомлюватимуть, що їх вразило, якщо їхні плани з повною виразністю розкриються перед нами.

 UKS_root_out_collaborators: "Викоренити колаборантів"
 UKS_root_out_collaborators_desc: "Колаборанти, диверсанти та шпигуни орудують проти нас щодня, діючи поза нашою увагою. Поки наші люди на полі бою, вони працюють в тіні, нишком: і навіть їхні найпростіші авантури, що завдають нам наймізернішого клопоту, можуть незабаром перерости в масштабні заколоти, нищення шляхів постачання та інформації, що прирікатиме нашу справу на загибель. Цілком безумовно, необхідно вжити відповідних заходів для придушення цієї рани, що розширюється й гноїться, аби осередки колаборантів не поширювали метастази на решту звільненої України, і не зумовили Червону армію до всебічного безконтрольного відступу - чи навіть знищення."

 UKS_rally_the_komsomol: "Згуртувати комсомол"
 UKS_rally_the_komsomol_desc: "Чимало років расової напруженості та етнічних конфліктів, із часів давньої Російської імперії, заклали джерело етнічної ненависті й недовіри серед дорослих і дітей України. Мракобіське мислення процвітає поміж населення, особливо старішого покоління, та цього не можна залишати без уваги: зрештою, які в нас є можливості протистояти оточуючим ворогам, коли ми полишаємо наш народ настільки розділений, що точить зуби один на одного?\n\nАби виправитися від цього та по-справжньому збудувати нероздільну соціялістичну Україну, ми повинні працювати гуртом, і це почнеться з дітей - бо найлегший шлях до батьківського серця лежить через їхню дитину. Відкинувши й забувши роки фашизму та внутрішнього розколу, діти нестимуть слово комунізму й нове майбутнє, якого ми зможемо досягти, якщо віритимемо в соціялістичну Україну".

 UKS_convene_factory_councils: "Скликати заводські ради"
 UKS_convene_factory_councils_desc: "Аби збудувати арсенал, дійсно здатний захистити нас від тих, хто жадає загасити наше полум'я свободи - нам необхідна промисловість для виробництва зброї, якої ми настільки відчайдушно потребуємо. Існує чимало способів досягти цього, але слід лишатися вірними нашим принципам і впорядити заводи в соціялістичному зразку.\n\nЗосередження промисловості й колективізація її виробництва зробить нас набагато ефективнішими в керуванні нашою воєнною економікою, і з нашою набутою продуктивною адміністрацією, ми зможемо скерувати ще більше засобів на будівництво нових заводів і зброї".

