 UKS_Revolutionary_Will_GUI_Desc_tt: "Об'єднані наміром, ідеалами та доктриною під керівництвом §VОлександра Шумського§!, £UKR_communists §SКомуністична партія України§! знемагає від більш-менш небагатьох внутрішніх контроверз. У нинішньому стані, єдиною перешкодою для нашої революції є те, що §MУкраї§!§Yнський§! народ охоче сприймає гармати £UKR_reichskommissariat §jнімців§!.\n\nКеруйте розсудливо нашими взаємовідносинами з населенням, і £UKR_communists §Sкомуністичне§! розуміння досягнеться безкомпромісно - провалитеся, і революція запросто може повернутися до §Rдиктатури§! центрального комітету, фарсово повторюючи помилки 1919-го."

