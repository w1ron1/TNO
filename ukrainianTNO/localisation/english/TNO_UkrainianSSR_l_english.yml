 UKS_military_category: "Українська Робітничо-Селянська Червона Армія"
 UKS_military_category_desc: "\n\n\n\n\n\nНаші сили значно перевершують - як за якістю, так і за кількістю, будь-якого потенційного внутрішнього противника, за винятком £UKR_reichskomissariat §jРайхкомісаріяту§!. Та якщо ми жадаємо перемогти, то ми не можемо сприймати це за належне. Перехід від повстансько-партизанських сил до гідної армії, запровадження спільнодії родів військ, розширення наших рядів - усе це буде важко, проте необхідно, якщо ми сподіваємось побачити полум'я Української революції.\n\nНаразі ми маємо [?UKS_military_points] §Rвійськових очків§!."

