 UKS_vindicate_long_march_desc: "Незважаючи на найгірші зусилля нацистів знищити Радянський Союз, ідейні спадкоємці большевицької революції все ще вижили. Вони повернулися, щоб побачити, як їхнього заклятого ворога тепер пожинає вихор.\n\nВизначальна місія КПУ - Великий Похід, була випробуванням, яке б жодна розсудлива людина не витримала. Хоч захист сходу України від контролю Вермахтом був брутальним і хаотичним, та він назавжди залишиться свідченням оновленої Соціялістичної Республіки - наддніпрянці нарешті повстали проти десятиліть поневолення, що не можна пробачити. Оскільки Україна впала в анархію, ми повинні діяти швидко. Чи буде це солодка перемога, або ж гірка поразка - сили КПУ залишаються непохитними для того, що приходить, коли революція знову спалахує."
 UKS_liberate_downtrodden_desc: "В Україні не залишилося жодного кусеня землі, де ми б не бачили звірства нацистів: від дорожніх блокпостів, до фабрик зброї й нескінченних загороджень колючого дроту. Жертви потворної мрії Третього Райху в Житниці лежали перед нами, відчайдушно прагнучи будь-якого шансу здійснити пекло на німцях, за їхні злочини проти народу.\n\nЦей момент нарешті настав, і члени КПУ більше, ніж раді, не перешкоджати своїм співвітчизникам у помсті. Не залізна хватка нацизму вирішуватиме їх життя, а сполучена сила об'єднаної, братської громади! Звук фабричних ліній гуркотить рівнинами; тріск наших рушниць, що звучать, як кінець панування прусаків!"
 UKS_swing_clubs_pull_triggers_desc: "Німецькі поселенці в Україні все ще жадібно трясуться над продовольчими запасами Житниці, незважаючи на триваючу громадянську війну. Основні бенефіціари нацистської тиранії в регіоні набивають собі животи, доки наші співвітчизники голодують: зерном, зібраним з нашої землі, обробленим нашими людьми та облитим нашими слізьми.\n\nЯкщо в цих німців є хоча б крихта співчуття, вони знатимуть гостру потребу в їжі для наших солдатів. Як мають якісь застереження щодо Ґерманії, за її ставлення до наших людей, то вони не будуть перешкоджати захопленню їхніх запасів.\n\nНа жаль, навряд чи щось відчувають поселенці на Дніпрі. Незалежно від презирства чи симпатії, які хтось із нас мав би: забезпечення нашої продовольчої безпеки мусить бути пріоритетним; ми всі надто обізнані методами примусу Райху. Місцеві німці повинні молитися, аби ми не відповідали схожим чином..."
 UKS_empty_warehouses_desc: "Здавалося, що нацисти дуже мало дбали про підтримку інфраструктури своєї колоніяльної імперії, попри їх нестерпне чванство. Навіть, коли вони у відчаї намагаються втриматися за нашу Житницю: склади та майстерні, забиті німецькою зброєю й обладнанням, були покинуті Вермахтом. Те, що було знаряддям ненависті, аби приректи нас на забуття, тепер стане точкою опори для вигнання Третього Райху з нашої рідної землі!"
 UKS_khvylovy_plan_desc: "Микола Хвильовий знає, яку силу може мати пропаганда, щоб збудити дух наших співвітчизників. Це знаряддя, яким самі німці володіють з жахливою ефективністю. Тепер наша черга знову згуртувати націю під знаменем соціялізму, оскільки Райхскомісаріят відкрито розвалюється, а створене панування Німеччини над українцями, безповоротно зруйноване.\n\nКожен дорожній робітник, домогосподарка, селянин і службовець, від Києва до Чорного моря, горить червоним вогнем революції! Міжнародівка, Священна війна і Полюшка-поле ревуть з горла кожного чоловіка, жінки, і дитини нашої великої країни! Підніміть ваші голоси і проспівайте з душами мільйонів загиблих від рук німців: УСЯ ВЛАДА РАДАМ!"
 UKS_exploit_enthusiasm_desc: "Прихід німецької окупації загнав багато української молоді назад у обійми КПУ, хоча чимало наших співвітчизників не згадують з захопленням бухарінську добу. Чи то в полях, на фабриках чи в армії, уся наша нація зухвало протистоїть прусацькій загрозі.\n\nНімеччина зі страхом дивитиметься, як їхній старий ворог пересікає пагорби вдалині: юні українці крокують в дідівських гімнастерках, із рушницями в руках і люттю в серцях. Київські діти простягають кулаки до неба, стискаючи в руках Серп і Молот, що піднімаються над Дніпром, аби їх побачив увесь світ!"
 UKS_snap_wires_cut_fuses_desc: "Якщо могутність старого Радянського Союзу мала щось проти Третього Райху, то це був талант хитрощів. Диверсанти й шпигунські групи Кремля були одними з найкращих у світі, методологія яких, може бути нині відтворена для схожої тактики проти німецького ворога.\n\nЩе задовго до того, як спалахнула громадянська війна, райхскомісаріяти вже були втіленням непорядності й недбалості. Шпарини в інфраструктурі, побудованій Німеччиною просто чекають, щоб їх використали: тут - обірваний телеграфний дріт, там - зникла вантажівка. Навіть в найсильнішому ланцюзі є слабке місце, і ми знаємо, де саме розламати слабку ланку…"
 UKS_industrial_base_sand_desc: "Справжнє призначення Райхскомісаріяту Україна навряд чи було приховане від неозброєного ока. Тривожна скупість німців розглядала наших співвітчизників радше, як бур'янів серед їхніх колекційних культур, демонструючи більше захоплення брудом під нашими ногами, замість будь-якого життя, що ним крокує.\n\nМожна припустити, враховуючи переваги збереження спотвореної версії традиційно аграрної економіки України для нацистського режиму, що це не схилило німців до повсюдного промислового розвитку Житниці. Будь-яка спроба розбудувати місцеву промисловість, має надходити лише з наших рук; план розвитку, який більш ніж достатньо затверджений КПУ, аби розпочати його втілення в життя."
 UKS_patriotic_army_slaves_desc: "Навіть серед пагорбів і полів, ледве не єдиною жертвою нацистського загарбництва є наші земляки. Здавалося б, із кожної місцини, якої торкнувся німецький наступ - рабів зі Сходу везли в Україну й вивозили з неї, щоб вони доглядали за посівами нацистської Житниці. Від співвітчизників-слов'ян, до знедолених євреїв і навіть німців-емігрантів, усі об'єднані жорстоким зв'язком через ненависть до Батьківщини.\n\nІз прогалинами, що почали з'являтися в фронті, є дуже багато місць, де наші солдати водночас можуть перебувати. Бажаючі з числа робочої сили Третього Райху сформують спеціальні загони разом із нашою армією, де ми зможемо боротися пліч-о-пліч, щоб розірвати кайдани нашого спільного поневолювача - ось де визволення рабів пов'язане з революцією.
 UKS_form_militias_desc: "Залишки Української Червоної Армії належать до найкращих військ у світі, як і їхні колишні товариші в Росії. Між Великим Походом на схід і десятиліттями, витраченими на підрив нацистського панування в регіоні, час і досвід перетворили їх у майже незламне військо. Проте наймолодші із нашої невеликої групи солдатів - віком від 45 до 50 років і старше, тому час не на нашому боці. Незважаючи на те, що під нищівним тиском, ми мусимо побачити Вермахт переможеним, це не сприяє довговічності будь-якому війську.\n\nІнша можливість, що єдина в наявності: укріпити українським народом нашу лінію фронту самотужки - джерелом життя революції, що є нашою причиною для боротьби. Вони можуть бути й не навченими сучасній війні, оскільки бояться німців на дикій землі - але, як і ми, знають рахунок також добре, як жахливу ціну, якої нам доведеться спіткати за невдачу..."
 UKS_frontline_fritz_desc: "Оскільки німці були настільки одержимі ідеєю збереження України в складі своєї престарілої колоніяльної імперії, глибоко іронічно, що єдиною найефективнішою зброєю проти нацистів, виявилася ця земля. Просторі землі в поєднанні з переважаючими рівнинами створюють лінію фронту, що нагадує ситуацію з Першої світової війни, де, здається, вона завжди стає все більшою для оборони, незалежно від того, наскільки чимдалі викопано окоп.\n\nА в цей час партизани, об'єднані з нашою справою, атакують сполучення німців у ворожому тилу, позбавляючи гунів необхідних ресурсів.\n\nУ німецькій обороні вже утворюються тріщини, відкриваючи шляхи до їхнього постачання, переслідувані нашими ополченцями. З їхніми озброєннями в оточенні, ми позбавимо Вермахт зброї та боєприпасів, необхідних для боротьби."
 UKS_wait_galicia_desc: "Україна — не єдиний райхскомісаріят, який скуштував вогню війни, бо на заході, знаходяться наші поневолені брати-слов'яни в Польщі, яких так само охопила громадянська війна, разом із більшою частиною сходу Європи. Поки наші серця тужать за тяжке буття українців у Галичині, війна за Житницю й Вермахт вимагають нашої уваги в першу чергу.\n\nПроте, хоча й наша громадянська війна все ще триває, ми все рівно можемо надати певну допомогу для українців та інші слов'ян, які тікають з Польщі. Створивши місця для таборів гуманітарної допомоги й зберігаючи напоготові запаси продовольства та медикаментів, ми зможемо протистояти неминучому потоку біженців із заходу, які перетинатимуть наш спільний кордон.\n\nА коли війна в Галичині затихне, і сили, які б там не залишилися, зализували би свої рани - ми кинемося на них вовком і поглинемо ворогів."
 UKS_if_you_want_soon_desc: "Місяці йдуть, а громадянська війна продовжує тривати - багато хто стурбований, що конфлікт може затягнутися на роки. Навіть, якби моральний дух цивільного населення й солдатів був нескінченним: це лише питання часу, коли Німеччина оговтається від власної громадянської війни, і почне зміцнювати позиції Вермахту в Україні. Час спливає, адже бої за Житницю стають все більш запеклими з кожною годиною.\n\nКерівництво КПУ вирішило розпочати грандіозну офензиву проти німців навпроти наших кордонів, сподіваючись підставити ворога під удар, і, можливо, здобути швидку перемогу. Уряд КПУ не пошкодує ні зерна, ні боєприпасів, оскільки армія посилюється, готуючись до майбутнього наступу. Ми повинні бути готовими: ця операція може як змістити момент на нашу користь, так і призвести до поразки, від якої ми ніколи не зможемо оговтатися…"
 UKS_top_down_training_desc: "Реальність зародження революції дійсно піддається такому професійному вишколу, яке отримують наші вороги в Вермахті, враховуючи, що так багато наших найбільш довідчених ветеранів відчайдушно потребують на передовій. Це не означає, що нам не вистачає людей, здатних виховати нове покоління солдатів. Проте недостатньо лише навчити людину як стріляти з рушниці, чи як перев'язати рану.\n\nУкраїна потребує героїв, справжніх ікон для народної справи. Не лише в розпливчастих чи абстрактних визначеннях, а на досить реальному та глибоко людському рівні. Партизанам КПУ не бракує людей, здатних виконати ці ролі. Такою є вимога революції - вигнати нацистів із нашої землі. Завдяки фінансуванню та реструктуризації наших об'єктів для цих легендарних революціонерів, це сприятиме зміцненню морального духу нашої піхоти й надасть солдатам найкращу підготовку, яку ми можемо їм забезпечити."
 UKS_long_march_paces_desc: "Саме стежка Великого Походу на схід повернула Соціялістичну Республіку з небуття, адже вона стала прикладом стійкості тієї частини Української Червоної Армії, що залишилася. У ці найтемніші часи, солдати КПУ навчилися шукати й збирати все, що могло потрапити до їхніх рук. Навіть, коли Вермахт наступав на них, Українська Червона Армія виявилася надзвичайно винахідливою, вихоплюючи з рук німців та їхніх підрозділів їжу й зброю.\n\nЦя тактика виявилася безцінною для забезпечення нашої військової машини, що може бути життєво важливим, аби остаточно вигнати німців із України. Коли Громадянська війна вступить в наступну фазу, ми вже побачимо, що Вермахт починає хитатися. Дехто з нас усе ще сумнівається про необхідність настільки жорстких заходів для забезпечення їжі та озброєнь, однак ми не можемо втрачати будь-яку з можливостей, коли перемога так близько…"
 UKS_autobahn_frontline_desc: "У центрі монолітної інфраструктури Райху знаходиться Автобан - мережа автомагістралей, що з'єднує Німеччину з колоніями на сході. Мільйони людей гнули спину до смерті, аби побудувати й забезпечувати цю дорогу - похмурий монумент лебенсрауму Адольфа Гітлера.\n\nЯкщо було важко споглядати таку потвору через кров, змішану з її асфальтом, то кривавий слід, який досі грає червоним кольором на дорозі, теж цьому не сприяє. Проте Автобан є рідкісним випадком (у прямому сенсі), як один із робочих проєктів Райху, може принести користь людям, котрі були вбиті під час будівництва: Автобан забезпечує "дорогу життя" для пересування військ - як наших, так і Вермахту. Незліченна кількість дерев вже була вирубана, аби зберегти контроль над дорогами, і ще більше буде втрачено, перш ніж магістралі будуть остаточно захоплені Червоною армією."
 UKS_wartime_harvesting_desc: "Громадянські війни з самого початку були суцільною трясовиною людських страждань, яка лише погіршувалася з кожним місяцем. Мине небагато часу, доки запаси зерна будуть вичерпані, якщо не з'їдені Червоною армією на марші, або їх привласнять собі гуни, якщо наші позиції відкинуть назад.\n\nНа випадок чогось подібного, усе ще є добровольці та призовники за лінією фронту, у резерві, яких треба ефективно використати, доки війна ще не скінчилася. Їх відправлять на ферми й поля, для збору врожаю, аби зібрати якомога більше дорогоцінних урожаїв Житниці.\n\nЦього має вистачити, щоб зміцнити наші продовольчі запаси, для приготувань до останнього удару по німцях."
 UKS_disease_vermin_desc: "Хоча це боляче ранить наших співвітчизників глибоко на особистому рівні, німці - не єдиний ворог, із яким ми зіштовхуємося на полі бою. Реакційні мілітаристи й невдоволені республіканці, були так само зайняті керуванням фронтами війни, як ми й Вермахт - чіпляючись за настільки ж застарілі й огидні ідеали, що приведуть нашу неньку до загибелі.\n\nМи не можемо дозволити собі жаліти на війні, потрібні дії: дії, які потребують людей, що потребують їжі й припасів для підтримки обох. Націоналістичні й республіканські партизани утримують позиції на нашій території, і вони забирають більше зерна зі сховів України ніж їм належить.\n\nВійна, Голод і Смерть вже панують в Житниці, і цілком доречно, що Мор урешті приєднається до них, коли Громадянська війна наблизиться до завершення…"
 UKS_handful_chips_desc: "Ця війна затягнулася набагато довше, ніж передбачали наші, навіть найфаталістичніші прогнози на початку: адже в нас залишилося лише кілька витівок, до яких ми можемо вдатися, аби вивести нацистів із рівноваги. Усвідомлення того, що ворог так само виснажений до межі, для нас є єдиною втіхою - навіть німецька догма про перевагу на полі бою, стає порожньою перед загрозою голоду.\n\nУ той час, коли боєприпаси, їжа й моральний дух перебувають на найнижчих щаблях, ми були змушені ділити й без того мізерні ресурси, що були в нашому розпорядженні. Безумовно, існує неприваблива політика, до якої ми можемо вдатися, аби підтримати наші запаси, що вичерпуються: українське збіжжя залишається товарною культурою навіть під час війни - культурою, яку країни Чорноморського басейну й Придністров'я готові обміняти на поставки зброї для Червоної армії."
 UKS_raise_stakes_desc: "Зоряна доба України підходить до завершення: немає жодної людини, на фронті й у тилу, яка б цього не бачила - усі зріють перед собою, що кінець боротьби не за горами. Вермахт розбитий, націоналісти дали драла, а республіканці розбіглися по глухоманях. Лише Червона Армія та КПУ мають рішучість довести цю справу до кінця.\n\nСаме тут підготовка до останнього удару проти ворога, є найбільш життєво важливою - адже найбільшою зброєю, яку ми маємо, залишається український народ. Червона Армія збирає свої людські ресурси, із кремінними серцями й твердою волею. Вантажівки на ходу, озброєння розміщується на місцях, снайпери виставляють свої приціли в далечінь фронту. Об'єднана сила України зосереджується для останнього наступу проти ворога."
 UKS_soviet_supernova_desc: "Спогади про добу 42-го й просування нацистів углиб Радянського Союзу назавжди закарбувалися в думках керівників Червоної армії. Жахіття, яке навряд чи може бути зайняте навіть для найглибших закутків пекла, бачив кожен, хто був свідком цього: поранених людей виводили з лікарень на вулиці, щоб облити водою з шланга й кинути гибіти в снігах. Жінок, дітей і старих вишиковували в ряд у яму й розстрілювали як худобу. Зерна Райхскомісаріяту, облиті кров'ю цілого покоління.\n\nТепер приходить рільник, жнивар від народу, щоб оголити, винищити й більше не терпіти зло Райху!\n\nНастає остання дія Соціялістичної Республіки. Нацисти воліють для нас долі ще гіршої, ніж смерть. Нехай усі, хто виступає проти нас, знатимуть лише серп і молот - хай ці благословенні поля стануть нашими могилами!"
 
 #UCW Tree - New
 UKS_second_ukrainian_revolution: "Друга Українська революція"
 UKS_turn_schuma: "Поверніть Шуму"

#Post UCW Tree
 UKS_twentythree_Once_More: "1922… іще раз?"
 UKS_twentythree_Once_More_desc: "20 років. Ціле покоління українських хлопчиків і дівчаток, вихованих під ярмом, загублених у нескінченних пошуках власної самобутності - того, що можливо назвати домом. Справдежнє покоління, піддане напасті націонал-соціялізму; німецькій загрозі, несучи страждання, що промайнуло крізь кожну оселю.\n\nТакого більше не буде! Наддніпрянські землі нарешті звільнені від невольних кайданів, і вогонь революції тут, щоб очолити їх. Завдяки нашим зусиллям, народ України нарешті отримав перепочинок, якого нас позбавляли занадто довго, і тепер настав час віднови - відбудови культури, благодаті та співдружби.\n\n§KІде 1922 рік, знову настала пора української весни!§!"

 UKS_the_reapers_scythe: "Жниварська коса"
 UKS_the_reapers_scythe_desc: "Хоча нацистського провісника смерті погубили - Кирпа продовжує пожинати свій врожай всією країною.\n\nХвороби колишать міста, скрута й голод панують в селищах: а повстанські загони, розкидані вздовж країни, продовжують віднімати тисячі українських життів кожного тижня. Як ми матимемо змогу стверджувати, що боремося від імені народу, коли така сваволя все ще триває?\n\nДоволі, настав час покласти край цьому божевіллю, аби не втратити довіру наших людей, за яку ми так відважно боролися." UKS_the_reapers_scythe_tt: "Щомісячний рівень бідності: §G-0.05§!"

 UKS_stem_the_rot: "Стовбур, що гниє"
 UKS_stem_the_rot_desc: "Якщо казати простими словами, то Райхскомісаріят не був особливо зацікавленим у підтримці системи охорони здоров'я. Десятиліття злиднів і недоїдання дали своє, оскільки тиф, холера та грип охоплюють села. Із огляду на те, що переважна більшість медичної освіти була для німців - а усі вони, так чи інакше, більше не в наявності, то ми перебуваємо в неабиякому становищі.\n\nМи повинні вислати до сіл усіх, хто має будь-які знання медицини й кого маємо під рукою. Йод, бинти, чиста вода - усе, що ми відшукаємо, потрібно відправити разом із ними. Ми не зможемо вирішити цю проблему за день, але, принаймні, зуміємо дещо полегшити страждання."
 UKS_stem_the_rot_tt: "Інші щомісячні втрати: §R+20§!M"

 UKS_feed_the_masses: "Нагодувати маси"
 UKS_feed_the_masses_desc: "Повстання сильно підірвало й без того бездуже сільське господарство України. Оскільки угруповання здійснюють набіги одне на одного та спалюють посіви; не кажучи вже про те, що німці намагаються якомога більше заморити нас голодом, за допомогою свого нагального плану голодування - ми стрімко наближаємось до катастрофи. Їхні жорстокі дії не змогли здолати нас на полі бою, але вони могли позбавити нас миру.\n\nВирощування сільськогосподарських культур потребує суворої централізації під пильним наглядом держави. Жодна область не може сидіти на мішках із зерном, доки інші голодують. Голоду потрібно уникнути будь-якою ціною."
 UKS_feed_the_masses_tt: "Щомісячний рівень бідності: §G-0.05§!\nІнші щомісячні витрати: §R+10§!M"

 UKS_peace_and_bread: "Мир і хліб"
 UKS_peace_and_bread_desc: "У ті неспокійні дні 1917 року, Лєнін обіцяв російському народу три прості речі - мир, хліб і землю. Ми відвоювали нашу землю в німецьких поневолювачів і повернули її людям, а тепер, головні бажання, які залишилися в головах людей: мир від нескінченного насилля, яке стало звичним в Україні, і легкодоступна їжа на їхніх столах. Якщо ми називаємо себе представниками народу, наш обов'язок - зосередитися на цих двох питаннях над усіма іншими."
 
 UKS_monopoly_of_violence: "Монополія насильства"
 UKS_monopoly_of_violence_desc: "Хоча наша революційна боротьба за звільнення України від її кайданів може бути завершеною, але на дорозі до хліба й миру ще присутні численні труднощі. Реакціонери крокують по нашій землі, влаштовуючи засідки на наших людей і намагаються продовжувати битися в ім'я недолугої справи, яку ми вже здійснили. Окрім того, місцеві бандити та злочинці продовжують розповсюджувати корупцію.\n\nПолітбюро одностайне: якщо ми хочемо створити соціялістичну державу, то повинні використовувати свою монополію насильства, як держава, аби винищити всіх тих, хто норовить підірвати нашу владу. Вірні комуністи боролися й гинули, щоб привести нашу партію до перемоги - ми б таким чином плювали на їхні могили, якби не показали цим покидькам, хто ними керує."
 UKS_monopoly_of_violence_tt: "§RДовготривала присутність УПА та УНРА буде знищена.§!\n\n§YОсердні УПА та УНРА вилучаться всюди, окрім їхніх крайніх опорних пунктів на заході.§!"

 UKS_anti_partisan_campaign: "Антипартизанська кампанія"
 UKS_anti_partisan_campaign_desc: "Війна виграна, але не скінчена. Ми відвоювали міста, вигнали звідти німців, поставили на коліна УНРА та УПА - та ці двоє все ще тримаються, як трикляті таргани. У горах Трансільванії вони й далі чатують так, ніби ще не програли, і кожен день, на їх звивистих дорогах, іще один конвой із постачанням зазнає нападу.\n\nЦьому необхіднр нараз покласти кінець.\n\nОстаннє, чого потребує Україна - повстанців, які й гадки не мають, коли вони спиняться нівечити наші зусилля з відбудови. На щастя, деякі розхристані зрадники, що вдають з себе справжню армію, не можна порівняти з нашими військами. Забезпечені, організовані та на голову вищі за більшістю здібностей, браві сили наших людей зможуть назавжди покінчити з їхньою маленькою партизанською війною. Наші військові націляться на цих терористів і заб'ють їх".

 UKS_banish_the_underworld: "Вигнати злочинне кубло"
 UKS_banish_the_underworld_desc: "Жоден вакуум влади не триває довго. Коли німецький порядок почав відмирати - несподівано, не стало нікого, хто б охороняв вулиці наших похмурих і зморених міст. Злочинні організації, що ховалися під поверхнею, виринули з каламуті, аби скористатися цим - бо лише вони володіли зброєю, чисельністю й згуртованістю, щоб по-справжньому мати контроль над містом. Злодійські авторитети стали схожими на місцевих королів і розпоряджалися містами, як своєю власністю: грабуючи, стягуючи данину, торгуючи наркотиками та глумлячи. Незважаючи на наш запроваджений контроль, ці баскаки українських нетрів продовжують панувати з незмінним терором. Нам потрібно дати війну цьому тіньовому режиму й повалити вуличних самодурів, як ми розправилися з багатьма іншими".

 UKS_the_rolling_tide: "Прилив"
 UKS_the_rolling_tide_desc: "Ці відступники та реакціонери - ніщо, коли не настирливі. Вони відмовляються визнавати свою поразку навіть перебуваючи на вістрі багнета, і криються на пагорбах, у горах, лісах і полях. Вони користуються беззаконням на цих землях, аби міцно триматися за свої повстанські вотчини; чи лишень живуть, ніби уславлені опришки - як це було задовго до війни. На щастя, ми приготувалися до цього. Із нашими гарматами, бомбами, танками й революційною волею, ми викорінимо ці загрозливі пережитки минувших воєн. Особливо корисними будуть наші бази на Донбасі, які володіють цими якостями в повній мірі. Могутня наша армія прокотиться на захід своїми ногами, вантажівками й танками, і відвоює нашу країну!"

 UKS_vir_triumphalis: "Viri Triumphales"
 UKS_vir_triumphalis_desc: "Товариша Шумського будуть пам'ятати, як одного з найбільших героїв для української історії. Завдяки його мудрому й сильному керівництву, та хоробрості наших солдатів, український пролетаріят поборов своїх німецьких зайд і звільнився від їхніх оков.\n\nАби відсвяткувати визволення українського народу, ми проведемо переможну процесію в Києві, щоб кожен міг побачити тріумф і увіковічнити цей момент у підручниках з історії. Українці більше не будуть жити в страху під нацистською неволею - сьогодні ми самі вирішуємо свою долю!"

 UKS_restore_ukrainization: "Відновити українізацію"
 UKS_restore_ukrainization_desc: "Після закінчення війни, тисячі й тисячі - німців і нідерландців, прибули в Україну. Затверджені багнетами Вермахту, вони осаджували наші землі, зселяли наших людей і прибирали до рук наші міста. Чимало хто втік під час повстання, проте залишилося також немало.\n\nНаша позиція мусить бути непохитною: Україна - для українців, і тільки для українців. Раз колоністи не дременуть, то вони й їхні діти мають призвичаїтися жити, як українці".
 UKS_restore_ukrainization_tt: "§LУкраїнська мова знову буде нашою мовою, український прапор - буде нашим прапором, українська культура - буде культурою України!§!"

 UKS_nationwide_census: "Всеукраїнський перепис населення"
 UKS_nationwide_census_desc: "Україна втратила незліченну кількість життів - між окупацією, війною та триваючою відбудовою. Реальним результатом цього є те, що відбудова проходитиме тяжко й складно - окрім наслідків чуттєвих. Аби справді стати комуністичною державою, нам потрібні всі руки, що ми зможемо одержати; і ми лишень не знаємо, скільки їх є в наявності. Документи були спалені, могили залишені безіменними, а сотні й тисячі солдатів мають невизначений статус "зниклих безвісти". Ми візьмемося за підбиття підсумків: з'ясування того, скількох людей було втрачено, і як живі можуть допомогти цій справі. Поза тим, це допоможе нам консолідувати нашу державу й навіть матиме етичну вигоду від того, що сім'ї загиблих і пропащих - зможуть вгамуватися, ба навіть возз'єднатися".
  UKS_nationalwide_census_tt: "LРезультати перепису потребуватимуть часу, щоб їх оприлюднити.\n\nПо мірі просування перепису, контроль у всіх регіонах буде посилюватися.§!”

 UKS_liberate_galicia: "Звільнити Галичину"
 UKS_liberate_galicia_desc: "На фронт, товариші! Лукава польська держава-обрубок у своїй реакційній зарозумілості, відмовилася повернути нашу законну територію Галичини - та ми не полишемо наших співвітчизників на поталу їхній неволі! Червона Армія зосередиться на кордонах біля окупованих територій: ми дамо полякам останній шанс прийняти наші вимоги й повернути те, що належить нам по праву. Якщо вони так і перечитимуть, ми візьмемо Галичину назад силою!"
 UKS_liberate_galicia_tt: "LШвидше за все, що вони не погодяться.§! §SПриготуйтеся.§!"

 UKS_spring_turns_to_summer: "Весна переходить в літо"
 UKS_spring_turns_to_summer_desc: "Коли ми визволили нашу Батьківщину від німців, наш народ був сповненим оптимізму та єдності, як ніколи з 1917 року. Утім, на заході звучать барабани війни, і навіть наші діти знають, що гряде далі. Націонал-соціялістичне страхіття крокує на схід, і какофонія їхніх машин війни пророкує кінець весни для нашої країни. Літо важкої праці й потрясінь на нас очікує: бо кожен український чоловік, жінка й дитина повинні підготуватися до прийдешнього буревію.\n\nТо ж нумо, товариші - бо коли, як не зараз, настав час для нас об'єднатися й продемонструвати непокору. Німці прагнуть позбавити життя наших захисників, винищити наших робітників і скорити собі тих, хто вижив - але ми розгромимо їхні полчища! Ми повинні, §Vбо поразка, означатиме погибель нашої революції, батьківщини та цивілізації...§!"
 UKS_spring_turns_to_summer_tt: "§LЯк темні хмари знову згущуються над землею, наша набута добра гадка згасає, коли знову постають старі тріщини. Однак незважаючи на це, ми маємо продовжувати рухатися вперед і пережити наступаючий борвій.§!"

 ### Івенти ###
 # Івенти УГВ
 UKR_u_ssr_cw.1.t: "Повернення"
 UKR_u_ssr_cw.1.desc: "Г-О-Р-Щ-И-К, Г-О-Р-Щ-И-К, Г-О-Р-Щ-И-К\n\nДесь в маленькій хатині поблизу Ростова прозвучало до цього мовчазне радіо, щоб неодноразово передавати єдине слово. Партизани вже знали його значення - за лічені хвилини, супи на столі з'їли, а люди вже розійшлися з рушницями й думками про прийдешні сутички. Бажання помсти й думки про всі жахи, що німці заподіяли їхній землі, палали в них. Вони зібралися визволяти Україну.\n\nД-О-В-Г-О, Д-О-В-Г-О, Д-О-В-Г-О\n\nПриблизно через хвилину, подібний випадок стався в хатині на околицях Донецька. Коли остання молитва закінчилась й товариші обнялися: сподіваючись, що це не востаннє, вони взяли до рук зброю й вийшли на вулицю, готуючись зустріти - смерть, окупантів, сволот у сірих мундирах. Вони збиралися помститися за своїх батьків. Зібралися визволяти Україну.\n\nС-Е-Р-Ц-Е, С-Е-Р-Ц-Е, С-Е-Р-Ц-Е\n\nУ Луганську, інша радіостанція передавала по квартирі повідомлення, яке уважно слухали партизан і його дружина. Незважаючи на всі протести коханої, усі "чи ти справді хочеш піти?", чоловік знав, що він повинен виконати свій обов'язок - свою обіцянку синові, який спокійно спав у іншій кімнаті. Він збирався покинути свою сім'ю напризволяще, аби повернути радість в їх життя, і нарешті змусити кохання свого життя знову посміхнутися."
 UKR_u_ssr_cw.1.a: "Він збирався визволяти Україну."

 UKR_u_ssr_cw.2.t: "Занедбана надія"
 UKR_u_ssr_cw.2.desc: "Визирнувши зі свого шанцю, Іванна затуляла вранішнє сонце своєю тремтячою рукою. Вона майже бачила бункер - усього за кілометр звідси. Тріск пострілів виднівся в досі темряві, вогняним спалахом крізь околиці. Форт був спроєктований бездоганно: його розташування на вершині пагорба з чималими рівнинами, робило форт першокласною спостережувальною позицією для наведення вогню й підтримки з повітря - достатньо для того, аби придушити революцію ще в її корені.\n\nТа це мало б бути запросто - тихий наліт вночі на групу п'яних охоронців-ледацюг гарнізону. Попри всі чутки про партизанів, як про хижаків із вершини харчового ланцюга - бабайок, якими лякають полохливих поселенців-фріців, багато хто з них, насправді, були ніким іншим, ніж боязкими селянами з обмеженою підготовкою й ще меншим забезпеченням. Це була вже третя на черзі атака цього вечора, яку відбив гарнізон після того, коли підлітка з їхнього загону застала осічка на підході. Комісар залучав добровольців до цих самовбивчих завдань, розкидаючи звичні слова про неминучу перемогу трударів і торжество рад. Ніщо з цього її особливо не переконувало: вона ще була в пелюшках, коли вторглися німці. Якби не її мати-полячка - вона, мабуть, була б із націоналістами.\n\n\Спостерігаючи те, як решта з наступу відходили до позицій партизанів, Іванна не могла уникнути мук совісті. Обличчя цих хлопців і дівчат, навряд чи вельми старших за її молодшого брата, що рятували свої життя, бігаючи - а, подекуди й кульгаючи. Вона знала: раз у комісара закінчаться люди, він почне розмахувати пістолею й виставляти претензії. Більше дітей перемеле гітлерівською циркуляркою за якісь архаїчні цінності.\n\nІванна вирішила: коли комісар віддасть наказ про наступну атаку - вона буде першою в черзі. Ніякого більше боягузтва, ніяких переховувань. Та коли вона піде в атаку - то не заради духу Лєніна чи розкладаючого трупу Союзу, бо коли Іванна боролася..."
 UKR_u_ssr_cw.2.a: "...то вона б це робила за те, аби загинуло на одного українця менше."

 UKR_u_ssr_cw.3.t: "Правосуддя на прикордонні"
 UKR_u_ssr_cw.3.desc: "Багно вкривало чоботи солдатів, що крокували вперед. У загону перехоплювало подих від постійних досягнень, вони значно просунулися лінією фронту; але успіх не може нагодувати людину чи дати їй перепочити. Командир загону спинився на секунду: у тиші він почув ревіння телят. Їхня оаза була близько, і він наказав своїм підлеглим іти слідом за ним до неї.\n\nВступ людей на ферму не зустрів опору, а сліди бруду повідомляли про випадок із німецьким гарнізоном, який утік, аби захистити тих, кого вважав більш важливими, аніж бідкаючі нідерландці. Озброєні фермери, що залишилися на відібраній землі, молилися, щоб лиш комуністи пройшли повз них - але їхні молитви залишилися непочутими, коли загін почав відвойовувати те, що колись належало їм.\n\nСолдати добиралися до своїх нових домівок, а загарбники вмовляли їх покрученою українською - оскільки їхнє пиво, їжа та дорогоцінності, були відібрані в голодуючих. Голод той був далеко не фізичним. Осельників вигнали з їхніх домівок і сховків для важливого оголошення від комісара.\n\n"За наказом Української Соціялістичної Радянської Республіки, ваші пожитки реквізовано, а вас усіх звинувачено в злочині розкрадання української землі та майна, ваш вирок - позбавлення громадянства, який має бути виконаний негайно. Для тих, хто залишиться, вироком буде смерть."\n\nОпір зустрічався прикладами гвинтівок - їх видворяли, погрожуючи зброєю. Сім'ї задавалися питанням, куди вони зможуть подітися, коли навколо вирує війна; інші, здавалося, змирилися зі своєю долею, позаяк вони ступали в нікуди, аби їх більше ніколи не побачили."
 UKR_u_ssr_cw.3.a: "Вони отримали те, на що заслуговували."

 UKR_u_ssr_cw.4.t: "Апокаліпсис"
 UKR_u_ssr_cw.4.desc: "Німці ніколи не втікають.\n\nУ засадах посеред ночі й перестрілках під пекучим сонцем - чоловіки в сірих мундирах боролися або вмирали. Навіть їхній відхід супроводжувався гуркотом гармат та авіабомб - і після того вони завжди поверталися, аби живого місця не залишити на почорнілій і скривавленій землі. Як пролунали похапцем останні постріли, то далеченько нічні зорі заблимали, а потім запанувала тиша. Вони вгаснули в пітьмі. Хирляве ревіння лунало далиною, усе набуваючи голосу.\n\nСприяло життю капрала Руслана впродовж тижнів сутичок лише те, що він схоплював усе на льоту, і саме це - тихий голосок прямо за його вухом, натужувався в тихий гул. Інші солдати сміялися й буйно палили в повітря, святкуючи визволення розтерзаних залишків селища. Ледве ніде не малося прихистку, і надто було багато розкиданого сушняку. Рукоятка його пістолета все ще відчувалася холодною, за винятком цівки. Гуркіт ставав усе гучніше.\n\nОдин із новобранців наблизився. Це був молодик із пшеничним пушком на підборідді, ледь старший шістнадцяти років. Коли він нахилив голову, капрал нарешті вгледів літаки, що пролітали повз небосхил. Від звуку здригнулася земля, і його голову огорнуло жаром. Хлопець відкрив і закрив рота, але то було запізно. Він розвернувся й побіг: кинувши зброю, впустивши капелюха, наосліп у далечінь - відчуваючи, як світ позаду закипає барвами. Ледве витанцьовуючи попереду нього, повітря хапалося, свистіло й рвалося в спину - пожираючи все, що дихало.\n\nТієї ночі село освітлювало все навколо впродовж кількох годин. Будинки перетворилися на пил: та навіть тоді попіл палав нескінченно, прилипаючи до кісток, ніби клей. Із усього взводу вцілів лише один чолов'яга. Якийсь медик намагався його допитати.\n\nРуслан витріщався на небо, коли згасали останні вуглинки напалму".
 UKR_u_ssr_cw.4.a: "Голос замовк, і він ні на що не дивився."

 UKR_u_ssr_cw.5.t: "У кращому світі"
 UKR_u_ssr_cw.5.desc: "Село Ольги ніколи не могло похвалитися чимось - навіть назвою. Найближчим селищем із назвою було Луків: тому й ті кілька хатин, що тулилися на його околиці, усі лишень звали його частиною. Але був він. Чоловік, частково жонатий із любощів, а частково задля потреби. Лице було його в ряботинні й грубим, але в руках він мав силу та звагу вершити своє буття. Не обов'язково краще, але зрештою буття. Або так вона гадала.\n\nГонор залягає глибоко в серці, і деколи потребує інших людей, аби його викрити. Минуло тільки кілька місяців після весілля, а Ольга вже завагітніла. І він вирішив, із якоїсь дурної клепки "закласти краще майбуття для них". Що в лавах українських водиться місце для ще одного солдата. Ні суперечок, ні сварок не було: лиш сльози, привітання від жінок, поклони від чоловіків, а після того - тиша. Удома все замовкло. Лише серденько, що краяло в її грудях, і випадкові поштовхи малюка складали їй компанію.\n\nУ селищі без імені була стара приказка, яка вийшла з ужитку кілька поколінь тому: "Доля швидко гарцює, але відсутність її гарцює швидше". Загинув він ледь не одразу: у своєму першому бою, піймавши кулю "з найвищим героїзмом, рятуючи одного з товаришів". Місяцем пізніше після того, як він зачинив за собою двері, вони відчинилися знову, унісши тонку дерев'яну труну - розкіш у ці часи, як їй сказали. А також офіцера з суворим обличчям, який надав його останню платню. Кілька вичавлених слів на поминках, і все. Ольжине селище знову не мало нічого."
 UKR_u_ssr_cw.5.a: "І це все? Невже люди народжуються для такого?"

 UKR_u_ssr_cw.6.t: "Здобич війни"
 UKR_u_ssr_cw.6.desc: "Вадим поклав руки на кульші, глядівши на чималу будівлю з місця на пагорбі, що перебувала перед ним. То була садиба, ніби з картини: із пофарбованими кам'яними стінами, видовищними арками над вікнами, розкішно оздобленими верандами й безліччю інших прикрас. Прохід пролягав через сад, який мусили б доглядати, мабуть, десятки рук: утомлених від праці, мозолистих, укритих порізами українських рук.\n\nВигадка про те, що будинок є настільки старовинним, була цілком переконливою - доки не зауважиш, наскільки гладкий камінь, настільки незайманий дерев'яний ґанок і напрочуд молодий ліс довкола. Згідно з свідченнями Вадима, це було помешкання німецького офіцера. На його превеликий жаль, підлеглі Вадима поверталися зсередини з витворами мистецтва, грошима та меблями, а не з головою бузувіра на палі. Один чоловік мчав крізь витоптаний сад, піднімаючись на пагорб назустріч Вадиму. "Я так розумію, його не було вдома?", - запитав Вадим. Солдат кивнув, коли його наздогнали ще двоє, один із них мав червоне сукно в руках. "Ні, товаришу. Ми взялися… експропріювати, як ви дозволите? Усе це, зрештою, колись відібрали в нас", - відповів чоловік. Вадим кивнув, ледь помітно здійнявши брову при вигляді шмати. "Звісно! Вирішите суперечку, товаришу?", - сказав він, напрочуд схвилювавшись. Вадим кивнув, нахилившись вперед, ніби просячи його продовжити. "Це прапор Німеччини. Ми його спалимо чи залишимо?"\n\nВадим зробив павзу, потім витяг ручку. Він простягнув її чоловікові з прапором, не чекаючи, доки той розгорне його. Той витріщився на ручку. "Нумо", - гаркнув Вадим. Брови солдата зіщулилися, а тоді по черзі розійшлися. Очі розширилися від усвідомлення. Посміхнувшись, він взявся до роботи, підписуючи прапор - а потім передав його чоловікові, що був поруч. Коли чоловіки закінчили обшуки й поклали свою здобич, то почав збиратися натовп, аби взяти ручку й залишити свій підпис. Вадим підписав прапор останнім, щоб забрати його додому, як тільки матиме змогу повернутися."
 UKR_u_ssr_cw.6.a: "Сподіваємося, невдовзі."

 UKR_u_ssr_cw.16.t: "Поля соняхів"
 UKR_u_ssr_cw.16.desc: "Се був іще один сонячний день, коли прохолодний, тихий вітер віяв над українською землею. Зазвичай це місце біля крихітного селища, у кількох кілометрах від Донецька, оминають в спокої. Однак сьогодні так не було.\n\nП'ятеро солдатів, що вималювалися на круговиді, несли на собі три тіла - своїх товаришів, полеглих у черговій війні, яку виділа ця земля; один із них, до того ж, ще й ніс хрест. Було видно, що чоловіки поспішали: наскільки могли зрозуміти старі дерева, вороже військо готувалося до контратаки на звільнене неподалік місто. Хутко викопавши велику яму, вони обережно поклали своїх побратимів: помолилися за їхній вічний покій, зронили кілька сліз на посохлу землю, поставили хрест і пішли, готуючись до майбутніх боїв.\n\nВідколи солдати рушили, могила зосталася недоторканою, і троє друзів спочивали під тінню могутніх дубів. Через рік, коли прийшла чергова весна, хлопчик і дівчинка гуляли цим місцем, шукаючи патиків, аби погратися - певне, десь є їх пара під тими чималими деревами? І тут вони побачили щось дивне й водночас чудове, що запам'яталося їм надовго.\n\nБіля хреста росло три соняшники."
 UKR_u_ssr_cw.16.a: "А згодом туди поклали солодощі."

 UKR_u_ssr_cw.17.t: "Пересікаючи Дніпро"
 UKR_u_ssr_cw.17.desc: "Земля гриміла під нами. Бої йшли ледь не до самої Балівки, де німці вели вогонь з вікон та загороджень, що вони порозставляли на вулицях. Хоча ми мали чисельну перевагу, більшість з нас були озброєними старими "мосінками" чи німецькими 98-ми, які добре пасували для далеких дистанцій, але були завеликими для обмежених просторів - більшість багнетів, тим часом, заіржавіли. Я знав: якби вони готувалися втримати селище, то поставили б снайперів на верхні поверхи й обладнали кулемети на позиціях. Оборонялися вони поступово - відступаючи за графіком, наближаючись все ближче до річки.\n\nДосвід мені радив: як німці не будуть це обороняти, вони його знищать - питання полягало хіба в тому, чи встигнемо ми переправитися до того, як падатимуть бомби. Я зайняв позицію за ґанком, добре схований від уламків, прикриваючи вогнем через вулицю. Попереду ревів Дніпро: ми настільки були близько до мосту через річку, що відчували дух бризок. Це був широкий, ваговитий міст - а ще присутня чимала ймовірність того, що його замінували, аби підірвати знизу; чи то зробили мітки фарбою, щоб літаки змогли націлитися на нього. Усіляко кулі все ще пролітали прямо над нашими головами, униз вулицею. Я чекав нагоди - будь-якої нагоди.\n\nПотік куль без кінця вщухнув. Повернулися мої керівні розвідники, що повідомили: обидві сторони мосту з нашого боку чисті. Для почесного й гордовитого маршу був час, проте той для цього непідхожий. Я позвав побратимів, і вони, групами по троє, перебігали міст настільки швидко, що аж болото за вухами скакало. Коли всі, врешті, пересікли - я й мій заряджаючий глянули один на одного та й помчали. Ген-ген чув я літаки й кулі з обох боків, що шугали над головою, але ми неслися далі. Зрештою, наш напрям річки був вільним від противників, і нехай я мав наказ продовжувати рух, до того ж забезпечуючи безпеку бази передового розгортання - у той момент, єдиним моїм жалем було те, що я не мав змоги боротися за своїх братів, які загинули й проливали кров при переправі через цю незмірну ріку."
 UKR_u_ssr_cw.17.a: "Із особистих спогадів лейтенанта Георгія Семенова."

 UKR_u_ssr_cw.18.t: "Червона весна"
 UKR_u_ssr_cw.18.desc: "Після кількаденного пішого маршу, Ярема Добрович і його батальйон нарешті ввійшли до столиці України, її серця й душі - Києва; або, як його кликали нацисти, Кієва. Він дочувався про запеклий опір, що вчиняли лишки німецького гарнізону, та наразі здавалося, ніби всі їхні сили тікають з міста: гелікоптери, які постійно взлітали на околицях міста й ринули щодалі, на захід - були хорошою звісткою цього. Також дехто подейкував, що решта солдатів і осадчих ушивалися щодуху, чи здавалися перед нестримною хвилею вкраїнського гніву - намагаючись будь-якою ціною врятувати своє життя. "Саме те, на що заслуговують ті бісові йолопи, - думав Ярема, - бо на що вони сподівалися після того, як 30 років мордували цілий народ?"\n\nУтім, не це було важливим: авжеж, Яремі подобалося споглядати падіння німецького володарювання над Україною, але, як і всі, найбільше побивався за своїх співвітчизників, не за нацистських поневолювачів. І, дідько, як же вони ставилися до в минулому партизанів, як до героїв: квіти, похвали, обійми - усе, що завгодно! Люди перебували під утиском Райху десятиліттями, і вони нарешті визволилися. Ніяких більше страждань, ніякої зневаги, ніяких смертей--\n\nСмертей. Він миттю ж згадав свого батька. Той теж був партизаном, воював за більш праведне й безхмарне майбутнє для всіх. До пострілу вермахтівця прямо в нього, розуміється. Згадав про матір, яку покинув, аби відімстити за батька й поновити боротьбу. Журба швидко перемінилась на щастя - із звільненим Києвом, війна незабаром закінчиться. Знову він побачить її, і будуть вони радіти визволенню України. А поки що, розмірковував він, перепочити треба - і знічев'я побачив за рогом гурт солдатів, що виспівували пісень…"
 UKR_u_ssr_cw.18.a: "Він пішов туди, зовсім не вагаючись."

 # Повоєнні івенти
 UKR_u_ssr_postcw.1.t: "Перемога крізь крах, життя понад смерть"
 UKR_u_ssr_postcw.1.desc: "Як життя знову зацвітало в Києві, у офіцерській бальній залі вершилася вельми особлива подія. Недосвідчені декоратори взялися денацифіковувати будівлю, оновивши її більш доречними червоними стягами УСРР. Таким же гарним буде це місце, як і до того, коли його сплюгавили німці - ідеальним для першого засідання Політбюро. Багато вже років Шумський, Річицький, Роздольський, Голубничий і Зубатенко не могли зустрітися один із одним без побоювання того, що снайпер улучить кулею в їхні черепи. Кожен своєчасно прийшов до посхіхом обладнаного залу засідань. За стільки часу, вони вперше відчували з усіх почуттів лише чисту радість, коли обіймалися один із одним.\n\nУсілися за стіл переговорів, утираючи сльози з очей і прагнучи якнайшвидше покінчити з офіціяльними справами, аби нарешті почати надолужувати час, що проведений у розлуці. На порядку денному було тільки одне питання - розпуск Райхскомісаріяту Україна та відновлення Української Соціялістичної Радянської Республіки.\n\n "Усі, хто за - скажіть "так".\n\nГучне "так" пролунало від усіх присутніх.\n\n "Усі, хто проти-- йой, кого я обманюю? Василю, метнись кабанчиком по випивку!"\n\nПокінчивши зі справами, один із людей Шумського приніс упровадливий подарунок, на честь першого за ввесь час засідання Політбюро - ящик чудового віскі, викраденого з маєтку одного з чиновників. Напої роздали всім, оскільки міністри взяли одну ніч перепочинку для святкувань, як відшкодування за роки фашизму, що вони пережили - і як прославлення всього, чого досягла революція..."
 UKR_u_ssr_postcw.1.a: "...і для друзів, аби танцювати всю ніч."

 UKR_u_ssr_postcw.2.t: "Повернення додому"
 UKR_u_ssr_postcw.2.desc: "Ярослава Добрович знову поливала квіти в своєму саду. На одній половині, вона посадила хризантеми - після того, як її чоловік згинув від рук німців. А на іншій половині, вона посадила іриси - опісля приєднання її старшого сина Ярема до найбільшого повстання, яке коли-небудь виділа Україна. Нагадали вони їй про сина й чоловіка, про те, за що боролися її близькі багато років тому, і за що воює її син зараз. "Чи все в мого сина гаразд?", - раптово запиталася Ярослава. Останні два, чи навіть три місяці, вона геть не чула про нього. Через це на неї нагрянули неспокійні думки, та вона мимохіть їх відігнала.\n\n І тут їй чуються кроки позаду. "Петро, зажди, ​​дай мені полити ці квіти", - сказала вона, як завжди думаючи, що то поштар. Дивно, але відповіді від зазвичай балакучої людини не було. "Заради Бога, Петро, ​​хіба ти не чуєш--"\n\n"Здрастуй, матінко."\n\nПозаду неї стояв її син Ярема, із вусами та шрамом на обличчі, до того ж тримаючи в руках кошик із різними продуктами - помідорами, огірками, хлібом і ще багато чим. "Я, е-е, подумав, добре було б принести з собою трохи їжі", - сказав він спокійним, проте дещо недоладним тоном. І слова зронити не встиг, як до нього - із сльозами, що лилися від радості личеньком, підбігла Ярослава."
 UKR_u_ssr_postcw.2.a: "Ніколи й нікого вона так не обнімала, як обійняла його після цього."

 UKR_u_ssr_postcw.3.t: "Мисливці в пітьмі"
 UKR_u_ssr_postcw.3.desc: "Дмитро й Микола обходилися малим у цій праці, бо то було далеко поза славних днів звільнення України від німецьких паскуд. Справа їхня полягала в тому, аби зливатися з мороком, працюючи проти кревних українців - українців, у інший час які могли б воювати на вірному боці. Шкода, що запроданці з УПА вирішили триматися своєї реакційної справи до труни, а тому Дмитро та Микола готові їх провести до неї. "Я беру п'ятьох справа, а ти візьмеш п'ятьох зліва", - говорив тихо Микола з обережності того, що їх можуть почути. Вони сховалися за такою темною ніччю, що його міг побачити лише Дмитро. "Не мудруй, ми можемо пробратися до табору, аби прикінчити цих фашистських іуд." Зладивши свої гвинтівки, вони починають сьогоднішні лови.\n\nОдин, два - перші жертви впали ледве не одразу. Три, чотири, п'ять - змарнілі солдати зненацька дико стріляють, ніби загнана в кут здобич; кулі летять в нікуди. Шість, сім - жалюгідну душу, яка вдалася до втечі, поклав один із своїх. Дев'ять - український апостол утішається, знаючи, що скоро зустрінеться зі своїми звитяжцями на Небесах.\n\nІ наполовину - підстрелений бандерівець тікає, коли двоє мисливців вилазять з тіні задля гонитви. Доки дичину видавав кривавий слід, ноги його вже лізли до Бога й він гепнувся на землю, покіль наближалися ловці.\n\nМикола дозволив своєму товаришеві прикінчити його: він був би радий, що УПА невдовзі винищать, адже це звільнить його від цієї мерзенної справи. Юний бандерівець благав про милість Дмитра, що розмахував револьвером - дарма, що вона ніколи не настане. Він приткнув пістоль до черепа своєї жертви, відвівши курок і натиснувши на спусковий гачок, обронив два останніх слова, які хлопчина коли-небудь почує."
 UKR_u_ssr_postcw.3.a: ""Вибач, брате.""

 UKR_u_ssr_postcw.4.t: "Содом і Гоморра"
 UKR_u_ssr_postcw.4.desc: "Двадцять пляшок горілки, сім пакунків кокаїну, десятки пігулок "Первітину" - здавалося, що Микита без кінця вестиме інвентаризацію бандитського схрону. Німці, що гордилися своєю духовною праведністю в наведенні порядку, насправді звеличували розбійників і злодіїв, задовольняючись в платі данини за їх захист.\n\nІ ще раз Микита кинув оком на розчинені камери, набиті колись заполоханими й наляканими дівицями - тепер вони були оголеними, окрім обтяжувальних прим'ятин і плям від наруги. Намагаючись стримати свою розлюченість, він стиснув кулак. Співпрацював цей бандит із німецькою поганню, панував над слабкими завдяки своїм порокам і залюбки труїв Київ своїм беззаконням.\n\nЗгадав, як той намагався домовитися, аби уникнути правосуддя. "Прошу, пане, горілку полюбляєте? У мене її кури не клюють, чи, радше, не п'ють! Любите жінок? Дівчатка тут настільки під кайфом, що ви зможете з ними зробити все, що схочете."\n\nВідповіли йому хіба прикладом по макітрі - комісара не купити дешевою горілкою. Незабаром Микита зрозумів, після зустрічі з жінками: дати прикладом у пику - замале покарання для мерзотника, яких той тримав у неволі. Спустивши їх на того бандита, він здивувався тому, як його не розірвали одразу ж.\n\nПовернувся в теперішнє, аби закінчити інвентаризацію: горілку конфіскує держава, а решту спалять. Комуніст не мусить схилятися до настільки огидних вад. Майбутнє України було яскравим - опіати ці лишень годяться для втечі від безрадісного світу.\n\nМикита підвів очі на творіння від визволених жінок: безкровний труп, перевдягнений у гротескний канделябр, що також бовтався з мотузкою, обмотаною навколо зламаної шиї. Скоро правда оживе в усій Україні, а переступники невдовзі довідаються, що годі боротися з комунізмом…"
 UKR_u_ssr_postcw.4.a: "...так само, як і годі боротися з силою тяжіння."

 UKR_u_ssr_postcw.5.t: "Прапороносці"
 UKR_u_ssr_postcw.5.desc: "Ніколи б Микола не повірив, що найбільш гордий день в його житті буде маршем із нацистським прапором. Проте ось він тут, пліч-о-пліч із кожним своїм шанованим товаришем, які несли стяги фашистських окупантів.\n\nНизько розгойдувалися прапори, штандарти й знамена ненависного Райху, огортаючи землю разом із гусеницями захоплених німецьких танків, що розїжджали біля них - символи ненависті, що колись красували цих войовничих звірів, були знівечені червоним. Микола розмірковував про фашистських потвор, які марширували з цими знаменами. Він надіявся на те, аби всі з них до єдиного покоїлися під двома метрами землі.\n\nАж ось ненависть його уступила місце гонору. Від почуттів збурювалося Миколине серце, як він озирався в кожен бік: чоловіки, жінки й дітлахи, яких вони звільнили від німців, вишикувалися вулицями Києва - усі зібралися докупи, аби привітати їх цього знаменного дня. Угледів товариша Шумського та його відданих членів Політбюро, які зробили коротку перерву в своїй напруженій роботі, щоб проконтролювати цей важливий день, і тепер стежили за ним.\n\nНарешті, він жбурнув докупи очорнивші його націю ворожі відзнаки - як це зробив кожен вірний солдат УСРР, що їм надали можливість взяти участь в цій церемонії. Микола спостерігав, як ветеран 1923 року підносив смолоскип до пом'ятої купи, і як вона охоплювалася полум'ям.\n\nВін загасив вогонь, коли символи ненависті згоріли в очищувальному полумені - жодну невинну душу вони більше ніколи не жахатимуть. Площею налинула хвиля оплесків, і Микола втішився тим, знаючи, якщо бодай німці знову їх загарбають - прапори вони свої вже не повернуть."
 UKR_u_ssr_postcw.5.a: "Релікти митарства заслуговують на забуття."
 
 UKR_u_ssr_postcw.6.t: "Один мільйон - лише статистика"
 UKR_u_ssr_postcw.6.desc: "Попередні дані від найшвидшого звітування щодо районів перепису населення України передані Шумському, на його прохання. Неабияк була потрібна інформація, адже без розуміння справжнього стану країни, уряд практично діяв навпомацки. Настільки основоположні дані, як кількість населення в країні - вислизали від них, виходячи за рамки найскромніших оцінок.\n\nОднак поява відомостей щодо перепису аж ніяк не розрадила. Набагато гіршим від їхніх уявлень було становище. Голод, війна й недуги роздерло українське населення на частини. Рівень життя впав до царських часів. Занепали національний дохід і добробут. Шкоду майну нанесли значну: імовірно, знадобляться десятиліття для його повного відновлення.\n\nДеякі сільські місцини ледь не повернулися до доіндустріального життя, сільськогосподарського фонду майже не існувало, а виробнича база в містах у найближчому майбутньому, не збиралася заповнювати дефіцит. Це утворювало найбільшу проблему - Україна потребувала їжі, для власного населення й для експорту.\n\nШумський вирішив, що немає сенсу чекати решти даних, коли масштаби катастрофи підтвердилися. Уряд повинен діяти негайно - і діяти рішуче. Необхідно відправити юрми партробітників уздовж усієї країни, аби зберегти те, що є можливим, із точки зору сільськогосподарської техніки, добрив та іншого важливого приладдя.\n\nСлід вжити кардинальних заходів, щоби вберегти стражденну аграрну галузь України."
 UKR_u_ssr_postcw.6.a: "Ніхто не житиме без їжі."

 UKR_u_ssr_postcw.7.t: "Ультиматум"
 UKR_u_ssr_postcw.7.desc: "Якби Шумський і Політбюро могли зустрітися за зручніших обставин, то він був би щасливішим - проте справи національної цілісності були безмежно важливими. Кожен із присутніх обізнаний про трагедію 1921-го року, коли Польща викрала Галичину в їхньої нації, розлучивши українські сім'ї з їх батьківщиною.\n\nІ такі були, хто непокоївся через цю проблему: та не тому, що вважали, немовби Галичина належить Польщі, а через збіг обставин повернення Німеччини й власну втомленість від війни. Потайки дехто сподівався на союз, якого ніколи не відбудеться з реакційною Армією Крайовою на чолі.\n\nТак і продовжувалися ці мізерні протести, а поміж тим, найбільшою темою диспуту було те, що Україна просто не витримає ще однієї війни. Якби вони навіть і змогли побороти поляків, то два конфлікти в настільки швидкому виконанні могли б виснажити їхню розквітаючу націю до межі. Виступив врешті, Роман Роздольський, аби спинити голубину простоту, що панувала в Політбюро.\n\n"Я народився й виріс у Галичині, коли її вкрали обскуранти, я продовжив свою боротьбу з Комуністичною партією Західної України. Лиш Німеччина спинила до часу мої потуги зі звільнення воєводства. Якщо ми згаємо цей шанс повернути собі те, що належало нам, то ніколи не пробачу ні собі, ні присутнім у цій кімнаті. Я хочу покинути цей світ, знаючи, що справа наша була вірною."\n\nСлова ці змусили замовкнути всіх незгодних із цією думкою. Утім, щоб заспокоїти цих голубків, вирішили висунути Польщі ультиматум про здачу Галичини до того, як запанують воєнні дії в подальшому. Пропозицію прийняли одноголосно, і засідання оголошено закритим. Шумський поїхав із песимістичним відчуттям: поляки були занадто вперті, аби зрозуміти - щоб захистити Галичину, вони озброєні набагато краще. Йому доводилося тільки дочекатися й переконатися в цьому."
 UKR_u_ssr_postcw.7.a: "Чи визнає Польща злочини 1921-го?"

 UKR_u_ssr_postcw.8.t: "Україна вимагає повернення Галичини"
 UKR_u_ssr_postcw.8.desc: "усьобуде"
 UKR_u_ssr_postcw.8.a: "усьобуде"

 UKR_u_ssr_postcw.9.t: "Фінальна трагедія"
 UKR_u_ssr_postcw.9.desc: ""Підступному зрадникові Шумському,\n\nПольща зазнала століття підкорення. Німці та росіяни розійшлися нашими землями, намагаючись винищити наші країну й культуру. Завжди нас переважали чисельно. Та зрештою, нам завжди вдавалося здійнятися вгору. У 1920 році, ми відбили назад большевиків на Віслі. А нещодавно випроводили звідси нацистів.\n\nРаз ви бажаєте встромити нам ніж у спину, аби скористатися нашою слабкістю, доки ми зайняті Німеччиною, то неодмінно спробуйте. Ви розіб'єтеся об нашу крицю, як і багато хто перед вами.\n\nХай живе Польща!"\n\nШумський відклав листа й втупився в стелю. Незважаючи на те, що пропонувалося в записці, він дійсно не хотів воювати з поляками. Для них обох, більшою загрозою була Німеччина. Та Галичина - українська територія, усього лиш. Її належало звільнити. Після хвилини мовчазних роздумів, він покликав вартового.\n\n"Виклич сюди Зубатенка, і скажи йому, щоб попередив генералів - переговори стосовно Галичини провалилися. Потребуються військові заходи."\n\nКоли охоронець виринув за дверима, Шумський із журбою розмірковував, скількох смертей можна було б уникнути, якби поляки були трохи менш безкомпромісними."
 UKR_u_ssr_postcw.9.a: "Зкривавлені землі кровоточать знову."

 UKR_u_ssr_postcw.10.t: "Тріумф"
 UKR_u_ssr_postcw.10.desc: ""Хлопці з відділу пропаганди добре попрацювали", - подумав Шумський, опрацьовуючи проєкт плакату. Стрій наступаючих українських солдатів-робітничих, що тримали групу карикатурно змальованих поляків, на кінчиках своїх багнетів. Позаду них гордо розвивався над Львовом прапор УСРР. Сонце, що здіймалося на сході - тепле золотаве проміння сповняло сцену. Принаймні так.\n\nГаличина була їхньою: хоча, безумовно не в найкращому стані. Десятиліття занехаяності й регулярних расових конфліктів спустошили цей регіон - навіть в порівнянні з рештою поля бою, яким був схід Європи. Усій території не завадили б репопуляція й відбудова - на щастя, нестачі переселенців немає в Україні.\n\nШумський поклав плакат назад. Криваву справу виконано. Поляки не повернуться в найближчий час. Усупереч усій важкій роботі попереду, святкувати є що - чи не вперше з часів Русі, уся Галичина контролювалася Україною.\n\nТепер доцільно втримати її."
 UKR_u_ssr_postcw.10.a: "Століття підкорення повалено."

 UKR_u_ssr_postcw.11.t: "Червона зірка догоряє"
 UKR_u_ssr_postcw.11.desc: "Шумський та його міністри знову й знову перечитували звіти з радіо та розвідки, що горами вкривали стіл Політбюро - та їхній вміст не змінювався.\n\nПоверталися німці.\n\nЖодних відомостей, які б суперечили цьому елементарному факту, не було. Поки вони продовжували перемову, до кордону з Польщею щохвилини під'їжджав черговий німецький танк, знову готовий пронестися сходом Європи. Завершувалася боротьба за владу в Німеччині, і вже пристосувансько налаштовані генерали вишукували собі місце під сонцем, відбиваючи назад схід.\n\nІншу частину зустрічі присвятили обговоренню того, що доцільно було б удіяти. Пропонувалися ініціятиви партизанських мереж, тактик ведення бою й воєнного комунізму, але швидко стало зрозуміло, що ніхто не може обговорювати такі питання після останнього викриття з Райху. Покинули кімнату всі, окрім Шумського, аби зібратися пізніше - сподіваючись передусім провести час із родиною, яку їм доведеться полишити першочергово.\n\nВін поглянув через вікно на Київ, залитий жовтогарячею сонячною загравою. Зруйноване місто тільки почало відбудовуватися. Роки минуть, перш ніж повернеться воно до колишньої величі, а його з дня на день можуть стерти з лиця землі. Душа його непокоїлася від страхіть, які спіткають український народ. Гадав, що може бути гіршим за те, що вони вже пережили. Він доторкнувся до скла, побачивши дітей серед руїн - вони гралися на уламках. У інший час, вони могли б рости разом із своїми батьками, піти до школи, закохатися, створити щасливе сімейство й потім померти в затишній постелі. Шумський дослухався до їхнього сміху, але міг повернутися лише до знайомого почуття…"
 UKR_u_ssr_postcw.11.a: "...страху. Страху за те, що настане."
 UKR_u_ssr_postcw.11.a_tt: "§SВітер сьогодня віє легкістю від втіхи та перемоги. Завтра він буде тяжким від диму й крові.§!\n§YТи зробив усе, що міг.§!"

 # ЖІНКА Events
 UKR_u_ssr_pavlichenko.1.t: "Герой Союзу"
 UKR_u_ssr_pavlichenko.1.desc: "Першим відчуттям Людмили Павличенко було не біль, а холодне оніміння, що почалося в передпліччі й просочилося через зап'ястя до вказівного пальця. Здалося їй, що хтось приставив їй осу до шкіри, ніби - стук за стуком серця - хтось закачував отруту прямо в її вени. Вона дозволила собі на мить поглянути з прицілу снайперської гвинтівки на свою руку, лише аби побачити—\n\n "Ох." Вона вимовила це з цілковитою вільністю. У її руці була діра. І крізь розірвану плоть та розтрощену кістку, вона могла побачити блакитне небо незрівнянного ранку. Здивувалася його дивовижності, перш ніж кинутися зі своєї снайперської засідки.\n\nДекілька разів пролунав в повітрі великий тріск, як вона впала крізь гілки дерев і чагарники. Перекидаючись, вона усвідомлювала: що оточення світлішає, що її товариші кричать від страху й несподіванки, що гітлерівці просуваються через ліс. Плани штурму звелися нанівець, однієї миті замінившись похмурим усвідомленням - хтось проговорився. Німці випередили несподівану атаку її загону своєю.\n\nПролунав гучний, неприродний хрускіт, коли вона гепнулась на землю. Не маючи часу на роздуми й змусивши себе встати на ноги, притулившись до дерева, вона спробувала вихопити малий пістолет із кобури збоку. Вона спостерігала, як м'язи її руки судомили й скорочувалися, але рука безпорадно висіла осторонь. Одним її відчуттям було холодне, постійне оніміння.\n\n"Трясця…", - прошепотіла вона. Потягнулася через усе тіло й таки намацала пістоля. "Тиць, моя радосте… Діждалася сраної немочі…"\n\nЛюдмила Павличенко, вбивця нацистів, герой давно мертвого Радянського Союзу, опинилася в стані втечі через ліс, ніби поранений звір. Із єдиного в неї на думці був лише чоловік і обіцянка боротися з гітлерівцями до останнього подиху."
 UKR_u_ssr_pavlichenko.1.a: "Болісні спогади."

 UKR_u_ssr_pavlichenko.2.t: "Герой Союзу. Жінка у втечі"
 UKR_u_ssr_pavlichenko.2.desc: "Людмила Павличенко, найтитулованіший снайпер колишнього Радянського Союзу - не знала, як довго бігла після перестрілки. У її пам'яті було лише мелькання гілок і власне уривчасте дихання, спотикання через безлюдні міста й села з безпорадною рукою, яка бовталася біля неї. Вона була впевнена, що гітлерівці скоро її наздоженуть. Лиш тоді, коли вона прибула до Донецька й змогла потрапити до лікаря (патріота, та занадто молодого, аби мати якісь справжні повноваження), вона знову змогла чітко розуміти. А здатність розуміти - жахлива річ.\n\n"Я не знаю, що тепер робити", - сказала вона. Вона йшла вздовж міської набережної, тримаючи перед собою під пальто перев'язану гноєм руку, загорнуту в петлю. "Відчуваю себе непотрібною."\n\nЇї друг, лікар, здивовано подивився на неї. "О? Що ж, я сподіваюся, що ви не замишляєте зробити нічого такого, що могло б змарнувати всі ліки, які я використав для вашого лікування." Настала павза. Вона втупилася в море. "Вибачте, то був невдалий жарт."\n\n"Коли мій чоловік Кіценко помер, я пообіцяла собі, що буду знищувати гітлерівців до останнього подиху. Так довго я виконувала цю обіцянку. Сала снайпером, у мене це добре виходило. Відчувала, що роблю щось для майбутнього, а тепер…" Вона спробувала стиснути забинтовану руку. Не відчула жодного поруху. "Що мені робити? Повернутися на кухню? Бути доброю господинею, доки нацисти не вб'ють нас усіх?"\n\nЛікар довго нічого не відповідав. Вона гадала, чи зрілий він достатньо, аби пам'ятати щось про Союз, або ж він думає про нього, ніби про королівство з казочок - давня мрія, що вже минула.\n\n"Людмило, не обіцятиму, що ти коли-небудь станеш таким же хорошим снайпером, як і була, але я не думаю, що ти коли-небудь припиниш воювати. Навіть, якщо це здається неможливим - ти занадто вперта, щоб здатися." Вона повернулася, щоб побачити його слабку посмішку. "Роби все, що в твоїх силах. Завжди варто боротися за тих, хто успадкує землю задовго після того, як нас не стане.""
 UKR_u_ssr_pavlichenko.2.a: "Вони залишилися на деякий час. Донецьк не був красивим містом, але цього було достатньо."

 UKR_u_ssr_pavlichenko.3.t: "Герой Союзу. Жінка з книги"
 UKR_u_ssr_pavlichenko.3.desc: "Людмила Павличенко, колись найкращий снайпер колишнього Радянського Союзу, дивилася на чисту сторінку, потім на тьмяне сіре небо надворі, яке було видно крізь вікно її напівзруйнованої донецької квартири, потім знову на сторінку. Від її щік йшло тепло. Незважаючи на те, що колись вона навчалася в Київському університеті, мріяла стати вчителькою, істориком - повернення до журналістики здавалося їй кроком назад.\n\nВона злізла зі стільця й закружляла, як лисиця, що вистежує пастки.\n\nНавіщо вона це зробила? Тому що її друг-лікар сказав їй, що письмо може принести їй полегшення? Що викладення своїх думок на папері може відволікти її від гітлерівців, які зруйнували її батьківщину? Бо це допоможе їй відчути себе менш непотрібною, коли біль пронизує її скалічену руку, нагадуючи про порушену обіцянку й розбиті амбіції? Що за жалюгідний вчинок! Із таким же успіхом вона могла б вишивати хрестиком, як якась жалюгідна міщанка з сумними очима, що чекає на чоловіка з війни.\n\nВона міцно вчепилася в стілець єдиною працюючою рукою. Вдихнула, а потім видихнула, рахуючи кожен видих - як колись робила це заради безпеки її "воронячого гнізда". Вона послабила хватку.\n\nЗвісно, були люди, які записували свої думки й учинки. Ґрамші писав навіть тоді, коли гнив у в'язниці. Лєнін теж, коли тіло підвело його. Незліченна кількість радянських генералів ділилися своїми історіями після тієї війни. Чи була вона настільки зарозумілою, що вважала себе вищою за них усіх? Чому вона відригувала старі, гнітючі міфи про те, що було й не було "жіночим?"\n\nВона змусила себе сісти назад і взяти ручку. Бодай коли розум її кричав про те, якою недолугою була проза й якими поверхневими були її думки, вона змусила себе продовжувати писати."
 UKR_u_ssr_pavlichenko.3.a: ""Ким би вони не були: росіянами, українцями, татарами чи євреями - усі люди матимуть місце в звільненій Радянським Союзом України. Вітаємо всіх.""

 UKR_u_ssr_pavlichenko.4.t: "Герой Союзу. Жінка в пориві"
 UKR_u_ssr_pavlichenko.4.desc: "Для Людмили Павличенко було дивно опинитися в своєму найкращому одязі, на темному складі околиць Донецька. Зі своєю тендітною рукою, яка ледве могла згинатися, вона відчувала себе порцеляновою лялькою, яку збираються упакувати в коробку й відправити. Проте, вона стояла непорушно і уважно в темній кімнаті, поки чоловік у щурячій формі сидів перед нею, курячи цигарки.\n\n"Людмила Павличенко", - сказав він. Це ім'я повисло в повітрі, як заклинання. "Ви вже давно не воювали, чи не так?"\n\n"Мене тоді поранили, товаришу генерал." Вона обережно поворушила рукою, усе ще побоюючись, що вона зламається від надмірних рухів. "Мене вилікували. Я дочекалася, коли гітлерівці загублять мій слід. Я почала писати й робити все, що могла, аби об'єднати партію в Харкові."\n\nВона говорила це серйозно - так, ніби цей останній обов'язок не залежив від неї. Після того, як вона почала писати свій щоденник - те, що вона насмішкувато називала "покаянням", - її друг-лікар наполягав на тому, щоб вона публікувала свої думки в підпільних газетах. Хай її слова не були досконалими, він шепотів своїм високим, хлоп'ячим голосом: "Яий є кращий спосіб надихнути людей, ніж дати їм засвідчитися, що Леді Смерть все ще жива? Що вона не лише продовжує боротися, але й залишається вірною Радянському Союзу? Це справді допоможе оживити опір", - наполягав він.\n\n"Я прочитав одну з ваших статей. Вона не була жахливою." Генерал кинув недопалок у забиту попільничку, потім глянув на неї. "Керівництво пропонує тобі підвищення. Воно не пов'язане з зарплатнею чи модною уніформою, але поставить тебе в центр опору..." Він випустив дим крізь ніздрі. "І серед небезпеки."\n\nЛюдмила зберігала байдуже обличчя. "Я прийму будь-яку повинність, аби посприяти всякому обов'язкові перед Батьківщиною, товаришу генерал.""
 UKR_u_ssr_pavlichenko.4.a: "Чоловік криво посміхнувся. "Ласкаво просимо, товаришко-генерал Павличенко.""

 UKR_u_ssr_pavlichenko.5.t: "Герой Союзу. Чоловіки на тренуванні"
 UKR_u_ssr_pavlichenko.5.desc: "Навіщо її зробили генералом? Майже певно, пропагандистське значення", - із гіркотою думала Людмила Павличенко. Її товаришам-революціонерам потрібен був маяк - талісман, що підтримував би бойовий дух. Їм необхідний був хтось більш надихаючий, аніж невиразні бюрократи й занепалі партизани, які ледве рухаються.\n\nХоча вона зарекомендувала себе ефективним вбивцею - можливо, найефективнішим різником нацистів із тих пір, як Сталін чи Бухарін ходили по землі. Вона не претендувала на якесь вроджене лідерство.\n\nТому вона змушувала себе старатися більше, ніж будь-хто з її товаришів.\n\n"Рухайтесь!", - кричала вона, як майбутні солдати продиралися крізь дерева й листя в українській пустці. Чи мав генерал таким чином контролювати навчання? Вона цього не знала, та не збиралася виявити для себе пізніше, що не виконала свого обов'язку. Із труднощами вказала пораненою рукою на ряд дощок, обмальованих хрестами. "Вогонь!"\n\nПролунала серія ударних вибухів, дошки розлетілися на друзки, а повітря наповнилося димом. Хоча вона нікому не зізнавалася в цьому, вигляд її новобранців, які так добре справлялися з завданням, сповнював її почуттям гордості. Вони дали їй надію, що вона все ще може щось запропонувати світові, що вона може бути чимось більшим, ніж просто снайпером. Навіть якщо їй бракує підготовки, привілеїв та повноважень, як іншим, можливо, вона зможе довести, що може бути лідером. Можливо, за межами цих щоденних боїв на неї чекає інше життя.\n\nАле поки що, вона виштовхнула ці думки з голови. Попереду було чимало роботи. Вона забезпечить, аби вони увійшли в історію біля Золотих воріт."
 UKR_u_ssr_pavlichenko.5.a: "Із кожним днем ​​усе сильніше."

 UKR_u_ssr_pavlichenko.6.t: "Герой Союзу. Голос народу"
 UKR_u_ssr_pavlichenko.6.desc: ""Мені справді треба повертатися на поле битви", - сказала генерал Людмила Павличенко, навіть коли вмостилась в кріслі перед радіомікрофоном і готувалась до виступу. Коротка репетиція показала, що не бракує заїжджених штампів і жалісливих вигуків.\n\n"Звичайно, звичайно", - відповів чоловік у зношеному парадному мундирі. "І ми хочемо, щоб ви робили те, що вмієте найкраще—"\n\n"Саме тому, Червона Армія все ще змушує мене читати—"\n\n"Ніхто ні до чого вас не змушує. Ніхто й не подумав би. Заради Бога, Людмило, вас сюди привезли задля поваги. Ви були найкращим захисником Союзу двадцять років тому. Бухарін не дарма відправив вас у турне Сполученими Штатами й Канадою, аби—"\n\nВін дико, по-дитячому жестикулював руками, ніби передаючи характер її колишнього турне: зустрічі з Елеонорою Рузвельт, відмова від президента Дьюї та його зарозумілого контролера Роберта Тафта, виступи в битком набитих концертних залах. Яку користь багато років тому принесла ця поїздка, коли вона підігравала іншим і дозволяла їм диктувати її репліки? Чого вона досягла, коли дозволила американській пресі з жадібними очима розпитувати її про те, як вона чепуриться на фронті? Її обличчя запалилося.\n\n"Я не дитина. Я ветеран Великої Вітчизняної війни. Генерал Червоної Армії. Знищила 849 фашистських загарбників", - випалила Людмила. "Коли ви хочете почути мій голос, за ним мусять бути мої власні слова. Тільки тоді, я зможу достукатися до потрібних людей."\n\nПромайнула павза. Чоловік роздратовано зітхнув, вийшов із кімнати, потім повернувся з ручкою. Із задоволеною посмішкою, Людмила розім'яла затерплу руку й почала переписувати свою промову."
 UKR_u_ssr_pavlichenko.6.a: ""Робітники світу, мене звуть генерал Людмила Павличенко. Я приходжу до вас, коли ми наближаємося до години нашого звільнення...""

 UKR_u_ssr_pavlichenko.7.t: "Герой Союзу. Буря наближається"
 UKR_u_ssr_pavlichenko.7.desc: "У таборі панувала тиша - тиша, що передує бурі. Солдати мовчки їли свої пайки. Патрулі тихенько просувалися крізь лісові хащі. Людмила Павличенко чистила свою гвинтівку, дбайливо знімаючи й шліфуючи кожну деталь, а потім знову збирала її на місце.\n\n"Не набагато довше", - подумала вона.\n\nПоглянула на свою руку. Там, де куля ввійшла в неї, була глибока виїмка, і з неї стирчав клубок тканини, схожий на павутиння. Коли вона розігнула м'язи, болю більше не було, лише примарні відчуття.\n\nВона продовжувала з допитливістю гледіти на свою руку й дивуватися, скільки ж вона була такою. Згадувала це, ніби воно було вчора - як гітлерівці скалічили їй руку й зробили її непотрібною. Вона пам'ятала, як тікала через ліс до Донецька, охоплена болем і страхом. Пам'ятала болісні процедури, смердючі та заплямовані бинти. Тепер вона не відчувала нічого з цього. Спробувала поворушити пальцями, - вони відгукнулися. Стиснула руку в кулак.\n\nСтраху більше не було. Не було й болю. Вона не відчувала тривоги. Перед нею лишень стояло завдання. Вона та її товариші звільнятимуть міста України. Промарширують від Ростова до Львова, вигуюблюючи фашистських загарбників, де б вони не були. Рвучи й ріжучи чужинців із цього світу. Витравлюватимуть стерв'ятників. І тоді, нарешті, здобудуть справжню - сущу свободу.\n\nЗвідкись вдалині, позаду неї зворушилися солдати, виходячи зі стану дрімоти. Настав час рухатися вперед. Буря насувалася на них."
 UKR_u_ssr_pavlichenko.7.a: "Грім чобіт випереджає блискавку битви"
 UKR_u_ssr_pavlichenko.7.tt: "Павличенко допоможе очолити визволення України й усіх українців. Або вона побачить своїх людей на волі - або помре, намагаючись."

 UKR_u_ssr_pavlichenko.8.t: "Герой Союзу. Звільнення Харкова"
 UKR_u_ssr_pavlichenko.8.desc: "Це було після того, як впала остання бомба, коли нарешті стихли гармати. Харків'яни вийшли зі своїх домівок до незакінченої колонії. Вони стояли серед руїн величних фашистських споруд і розбитих пам'ятників. Вуличні торговці розклали свої товари зрешетованими вулицями, що все ще іменувалися в честь мертвих і безславних завойовників. Діти грали неподалік похиленої й обезголовленої статуї Адольфа Гітлера в центрі міста. Сім'ї прочісували руїни в пошуках померлих.\n\nЛюдмила Павличенко проходила крізь ці сцени, відчуваючи дивне відчуття умиротворення. Звісно, чимало хто загинув у бою. Так, звичайно, були жахливі втрати - театр зрівняли з землею, вулиці все ще завалені руїнами. Але все таки була тут надія. Із балкона, що осідався, високо над нею долунали голоси: "Хай живе Союз! Хай живе вільний народ України!"\n\nРозкидані вздовж усього звільненого міста, інші голоси лунали з подібними привітаннями. Ба навіть серед руїн наявні звуки міста, яке прокидалося після довгої хвороби - після страшної травми.\n\nЛюдмила на мить дослухалася до цих голосів. Перекинула гвинтівку через плече й усміхнулася. Ще багато було роботи попереду, та кожен пережитий день - вже успіх."
 UKR_u_ssr_pavlichenko.8.a: "Вільна Україна повертає свою силу"

 UKR_u_ssr_pavlichenko.9.t: "Герой Союзу. Звільнення Дніпропетровська"
 UKR_u_ssr_pavlichenko.9.desc: "Дніпропетровськ: колись Катєрінина велич тепер мало нагадувала зразкове місто, яким воно колись було. Багато кварталів у центрі міста посічені дірками від куль. Міст через Дніпро зруйновано в спробі сповільнити просування армій Союзу. Поля на околицях міста заболочені - очевидно, унаслідок пошкодження гідроелектростанції за кілька кілометрів звідси.\n\nАтмосфера в Дніпропетровську, усе ж, була сповнена тріумфу. Після років життя в тіні й спостерігання того, як фашистські загарбники крадуть їхні домівки й землі - український народ, радіючи, знову вийшов на вулиці.\n\n"Дай Боже вам здоров'я!", - привіталась низенька бабуся, притиснувшись до тіла Людмили Павличенко. "Слава Україні!"\n\n"Слава Радянському Союзу", - ніжно відповіла Людмила, вивільняючись з обіймів літньої жінки. "Скоро весь народ буде вільним від гітлерівців—"\n\n"Слава Україні!" - пролунало від групи чоловіків, що нерозбірливо говорили й були явно напідпитку. "Слава! Слава! Слава!"\n\n"Будь ласка!", - Людмила намагалася докричатися до них, крізь наростаючий гамір. То було незвичним, що вона, як нікого інший, вражена такою реакцією. "Ми тут, аби боротися за справу Комуністичної партії й визволення трудящих від—"\n\nПроте це було марно. Навколо неї зібрався радісний натовп. Після кількох марних спроб підбурити їх до підтримки Союзу, вона, похитавши головою, забралась геть звідси."
 UKR_u_ssr_pavlichenko.9.a: "Загарбники завдали справі великої шкоди, однак народ пам'ятатиме своїх визволителів."

 UKR_u_ssr_pavlichenko.10.t: "Герой Союзу. Звільнення Києва"
 UKR_u_ssr_pavlichenko.10.desc: "Розрада. Саме це почуття відчувала Людмила Павличенко, коли спускалася Хрещатиком у серце визволеного Києва. І справа була не лише в тому, що тут знаходився її дім, або ж прогулянка розбитими вулицями, яка повертала її до щасливих і сяючих спогадів дитинства.\n\nНі, проте в тому, що вона була там під час першого вторгнення нацистів в Україну, багато років тому, коли вони перервали її навчання в університеті. Це безперервні крики агонії, що долунали від утікаючих гітлерівських загарбників. Це відчуття пістолета в її руці, коли вона стріляла в спину відступаючим фашистам і дивилася, як вони падають в місиво зі снігу й бруду. Вона була зверху над тими бевзями. Пам'ятала, як тримала на руках свого вмираючого чоловіка. Вона бачила, як з чоловіка, що лежав перед нею, стікала кров. А тоді—\n\nПротяжний і звитяжний струс вивів її з заціпеніння. Попри те, що вулиця завалена тілами, а останні гітлерівці щезали вдалині, здобуток очевидний - вони перемогли. УСРР виборола перемогу. Людмила відчула великий приплив гордості, коли двоє солдатів зняли бридкий прапор зі свастикою й дали йому впасти посеред вулиці. На його місці вивісили червоно-синьо-жовтий прапор революції."
 UKR_u_ssr_pavlichenko.10.a: "Живи, Україно, радянська державо, возз'єднаний краю на віки-віків!"

 UKR_u_ssr_pavlichenko.11.t: "Герой Союзу. На самоті"
 UKR_u_ssr_pavlichenko.11.desc: "Услід Битви за Київ сталося багато подій. Співали пісень. Фотографувалися. Як останні гітлерівці втекли назад через український кордон, багато гулянь й святкувань минуло. Усе це Людмила Павличенко намагалася ввібрати в себе до того, як повернулася в реальність.\n\nУсією Україною присутні міста, що потребували відбудови. Були розбомблені дороги й зруйновані споруди. Лікарні, багато з яких все ще мали ім'я фашистів, забиті хворими й пораненими. Із свого тісного офісу на головній площі, хоч і через кілька тижнів - вона все ще знаходила залишки нацистської адміністрації. Добре виділа всю роботу, яку доводилося виконати.\n\nЛюдмила розім'яла м'язи на руці й обернулася від столу до вікна. Серед площі, внизу, стояв порожній постамент, на якому колись перебував Гітлер на коні. Вона посміхнулася, знаючи те, що незважаючи на всю ту працю, яку потребувало здійснити - Київ нарешті став вільним.\n\nУкраїна та її народ більше не жили перед острахом систематичного винищення. Вони більше не дрижали під неволею. Уся країна дихала вільно, уперше за безліч десятиліть. У її серці врешті запанувало відчуття спокою - відчуття того, що вона нарешті виконала обіцянку, яку дала коханому багатьма роками раніше.\n\nЛюдмила продовжувала оглядати площу. Вона не помітила добірного хижого птаха, який усівся на будівлю навпроти, із червоною плоттю якогось звіра в дзьобі. Здоровенний птах, здавалося, декілька секунд витріщався на Людмилу в її крихітній кімнаті, насупившись. Потім він розгорнув свої страшенні чорні крила й злетів на захід - подалі від України, у далекі простори.\n\nТам, далеко поза поглядом Людмили, усе вже ворушилося."
 UKR_u_ssr_pavlichenko.11.a: "Світло посеред темряви. Човен перед штормом."


