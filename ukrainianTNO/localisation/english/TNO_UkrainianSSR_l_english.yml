 ### Assorted Laws
 UKS_get_law_tooltip: "[GetAssortedLawsDescUKS]"

 UKS_peace_and_bread_law: "§g§kМир§! і §jХліб§!"
 UKS_peace_and_bread_law_desc: "Мир, земля й хліб - це бойовий клич Жовтневої революції, аби кожен робітник і селянин мав: мир для своєї країни, землю для проживання - і хліб для споживання. Проваджуючи ці положення, Радянська революція здійнялася в живодайному ґрунті, здобувши серця й розуми людей. Дані постанови постануть складовими нашої нової комуністичної держави, оскільки нашою спільною метою є добробут для всіх українців. Добробут, що можливий лише через соціялізм, авжеж."

 UKS_monopoly_on_violence_law: "§g§YМонополія§! §Rнасильства§!§!"
 UKS_monopoly_on_violence_law_desc: "Згідно з Максом Вебером, держава - це та, яка претендує на монополію законного застосування фізичної сили на певній території. Для Української Соціялістичної Радянської Республіки, її монополія насильства повідомляє про себе завдяки кампаніям, спрямованим на очищення України від контрреволюційних елементів і бандитизму.\n\nСолдати встановлюють своє панування, прочісуючи кожне селище та місто в пошуках осередків УНРА чи УПА, які продовжують випробовувати вплив держави. Право цієї землі запроваджуватиметься все ширше й ширше з кожним днем, якщо черговий бандит виявлятиметься повішеним на дереві.\n\nРизики для Комуністичної партії України незабаром минуть, і на зміну їм прийде непорушний революційний авангард, що твердо стоїть на чолі нації, вільної від регресу."

 UKS_national_ukrainization_0_law: "§gНаціональна §MУкраїн§Yізація§!§!"
 UKS_national_ukrainization_0_law_desc: "Наша національна боротьба невід'ємна від визволення пролетаріяту, тому відродження самобутності нашого народу через національну українізацію - наш пріоритет. Вигнання нідерландських і німецьких колоністів із нашої землі, її примусове відчуження, а також усунення російської, німецької та нідерландської мов із вивісок і назв необхідні для досягнення цієї цілі. Лише нідердандські поселенці, яких можна буде використовувати як переговірників, зможуть залишитися. Наші російські товариші мусять затямити, що український народ зараз - авангард соціялістичної революції. Україна переможе, хай і деякі росіяни можуть образитися на нас через це."

 UKS_national_ukrainization_1_law: "§gНаціональна §MУкраїні§!§Yзація§!,\n §WРос§!§Dійс§!§Sька§! - мова меншини§!"
 UKS_national_ukrainization_1_law_desc: "Наша національна боротьба невід'ємна від визволення пролетаріяту, тому відродження самобутності нашого народу через національну українізацію - наш пріоритет. Вигнання нідерландських і німецьких колоністів із нашої землі, її примусове відчуження, а також усунення німецької та нідерландської мови із вивісок і назв необхідні для досягнення цієї цілі. Лише нідердандські поселенці, яких можна буде використовувати як переговірників, зможуть залишитися. Однак ця справа не суперечитиме нашій солідарності з нашими російськими братами, оскільки російська буде другою мовою. Ця пропозиція суперечлива всередині партії, позаяк деякі патріотично налаштовані українські товариші можуть образитися на це, але росіяни почуватимуться залученими до цього." 
