# Leaders
POLITICS_FIDEL_CASTRO_DESC: "Фідель Алехандро Кастро Руз народився 13 серпня 1926 року в заможній родині - позашлюбний син коханки свого батька. Незважаючи на консервативну єзуїтську освіту, Кастро став відданим антифашистом. Його політичне життя розпочалося в Університеті Гавани, де він залишив юридичні студії, щоб приєднатися до популістської партії «Ортодоксо» та їх закликів до революції через вибори.\n\nУ 1952 році переворот генерала Батісти зламав крихку демократію Куби. Кастро вдався до збройної боротьби, очоливши відчайдушну, але приречену атаку на казарми Монкада 26 липня наступного року. Випущений з в'язниці, він втік до Мексики, щоб створити Рух 26 липня, або М-26-7. Попри катастрофічну висадку на Кубі, Кастро та його повстанці втекли в гірські джунглі й вели там партизанську війну шість років.\n\nХоча міська ланка М-26-7 була ключовою для перемоги, саме Кастро та його яскраві, бородаті повстанці стали зірками на світових заголовках. Саме їхні військові перемоги зробили М-26-7 авангардом антибатістської опозиції на Кубі. Після блискавичної наступальної операції тріумфальний Кастро та його повстанська армія звільнили Гавану в перший день 1959 року.\n\nЯк тимчасовий президент, Кастро править як яскравий популіст в латиноамериканській традиції. З моменту його приходу до влади революційні реформи охопили Кубу і здобули міжнародне визнання, а уряд Кастро залишається в добрих стосунках з ОВН завдяки їхній гордості за антифашистську позицію.\n\nУникаючи справжньої ідеології, Кастро має марксистські погляди і підтримує гайтаністський популізм, але править досить автократично. Невідомо, чи буде він чемпіоном демократії чи ще одним каудільйо, але кожен кубинець знає, що самопроголошений спадкоємець Хосе Марті назавжди вплине на історію."
POLITICS_FIDEL_CASTRO_DICTATOR_DESC: "Фідель Алехандро Кастро Руз народився 13 серпня 1926 року в заможній родині - позашлюбний син коханки свого батька. Незважаючи на консервативну єзуїтську освіту, Кастро став відданим антифашистом. Його політичне життя розпочалося в Університеті Гавани, де він залишив юридичні студії, щоб приєднатися до популістської партії «Ортодоксо» та їх закликів до революції через вибори.\n\nУ 1952 році переворот генерала Батісти зламав крихку демократію Куби. Кастро вдався до збройної боротьби, очоливши відчайдушну, але приречену атаку на казарми Монкада 26 липня наступного року. Випущений з в'язниці, він втік до Мексики, щоб створити Рух 26 липня, або М-26-7. Попри катастрофічну висадку на Кубі, Кастро та його повстанці втекли в гірські джунглі й вели там партизанську війну шість років.\n\nХоча міська ланка М-26-7 була ключовою для перемоги, саме Кастро та його яскраві, бородаті повстанці стали зірками на світових заголовках. Саме їхні військові перемоги зробили М-26-7 авангардом антибатістської опозиції на Кубі. Хід подій змінився на користь Батісти, і в перший день 1959 року тріумфальний Фідель увійшов до Гавани зі своєю повстанською армією.\n\nБагато хто сподівався, що він буде виключенням, але Фідель пішов шляхом Робесп'єра та править як каудільйо. Прийнявши свою автократичну сторону, він тепер сприймає гоббсівський погляд, що зміни та порядок можуть бути принесені лише залізною рукою.\n\nЩодо ідеології, він відмовився від демократії Гайтана на користь ідеальної диктатури ІРП, хоча він все ще відданий соціалізму та антифашизму. Можливо, це не те, що бачив у своїх мріях Хосе Марті, але для Фіделя сильна рука — єдиний шлях для реалізації мрії його героя."
POLITICS_JOSE_ANTONIO_ECHEVERRIA_DESC: "Серед безлічі лідерів та героїв Кубинської революції є лише один чоловік, який може змагатися з Фіделем Кастро, якщо порівнювати за кількістю прихильників. Це Хосе Антоніо Ечеверрія - пройшлотрохи більше трьох десятків років від дня його народження 16 липня 1932 року, аж тут він вступає в президентський палац у Гавані як його господар.\n\nНа вулицях Куби його називають Мансанітою, «маленьким яблуком» – але для студентів університетів та з недавніх пір, для Католицької Церкви на Кубі, він відомий як їхній герой. І це справедливо: він, зрештою, був людиною, яка стояла за Католицьким студентським Революційним студентським директоратом (DRE). Заснувавши DRE зі своїми однодумцями, Ечеверрія проводив студентські протести та міську партизанську війну проти режиму Батісти, швидко об'єднавшись з Фіделем Кастро. Найбільший з його подвигів перед тим, як стати президентом, була невдала, але відважна атака на президентський палац 13 березня 1957 року, з якої агенти ФБР та мексиканського ФУБ допомогли йому врятуватися живим.\n\nЦе невдача виявилася тимчасовою – хоча йому довелося зібрати сили в Сьєрра-Маестрі та вести міську боротьбу проти Батісти, тиранія зрештою була зламана. Тепер, будучи при владі, Ечеверрія прагне відродити радикальну демократію, яку мріяв реалізувати Хосе Марті, зміцнити антифашистську солідарність серед студентів Латинської Америки і, найголовніше, перетворити Церкву на революційну силу.\n\nЧи буде це успішним на Кубі, країні, де релігія ніколи не була справді популярною? Це вирішуватимуть люди."
POLITICS_CARLOS_PRIO_SOCARRAS_DESC: "Підйом Карлоса Пріо Сокарраса до такої честі, як бути президентом Куби, не є його першим входом у цю арену. Насправді, чоловік, який вступає в президентський палац на сьомому десятку свого життя, є останнім легально обраним президентом Куби до революції та другим таким президентом після неї.\n\nЛюди називають Пріо Сокарраса «Ель Президенте Кордіаль», Кордіальним Президентом; його спадщина є спадщиною суму. Чи було це його провиною, ще активно обговорюється, але його перспективне правління було занурене в корупцію та політичне насильство, що призвело до найбільш кровопролитних виборів в історії Куби. Однак зрозуміло, що до кінця його терміну його сприймали як слабкого та неефективного.\n\nАле зрештою прийшла інша можливість. Чоловік, який скинув Пріо Сокарраса і змусив його піти в еміграцію, був тираном, і Революція нагадала старому президенту боротьбу з Мачадо. Він кинувся в бій, координуючи фінансування для М-26-7, навіть мобілізуючи молодих автентиків, щоб боротися; все, щоб звільнити свою націю. Коли це було зроблено, Пріо був зустрінутий вдома в 1959 році, оточений молодими повстанцями, які були готові віддати йому шану.\n\nТепер новий президент має другий шанс. Ідеали 1933 року явно не втратили своєї привабливості; автентики ще мають деяку силу та надію. Карлос Пріо Сокаррас вирішив не втратити цю цінну можливість, адже він знає, що чекає його, якщо він не подолає це випробування: розбитість і втрачена можливість того, чого могло б бути."

