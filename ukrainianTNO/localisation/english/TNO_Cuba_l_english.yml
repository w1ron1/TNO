# Ideas
CUB_idea_cuban_revolution: "Кубинська революція"
CUB_idea_cuban_revolution_desc: "Для багатьох 1 січня 1959 року стало кінцем Кубинської революції. Батіста був вигнаний, його режим скинуто, а уряд розсіяно вітром. Для нас же це 1 січня стало не кінцем, а початком.\n\nЗ того дня Куба перебуває в стані постійних змін, постійної революції, в якій мікроскопічні традиції, що стримували її розвиток, усуваються в ім’я національного прогресу. Політично, соціально, економічно нічого не залишилося непорушним, і, тим не менш, поки революція триває, народ радіє. Революція користується великою популярністю вдома та навіть привертає увагу діячів за кордоном. Наш народ пишається революцією і підтримує кожну її тезу."
CUB_idea_reform_frenzy: "Реформістський запал"
CUB_idea_reform_frenzy_desc: "З початку революції Куба перебуває у стані постійних змін. Кожного місяця оголошуються нові масштабні зміни. Будь то земельна реформа, охорона здоров'я, соціальна допомога чи освіта - Куба десятирічної давнини майже невпізнавана порівняно з Кубою сьогодення.\n\nДля багатьох ці зміни є на краще; багато з негайних потреб Куби після революції було задоволено, і життя середнього кубинця сьогодні значно краще, ніж ті ж самі десять років тому. Однак деякі побоюються, що ці зміни надто великі й надто швидкі, і бояться, що, поки стара Куба руйнується, вона може наблизитися до непоправного падіння."
CUB_idea_uncertain_direction: "Невизначений напрямок"
CUB_idea_uncertain_direction_desc: "У дні після революції безліч фракцій, які об'єдналися, щоб повалити режим Батісти, продовжили своє колишнє союзництво. Створивши Інтегровану революційну організацію, або ІРО, ці різні фракції мають мало спільного, окрім бажання змінити Кубу, і більшість хоче бачити Команданте на її чолі.\n\nЦе призвело до надзвичайно дезорганізованої політичної ситуації, і оскільки різні фракції, що входять до складу ІРО, тягнуть організацію в різні напрямки, майбутнє Куби стає дедалі менш певним. Кастро все більше виявляється єдиним чоловіком на Кубі, який може керувати ІРО, і йому слід обрати напрямок скоро, до того, як його велику мрію зруйнують внутрішні чвари."
CUB_idea_question_democracy: "Питання демократії"
CUB_idea_question_democracy_desc: "Попри надзвичайну популярність Кастро, багато в ІРО почали говорити тихими голосами про його більш авторитарні схильності. Вони говорять про те, як він звик до своєї влади, і ставлять питання, чи коли-небудь він відмовиться від неї.\n\nЗ часом ідея кінця правління Кастро стає все реальнішою. Коли дисиденти відкрито закликають до виборів на вулицях, а заяви Кастро на цю тему залишаються нечіткими, старе питання демократії, мрії Хосе Марті, починає набирати популярності в керівництві ІРО. Це питання потрібно вирішити, і найближчим часом."

