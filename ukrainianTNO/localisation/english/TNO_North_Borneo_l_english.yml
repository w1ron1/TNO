 ### Ideas ##
 NRB_The_37th_Army: "Осередок 37-ї армії"
 NRB_The_37th_Army_desc: "Знаменитий, а можливо, сумнозвісний Баба Масао командує 37-ю армією, якій доручено утримувати свій гарнізон у Північному Борнео. Номінально забезпечуючи захист інтересів Шонану та Індонезії, насправді єдина мета 37-ї армії — гарантувати, що стратегічний порт Кучин не потрапить до рук дисидентів і повстанців, які переховуються в борнейських джунглях.\n\nСкладаючись із 56-ї змішаної піхотної бригади та 71-ї змішаної піхотної бригади, вона є досить слабкою силою порівняно з іншими силами по всій Сфері спільного процвітання, але її безцінний бойовий досвід забезпечує компенсацію нестачі особового складу майстерністю. Не треба й казати, що без 37-ї армії не буде Північного Борнео, інакше Японія втратить свою єдину безпосередньо контрольовану опору на Островах прянощів."

 NRB_Extremely_Underfunded: "Вкрай недофінансовано"
 NRB_Extremely_Underfunded_desc: "Для Баби це незаперечно: адміністрація, якою він керує, працює від бюджету до бюджету. Зарплати його людей, обслуговування важкого озброєння, інфраструктурні проєкти — усе це залежить від примх Токіо та політиків-клептократів, які встромляють ножі в спину.\n\nОднак як почесний генерал Баба залишається настільки винахідливим, наскільки це можливо в його ситуації, і просто щоквартально подає до Імперського генерального штабу запит на лобіювання збільшення бюджету. Попри це, потрібно більше єн, якщо адміністрація має функціонувати на найвищому рівні, а не на найскромнішому..."

 NRB_Sarawak_Independence_Movement: "Рух за незалежність Сараваку"
 NRB_Sarawak_Independence_Movement_desc: "До адміністрації Північного Борнео існував Раджа Сараваку, а на північному сході — британське Північне Борнео. У той час як британське Північне Борнео, або, можливо, правильніше, Сабах, легше підкорилося іноземному контролю через відсутність місцевих правителів протягом певного часу, Саравак зберігав власного Раджу та уряд.\n\nДесь у передмістях Канберри останній Раджа, Вайнер із Дому Бруків, продовжує підтримувати контакти з прихильниками незалежности в Північному Борнео, а також із лідерами ОВН, сподіваючись повернутися на рідну землю. Оскільки цей компетентний уряд у вигнанні становить загрозу японським інтересам на Борнео, буде досить важко повністю закріпити наш контроль над територією Кучина та його околицями, поки ця загроза залишається..."
