 ## Leader Descs ##
 POLITICS_BABA_MASAO_DESC: "Британські володіння на Борнео завжди посідали особливе місце в японських планах панування в Азії. Певний час нафтові ресурси острова були об'єктом спокуси для економічних гігантів Імперії, а його стратегічне положення серед морських шляхів між Східною Азією та Австралією виявилося безцінним для посилення японських підрозділів на полях битв Азії. Після короткої та тріумфальної кампанії японських сил на Борнео колишні британські території були реорганізовані як військовий домен, який мав утримувати рішучий і вольовий командир. Цим чоловіком був Баба Масао, генерал 37-ї армії, яку свого часу планували назвати Армією оборони Борнео.\n\nСпадковий армійський офіцер і прихильник прусської дисципліни, Баба пережив кар'єрний злет під час японської війни в Індонезії, прокладаючи собі шлях через перемоги над американцями. Згодом він став командиром гарнізону на Борнео та його військовим губернатором — посаду він і досі обіймає завдяки своїй колишній славі, залишаючись непохитним перед своїми суперниками та заздрісниками. Відповідно до японського військового правителя, Баба правив залізною рукою, не цураючись жодних жорстоких методів для придушення будь-яких спроб опору та нав'язування своєї волі. Вірячи в японську зверхність понад усе, він просував японську політику асиміляції в регіоні та перетворив його на майданчик для японських монополій, кожна з яких прагнула отримати свою частку багатств острова.\n\nУ міру того як Північне Борнео перетворювалося на сильно мілітаризовану та укріплену зону після війни та її наслідків, колишній британський протекторат став опорним пунктом Армії в морській Південно-Східній Азії. Підтримуючи сильну присутність на кордоні з Індонезією, 37-ма армія під командуванням Баби слугує підкріпленням японського контролю над Великими Зондськими островами та «додатковою» силою для колабораціоністських урядів, якщо вони не зможуть самостійно стримати повстання проти Сфери."

