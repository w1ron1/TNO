MCW_The_Marshals_Fiefdom:0 "Феод маршала"
MCW_The_Marshals_Fiefdom_desc:0 "Фельдмаршал Фердінанд Шьорнер та його кліка радикальних мілітаристів захопили владу в Московієні, встановивши жорстоку військову диктатуру. Хоча він заявляє, що рятує завоювання Райху від повстання нелюдських рабів, насправді Шьорнер перетворив засніжену територію на свій особистий феод."
MCW_Brutal_Repression:0 "Жорстокі репресії"
MCW_Brutal_Repression_desc:0 "Окрім знищення повстання рабів у Московієні, Маршал також пообіцяв жорстко придушувати будь-яких дисидентів, які насміляться протистояти його режиму. Бунтівні політики, офіцери Вермахту, німецькі переселенці та російські місцеві — усі масово страчуються його вірними мілітаристами. Ніхто не знає, чи вщухнуть ці жорстокі репресії, чи це лише початок."
MCW_Schorners_Ambition:0 "Амбіції Шьорнера"
MCW_Schorners_Ambition_desc:0 "Правління як Маршала Московієну — лише перший крок на кривавому шляху до повного домінування у Великоґерманському Райху. Шьорнер спрямовує погляд на захід, сподіваючись, що хаос повстання рабів створить ідеальні умови для тріумфального маршу на Ґерманію та падіння Альберта Шпеєра."
MCW_Schorners_Ambition_tooltip:0 "§RЯкщо Шьорнера не зупинити вчасно, він може реалізувати свої амбіції та перейти Дніпро...§!"
MCW_Russia_in_ruins:0 "Росія в руїнах"
MCW_Russia_in_ruins_desc:0 "Повстання рабів виявилося катастрофічним для Московієну, посиливши і без того тяжкий стан території. Через жорстокі репресії Шьорнера проти протестувальників і мирних жителів, а також запеклі бої під час операції «Отто», ця неспокійна територія стоїть на межі вибуху. Статус-кво окупації Райхом здається дедалі менш можливим."
MCW_Pakt_Commission:0 "Вищий комітет Айнхайтспакту для Росії"
MCW_Pakt_Commission_desc:0 "У відповідь на ситуацію в Московієні після повстання рабів і як жест солідарності, Московієн офіційно був переданий під спільну окупацію Айнхайтспакту. Проте, незважаючи на цей жест, окупаційна політика все ще визначається Великоґерманським Райхом, і саме уряд у Ґерманії вирішуватиме долю Московієну."

