POLITICS_FERDINAND_SCHORNER_MOSKOWIEN_DESC:0 "Фердінанд Шьорнер — це людина, яка не терпить образ. Після свого заслання до Московієну під хибним приводом, фельдмаршал із гіркотою виконував свій обов'язок, керуючи військами залізною рукою та нещадно розправляючись із партизанськими силами. Увесь цей час він та його мілітаристська кліка скреготали зубами, пильно вдивляючись у бік Ґерманії, чекаючи ідеального моменту, щоб помститися.\n\nЩо б він не очікував, Шьорнер ніяк не міг передбачити повстання рабів. Завдяки хаосу, викликаному російськими рабами, які піднялися проти своїх господарів по всьому Мілітарбезірку Руслянд, Шьорнер жорстоко захопив владу та встановив новий військовий уряд. Чутки про його жорстокість у ставленні до повстань розійшлися далеко, а його зрадницькі погрози рушити на Ґерманію, щоб знищити повстання, не залишилися непоміченими.\n\nХоча легітимність його погроз викликає дискусії, тільки дурень повірить, що амбіції Фердінанда Шьорнера закінчуються його автократією над Росією."