 ## Leader Descs ##
 POLITICS_MOSHOESHOE_II_DESC: "Король Королівства Лесото, Мошоешо II народився під ім'ям Костянтин Беренґ Сеїсо й був нащадком Мошоешо I, великого засновника нації. Навчаючись у коледжі Рома в Лесото, він з юного віку тісно співпрацював із урядом Південної Африки, так само як і його мачуха, яка виконувала обов'язки регентки після смерті його батька. Отримавши повну незалежність після сходження на престол у 1960 році, він досі компетентно керував Лесото у співпраці з конституційним урядом."

 ### Ideas ###
 LTH_south_african_kingdom: "Південноафриканське королівство"
 LTH_south_african_kingdom_desc: "За останні кілька років Лесото пережило бурхливу історію. Спочатку Королівство було чим завгодно, але не незалежним, маючи лише номінальну незалежність під владою Південної Африки, а з приходом Африканерського Фолькстату перетворилося на ще одну експлуатовану провінцію. Однак після краху Фолькстату Лесото знову утвердило себе як повноцінна нація й сподівається побудувати справжню державу з трупа Південної Африки."

 LTH_strong_anc_influence: "Сильний вплив АНК"
 LTH_strong_anc_influence_desc: "Після Південноафриканської війни АНК було знищено та розколото на фракції. Багато найвпливовіших і найрадикальніших членів утекли до Лесото, де Мошоешо II надав їм притулок. Хоча вони можуть бути вдячні королю за його захист під час правління Фолькстату, тепер радикали стали для короля кісткою в горлі."
 