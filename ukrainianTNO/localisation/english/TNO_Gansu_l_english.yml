#Leaders
POLITICS_MASANOBU_TSUJI_DESC:0 "Якщо комусь варто було б запитати про Цуджі Масанобу старшокласника в Каназаві, або в Наґано, або ж у Осаці - результатом був би блискучий відгук. Для японців із Камікави - до Кітакюшю й ще далі, Генерал Цуджі є героєм війни, величним боронителем паназійської мрії, що звільнив Малайю від британських імперіалістичних виродків завдяки вродженому генію й хитромудрому плануванню.\n\nСправжній Цуджі, відомий підкореним від Давао до Ланьчжоу, є значно відмінним від цього. Він безжалісний, грубий багатократний вбивця, м'ясник за покликанням що фанатично служить новому імперіалізму. Справді, він генерал, що спланував вторгнення в Малайю й виконав його до кінця за місяць. Але це було вчинено в оргії жорстокості й брутальності, що заливала вулиці від Алор-Сетару до Кота-Тінґі кров'ю знову й знову.\n\nІ це ще не було закінченням, оскільки витискати кров із Малайї до блідого, для Цуджі було недостатньо. Відтоді він доклався до безлічі різанин і спрямованих геноцидів, не в останню чергу серед них і жорстоке 'Сок-чінґ' - усунення крізь очищення - малайських китайців і китайців у Сінґапурі, а також Марш смерті Баатану, у якому в'язні мерли й іх вбивали, як мух.\n\nТепер старий звір, після деякого часу проведеного в Японії, знову виходить з вол'єру щоб шматувати людей іще раз. Генштаб Імперської Японської армії відправив його й армію Північнозахідного регіону для умиротворення непокірного північного заходу Китаю. Він зробить це з захопленям, нетерпляче доєднається до чергового свята крові й душогубства. Потрібне хиже, із залізною волею, нещадне, бездумне чудовисько, аби побороти останні осередки китайського супротиву, і ніхто не запитає про його краще втілення, ніж Цуджі Масанобу." 

#POLITICS_MASANOBU_TSUJI_DESC_OLD:0 "Минуле Цуджі окутане легендою, що була створена терором, супроводжуючим цю людину. У залежності від того, кого ви запитаєте, він був або вбивцею сотень тисяч, або ж генералом що виграв війну нетрадиційними способами.\n\nДля селянина, він - людина що ігнорувала належний підхід, і страчувала всіх кого підозрювала в супротиві. Для військовика в запасі, він - божевільний генерал, що посилав людей на смерть проти непохитної армії. Для сьогоднішнього військового - немає нікого іншого, під ким вони б служили, із урахуванням його безмежної великодушності й своєрідності.\n\nНаявні чутки кажуть, що він дійсно вагомим чином доклався до деяких військових операцій, і після цього служив у деяких визначених установах у японській адміністрації. Психолог сказав би, що в Цуджі присутнє прагнення до влади, і йому конче потрібно було здертися на посаду депутата в Імперській раді. Лояліст повідає, що в Цуджі були великі плани на Японію, і саме ці китайські колаборанти й комуністи завадили йому, зірвавши його обрання. Традиціоналіст може стверджувати, що імператор особисто прогнав Цуджі за чутки, що розпустили по всій імперії. Паназієць заявив би, що він чув як Цуджі мандрував крізь Маньчжоу-Ґо й Менцзян, не кваплячись споглядаючи велич цієї імперії на шляху до його нового місця призначення.\n\nМагометяни скажуть, що він прийшов на захід, аби катувати послідовників Пророка й спалити заживо Ма Буфана. Цуджі скаже, що він усього лишень виконував свій обов'язок. Західний спостерігач подивиться на це все й прийде до висновку, що конфлікт на північному заході мусить невдовзі прийти до свого завершення - доки місцевий казатиме, що залізної волі муки тії ніколи не минуть. Та всі, щоправда, погодяться на одному: безумний генерал готується до війни." 

