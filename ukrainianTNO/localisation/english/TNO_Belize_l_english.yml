  POLITICS_GEORGE_CADLE_PRICE: "Одна голова падає - на її місце приходять дві. Цей урок болісно врізається у голу шкіру країни Джорджа Кедла Прайса. Багато хто в Белізі сподівався, що падіння Британської імперії під незламним залізним штормом гітлерівського бліцкріґу стане кінцем для пут імперіалізму, що сковували населення — ця ілюзія закінчилася тваринним ривком гниючого трупа. Канада, що значно потовстішала від біженців, які втекли від хаосу Європи, вирішила нав'язати себе Белізу, стверджуючи, що вона здійснює управління від імені Королеви.\n\nМабуть, найбільша образа — це їхня сувора прихильність до Бога: вони стверджують, що їхній монарх божественно призначений, на відміну від неправдивих пророків у богохульних судах. Вони вимагають, щоб Беліз подивився їм в очі і присягнувся, що ці сторічні тортури є святими й лишаться недоторканими. Вони поневолюють Беліз і вважають це виправданим. Вони вірять, що Белізу краще залишатися в ланцюгах. Чи дозволив би Він Рамсесу знищити євреїв, якщо це було б «краще»?\n\nНі. Беліз має, може і повинен самотужки визначати свою долю, не обтяжуючись минулим, а сповнюючись надії на майбутнє. Під проводом Прайса незалежність не буде легкою, приємною чи мирною. Але вона буде чесною. Для народу, якому брехали все його життя, хіба є щось дорожче за правду?"
  POLITICS_PHILIP_GOLDSON: "Народ Белізу починає бачити світло незалежності в кінці темного тунелю британсько-канадського підкорення та гватемальського залякування, і народ Белізу обрав Філіпа Ґолдсона, щоб він повів їх до цього світла, тримаючи в руках факел лібералізму, обережно ведучи їх, щоб не витратити єдиний шанс на втечу.\n\nНароджений у Беліз-сіті в 1923 році, Ґолдсон усе своє життя виступав за незалежність та благополуччя оточуючих, працюючи редактором для націоналістичних газет, таких як «Belize Billboard», та як національний організатор для Загальної робітничої спілки. Те, що відрізняє його і його Партію національної незалежності від попередників, - це бачення міжнародного, незалежного Белізу - того, який працює з іншими вільними демократіями світу пліч-о-пліч у боротьбі проти тиранії та агресивної Гватемали на заході, яка загрожує знищити вогонь свободи на світанку."


  BLZ_A_Capital_Devastated: "Зруйнована столиця"
  BLZ_A_Capital_Devastated_desc: "Жителі Беліз-Сіті пам'ятають ураган Гетті. Були дощі та вітер, що свистів крізь темні вулиці. Потім вода почала підніматися. Вона піднялася, поки кожна вулиця не стала чорною рікою. Приплив прийшов і змив тисячі домівок за ніч.\n\nСьогодні Беліз-Сіті - це зруйнована місцина. Хоча лише кілька сотень людей загинули, понад сімдесят відсотків усіх будівель у столиці було пошкоджено або зруйновано, що паралізувало Беліз та його економіку. Хоча деякі відновлюють місто, багато хто обговорює, чи варто заснувати нове місто вглиб країни, яке буде захищене від сил природи."
  BLZ_A_New_Home: "Нове житло"
  BLZ_A_New_Home_desc: "Після урагану Гетті народ Белізу був змушений просити допомоги у своїх партнерів в ОВН. Зіткнувшись із величезним стражданням людей, уряд Канади погодився надати Белізу фінансування для вирішення найгірших наслідків катастрофи. Також було погоджено підтримку будівництва нової столиці — Бельмопану.\n\nТепер, за багато миль від руїн Беліз-Сіті, розпочато будівництво. Уряд країни рішуче налаштований на новий старт для себе і своїх громадян."
  BLZ_A_City_Upon_A_Hill: "Місто на пагорбі"
  BLZ_A_City_Upon_A_Hill_desc: "Після років роботи та мільйонів доларів інвестицій місто Бельмопан було завершено. Хоча місто має певні дизайнерські особливості — центральне кільцеве шосе, багато парків та архітектура, натхнена майянськими храмами — справжня сила цього міста полягає в його розташуванні.\n\nСтоячи на 75 метрів вище рівня води та захищене пагорбами та лісами, Бельмопан захищене від сил матері-природи. Хоча час покаже, як Беліз буде розвиватися, нове місто є свідченням сили та стійкості народу Белізу."
  BLZ_Radical_Independence_Movement: "Радикальний рух за незалежність"
  BLZ_Radical_Independence_Movement_desc: "Юніон-джек горить.\n\nПо всьому Белізу проходять демонстрації незадоволення старим порядком. Чорні націоналісти виступають проти залишків британського правління. Чоловіки, як Джордж Кедл Прайс та Філіп Ґолдсон, виступають проти гниючої системи навколо них. Уся країна єдиним голосом висловлюється проти свого колоніального статусу. Єдині питання, які залишаються: наскільки далеко «Британський Гондурас» піде, щоб позбутися цього імені, який процес це принесе і чи відбудеться це мирно чи насильницьким шляхом."
  BLZ_A_Nation_Under_Siege: "Країна в облозі"
  BLZ_A_Nation_Under_Siege_desc: "Можливо, є одна річ, що нависає так само сильно, як і британська корона для Белізу: постійна і величезна загроза з боку Гватемали. Вважаючи Британський Гондурас провінцією, відділеною від батьківщини тепер уже переможеною європейською державою, багато гватемальських політиків закликали своїх лідерів вторгнутися в Беліз та відновити кордони їхньої нації. Оскільки у Белізу немає власної армії, тільки завдяки гарантіям безпеки з боку ОВН країна може зберігати свою крихку незалежність."
  BLZ_A_Colonial_Vacuum: "Колоніальний вакуум"
  BLZ_A_Colonial_Vacuum_desc: "Коли Британські острови впали під крилами нацистського орла, їхня колоніальна імперія впала в безлад. Беліз був одним із таких місць, і тепер він опинився в пастці примітивних домовленостей, які були укладені майже два десятиліття тому.\n\nХоча він присягає на вірність Її Величності, королеві Єлизаветі II, і занепалій практично до стану трупа королівській родині, на практиці уряд Белізу безпосередньо підпорядковується уряду Канади. Цей невдалий компроміс залишає обидві сторони неспокійними і спраглими до втечі з-під таких угод."
  
