 BLZ_forpol.12.t: "Гра в ультиматум"
 BLZ_forpol.12.desc: "Настало нове десятиліття, але Патріку Ньюхарту здавалося, що змінилося лише те, що він постарів. Британський Гондурас залишався постійним головним болем у його дипломатичній кар'єрі. Так було відтоді, як він вступив на дипломатичну службу, і хоча він піднімався службовими сходами, справа Британського Гондурасу залишалася з ним, мов постійна кульгавість на тлі в іншому перспективної кар'єри.\n\n"Пане Ньюхарт", — пролунало сухе привітання Томаса Адамса, чиї мутні червоні очі свідчили про те, що він або погано спав, або страждав від похмілля. "Добрий ранок". Коли він був у гарному настрої, Патрік називав Томаса Томмі, але сьогодні перед ним був сам Томас. "Схоже, ми тут, щоб обговорити останню канадську пропозицію щодо деколонізації Гондурасу?"\n\nТомас говорив про це так, ніби це було лише побіжним питанням. Канада хотіла покінчити з колонією, але не могла просто зібрати речі й піти. Це було значною перешкодою для встановлення зв'язків із будь-ким у Латинській Америці, але активи Канади вабили будь-якого місцевого лідера, який міг би їх привласнити та націоналізувати, щоб роздати своїм наближеним. Якби це сталося, гарантовано було б введено ембарго, що створило б ще більший дипломатичний кошмар.\n\n"Саме так. Ми хочемо, щоб Державний департамент очолив зусилля з почесної деколонізації території. Ми хочемо, щоб Гондурас став незалежною державою, дружньою до нашого уряду, без посягання на наші активи та з можливістю зберегти економічну присутність. Нам потрібно переконатися, що ми не залишимо белізців гватемальцям, які палко бажатимуть вторгнутися. Вони майже прямо про це заявили".\n\n"Хм". Томмі зробив ще один великий ковток кави. "Державний департамент погоджується, але нам потрібна свобода дій, щоб укладати будь-які домовленості, які ми вважатимемо необхідними. Подивимося, що можна зробити. Але Канада поступається своїм місцем у цьому питанні; у секретаря та президента не може бути зв'язаних рук"."
 BLZ_forpol.12.a: ""Просто пам'ятайте: ви самі попросили нас про допомогу, тож не скаржтеся, коли ми її надамо". — пробурмотів Томас, прибираючи папери Ньюхарта до теки."

 BLZ_forpol.13.t: "Це не віщує нічого доброго"
 BLZ_forpol.13.desc: "Сонце яскраво світило у вікна американського посольства в Гватемалі, але настрій посла США в Гватемалі був далеко не сонячним. Йому та американському консулу в Белізі доручили вислухати плани Карлоса Арани Осоріо щодо об'єднання з Гватемалою її східного сусіда, і звучали вони не надто багатообіцяюче.\n\n"Ми не можемо очікувати, що надамо Белізу широку автономію", — зауважив Осоріо. "У найближчому майбутньому його інтереси мають бути підпорядковані гватемальській більшості. До того ж комуністична проблема на сході ще не вирішена. Наші військові мають впоратися з нею так само, як у Гватемалі".\n\nПосмішка Осоріо стала ширшою, коли він продовжив розповідати про те, як планує придушити будь-який потенційний лівий опір своєму правлінню; консул у Белізі почав мовчки соватися на своєму місці, явно стривожений усім цим.\n\nПосол помітив занепокоєння свого колеги. "Пане Осоріо, хоча я... визнаю ваші можливості, я не зовсім упевнений щодо цієї пропозиції. Єдині політичні угруповання в Белізі, які взагалі підтримують об'єднання з Гватемалою, є лівими. Антикомуністичні репресії були б контрпродуктивними для будь-яких таких перспектив".\n\n"Нісенітниця!" — відповів Осоріо. "Народ Белізу швидко побачить переваги об'єднання, незалежно від його політичних поглядів. Нам не потрібно хвилюватися через якихось комуністів... якщо вони справді підтримують об'єднання, то швидко відмовляться від усієї цієї дурості".\n\n"Вибачте, але я мушу заперечити проти такого формулювання", — відповів консул, не відводячи погляду від Осоріо.\n\nПоки двоє почали сперечатися щодо пропозиції хунти про об'єднання, посол трохи осів у своєму кріслі, поклавши руку під підборіддя.\n\n"Це об'єднання не спрацює", — подумав він."
 BLZ_forpol.13.a: "Вашингтону краще запропонувати якийсь компроміс."

 BLZ_forpol.14.t: "Ми можемо змусити це працювати"
 BLZ_forpol.14.desc: "Посол США в Гватемалі сидів у своєму кабінеті в американському посольстві в місті Гватемала та їв салат. Навпроти нього сидів американський консул у Белізі, який прагнув обговорити перспективи переговорів між Гватемалою та Белізом.\n\n"Це чудова можливість", — наполягав консул. "Якщо ми зможемо покращити відносини між ними, це може мати значні позитивні наслідки для всього регіону та серйозно покращити наші відносини з гватемальцями".\n\n"З ПАР важко працювати", — відповів посол, ковтаючи шматок салату й запиваючи його водою перед тим, як продовжити. "Вони майже не відмовилися від усієї цієї янкі, забирайтеся додому, антиімперіалістичної маячні".\n\n"Я теж не особливо їм довіряю, пане после, але якщо ми виступимо конструктивним посередником, їхні негативні упередження зникнуть. ПАР не настільки нерозумна, щоб відкидати позитивні втручання беззастережно".\n\nПосол усміхнувся. "Гадаю, ви маєте рацію. Підтримка об'єднання між ними та белізцями може якраз схилити ПАР на наш бік. Спробуймо організувати зустріч між міністрами закордонних справ, щоб зрушити це питання з мертвої точки".\n\nКонсул засяяв."
 BLZ_forpol.14.a: ""Чудово. Я почну готувати необхідне листування.""

 BLZ_forpol.15.t: "Меморандум про гватемальсько-белізькі переговори"
 BLZ_forpol.15.desc: "СЕКРЕТНО/[GetDateText]\n\nВІД ДОНАВАНА СЕЙДЛА\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: МАЙБУТНІ ГВАТЕМАЛЬСЬКО-БЕЛІЗЬКІ ПЕРЕГОВОРИ\n\n1. Філіп Ґолдсон і Демократична партія Гондурасу загалом сповнені сильних антигватемальських настроїв. Поділяючи позицію значної частини населення Белізу, вони вже заявили, що не приймуть жодного об'єднання з гватемальцями та боротимуться на кожному кроці, щоб йому запобігти.\n\n2. Джордж Прайс і Народна об'єднана партія, з іншого боку, значно прихильніше ставляться до ідеї можливого об'єднання з Гватемалою. Перші переговори з Джорджем Прайсом та рештою партії виявилися плідними. Єдина проблема, яка може виникнути, полягає в тому, що ліве крило Народної об'єднаної партії буде відсторонене від угоди про об'єднання, що стає дедалі ймовірнішим, якщо Гватемала рухатиметься праворуч.\n\n3. У нас достатньо важелів і впливу, щоб просунути деякі альтернативні компроміси — зокрема варіанти, які краще задовольнять більшість белізців, зберігаючи їхній суверенітет. Однак гватемальці, зробивши об'єднання своєю головною метою, рішуче виступатимуть проти будь-якого компромісу замість повного об'єднання з Белізом і можуть вдатися до радикальніших дій, якщо переговори проваляться."
 BLZ_forpol.15.a: "Викликайте консулів, треба зрушити це об'єднання з місця."
 BLZ_forpol.15.b: "Гватемальці змиряться, розгляньте альтернативи."
 
