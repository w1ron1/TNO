 #Leader Bios
 POLITICS_BLZ_HERBERT_FULLER_DESC: "Коли Британський Гондурас у 1950-х роках занурився в хаос, а побоювання щодо підтримуваного Гватемалою повстання посилювалися через дедалі більшу зневагу до спроб Канади відтворити давно мертвий британський порядок, Герберт Фуллер став одним із небагатьох діячів, яким канадський уряд міг довіряти. Приведений до влади на тлі надзвичайного стану, на початку його правління перо тримала рука в рукавичці, гарантуючи інавгурацію правлячої англофільської партії.\n\nЙого початкова більшість була здобута лише завдяки сфальсифікованим виборам, а режим Фуллера відтоді позначений зростаючим невдоволенням. Коли безпосередня криза 1951 року завершилася, Фуллер зберіг диктаторські повноваження, але навіть влада посади, яка дозволяла йому заборонити НОП і придушити ДПГ, лише ледь забезпечила йому більшість у владі. Будь-які надії на змістовне управління були ще більше підірвані черговою прикордонною війною між Канадою та підтримуваними Гватемалою партизанами, лояльними до НОП, і його влада знову похитнулася.\n\nЙого режим існує вже понад десятиліття, і корона залишила на його голові шрами своїми гострими краями. Протягом усього його правління зріло невдоволення, але руйнування Беліз-сіті ураганом і подальша прикордонна війна лише повернули його на поверхню. Гнів через чутки про корупцію, кумівство та рабську відданість Канаді став звичною темою розмов серед белізців, а їхні слова сповнилися кригою. Схоже, час Фуллера як головного колоніального колабораціоніста стрімко наближається до кінця."
 POLITICS_BLZ_GEORGE_CADLE_PRICE_DESC: "Що відбувається, коли опонент підіймається на посаду, яку він так завзято критикував? Вихований на єзуїтських ученнях і соціальних доктринах, Джордж Кедл Прайс завжди був затятим противником правлячої еліти Британського Гондурасу та її англомовного шовінізму. Увійшовши в політику через міську раду Беліз-сіті та прийшовши до влади на тлі розпаду Британської імперії, Прайс спробував скористатися своїм шансом, заснувавши НОП.\n\nЦей перший крок приніс лише невдачі. Коли Канада знайшла в собі волю зберегти жарини Британської імперії, НОП зазнала значних репресій, а сам Прайс утік до Мексики, підтримуючи зв'язок із союзниками, які готували осередки для боротьби як партизанські загони за підтримки Гватемали. Поки колоніальний режим повільно наближався до загибелі, Прайс опинився в колах Ґайтана, Арбенса та Карденаса — соціальних реформаторів з усієї Латинської Америки, які справили новий вплив на його погляди.\n\nПрайс тепер при владі, але гордість часто передує падінню. Хоча його прагнення забезпечити незалежність Белізу очевидне, він має небагато справжніх союзників. Канадський уряд і далі вважає його хаотичним, руйнівним агентом Гватемали, а країна просто розглядає його як перешкоду на шляху до інтеграції Белізу. Він може бути при владі, але для досягнення свого бачення Прайсу доведеться покладатися не лише на інерцію."
 POLITICS_BLZ_PHILIP_GOLDSON_DESC: "Народжений у скромній родині, Ґолдсон уперше став відомим у Британському Гондурасі під час Другої світової війни як державний службовець і полум'яний журналіст, який рішуче підтримував белізький націоналізм. Радикалізувавшись у профспілковому русі, він став організатором, зблизився з іншими націоналістами та працював над створенням НОП у 1951 році разом із Джорджем Прайсом і Лі Річардсоном. Однак будь-які надії на швидку перемогу були зруйновані, коли криза 1951 року загострилася, а Канада запровадила воєнний стан.\n\nКоли його колишні союзники були змушені піти в гори внутрішнього Белізу або до Мексики, Ґолдсон заплатив за це арештом. Дедалі більше відчужений закликами до інтеграції з Гватемалою та дедалі сильніше перебуваючи під впливом карибських і кріольських активістів, після звільнення він вирішив створити нову, поміркованішу альтернативу — Демократичну партію Гондурасу. Коли режим Фуллера навколо нього розпався, залишилося небагато перешкод для обрання Ґолдсона.\n\nНарешті прийшовши до влади, Ґолдсон як ніколи чітко усвідомлює свої цілі. У його баченні Беліз стане гордим членом панкарибської спільноти, де його кріольське населення зможе здійснювати самоврядування. Однак Ґолдсон не є єдиною людиною, що має вплив на Беліз. Окрім втомленого невдоволення Оттави, напруженість із Гватемалою продовжує тліти, тоді як повстанці НОП мовчки проклинають його як зрадника. Ґолдсон може бути на вершині, але падати йому ще дуже далеко."
 POLITICS_BLZ_GILBERT_WALTER_FAIRWEATHER_DESC: "Народжений у надзвичайно заможній та впливовій кріольській родині, Ґілберт Фервезер виріс у родині, яка мало що могла втратити від прямого британського контролю, а отримати могла ще більше. Ставши дорослим, він воював у Другій світовій війні, ставши героєм-винищувачем над пагорбами Великої Британії. Повернувшись додому регіональною знаменитістю, він приніс із собою непохитну відданість Британській імперії, яка тепер відступила до Оттави, — відданість, яку було важко зламати.\n\nЗберігаючи вплив у Добровольчій ґвардії Британського Гондурасу, спалах партизанської війни в глибині країни став останньою краплею та переконав його здійснити переворот. Коли уряд навколо нього перебував у стані паніки й відчайдушної невизначеності, мало що могло завадити йому усунути чинного керівника, і ще менше — піднести його самого на посаду лідера. Однак його популярність могла лише певною мірою запобігти подальшому виходу повстання НОП з-під контролю.\n\nТепер його проєкт зазнає труднощів. Під його наглядом, підживлюваний недовірою до метисів і корінного населення, Фервезер перейшов до жорсткого придушення тих, кого вважають соціялістами, метисами або прихильниками Гватемали. Лише його особиста популярність і постійний потік підтримки з американських та канадських сховищ не дають країні повністю впасти перед повстанням НОП. Фервезер прийшов до влади переможцем — але якщо він не змінить курс найближчим часом, то може опинитися серед переможених."

 BLZ_The_Fading_Order: "Згасаючий порядок"
 BLZ_The_Fading_Order_desc: "Ось уже десятиліття Законодавча рада Британського Гондурасу перебуває під контролем Національної партії — строкатої суміші комерційних інтересів і представників колоніального апарату під личиною кріольського націоналізму. Прем'єру Герберту Фуллеру вдалося утримати цю громіздку коаліцію разом завдяки прямій підтримці Канади та зберегти англофільний статус-кво в раді за допомогою повсюдної зміни виборчих округів на свою користь.\n\nОднак під цією завісою зростаюча напруженість розриває цей статус-кво на частини. Нездатність Фуллера провести змістовні реформи та його уявне підкорення Оттаві майже напевно забезпечили його усунення на наступних виборах. Залишається лише одне питання: чи зуміють канадці залучити нового місцевого лідера на свій бік, чи їм доведеться поступитися радикальнішим вимогам змін?"
 BLZ_A_New_Home: "Новий дім"
 BLZ_A_New_Home_desc: "Після урагану Гетті народ Белізу був змушений просити допомоги у своїх партнерів по ОВН. Зіткнувшись із масштабами страждань там, уряд Канади погодився надати Белізу фінансування для подолання найтяжчих наслідків лиха. Він також погодився підтримати будівництво нової столиці — Бельмопана.\n\nТепер, за багато миль від руїн Беліз-сіті, триває будівництво. Уряд країни сповнений рішучості розпочати нове життя для себе та свого народу."
 BLZ_A_City_Upon_A_Hill: "Місто на пагорбі"
 BLZ_A_City_Upon_A_Hill_desc: "Після років роботи та мільйонів доларів інвестицій місто Бельмопан було завершено. Хоча місто має певні архітектурні особливості — центральну кільцеву дорогу, великі паркові зони та архітектуру, натхненну храмами майя, — справжня сила міста полягає в його розташуванні.\n\nРозташований на висоті 75 метрів над рівнем моря та захищений пагорбами й тропічним лісом, Бельмопан убезпечений від сил Матінки-природи. Час покаже, як Беліз розвиватиметься звідси, але нове місто вже стало свідченням сили та стійкості белізького народу."
 BLZ_Insecurity_State: "Держава нестабільності"
 BLZ_Insecurity_State_desc: "Зовнішня загроза з боку Гватемали разом із повстанськими рухами всередині країни дедалі більше непокоїть канадців через їхню центральноамериканську опору. Ось уже два десятиліття колонія дедалі більше мілітаризується, а її народ зазнає дедалі жорсткіших репресій у міру погіршення ситуації.\n\nХоча ця держава мала б прокладати впорядкований шлях до майбутніх реформ, здебільшого вона лише придушувала будь-які розмови про зміни. Політичні свободи були обмежені, а популярну НОП заборонено, причому значна частина її керівництва досі перебуває у вигнанні. Навіть спроби поміркованих політиків наштовхуються на канадські побоювання щодо нестабільності та дедалі більшу параною в Добровольчій ґвардії Британського Гондурасу. Усі знають, що так тривати не може, але всі бояться неминучого краху."

 BLZ_A_Nation_Under_Siege: "Обложена нація"
 BLZ_A_Nation_Under_Siege_desc: "Хоча Гватемала визнає британське правління Британським Гондурасом із 1859 року, вона ніколи повністю не відмовлялася від своїх претензій на нього й нещодавно уклала хиткий союз із вигнаними повстанцями Народної об'єднаної партії, які прагнуть звільнити Беліз від британського правління. Канада відповіла розміщенням у колонії великого гарнізону, посиленого Добровольчою ґвардією Британського Гондурасу та покликаного запобігати ворожим вторгненням.\n\nЦя напруженість вибухнула в 1961 році, коли канадці за тихої американської підтримки увійшли до Гватемали в погоні за партизанами та зазнали нападу місцевих сил. Цей інцидент різко посилив напруженість і дав зрозуміти, що колонія не зможе здобути незалежність, доки її кордони не будуть убезпечені, хоч би як Канада та Сполучені Штати хотіли позбутися її."

 BLZ_Colonial_Undertow: "Колоніальна трясовина"
 BLZ_Colonial_Undertow_desc: "У той час як значна частина Британської Вест-Індії змогла залишити позаду кризу перших повоєнних років, Британський Гондурас, здається, застряг у середині сорокових. Цей невеликий шматок Центральної Америки спустошують повсюдна бідність і відсталість, що поглиблюються через низку руйнівних ураганів.\n\nЩороку дедалі більше його громадян залишають колонію в пошуках кращого життя, а решта залишаються позаду — і не лише в переносному сенсі.\n\nХоча Комісія Британської Вест-Індії та навіть Колоніальне управління в Оттаві розробили плани економічних реформ і розвитку, тривала напруженість на кордоні з реваншистським урядом Гватемали досі перешкоджає їхньому втіленню.\n\nПоки що, схоже, Британський Гондурас продовжить дедалі глибше занурюватися в колоніальну трясовину."

 BLZ_Citrus_State: "Цитрусова держава"
 BLZ_Citrus_State_desc: "Новий лідер приносить новий план для економіки Белізу. За Філіпа Ґолдсона Беліз здійснив стрімкий розвиток сільського господарства з масовою приватизацією за допомогою United Fruit Company — сірого кардинала економіки та політики Центральної Америки.\n\nХоча нові цитрусові плантації приносять розвиток і зростання ВВП, вони також створили величезну нерівність між робітниками та їхніми іноземними роботодавцями. Хоча Беліз завжди був близьким до США, ці інвестиції UFC лише ще більше зблизили його з ними, настільки, що спроба вийти з-під їхнього впливу завдала б економіці значної шкоди."

 BLZ_Democratic_Dawn: "Демократичний світанок"
 BLZ_Democratic_Dawn_desc: "Падіння Герберта Фуллера та його авторитарної Національної партії поклало край політичному застою в Белізі, дозволивши Демократичній партії Гондурасу та її лідерові Філіпу Ґолдсону змінити ситуацію. Серед численних обіцянок — скасування заборони на Народну об'єднану партію, демократичні реформи, економіка, вільна від колоніальної експлуатації Канадою, і навіть повна незалежність від канадського правління. За підтримки своєї партії та народу Філіп Ґолдсон цілком може досягти своїх планів щодо нації."

 BLZ_Old_Wounds: "Старі рани"
 BLZ_Old_Wounds_desc: "Недружнє минуле Белізу з гватемальцями досі залишається свіжою раною в пам'яті багатьох його громадян. Над надією відновити дружні відносини між двома країнами тяжіють наслідки кризи 1960 року. Хоча гватемальські диверсанти скоротили свою активність, а прикордонна війна завершилася безрезультатно, спустошення безповоротно заплямувало національний образ Гватемали.\n\nПісля падіння Національної партії опозиція всередині країни отримала трохи більше простору для дій. Попри це, репресії проти НОП залишаються звичним явищем, оскільки після того, як санкціоноване насильство вийшло з ужитку, поширилося переслідування поліції. Попереду довгий і важкий шлях, перш ніж старі шрами буде поховано."

 BLZ_Rural_Reform: "Сільська реформа"
 BLZ_Rural_Reform_desc: "Коли Джордж Прайс та його Народна об'єднана партія прийшли до влади, Беліз вступив у нову й амбітну еру сільської реформи. Як і багато інших лівих діячів Латинської Америки, Прайс запровадив політику розподілу великих земельних володінь поселенців. Хоча ця політика виявилася успішною, друга складова реформи була менш успішною.\n\nБудівництво мегапроєктів стало неоднозначним явищем для уряду Прайса. Хоча їх було збудовано і вони допомогли розвинути країну, ці проєкти потребували величезної мексиканської допомоги, ще тісніше прив'язуючи націю до Мексики. Беліз також набрав величезну кількість боргів для фінансування цих нових і дорогих проєктів."

 BLZ_Look_Latin: "Поглянути на Латину"
 BLZ_Look_Latin_desc: "Британська імперія являє собою руїну, що розвалюється, а англомовна цивілізація нічим не допоможе Белізу процвітати, поки сама намагається втриматися на плаву. Якщо стабільність важливіша за жадібність, то дружити з ближчими сусідами — хороша ідея. Тому поглиблення зв'язків із сусідніми лівими державами стало пріоритетом Джорджа Прайса.\n\nХоча деякі сусіди Белізу, можливо, ще не мають його найкращих інтересів на увазі, відхід від англо-канадського правління важливіший за сувору оцінку потенційних союзників. Хоча мексиканці та гватемальці мають свої проблеми, у них усе одно більше ресурсів, ніж белізці коли-небудь зможуть зібрати самотужки. Їхні претензії можна врегулювати пізніше, але свобода не може чекати."

 BLZ_Back_With_Bang: "Гучне повернення"
 BLZ_Back_With_Bang_desc: "Земля, яка колись відкинула його методи, тепер вимагає, щоб саме він нею керував. Для Джорджа Прайса перехід від вигнанця до глави держави є кардинальною зміною. Однак тепер було б нерозумно ставати самовдоволеним, коли консервативна опозиція як ніколи прагне повалити його правління. У міру того як стрімкі економічні реформи відсувають традиційні еліти на другий план, а уряд перебудовується, Прайс, якщо не зможе приборкати своїх старих ворогів, муситиме випередити їх.\n\nАнти-прайсівська пропаганда продовжує зосереджуватися на його нібито зв'язках із ополченнями вздовж гватемальського кордону — те саме звинувачення, через яке його колись ув'язнили. Змови не зникнуть, доки Прайс залишається при владі, але якщо бездіяльність не може їх зупинити, він принаймні може діяти на власний розсуд."

 BLZ_Into_Hurricane: "У пащу урагану"
 BLZ_Into_Hurricane_desc: "Спроба стабілізації Британського Гондурасу дала зворотний ефект: державний переворот Добровольчої ґвардії перетворив прикордонні ополчення на повномасштабне повстання, яке за підтримки Гватемали охопило сільську місцевість. Звернення по допомогу до Канади стали неефективними, оскільки Оттава вважає військову підтримку марною витратою ресурсів, тоді як байдужість гарнізону ще більше ускладнює перспективи посилення зобов'язань.\n\nСусідні режими вважають Британський Гондурас державою-парією і не бажають підтримувати те, що вони бачать як колоніальну диктатуру, яка тримається на останньому подиху. Хоча американський капітал, що надходить, наразі запобігає падінню Беліз-сіті, це триватиме лише доти, доки не пересохне останнє джерело."

 BLZ_New_Masters: "Нові господарі"
 BLZ_New_Masters_desc: "Після падіння канадського правління новий суверен разом із Гватемалою почав правити Белізом. Усі старі колоніальні позиції Канади були замінені новим різновидом гватемальського колоніалізму. Давній суперник тепер править нацією, мов король зі своїм васалом.\n\nНові гватемальські сюзерени не такі поблажливі, як старі канадські, перебираючи контроль над її зовнішньою політикою та військовими силами. Це, разом із давньою ненавистю одне до одного, спричинило різкий сплеск чисельності бійців опору, особливо серед креолів африканського походження, значно перевищивши показники часів канадського правління."

 BLZ_Compromise_Treaty: "Договір про дружбу"
 BLZ_Compromise_Treaty_desc: "Після років ворожнечі та прикордонних повстань договір, укладений за посередництва США, нарешті приніс певний мир Белізу та Гватемалі. Передбачаючи майбутній референдум щодо спірних територій, договір користується любов'ю белізького народу та його уряду, попри поступки та права на рибальство, надані Гватемалі. Оскільки решта партизанів або втекли, або роззброїлися, здається, що мир нарешті прийшов до двох суперників."

 # Flavour Events
 BLZ_forpol.0.t: "Мріючи про сніг"
 BLZ_forpol.0.desc: "Патріку Ньюхарту ніколи не подобалася вологість Центральної Америки. Але секретар відправив делегацію, і Ньюхарт мав стати одним із її членів, сподіваючись розпочати завершальний процес деколонізації Британського Гондурасу. Навряд чи сьогодні перо торкнеться паперу у формальному сенсі, але якщо гватемальська та канадська делегації зможуть домовитися про кілька основних пунктів, тоді вони матимуть міцну основу, на якій можна буде будувати протягом наступних дипломатичних зустрічей. Тож Патрік разом із кількома іншими відвідав місто Гватемала.\n\nГватемальську делегацію очолював Едґар Альварадо Орельяна, і він не приховував бажання повернути Гондурас Гватемалі цілком. Цього, безумовно, не станеться, але Ньюхарт розумів необхідність почати переговори з максимальної вимоги. Це була просто хороша переговорна стратегія.\n\n"Добрий ранок, панове". Начальник Патріка, Річард Ешворт, потиснув руку Орельяні. "Сподіваюся, це лише перша з багатьох плідних зустрічей. Ми сподіваємося забезпечити нове майбутнє для регіону та відносин між Канадою і вашим народом".\n\n"Думаю, цілком очевидно, що має статися. Коли Канада піде, Гватемала зможе відновити свою територіальну цілісність і нарешті постати як ціла нація, а не її частина".\n\n"Ну, ну". Ешворт махнув рукою. "Гондураська територія має власний яскравий та незалежний характер, і будь-яка угода повинна це відображати. Безумовно, кордони можна буде визначити після роботи комісії з обстеження за участю представників усіх трьох сторін".\n\n"Незалежний? Ви забрали територію і змінили все так, щоб стверджувати, ніби вона більше нам не належить!" Рот Річарда скривився в украй недипломатичній гримасі. "Що ж, гадаю, немає сенсу продовжувати цю дискусію"."
 BLZ_forpol.0.a: "Ньюхарт пішов разом з іншими канадцями, сподіваючись, що похолодання охолодить гарячі голови."

 BLZ_forpol.1.t: "Повідомляючи новини"
 BLZ_forpol.1.desc: "Від: Управління у справах Південної Америки\nМеморандум для директора\nЗвіт виконавчої розвідки: Внутрішня стабільність Гондурасу\n\nПісля розпаду Британської імперії Британський Гондурас фактично перейшов під контроль Канади. Маючи обмежені ресурси, Канада насилу справлялася з управлінням колонією і дедалі частіше відкрито та таємно зверталася до Вашингтона з проханням допомогти розробити рішення, яке відповідало б канадським інтересам. Державний департамент вважає, що в короткостроковій перспективі в інтересах США залишити Гондурас колонією під канадським контролем. Перш ніж ми зможемо забезпечити довгострокову орієнтацію на ОВН після відходу Канади, знадобиться більше інвестицій і впливу, ніж існує зараз. Із 1960 року на кордоні спостерігається широкомасштабна активність, пов'язана з підтримуваними Гватемалою партизанами, що зумовило американське втручання. Цю нестабільність необхідно подолати, інакше ризик регіонального конфлікту є високим.\n\nБільше занепокоєння викликає нещодавнє звільнення лівого популіста Джорджа Прайса та скасування заборони на Демократичну партію Гондурасу. Прайс неодноразово заявляв про бажання експропріювати власність, що належить Сполученим Штатам, Канаді чи іншим інвесторам ОВН. Прайс майже напевно має зв'язки з гватемальськими партизанами і може бути сприйнятливим до німецьких або японських розвідувальних операцій, якщо прийде до влади.\n\nРекомендується провести розслідування та виявити докази цих зв'язків із Гватемалою. Багато гондурасців зазнали негативних наслідків тривалої партизанської кампанії — від спалених полів і вкраденого зерна до викрадень і вбивств. Якщо зв'язки Прайса з цими угрупованнями будуть викриті, він зіткнеться зі значною негативною реакцією, втратить легітимність в очах гондураської громадськості та не зможе створювати проблеми для США чи ОВН у майбутньому."
 BLZ_forpol.1.a: "Вірність, відвага, чесність"

 BLZ_forpol.2.t: "Великий прорив"
 BLZ_forpol.2.desc: "Друзі називали Франсіско Соберінаса Френкі, але в редакції Bulletin він був відомий як "хлопець, який зробить що завгодно, аби отримати своє ім'я під статтею, крім підлабузництва перед начальством". Ось і тепер він чистив друкарські вали та підмітав, поки старші репортери пили й розважалися зі своїми коханками. Френкі знав, що, можливо, просто марнує час, але для того, щоб стати справжнім журналістом, йому потрібен був лише один великий прорив.\n\nВиносячи сміття до контейнера, він помітив біля парадних дверей покинуту сумку, надто повну, щоб пролізти крізь поштову щілину. Він схопив сумку, повертаючись усередину, але, переглядаючи документи й не знаючи, що саме знайде, почав сповільнювати крок, а руки затремтіли. Документально підтверджені зустрічі між Джорджем Прайсом та відомими гватемальськими бойовиками, які здійснювали рейди через кордон і нападали на місцевих фермерів. Робочий документ авторства Прайса, у якому пропонувалося надати Гватемалі контрольний пакет в економіці. Це було щось величезне. Джордж Прайс, відомий антиколоніальний активіст, просто прагнув змінити ім'я нового колоніального володаря й пробачити йому всю агресію.\n\nВін і раніше був утомлений, але це відкриття вдарило по ньому сильніше, ніж три чашки кави. Він сів за друкарську машинку й написав: "Ціна Прайса, автор Франсіско Соберінас". А тоді детально виклав ексклюзивне розслідування, донесене до народу Belize Bulletin.\n\nНаступного дня ранковий випуск вийшов із новим заголовком. До полудня ця історія з'явилася у других тиражах усіх газет. До вечора двадцятий помідор уже влучив у офіс Демократичної партії Гондурасу, а перед ним зібрався натовп із транспарантами, що засуджували Прайса. Новина розлетілася швидко, а Франсіско, який спав після свого великого дня, мріяв про нові заголовки та авторські підписи."
 BLZ_forpol.2.a: "Єдине, що швидше за зліт політика, — це його падіння"

 BLZ_forpol.3.t: "Прості вимоги"
 BLZ_forpol.3.desc: "Філіп Ґолдсон не мав опинитися тут. Мексика та її однойменна столиця були для Белізу найбільшими ворогами після Гватемали. Мексика засипала Беліз санкціями відтоді, як у 1960 році почалася криза між Гватемалою та Белізом. Ґолдсон сподівався сьогодні це змінити. Безперечно, Мексика погодиться працювати з таким порядним лібералом, як він. Людиною, яка очолює уряд, налаштований на мир.\n\nҐолдсон увійшов до престижного ресторану в місті та зустрівся з Віктором Уркіді, економістом, який здобув освіту в Лондоні. Він мав стати посередником між Ґолдсоном і Мексикою. "Сеньйоре Уркіді!" — вигукнув Ґолдсон. "Пане Ґолдсоне! Не хвилюйтеся, я розмовляю англійською", — зі сміхом відповів Уркіді, висуваючи для нього стілець.\n\nВони насолоджувалися обідом, доки не принесли рахунок. Ґолдсон прокашлявся й почав: "Пане Уркіді, обід був чудовий, але, гадаю, тепер нам варто поговорити про справи". Уркіді витер із рота позоле, який він їв. "Звичайно, звичайно. Гадаю, це щодо санкцій".\n\n"Саме так. Ви розумна людина. Ми обидва знаємо, що ці санкції нікому не приносять користі, ми обидва втрачаємо цінного торговельного партнера". Уркіді дозволив Ґолдсону кілька хвилин базікати. Це було по-доброму. Коли той почав сипати цифрами та відсотками, Уркіді його зрозумів. Санкції нікому не вигідні, але Мексика не може дозволити собі виглядати дружньою до колонізаторів, проти яких вона виступала.\n\n"То що ви думаєте?" — завершив Ґолдсон. "Мені дуже шкода, пане Ґолдсоне, але доки НОП залишається забороненою, а її лідер, пан Прайс, залишається ув'язненим, Мексика не може скасувати ці санкції. Поки що я б не очікував, що вас знову запросять, доки пан Прайс не вийде з в'язниці, а НОП не буде легалізована". Ґолдсон відчував, як упродовж усієї промови його плечі опускаються. За мить він відповів усмішкою."
 BLZ_forpol.3.a: ""Я подивлюся, що зможу зробити.""

 BLZ_forpol.4.t: "Пастка Уркіді"
 BLZ_forpol.4.desc: "Минув певний час, але Мексика знову відкрилася для Белізу. Санкції поступово скасовувалися, а консульство було відновлено. Звісно, Джорджа Прайса довелося звільнити, але Ґолдсон був упевнений, що такий базіка, як він, не становитиме загрози його переобранню. В оточенні своїх помічників Ґолдсон потиснув руку новому консулу й радісно оголосив про відновлення роботи консульства перед телекамерами та мікрофонами журналістів. Протягом усієї промови його погляд раз у раз ковзав до постаті біля нового консула — Джорджа Прайса. Минуло лише кілька місяців відтоді, як його звільнили.\n\nКоли Ґолдсон завершив промову, консул разом із Прайсом підійшов до мікрофонів. "Я дуже радий бути тут сьогодні, щоб відкрити мексиканське консульство в Белізі. Я хотів би заявити, що Мексика ніколи не була країною, спрямованою проти Белізу, Мексика — за Беліз. Мексика виступає проти смороду неоколоніалізму, який гноїться в цій нації. Такі країни, як Канада, роками експлуатували Америки. Вони десятиліттями експлуатували такі країни, як Беліз, але тепер настав час для Белізу стати вільним".\n\nКонсул зайшов до посольства, а його промова завершилася оплесками Джорджа Прайса та членів НОП, які ходили за ним усюди. Ґолдсон мав очікувати цього ходу. Мексика не могла просто мирно співіснувати з його Белізом — вони хотіли повалити його та привести до влади свою людину. Можливо, йому взагалі не варто було погоджуватися на угоду Уркіді. Проте повернути все назад він уже не міг. Його конфлікт із Прайсом вирішиться на виборах."
 BLZ_forpol.4.a: "З в'язниці до прем'єр-міністра?"

 BLZ_forpol.5.t: "Keri Keri"
 BLZ_forpol.5.desc: "Віктор Уркіді завжди знав, що найгостріші зуби ховаються за найширшими усмішками. Справжня акула завжди усміхається, тож, дивлячись на Джорджа Прайса, звільненого з в'язниці та тепер свіжого лідера опозиції, який готується до нових виборів, Уркіді бачив верховного хижака, що нишпорить цими політичними водами. Ось чому він і зустрічався з ним у Мехіко, без сумніву, з піснею на вустах і не таким уже й маленьким проханням.\n\n"Радий вас бачити, сеньйоре Прайсе. Я здивований, що ви можете викроїти час для візиту під час виборчої кампанії".\n\n"Звичайно, сеньйоре Уркіді. Але якщо люди мають повірити мені, коли я кажу, що Беліз повинен пліч-о-пліч приєднатися до своїх латиноамериканських братніх країн, я мушу це продемонструвати. Беліз потребує власного незалежного майбутнього, тож я приїхав сюди, щоб сказати вам, наскільки це важливо для мене та моєї партії. Якщо ми переможемо, ми прагнутимемо покласти край канадському контролю над нашою країною".\n\nУркіді кивнув. Він очікував цього від будь-якого кандидата, який зазнав такого самого поводження з боку канадців.\n\n"Але це ще не все. Я знаю, що з Гватемалою виникали труднощі, але це в минулому. Якщо мене оберуть, я відновлю відносини з цією країною, навіть якщо це означатиме поступки".\n\nУркіді перестав кивати. Саме цього хотіла Мексика, але, що важливіше, Прайс знав, що саме цього хотіла Мексика. Зараз було легко обіцяти такі речі, але коли громадськість могла б розіп'яти його за поступки, Прайс був би значно менш рішучим. Так працювала економіка — легко продавати, коли ціна низька. Уркіді вловив паузу Прайса й відповів на натяк. "Якщо ви отримаєте фінансування".\n\nНастала черга Прайса кивнути, і акули попливли по колу."
 BLZ_forpol.5.a: ""Я поговорю зі своїм начальством. Вони можуть надати вам те, що вам потрібно.""
 BLZ_forpol.5.b: ""На жаль, ресурси Мексики обмежені, коли йдеться про закордонні справи.""

 BLZ_forpol.6.t: "Приплив, що зростає"
 BLZ_forpol.6.desc: "Це було море незнайомих облич, але хоча він не знав усіх їхніх імен, Філіп Ґолдсон знав одне слово, яке описувало їх усіх: співвітчизники.\n\nТак багато його співвітчизників вирушили до Сполучених Штатів у надії розбагатіти. Багато хто працював у сільському господарстві, інші перейняли підприємницький дух дядечка Сема та прагнули створити власний бізнес. Одні керували ринками, ресторанами чи барами, інші — автосервісами або будівельними фірмами, багато хто з яких наймав інших белізців. Вони не лише надавали життєво важливі послуги емігрантам, а й підтримували зв'язок із батьківщиною; грошові перекази приносили хороші американські долари, які можна було витрачати на розвиток внутрішньої економіки Белізу. Він мав подбати не лише про те, щоб цей життєво важливий потік грошей не припинився, а й про те, щоб він зріс і перетворився на могутню ріку, яка понесе державний корабель Белізу до землі обітованої.\n\n"Друзі мої. Ви зробили те, що багато хто вважав би неможливим. Ви приїхали до іншої країни й побудували щось, що можете назвати своїм. Ваші руки, ваші серця створили щось, чим справді можна пишатися. І ви не забули свої сім'ї вдома, ділячись із ними своїм добробутом, який своєю чергою створює щось більше на вашій власній батьківщині.\n\n"Але ми не повинні гладити себе по спині; ми повинні дивитися в майбутнє. Беліз розвивається, мої співвітчизники, і для тих, хто готовий скористатися цими верхів'ями ріки, відкривається можливість нового золотого віку. Беліз зростатиме, і для тих, хто готовий допомогти поливати поля, врожай буде справді великим. Тож інвестуйте в Беліз, панове, і дозвольмо нам обом разом побудувати краще завтра"."
 BLZ_forpol.6.a: "Беліз процвітає, коли його сини огортають його багатством."
 
 BLZ_forpol.7.t: ""
 BLZ_forpol.7.desc: ""
 BLZ_forpol.7.a: ""
 
 BLZ_forpol.8.t: "Напруження зростає"
 BLZ_forpol.8.desc: "Цокання годинника наповнювало тишу кабінету. Американський консул постукував пальцем по столу в такт секундам, що спливали. Його погляд був прикутий до канадського губернатора поверх краю манільської папки, розгорнутої перед ним. Він поклав папку на стіл і посунув її назад до американця. "Отже", — почав губернатор, — "ви не збираєтеся робити абсолютно нічого".\n\nКонсул зітхнув і потер скроні. "Ні, губернаторе, ми надамо оперативну підтримку та допоміжний персонал вашим групам, які ви відправля-" Він урвав себе від роздратування. "Ви взагалі читали клятий документ!"\n\n"Я прочитав, що ви не бажаєте надавати жодної реальної підтримки, щоб не допустити Беліз до рук гватемальців, залишаючи мої війська самотужки підтримувати переворот". Губернатор глибоко вдихнув і подивився американцеві просто в очі. "Ви ж розумієте, що означає цей переворот, чи не так? Добровольча ґвардія Британського Гондурасу веде країну до хаосу, відносини з гватемальцями руйнуються щохвилини, а ви..." Чоловік нахилився вперед і прошепотів голосніше за будь-який крик. "Ви хочете надіслати допоміжну допомогу? У мене є відчуття, консуле, що без подальшої підтримки з-за кордону незабаром може не залишитися Гондурасу, якому можна буде допомагати. Хтось мусить виступити вперед, бо я боюся, що ми більше не бачимо цінності в цій інвестиції".\n\nАмериканець стиснув щелепи й підвівся."
 BLZ_forpol.8.a: ""Я... зроблю кілька дзвінків, губернаторе.""

 BLZ_forpol.9.t: "Звіт ДБГ №7"
 BLZ_forpol.9.desc: "Нещодавня нафтова криза призвела до того, що канадці офіційно оголосили про те, що ми давно підозрювали, — повний вихід із Британського Гондурасу. Це залишить Добровольчу ґвардію самотужки намагатися втримати країну разом. Підтримуваний Мексикою гватемальський уряд вторгнеться без втручання, і майже напевно переможе.\n\nАналіз ситуації чітко показує, що Добровольча ґвардія нездатна самотужки витримати цей тиск. Канадці підтримували стабільність у країні майже власними силами. Ми могли б втрутитися й посісти їхнє колишнє місце, хоча ціна буде немалою. Нам знадобиться негайна мобілізація військ для підтримки ґвардії та забезпечення миру, а також укладені й підписані до кінця тижня договори про втручання.\n\nЧасу тут обмаль, а події розвиваються швидко. Ми радимо діяти негайно — або не діяти взагалі."
 BLZ_forpol.9.a: "Гадаю, нам доведеться..."
 BLZ_forpol.9.b: "Час скорочувати наші втрати."

