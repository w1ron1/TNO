 BLZ_forpol.30.t: "Якщо дерево падає в лісі"
 BLZ_forpol.30.desc: "Конференція ОАД була нудною. Доповідачі повільно змінювали один одного, порушуючи дрібні питання, обговорюючи політику щодо інфраструктури та засуджуючи збройні конфлікти. Канадський представник був бюрократом, що займався паперовою роботою, не надто примітним, очолював відділ, який нікого не цікавив, і був достатньо високопоставленим у державному апараті, щоб йому доручили підготувати та виголосити дуже формальне засудження вторгнення гватемальських військ до Белізу. Половини аудиторії не було на своїх місцях, коли він почав свою суху промову, але протягом неї поступово заходило дедалі більше людей. Не через їхній інтерес до того, що він говорив, а просто тому, що він був останнім доповідачем менш важливої вступної частини конференції, і невдовзі вони мали почати обговорювати справжні питання, такі як Нафтова криза.\n\n"... і ми продовжуємо засуджувати дії, здійснені на території Белізу та прилеглих територіях..."\n\nСлова зливалися докупи, та й не можна було сказати, що вони були новими. Серед мексиканців навіть існував невеликий тоталізатор щодо того, чи були ці слова безпосередньо поцуплені з якоїсь відомої промови минулого, чи являли собою клаптикову ковдру з кількох таких промов. Після кількох виснажливих хвилин промова нарешті почала добігати кінця.\n\n"... Ми вважаємо огидним те, що винуватці цієї трагедії сидять тут, у цій самій кімнаті. Ми вважаємо огидним те, що вони ще більше дестабілізують це крихке місце, яке ми називаємо домом. І ми вважаємо огидним те, що вони сидять тут не в ганьбі, а як колеги всіх присутніх. Ми закликаємо ОАД до швидких і рішучих дій та просимо відкрити обговорення питання про негайні санкції.""
 BLZ_forpol.30.a: "Нікого не було поруч, кому було б не байдуже."
 