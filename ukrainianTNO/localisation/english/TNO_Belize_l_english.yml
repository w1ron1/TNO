 BLZ_forpol.18.t: "Наречена заперечує"
 BLZ_forpol.18.desc: "Державному департаменту знадобилося лише два дзвінки, щоб відповісти на виклик американського консула. На цей дзвінок із Белізу чекали; країна кипіла після того, як просочилися чутки про підтриманий американцями план об'єднання з Гватемалою.\n\nКонсул почав говорити, ігноруючи привітання. Його голос лунав уривчасто, а навколо консульства ревів натовп із вигуками. "Того, хто вирішив, що це об'єднання — хороша ідея, треба звільнити", — кричав консул. "Навколо консульства тисячі людей, вони ломляться в наші двері! Преса злила весь план!"\n\nЧиновник у Вашингтоні спробував заспокоїти консула. "Повірте, ми розуміємо напруженість ситуації та уважно стежимо за всім. Ми все ще намагаємося зв'язатися з урядом Белізу, щоб допомогти розігнати натовп і взяти все під контроль".\n\n"Вони цього не зроблять", — різко відповів консул. "Вони допомагають протестам, заохочують заворушення! Половина кабінету була там і підбурювала натовп годину тому". На кінці лінії пролунав різкий гуркіт, розбилося скло. Було чути метушню консула, який продовжував: "Вашингтон має знати, що вони не збираються це так залишати. На це знадобиться набагато більше, ніж кілька тижнів або навіть років, можливо, ціла вічність. Ми молимося, щоб вони розійшлися до ранку, але це знає лише Бог". Лінія швидко обірвалася."
 BLZ_forpol.18.a: "Тієї ночі зорі та смуги палали яскраво."

 BLZ_forpol.19.t: "Але один надріз"
 BLZ_forpol.19.desc: ""І нехай мир навіки панує між нашими двома народами!" Мікрофон повернули на стійку, а гватемальський солдат приніс ножиці. Щоправда, для своїх співвітчизників-гватемальців він не був гватемальцем. Народжений і вихований в Америці та справжній морський піхотинець США, для місцевих він був просто черговим грінґо.\n\nНожиці перерізали стрічку, і вона затріпотіла на вітрі. Натовп, що спостерігав, вибухнув оплесками, а серед тих, хто аплодував, передусім були лідери країн із нагоди цієї події, зі своїми свитами поруч.\n\nОднак їхнього спільного оптимізму їхні громадяни зовсім не поділяли. На тлі спокійних дерев і колишніх квітів белізці аплодували та радісно вигукували. На тлі доволі жорстокого арешту, що відбувався в Кобані, гватемальці лише аплодували задля пристойності, причому їхній лідер був єдиним серед них, хто усміхався. Його свита була єдиним, що стояло між ним і гострими, мов лезо, поглядами його громадян.\n\nОдин із канадських чиновників повернувся до американського дипломата, що стояв неподалік. "Знаєте, можливо, є шанс, що цей регіон нарешті побачить мир".\n\n"Я теж так думаю, Овене. Чесно кажучи, мені трохи сумно їхати. Ці дві нації стоять на краю прірви, а тепер нам доводиться залишити їх напризволяще".\n\n"Не варто хвилюватися. Зрештою все закінчиться добре. Як і з моїм сином".\n\nУсі почали залишати церемонію, не залишивши нічого, крім стрічки на землі на згадку про цей день. Легкий дощ лагідно штовхав одну її частину в бік Гватемали, а іншу — в бік Белізу. Овен знову повернувся до американського дипломата. "Гей...""
 BLZ_forpol.19.a: ""...Ти впевнений, що ми вчинили правильно?""
 BLZ_forpol.19.tt: "§FПісля підписання §&Договору о§!§*б дружбу§! відносини між [GUA.GetFlag] §&гватемальським§! та §*белізьким§! [BLZ.GetFlag] урядами були §nнормалізовані§!, що було б неможливим без нашої допомоги.§!"

 BLZ_forpol.20.t: "Дві сторони однієї монети"
 BLZ_forpol.20.desc: "Американський консул у Белізі зайняв своє місце на церемонії об'єднання Гватемали та Белізу. Гватемальська делегація одразу його помітила. "Аміґо!" — вигукнув один із них, звертаючись до американця. "Сьогоднішній день увійде в історію — усе завдяки вам, американцям. Ми завдячуємо вам усім".\n\nКонсул тепло усміхнувся, звертаючись до делегації. "Ми раді бачити, як наша співпраця увінчалася успіхом; незабаром між нашими країнами розквітне нова ера". Делегація засміялася разом із консулом, і всі потиснули йому руку. Зміни в країні відчувалися, але відчувався й Беліз.\n\nПлоща все ще була всіяна клаптями спалених американських і гватемальських прапорів після протестів напередодні вночі. Протистояння між протестувальниками та поліцією, що тривало всю ніч, завершилося лише вранці, але неприязнь усе ще витала в повітрі. Белізький міністр піднявся на трибуну, щоб розпочати захід, і його голос був напруженим протягом усієї промови, а після її завершення оплески пролунали лише з боку гватемальської делегації.\n\nКонсул повільно видихнув. Народ Белізу ще не скоро пробачить Америку. Але Гватемала сяяла від задоволення — це була ціна, яку він був готовий заплатити."
 BLZ_forpol.20.a: "Те, що Вашингтон вважав вартим того."

 BLZ_forpol.21.t: "Маріонетка без ниток..."
 BLZ_forpol.21.desc: ""Мої колеги з ОАД", — оголосив Джордж Прайс натовпу, — "я дуже радий стояти тут і представляти Беліз, уперше як повноправний член ОАД". Прайс поглянув на канадську та американську делегації, перш ніж сказати: "Беліз ніколи не хотів бути джерелом розколу для Америк, і ми раді залишити цю історію розколу в минулому. Сьогодні ми раді приєднатися до єдності з нашими латиноамериканськими братами!" Прайс кивнув мексиканській делегації, залишаючи сцену під оплески.\n\nАмериканські делегати заговорили між собою. "Гадаю, нам усім залишається лише послати самих себе до біса", — зітхнув Джо. "Мільйони пішли їм, і ось що ми отримуємо".\n\n"Я здивований, що він не представився мексиканським делегатом, зважаючи на те, скільки позик він від них отримав", — відповів Айзек.\n\n"Цей хлопець не може сказати майже нічого, бо якщо скаже, увесь його економічний план розвалиться".\n\nГрупа продовжувала сперечатися, доки не вийшов наступний делегат. Прайс кинув на них ще один погляд і намагався не думати про те, про що вони говорили."
 BLZ_forpol.21.a: "...Все ще залишається іграшкою"

 BLZ_forpol.22.t: "Передаваний без докорів сумління"
 BLZ_forpol.22.desc: "Щойно по радіо пролунало оголошення про прискорене просування заявки Белізу на вступ до Федерації Вест-Індії, вулиці вибухнули. Хуан стояв біля Альберт-стріт у центрі Беліз-сіті, спостерігаючи, як повз проходить черговий натовп, вигукуючи, сперечаючись, захоплений хаосом, спричиненим рішенням Ґолдсона. Колись Хуан підтримував Ґолдсона, бачачи, як той кидає виклик Гватемалі та прогватемальській політиці, лише щоб тепер втягнути Беліз до іншого, більшого союзу.\n\n"Відійди, брате", — пробурмотів перехожий, штовхнувши Хуана. "Кажуть, американці від цього в захваті. У захваті! Ніби це робить нас хоч чимось кращими".\n\n"Хіба це чимось відрізняється від того, що намагалися зробити гватемальці?" — парирував Хуан.\n\n"Усе одне й те саме: британці, американці, гватемальці. Чому вони просто не можуть залишити Беліз белізцям!" Чоловік побіг до наступного перехожого, щоб кричати вже на нього.\n\nНа іншому боці вулиці інша група молодих белізців підняла саморобні плакати, усі проти цієї нової угоди з Федерацією. Спочатку це була боротьба проти гватемальців, а тепер — проти Вест-Індії. Хуан пригадав промови, яким він аплодував нещодавно, обіцянки вільного, незалежного Белізу. Тепер ті самі лідери говорили про регіональну стратегію та зміцнення партнерств.\n\nУдалині завили сирени, і натовпи почали розходитися. Знову Беліз виявився втягнутим у щось більше, щось нав'язане зовнішніми силами. І цього разу, як і минулого..."
 BLZ_forpol.22.a: "...белізці знову боротимуться за власне майбутнє."

 BLZ_forpol.23.t: "Розчищення землі"
 BLZ_forpol.23.desc: "Це був ідеальний ґрунт для цитрусових. Дослідження United Fruit уже дійшли такого висновку, але, оглянувши землю та зробивши лише кілька побіжних вимірювань кислотності й рівня нітратів, Карл Флетчер зрозумів: якщо щось і було неточним, то прогнози виявилися надто скромними.\n\nФіліп Ґолдсон запросив дослідницьку групу UFC оглянути потенційні місця для вирощування, і компанія була лише рада такій можливості. Ґолдсон відчайдушно потребував інвестицій у свою щойно незалежну країну, а це означало, що UFC могла досить легко отримати землю та значну частку прибутку. Але Карлу потрібно було знати, наскільки ризикованою буде інвестиція, перш ніж хтось із керівників затвердить остаточні умови. Щоправда, з таким багатим ґрунтом вони побачили б знаки долара незалежно від ризику.\n\nУсе було б ідеально, якби біля річки не було невеликого селища халуп. Воно являло собою небагато: лише кілька будівель, переважно з колод і листового металу. Кілька рибалок витягували свій улов із річки, а неподалік по луках ганяли невеликі стада кіз — стихійне поселення, яке, здавалося, виникало щоразу, коли знаходилося хороше джерело води.\n\n"Усе вам до вподоби, містере Флетчер? Я знаю, що United Fruit прагнула розпочати роботу до початку сезону вирощування, щоб не втрачати часу".\n\n"Ґрунт тут ідеальний, вода свіжа, а земля достатньо рівна для великомасштабного землеробства. Гадаю, United Fruit дуже охоче матиме з вами справу. Єдина проблема — ті самозахопленці он там". Флетчер вказав у напрямку селища. "Їх потрібно буде прибрати, перш ніж ми зможемо розпочати роботу".\n\n"Згоден, ми не можемо дозволити незаконним поселенням поставити під загрозу процвітання Белізу. Їх негайно виселять"."
 BLZ_forpol.23.a: "Необхідність — мати творчого руйнування."

 BLZ_forpol.24.t: "Змиритися з безвихіддю"
 BLZ_forpol.24.desc: "Повітря було липким, але попри вологість на цьому прикордонному посту ледве вистачало питної води. Старший сержант Барнс оглянув обірваний взвод, що ніс службу на посту. Три зміни фактично означали, що третина табору завжди була на чергуванні, третина намагалася хоч якось виспатися на цих вологих койках, загорнувшись у москітні сітки, а третина нудьгувала до біса. Здавалося, через день спалахувала бійка через гру в кості або через будь-яку іншу дурницю, якою рядові намагалися забути той факт, що їх відправили в середину Мотагуа після того, як канадці просто до біса пішли.\n\nНе було сенсу йти до місцевого міста. Не можна було довіряти воді, навіть якщо її кип'ятити, а там ще й завищували ціни та розбавляли алкоголь водою, тож не лише не нап'єшся, а зазвичай ще й проводиш три дні в нужнику, поки не висереш із себе всі кишки досуха. Тож командування просто наказало не ходити туди.\n\nЙого люди не хотіли тут бути. Він теж особливо не хотів, але йшов туди, куди його призначали, і знаходив у цьому похмуру форму задоволення. Він був професіоналом, солдатом і знав, що може витримати що завгодно, бо його виховали з переконанням, що ніколи не можна наказувати людині робити те, чого не зробив би сам. Старомодно й наївно, можливо, але саме це робило його хорошим солдатом.\n\n"Сержанте Барнс, знову спалахнула бійка. Кілька хлопців її розборонили, але, схоже, у нас усе-таки є зламаний ніс".\n\nБарнс пробурмотів щось і підвівся з імпровізованого столу. "Гаразд. Немає сенсу карати ще суворіше. Життя тут і так досить паршиве. Відправте обох до медпункту й нехай їм нададуть допомогу. Я просто відправлю їх на протилежні кінці посту, а того, хто першим ударив, на кілька днів поставлю на чергування в нужнику"."
 BLZ_forpol.24.a: "Натягнутий канат часто перетирається, якщо його не підтримувати належним чином."

 BLZ_forpol.25.t: "Картковий будинок"
 BLZ_forpol.25.desc: "Було далеко за північ, але офіс гудів, мов вулик. Ситуація в Центральній Америці різко погіршилася. Щосекунди з копіювального апарата виходили нові звіти, їх пакували, ставили штампи й відправляли до кабінетів відповідних відомств. Слова почали зливатися докупи. Повномасштабне вторгнення. Гватемальські війська переходять кордон. Добровольча ґвардія розпадається. Американські громадяни зникли під час бойових дій. Канадці просять притулку.\n\nПовідомлення звідусіль повторювали одну й ту саму історію. Без підтримки США чи Канади маленьку націю ніщо не врятує. Рішення, ухвалені чиновниками в кабінетах, тепер супроводжувалися зернистими зображеннями кривавих наслідків. Коли настане ранок, почнуться протести, мобілізація, накази про евакуацію, гуманітарні заходи. Ще більше паперової роботи.\n\nУсі були на палубі — від Державного департаменту до ФБР, а невдовзі військові теж почнуть вимагати звіти, оновлення інформації про ситуацію та свідчення. У поспіху всього цього деталі губилися серед перевантажених працівників офісу. Їхні руки набували правильних форм, необхідних для виконання роботи, але майже нічого більше. Зрештою їх замінять інші, сповнені тієї самої співчутливості та енергії, які поступово виснажаться до наступної ночі. І наступної.\n\nІ наступної."
 BLZ_forpol.25.a: "Що ми можемо зробити?"

