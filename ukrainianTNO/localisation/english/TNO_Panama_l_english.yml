PAN_Floyd_Britton: "Флойд Бріттон"
PAN_Floyd_Britton_desc: "Флойд Бріттон щодня прокидається в чужій для нього країні, купленій і проданій за десятиліття до його народження, де з ним поводяться так, наче він самозванець. Флойд Бріттон не помре в цій країні, навіть якщо його не виженуть із її землі.\n\nЦе було те саме відчуття чужості, яке відчували в цій країні його батьки, приїхавши до Панами в пошуках роботи, але залишившись лише з крихтами зі столу. Чого б у них не було, їм вистачило, щоб дати молодому Флойду середню освіту, де він виявив хист до мобілізації людей як студентський лідер. Його діяльність звела його з лівими групами, особливо після повчальної поїздки на Кубу.\n\nДень мучеників став кульмінацією не лише його життя, а й життя цілого покоління, оскільки репресії, яких вони зазнавали, були відкинуті разом із падінням Ремона. Однак він не є єдиною жертвою. Олігархи, навіть слабкі ліберали — готові стерти свою співучасть і правити так, ніби лише вони є дорослими в цій кімнаті, — були розсіяні, ставши спостерігачами за новою Панамою.\n\nОднак це відчуття чужості залишається, адже на його горизонті майорить американський прапор. Доки він залишається, залишаються й їхні репресії. Якщо Панама має стати батьківщиною, вона повинна бути цілісною, як одна нація та один прапор. Вашинґтон почує їх і буде змушений відповісти, а відповідь може або піднести його, або зламати." #Base Gaitanist version
PAN_Floyd_Britton_canal_desc: "Флойд Бріттон прокидався щодня в чужій для нього країні, купленій і проданій за десятиліття до його народження, і з ним поводилися як із самозванцем. Це не та країна, в якій він живе тепер.\n\nЙого батьки колись відчували те саме, приїхавши до Панами в пошуках роботи, але залишившись лише з крихтами зі столу. Чого б у них не було, їм вистачило, щоб дати молодому Флойду середню освіту, де він виявив хист до мобілізації людей як студентський лідер. Його діяльність звела його з лівими групами, особливо після повчальної поїздки на Кубу.\n\nДень мучеників став кульмінацією не лише його життя, а й життя цілого покоління, оскільки репресії, яких вони зазнавали, були відкинуті разом із падінням Ремона. Однак він не є єдиною жертвою. Олігархи, навіть слабкі ліберали — готові стерти свою співучасть і правити так, ніби лише вони є дорослими в цій кімнаті, — були розсіяні, ставши спостерігачами за новою Панамою.\n\nУ протистоянні, якого не сталося, Вашинґтон — попри всі шанси — погодився повернути Канал Панамі. Хоча це розкололо багатьох лівих щодо того, чи можна по-справжньому довіряти цій імперській державі, наразі це міцно пов'язало Панаму з Америкою. Інші можуть поставити під сумнів легітимність цієї свободи, але для Бріттона це стало першим днем, коли він відчув себе вдома в Панамі." #Gaitanist version, successful negotiations
PAN_Floyd_Britton_amazonist_desc: "Панама була країною, купленою та оплаченою Америкою, але її народ не був частиною угоди — це були ті, кого ніколи не питали, а лише ставили перед фактом. Тепер ці люди говоритимуть зі світом, а Америка слухатиме.\n\nДля Флойда Бріттона цей час настав надто пізно. Його життя до Дня мучеників минуло в слуханні інших, так званих дорослих у кімнаті, які ухвалювали рішення, що лише набивали їхні власні кишені. Для нього це ніколи не мало сенсу, а коли гнів у кімнаті зростав, стало зрозуміло, що таких, як він, більше за решту. Того дня вони вийшли в повній силі, а всі інші зібралися й пішли.\n\nІ все ж Америка не слухала. Навіть коли його привели до найвищої державної посади, американці сховали голову в Канал і вдавали, ніби його там ніколи не було. Невдовзі Бріттон зрозумів, що вони ніколи не слухатимуть, якщо він не змусить їх підвестися й звернути увагу. Коли розхвалені ліберальні опоненти опинилися виметеними до держав, що їх підтримували, стало зрозуміло, що зміни прийшли.\n\nБезсилі засудження вириваються з вуст вихолощеної буржуазії, патріоти волають до іноземних держав, щоб ті пограбували їхню батьківщину, тоді як їхній ненависний президент будує власні плани. Панаму знову зроблять цілісною не документами чи промовами, а лише кров'ю, коли постріли лунатимуть по всьому світу." #Amazonist
PAN_Floyd_Britton_amazonist_canal_desc: "Панама була країною, купленою та оплаченою Америкою, але її народ не був частиною угоди — це були ті, кого ніколи не питали, а лише ставили перед фактом. Тепер її народ дозволив своїм діям говорити за себе, і світ нарешті почув.\n\nДля Флойда Бріттона цей час настав надто пізно. Його життя до Дня мучеників минуло в слуханні інших, так званих дорослих у кімнаті, які ухвалювали рішення, що лише набивали їхні власні кишені. Для нього це ніколи не мало сенсу, а коли гнів у кімнаті зростав, стало зрозуміло, що таких, як він, більше за решту. Того дня вони вийшли в повній силі, а всі інші зібралися й пішли.\n\nІ все ж Америка не слухала. Навіть коли його привели до найвищої державної посади, американці сховали голову в Канал і вдавали, ніби його там ніколи не було. Невдовзі Бріттон зрозумів, що вони ніколи не слухатимуть, якщо він не змусить їх підвестися й звернути увагу. Коли розхвалені ліберальні опоненти опинилися виметеними до держав, що їх підтримували, стало зрозуміло, що зміни прийшли.\n\nБезсилі засудження вириваються з вуст вихолощеної буржуазії, патріоти волають до іноземних держав, щоб ті пограбували їхню батьківщину, але вони залишаються вигнанцями в Панамі, яка поклоняється своєму президентові як ідолу, що переміг Америку у її власному тилу. Сила довела свою правоту, а їхні сусіди це помітили, тоді як бідні та пригноблені пошепки обговорюють власні плани визволення по всьому континенту." #Amazonist, successful takeover

PAN_Thelma_King_Harrison: "Тельма Кінґ Гаррісон"
PAN_Thelma_King_Harrison_desc: "Коли Кінґ проголосила, що лише тоді, коли панамці наберуться сміливості протистояти американцям, Бог зможе захистити їх, це більше нагадувало крик про допомогу, ніж заклик до дії. Відтоді часи кардинально змінилися.\n\nНаполовину науковиця, наполовину революціонерка та на повну ставку скалка в оці режиму Ремона, життєвий шлях Тельми Кінґ повернув у бік Гавани після повалення диктатора Батисти. Кастро та його політика стали прикладом для всіх майбутніх революціонерів Латинської Америки, і Кінґ вирішила зайняти місце в першому ряду, працюючи над тим, щоб стати головною підбурювачкою до змін.\n\nПрацюючи в місцевих для Панами повстанських лівих рухах, Кінґ взяла на себе роль ефективної організаторки та ораторки, здатної діяти як на передовій, так і за лаштунками, навіть якщо інші відігравали більш центральну роль. Хоча її зв'язки з Гаваною були добре відомі, ходили чутки про зв'язок із ФБР, який нікуди не привів, але ніколи не був повністю спростований. Тим не менш, її робота в партії привела до того, що її почали сприймати як надійну, хоча й досі запальну пару рук.\n\nТепер, керуючи Панамою, Тельма Кінґ пообіцяла перетворити свої колишні слова на дії, оскільки її країна демонструє незалежну позицію. Звичайно, справжня незалежність потребує союзників, головним серед яких є революційна держава Куба. А із союзниками можливе все, навіть накопичення ще більшої кількості союзних держав..."

PAN_OAS_OFN: "Рада управління Панамою"
PAN_OAS_OFN_desc: "§YВРАХОВУЮЧИ§!, що маніакальні амбіції попередніх президентів у прагненні до реваншистських цілей насправді стали причиною краху всього його режиму, джерелом страждань для простих людей і причиною нинішньої прикрої військової присутності в нашій країні;\n\n§YВРАХОВУЮЧИ§!, що сили Організації Вільних Націй та Організації американських держав були великодушно передані в розпорядження народу Республіки Панама, аби забезпечити безпеку та нинішню стабільну ситуацію в регіоні й для тих, хто проживає в Зоні Панамського каналу; та\n\n§YВРАХОВУЮЧИ§!, що панамський народ потребує продовження управління та збереження національного правління доти, доки сили ОВН та ОАД залишаються присутніми та надають допомогу; відтак постановляється\n\n§mВИРІШЕНО§!, що має бути сформована Рада управління Республіки Панама;\n\n§mВИРІШЕНО§!, що склад цієї Ради має становити лідери громад, представники ділових кіл та військові офіцери, які — всередині країни чи іншим чином — виступали проти попереднього режиму у спосіб, що сприяв добробуту Панами та доброзичливим відносинам між усіма державами; та\n\n§mВИРІШЕНО§!, що Рада управління співпрацюватиме з перехідними органами ОВН-ОАД доти, доки їхня присутність буде потрібна в Республіці Панама."
