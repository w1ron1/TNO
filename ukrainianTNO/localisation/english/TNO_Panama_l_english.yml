 PAN_Back_Protests_tt: "\n§F...а ми тут, щоб додати жару у вогонь.§!\n§YМи вирішимо підтримати та перетягнути на свій бік §Mпротестувальників§! під час §xзаворушень у День мучеників.§!§!\n\n§RЦе радикалізує §hпанамську§! §Lолігархію§!.§!\n§FКонфлікт із §Lними§! дорого нам коштуватиме, але це може наблизити §hПанаму§! до §mОВН...§!§!"
 PAN_Operation_Over: "§YМи зробили все, що могли, час покаже, чи було цього достатньо.§!"
