##News Events##
###############

 PAN_news.0.t: "[Get_newspaper_header]Ремон консолідує владу в Панамі"
 PAN_news.0.desc: "Статус-кво в Панамі зберігся, оскільки Хосе Антоніо Ремон Кантеро, диктатор невеликої центральноамериканської держави, зміг пережити найсерйозніший на сьогодні виклик своїй владі. Нещодавні протести Дня мучеників вивели тисячі панамців на вулиці на знак протесту проти президента Ремона. Зрештою, однак, Ремон зміг пережити бурю й почав реагувати на протести, запроваджуючи жорсткі репресії проти панамських опозиційних партій та діячів у спробі консолідувати свою владу.\n\nХоча Вашинґтон радий, що його людина пережила цю чергову кризу, підтримка Ремона з боку Америки не залишиться без наслідків. Підтримка президентом США Ремона надала сміливості лівій та ліберальній опозиції Америці в Панамі, і цілком імовірно, що подібні настрої поширяться на решту Америк.\n"
 PAN_news.0.a: "Американський ланцюговий пес продовжує гавкати, хай захлинеться своїм повідцем."
 PAN_news.0.b: "Стабільність... Якби ж тільки вона траплялася частіше."

 PAN_news.1.t: "[Get_newspaper_header]Переворот Національної гвардії в Панамі"
 PAN_news.1.desc: "У приголомшливому повороті подій панамська Національна гвардія повалила президента Хосе Антоніо Ремона Кантеру та його уряд у результаті перевороту. Протести Дня мучеників проти президента Ремона сколихнули невелику центральноамериканську державу в останні тижні, і багато хто побоювався, що громадські заворушення на вулицях можуть перерости у повномасштабну революцію. Однак Національна гвардія, схоже, спробувала запобігти такій можливості, відібравши владу в Ремона, розірвавши панамську конституцію та встановивши замість неї цілком автократичний, мілітаризований уряд.\n\nМіжнародна реакція була переважно осудливою через реакційний характер уряду Національної гвардії та подальші репресії проти панамської опозиції, хоча реакція Сполучених Штатів була здебільшого стриманою.\n"
 PAN_news.1.a: "Поліцейських націй позбавили їхнього становища."
 PAN_news.1.b: "Якщо при владі правильний банановий диктатор, цей розвиток подій може бути не такою вже й катастрофою."

 PAN_news.2.t: "[Get_newspaper_header]Ремон падає, Аріас перемагає на виборах у Панамі"
 PAN_news.2.desc: "Національна патріотична коаліція та її лідер Арнульфо Аріас перемогли на президентських виборах у Панамі. Попередній президент країни, Хосе Антоніо Ремон Кантеро, вирішив не балотуватися на переобрання, попри підтримку Сполучених Штатів, з огляду на заворушення, спричинені протестами проти його уряду в останні тижні. Аріас та його CPN скористалися вакуумом влади, пробившись до влади.\n\nАріас, відвертий націоналіст, є критиком впливу Сполучених Штатів у Центральній Америці, а його противники звинувачують його в прихованому фашизмі. Новий президент зосередиться на консолідації свого контролю над країною, почавши з обмеження впливу Національної гвардії, на який Аріас давно нарікав у панамській політиці."
 PAN_news.2.a: "Чи повертається приплив проти ОВН у Центральній Америці?"
 PAN_news.2.b: "Сіль на рану так близько від дому."

 PAN_news.3.t: "[Get_newspaper_header]Диктатура Панами згасає, демократизується"
 PAN_news.3.desc: "Національна ліберальна партія перемогла на президентських виборах у Панамі. Хоча існували припущення, що попередній президент країни, Хосе Антоніо Ремон Кантеро, вирішить не визнавати результати виборів, якщо вони будуть не на його користь, Ремон публічно визнав перемогу PLN. Реакція Ремона, ймовірно, стала результатом тиску, який Сполучені Штати чинили на нього, щоб він прийняв результати виборів.\n\nНовий ліберальний уряд прийшов до влади на хвилі широкого обурення Ремоном після подій протестів Дня мучеників, які сколихнули невелику центральноамериканську державу. Однак панамська опозиція оскаржила результати виборів через тісне зближення PLN із Вашинґтоном."
 PAN_news.3.a: "Приплив повертається на користь ОВН."
 PAN_news.3.b: "Перемога демократії."

 PAN_news.4.t: "[Get_newspaper_header]Диктатура Панами усунена від влади"
 PAN_news.4.desc: "Протести Дня мучеників, які переслідували Панаму протягом останніх місяців, завершилися насильством: народна революція повалила президента Хосе Антоніо Ремона Кантеру та сформувала новий лівоорієнтований уряд.\n\nНовий лідер Панами, відомий соціяліст Флойд Бріттон, пообіцяв демократизацію та демонтаж економічних картелів, що панують у країні, як частину своєї урядової програми. Що ще більше непокоїть, його партія, PPP, продемонструвала чітку антиамериканську позицію, породивши нове джерело занепокоєння щодо майбутнього атлантичної торгівлі.\n\nМіжнародна реакція була переважно осудливою, оскільки новий режим намагався знайти партнерів у регіоні. Панама та світ затамували подих, очікуючи, якою буде відповідь Сполучених Штатів.\n"
 PAN_news.4.a: "Ще кілька тижнів — і марксисти вечерятимуть у Каналі..."
 PAN_news.4.b: "Наша невдача, а тепер і наш безлад, який нам прибирати."

 PAN_news.5.t: "[Get_newspaper_header]ОАД втручається в кризу Панамського каналу"
 PAN_news.5.desc: "Після місяців ескалації напруженості між Сполученими Штатами та Панамою між ними спалахнув відкритий конфлікт, коли націоналістичний уряд Панами захопив контроль над Панамським каналом. Оголосивши захоплення Панами незаконним і порушенням суверенітету ОВН, Сполучені Штати санкціонували розгортання ІСМФ, щоб усунути націоналістичний режим від влади та повернути контроль над Каналом під управління Вашинґтона.\n\nСуперечки навколо цього рішення відчуваються по всій сфері впливу ОВН, оскільки американським союзникам важко сформулювати розгортання ІСМФ США в Панамі так, щоб достатньо приховати очевидний американський імперіалізм у спробі повернути Канал, попри технічну законність американського втручання."
 PAN_news.5.a: "Ще й ста років не минуло, а чоботи янкі знову в панамській багнюці."
 PAN_news.5.b: "Це довелося зробити."

 PAN_news.6.t: "[Get_newspaper_header]Диктатура Панами згасає, демократизується"
 PAN_news.6.desc: "У приголомшливому повороті подій у Латинській Америці підтримуваний Америкою режим у Панамі на чолі з президентом Хосе Ремоном зазнав краху через його нездатність заспокоїти опозиційні рухи на тлі нинішньої економічної кризи. Панамська диктатура впала під натиском народних протестів, посилених відсутністю доступу до американської нафти. Ремон утік у вигнання, а опозиційні протестувальники захопили ключові державні установи, проголосивши нову еру революційної Панами.\n\nПісля падіння Coalición Patriótica Nacional негайно відбулися загальнонаціональні вибори, на яких прогресивна та антиамериканська Partido del Pueblo de Panama здобула перемогу. На чолі з президенткою Тельмою Кінґ Панама тепер дивиться в бік Мексики та інших незалежних держав, відкидаючи американський вплив."
 PAN_news.6.a: "Ми втрачаємо півкулю..."
 PAN_news.6.b: "Ще одна нація звільняється від кайданів імперіалізму"
 PAN_news.6.c: "Ще один американський пішак падає"

 PAN_news.7.t: "[Get_newspaper_header]Полковник Торріхос бере контроль над Панамою"
 PAN_news.7.desc: "Панамська Національна гвардія, яка давно відіграє роль у політиці цієї центральноамериканської держави, знову втрутилася. Захопивши Палац чапель та ключові позиції в столиці, гвардія схопила лідера Панами в місцевому кінотеатрі. Відносний спокій американських сил у сусідній Зоні каналу та ворожість попередньої адміністрації до присутності американців породили широкі чутки про те, що Вашинґтон спровокував переворот.\n\nПолковник Омар Торріхос, приземлений випускник Школи Америк, проголосив себе новим лідером Панами й заявив, що правитиме «для бідних, а не для власників». Аналітики припускають, що використання Торріхосом націоналістичної та егалітарної риторики має створити основу легітимності, незалежну від його американських покровителів."
 PAN_news.7.a: "Трохи непокоїть, але принаймні Канал у безпеці."
 PAN_news.7.b: "Вашинґтон знайшов підлабузника з характером."
 
 PAN_news.8.t: "[Get_newspaper_header]Сполучені Штати поступаються Зоною Панамського каналу"
 PAN_news.8.desc: "У знаковому рішенні зовнішньої політики Сполучені Штати поступилися Панамі Зоною Панамського каналу. П’ятимильна смуга навколо Каналу давно була осередком напруженості в центральноамериканській державі, особливо після «Дня мучеників» у 1964 році, коли панамців розстріляли американські війська, дислоковані в Зоні.\n\nПоступка виявилася надзвичайно суперечливою всередині Сполучених Штатів, оскільки необхідна підтримка в Сенаті була забезпечена лише з незначною перевагою після тимчасових винятків для певних військових об’єктів та різноманітних гарантій безпеки й торгівлі щодо самого Каналу. Однак по всій Латинській Америці реакція була радісною — давня суперечка з Вашинґтоном нарешті отримала рішуче вирішення. І ніде святкування не було масштабнішим, ніж у самій Панамі, де громадяни з прапорами та мейоранами ринули на землю, яку вважають своєю.\n"
 PAN_news.8.a: "Обміняти Зону на країну. А можливо, й на континент."
 PAN_news.8.b: "Возз’єднання розділеної землі."
 PAN_news.8.c: "Слабкість, що маскується під великодушність."
 PAN_news.8.d: "Шрам від Каналу починає загоюватися."
 
 PAN_news.9.t: "[Get_newspaper_header]Панама вторгається до Зони каналу"
 PAN_news.9.desc: "Уряд Панами захопив Зону каналу, що проходить через країну. Ця п’ятимильна смуга навколо Каналу містить численні військові об’єкти США, але більшість членів гарнізону вирішили здатися, а не протистояти переважаючим силам.\n\nПоставлений перед цим доконаним фактом і перенапружений через кризу, що розгортається, Сполучені Штати не вдалися до збройної відповіді. Багато хто всередині країни засудив уявну слабкість адміністрації, а союзники висловили серйозне занепокоєння через удар по геополітичним позиціям ОВН.\n\nУ Панамі та значній частині Латинської Америки реакція була бурхливою, оскільки досі суперечливий уряд досяг успіху у своїй найсміливішій авантюрі.\n"
 PAN_news.9.a: "Рузвельт перевертається у своїй могилі."
 PAN_news.9.b: "Неймовірна перемога в Холодній війні."
 PAN_news.9.c: "Чапля чекала свого моменту, щоб завдати удару."

 PAN_news.10.t: "[Get_newspaper_header]Панама приєднується до ОВН"
 PAN_news.10.desc: "На церемонії у Вашинґтоні держава Панама стала новоспеченим членом Організації Вільних Націй. Цей крок став результатом багаторічної дедалі тіснішої співпраці між правлячою Ліберальною партією та урядом США після заворушень Дня мучеників через американське володіння Панамським каналом.\n\nКритики розкритикували церемонію як таку, що лише закріплює величезний вплив Америки на центральноамериканську державу, посилаючись на широко поширену корупцію в панамському уряді та вигідні зв’язки між американськими бізнесменами й багатьма панамськими олігархами та політичним класом. Однак прихильники альянсу вважають, що орієнтація Панами дозволить Америці підтримувати мир у регіоні та сприяти поширенню демократії. Інші висловлювали думку, що зближення має дозволити швидше відновити панамське володіння Каналом.\n"
 PAN_news.10.a: "Ми з нетерпінням чекаємо на співпрацю з ними!"
 PAN_news.10.b: "Говорять, мов леви, а поводяться, мов вівці."
 PAN_news.10.c: "Лише дурень очікуватиме, що Америка дотримається своїх обіцянок."
 PAN_news.10.d: "Ще один кілок встановлено."
