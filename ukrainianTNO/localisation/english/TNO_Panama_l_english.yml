#Characters#
PAN_Jose_Remon_Cantera: "José Antonio Remón Cantera"
PAN_Jose_Remon_Cantera_desc: "Коли Вашинґтон уперше розділив перешийок, він вирішив не встановлювати колоніальне правління, як це було зроблено в Пуерто-Рико, віддавши перевагу контрольованому безладу. Однак панамська політика та Канал зрештою привели до влади Хосе Антоніо Ремона Кантера, американського поліцейського Панами.\n\nМаловідома постать до вступу до панамських сил безпеки, Ремон приєднався до них у найскладніший для них період, спустошений Великою депресією. На тлі американських побоювань щодо проникнення країн Осі панамцю вперше дозволили очолити Національну поліцію. Ремона призначили через те, що він був єдиним кандидатом, який навчався у військовій академії.\n\nПрийшовши до влади, він підлаштував демократію Панами під себе, фальсифікуючи вибори та здійснюючи перевороти проти президентів на своє та американське благо. Після того як він знову повалив Аріаса за спробу обмежити вплив поліції, Ремон вирішив, що впливати на політику Панами з-за лаштунків недостатньо, і сам став президентом.\n\nВідтоді він вніс зміни до конституції, обіймав посаду протягом кількох термінів та пережив спробу замаху у 1955 році. Ніхто не наважується виступити проти нього після того, як він наказав убити одного зі своїх віцепрезидентів, Хосе Рамона Ґуїсадо, підозрюваного у змові з метою замаху. Він володіє абсолютною владою за рекордно низького рівня опору, проводячи прогресивні та націоналістичні реформи, доки вони не надто сильно не дратують Америку чи олігархію.\n\nЗа умови подальшої підтримки Америки Ремон, імовірно, правитиме Панамою ще десятиліття, якщо не станеться чогось радикального."
king_maker_remon: "Творець королів"

#Democratic Path
PAN_Roberto_Chiari_Ramon: "Роберто Франсіско К'ярі Ремон"
PAN_Roberto_Chiari_Remon_desc: "Чи доля, а не праця та потрясіння, зрештою визначає наше місце в суспільстві? Для такого чоловіка, як К'ярі, припустити протилежне видається абсурдним, адже його шлях до президентства, схоже, був визначений вищими силами.\n\nСин Родольфо К'ярі, колишнього президента, Роберто Франсіско К'ярі Ремон мав щастя отримати престижну посаду в компанії свого батька. Серед його численних братів лише він зацікавився іншим бізнесом свого батька — політикою. Природжений ліберал, він уже у тридцять років був міністром, а у сорок — виконувачем обов'язків президента, перш ніж його піднесення було стрімко зупинене.\n\nЗахоплення влади полковником Ремоном, можливо, зупинило Аріаса, але воно також зупинило його просування далі за лідерство лібералів, адже спорідненість із полковником як із двоюрідним братом означала, що цьому угрупованню можна було дозволити деякі невеликі поблажки за нового режиму. Тож К'ярі залишився напризволяще, намагаючись переконати американських політиків, що Ремон нежиттєздатний, що було доведено в День мучеників.\n\nЗберігаючи владу в безпеці від головорізів з обох боків, американська підтримка демократії дозволила К'ярі та його лібералам знову взяти під контроль сильних правителів. Тепер його завдання — зберегти цей важко здобутий мир та всі опори, що його підтримують, щоб інший Ремон не зміг зробити собі ім'я."
PAN_Aquilino_Boyd: "Акіліньо Бойд"
PAN_Aquilino_Boyd_desc: "Якщо політика — це лише витонченіша форма війни, тоді Акіліньо Бойд — варвар, що засипає своїх опонентів шквалом судових позовів і погроз. Адже коли йдеться про націю, жодної пощади її ворогам бути не може.\n\nСпадкоємець мантії правлячого класу, Бойд здобув освіту в Америці під опікою приватного католицького коледжу, а його освіта забезпечила йому дипломатичну посаду достатньої важливості, щоб представляти Панаму в Америці. Його час в Америці був затьмарений пікантними чутками про пияцтво та схильність до насильства, які завдяки дипломатичному імунітету було замітено під килим.\n\nЧутки так і не дійшли до нього додому повною мірою — за допомогою здорової дози юридичних погроз — що дозволило йому зробити собі ім'я в політиці як невтомному захиснику панамських інтересів, увійшовши до асамблеї під націоналістичними гаслами. Після усунення Аріаса його прихильники поступово почали сприймати Бойда як заміну йому, оскільки зростало невдоволення уявною поступливістю лібералів щодо американського імперіалізму.\n\nЗа його президентства дехто вважає, що Панама зробила крок назад до сильних правителів, але його прихильники вважають, що вони зробили крок уперед, щоб знову зробити свою націю цілісною. Для них Ремон і К'ярі були кімнатними песиками, а Бойд має необхідну силу, щоб змусити Америку стати на коліна та повернути те, що завжди належало їм."
PAN_Aquilino_Boyd_canal_desc: "Якщо політика — це лише витонченіша форма війни, тоді Акіліньо Бойд — варвар, що засипає своїх опонентів шквалом судових позовів і погроз. Він боровся, він перемагав, і його нація є його здобиччю.\n\nСпадкоємець мантії правлячого класу, Бойд здобув освіту в Америці під опікою приватного католицького коледжу, а його освіта забезпечила йому дипломатичну посаду достатньої важливості, щоб представляти Панаму в Америці. Його час в Америці був затьмарений пікантними чутками про пияцтво та схильність до насильства, які завдяки дипломатичному імунітету було замітено під килим.\n\nЧутки так і не дійшли до нього додому повною мірою — за допомогою здорової дози юридичних погроз — що дозволило йому зробити собі ім'я в політиці як невтомному захиснику панамських інтересів, увійшовши до асамблеї під націоналістичними гаслами. Після усунення Аріаса його прихильники поступово почали сприймати Бойда як заміну йому, оскільки зростало невдоволення уявною поступливістю лібералів щодо американського імперіалізму.\n\nЗа його президентства Панаму знову зроблено цілісною, проте вулиці тихі. Шампанське роздається друзям у їхні вихідні, оплачене працею та кров'ю, тоді як її громадян приборкують націоналізмом. Є навіть прохолодне прийняття, коли Бойд починає свій другий термін, і новий сильний правитель робить собі ім'я."
PAN_David_Samudio_Avila: "Давід Самудіо Авіла"
PAN_David_Samudio_Avila_desc: "Чи може справжня зміна виникнути із системи, якою керують люди, чий обраний ними інститут дедалі більше нагадує цвинтар? Самудіо знає відповідь, і все ж продовжує працювати, щоб довести самому собі протилежне.\n\nПерший представник нової породи панамського політичного класу, Давід Самудіо Авіла — не один із позолоченої еліти, наперед визначеної для керування народом, а людина, яка виборола собі право нести цей тягар. На відміну від своїх попередників, Авіла походить із середнього класу — тих, хто достатньо спроможний заглянути на стіл, але не сісти за нього. Заробляючи на життя інженером, він так би й прожив своє життя, якби не ліберали.\n\nАвіла приєднався до партії як спосіб запропонувати єдину законну, хоча й мінімальну, форму опозиції чинному диктаторському режиму. Він був обраний депутатом асамблеї вчасно, щоб забезпечити демократію після падіння Ремона, ставши міністром як мирний жест робітничим та аграрним групам. Роблес залишив його на посаді та вважав достатньо прихильним, щоб залишити кандидатуру лібералів йому.\n\nЗ ослабленням консервативних груп кандидатура Авіли зустріла мало опозиції, дозволивши йому без труднощів зайняти президентське крісло. Будучи реформаторською постаттю, Авіла тепер намагається поступово підштовхнути Панаму до автентичнішої демократії, навіть якщо знає, що чотирьох років роботи буде далеко недостатньо. Та й його колеги-ліберали не дозволять йому зробити це без боротьби."
PAN_Marco_Aurelio_Robles: "Марко Авреліо Роблес"
PAN_Marco_Aurelio_Robles_desc: "Там, де К'ярі зміг завоювати серця народу, Роблес завоював кишені олігархів — людина, що нагадує про «старі добрі часи», коли політика була більш приватною справою.\n\nНароджений у привілейованому класі, він із відзнакою навчався в Панамському університеті — тому самому університеті, ректором якого був його дід. Після цього та навчання в Сорбонні він піднявся кар'єрними сходами, завершивши свій шлях на посаді генерального директора Національного банку Панами. Ця посада значно допомогла йому перейти в політику, сприяючи його обранню парламентським депутатом від лібералів.\n\nТісно співпрацюючи з К'ярі, Роблес відповідав за заспокоєння побоювань заможних верств, допомагаючи повідомити їм про план переходу між режимами так, ніби вони переміщували активи. На знак подяки за його роботу К'ярі зробив його міністром юстиції — на ту саму посаду, яку його батько обіймав у кабінеті К'ярі-старшого — із запевненнями олігархам, що Роблес стане його призначеним наступником.\n\nТепер, коли вибори позаду й без К'ярі, Роблесу залишається завдання правити народом. Непоказна постать, що говорить повільно й протяжно, він має зберігати класи на своїх місцях і підтримувати мир з Америкою. Все інше — завдання для міністрів, аби тільки човен не хитався."
#Army Path
PAN_Arnulfo_Arias: "Арнульфо Аріас Мадрид"
PAN_Arnulfo_Arias_desc: "Якщо коли-небудь існував справжній панамський націоналіст, то ним є Арнульфо Аріас — самотній політичний голос над традиційною олігархією та сильними правителями, які надто довго панували над його батьківщиною.\n\nНароджений у родині, глибоко зануреній у політику, Арнульфо міг лише озиратися на їхню історію, щоб побачити, що потенційно може на нього чекати, а такий славетний поклик виявився для нього непереборним. Його raison d'etre на політичній арені Панами став канал — шрам, що пролягав через усю їхню націю, таврований американським прапором, наче худоба, якою вони були.\n\nСаме ця справа спонукала його разом із братом заснувати Panameñista Party. Разом вони здобули кілька перемог над домінантною Ліберальною партією, але олігархія завжди була на крок попереду. Коли Арнульфо вперше став президентом у 1941 році, вони організували його усунення за допомогою поліції, повторивши це знову, коли його переобрали у 1951 році.\n\nЦей досвід дав Аріасу чітко зрозуміти: якщо він хоче чогось досягти — зробити серйозну різницю в житті пересічного панамця — цю ракову пухлину на політичному тілі, відому як Національна поліція, необхідно викорінити. Нині його можуть називати авторитарним, але майбутнє йому подякує." #Baseline NatCon
PAN_Arnulfo_Arias_aristocratic_desc: "Арнульфо Аріаса описують як президента Панами, патріота, захисника, змовника та паразита. Ці слова мало важать для самого чоловіка, задоволеного тим, що він знає себе майже так само добре, як знає, що змушує Панаму працювати.\n\nАдже якби він не знав, що змушує Панаму працювати, як він чотири рази був би обраний на її найвищу посаду? Ліві можуть протестувати, що народ хоче бути сам собі господарем, поводитися як виконроб і загнати країну в землю, роздаючи подачки кожному ледацюзі, який підніме руку. Ліберали стверджують, що це їхнє право утримувати владу, протестуючи, що саме вони заснували державу.\n\nОднак Аріас розуміє, що кожна сторона має частку правди у своїх твердженнях. Народ справді хоче революції, але національної революції, яка звільнить його від американського імперського розриву на перешийку. Так само існує потреба у визначній групі патріотів, які керуватимуть своєю країною без втручання, просто не тих, хто відданий лише долару.\n\nЦе ті чесноти, які Аріас понесе із собою у свій наступний президентський термін — чоловік, якого обожнюють його віддані виборці та якого в рівній мірі ненавидять його вороги у переповнених в'язницях. Свого часу навіть Вашинґтон дізнається про всю міру його люті."
PAN_Arnulfo_Arias_fascist_desc: "Під час свого останнього приходу до влади дехто міг би сказати, що Арнульфо Аріас — доказ того, що старий пес може навчитися нових трюків, але вони дуже помилялися б. Це його природна форма, розкрита після десятиліть маскування.\n\nКоли Арнульфо вперше був направлений до Італії як дипломат, він виявив, що фашизм йому пасує, додавши сталі рукавичці, якої бракувало президентським термінам його брата. Після його обрання проєкт конституції 1941 року — який обіцяв позбавити небілих панамців права голосу та громадянства — виявився надто далекосяжним кроком для Вашинґтона, який і без того з підозрою ставився до його проґерманських симпатій.\n\nПовалений внаслідок підтриманого Америкою перевороту, Арнульфо знову зіткнувся з викликом своєму переобранню у 1948 році, коли Ремон здійснив переворот, щоб зберегти зоряно-смугастий прапор над Каналом. І тому він чекав, спостерігаючи, поки хватка Америки не почала слабшати. Коли це сталося, сформувалася нова залізна хватка — загартована сила, яка вимагала Панаму лише для панамців. Ця хватка привласнила всю Панаму, цілком і повністю.\n\nСьогодні Панама незалежна, якщо не вільна. Вона краща за вільну — вона впорядкована, їй надано порядок там, де панувала лише янкійська жадібність. Їхній порядок чистий, вільний від шрамів минулого та готовий до великих днів їхньої майбутньої історії."
PAN_Omar_Torrijos: "Омар Торріхос Еррера"
PAN_Omar_Torrijos_desc: "Є честь бути поліцейським, честь виконувати накази та знати своїх вищих. Менше честі в тому, щоб грати актора. Омар Торріхос знаходить компроміс між обома своїми ролями.\n\nТорріхос завжди вмів вчасно помітити можливість, знаходити шляхи повз перешкоди... прослизати. Життя в Панамі зробило такі навички необхідною умовою виживання, особливо після захоплення влади Ремоном. Його перша велика можливість з'явилася у вісімнадцять років, коли він отримав військову стипендію, що прискорила його просування офіцерськими званнями, чому сприяла його дружба з товаришем-офіцером Борисом Мартінесом.\n\nЙого друга можливість прийшла через Школу Америк — нібито суто освітній шлях, але такий, що привернув увагу американських фахівців із Панами. Для них він був чистим полотном, повним водяним знаком із зоряно-смугастим прапором. Торріхос не відкинув їхніх залицянь, прийнявши їхні гроші, а потім їхні накази. Інші в його колах були так само податливими, складаючи свій прапор і повертаючи Панаму під владу зброї... або просто іншого типу зброї.\n\nКоли Торріхос проголошує зі сцени, попередній режим був боягузливим і слабким, тоді як новий президент уособлює силу та єдність. Його сила зростає зі швидкістю біржового тикера Волл-стріт, тоді як єдність знаходять через відсутність розколу, адже всі, хто здатен розділити, залишили Панаму літаком або в мішку для трупів."
PAN_Omar_Torrijos_puppet_desc: "Є честь бути поліцейським, честь виконувати накази та знати своїх вищих. Менше честі в тому, щоб грати актора. Омар Торріхос знаходить компроміс між обома своїми ролями.\n\nТорріхос завжди вмів вчасно помітити можливість, знаходити шляхи повз перешкоди... прослизати. Життя в Панамі зробило такі навички необхідною умовою виживання, особливо після захоплення влади Ремоном. Його перша велика можливість з'явилася у вісімнадцять років, коли він отримав військову стипендію, що прискорила його просування офіцерськими званнями, чому сприяла його дружба з товаришем-офіцером Борисом Мартінесом.\n\nЙого друга можливість прийшла через Школу Америк — нібито суто освітній шлях, але такий, що привернув увагу американських фахівців із Панами. Для них він був чистим полотном, повним водяним знаком із зоряно-смугастим прапором. Торріхос не відкинув їхніх залицянь, прийнявши їхні гроші, а потім їхні накази. Зрештою, йому навіть не довелося натискати на спусковий гачок — він вийшов із руїн як таємний дисидент, готовий очолити Панаму, більш прийнятну для Америки.\n\nКоли президент Торріхос говорить, його промови звучать як накази, але ніколи не його накази. Можливо, він таємно сподівається отримати шанс віддавати власні накази, але такий день здається далеким. Видимість влади прийшла ціною влади, і тому Торріхос мусить продовжувати чекати."
PAN_Boris_Martinez: "Борис Мартінес"
PAN_Boris_Martinez_desc: "Є речі, що стоять над політикою. Речі надто священні, щоб залишати їх у руках кар'єристів. На жаль, націю не вважали однією з таких речей, але тепер — більше ні.\n\nСправу Панами тепер відстоює один Борис Мартінес, солдат до кінчиків пальців. Його дорослішання припало на правління Ремона — людини, яка зовні демонструвала силу, але була не більше ніж кімнатним песиком Америки. Навчання в Героїчній військовій академії в Мексиці лише посилило приховану неприязнь до сюзерена Панами, джерела їхньої ліберальної слабкості.\n\nПротести в День мучеників лише закріпили цей погляд, адже Ремон міг лише віддавати накази, наче огрядний слимак, зіпсований і запаморочений американським опіумом. Останньою краплею стала його спроба передати владу Аріасу — постаті, гідній ще більшої ненависті, ніж Ремон. Потрібне було моральне рішення — моральна революція — щоб стерти минуле начисто, щоб навчити дисципліни.\n\nУ наступні роки вони дякуватимуть йому, для нього будуть почесні місця. Сьогодні є лише обов'язок, робота із заміни банок Coca Cola на моральний стрижень. Вашинґтон може спостерігати, а вони спостерігатимуть за американськими володіннями. І незабаром найбільша з усіх несправедливостей буде помщена."
