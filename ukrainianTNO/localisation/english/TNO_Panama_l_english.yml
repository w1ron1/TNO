 PAN_forpol.1.t: "День мучеників"
 PAN_forpol.1.desc: "Телефонний дзвінок надійшов одразу після опівночі, і хоча посол Фарленд очікував на нього, сама сила гніву президента Ремона застала його зненацька.\n\n"Ваші хлопці думають, що Панама — це майданчик для ігор!" — гаркнув він. "Вони штовхають наших людей у Колоні, розмахують гвинтівками так, ніби їм належить цей клятий Канал, а ви очікуєте, що я продовжуватиму посміхатися й махати рукою?"\n\nХоча лють душила його слова, досвідчений посол вловив прихований відтінок страху. Ремон поставив своє політичне майбутнє на співпрацю зі Сполученими Штатами, але кожен інцидент підривав його авторитет серед народу, а ще небезпечніше — серед Національної гвардії. Цей націоналізм, колись його найбільший політичний інструмент, тепер був зарядженою рушницею, притиснутою до його власної спини. Фарленд відповів своїм звичним спокійним тоном.\n\n"Ми розуміємо ваші занепокоєння. Я поговорю з командиром бази. Ми обоє хочемо стабільної, процвітаючої Панами, чи не так? Це був лише одноразовий інцидент, ви ж знаєте, якими можуть бути солдати. Для сімей буде виділено деякі додаткові кошти, усе владнається як слід. "\n\nАле коли він поклав слухавку, думки Фарленда були вже далеко. Ремон був корисним, але нестабільним. Якщо заворушення посиляться, або, що ще гірше, якщо сильний правитель втратить олігархів — а це була єдина причина, через яку його взагалі терпіли, — чи не повернуться інші надмірності його адміністрації, щоб вкусити Вашинґтон за дупу? Уже зараз він міг бачити якогось вискочку-молодого журналіста, який винюхував чутки про брудну білизну ФБР. Можливо, просто можливо, настав час почати закладати основу для іншого шляху. Зрештою, не Ремон насправді правив у Панамі, а "демократизація" була дуже потужним методом спускати політичне обурення в каналізацію."
 PAN_forpol.1.a: "Він був корисним досі. З трохи більшим важелем він буде ще кориснішим."
 PAN_forpol.1.b: "Прибирайте тут, хлопці. Ми закінчили."

 PAN_forpol.2.t: "Усе вже вирішено"
 PAN_forpol.2.desc: "Від: Управління у справах Центральної Америки\nМеморандум для директора\nВиконавчий розвідувальний звіт: Ремон консолідує владу\n\nПісля участі Бюро під час протестів у День мучеників та подальших заворушень ситуація на місцях у Панамі стабілізувалася. Як і передбачалося, обмежена, але вчасна підтримка дозволила президенту Хосе Ремону Кантері відновити контроль над силовим апаратом і нейтралізувати ключових опозиційних діячів напередодні запланованого голосування. Агенти змогли проникнути до офісів опозиції та перенаправити занепокоєння щодо протоколу й процедури таким чином, щоб зробити їх неефективними.\n\nВибори відбулися з мінімальним втручанням з боку конкуруючих діячів або іноземних сторін із Пакту чи Сфери спільного процвітання. Переобрання президента Ремона було успішно проведене за підтримки Гвардії та з мінімальним доступом іноземних ЗМІ. Наші канали повідомляють, що моральний стан у його найближчому оточенні стабільний, хоча параноя залишається високою. Після закріплення своєї позиції Ремон швидко розпустив або поглинув опозиційні профспілки, перевів дисидентських офіцерів на інші посади та посилив свій контроль над правовою системою. Пресові видання, позначені як "ненадійні", зазнали посиленого контролю або закриття, що також допомогло не допустити до Панама-Сіті американські видання, які не дотримуються нашої взаємної угоди.\n\nЧлени ОАД та ОВН висловили занепокоєння, але політика США залишається невизначеною, а достатніх доказів, що пов'язують Бюро з перемогою Ремона, немає. На момент написання цього звіту Бюро зберігає активний вплив на керівництво Гвардії та будь-яких потенційних організаторів іншого перевороту. Ремон дотримувався своєї частини домовленості. Наразі його цінність як активу залишається високою."
 PAN_forpol.2.a: "Вірність, хоробрість, чесність."

 PAN_forpol.3.t: "Лавина через двадцять років"
 PAN_forpol.3.desc: "Від: Управління у справах Центральної Америки\nМеморандум для директора\nВиконавчий розвідувальний звіт: Зростання авторитарних дій у Панамі\n\nПанама-Сіті продовжує дедалі глибше занурюватися в авторитаризм. Хоча раніше [PAN.GetLeader] обмежувався прихованими засобами забезпечення влади, тепер їх більше не вважають достатніми. За наказом панамської адміністрації Національну ліберальну партію, головну політичну опозицію в Панамі, було заборонено, її лідерів ув'язнено, а активи націоналізовано як останню спробу придушити національних дисидентів.\n\nПереважно партія проамериканських, про-ОВНівських, ліберально налаштованих еліт, Національні ліберали побачили, як їхні значні багатства було розподілено між лояльними олігархами та наближеними до уряду Ремона, надавши диктатурі політичну перемогу в очах тих представників вищого класу, що залишилися.\n\nХоча уряд намагався запевнити нашого посла, що це був вимушений крок, позиції Ремона у Вашинґтоні безперечно постраждають. Внутрішня реакція серед панамців середнього та нижчого класів також була переважно негативною, оскільки існує консенсус, що це ще більше виправдовує нещодавні протести в День мучеників і закріплює занепад панамської демократії.\n\nЦей поворот проти уряду неминуче вплине на думку населення про партнерів Панами в ОВН, ОАД і навіть безпосередньо про Сполучені Штати. Можливо, це призведе до переорієнтації решти опозиції — лівоорієнтованої PPP, а також дисидентських націоналістів у Guardia Nacional та CPN — на антиамериканські режими."
 PAN_forpol.3.a: "Вірність, хоробрість, чесність."

 PAN_forpol.4.t: "Переговори щодо Панамського каналу"
 PAN_forpol.4.desc: ""Ви привели мене до влади. Тепер дозвольте мені справді керувати." Президент Хосе Антоніо Ремон Кантера нахилився вперед, не відводячи погляду від американського сенатора, який прилетів сюди для переговорів щодо статусу Зони каналу. Дощ надворі стукав у вікно в ритмі цокання годинника. "Усе, чого ми хочемо, — це часткове управління Каналом, хоча б місце за столом."\n\nОбличчя сенатора залишалося нерухомим, він легенько постукував пальцями по столу. "Президенте Ремон, Вашинґтон розуміє ваше становище. Однак Канал життєво важливий для нашої економіки, нашого флоту та світової торгівлі." Сенатор зняв окуляри, перш ніж витерти їх хустинкою. "Ніхто у Вашинґтоні не святкуватиме відмову від одного з наших найцінніших володінь."\n\n"А як щодо мого народу, сенаторе?" Ремон не міг приховати свого відчаю. "Ми змусили радикалів замовкнути, не пустили комуністів і поставили Панаму в один ряд із вашими ідеалами. Я скажу вам це зараз, сенаторе. Якщо ви відмовите нам у нашому праві на Канал, ви втратите цю країну."\n\nСенатор не поворухнувся. У кімнаті для переговорів зависла важка тиша, яку порушував лише ледь чутний шум дощу. Надворі, за будівлями та вулицями, Канал стояв як свідчення людської винахідливості. Диво світу, прорізане крізь перешийок, можливе лише завдяки праці панамців та американців.\n\nСлова Ремона могли бути попередженням, а не погрозою. Чи вартий Канал того, щоб втратити Панаму?"
 PAN_forpol.4.a: "Розпустити Зону каналу, але зберегти певні важелі впливу."
 PAN_forpol.4.b: "Так, так і є. Решта — проблема Ремона, не наша."
 PAN_Remon_Warning_tt: "§RЯкщо попередження Ремона виявиться правдою, вони швидко стануть і нашими проблемами.§!"
 PAN_Overjoyed_tt: "§GПанамський народ високо оцінить це рішення§!... §RАмериканські ділові кола — ні.§!"

 PAN_forpol.5.t: "Невпинний ремонізм"
 PAN_forpol.5.desc: "ОБМЕЖЕНИЙ ДОСТУП/[?global.date.GetDateStringNoHourLong]\n\nВІД: СЕСІЛ ЛЕНДРІ\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: Розширення влади Ремона в Панамі\n\n1. На цей момент Хосе Антоніо Ремон Кантера переміг усю реальну опозицію своєму режиму. Однак нещодавно він почав намагатися створити місцевий культ особи, потенційно заснований на моделі Сомоси в союзній Нікарагуа. Це навряд чи стане великою проблемою, але може призвести до того, що він стане більш непередбачуваним і, якщо сприйматиме нас як загрозу, антиамериканським.\n\n2. Жодної чіткої програми створення його культу особи немає, але його розвиток усе ж помітний. Кілька людей, близьких до нас і Ремона, відзначили, що останнім часом він став більш параноїдальним. ЗМІ регіону тепер подають його як найвище втілення панамської національності. Спроби визначити власну державну ідеологію перебувають на ранній, але помітній стадії.\n\n3. Хоча в довгостроковій перспективі ці події небажані, безпосередньо вони не становлять значної загрози. Однак уже під час його попереднього терміну були ознаки антиамериканізму, особливо в договорі 1955 року. Позбавлений зовнішнього тиску з нашого боку та дедалі непередбачуваніший, він може почати діяти проти нас."
 PAN_forpol.5.a: "І ПІЗНАЄТЕ ІСТИНУ, І ІСТИНА ЗРОБИТЬ ВАС ВІЛЬНИМИ."

 PAN_forpol.7.t: "Хунта Мартінеса"
 PAN_forpol.7.desc: "Згідно з внутрішнім меморандумом посла Фарленда, діяльність Бюро в Панамі змінилася з огляду на зміни у внутрішній політиці. Після тривалих заворушень після Дня мучеників та зростання суспільного тиску президент Хосе Ремон Кантера був змушений відмовитися від участі в майбутніх виборах. Початкові оцінки вказували на ймовірну перемогу Арнульфо АРІАСА Мадрида, що викликало тривогу в Національній гвардії, серед олігархів і в оцінках Бюро, створюючи можливість різкого збільшення зовнішнього втручання.\n\nНапередодні запланованого голосування полковник Борис МАРТІНЕС Саласар, діючи за підтримки старших офіцерів Гвардії та економічних зацікавлених осіб і за нашої підтримки, оголосив надзвичайний стан і перебрав контроль. АРІАС та кількох опозиційних діячів було взято під варту або поміщено під домашній арешт. Відтоді полковник МАРТІНЕС розпустив виборчу комісію та призупинив конституційні строки.\n\nПублічне виправдання зосереджувалося на загрозі "радикальної дестабілізації", але журналісти міжнародної преси, найімовірніше, представлять цей поворот як спробу зберегти автономію Гвардії та не допустити, щоб популістський цивільний підірвав її становище. МАРТІНЕС не робив вигляду, що дотримується демократії, попри інше, запропоноване радниками Державного департаменту, відкрито заявляючи про намір правити "доти, доки стабільність не буде гарантована", і почав перебудовувати уряд відповідно до постійної військової присутності. Цивільні міністерства залишаються, але керівництво походить від командної ради Гвардії, при цьому конкуренції немає навіть у формі контрольованої опозиції. Видатні представники бізнесу сигналізували про співпрацю, вважаючи хунту кращою за повернення безладу, а новий режим поки що залишається прихильним до діяльності Бюро.\n\nДержавний департамент рекомендує мінімальні публічні коментарі, з чим ми погоджуємося. Якщо МАРТІНЕС виявиться більшою проблемою, ніж він того вартий, інші варіанти залишаються (див. сторінки 23–25 цього звіту)."
 PAN_forpol.7.a: "Сподіваймося, він пам'ятає, хто подарував йому бронзову корону."

 PAN_forpol.8.t: "Панама: оновлення щодо хунти Мартінеса"
 PAN_forpol.8.desc: "ТАЄМНО\n\nВід: ЛЕОНАРД ФРАНКЛІН\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТема: ПАНАМСЬКИЙ УРЯД ОРІЄНТУЄТЬСЯ НА ВОРОЖІ ІНТЕРЕСИ\n\n1. Військовий уряд генерала Бориса Мартінеса посилює контакти з регіональними антиамериканськими лідерами, намагаючись утвердити незалежну зовнішню політику. У поєднанні з дедалі жорсткішою риторикою проти інтересів США очевидно, що це більше, ніж політична риторика, покликана заспокоїти населення: Мартінес прагне відірвати Панаму від американського впливу та приєднатися до інших держав.\n\n2. Джерела HUMINT у Панамі повідомили, що Мартінес уклав закриті угоди з антиамериканськими силами, намагаючись забезпечити постачання зброї, та посилив навчання кількох своїх найбільш елітних і надійних військових підрозділів. Джерела вказують, що найімовірнішою ціллю Мартінеса буде Зона Панамського каналу. Канал є спокусливою здобиччю для Мартінеса, адже він дозволить здобути національний престиж, а також отримувати транзитні збори з кораблів за використання Каналу. Втрата контролю над Каналом матиме значний вплив на військову готовність і спроможність США до розгортання сил, а також завдасть руйнівного удару по економіці США.\n\n3. Влада Мартінеса над країною не є міцною. Опозиційні групи критикують хунту Мартінеса відтоді, як він прийшов до влади, а дефіцит постачання та інші економічні труднощі створили в країні помітний дисидентський рух. Розвідувальні зусилля в регіоні буде спрямовано на дестабілізацію його бази влади з метою забезпечити, щоб Канал залишався в американських руках, і не допустити отримання антиамериканськими силами надійної опори в Центральній Америці."
 PAN_forpol.8.a: "І ПІЗНАЄТЕ ІСТИНУ, І ІСТИНА ЗРОБИТЬ ВАС ВІЛЬНИМИ."

 #Deprecated
 PAN_forpol.11.t: "Антиамериканізм Аріаса"
 PAN_forpol.11.desc: "Останніми днями до Міністерства закордонних справ надходять цікаві пропозиції від дипломатів, пов'язаних із новим панамським урядом президента Арнульфо Аріаса. Хоча Панама загалом уже багато років перебуває під американським ярмом, Аріас, схоже, прагне це змінити.\n\nЗа даними наших джерел у регіоні, під час свого першого терміну він робив кроки для очищення Панамської національної гвардії, традиційного осередку проамериканізму (поза будь-яким очевидним військовим потенціалом), від таких елементів. Ті, кого було усунуто, повсюдно замінювалися значно менш проамериканськими людьми. Ця тенденція також спостерігається в багатьох інших державних та урядових установах Панами.\n\nСам Аріас прагнув показати себе панамським націоналістом, відданим країні та народу, що є привабливим для широких верств населення. Однак він чітко дав зрозуміти, що більш ніж готовий працювати з нами — або потенційно з іншими, якщо ми не відреагуємо, — щоб усунути американський вплив і переорієнтувати свою націю. Вважається ймовірним, що в обмін на це він захоче особистого збагачення або прямої підтримки для зміцнення своєї влади. Або, що ще ймовірніше, і того, й іншого.\n\nЯкщо ми хочемо скористатися цією можливістю, ми повинні діяти швидко. Американці безперечно вже помітили дії Аріаса, і вони не стоятимуть мовчки, поки стратегічно життєво важлива для них держава, як-от Панама, виходить з їхньої орбіти."
 PAN_forpol.11.a: "Нове вирівнювання."

 PAN_forpol.12.t: "Аріас завдає першого удару"
 PAN_forpol.12.desc: "Коли протести в День мучеників досягли свого апогею, було, мабуть, лише питанням часу, коли регіональний гравець скористається хаосом для просування власного порядку денного, особливо якщо це означало шанс ударити по американських інтересах у Панамі. Оскільки вимоги протестувальників, щоб Ремон не балотувався на переобрання, зв'язали уряду руки, більшість голосів неминуче мала опинитися в руках антиамериканського агітатора.\n\nЦим агітатором став новий президент Аріас і CPN, які не гаяли часу, перетворюючи погане на ще гірше. Майже одразу після приходу до влади в Панама-Сіті Національна гвардія опинилася в облозі нерегулярних воєнізованих формувань. За мовчазного схвалення Аріаса та за підтримки CPN націоналістичні ополченці проводили спільні атаки на впливових військових діячів разом із будь-якою партійною опозицією.\n\nЦей переворот через виборчу урну є таким самим лихом для американської зовнішньої політики, як і для панамської демократії, прокладаючи карту майбутніх подій, оскільки американський суверенітет над Панамським каналом опиняється під безпосередньою загрозою. Минеться певний час, перш ніж режим Аріаса буде повністю консолідований, а військові опиняться під його впливом, але ціль іредентизму CPN очевидна для всіх."
 PAN_forpol.12.a: "Вогонь дістається Каналу."

 ### REWRITE ME
 PAN_forpol.13.t: "Антиамериканізм Аріаса"
 PAN_forpol.13.desc: "Після падіння Ремона в Панамі наш вплив у країні ослаб за рік відтоді, як Арнульфо Аріас прийшов до влади. Присвятивши свій перший термін викоріненню політичного впливу Національної гвардії, Аріас також доклав усіх зусиль, щоб замінити старших і досвідченіших офіцерів власними лояльними посіпаками.\n\nПанамська національна гвардія, одна з найбільш проамериканських фракцій у політиці країни, була серйозно ослаблена за режиму Аріаса. Кілька високопоставлених офіцерів, особливо генерал Болівар Вальяріно, були звільнені зі своїх посад у Панамській національній гвардії через їхню лояльність до Америки та опозицію до Аріаса. Однак кільком проамериканським офіцерам вдалося уникнути чисток, і вони можуть виявитися корисними, якщо ми розглядатимемо наші запасні плани.\n\nКрім того, уряд Аріаса зробив дружні пропозиції іноземним державам, що мають вплив у регіоні. Він прямо заявив про намір переорієнтуватися на будь-яку державу, готову звільнити Панаму від американського контролю. Вкрай імовірно, що принаймні одна держава відгукнеться на його заклик. Це загрожуватиме нашому контролю над Панамою, а дуже ймовірно — і нашому контролю над усією Західною півкулею, якщо ми дозволимо цій єдиній країні потрапити до тиранічних рук.\n\nІнші держави, безперечно, вже помітили пролом у броні Західної півкулі й рухаються, щоб скористатися ним. Ми не можемо і не повинні бездіяльно сидіти, поки води Панами стають дедалі неспокійнішими та бурхливішими."
 PAN_forpol.13.a: "У нас є багато запасних планів..."

 #CIA Op for Coup Success - PAN_forpol.40 is the follow-up
 PAN_forpol.14.t: "У пошуках героя"
 PAN_forpol.14.desc: "ОБМЕЖЕНИЙ ДОСТУП/[?global.date.GetDateStringNoHourLong]\n\nВІД: СЕСІЛ ЛЕНДРІ\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: КАНДИДАТ НА ПАНАМСЬКИЙ ПЕРЕВОРОТ — ОФІЦЕР НАЦІОНАЛЬНОЇ ГВАРДІЇ ОМАР ЕФРАЇН ТОРРІХОС ЕРРЕРА\n\nЗ метою забезпечення американських інтересів у Панамі ФБР провело перевірки в Панамській національній гвардії щодо потенційних кандидатів на організацію перевороту в країні. Найімовірнішим і найкомпетентнішим кандидатом є Омар Ефраїн Торріхос Еррера. Успішний переворот потенційно дозволить знову приєднати Панаму до Організації Вільних Націй (ОВН).\n\nКілька американських симпатиків у Панамській національній гвардії поручилися за товариський і харизматичний характер Торріхоса. Приватні слідчі відзначили, що Торріхос щовихідних відвідує селян-кампесінос у сільській місцевості. Імовірно, він буде популярним серед сільської опори Панами.\n\nЩодо ідеологічних позицій Торріхоса, залишається незрозумілим, наскільки він співпрацюватиме з американськими потребами. Однак, будучи одночасно панамським сильним правителем і висловлюючи невдоволення чинною адміністрацією, він може бути корисним для створення стабільної Панами подалі від несприятливого статус-кво.\n\nДля забезпечення наших інтересів у Панамі та захисту Зони каналу від нинішньої адміністрації найкраще підтримати Торріхоса та Панамську національну гвардію. Операції з переказу Торріхосу грошей і зброї вже тривають."
 PAN_forpol.14.a: "Вірність, хоробрість, чесність."

 #Dem Path
 PAN_forpol.17.t: "Панамський лібералізм"
 PAN_forpol.17.desc: "Попри кровопролиття в День мучеників, Панама — після того, що здавалося вічністю під залізним правлінням Ремона, — нарешті повернулася до виборчої урни. На виборах під пильним наглядом Роберто Франсіско Чіарі Ремон із Partido Liberal Nacional (PCN) здобув перемогу.\n\nХоча його кандидатуру тихо підтримували американські закулісні канали, сходження Чіарі було зустрінуте з оптимізмом. Панама-Сіті заполонили натовпи, що розмахували яскравим триколором, святкуючи не просто кандидата, а повернення лібералізму на перешийок. За винятком деяких націоналістів, стурбованих можливим американським впливом, вибори широко вважаються легітимними.\n\nТа тінь Дня мучеників не зникає. По всій країні свічки мерехтять на підвіконнях, а імена загиблих вирізані на хрестах і надгробках. Бійня біля Каналу тепер викарбувана в душі Панами. Очікується, що адміністрація Чіарі підтримуватиме американські інтереси, але спогади про тих, кого було розстріляно, не зникнуть після одних виборів.\n\nЦе не повернення до утопії, принаймні поки що. Але це знаменує перші кроки до зцілення зламаної нації. В очах Державного департаменту переміг правильний чоловік — і переміг правильним шляхом."
 PAN_forpol.17.a: "Канал тече водою — а тепер і кров'ю."

 PAN_forpol.18.t: "Демократія в Панамі"
 PAN_forpol.18.desc: ""Ми ж не просимо чудес, сенаторе." Панамський президент зустрівся поглядом з американським чиновником через стіл, його голос був натягнутий, мов тятива. "Ми лише просимо про деякі поступки в Зоні каналу."\n\nЧерез стіл американець нахилився вперед, з невловимим виразом обличчя, очі затуманені відблиском окулярів. "Ми теж не просимо чудес, президенте Чіарі. Нашому флоту потрібно захищати два океани, і ми не зможемо цього робити, якщо не контролюватимемо Зону каналу."\n\nЩелепа Чіарі напружилася. На вулицях вигуки ставали дедалі гучнішими, а спогади про жертви Дня мучеників залишалися незабутими. Скільки студентів мало загинути, щоб Панаму визнали чимось більшим за ворота до Тихого океану? Скільки ще загине, якщо він не зможе забезпечити гідність Панами?\n\n"Якщо я вийду з цієї кімнати ні з чим, сенаторе, — сказав Чіарі, вказуючи на вікна, — моя партія закінчена. Я закінчений. ОВН тут закінчена. І не дай Боже, наступний чоловік при владі вирішить, що Токіо чи Мадрид можуть запропонувати йому кращу угоду. Ми просто хочемо частину транспортних зборів і панамських солдатів поруч з американськими солдатами."\n\nЧіарі подивився крізь вікна. Повз кам'яні вулиці та будівлі. Повз переплетені артерії міста, що чекало відповіді з кімнати. Він чув хвилі, що тягнулися одна до одної через американський Канал. Дві половини його нації прагнули одна до одної через американський Канал.\n\nОдного дня це буде Панамський канал. Одного дня його нація буде єдиною."
 PAN_forpol.18.a: "Віддати їм Канал цілком. Давно вже час повернути його їм."
 PAN_forpol.18.b: "Економічні поступки та панамські солдати не завадять."
 PAN_forpol.18.c: "Ніякої угоди. Ми побудували цей Канал, ми його й збережемо."

#Red Path - Also includes some 1968 election events due to formatting issues
 PAN_forpol.21.t: "Червоний прапор над перешийком"
 PAN_forpol.21.desc: "Попри всі наші зусилля зі стабілізації диктатури Ремона, кров Дня мучеників не висохла так швидко. Масакра панамців стала закликом до боротьби проти Ремона та проти ОВН. Масові демонстрації охопили Панаму, і під невпинним тиском Ремон був змушений піти у вигнання.\n\nВибори, що відбулися після цього, не пішли нам на користь. Partido del Pueblo Panameño (PPP) Флойда Бріттона здобула переконливу перемогу, будучи коаліцією, склеєною спільною ненавистю до американського імперіалізму. Колись маргінальна політична партія тепер керує перешийком і має намір вигнати наші війська із Зони каналу.\n\nШирокомасштабні реформи вже тривають. Активи олігархів? Конфісковано. Національна гвардія, що була під нашим контролем? Очищена. Землі, що належали нашим корпораціям і United Fruit Company? Розподілені назад між місцевими кооперативами. Наш вплив у регіоні поволі тріщить по швах, а мета Бріттона ясна: Панама для панамців.\n\nТа за революційним запалом стоїть час жалоби. Імпровізовані святині можна побачити чи не через кожні кілька вулиць у Панама-Сіті та Колоні. Їхні свічки мерехтять поруч із чорнобривцями та хризантемами. Полум'я освітлює обличчя молодих студентів, які вірили в незалежну Панаму. Під усією цією риторикою лежить тиша, надто важка, щоб її ігнорувати.\n\nПанама обрала новий шлях. Майже напевно нас не буде серед тих, хто ним іде."
 PAN_forpol.21.a: "Через втрати вони проклали новий шлях геть від нас."

 PAN_forpol.22.t: "Канал у неспокійних водах"
 PAN_forpol.22.desc: ""Зробімо переговори короткими, сенаторе." Президент Флойд Бріттон із Partido del Pueblo de Panamá (PPP) зневажливо поглянув на свого американського колегу, перш ніж перебрати свої папери. "Ми тут не для того, щоб про щось торгуватися. Ми хочемо всю Зону каналу."\n\nАмериканський сенатор пирхнув через його зарозумілість. У Білому домі всі знали, що цей день настане, але це все одно не пом'якшило удару від цих слів. Він поправив окуляри, перш ніж зібрати докупи кілька дипломатичних формулювань. "Президенте Бріттон, Вашинґтон чітко дав зрозуміти, що передача цих територій потребує часу. Є логістика, контракти—"\n\n"Час?" — огризнувся Бріттон, підвищуючи голос. "Ми дали вам десятиліття! Ми дали вам кров, піт і сльози! Ми дали вам усе, а отримали нічого, крім мертвих дітей у самому Каналі, який наші предки побудували для вас! А ви лише транспортували нафту й сталь до своєї глобальної імперії, наче Панама — це не більше ніж коридор!"\n\nБріттон нахилився через стіл, притиснувши кісточки пальців до твердого дерев'яного столу, слина розліталася навколо. Сенатор поправив краватку, намагаючись вимовити хоч кілька слів. "Президенте Бріттон, якби ми лише могли дійти згоди—"\n\n"Можливо, я не говорив вашою мовою." — перебив Бріттон, знизивши голос, але зберігаючи холодну манеру. "Поверніть Канал. Демонтуйте всю військову присутність. Виплатіть компенсацію за цю окупацію. Інакше? Ми назавжди вийдемо з вашої сфери впливу."\n\nСенатор мовчав. У кімнаті не було чути нічого, крім віддалених вигуків протестувальників, що ставали дедалі гучнішими на вулицях. А вони ставали нетерплячими."
 PAN_forpol.22.a: "Він побачить, що стається з ворогами Америки."
 PAN_forpol.22.b: "Поступитися Каналом."
 PAN_Political_Shift_tt: "§YЦей вибір матиме величезний вплив на те, як Латинська Америка в цілому сприйматиме нас.§!\n"

 PAN_forpol.23.t: "Розкол США та Панами"
 PAN_forpol.23.desc: "Мікрофон увімкнувся.\n\nСцена була невеликою, але тло — пропливаючий вантажний корабель, бурхливі води та далекий прапор США, що майорів над колючим дротом, — було ідеальним. Флойд Бріттон, президент Панами, вийшов у самісінький центр порожньої сцени, його краватка майоріла на вітрі. Не було потреби в трибунах, не було потреби в нотатках. Не тоді, коли все було настільки ясно.\n\n"Панамський канал — це більше, ніж можливість для економічного процвітання нашого народу, це наше суверенне право. Ця окупація, всупереч чітко висловленій волі панамського народу, є не просто змовою з метою захопити наші природні багатства та плоди нашої праці. Це злочин. Нехай це нагадує нашим латиноамериканським братам і сестрам, що існує країна — так, зовсім поруч, — яка пограбує вас так само, як пограбувала нас. Доки цей Канал утримуватиметься подалі від простягнутих рук Панами, пам'ятайте про цю кривду й приєднуйтеся до нас, щоб її виправити!"\n\nМікрофон понесе його голос до ревучого натовпу, повного ветеранів протестів, що повалили Ремона, та студентів, які прагнули власного шансу на славу. Він лунатиме з радіоприймачів офісів Partido del Pueblo de Panamá, з її захопленими працівниками, та з бляшаних динаміків у провулках Колона. Він донесе його слова через нові телевізори Панама-Сіті до обставлених кімнат, де тривожні руки були зчеплені разом. Він, ледве-ледве, донесе нечутний шепіт до далеких солдатів-янкі, які спостерігали за подіями через біноклі зі сумішшю нерозуміння та цікавості.\n\nІ невдовзі його коливання поширяться ще далі."
 PAN_forpol.23.a: "Через Латинську Америку та до наддержави за її межами."

 PAN_forpol.24.t: "Радикальний переворот"
 PAN_forpol.24.desc: "Цілком таємна записка з посольства до Панами\n\nПрезидент Флойд Бріттон, колишній студентський активіст і очільник лівої Partido del Pueblo de Panamá, скасував майбутні президентські вибори у своїй країні. Він заявив, що повернення Панамського каналу є національним імперативом, а вибори створювали можливість для невизначених "зловмисних" сил втрутитися й перешкодити цій місії.\n\nМарші правлячої PPP, університетських студентів і трудових організацій у Панама-Сіті, Колоні та Давиді запобігли будь-яким серйозним протестам опозиції одразу після скасування. Крім того, головорізи силоміць увірвалися до офісів La Estrella de Panamá, щоб не допустити публікації критичних матеріалів.\n\nЦей крок до диктатури відбувається після придушення провідних опозиційних партій, а також широкомасштабного захоплення приватних підприємств. Серед них — від фабрик, що належать північноамериканцям, до скромних пекарень. Я переконаний, що Бріттон і PPP прагнуть створити однопартійну соціялістичну державу.\n\nОскільки напруженість між Сполученими Штатами та урядом Панами через Канал і економічні заходи стрімко зростає, наша нинішня неоднозначна позиція стає неприйнятною. У найближчі тижні я очікую, що США почнуть домагатися виключення Панами з Організації американських держав."
 PAN_forpol.24.a: "І що тоді станеться з Каналом?"

 ### 1968 Election Onwards
 #MARTINEZ
 PAN_forpol.26.t: "Амбіції генерала Мартінеса"
 PAN_forpol.26.desc: "КОНФІДЕНЦІЙНО\n\nДО МІНІСТРА ЗАКОРДОННИХ СПРАВ\n\nПАНАМА — ЦЕНТРАЛЬНА АМЕРИКА\n\nПанама планує найближчим часом анексувати Зону Панамського каналу. Наші агенти в панамських військових силах виявили, що плани забезпечення анексії вже приведені в дію. Більшість очікувань схиляється до ідеї швидкої війни, з прискореним проведенням переговорів, у надії перетворити захоплення на доконаний факт, а потенційний американський контрнаступ — на пропагандистську перемогу Мартінеса на міжнародній арені.\n\nПропаганда щодо відвоювання Каналу тепер є ключовою частиною публічного образу Мартінеса. Посилаючись на минулі угоди як на образу безпеці Панами та часто звинувачуючи попередні уряди й цапів-відбувайлів, засоби масової інформації висвітлюють американську несправедливість, чинну протягом десятиліть, щоб забезпечити подальший контроль над зоною. Урядова політика, схоже, сповільнилася щодо інших питань, а державна бюрократія дедалі більше готується до інтеграції.\n\nМи мало що можемо зробити для підтримки цього, не значно загостривши війну, хоча Панама безпосередньо звернулася до нас по підтримку. Захоплення Каналу порушить міжнародну торгівлю та може мати наслідки для нас, але американська й японська економіки, ймовірно, зазнають більшої шкоди. Потенційно ми могли б надати певну таємну допомогу, чи то через зброю, чи то через саботаж американських позицій, але це несе серйозні ризики, якщо нас викриють або якщо вторгнення повністю провалиться."
 PAN_forpol.26.a: "Ахіллесова п'ята Америки незабаром може бути зламана."
 PAN_Economic_Destabilization_tt: "§RНестабільність поблизу Каналу шкодить бізнесу.§!"

 PAN_forpol.27.t: "Лист полковника"
 PAN_forpol.27.desc: "Уривок із засекреченого повідомлення Бориса Мартінеса\n\n"До Вашинґтона: кожен, хто відмовляється цілувати чобіт у себе на шиї, є злочинцем.\n\nШістдесят років американська імперія душила нашу націю, розрізаючи Панаму навпіл заради власних комерційних інтересів. Вони створили державу в державі, де наші закони нічого не важать, а до нашого народу ставляться як до слуг. Але Національна гвардія більше не захищає корумпованих олігархів. Ми взяли долю нашої країни у власні руки. І тепер наша головна мета — вирвати скалку американського імперіалізму з нашої плоті та повернути Зону каналу.\n\nСаме ви кинули виклик американській гегемонії на світовій арені. У нас спільний ворог, і просто зараз мої солдати затягують петлю навколо його найуразливішої торговельної артерії. Ми готові перерізати яремну вену Дядька Сема. Але для цього вирішального удару нам бракує належних інструментів.\n\nЗброя. Гвинтівки, вибухівка, боєприпаси. Озбройте Панаму, і ми завдамо Сполученим Штатам удару у їхньому власному тилу, від якого вони оговтуватимуться десятиліттями.\n\nВибір за вами. Але пам'ятайте: Канал буде нашим, з вашою допомогою чи без неї.""
 PAN_forpol.27.a: "Удар по торговельних шляхах Дядька Сема?"

 #ARIAS
 PAN_forpol.28.t: "Новий режим Аріаса"
 PAN_forpol.28.desc: "КОНФІДЕНЦІЙНО\nПАНАМА — ЦЕНТРАЛЬНА АМЕРИКА\n\nТепер, коли Арнульфо Аріас обіймає посаду президента втретє, схоже, він повністю прийняв фашизм. За відсутності значної внутрішньої опозиції йому вдалося повторно запровадити фашистську конституцію, яку він намагався запровадити ще в 1941 році, зосередивши владу у власних руках і посиливши закони про громадянство. На відміну від попередніх термінів, військові, схоже, почали підтримувати його політику, а будь-яка внутрішня опозиція, що залишилася, не бажає заявляти про себе.\n\nЙого кроки викликали певні протести, особливо серед небілого населення Панами. Хоча наразі вони невеликі, гнів є широко поширеним, а ранні протести в Панама-Сіті та Ла-Чоррері показали тривожно широке поширення антифашистських ідей. Однак це не слід сприймати як справжню загрозу; наші агенти на місцях, схоже, погоджуються, що це значною мірою неорганізований протест, а будь-яка централізована організація буде негайно заборонена, причому багато організаторів уже зазнають юридичних санкцій.\n\nЦі нещодавні заходи викликали справжнє засудження з боку Сполучених Штатів, і це створює для нас можливість. Аріас — справжній, відданий фашист, і було б нерозумно залишати його геополітично ізольованим. Його близькість до Панамського каналу та обережний інтерес до його захоплення, про який нам повідомили представники нового режиму, можуть мати значний вплив. Однак Панама мала й відносно ізольована, і навіть обмежених американських дій може бути достатньо, щоб її змусити відступити. Якщо ми хочемо, щоб це вижило, найкраще буде надати певну допомогу."
 PAN_forpol.28.a: "Крок у правильному напрямку з перешийка, що з'єднує Америки."

 PAN_forpol.29.t: "Новий режим Аріаса"
 PAN_forpol.29.desc: "ЦІЛКОМ ТАЄМНО/[?global.date.GetDateStringNoHourLong]\n\nВІД: СЕСІЛА ЛЕНДРІ\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ПЛАНИ ПАНАМИ ЩОДО ВТОРГНЕННЯ В КАНАЛ\n\n1. Найгірший сценарій настав у Панамі, оскільки фашистські симпатії президента Аріаса стали відомими після відновлення Фашистської конституції 1941 року, що сигналізує про повторну появу Панами як відкритого ворога Сполучених Штатів.\n\n2. Реакція громадськості на цей захід була не чим іншим, як люттю. Громадяни Панами наполегливо протестують проти дій уряду, попри жорстку реакцію, яку демонструють мілітаризовані поліцейські сили Аріаса. Хоча їхнє невдоволення дуже обнадіює, нинішніх дій громадськості недостатньо, щоб обвалити режим, і, ймовірно, так і залишиться.\n\n3. Сполучені Штати продовжують зберігати значний вплив у країні, особливо серед панамської олігархії та деяких частин Guardia Nacional. Цілком правдоподібно припустити, що значні частини обох почнуть відвертатися від Аріаса, щойно стане очевидною небезпека, яку його радикальні амбіції становлять для їхнього подальшого панування.\n\n4. Чи то через таємне фінансування політичних агітаторів, чи то через тиск на наші військові зв'язки, можливість повалити диктатуру Аріаса все ще залишається в наших руках."
 PAN_forpol.29.a: "Невдовзі Аріас дізнається, що в'язанка прутів горить удвічі яскравіше."
 PAN_OP_Reminder_tt: "§YМи все ще можемо провести операцію з повалення ворожого уряду Панами, перш ніж вони спробують вторгнення.§!\n"

 #DEM PATH
 PAN_forpol.30.t: "Ліберальна демократія"
 PAN_forpol.30.desc: "ОБМЕЖЕНИЙ ДОСТУП/[?global.date.GetDateStringNoHourLong]\n\nВІД: СЕСІЛА ЛЕНДРІ\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: Результати панамських виборів 1968 року.\n\n1. Панамські вибори завершилися, і їхні результати сприятливі для Сполучених Штатів. Нового президента, Марко Ауреліо Роблеса Мендеса, було обрано, і він залишається пов'язаним із Національною ліберальною партією. Мендес багато років був затятим прихильником PLN, обіймав посаду міністра юстиції за Ремона та відомий багатьом старшим дипломатам як колишній представник.\n\n2. Вибори були відносно вільними, але більшість установ залишалися під контролем фракцій ремоністів, а висвітлення переважно було упередженим на користь правлячої PLN. Вільне регіональне висвітлення незадоволене, але не до значного рівня. Наші поступки щодо Зони Панамського каналу, схоже, допомогли зменшити невдоволення, а ні Мендес, ні ширша кампанія не приділяли великої уваги змінам щодо її анексії.\n\n3. Цей результат був очікуваним, і, схоже, прямої реакції проти нього майже не було. За Мендеса Панама залишатиметься відданим американським союзником і здебільшого буде стабільною. Однак, якщо станеться чергова криза, політична чи економічна, ми не повинні списувати з рахунків ризик того, що антиамериканські настрої можуть знову виникнути та призвести до того, що Мендес займе жорсткішу позицію щодо нашої присутності там."
 PAN_forpol.30.a: "І ви пізнаєте істину, і істина зробить вас вільними."
 PAN_Economic_Stabilization_tt: "§GСтабільність поблизу Каналу корисна для бізнесу.§!"

 PAN_forpol.31.t: "Правий поворот Панами"
 PAN_forpol.31.desc: "Схоже, навіть важко здобута демократія, за яку боролася Панама і яку підтримувала Америка, не була захищена від спокус реакції. Новообраний панамський президент — саме такий, якого Вашинґтон сподівався уникнути в Панама-Сіті, однак правий націоналістичний владолюбець, яким є президент Бойд, усе одно здобув перемогу. Панамську демократію захопив сильний правитель, який звертає свій погляд на Панамський канал.\n\nОднак не все втрачено в Панамі. Нещодавні чистки панамської Національної гвардії напередодні виборів залишили чимало вкрай незадоволених військовослужбовців, чим тепер можна скористатися на нашу користь, оскільки панамська демократія ступила на небезпечний шлях. Національна гвардія може бути слабкою на цей момент, але це тимчасовий стан, особливо якщо їй вдасться знайти однодумця у старого Дядька Сема.\n\nНаскільки нинішні плани щодо панамської проблеми дещо заспокоюють занепокоєння Вашинґтона щодо Каналу, не можна не шкодувати про цей поворот подій. Америка пишається тим, що є маяком надії, прикладом, до якого прагнуть сусідні країни в ім'я свободи. Навіть у маленькій Панамі, настільки ізольованій на світовій арені, можна почути віддалені відлуння Петрограда 1917 року та Веймара 1933 року.\n\nДоктрина Монро — це не просто політика, це обіцянка, дана всім націям Америк, і Панама має право на неї. Ми не можемо вдавати, що знаємо майбутнє, але повинні спробувати дотриматися цієї обіцянки, хай там що."
 PAN_forpol.31.a: "Цього не може статися тут, ми не повинні дозволити цьому статися в Панамі!"

 PAN_forpol.32.t: "Правий поворот Панами"
 PAN_forpol.32.desc: "КОНФІДЕНЦІЙНО\nПАНАМА — ЦЕНТРАЛЬНА АМЕРИКА\n\nПравлячу Національну ліберальну партію нещодавно усунув Акілініо Бойд із Третьої націоналістичної партії (TPN). Бойд — вкрай консервативна й авторитарна постать, яка приділяє значну увагу питанню Каналу. Ймовірно, за нього залишаться зовнішні атрибути демократії.\n\nКрім того, Бойд рішуче налаштований проти Америки й уже почав робити кроки для виходу з американської сфери впливу, що привело його за стіл переговорів із нашими представниками в регіоні.\n\nПрогнозовані економічні вигоди не переважують ризиків американської реакції, особливо якщо Бойд сповнений рішучості втілити своє бачення Каналу будь-якими необхідними засобами.\n\nХоча військова допомога режиму Бойда не рекомендується, пасивне прийняття його інтеграції до нашої економічної сфери може виявитися прибутковим. Рекомендуються обмежені інвестиції напередодні потенційних втрат, спричинених його неминучим і силовим усуненням від влади."
 PAN_forpol.32.a: "Панама робить крок у правильному напрямку."
 PAN_Alignment_tt: "§F§hПанама§! §Gприєднається§! до нашої §YЕкономічної сфери§!.§!"

 PAN_forpol.33.t: "Стривожена нотатка"
 PAN_forpol.33.desc: "Із вашої відповіді на мій попередній меморандум щодо панамської політики випливає, що значна частина Державного департаменту США продовжує помилково вважати, що президент Флойд Бріттон і його Partido del Pueblo de Panamá — це ті самі скептично налаштовані щодо США реформісти, які прийшли до влади в 1964 році. Я маю намір ґрунтовно позбавити їх цієї заспокійливої ілюзії та поширити необхідне розуміння того, що Бріттон і PPP тепер є скаженими марксистами, які найближчим часом спричинять конфлікт зі Сполученими Штатами через Панамський канал. Дивіться додані матеріали.\n\nДодаток 1. Культ особи Флойда Бріттона. Містить: каталог 52 шкіл, лікарень, бібліотек, громадських парків, вулиць, університетських будівель і військових казарм, перейменованих на честь президента; фотографію статуї Бріттона, яку встановлюють у Колоні; пропагандистський плакат "Viva Britton".\n\nДодаток 2. Розпалювання культурної війни. Містить: статтю про звільнення консервативного ректора Університету Панами; списки заборонених книг, включно з такими відомими мексиканськими творами, як 'The Underdogs'; листи від архієпископа з описом випадків переслідувань.\n\nДодаток 3. Підготовка до конфлікту за Зону каналу. Містить: фотографічні докази озброєння студентської групи 'Revolutionary Student Front', пов'язаної з Бріттоном; інтерв'ю з членами Національної гвардії, які описують проникнення PPP в установу; стенограму промови біля Каналу, що завершується словами: "Шляху назад немає, залишається лише йти вперед. До нашої остаточної перемоги!"\n\nЯ сподіваюся, що ґрунтовні зусилля нашого посольства тут, у Панама-Сіті, будуть ретельно оцінені та спонукають до дій, повністю скоординованих із нашими партнерами, щоб розібратися з тривожною ситуацією."
 PAN_forpol.33.a: "Хисткий Бріттон, неабиякий бешкетник."

 PAN_forpol.48.t: "Жарт"
 PAN_forpol.48.desc: "У день надання ОВН членства Панамі Роберт Сейр гостро усвідомив гніт сонця. Навіть найбільш застебнутий на всі ґудзики солдат Національної гвардії не міг приховати свого дискомфорту, не кажучи вже про політиків, покараних за свою зарозумілість, що змусила їх одягнути білі костюми на таку нагоду.\n\nАмериканцеві в Панамі залишалося лише пробурмотіти маленьку молитву, щоб він достатньо пристойно прочитав свою промову, аби не осоромитися й не знепритомніти перед жодним із президентів. Лаймі — можливо, напівлаймі — на сцені, здавалося, почувався добре, але навряд чи хтось слухав. Його промова була лише вступним номером перед видатним Міґелем Х. Морено-молодшим — людиною Америки в Панамі.\n\n"Дякую, дякую за ці добрі слова..." Принаймні, Міґель мав розум одягнути щось темніше, але спека не оминула й його. Його чоло могло спрямовувати кораблі, що наближалися, до безпечної гавані, а про блискучі складки жиру, що заміняли шию, краще було промовчати. "...і в нашій молодій, але сповненій історії ми завжди дивилися на Америку як на провідника."\n\n"Але ми знали, що Америка завжди прикриє нам спину, і навіть нашу землю!" Погляд Сейра на мить метнувся до сонного обличчя — що він робив? Навіть птахи перестали співати, наче й вони від подиву спостерігали, як секунди спливали, мов бомби. Міґель нервово посміхнувся, і публіка теж, адже всі знали, що це був жарт. "Важка публіка."\n\nДесь невидиму шию було перерізано. "Заради дотримання часу я зараз перейду до офіційної церемонії. Дякую всім за ваш час, я з нетерпінням чекаю на те, чого ми всі зможемо досягти разом." Коли розпочалися церемонії, здавалося, ніби хтось відсував Міґеля зі сцени, ніби не він сам ішов. Сейр підозрював, що в майбутньому йому доведеться мати справу з новим Міґелем."
 PAN_forpol.48.a: "Оплески тривали без нього, як і все інше."

 ### REWRITE ME
 # This is the Panama Canal not American Samoa, it needs tension and fury
 PAN_forpol.34.t: "Панама вторгається до Зони каналу"
 PAN_forpol.34.desc: "Звістка про те, що панамські солдати лише кілька годин тому захопили Зону Панамського каналу, роззброїли символічний американський гарнізон, що перебував там, і проголосили суверенітет над «повернутою» територією, прокотилася Вашинґтоном, мов гарматний постріл.\n\nХоча чутки вже ходили, і хоча Державний департамент видав свої звичні попередження іншим відомствам, ніхто серйозно не думав, що панамці натиснуть на курок. Але вони це зробили. Режим [PAN.GetLeader] дедалі більше викликав занепокоєння, оскільки обмежував свободи, призначав слухняних чиновників і систематично демонтував верховенство права. Але це ж Центральна Америка — чого ще можна було очікувати від нації, прихильної до огидної природи авторитаризму?\n\nБезперечно, не агресії проти — і захоплення — американських сил. Приголомшене сум'яття швидко поступилося місцем люті, як серед цивільних, так і серед військових. Як Панама — Панама — посміла напасти на Америку. Як вона посміла роззброїти й інтернувати — інтернувати — американських солдатів. Як вона посміла під час найгіршого за роки економічного спаду закрити Панамський канал — Панамський канал — і перерізати глобальні та військові торговельні зв'язки.\n\nЛють невдовзі поступилася місцем діям. Пентагон, не чекаючи запиту, негайно подав плани втручання. Представники ОАД поспішили провести консультації, знаючи, що незабаром неодмінно надійде запит на мандат для втручання. Панама, звісно, не мала жодних шансів, але Державний департамент знав, що вони розраховували на численні інші труднощі Америки, які завадять їй вжити рішучих заходів.\n\nЄдине питання полягало в тому, чи мали вони рацію?"
 PAN_forpol.34.a: "Абсолютно ні. Ми мусимо втрутитися!"
 PAN_forpol.34.b: "Мали. Ми не можемо відповісти — поки що."
 PAN_Canal_Invasion_Loss_tt: "Ми не можемо відповісти через наші §xнеодноразові втрати§! в регіоні."

