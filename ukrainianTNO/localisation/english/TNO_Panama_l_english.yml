 PAN_forpol.35.t: "Панама вторгається до Зони каналу"
 PAN_forpol.35.desc: "Звістка про те, що панамські солдати лише кілька годин тому захопили Зону Панамського каналу, роззброїли символічний американський гарнізон, що перебував там, і проголосили суверенітет над «повернутою» територією, прокотилася Вашинґтоном, мов гарматний постріл.\n\nХоча вже лунали тривожні сигнали, і хоча Державний департамент видав свої звичні попередження іншим відомствам, ніхто серйозно не думав, що панамці натиснуть на курок. Але вони це зробили. Зрештою, режим [PAN.GetLeader] дедалі більше викликав занепокоєння. Так, він переміг на вільних і чесних виборах, але примара сильного правителя вже дала про себе знати. Ті, хто добре розуміється на подібному, могли чітко побачити закономірності авторитарного захоплення влади, а демонстрація військової «перемоги» над значно могутнішим «супротивником» була класичним шляхом до подальшої консолідації влади. Агресії слід було очікувати.\n\nАле безперечно не агресії проти — і захоплення! — американських сил. Приголомшене сум'яття швидко поступилося місцем люті, як серед цивільних, так і серед військових. Як Панама — Панама! — посміла напасти на Америку. Як вона посміла роззброїти й інтернувати — інтернувати! — американських солдатів. Як вона посміла під час найгіршого за роки економічного спаду закрити Панамський канал — Панамський канал! — і перерізати глобальні та військові торговельні зв'язки.\n\nЛють невдовзі поступилася місцем діям. Пентагон, не чекаючи запиту, негайно подав плани втручання. Представники ОАД поспішили провести консультації, знаючи, що незабаром неодмінно надійде запит на мандат для втручання. Панама, звісно, не мала жодних шансів, але Державний департамент знав, що вони розраховували на численні інші труднощі Америки, які завадять їй вжити рішучих заходів.\n\nЄдине питання полягало в тому, чи мали вони рацію?"
 PAN_forpol.35.a: "Абсолютно ні. Ми мусимо втрутитися!"
 PAN_forpol.35.b: "Мали. Ми не можемо відповісти — поки що."

 PAN_forpol.36.t: "ОАД санкціонує ІСМФ"
 PAN_forpol.36.desc: "Неминуча відповідь Вашинґтона на захоплення Панамського каналу надійшла, і надійшла силою зброї. Посилаючись як на незаконність панамського захоплення, так і на екзистенційну загрозу, яку воно становить для Сполучених Штатів, Сполучені Штати послалися на необхідні статті ОВН для військового вторгнення ІСМФ з метою повалення режиму в Панамі.\n\nХоча використання ІСМФ адміністрацією США як очевидного прикриття для відновлення свого впливу над Каналом навряд чи можна назвати тонким ходом, більшість погоджується щодо законності американської протидії Панамі. Коаліційні сили ОВН уже мобілізуються для морських операцій, щоб надати ІСМФ військово-морську підтримку під час вторгнення.\n\nСамо собою зрозуміло, що повернення американських військових на панамську землю зі зброєю, навіть через використання політично зручного посередника, має значну історичну вагу. Панама, буквально, знайома територія для Сполучених Штатів, навіть якщо експансіонізм епохи Тедді Рузвельта для тих, хто залишився у Вашинґтоні, є далеким спогадом."
 PAN_forpol.36.a: "Досвід американців і панамців на місці ось-ось стане надто реальним..."

 PAN_forpol.37.t: "Наслідки поступки щодо Каналу"
 PAN_forpol.37.desc: "Сполучені Штати охоплює чергова криза, оскільки американська безпека у Вільному світі опинилася під загрозою. Після нещодавнього захоплення Панамського каналу політична опозиція у Вашинґтоні здійняла галас. Політики ліворуч і праворуч кричать один на одного через втрату обличчя на світовій арені, тоді як президент сидить в Овальному кабінеті й заліковує рани після цього прямого нападу на американський суверенітет.\n\nПопри те, що політичні наслідки цього розгортаються, більшість пересічних американців відчувають полегшення, що ситуація дійшла до завершення. Американський вплив над Каналом був болючим питанням для ізоляціоністів та інших, хто вважав американську присутність там провокацією, яка рано чи пізно мала викликати відповідь. Якою б не була тривога через присутність фашистів у Панамі, дехто просто хоче закрити це питання, тоді як інші бачать у ньому відправну точку для розрядки та відновлення відносин із новою Панамою.\n\nОстання думка навряд чи справдиться, оскільки вже відомо, що фашистські сили за кордоном підтримують новий режим у Панамі. Якою б значною не була втрата Каналу, Вашинґтон наполягає, що це лише тимчасовий стан речей. Простіше кажучи, Сполучені Штати Америки не збираються просто змиритися із захопленням Каналу. Ідея розміщення американських військ так близько до кордонів Сполучених Штатів справді зловісна, але в Америки може бути мало інших варіантів."
 PAN_forpol.37.a: "Американське інженерне диво в руках ворога?! Цього не буде!"

 PAN_forpol.38.t: "Пережити бурю"
 PAN_forpol.38.desc: ""Бля, бля, бля!" — Хосе Антоніо Ремон Кантеро, президент Панами, повторював ці слова вже третю годину поспіль. За броньованим склом Палацу чапель у небо здіймалися густі клуби чорного диму. Панама-Сіті горів. Приглушений рев натовпу просочувався крізь стіни його кабінету. Нафтова криза, за океаном, на Близькому Сході, обрушилася на Центральну Америку із силою урагану.\n\nЕкономіка розбилася об гострі скелі гіперінфляції та дефіциту. Разом із нею випарувалася його влада на вулицях. Опозиціонери-націоналісти, радикалізовані студенти та політики-опортуністи — всі вони відчули кров. Вони відкинули свої розбіжності, об’єднавшись заради насильницької мети: розірвати режим Ремона на частини. Кожен новий день приносив похмурі звіти про паралізовані порти, саботовані електромережі та заворушення.\n\nАле найжахливішою була тиша з казарм. Національна гвардія поки що тримала лінію, але як довго вони стрілятимуть у своїх співвітчизників за нікчемний папір? Він параноїдально поглянув на власні дубові двері, наполовину очікуючи, що ввійдуть люди у формі й запропонують йому традиційний вибір: вигнання або кулю в голову.\n\nУся його влада тепер трималася на одній тонкій, розтріпаній нитці, нерозривно пов’язаній з його іноземними покровителями. Ремон стиснув кулаки, аж кісточки побіліли. Йому не були потрібні їхні симпатії. Йому були потрібні нафта, стабілізаційні позики і, якщо до цього дійде, їхня зброя. Якщо вони не кинуть йому рятівний круг просто зараз, ця буря потопить не лише його, а й усі їхні стратегічні інтереси на перешийку."
 PAN_forpol.38.a: "Забезпечити режим Ремона всім необхідним."
 PAN_forpol.38.b: "Йому доведеться обійтися меншим."

 PAN_forpol.39.t: "Годівниця режиму"
 PAN_forpol.39.desc: "Агент Томас замислено жував ледь теплий, жирний хот-дог, повністю ігноруючи табличку «Їжа в операційній заборонена». Велика крапля яскраво-жовтої гірчиці стекла з сосиски й точно впала на надсекретну дипломатичну телеграму, що лежала на його столі.\n\n"Сучий син," — пробурмотів Томас. Він схопив серветку й спробував витерти її, зрештою лише розмазавши гірчицю по офіційній печатці Республіки Панама.\n\nТелеграма надійшла від PLN, правлячої партії Панами. Нафтова криза перетворила Близький Схід на порохову бочку, а ударна хвиля тепер розривала Центральну Америку. Безробіття в Панама-Сіті стрімко зростало, вирували протести, а місцеві політики боялися, що розлючені натовпи витягнуть їх із кабінетів.\n\nЇхнє геніальне рішення? Благати американців. PLN ввічливо, але відчайдушно вимагала, щоб Вашинґтон делегував панамському уряду більше адміністративних повноважень над Зоною каналу. У листі це було прикрашено красивими словами: «стабілізація економічного клімату» та «зниження суспільної напруженості».\n\nТомас відкусив ще шматок хот-дога, голосно жуючи в порожньому кабінеті. "О, дайте нам доступ до доходів від Каналу, щоб селяни не відрубали нам голови, будь ласка!" — глузливо сказав він.\n\nВідмова навіть від дюйма контролю над Зоною каналу під час глобального енергетичного колапсу була небезпечною слизькою доріжкою. Томас запив хот-дог несвіжою кавою й втупився в зіпсовану дипломатичну печатку, розмірковуючи над своїм наступним кроком."
 PAN_forpol.39.a: "Витри гірчицю, постав штамп «ТЕРМІНОВО» й передай нагору."
 PAN_forpol.39.b: "Використай засекречену телеграму як серветку й викинь її у смітник."

 #Torrijos
 PAN_forpol.40.t: "Переворот Торріхоса в Панамі"
 PAN_forpol.40.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM DAVID HANNA\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: TORRIJOS' PANAMANIAN COUP SUCCESSFUL - IMMEDIATE DEVELOPMENTS AND POTENTIAL ISSUES\n\nПереворот Омара Ефраїна Торріхоса Еррери в Панамі завершився успішно, а колишня адміністрація була вислана зі столиці. Однак зростає занепокоєння, що націоналістичні зв’язки та риторика Торріхоса можуть відштовхнути американські інтереси. Вкрай важливо забезпечити, щоб адміністрація Торріхоса залишалася орієнтованою на Організацію Вільних Націй (ОВН).\n\nНаші раніше встановлені жучки у штаб-квартирі Торріхоса зафіксували його байдужість до американської допомоги. Торріхос неодноразово зневажливо ставився до американських оперативників і дипломатів. За зачиненими дверима Торріхос також перенаправляв зброю від панамської Національної гвардії до рук власних націоналістичних воєнізованих угруповань.\n\nЩоб забезпечити перебування Панами в межах інтересів ОВН, доцільно стримувати панамський націоналізм. Успішні операції можуть передбачати поширення проамериканської пропаганди серед цивільного населення та придушення націоналістичних протестів. Ми наполегливо працювали над підтримкою перевороту Торріхоса. Ми не можемо змарнувати цю можливість."
 PAN_forpol.40.a: "Вірність, відвага, чесність."
 
 PAN_forpol.41.t: "Торріхос консолідує режим"
 PAN_forpol.41.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM ROBERT SANDLER\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: TORRIJOS CONSOLIDATES PRESIDENCY - DEMOCRATIC REFORMS PASSED\n\nОмар Ефраїн Торріхос Еррера послабив свою військову хунту, обмеживши виконавчі повноваження та запровадивши більше соціальних реформ. Уряд Панами ухвалив нещодавні поправки, що обмежують президентські повноваження Торріхоса. Його земельні реформи та увага до освіти зробили Панаму дедалі стабільнішою.\n\nНа вулицях Панама-Сіті цивільні святкують масштабні реформи Торріхоса на шляху до демократичної Панами та нормальності. Торріхос також пом’якшив націоналістичну риторику. Хоча протести Дня мучеників досі переслідують панамський народ, антиамериканізм більше не є настільки домінантним.\n\nНаші панамські оперативники повідомили, що більшість контрреволюційних осередків втратили мотивацію дестабілізувати Торріхоса. Малоймовірно, що найближчими роками Торріхосу протистоятиме будь-яка опозиція.\n\nРекомендується підтримувати дипломатичні зв’язки з Торріхосом і продовжувати стежити за його внутрішнім кабінетом. Панамський командир забезпечив стабільну, демократичну Панаму, орієнтовану на цілі Організації Вільних Націй (ОВН). Поки Торріхос залишається при владі, наші інтереси в Зоні каналу залишатимуться в безпеці."
 PAN_forpol.41.a: "Вірність, відвага, чесність."
 
 #FBI Missions post-Martyrs' day
 PAN_forpol.42.t: "Захоплені пішаки"
 PAN_forpol.42.desc: "Хосе Антоніо Ремон Кантеро, президент Панами, широко всміхався, проходячи крізь захоплені ряди. Посол Фарленд плентался на деякій відстані позаду, запитуючи Бога, чому Ремон не міг зустрітися з ним у президентському палаці, як нормальний диктатор. Або хоча б обрати будівлю. Не огороджене колючим дротом місце просто неба, де двох чоловіків можна було сфотографувати з-\n\nРяд за рядом протестувальників. Руки стягнуті за спинами пластиковими стяжками. Роти заткнуті. Носи за кілька сантиметрів від асфальту. Скляні, заплакані очі, сповнені ненависті або якоїсь комбінації всього цього. Синці по всьому тілу, деякі кінцівки зігнуті неприродним чином.\n\nРемон припинив оглядати найближчий трофей, маленького підлітка, що тремтів від страху, і сказав Фарленду: "Ми цінуємо допомогу. Ваші хлопці з ФБР добре попрацювали."\n\nПосол не відривав погляду від асфальту під ногами: "Тепер, коли на вулицях стало стабільніше, можливо, настав час зв’язатися з вашим кузеном. Дайте йому знати, що на наступних виборах ви послаблюєте хватку. З Чіарі та лібералами-"\n\n"Зараз не час послаблювати хватку, посол. Дайте дюйм — і ці зрадники подумають, що вони вирвали його з мене. Вулиці знову наповняться, і важка розвідувальна робота ваших людей піде нанівець", — сказав Ремон, явно в чудовому настрої.\n\n"Зовсім не час послаблювати хватку." Із швидкістю, яка не відповідала його розмірам, Ремон вдарив чоботом підлітка в живіт. Обличчя в’язня врізалося в землю, піднявшись уже в крові та здертій шкірі. "Можливо, час натиснути." Огрядний президент поставив чобіт на потилицю свого полоненого. "Вниз." Ніс підлітка втиснувся в бруківку й ковзнув убік. "Сильніше." На асфальті почулися зуби.\n\nРемон зняв чобіт і пішов геть, усміхаючись."
 PAN_forpol.42.a: "Жовч підступила до горла Фарленда."
 
 PAN_forpol.43.t: "Народна справедливість"
 PAN_forpol.43.desc: "Перше засідання цього революційного трибуналу вже розпочалося під головуванням панамського народу." Промови Бріттона із суддівського місця було чути з-поза будівлі суду, що було цілком доречно, адже море людей виливалося з місць аж на сходи. "Наш перший підсудний — безчесний Хосе Антоніо Ремон Кантеро."\n\nЯк свідчення його «безчестя», Ремон кілька днів тому втік зі столиці, намагаючись позбавити революціонерів цього задоволення, натомість його представляв солом’яний чоловік, прикрашений кашкетом полковника. "Прокуроре, з огляду на боягузтво підсудного, бажаєте почати?" Прокурор підвівся — активіст, і шрами свідчили про це.\n\n"Підсудний винен у численних злочинах. Вимагання, зґвалтування, вбивство — для нього немає нічого надто огидного. Він тиран, який співпрацював не лише з олігархами, а й із Янкі. Ми подали до суду докази, що детально описують листування між ФБР і Ремоном, те, як вони змовлялися у своєму насильстві, щоб придушити справжній панамський націоналізм."\n\nМолоток ударив униз, коли натовп почав нервувати. "Це дуже переконливо. Однак ми повинні дозволити підсудному говорити. На відміну від тих, кого змусив замовкнути його режим, тут кожен має голос, навіть винні."\n\n«Ремон» вирішив мовчати, сподіваючись, що мовчазний вигляд солом’яного обличчя допоможе уникнути звинувачень.\n\n"Дуже добре. В очах цього трибуналу я не бачу іншого вибору, окрім як засудити Хосе Антоніо Ремона Кантеру до смерті." Щойно останнє слово злетіло з його вуст, солом’яного чоловіка затягнули в натовп, розірваного на шматки юрбами щасливих катів.\n\n"А тепер наш наступний підсудний, ще один колаборант Янкі, Бернардіно Ґонсалес Руїс...""
 PAN_forpol.43.a: ""Ви працюєте або коли-небудь працювали з Федеральним бюро розслідувань?""
 
 PAN_forpol.44.t: "Возз’єднання родини"
 PAN_forpol.44.desc: ""ФБР провело вас повз чапель на газоні, отже," — президент Панами Хосе Антоніо Ремон Кантеро примружився, дивлячись на кузена своїми темними, свинячими очима. "Зустрінемося в Тамариндовій кімнаті. Вип’єте? Сигара?"\n\n"Я покурю, так." Роберто Франсіско Чіарі Ремон із опозиційної Національної ліберальної партії пішов за сутулою постаттю президента до низки оздоблених крісел під розкішним мисливським розписом. Він зупинився перед тим, як сісти: "Ти легковажно ставишся до протестувальників, Хосе Антоніо. Але вони хочуть твоєї голови. Ні я, ні хтось інший не запропонуємо тобі амністії; народ її все одно не прийме. Але посол Фарленд і ФБР можуть влаштувати тобі комфортне життя в Маямі."\n\nРемон нічого не сказав, нахилившись уперед, щоб запалити власну сигару, перш ніж простягнути одну кузену. Вони сиділи мовчки, дим огортав кімнату.\n\nПеред очима Ремона клубки диму набули форми рук, усі вони тягнулися, тягнулися до нього. А серед них палаюча жарина сигари його кузена перетворилася на багаття, що тягнуло його вперед, затягувало всередину, аж поки його шкіра не почала нагріватися, потріскувати, а очі не почали вискакувати з орбіт від жаху-\n\nРемон заплющив очі й прошепотів: "Я подумаю над цим." А потім із гарчанням: "Поки говоритимеш із Фарлендом, попроси в нього будинок по сусідству. Вашинґтон теж скоро втомиться від тебе.""
 PAN_forpol.44.a: "Він викинув недопалок сигари, навіть не глянувши на нього."
 
 PAN_forpol.45.t: "Остання ніч в опері"
 PAN_forpol.45.desc: "Це була непроглядна чорна ніч, освітлена лише вогнями злітної смуги, і все, що Марко Ауреліо Роблес Мендес та його родина могли робити, — бігти.\n\nПозитивною стороною блискучої політичної кар’єри була можливість зафрахтувати приватний літак для втечі, а зворотною стороною — те, що летіти ним можна було лише тоді, коли розлючений диктатор хотів твоєї голови. Однак найнагальнішими негативами були активи, запаковані у валізи й тягарем тягнули їх униз; Пепіта благала його не робити цього, але він не хотів провести своє нове життя в Америці, благаючи.\n\nЙого уривчасте дихання підтримувалося лише яскраво-червоним світлом хвостового ліхтаря його літака. Він міг простягнути руку до нього, відчути смак піску на Маямі-Біч, ще кілька-\n\nГуп!\n\nБейсбольна біта — приведена в дію вірним загоном Національної гвардії в їхній машині Ford — зламала ліву ногу Роблеса навпіл. Коли він упав, він відчув не смак піску, а холодний асфальт і кров. Пепіта навіть не могла скрикнути від страху, заціпеніла від думок про те, що буде далі.\n\n"Їдете, не попрощавшись, пане? Полковник Ремон запросив вас як почесного гостя на свою прощальну вечірку. Було б нечемно хоча б не привітатися." Роблес хотів кричати, сказати родині бігти до літака, чинити опір, але він був зламаний. "У нас є приватний автомобіль, щоб відвезти вас туди. Буде весело." Він усміхнувся кинджальною усмішкою, запихаючи Роблеса на заднє сидіння.\n\n"Полковник наполіг, щоб ми забрали лише вас, без родини." Один із головорізів підняв биту до голови Пепіти. "Справжня ганьба для вас, люба, але можеш знайти мене, якщо знадоблюся. Бог знає, що тепер тобі знадобиться справжній чоловік, щоб підтримати тебе." Відразливий сміх пролунав від гурту, коли автомобіль рвонув із місця. Роблес востаннє глянув на свою родину. Родина побачила його знову на першій шпальті."
 PAN_forpol.45.a: "ПОПУЛЯРНОГО ПОЛІТИКА ЗНАЙДЕНО РОЗЧЛЕНОВАНИМ У КАНАЛІ"

 # IAPF Occupation
 PAN_forpol.46.t: "ІСМФ окуповує Панама-Сіті"
 PAN_forpol.46.desc: "Деніc був героєм, Сан-Міґеліто було звільнено, як і Колон та Ла-Чоррера. Він сидів у порожній квартирі, евакуйованій під час бою, з вибитими вікнами та кулями в стінах. Увімкнувши радіо, що пережило перестрілку, Деніc почув голос генерала Омара Торріхоса, який оголошував про захоплення Панама-Сіті та створення перехідного уряду, очолюваного самим добрим генералом і його товаришами з ІСМФ.\n\nВиглянувши у вікно, Деніc побачив місто в руїнах, із нагромадженими мішками з піском, трупами на вулицях та американськими солдатами, які наказували цивільним повертатися додому. Це було розрізнене видовище країни в хаосі, але Деніc побачив дещо інше — місто, якому дали другий шанс. Можливо, він був дурним і наївним, але в країні з’явився новий подих життя. Авторитарні правителі, які гнобили й грабували, зникли. Панама була вільною. Принаймні він на це сподівався."
 PAN_forpol.46.a: "Поклін новій революції."

 # Canal Concessions
 PAN_forpol.47.t: "Ціна вільного Каналу"
 PAN_forpol.47.desc: ""Ні Людині! Ні Плану! Ні Каналу!"\n\n"Панама." Чого протестувальникам, які марширували Пенсильванія-авеню, бракувало в паліндромах, те вони компенсували увагою медіа. Репортер CBS і оператор зупинили вашинґтонця середнього віку в об’ємному костюмі, який відокремився від натовпу для інтерв’ю.\n\n"Адміністрація тут цілком неправа. Америка не повинна була поступатися перед порожніми погрозами Панами, особливо коли за нами спостерігають Японія та Німеччина."\n\nНаступним до простягнутого мікрофона підійшов більш фотогенічний молодий профспілковий діяч: "Знаєте, хто побудував той канал? Американські робітники. А тепер ми віддаємо їхній піт і наші податкові долари купці жадібних чужинців. Заради чого? Ні заради чого!"\n\nЛітня жінка зупинилася, явно втомлена швидким темпом учасників маршу. Але в її легенях було достатньо повітря, щоб випустити його, коли до неї підійшли репортери: "Президент віддає все цьому негру-комуністу Бріттону, так само, як він віддає неграм тут, удома — чому..." Знімальна група поспішила геть, перш ніж тирада могла повністю піти вбік.\n\nБо новиною дня була Панама. І непростима слабкість президента, який здав її без бою."
 PAN_forpol.47.a: ""Ні Людині! Ні Плану! Ні Каналу! Панама!""
