 POLITICS_RIDLEY_DESC: "Гаразд, тож якщо ви очікуєте якогось незрозумілого панамського божевільного, який пасував би ідеології BurgSys, або кумедного жарту, у мене немає ні того, ні іншого.\n\nОтже, Рідлі зазвичай ставлять у нижню частину середнього рівня, і це місце розташування явно є нісенітницею, і ось чому. По-перше, усі атаки Рідлі на розбиття божевільні, причому його бічна B нокаутує приблизно на 40%, а його нижня атака на розбиття має достатню дальність, щоб прикрити будь-яке наземне відновлення від краю. І це навіть не згадуючи його верхню атаку на розбиття, яка майже така ж руйнівна, як верхня атака Ґанондорфа, з тією ж дальністю, але швидша. *Майже* кожна повітряна атака Рідлі хороша, причому задня атака завдає значної шкоди, а передня легко влучає і може без проблем не дати іншому гравцеві нормально відновитися. А ще є його верхня повітряна атака, яка повністю знущається з будь-якого персонажа, що опинився поблизу верхньої межі вибуху. Його шип жахливий, але це, по суті, все (навіть попри це, шип має своє застосування).\n\nДалі йдуть його спеціальні прийоми, які всі є від непоганих до фантастичних. Бічний B Рідлі — неймовірно корисний захват-команда, який миттєво дає вам контроль над ареною. Далі є його верхній спеціальний прийом, який, визнаю, не є найкращим відновленням, але в поєднанні з додатковим стрибком Рідлі стає придатним для використання. До того ж його висока шкода та відкидання роблять його також надійною атакою. Його нейтральний B — чудовий дальній прийом, який фактично є вогняними кулями Маріо, але кращими й у більшій кількості. І нарешті, шампур — це круто.\n\nНайбільша слабкість Рідлі — його розмір і відсутність броні, яка б його виправдовувала. Але його пристойна маневреність у повітрі не дозволяє йому просто сидіти безпорадною мішенню, а безліч чудових атак, принаймні на мою думку, це компенсує.\n\nОтже, на завершення, поставте Рідлі від високого середнього рівня до низького високого рівня.\n\nГаразд, TED Talk завершено."

