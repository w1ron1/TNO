 ##Canal
 PAN_Divided_at_the_Isthmus: "Розділені перешийком"
 PAN_Divided_at_the_Isthmus_desc: "Шрам пролягає навколо країни, розрізаючи її навпіл відтоді, як американці вирішили завершити роботу, залишену іншими імперіями. Іноземні кораблі та вантажі щодня безперешкодно проходять через нього, охоронювані вашинґтонськими наглядачами, що контролюють світову торгівлю. Це Зона Панамського каналу та її «зоніани» — як їх зневажливо називають панамці — перешкоди на шляху до суверенітету Панами та її самодостатності.\n\nОднак не можна заперечувати, що Канал зробив багатьох людей заможними, навіть якщо більшість багатства просочується вгору до олігархії. Розріз 1904 року забезпечив Панамі значно вищий рівень життя, ніж у багатьох її центральноамериканських сусідів, дозволивши величезний економічний бум, який ще більше посилився післявоєнним припливом торгівлі Сфери. Проте дехто й досі прагне чогось багатшого за багатство — долі, не пов'язаної зі США."

 #Canal Retaken
 PAN_El_Pais_Istmeno: "El País Istmeño"
 PAN_El_Pais_Istmeno_desc: "Що робить Панаму «Панама»? Дехто може сказати, що їжа чи музика, але кожен добрий панамець знає, що це перешийок і канал. Навіть за часів провінційного статусу Панами в Колумбії вона була відома як Провінція Перешийка.\n\nОднак відтоді, як було побудовано канал, континентальна частина, якою є Панама, була розділена. Зона, що вбила клин між Америками, була джерелом як національного успіху, так і ганьби.\n\nАле більше ні. Більше Панама не розділена смугою чужої держави, що висмоктує прибутки та гордість нації. Тепер, уперше за багато років її історії, вона цілісна. Від Бокете до Явіси країна радіє як єдине ціле. У кожному місті націоналісти та соціялісти однаково святкують, співаючи гімн Перешийка, п'ючи, сміючись і святкуючи.\n\nКанал залишається, так, але тепер він панамський, і Республіка Перешийка знову цілісна."

 ##American Relations
 PAN_Two_Flags_One_Nation: "Два прапори — одна нація"
 PAN_Two_Flags_One_Nation_desc: "На вершині кожного флагштока в Зоні Панамського каналу гордо майорить зоряно-смугастий прапор. Тим часом прапор Панами висить під ним, якщо йому взагалі пощастить бути піднятим. Для численних панамців це лише символізує більшу проблему — янкійську експлуатацію їхньої нації.\n\nУтілене в слові Panameñismo, або «Панама для панамців», воно означає висхідну націоналістичну тенденцію в країні. Останньою кульмінацією цього стали антиамериканські заворушення 1959 року, коли панамці, які намагалися підняти свій прапор у Каналі, зіткнулися з жорстокою силою американських військ, що призвело до хвилі вандалізму проти американської власності. Через це було встановлено нинішній статус-кво щодо прапорів — незадовільний компроміс, що служить лише точкою збору для подальшого націоналістичного невдоволення."

 #anti-American
 PAN_One_Flag_One_Nation: "Один прапор — одна нація"
 PAN_One_Flag_One_Nation_desc: "На кожній будівлі в країні майорить лише панамський прапор, а поруч із ним — шматок бетону, де колись був зоряно-смугастий прапор. Як і єдиний прапор, Панама стоїть сама по собі в коаліції однодумних держав, яким набрид чобіт Вашинґтона. Нарешті кожен громадянин країни може сказати, що Панама тепер справді належить панамцям.\n\nАнтиамериканська ідеологія Panameñismo набирала популярності доти, доки Зона Каналу залишалася частиною Сполучених Штатів. Уявне імперіалістичне панування янкі над нацією гноїлося серед населення, доки запал панамеїзму не досяг точки кипіння.\n\nНарод більше не прийматиме, що його лідери вивертаються навиворіт заради ґрінґо. Американські фірми по всій країні грабують, а їхніх власників виганяють із домівок. Панама більше не буде задушена хваткою тих, хто прагне лише висмоктати з неї всі соки.\n\n¡Panama Sí! ¡Yanqui No!"

 #Arias Anti-American
 PAN_One_Flag_One_Nation_2: "Один прапор — одна нація"
 PAN_One_Flag_One_Nation_2_desc: "Народ танцює на вулицях навколо куп зоряно-смугастого прапора, що тліє. Там, де він колись майорів, тепер майорять прапори Патрії та Partido Panameñista.\n\nПо всій країні з гучномовців лунають промови Аріаса, його гасла розписані на стінах янкійських фірм, їхні будинки виламані та пограбовані. Тепер вони приєднуються до хрестового походу держав, які чинять опір і виступають проти диктату та затикання ротів гнобителями Північної Америки.\n\nНова нація Аріаса уособлює боротьбу Panameñista.Панама знову стане цілісною для тих, кому ніколи не дозволяли мати власну націю, а тепер вони прагнуть повернути її собі.\n\nВони розривають кайдани, що прив'язували їхню країну до Вашинґтона, та виганяють західноіндійців і азіатів, завезених янкі. Панама більше не буде повією Вашинґтона! Вони більше не житимуть у країні, яка продає власний народ!\n\n¡Panama Sí! ¡Yanqui No!"

 ##Canal Treaty
 PAN_Half_measures_and_handshakes: "Півзаходи та рукостискання"
 PAN_Half_measures_and_handshakes_desc: ""Ні мільйони, ні милостиня — ми хочемо справедливості."\n\nРемон уперше виголосив цю заяву після свого обрання, а через три роки було підписано Договір Ремона—Ейзенхауера — останній законодавчий акт, що регулює управління Панамським каналом. Примітно, що він передбачав численні поступки Америки панамському уряду, включно з поверненням територій, розширенням прав працівників і торговців Каналу та збільшенням виплат Панамі за Канал.\n\nОднак, попри те, що це був один із найвищих моментів правління Ремона, багато хто вважає, що договір не приніс їм жодної справедливості. Націоналістичні дисиденти, такі як Арнульфо Аріас, нападали на Ремона за його нібито схиляння перед продовженням американської гегемонії, що легітимізувало розділення Перешийка. Його погляди далеко не є поглядами меншості, а отже питання Каналу необхідно переглянути раніше, ніж пізніше."

 #Violence
 PAN_Clashes_At_Canal: "Зіткнення біля Каналу"
 PAN_Clashes_At_Canal_desc: ""ГЕТЬ, УБИВЦІ-ЯНКІ", "ВБИВЦІ-ЯНКІ", "ПАНАМА НЕ ПРОДАЄТЬСЯ".\n\nПо всій столиці Панами та на вулицях навколо Зони Каналу на стінах можна побачити написи на кшталт цих. Чи змінилося щось після договору Ремона? Ні, юридично — нічого. Але в серцях і думках панамців, схоже, півзаходів більше недостатньо.\n\nУздовж кордонів Зони Каналу люди тримають плакати, кричать, кидають каміння та гнилі фрукти в американських солдатів, які непохитно дотримуються наказів не вступати в бій. Найзапекліші з цих активістів розмахують мачете, вивергаючи погрози та образи на адресу солдатів і їхніх родин. Дехто каже, що напруга вже спала, але ті, хто перебуває на місці, скажуть вам, що все лише починається.\n\nЖоден папір, жоден договір, жодна обіцянка миру не зможе зупинити те, що насувається на Зону Каналу, і коли це станеться, можете бути певні — нічого гарного з цього не вийде."

 #Negotiations
 PAN_A_Deal_Fair_and_Square: "Чесна й справедлива угода"
 PAN_A_Deal_Fair_and_Square_desc: "Якби пройтися вулицями Панами десять років тому та сьогодні, не помітили б нічого іншого, крім відсутності Зони Каналу. Під загальні овації Панама та Сполучені Штати уклали угоду. Стіни столиці рясніють плакатами із зображеннями президентів обох країн. Роками це здавалося неможливим, але чи справді так було? Яким ворогом була Панама для Сполучених Штатів, і яким ворогом був янкі для Панами? \n\nУ Панамі світлий день. Запеклі націоналісти більше не можуть проклинати зоніан. Опозиція більше не може стверджувати, що чинна влада продає її найбільшу гордість. Їх позбавлено іклів. Американці прийшли до їхньої країни, дали їм багатства та, попри свої помилки на цьому шляху, повернули канал Панамі.\n\nЯк старі друзі, Панама та Сполучені Штати досягли згоди, і все пробачено."

 #Occupation
 PAN_All_Along_the_Watchtower: "Вздовж усієї вартової вежі"
 PAN_All_Along_the_Watchtower_desc: "Америка спробувала поступки, спробувала переговори та спробувала бути цивілізованою. Власне кажучи, вони ніколи не віддавали наказу стріляти по ордах озброєних панамців, коли ті ринули в Зону Каналу. Що це їм принесло? Нічого, крім загибелі невинних американців від рук розлючених, скажених натовпів.\n\nТепер усі ці маленькі клаптики безглуздого паперу розірвано. До біса поступки. Панама тепер знову на початковій точці, а весь прогрес, досягнутий завдяки поступкам і щодо самого Каналу, скасовано. Уздовж кордонів Зони Каналу тепер стоїть великий контингент американських солдатів поруч із зоніанами, що повертаються.\n\nПопри всі їхні зусилля, повернення Панамського каналу завершилося нічим, крім довгої лінії колючого дроту, солдатів та американських прапорів там, де колись майоріли прапори Панами."

 ##Political
 PAN_policemen_of_nations: "Поліцейські націй"
 PAN_policemen_of_nations_desc: "Режими повинні триматися разом, і навіть якщо Ремон вважає крайнощі таких, як трухільїсти, огидними, він знає, що недостатньо просто покладатися на американців. З огляду на це мало кого з посвячених здивувало, коли Панама почала налагоджувати зв'язки з режимом Сомоси в Нікарагуа — диктатурою, яку Ремон поступово почав вважати зразком для себе.\n\nВідтоді обидві країни об'єднали свої сили, щоб придушити будь-яке інакодумство щодо їхніх режимів. Обмін полоненими став звичним явищем між ними: будь-яких дисидентів, яким не пощастило підійти надто близько до кордонів Коста-Рики, захоплюють, а потім відправляють назад додому на моторошну долю. Розвідувальні служби співпрацюють у питаннях інформації, як і звичайні сили безпеки під час навчань, — усі роблять свій внесок у поліцейський контроль над своїми націями заради Америки."

 #Pro-OFN
 PAN_Red_White_Bright_Blue: "Червоний, білий та яскраво-синій"
 PAN_Red_White_Bright_Blue_desc: "Режими повинні триматися разом, але що робити, коли ти — більмо на оці Центральної Америки? Якщо Центральна Америка — це регіон бананових республік, то Панама — країна Каналу. Тож очевидно, що найближчим геополітичним союзником Панами є держава, якій вона завдячує своєю незалежністю: Сполучені Штати Америки.\n\nОднак це не та сама динаміка, яку мають такі країни, як Нікарагуа чи Гондурас, зі своїми янкійськими господарями — до Панами ставляться прихильніше. Канал збагатив їхню країну, і навіть бідні панамці перебувають у значно кращому становищі, ніж їхні кузени, залежні від волі бананових мегакорпорацій.\n\nВ обмін на їхню лояльність і відданість збереженню американських інтересів Панама отримує допомогу, політичну підтримку та захист. Зрештою, як дві країни можуть ненавидіти одна одну, якщо на їхніх прапорах однакові кольори?"

 #Pro-Veracruz
 PAN_Memories_of_59: "Спогади про '59"
 PAN_Memories_of_59_desc: "Для будь-якої країни Латинської Америки, здається, є лише два варіанти: американці або їхні супротивники. Після Кубинської революції прагнення до революційного самовизначення поширилося, мов лісова пожежа. Панама пам'ятає Серро-Туте та спробу кубинців втрутитися, востаннє народ повстав не заради якогось договору чи положення, а заради шансу принести революцію до Панами. Тепер революція прийшла, і Панама бачить свій третій варіант: Пакт Веракруса.\n\nПанама бачить себе як удома поруч із націями, які нещодавно допомагали її боротьбі. Вперше Панама не є якоюсь маріонеткою чи другорядною думкою стажера або бюрократа в офісі столиці наддержави. Тепер Панама є рівною, і це те, чого не можна купити жодною кількістю допомоги чи інвестицій. Панама — відчинені двері, ласкаво просимо всіх, бо ніхто, крім панамців, не вирішує їхню долю."

 ##Path Specific
 PAN_Coroneles_and_Criollos: "Коронелі та кріольці"
 PAN_Coroneles_and_Criollos_desc: "Серед груп інтересів, що вкривають Панаму, дві, які домінують у її істеблішменті, — це військові та олігархія. Статус Ремона як диктатора є найочевиднішим показником верховенства Національної гвардії, але їхній деспотизм не може бути підтримуваною кінцевою метою. Тож, поки військові тримають батіг, олігархія тримає пряник.\n\nПереважно біла олігархія роздає достатній рівень добробуту, щоб тримати маси покірними, підбурена прогресивними настроями Ремона. По обидва боки існує ворожість до цих відносин. Однак їхня симбіотична природа запобігає будь-якому порушенню через інстинкт самозбереження їхніх лідерів, які знають, що одне без іншого гарантувало б революцію."

 PAN_Reinado_de_Chichi: "Правління Чічі"
 PAN_Reinado_de_Chichi_desc: "Колись у Панамі була пора, коли армію було скасовано. Це було зроблено, щоб уникнути її впливу на політичну гегемонію олігархії. Попри їхні зусилля, з часом поліцію було повільно реформовано, а Національна гвардія посіла її місце як армія. Попри всю їхню важку працю заради збереження своєї влади, вони зазнали невдачі, бо тепер шоу ведуть Коронелі.\n\nНа щастя для Сполучених Штатів, цим колишнім офіцерам, кузенам і корумпованим політикам байдуже до будь-якого принципу честі чи незалежності, лише до своєї влади. Для Ремона та його союзників вони вимили задушливу й завзяту олігархію з влади, припинивши відносини, які, на їхню думку, завжди тримали Панаму на межі революції.\n\nХоча олігархія продовжує існувати, вони тримають руки глибоко в кишенях, а роти зашитими, спостерігаючи, як їхнє місце займають чоловіки з шевронами на рукавах."

 PAN_Republica_de_los_Coroneles: "Республіка Коронелів"
 PAN_Republica_de_los_Coroneles_desc: "Колись у Панамі була пора, коли армію було скасовано. Це було зроблено, щоб уникнути її впливу на політичну гегемонію олігархії. Попри їхні зусилля, з часом поліцію було повільно реформовано, а Національна гвардія посіла її місце як армія. Попри всю їхню важку працю заради збереження своєї влади, вони зазнали невдачі, бо тепер шоу ведуть Коронелі.\n\nТа якщо Ремон прагнув балансу, Мартінес не вірить у справи з "товстими мавпами". Ці зрадники віддали Панаму своїм друзям і родичам, водночас дурячи маси розповідями про демократію, щоб відволікти їх від привласнення наших скарбів і гідності. Але не варто хвилюватися, у Мартінеса є рішення.\n\nНе буде ні демократії, ні балансу, буде лише порядок і прогрес. Олігархи можуть іти плакати у свої мішки з грошима, Мартінесу треба виправити країну, і його Національна гвардія буде єдиним правителем Панами."

 #Arias Path
 PAN_Presidente_Para_Panamenos: "Президент для панамців"
 PAN_Presidente_Para_Panamenos_desc: "Панама давно є грою в перетягування каната між двома головними групами інтересів — Національною гвардією та олігархією, але як же народ? Коли Національна гвардія перебуває в цілковитому безладі після протестів проти Ремона, для олігархії було б природно завдати удару й повернути собі панування, а її давній ворог тепер є її людиною.\n\nБудучи поборником націоналістичних настроїв у Панамі, Аріас створив собі образ скромної людини та палкого захисника незалежності своєї нації, щоб привабити бідних і незадоволених Панами, поставивши себе в конфлікт як з олігархією, так і з Національною гвардією.\n\nАле він уклав угоду з олігархією, щоб утриматися при владі. Аріас використає натовпи, що скандують його ім'я, щоб викорінити вплив Національної гвардії. Втретє пощастить, і Аріасу байдуже, якщо олігархія сидить на вершині Панами, адже президентство нарешті належить йому."

 PAN_El_Presidente_Panamenista: "Панаменьїстський президент"
 PAN_El_Presidente_Panamenista_desc: "Аріас зробив це. Від часів вигнання, коли він проголошував "¡Volveremos!", тепер він стоїть на вершині нації без опору. Олігархія тепер стоїть поруч із ним як ватажки Панами. Маси скандують його ім'я, переслідують його ворогів і розмахують прапором як ніколи раніше. Наче ніхто навіть не може згадати, коли Національна гвардія мала право голосу, але чутки про прихильність Аріаса до влади не вщухають.\n\nЧутки, однак, залишаються лише чутками. Тепер Аріас може очолити втілення свого бачення. Добробут для мас і Панама для панамців. Немає потреби тулитися до Вашинґтона. Аріас прагне позбавити свою країну від покидьків, через яких його народ страждає: чорних західноіндійських та азійських робітників, завезених янкі, які крадуть робочі місця й домівки нужденних Панами.\n\nБільше американські фірми не паразитуватимуть на найродючіших землях, поки місцеві фермери живуть у злиднях. Кожен дюйм Панами служитиме її народу, і лише її народу."

 #Dem Path
 PAN_Republica_de_la_Dignitad: "Республіка Гідності"
 PAN_Republica_de_la_Dignitad_desc: "Після смерті Ремона баланс сил знову змістився до рук олігархів. Після повного домінування на політичній сцені від часу здобуття незалежності слід усвідомити, що не всі олігархи прагнуть влади чи відірвані від свого народу. Навпаки, деякі вивчали політичну думку та використовували свої багатства, щоб інтелектуально збагачувати себе. Таких можна знайти в Національній ліберальній партії.\n\nЇхньою яскравою зіркою є Роберто Франсіско Чіарі Ремон, чоловік, відомий як "Президент Гідності". Твердо вірячи в демократію, він прагне забезпечити, щоб не лише політична сцена Панами була чесною та вільною, але й її міжнародне становище було таким самим.\n\nЙого противники насилу знаходять питання, що розділяє, адже в усьому, у чому вони його звинувачують, вони самі такі. Він може бути проамериканським привілейованим чоловіком, але водночас він може бути найгіднішою людиною, яка досі обіймала президентську посаду."

 PAN_Republica_de_la_Dignitad_2: "Республіка Гідності"
 PAN_Republica_de_la_Dignitad_2_desc: "Після повного домінування на політичній сцені від часу здобуття незалежності слід усвідомити, що не всі олігархи прагнуть влади чи відірвані від свого народу. Навпаки, деякі олігархи вивчали політичну думку та використовували свої багатства, щоб інтелектуально збагачувати себе. Таких олігархів можна знайти в Національній ліберальній партії.\n\nПісля цілковито успішного першого терміну PLN закріпила контроль над політичною сценою Панами. Вони привертають увагу народу, використовуючи масовий добробут і національний розвиток, щоб схилити маси на свій бік. Їхня консолідація надійних демократичних інституцій спричинила їхнє наступне переобрання в процесах, які, вперше за багато років, є вільними та чесними.\n\nНаціональна ліберальна партія зробила неможливе: вона взяла республіку, розколоту між олігархічними бізнесменами та полковниками, і створила республіку гідності."

 PAN_Downsides_of_Democracy: "Недоліки демократії"
 PAN_Downsides_of_Democracy_desc: "Національна ліберальна партія змогла зруйнувати систему сомосистського зразка, що існувала за Ремона. Вони змогли консолідувати демократію, але не свою владу. Влада в Панамі більше не походить від того, кого ти знаєш, або від кількості солдатів, якими ти командуєш, тепер вона походить від голосів, а Національна ліберальна партія та її олігархи втратили свій мандат.\n\nПрийшовши до влади на хвилі антиамериканських настроїв, Бойд використав демократію, спонсоровану Сполученими Штатами, щоб перетворити її на їхнього ворога. Консервативний сильний правитель, який проголошує традиційні заяви, властиві кожному латиноамериканському Каудильйо, захопив народ Панами, переключивши його увагу на Канал.\n\nПопри всю свою роботу, PLN та їхні підтримувані Америкою олігархи не врахували недоліку демократії: попри всю кампанію та роботу, яку можна вкласти, у власній грі завжди можна програти."

 PAN_El_Proximo_Domino: "Наступне доміно"
 PAN_El_Proximo_Domino_desc: "Після Кубинської революції 1959 року світ побачив, як народ може об'єднатися та викорінити зі своєї країни сильних правителів. Коли революційний запал прокотився регіоном, уперше він досяг берегів Панами у квітні '59. Повстання було придушено, але кулі не можуть убити ідеї. Коли американський вплив було розбито падінням Ремона, наступні вибори призвели до революції через виборчі бюлетені.\n\nФлойд Бріттон, уцілілий учасник експедиції, стоїть на чолі нації, яка довго зазнавала гноблення, і є лише один спосіб це виправити: знизу вгору. Вже натовпи лівих, антиамериканських студентів заповнюють вулиці, а ополченці входять до фірм олігархів і оголошують їх націоналізованими.\n\nОфіцери Національної гвардії опиняються звільненими, якщо вони ще не втекли. Панамське суспільство буде перевернуте догори дриґом, адже ним правитиме не олігарх і не солдат, а проста людина."

 PAN_Una_Revolucion_Cultural: "Культурна революція"
 PAN_Una_Revolucion_Cultural_desc: "Панама ніколи по-справжньому не мала власної країни. Її народ завжди був задушений або бляшаними диктаторами, або олігархами, які сміялися з мук свого народу. Як народна революція може задовольнитися системами країни, яка ніколи не була для народу? Флойд Бріттон не якийсь зрадник. Він лідер Панамської революції. Він і його країна не будуть зупинені законами, нав'язаними їм речниками янкі.\n\nЗміни прийдуть до Панами. Ополченці Бріттона вирвуть пам'ять про гвардійців і надбагатих та повернуть їхні багатства народу. Янкі вже достатньо висмоктували кров із цієї країни, і Панама більше не терпітиме цього ані секунди.\n\nВід часу повстання в Серро-Туте Бріттон чекав, щоб розірвати ланцюги, які тримають його народ під пануванням, і він не дозволить минулому зрадити його мрію про вільну Панаму."

 PAN_A_Calm_Revolution: "Спокійна революція"
 PAN_A_Calm_Revolution_desc: "Політична сцена Панами давно є хаотичною трагедією олігархів, гвардійців Національної гвардії. Американська гегемонія над країною бачила при владі лише нелегітимних диктаторів або зрадників, породжуючи опозицію, яка вибухала крайнощами, коли отримувала шанс правити. Де це залишає народ, вічних жертв панамських президентств? Без шансу обрати власну долю.\n\nPdPdP прагне принести до Панами зміни, натхненні Кубинською революцією, без Каудильйо та з перевертанням політичних систем нації догори дриґом. Приборкати надмірності Національної гвардії та надягнути намордник на олігархів. Надмірний запал лише породить диктатора протилежної крайності для Панами.\n\nБільше американці не можуть домінувати над нашою країною, але й ми не можемо закликати до їхніх голів. Зміни прийдуть до Панами, щоб зробити її країною власного народу, але вони мають прийти в межах розумного."

 PAN_Coroneles_y_Calma: "Коронелі та спокій"
 PAN_Coroneles_y_Calma_desc: "Панама давно є какофонією діаметрально протилежних поглядів і скаженої ненависті до політичних ворогів. Олігархи ненавидять Національну гвардію, яка у відповідь зневажає їх. Ремон був надто корумпованим на свою біду. Результатом стало екстремістське захоплення влади, Давид проти Голіята, але життя — не Біблія, і Бог напевно не на боці Панами. Хто поверне реальність? Омар Торріхос.\n\nДосить цих компромісів, які принесли лише загальну ненависть серед кожної групи інтересів у країні. Торріхос пропонує нове рішення: просто дати кожному те, чого він хоче. Він роздає земельні наділи та добробут, щоб тримати народ ситим. Олігархам він дозволяє зберегти їхні підприємства. Американцям? Він залишає Панаму лояльною країною, якої вони завжди хотіли.\n\nМожливо, ще один сильний правитель оскверняє президентську посаду, але вперше за багато років у Панамі панує спокій."

 PAN_Peace_for_Panama: "Мир для Панами"
 PAN_Peace_for_Panama_desc: "Вигляд солдатів у камуфляжній формі, що прогулюються вулицями Панама-Сіті, ніколи не був чимось незвичним. Але в такій мірі? Нечувано. Джипи, бронетранспортери, танки, навіть поліцейські на конях заповнюють вулиці. Навколо них — буркотливі громадяни Панами, вдячні за те, що живі, але засмучені станом своєї країни. Для них Панама — лише плід їхньої уяви.\n\nНаціонального прапора ніде не видно, його заборонено через страх розпалити націоналістичну справу в країні, якщо хтось просто його забруднить. Їхні будівлі носять шрами від осколків і бомб, завдані миротворцями та скаженими захисниками міста. Хоча народ може скаржитися, проклинаючи янкі-окупантів, їх більше турбує те, щоб прожити день за днем. Нікому не важливо, хто при владі, коли на тарілці немає їжі, а в кишенях — грошей."

