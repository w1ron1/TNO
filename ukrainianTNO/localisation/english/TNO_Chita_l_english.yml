 CHT.1.t: "Цар мимоволі"
 CHT.1.desc: "Цар Міхаїл прокинувся, одягнувся й приготувався до зустрічі з Верховним командуванням. Вона мала відбутися у «Великому царському палаці» - розкішна назва для доволі скромної резиденції, куди його поселили.\n\nСівши на чолі столу, Міхаїл спостерігав, як заходять генерали й урядовці. Багато хто був дуже старим, та все ще енергійним і палким: думка про велике повернення Росії Білою армією спонукала їх до дії. Кілька були молодшими - переважно нащадки емігрантів або недавні новобранці. Їм він завжди довіряв більше: вони мислили логічніше й не були так прикуті до далекого минулого старої Імперії.\n\nОтаман Сємьонов відкрив нараду промовою про останні події. Руки тремтіли, він ледве тримав рівновагу, та голос і погляд лишалися кришталево ясними. Один за одним генерали висловлювали думки та занепокоєння. Міхаїл переважно мовчав, лише зрідка давав очікуване схвалення, а його думки були з життям і дружиною, залишеними в Австралії.\n\nПісля наради Міхаїл у супроводі особистої охорони вирішив пройтися вулицями Чіти. Під свіжим снігом місто було мальовничим, а його «піддані» - від дітей до старих - щасливо жили в напрочуд безпечному місті. Він досі почувався ніяково в ролі, якої не обирав, але на мить відчув гордість за цей острівець стабільности, чиїм символом його зробили."
 CHT.1.a: "Від престолу так просто не відмовляються."

 CHT.2.t: "Смерть отамана"
 CHT.2.desc: "Із Чіти, столиці російського монархізму на Далекому Сході, надійшла вкрай сумна звістка. Ґріґорій Міхайловіч Сємьонов, відомий як «отаман», помер природною смертю у 71 рік. Популярна постать у Чіті й цінний союзник царя Міхаїла покинув цей світ, щоб приєднатися до багатьох померлих товаришів.\n\nНароджений у Забайкаллі 1890 року, Сємьонов уперше відзначився в козацьких леґіонах старого царя під час Великої війни. Коли почалася громадянська війна, він організував одні з перших антибольшевицьких повстань у Забайкаллі та за допомогою Чехословацького леґіону й японців захопив Чіту й околиці. Там тримався проти совєтів навіть після розпаду решти білого руху, доки не був змушений утекти до Маньчжурії.\n\nЧерез десятиліття, як провідник емігрантської громади Харбіна, він очолив підтримуваний Японією антибольшевицький фронт і став безперечним головою військової кліки, що коронувала Майкла Андрєєвіча та привезла нового царя до Чіти після тріюмфального повернення.\n\nЗа заповітом отамана поховали в рідному селі Куранжа. Попри небезпечну близькість кордону із соціялістичними революціонерами, тисячі людей - від селян до генералів - прийшли віддати шану. Навіть Його Величність виступив із заявою та висловив співчуття. Для декого Сємьонов лишив суперечливу спадщину, але вся Чіта визнає в ньому сильного й шанованого провідника."
 CHT.2.a: "Він захищав Батьківщину до останньої миті."

 CHT.3.t: "Пропозиція з Чіти"
 CHT.3.desc: "Сьогодні до нашого міністерства закордонних справ надійшла низка пропозицій і прохань із несподіваної адреси - російської Чіти. Місто нині утримують царисти, монархічні спадкоємці харбінського руху, й адміністрація просить великої промислової допомоги: підтримки фабрик і запасних станків. Теоретично можна погодитися в обмін на майбутню послугу, а можна просто відмовити цій зграї з уламкової держави."
 CHT.3.a: "Звісно. Завжди приємно поповнити гаманець послуг."
 CHT.3.b: "Ні, відмовити царистам. Ми й так досить для них зробили."

 CHT.4.t: "Маньчжурська промислова допомога"
 CHT.4.desc: "Сьогодні з маньчжурської столиці надійшла відповідь на наше прохання. Крізь краплі формальности в листі ледве проступав прихований зміст: майбутня промислова допомога царистам Чіти матиме ціну, і не лише грошову. Маньчжури та їхні японські господарі часто торгують послугами - наш уряд уже прийняв це як даність. Рано чи пізно вони, схоже, постукають у двері й попросять сплатити борг.\n\nА поки Маньчжурія, імовірно з дозволу японців, погодилася надати промислову допомогу. Для нас це чудова перемога: вона не обов'язково легітимізує уряд чи принесе політичне визнання, але зміцнить мізерний промисловий випуск і виробництво. Один із найкращих способів перемогти суперників - дати нашому народові більше рушниць, ніж мають вони. Саме для цього ми й використаємо допомогу."
 CHT.4.a: "Коли чекати першого вантажу?"

 CHT.5.t: "Маньчжурія відмовила в допомозі!"
 CHT.5.desc: "Сьогодні ми отримали простого бежевого листа з маньчжурського міністерства закордонних справ. У ньому була відповідь на нашу пропозицію купити промислову допомогу Маньчжурії, а через неї й японців. Односторінковий лист ввічливо відмовляв, але дякував царистам за звернення. Після доповіді потрібним людям його негайно спалили.\n\nМаньчжури відмовили, напевне з волі японських господарів, тож подальший промисловий розвиток доведеться вести власними силами, без чужої допомоги. Це невдача, але не фатальна. Способів фінансувати розвиток і без Маньчжурії досить: підвищити податки, залучити військових до будівництва, поєднати приватний і державний сектори. А поки міністерство закордонних справ зализує рани, можна підготувати пропозиції внутрішнього промислового розвитку."
 CHT.5.a: "Тільки не кажіть Міхаїлові..."

 CHT.6.t: "Повернення глушини"
 CHT.6.desc: "Вийшовши з хатини з вудкою в руці, Кіріл оглянув краєвид. Ще один прекрасний мальовничий день у незайманій сибірській глушині. Решта Росії котилася до пекла, але для Кіріла тут був рай на землі. Принаймні доки він не побачив чорний дим над деревами. Придивившись, чоловік помітив, як далекі дерева падають, а зграї птахів відчайдушно тікають. «Якого біса?!» - вигукнув Кіріл, кинув вудку й побіг з'ясовувати.\n\nНа місці все виявилося гірше. Десятки робітників у касках валили дерева одне за одним, а великі будівельні машини безжально трощили землю. Посеред усього виконроб керував робітниками. Кіріл стиснув кулаки й сердито рушив до нього, не переймаючись можливим порушенням меж. Суворий старший чоловік обернувся до незнайомця з лісу. «Ти хто? Якого біса тобі треба?»\n\n«Я Кіріл. Живу он там і хочу знати, чому ви нищите мій ліс!» Виконроб глузливо хихикнув. «Твій ліс? Це не твоя власність, приятелю, ми перевіряли». Кіріла відповідь явно не задовольнила. «Тут я полюю. Ця земля мене годує! Хто дав вам право прийти й усе роздерти?!» Виконроб зітхнув. «Слухай, ми з Імператорської компанії розвитку. Уряд наказав розчистити місце для будівництва, тож звертайся до них і не марнуй мого часу!» Він відвернувся, і Кіріл зрозумів натяк. Розлючено відступивши, чоловік уже знав, що проведе більшу частину ночі за сердитими листами."
 CHT.6.a: "Жодна земля не сховається від маршу поступу."

 CHT.7.t: "Війна на обрії"
 CHT.7.desc: "Міхаїл II стояв за дверима, крізь шпарину в яких добре було чути голоси. Його генерали проводили нараду, а цар вирішив, що перебивати неввічливо, й лишився слухати ззовні.\n\nПершим заговорив упізнаваний голос генерала Леоніда Мустафіна. «Фашистські ополчення мене не надто турбують, але, як я розумію, Матковскій набрав велику армію найманців. Вони досвідчені й можуть завдати нашим солдатам справжнього клопоту».\n\nПочувши натяк на швидкий конфлікт, Міхаїл мимоволі занепокоївся. Невже війна прийде так скоро?\n\nДругим озвався Боріс Шепунов, начальник штабу армії. «Не погоджуся, Леоніде. Найманці хочуть воювати з бандитами, а не справжніми арміями. Побачать наших солдатів - розбіжаться й кинуть фашистів напризволяще. А ця наволоч не матиме проти нас жодного шансу!»\n\nУ Міхаїла впало серце. Підозри підтвердилися: хай чого він хоче, його мале царство йде на війну. Цар так наполегливо намагався не думати про всі жахливі наслідки для себе, що випадково штовхнув двері.\n\n«Усе це добре, - мовила третя постать, генерал Владімір Абрамов, - але ми досі не маємо пляну окупації цих земель. Як ви пропонуєте...» Побачивши володаря, Абрамов урвався, і всі генерали повернулися до Міхаїла.\n\nПершим заговорив Шепунов. «Ваша Імператорська Величносте, у нас чудові новини!»"
 CHT.7.a: "Перо відкладено, час оголити меч."

 CHT.8.t: "Затишшя перед бурею"
 CHT.8.desc: "Довгий час погано позначений кордон між Забайкальським князівством і землями Россійской Фашистской Партії майже не бачив руху. Тепер усе змінилося. Ніби за одну ніч царські війська розгорнули значні сили, будують дороги, склади боєприпасів та інше й відкрито готуються до збройного конфлікту.\n\nКапрал Фєдоровіч не був дурнем. Він знав, що це не показові навчання й незабаром його частина піде в бій. Щоб заспокоїти нерви, почав більше курити, але не міг позбутися думки, що не доживе до наступного місяця. Зробивши довгу затяжку й почувши кроки, Фєдоровіч підняв голову й побачив командира відділення.\n\n«Доброго ранку, капрале, - сказав сержант. - Маєш вогника?» Фєдоровіч кивнув і підпалив цигарку. Сержант глянув на схід, за малий струмок, який правив за кордон, до далеких гір. «За тією річкою земля, повна орд розлючених фашистів». Капрал мовчки дивився туди ж. «Брехати не буду, буде тяжко. Вони кинуть на нас усе, що мають, і ми зазнаємо втрат. Цього не уникнути, тож готуйся, доки можеш. А якщо настане час, забери із собою якомога більше фашистів».\n\nСержант кинув цигарку, востаннє глянув на гори й повернувся до людей. Фєдоровіч був вдячний за коротку розмову, але тривога не минула. За обрієм чекала смерть, а він не був готовий її зустріти."
 CHT.8.a: "Напруга нестерпна."

 CHT.9.t: "Страта Константіна Родзаєвского"
 CHT.9.desc: "Константін Родзаєвскій востаннє оглянув довколишній світ. Його улюблений Сибір був прекрасний як завжди, і кращого дня для страти полонителі не могли обрати. Дорогою до місця страти він зірвав голос криками, й тепер у кожній рисі лишилася тільки лють. Кати безперечно її бачили.\n\n«Константін Родзаєвскій, маєте останнє слово?» Почувши старшого ката, Родзаєвскій знову звернув увагу на людей, чиї рушниці дивилися просто на нього.\n\n«Так. Маю». Хворе горло ледве утворювало слова. «Усе, що я робив, робив заради Росії. Можете називати мене чудовиськом, та невдовзі народ зрозуміє: лише чудовиська досить сильні, щоб урятувати цю країну. Можливо, якби я свого часу вбив того здохляка Сємьонова й решту забутих реліквій іще в Харбіні, ми опинилися б у зовсім іншому становищі, еге ж?» Демагог болісно захрипів сміхом і випростався, наскільки міг. «Ну ж бо, порадуйте слабкого царя й нарешті стріляйте».\n\nЗлива рушничного вогню влучно поставила крапку в глузливих останніх словах Родзаєвского. Колишній фашистський провідник упав на коліна, а потім обличчям у закривавлений сніг. Так його рух завершився саме тим, чим жив усі ці роки: нестримним, гірким насильством."
 CHT.9.a: "Можливо, на російському Далекому Сході є справедливість."

 CHT.10.t: "Життя під владою царя"
 CHT.10.desc: "Софія обережно йшла тротуаром, намагаючись не привертати уваги й донести продукти додому. До війни ходити вулицями Зеї було небезпечно, й причин чекати змін вона не бачила. Ще кілька хвилин - і вже буде видно її будинок...\n\n«Перепрошую, пані. Можна вас на хвилинку?» Голос позаду зупинив Софію. Напевне солдат: жоден цивільний у Зеї не звернувся б до іншого на вулиці так невимушено. Повільно обернувшись, вона побачила молодого царського солдата. Однострій був іншим, але рушниця за плечем за фашистського режиму стала символом гноблення й насильства, і Софія подумки готувалася до найгіршого.\n\n«Вибачте, пані, я побачив вашу торбу й подумав, що ви знаєте, де бакалія». Він винувато всміхнувся. «Це місто як лабіринт». Приголомшена ввічливістю, Софія обережно відповіла: «З-звісно, на розі наступного перехрестя. Ідіть тротуаром, звідки я прийшла, не пропустите». Солдат кивнув і рушив за вказівкою. «Дякую, пані. Продовжуйте».\n\nКоли він пішов, Софія полегшено зітхнула й поспішила до квартири. За фашистів така мирна розмова була неможлива - вони були радше бандитами, ніж солдатами. Озброєні люди досі стежили за кожним кроком, і це лякало, але, можливо, все змінювалося на краще?"
 CHT.10.a: "Час покаже..."

 CHT.11.t: "Питання якутської автономії"
 CHT.11.desc: "Як і очікувалося, під час «ворожого поглинання» Якутії війська майже не зустріли опору, й тепер величезна територія перебуває під захистом Забайкальського князівства та царя. Треба вирішити, що з нею робити. Якутія велетенська й густо вкрита лісами, а наше військо надто мале для жорсткого контролю.\n\nЦар Міхаїл, незвично порушивши звичну мовчанку, запропонував можливе рішення. Він вважає, що компроміс забезпечить стабільність, і доцільно дати Якутску певну автономію в обмін на присягу підтримувати нас.\n\nЧи мудро створити дружній якутський уряд, чи краще безпосередньо приєднати землі?"
 CHT.11.a: "Створимо вірний окупаційний уряд."
 CHT.11.b: "Тепер їхні землі належать нам."

 CHT.12.t: "Спрямування бюджету"
 CHT.12.desc: "Наша молода Імперія має обмежені ресурси, тож доведеться робити тяжкий вибір. Треба вирішити, який сектор отримає більшість державних коштів. Можна спробувати втримати рівновагу, але це загрожує неприйнятним розпорошенням ефективности.\n\nЦар Міхаїл висловився за фінансування так званих лоялістів. Вони хочуть розвивати інфраструктуру Чіти й розширювати промислову базу. Та для цього доведеться забрати дуже потрібні кошти у війська - небезпечна перспектива у відчайдушні часи.\n\nМіністр фінансів Іван Міхайлов разом із генеральним штабом запропонував інше. Вони вважають, що цивільні видатки не мають бути пріоритетом до об'єднання регіону, а всі можливі кошти слід спрямувати військовим. Цивільний бюджет короткочасно постраждає, але могутня армія може бути необхідною для зміцнення становища."
 CHT.12.a: "Цивільній промисловості потрібна підтримка."
 CHT.12.b: "Військовим, звісно."

 CHT.13.t: "Страта Валєрія Сабліна"
 CHT.13.desc: "«Останнє слово, большевику?»\n\nВалєрій Саблін, нині розпатлана й переможена тінь колишнього себе, підвів очі на полонителів. Рушниці дивилися просто на нього, й сумнівів у намірах не було. «Говори, червоний! Іншої нагоди не буде!» Цього разу Саблін вирішив потішити їхні глузливі вимоги. «От до чого все дійшло. Війну програно, а я помру в цьому курному підвалі за всі клопоти. Смішно: завжди думав, що мене стратить НКВД, а не якісь царські реліквії». Він спробував випростатися й глянути катам у вічі. Після ув'язнення майбутній революціонер дуже ослаб, і це було тяжче, ніж здавалося.\n\n«Ви, царські виродки, думаєте, що моєю смертю спините революцію? Нічого не навчилися? Народ Росії ніколи не прийме реакційного монарха. Невдовзі він знову згадає, чому сталася революція, і тоді хтось інший посяде моє місце й помститься за мене та товаришів. Робіть найгірше, але знайте: щоб зламати революційний дух народу, самої моєї смерти замало! Це ще не кінець, не...» Нетерплячі царські кати без попередження відкрили вогонь і завчасно урвали зухвалу останню промову Сабліна.\n\nУдари куль відкинули його до стіни. Тіло сповзло на підлогу, й молодий революціонер зробив останній подих. Страта Сабліна завершила трагічну історію соціялістичного руху на російському Далекому Сході та символічно проголосила піднесення білого руху."
 CHT.13.a: "З гуркотом і скавчанням."

 CHT.14.t: "Царські диверсанти!"
 CHT.14.desc: "Жахливі новини! Нещодавно хоробрі фронтовики почали доповідати про зникнення важливих припасів. На розслідування вислали розвідників, адже наші солдати, переважно нужденні селяни, нерідко привласнюють частину для себе та родин. Та знахідка була значно тривожніша.\n\nПрипаси не крали - вони взагалі не прибували! Виявилося, що групи царських солдатів якимось чином прослизнули крізь фронт і закріпилися в нашому тилу, щоб перехоплювати та зривати постачання. Уже виконуються резервні пляни з придушення цієї малої проблеми, але шкоди завдано, й багато наших бійців лишилися без потрібних припасів."
 CHT.14.a: "У них досі є віра."

 CHT.15.t: "Наступний крок"
 CHT.15.desc: "Цар Міхаїл II сперся на оздоблені поручні балкона й задумливо дивився на замерзлу Чіту. У кімнаті за ним уже вирувало надзвичайно святкове й надзвичайно гучне гуляння на честь «його» перемоги над іншими правителями російського Далекого Сходу. Почувши кроки, Міхаїл обернувся й побачив дуже задоволеного собою Боріса Шепунова.\n\n«Міхаїле! - гукнув той. - Чому стоїш тут сам? Ходімо до нас!» Цар похитав головою й знову повернувся до балкона, а Шепунов став поруч. «Міхаїле, що сталося?» Веселощі зникли з обличчя генерала. «Останнім часом ти такий відсторонений. Поясниш?»\n\nЦар трохи помовчав. «Борісе, тепер, коли ми... коли ви перемогли, що буде зі мною?» Шепунов також замовк. «Що буде? Ти правитимеш Далеким Сходом, Міхаїле. Як гадаєш, що ми святкуємо?»\n\nМіхаїл знову похитав головою. «Я питаю, що ви та ваші люди збираєтеся зі мною робити?» Шепунов ледь кивнув і пробив його поглядом. «А, розумію. Навіть після всього ти досі хочеш назад до Австралії, так? Говори!» Після довгої паузи Міхаїл відповів: «Ні. Ні, я хочу лишитися тут». Вовча посмішка з приголомшливою швидкістю повернулася на обличчя Шепунова. «Добре. Дуже добре». Він поклав руку цареві на плече й рушив назад. «Ваша доля тут, у Росії, мій володарю. Ніколи не забувайте». Міхаїл дивився, як генерал повертається на свято.\n\nЦар обміркував його слова. Можливо, в чомусь він мав рацію. Його доля справді тут, у Росії. Та він також помилявся. Міхаїл був царем, а цар має вести, а не йти слідом..."
 CHT.15.a: "Можливо, Росія не така вже й погана."

 CHT.16.t: "Дзвінок із Токіо"
 CHT.16.desc: "Міністр закордонних справ Ніколай Ухтомскій нервово барабанив пальцями по столу й дивився на телефон. Було пізно, але він відмовився від сну заради вкрай важливого дзвінка, який мав надійти. Повітря в кімнаті було напружене; чути лише сов за вікном, пальці Ухтомского й старовинний годинник у кутку. Нарешті телефон задзвонив, і Ухтомскій миттю схопив слухавку.\n\n«Ухтомскій слухає».\n\n«Ви отримали нашу телеграму?» Голос говорив досконалою російською, але з виразним японським акцентом.\n\n«Так, - відповів Ухтомскій, - і хочу запевнити: хоча уряд у Зеї змінився, його наміри лишилися ті самі. Звичні контакти продовжать домовленість без змін, але тепер представлятимуть нас. Це прийнятно?» Запала довга тиша, і Ухтомскій насилу стримував нерви.\n\n«Ми мали дуже конкретне порозуміння з попередньою стороною, - сказав голос. - Ваш уряд збирається дотримуватися його... подробиць?»\n\n«Так. Беззастережно».\n\n«Дуже добре. Ми також». Людина на тому кінці раптово поклала слухавку. Ухтомскій відкинувся в кріслі й полегшено зітхнув."
 CHT.16.a: "Початок прекрасних стосунків?"

 CHT.17.t: "Суд над Міхаїлом Матковским"
 CHT.17.desc: "«Міхаїл Алексєєвіч Матковскій, провіднику Россійской Фашистской Партії, вас звинувачено в жахливих злочинах проти Росії та її народу. Що скажете на свій захист?» Матковскій мить мовчав. Він щосили зберігав самовладання й рештки гідности, але обставини заважали. «Я хочу сказати, що ніколи не мав наміру шкодити Росії. Я лише робив те, що вважав необхідним, аби повернути силу й єдність цій зламаній державі. Принаймні мій уряд був значно легітимнішим за цей фарс, який ви називаєте судом!»\n\nМайже всі присутні миттю обсипали його вигуками. Матковскій намагався ухилятися від овочів із галереї, але охоронці тримали міцно. Один з обвинувачів, майже всі з генерального штабу Чіти, скористався нагодою. «Пане Матковскій, як вам напевне відомо, ваш батько хоробро загинув у боротьбі разом із нами проти большевиків у громадянській війні. А чого досяг його син, стоячи тут як обвинувачений воєнний злочинець і фашистський тиран? Міхаїле Алексєєвічу, ви ганьба батьковій спадщині й нашому рухові. Я навіть сказав би, що ви не гідні самого прізвища Матковскій!» Досі зайнятий предметами з галереї, Матковскій зневажливо пирхнув.\n\n«Це безглуздя! Як ви смієте...» Поки пристрасті не спалахнули дужче, суддя кілька разів ударив молотком. «Порядок! Я вимагаю порядку! Міхаїле Алексєєвічу, вас звинувачено в понад десяти тисячах убивств і трьох злочинах проти людяности. Визнаєте провину?» Відповідь нікого не здивувала. «Не винен!» Перш ніж непокора спричинила новий безлад, суд оголосив годинну перерву для визначення вироку..."
 CHT.17.a: "З поваги до батька його помилують, але він ніколи не повернеться до Росії."
 CHT.17.b: "Жодної милости цій потворі! Розстріляти."

 CHT.18.t: "Любий батьку..."
 CHT.18.desc: "«Любий батьку,\n\nМи давно не розмовляли, правда? Раніше я не мав ані нагоди, ані бажання писати, за що щиро прошу пробачення. З роками моє життя ставало дедалі дивнішим, і мені нікому висловити розпач. Ти один із наймудріших людей, яких я знав, і сподіваюся, що зможеш дати нерозумному синові добру пораду.\n\nЯк ти знаєш, після служби в повітряних силах флоту я прожив значну частину життя в Австралії. Це були найщасливіші мої роки, та, на жаль, усе змінилося на гірше. Кілька років тому я отримав запрошення від групи російських емігрантів у Харбіні на бенкет на честь спадщини Романових. Здавалося, це буде миле свято нашого походження.\n\nТа натомість на мою голову поклали корону в місті Чіта, глибоко в сибірських пустках. Коли пишу цього листа, я досі в Росії, через багато років після від'їзду до Харбіна, Імператор держави, якою зовсім не хочу правити. Це місце жахливе, батьку. У мене немає справжньої влади, а цим старим білим байдуже до мене й мого добробуту. Їм потрібне лише моє ім'я, щоб легітимізувати варварські війни та наступні звірства. Коли я намагаюся щось вирішити, вони дивляться на мене, ніби в мене три ока. Ця земля холодна й сувора, я щодня сумую за Австралією. Серце болить, коли думаю про дружину, яку лишив.\n\nБатьку, лише до тебе я можу звернутися. Я замкнений у золотій клітці на чужій землі й не знаю, що робити. Якщо нічого іншого, прошу лише пробачити сина за дурість, яка завела його в таке становище»."
 CHT.18.a: "«Підпис: Майкл»"

 CHT.19.t: "...Підпис: Майкл"
 CHT.19.desc: "«Любий батьку,\n\nНа попереднього листа відповіді не було, і я мимоволі думаю: або він не дійшов, або ти надто розчарований у синові, щоб відповідати. Я не звинувачую. Мій учинок був дурним і глибоко негідним людини мого становища. Я мав знати краще. Мав зробити кращий вибір. Та зробленого не повернеш, і тепер лишається зустріти пекло, яке я сам створив.\n\nЗнову щиро перепрошую, що обтяжую тебе своїми проблемами, але мені справді більше ні до кого звернутися. Ця земля чужа й жорстока. Друзів немає, лише юрби мерзотників, які вдають повагу на людях і напевне глузують за спиною. Я живий ходячий жарт. Вони називають мене царем, та всі знають правду. Я маріонетка, порожня постать.\n\nТепер я переконаний, що Росія - одне з найгірших місць на землі. Ночі довгі, зими ще довші, а люди дратівливі й жорстокі. Я по-новому поважаю предків, яким якось удалося тримати це забуте Богом крижане пекло під контролем. «Мої» армії здобули багато перемог, та я не можу поділяти їхнього захвату. Як я можу? Вони стверджують, що воюють за мене, але це неправда. Вони б'ються не за мене, а за ідею, яку я нібито представляю, і за людей, що тримають мене в полоні.\n\nЯ відчайдушно хочу поїхати, але не можу. Це домашній арешт під іншою назвою; для цих реліквій я лише уславлений домашній улюбленець. Благаю: якщо не можеш пожаліти, то хоча б скажи, як витягнути щось добре з цієї ями»."
 CHT.19.a: "«Підпис: Майкл»"

 CHT.20.t: "Самотній вечір"
 CHT.20.desc: "Царський палац був самотнім місцем, особливо вночі. Коли Міхаїл тільки оселився, усе було інакше. Ранній сон переходив у ранній ранок, і він майже не помічав величезної порожнечі. Але дні стали місяцями, місяці - роками, і все змінилося. Пізні безсонні тихі ночі зливалися з млявими самотніми днями. До палацу привозили дедалі більше алкоголю, й усі знали, хто його п'є. Були охоронці, звісно, безликі діти емігрантів, та Міхаїл не міг назвати жодного на ім'я.\n\nОднієї з довгих безсонних ночей, сповнених сумнівів і жалю, безвладний цар сидів у кріслі й дивився в темне вікно. Назовні нічого не було видно: ліхтар зламався, а яскраве світло палацу так контрастувало з чорною ніччю, що Міхаїл бачив лише відображення. Його думки часто блукали, але сьогодні він думав тільки про батька. Той ніколи не схвалював поїздки до Харбіна й навіть благав не їхати. Міхаїл не раз писав йому - майже десяток листів. Та не отримав жодної відповіді.\n\nКолись вони були близькі, але оглушлива мовчанка батька зламала Міхаїла ще дужче. Тримаючи склянку спиртного, він думав, чому немає відповіді. Покарання за від'їзд? Можливо, батько переїхав і не отримав листів? У голові постала страшна думка: може, батькові просто байдуже. Міхаїл одним ковтком допив коричневу рідину - напевне, першу з багатьох склянок. Він сумував за батьком. За домом і родиною. Думки зійшлися на одному: ще один лист."
 CHT.20.a: "Сьогодні цар напише останнього листа."

 CHT.21.t: "Викриття"
 CHT.21.desc: "«...і після всього сказаного, любий батьку, це буде мій останній лист. Попри всі спроби до тебе достукатися, продовжувати, схоже, марно. Ти й мати лишаєтеся в моїх думках і молитвах.\n\nЗ любов'ю, нині й навіки,\n\nМайкл Андрєєвіч Романов».\n\nЦар Міхаїл сидів у особистих покоях і дивився на конверт з останнім листом батькові. Ванільний папір було майстерно заклеєно - плід царської вправности й турботи. Він тяжко, довго зітхнув, як людина перед доленосним рішенням. Обережно взяв лист зі столу й пішов шукати секретаря Фєдора Орлова.\n\n«Пане Орлов...?» - тихо спитав Міхаїл, відчинивши двері. Орлов сидів за столом зовні й підвівся. «У мене... ще один лист батькові. На інші він не відповів, але я мусив написати знову. Ви подбаєте про нього?»\n\nОрлов подивився на лист і простягнув руку, та зустрівши царський погляд, не зміг приховати провини. На очах молодого чоловіка виступили сльози. «Що таке, Фєдоре?» - запитав цар. «О, мій царю, я вчинив із вами страшну несправедливість...»\n\nОрлов розповів усе: Шепунов давно платив йому, щоб листи Міхаїла йшли не на пошту, а до нього. Не раз секретар навіть бачив, як генерал їх палив.\n\nПочувши це, Міхаїл відчув те, чого не відчував давно: лють. «Розумію, Фєдоре. Дякую». Листа він не віддав. Натомість розвернувся, повернувся до покоїв і до кінця дня не озвався."
 CHT.21.a: "Іскра почуття в тиші пригнічення."

 CHT.22.t: "Ранкова розмова"
 CHT.22.desc: "Міхаїл II провів ранок, блукаючи садами маєтку й поринувши в думки. Недавні викриття завдали цареві великого болю, і тягар на душі був важчим, ніж звичайно. Чи є бодай одна людина, якій можна довіряти?\n\n«Доброго ранку, Ваша Величносте!» Знайомий голос урвав роздуми. Міхаїл обернувся привітати міністра фінансів Івана Міхайлова. «Яка приємна несподіванка, - сяяв той. - Величносте, приєднаєтеся? Ранкова прогулянка краща з компанією». Цар не до кінця розумів, чому міністр без запрошення в його приватній резиденції, та кивнув, і вони рушили разом.\n\nСхожі думками й поглядами, вони говорили так, що хвилини минали за секунди, й невдовзі перейшли до політики. «Присягаюся, - почав Міхайлов, - іноді я радше кинувся б у Байкал, ніж далі торгувався з нашими генералами».\n\nМіхаїл коротко й нервово озирнувся. «Напевне, могло бути гірше. Більшість днів вони взагалі не випускають мене з дому».\n\nМіхайлов сповільнився. «Багато що в цій землі просто не має сенсу, Величносте. Військо має ще більший вплив, ніж ви думаєте». Він зупинився й сам нервово озирнувся. «О, боюся, я сказав забагато, мій царю. Мені треба йти, перш ніж мене не помітять. Нам варто знову поговорити, бажано в менш помітних обставинах».\n\nЗнову сам у саду, стривожений цар розгубився ще більше."
 CHT.22.a: "Інтрига густішає."

 CHT.23.t: "Вечірня трапеза"
 CHT.23.desc: "«Скажіть, Ваша Величносте, - спитав Іван Міхайлов, занурюючи ложку в суп, - якою була Австралія? Ви майже ніколи про неї не говорили».\n\n«Хочете правду, Міхайлов?» Голос царя звучав значно агресивніше й владніше, ніж завжди, і це приголомшило міністра. «Порівняно з цим Австралія була раєм. Я ненавиджу це місце, Іване. Знаєте, що найгірше? Я не можу поїхати. Хоч як стараюся, виходу немає».\n\nМіхайлов остовпів, ложка випала з руки. «В-ваша Величносте, я...»\n\n«Досить! - заревів Міхаїл. - Мені набридло вдавати, що все гаразд, бо це не так. Я навіть не можу писати родині, ви знали? Нещодавно я дізнався, що секретар віддавав усю пошту Шепунову! Невже ви не розумієте?! Мене тримають заручником у країні, де всі за мною шпигують, тут надто холодно, і я навіть не можу нормально говорити мовою!» Міхайлов мовчав із розкритим ротом. На кілька митей цар ніби став іншою людиною. Трохи згодом Міхаїл заспокоївся. «Я... страшенно перепрошую. Це було дуже негідно».\n\n«Ні, Ваша Величносте. Ви кажете правду. Сумно, коли навіть святий володар Росії - лише раб примх своєї армії. Ви цар, Імператор всея Руси. Військові вдають, що це нічого не означає, але вони забули своє місце. Бог дав вам долю вести, а вони зобов'язані йти слідом». Запала довга тиша. «Можливо, ви ненавидите не Росію, мій володарю, а тих, хто егоїстично скористався її славною спадщиною. Вашою спадщиною».\n\nЦар дивився вдалину, а в голові вирували могутні думки. «Можливо»."
 CHT.23.a: "Насіння змови посіяно."

 CHT.24.t: "Око за око"
 CHT.24.desc: "Генріх Ягода, який роками наказував стратити незліченних людей, знав, що буде. Знав від миті, коли надійшли доповіді про розвал позицій Червоної армії за Іркутском. Невдовзі ввійшла Біла армія.\n\nНаступні дні він провів у камері - одній із власних, - поки далеко нагорі вирішували долю. Це тривало довше, ніж він думав, напевне через заплутаний і неефективний білий уряд, про який колись доповідала НКВД. Та насправді можливий був лише один вибір. І його нарешті зробили.\n\nКоли двері відчинилися, Ягода підвівся. Він вирішив зустріти кінець якомога гідніше, не як численні нібито сильні люди, що падали в первісний жах перед смертю. Та його однаково міцно схопили, повели підземними коридорами й сходами, а тоді вивели у двір, де перед стіною стояв стовп. Поруч чекала велика група солдатів та офіцерів.\n\nЗабагато людей, подумав Ягода. Недарма він наказував розстрілювати в темному підвалі: ніхто не знав, що сталося, а отже, не міг створити мученика. Думка, що його ім'я переживе цю мить, була слабкою втіхою. Та все ж втіхою.\n\nКоли його прив'язали до стовпа, Ягода відчув незнане раніше. Не страх, а тривогу. Тривогу перед тим, що буде далі. Він замислився, чи всі в такому становищі відчувають те саме.\n\nТоді пролунала команда, й Ягода більше нічого не відчув."
 CHT.24.a: "Тріюмф, якого чекали десятиліттями."

 CHT.25.t: "Суд над єретиком"
 CHT.25.desc: "Прагнучи об'єднати Далекий Схід, Біла армія очікувала й готувалася воювати з комуністами та фашистами. Вона не очікувала й не готувалася до релігійних фанатиків із півночі.\n\nТа воювати довелося. І перемогти теж. Попри дезертирство у власних лавах, селянські повстання в тилу та справді тяжку місцевість, фанатиків було розбито в полі. А захопивши Омолон, армія полонила й їхнього провідника - загадкового священника Александра Мєня.\n\nЗа рішенням центрального уряду Мєня віддали під суд, але процес виявився значно тяжчим, ніж гадали. Бо Мєнь не говорив. Жодного слова. Він мовчав під час досудових клопотань, вступних промов, подання доказів, перехресного допиту й усього іншого.\n\nЦе створювало проблеми для всієї держави. Настрої, до яких звертався Мєнь, досі жили в багатьох селянах, а без його відповіді суд дедалі більше скидався на показовий. Якби його визнали винним, як і плянувалося, та належно покарали, багато хто безперечно зробив би з нього мученика. Цього не можна допустити заради стабільности.\n\nТож рішення ухвалили й передали належним чином. Мєня визнають винним за частиною звинувачень і дадуть довгий строк. Будуть заворушення, але з часом, коли уряд зміцнить внутрішній контроль, люди забудуть про священника, що мовчки гниє в камері.\n\nА тоді вирок легко можна буде подовжити без кінця. Або повернути первісно задуманий."
 CHT.25.a: "Мучеництва не буде."

 CHT.26.t: "Ткач павутиння"
 CHT.26.desc: "Іван Міхайлов здалеку спостерігав, як люди метушаться ринком. Чув вигуки продавців, торги покупців, нерозбірливий гомін натовпу. Так, так! Тут він правив, це були його володіння.\n\nПоки що не цілком - завдяки Сємьонову, Шепунову та подібним. Вони дедалі частіше скасовували його рішення й забирали обов'язки. Можливо, з генеральним штабом він ніколи особливо не ладнав, але вони зайшли надто далеко. Хтось мусив покласти край їхньому контролю, й Міхайлов точно знав хто.\n\nВін сам, звісно.\n\nЯкщо переконати Сємьонова послабити хватку не вдасться, доведеться вдатися до рішучіших заходів. Трохи свободи піде народові Чіти на користь, як і економіці. Навіть якщо його пляни вільної економіки весь час погіршували становище - принаймні якщо вірити наклепам інших економістів.\n\nНеважливо. Треба лише пробувати знову і знову, й урешті він їм покаже.\n\nПокаже всім."
 CHT.26.a: "Хоч би скільки разів довелося починати спочатку."

 CHT.27.t: "Творець царів"
 CHT.27.desc: "Відкинувшись у кріслі кабінету, Боріс Шепунов міркував про близькі зміни. Прокляті фашисти на сході, тричі кляті большевики на заході - два боки тієї самої ненависної монети, обидва прагнуть повалити законний уряд Чіти. Внутрішніх проблем теж безліч: жалюгідний цар, нескінченні заворушення, вічний брак коштів. А ще Шепунов давно зрозумів, що Сємьонов однією ногою в могилі. Справжня купа проблем.\n\nТа це його купа, і він знищить кожного, хто не погодиться.\n\nНавіть якщо, хоч це й малоймовірно, доведеться зустрітися із самим царем.\n\nКоли панування Білої армії, а отже, і його самого, буде забезпечено, а заворушення придушено, довга рука Імператорського закону напевне принесе порядок усьому Далекому Сходу. Лише тоді до Росії почне приходити мир.\n\nА тоді подвійне зло фашизму й большевизму впаде, ніби монети, й Шепунов дивитиметься, як колись на фашистів у Харбіні. Цього разу він подбає, щоб вони лишилися мертвими."
 CHT.27.a: "Коли вони помиратимуть перед ним, він нарешті всміхнеться."

 CHT.28.t: "Молодий генерал"
 CHT.28.desc: "Сидячи за столом, Дмітрій Волкоґонов швидко й плавно дописав останній стос паперів. Запити на озброєння, накази про переведення, навчальні призначення та все інше відданий Волкоґонов розглядав без затримки. Інші після такої праці зробили б перерву, а він без вагань узявся за наступний стос.\n\nВін знав, що старі генерали завалюють його паперами, бо не люблять, і майже цього не приховують. Та це анітрохи не сповільнювало. Зустрівши такі труднощі, Волкоґонов просто мусив перевершити всі сподівання. Якщо завжди робитиме більше, одного дня хтось неодмінно помітить. Єдиною справжньою проблемою було...\n\nМолодий підлеглий офіцер відчинив двері й віддав честь. Волкоґонов підвів очі й одразу відчув, про що йдеться, а з ним і страх. «Пане! Один офіцер напився й побився з цивільним. Він із вашої частини, тож покарання визначати вам».\n\nДовго зітхнувши, Волкоґонов підвівся й рушив до офіцера. Він не знав, зітхає від полегшення, що все не так погано, чи від роздратування, бо це вже третій випадок між солдатами й цивільними за тиждень. Хотілося лише, щоб армія, а особливо генерали на кшталт Сємьонова й Шепунова, схаменулася й зрозуміла: вона має допомагати людям, а не кривдити. «Гаразд. Ведіть».\n\nОфіцер насупився й дивно глянув. «Пане, дозвольте говорити відверто?» Волкоґонов ледь кивнув. «Ви добре спали? Виглядаєте жахливо»."
 CHT.28.a: "День був довгий."

 CHT.29.t: "Сильна людина"
 CHT.29.desc: "Щоб розвіяти думки, Анатолій Собчак ішов вулицями Чіти, щільно загорнувшись у пальто. Він збився з ліку, скільки людей махали, гукали його ім'я чи трохи надто гучно вітали. Остання кампанія на посаду мера справді запалила народ - утім, уся Росія палала від відчаю й прагнула бодай якогось поліпшення. Він і справді хотів покращити якомога більше життів, хоча певні... особи робили це значно тяжчим, ніж мало бути.\n\nНазустріч ішов загін солдатів із рушницями за плечима. Згадай лайно - ось і воно, подумав Собчак. «Ви мер Собчак?» - спитав найближчий солдат, і принаймні запитання звучало щиро. Собчак припустив, що, хоч народ його й знає, солдатам тепер важливіше вивчати імена значніших постатей.\n\n«Так, це я, - люб'язно відповів він. - Щось сталося?» Солдат нічого не сказав, лише сунув папірець, якого Собчак не помічав. Той насупився й уважно прочитав, дедалі ширше розплющуючи очі. «Підвищення податків? Знову?»\n\n«Вибачте», - нещиро й майже нудьгуючи сказав солдат, розвернувся й дав загонові знак іти. Собчак переводив погляд з їхніх спин на папір. Невже його вважають посильним для поганих звісток? Нове підвищення податків у таких умовах було просто жорстоким, коли люди й без того ледве виживали. Хтось мусив покласти цьому край. І швидко."
 CHT.29.a: "Хто насправді керує містом?"

 CHT.30.t: "Передання смолоскипа"
 CHT.30.desc: "«Ви хотіли мене бачити, пане?» Генерал Шепунов стояв у дверях перед командиром. Старий отаман спирався на вишукану тростину й здавався однією ногою в могилі. Роки явно не щадили людину, що колись кинула виклик червоному велетневі.\n\n«Так. Прошу, заходь і сідай», - слабко, майже пошепки сказав отаман Сємьонов. Шепунов сів на курний старовинний диван біля каміна. Старому знадобилося більше часу; кістки аж зарипіли, коли він сів навпроти протеже. «Борісе, говоритиму прямо. У ці дні я вже не маю часу на люб'язності». Сємьонов захихотів і відразу тяжко закашлявся.\n\n«Тоді нас двоє, Ґріґорію. Просто скажи, що треба».\n\n«Борісе, мій час добігає кінця. Мені страшенно соромно, що за життя не побачу Росію очищеною від червоної загрози, та, можливо, зможу спочивати спокійніше, знаючи, що боротьба триватиме». Сємьонов нахилився вперед. «Коли настане час, я хочу, щоб ти посів моє місце».\n\nШепунов утратив дар мови. Він давно йшов слідами Сємьонова, але посісти його місце? «Ґріґорію, для мене це честь, але ти цілком певен, що хочеш саме мене?»\n\n«Я мав десятиліття на роздуми, Борісе. Ніхто не розуміє значення цього руху так, як ми з тобою. Якщо хтось і здатен повернути порядок священній Батьківщині, то ти». Очі Шепунова, сповнені нової мети, зустрілися з отамановими."
 CHT.30.a: "«Я вас не підведу, пане»."

 CHT.31.t: "Зміна варти"
 CHT.31.desc: "Звістка про смерть Ґріґорія Сємьонова сповнила царя Міхаїла II тривогою. Чоловік майже викрав його й привіз маріонеткою до замерзлої Чіти. Та принаймні він був відомою величиною.\n\nМіхаїл знав, де стоїть. Про наступника Сємьонова як виконувача обов'язків прем'єр-міністра й головнокомандувача війська - Боріса Шепунова - цього сказати не міг. Цар, звісно, знав генерала, давнього протеже Сємьонова, й раніше з ним спілкувався, але ніколи в такій політичній ролі.\n\nНа похороні Шепунов говорив велично, прославляючи небіжчика й проголошуючи його велич, напевне вже знаючи, що заповнить вакуум. Міхаїл не сумнівався, що він має не менш величні пляни. Біла армія завжди їх мала, особливо коли йшлося про нього.\n\nТому цього дня, коли він офіційно «запросив» Шепунова перебрати уряд, цар насилу зберігав нейтральний вираз. Уся поведінка генерала змінилася. Він інакше ходив. Інакше говорив. Навіть очі, якщо це можливо, стали ще холоднішими.\n\nКоли Шепунов подякував за «довіру» й рушив виконувати наперед підготовлені пляни, Міхаїл уже не зміг стримати гримасу.\n\nЩо буде далі? І що це означає для нього?"
 CHT.31.a: "Чи буде він іншим?"

 CHT.32.t: "Цар і генерал"
 CHT.32.desc: "«Отже», - промовив Боріс Шепунов, акуратно склавши руки на столі.\n\n«Отже?» - відказав Міхаїл Андрєєвіч, його нова маріонетка, нервово стискаючи бильця крісла.\n\n«Як вам відомо, тепер я ваш тимчасовий прем'єр-міністр і головнокомандувач Білої армії. Також переберу всі інші обов'язки попередника. Не сумнівайтеся, що...»\n\n«Це дуже чудово, командире Шепунов, але я вже давно хотів дещо запитати».\n\n«Так, мій царю?» - спитав Шепунов, і обличчя ледь сіпнулося. Він ненавидів, коли його перебивали, особливо такі людські тхори, як цей.\n\n«Я, е-е, думав: суто гіпотетично, а що, як я, ну, не хочу тут лишатися? У Росії, тобто».\n\n«Що ви таке кажете? Ви цар, ви не можете поїхати». Шепунов підняв брову.\n\n«Мені тут не подобається, Шепунов. Прошу, якщо ви...»\n\n«Одне має бути цілком ясно, ваша „Величносте“. Ви лишатиметеся в Росії, доки ця корона на вашій голові, й я наполегливо раджу забути будь-які думки про втечу від своєї долі». Міхаїл зів'яв перед новим наглядачем і повернувся до звичної переможеної мовчанки. Та мізерна надія, що ще жила в царі-маріонетці, миттєво розсипалася на порох."
 CHT.32.a: "«Цар утомився. Проведіть його до покоїв»."

 CHT.33.t: "Царські найкращі"
 CHT.33.desc: "Єльцов стояв напоготові, не виказуючи жодних почуттів у парадному однострої пліч-о-пліч із п'ятдесятьма іншими людьми перед царем Міхаїлом II. Та за стоїчним обличчям вірности ховався захват. Його, селянського сина, особисто обрали з тисяч - ні, десятків тисяч - до Імператорської гвардії! Єльцов, який лише кілька років тому був рядовим і їв помиї, негідні щура, тепер захищатиме царя власним життям.\n\nРаптом цар з'явився на вершечку високих палацових сходів. Єльцова охопила нова енергія, і йому відчайдушно захотілося вигукнути вірність майбутньому цареві всієї Росії.\n\n«Піддані, - почав цар, і його добре чули всі. - Я...»\n\nКілька секунд там, де мали бути натхненні слова, панувала тиша. «...тут, щоб сказати...»\n\nЄльцов інстинктивно хотів глянути на інших гвардійців, але знав, що перед царем не можна. Та невже лише йому це здавалося дивним?\n\n«Промова», якщо її так можна назвати, тривала ще п'ять хвилин, хоча змісту було найбільше на одну. Часом цар затинався й виправлявся, явно соромлячись.\n\nАле суть була ясна: він, Єльцов, став членом Імператорської гвардії й мусив захищати Імператора життям. І Єльцов був щасливий належати до неї."
 CHT.33.a: "Може, наступного разу промовлятиме хтось інший?"

 CHT.34.t: "Вершники жаху"
 CHT.34.desc: "Вояки РФП на кордоні з Князівством на захід від Маґдаґачі розслабилися й часто виставляли варту лише за кількасот метрів від форпосту.\n\nАні вони, ані офіцери не бачили в цьому проблеми. Сусідні частини Білої армії вміли битися, але рідко вдавалися до особливих маневрів. Тому гуркіт кінських копит у малій долині спершу лише спантеличив. Надто пізно вони зрозуміли, що звук і надто гучний, і лунає з неправильного боку.\n\nКоли кавалерія Білої армії вирвалася з-за дерев, миттю знесла надто близькі пікети й шалено помчала до форпосту, офіцери РФП марно намагалися підготувати оборону. Часу просто не було.\n\nНечисленні вартові не вірили очам. Попри величезну швидкість кавалерія наступала досконалим ешелоном, жоден підрозділ не відставав і не розривав стрій. Наблизившись до периметра, вона вправно розділилася: головні сили перескочили занедбані дротяні загородження, а менші обійшли фланги й відрізали втечу.\n\nПочалася різанина. Цілком приголомшені, вояки РФП гинули на місці або під час панічної втечі від несподівано вправного ворога. Коли все скінчилося, форпост та всі розвіддані було захоплено з мінімальними втратами.\n\nВідходячи на захід, кавалеристи спалили форпост і послали звістку: Біла армія вже не така недисциплінована, як часто була сама РФП. Це справжня професійна сила з відповідною тактикою.\n\nІ невдовзі вона збиралася доводити це дедалі переконливіше."
 CHT.34.a: "Ми скачемо. Вони падають."

 CHT.35.t: "Гроші крутять колесо війни"
 CHT.35.desc: "Як міністр фінансів Князівства, Іван Міхайлов звик, що старші командири Білої армії записуються до нього на зустріч. Або, не рідше, не записуються й однаково приходять. Ця зустріч була другого різновиду.\n\nГенерал із близького кола Сємьонова пройшов повз заступників і секретарів, увійшов до кабінету й зачинив двері. З поведінки Міхайлов зрозумів: хоч чого він хоче, міністрові не сподобається це давати. Та вибору не буде.\n\nПрохання, як він і гадав, було ввічливим. У наступному бюджеті військові «просять» спрямувати більше коштів на їхні ініціятиви. Заради оборони держави й царя, звісно. За мить перед ним поклали дозвіл на перерозподіл із ретельно вказаними сумами та напрямами. Бракувало лише підпису внизу.\n\nПід поглядом генерала Міхайлов знав, що підпише, і підписав. Той миттю забрав документ і пішов без слова. Коли двері знову зачинилися, міністр відчув звичне глибоке роздратування.\n\nЦього разу воно було сильнішим. Військові завжди забезпечували першість у бюджеті Князівства, та останнім часом їхні «прохання» почастішали й зросли. Якщо так триватиме, Міхайлов не знав, де цивільний уряд братиме гроші на будь-які великі проєкти.\n\nНе знав він і чи хвилює це військових."
 CHT.35.a: "Як далеко вони зайдуть?"

 CHT.36.t: "Жест доброї волі"
 CHT.36.desc: "Чіта ніколи не була й нині не є багатим містом. Тож звістка про відкриття нової лікарні потішила людей. А коли стало відомо, що відкриватиме її сам цар, вони зацікавилися й вийшли величезними юрбами.\n\nТому Міхаїл прибув до значно, значно більшого натовпу, ніж очікували. Звісно, не сам: міністр фінансів Міхайлов і мер Собчак також були тут і виголосили промови перед його виступом, але з кожним словом його тривога лише зростала.\n\nМожливо, він не хотів бути в Чіті царем-маріонеткою колись бездержавної армії, та доки лишався, прагнув показати себе якнайкраще. Єдиною проблемою промов була його російська. Точніше, майже повна відсутність досвіду говорити нею.\n\nПіднявшись на трибуну під несподівано палке вітання, Міхаїл витяг промову й почав нервово, але дедалі впевненіше. Аж доки не зрозумів, що пропустив слово. Потім друге. Третє. В раптовій паніці він ніби геть забув російську.\n\nНа щастя, мер Собчак помітив біду. Втрутившись, він подякував Міхаїлові за звернення до підданих і цим дав нагоду зійти зі сцени.\n\nВідходячи з великим полегшенням, Міхаїл знову здивувався оплескам услід. Попри те, що сталося кілька секунд тому, на обличчі з'явилася усмішка. Можливо, він однаково дав людям потрібне."
 CHT.36.a: "Принаймні він старається."

 CHT.37.t: "Малий шматочок пекла"
 CHT.37.desc: "Люди Білої армії бачили багато чого в кампаніях проти амурських фашистів. Але не були готові до сьогоднішньої знахідки.\n\nФашисти на межі цілковитої поразки вночі покинули позиції й утекли рятуватися. Просуваючись за їхню колишню оборону, підрозділ побачив те, що через дротяну огорожу та спостережні вежі спершу прийняв за укріплений склад. Вежі були порожні, тож мала група добровольців під пильним наглядом зламала головну браму. Невдовзі вони повернулися, білі як полотно. Решта швидко зрозуміла чому.\n\nЦе був не склад. Це був табір для всіх, кого режим Родзаєвского вважав небажаними: політично, соціяльно, етнічно, релігійно чи з будь-якої причини. Колишні охоронці втекли з товаришами, але покинули в'язнів.\n\nТіні, що рухалися, були радше скелетами, ніж людьми. Вони блукали в заціпенінні й ніби не впізнавали у визволителях людей. Не один у первісному жаху тікав від самого вигляду однострою. Двоє померли, об'ївшись даною солдатами їжею, перш ніж медики встановили суворі порції.\n\nТа найгірше сталося, коли молодий капрал знайшов могили - такі величезні, що фашисти попри старання не могли їх приховати. Капрала знудило, він знепритомнів, і до тями приводили довго.\n\nКомандир підрозділу поспішно вимагав заміни. Він хотів якнайшвидше забрати людей із цього пекельного місця.\n\nБо не знав, скільки ще вони витримають."
 CHT.37.a: "І ми колись називали цих потвор союзниками?"

 CHT.38.t: "Та сама робота, інші обличчя"
 CHT.38.desc: "Життя найманця безперечно небезпечне, але так само напевне сповнене пригод і подорожей. Саме тому Ернесто ним і став. Не завадили й гроші - значно більші, ніж можна заробити в рідному Перу.\n\nЯк і багато інших, він чув про можливості в Росії. Режим у порту Маґадана тиснули вороги, й він покликав іноземних бійців. Прийнявши початкову виплату, Ернесто за кілька тижнів зійшов із корабля в зовсім незнану землю.\n\nПравду кажучи, роботодавці йому не подобалися, але платили добре й вчасно, а цього вистачало. Він отримав і бажані пригоди, швидко вивчив російську для розмов із місцевими та кращого розуміння криків солдатів, коли все ставало гаряче.\n\nА ставало дуже гаряче. Наймаючи Ернесто, роботодавці не сказали, що він битиметься не з повстанцями, а зі справжньою армією. Білою армією. Вона швидко перемогла тих самих роботодавців. Та Ернесто вижив, стратегічно дезертирувавши, коли наслідок став ясним. Звісно, після останньої платні.\n\nСпершу він думав, що потрапив у біду, та почув добру новину. Новим господарям Маґадана потрібні люди для охорони території, і вони готові платити. До кінця дня Ернесто знову мав найманський контракт, обережно не згадуючи, що лише тиждень тому стріляв у нових роботодавців. Він сподівався, що цей контракт триватиме довше.\n\nА якщо ні, завжди можна знову дезертирувати. Після останньої платні."
 CHT.38.a: "Доки платять."

 CHT.39.t: "Пропозиція царистів"
 CHT.39.desc: "Ми отримали пропозицію царистів із Чіти. Вони вимагають мирної капітуляції та приєднання до їхніх володінь, натякаючи, що в разі відмови будуть змушені оголосити війну.\n\nМи завжди пишалися незалежністю, та вона може бути недовгою. Згода, можливо, найкращий вибір, і так можна сподіватися на більші права. Царисти безперечно не приймуть відмови, а наше військо навряд чи їх відіб'є.\n\nТа ми все ще можемо боротися за незалежність. Шансів мало, але чи справді краще здатися? Багато хто проти, тож, можливо, ліпше померти з честю, ніж у ганьбі. Хто знає, може, шанс на перемогу все ж є."
 CHT.39.a: "Прийняти угоду й сподіватися на більші права."
 CHT.39.b: "Ми так легко не здамося!"

 CHT.40.t: "Якутск погоджується"
 CHT.40.desc: "На щастя, Якутск прийняв пропозицію приєднатися в обмін на більші права. У разі відмови він навряд чи став би складним ворогом, та багато хто радий, що ми не марнуватимемо потрібне спорядження та людей.\n\nЗ Якутією під нашим контролем об'єднання Далекого Сходу стало ще ближчим. Армії можна відправляти на захід до Іркутска й Бурятії та далеко на морозну північ. Та спершу треба інтегрувати нові володіння. Багато командирів тепер з оптимізмом дивляться на шанс об'єднання."
 CHT.40.a: "Ласкаво просимо до Царства, Якутіє!"

 CHT.41.t: "Якутск відмовляється"
 CHT.41.desc: "Схоже, через дурість або хоробрість Якутск відмовив. Ми пообіцяли все можливе, але попереду війна.\n\nНе те щоб вона була тяжкою. Наші загартовані ветерани легко переважають їх кількістю. Та діяти треба швидко: ми не хочемо загрузнути в довгій війні й дати ворогам перевагу. Ми рушимо стрімко, адже Якутск вірить, що бореться за саме виживання. Якби ж він зрозумів, що ми - єдиний вибір."
 CHT.41.a: "Знову до бою!"

 CHT.42.t: "Братня любов"
 CHT.42.desc: "Віссаріон Мустафін ледве приховав подив, коли молодший брат Леонід запросив випити. У дитинстві вони були близькими, але віддалилися після того, як Сємьонов повів їх повертати Чіту й обох поглинули незліченні обов'язки. Щось сталося, і Віссаріон сподівався дізнатися, коли алкоголь розв'яже братові язика.\n\n«А-а-ах! Я певен, тут найкраще спиртне на всьому Далекому Сході!» - вигукнув Леонід, широко всміхаючись барменові.\n\n«Те, що воно смакує водою, а не свіжою сечею, ще не робить його добрим», - хихикнув Віссаріон. Леонід закотив очі й грайливо штовхнув старшого брата.\n\n«Тобі бракує віри, Віссаріоне! Кажу ж, у мене добре передчуття щодо майбутнього країни. З царем Міхаїлом на чолі, а не тим старим ідіотом, невдовзі нас оточуватиме вся розкіш світу. Зокрема й спиртне». Леонід гучно засміявся й не помітив, як насупився брат. Слова про Сємьонова звучали майже... зрадницьки.\n\n«Слухай, Леоніде». Коли молодший брат повернувся, Віссаріон продовжив: «Не лізь надто глибоко в палацову політику, гаразд? Твої добрі передчуття часом справджуються, але й мої погані також. А про те, куди все йде, у мене дуже погане відчуття».\n\nТепер уже Леонід насупився. «Можливо. Але хіба погано хотіти від уряду більшого? Я не хочу вічно бути японським псом. Невже ти нічого не бажаєш для країни, брате?»"
 CHT.42.a: "Я бажаю лише твоєї безпеки."

 RUS.smuta.CHT.1.t: "Імперія тримається на папері"
 RUS.smuta.CHT.1.desc: "У коридорах царського палацу Чіти цокали чоботи, коли люди заходили до зали нарад. Більшість були старими, з волоссям таким самим білим, як їхня царська вірність. Хтось мав медалі на грудях, інші несли книжки. Коли двері зачинилися, вони постали перед Борісом Шепуновим, який усіх скликав.\n\n«Добрий день, панове. Я терміново зібрав вас тут. Як усім відомо, ми проголошуємо нову Імперію, але, крім теперішнього царя, не маємо урядової легітимности». Він прокашлявся. «Тому ми зібралися розробити конституцію нової Імперії на основі належного імперського права. Не гаючи часу, починаймо. За царя!»\n\nУсі негайно повторили вигук. Невдовзі кімната вибухнула новими сварками про те, що включати. Науковці зі старезними книжками сперечалися через суперечливі закони, а генерали відкидали прецеденти й вимагали потрібного для війни. Дебати тривали до ночі, але на ранок дійшли згоди.\n\nЗрештою перемогли генерали. Постала нова автократія царя та його любих генералів, які скромно написали документ. На місцевому рівні дали трохи свобод, радше з практичности, ніж доброзичливости. Як поступку вченим усе загорнули у візантійський і заплутаний жаргон.\n\nПопри чвари всі погодилися. Так, були компроміси, але непевного консенсусу досягли. Обіцянки й погрози Шепунова, звісно, допомогли всіх заспокоїти - як і очікувалося. Після завершення зала схвалила документ, а іншого схвалення й не треба."
 RUS.smuta.CHT.1.a: "Відсутність царя мало кого хвилювала."

 RUS.smuta.CHT.2.t: "Холодний прийом"
 RUS.smuta.CHT.2.desc: "Анатолій Собчак піднімався сходами царського палацу Чіти. Як мер однойменного міста, він отримав гарантоване місце за столом для створення конституції імперської держави, в якій опинився. Дійшовши вершини, усміхнувся вартовому біля дверей, зовсім не знаючи, що зараз буде.\n\n«Добрий день, сьогодні прохолодно, правда? - привітався він. - Я на конституційне зібрання. Пан Шепунов мав повідомити про мою участь. Як мер міста, гадаю, це не несподіванка».\n\nПісля цих слів вартовий раптом став між мером і входом. Обличчя застигло, м'язи напружилися на випадок загострення.\n\n«Перепрошую за плутанину, але вас не допущено до конференції, - сказав він. - Раджу розвернутися й піти, пане Собчак. Нарада триває вже кілька годин».\n\nКоли він договорив, сходами пронісся холодний порив. Анатолій завмер, трохи розгублений. Шепунов обіцяв місце, а тепер йому сказали, що все пропущено. Та розгубленість швидко змінилася прикрим усвідомленням: Шепунов збрехав.\n\nРаптом стало зрозуміло, чому на сходах нікого не було. Не бажаючи ризикувати гіршим, він тихо погодився, спустився й пішов до кабінету. Зрештою, робота є завжди, цінують її чи ні."
 RUS.smuta.CHT.2.a: "Не країна для добрих політиків."

 RUS.smuta.CHT.3.t: "Ідеальний цар"
 RUS.smuta.CHT.3.desc: "Потріскування вогню змішувалося з Чайковскім, поки вечірнє сонце сідало над Чітою. Міхаїл сидів у затишному палацовому кабінеті з книжкою. Він любив тишу: вона давала думати й тікати від божевілля Шепунова та його кліки. До того ж читання було приводом вправляти російську.\n\nСпокій урвала зміна на радіо. Чайковского замінила якась розмова. Прикра подія, але Міхаїл уже знав, що нічого не контролює. Та згодом почув власне ім'я. Тоді зрозумів: програма описує його життя.\n\nЦілком зосередившись на радіо, він знайшов опис щонайменше творчим. Відколи «супровід» став синонімом «викрадення», подумав цар. Розповіді про екзотичну Австралію та культурну вправність викликали таке саме спантеличення. Та маленькі вигадки були досить улесливими й розв'язали йому язика.\n\n«Гм, спаситель Росії та її народу від нацизму? Тактовний реформатор і борець за всіх росіян, кажете? Людина, що надихнула солдатів перемогти комуністів? Усе це звучить дуже приємно, правда? Їм варто частіше мене так підтримувати».\n\nНа жаль для Міхаїла, він був не сам. Двоє вартових біля дверей добре бачили виставу. Справедливости заради, вони вже звикли до негідної поведінки царя. Та крупинка впевнености стала несподіванкою, і вони підняли брови."
 RUS.smuta.CHT.3.a: "Того рідкісного разу вони навіть бачили царську усмішку."

 RUS.smuta.CHT.4.t: "Шепіт із дому"
 RUS.smuta.CHT.4.desc: "Альоша був простою людиною звички. Щосуботи вставав, варив каву й виходив по пошту та газету. Сьогодні не стало винятком: він забрав пошту й заніс, тримаючи разом із чашкою. Усередині один лист відразу впав у око.\n\nЦе була просто складена листівка з тонкого дешевого паперу. На обкладинці - російський офіцер, ніби з плаката часів Першої світової. Усередині мапа вела до віддаленого міста на північ від Монголії кількома шляхами. Ззаду були вказівки російською, спереду - англійською. Альоша роками не говорив російською й обрав передню частину.\n\n«Хоче бачити світ? Вчити спадщина? Битися жахливі комуністи і заробляти громадянство вступом! Створити історія велика пригода і багатство. Зробити горда сім'я. Вступати війна славного царя в Чіта! -Сієтл-російська друкована компанія».\n\nСказати, що Альоша був спантеличений, - не сказати нічого. Спершу подумав про жарт, потім - скільки зусиль довелося б докласти місцевим. Та й ламана англійська додавала правдоподібности. Анархія в Росії була загадковою: хто спростує існування монархічної кліки у віддаленій Чіті?\n\nСам він не дуже хотів воювати, життя в Америці було добрим. Та знав людей у місцевому громадському центрі, яких це могло зацікавити, й якщо вони дивом ще не отримали листівки, обов'язково покаже."
 RUS.smuta.CHT.4.a: "Яка цікава ранкова знахідка."

 RUS.smuta.CHT.5.t: "Новий ритм царя"
 RUS.smuta.CHT.5.desc: "Чіта палала світлом і вигуками. Замість жахів поразки вона купалася в тріюмфі перемоги. Війна скінчилася. Вони перемогли. Прапори з імператорським орлом сяяли в червоних, синіх і зелених феєрверках, а з вулиць лунали пісні.\n\nНад однією вулицею на балконі стояв цар нового царства Міхаїл і споглядав видовище. Події сповнювали його складними й суперечливими почуттями. З одного боку, тяжко було не захопитися солдатами, що з піснями йшли вулицями. Та десь у глибині жила незрозуміла тривога.\n\nКілька митей роздумів дали їй форму: він застряг тут. Безглузді пляни білих генералів незбагненним чином удалися, і тепер Міхаїл ніколи не побачить нічого за межами Росії. Подобається чи ні, доведеться прийняти країну новою домівкою. Шлунок скрутило, та вуха почули новий звук унизу.\n\n«Боже, Царя храні! Боже, Царя храні! Боже, Царя храні!»\n\nВигук ставав гучнішим, до нього долучалося дедалі більше людей. Поволі дискомфорт у животі змінився іншим відчуттям, що заворушилося в серці. Ці люди, співгромадяни, так вітали й славили його, що недоречний цар відчув дивний затишок. Це може бути його небажана домівка, подумав він, але, можливо, вона не така вже й погана."
 RUS.smuta.CHT.5.a: "Біль від переїзду трохи почав згасати."

 RUS.smuta.CHT.6.t: "Розмова на цвинтарі"
 RUS.smuta.CHT.6.desc: "Святкування охопили всю Чіту. Оглушливі вибухи лунали далеко за межами міста, яскраве світло забруднювало звично спокійне небо. Та неподалік центру самотній цвинтар стояв ряд за рядом надгробків, що позначали мирний сон людей під гамором.\n\nБоріс Шепунов ішов крізь море скорботи. Не зважаючи на метушню назовні, він прямував до однієї знайомої могили в кутку. Дійшовши, став на коліна й очистив надгробок з ім'ям Ґріґорія Сємьонова.\n\n«Вітаю, любий отамане. Давненько ми не розмовляли, еге ж? Виглядаєте добре, або принаймні спокійніше, ніж за життя». Він ледь усміхнувся. «Я міг би знову втомити вас подробицями боротьби, але маю добру новину».\n\n«Ми це зробили. Перемогли. Нарешті Далекий Схід наш, об'єднаний в Імперському царстві, як ви мріяли стільки десятиліть. На заході ще багато нездобутого й попереду чимало праці, але це майбутнє. Нині час святкувати, - голос на мить урвався. - Як же я хотів би, щоб ви були тут, зі мною, друже».\n\nДо кінця розмови голос Шепунова захрип. Він обережно поклав одну квітку на могилу, повільно підвівся й пішов. Феєрверк над головою повернув його до довколишнього світу. У палаці чекало багато справ."
 RUS.smuta.CHT.6.a: "Перед відходом він зронив одну сльозу."

 ### Regional events ###
 CHT_regional.1.t: "Спадщина для роздумів"
 CHT_regional.1.desc: "«Перед вами Його Імператорська Величність Міхаїл II, Імператор всієї Росії!» Міхаїл вийшов із почту до величезної лави військ. Побачивши царя, солдати стали струнко й віддали честь.\n\n«Слава царю Міхаїлу!» Приголомшений могутнім вигуком свого імени, Міхаїл щосили тримав гідний вигляд. Процедура тривала за пляном: Імператор ішов лавою, тиснув руки й відповідав на вітання. Молоді люди дивилися на нього з величезним захопленням, майже як на божественну постать. Одному з офіцерів, до якого він підійшов, навряд чи було більше двадцяти.\n\n«Слава вашій Імператорській Величності. Для мене честь служити вам». Молодий офіцер чемно віддав честь.\n\nМіхаїл несміливо простяг руку. «Ні, ні. Честь моя. Я щиро вдячний за вашу службу». Цар трохи нервово всміхнувся й озирнувся на Боріса Шепунова позаду. Старий генерал схрестив руки, а нетерплячий вираз явно вимагав прискоритися.\n\nКоли огляд завершився й царський почет рушив до транспорту, Міхаїл побачив дещо цікаве. Перед базою височіла велика бронзова статуя героїчного козака верхи. Цар зупинився оглянути постать, захоплений позою воїна. Він уявив себе на його місці, коли тисячі молодих людей дивляться на нього й чекають проводу в розпалі бою."
 CHT_regional.1.a: "Людина може мріяти..."

 CHT_regional.2.t: "Заповнення комітету"
 CHT_regional.2.desc: "Нещодавно для допомоги в адміністративних справах Імперії створено Імператорський керівний комітет, і вже почалася шалена боротьба за нову організацію. Панівні політичні групи прагнуть заповнити її своїми союзниками.\n\nПершими є промисловці, що представляють лоялістів. Група переважно складається з багатих аристократів і підприємців, які хочуть використати Комітет для розширення ділових інтересів у Імперії. Серед них також близькі політичні союзники й довірені люди царя Міхаїла II, тож контроль над Комітетом напевне посилить корону.\n\nЗ іншого боку, політики та військові, пов'язані з Білою армією, також прагнуть підпорядкувати ІКК. Більшість має зв'язки з генеральним штабом, а через нього - з начальником штабу Борісом Шепуновим. Якщо ІКК підпаде під військовий вплив, влада Шепунова над державними справами знову зміцниться.\n\nХто пануватиме в Комітеті?"
 CHT_regional.2.a: "Промисловці заповнять Комітет."
 CHT_regional.2.b: "Військові знову утвердять владу."

 CHT_regional.3.t: "Роздача наділів"
 CHT_regional.3.desc: "Настав час вирішити, хто керуватиме адміністративними одиницями, визначеними Імператорським керівним комітетом. Міністр фінансів Іван Міхайлов і начальник штабу Боріс Шепунов зіткнулися через ключове рішення й подали власні пляни управління країною.\n\nНе дивно, що плян Шепунова сильно сприяє військовим. За його волею губернаторами переважно стануть вірні офіцери. Ці особисто відібрані люди будуть ветеранами й довіреними особами Шепунова, дехто служить із ним іще з громадянської війни.\n\nПлян Івана Міхайлова натомість сильно сприяє лоялістам. Він вважає, що наділи мають отримати «царські губернатори» - обрані з цивільних Імперії, а не з Білої армії.\n\nХто зрештою отримає бажане?"
 CHT_regional.3.a: "Наділи отримають царські губернатори."
 CHT_regional.3.b: "Адміністративні одиниці перейдуть під владу військових губернаторів."

 CHT_regional.4.t: "Забруднити руки"
 CHT_regional.4.desc: "Боріс Шепунов був невдоволений. Минуло кілька місяців після перемоги його армій над ворогами Імперії, та попри всі зусилля їхні залишки далі знаходили способи бути колючкою в боці. Сьогодні він зібрав генеральний штаб Білої армії, щоб висловити невдоволення.\n\n«Панове, поясніть, як після нібито знищення наших ворогів вони досі вбивають солдатів і завдають мені головного болю?» Відповіді не було. Безперечно, генерали витрачали мовчання на вигадування виправдань, а не відповідей.\n\n«Запевняю, пане: ці повстанські дії справді дошкуляють, але турбуватися немає про що». У голосі генерала Мустафіна бракувало впевнености. «Гадаю, вони надто незначні, щоб довго існувати, і з часом розпадуться самі...»\n\n«Перепрошую, Леоніде, але це лайно, і ти знаєш. Вони просто зараз убивають наших людей і намагаються знищити все, чого ми досягли, а ти сидиш і кажеш, що все під контролем? Ти взагалі знаєш, що відбувається?!» Знову тиша. Ніхто не хотів наступним зустріти лють начальника.\n\n«Схоже, ви, дурні, мали нахабство оголосити перемогу, не закінчивши війну. Сьогодні цьому край. Вислати найкращих людей і почати арешти. Після цього тижня я не хочу чути ані писку незгоди, зрозуміли? За моєї варти зрадників більше не терпітимуть»."
 CHT_regional.4.a: "Жодних напівзаходів."

 CHT_regional.5.t: "Зміцнення підтримки"
 CHT_regional.5.desc: "В уряді назріває біда, а напруга між цивільним і військовим секторами стрімко наближається до кульмінації. Попри вигляд, панування Білої армії в державних справах уже не таке міцне. Після смерти отамана Сємьонова її вплив слабшає щодня. Довкола царя Міхаїла, єдиної людини, здатної очолити розрив військової хватки, кружляють політики-опортуністи.\n\nЗа підтримки кліки молодих офіцерів та Івана Міхайлова цар змовляється захопити уряд і підтвердити абсолютну владу в російській державі не лише на словах, а й на ділі. На їхньому боці багаті аристократи та промисловці, але зростає страх, що без належної військової підтримки плян приречений.\n\nБіла армія та її начальник штабу Боріс Шепунов своєю чергою знають, що щось негаразд. Переконливих доказів царської змови ще немає, але підозр досить для превентивних заходів проти потенційних незгодних. Резервні пляни готуються, Біла армія в повній бойовій готовності.\n\nРано чи пізно одна фракція виступить проти іншої, й доля білого руху буде вирішена."
 CHT_regional.5.a: "Біла армія посилить контроль."
 CHT_regional.5.b: "Вплив лоялістів зросте."

 CHT_regional.6.t: "Мала затримка"
 CHT_regional.6.desc: "«Це остання нагода!» - гукнув Боріс Шепунов, знаючи, що Почесна варта царя на першому поверсі резиденції добре його чує. «Здавайтеся й складіть зброю! Це наказ!» Ані слова, ані дії. Шепунов роздратовано зітхнув. Він сподівався, що лоялісти прийдуть мирно й віддадуть царя без крові, але не судилося, й тепер багато хто помре. Генерал повернувся до підлеглого. «Генерале Волкоґонов, починайте».\n\nВолкоґонов кивнув і взяв рацію. «Усім частинам! - наказав він. - Почати операцію за моєю командою!» Шепунов востаннє кивнув, і Волкоґонов вигукнув: «Вогонь!» Солдати на заздалегідь визначених позиціях послухалися й за мить залили царську резиденцію вогнем.\n\nРушниці й кулемети скосили вікна та двері, гармати бронетранспортерів пробили стіни й перетворили більшу частину першого поверху на руїни. Вогонь у відповідь був рідким і неточним, а невдовзі геть урвався. Трохи згодом замовкли й солдати Волкоґонова.\n\nОглядаючи місце, Волкоґонов відчув стиск у грудях. Серед руїн лежали понівечені тіла Почесної варти - ще кілька хвилин тому таких самих товаришів, як усі. Ті, хто вижив, лишаться каліками. Сповнений сорому, але не бажаючи показувати його нікому, особливо Шепунову, він відвернувся, поки його люди з піднятою зброєю йшли до резиденції."
 CHT_regional.6.a: "Усе за пляном."

 CHT_regional.7.t: "Кінець доби"
 CHT_regional.7.desc: "Боріс Шепунов суворо оглянув картину. Його війська цілком оточили царську дачу, щури були загнані в нори. Лише символічний загін Імператорської почесної варти й кілька сумлінних молодих офіцерів стояли між ним та змовниками. Старий генерал приготувався оголосити наміри.\n\n«Увага всім, хто служить цареві! Ми прийшли лише виконати волю російської держави! Міхаїл Андрєєвіч став на бік зрадників і зрікся святої присяги захищати Росію та народ. Негайно складіть зброю!» Лоялісти не ворухнулися. Шепунов більше не міг терпіти непокори. «Досить цього фарсу. Генерале Волкоґонов, накажіть людям атакувати. Сьогодні все скінчиться».\n\n«Ні. Боюся, я не можу цього зробити, пане».\n\n«Якого ху...» Обернувшись до підлеглого, Шепунов побачив дуло пістолета просто перед обличчям. «Що... Що ви, в біса, робите, генерале?!» У звично суворому й рішучому голосі пролунала рідкісна паніка.\n\n«Борісе Шепунов, іменем Його Імператорської Величности Міхаїла II я заарештовую вас». За кілька секунд світ Шепунова перевернувся. Солдати Волкоґонова спрямували зброю всередину й почали силоміць затримувати всі вірні йому частини.\n\n«І ти, Волкоґонов? Ні... Не може бути...» Слова нарешті зрадили його. Прем'єр-міністр і командувач Білої армії, колись наймогутніша людина Імперії, відчув, як підгинаються коліна, поки солдати заковували руки. Майже відразу після початку його залізне правління скінчилося."
 CHT_regional.7.a: "Кайдани розірвано."

 CHT_regional.8.t: "Новий Сибір"
 CHT_regional.8.desc: "Кіріл крекнув і сів - одна з рідкісних нагод відпочити після довгого робочого дня. З висоти добре було видно результат: величезні простори без дерев аж за обрій. На їхньому місці лишилися пеньки, як той, на якому він сидів.\n\nОсь він, колись син сибірської глушини та її дарів, а тепер виконує накази тих самих людей, яким колись опирався. Платили дуже добре, та Кіріл досі питав себе, чи варто продавати душу й допомагати нищити ліси, схожі на його домівку.\n\nЗапаливши цигарку, він продовжив думати. Сибір безкрайній, але навіть нібито нескінченні ліси зрештою обмежені. Імператорська компанія розвитку рвала глушину, наче вовча зграя, вирубувала ліси й перетворювала величезні ділянки на безликі трав'яні рівнини. Чи лишаться колись ліси, коли ІКР завершить працю?\n\nКіріл народився й виріс у дикій природі, жив із землі й цінував її дари. Цивілізація, на його думку, була переоцінена, й він сподівався, що більше людей оцінять красу природи. Та за це погано платять. Зрештою навіть дику звірину на кшталт Кіріла спокусило багатство ІКР.\n\nЧи зможуть у далекому майбутньому його діти жити так само? Загасивши цигарку, Кіріл урвав думки й пішов закінчувати зміну."
 CHT_regional.8.a: "Ціна поступу."

 CHT_regional.9.t: "Хвилина спочинку"
 CHT_regional.9.desc: "У Сємьона боліло все тіло. Він працював у бокситовій шахті від світанку до присмерку й лише тепер вибрався з проклятої діри перевести дух. Колись офіцер НКВД, нині він був не кращий за раба своїх полонителів. Не та слава, яку він уявляв.\n\n«Знову байдикуєш, червоний?» Знайомий голос змусив Сємьона застогнати.\n\n«Принаймні я знаю, коли зупинитися, перш ніж збожеволію, фашисте». Він навіть не глянув на того, хто кинув шпильку. Фашист, здоровань на ім'я Анатолій, хихикнув і сів поруч.\n\n«Вони збираються загнати нас до смерти, знаєш. Я вже бачив, як кілька хлопців падали. Охоронцям байдуже, вони просто проходили повз». Сємьон теж бачив. Заслабкі до тяжкої праці люди під дулом зброї безнадійно падали в місці без світла.\n\n«Не знаю, що гірше: працювати з ходячими мерцями чи з фашистами на кшталт тебе, Анатолію».\n\nФашист порожньо засміявся. «Неважливо, ким ми були, большевику. Для них ми лише тіла для шахт. Унизу ми всі брати, подобається чи ні».\n\nІз цим Анатолій узяв інструменти й повернувся до входу. У глибині душі Сємьон знав, що той має рацію. Частина його сподівалася, що колишній ворог вибереться з тієї ями живим."
 CHT_regional.9.a: "Запеклі вороги в одному човні."

 CHT_regional.10.t: "Не за пляном"
 CHT_regional.10.desc: "Ґенерал Дмітрій Волкоґонов нервував дедалі більше. Він обіцяв цареві допомогти, коли настане час, і ця мить явно настала. Однак, як завжди в такій розладнаній країні, як Росія, дійсність виявилася значно складнішою.\n\nНа місці вже було понад тисячу вояків Білої армії, а нові сили все прибували. Загін Волкоґонова становив лише малу частину присутніх, і він почувався майже таким самим безнадійно нечисленним, як нещасні, що марно намагалися захистити приреченого царя. Поки Боріс Шепунов вимагав від царської охорони здатися, думки Волкоґонова звернули в темряву, якої він волів би уникнути. Чи мудро було ставати на бік Міхаїла? Що станеться, якщо він спробує обеззброїти начальника за таких безнадійних обставин?\n\nГолос начальника урвав його роздуми. «Ґенерале Волкоґонов, нехай ваші люди наступають. Я надто довго торгувався з цими дурнями. Час покласти край цьому балаганові». Ґенерал застиг, мов олень у світлі фар. Що він скаже? Чи це його мить? Зрадити царя було б безчесно, але інший вибір напевне означав загибель...\n\n«Ґенерале? Ви мене не чули? Піднімайте людей!» Волкоґонов нервово ковтнув. Або зараз, або ніколи. Хай що він вирішить, хтось назве його зрадником. Різниця лише в тому, чи переживе він це.\n\n«Т-так, пане. Усім частинам приготуватися до наступу!» Війська Білої армії рушили на царську резиденцію. Відходячи від шеренги під тягарем сорому, Волкоґонов почув уривчасту стрілянину."
 CHT_regional.10.a: "Зло перемагає, коли добрі люди не діють."

 CHT_regional.11.t: "Історія аутсайдера"
 CHT_regional.11.desc: "«Що нам тепер, у біса, робити? Ох... Я знав, що це буде катастрофа!» Міхаїл метався на межі істерики. Міхайлов натомість щосили намагався зберегти спокій, але обставини неабияк цьому заважали. У душі він боявся не менше за царя.\n\n«Заспокойтеся, Ваша Величносте! Я... ми щось придумаємо! Треба лише подумати...»\n\n«Що тут думати? Вони знають про наш задум і оточили будинок! Якби я не прийняв те кляте запрошення, то й не потрапив би в цю халепу!» Істеричні вигуки Міхаїла лише підживлювали паніку обох. Раптова черга зі стрілецької зброї надворі урвала їхні роздуми, а невдовзі пролунав оглушливий вибух, від якого здригнувся весь будинок. Міхаїл негідно верескнув, коли випадкова куля розбила вікно, під яким він ховався. Обидва впали долілиць, прикриваючи голови, поки симфонія стрілянини сягала крещендо.\n\nЗа час, що здавався годинами, гармати раптом змовкли. Лишилося лише важке дихання Міхаїла й Міхайлова. Першим підвівся Міхайлов і визирнув у розбите вікно. Марно. Вже сутеніло, а дим від бою заважав старому щось розгледіти.\n\n«Що сталося? Ми перемогли?» - нервово спитав Міхаїл, досі лежачи на підлозі. Цар скрикнув, коли двері їдальні відчинилися. Перед ними постав ґенерал Волкоґонов у супроводі вояків Білої армії.\n\n«Не тривожтеся, Ваша Величносте. Зрадників знешкоджено. Ви в безпеці»."
 CHT_regional.11.a: "Стривайте, що?"

 CHT_regional.12.t: "Старий князь"
 CHT_regional.12.desc: "Першим Нікіту Александровіча зустрів порив холодного сибірського повітря, коли він зійшов із літака на летовище Кадали. Попри всі ретельні приготування князь таки недооцінив тутешній мороз. Щільніше загорнувшись у хутряну шубу, Нікіта рушив до великого гурту чоловіків, що зібралися його привітати.\n\nНачальник штабу Боріс Шепунов стояв попереду, нетерпляче чекаючи князя. «Князю Нікіто, Ваша Високосте! Дозвольте першому привітати вас і вашу родину з поверненням до Росії».\n\nНікіта ввічливо всміхнувся й простягнув Шепунову руку. «Вітаю, ґенерале. Добре повернутися...» Тепер поруч із князем стояли дружина й двоє синів, Нікіта та Александр. Він нахилився, зазираючи за Шепунова в юрбу. «А де ж мій небіж? Я хотів із ним поговорити».\n\n«Перепрошую, Ваша Високосте, але Його Імператорська Величність сьогодні трохи нездужав і не зміг прибути. Інакше він напевне був би радий зустрітися з родиною. Ходімо, виведемо вас із холоду». Шепунов запросив царську родину йти за ним.\n\nТа попри слова ґенерала князеві Нікіті здавалося дивним, що небожа не було серед зустрічальників. Князь дуже чекав на возз'єднання й гадав, що Міхаїл відчував те саме. Яка б недуга не скосила імператора, думав він, вона мала бути доволі тяжкою..."
 CHT_regional.12.a: "Добре, що вони повернулися."

 CHT_regional.13.t: "Перша з багатьох"
 CHT_regional.13.desc: "У самому серці токійського району Касуміґасекі ґенерал Владімір Абрамов почувався чужинцем у ще чужішій країні. Він стояв у безликому кабінеті японського міністерства закордонних справ перед офіційною дипломатичною делеґацією. Боріс Шепунов особисто обрав його очолити білу делеґацію до Токіо. Ґенерал не насмілився б поставити наказ начальника під сумнів, але була одна проблема: Абрамов був військовиком і не мав жодного дипломатичного досвіду.\n\nВін дивувався, чому Шепунов не доручив справу Міністерству закордонних справ, але щось змінювати було запізно. Японці чекали, що Абрамов стане обличчям нової російської місії. Від успіху чи провалу цієї зустрічі могло залежати майбутнє російсько-японських відносин.\n\n«Коротко кажучи, Його Імператорська Величність бажає залишити історичні кривди в минулому й започаткувати велике відновлення російсько-японських відносин. Запевняю, ми приходимо як друзі й рівні». Заява Абрамова звучала болісно завчено, й він сподівався, що японці цього не помітять.\n\nЯпонський колеґа звернувся до підлеглого мовою, якої російська делеґація не розуміла. Тоді дипломат повернувся до Абрамова з непереконливою усмішкою. «Рівні, кажете? Щонайменше цікава перспектива. Не хвилюйтеся, ґенерале, Японія справді готова зміцнювати відносини. Щиро сподіваюся, що сьогоднішня зустріч стане першою з багатьох. Можливо, у процесі ми ще дечого навчимося про дипломатію, еге ж?»"
 CHT_regional.13.a: "«Е-е, так. Авжеж»."
 CHT_regional.13.b: "«Е-е, так. Авжеж»."

 CHT_regional.14.t: "Маршем у майбутнє"
 CHT_regional.14.desc: "Боріс Шепунов спостерігав із балкона, як війська Білої армії крокують головною вулицею Чіти. Це був перший парад після возз'єднання Далекого Сходу, й Шепунов не покладав великих надій на виступ своїх солдатів. Колись вони були бандитами в одностроях, не кращими за диких розбійників, яких він бачив десятки років тому на службі в отамана Сємьонова.\n\nТа побачив він зовсім інше. Війська крокували в ногу, дивлячись на царя й салютуючи. Однострої були бездоганні, на плечах висіли найновіші зразки стрілецької зброї. Навіть такий старий білий, як Шепунов, не міг не захопитися молодецьким виглядом вояків.\n\nКоли піхота пройшла й з'явилися славетні козацькі вершники, Шепунова охопили почуття. Стільки років він намагався збудувати саме таку армію. Не строкату ватагу кінних розбійників і ополченців, а професійну силу, готову за потреби стати проти цілого світу.\n\n«Владіміре, я не думав, що доживу до дня, коли Біла армія буде схожа на справжнє військо. Це просто неймовірно...» Говорячи з ґенералом Абрамовим, Шепунов не відводив очей від вершників.\n\nТа Міхаїл II був єдиним присутнім, кому було байдуже. Де інші бачили звитяжців, він бачив холоднокровних наглядачів своєї в'язниці. Увесь парад цар мовчав і дивився радше з тихою тривогою, ніж із захватом."
 CHT_regional.14.a: "Сила, з якою доведеться рахуватися."

 CHT_regional.15.t: "Знак часу"
 CHT_regional.15.desc: "Софія стала виходити з квартири значно частіше. Відколи фашистський уряд вигнали із Зеї, вона знову спокійно гуляла вулицями, знаючи, що головорізи РФП більше не тероризують місто. Та це не означало, що життя стало менш дивним.\n\nДорогою додому Софія помітила невеликий гурт людей на тротуарі. Усі дивилися на щось прикріплене до стіни будинку. Хай що то було, воно зчинило неабиякий галас. Наблизившись, вона почула людський гомін і нарешті побачила предмет уваги.\n\nНа стіні висів великий аґітаційний плякат, що явно закликав вступати до Білої армії. У центрі ідеалізований лютий солдат із рушницею кидався на двоголового дракона. Одна голова злої потвори була червона, друга - глибоко чорна. У хвості звіра було затиснуте держално з пошматованим російським триколором. Жирний напис проголошував: «Вступай до Білої армії та визволи святу Росію з пазурів радикалізму!» Символіку зрозуміли всі.\n\nСофія відчула тривогу. Плякат був доволі невинний, та подібні мілітаристські образи не виглядали б чужими й за попереднього режиму. Продовживши шлях додому, вона могла лише сподіватися, що її відносно мирне життя триватиме, хоч нова влада дедалі сильніше стискала хватку."
 CHT_regional.15.a: "Свіжий шар фарби."

 CHT_regional.16.t: "Незвичне прохання"
 CHT_regional.16.desc: "«Е-е... ви сказали, що він росіянин? Певні?»\n\n«Цілком. Його англійська була така ламана, що ми нічого не розібрали. Довелося знайти в будинку когось із російською, щоб зрозуміти, чого він хоче».\n\n«Нехай заходить». Посол був спантеличений, але зацікавлений. Він давно не вправлявся в російській, проте був певен, що знає достатньо для дипломатії. За кілька тихих хвилин таємничий посланець увійшов до кабінету.\n\n«Вітаю! Я представляю Його Імператорську Величність Міхаїла II, Імператора всієї Росії. Сьогодні я прибув просити Сполучені Штати офіційно визнати нас справжнім урядом Росії».\n\nПосол був приголомшений. «Гей, пригальмуйте, друже. Ви сказали, що представляєте імператора?»\n\n«Саме так. Від імени свого богообраного імператора Міхаїла II Біла армія вирвала Східний Сибір із рук фашистських і большевицьких тиранів. Тепер, коли наші позиції міцні, ми бажаємо визнання як законного уряду». Відповідь породила лише нові питання. Послові доведеться комусь зателефонувати, але спочатку треба випровадити цього дивного росіянина...\n\n«Боюся, я мало що можу зробити, адже відповідаю за відносини з Японією. Та можу зателефонувати до Державного департаменту від вашого імени. Маєте, е-е, ще якісь питання?»"
 CHT_regional.16.a: "«Ні, це все»."

 CHT_regional.17.t: "Однобічні відносини"
 CHT_regional.17.desc: "«Імператорське міністерство закордонних справ, слухає Ніколай Ухтомскій».\n\n«Боюся, маю новини, які вам не сподобаються». Від знайомого голосу міністр похолов. «Мої партнери прихильно сприйняли вашу пропозицію економічного партнерства. Однак вимагають певних поступок...»\n\n«Поступок? Що? Ми вже дали вам цілком досить!»\n\n«Раджу змінити тон, Ухтомскій. Мої партнери хочуть гарантій, що дзайбацу зможуть вести справи у ваших кордонах на власний розсуд. Сподіваюся, це не надмірне прохання?»\n\n«Ми раді їхньому бізнесу, але ви знаєте: дай дзайбацу волю - і вони миттю візьмуть нас за горло...»\n\n«Даруйте, Ухтомскій, але ви не в тій позиції, щоб торгуватися. Або приймаєте вигоди нашого бізнесу, або ні. До слова, з вашими попередниками ця розмова взагалі була б непотрібна...»\n\nЗапала павза. Співрозмовник мав рацію, й Ухтомскій це знав. «Чорт, гаразд! Будуть вам поступки. Тільки... без нових сюрпризів, добре?»\n\n«Я знав, що ви приймете нашу думку. Я зв'яжуся». Лінія обірвалася, й Ухтомскій грюкнув слухавкою."
 CHT_regional.17.a: "Ця угода щохвилини стає гіршою!"

 CHT_regional.18.t: "Початок чогось особливого"
 CHT_regional.18.desc: "Боріс Шепунов навчився цінувати хвилини тиші. Сам у кабінеті, зі склянкою горілки в руці, він переглядав штабні звіти. Як завжди, самі погані новини: повстанці сміливішали з кожним днем, ширилися чутки про невдоволення цивільної адміністрації, та й іншого вистачало. Як же це втомлювало.\n\nСтарий ґенерал одним духом випив горілку й відчув, як вона обпекла горло. Що про все це подумав би отаман? Старий козак завжди вмів тримати голову холодною, навіть коли все виходило з-під контролю. Тепер Сємьонова не було, а розгрібати безлад мусив він. Ґенерал проклинав себе за віру в те, що після перемог армії життя стане легшим. Час би знати: перемоги зазвичай ставлять більше питань, ніж дають відповідей.\n\nУ глибині душі Шепунов тужив за давньою Чітою, за відчайдушними вилазками із Сємьоновим та його козаками сибірською тундрою. Принаймні вороги тоді ставали проти нього відкрито. Тепер вони ховалися на видноті. Мир зробив Шепунова самовпевненим саме тоді, коли пильність була потрібна як ніколи.\n\nШепунов налив іще. Це хоч на мить відвертало увагу від денної втоми."
 CHT_regional.18.a: "Щось негаразд, але що?"

 CHT_regional.19.t: "Вони ніяк не здадуться"
 CHT_regional.19.desc: "Очі Ґріґора бігали від одного кінця провулка до іншого. Він силкувався здаватися господарем становища, але насправді був нажаханий. Минули часи, коли він та його товариші з Россійской Фашистской Партії могли чинити що заманеться. Та двоє друзів, здавалося, його страху не поділяли.\n\n«Де тепер твій цар, жиде? Думав, можна просто прийти в наш район? Тут досі порядкуємо ми, й жодна війна цього не змінить!» Друзі Ґріґора в упізнаваних, але занедбаних одностроях РФП нависли над чоловіком на землі. Вони стягли його з вулиці й заходилися знущатися, як за старих часів.\n\n«Я лише проводжу перепис!» - закричав чоловік. «Я навіть не єврей!» У відповідь на благання його люто копали.\n\nПозаду Ґріґора пролунав окрик. До них зі зброєю напоготові йшли двоє солдатів Білої армії. У Ґріґора скрутило живіт. «Відійдіть від нього! - гукнув передній. - Руки вгору! Негайно!»\n\n«А, нарешті прийшли царські пси! - гаркнув один із товаришів. - Ми просто люб'язно балакаємо з одним із ваших!» Обернувшись до друзів, Ґріґор відчув подих смерти.\n\n«Гей, стривайте, не треба...» Його слова урвалися, коли один із друзів вихопив зброю. Ґріґор не встиг і крикнути, як солдати відкрили вогонь. Кулі прошили його, а падаючи, він опинився обличчям до обличчя з чоловіком, якого вони тероризували."
 CHT_regional.19.a: "Їхня війна скінчилася."

 CHT_regional.20.t: "Тиха вечеря"
 CHT_regional.20.desc: "Міхаїл дивився в суп, утративши апетит. Хоч як він старався, не міг перестати думати про все, що здатне піти не так. Його вечірній гість Іван Міхайлов апетиту явно не втратив, але навіть зазвичай балакучий міністр був сьогодні незвично похмурий.\n\n«Ваша Величносте, - сказав Міхайлов, - ви мусите їсти. Не можна, щоб ви тепер померли з голоду. Справ ще багато». Побачивши царський погляд, він продовжив: «Не тривожтеся, мій володарю. Все вже в русі, лишилося тільки вірити в успіх».\n\nМіхайлов поклав ложку, і обидва помітили, що вона та решта срібла почали тремтіти. Надворі чувся глибокий гуркіт. Обидва разом підвелися й кинулися дивитися, що сталося.\n\nВідсунувши фіранки, вони побачили те, від чого кров захолола в жилах. Вантажівки й бронетранспортери вивергали десятки солдатів із відзнаками міської залоги, які оточували резиденцію. А біля головної брами сам Боріс Шепунов стояв поруч, поки розлючений підлеглий кричав на командира охорони. Чоловіки відступили від вікна й перезирнулися.\n\n«Ось і все, так? - майже пошепки сказав цар. - Шепунов нас викрив»."
 CHT_regional.20.a: "Ми стоїмо над прірвою."

 CHT_regional.21.t: "Царська промова"
 CHT_regional.21.desc: "Міхаїл не міг позбутися сорому, чекаючи на вчителя російської. Він претендував на владу над усією Росією, не маючи й початкових знань мови народу, яким мав правити. Він і радники погоджувалися: це виглядало погано.\n\nЗвісно, Міхаїл знав кілька слів і фраз. Міг привітатися й попрощатися, погодитися чи заперечити, навіть спитати дорогу до вбиральні. Російську він розумів досить добре, стежив за радіопередачами й промовами, які передавав уряд. Та говорити нею майже не міг.\n\nПравду кажучи, частина його опиралася вивченню мови, але останнім часом він змінювався. Він побачив підданих такими, якими вони були: працьовитими, дбайливими й приязними людьми. Людьми, які гуртом відбудовували господарство після нападу й давали притулок біженцям зі сходу, навіть не маючи зайвої їжі чи грошей. Людьми, які прийняли його.\n\nІ Міхаїл побачив, хто правитиме тут, якщо він поїде. Люди, ладні розорити ціле село, аби викорінити одного гаданого ворога, а ворогів у них було чимало. Він відчув рішучість і відповідальність перед щедрим людом, що прихистив його. Він залишався заради них, і щодня ставало ймовірніше, що таки стане правителем Росії. До того дня треба бути готовим.\n\nТож він сидів із папером у руці, поглядав на годинника й нетерпляче постукував ногою, думаючи про жителів Чіти. Раптом клацнули двері й увійшов чоловік. Він подивився на Міхаїла та всміхнувся."
 CHT_regional.21.a: "Прівєт, Міхаїл, пріступім."

 CHT_regional.22.t: "Сіємо насіння"
 CHT_regional.22.desc: "Іван Міхайлов увірвався до покоїв царя Міхаїла з похапцем затиснутим під пахвою портфелем, навіть не постукавши. Швидко визирнув у коридор, зачинив двері й підійшов до монарха, який давно на нього чекав. «Ви певні, що за вами не стежили? Перевірили двічі?» - нервово спитав Міхаїл, барабанячи пальцями по столу.\n\n«Цілком. Покінчімо із цим, я не хочу лишатися тут довше, ніж треба». Міхайлов розкрив портфель і розклав на столі кілька аркушів зі списками імен. Сідаючи навпроти царя, міністр прочистив горло: «Отже, до справи. Це списки важливих людей, з якими треба зв'язатися. Дуже важливо запам'ятати ці імена».\n\n«Хто саме ці люди?» - задумливо спитав цар, роздивляючись список.\n\n«Можливі союзники. Щоб позбутися Шепунова, нам потрібні друзі. Якщо переконаємо кількох багатих оліґархів і невдоволених військовиків приєднатися, то значно послабимо хватку Білої армії».\n\nМіхаїл відклав аркуш. «Гаразд, спробую вмовити Шепунова дозволити кілька... невинних особистих авдієнцій. Йому ж не обов'язково знати, що там відбувається?»\n\nМіністр підступно всміхнувся. «Саме так я й думав. Ви швидко вчитеся, Ваша Величносте»."
 CHT_regional.22.a: "Час плести павутиння."

 CHT_regional.23.t: "Сильні світу цього"
 CHT_regional.23.desc: "«То навіщо ти затягнув нас сюди, Іване? Гадаю, не просто згаяти час зі старими друзями».\n\nМіхайлов уважно оглянув слухачів. Завдяки послугам і кільком влучним словам перед ним і царем тепер сиділи п'ятеро наймогутніших промислових оліґархів російського Далекого Сходу. Наступні слова слід було добирати обережно. «Боюся, ні, друже. Я хотів обговорити... справи. Мені добре відомо, як усі ви стогнете під тягарем бездонного бюджету Білої армії та шукаєте виходу. Хіба не так?»\n\nПісля павзи один з оліґархів обережно озвався: «Правду кажучи, мене це вже дістало. Ви не уявляєте, як такі військові витрати пожирають прибутки. Та нічого не вдієш: у цих краях слово Білої армії - закон».\n\n«Отже, наші цілі збігаються. Його Величність і я прагнемо приборкати вплив війська й повернути Імперію до цивільного правління. Звісно, для цього потрібні друзі...»\n\n«Я думав, ти ніколи не попросиш. Скажи, що потрібно, й отримаєш. Тільки подбайте про нас, коли все скінчиться, гаразд?» Колеґи ствердно закивали.\n\nМіхайлов глянув на царя, всміхнувся й знову звернувся до ділків. «Гадаю, ми домовилися, друзі»."
 CHT_regional.23.a: "Доляр могутніший за меч."

 CHT_regional.24.t: "Прогулянка Міхаїла"
 CHT_regional.24.desc: "Капітан Іґор лише побіжно стежив за царем, який балакав із заводськими робітниками. Начальство наказало «подбати, щоб цар не вскочив у надто велику халепу», але капітан волів би мати точніші вказівки. Що саме вони називали «халепою»? Мабуть, це був випадок «побачиш - зрозумієш».\n\nСпершись щокою на кулак, Іґор помітив у цареві дещо дивне. Няньчити Міхаїла йому було не вперше, та цього разу його поведінка відрізнялася. Він був жвавий, говіркий, і Іґор ладен був заприсягтися, що вперше бачить його щирий сміх. Це здавалося... неправильним.\n\nЦар був в'язнем, і кожен у цій куцій Імперії чудово це знав. Міхаїл завжди ходив похмурий, то звідки сьогодні така легкість у кроці й чому вона так непокоїла?\n\nДумки капітана урвав Міхаїл, який підійшов із незмінною усмішкою. «Гаразд, Іґоре. Ходімо звідси?»\n\n«Е-е, так, звісно, Ваша Величносте». Підвівшись, щоб супроводити царя, він помітив ту саму енергію і в його голосі. Такий настрій водночас зігрівав і тривожив. Принаймні наступний рапорт командуванню матиме цікаву історію..."
 CHT_regional.24.a: "Що на нього найшло?"

 CHT_regional.25.t: "Слабка ланка"
 CHT_regional.25.desc: "«Дякую, що прибули так швидко, ґенерале. Певно, останнім часом ви дуже зайняті», - сказав Міхаїл, люб'язно потискаючи руку вечірньому гостеві, ґенералові Дмітрію Волкоґонову.\n\nСівши за пишний царський стіл, Волкоґонов помітив і міністра фінансів. «Ґенерале! Радий, що ви до нас приєдналися. Я давно хотів поговорити особисто».\n\nВолкоґонов спантеличено всміхнувся Міхайлову. «Дякую за гостинність, панове, та не знаю, що ми можемо обговорити без мого начальства...»\n\nМіхайлов нахилився вперед. «О, чимало. Ґенерале, ви маєте славу людини, яка прагне чинити правильно, навіть усупереч начальству. Хіба ні?»\n\nҐенерал примружився. «...Що саме ви пропонуєте?»\n\n«Не таємниця, що Імперія стогне під нищівним впливом Білої армії. Та не всі військовики зіпсуті. Ґенерале, гадаю, ви один із них».\n\n«Ви хочете, щоб я виступив проти Шепунова? Це непокора. Боюся, доведеться доповісти». Побачивши, як Міхаїл із міністром зблідли, ґенерал зайшовся хрипким сміхом. «Не хвилюйтеся, я жартую. Старий дурень веде країну до загибелі, а мене - до божевілля. Скажіть, де потрібні мої люди, Ваша Величносте, і вони будуть там»."
 CHT_regional.25.a: "Яскравий чоловік..."

 CHT_regional.26.t: "Ніхто й не помітить"
 CHT_regional.26.desc: "Головнокомандувач Білої армії Боріс Шепунов заглибився в ранкові газети. Старому ґенералові було цікаво, що діється у світі, навіть якщо світові нині майже не було діла до Росії. Коли він дійшов до останніх подій на Далекому Сході, у двері постукали. Шепунов роздратовано застогнав, відклав газету й буркнув: «Заходьте».\n\nУвійшов ґенерал Ніколай Коссов із текою під пахвою. Мовчки підійшов до столу, кинув її перед Шепуновим і схрестив руки. «Що це означає, Коссове?» - спитав командувач, гортаючи документи.\n\n«Звіти про постачання з бази біля Іркутска. Схоже, в арсеналі сталася плутанина. Принаймні так вони кажуть...»\n\nДокументи це підтверджували. Зі складу незбагненно зникли тисячі рушниць із набоями. Він хотів вірити в помилку, та нутро казало інше. «Це серйозна прогалина в безпеці, Коссове. Розберіться, зрозуміло?»\n\n«Негайно доручу. Якщо знайдемо винних, ви дізнаєтеся першим». Віддавши честь, ґенерал пішов, лишивши Шепунова варитися в підозрах. Тисячі рушниць не зникають самі собою. Тут коїлося щось гниле, але що саме - командувач не знав..."
 CHT_regional.26.a: "Проста канцелярська помилка чи щось лиховісніше?"

 CHT_regional.27.t: "Заява про наміри"
 CHT_regional.27.desc: "Давно вже стільки очей не було прикуто до Міхаїла II. Раніше це були безчесні люди, які захоплено думали, як скористатися новою маріонеткою. Та цього разу перед ним стояли справжні союзники, які бачили монарха таким, яким він мав бути: живим утіленням єдности.\n\n«Пані та панове, у цій залі зібралися люди різного походження й поглядів. Серед вас є підприємці, що рухали велику промисловість Імперії навіть у тяжкі часи; політики, які прагнуть якнайкраще представляти виборців; офіцери Білої армії - тієї самої сили, що колись хоробро кинула виклик совєцьким узурпаторам.\n\nПопри разючі відмінності, всіх вас об'єднує одна мета: повернути країну з рук егоїстичних і продажних ґенералів, які хочуть перетворити стародавню славну Імперію на квазіфашистську стратократію, а мене - на безпорадну маріонетку.\n\nЯ кажу, звісно, про прем'єр-міністра Боріса Шепунова. Він гадає, що тримає нас у залізній хватці, та скоро зрозуміє, що далеко не такий хитрий. Попри відмінності ми пліч-о-пліч усунемо цього майбутнього тирана й продовжимо шлях до возз'єднання. Боже, бережи Росію - єдину й неподільну!»\n\nОплески були приголомшливі, й Міхаїл залюбки купався б у новій славі. Та десь на краю свідомости не полишала тривога: а якщо полонителі слухають?.."
 CHT_regional.27.a: "Смілива промова."

 CHT_regional.28.t: "Завіса підіймається"
 CHT_regional.28.desc: "«Прокляття, Коссове, мені потрібні результати, а не виправдання!» - гаркнув Боріс Шепунов у телефон, стискаючи слухавку.\n\n«Розумію, пане, але не можу витягти докази з дупи! Злодії добре замели сліди - надто добре, щоб і далі гнатися за цією зачіпкою. Та ми не зовсім із порожніми руками...»\n\nШепунов підняв брову. «Продовжуйте. Я слухаю».\n\n«Поки ми ганялися за привидами в Іркутску, спливло дещо цікаве. Кажуть, кілька вельми цікавих осіб раз у раз навідуються на царську дачу. Я перевірив - усі вони друзі Івана Міхайлова».\n\nҐенерал замовк. Міністр фінансів давно був кісткою в горлі, але останнім часом тримався моторошно тихо. Чи пов'язане це з новиною? Що йому або друзям-промисловцям треба від царя Міхаїла, і чому все це так недобре пахло?\n\n«...Пане? Ви тут?»\n\n«Так. Перевірте зв'язок із Міхайловим. Дізнайтеся, що він задумав і що відбувається на зустрічах. Не схибте, Коссове».\n\n«Можете на мене покластися». Шепунов поклав слухавку. Нарешті тверда зачіпка. Якщо Міхайлов із царем щось замишляють, він так чи інакше це з'ясує..."
 CHT_regional.28.a: "Стіни починають стискатися..."

 CHT_regional.29.t: "Вистава маріонетки"
 CHT_regional.29.desc: "«Ваша Імператорська Величносте,\n\nЧерез останні загрози безпеці ми скоригуємо ваш щоденний розклад, щоб якнайменше наражати вас на небезпеку. Загроза большевицького проникнення надто велика, щоб ризикувати. Нижче для вашої зручности подано новий розклад...»\n\nРуки Міхаїла II злегка затремтіли, коли він пробіг очима список годин у листі Шепунова. Спершу виснажений розум сприйняв це за злий несмаковний жарт, але тоді цар усвідомив: цей папір визначатиме все його подальше життя.\n\nЗа новим розкладом цар із замкненого відлюдника перетворювався на привида. Вони взагалі хотіли, щоб він знову побачив сонце? Міхаїл розумів підтекст. Жодного большевицького проникнення не було - лише привід сховати царя ще далі, щоб не заважав амбіціям Білої армії.\n\nЗітхнувши й відклавши листа, Міхаїл відчув вир різних почуттів. Обличчям скотилася сльоза, але не було сили навіть плакати. Він просто сидів у приголомшеній тиші, поки холодна правда знову ставала очевидною:\n\nДоки Білій армії треба, щоб він танцював під її лиху музику, Міхаїл не вийде із цього жахливого місця живим."
 CHT_regional.29.a: "Навіщо кликати на допомогу, якщо ніхто не почує?"

 CHT_regional.30.t: "Позолочена клітка"
 CHT_regional.30.desc: "У кабінеті царя Міхаїла сьогодні було холодніше. Не за температурою, а через атмосферу, яку насадила Біла армія. Вірних особистих імператорських ґвардійців, що стояли поруч від початку царювання й були найкращими захисниками, замінили звичайні піхотинці Білої армії. Вояків, гідних охороняти короля, звільнили одним коротким наказом.\n\n«Де мої люди? - спитав цар Міхаїл у Шепунова, схрестивши руки в затишному коридорі. - Я не знаю цих вуличних головорізів. Це не ті, хто останні роки був готовий прийняти кулю за мене!» Шепунов знизав плечима й відвернувся.\n\n«Ви й самі бачите приховану загрозу большевизму в нашій державі, царю. Читали звіти про большевиків серед нас, що чекають нагоди вдарити - вдарити по вас. Ґвардія була надійним союзником, але вона надто віддалена від ланцюга командування й легко піддається ворожому проникненню. Запевняю, мої люди захищатимуть вас не гірше».\n\nМіхаїл зітхнув, не здатний навіть подивитися Шепунову в очі. Він нізащо не обрав би радикалів. Усі ці люди були готові стікати кров'ю й померти за царя незалежно від переконань. Добрі охоронці, непохитні захисники й, найважливіше, можливі друзі. Люди, яким можна довіряти. Та сперечатися із Шепуновим було однаково що бити цегляну стіну.\n\n«Як наполягаєте, триматиму цих людей близько».\n\n«Недостатньо, царю. Вони мають бути й будуть ближче за попередників»."
 CHT_regional.30.a: "Під наглядом ненадійних головорізів..."

 CHT_regional.31.t: "Царська втеча"
 CHT_regional.31.desc: "Міхаїл II задихався, біжучи щодуху. Він сподівався, що охорона не відразу помітить зникнення й дасть йому розчинитися в ночі. Треба лише подолати огорожу - і він вільний, мов птах.\n\nЦар-утікач крекнув і поліз на високу металеву огорожу довкола дачі. Залізні прути були холодні й слизькі від роси. Міхаїл був не в тій формі, тож кожен рух угору давався важко. За кілька болісних секунд він таки сів на верхівці. Хотів перевести дух і придумати, як злізти, не зламавши ніг, але раптом його освітив яскравий промінь. «Ось ви де! Ми мало не збожеволіли з тривоги, Ваша Величносте!»\n\n«Чорт!» - пробурмотів він, коли з'явився охоронець, досі світячи ліхтарем. Міхаїл швидко стрибнув у кущі. Приземлення було неприємне, але листя пом'якшило падіння. Та щойно він підняв голову, то побачив іще трьох солдатів.\n\nПерший заговорив без тіні веселощів: «Краще ходімо з нами, Ваша Величносте. Так пізно тут небезпечно». Міхаїл переможено кивнув, виліз із кущів і рушив із полонителями назад до дачі. Мовчазна дорога дала час обміркувати коротку пригоду. Звідси не втекти, а тепер вони напевне подбають про це вдвічі ретельніше."
 CHT_regional.31.a: "Від долі не втечеш."

 CHT_regional.32.t: "Затягуємо зашморг"
 CHT_regional.32.desc: "Шепунов не жартує. Закріпившись як де-юре й де-факто прем'єр-міністр, він мусив швидко зміцнити власне становище. Без Шепунова й Білої армії держави не існувало б. Спроби Царя в клітці замінити нас цивільним урядом погано для нього скінчаться; він та інші вершки суспільства мають засвоїти урок. Цивільна влада - ще крок до большевизму й катастрофи, якої ми не бажаємо пережити знову.\n\nСьогодні вранці в кабінеті схопили чітинського сталевого маґната, який висловлював неправильні думки про армію та уряд Шепунова, й заарештували як ворога держави. Люди з його найближчого кола розповіли нам про чудові тиради з наклепами, зневагою та цинізмом щодо влади. То він нап'ється й скаржиться на переслідування піхотинців, то шепоче довіреній особі про недовіру до Шепунова й великі сталеві квоти. Галас був такий, що робота в конторі зупинилася й усі дивилися на метушню Білої армії.\n\n«Нам стало відомо, що ваш начальник - союзник большевиків, а отже зрадник держави й загроза Святому Цареві. Тому його заарештовано. Не втручайтеся».\n\nКоли злегка побитого маґната в кайданках виштовхнули з кабінету, люди в конторі й на вулиці могли лише дивитися йому в очі або відводити погляд від яструбиних очей білоармійців, що вели його до в'язниці."
 CHT_regional.32.a: "Відрікся Білої армії - потрапив до чорного списку."

 CHT_regional.33.t: "Відгомін"
 CHT_regional.33.desc: "Іван Міхайлов розчахнув двері, коли Шепунов саме пив каву. Старий ґенерал здригнувся й облив мундир окропом. «Ар-р, бляха! - скрикнув він. - Дивіться, що ви наробили!»\n\n«Ні, Шепунове, подивіться, що наробили ВИ! Арештовувати промисловців серед білого дня? Якого біса ви коїте?!»\n\n«М-м, то ось у чім річ, - пробурмотів Шепунов, тягнучись по серветку. - Міхайлове, ви ж розумієте: я мушу вживати всіх заходів задля безпеки держави. Ті люди співчували большевикам і...»\n\n«Ой, годі! Багаті власники фабрик - прихильники большевиків? Думаєте, хтось повірить у це лайно?! Ви заарештували їх за критику!»\n\nШепунов грюкнув долонею по столу. «І ЗРОБИВ БИ ЦЕ ЗНОВУ! Я не для того зайшов так далеко, щоб самовдоволені крамарі знищили наші здобутки. Ворог наступає, а ви хочете, щоб я гаяв час на людей, яким від початку було байдуже? Ідіть, Міхайлове, й скигліть комусь, кому не треба рятувати цілу країну!»\n\nМіхайлов сердито розвернувся й мовчки пішов. Шепунов уже й не приховував намірів посилити владу своєї кліки над Імперією. Якщо цьому майбутньому тиранові треба покласти край, думав міністр, діяти слід негайно..."
 CHT_regional.33.a: "Невже вже запізно?"

 CHT_regional.34.t: "Вітри незгоди"
 CHT_regional.34.desc: "Дмітрій Волкоґонов із залогою Білої армії вийшов на вулиці Іркутска зі зброєю напоготові. Натовп протестував проти постійного воєнного стану. Большевиками вони не були, але зрозуміло, чому їх такими вважали: пристрасні, енергійні й готові до боротьби, наче небезпечні радикали часів громадянської війни. Напруга висіла в повітрі, але залога непохитно сунула на протестувальників.\n\nРаптом полетіла «жданівка». Тоді заговорили рушниці. Волкоґонов наказав припинити, але вулиці вже стали полем бою. Люди тікали під вогнем, солдати били їх прикладами й стріляли навздогін. Палкі вигуки змінилися криками жаху, й військо швидко повернуло контроль. Він міг лише дивитися, як його люди й молодші офіцери іґнорують накази та ріжуть бунтарів, мов беззахисну худобу. Панічні крики й видіння підлеглих, що стали кровожерними звірами на вулицях Іркутска й нікого не щадили в несамовитій люті, переслідували його тижнями. Коли стрілянина нарешті стихла, лишилася моторошна тиша."
 CHT_regional.34.a: "Жахливий кінець."

 CHT_regional.35.t: "Помітна нитка"
 CHT_regional.35.desc: "У приватних покоях Шепунова щойно завершилася тиха розмова про наслідки протесту в Іркутску. Аґент ІДОС під його наглядом докопався до витоків заворушень і не знайшов слідів большевиків. Це був місцевий, нелівий протест. Але важливішим було інше: до нього глибоко причетний член уряду.\n\n«Ви певні, що це він? Жодних сумнівів?» Аґент кивнув і передав фотографії.\n\n«Так, пане. Я твердо встановив, що люди Івана Міхайлова значною мірою забезпечили силу й масштаб протесту: щонайменше публічно підтримували, а щонайбільше постачали стрілецьку зброю й відкликали місцеву поліцію». Шепунов не здивувався, та приховав жах. Якщо його ж призначенці працюють проти нього, невже вони підтримають Царя-маріонетку замість Білої армії?\n\n«Це все. Дякую». Шепунов відпустив аґента й голосно зітхнув, коли двері зачинилися. Навіть маючи майже необмежену владу, він не знаходив надійного способу розв'язати нову щурячу проблему. Цілісність уряду явно суперечила бажанням сил, можливо вірних цареві. Роботи було багато, і жодної її краплі він не віддасть на поталу Міхаїловим хитанням."
 CHT_regional.35.a: "Можливо, час накрити Царя в клітці."

 CHT_regional.36.t: "Неприємне пробудження" 
 CHT_regional.36.desc: "Боріс Шепунов прокинувся від пронизливого дзвону й здивувався: у кімнаті було майже непроглядно темно. Дзвонив не будильник, а телефон біля ліжка. Щось нерозбірливо бурмочучи, напівсонний Шепунов навпомацки пошкандибав до слухавки, навіть не вмикаючи світла. «Хто це, в біса? Ви знаєте, котра година?!»\n\n«Перепрошую, пане. Це Коссов. Маю важливі відомості у справі Міхайлова».\n\n«І не могли дочекатися ранку? - зітхнув Шепунов. - Просто... кажіть, що довідалися».\n\n«Щойно надійшов цілком однозначний звіт ІДОС. Міхайлов і його союзники без сумніву стоять за всіма останніми випадками. Гірше того, є підстави вважати, що він разом із царем готує виступ проти уряду. Повний звіт буде завтра».\n\nШепунов здригнувся, і не від холоду. «Добре, Коссове. Так тримати». Повернувшись у ліжко, старий ґенерал уже не міг заснути. Він щойно дізнався, що осердя його руху, можливо, змовляється проти нього. Після всіх трудів Біла Росія вже була готова розірвати себе. Коли зійшло сонце, Шепунов так і не відпочив: найбільше випробування вже наближалося."
 CHT_regional.36.a: "Майбутнє Росії буде вирішено."

 CHT_regional.37.t: "Плян дій"
 CHT_regional.37.desc: "«...Із частинами ґенерала Волкоґонова ми захопимо урядовий апарат у всіх великих містах і позбавимо їх змоги швидко відповісти. Здобутою зброєю можна озброїти парамілітарні загони, щоб заповнити прогалини».\n\nВолкоґонов примружено дивився на мапу, схрестивши руки. «Даруйте, Міхайлове, але ви дещо забуваєте. У Шепунова значна чисельна перевага. Навіть із моїми частинами й усіма, кого я зможу переконати, наше становище погане».\n\n«Я згоден із ґенералом, - почав Міхаїл II. - Ми не можемо сподіватися захопити кожне місто за такої переваги Шепунова. Здається, ми самі кличемо катастрофу...»\n\nМіхайлов відійшов від мапи й зітхнув. «З усією повагою, панове, катастрофа буде неминуча, якщо ми впадемо в зневіру. У Шепунова більше військ, але на нашому боці раптовість! Ударимо досить швидко й сильно - і лисий виродок нічого не зрозуміє, поки не буде пізно».\n\nВолкоґонов тривожно глянув на Міхаїла й дістав такий самий погляд у відповідь. Міністрові фінансів не бракувало завзяття, та двоє інших починали сумніватися, чи розуміє він дійсність. Змовники зібрали чимало прихильників, але чи вистачить їх проти переважної сили Білої армії?"
 CHT_regional.37.a: "Можливо, потрібен «плян Б»?"

 CHT_regional.38.t: "Рішучі запобіжні заходи"
 CHT_regional.38.desc: "«Панове, - почав Шепунов, оглядаючи офіцерів і ґенералів, - наш уряд під загрозою. Нашестя большевицьких аґентів начебто вщухло, зате колеґи з цивільної адміністрації невдоволені нашим правлінням і вирішили діяти самі».\n\n«Невдячні виродки. Треба розчавити їх усіх і покінчити із цим», - урвав його Ніколай Коссов грубим і гірким голосом.\n\nДмітрій Волкоґонов утомлено зітхнув. «І знову повернути зброю проти цивільних? Не пам'ятаєте, що було минулого разу, Коссове? Треба діяти розумно».\n\n«Ґенерал Волкоґонов має рацію: після провалу в Іркутску слід бути обережними. Замість громити всю адміністрацію проведемо чіткий і впорядкований контрпереворот. Розгорнемо частини в Чіті й за слушної нагоди затримаємо Міхайлова та бунтівного царя».\n\n«А ким його замінити? - спитав Владімір Абрамов. - Ми зайшли надто далеко, щоб скасовувати монархію. Це матиме поганий вигляд».\n\n«Князь Нікіта буде належною заміною. Він довів відданість нашій справі й, заради Бога, принаймні говорить російською. Якби ж у Харбіні замість Міхаїла з'явився він...»"
 CHT_regional.38.a: "Його Величність вичерпав свою корисність."

 CHT_regional.39.t: "Сцену підготовлено"
 CHT_regional.39.desc: "Попри прикрі обставини з кожним днем Міхаїл дедалі менше почувався в'язнем. Із дачі досі майже не випускали, але він тішився думкою, що так буде не завжди.\n\nБезглуздий на перший погляд задум посісти законне царське місце, виплеканий разом із міністром фінансів, нарешті втілювався. Вірні частини Білої армії під командою ґенерала Волкоґонова вже готувалися до миті, коли жереб буде кинуто й Міхаїл виступить проти свого тюремника.\n\nТа наслідок перевороту непокоїв його не менше. Ґенерал теж сумнівався, чи здійсненний плян за такого короткого часу. А якщо Волкоґонов має рацію? Якщо задум Міхайлова надто сміливий, а кліка Шепунова скористається великою чисельною перевагою й перехопить ініціятиву?\n\nІ що буде з Міхаїлом у разі поразки? Шепунов змилосердиться й відправить додому чи приготує кривавішу долю? Ці та інші питання тяжіли над полоненим царем.\n\nМожливо, він просто надто довго готувався й обмірковував те, чого не міг контролювати. Чи не час трохи відпочити? Він давно не запрошував Івана Міхайлова на вечерю. Тихий вечір із друзями міг бути саме тим, чого потребував виснажений розум..."
 CHT_regional.39.a: "Нагода перевести дух..."

 CHT_regional.40.t: "Сибірський кандидат"
 CHT_regional.40.desc: "«А, прем'єр-міністре Шепунов! Прошу, заходьте!» Князь Нікіта запросив гостя, який явно був не в такому люб'язному настрої, як господар.\n\n«Перепрошую, Ваша Високосте, та це не світський візит. Я маю досить... тяжкі новини».\n\n«Розумію. Ходімо до кабінету». Тепла ввічлива радість Нікіти змінилася легкою розгубленістю. Похмурий тон Шепунова тривожив старого князя. Вони пішли до відокремленої тихої вітальні на дачі. Затягнуті штори робили кімнату гнітючою.\n\nСівши, Шепунов склав руки. «Нікіто, маю підстави вважати, що ваш кузен замишляє повалення уряду. Ми вже вживаємо заходів, але вирішили повідомити вам».\n\nНікіта застиг. «Мій кузен? Повалити уряд? Це божевілля - він уже цар, чого ще бажати?»\n\n«Поки неясно, Ваша Високосте, але він не може лишатися монархом, задумуючи зраду власної країни. Ви - єдиний присутній Романов із вагомими правами, тож посідете його місце». У грудях Нікіти наростала тяжкість. Надто багато відомостей за раз. Він мало говорив із Міхаїлом і ніколи не вважав його здатним на такий рішучий крок. Проте й сам Нікіта був не проти прийняти корону предків..."
 CHT_regional.40.a: "Від однієї маріонетки до іншої."

 CHT_regional.41.t: "Сталеві вершники"
 CHT_regional.41.desc: "Морозний далекосхідний вітер пронизував товсті шинелі вояків 8-ї Сибірської козацької дивізії, а опівнічне сонце кидало на сотню моторошне світло. Єсаул Ураков вийшов до людей, блискаючи темними очима з-під хутряної шапки. Командир сотні був напрочуд веселий і швидко ступав.\n\n«Хлопці, ви, мабуть, думаєте, на біса я вигнав вас на холод так рано». Козаки забурчали й почали лаятися, але єсаул швидко їх урвав. «То замовкніть, курва, й дізнаєтеся! Так краще». Металевий вереск і скрегіт привернув усі погляди до колії, яку охороняв табір. Перед ним зупинився потяг із довгою вервечкою плятформ. Під важкими брезентами ховалися масивні обриси.\n\n«Нарешті! - вигукнув Ураков. - Нумо, хлопці, розгорнімо царські подарунки!» Козаки кинулися до потяга й, повідчіплявши ремені, вражено всміхнулися. «Тепер ви танкова дивізія! - крикнув єсаул. - Варіть коней і звикайте до запаху мастила»."
 CHT_regional.41.a: "Міняємо копита на гусениці."

 CHT_regional.42.t: "Звичайний робочий день"
 CHT_regional.42.desc: "На ранньому світанку зморшкуватий старий вийшов на ґанок зі склянкою горілки. Кіріл відкинувся в кріслі, смакуючи прохолодне ранкове повітря. Ще кілька років тому він пішов би в дику природу полювати чи збирати припаси, та від знайомого лісу майже нічого не лишилося.\n\nСтарий мисливець опустив погляд на величезний промисловий парк, що поглинув глушину. Він і сам доклався: продав душу за гроші й допоміг знищити ліс, який годував його родину поколіннями. ІКР щедро платила; гроші дали зберегти дім і навчити дітей, щоб ті досягли успіху в новому Сибіру.\n\nЙого діти працювали десь унизу, в безкрайнім морі сталі й бетону. Сибір приборкали, глушину замінила цивілізація, але таким, як він, у ній не було місця. Діти ніколи не житимуть його життям - можливо, й на краще, - та де інші бачили поступ, він бачив лише ціну для тварин, лісів і річок.\n\nСклянка спорожніла, алкоголь притупив сповнений жалю й дедалі дальших спогадів розум. Старий мисливець звівся й пошкандибав до хати. Останній дикий звір на цивілізованій землі."
 CHT_regional.42.a: "Ціна поступу."

 CHT_regional.43.t: "Інша в'язниця"
 CHT_regional.43.desc: "Поклавши на конвеєр уже сотий за день артилерійський набій, Андрєй зітхнув, озирнувся, чи не дивиться наглядач, і розім'яв хвору спину.\n\nКолишнього бійця матковської фракції РФП взяли в полон під час падіння Маґадана. Трохи посидівши в царському таборі й гадаючи про долю, він раптом дістав прості знаряддя й був відправлений на залізну шахту біля Чіти. Довгі години під землею майже звели його з розуму й знищили фізично.\n\nТа так само раптово його посадили у вантажівку й невдовзі привезли на завод боєприпасів. Складати й полірувати набої було важко, але не так, як копати. Хоч охоронців тепер стало більше.\n\nВін їх не звинувачував. Колишні вороги поруч із вибухівкою непокоїли б і його. Але від тих, хто досить розумний і розуміє становище, боятися нічого.\n\nНавіть якби втеча чи саботаж були можливі, іти нікуди, а Матковского більше немає. Робота на заводі тяжка, та значно краща за шахту; їжа й бараки теж. Тому Андрєй працюватиме, й працюватиме тяжко. Колись царисти мусять його відпустити.\n\nА доти - праця. Закінчивши розминку, він знову взявся за конвеєр. До кінця дня треба було зробити ще сотні набоїв."
 CHT_regional.43.a: "Примусова робоча сила."

 CHT_regional.44.t: "Літаки в Харбіні"
 CHT_regional.44.desc: "«...А це Ki-209, винищувач-бомбардувальник вантажністю понад 10 000...» Шепунов перестав слухати монотонного японського провідника. Харбінська авіябаза давно була осередком авіяції, але зараз у нього не було ні терпіння, ні технічних знань, щоб стежити за поясненнями. У Чіті штаб однаково дасть короткий виклад.\n\nДивлячись на річку Сунґарі, Шепунов милувався землею, де провів стільки років. Харбін зберігав безліч спогадів, мало з яких були приємними, але навіть він цінував природну красу краю - ту її частину, яку не поглинув промисловий смог.\n\nПовернувшись до екскурсії, він помітив дивний літак із заднім гвинтом і крилами, зсунутими до хвоста. «Даруйте, полковнику, що це за літак?» - урвав він офіцера, не відводячи погляду.\n\nПровідник опанував себе й простежив за його очима. «Це J7W3 Shinden, старий перехоплювач останніх днів Другої світової. Кажуть, керується добре, але застарів більш як на десятиліття, пане», - роздратовано відповів зв'язковий.\n\nҐенерал майже не чув: він уже тягнув усю свиту розглядати машину зблизька."
 CHT_regional.44.a: "«Захопливо»."

 CHT_regional.45.t: "Повернення на гастролі"
 CHT_regional.45.desc: "Склад наповнювала гудлива напруга, звична для саблінського штабу. Думка про білу облаву не полишала присутніх, і кожен підпільник присягнув товаришам та абсолютній таємниці. То звідки ІДОС точно знала, де їх шукати? Двері злетіли із завіс, усередину ввірвався царський ескадрон смерти, а саблінці кинулися по зброю. Васілій, Катя й Боріс загинули в перші секунди: м'які легені й серця, тверді черепи розквітли кривавими трояндами від царських куль. Шалена куля пробила портрет Сабліна в кінці столу, але дзвін скла потонув у тріскоті пострілів. Ленінці відстрілювалися з пістолетів і дешевих пістолетів-кулеметів, ховаючись за перекинутими столами. Інші намагалися втекти; останнім перед снігом вони бачили спустошені, зраджені обличчя товаришів, яких любили понад усіх.\n\nОперація мала величезний успіх. Кожен комуністичний бандит був порахований: мертвий або в ніжних обіймах ІДОС. Кров стікала на повалений портрет. Якби хтось придивився, то подумав би, що Саблін плаче кров'ю."
 CHT_regional.45.a: "Білий терор повертається."

 CHT_regional.46.t: "Негаразди на воді"
 CHT_regional.46.desc: "У капітана Максіма бурчало в животі, коли він ходив носом посудини, яку більшість ледве назвала б кораблем. Уже кілька днів строката команда не бачила на річці жодного судна й починала голодувати.\n\n«Я казав, що не треба так люто грабувати, - озвався матрос. - Ми розігнали всі вантажні кораблі на багато кілометрів».\n\n«Може, ми ловили б більше, якби ти слухав накази, а не сперечався», - гаркнув роздратований Максім. Він сказав би ще, але побачив величезний транспорт, який прямував просто до них.\n\n«Усім на місця, корабель іде!» - крикнув Максім, коли їхня посудина набрала хід. Команда приготувала зброю біля борту, та в голові капітана ворухнулася думка: кораблі зазвичай не пливуть до піратів.\n\nПерш ніж він устиг наказати розвертатися, черги великокаліберного кулемета розірвали корабель і команду. Серед рожевого туману й дерев'яних скалок Максім пірнув у воду. В останню мить він підняв очі й прочитав напис на кораблі, чий кулемет уже цілився в нього."
 CHT_regional.46.a: "«Громобой» - Імператорський флот Росії."

