 ### Starting tree ###
 CHT_the_true_heirs_of_harbin: "Справжні спадкоємці Харбіна"
 CHT_the_true_heirs_of_harbin_desc: "Коли большевики повалили незаконний уряд Александра Керенского у Жовтневій революції, вони вкинули Росію в хаос. Біла армія, і ми серед неї, роками хоробро билася з ними, доки не була змушена відступити. Зберігаючи віру у відновлення царської влади, ми перебралися до маньчжурського Харбіна, створили уряд у вигнанні й уклали малоймовірний, але необхідний союз із Россійской Фашистской Партієй.\n\nКоли Совєцький Союз розпався під натиском нацистів, ми скористалися нагодою й разом із царем Міхаїлом II рушили посісти належне нам місце. Та фашисти зрадили нас, зупинили наступ і розділили територію. Вони претендують на легітимність, але не мають її. Під проводом Ґріґорія Сємьонова та його незмінно вірних генералів, справжніх патріотів Матінки-Росії, ми розіб'ємо їх і доведемо, що саме ми - справжні спадкоємці Харбіна."

 CHT_civilian_investments: "Царські інвестиції"
 CHT_civilian_investments_desc: "Що таке імперія без війська? І що таке військо без цивільної промисловости, яка його підтримує й виробляє все: від бойових пайків до засобів матеріяльного забезпечення й не тільки? Одного дня наша Імперія простягнеться на всю Росію, а зараз ми маємо закласти традицію царських інвестицій у вітчизняну цивільну промисловість - не лише задля підтримки нашого вічно голодного війська, звісно, а й щоб держава не повторила помилок минулого та подбала про кожного росіянина, від найбагатших жителів сяйних міст до найбідніших селян, давши всім нагоду заробити на заможне життя."

 CHT_mining_knowledge: "Сибірські ресурси"
 CHT_mining_knowledge_desc: "Сибір так часто змальовують як безмежну незаселену глушину, вкриту болотами й замерзлою тундрою. Це не зовсім хибна оцінка, але вона приховує матеріяльну цінність землі, яку ми нині займаємо. Її цінність не на поверхні, а під нею. У регіоні багато ресурсів, як-от срібло й мідь, які можна видобувати для власних потреб та експорту.\n\nТа найважливіший ресурс, якого може жадати будь-яка сибірська державка, - вугілля. Воно живить наші ненаситні фабрики, даючи їм змогу безперервно виробляти товари, потрібні для виживання й процвітання. Заради держави та економіки ми мусимо інвестувати у видобуток цих ресурсів."

 CHT_Military_investments: "Військова поправка"
 CHT_Military_investments_desc: "Жодна імперія не постає і не тримається без сильного війська. Без нас. Отаман Сємьонов, що провів нас довгим шляхом до Чіти, чудово це розуміє. Та нас послабили бюджетні скорочення, нав'язані цивільними. Це нестерпно. Небезпечно.\n\nМи подали поправку до бюджету, який нині розглядають. Якщо її ухвалять, ми отримаємо ресурси для підготовки до майбутніх боїв. Треба лише зустрітися з царем і переконати його у важливості поправки. Без неї держава не вистоїть."

 CHT_import_industrial_expertise: "Зв'язатися з реформаторами-бюрократами"
 CHT_import_industrial_expertise_desc: "Сумна правда полягає в тому, що нашому промисловому організмові гостро бракує будь-яких знань і досвіду. Усі технічні та промислові фахівці, що колись жили в Чіті, або загинули за десятиліття боротьби, або втекли - схоже, куди завгодно, аби не сюди. Та як без знавців промислового управління й розвитку забезпечити дієву та ефективну розбудову? Очевидно, потрібна стороння допомога. Попри проживання в Чіті багато білих чиновників досі мають значні зв'язки в Харбіні, а отже, і в усій Маньчжурії. Варто звернутися до маньчжурських реформаторів-бюрократів - людей, відповідальних за дивовижну індустріялізацію їхньої держави, - й дізнатися, чи мають вони зайві ресурси або фахівців. Можливо, за їхній досвід доведеться заплатити, але він напевне того вартий."

 CHT_connecting_chita: "Імператорська транспортна комісія"
 CHT_connecting_chita_desc: "Сибір, м'яко кажучи, безкрайній і погано сполучений. Багатьом нашим солдатам доводиться тижнями марширувати з місця на місце, а селянам у містечках і селах наших володінь часто ще гірше. Економічна неефективність, породжена цими логістичними проблемами, просто неприйнятна, особливо з огляду на конфлікти за обрієм. Ми повинні заснувати Імператорську транспортну комісію, очолену, звісно, найдосвідченішими нашими друзями з білої еміграції, і доручити їй сполучити всі міста та великі села нашої державки."

 CHT_industrial_machinery_deal: "Імпортувати промислове обладнання"
 CHT_industrial_machinery_deal_desc: "Наше промислове обладнання, м'яко кажучи, жахливе. Інші, ввічливіші члени адміністрації висловлювалися про його стан іще правдивіше. Насправді більшість фабричного устаткування успадковано від совєтів, і майже все воно в кращому разі розвалюється, а в гіршому - геть непридатне. Але ж нові станки не зробиш без, власне, справних станків.\n\nТому ми маємо шукати способи імпортувати промислове обладнання, щоб запустити власні вітчизняні цивільні галузі - можливо, допоможуть старі друзі в Маньчжурії. Це не лише забезпечить нам працездатну промислову економіку, а й дасть фабрикам змогу ефективно випускати зброю та припаси для солдатів."

 CHT_examining_the_force: "Офіцерські прохання"
 CHT_examining_the_force_desc: "Кожному доброму війську потрібен умотивований офіцерський корпус. Ми можемо обіцяти їм майбутню славу, але зараз мусимо пообіцяти гроші. Офіцерам ганебно мало платять, а забезпечують іще гірше, та їхні підлеглі живуть у набагато тяжчих умовах. Вони просять коштів не собі в кишені, а на належне спорядження для своїх людей.\n\nЇхні прохання шляхетні й справедливі, й цар напевне побачить мудрість у тому, щоб належно спорядити вірних солдатів перед хороброю зустріччю з його численними ворогами. Тож ці кошти буде додано до наших бюджетних запитів."

 CHT_examine_our_artillery: "Сучасний артилерійський корпус"
 CHT_examine_our_artillery_desc: "Дві світові війни остаточно довели перевагу артилерії та її здатність суттєво посилити військо на полі бою. Це один із небагатьох принципів, щодо яких згодні і старші, і молодші офіцери.\n\nОднак нашої артилерії мало, та й виготовлено її бозна-коли. Це обійдеться дорого, але інвестиції в новий сучасний артилерійський корпус із власними конструкціями й організацією забезпечать нам найкращу артилерію в Сибіру!"

 CHT_new_infrastructure: "Імператорський корпус старателів"
 CHT_new_infrastructure_desc: "Більше міді, більше заліза, більше вугілля... більше, більше, більше! Нинішніх виробничих квот геть недостатньо, щоб устигати за стрімким - ні, експоненційним - промисловим зростанням. Думка про те, що нам забракне ресурсів для величезної кількости нових фабрик, просто жахає. На прохання найкращих економістів Чіти Міхаїл оголосив про створення Імператорського корпусу старателів, організації, що шукатиме поклади корисних копалин у наших кордонах і розпочинатиме їх розробку. Прогрес, безумовно, має ціну, й ІКС це добре розуміє. Та в такій дикій землі, як Сибір, Матінка-Природа мусить поступитися поступові заради добробуту царських підданих."

 CHT_public_works_company: "Імператорська компанія розвитку"
 CHT_public_works_company_desc: "У найтемніші дні анархії, що запанувала в Сибіру після остаточного утвердження нашої держави з центром у Чіті, безробіття було повсюдним, а багато людей стали мандрівними робітниками без власної домівки. Нині становище краще, але цивільний сектор досі потерпає.\n\nТому кілька визначних економістів запропонували заснувати Імператорську компанію розвитку - державну корпорацію, що керуватиме й фінансуватиме громадські роботи, даватиме людям роботу та розвиватиме нашу скалічену цивільну промисловість. Перебудова цивільного сектору має першорядне значення для працездатної економіки під час майбутніх воєн за возз'єднання."

 CHT_industrialization: "Промислова імперія"
 CHT_industrialization_desc: "За щедрої допомоги Імператорської компанії розвитку та Імператорської транспортної комісії промисловість Чіти, серця білого руху, за лічені місяці, схоже, перейшла від смертельної слабкости до бурхливого зростання. Зі зміцненням промисловости й випуску ми будуємо дедалі більше фабрик у безперервному циклі індустріялізації.\n\nТа зупинятися не можна: це зростання - лише малий крок до повністю індустріялізованої держави від Тихого океану до Балтики. Моделі розвитку, які ми створили й випробували в Чіті, та їхній загальний успіх стануть прикладом на майбутнє. А поки - хороброму робітникові не до спочинку."

 CHT_war_resources: "Видобуток стратегічних ресурсів"
 CHT_war_resources_desc: "Промислове обладнання з Маньчжурії та інших країн відродило цивільну промисловість і дало змогу запустити наявні фабрики, але, на жаль, його замало для розширення видобутку ресурсів. Імператорська компанія розвитку, хоч би якою ефективною була досі, виявилася бездонною ямою, що вимагає дедалі нових ресурсів для виконання графіку робіт. Однією з найнагальніших вимог її адміністрації стало розширення видобутку. Тож тепер, коли це стало можливим, ми повинні власними силами вдосконалити промислове обладнання й повною мірою скористатися природними багатствами щедрого Сибіру!"

 CHT_reclamation_act: "Закон про освоєння земель"
 CHT_reclamation_act_desc: "У нашого малого анклаву є багато чого: незмінно відданий офіцерський корпус, найкращі війська, які можна набрати, і фабрики, що день і ніч вивергають готові промислові товари. Бракує нам лише придатної орної землі. На жаль, за межами Чіти й кількох вартих згадки містечок і сіл більшість земель під владою Імператора всієї Росії та його адміністрації цілком непридатна.\n\nБезкраї болота й такі густі ліси, що між деревами ледве протиснеться людина. Після мудрої поради, прошептаної самому царю, Міхаїл II оголосив про впровадження Закону про освоєння земель. Він доручає Імператорській компанії розвитку розчищати непридатні землі й перетворювати їх на ділянки для чого завгодно - від маловрожайних полів до військових полігонів. Усе краще за злиденну глушину, яку ІКР мусить розчищати нині."

 CHT_importing_rifles: "Імпортувати японські надлишки"
 CHT_importing_rifles_desc: "Царю кажуть, що наша молода промисловість день і ніч виробляє найкраще спорядження для солдатів. Це ввічлива вигадка. Насправді ми не можемо випустити досить рушниць, гармат і набоїв навіть для наявних бійців, не кажучи вже про майбутніх новобранців.\n\nЗа роки в Харбіні ми чудово користувалися спорядженням, яке давали японці. Маньчжоу-ґо лежить просто за Аргунню, і там у нас досі багато зв'язків. Імпортувати малу частину величезних запасів японської зброї, розкиданих по країні, має бути нескладно."

 CHT_artillery_imports: "Підтримати артилерійські інвестиції"
 CHT_artillery_imports_desc: "План офіцерів із модернізації артилерії майже готовий. Спільними зусиллями старші та молодші офіцери швидко розробили докладний план повної перебудови армійської артилерії - і доктрини, і конструкцій. Лишилося тільки отримати царське схвалення.\n\nЦар Міхаїл знає, наскільки важливе військо і скільки ми зробили, скільки крові пролили за нього. Він нам не відмовить. Не зможе."

 CHT_specialist_training: "Підготовка фахівців"
 CHT_specialist_training_desc: "У сучасній війні панує фахівець - солдат, навчений і досвідчений у завданнях, непосильних для звичайного бійця. Нас оточують вороги, але цар може не сумніватися: перемогу забезпечить перетворення солдатів на армію фахівців.\n\nДо звичайної підготовки ввійдуть децентралізоване командування, дії в тилу ворога, диверсії та багато іншого. Так ми зможемо сказати, що нас ніколи не застануть зненацька."

 CHT_the_Far_East_Finest: "Найкращі на Далекому Сході"
 CHT_the_Far_East_Finest_desc: "Наше військо сибірське, й дуже мало солдатів та молодших офіцерів бували на захід від Уралу. Але це наша сила: якщо вони виживають і процвітають тут, то зможуть будь-де!\n\nВключивши їхні знання й цінності до стандартної підготовки, ми перетворимо збіговисько призовників, емігрантів і волоцюг на найкращих на Далекому Сході - дисципліновану силу, майже невразливу до холоду й здатну тримати лад у найгіршу негоду. Ми певні, цар не бажав би іншого."

 CHT_the_Tsars_own_division: "Імператорські гвардійські дивізії"
 CHT_the_Tsars_own_division_desc: "У розмовах нашу армію часто називають «Царськими найкращими» - прізвисько покликане вселяти гордість у численних селян-призовників. Та дехто з офіцерів пропонує втілити його в життя й зібрати в окремих частинах ретельно відібраних найвідданіших, найдосвідченіших і фізично найміцніших солдатів.\n\nСтарі царі мали Імператорську гвардію - елітну піхоту, здатну виконати будь-яке завдання й надихнути інших на велич. Цілком природно, щоб цар Міхаїл, законний Імператор, мав власну."

 CHT_the_tsar_combined_arms: "Єдина доктрина"
 CHT_the_tsar_combined_arms_desc: "Одна з найбільших військових проблем - постійні суперечки й чвари офіцерів щодо оперативної доктрини. Старші генерали тримаються за грандіозні пляни Великої війни, а молодші пропонують загальновійськовий бій. Це паралізує поступ, і далі заплющувати очі не можна.\n\nМи мусимо ухвалити рішення, що визначить майбутнє збройних сил. Скличемо конференцію з найстаршими й найвинахідливішими офіцерами під головуванням царя. Під поглядом монарха вони нарешті вироблять єдину доктрину."

 CHT_true_modern_warfare: "Сучасна війна"
 CHT_true_modern_warfare_desc: "Хай як це неприємно, слід визнати, що большевики запровадили новації в сучасній війні. Проти німців вони застосували їх невдало, та однаково встановили стандарт війни на безкраїх просторах Росії.\n\nВійна змінилася, і очевидно, що ми маємо вкладатися в механізацію та моторизацію армії, щоб солдати були належно споряджені для сибірських боїв, попри протести старших офіцерів. Наша Імперія не може повторити помилки попередників - відстале мислення слід викорінювати за будь-яку ціну."

 CHT_stabilize_budget: "Зробити свій хід"
 CHT_stabilize_budget_desc: "Тепер, коли цивільна промисловість забезпечена й зростає, кордони захищено оборонними схемами, а нагальні потреби війська задоволено, можна поглянути назовні й завершити те, що мало бути зроблено багато років тому: систематично знищити Россійскую Фашистскую Партію та її головорізів.\n\nЧас настав: ми скористаємося їхніми чварами, знищимо Партію й повернемо землі, які так тяжко здобували під час краху Союзу. Большевики нас не знищили, як не знищила і зрада фашистів. Тепер ми нарешті покажемо силу й витривалість справжнього білого руху!"

 CHT_western_defence_scheme: "Західна оборонна схема: Чіта"
 CHT_western_defence_scheme_desc: "Понад чотири десятиліття тому Чіта була столицею Забайкальського козачого війська, де отаман Сємьонов зробив останню спробу перемогти большевизм на Далекому Сході. Нині вона знову стала нашою надією повернути царя на належне місце в державі, й армія мусить ретельно захищати свої володіння.\n\nТимчасова столиця монархії небезпечно близька до межі нашого контролю. Іншого вибору, крім оборони, немає, тож Верховне командування запропонувало звести укріплення та розробити нові пляни, щоб Чіта не впала. На захід і північ від міста розмістять додаткові гарнізони й створять нові оборонні рубежі. Як наш штаб, Чіта стане першим місцем перебудови оборони."

 CHT_western_defence_scheme2: "Західна оборонна схема: Ульоти"
 CHT_western_defence_scheme2_desc: "Якщо рушити дорогою з Чіти на південний захід, просто перед землями комуністів трапиться мале поселення Ульоти. Спершу звичайне село привернуло увагу царських генералів як останній західний форпост під їхньою владою. Тут збудували невелику військову базу, де солдати охороняють головну дорогу до ворожих земель.\n\nЗа «Західною оборонною схемою», підтриманою більшістю царських генералів і схваленою Його Величністю, Ульоти буде зміцнено, адже всі розуміють: це вирішальне вузьке місце для будь-якого нападника. Новий, більший форпост убезпечить нашу роздроблену державу й, сподіваємося, затримає ворога із заходу, перш ніж той дістанеться Чіти."

 CHT_eastern_defense_scheme: "Східна оборонна схема: Срєдняя Ольокма"
 CHT_eastern_defense_scheme_desc: "На березі річки Ольокми, де вона входить у Забайкалля, лежить мале містечко Срєдняя Ольокма - можливо, наша найважливіша північно-східна база. Вона має вирішальне значення для оборони від фашистів Родзаєвского й далі служить опорним пунктом, через який царська армія утверджує владу на північному сході та стримує поодинокі наскоки ворожих правителів і звичайних бандитів.\n\nЯкщо ми хочемо одночасно просуватися у фашистські землі й захистити північний фланг, базу слід посилити. Це єдине наше місто в регіоні, тож воно мусить стати твердинею проти будь-якої армії."

 CHT_eastern_defense_scheme2: "Східна оборонна схема: Тупік"
 CHT_eastern_defense_scheme2_desc: "На південь від Срєднєй Ольокми, де ми нещодавно посилювали гарнізон, лежить Тупік - іще одне село, яке прихід Білої армії врятував від анархії чи гноблення. Ми готуємося до цілком реальної війни з Родзаєвскім, відомим як «Вождь» Амуру, і Тупік є ключовою частиною Східної оборонної схеми. Значно зміцнивши поселення, ми покладемо край постійним наскокам довкола нього й створимо ще одну сильну оборонну точку біля кордону.\n\nОднак багато урядовців вважають становище Тупіка особливим: село крихітне й не має жодних готових військових споруд. Попри це його визнано ключовим для східного рубежу, а найнадійніші царські генерали переконані, що зміцнити Тупік буде легко."

 CHT_eastern_defence_scheme3: "Східна оборонна схема: Амазар"
 CHT_eastern_defence_scheme3_desc: "Останній форпост, який ми мусимо укріпити, і, можливо, найважливіший з огляду на майбутній конфлікт із фашистами на сході - місто Амазар.\n\nТранссибірська магістраль, попри часті пошкодження, відбудови й руйнування останніх років, лишається життєвою артерією до земель за Уралом, сполучає місто за містом і дає змогу перевозити людей та припаси вздовж усього шляху. Амазару пощастило не лише ввійти до десятків міст на залізниці, а й ледве уникнути хватки Родзаєвского.\n\nЯк важливий залізничний вузол і останній східний табір, місто потребує особливої оборони. Сюди викличуть підкріплення для гарнізону й сформують розвідувальні підрозділи. Невдовзі вони можуть виявитися напрочуд корисними."

 #Consolidation Tree

 inconvenient_figurehead: "Незручна маріонетка"
 perfectly_legitimate_claimant: "Цілком законний претендент"

 CHT_the_vestigal_empire: "Рудиментарна імперія"
 CHT_the_vestigal_empire_desc: "Отаман Сємьонов, герой Російської громадянської війни й авангард білого руху на Сході, помер.\n\nСтарого козака проводжають у вічний спочинок, цілком заслужений після майже пів століття невтомної служби Росії, а ми мусимо зробити все, щоб справа його життя не занепала без нього. Щоб здолати величезний виклик нашої визвольної місії, характер руху доведеться докорінно змінити. Біла армія більше не є обдертим гуртом старих вигнанців, що їде в бій верхи, ніби славні дні нікуди не минули.\n\nНаші землі ростуть, лави поповнюють нові обличчя, і час звернути погляд у майбутнє. Починається перехід до справжньої національної держави. Правознавці вже працюють над новою конституцією Імперії, особливо наголошуючи на даній Богом владі царя та його вірних генералів і відкидаючи хаотичне панування натовпу, що призвело Росію до падіння. З цього скромного насіння постане легітимний уряд - якщо буде Божа воля, гідний вести визволення священної Батьківщини."

 CHT_an_inconvenient_figurehead: "Незручна маріонетка"
 CHT_an_inconvenient_figurehead_desc: "Ґріґорій Сємьонов чудово розумів: щоб завоювати прихильність народу, білому рухові потрібен образ, здатний пробудити національну гордість і об'єднати людей. Тому він обрав реставрацію монархії. Справжнім спадкоємцем був Владімір, але він пов'язав долю з німецькими загарбниками - в очах отамана це була непростима зрада. Тож усім іншим Романовим, яких удалося знайти, надіслали запрошення до Харбіна під приводом званого обіду на честь їхньої династії.\n\nВідповів лише один. Його звали Міхаїл Андрєєвіч.\n\nНазвати цю домовленість далекою від ідеалу - ще дуже м'яко: Міхаїл не був ані першим нашим вибором, ані другим, ані навіть десятим, і все ж іншого немає. Народ уже ставиться до царя скептично, а офіцерський корпус Білої армії його переважно не любить. Боріс Шепунов одним із перших заперечив проти вибору отамана, але на пошану до волі старого товариша має намір витиснути з обставин усе можливе. Народові поки не треба знати про сумнівні права царя; він їхній законний володар, і хай ніхто не каже інакше."
 CHT_an_inconvenient_figurehead_tt: "Нам доведеться довести, що §WМіхаїл§! - не порожня маріонетка. Така можливість §Gз'явиться§! в завданні §W$RUS_Mission_Smuta_CHT_MakeMikhailCool$§!.\n"

 CHT_the_most_interesting_man_in_the_world: "Найцікавіша людина у світі"
 CHT_the_most_interesting_man_in_the_world_desc: "Міхаїл Андрєєвіч, якщо прямо, до жаху нудний чоловік. Обставини прибуття довели його до нервового зриву, і тепер він лякається власної тіні. Російською майже не говорить і має лише примітивне розуміння мови з того, що на нього вигукують. Можливо, це було б неважливо, якби він мав харизму, та, на жаль, соціальної вправности в Міхаїла не більше, ніж у клінічно пригніченого сантехніка. Напевне, поки що варто сховати царя від публіки, дати час призвичаїтися, а за його відсутности створити зручнішу історію.\n\nПогляньте на царя Святої Руси! Ветеран Другої світової війни, наш монарх гордо служив у повітряних силах флоту. Після кар'єри відчайдушного повітряного героя, нагородженого незліченними медалями, скромний Міхаїл обрав просте життя генія авіяційної інженерії. Та коли отаман звернувся із закликом до світу, лише наш доблесний Міхаїл Андрєєвіч мав хоробрість відповісти. Однієї сніжної ночі в Харбіні він вразив білих вигнанців відданістю визволенню російського народу, а нині стоїть на чолі спасіння Росії!\n\nЗвісно, усе це цілковита нісенітниця, але вірним підданим необов'язково так її сприймати..."
 CHT_the_most_interesting_man_in_the_world_tt: "§WПропаганда§! - §Gдобра§! річ, особливо §Wпряма§!. Після завершення фокусу ми §Gзможемо§! §Wвикористовувати§! її через рішення §W$RUS_Decision_Smuta_CHT_MishaKrutoyChel$§!.\n"

 CHT_pamphlets_posters_and_programs: "Брошури, плакати й програми"
 CHT_pamphlets_posters_and_programs_desc: "Навіть після стількох років у далекому Харбіні Батьківщина жила в думках солдатів-вигнанців Білої армії: яскравий сон, такий близький до здійснення й водночас такий далекий. Та коли нарешті настав час повернутися додому, швидко з'ясувалося: вигнанці не забули коріння, але Росія давно забула про своїх синів. Покоління за поколінням народжувалися й росли під наглядом большевицьких дияволів, які труїли їхні думки брехнею Лєніна та поволі нищили давні традиції.\n\nНавіть тепер щойно визволені народи Далекого Сходу не вірять у наміри відновленої монархії, дивлячись крізь червоні лінзи десятиліть індоктринації. Для воскресіння справжньої Росії згода народу має вирішальне значення. Пропаганда допоможе, але вчинки швидше за будь-який плакат чи промову дістануться сердець. За допомогою цивільної адміністрації Чіти трудові програми поступово замінять військових робітників працівниками з народу, даруючи простолюду робочі місця з ласки Його Імператорської Величности. З часом народ Росії знову відкриє для себе переваги Імперії."

 CHT_a_perfectly_legitimate_claimant: "Цілком законний претендент"
 CHT_a_perfectly_legitimate_claimant_desc: "Широко розплющена паніка Міхаїла поволі поступилася тихій покорі: він усамітнився на дачі, поки пропагандисти невтомно ліплять новий образ. Можливо, Його Імператорська Величність ніколи до кінця не збагне важливости своєї ролі, та доки ми контролюємо оповідь, це не має значення. Завдяки зусиллям держави народ у кращому разі задоволений новим правителем, а в гіршому - блаженно байдужий. Тепер час зазирнути за обрій і навести мости до білого руху за кордоном.\n\nДосі більшість його представників цуралася Білої армії, вважаючи правління Міхаїла фарсом через шлюб його батьків. Колись ці скарги були б вагомими, але ситуація швидко змінюється. Сили Забайкальського уряду набирають обертів, і ці досягнення напевне помітили. Можливо, перемоги переконають інші білі організації серйозніше поставитися до наших зусиль і побачити в Чітинському уряді останню й найкращу надію на відновлення монархії. За законом Міхаїл може бути нелегітимним, та в його жилах однаково тече кров Романових, а корони здобувають не лише клаптиками паперу..."

 CHT_emphasize_shepunovs_role: "Підкреслити роль Шепунова"
 CHT_emphasize_shepunovs_role_desc: "Усім ясно, що як спадкоємець Сємьонова Боріс Шепунов є справжнім господарем Чіти.\n\nПроста й логічна думка: верховенство командувача Білої армії слід закріпити законом. Це дасть владі Шепунова правову основу й усуне будь-які перешкоди, коли він проводитиме державу крізь ці тяжкі часи.\n\nДля народу цар Міхаїл, звісно, лишиться обличчям Чіти й Забайкальського князівства, але в коридорах влади, де ухвалюють справжні рішення, цю роль виконуватиме Шепунов."
 CHT_emphasize_shepunovs_role_tt: "Окрім іншого, §YБоріс Шепунов§! стане нашим §Wголовнокомандувачем§! і членом §WВерховного командування§!."

 CHT_a_call_to_the_exiles: "Заклик до вигнанців"
 CHT_a_call_to_the_exiles_desc: "Проста математична оцінка нашого становища далі гальмує возз'єднання Росії: на Далекому Сході просто замало людей для наших потреб. Без способу виправити це наші спроби відновити лад у державі неминуче захлинуться й зупиняться.\n\nРішення просте: дивитися за межі Далекого Сходу.\n\nМи звернемося до кожного російського вигнанця у світі! Закличемо вступити до Білої армії та боротися за возз'єднання Росії! Відновити державу, якої їх так довго позбавляли!\n\nЯкщо пощастить, невдовзі ми матимемо більш ніж досить людей для військових цілей."

 CHT_to_rule_them_all: "Правити ними всіма"
 CHT_to_rule_them_all_desc: "Дуже скоро ми вийдемо за межі Чіти, й це змушує переглянути адміністрацію. Щоб справді розширити охоплення та спроможність уряду відновлювати лад на беззаконних територіях, слід закласти підвалини формальнішої й упорядкованішої системи управління.\n\nЗвісно, ніхто не пропонує зараз скасовувати військове правління. Ні, поки що воно триватиме, але ми дедалі більше передаватимемо управління місцевим цивільним губернаторам у новоздобутих землях. У довгій перспективі ця система має виявитися значно стабільнішою та ефективнішою."

 CHT_the_tentacles_of_bureaucracy: "Щупальця бюрократії"
 CHT_the_tentacles_of_bureaucracy_desc: "Бюрократія мусить розширюватися, щоб задовольняти потреби дедалі більшої бюрократії.\n\nЦе звучить як жарт, але насправді є серйозною проблемою нашого уряду. Одним із запропонованих рішень стало створення нових «імператорських компаній». Вони допомагатимуть розбудовувати й відновлювати новозавойовані території. Громадянська війна, на жаль, дуже руйнівна, і кожен завойований регіон потребуватиме значних вкладень, щоб досягти прийнятного рівня."

 CHT_exporting_the_chita_model: "Експортувати чітинську модель"
 CHT_exporting_the_chita_model_desc: "На холодних вулицях Чіти панує порядок, народ задоволений, а економіка лишається стабільною навіть у цьому віддаленому кутку Сибіру. Це безперечно зразкове місто відроджених володінь царя, і неабияка заслуга в цьому належить мерові Анатолію Собчаку. Його метод і модель принесли нам безсумнівну користь і можуть працювати деінде.\n\nПовернення Далекого Сходу вже триває, під наш контроль переходять нові населені центри, тож настав час узяти цю систему за взірець і застосувати її. Нам ще багато вчитися, закладаючи цеглини відродженої Імперії... чому б не почати звідси?"
 CHT_exporting_the_chita_model_tt: "Повторюване §Wзавдання§! §W$RUS_Mission_Smuta_CHT_ChitaModelSobchakIsACoolGuy$§! буде §Gактивовано§! й під проводом §WАнатолія Собчака§! на час Смути даватиме нашим областям §Wодин§! із §W5§! випадкових §Gбонусів§!.\n"

 CHT_enemies_in_our_midst: "Вороги поміж нас"
 CHT_enemies_in_our_midst_desc: "Після десятиліть большевицької окупації не кожен громадянин Росії лишився вірним. Землі, якими ми ступаємо, вже не такі, як колись, а комунізм, наш наймерзенніший ворог, залишив слід на населенні. Багаторічне зрадницьке промивання мізків вкоренило в людях симпатію до узурпаторів. Вони живуть поміж нас, і поки армія веде відвоювання, ми мусимо діяти.\n\nДля перевірки лояльности громадян і підтримання стабільности у повернених землях потрібна належна цивільна поліція. Вона виконуватиме те, чого, на жаль, не може військовий закон, і забезпечить значно гладший процес реінтеграції, доки ми зміцнюємо становище. Через порядок - стабільність, а через стабільність - влада царя."
 CHT_enemies_in_our_midst_tt: "Що більше в нас §Wобластей§! без §Rнаціонального осердя§!, то більше £command_power §Wкомандного ресурсу§! ми отримуватимемо. Нині §Gбонус§! має такий вигляд:\n  - Командний ресурс: [?cp_bonus|+=1]\n"

 CHT_lessons_from_the_bolsheviks: "Уроки большевиків?"
 CHT_lessons_from_the_bolsheviks_desc: "Якби не наша поразка 40 років тому, нас би тут не було. Через неї ми опинилися в нинішньому становищі, та не маємо права забувати минулі невдачі. Большевики, хоч як ми їх зневажаємо, здобули військову перемогу... і тепер перед нами постає питання.\n\nЧи скористатися уроками найбільшого ворога?\n\nБагатьом у Верховному командуванні сама думка гидка, але ми мусимо її розглянути. Учитися в комуністів зараз може здаватися безумством, однак іншого шляху повернути Імперію до Сибіру немає."
 CHT_lessons_from_the_bolsheviks_tt: "Ті §Rбольшевики§! дещо тямили в §Wуправлінні§!... Нові §Wрішення§! стануть §Gдоступні§! під час £smuta §fСмути§! завдяки §Wурокам§! із вивчення місцевих архівів §RНКВД§!.\n"

 CHT_the_atamans_dream: "Мрія отамана"
 CHT_the_atamans_dream_desc: "Наш отаман, вдивляючись за маньчжурський кордон, завжди стежив за глибинами Сибіру. Серед тужливих спогадів і гіркоти поразки в його думках жила мрія. Попри біль вигнання в Харбіні й життя поруч із фашистськими зрадниками, проти яких ми нині стоїмо, він не дозволяв її відкладати: одного дня Біла армія повстане з попелу й знову рушить через Амур.\n\nТепер, коли ми на порозі перемоги, ця мрія майже в наших руках. Та, звісно, її треба закріпити змінами. Нинішня Біла армія має доволі імпровізовану структуру, зліплену в боротьбі за повернення земель. Якби отаман був тут, він побачив би цю ваду й узявся до перебудови. Частково це зробимо ми. Над Сибіром знову майорітиме прапор Білої армії... й мрія отамана здійсниться після стількох років."
 CHT_the_atamans_dream_tt: "Що §Gбільше§! §Wобластей§! під нашим контролем, то §Gбільше§! ми §Gздобуватимемо§! £political_power_texticon §Wполітичної влади§! та £army_experience §Wдосвіду армії§!. Інакше кажучи:\n  - Політична влада: [?pp_amount|+=]\n  - Досвід армії: [?xp_amount|+=0]\n"

 CHT_the_tsars_new_groove: "Новий ритм царя"
 CHT_the_tsars_new_groove_desc: "Грім перемоги котиться спустошеними просторами Далекого Сходу! Після понад року тяжких кампаній проти большевиків і фашистів хоробрі війська Білої армії втілили велику мрію Сємьонова про відвоювання земель за Амуром. Уперше за понад пів століття білі сили мають чудову нагоду возз'єднати державу; Далекий Схід не найкраща база для війни, але це однаково величезний крок уперед від похмурого відчаю Харбіна. Та навіть коли вигнанці святкують тріюмф, ставки далі зростають. Після цього несподіваного успіху світ допитливо дивиться на Росію, а за обрієм постають більші виклики.\n\nБої поки стихли, але починається зовсім нова битва - не обов'язково кулями. Наступальні дії тимчасово припиняться, адже величезні регіони, здобуті у війнах за об'єднання, ще треба консолідувати. Міста потребують відбудови, переселенці - домівок, підривні елементи - викорінення. Навіть на найвищих щаблях влади помітний розбрат: цивільні губернатори роздратовані своєю долею, їхній вплив потерпає під нищівною вагою Білої армії.\n\nТа поки що настав давно очікуваний час веселощів. Хай живе Росія, єдина й неподільна! З нами Бог!"
 CHT_the_tsars_new_groove_tt: "§WФеєрверки§!, §Gщастя§! й §Rмогили§!.\n"

 ### Pony april fools father tree

 CHT_figure_out_a_plan: "Вигадати плян"
 CHT_figure_out_a_plan_desc: "Бухарін? Гармонія? Поні? Нам треба разом вигадати плян"

 CHT_out_with_the_rebranded_soviets: "Геть перебрендованих совєтів"
 CHT_out_with_the_rebranded_soviets_desc: "Гармонійні поні чи ні, вони досі йдуть за зрадником Бухаріним. Їм час піти"

 CHT_a_tsar_for_the_ponies: "Царя для поні"
 CHT_a_tsar_for_the_ponies_desc: "Зрештою, кожен росіянин заслуговує на царя. Навіть поні"

 CHT_the_tsars_new_groove_v2: "Новий ритм царя"
 CHT_the_tsars_new_groove_v2_desc: "Перемігши фашистів, комуністів і божевільного проповідника на півночі, ми поширили владу на весь колишній російський Далекий Схід. Практичне утвердження цієї влади триватиме, але нині час святкувати! За мовчазної згоди Міхаїла білі офіцери оголосили тиждень веселих урочистостей і створення щорічного свята на честь першого великого кроку до об'єднання всієї Росії під прапором нашої справи. Великі військові паради та стяги Святої Руси вже підготовлено й ретельно розпляновано, церемонії перемоги почалися. Сам цар був на кількох нарадах щодо святкувань, але помітно відволікався й майже не слухав. Можливо, час сісти з ним і обговорити наше спільне майбутнє."

