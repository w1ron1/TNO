 ### Character Loc ###
 # Leaders #
 CHT_Mikhail_II: "Міхаїл II"
 POLITICS_TSAR_MIKHAIL_DESC: "Князь Майкл Андрєєвіч Романов народився у вигнанні у Версалі, виріс у Шотландії, навчався в Лондоні, а Другу світову війну провів в Австралії на службі в Королівській Фльоті. Він сподівався, що перемога нацистів дасть йому змогу повернутися на батьківщину, якої він ніколи не бачив, однак створення райхскомісаріятів наприкінці війни розвіяло ці надії. Натомість князь Майкл осів в Австралії, зажив цивільним життям, працював авіяційним інженером і уникав уваги громадськости. Аж доки не отримав запрошення до Харбіна.\n\nТе, що почалося як званий обід із російськими білими емігрантами, стрімко набрало обертів, і невдовзі його підхопила кліка генералів Білої армії на чолі з отаманом Сємьоновим. Після блискавичної степової кампанії його посадили на престол у сибірському місті Чіта як царя Міхаїла II. Хоча він намагався пояснити, що шлюб його батьків був морганатичним, а отже, він не мав права на титул, генералів це мало обходило: вони й далі виставляли його як маріонетку, що надавала режимові легітимности.\n\nТепер цар затиснутий між фашистською клікою колишнього союзника, а нині ворога Константіна Родзаєвского на сході, якутськими сепаратистами на півночі, японськими державами-клієнтами на півдні та постсовєцьким диктатором на заході. Годі й казати, йому випадали й кращі карти.\n\nТа він однаково рішуче налаштований витиснути з обставин усе можливе - якщо, звісно, генерали бодай щось дозволять йому вирішувати."

 POLITICS_BORIS_SHEPUNOV_DESC: "Боріс Ніколаєвіч Шепунов є і завжди був людиною безкомпромісною.\n\nНепохитний противник большевиків відтоді, як саме це слово набуло значення, він воював разом із Ґріґорієм Сємьоновим у громадянській війні, став довічним соратником і протеже великого отамана, а після падіння Забайкалля вирушив за ним у вигнання до Харбіна.\n\nТам, шукаючи матеріяльної та політичної підтримки для білого руху, він тісно пов'язав себе з японськими інтересами й обійняв посаду в підтримуваному Японією Бюро російських емігрантів. У Бюро він організовував навчальні курси з вивчення можливостей Совєцького Союзу, сподіваючись знайти щось, що допоможе його здолати.\n\nКоли Союз розпався, а Німеччина та його японські покровителі перемогли у Другій світовій війні, Шепунов вирішив, що його шанс нарешті настав. Він помилився, але невдовзі разом із Сємьоновим і кількома колишніми учнями розробив план, як заманити до Харбіна одного з князьків Романових. Успіх змови та посадження Міхаїла II на престол як «Маріонеткового Царя» Далекого Сходу неабияк зміцнили й легітимізували білу справу, однак розпад вимушеного союзу з фашистами розбив його мрію про славний наступ і залишив його всього лиш черговим російським володарем уламкової держави.\n\nТа після об'єднання Далекого Сходу й смерти отамана він нарешті зумів піднятися до посади прем'єр-міністра. Раз і назавжди."

 CHT_Nikita_I: "Нікіта I"
 CHT_Nikita_I_hog_desc: "§YГолова уряду\nАристократичний консерватизм§!\n--------------\n§LНікіта Александровіч Романов, дядько Міхаїла II, посаджений на престол як Нікіта I, Цар всея Руси, є маріонеткою.\n\nВін це знає. Його міністри це знають. А його генерали, які міцно тримають нитки, знають це напевне.\n\nІ все ж він задоволений. Народжений у присмеркові роки старої Імперії, він добре пам'ятає, як у молодості лише дивом уникнув долі багатьох своїх родичів. Спершу осівши в Парижі, він продовжив освіту в Оксфорді, одружився, завів дітей і жив далі як міг. Але ніколи не забував про землю, яку вважав родинним спадком, і в 1920-х та 1930-х роках був дуже активним в емігрантських монархічних колах. Під час Другої світової війни він спершу зловтішався з краху Совєцького Союзу, однак після створення райхскомісаріятів та жорстокої міжусобиці російських державок переконався, що монархія в Росії померла й зникла назавжди.\n\nА тоді він отримав запрошення до Чіти. Нікіта чув, що його небожа Міхаїла кліка старих офіцерів Білої армії посадила на престол як «царя», і, сподіваючись на політичну посаду, погодився, прилетівши з родиною до морозного сибірського міста. Там він знайшов дві речі: розчарування і «друга» в особі Боріса Шепунова, наймогутнішого члена кліки після смерти старого отамана. Усе змінилося, коли Міхаїл перегнув палицю. Подробиць Нікіта не знає, але знає, що Міхаїл назавжди зник, засланий назад до Австралії, а Шепунов обрав його новим царем-маріонеткою армії.\n\nНасправді Нікіта хотів би мати владу. Але він бачив, що сталося з Міхаїлом, і якщо підписання всього, що підсувають йому Шепунов та військові, дасть змогу відновити бодай примарну владу Романових над Росією, він готовий це робити.§!"
 POLITICS_NIKITA_ROMANOV_DESC: "Нікіта Александровіч Романов, дядько Міхаїла II, посаджений на престол як Нікіта I, Цар всея Руси, є маріонеткою.\n\nВін це знає. Його міністри це знають. А його генерали, які міцно тримають нитки, знають це напевне.\n\nІ все ж він задоволений. Народжений у присмеркові роки старої Імперії, він добре пам'ятає, як у молодості лише дивом уникнув долі багатьох своїх родичів. Спершу осівши в Парижі, він продовжив освіту в Оксфорді, одружився, завів дітей і жив далі як міг. Але ніколи не забував про землю, яку вважав родинним спадком, і в 1920-х та 1930-х роках був дуже активним в емігрантських монархічних колах. Під час Другої світової війни він спершу зловтішався з краху Совєцького Союзу, однак після створення райхскомісаріятів та жорстокої міжусобиці російських державок переконався, що монархія в Росії померла й зникла назавжди.\n\nА тоді він отримав запрошення до Чіти. Нікіта чув, що його небожа Міхаїла кліка старих офіцерів Білої армії посадила на престол як «царя», і, сподіваючись на політичну посаду, погодився, прилетівши з родиною до морозного сибірського міста. Там він знайшов дві речі: розчарування і «друга» в особі Боріса Шепунова, наймогутнішого члена кліки після смерти старого отамана. Усе змінилося, коли Міхаїл перегнув палицю. Подробиць Нікіта не знає, але знає, що Міхаїл назавжди зник, засланий назад до Австралії, а Шепунов обрав його новим царем-маріонеткою армії.\n\nНасправді Нікіта хотів би мати владу. Але він бачив, що сталося з Міхаїлом, і якщо підписання всього, що підсувають йому Шепунов та військові, дасть змогу відновити бодай примарну владу Романових над Росією, він готовий це робити."

 # Ministers #
 CHT_Grigory_Semyonov: "Ґріґорій Сємьонов"
 CHT_Grigory_Semyonov_hog_desc: "§YОтаман Забайкальського козачого війська\nВійськова хунта§!\n--------------\n§LҐріґорій Міхайловіч Сємьонов, сумнозвісний Отаман Забайкальського козачого війська, майже все життя воював із силами большевизму й не бачить жодної причини зупинятися. Народжений у Забайкаллі, Сємьонов спершу викликав певну недовіру через своє змішане бурятське походження. Добре проявивши себе у Першій світовій війні, він повернувся на батьківщину формувати дивізію бурятських добровольців. Та невдовзі перед ним уже постало дуло Жовтневої революції. Сємьонов не гаяв часу й підняв свої сили на повстання проти большевицького режиму, після чого роками вів жорстоку партизанську війну проти Червоної армії на Далекому Сході. Зрештою він був змушений відступити до Харбіна - прихистку російських вигнанців, яким більше нікуди було йти.\n\nКоли Совєцький Союз нарешті розпався під тиском німецького вторгнення, Сємьонов і його білі союзники побачили свій шанс. Вони заманили Міхаїла Андрєєвіча до Харбіна, сподіваючись використати його як джерело легітимности, і рушили за Амур повертати те, що вважали своїм по праву. Тепер Сємьонов і його строкате військо козаків та бійців білого руху опинилися в ізоляції у своїй старій твердині, Чіті. Старий отаман досі сподівається одного дня завершити свій титанічний похід і відвести Росію від прірви, але похилий вік дедалі дужче дається взнаки...§!"

 CHT_Ivan_Mikhailov: "Іван Міхайлов"
 CHT_Ivan_Mikhailov_hog_desc: "§YГолова уряду\nАристократичний консерватизм§!\n--------------\n§LУлюблений багатьма й знаний іще більшою кількістю людей, Іван Адріановіч Міхайлов давно служить білій справі. Місцеве прізвисько «Сірий кардинал» влучно описує його роль у білій політиці - непублічного радника й довірену особу. Літній Міхайлов добре пам'ятає роки в Харбіні, а перед тим - свою працю міністром фінансів білого уряду під час Російської громадянської війни.\n\nТоді він не був аж надто здібним економістом, проте повернувся до політики, де почувався значно впевненіше, ставши близьким другом і довіреним слухачем царя Міхаїла II. Обох дедалі сильніше відтісняв убік Сємьонов, а невдовзі й Боріс Шепунов. Попри вік, Міхайлов вірить, що в його рукаві ще лишилося кілька останніх козирів, аби раз і назавжди поквитатися з тими, хто так погано з ним поводився.§!"
 CHT_Ivan_Mikhailov_eco_desc: "§YМіністр економіки\nАристократичний консерватизм§!\n--------------\n§LУлюблений багатьма й знаний іще більшою кількістю людей, Іван Адріановіч Міхайлов давно служить білій справі. Місцеве прізвисько «Сірий кардинал» влучно описує його роль у білій політиці - непублічного радника й довірену особу. Літній Міхайлов добре пам'ятає роки в Харбіні, а перед тим - свою працю міністром фінансів білого уряду під час Російської громадянської війни.\n\nТоді він не був аж надто здібним економістом, проте повернувся до політики, де почувався значно впевненіше, ставши близьким другом і довіреним слухачем царя Міхаїла II. Обох дедалі сильніше відтісняв убік Сємьонов, а невдовзі й Боріс Шепунов. Попри вік, Міхайлов вірить, що в його рукаві ще лишилося кілька останніх козирів, аби раз і назавжди поквитатися з тими, хто так погано з ним поводився.§!"

 CHT_Boris_Shepunov: "Боріс Шепунов"
 CHT_Boris_Shepunov_hog_desc: "§YГолова уряду\nРеакційний націоналізм§!\n--------------\n§LКолись саме ім'я Боріса Ніколаєвіча Шепунова вимовляли зі страхом і обуренням у російських емігрантських колах маньчжурського Харбіна. Тепер, коли він став новим верховним командувачем Білої армії, його слава людини жорстокої рішучости й палкого антибольшевизму вирушила за ним на північ від Амуру.\n\nКолишній солдат свавільної армії Сємьонова в Російській громадянській війні, Шепунов подався за переможеними товаришами до Харбіна й швидко відчув там себе як удома. Намагаючись відродити вплив знесиленого білого руху, він налагодив тісні зв'язки з прояпонським режимом і почав готувати місцеві сили до гіпотетичного вторгнення в Совєцький Союз. Тим часом Шепунов зібрав гурт однодумців, готових виконувати як його накази, так і накази місцевих японських служб безпеки. Його «дружинники» нишпорили вулицями Харбіна й чинили розправи над іншими емігрантськими групами, які вважали ворожими їхньому баченню відродженої Білої Росії.\n\nКоли Совєцький Союз розпався, а його старий командир Сємьонов рушив за Амур, Шепунов зі своєю зграєю був серед перших, хто пішов за ним у бій. Тепер, після смерти Сємьонова, Шепунов перебрав кермо й став справжньою владою за спиною Міхаїла Андрєєвіча. Його особиста неприязнь до царя ні для кого не є таємницею, і невідомо, як довго він терпітиме людину, яку вважає водночас нелегітимною та несумісною зі своїми цілями...§!"
 CHT_Boris_Shepunov_sec_desc: "§YМіністр безпеки\nРеакційний націоналізм§!\n--------------\n§LКолись саме ім'я Боріса Ніколаєвіча Шепунова вимовляли зі страхом і обуренням у російських емігрантських колах маньчжурського Харбіна. Тепер, як неофіційного міністра внутрішньої безпеки Сємьонова, слава людини жорстокої рішучости й палкого антибольшевизму вирушила за ним на північ від Амуру.\n\nКолишній солдат свавільної армії Сємьонова в Російській громадянській війні, Шепунов подався за переможеними товаришами до Харбіна й швидко відчув там себе як удома. Намагаючись відродити вплив знесиленого білого руху, він налагодив тісні зв'язки з прояпонським режимом і почав готувати місцеві сили до гіпотетичного вторгнення в Совєцький Союз. Тим часом Шепунов зібрав гурт однодумців, готових виконувати як його накази, так і накази місцевих японських служб безпеки. Його «дружинники» нишпорили вулицями Харбіна й чинили розправи над іншими емігрантськими групами, які вважали ворожими їхньому баченню відродженої Білої Росії.\n\nКоли Совєцький Союз розпався, а його старий командир Сємьонов рушив за Амур, Шепунов зі своєю зграєю був серед перших, хто пішов за ним у бій. Попри протести проти вибору союзників із РФП та невдоволення тим, що отаман коронував Міхаїла Андрєєвіча, а не законнішого спадкоємця, Шепунов лишається близьким союзником отамана. Він використовує досвід, здобутий у Харбіні, щоб залізна хватка Білої армії над Чітою не слабшала.§!"

 CHT_Anatoly_Sobchak: "Анатолій Собчак"
 CHT_Anatoly_Sobchak_hog_desc: "§YГолова уряду\nНаціональний лібералізм§!\n--------------\n§LДва слова досконало описують Анатолія Александровіча Собчака: молодий і прагматичний. Коли на початку четвертого десятка його призначили прем'єр-міністром відродженої Російської Імперії, за плечима Собчака вже була успішна каденція молодого мера Чіти, звідки його й забрали на нову, значно важливішу посаду.\n\nПолітична кар'єра Собчака розквітла ще в Чіті, де він здобув репутацію людини, що завжди дістає бажане - однак, на відміну від багатьох у Росії, завдяки рукостисканням, усмішкам, приязним стосункам і закулісним домовленостям. Опинившись на боці антивійськової групи Івана Міхайлова, він невдовзі отримав у винагороду посаду прем'єр-міністра. Ніхто достеменно не знає, за що насправді стоїть Собчак, але всі певні: хай там що, він знайде спосіб цього домогтися.§!"

 CHT_Alexey_Abaza: "Алексєй Абаза"
 CHT_Alexey_Abaza_eco_desc: "§YМіністр економіки\nАристократичний консерватизм§!\n--------------\n§LАлексєй Борісовіч Абаза - аномалія в білому уряді. Більшість його колег є вигнанцями, а Абаза народився й виріс у Харбіні та не має ані політичного, ані військового минулого. Насправді він волів би бути де завгодно, тільки не тут.\n\nАбаза народився 1916 року в російській родині працівників Китайсько-Східної залізниці, навчався у відомій харбінській школі з музичним ухилом і вийшов із неї талановитим піяністом. У наступні десятиліття талант привів його до виступів по всій японській сфері впливу, а згодом і до Токіо, де він хотів іще дужче розвинути музичну кар'єру. Наприкінці 1950-х, після багаторічної відсутности, він повернувся до Харбіна під час гастролей новими японськими володіннями у Східній Азії.\n\nОднак під час виступу на званому обіді білих російських емігрантів він привернув увагу господаря, отамана Ґріґорія Сємьонова, який силоміць втягнув його в божевільну авантюру з вторгненням на російський Далекий Схід. Із роками офіцери Білої армії вподобали його й почали довіряти політичні посади, пов'язані з культурними програмами. Абазі байдуже до монархічної справи, але, як і цар, якому він тепер служить, мусить давати раду цим дивним новим обставинам.§!"

 CHT_Nikolay_Kossov: "Ніколай Коссов"
 CHT_Nikolay_Kossov_sec_desc: "§YМіністр безпеки\nВійськова хунта§!\n--------------\n§LЗа плечима Ніколая Коссова десятиліття військового досвіду, а ще він вільно володіє понад п'ятьма мовами - людина багатьох талантів. Переїхавши з родиною до Харбіна 1918 року, Коссов опинився у вигнанні задовго до того, як пекло громадянської війни могло його зачепити. Відтоді його кар'єра була напрочуд строкатою: спершу офіцер армії Фентянської кліки, потім начальник військових перевезень округи в новоствореній державі Маньчжоу-ґо, згодом керівник російської контррозвідки 4-ї армії Маньчжоу-ґо і, нарешті, член її генерального штабу.\n\nКоли Совєцький Союз розпався, Коссов відповідав за підготовку російських емігрантів-новобранців у Харбіні. План отамана Сємьонова вторгнутися на російський Далекий Схід разом із РФП не пройшов повз його увагу, і, маючи в розпорядженні вишколене військо емігрантів, він вирішив запропонувати підтримку. У наступних кампаніях Коссов став довіреною постаттю в новоствореній Білій армії, застосовуючи численні таланти як у військових справах, так і у внутрішній безпеці.\n\nКоли Боріс Шепунов перебрав владу, Коссов був очевидним кандидатом на його колишнє місце головного фахівця Білої армії з безпеки. Прихильність до японців і глибокі зв'язки з Маньчжоу-ґо змушують декого йому не довіряти, та він однаково є незамінною деталлю машини Білої армії.§!"

 CHT_Dmitry_Volkogonov: "Дмітрій Волкоґонов"
 CHT_Dmitry_Volkogonov_sec_desc: "§YМіністр безпеки\nВійськова хунта§!\n--------------\n§LДмітрій Антоновіч Волкоґонов уособлює радикально новий напрям для Білої армії. Порівняно з більшістю колег він доволі молодий і зовсім інакше дивиться як на стратегію Білої армії, так і на управління самою Імперією. Після провалу превентивного перевороту Шепунова проти царя Волкоґонова підвищили на місце опального генерала - голови Білої армії, і новий командувач уже наполегливо втілює свої ідеї.\n\nКолись Волкоґонов був молодшим офіцером гарнізону Червоної армії в Чіті й потай дедалі більше тривожився через безчинства режиму Генріха Ягоди. Коли місто зрештою захлинулося під навалою Сємьонова, Біла армія гостро потребувала нових офіцерів для масштабного розширення сил окупантів. Волкоґонов був одним із небагатьох, хто відгукнувся, а його вчинки в наступні роки принесли блискавичне зростання по службі та дедалі сильніші суперечки зі старшими колегами. Маючи обмежений досвід служби в Червоній армії, молодий генерал вважав тактику білих застарілою і дедалі більше втомлювався від їхнього всеосяжного контролю над державним апаратом.\n\nСтавши на бік царя Міхаїла, Волкоґонов страшенно ризикнув - і, на щастя для нього, ризик щедро виправдався. Як новий командувач Білої армії, він може вільно просувати модернізацію та деполітизацію війська. Однак його погляди сягають далі за армію: Волкоґонов також виступає за широкі ліберальні реформи в Імперії, зокрема за запровадження дієвої Конституції.§!"

 CHT_Nikolay_Ukhtomsky: "Ніколай Ухтомскій"
 CHT_Nikolay_Ukhtomsky_for_desc: "§YМіністр закордонних справ\nАристократичний консерватизм§!\n--------------\n§LНіколай народився 1895 року в князівській дворянській родині поблизу Сімбірска. Його батько, Александр Ухтомскій, очолював усе сімбірске дворянство. Ніколай Александровіч вступив до Петроградського університету, однак не закінчив його через початок війни з Німеччиною й натомість пішов до Ніколаєвського кавалерійського училища. Випустившись 1917 року, він воював у складі 5-го уланського полку до 1918-го, коли приєднався до білих у Російській громадянській війні.\n\nСпочатку служив особистим ад'ютантом полковника Степанова, командувача білих сил у Казані, а потім брав участь у боях на Уралі до кінця 1919 року. До 1920-го доля війни остаточно відвернулася від білих, і Ухтомскій утік із Красноярска до Харбіна, а 1922 року виїхав до Німеччини.\n\nСім років потому, 1929-го, він повернувся до Харбіна й зайнявся журналістикою, люто виступаючи проти большевиків і комунізму та закликаючи до відновлення білого руху. Ця діяльність, а також аристократичне походження й монархічні погляди зблизили його із Сємьоновим, і коли той залишив Харбін, щоб нарешті почати реставрацію царської влади, Ухтомскій вирушив із ним допомагати в цій справі.§!"

 # Generals #
 GENERAL_GRIGORY_SEMYONOV_DESC: "§LҐріґорій Міхайловіч Сємьонов, сумнозвісний Отаман Забайкальського козачого війська, майже все життя воював із силами большевизму й не бачить жодної причини зупинятися. Народжений у Забайкаллі, Сємьонов спершу викликав певну недовіру через своє змішане бурятське походження. Добре проявивши себе у Першій світовій війні, він повернувся на батьківщину формувати дивізію бурятських добровольців. Та невдовзі перед ним уже постало дуло Жовтневої революції. Сємьонов не гаяв часу й підняв свої сили на повстання проти большевицького режиму, після чого роками вів жорстоку партизанську війну проти Червоної армії на Далекому Сході.\n\nЗрештою його сили витіснили за маньчжурський кордон, і Сємьонов переніс діяльність до Харбіна. Там він познайомився з безліччю інших білих вигнанців, зокрема Россійской Фашистской Партієй Константіна Родзаєвского та прояпонською «Бригадою Асано». Коли Совєцький Союз нарешті розпався під тиском німецького вторгнення, Сємьонов і його білі союзники побачили свій шанс. Вони заманили Міхаїла Андрєєвіча до Харбіна, сподіваючись використати його як джерело легітимности, і рушили за Амур повертати те, що вважали своїм по праву.\n\nВикроївши власні володіння з трупа імперії Генріха Ягоди, що розвалювалася, білі фракції розійшлися через ідеологічні суперечності. Тепер Сємьонов і його строкате військо козаків та бійців білого руху опинилися в ізоляції у своїй старій твердині, Чіті. Старий отаман досі сподівається одного дня завершити свій титанічний похід і відвести Росію від прірви, але похилий вік дедалі дужче дається взнаки...§!"

 CHT_Leonid_Mustafin: "Леонід Мустафін"
 GENERAL_LEONID_MUSTAFIN_DESC: "§LЛеонід Ніколаєвіч народився 1914 року поблизу Чіти у великій родині Мустафіних, яка 1922 року втекла до Маньчжурії. Через відносну бідність сім'ї він не зміг здобути звичайної освіти, виріс у Чанчуні й почав працювати змалку. Вступивши до РОВС 1933 року, Леонід став агентом зовнішнього спостереження прикордонної поліції, згодом бойовим інструктором і, нарешті, діловодом у БРЕМ.\n\n1938 року він вступив до армії Маньчжоу-ґо, швидко став фельдфебелем підрозділу зв'язку, а 1943-го закінчив курси офіцерів. Того ж року після вишколу з козаками його призначили командиром взводу, потім ад'ютантом, 1944 року підвищили до лейтенанта й дали посаду штабного діловода. Останнім його званням в армії Маньчжоу-ґо став майор, а за час служби він отримав кілька нагород від командування.\n\nЙого вважають мудрішим за старшого брата. Він не так відданий Шепунову, як Віссаріон, хоча поважає його й служив силовиком у його службі безпеки ще в Харбіні. Коли Шепунов пішов за Сємьоновим повертати Росію та відновлювати царську владу, Леонід сумлінно вирушив слідом.§!"

 CHT_Vissarion_Mustafin: "Віссаріон Мустафін"
 GENERAL_VISSARION_MUSTAFIN_DESC: "§LВіссаріон Ніколаєвіч народився 1910 року поблизу Іркутска у великій родині Мустафіних, яка 1922 року втекла до Маньчжурії. Через відносну бідність сім'ї він не зміг здобути звичайної освіти, виріс у Чанчуні й почав працювати підлітком: спершу на збройовому заводі в Мукдені, потім на заправці, а далі прикордонним поліцаєм, доки нарешті не влаштувався до БРЕМ.\n\nЗдобувши певну освіту, він вступив до армії Маньчжоу-ґо й став фельдфебелем, а після закінчення офіцерських курсів зрештою дослужився до майора й отримав кілька нагород від уряду Маньчжоу-ґо.\n\nПротеже Шепунова з початку 1930-х, він одним із перших вступив до його служби безпеки й став грізним головним силовиком. Через це багато хто вважає Віссаріона тупим і жорстоким, особливо порівняно з молодшим братом. Коли Шепунов вирішив піти за Сємьоновим назад до Росії, Віссаріон, як завжди, не відставав від нього й відтоді служить йому в Чіті.§!"

 GENERAL_NIKOLAY_KOSSOV_DESC: "§LНіколай Борісовіч Коссов народився 1908 року в Києві й зробив надзвичайно успішну військову кар'єру. 1918 року, у розпал Російської громадянської війни, він переїхав із родиною до Маньчжурії. Вирісши в Харбіні, служив у війську старої Фентянської кліки й став офіцером іще до повалення Чжан Сюеляна японцями.\n\nПісля створення Маньчжоу-ґо його кар'єра лише пішла вгору: спочатку він очолив військові перевезення в одному з округів, потім російський контррозвідувальний підрозділ 4-ї армії Маньчжоу-ґо, а згодом допоміг провести кавалерійську дивізію крізь бої на Халхин-Голі, після чого ввійшов до генерального штабу. Ставши старшим офіцером штабу 4-го військового округу, він отримав звання підполковника.\n\nПід час Другої світової війни Коссов також став головним військовим інструктором російських емігрантів у Харбіні, а 1945 року отримав останнє підвищення в армії Маньчжоу-ґо - до полковника. Коли Сємьонов нарешті вирушив повертати Росію, Коссов був серед багатьох, хто пішов за ним. За роки в Харбіні він опанував, окрім російської, кілька мов: англійську, німецьку, китайську та японську.\n\nВін відомий загальною прихильністю до японських інтересів і має багато корисних зв'язків у Маньчжурії, хоча через це дехто йому не довіряє.§!"

 GENERAL_DMITRY_VOLKOGONOV_DESC: "§LДмітрій Антоновіч Волкоґонов - доволі молодий генерал Білої армії. Уродженець самої Чіти, він давно стоїть осібно в її офіцерському корпусі: як очільник «ліберальніших» офіцерів, на відміну від таких непримиренних діячів, як Шепунов, Волкоґонов останніми роками розбудовував у Чіті неформальну низову організацію молодших офіцерів задля лібералізації Імперії.\n\nЕнергійний і палкий у прагненні покласти край фактичній стратократії, яку Сємьонов та його наступники нав'язали монархії у вигнанні, Волкоґонов уже давно затаїв тиху, кипучу образу на Шепунова та його посіпак. Хай куди поверне Імперія, на Волкоґонова чекає цікава кар'єра.§!"

