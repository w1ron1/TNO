 CHT_ilya_muromets: "Проєкт «Ілля Муромець»"
 CHT_ilya_muromets_desc: "Проєкт «Ілля Муромець» - наша новітня спроба збудувати сучасні російські повітряні сили. Захопивши Новосибірск, ми знайшли безліч військових реактивних літаків, особливо бомбардувальників. Вивчення цих машин доповнить нашу вже розвинену авіяційну промисловість і поліпшить власні реактивні бомбардувальники."
 CHT_restoration_program_modifier: "Програма відновлення Імперської держави"
 CHT_restoration_program_modifier_desc: "Програма відновлення Імперської держави - промисловий плян освоєння величезних земель північно-східного Сибіру, де, як вважається, лежать велетенські незаймані запаси нафти й корисних копалин."

 CHT_chessboard_category: "Король і його шахівниця"
 CHT_chessboard_category_desc: "\n\n\n\n\n\n§MПорт Маґадана§! та §fмісто Блаґовєщенск§! - наші вікна у світ. Вони дадуть наздогнати західних суперників і раз і назавжди відновити царську владу над Росією. Через них ми експортуватимемо приховані під Сибіром багатства й відбудуємо економіку. Та шлях до цього розділяє уряд.\n\n§dЦар Міхаїл II§! обстоює плян розвитку, зосереджений на відновленні стратеґічної інфраструктури й чесних двосторонніх торговельних угодах з §MОФН§!, §SСВД§! та різними невтральними сторонами. §sБоріс Шепунов§! і його §sБіла армія§! натомість прагнуть аґресивно розширити зв'язки із §SСВД§!, віддаючи ще більше ресурсів та укладаючи дуже вигідні для японців угоди в обмін на ширший доступ до їхніх ринків і технічну підтримку. Обидва пляни мають переваги й вади, але зрештою ми можемо обрати лише один дороговказ для економіки держави."
