 CHT_unlock_loyalist_decisions: "§MВідкрити рішення лоялістів§!"
 CHT_disable_loyalist_decisions: "§MВимкнути рішення лоялістів§!"
 CHT_pro_civilian_decision_1: "§MЗалучити лоялістів до будівництва фабрик§!"
 CHT_pro_civilian_decision_1_desc: "Тепер, коли регіон убезпечено, час скористатися нашими ресурсами, щоб розвинути здобуте - а який ресурс для цього кращий за наших вірних прибічників? Спрямувавши цих цивільних на інвестиції та будівництво фабрик у містах нашої держави, ми безпосередньо збільшимо кількість готових до роботи підприємств у розпорядженні адміністрації."
 CHT_pro_civilian_decision_2: "§MЗалучити лоялістів до будівництва інфраструктури§!"
 CHT_pro_civilian_decision_2_desc: "Тепер, коли регіон убезпечено, час скористатися нашими ресурсами, щоб розвинути здобуте - а який ресурс для цього кращий за наших вірних прибічників? Заохотивши лоялістів започаткувати будівельні програми й розбудовувати інфраструктуру по всьому Далекому Сходу, ми підвищимо промислову ефективність, краще сполучимо віддалені поселення та забезпечимо війську змогу вчасно діставатися куди треба."
 CHT_pro_civilian_decision_3: "§MЗалучити лоялістів до будівництва флоту§!"
 CHT_pro_civilian_decision_3_desc: "Тепер, коли регіон убезпечено, час скористатися нашими ресурсами, щоб розвинути здобуте - а який ресурс для цього кращий за наших вірних прибічників? Щоб створити сильний і дієздатний Імперський флот для цивільних та військових потреб, ми можемо залучити лоялістів, серед яких чимало технічних фахівців, до розбудови нової й додаткової морської інфраструктури."
 CHT_pro_civilian_decision_4: "§MЗалучити лоялістів до видобутку ресурсів§!"
 CHT_pro_civilian_decision_4_desc: "Тепер, коли регіон убезпечено, час скористатися нашими ресурсами, щоб розвинути здобуте - а який ресурс для цього кращий за наших вірних прибічників? Узявши їх на платню та надавши підряди на розширення видобутку, ми забезпечимо постійне зростання надходжень життєво важливих ресурсів, потрібних нашій цивільній і військовій інфраструктурі."
 CHT_pro_civilian_decision_5: "§MЗалучити лоялістів до розчищення земель§!"
 CHT_pro_civilian_decision_5_desc: "Тепер, коли регіон убезпечено, час скористатися нашими ресурсами, щоб розвинути здобуте - а який ресурс для цього кращий за наших вірних прибічників? Зосередившись на цивільних інвестиціях і компаніях, ми поставимо потрібних людей у потрібні місця й забезпечимо, щоб орієнтований на цивільних проєкт розчищення земель приніс велику користь у вигляді ефективного сільського господарства та нових площ для будівництва."
 CHT_pro_civilian_decision_6: "§MЗалучити лоялістів до будівництва укріплень§!"
 CHT_pro_civilian_decision_6_desc: "Тепер, коли регіон убезпечено, час скористатися нашими ресурсами, щоб розвинути здобуте - а який ресурс для цього кращий за наших вірних прибічників? Найнявши відданих цивільних підрядників для спорудження системи фортів по всій країні та вздовж кордонів, ми матимемо готові до використання міцні укріплення й водночас посилимо цивільний вплив в уряді."

