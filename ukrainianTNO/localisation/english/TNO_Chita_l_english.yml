 CHT_superregional.31.t: "Один із тих днів"
 CHT_superregional.31.desc: "Стиснувши зуби, Артьом від люті вдарив кулаком по керму вантажівки. Уже пів години стирчав у заторі за іншою клятою вантажівкою. Усі доставки зроблено, він просто хотів додому! Годі - зараз він висловить водієві все, що думає.\n\nТа щойно Артьом висунув голову з вікна, то зрозумів, чому машина попереду так повзе й чому сваритися з водієм було б не найрозумніше. На борту стояла емблема Білої армії, а всією вулицею й далі тяглася колона таких самих вантажівок. Конвой постачання або солдати на передислокацію. Так чи інакше, нічого не вдієш.\n\nАртьом безсило впав у крісло. Він і сам відслужив, робив це непогано, дістав звільнення й тепер хотів звичайного життя. Скільки ще часу армія в нього забере?"
 CHT_superregional.31.a: "Часом війна бере данину несподіваними способами."

