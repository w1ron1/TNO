 ### Ideas ###
 CHT_uneasy_figurhead: "Неспокійна маріонетка"
 CHT_uneasy_figurhead_desc: "Слава царю Міхаїлу II, Імператору й Самодержцю всея Руси Божою Милістю! У Чіті лунають численні славослів'я Маріонетковому Царю, та дійсність зовсім інша. Фактично викрадений і змушений посісти престол серед чварливих клік старіючих офіцерів Білої армії, Міхаїл понад усе бажає знову побачити свій дім, далеко від Росії."
 CHT_sunset_of_white_chivalry: "Занепад білого лицарства"
 CHT_sunset_of_white_chivalry_desc: "Значна частина військового керівництва держави складається зі старіючих генералів Білої армії, яких минула слава обходить більше за теперішні проблеми. Багатьом із них лишилося недовго, а неліберальна природа уряду ускладнює залучення молодших і винахідливіших наступників."
 CHT_white_army_leadership: "Верховенство Білої армії"
 CHT_white_army_leadership_desc: "Конфлікт за владу розв'язано; цар зможе перейняти кермо, коли ми нарешті повернемо Батьківщину. Доти керівництво належатиме армії, яка без царського втручання присвятить усі сили вже згаданому відновленню."
 CHT_tsarist_leadership: "Царське верховенство"
 CHT_tsarist_leadership_desc: "Наш конфлікт за владу нарешті завершився: генералів армії повернули на належне їм місце слуг і радників Імператора й Самодержця всея Руси. Віднині особисті інтереси армійського керівництва не заважатимуть реставрації; нарешті ми об'єднані в особі царя."
 CHT_manchurian_aid: "Маньчжурська промислова допомога"
 CHT_manchurian_aid_desc: "Наші японські та маньчжурські доброчинці на півдні досі щедро допомагали нам досягати цілей матеріяльними засобами й натякнули, що в майбутньому можуть розширити підтримку. Якщо ми переконаємо їх дотримати слова, це стане великим благом, хоча тісніші зв'язки з Японією майже напевне породять і більші сподівання на якусь винагороду..."
 CHT_imperial_prospector_corps: "Імператорський корпус старателів"
 CHT_imperial_prospector_corps_desc: "Сибір - жорстока господиня. Густі морозні ліси й нескінченні милі розлогої, незвіданої землі. Не кажучи вже про ще пекельніший клімат на півночі. Та водночас Сибір сповнений нерозроблених руд. Тож Імператорський корпус старателів кидає виклик цим умовам у пошуках корисних копалин, прокладає шляхи крізь східні землі й приборкує цю дику звірину."
 CHT_imperial_development_company: "Імператорська компанія розвитку"
 CHT_imperial_development_company_desc: "Імператорська компанія розвитку - державна корпорація, відповідальна за розчищення земель у суворій сибірській глушині, а також розвиток інфраструктури й громадських робіт по всій майбутній Імперії. Завдяки щедрим «інвестиціям» із кишені нашого царя ІКР не гаяла часу й узялася перетворювати пустку на щось придатніше."
 CHT_specialist_training_idea: "Підготовка фахівців"
 CHT_specialist_training_idea_desc: "Наголос на підготовці військових фахівців уже дає помітний ефект: звичайні солдати успішно діють у ситуаціях, до яких звичайні навчання не могли їх підготувати. Такі індивідуальні вкладення в кожного бійця неможливо підтримувати довго, але наразі солдати держави окремо належать до найкращих у всій Росії."
 CHT_far_easts_finest: "Найкращі на Далекому Сході"
 CHT_far_easts_finest_desc: "Невпинна увага до військового розвитку назавжди перетворила армію держави на найкраще військо Сибіру, якщо не всієї Росії. Інші країни дивляться на наших солдатів із заздрістю й неабияким страхом, жахаючись перспективи зустрітися в бою з найкращими на Далекому Сході."
 CHT_atamans_legacy: "Спадщина отамана"
 CHT_atamans_legacy_desc: "Отаман Сємьонов був багатьма людьми. Організатором. Політиком. Візіонером. Та передусім - генералом, вічно зосередженим на перемогах білого руху на полі бою. Самого отамана вже немає, але його мілітаристська спадщина державі живе. Солдати! Зважайте, адже отаман дивиться на вас із висоти!"
 CHT_northern_war: "Північна війна"
 CHT_northern_war_desc: "Ця війна проти божевільного проповідника з Омолона не схожа на жодну, з якою наша держава стикалася раніше. Селянські повстання, фанатичні священники й погрози прокляттям підточують сили частин на полі бою. Та їх відкинуть в ім'я царя, а держава встановить владу над безкраїм сибірським нутром, аби таке повстання більше ніколи не повторилося. Ура!"
 CHT_civilian_bias_modifier: "Бюджет на користь цивільних"
 CHT_civilian_bias_modifier_desc: "У бюджетних дебатах перемогла думка нашого царя, і рішення ухвалено. Військові сили зазнають помірного скорочення бюджету, а кошти буде спрямовано до нових цивільних галузей.\n\nЦі нові фонди мають допомогти економіці розвиватися, зростати й ставати незалежнішою від військового комплексу. Теоретично це підвищить рівень життя населення."
 CHT_military_bias_modifier: "Бюджет на користь військових"
 CHT_military_bias_modifier_desc: "Думку нашого царя відкинули як непрактичну, й уряд ухвалив рішення. Кошти, спрямовані до цивільної промисловости, буде скорочено й передано військовим.\n\nЦивільна промисловість, може, й допомагає людям, але ми ведемо війну за Батьківщину. Ми не можемо дозволити собі послабити таку життєво важливу частину держави."
 CHT_imperial_development_company_regional: "Імператорська компанія розвитку"
 CHT_imperial_development_company_regional_desc: "Імператорська компанія розвитку цілковито зосереджена на вдосконаленні промислової бази Далекого Сходу й діє як величезне субсидоване державою підприємство, приносячи інфраструктуру та промислове розширення до раніше неосвоєних і недорозвинених районів держави."
 CHT_imperial_governing_committee_civilian: "Імператорський керівний комітет"
 CHT_imperial_governing_committee_civilian_desc: "Росія безкрая, а наші володіння в ній дедалі більшають із кожною новою провінцією. Імператорський керівний комітет є ключовим знаряддям управління провінціями нашої зростаючої Імперії. Укомплектований переважно цивільними керівниками, він безперечно служить народові Росії."
 CHT_imperial_governing_committee_military: "Імператорський керівний комітет"
 CHT_imperial_governing_committee_military_desc: "Імператорський керівний комітет, політична структура для нагляду за величезними й майже автономними територіями держави, опинився під владою військових інтересів. Тому він сприяє розширенню військової інфраструктури у своїй юрисдикції. Тобто майже всюди."
 CHT_land_grants_civilian: "Імператорські земельні наділи"
 CHT_land_grants_civilian_desc: "Імператорський керівний комітет нарешті вирішив, що робити з усіма провінціями без керівництва, і призначив до їхніх урядів здібних очільників. Задля чесности перед народом цих політиків обрали з цивільної адміністрації."
 CHT_land_grants_military: "Імператорські земельні наділи"
 CHT_land_grants_military_desc: "Держава вирішила передати значні земельні ділянки у виняткове користування військових. Це дасть змогу створити централізовану систему постачання та набору."
 CHT_japanese_efficiency: "Японська ефективність"
 CHT_japanese_efficiency_desc: "Японські фахівці всебічно вивчили й оптимізували промислову базу держави. Засвоївши їхні уроки, національна промисловість досягла рівня ефективности й виробництва, про який раніше могла лише мріяти."
 CHT_zaibatsu_dominated_economy: "Економіка під владою дзайбацу"
 CHT_zaibatsu_dominated_economy_desc: "Японські дзайбацу, яких спершу допустили до економіки держави заради модернізації та розвитку, змогли посісти настільки панівне становище, що фактично контролюють усе господарство. Це має переваги, але водночас змушує державу бути вкрай обережною з усім, що може зашкодити відносинам із Японією."
 CHT_imperial_corporations_idea: "Імператорські корпорації"
 CHT_imperial_corporations_idea_desc: "Наслідуючи велетенські японські дзайбацу, держава підтримала створення Імператорських корпорацій. Особливий регуляторний статус дав їм змогу пришвидшити розвиток і будівництво, і є надія, що одного дня вони досягнуть такого самого становища та економічної могутности, як японські конгломерати."
 CHT_imperial_corporations_idea2: "Імператорські корпорації"
 CHT_imperial_corporations_idea2_desc: "Наслідуючи велетенські японські дзайбацу, держава підтримала створення Імператорських корпорацій. Особливий регуляторний статус дав їм змогу пришвидшити розвиток і будівництво, і є надія, що одного дня вони досягнуть такого самого становища та економічної могутности, як японські конгломерати."
 CHT_new_white_army: "Нова Біла армія"
 CHT_new_white_army_desc: "Після років зусиль і реформ держава нарешті зуміла вдихнути нове життя в білий рух. Під проводом винахідливих молодих офіцерів, укомплектоване дисциплінованими професійними солдатами, військо готове до всього, що може зустріти в довгому поході на захід."
 CHT_new_white_army_2: "Нова Біла армія"
 CHT_new_white_army_2_desc: "Після років зусиль і реформ держава нарешті зуміла вдихнути нове життя в білий рух. Під проводом винахідливих молодих офіцерів, укомплектоване дисциплінованими професійними солдатами, військо готове до всього, що може зустріти в довгому поході на захід."

