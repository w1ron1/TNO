 #Regional Political Tree
 CHT_the_start_of_something_special: "Початок чогось особливого"
 CHT_the_start_of_something_special_desc: "Покінчивши з комуністами, фашистами й божевільними сектантами, ми здобули непевний контроль над Далеким Сходом. Та без рішучих і цілеспрямованих дій немає гарантії, що ми його втримуємо.\n\nЦе початок чогось особливого - того, над чим ми працювали дуже довго. Але відпочивати не можна. Попереду багато справ: створити адміністрацію у віддалених краях, знищити внутрішній опір і владнати дедалі гострішу напругу між фракціями в уряді та війську."

 CHT_our_hard_earned_land: "Наша тяжко здобута земля"
 CHT_our_hard_earned_land_desc: "Безмежні тайга, тундра й болота Далекого Сходу: приємні для походів, жахливі для управління. Величезними просторами, за які ми тепер відповідаємо, неймовірно важко керувати, якщо говорити лагідно. Та це не мусить нас зупиняти: якщо змогли большевики, зможемо й ми.\n\nЧлени руху з економічним хистом, які прийшли з Харбіна, запропонували вичерпний плян. Ми поділимо землі на численні провінції з доволі широкою автономією та місцевими ополченнями, зрештою підлеглими центральному урядові. Це дасть змогу управляти, видобувати ресурси й перемогти нечисленних ідеологічних фанатиків, які досі не здалися."

 CHT_the_imperial_governing_committee: "Імператорський керівний комітет"
 CHT_the_imperial_governing_committee_desc: "Ті самі люди, що запропонували поділити землі на автономні провінції, висунули ідею так званого «Імператорського керівного комітету». Він здійснюватиме найвищий нагляд за провінціями й зніме з уряду тягар окремих рішень. ІКК відповідатиме безпосередньо перед нами, але істотно розвантажить і без того перевантажених міністрів.\n\nІКК, як то кажуть, - очевидне рішення. Однак точаться суперечки про його втілення. Це призвело до дедалі тривожнішого розколу між військовими непримиренцями, які прагнуть контролювати комітет, і тихішими промисловцями, що хочуть звільнити ІКК від військового впливу."

 CHT_extend_land_grants: "Розширити земельні наділи"
 CHT_extend_land_grants_desc: "Тепер, коли провінції поділено, а Імператорський керівний комітет засновано, лишається вирішити, хто керуватиме провінціями та їхніми районами. Шепунов, природно, припустив, що всі губернатори будуть вірними військовими офіцерами, яких він знає роками.\n\nТа несподіваний голос Івана Міхайлова пропонує інший варіянт: створити посади так званих «царських губернаторів» - цивільних осіб, призначених на ці місця.\n\nХай яким буде рішення, ми маємо остаточно визначити й закріпити законом обов'язки та обмеження нових губернаторів, а тоді офіційно надати земельні наділи обраним людям."

 CHT_finalize_the_new_system: "Завершити нову систему"
 CHT_finalize_the_new_system_desc: "Нова система далека від досконалости, та губернатори вже вирушають до своїх територій створювати формальну адміністрацію замість простої військової окупації, а уряд у Чіті з оптимізмом дивиться на майбутнє Далекого Сходу під своєю владою.\n\nОднак стабілізація й управління новими землями не завершені. Тепер можна розглянути невирішені примітки з минулих обговорень: характер оподаткування, розміщення військових у постоях чи казармах та, здається, десятки інших дрібниць. Шепунов уже скликав раду, щоб владнати всі малі питання й остаточно завершити нову систему.\n\nС Намі Бог!"

 CHT_oppositional_remnants: "Залишки опозиції"
 CHT_oppositional_remnants_desc: "Імператорська армія добре розбила ворогів у полі, але після перемог найбільш затяті повстанці, на наше роздратування, не склали зброї.\n\nКомуністи підривають фабрики й автомобілі в Іркутску, селяни блукають далекою північчю й стріляють у кожного царського солдата, якого спіймають, а фашистські осередки в Блаґовєщенску та околицях лінчують наших адміністраторів, лишаючи тіла в парках і біля їхніх домівок.\n\nЦе неприпустимо. Слід посилити патрулі, а «незгодних» - розстрілювати чи відправляти до трудових таборів. Досить судів, досить поблажливости: вони не виявили б до нас такого милосердя."

 CHT_the_cultists_the_fascists_the_reds: "Сектанти, фашисти, червоні"
 CHT_the_cultists_the_fascists_the_reds_desc: "Три групи досі становлять смертельну загрозу державі: комуністи, сектанти й фашисти.\n\nКожна небезпечна по-своєму, але всі три ведуть тривале повстання малої інтенсивности після наших завоювань. Та ми не мусимо бездіяльно дивитися, як терористи й незгодні далі заливають вулиці кров'ю та вбивають наших прибічників.\n\nМи битимемося з ними на вулицях, виманюватимемо партизанів і тероризуватимемо терористів. Не можна показувати слабкість - на їхній терор ми відповімо таким самим терором."

 CHT_imperial_department_of_order_and_security: "Імператорський департамент порядку та безпеки"
 CHT_imperial_department_of_order_and_security_desc: "Самого війська для підтримання порядку замало. Якби воно далі займалося лише цим, у нас не лишилося б військ для походу на захід, коли настане час! Чимало людей у Верховному командуванні так само роздратовані тривалими повстаннями після польових перемог, як і наші вірні цивільні.\n\nТа рішення вже видно. Група молодших офіцерів запропонувала організацію «внутрішнього замирення», яку верхівка підхопила й перебудувала фактично на таємну поліцію.\n\nЦя організація, Імператорський департамент порядку та безпеки, або ІДПБ, нестиме головну відповідальність за боротьбу з повстаннями та їхніми наслідками. Набираючи найменш ідеологічно зіпсованих працівників комуністичних і фашистських таємних поліцій, Верховне командування сподівається, що ІДПБ ефективно протидіятиме заколотникам."

 CHT_were_here_to_stay: "Ми тут надовго"
 CHT_were_here_to_stay_desc: "Ще одна коротка пауза в розширенні адміністрації дає нагоду оцінити поступ останніх місяців. Від влади, чиї землі втримувала лише сила війська, ми перейшли до молодої дієздатної держави з провінціями, де замирення вже триває, а адміністрації надсилають звіти.\n\nЯкийсь час усе висіло на волосині, та полум'я повстання згасає, адміністрація зміцніла, й тепер ми справді можемо сказати: ми тут надовго."

 CHT_tighten_control: "Посилити контроль"
 CHT_tighten_control_desc: "Боріс Шепунов, який тримає кермо влади в Чіті після смерти отамана Сємьонова, вирішив, що настав час посилити контроль над урядом і особливо над царем.\n\nВід самого початку цар Міхаїл був маріонеткою. Та Шепунов знає: якщо його не стримувати, він один із небагатьох, хто здатен згуртувати внутрішній опір.\n\nТому Шепунов запропонував новий, ще суворіший розклад для царя. Відтепер Міхаїл бачитиме лише тих, кого дозволить Шепунов."

 CHT_the_hidden_tsar: "Прихований цар"
 CHT_the_hidden_tsar_desc: "Останнім часом царя Міхаїла прозвали «Прихованим царем», бо його майже ніколи не бачать на людях. Це глузливе прізвисько вигадали молодші офіцери, але Шепунов та його фракція цинічно його прийняли й далі шукають способів ховати «Прихованого царя».\n\nЗустрічі вічно переноситимуть, публічні промови скасовуватимуть, а почет царя й надалі складатиметься з агентів Шепунова.\n\nУсе заради справжніх потреб царя та держави, звісно."

 CHT_confirm_shepunov: "Затвердити Шепунова"
 CHT_confirm_shepunov_desc: "Досі Боріс Шепунов формально був лише виконувачем обов'язків прем'єр-міністра. За законом це означає, що невдовзі він мусить передати посаду й тісний контроль над царськими справами цивільному. Та єдиним логічним цивільним кандидатом є непокірний Іван Міхайлов, і Шепунов не хоче відпускати кермо влади.\n\nЗміцнюючи опору, Шепунов домігся постійного призначення й закріпив привілейоване становище військових у політиці. Уже ходять чутки, що він почав тихі чистки, аби це становище лишалося непорушним."

 CHT_the_military_political_system: "Військово-політична система"
 CHT_the_military_political_system_desc: "Закріпившись на посаді прем'єр-міністра, Шепунов спрямував уряд на амбітну програму, відому лише як «Військово-політична система». Вона має знести межі між цивільною адміністрацією та військовою єрархією й фактично поставити Шепунова на чолі обох.\n\nДеякі правознавці Чіти скаржаться, що це відвертий поворот до стратократії. Та вони просто не розуміють: система лише забезпечує, щоб найбільш довірені прем'єр-міністрові люди обіймали посади, на яких найкраще йому допоможуть. Зрештою, військо заслужило належне за відродження білого руху."

 CHT_faith_in_mikhail: "Віра в Міхаїла"
 CHT_faith_in_mikhail_desc: "Наш цар довго був пригніченим і зневіреним, виконував обов'язки лише через приховані погрози та брак вибору. Його майже незрозумілі промови давно були болючим питанням у стосунках царя та військових.\n\nТа Міхаїл несподівано виявив певний інтерес до обов'язків. Із новою енергією він вивчає російську й долучається до справ усіма способами. Схоже, наші молитви почуто!\n\nДехто боїться, що це зробить Міхаїла незалежнішим, однак зрештою керують досі військові."

 CHT_public_visits_private_audiences: "Публічні візити, приватні авдієнції"
 CHT_public_visits_private_audiences_desc: "З новим інтересом до державних справ цар покірно й офіційно попросив Боріса Шепунова дозволити приймати гостей у своїх покоях і з'являтися на публіці в різних місцях майбутньої Імперії, щоб його пізнали і народ, і еліта.\n\nПісля довгих роздумів і вагань, а також неабияких переконувань Івана Міхайлова, Шепунов погодився задовольнити прохання монарха. Першу авдієнцію отримав сам Міхайлов, що посилило неохоту Шепунова, хоча намір Міхаїла відвідати й оглянути Імператорську гвардію в Чіті трохи його заспокоїв.\n\nЗавдяки публічним візитам і приватним авдієнціям народ та цивільні можновладці побачать у царі присутнього й діяльного монарха."

 CHT_volkogonovs_clique: "Кліка Волкоґонова"
 CHT_volkogonovs_clique_desc: "Міхаїл і Міхайлов дізналися про Волкоґонова - впливову постать в Імператорській армії та давнього суперника Шепунова, який через контакти Міхайлова серед лоялістів дав зрозуміти, що може допомогти Міхаїлові в боротьбі проти Шепунова та військового контролю над адміністрацією.\n\nСхилити Волкоґонова буде нелегко, але його допомога в майбутній боротьбі проти тимчасового прем'єр-міністра та залізної хватки над царством життєво необхідна, щоб Шепунов і його поплічники не змусили царя замовкнути назавжди.\n\n«Пам'ятайте, мій царю: вся війна ґрунтується на обмані. Навіть війна, яку ведуть не на полі бою, а в палацових покоях і парламентах...»"

 CHT_pull_back_the_curtain: "Відсунути завісу"
 CHT_pull_back_the_curtain_desc: "Міхайлов прийшов до царя з нібито геть безглуздою пропозицією: публічно «відсунути завісу» лялькової вистави Шепунова й показати громадськості та офіцерам справжній масштаб його впливу. На публічному заході в Чіті цар зробить заяви й кроки, з якими Шепунов просто не зможе змиритися.\n\nЗвісно, це неймовірно небезпечно: навіть успіх проведе чітку межу й, імовірно, розкриє прем'єр-міністрові пляни царя. Та якщо ставка Міхайлова зіграє, махінації Шепунова буде викрито перед усіма.\n\nМіхаїл знає, що без достатньої цивільної підтримки плян може обернутися катастрофою, однак зрештою вирішив, що ризик того вартий.\n\n§RУвага: без достатньої цивільної підтримки плян може обернутися для Міхаїла страшенною невдачею...§!"

 CHT_a_curt_realization: "Неприємне усвідомлення"
 CHT_a_curt_realization_desc: "Міхаїл II і Боріс Шепунов уже зрозуміли, що замишляють один проти одного. Це неприємне усвідомлення запускає відлік: обидва завершують приготування й шукають усієї підтримки, яку тільки можуть зібрати.\n\nКоли над колись тихою Чітою сходяться грозові хмари конфлікту, цар і прем'єр-міністр мобілізують сили один проти одного в протистоянні, подібному до драми жовтня 1917 року - Корніловського заколоту.\n\nХоча жодна сторона цього до кінця не усвідомлює, зіткнення визначить майбутнє білого руху на Далекому Сході."

 CHT_making_a_play: "Зробити хід"
 CHT_making_a_play_desc: "«Коли настане час, ви підтримаєте нас?»\n\n«Звісно, мій царю. Тілом і кров'ю».\n\n«Пам'ятай, Іване, ти мені винен».\n\n«Звісно, прем'єр-міністре Шепунов. Я буду поруч, коли знадоблюся».\n\nІ царські лоялісти, і військові почали робити ходи один проти одного, готуючись до неминучого зіткнення, час і місце якого не знає жодна сторона. Обидві певні лише в одному: коли воно станеться, вони будуть готові."

 CHT_shoring_up_support: "Зміцнити підтримку"
 CHT_shoring_up_support_desc: "Зіткнення здається неминучим, тож обидві сторони гарячково зміцнюють свою підтримку: перевіряють вірність союзників і відчайдушно намагаються перетягнути до себе всіх охочих допомогти. Годинник наближається до півночі, й царські та військові лоялісти ще можуть діяти - це остання нагода зміцнити позиції та підготуватися до протистояння.\n\n«Вам... удалося зв'язатися з нашим доброчинцем?»\n\n«Так, мій царю. Він каже, що буде недешево, але він усе владнає...»\n\n«Прем'єр-міністре Шепунов, наш союзник Єхонтов сказав, що може виконати завдання...»\n\n«Чудово, дякую»."

 CHT_the_final_preparations: "Останні приготування"
 CHT_the_final_preparations_desc: "«Прем'єр-міністре... нам удалося зв'язатися з Віленом. Він підтвердив, що готовий до бою, коли знадобиться...»\n\n«Мій царю, командир Турґєнєв підтвердив вірність справі. Коли настане час, він буде з нами».\n\nКінець близько. Прем'єр-міністр зміцнив опору й підготував похід на Імператорський палац. Тим часом цар, затамувавши подих, чекає, чи прийде його підтримка. На шальках терезів майбутнє не лише Князівства, а й усієї Росії."

 CHT_a_quiet_dinner: "Тиха вечеря"
 CHT_a_quiet_dinner_desc: "Над Чітою запала мертва тиша, а політичні інтриги розрослися навсібіч. Множаться чутки про царя, який пробудився до обов'язку й бореться проти волі військових. Поміж народу шириться шепіт: хтось хвилюється, хтось цікавиться, дехто навіть у захваті.\n\nТа нерви царя та його багатостраждального прибічника Івана Міхайлова були натягнуті до краю. Вони сіли вечеряти в Імператорському палаці Чіти, нібито щоб обговорити майбутнє, поки Боріс Шепунов збирав місцевий гарнізон під командуванням Волкоґонова для походу на палац і арешту «змовників».\n\nОглушлива тиша в царській їдальні віддзеркалювала мовчазний напружений марш чітинського гарнізону: обидва наближалися до кульмінації довгоочікуваного протистояння монарха та війська. Цього вечора вирішиться доля білого руху."

 #Regional Economy Tree
 CHT_expand_the_idc: "Розширити ІКР"
 CHT_expand_the_idc_desc: "Від часу заснування Імператорська компанія розвитку стала величезною підмогою в перетворенні пусток за Чітою на щось схоже на сучасний індустріялізований регіон. Та нині наші кордони охоплюють увесь російський Далекий Схід, і в теперішньому вигляді ІКР не може ефективно поширити діяльність на весь край.\n\nМожливо, державі слід підтримати її розширення. Завдяки щедрим фінансовим вкладенням самого царя можливості ІКР зростуть далеко за попередні межі. З допомогою компанії ми повністю розкриємо прихований промисловий потенціял Далекого Сходу."

 CHT_clearing_a_path: "Розчистити шлях"
 CHT_clearing_a_path_desc: "Коли білі вперше прибули до Чіти, вона була лише малим маяком російської цивілізації серед безмежних непридатних пусток аж за обрій. Після створення Імператорської компанії розвитку та її кампанії з освоєння ми перетворили ці землі на щось значно корисніше.\n\nРезультати говорять самі за себе, тож природно надати таку саму допомогу решті новоздобутих земель. Почнеться величезна кампанія освоєння: вона продовжить розпочате в Чіті й розчистить місце для будівництва. Так чи інакше, сибірські пустки буде приборкано."

 CHT_transforming_the_wastes: "Перетворити пустки"
 CHT_transforming_the_wastes_desc: "Безкраї лісові простори поволі, але невпинно відступають і перетворюються на щось справді корисне для Імперії. Величезні площі першокласної землі вже розчищено для будівництва та експлуатації, лишилося лише пустити їх у діло.\n\nНевдовзі ці порожні місця стануть домом для молодої промисловости Далекого Сходу. Розвинувши належну інфраструктуру, ми заповнимо нові площі всілякими продуктивними підприємствами. Фабрики, шахти й збройові заводи стануть порядком денним. Нам годі змагатися з промисловими центрами заходу, та плоди освоєння вже не такі похмурі, як здавалося раніше."

 CHT_riches_of_the_far_east: "Багатства Далекого Сходу"
 CHT_riches_of_the_far_east_desc: "Далекий Схід давно є найбіднішим і найменш заселеним регіоном Росії. Справжньої економіки майже немає, тож доведеться виявити винахідливість і якнайкраще використати доступне. Попри вигляд, цей занедбаний край може багато запропонувати. Під мерзлою землею та сибірською вічною мерзлотою ховаються величезні природні багатства, переважна більшість яких століттями лишалася незайманою.\n\nТепер, коли контроль над регіоном забезпечено, видобуток підземних скарбів має стати безумовним пріоритетом. Наявну інфраструктуру пристосують до наших потреб, а в давно забутих районах почнеться масштабний видобуток. Багатства під землею буде відкрито, закріпивши наше панування над непокірним російським Далеким Сходом."

 CHT_exploit_the_prisoners: "Експлуатувати в'язнів"
 CHT_exploit_the_prisoners_desc: "Через малу заселеність регіону велика робоча сила не лежить просто під рукою. Пляни використати природні ресурси Далекого Сходу й зрештою почати індустріялізацію без надійних робочих рук ганебно не досягнуть мети.\n\nНачальник штабу Боріс Шепунов запропонував суперечливе рішення. Він вважає, що безліч полонених у війнах за об'єднання регіону марно сидять у в'язницях, а користи буде більше, якщо змусити їх працювати. Деякі стурбовані міністри назвали ідею аморальною, але варто пам'ятати: за нагоди ці фашисти й большевики без вагань учинили б із нами так само!"

 CHT_birth_of_an_industry: "Народження промисловости"
 CHT_birth_of_an_industry_desc: "Наскільки це було можливо, суворі пустки Далекого Сходу приборкано. Безкраї ділянки одноманітної тундри розчищено для амбітного будівництва, а нові копальні невтомно забезпечують нас незліченними природними багатствами.\n\nЛишилося пустити новий простір у діло. Це буде нелегко, але без індустріялізації Далекого Сходу нам не вистояти проти західних суперників. Працею й потом ми народимо власне сибірське промислове осердя."

 CHT_japanese_investments: "Японські інвестиції"
 CHT_japanese_investments_desc: "Після падіння РФП наш уряд успадкував її зв'язки з японцями та їхніми діловими інтересами. Раніше підтримка надходила лише військовими матеріялами й таємною допомогою, але об'єднання регіону офіційно відчинило японцям двері.\n\nМи не бачимо причин цьому перешкоджати. Дзайбацу мають багато чого запропонувати, а їхні інвестиції істотно зміцнять економіку. Звернімося до них і повідомимо, що наша Росія стане захопленим і охочим партнером."

 CHT_cutting_edge_equipment: "Передове обладнання"
 CHT_cutting_edge_equipment_desc: "Фабрики - важлива частина сучасної економіки, але без належних інструментів та обладнання вони працюють у темпі, який чемно можна назвати неоптимальним. У нашому становищі виробляти нові станки власними силами майже неможливо. На щастя, зв'язки з японцями та дзайбацу лише міцнішають, і це можна використати.\n\nЯпонська промисловість одна з найсучасніших у світі, й передове обладнання відіграє тут велику роль. Домовмося. Економічна наддержава на кшталт Японії напевне має вдосталь устаткування й погодиться поділитися з друзями в Росії."

 CHT_efficiency_is_key: "Головне - ефективність"
 CHT_efficiency_is_key_desc: "Наші фабрики досі працюють недостатньо швидко. Попри всі зусилля, прикрі вузькі місця й далі знижують ефективність і калічать продуктивність. Придивившись, ми побачили, що значна частина проблеми полягає в самій організації праці. Фабрики досі працюють за правилами й методами кількадесятирічної давнини! Так не годиться, і рішення знову може критися в країні вранішнього сонця.\n\nЯпонська економіка славиться нещадною ефективністю, й нам варто якнайкраще наслідувати її виробничі методи. Ми запросимо японських фахівців упорядкувати виробничі лінії та змусити робітників працювати якомога ефективніше. Лише тоді можна сподіватися зрівнятися з промисловим випуском суперників!"

 CHT_the_modern_zemstva: "Сучасні земства"
 CHT_the_modern_zemstva_desc: "Далекий Схід завжди був величезним і непокірним краєм, і навіть за наших обмежених розмірів управляти цими просторами надзвичайно важко. Якщо далі користуватися системою часів боротьби з червоними й фашистами, економіка неминуче тяжко постраждає від бездіяльности.\n\nМіністр фінансів Іван Міхайлов запропонував рішення з довгої та славної історії Імперії. Тисячі міст і сіл держави отримають голос, а їхні трудові потреби розглядатиме система місцевих рад за зразком Імператорських земств. Міхайлов вважає, що сучасні земства значно розвантажать адміністрацію й краще організують селян і робітників Росії."

 CHT_imperial_corporations: "Імператорські корпорації"
 CHT_imperial_corporations_desc: "Однією з причин могутности японської економіки є дзайбацу. Ці фінансові конгломерати контролюють значну її частину й рухають інтереси Сфери. Щоб збудувати власну дієздатну й потужну економіку, можна надихнутися дзайбацу та виростити своїх ділових велетнів.\n\nЗа підтримки корони ми створимо низку Імператорських корпорацій. Вони відіграватимуть роль, подібну до японських дзайбацу, й, сподіваємося, самі стануть грізною економічною силою. Для зростання корпорації отримають численні привілеї та свободу дій, доки їхні інтереси не суперечать інтересам Імперії. Якщо все піде за пляном, Імператорські корпорації стануть наймогутнішою зброєю нашого економічного арсеналу."

 CHT_new_industrial_centers: "Нові промислові центри"
 CHT_new_industrial_centers_desc: "Щоб ефективніше керувати будівництвом фабрик, Міністерство фінансів запропонувало створити низку промислових зон, відведених винятково для індустрії. Така система добре працювала в минулому й, як відомо, перетворила західні частини Сибіру на промисловий хребет Росії.\n\nУмови на Далекому Сході значно гірші, але ми однаково можемо створити спеціяльні зони для молодої промисловости регіону. Вони постануть як у містах, так і на повернутих у природи землях. Трохи тяжкої праці - й колись занедбана пустка стане надзвичайно продуктивним краєм, гідним стояти поруч з іншими промисловими серцями Росії."

 CHT_redirect_the_workforce: "Переспрямувати робочу силу"
 CHT_redirect_the_workforce_desc: "Попри всі нарікання про якісь там «права людини», наша схема з в'язнями мала приголомшливий успіх. На жаль, тепер, коли їхні обов'язки переважно виконано, ми знову маємо величезну кількість ув'язнених, яким лишається сидіти в камерах і чекати свободи. Можливо, їм знайдеться інше застосування.\n\nДержаві потрібно більше фабрик, а цивільних працівників знову бракує. Настав час іще раз приборкати в'язнів і переспрямувати їх із освоєння земель на будівництво та виробництво. Ці злочинці й зрадники далі сплачуватимуть борги службою Імперії."

 CHT_the_east_awakens: "Схід пробуджується!"
 CHT_the_east_awakens_desc: "Це коштувало величезної праці, але цифри говорять самі за себе. Вперше за багато років економіка показує справжню активність і стала майже цілком самодостатньою. По всьому регіону, колись названому непридатним для життя крижаним пеклом, фабрики невтомно працюють, а робітники безупинно забезпечують добробут Імперії. Завдяки модернізації їхня продуктивність сягнула небаченого рівня.\n\nУсупереч усім прогнозам російський Далекий Схід нарешті прокинувся від глибокого холодного сну. Омолоджений новими багатствами та добробутом понад найсміливіші мрії, білий рух іще ніколи не був таким сильним!"

 #Regional Military Tree
 CHT_lessons_of_war: "Уроки війни"
 CHT_lessons_of_war_desc: "Біла армія здолала численних ворогів на Далекому Сході - від отруйних фашистів до споконвічних большевицьких супротивників. Та попри заслужену перемогу очевидно, що збройним силам іще далеко до дієздатного сучасного війська.\n\nСпершу можна визначити стратегії й тактики, що найкраще відповідають нашим потребам. Війни за об'єднання регіону багато навчили нас про власні сильні та слабкі сторони, й перед продовженням возз'єднання країни варто вивчити ці уроки."

 CHT_examine_the_troops: "Оглянути війська"
 CHT_examine_the_troops_desc: "Коли тебе з усіх боків затисли вороги в безлюдній замерзлій пустці, перебирати людьми для фронту не доводиться. Становище стало відчайдушним, і Біла армія мусила йти на компроміси, яких уникнула б у кращі часи.\n\nТому багатьох наших вояків важко назвати вмотивованими професійними солдатами. З відновленням миру в регіоні треба ретельно оглянути війська й відділити зерно від полови."

 CHT_tighten_the_standards: "Посилити вимоги"
 CHT_tighten_the_standards_desc: "Непридатні люди потрапляли до лав лише тому, що вимоги до набору від початку були невисокими. До об'єднання Далекого Сходу повноцінна армія була розкішшю, і ми брали всіх, хто міг тримати рушницю. Часи змінилися, і Біла армія більше не може погоджуватися на когось, крім найкращих.\n\nНачальник штабу Боріс Шепунов вимагає суворо посилити імперські стандарти набору, щоб до війська потрапляли лише здібні й дисципліновані бійці. Нова Біла армія вимагатиме якости в лавах, і не кожен випадковий волоцюга, що з'явився у військкоматі, буде гідний однострою!"

 CHT_improve_the_methods: "Удосконалити методи"
 CHT_improve_the_methods_desc: "Минулий рік довів: війна - тяжке випробування, й лише найвитриваліші здатні зустріти її жахи. Суворе навчання молодих людей є важливим кроком до загартування тіла й духу перед майбутньою боротьбою. На жаль, нинішні програми переважно спрямовані на те, щоб якомога швидше прогнати якнайбільше новобранців крізь систему та кинути в бій.\n\nТож пріоритети підготовки мають докорінно змінитися. Замість мінімуму задля кількости нові вправи розвиватимуть дисципліну та майстерність. Новобранці Білої армії звикатимуть до суворости війни на полігонах, а не в бою. Це створить не лише дисциплінованіший корпус солдатів, а й професійніше військо."

 CHT_reignite_the_movement: "Знову запалити рух"
 CHT_reignite_the_movement_desc: "Після возз'єднання російського Далекого Сходу й повного розгрому фашистів та большевиків білий рух іще ніколи не був таким сильним. Та білі офіцери, які почали боротьбу за повернення Росії, старіють і не можуть воювати вічно. Попри вагання генерального штабу, відповідь одна: Білій армії потрібна нова кров.\n\nСтарі білі скептично ставилися до нових офіцерів через страх проникнення ліберальних і навіть соціялістичних симпатій у верхні ешелони. Але неминучого не уникнути. Нові офіцери все одно знадобляться, інакше білий рух помре разом зі старими генералами.\n\nНастав час запалити полум'я російського монархізму й антибольшевизму в новому поколінні росіян, бо саме вони стануть завтрашнім генеральним штабом."

 CHT_imperial_war_academies: "Імператорські військові академії"
 CHT_imperial_war_academies_desc: "Білій армії потрібні нові офіцери. Ця нагальна потреба відчутна всюди: від стрімко старіючого генерального штабу до застарілих стратегій. Нова кров не лише дасть гідних наступників старим білим, а й може принести сміливі військові теорії, краще пристосовані до сучасного поля бою. На жаль, ми не маємо закладів для їхньої підготовки.\n\nГенеральний штаб запропонував заснувати Імператорські військові академії. На Далекому Сході є кілька військових училищ совєцької та давнішої доби, що десятиліттями стоять без діла й чудово нам прислужаться. Старі школи військової науки буде відновлено й перетворено на форми, у яких виллють наступне покоління білих офіцерів."

 CHT_the_next_generation: "Наступне покоління"
 CHT_the_next_generation_desc: "Хоробрі сини Росії, наша колись горда Імперія розбита й осквернена. Військові правителі та самозвані уряди розтягують кістки нелегітимної совєцької держави й прагнуть установити над країною власне жорстоке панування. Не бійтеся, браття, бо надія є! Законний спадкоємець престолу Романових повернувся на чолі найвірнішої армії й за її допомогою приніс мир і порядок на російський Далекий Схід.\n\nТа боротьба вашого Імператора ще не скінчилася, і йому потрібна ваша допомога! Білій армії потрібні новобранці, щоб продовжити боротьбу за честь Росії, і лише за підтримки найхоробріших воїнів вона рушатиме до перемоги.\n\nВступай до Білої армії сьогодні й назавжди посідай місце героя у славній історії Росії! З нами Бог!"

 CHT_a_new_white_army: "Нова Біла армія"
 CHT_a_new_white_army_desc: "Сьогоднішня Біла армія геть не схожа на ту, що колись перетнула Амур і ввійшла на російський Далекий Схід. Колишнє обдерте військо старих козаків і бандитів в одностроях стало високодисциплінованою професійною армією, яка гордо служить в ім'я царя.\n\nЗавдяки набору молодих офіцерів війська матимуть добрий провід і після смерти старих білих. Біла армія досягла небаченого професіоналізму; тепер лишилося почати широку модернізацію, щоб горді війська Імперії були готові до будь-якої загрози на заході."

 CHT_beginnings_of_a_fleet: "Початки флоту"
 CHT_beginnings_of_a_fleet_desc: "Нині становище Імперії може здаватися міцним, та без підтримки флоту на нас можуть чекати неприємні сюрпризи з моря. Ми не здатні створити грізний флот, гідний військової могутности Росії, але поки можемо скористатися кораблями переможених ворогів.\n\nУ порту Маґадана іржавіє невелика флотилія, якою раніше користувалася РФП. Ці кораблі краще прислужаться нам, якщо переобладнати їх на перші судна нового й поліпшеного Імператорського російського флоту."

 CHT_protecting_our_trade: "Захистити торгівлю"
 CHT_protecting_our_trade_desc: "Ділові зв'язки з Японією життєво важливі для нашої справи, а порт Маґадана став ключовою ниткою до зовнішнього світу. На жаль, потенційні суперники можуть це помітити. Нині торговельні шляхи ніщо не захищає від піратів та інших, прихованіших небезпек.\n\nНовий флот крихітний за світовими мірками, але саме тому чудово підходить для супроводу торговельних суден і забезпечення потоку грошей через Маґадан до наших рук. Імператорський російський флот іще замалий для прямого бою з ворожою фльотою, але цілком здатен підтримувати безпеку й контроль на морі."

 CHT_weapons_of_the_modern_age: "Зброя сучасної доби"
 CHT_weapons_of_the_modern_age_desc: "Нині Біла армія переважно озброєна старими рушницями з ковзним затвором та різноманітним уживаним спорядженням від переможених суперників і японців. Та решта світу пішла далі. Штурмова гвинтівка стала королем стрілецької зброї, а керовані дротами ракети здійснили революцію у протитанковому озброєнні.\n\nБіла армія мусить прийняти ці новації. З допомогою іноземних фахівців і трохи сумнівних торговців зброєю ми забезпечимо війська найновішим озброєнням сучасної доби. Досить задовольнятися реліквіями минулого!"

 CHT_the_cavalry_of_the_future: "Кавалерія майбутнього"
 CHT_the_cavalry_of_the_future_desc: "Біла армія має горду традицію агресивних кавалерійських маневрів іще від Російської громадянської війни. Навіть після трагічної смерти отамана Сємьонова Забайкальське козаче військо зберігає значний вплив на тактику, а високомобільні кавалерійські частини лишаються невіддільною рисою Білої армії. Та світ відійшов від бою верхи. Хоч би як ми опиралися, звична кавалерія застаріла, але сама ідея досі має сенс.\n\nРухомі частини еволюціонували, й броньовані машини - танки та БТР - посіли місце відважних вершників минулого. Щоб не зрадити традицію рухомого бою й водночас прийняти сучасні новації, слід узяти перевірену тактику механізованої піхоти, яка прориває ворожі лінії за підтримки важкої броні. Спадщина білої кавалерії житиме в новій, могутнішій формі."

 CHT_take_to_the_skies: "Піднятися в небо"
 CHT_take_to_the_skies_desc: "Цілковита ганьба, що наша славетна Біла армія досі не має справжніх повітряних сил! У кампаніях на Далекому Сході ми захопили багато ворожих літаків, які тепер припадають пилом в ангарах і чекають нового дня служби.\n\nМи ще не маємо промислової спроможности серійно виробляти власні літаки, але повторне використання воєнних трофеїв стане пристойним початком Імператорських російських повітряних сил. З часом Його Величність матиме грізну повітряну фльоту, а небо буде захищено в ім'я Імперії."

 CHT_examine_foreign_designs: "Вивчити іноземні конструкції"
 CHT_examine_foreign_designs_desc: "Одного дня ми зможемо виробляти власні літаки, й тоді знадобляться передові конструкції для панування в небі. Поки ж маємо лише старі ґвинтові машини совєцької доби. Без власних конструкторів заново винаходити колесо надто клопітно, коли у світі вже існує стільки перспективних зразків.\n\nЧас знову зв'язатися з друзями в Токіо. Японія має вражаючі сучасні повітряні сили. Можливо, вони дозволять вивчити конструкції, щоб у майбутньому пристосувати їх до наших потреб?"

 CHT_our_military_reforged: "Наше перекуте військо"
 CHT_our_military_reforged_desc: "Модернізація Білої армії дає обнадійливі плоди. З новою тактикою й новішою зброєю війська цілком здатні серйозно загрожувати ворогам Його Імператорської Величности. Ми більше не обідраний гурт козацьких нападників, який ледве тримається за твердиню в Чіті. Нарешті Біла армія стала силою, з якою рахуються!\n\nДо того ж створено Імператорський російський флот та Імператорські російські повітряні сили. З часом вони стануть незамінними складовими збройних сил Імперії. Нарешті війська готові рушити на захід. Горе всім на їхньому шляху, бо похід за повернення земель невдовзі продовжиться!"

 #Regional Diplo Tree
 CHT_onwards_and_outwards: "Уперед і назовні"
 CHT_onwards_and_outwards_desc: "Перемігши суперників на Далекому Сході, ми нарешті можемо звернутися до решти світу. Найближчим часом доведеться розв'язати чимало питань, принаймні щодо міжнародної спільноти.\n\nТа ми впевнено бачимо два шляхи до взаємодії з іноземними державами. По-перше, звернемося до японців, які досі, як і в минулі роки, ставилися до нас дуже прихильно. По-друге, як спадкоємців харбінського білого руху нас знають у світі як одного з небагатьох, якщо не єдиного справжнього наступника Російської Імперії серед російських емігрантів.\n\nСкористаймося перевагами й запросімо і японців, і емігрантів: перших - офіційно визнати нас, других - допомогти лобіювати дальше міжнародне схвалення й принести додаткову користь, коли вони нарешті повернуться додому."

 CHT_the_new_favorite: "Новий улюбленець"
 CHT_the_new_favorite_desc: "Коли старий союз із фашистами розпався невдовзі після сповільнення наступу 1950-х під час краху Совєцького Союзу, японці зробили Константіна Родзаєвского своїм, так би мовити, «золотим хлопчиком». Вони засипали його та чорносорочечників військовими матеріялами, вишколом і майже всім, що він тільки міг уявити, - в обмін, звісно, на мовчазну згоду щодо японського впливу в країні, яку той мав об'єднати.\n\nТепер, коли ми розбили Россійскую Фашистскую Партію й відновили справжнього спадкоємця Харбіна в особі білого руху, японці знову звернулися до нас, сподіваючись урятувати відносини, які мали з Вождем. Ми й раніше приймали японську допомогу, та тепер вони приходять до нас, а не навпаки, тож наша переговорна позиція стала привілейованішою. Хай там як, тепер ми - новий улюбленець Японії на Далекому Сході."

 CHT_asian_diplomatic_exchanges: "Азійські дипломатичні обміни"
 CHT_asian_diplomatic_exchanges_desc: "Після безлічі болісних клопотів із японськими делегаціями в Токіо вони погодилися «переконати» інших членів Сфери встановити з нами дипломатичний обмін: їхні посольства з'являться в Чіті, а наші - у відповідних столицях.\n\nТа це ще не все. За досягнутими домовленостями російські наукові й академічні групи відвідають Китай, Японію та Індонезію й вивчать величезні промислові та економічні технології, які Сфера співпроцвітання запровадила після перемоги над Сполученими Штатами. Наші вчені та інтелектуали повернуться готовими впроваджувати й застосовувати ці технології та принципи по всій державі."

 CHT_remembering_the_zaibatsus: "Не забувати про дзайбацу"
 CHT_remembering_the_zaibatsus_desc: "Попри нашу неохоту японці наполягають, що для співпраці й визнання ми мусимо надати низку поступок їхнім економічним мегакорпораціям - дзайбацу, які давно пожадливо дивляться на багаті ресурсами землі. На жаль, нині ми не можемо просто відкинути пропозицію.\n\nТа це не означає, що ми змирилися з японським пануванням над молодою економікою. Ні, ми вже шукаємо способів обійти особливе становище, нав'язане новими доброчинцями. А поки час публічно визнати користь дзайбацу й підготуватися до їхньої висадки на Далекому Сході."

 CHT_emigres_abroad: "Емігранти за кордоном"
 CHT_emigres_abroad_desc: "Завоювавши Далекий Схід, ми знову стали реальною, хай і малопомітною, цяткою на мапі світу. Несподіваним, але бажаним наслідком стало відродження згасаючого руху білої еміграції - тих, хто пережив громадянську війну, та їхніх дітей. Емігранти живуть по всьому світу, особливо в Європі, Харбіні та Америках.\n\nТепер, коли дипломатичне становище трохи стабілізувалося, час звернутися до них. Ми попросимо пожертв у зацікавлених і спроможних, а всім, хто прибуде на Далекий Схід і служитиме нашому урядові у відвоюванні Росії, пообіцяємо репатріяцію. Невдовзі очікуємо першу хвилю найвідданіших та найідейніших емігрантів."

 CHT_back_to_manchuria: "Назад до Маньчжурії"
 CHT_back_to_manchuria_desc: "Коли хоробрі солдати покидали Харбін, ми були строкатою сумішшю фашистів, призовників і царських ідеологів. На жаль, дуже багато білих у Харбіні, скептичних і цинічних щодо нашого відвоювання, лишилися там.\n\nЗ роками найвідоміші з них зблизилися з маньчжурськими реформаторами-бюрократами й долучилися до великого та здорового промислового сектору Маньчжоу-ґо. Тепер, коли ми утвердилися на Далекому Сході й довели колись скептичним емігрантам, що прийшли надовго, лише найзрадливіші відмовляться приєднатися й принести весь промисловий досвід, накопичений за ці роки."

 CHT_across_the_ocean: "Через океан"
 CHT_across_the_ocean_desc: "Величезна кількість емігрантів утекла не до Харбіна, а в Європу чи Америки. Нацисти опустили завісу терору над більшістю завойованих земель, але ті емігранти, які досі можуть виїхати з Європи, та найбільш охочі з Америк неодмінно приїдуть.\n\nДодаткові обіцянки репатріяції й привілейованих посад в уряді вже привабили багатьох і напевне приваблять іще більше людей перспективою справжнього відновлення Імперії. Нові емігранти, особливо зі Сполучених Штатів та Англії, привезуть освіту й високоосвічених дітей. Постійний потік чоловіків і жінок із найосвіченіших куточків світу збільшить нашу здатність навчати наступне покоління й допоможе створити справжню освічену основу Росії."

 CHT_looking_for_recognition: "Шукати визнання"
 CHT_looking_for_recognition_desc: "Залагодивши японські вимоги й привабивши потік емігрантів, які допоможуть розбудовувати державу, ми нарешті можемо лобіювати офіційне визнання. Ми контролюємо лише чверть території Росії та частку її населення, тож боротьба буде тяжкою, але японська підтримка наших претензій на російську легітимність уже забезпечила найважчі кроки.\n\nМи офіційно заявимо про намір повернути Росію й відновити Імператорську царську систему. Водночас запевнення Вашинґтона в конституціоналізмі та майбутньому дистанціюванні від японців мають розвіяти його страхи. Кінцева мета - щоб і американці, і японці визнали нас законним спадкоємцем Росії."

 CHT_off_to_tokyo: "До Токіо"
 CHT_off_to_tokyo_desc: "Нині японське визнання нас законним претендентом на об'єднання Росії може здаватися очевидним, однак їхня адміністрація й раніше була мінливою та аж ніяк не досконалою - яскраве нагадування про це дала її підтримка РФП замість нашого руху.\n\nТож адміністрація Чіти підготувала офіційну делегацію до Токіо, яка проситиме японців визнати чітинський білий рух законним спадкоємцем Росії. Її виліт із Чіти багато урядовців сприйняли як початок нової доби успіху й добробуту."

 CHT_a_hope_beyond_japan: "Надія за межами Японії"
 CHT_a_hope_beyond_japan_desc: "Японці - «безпечна ставка» для міжнародного визнання, але аж ніяк не єдина сила, чийого схвалення ми прагнемо. Окрім Токіо та його сателітів, відкритіші й винахідливіші люди в наших владних колах давно дивляться через Тихий океан на американців та їхню економічно потужну Організацію Вільних Націй.\n\nЧерез нинішню тісну співпрацю з японцями та розгром американського улюбленця з Маґадана ця місія майже напевне завершиться розчаруванням. Та спробувати важливо - хоча б щоб закласти прецедент майбутніх відносин із Вашинґтоном та його союзниками."

 #####################################
 ##=====| Superregional Trees |=====##
 #####################################

 #Superregional - Imperial tree
 CHT_the_tsars_speech: "Промова царя"
 CHT_the_tsars_speech_desc: "Цар Міхаїл, чия влада зміцнилася після падіння Шепунова, вирішив виступити в етері й оголосити нову добу російської історії: добу свободи, добробуту й особистої волі, коли всі росіяни - багаті й бідні, освічені й неписьменні - зможуть жити в злагоді та мирі.\n\nЗвісно, спершу цареві треба навчитися все це вимовляти російською. Міхаїл народився у Франції та прожив життя майже всюди, крім Росії. Коли його викрали й привезли до Чіти фактично як в'язня, він мусив читати промови фонетично, часто навіть не знаючи, що говорить. Навіть тепер його російська слабка.\n\nТа це, схоже, не спинило сповненого нових сил монарха. Він порадився з Міхайловим і найняв постійного вчителя мови, щоб нарешті опанувати мову власного народу."

 CHT_enforce_the_new_imperial_system: "Утвердити нову імперську систему"
 CHT_enforce_the_new_imperial_system_desc: "Попри всі зусилля цивільні адміністратори досі насилу підтримують лад на безкраїх землях, які ми контролюємо лише на папері. До того ж, як доповідає Волкоґонов, частина армії досі кипить через усунення Шепунова. Серйозні звинувачення стривожили новий царський режим і швидко підштовхнули його до дії.\n\nЦар і найближчі союзники вирішили, що нова система, заради якої вони так тяжко працювали й ризикували царським життям, безцінна, а тому потребує захисту від усіх спроб заколоту та підриву. Та Волкоґонов і Міхайлов застерегли від крайнощів: нова адміністрація мусить пройти по тонкій линві, щоб захист влади не налаштував проти неї народ, якому вона намагається догодити."

 CHT_a_new_white_movement: "Новий білий рух"
 CHT_a_new_white_movement_desc: "Білий рух виник після Жовтневої революції, коли большевики захопили владу в Москві та Петрограді й розпалили громадянську війну на багато років. Це було 1917-го, понад п'ять десятиліть тому. Колись визначні провідники первісного білого руху були хоробрими солдатами, офіцерами та державними діячами, та час багатьох убив, а ще більше - знесилив.\n\nЗі смертю отамана 1962 року зник останній великий ветеран, лишивши по собі найгірших із найгірших.\n\nТа тепер ми контролюємо останній залишок білого руху й після перемоги над Шепуновим та возз'єднання Сходу можемо зробити його власним: визначити в сучасних поняттях, відкинути архаїчне й привести нові покоління ідеологів, доки ті не надто відхиляються від бачення царя та його оточення."

 CHT_depoliticize_the_army: "Деполітизувати армію"
 CHT_depoliticize_the_army_desc: "Однією з головних проблем перших непевних років білого руху було панування військових і сильних людей у його політиці. Боріс Шепунов та всі потенційні можновладці, що могли б його змінити, уособлюють найгірші сторони нашого руху, а тому їх слід викорінити й усунути - якщо вони досі лишилися.\n\nТа важливо не лише прибрати теперішніх порушників спокою, а й назавжди зробити армію лише знаряддям царської волі. Академії випускатимуть офіцерів, відданих царю й нікому іншому, а війська ставитимуть підтримку монарха нарівні з відданістю Росії та самому Богові."

 CHT_end_their_legacy: "Покласти край їхній спадщині"
 CHT_end_their_legacy_desc: "Був білий рух, а був Боріс Шепунов. Шепунов і його поплічники - старі діди, які не вірили, що громадянська війна колись скінчилася, - належали до білого руху, але безперечно не представляли його.\n\nНайкраще білий рух уособлюють ті, хто працював за лаштунками, помірковані конституціоналісти й царські лоялісти - саме люди, які кілька років тому перемогли Шепунова та його підступні пляни. Тож ми покладемо край спадщині Шепунова і кліки немічних старців. Його ім'я паплюжитимуть, його поставлять поруч із совєтами та фашистами як загрозу нашому рухові, а всіх пов'язаних із ним чи старою адміністрацією розслідують і, за потреби, відправлять на пенсію та в забуття."

 CHT_make_our_claims_official: "Офіційно заявити претензії"
 CHT_make_our_claims_official_desc: "Наша адміністрація та її попередники давно заявляють про легітимність Російської Імперії й заперечують законність Лютневої та Жовтневої революцій. Та хоч ми десятиліттями цього дотримуємося, більшість світу сприймає претензії з недовірою.\n\nНастав час офіційно заявити народові й усьому світові, хто ми є: спадкоємці Російської Імперії, останнього законного й організованого уряду всього російського народу. Звісно, конкретну заяву ще треба ретельно опрацювати, щоб вона чітко висловлювала претензії та водночас була прийнятною для міжнародної спільноти."

 CHT_redefine_our_history: "Переосмислити нашу історію"
 CHT_redefine_our_history_desc: "Після недавніх внутрішніх перемог ми маємо неймовірно рідкісну нагоду перекувати власну ідентичність. Під час Російської громадянської війни та вигнання в Харбіні багато хто почав ототожнювати білий рух із дуже, дуже страшними явищами: лютим антисемітизмом, так званим «білим терором», співпрацею з огидною й давно мертвою Россійской Фашистской Партієй - і це лише кілька прикладів.\n\nМи мусимо пояснити і світові, і народові, якого ведемо, що ці явища не представляли й не представляють білого руху. За все, чим він став відомий, відповідали лише окремі його члени - наприклад, підступний Шепунов. Наш білий рух, за винятком кількох гнилих яєць, завжди прагнув відновити вільну Росію під владою царя."

 CHT_placate_the_workers_worries: "Заспокоїти робітників"
 CHT_placate_the_workers_worries_desc: "Однією зі спадщин Совєцького Союзу був величезний і надміру амбітний Центральносибірський плян, який спричинив масштабну індустріялізацію на схід від Уралу, по всьому Центральному й Західному Сибіру - частину цих земель ми нині контролюємо. Там промисловість розвинена значно краще, ніж у попередніх наших володіннях, а робітники, звиклі до щедрих поступок колишніх адміністрацій, бояться, що білі не поважатимуть їхніх дорогих прав.\n\nМи й близько не збираємося давати їм стільки, скільки давали совєти. Та адміністрація погодилася: невеликий консервативний закон про права робітників заспокоїть тривоги Центрального Сибіру й зробить людей охочішими до співпраці."

 CHT_a_new_generation_of_industry: "Нове покоління промисловости"
 CHT_a_new_generation_of_industry_desc: "Попри добре відомі спроби віддалитися від Сфери співпроцвітання та її довгих руйнівних економічних щупалець, мало хто назве минулі зв'язки з Японією та її вихованцями в Харбіні цілком марними. Однією зі справжніх переваг співпраці з Токіо стали маньчжурські реформатори-бюрократи - японці та маньчжури, які індустріялізували й модернізували економіку Маньчжоу-ґо.\n\nЗавдяки рокам у Харбіні та його освітніх закладах постало нове покоління білих економістів-емігрантів, натхненних реформаторами-бюрократами; найстарші з них щойно входять до відповідної робочої сили й мають чимало ідей щодо майбутнього економічного розвитку. Їх слід визнати й надати посади, на яких вони принесуть якнайбільшу користь."

 CHT_expand_the_imperial_corporations: "Розширити Імператорські корпорації"
 CHT_expand_the_imperial_corporations_desc: "Однією з перших і головних пропозицій молодих економістів, натхненних реформаторами-бюрократами, стало систематичне знищення впливу японських дзайбацу та розширення замість них Імператорських корпорацій, створених іще під час давньої боротьби з фашистами.\n\nВони слушно вказують, що відповідно до міжнародних цілей ми маємо зменшувати залежність від дзайбацу, досі досить впливових в економіці, й натомість вирощувати Імператорські корпорації у величезні самостійні компанії. Дехто називає це лише тимчасовим заходом до поміркованішої відповіді в майбутньому, інші ж про майбутнє корпорацій мовчать."

 CHT_introducing_new_officers: "Залучити нових офіцерів"
 CHT_introducing_new_officers_desc: "Стрімке розширення на захід стало водночас благословенням і прокляттям. З одного боку, ми дедалі ближче до об'єднання Росії, з другого - логістичним і кадровим проблемам немає кінця. Одна з найгостріших - брак офіцерів.\n\nЄ кілька ідей, як подолати нестачу вправного проводу. Перша - виховати нове покоління офіцерів, навчених і дисциплінованих за нашим взірцем. Друга, можливо практичніша, - перепрофілювати й призвати офіцерів переможених суперників на Далекому Сході та в Центральному Сибіру для командування й підготовки нових кадрів. Група буде менш «ідеологічно чистою», але створити її значно легше."

 CHT_volkogonovs_plan: "Плян Волкоґонова"
 CHT_volkogonovs_plan_desc: "Новий голова армії та тимчасовий прем'єр-міністр Волкоґонов звернувся до царя й радників із пропозицією, яку називає власним ім'ям - «Плян Волкоґонова». Він окреслив низку проблем Імператорської армії та способи їх розв'язання.\n\nПо-перше, буде запроваджено великий всеосяжний призов, щоб забезпечити досить солдатів для останнього походу на захід. По-друге, серед військ і по всій державі розпочнеться повна пропагандистська кампанія, яка переосмислить образ Білої армії та зітре страх і відразу, що їх багато хто відчуває до нашого руху."

 CHT_a_quick_chat: "Коротка розмова..."
 CHT_a_quick_chat_desc: "Досі японці приносили нам і добро, і зло. Вони давали обладнання, зброю та логістичну підтримку, не кажучи вже про модель нової економіки.\n\nТа все це мало ціну: економічні поступки й очікування, що колись ми повернемо ці «борги» Токіо дипломатичними, економічними та політичними послугами.\n\nНасправді ми не зацікавлені навіть у помірній заборгованості перед Сферою. Тож у короткій, але чесній розмові слід визначити майбутні очікування з колишніми доброчинцями - вони напевне будуть незадоволені."

 CHT_and_a_long_call: "...і довгий дзвінок"
 CHT_and_a_long_call_desc: "Розібравшись із японцями, ми нарешті можемо поглянути через Тихий океан, де лежить справжнє дипломатичне майбутнє: Сполучені Штати Америки. Провідник Організації Вільних Націй і один із найзапекліших супротивників експлуататорських та фашистських нацистів і японців постійно звертається до держав світу, щоб допомогти їм у міжнародній боротьбі проти авторитаризму.\n\nНаш рух і сам має авторитарне минуле, але після усунення проблемних людей, які створили адміністрації таку славу, можна почати будувати міст до американців. Буде нелегко, але воно того варте."

 CHT_one_final_push: "Останнє зусилля"
 CHT_one_final_push_desc: "Лише останній поштовх - більше нічого. Останнє зусилля, єдиний порив. Ми пройшли так далеко й досягли так багато: від голої глушини Чіти до боротьби із Шепуновим та його поплічниками. Тепер стоїмо на порозі слави, готові здобути все, за що так довго боролися. Чистий, незмішаний білий рух, спрямований на систематичне знищення большевизму в Росії, а понад те - на щиру підтримку монархії, самого царя, а отже, і Божої Волі.\n\nСьогодні Міхаїл II та радники встановили нове офіційне щорічне свято по всій Росії - День царя, на честь його життя та людей, причетних до сходження на престол. Волкоґонов, військовий провідник тимчасового уряду, виголосив гучну промову для всіх російських вух, прославляючи внесок кожного в повернення земель. Вона завершилася трьома словами, які в наступні роки звучатимуть дедалі частіше: С Намі Бог."

 #Superregional - Stratocracy tree
 CHT_the_new_white_order: "Новий білий порядок"
 CHT_the_new_white_order_desc: "Пил осів, і хаос, що охопив Чіту, скінчився. Прем'єр-міністр Шепунов переміг незгодних і зрадників, які поставили білий рух під велику загрозу. Міхаїл за ґратами, тож треба знайти належнішого спадкоємця Романових, але спершу слід стабілізувати становище.\n\nЗа відсутности царя прем'єр-міністр Шепунов офіційно став Імператорським регентом, і першим указом запровадив у всій державі воєнний стан заради відновлення миру та стабільности. Для білого руху настав новий день, і його майбутнє яскраве як ніколи."

 CHT_our_friends_in_tokyo: "Наші друзі в Токіо"
 CHT_our_friends_in_tokyo_desc: "З усіх іноземних держав ніхто не був більшим другом режиму, ніж японці. Усе, що ми просимо - рушниці, танки, літаки, - постачають негайно. Тим часом могутні дзайбацу ширять вплив по всій країні, й куди б не прийшли, їхні інвестиції істотно зміцнюють економіку.\n\nМи не бачимо причин це припиняти. Відносини з Японією слід поглиблювати, бо навіщо відвертатися від тих, хто приніс нам стільки багатства? Час звернутися до Токіо й підтвердити відданість економічному партнерству."

 CHT_reap_the_rewards: "Пожати плоди"
 CHT_reap_the_rewards_desc: "Дзайбацу далі посилюють вплив і видобувають величезні багатства з наших ресурсів. Їхні щедрі інвестиції вдихнули нове життя в російські підприємства й майже самотужки привели економіку до сучасности. Та дехто боїться, що їхній контроль над державою став надмірним.\n\nСправді, залежність від японських партнерів не лишилася непоміченою. Щодня місцевий російський бізнес поглинає дедалі більша імперія дзайбацу, а тривога через наслідки стає гучнішою. Регент чує ці побоювання й невдовзі визначить політику. Та поки можна безпечно пожинати плоди торгівлі з Токіо."

 CHT_a_line_in_the_sand: "Межа дозволеного"
 CHT_a_line_in_the_sand_desc: "На прохання регента дипломатична делегація їде до Токіо. Її місія - переглянути умови економічного партнерства з японцями. Дзайбацу стають надто могутніми, і багато урядовців вважають, що бездіяльність поставить під загрозу сам суверенітет Росії.\n\nМи не хочемо цілком відрізати японців, але мусимо встановити межі. Дзайбацу можуть вести справи, доки не загрожують нашому суверенітетові чи робочій силі. Ми проведемо межу дозволеного, й обидві сторони лише виграють."

 CHT_a_mutually_beneficial_arrangement: "«Взаємовигідна» домовленість"
 CHT_a_mutually_beneficial_arrangement_desc: "Дзайбацу приносять державі стільки користи - хто ми такі, щоб ставати на їхньому шляху? У безмежній мудрості регент відмовився переглядати умови з японцями. Він вважає, що обмеження дзайбацу зашкодить економіці, особливо з огляду на залежність наших ділових інтересів.\n\nДосі є побоювання, що японці використовують дзайбацу для встановлення економічного контролю над державою, але регент відкидає ці твердження. Японія бажає лише найкращого для обох народів, а надмірна підозріливість до іноземців без підстав - лише прикрий пережиток минулого."

 CHT_a_militarized_society: "Мілітаризоване суспільство"
 CHT_a_militarized_society_desc: "Імператорський регент Боріс Шепунов, який тепер міцно контролює державний апарат, мудро намітив нове суспільство для Росії. У далекому й недавньому минулому вплив невійськових клік загрожував розірвати країну.\n\nБільше ні! Біла армія, давній авангард проти руйнівного радикалізму, нерозривно зіллється з державним апаратом. Губернаторів обиратимуть із військових лав, місцеву поліцію поглине армія, а військова дисципліна стане частиною щоденного життя."

 CHT_demand_their_loyalty: "Вимагати вірности"
 CHT_demand_their_loyalty_desc: "Якщо офіцери не з нами, то вони проти нас! Під час змови колишнього царя чимало молодших офіцерів виявили зрадницькі симпатії й стали на бік імператорських лоялістів. Багато нових білих лишилися непохитними в обов'язку перед державою, але ми не забули тих, хто не лишився.\n\nКолись присяга була простою формальністю служби, тепер вона стане юридично обов'язковою. Усі нові білі мають зрозуміти: передусім вони служать інтересам Росії, навіть коли внутрішні сили стверджують інакше."

 CHT_the_saviors_of_russia: "Спасителі Росії"
 CHT_the_saviors_of_russia_desc: "Погляньте, вірні громадяни Імперії, на хоробрих воїнів Білої армії! Перемігши фашиста, большевика, фанатика, бандита та багатьох інших, імперські солдати стали живим утіленням усього, за що стоїть білий рух.\n\nНаші війська - спасителі Росії, непохитні оборонці держави, і це треба донести. Негайно почнеться широка пропагандистська кампанія. Плакати, листівки й оголошення недвозначно пояснять: служба у війську - водночас велика честь і священний обов'язок кожного росіянина."

 CHT_follow_the_trail: "Іти по сліду"
 CHT_follow_the_trail_desc: "Керівники змови проти військових надійно сидять за ґратами, але тривога не минає: багато їхніх прибічників можуть бути на волі й таємно продовжувати заколот. Це неприпустимо, тож час іти за нитками, знайденими під час розслідування проти фальшивого царя та його зграї зрадників.\n\nПісля встановлення особи їх судитимуть за всією суворістю закону. Ми не терпітимемо незгодних, які загрожують зруйнувати поступ, коли до возз'єднання держави лишилося так мало."

 CHT_stake_our_claim: "Заявити права"
 CHT_stake_our_claim_desc: "Немає сумніву, що ми законні спадкоємці Російської Імперії, підло поваленої ненависними большевиками. Та багато емігрантів досі сумніваються в легітимності, посилаючись на непевне походження Міхаїла.\n\nКоли фальшивого царя усунено, ми можемо знову заявити права законного наступника старої Імперії. Належніші претенденти вже готові посісти престол, але їм потрібно більше часу, щоб зрозуміти потрібну від посади покірність. А поки регентство триває, можна принаймні почати встановлювати спадкоємність із попередниками."

 CHT_secure_the_west: "Закріпитися на заході"
 CHT_secure_the_west_desc: "Фальшивий уряд у Центральному Сибіру розбито, і регіон перейшов до наших рук. Це велика перемога, але тепер постає питання, що робити з величезними новими землями.\n\nПоки що Центральний Сибір перейде під військову адміністрацію. У регіоні багато сил, ворожих нашим інтересам, і лише міцна військова влада розв'яже проблеми, перш ніж вони вийдуть з-під контролю. Кожен, хто досі сумнівається в даній Богом владі, навчиться поважати вищих - так чи інакше."

 CHT_revive_their_industry: "Відродити їхню промисловість"
 CHT_revive_their_industry_desc: "Завдяки вправності солдатів та винахідливості генералів промислове серце Росії в нашому розпорядженні. Колись пустельний регіон перетворив мертвий большевицький режим за так званим «Сибірським пляном», і Центральний Сибір став продуктивним хребтом усієї країни.\n\nНаше вторгнення завдало великої шкоди промисловим зонам, тож для продовження кампанії треба повернути підприємства до роботи. Надто довго ми задовольнялися мізерною промисловою базою Далекого Сходу. Нові завойовані землі - промисловий велетень, який лише чекає пробудження!"

 CHT_encourage_corporate_expansion: "Заохотити корпоративне розширення"
 CHT_encourage_corporate_expansion_desc: "Імператорські корпорації стали незамінним знаряддям економічного розвитку, але поки не користуються повною мірою новими землями Центрального Сибіру. Тут розташовані одні з найбільших промислових потужностей Росії, яким потрібна нова адміністрація для відновлення роботи.\n\nВлучні субсидії заохотять корпорації поширити діяльність на нові землі й використати їхню промислову базу на нашу користь. Напевне вони не заперечуватимуть?"

 CHT_absorb_their_strength: "Поглинути їхню силу"
 CHT_absorb_their_strength_desc: "Армії, що протистояли нашим могутнім силам у Центральному Сибіру, переможені, а сотні тисяч розформованих вояків повертаються додому. Та Білій армії потрібно якнайбільше солдатів, і попри минулу вірність багато цих людей можуть добре нам служити.\n\nТак само доступна велика кількість талановитих офіцерів. Дехто безперечно є зрадником і політично неприйнятний, але багатьох можна швидко перевиховати. Після суворої присяги вони нарешті служитимуть справі, гідній боротьби: нашій."

 CHT_old_dogs_new_tricks: "Старі пси, нові трюки"
 CHT_old_dogs_new_tricks_desc: "Кажуть, найкращих уроків війни навчають вороги. Після тяжкого завоювання Центрального Сибіру, попри перемогу, Білій армії показали її найбільші переваги й найпомітніші вади. Ми використаємо уроки кампанії, щоб виправити проблеми й краще підготуватися до майбутнього.\n\nБагато хто каже, що це неможливо, що старі білі на чолі армії застрягли в минулому. Вони справді старійшини іншої доби, але не гірше за інших здатні пристосувати стратегію до вимог майбутнього. І ми, і вони це доведемо."

 CHT_our_vengeance_is_near: "Наша помста близько"
 CHT_our_vengeance_is_near_desc: "Кінець уже видно. Зрадників держави виметено, промислову міць Центрального Сибіру приборкано, Біла армія готова продовжувати боротьбу. Після років пошуку підтримки визволення Росії входить у фінальний розділ.\n\nНесправедливість 1918 року невдовзі буде помщена. На заході чекає найбільший ворог, який так само готується до останнього конфлікту. Майбутня війна буде найтяжчою, та перемога принесе найбільшу нагороду: повне об'єднання Росії.\n\nХоробрі солдати Імперії, ваше найтяжче випробування близько. Здобувши перемогу, ви назавжди ввійдете до історії як найнеймовірніші переможці: ті, хто почав із нічого, здолав усе й зібрав цілу Росію під одним прапором!"

