 ### Decisions ###
 CHT_a_quiet_dinner_category: "Приготування до вечері"
 CHT_a_quiet_dinner_category_desc: "Що ближча дата неминучого протистояння між лоялістами царя та мілітаристами Шепунова, то дужче з кожним світанком зростає напруга. Попри всі наші спроби владнати стосунки й здійснити безкровний переворот, це, схоже, стало неможливим.\n\nМи повинні зробити все можливе, щоб, коли настане час, наш бік був якнайкраще готовий до сутички.\n\n§OВплив мілітаристів§!: [ROOT.GetCHT_military_influence]\n\n§MВплив лоялістів§!: [ROOT.GetCHT_civilian_influence]"
 CHT_initial_investments_category: "Розподіл бюджетних надлишків"
 CHT_initial_investments_category_desc: "Як засвідчили наші скарбники, торішній розподіл бюджету залишив нам надлишок коштів.\n\nЯкщо ми справді прагнемо об'єднати цю розрізнену країну в єдину Росію під владою царя, не можна скупитися на вкладення резервів у підвалини майбутньої Російської Імперії. Однак бюрократичний процес майже напевне затягне спрямування інвестицій до потрібних секторів, а щойно з'явиться нагода вдарити по ворогах, усе, що лишиться, неминуче піде на воєнні потреби.\n\nЯкщо ми хочемо використати ці кошти, зараз саме час."
 CHT_civilian_initial_investments: "Інвестувати в цивільну промисловість"
 CHT_military_initial_investments: "Інвестувати у військово-промисловий комплекс"

 CHT_unlock_militarist_decisions: "§OВідкрити рішення мілітаристів§!"
 CHT_disable_militarist_decisions: "§OВимкнути рішення мілітаристів§!"
 CHT_pro_military_decision_1: "§OЗалучити військових до будівництва фабрик§!"
 CHT_pro_military_decision_1_desc: "Одна з численних переваг великого й дуже активного війська - змога доручати йому завдання, зазвичай відведені цивільному сектору. Одне з таких завдань, будівництво фабрик задля швидкої індустріялізації, має першорядне значення для нашої нової адміністрації й мусить стати безумовним пріоритетом. Доручивши військовим зводити ці фабрики, ми забезпечимо швидку й ефективну індустріялізацію Східного Сибіру."
 CHT_pro_military_decision_2: "§OЗалучити військових до будівництва інфраструктури§!"
 CHT_pro_military_decision_2_desc: "Одна з численних переваг великого й дуже активного війська - змога доручати йому завдання, зазвичай відведені цивільному сектору. Одне з таких завдань, будівництво та розширення інфраструктури на всій нашій території, має неабияке значення, адже дасть змогу ефективніше перевозити як військових, так і цивільних по всій території держави [CHT.GetName]."
 CHT_pro_military_decision_3: "§OЗалучити військових до будівництва флоту§!"
 CHT_pro_military_decision_3_desc: "Одна з численних переваг великого й дуже активного війська - змога доручати йому завдання, зазвичай відведені цивільному сектору. Одне з таких завдань - створення сучасної та ефективної мережі верфей уздовж нашого східного узбережжя. Це надзвичайно важливо для постійного потоку імпорту й експорту та стане початком створення першого сучасного російського флоту."
 CHT_pro_military_decision_4: "§OЗалучити військових до видобутку ресурсів§!"
 CHT_pro_military_decision_4_desc: "Тепер, коли регіон убезпечено, час скористатися нашими ресурсами, щоб розвинути здобуте - а який ресурс для цього кращий за саме військо? Спрямувавши солдатів на вдосконалення чинних видобувних кампаній і будівництво нових родовищ, ми забезпечимо стабільне щоденне надходження нових ресурсів."
 CHT_pro_military_decision_5: "§OЗалучити військових до розчищення земель§!"
 CHT_pro_military_decision_5_desc: "Тепер, коли регіон убезпечено, час скористатися нашими ресурсами, щоб розвинути здобуте - а який ресурс для цього кращий за саме військо? Залучивши людські ресурси до розчищення непридатних земель - чи то сплюндрованих природою, чи війною - ми постійно збільшуватимемо площу, придатну для сільського господарства та індустріялізації."
 CHT_pro_military_decision_6: "§OЗалучити військових до будівництва укріплень§!"
 CHT_pro_military_decision_6_desc: "Тепер, коли регіон убезпечено, час скористатися нашими ресурсами, щоб розвинути здобуте - а який ресурс для цього кращий за саме військо? Розгорнувши війська для будівництва укріплень на краях нашої території, ми будемо готові, коли настане час рушати на захід."

