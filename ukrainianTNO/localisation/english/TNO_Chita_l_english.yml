 CHT_regional.51.t: "Приємна несподіванка"
 CHT_regional.51.desc: "Увійшовши з іншими делеґатами Імперії, Ніколай Коссов злегка вклонився японцям, які вже сиділи на своєму боці столу, й сів навпроти. Він не був дурнем і знав, хто від початку має перевагу; знали це й вони. Імператорські дипломати завжди скаржилися, що з японцями тяжко домовлятися навіть за найкращих умов.\n\nТа вони ще ніколи не домовлялися з Ніколаєм Коссовим. «Konnichiwa», - привітався він майже бездоганною японською, заскочивши їх зненацька. «Sa, hajimemashou ka», - майстерно продовжив: час починати. Японці зашепотілися, з подивом слухаючи майже бездоганну мову, поки він викладав умови економічної угоди.\n\nЗачаровані його знанням, вони виявилися поступливішими, ніж із попередніми перемовниками. Угода досі сприяла Японії, але умови стали справедливішими. У такі миті Коссов радів, що не припинив вправлятися після того, як наприкінці тридцятих уже добре опанував японську. Нині Японія могла бути найкращою надією сильної Росії."
 CHT_regional.51.a: "Можливо, є надія на мирне співжиття."

 CHT_regional.52.t: "Нове вбрання імператора"
 CHT_regional.52.desc: "Сьогодні Міхаїл мав відвідати державну зустріч з іноземними дипломатами, але досі не обрав убрання. На жаль, це помітили всі в Чіті й від самого пробудження царя засипали питаннями про гардероб. До суперечок долучилися навіть деякі ґенерали. Невже одяг справді такий важливий? Напруга від вибору паралізувала царя у спальні, а на ліжку лежали всі можливі строї.\n\nОдні ґенерали казали, що простий якісний костюм покаже сучасність і пасуватиме зустрічі. Інші наполягали, що вбрання має відображати царську велич, а простий костюм зробить його буденним і нудним. Міхаїлові це здавалося доволі точним описом царя, але його думку проіґнорували. Можливо, дружина знала б краще, та вона була за цілий світ звідси. На щастя, паралічу поклав край роздратований Шепунов: увірвався, вибрав доволі пишне вбрання, решту жбурнув у шафу, нагадав, що до зустрічі кілька годин, і грюкнув дверима, не давши відповісти.\n\nМіхаїл не міг обрати навіть власного вбрання, а мав правити всією Росією."
 CHT_regional.52.a: "А ви не пробували піти голим? Це їх заткне."

 CHT_regional.53.t: "Смерть чужинця"
 CHT_regional.53.desc: "Міхаїл тримав французьку газету, певно, ретельно цензуровану німецькими господарями. Перша шпальта рясніла політичним скандалом, який його майже не цікавив. Він не знав його учасників і був певен, що через ізоляцію в Чіті французькі події на нього не вплинуть.\n\nТа не заради першої шпальти помічник приніс газету. За кілька сторінок Міхаїл знайшов шукане. Навіть не статтю - простий запис у некрологах.\n\n«Феодор Александровіч. Народився: 22 грудня 1898 року. Помер: 30 листопада 1968 року». Далі був короткий абзац про велич його життя й тих, кого він залишив. Ось навіщо принесли газету. Дядько Феодор помер.\n\nМіхаїл дивився на запис і відчував далекий біль - водночас справжній і навмисне вигаданий. Він знов і знов повторював: «Дядько Феодор помер».\n\nБоже, мусив він визнати, йому було байдуже. Це усвідомлення боліло більше за саму смерть. Невже він так віддалився від родини, що смерть значила так мало? Так, близькими вони не були, але хіба родинна втрата не мала б хвилювати? Міхаїл думав, чи його власну смерть колись зустрінуть із таким самим запалом. Цар глянув у вікно на сніг, усіяний місячним світлом, що блідо лягало на його обличчя."
 CHT_regional.53.a: "Сьогодні тут, завтра нема."

 CHT_regional.54.t: "Бенкет"
 CHT_regional.54.desc: "Коли Князівство проголосили, більшість далекосхідців сприймала його як дивацтво: приречену спробу відновити російську монархію, останній подих дедалі меншої кліки зневірених старців.\n\nВони помилилися. Разом з імперськими оздобами до Сибіру повернулися й забави «шляхетних» родів - як-от бенкет, оголошений двома нащадками цих самих родин.\n\nНа нього прийшли дедалі численніші вершки чітинського суспільства. Захід проголосили вишуканою зустріччю на честь царя та розширення імперських земель. Та, як і безліч подій у старій Імперії, він швидко покотився вниз, щойно полилися вино й горілка.\n\nСпершу нащадки влаштовували досить невинні розваги: карти та інші азартні ігри з великими ставками. Що п'янішими ставали гості й вищими ставки, то запеклішими були змагання - з наслідками, про які потім не говорили в пристойному товаристві.\n\nДо кінця ночі кілька невеликих статків виграли й програли, репутації створили й заплямували, а вранці всі «поважні» гості й самі організатори погодилися: розважилися чудово.\n\nНарешті до Чіти повернулося справжнє «товариство»."
 CHT_regional.54.a: "Щодня дедалі більше схоже на стару Росію."

 CHT_regional.55.t: "Розрив поколінь"
 CHT_regional.55.desc: "«Ні, ні, ні. Так ми оголимо флянґи й дамо ворогові ідеальну нагоду оточити й розбити наші сили по частинах». Промовець був старий - сиве волосся й обвітрена шкіра не лишали сумнівів. Та очі були досі гострі: пронизливий погляд провів його від Сибірського льодового походу до відвоювання Далекого Сходу, а груди з нагородними стрічками засвідчували бойовий шлях.\n\n«А за вашим пляном ми весь наступний тиждень застрягнемо на цьому березі, шукаючи шлях через їхні лінії. З усією повагою, не можна марнувати ініціятиву; доведеться ризикнути... Пане». Молодший чоловік не мав ні старечих ознак, ні нагород, але мав такий самий пронизливий погляд. Війна дещо загартувала його запал, та не згасила молодого духу, якого бракувало старшому.\n\nВетеран ледь не поставив його на місце, нагадавши про старшинство й службу, але... зітхнув. Так не годиться. Жити йому лишилося недовго. Він не побачить повернення царів до Петрограда й не дізнається, що сталося з родинним домом на сході. Це завдання для молодших. Його ж обов'язок - приготувати їх до майбутнього тягаря, а значить і терпіти зухвальство. Та вискочень мав рацію: ризик необхідний. Гм, може, з віком він став надто обережним.\n\nУ думках він уже правив плян. «Ваше міркування слушне, полковнику. Внесемо зміни. Ви візьмете дві найкращі частини й спробуєте раптовим ударом захопити переправу, а решта з нас...»"
 CHT_regional.55.a: "Варта змінюється."

 #Superregional events
 CHT_superregional.1.t: "Новий уряд"
 CHT_superregional.1.desc: "«Ґенерале Волкоґонов. Я так розумію, ви хотіли мене бачити?»\n\n«Саме так. Сідайте, пане Собчак», - сказав Волкоґонов, указуючи на стілець навпроти. Гість одразу сів.\n\n«Перепрошую, пане Собчак, але перейду до суті. Формальності ніколи не були моєю сильною стороною. Я не маю наміру вічно тримати цей надзвичайний уряд. Тепер, коли курява вляглася, час почати перехід до цивільної адміністрації».\n\nСобчак підняв брову. «Розумію. І ви вважаєте мене найкращим кандидатом її очолити?»\n\n«Швидко схоплюєте. Саме так. Ви бездоганно служили мером Чіти й показали себе справжнім державником. Такі здібності знадобляться національному урядові. То що, Собчак, готові піднятися у світі?»\n\nНа обличчі Анатолія Собчака з'явилася усмішка. Він чекав на цю мить роками. «Із задоволенням»."
 CHT_superregional.1.a: "Виходить Анатолій Собчак, ліворуч сцени."

 CHT_superregional.2.t: "Наступне покоління"
 CHT_superregional.2.desc: "Полковник Абдулов майже втратив дар мови. Перед ним стояли десятки молодих офіцерів, чекаючи випуску й початку довгої служби Імперії. Не так давно він сам був на їхньому місці - одним із небагатьох молодих офіцерів, що пройшли суворий відбір Старих Білих.\n\nТепер Імперія вже не так перебирала молодими людьми для поповнення лав. Абдулова тішило, що більше здібних юнаків дістануть його колишній шанс. Ще одна присяга - й кожен учень стане офіцером.\n\n«Чи присягаєте понад усе служити інтересам Російської Імперії та її богообраного монарха, імператора Міхаїла II?»\n\n«Так, присягаю». Відповідь була гучна й завзята. Уперше Абдулов відчув, що присяга щира, а не проста формальність. Їх учили бачити в цареві живе втілення волі Росії, а не слабку маріонетку честолюбних кар'єристів.\n\nАбдулов усміхнувся. «Дуже добре. Пам'ятайте, сини мої: тепер ви офіцери Білої армії. Росія чекає від вас великих справ, не підведіть її. Вільні».\n\nЦеремонію завершив спільний вигук новобранців: «Боже, бережи царя!»"
 CHT_superregional.2.a: "Служити Росії."

 CHT_superregional.3.t: "Новини з Росії"
 CHT_superregional.3.desc: "Сьогодні з Державного департаменту надійшли обнадійливі новини. Царська фракція в Росії зі штабом у далекосхідній Чіті, як повідомляють, відходить від зв'язків зі Сферою й прагне зміцнити відносини зі Сполученими Штатами. Якщо це правда, у Росії може з'явитися перспективний союзник..."
 CHT_superregional.3.a: "Дуже добре."

 CHT_superregional.4.t: "Прощавай, Міхайлове"
 CHT_superregional.4.desc: "Іван Міхайлов, колишній міністр фінансів і чоловік, який урятував Імперію від її владолюбного війська, помер. Схоже, всі сили, віддані боротьбі з клікою ґенерала Шепунова, вичерпали його. Він мирно відійшов уві сні - зовсім не так, як за колишньої загрози прилюдної страти. За кілька днів у Чіті провели публічний похорон, на який прийшло майже все керівництво Імперії. Першим виступив цар Міхаїл II, який багато чим завдячував небіжчикові.\n\nМіхаїл нервово глянув на натовп. Не мав ні тексту, ні пляну промови - лише горе, що тяжіло над розумом.\n\n«Я недовго знав Міхайлова. Коли вперше прибув до Росії, гадав, що він такий самий, як інші: засліплений старий еміґрант, який хоче тримати мене під замком. Роками я не мав причин сумніватися - аж до одного доленосного дня в саду...» Голос царя зірвався, очі налилися тягарем, нижня губа затремтіла. «Ні, тримайся», - прошепотів він.\n\n«Того дня я зрозумів, що він не такий. Міхайлов дбав про мене й про Росію. Я стільком йому завдячую, що не можу висловити словами. Я...» Міхаїл стиснув зуби, відчуваючи сльози. «Без його допомоги я не став би тим царем, яким є нині. Ми всі мусимо пам'ятати його як... як...»\n\nВін більше не стримався. Міхаїл розридався перед усією Імперією. Охоронці повели його зі сцени, а місце посів наступний промовець."
 CHT_superregional.4.a: "Memento mori."

 CHT_superregional.5.t: "Не крутіть ручку"
 CHT_superregional.5.desc: "Сєрґєй Федоровіч стиха лаявся, оглядаючи радіоприймач. Тижнями він працював справно й лише тепер завередував. В один із рідкісних вихідних навіть музики не послухає безтурботного дня.\n\n«Шмат лайна!» - гаркнув він і вдарив по корпусу. Позаду відчинилися двері, й увійшла знайома жінка із сумкою продуктів, широко розплющивши очі.\n\n«Навіщо ти б'єш моє радіо, Сєрґєю? Воно образило твої почуття?»\n\n«Ні, Софіє, клята штука не працює...» Сєрґєй ще кілька разів ударив, і нарешті приймач заговорив. Він одразу впізнав ґенерала Дмітрія Волкоґонова, під яким служив у минулій кампанії.\n\n«...велика честь оголосити, що воєнний стан незабаром скінчиться. Разом зі здібними міністрами я працював над цивільним урядом і радий сказати, що мета стає дійсністю. Дорогі громадяни Імперії, обіцяю: відтепер Біла армія лише захищатиме народ, а не змушуватиме його коритися». Софія сіла поруч. Такої новини вони не чекали.\n\n«Анатолій Собчак, який відзначився як мер Чіти, стане новим прем'єр-міністром. Він допомагатиме імператорові в державних справах і разом із ним забезпечить...» Радіо раптом замовкло, обірвавши промову. Сєрґєй вилаявся, скочив і знову взявся бити несправну машину."
 CHT_superregional.5.a: "Швидкоплинний погляд на історію."

 CHT_superregional.6.t: "В'язень і реґент"
 CHT_superregional.6.desc: "Почувши кроки, Міхаїл підвівся з кам'яної койки в тісній камері. Коли між ґратами з'явився його новий «реґент» Шепунов, колишній цар випростався, не бажаючи дивитися знизу. Шепунов ледь кивнув, зрозумівши, хоча обличчя було похмуре.\n\nДовгу мить він просто дивився. «Ви справді гадали, що це спрацює, - тихо мовив без потреби грати роль, - еге ж?»\n\nМіхаїл не відвів погляду. «Я мусив щось зробити, Борісе. Не міг більше стояти осторонь». Він глянув на маленьке заґратоване вікно високо в стіні. «Насолоджуйтеся, доки можете, бо це не триватиме. Ви прирекли Росію».\n\nШепунов смикнув ротом і похитав головою. «Тут ви помиляєтеся. Я прирік лише вас, Міхаїле. Сємьонов мав лишити вас в Австралії. Ви ніколи не були здатні правити - ні садом там, ні містом тут, а тим паче всією Росією. Росії потрібні рішучі провідники, а єдиного разу, коли ви спробували ним стати, не змогли здолати навіть такого старого, як я». Не знаючи відповіді й ненавидячи себе за частку правди в цих словах, Міхаїл мовчки сів.\n\nЗгодом він холодно й твердо сказав: «Вітаю з перемогою, реґенте. А тепер лишіть мене».\n\nШепунов злегка вклонився. «Як бажаєте, пане Андрєєвічу». Він пішов, кроки стихли, важкі двері грюкнули.\n\nМіхаїл лишився в темряві, тужачи за минулим. Шепунов вийшов на світло й усміхнувся, дивлячись у майбутнє."
 CHT_superregional.6.a: "Немає нічого солодшого."

 CHT_superregional.7.t: "Чоботи на вулицях"
 CHT_superregional.7.desc: "Темне небо підказувало Сєрґєю: ще кілька годин - і можна скласти візок із городиною та йти додому. День був млявий, продав мало. Людей небагато, зате солдатів дивно багато.\n\nДуже, дуже багато.\n\nТроє раптом рушили до його візка. Сєрґєй випростався й нервово всміхнувся. Обличчя солдатів не змінилися. Попереду зупинився каштановолосий сержант.\n\n«Збирайся. Нова комендантська година - о восьмій». Двоє новобранців позаду ніяково переступили.\n\n«Але я сьогодні ще навіть витрат не відбив, пане!» - заперечив Сєрґєй, на мить забувши, що ці люди на найближчий час і є закон. «Та й про комендантську годину не оголошували».\n\nІнший солдат аґресивно ступив уперед і скинув капустину. «Він сказав збиратися». Сержант сердито глянув на підлеглого, підняв пошкоджену капусту, поклав назад і лишив кілька рублів.\n\n«Даруйте, але, будь ласка, йдіть додому».\n\nЗрозумівши, що легко відбувся, Сєрґєй зітхнув і почав складати товар, поки солдати рушили далі. Навіщо тепер комендантська година? Містечко тихе, злочинів мало. Що може бути таке небезпечне, що сюди ввели армію?"
 CHT_superregional.7.a: "Часи змінюються навіть для маленької людини."

 CHT_superregional.8.t: "Геть, геть, клята плямо"
 CHT_superregional.8.desc: "Утретє за десять хвилин вимивши руки, Дмітрій Волкоґонов знову втупився в дзеркало. Вигляд мав жахливий. Від перевороту й того страшного вибору не міг заснути, а на руках бачив лише кров загиблих. Хоч що робив, вона не змивалася.\n\nСтук у двері відірвав його від умивальника. Поправивши однострій і волосся, він відчинив. Та замість бажаного друга побачив живе нагадування про злочин - самого Боріса Шепунова.\n\nУсміхнувшись, реґент без запрошення ввійшов. «Знаєте, за всі роки знайомства я, здається, ніколи не бував у вашому домі. День усього першого».\n\nВолкоґонов силкувався триматися. «...І вас радий бачити, реґенте. Що привело до мого дому?»\n\n«Просто був поруч, - збрехав Шепунов, - і вирішив подякувати. Ви дуже допомогли мені, Дмітрію, у важливу мить. Я цього не забуду». Він поплескав того по плечу. «На вас чекають великі справи, друже. Дуже великі».\n\n«Дякую, пане». Волкоґонов не знав, що ще сказати. Що взагалі міг сказати.\n\nШепунов помітив і знизав плечима. «Гаразд, Дмітрію. Доброго вечора». Вони віддали честь, і реґент пішов.\n\nВолкоґонов повернувся до умивальника. Кров була досі там."
 CHT_superregional.8.a: "Вона досі не змивається."

 CHT_superregional.9.t: "Незавершені справи"
 CHT_superregional.9.desc: "Ховаючись у підвалі старої хатини, Павєл завмер від хрусту чобіт по снігу. Він саме хотів запалити єдину гасову лямпу, але швидко загасив вогник і притиснувся до стіни біля койки, на якій спав уже...\n\nЯк довго він тут? Після провалу лоялістів, що намагалися скинути Шепунова та кліку, він утік у село й відтоді сидів у підвалі. Без неба відмірювати час можна було лише голодом.\n\nЧоботи наближалися. Хруст снігу змінився скрипом дерева: вони ввійшли до хатини. Серце закалатало.\n\nЗа мить чоботи загриміли сходами, й Павєл зрозумів: усе скінчено. Хисткі двері розлетілися від удару, ліхтарі залили кімнату. Перш ніж він підняв руки, на нього накинулися. Удар у живіт забрав подих. Мішок на голові - зір. Сильні руки на плечах - волю.\n\nКоли Павєла витягли нагору й надвір, сонце на шкірі подарувало мить радости. Та коли його кинули у вантажівку, він знав, що дуже довго більше його не побачить. На нього чекала в'язниця."
 CHT_superregional.9.a: "Принаймні він устиг відчути сонце."

 CHT_superregional.10.t: "Порожня перемога"
 CHT_superregional.10.desc: "Дивне відчуття: Міхаїл водночас був в'язнем під охороною й поваленим монархом перед вигнанням. Коли його вели до літака в Австралію, в обличчя вдарив холодний сибірський вітер, до якого він звик за роки. Кайданки не давали затулитися.\n\nБіля трапа офіцер зупинився. «Пане Андрєєвічу, - почав він, дістав ключ і зняв кайданки, - маю повідомити: за умовами вигнання ви ніколи не можете ступити на землю Росії. Розумієте?»\n\nМіхаїл розтер зап'ястки й оглянув край, де так довго жив. «Так. Шкода, що все скінчилося так». Офіцер промовчав, а Міхаїл востаннє зітхнув і піднявся трапом.\n\nСівши біля вікна, колишній цар дивився, як літак здіймається, а земля, якою він бодай номінально правив, зникає під хмарами. Лише тоді повернулися думки. Мав би відчути полегшення, адже повертався туди, де завжди був його справжній дім. Натомість відчував лише розпач.\n\nЧи зробив він досить? Що буде з покинутою землею? Він намагався зробити Росію кращою, підтримати реформи й принести мир у змучений край. Та зрештою лишав її Шепунову - чоловікові, який знав лише війну. І нічого вже не міг змінити.\n\nЗітхнувши, Міхаїл знову глянув у вікно й скорився долі."
 CHT_superregional.10.a: "Прощавай, Міхаїле."

 CHT_superregional.11.t: "Жорстоке милосердя"
 CHT_superregional.11.desc: "Увійшовши до камери Івана Міхайлова, охоронець грюкнув у двері, й металевий звук розійшовся коридорами. «Прокидайся, старий! Час». Відповіді не було, в'язень нерухомо лежав.\n\nОхоронець схопив його за плече й сильно струснув. «Я сказав, час. Прокидайся!» Не дочекавшись реакції, торкнувся шиї. Вона була крижана.\n\nВін покликав допомогу, до камери ввійшов командир. «Що сталося?»\n\n«Пане, він... він мертвий».\n\n«Самогубство?»\n\n«Не знаю, пане. Тобто... не думаю».\n\nПокликали медика, але марно. Іван Міхайлов помер. Офіційний розтин визначив: колишньому міністрові фінансів просто вийшов час, він відійшов уві сні й уникнув приниження прилюдної страти."
 CHT_superregional.11.a: "Щасливий виродок..."

 CHT_superregional.12.t: "Злет дзайбацу"
 CHT_superregional.12.desc: "Проблема дзайбацу загострюється. Російські підприємці, великі й малі, вважають, що японські дзайбацу стають надто могутніми, швидко витісняють і поглинають місцеві підприємства та промисловість.\n\nРеґент Боріс Шепунов досі бачить користь у співпраці з Японією, але поділяє частину побоювань. Економісти помітили розширення дзайбацу й попереджають: якщо їхній вплив не стримати, невдовзі вони цілком контролюватимуть нашу економіку.\n\nНаслідки можуть бути катастрофічні, тож Шепунов думає відправити до Токіо делеґацію й переглянути економічну угоду.\n\nЗ іншого боку, деякі командири Білої армії вважають відносини з Японією надто важливими, щоб ризикувати. Перегляд може зіпсувати відносини з Токіо й скоротити життєво необхідний військовий імпорт.\n\nЗрештою реґент ухвалює рішення..."
 CHT_superregional.12.a: "Надто ризиковано. Поки лишимо їх у спокої."
 CHT_superregional.12.b: "Треба поговорити з японцями."

 CHT_superregional.13.t: "Новий цар"
 CHT_superregional.13.desc: "Князь Нікіта Романов приховував хвилювання, стоячи навколішки перед єпископом. Сьогодні його коронували на царя, і гордість переповнювала серце. Коли багато років тому він прибув до Чіти, то не уявляв, що колись заступить небожа. Обставини усунення Міхаїла досі тривожили, та старий князь не дозволить сумнівам зіпсувати мить.\n\nПовільно й обережно Нікіта взяв корону з рук єпископа й поклав на голову. Це була не корона давніх царів, але байдуже. Метали й коштовності можуть змінюватися, а дарована Богом влада, яку вони втілюють, вічна. Віднині він імператор.\n\nЄпископ продовжив: «Найбогобоязливіший, самодержавний і могутній володарю, Царю всея Руси, ця видима й відчутна окраса твоєї голови є красномовним символом того, що ти, як глава всього російського народу, невидимо коронований Царем царів Христом найщедрішим благословенням, бо Він дарує тобі повну владу над Своїм народом».\n\nЄпископ подав скіпетр і державу. Приймаючи їх і рушаючи до трону, Нікіта помітив у першому ряду собору Шепунова: примружені очі не кліпали. Князь придушив дрож. Чи військо поводитиметься з ним так само, як із небожем? Що буде, якщо він набридне Шепунову?\n\nВідповіді не було. Відкинувши думки, Нікіта тішився тим, що нині став новим обличчям російського монархізму. Росії як ніколи потрібен гідний цар, і він палко прагнув виконати цю роль."
 CHT_superregional.13.a: "Боже, бережи царя!"

 CHT_superregional.14.t: "Блудний син"
 CHT_superregional.14.desc: "«Любий батьку,\n\nНапевно, відтоді, як ви востаннє мали звістку особисто від мене, минула вічність. Даруйте, що не писав раніше, але не через брак старань. Останнім часом життя дуже ускладнилося, а викласти всю історію було б неймовірно тяжко. Пишу не лише через сплив часу, а й тому, що ви, мабуть, уже бачили новини й нічого не розумієте. Якщо ні, спробую пояснити.\n\nЯк ви знаєте, після служби в авіяції флоту я лишився в Австралії. Життя «на землі догори дриґом» було безтурботне, й ті дні згадую з теплотою. Та це не тривало. Кілька років тому впливові російські еміґранти в Харбіні запросили мене на бенкет на честь нашого роду. Слово за слово - й мене коронували Царем всея Руси в крижаній сибірській пустці.\n\nПопри щедру подобу доброї волі, старі білі хотіли лише використати мене як маріонетку для мрій про панування над Росією та її народом. Мене тримали в'язнем у власному домі, й ті дні стали найтемнішими в житті. Та попри безнадію я зрозумів: моя поява в Росії була знаком.\n\nХай за яких обставин народився, Романов не має боягузливо відступати, коли його богоустановлена держава потребує його найбільше. З допомогою однодумців я відібрав владу в продажних білих ґенералів і став царем, яким мені судилося бути. Розумію вашу тривогу, але знайте: я не обирав цієї долі, та будь проклята моя душа, якщо не використаю її якнайкраще. Я неодмінно відновлю честь нашої родини»."
 CHT_superregional.14.a: "«Підпис: Майкл Андрєєвіч»"

 CHT_superregional.15.t: "Новий шериф у місті"
 CHT_superregional.15.desc: "Боґдан любив обідати пополудні. Йому пощастило жити в одному з небагатьох російських міст, не перетворених на руїни. Воно було досить далеко від заходу й не боялося Люфтваффе; тут навіть були такі розкоші, як кав'ярні й справна каналізація.\n\nСаме кав'ярнею він зараз і насолоджувався. Кави не було, але власники діставали чай у китайських контрабандистів. І добре: Боґдан завжди любив чай і завдяки посаді в міністерстві міг його дозволити.\n\nНеуважно гортаючи газету, він думав про дивний день у міністерстві. В урядовому будинку лишився кістяк штату, а багато важливих урядовців незрозуміло куди зникли.\n\nБоґдан допив би чай і повернувся до праці, та почув брязкіт танкових гусениць по бруківці. Миттю скочив до вікна. Вулицею йшла колона танків, попереду солдати стукали в усі двері й заходили до кожної крамниці.\n\nБоґдан схопив портфель і кинувся до виходу, але всередину ввірвалися троє солдатів зі зброєю. Перш ніж хтось устиг заговорити, вони підняли мегафон.\n\n«Усі громадяни мусять повернутися додому...»"
 CHT_superregional.15.a: "«...У місті запроваджено воєнний стан»."

 CHT_superregional.16.t: "Доля ґенерала"
 CHT_superregional.16.desc: "«Іронічно, правда?»\n\nБоріс Шепунов підняв погляд із підлоги камери й побачив Міхаїла з ледь помітною усмішкою. «Що саме?» - спитав Боріс, надто втомлений, щоб шукати комізм.\n\n«Особисто для мене іронічно, що силовик, який нав'язав мені цю роль, через примху долі потрапив до в'язниці від руки людини, яку змусив стати провідником. Шекспірівська комедія, хіба ні? Чи, з вашого боку, трагедія».\n\nШепунов усміхнувся цареві, але зморшки виказували нещирість. «Це правда, Міхаїле. Наслідок комічний - і ще може таким бути, якщо ви правитимете так, як я думаю». Боріс коротко засміявся, тоді запала тиша.\n\n«То ви прийшли лише позловтішатися? Погрітися у славі, о великий і дивовижний царю?»\n\n«Насправді я прийшов сказати, що вас звільняють до маньчжурського Харбіна. Там ви, сподіваюся, проживете змістовніше життя. Але доки я живий, до Росії не повернетеся».\n\n«Мабуть, - сказав Боріс, - я мав би радіти, що ви мене не стратили. Та не радію».\n\nМіхаїл не відповів і просто пішов."
 CHT_superregional.16.a: "Хай знайде спокуту - у собі чи у своїх ділах."

 CHT_superregional.17.t: "Людина з пляном"
 CHT_superregional.17.desc: "«Мушу визнати, Волкоґонове, плян досить честолюбний», - сказав Міхаїл, читаючи й обмірковуючи можливості.\n\n«Так, Ваша Високосте, але це необхідно: військо надто довго страждало від політики. Буде важко, особливо через втрату кількох дуже корисних людей, та державі це дасть значно більше добра, ніж шкоди».\n\nМіхаїл погодився й повернувся до майбутнього прем'єра Думи. «Що скажете, пане Собчак?»\n\n«З усією повагою, - почав Собчак, посуваючи документи Волкоґонову, - я вірю, що плян спрацює, але не згоден із метою».\n\nМіхаїл підняв брову. «Продовжуйте, хочу почути причини».\n\n«Ваша Високосте, вірність армії і країні, і цареві дозволила таким, як Шепунов, ставити себе вище за належне нібито задля “захисту народу”. Надмірності треба стримати, та загалом армія має бути вірна цареві та його волі».\n\n«Нісенітниця, - голос Волкоґонова підвищився. - Шепунов мав вплив, бо користувався Його Високістю як символом, підміняв ним “націю” заради особистих інтересів. Ототожнивши царя й державу, ми не дамо цьому повторитися».\n\nСобчак засміявся. «Безглуздя, яка нісенітниця!»\n\n«То поясніть, пане Собчак, із насолодою послухаю!»\n\n«Годі! - крикнув Міхаїл і грюкнув долонями по столу. - Я цього не терпітиму. Собчак, ваші доводи вагомі, та мій досвід важить більше. Я цілковито підтримую Волкоґонова й очікую, що ви виконаєте плян. Зрозуміло?»\n\nСобчак кивнув. «Зрозуміло, Ваша Високосте»."
 CHT_superregional.17.a: "Армія вірна державі, а не ідеології."

 CHT_superregional.18.t: "Сибірське розлучення"
 CHT_superregional.18.desc: "Ваксберґ писав звіт, коли до кімнати вдерся блідий помічник. «Японці, - видихнув він, - вони телефонують!»\n\nВаксберґ скочив і наказав вести. У кабельній кімнаті молодий оператор тримав слухавку. Ваксберґ вихопив її: «Вітаю, Боріс Ваксберґ, голова відділу японських відносин Міністерства закордонних справ Російської Імперії. Хто це?»\n\n«А, так, Ота Дайсуке, Міністерство закордонних справ Японії. Дзвінок найвищої важливости».\n\nВід цих слів шкірою побігли мурашки. Опанувавшись, Ваксберґ спитав: «Що сталося, пане Дайсуке?»\n\n«У Токіо багатьом, зокрема мені, відомо про зміну влади в Сибіру. Ми хочемо знати, чи ваша країна виконуватиме попередні угоди».\n\nОсь чому вони дзвонили. Японців завжди цікавили гроші й ресурси - ще один ринок, ще одна сфера для прибутку. «Боюся, мушу повідомити Токіо: всі попередні обіцянки японцям, включно з боргами, віднині недійсні, бо їх дано без згоди царя Росії».\n\n«Розумію». Запала мовчанка, й у Ваксберґа затремтіли ноги. «Що ж, пане Ваксберґ, це справді прикро. Справді. У Токіо багато хто вважатиме це трагедією, а наслідки для вашої країни та її народу будуть тяжкими».\n\nЛінія обірвалася."
 CHT_superregional.18.a: "Погані обіцянки краще порушити, ніж виконати."

 CHT_superregional.19.t: "Такий уже капіталізм"
 CHT_superregional.19.desc: "Від самого відкриття крамниці в Красноярску Ґаліна була відданою покупчинею. Нею керувала дочірня компанія дзайбацу, тож там продавали японські товари, яких більше ніде в Сибіру не було. Щотижня вона оглядала нові надходження.\n\nА тепер крамниця раптом зникла. Мріючи, що побачить цього разу, Ґаліна нічого не помічала, аж доки не спробувала відчинити двері. Вони були замкнені, а за вікном робітники встановлювали нові вітрини. Вона постукала й покликала виконроба.\n\nТой підтвердив побоювання: крамниця й компанія зникли назавжди. Освічений чоловік терпляче пояснив, що нова політика царського уряду не дає дзайбацу змагатися з імператорськими корпораціями, зокрема з тією, що купила будівлю. Та нові власники, запевнив він із широкою усмішкою, продаватимуть такі самі товари й водночас зміцнюватимуть державу. Просто тепер їх вироблятимуть у Сибіру, а не в Японії.\n\nҐаліна слабо всміхнулася, подякувала й пішла. Стара крамниця не повернеться - це підтверджували й промови, й слова виконроба. Сибірські товари навряд чи будуть такі якісні й різноманітні, як японські. Але вона піде до нової крамниці, всміхнеться й щось купить.\n\nТреба показати підтримку ініціятиви. Та й хто знає? Може, деякі речі її здивують."
 CHT_superregional.19.a: "Капіталізм - знаряддя, як і будь-яке інше."

 CHT_superregional.20.t: "Не даючи смолоскипові згаснути"
 CHT_superregional.20.desc: "Через роки всі погодяться: таке важливе оголошення прозвучало напрочуд стримано й урочисто. Водночас воно цілком відповідало політичній вазі та значенню для держави.\n\nЦар Міхаїл у повних реґаліях і з давно відпрацьованою поставою говорив у камеру ясно й прямо. Його міністри, солдати, льотчики та інші державні службовці від його імени взяли під контроль майже всю властиву Росію. Перемогли фашистів, комуністів, бандитів та інших. Повернули безпеку мільйонам простих росіян.\n\nТож природно, що він офіційно заявив права на давно порожній імператорський престол, а його уряд - на спадкоємність і відродження Російської Імперії. Для багатьох підданих це здавалося майже формальністю. Міхаїла багато років називали царем, ще до перемоги над кліками білих офіцерів.\n\nТа політично, а надто на міжнародній арені, це було зовсім не так. Права заявлено, рукавичку кинуто. Лишилося побачити відповідь - або виклик - держав світу."
 CHT_superregional.20.a: "Хто може сумніватися в царських правах?"

 CHT_superregional.21.t: "Демократія для початківців"
 CHT_superregional.21.desc: "У їдальні царського палацу за столом сиділи троє наймогутніших людей країни. Це була не просто приємна трапеза, а нарада про майбутнє установ Імперії.\n\n«З усією повагою, царю Міхаїле, демократичні вибори треба провести негайно. Народ чекав досить, і я боюся нових протестів», - пояснив Волкоґонов із сумним, але рішучим обличчям. Він давно вирішив, що жорстокість, яку бачив під час попередніх заворушень, не буде марною.\n\nМіхаїл кивнув і повернувся до Собчака. «Маєте чим поділитися, Анатолію?» - спитав він, указуючи виделкою.\n\n«Авжеж, царю Міхаїле. Боюся, мушу цілком не погодитися з колеґою. Які можуть бути вибори без партій, політичних засобів інформації та навіть достатньої кількости кандидатів?» Собчак на мить замовк, усміхаючись лише устами. «Натомість потрібен цивільний тимчасовий уряд, який підготує народ до сучасної демократії та зміцнить демократичні установи. Звісно, остаточний вибір за вами, мій царю».\n\nВідклавши ніж і виделку, Міхаїл довго й ретельно думав. Зрештою він вирішив."
 CHT_superregional.21.a: "Тимчасовий уряд необхідний."

 CHT_superregional.22.t: "Пластир для робітника"
 CHT_superregional.22.desc: "Віктор саме допивав у барі третю чарку, коли на телевізорі з'явився цар. Крізь п'яну імлу він упізнав Міхаїла, який розповідав про права й захист, даровані робітникам Новосибірска. Коли цар викладав новий закон, Віктор гірко засміявся.\n\nЩе кілька годин тому він сам був робітником - сталеваром, як багато відвідувачів бару. Життя сталевара тяжке, особливо в Новосибірску. Довгі години біля горна наповнюють легені газами, що поволі забирають подих, а нещасні випадки небезпечно часті. Після десяти років на заводі Віктор знав це чудово.\n\nСаме це він сказав начальникові сьогодні в головній конторі. Він лишався біля горнів навіть коли війна на сході вимагала дедалі більше солдатів, і працював там, коли царські війська взяли Новосибірск. За все дістав нічого. Начальник повідомив, що горни вивозять на схід, а йому треба шукати нову працю.\n\nІ тепер цар мав нахабство казати, що визволив місто й хоче захистити робітників новим законом. Тими правами, які вже діяли до вторгнення імператорських солдатів.\n\nВіктор із гіркою усмішкою повернувся до чоловіка праворуч і підняв склянку."
 CHT_superregional.22.a: "«Боже, бережи царя, так?»"

 CHT_superregional.23.t: "Старі пси, нові трюки"
 CHT_superregional.23.desc: "Ґенерали майже разом бурчали, прибувши до військової академії в Чіті. Вони знали лише, що їх викликав прем'єр-міністр Шепунов. І цього було досить.\n\nУ будівлі їх повели до великої авдиторії, ще більше спантеличивши. Лише коли всі сіли й увійшов офіцер віком із їхніх онуків, усе стало зрозуміло.\n\nПрем'єр дуже цінує їхню вірність і працю задля влади держави й командування, сказав юнак, та попереду ще багато справ. Кампанії виграно всупереч їхнім стратеґіям і методам плянування, а не завдяки їм. Це можна й треба змінити. Він та наступні викладачі навчать їх нових, сучасних методів війни.\n\nҐенерали відповіли негайно й бурхливо. Вони командували людьми ще до його народження, билися від падіння старої Імперії, а їхні знання заповнюють томи військових праць. Їм не потрібне додаткове навчання від надто молодих офіцерів, які не знають і не шанують старших.\n\nМолодий офіцер чемно вислухав усі доводи й відповів: прем'єр-міністр Шепунов не згоден.\n\nТож ґенерали сиділи, слухали й із часом училися."
 CHT_superregional.23.a: "Із часом вони зрозуміють."

 CHT_superregional.24.t: "Свинцеві дощі"
 CHT_superregional.24.desc: "Для Всєволода час наче зупинився. Кожна порошинка уламків зависла в повітрі, кожне заплакане обличчя застигло світлиною, літаки в небі стали чорними рисками. Навколо розсипався будинок, кожен уламок - зубчаста деталь головоломки. Він простягнув руку, ніби міг скласти їх назад і все виправити, та знову впав.\n\nВсєволод не розумів. Останні тридцять секунд були плямами жовтого, сірого, червоного й чорного. Не було часу збагнути.\n\nСпогади спалахували швидше за думку. Імператорські солдати при вході до містечка. Схвильовані. Кричать. У руках плякати. Новий спалах. Біженці входять до міста.\n\nВсєволод спантеличено насупився.\n\nНе біженці - солдати. Солдати, що тікають від Імператорської армії. Війна скінчилася. Вони повстанці. Старійшини їх не хотіли. Суперечки.\n\nРозбираючи спогади, він відчув холод у всьому тілі. Відчув страх. Чому?\n\nЩе спалах. Знову імператорські солдати. Погрози. Вони йдуть. Над головою вереск бомбардувальників.\n\nСльоза скотилася щокою. Йому боляче? Він потягнувся до руки. Там нічого. Зір згасав, не лишалося сили боятися. Не лишалося сили думати. Тиша."
 CHT_superregional.24.a: "Непочута трагедія."

 CHT_superregional.25.t: "Назад до праці"
 CHT_superregional.25.desc: "Довідавшись, що повернеться на завод, Фьодор неабияк зрадів. Радість не зникла, але значно пригасла.\n\nЯк один із багатьох біженців у Новосибірску, він місяцями шукав працю й через це не помічав темних хмар на обрії. Коли почалася війна із царським режимом, він навіть зрадів: війна означає більше виробництва, а воно - більше роботи.\n\nРадість зникла, коли царські війська перетворили його завод і весь промисловий район на поле бою. Після падіння уряду він знову став безробітним і перебивався як міг. А сьогодні йому сказали, що навички знову потрібні на тому самому заводі. Навіть дадуть транспорт.\n\nВін не зрозумів значення військової вантажівки. Прибувши, упізнав завод із поспіхом залатаними стінами й дахом, більші машини швидко вивантажували обладнання та верстати. Біля входу вишикувалися царські солдати, слухаючи офіцера.\n\nНевдовзі пояснили й робітникам. Вони працюватимуть, але під пильним наглядом. В інших місцях уже стався саботаж, а держава потребує промислової сили Центрального Сибіру й ніде такого не терпітиме.\n\nФьодора це влаштовувало. Він просто хотів працювати. Для колишнього режиму Новосибірска чи для царистів - байдуже. Тож кивнув, узяв інструменти й пішов за іншими до свого місця."
 CHT_superregional.25.a: "Виробництво зростає."

 CHT_superregional.26.t: "Викапаний"
 CHT_superregional.26.desc: "Міхаїл II, Імператор всієї Росії, мовчки дивився на власну статую. Велична, у стилі старих імператорських пам'ятників: він верхи на великому бойовому коні. Байдуже, що не їздив верхи від юнацьких днів у Фроґмор-котеджі у Віндзорі. Зате в Сіднеї коней було вдосталь: із піною на губах вони мчали іподромом Роял-Рендвік на радість чи розпач гравців. Він сумував за тими днями.\n\n«Ваша Величносте, - стривожено сказав головний скульптор, - статуя вас не задовольняє?»\n\n«Ні, - збрехав імператор, не бажаючи змушувати все переробляти. - Це чудова робота».\n\nНасправді турбувало обличчя. Тут скульптори явно дозволили собі вільність. Залисини не було, характерно кущаві брови стали рівними й охайними. Гірше того, йому додали величезні владні вуса в стилі дооктябрьської царської родини. Образ був улесливий, та робив його несправжнім, наче він лише грав імператора, а справжнім був величний вершник.\n\nТоді він зрозумів: статуя схожа не на нього, а на діда, великого князя Александра Міхайловіча. Старого він не згадував роками. У тринадцять його привезли до Франції востаннє побачити виснаженого раком діда на смертному ложі. Кістлявий князь схопив його руки й змусив пообіцяти ніколи не забувати обов'язку перед родиною та Росією. Тоді це лише налякало, але тепер він замислився над дідовими словами.\n\nЦар знову повернувся до головного скульптора. Рішення було ухвалене."
 CHT_superregional.26.a: "Хоча, знаєте, кілька змін таки можна внести."

 CHT_superregional.27.t: "Протеже"
 CHT_superregional.27.desc: "Самотній чоловік підійшов до Боріса Шепунова в залі Імператорського палацу й привернув увагу чітким салютом. Упізнавши його, Шепунов широко всміхнувся, а очі засяяли. «А! Віссаріоне! Віссаріоне Мустафін! Радий, що ви нарешті тут».\n\nОпустивши руку, Віссаріон серйозно кивнув. «Так. Ми давно не говорили наодинці, правда?»\n\n«Надто давно!» Шепунов поплескав його по спині, і вони разом рушили коридором. «Ви дуже виросли, відколи багато років тому в Харбіні я взяв вас під крило. Завжди знав, що з вас буде здібний ґенерал».\n\nВіссаріон насупився. «Дякую, але ви певно покликали мене не лише заради цього».\n\nШепунов помовчав і майже неохоче сказав: «Так. Віссаріоне, відверто: якби ви могли щось змінити в моєму уряді, що саме?»\n\nВіссаріон ледве приховав подив. Старий передумав? «Що завгодно? - задумався він. - Я б зменшив військову присутність на вулицях і послабив обмеження на незгоду. Не так далеко, як хотів Міхайлов, але трохи».\n\n«Розумію, - відповів Шепунов, оцінюючи протеже. - Дякую за пораду, Віссаріоне. Я подумаю».\n\nКоли Шепунов пішов далі сам, Віссаріон полегшено зітхнув. Це було «ні», але не «ніколи»."
 CHT_superregional.27.a: "Побачимо, що принесе майбутнє."

 CHT_superregional.28.t: "Лояліст"
 CHT_superregional.28.desc: "Щойно у двері постукали, Боріс Шепунов зрозумів, хто це. «Заходьте, Коссове». Двері зарипіли, й увійшов Ніколай Коссов у повному однострої - давній підлеглий і союзник Шепунова.\n\n«Пане, - почав Коссов, швидко віддавши честь. - Я повернувся з останньої зустрічі з японцями. Вам буде приємно знати, що переговори пройшли добре».\n\nКоссов умів переконувати, коли хотів, і Шепунов знав це з власного досвіду. «Так, радий чути. Але маю питання, Коссове. Ви справді вважаєте мудрим лишатися так тісно пов'язаними з японцями?»\n\n«Без сумніву. Ба більше, зв'язок треба поглибити, - без вагань відповів Коссов. - Вони були нашими найбільшими союзниками в громадянській війні, у Харбіні й навіть тепер. Віддячити їм - в інтересах Росії».\n\nКивнувши, Шепунов відпустив його помахом руки. «Розумію. Уважно обміркую пораду. А тепер поверніться на пост»."
 CHT_superregional.28.a: "Сонце, що сходить, осяває світ."

