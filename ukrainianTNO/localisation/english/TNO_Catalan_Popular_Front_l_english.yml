#Ministers
CNT_Catalonian_Council:0 "Catalonian People's Army Committee"
POLITICS_CNT_Catalonian_Council_DESC:0 "Fiercely independent and proud of their regional history and identity, the people of Catalonia have labored now for decades under the firm rule of the Francoists and their belief in a greater Spanish nation. During the Spanish Civil War, Catalonia liberated itself even from the influence of the Second Republic, with an alliance of anarchists and trade unionists assuming control over its economy and military.\n\nNow, some 30 years later, a familiar scene seems set to unfold, as various left-wing radical groups have joined together to form the Catalonian People's Army, a militant entity determined to topple the Caudillos' tyranny, first in Catalonia, then, perhaps, all of Iberia.\n\nComprising communists of the PSUC, the Spanish Communist Party's regional affiliate, Catalan autonomists of the PSAN, and the anarcho-syndicalist CNT, veterans of the previous war, the collective membership of the CPA's central committee certainly expects to amass a wide base of support from residents of the province unwilling to go on as subjects of the Union. It remains to be seen whether this venture will outlive their predecessors' attempts at revolutionary rule."

CNT_Gregorio_Lopez:0 "Gregorio López Raimundo"
CNT_Gregorio_Lopez_hog_desc:0 "§YSecretary of Organization of the EPC\nCommunism§!\n--------------\n§LOne would expect that a lifelong revolutionary leader and a veteran of the proletarian struggle in Iberia would be a hard-bitten radical after so much struggle and sacrifice. However, Gregorio López Raimundo, general secretary of the PSUC and thus secretary of the Catalonian revolutionary committee, is anything but.\nReturning to Iberia clandestinely after some years of exile following the Civil War, Raimundo kept a low profile as a teacher and wrote a doctorate in history. His academic work allowed him access to the Crown Archive in Aragón, where he was able to build up a network of contacts and resurrect the party structure inside Iberia. As general secretary since 1965, the affable Raimundo steered the party in a direction not unlike that of his Spanish ally, Santiago Carrillo, and was a proponent of relative moderation and willingness to compromise. This cost him the support of many of the PSUC's hardliners, but he stayed the course, pursuing a policy of compromise with intra-party opposition over denunciations and expulsions.\nAfter Catalonian independence, Raimundo continued heading the newly-legalised PSUC. Maintaining his preference for compromise, he was highly reluctant to support the People's Army, only turning against the republic after seeing its inability to bring the war and the suffering it had brought to an end. Now, in his leading position, Raimundo will attempt to make sure that the revolution he is fighting for will bring true liberty and peace to all.§!"

CNT_Salvador_Casanova:"Salvador Casanova i Grané"
CNT_Salvador_Casanova_for_desc:"§YSecretary of Foreign Affairs\nLeft-Wing Nationalism§!\n--------------\n§LDespite his working-class background, Salvador Casanova i Grané's political trajectory is quite different from that of most members of the Catalonian Revolutionary Committee. After a career in a workshop, Casanova studied history and came into contact with Catalan cultural activists, affiliating with the Catholic anti-Francoist movement Crist Catalunya. As a member of the nationalist Catholic opposition, he was a founding member of the National Front of Catalonia in the late 1960s.\nHowever, Casanova's progressive inclinations always put him at odds with his more conservative and moderate peers in the Catholic opposition. He migrated within the National Front, leveraging his connections in an attempt to find a place where he would be able to act according to his convictions. Failing to find one, the increasingly radical Casanova joined with a group of likeminded young students in splitting from the Front and establishing the Socialist Party of National Liberation, or PSAN.\nThe PSAN's strong fourth-worldist bent served Casanova well after the Catalan Revolution. His connections with national liberation movements the world over, from Northern Catalonia and other parts of Iberia all the way to Africa, and Latin America, catapulted him into prominence after the first revolutionary congress. Now, as de-facto foreign minister of the Revolutionary Committee, he will leave no stone unturned in the struggle for national and social liberation - nowhere in the world.§!"

CNT_Germinal_Esgleas:0 "Germinal Esgleas"
CNT_Germinal_Esgleas_eco_desc:0 "§YSecretary of Economic Affairs\nAnarcho-Socialism§!\n--------------\n§LFew movements of the Iberian left have achieved as much notoriety as the CNT, and Germinal Esgleas is perhaps the perfect representation of the organization's dauntless fighting spirit. Elected as a trade union secretary at the age of 17, Esgleas would be repeatedly arrested and imprisoned even before the rise of the Second Republic, organizing rallies and working-class education in his periods of open activity.\nDuring the Civil War, Esgleas served as the CNT's representative to the economic department of the Catalan Generalitat before escaping to France after the Republic's collapse. There, he would consolidate the exiled members of the union into a coherent group, pursuing a hard line in regards to cooperation with liberal opposition groups and the possibility of establishing a political party in addition to the union. His rock-solid insistence on his views has led to numerous defections and splits, but he has managed to steer the organization's core through the years of exile and dictatorship, despite allegations of authoritarianism and immobilism.\nAfter the Union's collapse, Esgleas has returned to Iberia. As leader of the powerfully symbolic CNT, he was joined to the new revolutionary committee, and as a symbol of revolutionary continuity, is once more responsible for the committee's economic policy. Despite his occasional clashes with his comrades, his skill and dedication are undeniable, and he is unwilling to lose again.§!"

CNT_Josep_Asens:0 "Josep Asens Giol"
CNT_Josep_Asens_sec_desc:0 "§YSecretary of Military Affairs\nAnarcho-Socialism§!\n--------------\n§LAlready in the first chaotic days of the Civil War, Josep Asens Giol helped form the Control Patrols, bands of militias which helped the Republican government hunt down counterrevolutionary elements in Catalonia and secure its rear. Later in the war, he was involved in political negotiations with the Catalan Generalitat to secure the CNT's place in Catalan politics and was the union's representative in the Committee of Anti-Fascist Militias of Catalonia. \nAfter the Civil War, the exiled Giol was part of the central committee of the Libertarian Movement, an anti-Francoist underground umbrella group of the Libertarian left. As opposed to the harder line followed by the exiled CNT leadership, Giol believed that a broad front of allies, including other socialists and even liberals, was necessary in the struggle against Franco, and was open to the idea of transforming the CNT into a "proper" political movement. These "possibilist" positions earned him the ire of many of the union's more radical members, but he has managed to remain popular and useful enough to avoid being expelled. \nNow back in Catalonia, the venerable Giol has been given a task fitting to his experience in the Civil War: He has been charged with commanding the various militias that make up the People's Army - his tendency towards compromise will be tested as he is thrown into the fierce debate on whether to keep the revolutionary militias or attempt to integrate them into an organized military.§!"

