#Ministers
CNT_Catalonian_Council:0 "Комітет Каталонської народної армії"
POLITICS_CNT_Catalonian_Council_DESC:0 "Люди Каталонії, палко незалежні та горді своєю регіональною історією й ідентичністю, вже десятиліттями живуть під жорстким правлінням франкістів та їхньою вірою у велику іспанську націю. Під час громадянської війни в Іспанії Каталонія звільнилася навіть від впливу Другої республіки, коли альянс анархістів і профспілковців узяв під контроль її економіку та військо.\n\nТепер, близько 30 років потому, схоже, має розігратися знайомий сценарій, оскільки різні радикальні ліві угруповання об'єдналися для створення Каталонської народної армії — войовничого утворення, рішуче налаштованого повалити тиранію каудильйо, спершу в Каталонії, а потім, можливо, й на всьому Піренейському півострові.\n\nДо складу колективного членства центрального комітету КПА входять комуністи з ОСКП, регіонального осередку Іспанської комуністичної партії, каталонські автономісти з ППНВ та анархо-синдикалістська НКП — ветерани попередньої війни. Безперечно, вони розраховують здобути широку підтримку серед мешканців провінції, які більше не бажають залишатися підданими Союзу. Ще належить побачити, чи переживе ця справа спроби революційного правління своїх попередників."

CNT_Gregorio_Lopez:0 "Ґреґоріо Лопес Раймундо"
CNT_Gregorio_Lopez_hog_desc:0 "§YСекретар з організаційних питань КПК\nКомунізм§!\n--------------\n§LМожна було б очікувати, що довічний революційний лідер і ветеран пролетарської боротьби на Піренейському півострові після стількох років боротьби та жертв став би загартованим радикалом. Однак Ґреґоріо Лопес Раймундо, генеральний секретар ОСКП і, відповідно, секретар каталонського революційного комітету, зовсім не такий.\nПовернувшись на Піренейський півострів нелегально після кількох років вигнання після громадянської війни, Раймундо тримався в тіні, працюючи вчителем, і написав докторську дисертацію з історії. Його академічна робота дала йому доступ до Королівського архіву в Арагоні, де він зміг створити мережу контактів і відновити партійну структуру всередині Піренейського півострова. Будучи генеральним секретарем із 1965 року, привітний Раймундо повів партію в напрямку, не надто відмінному від курсу його іспанського союзника Сантьяґо Каррільйо, ставши прихильником відносної поміркованости та готовности до компромісів. Це коштувало йому підтримки багатьох прихильників жорсткої лінії в ОСКП, але він не відступив від свого курсу, проводячи політику компромісу з внутрішньопартійною опозицією замість доносів та виключень.\nПісля незалежности Каталонії Раймундо продовжив очолювати новолегалізовану ОСКП. Зберігаючи свою прихильність до компромісів, він украй неохоче підтримував Народну армію, лише виступивши проти республіки після того, як побачив її нездатність покласти край війні та стражданням, які вона принесла. Тепер, обіймаючи керівну посаду, Раймундо спробує переконатися, що революція, за яку він бореться, принесе справжню свободу та мир усім.§!"

CNT_Salvador_Casanova:"Сальвадор Касанова-і-Ґране"
CNT_Salvador_Casanova_for_desc:"§YСекретар закордонних справ\nЛівий націоналізм§!\n--------------\n§LПопри своє робітниче походження, політичний шлях Сальвадора Касанови-і-Ґране суттєво відрізняється від шляху більшості членів Каталонського революційного комітету. Після роботи в майстерні Касанова вивчав історію та познайомився з каталонськими культурними активістами, приєднавшись до католицького антифранкістського руху «Кріст Каталунья». Як член націоналістичної католицької опозиції, він був одним із засновників Національного фронту Каталонії наприкінці 1960-х років.\nОднак прогресивні погляди Касанови завжди ставили його в конфлікт із більш консервативними та поміркованими колегами по католицькій опозиції. Він переміщувався всередині Національного фронту, використовуючи свої зв'язки в спробі знайти місце, де міг би діяти відповідно до своїх переконань. Не знайшовши такого місця, дедалі радикальніший Касанова разом із групою однодумців-молодих студентів відокремився від Фронту та заснував Соціялістичну партію національного визволення, або ППНВ.\nСильний четвертосвітницький ухил ППНВ добре послужив Касанові після Каталонської революції. Його зв'язки з національно-визвольними рухами по всьому світу — від Північної Каталонії та інших частин Піренейського півострова аж до Африки та Латинської Америки — вивели його на провідні позиції після першого революційного конгресу. Тепер, як фактичний міністр закордонних справ Революційного комітету, він не залишить каменя на камені в боротьбі за національне та соціальне визволення — ніде у світі.§!"

CNT_Germinal_Esgleas:0 "Жерміналь Есґлеас"
CNT_Germinal_Esgleas_eco_desc:0 "§YСекретар економічних питань\nАнархо-соціялізм§!\n--------------\n§LНебагато рухів іберійських лівих здобули таку ж відомість, як НКП, і Жерміналь Есґлеас, мабуть, є ідеальним уособленням невтомного бойового духу організації. Обраний секретарем профспілки у віці 17 років, Есґлеаса неодноразово заарештовували та ув'язнювали ще до виникнення Другої республіки, коли він організовував мітинги та робітничу освіту в періоди відкритої діяльности.\nПід час громадянської війни Есґлеас був представником НКП в економічному департаменті каталонського Женералітату, перш ніж після краху республіки втекти до Франції. Там він об'єднав вигнаних членів профспілки в згуртовану групу, дотримуючись жорсткої лінії щодо співпраці з ліберальними опозиційними групами та можливости створення політичної партії на додаток до профспілки. Його непохитна наполегливість у своїх поглядах призвела до численних відколів і розколів, але йому вдалося провести ядро організації через роки вигнання та диктатури, попри звинувачення в авторитаризмі та застої.\nПісля розпаду Союзу Есґлеас повернувся на Піренейський півострів. Як лідер надзвичайно символічної НКП, він приєднався до нового революційного комітету і, як символ революційної спадкоємности, знову відповідає за економічну політику комітету. Попри періодичні конфлікти з товаришами, його майстерність і відданість беззаперечні, і цього разу він не бажає програти.§!"

CNT_Josep_Asens:0 "Жозеп Асенс Жіоль"
CNT_Josep_Asens_sec_desc:0 "§YСекретар військових справ\nАнархо-соціялізм§!\n--------------\n§LЩе в перші хаотичні дні громадянської війни Жозеп Асенс Жіоль допоміг сформувати Контрольні патрулі — загони міліції, які допомагали республіканському уряду полювати на контрреволюційні елементи в Каталонії та забезпечувати безпеку в тилу. Пізніше під час війни він брав участь у політичних переговорах із каталонським Женералітатом, щоб забезпечити НКП місце в каталонській політиці, і був представником профспілки в Комітеті антифашистських міліцій Каталонії. \nПісля громадянської війни вигнаний Жіоль був членом центрального комітету Лібертарного руху — підпільної антифранкістської організації, що об'єднувала лібертарні ліві сили. На відміну від жорсткішої лінії, якої дотримувалося керівництво НКП у вигнанні, Жіоль вважав, що для боротьби проти Франко необхідний широкий фронт союзників, включно з іншими соціялістами й навіть лібералами, та прихильно ставився до ідеї перетворення НКП на «справжній» політичний рух. Ці «посибілістські» позиції викликали гнів багатьох радикальніших членів профспілки, але він зумів залишатися достатньо популярним і корисним, щоб уникнути виключення. \nТепер, повернувшись до Каталонії, шанований Жіоль отримав завдання, що відповідає його досвіду громадянської війни: йому доручено командувати різноманітними загонами міліції, що складають Народну армію. Його схильність до компромісів буде випробувана, коли він опиниться втягнутим у запеклу суперечку щодо того, чи зберегти революційні загони міліції, чи спробувати інтегрувати їх до організованого війська.§!"

