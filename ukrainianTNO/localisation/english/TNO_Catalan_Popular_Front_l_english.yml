CNT_an_army_fit_for_the_revolution:0 "Десять тисяч рук..."
CNT_an_army_fit_for_the_revolution_desc:0 ""Солдати також страйкуватимуть; вони вийдуть зі строю й більше не воюватимуть."\n\nЩо ж, зрештою ми сподіваємося, що вони вийдуть зі строю та битимуться на нашому боці. А доти нам доведеться створити власну армію; і діяти треба швидко; долю Революції та Піренейського півострова не можна залишати на волю випадку. Спершу ми маємо спрямувати більше ресурсів, чи то коштів, чи то спорядження, до армії та прищепити революційні переконання її лавам. Також слід приділити увагу нашим загонам міліції, які служитимуть основою нашої армії, доки їх не зможуть замінити професійніші сили. Незалежно від того, хто складатиме армію, єдиний шлях до визволення — солідарність, тож підіймайтеся, товариші!""

CNT_revolutionary_catalonia_reborn:0 "Відроджена революційна Каталонія"
CNT_revolutionary_catalonia_reborn_tt:0 "§VÉs la lluita final, unim-nos i demà la internacional serà el gènere humà.§!"
CNT_revolutionary_catalonia_reborn_desc:0 "Коли Барселона впала в 1939 році під натиском націоналістів, ми опинилися в бігах — спершу з Іспанії, а потім, на жаль, із думок чоловіків і жінок Каталонії.\n\nНавіть після виходу Каталонії із Союзу нам довелося продовжувати ховатися від "поміркованих", які виявилися не ким іншим, як умиротворювачами! Лише вчора тріумвірат КПА повстав проти поміркованих, щоб творити наше власне майбутнє — серед них були найстарші з трьох, ОСКП, каталонський відповідник КПІ, за ним ППНВ — популярна серед студентів Каталонії, — а також НКП, яка повернулася з вигнання.\n\nХоча так звана Республіка Каталонія може не надати нам місця, необхідного для побудови Каталонії нашої мрії, ми цілком здатні побудувати її самі."

CNT_the_peoples_war:0 "...І мільйон облич"
CNT_the_peoples_war_desc:0 "Військо революційної адміністрації ледве можна назвати військом. Це не є докором йому, адже воно не служить Державі й не прагне отримувати чи здійснювати повноваження судді, присяжного та ката. Однак цей імпульс існує, і його, як і багато інших, необхідно постійно стримувати. Найкращий спосіб досягти цього — ніколи не дозволяти людям, схильним до такої поведінки, служити в наших арміях; наші офіцери, солдати та всі, хто воює під нашим прапором, повинні поділяти ідеали Анархізму та визволення всіх людей.\n\nТі, хто веде наші сили, мають походити з цих самих сил. Демократія не припиняється, коли людина бере гвинтівку, щоб захищати свою свободу, — наші солдати обиратимуть своїх офіцерів. Вони не будуть безмовними тваринами без гідности, їх ніколи не піддаватимуть приниженню, щоб приховати провали їхніх начальників."

CNT_an_army_of_militias:0 "Ганчір'я та гвинтівки"
CNT_an_army_of_militias_desc:0 "Нашою головною силою на полі бою є хоробра, віддана колона; робітники та селяни, які взяли до рук зброю й раз у раз відбивали фашистських окупантів, які вирушають на поле бою з непридатними гвинтівками та творять дива з кошмарів. Їхня тактика насамперед спирається на здатність швидко організовуватися, часто в тилу ворога, а також забезпечувати негайні проривні загони, коли такі маневри вдаються. Саме такі маневри не дозволили Республіці негайно впасти через військові заколоти та гарантували, що фашистський режим завжди залишатиметься насторожі. Тепер вони нарешті принесуть Анархізм до Іспанії."

CNT_a_cohesive_army_for_an_uncohesive_movement:0 "Зшити воєдино"
CNT_a_cohesive_army_for_an_uncohesive_movement_desc:0 "Багато років наші вірні бійці боролися та гинули в найтяжчих умовах, а клітинні структури, в яких вони були організовані, працювали настільки добре, наскільки могли. Тепер це більше не так, і ми не можемо керувати армією так само, як повстанським рухом.\n\nМи повинні стандартизувати наші формування, забезпечити якомога більше підготовки та розвитку командних навичок офіцерів і запровадити загальну дисципліну. Таким чином, після остаточної перемоги ми матимемо значно спроможніші сили."

CNT_organize_the_armies:0 "Структурувати армії"
CNT_organize_the_armies_desc:0 "Невід'ємною частиною будь-якого успішного ведення війни є організація, особливо постачання. Незліченні кампанії стали жертвами проблем, спричинених перерваним постачанням та організаційною недисциплінованістю. Наші власні сили постраждали від цього в першій битві з фашистами. Ми не змогли розвинути перемоги, повернути ініціативу після поразок і перегрупуватися після відступів. Ми не припустимося тієї самої помилки двічі.\n\nДива сучасних технологій дозволяють нашим силам спілкуватися між собою та визначати напрямки для удару. Можливо, ми нарешті зможемо подолати анархістську помилку невзаємодії та об'єднати колективні зусилля заради перемоги."

CNT_a_newborn_military_democratic_system:0 "Окопна демократія"
CNT_a_newborn_military_democratic_system_desc:0 "Невід'ємною частиною самої ідеї революції є демократія. Надто довго незліченні інституції були відокремлені від голосу народу й передані до рук експлуататорів, які присипляють робітників мізерними подачками, забираючи собі прибутки. Квінтесенційним прикладом цієї експлуатації є військо. Людей кидають у підземелля, принижують, б'ють і знущаються з них начальники, які потім відправляють їх на холодне багнисте поле бою, тоді як самі сидять у штабних наметах, п'ють каву та базікають.\n\nЦю несправедливість буде виправлено справжньою демократією; солдати будуть офіцерами, а їхні товариші обиратимуть їх за хоробрість і лідерські здібності, а не заможні офіцерські школи."

CNT_following_psucs_wisdom:0 "...Під єдиною ниткою"
CNT_following_psucs_wisdom_desc:0 "Наші сили, стверджує Об'єднана соціялістична партія Каталонії (ОСКП), неорганізовані, розхристані та нефункціональні. Офіцери, обрані солдатами, у кращому випадку не здатні стримувати їхні найгірші прояви, а в гіршому — просто не мають жодної влади над підлеглими, щоб узагалі чогось досягти. Вони не здатні співпрацювати один з одним, часто дозволяючи дріб'язковим образам або тривогам своїх людей заважати тактичному мисленню.\n\nЯк розв'язання проблеми ОСКП пропонує почати навчати офіцерів відповідно до повноважень Центрального комітету та призначати офіцерів згори вниз. З огляду на нашу неорганізованість і великі втрати в недавніх боях, можливо, вони мають рацію, визначаючи наші проблеми. Хоча більш ідейні серед нас відсахнуться від такого державницького кроку, він необхідний, щоб забезпечити швидке та ефективне здійснення визволення."

CNT_solidifying_a_corps_system:0 "Утвердження корпусної системи"
CNT_solidifying_a_corps_system_desc:0 "Нерегулярні загони різного розміру та з різною ієрархією не зможуть захоплювати території чи атакувати укріплену позицію ешелонами. Це потрібно виправити, і швидко, якщо ми хочемо зміцнити своє становище та рухатися до перемоги.\n\nТак і буде. Ми почнемо зосереджуватися на координації підрозділів, визначенні командної ієрархії та поступовому переході — в майбутньому — до справжньої корпусної системи. Такий крок має значно підвищити здатність наших сил планувати майбутні наступальні операції."

CNT_the_matter_of_revolution:0 "Питання революції"
CNT_the_matter_of_revolution_desc:0 "Спершу прийшла революція проти іспанців. Об'єднавча сила, заради якої вся нація могла працювати з єдиним завзяттям. Тепер прийшла нова революція, щоб розвинути цілі першої та спрямувати всю Каталонію до ще величнішого майбутнього. Однак неможливо ігнорувати, наскільки менш об'єднаною є ця революція.\n\nНаш Єдиний фронт абсолютно відданий подальшому розвитку нашої революції, однак дедалі очевидніше, що значення революції відрізняється для різних фракцій нашого уряду. Нас тягнуть у різні боки, напружуючи зв'язки, завдяки яким ми черпаємо свою силу. Ми повинні знайти спільний ґрунт, наші об'єднавчі відповіді, і зосередитися на них. Дебати щодо деталей можуть почекати, доки Каталонія не стане захищеною, гордою та вільною."

CNT_solving_the_riddle_of_the_officer_corps:0 "Розгадати загадку"
CNT_solving_the_riddle_of_the_officer_corps_desc:0 "Наша тиха, підпільна революція, яку ми вели багато років, тепер стала своєю повною протилежністю. Тому ми мусимо значно розширити наш офіцерський корпус і децентралізувати наше колись суворе та зосереджене керівництво, щоб забезпечити належний нагляд. Але ми повинні зберегти контроль над напрямком руху.\n\nДля цього ми зосередимо критерії внутрішнього просування та підготовки на ідеологічній позиції та чистоті кандидатів. Імовірно, індивідуальна компетентність постраждає, але це варта ціна заради забезпечення політичної ортодоксальности."

CNT_sorting_out_the_logistical_hazards:0 "Усунути логістичні проблеми"
CNT_sorting_out_the_logistical_hazards_desc:0 "Дуже довгий час нашим бійцям було найважливіше мати рушницю, яку можна було використовувати, а потім, за потреби, викинути. Розмір, походження, тип боєприпасів — ніщо з цього насправді не мало значення, якщо зброю взагалі можна було отримати. Тепер це більше не так, і проблема постачання такої кількости різноманітних боєприпасів душить нашу недосвідчену систему постачання.\n\nХоча це потребуватиме часу, ми негайно почнемо систему переоснащення, стандартизуючи нашу зброю максимально можливою мірою. Це має розв'язати деякі проблеми."

CNT_ideological_loyalty:0 "Ідеологічна відданість"
CNT_ideological_loyalty_desc:0 "Зусилля зі стандартизації та організації нашого стрімко розростаючого офіцерського корпусу тривають, незалежно від труднощів чи спротиву, і ми повинні діяти, щоб виправити найнагальніші проблеми. Наразі такою проблемою є підготовка. Зокрема, більшість наших офіцерів мають дуже мало підготовки, що призводить до плутанини, затримок і великих втрат.\n\nМи працюватимемо над виправленням цього, створюючи та впроваджуючи регулярніші навчальні курси й програми підготовки для нових та підвищених у званні офіцерів. Це й надалі допомагатиме вирівнювати нерегулярності."

CNT_tighten_training_standards:0 "Посилити стандарти підготовки"
CNT_tighten_training_standards_desc:0 "Хоча ми продовжуємо підвищувати якість наших офіцерів, ми не можемо водночас нехтувати якістю наших піхотних формувань та загонів міліції. Зрештою, саме вони є ядром кожного бою та забезпечують нам величезну стійкість.\n\nМи збільшимо кількість навчальних таборів, а також кількість інструкторів у них. У міру того як через них проходитиме більше людей, ми зможемо значно підвищити загальні знання про оборону й наступ серед формувань — що не може не допомогти в майбутньому."

CNT_anarchist_commissars:0 "Анархістські комісари"
CNT_anarchist_commissars_desc:0 "Спадкоємці революції 1936 року тепер стоять на порозі спокути після покоління фашистського панування на Іберійському континенті, вступивши в чергову смертельну боротьбу за виживання. Серед нації, що розпадається під натиском усіляких ворогів, як старих, так і нових, багато молодих анархістів готові довести себе у фінальній битві за Іспанію.\n\nПроте невдачі Каталонії досі боляче відлунюють у пам'яті, настільки, що питання моралі знову постає саме тоді, коли життя наших борців за свободу є критично важливими. Створення комісарських загонів із найбільш відданих іспанських анархістів зміцнить кістяк міліцій, гарантуючи, що кожен чоловік і кожна жінка зустрінуть ворога з таким духом і лютістю, що революції більше не буде відмовлено в перемозі."

CNT_ensure_broader_professionalism:0 "Забезпечити ширший професіоналізм"
CNT_ensure_broader_professionalism_desc:0 "Не дивно, що покоління фашистського правління в Іберії заплямувало образ анархістів-революціонерів, чию боротьбу за свободу вважають такою ж жорстокою та безжальною, як боротьбу совєтів і маоїстів, яких вони так ненавидять. Як заради нашого образу, так і заради практичности, будь-яка надія на справу анархізму має спиратися на дисципліну солдатів і поведінку наших офіцерів.\n\nНікого не здивує, що ми не надто прихильні до структурованих методів її забезпечення. Наші прихильники роздаватимуть листівки міліціям у міських центрах, надаючи детальні інструкції щодо окупації та управління зонами цивільного населення. Останнє, що нам потрібно, — це випадки позасудових убивств у тилу, адже це суперечить самій суті нашої місії — звільнити себе від тиранії."

CNT_power_in_numbers:0 "Сила в чисельності"
CNT_power_in_numbers_desc:0 "Гірка правда полягає в тому, що справа анархізму переживає найскладнішу боротьбу за всю свою історію, і це важко усвідомлювати після жахливих подій у Механо та Каталонії. Будь-яка спроба по-справжньому кинути виклик Центральному уряду чи будь-якому іншому воюючому режиму потребує більше людських ресурсів, ніж могли б забезпечити звичайні критерії набору. Це стосується як міліцій, так і їхніх командирів.\n\nНаші офіцери потрібні на передовій так швидко, як тільки можуть їх нести ноги, так само швидко, як міліціонерам потрібне керівництво. Командири отримуватимуть мінімальну підготовку, водночас отримуючи ширші повноваження для керівництва повстанцями на фронті."

CNT_pull_from_the_ranks:0 "Набирати з лав"
CNT_pull_from_the_ranks_desc:0 "За нинішнього стану вищого офіцерського корпусу, де катастрофічно бракує людей для його заповнення, найочевидніше джерело здатних чоловіків і жінок — самі лави міліціонерів. Чинні офіцери мають довгий список талановитих солдатів, які цілком здатні впоратися із завданням; нам залишається лише поставити чорнильний підпис на пергаменті й відправити їх на фронт.\n\nНаскільки ефективним це не було б, настільки ж невигідно для образу анархістських міліцій виглядає така майже непотистична система підвищень. Ми зможемо виправити цей дисбаланс після завершення революції, адже протягом усього цього часу і солдат, і офіцер мають зосередитися на ворогові."

CNT_pull_from_the_populace:0 "Набирати з народу"
CNT_pull_from_the_populace_desc:0 "Війна — це пекло навіть серед ідеалістів, і анархісти Іберії не є винятком. Примусовий призов свого сусіда суперечить усім принципам рівности та свободи, але революція вимагає всього, і ми не можемо дозволити собі знову програти цю боротьбу. Обмежений примусовий набір цивільного населення до міліцій дозволить солдатам і офіцерам середньої ланки просуватися вгору по службі.\n\nЦе навряд чи піде на користь і без того заплямованій репутації анархістів-революціонерів, проте з часом народні обурення та гнів можна буде вгамувати. Чорно-червоний прапор має майоріти в усіх куточках Іберії — лише тоді народ зможе зцілитися."

CNT_ensure_minimum_training:0 "Забезпечити мінімальну підготовку"
CNT_ensure_minimum_training_desc:0 "Зловісна репутація анархістів минулого тяжіє над революціонерами сучасної Іберії. Від бомбардувальників Волл-стріт до Монмартру ганебна слава позасудових убивств і руйнувань століттями була плямою на спадщині Матінки-Анархії. Понад усе інше, професіоналізм і стриманість наших фронтових солдатів та офіцерів мають найвищу важливість.\n\nУнікальний характер громадянської війни в поєднанні з імпровізованим характером набору означає, що ймовірність появи неблагонадійних людей серед офіцерського корпусу вища, ніж нам хотілося б. Ведення вичерпних записів як про минуле особового складу, так і про бойовий досвід життєво необхідне для підтримання високого бойового духу керівництва на фронті; революції потрібні хороші, переконані люди, здатні надихати, а не армія м'ясників."

CNT_heightened_recruitment_standards:0 "Сизіфова праця"
CNT_heightened_recruitment_standards_desc:0 "Ми зробили все можливе, щоб перетворити міліції на повноцінну партизанську армію, здатну протистояти воюючим фракціям, які нині борються за контроль над півостровом; комісари на місці, солдати напоготові, а офіцери чекають наказу від верховного командування, щоб перейти через бруствер і почати просування вглиб решти Іберії.\n\nВажко вимагати цього після такого героїчного зусилля з підготовки власних військ і стабілізації фронту, поки ми це робили, але саме тут громадянська війна починається по-справжньому. Кожен син і кожна донька Матінки-Анархії мають бути віддані, душею, тілом і розумом, остаточному визволенню південно-західної Європи. Тут і не далі має пройти межа, доки вся Іберія не буде перекована на кинджал, спрямований у черево нацистського чудовиська."

CNT_laying_the_groundwork:0 "Закласти основу"
CNT_laying_the_groundwork_desc:0 "Тепер, коли революція набирає обертів, ми маємо переконатися, що території позаду лінії фронту перебувають у безпеці, поки наші міліції просуваються вперед. Руїни перших повстань лише починають розчищати, а все, що лежить далі, перебуває в різному ступені руйнування через бойові дії.\n\nМи зробимо все можливе, щоб наше розширення на колишні окуповані території відбувалося плавно й безперешкодно, створюючи нові адміністрації та регіональні ради всюди, де це можливо. Умиротворення воюючих сторін у тилу має проводитися силами безпеки з особливою обережністю, адже революція повинна постати перед усіма як справжнє спасіння від значно більшого зла, а не просто як авангард меншого."

CNT_establish_regional_authority_leadership:0 "Керівництво регіональними органами влади"
CNT_establish_regional_authority_leadership_desc:0 "Капіталісти та реакціонери вже давно стверджують, що анархістському суспільству бракує структури для справжнього управління: адже що таке попит і пропозиція у світі, де сама суспільна структура є табу? Насправді справа анархізму, принаймні в Іспанії, у цьому питанні практичніша, ніж можна було б подумати. Зрештою, революції потрібно знову поставити людей на ноги: одягнути, нагодувати, забезпечити житлом і повернути до роботи. Якщо не на фабриці, то на фронті.\n\nТепер, коли регіональні губернатори та місцеві громади приєдналися до революції, ми можемо взятися за управління іспанськими лініями постачання з такою оперативністю та ефективністю, що без проблем позмагаємося навіть із німцями. Старе прислів'я про те, що підірвати потяги легше, ніж змусити їх ходити за розкладом, швидко залишиться в минулому; Матінка-Анархія більше не буде символом ідеалізованого минулого, а стане символом нарешті втіленої сучасности."

CNT_the_cnts_strength_of_ideology:0 "Ні Бога, ні господаря"
CNT_the_cnts_strength_of_ideology_desc:0 "Від 1936 року минуло стільки часу, що більшість людей майже нічого не може згадати про риторику злощасного анархістського повстання в Каталонії — спадщину поразки, чия примара й досі тяжіє над їхніми революційними наступниками, мов кулі та снаряди, що нині пролітають над їхніми головами. Народові потрібно нагадати, що НКП-FAI — це не якийсь примарний образ, вигаданий десятиліттями франкістської пропаганди, а, можливо, єдиний шанс Іберії спокутувати себе в очах її громадян.\n\nСкориставшись відсутністю інституційного контролю, ми поширюватимемо листівки, брошури та тексти з викладом ідеалів НКП-FAI на територіях як у тилу, так і по обидва боки фронту. Від «Держави та уряду» Альберта Янсена до «CNT-FAI» Рудольфа Рокера та «Дурруті» Абеля Паса — таємничість і анонімність іспанських анархістів нарешті буде розвіяно, і народ зрештою прокинеться до червоно-чорного світанку."

CNT_strengthening_the_states_position:0 "Захистити те, що належить нам"
CNT_strengthening_the_states_position_desc:0 "Місія з подолання покоління тоталітарної індоктринації, безперечно, була б тривалим і болісним процесом для будь-якого уряду, але ще важчим він буде для суспільства, де традиційний уряд має бути скасований. Партизанські сили як реакціонерів, так і ревізіоністів причаїлися за нашими лініями, невтомно працюючи над тим, щоб знищити давно очікуваний людський експеримент із нарешті втілення анархістської держави.\n\nІ реакціонери, і ревізіоністи, на жаль, можливо, безповоротно переконані, що анархія — це не більше ніж тероризм і безпричинне насильство натовпу. Це вимагатиме більш тактовної відповіді. Спрямування ресурсів на рейди проти повстанців, зокрема за участю наших... менш презентабельних сил безпеки, допоможе знищити осередки опору в тилу й не дозволить анархістському експерименту бути задушеним у зародку; брудна робота, але краще ми, ніж вони."

CNT_a_break_from_tradition:0 "Більше ніколи — Україна"
CNT_a_break_from_tradition_desc:0 "Як і багато соціальних революцій, анархізм значною мірою походить із міського середовища. Подібно до доктрин Маркса, Леніна та Бухаріна, анархізм часто ставив масштабну індустріалізацію на перше місце як основу підтримки бездержавного суспільства. Реалії конфлікту в Іберії внесли свої корективи в ці прагнення, адже революція в Іберії зупиниться, якщо аграрний сектор не буде переорієнтований на забезпечення воєнних потреб НКП-FAI.\n\nНемає жодної душі вздовж усього Середземномор'я, яка б не чула жахливих історій про те, що сталося в Україні — трагедію, спричинену її власною громадянською війною, яка станом на сьогодні відбулася менш ніж за десятиліття до другої громадянської війни в Іберії; голод, хвороби та десятки тисяч жертв. Доля, що спіткала Хлібну житницю, не повинна повторитися тут, незалежно від того, скільки грошей чи людських ресурсів знадобиться для забезпечення продовольчих запасів."

CNT_return_to_the_communal_system:0 "Comunitat Sobirana"
CNT_return_to_the_communal_system_desc:0 "Справжнє зло іберійського уряду, як і всіх авторитарних режимів, полягає в тому, що навряд чи знайдеться регіон від Піренеїв до Ґібралтару, де цивільні чи федеральні інституції не мали б скелетів у шафі. Імена місцевих губернаторів та цивільного керівництва часто згадуються у зв'язку з різноманітними випадками, як дрібними, так і серйозними, що найменше приваблюють у франкістському режимі.\n\nОднак саме тут анархістська революція має відповісти на несправедливість Іберійської держави невтішно тактичним прагматизмом, адже найнадійніший спосіб забезпечити стабільність у новому суспільстві — дозволити деяким елементам старого зберегтися. Балансуючи між поверненням регіональних губернаторів і місцевого керівництва до комунальної системи та призначенням нових членів рад, ми зможемо швидко встановити ланцюг командування й краще вирішувати проблеми в тилу."

CNT_industry_for_the_people:0 "Промисловість для народу"
CNT_industry_for_the_people_desc:0 "Якщо революція й має щось, до чого вона справді прихильна, настільки, що це перетворилося на панівний стереотип анархізму, то це виробництво та розподіл безлічі, безлічі рушниць у безлічі, безлічі рук. Можна було б дослухатися до приказки: «якщо все, що у вас є, — це молоток, кожна проблема здається цвяхом», але де ще революція знайде настільки приємно простий спосіб підтримати себе, як не серед збройних заводів і виробничих ліній військової машини НКП-FAI?\n\nІз руки робітника — гвинтівка солдата. В очах солдата — куля зустрічає ворога. Із полеглого ворога — проростає зерно. Із зерна, оповитого залізом і кров'ю, розквітають хліб і троянди.\n\nТанцювальні кроки війни, що кружляють у вальсі під ритм сталевої пісні Матінки-Анархії."

CNT_patrols_down_the_street:0 "Вулиці мають очі"
CNT_patrols_down_the_street_desc:0 "Одне — викорінювати повстанців у тилу, і зовсім інше — утримувати цивільне населення в рамках посеред активної зони бойових дій. Як завжди, справу анархізму часто засуджують як ледь прикрите правління натовпу, прикрите туманним філософським фасадом для його виправдання. Якщо ми коли-небудь хочемо змити цю чорну пляму з революції, спроможність і переконаність міліцій КПА мають життєво важливе значення.\n\nРепутація іберійських поліцейських, як і поліції всіх авторитарних держав, залишила шрами на цивільному населенні — від історій про побиття кийками до допитів у закритих кабінетах. Підозріла репутація анархістів не надто вселяє людям надію на значне покращення ситуації порівняно з Франко, але ми принаймні повинні спробувати, збільшивши фінансування місцевих міліцій і вживши заходів для запобігання насильницьким ексцесам."

CNT_seize_the_industry:0 "Захопити промисловість"
CNT_seize_the_industry_desc:0 "Поки Центральний уряд відступає, дедалі більша частина промисловості Іберії визволяється на колишніх окупованих територіях. Багато фабрик були або пошкоджені в боях, або залишені без керівництва через відсутність урядових вказівок. Співпрацюючи з робітниками на місцях, ми швидко відновимо роботу нещодавно захопленої промисловості.\n\nІз високо піднятими підборіддями та ще вище піднятими кулаками ми вхопимо майбутнє власними руками й нарешті доведемо правоту Матінки-Анархії."

CNT_seize_the_traitors:0 "Схопити зрадників"
CNT_seize_the_traitors_desc:0 "Мало хто так ненавидить так зване «необхідне зло», як жертви авторитаризму, але кровопролиття громадянської війни змушує нас діяти. Із поширенням повстанського руху на окупованих КПА територіях нещодавно створеному відділу революції з боротьби з повстанцями дозволили «розв'язати руки» заради придушення контрреволюції. Через те, що його точна роль і бажана тактика настільки похмурі й зловісні, що навіть у КПА для нього немає належної назви, чимало людей побоюються, що це перетинає межу, яка може підтвердити ворожу пропаганду, що змальовує анархізм як правління через страх.\n\nЩе буде час по-справжньому втілити ідеали революції після того, як гармати замовкнуть; ворог не підкориться лише тому, що його попросять, тож нехай наші гвинтівки ведуть переговори."

CNT_collectivized_agriculture:0 "Колективізовані поля"
CNT_collectivized_agriculture_desc:0 "Пошук нових та інноваційних способів модернізації сільського господарства в сучасну епоху в певному сенсі нагадує спробу винайти колесо заново, адже майже кожен урядовий лад, що існує, вже намагався вивести сільське господарство на новий рівень. Тепер наша черга зробити те саме, нарешті довівши ефемерне завоювання Кропоткіна до давно пророкованого завершення.\n\nПерерозподіляючи ресурси, відібрані у багатих і могутніх, на пагорби та поля сільськогосподарських угідь Іберії, ми зможемо відновити занедбане сільське господарство для потреб революції й довести вже діючі господарства до максимальної ефективности.\n\nБагато воюючих сторін уже спалювали посіви, щоб не дозволити ворогові ними скористатися, тому цілеспрямовані зусилля зі збереження продовольчих запасів стали критично важливими для революції."

CNT_an_industry_fitting_of_warfare:0 "Desperta Ferro!"
CNT_an_industry_fitting_of_warfare_desc:0 "Тепер настав день, якого вороги Анархії давно боялися. Ми досягли успіхів там, де могли втілювати ідеали революції, водночас пом'якшуючи її найгірші тенденції минулих десятиліть. Коли громадянська війна досягає критичної стадії, а військово-промислова могутність КПА працює на повну, ми знаходимо рідкісний міст між цими, здавалося б, несумісними прагненнями.\n\nМаючи у своїх руках усе військове виробництво Іберії, ми можемо дати революції зброю, яка за часів Мехно могла б здаватися фантастикою: реактивні винищувачі та бомбардувальники, броньовані колони танків і бронетранспортерів, що простягаються до самого горизонту, лінкори та підводні човни, здатні перетворити цілі флоти на оброслі водоростями купи металобрухту; ось він, новий лик Анархії — неминуча загибель реакціонерів усюди, які в жаху спостерігають, як кайдани людства розбиваються назавжди."

CNT_strength_in_unity:0 "Demá a les Barricades"
CNT_strength_in_unity_desc:0 "Іспанські орди можуть здаватися страхітливими. Перед нашою маленькою землею простягається ціла нація, що оголює зуби й жадає нас пожерти. Було б надто легко впасти у відчай і здатися, як це зробили багато франкістських колабораціоністів. Але якби цього звіра було неможливо здолати, то як ми взагалі тут опинилися? Якщо надії на перемогу не було, то як ми вигнали іспанців на початку цієї війни?\n\nВідповідь проста: єдність.\n\nКаталонські робітники об'єднані проти Іспанії, Народ разом бореться, тоді як іспанці сперечаються й воюють між собою. Звір відволікся, його кінцівки б'ються одна об одну й нездатні вирватися з полону власних егоїстичних інтересів. Ми стоїмо інакше, ми присвячуємо себе благу всього людства, і завдяки цій силі звір зламається перед нами."

#Національні духи 
CNT_unequal_revolution:0 "Нерівна революція"
CNT_unequal_revolution_desc:0 "Народна революція означає народну армію, а армія без централізації — це хаос. Поки вище командування КПА сперечається між собою про теоретичні аспекти лівізму, командири на місцях зазвичай не бачать проблеми в тому, щоб діяти відповідно до них у межах своїх юрисдикцій.\n\nТому, хоча КПА на папері має повноваження над усіма районами операцій, для звичайного міліціонера чи добровольця центральні накази майже не впливають на те, як вони діють. Окремо взята більшість КПА повністю мобілізована й готова до війни. Однак найчастіше зв'язок між кожним регіоном настільки ускладнений, що будь-яка перевага, яку дає високий бойовий дух, губиться в заплутаній структурі."

CNT_unorganized_army:0 "Неорганізована армія"
CNT_unorganized_army_desc:0 "Хоча Каталонська народна армія має кількох перебіжчиків з Іберійської армії, основу КПА становить строката суміш міліцій різних форм і розмірів. Хоча ця децентралізована природа могла бути достатньою для здобуття незалежности в хаосі розпаду Іберії, тепер така ситуація більше не відповідає нашим військовим потребам.\n\nНаші міліції мають бути реорганізовані в регулярну армію, здатну захистити нас від більш конвенційних ворогів. Однак через величезне розмаїття доктрин та ідеологій ця реорганізація буде тривалою й складною."

#Події
CNT_wars.1.t:0 ""
CNT_wars.1.desc:0 "У штабі регіонального командування двоє офіцерів сперечаються через розподіл партії медичного обладнання. Обидва хочуть отримати більшу частину, стверджуючи, що їхній підрозділ перебуває в більшій небезпеці, ніж інший. Ніхто в штабі не може вирішити проблему, тож обидва офіцери просто йдуть, записавши конкуруючі вимоги щодо медичного обладнання."
CNT_wars.1.a:0 ""

CNT_wars.2.t:0 ""
CNT_wars.2.desc:0 "У тому самому регіональному штабі ті самі двоє офіцерів знову сперечаються, цього разу через розподіл зброї. Однак цього разу жінка втручається в розмову й веде їх до невеликого кабінету, де кілька людей працюють із документами та архівами. Усі троє сідають, і після того, як особи офіцерів належним чином встановлено, жінка передає іншому колезі пачку паперів. Через деякий час, протягом якого офіцери знову встигають посперечатися, колега повертається й повідомляє офіцерам, як відбуватиметься розподіл, спираючись на інформацію, яку штаб має про їхні підрозділи."
CNT_wars.2.a:0 ""

CNT_wars.3.t:0 ""
CNT_wars.3.desc:0 "Кабінет проводить нараду з Вищим командуванням щодо нестачі кадрів в офіцерському корпусі, через що наявні в КПА офіцери змушені розподілятися надто тонко. Члени ОСКП та незалежні учасники наради пропонують просто збільшити їхню кількість, щоб вирішити проблему, оскільки ситуація не дозволяє мати настільки мале ядро офіцерів. ППНВ та анархісти, з іншого боку, пропонують лише незначно збільшити їхню кількість і переконатися, що офіцери ідеологічно віддані революції, оскільки, на їхню думку, лояльний офіцер викладатиметься на 100%, а той, кого просто підвищили для заповнення вакансії, виконуватиме роботу недбаліше. Нарада завершується без досягнення жодного висновку."
CNT_wars.3.a:0 ""

CNT_wars.4.t:0 ""
CNT_wars.4.desc:0 "Подія про впровадження нової програми підготовки з більшою кількістю фізичних тренувань і занять із теорії бою навіть для молодших офіцерів."
CNT_wars.4.a:0 ""

CNT_wars.5.t:0 ""
CNT_wars.5.desc:0 "Двоє офіцерів переглядають список можливих кандидатів на підвищення. Більшість із них посередні, і лише кілька справді хороші, але через велику кількість посад, які потрібно заповнити, вони вирішують відібрати п'ятьох найкращих і розпочати процес їхнього підвищення."
CNT_wars.5.a:0 ""

CNT_wars.6.t:0 ""
CNT_wars.6.desc:0 "У селі люди збираються в ратуші на перші збори своєї нещодавно створеної комуни. Люди приходять із проблемами та пропозиціями. Модератори намагаються зберігати спокій протягом усієї зустрічі, а після її завершення залишаються, щоб обговорити, як вона пройшла. Схоже, попереду буде багато важкої роботи, але якщо вони докладуть зусиль, то знають, що комуна може досягти успіху."
CNT_wars.6.a:0 ""

CNT_wars.7.t:0 ""
CNT_wars.7.desc:0 "Загін міліції ППНВ патрулює вулиці, розшукуючи «підривників», які розвішують контрреволюційну пропаганду. Через деякий час вони знаходять кількох чоловіків із цією пропагандою, і починається погоня. Фінал залежить від автора."
CNT_wars.7.a:0 ""

CNT_wars.8.t:0 "Непримітна подія"
CNT_wars.8.desc:0 "У повітрі пролунала какофонія пронизливих свистків, коли двері та вікна розбивалися й ламалися. Вулицю оточили, а міліціонери прибули з усіх боків.\n\n«Мирно здайтеся своїм товаришам», — прогуркотів мегафон, — «цей район підозрюється в підривній діяльності. Будь ласка, здайтеся для допиту».\n\nМіліціонери не носили форми, лише червону пов'язку на лівій руці. Деякі мали пістолети, інші — старовинні гвинтівки. Кілька молодших, здавалося, не мали нічого, крім кийків. Вони вибивали двері в будинках уздовж вулиці й будь-якими способами витягували мешканців назовні. Дехто виходив добровільно, почувши оголошення, тоді як інших витягували за волосся чи кінцівки — чимало з них були закривавлені, побиті й плакали.\n\nБула одна аномалія. В одному з будинків, коли юного міліціонера тягнув молоду жінку назовні, він не помітив ціпка, який із несподіваною силою вдарив його в ключицю, змусивши послабити хватку на жінці. Він мало не впустив пістолет, скрикнувши від різкого болю.\n\n«Хто, бля-?» Він розвернувся, і в його очах спалахнув вогонь. Старий стояв непохитно, хоча й трохи хитався, тримаючи піднятим свій ціпок. Мабуть, він був нагорі.\n\n«Ви хочете врятувати Каталонію від франкістів? Товаришу, а хто врятує її від таких звірів, як ви?» — виплюнув старий, знову піднімаючи ціпок для удару. Однак його зупинили: міліціонер відпустив жінку й ударив чоловіка руків'ям пістолета по голові.\n\nТой звалився й не рухався, але міліціонер продовжував бити його, кричачи в його глухі вуха, що він зрадник свого народу й, напевно, один із франкістів, яких вони шукають, хоч би як жінка кричала, коли її відтягували, і хоч би як навколо чоловіка розтікалася червона калюжа."
CNT_wars.8.a:0 "Операцію успішно завершено: жодних помітних інцидентів"
