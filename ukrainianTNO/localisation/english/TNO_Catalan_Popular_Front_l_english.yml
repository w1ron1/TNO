#Iberian Wars focuses
CNT_an_army_fit_for_the_revolution:0 "Ten Thousand Grips..."
CNT_an_army_fit_for_the_revolution_desc:0 ""The soldiers too shall take strike action; they will break ranks and fight no more."\n\nWell, we hope that they'll break ranks and fight for our side, eventually. Until then, we will have to build an army of our own; and we must move with haste; the fate of the Revolution and Iberia cannot be left to chance. First, we must begin shifting more resources, whether funds or equipment, to the army and instill revolutionary sensibilities amongst the ranks. We should also divert some attention to our militias, who will serve as our army's backbone until more professional forces can take their place. Regardless of who makes up the army, the only path to liberation is in solidarity, so rise, comrades!"

CNT_revolutionary_catalonia_reborn:0 "Revolutionary Catalonia, Reborn"
CNT_revolutionary_catalonia_reborn_tt:0 "§VÉs la lluita final, unim-nos i demà la internacional serà el gènere humà.§!"
CNT_revolutionary_catalonia_reborn_desc:0 "When Barcelona fell in 1939 to the advancing Nationalists, we found ourselves on the run—first out of Spain, then, unfortunately, out of the minds of the men and women of Catalonia.\n\nEven after Catalonia seceded from the Union, we continued having to hide from the "moderates" who show themselves to be nothing more than appeasers! It was only yesterday that the triad of the CPA rebelled against the moderates to forge our own future—among those were the oldest of the three, PSUC, the Catalanist referent of the PCE, followed by the PSAN—popular among the students of Catalonia, followed by the CNT which has returned from exile.\n\nWhile the so-called Republic of Catalonia may not give us the place we need to build the Catalonia of our dreams, we are perfectly capable of building it ourselves."

CNT_the_peoples_war:0 "...And a Million Faces"
CNT_the_peoples_war_desc:0 "The military of the Revolutionary administration can barely be described as such. This is not a mark against it, for it does not serve a State, and does not seek or exercise the authority of judge, jury, and executioner. This impulse does exist, however, and it and many others must constantly be checked. The best way to accomplish this undertaking is by never allowing the types of people who exhibit such behavior in our armies; our officers, soldiers, and all who fight under our banner must share the ideals of Anarchism and liberation for all people.\n\nThose who lead our forces shall come from those forces. Democracy does not cease when a man takes a rifle to defend his liberty, our soldiers shall elect their officers. They shall not be dumb brutes with no dignity, they will never be subjected to humiliation to cover up the failures of their superiors."

CNT_an_army_of_militias:0 "Rags and Rifles"
CNT_an_army_of_militias_desc:0 "Our central force on the battlefield is the brave, committed column; workers and peasants who have taken up arms and fought off the Fascist occupiers time and again, who march into the battlefield with inadequate rifles and make miracles of nightmares. Their tactics primarily rely on their ability to organize rapidly and often behind enemy lines, while also providing immediate breakthrough units when such maneuvers are successful. Such maneuvers kept the Republic from immediately toppling to military revolts and ensured that the Fascist regime would always remain on its toes. Now, they will finally bring Anarchism to Spain."

CNT_a_cohesive_army_for_an_uncohesive_movement:0 "Stitch It Together"
CNT_a_cohesive_army_for_an_uncohesive_movement_desc:0 "For many years our loyal fighters fought and died under the most trying conditions, and the cellular structures they were organized under worked as best as they were able. This is no longer the case, and we cannot operate an army in the same manner as an insurgency.\n\nWe must standardize our formations, ensure as much training and leadership development as possible for the officers, and enforce general discipline. In this manner, we will have a far more capable force upon the final victory."

CNT_organize_the_armies:0 "Structure the Armies"
CNT_organize_the_armies_desc:0 "Integral in any good prosecution of warfare is organization, specifically of supply. Countless campaigns have fallen victim to the pitfalls of severed supply and organizational indiscipline. Our own forces suffered from this in our first battle with the Fascists. We failed to prosecute victories, regain the initiative after defeats, and regroup after retreats. We shall not make the same mistake twice.\n\nThe wonders of modern technology allow our forces to communicate with each other and decide upon avenues to exploit. We may finally be able to overcome the Anarchists' folly of non-cooperation, and finally bring collective efforts together for victory."

CNT_a_newborn_military_democratic_system:0 "Trench Democracy"
CNT_a_newborn_military_democratic_system_desc:0 "Integral to the very idea of the revolution is democracy. For too long, countless institutions have been sectioned off from the voice of the people and placed in the hands of exploiters, who lull the workers with pittances while they take the profits. The quintessential example of this exploitation is the military. Men are thrown in dungeons, humiliated, beaten, and abused by superiors, who then send them onto the freezing muddy battlefield while they sit in field offices drinking coffee and chatting.\n\nThis injustice shall be rectified by true democracy; soldiers shall be the officers, and they shall be chosen by their comrades for their bravery and leadership abilities, not by wealthy officer's schools."

CNT_following_psucs_wisdom:0 "...Under a Single Thread"
CNT_following_psucs_wisdom_desc:0 "Our forces, argue the Communist Unified Socialist Party of Catalonia (PSUC), are disorganized, disheveled, and dysfunctional. Officers elected from the soldiers tend to be unable to dampen their worst excesses at best, and at worst simply lack any authority among their subordinates to accomplish anything at all. They lack the ability to collaborate with each other, often letting petty grudges or the anxieties of their men get in the way of tactical thinking.\n\nAs a solution, the PSUC argues that we should begin to train officers on the authority of the Central Committee and appoint officers top-down. Given our lack of organization and heavy losses in recent combat, they may be correct in identifying our woes. While the more ideological among us will balk at such a statist move, it is necessary to ensure the liberation is carried out speedy and efficiently."

CNT_solidifying_a_corps_system:0 "Solidifying a Corps System"
CNT_solidifying_a_corps_system_desc:0 "Irregular bands of non-uniform size and hierarchy are not going to win territory, or attack a fortified position in echelon. This needs to be corrected, and fast, if we are to solidify our position and advance towards victory.\n\nSo it will. We will begin by focusing on unit coordination, defining a command hierarchy and advancing towards - in the future - a true corps-based system. Such an action should massively increase the ability of our forces to plan future offensives."

CNT_the_matter_of_revolution:0 "The Matter of Revolution"
CNT_the_matter_of_revolution_desc:0 "First, revolution against the Spanish came. A unifying force, one that the whole nation could work towards with united vigor. Now, a new revolution has come, to build upon the objectives of the first and direct all Catalonia towards an ever greater future. However, it is impossible to ignore how far less unified this revolution is.\n\nOur United Front is absolutely committed to furthering our revolution, however it is becoming increasingly clear that what the revolution means differs between the factions of our government. We are being pulled in different directions, straining the bonds through which we find our strength. We must find our common ground, our unifying answers, and focus on those. The debate over details can wait until Catalonia stands secured, proud and free."

CNT_solving_the_riddle_of_the_officer_corps:0 "Solve the Riddle"
CNT_solving_the_riddle_of_the_officer_corps_desc:0 "Our quiet, underground revolution - pursued for many years - is now exactly the opposite. By necessity, we must therefore significantly expand our officer corps, and decentralize our previously strict and focused leadership in order to provide adequate oversight. But we must maintain control of direction.\n\nTo do so, we will focus internal promotion and training criteria on the ideological position and purity of candidates. It is likely that individual competence will suffer, but it is a worthwhile trade to ensure political orthodoxy."

CNT_sorting_out_the_logistical_hazards:0 "Sorting Out the Logistical Hazards"
CNT_sorting_out_the_logistical_hazards_desc:0 "For a very long time, what mattered most to our fighters was that they had a gun that could be used and then, if needed, discarded. Size, origin, ammunition type, none of that truly mattered if a weapon could be had. This is no longer the case, and the challenge of supplying so much differing ammunition is strangling our inexperienced supply system.\n\nThough time-consuming, we will begin a system of conversion immediately, standardizing our weaponry to the greatest degree possible. This should solve some challenges."

CNT_ideological_loyalty:0 "Ideological Loyalty"
CNT_ideological_loyalty_desc:0 "Efforts to standardize and organize our rapidly-expanding officer corps continue, regardless of challenge or pushback, and we must act to rectify the most pressing concerns observed. Currently, that concern is training. Namely, that most of our officers have little of it, leading to confusion, delays, and high losses.\n\nWe will work to correct that, by creating and deploying more regular training courses and series of instruction for incoming and promoted officers. Doing so should continue to help even out irregularities."

CNT_tighten_training_standards:0 "Tighten Training Standards"
CNT_tighten_training_standards_desc:0 "Though we continue to improve the quality of our officers, we cannot afford to, at the same time, neglect the quality of our infantry and militia formations. They are, after all, the core of every fight and provide us with tremendous resiliency.\n\nWe will increase the number of training camps as well as the numbers of instructors within them. As more people pass through them, we can significantly increase the general knowledge of both defense and offense among the formations - something that cannot but help for the future."

CNT_anarchist_commissars:0 "Anarchist Commissars"
CNT_anarchist_commissars_desc:0 "The heirs to the 1936 revolution now stand on the precipice of redemption after a generation of Fascist domination on the Iberian continent, locked in yet another mortal struggle for survival. Amidst a nation in collapse with every kind of enemy, both old and new, many young anarchists are ready to prove themselves in the final battle for Spain.\n\nYet the failures of Catalonia still stings in the memory, enough for the morale question to rear its head at a time where the lives of our freedom fighters is absolutely critical. Forming commissar units from among the ranks of the most committed of Spain's anarchists will stiffen the backbone of militias, making damn sure every man or woman will face the enemy with a spirit and ferocity that revolution will no longer be denied."

CNT_ensure_broader_professionalism:0 "Ensure Broader Professionalism"
CNT_ensure_broader_professionalism_desc:0 "It should come as no surprise that a generation of Fascist rule in Iberia has soured the image of the Anarchist revolutionaries, whose fight for freedom is seen as every bit as vicious and ruthless as the Soviets and Maoists they so loathe. As much for the optics as for the practicality, any hope for the Anarchist cause must rely on the discipline of the soldiers and conduct of our officers.\n\nShocking no one, we have little affinity for structure in means of enforcing this. Our loyalists will hand out fliers to the militias across the urban centers, providing detailed instructions on the occupation and management of civilian population zones. The last thing we need is incidents of extrajudicial killings behind the lines, for it goes against the very principle of our mission to free ourselves from tyranny."

CNT_power_in_numbers:0 "Power in Numbers"
CNT_power_in_numbers_desc:0 "The bitter truth of the matter is that the Anarchist cause is facing an uphill battle more than at any point in history, a weighty thing to consider after the harrowing episodes of Mekhano and Catalonia. Any attempt to truly contest the Central Government, or any of the other belligerent regimes, requires more manpower to fight with than conventional recruitment criteria would provide. This goes as much for the militias as for their commanders.\n\nOur officers are needed on the frontlines as fast as their legs can carry them, as quickly as the militiamen need direction. Minimal training will be provided for commanding officers, whilst simultaneously granting them greater authority to lead the rebels at the front."

CNT_pull_from_the_ranks:0 "Pull From the Ranks"
CNT_pull_from_the_ranks_desc:0 "With the current state of the upper officer corps so bereft of bodies to fill it, the most straightforward source for finding capable men and women must come from among the ranks of the militiamen themselves. The current officers have a long list of talented soldiers who are more than up to the task, we need only put the ink to parchment to send them to the front.\n\nEffective as this may be, it doesn't paint the Anarchist militias in a favorable light to be so borderline nepotistic with promotions. We can fix this imbalance once the revolution is over, for both soldier and officer must focus on the enemy for the duration."

CNT_pull_from_the_populace:0 "Pull From the Populace"
CNT_pull_from_the_populace_desc:0 "War is hell even among idealists, the Anarchist of Iberia being no exception. It goes against every principle of equality and liberty to enforce conscription on one's neighbor, but the revolution demands everything and we cannot afford to lose this fight again. Forcing limited recruitment for the civilian population into the militias will allow room for the mid-level soldiers and officers to move up the ranks.\n\nThis is hardly a boon to the already slandered reputation of the Anarchist revolutionaries, yet the people's resentment and anger can be soothed over time. The Black and Red Banner must fly from all corners of Iberia, only then can the people be allowed to heal."

CNT_ensure_minimum_training:0 "Ensure Minimum Training"
CNT_ensure_minimum_training_desc:0 "The infamous reputation of the Anarchists of the past looms heavily over the revolutionaries of Iberia's present. From the Wall Street Bombers to Montmartre, the infamy of extrajudicial killings and destruction has been a stain on the legacy of Mother Anarchy for centuries now. More than anything else, the professionalism and restraint of our frontline soldiers and officers is of the utmost import.\n\nThe unique nature of the civil war combined with the AD/HOC nature of recruitment means the potential for bad actors among the officer corps is more likely than we're comfortable with. Comprehensive record keeping on both personnel history and combat records are vital to ensure a high esprit de corps among the leadership at the front; What the revolution needs is good men of conviction who can inspire, not an army of butchers."

CNT_heightened_recruitment_standards:0 "Tasca de Sísif"
CNT_heightened_recruitment_standards_desc:0 "We have done all we can to bring the militias up to par as a guerrilla army to contend with the belligerent factions currently vying for control of the peninsula; The Commissars are in place, the soldiers at the ready and officers waiting for word from the high command to go over the top and begin expanding outwards into the rest of Iberia.\n\nIt is a hard thing to ask after such a herculean effort to ready our own troops and keep the frontline stable while we did so, but it is here where the civil war truly begins. Every son and daughter of Mother Anarchy must be committed, mind and body and soul, to the final liberation of southwestern europe. The line must be drawn here and no further, until the whole of Iberia is forged into a dagger aimed at the belly of the Nazi behemoth."

CNT_laying_the_groundwork:0 "Laying the Groundwork"
CNT_laying_the_groundwork_desc:0 "With the revolution now in the process of gaining ground, we must make sure that the areas behind the lines are secure as our militias make their advance. The rubble from the first uprisings is just starting to be cleared out, with everything past that in varying degrees of destruction from the fighting.\n\nWe will make sure that our expansion into the formerly occupied territories is as smooth and seamless as we can manage, preparing new administrations and regional councils wherever we can. Pacification of belligerents behind the line must be carried out with particular care by security forces, for the revolution must be made appear to all as the true salvation from a much greater evil, not merely the vanguard of a lesser one."

CNT_establish_regional_authority_leadership:0 "Regional Authority Leadership"
CNT_establish_regional_authority_leadership_desc:0 "It has long been a smear by capitalists and reactionaries alike that an Anarchist society lacks the structure to truly administrate, for what is supply and demand in a realm where societal structure itself is taboo? The truth of the matter is that the Anarchist cause, at least in Spain, is more practical on the matter than one would think. At the end of the day, the revolution needs to get the people back on their feet again: clothed, fed, housed and back to work. If not in the factory, then at the front.\n\nWith regional governors and local communities now aligned with the revolution, we can set about the running of Spain's supply lines with an immediacy and efficiency to rival even the Germans with ease. That old chestnut about it being easier to blow up trains than to make them run on time will quickly become a thing of the past, Mother Anarchy will no longer remain a symbol of a history long lionized, but of a modernity finally realized."

CNT_the_cnts_strength_of_ideology:0 "No God, No Master"
CNT_the_cnts_strength_of_ideology_desc:0 "So much time has passed since 1936 that most people can recall very little of the rhetoric of Catalonia's ill-fated anarchist uprising, a legacy in defeat whose specter continues to bear down on their revolutionary successors like the bullets and shells currently flying over their heads. The people have to be reminded that the CNT-FAI isn't just some illusory ghost dreamed up by decades of Francoist propaganda, but may well represent Iberia's only chance at redeeming itself in the eyes of Its citizens.\n\nTaking advantage of the lack of institutional control, we will distribute leaflets, fliers and writings detailing CNT-FAI ideals in areas both behind and across the frontlines. From Albert Jansens's 'The State and Government', to Rudolf Rocker's 'CNT-FAI' and Abel Paz's 'Durruti', the mystery and anonymity of Spain's anarchist will finally be undone and the people shall at last awaken to a red and black dawn."

CNT_strengthening_the_states_position:0 "To Protect What is Ours"
CNT_strengthening_the_states_position_desc:0 "The mission to undo a generation of totalitarian indoctrination would surely be a lengthy and painful process for any government, it will be that much more taxing for a society where conventional government is to be abolished. Partisan forces of Reactionaries and Revisionists alike all lurk behind our lines, working tirelessly to undo a long-awaited human experiment in at last implementing the Anarchist state.\n\nReactionaries and Revisionists alike are tragically, perhaps irrevocably, convinced that Anarchy represents little more than terrorism and mob violence without cause. This will require a more tactful response. Directing resources towards counter-insurgency sweeps, including to our...less presentable security apparati, will work to undo resistance efforts behind the lines and prevent the Anarchist experiment from being strangled in the crib; Ugly work, but better us than them."

CNT_a_break_from_tradition:0 "Never Another Ukraine"
CNT_a_break_from_tradition_desc:0 "Like many social revolutions, the Anarchists are ones whose influences are largely urban in their origin. Not unlike the doctrines of Marx, Lenin and Bukharin, Anarchism has often put wide-scale industrialization at the forefront of an ideal for supporting a stateless society. The reality of the conflict in Iberia has thrown a spanner in the works to this endeavor, for the revolution in Iberia will grind to a halt if the Agrarian sector isn't repurposed to feed the CNT-FAI's war effort.\n\nThere isn't a soul anywhere along the Mediterranean that hasn't heard horror stories of what happened in Ukraine, a tragedy wrought by its own civil war and not even a decade removed from Iberia's second civil war to date; Starvation, disease and casualties in the tens of thousands. The fate that befell the Breadbasket must not be replicated here, no matter how much money or manpower is needed to keep the food supply secure."

CNT_return_to_the_communal_system:0 "Comunitat Sobirana"
CNT_return_to_the_communal_system_desc:0 "The true evil of the Iberian government, like all authoritarian regimes, is that there is scarcely a region from the Pyrenees to Gibraltar where civil or federal institutions don't have skeletons in their closet. The names of local governors and civilian leadership alike are often cited in some respect, in cases both trifling and severe, to the least endearing tendencies of the Francoist regime.\n\nIt is here however that Anarchist revolution must respond to injustices of the Iberian State with unflatteringly tactical pragmatism, for the most surefire way to promote stability in a new society is to allow some elements of the old one to remain. By balancing readmissions of regional governors and local leadership into the communal system alongside the newer council appointments, we can quickly establish the chain of command and be better able to address issues behind the lines."

CNT_industry_for_the_people:0 "Industry for the People"
CNT_industry_for_the_people_desc:0 "If there is anything that the revolution has a true affinity for, so much so that it's morphed into the prevailing stereotype of Anarchism, it is the manufacturing and distribution of many, many guns into many, many hands. One might be compelled to heed the idiom that 'if all you have is a hammer, every problem looks like a nail.', yet where else would the revolution find an outlet for a welcomingly simplistic means of supporting the revolution other than among the weapons plants and factory lines of the CNT-FAI's war machine?\n\nFrom the worker's hand, a soldier's rifle. From the soldier's eye, a bullet greets the enemy. From the enemy's fallen, a seed is planted. From a seed wreathed in iron and blood, bread and roses are made to blossom.\n\nThe dancing steps of war, waltzing to the rhythm of Mother Anarchy's steely song."

CNT_patrols_down_the_street:0 "The Streets Have Eyes"
CNT_patrols_down_the_street_desc:0 "It's one thing to rout out insurgents behind the lines, it's another thing entirely to keep the civilian population on the straight and narrow in the middle of an active warzone. As ever, the Anarchist cause is often chastised as thinly-veiled mob rule with a vague philosophical facade to justify it. If we're ever going to undo this black-washing of the revolution, the capability and conviction of the CPA Militias is vital.\n\nThe reputation of Iberian police officers, like those of all authoritarian states, has left scars on the general population from tale after tale of truncheon beatings and backroom interrogations. The cagey reputation of the Anarchists doesn't exactly fill people with hope for much improvement over Franco in this regard, but we have to at least try by increasing funding to local militias and taking measures to prevent violent excess."

CNT_seize_the_industry:0 "Seize the Industry"
CNT_seize_the_industry_desc:0 "With the Central Government on the backfoot, more and more of Iberia's industry is being liberated from formerly occupied territory. Many of the factories were either damaged in the fighting or left isolated without direction from the government. Through cooperation with the workers on the ground, we will be swift in getting the newly captured industry up and running again.\n\nWith our chins held high and a fist held higher, we will grasp the future in our hands and see Mother Anarchy vindicated at last."

CNT_seize_the_traitors:0 "Seize the Traitors"
CNT_seize_the_traitors_desc:0 "Few are as sick of so-called 'necessary evils' as the victims of authoritarianism, but the carnage of the Civil War is forcing our hand. With insurgency on the rise in the CPA-occupied territories, the recently created counter-insurgency wing of the revolution has been allowed to 'cut loose' in the name of crushing the counter-revolution. With their exact role and preferred tactics being so ominous and steeped in gloom that they lack a proper title within the CPA, more than a few worry that this is crossing a lie that might validate enemy propaganda painting Anarchism as rule through fear.\n\nThere will be time yet to truly live up to the revolution's ideals after the guns fall silent, the enemy isn't going to knuckle under simply because asked, so we will let our rifles negotiate terms."

CNT_collectivized_agriculture:0 "Collectivized Fields"
CNT_collectivized_agriculture_desc:0 "Finding new and innovative ways of modernizing agriculture in the modern era is a bit like trying to reinvent the wheel in some regards, as almost every government type in existence has had its shot in attempting to bring agriculture to a new standard. Now it is our turn to do the same, at last bringing Kropotkin's ephemeral conquest to its long-prophithized conclusion.\n\nBy redistributing resources snatched from the rich and powerful to the hills and fields of Iberia's farmland, we can rehabilitate the unused agriculture for the revolution and get those already operational working at peak efficiency.\n\nMany belligerents have already taken burning cropland to deny it to their enemies, therefore a concerted effort to preserve the food supply has become crucial to the revolution."

CNT_an_industry_fitting_of_warfare:0 "Desperta Ferro!"
CNT_an_industry_fitting_of_warfare_desc:0 "Now comes the day the enemies of Anarchy have long feared. We have made inroads where we could live up to the ideals of the revolution while playing down its worst tendencies from decades past. With the Civil War reaching a critical stage and the military-industrial might of the CPA churning, we find a rare bridge between these seemingly incompatible impulses.\n\nWith the whole of Iberian war production at our fingertips, we can place weapons in the revolution's hands that once might have been the stuff of fantasy in the era of Mekhno; Jet-powered fighter jets and bomber craft, armored columns of tanks and personal carriers stretching to the horizon, battleships and submarines that can reduce entire fleets to water-logged scrap; This, this is the new face of Anarchy, the oncoming death of reactionaries everywhere, who look on in terror as the chains of man are shattered forever."

CNT_strength_in_unity:0 "Demá a les Barricades"
CNT_strength_in_unity_desc:0 "The Spanish hordes may appear daunting. A nation stretches before our small land, teeth bared and hungry to devour us. It would be too easy to fall into despair and surrender, as many Francoist collaborators did. But if that beast were so insurmountable, then how are we here at all? If there was no hope of victory, then how did we drive out the Spanish at the start of this war? \n\nThe answer is simple: unity.\n\nThe Catalan workers stand united against Spain, the People are together in the struggle, while the Spanish quibble and war between themselves. The beast is distracted, its limbs flailing against themselves and incapable of breaking free of their own self-interest. We stand differently, we commit ourselves to the good of all mankind, and with that strength the beast shall break before us."

#National Spirits 
CNT_unequal_revolution:0 "Unequal Revolution"
CNT_unequal_revolution_desc:0 "A people's revolution means a people's military, and a military without centralization is chaos. As the CPA's high command bicker amongst themselves on the theoretical end of leftism, ground-level commanders tend to see no issue in acting accordingly in their jurisdictions.\n\nTherefore, while the CPA has, on paper, authority over all areas of operation, for the regular militiaman or volunteer, central edicts barely affect how they conduct themselves. Individually, most of the CPA is fully mobilized and war-ready. However, more often than not, the communication between each region is so stifled that any advantage entailed by good morale gets lost in the entangled structure."

CNT_unorganized_army:0 "Unorganized Army"
CNT_unorganized_army_desc:0 "While the Catalan People's Army has a handful of defectors from the Iberian Army, the backbone of the CPA is a patchwork of militias of different shapes and sizes. While this decentralized nature might have been sufficient to secure independence in the chaos of Iberia's collapse, this situation can no longer cover our military necessities.\n\nOur militias must be reorganized into a standing army that can defend ourselves from our more conventional foes. However, with the wide variety of doctrine and ideology, this reorganization will be lengthy and difficult."

#Events
CNT_wars.1.t:0 ""
CNT_wars.1.desc:0 "In a regional HQ, two officers are arguing over distribution of a shipment of medical equipment. Both want most for themselves, arguing that their unit is at a larger risk than the other. No one in HQ can solve the issue so both officers just leave, noting down competing claims for the medical equipment"
CNT_wars.1.a:0 ""

CNT_wars.2.t:0 ""
CNT_wars.2.desc:0 "In the same regional HQ, the same two officers from before are arguing, this time over gun distribution. This time, however, a woman cuts in on the conversation and leads them to a small office with a handful of people working over files and archives. The three sit down and after the officers are properly identified, the woman gives another colleague a handful of papers. After a short while, in which the officers have begun arguing again, the colleague returns and tells the officers how the distribution is going to work, based on the information that HQ has about their units."
CNT_wars.2.a:0 ""

CNT_wars.3.t:0 ""
CNT_wars.3.desc:0 "The cabinet is having a meeting with the High Command about the Officer Corps being understaffed, meaning the officers that the CPA has are spread thin. PSUC and independent members of the meeting propose to simply increase the number to solve the issue because the situation doesn't allow for such a small core of officers. PSAN and anarchists, on the other hand, propose to only slightly increase the number and make sure that the officers are ideologically committed to the revolution, as they think a loyal officer will give 100% and someone just promoted to fill a spot will be sloppier in the job. The meeting ends as no conclusion is reached"
CNT_wars.3.a:0 ""

CNT_wars.4.t:0 ""
CNT_wars.4.desc:0 "Event about a new training program being implemented with more physical training and combat theory classes for even low rank officers."
CNT_wars.4.a:0 ""

CNT_wars.5.t:0 ""
CNT_wars.5.desc:0 "Two officers are reviewing a bunch of possible candidates for promotion, most are average and only a couple of them are good, but with many spots to fill they decide to get the top 5 and begin the process of promotion"
CNT_wars.5.a:0 ""

CNT_wars.6.t:0 ""
CNT_wars.6.desc:0 "In a village, the people gather in the town hall for the first meeting of their recently established commune. People come in with plights and suggestions. The moderators try to keep the calm throughout the meeting and after it finishes they stay behind to discuss how it went. It seems that it will be hard work, but if they commit they know the commune can succeed"
CNT_wars.6.a:0 ""

CNT_wars.7.t:0 ""
CNT_wars.7.desc:0 "A PSAN militia patrol is doing a round looking for "subversives" that have been putting up anti-revolutionary propaganda. After a while they find a couple of men with said propaganda and a chase ensues. The finale is up to the writer."
CNT_wars.7.a:0 ""

CNT_wars.8.t:0 "An Unnotable Event"
CNT_wars.8.desc:0 "A cacophony of shrill whistle cries sounded in the air, as doors and windows were smashed and broken. The street had been surrounded, and the militiamen came from all directions.\n\n"Surrender yourself peacefully to your comrades," a megaphone boomed, "this area has been suspected of subversion. Please surrender yourself for interrogation".\n\nThe militiamen wore no uniforms, just a red sash on their left arms. Some wielded pistols, other ancient rifles. A few of the younger ones seemed to have nothing but clubs. They kicked down their way into the houses that lined the street and dragged out the inhabitants by any means. Some came willingly, following the announcement, while others were dragged out by their hair or appendages - more than a few bloody, bruised and crying.\n\nThere was one anomaly. At one house, while dragging out a young woman, a teenaged militiaman never saw the walking stick that struck his collar bone with surprising force, making him loosen his grip on the woman. He almost dropped his pistol, a sharp flash of pain making him yelp.\n\n"Who the fu-?" He turned with fire in his eyes. An old man stood defiantly, if a little unsteady as he kept his walking stick raised. He must have been upstairs.\n\n"You want to save Catalonia from the Francoists? Comrade, who will save it from you brutes?" the old man spat, raising his walking stick to strike again. He was stopped however, as the militiaman dropped his grip on the woman and struck the man's head with the butt of his pistol.\n\nHe crumbled and didn't move, but the militiaman continued to strike him, yelling to his unhearing ears that he was a traitor to their people and probably one of the Francoists they're looking for, no matter how much the woman screamed at him as she was dragged away, nor as the red pool around the man grew."
CNT_wars.8.a:0 "Operation was successful: No incidents of note"
