 WORLD_GRE.8.t: "[Get_newspaper_header]Червона революція в Греції"
 WORLD_GRE.8.desc: "Хаос, який охопив Грецію після Другої італо-турецької війни, досяг своєї кульмінації з падінням Афін, які зайняли партизани Національного фронту визволення (ЕАМ). Лідер ЕАМ Аріс Велучіотіс, виступаючи з президентського палацу, тепер розстріляного кульками та обпалений артилерійським вогнем, пообіцяв, що це буде народження нової Греції.\n\nБитий в боях партизанський лідер говорив про низькість італійців та їхніх співробітників і запропонував провести розплату після того, як країна буде в безпеці. Спершу ж він попередив своїх співвітчизників готуватися до війни.\n"Ми перемогли, але лише проти знарядь наших гнобителів. Тепер ми повинні підготуватися до того, щоб зіткнутися з усім, що наші гнобителі можуть проти нас виставити. Сили реакції будуть кричати проти нас, і все ж ми вийдемо вільними!"\n"
 WORLD_GRE.8.a: "Zito Zito EAM!" # Greece option
 WORLD_GRE.8.b: "Готуйте армію! Готуйте літаки!" # Italy option
 WORLD_GRE.8.c: "Протистояння в Середземномор'ї..." # Rest of the world option

 WORLD_GRE.9.t: "[Get_newspaper_header]Кінець Еліністичної держави"
 WORLD_GRE.9.desc: "Після кількох тижнів посиленої партизанської боротьби Еліністичну державу було повалено рухом опору ЕДЕС. Зі смертю президента Темеліса, колишній лідер групи опору ЕККА, полковник Дімітріос Псаррос, взяв на себе тимчасове керівництво відновленою Грецькою Республікою до того, як в країні відбудуться перші вільні вибори після 1936 року.\n\nПоряд з його заступником Комніном Піромаглу, старий офіцер армії пообіцяв, що відновлення громадського порядку і відновлення грецької демократії будуть його основними цілями. Питання щодо відносин новоосвобожденої держави з її колишніми італійськими владцями, а також позиція уряду щодо комуністичного "Гірського уряду", який вже проголосив себе законним урядом Греції, залишилися без відповіді."
 WORLD_GRE.9.a: "Eleftheria i thanatos!" # Greece option
 WORLD_GRE.9.b: "Нашу середземноморську гегемонію треба зміцнити!" # Italy option
 WORLD_GRE.9.c: "Греція знову прокладає власний курс." # Rest of the world option

 SERBIA_NEWS.1.t: "[Get_newspaper_header]Сербське національне повстання"
 SERBIA_NEWS.1.d: "В країні, що славиться опором гнобителям і тим, хто вважається національними зрадниками, дуже мало хто очікував, що Сербія залишиться спокійною надовго. Після смерті прем'єр-міністра Димитрія Льотича та інших нещодавніх подій народ Сербії піднявся знову, цього разу під керівництвом комуністів. Лідер новоактивізованої Національної визвольної армії Олександр Ранкович очолив повстання, і його сили вже загрожують атакувати позиції колабораціоністів у великих масштабах.\n\nУряд на чолі з управителем Белграда Драгоюміром Йовановичем веде важку боротьбу за збереження контролю над Сербією. Хоча його посада тимчасова, Йованович вже використовує свій вплив для протистояння Національній визвольній армії на кожному кроці."
 SERBIA_NEWS.1.a: "Балканський пороховий бочок вибухає."

 SERBIA_NEWS.2.t: "[Get_newspaper_header]Корона повертається в Сербію"
 SERBIA_NEWS.2.d: "Уряд Сербії здобув переконливу перемогу над комуністами, хоча сама ця подія вже варта уваги. Лідер Сербської національної армії, колишньої Четницької рухи, Момчило Їїч був приведений до присяги як новий прем'єр-міністр Сербії. Вже його нові політики створюють хвилю по всій країні, особливо серед тепер вже переможених комуністичних партизан.\n\nУ ході подій, яких багато хто чекав із підйомом Войводи, військові створили реакційну хунту для того, щоб Сербія відновилася на фоні хаосу повстання. Крім того, прем'єр-міністр Їїч запросив короля Петра з колишньої Югославії повернутися до Сербії як короля, тим самим формально відновивши монархію в Сербії. Повідомляється, що в наступні тижні король Петро готується повернутися до Сербії для того, щоб відповісти на запрошення Їїча."
 SERBIA_NEWS.2.a: "Монархія повертається нарешті."

 SERBIA_NEWS.3.t: "[Get_newspaper_header]Драгоїр Йованович утримує посаду прем'єра"
 SERBIA_NEWS.3.d: "Після завершення повстання комуністичних елементів у Сербії і їх поразки силами Драгоїра Йовановича та його прихильників, не дивно, що цей чоловік зумів закріпити свою позицію як лідер Сербії. Відповідно до політики національної єдності, Йованович закликав до солідарності проти впливу більшовицької думки в Сербії, де сербському народу тепер можна було дихати знову. Він також швидко зібрав війська Сербської національної армії та Добровольчого корпусу до себе на підтримку, виступаючи з об'єднуючою риторикою, закликаючи до честі і консенсусу серед національних сил Сербії.\n\nХоча й здобувши перемогу в сербському повстанні, деякі залишаються скептично налаштованими до його здатності утримати своє правління, враховуючи, що Йованович ступає на землю, що знайома багатьом у вигляді уряду Мілана Недіча, одночасно полюючи на останні залишки комуністичних партизан та їх прихильників із села."
 SERBIA_NEWS.3.a: "Єдність у Сербії, чи витримає вона цього разу?"
 
 SERBIA_NEWS.4.t: "[Get_newspaper_header]Оголошено Сербську класову кооперативну державу"
 SERBIA_NEWS.4.d: "Як швидко вони втратили своє лідерство в сербській політиці, так швидко й Збор повернувся з грізним святкуванням всередині партії. Повернувшись на передній план політики після завершення сербського повстання та їх ролі в його припиненні, молодший брат колишнього прем'єр-міністра Димитрія Льотича, Яков Льотич, був приведений до присяги як новий прем'єр-міністр Сербії.\n\nПлани Якова не відрізнятимуться від планів його старшого брата, хоча інколи вони будуть злегка відрізнятися. Вже ефекти такого правління починають проявлятися, оскільки новопризначений прем'єр-міністр вже запровадив набір основних законів, метою яких є закріплення ідей Збору в уряді."
 SERBIA_NEWS.4.a: "Сімейна місія правити."

 WORLD_PAK.1.t: "[Get_newspaper_header]Переворот у Провінції Північно-Західний кордон"
 WORLD_PAK.1.d: "Уряд Північно-Західної прикордонної провінції, раніше під васалітетом Афганістану, зазнав насильницьких змін сьогодні. Бала Хіссар, або високий фортеця Пешавара, впав до рук Національної гвардії Ліги мусульман, яка є частиною Руху Пакистану. Це змусило залишкові афганські війська в провінції відступити.\n\nПісля зміни контролю, навабзада Шахабуддін Хан, колишній правитель Північно-Західної прикордонної провінції, втік до свого князівства Джандол. Він, здається, прийняв падіння свого уряду в Пешаварі. Ліга мусульман, без сумніву, використає своє нове керівництво над провінцією для підтримки створення Пакистану, щоб здійснити багаторічну амбіцію."
 WORLD_PAK.1.a: "Можливість для деяких, небезпека для інших."

 WORLD_PAK.2.t: "[Get_newspaper_header]Розпад Союзу Балахських держав"
 WORLD_PAK.2.d: "Союз Балахських держав, створений після розпаду Британської Індії, здається, розпався в останні дні. Його лідер, Хан Калат, здався Прикордонним силам Руху Пакистану. Інші балахські князівства, здається, приєдналися до Пакистану без необхідності відкритої боротьби.\n\nПадіння Союзу надає Руху Пакистану прямий шлях до Ірану. Це, в свою чергу, означає, що Рух Пакистану тепер може озброїти свої війська за підтримки Німеччини, використовуючи їх мережу контактів там.\n\nІндійський уряд засудив те, що він назвав "порушенням суверенітету Балаху ісламістськими повстанцями.""
 WORLD_PAK.2.a: "Рух Пакистану робить ще один крок вперед."

 WORLD_PAK.3.t: "[Get_newspaper_header]Війна приходить до Індусу"
 WORLD_PAK.3.d: "Відкрито новий фронт в Індійській війні об'єднання. Рух Пакистану, використовуючи військову концентрацію уряду Делі Індії на його східному фронті з Азад-Хінд, здійснив раптовий наступ на індійські позиції в провінціях Пенджаб і Сінд.\n\nҐерманія негайно оголосила про своє визнання незалежності Пакистану, повідомляється, що вони відправили величезні кількості постачань і зброї ще до початку атаки. Якщо міста Пенджабу і Сінду впадуть, Ліга мусульман може дійсно отримати своє бажання - незалежний Пакистан."
 WORLD_PAK.3.a: "Тепер чиє уявлення переможе?"

 WORLD_PAK.4.t: "[Get_newspaper_header]Пакистан виграє війну за незалежність"
 WORLD_PAK.4.d: "Рух Пакистану захопив Пенджаб і Сінд, змусивши Індію підписати з ним перемир'я і заморозивши лінію фронту у постійні кордони між двома державами. Жодна зі сторін не підписала формального договору, але реальність ясна: Пакистан - незалежна політична одиниця.\n\nТимчасовий уряд Пакистану оголосив конституційну конвенцію, на якій планується проголосити себе Ісламською Республікою. Він також подав заявку на вступ до Об'єднаного пакту та Європейської економічної спільноти. Уряд Райху, хоча й не підтвердив отримання такої заявки, оголосив, що їхнє приєднання до обох договорів буде прискорене якнайшвидше."
 WORLD_PAK.4.a: "Нова сила на Індусі."

 WORLD_PAK.40.t: "[Get_newspaper_header]Рух Пакистану розбитий"
 WORLD_PAK.40.d: "Залишки Руху Пакистану, представлені дрібним генералом А. А. К. Ніазі, чії вищі командири скоїли самогубства, втекли або були страчені, підписали акт капітуляції з урядом Індії в Бала Хіссарі Пешавара. Органи відновлення були створені в Північно-Західній прикордонній провінції та в Белуджистані для їх інтеграції до складу Індії.\n\nБільшість князівств, що підтримували Пакистан, в анексованих територіях були або піддані медіації, або їхні території були безпосередньо захоплені. Великі кількості німецької боєприпасів і ресурсів були захоплені Індійською армією, що підтвердило індійські підозри і викликало масовий гнів. Цей гнів змусив посольство Райху в Делі стати об'єктом щоденних протестів, включаючи від колишніх місцевих співробітників, яких уряд Нового Делі відмовився заспокоїти."
 WORLD_PAK.40.a: "От і все з вашою 'військовою расою'."

 WORLD_PAK.5.t: "[Get_newspaper_header]Конституційна конвенція Пакистану завершується"
 WORLD_PAK.5.d: "Конституційна конвенція Пакистану завершилася ухваленням парламентської системи. Формально завершуючи воєнний стан, уряд Пакистану оголосив себе Ісламською республікою, прихильною до шаріату, як він тлумачиться через англійське загальне право.\n\nПід час конвенції ходили чутки, що головний адміністратор воєнного стану Абдул Каюм Хан планував оголосити постійний воєнний стан і припинити конвенцію передчасно. Якщо такий план і існував, він зазнав невдачі, оскільки Абдул Каюм Хан був усунутий від усіх своїх посад, включаючи посаду головного адміністратора воєнного стану, яку скасували. Тепер влада належить новому прем'єр-міністру, колишньому союзнику і консерватору Ферозу Хану Нуну."
 WORLD_PAK.5.a: "Від правління мечем до куди?"

 WORLD_PAK.6.t: "[Get_newspaper_header]Оголошено надзвичайний стан у Північно-Західній прикордонній провінції"
 WORLD_PAK.6.d: "Надзвичайний стан було оголошено в Північно-Західній прикордонній провінції Пакистану, колишній базі Руху Пакистану до війни з Індією. Провінція опинилася в стані масових заворушень через пенджабськоцентричний характер нового уряду Фероза Хана Нуна і через сприйняття зради обіцянок, які дав Абдул Каюм Хан.\n\nПрикордонний корпус, військовий гарнізон регіону, було зміцнено десятками тисяч військових з індійського кордону. Очевидно, що уряд Пакистану має намір жорстоко придушити триваючий бунт. Багато паштунів з PML, зокрема колишній головний адміністратор воєнного стану Абдул Каюм Хан, порвали свої партійні картки на знак протесту, створивши відокремлену партію."
 WORLD_PAK.6.a: "Сьогодні твоя база, завтра - база твого ворога..."

 WORLD_PAK.7.t: "[Get_newspaper_header]Фероз Хан Нун переобраний прем'єр-міністром Пакистану"
 WORLD_PAK.7.d: "Фероз Хан Нун, чинний прем'єр-міністр Пакистану і голова Пакистанської мусульманської ліги, був переобраний прем'єр-міністром Пакистану.\n\nПерше його правління, яке відзначалося лише надзвичайним станом на прикордонному фронті (який, як вважається, він успішно, хоча й жорстоко, придушив), вважалося загалом успішним. Тому PML зберегла більшість своїх виборчих округів, втративши лише ті, що знаходяться в Північно-Західній прикордонній провінції.\n\nХоча Нун має міцний мандат, його здоров'я, за повідомленнями, далеко не таке ж міцне. Можливо, Пакистан скоро отримає нового прем'єр-міністра, незважаючи на стабільність правління PML."
 WORLD_PAK.7.a: "Династія переживе, навіть якщо чоловік цього не зробить."

 WORLD_PAK.8.t: "[Get_newspaper_header]Зульфікар Алі Бхутто обраний прем'єр-міністром Пакистану"
 WORLD_PAK.8.d: "Пакистанська мусульманська ліга втратила владу в Пакистані; Зульфікар Алі Бхутто з Сінду став новим прем'єр-міністром. Після некомпетентності уряду в ще триваючому прикордонному надзвичайному стані було майже напевно, що Фероз Хан Нун, чоловік, який це все загальмував, не залишиться прем'єр-міністром. Однак очікування, що інший пенджабський аристократ займе його місце, виявилось помилковим.\n\nРегіоналістська коаліція, орієнтована не на Пенджаб (хоча з місцевою підтримкою там, наприклад, від наваба Бахавалпуру), здобула владу з підйомом Зульфікара Алі Бхутто. Чи зможе вона утримати її, ще невідомо. Оскільки Бхутто мусить задовольняти всі елементи коаліції, щоб залишитися прем'єр-міністром, йому належить непросте завдання."
 WORLD_PAK.8.a: "Зміна влади?"

 WORLD_PAK.9.t: "[Get_newspaper_header]Мумтаз Даултана обраний прем'єр-міністром Пакистану"
 WORLD_PAK.9.d: "У шокуючому результаті Пакистанська мусульманська ліга втратила владу на користь відокремленого елемента самої себе - Функціональної мусульманської ліги, яку очолює Мумтаз Даултана, суперник колишнього прем'єр-міністра.\n\nКонсервативний землевласник Даултана знайшов нових союзників у розрізнених релігійних партіях Пакистану, які, загалом погодившись підтримати його проти уряду, допомогли йому здобути владу за рахунок його переможеного суперника. Зважаючи на цю підтримку, Даултана, ймовірно, розпочне політику подальшої легалізації ісламу, щоб задовольнити своїх нових союзників. Але він повинен бути обережним, щоб не відштовхнути своїх землевласників-союзників, на яких він значно більше залежить, ніж на духовенстві."
 WORLD_PAK.9.a: "Їзда на лісовому вогні часто призводить до опіків."

## Cambodia world news events

 WORLD_CAM.1.t: "[Get_newspaper_header]Війна Віал Том" #The Veal Thom War
 WORLD_CAM.1.d: "Напруженість в Індокитаї досягла критичної точки через останні події навколо повстання в Струнг-Тренгу, тепер часто зване "Війною Віал Том", після прибуття сил В'єтмінь до зони бойових дій. Після прибуття 12 000 кампучійських добровольців, озброєних для відновлення контролю над регіоном, президент Тхань змушений був ввести збройні сили під командуванням Дао Чхуона для стабілізації ситуації, що розгнівало націоналістів, які звинувачували його в зраді своїх співвітчизників на користь інтересів Таїланду та Лаосу.\n\nЦей інцидент є лише останнім у ряді невдач прем'єр-міністра Ахара Сока та його лівого уряду після провалу аграрних реформ та запланованих націоналізацій японських і китайських підприємств. Міжнародні спостерігачі вважають, що єдиний спосіб для Кампучії зберегти лице зараз - це придушити повстання та анексувати провінцію Струнг-Тренг, навіть якщо це стане ціною відносин з Лаосом."
 WORLD_CAM.1.a: "Знову війна між братами." #CPS option
 WORLD_CAM.1.b: "Загнана в кут лисиця." #rest of world

 WORLD_CAM.2.t: "[Get_newspaper_header]Лон Нол призначений прем'єр-міністром Кампучії" #Lon Nol Appointed Prime Minister in Kampuchea
 WORLD_CAM.2.d: "Після вбивства Ієу Коеуса та невдач Ахара Сока, генерал Лон Нол став останнім прем'єр-міністром Кампучії. Походячи з однієї з найвідоміших сімей Кампучії, Нол є головним представником руху Кампучія Кром - етнонаціоналістичного об'єднання, яке відоме своїми реваншистськими та ультранаціоналістськими поглядами щодо регіону Меконг-Дельта та своєю запеклою ненавистю до в'єтнамців.\n\nМіжнародні спостерігачі вважають це рухом президента Тханя вправо для отримання політичної підтримки. Однак це може бути не єдиною причиною, оскільки Лон Нол уже довів свою здатність нейтралізувати Дао Чхуона та його армії, які стали бунтівниками після невдалої спроби таїландсько-спонсорованого перевороту. У будь-якому випадку, політична ліва Кампучії вже заявила про своє невдоволення таким призначенням, оскільки масові відходи з КРПА здаються неминучими."
 WORLD_CAM.2.a: "Аби він тримав цих лівих у шорах." #CPS option
 WORLD_CAM.2.b: "Потрібен жорстокий, щоб убити жорстокого." #rest of world

 WORLD_CAM.3.t: "[Get_newspaper_header]Громадянська війна в Кампучії" #Kampuchean Civil War
 WORLD_CAM.3.d: "Після місяців сільських невдоволень урядом Пномпеня, в країні почався відкритий конфлікт, коли противники Тханя оголосили про створення суперницьких урядів. Зліва Ху Нім об'єднав багатьох незадоволених лівих і націоналістичних молодих людей з КРПА, втечучи з Пномпеня, щоб вести збройну боротьбу з сільської місцевості. Справа принц Нородом Чантарайнгсей зібрав свої сили "Вільних Кампучії" з націоналістів і селян, натхнених діями уряду щодо останніх заходів економії.\n\nХоча президент Тхань ще контролює Пномпеня, а отже більшість населення Кампучії, опозиція швидко розширює свій контроль над величезними територіями. Кампучія готується до довгої війни без чітких переможців на горизонті, але з мільйонами переможених."
 WORLD_CAM.3.a: "Можемо лише сподіватися, що наша сторона переможе." #CPS option
 WORLD_CAM.3.b: "Найлагідніша земля Азії розірвана на шматки." #rest of world

 WORLD_CAM.4.t: "[Get_newspaper_header]Республіканська революція в Кампучії" #Republican Revolution in Kampuchea
 WORLD_CAM.4.desc: "Після років громадянської війни, строката група республіканських активістів під керівництвом Ху Німа захопила Пномпен, встановивши себе єдиною владою, яка залишилась для керування Кампучією. Багато хто вважає їх темною конячкою цього конфлікту, вони довели невірним тих, хто вважав їх експертами, оскільки їхній запал і неортодоксальні партизанські тактики перемогли сили Вільних Кампучії та урядові війська.\n\nУ недавній промові Ху Нім, лівий, сильно впливовий на його навчання в Нанкіне, натякнув на свої майбутні політичні амбіції. Він розпочав її з осуду колишнього президента Тханя, який, як вважається, втік до Сайгону, пообіцявши провести справжню "республіканську революцію", щоб завершити нездійснені обіцянки попереднього режиму. Новий президент закликав своїх громадян звернутися до Китаю за прогресом, посилаючись на їхні успіхи в модернізації, а також пообіцяв дати відсіч тайському імперіалізму."
 WORLD_CAM.4.a: "Аби вони знали, хто їхні справжні господарі." #Japan option
 WORLD_CAM.4.b: "Передайте Ху Німу, що ми будемо на зв'язку." #China option
 WORLD_CAM.4.c: "Принаймні вони не комуністи." #CPS option
 WORLD_CAM.4.d: "Сфера дивиться на Китай у пошуках орієнтиру." #rest of world
 
 WORLD_CAM.5.t: "[Get_newspaper_header]Уряд Кампучії втримався; Сон Сан призначений прем'єр-міністром" #Kampuchean Government Holds On; Son Sann Appointed Prime Minister
 WORLD_CAM.5.d: "Відзначаючи переломний момент у триваючій громадянській війні Кампучії, помірковані фігури уряду президента Тханя взяли під домашній арешт його кабінет, змусивши президента призначити Сона Сана прем'єр-міністром. У своєму першому кроці на посаді прем'єра Сан звернувся до Токіо з проханням відправити японські війська для того, щоб зняти облогу Пномпеня та дозволити Кампучії відновити контроль над своєю територією. Прем'єр [JAP.GetLeader] вже задовольнив це прохання Сана.\n\nПовільно, але вперто, японські та урядові сили Кампучії незабаром придушать повстанців, відновлюючи порядок після років боротьби. Однак через руйнівні наслідки війни, більшість міжнародних спостерігачів вважають це пирровою перемогою. Очікується, що після великої реконструкції Японія буде утримувати більший контроль над Кампучією, оскільки країна буде змушена брати кредити для відновлення."
 WORLD_CAM.5.a: "Азія стоїть разом, сильніша, ніж будь-коли." #CPS option
 WORLD_CAM.5.b: "Вони перетворюють землю на пустелю і називають це миром." #rest of world

 WORLD_CAM.6.t: "[Get_newspaper_header]Нородом Сіанук повертається до влади в Кампучії" #Norodom Sihanouk Returns to Power in Kampuchea
 WORLD_CAM.6.d: "У іронічному повороті долі, Нородом Сіанук став останнім президентом Кампучії в кінці громадянської війни, скинувши режим і людину, яка першою прийшла до влади, скасувавши монархію Нородома. Рік тому приєднавшись до сил Вільних Кампучії, Сіанук зміг успішно підпорядкувати собі базу принца Нородома Чантарайнгсея, використавши її для перемоги над китайсько-підтримуваними республіканськими силами та урядом Пномпеня.\n\nЯк президент, першим наказом Сіанука стало засудження колишнього президента Сона Нгока Тханя до смерті заочно, оскільки той втік до Сайгону. У своїх останніх виступах Сіанук пообіцяв зберегти нейтральність Кампучії у конфліктах у межах Сфери, дистанціюючи себе від втручання Китаю та Таїланду під час громадянської війни. Проте його амбіції на майбутнє залишаються загадкою."
 WORLD_CAM.6.a: "Здається, старого монарха таки можна навчити новим трюкам." #CPS option
 WORLD_CAM.6.b: "Людина, народжена, щоб правити." #rest of world

 WORLD_CAM.7.t: "[Get_newspaper_header]В'єтнамське вторгнення до Кампучії" #Vietnamese Invasion of Kampuchea
 WORLD_CAM.7.d: "Скориставшись увагою Японії, спрямованою в інше місце, та вразливим становищем Кампучії, Демократична Республіка В'єтнам мобілізувала свої війська для скидання нинішнього режиму. [CAM.GetLeader] виступив проти цього нападу в своєму останньому виступі, закликаючи кожного спроможного кампучійця встати на захист своєї нації від "ставання частиною нової В'єтнамської імперії".\n\nПроте багато в Кампучії з радістю спостерігають за тим, як їхній режим буде поглинений В'єтнамом. Ветеран Індокитайської комуністичної партії та лідер Комуністичної партії Кампучії, Сон Нгок Мін, пообіцяв, що він та його бійці зроблять все можливе для підтримки вторгнення в дусі революційного дефетизму. Якщо Японія не вирішить втрутитися, ймовірно, що Республіка не довго протримається."
 WORLD_CAM.7.a: "Комуністична тиранія не знає меж!" #CPS option
 WORLD_CAM.7.b: "Міжнародний пролетаріат не знає кордонів." #Communist/Socialist option
 WORLD_CAM.7.c: "Визволення дулом гвинтівки." #rest of world

 WORLD_CAM.8.t: "[Get_newspaper_header]Друге японське вторгнення до Індокитаю" #Vietnamese Invasion of Kampuchea
 WORLD_CAM.8.d: "Як очікувалося, у відповідь на вторгнення В'єтнаму в Кампучію, Японія здійснила контр-вторгнення проти комуністичних держав Кампучії та В'єтнаму, щоб "визволити народ від комуністичного гноблення". Як [CAM.GetLeader], так і [VIC.GetLeader] випустили спільну заяву, засуджуючи японський імперіалізм, порівнюючи його з англійським чи французьким імперіалізмом, обіцяючи ніколи не здаватися у боротьбі за свободу.\n\nОднак, незалежно від того, чи хочуть вони здатися чи ні, перемога над супердержавою через надмірну силу виглядає неминучою. Але, хоча комуністичний уряд може бути знищений, міжнародні спостерігачі прогнозують, що вони переродяться у партизанські сили, щоб протистояти режиму, який Японія встановить на їхньому місці. Однак наразі, свобода народу Кампучії та В'єтнаму вимірюється годинами."
 WORLD_CAM.8.a: "Порядок незабаром буде відновлено." #CPS option
 WORLD_CAM.8.b: "Їхня хоробрість стане прикладом для нас усіх." #Communist/Socialist option
 WORLD_CAM.8.c: "Краще прожити один день королем..." #rest of world

 WORLD_CAM.9.t: "[Get_newspaper_header]Воєнний стан оголошено в Кампучії" #Martial Law Declared in Kampuchea
 WORLD_CAM.9.d: "Після вбивства Ієу Коеуса та невдач Ахара Сока, президент Сон Нгок Тхань взяв ситуацію під свій контроль, оголосивши воєнний стан в Кампучії та призначивши вірного Пача Чхуона прем'єр-міністром. В промові після цього кроку Тхань зазначив невдачі та неефективність компромісної системи управління, що виникла в Кампучії після наслідків Операції Іссара, звинувативши консенсусний процес у невдачах Республіки.\n\nПопри те, що Тхань залишається особисто популярним, особливо після нейтралізації Лона Нола та його бунтівної армії, міжнародні спостерігачі задаються питанням, чи буде цього достатньо для подолання незадоволення через такий явно диктаторський крок. Лише час покаже, але багато хто вважає, що доля Кампучії не лежить в її власних руках, а в руках Таїланду, оскільки його свідомість або недбалість можуть стати вирішальними для її майбутнього."
 WORLD_CAM.9.a: "Що він зробить далі?" #CPS option
 WORLD_CAM.9.b: "Ще одна країна відмовляється від ідеї консенсусу." #rest of world

 WORLD_CAM.10.t: "[Get_newspaper_header]Кампучія націоналізує китайські активи" #Kampuchea Nationalizes Chinese Assets
 WORLD_CAM.10.desc: "У шокуючій новині, що має широкі наслідки для бізнес-світу Азії, президент Сон Нгок Тхань наказав націоналізувати всі китайські активи в Кампучії, що набирає чинності негайно. Аналітики в регіоні вважають, що цей розвиток подій пов'язаний з недавньою поразкою країни у Війні за Веал Тхом, що змусило Тханя прийняти такий радикальний крок у рамках його «нової кампучійської революції», хоча інші вважають, що цей крок був зроблений для придушення націоналістичного обурення після ганебної поразки.\n\nВже почався масовий вихід китайців з Кампучії, і надходять повідомлення про насильство проти цієї меншини. Президент [CHI.GetLeader] засудив дії Кампучії, назвавши їх протилежними паназійським цінностям, але утримався від подальших дій. Оскільки політична позиція Тханя зміцнилася, багато хто задається питанням, що відбудеться далі в цій революції."
 WORLD_CAM.10.a: "Він добре подумає, перш ніж спробувати те саме з нашими активами." #Japan option
 WORLD_CAM.10.b: "Дії божевільного." #China option
 WORLD_CAM.10.c: "Сподіваємось, наші активи залишаться в безпеці." #Guangdong option
 WORLD_CAM.10.d: "Цинічне політиканство, вбране в шати революційної дії." #rest of world

 WORLD_CAM.11.t: "[Get_newspaper_header]Прем'єр-міністр Кампучії помер на посаді" #Kampuchean Prime Minister Dies in Office
 WORLD_CAM.11.d: "Сьогодні державні ЗМІ Кампучії підтвердили смерть ветерана-націоналіста та прем'єр-міністра Кампучії Пача Чхуона, пообіцявши провести розслідування підозрілих обставин його смерті. Термін перебування Чхуона на посаді прем'єра став періодом відновлення політичної лівиці Кампучії, оскільки президент Тхань почав свою «Кампучійську революцію», кампанію, яка допомогла модернізувати країну через земельну реформу, зменшення міської нерівності та початок нового п'ятирічного плану.\n\nБоротьба за те, хто стане наступним прем'єр-міністром Кампучії, йде між двома кандидатами. Найбільш ймовірним кандидатом є Еа Січау, довірена особа Тханя та фігура, схожа на Чхуона. Однак також вважається, що сільський популіст Х'єу Сампан є сильним кандидатом, відомим своєю роботою з земельною реформою. Однак Тхань залишатиметься президентом, оскільки його популярність досягла висот, яких не бачили жодні старі монархи."
 WORLD_CAM.11.a: "Нам не бракуватиме за вами." #China option
 WORLD_CAM.11.b: "Висловімо наші співчуття." #CPS option
 WORLD_CAM.11.c: "Кампучія, безсумнівно, бере ідею Девараджи близько до серця." #rest of world

 WORLD_CAM.12.t: "[Get_newspaper_header]Президента Кампучії поміщено під домашній арешт" #Kampuchean President Placed Under House Arrest
 WORLD_CAM.12.d: "Після кризи довіри до уряду Кампучії національна асамблея була розпущена, а президент Тхань поміщений під домашній арешт у результаті м'якого перевороту проти нього. Каталізатором цих дій, ймовірно, стала помітна націоналістична фігура Кенг Ван Сак, який недавно відкликав свою підтримку уряду Тханя. У промові, де він оголосив про це відмову, Ван Сак звинуватив Тханя в зраді національних інтересів Кампучії через його проросійську політику, назвавши його маріонеткою і зрадником для Хмерів Кром.\n\nЙем Самбаур, помітний консерватор і ініціатор цього перевороту, замінив Пача Чхуона на посту прем'єр-міністра Кампучії. Хоча Тхань залишився президентом, його позиція була позбавлена всієї влади, і Самбаур тепер вважається реальним керівником Кампучії."
 WORLD_CAM.12.a: "На одну проблемну дитину в Сфері менше." #CPS option
 WORLD_CAM.12.b: "Ось і кінець Девараджі." #rest of world

 WORLD_CAM.13.t: "[Get_newspaper_header]Переворот у Кампучії" #Coup in Kampuchea
 WORLD_CAM.13.d: "Після кризи довіри до уряду Кампучії національна асамблея звільнила Тханя з посади президента за наказом генерала Лона Нола, скориставшись тим, що Тхань знаходився з дипломатичним візитом у Токіо. Каталізатором цих дій, ймовірно, стала помітна націоналістична фігура Кенг Ван Сак, який відкликав свою підтримку уряду Тханя. У промові, де він оголосив про це відмову, Ван Сак звинуватив Тханя в зраді національних інтересів Кампучії через його проросійську політику, назвавши його маріонеткою і зрадником для Хмерів Кром.\n\nЗахопивши Йема Самбаура, який, як вважалося, організовував власний переворот проти Тханя, Лон Нол став новим президентом Кампучії. Зважаючи на відомі етнонаціоналістичні погляди Лона Нола та його реваншистські амбіції щодо Кампучії Кром, міжнародні спостерігачі прогнозують, що напруженість в Індокитаї буде наростати."
 WORLD_CAM.13.a: "Пішла одна проблемна дитина, прийшла інша." #CPS option
 WORLD_CAM.13.b: "Демократія в дії." #rest of world

 WORLD_CAM.14.t: "[Get_newspaper_header]Контрпереворот у Кампучії" #Counter Coup in Kampuchea
 WORLD_CAM.14.d: "У несподіваному повороті долі, президент Лон Нол був скинутий з влади в результаті кривавого перевороту, організованого його власним братом Лоном Ноном. Відомий своїми реваншистськими заявами проти своїх сусідів, Нол став парією в регіоні, оскільки інші країни почали плести змови проти нього. Бенефіціаром цих змов став Лон Нон, який охоче прийняв підтримку Таїланду та В'єтнаму в своїй боротьбі за президентство. У цьому перевороті йому допомогли тайські інтереси, ув'язнений консервативний політик Йем Самбаур і політична база останнього.\n\nСтавши президентом, Лон Нон пообіцяв відновити добрі відносини між Кампучією та Лаосом, Таїландом і В'єтнамом. Кожна з цих трьох країн швидко відреагувала оптимістично на це послання, оскільки напруженість в Індокитаї спала до стану недовіри."
 WORLD_CAM.14.a: "Найкращий реально можливий результат." #CPS option
 WORLD_CAM.14.b: "Я можу це зрозуміти." #Bormann option
 WORLD_CAM.14.c: "Власним братом? Оце так витвір..." #rest of world
 
 ### New Zealand News Events ###
 
 WORLD_NZ.1.t: "[Get_newspaper_header]Національна партія переобрана в Новій Зеландії"
 WORLD_NZ.1.d: "Після запеклих виборів, що були зосереджені на зовнішньополітичних питаннях, від наслідків смерті Гітлера до війни в Південній Африці, стало відомо, що Національна партія здобула перемогу на виборах в Новій Зеландії. Міжнародні спостерігачі вважають, що ця перемога уряду Холйоука зумовлена досягненнями в самопроголошеній «крусаді проти фашизму», коли новозеландські війська допомогли Америці в скиненні режимів, дружніх до Німеччини та Японії.\n\nТепер, вступаючи в третій термін, коментатори вважають, що успіх Холйоука на виборах лише зміцнив його рішучість у військових діях, на чому він наголосив у своїй першій промові після переобрання. У промові також було згадано плани щодо переговорів про нову угоду про вільну торгівлю з Австралією та зобов'язання обережно витрачати податкові гроші. Вашингтон надіслав привітання пану Холйоуку з перемогою."
 WORLD_NZ.1.a: "Потрібна людина на потрібному місці!"
 WORLD_NZ.1.b: "Ківі жадають крові."
 WORLD_NZ.1.c: "Америка далеко не самотня."

 WORLD_NZ.2.t: "[Get_newspaper_header]Лейбористська партія обрана в Новій Зеландії"
 WORLD_NZ.2.d: "Після запеклих виборів, що були зосереджені на зовнішньополітичних питаннях, від наслідків смерті Гітлера до війни в Південній Африці, стало відомо, що Лейбористська партія знову повернулася до влади після трирічної відсутності. Перемогу Лейбористів приписують харизмі лідера Нормана Кірка, хоча міжнародні спостерігачі зауважили, що зовнішньополітичні невдачі Холйоука в останніх конфліктах значно сприяли поразці Національної партії.\n\nПовернувши Лейбористів до влади після буремного уряду Неша, що передував приходові Холйоука, новий прем'єр-міністр Норман Кірк пообіцяв зменшити військові авантюри, які стали звичними під час попереднього уряду. Однак Кірк заспокоїв яструбів, пообіцявши, що Нова Зеландія все ж залишатиметься відданою захисту Південної Африки від фашизму, а також натякнув на збільшення торгівлі з Америкою."
 WORLD_NZ.2.a: "Сумний крок назад у хрестовому поході проти фашизму."
 WORLD_NZ.2.b: "Дивно, що вони взагалі здатні засвоювати уроки."
 WORLD_NZ.2.c: "Подивимось, чи зможе він повернути лейбористів на коня."

 WORLD_NZ.3.t: "[Get_newspaper_header]Національна партія знову переобрана в Новій Зеландії"
 WORLD_NZ.3.d: "Ще одна перемога для Національної партії, прем'єр-міністр Кіт Холйоук очолив партію до нової виборчої перемоги. Багато міжнародних спостерігачів приписують це його численним зовнішньополітичним успіхам за цей термін, що дозволило йому з легкістю зобразити свого суперника, більш пацифістського лідера Лейбористів Х'ю Ватта, як боягуза, готового дозволити фашизму процвітати.\n\nВступаючи на пост прем'єр-міністра Нової Зеландії на третій термін, Кіт Холйоук виголосив промову, у якій відзначив цінності ОВН, пообіцявши продовжити крусаду проти фашизму та зміцнити торгівлю і зв'язки з іншими країнами ОВН.\n\nПрезидент [USA.GetLeader] привітав Холйоука з перемогою та запросив його до Вашингтона в найближчий час."
 WORLD_NZ.3.a: "Наш найулюбленіший хрестоносець повертається."
 WORLD_NZ.3.b: "Новій Зеландії ніяк не насититися цим імперіалістом."
 WORLD_NZ.3.c: "Третій раз - не менш вдалий."

 WORLD_NZ.4.t: "[Get_newspaper_header]Лейбористська партія переобрана в Новій Зеландії"
 WORLD_NZ.4.d: "Після виборів Нова Зеландія знову повернула Лейбористську партію до влади, порушивши амбіції Національної партії. Прем'єр-міністр Норман Кірк вдало відбив атаки Роберта Мулдуна з Національної партії, звинувачуючи Кірка та Лейбористів у не виконанні своїх зобов'язань перед ОВН. Однак Кірк зміг відстояти свою позицію завдяки власній бомбастичній особистості та, звернувшись до досягнень у зовнішній політиці, переміг на публіці.\n\nУ своїй першій промові після результатів виборів Кірк ще раз підкреслив свою відданість поміркованому та обережному підходу до ОВН, пообіцявши не дозволяти ківі гинути за жодні справи, які він морально не підтримує. В іншому ж Кірк пообіцяв розвивати дипломатичні та торгові зв'язки з Америкою, щоб запобігти зростанню впливу Японії в Океанії."
 WORLD_NZ.4.a: "Щасливий результат."
 WORLD_NZ.4.b: "Здається, у нього є певна витривалість."
 WORLD_NZ.4.c: "Лейбористи продовжують тримати позиції."

 WORLD_NZ.5.t: "[Get_newspaper_header]Національна партія обрана в Новій Зеландії"
 WORLD_NZ.5.d: "Несподівана перемога для Національної партії в Новій Зеландії під керівництвом Роберта Мулдуна. Мулдун виступав із критикою зовнішньої політики Кірка, звинувачуючи його в «капітулюванні перед фашизмом» через його м'які дії щодо деплойменту військ за час його перебування на посаді. Попри початкове залучення виборців завдяки харизмі, Кірк не зміг конкурувати з різким ставленням Мулдуна, і останній врешті здобув підтримку важливих коливних виборців.\n\nУ своїй першій промові прем'єр-міністр Роберт Мулдун пообіцяв підтримувати ОВН «де б не була загроза свободі» та продовжити крусаду проти фашизму. Однак зовнішня політика не була єдиною темою, яка обговорювалася. Мулдун також пообіцяв зосередити економіку Нової Зеландії на внутрішньому розвитку, засудивши надмірні імпорти з Америки, які, на його думку, заполонили ринки Нової Зеландії під час перебування його попередника на посаді."
 WORLD_NZ.5.a: "Цікавий персонаж, але наш."
 WORLD_NZ.5.b: "Ще один кровожерливий поборник війни."
 WORLD_NZ.5.c: "Англійський вплив знову заявляє про себе."

 WORLD_NZ.6.t: "[Get_newspaper_header]Лейбористська партія обрана в Новій Зеландії"
 WORLD_NZ.6.d: "У несподіваному повороті подій Лейбористська партія здобула більшість на останніх виборах, усунувши діючу Національну партію від влади. Аналітики виборів у Новій Зеландії вказують на два основні фактори падіння Національної партії: перший - це помилки прем'єр-міністра Кіта Холйока у зовнішній політиці, а другий - це спритне використання лідером Лейбористів Х'ю Уоттом незадоволення громадськості щодо цих військових авантюр проти Холйока.\n\nУ своїй першій промові після того, як він став прем'єр-міністром, Х'ю Уотт заявив, що його першою метою буде виведення новозеландських військових із усіх конфліктів за кордоном, посилаючись на гуманітарні витрати на війни. Інша частина промови була присвячена економічним питанням, обіцяючи припинити спроби Холйока зруйнувати політику обов'язкових профспілок в Новій Зеландії та зміцнити соціальну державу."
 WORLD_NZ.6.a: "Сльозливе серце! Останнє, що нам потрібно..."
 WORLD_NZ.6.b: "Ми щасливо вітаємо всі спроби припинити кровопролиття."
 WORLD_NZ.6.c: "Чи є шанс на мир?"

 WORLD_NZ.7.t: "[Get_newspaper_header]Національна партія знову обрана в Новій Зеландії"
 WORLD_NZ.7.d: "У перемозі, яку чекали вже давно, Національна партія здобула свою четверту підряд перемогу на виборах під керівництвом Кіта Холйока. Міжнародні спостерігачі приписують його перемогу його сталому управлінню країною, співчутливо-консервативному ставленню та успіхам у зовнішній політиці, які більше приваблюють виборців, ніж пацифістські настрої Лейбористів та їхні соціальні реформи, представлені лідером партії Мартином Фінлеєм.\n\nУ своїй першій промові після повернення до влади Холйок запевнив виборців, що він продовжить підтримувати 'справедливі' інтервенції проти фашистських ворогів ОВН і продовжить працювати з Австралією для переговорів про вільніші економічні торгові угоди. Незважаючи на свою перемогу, коментатори відзначають, що дедалі більше новозеландців стають незадоволені його впертим консерватизмом, що вказує на можливе майбутнє невдоволення."
 WORLD_NZ.7.a: "Сталість як завжди."
 WORLD_NZ.7.b: "Очікуване розчарування."
 WORLD_NZ.7.c: "Він буде правити вічно?"

 WORLD_NZ.8.t: "[Get_newspaper_header]Лейбористська партія знову обрана в Новій Зеландії"
 WORLD_NZ.8.d: "У передбачуваній перемозі Лейбористської партії, прем'єр-міністр Норман Кірк привів партію до перемоги над Національною партією втретє. Місцеві експерти приписують цю перемогу його домінуючій поведінці під час дебатів з лідером Національної партії Джеком Маршаллом, який, в порівнянні, був сприйнятий як тихий і сором'язливий.\n\nУ своїй першій промові після повернення до парламенту Кірк пообіцяв, що його термін буде спрямований на створення можливостей для всіх, чи то маорі, чи то новозеландців. Він також повторно заявив свої зобов'язання щодо розширення соціального житла, детально описавши свої плани по будівництву великої кількості будинків 'щоб жоден громадянин не залишився без даху над головою'.\n\nМіжнародні спостерігачі вважають, що ця перемога підтверджує його згортання військових інтервенцій Холйока, вважаючи, що майбутні прем'єр-міністри будуть слідувати за керівництвом Кірка, а не Холйока."
 WORLD_NZ.8.a: "Тривожний прецедент."
 WORLD_NZ.8.b: "Приємний розвиток."
 WORLD_NZ.8.c: "Лейбористи справді були воскресені."

 WORLD_NZ.9.t: "[Get_newspaper_header]Національна партія знову обрана в Новій Зеландії"
 WORLD_NZ.9.d: "У неймовірній перемозі для Національної партії прем'єр-міністр Роберт Мулдун привів свою партію до перемоги на виборах, які були далеко не гарантованими. Коментатори зазначають, що успіх його агресивної зовнішньої політики став вирішальним фактором для багатьох коливальних виборців. В поєднанні з пацифістською позицією його опонента, лідера Лейбористів Мартіна Фінлея, багато хто вважав переобрання Мулдуна неминучим, допомогли йому його жорстокі атаки на Фінлея за його 'страхітливість'.\n\nУ своїй першій промові після того, як результати виборів надали йому ще один термін як прем'єр-міністру, Мулдун говорив про відданість Нової Зеландії ОВН і захист її важко здобутих свобод від Японії та наступу КПС. Мулдун також повторно заявив свої виборчі обіцянки щодо поліпшення та збагачення пенсійної системи Нової Зеландії 'щоб нагородити тих, хто працював найважче'."
 WORLD_NZ.9.a: "Якби таких людей було більше в ОВН."
 WORLD_NZ.9.b: "Принаймні у них немає ядерного арсеналу."
 WORLD_NZ.9.c: "Перемога Мулдуна спершу, і Національної партії другорядно."

 WORLD_NZ.10.t: "[Get_newspaper_header]Лейбористська партія обрана в Новій Зеландії"
 WORLD_NZ.10.d: "У несподіваній перемозі Лейбористів, прем'єр-міністр Х'ю Уотт отримав ще один мандат від народу Нової Зеландії після своєї перемоги на виборах. Під час дебатів з лідером Національної партії Джеком Маршаллом, Уотт зміг продемонструвати себе як більш гідну і шляхетну особистість, здатну правильно захищати і вигравати виборців на свою користь із політикою пацифістського невтручання, водночас обіцяючи продовжити членство в ОВН.\n\nПочинаючи свій другий термін на посаді прем'єр-міністра, Уотт використав свою вступну промову для підтвердження своїх зобов'язань щодо профспілок, пообіцявши використати свій новий мандат для роботи над усуненням 'демократичного дефіциту' на робочому місці. Уотт також пообіцяв боротися з проблемою безробіття, присягнувши зробити все можливе, щоб жоден працівник не побачив свою родину голодною."
 WORLD_NZ.10.a: "Інші з нас повинні будуть нести цей тягар за нього."
 WORLD_NZ.10.b: "Якби більше західних країн навчалися з його прикладу."
 WORLD_NZ.10.c: "Мир доводить свою цінність."

 WORLD_NZ.11.t: "[Get_newspaper_header]Національна партія обрана в Новій Зеландії"
 WORLD_NZ.11.d: "У шокуючій поразці для Лейбористів, Національна партія здобула перемогу на останніх виборах, забезпечивши Джеку Маршаллу термін прем'єр-міністра. У своєму аналізі перемоги, коментатори припускають, що коливальні виборці знайшли спокійну та врівноважену манеру Маршалла освіжаючим повітрям. Його шанси збільшилися через проблеми його опонента в державних установах, особливо щодо часто спірного питання військових інтервенцій за кордоном.\n\nУ своїй першій промові після того, як він став прем'єр-міністром, Джек Маршалл пообіцяв обмежити 'розв'язане та надмірне профспілкове рухання', проблему, яку він вважає такою, що виросла через попередній уряд Лейбористів. Він також пообіцяв підтримку ОВН у військових діях, хоча джерела, близькі до нього, вважають, що ця підтримка буде знижена і слабша, ніж та, яку надавав попередній уряд Холйока."
 WORLD_NZ.11.a: "Крок у правильному напрямку."
 WORLD_NZ.11.b: "Ще один війсковий яструб, хоча й дещо сором'язливий."
 WORLD_NZ.11.c: "Повернення манери джентльмена в новозеландську політику."

 WORLD_NZ.12.t: "[Get_newspaper_header]Лейбористська партія обрана в Новій Зеландії"
 WORLD_NZ.12.d: "Вражаючий переворот для Лейбористської партії: нещодавні вибори дали їм перевагу над Національною партією, що дозволило лідеру Лейбористської партії Мартину Фінлею стати наступним прем'єр-міністром Нової Зеландії. Хоча багато політичних аналітиків Ківі вважали, що Національна партія вийде на перше місце, ті, хто підтримували Лейбористів, вважали, що помилки уряду Національної партії у зовнішній політиці дали достатньо підстав, щоб Лейбористи повалили їхнє правління, що стало ще більш ймовірним завдяки рішучим антиінтервенціоністським позиціям Фінлея.\n\nУ своїй першій промові після перемоги на виборах прем'єр-міністр Мартін Фінлей повторив свою відданість ОВН, але також пообіцяв утримати Нову Зеландію від війни. Потім він обіцяв масштабну соціальну реформу, зокрема щодо декриміналізації абортів та гомосексуальності, що викликало незадоволення у багатьох депутатів Національної партії.\n"
 WORLD_NZ.12.a: "Пошлемо наші співчуття Національній партії."
 WORLD_NZ.12.b: "Дивна постать, але приємна."
 WORLD_NZ.12.c: "Сміливі пропозиції, але чи готова Нова Зеландія до них?"

 WORLD_NZ.13.t: "[Get_newspaper_header]Прем'єр-міністр Ківі йде у відставку; на його місце приходить заступник"
 WORLD_NZ.13.d: "Навіть у найвіддаленіших куточках світу Олійна криза продовжує мати вплив, про що свідчить відставка прем'єр-міністра Нової Зеландії. Лідер Національної партії залишив свою посаду після того, як виявився неспроможним укласти прийнятну угоду для завершення загального страйку, що охопив його країну з початку Олійної кризи. Це призвело до колапсу профспілок, пов'язаних з партією, і поширеної економічної турбулентності.\n\nКолишній заступник прем'єр-міністра, а тепер новий прем'єр-міністр Браян Талбойс став новим лідером Національної партії. Модерний лідер, Талбойс пообіцяв завершити страйк будь-якими засобами, щоб відновити порядок в економіці. У відповідь лідер профспілок Білл Андерсен заявив, що порядок буде відновлено тільки після того, як Національну партію відсторонять від влади, що виглядає дедалі ймовірніше.\n"
 WORLD_NZ.13.a: "Сподіваємось, він зуміє втримати владу."
 WORLD_NZ.13.b: "Нехай грає траурна пісня на найменшій скрипці світу."
 WORLD_NZ.13.c: "Ще один союзник Америки залишений на холоді."

 WORLD_NZ.14.t: "[Get_newspaper_header]Національна партія знову переобрана в Новій Зеландії"
 WORLD_NZ.14.d: "У тому, що виглядає майже як неминучість у ці дні, Національна партія знову виграла вибори в Новій Зеландії. Віра людей у керівництво Кіта Голіоке була непереможною навіть для Олійної кризи, яка не змогла його скинути, оскільки атака лідера Лейбористської партії Боба Тізарда на 'Ківі Кіта' не принесла результату, а натомість викликала зворотний ефект, оскільки виборці розчарувалися в його негативізмі.\n\nОднак, коли прем'єр-міністр виголосив чергову промову в парламенті після своєї переобрання, його тон, а не зміст його промови, став темою обговорення. Політичні аналітики висміювали його зупинене мовлення, вагання і помилки. У більш серйозному ключі інші вказали, що Голіоке не готовий до ще одного повного терміну, оскільки ходять чутки про боротьбу за лідерство в Національній партії щодо того, хто в підсумку змінить його на посаді.\n"
 WORLD_NZ.14.a: "Трудно уявити Нову Зеландію без нього."
 WORLD_NZ.14.b: "Нас тут не буде шкодувати."
 WORLD_NZ.14.c: "Кінець ери."

 WORLD_NZ.15.t: "[Get_newspaper_header]Лейбористська партія знову переобрана в Новій Зеландії"
 WORLD_NZ.15.d: "Ще одна перемога для політичного велетня Нормана Кірка, Лейбористи виграли нещодавні позачергові вибори Нової Зеландії. Політичні коментатори вважають, що його тріумф не здивував, зазначаючи його неймовірно високі рейтинги схвалення та особисту популярність серед виборців. Це стало яскравим контрастом до непослідовного стилю лідера Національної партії Браяна Талбойса, який не викликав особливої довіри у потенційних прихильників.\n\nУ своїй першій промові після оголошення результатів виборів Кірк святкував ще одну перемогу для Лейбористів і пообіцяв продовжити свою програму для Нової Зеландії, яка збагатить усіх її громадян. Однак багато хто висловив стурбованість щодо здоров'я прем'єр-міністра. "Великий Норм", як його називають його прихильники, мав проблеми з вагою протягом усіх своїх термінів, і поїздки до лікарні стали звичними. Хоча він досі вижив, багато хто боїться, що найгірше ще попереду.\n"
 WORLD_NZ.15.a: "Що робитиме Лейбористська партія без нього?"
 WORLD_NZ.15.b: "Наші співчуття жертвам хрестових походів Нової Зеландії."
 WORLD_NZ.15.c: "Велика людина з ще більшою спадщиною."

 WORLD_NZ.16.t: "[Get_newspaper_header]Національна партія знову переобрана в Новій Зеландії"
 WORLD_NZ.16.d: "У потрібній перемозі після бурхливого терміну на посаді Національна партія отримала виграш після того, як провела позачергові вибори. Коли це було оголошено, деякі спекулювали, що Мулдун прийняв рішення, будучи п'яним, але прем'єр-міністр довів своїм критикам, що вони помилялися. Лідер Лейбористської партії Боб Тізард виявився не конкурентом для власного отруйного стилю Мулдуна, оскільки останній виявився більш вражаючим у виступах, за що його підтримали виборці.\n\nПід час своєї останньої промови після переобрання, Мулдун пообіцяв не скорочувати соціальне забезпечення Нової Зеландії або майбутні проекти розвитку. Однак це рішення викликало хвилювання в Національній партії, багато з яких вже незадоволені Мулдуном. Чи здійснять вони кроки проти свого прем'єр-міністра, зрештою залежатиме від того, як буде розвиватися економіка в наступні місяці.\n"
 WORLD_NZ.16.a: "Сподіваємося, наш улюблений хрестовий походець залишиться на посаді."
 WORLD_NZ.16.b: "Навіть його власна партія вважає його тираном."
 WORLD_NZ.16.c: "Все залежить від економіки..."

 WORLD_NZ.17.t: "[Get_newspaper_header]Лейбористська партія знову переобрана в Новій Зеландії"
 WORLD_NZ.17.d: "У очікуваній, хоча й невизначеній перемозі, Лейбористська партія виграла свої останні позачергові вибори. Прем'єр-міністр Х'ю Ватт отримав похвалу за свій примирливий підхід до можливих заворушень під час Олійної кризи, проводячи довгі години з представниками профспілок для переговорів про справедливі угоди. Коли це сталося, Національна партія не змогла протистояти цьому, не змогла переманити плаваючих виборців на свій бік.\n\nУ своїй першій промові після переобрання на пост прем'єр-міністра Х'ю Ватт пообіцяв продовжити свою попередню програму, заявивши, що зробить індустріальну демократію реальністю в Новій Зеландії. Однак джерела в його партії висловили стурбованість щодо його віку та труднощів з діабетом, деякі навіть побоюються, що його час на посаді може бути обмеженим. Лише час покаже, чи обґрунтовані їхні побоювання, чи це лише можливості для опортуністів.\n"
 WORLD_NZ.17.a: "Чим швидше прийдуть зміни, тим краще."
 WORLD_NZ.17.b: "Сподіваємося, що він залишиться... заради наших інтересів."
 WORLD_NZ.17.c: "Він, без сумніву, відданий, якщо нічого іншого."

 WORLD_NZ.18.t: "[Get_newspaper_header]Національна партія знову переобрана в Новій Зеландії"
 WORLD_NZ.18.d: "У тяжко здобутій перемозі Національна партія під керівництвом прем'єр-міністра Джека Маршалла виграла у позачергових виборах. Хоча Олійна криза серйозно вплинула на Нову Зеландію, управління Маршалла в процесі економічного відновлення отримало широку похвалу за його ефективні адміністративні навички. На цьому фоні спроби Лейбористів вести негативну кампанію проти нього зазнали тяжкої невдачі, що призвело до їх поразки на виборах.\n\nУ своїй першій промові після переобрання Маршалл пообіцяв повернути економіку Нової Зеландії до рівня до Олійної кризи. Він повторив своє зобов'язання щодо економічно ліберальної Нової Зеландії та планів щодо зниження податків. Критики відзначили, що в його промові не згадувалися субсидії для сільського господарства та рибальства, незважаючи на те, що ці галузі складають найбільші витрати Нової Зеландії, і зауважили, що вони залишаться незмінними, оскільки ці галузі є важливою частиною бази Національної партії.\n"
 WORLD_NZ.18.a: "Надішлемо йому наші вітання!"
 WORLD_NZ.18.b: "Олігархи добре поїдять сьогодні ввечері."
 WORLD_NZ.18.c: "Він здається добрим джентльменом."

 WORLD_NZ.19.t: "[Get_newspaper_header]Національна партія знову переобрана в Новій Зеландії"
 WORLD_NZ.19.d: "Вражаюча перемога партії, яка розпалася кілька місяців тому, Національна партія нещодавно виграла свої останні позачергові вибори. Браян Талбойс, який нещодавно успадкував роль прем'єр-міністра після того, як його попередник подав у відставку через нездатність справитися з Олійною кризою, був вважався божевільним пресі, коли вперше оголосив свої плани. Однак після чудової кампанії його опоненти з Лейбористів залишилися глибоко збентеженими.\n\nУ своїй першій промові після повернення на посаду прем'єр-міністра Талбойс подякував громадянам за їхню довіру до нього. Він продовжив деталізувати свій план економічного відновлення та порятунку підприємств, які постраждали під час загального страйку. Хоча він не згадував це під час промови, багато аналітиків вважають, що Талбойс буде намагатися обмежити владу профспілок, щоб уникнути долі свого попередника.\n"
 WORLD_NZ.19.a: "Божественне втручання - єдине розумне пояснення цього."
 WORLD_NZ.19.b: "Як Лейбористи могли так сильно зіпсувати все?"
 WORLD_NZ.19.c: "Цей Талбойс, здається, дійсно чудотворець."

 WORLD_NZ.20.t: "[Get_newspaper_header]Лейбористська партія знову переобрана в Новій Зеландії"
 WORLD_NZ.20.d: "У несподіваній перемозі Лейбористів прем'єр-міністр Мартін Фінлей здобув собі ще один термін після того, як його рішення щодо позачергових виборів виправдалося. Багато вважали це рішення погано обміркованим, але ці критики були спростовані, оскільки Національна партія не змогла використати економічні труднощі, викликані Олійною кризою, щоб переконати плаваючих виборців, що Національна партія - це правильний вибір для них.\n\nПісля підтвердження результатів виборів Фінлей розповів про свої плани на другий термін у промові. Він вибачився за те, що економічні труднощі Олійної кризи затримали його плани щодо соціальних реформ і пояснив, як він використає свій новий мандат, щоб продовжити роботу, яку він обіцяв громадянам під час свого першого обрання, зокрема, декриміналізацію гомосексуальних актів. Хоча неприязнь до цієї пропозиції триває, вона здається неминучою.\n"
 WORLD_NZ.20.a: "Нова Зеландія робить сміливі кроки вперед."
 WORLD_NZ.20.b: "Лише б він продовжував не втручатися в наші справи."
 WORLD_NZ.20.c: "Лейбористи продовжують рухатися вперед."

 WORLD_NZ.21.t: "[Get_newspaper_header]Національна партія обрана в Новій Зеландії"
 WORLD_NZ.21.d: "У передбачуваній перемозі Національна партія скинула правління Лейбористів після того, як рішення провести позачергові вибори виявилося для них помилковим. Результат був широко передбачений політичними аналітиками, багато з яких вважали, що Лейбористи не зробили достатньо для виправлення наслідків Олійної кризи для економіки Нової Зеландії. Економічні аргументи лідера Національної партії Браяна Талбойса виявилися достатньо переконливими для громадян, щоб дати їм ще один шанс при владі.\n\nУ своїй першій промові на посаді прем'єр-міністра Браян Талбойс пообіцяв шукати нові ринки, щоб запобігти таким збиткам для енергетичної безпеки країни в майбутньому. Зокрема, Талбойс зазначив необхідність налагодження торгівлі з державами Південно-Східної Азії, вірячи, що збільшення торгівлі там може зміцнити дружні економіки і відвернути інші від економічної домінації Японії. Лише час покаже, чи буде такий амбітний план здійсненним.\n"
 WORLD_NZ.21.a: "Лише б він не забув, хто є його справжніми союзниками."
 WORLD_NZ.21.b: "Лише б це працювало для нас, а не навпаки."
 WORLD_NZ.21.c: "Сміливі кроки в новий відважний світ."
 WORLD_NZ.21.e: "Ми б хотіли побачити, як ти спробуєш."

 WORLD_NZ.22.t: "[Get_newspaper_header]Лейбористська партія обрана в Новій Зеландії"
 WORLD_NZ.22.d: "У необхідному повороті для долі Лейбористської партії, Боб Тізард очолив партію до перемоги над чинною Національною партією після політично фатальних позачергових виборів. Політичні аналітики вважають, що їхня перемога була здебільшого результатом нездатності попереднього уряду утримати економіку на плаву після Олійної кризи, особливо враховуючи, що Лейбористи сильно спиралися на їхні поразки на посаді.\n\nУ своїй першій промові після обрання на найвищу посаду в Новій Зеландії, Боб Тізард подякував тим, хто дав Лейбористам шанс очолити країну. Він продовжив обговорювати свої плани з відновлення економіки Нової Зеландії, але хоча промова була зосереджена на його позитивних рисах, багато хто підозрює, що Тізарду доведеться скоротити витрати, щоб стримати зростаючі економічні проблеми. Коментатори підозрюють, що субсидії для сільського господарства та рибальства Нової Зеландії стануть першими, що потраплять під скорочення.\n"
 WORLD_NZ.22.a: "Сподіваємося, що для них усе покращиться."
 WORLD_NZ.22.b: "Сподіваємося, він також залишиться поза чужими справами."
 WORLD_NZ.22.c: "Хтось мусить прибирати це безладу."

 WORLD_NZ.23.t: "[Get_newspaper_header]Антивоєнна коаліція обрана в Новій Зеландії"
 WORLD_NZ.23.d: "Коли в Новій Зеландії були призначені позачергові вибори, політичні аналітики передбачали широкий спектр результатів щодо перемоги Національної чи Лейбористської партії, але мало хто вірив, що обидві партії будуть позбавлені влади. Після продовження заворушень у Новій Зеландії, головно через невдалі зовнішні інтервенції та економічну нестабільність, коаліція депутатів від Соціал-Кредитної партії, Партії миру та кількох незалежних соціялістів взяла владу.\n\nНовий прем'єр-міністр та лідер Соціал-Кредитної партії Джон О'Брайєн нещодавно виступив з промовою, яка дала невелике уявлення про плани коаліції на майбутнє. О'Брайєн різко розкритикував ОВН за те, що дозволили новозеландським молодикам гинути в чужих війнах, разом з "економічним імперіалізмом" організації, перед тим як оголосити про свій намір вийти з неї. Вашингтон поки не прокоментував цей розвиток подій.\n"
 WORLD_NZ.23.a: "Що...?"
 WORLD_NZ.23.b: "Від імперіалістів до антиімперіалістів."
 WORLD_NZ.23.c: "Принизливий кінець для хрестового походу проти фашизму."

 WORLD_NZ.24.t: "[Get_newspaper_header]Нова Зеландія виходить з ОВН"
 WORLD_NZ.24.d: "По всій Новій Зеландії американські солдати повертаються додому, оскільки супердержава починає виведення своїх військ з Нової Зеландії. Те, що раніше було лише риторикою, стало реальністю минулого тижня, коли прем'єр-міністр Джон О'Брайєн підписав законодавство, яке офіційно виводить країну з військового альянсу. Прогнозується, що вихід Нової Зеландії серйозно послабить можливості Америки в Тихому океані, на користь Японії.\n\nОднак майбутнє Нової Зеландії після цього здається все більш невизначеним. Хоча Соціал-Кредитна партія стримана своїми коаліційними партнерами і публічно пообіцяла відданість демократії Нової Зеландії, багато хто залишається скептично налаштованими, враховуючи репутацію британських соціальних кредитистів, від яких новозеландські соціальні кредитисти черпають ідеологічне натхнення. Залишаючи мало чого, з чим коаліція може погодитись, її майбутнє виглядає під загрозою, оскільки непередбачувана поведінка прем'єр-міністра О'Брайєна не викликає довіри.\n"
 WORLD_NZ.24.a: "Світ вільних народів стає значно менш вільним."
 WORLD_NZ.24.b: "Надішлемо їм наші вітання!"
 WORLD_NZ.24.c: "Хто може передбачити, що станеться далі в ці божевільні часи?"

 WORLD_NZ.25.t: "[Get_newspaper_header]Демонстрації "Підтримаймо війська" в Новій Зеландії"
 WORLD_NZ.25.d: "У спонтанних актах святкування по всій Новій Зеландії війська країни стали об'єктом вшанування, їх відзначають у парадах. Раптові вибухи святкувань не зовсім несподівані для деяких уважних міжнародних спостерігачів, які зазначають успіхи Нової Зеландії у "хрестовому поході проти фашизму" на світовій арені, здобувши кілька перемог над режимами, ворожими інтересам ОВН.\n\nЗі свого боку прем'єр-міністр [NZL.GetLeader] привітав сцени патріотизму, що продемонстровані в містах і селах Нової Зеландії, розповідаючи про важливість місії ОВН по стримуванню фашизму. Однак критики називають святкування тріумфалістським і жорстоким видовищем. Незважаючи на це, їхня популярність не може бути заперечена, оскільки натовпи продовжують відвідувати ці паради.\n"
 WORLD_NZ.25.a: "Три рази за свободу та демократію в усьому світі!"

 WORLD_NZ.26.t: "[Get_newspaper_header]Антивоєнні протести в Новій Зеландії"
 WORLD_NZ.26.d: "Спалахи контроверсій щодо ролі Нової Зеландії в ОВН і американських зовнішніх військових інтервенціях виникли за останні тижні, що призвело до вибуху протестів проти участі країни у війнах за кордоном, особливо щодо людських втрат у цих війнах. Коли історії про молодих новозеландців, що повертаються додому без кінцівок або в мішках з тілами, стають дедалі звичнішими, так само зростають протести проти війни, причому ці останні протести є найжорстокішими на сьогоднішній день.\n\nПрем'єр-міністр [NZL.GetLeader] закликав до спокою та єдності на фоні цих протестів, наголошуючи, що Нова Зеландія не повинна лякатися чи коливатися перед обличчям фашистської агресії, коли на кону стоїть доля інших демократій. Відповідаючи на це, протестувальники звинуватили його в ігноруванні внутрішніх проблем Нової Зеландії заради того, щоб "зіграти героя" за кордоном. Якщо удача Нової Зеландії не зміниться, ці протести очікується лише зростати.\n"
 WORLD_NZ.26.a: "Сподіваємося, ці протести не розповсюдяться на наші альянси."

 WORLD_NZ.27.t: "[Get_newspaper_header]Монархію скасовано в Новій Зеландії"
 WORLD_NZ.27.d: "Після тижнів публічних дебатів та референдуму з цього питання Нова Зеландія стала республікою, скасувавши роль британської монархії в країні. Офіційним обґрунтуванням цього кроку прем'єр-міністр [NZL.GetLeader] зазначив, що монархія стала відчуженою та чужою інституцією для багатьох громадян, що ще більше підсилюється відсутністю реальної влади в Канаді, в той час як німецький монарх править через Атлантику.\n\nПрихильники цього кроку вважають, що скасувавши монархію, Нова Зеландія зробила ще один крок на шляху до подолання свого колоніального минулого та до того, щоб стати повністю незалежною нацією. Критики ж кажуть, що цей крок став можливим завдяки надмірному впливу Америки на суспільство Нової Зеландії, жаліючись, що старі традиції відкидаються через нові гроші.\n"
 WORLD_NZ.27.a: "Республіка, якщо ви зможете її ."."

 WORLD_NZ.28.t: "[Get_newspaper_header]Монархія скасована в Новій Зеландії"
 WORLD_NZ.28.d: "Після тижнів публічних дебатів та референдуму з цього питання Нова Зеландія стала республікою, скасувавши роль британської монархії в країні. Офіційним обґрунтуванням цього кроку прем'єр-міністр [NZL.GetLeader] зазначив, що монархія стала відчуженою та чужою інституцією для багатьох громадян, що ще більше підсилюється скасуванням монархії в Британії після успіху повстання HMMLR.\n\nПрихильники цього кроку вважають, що, позбувшись монархії, Нова Зеландія зробила ще один крок у напрямку відмови від свого колоніального минулого та на шляху до того, щоб стати повністю незалежною нацією. Критики ж кажуть, що цей крок став можливим лише завдяки надмірному впливу Америки на суспільство Нової Зеландії, скаржачись, що старі традиції відкидаються через нові гроші.\n"
 WORLD_NZ.28.a: "Республіка, якщо зумієте її втримати."

 #World Events for the Micro-states

 WORLD.4200.t:0 "[Get_newspaper_header]Розпочинається Другий Ватиканський собор"
 WORLD.4200.desc:0 "Другий Вселенський собор Ватикану, якого з нетерпінням чекали відтоді, як Папа Іоанн XXIII оголосив про намір скликати його в 1959 році, нарешті відкрився в базиліці Святого Петра. Кожен єпископ з усього світу має право відвідати Собор і висловити свою думку щодо численних літургійних і процедурних питань, великих і малих. За такої ситуації, жваві богословські дебати не лише очікувані, але, здається, й заохочувані зацікавленістю Іоанна XXIII в оновленні позицій та методів Церкви для сучасної епохи.\n\nДеякі консервативні єпископи висловили занепокоєння, що масштабні реформи є, у кращому разі, невиправданими, а в гіршому - небезпечними для місії Церкви, і, безсумнівно, використають свій час на Соборі, щоб спрямувати справи в більш поміркованому чи навіть повністю реакційному напрямку, попри своїх ліберальних колег. Однак, судячи з нинішнього стану справ за Іоанна XXIII, усе, схоже, рухається у виразно реформістському напрямку.\n"
 WORLD.4200.a:0 "До Церкви йдуть зміни."

 WORLD.4201.t:0 "[Get_newspaper_header]Ватиканський собор II завершено"
 WORLD.4201.desc:0 "Після чотирьох років дебатів, обговорень і досліджень Другий Ватиканський собор нарешті завершився. Розпочатий за Іоанна XXIII як частина його прагнення до "оновлення" практик і доктрин Церкви, він завершив свою роботу за його наступника [VAC.getleader]. Здається, новий Папа був готовий вшанувати грандіозне бачення собору свого попередника, оскільки документи, вироблені протягом цієї надзвичайної зустрічі, докорінно змінили те, як Церква взаємодіятиме з навколишнім світом.\n\nЗначним відходом від попередньої доктрини стало те, що Церква тепер дозволить проводити Месу народною мовою, а не строго латиною - крок, який, за словами прихильників змін, значно посилить привабливість католицизму по всьому світу. Церква також видала рішуче засудження переслідування Німецьким Райхом європейських євреїв, що знаменує значний відхід від її стриманих реакцій за Пія XII, які зазнавали суворої критики з боку ліберальної фракції.\n"
 WORLD.4201.a:0 "Поворотний момент для Церкви"

 WORLD.4202.t:0 "[Get_newspaper_header]Ватиканський собор II завершено"
 WORLD.4202.desc:0 "Після чотирьох років дебатів, обговорень і досліджень Другий Ватиканський собор нарешті завершився. Розпочатий за Іоанна XXIII як частина його прагнення до "оновлення" практик і доктрин Церкви, він завершив свою роботу за його наступника [VAC.getleader]. Здається, новий Папа не був готовий зайти так далеко, як бажав його попередник, і хоча деякі важливі зміни були узгоджені, багато ліберальних кардиналів залишились розчаровані.\n\nМабуть, найзначнішою реформою, узгодженою Собором, став перехід від латинської Меси до народної мови. Водночас серед кардиналів не вдалося досягти консенсусу щодо того, яку роль Церква має відігравати в сучасному світі, особливо у відповідь на звірства, вчинені Німецьким Райхом, які раніше зустрічали лише нерівномірні й стримані реакції з боку Ватикану.\n"
 WORLD.4202.a:0 "Чи хтось узагалі лишився задоволеним?"

 WORLD.4203.t:0 "[Get_newspaper_header]Ватиканський собор II завершено"
 WORLD.4203.desc:0 "Після чотирьох років дебатів, обговорень і досліджень Другий Ватиканський собор нарешті завершився. Розпочатий за Іоанна XXIII як частина його прагнення до "оновлення" практик і доктрин Церкви, він завершився за його наступника [VAC.getleader]. У приголомшливій зміні напрямку Собор відхилив майже всі модернізаційні пропозиції, представлені перед ним, зробивши крок назад до більш традиційних церковних доктрин і політик.\n\nСпробу змінити мову Меси з латини на народну відхилили традиціоналісти, так само як і зусилля просунути більш екуменістичну позицію щодо інших християнських конфесій. Собор лише закріпив офіційну лінію, що Рим є "єдиною істинною Церквою", а всі інші є, у кращому разі, оманутими єретиками. Хоча традиціоналісти похвалили Собор за дотримання давніх звичаїв і доктрини перед лицем хибних змін, ліберальне крило Церкви повторило свої побоювання, що такі позиції лише ще більше ізолюють Церкву від постійно змінюваного світу.\n"
 WORLD.4203.a:0 "Що більше все змінюється, то більше все лишається так само..."

 WORLD.4204.t:0 "[Get_newspaper_header]Помер Папа Іоанн XXIII"
 WORLD.4204.desc:0 "Сьогодні Католицька Церква оплакує кончину Святішого Отця, Папи Іоанна XXIII. Народжений як Джузеппе Ронкаллі, Іоанн XXIII був обраний у 1958 році, щоб заповнити вакансію, залишену смертю Пія XII. Обраний Колегією кардиналів як "тимчасовий" Папа через свій похилий вік на момент обрання, Ронкаллі швидко спростував ці очікування. Хоча його понтифікат тривав лише п'ять років, Іоанн XXIII зробив дуже багато для натхнення змін. Другий Ватиканський собор, наразі тимчасово призупинений до обрання нового Папи, став визначальним діянням на диво активного правління.\n\nІоанн XXIII також був відомий своєю рішучою позицією щодо прав людини, викладеною у його визнаній енцикліці "Pacem in terris", яка гостро засуджувала дії Німецького Райху проти євреїв. Іоанн помер, коханий мільйонами католиків по всьому світу, і багато хто вже припускає, що канонізація - лише питання часу.\n"
 WORLD.4204.a:0 "Куди піде Церква звідси?"

 WORLD.4205.t:0 "[Get_newspaper_header]Обрано Папу Григорія XVII"
 WORLD.4205.desc:0 "Після трьох днів голосування з димаря Сикстинської капели помітили білий дим, що сповіщає про обрання нового Папи. Кардинали обрали Патріарха Григорія Петра Агаджаняна очолити Церкву після смерті Іоанна XXIII. Колишній Патріарх Кілікії оголосив, що прийме папське ім'я Григорій XVII. Очікується, що новий Папа розпочне свій термін серйозно, зосередившись одразу на кількох питаннях, дорогих його серцю.\n\nЯк вірменин-католик, Григорій XVII, як очікується, зблизить Римо-Католицьку Церкву та кілька автономних Східних Католицьких Церков. Також очікується, що новий Папа займе рішучу моральну позицію проти переслідування меншин по всьому світу, заявивши у своєму першому публічному зверненні як Папи: "Структури, побудовані на фундаменті ненависті та зла, не можуть стояти вічно. Вони завжди тим чи іншим шляхом призведуть себе до краху."\n"
 WORLD.4205.a:0 "Чемпіон єдності бере кермо влади."

 WORLD.4206.t:0 "[Get_newspaper_header]Обрано Папу Іоанна XXIV"
 WORLD.4206.desc:0 "Папський конклав, скликаний для заміни покійного Іоанна XXIII, завершився обранням кардинала Джакомо Лєркаро Папою Іоанном XXIV. Провідний лідер ліберального крила Церкви, обрання Лєркаро свідчить про те, що Церква збереже реформістський настрій, розпочатий за понтифікату Іоанна XXIII. Навіть вибір імені вказує на зацікавленість нового Папи в завершенні справи, розпочатої його попередником.\n\nОкрім продовження роботи Другого Ватиканського собору, Іоанн XXIV має ширші плани. Він уже почав виступати проти того, що вважає ендемічним "культурним колоніалізмом" у взаємодії Церкви з її неєвропейськими членами. Це, за словами Іоанна XXIV, має припинитися, якщо Церква прагне стати справді всесвітньою. У дипломатичному плані Іоанн XXIV викликав публічне засудження як з боку Німецького Райху, так і Італійської імперії, тоді як нації ОВН висловили теплі вітання.\n"
 WORLD.4206.a:0 "Справжній наступник Іоанна XXIII!"

 WORLD.4207.t:0 "[Get_newspaper_header]Обрано Папу Павла VI"
 WORLD.4207.desc:0 "Папський конклав завершився обранням кардинала Джованні Монтіні, який прийняв ім'я Павло VI. Монтіні провів значну частину своєї духовної кар'єри поблизу Ватикану, підтримуючи тісні стосунки як з Пієм XII, так і з Іоанном XXIII, і налагодив важливі зв'язки в Церкві за час своєї служби в Секретаріаті Ватикану. Монтіні був відомий як відносно ліберальний кардинал, хоча не настільки, щоб налаштувати проти нього своїх поміркованих колег. Павло VI, ймовірно, опікуватиметься балансуванням численних і різноманітних прагнень різних фракцій усередині Церкви.\n\nБагато хто досі очікує, що він продовжить справу Іоанна XXIII з Ватиканським собором II, хоча більш консервативні єпископи вже готують спротив найамбітнішим реформам, тепер, коли Іоанна XXIII більше немає, щоб їх просувати. Керування Церквою тепер лягає на його наступника, і залишається побачити, куди Павло VI її поведе.\n"
 WORLD.4207.a:0 "Наскільки вправно він пройде цим канатом?"

 WORLD.4208.t:0 "[Get_newspaper_header]Обрано Папу Пія XIII"
 WORLD.4208.desc:0 "Кардинал Джузеппе Сірі був обраний Папою Колегією кардиналів після смерті Іоанна XXIII. Консервативний прелат був широко відомий як провідний претендент на конклаві 1958 року, і хоча на тих виборах переміг ліберальний Ронкаллі, тепер настав час традиціоналістам стати за кермо. Несхвалення Сірі реформістських цілей Іоанна XXIII поширювалось навіть на Ватиканський собор II, і хоча Пій XIII пообіцяв відновити призупинений собор з поваги до свого попередника, вкрай сумнівно, що він дійде тих самих висновків, яких міг би дійти за Іоанна XIII чи більш ліберального наступника.\n\nВітання надходять з держав по всьому світу, включно з Римом. Проте багато лібералів-католиків, як мирян, так і духовенства, побоюються, що важливий прогрес у Церкві скоро буде відкинуто назад.\n"
 WORLD.4208.a:0 "Скільки від спадщини Іоанна XXIII залишиться, коли він закінчить?"

 WORLD.4209.t:0 "[Get_newspaper_header]Помер Папа Григорій XVII"
 WORLD.4209.desc:0 "Ватикан оголосив, що Папа Григорій XVII помер, знову залишивши Католицьку Церкву на роздоріжжі. Від свого обрання в 1963 році на заміну покійному Іоанну XXIII Григорій XVII займав рішучу моральну позицію на підтримку пригноблених по всьому світу. Природно, це роздратувало не одну державу, яку він визначив як таку, що чинить гноблення, але для мільйонів інших він уособлював потужний голос за їхнє визволення. Він також зробив значні кроки для зміцнення зв'язків між Римом та різними автономними католицькими громадами на сході.\n\nРада кардиналів знову збереться в Сикстинській капелі, щоб обрати наступника, але навіть коли його земна праця добігла кінця, спадщина служіння Григорія XVII, безсумнівно, відлунюватиме в прийдешні роки."
 WORLD.4209.a:0 "Спочивай з миром, Святіший Отче."

 WORLD.4210.t:0 "[Get_newspaper_header]Обрано Папу Климента XV"
 WORLD.4210.desc:0 "Після смерті Папи Григорія XVII Колегія кардиналів зібралась, щоб обрати його наступника. Сьогодні характерний білий дим із Сикстинської капели сповістив світові, що вони зробили свій вибір. Себастьяно Баджо, Префект Конгрегації у справах єпископів. Вплив Баджо всередині Церкви неухильно зростав від часу його призначення Григорієм Префектом у 1965 році, залишивши йому величезний вплив на формування наступного покоління католицьких єпископів.\n\nЗа свій короткий час як кардинал, а потім як Префект, Баджо не втручався в фракційну політику Церкви з якимось особливим завзяттям. Водночас довіра, яку Григорій XVII явно виявляв до нього як до координатора з питань потенційних єпископів, свідчить, що він не є реакціонером. І все ж, здається, цей Папа почувається затишніше, маючи справу з питаннями організації, ніж доктрини.\n"
 WORLD.4210.a:0 "Він принаймні триматиме єпископів у шорах."

 WORLD.4211.t:0 "[Get_newspaper_header]Обрано Папу Іннокентія XIV"
 WORLD.4211.desc:0 "Колегія кардиналів, скликана для обрання наступника покійного Григорія XVII, нарешті оголосила своє рішення. У результаті, що заскочив зненацька більшість спостерігачів та експертів, здається, кардинали обрали Коррадо Урсі, архієпископа Неаполя, наступним Понтифіком. Тихого італійського кардинала майже повністю оминали увагою під час обговорень імовірних наступників, а основна увага папабільних спекуляцій зосереджувалась на більш видатних постатях духовенства.\n\nЧутки швидко почали шириться щодо причин рішення Колегії. Мабуть, найпоширеніша теорія, що циркулює, полягає в тому, що кандидатуру Урсі спершу висунули після того, як консерватори та кілька поміркованих виступили проти більш ліберальних варіантів. Це призвело до кількох глухих кутів, які вдалося подолати лише тоді, коли Урсі обрали компромісним кандидатом, який не розхитуватиме човен.\n"
 WORLD.4211.a:0 "Іноді поміркованість може прозвучати так само гучно, як і фанатизм."

 WORLD.4212.t:0 "[Get_newspaper_header]Обрано Папу Лаврентія"
 WORLD.4212.desc:0 "Рада кардиналів, скликана після смерті Папи Григорія XVII, оголосила, що Йоганнес Віллебрандс обраний його наступником, прийнявши нове папське ім'я Лаврентій. Обіймаючи посади архієпископа Утрехтського та Примаса Нідерландів з 1970 року, Віллебрандс став відомим у Церкві завдяки своєму сприянню екуменізму, руху, що прагне примирити Римську Церкву з її відчуженими братами. Він відіграв провідну роль у русі на початку 1960-х років і був президентом Папської Ради зі сприяння християнській єдності за свого попередника.\n\nВідносини між Німецьким Райхом і Католицькою Церквою завжди були мінливими, і обрання голландського Папи неодмінно ще більше ускладнить справи. Ґерманія вже видала попередження, що жодні спроби Лаврентія втручатися в їхні справи не будуть терпимі.\n"
 WORLD.4212.a:0 "Чи зможе він залатати розколи та зцілити рани?"

 WORLD.4213.t:0 "[Get_newspaper_header]Обрано Папу Григорія XVIII"
 WORLD.4213.desc:0 "Кардинал Поль-Емiль Леже, архієпископ Монреаля та місіонер, був обраний Папою Григорієм XVIII і новим главою Католицької Церкви. Від часів Собору Ватикан II Леже був рішучим прихильником реформ Іоанна XXIII та провідним членом ліберального крила Церкви. За понтифікату Григорія XVII квебекський кардинал прагнув підтримувати темп, розпочатий Собором.\n\nРанішня місіонерська діяльність Григорія XVIII, зокрема в Японії у 1930-х роках і по всій Західній Африці у 1960-х, за оцінками експертів, передвіщає більшу зацікавленість цими регіонами за його понтифікату, поряд з продовженням співпраці зі Східними католицькими громадами, розпочатою його попередником. Канада перша серед націй, що висловили свої вітання, і хоча деякі квебекські католики не схвалюють ліберальний ухил Леже, вони, тим не менш, схвильовані, побачивши одного зі своїх у Ватикані.\n"
 WORLD.4213.a:0 ""Хто має вуха чути, нехай чує""

 WORLD.4221.t:0 "[Get_newspaper_header]Обрано Папу Лева XIV"
 WORLD.4221.desc:0 "У шокуючому повороті подій Папський конклав, скликаний для обрання наступного Папи після смерті Григорія XVII, обрав самопроголошеного соціаліста новим главою Католицької Церкви. Кардинал Елдер Камара з Бразилії, один із провідних голосів, що підтримують швидко розвинений рух "теології визволення" у вищих ешелонах Церкви, тепер став Папою Левом XIV. Самі вибори були надзвичайно суперечливими, знадобилось 24 тури голосування, щоб визначити наступного понтифіка.\n\nРеакції у світі були відносно стриманими: кілька лівих держав висловили вітання, тоді як більш консервативні та реакційні уряди обмежились лише короткими заявами. Навіть католики-віряни лишились незвично мовчазними та розділеними у своїй реакції. Хтось обурений, хтось у захваті. Більшість просто спантеличена відкритим питанням, як саме має виглядати соціалістичний понтифікат, і як їм примирити свої почуття щодо політичних і соціальних питань з тим, що такий радикал тепер діє як Намісник Христа і пастир пастви.\n"
 WORLD.4221.a:0 "Соціаліст у Ватикані?"

 WORLD.4222.t:0 "[Get_newspaper_header]Обрано Папу Пія XIII"
 WORLD.4222.desc:0 "З обранням кардинала Марселя Лефевра Папою Пієм XIII Католицька Церква, здається, готова розпочати найдраматичніший доктринальний зсув за останню пам'ять. Тоді як його безпосередні попередники, Григорій XVII та Іоанн XIII, обидва прагнули привести Церкву в сучасну епоху за допомогою реформ і більш ліберальної політики, Пій XIII відомий своїм глибоким консерватизмом - відзнакою, яку він носить так само гордо, як і своє папське ім'я "Пій".\n\nТі, хто побоюється, що понтифікат Пія завдасть невимовної шкоди важкій праці минулого десятиліття, вказують на його зв'язки з французькими правими політичними колами. Вони шепочуться, що новий Папа надто прихильний до фашистських і авторитарних режимів західного світу, або принаймні тих, що тісно співпрацюють з Церквою. Намісник Христа має тверді погляди на теми від Французької революції до доктрини екуменізму, і єдине питання, яке залишається, - наскільки далеко він готовий повернути стрілки годинника назад."
 WORLD.4222.a:0 "Anno Domini 1903."

 WORLD.4214.t:0 "[Get_newspaper_header]Революція в Сан-Марино!"
 WORLD.4214.d:0 "Червона хвиля революції накрила гору Титано, коли ліві революціонери захопили владу в Сан-Марино. Коаліція санмаринських лівих, включно з залишками заборонених соціалістичної та комуністичної партій, об'єдналась проти Partito Fascista Sammarinese і захопила Палаццо Публіко, де Княжа рада проводила екстрене засідання. Революціонери прийшли добре підготовленими і швидко впорались з непідготовленою та здебільшого церемоніальною охороною Ради.\n\nПотім відбулось протистояння між революційним керівництвом та невеликими санмаринськими збройними силами, останні не мали особливого бажання служити радикальному лівому уряду. Однак після напружених переговорів з Генеральним секретарем Гасперóні генерал Етторе Соцці погодився скласти повноваження. Майбутнє Сан-Марино наразі невизначене, доки вони чекають на наступний крок Італії.\n"
 WORLD.4214.a:0 "Як це сталося просто в нас під носом?"
 WORLD.4214.b:0 "Краще вони, ніж фашисти!"
 WORLD.4214.c:0 "У Сан-Марино є комуністи?"

 WORLD.4215.t:0 "[Get_newspaper_header]"Переворот "Нової гвардії" в Сан-Марино!"
 WORLD.4215.d:0 "Так само, як Скорца переміг дуче Чіано, внутрішньопартійний конфлікт також приніс зміни в крихітну республіку Сан-Марино. Обурений тим, що він назвав "клептократичним виродженням" санмаринського фашизму, Еціо Бальдуччі та його невелика, але добре озброєна група сквадристів "Нової гвардії" штурмували Палаццо Публіко та заарештували всіх шістдесят членів Княжої та Суверенної ради.\n\nНепідтверджені повідомлення вказують, що Бальдуччі та його людям чималу колекцію зброї надала італійська МСВН, хоча новий режим у Римі не видав ні підтвердження, ні спростування цих повідомлень. Бальдуччі присягнув встановити справді фашистську державу, як її уявляв Муссоліні, а не просто маску для старих олігархічних династій.\n"
 WORLD.4215.a:0 "Чи це справді якась суттєва зміна?"

 WORLD.4216.t:0 "[Get_newspaper_header]Військовий переворот у Сан-Марино!"
 WORLD.4216.d:0 "Partito Fascista Sammarinese завжди покладалась на заступництво свого італійського відповідника. З падінням дуче Чіано ПФС втратила хватку над народом крихітної держави - будь-який страх, який вона колись вселяла, розвіявся до тла. Скориставшись нагодою, командир жандармерії Етторе Соцці мобілізував крихітну армію Сан-Марино для перевороту проти фашистського уряду. Коли він та його сили наближались до Палаццо Публіко, їм чинили лише символічний опір.\n\nЗабезпечивши урядову будівлю, а лідери ПФС та родина Гоцці або втекли, або перебувають під домашнім арештом, Соцці проголосив новий тимчасовий уряд, який працюватиме над швидким переходом республіки від розбещувального впливу фашистів і олігархів, які домінували в ній останні десятиліття.\n"
 WORLD.4216.a:0 "Чи дотримається він своїх обіцянок?"

 WORLD.4217.t:0 "[Get_newspaper_header]Революція в Монако!"
 WORLD.4217.d:0 "Попри те, що курортна нація є повною протилежністю всьому, за що виступає комунізм, Монако тепер стало жертвою Червоної хвилі революції, що накотилась на її береги. Чутки про неминучі скорочення зарплат та звільнення спричинили перший за десятиліття страйк, що вразив казино. Спочатку керівники казино не надали цьому значення, оцінивши це як набагато менш серйозну проблему, ніж їхні фінансові негаразди. Проте невдовзі стало зрозуміло, що вони втрачають контроль над ситуацією.\n\nЗ кожним днем масштаб страйку зростав, а дрібне вандальство невдовзі переросло у збройне протистояння. Ситуація досягла критичної точки, коли лідер страйку Шарль Сокаль повів групу озброєних робітників у казино, змусивши керівників та королівську родину терміново покинути місто. Тепер Скеля комунізму стирчить, затиснута всередині Європи, недружньої до її режиму.\n"
 WORLD.4217.a:0 "Удар по буржуазії!"
 WORLD.4217.b:0 "Навіть казино не убезпечені!"

 WORLD.4218.t:0 "[Get_newspaper_header]Принцеса Шарлотта Монакська зрікається престолу!"
 WORLD.4218.d:0 "Після гучних повідомлень про те, що Societe des Bains de Mer de Monaco перебуває на межі фінансового краху, принцеса Шарлотта зреклася престолу, дозволивши своєму синові, принцу Ренє, взяти під контроль делікатну ситуацію. Оскільки вона ніколи не була особливо зацікавлена в управлінні Монако, широко вважається, що принцеса утримувала своє становище лише через страх, що реформізм її сина призведе до нав'язливого італійського втручання. Оскільки Рим більше не контролюється ПНФ, тепер вона має свободу відкинути свій королівський тягар.\n\nНовому принцу доведеться нелегко, оскільки він заявив про намір реформувати конституцію маленької нації, водночас відкривши її для іноземного капіталу. Доля як держави, так і величезного багатства, яким вона володіє, тепер залежатиме від його керівництва.\n"
 WORLD.4218.a:0 "Держава-казино має нове керівництво."

 WORLD.4219.t:0 "[Get_newspaper_header]Фашистський переворот у Монако!"
 WORLD.4219.d:0 "Після шквалу повідомлень про хвилю антиітальянських нападів у Монако, спричинених побоюваннями щодо можливого краху Societe des Bains de Mer de Monaco, італійський консул Станіслао Лепрі маневрами здобув посаду Державного міністра. Як і очікувалось, принцеса Шарлотта дійсно зреклася престолу, але на користь своєї доньки Антуанетти, а не спадкоємця престолу, принца Ренє. За словами Лепрі, принц добровільно відмовився від своїх прав на Князівство, посилаючись на ту саму відсутність інтересу до політики, якою була відома його мати.\n\nОднак Ренє стверджує, що італійський консул погрожував йому сфабрикованими скандалами, доки він не погодився відмовитись від свого спадкового права, роблячи зречення повністю нелегітимним. Хоча він втік до Сполучених Штатів разом з матір'ю, за всіма правами він є принцом Ренє III Монакським."
 WORLD.4219.a:0 "Яка брудна справа."

 WORLD.4220.t:0 "[Get_newspaper_header]SBM на межі краху"
 WORLD.4220.d:0 "З Монако просочились шокуючі повідомлення про те, що Societe des bains de mer de Monaco, або SBM, перебуває на межі фінансової катастрофи. SBM є, безсумнівно, домінантною економічною установою крихітної курортної нації, оскільки їй належить та вона керує Casino de Monte-Carlo, Opera de Monte-Carlo та Hotel de Paris Monte-Carlo.\n\nДля багатьох у Монако ця новина повертає неприємні спогади про крах Societe Monegasque de Banques et de Metaux Precieux у 1955 році - подію, що призвела до італійської фінансової допомоги, яка залишила середземноморську державу де-факто в контролі над справами Монако. Вважається, що нинішня суверенна правителька Монако, принцеса Шарлотта Луїза Жульєтта Грімальді, вкрай не готова до нинішньої кризи, і виникли чутки, що вона планує негайно зректися престолу, дозволивши своєму синові Ренє розібратися з ситуацією.\n"
 WORLD.4220.a:0 "Це знову як з Ясудою!"

 WORLD_WI.1.t: "[Get_newspaper_header]Утворення Федерації Вест-Індії"
 WORLD_WI.1.desc: "Неможливе стало можливим сьогодні з утворенням Федерації Вест-Індії. Через регіональну нестабільність після заворушень у Кінгстоні вважалося малоймовірним, що мир чи компроміс повернуться так скоро, і що лише дипломатичне диво могло б дозволити досягти згоди.\n\nОб'єднавши більшість різних вест-індійських колоній Британії під єдиним децентралізованим федеральним урядом під наглядом британської монархії. На святкуванні королева Єлизавета очолила грандіозну церемонію в столиці Союзу, Бріджтауні, передавши естафету незалежності народу Карибського басейну.\n\nУтворення Федерації знаменує велику перемогу американців у їхніх багаторічних зусиллях зі встановлення стабільного післявоєнного порядку в регіоні. Але навіть зараз експерти турбуються щодо довгострокової життєздатності такого хиткого союзу.\n"
 WORLD_WI.1.a: "Що ж, принаймні один розділ закрито."
