 WORLD.2070.t: "[Get_newspaper_header]П'єр Пужад обраний президентом Франції!"
 WORLD.2070.desc: "Політична криза у Франції, що спалахнула після болісної поразки в недавньому бурґундському вторгненні та сумної зникнення колишнього президента Тіксьєра-Віньянкура, здається, була вирішена. Національна асамблея обрала П'єра Пужада, лідера Союзу та Французької братерськості, президентом Французької держави. Сприйнятий як кандидат статус-кво, навіть у питанні зовнішньої політики після нещодавньої військової катастрофи, його перемога не стала несподіванкою для тих, хто добре знає політику Франції.\n\nПужад здобув сильну підтримку серед середнього класу, фермерів та ремісників Франції, він пообіцяв надати цим верствам французького суспільства статус основи економіки країни, що зустрілося з підозрою з боку вищих класів. Новий президент, здається, користується підтримкою збройних сил, принаймні поки що, але тільки час покаже, чи зможе він зберегти стабільність на тлі множинних протилежних інтересів."
 WORLD.2070.a: "Світ потребує Франції, Франція потребує всіх французів."
 
 WORLD.2071.t: "[Get_newspaper_header]П'єр Сідос обраний президентом Франції!"
 WORLD.2071.desc: "Політична криза у Франції, що спалахнула після болісної поразки в недавньому бурґундському вторгненні та зрадницького втечі колишнього президента Тіксьєра-Віньянкура, здається, була вирішена. Національна асамблея обрала П'єра Сідоса, лідера Французької народної партії, президентом Французької держави. Завзятий ґерманофіл, Сідос пообіцяв відновити тісні зв'язки з Ґерманським Райхом для протидії бурґундській агресії.\n\nОсновний представник французької крайньої правиці, Сідос користується підтримкою збройних сил і відомий своїми запекло антидемократичними ідеями - закликаючи обмежити повноваження парламенту, заборонити кілька партій, які підтримують демократію, та встановити строгий державний католицизм у Франції. Оскільки Франція, здається, націлюється на міцне перебування в німецькій сфері впливу, світ цікаво, чи окупить цей стратегічний крок Франції в довгостроковій перспективі."
 WORLD.2071.a: "Нехай вічна Франція пам'ятає твою годину!"
 
 WORLD.2072.t: "[Get_newspaper_header]Антуан Пінай обраний президентом Франції!"
 WORLD.2072.desc: "Політична криза у Франції, що спалахнула після болісної поразки в недавньому бурґундському вторгненні та загадкового зникнення колишнього президента Тіксьєра-Віньянкура, здається, була вирішена. Національна асамблея обрала Антуана Пінаї, лідера реформістського крила Національної партії, президентом Французької держави. Новий президент зумів зібрати нестабільну коаліцію реформістів, об'єднаних метою повернення повної демократії у Францію.\n\nФранцузька крайня правиця вже висловила запеклий опір Пінаї, і внутрішні напруження у Франції, здається, знову зростатимуть. Дехто вважає, що Пінаї насправді має контакти з Резистансом і планує використовувати їх у своїх великих планах демократичних реформ. Однак з огляду на інфраструктурні проблеми в асамблеї та вже організовані крайні праві міліції, здійсненність планів Пінаї здається сумнівною."
 WORLD.2072.a: "Франція повинна повернутися до свого істинного вигляду!"
 
 WORLD.2073.t: "[Get_newspaper_header]Жан Бішелон обраний президентом Франції"
 WORLD.2073.desc: "Політична криза у Франції, що спалахнула після болісної поразки в недавньому бурґундському вторгненні та загадкове викрадення колишнього президента Тіксьєра-Віньянкура, здається, була вирішена. Національна асамблея обрала Жана Бішелона, лідера технократичного крила Національної партії, президентом Французької держави. Бішелон здобув перемогу завдяки сильній підтримці серед промислових баронів, які складають велику частину французької верхівки.\n\nБішелон особливо відомий своїм 'Планом PRIME', амбітним та суперечливим економічним планом, спрямованим на досягнення французької само забезпеченості від німецької економіки, що викликає сумніви у багатьох політиків країни. Деякі кола звинувачують Бішелона у зв'язках з таємничим 'синахристським' кабалом, і непопулярність нового президента серед збройних сил і французького населення може призвести до швидкого закінчення його правління."
 WORLD.2073.a: "Друзі, Франція чекає на нас."
 
 WORLD.2074.t: "[Get_newspaper_header]П'єр Гакот обраний президентом Франції"
 WORLD.2074.desc: "Політична криза у Франції, що спалахнула після болісної поразки в недавньому бурґундському вторгненні та очікуваного від'їзду колишнього президента Тіксьєра-Віньянкура, здається, була вирішена. Національна асамблея обрала П'єра Гакота, лідера Аксьйон Франсез, президентом Французької держави. Відомий історик та академік, Гакот здобув несподівану перемогу, враховуючи його заявлене (і не зовсім популярне) намір відновити монархію у Франції.\n\nПрихильник династії Бурбон-Орлеанів, Гакот вже оголосив, що розпочне процес відновлення монархії в країні, запросивши Анрі д'Орлеан, графа Парижа, стати королем Генріхом VI. Однак його проекти загрожують не тільки їх загальною непопулярністю, а й власною підтримкою демократиї Анрі, а також союзниками Гакота, такими як молода Нова Французька акція."
 WORLD.2074.a: "Усі до роботи! Франція відродиться!"

 WORLD.205.t: "[Get_newspaper_header]Війна проти 200 сімей"
 WORLD.205.desc: "За останні кілька днів в Бордо з'явилися новини про нову ініціативу президента П'єра Пужада: «Війна проти 200 сімей». За офіційними джерелами, це спроба усунути тих, хто нібито контролює, маніпулює і підриває Францію та її економіку.\n\nЗа словами французького уряду, ця ініціатива дозволить Франції перейти до більш процвітаючого та міцного майбутнього. Хоча президент П'єр Пужад та його кабінет продовжують стверджувати такі заяви, фактичні наслідки цієї так званої «війни» поки не видно. Те, що зрозуміло, так це те, що Пужад не відступив від популістських позицій, які принесли йому владу."
 WORLD.205.a: "Сподіваємося, що ця «війна» не може бути програна."

 WORLD.206.t: "[Get_newspaper_header]Асамблея розпущена президентом Сідосом"
 WORLD.206.desc: "У останні місяці президент П'єр Сідос, здається, зміцнив свої позиції і продемонстрував це своїм нещодавнім розпуском Асамблеї, офіційно під «надзвичайними умовами». Це дає йому повний контроль над французькою державою.\n\nОскільки більшість влади у Франції вже знаходиться в руках президента, усунення Асамблеї тільки ще більше зміцнило владарювання Сідоса та Французької народної партії. Цей крок також призвів до того, що Партія націоналістів втратила більшу частину своєї попередньої легітимності, і багато її членів пішли в інші партії. На даний момент малоймовірно, що він колись відновить Асамблею."
 WORLD.206.a: "Подивимося, як він скористається цією новою владою."

 WORLD.207.t: "[Get_newspaper_header]Смерть Дрьє ла Рошеля"
 WORLD.207.desc: "Уряд у Бордо нещодавно оголосив, що прем'єр-міністр Франції П'єр Дрьє ла Рошель помер від раку горла. Дрьє ла Рошель був сильним прихильником співпраці з Райхом в рамках Французької народної партії ще до Другої світової війни і сильно вплинув на європейську ідеологію ППФ.\n\nПолітичні спостерігачі вважають, що раптова смерть Дрьє ла Рошеля може спричинити певну нестабільність у партії та в країні загалом. Уже в умовах зростаючого авторитаризму президента Сідоса це неочікуване подія може лише принести нові труднощі для Парижа. Його наступником на посаді стане Юбер Ламбер, близький друг і союзник президента П'єра Сідоса."
 WORLD.207.a: "Франція входить у невизначене майбутнє."

 WORLD.209.t: "[Get_newspaper_header]Франція на боці Німеччини"
 WORLD.209.desc: "Оскільки Франція переживала ізоляцію після Франко-Бургундської війни та була охоплена політичним хаосом після Великої Дискорди, країна потребувала союзників. Тому не має нічого дивного, що Франція вирішила стати на бік Ґерманського Райху.\n\nЗв'язки з Райхом були відновлені, і спадщина П'єра Дрьє ла Рошеля щодо співпраці з Райхом збереглася. Однак проголошення повторного вступу Франції до Пакту викликало заяву Німеччини про те, що Франція приєдналася до альянсу на своїх умовах і буде визнана рівним членом Єдиного пакту, що є зміною порівняно з періодом до розриву Франції з Райхом."
 WORLD.209.a: "Подивимося, чи зробила Франція правильний вибір."

 WORLD.210.t: "[Get_newspaper_header]Франція на боці Італії"
 WORLD.210.desc: "Оскільки Франція переживала ізоляцію після Франко-Бургундської війни та була охоплена політичним хаосом після Великої Дискорди, Франція потребувала союзників. Але замість того, щоб приєднатися до Пакту, як очікувалося, Франція змінила свій курс і вирішила стати на бік Італії.\n\nЦю зміну в зовнішній політиці пояснюють Юбером Ламбером, який виступав за відхід від Райху та переорієнтацію на інші фашистські країни Європи. Це оголошення є великою перемогою для Італії та Скортци, а також значним розширенням італійської сфери впливу, особливо після падіння Тріумвірату."
 WORLD.210.a: "Подивимося, чи зробила Франція правильний вибір."

 WORLD.211.t: "[Get_newspaper_header]Франція на боці Іберії"
 WORLD.211.desc: "Оскільки Франція переживала ізоляцію після Франко-Бургундської війни та була охоплена політичним хаосом після Великої Дискорди, Франція потребувала союзників. Нещодавно стало очевидно, що Франція змінила свою зовнішню політику і стала на бік Іберії.\n\nЦю зміну в зовнішній політиці пояснюють Юбером Ламбером, який виступав за відхід від Райху і переорієнтацію на інші фашистські країни Європи. Оскільки Іберія раніше була однією з менших «великих держав» Європи, нещодавній поворот Франції, здається, призведе до зміни цього статусу. Це стало несподіваною перемогою для Франко та Салазара, і очікується, що Франція та Іберія будуть сприяти більш тісним зв'язкам між своїми країнами."
 WORLD.211.a: "Подивимося, чи зробила Франція правильний вибір."

 WORLD.212.t: "[Get_newspaper_header]Франція скасовує Віші"
 WORLD.212.desc: "Люди Франції виходять на вулиці на святкування, оскільки уряд чинного президента Франції Антуана Пінаї в історичний момент оголосив про скасування Вішійської угоди, поклавши кінець п’ятнадцятирічному періоду труднощів і принижень, які наклала на Францію німецька окупація.\n\nХоча угода була фактично скасована через бурґундське вторгнення у Францію, нещодавні кроки президента все одно були зустрінуті з великим підтриманням усіх верств французького суспільства, за винятком сумнозвісних пронімецьких ППФ. Цей крок також був визнаний багатьма міжнародними коментаторами як важливий крок у планах президента Пінаї відновити французьку демократію та вивести країну з німецької сфери впливу."
 WORLD.212.a: "Старий порядок поступово йде на спад з кожним днем."

 WORLD.213.t: "[Get_newspaper_header]План Делувр'є"
 WORLD.213.desc: "Міжнародні спостерігачі виявляють великий інтерес до адміністрації Антуана Пінаї з того часу, як він був обраний на посаду наступника Хюнцегера. Очевидно, що новий президент працює над демократизацією французької держави. Одним з останніх кроків у цьому напрямку є План Делувр'є.\n\nПлан Делувр'є - це економічна ініціатива, спрямована на відновлення французької економіки після її руйнації. Названий на честь Поля Делувр'є, план акцентує увагу на розширенні, модернізації, ефективності та сучасних управлінських практиках. План зосереджує, пріоритетизує і веде інвестиції до визначених цілей, менш жорстким підходом до економіки порівняно з іншими подібними планами."
 WORLD.213.a: "Пінаї, здається, дійсно змінює ситуацію на краще."

 WORLD.214.t: "[Get_newspaper_header]Путч ОАС у Франції"
 WORLD.214.desc: "Термін перебування президента Французької держави Антуана Пінаї завершився передчасно через переворот, організований Організацією армії таємної (ОАС). Одна з кількох потужних міліцій країни, ОАС вирішила вжити рішучих заходів проти реформістського президента після того, як він намагався зменшити владу міліцій.\n\nЗ їхнім лідером Раулем Саланом на чолі Французької держави, мілітаристські націоналісти ОАС тепер можуть реалізувати свою програму без перешкод по всій країні. Вже почали мобілізуватися війська на бургундському кордоні, а міліціянти та поліція активно придушують внутрішні протести."
 WORLD.214.a: "Крок від реформ до реакції."

 WORLD.215.t: "[Get_newspaper_header]Створення Четвертої Французької Республіки"
 WORLD.215.desc: "Подібно до штурму Бастилії, рівно 181 рік тому, святкуючі маси Франції вийшли на вулиці в екстазі, радіючи нещодавньому прийняттю конституції 1970 року Антуана Пінаї, яка фактично поклала кінець Французькій державі та проголосила створення Четвертої Французької Республіки.\n\nЧинний президент Французької держави Антуан Пінаї залишиться на чолі нової республіки до офіційних виборів, що відбудуться пізніше цього року. Оскільки це будуть перші справжні демократичні вибори у Франції з 1936 року, вони стануть як буремними, так і критичними, адже доля Франції знову потрапить до рук її народу після десятиліть тиранії та автократії."
 WORLD.215.a: "Свобода, рівність, братерство!"

 WORLD.216.t: "[Get_newspaper_header]Перемога Парті Національ у французьких виборах"
 WORLD.216.desc: "Перші справжні демократичні вибори у Франції після 1936 року та приходу німецьких окупантів лише чотири роки потому завершилися очевидною перемогою чинної Партії Національ та її кандидата Антуана Пінаї, формально надавши чинному президенту мандат від народу для продовження на наступний термін.\n\nПереобрання президента Пінаї було далеко не неочікуваним, адже його статус як чоловіка, який відновив французьку демократію та заснував Четверту Республіку, зробив його популярним серед населення Франції. Крім того, очевидно, що народ Франції обрав зручність та стабільність, які приносить знайоме, надійне обличчя, замість фактору невизначеності, який супроводжує нові обличчя, особливо після років тиранії та хаосу."
 WORLD.216.a: "Те ж обличчя, нова Франція."

 WORLD.217.t: "[Get_newspaper_header]Перемога Парті Травайліст Франсез у французьких виборах"
 WORLD.217.desc: "Робітники та трудящі Франції радіють оголошенню про перемогу Парті Травайліст Франсез та кандидата Франсуа Міттеранда на перших демократичних виборах у Франції після 1936 року.\n\nХоча Міттеран був контроверсійною фігурою для багатьох зліва та справа через свої зв'язки з урядом тиранічної Французької держави, він і його партія все ж проявили себе як рішучі захисники соціялістичних ідеалів, адже ПТФ була єдиною партією, яка підтримувала соціялістичні ідеї в епоху Французької держави, де і союзництво, і соціялізм піддавалися важкому державному переслідуванню. Обіцяючи просувати справу соціальної справедливості та емансипації трудящих, вибори Міттеранду показують чіткий зсув до лівих ідеалів серед народу після десятиліть під фашистським чоботом."
 WORLD.217.a: "Повернення Народного фронту."

 WORLD.218.t: "[Get_newspaper_header]Перемога Рассамблеман для нації у французьких виборах"
 WORLD.218.desc: "Хоча поразка Парті Національ на перших демократичних виборах у Франції після 1936 року не була повністю неочікуваною, ніхто не очікував, що менша, але схожа за консерватизмом партія РПН виграє, але під керівництвом Каміль Лоренса вона здобула виборчу перемогу та потрапила до владних коридорів.\n\nПопри це, вибори РПН вважаються відносно непотрібними, адже поміркований, християнсько-демократичний підхід партії та її зобов'язання висувати нове покоління політиків зробили її популярною серед населення, що втомилося від асоціації Парті Національ з Французькою державою та популізму лівих."
 WORLD.218.a: "Центр справді може триматися."

 WORLD.219.t: "[Get_newspaper_header]Перемога Уніон пур ла Демократі Франсез у французьких виборах"
 WORLD.219.desc: "Після десятиліть нещадних труднощів, страждань та тиранії під автократичною та фашистською Французькою державою здавалося, що справжні французькі революційні та республіканські цінності Свободи, Рівності, Братерства покинули Францію. Однак це було доведено неправильним, адже Едмон Жіскар д'Естен та Уніон пур ла Демократі Франсез здобули вражаючу перемогу на перших справжніх демократичних виборах у Франції з 1936 року.\n\nСильні зв'язки Уніон пур ла Демократі Франсез з Французьким опором та її непохитне дотримання принципів демократії зробили партію символом радикальних, революційних та республіканських цінностей, які визначають французьку історію та політичне життя з моменту штурму Бастилії. Статус, який сприяв популярності партії та який визначатиме їхню політику, коли Франція вступатиме в нову еру соціальної справедливості."
 WORLD.219.a: "Свобода, Свобода, улюблена Свобода!"

 WORLD.220.t: "[Get_newspaper_header]Франція приєднується до Організації Свободних Націй"
 WORLD.220.desc: "Після серії переговорів з американським послом президент Французької Республіки, посилаючись на історію Франції та Америки як близьких союзників і їх спільну місію захищати цінності свободи та демократії, оголосив світу про намір своєї нації приєднатися до Організації Свободних Націй. Хоча США визнали уряд Віші як легітимний уряд Франції з моменту його проголошення, відносини залишались холодними. Однак відносини швидко покращились після відновлення демократії в Франції Антуаном Пінаї, що відкрило шлях до членства Франції в ОСвН, оскільки молода республіка була під загрозою з боку моря фашизму, яке її оточувало.\n\nЯк велика перемога для Америки та Світового Союзу, вступ Франції до ОСвН є ще одним свідченням того, як Новий порядок Німеччини в Європі розвалюється, оскільки вони втрачають контроль над континентом."
 WORLD.220.a: "Світ Свободи стає більшим з кожним днем!"

 WORLD.221.t: "[Get_newspaper_header]Переворот Міліс Франсез у Французькому уряді"
 WORLD.221.desc: "Жителі великих міст Французької держави сьогодні прокинулися і почули марш міліційних підрозділів. Скориставшись непопулярністю реформ президента Бішелонне, традиціоналістська міліція здійснила переворот, який успішно скинув Бішелонне. Лідер міліції Жозеф Дарнард оголосив себе главою нації і в публічній промові пообіцяв повернути Францію до ідеалів праці, родини та батьківщини."
 WORLD.221.a: "Маршал Петен може бути мертвий, але його ідеали живуть."

 WORLD.222.t: "[Get_newspaper_header]Жан Бішелонне усунений"
 WORLD.222.desc: "Президент Французької держави Жан Бішелонне був усунений від влади після невдалої ратифікації його запропонованої конституції. Бішелонне сподівався закріпити свою технократичну візію майбутнього через цю конституцію, але, схоже, йому не вдалося здобути довіру політичних еліт країни. Комітет національної координації, група індустріалістів і інженерів, що підтримували Бішелонне, тепер перебуває при владі, але їхній контроль над ситуацією є слабким, і багато хто вважає, що технократичні реформи скоро впадуть."
 WORLD.222.a: "Крок вперед, два кроки назад"

 WORLD.223.t: "[Get_newspaper_header]Нова Конституція Франції ратифікована"
 WORLD.223.desc: "Президент Жан Бішелонне Французької держави святкує велику політичну перемогу сьогодні, оскільки нова конституція закріпила технократичну візію президента в законі. Хоча багато політичних еліт і звичайних працівників скептично ставляться до нової конституції, економічний успіх, який приніс режим, просто не можна заперечити. Тепер Французька держава готова стати нацією, керованою індустріалістами та інженерами, а не політиками."
 WORLD.223.a: "Сміливий крок у 20-е століття."

 WORLD.224.t: "[Get_newspaper_header]Петеністський переворот у Франції"
 WORLD.224.desc: "Після місяців невизначеності в уряді Франції після підвищення Гакотта до посади президента, сьогодні стався переворот у Французькій державі.\n\nПереворот був здійснений петеністами серед військових, урядовців та їхніх симпатиків серед різних міліцій. Тепер чинний французький уряд замінено фашистським режимом, очолюваним Альфонсом Жюїном, відомим членом французької армії та раннього уряду Французької держави.\n\nЗважаючи на погане здоров'я Жюїна, багато зовнішніх спостерігачів дивуються, чи зможе Жюїн справді правити, як його попередник, Філіпп Петен."
 WORLD.224.a: "Здається, Франція відкинула монархічний експеримент."

 WORLD.225.t: "[Get_newspaper_header]Олівіє Гішар обраний французьким прем'єр-міністром"
 WORLD.225.desc: "Після нещодавніх виборів у Королівстві Франція, Олівіє Гішар був обраний прем'єр-міністром при Анрі VII. Олівіє Гішар колись був відносно невідомою фігурою в політиці Франції. Однак його репутація як фігури компромісу та політичної нейтральності залишила йому мало суперників, що дозволило йому перемогти на виборах.\n\nЯк і Анрі VII, Гішар не є фанатичним монархістом і належить до невеликої реформістської фракції уряду Аксьйон Франсез. Зовнішні спостерігачі очікують, що Королівство Франція лібералізується під новим прем'єр-міністром, якщо його програма буде успішною."
 WORLD.225.a: "Здається, Франція обрала сторону проти абсолютизму."

 WORLD.226.t: "[Get_newspaper_header]Жан д'Ормессон обраний французьким прем'єр-міністром"
 WORLD.226.desc: "Після нещодавніх виборів у Королівстві Франція, Жан д'Ормессон був обраний прем'єр-міністром при Анрі VII. На відміну від більш ліберального Гішара або рішучого реакціонера Пужо, д'Ормессон тримав позицію консерватора статус-кво. Цю позицію також підтримує Conseil d'Etat, що дало йому перевагу на виборах.\n\nХоча Жан д'Ормессон є більш поміркованим монархістом, ніж Пужо, він все ж є рішучим монархістом, постійно пропагуючи ідею, що король має бути недоторканним у політиці Франції."
 WORLD.226.a: "Здається, що позиція монархії скоро буде закріплена."

 WORLD.227.t: "[Get_newspaper_header]П'єр Пужо обраний французьким прем'єр-міністром"
 WORLD.227.desc: "Після нещодавніх виборів у Королівстві Франція, П'єр Пужо був обраний прем'єр-міністром при Анрі VII. З усіх трьох головних кандидатів на останніх виборах, Пужо є найбільш затятим монархістом. Син співзасновника Аксьйон Франсез Моріса Пужо, він є прихильником традиціоналізму та консерватизму, що гармоніює з планами та ідеологією організації його батька.\n\nЗалишається побачити, як він погодить свої рішучі традиціоналістські цінності з прогресивними переконаннями короля та демократичними симпатіями."
 WORLD.227.a: "Здається, Франція вирішила повернутися до минулих часів."

 WORLD.228.t: "[Get_newspaper_header]Переворот міліцій у французькому уряді"
 WORLD.228.desc: "Аксьйон Франсез не змогла знайти монарха для свого уряду після того, як керувала Французькою державою кілька місяців, і, здається, народ уже втомився. Три впливові французькі міліції, Міліс Франсез, ОАС та Муве Франсіст, об'єдналися, щоб скинути Гакотта та його союзників.\n\nНезважаючи на взаємну неприязнь між трьома міліціями, вони вирішили відкласти свої розбіжності, щоб повернути те, що вони називають стабільністю у Францію. Тепер здається, що лідер ОАС Рауль Салан очолить французьку націю. Однак майбутнє його коаліції залишається невизначеним."
 WORLD.228.a: "Порожній трон не має великої цінності."

 WORLD.229.t: "[Get_newspaper_header]Французька громадянська війна"
 WORLD.229.desc: "Кілька місяців тому П'єр Пужад розпочав свою так звану "війну проти 200 родин". Це спроба Пужада зменшити вплив промисловців та банкірів у французькій державі, але катастрофічне керівництво цією "війною" призвело до руйнування державної влади по всій країні.\n\nВ цьому хаосі антивладні сили піднялися, щоб захопити ініціативу. Солдати як націоналістичної OAS, так і демократичної Резистанс захопили величезні території по всій Франції, залишивши уряд Пужада під контролем лише невеликої частини колишніх територій. Французи по всій країні займають сторони в цьому конфлікті, борючись за невизначене майбутнє, борючись, щоб забезпечити, що Франція їхніх сподівань та мрій не загине на полі бою."
 WORLD.229.a: "В житті і на війні смерть є єдиною невизначеністю."

 WORLD.30100.t:0 "[Get_newspaper_header]Французька громадянська війна"
 WORLD.30100.desc:0 "Шок і жах вийшли з Франції, адже, схоже, що пороховий котел нарешті вибухнув. Роки напруженості під залізною рукою президента Сідоса призвели до повного колапсу урядової влади, коли різні дисиденти піднялися на боротьбу проти держави: Резистанс першими піднялися в Ла-Рошелі, після чого розпочалося контрповстання різних міліцій: до того ж додається комуністичне повстання в Марселі, оскільки партизани підняли зброю проти режиму Сідоса.\n\nКожна з цих фракцій проголосила себе законним урядом Франції, і боротьба стає дедалі частішою по всій країні. Франція знову опинилася в поганому становищі, і тільки час покаже, чи зануриться вона ще глибше в прірву."
 WORLD.30100.a:0 "Le début de la mort."
 WORLD.30100.b:0 "Франція знову має ногу в могилі."
 
 WORLD.30101.t:0 "[Get_newspaper_header]Сідос виграє Французьку громадянську війну!"
 WORLD.30101.desc:0 "Схоже, що сьогодні кривава Французька громадянська війна нарешті добігла кінця, і П'єр Сідос з його європейцями святкують перемогу після завершення конфлікту. Для багатьох міжнародних спостерігачів передбачити переможця в цьому конфлікті було майже неможливо, адже було так багато різних фракцій, які боролися зубами та нігтями за панування над уламками Франції.\n\nТепер, після перемоги Сідоса, багато аналітиків прогнозують, що він подвоїть свої попередньо впроваджені політики у Франції. Це вимагає набору авторитарних традиціоналістських політик, які будуть впроваджені серед французького населення. Крім того, очікується, що Сідос продовжить зміцнювати зв'язки зі своїм європейським союзником, щоб зберегти Францію безпечною та процвітаючою."
 WORLD.30101.a:0 "А що для французів?"
 
 WORLD.30102.t:0 "[Get_newspaper_header]Резистанс виграє Французьку громадянську війну!"
 WORLD.30102.desc:0 "Французька громадянська війна завершилася шокуючим чином, оскільки Резистанс святкує перемогу, проголошуючи нову Французьку Республіку після їхнього тріумфу. Багато людей, як у Франції, так і в решті світу, вважали, що Резистанс - це лише міф після жорстких репресій Філіпа Петіна. Це було спростовано, коли вони піднялися на боротьбу в момент початку Французької громадянської війни.\n\nТепер багато французьких громадян святкують перемогу Резистанс на вулицях. Тим часом у залах влади вже плануються вибори, щоб забезпечити, що громадяни Франції знову матимуть справжній вплив на уряд. Проти всіх шансів, здається, що демократія повертається до Франції."
 WORLD.30102.a:0 "Їх вважали міфом."
 
 WORLD.30103.t:0 "[Get_newspaper_header]Революціонери виграють Французьку громадянську війну!"
 WORLD.30103.desc:0 "У шокуючому повороті подій здається, що коаліція лівих і студентських міліцій змогла здобути перемогу у Французькій громадянській війні, проголосивши Народну Республіку Франції в Марселі сьогодні вранці. Широка фронт комуністів, соціялістів і анархістів, серед інших, революційний рух організовувався в належний уряд, оскільки останні сили реакції були витіснені з Франції.\n\nЦей уряд ідеалістів і мрійників, очолюваний Жаком Саважо, був знехтуваний багатьма країнами світу, і все ж факт залишається: Франція стала червоною, і Паризька комуна була помщена. Однак багато напружень залишаються, оскільки ворожі держави та наддержави все ще перебувають на порозі нової Республіки."
 WORLD.30103.a:0 "Великий експеримент живе!"
 WORLD.30103.b:0 "Це не добре, нам потрібно діяти."
 WORLD.30103.c:0 "Франція входить у нову, червону еру."
 
 WORLD.30104.t:0 "[Get_newspaper_header]OAS виграє Французьку громадянську війну!"
 WORLD.30104.desc:0 "Як тільки Французька громадянська війна починає затихати, і бої здаються завершеними, стало очевидно, що одна з фракцій вийшла переможцем. Організація Таємної Армії (OAS), міліція, створена в 50-х роках з відколів від Міліс і дезертирів з армії, встановила контроль над тим, що залишилося від Франції. Раніше одна з найбільш відомих міліцій, зараз очевидно, що їх професіоналізм і військові зв'язки дали їм перевагу над конкурентами.\n\nOAS визначають себе націоналістичною та реваншистською риторикою. Їх лідер, Рауль Салан, вже закликав до відновлення "правомірно французької території". Повідомлення про збільшення набору та підготовки до війни не залишають сумнівів у планах OAS."
 WORLD.30104.a:0 "Мир ще не прийшов у Францію."
 
 WORLD.30105.t:0 "[Get_newspaper_header]Міліс виграє Французьку громадянську війну!"
 WORLD.30105.desc:0 "Дух режиму Віші знову живе, оскільки Міліс Франсез вийшли переможцями в Французькій громадянській війні. Ідеологічні нащадки Філіпа Петіна, Міліс представляють одну з політичних ідеологій, яка давно вважалася зниклою у Франції. Насправді Міліс можуть простежити свою історію до заснування уряду Віші, виступаючи як парамілітарна організація навіть тоді.\n\nТепер, коли жорстка міліція контролює вулиці Франції, неминучі ідеологічні репресії. Уже надходять повідомлення, що ліберали та інші реформисти стали жертвами масових арештів після завершення громадянської війни. З міліційними солдатами, що патрулюють вулиці Франції, здається, що порядок повернувся до Франції."
 WORLD.30105.a:0 "Залізний кулак."
 
 WORLD.30106.t:0 "[Get_newspaper_header]Франкісти виграють Французьку громадянську війну!"
 WORLD.30106.desc:0 "Розчарування та здивування вийшли з Франції, оскільки Мувеман Франкіст виграли Французьку громадянську війну і тепер стоять як непереможні правителі нації. Маленька, але віддана група ґерманофільських фашистів на чолі з колишнім союзником колишнього президента Сідоса, Франсуа Дюпра, їхнє панування над Францією здається дуже нестійким, однак, з партизанськими боями, що тривають.\n\nПрихід Дюпра до влади викликав багато реакцій серед міжнародної спільноти, зокрема, з привітаннями від Німеччини; реакції від представників Світової Спільноти були значно менш помітними. Однак зараз, здається, що Франкісти тут залишаться, і Франція занурюється в нову еру фашизму."
 WORLD.30106.a:0 "Heil Duprat!"
 WORLD.30106.b:0 "Ми вітаємо Францію назад у наші ряди."
 WORLD.30106.c:0 "Зустрічайте нового боса..."
 
 WORLD.30107.t:0 "[Get_newspaper_header]Сауже виграє Французьку громадянську війну!"
 WORLD.30107.desc:0 "Історія повна сюрпризів, і жоден сюрприз за останні кілька років не був більшим за результат Французької громадянської війни. Повідомлення стверджують, що Жорж Сауже, який ще кілька років тому був практично невідомим французьким політиком, став переможцем над усіма іншими фракціями в конфлікті. Альянс з Італією допоміг його повстанню проти французького уряду, і тепер Сауже сидить в Бордо разом зі своїми італійськими союзниками.\n\nДосі Сауже зосередився на відродженні католицьких традицій Франції та своїй привабливій риториці. Сауже здобув підтримку завдяки своїй риториці "антиекстремізму" і здатності будувати коаліцію поміркованих навколо себе. Цю політичну стратегію він, ймовірно, буде слідувати в найближчому майбутньому."
 WORLD.30107.a:0 "Франція та Італія разом рухаються вперед."

 WORLD.30108.t:0 "[Get_newspaper_header]Пужад виграє Французьку громадянську війну!"
 WORLD.30108.desc:0 "Популізм, здається, переміг, оскільки уряд П'єра Пужада вийшов на верх у Французькій громадянській війні. [FRA_GetPoujadeEnemy].\n\nХоча цей розвиток подій не був зовсім несподіваним, що залишилось невизначеним, так це курс, який уряд Пужада візьме відтепер. Хоча Нові Генеральні Штати, проект Пужада, відбудуться за планом, залишається побачити, яким буде його результат; одне ж певне - міфічна влада "200 родин" була остаточно зламана."
 WORLD.30108.a:0 "Ніщо не може завадити рішучому чоловіку."

 WORLD.30109.t: "[Get_newspaper_header]Проголошення Союзу Іберійських Соціялістичних Республік"
 WORLD.30109.desc: "Іберійський півострів знову опинився в центрі світової уваги, оскільки сили Португальської народної республіки захопили Іспанію у своєму хрестовому поході за визволення всіх робітників, від Лісабона до Барселони, проголосивши народження Союзу Іберійських Соціялістичних Республік.\n\nХоча народження нової нації святкують як в Іберії, так і за кордоном, багато невирішених проблем відкидають тінь на цей тріумф, оскільки молода нація стикається з питаннями щодо характеру своєї мирної економічної та політичної організації. Мабуть, найважливіше - як Європа відреагує на нову червону загрозу, що постає на її порозі, адже франко-іберійський кордон, за повідомленнями, вже перебуває у стані підвищеної готовності."
 WORLD.30109.a: "Trabalho e unidade."
 WORLD.30109.b: "Кляті комуняки..."
 WORLD.30109.c: "Що ж, це було несподівано."

 WORLD.30110.t: "[Get_newspaper_header]" #unused
 WORLD.30110.desc: ""
 WORLD.30110.a: ""

 WORLD.30111.t: "[Get_newspaper_header]Іспанська перемога в іспансько-португальській війні"
 WORLD.30111.desc: "Іспанія оголосила про повну перемогу над Португалією у війні між двома колись об'єднаними націями. Її сили, укомплектовані ветеранами нещодавніх внутрішніх конфліктів Іспанії, тепер тріумфально марширують через Лісабон, як і обіцяли на початку конфлікту.\n\nНавіть коли формується нова адміністрація, доля меншої іберійської нації залишається невизначеною. Хоча Мадрид уже розпочав процес відновлення стабільності в Португалії, його довгострокові плани поки що публічно невідомі."
 WORLD.30111.a: "Victoria al fin."
 WORLD.30111.b: "І подумати тільки, вони колись називали одне одного братами."

 WORLD.30112.t: "[Get_newspaper_header]Португальська перемога в іспансько-португальській війні"
 WORLD.30112.desc: "Червоний кінь війни нарешті покидає Іберійський півострів - на завершальному етапі Іберійських воєн нещодавно возз'єднана Португалія тріумфально стоїть над силами Мадрида, а її війська тепер відновлюють бодай якусь подобу порядку в спустошеній війною країні.\n\nОднак частиною свого успіху португальці завдячують співпраці з іспанськими республіканцями під час свого наступу. Тепер їх поставлено новим урядом у Мадриді в обмін на їхню допомогу, і окупація Іспанії, як очікується, буде короткою справою - війська мають піти, щойно новий режим стабілізується."
 WORLD.30112.a: "Finalmente a vitoria."
 WORLD.30112.b: "Чи це початок ще одного союзу?"

 WORLD.30113.t: "[Get_newspaper_header]Португальська перемога в іспансько-португальській війні"
 WORLD.30113.desc: "Мир нарешті приходить до Іберії, оскільки конфлікт між нещодавно возз'єднаними націями Португалії та Іспанії завершується перемогою першої. Армії Лісабона тріумфально марширують через Іспанію, а португальські прапори майорять над військовими таборами під Мадридом.\n\nОднак португальська перемога не була суто їхньою заслугою, адже вони тісно співпрацювали з карлістськими міліціями та організаціями по всій Іспанії, які тепер винагороджені владою над новою нацією. Окупація Іспанії, як очікується, буде короткою справою - війська мають піти, щойно новий режим стабілізується, а Лісабон уже оголосив про нові "братерські" відносини між двома Королівствами."
 WORLD.30113.a: "Finalmente a vitoria."
 WORLD.30113.b: "Народжується новий лад в Іберії."

 WORLD.30114.t: "[Get_newspaper_header]Португальська перемога в іспансько-португальській війні"
 WORLD.30114.desc: "Португалія стоїть без суперників на Іберійському півострові, тоді як її колишня іберійська партнерка-нація, Іспанія, лежить розпростерта перед нею. Португальські війська присутні по всій Іспанії, а військові розправляються з останніми осередками опору.\n\nПереможне Королівство не гаяло часу на встановлення республіканського уряду для управління Іспанією, але не раніше, ніж вирвало багато жорстких поступок, як-от військові обмеження та передачу контролю над Галісією Лісабону. Баланс сил в Іберії змістився безповоротно, і світ чекає, що станеться далі."
 WORLD.30114.a: "Finalmente a vitoria."
 WORLD.30114.b: "Чи Іспанія втрачена назавжди?"

 WORLD.30115.t: "[Get_newspaper_header]Іспанська перемога в іспансько-португальській війні"
 WORLD.30115.desc: "Барабани війни замовкають по всьому Іберійському півострову, оскільки Іспанія беззаперечно перемагає в іспансько-португальській війні, підкоряючи свого іберійського суперника й окуповуючи його, водночас забезпечуючи собі всі території, які Португалія намагалася захопити в хаосі конфлікту.\n\nОкупація, як очікується, не триватиме довго - вважається само собою зрозумілим, що Іспанія незабаром розпочне переговори з ОВН і Португальською конфедерацією, щоб вирішити, що станеться з переможеною Португалією та майбутнім Іберії."
 WORLD.30115.a: "Victoria al fin."
 WORLD.30115.b: "Можливо, нові можливості?"

 WORLD.30116.t: "[Get_newspaper_header]Регіональні уряди перемагають у Громадянській війні в Іспанії"
 WORLD.30116.desc: "Мир повертається до Іспанії після краху Іберійського союзу, але з несподіваного боку. Каталонія, Галісія та Країна Басків зазнали вторгнення іспанського уряду, який здолав своїх суперників і прагнув силою возз'єднати країну. Але війська цих регіонів, ретельно підготовлені, здобули серію вирішальних перемог, що завершилося падінням режиму загарбників.\n\nНе маючи особливого інтересу самим окуповувати величезну й спустошену Месету, регіони відновили Іспанську Республіку. Своєю чергою, новий республіканський уряд визнав їх повністю незалежними державами і поступився бажаними територіями, посилаючись на їхні самобутні культури та внесок у справу свободи по всьому півострову. Втім, чутки свідчать, що відновлення Республіки залежало від прийняття нею цих вимог."
 WORLD.30116.a: "Саме так, як ми хотіли."
 WORLD.30116.b: "Наша боротьба перемагає велетнів!"
 WORLD.30116.c: "Вони здобули право будувати власне майбутнє."

 WORLD.30117.t: "[Get_newspaper_header]Припинення вогню в іспансько-португальській війні"
 WORLD.30117.desc: "По всьому Іберійському півострову звуки артилерійських обстрілів і кулеметних черг стихають в нікуди, оскільки війна між Іспанією та Португалією завершується - жодна зі сторін не змогла остаточно перемогти іншу. Лінії фронту застрягли на традиційних кордонах двох націй, жодна з яких не в змозі суттєво просунутися на територію іншої.\n\nЗ заморожуванням конфлікту обидва уряди дійшли розуміння та підписали угоду про припинення вогню, взаємно визнавши свої нинішні кордони. Політики з обох сторін висловили невдоволення, проте цей новий статус-кво, схоже, залишиться надовго."
 WORLD.30117.a: "Найбільш антикульмінаційний мир."
 WORLD.30117.b: "Ми ще повернемось!"
 
 WORLD.30200.t:0 "[Get_newspaper_header]Мексикансько-гватемальська війна"
 WORLD.30200.desc:0 "Після несподіваних атак гватемальських морських і сухопутних сил Мексика оголосила війну своєму південному сусіду та закликала до зброї членів Веракруського пакту, на що Куба та Карибський легіон відповіли негайно. У Гватемалі генерал Мігель Ідігорас Фуентес розпустив правлячу військову хунту й особисто взяв владу через надзвичайні заходи.\n\nХоча ворожнеча між двома країнами сягає глибокого коріння, напруга досягла піку після невдалої висадки Легіону, яка, як вважається, підтримувалась Мексикою. Побоюючись нової спроби, гватемальські ВМС і ВПС атакували мексиканську рибальську флотилію у спірних водах. Після загибелі десятків мексиканців генерал Ідігорас завдав превентивного удару, щоб випередити неминучу збройну відповідь. Хоча вздовж кордону повідомляється про значні втрати, більшість очікує, що Мексика та її союзники здобудуть вирішальну перемогу в найближчі місяці.\n"
 WORLD.30200.a:0 "Іскра, запалена в 58-му, стала пожежею."
 
 WORLD.30201.t:0 "[Get_newspaper_header]Колом Аргета обраний у Гватемалі, Мексика виводить війська"
 WORLD.30201.desc:0 "Мануель Колом Аргета та партія Unidad Revolucionaria Democratica здобули переконливу перемогу на перших виборах Гватемали з початку мексиканської окупації. Прославляючи чесноти нової гватемальської революції, муніципального розвитку та ехідальної земельної реформи, УРД здобула конституційну більшість у законодавчому органі, хоча проти партії та окупаційної влади висувались звинувачення у виборчому шахрайстві.\n\nНа церемонії інавгурації генерал Ерменехільдо Куенка Діас оголосив, що мексиканські війська розпочнуть виведення з Гватемали. Президент Колом Аргета подякував генералу та мексиканському народу за "підтримку гватемальського народу в побудові тривких революційних інституцій та сприяння національній відбудові й розвитку." Обидві сторони пообіцяли поглибити співпрацю, а Гватемала, як очікується, незабаром подасть заявку на вступ до Веракруського пакту.\n"
 WORLD.30201.a:0 "Земля вічної весни, скута вічними путами."
 
 WORLD.30202.t:0 "[Get_newspaper_header]Оспорювані вибори знаменують кінець мексиканської окупації Гватемали"
 WORLD.30202.desc:0 "Мануель Колом Аргета оголосив про перемогу на президентських виборах Гватемали, а його УРД також здобула конституційну більшість місць у законодавчому органі та муніципалітетах. Опозиційні партії засудили результати, звинувачуючи мексиканську окупаційну владу у відвертому шахрайстві та насильстві.\n\nВітаючи Колома Аргету, генерал Ерменехільдо Куенка Діас оголосив про виведення мексиканських збройних сил з Гватемали. Новину погано сприйняли мексиканські конгломерати, багато з яких скасували заплановані аграрні інвестиції, побоюючись зростання етнічного майянського повстання. Проте Колом Аргета подякував Куенці Діасу та мексиканському народу за їхню відданість Гватемалі, і, як очікується, за його правління новостворена революційна республіка прагнутиме членства у Веракруському пакті.\n"
 WORLD.30202.a:0 "Крізь війну Гватемала перетворилась з ворога на тягар."

