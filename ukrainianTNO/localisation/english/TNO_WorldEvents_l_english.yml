## VIETNAM
####################

VIN_news.1.t:0 "[Get_newspaper_header]Чионг Ту Ань бере владу над в'єтнамським урядом"
VIN_news.1.desc:0 "Після провалу операції "Йон-Го" проти В'єтміню, уряд Чан Ван Чионга розпався. Наступний уряд на чолі з Ву Нгок Анем протримався недовго, і відставка Прем'єр-міністра була на порядку денному ще до того, як новий уряд був остаточно затверджений.\n\nЧионг Ту Ань та його Національний фронт, найбільша політична організація в країні, підтвердили цей факт своїм приходом до влади. Національний фронт - пропонська організація, що обстоює "виживання нації", з розмитою платформою, яка вміщує широке коло фракцій. В'єтмінь оголосив Чионга та Національний фронт реакціонерами та японськими маріонетками, і, схоже, конфлікт у В'єтнамі триватиме й надалі."
VIN_news.1.a:0 "Чи зможе Чионг Ту Ань привести В'єтнам до стабільності?"

VIN_news.2.t:0 "[Get_newspaper_header]Нго Дінь Дьєм бере владу над в'єтнамським урядом"
VIN_news.2.desc:0 "Після провалу операції "Йон-Го" проти В'єтміню, уряд Чан Ван Чионга розпався. Наступний уряд на чолі з Ву Нгок Анем протримався недовго, і відставка Прем'єр-міністра була на порядку денному ще до того, як новий уряд був остаточно затверджений.\n\nХоча новий лідер, Нго Дінь Дьєм, ставиться до Токіо доволі стримано, він аж ніяк не є антияпонським. Він та його брат Ню обстоюють "східний персоналізм" - дивну ідеологію, вкорінену в католицькій філософії, що закликає до соціальної революції. Попри свою нечисленність, вони стали вкрай впливовими, і побоювання щодо повного католицького захоплення влади поширені повсюдно. В'єтмінь оголосив персоналістів Дьєма реакціонерами та японськими маріонетками, і, схоже, конфлікт у В'єтнамі триватиме й надалі."
VIN_news.2.a:0 "Чи протримається цей уряд довше за попередній?"

VIN_news.3.t:0 "[Get_newspaper_header]Нгуєн Фук Мінь Дик здійснює переворот!"
VIN_news.3.desc:0 "Після провалу операції "Йон-Го" проти В'єтміню, уряд Чан Ван Чионга розпався. Наступний уряд на чолі з Ву Нгок Анем протримався недовго, і відставка Прем'єр-міністра була на порядку денному ще до того, як новий уряд був остаточно затверджений.\n\nСьогодні вранці військові підрозділи взяли під контроль Тхуан Хоа, нібито для "підтримання порядку" за наказом принца Мінь Дика. Причини цього перевороту досі незрозумілі, але очікується, що Імператор офіційно призначить його пізніше сьогодні. Роялісти, раніше маргінальна сила, здивували спостерігачів своїм раптовим відродженням. В'єтнам охопили протести та засудження з боку В'єтміню, який називає уряд реакційним і звинувачує напівфранцузького принца в тому, що він є французьким агентом."
VIN_news.3.a:0 "Чи справді роялісти можуть стабілізувати В'єтнам?"

VIN_news.4.t:0 "[Get_newspaper_header]Нгуєн Хань здійснює переворот у в'єтнамському уряді!"
VIN_news.4.desc:0 "Нещодавно почали з'являтися повідомлення про переворот у В'єтнамі. На тлі нещодавніх успіхів В'єтміню по всій країні довіра до цивільного уряду була серйозно підірвана. Після розриву стосунків між урядом та військовими, збройні сили визнали за потрібне взяти під контроль головні міста В'єтнаму.\n\nРадіо та газети повідомляють, що нова Національна військова рада на чолі з генералом Нгуєном Ханем візьме на себе управління державними справами на невизначений термін через комуністичний заколот. З огляду на неоднозначний послужний список імперської армії в боротьбі проти В'єтміню, незрозуміло, чого прагне досягти цей переворот. Хай там як, уряд Нгуєна Ханя вже звернувся до Токіо за допомогою у своїй війні проти комунізму."
VIN_news.4.a:0 "Здається, ситуація у В'єтнамі лише продовжує погіршуватися."

VIN_news.5.t:0 " [Get_newspaper_header] [VIN.GetLeader] скасовує в'єтнамську монархію!"
VIN_news.5.desc:0 "В'єтнамський уряд на чолі з [VIN.GetLeader] оголосив про офіційне скасування монархії. Імператорська родина, хоч і не викликала особливої зневаги, здебільшого була другорядною рисою в'єтнамської політики. Уряд назвав причинами свого рішення зайві витрати на утримання способу життя родини, а також суспільні настрої.\n\nІмператорська родина зробила коротку заяву, в якій прийняла це рішення та підтвердила, що продовжуватиме служити В'єтнаму як приватні особи. Уряд вирішив дозволити імператорській родині зберегти свої маєтки та призначив їй утримання."
VIN_news.5.a:0 "Тисяча років, стерта одним розчерком пера."

VIN_news.6.t:0 "[Get_newspaper_header]Проголошено Демократичну Республіку В'єтнам"
VIN_news.6.desc:0 "Після понад двадцяти років спротиву В'єтмінь захопив владу у В'єтнамі. Відтоді антияпонська ліга видала Декларацію незалежності, закликавши всіх в'єтнамців об'єднатися під прапором Демократичної Республіки, захищати націю та вести країну до світлішого майбутнього.\n\nХоча нова Демократична Республіка має тимчасовий уряд, який заявляє, що представляє всі верстви в'єтнамського суспільства, більшість його членів - комуністи або пов'язані з ними особи. Цей акт викликав рішучі засудження з боку Токіо, а разом з ним і більшої частини Азії. Зокрема, Таїланд засудив новий уряд і надав притулок урядові у вигнанні. Зовнішні спостерігачі продовжують стежити за регіоном на предмет ознак подальшої ескалації."
VIN_news.6.a:0 "Полум'я революції поширюється на Сферу."

####################
## SUBCONTINENTAL CRISIS
####################

 SC_WORLD.1.t: "[Get_newspaper_header]Ґерманія відмовляється від Пакистану"
 SC_WORLD.1.d: "Велика перемога для Сфери Спільного Процвітання, Пакистан щойно був виключений з Пакту, оскільки Ґерманія була змушена відмовитися від своїх амбіцій в Азії через Японію та Індію. Вже німецькі офіційні особи та війська покидають Лахор в організованій евакуації країни, разом з важливими представниками пакистанського уряду та керівництва.\n\nБез підтримки Німеччини шанси Пакистану продовжувати існувати як незалежна країна варіюються від малоймовірних до неможливих, оскільки з’являються повідомлення про те, що індійські війська почали свою інвазію для об’єднання регіону. Опір, ймовірно, буде розрізненим та неорганізованим, і буде швидко знищений силами Азад Хінду, оскільки Пакистан, здається, повертається до своїх коренів як ідея, що підтримується малими силами."
 SC_WORLD.1.a: "Жодна сила на Землі не зможе врятувати Пакистан."
 SC_WORLD.1.x: "Наші серця з пригніченим народом."
 SC_WORLD.1.y: "Азії доведеться почекати."
 SC_WORLD.1.z: "Західний імперіалізм не може перемогти об’єднану Азію!"

 SC_WORLD.2.t: "[Get_newspaper_header]Індія змушена визнати незалежність Пакистану"
 SC_WORLD.2.d: "Перемога для німецької зовнішньої політики, індійська мрія про об’єднання субконтиненту під своїм прапором була остаточно зупинена, оскільки Індія змушена була визнати Пакистан незалежною нацією. Нещодавно було підписано офіційний «договор про дружбу» між двома країнами, що поклало кінець раніше загрозливим конфліктам і прикордонним сутичкам. Загалом вважається, що Індія погодилася на цей договір через Японію.\n\nУ Лахорі відбулися великі святкування, оскільки націоналісти радіють своїй перемозі над Індією, в той час як в офіційних колах Ґерманії були скромні святкування на честь дипломатичної перемоги. Водночас Біла Хата зазначила, що вітає такі зміни, натякаючи на потенційну співпрацю між двома країнами."
 SC_WORLD.2.a: "Азія стає набагато небезпечнішою."
 SC_WORLD.2.x: "Якщо не можеш їх перемогти..."
 SC_WORLD.2.y: "Жодна сила на Землі не може знищити Пакистан!"
 SC_WORLD.2.z: "Індія залишається розділеною... наразі."

 SC_WORLD.3.t: "[Get_newspaper_header]Третя Світова Війна починається"
 SC_WORLD.3.d: "Сьогодні найгірший сценарій став реальністю на субконтиненті, коли Індія вторглася до Пакистану, що призвело до оголошення Німеччиною війни Японії. З’являються повідомлення про повномасштабні бої між Свастикою та Висхідним Сонцем, коли їхні судна розривають одне одного в найбільш кровопролитних морських боях з часів попередньої Світової війни. В той же час їхні союзні країни готуються до втручання.\n\nХоча Америка тримає мовчання, вважається, що вона на межі вступу у війну, що додасть ще більше хаосу. Однак єдиний результат, який здається незмінним, незалежно від вигаданого переможця, - це повне ядерне знищення.\n\nВсе, що залишається тепер - це чекати, поки світ не загине."
 SC_WORLD.3.a: "Хто б не виграв, ми програємо."
 SC_WORLD.3.x: "Як ми можемо стояти осторонь, коли світ має виграти?"
 SC_WORLD.3.y: "Немає дороги назад."
 SC_WORLD.3.z: "Кожен за імперію."

 SC_WORLD.4.t: "[Get_newspaper_header]Ситуація в субконтиненті досягає патової ситуації"
 SC_WORLD.4.d: "Несподівані новини: Субконтинентальна криза завершилася сьогодні фактичним, хоч і не юридичним, прийняттям статусу кво. Все більше повідомлень з регіону вказують на те, що німецькі та японські війська відводяться з територій Пакистану та Індії відповідно, оскільки їхня увага переміщується на інші активні фронти Холодної війни.\n\nПрезидент [AZH.GetLeader] повідомляється, що дуже розлючений на своїх японських союзників за те, що вони покинули свою країну та її тривалі прагнення до повного об’єднання Індії, у той час як Пакистан випустив заяви, в яких пообіцяв продовжити опір «варварству» сусіда, обіцяючи зробити їх відповідальними за їхні загрози. Здається, що субконтинент продовжить залишатися в сірої зоні між миром і війною на даний момент."
 SC_WORLD.4.a: "Ще одна Холодна війна набирає обертів."
 SC_WORLD.4.x: "Найкраще, на що ми могли сподіватися."
 SC_WORLD.4.y: "Вчи своє місце."
 SC_WORLD.4.z: "Цей президент може бути набридливим..."

 SC_WORLD.6.t: "[Get_newspaper_header]Субконтинентальна криза"
 SC_WORLD.6.d: "Повідомлення з Індії вказують, що сили Азад Хінду зосереджуються вздовж кордону з Пакистаном у значних кількостях, оскільки президент [AZH.GetLeader] виступив з різким промовою, що підкреслює їх давнє прагнення повернути колишні території, які Пакистан захопив під час Війни за Об’єднання. Вже відбулися криваві сутички на кордоні, і немає ознак, що вони зменшаться.\n\nЯк Ґерманія, так і Японія роблять кроки до втручання, щоб зупинити конфлікт від ескалації у велику війну, яка приведе до прямого зіткнення супердержав. Однак широко вважається, що ці спроби вирішення конфлікту не є результатом мирних намірів, а з метою забезпечити найкращий результат для кожної зі сторін. Яким чином буде розв'язано це питання - поки що залишається невідомим."
 SC_WORLD.6.a: "Мир стає на друге місце."
 SC_WORLD.6.x: "Ще одна демократія під загрозою."
 SC_WORLD.6.y: "Європа не забуде свого союзника на сході."
 SC_WORLD.6.z: "Остаточний розрахунок не буде відкладено безкінечно."

 SC_WORLD.7.t: "[Get_newspaper_header]Субконтинентальна криза загострюється"
 SC_WORLD.7.d: "У чергових приголомшливих новинах з Південної Азії значні контингенти як німецьких, так і японських військ прибули до Пакистану та Індії, оскільки напруженість між супердержавами зростає до рівнів, яких ще не було. Дипломати з обох сторін стверджують, що ці заходи мають суто миротворчий характер, однак тим не менше, сутички на кордоні тільки посилились.\n\nПроте жодна зі сторін наразі не готова відступити, кожна з них продовжує збільшувати ставки, чекаючи на першу капітуляцію. Міжнародні спостерігачі стурбовані, що якщо жодна зі сторін не поступиться, єдиним результатом буде термоядерна війна, в якій усі сторони і решта світу програють. Проте, поки світ спостерігає зі страхом, лише час покаже, чи залишиться Пакистан чи Індія в майбутньому."
 SC_WORLD.7.a: "Гра на межі, світ, який можна втратити."
 SC_WORLD.7.x: "Чому Токіо не може просто поступитися?"
 SC_WORLD.7.y: "Пакистан вистоїть."
 SC_WORLD.7.z: "Чому помирати за Пакистан?"

####################
## MANCHUKUO
####################

 WORLD_MAN.1.t: "[Get_newspaper_header]Вознесіння Пуджі в Манчжурії"
 WORLD_MAN.1.desc: "Після смерті імператора Пуйї в Манчжурії пил осів; тепер стало ясно, що брат покійного імператора, принц Айсін-Ґіоро Пуджі, взяв під контроль уряд Манчжурії, ставши її імператором.\n\nШлях нового імператора до влади був зовсім не легким: відсутність чітких законів спадкування в поєднанні з значним внутрішнім опором зробили його успіх ще більш вражаючим. Він здобув підтримку в основному завдяки Кортовій Фракції правлячої Конкордійської Асоціації та стародавній аристократії, а також деяку підтримку в Манчжурській імператорській армії.\n\nНа відміну від свого брата, Пуджі є харизматичним і мотивованим, і йому вдалося створити сильну коаліцію прихильників. Експерти вважають, що він навряд чи буде імператором-покійником, і з цієї причини багато хто в Токіо стурбовані тим, що його піднесення може означати."
 WORLD_MAN.1.a: "Йому чекає важкий шлях."

 WORLD_MAN.2.t: "[Get_newspaper_header]Переворот імператорської армії в Манчжурії!"
 WORLD_MAN.2.desc: "Після смерті маріонеткового імператора Пуйї в Манчжурії пил осів. Тепер стало ясно, що клік офіцерів Манчжурської імператорської армії, при підтримці союзників з Квантунської армії, скористалася невизначеністю навколо смерті Пуйї, щоб захопити владу.\n\nПід командуванням керівника розвідки Квантунської армії Седжіми Рюдзо, армія та її прихильники твердо встановили військову диктатуру в країні. Виступаючи в столиці Сіньцзін, Седжіма урочисто пообіцяв розпочати відродження економіки Манчжукуо, обмежити найгірші неефективності старої системи та привести Манчжукуо в сучасну епоху.\n\nНезважаючи на розмови про модернізацію, вже почалися чистки старої гвардії та дисидентських фракцій, і немає ознак того, що вони найближчим часом припиняться."
 WORLD_MAN.2.a: "Нова реальність для «Корони Сфери»?"

 WORLD_MAN.3.t: "[Get_newspaper_header]Переворот Квантунської армії в Манчжурії!"
 WORLD_MAN.3.desc: "Після смерті маріонеткового імператора Пуйї в Манчжурії пил осів. Тепер стало ясно, що Квантунська армія, скориставшись партійною активністю на північному сході та іншими внутрішніми напруженостями, що досягли точки кипіння, захопила владу та скасувала цивільний уряд.\n\nЗі смертю Пуйї остання підозра щодо суверенітету Манчжурії, здається, була скасована, і монархія скасована. Для подальшої консолідації влади сили Квантунської армії почали чистки в попередньому уряді і використовують свої знамениті грубі методи для приборкання громадянських заворушень в країні раз і назавжди.\n\nЧи вдасться їм досягти успіху, поки не відомо, але очевидно, що майбутнє Манчжукуо виглядає ще більш похмуро, ніж коли Пуйї ще був живий."
 WORLD_MAN.3.a: "Це було передбачувано."

 WORLD_MAN.4.t: "[Get_newspaper_header]Захоплення Сōмучō в Манчжурії!"
 WORLD_MAN.4.desc: "Після смерті маріонеткового імператора Пуйї в Манчжурії пил осів. Тепер стало ясно, що Бюро загальних справ і цивільна бюрократія сконцентрували владу в своїх руках.\n\nПоки інші фракції боролися між собою, бюрократія поступово захопила ключі до влади і тепер, здається, консолідувала свій контроль над країною. Скасувавши претензії до монархії, Ґу Цихен став президентом держави Манчжукуо; однак справжня влада за цим офісом зараз належить Сакомізу Хісатсуне, директору Сōмучō.\n\nБюрократична коаліція в новій Манчжурії є рішучим прихильником технократичних методів індустріалізації, прагнучи відновити економіку Манчжукуо через масові державні індустріальні плани."
 WORLD_MAN.4.a: "Подібне і водночас неподібне."

