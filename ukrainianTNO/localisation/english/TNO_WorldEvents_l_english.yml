l_english:
 ##### EVENTS #####
 WORLD.20.t: "[Get_newspaper_header]Крах Тріумвірату"
 WORLD.20.d: "Після бомбардування конференції Тріумвірату на Мальті будь-які шанси на збереження цього крихкого союзу, схоже, зникли у вогні. Інцидент став останньою краплею для багатьох: і каудильйо, і президент Туреччини оголосили про намір своїх країн вийти з альянсу. З огляду на те, що дві з трьох провідних держав союзу вирішили піти, можна з упевненістю сказати, що дні Тріумвірату добігли кінця.\n\nТуреччина вже закликає поважати її територіальні права та регіональні амбіції, зокрема щодо Кіпру та Леванту, тоді як італійська армія мобілізувалася у відповідь на турецькі маневри в Сирії. Іберійці ж виявили мало бажання зберігати тісні відносини зі своїми колишніми союзниками, натомість зосередившись на власних внутрішніх проблемах."
 WORLD.20.a: "Це було лише питання часу."

 WORLD.35.t: "[Get_newspaper_header]Війна в Південній Африці"
 WORLD.35.desc: "Насильство охопило Південну Африку, коли африканерський Фолькстат, обурений тим, що він вважає нескінченними атаками з боку уряду Південної Африки, офіційно проголосив свою незалежність. Разом із декларацією німецькі війська нещодавно створеного «Африка-Щильда» увійшли до регіону, аби захистити Фолькстат від спроб Південної Африки придушити новоутворену державу.\n\nПрем'єр-міністр де Вільє Грааф звернувся із закликом до Америки та «всіх інших вільних демократій» допомогти захистити Південну Африку від фашизму. ОВН поки не відповіла, але більшість підозрює, що контрінтервенція неминуча. Слова Граафа менш красномовно повторив один із південноафриканських солдатів на передовій:\n\n«Де, чорт забирай, янкі?»"
 WORLD.35.a: "Африка в хаосі, як завжди."
 WORLD.35.b: "Заклик до свободи кличе."
 WORLD.35.c: "Права бурів не можна топтати більшістю."
 WORLD.35.d: "За свободу!"
 WORLD.35.e: "Боротьба за наше життя починається..."

 WORLD.68.t: "[Get_newspaper_header]Свобода для Анголи?"
 WORLD.68.d: "Поки війна в Південній Африці продовжує ширитися регіоном, зі столиці Південно-Західної Африки надійшов дивовижний звіт: на світанку півдюжини транспортних літаків Люфтваффе злетіли в невідомому напрямку, серед пасажирів - райхскомісар Вольфганґ Шенк, його найближчі помічники та їхні родини.\n\nУ ще більш приголомшливому повороті подій приватний лікар райхскомісара, Йонас Савімбі, через кілька годин після зльоту виступив з промовою на Радіо Луанда, оголосивши себе Президентом незалежної Анголи та закликавши громадян узятися за зброю для захисту новонародженої нації. Тисячі міліціонерів овімбунду разом із місцевими підрозділами СС, що базувалися в тилу, вже присягнули на вірність новому Президенту, і бойові дії між ними та їхніми колишніми союзниками з «Щильда» вже розгорнулися по всій Анголі."
 WORLD.68.a: "Що? Це серйозно?"
 
 WORLD.70.t: "[Get_newspaper_header]Угода завершує кризу на Алеутських островах"
 WORLD.70.desc: "Тижневий конфлікт між японськими та американськими флотами поблизу Алеутських островів завершився після того, як обидві наддержави розпочали організоване відведення сил із північної частини Тихого океану. План, посередником якого виступив президент Мексики Лопес Матеос, також передбачає звільнення США японського пілота, капітана Асоха, чиє захоплення після польоту над американськими водами й спровокувало кризу.\n\nХоча відкритої війни вдалося уникнути, напруженість між двома тихоокеанськими державами залишається на рівні, небаченому з часів Другої світової війни. Токійські звинувачення у порушенні договору щодо демілітаризованих островів залишаються без відповіді, так само як і вимоги Вашингтона про офіційні вибачення та компенсацію. Аварія біля острова Атту та кілька раундів попереджувального вогню з обох сторін залишаються суворим нагадуванням про те, як близько світ підійшов до війни."
 WORLD.70.a: "Варимо океан, чашка за чашкою."
 WORLD.70.b: "Після цієї зради дороги назад немає."
 WORLD.70.c: "Коли вони б’ються, ми виграємо."
 WORLD.70.d: "Гарячу війну уникнули, Холодна війна розпочалася."

 WORLD.71.t: "[Get_newspaper_header]Сутінки цивілізації"
 WORLD.71.desc: "Вашингтон, Ґерманія та Токіо лежать у руїнах - ядерний вогонь стер їх із лиця Землі за лічені миті. По всьому світу електростанції припиняють роботу, хмари попелу затуляють сонце, а астронавти з різних країн спостерігають, як вогні гаснуть один за одним, немов зірки, що помирають.\n\nСвіт мовчить, адже остання битва добігла кінця. Без командирів армії більше не воюють, без портів флоти дрейфують у морях, а без дому біженці вкривають ландшафт, руйнуючи ті кілька націй, які не були безпосередньо знищені ядерною війною.\n\nПонад пів мільярда людей загинуло в цій великій і, можливо, останній війні. Ті небагато експертів, що залишилися, очікують, що ця цифра може потроїтися у післявоєнний період, якщо не станеться чогось ще гіршого."
 WORLD.71.a: "Боже, що ми наробили?"

 WORLD.341.t: "[Get_newspaper_header]Відкриття Веронської конференції"
 WORLD.341.d: "Після смерті Беніто Муссоліні, першого дуче Італії та засновника фашизму, прихильність країни до фашизму почала слабшати. І сьогодні, 1 червня 1963 року, є історичним днем для Італії та її народу: віє вітер змін, оскільки Конгрес у Вероні зібрався, щоб визначити майбутній курс Італійської імперії.\n\nЯким буде цей курс, залежить від конференції; будуть висунуті аргументи, досягнуто компромісів, напруженість зростатиме, ворожнеча пом’якшуватиметься, і, зрештою, буде визначено шлях для італійського народу. Поки дуче Чіано виголошує вступну промову, міжнародні спостерігачі слухають із хвилюванням, адже одна з найбільших колоніальних імперій світу може або послабити свою залізну хватку над підданими та народом, або ж зберегти її. Веронська конференція визначить її долю."
 WORLD.341.a: "Цікаво."

 WORLD.342.t: "[Get_newspaper_header]Закриття Веронської конференції"
 WORLD.342.d: "Сьогодні Веронська конференція, збори, скликані для визначення майбутнього курсу Італійської імперії, завершилися. Під час завершальної промови дуче Чіано до конгресу, здається, після стількох запеклих дебатів і палких суперечок більшість делегатів дійшла згоди з Чіано, затвердивши його мандат. Радісні натовпи святкують на вулицях, від самої Верони до Сицилії, церковні дзвони дзвонять, хори співають, адже давно очікувані реформи тепер на шляху, і все завдяки дуче Чіано!\n\nЗвісно, не всі задоволені цим результатом.Карло Скорца, політичний суперник Чіано, у розпачі залишив зал конгресу ще під час завершальної промови дуче. З усієї Італії надходять повідомлення про насильство з боку Чорної бригади та вуличні бійки зі святкувальниками. І все ж шлях тепер ясний для Італії та її народу, їм лишається лише йти ним."
 WORLD.342.a: "Цікавий розвиток подій в Італії."
 WORLD.342.b: "Хай живе дуче Чіано!"

 WORLD.343.t: "[Get_newspaper_header]Веронська конференція завершується"
 WORLD.343.d: "Сьогодні Веронська конференція, зібрання, скликане для визначення майбутнього курсу Італійської імперії, завершилася. У своїй невпевненій заключній промові дуче Чіано зізнався у розчаруванні результатами, адже більшість конгресу підтримала Карло Скорцу, відомого традиційного фашиста і політичного суперника Чіано. Прихильники Скорци по всій імперії зібралися на площах міст, висловлюючи свою підтримку його ідеям про відродження сили імперії!\n\nЗвісно, не всі задоволені таким результатом. Сам дуче Чіано явно розчарований, адже його мандат було відхилено, а Скорца поставив під сумнів його владу як дуче. Люди, які очікували реформ в імперії, продовжують протестувати. І все ж шлях тепер ясний для Італії та її народу, їм лишається лише йти ним."
 WORLD.343.a: "Цікавий розвиток подій в Італії."

 WORLD.344.t: "[Get_newspaper_header]Веронська конференція провалюється"
 WORLD.344.d: "Сьогодні Веронська конференція, зібрання, покликане визначити майбутній курс Італійської імперії, мала завершитися. Конгрес, як і очікувалося, вів запеклі дебати, але ніхто не міг передбачити, що це перетвориться на вічну суперечку. Ні дуче Чіано, ні Карло Скорца не змогли взяти гору, і, зрозумівши, що дебати зайшли в глухий кут, обидва лідери залишили зал у розчаруванні. Щойно вони пішли, депутати почали обмінюватися образами, а потім - кулаками; конгрес занурився у хаос, більше схожий на бійку в барі, ніж на зібрання для визначення майбутнього однієї з найбільших націй Європи.\n\nПрихильники обох сторін заполонили вулиці, намагаючись довести перевагу своєї сторони, що вже перетворилося на вуличні бійки. Час нестабільності чекає на Італію та її народ, розгортаючись у несподівані події."
 WORLD.344.a: "Ще одна європейська країна падає у хаос."

 WORLD.345.t: "[Get_newspaper_header]Італія перемагає в Італо-турецькій війні" #cianos deal
 WORLD.345.d: "Протягом багатьох років прикордонні конфлікти між Туреччиною та Італією були основною причиною розбіжностей між двома союзниками. Напруга досягла свого піку після розпаду Тріумвірату, що призвело до конфлікту. Турецькі війська, нарешті, вторглися до Італійського Близького Сходу. Італія не залишилася осторонь агресії Туреччини, і між двома колишніми союзниками спалахнула невелика війна.\n\nКоли турецька військова машина втратила силу, фронт застопорився, і Туреччина опинилася у глухому куті, який не змогла зламати. Отримавши явну перевагу у війні, Італія запропонувала мирний договір з умовами виплати репарацій турецьким урядом та демілітаризації регіону Дамаска, які турецький уряд неохоче прийняв. Тепер на Близькому Сході знову панує мир."
 WORLD.345.a: "Мир на Близькому Сході, хіба це можливо?"
 WORLD.345.b: "Надихаюча перемога Італійської імперії!"
 WORLD.345.c: "Нас принизили."

 WORLD.346.t: "[Get_newspaper_header]Туреччина перемагає у італо-турецькій війні"
 WORLD.346.d: "Протягом багатьох років прикордонні конфлікти між Туреччиною та Італією були основною причиною розбіжностей між двома союзниками. Напруга досягла свого піку після розпаду Тріумвірату, що призвело до конфлікту. Турецькі війська, нарешті, перейшли до Італійського Близького Сходу. Італія не залишилася осторонь агресії Туреччини, і між двома колишніми союзниками спалахнула невелика війна.\n\nТурецькі війська зуміли швидко пройти через Левант і стати господарями регіону. Отримавши явну перевагу у війні, Туреччина запропонувала мирний договір з умовами, за якими Італія поступається Ліваном в обмін на збереження Леванту, умови, які італійський уряд неохоче прийняв. Тепер на Близькому Сході знову панує мир."
 WORLD.346.a: "Мир на Близькому Сході, хіба це можливо?"
 WORLD.346.b: "Ми були зраджені нашим колишнім союзником!"
 WORLD.346.c: "Турецькі території знову об'єднані!"

 WORLD.355.t: "[Get_newspaper_header]Італія перемагає в Італо-турецькій війні" #scorzas deal
 WORLD.355.d: "Протягом багатьох років прикордонні конфлікти між Туреччиною та Італією були основною причиною розбіжностей між двома союзниками. Напруга досягла свого піку після розпаду Тріумвірату, що призвело до конфлікту. Турецькі війська, нарешті, вторглися до Італійського Близького Сходу. Італія не залишилася осторонь агресії Туреччини, і між двома колишніми союзниками спалахнула невелика війна.\n\nКоли турецька військова машина втратила силу, фронт застопорився, і Туреччина опинилася у глухому куті, який не змогла зламати. Отримавши явну перевагу у війні, Італія запропонувала мирний договір з умовами передачі регіону Дамаска Італії та Мосула Іраку, умови, які турецький уряд дуже неохоче прийняв. Тепер на Близькому Сході знову панує мир."
 WORLD.355.a: "Мир на Близькому Сході, хіба це можливо?"
 WORLD.355.b: "Надихаюча перемога Італійської імперії!"
 WORLD.355.c: "Нас принизили."

 #India News Events#

 WORLD.430.t: "[Get_newspaper_header]Бал Текерей перемагає на виборах в Індії 1967 року"
 WORLD.430.desc: "Сьогодні, всупереч усім прогнозам, Бал Текерей та Шив Сена перемогли на загальних виборах 1967 року в уряді Азад Хінд. Позиції Текерея називають ксенофобними, крайніми правими і навіть геноцидальними, що йде врозріз із традиційно лівими тенденціями Індії та шокує багатьох.\n\nБудучи ключовим гравцем у попередньому режимі Мохана Сінгха та, за чутками, головним організатором операції \"Прожектор\", Текерей усе ще вважався темною конячкою в Азад Хінд. Проте з його радикальними політиками експансіонізму, ненависті до іноземців та вірою в 'Акханд Бхарат', світ із тривогою чекає на наступний крок Текерея."
 WORLD.430.a: "І все ж, світ нічого не зробив."
 WORLD.430.b: "Боже, допоможи нам усім."

 WORLD.432.t: "[Get_newspaper_header]Зіаур Рахман перемагає на виборах в Індії 1967 року"
 WORLD.432.desc: "Сьогодні, посеред численних звинувачень у залякуванні виборців та змові проти Індії, Зіаур Рахман та Мукті Бахіні перемогли на загальних виборах 1967 року в уряді Азад Хінд. Лідер бенгальського націоналізму, Рахман переміг із популярною платформою підтримки повного розпуску Азад Хінд до 1970 року, щоб його замінили держави, які представляють меншини - бігарів, бенгальців і асамців.\n\nВибір Рахмана зустріли з підтримкою ОВН та Республіки Індія, проте їх засудили Сфера та її союзники. Чи зможе Рахман досягти своїх цілей, покаже час."
 WORLD.432.a: "Джой Бангла!"
 WORLD.432.b: "Чудово бачити знайоме обличчя в Індії."
 WORLD.432.c: "Сподіваємося, ми не втратимо контроль."
 WORLD.432.d: "Це кінець Вільної Індії?"

 WORLD.462.t: "[Get_newspaper_header]Пакистан стає незалежним"
 WORLD.462.desc: "З моменту здобуття Індією незалежності з хаосу після Другої світової війни вона вважалась пороховою бочкою для міжнародних спостерігачів. Переповнена питаннями етнічності, релігії, ідеології та нависанням іноземних грифів, ця молода нація мала вирішити багато проблем.\n\nОсобливо жорстокою серед цих проблем була сумнозвісна розбіжність між індусами та мусульманами, що сьогодні, хоч і хаотично, була вирішена. Боячись постійного домінування індусів, північна мусульманська меншість повністю відокремилася, проголосивши нову державу під назвою 'Пакистан'.\n\nМіграції до та з Пакистану почалися по всьому субконтиненту, як і особливо жорстокі випадки насильства. Спостерігачі розділилися в оцінках: одні турбуються про зростаюче насильство в регіоні, інші хвалять рішення давньої проблеми релігійної напруги. Час покаже, як на це відреагують Індія та її сусіди."
 WORLD.462.a: "Ми вітаємо наших братів!"
 WORLD.462.b: "Пакистан Зіндабад!"
 WORLD.462.c: "Одного дня ми повернемося до Карачі."
 WORLD.462.d: "Цікаво."

 #Iberia News Events (UNUSED 463, 474, 475, 477, 479-490, 496, 503-507?)

 WORLD.463.t: "[Get_newspaper_header]Іберія відмовляється від утримання Гібралтарської дамби"
 WORLD.463.desc: "Міністерство розвитку Іберії, урядовий орган, що відповідає за утримання Гібралтарської дамби, оголосило сьогодні, що Іберія більше не фінансуватиме операції з утримання дамби, і лише найважливіші ремонтні роботи будуть виконуватися, щоб запобігти її руйнуванню.\n\nГібралтарська дамба, зірка німецького проекту Атлантропа, була побудована у 40-х роках і перейшла під відповідальність Іберії після краху німецької економіки в 50-х. Через економічні проблеми Іберії дамба стала бездонною фінансовою дірою. Тепер світ затамував подих, адже руйнування дамби може призвести до мільйонів жертв і можливого знищення всіх країн, на які це вплине."
 WORLD.463.a: "Є важливіші проблеми."
 WORLD.463.b: "Моліться, щоб вона не зруйнувалася."

 WORLD.464.t: "[Get_newspaper_header]Іберія оголошує про створення Іберійської ради"
 WORLD.464.desc: "Будучи нацією, створеною за таких обставин і зберігаючи авторитарну культуру, як це зробила Іберія, не дивно, що ефективне управління виявилося складним завданням. Тому іберійські каудільйо оголосили про створення дорадчої ради державних службовців, єдиним завданням якої буде консультування з питань державного управління.\n\nЇхній безпосередній вплив на політику має бути незначним, проте аналітики передбачають, що рада може бути використана будь-яким із каудільйо для отримання переваги у політичних розбіжностях. Отже, вважається, що рада може сприяти подальшому поділу двох націй, а не їхньому об'єднанню. Подальше висвітлення покаже ефективність цієї нової 'реформи' Іберії."
 WORLD.464.a: "Добрий крок, без сумніву."
 WORLD.464.b: "Це не прогрес."
 WORLD.464.c: "Даремна організація для слабкої держави."
 WORLD.464.d: "Фашисти зводять новий фасад."

 WORLD.465.t: "[Get_newspaper_header]Іберія оголошує про створення Іберійської ради"
 WORLD.465.desc: "Сьогодні каудільйо Франко та Салазар спільно оголосили про створення Іберійської ради. Після паузи, щоб дати змогу присутнім гучно аплодувати, вони по черзі пояснювали та обґрунтовували нову систему перед величезним натовпом.\n\nЗа словами двох лідерів, обов'язки та завдання Іберії є надзвичайно великими, і їх вирішення залишило руїни їхньої ефективності. Щоб зберегти здатність керувати, вони вирішили делегувати частину своїх повноважень окремій - але однозначно нижчій - раді, що складається з призначених посадовців. Ця 'Іберійська рада' займатиметься розробкою законодавчих заходів для союзу. Проте остаточне слово у всіх пропозиціях залишатиметься за каудільйо. Формально це дозволить парі ефективніше керувати іншими функціями держави."
 WORLD.465.a: "Добрий крок, без сумніву."
 WORLD.465.b: "Крок у правильному напрямку."
 WORLD.465.c: "Даремна організація для слабкої держави."
 WORLD.465.d: "Фашисти зводять новий фасад."

 WORLD.466.t: "[Get_newspaper_header]Анархістські бойовики взяли в облогу Барселону!"
 WORLD.466.desc: "Шокуючі сцени виникли внаслідок зростаючої кризи на Іберійському півострові, оскільки неконтрольоване політичне насильство загрожує поширитися по всій країні. Каталонія стала ареною одних із найзапекліших боїв між політичними дисидентами та урядовими силами, які день і ніч зіштовхуються в столиці регіону. У сценах, що лякаюче нагадують Громадянську війну в Іспанії, знову з’явилися барикади, а сусід воює проти сусіда через ідеологічні розбіжності, які охопили життя мешканців Барселони.\n\nНа цей момент радикальна ліворадикальна профспілка, відома як CNT-FAI, та її симпатики захопили контроль над Барселоною і тепер готуються до кривавого затяжного протистояння з контратакою проурядових сил. Це стара, як світ, історія для Іспанії, яка знову переживає криваві, бурхливі роки 30-х."
 WORLD.466.a: "Ми переможемо!"
 WORLD.466.b: "Геть тиранію!"
 WORLD.466.c: "Випробування для Іберії настало."

 WORLD.467.t: "[Get_newspaper_header]Економічний крах в Іберії"
 WORLD.467.desc: "Похмурі новини прийшли з Іберії. Сцени паніки з сотнями біржових брокерів, що заповнюють входи до Мадридської фондової біржі, можна було побачити минулої ночі, оскільки уряд намагається впоратися з кризою. Мільйони, якщо не мільярди песет, було втрачено - і ця цифра продовжує зростати.\n\nБагато хто звинувачує втечу бізнесу та капіталу до сусідніх країн у відповідь на політику фалангістів. Інші вказують на фінансовий тягар, пов’язаний із нерегульованими територіями в Африці, і народне невдоволення вдома, як фактори. Фашисти та симпатики гітлеризму по всій країні навіть звинувачують \"підступний вплив юдо-більшовизму\", хоча це, безумовно, є мінорною думкою. Іберія пережила багато ударів і невдач із моменту її об’єднання після закінчення Другої світової війни. Проте багато хто побоюється, що ця криза може остаточно поставити Бика на коліна."
 WORLD.467.a: "Ми зможемо це відновити."
 WORLD.467.b: "Іберія стоїть на межі анархії."

 WORLD.468.t: "[Get_newspaper_header]Смерть Антоніу де Олівейра Салазара"
 WORLD.468.desc: "Сьогодні о 4:02 ранку Хосе Антоніу Олівейра Салазар, один із двох каудільйо Іберійського Союзу та лідер португальських територій у країні, був офіційно визнаний померлим медичними працівниками. З його смертю завершується понад три десятиліття португальської історії.\n\nПовідомляється, що каудільйо помер через ускладнення, викликані церебральним крововиливом, через який йому проводили операцію. Нація Португалія вже в жалобі за своїм лідером, як і його колишній колега Франсіско Франко.\n\nДо призначення нового наступника на його місце Франко залишається єдиним правителем Іберійського Союзу, і експерти вважають, що це ідеальна можливість для Франко стати одноосібним правителем Іберії, якщо він наважиться це зробити."
 WORLD.468.a: "Спочивай із миром, каудільйо."
 WORLD.468.b: "Один каудільйо пішов."

 WORLD.469.t: "[Get_newspaper_header]Іберія ліквідовує Іберійську раду"
 WORLD.469.desc: "Каудільйо Франсіско Франко оголосив великому натовпу - і під міжнародним висвітленням у пресі - що Іберійська рада припинить своє існування протягом тижня.\n\nСпочатку створена як орган для надання експертних порад каудільйо для кращого управління, рада нібито відійшла від своєї мети. Замість того, щоб просто консультувати двох правителів Іберії, вона нібито намагалася підірвати їхню владу та принести корупцію в інституцію, яка інакше могла б її уникнути. Саме це стало причиною її ліквідації - Франко заявив, що якщо вони подають такий поганий приклад, то їхні поради не мають цінності. А якщо немає цінних порад, то немає причин для існування ради.\n\nВід Каетано не вдалося отримати для коментарів."
 WORLD.469.a: "Це було необхідно."
 WORLD.469.b: "Ще один крок назад."
 WORLD.469.c: "Хороший вибір."

 WORLD.470.t: "[Get_newspaper_header]Іберія зберігає Іберійську раду"
 WORLD.470.desc: "Ймовірно, намагаючись придушити постійні скарги на відвертий авторитаризм і корупцію як вдома, так і в закордонній пресі, каудільйо Франсіско Франко сьогодні вранці зробив заяву щодо дорадчої ради. У своєму повідомленні, одночасно примирливому, але з характерним для іспанського диктатора тоном, він висловився про ефективність цієї інституції так, що її подальше існування, ймовірно, не викликатиме питань найближчим часом.\n\nЧи зміцнить цей крок нинішній режим чи дасть опонентам політичний простір для маневру, поки неясно. Однак більшість уваги зараз зосереджено на самій раді та на тому, чи зміниться її роль після знаку підтримки з боку каудільйо."
 WORLD.470.a: "Це необхідна інституція."
 WORLD.470.b: "Принаймні вони хочуть порад."
 WORLD.470.c: "Вони слабкі."

 WORLD.471.t: "[Get_newspaper_header]Іберія ліквідовує Іберійську раду"
 WORLD.471.desc: "Сьогодні Франко оголосив натовпу в Мадриді, що Іберійська рада припинить своє існування протягом двох днів. На прес-конференції він пояснив, що за короткий період свого існування рада виявилася лише тягарем і марною витратою ресурсів. Це було важке рішення для нього, але заради добра Іберії, за схваленням Каетано, він розпустив \"корумповану, зрадницьку організацію\" і заарештував усіх \"зрадників\", які були причетні.\n\nПісля цього оголошення старіючий лідер заявив, що він не повністю виступає проти ідеї створення організації для делегування частини повноважень, але поточний політичний клімат занадто \"егоїстичний\", щоб подібна інституція могла існувати. Тому каудільйо не має намірів створювати схожу структуру в найближчому майбутньому."
 WORLD.471.a: "Це було необхідно."
 WORLD.471.b: "Повернення до початку."
 WORLD.471.c: "Хороший вибір."

 WORLD.472.t: "[Get_newspaper_header]Іберія зберігає Іберійську раду"
 WORLD.472.desc: "Іберійський Союз сьогодні зробив несподівану заяву щодо Іберійської ради. Хоча спочатку її створили для полегшення законодавчої роботи каудільйо, інституція зазнала критики з боку деяких елементів уряду з різних причин, і суперечки щодо її існування призвели до серйозних дебатів.\n\nЦі дебати завершилися перемогою поточної системи, і рада залишиться, принаймні до подальшого повідомлення. Міжнародні спостерігачі зазначають, що це наближає Іберію до інституцій демократії, хоча поки що залишається невідомим, чи будуть вони розвиватися далі."
 WORLD.472.a: "Це необхідна інституція."
 WORLD.472.b: "Принаймні вони вдають, що добрі."
 WORLD.472.c: "Вони слабкі."

 WORLD.473.t: "[Get_newspaper_header]Іберія реформує Іберійську раду"
 WORLD.473.desc: "Починаючи з сьогоднішнього дня, Іберійський Союз більше не підпорядковується волі двох каудільйо. Обидва лідери спільно оголосили, що вони залишають свої посади.\n\nОдночасно вони також оголосили масштабні реформи Іберійської ради, повноваження та обов'язки якої значно розширилися. Рада займе місце каудільйо, адмініструючи Іберію та ухвалюючи реформи на власний розсуд. Поки що невідомо, наскільки далеко зайдуть ці реформи.\n\nКаудільйо натомість займуть наглядові ролі, заявивши, що їхній час при владі не повністю завершився, доки рада не завершить свої реформи на задовільному рівні."
 WORLD.473.a: "Починається нова ера."
 WORLD.473.b: "Нова демократія - це завжди добре."
 WORLD.473.c: "Лібералізм? Га!"

 WORLD.474.t: "[Get_newspaper_header]Національний Союз виграє вибори в Іберії у [GetYear]"
 WORLD.474.desc: "Unión Nacional оголосила про перемогу в Іберійському Союзі майже одразу після завершення виборів. Назвавши свою перемогу тріумфом народної волі, партія проголосила початок нової епохи для іберійського народу.\n\nЗавоювавши більшість з великим відривом, єдина партія, яка могла б наблизитися до конкуренції з ними у конгресі, - це консервативна Alianza Popular, яка спільно оголосила про створення коаліції з правлячою партією. Разом вони легко становлять більшість.\n\nОчолювана харизматичним Алехандро де Валькарселем, Unión Nacional позиціює себе як розсудливий консервативний вибір і захисник традицій. Міжнародні спостерігачі застерігають щодо Валькарселя, який працював у режимі Франко і чиї республіканські переконання неможливо перевірити."
 WORLD.474.a: "Хай живе Іберія!"
 WORLD.474.b: "Подивимося, куди це нас заведе."

 WORLD.476.t: "[Get_newspaper_header]Alianza Popular виграє вибори в Іберії у [GetYear]"
 WORLD.476.desc: "Сьогодні на перших іберійських конгресових виборах перемогла консервативна, правоконституціоналістська партія Alianza Popular.\n\nСправжня конституціоналістська партія, AP проводила кампанію з обіцянками збереження іберійських традицій, зміцнення нових демократичних інституцій країни та поступового відкату франкізму у темпі, \"який відповідає потребам іберійського народу\". У своїй переможній промові президент-елект Мануель Фрага подякував своїм суперникам за їхню гідну та чесну відданість демократії, а потім пообіцяв побудувати Іберію, що буде рівною мірою традиційною та прогресивною. Після присяги президент-елект провів молитву за Іберію та всіх її людей, незалежно від раси, релігії чи національності, проголосивши їх \"одним народом, об'єднаним у різноманітті під Богом\"."
 WORLD.476.a: "За традиції!"
 WORLD.476.b: "Наскільки вони демократичні?"

 WORLD.477.t: "[Get_newspaper_header]Партія PRD виграє вибори в Іберії у [GetYear]"
 WORLD.477.desc: "Перші вибори до Іберійського конгресу принесли несподіваний результат: перемогу ліберальної Partido Renovador Democrático.\n\nЕлітарна та технократична, PRD все ж продемонструвала свої добрі наміри іберійському народу, а її послання про економічне відновлення знайшло відгук там, де більш соціально орієнтовані програми її суперників не досягли успіху. Відомі своїми зв’язками з Opus Dei, PRD відверто вірить, що зміцнення економіки зміцнить суспільство, хоча вони також мають сильну соціальну політику, засновану на католицьких переконаннях. Подібно до Alianza Popular, PRD також прагне встановлення рівної справедливості та правового статусу для іберійських меншин задля припинення заворушень сепаратистських груп. Час покаже, чи зможе PRD вивести Іберію з її небезпечного становища."
 WORLD.477.a: "За прогрес!"
 WORLD.477.b: "Перемога аутсайдера."

 WORLD.478.t: "[Get_newspaper_header]Унія Республіканців виграє вибори в Іберії у [GetYear]"
 WORLD.478.desc: "Unión Republicana здобула перемогу на перших виборах до Іберійського конгресу, обігравши партії AP, PRD та UN із явною більшістю місць.\n\nЗ виборчою програмою, спрямованою на швидке скасування всіх авторитарних заходів, які запровадили каудільйо, відновлення автономних хартій Каталонії та Країни Басків і великим пакетом соціальних прав; UR зіткнулася з більшою опозицією, ніж будь-яка інша легальна партія, через деякі зі своїх обіцянок, оскільки анти-регіоналістські настрої були однією з найбільш глибоко вкорінених ідей у Франковій Іспанії. Однак ідеали свободи та плюралізму перемогли, і Іберія нарешті може стати справжньою країною свободи."
 WORLD.478.a: "За свободу!"
 WORLD.478.b: "Подивимося, чи це протримається."

 WORLD.491.t: "[Get_newspaper_header]Іберійське розлучення"
 WORLD.491.desc: "Іберійська унія досягла того, що, здавалося, було її фатальною розв’язкою.\n\nЗгідно з повідомленнями інсайдерів, уряд опинився в глухому куті через кілька непримиренних позицій щодо різних питань. Маючи право вето один на одного, каудильйо фактично заблокували будь-яку реальну політику.\n\nЗа наявною інформацією, каудильйо вступили в переговори про поділ союзу, які завершилися створенням Іспанії та Португалії. Міжнародна спільнота вже охрестила цю подію «Іберійським розлученням», а колишня унія була розділена між новими державами."
 WORLD.491.a: "Цьому не судилося бути."

 WORLD.492.t: "[Get_newspaper_header]Перемога салазаристів у Португалії"
 WORLD.492.desc: "Попри всі труднощі, [POR.GetLeader] здобув повний політичний контроль над Португалією. Після втечі з союзу до рідної країни він швидко створив ефективний режим, щоб протистояти іберійським силам. Зіткнувшись з змовами інших фракцій у країні, він був змушений вести війну на двох фронтах. Вражаючі військові перемоги та обставини дозволили диктатору утримати свою позицію. Повстанці капітулювали перед потужністю португальської військової машини, в той час як сили союзу були відкинуті.\n\nДеякі виходять на вулиці, протестуючи проти того, що вони вважають нелегітимним наступником португальської держави, але ці заклики стають слабшими з кожною годиною. Режим зміг стабілізувати своє правління і повернути Португалію до міжнародних відносин."
 WORLD.492.a: "Перемога!"
 WORLD.492.b: "Цікаво."

 WORLD.493.t: "[Get_newspaper_header]Перемога республіканців у Португалії"
 WORLD.493.desc: "Після вражаючої перемоги над старою гвардією португальського уряду була гордо проголошена нова республіка. Movimento das Forças Armadas, група демократичних військових, які втратили віру в португальський авторитаризм, успішно зібрала підтримку по всій країні. Їхній рух швидко зріс, перетворившись на потужного конкурента за політичну владу.\n\nПопри початкову дезорганізацію, повстанці змогли захопити важливі стратегічні локації по всій Португалії, одночасно нахабно турбуючи ворога. Старий режим колапсував як через внутрішні суперечності, так і через зовнішні загрози, врешті-решт змусивши салазаристів капітулювати перед демократичними силами. Новий етап для Португалії розпочинається, повернення демократії в частину світу, де, як вважали, вона ніколи не повернеться."
 WORLD.493.a: "Перемога!"
 WORLD.493.b: "Цікаво."

 WORLD.494.t: "[Get_newspaper_header]Комуністична перемога в Португалії"
 WORLD.494.desc: "Внутрішня війна в Португалії завершилася перемогою Народної Республіки Португалія. Об'єднаний фронт різних комуністичних течій та міліцій, хоч і з'явився пізно на війні, від самого моменту відокремлення від тимчасової республіки став ідеологічно відданою силою, що успішно боролася зі своїми ворогами. Їхня перемога означає відродження соціялізму на півострові, і молода республіка прагне забезпечити своє виживання в неспокійні роки, що наближаються.\n\nНа параді, щоб відзначити свою перемогу, червоний прапор підняли високо, а різні червоні ватажки дивилися на свою переможну армію з балкона. Що чекає Португалію тепер, коли ці ліві прийшли до влади, залишається загадкою. Одне можна сказати точно: з цією вражаючою перемогою обличчя Португалії зміниться назавжди."
 WORLD.494.a: "Перемога!"
 WORLD.494.b: "Цікаво."

 WORLD.495.t: "[Get_newspaper_header]Португальські мілітаристи завойовують Іберію"
 WORLD.495.desc: "З попелу, залишеного Іберійськими війнами, з'являється переможець. Назвавши себе Урядом національного спасіння, цей союз гіпер-мілітаристів з націонал-соціялістичними нахилами виграв насильницький конфлікт із своїми ворогами. На руїнах Іберійського Союзу виникла нова система ГНС, яка об'єднала Португалію і розділила Іспанію на різні лояльні губернаторства.\n\nЩо чекає під цим новопосиленим правим режимом, ймовірно, буде далеке від миру. ГНС, орієнтуючись на відновлення португальської могутності за будь-яку ціну, навряд чи зупиниться на досягнутому, аби закріпити свою владу над розореною півостровом. Можливо, що жителі Іберії не будуть довго втомлені від війни, оскільки ГНС спрямовує свої погляди на решту світу."
 WORLD.495.a: "Перемога!"
 WORLD.495.b: "Тривожно."

 WORLD.496.t: "[Get_newspaper_header]Федералісти знову завойовують Іберію"
 WORLD.496.desc: "Так звані Іберійські війни завершилися, і колишній Іберійський Союз знову став володарем півострова.\n\nЦіль багатьох фракцій та ще більшої кількості сепаратистських рухів, союз був розбитий на частину свого колишнього стану. Знаходячись в тому, що вдалося забезпечити навколо Мадрида та оточені ворогами, аналітики не висловлювали великих сподівань на федералістів.\n\nІберійський Союз оголосив свою вічну гегемонію над півостровом. Оскільки ресурси решти груп, що залишилися, виснажені війною, здається, що немає нікого, хто зміг би оспорити це звання."
 WORLD.496.a: "Перемога!"
 WORLD.496.b: "Цікаво."

 WORLD.497.t: "[Get_newspaper_header] Перемога фаланги в Іспанії"
 WORLD.497.desc: "Звуки пострілів і вибухів, нарешті, стихли, і Фаланга, фашистська група правих радикалів, виграла в Іберійських війнах. Переможці цього конфлікту є одними з найзапекліших і ідеологічно фанатичних учасників війни. Тепер вони позбавлені будь-яких колишніх обмежень, накладених на них за часів правління Франко, і готові втілити догматичні мрії свого давно померлого засновника, Хосе Антоніо Примо де Рівери.\n\nВиступаючи перед масами блакитних сорочок, фалангістський Хефе Хайме Міланс дель Бош говорив про свої плани з формування Іспанії в істинно фалангістському стилі. Що це означатиме для тих, хто залишиться поза фалангістським "утопією", ймовірно, буде не зовсім хорошим, оскільки з'являються повідомлення про позасудові страти. Хоча війна закінчилася, Іспанія, ймовірно, не буде спокійною під владою Ель Хефе."
 WORLD.497.a: "Перемога!"
 WORLD.497.b: "Цікаво."

 WORLD.498.t: "[Get_newspaper_header]Перемога демократів в Іспанії"
 WORLD.498.desc: "Неочікувана новина надійшла з Іберійського півострова. Демократичне повстання в Іспанії проти федерального уряду Іберії виявилось успішним. Після важкої кампанії повстанці захопили столицю старого союзу і оголосили його мертвою сутністю, символом того, як авторитаризм тягнув Іспанію через 20 століття до страшного міжнародного та внутрішнього становища.\n\nОднак бої тривають, оскільки демократи тепер повинні протистояти партизанській кампанії з боку залишкових сил уніоністів і фашистів. Незважаючи на сильний опір, всі іспанці сьогодні вранці прокинулись в абсолютно новій реальності. Союз більше не існує. Його ідеали були змиті корупцією, громадянською війною та демократичним запалом."
 WORLD.498.a: "Перемога!"

 WORLD.499.t: "[Get_newspaper_header]Фронт національного відродження завойовує Іберію"
 WORLD.499.desc: "Тривалий конфлікт на Іберійському півострові завершився, і перемогу здобула, за словами деяких, найгірша з можливих варіантів.\n\nПісля того, як конфлікт, ймовірно, застиг, з попелу виникла нова фракція - якщо вірити тим, хто втікав від неї - відома як Фронт національного відродження. Пропагуючи радикальний варіант католицизму, організація, здається, отримала більшу частину своєї сили від тих, хто найбільше постраждав від війн. Славляться своєю жорстокістю, вони знищили всіх, хто міг би їм суперечити на Іберії. Коли ситуація втихла, Його Святість Папа особисто висловився проти фронту, засуджуючи їх жорстокі практики як антикатолицькі."
 WORLD.499.a: "Перемога!"
 WORLD.499.b: "Тривожно."

 WORLD.500.t: "[Get_newspaper_header]Націонал-соціялістична перемога в Іберії"
 WORLD.500.desc: "Довгі та кровопролитні війни, які охопили Іберію, нарешті завершились перемогою нової й небезпечної політичної сили, яка здобула перемогу над своїми ідеологічними ворогами. Фронте Азул, нацистська ультраправова збройна сила, перемогла як в Іспанії, так і в Португалії, здобувши повний контроль над іспанською нацією та встановивши маріонетковий режим в Португалії.\n\nНацистська група, без сумніву, прагне наслідувати своїх ідеологічних попередників з нацистської Німеччини, а не ту гілку фалангістського фашизму, від якої вона відокремилася через нездатність фалангістів досягти швидкої перемоги в тривалій війні. Мстиве Синє військо, яке важко і жорстоко вибороло свою перемогу у війні, тепер прагнутиме нав'язати свою фанатичну нацистську ідеологію на решту нації, тепер, коли воно зміцнилося завдяки жорстокому придушенню своїх ворогів."
 WORLD.500.a: "Перемога!"
 WORLD.500.b: "Цікаво."

 WORLD.501.t: "[Get_newspaper_header]Офіційне завершення будівництва дамби Гібралтару"
 WORLD.501.desc: "Великий будівельний проект, дамба Гібралтару, для деяких була просто бездонною криницею, куди Ґерманія викидала свої ресурси після війни, нарешті завершено. Її довгий шлях супроводжувався безліччю проблем, наслідки яких зачепили значно більше країн, ніж просто Райх. Однак відповідальність за залишений проект лягла на народ, який безпосередньо зіткнувся з наслідками, а не на німців.\n\nІберійці змушені були мати справу з дамбою, поки Європа занурювалась в економічний крах. Незважаючи на всі труднощі, проект тепер завершено і приніс Союзу значну престижність на міжнародній арені. Іберія сама дуже радіє цій новині і оголосила це національною перемогою. Німці швидко намагаються забрати собі кредит, але за межами нацистської сфери це не сприйнято добре."
 WORLD.501.a: "Брехуни!"
 WORLD.501.b: "Нарешті завершено!"

 WORLD.502.t: "[Get_newspaper_header]Іберія приєднується до Цольверейну"
 WORLD.502.desc: "На спільній прес-конференції сьогодні, каудільйо Франсіско Франко разом з Міністром закордонних справ Гельмутом Шмідтом оголосили про офіційне вступ Іберії до Цольверейну, німецько-очоленого економічного і зони вільної торгівлі, що охоплює більшу частину колишнього Єдиного пакту. Незважаючи на напружені відносини після німецького захоплення Анголи та Мозамбіку, перемога реформістів Шпеєра в Громадянській війні та консолідація Іберії дозволили обом сторонам визнати переваги співпраці.\n\nПриєднання Іберії до Цольверейну було вітано як важлива дипломатична перемога для Ґерманії. Хоча Іберія не є частиною альянсу Єдиного пакту, вона стала першою великою країною за межами німецької сфери, яка приєдналася до союзу. Це розширює економічний вплив Німеччини і надає ще більше ваги заяві, що Цольверейн є справжнім співтовариством націй, а не просто ще одним виразом німецької гегемонії."
 WORLD.502.a: "Ще одна перемога для Ґерманії."
 WORLD.502.b: "Нехай наші відносини будуть довгими та процвітаючими!"
 WORLD.502.c: "Ще одна перемога для Райху!"

 WORLD.508.t: "[Get_newspaper_header]Смерть віце-короля Амадео"
 WORLD.508.d: "Заповнювач"
 WORLD.508.a: "Це було неминуче."

 WORLD.565.t: "[Get_newspaper_header]Ґерманське втручання в Африці"
 WORLD.565.desc: "Будь-які надії на швидке вирішення Південноафриканської війни були сьогодні швидко розвіяні, коли новий фюрер Райху, [GER.GetLeader], офіційно оголосив про втручання в конфлікт, заявивши: «Ця явна агресія з боку американців і південноафриканців щодо суверенних бурських народів і райхскомісаріатів в Африці не залишиться без покарання».\n\nСеред країн, що підтримують Південну Африку, відкритий війноварний ритм [GER.GetLeader] та його команди поновив схвалення війни, оскільки тепер більш очевидно, ніж коли-небудь, що війна йде за припинення фашизму та його руху на завоювання світу. Президент США вже готується випустити прес-заяву щодо ескалації війни та неминучої американської перемоги над силами фашизму. Світ затамував подих, оскільки німецький гігант знову прокинувся."
 WORLD.565.a: "Це кінець миру, яким ми його знали?"
 WORLD.565.b: "Потрібно зв'язатись з Вестморлендом..."
 WORLD.565.c: "Райх повертається!"
 WORLD.565.d: "Зіг Хайл!"
 WORLD.565.e: "Час для відплати!"

 WORLD.566.t: "[Get_newspaper_header]Розпочалась громадянська війна в Сербії"
 WORLD.566.desc: "Смерть Адольфа Гітлера почала потрясати німецький порядок, особливо на Балканах. Звіти, хоча й рідкісні, вказують на те, що як комуністичні партизани, так і четники піднялись, щоб вигнати німецький гарнізон і маріонетковий співпрацівницький режим з країни після вбивства Дмитрія Льйотича, його колишнього лідера. Гіпотетичний єдиний фронт між обома групами не з'явився, оскільки комуністи та четники почали стріляти один в одного.\n\nПісля повстання німецький гарнізон під керівництвом Карла Гебеля почав брати під контроль залишкові державні апарати від співпрацівників і пообіцяв швидке повернення порядку в країні. Однак, оскільки гарнізон значно менший в числі на чужій ворожій землі, спостерігачі передбачають, що перемога повстанців - лише питання часу."
 WORLD.566.a: "Ілюзія порядку ламається."

 WORLD.567.t: "[Get_newspaper_header]Розпочалась громадянська війна в Сербії"
 WORLD.567.desc: "Смерть Адольфа Гітлера почала потрясати німецький порядок, особливо на Балканах. Звіти, хоча й рідкісні, вказують на те, що як комуністичні партизани, так і четники піднялись, щоб вигнати німецький гарнізон і маріонетковий співпрацівницький режим з країни після вбивства Дмитрія Льйотича, його колишнього лідера. Гіпотетичний єдиний фронт між обома групами не з'явився, оскільки комуністи та четники почали стріляти один в одного.\n\nЦе сталося після успадкування бригадного генерала Костянтина Мушицького як нового лідера ЗБОРу та співпрацівницької держави після короткого періоду інтеррегнума. Однак, оскільки і гарнізон, і співпрацівники значно менші в числі на чужій ворожій землі, спостерігачі передбачають, що перемога повстанців - лише питання часу."
 WORLD.567.a: "Ілюзія порядку ламається."

 WORLD.581.t: "[Get_newspaper_header]Олімпійські ігри 1964 року в Токіо завершено"
 WORLD.581.d: "Перші Олімпійські ігри, які проходили в Азії, літні Олімпійські ігри 1964 року, тепер завершені. Японія відкрила світові всі можливості для демонстрації своєї зростаючої технологічної могутності, оскільки це були перші ігри, які транслювались по всьому світу, з понад 70% населення, яке побачило, як імператор Хірохіто офіційно відкриває ігри. Міжнародні захоплювачі високо оцінили Токіо, особливо його зусилля щодо модернізації, увінчані новим "швидкісним потягом", який транспортував учасників по місту.\n\nСША здобули найбільше медалей, вигравши 46 золотих, за ними йде Японська імперія з 22 золотими медалями та Італія з 18. Значно відсутніми в цих Олімпійських іграх були команди з Німеччини, Південної Африки та Великобританії через триваючі конфлікти."
 WORLD.581.a: "Токіо справило велике враження."
 WORLD.581.b: "Токіо встановило високий стандарт."
 
 WORLD.582.t: "[Get_newspaper_header]Англія тріумфує на Чемпіонаті світу 1966 року"
 WORLD.582.d: "Після напруженого матчу надії та мрії багатьох англійських уболівальників здійснилися. Джефф Герст оформив хет-трик і приніс перемогу над Німеччиною з рахунком 4–2. Однак ця солодка звитяга швидко затьмарилася - після оголошення результатів серед фанатів спалахнули заворушення, які іберійська поліція оперативно розігнала.\n\nЦе стало гірким завершенням чудового турніру, який урочисто відкривали навіть лідери Іберійського Союзу, тоді як інші команди звинувачують то Англію, то Німеччину з огляду на міжнародні альянси. У менш поляризуючих новинах: чинні чемпіони, Бразилія, втратили шанс на подальший виступ, зазнавши принизливої поразки 0–2 від Болгарії на груповому етапі."
 WORLD.582.a: "Вперед, Англіє, повертай кубок додому!"
 WORLD.582.b: "Scheiße! Та що взагалі НСРЛ робить із цією командою?!"
 WORLD.582.c: "Принаймні Пеле зіграв гідно…"
 WORLD.582.e: "Потворний фінал прекрасної гри!"
 
 WORLD.583.t: "[Get_newspaper_header]Бразилія знову чемпіон світу"
 WORLD.583.d: "Після переконливої перемоги з рахунком 4–1 над Італією в Мехіко Бразилія втретє в історії стає чемпіоном світу з футболу. Цілком очікувано, гравець матчу Пеле видав приголомшливий виступ: він відкрив рахунок уже на 9-й хвилині, остаточно деморалізувавши й без того нервову італійську збірну, а в другому таймі основного часу забив ще двічі.\n\nУ найбільших містах Бразилії панує гарячкова атмосфера - площі наповнені святкуваннями. Перемога приходить на тлі уповільнення економіки та наближення виборів, які тепер можуть схилитися на користь партії чинного лідера [BRA.GetLeader].\n\nБразильська збірна, взявши реванш після принизливого вильоту на груповому етапі попереднього турніру, виграла 3 з останніх 4 чемпіонатів і тепер назавжди залишить у себе трофей Жюля Ріме - новий кубок буде виготовлено через чотири роки.\n"
 WORLD.583.a: "Як у них це постійно виходить?"
 WORLD.583.b: "Посунься, Англіє - у футболу тепер новий дім!"
 WORLD.583.c: "Так близько, і водночас так далеко…"
 
 WORLD.584.t: "[Get_newspaper_header]Ґерманія виграє Чемпіонат світу 1966 року"
 WORLD.584.d: "Лондон завмер, тоді як минулої ночі лунала «Germania», коли вболівальники спостерігали за перемогою Німеччини з рахунком 3–2 у додатковий час і її тріумфом на Чемпіонаті світу з футболу, вкотре розбивши мрії засновників асоціативного футболу. Англія утримувала перевагу в Мадриді аж до гола за 15 секунд до завершення основного часу, але після поновлення гри поступилася і матчем, і турніром.\n\nПовідомлення про насильство з боку англійських фанатів були різко засуджені урядами обох країн та господарем турніру - Іберією. Результат гірко сприйнятий нацією, яка двічі зазнавала окупації Вермахтом та його прихильниками, і яка знову втратила славу від рук німців. Чинні чемпіони Бразилія також покинули турнір розчарованими, вилетівши на груповому етапі, попри перемоги у двох попередніх розіграшах кубка."
 WORLD.584.a: "Потворний фінал прекрасної гри!"
 WORLD.584.b: "Та просто приберіть уже цю кляту газету."
 WORLD.584.c: "Wir sind Weltmeister, schalalalala…"
 WORLD.584.e: "Принаймні Пеле зіграв гідно…"
 
 WORLD.585.t: "[Get_newspaper_header]Іберія виграє Чемпіонат світу 1966 року"
 WORLD.585.d: "Сенсаційний результат із Мадриду сьогодні: після рівної та напруженої гри іберійський футболіст Еусебіу забив головою на доданих хвилинах, вирвавши перемогу 1–0 над Німеччиною у фіналі Чемпіонату світу. «Це не просто гордий день для іберійського футболу, а й для іберійського народу всюди!» - незвично піднесено вигукнув Франко, цокаючись келихами шампанського з іншими VIP-гостями у своїй ложі.\n\nЙого настрій не є винятком - кажуть, що люди святкують до глибокої ночі, насолоджуючись цією солодкою перемогою, яка доводить не лише футбольну майстерність, а й силу їхнього союзу. У більш похмурих новинах: дворазові чемпіони світу, Бразилія, були принижені поразкою 0–2 від Болгарії на груповому етапі."
 WORLD.585.a: "Світла пляма на похмурому півострові."
 WORLD.585.b: "¡Viva! Наші хлопці змусили нас пишатися!"
 WORLD.585.c: "Meu Deus! Невже останні 8 років були лише випадковістю?"
 WORLD.585.e: "Як ми могли програти цій зрощеній невдасі?"

 WORLD.590.t: "[Get_newspaper_header]Кінець Південноафриканської війни"
 WORLD.590.d: "Найбільш суперечливий і значущий міжнародний конфлікт з часів Другої світової війни, Південноафриканська війна, завершилася сьогодні з набуттям чинності Віттовським миром. Підписавши угоду для німецьких сил Оберст Рольф Штайнер і для сил ОВН генерал Крейтон Ейбрамс, результат війни здається цілком на користь ОВН.\n\nЗдаючи значні території Райхскомісаріатами Африки та розпускаючи Африканерську Волькштат за умовами договору, керівництво обох сторін тепер зосереджується на майбутньому. Однак, зважаючи на те, що Південна Африка тепер відповідає за управління величезними новими територіями, а внутрішні заворушення охоплюють німецьку Африку, багато хто в міжнародному співтоваристві боїться, що кінець одного конфлікту може бути лише початком багатьох інших."
 WORLD.590.a: "Мир нарешті."

 WORLD.591.t: "[Get_newspaper_header]Кінець Південноафриканської війни"
 WORLD.591.d: "Найбільш суперечливий і значущий міжнародний конфлікт з часів Другої світової війни, Південноафриканська війна, завершилася сьогодні з набуттям чинності Договором в Габороне. Підписавши угоду для німецьких сил Оберст Рольф Штайнер і для сил ОВН генерал Крейтон Ейбрамс, розвиток війни в гіркоти та дороговартісний застій змусив повернутися до довоєнних кордонів.\n\nЗберігаючи кордони незмінними та зазнавши величезних людських втрат з обох сторін, суперечність війни тепер стала частиною історії, оскільки багато хто запитує, чи була ця війна дійсно варта того. Тепер, коли бурські народи реінтегруються в Південну Африку, багато хто в ОВН побоюється, що останній маяк демократії в Африці швидко повернеться до своїх довоєнних проблем, в той час як німецька Африка стикається з невизначеним майбутнім, оскільки ставка Шильда на Африку зазнала невдачі."
 WORLD.591.a: "Мир нарешті."

 WORLD.592.t: "[Get_newspaper_header]Кінець Південноафриканської війни"
 WORLD.592.d: "Найбільш суперечливий і значущий міжнародний конфлікт з часів Другої світової війни, Південноафриканська війна, завершилася сьогодні з набуттям чинності Договором в Преторії. Підписавши угоду для німецьких сил Оберст Рольф Штайнер і для сил Африка-Шильд генерал Вільям Вестморленд, результат війни здається цілком на користь Африка-Шильду.\n\nЗдаючи південну територію Південної Африки і визнаючи незалежність бурських народів за умовами договору, керівництво обох сторін тепер звертається до майбутнього. Незважаючи на загальну міжнародну думку, що тепер переважно перерозтягнуті Райхскомісаріати Африки зіткнуться з новими труднощами для утримання своїх все більш слабких позицій, майбутнє Південної Африки і те, як її народ прийме нову реальність, залишається тривожним і невизначеним."
 WORLD.592.a: "Мир нарешті."

 WORLD.593.t: "[Get_newspaper_header]Кінець Південноафриканської війни"
 WORLD.593.d: "Найбільш суперечливий і значущий міжнародний конфлікт з часів Другої світової війни, Південноафриканська війна, тепер, здається, завершена, коли німецькі сили остаточно захопили останні позиції ОВН на території Південної Африки. В той час як основна частина сил США вже була евакуйована, останні дні війни ще більше поглинали хаос, коли про-ОВН південноафриканці намагалися втекти з країни, і посольство США в Кейптауні було змушене евакуюватися вертольотом.\n\nХоча офіційні бойові дії продовжуються без підписаного мирного договору, катастрофічний результат війни для ОВН став причиною серйозних запитань щодо майбутнього США на міжнародній арені після другого рішучого виведення з конфлікту за два десятиліття, залишаючи ще одного ключового союзника на милість сил нацизму."
 WORLD.593.a: "Мир нарешті."
 WORLD.593.b: "Африка наша!"

 WORLD.594.t: "[Get_newspaper_header]Кінець Південноафриканської війни"
 WORLD.594.d: "Найбільш суперечливий і значущий міжнародний конфлікт з часів Другої світової війни, Південноафриканська війна, тепер, здається, завершена з повним крахом німецьких режимів в Африці. Це крах, який можна описати лише як суцільний хаос, з тисячами німецьких солдатів, які масово здаються силам ОВН, місцевими підрозділами СС, що відкрито повстають, і кількома високопосадовими німецькими генералами, яких захоплено в полон.\n\nЩо буде далі з колишніми німецькими територіями залишається невизначеним, оскільки жодна чітка політика ОВН після війни не була оприлюднена. Поки командири ОВН і політики святкують найбільшу і найрішучішу поразку нацистських сил в історії, альянс зараз виявляється, що займає величезні та нестабільні території, з початковими повідомленнями, що місцеві німецькі адміністрації здебільшого зберігаються на місці."
 WORLD.594.a: "Мир нарешті."

 WORLD.595.t: "[Get_newspaper_header]США оголошує війну Африка-Шильду"
 WORLD.595.d: "Останній етап серії драматичних ескалацій у Південноафриканській війні, холодно-вікові напруження досягли найвищої точки з часів кризи на Алеутських островах з рішенням США значно ескалувати Південноафриканську війну разом зі своїми союзниками з ОВН, майже потроївши кількість розгорнутих сил. Заявляючи перед Конгресом, Президент [USA.GetLeader] стверджував, що Африка-Шильд не залишило ОВН жодного вибору після застосування німцями хімічної зброї, що призвело до загибелі майже трьохсот солдатів США.\n\nДо цього часу німецька відповідь залишається невизначеною, з повідомленнями про запеклі дебати, що охопили Райхстаг, і чутки про те, що Фюрер наказав арештувати Райхскомісара Ганса Хюттіга. Тим часом світ затамував подих, побоюючись, що аналогічне німецьке втручання може призвести до початку апокаліптичної Третьої світової війни, оскільки десятки тисяч американських солдатів готуються до розгортання."
 WORLD.595.a: "Чи це початок кінця?"

 WORLD.605.t: "[Get_newspaper_header]Хімічні зброї використані в Південній Африці!"
 WORLD.605.d: "Коли перші розрізнені повідомлення почали надходити з фронту, їх відхилили як помилково ідентифіковані димові хмари панікуючими солдатами. Але коли жертви, які захлиналися і важко дихали, були перенесені перед телевізійними камерами та репортерами, вже не можна було заперечувати це.\n\nВперше з часів Першої світової війни армія США зазнала нападу з використанням отруйного газу - і від німців, на додачу. Було підозра, що війська Ганса Хюттіга в Остафриці мають хімічну зброю, хоча мало хто вірив, що він коли-небудь застосує її на полі бою. Але він це зробив, порушивши одне з найбільш поважаних табу в сучасній війні. Американський уряд уже пообіцяв помсту, і підтримка для США поступово надходить з усього світу. Тепер мало хто сумнівається в тому, хто є більшим злом у Південноафриканській війні."
 WORLD.605.a: "Як це страшно!"
 WORLD.605.b: "Перемога будь-якою ціною!"
 WORLD.605.c: "Чи немає меж німецькому злу?"

 WORLD.650.t: "[Get_newspaper_header]Шах Ірану вбитий"
 WORLD.650.d: "На тлі зростаючих заворушень по всій країні, столиця Ірану, Тегеран, була введена під військовий стан після шокуючого вбивства шаха Мохаммада Рези Пехлеві. Він був націлений під час візиту до Тегеранського університету, де його двічі влучили в груди під час прогулянки по кампусу, і він помер на місці. Після того, як вбивцю захопили живим, державні ЗМІ оголосили, що це був студент університету, радикалізований в еміграції Рухоллою Хомейні.\n\nНовини про смерть шаха викликали святкування по всьому Ірану, оскільки велика частина населення відвернулася від шаха через його реформи "Білої революції". Країна паралізована заворушеннями, а армія вступила в боротьбу з бунтами в кількох великих містах, і багато хто ставить під сумнів, чи здатна криза в уряді Ірану пережити бурю."
 WORLD.650.a: "Невизначене майбутнє попереду."

 WORLD.651.t: "[Get_newspaper_header]Іранська громадянська війна"
 WORLD.651.d: "Всі погляди спрямовані на Близький Схід, де країна Іран занурюється в хаос. Напруження були високими ще з 1953 року, коли нафти скандал призвів до приходу до влади про-німецького шаха Пехлеві. Однак швидко зростаюче населення призвело до нестабільності, що досягло апогею після вбивства шаха.\n\nОтже, Іран занурюється в громадянську війну. Королівський уряд, очолюваний регентом Фарах Пехлеві, зміцнив північ у відчайдушній спробі зупинити наступ ісламістів, радикалізованих студентів, соціялістів і іноземних сил, які прагнуть захопити країну. Цей Іранський революційний альянс, нестабільна республіканська фракція, об'єднана метою покласти край монархізму, очікується, що осадить Тегеран протягом місяця. Ірак, вже нестабільний сусід, став трампліном для найманців і потоком зброї з усього світу. Бомбардування стали звичайним явищем, поки давня нація стикається зі своєю найтемнішою годиною."
 WORLD.651.a: "Персидська порохова бочка нарешті вибухає."

 WORLD.652.t: "[Get_newspaper_header]Колапс Іранського революційного альянсу"
 WORLD.652.d: "Іранський революційний альянс остаточно зазнав краху під тиском внутрішніх проблем. Хоча конкретна причина цього другого конфлікту невідома, всі сторони звернулися за іноземною допомогою. Хоча багато революційних рухів можна умовно охарактеризувати за ідеологією, кожне поселення бореться за себе.\n\nФотографії з танками та перестрілками домінують у газетах, за ними йдуть фільми, на яких зображені хвилі цивільних осіб, що тікають до узбережжя.\n\nСоціялістичні революціонери базуються на західних горах, намагаючись протистояти радикальним ісламістам, які здобули сильну підтримку з боку сусідніх країн. Ідеалісти змогли встановити деякий порядок на півдні, але постійно стикаються з дезертирствами, коли вони намагаються здійснити наступ на центральний Шадом Ірану. Монархічні відступники залишаються в ізольованих осередках, сподіваючись, що їх улюблена Персія доживе до нового світанку."
 WORLD.652.a: "Ще глибше в безодню."

 WORLD.653.t: "[Get_newspaper_header]Друга Південноафриканська громадянська війна"
 WORLD.653.d: "Незважаючи на те, що новини з Африки були спорадичними після німецької перемоги у Південноафриканській війні, зараз з'явилися численні хаотичні повідомлення, які підтверджують повний крах Африканерського Волькштату. З початком перевороту генералом Магнусом Маланом проти кризи в уряді бурів, лояльні до колишнього південноафриканського державного утворення піднялися разом з численними національними африканськими повстаннями по всій країні.\n\nПісля значних руйнувань і мародерства під час і після Південноафриканської війни, наказ уряду бурів розпустити та підготуватися до анексії Хансом Хюттігом здається останньою краплею. Звертаючись до бурських лоялістів по телебаченню з Блумфонтейну, генерал Малан оголосив кінець співпраці бурів з німцями та поклявся, що вся Південна Африка буде звільнена від рук повстанців і терористів."
 WORLD.653.a: "Ще одна війна в Африці?"

 ## WORLD.654-668 former Great Games

 WORLD.669.t: "[Get_newspaper_header]Падіння Африканського Райхстату"
 WORLD.669.d: "Драматичні – хоча, можливо, й не зовсім несподівані – новини надійшли від тих небагатьох дипломатичних працівників та закордонних кореспондентів, які наразі працюють у Південній та Центральній Африці. Großafrikanischer Reichsstaat, нелегітимне об'єднання німецьких африканських колоній, повністю розпався. Після загального колапсу в торгівлі та цивільному управлінні численні ватажки, міліції та потенційні держави оголосили про свою незалежність від центрального уряду в Бухлерштадті. Вважається, що правитель Райхстату, страхітливий Ганс Хюттіг, загинув. Тим часом німецькі поселенці, солдати та адміністративний персонал рятуються втечею з континенту будь-яким можливим способом. Від Конго до річки Замбезі Африка вільна від німецького чобота. Але ніхто не знає, що буде далі."
 WORLD.669.a: "Хюттіг більше не правитиме пеклом."

 WORLD.701.t: "[Get_newspaper_header]Уоллес Ф. Беннетт інавгурований президентом Сполучених Штатів"
 WORLD.701.desc: "Несподіваний поворот подій: Республіканська партія, яка здавалася політично зруйнованою через скандали Ніксона, раптово повернулася до влади. Уоллес Ф. Беннетт, від Республікансько-демократичної партії, сьогодні виграв вузьку перемогу над Національним прогресивним пактом і став президентом Сполучених Штатів. Беннетт використав свою інавгураційну промову, щоб закликати гірко поділену Америку об'єднатися як одна нація, щоб зустріти труднощі цього часу.\n\nПоміркований і неприхильний до політичних крайнощів, Беннетт вірить, що можливо знайти середину між двома сторонами дебатів щодо громадянських прав. Він також пообіцяв розширити дипломатичні та економічні зв'язки Америки з партнерами ОВН та іншими нейтральними країнами, відмовившись від таємничого підходу адміністрації Ніксона."
 WORLD.701.a: "Про нього подумаємо пізніше."
 WORLD.701.b: "Здається, він порядна людина."
 WORLD.701.c: "До процвітаючого майбутнього!"
 WORLD.701.d: "Чи буде він майстром компромісу?"
 WORLD.701.e: "Розумна людина, розумний сусід?"

 WORLD.702.t: "[Get_newspaper_header]Ліндон Б. Джонсон інавгурований президентом Сполучених Штатів"
 WORLD.702.desc: "Після близької політичної гонки, яка вперше поставила під загрозу чинний Республікансько-демократичний коаліційний уряд, партія сьогодні з полегшенням видихнула, оскільки демократичний кандидат Ліндон Б. Джонсон здобув перемогу на президентських виборах. У своїй промові Джонсон похвалив непохитність своєї партії і пообіцяв продовжити добру справу своїх попередників.\n\nВпевнений, але прогресивно налаштований, Джонсон поділяє переконання колишнього президента Кеннеді щодо громадянських прав. Джерела всередині стверджують, що він має великий проект, спрямований на поліпшення багатьох аспектів американського суспільства, але Джонсон залишається стриманим. Деякі політичні суперники називають його впертим буйволом, хоча багато прогресистів у НПП тихо хвалять частину його виборчої програми."
 WORLD.702.a: "Піднімаючи слабких і неповноцінних. Дурниці."
 WORLD.702.b: "Дивимось усередину, як ми й повинні."
 WORLD.702.c: "Закладаємо основу Великого Суспільства."
 WORLD.702.d: "Кеннеді обіцяв, але чи зможе Джонсон це зробити?"
 WORLD.702.e: "Друг Лопесу Матосу та мексиканській нації."

 WORLD.703.t: "[Get_newspaper_header]Роберт Ф. Кеннеді інавгурований президентом Сполучених Штатів"
 WORLD.703.desc: "Вперше за майже століття Білий дім не буде належати ані демократу, ані республіканцю. Роберт Ф. Кеннеді, від прогресивного крила Національного прогресивного пакту, сьогодні здобув вузьку перемогу над РДК і став новим президентом. У своїй промові Кеннеді щиро подякував американському народу за довіру і пообіцяв довести, що ця довіра була виправданою.\n\nБрат колишнього президента Джона Ф. Кеннеді, Боббі пообіцяв вшанувати спадщину свого брата, просуваючи справу громадянських прав ще більше, а також вирішити проблеми бідності та нерівності в доходах, щоб створити кращу та справедливішу Америку для всіх. Циніки вважають його занадто сміливим і ідеалістичним для успіху, але мільйони американців щиро вірять, що це саме та людина, яка може змінити Америку."
 WORLD.703.a: "Дивіться за ним уважно."
 WORLD.703.b: "Можливо, його поле бою буде вдома."
 WORLD.703.c: "Давайте подивимося, що зробить другий Кеннеді."
 WORLD.703.d: "Приємно бачити нове обличчя, хоча б так."
 WORLD.703.e: "Чи поширюється його боротьба за справедливість на брасерос?"

 WORLD.704.t: "[Get_newspaper_header]Джордж Уоллес інавгурований президентом Сполучених Штатів"
 WORLD.704.desc: "Ніхто не очікував цього результату, і ще менше хто може стримати свій шок. Джордж Уоллес, кандидат націоналістичної фракції Національного прогресивного пакту, вузько здобув перемогу на президентських виборах після однієї з найгарячіших і найнесолідніших виборчих кампаній в історії Америки. У своїй триумфальній промові Уоллес з гордістю оголосив: «Американський народ висловився єдиним голосом, і вони вимагають одне – припинити ці дурниці!»\n\nНіхто не може помилитися, щодо кого були спрямовані ці слова, оскільки кандидат-сегрегаціоніст виступав з платформою рішучого опору руху за громадянські права, який раніше набирав популярності. Оновлені зіткнення між сегрегаціоністами та активістами громадянських прав спалахнули по всьому півдню, і Мартін Лютер Кінг та інші впливові голоси засудили раптовий реакційний поворот подій."
 WORLD.704.a: "Занадто слабкий для управління, він би вважав за краще, щоб це робили штати."
 WORLD.704.b: "Можливі економічні втручання."
 WORLD.704.c: "Роки прогресу, скоро будуть зруйновані."
 WORLD.704.d: "Сегрегація ніколи, сегрегація назавжди?"
 WORLD.704.e: "Янкі виявляють свої справжні кольори."

 WORLD.711.t: "[Get_newspaper_header]Баррі Голдватер інавгурований президентом Сполучених Штатів"
 WORLD.711.desc: "Демократи все ще оговтуються після поразки РДК у 1964 році, і здається, що республіканці повернулися, щоб забрати корону американського статус-кво. Баррі Голдватер сьогодні склав присягу, заявивши в своїй інавгураційній промові, що ера надмірного та безвідповідального урядування закінчена.\n\nГолосний критик федеральної політики багато років, Голдватер вважає, що бюджет Вашингтону і його повноваження повинні бути значно скорочені, а всі обов'язки, які не стосуються безпеки та дипломатії, слід передати державним урядам. Однак він також вірить у перенаправлення фінансування на зростаючий військово-промисловий комплекс Америки, щоб краще захиститися від інших держав. Деякі жахаються від співпраці між 'військовими наживачами' і урядом."
 WORLD.711.a: "Наче їхній 'військово-промисловий комплекс' може зрівнятися з нашою інженерією!"
 WORLD.711.b: "Сильніша американська армія викликає великі занепокоєння."
 WORLD.711.c: "Сильна американська армія - на благо всім нам!"
 WORLD.711.d: "Американська армія, мабуть, вже слиниться при думці."

 WORLD.712.t: "[Get_newspaper_header]Філіп Харт інавгурований президентом Сполучених Штатів"
 WORLD.712.desc: "Філіп Харт, палкий захисник американського лібералізму та колишній 'совість Сенату', сьогодні склав присягу як президент Сполучених Штатів. Новий президент розпочав свій термін двадцятихвилинною промовою, в якій виклав амбітну програму, що нагадує епоху Франкліна Делано Рузвельта. Харт пообіцяв керувати з почуттям співчуття та 'будувати націю, в якій буде можливість для всіх'. Він також пообіцяв подвоїти захист споживачів і відновити американські міста.\n\nЦя подія є важливим етапом не тільки для Харта, але й для РДК, яка вперше за свою історію втратила Білий дім всього чотири роки тому. Час покаже, чи зможе коаліція Харта утримати Білий дім або вона розпадеться перед численними, здається, нездоланними викликами, які стоять перед країною."
 WORLD.712.a: "Нове помазання на стару свиню."
 WORLD.712.b: "Людина, занадто хороша для уряду."
 WORLD.712.c: "Серце та душа Америки"
 WORLD.712.d: "Машина повертає Білий дім."

 WORLD.713.t: "[Get_newspaper_header]Майкл Харрінгтон інавгурований президентом Сполучених Штатів"
 WORLD.713.desc: "Після того, як РДК ледь втримався у 1964 році, їх нарешті скинули з трону. На місце відхідного президента прийшов Майкл Харрінгтон, відомий професор, політичний коментатор і тепер лідер Національного прогресивного пакту.\n\nСамопроголошений 'демократичний соціяліст' Харрінгтон має намір вжити радикальних змін, щоб вирішити те, що він вважає найбільшим питанням, яке хвилює Америку - бідність. Він багато писав про це під час своєї активістської діяльності, і тепер має можливість дати голос 'Іншій Америці'. Консерватори та ліберали вражені його відкритим опором laissez-faire економіці, яку Америка тримала протягом століть, але для його мільйонів захоплених прихильників Харрінгтон - їхня найбільша надія."
 WORLD.713.a: "Америка фліртує з більшовизмом. Жалюгідно."
 WORLD.713.b: "Хм. Трохи нестачі тримає народ сильним."
 WORLD.713.c: "Сподіваємось, він не зачепить НАШУ економіку."
 WORLD.713.d: "Чи можна, нарешті, подолати злидні?"

 WORLD.714.t: "[Get_newspaper_header]Маргарет Чейс Сміт інавгурована президентом Сполучених Штатів"
 WORLD.714.desc: "Сьогодні в Вашингтоні, вперше в історії Америки, жінка була інавгурована президентом Сполучених Штатів. Маргарет Маделін Чейс Сміт принесла присягу. З великими американськими прапорами по боках її трибуни на Меморіалі Лінкольна, вона зробила коротку заяву про досягнення, яких досягла жінка-президент, після чого виступила з пристрасною промовою, що стосувалася кінця американських поразок та принижень на світовій арені.\n\nПромова отримала гарний відгук по всій країні та в ОВН, багато хто оцінив жорстку позицію Сміт проти тиранії. У Німеччині та Японії новина була зустрінута мовчазною тривогою, оскільки Сміт часто закликала до помсти проти ворогів Америки. Тепер вона володіє мечем, і те, де він вдарить, визначатиме майбутнє світу."
 WORLD.714.a: "Смілива. Зарозуміла. Надмірно впевнена. Це нам на руку."
 WORLD.714.b: "Звір у формі жінки."
 WORLD.714.c: "Нехай щастить, Меггі Сміт."
 WORLD.714.d: "Чи зможе вона утримати свою коаліцію?"

 WORLD.721.t: "[Get_newspaper_header]Джордж Ромні інавгурований президентом Сполучених Штатів"
 WORLD.721.desc: "Джордж Ромні, колишній керівник American Motors та губернатор Мічигану, сьогодні склав присягу президентом Сполучених Штатів. Перед уважною натовпом Ромні пообіцяв використовувати силу американського громадянського суспільства, покладати довіру на індивідуальну та добровільну співпрацю та 'забезпечити лідерство, яке заслуговує на довіру людей'.\n\nДосвід Ромні в уряді та бізнесі доповнює його віру в збалансований підхід до публічних і приватних рішень. З критиками з обох політичних крайнощів, ще не ясно, чи зможе новий президент утримати центральну позицію."
 WORLD.721.a: "Ще один слабкодухий бізнесмен."
 WORLD.721.b: "Країну не можна управляти, як компанією."
 WORLD.721.c: "\"Тільки разом ми можемо побудувати НОВУ Америку!\""
 WORLD.721.d: "Велика людина?"

 WORLD.722.t: "[Get_newspaper_header]Жан Киркпатрік інавгурована президентом Сполучених Штатів"
 WORLD.722.desc: "Велика політична зміна сталася в США, коли на президентських виборах [GetYear] була висунута кандидатка від лібералів Жан Киркпатрік.\n\nСтрашно трансформаційна кандидатка за всіма мірками і рідкісна жінка, яка володіє такою владою, Киркпатрік відома зовнішніми спостерігачами своєю непохитною мілітаристською позицією в умовах Холодної війни, поєднаної з традиційно консервативно-демократичним підходом до соціальної політики.\n\nОбрання Киркпатрік президентом чітко позначає поворотний момент у зовнішній політиці Сполучених Штатів; нова адміністрація, ймовірно, побачить різке зростання військових витрат разом із напруженістю в Берліні та Токіо, і те, що чекає на наступні вторгнення, США, безсумнівно, будуть брати участь у більш активній ролі; до шиї і до смерті."
 WORLD.722.a: "Янкі стають відчайдушними в ці переповнені години."
 WORLD.722.b: "Загнаний лис більш небезпечний за шакала."
 WORLD.722.c: "Слава шефу."
 WORLD.722.d: "Слава шефу."

 WORLD.723.t: "[Get_newspaper_header] Генрі Джексон приведений до присяги як Президент Сполучених Штатів"
 WORLD.723.desc: "Сьогодні Генрі 'Скуп' Джексон приніс присягу та був приведений до присяги як Президент Сполучених Штатів Америки. Він виголосив надійну, але дещо запальну промову перед тисячами глядачів на Національному моллі, закликаючи до припинення екстремізму та продовження захисту американських свобод.\n\nЦю промову похвалили в ОВН, але менш позитивно її сприйняли в Німеччині, а найбільш критично – в Японії. Також вона не сподобалась більш екстремістським елементам у НПП, зокрема марксистам та сувереністам. Проте здається, що Америка не прийме екстремізм заради виживання, оскільки на трон піднявся новий прогресивний президент. Мало хто очікує, що Джексон справді здійснить свої погрози щодо Німеччини та Японії. Більшість вважає, що його адміністрація буде просто ще чотири роки американських позерств. Час покаже."
 WORLD.723.a: "Сподіваємось, він не втягне світ у нову війну."
 WORLD.723.b: "Сподіваємось, він не втягне світ у нову війну."
 WORLD.723.c: "Час поставити Японію на її місце."
 WORLD.723.d: "Сподіваємось, він не втягне світ у нову війну."

 WORLD.724.t: "[Get_newspaper_header] Філліс Шлафлі приведена до присяги як Президент Сполучених Штатів"
 WORLD.724.desc: "У церемонії, яку спостерігачі називають «сюрреалістичною», Голова Верховного Суду США сьогодні приніс присягу Філліс Шлафлі як Президенту Сполучених Штатів. Шлафлі, після дня молитов, очолюваних Рев. Джеррі Фолвеллом і кардиналом Терренсом Куком, виголосила темну промову, засуджуючи «гробокопів нашої Республіки» та всіх, хто намагається підкопати «нашу оборону та традиційні єврейсько-християнські сімейні цінності». Потім вона вирушила до Білого дому разом з чоловіком та дітьми святкувати.\n\nРеакція на це дійство за кордоном була змішаною, але воно викликало ще більше суперечок всередині країни. В той час як американська правиця була в захваті, серед лівих та центристів виникла тривога та страх. Час покаже, які плани має ця радикальна президентка."
 WORLD.724.a: "Чи ввійшла Америка у культурну війну?"
 WORLD.724.b: "Чи ввійшла Америка у культурну війну?"
 WORLD.724.c: "Ось вона, місіс Америка..."
 WORLD.724.d: "Чи ввійшла Америка у культурну війну?"

 WORLD.725.t: "[Get_newspaper_header] Френсіс Паркер Йокі приведений до присяги як Президент Сполучених Штатів"
 WORLD.725.desc: "З затриманим диханням та купою емоцій мільйони по всьому світу спостерігали за інавгурацією Френсіса Паркера Йокі. Радість, гнів, надія та ненависть: описувати глобальну реакцію як «суперечливу» – це, мабуть, буде найменшим оціночним висловом десятиліття. В нацистських регіонах Європи новина була зустрінута надзвичайно позитивно, оскільки багато хто був радий побачити такого ж ідеологічного однодумця на посаді. В ОВН і Японії новина сприйнята менш позитивно, бо багато хто тепер насторожено ставиться до нової, мілітаризованої Америки. Найбільш поділяється думка всередині США, де багато протестів переросло в заворушення до ночі.\n\nНезважаючи на реакції, Йокі тепер сидить в Овальному кабінеті. Намічені ним наміри щодо медіа-цензури змушують багатьох американців чекати тоталітарного правління заліза, в той час як інші очікують майбутніх величних днів."
 WORLD.725.a: "Надсилаємо наші вітання."
 WORLD.725.b: "Пікова західної імперіалізму. Так написано в його книзі."
 WORLD.725.c: "Останнє світло свободи гасне."
 WORLD.725.d: "Світ перевернувся."

 WORLD.751.t: "[Get_newspaper_header] Друге інавгураційне засідання Воллеса Ф. Беннетта"
 WORLD.751.desc: "Сьогодні на сцені яскраво демонструється пишність і урочистість, оскільки Президент Воллес Ф. Беннетт розпочинає свій другий термін на посаді Президента Сполучених Штатів. Оточений американськими прапорами, які покривають Капітолій, Президент Беннетт оголосив: «Кожен американець мріє про свободу, процвітання, виконання своїх бажань. Я не можу обіцяти утопію, але я можу обіцяти, що через чесну працю і віру в нашу республіку факел свободи буде горіти вічно».\n\nСпостерігачі зазначили, що Президент Беннетт обіцяв мало що нового порівняно зі своєю кампанією 1964 року – стабільність та управління Америкою через соціальні розділи та посилення зобов'язань перед ОВН. Однак американський народ, здається, надає перевагу Беннетту перед радикальними представниками НПП, сподіваючись, що Америка зможе знайти мир по завершенні буремного десятиліття."
 WORLD.751.a: "Застій – це смерть нації!"
 WORLD.751.b: "Імперіаліст ніколи не змінює своє обличчя."
 WORLD.751.c: "Тримай курс!"
 WORLD.751.d: "Все спокійно в Америці."

 WORLD.752.t: "[Get_newspaper_header] Друге інавгураційне засідання Президента США Ліндона Б. Джонсона"
 WORLD.752.desc: "Схоже, що програма Президента Ліндона Б. Джонсона 'Велике суспільство' виявилась великою успішною ініціативою, і сьогодні його зусилля дали свої плоди. Лідер Демократичної партії знову здобув перемогу над своїми суперниками з Національного прогресивного пакту і отримав чотири додаткові роки на посаді Президента.\n\nДругий термін Джонсона обіцяє бути прямим продовженням його першого. Він пообіцяв продовжити розширення 'Великого суспільства' до того часу, поки воно не принесе користь кожному американцеві, одночасно зберігаючи позицію нації як лідера вільного світу. З характерною зухвалістю він оголосив перед натовпом своїх прихильників, що Америка продовжить вирішувати всі свої проблеми як внутрішні, так і зовнішні."
 WORLD.752.a: "Передбачувано."
 WORLD.752.b: "Передбачувано."
 WORLD.752.c: "Всі разом з ЛБД!"
 WORLD.752.d: "Всі разом з ЛБД!"

 WORLD.753.t: "[Get_newspaper_header] Роберт Ф. Кеннеді забезпечує другий термін"
 WORLD.753.desc: "Роберта Ф. Кеннеді колись вважали надто наївним ідеалістом, щоб досягти успіху. Але сьогодні його сумніви були розвіяні, коли прогресивний чемпіон знову переміг у Республікансько-Демократичному коаліційному змаганні та забезпечив чотири додаткові роки на посаді Президента. Перед натовпом прихильників, він заявив, що, хоча було досягнуто багато змін, «залишилось ще так багато зробити».\n\nКеннеді пообіцяв зосередити свій другий термін на викоріненні залишкових несправедливостей в американському суспільстві, а також на впровадженні ще більш амбіційних планів. Дехто нервує від того, як далеко він готовий йти, щоб здійснити свої мрії. Незалежно від того, що станеться, небагато американців сумніваються, що 1960-ті роки будуть пам'ятатися як десятиліття безпрецедентних змін."
 WORLD.753.a: "Вітер змін несе Америкою."
 WORLD.753.b: "Вітер змін несе Америкою."
 WORLD.753.c: "Вітер змін несе Америкою."
 WORLD.753.d: "Вітер змін несе Америкою."

 WORLD.754.t: "[Get_newspaper_header] Друге інавгураційне засідання Президента США Джорджа Воллеса"
 WORLD.754.desc: "Чотири роки тому це здавалось немислимим, але сьогодні Джордж Воллес урочисто звернувся до натовпу вболівальників сегрегації, здобувши другий термін для своєї адміністрації. Вогняний представник НПП заявив, що його перемога є доказом того, що Америка справді на його боці, з гордістю оголошуючи, що сегрегація не закінчиться, поки він при владі.\n\nАмерика, яка вже розділена, здається, буде ще більше напружена, коли Воллес продовжить просувати свою програму. Подальша боротьба з законодавством про громадянські права та нові корпоративні угоди – все це буде на порядку денному, і хоча вороги президента, ймовірно, втомлені від багатьох років боротьби та поразок, вони точно не піддадуться."
 WORLD.754.a: "Здається, у американців є розум."
 WORLD.754.b: "Чи може Америка хоч раз замовкнути?"
 WORLD.754.c: "Принаймні він корисний для бізнесу."
 WORLD.754.d: "Діксіланд робить свою позицію."

 WORLD.761.t: "[Get_newspaper_header]Баррі Голдватер забезпечує другий термін"
 WORLD.761.desc: "Критики фіскальної політики Баррі Голдватера та його мілітаристських амбіцій сьогодні замовкли, оскільки консервативний республіканець здобув достатню підтримку серед американців, щоб забезпечити собі другий термін. Задоволений тим, що публіка схвалює його дії, Голдватер готовий продовжити свою боротьбу за менший уряд та більш сильний приватний сектор.\n\nАмерика вже зазнала значних змін з моменту його першої інавгурації. Тепер набагато більше відповідальності покладено на місцеві органи влади та великий бізнес, знижено податки та участь уряду в різних сферах. Ця трансформація, схоже, продовжиться й під час його другого терміну, і Голдватер, ймовірно, залишить свій слід в американському консерватизмі на довгі роки."
 WORLD.761.a: "У твоєму серці ти знаєш, що він правий."
 WORLD.761.b: "Правитель, який не любить правити."
 WORLD.761.c: "У твоєму серці ти знаєш, що він правий."
 WORLD.761.d: "У твоєму серці ти знаєш, що він правий."

 WORLD.762.t: "[Get_newspaper_header]Філіп Харт забезпечує другий термін"
 WORLD.762.desc: "Президент США Філіп Харт сьогодні розпочав свій другий термін на посаді з інавгурації на східній портиці Капітолію США. Хоча погода не сприяла, промочивши малий, але захоплений натовп прихильників зимовим дощем, Харт виголосив оптимістичну промову про доброчесність лібералізму, силу американського духу і необхідність того, щоб уряд піклувався про свій народ. У компанії своєї дружини Джейн, президент, ймовірно, візьме участь у традиційних святкових балах, які зазвичай супроводжують початок нового президентського терміну.\n\nПерший термін президента побачив великі інвестиції уряду в урбаністичний розвиток, однак ці ж інвестиції викликали значний відгук від різних секторів. Спостерігачі очікують, що ці суперечки продовжаться, оскільки президент посилює свої зобов'язання щодо американських міст."
 WORLD.762.a: "Хвороба триває."
 WORLD.762.b: "Більше того ж самого."
 WORLD.762.c: "Нове обличчя американського лібералізму."
 WORLD.762.d: "Нове обличчя американського лібералізму."

 WORLD.763.t: "[Get_newspaper_header]Президент Гаррінгтон інавгурується на другий термін"
 WORLD.763.desc: "Сьогодні сотні тисяч зібралися перед Білим Домом, щоб побачити інавгурацію Майкла Гаррінгтона на другий термін на посаді Президента Сполучених Штатів. Гаррінгтон є членом лівого крила Національного прогресивного пакту. Ставши відомим на національній сцені як автор, він швидко піднявся до найвищої посади в країні, обіцяючи створити кращу систему, яка служитиме всім американцям. Гаррінгтон працював над впровадженням ряду радикальних реформ під час свого першого терміну і, здається, готовий продовжити цю роботу під час свого другого терміну.\n\nПісля прийняття присяги президент звернувся до зібраного натовпу, заявивши: «Тепер ми повинні захищати і розширювати все, що ми досягли разом» та що «деспотизм за кордоном повинен бути оскаржений справедливістю вдома». Здається, що вітер змін буде продовжувати дути в Сполучених Штатах ще чотири роки."
 WORLD.763.a: "Америка залишається під юдео-большевицьким чоботом."
 WORLD.763.b: "Таких слабкостей буде падінням Америки."
 WORLD.763.c: "Америка залишається надією для свободи і справедливості."
 WORLD.763.d: "Інша Америка зберігає свій голос."

 WORLD.764.t: "[Get_newspaper_header] Друге інавгураційне засідання Президентки США Маргарет Чейс Сміт"
 WORLD.764.desc: "Сьогодні Президентка Маргарет Чейс Сміт була пере-інавгурована перед сотнями тисяч, отримавши похвалу від своїх критиків за те, що змогла утримати Національний прогресивний пакт разом після проведення програми, яка задовольнила як ліві, так і праві партії. Сміт виголосила коротку інавгураційну промову, яка закликала до єдності серед американців та продовження свободи і миру за кордоном. Вона також заявила, що ідеали, які стоять за її адміністрацією, залишатимуться важливими впродовж наступних чотирьох років.\n\nВсесвітньо відома за її здатність керувати ОВН, Сміт визначила свою програму на наступний термін як легітимізацію Національного прогресивного пакту і просування США як світової держави. Чи залишиться вона вірною своїм обіцянкам, ще не відомо, оскільки її другий термін офіційно розпочався."
 WORLD.764.a: "Барбаризм продовжує безперешкодно поширюватись."
 WORLD.764.b: "Брехня ще одного жорстокого імперіаліста."
 WORLD.764.c: "Свобода не підлягає обговоренню."
 WORLD.764.d: "Америка продовжує намагатися контролювати світ."

 WORLD.777.t: "[Get_newspaper_header]Резолюція Капської затоки прийнята!"
 WORLD.777.desc: "Минулої ночі Конгрес Сполучених Штатів прийняв Резолюцію Капської затоки, що надає Президенту [USA.GetPresidentLastName] право вжити будь-яких заходів, які він вважає необхідними для помсти за атаки та для сприяння міжнародному миру й безпеці в Африці. Президент вже закликав до значного збільшення американської присутності в Південній Африці, і великі кількості зброї, танків, пального та боєприпасів скоро почнуть надходити для підкріплення союзників на континенті. Незабаром американські солдати та авіатори очікуються на місці, щоб стояти пліч-о-пліч з Південною Африкою проти сил Райхскомісаріату.\n\nНастрій навколо Кейптауна святковий. Багато хто, як на вулицях, так і в адміністрації, вважають, що точка повороту в війні тепер досягнута, і що перемога буде швидко слідувати за американцями в Африку. Райхскомісари, зі свого боку, налаштовані продовжувати боротьбу. Наразі війна триває."
 WORLD.777.a: "Дядя Сэм прибуває по-справжньому."

 WORLD.778.t: "[Get_newspaper_header]Резолюція Капської затоки не пройшла!"
 WORLD.778.desc: "Стратегія президента [USA.GetPresidentLastName] щодо Південної Африки стикається з невизначеним майбутнім після того, як Резолюція Капської затоки не змогла пройти через Конгрес. Написана для надання президенту права вжити будь-яких заходів, які він вважав необхідними для помсти за атаки та для сприяння підтримці міжнародного миру і безпеки в Африці, резолюція мала стати юридичною основою для збільшення американської присутності на континенті та в Південноафриканській війні.\n\nЦе удар як по престижу адміністрації [USA.GetPresidentLastName], так і по зусиллях у Південній Африці. Президент США вже давно планував збільшити свою участь у війні, але позбавлений легального шляху для цього, його здатність реалізувати ці плани тепер під сумнівом. Здається, Південна Африка змушена обходитися наявними силами в найближчому майбутньому, що безсумнівно радує їхніх супротивників з Райхскомісаріату."
 WORLD.778.a: "Дядя Сэм залишається у своєму наметі."

 WORLD.779.t: "[Get_newspaper_header]Переговори між США та Японією завершились"
 WORLD.779.desc: "Після кількох раундів переговорів між Японією та США з питань передачі портів, відновлення торгівлі та нафтового ембарго стало зрозуміло, що не можна досягти всебічної угоди між суперницькими державами. Незважаючи на початкову прихильність до досягнення угоди, їхні інтереси виявилися занадто різними, а спільна основа для договору занадто мізерна.\n\nЯпонія покладала великі надії на економічні аспекти угоди, і її провал став великим ударом по амбіціях і престижу їхнього уряду. У США приниження від того, що іноземна держава займає два важливих порти, тепер, здається, продовжиться на невизначений термін. Також продовжуватиметься висока напруга в Східному Тихому океані, що буде накладати дорогі зобов'язання на армії обох країн."
 WORLD.779.a: "Вітри в Тихому океані дують холодно."

 WORLD.780.t: "[Get_newspaper_header]Підписано договір між США та Японією"
 WORLD.780.desc: "Спільне оголошення сьогодні підтвердило чутки, що з'являлися з ходом саміту США-Японії в Східному Тихому океані. Після кількох довгих тижнів переговорів, країни знайшли достатньо спільної основи для укладання всеохоплюючої угоди. Японія забезпечила доступ до їх дуже бажаного американського нафти, а США забезпечили повернення портів за договором. Угода також означає кінець торгового ембарго між обома країнами та їхніми союзами.\n\nЦі новини були зустрінуті святкуваннями в більшості Сполучених Штатів, де повсякденне життя було зупинено, поки сусідства організовували «портові вечірки» на вулицях. В Японії реакція була менш емоційною, але «великого обурення» через «соромне здавання територій», яке гучно погрожувалося з націоналістичних кіл, поки не вдалося здійснитися."
 WORLD.780.a: "Вітри змінюються в Тихому океані."

 WORLD.781.t: "[Get_newspaper_header]Підписано договір між США та Японією"
 WORLD.781.desc: "Спільне оголошення сьогодні підтвердило чутки, що з'являлися з ходом саміту США-Японії в Східному Тихому океані. Після кількох довгих тижнів переговорів, країни знайшли достатньо спільної основи для укладання всеохоплюючої угоди. Японія забезпечила доступ до їх дуже бажаного американського нафти. США забезпечили повернення портів за договором і Гаваїв. Угода також означає кінець торгового ембарго між обома країнами та їхніми союзами.\n\nЦі новини були зустрінуті святкуваннями в більшості Сполучених Штатів, де повсякденне життя було зупинено, поки сусідства організовували «портові вечірки» на вулицях. В Японії реакція була менш емоційною, але «великого обурення» через «соромне здавання територій», яке гучно погрожувалося з націоналістичних кіл, поки не вдалося здійснитися."
 WORLD.781.a: "Вітри змінюються в Тихому океані."

 WORLD.782.t: "[Get_newspaper_header]Початок уранової кризи"
 WORLD.782.desc.germany: "Ґерманія шукає відповіді сьогодні після успішної спроби саботажу кілька днів тому. Місцева поліція була викликана рано вранці, щоб виявити порушену уранову шахту і шість непритомних працівників. Менш ніж через годину всі шість працівників померли від травм, отриманих під час вибуху. Провідні національні слідчі працюють відтоді, щоб визначити особи саботажників. Нещодавно вони зробили прорив: кожен з винуватців, як стверджується, має зв'язки зі Сполученими Штатами Америки.\n\nВашингтон перебуває в розладі сьогодні вранці, оскільки світова супердержава висуває агресивні звинувачення і вимагає репарацій. Президент Гленн і його уряд активно працюють над вирішенням питання зі супердержавою, а телефонні лінії в Білому домі забиті."
 WORLD.782.desc.japan: "Японія шукає відповіді сьогодні після успішної спроби саботажу кілька днів тому. Місцева поліція була викликана рано вранці, щоб виявити порушену уранову шахту і шість непритомних працівників. Менш ніж через годину всі шість працівників померли від травм, отриманих під час вибуху. Провідні національні слідчі працюють відтоді, щоб визначити особи саботажників. Нещодавно вони зробили прорив: кожен з винуватців, як стверджується, має зв'язки зі Сполученими Штатами Америки.\n\nВашингтон перебуває в розладі сьогодні вранці, оскільки світова супердержава висуває агресивні звинувачення і вимагає репарацій. Президент Гленн і його уряд активно працюють над вирішенням питання зі супердержавою, а телефонні лінії в Білому домі забиті."
 WORLD.782.a: "Розпочалася наступна дипломатична криза."

 WORLD.783.t: "[Get_newspaper_header]Америка відступає"
 WORLD.783.desc: "Кінець поточної дипломатичної кризи нарешті на горизонті, і, ймовірно, настане мир. Відтоді як були зроблені перші звинувачення на адресу Сполучених Штатів, напруження між світовими супердержавами поступово зростало. Кілька годин тому президент Гленн виступив з публічною заявою з Білого дому, де він взяв на себе повну відповідальність за кризу.\n\nСполучені Штати вирішили вийти з конфлікту, а пізніше президент Гленн оголосив, що Америка виплатить вимагають репарації. Цей крок став величезною дипломатичною перемогою для супердержави, і громадяни по всій імперії радіють. Вдома підтримка республікансько-демократів Гленна різко впала, а розділ між американцями став ще більш помітним. Політичні експерти зараз обговорюють, чи зможе Сполучені Штати оговтатися від цього дипломатичного промаху до кінця десятиліття."
 WORLD.783.a: "Американський орел впав з благодаті."

 WORLD.784.t: "[Get_newspaper_header]Дипломатична перемога Америки"
 WORLD.784.desc.germany: "Після багатьох годин обговорень між світовими супердержавами, кінець поточної дипломатичної кризи нарешті на горизонті. Відтоді як були зроблені перші телефонні дзвінки безпосередньо в Білий дім, президент Гленн та його уряд працювали з супердержавами, щоб знайти «найбільш бажане рішення» для кожної з країн, що беруть участь. Таке рішення нарешті стало публічним сьогодні.\n\nПрезидент Гленн з самого початку заперечував усі звинувачення, швидко здобувши підтримку американського населення в своїх зусиллях. Хоча іноземні дипломати сильно наполягали, що Гленн стоїть за саботажем уранових шахт їхніх країн, Ґерманія вирішила відмовитися від подальших звинувачень і вийти з конфлікту.\n\nСполучені Штати здобули вирішальну дипломатичну перемогу. Одразу ж народ країни об'єднався на підтримку президента Джона Гленна; республікансько-демократи отримали величезну підтримку за ніч, тоді як НПП почала розпадатися. Незалежно від особистості, здається, кожен американець мав причину пишатися своєю нацією. Американці закріпили своє місце на вершині світу на найближчі дні."
 WORLD.784.desc.japan: "Після багатьох годин обговорень між світовими супердержавами, кінець поточної дипломатичної кризи нарешті на горизонті. Відтоді як були зроблені перші телефонні дзвінки безпосередньо в Білий дім, президент Гленн та його уряд працювали з супердержавами, щоб знайти «найбільш бажане рішення» для кожної з країн, що беруть участь. Таке рішення нарешті стало публічним сьогодні.\n\nПрезидент Гленн з самого початку заперечував усі звинувачення, швидко здобувши підтримку американського населення в своїх зусиллях. Хоча іноземні дипломати сильно наполягали, що Гленн стоїть за саботажем уранових шахт їхніх країн, Японія вирішила відмовитися від подальших звинувачень і вийти з конфлікту.\n\nСполучені Штати здобули вирішальну дипломатичну перемогу. Одразу ж народ країни об'єднався на підтримку президента Джона Гленна; республікансько-демократи отримали величезну підтримку за ніч, тоді як НПП почала розпадатися. Незалежно від особистості, здається, кожен американець мав причину пишатися своєю нацією. Американці закріпили своє місце на вершині світу на найближчі дні."
 WORLD.784.a: "Президент Гленн це зробив."

 WORLD.785.t: "[Get_newspaper_header]Початок переговорів між США та Японією"
 WORLD.785.desc: "Багато хто відзначив збільшення дипломатичної активності між Японією та США в останні тижні. Сьогодні спекуляції щодо причин цього зростання були розвіяні, оскільки країни оголосили про високий дипломатичний саміт «для вирішення ситуації на Східному Тихоокеанському регіоні». Офіційно заявлені цілі саміту - це для Японії забезпечити доступ до американської нафти, для США забезпечити повернення договірних портів, а також для обох країн разом зі своїми союзами скасувати взаємне ембарго та відновити торгівлю.\n\nВеликі надії вже покладаються на потенційний ефект угоди, як для економік країн, так і для ширшої справи миру на Тихому океані та в світі. Усі погляди будуть прикути до саміту, коли вони спробують знайти спільний шлях в лабіринті конкурентних інтересів."
 WORLD.785.a: "Чи виправдає Тихий океан свою назву?"

 WORLD.790.t: "[Get_newspaper_header]Президент Харт йде у відставку"
 WORLD.790.desc: "Совість Америки залишає свою посаду. Після тривалої та публічної боротьби з раком президент Філіп А. Харт оголосив про свою відставку. У своїй останній промові він пояснив, що більше не відчуває себе здатним продовжувати свою роль як президент і хоче провести свої останні місяці з близькими - подалі від Овального кабінету.\n\nХоча його відставка - друга в історії США після Ніксона - не була несподіванкою, вона безсумнівно залишить великий слід на нинішній адміністрації. Без президента Харта, офіс перейде до його віце-президента, Чепа Моррісона, який пообіцяв продовжити його політику до кінця свого терміну. Президентство Моррісона, ймовірно, буде коротким, але продовжить пам'ять про великого американського лідера."
 WORLD.790.a: "Харт чи Моррісон, вони всі однаково говорять."
 WORLD.790.b: "Крок у правильному напрямку, скорочений."
 WORLD.790.c: "Працювати було його честю - покинути посаду - його обов'язком."
 WORLD.790.d: "Чи можна довіряти нації без її совісті?"
 
 WORLD.791.t: "[Get_newspaper_header]Президент Харт помер"
 WORLD.791.desc: "Після тривалої та важкої боротьби з меланомою президент Філіп А. Харт, «совість Америки», пішов з життя. Люди любили президента за його боротьбу за модернізацію Америки через масові інфраструктурні кампанії в містах, і смерть Харта залишила Америку в траурі, коли чоловіки та жінки по всій країні зупинилися, щоб віддати данину шани зниклому лідеру.\n\nБез Харта президентство переходить до Чепа Моррісона, але здається, що перехід був складним. За словами тих, хто близький до Моррісона, смерть Харта настала несподівано, і Білий дім виявився не готовим до передачі влади. Зі зв'язками Моррісона в кабінеті в хаосі, єдине питання висить у Білому домі - що буде з реформами, за які Харт так боролся?"
 WORLD.791.a: "Немає потреби сумувати - він не був кращим за інших."
 WORLD.791.b: "Що може бути більшою трагедією, ніж те, що чоловік миру зустрів таку смерть?"
 WORLD.791.c: "Ми боролися, щоб бути кращими - ми не можемо зупинятися зараз."
 WORLD.791.d: "Чи можна довіряти нації без її совісті?"
 
 WORLD.794.t: "[Get_newspaper_header]Інавгурація деЛессепса Моррісона"
 WORLD.794.desc: "Через кілька тижнів після того, як Філіп Харт оголосив про свій діагноз раку і намір піти у відставку з посади президента, сьогодні він офіційно залишив свою посаду на користь свого віце-президента деЛессепса Сторті «Чепа» Моррісона. Перехід влади відбувся під час ретельно організованої і телезйомленої церемонії, під час якої виходящий президент Харт покинув Білий дім на борту Marine One, а його наступник був приведений до присяги головним суддею Верховного суду США на сходах Капітолію.\n\nПоки Вашингтон перебуває в смутку, виходячі чиновники вже висловили свої побоювання щодо здатності нової адміністрації Моррісона продовжити спадщину Харта. Потрапивши в офіс з обмеженою національною видимістю, розділеним Конгресом і незадоволеним Кабінетом, спостерігачі очікують, що Моррісону доведеться зіткнутися з серйозними труднощами в його залишковий рік на посаді. Час покаже, чи зможе новий президент відповідати спадщині свого попередника або ж Вашингтон поглине його."
 WORLD.794.a: "Ось тобі, пане Моррісон. Наша нація повертає погляд на тебе."

 WORLD.795.t: "[Get_newspaper_header]Інавгурація деЛессепса Моррісона"
 WORLD.795.desc: "Через кілька тижнів після того, як новина про його діагноз раку витекла в пресу і він став прикутий до ліжка, сьогодні президент Філіп Харт помер в резиденції Білого дому. Хоча його смерть була очікувана, тим не менш, вона стала шоком для багатьох. Багато хто в Білому домі, здається, були не готові, і віце-президент деЛессепс Сторті «Чеп» Моррісон був приведений до присяги більше ніж через годину після смерті в Овальному кабінеті головним суддею без преси.\n\nПоки Вашингтон перебуває в смутку, виходячі чиновники вже висловили свої побоювання щодо здатності нової адміністрації Моррісона продовжити спадщину Харта. Потрапивши в офіс з обмеженою національною видимістю, розділеним Конгресом і незадоволеним Кабінетом, спостерігачі очікують, що Моррісону доведеться зіткнутися з серйозними труднощами в його залишковий рік на посаді. Час покаже, чи зможе новий президент відповідати спадщині свого попередника або ж Вашингтон поглине його."
 WORLD.795.a: "Ось тобі, пане Моррісон. Наша нація повертає погляд на тебе."

 WORLD.797.t: "[Get_newspaper_header]Президент Ніксон оголошений імпічмент"
 WORLD.797.desc: "Після сьогоднішнього голосування в Палаті представників США Річард Ніксон став другим президентом в історії Америки, якому було оголошено імпічмент. Цей розвиток подій є останнім ударом для Ніксона після так званої «Мадагаскарської справи», скандалу, пов'язаного з ймовірним продажем зброї Японії для підтримки їх проти французьких та німецьких сил у Мадагаскарі. Криза вже призвела до відставки Державного секретаря Вільяма Роджерса та інших високопосадовців.\n\nХоча опитування свідчать, що громадська думка різко повернулася проти Ніксона, його доля залишається невизначеною. Лідер Республіканців у Палаті представників Чарльз Халлек закликав до «єдності РДП» проти «полювання на відьом», і незрозуміло, чи зможуть противники Ніксона подолати дві третини більшості, необхідної для осуду та усунення в Сенаті. Усі погляди тепер спрямовані на віце-президента Кеннеді, який, як підозрюють багато хто, буде свідчити на захист адміністрації."
 WORLD.797.a: "Рішення за Судом Камелота."

 WORLD.792.t: "[Get_newspaper_header]Англія занурилась у громадянську війну"
 WORLD.792.d: "Поки громадянська війна в Німеччині та її проксі-конфлікти роздирають Європу, вогонь, здається, поширився і на Англію.\n\nКлод Окінлек, відомий як останній генерал, який здався під час німецького вторгнення, і який провів останні десять років як, здавалося б, гордий член колабораціоністського режиму, оголосив про вільну Англію і виявив себе як раніше таємничого лідера об’єднаної англійської опозиційної групи, Її Величності Найвірнішого Опору (HMMLR). Партизанські бригади з опозиційних осередків, включаючи комуністичний фронт Білла Александера, який раніше в цьому році об'єднався з HMMLR, вже багато чого досягли у боротьбі проти колаборантів. Гарнізон у Корнуоллі вже почав рух углиб Англії, але масштаби цього повстання безпрецедентні, навіть з урахуванням двох великих повстань у минулому."
 WORLD.792.a: "Чи стане Англія нарешті вільною?"
 WORLD.792.b: "До бою!"

 #Italy

 WORLD.900.t: "[Get_newspaper_header]Демократична Християнська Партія перемогла на виборах в Італії"
 WORLD.900.d: "На перших демократичних виборах в Італії з 1920-х років центристська партія, Демократична Християнська Партія (DC), змогла забезпечити більшість місць у парламенті. Колишній університетський професор Альдо Моро був обраний новим прем'єр-міністром країни, обіцяючи забезпечити мирне та процвітаюче майбутнє для демократичної Італії.\n\nКатолик, ліберал і прогресист, Моро вже здобув велику популярність серед італійського населення. Плани DC включають реформування системи освіти, лібералізацію економіки, розширення соціального захисту та ліквідацію залишків фашистських політик. Перемога Моро стала завершальним кроком у процесі демократизації Італії, і прем'єр-міністр отримав привітання від лідерів усіх країн вільного світу."
 WORLD.900.a: "За демократію і мир!"

 WORLD.901.t: "[Get_newspaper_header]Фронт Демократії переміг на виборах в Італії"
 WORLD.901.d: "На перших демократичних виборах в Італії з 1920-х років лівий коаліційний блок, Фронт Демократії (FD), здобув більшість місць у парламенті. Колишній соціялістичний політик у вигнанні П'єтро Ненні був обраний новим прем'єр-міністром країни, обіцяючи відійти від спадщини фашизму та створити нову, вільну і справедливу демократію в Італії. У той час як центристська партія, Демократична Християнська Партія, висловила готовність співпрацювати з новим урядом, правий блок Блоки Націоналі розкритикував Ненні як криптокомуністичного зрадника.\n\nРеформатор і демократичний соціяліст, Ненні зумів створити широку ліву коаліцію з багатьох менших рухів. Плани FD передбачають радикальну реструктуризацію італійської держави, приділяючи особливу увагу допомозі робітничому класу через масштабні соціальні програми, трудові реформи та прогресивне законодавство, спрямоване на створення інклюзивного та справедливого уряду для всіх італійців."
 WORLD.901.a: "Чи помстилися за Маттеотті?"

 WORLD.902.t: "[Get_newspaper_header]Блоки Націоналі перемогли на виборах в Італії"
 WORLD.902.d: "На перших демократичних виборах в Італії з 1920-х років правий коаліційний блок, Блоки Націоналі, здобув більшість місць у парламенті. Колишній журналіст і політик ПНФ Джорджо Альміранте був обраний новим прем'єр-міністром країни, обіцяючи продовжувати роботу над сильною, єдиною та безпечною Італією. Зіткнувшись із сильною опозицією з боку лівого блоку, Фронту Демократії, та холодним прийомом центристської партії Демократична Християнська Партія, Блокам, можливо, доведеться піти на компроміси, щоб зберегти свій уряд.\n\nПрихильник Чіано, Альміранте - дещо загадкова постать, і багато італійців скептично ставляться до його відданості демократії. Багато хто побоюється, що несподівана перемога Блоків Націоналі може сповільнити або навіть повернути назад хід демократизації Італії, зростають побоювання, що фашизм може повернутися лише після того, як його було законодавчо скасовано останнім дуче."
 WORLD.902.a: "Хто б міг це передбачити?"

 WORLD.903.t: "[Get_newspaper_header]Демократична Християнська Партія перемогла на виборах в Італії"
 WORLD.903.d: "Після завершення другого виборчого раунду молодої демократії Італії, Демократична Християнська Партія здобула більшість у парламенті, а Амінторе Фанфані був обраний прем'єр-міністром. У той час як Італія вступає у фазу кризи, спричиненої терактом на Пьяцца Фонтана, Фанфані проводив кампанію, засновану на платформі поміркованості та стабільності, обіцяючи захищати італійську демократію від екстремізму будь-яких кольорів та ідеологій.\n\nНалежачи до прогресивного крила партії, Фанфані є відомим прагматиком із минулим переконаного фашиста та глибокими зв’язками з церквою - тому новий прем’єр-міністр викликає симпатію серед правих, тоді як багато лівих різко критикують Фанфані та його кабінет. Його заклики до єдності та стабільності завоювали прихильність італійців, які сподіваються, що він зможе врятувати молоду демократію від вогнів терору."
 WORLD.903.a: "Чи є ще надія на демократію і мир?"

 WORLD.904.t: "[Get_newspaper_header]Фронт Демократії переміг на виборах в Італії"
 WORLD.904.d: "Після завершення других виборів Італії, Фронт Демократії здобув більшість у парламенті, а Джузеппе Сарагат був обраний прем'єр-міністром. У той час як демократія Італії здається кризовою через теракт на Пьяцца Фонтана, Сарагат проводив кампанію на платформі поміркованості та прогресивності, обіцяючи боротися за захист демократії від екстремізму, особливо з боку фашистських чи пронацистських організацій.\n\nПоміркований представник соціал-демократичного крила FD, Сарагат проводив кампанію за органічний союз лівоцентристів між FD та DC, що дозволило йому завоювати симпатії в усьому політичному спектрі. Борючись за єдиний антифашистський фронт, Сарагат поклявся захищати цінності італійської демократії від усіх, хто їй загрожує, одночасно забезпечуючи, що прогресивність і лібералізм будуть захищені від загрози насильницького екстремізму."
 WORLD.904.a: "Чи зможе соціальна демократія вижити?"

 WORLD.905.t: "[Get_newspaper_header]Блоки Націоналі перемогли на виборах в Італії"
 WORLD.905.d: "Після завершення другого виборчого раунду молодої демократії Італії, Блоки Націоналі здобули більшість у парламенті, а Акілле Лауро був обраний прем'єр-міністром. У той час як Італія вступає у фазу кризи, спричиненої терактом на Пьяцца Фонтана, Лауро проводив кампанію на популістській платформі 'закон і порядок', обіцяючи повернути стабільність в Італію та здолати підривну діяльність будь-якими необхідними засобами.\n\nКолишній член ПНФ, заможний магнат, мер Неаполя і особистий друг Чіано, Лауро є найважливішим представником монархістського крила БН. Як націоналіст-консерватор, Лауро виступає за антикомуністичний фронт, щоб зупинити 'червону загрозу', що викликає схвалення правого крила DC. Однак уряд Лауро досі непопулярний за межами півдня, і багато хто побоюється, що його реакція на страйки та студентські заворушення буде репресивною, а не діалоговою."
 WORLD.905.a: "Чим більше все змінюється, тим більше залишається незмінним."

 WORLD.906.t: "[Get_newspaper_header]Хорватська весна"
 WORLD.906.d: "Королівство Хорватія завжди було одним із найбільш нестабільних протекторатів Італії - що вже говорить багато, враховуючи постійне насильство по всій імперії. Опинившись між ворогами з усіх боків, єдиним можливим кінцем здавалося повне падіння в тиранію чи анархію.\n\nІгноруючи всі очікування світу, сьогодні було проголошено Хорватську Республіку під керівництвом Юрая Крнєвича, відомого демократичного представника та противника радикалів усіх напрямків. Попри попередню ворожнечу, Юрай здобув перемогу не шляхом переговорів із 'великим гнобителем'. Хоча ця угода була погано сприйнята багатьма, загальна громадська думка виглядає сприятливою. Уже новий хорватський уряд розпочав звільнення політичних в'язнів і відкрив переговори з рештою партизанських груп. У світі, де ще панують насильство та терор, чи зможе цей малий острівець світла протриматися?"
 WORLD.906.a: "Мир, принаймні, поки що."

 WORLD.907.t: "[Get_newspaper_header]Усташі захопили владу в Хорватії"
 WORLD.907.d: "Хаос охопив Загреб сьогодні, коли закордонна італійська монархія була повалена терористами-усташами, які проголосили свою Незалежну Державу Хорватію. Очолює цей рух Юре Францетич, чия промова напередодні проголошення держави була пронизана націоналістичною риторикою, засуджуючи 'небажаних осіб', які 'ослабили' батьківщину, і проголошуючи її відродження після італійського гноблення.\n\nВже надійшли повідомлення про злочини проти меншин у цій державі, які викликали побоювання найгіршого. Італія засудила новий режим як 'нелегітимний', і її війська вже помічені на кордоні. Без союзників для новоствореної держави здається, що уряд усташів буде знищений до того, як він зможе утвердитися як незалежна нація."
 WORLD.907.a: "Їх буде судити історія."

 WORLD.908.t: "[Get_newspaper_header]Комуністична революція в Хорватії"
 WORLD.908.d: "Загреб став червоним сьогодні, коли місто нарешті захопили комуністичні повстанці після років партизанської війни. Антифашистська група обрала своїм першим президентом свого командувача Йосипа Броза Тіто. У своїй першій промові Тіто знову наголосив на необхідності боротьби проти фашизму, пообіцявши викорінення колабораціоністських елементів у країні разом із закордонною італійською монархією, що колись ними правила.\n\nНе дивно, що ця молода комуністична держава швидко стала ізгоєм у Європі, де домінує фашизм, і більшість країн відмовляються визнавати її існування, щоб уникнути гніву Італії. Рим уже зробив заяву, засуджуючи усунення монархії, і пообіцяв швидке 'звільнення' колишнього васала для повернення Хорватії до старого статус-кво. Як їхні війська вишиковуються на хорватському кордоні, більшість вважає, що возз’єднана Югославія залишиться лише далекою мрією."
 WORLD.908.a: "Краще жити вільним день, ніж рабом вічність."

 WORLD.909.t: "[Get_newspaper_header]Військовий уряд у Затоці"
 WORLD.909.d: "Поразка Італії у італо-турецькій війні спричинила зростання нестабільності на Близькому Сході, оскільки населення регіону втрачає віру в здатність Італії захистити їх від турецької загрози. Зі зростанням агресивності Туреччини багато хто побоюється, що вона спробує затвердити свою гегемонію над арабським світом. Щоб посилити контроль над регіоном, Рим передав контроль над своїми територіями в Перській затоці військовому уряду на чолі з адміралом Джузеппе Оріана.\n\nДосвідчений командувач флоту Оріана очолює Quarta Divisione Navale, флот Regia Marina, завданням якого є патрулювання затоки. Італія боїться зростаючого впливу саудівської монархії та її союзників, консервативних емірів, які все більше не терплять італійського впливу в регіоні. Рим сподівається, що гармати Regia Marina зможуть утримати регіон під контролем, але це здається все менш ймовірним на тлі зростання протестів місцевого населення."
 WORLD.909.a: "Чи не втрачає римський орел свої пір'я?"
 WORLD.909.b: "Оріана стримає турків!"

 WORLD.910.t: "[Get_newspaper_header]Маттеї очолив контроль у Затоці"
 WORLD.910.d: "Перемога Італії в італо-турецькій війні посилила контроль Італійської імперії над Близьким Сходом. Зі зруйнованими експансіоністськими мріями Туреччини Італія знову підтвердила себе як гегемонічна сила в арабському світі. Після цієї перемоги Енріко Маттеї, голова ENI - італійської нафтової компанії та найбільшої у світі - був призначений губернатором італійських територій у Перській затоці.\n\nПризначення Маттеї ще більше зміцнює контроль ENI над Перською затокою. Компанія відіграла важливу роль у розвитку інфраструктури та нафтової промисловості регіону й має давню історію продуктивної співпраці з правлячими класами арабського світу. ENI є ключовою частиною італійського домінування на Близькому Сході, і під керівництвом Маттеї і Італія, і компанія зможуть розширити свій вплив і доходи."
 WORLD.910.a: "Нафта - це артеріальна кров імперії."

 WORLD.911.t: "[Get_newspaper_header]Конституційний комітет для Єгипту"
 WORLD.911.d: "Після смерті короля Фарука єгипетська монархія увійшла в фазу кризи, оскільки наступник, Фуад II, ще не досяг повноліття. З громадською думкою, остаточно зіпсованою через розгульне життя Фарука, італійський уряд несподівано вирішив запросити основний демократичний і республіканський рух в Єгипті, Національну Демократичну Партію, щоб сформувати конституційний комітет, який спостерігатиме за переходом до республіки.\n\nНайвизначнішою постаттю НДП і комітету є Анвар Садат, колишній соратник Насера, який згодом пом'якшив свої позиції - тепер виступаючи за республіканізм, економічні реформи та багатопартійну демократію в Єгипті. Ця новина була позитивно сприйнята в арабському світі, і багато хто вважає, що Італія намагається створити мережу дружніх режимів у своїй сфері впливу, а не колоніальну імперію."
 WORLD.911.a: "Неочікуваний розвиток подій!"

 WORLD.912.t: "[Get_newspaper_header]Мухаммед Абдель Монейм призначений регентом Єгипту"
 WORLD.912.d: "Після смерті короля Фарука єгипетська монархія увійшла в фазу кризи, оскільки наступник, Фуад II, ще не досяг повноліття. Щоб відновити престиж монархії, зіпсований розгульним життям Фарука, італійський уряд призначив принца Мухаммеда Абделя Монейма регентом Єгипту. Далекий родич покійного короля, Монейм має досвід дипломата та адміністратора королівства й є одним із найвпливовіших членів королівського двору.\n\nЦим кроком італійський уряд оновив свій давно існуючий союз із єгипетською монархією. Вплив Монейма та його довга кар'єра зробили його популярним вибором серед консерваторів і поміркованих, але дехто побоюється, що громадська думка про королівський дім безповоротно зіпсована Фаруком, і багато хто сприймає його як інструмент італійського гноблення. Поки що Єгипет може лише радіти, що ненависний король мертвий, а більш поважний єгиптянин керує країною."
 WORLD.912.a: "Король мертвий, хай живе регент!"

 WORLD.913.t: "[Get_newspaper_header]Адальберто ді Савойя-Генова призначений регентом Єгипту"
 WORLD.913.d: "Після смерті короля Фарука єгипетська монархія увійшла в фазу кризи, оскільки наступник, Фуад II, ще не досяг повноліття. Щоб посилити своє домінування над країною, італійський уряд призначив герцога Адальберто ді Савойя-Генова регентом Єгипту. Принц однієї з гілок італійського королівського дому, Адальберто також є генералом, який командує італійським гарнізоном у Єгипті, і планує використовувати свої повноваження для відновлення порядку будь-якими засобами.\n\nНепопулярний крок, призначення Адальберто має на меті ще більше підкорити Єгипет і закріпити його як васала Італії. Реакції на цю новину були надзвичайно негативними, навіть із боку монархістської та консервативної партії Вафд, яка зазвичай підтримує присутність Італії в Єгипті. Із мобілізацією італійського гарнізону для придушення заворушень багато хто боїться, що Єгипет стане першою жертвою нової італійської хвилі репресій."
 WORLD.913.a: "Чи є межі у італійського імперіалізму?"

 WORLD.914.t: "[Get_newspaper_header]Автономія для Чорногорії"
 WORLD.914.d: "Після періоду інтенсивного повстання та громадянських заворушень італійський уряд домовився з місцевим урядом у Подгориці про розширення регіональної автономії для Чорногорії. Формально незалежна країна, Чорногорія була окупована та частково анексована Італією після Другої світової війни, але запеклі повстання як з боку націоналістичних четницьких загонів, так і комуністичних партизан змусили італійський уряд неохоче визнати Чорногорію незалежним протекторатом.\n\nІталійська імперія є величезною, і, за словами багатьох, надмірно розширеною - і дехто вважає, що це просто перша тріщина, яка починає проявлятися. Проте багато хто вважає, що новий курс чорногорської адміністрації, очолюваної губернатором Крсто Поповичем, не зможе вирішити численні проблеми, які переслідують цю маленьку балканську країну - четницькі загони все ще домінують у гірській місцевості, тоді як партизанські атаки все ще націлені на італійські війська в регіоні. Ще одна італійська інтервенція залишається можливою, але деякі все ж сподіваються на уряд Поповича.\n"
 WORLD.914.a: "Балкани - це прокляття імперій."

 WORLD.915.t: "[Get_newspaper_header]Алжирська війна"
 WORLD.915.d: "За повідомленнями місцевих джерел, у Алжирі розпочалися бойові дії між італійськими та іберійськими військами, і військові сили з обох сторін почали мобілізуватися. Хоча офіційної заяви про війну не зробила жодна з країн, здається, нова війна почалася в алжирських пустелях, і переможці отримають всю країну у свої руки.\n\nФормально все ще контрольований Французькою Державою, Алжир де-факто був поділений між італійськими та іберійськими сферами впливу після Другої світової війни, коли переселенці з обох країн проникли у внутрішні райони країни. Тепер, коли складні мережі союзів між двома суперниками, місцевими організаціями та міліціями pieds-noirs перетворилися у війну, два колишні союзники опинилися в конфлікті через домінування в Західному Середземномор’ї та через величезні нафтові запаси Алжиру.\n"
 WORLD.915.a: "Війна, отже, почалась."
 WORLD.915.b: "Війна, отже, почалась."
 WORLD.915.c: "Сподіваюся, конфлікт не загостриться."

 WORLD.916.t: "[Get_newspaper_header]Незалежність для Алжирської Республіки!"
 WORLD.916.d: "Поки італійські війська святкують низку перемог в Алжирі, здається, що переговори між італійцями та алжирськими місцевими, зокрема Фронтом національного визволення, завершилися успіхом. У місті Бона Ферхат Аббас, голова ФНВ, проголосив народження Республіки Алжир за згодою дуче в Римі. Перетворившись на незалежну державу, яка тісно співпрацює з Італією, Алжир стає ще одним союзником Риму в Середземномор’ї.\n\nХоча іберійські війська відступають до Марокко, нова республіка вже закріплює свою владу - хоча вибори поки не заплановані, Аббас обіцяє повне повернення до демократії та самовизначення для алжирців у майбутньому. Найгостріше питання - ситуація в Алжирі, де є припущення, що нова республіка може спробувати захопити місто, яке все ще контролюється Францією.\n"
 WORLD.916.a: "Це був необхідний захід."
 WORLD.916.b: "Сумний день."
 WORLD.916.c: "Алжир! Алжир! Алжир!"

 WORLD.917.t: "[Get_newspaper_header]Незалежність для алжирського народу!" #UNUSED
 WORLD.917.d: "Поки італійські війська святкують низку перемог в Алжирі, здається, що переговори між італійцями та алжирськими місцевими, зокрема Фронтом національного визволення, закінчилися невдало. Італійці фактично зрадили ФНВ, відмовившись від обіцянок створити незалежну Алжирську Республіку під їхнім керівництвом, замість цього створивши фактично маріонеткову державу, очолювану алжирським політиком Саїдом Буаламом.\n\nБуалам завжди виступав проти незалежності Алжиру, віддаючи перевагу продовженню європейського правління, спочатку під Францією, а тепер під Італією. З урядом Буалама, який є надзвичайно непопулярним серед алжирців, багато хто вважає, що це рішення Риму насправді є частиною плану використати Алжир як розмінну монету для залучення Французької Держави до італійської сфери впливу.\n"
 WORLD.917.a: "Стабільність для Алжиру, нарешті."
 WORLD.917.b: "Сумний день."
 WORLD.917.c: "Чи приймуть алжирці ще одне приниження?"

 WORLD.959.t: "[Get_newspaper_header]Іберія отримала контроль над Алжиром"
 WORLD.959.d: "Формально Алжир перебував під французьким контролем. Проте будь-хто, хто має хоча б базові знання про світову політику, знає, що це вже не так. Поділений між іноземними поселенцями з Іберії та Італії, цей регіон перебував у стані, який найкраще можна описати як анархічний. Однак ситуація готова змінитися після останніх подій.\n\nПісля конфлікту в розподіленій колонії здається, що іберійські поселенці здобули перемогу та відібрали контроль над усією країною у попередніх власників. Нова алжирська держава, очолювана відомим pied-noir Жаном-Клодом Перезом, оголосила, на свою подяку, про передачу території навколо міста Оран Іберійському Союзу.\n\nМіжнародні спостерігачі оцінюють це як рішучу демонстрацію військової потуги Іберії, або, принаймні, як відсутність підготовленості з боку Італії.\n"
 WORLD.959.a: "Покидьки."
 WORLD.959.b: "Наша перемога була неминучою."
 WORLD.959.c: "Що чекає на Алжир?"

 WORLD.919.t: "[Get_newspaper_header]Демократія повертається в Італію!"
 WORLD.919.d: "Сьогодні надійшли несподівані новини з Італії, коли тепер вже колишній дуче Ґалеаццо Чіано оголосив про свою відставку та розпуск Національної фашистської партії (PNF). Ці дії Чіано, хоча й несподівані для непідготовлених, є кульмінацією довгого розпаду фашизму в Італії, що розпочався ще до смерті Муссоліні. Цей розпад безперечно прискорився через Чіано, який прагнув розпустити стару систему, побачивши, що вона лише призведе до руйнування Італії з часом.\n\nХоча в Італії є й ті, хто виступає проти цього, перемога Чіано на Веронській конференції дала йому необхідний мандат для того, щоб ігнорувати і відсунути своїх опонентів, залишивши дуже мало офіційної опозиції його реалізації демократії. Італійці зараз готуються до своїх перших виборів за десятиліття, і вже очевидно, що є велике збудження серед населення щодо цієї перспективи. Як фашизм вмирає там, де він народився, світ з нетерпінням чекає на того, хто стане першим лідером нової Італії...\n"
 WORLD.919.a: "Демократія знову засяяла в Середземномор'ї."

 WORLD.920.t: "[Get_newspaper_header]Італійський Левант розподілений"
 WORLD.920.d: "В хаосі Веронської конференції Італія почала позбуватися однієї з найбільш проблемних спадщин фашистської епохи - надмірно розширеної колоніальної імперії. Після тривалого процесу поступових поступок місцевим організаціям конференція в Єрусалимі завершилася розподілом Італійського Леванту на кілька незалежних націй, включаючи єврейську державу, яка увійшла в економічний союз із іншими країнами та з Італією.\n\nХоча це рішення супроводжувалося суперечками, особливо щодо таких питань, як статус Єрусалима, громадська думка загалом здається прихильною до нього, хоча б на цей момент, оскільки території, раніше під італійським управлінням, тепер є незалежними. Оптимістичні коментатори вважають розподіл першим кроком до справжнього миру в Леванті, але багато хто залишається скептичними, прогнозуючи, що розподіл призведе до подальших конфліктів серед численних етнічних та релігійних груп цього регіону.\n"
 WORLD.920.a: "Чи вистоїть мир?"
 WORLD.920.b: "Наші піддані нарешті вільні."

 WORLD.921.t: "[Get_newspaper_header]Левантинська Конфедерація"
 WORLD.921.d: "Королівство Італія почало позбуватися однієї з найбільш проблемних спадщин фашистської епохи - надмірно розширеної колоніальної імперії. Після довгого процесу поступових поступок місцевим організаціям, конференція в Єрусалимі завершилася створенням нової країни - Левантинської Конфедерації. Складаючись з колишнього губернаторства Леванту, конфедерація є багатокультурною, плюралістичною країною з конфесіональним урядом, розробленим для забезпечення представництва для численних етнічних груп, що проживають на її території.\n\nНезважаючи на те, що це рішення було оточене суперечками, оскільки в країні все ще є кілька груп тиску, які виступають за незалежність, громадська думка в цілому здається позитивною. Оптимістичні коментатори вважають, що конфедерація зможе забезпечити мир у регіоні, але багато хто залишається скептичним і вважає її нестабільним союзом, який неминуче розпадеться через релігійні та етнічні суперечності.\n"
 WORLD.921.a: "Чи зможе цей делікатний баланс бути збережений?"

 WORLD.922.t: "[Get_newspaper_header]Об'єднане Арабське Королівство"
 WORLD.922.d: "Після довгого та складного процесу переговорів, який не зміг знайти компромісне рішення для заплутаної ситуації в Італійському Леванті, конференція в Єрусалимі завершилася офіційною декларацією Об'єднаного Арабського Королівства, новоутвореної країни, яка охоплює всю територію колишніх італійських володінь у регіоні. Абдулла I бін Аль-Хусейн, хашимітський емір Трансйорданії, був обраний королем.\n\nРішення передати контроль Абдуллі не було раптовим - емір співпрацював з Італією в обмін на автономію для свого емірату і швидко став одним з головних лідерів арабів у країні. Обіцяючи правити згідно з секулярними та конституційними принципами, дозволяючи автономію та свободу всім етнічним групам Леванту, Абдулла все ще надзвичайно непопулярний серед євреїв Палестини, і багато з них вже, ймовірно, організовуються для опору його правлінню.\n"
 WORLD.922.a: "Чи зможуть араби та євреї колись порозумітися?"
 WORLD.922.b: "Їм було краще під нашим керівництвом."

 WORLD.923.t: "[Get_newspaper_header]Держава Ізраїль"
 WORLD.923.d: "Після довгих та складних переговорів, які не змогли знайти рішення для заплутаної ситуації в Італійському Леванті, та зростання арабського насильства й повстань у регіоні, конференція в Єрусалимі була закрита, і італійський уряд передав владу в регіоні Єврейському Руху Опору, коаліції різних сіоністських фракцій та міліцій.\n\nСпровокований величезним підйомом арабської боротьби і повстань, Єврейський Рух Опору є непостійним альянсом єврейських організацій, що очолюється військовою хунтою командувачів Хагани та Іргуна. Прийнявши владу, вони пообіцяли використати всю потужність своїх військових сил для підтримки стабільності і миру в регіоні як союзники Італії, але різко сіоністська орієнтація їх лідерів і негайна реакція арабських сил можуть привести до швидкої загибелі новоствореної Держави Ізраїль.\n"
 WORLD.923.a: "Чи зможуть євреї та араби колись порозумітися?"
 WORLD.923.b: "Їм було краще під нашим керівництвом."

 WORLD.924.t: "[Get_newspaper_header]Комуністична революція в Леванті!"
 WORLD.924.d: "Після катастрофічної поразки Італії у збереженні стабільності в регіоні, італійське правління в Леванті розпалося, змусивши італійські війська відступити з регіону після великих втрат в боротьбі з місцевими повстанцями. У вакуумі влади Харакіїни на чолі з Джорджем Хабашем захопили контроль над регіоном, проголосивши Демократичну Республіку Палестина.\n\nШирокий фронт кількох комуністичних, соціялістичних та інших лівих рухів, Харакіїни користуються великою підтримкою серед арабів, які рішуче виступають проти італійського імперіалізму. Однак новостворена демократична республіка виглядає в кращому випадку нестабільною, оскільки між численними партизанськими групами, бойовими організаціями та рухами немає єдності, і сіоністська опозиція до комуністичного уряду вже починає спалахувати в районах з переважно єврейським населенням.\n"
 WORLD.924.a: "Революція в Святій Землі?"
 WORLD.924.b: "Нашу імперію розвалюється!"

 WORLD.925.t: "[Get_newspaper_header]Переворот Іргуна в Леванті!"
 WORLD.925.d: "Після катастрофічної поразки Італії у збереженні стабільності в регіоні, італійське правління в Леванті розпалося, змусивши італійські війська відступити з регіону після великих втрат у боротьбі з місцевими повстанцями. У вакуумі влади сіоністська націоналістична міліція, відома як Іргун, на чолі з Менахемом Бегіним, захопила контроль над регіоном, проголосивши Державу Ізраїль.\n\nОдна з найбільш впливових сіоністських організацій у регіоні, Іргун багато років насильно добивається створення єврейської держави, але лише нещодавно вони змогли зібрати достатньо підтримки серед євреїв регіону для захоплення влади. Здобувши перемогу завдяки поділам і боротьбі всередині арабського табору, Іргун тепер контролює величезний регіон, населених арабами, які рішуче виступають проти єврейського правління. Новостворена ізраїльська держава є урядом меншості, і вже надходять численні повідомлення про систематичну дискримінацію арабів та інших етнічних груп.\n"
 WORLD.925.a: "Євреї знайшли свій Сіон, але якою ціною?"
 WORLD.925.b: "Велика поразка для нашого впливу на Близькому Сході."

 WORLD.926.t: "[Get_newspaper_header]Захоплення PLF-GC в Леванті!"
 WORLD.926.d: "Після катастрофічної поразки Італії від Туреччини та вбивства губернатора Далла Чієзи, соціальний порядок в Леванті почав розпадатися - італійські спроби відновити порядок завершилися повторними кровопролиттями з великими втратами. Здається, що Італія втратила контроль над усім регіоном, який тепер контролює організація, відома як Фронт визволення Палестини - Генеральне командування (PLF-GC), що проголосила Палестинську Арабську Державу.\n\nНа чолі PLF-GC стоїть Ахмед Джибріль, одна з найбільш радикальних і насильницьких міліцій, які виступають проти італійської та сіоністської окупації Леванту. Численні акти насильства, вчинені італійськими силами, змусили багатьох арабів підтримати PLF-GC і її націоналістичну та насильницьку риторику, яка закликає до створення арабської держави, що існуватиме виключно для арабів в Леванті. Повідомлення про насильство проти євреїв множаться, а маси біженців у відчаї намагаються втекти з регіону.\n"
 WORLD.926.a: "Кров'ю ми годуємо нашу землю."
 WORLD.926.b: "Турецька інвазія стала катастрофою."

 WORLD.927.t: "[Get_newspaper_header]Захоплення Лехі в Леванті!"
 WORLD.927.d: "Після катастрофічної поразки Італії від Туреччини та вбивства губернатора Далла Чієзи, соціальний порядок в Леванті почав розпадатися - італійські спроби відновити порядок завершилися повторними кровопролиттями з великими втратами. Здається, що Італія де-факто втратила контроль над усією територією, і тепер Левант знаходиться під контролем організації, відомої як Лехі, яка проголосила Королівство Ізраїль.\n\nНа чолі Лехі стоїть Авраам Штерн, що підтримує фашистську ідеологію, і завжди був найбільш радикальним та насильницьким сіоністським угрупованням, що діяло в Леванті - раніше це була маргінальна група, але її підтримка серед євреїв регіону різко зросла через жорстокі і криваві репресії італійців проти єврейського населення. Скориставшись поділами серед арабів, Лехі змогло встановити контроль над усім Левантом і тепер готується реалізувати свою візію єврейської держави, населеної лише євреями - повідомлення про насильство та депортацію множаться, оскільки арабські біженці тікають з Леванту до сусідніх держав.\n"
 WORLD.927.a: "Той, хто проливає кров людську, кров його проллється."
 WORLD.927.b: "Usevivenu eimah vetzalmavet."
 WORLD.927.c: "Турецька інвазія стала катастрофою."

 WORLD.928.t: "[Get_newspaper_header]Незалежність Об'єднаних Арабських Еміратів!"
 WORLD.928.d: "Коли вітер змін надуває вітрила Італійської Імперії, він приносить з собою дивний сплав реакції та революції. В деяких місцях відступ нової Риму привів до повернення старого порядку, в інших - він викликав нових людей з новими ідеями, як на добре, так і на зло. Ніде це не проявляється так яскраво, як на Перській затоці, де Італійське губернаторство затоки отримало незалежність у вигляді Об'єднаних Арабських Еміратів.\n\nКоли Близький Схід охоплює нова хвиля нестабільності, Італія вирішила надати незалежність своїм важливим територіям на Перській затоці, надавши автономію місцевим еміратам, об'єднаним в федерацію, очолювану правителем Абу-Дабі, Заєдом бін Султаном Аль-Нахьяном. Давній союзник Італії, Заяд є відомим реформатором та централізатором, обіцяючи продовжувати розвиток економіки та індустрії молодої нації, дозволяючи деякі демократичні реформи, при цьому зберігаючи тісні зв'язки з Італією та її сферою.\n"
 WORLD.928.a: "Нехай його правління буде трансформаційним і стабілізуючим."

 WORLD.929.t: "[Get_newspaper_header]Незалежність Ліги Арабських Шейхств!"
 WORLD.929.d: "Коли вітер змін надуває вітрила Італійської Імперії, він приносить з собою дивний сплав реакції та революції. В деяких місцях відступ нової Риму привів до повернення старого порядку, в інших - він викликав нових людей з новими ідеями, як на добре, так і на зло. Ніде це не проявляється так яскраво, як на Перській затоці, де Італійське губернаторство отримало незалежність у вигляді Ліги Арабських Шейхств.\n\nПроцес здобуття незалежності для країн Перської затоки був довгим і складним, з підвищенням напруженості між місцевими емірами, італійським гарнізоном Регія-Марина в регіоні та величезною іммігрантською популяцією. Тепер Шахбут бін Султан Аль-Нах'ян, сильно консервативний і відкрито про-саудівський правитель Абу-Дабі, став лідером молодої нації і вже почав звертатися до Ер-Ріяду.\n"
 WORLD.929.a: "Саудівська монархія здобула ще одного потужного союзника."

 WORLD.930.t: "[Get_newspaper_header]Битва за Італію"
 WORLD.930.d: "Після колапсу Тріумвірату Італія залишилася з дуже малою кількістю союзників, незважаючи на своє центральне розташування в Середземномор'ї. Здебільшого Італія залишалася на самоті, і здавалося, що так буде надовго. Однак як ОВН, так і Ко-просперитетна сфера нещодавно почали робити спроби наблизити Італію до своїх сфер впливу. Усвідомлення того, що суперник намагається залучити Італію, тільки змусило ці дві держави більше прагнути здобути її підтримку.\n\nМіжнародні експерти з відносин погоджуються, що Італія є великим призом, адже її контроль над великою частиною світових поставок нафти в поєднанні з контролем над Суецьким каналом дає будь-якому з альянсів потужний плацдарм у Середземному морі. Звісно, німці з роздратуванням спостерігають за цими переговорами, оскільки це дасть одному з великих світових блоків прямий кордон з самим Райхом."
 WORLD.930.a: "Чи може Італія стати вирішальним фактором у Холодній війні?"

 WORLD.931.t: "[Get_newspaper_header]Італія приєднується до ОВН"
 WORLD.931.d: "На прес-конференції прем'єр-міністр Королівства Італія оголосив нації та світу, що Італія почала процес приєднання до Організації Вільних Націй, альянсу та оборонного договору, очолюваного Сполученими Штатами Америки. Хоча зв'язки між двома країнами існували ще з 1950-х років, коли США позитивно ставилися до відриву Чіано від Німеччини, Італія нарешті звернулася до Америки як способу протидіяти нацистському впливу в Європі.\n\nПриєднання Італії до ОВН було зустрінуте як велика перемога вільного світу та остаточний крок до того, щоб Італія стала бастіоном демократії та свободи у Старому Світі. У Римі разом майорять прапори США та Італії, але деякі занепокоєні зростанням напруженості, яку це викличе, особливо щодо спроб Японії розширити свій вплив в Індійському океані та на Близькому Сході, а також постійно зростаючими планами Німеччини щодо європейського домінування."
 WORLD.931.a: "Світ свободи тільки що став більшим!"

 WORLD.932.t: "[Get_newspaper_header]Італія приєднується до Ко-просперитетної сфери"
 WORLD.932.d: "На прес-конференції прем'єр-міністр Королівства Італія оголосив нації та світу, що Італія офіційно почала процес приєднання до Ко-просперитетної сфери, альянсу та оборонного договору, очолюваного Японською імперією. Хоча зв'язки між двома країнами існували з кінця Другої світової війни, коли обидві країни стали чужими для своїх колишніх союзників-німців, Італія нарешті звернулася до Японії як способу зміцнити їх спільну гегемонію над Індійським океаном.\n\nПриєднання Італії до Сфери було зустрінуте як остаточний крок до перетворення Сфери на по-справжньому глобальний блок та логічне завершення старої дружби між двома колишніми державами Осьового блоку. Як японські, так і італійські прапори майорять у Римі на святкуванні, однак деякі турбуються про зростаючу напруженість, яку це викличе, зокрема щодо спроб ОВН розширити свій вплив в Індійському океані та на Близькому Сході, а також щодо постійно зростаючих планів Німеччини щодо європейського домінування."
 WORLD.932.a: "Завжди можна покластися на старого друга."

 WORLD.933.t: "[Get_newspaper_header]До незалежності Єгипту?"
 WORLD.933.d: "Ситуація в Єгипті, здається, дещо заспокоїлася після хаотичного періоду після смерті короля Фарука, і розпочалися переговори між італійським урядом і новим єгипетським урядом про початок процесу повернення влади місцевим правителям. Хоча Єгипет став де-факто італійським губернаторством за часів правління Фарука, підвищення ефективності та популярності уряду після Фарука переконало Рим розпочати процес відновлення повної незалежності для північноафриканської країни.\n\nІталійський представник в Єгипті, маршал Італо Бальбо, був призначений для нагляду за цим процесом, який ймовірно завершиться незалежним Єгиптом, але все ще тісно пов'язаним зі сферою впливу Італії. Попри загальну підтримку незалежності, народ Єгипту, здається, в основному скептично ставиться до спроб їхнього уряду домовитися про свободу від італійського ярма."
 WORLD.933.a: "Єгипет може нарешті стати вільним."

 WORLD.934.t: "[Get_newspaper_header]Громадянська війна в Ємені!"
 WORLD.934.d: "Після тривалого періоду нестабільності в Ємені, громадянська війна нарешті вибухнула, і повстанці, що оголосили себе Єменською Демократичною Арабською Республікою, підняли зброю проти монархії. Італія та Саудити, здається, знайшли спільну мову в королі аль-Бадрі, який з радістю прийняв підтримку обох груп. Водночас, намагаючись представити себе реформістом і зберігаючи союз із саудівською монархією, аль-Бадр добре грає свої карти.\n\nАбдулла аль-Салал, з іншого боку, має підтримку великої частини військових, будучи колишнім генералом королівської гвардії аль-Бадра. Незадоволений монархією, він має намір створити республіканський та соціялістичний Ємен за підтримки численних панарабістських рухів, включаючи баатистів, прихильників Насера та комуністів."
 WORLD.934.a: "Нестабільність на Близькому Сході? Як дивно."

 WORLD.935.t: "[Get_newspaper_header]Порядок руйнується в Єгипті!"
 WORLD.935.d: "Ймовірно, під впливом подій у Ємені, лідер Руху вільних офіцерів, Гамаль Абдель Насер, захопив велику частину країни після невдалого перевороту проти монархії. Після невдалого перевороту та наступного повстання, Мусульманське братство, група ісламських радикалів на чолі з Саїдом Кутбом, також спробувало і не змогло захопити владу, і тепер веде боротьбу одночасно з монархією та насеристами.\n\nМусульманське братство, ймовірно, фінансується та озброюється Саудитами, незважаючи на офіційну відмову Ер-Ріяда. Це створює ще більшу проблему у конфлікті, оскільки це означає загострення напруженості між Італією та Саудівською Аравією."
 WORLD.935.a: "Чи це початок чогось більшого?"

 WORLD.936.t: "[Get_newspaper_header]Коррентія здобуває перемогу!"
 WORLD.936.d: "У результаті конфліктів, які розорили Ріг Африки, Республіка Коррентія, держава-порушник, заснована італійськими поселенцями під час колапсу італійського уряду, змогла забезпечити весь Східний Африканський регіон для себе. Відкрито виступаючи за біле правління на Темному континенті, Коррентія створила себе як фашистську, біло-націоналістичну державу, обіцяючи забезпечити захист білих поселенців і продовження європейської місії цивілізувати Африку, незалежно від вартості.\n\nНомінально очолювана колишнім найманцем Тулліо Монетою, Коррентія контролюється групою індустріалістів, фінансистів і колишніх фашистських адміністраторів, які виступали проти Амедео, а також іншими залишками старого фашистського порядку Східної Африки, які хочуть продовжити італійську експлуатацію Рогу Африки. З сильним опором з боку африканців до Коррентії, важко сказати, як довго це жорстоке правління протримається, але перемога Коррентії, навіть якщо вона тимчасова, означає повну поразку всіх проектів Італії щодо відновлення миру в регіоні."
 WORLD.936.a: "Що нам до слави? Що нам до тебе?"

 WORLD.937.t: "[Get_newspaper_header]Спалахує нафтовий криза!"
 WORLD.937.d: "Після початку кількох конфліктів на Близькому Сході та смерті голови компанії Енріко Маттеї, акції ENI, найбільшої італійської нафтової компанії, впали різко. Через роль Італії як важливого гравця в світовій торгівлі, паніка поширилася хвилями по глобальних ринках, і ціна на нафту різко зросла. Нафта відіграє важливу роль у глобальному конфлікті між Німеччиною, Японією та Америкою, оскільки є найціннішим ресурсом для транспорту та війни.\n\nЗ початком конфлікту, і з необхідністю нафти, великі світові держави знову звертають увагу на цей регіон, що перебуває в постійних конфліктах, прагнучи підтримати ті чи інші фракції, нації чи лідерів, які дозволяють отримати економічні плацдарми. Здається, що нове поле бою з'явилося на світовій арені, яке змінить геополітику Близького Сходу назавжди."
 WORLD.937.a: "Нічого доброго з цього не вийде."

 WORLD.938.t: "[Get_newspaper_header]Хорватія та Сербія об'єднуються!"
 WORLD.938.d: "У найновішій зміні території, Хорватія під проводом Тіто та серби об'єдналися в одну націю знову, що не відбувалося з часу руйнування югославської держави під час Другої світової війни. Хоча ця нова багатонаціональна комуністична держава сформувалася, вона також створила значний вплив на регіон, особливо в Італії. Італія, чий вплив сильно поширюється на Балканський півострів, стикається не тільки з державою, чия територіальна амбіція прямо суперечить володінням Італії, а й з державою, яка рішуче протистоїть фашизму, бажаючи знищити його будь-де, де б він не був знайдений.\n\nНевідомо, чи намагатиметься Італія знову знищити югославів, чи буде Тіто слідувати цим амбіціям. Зі зменшенням контролю Італії над її імперією, поразка на материку - це, ймовірно, те, чого вона не може собі дозволити."
 WORLD.938.a: "Конфлікт знову назріває на Балканах."

 WORLD.939.t: "[Get_newspaper_header]Сербія та Чорногорія об'єднуються!"
 WORLD.939.d: "З перемогою Четників у Сербії, їх пансербські амбіції природно орієнтуються на Чорногорію. Колишнє адріатичне узбережжя, що стало територією, безпосередньо підконтрольною італійській імперії, стає важливим пунктом кризи, оскільки комуністи, націоналісти та інші незадоволені групи борються між собою. Деякі сприйняли це як більше тягар для імперії, ніж вигоду. З бажанням не втратити контроль над своєю імперією, одночасно розширюючи свою сферу впливу та зменшуючи ці проблеми, Італія передала територію Сербії, розширюючи її сферу впливу. Це може стати тим угодою, яку Рим справді потребував."
 WORLD.939.a: "Угода, яка дійсно вигідна обом націям."

 WORLD.940.t: "[Get_newspaper_header]Комуністи повстають на Південному заході!"
 WORLD.940.d: "Сьогодні сталося ще більше хаосу, оскільки робітники-іммігранти з Південної Азії та інші незадоволені працівники в рамках Всебухтівської Торгової Спілки Перської затоки повстали проти уряду. Очолювані індо-еміратським організатором Гурудасом Дасгуптою, вони мають намір створити соціялістичну республіку та покласти край жорстокому поводженню з робітниками. Оскільки революція має комуністичний характер, невідомо, чи отримають вони підтримку від італійців чи саудитів, або чи буде сама повстання приречена на поразку. Яким би не був результат, порядок колонії буде зміщено назавжди."
 WORLD.940.a: "Революція набирає обертів у найбільш несподіваних місцях."

 WORLD.941.t: "[Get_newspaper_header]Маттеї скинуто арабськими адміністраторами!"
 WORLD.941.d: "З огляду на хаотичні події в Італії, італійський губернатор Перської затоки Енріко Маттеї змушений був покладатися на місцевих арабських адміністраторів для утримання колонії разом та уникнення хаосу, який охопив інші країни. Однак здається, що цей план місцевого управління закінчився його загибеллю, оскільки адміністратори, на чолі з Абдулем Рахманом Аль-Бакіром та його таємним Національним союзним комітетом, скинули його та проголосили Об'єднану Республіку Арабської Затоки. Оскільки це важлива колонія, особливо через її багаті на нафту ресурси, це матиме великий вплив на вже ослаблену імперію Італії, яка продовжує втрачати контроль над Близьким Сходом."
 WORLD.941.a: "Іронічно, він міг би врятувати націю від загибелі, але не свою адміністрацію."

 WORLD.942.t: "[Get_newspaper_header]Реколонізація Східної Африки"
 WORLD.942.d: "З падінням порядку в Італійській Східній Африці та приходом до влади Карло Скорці, жорстокий фашист розпочав кампанію з реколонізації рогу. Твердо вірячи в силу Італійської імперії, він пообіцяв відновити порядок у регіоні та забезпечити продовження домінування Риму в Східній Африці. Чи зможе він досягти обіцяного порядку та стабільності - питання зовсім інше, і це ще потрібно побачити."
 WORLD.942.a: "Старі звички важко забути."

 WORLD.943.t: "[Get_newspaper_header]Черуллі призначено Генерал-губернатором Італійської Східної Африки"
 WORLD.943.d: "Зі смертю віце-короля Східної Африки, Амедео ді Савоя-Аоста, Італія почала шукати гідну заміну. Здається, що голоси на користь стабільності та консерватизму перемогли голоси реформаторів, і Енріко Черуллі, колишній губернатор Харара, був призначений на цю важливу посаду.\n\nЧеруллі представляє продовження основної природи Італійської Східної Африки, як це було при лідерстві Амедео, з постійним прагненням до колонізації та стабілізації регіону та дещо м'яким підходом до колонізованих народів імперії. Колонії можуть чекати важкі дні попереду, оскільки ніколи не зовсім вигнані етіопські націоналістичні повстанці продовжують свої партизанські дії з глибин гір, а також є чутки, що кілька італійських колоністів і поселенців стають все більш нетерпимими до м'якої політики Аддіс-Абеби щодо місцевих."
 WORLD.943.a: "Тримати курс."

 WORLD.944.t: "[Get_newspaper_header]Гюйєт призначений Генерал-губернатором Італійської Східної Африки"
 WORLD.944.d: "Після смерті віце-короля Східної Африки, Амедео ді Савоя-Аоста, Італія почала активно шукати гідного наступника. Здається, що голоси, що виступали за реформи, перемогли тих, хто підтримував статус-кво, оскільки Амедео Гюйєт, герой війни та рішучий реформатор, був призначений на цю важливу посаду.\n\nГюйєт, італійський національний герой у Східній Африці, здобув прізвисько «Командувач Диявол» за свої відважні дії під час Другої світової війни, а потім почав відкрито виступати за збільшення автономії для корінних народів, розширення прав для всіх народів регіону і навіть більш радикальні реформи. Здається, що Гюйєт намагається направити Італійську Східну Африку в зовсім новому напрямку, але жорстка опозиція його проектам виходить від італійських поселенців і колоністів, які досі вірні фашистським ідеям італійської переваги."
 WORLD.944.a: "Новий напрямок."

 WORLD.945.t: "[Get_newspaper_header]Хаос на Розі Африки!"
 WORLD.945.d: "Дивно, як буря може бути на горизонті днями, навіть тижнями, наближаючись і ставши все більш грізною, але все одно застаючи моряків так непідготовленими. Адже іноді хмари - це просто хмари, шквал - це лише тимчасові неприємності. Сьогодні буря досягла Італійської Східної Африки. Кілька повстанських груп охопили міста та села, відвойовуючи одну милю за одною, тоді як італійські війська ледь встигають налаштовувати оборонні периметри і часто потрапляють в оточення більш мобільними партизанами.\n\nЄ більше фракцій, ніж будь-хто може порахувати, всі вони так само ворожі одна одній, як і до своїх номінальних італійських владарів. Це включає етнічні групи, політичні партії, племена, полководців, колоніальних залишків, навіть незадоволених італійських поселенців. Неможливо передбачити, коли буря вщухне, але наразі вся Східна Африка захоплена її хвилею."
 WORLD.945.a: "Один вогонь бореться з іншим, одна цвях - з іншим."

 WORLD.946.t: "[Get_newspaper_header]Гюйєт відновлює італійське правління в Східній Африці"
 WORLD.946.d: "Серед великої різноманітності фракцій і ідеологій, які жорстоко борються за домінування в Східній Африці, мало хто очікував, що переможцем стане Амедео Гюйєт. Як сила поміркованості та лібералізації в війні, де цих рис бракувало, Гюйєт звернувся до поселенців і корінних народів із закликами до взаємної толерантності та співпраці. Хоча його погляди можна вважати похвальними, вони не були добре сприйняті багатьма італійцями, які вважали їх нічим іншим, як зрадою, або більшістю африканців, які прагнули національного визволення після десятиліть гноблення. Але всупереч усім труднощам, Гюйєт переміг, і наразі він виявився несподівано лояльним до багатьох партій, які виступали проти нього.\n\nУ той час як Гюйєт продовжує домагатися поступової деколонізації та створення незалежних націй, дружніх до Італії, його керівники в Римі дуже амбівалентні щодо цієї ідеї. Однак людина, яка відмовилася йти на компроміс зі своїми принципами перед насильством і смертю, навряд чи поступиться бюрократії."
 WORLD.946.a: "Командувач Диявол виграв ще одну битву."

 WORLD.947.t: "[Get_newspaper_header]Ірак занурюється в громадянську війну!"
 WORLD.947.d: "Ще один приклад вражаючого підйому нестабільності на Близькому Сході - здається, що Ірак, давній союзник Італії в регіоні, впав у громадянську війну. Уряд країни стабільно слабшав після вбивства президента Абда аль-Каріма Касіма.\n\nДивно, що хоча іракське крило панарабської партії Баас очолює повстання проти італійського уряду, позиція решти партій Іраку залишається неясною. Дехто, особливо ті, хто був пригнічений адміністрацією Касіма, підняли зброю у спробі створити свій власний Ірак. Інші залишаються офіційно нейтральними на даний момент, навіть попри тихі переговори з італійськими представниками. Хто б не переміг у цьому новому раунді конфлікту, ймовірно, це не буде народ Іраку. Уже зараз повідомляються про важкі втрати, оскільки всі сторони швидко мобілізуються."
 WORLD.947.a: "Не зробили ми ще достатньо цього?"

 WORLD.948.t: "[Get_newspaper_header]Повстання в Омані!"
 WORLD.948.d: "Схоже, хвиля нестабільності, що охопила Близький Схід, далеко не закінчена, оскільки Оман стає останньою країною, що занурилася у громадянську війну. Хоча надійна інформація важко доступна, здається, що хаос розпочався, коли Кабус здійснив переворот проти свого батька, колишнього султана Сайїда, за допомогою місцевого італійського гарнізону. Тим часом релігійні традиціоналісти та племінні елементи зібралися навколо Омана іма́ма Галіба Альхінаї в негостинному регіоні Джебель Ахдар - з силою віри та підтримкою Саудівської Аравії, вони сподіваються відновити теократичне правління в країні.\n\nІнше повстання відбулося в західних пустелях Дхофара, де велика коаліція панарабістів, комуністів і баасистів під проводом партизанського лідера Лейли Фахкро піднялася, сподіваючись перетворити Оман на фортецю панарабізму в Південній Аравії. Оскільки три сторони здаються досить рівними, важко передбачити, що чекає султанат."
 WORLD.948.a: "Ще одне?"

 WORLD.949.t: "[Get_newspaper_header]Італія набуває ядерної зброї!"
 WORLD.949.d: "Уряд Італії оголосив сьогодні, що успішно провів випробування атомної бомби цього тижня в Сахарі. Більше того, італійці використали це повідомлення, щоб оголосити про розширення своєї ядерної програми. Новина шокувала весь світ, оскільки Італія, здається, була далека від того, щоб здобути ядерну зброю.\n\nСтатус Італії як ядерної держави змінить зовнішні відносини з рештою світу. Колишні друзі Італії в Тріумвіраті повинні тепер обережно ставитись до своїх колишніх союзників, а Америка і Японія тепер найімовірніше розглядатимуть італійців як рівних. Однак мовчазний слон у кімнаті - це Ґерманський Райх. Два союзники завжди мали холодні відносини, але тепер, коли італійці мають атомну бомбу, зрозуміло, що німецько-італійські відносини стануть ще напруженішими, ніж раніше. Здається, що Холодна війна тільки загострюється..."
 WORLD.949.a: "І годинник наближається до півночі."

 WORLD.950.t: "[Get_newspaper_header]Ґерманія оголосила війну Італії!"
 WORLD.950.d: "Поки світ все ще відходить від шоку нафтової кризи, досягли ще більш тривожні новини - фюрер Герман Ґьорінґ оголосив війну Італії, використовуючи прикордонний інцидент як привід для агресії. Ґерманські війська розпочали масштабний наступ на італійський кордон та на території, що перебувають під італійським впливом, і вже велися запеклі бої вздовж усієї лінії фронту. Хоча німецький наступ не був несподіваним, тому італійські оборонці вже були на високій готовності, поки неясно, чи зможе Італія витримати наступ потужної німецької війської машини.\n\nКоли два основні європейські члени осі повертаються один проти одного, доля Європи висить на волосині. Ґерманія має намір знищити свого основного конкурента за контроль над континентом, поки той знаходиться на своїй найслабшій позиції, одночасно захоплюючи великі нафтові запаси Італійської імперії. Оскільки у кожної зі сторін є свої переваги та недоліки, передбачити результат цієї війни неможливо, але, безсумнівно, перемога над Італією завершить проекти фюрера з європейської домінації, тоді як поразка стане загрозою для Ґьорінґа та його імперії."
 WORLD.950.a: "Чи коли-небудь закінчиться ця кровопролитна війна?"

 WORLD.951.t: "[Get_newspaper_header]Італія капітулює перед Німеччиною!"
 WORLD.951.d: "Несподіваний поворот подій - німецька кампанія завоювання Італії завершилася тріумфом. Хоча партизанська та опірна діяльність ще триває в горах, італійський уряд був змушений офіційно капітулювати після того, як його збройні сили були знищені німецькою військовою машиною. Коли панцири вриваються в Рим, італійський уряд був повалений невеликою групою про-німецьких фашистських радикалів, які оголосили створення Італійської Соціялістичної Республіки.\n\nТеоретично незалежний уряд, соціялістична республіка є де-факто маріонетковою державою Німеччини, яку очолює один з найбільш сумнозвісних про-німецьких лакеїв - Роберто Фаріначчі. Дозволяючи і підтримуючи німецьку окупацію країни, уряд Фаріначчі очевидно існує лише завдяки німецьким чоботам, що топчуть італійську землю, і новопризначений дуче вже оголосив відновлення "вічної дружби та братерства" між Італією та Німеччиною. Ще одна країна впала під натиском армій Ґьорінґа, і тепер правління фюрера поширюється на всю Європу. Світ може тільки молитися, що цього буде достатньо для задоволення його амбіцій..."
 WORLD.951.a: "Римський орел впав."

 WORLD.952.t: "[Get_newspaper_header]Італійська Соціялістична Республіка"
 WORLD.952.d: "Несподівані новини досягли вух світу з Італії - коли країна вступила в довгу фазу політичної нестабільності після інавгурації Скорци як дуче, ніхто не міг передбачити, що суперечка між колишнім секретарем ПНФ і королем Умберто досягне таких високих рівнів. Цього ранку озброєні чорні сорочки захопили резиденцію короля, взявши його та королівську родину в заручники, в той час як дуче проголосив народження Італійської Соціялістичної Республіки - республіканської держави, близької до ідеалів оригінальних фашистів.\n\nЗа деякими даними, вже були обмежені зіткнення між військами Регіо Есерсіто та підрозділами МВСН, лояльними до Скорци, і підрозділами, що підтримують монархію, оскільки новий республіканський уряд наказав арештувати численних офіцерів і роззброїти підрозділи. Ситуація в країні заплутана і швидко змінюється, але здається, що дуче наближається до остаточного захоплення країни, і проголошення республіки є ще одним кроком у його планах."
 WORLD.952.a: "Ея ея алала!"

 WORLD.953.t: "[Get_newspaper_header]Терористичний акт в Італії!"
 WORLD.953.d: "Сьогодні італійська нація прокинулася від трагічної новини. Бомба, що вибухнула в банку на площі Фонтана в Мілані, вбила сімнадцять осіб і поранила кілька десятків. Хоча це не перший терористичний акт, що стався в країні після її повернення до демократії, цей став найбільш смертоносним, і без сумніву, найбільш шокуючим для громадськості, оскільки він стався в серці другого за величиною міста Італії.\n\nХоча уряд пообіцяв швидке розслідування, яке призведе до того, що терористи постануть перед судом, справжні мотиви та винуватці теракту досі залишаються в таємниці, проте найбільш ймовірними винуватцями є банда радикальних анархістів з Мілана. Цей випадок лише сприяв жорстоким політичним зіткненням, що відбуваються щодня на вулицях Італії між страйкуючими робітниками, поліцією, студентськими групами та навіть неофашистськими організаціями - багато хто втрачає надію на нову демократію Італії, і деякі припускають, що це лише початок довгого періоду насильства та терору в країні."
 WORLD.953.a: "Молода демократія під загрозою радикалізму..."

 WORLD.954.t: "[Get_newspaper_header]Запуск Сан Марко 1!"
 WORLD.954.d: "Після років експериментів та планування Італія нарешті зробила перший крок у завоюванні космосу. З платформи Сан Марко, плавучої платформи, що належить ENI і розташована біля узбережжя Кенії, ракета Europa 1 успішно злетіла та досягла іоносфери, що викликало святкування серед італійських науковців та військових. Хоча ракета Сан Марко 1 містила лише кілька зондів для проведення експериментів з дальньою радіозв'язком в верхніх шарах атмосфери, вона була в основному призначена для тестування здатностей Італії до запуску космічних апаратів на орбіту.\n\nНезважаючи на порівняно незначну наукову важливість Сан Марко 1, особливо в порівнянні з набагато більш розвиненими космічними програмами Німеччини, США та Японії, успіх цієї місії був сприйнятий як велика символічна перемога для Італії, яка стала першою країною, що не є супердержавою, яка успішно здійснила запуск у космос."
 WORLD.954.a: "І я побачив тут, на землі, малим і забутим блукати серед зірок, в одній з них."

 WORLD.955.t: "[Get_newspaper_header]Партизанські повстання в Італії!"
 WORLD.955.d: "Захоплення влади Карло Скорци, здавалося, вдихнуло нове життя в хворіючий фашистський режим в Італії, але ось вже виникає нова криза. Населення, незадоволене економічною стагнацією, пригніченням громадянських свобод, переслідуванням меншин і постійними агресивними війнами, розпочало повстання. Сталкиваючись із жорстокими репресіями, багато хто втік в гори, де партизанські підрозділи почали вести повстанську боротьбу.\n\nПартизани оселилися не тільки на віддалених окраїнах імперії, як в Албанії та Тунісі, але й у гірських регіонах Альп і Аппеніни, де почали використовувати складний рельєф на свою користь. Декілька регіонів вже стали осередками повстання, і деякі навіть організовують себе як «партизанські республіки». Репресії з боку італійських збройних сил вже почались, і здається, що ситуація в Римі поки під контролем, але на скільки це надовго - ніхто не знає."
 WORLD.955.a: "О белла чао, белла чао, белла чао чао чао..."

 WORLD.956.t: "[Get_newspaper_header]Окупація площі Сан-Марко!"
 WORLD.956.d: "Політика жорстоких репресій, яку проводить фашистський уряд Італії, здається, лише підлила масла в вогонь повстання. Оскільки місцеві партизанські групи активніші, ніж коли-небудь, як в самій Італії, так і на околицях імперії, напруга досягла критичної точки. Невелика повстанська група, що називається «Армія найсвятішої Венеції», змогла здійснити вражаючу окупацію площі Сан-Марко у Венеції, протягнувши саморобний танк через одну з найбільш відомих пам'яток Італії.\n\nЗ вежі Сан-Марко група розгорнула венеційські прапори та зачитала звернення з вимогою відновлення демократії та створення федеральної італійської держави з сильними місцевими органами влади, здатними зупинити фашистське втручання в громадянські свободи. Після втручання спеціальних сил, всі учасники групи були заарештовані або вбиті, а мир було відновлено - але на скільки надовго?"
 WORLD.956.a: "Це неймовірно..."

 WORLD.957.t: "[Get_newspaper_header]Дуче йде у відставку!"
 WORLD.957.d: "Новини з Італії недавно шокували світ - дуче, Карло Скорца, нібито подав у відставку, щоб дозволити Великій раді фашизму вибрати свого наступника. Хоча деякі чутки припускають, що Скорца зробив це під тиском з боку ПФР, сам дуче офіційно заявив, що після завершення своїх широкомасштабних реформ, він має обов'язок дозволити фашистській системі, яку він удосконалив, нарешті працювати так, як це завжди передбачалося.\n\nПротягом років на посаді дуче ввів в Італії версію фашизму, яка більше схожа на ранні варіанти цього руху, запровадивши радикальні реформи, спрямовані на створення «органічної демократії» та «соціалізованої економіки», а також, звісно, скасування королівського дому та перетворення Італії на соціальну республіку. Хоча багато з реформ Скорци мали катастрофічні наслідки в багатьох аспектах, а сильне повстання досі існує в республіці, ПФР все ще є єдиною політичною силою, здатною контролювати країну - хоча б поки що."
 WORLD.957.a: "Демократичний фашизм? Непристойно!"

 WORLD.958.t: "[Get_newspaper_header]Масакра на Віа Фані"
 WORLD.958.d: "Нова, кривава глава була написана в похмурій історії, яку багато хто в Італії почав називати «Роки свинцю». Після нападу на вулиці Фані в Римі, відомий політик та один з головних архітекторів переходу Італії до демократії, Альдо Моро, був викрадений невідомими озброєними людьми, його п'ять охоронців загинули під час перестрілки.\n\nНовина про викрадення змусила всю політичну ситуацію в Італії опинитися в повному хаосі. Уже проходять екстрені переговори між політичними партіями, правоохоронними органами і навіть королівським двором щодо того, як реагувати на цю атаку. Що ще гірше, той факт, що терористична група змогла здійснити таку вражаючу атаку серед білого дня, ще більше посилило параною, що вже панує в італійському суспільстві."
 WORLD.958.a: "Не буде кінця кровопролиттю?"

 #i stole 959 for an algeria event up there ok?
 
 ####More iberia world events
 
 WORLD.1503.t: "[Get_newspaper_header]Військові відновлюють демократію на Іберійському півострові"
 WORLD.1503.desc: "Парадигма Іберії після Франко знову змінилася. В останні місяці держава, очолювана каудильйо та Іберійською радою, ставала дедалі авторитарнішою. У відповідь по всій країні спалахнув протестний рух безпрецедентного масштабу. Уряд нібито наказав поліції та військовим придушити протести, але ситуація склалася зовсім інакше!\n\nВійськові, маючи широку підтримку населення, заявили, що планують провести вільні вибори якнайшвидше. Тримаючи гвоздики, символ протестного руху, незліченні мільйони по всьому півострову святкують відновлення здобутої важкою боротьбою демократії."
 WORLD.1503.a: "¡Libertad! ¡Libertad! ¡Libertad!"
 WORLD.1503.b: "Погляньте на силу народу!"
 WORLD.1503.c: "Нічого, крім анархії під дулом зброї!"
 
 WORLD.1504.t: "[Get_newspaper_header]Антоніу де Спінола приходить до влади на Іберійському півострові"
 WORLD.1504.desc: "Після смерті Франсиско Франко багато хто вважав, що дні каудильйо злічені. Виявляється, це і так, і не так; Іберійська рада разом із наступниками Франко та Салазара проголосили дивну республіку.\n\nДва каудильйо та рада призначили Антоніу де Спінолу президентом Іберії, тоді як колишні диктатори залишаються на церемоніальних посадах. З огляду на фактичну владу, яку ці 'церемоніальні' посади можуть мати, як іберійці, так і іноземці сумніваються, чи це щось змінює взагалі."
 WORLD.1504.a: "Нарешті рішення, яке нам підходить."
 WORLD.1504.b: "Якщо це виглядає як качка і крякає як качка..."
 WORLD.1504.c: "Принаймні зберегли сильне керівництво."
 
 WORLD.1505.t: "[Get_newspaper_header]Операція «Тенда»"
 WORLD.1505.desc: "Довго ходили чутки, що Італія має плани на випадок кризи окупувати стратегічні позиції в Середземномор'ї. Хоча італійський уряд завжди заперечував це, очевидно, саме це й сталося.\n\nІталійський флот окупував Балеарські острови поблизу Іберії після короткої боротьби з ізольованим гарнізоном, що залишився без підтримки через недавній колапс федерального уряду. Союзники Італії підтримали цей крок як необхідний для стабільності регіону, але Ґерманія та кілька країн третього світу засудили це як опортуністичну атаку, що відкрито порушує міжнародне право.\n\nНевідомо, чи Італія має намір зберегти свої останні завоювання, чи лише охороняти острови протягом Іберійських війн."
 WORLD.1505.a: "Це наша земля!"
 WORLD.1505.b: "Ми не зробили нічого поганого."
 WORLD.1505.c: "Яке ж «миротворення»..."
 
 WORLD.1917.t: "[Get_newspaper_header]Риковська конференція"
 WORLD.1917.d: "Після низки дій, спрямованих на більш «інтернаціоналістичну» зовнішню політику, [FROM.GetNameDef] оголосив про проведення багатоденної конференції, яка зібрала представників соціялістичних партій та інших лівих організацій з усього світу. На конференції виступили спікери майже з тридцяти країн, серед яких були радикальні ліві активісти зі США, представники Африканського національного конгресу, а також соціал-демократи зі Швеції та Фінляндії.\n\nКонференція завершилася співом "Інтернаціоналу" кількома мовами, а також підписанням необов’язкової угоди між кількома країнами про співпрацю соціялістичних націй."
 WORLD.1917.a: "Інтернаціонал об'єднує людство!"
 WORLD.1917.b: "Це нічого не змінить."
 
 WORLD.1918.t: "[Get_newspaper_header]Створення Комінтерну"
 WORLD.1918.d: "Сьогодні у спільній заяві кількох соціялістичних держав було оголошено про створення нового Комуністичного Інтернаціоналу, або Комінтерну. Згідно із заявами, Комінтерн - це орган, який складається із соціялістичних партій з усього світу, що представляють різноманітні течії лівої думки - від російського більшовизму до антиколоніального соціялізму.\n\nОрганізація, що має штаб-квартиру в [FROM.GetNameDef], заявляє про свої цілі, серед яких - сприяння співпраці між соціялістичними партіями, підтримка лівих рухів у світі та забезпечення «кооперативної оборони» для соціялістичних держав. Незважаючи на ці амбітні заяви, поки не зрозуміло, яких реальних результатів зможе досягти Комінтерн."
 WORLD.1918.a: "Крок до вільного світу."
 WORLD.1918.b: "Повернення червоних..."
 
 WORLD.1919.t: "[Get_newspaper_header]Заснування РЕВ"
 WORLD.1919.d: "Представники Комуністичного Інтернаціоналу нещодавно оголосили про створення Ради економічної взаємодопомоги, або РЕВ. У заяві, що була оприлюднена, РЕВ представлено як «глобальну програму розвитку та допомоги» для «експлуатованих націй», серед яких кілька країн Африки, які вже отримали пропозиції від Комінтерну. Через механізми РЕВ країни-учасниці Комінтерну зможуть надавати економічну допомогу та сприяти розвитку одна одній, дозволяючи більшим та заможнішим країнам підтримувати менш розвинені.\n\nБагато організацій і урядів по всьому світу вже засудили цей апарат як «імперіалізм під іншим іменем», звинувачуючи у корупції та політичному впливі, який купується через допомогу РЕВ. Комінтерн, звісно, відкидає ці звинувачення."
 WORLD.1919.a: "Допомога для революції!"
 WORLD.1919.b: "Вплив комунізму зростає..."
 
 WORLD.1992.t: "[Get_newspaper_header]Ґерманія виходить із війни в Південній Африці"
 WORLD.1992.d: "Після повідомлень про те, що війська Райху виведені з лінії фронту в Південній Африці, та виступу фюрера Альберта Шпеєра, який підтвердив ці дії, райхсміністр закордонних справ Гельмут Шмідт офіційно заявив про вихід Ґерманського Райху з найбільшого конфлікту, який світ бачив після Західно-Російської війни. Для багатьох міжнародних спостерігачів це стало несподіванкою, але загалом у світової спільноти переважає обережний оптимізм щодо нового курсу Райху.\n\n«Ми залишили дні ізоляції та жорстких методів позаду», - заявив Шмідт, відповідаючи на питання про наступні кроки Німеччини на світовій арені. Незабаром після цього було анонсовано пресконференцію райхсміністра."
 WORLD.1992.a: "Принаймні деякий глузд зберігся в Європі."
 WORLD.1992.b: "Ми не несемо відповідальності за цю війну."
 
 WORLD.1993.t: "[Get_newspaper_header]Переворот у Шотландії"
 WORLD.1993.desc: "Під час виступу в Единбурзькому замку сьогодні фельдмаршал Вімберлі оголосив перед зібранням журналістів, що цивільний уряд Шотландії зрадив націю іноземним ворогам. Посилаючись на численні останні події та рішення, ухвалені через боягузтво цивільного уряду, Вімберлі заявив, що тимчасовий військовий уряд перебере на себе керівництво, щоб забезпечити перехід до більш компетентної адміністрації. Маршал Вімберлі заявив, що військові утримуватимуть контроль лише стільки, скільки буде необхідно для захисту Шотландії, і що за його керівництва Шотландія ніколи не впаде перед загрозою фашизму чи комунізму."
 WORLD.1993.a: "Світло остаточно згасло."
 WORLD.1993.b: "Для захисту Шотландії!"
 WORLD.1993.c: "Які лицеміри!"
 
 WORLD.2009.t: "[Get_newspaper_header]Уніоністи виграють вибори в Уельсі"
 WORLD.2009.d: "Проанглійська коаліція незалежних перемогла на дострокових виборах у Уельсі. Правляча партія Plaid Cymru, ослаблена суперечливим законопроєктом про освіту виключно валлійською мовою і остаточно добита вугільною кризою, вже втратила більшість у парламенті. Їхні розбіжності та некомпетентність зробили їх легкою здобиччю для згуртованої уніоністської коаліції, яку очолює консерватор Джон Морріс. Завдяки платформі економічного відродження, орієнтованій на пошук нових торгових ринків, колишня ідея возз’єднання з Англією стала переможною формулою.\n\nНа телефонні лінії уніоністів надійшли численні привітання від бізнес-магнатів і ліберальних демократів з усього світу. Залишається побачити, чи зможе ця коаліція утримати разом свою соціялістичну меншість і пробізнесову більшість достатньо довго, щоб досягти мрії про об’єднання."
 WORLD.2009.a: "Британія - це не мрія."
 WORLD.2009.b: "Нічого не зрозуміло, це ж валлійська!"
 
 WORLD.2021.t: "[Get_newspaper_header]Валлійська революція"
 WORLD.2021.d: "Жах у Уельсі сьогодні, коли Національна асамблея, що залишалася без керівництва кілька тижнів після руйнівного вотуму недовіри, була захоплена озброєними бойовиками під керівництвом Джуліана Кайо-Еванса. Захоплення відбулося майже безкровно, причому деякі з найбільш крайніх правих членів парламенту вітали їх салютами та імпровізованими виконаннями валлійських гімнів. Проуніоністські та ліві політики негайно втекли з будівлі, залишивши управління державою виключно націоналістичній фракції.\n\nПрихильники Кайо, відомі як "Армія вільного Уельсу", вважалися неможливо розрізненими маргіналами протягом більшої частини своєї історії. Однак після спаду вугільної промисловості АВУ швидко консолідувала підтримку серед незадоволених від цього краху та стрімко рушила до перевороту. Пекуча антианглійська риторика Кайо, зрозуміло, налякала всіх, проти кого вона спрямована."
 WORLD.2021.a: "Дещо вільна, безперечно валлійська, і точно армія."
 WORLD.2021.b: "Кофіо ам Кайо!"
 
 WORLD.2040.t: "[Get_newspaper_header]Нова Росія"
 WORLD.2040.d: "Фюрер Гутрум Вагнер з Арійського Братства заявив, що має намір об'єднати Росію під своїм керівництвом. У промові, виголошеній з його палацу в Пермхаймі, він сказав, що «час прийшов для арійської раси завершити очищення унтерменшів, яке розпочалося у 1941 році», і що «з полум’я, яке прийде, нова Росія підніметься, як фенікс!»\n\nБагато лідерів у Росії та за її межами глибоко стурбовані цими подіями через жорстокість, безумство та регіональну міць Вагнера. Численні держави вже розробляють плани захисту в разі війни з Пермхаймом. Представники уряду Німеччини від коментарів утримуються."
 WORLD.2040.a: "Безумство охоплює Росію."
 WORLD.2040.b: "Наш Райх триватиме тисячу років!"
 
 WORLD.2041.t: "[Get_newspaper_header]Нова Росія"
 WORLD.2041.d: "Цього ранку Валерій Ємельянов, загадковий воєначальник Гіпербореї, офіційно оголосив про свій намір об’єднати Росію під своїм прапором у промові, виголошеній з його палацу в Пермі. «Завдяки могутності Перуна істинні арійці знову піднімуться», - заявив Ємельянов перед натовпом зібраних воїнів-священників, - «і від Балтики до Камчатки прапор Гіпербореї буде майоріти!»\n\nОскільки Гіперборея є однією з найпотужніших, найжорстокіших та найекстремістськіших держав, які виникли після розпаду СРСР, міжнародна реакція є переважно панічною. Російські держави вже мобілізують свої війська для захисту від цього агресивного утворення, а міжнародні лідери готуються до світу, де божевільні, як Ємельянов, можуть стати одними з наймогутніших людей."
 WORLD.2041.a: "Північ пробуджується."
 WORLD.2041.b: "Слава Перуну!"
 
 WORLD.2042.t: "[Get_newspaper_header]Істинна арійська батьківщина"
 WORLD.2042.d: "У промові, виголошеній з храму Рода (раніше Свято-Троїцький собор) у Пермі, воєначальник Гіпербореї Валерій Ємельянов оголосив свої плани завоювати Палестину перед усім світом. Заявивши, що це «давня, справжня батьківщина арійської раси», яка була «вкрадена євреями в давнину», він проголосив, що «настає час, коли істинні сини Святої Землі повернуть своє споконвічне королівство від масонів царя Соломона.»\n\nТе, що Ємельянов планує розширити свій вплив за межі Росії, є вкрай тривожним. Місцеві лідери на Леванті обіцяють, що «ми будемо готові, якщо він прийде», хоча і не уточнюють, які саме плани розробляються. Повідомлення про те, що військові та розвідувальні служби в регіоні перебувають у стані готовності, поки що не підтверджені."
 WORLD.2042.a: "Сподіваємось, він ніколи не прийде."
 WORLD.2042.b: "Слава Перуну!"
 
 WORLD.2063.t: "[Get_newspaper_header]Криза Ясуда"
 WORLD.2063.d: "Після оприлюднення інформації, яка звинувачує керівників корпорації Ясуда у корупційній схемі, що переросла у розслідування вбивства, гігантський заїбатцу опинився у тяжкому становищі. Коли Токійська фондова біржа відкрилася цього ранку, її зали були переповнені панічними акціонерами, які благали виконати їхні накази першими, і наляканими інтернами, які носили коробки з ордерами на ПРОДАЖ серед хаосу.\n\nАкції Ясуда вже почали різко падати, а масовий розпродаж активів у Японії, Гуандуні, В’єтнамі та Китаї створив економічний вакуум, який може розірвати економіку Сфери. Експерти прогнозують, що корпорація знаходиться на межі краху, і, якщо кабінет Іно не мобілізується для вироблення дива, повний розпад корпорації може статися вже наступного тижня."
 WORLD.2063.a: "Що падає швидше, людина чи його акції?"
 
 WORLD.2064.t: "[Get_newspaper_header]Кідо обраний прем'єр-міністром Японії"
 WORLD.2064.d: "Кідо Коіті, якого вважали «темною конячкою» сучасної японської політики, знову отримав посаду прем’єр-міністра після серйозного глухого кута в парламенті. Заручившись підтримкою імператора, Кідо виступив перед зібраним парламентом і пообіцяв «більшу співпрацю» між усіма частинами японського уряду.\n\nНайбільш поширена критика Кідо стосується його попереднього терміну на посаді прем’єр-міністра, коли його табір виявився залученим до кричущої корупції та закулісних угод, які перетворили Тайсей Йокусанкай на партію, що керувала через домовленості й неофіційні компенсації."
 WORLD.2064.a: "Повернення несподіваного кандидата."
 
 WORLD.2065.t: "[Get_newspaper_header]Ікеда обраний прем'єр-міністром Японії"
 WORLD.2065.d: "Після боротьби за владу, яка почалася після відставки Іно Хіройї з посади прем'єр-міністра Японії, Ікеда Масаносуке очолив список кандидатів від парламенту. Відомий як переконаний консерватор, Ікеда позиціонує себе як компромісну фігуру як у парламенті, так і у своїй фракції - об’єднуючи довоєнних консерваторів з Ріккен Сейюкай, а також перебіжчиків з табору лібералів адмірала Такагі.\n\nСам Ікеда відверто висловлює свої погляди - насамперед очищення від корупції та адміністративної  неефективності, що переслідували епоху Іно, а також початок поступової реформи японської держави. Хоча багато хто критикує його за надто повільні дії, інші хвалять його за поміркованість."
 WORLD.2065.a: "Статус-кво знову перемагає."
 
 WORLD.2066.t: "[Get_newspaper_header]Кая обраний прем'єр-міністром Японії"
 WORLD.2066.d: "Після тривалої боротьби за владу, яка почалася з відставки Іно Хіройї, Кая Окінорі був призначений новим прем’єр-міністром Японії. Лідер технократів із кліки Йокусанкай має великі амбіції - модернізація державного апарату в напрямку корпоративної моделі з націоналістичним ухилом, активніше використання Імператорської армії та флоту для захисту японських інтересів, а також масштабний поштовх до державного індустріального розвитку за зразком моделі Квантунської армії в Манчжурії.\n\nІ хоча Кая користується популярністю, багато хто насторожений амбіціями бюрократів, які його підтримують. Особливо примітно, що Кіші Нобусуке привітав призначення Кая, зазначивши, що Кая дійсно представляє інтереси японської держави."
 WORLD.2066.a: "Можливо, економічний підхід."

 WORLD.20661.t: "[Get_newspaper_header]Фукуда Такео обраний прем'єр-міністром Японії"
 WORLD.20661.d: "За повідомленнями з Токіо, Джушін, імператорський кабінет, який контролює призначення міністрів, прийняв відставку колишнього прем'єр-міністра Окінорі Кая та призначив кандидатом парламенту Фукуду Такео, колишнього міністра економіки в уряді Кая, новим прем'єр-міністром Японії. У телевізійному зверненні новий прем'єр-міністр пообіцяв продовжити політику свого попередника, яка вивела країну з кризи Ясуда.\n\nДосвідчений бюрократ, Фукуда Такео є провідним представником нової хвилі адміністраторів, які прагнуть економічних реформ, але не залежать від впливу сумнозвісної фракції \"Реформаторських бюрократів\". Він є дуже близьким союзником колишнього прем'єр-міністра Кая, який гарантував його талант у фінансовому управлінні."
 WORLD.20661.a: "Його експертиза - благословення для імперії."
 WORLD.20661.b: "Естафета передана новому поколінню."

 WORLD.20662.t: "[Get_newspaper_header]Шіїна Ецусабуро обраний прем'єр-міністром Японії"
 WORLD.20662.d: "Після кількох заплутаних моментів у парламенті Шіїна Ецусабуро отримав достатню кількість голосів для обрання новим прем'єр-міністром Японії, і Джушін швидко підтвердив це рішення. Прем'єр-міністр Шіїна у телевізійному зверненні пообіцяв \"вивести Японію з помилок попередніх адміністрацій\" та \"виправити неефективність, яка переслідувала економіку з часів кризи Ясуда, через обережні реформи.\"\n\nЯк колишній бюрократ у Манчжурії та близький помічник прем'єр-міністра Кая, Шіїна Ецусабуро є людиною з компромісною лояльністю, але ніхто не може сказати, що він не служив Японії добре. Однак його зв’язки зі скандально відомим Кіші Нобусуке та фракцією \"Реформаторських бюрократів\" викликають сумніви щодо його номінації, сумніви, які Шіїна обіцяє розвіяти своїми діями."
 WORLD.20662.a: "Рішучий і досвідчений - саме те, що потрібно Японії."
 WORLD.20662.b: "Схоже, вони не змогли позбутися старих."
 
 WORLD.2067.t: "[Get_newspaper_header]Такагі обраний прем'єр-міністром Японії"
 WORLD.2067.d: "Несподіваний переможець, Такагі Сокічі, став лідером після боротьби за владу, викликану відставкою Іно Хіройї. Під час своєї кампанії адмірал обіцяв лібералізацію, чим здобув багато друзів серед громадськості, але також чимало ворогів, зокрема в Імператорській армії. Особливої уваги заслуговує його боротьба з корупцією в японській політичній системі - те, що він називає \"...пухлиною на імперії та зрадою кокутай\". Крім цього, Такагі є сильним прихильником технократії як засобу забезпечення розвитку держави.\n\nОднак підтримка адмірала серед громадськості помітно нестабільна. Об’єднуючи прогресивних студентських активістів та Імператорський флот, здається, що адмірал ризикує політичним самогубством. Тільки час покаже, чи зможуть ліберали з Тайсей Йокусанкай витримати критику."
 WORLD.2067.a: "Що думає армія?"
 
 WORLD.2060.t: "[Get_newspaper_header]Китай модернізується"
 WORLD.2060.d: "У 1962 році президент Китаю Гао Цзунву оголосив про програму повної модернізації китайської економіки. Протягом років він систематично перетворив Китай на двигун і житницю сучасної епохи. Забезпечуючи харчування мільярдів у Сфері та генеруючи достатньо багатства, щоб скласти конкуренцію Японії, Китай, мабуть, єдина країна в Сфері Великого Східного Процвітання, яка може зрівнятися з Японією за промисловим і міжнародним економічним потенціалом.\n\nОднак слід зазначити, що в Китаї не все гаразд. Давню націю все ще переслідує корумпований уряд і слабшає вплив японських мегакорпорацій. Навіть із цими перешкодами було здолано велику вершину. Китай більше не є 'хворою людиною Азії'; століття приниження закінчилося."
 WORLD.2060.a: "Можливо, наступне століття стане китайським."
 WORLD.2060.b: "Ще одне велике досягнення азійської Сфери процвітання."
 
 WORLD.2061.t: "[Get_newspaper_header]Фінансова криза в Нанкіні!"
 WORLD.2061.desc: "Сьогодні в Китаї було оприлюднено новий поліцейський звіт, що детально висвітлює злочини та звірства японських мегакорпорацій, які домінують у китайській промисловості й економіці. Документи містять розповіді тисяч людей, що зазнали фізичного, словесного та сексуального насильства з боку багатих плейбоїв дзайбацу, перераховуючи кожну єну, привласнену та вилучену в китайських робітників і фермерів. Подальші висновки з документів, розкритих китайськими урядовими органами, свідчать або про байдужість до долі власних громадян, або про суцільну бюрократичну некомпетентність, що системно вражає китайський уряд.\n\nОдне можна сказати напевно: японська участь у китайській економіці завжди була нерівноправною - і ця таємниця Полішинеля тепер розкрита решті світу, і жодна людина в Сфері, дорослий чи дитина, вже не може цього заперечувати.\n"
 WORLD.2061.a: "Молимося, щоб вони пережили це!"
 WORLD.2061.b: "Час все змінити."
 WORLD.2061.c: "Прокляття всьому цьому."
 WORLD.2061.d: "Уявіть, якби це сталося тут."
 WORLD.2061.e: "Це правда, чи ні?"
 
 WORLD.2062.t: "[Get_newspaper_header]Повстання військових у Китаї"
 WORLD.2062.d: "Сьогодні Серединне Королівство знову охоплене хаосом, коли Лон Юнь, реабілітований воєначальник провінції Юньнань, оголосив національний хрестовий похід проти \"зрадників китайської нації\". Військова диктатура за своєю суттю, це відроджена \"Армія національного захисту\", тим не менш, користується значним впливом у всьому південному заході, а також, як повідомляється, отримує притік прихильників з Національної революційної армії та залишків КПК з Індокитаю.\n\nШвидка мобілізація вже триває, і Лон Юнь зі своїми прихильниками неодноразово публічно заявляли про намір повалити чинний китайський режим, встановлений у рамках Сфери процвітання, що Нанкін рішуче відкинув як \"марення божевільного\", обіцяючи швидкий кінець повстанню."
 WORLD.2062.a: "Друга Північна експедиція?"
 WORLD.2062.b: "Цього скаженого пса буде знищено!"
 WORLD.2062.c: "Наш останній шанс на визволення."
 WORLD.2062.e: "Негайно зв’яжіться з Нанкіном для евакуації наших людей."
 WORLD.2062.f: "Негайно зв’яжіться з Нанкіном для евакуації наших активів."
 WORLD.2062.g: "Чим більше тріщин у Сфері, тим краще."
 WORLD.2062.h: "Дайте мені зв’язок із Токіо, ЗАРАЗ!"
 WORLD.2062.i: "Молимося, щоб це не стало гірше..."

 WORLD.2069.t: "[Get_newspaper_header]Велика азійська війна"
 WORLD.2069.d: "Здається, кожна імперія має свій кінець. Те, що починалося як регіональний бунт у Китаї, вийшло за межі будь-яких прогнозів, змусивши Японію втрутитися та втягнувши всю Сферу процвітання у повномасштабний наземний конфлікт, небачений з 1940-х років, коли полум’я війни все більше охоплює азійський континент.\n\nОчі ОВН, Айнхайтспакт та всього світу з тривогою спостерігають, як танки та солдати Імператорської японської армії знову перетинають кордони Маньчжурії, як це було майже два десятиліття тому. Зіткнення між двома сонцями досягло своєї кровопролитної кульмінації; можливо, незабаром статус-кво Холодної війни назавжди зникне у їхньому спільному полум’ї."
 WORLD.2069.a: "Вперед, вперед і далі!"
 WORLD.2069.b: "Ніколи!"
 WORLD.2069.c: "Дайте мені зв’язок із Ленглі. Це грандіозно."
 WORLD.2069.e: "Дайте мені зв’язок з Абвером. Це грандіозно."
 WORLD.2069.f: "Нарешті, Сфера стоїть на порозі своєї смерті."
 WORLD.2069.g: "Небеса, врятуйте нас..."
 WORLD.2069.h: "І ми опинилися прямо посередині."
 WORLD.2069.i: "Можливо, справді настав час вільного Китаю?"

 WORLD.1911.t: "[Get_newspaper_header]Вільний Китай"
 WORLD.1911.d: "Сьогодні відбулася найвражаюча подія з усіх. Японія зазнала поразки. Національна армія захисту, яку спочатку вважали надто слабкою, щоб представляти реальну загрозу, перемогла всю міць Сфери процвітання, офіційно проголосивши сьогодні \"відродження\" Республіки Китай під номінальним керівництвом президента Сун Фо - сина Сунь Ятсена. Оголошено перемир’я, всі договори під колишнім режимом Ван Цзінвея скасовані, а всі розділені території - включаючи Гуандун і Маньчжурію - реінтегровані до складу Республіки.\n\nНові реалії вже починають усвідомлювати в усьому світі: Сфера, її геополітичний вплив тепер у незворотному занепаді, рухається до раннього завершення Холодної війни, яка мучила світ майже два десятиліття. Однак для всіх китайців, які сьогодні святкують, це не має значення. Китай вперше за всю історію з часів Першої опіумної війни тепер справді, беззаперечно вільний."
 WORLD.1911.a: "І цю свободу ми будемо берегти вічно."
 WORLD.1911.b: "Це закінчилося."
 WORLD.1911.c: "Що тепер з нами буде?"
 WORLD.1911.e: "Нехай наш ворог залишиться в небутті."
 WORLD.1911.f: "Сьогодні біле сонце затьмарює червоне."

 WORLD.9999.t: "[Get_newspaper_header]Приховані герої"
 WORLD.9999.d: "Британія, наповнена стільки страждань і хаосу, знову увійшла до міжнародних новин сьогодні. Але цього разу це не новини про бомбардування чи репресії з боку гарнізону, як це стало нормою, а про мистецтво.\n\nНа вулицях Лондона помічено кілька графіті. Спочатку ці твори не викликали великого інтересу, але увагу ЗМІ привернуло те, що художник, чия особа залишається невідомою, зміг створити один зі своїх малюнків прямо на дверях парламенту.\n\nЗмістовні та добре виконані, ці роботи запалили уяву суспільства, і зображення різних творів, приписуваних художнику, відомому під псевдонімом 'Softboy', поширилися по всьому світу. Про художника відомо мало, лише те, що він, можливо, пов’язаний із соціялістичним рухом Великої Британії, але всі обговорюють, яке значення мають ці твори."
 WORLD.9999.a: "Великі уми покоління, які працюють із тіні!"
 WORLD.9999.b: "Мусимо визнати, вони дуже змістовні."

 WORLD.50003.t: "[Get_newspaper_header]Англія приєднується до ОВН"
 WORLD.50003.desc: "Після місяців дипломатичних переговорів і численних прямих зустрічей між прем'єр-міністром Англії [ENG.GetLeader] і президентом США [USA.GetLeader], уряд Англії оголосив про своє приєднання до ОВН. Новина була дуже позитивно сприйнята в Англії, США та, особливо, у колишніх домініонах Канаді, Австралії та Новій Зеландії. Хоча німецькі офіційні особи не коментували новий альянс, прем'єр-міністр [ENG.GetLeader] назвав цей день "великим для англійського народу та для світового миру".\n\nАльянс викликає спогади про старих Західних союзників і є величезним зрушенням у європейській геополітиці. Тепер, коли Англія в ОВН, американці мають точку відправлення, з якої можна буде поетапно знищити континентальних маріонеток Райху."
 WORLD.50003.a: "Британці ніколи не будуть рабами."
 WORLD.50003.b: "Англія зрадила нас!"
 WORLD.50003.c: "Англія нарешті обрала сторону."
 
 WORLD.50004.t: "[Get_newspaper_header]Англія приєднується до Єдиного Пакту"
 WORLD.50004.desc: "Після місяців дипломатичних зустрічей і переговорів, сьогодні було оголошено спільну заяву від прем'єр-міністра [ENG.GetLeader] та фюрера [GER.GetLeader], що Англія приєднується до Єдиного Пакту. Це стало великою несподіванкою для багатьох у самій Англії та серед союзників ОВН. Хоча було відомо, що німецький уряд намагався повернути Англію до їхнього гегемоністського європейського альянсу, багато хто вважав, що рани після Операції Сілеон та нацистської окупації надто глибокі для подальшої співпраці. Однак, схоже, сумніви виявилися помилковими, оскільки Англія тепер стоїть у Єдиному Пакті за власним бажанням. Поки американці та їхні союзники з ОВН бурмочуть через океан, вплив Німеччини на Європу зростає, і, можливо, ще триватиме деякий час."
 WORLD.50004.a: "Англія загублена."
 WORLD.50004.b: "Англія повернула розум."
 WORLD.50004.c: "Англія нарешті обрала сторону."
 
 WORLD.50005.t: "[Get_newspaper_header]Уельс об'єднується з Англією"
 WORLD.50005.desc: "Останні повідомлення з Британських островів свідчать про великий крок до реуніфікації Сполученого Королівства. Уельс знову об'єднується з його сусідом на сході. Деякі уельсці, особливо голосні націоналісти, швидко осудили цей крок, однак тепер вони не можуть нічого зробити. Уельс знову під контролем Англії.\n\nОднак, що це може означати для інших країн, які займають ці острови, наразі невідомо. Хоча малоймовірно, що англійці зупинять свої зусилля на цьому. Світ стежить, як Англія повільно відновлює титул Сполученого Королівства."
 WORLD.50005.a: "Уельс повертається до складу."
 WORLD.50005.b: "Принаймні, це сталося мирно."

 WORLD.50006.t: "[Get_newspaper_header]Англія перемагає Уельс"
 WORLD.50006.desc: "Святкування можна побачити в Лондоні цієї ночі, оскільки уряд Уельсу подав заяву про мир. Англо-уельська війна завершена, і вона закінчилася так, як усі й очікували. Попри хоробрий опір Уельсу, Англія виявилася достатньо сильною, щоб швидко прорвати уельські лінії і увійти в Кардіфф.\n\nАнглія має намір інтегрувати Уельс як частину себе. Однак уельський опір залишається великим і добре озброєним. Експерти вважають, що Уельс буде важко окупувати для Англії, особливо в найближчому майбутньому."
 WORLD.50006.a: "Ще один крок ближче!"
 WORLD.50006.b: "Ще одна країна на шляху до майбутньої Британської імперії."
 WORLD.50006.c: "І ми наступні!"

 WORLD.50007.t: "[Get_newspaper_header]Англія і Уельс у війні"
 WORLD.50007.desc: "Острів Британія знову охоплений полум'ям після того, як переговори між Англією та Уельсом зірвалися. Уельс відмовився прийняти пропозицію Англії, і тепер дві нації офіційно перебувають у стані війни. У прикордонних регіонах було зафіксовано артилерійські обстріли та постріли.\n\nБагато цивільних осіб поблизу Кардіффа панікують, побоюючись, що війна незабаром перейде в місто. Чи стане цей конфлікт для англійців легкою прогулянкою, чи здатна менша уельська армія утримати націю і зупинити англійців на кордоні, поки неясно."
 WORLD.50007.a: "Невтішна реальність."
 WORLD.50007.b: "Острів знову в полум'ї."
 WORLD.50007.c: "Сподіваємось, це зробить їх більш схильними до нас."
 WORLD.50007.d: "Cymru am byth!"

 WORLD.50008.t: "[Get_newspaper_header]Англія і Шотландія у війні"
 WORLD.50008.desc: "Те, що вважалося однією з найбільших точок спалаху в Європі, сьогодні вибухнуло обстрілами та кулеметними залпами, оскільки переговори між Англією та Шотландією зазнали краху. Вимоги Англії, щоб Шотландія увійшла до їхнього союзу, не вдалися, і тепер Англія змушена діяти військовим шляхом. Англійські літаки вже помічені над Едінбургом, а уряди по всьому світу попереджають свої кораблі та літаки уникати Північного моря.\n\nБагато в Англії очікують перемоги над шотландськими захисниками. Однак експерти застерігають, що роки підготовки Шотландії роблять їх позиції важкими для прориву. І ніколи не слід сумніватися в силі та рішучості шотландського солдата."
 WORLD.50008.a: "Шотландці не змогли побачити розум."
 WORLD.50008.b: "У моїй обороні, Бог мене захищає!"
 WORLD.50008.c: "Острів знову заливається кров'ю."

 WORLD.50009.t: "[Get_newspaper_header]Англія перемагає Шотландію"
 WORLD.50009.desc: "Після кампанії, яку багато хто називає схожою на Західний фронт Першої світової війни, Англія перемогла шотландські армії та повністю контролює націю. Прапор Англії майорить над усіма частинами острова, а уряд Шотландії був захоплений.\n\nНезважаючи на організовану капітуляцію шотландських сил, багато менших підрозділів ще діють, ведучи партизанську війну проти окупаційної англійської армії. Однак тепер Англія подолала будь-яку загрозу своїм амбіціям відновити [ENG.GetName], або територію з подібним географічним контролем. Тепер Лондон майже напевно проголосить себе законним спадкоємцем Британської імперії та вимагатиме того ж поваги."
 WORLD.50009.a: "Знову союз!"
 WORLD.50009.b: "Союз, якою ціною?"

 WORLD.50010.t: "[Get_newspaper_header]Реформа [ENG.GetName]"
 WORLD.50010.desc: "У Едінбурзі сьогодні англійські та шотландські дипломати оголосили угоду щодо реформи [ENG.GetName] знову. Шотландія відмовляється від своєї незалежності в обмін на певну автономію та права за угодою. Повідомляється, що англійці надзвичайно задоволені цією угодою, оскільки вона відповідає основній політичній меті кожного уряду Англії після війни.\n\nДеякі в Шотландії обурені угодою, вважаючи, що було занадто багато чого віддано в обмін, але альтернативою було широко визнано, що це могла бути війна між Шотландією та Англією. Однак, якщо святкування в Едінбурзі - це будь-що, то Шотландія та Англія не матимуть проблем бути разом у найближчому майбутньому."
 WORLD.50010.a: "Практицизм знову перемагає!"
 WORLD.50010.b: "І Велика Британія знову вступає в гру."

 WORLD.50011.t: "[Get_newspaper_header]Шотландія перемагає Англію"
 WORLD.50011.desc: "У катастрофі, яку мало хто очікував, Шотландія утримала Англію від її неодноразових атак, спрямованих на підкорення. Більше того, вони фактично відкинули англійців далеко за кордони, і після повної поразки англійських сил, захопили Лондон. Повідомляється, що організований опір на англійській землі завершено, а уряд впав, залишивши Шотландію явним і повним переможцем.\n\nЗараз в Шотландії йде велика дискусія про те, що робити з новими здобутками. Деякі пропонують створити маріонетковий уряд. Але інші намагаються створити новий союз, хоча й не зовсім той, який планували завойовники. Незважаючи на це, ця поразка матиме значення для майбутнього острова Британія."
 WORLD.50011.a: "Єдиноріг перемагає лева!"
 WORLD.50011.b: "Що далі станеться на острові?"

 WORLD.50012.t: "[Get_newspaper_header]Уельс перемагає Англію"
 WORLD.50012.desc: "Світло згасло в Європі, оскільки Уельс зміг перемогти набагато більшу та сильнішу Англію, у тому, що багато військових лідерів називають 'абсолютною випадковістю у всесвіті, що виходить за межі будь-якої логіки'. Уельс мав би програти війну, якщо будь-який теоретичний сценарій вірить, що всесвіт працює за строгими правилами та рівняннями, за більшістю думок, і все ж тепер вони стоять над переможеною Англією.\n\nМожна лише здригнутися, думаючи про жахливу долю тих, хто ховається в страху, коли уельські війська марширують по Уайтхолу, але інші вважають це космічною справедливістю за всі гріхи, які вчинила Англія в минулому, і окупація є просто їхнім покаранням. Тим не менш, деякі вважають, що Уельс уклав угоду з надприродними і зловісними силами, і закликають до проведення хрестового походу проти них якнайшвидше."
 WORLD.50012.a: "Топ, топ, топ, хлопці марширують по Англії!"
 WORLD.50012.b: "Уельс може бути справжнім темним сонцем Європи."

 WORLD.50013.t: "[Get_newspaper_header]Шотландські мілітаристи приходять до влади"
 WORLD.50013.desc: "Повідомлення з Шотландії останнім часом вказують на новий уряд, що приходить до влади. Колишня Юніоністська партія була повалена солдатами SAS Девіда Стерлінга, які заявляють, що вони є справжніми спадкоємцями Сполученого Королівства. За кордоном в Англії уряд відкинув ці претензії як 'абсурдні'.\n\nОднак питання для багатьох залишається тим самим. Як відома терористична група на Британських островах змогла проникнути в уряд Шотландії і почати так впливати на країну? Якими будуть подальші кроки уряду, невідомо. Однак, оскільки Юніон Джек піднято по всій Шотландії, народ островів з тривогою дивиться на цей новий розвиток."
 WORLD.50013.a: "Шотландці зійшли з розуму!?"
 WORLD.50013.b: "Більше війни?"
 WORLD.50013.c: "Союз назавжди!"

 WORLD.1301.t: "[Get_newspaper_header]Корона повертається до Сербії"
 WORLD.1301.d: "Після понад двох десятиліть вигнаний монарх Сербії, король Петро II, повернувся на трон. Оскільки більшість опору вже придушено, а їхня влада убезпечена, четникам вдалося повернути додому свого блудного короля. Його повернення зустріли з радістю серед націоналістичної бази нового режиму, а його відновлення на престолі відсвяткували як важливий крок уперед у реалізації четницького бачення Сербії.\n\nПроте король є майже виключно номінальною фігурою з незначною реальною владою чи взагалі без неї. Справжня влада за троном належить четницькій військовій хунті, яка просто використовує короля для легітимності та підтримання популярності серед своїх роялістських прихильників. Це дає хунті абсолютно неконтрольовану владу в їхньому новому націоналістичному режимі."
 WORLD.1301.a: "Король повертається, в кайданах."

 WORLD.1302.t: "[Get_newspaper_header]Оголошено Республіку Сербія"
 WORLD.1302.d: "Після перемоги Руху національного визволення в Громадянській війні в Сербії відбулася боротьба за контроль над країною між затятими комуністичними партизанами та націоналістичною молодою гвардією фронту. Цю хаотичну політичну битву виграла остання група на чолі зі своїм лідером Добрицею Чосичем.\n\nПопулістська риторика Чосича здобула йому підтримку серед населення, що призвело до маргіналізації комуністів і закликів до демократичних виборів. За відсутності чіткої опозиції, широкої народної підтримки та застосування тактик залякування вибори завершились перемогою Чосича та його партії, новоствореної Соціалістичної партії Сербії, яка здобула контроль як над президентством, так і над законодавчим органом."
 WORLD.1302.a: "Молода демократія робить перший крок."

 WORLD.1303.t: "[Get_newspaper_header]Сербію оголошено Народною Республікою"
 WORLD.1303.d: "Після того, що здавалося цілою вічністю війни, комуністичні сили в Сербії успішно закріпили свій контроль над знедоленою країною та проголосили її Народною Республікою. З їхньою партією при владі та згасаючим опором постає питання, як саме керувати своєю державою. Партія вже розкололася на поміркований та консервативний табори.\n\nНезалежно від того, яка з груп переможе, уряд уже виклав свої цілі та плани на майбутнє, багато з яких доволі амбітні. Здається, комуністи налаштовані провести серію масштабних і сміливих реформ, щоб якомога швидше відбудувати та модернізувати країну. Їхня агресивна зовнішня політика підтримки повстанців у сусідніх країнах також привернула увагу і занепокоєння міжнародної спільноти."
 WORLD.1303.a: "Подивимося, як це розвиватиметься."

 WORLD.1304.t: "[Get_newspaper_header]Сербія стає протекторатом Райху"
 WORLD.1304.d: "Із жорстоким придушенням Німецьким військовим командуванням залишків опору та встановленням гегемонії над переважною більшістю держави, бойові дії в Сербії підійшли до відносного завершення. Замість того, щоб ризикувати новою хвилею масового опору, що загрожувала б їхньому контролю над Балканами, Райх вирішив перетворити країну на протекторат за наполяганням Ґюнтера Альтенбурга.\n\nНоворозвинена квазідержава, відома як "Протекторат землі принца Ойгена", лишається на короткому повідку Райху та функціонує за суворою расовою ієрархією. Привілейований вищий клас, що складається з банатських швабів та німецьких поселенців, має більше прав, багатства й влади, ніж ті, хто нижче. Сербські колабораціоністи також лишаються значно наділені владою, проте не на рівні "расово чистої" правлячої касти. Для решти суспільства це життя у злиднях з мізерною соціальною мобільністю або й взагалі без неї.\n"
 WORLD.1304.a: "Ще одна революція закінчується кривавою трагедією."

 WORLD.1305.t: "[Get_newspaper_header]Оголошено класово-кооперативну державу Сербії"
 WORLD.1305.d: "Новини надходять із серця Балкан, Сербії. Після кризи в Німеччині Сербія опинилась у вирі жорстокого конфлікту. Колабораціоністський Уряд національного порятунку вийшов переможцем за підтримки німецького гарнізону. Незадовго до початку громадянської війни Дімітріє Льотіч був убитий, і контроль над Сербією перейшов до Константина Мушицького, лідера Льотічевців, воєнізованого формування ЗБОРу та міністра внутрішніх справ держави.\n\nВідразу після приходу до влади Мушицький жорстоко придушив партизанів, що все ще чинили опір ВНС. Крім того, сербська адміністрація швидко знешкодила та відсунула на другий план німецький гарнізон, забезпечивши повне панування ЗБОРу в Сербії. Потім він зосередився на власному уряді. Мушицький запровадив основний закон, що слугує тимчасовою конституцією. Нові закони закріплюють християнську православну, корпоративістську та абсолютистську державу.\n"
 WORLD.1305.a: "Керівництво, сповнене божевільним духом..."

 WORLD.1306.t: "[Get_newspaper_header]SPS виграє третій термін в Сербії"
 WORLD.1306.d: "Поки заворушення та протести розхитували Сербію після краху її економіки та зростаючої непопулярності СПС і її лідера Добриці Чосича, сьогодні ситуацію знову вирішили, коли СПС провела позачергові вибори, як і обіцяла зростаючому руху опору та його учасникам.\n\nПопри масову мобілізацію руху "Отпор", СПС перемогла втретє сьогодні, вщент розгромивши опозицію на виборах. Оскільки СПС повністю контролює весь державний апарат, адміністрація готова розправитися з опозицією до свого режиму та зміцнити свої позиції як єдиної провідної партії в Сербії. З ослабленим рухом опору здається, що подальші репресії згасять будь-які надії на виживання легітимної сербської демократії.\n\nМайбутнє Сербії тепер визначене: сербський націоналістичний і соціалістичний лад пануватиме ще довгі роки.\n"
 WORLD.1306.a: "Націоналістичний деспот без трону."

 WORLD.1307.t: "[Get_newspaper_header]Коаліція SPS-SRS після заворушень"
 WORLD.1307.d: "Поки заворушення та протести розхитували Сербію після краху її економіки та зростаючої непопулярності СПС і її лідера Добриці Чосича, сьогодні ситуацію знову вирішили, коли СПС провела позачергові вибори, як і обіцяла зростаючому руху опору та його учасникам.\n\nДоволі несподівано СПС запропонувала коаліційний список Сербській радикальній партії, провідній партії всередині руху "Отпор", щоб зберегти владу в обмін на вихід СРП з руху. Її лідер, Велько Ґуберіна, прийняв пропозицію, і вибори завершились абсолютною більшістю для нової коаліції СПС-СРП, оскільки решта партій дезорганізувалась після виходу СРП з опозиції.\n\nНовий етап розпочато: СПС і СРП прагнутимуть подвоїти та закріпити сербський націоналізм як новий шлях і призначення Сербії.\n"
 WORLD.1307.a: "Партії однієї ідеології об'єднуються."

 WORLD.1308.t: "[Get_newspaper_header]Сербська весна"
 WORLD.1308.d: "Поки заворушення та протести розхитували Сербію після краху її економіки та зростаючої непопулярності СПС і її лідера Добриці Чосича, сьогодні ситуацію знову вирішили, коли СПС провела позачергові вибори, як і обіцяла зростаючому руху опору та його учасникам.\n\nПопри рішучі заходи СПС для забезпечення перемоги, рух "Отпор" переміг з абсолютною більшістю на виборах завдяки успішним заходам руху з об'єднання та мобілізації населення проти СПС. Після мирного повалення Добриці Чосича тимчасовий уряд оголосив, що вільні та чесні вибори відбудуться через три місяці, на превелику радість громадян Сербії.\n\nСеред святкувань ліве крило руху "Отпор" було маргіналізоване через дії СПС, і центр та праві сили мають домінувати на нових виборах.\n"
 WORLD.1308.a: "Від народу, за свободу і волю людей!"

 WORLD.16600.t: "[Get_newspaper_header]Падіння головного виконавчого директора Сузукі"
 WORLD.16600.desc: "Наслідки краху Ясуда Консерн поширились за межі японської метрополії, оскільки головний виконавчий директор Гуандуну Сузукі Тейчі пішов у відставку після голосування про недовіру в Законодавчій раді. Сузукі, тісно пов'язаний з опозореною адміністрацією Іно, ймовірно, залежав від підтримки Ясуда для утримання влади, особливо в ухваленні суперечливого Переглянутого указу про трудові стандарти.\n\nНе користуючись великою підтримкою серед традиційних корпоративних сил Гуандуну, Сузукі був замінений тимчасовим головним виконавчим директором Мацудзавою Такуджі, колишнім регіональним керівником Ясуда Банку. Оскільки політичні хвилювання в Токіо продовжуються, вважається, що постійний наступник Мацудзави буде обраний з однієї з трьох великих компаній Гуандуну."
 WORLD.16600.a: "Токіо більше не обиратиме наших лідерів."
 WORLD.16600.b: "Жадібність замість вірності."
 WORLD.16600.c: "Чи зможе корпоративна держава вижити?"

 WORLD.16601.t: "[Get_newspaper_header]Інавгурація головного виконавчого директора Моріти"
 WORLD.16601.desc: "Після напружених раундів переговорів Законодавча рада Гуандуну проголосувала за затвердження Моріти Акіо з корпорації Sony на пост головного виконавчого директора. Завзятий прихильник реформ, Моріта пообіцяв створити більш справедливе суспільство для всіх народів Гуандуну. Підтримка Моріти серед кантонсько-японської еліти особливо помітна, як і його тісна дружба та співпраця з Лі Кашіном з Cheung Kong Enterprises, найбільшою китайською корпорацією Гуандуну.\n\nХоча реформи Моріти можуть зняти напругу серед корінного населення, вони також викликали значний опір з боку більш жорсткої корпоративної фракції держави, зокрема з боку генерального директора Fujitsu та колишнього бізнес-партнера Моріти, Ібука Масару."
 WORLD.16601.a: "Три Перлини, три народи."
 WORLD.16601.b: "Можливо, Моріта продовжить справу Сузукі?"
 WORLD.16601.c: "Яка слабкість!"
 WORLD.16601.d: "Як можна реформувати такий абсурдний концепт?"

 WORLD.16602.t: "[Get_newspaper_header]Інавгурація головного виконавчого директора Мацушіти"
 WORLD.16602.desc: "Виходячи з періоду політичної нестабільності після краху Ясуда, Законодавча рада Гуандуну обрала Мацушіту Масахару з Matsushita Electric на пост головного виконавчого директора. Усиновлений нащадок одного з найбільш успішних незалежних бізнесменів Японії, Мацушіта є поміркованою фігурою між реформістами Гуандуну та корпоративними жорсткими фракціями. Його каденція має забезпечити безпеку через помірні реформи, одночасно сприяючи подальшій експансії підприємництва та прибутку.\n\nМацушіта користується великою популярністю серед японської бізнес-спільноти Гуандуну, але його патерналістичний підхід до управління може відштовхнути багатьох, особливо серед нижчих класів."
 WORLD.16602.a: "До стабільності та розширення!"
 WORLD.16602.b: "Можливо, Мацушіта утримає корабель на плаву?"
 WORLD.16602.c: "Абсурдний статус-кво зберігається."

 WORLD.16603.t: "[Get_newspaper_header]Інавгурація головного виконавчого директора Ібуки"
 WORLD.16603.desc: "Після тимчасового правління Мацудзави Такуджі представники Законодавчої ради Гуандуну склали присягу на Ібуку Масару з Fujitsu Limited як нового головного виконавчого директора. Інженер за освітою та належний до жорсткої корпоративної фракції Гуандуну, він пообіцяв побудувати державу, засновану на меритократичних принципах, та суспільство, технічний потенціал якого відповідатиме лабораторіям Fujitsu.\n\nРішучий противник зусиль адміністрації Сузукі щодо трудових реформ, Ібука, ймовірно, продовжить свою позицію проти збільшення соціальних виплат для корінного населення Гуандуну. Це очікується приверне значний опір з боку реформістських елементів в Законодавчій раді, зокрема з боку його давнього суперника та колишнього бізнес-партнера, Моріти Акіо з Sony."
 WORLD.16603.a: "До досконалості у всьому!"
 WORLD.16603.b: "Можливо, Ібука принесе потрібні інновації?"
 WORLD.16603.c: "Чи здійсниться мрія інженера?"
 
 WORLD.16604.t: "[Get_newspaper_header]Ку-де-Та Hitachi у Гуандуні!"
 WORLD.16604.desc: "У державі Гуандун, півавтономному політично-корпоративному утворенні Японської імперії, сталося дивне явище.\n\nЗдається, головний виконавчий директор 'взяла на себе відповідальність' за нещодавню економічну хаос у Гуандуні, пішов у відставку в рамках, що здається, блискавичним переворотом, і був замінений головним виконавчим директором Комаї Кенічіро з Hitachi Limited.\n\nЗ підтримкою Манчжурської промислової корпорації, державного гіганта Манчжукво, та Кенпеїтай Імператорської армії Японії, що поширюються по містах і селах Гуандуну, здається, що переворот Hitachi повністю витіснив існуючий корпоративний порядок Гуандуну."
 WORLD.16604.a: "Це... нам до вподоби."
 WORLD.16604.b: "Тоді більш жорстка модель."

 WORLD.16605.t: "[Get_newspaper_header]Бунти у Гуандуні!"
 WORLD.16605.desc: "Енергетична криза продовжує дестабілізувати глобальне суспільство, забираючи як свою останню жертву стабільність корпоративної держави Гуандуну на південь від Китаю.\n\nПісля величезних економічних потрясінь, що стали частиною глобального спаду в хаос, гнів, що довго накопичувався в етнічно сегрегованому суспільстві, нарешті вибухнув у насильницькі анти-японські та анти-корпоративні протести. Оголошено військовий стан, хоча він поки не завадив майже повному розпаду порядку в багатьох містах.\n\nГоловний виконавчий директор випустив комюніке, в якому вказано на намір відновити порядок. Невідомо, наскільки успішно-якщо взагалі-це буде."
 WORLD.16605.a: "Наш салют борцям за свободу!"
 WORLD.16605.b: "Аа."
 WORLD.16605.c: "Це виходить з-під контролю, скажу я вам!"
 WORLD.16605.d: "Цього не станеться тут, чи не так?"
 WORLD.16605.e: "Куди далі?"

 WORLD.16606.t: "[Get_newspaper_header]Загоєння бунтів у Гуандуні"
 WORLD.16606.desc: "Ще один знак повернення до відносного спокою після руйнувань, завданих енергетичною кризою, бунти в Гуандуні, викликані масовим соціальним гнівом щодо життя в сегрегованій системі, нарешті вщухли.\n\nНапружені переговори з урядом та жорстока репресія призвели до спокою на вулицях Гуанчжоу та інших великих містах в корпоративній державі. Головний виконавчий директор нещодавно випустив комюніке, в якому заявив про "повний успіх" та обіцяв повернення до бізнесу будь-яким чином.\n\nТокіо висловило свої вітання. З іншого боку, з Нанкіна жодних коментарів."
 WORLD.16606.a: "Ми повернемося-пам'ятайте мої слова!"
 WORLD.16606.b: "Молодці."
 WORLD.16606.c: "Ось і менше кризи."

 WORLD.16607.t: "[Get_newspaper_header]Переворот Імперської японської армії в Гуандуні!"
 WORLD.16607.desc: "Тривожні новини з Гуандуну: імперський японський уряд, "стривожений" неконтрольованими бунтами в своїй залежній від корпорацій території Гуандун, "використав своє право зберігати порядок" і наказав місцевим підрозділам Імперської японської армії повалити уряд. Місцезнаходження попереднього головного виконавчого директора невідоме.\n\nІз захопленням ІЯА всіх урядових органів і медіа-каналів, ті повідомлення, які все ще надходять з Перлової річки, показують зростаючий контроль японського уряду. Однак зрозуміло, що, незважаючи на примусову тишу в міських центрах, Гуандун все ще горить, що турбує багатьох спостерігачів - особливо з Китаю."
 WORLD.16607.a: "Цей Наґано заплатить!"
 WORLD.16607.b: "Бандити отримують те, що заслуговують."
 WORLD.16607.c: "Вони не могли викупитися, так?"
 
 WORLD.16800.t: "[Get_newspaper_header]Перемога патріотичного фронту на виборах у Лаосі 1962 року"
 WORLD.16800.desc: "На радість багатьох і на здивування деяких, спадщина принца Пєтсарета була збережена. Під керівництвом зведеного брата принца, принца Супханувонга, Лаоський патріотичний фронт уклав коаліцію з партією миру і нейтральності, сформувавши новий уряд під особистим керівництвом принца. По всій країні демократи полегшено зітхають від підтвердження лаоської демократії, а фермери радуються його обіцянкам з модернізації сільського господарства.\n\nАле не всі такі святкують. Консерватори та монархісти вже посилили свої звинувачення в тому, що принц є комуністичним шпигуном, а також спроби поставити під сумнів достовірність виборів. Один політик навіть пішов так далеко, щоб закликати японців анулювати вибори, але їхня опозиція розвалилася, коли японці надіслали привітання принцу з приводу його перемоги. З цим у Лаосі відновлюється нормальність."
 WORLD.16800.a: "Лівак у Сфері?"

 WORLD.16801.t: "[Get_newspaper_header]Перемога національно-прогресивної партії на виборах у Лаосі 1962 року"
 WORLD.16801.desc: "Боротьба за спадщину принца Пєтсарета віддалила перемогу пізніше померлому принцу, оскільки Національно-прогресивна партія під керівництвом його брата Суванни Фоми отримала більшість в Національних зборах. Ліберальний аристократ Суванна Фома намагається продовжити спадщину померлого принца, зміцнюючи демократичні інститути та модернізуючи країну завдяки японським інвестиціям.\n\nЧерез довготривалі суперечності з правими, принц сформував коаліцію з Лаоським патріотичним фронтом, очолюваним принцом Супханувонгом, щоб протистояти консерваторам. Однак це призвело до запеклої опозиції до нового уряду, що змушує його обережно балансувати, щоб не зруйнувати зусилля Пєтсарета."
 WORLD.16801.a: "Чи зможе демократія здолати Інтокітину?"

 WORLD.16802.t: "[Get_newspaper_header]Перемога національно-прогресивної партії на виборах у Лаосі 1962 року"
 WORLD.16802.desc: "Боротьба за спадщину принца Пєтсарета віддалила перемогу пізніше померлому принцу, оскільки Національно-прогресивна партія під керівництвом його брата Суванни Фоми отримала більшість в Національних зборах. Ліберальний аристократ Суванна Фома намагається продовжити спадщину померлого принца, зміцнюючи демократичні інститути та модернізуючи країну завдяки японським інвестиціям.\n\nЧерез довготривалі суперечності з правими, принц сформував коаліцію з Національним союзом, очолюваним "Дхаммістом" Бонгом Суваннафонгом, щоб протистояти консерваторам. Незважаючи на зовнішню схильність до лівих позицій, суперечливі погляди Бонга багато хто вважає не сумісними з ліберальним, японськофільним Суванною Фомою, що може створити проблеми для нової адміністрації."
 WORLD.16802.a: "Трудний шлях для лаоської демократії."

 WORLD.16803.t: "[Get_newspaper_header]Перемога незалежної партії на виборах у Лаосі 1962 року"
 WORLD.16803.desc: "Вибори 1962 року в Лаосі завершилися перемогою Незалежної партії Пхуї Сананікона, яка обігнала національно-прогресивну партію. Завзятий консерватор Сананікон прагне відновити "життєво важливі традиції" монархії та вірність уряду, при цьому зберігаючи демократичні структури в країні.\n\nНезважаючи на свою перемогу, майбутнє нового лідера невизначене. Опинившись між праворадикальним аристократизмом, що підтримує його партію, і змушений вести переговори з досі потужною прогресивною партією, Сананікон буде змушений робити великі поступки з обох боків, щоб його бачення могло вижити до наступних виборів."
 WORLD.16803.a: "Крок вперед, два кроки назад."

 WORLD.16804.t: "[Get_newspaper_header]Перемога патріотичного фронту на виборах у Лаосі 1967 року"
 WORLD.16804.desc: "Вибори 1967 року в Лаосі завершилися перемогою соціялістичної партії Патріотичний фронт і їхніх прогресивних союзників. Підтримані сільським населенням і робітниками, нова коаліція намагається посилити захист меншин і працівників, а також запровадити заборону опіуму в країні. З широкою підтримкою лівих лідерів та співпрацею з національно-прогресивною партією, Супханувонг, ймовірно, здійснить серйозні зміни в лаоському житті.\n\nНе всі прийняли нову систему, оскільки праві сили виступають проти "большевістських політик" нової партії. Незважаючи на ці труднощі, Супханувонг має підтримку національно-прогресивної партії і почав шукати збільшену підтримку від Японії. Якщо партія зможе приборкати політику країни, Лаос, ймовірно, потрапить у майбутнє."
 WORLD.16804.a: "Прогрес в Азії?"

 WORLD.16805.t: "[Get_newspaper_header]Перемога національно-прогресивної партії на виборах у Лаосі 1967 року"
 WORLD.16805.desc: "Останні новини з Лаосу, найстарішої ліберальної демократії Японської Сфери. Суванна Фома і його партія PXKN здобули перемогу в цьому році, отримавши найбільшу кількість місць і закріпивши свої позиції за допомогою коаліції з NLHX. Намірений на покращення відносин з Японією, скасування обмежень і дискримінації меншин Лаосу та боротьбу з епідемією опіуму, двоє братів і їхні партії стоять готові навести хвилю реформ і прогресу в Лаосі.\n\nКонсервативні елементи, хоч і розчаровані поразкою, знаходять втіху в тріщинах коаліції, головним чином у різниці економічних політик. Більш центристські елементи коаліції чітко дали зрозуміти, що готові до компромісів з правими в деяких питаннях. З допомогою цих поступок вони входять у спокійні перемовини, що приносить необхідну нормальність після всіх труднощів, які приніс Лаосу цей десятиліття в Азії та в Сфері співпраці."
 WORLD.16805.a: "Свобода живе в Лаосі."

 WORLD.16806.t: "[Get_newspaper_header]Перемога національно-прогресивної партії на виборах у Лаосі 1967 року"
 WORLD.16806.desc: "PXKN Суванни Фоми здобув більшість місць на останніх виборах в Лаосі, вступивши в коаліцію з LRS, очолюваною Бонгом Суваннафонгом. Відповідно до їхньої програми, PXKN прагне досягти більшої індустріалізації та експлуатації ресурсів через співпрацю з Японією, а також до зміцнення демократичних інститутів, захисту меншин і боротьби з епідемією опіуму. Протилежна на політичному спектрі партія Бонга вибрана як посередник для лівих і правих, через ліві економічні погляди Бонга та консервативні соціальні погляди."
 WORLD.16806.a: "Добре для Лаосу."

 WORLD.16807.t: "[Get_newspaper_header]Перемога Незалежної партії на виборах у Лаосі 1967 року"
 WORLD.16807.desc: "Вибори в Лаосі 1967 року завершилися перемогою Фуї Сананікона з партії Phak Seri, яка здобула більшість голосів. Сананікон оголосив про формування нової коаліційної уряду з партією PXKN Суаванни Фоуми. Незважаючи на те, що традиціоналістська програма Сананікона, яка передбачає скорочення закордонної допомоги, посилення місцевого бізнесу та сильну монархію, суперечить заявленим цінностям PXKN, Фоума захищав це рішення як необхідне для уникнення нестабільності уряду меншості, а також для пом'якшення нової консервативної влади і забезпечення їх правління через компроміс, чітко відкидаючи свою особисту антипатію до правих. Новий уряд вже зазнав критики з боку лівих в Національних зборах, які, хоча і формально прийняли результати, звинувачують Phak Seri в прихованих методах і корупції."
 WORLD.16807.a: "Уряд компромісу."

 WORLD.16808.t: "[Get_newspaper_header]Перемога Незалежної партії на виборах у Лаосі 1967 року"
 WORLD.16808.desc: "У шокуючому повороті подій Phoui Sananikone з партією Phak Seri здобув більшість місць на виборах в Лаосі 1967 року, що дозволяє їм відмовитися від коаліцій та сформувати однопартійний уряд. Ще більш несподівано, партія уклала угоди підтримки з кількома незалежними членами зборів, відомими як найбільш жорсткі традиціоналісти та монархісти в лаоській політиці. Новий правлячий уряд рішуче виступає за розширення повноважень монархії та критикує ліберальні інститути, що призводить до критики з центру та лівих, а навіть японські благодійники Лаосу повідомляють про свою тривогу щодо нового уряду. Однак результати були юридично визнані, і Phak Seri буде правити наступні п'ять років, що ставить під сумнів майбутнє демократії Лаосу."
 WORLD.16808.a: "Мрія Пхетсаратха згасає."

 WORLD.16809.t: "[Get_newspaper_header]Спалах Опіумної війни"
 WORLD.16809.desc: "Протягом більше десяти років Королівська Лаоська Армія вела величезну торгівлю опіумом, змагаючись за Золоту трикутник з залишками КМТ на південь від Бірми та північ Таїланду. Напруження переросло у відкриті бої, коли залишки КМТ атакували позиції РЛА, намагаючись забезпечити свій контроль над наркоторгівлею.\n\nЛаос намагався представити свою відповідь як проактивну кампанію проти бандитів, але мало хто переконаний, що їхня Операція Сеттхатірат - це не більше ніж Опіумна війна. Крім того, багато хто сумнівається, чи зможе неорганізована, непослідовна РЛА виграти війну проти несподівано організованої опозиції. Оскільки РЛА та КМТ стикаються в нападах та сутичках по всьому Лаосу, Таїланду та навіть на кордоні Бірми, багато хто задається питанням, чи мобілізують останні дві країни свої сили, щоб покласти кінець цьому порушенню суверенітету."
 WORLD.16809.a: "Яка дивна війна."

 WORLD.16811.t: "[Get_newspaper_header]Невдала спроба перевороту в Лаосі"
 WORLD.16811.desc: "Щоб зберегти обличчя після поразки в Опіумній війні, Королівська Лаоська Армія спробувала здійснити переворот проти уряду В'єнтьяна. Лояльні до уряду сили мобілізувалися на його захист, і вже деморалізована РЛА була відправлена на одноденну битву в столиці. Очільник перевороту, Фуомі Носаван, втік з країни, а багато його співучасників були вбиті чи заарештовані під час боїв.\n\nВ останні години перевороту, Носаван знайшов несподіваного союзника: короля Сисаванга Ваттхану, який намагався надати монархістську підтримку РЛА. Його швидко оточили і заарештували урядові сили. Хоча король завжди мав беззаперечну підтримку в лаоському суспільстві, ця відкрита спроба захоплення влади завдала удару по беззаперечній легітимності цієї інституції. Деякі лаосці навіть закликають до скасування монархії."
 WORLD.16811.a: "Чи було вбито століття історії за один день?"

 WORLD.16812.t: "[Get_newspaper_header]Монархія збережена в Лаосі"
 WORLD.16812.desc: "Коли Сисаван Ваттхана оголосив про свою підтримку третього перевороту Фуомі Носавана, заклики до скасування монархії стали голоснішими в Лаосі. Однак люди дали свою згоду монархії на нещодавньому референдумі, результат якого був сприяний монархістськими маніпуляціями та слабкою опозицією. Хоча зрада Сисаванга Ваттхани вимагає його абдикації, Лаос залишатиметься під керівництвом короля.\n\nПолуелекторальна монархія Лаосу тепер поділяється на дві фракції: монархістів на чолі з Бун Оумом На Чампасаком, запеклим реакціонером, чия співпраця з Таїландом в Іссара викликає підозри серед патріотів; та олігархічну фракцію Фуї Сананікона, яка обрала молодого та вразливого Вонга Саванга. Як би там не було, вогонь республіканізму в Лаосі згас."
 WORLD.16812.a: "Мрія Пхетсаратха загублена, можливо, ніколи не здійсниться."

 WORLD.16813.t: "[Get_newspaper_header]Монархія скасована в Лаосі"
 WORLD.16813.desc: "Після невдалого перевороту Фуомі Носавана та підтримки короля Сисаванга Ваттхани цього перевороту, лаоський народ проголосував за скасування незаперечної монархії. Ця ініціатива, підтримана коаліцією NLHX-PXKN, стала також референдумом проти правих елементів лаоської політики, зокрема армії, яка не змогла стримати наркокартелі в фальшивій війні, та монархічної еліти, яка намагалася використати цю армію для утримання влади.\n\nПрем'єр-міністр Сухавонг залишався здебільшого мовчазним щодо результату, відповідно до його статусу безпристрасного тимчасового керівника, але провідні фігури NLHX та PXKN заявили, що це початок нової ери для Лаосу, ери процвітання та безпрецедентного прогресу. Це, на їхню думку, є кульмінацією спадщини Пхетсаратха: Лаос стане ліберальною демократичною державою без обтяжливої монархії."
 WORLD.16813.a: "Колишній король Сисаван Ваттхана не зміг бути досягнутий для коментарів."

 WORLD.16814.t: "[Get_newspaper_header]Комуністичний переворот в Лаосі"
 WORLD.16814.desc: "Відкрито або таємно багато хто звинувачував прем'єр-міністра Лаосу Суфанувонга в комуністичних симпатіях. Сьогодні Червоний Принц доводить їх правоту. Після успіху В'єт Мін, він не тільки оголосив підтримку новому уряду, але й залишив Сферу в знак солідарності. Нещодавно перейменована Лаоська Соціялістична Республіка тепер приєднується до В'єтнаму в зароджуючомуся незалежному комуністичному блоці в Азії.\n\nЦей крок є особливо несподіваним з урахуванням попереднього зобов'язання Суфанувонга щодо паназіатизму. Осудження з Японії настільки сильні, наскільки вони і заплутані, оскільки мільйони єн, вкладених в розвиток Лаосу, тепер більше не повертаються до Сфери. На внутрішньому фронті Суфанувонг заборонив кілька монархістських і правих партій та ввів представників ICP, які раніше не могли брати участь у лаоській політиці, до свого уряду, хоча мало що змінилося в існуючій демократичній структурі держави."
 WORLD.16814.a: "Ще одна поразка для Сфери."

 WORLD.17000.t: "[Get_newspaper_header]Затоплення Аоба Мару"
 WORLD.17000.desc: "На тлі затоплення японського риболовецького судна Аоба Мару поблизу Алеутських островів розпочались високорівневі дипломатичні переговори між Сполученими Штатами та Японською імперією.\n\nІнцидент набув широкого розголосу після того, як Японія звинуватила американське риболовецьке судно у навмисному затопленні Аоба Мару в японських водах біля острова Атту, а також після офіційних вибачень, повернення вижилих членів екіпажу Аоба Мару та здачі всіх американців, причетних до інциденту, щоб постати перед судом у Токіо за обвинуваченням у вбивстві.\n\nХоча офіційна відповідь Сполучених Штатів ще на шляху, перша пресреліз Державного департаменту наполягала на тому, що інцидент стався в американських водах, підкреслюючи, що японські піддані отримують належне ставлення під американським арештом."
 WORLD.17000.a: "Арктика нагрівається."
 
 WORLD.17001.t: "[Get_newspaper_header]США депортують екіпаж Аоба Мару"
 WORLD.17001.desc: "Світ затамував подих, коли депортований екіпаж Аоба Мару повернувся до Японії, що дозволило розв'язати зростаючий конфлікт між Сполученими Штатами та Японською імперією щодо морської зіткнення поблизу Алеутських островів.\n\nХоча Державний департамент та Міністерство закордонних справ опублікували скоординовані заяви, які висловлюють сподівання на відновлення нормальних дипломатичних відносин між двома країнами, анонімні джерела в Державному департаменті зазначили, що угода була досягнута після того, як Сполучені Штати усвідомили, що подальше утримання екіпажу Аоба Мару більше не відповідає інтересам США.\n\nДжерела в Токіо менш стримані, публікуючи статті в пресі, які вітають «перемогу японської престижності» та хвалять прем'єр-міністра [JAP.GetLeader] за управління конфліктом, незважаючи на повідомлення про напругу між Міністерством закордонних справ та збройними силами."
 WORLD.17001.a: "Так все і повинно бути!"
 
 WORLD.17002.t: "[Get_newspaper_header]Японія відмовляється від вимог щодо Аоба Мару"
 WORLD.17002.desc: "Світ затамував подих, коли депортований екіпаж Аоба Мару повернувся до Японії, що дозволило розв'язати зростаючий конфлікт між Сполученими Штатами та Японською імперією щодо морської зіткнення поблизу Алеутських островів.\n\nХоча Державний департамент та Міністерство закордонних справ опублікували скоординовані заяви, які висловлюють сподівання на відновлення нормальних дипломатичних відносин між двома країнами, анонімні джерела в Міністерстві закордонних справ та японських збройних силах зазначили, що угода була досягнута з США після того, як стало зрозуміло, що подальше тиск на вимоги вже не відповідає інтересам Японії.\n\nДжерела у Вашингтоні менш стримані, з відомими американськими політиками та газетами, які хвалять «перемогу американської престижності» і хвалять президента [USA.GetPresidentLastName] за керівництво конфліктом."
 WORLD.17002.a: "Так все і повинно бути!"
 
 WORLD.17003.t: "[Get_newspaper_header]Битва за Алеутські острови"
 WORLD.17003.desc: "Уряди Сполучених Штатів та Японської імперії вступили в стан війни після повідомлення про сутичку між американськими та японськими літаками над Алеутськими островами. Один літак від Військово-повітряних сил США та один літак з авіаносної групи Імперіального японського флоту зіткнулися в американському повітряному просторі, що призвело до широкої битви, в результаті якої обидві сторони зазнали значних втрат.\n\nІнцидент став жахливим завершенням кризи, розпочатої затопленням Аоба Мару, японського риболовецького судна, яке було тараном затоплене американським риболовецьким судном. Спікери обох урядів не були доступні для коментарів, але перспективи деескалації виглядають примарними після широкого громадського обурення в обох країнах і загибелі на обох сторонах.\n\nВійна виглядає неминучою."
 WORLD.17003.a: "І все через якихось креветок?!"

 WORLD.17100.t: "[Get_newspaper_header]Перемога партії Тjóðveldisflokkurin на Фарерських островах"
 WORLD.17100.desc: "Вибори на Фарерських островах принесли перемогу чинному президенту Ерлендуру Патурссону та його лівій партії Тjóðveldisflokkurin. Починаючи як партія, що підтримує незалежність Фарерських островів, Тjóðveldisflokkurin продовжить будувати свою коаліцію з лівою партією Javnaðarflokkurin з метою подальшого покращення рівня життя на Фарерських островах.\n\nНезважаючи на те, що партія не виступає проти подальшого членства у ОВН, вона більше схиляється до створення дорожньої карти щодо зменшення оборонних зобов'язань і посилення економічної самоврядності. Міжнародна реакція була обмеженою, хоча американські експерти з зовнішньої політики уважно стежили за ситуацією."
 WORLD.17100.a: "Демократія в дії."

 WORLD.17101.t: "[Get_newspaper_header]Коаліційне правління Javnaðarflokkurin на Фарерських островах"
 WORLD.17101.desc: "Після перемоги Свободної Англії в Англійській громадянській війні, довіра до здатності ОВН розширити свій вплив через Атлантику на Фарерських островах зросла до максимальних рівнів, що призвело до великої перемоги соціал-демократичної партії Пітера Моора Дама, Javnaðarflokkurin, на нещодавніх виборах.\n\nУтворивши коаліцію з соціально ліберальною партією Sjálvstýrisflokkurin та центристською партією Sambandsflokkurin, Моор Дам пообіцяв низку оновлених торгових угод з США та Англією з метою підвищення рівня життя серед населення Фарерських островів, а також інвестицій в інфраструктуру країни та морські кордони."
 WORLD.17101.a: "Демократія в дії."

 WORLD.17102.t: "[Get_newspaper_header]Смерть Пітера Моора Дама"
 WORLD.17102.desc: "Трагедія сталася на Фарерських островах, коли Пітер Моор Дам, старіючий президент і лідер партії Javnaðarflokkurin, помер на 70-му році життя. Після кількох місяців погіршення здоров'я, Моор Дам залишає свою коаліцію, якою тепер буде правити його син, Атлі Дам.\n\nНаступаючи по стопах батька, Атлі Дам обіцяє продовжити обіцянки батька щодо перегляду морських кордонів та залучення інвестицій з США та Великої Британії на Фарерські острови."
 WORLD.17102.a: "Невдовзі життя важке для того, хто носить корону."

 WORLD.17103.t: "[Get_newspaper_header]Утворена коаліція самоврядування на Фарерських островах"
 WORLD.17103.desc: "Статус-кво на Фарерських островах був потрясений, коли партія Фолькуфлоккурін, очолювана Хакуном Дьоргуусом, змогла об'єднати три головні про-незалежні партії Фарерських островів - Тjóðveldisflokkurin та Sjálvstýrisflokkurin - в єдиний злагоджений блок.\n\nТепер, коли три основні партії об'єдналися, блок має намір покласти край нерівному та експлуататорському відношенню між Фарерськими островами та Сполученими Штатами, що зрештою призведе до переговорів між двома країнами, що спричинять вихід Фарерських островів з ОВН."
 WORLD.17103.a: "Камінь викликає хвилі."

 WORLD.17104.t: "[Get_newspaper_header]Фарерські острови покидають ОВН"
 WORLD.17104.desc: "Ще один удар по атлантичному фронту для ОВН сьогодні, оскільки Фарерські острови, які колись були частиною Данії, а тепер є ще одним опорним пунктом для військової потуги Сполучених Штатів у регіоні, подали позов про вихід з ОВН. Після недавнього виходу Ісландії з альянсу геополітична структура регіону була повністю порушена, і США намагаються утримати ситуацію, щоб навіть Гренландія залишалася в ОВН.\n\nЦей розвиток подій має деякі застереження для Фарерських островів; гарантія без власних зобов'язань залишає Америку зобов'язаною захистити мікродержаву у разі вторгнення. Хоча на островах всього близько тридцяти тисяч осіб, святкування були тим не менш радісними і широко поширеними, при цьому уряд бере на себе основну заслугу за це безумовно історичне досягнення."
 WORLD.17104.a: "Скільки ще ми це можемо витримати?"
 WORLD.17104.b: "Як вони це називають? Теорія доміно?"
 WORLD.17104.c: "Вони або геополітичні генії, або повні ідіоти."
 WORLD.17104.d: "Усього найкращого. Тільки не для нас."

 WORLD.17105.t: "[Get_newspaper_header]Гренландія отримала право на самоврядування"
 WORLD.17105.desc: "Ще один удар по Сполучених Штатах сьогодні на атлантичному фронті, оскільки Гренландія успішно лобіювала право на самоврядування від США. Після того, як партія Суімут під керівництвом Джонатона Мотцфельта зібрала велику підтримку серед населення, США погодилися надати колишній території Гренландії незалежність.\n\nБагато міжнародних спостерігачів зазначили, що основним каталізатором цього розділення стало відсутнє інвестування в Гренландію та непропорційна залежність від острова для регіональних військових маневрів. Це сталося після важкого удару у вигляді виходу Ісландії з ОВН та початку віддалення Фарерських островів від США, обидва випадки залишили багатьох людей у питанні про можливе занепадання потуги США в Північному Атлантиці."
 WORLD.17105.a: "Світ вільних став трохи темнішим."
 WORLD.17105.b: "Не лебенсраум, але майже."
 WORLD.17105.c: "Північний фланг ОВН слабшає."
 WORLD.17105.d: "Ну це добре. Тільки не для нас."

 WORLD.17200.t: "[Get_newspaper_header]Нова столиця в Белізі"
 WORLD.17200.desc: "Після значних планувань, мільйонів інвестицій і років важкої праці, прем'єр-міністр Белізу [BLZ.GetLeader] і його уряд оголосили про завершення будівництва нової столиці-Бельмопан. Нове місто, назва якого є поєднанням слова «Беліз» та річки Мопан, замінює стару столицю Беліз-Сіті, яка була знищена ураганом Хетті кілька років тому.\n\nХоча воно мале і не має історії свого попередника, нова столиця знаходиться далеко вглиб країни, на висоті 75 метрів над рівнем моря, що значно краще захищає її від стихійних лих. Хоча багато урядів висловлюють скептицизм і сумніви, Беліз вже переміщає уряд до нового міста та заохочує переселення громадян. Багато хто сподівається, що Бельмопан може стати новим початком для цієї маленької нації."
 WORLD.17200.a: "Місто надії, місто обіцянок."

 WORLD.17201.t: "[Get_newspaper_header]Перемога НІП в Белізі"
 WORLD.17201.desc: "Після довгих годин підрахунку голосів Беліз здивував спостерігачів, надавши Національній партії незалежності більшість у своїй Палаті представників. Результат вважається великою сенсацією в маленькій країні, політичну сцену якої до цього часу домінувала Народна партія об'єднання та харизматичний Джордж Кедл Прайс після закінчення війни. У своїй промові, яка була транслювана вранці, лідер НІП Філіп Голдсон подякував нації за підтримку.\n\nТепер увага громадськості зосереджена на Голдсоні і тому, як він сформує уряд. Хоча Національна партія незалежності є новою на політичній сцені, об'єднавши кілька менших партій, її члени вважаються прихильниками ОВН і зацікавленими в налагодженні тісніших зв'язків з британськими та американськими лідерами - здебільшого для того, щоб захистити себе від Гватемали. Вже були відправлені дипломати, щоб визначити, як інтегрувати Беліз у оборонний пояс ОВН."
 WORLD.17201.a: "Старі сили, нові угоди."

 WORLD.17202.t: "[Get_newspaper_header]Перший крок Белізу до деколонізації"
 WORLD.17202.desc: "У довгоочікуваному, але важливому політичному кроці, країна Беліз сьогодні почала процес деколонізації - офіційно змінивши свою назву з «Британське Гондурас» та прибравши Союзний прапор з його прапора. Цей крок супроводжувався хореографованою публічною церемонією за участю прем'єр-міністра [BLZ.GetLeader], королівського губернатора-генерала та представника англійського уряду.\n\nХоча юридично Беліз залишається самоврядною колонією під британською короною, цей крок є офіційним визнанням статусу Белізу як незалежної нації і першим кроком у більш широкому процесі здобуття незалежності, погодженому з урядом Свобідної Англії. Навіть коли Гватемала виступила з заявою, засуджуючи «штучну націю», святкування було чути по всій маленькій країні."
 WORLD.17202.a: "Довгоочікуване дихання свіжого повітря."

 WORLD.17203.t: "[Get_newspaper_header]НОП обрана в Британському Гондурасі"
 WORLD.17203.desc: "На шок для всіх, лівоцентристська Народна об'єднана партія перемогла на останніх белізьких виборах. Багато хто вважав, що НОП, націоналістична ліва партія на чолі з палким оратором Джорджем Прайсом, буде надто маргінальною, щоб здобути владу в колонії. Із радикальною економічною політикою, зосередженою на перерозподілі землі та націоналізації, вони пообіцяли покласти край, або принаймні перезаключити канадське правління.\n\nОскільки Канада та її населення, здається, втомилися від тривалого колоніального утримання, а також з огляду на обіцянку НОП налагодити тісніші стосунки з Гватемалою, угода з новим режимом видається цілком можливою. На запитання про можливу угоду з Канадою прем'єр-міністр Джордж Прайс відповів, що "народ і його уряд були б лише раді угоді, яка приносить взаємну користь." Жодного канадського представника не вдалося дістати для коментаря.\n"
 WORLD.17203.a: "Революція через виборчу урну."

 WORLD.17204.t: "[Get_newspaper_header]Переговори ОАД щодо Британського Гондурасу"
 WORLD.17204.desc: "В одній із найважливіших подій сучасної історії Центральної Америки Організація американських держав звела Беліз і Гватемалу за столом переговорів щодо незалежності Белізу. Після десятиліть конфлікту ця зустріч може стати найбільшою надією на мир між двома націями.\n\nВже десятиліттями Гватемала заявляє права на весь Британський Гондурас як на свою законну територію. Їхні вимоги на переговорах були доволі агресивними - вони прагнули об'єднання двох країн. Беліз, своєю чергою, не вимагав нічого меншого за повну незалежність.\n\nХоча Мексика підтримувала Гватемалу протягом усього цього, і її вплив як регіональної держави не варто скидати з рахунків, вирішальну роль у переговорах, здається, відіграють США. Державний секретар США заявив, що США "сподіваються стати посередником у конфлікті та досягти угоди, яка забезпечить тривалий мир між двома країнами."\n"
 WORLD.17204.a: "Великий день для малих націй."

 WORLD.17205.t: "[Get_newspaper_header]Підписано белізько-гватемальський договір"
 WORLD.17205.desc: "Беліз і Гватемала були розділені з самого початку, і схоже, ця реальність найближчим часом не зміниться. Оскільки переговори за посередництва ОАД між двома націями завершились договором на користь Белізу, маленька нація здобула повну незалежність в обмін на незначні поступки гватемальській державі. Хоча договір передбачає можливість прикордонних референдумів у майбутньому, зміни, що відбудуться, ймовірно будуть незначними, і водночас це знаряддя обопільного вжитку, яким можуть скористатися й белізці.\n\nВидатні гватемальські політики звинуватили угоду в тому, що вона є продуктом вашингтонського примусу, у якому гватемальці не мали жодного голосу, а декілька мексиканських делегатів також повідомили про подібний досвід під час переговорного процесу. Схоже, Центральна Америка не отримає того спокою, якого прагне.\n"
 WORLD.17205.a: "Шахова партія для велетнів, і Дядько Сем переміг."

 WORLD.17206.t: "[Get_newspaper_header]Погоджено белізько-гватемальський союз"
 WORLD.17206.desc: "Між Гватемалою та Белізом ніщо не розділяло братів, окрім переліку архаїчних колоніальних законів - і лише нещодавно переговори за посередництва ОАД призвели до договору, що виправляє цей несправедливий поділ. Визнаючи окреме врядування белізького народу через утворення автономного регіону під керівництвом НОП, Беліз тепер перебуває у постійному союзі з гватемальською державою через угоду за посередництва Мексики, яку вирішили підтримати Сполучені Штати.\n\nУспішне об'єднання двох націй знаменує поворотний момент в американо-гватемальських відносинах, оскільки бюрократи на півдні дедалі більше довіряють добрим намірам північного гегемона. Заднє подвір'я Америки знову спокійне, а белізькі волання - лише тихе цвірінькання в майянських лісах."
 WORLD.17206.a: "Дещо втрачаєш, та більше повертаєш."
 
 WORLD.17207.t: "[Get_newspaper_header]Переворот Добровольчої гвардії в Британському Гондурасі"
 WORLD.17207.desc: "Нещодавня тенденція нестабільності та урядового краху в Гватемалі поширилась на Британський Гондурас після несподіваного державного перевороту, здійсненого англофільською, антигватемальською міліцією Добровольчої гвардії. Надходить дедалі більше повідомлень про вуличні сутички між прихильниками поваленої НОП та Добровольчою гвардією, причому режим вдається до публічних чисток чиновників, пов'язаних з НОП, за ліві симпатії.\n\nОттава не видала жодної публічної заяви із засудженням незаконного повалення обраного уряду свого підданого. Однак інсайдери повідомляють про занепокоєння щодо триваючої нестабільності як можливого приводу для майбутнього втручання. Білий дім відмовився коментувати це питання, окрім заяви, що висловлює "надію на швидке відновлення миру"."
 WORLD.17207.a: "Вже не переймаються тим, щоб тримати руки чистими."

 WORLD.17208.t: "[Get_newspaper_header]Повстання НОП придушене в Британському Гондурасі"
 WORLD.17208.desc: "Після того, як канадці вирішили залишити Британський Гондурас напризволяще, Сполучені Штати, виконуючи свій обов'язок тримати заднє подвір'я в чистоті, втрутились, аби військово окупувати колишню канадську гарнізонну колонію, розбивши будь-яку надію на гватемальське вторгнення. Відтоді англофільська Добровольча гвардія змогла придушити повстання НОП за підтримки Америки та відновити колоніальний лад.\n\nОднак, попри збереження незалежності Британського Гондурасу, підтримка Америкою Добровольчої гвардії погіршила її дипломатичне становище з багатьма латиноамериканськими державами. Гватемала, вважаючи втручання незаконним, вирішила закрити всі дипломатичні канали з Вашингтоном і закликає до міжнародної відплати проти північного велетня."
 WORLD.17208.a: "Земля - не завжди перемога."

 WORLD.17209.t: "[Get_newspaper_header]Гватемала анексує Британський Гондурас"
 WORLD.17209.desc: "Як і очікувалось, Гватемала швидко розправилась з Добровольчою гвардією Британського Гондурасу після короткого й рішучого вторгнення в цю крихітну державу - проте вона теж стомилась від безперервних протестів белізької НОП за їхню самопроголошену "свободу". Кілька гватемальських чиновників оголосили про намір анексувати Беліз як регіон без жодного особливого статусу, наголошуючи, що жодних додаткових політичних привілеїв для наявних белізьких інституцій не буде.\n\nЦя раптова зміна політики спричинила повстання в населених центрах регіону; втім, більшість із них були швидко придушені гарнізонними гватемальськими військами, а захоплених лідерів повстанців, за повідомленнями, тримають у "нелюдських умовах" без жодних ознак майбутнього справедливого суду."
 WORLD.17209.a: "Леопарди з'їли їхні обличчя."

 WORLD.17210.t: "[Get_newspaper_header]Белізу надано автономію після гватемальського вторгнення"
 WORLD.17210.desc: "Як і очікувалось, Гватемала швидко розправилась з Добровольчою гвардією Британського Гондурасу після короткого й рішучого вторгнення в цю крихітну державу. Дотримуючись своєї обіцянки белізькій НОП, яка співпрацювала з гватемальськими військами в обмін на гарантію самовизначення регіону після інтеграції, було засновано "Автономну Республіку Беліз" як квазінезалежну одиницю в складі гватемальської держави, що дозволяє НОП діяти на власний розсуд.\n\nДжордж Прайс, новий очільник уряду Автономної Республіки, наполегливо працює над запобіганням внутрішньому інакодумству. Більшість міжнародної аудиторії вже вважали белізьку незалежність втраченою справою, тож реакція на цю незаконну анексію була стриманою.\n"
 WORLD.17210.a: "Один із кращих результатів поза межами сліпого оптимізму."
 
 
 WORLD.2085.t: "[Get_newspaper_header]Велика змова"
 WORLD.2085.d: "Незвичайні чутки з'явилися з глибин Японії, що окупувала Китай. Після арешту генерала Сунь Дяньїна, який був на боці Нанкіна, чутки про велику змову поширюються з блискавичною швидкістю - змова, що стосується давно загубленого колишнього лідера Цзюньтуну, Дай Лі. Китайський сільський регіон охоплений терором, оскільки Дай Лі був відомий своєю жорстокістю за часів Чан Кайші.\n\nТокіо, однак, відмовляється коментувати чи визнавати ситуацію з Дай Лі, називаючи це «імперіалістською дезінформацією про паназійську гармонію» або «антиніпонською змовою». Однак є чутки, що змова пов'язана з найвищими колами японської військової розвідки - і лише час покаже, чи це правда."
 WORLD.2085.a: "Можливо, це правда."
 
 WORLD.2086.t: "[Get_newspaper_header]Стандофф у Токіо!"
 WORLD.2086.d: "«Велика змова», як її називають у Японії, переросла в ще більше кровопролиття і насильство, оскільки бунтівні частини Імперської японської армії захопили позиції на околицях Токіо. Вони заявляють, що є «охоронцями кокутай» і «захисниками тенно», і фактично заблокували Токіо. Варто зазначити, що імператорська родина була тимчасово евакуйована до Кіото, через побоювання за їхню безпеку.\n\nГоворять, що цей стандофф у Токіо спричинений параноїдальними настроями в японському суспільстві через «Велику змову». Брат підозрює брата, підлеглий звинувачує начальника - ієрархія імперської японської армії вибухнула в анархію. Лише час покаже, чи Токіо зможе впоратися з цією ситуацією."
 WORLD.2086.a: "Чи зійшла імперія Японії з розуму?"
 
 # DEPRECATED VIETNAM LOC #
 #WORLD.16501.t: "[Get_newspaper_header]Peace Has Been Brought to Vietnam"
 #WORLD.16501.d: "After years of abortive, uphill negotiations between the Communist Party of Vietnam and the Empire of Vietnam, the two parties finally came to an agreement regarding a peace in the region. The Nagasaki Accord is hailed by its signatories as a symbol of a new age for Vietnam, and establishes a path for the future of the country in the Co-Prosperity Sphere.\nIn the settlement, it has been agreed that Emperor Bao Dai is to abdicate following public elections, and the status of Vietnam as a Japanese partner is to be elevated in the near future. Thousands have gathered in Vietnam's major cities to celebrate the end of political conflict across the nation, but various members of the imperial court, as well as Prime Minister Ngo Dinh Diem, have vanished from the public sphere following their harsh disapproval of the accords. What remains, however, is a tense peace between the Vietnamese government and the Viet Minh, now forced to share the young and fragile republic.\n"
 #WORLD.16501.a: "Fresh air, at last."
 
 #WORLD.16502.t: "[Get_newspaper_header]Emperor Bao Dai Abdicates as Communists Sweep Into Power"
 #WORLD.16502.d: "The results were worse than he could have imagined. There was little he could have done to sway the Vietnamese people to maintain him as emperor, but as the fireworks shot up through the streets of Hanoi, Saigon, and Hai Phong, there was no reason to continue listening to the results on the radio.\n79% in favor of the Communist Party, and as such his own abdication. Nearly four of every five Vietnamese men. Sure, the soldiers were as afraid of Ho Chi Minh's new government as he was, and most of the politicians wanted to hold onto their rank. Prime Minister Dien vanished in the night, the coward likely running with as much gold, generals, and higher-ups.\nThose that were left stayed inside the royal complex, listening to Ho Chi Minh's speech from every television inside, as did every Vietnamese who was lucky enough to have one."
 #WORLD.16502.a: "Not with a bang, but with a whimper."
 
 #WORLD.16503.t: "[Get_newspaper_header]Emperor Bao Dai Abdicates as Communists Sweep Into Power"
 #WORLD.16503.d: "The socialist world grew larger as the Communist Party of Vietnam has won the country's first elections in a landslide. Just under 80% of the votes in the entire country were cast for the CPV, granting it near-absolute control over the country. Ho Chi Minh, the longtime leader of the Party, is expected to become the nation's new President after the abdication of the emperor of Vietnam.\nSpeaking from his residence in Hanoi, the revolutionary leader has promised sweeping land reform and the institution of workers' rights, to the celebration of the people. The imperial house has given a perfunctory statement congratulating Ho Chi Minh on his victory, although rumors of the family fleeing the country have been rife. Regardless, it remains to be seen if his administration will deliver on its promises."
 #WORLD.16503.a: "A toast to the late Ho Chi Minh, and to his Vietnam!"
 #WORLD.16503.b: "Only the sun and truth shine on the people."
 
 #WORLD.16504.t: "[Get_newspaper_header]The Empire of Vietnam Adopts a Constitution"
 #WORLD.16504.d: "Among the many harsh regimes the Japanese Empire has supported across the Sphere, few come close to the brutality of the Vietnamese emperor. His rule is unforgiving as millions toiled to extract the wealth of their land to provide the materials for the Home Islands. Today, the people of Vietnam have regained their hope.\nAfter years of negotiations between the Viet Minh and Emperor Bao Dai, with the aid of the Japanese, a pact created by late rebel leader Ho Chi Minh has been put into place. The emperor's power has been greatly curtailed, and a referendum on the status of the monarchy will be held after his death. Viet Minh leader Truong Chingh is reportedly pleased with the accords, and proclaimed that it will be the start of a new and free Vietnam.\nSoldiers returning home are welcomed with celebration, as while neither side has won, the bloodshed has finally ended."
 #WORLD.16504.a: "Their hearts and minds have been won."
 
 #WORLD.16506.t: "[Get_newspaper_header]Death of President Ho Chi Minh"
 #WORLD.16506.d: "Soon after becoming the first President of the Republic of Vietnam, Ho Chi Minh had fallen ill and died surrounded by his friends and comrades. After a lifetime's struggle fighting for the independence of his nation, the late Vietnamese President is now mourned by millions across Indochina for his toils and leadership in the face of foreign domination.\nHis solemn funeral service is attended by many in government, including the new President Truong Chinh, who was elected from his position as General Secretary of the Communist Party following a vote by the Politburo. He gave a moving and hopeful speech, reminding the people of Vietnam that death does not conquer the fight for independence, and that "Uncle Ho's" fight for the nation's freedom has not been in vain."
 #WORLD.16506.a: "A tragic day."
 #WORLD.16506.b: "A toast to our liberation, we salute you."
# His actual name is Trường, but the game can't display that yet
 
 #WORLD.16507.t: "[Get_newspaper_header]Death of Ho Chi Minh"
 #WORLD.16507.d: "In the darkest retreats of the Northern Vietnamese wilderness, a silence fell over the buzzing jungles upon the death of Ho Chi Minh. His lifeless body, watched over by his speechless comrades and friends, was still and peaceful. A memorial was held for him in a nearby village by the Hong River as news of his death was radio broadcasted across the region. Countless civilians took to the streets to mourn his death, including the thousands of guerrillas in the Viet Minh who had been trained under his leadership.\nWith his passing, Truong Chinh has taken full control of the Communist Party; his mournful resolve leads him to now conduct peace talks with Bao Dai and the Japanese his people have been resisting against since 1941. The Viet Minh have offered to put down their arms and enter talks for the future of a better Vietnam, free from the war and violence that has plagued their country for decades."
 #WORLD.16507.a: "Do the Japanese feel as benign?"
 # DEPRECATED VIETNAM LOC #
 
 WORLD.16508.t: "[Get_newspaper_header]Смерть імператора Айсін-Ґіоро Пуї"
 WORLD.16508.d: "Імператор Манчжурії, Айсін-Ґіоро Пуї, помер від невідомої медичної причини. Незважаючи на те, що згадана медична проблема була смертельною, Пуї не відомо, щоб він перебував у лікарні перед своєю смертю, натомість він помер у своїх покоях. Смерть Пуї принесла сум по всьому Дай Тōа Кьоекен, хоча народ Манчжурії, згідно з усіма повідомленнями, ставився до новини з байдужістю або апатією. Похорон Пуї відвідали політичні та соціальні лідери з усієї Азії, зокрема імператор Японії Хірогіто, попри проблеми зі здоров'ям через довгі перельоти до і з Манчжурії. Його тіло було поховане в "Північних гробницях Цін" у частині, що називається "Гробниця Спокою". Наступник Пуї, Пуджі, вже продемонстрував себе як більш активний і завзятий, ніж його попередник, хоча це не є високим стандартом."
 WORLD.16508.a: "Ім'я, втрачене для історії."
 WORLD.16508.b: "Чоловік, якого ніхто ніколи не знатиме."
 
 WORLD.16509.t: "[Get_newspaper_header]Смерть монгольського принца Демчуґдондруба"
 WORLD.16509.d: "Принц Демчуґдондруб, політичний і військовий лідер монгольських степів, помер після важкого випадку шлункового грипу. Хоча він був мало відомим лідером, його підтримувачі вважали його одним з найвеличніших лідерів монгольського народу завдяки його зусиллям з об'єднання Зовнішньої та Внутрішньої Монголії. Його критики були менш милостивими, вважаючи його підступним співробітником японських колоніальних амбіцій.\n\nЙого похорон був помітно порожнім для смерті голови держави, найбільшим представником Японії був посол у Нанкіне. Аналітики в регіоні очікують, що його наступником стане харизматичний принц Дугурсуолонг, посилаючись на його несподівану популярність серед двору і народу, що дозволяє йому успадкувати роль Демчуґдондруба як чемпіона Пан-Монголізму."
 WORLD.16509.a: "На плечах одного чоловіка нація."
 WORLD.16509.b: "Ляльковий театр, і нитки обрізані."
 
 #Indonesian Civil War
 
 WORLD.16516.t: "[Get_newspaper_header]Абдулгані призначений прем'єр-міністром Індонезії"
 WORLD.16516.d: "Після недавньої критики його внутрішніх реформ, Сукарно оголосив про призначення Руслана Абдулгані на посаду прем'єр-міністра, замінивши покійного Джуанду Картавіджаджу.\n\nБлизький друг президента та відданий прихильник його програм централізації, прем'єр-міністр Абдулгані прагне прискорити націоналізацію іноземних підприємств і централізацію всієї адміністративної влади в Джакарті, заявляючи про важливість "прискорення повернення багатств Індонезії з жадібних пазурів Заїбадзу та токійських маріонеток."\n\nЗ огляду на їхню загальновідому дружбу, багато хто розглядає це як ще один доказ прагнення Сукарно перебудувати систему країни таким чином, щоб зосередити всю владу у своїх руках, значною мірою на шкоду власному народу."
 WORLD.16516.a: "Демократія в'яне, але ніхто не аплодує."
 
 WORLD.16517.t: "[Get_newspaper_header]Харахап призначений прем'єр-міністром Індонезії"
 WORLD.16517.d: "У відповідь на зростаючу опозицію до його зусиль із централізації влади на Яві, президент Сукарно оголосив, що вакантну посаду після смерті Джуанди Картавіджаджі займе Бурхануддін Харахап, чиє призначення на посаду прем'єр-міністра, безсумнівно, є поступкою для стримування критики.\n\nПоміркований голос серед тих, хто засуджує агресивну політику Сукарно, прем'єр-міністр Харахап був тепло прийнятий більшістю політичного істеблішменту країни. Однак спостерігачі швидко зазначили, що створення широкого ісламського політичного фронту може ще більше розділити, а не об'єднати, особливо серед власних прихильників президента, між секулярними націоналістами та ярими прискорювачами явської централизації."
 WORLD.16517.a: "Одну проблему вирішено, інша з'являється."
 
 WORLD.16518.t: "[Get_newspaper_header]Леймена призначений прем'єр-міністром Індонезії"
 WORLD.16518.d: "Попри зростаючу опозицію до його політики, але без наміру відступати від своїх планів, Сукарно оголосив про призначення Йоханнеса Леймена, відомого як "Ом-Джо", на посаду прем'єр-міністра Індонезії замість покійного Джуанди Картавіджаджі.\n\nПісля роботи на посаді міністра закордонних справ під керівництвом покійного прем'єра Джуанди, Леймена отримав схвалення більшості політичного кола країни. Однак багато хто сумнівається, чи вдасться новому прем'єр-міністру сформувати своє бачення стабільної, процвітаючої Індонезії на тлі зростаючої фракційності, яка зараз охоплює націю. Лише час покаже, чи зможе цей досвідчений адміністратор об'єднати настільки розділений народ."
 WORLD.16518.a: "Залишився з розбитим дзеркалом і змушений збирати уламки."
 
 WORLD.16519.t: "[Get_newspaper_header]Військовий стан в Індонезії"
 WORLD.16519.desc: "У шокуючому повороті подій президент Сукарно оголосив наступний крок індонезійської революції, запровадивши військовий стан після спроби перевороту поблизу Джакарти. У світлі цієї плутанини президент призупинив діяльність кабінету та націоналізував японські активи в країні як "наступний крок економічного розвитку Індонезії."\n\nДії президента Сукарно отримали швидке засудження. Уряд Японії вже виступив із протестом і, ймовірно, вимагатиме пояснень від Джакарти. Індонезійські сили безпеки розтягнуті через протести проти військового стану, які охопили архіпелаг через це поляризуюче рішення.\n\nСША, плутаючись у подіях, поки що реагують повільно, але закликають Сукарно прислухатися до голосу народу."
 WORLD.16519.a: "А якщо армія не витримає?"

 WORLD.16520.t: "[Get_newspaper_header]Громадянська війна в Індонезії"
 WORLD.16520.desc: "Давно киплячий казан в Індонезії нарешті вибухнув. Після короткого зникнення з Джакарти віцепрезидент Мохаммад Хатта з’явився в Суматрі разом із групою генералів-повстанців, щоб очолити Вільний уряд Республіки Індонезія (PRIM).\n\nМета Вільного уряду – покласти край правлінню президента Сукарно, яке вони вважають диктаторським через посилену централізацію. PRIM прагне повернутися до конституції 1949 року, яка обіцяє більше автономії віддаленим регіонам Індонезії.\n\nВільний уряд також засудив, на їхню думку, надмірно підлеглу позицію Сукарно щодо японців. У той час як насильство спалахує по всій країні, стає очевидним, що Японія знову не змогла запобігти збройному конфлікту у своїй сфері. Кулі літають через сонні села, коли брат бореться проти брата: почалася громадянська війна в Індонезії."
 WORLD.16520.a: "Розбита нація."
 WORLD.16520.b: "Цих повстанців потрібно розбити!"
 WORLD.16520.c: "Навіть мавпи падають з дерев..."
 WORLD.16520.d: "Ми повинні кувати залізо, поки гаряче."

 WORLD.16521.t: "[Get_newspaper_header]Перемога Вільної Індонезії"
 WORLD.16521.desc: "Коли пил осідає над зруйнованою Джакартою, стає зрозуміло, що Мохаммад Хатта та Вільний уряд – за щедрої підтримки США та Австралії – перемогли в громадянській війні в Індонезії.\n\nВійна завдала величезної шкоди Індонезії, і відновлення збитків є найважливішим із багатьох завдань нового уряду. Попри це, Хатта не прагне повернутися до старих порядків. Він і багато інших в Індонезії хочуть створити новий політичний лад, значно менш централізований, ніж режим Сукарно.\n\nСам Хатта став своєрідним революційним символом. У Джакарті поширюються чутки про невдоволення таким статусом, особливо серед полковників, які керували військовою кампанією. Ці проблеми вирішуватимуться пізніше."
 WORLD.16521.a: "На разі лише мир."

 WORLD.16522.t: "[Get_newspaper_header]Індонезія долає повстанців"
 WORLD.16522.desc: "Тиша огортає Індонезію. За допомогою японської армії Сукарно разом зі своїми генералами та збройними силами ROI успішно придушив численні повстання на архіпелазі, здобувши перемогу в громадянській війні в Індонезії.\n\nБагато чого повернеться до нормального стану, але також зрозуміло, що не все може залишитися, як було. По-перше, імідж Сукарно був заплямований через його нездатність запобігти цій війні.\n\nМожливо, ще важливіше те, що армія тепер має більше влади, ніж будь-коли раніше, оскільки вона виграла для Сукарно другу війну за Індонезію. Ці виклики та інші проблеми потрібно буде вирішувати в майбутньому."
 WORLD.16522.a: "На разі лише мир."

 WORLD.16523.t: "[Get_newspaper_header]Президент Сукарно йде у відставку"
 WORLD.16523.desc: "Здається, кризи Індонезії зрештою стали нестерпними. У спробі об'єднати націю Сукарно помилував Мохаммада Гатту, лідера Вільної Індонезії. Це врешті-решт обернулося проти Президента: радикальні праві фракції заявили про свою опозицію уряду.\n\nЩе гірше те, що ключових поміркованих генералів армії Республіки Індонезія було вбито радикальними членами Президентської гвардії. Розпуск уряду Вільної Індонезії мав принести полегшення від хаосу. Але цього не сталося.\n\nХаос відкрив шлях Зулкіфлі Любісу, одному з колишніх військових лідерів Вільної Індонезії, увійти до Джакарти в супроводі урядового генерала Сухарто. Втративши контроль, Сукарно передав владу Любісу та Сухарто, які стануть, відповідно, Президентом та Віцепрезидентом.\n"
 WORLD.16523.a: "Чи зможуть вони врятувати Індонезію від її останньої кризи?"

 WORLD.16524.t: "[Get_newspaper_header]Президент Сукарно йде у відставку"
 WORLD.16524.desc: "Сукарно пережив здобуття незалежності та громадянську війну, але не зміг пережити цю кризу. Індонезія вже перебувала у надзвичайному стані після того, як поміркованих генералів індонезійської армії вбили радикальні лівацькі елементи, які, вочевидь, проникли до Президентської гвардії.\n\nПотім з'явилися чутки про комуністичну змову з метою повалення Сукарно, що швидко призвело до чисток та масового насильства проти лівих - підозрюваних чи ні - яке завдало шкоди як Вільному уряду, так і національному уряду. Не маючи іншого вибору, Сукарно пішов у відставку, заявивши, що це на благо нації, і проголосив Сухарто своїм наступником.\n\nГатту - колишнього цивільного голову уряду Вільної Індонезії - ніде не можуть знайти, і вважається, що він утік з країни. Один з його колишніх командирів, Зулкіфлі Любіс, відтоді заявив про свою підтримку режиму Сухарто.\n"
 WORLD.16524.a: "Хаос добігає кінця, але це ще не кінець."

 WORLD.16525.t: "[Get_newspaper_header]Мир в Індонезії"
 WORLD.16525.desc: "Громадянська війна в Індонезії нарешті добігла кінця, коли Президент Зулкіфлі Любіс оголосив про придушення всіх повстанських сил, що діяли на теренах індонезійського архіпелагу. Президент Любіс - лише нещодавно приведений до влади після шокової відставки Сукарно - оголосив день святкувань, оскільки Індонезія вступила в еру зцілення та політичного оновлення.\n\nЗдатність Любіса виконати свої обіцянки ще належить перевірити. Значна частина індонезійської провінції за межами Джакарти лежить у руїнах після років війни, а ентузіазм щодо заяви Любіса був помітно стриманим - навіть у колишніх повстанських бастіонах, таких як Суматра та Сулавесі - оскільки військове минуле Любіса та його хаотичне піднесення до влади змушують багатьох сумніватися в його справжніх намірах щодо спустошеної країни.\n\nСполучені Штати передали обережне повідомлення підтримки Президенту Любісу.\n"
 WORLD.16525.a: "Мир?"

 WORLD.16526.t: "[Get_newspaper_header]Мир в Індонезії"
 WORLD.16526.desc: "Громадянська війна в Індонезії нарешті добігла кінця, коли Президент Сухарто оголосив про придушення всіх повстанських сил, що діяли на теренах індонезійського архіпелагу. Президент Сухарто - нещодавно приведений до влади як лідер Індонезії після шокової відставки Сукарно - оголосив перший день Нового порядку в Індонезії, присягнувшись іти революційним шляхом свого попередника.\n\nЗдатність Сухарто виконати свою заяву залишається непевною. Окрім спустошення, що охопило острови Індонезії після років війни, насильницькі обставини піднесення Сухарто до влади продовжують розгортатися по всій країні. Чутки, що доходять до іноземних кореспондентів у Джакарті, свідчать про виявлення та ліквідацію підозрюваних лівих елементів, звинувачених у змові проти уряду.\n\nЯпонія передала обережне повідомлення підтримки Президенту Сухарто.\n"
 WORLD.16526.a: "Мир?"

 WORLD.16527.t: "[Get_newspaper_header]Президента Любіса повалено"
 WORLD.16527.desc: "Кореспонденти повідомляють про похмурий стан шоку, що охопив Джакарту, коли місто відкрило свої брами силам опору проти колишнього Президента Зулкіфлі Любіса, який зник зі столиці за одну ніч. Опозиція новому уряду Любіса - зосереджена навколо радикальних правих залишків війська Сукарно - здійснила приголомшливий контрнаступ, зрештою пробившись на Яву.\n\nГенерал Бамбанг Супено проголосив себе Президентом, пообіцявши повернутися до політичних засад Сукарно, свого далекого родича. Окрім тривожної політичної спадщини, яку він заявляє успадкувати, Супено також розпочав репресії проти будь-яких і всіх постатей, пов'язаних із відставкою Сукарно, присягнувшись викорінити будь-яку змову, що діє проти інтересів індонезійської держави - переслідування, кероване помстою.\n\nТокіо та Вашингтон випустили стримані заяви про визнання нового уряду.\n"
 WORLD.16527.a: "Індонезія в попелі."
 
 WORLD.16528.t: "[Get_newspaper_header]Президента Сухарто повалено"
 WORLD.16528.desc: "Кореспонденти повідомляють про похмурий стан шоку, що охопив Джакарту, коли місто відкрило свої брами силам опору проти колишнього Президента Сухарто, який зник зі столиці за одну ніч. Опозиція режиму Сухарто - зосереджена навколо лівих ополчень та колишніх бойовиків Вільної Індонезії - здійснила приголомшливий контрнаступ, зрештою пробившись на Яву.\n\nГенерал Абдул Гарріс Насутіон проголосив себе Президентом, вийшовши з підпілля, щоб привести повстанські сили до перемоги в останню мить. Попри свою участь у русі Вільної Індонезії, військове минуле Насутіона - та його присяга викорінити будь-яких і всіх зрадників, що можуть загрожувати новій індонезійській державі - вселяють мало впевненості в тому, що початкові цілі руху будуть дотримані.\n\nТокіо та Вашингтон випустили стримані заяви про визнання нового уряду.\n"
 WORLD.16528.a: "Індонезія в попелі."
 
 WORLD.18000.t: "[Get_newspaper_header]Ордас інавгурований президентом Мексики"
 WORLD.18000.desc: "Результат президентських виборів у Мексиці 1964 року, як і очікувалося, приніс перемогу правлячій Інституційно-революційній партії, яка домінує у національній політиці десятиліттями, і тепер Густаво Діас Ордас сидить у Національному палаці. Міністр внутрішніх справ відомий своєю безжалісною і жорсткою реакцією на антиурядові протести під час адміністрації Матеоса, що залишає дисидентів у країні в стані страху за своє і так небезпечне майбутнє.\n\nПопри це, Сполучені Штати привітали Мексику із \"обранням лідера, який може провести країну через ці буремні часи\". Здається, Мексика знову готова вийти на світову арену - цього разу як друг американців."
 WORLD.18000.a: "За порядок і прогрес."
 
 WORLD.18001.t: "[Get_newspaper_header]Салінес інавгурований президентом Мексики"
 WORLD.18001.desc: "Результат президентських виборів у Мексиці 1964 року, як і очікувалося, приніс перемогу правлячій Інституційно-революційній партії, яка домінує у національній політиці десятиліттями, і тепер Рауль Салінес Лосано сидить у Національному палаці. Учений і економіст, колишній міністр промисловості та торгівлі, він є членом невеликої, але дедалі впливовішої технократичної фракції ІРП.\n\nСалінес найбільш відомий сприянням японським інвестиціям у Мексику. Він вступає на посаду з обіцянками великих інфраструктурних проєктів і боротьби з корупцією. Хоча підтримка серед населення була стриманою через питання щодо його відданості революційним цінностям, теплі вітання з Токіо чітко свідчать, що Салінес купається у променях висхідного сонця."
 WORLD.18001.a: "За нові шляхи мислення."
 
 WORLD.18002.t: "[Get_newspaper_header]Мадрасо інавгурований президентом Мексики"
 WORLD.18002.desc: "Результат президентських виборів у Мексиці 1964 року, як і очікувалося, приніс перемогу правлячій Інституційно-революційній партії, яка домінує у національній політиці десятиліттями. Однак набагато більшим сюрпризом став новообраний президент. Наразі губернатор Табаско, Карлос А. Мадрасо стане першим за десятиліття президентом, який отримав посаду без попереднього міністерського призначення.\n\nРадикальний представник лівого крила ІРП і переконаний захисник економічного протекціонізму, Мадрасо обіцяє захищати ідеали Мексиканської революції від корупції, жадібності та іноземного імперіалізму. Однак, зважаючи на те, що останніми роками мексиканська економіка стала запеклим полем битви між американськими та японськими інтересами, ще належить з’ясувати, чи зможе Мадрасо реалізувати своє грандіозне бачення."
 WORLD.18002.a: "За вічну революцію."
 
 WORLD.18003.t: "[Get_newspaper_header]Ліберали зберігають владу в Канаді"
 WORLD.18003.desc: "Після запеклих виборів між нинішнім урядом меншості Ліберальної партії на чолі з Лестером Пірсоном та Прогресивними консерваторами колишнього прем'єр-міністра Джона Діфенбейкера канадці висловилися, переобравши чинну партію та надавши їй сильний мандат на наступні чотири роки.\n\nНовообраний Пірсон має багато завдань: обіцянки створення нової конституції, медичної допомоги, економічних реформ, а також намагання задовольнити дедалі незадоволеніших квебекців та відчужені західні провінції, щоб вони залишалися в конфедерації, приносячи мир, порядок і добре правління від моря до моря. Новому уряду доведеться багато працювати."
 WORLD.18003.a: "Ми любимо Майка!"
 
 WORLD.18004.t: "[Get_newspaper_header]Прогресивні консерватори тріумфують у Канаді"
 WORLD.18004.desc: "У тріумфальному поверненні колишній прем'єр-міністр Джон Діфенбейкер зміг усунути уряд меншості Ліберальної партії Лестера Пірсона та повернутися до влади на нещодавніх канадських виборах, здобувши сильний мандат на чотирирічний термін.\n\nПісля короткого та розділяючого дворічного перебування на посаді після заміни хворого Джорджа Дрю на посаді прем'єра, до поразки наприкінці 1961 року та зниження до лідера опозиції, рішучий Діфенбейкер тепер знову у резиденції на Сассекс-драйв, 24. Він готовий завершити програму, яку раніше зірвали внутрішньополітичні суперечки та рецесія, і цього разу він готовий залишити свій слід у Канаді назавжди: нова конституція, економічний розвиток на далекій півночі та подолання розриву між Квебеком і Заходом. Ще належить побачити, чи вдасться йому досягти успіху."
 WORLD.18004.a: "Діф - шеф!"
 
 WORLD.18005.t: "[Get_newspaper_header]Канада обирає Ліберальну партію"
 WORLD.18005.desc: "Вибори в Канаді 1967 року завершилися, цього разу Ліберальна партія Канади здобула новий термін перебування при владі. Однак цього разу це буде під керівництвом нового лідера: молодого та працьовитого колишнього міністра юстиції Джона Тернера, обраного на заміну нещодавно відставленому Лестеру Пірсону. Прогресивні консерватори знову залишилися на лаві опозиції, тоді як ККФ і Соціальний кредит здивували сильними кампаніями. Однак Тернер і ліберали змогли подолати всі три виклики.\n\nУ віці лише 37 років Тернер стане наймолодшим прем'єр-міністром в історії Канади, і він приходить до влади, коли країна готується святкувати своє століття. Як наступне століття поставиться до Канади, можна тільки здогадуватися, але Тернер буде обличчям нації на шляху в майбутнє."
 WORLD.18005.a: "\"Мій час настав!\""

 WORLD.18212.t: "[Get_newspaper_header]Діфенбейкер знову приходить до влади в Канаді"
 WORLD.18212.d: "Прогресивний консерватор Джон Діфенбейкер знову виграв термін на вищій посаді, що засмутило його опонентів з іншого боку залу, у коридорах Вашингтона і навіть деяких членів його власної партії. Подолавши розкол між поміркованими червоними торі та жорсткими синіми торі, який зруйнував його перший термін, Діфенбейкер зміг отримати достатню кількість голосів від канадської публіки, щоб знову повернутися на Сассекс-драйв, 24. Навіть запальна кампанія молодого лідера лібералів Джона Тернера та сильні результати лівого ККФ і правого Соціального кредиту не змогли повалити Шефа.\n\nНапередодні століття Канади, здається, країна обрала почати друге століття з надійним керівництвом."
 WORLD.18212.a: "Він залишиться при владі назавжди, чи не так?"

 WORLD.18213.t: "[Get_newspaper_header]Канада обирає Прогресивно-консервативну партію"
 WORLD.18213.d: "Канадці проголосували, і вони вирішили, що Прогресивно-консервативна партія заслуговує на ще один шанс при владі. Це сталося попри доволі вибуховий і публічний конфлікт між новопризначеним прем'єр-міністром Робертом Стенфілдом і його примусово звільненим попередником Джоном Діфенбейкером. Останній був витіснений з партії коаліцією незадоволених членів партії всіх відтінків, а популярний прем'єр Нової Шотландії був обраний замість нього. Попри цей неприємний вихід і сильні кампанії лібералів, ККФ та Соціального кредиту, прогресивні консерватори згуртувалися навколо Стенфілда і готові керувати нацією.\n\nНапередодні століття Канади здається, що країна готова до партії, історія якої веде до першого прем'єр-міністра, щоб увійти у друге століття Канади."
 WORLD.18213.a: "Стенфілд охолодить пристрасті й зробить справу!"

 WORLD.18214.t: "[Get_newspaper_header]Перемога Кооперативної Співдружності у Канаді"
 WORLD.18214.d: "Монополія на владу в Канаді зламана. Вперше в історії країни демократична соціялістична Кооперативна Співдружність (CCF) змогла отримати більшість місць у Палаті громад. Томмі Дуглас, колишній прем'єр Саскачевану, тепер готовий зайняти пост прем'єр-міністра. Дружелюбний та чарівний Дуглас зміг переконати виборців дати йому та CCF, які досі залишалися третьою партією, шанс керувати країною.\n\nВтім, цей результат також можна розглядати як загальний протест проти невдач як торі, так і лібералів у останні роки у подоланні занепаду, в якому опинилася країна. При цьому Соціальний Кредит вважався надто радикальним.\n\nЗі сторіччям Канади, яке наближається у липні, здається, що країна готова взяти новий курс у друге століття."
 WORLD.18214.a: "Миші обрали одного з своїх!"

 WORLD.18215.t: "[Get_newspaper_header]Тріумф Соціального Кредиту у Канаді"
 WORLD.18215.d: "На загальний подив, Соціальний Кредит Канади зміг не лише отримати найбільше місць, але й здобути впевнену більшість у недавніх виборах. Його лідер, Реаль Каетт, незабаром буде приведений до присяги як прем'єр-міністр - розвиток подій, який кілька тижнів тому ніхто не міг уявити.\n\nХоча ліберали, прогресивні консерватори та навіть CCF могли б об’єднатися, щоб не дати Socred стати при владі, якби ті не здобули більшість, така коаліція назавжди залишиться лише спекуляцією. З перемогою над "старими партіями" та соціялістичною CCF немає меж тому, що може зробити харизматичний і ідеологічно заряджений Каетт.\n\nЗі святкуванням сторіччя, запланованим на липень, Канада вирішила обрати новий і радикальний шлях для другого століття нації."
 WORLD.18215.a: "Новий світанок для Домініону."

 WORLD.18216.t: "[Get_newspaper_header]Експо-67 відкрився в Монреалі"
 WORLD.18216.d: "Після багатьох років роботи та планування, включаючи створення штучних островів посеред річки Святого Лаврентія, масштабні інфраструктурні проекти та модерністські павільйони, які комп'ютерні розрахунки вважали неможливими для завершення вчасно, Міжнародна та універсальна виставка 1967 року була офіційно відкрита королевою Єлизаветою II після церемонії запалення вогню прем'єр-міністром [CAN.GetLeader] у Монреалі, Квебек.\n\nНації з усього світу були запрошені створити павільйони та продемонструвати свої досягнення, всі з яких святкують тему "Людина та її світ", але Експо-67 є короною святкування століття Канади.\n\nСвято триватиме сім місяців, тож встигніть приїхати до Монреаля, поки все не закінчиться!"
 WORLD.18216.a: "Поїдемо всі на Експо!"

 WORLD.18218.t: "[Get_newspaper_header]Зимові Олімпійські ігри 1964 року - успіх!"
 WORLD.18218.d: "На тлі напружених поточних подій нарешті з'явився перепочинок із Зимовими Олімпійськими іграми в Калгарі, Канада. Незважаючи на те, що вважалося неможливим організувати ігри за три місяці, Калгарі продемонстрував, що може бути не гіршим господарем, ніж засніжене гірське містечко Інсбрук, Австрія, яке змушене було відмовитися від події через Громадянську війну в Німеччині.\n\nІгри привернули велику увагу громадськості, і їх успіх приніс необхідну гордість нації. І хоча кількість країн-учасниць була меншою, ніж у попередніх іграх, Калгарі зміг зберегти змагання захопливими. У підсумку найкращими командами стали Фінляндія з приголомшливими чотирнадцятьма золотими медалями, Сполучені Штати з п'ятьма золотими медалями та Канада, що здобула чотири."
 WORLD.18218.a: "І все це лише за три місяці?"
 WORLD.18218.b: "Молодці, враховуючи обставини.\nАле у '68 буде ще краще."

 WORLD.18219.t: "[Get_newspaper_header]Ліберали патріюють Конституцію!"
 WORLD.18219.d: "Великі новини з Канади: прем'єр-міністр Лестер Б. Пірсон оголосив про успішне патріювання Конституції. З моменту створення Канади всі її закони мали бути затверджені у Вестмінстері, перш ніж ставати офіційними. Хоча це раніше було формальністю, після падіння Об'єднаного Королівства у фашизм обидві сторони не могли продовжити цей процес, залишаючи більшість канадського законодавства у підвішеному стані. Включаючи положення щодо федеральної влади та культурних прав, серед інших питань, цей документ нарешті обіцяє закріпити канадське законодавство.\n\nЦя новина особливо тішить Карибські острови. Існуючи в схожій правовій невизначеності, обидві сторони тепер можуть розпочати переговори щодо можливої незалежності Вест-Індії. Коли його запитали про ці переговори, Пірсон заявив, що готовий зустрітися з ними "віч-на-віч"."
 WORLD.18219.a: "Погані новини для Вестмінстера, хороші для Кінгстона."

 WORLD.18220.t: "[Get_newspaper_header]Тріумф торі в Канаді"
 WORLD.18220.d: "Прем'єр-міністр Джон Діфенбейкер здобув історичну політичну перемогу; Конституція Канади нарешті повертається додому. Діфенбейкер успішно провів переговори з десятьма лідерами провінцій Канади та погодився на патріацію нової конституції. Його перемога дає Канаді повний суверенітет над власним правом, позбавляючи країну залежності від британського парламенту для внесення змін до її конституції.\n\nОсобливі популістські погляди Діфенбейкера на громадянські свободи та сильну про-Співдружність політику були закріплені в конституції поряд із патріацією. Це досягнення також дає канадському уряду більше гнучкості для вирішення проблеми з "тимчасовим" канадським управлінням колишніми британськими колоніями Карибського басейну."
 WORLD.18220.a: "Вождь показав їм усім!"

 WORLD.18221.t: "[Get_newspaper_header]Ліберали не змогли патріювати Конституцію!"
 WORLD.18221.d: "Важкий удар для прем'єр-міністра Лестера Пірсона: спроба зробити Конституцію Канади справжнім канадським документом зазнала невдачі. Хоча на всіх рівнях тривають звинувачення і війна слів між офісом прем'єра, опозицією та провінційними прем'єрами, факт залишається таким, що одна з найбільших передвиборних обіцянок Ліберальної партії тепер залишилася недосяжною, що не дає великих надій на майбутні вибори чи на продовження лідерства Пірсона в партії.\n\nЦе особливий удар для націоналістів у Карибському басейні. Старі британські колонії у Вест-Індії обурюються через збереження колоніального правління, яке Канада утримувала з кінця війни, і тепер ймовірність будь-якого прогресу до самоврядування або навіть повної незалежності відкладатиметься ще довше через триваючі суперечки в Оттаві."
 WORLD.18221.a: "Я думав, канадці - ввічливі люди!"

 WORLD.18222.t: "[Get_newspaper_header]Конституція Канади помирає в колисці"
 WORLD.18222.d: "Прем'єр-міністр Джон Діфенбейкер з Прогресивної Консервативної Партії Канади сумно відмовився від свого плану патріації Конституції Канади. Останнє юридичне право на центральний правовий документ Канади залишається за британським парламентом на найближчі роки. Невдале досягнення компромісу з провінціями призводить до сильного невдоволення навіть у рядах власної партії Діфенбейкера, але він наполягає, що залишиться на посаді прем'єр-міністра.\n\nНевдача ймовірно стане великою перешкодою для майбутніх спроб торі на перевиборах, і радикальні опозиційні партії святкують. Невдоволення у канадських територіях Карибського басейну також зростає, оскільки провал патріації майже напевно означає продовження правової та політичної нестабільності в колишніх британських колоніях."
 WORLD.18222.a: "Чорний день у Великому Білому Півночі."

 WORLD.18223.t: "[Get_newspaper_header]Ліберали патріюють Конституцію"
 WORLD.18223.d: "Сьогодні в Канаді прем'єр-міністр Пірсон і його Ліберальна партія зітхають з полегшенням, оскільки пропонована урядом нова конституція успішно пройшла свою остаточну юридичну битву в Верховному суді. Після того, як переговори з прем'єрами країн не вдалися, прем'єр вирішив обійти їхню владу, провівши конституцію через референдум, що спричинило хвилю обурення по всій країні і обіцянки оскаржити її законність.\n\nХоча ці оскарження зазнали невдачі, цей маневр може обернутися витратами для лібералів на наступних виборах. Багато опитувань вже ставлять партію позаду Прогресивних Консерваторів та інших менших партій, які набирають популярності. Проте країна хоча б позбавлена залишкових правових зв'язків з Великою Британією і готова вирішувати інші пов'язані проблеми, такі як наведення порядку в адміністрації Канади на Карибах. Незважаючи на всі свої проблеми, документ обіцяє нове майбутнє для Канади."
 WORLD.18223.a: "Піррова, але постійна перемога."

 WORLD.18224.t: "[Get_newspaper_header]Консерватори Канади виграють референдум щодо Конституції"
 WORLD.18224.d: "Ризикований план прем'єра Джона Діфенбейкера з Канади примусити патріацію через референдум успішно завершився вузькою перемогою. Подолавши опір опозиційних партій та різноманітні юридичні виклики, популіст-юрист, який став прем'єр-міністром, змогла прорватися через всі труднощі та провести реформу конституції, підкріплюючи національний суверенітет.\n\nАле, незважаючи на перемогу, вулиці Канади лунають не лише від вигуків радості, а й від свисту незадоволення. Опір реформам Діфенбейкера, що його ненавидять провінційні лідери, розділив країну. Тільки на Карибах, в численних колишніх британських колоніях, які тепер адмініструються Канадою, є універсальне полегшення та радість, оскільки з'являється надія, що патріація дозволить Канаді надати більше політичних свобод на островах."
 WORLD.18224.a: "Діфенбейкер такий ж суперечливий, як і раніше."

 WORLD.18225.t: "[Get_newspaper_header]Конституційний хаос в Канаді"
 WORLD.18225.d: "Уряд Канади впав у метушню після того, як спроби створити та прийняти нову конституцію зазнали невдачі. Після того, як переговори з прем'єрами не вдалися, прем'єр-міністр Пірсон вирішив провести референдум, який стояв на хиткому юридичному ґрунті. Тепер, через юридичні поразки та відмову виборців, цей ґрунт перетворився на провал, забравши за собою велику частину уряду лібералів в очах народу.\n\nЗ невдоволенням по всій країні, зміна уряду практично неминуча, деякі коментатори навіть припускають можливість уряду Соціальних Кредитів або CCF. Однак ніде немає більшого розчарування, ніж на Карибах, де, втративши всяку довіру до Канади в питаннях управління регіоном, почали шукати інші шляхи вирішення конфлікту."
 WORLD.18225.a: "Ліберали; природне провалення Канади."

 WORLD.18226.t: "[Get_newspaper_header]Конституційна реформа зазнає краху в Канаді"
 WORLD.18226.d: "Найбільша політична невдача в історії Канади спіткала Джона Діфенбейкера. Шукаючи припинення британської влади над канадським правом, прем'єр-міністр намагався провести патріацію конституції. Його переговори з провінціями зайшли в тупик, і тепер, навіть з референдумом, який не приніс результату, Діфенбейкер зазнав поразки, якої його вороги навіть не могли уявити.\n\nБагато канадців розчарувалися у реформі, обурені некомпетентністю влади. Багато хто припускав, що ситуація змусить Діфенбейкера піти у відставку, але він відмовився, що тільки погіршило ситуацію. Найгірше це відчувається на Карибах, де місцеві лідери колишніх британських колоній прискорили свої зусилля по вигнанню канадських гарнізонів, втративши віру в здатність Оттави коли-небудь здійснити їхнє самоврядування."
 WORLD.18226.a: "Як він міг думати, що зможе зберегти владу після цього?!"
 
 ### OC Events

WORLD.18007.t: "[Get_newspaper_header]Революційна перемога в Єгипті!"
WORLD.18007.d: "Сьогодні остаточно завершився крах італійської влади в Єгипті, коли Гамаль Абдель Насер та сили Єгипетської революційної ради здобули перемогу в землях фараонів. Зростаючі антііталійські та антиколоніальні настрої в Єгипті досягли апогею у вигляді невдалого перевороту Вільного офіцерського руху, що призвело до багатосторонньої громадянської війни. Попри невдачу первісного перевороту, сили Насера успішно перемогли своїх противників і проголосили нову Арабську Республіку Єгипет.\n\nНасер та його рух є рішучими антиколоніалістами і твердими прихильниками ідеї панарабської держави, погляди яких виявилися надзвичайно популярними серед єгипетського населення. Міжнародні спостерігачі розглядають їхню перемогу в Єгипті як серйозну поразку для Італійської імперії на тлі триваючої нафтової кризи та можливих початків формування нового блокового співробітництва на Близькому Сході та в Північній Африці."
WORLD.18007.a: "Це катастрофа!"
WORLD.18007.b: "Перемога для арабського народу!"
WORLD.18007.c: "Вільний Єгипет?"

WORLD.18008.t: "[Get_newspaper_header]Статус-кво зберігається в Єгипті"
WORLD.18008.d: "Страхи, що нещодавня єгипетська громадянська війна призведе до краху італійської влади в країні, виявилися безпідставними. Вплив Італії в Єгипті вже давно викликав невдоволення серед місцевого населення, що досягло свого піку у спробі перевороту Абделя Насера, що швидко переросла в багатосторонню громадянську війну. Перемога уряду Каїра над Вільним офіцерським рухом та Мусульманським братством принесла мир у землю фараонів, на полегшення як для єгиптян, так і для італійців.\n\nХоча влада Італії в Єгипті, схоже, збереглася, велика частина населення продовжує відчувати неприязнь до всепроникного впливу їхніх номінальних партнерів. Незважаючи на ці шепоти невдоволення, міжнародні спостерігачі вітали перемогу як гостро необхідний тріумф для Італії, особливо на тлі нестабільності, що охопила регіон."
WORLD.18008.a: "Ми не очікували нічого іншого."
WORLD.18008.b: "Справжній крок назад."
WORLD.18008.c: "Як і очікувалося."

WORLD.18009.t: "[Get_newspaper_header]Фарах Пахлаві виграє громадянську війну в Ірані!"
WORLD.18009.d: "У передачі, що транслювалася по всьому Близькому Сходу з комплексу Са'дабад, іранська монархія оголосила, що вона розгромила всі повстанські сили, які піднялися проти Пахлаві та іранської держави. Лоялісти вже почали очищення від усіх бунтівних сил, поки іранські націоналісти святкують ліквідацію «зрадників іранської нації та народу».\n\nҐерманія випустила заяву, вітаючи монархістів і виступаючи за «продуктивні відносини з нашими арійськими союзниками на Близькому Сході». Тим часом, ОВН публічно засудила іранський режим, а революціонери втекли в інші країни, щоб продовжити свою боротьбу проти династії Пахлаві."
WORLD.18009.a: "Лев не турбується думками овець."

WORLD.18010.t: "[Get_newspaper_header]Санджабі виграє громадянську війну в Ірані!"
WORLD.18010.d: "У передачі, що транслювалася по всьому Близькому Сходу з комплексу Са'дабад, партизани, що підтримують Національний фронт Ірану, оголосили про повалення династії Пахлаві та встановлення ліберальної, секулярної та демократичної Іранської Республіки. Лідер Національного фронту Карім Санджабі склав присягу як голова тимчасового уряду, в той час як наслідний принц Реза та його союзники втекли до Німеччини.\n\nҐерманія засудила перемогу Санджабі як «зраду іранського народу та арійської раси». Тим часом ОВН привітав Санджабі та направив радників для допомоги новому уряду, поки соціялістичні та ісламістські партизани вже організовуються за лаштунками."
WORLD.18010.a: "Демократія на Близькому Сході? Тупий замах."

WORLD.18011.t: "[Get_newspaper_header]Бахтіяр виграє громадянську війну в Ірані!"
WORLD.18011.d: "У передачі, що транслювалася по всьому Близькому Сходу з комплексу Са'дабад, партизани, що підтримують фракцію монархії Ірану, оголосили про повалення регентства Фарах Пахлаві та відновлення влади монархії. Шапур Бахтіяр, лідер партизан, оголосив про створення регентської ради для правління Іраном замість наслідного принца Рези та оголосив про масштабні реформи для перетворення Ірану на конституційну демократичну монархію.\n\nҐерманія засудила Бахтіяра як «зрадника арійської раси та іранської нації», в той час як ОВН неохоче привітав реформатора та побажав продуктивних відносин між ним та новим іранським урядом."
WORLD.18011.a: "Чи був лев обеззброєний?"

WORLD.18012.t: "[Get_newspaper_header]Маррі виграє громадянську війну в Ірані!"
WORLD.18012.d: "У події, яка шокувала та здивувала світ, Балуцький визвольний фронт захопив комплекс Са'дабад і проголосив перемогу над іранською нацією! Мухаммад Маррі, командир балуцьких сил, змусив іранський уряд підписати договір, що гарантує незалежність балучів, народу сунітів у шиїтській країні! Балуцький визвольний фронт тепер створить незалежну націю Балучистан, засновану на синтезі ісламу сунітів та марксизму.\n\nХоча ОВН обережно налагодив відносини з новим урядом, Ґерманія засудила балучів як «ворогів арійської раси та іранської нації». "
WORLD.18012.a: "Приниження для іранського народу."

WORLD.18013.t: "[Get_newspaper_header]Ескандері виграє громадянську війну в Ірані!"
WORLD.18013.d: "У передачі, що транслювалася по всьому Близькому Сходу з комплексу Са'дабад, партизани, що підтримують комуністичну партію Туде Ірану, оголосили про повалення династії Пахлаві та встановлення соціялістичної Іранської Республіки за моделлю Совєцького Союзу Бухаріна. Наслідний принц Реза та його союзники втекли до Німеччини, поки соціялістичні партизани збирають і страчують лоялістів Пахлаві, невірних священиків та іноземних промисловців.\n\nҐерманія засудила партію Туде як «юдео-більшовицьких ворогів арійської раси та іранської нації», а ліберали та ісламісти засудили партію Туде як зрадників іранської революції і втекли до Іраку або країн, що підтримують ОВН."
WORLD.18013.a: "Боротьба робітників триває."

WORLD.18014.t: "[Get_newspaper_header]Хомейні виграє громадянську війну в Ірані!"
WORLD.18014.d: "У передачі, що транслювалася по всьому Близькому Сходу з комплексу Са'дабад, партизани, що підтримують аятолу Хомейні, оголосили про повалення династії Пахлаві та встановлення теократичної ісламської республіки, на чолі з аятолою як її «вищим лідером». Наслідний принц Реза та його союзники втекли до Німеччини, поки ісламські революціонери збирають і страчують своїх колишніх соціялістичних і ліберальних товаришів.\n\nІ Ґерманія, і ОВН засудили ісламістів як фундаменталістів-зрадників іранської нації, а ліберали та соціялісти втекли за кордон, сподіваючись, що одна з наддержав зупинить цей божевільний режим."
WORLD.18014.a: "Іран завжди був землею віри."

WORLD.18015.t: "[Get_newspaper_header]Перемога КПР в Іраку!"
WORLD.18015.d: "Сьогодні з Багдада надходять новини від лідера КПР Мустафи Барзані, який оголосив, що курдські сили демократичної коаліції забезпечили контроль над усією країною разом з лоялістами. Це є кульмінацією багаторічної революційної боротьби, що охопила три країни та багато десятиліть, угоди були підписані з іракським урядом минулого тижня, що закріплює курдську автономію як частину нової демократичної конституції.\n\nЗ наявними нафтовими резервами та зростаючою нестабільністю в регіоні Барзані, ймовірно, займе більш домінуючу роль на міжнародній арені. Барзані особисто оголосив про готовність співпрацювати з демократичними силами в Італії та в усьому світі для забезпечення процвітання своєї нової держави, а також для продовження боротьби за права курдів за кордоном."
WORLD.18015.a: "Ми можемо працювати з цим... чи можемо?"
WORLD.18015.b: "А що з арабами?"
WORLD.18015.c: "Час, щоб курди мали свою власну домівку."

WORLD.18016.t: "[Get_newspaper_header]Італійська перевага в Іраку!"
WORLD.18016.d: "Іракська громадянська війна почалася як спроба покінчити з італійським контролем над країною. Тепер стає очевидним, що ця спроба зазнала невдачі: Віто Мічелі, колишній «радник» уряду в Багдаді, зміг успішно орієнтуватися в іракській політичній сцені і укласти угоду, яка задовольняє всіх - особливо Італійську імперію.\n\nЗвертаючись до невеликої групи представників Іраку та ENI в Багдаді, Мічелі оголосив свої кандидатури для нового кабінету, що має стабілізувати країну в найближчому майбутньому. Ця новина була добре прийнята як в Італії, так і в Іраку як спосіб покласти край кровопролиттю, а перемога Мічелі стала несподіваним, але широко святкованим тріумфом для Італії та її амбіцій на Близькому Сході."
WORLD.18016.a: "Як завжди."
WORLD.18016.b: "День ганьби."
WORLD.18016.c: "Можливо, це на краще."

WORLD.18017.t: "[Get_newspaper_header]Демократія зростає в Іраку!"
WORLD.18017.d: "Сьогодні з Багдада надійшли новини, що після місяців інтенсивних боїв, Абд аль-Рахман аль-Базаз і його конституціоналісти вийшли переможцями з іракської громадянської війни. Адвокат, письменник та інтелектуал, успіх аль-Базаза є шокуючим результатом для країни, що довго була визначена чергуванням автократів та військових лідерів.\n\nСтоячи перед зруйнованими залишками Республіканського палацу, аль-Базаз пообіцяв відновити довго зупинений рух Іраку до демократичного уряду. Він також намагався заспокоїти побоювання різних меншин Іраку, які залишаються стурбованими його голосними панарабськими ідеалами, пообіцявши різні захисти.\n\nЧи зможе аль-Базаз виконати ці обіцянки, ще невідомо. Вже ходять чутки про напруження та серйозні розбіжності в його коаліції."
WORLD.18017.a: "Республіка, якщо зможеш її зберегти."

WORLD.18018.t: "[Get_newspaper_header]Ба'атисти захоплюють владу в Іраку!"
WORLD.18018.d: "Сьогодні вранці новий президент Іраку Ахмед Хасан аль-Бакр оголосив про перемогу Ба'атистів у жорстокій громадянській війні країни. Ірак був домом для однієї з найбільших та найвпливовіших гілок арабської соціялістичної партії Ба'ат, залишаючись постійним оплотом арабського націоналізму протягом останніх двох десятиліть. Після відкритого оголошення про свою відданість антиколоніальній боротьбі, режим аль-Бакра ймовірно буде дотримуватися жорсткої лінії проти італійського впливу в регіоні, сподіваючись стати "оплотом арабського націоналізму проти хвилі колоніальної окупації".\nСпостерігачі в Іраку та за кордоном зазначили численні порушення та авторитарні позиції, що прийняла партія Ба'ат під керівництвом аль-Бакра та його племінника, Саддама Хусейна; мало хто з лідерів меншин має великі надії на національну автономію в тепер вже явно арабській державі. Тим не менше, ба'атисти продовжують пропагувати ідеали Свободи та Соціялізму: лише час покаже, чи будуть ці ідеали колись справді втілені."
WORLD.18018.a: "Це катастрофа!"
WORLD.18018.b: "Хай живе Ба'ат!"
WORLD.18018.c: "Чекаємо і сподіваємось на краще."

WORLD.18019.t: "[Get_newspaper_header]Ад-Дава зростає в Іраку!"
WORLD.18019.d: "Сьогодні стало очевидно, що переможцем іракської громадянської війни є шиїтський рух Ад-Дава, який зміг мобілізувати шиїтську більшість населення на платформі етнічної та релігійної толерантності. Духовний лідер аятола Абу аль-Касім аль-Хої у своїй промові в Багдаді підтвердив наміри партії правити в гармонії з усім населенням Іраку.\n\nАд-Дава була надзвичайно популярною серед шиїтського населення Іраку, популярність якого тільки зросла після того, як аль-Хої взяв на себе керівництво та закликав до демократичного та толерантного ісламського уряду. Тоді як більш жорсткі голоси дивуються, як толерантність може вмістити реальну загрозу націоналізму, а сунітське населення Іраку готується до хвиль дискримінації, аль-Хої не відступив від викликів і запевнив, що уряд буде справедливим і праведним для всіх іракців."
WORLD.18019.a: "Хіба іслам не закликає до того, щоб поділяти? Хто може більше потребувати нафти, ніж ENI?"
WORLD.18019.b: "Шиїти хочуть залишити Ірак в середньовіччі."
WORLD.18019.c: "Чекаємо, і сподіваємось на краще."

WORLD.18020.t: "[Get_newspaper_header]Революційна перемога в Омані"
WORLD.18020.d: "Громадянська війна в Омані завершилась сьогодні перемогою революціонерів Лейли Фахро. Оман, одна з багатьох країн, що постраждали від хвилі нестабільності, яка охопила регіон, пережив переворот, організований Кабусом, сином султана Саїда бін Таймура, у співпраці з італійським гарнізоном. Невизначеність, створена цим кроком, спричинила вакуум влади, який незабаром заповнили традиціоналісти, підтримувані Саудівською Аравією, та коаліція панарабських революціонерів.\n\nРеволюціонери Лейли Фахро мають намір перетворити Оман на оплот панарабізму в південній частині Аравійського півострова, що загрожує інтересам як Саудівської Аравії, так і Італії в регіоні. Не було досягнуто коментарів від Риму чи Ер-Ріяда."
WORLD.18020.a: "Невдалий крок назад."
WORLD.18020.b: "Перемога для арабського народу!"
WORLD.18020.c: "Повернення до стабільності?"

WORLD.18021.t: "[Get_newspaper_header]Перемога Імамату в Омані"
WORLD.18021.d: "Громадянська війна в Омані завершилась сьогодні перемогою традиціоналістів на чолі з Галібом Альхані. Оман, як і багато інших країн, постраждав від хвилі нестабільності в регіоні, коли в країні стався державний переворот, організований Кабусом, сином султана Саїда бін Таймура, за підтримки італійського гарнізону. Невизначеність, спричинена цим кроком, призвела до вакууму влади, який незабаром був заповнений традиціоналістами, підтримуваними Саудівською Аравією, та коаліцією панарабських революціонерів.\n\nГаліб Альхані, імам Оману, очолює коаліцію традиціоналістів, підтримуваних Саудівською Аравією, та племінних груп і має намір відновити в країні теократичне правління. Отримавши визнання від Ер-Ріяда, перемога Альхані в Омані є значним успіхом для саудівської зовнішньої політики, що тепер зуміла відвести країну від італійського впливу. Італійське міністерство закордонних справ не змогло бути досягнутим для коментарів."
WORLD.18021.a: "Це катастрофа!"
WORLD.18021.b: "Повернення до традицій!"
WORLD.18021.c: "Нарешті мир?"

WORLD.18022.t: "[Get_newspaper_header]Перемога монархістів в Ємені"
WORLD.18022.d: "Громадянська війна в Ємені завершилась сьогодні капітуляцією останніх республіканських опорних пунктів перед силами Імана Мухаммада аль-Бадра. За підтримки Саудівської Аравії та Італійської імперії монархічні сили змогли подолати різноманітну коаліцію республіканців під керівництвом генерала Абдулли аль-Салала. Здається, що привид панарабізму в Ємені остаточно був подоланий.\n\nКороль Мухаммад аль-Бадр зробив жест до Ер-Ріяда та Риму, щоб отримати підтримку у громадянській війні в Ємені, представляючи себе як твердо відданого захисника італійських інтересів, одночасно налагоджуючи зв'язки з саудівським королем. Тепер, коли його трон забезпечений, багато міжнародних спостерігачів задаються питанням, чи вибере новий король Ємену сторону у регіональній боротьбі за владу або продовжить балансувати між Ер-Ріядом і Римом."
WORLD.18022.a: "Сподіваємось, він зробить правильний вибір."
WORLD.18022.b: "Невдалий крок назад."
WORLD.18022.c: "Хто турбується про Ємен?"

WORLD.18023.t: "[Get_newspaper_header]Перемога республіканців в Ємені"
WORLD.18023.d: "Громадянська війна в Ємені завершилась сьогодні капітуляцією останніх монархістських опорних пунктів. Попри підтримку з боку Італійської імперії та Саудівської Аравії, Іман Мухаммад аль-Бадр не зміг утримати популярну підтримку, яку мав його батько, і змушений був покинути країну після військової поразки. Генерал Абдулла аль-Салал оголосив про створення Арабської Республіки Ємен.\n\nОчолюючи ексцентричну коаліцію, яка складається з демократів, комуністів і ба'атистів, деякі спостерігачі поставили під сумнів стабільність нового уряду Салала. Проте генерал, який став президентом, оголосив про намір перетворити Ємен на бастіон панарабізму на Аравійському півострові, з амбіціями, які є прямим викликом як Саудівській монархії, так і Італійській імперії. Хоча більшість вважає вимоги Ємену просто позерством, інші попереджають, що країна може мати значний вплив і військову міць."
WORLD.18023.a: "Невдалий крок назад."
WORLD.18023.b: "Перемога арабського народу!"
WORLD.18023.c: "Хто турбується про Ємен?"

WORLD.18024.t: "[Get_newspaper_header]Перемога єменців в Аравії"
WORLD.18024.d: "Бої в Аравії завершились сьогодні капітуляцією останніх саудівських військ перед Єменською Демократичною Арабською Республікою. Попри значну перевагу в техніці та ресурсах, Саудівська королівська армія зазнавала поразки за поразкою від єменських сил. З Мекки президент Абдулла аль-Салал оголосив про створення Аравійської Республіки, що стало першим кроком до формування панарабської держави.\n\nВійськові спостерігачі приписують несподівану перемогу багатьом інституційним проблемам у саудівській армії, при цьому повідомляється, що монарх країни втік за кордон. Тепер, контролюючи священні міста Мекку та Медіна, а також великі нафтові резерви вздовж Перської затоки, спостерігачі вважають перемогу єменців початком створення панарабської держави."
WORLD.18024.a: "Від поганого до гіршого."
WORLD.18024.b: "Єдина держава для єдиного народу!"
WORLD.18024.c: "А що з нафтою?"

WORLD.18025.t: "[Get_newspaper_header]Перемога Саудівської Аравії в Ємені"
WORLD.18025.d: "Бої в Ємені завершились сьогодні капітуляцією останніх єменських військ. Попри значну перевагу в техніці та ресурсах, саудівська армія була сповільнена як складним ландшафтом Ємену, так і завзятою опозицією з боку сил Єменської Демократичної Арабської Республіки. Зрештою, саудівським військам вдалося подолати ці перешкоди та завершити війну; Ер-Ріяд знову встановив Імана Мухаммада аль-Бадра як монарха Ємену.\n\nХоча війна завершилась, опір в Ємені триває, оскільки багато єменських солдатів та цивільних осіб перейшли до гір і ведуть партизанську кампанію проти як відновленого короля, так і його саудівських союзників. Міжнародні спостерігачі очікують, що знадобиться час, перш ніж країна буде повністю заспокоєна, попри найкращі зусилля Королівської армії."
WORLD.18025.a: "Краще вони, ніж ба'атисти."
WORLD.18025.b: "Тріумфальна перемога!"
WORLD.18025.c: "Хто турбується про Ємен?"

WORLD.18026.t: "[Get_newspaper_header]Перемога Братства в Єгипті"
WORLD.18026.d: "Сьогодні нарешті завершилось падіння італійської влади в Єгипті, оскільки сили Мусульманського братства здобули перемогу у громадянській війні країни. Хоча італійський вплив в Єгипті завжди викликав ненависть, останні хвилі нестабільності в країні фараонів завершились невдалою спробою перевороту від Руху вільних офіцерів Абделя Насера, що переросло у громадянську війну. Під час цього конфлікту мало хто очікував, що секта ісламських радикалів на чолі з Саїдом Кутбом переможе Насера та уряд, підтримуваний Італією, але всупереч усім очікуванням, Мусульманське братство тепер контролює Єгипет.\n\nОчолюючи радикальну секту ісламських бойовиків, Кутб почав налагоджувати зв'язки з Саудівською Аравією, чия підтримка стала ключовою для перемоги Братства в Єгипті. Міжнародні спостерігачі вважають їх перемогу серйозним ударом по Італійській імперії та можливо початком нового геополітичного блоку на Близькому Сході - такого, що буде зосереджений навколо Ер-Ріяда замість Риму."
WORLD.18026.a: "Це катастрофа!"
WORLD.18026.b: "Тріумфальне повернення до традицій!"
WORLD.18026.c: "Ісламський Єгипет?"

WORLD.18028.t: "[Get_newspaper_header]Перемога султанату в Омані"
WORLD.18028.d: "Сьогодні в південно-східній Аравії замовкли гармати, оскільки Кабус бін Саїд, султан Маската, оголосив про повну перемогу в його війні за Маскат і Оман. Як син попереднього султана, його висока популярність у густонаселеному прибережному місті Маскат, у поєднанні з допомогою іноземних сил, дозволила йому здолати менш чисельних повстанців в Омані та Дофарі й почати реалізацію амбітної модернізаційної програми. Він вже скасував дванадцятитисячолітній Імамат Оману, оголосив про скасування рабства та розпочав процес реорганізації та централізації уряду. Аналітики вважають, що він намагатиметься використати величезні нафтові ресурси країни як важіль для залучення міжнародних інвесторів і укладання вигідних торгових угод із іноземними державами, що може мати значні наслідки як для самого Оману, так і для всього Близького Сходу."
WORLD.18028.a: "Здоровий глузд і хороше управління перемогли в Омані."
WORLD.18028.b: "Імперіалістичний ярмо залишилось на народі Омана."
WORLD.18028.c: "Позитивні зміни для країни."

### Huttig Collapse Events
WORLD.18050.t: "[Get_newspaper_header]Крах Райхсштаату"
WORLD.18050.d: "Десятиліття жорстокого правління божевільного райхскомісара Ганса Хюттіга завершилось драматичним чином, оскільки фракція, складена з кількох солдатів СС, здійснила переворот і стратила Хюттіга після різкого падіння контролю. Лідер цього перевороту, Отто Ферснер, тепер заявляє, що він є законним лідером залишків Ґерманського Конго, що згуртувались навколо Леопольдвіля, однак ця вимога не визнається навіть самим Райхом.\n\nТим часом колишній Райхсштаат охоплений хаосом. Деякі в Африці намагаються здобути підтримку з Заходу або Сходу, а інші воюють за території, поки воєначальники не ділять землі на свої володіння. Більшість спостерігачів сумніваються, що Центральна Африка зможе відновитися від поточного хаосу найближчим часом."
WORLD.18050.a: "Жах! Жах!"

WORLD.18051.t: "[Get_newspaper_header]Ферснер захоплює Ґерманську Африку"
WORLD.18051.d: "Термін райхскомісара Ганса Хюттіга завершився після організованого перевороту, очоленого колишнім мером Леопольдвіля, Каем-Уве Ферснером, який захопив контроль над адміністрацією колишнього Центрального Африканського Союзу.\n\nОскільки решта Райхсштаату розпадається в хаос, Ферснер пообіцяв стабільність у Конго, найбільш прибутковій колонії Ґерманської Африки - розвиток, що був сприйнятий урядом Райху та інвесторами, які почали повертатися, коли німці та бельгійці спільно працюють над відновленням залишків німецької Африки."
WORLD.18051.a: "Краще пізно, ніж ніколи."

### African Mandates Events

WORLD.18100.t: "[Get_newspaper_header]Хаос в Анголі"
WORLD.18100.d: "Попри найкращі зусилля мандату ОВН, очолюваного США, в Анголі знову спалахнув хаос після Південноафриканської війни. Після падіння Південно-Західної Африки та окупації ОВН було зроблено спроби побудувати основу для тривалого постколоніального миру. Генерал Лавель уже деякий час веде переговори між PLUAA і ЮНІТА, які були засновані як відповідь на німецьке правління і ворожі до будь-якої західної присутності, але мали суттєво різні довгострокові цілі після того, як загарбники будуть вигнані. Поки що уряд США ясно дав зрозуміти, що вони не залишаться довше, ніж потрібно, але переговори зірвалися внаслідок величезної параної та підозр. Президент США відмовився коментувати ситуацію, обмежившись лише заявою, що "це неприємний поворот подій.""
WORLD.18100.a: "Здається, вони просто не змогли співіснувати."

WORLD.18101.t: "[Get_newspaper_header]ОВН надає Анголі незалежність"
WORLD.18101.d: "Як наслідки Південноафриканської війни продовжують відлунювати по всьому світу, є одне місце, яке скористалося моментом. Мандат ОВН в Анголі, що включає території колишньої німецької колонії Південно-Західної Африки, сьогодні офіційно припинив своє існування. Ця новина з Луанди з'явилася на хвилі оголошення про досягнення угоди щодо деколонізації між генералом Джоном Лавелем і ЮНІТА та PLUAA. Міжнародні спостерігачі відзначають, що формування мирної угоди з цими двома рухами позитивно позначиться на майбутньому регіону. Однак багато хто швидко зазначив, що ця угода ймовірно не покладе край багатьом розбіжностям між групами, і лише час покаже, чи зможуть вони дійсно співіснувати. Але на даний момент святкування в Луанде, Бенгуелі та Лубанго свідчать, що на африканському континенті надія не вмерла."
WORLD.18101.a: "Нехай мир триватиме."

WORLD.18102.t: "[Get_newspaper_header]Хаос у Центральній Африці"
WORLD.18102.d: "Тимчасовий уряд ОВН у Конго зазнав краху! У своєму тимчасовому штабі на борту американського крейсера біля узбережжя острівця Сан-Томе генерал Лавель оголосив, що через інтенсивний тиск з боку Мовмену Національного Конго ОВН був змушений залишити регіон Конго. Це серйозний удар по стратегічних інтересах США в регіоні, що нещодавно було звільнено від німецького колоніального режиму, і викликало обурення в Вашингтоні. Ще більший розчарування у уряді США викликає те, що інвестори, які мали вигідні угоди з райхскомісаром Зіґфрідом Мюллером, з яких більшість перейшла до адміністрації ОВН, тепер ризикують втратити мільйони, а також те, що Дамба Конго вийшла з-під контролю як німців, так і американців. Економічні наслідки цього інциденту можуть виявитися навіть більш шкідливими, ніж дипломатичні."
WORLD.18102.a: "Наші активи в Конго загублені!"

WORLD.18103.t: "[Get_newspaper_header]ОВН надає Центральній Африці незалежність"
WORLD.18103.d: "Сьогодні в Конго настає світло свободи, країна, що довго перебувала під системою найманців під керівництвом Зіґфріда Мюллера. В телевізійному зверненні в Леопольдвілі генерал Крейтон Ейбрамс-молодший оголосив про завершення окупаційних операцій ОВН і пообіцяв співпрацю з новими державами регіону, якщо вони цього побажають. Особливу увагу він приділив готовності ОВН допомогти очистити територію від залишків найманців, що домінували в регіоні під час німецького правління. Проте експерти висловлюють скептицизм щодо того, чи зможуть країни Конго співіснувати мирно, поки існують етнічні та територіальні напруження. Чи підтвердяться ці побоювання, ще не зрозуміло, але на даний момент у Конго тривають святкування з нагоди нової ери незалежності."
WORLD.18103.a: "Індепенданс, ча-ча!"

WORLD.18104.t: "[Get_newspaper_header]Хаос у Східній Африці"
WORLD.18104.d: "Правління ОВН в Східній Африці ніколи не планувалося як гладкий процес. Ґерманська окупація під керівництвом райхскомісара Ганса Хюттіга була занадто жорстокою, занадто жорстокою, щоб дозволити народу вийти без шрамів, як фізичних, так і психічних. Врешті-решт лише найбільш безжальні ватажки воєнних банд і революціонери змогли вижити в такій страшній пекельній ситуації. Генерал Вестморленд сподівався, що він зможе привести мир в таку обтяжену землю, але здається, що це було занадто велике сподівання. Місцеві лідери скористалися зростаючою нестабільністю та ослабленням контролю ОВН, щоб проголосити незалежність та утворити кілька нових держав. Президент США відмовився коментувати, висловивши лише розчарування від невдачі дипломатії та компромісу у досягненні мирного результату. Генерал Вестморленд також був сумний, висловлюючи співчуття з приводу того, що його зусилля не змогли забезпечити плавний процес деколонізації."
WORLD.18104.a: "Шрами глибокі."

WORLD.18105.t: "[Get_newspaper_header]ОВН надає Східній Африці незалежність"
WORLD.18105.d: "Сьогодні Президент США зателефонував генералу Вільяму Вестморленду, щоб привітати його з успішним веденням переговорів щодо швидкого процесу деколонізації Східної Африки, що перебувала під мандатом ОВН з кінця Південноафриканської війни. Експерти попереджали, що колишня територія жорстокого Ганса Хюттіга буде важким регіоном для освоєння, але завдяки важкій роботі та співпраці Вестморленда і місцевих лідерів, було досягнуто чудо. Вперше в сучасній історії яскравий мозаїчний сплав народів зможе співіснувати в суверенних і визнаних державах. Коли його запитали про коментарі, Вестморленд заявив: "Я лише виконав свій обов'язок як солдат і представник США. Справжні заслуги належать чоловікам і жінкам Африки, які погодилися працювати разом, щоб прокласти новий шлях у майбутнє.""
WORLD.18105.a: "Свобода, нарешті."

WORLD.18106.t: "[Get_newspaper_header]Хаос у Центральноафриканській Республіці"
WORLD.18106.d: "Хаос знову прийшов на африканський континент, оскільки Центральноафриканська Республіка, яка була визнана великим демократичним експериментом, здається, розпалася на безліч нових націй. Хоча точні деталі того, що призвело до цього результату, ймовірно залишаться ретельно прихованими таємницями на роки, якщо не на десятиліття, експерти погоджуються, що це, ймовірно, говорить про відсутність компетентності з боку уряду США. Багато змінних, з якими Центральноафриканська Республіка була змушена працювати, ускладнили процес деколонізації в кілька разів. Президент США не пояснив причини невдачі на недавній прес-конференції, але заявив, що будь-які вільні країни Африки, які шукають друга, можуть знайти його в Сполучених Штатах. "Ми не маємо зла до жодної країни Африки," - були процитовані його слова, "як тільки нас покличуть, ми відповімо. Ми не відмовимо від прохання жодної країни через наші власні помилки.""
WORLD.18106.a: "Чи почують вони нас?"

WORLD.18107.t: "[Get_newspaper_header]Хаос у Центральноафриканській Республіці"
WORLD.18107.d: "Хаос знову прийшов на африканський континент, оскільки Центральноафриканська Республіка, яка була визнана великим демократичним експериментом, здається, розпалася на безліч нових націй. Хоча точні деталі того, що призвело до цього результату, ймовірно залишаться ретельно прихованими таємницями на роки, якщо не на десятиліття, експерти погоджуються, що це, ймовірно, говорить про відсутність компетентності з боку уряду США. Багато змінних, з якими Центральноафриканська Республіка була змушена працювати, ускладнили процес деколонізації в кілька разів. Президент США не пояснив причини невдачі на недавній прес-конференції, але заявив, що будь-які вільні країни Африки, які шукають друга, можуть знайти його в Сполучених Штатах. "Ми не маємо зла до жодної країни Африки," - були процитовані його слова, "як тільки нас покличуть, ми відповімо. Ми не відмовимо від прохання жодної країни через наші власні помилки.""
WORLD.18107.a: "Чи почують вони нас?"

WORLD.18108.t: "[Get_newspaper_header]ОВН розділяє Центральноафриканську Республіку"
WORLD.18108.d: "Коли Центральноафриканську Республіку було вперше створено, критики американської зовнішньої політики вважали, що цей проект приречений на невдачу. Сьогодні вони довели свою правоту, оскільки Президент [USA.GetLeader] оголосив про розпад Республіки після невдалої саміту, на якому зібралися лідери африканських країн.\n\nВину за це передчасне розпадення покладено безпосередньо на генерала Вільяма Вестморленда, чия нездатність управляти тимчасовою диктатурою мільйонів людей коштувала американським інтересам дорого. Результатом цього стало надання незалежності численним африканським націям. Міжнародні спостерігачі вважають, що Америка спробує залучити ці нові нації до своєї сфери впливу. Однак вони вважають, що такі спроби будуть марними, оскільки багато з цих лідерів заявляють, що вони вважають за краще свободу в бідності, а не рабство з багатствами."
WORLD.18108.a: "Очікуваний результат."

WORLD.18109.t: "[Get_newspaper_header]Африканерський Волкштат приєднується до Пакту"
WORLD.18109.d: "Після падіння Райхстату Ганса Хюттіга Африканерський Волкштат став однією з небагатьох держав, кордони та політичний порядок яких були чітко визначені. Відновивши зв'язки з зовнішнім світом, держава отримала міжнародне визнання за підтримки Ґерманського Райху.\n\nВ обмін на це визнання, і під тиском внутрішніх і міжнародних факторів за його співпрацю з Хюттігом, президент Герцог погодився піти у відставку, а новим президентом став Пітер Вільям Бота. Ґерманський патріотизм, пам'ять про важливу роль Райху у Південноафриканській війні стали вирішальними для його перемоги. Фактично, відразу після вступу на посаду Бота офіційно попросив про прийняття Волкштату до складу Єдиного Пакту, що було люб'язно прийнято Німеччиною."
WORLD.18109.a: "Ґерманія повернулася в Африку."
WORLD.18109.b: "Наша позиція на континенті відновлена!"
WORLD.18109.c: "Не визнавати негайно."

WORLD.18110.t: "[Get_newspaper_header]Яап Мареї став президентом Африканерського Волкштату"
WORLD.18110.d: "Після падіння Райхстату Ганса Хюттіга Африканерський Волкштат став однією з небагатьох держав, кордони та політичний порядок яких були чітко визначені. Відновивши зв'язки з зовнішнім світом, держава отримала міжнародне визнання за підтримки Ґерманського Райху.\n\nВ обмін на це визнання, і під тиском внутрішніх і міжнародних факторів за його співпрацю з Хюттігом, президент Герцог погодився піти у відставку, а новим президентом став Яап Мареї. Колапс німецького впливу в Волкштаті, повернення до половинчастої участі Райху у Південноафриканській війні, згадуються як основні причини перемоги Мареї над фракцією ГНП, що підтримує німецький націоналізм."
WORLD.18110.a: "Бури стверджують свою нейтральність."
WORLD.18110.b: "Кроти!"
WORLD.18110.c: "Відправити пану Марею пляшку нашого найкращого шампанського."

 ### Thailand Events

WORLD.19001.t: "[Get_newspaper_header]Теракт в Ананта Самахом Холл, Таїланд"
WORLD.19001.d: "Лише через тиждень після смерті маршала Плека Фібунсонгкхрама, Національна асамблея Таїланду стала мішенню терористичного нападу. Під час засідання асамблеї в будівлі Ананта Самахом Парламенту було підірвано бомбу, в результаті чого загинуло 10 держслужбовців. Президент асамблеї створив комітет для розслідування нападу і висловив занепокоєння, що це могло бути політично мотивованим.\n\nЕксперти в регіоні погоджуються з оцінкою Президента. Бомба відкинула назад вже затриману спробу підтвердити наступного президента Республіки. На жаль, є ймовірність, що противники обраного кандидата асамблеї затягуватимуть це рішення будь-якими способами."
WORLD.19001.a: "Чи зможуть вони оголосити нового президента?"

WORLD.19002.t: "[Get_newspaper_header]Санг Патанонтай призначений тимчасовим президентом Таїланду"
WORLD.19002.d: "Після нещодавньої смерті президента Плека Фібунсонгкхрама, Національна асамблея Таїланду номінувала Санга Патанонтая, колишнього радника покійного маршала, тимчасовим президентом Республіки. Президент асамблеї підтвердив, що це лише тимчасове рішення до формування нового уряду.\n\nПатанонтай є як логічним кандидатом для тимчасового президента, так і аутсайдером у основних колах політики Таїланду. Він вірно служив попередньому президенту протягом років, незважаючи на свої помірковані зв'язки з тайськими профспілками, що робить його непопулярним серед правих елементів уряду Таїланду. Санг вступає на посаду президента з невизначеним майбутнім, оскільки домінуючі фракції оточують тимчасового президента, чекаючи моменту, коли його можна буде замінити на більш зручного кандидата."
WORLD.19002.a: "Сподіваємось, це буде мирний перехід влади."

WORLD.19003.t: "[Get_newspaper_header]Військовий переворот у Таїланді скидає Санга Патанонтая"
WORLD.19003.d: "Обрання Санга Патанонтая тимчасовим президентом Таїланду мало стати першим кроком до мирного розв'язання політичної кризи, викликаної смертю маршала Плека Фібунсонгкхрама. На жаль, цей мирний перехід не здійснився, оскільки озброєні члени Національної армії Таїланду оточили будівлю Таї Кху Фах і змусили Патанонтая подати у відставку під загрозою зброї.\n\nДо цього хаосу додається загальна плутанина в армії, хто ж повинен очолити Таїланд. Незважаючи на їх єдність проти Патанонтая, виглядає так, що ТНА не позбавлені фракціоналізму, що панував у Національній асамблеї. Зброя, яка була націлена на одну мету, тепер повертається одна на одну, оскільки Таїланд готується до хаосу та кровопролиття."
WORLD.19003.a: "Вони лише домовилися про те, хто не повинен очолювати Республіку."

WORLD.19004.t: "[Get_newspaper_header]Санг Патанонтай підтверджений президентом Таїланду"
WORLD.19004.d: "Після періоду невизначеності та напруженості, що завершився невдалим військовим переворотом, Санг Патанонтай був підтверджений Національною асамблеєю. Раніше тимчасовий президент Таїланду, Патанонтай тепер править самостійно. У публічному виступі сьогодні Санг пообіцяв Таїланду, що він не тільки зберігатиме цінності правління покійного маршала, але й введе нову еру інновацій і розвитку, і обіцяє ніколи не "здаватися ворогам нашої нації, як внутрішнім, так і зовнішнім."\n\nПідтвердження Санга як президента - це шок для політики Таїланду. Багато згадують його домашній арешт за наказом Саріта Танарата, і навіть його тісна співпраця з покійним маршалом Пібуном не вказувала на те, що він стане президентом Таїланду. Але новий президент виявився здатним перевершити ці очікування і має намір привести країну до нових висот."
WORLD.19004.a: "Чи зможе він зберегти курс, який проклав маршал Пібун?"

WORLD.19005.t: "[Get_newspaper_header]Таїландський президент Плек Фібунсонгкхрам помер"
WORLD.19005.d: "З останніми урядовими чистками, які привернули увагу нації, сталося ще одне несподіване подія, яка поставила Республіку Таїланд на межу зупинки: смерть Великого маршала, Батька нації, Плека Фібунсонгкхрама. Від його участі в революції 1932 року проти королівського абсолютизму до керівництва Таїландом під час війни проти європейських імперіалістів, до проголошення тайської республіки - спадщина Фібунсонгкхрама, можливо, є найвеличнішою в тайській історії.\n\nЙого смерть була оголошена нації тимчасовою урядовою радою, що складається з різних видатних бюрократів і генералів, яким тепер доведеться управляти негайними наслідками втрати патера патріа Таїланду. Однак, з огляду на те, що влада тепер у руках найбільш хитрих інтригуючих осіб Бангкоку, багато хто тепер задається питанням, як довго триватиме баланс сил, і чи не занурить насильство молоду республіку."
WORLD.19005.a: "Буря перед бурею."

WORLD.19006.t: "[Get_newspaper_header]Військовий переворот у Таїланді"
WORLD.19006.d: "Зі зростанням ситуації після смерті Великого маршала Фібунсонгкхрама, генерал Таном Кіттікачорн здійснив переворот, щоб захопити владу під час хаосу. Маючи вже десятки років досвіду в військовій бюрократії, потік озброєних підрозділів ринув до Бангкоку, де генерал склав присягу як новий президент республіки.\n\nОднією з його перших дій стали заклики до лояльності та патріотизму; тисячі солдатів марширують в містах молодої республіки, віддаючи честь президенту Таному, який спостерігає за нацією очима інтриганта. Проте, поки Таїланд все ще відновлюється після поранень, світ спостерігає, як народжується новий тиран на заході Меконгу."
WORLD.19006.a: "Схоже, що все буде по-старому."

WORLD.19007.t: "[Get_newspaper_header]Військовий переворот у Таїланді"
WORLD.19007.d: "У хаосі після смерті Великого маршала Фібунсонгкхрама, Чатічай Чунхаван мобілізував свої сили для швидкого захоплення влади, щоб заявити претензії на президентство. Завдяки лояльності серед цивільної адміністрації та військових бюрократій, люди нового президента міцно тримають ситуацію, яка швидко стабілізується.\n\nПублічні виступи президента Чатічаї пропонують гарантії багатства та процвітання для народу, запевняючи, що безпека та добробут повернуться під його керівництвом. Однак його солодкі обіцянки підкріплені тіньовим зростанням присутності секретної поліції по всій країні, і спостерігачі все ще не впевнені в майбутньому внутрішньої безпеки Таїланду."
WORLD.19007.a: "Незмінна зміна."

WORLD.19008.t: "[Get_newspaper_header]Військовий переворот у Таїланді"
WORLD.19008.d: "З руйнуванням балансу сил після смерті Великого маршала Фібунсонгкхрама, адмірал і командувач флоту Таїланду Таван Тхамронгнавасават зібрав свої сили для того, щоб виштовхнути залишки тимчасової урядової ради з їхніх виконавчих посад. Його принциповий характер, репутація та харизматичне лідерство завоювали народ і, незважаючи на суперечності всередині служби, підтримку багатьох у армії.\n\nОднак ситуація залишається делікатною; коаліція підтримки адмірала Тавана – це лише будинок з карт, який лише частково підтримується військовим керівництвом. Зараз невідомо, як нова військова адміністрація впорається з нинішнім хаосом у молодій республіці, і лише час покаже, чи буде тривати підтримка уряду адмірала Тавана."
WORLD.19008.a: "Краще він, ніж жахлива смерть."

WORLD.19009.t: "[Get_newspaper_header]Бій на річці Чао-Прая; Президент Таїланду викрадений"
WORLD.19009.d: "Польовий маршал і президент Таїланду Таном Кіттікачорн був сьогодні затриманий дисидентами з морського флоту, що спричинило масштабний хаос у Таїланді. Інцидент почався, коли президент Таном відвідав церемонію на пристані Рачаворадіт, де озброєні та незадоволені морські офіцери оточили пристань і викрали президента. Солдати, лояльні уряду, намагалися перехопити судно на річці Чао-Прая, в той час як інші дисиденти ринули в місто, щоб захопити його для викрадачів. Ситуація переросла в міжусобні бої між прихильниками і повстанцями в Бангкоку та навколо нього.\n\nМіжнародні спостерігачі, знайомі з тайською політикою, припускають, що це викрадення може бути початком перевороту, після чуток про невдоволення серед військових через суперечливе правління Танома. Місцезнаходження президента Танома та його викрадачів наразі невідоме."
WORLD.19009.a: "Де у світі знаходиться Таном Кіттікачорн?"

WORLD.19010.t: "[Get_newspaper_header]Таном Кіттікачорн оголошений мертвим; Прапас призначений президентом"
WORLD.19010.d: "Цього вечора сили, лояльні президенту Тану Кіттікачорну, знайшли його та його викрадачів на річці Чао-Прая. Після тривалої битви лоялісти увійшли на бунтівний флагман і виявили президента мертвим. Хоча це ще не було офіційно оголошено, підозрюють, що президент Таном був убитий під час бою.\n\nУ відповідь Революційна рада терміново підвищила польового маршала Прапаса Чарусатієна до посади президента. У своєму інавгураційному виступі президент Прапас засудив переворот, стверджуючи, що це викрадення було справою комуністів і агітаторів Сері Тай, які намагаються дестабілізувати Таїланд. Режим Прапаса наказав провести масову чистку в уряді, арештовуючи всіх, хто підозрюється в допомозі чи співчутті перевороту. Міліціянти та солдати штурмують урядові будівлі, арештовуючи кожного, хто потрапляє на шляху нового режиму."
WORLD.19010.a: "Холодний захват армії над Таїландом."

WORLD.19011.t: "[Get_newspaper_header]Тайська армія скидає Танома і Прапаса; Кріс Сівар призначений президентом"
WORLD.19011.d: "Після викрадення президента Тана Кіттікачорна новий уряд з'явився в Таїланді під керівництвом самопроголошеного Ради перевороту та його лідера, колишнього генерала і нового президента Криса Сівари. У радіопромові, виголошеній сьогодні, президент Кріс засудив обох колишніх президентів Танома та польового маршала Прапаса Чарусатієна як деспотичних тиранів, пообіцявши відновити стабільність і праведне правління в республіці.\n\nХоча кінець цього жорстокого режиму приніс полегшення багатьом у Таїланді, деякі ставлять під сумнів стабільність цього нового уряду. Кабінет Криса складається з військових офіцерів і технократів, об'єднаних лише ненавистю до Танома. Тепер, коли цей об'єднуючий образ ненависті був скинутий, спостерігачі сумніваються у стабільності уряду Ради перевороту."
WORLD.19011.a: "Може, це буде покращення?"

WORLD.19012.t: "[Get_newspaper_header]Кріс Сівар йде у відставку з посади президента Таїланду"
WORLD.19012.d: "Президент Кріс Сівар з Таїланду сьогодні подав у відставку після трирічного терміну, який він здобув, захопивши владу від попереднього уряду. Його наступник, генерал Кріяґсак Чамнанан, сформував перший цивільний кабінет з 1950-х років і заявив про намір провести вільні вибори "якнайшвидше".\n\nВідомий серед своїх колег як "П Кріанг", новий президент користується певною популярністю серед тайського народу як поважаний герой війни. Однак багато хто сумнівається в тому, скільки влади має новий президент; його попередник зберігає вплив на уряд, а олігархи продовжують керувати економікою на своїх умовах. Все ж, багато тайців порівнюють цей уряд із репресіями та хаосом останніх двох десятиліть на користь останнього."
WORLD.19012.a: "Так, можливо, це покращення."

WORLD.19013.t: "[Get_newspaper_header]Бунти через нафтову кризу в Таїланді"
WORLD.19013.d: "Внаслідок нафтової кризи, що чинить економічний тиск на Таїланд, тайський народ вже знайшов мішень для своїх фрустрацій. У відповідь на дерегулювання іноземних компаній президентом Чатічай Чунхаваном, було зафіксовано низку атак на японські та китайські бізнеси по всьому Таїланду.\n\nХоча спочатку це обмежувалося окремими інцидентами, антиіноземна напруга вибухнула хвилею руйнувань на вулиці Яоварат, головній вулиці китайського кварталу Бангкока. Тайські націоналісти та обурені громадяни атакували іноземні магазини, поранивши десятки людей та знищивши мільйони вартості майна. Місцеві ЗМІ вже назвали цю ніч Другим боєм на Яоварат, посилаючись на схожу руйнівну подію на вулиці Яоварат понад десятиліття тому."
WORLD.19013.a: "Ніде не безпечно від нафтової кризи."

WORLD.19014.t: "[Get_newspaper_header]Розпуск Хана Радсадон"
WORLD.19014.d: "Після тижнів хаосу на вулицях і паніки в уряді, президент Таїланду Чатічай Чунхаван видав низку прокламацій: успішні переговори з анти-Спери протестувальниками, перестановки в уряді для усунення старої гвардії від влади - і, як масивний шок для політики Таїланду, розпуск Хана Радсадон. Крім того, президент Чатічай оголосив про майбутнє впровадження нової конституції та створення власної політичної партії, Партії національного розвитку, щоб брати участь у нових виборах, які мають відбутися в найближчому майбутньому.\n\nЦі численні зміни одночасно хвилюють і лякають багатьох у Таїланді. Хоча багато хто хвалить Чатічаї за впровадження нової Таїланду, інші вважають, що президент видав ці зміни з такою швидкістю, що лише він може на них правильно реагувати, дозволяючи йому закріпити свою владу над нацією."
WORLD.19014.a: "Як слідкувати за тижнями, де відбуваються десятиліття?"

WORLD.19015.t: "[Get_newspaper_header]Оголошено воєнний стан у Таїланді"
WORLD.19015.d: "Танки та солдати вийшли на вулиці Бангкока сьогодні, коли президент Чатічай Чунхаван оголосив воєнний стан для всього Таїланду. Після невдалих переговорів з анти-Спери протестувальниками, тайські війська були мобілізовані для відновлення порядку, а опоненти рішення Чатічаї в його кабінеті були усунені. Його оголошення також передбачає тимчасову зупинку конституції, і Чатічай тепер керуватиме указами на невизначений час.\n\nЗ часів правління маршала Плека Фібунсонгкхрама Таїланд не бачив такого автократичного правління. Деякі дисидентські історики в Таїланді стверджують, що централізація влади Чатічаї неперевершена навіть монархією Сіаму. У той час як режим продовжує зміцнювати свою позицію проти опозиційних сил у владі та серед населення, багато хто задається питанням, що станеться з Таїландом під новою диктатурою Чатічаї."
WORLD.19015.a: "Вже очікується, що урядові будівлі будуть мати портрети нового президента."

WORLD.19016.t: "[Get_newspaper_header]Оголошено воєнний стан у Таїланді"
WORLD.19016.d: "Після провалу переговорів президента Таїланду Чатічаї Чунхавана з анти-Спери протестувальниками, армія захопила контроль над державою. Оголошено воєнний стан, і солдати марширують до Бангкока, щоб придушити триваючі заворушення.\n\nПодальші чутки з уряду Таїланду свідчать, що позиція Чатічаї більше не є такою сильною, і його уряд тепер відкатує свої політики економічної дерегуляції, які деякі вважають причиною поточних заворушень. Спекуляції щодо справжньої сили за троном припускають, що його прем'єр-міністр, Прамарн Адирексарн, працював за лаштунками, щоб забезпечити свою коаліцію з армією та контроль над урядом. Багато хто боїться повернення до найгірших ексцесів маршала Пібуна."
WORLD.19016.a: "Що залишиться від спадщини Чатічаї після цього?"

WORLD.19017.t: "[Get_newspaper_header]Бангкокська конференція"
WORLD.19017.d: "Сьогодні розпочинається Бангкокська конференція, серія переговорів і зустрічей, що проводяться переважно між урядом Таїланду та Сері Тай, підпільним рухом опору, що утворився проти Японії під час Другої світової війни. За участю представників CPS і ОВН, очікується, що Бангкокська конференція вирішить довготривале напруження між урядом і повстанцями, а також відкриє можливість для повернення вигнанців до Таїланду.\n\nНа знак доброї волі, президент Таван і лідер Сері Тай Мом Раджавонгсе Сені Прамодж потисли руки перед Орієнтальним готелем, місцем проведення цієї конференції. Наступні кілька місяців, ймовірно, будуть напруженою серією переговорів, з можливістю більш ліберального Таїланду в майбутньому."
WORLD.19017.a: "Можливо, мирний результат можливий."

WORLD.19018.t: "[Get_newspaper_header]Бангкокська конференція завершена успіхом"
WORLD.19018.d: "Сьогодні в Таїланді вибухнуло святкування після успішного завершення Бангкокської конференції. Переговори між урядом і вигнанцями Сері Тай завершилися позитивно, завершивши дві декади напруження та розділення між двома фракціями. Президент Таван та лідер Сері Тай Мом Раджавонгсе підписали договір, що дозволяє повернення вигнанців Сері Тай до Таїланду, встановлення виборів протягом наступних дванадцяти місяців і планування другого референдуму щодо монархії.\n\nПісля успішних переговорів поширилися чутки по всій нації про те, що колишніх вигнанців Сері Тай запрошують до уряду. Місцеві ЗМІ обговорюють історії про пропозиції вигнанцям зайняти посади в кабінеті або лідерські ролі в новостворених політичних партіях, але офіційних оголошень ще не зроблено."
WORLD.19018.a: "Ласкаво просимо додому."

WORLD.19019.t: "[Get_newspaper_header]Військовий переворот у Таїланді"
WORLD.19019.d: "Невдача переговорів на Бангкокській конференції призвела до катастрофічного результату для уряду і вигнанців. Сьогодні вранці дисидентські військові офіцери здійснили переворот проти уряду Таїланду, оточивши Орієнтальний готель і заарештувавши як військових представників, так і президента Тавана. Деяким представникам Сері Тай вдалося втекти під час хаосу, але багато інших також були арештовані; їх доля невідома.\n\nАдмірал Сангад Чалорю, головний організатор цього перевороту, оголосив сьогодні, що військовий хунта під його командуванням взяла під контроль державу Таїланд. Він заявив, що переворот був спровокований "амбіційними та незадовірними" елементами як цивільної служби, так і військових структур, і що його група офіцерів має намір "захищати Таїланд від тих, хто хоче спотворити його дух заради власних інтересів"."
WORLD.19019.a: "А ті, хто втекли, більше ніколи не повернулися додому."

WORLD.19020.t: "[Get_newspaper_header]Військовий переворот у Таїланді"
WORLD.19020.d: "Розпад переговорів на Бангкокській конференції призвів до катастрофічного результату для уряду та вигнанців. Сьогодні вранці дисидентські військові офіцери здійснили переворот проти уряду Таїланду, оточивши Орієнтальний готель і заарештувавши як військових представників, так і президента Тавана. Деяким представникам Сері Тай вдалося втекти під час хаосу, але багато інших також були арештовані; їхня доля невідома.\n\nПереворот очолив генерал Чалард Хірансірі, чия кліка реакціонерів захопила контроль над державою Таїланд після їх власного незадоволення урядовим підходом до примирення з Сері Тай. У публічній заяві, зробленій незабаром після арешту Тавана, генерал Чалард заявив, що він "захистить Таїланд від не-тайських елементів", виокремлюючи рух Сері Тай як шкодливу силу."
WORLD.19020.a: "А ті, хто втекли, більше ніколи не повернулися додому."

WORLD.19021.t: "[Get_newspaper_header]Приді Баномйонг обраний президентом Таїланду"
WORLD.19021.d: "Вперше за десятиліття Таїланд обрав нового президента: Приді Баномйонга з лівої партії Сахачіп. Колишній лідер Хана Радсадон, Приді втратив прихильність маршала Плека Фібунсонгкхрама через його диктаторські настрої, що спричинило довгу ворожнечу між ними, яка кульмінувала в цей момент: Фібун вийшов з влади, Приді очолив Таїланд.\n\nУ своїй переможній промові Приді підтвердив своє обіцяння реалізувати радикальні економічні реформи, викладені у "Жовтому документі", який він написав у 1933 році. З коаліцією лівих інтелектуалів і організаторів робітників на основі своєї партії Сахачіп, Приді прагне відродити іскру надії, яка колись зігрівала дух Хана Радсадон, і завершити справу 1932 року: створення справедливого, вільного і процвітаючого Таїланду."
WORLD.19021.a: "Ліві у Сфері? Це не триватиме."

WORLD.19022.t: "[Get_newspaper_header]Кхуанг Апхайвонг обраний президентом Таїланду"
WORLD.19022.d: "Міністерство внутрішніх справ Таїланду підтвердило перемогу на президентських виборах 1968 року: Кхуанга Апхайвонга з Демократичної партії. Син аристократичного дому Абхайвонгсе і колишній міністр кабінету маршала Фібунга, Кхуанг виступає після правління Тавана як голос минулого і майбутнього нації, і народ Таїланду обрав його для ведення країни в нову еру процвітання.\n\nДемократична партія Кхуанга, відома в місцевому середовищі як Пратчатіпат, є зібранням регіональних політиків і старих аристократів, готових до демократії. Поєднуючи як відновлення забутих тайських цінностей, так і широку, але обережну економічну реформу, Демократична партія займає середину політичного спектра і шукає співпрацю з іншими партіями. Завуальовані коментарі в промові новообраного президента свідчать, що в майбутньому Таїланд може провести референдум про відновлення монархії."
WORLD.19022.a: "Минуле і майбутнє зливаються в теперішньому."

WORLD.19023.t: "[Get_newspaper_header]Президент Таїланду Кхуанг Апхайвонг помер"
WORLD.19023.d: "Кхуанг, який був уже літнім на момент свого обрання, але розумово гострим, помер від серцевої недостатності минулого тижня. Країна не мала часу на скорботу, оскільки після його смерті Національні збори негайно зібралися для номінації нового президента. Те, що відбулося після цього, стали ночі закулісних домовленостей, дні гарячих суперечок у зібраннях та навіть повідомлення про бійки у коридорах.\n\nПісля всього цього Національні збори обрали нового президента: Сеня Прамоджа, колишнього прем'єр-міністра і голос монархії. Хоча він і викликав суперечки навіть серед членів Демократичної партії через його уявну зарозумілість і нерішучість, підтримка серед старої гвардії забезпечила його перемогу, і він пообіцяв використовувати свою владу для підтримки традиційних цінностей і збереження шляху, прокладеного Кхуангом для Таїланду."
WORLD.19023.a: "Роялісти отримали владу, що вони з нею робитимуть?"

WORLD.19024.t: "[Get_newspaper_header]Президент Таїланду Кхуанг Апхайвонг помер"
WORLD.19024.d: "Кхуанг, який був вже літнім на момент свого обрання, але розумово гострим, помер від серцевої недостатності минулого тижня. Країна не мала часу на скорботу, оскільки після його смерті Національні збори негайно зібралися для номінації нового президента. Те, що відбулося після цього, стали ночі закулісних домовленостей, дні гарячих суперечок у зібраннях і навіть повідомлення про бійки у коридорах.\n\nПо закінченню цього, Національні збори обрали нового президента, і першу жінку-президента: Леху Апхайвонг, колишню міністерку внутрішніх справ, вдову покійного президента і кандидатку, яку підтримали регіональні сили та молоді ліберальні активісти Демократичної партії. Як представниця більш ліберальних елементів Демократичної партії, Леха пообіцяла продовжувати й розширювати економічні реформи, запроваджені покійним президентом."
WORLD.19024.a: "Нова ера чекає на Таїланд!"

WORLD.19025.t: "[Get_newspaper_header]Прямарн Адирексарн обраний президентом Таїланду"
WORLD.19025.d: "Міністерство внутрішніх справ Таїланду підтвердило обрання Прямарна Адирексарна з партії Таїландської нації президентом Республіки. Контроверсійна та барвиста фігура в політиці Таїланду, Прямарн є популістом, який за його словами, обіцяв захищати Таїланд від "подвійної загрози лівих агітаторів і монархістів, які прагнуть до влади".\n\nКампанія президента Прямарна була відзначена контроверсійною риторикою, особливо його гаслом "право вбивати лівих". Однак народ схвалив його кандидатуру, яку його ліві опоненти називають партією капіталістів і реакціонерів, і Прямарн вступає на посаду, прагнучи зміцнити повноваження Національних зборів та вести Таїланд у часи кризи."
WORLD.19025.a: "Цікаві часи чекають Таїланд."

WORLD.19026.t: "[Get_newspaper_header]Військовий переворот у Таїланді"
WORLD.19026.d: "Після бурхливого періоду демократичного правління Таїланд потрапив під військову хунту. Вранці озброєні сили, лояльні до нового сильного лідера, адмірала Сангада Чалорю, увійшли до засідання Національних зборів та заарештували багатьох депутатів, включаючи колишнього президента.\n\nЗвертаючись з будівлі Тай-Кху-Фах, адмірал Сангад оголосив переворот як превентивний захід проти "амбіційних і невірних" елементів серед цивільної та військової адміністрації, виокремлюючи "лівих агітаторів, які загрожують нашій нації". Реакційні міліції були мобілізовані для зміцнення контролю Сангада, хоча експерти ставлять під сумнів, чи дійсно Сангад контролює ситуацію, чи це високопрофільні члени правих аналітичних центрів, які складають його новий кабінет, є справжніми силами, що стоять за цією новою хунтою."
WORLD.19026.a: "Демократія: мало більше ніж невдалий експеримент."

WORLD.19027.t: "[Get_newspaper_header]Військовий переворот у Таїланді"
WORLD.19027.d: "Після бурхливого періоду демократичного правління Таїланд тепер перебуває під військовою хунтою. Вранці озброєні сили, лояльні новому сильному лідеру генералу Чаларду Хірансірі, увійшли в Ананту Самакхом під час засідання Національних зборів і заарештували депутатів разом з колишнім президентом.\n\nЗвертаючись до натовпу лоялістів на засіданні, генерал Чалард оголосив про закінчення некомпетентності та нестабільності попереднього режиму. Помітно відсутні серед депутатів, яких витягли з парламенту, були члени партії Чарт Тай, з якими Чалард має глибокі зв'язки. Як представник фракції Сой Ратчакру у війську, групи, пов'язаної зі старими бюрократами Хана Радсадон, Чалард, ймовірно, буде правити жорсткою рукою, очищаючи адміністрацію від невірних бюрократів і офіцерів."
WORLD.19027.a: "Хана Радсадон повертається з могили."

WORLD.19028.t: "[Get_newspaper_header]Національний уряд утворений у Таїланді"
WORLD.19028.d: "Після періоду політичного хаосу, відомого серед тайців як Чорний лютий, президент Приді Баномйонг оголосив про створення уряду єдності та введення надзвичайного стану для швидкого впровадження цього уряду. Нова коаліція складається з політиків усіх політичних партій, які перебувають у прийнятних межах, а також деяких підрозділів збройних сил на чолі з вірним Приді генералом Нет Кхемайотіном, об'єднаних підтримкою президента Приді в цей бурхливий час для Таїланду.\n\nДеякі припускають, що це консолідація влади була здійснена у відповідь на можливий військовий переворот, а багато хто вважає, що раптовий диктаторський стиль може погубити шанси Приді на успіх, коли відбудуться вільні та чесні вибори, але ніхто не може заперечити, що президент Приді вийшов з Чорного лютого як безперечний лідер Таїланду."
WORLD.19028.a: "Таїланд сподівається, що він не стане ще одним маршалом Пором."

WORLD.19029.t: "[Get_newspaper_header]Супха Сіріманон обраний президентом Таїланду"
WORLD.19029.d: "Незважаючи на нещодавній період політичного хаосу, демократична система Таїланду витримала вибори, на яких новим президентом став Супха Сіріманон. Протежованець лівого лідера Хана Радсадон Приді Баномйонга, Супха прийшов до влади, обіцяючи економічні зміни, схожі на ті, що були викладені у Жовтому документі Приді, та прагнення до соціальної справедливості.\n\nЯк лідер, Супха очікується, що буде представляти найбільш прийнятні ліві сили в тайській політиці: патріотичні та прогресивні, обіцяючи радикальні економічні реформи як засіб для вирішення національних проблем. Завдяки широкій популярній підтримці та кабінету однодумців-реформаторів, амбіції Супхи можуть змінити обличчя Таїланду назавжди."
WORLD.19029.a: "Чи буде він успішним чи ні?"

WORLD.19030.t: "[Get_newspaper_header]Пуєй Унгпакорн обраний президентом Таїланду"
WORLD.19030.d: "Демократія Таїланду тримається ще один виборчий цикл, оскільки Міністерство внутрішніх справ підтвердило обрання нового президента: Пуєя Унгпакорна з партії Сахачіп. Колишній губернатор Банку Таїланду, президент Пуєй був обраний на платформі соціального забезпечення та поліпшення якості життя для всіх громадян.\n\nПідйом Пуєя до президентства викликав критику з боку правих секторів тайського суспільства та лоялістів військових, які вважають, що його опозиція до дій сил безпеки щодо рейдів в університеті Тхаммасат видає слабкість і небажання захищати націю. Тим не менше, Пуєй був обраний завдяки широкій популярній підтримці і пообіцяв захищати та просувати інтереси громадян Таїланду, як йдеться у його слогані: "від утроби до могили"."
WORLD.19030.a: "Таїланд пише нову хроніку надії."

WORLD.19031.t: "[Get_newspaper_header]Кукріт Прамодж обраний президентом Таїланду"
WORLD.19031.d: "Незважаючи на нещодавній хаос у країні, демократична система Таїланду залишається стабільною ще один виборчий цикл з обранням нового президента: Кукріта Прамоджа. Представник благородної родини Прамодж, Кукріт прийшов до влади завдяки політичній коаліції між його прогресивною партією та партією його брата Сені - Демократичною партією.\n\nПопулістська програма Кукріта знайшла відгук у багатьох виборців на селі, обіцяючи розширення сільської інфраструктури, і привернула увагу виборців у містах завдяки обіцянці підвищити мінімальну заробітну плату. Окрім цих матеріальних обіцянок, Кукріт також публічно пообіцяв переглянути питання монархії - або її відсутності, оскільки Кукріт і коаліція Као На планують повернення Рами VIII на тайський трон."
WORLD.19031.a: "Партія благородного обов'язку повертається до Таїланду."

WORLD.19032.t: "[Get_newspaper_header]Тхамманун Тіен-нгерн обраний президентом Таїланду"
WORLD.19032.d: "Після нещодавнього хаосу в Таїланді з'явився новий президент, який пообіцяв відновити порядок та стабільність: президент Тхамманун Тієн-нгерн від Партії громадян Таїланду, коаліції ультраправих політиків, що відкололися від партій Таїландської нації та Демократичної партії. Тхамманун був колишнім губернатором Бангкока і одним з найбільш гучних прихильників рішучих дій під час стосунків у Бангкоку.\n\nУ промові перед першим офіційним засіданням кабінету, що відбулася перед будівлею Тай-Кху-Фах, президент Тхамманун окреслив три основні напрямки своєї адміністрації: підтримка міських торговців та сільських селян, відновлення закону та порядку, а також знищення комуністів. Було обіцяно зняти обмеження для місцевих підприємств і збільшити бюджети для сил безпеки; своєчасна пропозиція, оскільки Тхамманун обіцяє назавжди покласти кінець нещодавньому хаосу."
WORLD.19032.a: "Чи проголосував тайський народ за ще одного маршала П.?"

#### Thailand SD Events Update



 # Japan New News Events
 WORLD.20000.t: "[Get_newspaper_header]Переворот в Японії!"
 WORLD.20000.d: "Шокуюча новина з Токійського імператорського палацу сьогодні: на фоні урядової хаосу та дисфункції, схоже, що принц Хіґашикуні, видатний старший державний діяч або джушін, і лорд-привітний печатник Кідо наказали кабінету, домінованому Йокусанкай, піти у відставку та дозволити членам імператорської родини та лоялістам імператора зайняти їх місце. Офіційні новини з Японії були мізерними останнім часом, але ті кілька джерел, що доступні, стверджують, що чиновники 'дуже стурбовані потенційними змовами в уряді'.\n\nТепер уряд, ймовірно, повністю впаде і буде замінений на уряд за вибором Кідо та Хіґашикуні. Плани нових правителів Японії поки що невідомі. Але побоювання полягають у тому, що Японська Дієта буде повністю відсторонена, і почнеться період правління указами. Якщо це правда, то виглядає, що Японія знову повертається до диктатури."
 WORLD.20000.a: "Можливо, цього разу назавжди."

 WORLD.20001.t: "[Get_newspaper_header]Переворот в Японії!"
 WORLD.20001.d: "Тривожні новини з Токіо сьогодні: цивільний уряд без попередження подав у відставку. Це невдовзі було наслідувано призначенням генерала Муто Акіри з Імператорської армії Японії (IJA) прем'єр-міністром. Ледве після призначення він наказав армії відновити порядок по всій Японії та в столиці.\n\nВсе це, ймовірно, виникло через попереднє розслідування уряду щодо збройних сил, яке, за словами Муто, перетворилося на "зрадницьке та божевільне полювання на відьом", яке потрібно було припинити. Зараз введено військовий стан. Повідомляється про тисячі арештів і сотні, які, ймовірно, були застрелені військовою поліцією, а іноземні кореспонденти були змушені залишатися під домашнім арештом. Муто, здається, мало турбується через глобальне засудження і вже почав придушувати всіх "провісників хаосу". Тому, що останні 24 години можна було почути з Токіо, це було:\n"
 WORLD.20001.a: "Постріли, сирени, а згодом... порядок."
 

 ### Britain Events

 WORLD.50014.t: "[Get_newspaper_header]Маргарет Тетчер обрана прем'єр-міністром Англії"
 WORLD.50014.desc: "Маргарет Тетчер вперше привернула увагу в 1951 році, коли стала наймолодшою жінкою, обраною до парламенту Королівства Англія. Тепер вона встановила новий рекорд: перша жінка-прем'єр-міністр. Після недавньої перемоги на загальних виборах, члени Королівської партії в Палаті громад проголосували за Тетчер як за свого лідера, тим самим зробивши її прем'єр-міністром.\n\nРезультат виборів був шоком для багатьох, хто був знайомий з парламентською політикою і довго вважав, що Тетчер є аутсайдером, яку внутрішнє коло Королівської партії завжди тримало на відстані. Опоненти в партії були здебільшого приголомшені її вибором наповнити кабінет 'старими' депутатами, найвідомішим з яких є Р.А. 'Раб' Батлер. Питання, чи вона керує своїм кабінетом або ж кабінет керує нею, залишиться без відповіді."
 WORLD.50014.a: "Англія вже мала королев, але прем'єр-жінка?"

 WORLD.50015.t: "[Get_newspaper_header]Реджинальд Модлін обраний прем'єр-міністром Англії"
 WORLD.50015.desc: "Після перемоги в Англійській громадянській війні, панування Королівської партії в країні здавалося абсолютним. Але їхній контроль не такий твердий, як можна було б подумати, адже на останніх парламентських виборах партія Об'єднаної Англії Реджинальда Модліна отримала контроль над Палатою громад.\n\nМодлін, разом з більш прагматичним депутатом Гарольдом Макмілланом, підтримував реформістське крило Королівської партії, хоча двоє часто сперечалися, як швидко Англії слід перейти до демократії. Вони вели відкол до нової партії, з Модліном як лідером і Макмілланом як головою, і останні вибори показали їхню популярність серед англійців."
 WORLD.50015.a: "Англія повільно рухається до свободи."

 WORLD.50016.t: "[Get_newspaper_header]Маргарет Тетчер переобрана прем'єр-міністром"
 WORLD.50016.desc: "Коли Маргарет Тетчер була призначена головою Королівської партії, багато хто правильно припустив, що вона стане лялькою: молодим, пластичним прем'єр-міністром, якого старі діячі партії використовуватимуть для реалізації своїх планів без заперечень. Але Тетчер, як можуть підтвердити багато депутатів Королівської партії, довела, що вона так само стійка та непохитна, як залізо.\n\nПротягом останніх кількох років вона змогла переграти Раба Батлера та інших велетнів Королівської партії, перетворюючи їхні спроби підірвати її владу на можливості для зміцнення власного впливу. Ці останні загальні вибори показали, що Королівська партія зберегла свою більшість в Палаті громад, що доводить, що Тетчер не лише утримує свій контроль над власною партією, а й зміцнила свій вплив по всій країні."
 WORLD.50016.a: "Лялька порвала свої нитки."

 WORLD.50017.t_reelection: "[Get_newspaper_header]Реджинальд Модлін переобраний прем'єр-міністром"
 WORLD.50017.t_firstelection: "[Get_newspaper_header]Реджинальд Модлін обраний прем'єр-міністром Англії"
 WORLD.50017.desc_reelection: "У несподіваному розвитку подій Об'єднана партія Англії, на чолі з прем'єр-міністром Реджинальдом Модліном, здобула ще одну більшість в парламенті. Піднявшись до популярності після відколу від Королівської партії після їхньої перемоги в Англійській громадянській війні, уряд Модліна дотримується повільного, але стабільного підходу до демократизації Англії.\n\nОднак цей шлях дивує багатьох політичних коментаторів, адже повільний шлях до демократії контрастує з гарячими обіцянками Модліна щодо вільної та незалежної Англії. Спекулюють, що саме Гарольд Макміллан, голова Об'єднаної партії, приймає більшість рішень, і Модлін є лише його маріонеткою. Можливо, Модлін намагався вирватися з-під контролю Макміла, але, як показує його дещо приглушена переможна промова, він, ймовірно, зазнав невдачі."
 WORLD.50017.desc_firstelection: "У несподіваному розвитку подій Об'єднана партія Англії, на чолі з прем'єр-міністром Реджинальдом Модліном, здобула більшість в парламенті. Хоча Об'єднана партія Англії не змогла захопити серце народу під час перших парламентських виборів, другі вибори стали їхнім проривом, адже вони здобули перемогу над довгий час домінуючою Королівською партією.\n\nПромова Модліна після перемоги обіцяла цілу низку реформ, спрямованих на прискорення демократизації Англії. Проте не все так, як здається, оскільки в кулуарах Палати громад говорять, що він і голова партії Макміллан не згодні щодо швидкості цих реформ, оскільки Макміллан віддає перевагу повільному, але практичному підходу, на відміну від швидкого та ідеалістичного підходу Модліна. Хто виграє в цій боротьбі та чи вплине це на прогрес Англії до справжньої демократії, поки що не відомо."
 WORLD.50017.a_reelection: "Ляльковод тягне за нитки, і Англія танцює по його волі."
 WORLD.50017.a_firstelection: "Той вогонь, що горить удвічі яскравіше, може горіти вдвічі коротше."

 WORLD.50018.t: "[Get_newspaper_header]Маргарет Тетчер відправлена у відставку в Англії"
 WORLD.50018.desc: "Коли Маргарет Тетчер була призначена головою Королівської партії, багато хто правильно припустив, що вона буде лялькою: молодим, піддатливим прем'єр-міністром, якого старі лідери партії могли використовувати для просування своїх планів без опору. Але Тетчер довела, що вона така ж стійка та непохитна, як залізо, що не сподобалося її маніпуляторам.\n\nТепер, здається, вони втратили терпіння. Після років спроб контролювати її та відмов від кожної пропозиції, старі лідери Королівської партії вирішили, що вона більше не варта зусиль, і розпочали рух щодо недовіри до прем'єр-міністра. Рішення пройшло, що призвело до відставки Тетчер з поста лідера Королівської партії та прем'єр-міністра.\n\nЗамість неї тепер сидить Р.А. 'Раб' Батлер, один з її потенційних маніпуляторів. І тепер, без Тетчер, Батлер може почати втілювати їхню програму без перешкод."
 WORLD.50018.a: "Якщо хочеш, щоб щось було зроблено правильно, зроби це сам."

 WORLD.50019.t: "[Get_newspaper_header]Військовий переворот у Королівстві Англія"
 WORLD.50019.desc: "Для жителів Лондона звук маршуючих солдатів і танків, що котяться вулицями міста, став занадто знайомим останнім часом. І ось вони почули його знову сьогодні, коли члени Королівської армії захопили будівлю Парламенту.\n\nПольові маршали Бернард Монтгомері та Джеральд Темплер, співлідери очевидного військового перевороту, виступили із заявою по радіо. Наводячи численні виправдання, генерали оголосили, що парламент буде розпущений на невизначений термін до подальших вказівок, а виконавча влада тимчасово перейде до панелі військових офіцерів.\n\nНезважаючи на їхні неодноразові запевнення, що цей уряд є "перехідним" і буде розпущений "якнайшвидше", багато людей як в самій Англії, так і поза її межами, важко вірять у ці слова. Ті, хто захоплює владу, зазвичай не поспішають її віддавати."
 WORLD.50019.a: "Вогонь Англії стає дедалі тьмянішим."

 WORLD.60001.t: "[Get_newspaper_header]Гарольд Вілсон обраний прем'єр-міністром Англії"
 WORLD.60001.desc: "Ідея повернення соціялізму в Англію давно здавалась абсурдною, але іноді реальність вміє суперечити ймовірностям.\n\nВибори, скликані після поразки старого режиму, показали, що Соціялістична Лейбористська Партія, на чолі з Гарольдом Вілсоном, бере на себе владу. Вілсон став символом компромісу між поміркованими соціал-демократами та радикальними соціялістами після того, як він став ключовою фігурою в Лейбористському підпіллі. Він був важливим у залученні підтримки з боку лівих до HMMLR і досі має підтримку команди Лівого Опору, зокрема командира Біла Александера.\n\nКабінет Вілсона обіцяє радикальні реформи, від скасування англійської монархії до створення всеосяжної системи соціального забезпечення. Але з розділом всередині партії, що зростає з кожним днем, першому лейбористському прем'єр-міністру за понад тридцять років буде не легко."
 WORLD.60001.a: "Як довго буде майоріти червоний прапор?"

 WORLD.60002.t: "[Get_newspaper_header]Джордж Джелліко обраний прем'єр-міністром Англії"
 WORLD.60002.desc: "Саме за консервативного уряду Англія впала під тиранію, і саме за консервативного уряду Англія звільниться. Національна Демократична Ліга виграла перші вільні вибори за останні роки, а її лідер Джордж Джелліко стане прем'єр-міністром.\n\nДжелліко пішов шляхом свого батька, служачи в Королівському флоті під час Другої світової війни, а згодом став харизматичним членом старого урядового міністерства закордонних справ. Його запросив Очінлек, і Джелліко став головним зв'язковим HMMLR з Америкою; з того часу він піднявся до керівництва НДЛ.\n\nНДЛ є ідеологічно різноманітною організацією, що включає в себе всіх, хто бажає відновити монархію та демократію, а спроби об'єднати ці фракції в єдину політичну партію ще не стали реальністю."
 WORLD.60002.a: "Син адмірала бере контроль над державним кораблем."

 WORLD.60003.t: "[Get_newspaper_header]Гарольд Вілсон переобраний прем'єр-міністром"
 WORLD.60003.desc: "Соціялістична Лейбористська Партія Англії зберегла свою більшість у парламенті. Гарольд Вілсон заявив, що його другий термін буде зосереджений на вирішенні "п’яти велетнів" - злиднів, хвороб, невігластва, убогості та бездіяльності, які були визначені у давно забутому Звіті Беверіджа. Уряд також наголосив на необхідності підтримки тісних зв'язків з ОВН.\n\nВілсон також похвалив свої нещодавні досягнення, заявивши, що англійська економіка стала сильнішою, а робітники отримують добре оплачувану працю, яка забезпечує їм гідні умови.\n\nРеджинальд Берч, лідер жорсткої фракції СЛП, був відсутній. Повідомляється, що Берч і його прихильники були вигнані з партії після гарячої промови самого Вілсона. І так, СЛП наразі є єдиною в досягненні своєї мети для Англії."
 WORLD.60003.a: "Червоний прапор все ще майорить тут."

 WORLD.60004.t: "[Get_newspaper_header]Джордж Джелліко переобраний прем'єр-міністром"
 WORLD.60004.desc: "Національна Демократична Ліга Англії здобула більшість місць у парламенті. Прем'єр-міністр Джелліко говорив про свою перемогу як про "гучну перемогу сил ліберальної демократії в Англії та в усьому світі". Таким чином, Англія під керівництвом Джелліко, ймовірно, розширить свої зв'язки з ОВН.\n\nНДЛ обіцяла відновити законного монарха на трон, і сьогодні королева популярніша, ніж коли-небудь, на відміну від свого ненависного дядька.\n\nЗгідно з внутрішніми партійними звітами, НДЛ змогла утримати помірний контроль над партією, не вступаючи в конфлікт з Консервативною та Ліберальною партією. Цей баланс є ключовим для проходження необхідних реформ і збереження єдності партії. Час покаже, чи змістяться ваги в будь-якому напрямку, і чи зможе Джелліко утримати свою партію."
 WORLD.60004.a: "Тимчасовий спокій, поки що."

 WORLD.60005.t: "[Get_newspaper_header]Комуністичний переворот у Співдружності Англії"
 WORLD.60005.desc: "П’ять десятиліть тому більшовики Росії скинули помірковану соціялістичну республіку, звинувативши її в реакційній інфільтрації, і запровадили однопартійну державу. Історія повторюється в Англії, коли жорсткі члени Соціялістичної Лейбористської Партії здійснили м’який переворот проти Гарольда Вілсона, викинувши його з керівництва партії.\n\nНовообраний прем'єр-міністр Реджинальд Берч проголосив Соціялістичну Республіку Англія. У телевізійній промові він засудив "реакційних змовників" всередині СЛП, заявивши, що вони "задушили полум'я революції і занурили робітників у темряву".\n\nЦілі нового уряду включають: масову індустріалізацію, розширення військової потужності та економічну автаркію. Але через свою ідеологію, що фактично робить їх паріями для більшої частини Європи, важко уявити, що ця нова держава буде здатна існувати самостійно довго."
 WORLD.60005.a: "Чи буде Берч ще одним Бухаріним?"

 WORLD.60006.t: "[Get_newspaper_header]HMMLR здійснює переворот в Англії"
 WORLD.60006.desc: "Звуки маршуючих солдатів та танків, що котяться по Лондону, знову пролунали сьогодні, коли члени армії захопили будівлю Парламенту і забезпечили контроль над урядовими будівлями. Здається, що демократія не сподобалась Клоду Очінлеку.\n\nВідставний генерал, який очолював HMMLR під час Англійської громадянської війни, приєднався до свого wartime союзника Біла Александера, щоб захопити кермо влади та повернути країну на правильний курс. Очінлек оголосив, що він і його сили мають право захищати англійську демократію від усіх внутрішніх та зовнішніх загроз, і що обставини змусили його вжити заходів.\n\nУряд YDL має намір встановити перехідний уряд для більш чіткого встановлення демократичної системи. Коли саме вони вирішать передати владу, наразі невідомо."
 WORLD.60006.a: "Мало що іронічніше за переворот на користь демократії."

 WORLD.60007.t: "[Get_newspaper_header]Девід Стірлінг обраний прем'єр-міністром Англії"
 WORLD.60007.desc: "Вражаюча перемога! Не спадщина Лейбористської партії і не Консерватори здобули перемогу на перших вільних виборах після закінчення Другої світової війни, а темна кінь кандидата!\n\nАрчібальд Девід Стірлінг, колишній офіцер SAS, борець за свободу та командир руху HMMLR був обраний, незважаючи на опозицію. Рух, який він очолював, підтримував жорсткіші репарації для колишніх членів колабораціоністського уряду та не схвалював радикальних змін, запропонованих Соціялістичною Лейбористською Партією.\n\nЦей абсолютно непередбачуваний поворот подій вже викликає хвилі через Атлантику, де добре відомо, що новий прем'єр-міністр не схвалює американську неготовність втручатися в Громадянську війну. Але в заяві для преси Девід Стірлінг запевнив, що незалежно від того, що станеться, Британія переможе."
 WORLD.60007.a: "Той, хто наважився, переміг."

 WORLD.60008.t_reelection: "[Get_newspaper_header]Девід Стірлінг переобраний прем'єр-міністром"
 WORLD.60008.t_firstelection: "[Get_newspaper_header]Девід Стірлінг обраний прем'єр-міністром Англії"
 WORLD.60008.desc_reelection_YOL: "Темна кінь продовжує, оскільки Рух на підтримку Армії під керівництвом Девіда Стірлінга знову отримав більшість у парламенті.\n\nПостання з руху HMMLR після Громадянської війни, MSA виступала за жорсткіші умови щодо колишніх колабораціоністських чиновників та протестувала проти радикальних змін, запропонованих СЛП. Після того, як вони піднялись до влади, вони посилили військовий вплив у Британії, розмістивши військових радників у важливих політичних позиціях, що стало кульмінацією в скасуванні Закону про Молоду Демократію, що перешкоджало складу тимчасової ради з лідерів HMMLR, таких як Клод Очінлек та Білл Александер, брати на себе керівництво під час надзвичайних обставин.\n\nНезалежно від того, що сталося, MSA проголошує себе захисниками "Британської Демократії", і багато спостерігачів задаються питанням, чи є це лише фасадом для більш підступного плану."
 WORLD.60008.desc_reelection_noYOL: "Темна кінь продовжує, оскільки Рух на підтримку Армії під керівництвом Девіда Стірлінга знову отримав більшість у парламенті.\n\nПостання з руху HMMLR після Громадянської війни, MSA виступала за жорсткіші умови щодо колишніх колабораціоністських чиновників та протестувала проти радикальних змін, запропонованих СЛП. Після того, як вони піднялись до влади, вони посилили військовий вплив у Британії, розмістивши військових радників у важливих політичних позиціях, що стало кульмінацією в спробі скасування Закону про Молоду Демократію, що перешкоджало складу тимчасової ради з лідерів HMMLR, таких як Клод Очінлек та Білл Александер, брати на себе керівництво під час надзвичайних обставин.\n\nНезалежно від того, що сталося, MSA проголошує себе захисниками "Британської Демократії", і багато спостерігачів задаються питанням, чи є це лише фасадом для більш підступного плану."
 WORLD.60008.desc_firstelection: "Темна кінь вийшла з англійських стай, оскільки Рух на підтримку Армії під керівництвом Девіда Стірлінга несподівано здобув більшість у парламенті.\n\nПостання з руху HMMLR після Громадянської війни, MSA виступала за жорсткіші умови щодо колишніх колабораціоністських чиновників та протестувала проти радикальних змін, запропонованих СЛП. Хоча вони залишалися в тіні під час перших виборів, вони вирішили вийти на сцену та заявити про себе, вигравши другі вибори.\n\nТепер, перебуваючи при владі, Стірлінг прагне скасувати чи змінити рішення попередніх урядів, які він вважає "загрозою" для британської демократії. Чи справді це захищає демократичні інститути - покаже час."
 WORLD.60008.a_reelection: "Вогні гаснуть по всій Британії, і ніхто більше не запалить їх знову."
 WORLD.60008.a_firstelection: "Той, хто наважився, переміг."

 WORLD.60009.t: "[Get_newspaper_header]Артур Кеннет Честертон обраний прем'єр-міністром Англії"
 WORLD.60009.desc: "Шокові хвилі прокотилися через Британські острови, коли Артур Кеннет Честертон був обраний прем'єр-міністром Англії на виборах, які багато хто вважав референдумом щодо попередньо правлячої Королівської партії. Руйнування, спричинене Англійською громадянською війною, і підтримка Честертона з боку його чорних сорочок під час війни були визнані як важливі чинники, що сприяли його перемозі.\n\nОбличчя Національного фронту, праворадикальної і раніше маргінальної партії, відомої своїми симпатіями до фашизму та націонал-соціялізму, Честертон виступав за відновлення Великої Британії, протидію елітам Королівської партії і повернення країни на світову арену. Протести спалахнули в Лондоні, де ліберали, помірковані та меншинства висловлюють побоювання, що Честертон прагне наслідувати політику Німеччини та Італії. Мало хто знає, яким буде Англія під керівництвом Честертона, але всі знають, що це буде Англія, якої раніше не було."
 WORLD.60009.a: "Фашизм прийшов в Англію."

 WORLD.60010.t: "[Get_newspaper_header]Артура Кеннета Честертона обрано прем'єр-міністром Англії"
 WORLD.60010.desc: ""
 WORLD.60010.a: ""

 WORLD.60101.t: "[Get_newspaper_header]Cymru Goch виграє вибори в Уельсі"
 WORLD.60101.desc: "Уряд Уельсу офіційно оголосив, що ліворадикальна партія, відома як Cymru Goch, виграла вибори. Останні кілька місяців в Уельсі були справжнім випробуванням через вугільну кризу, яка охопила країну протягом більшої частини шістдесят другого року, що мало наслідком майже економічний колапс. Після того, як криза була подолана, сталася катастрофа в Абервані, коли обвалився відвал вугільної шахти. Ця катастрофа призвела до загибелі понад ста сорока людей, більшість з яких були діти, коли відвал вугільної шахти потрапив на місцеву школу. Після цієї страшної події, країна отримала велику допомогу від уряду, щоб подібне не повторилося. Однак після цих двох катастроф здається, що Cymru Goch стала промінчиком надії, очолювана Емрісом Томасом, який обіцяє новий уряд для людей і для Уельсу в цілому."
 WORLD.60101.a: "Дійсно, промінь надії."
 WORLD.60101.b: "Подивимося, чи впорається дракон з цим."

 WORLD.60102.t: "[Get_newspaper_header]Шотландська національна партія тримається в Шотландії"
 WORLD.60102.desc: "Здається, що Шотландська національна партія перемогла в Шотландії, оскільки результати були оголошені пізно ввечері. Після втрати Джона МакКорміка, який був президентом Шотландії з часу її заснування в останні дні Другої світової війни і який недавно помер від пневмонії, були оголошені дострокові вибори. Це сталося через майже крах SNP після інциденту на похоронах МакКорміка, коли кількох членів партії було заарештовано за "порушення громадського порядку". Ця перемога була вітана багатьма демократичними країнами світу. Очолюваний Робертом Макінтайром, який був попереднім віце-президентом за адміністрації МакКорміка, наразі здається, що адміністрація Макінтайра обіцяє зміцнити зв'язки з ОВН і захищати шотландський суверенітет."
 WORLD.60102.a: "Здається, більше того ж самого."
 WORLD.60102.b: "Світло на півночі залишається яскравим."

 WORLD.60103.t: "[Get_newspaper_header]Перемога ILP на виборах у Шотландії"
 WORLD.60103.desc: "Незважаючи на потужну опозицію з боку Шотландської національної партії, Незалежна Лейбористська партія (ILP) виграла вибори 1962 року в Шотландії, що стало справжньою сенсацією. Уильям Вулф, обраний президентом, був колишнім членом SNP, який залишив партію через трудові суперечки. Після років служби в опозиції до SNP, партія ILP тепер здобула перемогу, яку всі відзначають як велике досягнення. Уильям Вулф вже пообіцяв, що країна залишатиметься незалежною, спростувавши чутки про те, що партія є британським юніоністським фронтом."
 WORLD.60103.a: "Подивимося, що робитимуть ці соціялісти."
 WORLD.60103.b: "Чи зможуть вони утримати країну разом, як це зробила SNP?"

 WORLD.60104.t: "[Get_newspaper_header]Перемога юніоністської партії в Шотландії"
 WORLD.60104.desc: "Вчора ввечері було оголошено, що Юніоністська партія здобула перемогу в разючому перевороті проти потужної Шотландської національної партії та меншої, але сильнішої партії ILP. Для багатьох громадян Шотландії це була несподівана перемога.\n\nПід час виступу президентки Прісцилли Бухан повідомлялося, що на Холіруді знаходяться офіцери шотландської поліції, які стежать за тим, щоб не виникло проблем. Здавалося, що зібралася велика група протестуючих, а також контрпротестувальників, які з гордістю розгорнули прапор Юніон Джек.\n\nПроте незвично тихі Збройні сили Шотландії, очолювані маршалом Дугласом Вімберлі, передали коротке повідомлення Бухан перед тим, як перемістити війська до кордону для проведення військових навчань."
 WORLD.60104.a: "О боже, юніоністи виграли?"
 WORLD.60104.b: "Цікаво, що це означатиме для майбутнього Британії."

 WORLD.60105.t: "[Get_newspaper_header]Переворот SAS у Шотландії"
 WORLD.60105.desc: "Повідомляється з Шотландії, що стався переворот, здійснений агентами, які проникли в Юніоністську партію.\n\nЗдається, що Юніоністську партію Шотландії інфільтрувала SAS, відома терористична група з Королівства Англія. Ця група відома численними нападами на англійські та німецькі гарнізони по всій країні, багато з яких закінчуються вибухами, а зловмисники зникають вночі, як примари.\n\nПісля того, як світ дізнався про ці події, були початі відключення зв'язку з певними країнами, зокрема з країнами континентальної Європи, що обмежує контакти Шотландії. Очолювані Робертом Мейном, ці виконавці точно приведуть країну на більш жорсткий шлях."
 WORLD.60105.a: "Щось підказує, що це не добрий знак."
 WORLD.60105.b: "Переворот у Шотландії? Неймовірно!"

 WORLD.61001.t: "[Get_newspaper_header]Ірландська республіканська армія припиняє свою діяльність"
 WORLD.61001.desc: "Ірландські офіцери Гард відновили свою присутність у Північній Ірландії сьогодні після того, як завершилися переговори між Шоном Лемасом, таойшом Республіки Ірландії, і Шеймусом Твомі, лідером ІРА. Лідер парамілітарної організації наказав припинити її діяльність після підписання договору, що передбачає поступки від проблемної республіки.\n\nОсновною з цих поступок є повна амністія для тих, хто брав участь у повстанні, а також остаточний розрив з Єдинітспактом. Ґерманія ще не прокоментувала ці події. Міжнародні спостерігачі стурбовані економікою острова, яка була знищена після того, як Райх змушений був залишити його через початок Ґерманської громадянської війни, а також геополітичною ізоляцією, в яку потрапила Ірландія."
 WORLD.61001.a: "На Зелений острів повертається відчуття нормальності."
 WORLD.61001.b: "Чи припинили ірландці нарешті боротися один з одним?"

 WORLD.61002.t: "[Get_newspaper_header]Повстання ІРА придушено"
 WORLD.61002.desc: "Ірландські Збройні сили пройшли через Белфаст сьогодні, придушуючи повстанську парамілітарну групу, відому як Ірландська республіканська армія. Група захопила владу в регіоні після того, як ірландські офіційні особи описали це як «візантійську змову», і викликала подібні народні повстання по всьому острову. Швидко було віддано наказ ірландським військам вступити в справу та відновити контроль над ситуацією.\n\nШон Лемас, таойш Республіки Ірландії, зустрічається з великою критикою вдома, оскільки багато серед населення вважають, що ситуацію можна було і треба було вирішити без кровопролиття. Міжнародні спостерігачі також критикують ірландський уряд за непотрібне насильство та руйнування в уже нестабільному регіоні Республіки, і багато хто запитує, чи не наближається ганебний кінець десятилітньому правлінню Фіанна Фейл."
 WORLD.61002.a: "Повстання Твомі, придушене в самому зародку."
 WORLD.61002.b: "Кінець безладу чи лише початок?"

 WORLD.61003.t: "[Get_newspaper_header]Переворот ІРА в Республіці Ірландія"
 WORLD.61003.desc: "Під проводом Шеймуса Твомі парамілітарні сили Ірландської республіканської армії сьогодні рушили на Дублін, вигнавши Фіанна Фейл з влади. Після серії народних повстань Твомі, за повідомленнями, висунув серію вимог до Шона Лемаса, тепер уже колишнього таойша Республіки Ірландії, на які він не відповів, що викликало подальші заворушення та зрештою повалення ірландського уряду.\n\nТвомі самопроголосив себе лідером нової Соціялістичної Республіки Ірландія, хоча міжнародні спостерігачі сумніваються, чи є лідер більше ніж просто дрібний диктатор, оскільки політика, що асоціюється з соціялістичним правлінням, досі не була впроваджена. Офіційні особи з Ґерманії ще не прокоментували раптові зміни в уряді Ірландії, хоча, ймовірно, будуть обурені тим, що так близько до їхніх кордонів з'явився самопроголошений марксист."
 WORLD.61003.a: "Перемога міжнародного робітничого класу!"
 WORLD.61003.b: "Соціялізм в Ірландії? Подивимося, як довго це протримається."

 WORLD.61004.t: "[Get_newspaper_header]Переворот бригадирів у Республіці Ірландія"
 WORLD.61004.desc: "Шон Лемас, колишній таойш Республіки Ірландія, був скинутий в результаті перевороту. Перед судом ТД Ніла Блейні, лідера жорсткої фракції в межах Фіанна Фейл, фракція Ірландських Збройних сил, очолювана генералами Джеймсом Келлі та Шоном МакЕйном, штурмувала офіс колишнього таойша, арештувавши його за державну зраду та призначивши лідера жорсткої фракції новим таойшем на місце Лемаса.\n\nНова влада, як кажуть, є дуже ґерманофільською та ймовірно буде шукати більшу інтеграцію до Єдинітспакту найближчими днями. Офіційні особи в Ґерманії, за повідомленнями, в захваті від новин і ймовірно приймуть новий уряд в Пакт з відкритими обіймами. Міжнародні спостерігачі засудили новий уряд, висловивши побоювання щодо насильницького придушення та нових обмежень на звичайні свободи."
 WORLD.61004.a: "Ірландія вибирає свій бік в історії."
 WORLD.61004.b: "Ірландія повзає назад до своїх колишніх господарів."

 WORLD.61005.t: "[Get_newspaper_header]Кінець Ульстерської Добровольчої Армії"
 WORLD.61005.desc: "Ірландські Збройні сили пройшли через вулиці Белфаста сьогодні, захопивши столицю повстанської парамілітарної групи Ульстерська Добровольча Армія та поклавши кінець Ірландській громадянській війні. Скориставшись смертю лідера повстанців Шеймуса Твомі, Іан Пейсли очолив народне повстання в Північних графствах, проголосивши Ульстер незалежним та окремим від самої республіки.\n\nПісля захоплення міста та повідомлення про смерть Іана Пейсли, парамілітарна група здалася, поклавши зброю. Ірландський уряд не надасть округу його спеціальний автономний статус, за словами ірландських чиновників, але повністю інтегрує його в республіку як «звичайний округ, без особливих привілеїв». Безлад охоплює округ, ймовірно, це триватиме в найближчому майбутньому."
 WORLD.61005.a: "Ірландія, знову єдина і неділима!"
 WORLD.61005.b: "Ірландія, зміцнена в крові загиблих."

 WORLD.61006.t: "[Get_newspaper_header]Перемога Ульстерської Добровольчої Армії"
 WORLD.61006.desc: "У шокуючому повороті подій Ульстерська Добровольча Армія на чолі з Іаном Пейсли проголосила, що здобула незалежність від Республіки Ірландія. Це сталося після серії невдалих наступів ірландської армії, які не змогли підкорити УДАР. В іншому шокуючому ударі для Ірландії армія окупувала Ірландську Дайл і повалила уряд. Начальник штабу Шон МакЕйон оголосив світові, що чинний уряд є «неефективним у підтримці територіальної цілісності Ірландії». Чи буде ірландська армія тимчасово тримати контроль над державою чи закріпить свою владу, невідомо.\n\nВ Ульстері, здається, бої все ще тривають. Міжнародні спостерігачі повідомляють про жахливі злочини проти ірландського населення, що спричинило паніку в Ульстері, оскільки багато хто втікає на південь."
 WORLD.61006.a: "Ó, mo Dhia."
 WORLD.61006.b: "За Бога і Ульстер!"

 WORLD.61007.t: "[Get_newspaper_header]Угода Великої П’ятниці"
 WORLD.61007.desc: "У тому, що багато хто називає неймовірним поворотом в довгій і тривожній історії Ірландії, усі сторони конфлікту в Ульстері підписали угоду про припинення всіх терористичних або озброєних дій. Протестантська УДАР під проводом Іана Пейсли сіли за стіл переговорів з ліворадикальною ІРА Шеймуса Твомі та Шоном Лемасом в парламенті Стормонт в Північній Ірландії, щоб підписати мирну угоду. Основними умовами цієї угоди було для Ірландії залишити Пакт і провести регіональні вибори в обмін на припинення вогню.\n\nБудь-які побоювання щодо економічних наслідків, спричинених різким виходом з Пакту, здається, ігноруються ірландським населенням, яке святкує мирне вирішення Ульстерської кризисної ситуації. Безсумнівно, Лемас врятував майбутнє Ірландії, і новий і славний світанок на горизонті."
 WORLD.61007.a: "І те, що почалося в 1916 році, нарешті закінчується."
 WORLD.61007.b: "Можливо, люди ще можуть йти на компроміси в цьому світі."

 WORLD.61008.t: "[Get_newspaper_header]Ульстер приймає англійське домінування"
 WORLD.61008.desc: "У дещо несподіваному повороті подій нещодавно незалежна держава Ульстер оголосила сьогодні, що відмовляється від своєї новоздобутої незалежності, замість цього заявляючи, що прагне возз'єднатися з [ENG.GetNameDef]. Щойно незалежна держава, яка лише кілька місяців тому здобула свою незалежність у Ірландській громадянській війні, з Іаном Пейсли, лідером парамілітарної Ульстерської Добровольчої Армії на чолі.\n\nЦерквяні дзвони лунають у Лондоні, коли нація святкує повернення ще однієї частини своєї колишньої великої імперії, але настрій в Дубліні значно більш сумний. Ще невідомо, як Республіка Ірландія відреагує на те, що частина того, що колись було їхньою нацією, добровільно повертається в руки їхнього давнього ворога, хоча міжнародні спостерігачі побоюються, що це може стати смертельним ударом для вже похитнутої демократії країни."
 WORLD.61008.a: "Ми вітаємо Ульстер з поверненням до складу."
 WORLD.61008.b: "Дурні обмінюють одного господаря на іншого."
 
 WORLD.61009.t: "[Get_newspaper_header]Відставка таойша Лемаса"
 WORLD.61009.desc: "Після фатальної поразки на голосуванні про недовіру своєму уряду, таойш Ірландії Шон Лемас оголосив про свою відставку з посади лідера Фіанна Фейл, що призвело до нових виборів. У своєму листі про відставку він вказав на проблеми зі здоров'ям, але більшість спостерігачів вважає, що його падіння стало результатом незадоволення його молодшими партнерами в уряді через невдачі у відновленні миру в Північній Ірландії.\n\nЛемас тепер виконує обов'язки тимчасового керівника, поки Фіанна Фейл не обере нового лідера в тісній конкуренції між розділеними та ворожими фракціями партії. Пундіти вважають найбільш очевидними кандидатами на цю роль Чарльза Хоугі та Джорджа Коллі. Тим часом Лейбористи та Файн Гейл готуються до найбільш амбіційної виборчої кампанії, щоб позбавити слабшаючого гіганта ірландської політики його впливу."
 WORLD.61009.a: "Таємничий патріот каже прощавай."
 WORLD.61009.b: "Хижаки кружляють над кров'ю в воді."

 WORLD.61010.t: "[Get_newspaper_header]Перемога Фіанна Фейл на виборах [GetYear] року"
 WORLD.61010.desc: "Після придушення повстання з боку ірландського юніоністського населення, Фіанна Фейл підняла націоналістичну хвилю до більшості в Дайлі. Новий лідер Фіанна Фейл, завжди агресивний Кевін Боланд, людина, яку вважають одним з головних ініціаторів військової операції, забезпечив свою позицію як таойш.\n\nУ своїй вступній промові Боланд засудив насильство проти католицького населення Ульстера під час повстання, обіцяючи жорстокі та масштабні репресії проти UDA та UVF. Новий таойш також пообіцяв скасувати «матеріалістичні» політики свого попередника і започаткувати «Республіканську Революцію» проти британського імперіалізму, коментарі, які були засуджені Вайтхоллом.\n\nҐерманські дипломати привітали Боланда з перемогою, у той час як Вашингтон не зробив жодних коментарів з цього приводу."
 WORLD.61010.a: "Нехай ідеали Деві реалізуються нарешті."
 WORLD.61010.b: "Відлуння минулого продовжують лунати."

 WORLD.61011.t: "[Get_newspaper_header]Перемога Фіанна Фейл на виборах [GetYear] року"
 WORLD.61011.desc: "Результати виборів в Ірландії показали передбачуваний результат, оскільки Фіанна Фейл здобула більшість на останніх загальних виборах. Багато коментаторів помилково вважали, що відновлення секторального насильства в Північній Ірландії призведе до того, що старий гігант ірландської політики остаточно втратить свою домінуючу позицію.\n\nДжордж Коллі забезпечив своє правління як таойш, обіцяючи програму, яка поєднує традиційні культурні політики де Вальери з індустріалізуючим підходом Лемаса та припиненням радикалізму. Коллі також підтвердив довготривалу нейтральну політику Ірландії. Критики поставили під сумнів здійсненність цих цілей, вказуючи на його недосвідченість у Дайлі та відсутність контролю над своєю партією.\n\nПосланці з Вашингтона та Ґерманії надіслали холодні вітання."
 WORLD.61011.a: "Наша дорога Республіка повинна стояти, незважаючи на все."
 WORLD.61011.b: "Набагато менш популярний середній шлях."

 WORLD.61012.t: "[Get_newspaper_header]Перемога Фіанна Фейл на виборах [GetYear] року"
 WORLD.61012.desc: "Результати виборів в Ірландії показали передбачуваний результат, оскільки Фіанна Фейл здобула більшість на останніх загальних виборах. Багато коментаторів помилково вважали, що відновлення секторального насильства в Північній Ірландії призведе до того, що старий гігант ірландської політики остаточно втратить свою домінуючу позицію.\n\nЧарльз Хоугі забезпечив своє місце як таойш, оголосивши амбітний набір цілей, включаючи припинення терористичної діяльності, програми витрат на подолання хвороб Ірландії та акцент на вільній торгівлі і сприятливості для бізнесу. Пундіти висловлюють занепокоєння щодо того, наскільки вільною буде торгівля, зазначаючи на зв'язки Хоугі з німецькими промисловцями та корпораціями.\n\nҐерманія висловила теплі вітання новому таойшу, в той час як Білий Дім залишився мовчазним."
 WORLD.61012.a: "Кінець довгого підйому на вершину."
 WORLD.61012.b: "Смарагдовий острів ніколи не був таким привабливим!"
 WORLD.61012.c: "Можливості... якщо наші компанії знайдуть простір для дихання."
 WORLD.61012.d: "Чоловік народу, особливо багатих людей."

 WORLD.61013.t: "[Get_newspaper_header]Перемога Національної Коаліції на виборах [GetYear] року"
 WORLD.61013.desc: "В результаті значної зміни політичної ситуації в Ірландії, Файн Гейл та Лейбористська партія здобули величезні перемоги на останніх виборах, сформувавши міжпартійний уряд після того, як Фіанна Фейл була відсторонена від влади після більше 30 років на посаді. Коментатори вважають цю перемогу результатом загального обурення через некомпетентність Фіанна Фейл.\n\nКолишній лідер ліберальної фракції Фіанна Фейл, Джек Лінч, тепер став таойшем, очоливши Файн Гейл до влади вперше. Маніфести обох партій містять список економічних та соціальних реформ, антиризиковану політику щодо тероризму та орієнтацію на Захід. Багато критиків сумніваються в тому, наскільки здійсненними є ці амбітні цілі, зазначаючи консервативні настрої, закріплені в ірландському суспільстві та в рядах коаліції. Вашингтон привітав таойша Лінча з перемогою, тоді як Ґерманія не зробила жодних коментарів з цього питання."
 WORLD.61013.a: "Крок назад від краю анархії."
 WORLD.61013.b: "Я бачу..."
 WORLD.61013.c: "Нові можливості з'являються в Європі."
 WORLD.61013.d: "Відновлення розірваної дружби."

 ### Turkey Events
 WORLD.70001.t: "[Get_newspaper_header]Перемога DYP в Туреччині!"
 WORLD.70001.desc: "Після складного виборчого періоду, затміненого поразкою Туреччини в війні, здається, що через вибори 40-річне правління CHP підійшло до кінця.\n\nБехічі Бора, соціолог і одна з перших жінок-політиків Туреччини, стане наступним Президентом країни. Вона неодноразово потрапляла до в'язниці і була пригнічена авторитарним режимом CHP, Бора представляє покоління, позбавлене своїх прав і свобод. Як лідер DYP, Бора була номінована на посаду Президента за консенсусом демократичних груп - партія особливо популярна серед студентів, хоча вона викликає гнів серед еліт, як релігійних, так і світських.\n\nВідмова DYP від останніх сорока років політики була б неможливою, якби не непопулярність CHP після поразки в Італо-Турецькій війні. Чи вистачить прогресивної соціальної платформи для того, щоб витримати хвилю реакції, вкорінену в турецькій політиці, поки не відомо."
 WORLD.70001.a: "Кавга йок, екмек вар!"
 WORLD.70001.b: "Здається, другий період правління жінок."
 
 WORLD.70002.t: "[Get_newspaper_header]Перемога UDP в Туреччині!"
 WORLD.70002.desc: "Після складного виборчого періоду, затміненого поразкою Туреччини в війні, здається, що через вибори 40-річне правління CHP підійшло до кінця.\n\nДжела́л Байар, колишній прем'єр-міністр Туреччини при Ататюрку, ймовірно стане наступним Президентом країни після довгої кар'єри лідера лояльної опозиції, яка виступала за економічну та політичну лібералізацію як вирішення проблем застійної турецької економіки. Під динамічним керівництвом прем'єр-міністра Аднана Мендереса ця ліберальна тенденція була перетворена на популістський рух селян, релігійних консерваторів і лібералів - коаліція, яка змогла скинути CHP. Хоча партію критикують за її «авантюрний» стиль кампанії та незадоволеність серед світських еліт, консервативна платформа UDP визначатиме напрямок для недавно поразки Туреччини, яка сподівається змінити свою долю через економічну модернізацію та процвітання."
 WORLD.70002.a: "Перемога належить тим, хто може сказати: це моє."
 WORLD.70002.b: "Чи проклята спадщина Кемаля?"
 
 WORLD.70003.t: "[Get_newspaper_header]Перемога CHP в Туреччині!"
 WORLD.70003.desc: "Республіканська народна партія керувала Туреччиною 40 років. У роки після Другої світової війни партія описувалась як все більш авторитарна, оскільки її контроль над владою став жорсткішим. Несхвальні члени були вигнані, а опозиція Туреччини подавлена в ім'я національної стабільності. Поразка у війні змусила президента Іненю оголосити «вільні» вибори, які CHP тепер виграла.\n\n40 років правління як єдиного представника турецького народу визначають програму партії, але також і віру в реформи. Молодші члени партії обіцяють виправити помилки минулих чотирьох десятиліть, але ті, хто слідує лінії партії, сумніваються. Очікується, що Іненю виступить з урочистою промовою перед значною опозицією вперше - багато з яких переконані, що перемога CHP не є результатом демократичного процесу. Чи принесе перемога CHP більше того ж самого в країні, яка потребує змін, чи відкриє етап реформ?"
 WORLD.70003.a: "Аллах допоможе нам."
 WORLD.70003.b: "Ледь тримаються на плаву..."
 
 WORLD.70004.t: "[Get_newspaper_header]Перемога CHP на виборах у Туреччині!"
 WORLD.70004.desc: "Республіканська народна партія керувала Туреччиною 40 років. У роки після Другої світової війни партія описувалась як все більш авторитарна, оскільки її контроль над владою став жорсткішим. Несхвальні члени були вигнані, а опозиція Туреччини подавлена в ім'я національної стабільності. Тепер, після перемоги Туреччини у війні, будь-яка надія опозиційних партій на боротьбу з правлінням CHP розвіяна, оскільки популярність президента Іненю досягла безпрецедентної висоти.\n\nПеремога CHP на останніх виборах забезпечила партії майже безперечний контроль над Великою Національною Асамблеєю. Тепер єдиною можливою перешкодою для повного домінування старої гвардії в турецькій політиці є реформісти всередині CHP. Однак, коли погляд керівництва партії здається виправданим, шанси для перемоги реформістів здаються мізерними."
 WORLD.70004.a: "Яптік, Япаріз!"
 WORLD.70004.b: "Чи не була реформістська лінія однією з їх основних принципів?"
 
 WORLD.70005.t: "[Get_newspaper_header]Відбиття вірменів"
 WORLD.70005.desc: "Анексовані Республікою Туреччина під час Другої світової війни, Вірменії проводяться жорстокі кампанії турецької асиміляції протягом приблизно двох десятиліть. Такі політики викликали гострі заворушення серед вірменського населення, кульмінацією яких стала озброєна повстання в регіоні Сюнік.\n\nПовстання в основному організовано Вірменською революційною федерацією, або Дашнакцутюн, що об'єднала вірменських повстанців під своїм прапором. Петрос Погосян, видатний націоналіст і колишній організатор Операції Немезіс, є широко визнаним лідером цього повстання. Хоча повстання здається безнадійним, моральний дух Дашнаків залишається високим, оскільки все вірменське суспільство мобілізоване в одну велику боротьбу проти турецьких сил."
 WORLD.70005.a: "Здається, вони не змогли стерти Вірменію."
 
 WORLD.70006.t: "[Get_newspaper_header]Вірменське повстання"
 WORLD.70006.desc: "Анексована Республікою Туреччина під час Другої світової війни, Вірменія вже близько двох десятиліть зазнає жорстоких кампаній з турецької асиміляції. Ці політики спричинили запеклі заворушення серед вірменського населення, які нещодавно завершились озброєним повстанням у регіоні Сюнік.\n\nПовстання в основному організовано синами Хайка, або Хайкі Вордінері, які об'єднали вірменських повстанців під своїм прапором. Георг Вартанян, колишній чиновник Вірменської РСР, загальновизнаний як лідер цього повстання. Хоча повстання має мало шансів на успіх, моральний дух повстанців залишається високим, оскільки все вірменське суспільство мобілізовано в одну велику боротьбу проти турецьких сил."
 WORLD.70006.a: "Здається, вони не змогли стерти Вірменію."
 
 WORLD.70007.t: "[Get_newspaper_header]Перемога TİP в Туреччині!"
 WORLD.70007.desc: "Вибори в Туреччині 1971 року завершено, і Робітнича партія Туреччини, або TİP, здобула перемогу, очоливши коаліцію нового уряду.\n\nВідокремившись від колишнього лідера DYP, TİP пропонує більш явно соціялістичну позицію. Оскільки нерівність у розподілі багатства та інші проблеми все ще поширені в Туреччині, велика підтримка партії серед профспілок і міських бідних, ймовірно, забезпечила їхню перемогу.\n\nПрезидент Бехічі Бора обіцяла впровадити різноманітні ліві політики, включаючи універсальний базовий дохід для всіх громадян Туреччини та підвищення податку на багатство для його фінансування. Однак залишається питанням, чи дозволить консервативна політична сцена Туреччини успіх соціялістичного уряду."
 WORLD.70007.a: "Революція через голосування?"
 
 WORLD.70008.t: "[Get_newspaper_header]Перемога SODEP в Туреччині!"
 WORLD.70008.desc: "Вибори в Туреччині 1971 року завершено, і Партія соціальної демократії, або SODEP, здобула перемогу, очоливши коаліцію нового уряду.\n\nЗаснована більш ліберальними членами колишнього DYP, SODEP наголошує на прогресивних ліберальних цінностях, поєднуючи їх із сильною соціальною політикою в межах капіталістичної економіки. Знайшовши підтримку серед жінок і національних меншин Республіки, а також серед середнього класу, SODEP вдалося згуртувати свою прогресивну коаліцію для перемоги на виборах.\n\nОднак їхнім цілям заважає велика опозиція з лівої та правої сторони партії, що залишає їх з небагатьма союзниками у Великій національній асамблеї."
 WORLD.70008.a: "Чи справді прогресизм може перемогти в Туреччині?"
 
 WORLD.70009.t: "[Get_newspaper_header]Перемога CHP в Туреччині!"
 WORLD.70009.desc: "Вибори в Туреччині 1971 року завершено, і Республіканська народна партія, або CHP, здобула перемогу, очоливши коаліцію нового уряду.\n\nНайстарша політична партія в Республіці Туреччина, здається, знайшла нову позицію, оскільки лідер партії Бюлент Еджевіт успішно перевизначив CHP як соціал-демократичну партію. Новопридбана підтримка серед реформістів разом з існуючою підтримкою серед кемалістів, здається, стали вирішальним фактором у їхній перемозі.\n\nЕджевіт підтримав відомого політика Фахрі Кору-Тюрка як нового президента, а сам взяв на себе посаду прем'єр-міністра. Партія обіцяла впровадження сильної соціальної політики, зосереджуючи увагу на кемалістських принципах популізму та статизму."
 WORLD.70009.a: "Чи може стара партія навчитися новим трюкам?"
 
 WORLD.70010.t: "[Get_newspaper_header]Перемога CHP в Туреччині!"
 WORLD.70010.desc: "Вибори в Туреччині 1971 року завершено, і Республіканська народна партія, або CHP, здобула перемогу, очоливши коаліцію нового уряду.\n\nПісля відставки Ісмета Іненю, керівництво партією прийняв Ніхат Ерім, консервативний кемаліст, що дотримується тих самих цінностей, яких CHP дотримувалася десятки років. Однак віра народу в бачення CHP, схоже, не похитнулася, оскільки мобілізація ортодоксальних кемалістів забезпечила перемогу партії.\n\nЕрім підтримав колишнього генерала Джевдета Суная як нового президента Республіки, а сам став прем'єр-міністром."
 WORLD.70010.a: "Чи призначена Туреччина на ще 40 років правління CHP?"
 
 WORLD.70011.t: "[Get_newspaper_header]Перемога DP в Туреччині!"
 WORLD.70011.desc: "Вибори в Туреччині 1971 року завершено, і Демократична партія, або DP, здобула перемогу, очоливши коаліцію нового уряду.\n\nСформована з членів колишнього UDP, після того як ісламісти та радикальні націоналісти відійшли від партії, DP займає більш чисто ліберально-консервативну позицію. Успішно очоливши центр-праву Туреччини до перемоги на виборах, партія знаходить підтримку серед середнього та вищого класів турецького суспільства.\n\nПовернувшись до турецької політики після тривалої перерви, обраний президент Джела́л Байар обіцяв масштабну приватизацію в надії на відновлення турецької економіки."
 WORLD.70011.a: "Великий тягар для людини, якій майже дев’яносто..."
 
 WORLD.70012.t: "[Get_newspaper_header]Перемога AP в Туреччині!"
 WORLD.70012.desc: "Вибори в Туреччині 1971 року завершено, і Партія справедливості, або AP, здобула перемогу, очоливши коаліцію нового уряду.\n\nОчолювана ісламським політичним діячем Неджіпом Фазилем Кисакюреком, AP складається з релігійних консерваторів з колишнього UDP. Популістська риторика партії принесла їм більшість голосів, і ісламський рух, здається, повертається після десятиліть секуляризму.\n\nХоча Фазил обіцяє відродження ісламських ідеалів, ця мета зустрілася з жорстким опором з боку світських груп по всій політиці Туреччини. Особливо слід зазначити невдоволення в армії, де багато її лідерів вважають позицію AP абсолютно неприйнятною."
 WORLD.70012.a: "Секуляризм, здається, йде на вихід..."
 
 WORLD.70013.t: "[Get_newspaper_header]Перемога MHP в Туреччині!"
 WORLD.70013.desc: "Вибори в Туреччині 1971 року завершено, і Партія націоналістичного руху, або MHP, здобула перемогу, очоливши коаліцію нового уряду.\n\nКолишня частина коаліції UDP, MHP відокремилася, зібравши багато націоналістів. Більша частина підтримки партії, ймовірно, надійшла від ортодоксальних націоналістів, які покинули CHP після її реорганізації в центр-ліву партію.\n\nНовий президент, Алпарслан Тюркеш, пообіцяв незалежність від "зовнішніх впливів", а також повну єдність у Туреччині. Тюркеш відкидає різниці між турками та національними меншинствами Республіки, стверджуючи, що всі, хто живе в межах турецьких кордонів, є турками."
 WORLD.70013.a: "Націоналізм, здається, перемагає."
 
 WORLD.70014.t: "[Get_newspaper_header]Військовий переворот у Туреччині!"
 WORLD.70014.desc: "Сьогодні Турецька Республіка прокинулась від звуків танків, що котяться по вулицях. Турецька армія, втомлена від турбулентних часів під урядом DYP, взяла кермо в свої руки.\n\nГолова перевороту, Джемал Гюрсель, і Національний комітет єдності виступили з промовою до нації та світової сцени, вказавши на помилки та невдачі уряду DYP; розділення країни і відкриття шляху для сепаратизму, економічні проблеми та ідеологічна радикалізація. Національний комітет єдності пообіцяв, що армія поверне "все на свої місця", стабілізуючи ситуацію і поклавши край сепаратистським повстанням по всій країні."
 WORLD.70014.a: "Республіка затамувала подих."
 
 WORLD.70015.t: "[Get_newspaper_header]Військовий переворот у Туреччині!"
 WORLD.70015.desc: "Сьогодні Турецька Республіка прокинулась від звуків танків, що котяться по вулицях. Турецька армія, втомлена від турбулентних часів під урядом UDP, взяла кермо в свої руки.\n\nБагато невдач UDP, таких як сприяння політичному насильству в країні, підкорення зростаючому авторитаризму та, що найголовніше, відмова від кемалістських принципів, довели країну до краху і хаосу, згідно з Національним комітетом єдності та їхнім головою, Джемалом Гюрселем. Турецька армія обіцяє покласти край хаосу, повернути Республіку на правильний шлях і відновити міжнародні відносини, але демократія, схоже, вже на межі."
 WORLD.70015.a: "Республіка затамувала подих."
 
 WORLD.70017.t: "[Get_newspaper_header]Незалежність в Анатолії!"
 WORLD.70017.desc: "З кінця Другої світової війни Республіка Туреччина значно розширилася через анексії Сирії, Вірменії, Фракії та інших територій. Однак, коли ілюзії славної та праведної завоювання зникли, великі витрати на придушення повстань та проведення кампаній "Туркіфікації" стали очевидними. Нова прогресивна влада Туреччини пообіцяла вивести війська та надати самовизначення народам в межах Республіки.\n\nУспішно балансуючи між задоволенням націоналістичних політиків, армії та різними незалежницькими рухами, уряд забезпечив виконання цих обіцянок. Договори, що охоплюють від автономії до повної незалежності, були підписані для ненародних регіонів Республіки. Хоча націоналісти Туреччини все ще проголошують ці дії зрадницькими, вони мало можуть зробити, оскільки мільйони святкують незалежність своїх націй."
 WORLD.70017.a: "Імперія знову розпалася..."
 
 ### Malaya Events

 WORLD.18112.t: "[Get_newspaper_header]Перемога UMAJF в Малаї"
 WORLD.18112.d: "Коли останні японські війська залишають півострів, так званий "Малаївський надзвичайний стан" завершується. Підсумок багатьох років важких боїв і міжусобних повстань, Об'єднаний антияпонський фронт Малаї (UMAJF), підтримуваний США, досяг швидкої перемоги, витіснивши японців з основних міських районів півострова і змусивши Токіо сісти за стіл переговорів. Тепер, коли Малайя вільна від японської окупації, тимчасовий уряд Малаї, очолюваний революційним лідером спротиву Чином Пенгом, утворить уряд-опікуна в очікуванні нових виборів.\n\nОтримавши підтримку та дипломатичне визнання від адміністрації Ніксона в рамках американської доктрини "Розворот", перемога малаївських повстанців викликала шок у Кругу Спільного Процвітання. Багато спостерігачів вважають, що поразка Токіо може бути лише першим кроком до розпаду Японської імперії."
 WORLD.18112.a: "Лише перший доміно."
 WORLD.18112.b: "Прокляті американці!"
 WORLD.18112.c: "Ізольоване випадок? Чи знак чогось більшого?"
 WORLD.18112.m: "Хідуп Малая Мердека!"

 WORLD.18113.t: "[Get_newspaper_header]Перемога UMAJF в Малаї"
 WORLD.18113.d: "Коли останні японські війська залишають півострів, так званий "Малаївський надзвичайний стан" завершується. Це кульмінація років кровопролитних боїв і жорстоких повстань, Об'єднаний антияпонський фронт Малаї, підтримуваний США, здобув перемогу, витіснивши японців з основних міських районів півострова через низку затратних кампаній і змусивши Токіо сісти за стіл переговорів. Тепер, коли Малайя вільна від японської окупації, втомлені повстанці опинилися з завданням відновити зруйновану і спустошену країну.\n\nОтримавши підтримку та дипломатичне визнання від адміністрації Ніксона в рамках американської доктрини "Розворот", витратна перемога малаївських повстанців мало вплинула на довіру політичних кіл США до життєздатності цієї доктрини."
 WORLD.18113.a: "Перемога є перемогою."
 TNO_MLY_CIA_operations_tt: "Ми можемо використовувати ЦРУ для впливу на майбутні дії на Малаївському півострові."
 WORLD.18113.b: "Прокляті американці!"
 WORLD.18113.c: "Безумство Вашингтону."
 WORLD.18113.m: "Але тепер ми ховаємо своїх дітей..."

 WORLD.18114.t: "[Get_newspaper_header]Ахмад виграє вибори в Малаї!"
 WORLD.18114.d: "Після закінчення тимчасового уряду в результаті перемоги UMAJF у Малаї, місцеві вибори були призначені для визначення лідера нового уряду Малаї. Після завершення виборів, здається, що коаліція Барісан Соціялістів успішно отримала більшість місць, очолювана Ахмадом Боестамом. Тепер, будучи на чолі вільної Малаї, Ахмад прагне радикально реформувати нову державу, виступаючи з твердою обіцянкою проти подальшого іноземного втручання в розорену країну. Однак сильна підтримка з боку Пертабухан Кебангсан Мелаю Бесату, очолювана Туном Абдулом Разаком, експерти вважають, що новий лідер може зіткнутися з великою націоналістичною опозицією. Вашингтон, однак, очікується, що змінить свої плани щодо Малаї після невдачі проамериканського кандидата Туна Абдула Разака."
 WORLD.18114.a: "Шкода, що не вдалося, але ми все ще можемо це врятувати."
 WORLD.18114.b: "Найкраще, що ми могли отримати з нашої поразки."
 WORLD.18114.c: "Смілива програма, але чи зможе він виконати свої обіцянки?"
 WORLD.18114.m: "Справжня вільна Малайя чекає."

 WORLD.18115.t: "[Get_newspaper_header]Разак виграє вибори в Малаї!"
 WORLD.18115.d: "Після закінчення тимчасового уряду в результаті перемоги UMAJF у Малаї, місцеві вибори були призначені для визначення лідера нового уряду Малаї. Націоналістична Пертабухан Кебангсан Мелаю Бесату здобула рішучу перемогу на виборах завдяки популярності проамериканського лідера Туна Абдула Разака. Тепер лідер вільної Малаї, Разак прагне посилити співпрацю Малаї з Америкою, при цьому спираючись на малайський націоналізм для відновлення країни. Однак сильна підтримка коаліції Барісан Соціялістів поставила під сумнів здатність Разака просувати свою програму без викликання напруженості всередині Малаї через популярність лідера коаліції Ахмада Боестама. Вашингтон уже привітав Разака з його перемогою та обіцяв додаткову допомогу розореній країні."
 WORLD.18115.a: "Як ми і очікували."
 WORLD.18115.b: "Прокляті американські собаки!"
 WORLD.18115.c: "Один слуга для іншого?"
 WORLD.18115.m: "Малайя знайде захист."

 WORLD.18116.t: "[Get_newspaper_header]Бурнауддін Аль-Хельмі виграє вибори в Малаї!"
 WORLD.18116.d: "Після завершення конфлікту з UMAJF, 25-та армія покинула країну після періоду тимчасового уряду в Малаї, щоб дати можливість провести місцеві вибори. Хоча спостерігачі передбачали брудні ігри, фальсифікації та маніпуляції з боку Японії, здається, що місцеві вибори пройшли гладко і досить чесно.\n\nДо великого здивування багатьох, соціялістична Партія Кебангсан Мелаю Малая на чолі з Бурнауддіном аль-Хельмі виграла вибори, хоча націоналістична Пертабухан Кебангсан Мелаю Бесату показала сильний результат на виборах. Пройшовши по тонкому шву між задоволенням Японії, націоналістів і доставкою поєднаних ісламських і соціялістичних політик, майбутнє нової адміністрації виглядає невизначеним, особливо після тихих доповідей з Токіо, що висловлюють незадоволення з приводу невдачі ПЕРМАС виграти вибори."
 WORLD.18116.a: "Здається, ми не потягли достатньо ниток."
 WORLD.18116.b: "Подивимося, що вони зможуть зробити."
 WORLD.18116.c: "Чи може соціялізм вижити під піднесеним сонцем?"
 WORLD.18116.m: "Час виконувати наші обіцянки."

 WORLD.18117.t: "[Get_newspaper_header]Дато Онн Джаафар виграє вибори в Малаї!"
 WORLD.18117.d: "Після завершення конфлікту з UMAJF, 25-та армія склала повноваження після періоду тимчасового уряду в Малаї, щоб дати місце місцевим виборам. Хоча спостерігачі передбачали брудні ігри, фальсифікації та маніпуляції з боку Японії, здається, що місцеві вибори пройшли гладко і досить чесно.\n\nНаціоналістична Пертабухан Кебангсан Мелаю Бесату під керівництвом Дато Онна Джаафар здобула перемогу завдяки мобілізації свого електорату, хоча соціялістична Партія Кебангсан Мелаю Малая здобула значну кількість місць. Хоча зовні все виглядає спокійно, старіння Джааафара та зростаючі розбіжності всередині ПЕРМАС викликають сумніви щодо його здатності ефективно управляти Малаєю, і деякі вважають Джааафара лише японським пішаками в Малаї. Токіо вже привітало новий уряд з їхньою перемогою та обіцяло додаткову допомогу."
 WORLD.18117.a: "Наш план виправдався."
 WORLD.18117.b: "Малайя, зламана під японським чоботом."
 WORLD.18117.c: "Пішака чи чесний уряд?"
 WORLD.18117.m: "Малаї буде піднесено."

 WORLD.18118.t: "[Get_newspaper_header]Альбар приймає керівництво в Малаї"
 WORLD.18118.d: "За неясних обставин, місцевий націоналістичний активіст з ПЕРМАС, Сайєд Джаафар Альбар, взяв владу в Малаї після того, як піднявся до найвищих сходів влади. Альбар, пропагуючи радикальні націоналістичні погляди порівняно з іншими лідерами в ПЕРМАС, викликав занепокоєння щодо прав расових меншин і етнічних заворушень в Малаї, побоюючись, що його дії призведуть до подальшого гноблення заради збільшення прав малайців.\n\nХоча його вплив у фрагментованій партії залишається нестабільним, ясно, що партія швидко рухається до етнонаціоналістичного курсу, разом із збільшенням співпраці з Японією. Малайя потрясена новою хвилею заворушень і насильства, і багато хто боїться, що країна знову впаде під японське гноблення."
 WORLD.18118.a: "Добровільний пішака бере владу."
 WORLD.18118.b: "Вони йдуть до темнішого шляху."
 WORLD.18118.c: "Що тепер буде з Малаєю?"
 WORLD.18118.m: "Малайя для малайців!"

 WORLD.18119.t: "[Get_newspaper_header]Аскар Ватаніах захоплює владу в Малаї"
 WORLD.18119.d: "Зі зламаними носами після поразки від колабораціоністів, здається, що широка коаліція повстанців під крилами UMAJF також закінчилася. Після припинення співпраці між MPAJA та Аскар Ватаніах, обидві фракції рухаються, щоб забезпечити залишки території, яку вони утримують, щоб не дати їй потрапити до іншої фракції.\n\nАскар Ватаніах під керівництвом Єопа Махідіна здобув перемогу над MPAJA та зламав їхню силу, він створив тимчасову військову хунту, чекаючи повернення Туна Хусейна Онна, відомого політика, з його вигнання в Республіці Індія, перш ніж відновити цивільне правління. Хоча багато хто вважає їх обіцянки брехнею для встановлення диктатури, деякі спостерігачі відзначають, що можливе повернення до цивільного правління, ймовірно, стане можливим на залишках території колишнього UMAJF."
 WORLD.18119.a: "Ми будемо пильно стежити за подальшим розвитком."
 WORLD.18119.b: "Великі обіцянки для потенційного диктатора."
 WORLD.18119.c: "Чи здійснить він свої обіцянки?"
 WORLD.18119.m: "Необхідно відновити стабільність в Малаї."

 WORLD.18120.t: "[Get_newspaper_header]MPAJA захоплює владу в Малаї"
 WORLD.18120.d: "Зі зламаними носами після поразки від колабораціоністів, здається, що широка коаліція повстанців під крилами UMAJF також закінчилася. Після припинення співпраці між MPAJA та Аскар Ватаніах, обидві фракції рухаються, щоб забезпечити залишки території, яку вони утримують, щоб не дати їй потрапити до іншої фракції.\n\nMPAJA під керівництвом Чина Пенга, після того як він успішно відбив Аскар Ватаніах і очистив їх від можливості взяти владу, видав кілька надзвичайних указів, щоб нібито захистити те, що залишилося від колишньої території UMAJF від японського вторгнення, даючи йому можливість правити як тимчасовий диктатор. Експерти в основному погоджуються, що Чин Пенг, ймовірно, не відмовиться від влади після того, як загроза зникне, але багато людей у Малаї все ще сподіваються на можливий кінець надзвичайного правління одного дня."
 WORLD.18120.a: "Тривожні новини."
 WORLD.18120.b: "Світло демократії згасає."
 WORLD.18120.c: "Чи судилося йому слідувати слідами Бухаріна?"
 WORLD.18120.m: "Свобода повернеться до Малаї."

 WORLD.18121.t: "[Get_newspaper_header]Альбар приймає керівництво в Малаї"
 WORLD.18121.d: "Після передчасної смерті Дато Онна Джаафар, Сайєд Джаафар Альбар, відомий націоналістичний лідер, взяв владу в Малаї після того, як піднявся до найвищих сходів влади. Альбар, пропагуючи радикальні націоналістичні погляди порівняно з іншими лідерами в ПЕРМАС, викликав занепокоєння щодо прав расових меншин і етнічних заворушень в Малаї, побоюючись, що його дії призведуть до подальшого гноблення заради збільшення прав малайців.\n\nХоча його вплив у фрагментованій партії залишається нестабільним, ясно, що партія швидко рухається до етнонаціоналістичного курсу, разом із збільшенням співпраці з Японією. Малайя потрясена новою хвилею заворушень і насильства, і багато хто боїться, що Малайя продовжить падати в темну прірву, де буде продовжуватися гноблення і підкорення."
 WORLD.18121.a: "Тривожно, але пішака тепер у наших руках."
 WORLD.18121.b: "Малайя знову зламана."
 WORLD.18121.c: "Чи судилося Малаї померти підкореною?"
 WORLD.18121.m: "Малайя для малайців!"
 
 ### Philippines Events

 WORLD.181210.t: "[Get_newspaper_header]Купа Симбанг Габі зупинена"
 WORLD.181210.desc: "Після понад тижня боїв, хаос, що охопив Вільну Республіку Філіппін, тепер завершено. Сили Рамона Магсайсаї перемогли заколот, організований Венделлом Фертігом, і відновили Карлоса Гарсію на посаді президента.\n\nКонфлікт почався 16 грудня, в перший день Симбанг Габі, дев'ятиденних католицьких мес перед Різдвом. В цей день війська, під командуванням Фертіга, захопили Конгрес і насильно вимагали імпічменту президента Гарсії та віце-президента Сантоса. Хоча Фертіг деякий час утримував виконавчу владу, Магсайсаї рішуче оточив зрадницького генерала і змусив його здатися. З поверненням президента Гарсії на посаду, а його братом Генаро тепер виконуючим обов'язки віце-президента, Магсайсаї має хороші шанси керувати республікою в разі майбутніх криз."
 WORLD.181210.a: "Жодна темрява не може приховати факел свободи."

 WORLD.181211.t: "[Get_newspaper_header]Заколот Симбанг Габі"
 WORLD.181211.desc: "Після понад тижня боїв, хаос, що охопив Вільну Республіку Філіппін, тепер завершено. Сили Венделла Фертіга, колишнього американського партизанського лідера, керівника USFIP, здобули контроль над столицею.\n\nКонфлікт почався 16 грудня, в перший день Симбанг Габі, дев'ятиденних католицьких мес перед Різдвом. В цей день війська під командуванням Фертіга захопили Конгрес і насильно вимагали імпічменту президента Гарсії та віце-президента Сантоса. Хоча Рамон Магсайсаї вів запеклий опір, його капітуляція перед федеральними військами на Різдвяний вечір в ім'я національної єдності поклала кінець конфлікту. Зі сходом Різдвяного ранку майбутнє Вільної Республіки здається невизначеним."
 WORLD.181211.a: "Неприємний подарунок."

 WORLD.181212.t: "[Get_newspaper_header]Режим Авеліно розбитий контрзаколотом Філіппін"
 WORLD.181212.desc: "Незважаючи на всі зусилля США з утримання важливих позицій на завжди мінливому політичному ландшафті Південно-Східної Азії, надмірна військова присутність Америки на Сході, схоже, відбилася проти них; після того, як США не змогли протидіяти повстанню в філіппінській армії, тимчасовий уряд Хосе Авеліно та війська США під командуванням полковника Фертіга були вигнані з архіпелагу лоялістами під командуванням філіппінського героя війни Рамона Магсайсаї.\n\nОскільки сфери впливу Америки та Японії постійно перебувають у конфлікті, цей політичний інцидент стратегічних маніпуляцій Америки, ймовірно, матиме наслідки в Вашингтоні, не кажучи вже про одного з найстаріших союзників Америки, який тепер може опинитися ізольованим і самотнім перед японцями, а майбутнє філіппінської демократії висить на волосині..."
 WORLD.181212.a: "Майбутнє островів тепер лише їхнє, що б не сталося."
 WORLD.181212.b: "Цей телефонний дзвінок буде незручним..."
 WORLD.181212.c: "Відкрита рана може бути посолена, можливо, варто подумати про гарячу лінію з Маніли?"
 WORLD.181212.d: "Ми – бійці Батану!"

 WORLD.18122.t: "[Get_newspaper_header]JALO запускає Балінтавацьку Блиц"
 WORLD.18122.desc: "Після років здавання бездіяльності, альянс двох найбільших повстанських груп Філіппін розпочав свою найбільшу атаку на Другу Філіппінську Республіку на сьогоднішній день. Прикордонні міста охоплені вогнем та артилерійськими снарядами, оскільки Спільна Анти-Лаврелістська Офензива розриває довгу стагнацію конфлікту. Незважаючи на шок, Філіппінська поліція та Японська 14-та армія змушені проводити відступи, а в деяких випадках були вигнані з поля бою.\n\nПитання тепер, коли конфлікт наближається до Перлини Сходу з кожним виграним або втраченим сантиметром землі: чи переживе так звану "підставну республіку"? Чи впаде вона? Хто її звалить: соціялісти на півночі чи рештки старого Співтовариства на південь? Як відреагують Сонце та Орел? Час покаже."
 WORLD.18122.a: "Авангард рухається до останнього виступу."
 WORLD.18122.b: "Їхній квиток додому чекає."
 WORLD.18122.c: "Ми стоїмо тут!"
 WORLD.18122.d: "Віддалена війна в далекій країні?"
 
 WORLD.18123.t: "[Get_newspaper_header]Друга Філіппінська Республіка об'єднує Філіппіни"
 WORLD.18123.desc: "Незаконний син доводить свою гідність, пройшовши через вогонь. Це історія, стара як світ, і тепер Друга Філіппінська Республіка, яка колись вважалася фальшивими претендентами, що підтримуються священною єною, додає ще одну запис у святий каталог.\n\nКолись близька до національної загибелі, манільські мужі трималися, поки ненависні повстанці не вичерпали свої сили, після чого розпочалася жорстока контрнаступальна операція аж до їхніх фортець. Свята, що тривали днями та ночами, відбулися після того, як президент Хосе Юло оголосив здачу останнього великого повстанського опору на острові Мінданао. Найгірше, як вважається, для багатьох, тепер позаду.\n\nХоча реконструкція ще попереду, філіппінці тепер можуть зустрічати її з піднятою головою, що б не сталося."
 WORLD.18123.a: "Тисячі нових хрестів для Арлінгтона."
 WORLD.18123.b: "Порядок відновлено після двадцяти років."
 WORLD.18123.c: "Твою свободу будемо охороняти, моя рідна країно!"
 WORLD.18123.d: "Справжня історія про перемогу над відступаючими."

 WORLD.181233.t: "[Get_newspaper_header]Убивство президента Хосе Юло"
 WORLD.181233.desc: "Дні святкувань раптово стали днями жалоби, коли Філіппінська Генеральна Лікарня оголосила, що Хосе Юло Юло, другий президент Республіки Філіппін, помер від отриманих ран о 9:28 вечора вчора. Це стало важким ударом для молодої республіки, яка тільки що вийшла з кризи під керівництвом покійного.\n\nВ той час як Офіс президента наказав приспустити прапори на урядових будівлях і видав деталі його похорону, Національні збори терміново скликали позачергове засідання для визначення наступника Юло. Інсайдери заявляють, що політичне поле країни ще більше загострилося, оскільки фракції KALIBAPI, що колись були об'єднані війною, тепер борються за вищу посаду країни, в результаті чого новий президент може бути вибраний лише через кілька місяців."
 WORLD.181233.a: "З однієї паніки в іншу."
 
 WORLD.181234.t: "[Get_newspaper_header]Манільська криза"
 WORLD.181234.desc: "Шокуючі новини надходять із самого серця Перлини Сходу, коли повідомлення про жертви з міста надходять день за днем від події, тепер відомої як «Манільський інцидент». Розпад серії невідомих подій призвів до того, що столиця Переможної Другої Філіппінської Республіки опинилася в безладі, а повстанці спостерігали за тим, як хаос заповнює вулиці. Дехто припускає, що це було спричинено невдалим відновлювальним процесом для відбудови країни після JALO, але ніхто не може сказати точно.\n\nЗ Манілою в анархії генерал 14-ї армії Масацуми Інада розпустив Національні збори після того, як їх члени перебралися в північне місто Багіо. З того часу він скористався своїми повноваженнями для того, щоб очолити тимчасовий військовий уряд до моменту, поки Маніла не буде стабілізована. ЗМІ важко отримати більше деталей про ситуацію, оскільки місто вважається надто небезпечним для подорожі."
 WORLD.181234.a: "Молимося за їхнє виживання."
 
 WORLD.18124.t: "[Get_newspaper_header]AFRSR захоплює Манілу"
 WORLD.18124.desc: "Минуло понад триста років відтоді, як перший філіппінець став рабом для плантацій іспанців. Його панове змінилися багато разів відтоді, але не його страждання. Матеріальне становище його землі, кажуть, є таким саммим родючим для революції, як і для рису, проростаючи потоком, який невпинно несе свої води через гори та долини.\n\nМаніла тепер стала свідком червоної хвилі, яку святкують робітники та селяни, піднімаючи червоний прапор по всьому новозахопленому місту. Тим часом, супремо Луїс Тарук урочисто оголосив, що «фашистське і імперіалістичне видовище», яке мучило країну понад чотириста років, майже переможене.\n\nУсе, що залишається, – це підготуватися до тривалої боротьби з неминучим поверненням Японії. Наразі жодних відповідей на питання, яке місце у цьому займатимуть американці та їхні південні сателіти."
 WORLD.18124.a: "Так близько, і все ж так далеко..."
 WORLD.18124.b: "Для революції!"
 WORLD.18124.c: "Щоб помститися за наших полеглих, ми повернемося."
 WORLD.18124.d: "Війна програна."
 WORLD.18124.e: "Соціялізм здобуває популярність в Азії."

 WORLD.18125.t: "[Get_newspaper_header]FPR захоплює Манілу"
 WORLD.18125.desc: "[UPH.GetLeader] FPR оголосив припинення бойових дій у Манілі сьогодні після кількох тижнів важких боїв, заявивши, що місто звільнено «від сил Японії та нелегітимного режиму Юло». Його «партизанська армія» перевершила очікування, вигнавши SPR зі столиці країни в успішній, хоча й затяжній та кривавій кампанії. Хоча місто не менш пошкоджене, ніж багато інших частин найбільшого міста Лусона, палац Малакаñан тепер майорить Старою Славою і прапором старого Співтовариства поруч один з одним – вперше за понад двадцять років.\n\nТимчасовий президент Юло та його Кабінет евакуювались до Токіо до початку облоги; офіційної капітуляції, ймовірно, не буде, попри їхню поразку. По той бік Тихого океану американці та філіппінські емігранти радуються несподіваному завершенню тривалої окупації.\n\nПроте святкування повернення змушують задуматися про можливу спробу відплати, схожу на ту, що призвела до повалення останнього цивільного уряду Філіппін у 1942 році."
 WORLD.18125.a: "Ми не впадемо вдруге!"
 WORLD.18125.b: "Ще один імперіаліст оселяється в Манілі."
 WORLD.18125.c: "Щоб помститися за наших полеглих, ми повернемося."
 WORLD.18125.d: "Війна програна."
 WORLD.18125.e: "Чи повернулися американці на острови?"

 WORLD.18126.t: "[Get_newspaper_header]Перемога колабораціоністів у Малаї"
 WORLD.18126.d: "Японська імперія залишається. Після років конфлікту, здається, що нічого суттєво не зміниться в нації Малаї. Неможливість правильно використовувати свої зв'язки з ОВН змусила UMAJF капітулювати перед Шонаном, що ознаменувало кінець їхньої тривалої боротьби. Ямамото Мойчіро погодився припинити губернаторство та сформувати федеральну монархію – хоча справжня незалежність такої держави ще невідома.\n\nОднак офіційний кінець війни не означає, що мир повернувся в Малаю: насправді, анти-японський опір триває, і колабораціоністський уряд опинився в тяжкому становищі, оскільки підпільні опозиційні групи не злякалися японської перемоги."
 WORLD.18126.a: "Коли-небудь вони пізнають справжню свободу."
 WORLD.18126.b: "Сфера залишається об'єднаною проти своїх ворогів!"
 WORLD.18126.c: "Здається, так..."
 WORLD.18126.m: "Тепер нація може відновлюватися"

 WORLD.18129.t: "[Get_newspaper_header]Перемога колабораціоністів у Малаї"
 WORLD.18129.d: "Японська імперія залишається. Після років конфлікту, здається, що нічого суттєво не зміниться в нації Малаї. Неможливість правильно використовувати свої зв'язки з ОВН змусила UMAJF капітулювати перед Шонаном, що ознаменувало кінець їхньої тривалої боротьби. Ямамото Мойчіро погодився припинити губернаторство та заснувати федеральну монархію – хоча справжня незалежність такої держави ще невідома.\n\nПісля смерті Дато Онн Джаафара новий уряд очолить Сайд Джаафар Альбар, який пообіцяв повернути малайське панування. Вже зараз меншість почала виїжджати з американськими силами, оскільки багато хто побоюється, що можуть виникнути репресії. Перед лицем руйнувань, спричинених роками конфлікту, новий уряд, здається, зацікавлений лише в подальшому насильстві, і їхні японські господарі готові це дозволити."
 WORLD.18129.a: "Ми зазнали поразки – можливо, малаїйці ніколи не пізнають свободи."
 WORLD.18129.b: "За високу ціну, Сфера тримається."
 WORLD.18129.c: "Інферно горить в країні руїн."
 WORLD.18129.m: "Ми вільні. Це все, що має значення."

 WORLD.18127.t: "[Get_newspaper_header]Квінтін Паредес інавгурований президентом"
 WORLD.18127.desc: "Якщо Колегія кардиналів у Римі вигукує «Habemus Papam!» після виборів нового папи, так само й Національні збори вигукнули власний вигук – «Mabuhay ang Pilipinas!» – оголосивши інавгурацію Квінтіна Паредеса на тлі тривожної натовпи біля палацу Малакаñан.\n\nТихий і ерудит, колишній міністр громадських робіт і зв'язку пообіцяв продовжити реформи свого попередника та будувати консенсус у КАЛІБАПІ. Його призначення стало полегшенням для тих, хто зневажає історичну деспотичну лінію Малакаñан. З іншого боку, його противники критикують його рецидивізм у питанні реалізації Тагалогізаціє, покарання зрадників та загалом вірності бачення Хосе Лауреля.\n\nЧи зможуть закони Паредеса перемогти націю сильної влади? Як каже старовинна приказка: багато сподіваються, але мало хто вірить."
 WORLD.18127.a: "Але якщо хочеш зробити щось, хоча б зроби це добре."
 
 WORLD.18130.t: "[Get_newspaper_header]Кларо М. Ректо інавгурований президентом"
 WORLD.18130.desc: "Новий президент Філіппін Кларо Майо Ректо склав присягу, що завершує тижні нестабільності в країні, що включали вбивство його попередника, Хосе Юло. Поет і націоналіст, який раніше був президентом Конституційної Конвенції 1934 року, склав присягу на традиційній церемонії в парку Рісала, історичному парку біля Манільської затоки.\n\nЙого інавгурація відбулася після насильницької боротьби за вплив між Японією та США. Відомий як «Балінтавакський Бліц», цей конфлікт призвів до поразки як комуністичних повстанців, так і залишків уряду Співдружності. У своїй інавгураційній промові Ректо пообіцяв відмовитися від компромісів і захищати свою рідну країну від впливу колоніалізму. Залишається невідомим, наскільки далеко Ректо готовий йти для здійснення свого бачення філіппінської свободи та процвітання."
 WORLD.18130.a: "Одна нація, один дух."
 
 WORLD.18131.t: "[Get_newspaper_header]Серджіо Осмеña-молодший інавгурований президентом Філіппін"
 WORLD.18131.desc: "Серджіо Осмеña-молодший склав присягу президентом Другої Філіппінської Республіки сьогодні вранці в урочистій церемонії в Малакаñан, президентському палаці часів іспанської колонії на річці Пасиг у Манілі. Темна конячка серед претендентів на спадщину покійного президента Юло, цей магнат із Себу був супроводжений своїми співпрацівниками та депутатами, яких він завоював, щоб забезпечити своє піднесення.\n\nІнавгурація Осмеñї означає офіційний кінець насильницької боротьби за вплив між Японією та США. «Балінтавакський Бліц», як його називають, призвів до поразки як комуністичних повстанців, так і залишків армії Співдружності. Трагедія, сказав новий головнокомандувач, він закликає філіппінців по всіх сторонах до прощення. Спостерігачі помічають, що примиренницька промова Осмеñї приховує явну відсутність сентиментів Лауреліста, що може свідчити про більш широкий реформістський порядок, ніж очікувалося."
 WORLD.18131.a: "Як батько, так і син."
 
 WORLD.18132.t: "[Get_newspaper_header]Японія запускає помсту на Філіппінах"
 WORLD.18132.desc: "Японці повернулися на Філіппіни. Після успіху «Балінтавакського Бліцу», який призвів до вигнання японського маріонеткового режиму, здається, що Токіо готове пролити ще більше крові, щоб утримати свою владу над Перлиною Сходу. Рано вранці передові підрозділи 14-ї армії Сіноубу Такаями висадилися в регіоні Ілокос острова Лусон. Скориставшись фактором несподіванки, японські війська швидко захопили міста Сан-Фернандо та Дагупан.\n\nХоча атака здивувала філіппінських захисників, було відомо, що лише питання часу, коли Японія знову повернеться. Після того як філіппінці вже вирвалися з-під влади Висхідного Сонця, вони, ймовірно, будуть чинити жорстокий і тривалий опір. Як би не закінчилась ця боротьба, острів знову охоплений вогнем та кров'ю."
 WORLD.18132.a: "Захищаймо нашу свободу!"
 WORLD.18132.b: "Вони не втечуть від нас вдруге."
 WORLD.18132.c: "Заради справи свободи ми повинні покласти цьому край раз і назавжди."
 WORLD.18132.d: "Справжня війна за незалежність почалася."
 WORLD.18132.USA.tt: "§Ми можемо надіслати добровольців на допомогу філіппінцям проти японців§!."
 
 WORLD.18133.t: "[Get_newspaper_header]ЮФФ перемогла японську інвазію"
 WORLD.18133.desc: "Бої, здається, завершилися на Філіппінах, оскільки останні підрозділи 14-ї армії або евакуювалися зі своїх позицій, або здалися Об'єднаному Філіппінському фронту. ЮФФ, альянс комуністів та FPR, здобув перемогу, перемігши японців двічі за останній час. Через радіопередачу лідери ЮФФ Луїс Тарук та [UPH.GetLeader] висловили надію, що забезпечений мир дозволить мирне об'єднання островів.\n\nВашингтон уже пообіцяв допомогти майбутньому об'єднаному уряду, прагнучи створити міцну опору в японському домінованому Тихому океані. Токіо, тим часом, залишилося абсолютно мовчазним з цього питання, хоча припускають, що невдача 14-ї армії у відновленні контролю викликала серйозні побоювання щодо військових можливостей Японії."
 WORLD.18133.a: "Свобода, нарешті!"
 WORLD.18133.b: "Це ганьба!"
 WORLD.18133.c: "І нехай острови знайдуть мир."
 WORLD.18133.d: "Великий удар по Висхідному Сонцю."
 
 ### 14th army seizes Luzon
 WORLD.18134.t: "[Get_newspaper_header]Перемир'я на Філіппінах"
 WORLD.18134.desc: "Сьогодні було досягнуто офіційного перемир'я між FPR та японською 14-ю армією на Філіппінах. Вторгнення на острови розпочалося швидким просуванням, захопивши території, які належали Всефіліппінській Революційній Соціялістичній Республіці, включаючи колишню столицю Манілу.\n\n14-та армія захопила більшу частину Лусона, перш ніж на повну силу звернутися проти FPR, але їхній наступ застряг, оскільки підтримувані Америкою партизани вели жорстокий бій проти загарбників. Зі зростанням кількості жертв і уповільненням просування Токіо не мало іншого вибору, як запропонувати умови для перемир'я. FPR також була змушена прийняти ці умови через відносну нестачу ресурсів та інфраструктури. Ситуація на Філіппінах, ймовірно, залишатиметься джерелом занепокоєння для політиків у Вашингтоні та Токіо протягом тривалого часу."
 WORLD.18134.a: "14-та армія виконала свій обов'язок."
 WORLD.18134.b: "Не найгірше, але могло б бути й краще."
 WORLD.18134.c: "Як довго може тривати ілюзія миру?"
 
 ### 14th army seizes Luzon and Central Philippines
 WORLD.18135.t: "[Get_newspaper_header]Перемир'я на Філіппінах"
 WORLD.18135.desc: "Сьогодні було досягнуто офіційного перемир'я між FPR та японською 14-ю армією на Філіппінах. Вторгнення 14-ї армії розпочалося швидким просуванням, захопивши території, що належать Всефіліппінській Революційній Соціялістичній Республіці, включаючи колишню столицю Манілу.\n\nЯпонці змогли просунутися далеко вглиб центрального архіпелагу, перш ніж їхній наступ загальмувався, оскільки підтримувані Америкою партизани чинили жорстокий опір загарбникам. Зі зростанням кількості жертв і уповільненням просування Токіо вирішило, що не має вибору, як запропонувати умови для перемир'я. Зі свого боку, FPR також була змушена прийняти ці умови через відносну нестачу ресурсів та інфраструктури. Ситуація на Філіппінах, ймовірно, залишатиметься джерелом занепокоєння для політиків у Вашингтоні та Токіо на тривалий час."
 WORLD.18135.a: "14-та армія виконала свій обов'язок вражаюче."
 WORLD.18135.b: "Південь не буде втрачений!"
 WORLD.18135.c: "Як довго може тривати ілюзія миру?"

 WORLD.181351.t: "[Get_newspaper_header]Військовий переворот у Вільній Республіці"
 WORLD.181351.desc: "Нестабільність, яка переслідувала Філіппіни впродовж останніх десятиліть, тільки посилилася. Після перемир'я між ворожими фракціями архіпелагу через висадку японської 14-ї армії, Рамон Магсайсаї та група офіцерів армії захопили контроль над країною через безкровний переворот під виглядом 'збереження порядку' та боротьби з комунізмом. Багато хто по всій країні засуджує це як очевидне захоплення влади, але Магсайсаї стверджує, що це на благо Філіппін."
 WORLD.181351.a: "Чи вважають філіппінці, що вони в змозі керувати?"
 WORLD.181351.b: "В цьому явному перевороті немає нічого демократичного!"
 WORLD.181351.c: "Вогонь продовжує палати."
 
 ### 14th army kills everyone
 WORLD.18136.t: "[Get_newspaper_header]14-та армія перемогла на Філіппінах"
 WORLD.18136.desc: "Хоча спорадичні партизанські бої ще тривають у лісах та джунглях, генерал Сінобу Такаяма доповів Токіо, що відновлення контролю над Філіппінами фактично завершено. Незважаючи на рішучий опір з боку FPR та комуністичних повстанців, японська експедиційна армія змогла знищити обидві групи. Уцілілі учасники розсіялись по островах і, ймовірно, становитимуть незначну загрозу.\n\nТимчасовий уряд Філіппінських островів був утворений 14-ю армією, адміністрацією, що напряму підпорядкована Токіо. Атмосфера в Токіо, як повідомляється, є святковою - Перлина Сходу знову приєднана до складу імперії. У різкому контрасті з цим, Вашингтон деморалізований швидким поворотом подій, втративши важливий потенційний елемент у боротьбі проти Японської імперії."
 WORLD.18136.a: "За справу паназіатизму!"
 WORLD.18136.b: "Філіппіни втрачені."
 WORLD.18136.c: "Сонце, що сходить, спалює все, до чого його промені торкаються."
 
 ### OFN mandate win
 WORLD.18137.t: "[Get_newspaper_header]Мандат ОВН на Філіппінах об'єднує острови"
 WORLD.18137.desc: "Здається, що трясовина на Філіппінах, нарешті, закінчилася, і острови знову опинилися під американським контролем.\n\nМандат ОВН на Філіппінах, очолюваний американським генералом Дуайтом Едвардом Бічем, переміг як комуністів, так і японську 14-ту армію, і тепер вони стали новими лідерами Філіппін.\n\nХоча партизанська боротьба все ще триває, особливо серед комуністів, що воюють проти американців на півночі Лусона, перемога Біча здається твердо закріпленою. Америка вже надіслала вітання переможному генералу. Хоча уряд заявив, що перехід до самоврядування на островах відбудеться якнайшвидше, ознак військового виведення США з островів поки не спостерігається. Можливо, Філіппіни все ще не здобули свою незалежність."
 WORLD.18137.a: "Народ Філіппін має бути захищений від себе."
 WORLD.18137.b: "Ці прокляті імперіалісти!"
 WORLD.18137.c: "Що вони роблять?"
 
 ### FPR win
 WORLD.181377.t: "[Get_newspaper_header]ФПР об'єднує Філіппіни"
 WORLD.181377.desc: "Здається, нескінченний багаторічний конфлікт на Філіппінах завершився, оскільки [UPH.GetLeader] Вільної Філіппінської Республіки вийшов переможцем з туману війни.\n\nЗі зламами відносин між комуністичними силами AFRSR острови були змушені вступити в ще один трирівневий конфлікт, що призвело до невимовного хаосу та руйнувань на островах. Тепер ФПР стоїть високо як переможець цієї війни, знищивши японців і комуністичних повстанців.\n\n[UPH.GetLeader] оголосив світу, що він розпочне відбудову зруйнованих островів, а також повернення цивільного уряду після завершення процесу відбудови. Окрім незадоволених політиків у Токіо, світ зітхає з полегшенням, оскільки ще одна нація несе факел свободи."
 WORLD.181377.a: "Наші хлопці добре виконали свою частину."
 WORLD.181377.b: "Наші зусилля марні, це все не має значення."
 WORLD.181377.c: "Люди святкують свою свободу."
 
 ### Commie win
 WORLD.18138.t: "[Get_newspaper_header]Перемога Народної Республіки Філіппін"
 WORLD.18138.desc: "Приголомшливі новини надходять з Філіппін, адже здається, що філіппінські комуністи перемогли як японську 14-ту армію, так і партизанські сили, підтримувані США. Оскільки співпраця між двома партизанськими силами закінчилася катастрофою, спочатку невеликий опір на півночі Лузона відбив як американців, так і японців, і тепер Народна Республіка стала єдиним беззаперечним правителем філіппінських островів.\n\nРаніше відома як Всефіліппінська Революційна Соціялістична Республіка, Супремо Луїс Тарук оголосив своє бажання сформувати єдиний філіппінський уряд під соціялістичним правлінням, утворивши Народну Республіку Філіппін після того, як переговори між ними та ФПР зазнали провалу. Залишилось лише спорадичне бойове протистояння в сільській місцевості, а будь-яка значна організована опозиція зникла, і переможний Тарук нарешті здійснив свою мрію про вільні Філіппіни під соціялістичним правлінням."
 WORLD.18138.a: "Принаймні це не Японія."
 WORLD.18138.b: "Як їм вдалося це здійснити?"
 WORLD.18138.c: "Соціялістичні Філіппіни?"
 
 ### Taruc gets yeeted by Marcos in PRP
 WORLD.18140.t: "[Get_newspaper_header]Фердинанд Маркос став лідером Філіппін"
 WORLD.18140.desc: "З перемогою Луїса Тарука та Partido Komunista ng Pilipinas на Філіппінських островах здавалося, що соціялістичне правління островами буде закріплено на найближче майбутнє, але нещодавно все змінилося. Фердинанд Маркос з Kilusang Bagong Lipunan, «Руху Нового Суспільства», здійснив державний переворот проти Супремо Народної Республіки Філіппін, яка була заснована лише кілька місяців тому.\n\nРозуміючи, що необхідно забезпечити своє становище, Луїс Тарук наказав «ліквідацію» підривних некомуністичних елементів усередині країни після війни. Фердинанд Маркос, підтримуваний залишковими центристськими та правими рухами країни, здійснив переворот, щоб виштовхнути Тарука з влади у відповідь на цей очищувальний процес.\n\nЯк тільки хаос вщух, нова сторінка була перевернута в книзі історії Філіппін, під проводом Фердинанда Маркоса їдралін."
 WORLD.18140.a: "Тінь повзала по землі, несучи обіцянки миру та процвітання."

 ### Coalition Gov't formation
 WORLD.18139.t: "[Get_newspaper_header]Формування Третьої Філіппінської Республіки"
 WORLD.18139.desc: "Вперше з'явилися слова надії з регіону Південно-Східної Азії. Довготривалий конфлікт у регіоні завершено після офіційного оголошення об'єднання островів [?global.date.GetDateStringNoHourLong] від [UPH.GetLeader] з FPR та Луїса Тарука з AFRSR.\n\nЗ цим оголошенням весь архіпелаг Філіппін тепер знаходиться під управлінням об'єднаної коаліційної урядової влади демократичних симпатиків і соціялістів, під офіційною назвою Третя Республіка Філіппін. В.о. президента, Лоренцо Таніада, обіцяє покінчити з провалами старого порядку та прокласти шлях до демократії для Філіппін. Хоча світ сумнівається у стабільності цього нового уряду, це, безсумнівно, шлях до яскравішого майбутнього для Філіппін."
 WORLD.18139.a: "Наша робота тут завершена."
 WORLD.18139.b: "Це абсурд!"
 WORLD.18139.c: "Нехай світ змінюється на краще."
 
 WORLD.18141.t: "[Get_newspaper_header]Тарук викидає президента Таняду"
 WORLD.18141.desc: "Здається, статус-кво, який встановив тепер уже колишній президент Таняда на Філіппінах, було розірвано його ж коаліцією, оскільки Луїс Тарук і його революціонери здобули більшість в єдиній легальній партії країни.\n\nРезигнація Таняди стала кульмінацією місяців напруженої програми відновлення, що була затьмарена неефективним управлінням і затримками. Тарук швидко скористався невдачами президента, оголосивши його некомпетентним перед Асамблеєю, підігріваючи незадоволення серед повільно розчарованого населення. Це створило основу для масових дефекцій на лівий фланг коаліції - і, з початком демобілізації, Філіппінська армія змогла лише з нерухомою згоду дати згоду на "безкровну революцію" Тарука.\n\nТепер, коли він зміцнився, самопроголошений Генеральний секретар обіцяв утопію для робітників і селян. Чи зможе він виконати це, ще належить дізнатися."
 WORLD.18141.a: "Ще більше проблем на Філіппінах."
 WORLD.18141_USA_tt: "§Луїс Тарук§! захопив філіппінський трон. На щастя для нас, §Наша коаліція все ще тримається§!."
 
 WORLD.18142.t: "[Get_newspaper_header]Клік Магсайсая викидає президента Таняду"
 WORLD.18142.desc: "За кілька годин після того, як спостерігачі помітили, як армійські вантажівки потайки залишають Малакаян, президент Таняда оголосив про свою відставку по національному радіо. Ефективно з півночі, посаду мав зайняти колишній генерал-майор Рамон Ф. Магсайсай.\n\nВідставка Таняди стала кульмінацією місяців напруженої програми відновлення, що, за словами героя війни, була затьмарена "політичним паралічем та саботажем червоних". Його звинувачення виявилися вирішальними серед відчужених депутатів коаліції, які потім відмовилися від вагань Таняди на користь рішучих дій, які виступав Магсайсай. Враховуючи безумовну підтримку армії власних людей, очевидно, що ці події можна було передбачити.\n\nХоча новий Солдат-президент обіцяв більш демократичне правління, коли "ситуація стабілізується", багато редакційних статей дивуються, коли цей момент настане - або чи він настане взагалі."
 WORLD.18142.a: "Здається, надто легко підривається воля народу."
 
 ### Mozambican Civil War

 WORLD.18143.t: "[Get_newspaper_header]Мозамбік палає!"
 WORLD.18143.desc: "У шокуючих новинах, уряд Мозамбіку, що підтримує ОВН, був скинутий, а його лідер, президент Едуардо Мондлане, змушений був переїхати на північ країни після перевороту генерала Самори Мачела. Генерал Мачел звинувачує Мондлане в тому, що він «обіймав капіталістичних імперіалістів» і «зрадив народ Мозамбіку». За деякими джерелами, Мачел мав підтримку своїх союзників з Японії. З'явилися повідомлення про спорадичні бої по всій недавно звільненій країні, і тепер єдине питання - яка зі сторін вийде переможцем."
 WORLD.18143.a: "Африка сьогодні ніколи не відпочиває."

 WORLD.18144.t: "[Get_newspaper_header]Мачел скидає режим"
 WORLD.18144.desc: "У шокуючому блиці генерала Самори Мачела, який підтримує Ко-Prosperity Sphere, він захопив президента Мондлане з Мозамбіку і проголосив себе новим лідером країни. Після закінчення громадянської війни Мачел більше схильний працювати з ворогами своїх ворогів, ніж ізолювати країну заради самої ізоляції, і отримав підтримку своїх союзників у Токіо, що було засуджено офіційними особами у Вашингтоні. В Японії офіційні заяви привітали нового президента з перемогою над колоніальними гнобителями."
 WORLD.18144.a: "Сонце, що сходить, має нову землю, на яку можна світити."

 WORLD.18145.t: "[Get_newspaper_header]Мондлане розбиває переворот"
 WORLD.18145.desc: "Хоча його режим на якийсь час здавався нестабільним, президент Едуардо Мондлане відновив контроль над столицею, з якої йому довелося втікати через переворот, і успішно знову об'єднав Мозамбік. Незважаючи на численні звинувачення щодо підтримки ОВН, президент не коментує питання про глибше співробітництво з інтересами Вашингтона і натомість зосереджений на новій програмі для вирішення деяких проблем своєї країни, яка навіть після того, як німці були вигнані з влади, досі переживає труднощі. Не було жодних коментарів від Вашингтона або Токіо щодо нещодавньої поразки генерала Мачела."
 WORLD.18145.a: "Навіть маленька перемога краще, ніж поразка."

 WORLD.18146.t: "[Get_newspaper_header]Неочікувана перемога Сіманго"
 WORLD.18146.desc: "Неочікуваний переможець з'явився в громадянській війні Мозамбіку, оскільки жоден з колишнього президента Мондлане або генерала Мачела не вийшов переможцем. Натомість, бійці опору лідера Урії Сіманго захопили столицю і оголосили про створення нової Республіки. Проти того, що він називає японською жорстокістю, президент Сіманго вибрав для своєї нової держави орієнтацію на Організацію Вільних Націй, в тому числі й на економічному рівні. Звітність на Уолл-стріт свідчить, що багато американських компаній оптимістично налаштовані щодо майбутніх можливостей на відновлення Мозамбіку після його нещодавніх випробувань."
 WORLD.18146.a: "Краще диявол, якого ти знаєш."

 WORLD.18147.t: "[Get_newspaper_header]Мозамбік - бойня"
 WORLD.18147.desc: "Ворони добре годуються в Мозамбіку, бо від узбережжя до моря лежить товстий килим з неспокійних мертвих. Тут немає перемоги, немає завойовника, що стоїть над своїми переможеними ворогами. Військові вожді Мозамбіку перетворили свою країну на м'ясорубку, де жодна фігура не може утримати своїх сил достатньо, щоб нанести остаточний удар по супротивнику. Іноземні сили відмовилися від підтримки своїх обраних сторін у боротьбі - адже в чому сенс?"
 WORLD.18147.a: "Смерть нації."
 
 ### Congolese Civil War
 
 WORLD.18200.t: "[Get_newspaper_header]Громадянська війна в Конго"
 WORLD.18200.d: "Розрізнені повідомлення та звіти, що надходять з дерев’яного серця Африки, розповідають про хвилювання і конфлікти, оскільки серія буремних битв вибухнула, відправляючи територію в нове потрясіння, де кожна фракція намагається сформувати майбутнє країни відповідно до своїх уявлень.\n\nПротягом століть густі і вологі джунглі Конго зазнавали гноблення і підкорення, спочатку під кривавим правлінням бельгійців, а потім під залізною рукою Райху. І ось ці важливі глави в історії Конго пройшли, і тепер регіон знову потрапляє під дратівливий вплив насильства.\n\nМіжнародні спостерігачі з усього світу уважно слідкують за ситуацією, оскільки перші постріли стають чутними на берегах великого озера."
 WORLD.18200.a: "Ще одне потрясіння."
 
 WORLD.18202.t: "[Get_newspaper_header][CFS.GetName] перемагає у Конголезькій громадянській війні!"
 WORLD.18202.d_CFS: "Після масштабних бойових дій у регіоні, значної підтримки з боку ОВН та простого військового перегравання супротивника, [CFS.GetName] впевнено утверджується на вершині влади в Конго.\n\nЯк Айнхайтспакт, так і Сфера співпроцвітання різко засудили американську присутність у регіоні: міністерство закордонних справ Японії заявило про свою зневагу до «відвертого імперіалізму американців, подібного до того, яким не так давно займалися німці». Натомість німецьке МЗС висловлювалося значно стриманіше, тоді як офіційна заява США вихваляла «рішучість конголезького народу та його відданість збереженню демократії».\n\nУ будь-якому разі, з початком урочистого й формального приєднання [CFS.GetName] до ОВН, Конго офіційно увійшло до Вільного світу.\n"
 WORLD.18202.d_COG: "Постаючи з руїн розпаду Мандату ОВН у Конго, [CFS.GetName] опинилася у протистоянні з кількома фракціями - зокрема з конкурентним демократичним урядом, підтримуваним найбільшою демократією світу, серед інших. Попри це демократичне братовбивство, молода республіка змогла витримати бурю та вийти з неї переможцем.\n\nХоча перемога [CFS.GetName] закріплює статус конголезького мандату як провального проєкту та поразки зовнішньої політики Сполучених Штатів, міністерство закордонних справ Японії привітало цей результат як «опір американському імперіалізму».\n\nҐерманське МЗС зберігає мовчання, однак для міжнародних спостерігачів очевидно, що такий сценарій є значно прийнятнішим, ніж Конго, зорієнтоване на ОВН.\n"
 WORLD.18202.a: "Демократія розквітає в Конго."
 WORLD.18202.b: "Демократія - без жодних умов."
 
 WORLD.18203.t: "[Get_newspaper_header]Популярна Республіка Конго виграє громадянську війну!"
 WORLD.18203.d: "Після колапсу контролю над Центральною Африкою після Південноафриканської війни, здається, що Війни в Конго нарешті завершилися, і басейн в самому серці Африки тепер має новий відтінок червоного. Після смерті Патріса Лумумби соціялістичні елементи в «Національному колоніальному русі» відкололися, утворивши свій рух під керівництвом Крістофа Гбенє. Завдяки повній перемозі під його керівництвом, здається, що панафриканці зробили правильний вибір, отримавши велику підтримку від інших панафриканських рухів по континенту, що значно прискорило процес перемоги.\n\nЗ цією перемогою, майже закріпленою Популярною Республікою, ясно, що навіть з огляду на цей успіх, є ще багато роботи щодо відновлення. Однак з міжнародною допомогою в Африці, можливо, Конго не забариться відновити свої сили."
 WORLD.18203.a: "Ще одна панафриканська держава..."
 
 WORLD.18204.t: "[Get_newspaper_header]Абверфронт виграє у війнах Конго!"
 WORLD.18204.d: "Сьогодні стан Африки нарешті заспокоївся, оскільки останні постріли в районі Конго стихли. Здається, що після колапсу Райхштату деякі з решток продовжили існування у вигляді Африканер-Абверфронту, держави, що складається з решток військ Хюттіга в регіоні. Хоча фронт спочатку відколовся від Енхайтспакт після заснування Райхштату, здається, що тепер минулі проблеми залишились у минулому, оскільки Ґерманія та фронт відновили свої зв'язки.\n\nЗвісно, інші світові держави обурені цим розвитком подій. Оскільки Конго знову потрапляє до німецької сфери, Японія та Америка залишаються без союзника в регіоні. Оскільки ситуація стабілізується, можна з упевненістю сказати, що Ґерманія повернулася в Африку."
 WORLD.18204.a: "Неспокійний альянс, принаймні."
 
 WORLD.18205.t: "[Get_newspaper_header]Вервагунг виграє у війнах Конго!"
 WORLD.18205.d: "Здається, що важливі інвестиції Німеччини в Конго нарешті дали свої плоди сьогодні, оскільки вся кров, піт та сльози, витрачені на здобуття частини Африки, тепер відплачені. Від жахів Південноафриканської війни, зради з боку Райхштату і його сумного колапсу, здавалося, що всі експедиції Німеччини в Африку приречені на поразку - поки рух, який зрештою зруйнував Райхштат, коаліція бюрократів та генералів, не перемогла всіх суперників у Війні за Конго.\n\nРеакція в Німеччині була неймовірно радісною, оскільки додаткові резерви відправляються в регіон для стабілізації захопленої території. Міжнародне співтовариство здебільшого розчароване, а представники ОВН і Сфери засуджують відновлення Центральної Африки до німецької економічної сфери, але з упевненістю можна сказати, що Ґерманія виграла у Конго."
 WORLD.18205.a: "І ось так, Ґерманія повернулася в Африку!"
 
 WORLD.18206.t: "[Get_newspaper_header]Катанга виграє громадянську війну!"
 WORLD.18206.d: "Новини з Конго сьогодні, оскільки артефакт адміністрації Центральноафриканської та лідер бельгійської еміграції, Жан Шрамме, встановив контроль над Конго. Використовуючи тільки свою корпоративну державу, Катанга змогла подолати навколишні повстання, залишкових німців, що утримувалися в регіоні, без жодної підтримки ззовні. Звісно, їхня перемога не отримала майже ніякої підтримки.\n\nПроте ця поразка для світових держав не є беззаперечною. Як підтвердив сам Жан у своїй промові до всього Конго, він "не дозволить Африці залишитися без впливу на справи світу", оскільки оголосив про своє прагнення укладати торгові угоди з усіма, з ким це можливо. Оскільки наддержави починають відновлювати відносини з колишнім ворогом, мало хто може заперечувати економічні вигоди від співпраці з "Бельгійцем"."
 WORLD.18206.a: "Конго відкрите для бізнесу."
 
 WORLD.18207.t: "[Get_newspaper_header]Касай виграє громадянську війну!"
 WORLD.18207.d: "Реальність дійсно дивніша за вигадки, оскільки Касай, держава в стані непорушного миру з Катангом, схоже, вийшла переможцем у громадянській війні в Конго. Звісно, світові держави були повністю принижені, оскільки теоретики війни залишились збентежені від тактичної майстерності військ Касаю. Багато хто вказує на геніальність у використанні відкритих флангів цих держав, хоча інші звинувачують міжнародних конголезьких вождів у тому, що вони не доклали достатньо зусиль.\n\nОскільки держава негайно взяла на себе завдання відновлення після конфлікту, було давно встановлено, що Касай не має наміру взаємодіяти з наддержавами світу і увійшов у стан економічної ізоляції. Оскільки осуд Конго до ізоляції тепер майже гарантований, наддержави спрямовуються на пошуки нових важелів у решті Африки."
 WORLD.18207.a: "Це найкраще, що світові держави можуть запропонувати?"
 
 WORLD.18208.t: "[Get_newspaper_header]Азенделенд виграє громадянську війну!"
 WORLD.18208.d: "Оскільки басейн Конго нарешті повертається до певного виду миру, очевидно, що результат було вирішено не на користь країни, а конкретної особи: Мобуту Сесе Секо.\n\nКолишній офіцер Центральноафриканського СС, Мобуту був звільнений у 50-х роках за нібито планування повстання разом з іншими офіцерами і командирами, а також за крадіжку військового обладнання. Після свого перевороту в уряді Азенделенду разом зі своїми обвинуваченими співучасниками, мало хто ще називає це теорією змови.\n\nОтримавши вагому підтримку Японії протягом і після Війни в Конго, очікується, що диктатура Мобуту швидко встоїть і заснує свою присутність, якщо нічого іншого."
 WORLD.18208.a: "Ага, аполітичний сильний диктатор."

 WORLD.18209.t: "[Get_newspaper_header]Перемога Федеральної Республіки Конго"
 WORLD.18209.d: "З'явилися новини з Конго, яке було охоплене жорстокою громадянською війною після колапсу Мандату ОВН в Конго. Федеральна Республіка Конго, проголошена залишками старої Конголезької національної партії, що відкололася від Мандату після його краху, вийшла переможною та об'єднала Конго під своїм контролем.\n\nХоча ОВН більше не контролює регіон безпосередньо, багато хто відзначає глибокі зв'язки Федеральної Республіки з ОВН, а також постійну підтримку ОВН під час конфлікту. Декілька міжнародних спостерігачів класифікували це як "новий акт неоколоніалізму", але багато хто просто радий, що конфлікт завершено - і що існує надія, що Конго нарешті буде вільною і правити нею будуть її власні люди."
 WORLD.18209.a: "Час покаже."
 
 ## Angolan Civil War 
 
 WORLD.18201.t: "[Get_newspaper_header]Громадянська війна в Анголі"
 WORLD.18201.d_GRO: "Лише через кілька місяців після краху Великоафриканської Райхсштату тендітний мир в Анголі був порушений. Внутрішні напруження в молодій і нестабільній країні досягли точки кипіння, коли лівоорієнтований робітничий рух PLUAA захопив південну Анголу, після того як лідер Агустіньо Нето засудив чинний уряд.\n\nПрихильники уряду мобілізувалися під прапором ОВН, орієнтуючись на UNITA, і вже вступили в сутички з партизанами, поки насильство поглинає Анголу з дедалі зростаючою швидкістю. Сполучені Штати випустили заяву, в якій закликали до стабільності в країні, що є tacitною підтримкою уряду Савімбі. Очевидно, що майбутнє Анголи висить на волосині, і обидві сторони рівноцінні. Спостерігачі по всьому світу уважно спостерігають, чекаючи, в який бік нахиляться терези - і що їх підштовхне за край."
 WORLD.18201.d_OFN: "Лише через кілька місяців після краху уряду Коаліції ОВН тендітний мир в Анголі був порушений. Внутрішні напруження в молодій і нестабільній країні досягли точки кипіння, коли лівоорієнтований робітничий рух PLUAA захопив південну Анголу, після того як лідер Агустіньо Нето засудив чинний уряд.\n\nПрихильники уряду мобілізувалися під прапором ОВН, орієнтуючись на UNITA, і вже вступили в сутички з партизанами, поки насильство поглинає Анголу з дедалі зростаючою швидкістю. Сполучені Штати випустили заяву, в якій закликали до стабільності в країні, що є tacitною підтримкою уряду Савімбі. Очевидно, що майбутнє Анголи висить на волосині, і обидві сторони рівноцінні. Спостерігачі по всьому світу уважно спостерігають, чекаючи, в який бік нахиляться терези - і що їх підштовхне за край."
 WORLD.18201.a: "Ангола знову горить."
 
 # Malaya ceasefire endings

 WORLD.18210.t: "[Get_newspaper_header]Декларація Все-Малайського Революційного Фронту"
 WORLD.18210.d: "Надійшли новини від нещодавно переможеного залишку UMAJF, Малайської національної визвольної армії. Чін Пенг, її лідер і відомий місцевий революціонер, поклав кінець періоду диктаторського правління надзвичайними указами, щоб створити Все-Малайський революційний фронт.\n\nФронт був утворений як популярний фронт профспілок і лівих по всій Малаї, і має намір мобілізувати популярну підтримку як у власних землях, так і на зруйнованих війною територіях Південної Малаї, що все ще знаходяться під контролем колабораційних сил за підтримки Японії, з метою повалити конкурентний уряд і встановити свою владу над усією Малаєю.\n\nСтурбованість висловлюється в Токіо та Куала-Лумпурі через зростання заворушень та мобілізацію армії Фронту, побоюючись другої війни в Малаї. Ситуація в Малаї знаходиться на нестабільному балансі - тільки час покаже, хто вийде переможцем."
 WORLD.18210.a: "Їхня боротьба марна без нашої підтримки."
 WORLD.18210.b: "Ми будемо захищати наші володіння за будь-яку ціну!"
 WORLD.18210.c: "Чи знову охопить Малаю вогонь революції?"
 WORLD.18210.m: "Свобода може бути досягнута лише нашими власними зусиллями!"

 WORLD.18211.t: "[Get_newspaper_header]Кінець військовому правлінню в Малаї"
 WORLD.18211.d: "Надійшли новини від нещодавно переможеного Аскар Ватанія, залишку UMAJF. Єоп Махідін, відомий генерал і націоналіст, зрештою відмовився від військового правління, щоб дати можливість поверненню Туна Хусейна Онна для відновлення цивільного правління.\n\nХоча в період початкового захоплення хунтами були висловлені сумніви щодо готовності відступити та дотримуватися своїх обіцянок, підйом Хусейна Онна до лідерства після його тривалого вигнання в Республіці Індія погасив будь-які подальші побоювання щодо постійного військового правління в рештках Малаї.\n\nХоча багато хто все ще стурбований загрозою з боку Японії, Хусейн Онн пообіцяв найближчим часом розпочати дипломатичні переговори з південними колабораціоністами, щоб завершити розкол у Малаї та відновити єдність країни - тільки час покаже, чи будуть вони успішними."
 WORLD.18211.a: "Уникаючи світла."
 WORLD.18211.b: "Можливо, можна досягти компромісу."
 WORLD.18211.c: "Чи можна відновити єдність на півострові?"
 WORLD.18211.m: "Наш обов'язок - відновити мир та надію."

 WORLD.18230.t: "[Get_newspaper_header]Реуніфікація Малаї"
 WORLD.18230.d: "Невдача UMAJF у досягненні повної перемоги в Малаї залишила японську підтримувану державу Джохор відокремленою від малайської держави під постійним контролем залишків 25-ї армії, нині очолюваної Такео Куросавою в Сінгапурі. Негайно після війни вважалося, що залишкова держава залишатиметься розділеною ще довго.\n\nЗдається, що контроль Японії над Джохором закінчився, з протестами та заворушеннями, які потрясли Джохор, призвели до кількох сутичок з місцевим населенням і гарнізоном.\n\nВраховуючи непереборну ситуацію, Японія офіційно наказала відкликати всі гарнізони назад у Сінгапур разом з референдумом про реуніфікацію в Джохорі, який був переважно прийнятий на підтримку. З референдумом малайська держава швидко анексувала Джохор відповідно до результатів референдуму, об'єднавши Малаю."
 WORLD.18230.a: "Об'єднаний півострів."

WORLD.30042.t: "[Get_newspaper_header]Єрусалимська конференція"
WORLD.30042.desc: "Здається, що бурхливі події на Близькому Сході після завершення Італо-турецької війни можуть ще призвести до чогось доброго. Єрусалимська конференція, рівна та вільна дипломатична зустріч між єврейським Єшивом, палестинським Фатахом та йорданськими Хашемітами розпочалася, під наглядом теперішнього повстанця Генерал-губернатора, який, схоже, діє за власною ініціативою, керуючи переговорами.\n\nОскільки війна досі свіжим спогадом в умах народів Леванту, спостерігачі з усього світу з нетерпінням чекають, чи можливий мир на Близькому Сході. Можливі рішення включають поділ, федерацію під керівництвом Хашемітів та інші, деякі екстремісти навіть виступають за єдину єврейську чи палестинську державу, що охоплює весь Левант. У будь-якому разі всі сторони сподіваються досягти мирного врегулювання, і весь світ спостерігає з затаєним подихом.\n"
WORLD.30042.a: "Чи це крок до миру?"

WORLD.30043.t: "[Get_newspaper_header]Єрусалимська конференція зазнає краху"
WORLD.30043.desc: "У Леванті звучать барабани війни, оскільки Єрусалимську конференцію було оголошено, за всіма оцінками, повною поразкою. Різні групи Леванту відмовилися йти на компроміс щодо актуальних питань, і серцева Генерал-губернаторка змушена була закрити конференцію, оскільки євреї та араби мобілізуються для війни. Що буде далі, наразі незрозуміло: міжнародні припущення варіюються від посилення повстанської діяльності до повномасштабної війни за регіон.\n\nЄврейська політична сфера була перевернута з ніг на голову, і лідер Іргуна Менахем Бегін відкрито закликав до повалення Лейбористської-Ціоністської влади. Одночасно запальні заклики Джорджа Хабаша до революції почали набирати популярності більше, ніж будь-коли.\n\nУ будь-якому випадку, останній шанс Леванту на мир було втрачено, і без нього дорога попереду стала темною та буремною.\n"
WORLD.30043.a: "Трагедія."

WORLD.30044.t: "[Get_newspaper_header]Гольда Меїр обрана прем'єр-міністром Ізраїлю"
WORLD.30044.desc: "Ізраїльтяни по всій країні святкують сьогодні формування нового уряду, очолюваного новим головою Мапаї - Голдою Меїр. З жорсткою зовнішньою політикою та продовженням політики старої соціал-демократичної Лейбористської Ціоністської партії, включаючи агресивну позицію щодо новоствореного Левантинського Союзу. Прихильники нової прем'єр-міністрки вказують на її захист прав жінок та інші прогресивні ініціативи, тоді як її критики вказують на відсутність готовності співпрацювати з новими арабськими союзниками.\n\nОднак майбутнє Ізраїлю здається світлим, і багато хто в усьому світі сподівається, що «Залізна леді» Ізраїлю принесе нову еру процвітання для єврейського народу."
WORLD.30044.a: "Мати Яструб залишає своє гніздо."

WORLD.30045.t: "[Get_newspaper_header]Шимон Перес обраний прем'єр-міністром Ізраїлю"
WORLD.30045.desc: "Ізраїльтяни по всій країні святкують сьогодні формування нового уряду, очолюваного новим головою Мапаї - Шимоном Пересом. Бажаючи прогресивної, миролюбної платформи та свіжого молодого погляду на питання сьогодення, Перес є представником молодого крила Мапаї, яке набуло сили після виходу на пенсію Давіда Бен-Гуріона.\n\nЗ позицією на користь Левантинського Союзу та за підтримки найкращих та найталановитіших людей країни, багато хто сподівається, що Перес сприятиме новій епосі технологічного процвітання, вільного для всіх у Леванті.\n\nОднак мрія Переса про мир стикається з багатьма викликами та перешкодами, і йому доведеться пройти довгий шлях - але пройти його він обов'язково повинен.\n"
WORLD.30045.a: "Свіже молоде обличчя."

WORLD.30046.t: "[Get_newspaper_header]Оснування Народного фронту звільнення Палестини"
WORLD.30046.desc_LEB: "Революція в Леванті прийняла новий оборот, коли голова Харакійїну Джордж Хабаш оголосив про відновлення партії у вигляді Народного фронту звільнення Палестини, самоназваної 'широкою соціялістичною партією' в дусі старої Палестинської комуністичної партії. На папері ПФЗП буде представляти «всіх народів Палестини, від євреїв до арабів і друзів», намагаючись створити «справжню демократичну державу» на Близькому Сході. Однак дискримінація, зокрема щодо євреїв, продовжує бути найбільшою критикою уряду Хабаша. Крім того, в Трансіорданії та Лівані були засновані супутні 'республіки-сестри', що створює невеликий, але потужний комуністичний блок у регіоні.\n\nГолова Хабаш показав світу свою мрію про Палестину - і коли міжнародна спільнота знову погляне на схід, ще неясно, чи здійсниться ця мрія.\n"
WORLD.30046.desc_noLEB: "Революція в Леванті прийняла новий оборот, коли голова Харакійїну Джордж Хабаш оголосив про відновлення партії у вигляді Народного фронту звільнення Палестини, самоназваної 'широкою соціялістичною партією' в дусі старої Палестинської комуністичної партії. На папері ПФЗП буде представляти «всіх народів Палестини, від євреїв до арабів і друзів», намагаючись створити «справжню демократичну державу» на Близькому Сході. Однак дискримінація, зокрема щодо євреїв, продовжує бути найбільшою критикою уряду Хабаша. Крім того, була заснована супутня 'республіка-сестра' в Трансіорданії, створюючи невеликий, але зростаючий комуністичний блок у регіоні.\n\nГолова Хабаш показав світу свою мрію про Палестину - і коли міжнародна спільнота знову погляне на схід, ще неясно, чи здійсниться ця мрія.\n"
WORLD.30046.a: "Чи принесе це мир?"

WORLD.30047.t: "[Get_newspaper_header]Оголошення Арабської Народної Республіки"
WORLD.30047.desc: "Вітри революції та панарабізму продовжують розповсюджуватися Близьким Сходом з оголошенням сьогодні Арабської Народної Республіки; комуністичної, панарабістської федеративної держави, присвяченої «звільненню арабської нації від кайданів колоніалізму, де б вони не були». Голова Джордж Хабаш, АНР майже відразу почала звертатися до решти арабського світу, фінансуючи панарабістські та соціялістичні рухи по всьому регіону. Хоча мрія панарабізму є популярною в державах, що складають АНР, таких як Палестина, Йорданія та Ліван, спротив з боку реакціонерів і залишків єврейської громади в Палестині триває, і багато міжнародних спостерігачів критикують державу за її авторитаризм.\n\nНезалежно від цього, нова зірка сходить над пустелею, і вона сяє яскраво червоним."
WORLD.30047.a: "Арабська нація стоїть міцно."

WORLD.30048.t: "[Get_newspaper_header]Ізраїль анексує Трансіорданію"
WORLD.30048.desc: "Прем'єр-міністр Ізраїлю Менахем Бегін оголосив сьогодні, що відповідно до його ідеалів ревізіоністського сіонізму, частини Трансіорданії будуть анексовані до Держави Ізраїль. Міжнародні коментатори відзначають сильну підтримку ревізіоністського сіонізму серед ізраїльського уряду. Це створює парадокс в межах Держави Ізраїль; для єврейських громадян Ізраїль є процвітаючою ліберально-демократичною державою, повною політичних і економічних свобод. Для арабських громадян Ізраїль є мало чим іншим, як окупаційною силою, що накладає умови, схожі на сегрегацію і нагадують колоніальні території.\n\nНезалежно від правди, нова хвиля насильства спалахнула в анексованій Трансіорданії, і здається, що конфлікт не завершиться найближчим часом."
WORLD.30048.a: "Мрія Джаботинського наближається до реальності."

WORLD.30049.t: "[Get_newspaper_header]Йорданія підписує мирні угоди з Ізраїлем"
WORLD.30049.desc: "Під час дуже публічної зустрічі в Єрусалимі король Йорданії офіційно погодився на мирні угоди з Державою Ізраїль.\n\nЦя новина стала величезним шоком для багатьох у арабському таборі, «повна зрада» і «несправедливе та боягузливе капітулянство» перед ворогом. У Аммані спалахнули заворушення на знак протесту проти миру, а палестинський лідер у вигнанні Ясір Арафат навіть заявив, що «Хашемітів потрібно придушити».\n\nУ ізраїльському таборі, різко позитивна реакція: прем'єр-міністр Менахем Бегін отримав похвалу від усіх політичних партій Ізраїлю, крім своєї власної, де праві яструби засудили угоду як зраду Великого Ізраїлю. Незважаючи на це, нова політична партія Бегіна Лікуд змогла створити двопартійну систему з лівою Маарах, і здається, що прем'єр-міністр - на відміну від своєї мирної угоди - дійсно залишиться на посаді."
WORLD.30049.a: "Початок нової ери?"

WORLD.30050.t: "[Get_newspaper_header]Завершення переговорів Туркеського Кенесу"
WORLD.30050.desc: "Після нелегкого процесу переговорів щодо об'єднання Туркеського Кенесу здається, що зусилля з об'єднання регіону нарешті досягли кульмінації, принаймні в деякому сенсі. Після тривалих дебатів країни Центральної Азії погодилися об'єднатися в військовий альянс, вторглися на територію Легіону Туркестану і перемогли. Після цієї військової перемоги, яка стабілізувала регіон, представник Центральноазійського альянсу заявив, що вони мають намір повернути території, втрачені в результаті Другої світової війни. Оскільки Іран і Афганістан захопили території під час цього періоду, багато хто побоюється, що відкритий конфлікт може спалахнути найближчим часом, при цьому іранські, афганські, японські та німецькі представники засуджують ці дії, в той час як уряд Туреччини здається дуже задоволений цими обставинами і вже шукає торгові угоди з новим альянсом."
WORLD.30050.a: "Дипломатія, здається, тепер так легко йде на спад..."

WORLD.30051.t: "[Get_newspaper_header]Завершення переговорів Туркеського Кенесу"
WORLD.30051.desc: "Ще новини з Центральної Азії сьогодні: переговори щодо об'єднання більшості центральноазійських держав обвалилися після загибелі кількох дипломатів з відповідних держав. Оскільки переговори фактично зруйнувалися, здається, що Легіон Туркестану, союзник Німеччини, мобілізується для втручання.\n\nМіжнародна реакція на ці події розвивається, більш-менш очікувано. Пакт без сюрпризів святкує цю перемогу, називаючи її "перемогою центральноазійської самовизначеності", хоча уряд Туреччини та Сфера спростовують це, заявляючи, що це "смерть дипломатії в регіоні". Незалежно від реакції міжнародної спільноти, майбутнє регіону здається похмурим, але лише час покаже, як ці напруги ескалюватимуться або вщухатимуть."
WORLD.30051.a: "Майбутнє Центральної Азії виглядає занедбаним, але ще не мертвим."

WORLD.30052.t: "[Get_newspaper_header]Завершення переговорів Туркеського Кенесу"
WORLD.30052.desc: "Трагедія спіткала Центральну Азію, оскільки після низки вбивств та нападів на центральну владу в регіоні, країни майже повністю занурилися в тотальний анархії. Біженці тікають у Казахстан або Іран, ходять чутки, що іноземне втручання спричинило смерть майже всіх державних лідерів, і переговори з об'єднання фактично розвалилися.\n\nЗокрема, Японія та Афганістан піддаються звинуваченням у тому, що спричинили цю анархію, хоча уряди цих держав заперечують будь-яку участь. Пакт, зокрема, критикує гіпокрисію Сфери і робить заяви, що "краще, аби поважали самовизначення народів Центральної Азії". Незважаючи на іноземну критику, уряди регіонів залишаються знищеними і майже напевно залишатимуться такими протягом найближчого майбутнього."
WORLD.30052.a: "І ось так, нафта знову тече."

WORLD.30053.t: "[Get_newspaper_header]Завершення переговорів Туркеського Кенесу"
WORLD.30053.desc: "Конференція Туркеського Кенесу в Центральній Азії завершилася, не принесши переваги жодній стороні - ані тій, що підтримується Туреччиною, ані тій, що підтримується Єдиноборчим пактом. Спочатку конференція була задумана як зустріч різних центральноазійських країн для обговорення різних конфліктів (кордонні, етнічні, дипломатичні), але вона швидко стала майданчиком для дипломатичних спарингів між Турецькою Республікою та Великою Ґерманською Райхом.\n\nЄ повідомлення про японське втручання та вплив у рамках конференції, але ці звинувачення залишаються непідтвердженими і рішуче спростовані Токіо. Конференція завершилася мирно, хоча без значних дипломатичних кроків. Дипломати з Туреччини та Райху висловили розчарування таким результатом, в той час як японські дипломати висловили схвалення."
WORLD.30053.a: "Що буде далі для степів?"

WORLD.30054.t: "[Get_newspaper_header]Майвандвал призначений прем'єр-міністром Афганістану"
WORLD.30054.desc: "Після скликання Лоя Джирги для розробки нової конституції минулого року, парламентські вибори 1965 року в Афганістані передбачувано закінчилися перемогою місцевих землевласників та кандидатів-фаворитів, при цьому чинний прем'єр-міністр Юсуф Хан був переобраний. Однак його затвердження в уряді було заблоковано студентськими протестами маоїстів, що призвело до того, що армія відкрила вогонь по протестувальниках, вбивши трьох.\n\nПісля хаосу Захір Шах вирішив призначити Мухаммада Хашима Майвандвала, засновника Хізб-е Мутаракі Демократ-е Афганістан, який виступає за соціялізм, здатний розвиватися під монархією, збільшення демократії та реформи в економічному секторі. Його відомі проконсервативні настрої викликали прогнози щодо нового курсу афганської дипломатії, який буде орієнтований на США, а не Німеччину чи Японію."
WORLD.30054.a: "Соціялізм у феодальній країні?"

WORLD.30055.t: "[Get_newspaper_header]Фарханг призначений прем'єр-міністром Афганістану"
WORLD.30055.desc: "Після скликання Лоя Джирги для розробки нової конституції минулого року, парламентські вибори 1965 року в Афганістані передбачувано закінчилися перемогою місцевих землевласників та кандидатів-фаворитів, при цьому чинний прем'єр-міністр Юсуф Хан був переобраний. Однак його затвердження в уряді було заблоковано студентськими протестами маоїстів, що призвело до того, що армія відкрила вогонь по протестувальниках, вбивши трьох.\n\nПісля хаосу Захір Шах вирішив призначити Міра Мохаммада Седіка Фарханга, лівого реформіста і одного з авторів нової конституції. Також відомий своїми лівими тенденціями та ув'язненням за створення ліберально-реформістського руху в 1949 році, Фарханг висловив бажання зламати феодальну систему, яка в значній мірі все ще домінує в Афганістані, та відновити економічне зростання."
WORLD.30055.a: "Написати ще п'ять століть історії?"

WORLD.30056.t: "[Get_newspaper_header]Фархад призначений прем'єр-міністром Афганістану"
WORLD.30056.desc: "Після скликання Лоя Джирги для розробки нової конституції минулого року, парламентські вибори 1965 року в Афганістані передбачувано закінчилися перемогою місцевих землевласників та кандидатів-фаворитів, при цьому чинний прем'єр-міністр Юсуф Хан був переобраний. Однак його затвердження в уряді було заблоковано студентськими протестами маоїстів, що призвело до того, що армія відкрила вогонь по протестувальниках, вбивши трьох.\n\nПісля хаосу Захір Шах вирішив призначити Гуляма Мухаммада Фархада, колишнього мера Кабула та засновника Толенпаль Вулусвак Гунд. Відомий своїми бізнес-зв'язками з Німеччиною та ідеологічним натхненням, він збільшив свою риторику про Паштуністан, закликаючи до паштунізації багатонаціональної афганської держави та впровадження модерністських і соціал-демократичних політик."
WORLD.30056.a: "Поміркований, національний, прогресивний та натхнений Німеччиною?"

WORLD.30057.t: "[Get_newspaper_header]Бадакші призначений прем'єр-міністром Афганістану"
WORLD.30057.desc: "Шокований економічною кризою та зовнішніми загрозами, афганський політичний ландшафт зазнав великомасштабної дестабілізації та радикалізації після виходу призначеного прем'єр-міністра в 1967 році. Поки Міністр закордонних справ Мохаммад Нур Ахмад Етемаді був призначений новим прем'єр-міністром, він більшість часу в офісі проводив, вирішуючи складну зовнішню політичну ситуацію та скасовуючи непопулярні політики.\n\nПісля виборів, які вважалися голосуванням за довіру до нього, здається, що він втратив довіру Захіра Шаха, який призначив Тахіра Бадакші - представника таджицької національності - новим прем'єр-міністром. Відомий своєю заснуванням Сазман-е Інкилаб Захматкешан Афганістан та опозицією до того, що вважалося "національним гнобленням" пащтунів, його призначення розглядається як жест на підтримку незадоволених меншин країни."
WORLD.30057.a: "Ліквідація національного гноблення?"

WORLD.30058.t: "[Get_newspaper_header]Етемаді знову призначений прем'єр-міністром Афганістану"
WORLD.30058.desc: "Шокований економічною кризою та зовнішніми загрозами, афганський політичний ландшафт зазнав великомасштабної дестабілізації та радикалізації після виходу призначеного прем'єр-міністра в 1967 році. Поки Міністр закордонних справ Мохаммад Нур Ахмад Етемаді був призначений новим прем'єр-міністром, він більшість часу в офісі проводив, вирішуючи складну зовнішню політичну ситуацію та скасовуючи непопулярні політики.\n\nПісля виборів, які вважалися голосуванням за довіру до нього, здається, що він отримав продовжену довіру Захіра Шаха, який знову призначив його прем'єр-міністром. З новим мандатом він пообіцяв продовжити боротьбу з економічною кризою, одночасно реалізуючи ідеї Майвандвала щодо соціялізму під монархічною системою в Афганістані."
WORLD.30058.a: "Ліки від економічної хвороби?"

WORLD.30065.t: "[Get_newspaper_header]Мохаммеді призначений прем'єр-міністром Афганістану"
WORLD.30065.desc: "Шокований економічною кризою та зовнішніми загрозами, афганський політичний ландшафт зазнав великомасштабної дестабілізації та радикалізації після виходу призначеного прем'єр-міністра в 1967 році. Поки Міністр закордонних справ Мохаммад Нур Ахмад Етемаді був призначений новим прем'єр-міністром, він більшість часу в офісі проводив, вирішуючи складну зовнішню політичну ситуацію та скасовуючи непопулярні політики.\n\nПісля виборів, які вважалися голосуванням за довіру до нього, здається, що він втратив довіру Захіра Шаха, який призначив Мохаммада Набі Мохаммеді прем'єр-міністром. Обраний до парламенту під платформою боротьби з марксистським впливом, його призначення означає новий поворот для світського держави - якого він не має наміру зберігати."
WORLD.30065.a: "Чи йде світськість на вихід?"

WORLD.30060.t: "[Get_newspaper_header]Національна єдність Афганістану"
WORLD.30060.desc: "Зростаючи соціальними напруженнями, етнічними та трудовими хвилюваннями і загальною неефективністю уряду Кабулу, ситуація досягла апогею з масовим голодом 1971 року через надмірні снігопади на Гіндукуші, де відсутність реагування призвела до багатьох смертей. Зростаючи невдоволення серед населення та неможливість Волеcі Джирги вирішити конфлікти додали пального до вогню, оскільки правління Захіра Шаха стикалося з найскладнішими моментами.\n\nПрем'єр-міністр Муса Шафік оголосив свою відставку уряду, заявивши про втрату довіри Захіра Шаха до нього. Його було замінено одним із членів Волеці Джирги і близьким радником Захіра Шаха, Халілулахом Халілі, який одразу ж оголосив про розпуск усіх інших партій на користь монархічної Хезб-е Іттахад-е Меллі."
WORLD.30060.a: "Фасад парламентської демократії зник."

WORLD.30061.t: "[Get_newspaper_header]Нова демократія Афганістану"
WORLD.30061.desc: "Зростаючи соціальними напруженнями, етнічними та трудовими хвилюваннями і загальною неефективністю уряду Кабулу, ситуація досягла апогею з масовим голодом 1971 року через надмірні снігопади на Гіндукуші, де відсутність реагування призвела до багатьох смертей. Зростаючи невдоволення серед населення та неможливість Волеці Джирги вирішити конфлікти додали пального до вогню, оскільки правління Захіра Шаха стикалося з найскладнішими моментами.\n\nПрем'єр-міністр Муса Шафік оголосив свою відставку уряду, заявивши про відмову короля від серйозних реформ для виправлення системи. Масовий мітинг у Кабулі, що вимагав політичних реформ, змусив Захіра Шаха підписати Закон про політичні партії, а також знову призначити Мусу Шафіка прем'єр-міністром за підтримки всіх інших партій Волеці Джирги."
WORLD.30061.a: "Партії виграли в довгому бою."

WORLD.30062.t: "[Get_newspaper_header]Республіканський переворот в Афганістані"
WORLD.30062.desc: "Зростаючи соціальними напруженнями, етнічними та трудовими хвилюваннями і загальною неефективністю уряду Кабулу, ситуація досягла апогею з масовим голодом 1971 року через надмірні снігопади на Гіндукуші, де відсутність реагування призвела до багатьох смертей. Зростаючи невдоволення серед населення та неможливість Волеці Джирги вирішити конфлікти додали пального до вогню, оскільки правління Захіра Шаха стикалося з найскладнішими моментами.\n\nПрем'єр-міністр Муса Шафік оголосив свою відставку уряду, заявивши про втрату довіри Захіра Шаха до нього. Це було супроводжено переворотом республіканських військових офіцерів на чолі з Даудом Ханом, який заявив, що деградація політичного контролю змусила його вжити заходів. Захір Шах, за повідомленнями, був вигнаний до Сполучених Штатів Америки."
WORLD.30062.a: "Віковічна історія стерта благородним."

WORLD.30063.t: "[Get_newspaper_header]Маоїстська революція в Афганістані"
WORLD.30063.desc: "Зростаючи соціальними напруженнями, етнічними та трудовими хвилюваннями і загальною неефективністю уряду Кабулу, ситуація досягла апогею з масовим голодом 1971 року через надмірні снігопади на Гіндукуші, де відсутність реагування призвела до багатьох смертей. Зростаючи невдоволення серед населення та неможливість Волеці Джирги вирішити конфлікти додали пального до вогню, оскільки правління Захіра Шаха стикалося з найскладнішими моментами.\n\nЗаколотні етнічні меншини в Хазараджаті та таджицьких районах розпочали загальне повстання, вимагаючи рівномірного розподілу розвитку та інфраструктурної допомоги. Це було супроводжено народним повстанням у Кабулі, яке очолили озброєні бойовики на чолі з Акрамом Ярі, які оголосили про створення "нової демократичної" влади. Захір Шах, за повідомленнями, був вигнаний до Сполучених Штатів Америки."
WORLD.30063.a: "Кінець феодалізму?"

WORLD.30064.t: "[Get_newspaper_header]Ісламістська революція в Афганістані"
WORLD.30064.desc: "Зростаючи соціальними напруженнями, етнічними та трудовими хвилюваннями і загальною неефективністю уряду Кабулу, ситуація досягла апогею з масовим голодом 1971 року через надмірні снігопади на Гіндукуші, де відсутність реагування призвела до багатьох смертей. Зростаючи невдоволення серед населення та неможливість Волеці Джирги вирішити конфлікти додали пального до вогню, оскільки правління Захіра Шаха стикалося з найскладнішими моментами.\n\nЗростаючи сильні ісламістські сили, які терпіли під світським правлінням протягом останнього десятиліття, почали повстання в долині Панджширу. Це було супроводжено народним повстанням ісламістів, очолюваних Бурнахуддіном Раббані, які оголосили про створення Ісламського Емірату. Захір Шах, за повідомленнями, був вигнаний до Сполучених Штатів Америки."
WORLD.30064.a: "Сили релігії не можна стримати."

WORLD.30066.t: "[Get_newspaper_header]Республіканський переворот в Афганістані"
WORLD.30066.desc: "Зростаючи соціальними напруженнями, етнічними та трудовими хвилюваннями і загальною неефективністю уряду Кабулу, ситуація досягла апогею з масовим голодом 1971 року через надмірні снігопади на Гіндукуші, де відсутність реагування призвела до багатьох смертей. Зростаючи невдоволення серед населення та неможливість Волеці Джирги вирішити конфлікти додали пального до вогню, оскільки правління Захіра Шаха стикалося з найскладнішими моментами.\n\nПрем'єр-міністр Муса Шафік оголосив свою відставку уряду, заявивши про втрату довіри Захіра Шаха до нього. Це було супроводжено переворотом республіканських військових офіцерів, навчальних у КМТ, на чолі з Хафізуллою Аміном, який оголосив нейтральний республіканський уряд під Хезб-е Меллі-є Афганістан. Захір Шах, за повідомленнями, був вигнаний до Сполучених Штатів Америки."
WORLD.30066.a: "Дзеркало світу."

### NEW INDIA + AZAD HIND ###

WORLD.30998.t: "[Get_newspaper_header]Помер індійський прем'єр-міністр Джавахарлал Неру"
WORLD.30998.desc: "Республіка Індія оплакує раптову смерть їхнього довготривалого прем'єр-міністра Джавахарлала Неру, оголошену сьогодні. Він здобув популярність за лідерство Індії під час здобуття незалежності, але його критикують за втрату NWFP та Східної Індії.\n\nМіжнародні висловлювання співчуття надходять, але одночасно уряд Азад Хінду залишається стриманим у своїй реакції, запропонувавши просту заяву про визнання його смерті. За інструкціями покійного Неру, В.К. Крішна Менон був офіційно призначений новим прем'єр-міністром Республіки Індія та лідером Індійського національного конгресу - ліворадикальним націоналістом, який очікується, що вживе більш жорстких заходів для повернення Сходу - будь-яким шляхом."
WORLD.30998.a: "Прихід до рахунку наближається."

WORLD.31000.t: "[Get_newspaper_header]Початок конференції Південноазіатського економічного союзу"
WORLD.31000.desc: "Сьогодні почалася конференція Південноазіатського економічного союзу, з явною метою узгодження економік двох Індій до майбутньої інтеграції, оскільки В.К. Крішна Менон дотримався своєї обіцянки працювати над наближенням двох Індій дипломатично.\n\nНа обох Індіях існує одна спільна відчуття: надія. Мільйони індійців у двох державах радіють тому, що те, що могло б бути неминучою і жахливою війною за возз'єднання, було відвернуто через дипломатію та добру волю. В той час як наддержави з обережністю спостерігають за подіями, високопосадові чиновники з обох Індій - включаючи Менона і Босе - зустрінуться в Канпурі для переговорів і визначать основні політичні умови для зменшення розриву між ресурсно багатою Республікою Індія на заході та важко мілітаризованою економікою Вільної Індії на сході."
WORLD.31000.a: "Розумна дискусія? Куди поділися старомодні битви?"

WORLD.31001.t: "[Get_newspaper_header]Замах на Субхаса Чандру Босе!"
WORLD.31001.desc: "У шокуючому повороті подій з небезпечних земель Індійського субконтиненту, президент уряду Вільної Індії Субхас Чандра Босе був поранений у результаті невдалого замаху під час Південноазіатської економічної конференції. Причина цього невдалого вбивства залишається загадкою, але його наслідки для мирного процесу між двома урядами стали катастрофічними.\n\nЗ нестандартною непрацездатністю президента Босе уряд Вільної Індії вийшов з конференції Південноазіатського економічного союзу, збивши перший камінь на шляху до останньої надії на мирне об'єднання Індії, і ще більше підштовхнувши уряд Менона до ймовірної відставки через вотум недовіри. Оскільки мир став неможливим варіантом, здається, що єдиним способом повернути обидві Індії разом залишилася війна, як спостерігає світ з тривогою."
WORLD.31001.a: "Вбивство творить історію."

WORLD.31002.desc: "Рано в холодний, туманний ранок 15 квітня самотня курка наблизилась до Субхаса Чандри Босе, коли він вийшов з літака, який привіз його через сильно мілітаризований кордон, що розділяє дві Індії. Два оглушливі крики порушили ранкову тишу, коли нападник завдав два чітких удари в підборіддя та обличчя лідера, перед тим, як втекти на найближчому літаку, залишивши тільки прострочені купони. Один із репортерів на місці написав сьогодні: "Якщо кров, що зібралася на цьому летовищі, є передвісником крові, яка незабаром заповнить кожен куточок Індії - якщо лише не владнають холодні голови."\nВчора Східна Індія вийшла з конференції - тепер здається, що уряд Менона розвалиться через вотум недовіри. Оскільки остання надія на мирне об'єднання Індії зникла, здається, що єдиний шлях вперед тепер - війна. Коли вона настане, невідомо, але одне тепер точно..."

WORLD.31003.t: "[Get_newspaper_header]Менон йде у відставку; Шастрі стає прем'єр-міністром Індії"
WORLD.31003.desc: "Після провалу конференції в Лакнау щодо мирного вирішення об'єднання Індії, прем'єр-міністр В.К. Крішна Менон пішов у відставку, передавши владу Лалу Бахадуру Шастрі, фігурі Неру, лівій частині партії. Міжнародні спостерігачі вважають, що Менон змушений був подати у відставку через свою роль в організації конференції в Лакнау, яку засудили після її розвалу.\n\nШастрі буде призначений виконати решту терміну Менона на посаді прем'єр-міністра, оскільки ймовірність проведення дострокових виборів зменшується через суперечливі обставини після краху конференції. Міжнародні спостерігачі прогнозують, що його термін буде зосереджено на боротьбі з підвищеною ворожістю з боку сил Азад Хінду, поряд з намаганням відновити довіру громадськості до INC до наступних виборів."
WORLD.31003.a: "Успіх має багато батьків, поразка має тільки одного."

WORLD.31004.t: "[Get_newspaper_header]Субхас Чандра Босе не змогла одужати"
WORLD.31004.desc: "Новина, сприйнята з жахом громадянами уряду Азад Хінду, і з полегшенням у Республіці, свідчить, що президент Субхас Чандра Босе не одужає від коми найближчим часом. У зв'язку з цими новинами, Недям Рагаван, колишній міністр фінансів, був оголошений президентом, і його основним завданням очікується просте підготовлення до неминучої війни з Республікою Індія.\n\nВідомий технократ, Рагаван очолює різноманітну коаліцію своїх колег-економістів та лівих союзників з профспілок в партії. Невідомо, як він зможе примирити елементи своєї коаліції - або примирити японський бізнес з лівими елементами партії."
WORLD.31004.a: "Що вони зроблять без їхнього Нета?"

WORLD.31005.t: "[Get_newspaper_header]Ліла Рой стає лідером Східної Індії"
WORLD.31005.desc: "Ліла Рой, прихильниця центристського блоку партії та одна з найближчих соратниць Босе, була обрана новим лідером Хіндустан Сам'явді Санґхи - і, отже, лідером всього народу.\n\nРой була однією з перших членів Хіндустан Сам'явді Санґхи та зіграла важливу роль у полегшенні переходу до цивільного управління після того, як INA вступила на територію Східної Індії. Як важлива лідерка жіночого руху, соціальні реформи, ймовірно, стануть пріоритетом нового уряду. Її головний прихильник, Р.С. Руйкар, був призначений міністром внутрішніх справ, а також віце-президентом ХСС - ймовірно, він також стане ключовою фігурою в уряді.\n\nВибір жінки на найвищу посаду був сприйнятий святкуваннями по всій країні та інтересом з боку міжнародних сторін. Однак час покаже, наскільки далеко це може зайти."
WORLD.31005.a: "Кажуть, що за кожним великим чоловіком стоїть жінка - здається, цього разу навпаки."

WORLD.31006.t: "[Get_newspaper_header]Шіл Бхадра Ягі стає лідером Східної Індії"
WORLD.31006.desc: "Шіл Бхадра Ягі, один із перших членів Хіндустан Сам'явді Санґхи та рішучий захисник прав робітників і селян, був обраний новим лідером Хіндустан Сам'явді Санґхи - і, отже, лідером всього народу.\nЯк лідер самого лівого блоку в ХСС, Ягі вже дав зрозуміти своє бажання рухати країну ближче до комуністичних і соціялістичних аспектів руху. Підтримує його капітан Лакшмі Сагал, одна з найбільш видатних лідерок у всій країні - незалежно від того, з якого боку кордону поглянути - та ветеранка знаменитого жіночого полку INA.\nЗначний лівий поворот вже привернув велику увагу, зокрема серед індійської діаспори в Малаї та Сйонані - ранні фінансові спонсори руху також активно підтримують приватний бізнес у Вільній Індії."
WORLD.31006.a: "Світ спостерігає за Колкатою з затриманим подихом - як позитивно, так і негативно."

WORLD.31007.t: "[Get_newspaper_header]Яшвантрао Чаван стає прем'єр-міністром Індії"
WORLD.31007.desc: "У досить передбачуваній перемозі INC повернулася до влади після Індійської війни за об'єднання. Після боротьби з фракціоналізмом основний INC підтвердив свою ліву орієнтацію під керівництвом Яшвантрао Чавана, нового прем'єр-міністра Індії. Чаван, відомий лівий діяч, був піднятий на посаду завдяки тісним зв'язкам з аграрними популістськими рухами.\n\nПід його прем'єрством економічний статус-кво Індії, ймовірно, залишиться незмінним. Міжнародні спостерігачі прогнозують, що основні цілі його терміну будуть полягати в успішному інтегруванні Сходу - виснаженого після війни та фінансово злиденного після краху планової економіки - в економічну ортодоксію Індії, відновлюючи стабільність у країні."
WORLD.31007.a: "Після стільки змін, стабільність має заспокоюючий ефект."

WORLD.31008.t: "[Get_newspaper_header]К. Раджагопалачарі стає прем'єр-міністром Індії"
WORLD.31008.desc: "Попри їхнє правління під час Індійської війни за возз'єднання, індійці явно втомились від домінування Індійського національного конгресу, і ліберальна партія Сватантра піднялася на їх місце у широку коаліцію з кількома регіональними альянсами. Рішуче протистоячи центральному плануванню та соціялізму своїх нерувських супротивників, уряд Сватанти обіцяє економічно лібералізувати весь субконтинент, при цьому втішаючи робітничий клас обіцянками трудових реформ.\n\nАналізатори зазначили, що незважаючи на популярність серед іноземних інвесторів, партія Сватантра стикається з новими внутрішніми викликами - їхні регіональні альянси є крихкими, і жорстка відповідь робітничого класу є гарантованою, якщо занадто багато політик INC буде скасовано. Чи зможе Сватантра зберегти стабільність уряду, поки не відомо, але їхнє піднесення до влади позначає драматичний зсув в індійській політиці та нову главу в економічній історії країни."
WORLD.31008.a: "Світлий новий вітер для Індії... чи миттєва ілюзія."

WORLD.31009.t: "[Get_newspaper_header]Морарджі Десай стає прем'єр-міністром Індії"
WORLD.31009.desc: "Зміни прийшли в Індію, і не лише на карті. Переможена у забезпеченні падіння Азад Хінду та національного возз'єднання, Індійська національна конгресія повернулась до влади, але вже не в тій самій формі. Вона сильно нахилилася вправо, прийнявши певний соціальний консерватизм та економічний лібералізм, все це під керівництвом Морарджі Десаї, колишнього міністра фінансів, а тепер - нового прем'єр-міністра.\n\nОчікується, що адміністрація Десаї продовжить цей значний зсув. Замість того, щоб зосереджуватися на підтримці або розширенні економічного контролю, очікується, що Десай буде працювати над зменшенням регулювання, перераспределенням земель та соціальними виплатами. Багато інвесторів дивляться на ці події з обережним оптимізмом, але багато спостерігачів висловили занепокоєння через зростання ісламофобських настроїв після масових анти-мусульманських заворушень по всій країні."
WORLD.31009.a: "Півострів відкривається для світу - але закривається для себе."

WORLD.31010.t: "[Get_newspaper_header]Індійська війна за об'єднання розгортається"
WORLD.31010.desc: "Те, що почалося як черговий прикордонний конфлікт між Республікою Індія та Азад Хіндом, переросло у повномасштабну війну між двома суперницькими урядами. Більшість вважала цей конфлікт неминучим після провалу мирних переговорів та спроби вбивства Субхаса Чандри Босе, проте міжнародні спостерігачі відзначили своє здивування, як швидко Індія занурилася у війну після провального мирного конференції.\n\nЗі збільшенням інтенсивності бойових дій, аналітики підозрюють, що це не буде простою сутичкою, а боротьбою до гіркого возз'єднання. Японія вже надіслала підтримку "антиімперіалістичним силам" Азад Хінду, в той час як ОВН надає схожу допомогу Республіці, а Ґерманія залишається мовчазною на даний момент.\n\nЗараз світ тримається на волосині, оскільки Холодна війна вступає в нову еру."
WORLD.31010.a: "Мільйони чоловіків відправлено на могилу через егоїзм інших."
WORLD.31010.b: "Можливість, що чекає на свій час?"
WORLD.31010.c: "Демократія не помре тихо."
WORLD.31010.d: "Обов'язок вимагає виконання національної долі."

WORLD.31011.t: "[Get_newspaper_header]Республіка Індія перемагає в громадянській війні"
WORLD.31011.desc: "Коли республіканські війська марширують переможно по Колкаті, залишки уряду Азад Хінду оголосили про свою капітуляцію, закріпивши Республіку як єдину легітимну Індію. Перемога сталася після попереднього успіху Республіки у придушенні пакистанського руху, залишивши її єдиною країною на субконтиненті.\n\nУ своїй першій промові після перемоги прем'єр-міністр пообіцяв об'єднати націю, чому тисячі людей відповіли радісними вигуками. ОВН привітала Республіку з перемогою, пообіцявши свою підтримку в тривалій реконструкції країни, в той час як Японія відповіла холодною тишею на втрату свого впливу в субконтиненті. Місцезнаходження скинутого лідера Субхаса Чандри Босе досі невідоме."
WORLD.31011.a: "Нація зібрана ціною крові мільйонів."
WORLD.31011.b: "Нікчемні слова американської маріонетки."
WORLD.31011.c: "Свобода над фашизмом!"
WORLD.31011.d: "Золота можливість... втрачена."

WORLD.31012.t: "[Get_newspaper_header]Азад Хінд перемагає в громадянській війні"
WORLD.31012.desc: "З Новим Делі, міцно під контролем сил Азад Хінду, прем'єр-міністр розпустив свій уряд і наказав армії Республіки припинити вогонь, офіційно капітулюючи перед силами Азад Хінду. Проголосивши Республіку Хіндустан, [AZH.GetLeader] вніс значні зміни для субконтиненту, оскільки Сфера значно розширюється.\n\nПід час своєї першої промови після об'єднання, [AZH.GetLeader] пообіцяв ввести Індію в нову еру антиімперіалізму, при цьому зберігаючи боротьбу з впливом Заходу і колоніалізму. Проте, більшість його промови була присвячена пакистанському руху, чия боротьба продовжується на заході країни. Америка засудила його як тирана, нещодавно випустивши заяви дипломатичної підтримки Пакистану, оскільки міжнародні спостерігачі вважають це наступним полем битви в Холодній війні."
WORLD.31012.a: "Нація зібрана ціною крові мільйонів."
WORLD.31012.b: "Пакистан має вистояти."
WORLD.31012.c: "Свобода все ще існує в одній частині субконтиненту."
WORLD.31012.d: "J'ai Hind!"

WORLD.31013.t: "[Get_newspaper_header]Яшвантрао Чаван переобраний прем'єр-міністром Індії"
WORLD.31013.desc: "Після п'яти років урядування народ Індії надав прем'єр-міністру Яшвантрао Чавану новий мандат на правління після останніх виборів, надавши йому комфортну більшість для зміцнення і збереження поточної політики надання повноважень нижчому селянству і збільшення земельної реформи.\n\nПрогнозується, що Чаван використає свій новий термін для початку відновлення прав на Бенгал, яка управлялася під військовим правлінням з часу закінчення Індійської війни за об'єднання, і, сподіваємось, на завершення найбільш руйнівної глави в нещодавній історії субконтиненту. Ця остання перемога також продовжує укріплювати статус-кво Неру, який існує з того часу, як Індія стала незалежною, і деякі замислюються, чи коли-небудь їхня країна вийде з довгої тіні, яку наклав Неру та його політика."
WORLD.31013.a: "Здається, що Неру житиме вічно."

WORLD.31014.t: "[Get_newspaper_header]Морарджі Десай стає прем'єр-міністром Індії"
WORLD.31014.desc: "Як і очікувалося, Індійська національна конгресія перемогла на виборах 1972 року, але мрії Неру залишилися позаду, оскільки партія відмовилася від соціялізму і прийняла консерватизм Морарджі Десаї та правий фланг партії. Яшвантрао Чаван, якому не вдалося відповідати успіхам свого популярного попередника Лала Бахадура Шастрі, тепер перебуває в нерелевантності. Можливо, постійні порівняння з Шастрі були занадто великим тягарем, можливо, Чаван посилив внутрішньопартійні суперечності.\n\nНезважаючи на все, Неруївський соціялізм, схоже, закінчено, оскільки лівий фланг партії, що довго домінував, нарешті втрачає свою владу, і разом з ним мрії засновника INC. Однак багато хто боїться, що робітничий клас може відповісти на консервативні політики."
WORLD.31014.a: "Конгрес підняв свою праву руку."

WORLD.31015.t: "[Get_newspaper_header]Чаран Сінгх стає прем'єр-міністром Індії"
WORLD.31015.desc: "Терпіння та добре ставлення індійської публіки до Індійської національної конгресії вичерпалися. Зі збільшенням відсутності внутрішніх успіхів і виснаженням уряду через дефекти та відсутність мети, INC зазнала своєї першої виборчої поразки, з численними великими фігурами, вигнаними з Лок Сабхи. Замість цього широкою коаліцією селян був обраний Чаран Сінгх, головний міністр Уттар-Прадеш.\n\nЯк встановлений лідер серед селян, Сінгх будує свою виборчу коаліцію виключно з них, і дуже мало людей сумніваються в загальній траєкторії його уряду. Більшість очікує перерозподілу земель та програми допомоги фермерам, які стануть основою його уряду, а також привертається увага до Біхару та Бенгалу, де почалися зусилля щодо їх повної інтеграції."
WORLD.31015.a: "Нижчий рівень піднімається на верх."

WORLD.31016.t: "[Get_newspaper_header]Морарджі Десай переобраний прем'єр-міністром Індії"
WORLD.31016.desc: "П'ять років прем'єрства принесли очевидні результати для Морарджі Десаї - не тільки він був переобраний, але тепер має комфортну більшість у парламенті. Аналітики очікують, що Десай збережеться на курсі, що став знайомим для Індії - пателітський секуляризм, посилення відносин з Америкою, самодостатність та відновлення прав Бенгалу.\n\nОднак темні хмари нависають над цим, здавалося б, маяком стабільності. Кожного разу, коли Десай правив, відбувалася релігійна насильство, що критики вважають особисто відповідальним для Десаї через його автократичне та патерналістичне ставлення до мусульманської меншості. Це сумне продовження лише очікується під Індією, що формується в образі Десаї."
WORLD.31016.a: "Але чи зможе лише стабільність зупинити насильство?"

WORLD.31017.t: "[Get_newspaper_header]Яшвантрао Чаван стає прем'єр-міністром Індії"
WORLD.31017.desc: "Морарджі Десай зазнав великої поразки, оскільки Індійська національна конгресія здобула перемогу без нього, а консервативний титани не зміг отримати номінацію на прем'єр-міністра. Його критики заявляють, що неприпустиме зростання релігійного насильства стало його відповідальністю - його автократичне та зверхнє ставлення до мусульман Індії не допомогло зупинити кризу, а Десай лише посилив свою патерналістську риторику.\n\nЗ маргіналізацією Десаї та його консервативного крила, їхні суперники з Неруїстів повернулися на їхнє місце. Яшвантрао Чаван тепер очолює Індію, обіцяючи повернення до соціялізму та припинення релігійного насильства."
WORLD.31017.a: "Конгрес підняв свою ліву руку."

WORLD.31018.t: "[Get_newspaper_header]Чаран Сінгх стає прем'єр-міністром Індії"
WORLD.31018.desc: "Терпіння та добре ставлення індійської публіки до Індійської національної конгресії вичерпалися. Зі збільшенням відсутності внутрішніх успіхів і виснаженням уряду через дефекти та відсутність мети, INC зазнала своєї першої виборчої поразки, з численними великими фігурами, вигнаними з Лок Сабхи. Замість цього широкою коаліцією селян був обраний Чаран Сінгх, головний міністр Уттар-Прадеш.\n\nЯк встановлений лідер серед селян, Сінгх будує свою виборчу коаліцію виключно з них, і дуже мало людей сумніваються в загальній траєкторії його уряду. Більшість очікує перерозподілу земель та програми допомоги фермерам, які стануть основою його уряду, а також привертається увага до Біхару та Бенгалу, де почалися зусилля щодо їх повної інтеграції."
WORLD.31018.a: "Нижчий рівень піднімається на верх."

WORLD.31019.t: "[Get_newspaper_header]Н. Г. Ранга стає прем'єр-міністром Індії"
WORLD.31019.desc: "Коли Чакраварті Раджагопалачарі вперше став прем'єр-міністром, мало хто очікував, що його успіх подолає численні труднощі в Індії. Тепер ці невірні стоять мовчки перед трансформацією Індії. У боротьбі після смерті Раджагопалачарі, здається, його спадщина буде збережена, з Н. Г. Рангою, призначеним наступником. Утримуючи стабільну коаліцію, партія Сватантра повернулася до влади, і Ранга призначений на повний термін.\n\nПартія залишається проектом багатих в Індії, з аристократією, середнім класом та промисловцями, які надають політичну основу. Однак обрання Ранга розширило цю базу трохи, надавши місце кільком обмеженим, об'єднаним лідерам селян. Ці лідери вітали підйом Ранга, і очікується, що він буде підтримувати економічну політику Раджагопалачарі, розвиваючи його реформи."
WORLD.31019.a: "Навіть партія Сватантра повинна визнавати демографічну реальність."

WORLD.31020.t: "[Get_newspaper_header]Гаятрі Деві стає прем'єр-міністром Індії"
WORLD.31020.desc: "Коли Чакраварті Раджагопалачарі вперше став прем'єр-міністром, мало хто очікував, що його успіх подолає численні труднощі в Індії. Тепер ці невірні стоять мовчки, оскільки Індія була трансформована під його наглядом. У боротьбі після смерті Раджагопалачарі, Гаятрі Деві, велика власниця земель, аристократка та Махарані Джайпуру, була номінована як лідер. Попри внутрішній опір, вона успішно забезпечила повторне обрання та має право служити повний термін як прем'єр-міністр.\n\nОскільки вона сильно залежить від підтримки союзників у Пенджабі та Сінгха, її вибори не знайшли підтримки серед багатьох індійців. З власним класом і елітаризмом, земельною аристократією та їхніми патронажними мережами, вона була підтримана для перемоги навіть серед дефектів середнього класу. Тепер забезпечена, вона готується утвердити новий статус аристократії, закріплюючи будь-яке подальше національне розбудову."
WORLD.31020.a: "Мала виборча коаліція; новий Мархатський конфедерат?"

WORLD.31021.t: "[Get_newspaper_header]Брахм Пракаш Ядав стає прем'єр-міністром Індії"
WORLD.31021.desc: "На останніх виборах в Індії результати виявилися грандіозною поразкою для чинної партії Сватантра, що призвело до їх вигнання з влади. Міжнародні спостерігачі одностайно погоджуються, що велике коливання проти уряду можна пояснити невдачею їхніх економічних лібералізаційних політик, що зробили мільйони біднішими та посилили наявні нерівності в Індії.\n\nПовернувшись до влади, лівоцентристський INC оголосив про широке скасування політик попередників після виборів, отримавши переважно позитивну реакцію від населення. Новий прем'єр-міністр Брахм Пракаш Ядав також очікується зосередитися на реінтеграції військових губернаторств Бенгалу та Біхару, завершивши ще одну трагічну сторінку в історії Індії, оскільки опір владі Республіки зменшується."
WORLD.31021.a: "Повернення до нормальності."

WORLD.31022.t: "[Get_newspaper_header]Конференція в Лакхнау увінчалася успіхом; Індія об'єднана"
WORLD.31022.desc: "Після кількох тижнів невизначеності, президент Субхас Чандра Бос оголосив про розпуск тимчасового уряду Азад Хінд, повернувши провінції до Республіки. Це сталося після успіху конференції в Лакхнау, де уряд погодився на реінтеграцію за умови, що HSS буде повністю легалізовано на виборах.\n\nМіжнародні спостерігачі прогнозують, що майбутні вибори стануть найжорсткішими в історії Індії, коли дві партії, що монополізують владу в своїх штатах, зіткнуться. Однак вибори зараз не є пріоритетом для індійців, які сьогодні у захваті від того, що їх нація знову єдина і що закінчено десятирічне протистояння.\n\nРеакція від наддержав досі була обережною, ймовірно через невдоволення результатами нейтральної держави."
WORLD.31022.a: "Індія проти світу!"
WORLD.31022.b: "Краще розділена, ніж така."
WORLD.31022.c: "Азія закрита для бізнесу."
WORLD.31022.d: "Обіцянка субконтиненту випарувалась."

WORLD.31023.t: "[Get_newspaper_header]Індіра Ганді стає прем'єр-міністром Індії"
WORLD.31023.desc: "У боротьбі двох домінуючих партій, INC здобув перемогу, зберігши владу над своїми суперниками на сході, рішуче здобувши більшість над HSS. Вважається, що Індіра Ганді є спадкоємицею Неру, вона стала першою жінкою-прем'єр-міністром Індії, успадкувавши важке завдання примирення двох колишніх штатів в одну.\n\nЯк прихильниця корпоратного моделі, що була популярна в Італії, Індія, ймовірно, реалізує великі економічні реформи, схожі на цю модель, оскільки держава адаптується до реінтеграції Азад Хінд. Вона стверджує, що ця система є найкращим компромісом для двох урядів. Однак деякі коментатори висловлюють занепокоєння через авторитарні схильності Індіри та її домінуючі тенденції в межах INC. На даний момент невідомо, як ці погляди вплинуть на інститути Республіки."
WORLD.31023.a: "Залізна леді і крихка держава."

WORLD.31024.t: "[Get_newspaper_header]Індіра Ганді переобрана в Індії"
WORLD.31024.desc: "Ніж крутиться ще глибше. Індіра Ганді, перший прем'єр-міністр єдиної Індії з часів Боса, була переобрана. Мало хто сумнівався в її перемозі, або в тому, що вона здобуде її з істотною перевагою, але її перемога зміцнила її позицію в Лок Сабсі. Відповідно, її внутрішні критики були змушені замовкнути, і без значних інцидентів очікується, що вона матиме простий шлях до третього терміну.\n\nНа папері Індія все ще залишається відносно ліберальною, вільною країною. Але величезний розмір та стійкість її коаліції призвели до летальної токсичної зміни її інститутів. Партія переписала економічну структуру та виборчі процеси, створивши їх на користь лише INC. Хоча загроза того, що Індіра відмовиться визнати поразку на виборах, тепер стає неактуальною, багато спостерігачів бояться, що хватка Індіри на владі послабиться лише з її смертю."
WORLD.31024.a: "Найбільша демократія - скоро стане найбільшим феодом Індіри?"

WORLD.31025.t: "[Get_newspaper_header]Джаджіван Рам стає прем'єр-міністром Індії"
WORLD.31025.desc: "В результаті шокуючої поразки для чинного INC, великий коаліційний уряд, що складається з партій з різних соціальних прошарків, здобув перемогу, обравши Джаджівана Рама єдиним прем'єр-міністром. Поразка стала результатом відгуку на зростаючий авторитаризм Індіри та її корпоратні соціальні реформи, при цьому міжнародні спостерігачі припускають, що INC стала самовдоволеною та надто впевненою у своїй перемозі.\n\nНовий уряд складається з різноманітних політиків, в тому числі з відступників від INC та HSS. Хоча це суттєво допомогло їм перемогти на виборах, аналітики вважають, що вони зіткнуться з серйозними труднощами в уряді, вказуючи на суттєві розбіжності в політиках між партіями. INC визнала поразку на виборах, хоча були побоювання, що вони цього не зроблять."
WORLD.31025.a: "Вони виграли війну, але чи зможуть виграти мир?"

WORLD.31026.t: "[Get_newspaper_header]Введено надзвичайний стан в Індії"
WORLD.31026.desc: "Останній цвях у труну індійської демократії. Сьогодні Індіра Ганді несподівано оголосила надзвичайний стан, стверджуючи, що внутрішній безлад, політичні заворушення та тиск від пакистанських сепаратистів змусили її вжити цих заходів. Незважаючи на нещодавні протести, ці кроки є суттєвим відступом від встановлених норм і значним загостренням поточної кризи.\n\nЦе вже є останнім етапом зусиль для консолідації влади Індіри Ганді. Вже були заарештовані основні лідери HSS, і багато організаторів опозиції піддаються серйозним погрозам. Перехід до корпоратизму, розпочатий через демократичні засоби, лише прискорюється і, ймовірно, досягне свого повного завершення. З цим малоймовірно, що будь-яка значуща опозиція до порядку Індіри Ганді буде організована найближчим часом, навіть якщо ці надзвичайні повноваження будуть скасовані."
WORLD.31026.a: "Демократія, чоловік Істини, батько Свободи, брат Віри, Надії та Справедливості, померла в [Get.Year]."

WORLD.31027.t: "[Get_newspaper_header]HSS обрано в Індії"
WORLD.31027.desc: "У перемозі старого режиму HSS здобула перемогу на перших виборах після об'єднання Індії, здобувши значні успіхи в кількох провінціях, які ніколи не знаходились під контролем Азад Хінд. Раніше правляча партія Японії, міжнародні спостерігачі передбачали, що вільні вибори призведуть до їхньої поразки через втрату контролю над владою, але повідомлення партії про національне визволення здається, що воно здобуло підтримку електорату.\n\nАбід Хасан Сафрані був обраний новим прем'єр-міністром Індії, але Субхас Чандра Бос вважається справжньою силою за троном, через його продовження керівництва партією. Очікується, що HSS спробує відновити попередню партійну систему, що контролювала Азад Хінд. Однак їхні спроби, ймовірно, зіткнуться з перешкодами через закони та конституцію Республіки Індія, а також через інші фактори."
WORLD.31027.a: "Невідворотна сила проти незрушного об'єкта."

WORLD.31028.t: "[Get_newspaper_header]Індія призупиняє Конституцію"
WORLD.31028.desc: "Сьогодні HSS втілила свою найбільшу політичну маніпуляцію, успішно призупинивши Конституцію Індії. Цей крок став результатом тривалих дій, спрямованих на консолідацію влади HSS в об'єднаній Індії, починаючи з широких економічних реформ, націлених на стару еліту Республіки, політизацію армії та загальне ослаблення ліберальної системи.\n\nВже з'явилися повідомлення про те, що офіційних осіб Верховного Суду переслідують і заважають виконувати їх обов'язки підрозділи армії, що підтримують HSS, оскільки інші державні інституції очікують на політичні втручання після заяви Сафрані "позбутися колоніального впливу в Індії". Тепер, коли влада HSS укріплена і її опозиція знищена, міжнародні спостерігачі вважають, що майбутнє Індії повернеться до шляху Азад Хінд."
WORLD.31028.a: "Нічого, крім шматків паперу..."

WORLD.31029.t: "[Get_newspaper_header]Військовий переворот в Індії"
WORLD.31029.desc: "Коли HSS вперше захопила владу в об'єднаній Індії, міжнародні спостерігачі вважали, що їхні цілі будуть зірвані через наслідки наслідування системи Республіки. Сьогодні вони частково мали рацію, оскільки військові арештовують лідерів, членів HSS і підтримуючих офіцерів масово. Ці арешти відбулися після спроби політизувати раніше аполітичну структуру і значного підриву ліберальних систем та інститутів Республіки.\n\nСтворивши тимчасовий уряд, лідери перевороту наполягають, що їхня єдина мета - "відновлення демократії", повернувши владу партії Сватантра, яка повністю підтримала переворот, за кілька місяців. Однак багато спостерігачів вважають, що вплив військових на політику буде продовжуватися, а не зменшуватися внаслідок цих дій."
WORLD.31029.a: "Зустрічайте нового боса."

WORLD.31030.t: "[Get_newspaper_header]Субхас Чандра Бос вийшов з коми"
WORLD.31030.desc: "У новинах, що заспокоюють уряд Азад Хінд і турбують тих, хто в Республіці, повідомляється, що президент Субхас Чандра Бос вийшов з коми, яку йому індукували після невдалого замаху на його життя. Його відновлення підняло бойовий дух сил Азад Хінд, гарантуючи їх успіх у все більш неминучій війні з Республікою Індія.\n\nМіжнародні спостерігачі підтвердили цей підйом морального духу, відзначивши захоплену похвалу, яку армія та уряд дають Босу, оскільки будь-які голоси незгоди були витіснені безперервною і беззастережною підтримкою їхнього лідера. Критики з Республіки звинувачують Боса в тому, що він використовує це для створення культу особистості навколо себе, що підтверджує їхню відданість демократичним принципам."
WORLD.31030.a: "Навіть смерть чекає на Боса!"

WORLD.31031.t: "[Get_newspaper_header]Субхас Чандра Бос не відновився"
WORLD.31031.desc: "У новинах, які викликають страх серед громадян уряду Азад Хінд і полегшення серед громадян Республіки, тепер очевидно, що президент Субхас Чандра Бос не відновиться з коми найближчим часом. У зв'язку з цими новинами, А.Ц. Чаттерджі, якого багато хто вважає другим командиром Боса, був призначений тимчасовим лідером уряду Азад Хінд у підготовку до неминучої війни з Республікою.\n\nМіжнародні спостерігачі відзначають, що Чаттерджі здобув свою посаду завдяки своїй сильною базі в армії та серед партократії HSS. Однак вони також помітили, що всередині HSS вже формується опозиція до Чаттерджі, в тому числі з боку широкого лівого крила та технократів, і Н. Рагаван став ключовим суперником його правління. Чи зможе Чаттерджі утримати свою позицію після війни, поки що не ясно."
WORLD.31031.a: "Що вони зроблять без свого Нетаджі?"

WORLD.31032.t: "[Get_newspaper_header]Субхас Чандра Бос помер; його наступником став Самар Гуха"
WORLD.31032.desc: "Повідомлення з Хіндустану підтвердили смерть президента Субхаса Чандри Боса, його вісника незалежності та національного об'єднання, оголошено тиждень жалоби. Усвідомлюючи своє погане здоров'я, Бос підготував наступника, ним став відомий академік і лівий Самар Гуха, який став новим керівником країни.\n\nСтаючи другим президентом в історії новооб'єднаної нації, Гуха вважається прихильником лівого блоку всередині HSS. Раніше особистий друг покійного Боса, міжнародні спостерігачі вважають, що новий президент продовжить систему Субхасизму, що діяла в об'єднаній Індії до цього часу. Однак вони також відзначають, що Гуха, ймовірно, надасть більший вплив соціялістичним і національно-визвольним цінностям Субхасизму порівняно з іншими рисами покійного лідера."
WORLD.31032.a: "Світ, що чекає, світ, який треба визволяти."

WORLD.31033.t: "[Get_newspaper_header]Субхас Чандра Бос помер; його наступником став Ананд Мохан Сахай"
WORLD.31033.desc: "Повідомлення з Хіндустану підтвердили смерть президента Субхаса Чандри Боса, його вісника незалежності та національного об'єднання, оголошено тиждень жалоби. Усвідомлюючи своє погане здоров'я, Бос встиг підготувати наступника, ним став відомий дипломат паназієць Ананд Мохан Сахай, який став другим президентом новооб'єднаної нації.\n\nБагато хто вважає Сахая захисником Сфери Спільного Процвітання в Хіндустані, і його призначення вказує на те, що країна поглибить свої відносини з Японією в майбутньому. Однак інші зауважують значну увагу Сахая до розвитку відносин з іншими членами Сфери Спільного Процвітання, включаючи Китай, Кампучію та В'єтнам, вважаючи його ідеалістом, який повністю прийняв паназійський проект."
WORLD.31033.a: "Азія - це майбутнє."

WORLD.31034.t: "[Get_newspaper_header]Субхас Чандра Бос помер; його наступником став Амія Натх Бос"
WORLD.31034.desc: "Повідомлення з Хіндустану підтвердили смерть президента Субхаса Чандри Боса, його вісника незалежності та національного об'єднання, оголошено тиждень жалоби. Усвідомлюючи своє погане здоров'я, Бос встиг підготувати наступника у вигляді свого племінника, Амії Натха Боса.\n\nЦей вибір підтвердив, що все більш персоналістичний характер партії в останні дні Боса не був винятком, а скоріше початком нового стилю правління для Хіндустану. Міжнародні спостерігачі вважають, що імідж Боса буде продовжувати широко використовуватися навіть після його смерті, і що HSS сильно покладатиметься на особистість Нетаджі та його нащадків у майбутньому, зміцнюючи культ особистості, започаткований покійним лідером."
WORLD.31034.a: "Бос не помре, він житиме вічно."

WORLD.31035.t: "[Get_newspaper_header]Уряд Рагавана зазнав поразки на голосуванні за довіру"
WORLD.31035.desc: "Після довгої низки невдач для правлячого уряду Рагавана в Хіндустані, він нарешті розпався після того, як не зміг пройти голосування за довіру в здатності керувати. Розпад стався після невдач у реагуванні на наслідки циклону Бхола, який зруйнував базу HSS в Бенгалії, що призвело до масових протестів проти партії. Рішення президента Рагавана використовувати армію та поліцію для жорстокого придушення протестувальників обернулося проти нього, коли це спричинило опозицію до нього з боку лівого блоку, на який він покладався для управління.\n\nПісля його відставки Лакшмі Сагал була призначена новим президентом країни, яскравою представницею лівого крила партії. Міжнародні спостерігачі прогнозують, що вона зробить значні поступки протестувальникам, щоб відновити спокій у нації."
WORLD.31035.a: "Повернення до революційного."

WORLD.31036.t: "[Get_newspaper_header]Уряд Рагавана зазнав поразки через військовий переворот"
WORLD.31036.desc: "Шокуючі новини з Хіндустану: уряд президента Рагавана був повалений військовим переворотом. Переворот був спровокований циклом Бхола, який зруйнував базу HSS в Бенгалії, що призвело до масових протестів проти правлячої партії. Рагаван вирішив відповісти переговорами з лідерами протестувальників, що задовольнило лівий блок партії, але розгнівило армію настільки, що вона позбавила його влади.\n\nПід керівництвом Мохаммеда Замана Кіані було сформовано військове правління, яке пообіцяло тримати владу "стільки, скільки потрібно для відновлення порядку і стабільності". Вже з'явилися повідомлення про те, що представники опозиції в HSS "зникають", оскільки почалися кроваві і надмірно насильницькі репресії проти протестувальників. Міжнародні спостерігачі вважають, що пройде ще багато часу, перш ніж буде відновлено цивільне правління, якщо взагалі."
WORLD.31036.a: "Хіндустан увійшов у свою найдовшу ніч."

WORLD.31037.t: "[Get_newspaper_header]Оголошено надзвичайний стан у Хіндустані"
WORLD.31037.desc: "У Хіндустані президент А.Ц. Чаттерджі оголосив надзвичайний стан після серії нещодавніх терористичних атак на північному сході. Це оголошення було підтримано як правлячою партією HSS, так і елементами збройних сил, вірними президенту. Невдовзі після цього оголошення, силові структури почали обшуки опозиційних інститутів, провели масові арешти партійних супротивників і інших осіб, що виступають проти уряду Чаттерджі.\n\nЗакордонні спостерігачі припускають, що цей крок спрямований на подальшу консолідацію влади в руках президента з метою перетворення HSS на інститут, який підтримує єдиного фігуру А.Ц. Чаттерджі як беззаперечного автократа Індії. На цей час представники як HSS, так і Сфери Спільного Процвітання в Індії відмовились коментувати."
WORLD.31037.a: "Тепер тільки Чаттерджі визначає долю Індії..."

WORLD.31038.t: "[Get_newspaper_header]Уряд Чаттерджі повалений партією"
WORLD.31038.desc: "У Хіндустані президент А.Ц. Чаттерджі був усунений з посади через голосування за недовіру партією HSS. Це сталося після спроби Чаттерджі оголосити надзвичайний стан без підтримки партії. Замість нього був обраний Абід Хасан Сафрані, ортодоксальний субхасист, який у своїй першій публічній промові пообіцяв "повернення до управління відповідно до партії та народу".\n\nПопри те, що Чаттерджі раніше користувався підтримкою HSS, некомпетентне управління останніми безпековими інцидентами на північному сході та диктаторський підхід до партії посилили напругу між двома сторонами. Спроба оголосити надзвичайний стан стала останнім мотивом для того, щоб партократи HSS розірвали стосунки з урядом Чаттерджі. Очікується, що уряд Сафрані буде діяти з більшою увагою до HSS, що означає повернення до основного правління партією."
WORLD.31038.a: "Може бути лише один Нетаджі."

WORLD.31039.t: "[Get_newspaper_header]HSS усунено в результаті військового перевороту"
WORLD.31039.desc: "У Хіндустані правляча партія HSS була відсторонена групою офіцерів армії на чолі з генералом Моханом Сінгхом. Цей переворот стався після спроби оголосити надзвичайний стан, ініційованого колишнім президентом А.Ц. Чаттерджі та його партією HSS, з метою консолідації влади в руках президентського офісу. У своїй публічній промові після арешту кількох офіційних осіб партії HSS генерал Сінгх заявив, що його намір полягає в тому, щоб діяти лише як тимчасовий лідер і повернути Індію до багатопартійної демократії "коли внутрішня ситуація буде вирішена".\n\nНезважаючи на підтримку з боку залишків Індійського національного конгресу, як на внутрішньому, так і на міжнародному рівнях, спостерігачі вважають, що цей військовий уряд не має реальних намірів відновити цивільне правління. Оскільки військові офіцери займають ключові посади в кабінеті, а участь цивільних осіб в новому уряді серйозно обмежена і немає формального плану переходу, ці спостерігачі припускають, що цей тимчасовий уряд може залишатися на владі роками або навіть десятиліттями."
WORLD.31039.a: "Мрія Нетаджі похована поруч із ним."




