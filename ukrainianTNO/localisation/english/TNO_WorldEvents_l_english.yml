## BULGARIA
####################

 BUL_NEWS.1.t: "[Get_newspaper_header]Македонська війна"
 BUL_NEWS.1.desc: "З початку післявоєнного порядку Болгарія була відома своєю відносною стабільністю серед своїх союзників у Пакті. Проте сьогодні навіть вона постраждала від наближення краху Райху. Хоча повідомлення не зовсім ясні, здається, що відведення німецьких військ з Македонії до Сербії призвело до колапсу болгарської влади в регіоні.\n\nВже кілька великих міст було захоплено, зокрема Бітола, де "Демократична Федеративна Македонія" утворила урядову асамблею. Інсайдери в Софії стверджують, що криза мала рівний вплив на болгарський уряд, оскільки генеральний штаб бунтує проти методів Бориса ІІІ і вимагає припинення його суперечливого проекту реформування армії.\n"
 BUL_NEWS.1.a: "«Прусія Балкан» знаходить свого ворога."

 BUL_NEWS.2.t: "[Get_newspaper_header]Македонське повстання вщухає"
 BUL_NEWS.2.desc: "Після приблизно двох років боротьби Македонський конфлікт, що охопив Болгарію, нарешті затих. Хоча партизани залишаються активними, поліція та військові дії болгарського уряду ізолювали більшість македонського керівництва. Ці дії відрізали македонські постачання, паралізувавши їхнє повстання, і в кінцевому підсумку поклали кінець будь-яким значущим шансам на неминучу македонську незалежність.\n\nЗ цією новиною, ймовірно, Борис ІІІ забезпечив нову угоду для своєї адміністрації. Військові фракції, які раніше вважалися такими, що виступають проти його уряду, схоже, заспокоїлися."
 BUL_NEWS.2.a: "Балкани стають тишіші."

 BUL_NEWS.3.t: "[Get_newspaper_header]Борис ІІІ номінує кабінет Севова"
 BUL_NEWS.3.desc: "У тому, що багато міжнародних спостерігачів називають несподіваним кроком, Борис ІІІ вирішив звільнити свій реформістський кабінет. Замість нього Борис ІІІ обрав призначення кабінету консерваторів, на чолі з його близьким радником, Йорданом Севовим.\n\nСевов, відомий як «Распутін Болгарії» у пресі, широко розглядається як консервативний голос у кабінеті і, ймовірно, призведе уряд до крайньої правиці. Деякі сумніваються в походженні цього рішення, поширена гіпотеза полягає в тому, що похилий вік Бориса ІІІ відіграв роль у цьому рішенні."
 BUL_NEWS.3.a: "Останній указ від старіючого царя."

 BUL_NEWS.4.t: "[Get_newspaper_header]Смерть Царя"
 BUL_NEWS.4.desc: "Цар-Об'єднувач більше не з нами. Після понад п'ятдесяти років правління цар Борис ІІІ помер у Софії, оточений своєю родиною, радниками та вірними. Цар, якого любили та боялися в рівній мірі, ймовірно, буде пам'ятати за його завоювання болгарськими територіями, а також за суперечливі політичні репресії, що лежать в основі його тридцятирічного абсолютистського експерименту.\n\nВже син Бориса ІІІ, Симеон, був коронований царем Болгарії. Як очікувалося, Симеон зробив кроки до реформ. Хоча він був обережний у наданні деталей, багато хто очікує повернення виборів. Чи створить Симеон ліберальну демократію, залежить від того, наскільки далеко він готовий йти зі своєю реформістською схильністю."
 BUL_NEWS.4.a: "Як Болгарія житиме без свого батька?"

 BUL_NEWS.5.t: "[Get_newspaper_header]Смерть Бориса ІІІ"
 BUL_NEWS.5.desc: "Болгарський уряд нещодавно оголосив, що Борис ІІІ помер. Хоча для багатьох це не було сюрпризом, з огляду на ознаки старечого слабоумства, це не менш тривожно для громадськості.\n\nЗа покійним царем йде його син Симеон ІІ. Однак, враховуючи рішення Бориса ІІІ звільнити кабінет, обраний Симеоном, і вивести його з уряду, більшість не очікують, що перехід буде легким. Багато зовнішніх спостерігачів погоджуються, що Симеону ІІ буде важко відновити повагу та авторитет, яким користувався його батько."
 BUL_NEWS.5.a: "Нехай живе Цар."

 BUL_NEWS.6.t: "[Get_newspaper_header]Борис ІІІ тікає з Болгарії"
 BUL_NEWS.6.desc: "Протягом тридцяти років Болгарія знала одного короля, одну владу, одну націю. В один день, здається, все змінилося. Зіткнувшись з погрозами та нападами радикалів у армії, цар Борис ІІІ зник, ймовірно, втеча з країни. Він залишає за собою націю, що стоїть на межі знищення.\n\nХоча його син зазначив у підготовленій заяві, що тепер він приймає корону, його перший акт - це заміна прем'єр-міністра Партова на Константина Стоянова, відставного фашистського офіцера, крок, який більшість розглядає як наслідок примусу з боку ультраправої опозиції. Ліві, тим часом, організували опір по всій країні, в той час як нейтральні офіцери відмовилися співпрацювати з жодною з фракцій. Розділена нинішньою хаосом, болгарська армія навіть повністю вийшла з Македонії. Майбутнє Болгарії тепер виглядає абсолютно неясним."
 BUL_NEWS.6.a: "Всі мрії Бориса, розбиті за один день."
 BUL_NEWS.6.b: "Це могло забрати десятиліття, але фашизм прийшов до Болгарії."

 BUL_NEWS.7.t: "[Get_newspaper_header]Фронт Батьківщини бере владу"
 BUL_NEWS.7.desc: "Нестабільність у Болгарії триває. Фронт Батьківщини, об'єднання лівих партій, захопив Софію, проголосивши настання "нової ери" в історії Болгарії. Коаліція погодилася призначити Кімона Георгієва, багаторічного лідера Звено, прем'єр-міністром, при цьому також заплановані вибори на найближчий час.\n\nУ перші дні влади було арештовано сотні людей, переважно фашистів і консерваторів за часів Бориса ІІІ. Хоча монархія зберігається, Симеона ІІ не бачили з моменту державного перевороту, ймовірно, він перебуває під домашнім арештом. Новий уряд пообіцяв повернення до демократії, хоча Фронт Батьківщини обрав залишити себе домінуючою коаліцією. Справжня природа цієї демократії – і навіть її функціональність – залишаються під питанням."
 BUL_NEWS.7.a: "В одному куточку Європи є звільнення."
 BUL_NEWS.7.b: "Що за божевілля."

 BUL_NEWS.8.t: "[Get_newspaper_header]Офензива Черен успішна"
 BUL_NEWS.8.desc: "Прес-реліз з Софії повідомив, що після масованого наступу болгарських збройних сил, триколор знову майорить над палаючими руїнами Скоп'є. Те, що внутрішні витеклі документи назвали 'Офензивою Черен', ймовірно, знищило Демократичну Македонію на її зародку, через кілька місяців після її заснування навесні. Лідер республіки, Андонов-Ченто, був суджений і повішений за свої злочини.\n\nЗагасивши македонське повстання, болгарський фашистський уряд оголосив свої наміри "повністю відновити законні кордони нації", що є тривожною заявою для його територіальних суперників на південь. Греція і Туреччина засудили ставлення Болгарії до повстання, а дипломати і генерали, ймовірно, вже почали насторожено спостерігати за кордонами Південно-Східної Європи."
 BUL_NEWS.8.a: "Балканська порохова бочка знову тліє."

 BUL_NEWS.9.t: "[Get_newspaper_header]Офензива Черен зазнає поразки"
 BUL_NEWS.9.desc: "У виступі зі Скоп'є Андонов-Ченто, лідер нещодавно проголошеної Демократичної Македонії, заявив, що офензива Черен болгарських збройних сил була відбита. Здається, що завдяки розумному використанню гірської місцевості та стійкому захисту Болгарія зазнала катастрофічної поразки в спробі відновити свої територіальні претензії.\n\nСофія і Афіни залишилися мовчазними з цього приводу, в той час як Анкара випустила обережну заяву на підтримку партизанів – без визнання їх як справжньої нації.\n\nОскільки накладені претензії знову стають актуальними і старі рани відкриваються, залишаються питання, чи переживе фашистський уряд Болгарії, чиї амбіції були зруйновані. Тим часом Македонія опинилася оточеною пильними хижаками, її майбутнє обтяжене невизначеністю."
 BUL_NEWS.9.a: "Балканська порохова бочка знову тліє."

 BUL_NEWS.10.t: "[Get_newspaper_header]Бомбардування Софії"
 BUL_NEWS.10.desc: "Минулого вечора стовп диму піднявся над Софією. Лише через кілька годин повідомили, що цар Симеон ІІ мертвий. Здається, ця руйнівна атака стала каталізатором для серії чисток в уряді Болгарії, ініційованих ОНБЛ, що в результаті забезпечило правління Тодора Жекова в країні.\n\nОскільки опозиція до уряду Жекова намагається знайти укриття в розгубленості, це, без сумніву, сигналізує про відновлення інтенсивної мілітаризації Болгарії та погроз на адресу своїх супротивників.\n\nБудучи парією на Балканах, мало хто може з упевненістю сказати, до чого призведе цей агресивний курс, але одне є певним: Болгарія продовжує шукати своє довгоочікуване гегемонство."
 BUL_NEWS.10.a: "Темні новини з Софії."

 BUL_NEWS.11.t: "[Get_newspaper_header]Бомбардування Софії"
 BUL_NEWS.11.desc: "Минулого вечора стовп диму піднявся над Софією. Лише через кілька годин повідомили, що цар Симеон ІІ мертвий. Після цієї руйнівної атаки, Ратники провели серію несподіваних чисток проти ОНБЛ, які, здається, були налаштовані на власну підтримку.\n\nЦей несподіваний переворот призначив Асена Кантарджієва новим лідером Болгарії, який негайно проголосив своє намір продовжити чистки у своєму уряді з метою оновлення нації. Оскільки хаос охоплює країну і останні залишки болгарської демократії піддаються безжальному нападу з боку свого лідера, ніхто не може передбачити майбутнє чорної вівці Балкан."
 BUL_NEWS.11.a: "Тінь опускається на Болгарію."

 BUL_NEWS.12.t: "[Get_newspaper_header]Горна-Джумаяська угода"
 BUL_NEWS.12.desc: "На Балканах було створено лівий бастіон. Після кількох тижнів переговорів між македонськими та болгарськими представниками, спільне оголошення сьогодні в Горна-Джумайї вказує на те, що Болгарія та Македонія знову об'єднаються.\n\nЗгідно з новою угодою, Болгарія та Македонія будуть рівними партнерами в новій федерації, вільні в своїй політиці, але об'єднані відкритими кордонами, вільною торгівлею і, найголовніше, спільною зовнішньою політикою. Хоча націоналісти в обох країнах відкидають угоду, вона отримала широке схвалення, зокрема підтримку як Георгієва, так і Андонова-Ченто, і ймовірно буде прийнята без значних дебатів."
 BUL_NEWS.12.a: "Химерне утворення, яке не мало б формуватися."
 BUL_NEWS.12.b: "Перші кроки до Балканської федерації."

 BUL_NEWS.13.t: "[Get_newspaper_header]Горна-Джумаяська угода"
 BUL_NEWS.13.desc: "На Балканах було створено лівий бастіон. Після кількох тижнів переговорів між македонськими та болгарськими представниками, спільне оголошення сьогодні в Горна-Джумайї вказує на те, що Болгарія та Македонія знову об'єднаються.\n\nУ несподівано вигідній угоді для болгар, Македонія погодилася на тісні зв'язки, наближаючись до повної анексії, в обмін на політичну автономію та визнання македонської мови як окремої. Хоча більшість болгарів задоволені угодою, вона здається в основному роботою КПМ у Македонії, чия позиція далеко не поділяється нацією. Багато македонців вже готуються протестувати проти того, що вони бачать як несправедливу та ухилену угоду."
 BUL_NEWS.13.a: "Без єдиної битви Македонія підкоряє себе."
 BUL_NEWS.13.b: "Сподіваймося, що Болгарія задовольнить сумнівів."

 BUL_NEWS.14.t: "[Get_newspaper_header]Горна-Джумаяська угода"
 BUL_NEWS.14.desc: "Переговори в Горна-Джумайї завершилися таким чином, як мало хто міг би передбачити. За підтримки Йосипа Броза Тіто, президента Сербії, три нації - Сербія, Болгарія та Македонія - погодилися не лише на союз між Болгарією та Македонією, але й на розширену тристоронню федерацію: Федеральну Народну Республіку Балкан. За новою угодою Тіто буде головою держави під керівництвом уряду, в якому домінуватимуть македонці та болгари.\n\nУ процесі Болгарія також погодилася скасувати монархію, очевидно, сподіваючись на допомогу нових партнерів для вирішення можливих протестів. Хоча становище республіки на початку буде нестабільним через загрози з боку Німеччини, Італії та внутрішні проблеми, це може стати початком справжньої комуністичної сили в Європі."
 BUL_NEWS.14.a: "Краще сподіватися, що це не збудеться."
 BUL_NEWS.14.b: "Балканська Федерація реалізована - мрія стала реальністю."

 BUL_NEWS.15.t: "[Get_newspaper_header]Переговори в Горна-Джумайї зірвані"
 BUL_NEWS.15.desc: "Мрія про Балканську Федерацію знову розвалюється. Міхаїло Апостольскі, високопосадовий генерал і македонський партизан, використав невдачі в переговорах у Горна-Джумайї для захоплення влади. Одним із перших актів голови було наказати відкликати всіх дипломатів з Болгарії, назвавши її "державою-окупантом".\n\nПравління голови Апостольскі в Македонії вже виявилося авторитарним, з кількома провідними членами ASNOM, ув'язненими чи вигнаними з країни, включаючи колишнього лідера Андонова-Ченто. Без болгарських зв'язків, Македонія здається на шляху до самітницької держави, що прагне забезпечити власну безпеку понад усе."
 BUL_NEWS.15.a: "Лівизм на Балканах? Засуджено від самого початку!"
 BUL_NEWS.15.b: "Егоїстичний вчинок знищує балканську мрію..."

 BUL_NEWS.16.t: "[Get_newspaper_header]Проголошення Народної Республіки Болгарія"
 BUL_NEWS.16.desc: "Після невдалого монархістського перевороту та з огляду на те, що уряд Болгарії вже був республікою по суті, Софія офіційно відмовилася від монархії. Враховуючи, що комуністи займають більшість важливих міністерств і керівних посад, "Народна Республіка Болгарія" була оголошена комуністичною державою. З цією заявою інші партії були зведені до незначних ролей в правлячій коаліції.\n\nГенеральний секретар Комуністичної партії, Тодор Живков, схоже, є фактичним лідером держави. Очікується, що він почне переводити маси на свою версію дипломатичного та націоналістичного комунізму, щоб ще більше зміцнити свою позицію."
 BUL_NEWS.16.a: "Ще один стародавній режим падає від революції."

 BUL_NEWS.17.t: "[Get_newspaper_header]Проголошення Республіки Болгарія"
 BUL_NEWS.17.desc: "Після невдалого монархістського перевороту та з огляду на те, що уряд Болгарії вже був республікою по суті, Софія офіційно відмовилася від монархії. Правляча коаліція, очолювана Болгарським аграрним національним союзом, призначила нового прем'єр-міністра - Ніколу Петкова.\n\nПетков сміливо проголосив початок республіки, яка закріпить цінності ліберальної демократії і захистить аграрну існування. Однак зважаючи на іноді авторитарну історію BANU, лише час покаже, чи їх слова справдяться."
 BUL_NEWS.17.a: "Полум'я демократії ще горить у Болгарії."

 BUL_NEWS.18.t: "[Get_newspaper_header]Проголошення Незалежної Республіки Болгарія"
 BUL_NEWS.18.desc: "Після невдалого монархістського перевороту та з огляду на те, що уряд Болгарії вже був республікою по суті, Софія офіційно відмовилася від монархії. Очолювана радикальним крилом Звено, болгарська влада вже почала перехід до традиційно правих політик корпоратизму. Проте Софія все ще проголошує себе республікою, яка цінує міжнародний мир і дипломатичні стосунки.\n\nНезважаючи на підйом Звено до влади, організація ще намагається оговтатися від втрати багаторічного лідера Кімона Георгієва. Здається, що Болгарія ще не вийшла з періоду нестабільності."
 BUL_NEWS.18.a: "Один правий уряд падає, інший піднімається на його місце."

 BUL_NEWS.19.t: "[Get_newspaper_header]Повернення царя Симеона ІІ"
 BUL_NEWS.19.desc: "Після несподіваного державного перевороту, болгарська монархія була відновлена після періоду ізоляції від уряду. Симеон ІІ, вже де-юре монарх, схоже, досяг цього завдяки своїм зв'язкам у війську, і зокрема в армії.\n\nЗі скиданням уряду Фронту Батьківщини, Симеон ІІ тепер формує власний уряд. Зовнішні спостерігачі очікують, що цей новий режим буде консервативним і зосередженим переважно на стабілізації як власної влади, так і нації в цілому."
 BUL_NEWS.19.a: "Монархізм продовжує триматися за життя."

####################
## FINNEST OF LANDS
####################

 FIN_WORLD.6.t: "[Get_newspaper_header]Декларація Народної Республіки Мурманськ"
 FIN_WORLD.6.desc: "Захопивши Східну Карелію та Кольський півострів під час так званої "Продовжувальної війни" 1941 року, Фінляндія давно прагнула, щоб її народ розповсюдився на схід і колонізував величезні простори російських земель, які були анексовані після падіння Совєцького Союзу. Однак те, на що уряд не розраховував, це відмова корінного російського населення мирно прийняти Новий порядок, під залізною рукою Гельсінкі.\n\nВідокремившись від Республіки та сформувавши свою "Народну Республіку Мурманськ", цей анклав проголосив свою незалежність і вступив в альянс з новооб'єднаною Західною Росією, щоб "захистити свободу російського народу". Російська держава також заявила про намір захищати Народну Республіку і, можливо, втрутитися проти "тиранського уряду Фінляндії". Оскільки Гельсінкі побоюється найгіршого, було оголошено мобілізацію проти "будь-якої можливої загрози"."
 FIN_WORLD.6.a: "До цього дійшло."

 FIN_WORLD.7.t: "[Get_newspaper_header]Карельська війна"
 FIN_WORLD.7.desc: "Виступаючи перед нацією в прямому ефірі сьогодні, президент Фінляндії оголосив, що російські військові частини перетнули кордон Фінляндії. Хоча стан несподіваного російського наступу не відомий, атаки Народної Республіки Мурманськ на фінські сили значно посилились разом з новинами про цей удар.\n\nЗ цими атаками Росія фактично оголосила війну Фінляндії та почала багатофронтові наступи вглиб Онеґи - фінської буферної держави, що була створена для ізоляції Гельсінкі від анархії Західної Росії. Коли російські війська просуваються на захід, російські представники попереджають про "серйозні наслідки", якщо Фінляндія продовжуватиме облягати Народну Республіку Мурманськ, і наказали Гельсінкі "припинити війну агресії проти російського народу" та визнати сепаратистську республіку незалежною державою."
 FIN_WORLD.7.a: "Росія повернулась з помстою."

 FIN_WORLD.8.t: "[Get_newspaper_header]Друга Фінська громадянська війна"
 FIN_WORLD.8.desc: "Події останніх кількох тижнів потрясли Фінську Республіку до основ. Якщо б лише це було найбільше криза в історії Фенноскандії. Ситуація різко погіршилася - і найбільш катастрофальним чином. Фінські комуністи, довго пригноблені з часів Російсько-Фінської війни, скористалися прикладом так званої Народної Республіки Мурманськ (НРМ) і смертоносного російського повстання на сході Карелії.\n\nВ більшості провінцій країни комуністичні агітатори об'єдналися і повели війну проти урядової влади. У багатьох містах Фінляндії соціялістичні сили повністю витіснили республіканців. У Гельсінкі вони намагались захопити місто та нанести вирішальний удар, але були зупинені армією. Тепер вони оточують Гельсінкі - і з їхнім облогою починається найкровавіша війна в історії Фінляндії."
 FIN_WORLD.8.a: "Кубики доміно нарешті впали."

 FIN_WORLD.9.t: "[Get_newspaper_header]Відставка президента Ріхтніємі"
 FIN_WORLD.9.desc: "З початком громадянської війни в Фінляндії, президент Юха Ріхтніємі вирішив піти у відставку, зазначивши, що країна потребує "уряду, який об'єднає націю без політичних упереджень" в цей кризовий час. Джерела в уряді Фінляндії підтвердили, що новий уряд буде очолювати Лаун Торні, відомий воєнний герой з Перервної війни. Новий уряд обіцяє покласти край хаосу, що охопив країну, а також захистити землі, які наразі знаходяться під контролем комуністичних елементів.\n\nФінська громадськість, яка підтримує уряд, висловила підтримку новому президенту, і політичні спостерігачі припускають, що це може вплинути на результат. Проте завдяки тісним зв'язкам президента Торні з Німеччиною, де він був частиною СС під час Продовжувальної війни, Фінська Республіка цілком може отримати німецьку допомогу в тій чи іншій формі."
 FIN_WORLD.9.a: "Подивимось, що він може зробити."

 FIN_WORLD.10.t: "[Get_newspaper_header]Перемога комуністів у Другій Фінській громадянській війні"
 FIN_WORLD.10.desc: "З захопленням Гельсінкі - фінської столиці та серця країни - і Віупурі - опорної бази уряду республіки - бойові дії у Фінляндії поступово завершуються. Хоча жодної офіційної капітуляції від уряду не було оголошено, а багато ізольованих підрозділів все ще обіцяють продовжити боротьбу проти "необільшовицької загрози", це стало непоправним ударом по шансам уряду.\n\nУ Східній Карелії, з іншого боку, надії російських повстанців стали захопленими. В обмін на постійний мир з російською державою Фінляндія підписала угоду про відмову від претензій на Карелію та Кольський півострів, що ознаменувало кінець багаторічної боротьби з Гельсінкі, що виникла після кривавої кінцівки Совєцького Союзу. З миром на горизонті, постає питання:"
 FIN_WORLD.10.a: "Як виглядатиме Червона Фінляндія?"

 FIN_WORLD.11.t: "[Get_newspaper_header]Перемога уряду в Другій Фінській громадянській війні"
 FIN_WORLD.11.desc: "З перемогою над комуністичними силами у Фінляндії громадянська війна в Фінській Республіці підходить до свого завершення. Після того, як комуністи зазнали поразки від урядових сил Торні, і без достатньої підтримки від російського об'єднувальника, який поспішає зайняти землі, раніше належні Фінляндській Республіці, комуністи капітулювали і зрештою погодилися на поразку. Проте, через хаос у самій Фінляндії, Росія змогла досягти своєї первісної мети.\n\nЗахопивши Східну Карелію та Кольський півострів, Фінляндський уряд не мав іншого вибору, як тільки погодитися з російськими вимогами. Хоча втрата східних територій сильно вдарила по уряду, перемога в громадянській війні дозволила зменшити будь-яке народне незадоволення, яке могло б з'явитись. Фінляндія продовжує існувати, хоча й в меншому розмірі."
 FIN_WORLD.11.a: "Прогнозований результат з урахуванням обставин."

 FIN_WORLD.12.t: "[Get_newspaper_header]Фінська перемога в Карельській війні"
 FIN_WORLD.12.desc: "Після кількох місяців запеклих боїв у тундрах Карельського регіону, Фінська Республіка змогла проголосити перемогу над Народною Республікою Мурманськ та російськими силами, які їх підтримували. Після успішного розгрому сил новоутвореної НРМ, Фінляндія укріпила свої лінії фронту та вирила окопи для захисту від майбутнього наступу російських військ. Хоча в якийсь момент лінія фронту була близька до прориву, стратегічне планування забезпечило відбиття кожної атаки ворога.\n\nПозбавлена варіантів і з перспективою втратити ще більше людей на безглузду смерть, російська влада погодилася на вимоги Фінляндії щодо закінчення війни, що призвело до відсутності територіальних змін, за винятком розпуску НРМ та повернення Карелії Фінляндії."
 FIN_WORLD.12.a: "Велика Фінляндія стоїть."
 
 FIN_WORLD.13.t: "[Get_newspaper_header]Перемир'я в Карельській війні"
 FIN_WORLD.13.desc: "Триваюча війна в Карелії досягла апогею за останні кілька днів, оскільки боротьба між російською державою та Фінською Республікою переросла в затяжну ситуацію. Росіяни не змогли консолідувати свої здобутки та просунутися глибше в Фінляндію, а фінські сили не могли вигнати російську армію зі своєї території. Бої перетворилися на аналогію до окопної війни Першої світової війни, з величезними втратами з обох сторін.\n\nУ зв'язку з цим обидві сторони оголосили перемир'я та завершення війни. В обмін на передачу Мурманська та Кольського півострова Росії, інша сторона повинна відмовитися від всіх претензій на решту Карелії та підписати постійний мир з Республікою. Після цієї поразки президент Ріхтніємі подав у відставку, і новим президентом став Кауну Клемола до загальних виборів 1967 року."
 FIN_WORLD.13.a: "Досить було."

 FIN_WORLD.132.t: "[Get_newspaper_header]Перемир'я в Карельській війні"
 FIN_WORLD.132.desc: "Триваюча війна в Карелії досягла апогею за останні кілька днів, оскільки боротьба між російською державою та Фінською Республікою переросла в затяжну ситуацію. Росіяни не змогли консолідувати свої здобутки та просунутися глибше в Фінляндію, а фінські сили не могли вигнати російську армію зі своєї території. Бої перетворилися на аналогію до окопної війни Першої світової війни, з величезними втратами з обох сторін.\n\nУ зв'язку з цим обидві сторони оголосили перемир'я та завершення війни. В обмін на передачу Мурманська та Кольського півострова Росії, інша сторона повинна відмовитися від всіх претензій на решту Карелії та підписати постійний мир з Республікою."
 FIN_WORLD.132.a: "Досить було."
 
 FIN_WORLD.14.t: "[Get_newspaper_header]Російська перемога в Карельській війні"
 FIN_WORLD.14.desc: "Коли вперше надійшли новини про перехід російських військ через російсько-фінський кордон до Онеґи, їх спочатку сприйняли як черговий набіг за дрібними трофеями. Коли російські сили проігнорували надіслані їм комунікації та хлинули до Фінляндії, вважалося, що мала, але елітна фінська армія може повернути ситуацію і прогнати росіян назад у Сибір.\n\nОднак кожне припущення щодо Росії виявилось хибним, як показали новини цього ранку. Після відставки президента Ріхтніємі, новообраний президент Кауну Клемола оголосив у прямому ефірі, що Фінляндія не має іншого вибору, окрім як умовно капітулювати перед російською армією та віддати Східну Карелію і Кольський півострів. Фінська гегемонія була зламана назавжди, і Фінляндія вступила в найтемнішу кризу в своїй історії."
 FIN_WORLD.14.a: "Що не зміг зробити Бухарін, те зробила бідна державка?"
 
 FIN_WORLD.22.t: "[Get_newspaper_header]Юха Ріхтніємі знову обраний президентом Фінляндії"
 FIN_WORLD.22.desc: "Коли почалася Карельська війна, багато спостерігачів вважали, що це призведе до катастрофи і поразки на виборах для Кок. Однак вони помилились, оскільки перемога над Росією лише зміцнила позиції Ріхтніємі та забезпечила його підтримку як серед народу, так і серед виборчої колегії, що дозволило йому переобратися.\n\nЗ перемогою, яка забезпечила негайну стабільність Фінляндії на міжнародній арені, Ріхтніємі працюватиме над зміцненням суверенітету своєї країни проти російської загрози, незважаючи на нанесені їй рани. Крім того, він також працюватиме над розвитком Фінляндії, щоб стати цінним партнером для всієї Європи."
 FIN_WORLD.22.a: "Кок, здається, залишиться на найближчі роки."
 
 FIN_WORLD.23.t: "[Get_newspaper_header]Матті Віркуннен обраний президентом Фінляндії"
 FIN_WORLD.23.desc: "Попри поразку Фінляндії в Карельській війні, Національна коаліційна партія змогла утримати владу. Новий президент, Матті Віркуннен, відомий тим, що раніше був головою торгової палати, а також розробляв торгову політику Фінляндії під час Другої світової війни.\n\nВін представляє невдачу тихої політики Ріхтніємі, Віркуннен здається більш консервативним, ніж Ріхтніємі. Під його керівництвом Фінляндія ще тісніше співпрацюватиме з Німеччиною, шукаючи інвестиції від Пакту для того, щоб компенсувати величезні економічні втрати, завдані Фінляндії через втрату великої частини території."
 FIN_WORLD.23.a: "Чи зможе він компенсувати минулі невдачі?"
 
 FIN_WORLD.24.t: "[Get_newspaper_header]Йоганнес Віролайнен обраний президентом Фінляндії"
 FIN_WORLD.24.desc: "Після завершення Карельської війни, колишній глава Офісу передачі населення, Йоганнес Віролайнен, був обраний президентом Фінляндії. Віролайнен, карелець і центрістський консерватор, є членом Аграрного союзу і має ступінь у галузі сільського господарства та лісового господарства.\n\nПід його керівництвом Фінляндія зберігатиме глибокі зв'язки з Німеччиною, які вона зміцнила за роки, і в цілому не буде змін у політиці розвитку, започаткованій попередніми адміністраціями. Крім того, більше грошей і ресурсів буде інвестовано в безпеку часто забутого регіону Карелії."
 FIN_WORLD.24.a: "Нова партія, нова Фінляндія?"
 
 FIN_WORLD.25.t: "[Get_newspaper_header]Карл-Август Фагерхольм обраний президентом Фінляндії"
 FIN_WORLD.25.desc: "Після наслідків Карельської війни нова партія зайняла пост президента Фінляндії. Під керівництвом Карла-Августа Фагерхольма, відомого тим, що був вигнаний з кабінету міністрів під час Продовжувальної війни за свою опозицію до німецьких інтересів, Соціал-Демократична партія вперше в історії здобула перемогу.\n\nПопри те, що він є стійким антикомуністом, Фагерхольм пообіцяв інтегрувати соціялістів у фінську політику, що викликало критику серед більшості політичного істеблішменту. Крім того, він підтримує розрив багатьох зв'язків, які Фінляндія побудувала з Німеччиною, і прагне налагодити тісніші відносини з західними країнами."
 FIN_WORLD.25.a: "Здається, на півночі відбуваються цікаві події."
 
 FIN_WORLD.26.t: "[Get_newspaper_header]Еліас Сімойокі обраний президентом Фінляндії"
 FIN_WORLD.26.desc: "Після Громадянської війни та призначення прем'єр-міністра ІКЛ, Лаурі Тьорні оголосив, що більше не буде балотуватися на посаду. За рішенням виборчої колегії, на посаду президента був обраний відкрито партійний член ІКЛ, Еліас Сімойокі. Сімойокі є священиком, старшим членом ІКЛ, лідером молодіжного руху ІКЛ і членом Академічного Карельського товариства.\n\nЗ обома відкрито фашистським главою держави та главою уряду, багато хто вважає, що вони стали свідками повної реалізації фінського фашизму. Тепер багато хто змирився з тим, що фінська демократія чекає на своє останнє дихання."
 FIN_WORLD.26.a: "Демократія Фінляндії стоїть на межі загибелі."
 
 FIN_WORLD.27.t:0 "[Get_newspaper_header]Фінляндія легалізує соціялістичні партії"
 FIN_WORLD.27.desc:0 "Для полегшення того, що фінський народ вважає невигідною політичною ситуацією, та для примирення з фінським лівим, фінський парламент проголосував за легалізацію партій, що знаходяться лівіше за Соціал-Демократів.\n\nЦе є зворотним кроком після відомого інциденту 1956 року, коли членів Фінської демократичної робітничої партії та депутатів Шведської лівої партії було заарештовано за порушення антикомуністичних законів через їх опозицію до фінського ведення Західно-Російської війни.\n\nЛіві партії Фінляндії вже відреагували на більш лояльний режим - Фінська демократична робітнича партія (ФДРП) вже була відновлена і очікується, що вона здобуде значну частку голосів на наступних виборах."
 FIN_WORLD.27.a:0 "Ті більшовики тепер мають шанс!"
 FIN_WORLD.27.b:0 "Свобода для лівих!"
 
 FIN_WORLD.32.t: "[Get_newspaper_header]Кінець фінської демократії"
 FIN_WORLD.32.desc: "Для багатьох кінець демократії у Фінляндії був очевидним. Країною правлять як фашистський прем'єр-міністр Сусітаівал, так і фашистський президент Сімойокі, уряд Сусітаівала став більш зухвалим у своїх цілях з часом, сигналізуючи світу про свою підтримку та вплив з боку фашистських режимів.\n\nТепер настав цей день. По всій Фінляндії трансляції повідомили, що вибори 1969 року були скасовані, і, здається, назавжди. Попри всю серйозність цього акта, оголошення було досить стриманим у офіційних каналах, що подано як просто маленький крок в рамках більших планів. П'ятдесят років фінської демократії завершилися сьогодні. Як довго триватиме фашизм, покаже лише час."
 FIN_WORLD.32.a: "Європа потрапляє в наші руки."
 FIN_WORLD.32.b: "Навіть на півночі демократія в'яне з кожним днем."
 FIN_WORLD.32.c: "Європа згоряє та руйнується."
 
 FIN_WORLD.44.t:0 "[Get_newspaper_header]Фінляндія реформує політику Східної Карелії"
 FIN_WORLD.44.desc:0 "Після перемоги в Карельській війні та відновлення контролю над Східною Карелією та Мурманськом, фінський уряд постановив провести фундаментальні зміни в управлінні відновленими регіонами.\n\nПроведені реформи включають надання громадянства Мурманську, відновлення державних послуг на Кольському півострові та загальну інтеграцію російського населення в фінську націю. Це буде нелегко. Хоча фінський дух високий після розгрому МНР і перемоги над Росією, Мурманськ досі лежить у руїнах, а російське населення, хоч і переможене, все ще має невдоволення до своїх правителів.\n\nНезважаючи на ситуацію, російські партії були легалізовані, і очікується, що вони здобудуть місця на наступних виборах."
 FIN_WORLD.44.a:0 "Велика Фінляндія переживе, принаймні найближчим часом."
 
