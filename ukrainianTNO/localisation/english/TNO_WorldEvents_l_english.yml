 novel.1.t: "Спадкоємці Вавилону"
 novel.1.d: "\"Спадкоємці Вавилону\" - новий випущений художній роман, що описує 'альтернативну' всесвіт, у якій Третій Райх програв боротьбу з декадентським капіталістичним Заходом і змішаними державами Росії після того, як наш улюблений Фюрер був вбитий снайпером у 1935 році. Написаний корнським автором Ентоні Бівером, \"Спадкоємці Вавилону\" детально описують життя людей, які живуть у розділеному Берліні, Лондонії, Олександрії та Філадельфії - новій столиці Америки. Багато частин світу розділені між Імперським Домініоном Британії, які повернули свої традиційні трони в Німеччині та Франції; Об'єднаною Американською Федерацією, чиї кордони простягаються від Північного до Південного полюса; та підступним пан-Євразійським Союзом Совєцьких Соціялістичних Республік.\n\nФердинанд Федерстон - слідчий, детектив Британії з ліцензією на вбивство і підкорений тільки Її Величності. Шукаючи свою дружину в червоній Європі, він потрапляє в світову змову в Берліні. Перегони приводять його до Америки, Франції, Африки і, зрештою, до Гібралтару в серії сміливих втеч і швидкісних перестрілок.\n\nКлючовим моментом у романі є Кризис Гібралтарської ракетної кризи, напружене ядерне протистояння між домініоном та пан-Євразійським союзом, в той час як Об'єднана Федерація Америк намагається підштовхнути обидві сторони і спровокувати війну для власних цілей.\n\nРоман завершується невизначеністю, коли танки збираються на кордоні Гібралтару, а американський флот відмовляється відповідати на сигнали, кружляючи як грифони. Чи використає Фердинанд наймогутнішу зброю домініону? Чи врятує він жінку, яку любить..."
 novel.1.a: "Яка дитяча фантазія."

 novel.2.t: "Найбільша історія, яку ніколи не розповіли"
 novel.2.d: "Досить цікава альтернативна історія, яка привертає увагу в усьому світі, можливо, через всі неправильні причини.\n\n\"Найбільша історія, яку ніколи не розповіли\", випущена два тижні тому, самвидавом певним «Бодіном Клефтоном Діксі» (певно, псевдонімом), з малюнковою обкладинкою, яку деякі критики описали як «грубий малюнок танка з прапором Діксі, що наїжджає на нацистський прапор з серпом і молотом замість свастики, всередині бульбашки думок, що виходить з голови Джорджа Лінкольна Роквелла». \n\nРоман є дивним міркуванням про те, що якщо б Роквелл не був вбитий «юдео-більшовиками», він би створив «найбільшу історію в історії людства» і продовжує звинувачувати його смерть у «страху євреїв від того, які істини він міг би написати».\n\nРоман привернув увагу, завдяки своїм дивним тоном і твердженням, таким як: «Нацистська Ґерманія була бастіоном юдео-більшовизму», оскільки вона була «керована партією, яка є соціялістичною до того, як націоналістична» серед багатьох інших... дивовижних тверджень, які, на диво, є комічними, отже, здобули широку популярність в США та за кордоном."
 novel.2.a: "... Я ніколи не думав, що буду сміятися так знову. О Господи..."

 novel.3.t: "Людина в залізній фортеці"
 novel.3.d: "Науково-фантастичний автор Філіп К. Дік випустив свій останній роман, під назвою \"Людина в залізній фортеці\". Робота в жанрі альтернативної історії, цей роман відбувається в дистопічному світі, де комунізм царює безперешкодно. «Точка відмінності» в історії розповідає про те, що соціялістичний політик Юджин Дебс залишився в Демократичній партії, ставши президентом у 1920 році. В результаті він підтримав народжений Совєцький Союз та рух 4 травня в Китаї. Переконання Дебса померли з ним у 1926 році, і його наступник Роберт Ла Фоллетт виявився значно більш ізоляціоністом, тенденція якого домінувала в американській політиці наступні двадцять років. Тим часом, Совєцький Союз став під контролем авторитарного Фелікса Дзержинського, а комуністи під керівництвом Мао Цзедуна змогли об'єднати Китай і контр-наступати на Японію. Коли нацисти прийшли до влади, вони змогли розгромити союзницькі держави Європи, але не були готові до несподіваного совєцького вторгнення, яке швидко призвело до їх поразки. У 1947 році спільна китайсько-совєцька армія вторглася в Америку, розділивши країну на південь і північ.\n\nРоман відбувається в окупованій Америці та слідує за великою кількістю персонажів, від шпигуна Чеки до китайського чиновника, який одержимий американською ковбойською культурою. У центрі сюжету знаходиться книга під назвою «Звір серед очеретів», яка розповідає про світ, де нацизм і комунізм були подолані. Політичний фон - це швидке розпадання китайсько-совєцьких відносин; Дзержинський помирає, і його наступник - ще більш тоталітарний Лаврентій Берія, і загроза ядерної війни нависає на горизонті.\n\nПопри критику роману за незрозумілі розвитки (зокрема, що совєцькі спорудили величезний міст через Берингову протоку між Росією і Аляскою), Дік відстояв ці події, вважаючи їх можливими за наявною на той час інформацією. Це не зупинило книгу від того, щоб стати бестселером у США та Канаді, і вона вже була номінована на Премію Хьюго."
 novel.3.a: "Пф, яке ревізіоністське безумство!"
 novel.3.b: "Якби тільки..."
 novel.3.c: "Що, що звичайна історія тепер стала занадто нудною для читачів?"

 novel.4.t: "Страх і відраза в Лос-Анджелесі"
 novel.4.d: "На початку цього місяця відомий автор і засновник журналістики ґонзо Хантер С. Томпсон випустив свою нову книгу «Страх і відраза в Лос-Анджелесі». Події роману розгортаються в сюрреалістичному альтернативному історичному всесвіті, де майже не існує правил. Це багатогранна сатира на інші, більш серйозні альтернативні історії, а також гостра критика культури Сполучених Штатів 1970-х років.\n\nТомпсон витрачає десятки сторінок, щоб описати деталі кожної «точки розбіжності» - дивні вміння у межах основної історії, що детально розповідають, як цей світ став відрізнятися від нашого. Нереспектабельні та часто безглузді, ці історії описують абсурдні епізоди, такі як японський лікар з підрозділу 731, який випадково спробував галюциногенний наркотик власного виготовлення, що призвело до того, що він скидав армію «мутантів», накачаних наркотиками, на центр Токіо. Хоча критики розділені щодо цих історій, звичайні читачі, втомлені від перенасиченості ринку фікцій дешевими, надмірно серйозними «альт-історіями», знайшли їх дивним, але приємним відволіканням від норми.\n\nПоєднуючи ці епізоди, Томпсон створив вільний сюжет у альтернативному Лос-Анджелесі, в основному складаючись із дешевих алегорій для атаки на сучасну американську політичну культуру. У одній запам'ятовуваній сцені вулична банда, яка точно моделюється за зразком йоккістів, б'є демонстрацію «старих юппі-біготів» (підтримувачів Ніксона, яких також називають «кровожерливими монстрами»), все це на тлі п'яного Томпсона, який спостерігає з дитячою радістю.\n\nХоча критики та читачі розділені щодо цього роману, більшість хоча б визнає, що це різка і ефективна критика поточної літературної та політичної ситуації."
 novel.4.a: "... Це інше, мабуть."

 novel.5.t: "Червоний світанок"
 novel.5.d: "Після падіння Лондона письменник Ерик Блер, більше відомий під псевдонімом Джордж Орвелл, здобув популярність завдяки своїм політичним працям, написаним в екзилі в Канаді. Сьогодні він випустив своє найдовше творіння: останню частину серії альтернативної історії «Спадок Великої війни», «Червоний світанок». Ця серія розгортається в всесвіті, де Центральні Держави виграли Першу світову війну, і отримала критичну увагу за свою алегоричну деконструкцію нашого світу.\n\nПісля поразки Антанти, уряди Британської імперії та Франції швидко розпадаються і замінюються соціялістичними республіками, в той час як Росія в кінцевому підсумку стає фашистською диктатурою під керівництвом білого революціонера Бориса Савінкова. Після об'єднання з метою знищити Ґерманську імперію, її союзників і залишки Антанти, альянс швидко розпадається, а лібертаріанський синдикалістський Комун Франції і Союз Великої Британії під керівництвом Освальда Мослі створюють свої міжнародні організації і вступають в апокаліптичну ядерну війну, що залишає Європу та Північну Америку в руїнах, в той час як Росія і Японія вступають у подібну деструктивну розколину. Світ до 1962 року зруйнований ядерними наслідками та розділений чотиристороннім перемир'ям, що загрожує як знищити цивілізацію, так і підкорити її під різними формами тоталітаризму.\n\nЗавершуючи роман тим, що «англійський соціяліст» Американська Співдружність розпадається на Третю американську громадянську війну, коли білосупрематисти повстають на Півдні, роман отримав аналіз за складні паралелі з насильницькими конфліктами, що відбуваються по всьому світу, хоча деякі відкидають його як нічим не відмінний від решти надмірної кількості альтернативних історичних романів, які заповнили книжкові полиці останніми роками. Відповідаючи на критику, Орвелл зауважив непомірність цього всесвіту, написавши: «... цей всесвіт не менш дивний, ніж те, що сталося у нашому за останні півстоліття.»"
 novel.5.a: "Ми живемо в дитячій фантазії, чи не так?"

