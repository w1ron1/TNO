 novel.10.t: "Пекло іншої планети"
 novel.10.d: "Роман «Пекло іншої планети» вийшов сьогодні, надаючи автору, Олдосу Гакслі, чималу репутацію завдяки своїм темам та сюжетній лінії. Книга розгортається в альтернативній реальності, де Адольф Гітлер помирає під час своєї невдалої спроби перевороту в 1923 році і ніколи не здобуває влади, натомість його заміщає монархістська DNVP та її лідер Альфред Хугенберг. У Росії Микола Бухарін програє Йосипу Сталіну, який централізує владу та створює майже жахливу диктатуру, що зміцнює союз. Друга світова війна починається новоутвореною Німецькою Орденсштадт, військовим хунтою, підтримуваною кайзером, і очолюється Хугенбергом, Ервіном Роммелем та Еріхом Людендорфом (у книзі хунта називається Радою хрестоносців).\n\nКнига розгортається під час війни, в окупованій Франції. Її героїня, Анна-Марі Манушіан, спочатку працює професором хімії в університеті, але стає виробником бомб після того, як школа закривається, а багато викладачів заарештовані за просування анти-німецьких ідеалів. Під час своєї боротьби вона зустрічає двох інших головних персонажів; Джека, агента OSS, який допомагає спротиву, та Миколу, совєцького агента, що постачає зброю комуністичним міліціям. У процесі розвитку сюжету виникають три основні фракції; по-перше, Імперська Антанта, фракція, очолювана більш реакційним Об'єднаним Королівством та Бонапартистською Францією. По-друге, Союз Совєтів, фракція, очолювана Росією, яка прагне поширити світовий комунізм. І на кінець існує Тихоокеанська об'єднана група оборони, альянс, очолюваний більш демократичною Японією та Сполученими Штатами.\n\nКнига завершується тим, що Анна-Марі стає свідком ядерного бомбардування міста Дрезден, під час якого Микола каже: «Це не кінець, а початок світу, розірваного вогнем. Ваші діти будуть комуністами, або ви не матимете дітей». Книга була критикована багатьма за надмірно песимістичний настрій і велику кількість деталей, але інші наполягають, що це могло статися, якби події розвивалися інакше. Гакслі захищав роман, заявивши: «Як би не було сумно, ми принаймні можемо бути вдячні за те, чого не сталося»."
 novel.10.a: "Що за дитяча фантазія!"

 novel.11.t: "Синій порядок"
 novel.11.d: "Цікава художня робота привернула увагу по всьому світу за останні кілька тижнів. Цей роман під назвою «Синій порядок», написаний під псевдонімом «Майлз Ллойд», описує світ, у якому радикальний авторитарний політик балотується на пост президента США в 1932 році, асоційований з відродженою «Партією Великого Оленя». Цей президент, якого читачі знають лише як «президента», швидко консолідує свою владу під виглядом захисту Америки, і стрімко перетворює американську економіку на таку, що ґрунтується на підготовці до «можливої війни». З цією метою він висуває ультиматум нацистській Німеччині під час ремілітаризації Рейнланду в 1936 році. Будь-які подальші військові дії зустрінуться з миттєвою американською відплатою. Після Аншлюсу Австрії президент оголошує війну Німеччині під виглядом «збереження свободи».\n\nІсторія в цьому світі втрачається на два десятиліття. В якийсь момент світу розкривається, що він був розірваний Другою світовою війною. У Росії совєти втратили всю Східну Сибір від Американської республіки, в той час як смерть Бухаріна кидає решту в хаос. В Азії держава Японії перебуває під наглядом Америки, оскільки раніше програла їй. В Європі Британські острови, Іберія та Італія залишаються останніми великими незалежними регіонами, створивши дивний альянс демократії та фашизму, де совєти були попереднім членом до смерті Бухаріна. В решті континентальної Європи американські маріонеткові «республіки» перебувають під замком. Проте американський контроль не є абсолютним, оскільки існують різні воєнні держави, які чекають на захід сонця, щоб визволити свої батьківщини.\n\nОднак президент не може жити вічно, і після його вбивства в кінці роману сонце починає перетинати горизонт, коли доля людства висить на волосині."
 novel.11.a: "Який це світ..."

 novel.12.t: "Окупація"
 novel.12.d: "Нова книга розлітається з полиць по всьому світу, активно циркулюючи навіть на чорних ринках Німеччини. Названа «Окупація», ця книга описує альтернативну історію, де німці зазнають поразки у Другій світовій війні. У книзі Японія занурюється в громадянську війну з комуністами та втрачає свої позиції на континентальній Азії. Хоча імператор зрештою перемагає, Японія ніколи не відновлюється і вибирає заліковувати свої рани, а не продовжувати завоювання, які вона робила у нашому світі. Тому, коли німці починають наступ на Англію і США, зрештою, втручаються, вони не відволікаються на бойові дії в Тихому океані і врешті-решт перемагають і окуповують Німеччину. Переможена Райх поділяється на дві частини: Ґерманську Народну Республіку, совєцьку маріонеткову державу на півночі, та Республіку Німеччину, союзну окупаційну зону з самоврядуванням на півдні, в Рейнланді та Австрії. Їх часто називають Північна та Південна Ґерманія в книзі. Знову ж таки, на півдні Німеччини обирається націоналістичний та реваншистський уряд, схожий на підйом Гітлера в нашому світі. Навчившись на помилках минулого, Південна Ґерманія швидко зазнає вторгнення і старий уряд відновлюється силами союзників. Історія слідує за бідним німецьким юнаком, якого вважають націоналістом західними окупаційними силами. Хоча на початку книги це не так, його безпідставне переслідування окупантами зрештою призводить його до становлення націоналістом, і книга натякає, що це частина нескінченного циклу, який завжди призводить до гноблення та насильства з одного боку. Також натякається, що подібне і набагато небезпечніше може статися з Японією, яка вже відновилася.\n\nКнига викликала надзвичайно суперечливі відгуки. Багато хто стверджує, що це нацистське чтиво, яке намагається очистити їх від провини і натякає, що їх реакція на Версаль був обґрунтованою. Інші вважають, що це просто нереалістично, і що комуністичний рух Японії не був би достатньо сильним, щоб завдати такого шкоди, як описано в книзі. Автор стверджує, що всі вони не розуміють основної ідеї, і що книга більше про повідомлення, а не про обстановку."
 novel.12.a: "Можливо, нам слід зосередитись на реальних проблемах, а не на цій дурниці."

 novel.13.t: "РСР-Остпруссія"
 novel.13.d: "Цього тижня автор Лен Дайтон опублікував свій новий роман «РСР-Остпруссія». Роман відбувається в альтернативній історії, де Михайло Тухачевський здійснює переворот проти Бухаріна наприкінці 1920-х років, перетворюючи Совєцький Союз на військову державу, порівнянну з Францією Наполеона. «Новий Бонапарт», як його називають, здійснює численні вторгнення до Східної Європи та Скандинавії, коли решта світу ще оговтується від Великої депресії і не може відповісти, що значно зміцнює позицію Совєтів. Гітлерівська Ґерманія стикається з набагато сильнішим супротивником у цьому союзі, і війна між двома триває багато років, поки обидві сторони не змушені укласти мир після того, як кожна з них одночасно відкриває атомну бомбу, а міста Кенігсберг і Київ знищуються.\n\nІсторія зосереджена на комісарі Червоної Армії, якому доручено наглядати за відновленням совєцького Кенігсберга, тепер перейменованого на Троцькоград після одного з близьких соратників Тухачевського. Під час розслідування вбивства відомого урядовця комісар потрапляє в заплутану павутину змов, що охоплює вищий командний склад Совєтів, місцевий гарнізон і партизанів серед важко пригноблених і радіаційно постраждалих німецьких мешканців міста. В кінці роману комісар ледь уникає смерті від рук своїх начальників і розкриває змову, яка намагається провокувати Райх на нову війну.\n\nКнига отримала похвалу за унікальний підхід до жанру «нуар» і свою похмуру атмосферу на фоні зруйнованих вулиць Троцькограда. Деякі критикують її за дещо симпатичне зображення німецьких персонажів, і деякі навіть пропонують, що у Дайтона можуть бути нацистські ідеї. Незважаючи на це, роман вже мав досить успішний перший продаж і, ймовірно, стане основною частиною жанру альтернативної історії на багато років."
 novel.13.a: "Цікава історія, але це все, звісно, фантазія."

