l_english:

#just all the events lol#
itatur.1.t:0 "Операція Чорний Бик"
itatur.1.d:0 "Гей, друже, ти не повинен грати за Туреччину, поки не вийде Penelope's Web. Ці події раніше посилалися на Тюркеша як лідера, а тепер, коли його немає, вони більше не мають сенсу, тож насолоджуйся заповнювачем."
itatur.1.a:0 "Ми переможемо!"

itatur.2.t:0 "Туреччина перемогла"
itatur.2.d:0 "Гаразд, геймери, ми це зробили, італійці повністю розгромлені. (ГАРНИЙ КІНЕЦЬ)"
itatur.2.a:0 "Надішліть угоду!"

itatur.3.t:0 "Італія тримається"
itatur.3.d:0 "Незважаючи на всі зусилля турків, наші війська на Близькому Сході змогли стримати їхні атаки та зупинити наступ. Згідно з повідомленнями наших розвідмереж, турецький уряд у паніці через затягування війни та економічні труднощі, що робить цей момент ідеальним для висунення умов миру.\n\nУ залах Великої ради дві пропозиції щодо Туреччини набули популярності. Перша, від нашого Дуче Чіано, досить поміркована. Він пропонує вимагати репарації від турецького уряду та демілітаризацію району Дамаска, щоб Туреччина більше не загрожувала нашій присутності на Близькому Сході. Друга пропозиція, від суперника Чіано у партії, Скорци, передбачає передачу деяких територій турків – зокрема Дамаска та Мосула в Іраку. Він стверджує, що турки знають, що програли, і приймуть ці умови, а ці регіони забезпечать нам доступ до нових багатств і покращать відносини з нашими іракськими союзниками. Тепер залишається лише проголосувати за один з варіантів."
itatur.3.a:0 "Пропозиція Чіано ратифікована й відправлена."
itatur.3.b:0 "Пропозиція Скорци виглядає привабливішою, ми повинні натиснути далі для більшої вигоди."

itatur.30.t:0 "Імперія залишається сильною"
itatur.30.d:0 "Оскільки наші хоробрі італійські солдати просуваються далі вглиб Туреччини, стає очевидним, що ми здобули перемогу. З Дамаском під нашим контролем у нас більше важелів впливу, ніж раніше.\n\nКарло Скорца чітко дав зрозуміти Великій Раді, що для збереження міцності Італійської імперії ми повинні отримати нові території. Його слова раніше дозволили нам продовжувати боротьбу в Леванті. Але тепер, коли Туреччина на колінах, ми нарешті можемо висувати наші вимоги."
itatur.30.a:0 "Пропозиція Скорци буде надіслана туркам."

itatur.4.t:0 "Інөню висуває свої вимоги!"
itatur.4.d:0 "Оскільки ми рішуче програли битву на Близькому Сході, турецький президент Ісмет Інөню висунув нам свої вимоги. У них він зазначає, що в обмін на збереження Леванту за нами, ми маємо передати туркам наші володіння в Додеканесі, на Кіпрі та в Лівані.\n\nУ нашому поточному становищі у нас немає вибору, окрім як прийняти ці умови."
itatur.4.a:0 "У нас немає іншого вибору, окрім як погодитися."

itatur.5.t:0 "Чіано висуває свої вимоги!"
itatur.5.d:0 "Італія якось крінжова, не знаю, чому ви дали їм перемогти."
itatur.5.a:0 "Гадаю, вони згодяться, надсилаємо нашу відповідь."

itatur.6.t:0 "Пропозиція на нашому столі"
itatur.6.d:0 "Скорца, ти ідіот, ми не приймемо."
itatur.6.a:0 "Звісно, ми відмовляємося."

itatur.7.t:0 "Турки відмовляються від пропозиції!"
itatur.7.d:0 "Прокляті турки відмовилися від нашої пропозиції! Вони заявляють, що все ще тримають фронт і що Ірак взагалі не брав участі у війні, тому вони не можуть прийняти такі умови. Тепер перед нами вибір – спробувати взяти їх на слабо і надіслати ту саму пропозицію ще раз або погодитися на більш помірковану угоду Чіано."
itatur.7.a:0 "Спробуємо взяти їх на слабо – відправити ту саму пропозицію ще раз."
itatur.7.b:0 "Очевидно, нам потрібно запропонувати щось більш розумне, відправимо пропозицію Чіано."

itatur.8.t:0 "Пропозиція Скорци – дубль два"
itatur.8.d:0 "Італія переживає геймерський момент."
itatur.8.a:0 "Це жарт якийсь! Ми знову відмовляємося."

itatur.9.t:0 "Пропозицію знову відхилено"
itatur.9.d:0 "Турки знову відхилили угоду Скорци, наводячи ті самі причини, що й минулого разу. У Великій Раді дедалі більше людей наполягають на тому, що слід використати угоду Чіано, адже очевидно, що турки за жодних обставин не погодяться на умови Скорци. Втім, Скорца та його найвідданіші прихильники в Раді вперто продовжують боротися за свою угоду."
itatur.9.a:0 "Третій раз — щасливий, як кажуть. Надіслати знову."
itatur.9.b:0 "Це марно, просто надішліть угоду Чіано."

itatur.10.t:0 "Угода Скорци – третя спроба"
itatur.10.d:0 "Італійці занадто нас зацькували, доведеться погодитися :("
itatur.10.a:0 "У нас немає вибору..."

itatur.11.t:0 "Сутичка в морі"
itatur.11.d:0 "Надійшли тривожні повідомлення з морського відомства на Родосі. Вчора наші патрульні катери зіткнулися з турецькими кораблями. Зазвичай такі зустрічі проходили чемно, але цього разу турки через гучномовець заявили, що італійські кораблі знаходяться в турецьких водах і порушують їхній суверенітет. Зав'язалася суперечка, під час якої наші моряки справедливо наголошували, що вони перебувають у італійських водах, адже знаходяться всього за кілька морських миль від бази на Родосі.\n\nРаптово турки замовкли, а потім відкрили вогонь по італійських суднах. Наші моряки відповіли пострілами, і ситуація миттєво загострилася. До місця інциденту було вислано крейсери, що призвело до напруженого протистояння між турецьким та італійським флотами. Після серії термінових переговорів між морськими штабами Родосу та Мармариса кораблі зрештою відступили до своїх портів, на щастя, без жертв.\n\nЦя доповідь підтверджує наші найгірші побоювання: Туреччина планує наступ на нас та наші території, які вона вважає своїми. Вже розпочато заходи з посилення оборони, а італійські військові частини та морські бази у всьому Східному Середземномор'ї приведені у стан підвищеної бойової готовності."
itatur.11.a:0 "Ми повинні бути готові до найгіршого."

itatur.12.t:0 "Наші війська атаковані італійцями!"
itatur.12.d:0 "Смерть італійському імперіалізму!"
itatur.12.a:0 "Посилити патрулювання та направити війська для зміцнення кордону. Війна неминуча."

itatur.13.t:0 "Заворушення на Кіпрі"
itatur.13.d:0 "Зі східних територій надходять усе гірші новини.\n\nТурецьке населення Кіпру завжди було незадоволене перебуванням під владою Італійської імперії, а з огляду на останнє загострення напруженості між нашими країнами ситуація стала критичною.\n\nМісцеві карабінери були направлені для забезпечення порядку під час майбутнього мітингу таксимджилерів, однак організатори акції несподівано накинулися на правоохоронців. Незабаром мирний протест переріс у масові заворушення: поліцейських закидали камінням, і натовп пішов у наступ. Після прибуття підкріплення завдяки стійкості наших офіцерів вдалося взяти ситуацію під контроль, і зрештою натовп розійшовся.\n\nНапруга між Туреччиною та Італією вже на межі вибуху, і губернатор Кіпру оголосив на острові воєнний стан."
itatur.13.a:0 "Принаймні, греки поки що мовчать..."

itatur.16.t:0 "Тріумф у Родосі!"
itatur.16.d:0 "Останні італійські солдати поспіхом відступили з узбережжя Родосу, і ми здобули вирішальну перемогу над італійськими силами в Егейському морі.\n\nПопри те, що італійські війська давно готувалися до можливого нападу, наші солдати прорвали оборонні укріплення противника, скориставшись як абсолютною перевагою в повітрі, так і ефектом несподіванки. Спочатку було захоплено сусідній острів Сімі, після чого наш флот висадив кілька полків піхоти на північно-східному узбережжі Родосу, швидко взявши під контроль більшу частину острова. Хоча поодинокі бої в гірській місцевості тривали ще 13 днів, організований опір було остаточно зламано, коли Італія вивела всі вцілілі війська, остаточно закріпивши нашу перемогу.\n\nЗавоювання Родосу і прилеглих територій значно посилює контроль Туреччини над Егейським морем.\n\nКоли турецькі солдати крокують поміж давніх руїн, багато хто сприймає цю перемогу як знамення майбутніх звершень. Завдяки цьому успіху італійці тимчасово втратили можливість проєктувати свою силу в Егейському регіоні, що ставить нас у чудову позицію для подальшого наступу. Крім того, ця перемога стала потужним пропагандистським інструментом: новини про наш тріумф широко поширюються як у Туреччині, так і в Італії, що зміцнює бойовий дух і наближає нас до нових звершень на Близькому Сході."
itatur.16.a:0 "Нарешті, Родос – наш!"

itatur.20.t:0 "Родос падає під натиском турків!"
itatur.20.d:0 "Полк Марте мав не більше ніж день попередження про останній турецький наступ. Солдати, розбуджені наказами командира, насилу піднімалися з ліжок у казармах у якусь нечестиву годину, перебуваючи між сном і явою. Єдиним джерелом світла був тьмяний місяць у небі.\n\nОчікувалося, що турецькі війська кинуться атакувати італійські військові об’єкти на Родосі, але не з такою люттю і не в такі стислі терміни. Завдяки добре спланованому спільному наступу турки зруйнували всі попередні прогнози щодо їхніх дій у цьому регіоні. Обійшовши Родоську протоку та добре укріплені італійські позиції, турецький флот зміг захопити острів Сімі на північ від Родосу, а потім використати його як плацдарм для координації нічної атаки. Внаслідок цього північно-східна частина Родосу була зайнята невеликими контингентами піхоти, яких підтримувала тотальна перевага в повітрі. Але полк Марте дізнався про це лише через кілька тижнів із газетних статей, які турецькі офіцери зачитували вголос із насмішкою.\n\nТе, що вони знали тоді – це що невеликий турецький загін якимось чином висадився на острові, проте без належного постачання та без можливості серйозно загрожувати італійському контролю. Однак нічна сутичка під Кремасті та нищівна поразка італійців були не випадковістю і не окремим інцидентом, а лише провісником подальших подій. Подібні маневри розгорталися й на півночі, у володіннях Італії, і вважалося, що її влада над Егейським морем після втрат у кампанії не відновиться – принаймні, до кінця війни. Родос протримався приблизно 13 днів, після чого італійські війська були змушені евакуюватися, а Марте та решта його полку опинилися в полоні. Відтоді вони дізнавалися про хід війни лише через газетні статті та настрій коменданта табору під час ранкових перекличок."
itatur.20.a:0 "Це катастрофа!"

itatur.100.t:0 "[Get_newspaper_header]Війна в пустелі"
itatur.100.d:0 "З моменту закінчення Другої світової війни Туреччина залишалася незадоволеною своєю часткою здобичі: надто багато турків опинилися за межами її кордонів. Сьогодні ці давні напруження переросли у відкритий конфлікт – президент Туреччини Ісмет Іненю оголосив, що між Турецькою Республікою та Італійською імперією існує стан війни.\n\nПопри те, що вони були колишніми союзниками, війна отримала надзвичайну популярність у Туреччині. Молоді націоналісти марширують вулицями Анкари, вигукуючи "Веди нас до перемоги, Іненю!". У порівнянні з цим, в Італії суспільство виявляє слабку підтримку війни, багато хто ставить під сумнів, чому Італія взагалі тримає війська на Кіпрі."
itatur.100.a:0 "Ще одна імперіалістична війна."
itatur.100.b:0 "Ми їх розгромимо."
itatur.100.c:0 "Ось як вони ставляться до колишніх союзників..."

itatur.21.t:0 "Італійська перемога на Родосі"
itatur.21.d:0 "Як і очікувалося, наші сили успішно відбили турецький наступ на Родос. Хоча цей короткий конфлікт був лише частиною ширшої кампанії турків, спрямованої на завоювання спірних територій після краху Тріумвірату, перемога широко висвітлюється в пресі та святкується в Римі.\n\n"Мужність італійської армії витримає будь-яку атаку!" – заявив Чіано у своїй промові зі столиці. "Турки не змогли перемогти нас на Родосі і не переможуть нас у Леванті!"\n\nХоча цей успіх ще не гарантує перемоги на Близькому Сході та не забезпечує довговічність Імперії, принаймні на Родосі італійський прапор продовжує майоріти."
itatur.21.a:0 "Viva L'Italia!"

italy_turkey_war:0 "Італо-турецька війна триває"
SNS_Lebanese_Resistance:0 "Ліванський Опір"