 ALG_La_Salle_Guerre:0 "Зала війни"
 ALG_La_Salle_Guerre_desc:0 "Жах нависає над кожним куточком Алжиру, коли він занурюється в хаос. Бомби закладають у кожній кімнаті, постріли лунають у кожному провулку. Життя чоловіків і жінок, які стають їхніми жертвами, нічого не важать у цій так званій «брудній війні», важливе лише повідомлення, яке вона надсилає, та страх, який вона вселяє в серця бойовиків і цивільних. Звичайні методи ведення війни швидко відходять убік, оскільки межі між комбатантами та некомбатантами стираються.\n\nКолись прекрасні, а тепер залиті кров'ю краєвиди Алжиру охоплені полум'ям, розпаленим жаринами люті."
 ALG_Mourir_Debout:0 "Померти стоячи"
 ALG_Mourir_Debout_desc:0 "Бійці Фронту національного визволення правильно обрали померти стоячи, а не жити на колінах. Кожен алжирець, який узяв до рук зброю, — ще один солдат, готовий битися до смерті за свободу Алжиру, а таку віддану армію неможливо здолати. Однак зворотним боком цього є те, що більшість алжирців, які беруть до рук зброю, далекі від професійних вояків. Наші солдати битимуться до останнього, і через брак організаційної тактики зрештою їм, можливо, доведеться саме так і зробити."

 ALG_Roots__Oujda_Clan:0 "Коріння Уджданського клану"
 ALG_Roots__Oujda_Clan_desc:0 "Так званий «Уджданський клан» був важливою опорою структури ФНВ від самого його заснування у 1950-х роках. Попри свою назву, це не впливова родина, яка користується широкою владою, і не династія, з якої обирають нашого лідера. Натомість так називають тісно згуртовану групу, що сформувалася навколо полковника Хуарі Бумедьєна в його штабі в місті Уджда. Як командувач АНВ, військового крила ФНВ, Бумедьєн зробив значний внесок у наш успіх у війні за визволення.\n\nОднак із завершенням бойових дій вплив цього Уджданського клану починає викликати серйозне занепокоєння в деяких колах. Завжди виняткова група, після закінчення війни вона стала ще більш закритою. Є навіть тривожні повідомлення про те, що члени Уджданського клану ставляться до Бумедьєна з майже культовою пошаною. На чолі фракції, що швидко формується проти Уджди, стоїть прем'єр-міністр Ахмед Бен Белла. Лише питання часу, коли ці двоє чоловіків відкрито зійдуться в боротьбі за владу в новій алжирській державі."
 ALG_Shining_Star:0 "Сяюча зірка"
 ALG_Shining_Star_desc:0 "Ми здійснили диво — після ста тридцяти років французького правління ми створили державу, яка не схиляється перед жодним іноземним господарем. Наша війна за визволення може бути найуспішнішим антиколоніальним рухом сучасності. Пригноблені народи по всьому світу звернули увагу на наш тріумф, і найбільше — наші товариші по Північній Африці та Близькому Сходу, багато хто з яких надіслав цінну підтримку в час нашої скрути. Ми стали чимось більшим за окремий рух — ми є прикладом для тих, хто прагне незалежності власної батьківщини."
 ALG_Min_Djibalina:0 "Мін Джибаліна"
 ALG_Min_Djibalina_desc:0 ""З наших гір долинали вигуки вільних людей, що кликали нас до незалежності."\n\nТепер, коли ми скинули ярмо гнобителів, ми більше ніколи не дозволимо надягнути його на наші шиї. Це була жорстока боротьба, але, як і всі боротьби за свободу, вона була необхідною. І все ж, якщо минулий досвід чогось нас і навчив, то це того, що ми не можемо спочивати на лаврах перемоги. Ми вигнали європейців, але немає підстав вважати, що вони просто залишать Алжир у спокої. Ми стежитимемо з вершин гір за їхнім поверненням і знищимо їх, якщо вони наважаться повернутися. Ми нарешті здобули власну державу й ніколи не підкоримося її втраті.\n\n"Ми — левенята, тож дозвольте нам допомогти вам зустрітися з вашими ворогами.""
 FLA_Il_Est_Mort_Sans_Une_Fleur:0 "Він помер без квітки"
 FLA_Il_Est_Mort_Sans_Une_Fleur_desc:0 "Попри свою військову перемогу в Алжирі, французький режим стикається з безліччю проблем як переможець. Масштаби, до яких військова адміністрація вдалася в ім'я умиротворення, вважаються надмірними навіть членами спільноти п’є-нуар, не кажучи вже про корінну більшість, чиї свободи постійно обмежуються; На півдні загони «феллагів» продовжують проводити дорогі диверсійні операції проти французького уряду. Метрополія, яка сама періодично стикається з кризами, щомісяця має дедалі менше ресурсів, які може спрямовувати до Алжиру, а Рим і Мадрид ставляться до цього обережно, якщо не відверто вороже, через порушення їхніх зон впливу в Алжирі. Найгірше те, що дедалі більше родин п’є-нуар прагнуть емігрувати до інших середземноморських держав, щоб утекти від економічної стагнації, поступово руйнуючи етнічний статус-кво, заради збереження якого ми вели цю війну."
