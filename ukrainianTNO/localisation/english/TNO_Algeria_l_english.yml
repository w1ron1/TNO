#Salvaged Events
 ### Events ###
 Algeria_Skeleton.1.t:0 "Кінець Ґнота"
 Algeria_Skeleton.1.desc:0 "Анрі щосили намагався не заплющувати очі, борючись зі сном, який з кожною годиною знову загрожував здолати його. Нічне чергування в Алжирських казармах зазвичай було тихим, але сьогоднішня ніч була особливо мовчазною. Зазвичай принаймні один із укомплектованих особовим складом постів дивізії в Ель-Аснамі вже встиг би вийти на зв'язок, але досі не надійшло жодного повідомлення. Анрі подумав, що, враховуючи обставини, це, мабуть, навіть добре, адже останніми ночами більшість повідомлень стосувалася рейдів. Звісно, нічого надто серйозного, ці прославлені бандити, ймовірно, вже майже виснажилися, але цього було достатньо, щоб Анрі залишався напоготові на своєму посту. Проте сьогодні для подальшої пильності знадобилася б кава, а його кухоль був порожній. Він подивився на нього сонними, розчарованими очима.\n\nАнрі був уже на півдорозі до того, щоб перелити спільний казарменний казан у свій кухоль, коли приймач затріщав і захрипів. Після стількох годин тиші цей раптовий різкий звук змусив молодого солдата від несподіванки впустити кухоль. Навіть коли кава почала розтікатися холодною підлогою казарм, Анрі вже стрибнув у крісло, вихопив приймач і підніс його до вуха.\n\nРізке потріскування тривало, боляче відлунюючи в його черепі, але Анрі міцно тримав приймач, схвильовано чекаючи звістки від когось із товаришів. Слова, що нарешті пролунали в нерухомому повітрі кімнати, були уривчастими, але голос легко можна було впізнати — це був Філіп із роти B другого батальйону: «...хтось є? Це... пост номер п'ять... район Ель-Аснам... потужна атака... атака ФНВ... повідомлення про подібні атаки по всьому району... зв'язок нестабільний... надішліть допомогу... нас чисельно переважають і ми поступаємося озброєнням... Merde! Merde! —»\n\nЛінія зловісно замовкла, і Анрі знову залишився в тиші ночі, стоячи приголомшений, коли до нього почала доходити реальність ситуації. Якщо ці атаки були спрямовані на засоби зв'язку, то не дивно, що все здавалося таким тихим. Це був загальний наступ, повномасштабна атака ФНВ.\n\nДесь у місті вибух розірвав спокій."
 Algeria_Skeleton.1.a:0 "Це лише перший із багатьох."
 Algeria_Skeleton.1.b:0 "За вільний Алжир!"
 
 Algeria_Skeleton.2.t:0 "Якщо дерево падає в лісі..."
 Algeria_Skeleton.2.desc:0 "Штурмбаннфюрер СС Ваґнер переглянув послання, яке знайшов на підлозі кімнати для нарад. Зважаючи на загальний безлад — документи всіх видів були розкидані навколо, наче уламки після бурі, — неважко було здогадатися, що її мешканці поспіхом покинули її, тікаючи від наступу Бургундії. Його наступу.\n\nЦей документ, як і решта, був написаний французькою, але увагу німця привернув його заголовок, надрукований великим жирним шрифтом, який просто не міг не впасти в око.\n\n«LA SITUATION D'URGENCE EN ALGERIE» — так він називався, а дата була лише кілька днів тому. Будучи гордим чоловіком СС, Ваґнер ніколи не вивчав мову, хоча останнє десятиліття свого життя провів, розквартирований на колишній французькій території. Зробити це означало б принизити себе, визнати, що в переможеного народу є щось, чого варто навчатися. І все ж десять років у Кале означали, що хоче він того чи ні, йому доводилося чути чимало цієї огидної мови. Тож він зміг розібрати окремі уривки повідомлення, а там, де не міг розшифрувати значення за допомогою лінгвістики, намагався зробити висновки з контексту.\n\nЗдавалося, доля не усміхалася цим так званим «п'є-нуарам». На них напала якась група, ідентифікована як «Front de liberation nationale» — це принаймні було досить легко зрозуміти. Більша частина деталей залишилася незрозумілою німецькому офіцеру, але з листа він міг відчути відчай і благання. Це було жалюгідно, подумав він із глузливою посмішкою, що народ, який принаймні теоретично мав частку північної крові, був доведений до такого скрутного становища простими дикунами. Ще більш ганебною була нездатність французької держави захистити власних поселенців. Уся ця справа викликала у Ваґнера огиду й переконала його ще більше, що французька нація заслуговує на те, щоб її назавжди стерли з карти світу. Пізніше, коли він повернувся до своїх людей, він покаже їм листа й посміється з усієї цієї безглуздої ситуації."
 Algeria_Skeleton.2.a:0 "Схоже, французи не в тому стані, щоб комусь допомагати."
 
 Algeria_Skeleton.3.t:0 "Їхнім високоповажним каудильйо Іспанії"
 Algeria_Skeleton.3.desc:0 "Франсиско Франко перечитав записку, яку доставили йому та його співкаудильйо Антоніу Салазару того ранку.\n\n«Я не бачу жодної потреби навіть розглядати це прохання, для мене очевидно, що ми зобов'язані надати будь-яку допомогу, яку тільки можемо». Салазар завжди був украй наполегливим у підтримці захисту іберійських поселенців у номінально французькому Алжирі, а тепер, схоже, був готовий поширити свій захист і на французьких п'є-нуарів у скрутний для них час.\n\n«Знаєш, Антоніу, — зауважив Франко тихим, нейтральним тоном, — я, звісно, захищатиму наших людей, але не впевнений, чому ми маємо якісь підстави допомагати цим французам, які самі дозволили ситуації дійти до такого стану».\n\nСалазар, як завжди, був готовий висловити свої аргументи прямо: «Мій старий друже, тобі варто лише кілька хвилин подумати над цим питанням, щоб зрозуміти значення відмови від цих п'є-нуарів. Ми повинні надіслати повідомлення цим терористам ФНВ — їм не можна і не буде дозволено виганяти будь-яких поселенців із регіону. Якщо ми дозволимо їм позбутися французів, це лише питання часу, перш ніж вони прийдуть за іберійцями, які облаштували свої домівки та сім'ї вздовж алжирсько-марокканського кордону».\n\nФранко насупився, розмірковуючи — цього разу Салазар, можливо, мав рацію. І все ж втручатися в те, що, ймовірно, було б надзвичайно заплутаною справою, ще більше ускладненою нещодавнім розпадом Тріумвірату та хаосом, що охопив Європу, коли Райх розривав себе на частини...\n\n«Я не відкидаю твоїх побоювань, Антоніу, але думаю, що наразі ми повинні утриматися. Нам слід зачекати й подивитися, як розвиватимуться події, перш ніж повністю зобов'язувати себе до чогось конкретного. Якщо ситуація цього вимагатиме, я, звісно, підтримаю твій заклик до дій, але спершу подивімося, як п'є-нуари та цей чоловік, цей Жан-Жак Сузіні, впораються із ситуацією».\n\nСалазар розчаровано похитав головою, але знав, що наразі подальші протести будуть марними. Франко сидів і думав, наскільки погано все може закінчитися, поки світ навколо них тріщав по швах."
 Algeria_Skeleton.3.a:0 "Тільки час покаже."
 
 Algeria_Skeleton.4.t:0 "Салазар попереджав"
 Algeria_Skeleton.4.desc:0 "Обличчя Антоніу Салазара почервоніло, коли він стискав звіт у лещатах.\n\n«Я попереджав тебе про це! Я попереджав, що нам потрібно було вжити заходів проти цих бандитів ФНВ. Мене проігнорували, і тепер поглянь, що сталося!» Салазар із гучним ляскотом кинув папір перед Франко.\n\n«Їхня смерть на нашій совісті, мій друже. На твоїй совісті».\n\nФранко зі стоїчним мовчанням проковтнув обурливе звинувачення. Правду кажучи, повідомлення про різанину, влаштовану ФНВ серед поселенців іберійського походження, подіяли на нього як удар у груди. Як він міг заперечити Салазару, коли сам не міг сказати, що його співкаудильйо помиляється? Незалежно від того, наскільки він був винним у цьому звірстві, він не дозволить повторити його. Поселенців буде захищено за повної підтримки Союзу.\n\n«Салазар, я надаю тобі повну свободу дій у вирішенні цього питання. Роби те, що необхідно для захисту наших інтересів у регіоні».\n\nСалазар коротко кивнув і вийшов із кімнати, без сумніву, прямуючи розгортати іберійські війська, які були підготовлені задовго до цієї зустрічі."
 Algeria_Skeleton.4.a:0 "ФНВ буде приборкано!"
 
 Algeria_Skeleton.5.t:0 "Туніське село розбомблено іберійськими військами!"
 Algeria_Skeleton.5.desc:0 "Кілька днів тому ми отримали звістку, що іберійський літак, який проводив каральну експедицію проти ФНВ, найімовірніше, збившись із курсу через бурю, розбомбив туніське село поблизу тепер уже прозорого кордону з колишньою алжирською колонією, спричинивши численні жертви серед цивільного населення. Негайно було відкрито канали переговорів з іберійським командуванням, але від самого початку ситуація виявилася складнішою, ніж очікувалося.\n\nХоча наші дві країни формально не перебувають у стані війни одна з одною, все ж залишається фактом, що напруженість в Алжирі зростає, а наші війська в цьому районі далеко не нейтральні. До цього додається той факт, що Салазар, один із двох іберійських каудильйо, твердо має намір «провчити» алжирців за нібито влаштовану ними різанину іберійських п'є-нуарів: тому він рішуче виступає проти вибачень за атаку, адже це поставило б Іберію в підлегле становище так невдовзі після розпаду Тріумвірату.\n\nЦя відмова вибачитися або виплатити компенсації жертвам викликала обурення серед населення Тунісу та Єгипту, яке з цікавістю стежить за алжирською боротьбою. Хоча це грає нам на руку, оскільки призводить до надходження більшої кількості коштів та зброї до підтримуваної нами сторони, це все одно є дипломатичною невдачею і, найімовірніше, на певний час ускладнить майбутні відносини з Іберією."
 Algeria_Skeleton.5.a:0 "Ситуація в Алжирі продовжує загострюватися..."

 Algeria_Skeleton.6.t:0 "Передсмертні муки імперії"
 Algeria_Skeleton.6.desc:0 "Десять років французька держава брехала сама собі та світові, називаючи себе імперією, господарем народів, хоча насправді стала рабом. Десять років наш давній суперник лежав у муках, наче смертельно хворий на смертному одрі: він захлинався й хрипів, оточений апаратами, відчайдушно чіпляючись за життя та відмовляючись прийняти неминучу смерть.\n\nНаріжним каменем цього впертого опору, стрижнем французької прихильності до її втраченої величі завжди був Алжир — остання колонія, що залишилася в понівеченої французької держави. Маючи мільйони французьких колоністів, для Франції він був наче спадкова коштовність жебрака: золоте кільце, заховане серед лахміття, останній спогад про давно минуле, на який можна було дивитися, коли ніхто не звертав уваги, поки його власник зі сльозами згадував події, які відбулися й уже ніколи не повторяться.\n\nТепер остання ілюзія Французької імперії зникла. Коли Німецький Райх охопила громадянська війна, бургундське чудовисько вирішило, що Франція є ідеальним місцем для полювання на нових рабів: вторгнення було швидким і безжальним, а будь-які крихти національної єдності та бойової гордості, які французи змогли відновити за п'ятнадцять років, були швидко розчавлені, мов піщаний замок. Це не могло не мати наслідків.\n\nПідбурені хаосом і безладом на французькій метрополії, алжирські націоналісти вирішили силою вибороти свою свободу. По всій колонії почали діяти партизани, а громадський порядок зруйнувався: у відповідь французькі колоністи взялися за зброю, щоб зберегти статус-кво, відтіснити ворога там, де армія не могла цього зробити, тоді як іберійські війська готувалися завдати удару, щоб забезпечити свої інтереси в регіоні.\n\nФранцузька імперія мертва, і тепер нам доведеться мати справу з наслідками її загибелі."
 Algeria_Skeleton.6.a:0 "Скликати верховне командування! Привести всі прикордонні гарнізони в бойову готовність!"

 Algeria_Skeleton.7.t:0 "Алжирська війна"
 Algeria_Skeleton.7.desc:0 "Раніше сьогодні гарнізон Алжиру оголосив про початок кампанії з «визволення законної території Франції з рук терористів та італійських окупантів». Зі свого штабу в Алжирі колоніальна піхота під командуванням Рауля Салана була направлена до навколишніх провінцій, заставши зненацька як італійський гарнізон Алжиру, так і ФНВ. Алжирський гарнізон сповнений рішучості повернути Алжир під французьке правління, але ні Італія, ні корінні алжирці не здадуться без бою. Цей конфлікт може тривати роками, а будь-яке його вирішення буде куплене кров'ю."
 Algeria_Skeleton.7.a:0 "Небезпечна ситуація нарешті вибухнула."

 Algeria_Skeleton.8.t:0 "Іноземний легіон"
 Algeria_Skeleton.8.desc:0 "Як і очікувалося, націоналістичне повстання в Алжирі переросло у повномасштабну громадянську війну. Тепер три сторони протистоять одна одній у виснаженій війною колонії: алжирські націоналісти прагнуть створити вільну алжирську державу, яка згодом розпалить заворушення та революцію в усьому арабському світі; ОАСА, угруповання нерегулярних колоніальних воєнізованих формувань, залишків французької армії та підрозділів Іноземного легіону, бореться за збереження статус-кво та повернення колонії Франції, яка пручатиметься руками й ногами; нарешті, іберійці вирішили втрутитися в конфлікт, прагнучи захистити своїх співвітчизників, які давно оселилися в Орані.\n\nЦя війна потенційно може означати загибель наших інтересів на африканському континенті. Якщо націоналісти переможуть, ми зіткнемося з різким зростанням заворушень у Тунісі та Лівії, тоді як перемога Іберії зрештою дасть нашим колишнім союзникам доступ до важливих алжирських нафтових родовищ: тому Верховне командування радить нам втрутитися у війну, хоча б для того, щоб гарантувати прихід до влади когось прихильного до Італії.\n\nПротягом останніх днів СІМ підтримувала контакти з поміркованими алжирськими націоналістами, які зі страхом спостерігають за власними радикальними співвітчизниками. Вони ненавидять соціалістичні тенденції крайніх течій руху та попросили нашої підтримки, щоб дозволити Алжиру перейти до поміркованого уряду: натомість вони обіцяють відкрити країну для італійських інвестицій і не розпалювати націоналізм на наших землях.\n\nОчевидно, що це наш єдиний вибір. Експедиційний корпус під командуванням генерала Джузеппе Кастеллано прибув до Тунісу й готовий за нашим наказом увійти до Бони: там він приєднається до поміркованих воєнізованих формувань і розпочне кампанію з повернення територій, виступивши проти решти трьох сторін. Залишається лише сподіватися, що він досягне успіху."
 Algeria_Skeleton.8.a:0 "Усім військам, розпочати операцію!"

 Algeria_Skeleton.9.t:0 ""
 Algeria_Skeleton.9.desc:0 ""
 Algeria_Skeleton.9.a:0 ""

 Algeria_Skeleton.10.t:0 "Від Алжиру до Таманрассета"
 Algeria_Skeleton.10.desc:0 "Генерал Жан-Жак Сузіні спостерігав із вершини скелі, як останні алжирські партизани та італійські допоміжні війська залишали свої розбиті укріплення, більше ніколи не взявшись за зброю проти Французької держави. Його губи скривилися в усмішці, коли він оглянув пустелю навколо себе. Французьку пустелю. Понад століття його країна правила цією землею, доки всі французи не стали вважати її своїм правом за народженням. Вони захищали її від варварів і галлістів під час Війни, лише щоб колишній Тріумвірат жорстоко вирвав її з їхніх рук після Мальтійської конференції. Але завдяки зусиллям Сузіні зрада їхніх колишніх союзників була помщена. За тиждень його відвезуть до Алжиру, де його приведуть до присяги як нового генерального губернатора департаментів Алжиру, які знову опинилися в руках французів. І на відміну від попереднього посадовця, він подбає про те, щоб вони більше ніколи не залишили Францію. Ні через десятиліття, ні через сто років."
 Algeria_Skeleton.10.a:0 "Алжир — французький."

 Algeria_Skeleton.14.t:0 "Слава алжирському Лису!"
 Algeria_Skeleton.14.desc:0 "Сьогодні в Римі відбулася урочиста церемонія на честь людини, яку багато військових дослідників уже починають називати одним із найвидатніших стратегічних умів століття. Массімо Інвреа, прозваний «алжирським Лисом» за свої подвиги проти іберійських збройних сил, пройшов урочистою ходою знаменитою Віа-дей-Форі-Імперіалі разом із ветеранами своєї кампанії: наприкінці тріумфального шляху вони прибули до Вівтаря Вітчизни, де генерал особисто отримав від Його Величності Умберто II Савойського Орден Святого Благовіщення — найвищу італійську нагороду. Однак такі масштабні святкування все одно ніщо порівняно із заслугами самої цієї людини. Попри чисельну та технічну перевагу противника, генерал Кастеллано та його вірні люди здійснили неможливе: зупинили наступ Іберії в Алжирі та забезпечили перемогу союзним алжирським силам, уряд яких зайшов настільки далеко, що проголосив сивочолого офіцера «Рятівником Алжиру» та призначив йому державну пенсію. Війна була довгою та важкою, але генерал Інвреа ніколи не переставав вірити в перемогу. Серед його подвигів — Зняття облоги Бони, яке вважається останньою успішною кавалерійською операцією в сучасній війні, коли 2-й полк «Cavalleggeri di Tunisi» прорвав облогу міста ворожими силами, що насувалися, але його найвідомішим досягненням, безперечно, є Взяття Орана, яке призвело до оточення та подальшого знищення цілої іберійської бронетанкової дивізії без використання жодного танка. Такі люди, як Джузеппе Кастеллано, є доказом того, що італійська відвага та майстерність у володінні зброєю не згасли в сучасну епоху, і що навіть генерали, близькі до відставки, все ще можуть показати своїм молодшим колегам, як ведеться війна. Нехай майбутні покоління черпають натхнення з його подвигів!"
 Algeria_Skeleton.14.a:0 "Слава алжирському Лису!"