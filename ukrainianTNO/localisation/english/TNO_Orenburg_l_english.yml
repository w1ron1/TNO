 #Leage Call in events
 ORE.1000.t: "Заклик про допомогу"
 ORE.1000.d: "Світанок. Орєнбурґ завжди здається найживішим у ранкові години, пульсуючи військовою діяльністю, перевезеннями військ на фронт і з фронту, дипломатичними посланцями та чиновниками, які поспішають доставити давно прострочені звіти. Але навіть його лідери не можуть заперечувати, що останнім часом його рух був млявим. Тіні в їхніх очах розповідають історію — не про поразку, але, безумовно, про щось інше, ніж перемога.\n\nТак само, як і ветерани, які втратили руку чи ногу в боротьбі проти Чорної бригади; ферми, з яких зникли брати, батьки та сини. Орєнбурґ продовжує боротися, але в його голосі чути слабке тремтіння, а в розлогих просторах громадської думки переважає сумнів, а не надія. А Бригада завжди спостерігає і вчиться, і хто знає, коли вона подолає Революцію силою?\n\nРада гризе себе, як загнаний у кут гризун уночі, і занурюється у нескінченні дебати. Однак у передсвітанкові години відбувається диво. Рада досягає одностайної згоди з цього питання і пропонує рішення: викликати Уральську гвардію, їхніх таємничих благодійників. Ніхто в Раді повністю їм не довіряє, але грубий розрахунок плоті і крові є очевидним і привабливим. Краще загинуть їхні сини, батьки, брати, ніж наші."
 ORE.1000.a: "Зверніться по допомогу до Ліги!"
 ORE.1000.b: "Революція повинна перемогти самостійно!"
 
 ORE.1001.t: "Відчай"
 ORE.1001.d: "Завжди той самий танець, завжди ті самі актори. Дипломатичні події в Оренбурзі та Лізі змінюються з дня на день, але рутина залишається незмінною, принаймні для дипломата з Ліги. Однак останнім часом ситуація змінилася. Було отримано офіційний запит від Комун, сформульований у звичній пасивно-агресивній манері: «Революція не потребує, щоб ти за нас воював, ідіоте!». Моральні заклики та припущення про власну вищість залишилися незмінними. Змінилася лише впевненість: остання зникла. Не залишилося й сліду від колишньої впевненості в перемозі соціалізму над бандитським капіталом, залишилася лише вразливість і все більша визнання «несподіваних подій». І за лакованими словами дипломат Ліги відчуває біль. Бездонний біль. Пишучи свій звіт, він незрозуміло чому згадує дядька, який втратив усіх своїх синів у мисливській аварії на Сході. Біль у його очах раптом стає знайомим — і дипломат усвідомлює, що кожна його зустріч з Оренбурзькою радою була процесією болючих очей, прихованого смутку. Навіть провини. Він здригається і закінчує звіт. Остаточне рішення залишається за Менвіком і його клікою, але він знає, що повинен рекомендувати. Ліга не може стояти осторонь, коли душі невинних людей пливуть у темряву; адже це і є визначення мучеництва, і їхня кров, раз пролита, буде волати про справедливість."
 ORE.1001.a: "Орєнбурґ просить про допомогу, і ми відповімо"
 ORE.1001.b: "Ми не можемо собі дозволити допомогти Орєнбурґу"
 
 #Ланцюг НКВС
 ORE.1050.t: "Пропозиція НКВС"
 ORE.1050.d: "НКВС Магнітогорська сьогодні надіслав пропозицію до Ради робітників. У ній зазначається, що, оскільки вони є найвищою владою на російському Уралі, вони вирішили, що наше становище в їхній сфері має змінитися, і в своїй «доброзичливій мудрості» вирішили запропонувати нам автономію в межах їхньої держави. Комуни збережуть свою незалежність, а Рада робітників продовжить існувати. Однак ми потрапимо під владу НКВС і будемо змушені відправляти їм податки та солдатів для їхніх армій, фінансуючи військову машину НКВС. НКВС отримає право відправляти комісарів і чиновників НКВС для «захисту держави від контрреволюційних загроз». Однак це явно є ледь прихованим використанням таємної поліції для придушення наших народів. Дуже ймовірно, що НКВС не сприйме відмову від їхньої пропозиції надто прихильно. Вони щойно воювали з бандитами і будуть дуже раді відправити свої війська на захід, якщо ми відмовимося. Ми стоїмо перед вибором: автономія під контролем НКВС і втрата деяких свобод або збереження нашої незалежності і можливий гнів військової машини НКВС. У Раді робітників було оголошено голосування."
 ORE.1050.a: "Комуни голосують за те, щоб схилити коліна"
 ORE.1050.b: "Комуни голосують за збереження незалежності"
 
 ORE.1051.t: "Вимога НКВС"
 ORE.1051.d: "У приголомшливому акті нахабного войовничого і залякування НКВС надіслав вимогу до Ради робітників, закликаючи до анексії комун Орєнбурґа до нового диктаторського держави НКВС. Посилаючись на те, що росіяни повинні триматися разом у цьому небезпечному світі, а тепер, коли Дірлеванґер і йому подібні мертві, Рада робітників не має чого боятися на Уралі. Вони заявляють, що комуни будуть захищені НКВС і що селянам краще жити під опікою і керівництвом НКВС, а не Ради робітників. Якщо комуни приймуть цю пропозицію, то всі права і свободи, за які вони боролися, будуть залежати від милості НКВС, який не відомий своєю добротою до тих, хто думає інакше. Було оголошено голосування, кожній комуні було наказано прийти, оскільки це голосування вимагало голосів усіх комун з цього питання. Чи виберуть вони анексію під п'ятою НКВС, чи будуть боротися за свою свободу?"
 ORE.1051.a: "Ви можете забрати наші життя, але ви ніколи не зможете забрати нашу свободу!"
 ORE.1051.b: "Підкорення краще за смерть"
 
 ORE.1052.t: "Пропозиція дружби"
 ORE.1052.desc: "Представник НКВС, з типовою для спецслужб зухвалою гордістю та самовпевненістю, яку багато хто ще пам'ятав з радянських часів, сів перед Радою робітників і почав висловлювати аргументи на користь поліпшення відносин між нашими двома племенами в цьому пекельному краю. Разом ми подолали божевілля Дірлеванґера, довівши, що російська солідарність може перемогти німецький антагонізм. Однак наша перемога не була простою, вона коштувала комунам великих втрат. Чи могли ми в такому стані сподіватися, що колишні гнобителі дотримають свого слова і справді не впливатимуть на нашу автономію? Маючи експертні навички читання людей, делегат з Магнітогорська почав перераховувати інші проблеми, з якими стикається регіон, загрози, які все ще можуть знищити обидві сторони, якщо вони не об'єднаються як соціалістичні співвітчизники. Однак соціалізм НКВС дещо відрізнявся від соціалізму, який багато хто в комунах вважав за краще, так само як і раніше з гвардією, як централізований режим міг ефективно впоратися з нашою демократичною системою? Рада все одно провела голосування."
 ORE.1052.a: "Посланець буде змушений повернутися додому з порожніми руками"
 ORE.1052.b: "У такі часи нам потрібні друзі"
 
 ORE.2500.t: "Гвардія витримує"
 ORE.2500.desc: "Сталося найгірше. Наші союзники на Уралі були розгромлені бандитами СС, і, здається, наш час настав.\n\nОднак ми не самотні. Деякі вижили після розгрому Уральської ліги і приходять нам на допомогу. Це хороший нагадування про те, що ми не самотні у боротьбі проти підлої бригади Дірлеванґера, і, здається, ми отримаємо негайну допомогу від тих, хто вижив. Ці мужні і загартовані в боях чоловіки будуть твердо стояти пліч-о-пліч з народом Орєнбурґа, готові віддати своє життя за захист нашої батьківщини. Їхня незламна воля до боротьби повинна стати спільною позицією і для наших солдатів. Чоловіки Уральської ліги — одні з найхоробріших, хто коли-небудь служив, тому ми повинні бути вдячні навіть у ці важкі часи, що вони все ще вирішили продовжувати боротьбу. Їхні командири інтегрувалися в нашу структуру, і вони явно готові до остаточної жертви, якщо це означає свободу і незалежність для Росії. Ми не повинні дозволити їм померти даремно! Зі сходу надходять повідомлення про злочини бригади, а нечисленні біженці розповідають жахливі історії про зґвалтування та грабежі. Зрозуміло, що Дірлеванґер — це не іграшка, і наша поразка означатиме хаос і страждання для всього Орєнбурґа, не кажучи вже про Росію! Кожен чоловік і кожна жінка повинні боротися з цим бичем Божим за будь-яку ціну, якщо це означає, що наші діти будуть жити у вільній країні!"
 ORE.2500.a: "На фронт!"
 ORE.2500_tt: "Ми створимо нову дивізію §Юральської ліги§! виживших"
 
# інша угода
 
 ORE.163.t: "Відмова"
 ORE.163.d: "Юральська ліга... відхилила прохання Ради про союз.\n\nНе так давно вони вперше прибули до наших найвіддаленіших колгоспів. Наші селяни повідомляли про невеликі групи чоловіків і жінок у бойовій формі з втомленими обличчями і смертоносними гвинтівками на спинах. З відстані часу ми розуміємо, що це були лише розвідники, які вперше зустрілися з цивілізацією після свого ймовірного вигнання.\n\nЗвичайно, ми бачили все інакше. Оточені з усіх боків бандитами, вбивцями та німцями, слабкі та беззахисні навіть перед суворою зимовою сніжною погодою... ми бачили в них рятівників. Братів по зброї проти жадібних, хижих, кровожерливих: всіх тих, хто жадібно прагне багатств Орєнбурґа. Вперше, як нам здавалося, майбутнє Орєнбурґа здавалося трохи світлішим. Але перш ніж відновляться звичні крики і звинувачення; перш ніж уряд Орєнбурґа залишить свій народ беззахисним перед наближенням різанини; і перш ніж яскрава іскра Комуни згасне і помре, всі члени ради думали одностайно:"
 ORE.163.a: "«Що ж нам тепер робити...?»"
 
 #Culture events
 ORE.140.t: "Встановлення істини"
 ORE.140.d: "Раніше історія Орєнбурґа була спотворена неправдивими розповідями та твердженнями про його засновників і лідерів. За часів товариша Маленкова це почало змінюватися. Фотографії лідерів комуни та їхніх злочинів тепер можна побачити скрізь, і вони показують людям, як вони намагалися тримати нас у слабкості. Бурба і його божевільні марення були викреслені з підручників; його плани тепер або забуті, або запам'ятані завдяки їхньому справжньому творцеві, товаришу Маленкову! Історія пишеться переможцями, і, оскільки ми є переможцями, це наш шанс виправити ситуацію, щоб майбутні покоління не були скеровані в помилковому, контрреволюційному напрямку"
 ORE.140.a: "На крок ближче до кращого Орєнбурґа!"

 ORE.141.t: "Нова молодь для нового дня!"
 ORE.141.d: "Молодь Орєнбурґа, як і решта регіону, була неорганізованою і не освіченою в чеснотах, необхідних для виживання. Однак за товариша Маленкова це починає змінюватися. Утворення Комусолу, або Всесоюзного Ленінського спілки молодих комуністів, стало частиною нової ініціативи, спрямованої на те, щоб утримати дітей від релігійних догм і замість цього пропагувати атеїстичні ідеї. Під керівництвом старших членів партії члени Комусолу будуть працювати над закриттям церков та інших буржуазних інститутів і замість цього пропагувати належні соціалістичні цінності. По-перше, молоді люди не люблять, коли їм кажуть, що робити, тому утворилися хуліганські банди та угруповання. Більше занепокоєння викликають їхні батьки; багато хто звинувачує нас у тому, що ми є «загарбниками» і руйнуємо сім'ї. Наша відповідь на ці звинувачення проста: так, саме це ми і робимо. Діти повинні розвиватися, щоб сприяти колективному благу Орєнбурґа і Росії, а не бути стримуваними своїми батьками. Зрештою, чи не сказав Христос, якого вони так люблять, що слід покинути свої сім'ї, якщо це означає слідувати добрим шляхом? З контрреволюційною догмою в сім'ї потрібно боротися за будь-яку ціну"
 ORE.141.a: "Вони кажуть, що це погана ідея, але що вони знають?"

 ORE.142.t: "Навернення"
 ORE.142.d: "На столі старого Маркова було знайдено лист. У ньому було написано:\n\n«Я вірив у свободу, справді вірив. Коли Комуна попросила моєї довіри, моєї їжі, я нічого не приховав. Коли мене попросили надати притулок уральським солдатам, я віддав їм свою кімнату. Я любив свою свободу і готовий був віддати себе на її службу.\n\nМені було надано привілейоване становище в Комуні, і я вірив, що мої власні справи будуть достатніми, щоб гарантувати мою репутацію. І я ніколи не зловживав цим становищем. Я любив Комуну і досі люблю своє село. Служіння на захист нашої свободи не є для мене тягарем. Але коли Світлана, світло мого життя, захворіла на тремтіння і лихоманку, мені відмовили, відмовили, відмовили. Мені сказали, що це потрібно голові і його родині. Це потрібно шановним гостям. Радники, про яких я ніколи не чув, були для Комуни ціннішими, ніж моя дочка, яка задихалася в ліжку, а життя витікало з неї з кожним подихом. n\nА коли настав час похорону, коли Марія не могла встати від горя, комуна нічого не зробила. Ось яка була винагорода за мою добровільну службу — нічого. Принаймні його покарання буде справедливим і суворим. Свобода нічого не варта без справедливості. А Маленков — це справедливість». Старий Марков був убитий під час поліцейської операції з придушення маленковських заворушень наступного лютого."
 ORE.142.a: "Урал просочений нашими сльозами"

 ORE.143.t: "Скарги фермера"
 ORE.143.d: "Невелика, відокремлена ферма була в поганому стані, незважаючи на те, що розташовувалася на краю великого лісу, але що міг зробити старий фермер, який збирав урожай з останніх пасовищ, які природа не відібрала у нього, щоб самотужки відремонтувати невеликий комплекс будівель? Він чув фантастичні історії про Орєнбурґ і дивовижний розквіт, який він пережив, ставши сяючим маяком надії в цих вируючих, сповнених смерті хвилях темряви. У тихій задумі, дивлячись на мерехтливе сонце, що сідало, і даючи своїм втомленим м'язам невеликий, але такий необхідний відпочинок, він розмірковував, як би було жити в місті, де реформи та індустріалізація створили такий рівень життя, який неможливо уявити тим, хто живе в віддалених громадах. Він ледь не застав себе мріяти, щоб його життя було іншим, але відкинув таку егоїстичну думку. Глибоко зітхнувши, він прошепотів ім'я кохання свого життя, яке так безцеремонно і раптово забрали у нього, і замислився, чи була б вона так само горда, як і він, своїми дітьми. Живучи в тому великому місті, роблячи щось зі своїм життям, несучи надію, яка народилася разом з ними. Одинока сльоза скотилася по його зморшкуватих, засмаглих щоках, коли він думав про них. Але робота мала продовжуватися."
 ORE.143.a: "Те, чим ми жертвуємо заради тих, кого любимо"

 ORE.144.t: "Маніфест лицемірства"
 ORE.144.d: "У великій залі Ради робітників панував повний хаос, що не було чимось незвичайним, але цього разу це було щось більше, ніж звичайне заворушення, це було щось на кшталт образи та скандалу. Здавалося, що все почалося з одного представника зовнішньої комуни, який все ще стояв прямо і гідно, незважаючи на люті образи, які кричали йому з усіх куточків кімнати. Його промова була мало чим меншою за повноцінну критику поточної економічної системи, яку мусили терпіти поселення за межами Орєнбурґа, та її жахливого впливу на рівень життя. Очевидно, будь-яка критика анархістської форми соціалізму, яку сповідували комуни, навіть якщо вона була цілком обґрунтованою, як у його випадку, викликала у Ради глибоке занепокоєння та екзистенційну тривогу. Як удар в живіт або ляпас по обличчю, лунали слова «зрадник» або «фашистське сміття». Все, що він запропонував, — це певний рівень інвестицій з прибутку Орєнбурґа в сільські поселення, про які він мав би піклуватися, адже вони забезпечували більшу частину його продовольства. Тепер з місця підвівся розлючений, досить товстий чоловік і грюкнув по столу перед собою, трохи зменшивши галас у залі. Він запропонував провести голосування щодо обмеження свободи слова на засіданнях Ради, коли йдеться про основоположні традиції комун, замість початкової пропозиції. З великим розчаруванням і огидою до явно задоволеного блазня, який щойно встав, і до багатьох, хто підтримав його пропозицію, первісний делегат сів, повністю розчарований. Нічого знову не зміниться."
 ORE.144.a: "Суд божевілля"

 ORE.145.t: "Вчені прибувають до Орєнбурґа"
 ORE.145.d: "Вони прибули рано вранці. Змучена група чоловіків і жінок, деякі в лабораторних халатах, інші просто в цивільному одязі, але всі вони були найкращими і найталановитішими у своїх галузях. Вони прибули з Чорної гори, прокрадаючись і ухиляючись від патрулів Магнітогорська, і їм знадобилося ще два дні пішки, щоб дістатися до Орєнбурґа, але вони нарешті досягли мети. \n\nЛише коли їх прийняла патрульна міліція на околиці, надала їжу та воду і запевнила, що вони будуть у безпеці, вони почали розповідати про жахи, які бачили всередині Чорної гори. Вони тихими голосами і крізь сльози розповідали про експерименти, які проводили, бо не мали іншого вибору або спочатку вірили в «вище благо». Вони шепотіли про викрадення, примусове розмноження, вівисекції. Деякі взагалі відмовлялися говорити. Люди Бурби пообіцяли їм притулок. Вченим нададуть місце для проживання, але тільки за умови, що вони будуть працювати на Орєнбурґ і його дослідницькі підрозділи. Це питання вимагало певних переконань і демонстрації реального етичного кодексу, але зрештою всі вчені приєдналися до зусиль міста."
 ORE.145.a: "Ця гора мене турбує..."

 ORE.146.t: "Рука, що годує"
 ORE.146.d: "Хаос захопив проспект Перемоги.\n\nКров дітей Орєнбурґа тепер стікає по боках нововипущених автомобілів. Вона стікає в щойно викопані каналізаційні колектори. Вона збирається навколо чобіт щойно навчених офіцерів спецназу.\n\nМодернізація потрясла Орєнбурґ до глибини душі в багатьох відношеннях, і в багатьох відношеннях це було добре! Люди працюють. Люди їдять. Люди насолоджуються процвітанням, яке було немислимим ще кілька років тому. Орєнбурґ став сяючим маяком у темряві Росії.\n\nАле це не ідеальний перехід, бо люди знають, що щось втрачено. Вони відчувають її помітну відсутність, коли сплять, вони відчувають страх без неї під пильним оком зростаючої армії поліцейських Бурби, і вони відчувають, як вона повільно вислизає з їхніх тіл і зникає, коли вони безперервно працюють на заводах без права голосу і часто без оплати. \n\nЖителі Орєнбурґа втратили свою свободу. \n\nПротести були очікуваними. Принаймні так здається, адже поліція була більш ніж готова, коли вони почалися. Сміливі та горді студенти марширували по проспекту Перемоги, коли десятки офіцерів з новими щитами для боротьби з заворушеннями та ременями зі свіжоприготованим сльозогінним газом накинулися на них. n\nБули застосовані кийки та вогнепальна зброя, і до кінця дня майже десяток найкращих і найталановитіших жителів Орєнбурґа лежали на вулиці, задихаючись, а понад сотня інших спотикалися і лікували рани, від звичайних до тих, що загрожували життю.\n\nЧи це ціна прогресу?"
 ORE.146.a: "Що ще ми повинні пожертвувати заради цього майбутнього?"

 ORE.147.t: "Дім для збіднілих?"
 ORE.147.d: "Ті, кому пощастило мати місце, де можна жити і відпочивати щоночі в цій розірваній війною країні, рідко співчувають тим, хто потрапив у скрутне становище. Тому більшість вважала, що будівництво нового бетонного будинку — це просто ще одна квартира для розбещених і багатих. Але коли двері нарешті відчинилися, багато мешканців були шоковані, виявивши, що вони відкриті для всіх, хто потребує теплого притулку від холоду або їжі, коли особисті запаси вичерпалися. Колишні селяни, які роками безцільно блукали, шукаючи підсобну роботу або місце для проживання, тепер нарешті можуть відпочити. Реформа Олександра Бурби в Оренбурзі супроводжувалася не тільки обіцянками демократизації, але й метою створення соціального забезпечення для знедолених мас Уралу. З відкриттям перших притулків для бездомних у Росії в центральному місті, реалізація цієї високої мети, як тепер видно, вже йде повним ходом. У промові, виголошеній на відкритті закладу, Бурба говорив про те, що в певному сенсі всі росіяни є бездомними через свою роз'єднаність і постійну невизначеність, і назвав відкриття притулку першим кроком не тільки до боротьби з бездомністю, а й до відновлення цілісності батьківщини. Ми можемо тільки сподіватися на краще для блукаючих мандрівників у цьому великому вигнанні."
 ORE.147.a: "Суспільство оцінюють за тим, як воно ставиться до найбідніших"

 ORE.148.t: "Угода Бурби"
 ORE.148.d: "Працюйте! Працюйте для своєї родини! Працюйте для своїх товаришів! Працюйте для промисловості, для Орєнбурґа і для товариша Бурби!\n\nВ рамках нової серії реформ Бурби, лише однієї з кількох десятків, що вже були впроваджені протягом останнього місяця, робітники вишикувалися в черги за роботою з зарплатою, якої в Росії не бачили вже десятиліттями, в обмін на роботу на одній з численних нових фабрик і ферм по всьому Орєнбурґу. Вже сотні людей знайшли роботу на цих нових промислових підприємствах, і вулиці заповнені не зневіреними і голодними, а охочими до роботи працівниками, які стоять у черзі за своєю щоденною зарплатою або пайком. Звичайно, можна прогулятися вулицею і відчути гордість за своє місто, і хоча зараз, можливо, трохи важче дихати в задимленому повітрі, це невелика ціна, яку доводиться платити, коли жителі Орєнбурґа можуть легко знайти роботу і отримувати винагороду за свою працю. Там, де колись вікна були темними від браку світла, а відходи викидалися на вулиці через неналежну каналізаційну систему, тепер панує розкіш! \n\nНазустріч цій зростаючій верстві робітників йде зростаюча верства службовців, середніх менеджерів і бюрократів, які їх підтримують. Середній клас вже відокремився у багатьох новобудованих районах, де вони можуть насолоджуватися більш розкішними помешканнями, ніж їхні колеги-робітники. І це не кажучи вже про тих, хто стоїть над ними! Як заводи набирають обертів, так само набирають обертів і колеса промисловості, а на автомобілях, що їздять на цих колесах, їздять багаті та заможні. Ті, хто мав навички, хитрість і безжалісність, щоб стати лідерами нашого прекрасного міста. Так, небо може бути чорним. Так, лікарні можуть бути заповнені робітниками, які втратили пальці та руки в результаті нещасних випадків на заводах. Так, цінний простір у місті зараз може бути зайнятий величезними маєтками та іншими будинками для верхівки суспільства. Але це ціна, яку жителі Орєнбурґа готові платити, адже тепер вони живуть у майбутньому! Або принаймні у сьогоденні."
 ORE.148.a: "Ми досягли дна і тепер йдемо вгору"

 ORE.149.t: "Спроба державного перевороту"
 ORE.149.d: "Засідання було звичайним, довгим і нудним, але все одно необхідним. Члени ради бурхливо обговорювали всі питання порядку денного, від найважливіших до найдрібніших. Деякі люди позіхали, але вони виконували важливу роботу. Бурба сидів на чолі столу, виглядаючи дуже зацікавленим у поточній розмові про п'ятивідсоткове збільшення врожайності в маленькому селі на східній околиці. \n\nПоки доповідач продовжував монолог на цю тему, що мала світове значення, солдати почали заходити в двері з обох боків. Вони вишикувалися в коло і оточили стіл, за яким засідала Рада. Всі присутні виглядали або наляканими, або похмурими, за винятком Бурби, який продовжував зачаровано слухати нудну промову необізнаного члена Ради, який продовжував виголошувати свою промову про розподіл нового зерна та повторення успіхів. Оратор нарешті помітив солдатів навколо себе і раптово зупинився, нервово ковтнувши слину. Похмурі члени Ради встали, і їхній лідер темним голосом сказав Бурбі, що той повинен піти з цими солдатами. Його контроль був катастрофою і мав бути припинений. Бурба злегка кивнув, але потім сказав: «О, це не буде потрібно». Члени Ради виглядали збентеженими, а потім їхні обличчя одночасно спотворилися від жаху, коли вони зрозуміли, що солдати націлилися не на Бурбу, а на них. Їх забрали, а Бурба оголосив про відновлення засідання. «Я попередньо швидко поговорив з охоронцями. Назвіть це передчуттям. Повернемося до справи"
 ORE.149.a: "Хитрий, як лисиця"

 ORE.150.t: "Нова демократія?"
 ORE.150.d: "Однією з небагатьох постійних рис в організації різних комун Орєнбурґа є те, що вибори завжди проводяться під час довгої зими, коли поля порожні, а населення села сидить у своїх хатах. Під час довгих вечорів обговорюються події року та оцінюється робота представника села в місті Оренбурзі. Перед тим, як весна повертається на поля і до селян, обирається новий склад керівників, які будуть керувати комуною протягом року і представляти її в Раді робітників і на з'їздах. Але таємнича робота Робітничої ради почала створювати групи друзів і ворогів, об'єднаних або розділених спільними ідеями про майбутнє Орєнбурґа. Виходячи з інтересів міста Орєнбурґ і необхідності об'єднання для вирішення регіональних проблем, наші попередники з реформістської фракції почали будувати коаліцію представників, які вірили в централізацію. У відповідь на це почав формуватися великий автономістський блок для захисту прав комуни. Різні інші неформальні партії з'являлися і зникали, коли зміни в робітничій демократії розривали союзи або об'єднували нових людей. Однак цього року, за словами наших агентів, ситуація змінилася. Наші зусилля з обрання голови Бурби і надання йому повноважень для змін в Оренбурзі мали глибокий вплив на майбутні вибори. Велика кількість фракцій увійшла до складу нашої нової Партії прогресу і розвитку, тоді як раніше всесильна Автономістська партія розпадається. За допомогою стратегічних хабарів і залучення найкращих і найталановитіших представників комун, які могли б протистояти нам, нам вдалося звузити список кандидатів у всьому регіоні до членів нашої партії та кількох незалежних кандидатів. В Оренбурзі зароджується новий тип партійної політики, оскільки амбітні люди усвідомлюють, що єдиний спосіб отримати місце за столом — це допомогти нам. Дні, коли обструкціоністи були силою в політиці Ради, нарешті минули"
 ORE.150.a: "Мало політики в Оренбурзі, а багато адміністрації"
 
 ORE.600.t: "Чорна бригада нарешті переможена!"
 ORE.600.desc: "Сьогодні на світанку остання група бандитів із Чорної бригади була приведена на поле смерті. Німці, росіяни та казахи були витягнуті з смуги землі, де вони були прикуті ланцюгами, і приведені на пагорб до місця свого останнього спочинку. Якби хтось із переможених бандитів мав схильність до філософії, то, можливо, він би знайшов похмурий гумор у тому, що гвинтівки, які незабаром покладуть край їхньому життю, були викувані в робітничих комунах, які вони колись вважали легкою здобиччю. Загроза вторгнення бригади Дірлеванґера назавжди змінила Орєнбурґ. Дехто, мабуть, назавжди проклинав новий уряд, який прийшов до влади внаслідок бандитської кризи; інші були вдячні своїм співвітчизникам за те, що вони об'єдналися в ці найчорніші часи, щоб відвернути апокаліпсис. Бандитам не дали можливості постати перед судом або захистити себе і свої дії. З тих пір, як у 50-х роках Дірлеванґер і його люди втекли від смерті з рук Ганса Шпайделя, вони грабували і вбивали по всій Росії. Таким чином, додаючи страждань російському народу, король бандитів створив свою власну чорну легенду. Тепер будь-хто, кого спіймають на зв'язках з ним, справедливо засуджений на смерть. Дірлеванґер намагався померти так, як жив, борючись і вбиваючи разом зі своїми людьми. Але в останньому акті кармічної справедливості його збив один із його людей, який сподівався обміняти короля бандитів на помилування. Старого німця відвезли до Орєнбурґа, де натовп шалено щасливих громадян зібрався, щоб побачити його страту. Трупи злочинців допоможуть удобрити землю Матері Росії. Це гідне завершення життя, присвяченого спалюванню земель невинних чоловіків і жінок."
 ORE.600.a: "Справедливість перемогла!"

 ORE.601.t: "Божевілля Чорної гори розвіяно!"
 ORE.601.desc: "Сьогодні вранці оренбурзькі війська розпочали остаточний наступ на Чорну гору. Втомлені й деморалізовані солдати НКВС з Магнітогорська втрачали одну оборонну позицію за іншою. Це вже не були налякані й ізольовані селяни, яких головний вчений колись відправив викрасти; полум'я війни загартувало оренбурзьких солдатів. Потроху комунальна армія прорвала оборону Магнітогорська. Гірників вивели на фронт, щоб прокопати нові шляхи в гору, обрушуючи величезні ділянки тунелів на нещасних солдатів НКВС. Як залишки Червоної армії могли відправити загони для відбиття шахтарів? Їхні людські ресурси та боєприпаси вже були на критичному рівні. Останній удар не був завданий важкою артилерією Орєнбурґа, яка безжально обстрілювала головні тунелі. Він також не прийшов зверху, коли сміливі рейдеры спустилися по шахтних стволах у серце Чорної гори. Ні, остаточний удар прийшов зсередини лабораторій. Жахнуті офіцери НКВС почули по радіо про повстання обшарпаних в'язнів, які якимось чином звільнилися зі своїх камер. Позиції, укріплені проти зовнішнього світу, були швидко захоплені жертвами Чорної гори. До початку післяобіду кілька дивізій НКВС підняли білий прапор, відчайдушно намагаючись втекти від хвилі втікачів-жертв експериментів. Офіцери Орєнбурґа відмовилися давати пощаду спільникам експериментів Чорної гори. Незабаром останні осередки опору НКВС були оточені і ліквідовані. \n\nЧоловіки з Орєнбурґа слухали божевільні тиради звільнених в'язнів про кошмар зі сталі та скла, прихований у глибинах гори. Невеликий загін досвідчених солдатів вирушив до лабораторій. Один за одним чоловіки поверталися з обличчями, блідими від жаху. Нарешті їхній офіцер повернувся з глибин із останнім експериментальним щоденником Лисенка. Пізніше того ж дня він прочитав щоденник, сторінки якого освітлювало багаття, що очищало глибини Чорної гори. «Запис у щоденнику 1428-F — Непередбачені технічні труднощі, що виникли у групі «Орєнбурґ» — Див. документ місцевих фракцій 13 гамма — Зразки проекту — ВИДАЛЕНО — необхідно провести попередні польові випробування. Наказ інтернувати Анатолія, щоб він приніс мені ключі від камер утримання"
 ORE.601.a: "Нарешті ми можемо покласти край цьому божевіллю"

 ORE.602.t: "Капітуляція НКВС"
 ORE.602.desc: "Сьогодні командири НКВС, що вижили, підняли білий прапор над своїми останніми укріпленнями. Бойовики Орєнбурґа дякували долі за те, що їм не довелося воювати з божевільним Лисенком. Божевільний вчений, ймовірно, тримався б до самого кінця. Офіцери НКВС вийшли вперед і здали зброю своїм колегам з оренбурзьких сил безпеки. Залишки Червоної армії були пригнічені своєю поразкою. Вони мріяли про відновлення Радянського Союзу, про встановлення порядку на беззаконних просторах російської анархії. Деякі з більш амбітних мріяли знову побачити червоний прапор комунізму з орлами, що майорить над планетою. Доказ того, що мрія про робітничу революцію не була невдалим експериментом, розчавленим німецьким чобітом. Але, можливо, вони не були тими людьми, які підходили для цієї роботи. Вони ховалися в тіні Чорної гори, марнуючи час і хороших людей на розпусні завдання Лисенка. Решта Росії рухалася вперед без них. Можливо, справжніми носіями волі робітників стануть Оренбурзькі, перекуті в конфлікті. Звичайно, не всі офіцери НКВС дійшли такого висновку. Деякі звинувачували своїх людей, інших офіцерів або випадкові обставини, що були поза їхнім контролем. Іноді порядок просто не може перемогти хаос. І для цих людей, з ліквідацією НКВС, остання надія на впорядковану і сучасну Росію тепер зникла. Краще здатися цій наволочі і пити до смерті, поки російська анархія триває."
 ORE.602.a: "Безглузда мрія, похована"
 
 ORE.517.t: "Орєнбурґ починає озброюватися"
 ORE.517.d: "У поспішних мешканців Орєнбурґа, які поспішали по переповнених вулицях міста, відчувалася майже відчутна напруга. Комуна, яка зазвичай була місцем невпинної нерішучості з її різними комітетами та політичними чварами, нарешті була змушена об'єднатися, щоб досягти вирішальної мети. Дзвін металу та інші робочі звуки змішувалися зі стресом, що витав над містом. Це був шум, характерний для об'єднаного організму, що готувався до протистояння зовнішнім силам, які загрожували його самому існуванню. \n\nКожна майстерня, кожен будинок з інструментами працювали над створенням різних видів стрілецької зброї та боєприпасів для себе та ополченців, яких потрібно було мобілізувати для організації оборони. Незважаючи на відсутність централізованої організації та контролю, продуктивність була і залишалася винятковою, що гарантувало: навіть якщо якість була недостатньою, кількість легко це компенсувала"
 ORE.517.a: "Чим більше зброї, тим краще"

 ORE.518.t: "Алексеївка починає озброюватися"
 ORE.518.d: "Новина про швидке озброєння Орєнбурґа дійшла до міської ради маленької комуни лише через кілька годин після того, як імпровізовані майстерні розпочали виробництво в жвавій регіональній столиці. Розуміючи, що Орєнбурґу, ймовірно, знадобляться всі озброєні міліції, які він зможе озброїти, керівництво Олексіївки прийняло рішення організувати оборону міста, щоб захистити річкову громаду. Також не було стільки охочих добровольців, які б приєдналися до імпровізованих ополченців, оскільки значна частина жителів Олексіївки вже переїхала до Орєнбурґа. Однак це не зупинило тих, хто залишився і був достатньо відданий справі, і вже за півдня можна було почути подібний гул продуктивності, який тривав до пізньої ночі. Незалежно від того, скільки зброї міг виготовити місто, вона принаймні сприяла захисту анархістського проекту Південного Уралу."
 ORE.518.a: "Ми маємо бути готові в будь-який момент"

 ORE.519.t: "Стерлітамак починає озброюватися"
 ORE.519.d: "Друге за величиною місто комун Південного Уралу давно поставило собі за мету не відставати від Орєнбурґа в політичному та економічному значенні. Це було малоймовірним, але така мета все ж спонукала робітників і керівників до продуктивної роботи. Зараз був найкращий час, щоб довести це, оскільки до міської ради щойно надійшла новина про озброєння Орєнбурґа у відповідь на зовнішні сили. Листівки, плакати та радіоповідомлення швидко поширилися по Стерлітамаку, а посланці покинули місто, щоб поширити новину в навколишніх селах і допомогти організувати їхні власні зусилля. n\nНезабаром весь регіон кинувся переоснащувати існуючу легку та важку промисловість, а для сприяння закупівлі старих озброєнь та сировини, необхідної для виробництва зброї, було створено комітет з ефективного збору ресурсів. Незабаром було передано стільки зброї, що раніше порожні склади почали знову наповнюватися. Стерлітамак був готовий."
 ORE.519.a: "Озброєне населення зробить нас силою, з якою доведеться рахуватися"