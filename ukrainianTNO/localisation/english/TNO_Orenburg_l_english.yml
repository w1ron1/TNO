 ORE_category_political_situation: "Політична ситуація в Орєнбурзі"
 ORE_category_political_situation_desc: "Рада страшенно неефективна й мусить змінитися. Дехто наполягає на її реформуванні, але насправді її варто цілком усунути й замінити централізованою організацією. У цьому Бурба й Малєнков згодні. Провівши низку реформ, ми зможемо передати владу єдиному органові замість Ради, що нарешті дозволить ухвалювати вагомі рішення й діяти від імені народу. Але якщо натиснемо надто сильно, то лише зміцнимо тих, хто прагне зберегти Раду. Нині Орєнбурґ [This.GetOrenburgCentralisation](§R[?ROOT.ORECentralizedPower]§!).\n\nРеформістську партію очолює [This.GetOrenburgReformist]."
