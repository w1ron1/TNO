 ### Ideas ###
 ORE_ural_guard_survivors: "The Guard Enduring"
 ORE_put_militias_down: "Centralizing Communal Militias"
 ORE_anarchic_commune: "Anarchic Communes"
 ORE_anarchic_commune_desc: "The Communes are disunited. We share nothing, we do not trust one another, we insist on having no real police or military for fear of the possibility of someone taking power over the communes. The highest government outside the city of Orenburg is a scant few village elders and councils, but even those are rare. It will take much work to begin reversing the massive problems this cause, and many hope we can do so without betraying our ideals."
 ORE_refugee_crisis: "Refugee Crisis"
 ORE_refugee_crisis_desc: "Refugees pour over the Urals, hoping to find shelter in the Communes, escorted west by the League when they don't settle near the Gulags. More escape from the south, fleeing the roving bands of German bandits and their pet Kazakh horse riders. Most of the Communes refuse to take these strangers, meaning that Orenburg city is buckling under the weight as we shoulder the burden."
