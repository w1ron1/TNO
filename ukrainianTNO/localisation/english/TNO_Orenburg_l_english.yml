 ### Ideas ###
 ORE_ural_guard_survivors: "Гвардія тримається"
 ORE_put_militias_down: "Централізація ополчень комун"
 ORE_anarchic_commune: "Анархічні комуни"
 ORE_anarchic_commune_desc: "Комуни роз'єднані. Ми нічим не ділимося, не довіряємо одне одному й наполягаємо на відсутності справжньої поліції чи війська, боячись, що хтось може захопити владу над комунами. Найвища влада за межами міста Орєнбурґа - нечисленні сільські старости й ради, та навіть вони трапляються рідко. Щоб почати долати породжені цим величезні проблеми, знадобиться багато праці, і чимало людей сподіваються, що це вдасться зробити без зради наших ідеалів."
 ORE_refugee_crisis: "Криза біженців"
 ORE_refugee_crisis_desc: "Біженці переходять Урал, сподіваючись знайти притулок у Комунах; Ліга супроводжує їх на захід, якщо вони не оселяються поблизу ГУЛАГів. Інші тікають із півдня від мандрівних зграй німецьких бандитів та їхніх ручних казахських вершників. Більшість комун відмовляється приймати чужинців, тож місто Орєнбурґ прогинається під тягарем, який мусить нести самотужки."
