 ### Leader Bios ###
 POLITICS_WORKERS_COUNCIL_ORENBURG_DESC: "Робітничий консул Орєнбурґу це є клей що тримає все разом і тримає магніти від відштовхування. Від взриву з вогню та крові, від колапсу Росії, самодостатні села організовані разом у слабкій конфедерації, названо робітничим консулом. Совєцький Союз, авторитарна Соціялістична держава, дала шлях анархо-комуністичним вченням Орєнбурґу. Місто Орєнбурґ собою був економічним, політичним, і культурним центром прото-держави, і це місце де консул зустрівся.\n\nЗ першого погляду, консул це утопічний Соціялістичний ідеал, кульмінація сотень років теорія культиваціяї соціялістичної теорії. Але неочікувано для всіх, гниття робітничого консулу розкрилася.\n\nПокалічена нестабільністю, і майже одноголосних голосів необхідних щоб пройшло будь-що, Орєнбурзький робітничий консул рідко робить будь-що. Навіть гірше, консул процвітає корупцією та сепаратиськими тенденціями що хочуть знищити ту маленьку єдність що регіон має. Навіть з тима невпевненими реформами що були пропущені, відсутність влади як такової що керувала б Орєнбурґом зробила його приреченним на смерть від нерішучості."

 POLITICS_GEORGY_MALENKOV_DESC: "У дні старого Совєцького Союзу, були великі люди. Лєнін. Бухарін. Хоробрі люди. Тухачєвскій. Жуков. Були брілліанти адміністрації як Риков, і мастери інтриг як Яґода.\n\nІ тут з'являється Малєнков.\n\nҐеорґій Максиміліяновіч Малєнков не зміг знайти місця у Західно-Російському Революційному Фронті, одна з найближчих існуючих "легітимних" країна пов'язана з СССР. Вони не такі сильні чи розумні щоб зробити їхню власну вотчину, навіть через насилля або інтриги. Вони не мають союзників, вони не мають друзів. Він не був такий ж знаменитий щоб знайти свій шлях у табір якихось лунатиків як Лисенко. Натомість, Малєнков був змушений втрачати час, шукаючи якесь місто яке змогло б його взяти і його злитті таланти.\n\nВін знайшов Орєнбурґ, і тут він поклявся що він не буде недооціненний або відкинутий. Совєцький союз повстане знов, і він буде ним керувати.\n\nПевно що люди Орєнбурґу потребують бодай щось що дасть їм краще організацію. Певно Малєнков справді має щось що є справді талантом, Зів'ялі через презирство його колег. Проте якось, він знайшов себе у заряді цього міста, і на здивування його критиків, він здається чоловіком, що має план.\n\nФабрики. Індустрія. Більша. Сильніша. Вищі димарі. Більші квоти. Заставити їх працювати допоки вони не зломаються, А потім ломати їх поки вони не продовжуть роботи. Орєнбурґ зросте завдяки продукції. Це переможе свінець, залізо і сталь, і це буде переможено завдяки індустрії. Ніколи не думайте про якість. Ніколи не думайте про міцність. Єдине що важливо це кількість. Дайте одному снаряду бути гнсправним, дайте одній пушці мати осічку. Тут завжди буде ще одна на заміну їй, дайте одному чоловіку орудувати нею, і іншому її робити."

 POLITICS_ALEKSANDER_BURBA_DESC: "Навіть з винайдення комун Орєнбурґа, місто здається має дві реальності у війні між собою. На одній стороні, те що люди вільні. Вони живуть своє життя, і мають свої маленькі уряди, вільні від болючого впилву чи навіть невидимої руки ринку, від залізною руки держави. Але на іншій руці, Орєнбурґ це держава хаосу, і була з моменту її винайдення. Комуни наповнені розладом, дрібними сварками і навіть насиллям. Вони коштують набагато більше ніж ця земля може дати, і вона виглядає набагато більш бідною ніж вона повинна бути. The men and women of the Communes are tough and resourceful, but the militia shrinks from even the most meager of challenges. Orenburg is great, yet it is small. It is powerful, yet it is weak. It is a symbol of the future of the Russian Wastes, and a reminder of their past.\n\nAleksander Adolfovich Burba rose to power promising a convergence of these dual natures. He promised a strong centralized state, but not the iron-fisted dictatorship of Malenkov. He promised to respect the independent desires and needs of the people of Orenburg, but not succumb to the communes' anarchic nature. And who better? Burba also seems to be made of contradictions. He is as rich a capitalist magnate as one can find among the warlords, yet he acts seemingly only out of concern for his fellow citizens. His first move in power was was to cement his control over Orenburg's institutions, yet his seconds are independent souls rather than toadies or henchmen.\n\nBurba is most of all a deal maker, and the choice he has offered the people of Orenburg is a tempting one indeed. Their city can be made great again, forged in the fires of industry into the shining jewel of the Urals, paid for with loyalty, obedience, and hard work. And is it such a terrible price to pay? Are full bellies and warm homes worth a voice in government? Are nights free from gunfire worth squares empty of demonstrators? Is a glorious future worth a stifling present? Only time will tell how far Burba's ambitions stretch, and how far the people of Orenburg are willing to go to fulfill them."
 
