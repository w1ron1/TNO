 ORE_soviet_land_survey_legacy: "Legacy of the Soviet Land Survey"
 ORE_soviet_land_survey_legacy_desc: "With the survey having been done, the Council of Orenburg is more capable of understanding how to truly create a more equal ratio of land ownership between the people. No longer will we be oppressed by peasants more equal than others!"
 ORE_independent_industrial_program: "Independent Industrial Program"
 ORE_independent_industrial_program_desc: "Our industry, just like our people, are free! An independent industry will be sure to only benefit Orenburg. Our people are free, our industries are free, and Orenburg is free! Our accomplishments and industrial prowess as a free nation will be sure to make heads turn throughout the Urals, admiring our handiwork. Whether they see it from afar or just nextdoor, they will no doubt be in awe of its beauty."
 ORE_the_new_industrial_council: "The New Industrial Council"
 ORE_the_new_industrial_council_desc: "With our reforms, we have created a Council of industrial experts. Relying on their expertise will bolster our industrial capabilities. After all, these matters of industry cannot be left to amateurs!"
 ORE_uralian_training_program: "Uralian Training Program"
 ORE_uralian_training_program_desc: "Orenburg and the Ural League must prosper together. To this end, we have begun collaborating with them on military matters, to better ensure the safety of the people. Our relations are stronger, our armed forces are stronger, and our people are stronger! Together, with the League, Orenburg and the free people of the Urals will bring enlightenment to the people around us!"
