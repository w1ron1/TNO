 ### Leader Bios ###
 POLITICS_WORKERS_COUNCIL_ORENBURG_DESC: "Робітнича рада Орєнбурґа - водночас клей, що тримає це утворення разом, і магніти, які розтягують його на частини. У вогні та крові розпаду Росії самодостатні села об'єдналися у вільну конфедерацію, названу Робітничою радою. Совєцький Союз, авторитарна соціялістична держава, поступився місцем анархо-комуністичному вченню Орєнбурґа. Саме місто Орєнбурґ стало економічним, політичним і культурним осередком протодержави, і саме там засідає Рада.\n\nНа перший погляд Рада є утопічним соціялістичним ідеалом, підсумком сотень років теорії, яку плекали соціялісти впродовж історії. Та варто придивитися - і гнилий фундамент Робітничої ради стає очевидним.\n\nСкутій непевністю й вимогою майже одностайного голосування для ухвалення будь-чого, Робітничій раді Орєнбурґа рідко вдається бодай щось зробити. Гірше того, Раду пронизують корупція та сепаратистські настрої, що загрожують знищити рештки єдности регіону. Навіть попри обережне просування реформ відсутність цілісної виконавчої влади, здатної керувати Орєнбурґом, прирекла його на повільну смерть від нерішучости."

 POLITICS_GEORGY_MALENKOV_DESC: "За часів старого Совєцького Союзу були великі люди. Лєнін. Бухарін. Були хоробрі люди. Тухачєвскій. Жуков. Були блискучі адміністратори на кшталт Рикова й майстри інтриги на кшталт Яґоди.\n\nА ще був Малєнков.\n\nҐєорґію Максіміліяновічу Малєнкову не запропонували місця в Західноросійському революційному фронті - одному з найближчих до «законного» наступника СССР утворень. Йому не вистачало ані сили, ані розуму, щоб заснувати власний уділ насильством чи інтригою. У нього не було ні союзників, ні друзів. Він був навіть недостатньо помітним, щоб потрапити до табору якогось божевільного на кшталт Лисенка. Тож Малєнков був змушений блукати пусткою в пошуках скромного містечка, яке прийняло б його та його мізерні таланти.\n\nВін знайшов Орєнбурґ і присягнувся, що більше його не зневажатимуть і не відкидатимуть. Совєцький Союз постане знову, а він його очолить.\n\nМожливо, люди Орєнбурґа відчайдушно прагнули бодай якоїсь належної організації. Можливо, Малєнков і справді мав певні здібності, хоч їх і висушила зневага однодумців. Та хай там як, він опинився на чолі міста і, на подив багатьох недоброзичливців, схоже, має план.\n\nФабрики. Промисловість. Більше. Сильніше. Вищі димарі. Більші квоти. Працювати, доки не зламаються, а тоді ламати, доки не запрацюють. Орєнбурґ постане завдяки виробництву. Він переможе свинцем, залізом і сталлю, переможе промисловістю. Начхати на якість. Начхати на довговічність. Важить кількість. Нехай одна куля буде бракованою чи одна рушниця дасть осічку. Завжди знайдуться інші їм на заміну, люди, що ними орудуватимуть, і люди, що їх виготовлятимуть."

 POLITICS_ALEKSANDER_BURBA_DESC: "Від самого заснування Комун Орєнбурґа здавалося, що в місті борються дві природи. З одного боку, його люди вільні. Вони живуть власним життям і керують своїми маленькими урядами, вільні від згубного впливу як невидимої руки ринку, так і залізної руки держави. З іншого боку, Орєнбурґ від самого заснування перебуває в хаосі. Комуни сповнені незгоди, дріб'язкових чвар і навіть насильства. Вони значно багатші за довколишні землі, але водночас набагато бідніші, ніж мали б бути. Чоловіки й жінки Комун витривалі та винахідливі, та ополчення сахаються навіть найменших випробувань. Орєнбурґ великий, але малий. Могутній, але слабкий. Це символ майбутнього російської пустки й нагадування про її минуле.\n\nАлєксандр Адольфовіч Бурба прийшов до влади з обіцянкою поєднати ці дві природи. Він обіцяв сильну централізовану державу, але не залізну диктатуру Малєнкова. Обіцяв поважати незалежні прагнення й потреби орєнбуржців, але не піддатися анархічній природі комун. Та хто підійшов би краще? Сам Бурба теж наче витканий із суперечностей. Він настільки багатий капіталістичний магнат, наскільки це взагалі можливо серед воєвод, але діє, здавалося б, винятково з турботи про співгромадян. Першим його кроком при владі стало закріплення контролю над установами Орєнбурґа, проте його найближчі помічники - незалежні особистості, а не підлабузники чи поплічники.\n\nНайперше Бурба - майстер домовленостей, і вибір, який він запропонував орєнбуржцям, справді спокусливий. Їхнє місто може знову стати великим, викуваною у вогні промисловости сяйною коштовністю Уралу, а ціною будуть відданість, покора й тяжка праця. Та чи така вже вона страшна? Чи варті повні животи й теплі домівки права голосу в уряді? Чи варті ночі без пострілів спорожнілих від демонстрантів площ? Чи варте славетне майбутнє задушливого сьогодення? Лише час покаже, як далеко сягають амбіції Бурби й наскільки далеко готові піти орєнбуржці, щоб їх утілити."
 
