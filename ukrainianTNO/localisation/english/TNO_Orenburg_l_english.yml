 ### Focuses ###
 ORE_the_fifty_seventh_congress: "The Fifty-Seventh Congress"
 ORE_the_fifty_seventh_congress_desc: "It is time again to call representatives of the communes to begin a great Congress of the communes. A long, raucous democratic affair where every man is given a chance to discuss the state of the Orenburg commune. Problems both internal and external require the urgent attention of this 57th Congress. However, getting the assembly to agree unanimously on moving forward with various projects is a Sisyphean task..."

 ORE_the_matter_of_the_urals: "The Matter of the Urals"
 ORE_the_matter_of_the_urals_desc: "The most pressing topic on the Council's agenda is the ever worsening refugee crisis. The trickle of men and women seeking an oasis from the Russian anarchy has turned into a flood of wretched refugees trying to escape the depravity of the Black Mountain or the Nazi bandits. This influx of newcomers is straining the economy of various communes in the region and has brought our sluggish political system to a standstill.\n\nTo the north, the Ural League is facing a similar refugee crisis, and has suggested we join forces to solve the refugee crisis, and perhaps even strike at the twin evils of the east. While many on the Council believe this to be the only real way to fix the crisis, a surprising level of opposition has coalesced against this idea. The Ural League's military hierarchy stands against every political principle of the Orenburg Commune, such as decentralization and bottom up leadership. Breaking the deadlock on this issue is crucial for our future defensive and foreign policy."

 ORE_the_matter_of_communal_agriculture: "The Matter of Communal Agriculture"
 ORE_the_matter_of_communal_agriculture_desc: "Among the communes, only the city of Orenburg has something vaguely approximating a pre-industrial craftsmen economy. Every other commune is a loose association of local peasants working their fields in antediluvian fashion. As a result, crop yield is never very high even in good harvests. Keeping the city of Orenburg fed in a timely fashion generates much of the tension between the other communes and the city council even in the best of times. Now, the refugee crisis stresses the food stores to breaking point.\n\nComrade Malenkov and Burba of Orenburg city have for once found a topic where both agree: industrialization and organization of the various communes' agriculture must improve. Their proposal for mild reforms toward a joint agricultural policy has raised an uproar among the Council. However, others have shown interest in helping the peasants by sharing tools and knowledge. We find ourselves with the opportunity of building a coalition on the topic, or letting the reform idea slide."

 ORE_the_matter_of_communal_autonomy: "The Matter of Communal Autonomy"
 ORE_the_matter_of_communal_autonomy_desc: "Difficulties in discussing Orenburg's relationship with the Ural League and potential reforms to the Commune's agriculture originate from a single place: the centralization debate. Most of Orenburg's peasants do not feel any particular attachment to any regional identity; they work their land with their neighbors, and whenever a complicated problem arises a few local representative make the trek to Orenburg to complain and seek arbitration.\n\nThis extreme decentralization had to give way a little, explaining the creation of the Workers' Council. But few agree on what should the Council really be. Many, especially among those living in the city of Orenburg, wish to see the Council be a springboard for a more centralized government able to cut through endless negotiations and squabbles between the different communes, for the good of everyone in Orenburg. But many others argue that the Council doesn't have any authority beyond mediation and that true power has always resided in the communes.\n\nOn and on the centralization debate goes, as old arguments are brought on again and again. Meanwhile, the wolves outside Orenburg look on as our disunity threatens our land. The 57th Workers' Council is an occasion to try and sway the debate one way or the other."

 ORE_the_matter_of_trade_security: "The Matter of Trade"
 ORE_the_matter_of_trade_security_desc: "Our land has been mercifully spared most of the devastation brought on by the Germans. Some left-over Soviet industry as well as still functional natural resource extraction facilities bring the communes what little non-agricultural wealth they possess. Over time some of the outer communes have even begun to trade with the outer world, bringing in rare tools, supplies, and even a little bit of industrial and agricultural knowhow. Orenburg city itself is visited by foreign caravans several times a year.\n\nHowever the direction that Orenburg should take with regard to trade is filled with controversy. Many decry the impact of traders on regional security. Once safe roads are now preyed on by bandits. Communal militias bear much of the costs of keeping the trade routes secure, and communes with little interest in exports still find themselves embroiled in low intensity skirmish with bandits. During the Ural League debate a young priest from Abramovka suggested that the refugee crisis was made worse by the rumor that Orenburg is an untouched oasis amidst the chaos of Russia and Kazakhstan. His words touched a nerve, and soon a working committee of isolationist communes began producing proposals to regulate trade with the outside world."

 ORE_the_communes_input: "The Communes' Input"
 ORE_the_communes_input_desc: "The Workers' Council waxes and wanes as the days pass. Previously discussed topics recur again and again. Sasha, a peasant from Chernyy Otrog commune wishes to give his village's opinion on how the Ural League bastards that once bought him a cow for a fifth of its real worth. Another commune has helpfully crafted a new version of Malenkov and Burba's agricultural policy that they insist will obtain everyone's agreement.\n\nCommune by commune, village by village, family by family, all of Orenburg has the right to speak at the Workers' Council. Peasants plough old topics, revealing fresh disagreements. Communal representatives give their assessment of the day's proposals. Occasionally representatives from remote area stumble through the door, and other members explain to them in detail the discussions they missed.\n\nThe effort of workers' democracy continues late into every night, only stopping when the samovar runs out of water for tea."

 ORE_the_end_of_the_congress: "The End of the Congress"
 ORE_the_end_of_the_congress_desc: "The Congress has at last reached the end of every member's patience. The representatives have split off in several committees to write closing remarks, to be read during the final session.\n\nTired Orenburg City Council members struggle to write their position paper. Treasures of rhetoric, energy and backroom deals have once again been spent by the centralization faction for little gain.\n\nOutside Orenburg, the wolves circle ever closer..."

 ORE_word_from_the_fringes: "Word from the Fringes"
 ORE_word_from_the_fringes_desc: "Not long after the end of the 57th Workers' Congress, word has reached us of increased raids on isolated communes on the frontier. It is difficult to assess the extent of the danger from the conflicting stories told by refugees and the remnants of frontier militias. The rumor running through Orenburg tells of Dirlewanger's accursed brigade, having begun an invasion of the Ural League and the Orenburg commune.\n\nFiltering through the information and sending riders to the frontier communes will take time, but allow us to know what is truly going on."

 ORE_revive_the_levy_question: "Revive the Communal Levy Proposal?"
 ORE_revive_the_levy_question_desc: "Our worst fears about the military situation on the frontier have revealed themselves true. Dirlewanger's bandit army and Lysenko's NKVD remnants are preparing an invasion of the commune. The Workers' Council currently has no army to speak off and is unable to command the various communal militias to join up on the frontier. A controversial old idea has been brought back to life: levying troops from the various communes to form an army able to defend the region. The idea had never made it past the discussion stage in better times; let us hope that the communes will agree to collaborate in this time of crisis..."

 ORE_investigate_the_communal_militias: "Investigate the Communal Militias"
 ORE_investigate_the_communal_militias_desc: "Each village is defended by its men and women, arranged in irregular communal militias. Since each commune is free to tend to its safety independently, standards vary from village to village. If nothing else, assessing the constellation of militias will let us gauge how many men and women can be marshaled in time of needs. Knowing the current distribution of military equipment will also help us spread our meager ammunition and gun reserves to where it is most needed."

 ORE_raising_the_issue_once_more: "Raising the Issue Once More"
 ORE_raising_the_issue_once_more_desc: "With a better idea of the situation on the frontiers and of the state of military preparation across Orenburg, the Workers' Council has drafted a new military policy proposal. Reviving the levy idea has resulted in many a shouting match in the relatively tame Workers' Council between those that are for centralization or against it; now we must prepare for the coming wave of indignation when the idea is brought to every commune."

 ORE_reassure_the_communes: "Reassure the Communes"
 ORE_reassure_the_communes_desc: "Thanks to the rough state of Orenburg's roads the avalanche of angry reactions has been slow to build up. But this morning a great commotion broke out on the edges of Orenburg city as angry communal representatives began marching into the city. The angry shouts of "traitors to the peasants" shouted at the guards brought on a counter march of refugees crying for the representatives to go argue with the raiders instead of hiding here in Orenburg city. The chaos continued spreading as neighboring villages began marching in militiamen to help restore order and ascertain that reactionaries had not taken power.\n\nIt is now a priority to send riders to as many communes as possible to stem the flow of angry representatives as well as calm things down in Orenburg city. Soothing the commune's nerves will avoid further damages to the Workers' Council legitimacy."

 ORE_the_fundamental_problems: "The Fundamental Problems"
 ORE_the_fundamental_problems_desc: "The fallout of the communal levy fiasco has roused many factions of the Workers' Council to intense debates. A strong majority of the Workers' Council have now been convinced beyond doubt that Orenburg's dysfunctional structure is killing it, and previously fringe ideas have begun to enter the Workers' Council's mainstream. It is time for us to sway undecided members to the cause of reform and keep anti-centralization factions on the margin of the debate."

 ORE_we_need_a_plan: "We Need a Plan"
 ORE_we_need_a_plan_desc: "Our coalition building work has paid dividend. The Workers' Council now hums along as former rivals work together to hash out a new plan for the upcoming 58th Workers' Congress. Backroom deals, blackmail, bribery, heartfelt arguments; a wealth of political capital is being gathered to help push ambitious proposals forwards. Two men, Georgy Malenkov and Aleksander Burba have emerged as leaders in this newly energized reform movement. While both agree that economical and political reforms need to be completed for Orenburg to live, they and their supporters argue endlessly about the necessary scope of the reforms. Burba's radical proposal are believed to be too difficult to make work, while Malenkov's plan is accused of being a mess of halfway measures. Time being of the essence, a decision must be reached as to which path the reform faction desires to proceed with."

 ORE_arrange_the_program: "Arrange the Program"
 ORE_arrange_the_program_desc: "It is time again to call representatives of the communes to begin a great congress of the communes. A long, raucous democratic affair where every man is given a chance to discuss the state of the Orenburg commune. This time, however, things shall be different.\n\nThe soft and leaderless Workers' Council has been hardened by the military crisis and energized by a newfound sense of urgency. With the backing of increasingly desperate border communes, we have begun finalizing our preparation for the Workers' Congress. It will be a difficult fight, but for the good of the Orenburg commune it is one that we must win."

 ORE_the_fifty_eighth_congress: "The Fifty-Eighth Congress"
 ORE_the_fifty_eighth_congress_desc: "The time has come for the Fifty-Eighth Congress, a meeting which we hope shall lead to actual solutions for the issues that plague Orenburg. Much political capital has been spent, plans discussed, and coalitions formed in the Workers' Council.\n\nThe issues that shall be discussed are many - the decentralized militias, the lack of leadership on the Council, and the utter inability for Orenburg to perform any sort of decisive action. By the end of the Congress, we hope to be able to finally start addressing these issues."

 ORE_fight_the_controversy: "Fight the Controversy"
 ORE_fight_the_controversy_desc: "One of the greatest controversies that has afflicted Orenburg is the issue of putting a chairperson at the head of the Workers' Council. To many in the communes, it harkens back to the days of Lenin putting down the regional soviets and the Left-SRs - a dangerous and reactionary move that could lead to tyranny in Orenburg.\n\nHowever, we must be able to fight this controversy, and move past it. The Council needs a chair in this trying time, and any excessive powers that they are given are sure to have a check on them that can be used in a truly democratic manner."

 ORE_make_compromises: "Make Compromises"
 ORE_make_compromises_desc: "Currently, the Workers' Council can be separated into two: Those who wish to concentrate power into the government in the name of efficiency, and those who wish to distribute it across the Commune in the name of principle. Nowhere has their diverging opinions erupted more violently than in deciding upon the new Chairman's powers. Understandably, the firebrands for maintaining Orenburg's direct democracy to the letter look askance at any attempts to give the Chairman responsibilities beyond that of a figurehead, whereas its reformists long for a figure who can bring motion to their government past shaky, tenuous consensus.\n\nIn an ideal world either side will find all their objectives accomplished - the Chairman can be as weak or as strong as they wish. But in the war-torn remnants of Russia, where wolves gather upon hoarfrosted sheep? Compromise must suffice."

 ORE_propose_a_chairperson: "Propose a Chairperson"
 ORE_propose_a_chairperson_desc: "The time has come, to propose a chairperson for the Council. This is a drastic measure, but even if we fail in our task, there are alternatives. In addition to proposing a chairman, one of our allies has also put forth a proposal for an empowered council with a rotating chair, voted on each meeting. By putting our most extreme proposal first, even if it fails, we should be able to negotiate the Council down to choosing our more moderate proposal. The indecision and inanity ends today!"

 ORE_the_counter_proposal: "The Counter-Proposal"
 ORE_the_counter_proposal_desc: "The Council has voted down our proposal, but accepted our more discrete secondary proposal. The Council shall having a rotating chairperson with the power to end discussion on a topic, so long as this measure is not cancelled by a 50% vote in the Council. Additionally, the new position will have the power to prioritize measures. This should, hopefully, open up a window where we can propose measures that would otherwise be buried in less important issues, lost, or otherwise require an impractical amount of political capital to actually bring to the floor."

 ORE_malenkovs_speech: "Malenkov Rises"
 ORE_malenkovs_speech_desc: "The Council has approved our proposal, and chosen Georgy Malenkov as the new Chairman, for a term of four years. Malenkov has promised stability and order above all, within the framework of Orenburg's libertine tradition, of course. Already, his faction is preparing numerous emergency measures to deal with the crisis at hand.\n\nWhile some call Malenkov a tyrant-in-waiting, he has taken numerous measures to attempt to prove to the Council that he has no grand ambitions towards seizing power or other such betrayals of Orenburg. After all, he says, such things would be counter-revolutionary, and would only be justified in the time of greatest need..."

 ORE_burbas_speech: "Burba's Speech"
 ORE_burbas_speech_desc: "The Council has approved our proposal, and chosen Aleksander Burba to serve as our new Chairman. Burba has been accused of radicalism in the past, but his well-spoken manners and painstakiningly organized plans have won over many in the Council to his side. He promises a re-organization of the economy over all, industrialization, and a more scientific and orderly means of organizing life in Orenburg.\n\nBurba has already proven his worth to Orenburg by establishing several industrial committees and schools in the past, and many on the Council are excited and pleased to see his goal of turning Orenburg into a true sparkling jewel of Russia be realized."
 
 #Anarchy/LibSoc
 
 ORE_calling_the_council_to_order: "Calling the Council to Order"
 ORE_calling_the_council_to_order_desc: "The end of the 58th Workers' Council has seen some anger and infighting break out amongst the centralization faction of the Workers' Council. Many are disappointed in the inability to push through a really strong central executive.\n\nThankfully the new chairman has managed to squelch dissent. In a rousing speech, the Council's members were reminded of the unprecendented opportuntiy to reform, strengthen and organize Orenburg. We can now assign people to various committees and get the projects started."

 ORE_institute_common_judicial_guidelines: "Institute Common Judicial Guidelines"
 ORE_institute_common_judicial_guidelines_desc: ""Each commune is free to make its own justice" has always been how things are done. In practice, the few provincial lawyers left in Orenburg after the war were unable to prevent the rise of lynch mob and show trials across the vast range of communes. Even in Orenburg city crowds of people are able to sway the proceedings of the courts.\n\nThe old way of doing things, with laws imposed by a central clique of lawyers, will never be accepted again in Orenburg. But a new justice, built from the grounds up on the rights of every citizen can be established. Once the workers of a commune have built up the laws with the help of worker city's legal advisors, they shall feel compelled to let justice run its course."

 ORE_reform_the_peoples_tribunals: "Reform the People's Tribunals"
 ORE_reform_the_peoples_tribunals_desc: "It is one thing to have fair laws on the books for various offenses and crimes; it is another to have a fair set of punishment for criminals. in the harsh Russian anarchy the penalty for any crime is too often being hanged or shot at dawn.\n\nMonetary compensations, forced communal labors or year long assignment to Orenburg city's militias have been introduced to the various people's tribunals to end the widespread death penalty use. Helping mediating feuds between local families to prevent bad blood amongst the jurors will also help in this endeavour, as well as gathering mobs to shout down anyone that opposes this reform."

 ORE_discuss_the_unequal_investments: "Discuss the Unequal Investments"
 ORE_discuss_the_unequal_investments_desc: "One of the causes of the Orenburg Commune's problem with centralization is the sheer weight of Orenburg city in regional affairs. While most of the communes operate on a primeval agrarian economy, Orenburg city has a roughly functioning money economy where goods are crafted and traded.\n\nThis imbalance in the resources has led to an imbalance in investments. Orenburg city foots much of the bill for regional investments, and this has generated plenty of distrust between city dwellers and rural communes. Any attempt at investment in a commune's territory is seen as a preliminary step to Orenburgian take over of the area. Meanwhile, requests of emergency investments by communes are routinely turned down by stingy Orenburg merchants unwilling to help the uncooperative communes.\n\nConvincing the communes to be equal partner in investments is the first step in addressing this imbalance. No matter how poor, the communes must contribute to the common cause. In return they shall access a greater pool of potential investment money. From each according to their ability, to each according to their needs."

 ORE_common_investment_contributions: "Common Investment Contributions"
 ORE_common_investment_contributions_desc: "The communes have inevitably proven to be skeptical about the idea of pooling money in the common funds. Many of the smaller communes have only a few rubles worth of resources to offer us, and do not understand how such limited resources could help the greater good. A few pilot development projects entirely funded through local efforts should help demonstrate to skeptics that many hands make light load.\n\nNo matter the resistance, we must make everyone understand that the era of freeloading is over."

 ORE_organize_communal_representation: "Organize Communal Representation"
 ORE_organize_communal_representation_desc: "Every citizen is entitled to representation in the Workers' Congress, and shall always be entitled to representation. However, the practice of variable communal representations has contributed much to the chaos present in Workers' Congresses. Some communes send too few men for their population size, some communes send too many. in the winter when the fields are dormant communal representatives tend to swarm into Orenburg city, whereas in the summer many delegations are absent.\n\nFrom now on, every commune will have a fixed amount of delegates depending on their population size. Every citizen of the commune will have to present their problems to their representatives before they leave, instead of tagging along to Orenburg city in large informal groups."

 ORE_scheduled_congress_meetings: "Scheduled Congress Meetings"
 ORE_scheduled_congress_meetings_desc: "It is true that the roads and dirt paths of Orenburg leave much to be desired, and that planting and harvesting seasons occupy most commune's free men and women. However, the practice of arriving late in the Workers' Congress causes endless repetitions of already discussed topics, and has an annoying tendency to bring back to the front old debates.\n\nFrom now on, every congress will be scheduled long in advance, and delegates that are late will lose their participation rights in the congress. Monetary contributions will be given to distant representatives to help them make the trip on time."

 ORE_codify_central_powers: "Codify Central Powers"
 ORE_codify_central_powers_desc: "The communes' counter-proposal for a Council with supreme decision power has come with the caveats that these decision powers are limited to specific areas. Clearly stating the areas where the Council is supreme will help soothe the fair of creeping authoritarianism in Orenburg city, and will hopefully convince the communes to back the Council's authority.\n\nChief amongst our limited areas of influence is the general oversight of Orenburg's militias. A set of clear proposal over the military's workings will help us prepare for the upcoming storm."

 ORE_draft_the_workers_constitution: "Draft the Workers' Constitution"
 ORE_draft_the_workers_constitution_desc: "With its limited mandate and clearly described working, the new Workers' Council is ready to draft a constitution for the workers of Orenburg. No more rumors, no more misunderstandings and no more confusion. The new Orenburg will follow well laid out democratic principles as enshrined in the workers' constitutions."

 ORE_develop_the_outer_regions: "Develop the Outer Regions"
 ORE_develop_the_outer_regions_desc: "The outer regions lay in an unfortunate limbo caused by the Workers' Council's dysfunction. Hardest hit by the refugee crisis and increase in raids, the communes on the frontier have been amongst the most loyal allies of the Workers' Council reform faction, yet have received no help up to now. Investing in these areas will strengthen the commune's hold on the land, reassure local leaders of Orenburg's protection and help fortify our borders."

 ORE_the_peoples_justice: "The People's Justice"
 ORE_the_peoples_justice_desc: "In most communes, the justice system is an ad hoc organisation of village elders, priests, and local big men. Encouraging each commune to elect judges will help strengthen our legal reforms and generate over time a pool of local citizens with legal expertise and a good eye for jurisprudence."

 ORE_the_fifty_ninth_congress: "The Fifty-Ninth Congress"
 ORE_the_fifty_ninth_congress_desc: "It is time again to call representatives of the communes to begin a great congress of the communes. A long, raucous democratic affair where every man is given a chance to discuss the state of the Orenburg commune.\n\nAn ambitious package of reforms has been gathered. A change to the justice system; a joint investment policy; a new workers' constitutions. for the first time we have the ability to determine the congress' agenda and use the chairman's powers to keep everyone focused. Reports from across Orenburg are mixed on the level of support our proposal has, and we can only wait to see if the communes will let us forge ahead to a brighter future, or if Orenburg is doomed to anarchy..."

 ORE_the_beginning: "The Beginning"
 ORE_the_beginning_desc: "The reform proposal has passed! The constitution's preliminary draft has passed to thunderous applause. Orenburg now has a government, weak as it may be. Many of the more skeptical communes have come to congratulate us on using our powers to create a strong consensus. The path ahead shall be difficult, but we no longer walk it alone."

 ORE_proclaim_internal_peace: "Proclaiming Internal Peace"
 ORE_proclaim_internal_peace_desc: ""A thousand militias to defend the weak! A thousand arms to help those that struggle to walk! A thousand links in the great chain of workers!"\n\nWord has been sent out to communes big and small that peace and order shall be restored by the Workers' Council. Village priests read out the workers' constitutions to those that cannot read. And on the struggling border, for the first time in months the communes dare dream of a happy future for Orenburg."

 ORE_common_responsibilities: "Common Responsibilities"
 ORE_common_responsibilities_desc: "The principle of universal contributions to a centralised army and investment fund have been accepted by the communes. However much remains to be done to determine the level of responsibility born by individual communes. Number of soldiers, levels of investments, quantity of resources, each village and city's contributions must be appraised and negotiated. Where the Workers' Council legal authority ends new committees and organisations must be set up to ensure the success of the workers' government."

 ORE_common_finance: "Common Finance"
 ORE_common_finance_desc: "The vaunted common investment policy features in almost every single reform project. However, the devil is in the details, and many of the preliminary ideas the Workers' Council detailed on the policy have to be scrapped and replaced through cooperation with the communes. Still, little by little the project moves forward. There is no lack of investment opportunities big and small across our land, and reports on the first few projects look promising."

 ORE_revoke_the_privilegia: "Revoke the Privilegia"
 ORE_revoke_the_privilegia_desc: "While the workers' constitution retains a strong majority, many communes have stepped forward to remind us of privileges negotiated in such and such treaty, or such and such Workers' Congress. By playing off commune against commune and by reminding everyone that has signed the workers' constitution that they have agreed to its laws, we can slowly whittle down the mess of exemptions, secret clauses and special privileges that threaten to derail our reforms."

 ORE_create_the_higher_command: "Create the Higher Command"
 ORE_create_the_higher_command_desc: "The centralized Orenburg army is one of the few areas where the Workers' Council has any degree of real power. Left to make our own decisions by the commune, we have been mostly been free to design the structure of Orenburg's army as we see fit. Chief amongst them is the question of finding men to lead it. By tapping veterans of the great war against the Germans, and a few recent arrivals from the Ural League and the WRRF we have drafted a structure to integrate communal militias under a clear order of command. The few experimented veterans will be used to create a high command whose supreme authority rests on the Workers' Council."

 ORE_the_leagues_training: "The League's Training"
 ORE_the_leagues_training_desc: "Every self-respecting commune has developed its own militia to defend land and families. However, groups of peasants with a few hours of rifle shooting does not an army make. With the powers granted to the Workers' Council we are finally free to invite Ural League officers to improve our men's training. The League has suggested to organise a number of regional military camps, easily reachable in a day or two of travelling by nearby communes. There the militias can be trained together by the League's officers, and a feeling of belonging to something greater than be inculcated in the various militias."

 ORE_accept_their_aid: "Accept Their Aid"
 ORE_accept_their_aid_desc: "The Ural League's meticulous reports on the state of our militias' training has revealed shortages of arms and supplies yet unaccounted for. The League has graciously offered to help us equip our men from their own stores of equipment if we can help them organise and move their convoys through our land."

 ORE_grant_full_access: "Grant Full Access"
 ORE_grant_full_access_desc: "Little by little, the communes have begun to trust the League. Even the most isolated villages have begun to warm to the League as officers from the Urals have helped trained their men and women. On several occasion League members have saved villages from bandit raids. The men of the League already have de facto access to much of the frontier, and the inland communes have brought us a proposal to extend the league's access to all of Orenburg to help facilitate training and defence."

 ORE_revive_orenburgs_shops: "Revive Orenburg's Shops"
 ORE_revive_orenburgs_shops_desc: "With the establishment of the new Workers' Army, a great market for guns and ammunitions is opening up. With the early stages of our common investment policy in effect, money and resources are pouring in to revive old factories and workshops to produce guns. Many regional militia associations have pooled up their resources to finance their own gun works in the capital, and now convoys of guns and ammunitions are streaming out of Orenburg's shops toward the frontlines. With just a little push, we could accelerate this weapon boom and help arm our men."

 ORE_a_professional_militia: "A Professional Militia"
 ORE_a_professional_militia_desc: "The League's generous help cannot cover all of our towns and villages. By using our own military veterans we have started wandering military academies giving workshops to communal militias. By giving the local men and womens a taste of well regulated military life, we hope to turn some of them from part time militiamen to full time soldiers, forming a kernel of our new professional military."

 ORE_the_best_officer_candidates: "The Best Officer Candidates"
 ORE_the_best_officer_candidates_desc: "Many militias in the richer areas and frontier land have shown interest in organizing into full time military companies, complete with a set of locally elected officers to help link our high command with local troops. While we must continue to respect the principle of bottom up workers' organization, a great deal of locally elected officers are chosen by popularity instead of merits. By using our veterans and League advisers to vet candidates we hope to teach the new soldiers that electing bad officers is the best way to waste their commune's military effort."

 ORE_renovatio_orenburgii: "Renovatio Orenburgi"
 ORE_renovatio_orenburgii_desc: "Every commune buzzes with activity. Old resource extractions works are opening back up, their material streaming into factories and workshops. Soldiers with high morale and respectable levels of professionalism patrols our roads as well-ran communal council implement reforms of their owns, mimicking the sane and sensible democracies of the world.\n\nIt is a new age for Orenburg, an age where we can finally exist as a united society, and a gleaming jewel in the dark wastelands of Russia."

 ORE_dust_in_the_wind: "Dust in the Wind"
 ORE_dust_in_the_wind_desc: "The proposal has failed! As the Workers' Congress breaks down in angry disagreement and reproaches, the frontier commune's representative stream out one by one, faces ashen with fear. All hope of reforming the communes in time for the war have been lost..."

 ORE_salvage_what_we_have: "Salvage What We Have"
 ORE_salvage_what_we_have_desc: "The 59th Workers' Council still goes on. Most of the reform faction have already given up, spending their days drinking while Orenburg's future burns. A few, led by Comrade Burba still strive to extract as many resources as they can from the communes to mitigate the disaster."

 ORE_pray_for_a_miracle: "Pray for a Miracle"
 ORE_pray_for_a_miracle_desc: "As soon as the news from the proposal came, the Ural League representative asked for a meeting with the leaders of the reform faction. We can only break them the news that they are on their own, and that all that is left to do is to pray for a miracle..."

 ORE_the_storm_on_the_horizon: "The Storm on the Horizon"
 ORE_the_storm_on_the_horizon_desc: "The probing raids on our borders have begun escalating in intensity. The few scouts that have managed to make it back all tell us that Dirlewanger's army is coming. Frontier commune are being evacuated, causing clashes with militias further inland.\n\nOn the frontier, a few militiamen wait at their posts, rifle in hands. They are joined by the Orenburg City Council members that have given up on gathering more preparation. The only thing left for them to do is to wait for the coming storm."

 #Malenkov
 ORE_to_ensure_security: "To Ensure Security..."
 ORE_to_ensure_security_desc: "Chairman Malenkov plans to make a passionate speech about the need for expanded powers to be given to him in this hour of need. Orenburg faces the worst of Germany's worst, battle-hardened through years of battle across Russia. If the rumors of Dirlewanger's Brigade being given state of the art weapons by the mad scientists of Magnitogorsk are true, then all of Orenburg is in great danger. Relying on the Ural League too much for help is a surefire way to lose the independent workers' democracy that every citizen of Orenburg is entitled to. Under Malenkov's strong direction, an empowered Workers' Council would be able to forge the communes into a stronger workers' state, able to defend our land..."

 ORE_and_continuing_stability: "...and Continuing Stability..."
 ORE_and_continuing_stability_desc: "...But of course, this stronger state will only be needed as long as the war goes on. It pains Comrade Malenkov deeply to weaken the workers' democracy that sees the strength and dignity of every person in Orenburg. The Workers' Council and its chairman wish not to replace this honorable tradition, but instead shield it from this period of crisis and instability. In a new speech spread to every commune, the Chairman suggests a temporary state of emergency, lasting only until the defeat of the German menace. While many communes are projected to oppose this unprecedented assault on workers' rights, Comrade Malenkov's faction is very popular amongst the refugees of Orenburg city and in the communes of the eastern frontier. Building on this base of supporters, we shall convince Orenburg of the need for this state of emergency."

 ORE_reorganize_the_workers_council: "Reorganize the Workers' Council"
 ORE_reorganize_the_workers_council_desc: "The Workers' Council current organization, created for the peacetime workers' democracy is ill suited to the unprecedented level of power entrusted to the Council and its Chairman. By reorganizing the Workers' Council around its central executive and establishing a clear chain of command, the whole organization can be made into a fine-tuned political machine apt to make difficult decisions in a timely manner. While some worry about the transformation of the Workers' Council into a top down structure, Chairman Malenkov insists this is the best way to prepare for the path ahead."

 ORE_reorganize_orenburgs_guard: "Reorganize the Orenburg Guard"
 ORE_reorganize_orenburgs_guard_desc: "The Orenburg Guard had always been a militia amongst others. A large militia, befitting its defense of the largest commune of the region, but a militia nonetheless. By reforming its structure along the lines of a more traditional military we can improve the battle effectiveness of our largest contingent of men at arms, and make it easier to deploy it to the front when the time comes. In addition, introduction of officers to the traditionally equalitarian militia formations will help the Council and its chairman keep control of the soldiers and prevent anyone from usurping the Guard's ability to defend workers' democracy."

 ORE_secure_the_outer_communes: "Secure the Outer Communes"
 ORE_secure_the_outer_communes_desc: "While the Workers' Council has authority on a large region in theory, in practice the further one goes from Orenburg city the less attachment the local communes feel. The core of the opposition to Chairman's Malenkov new reforms came from the communes in the west and north. Shielded by the Ural League from bandits, the local leaders do not feel any urgency to unite against the German barbarians in the east.\n\nBy sending members of the Orenburg Guard into these misguided areas for joint militia training exercise, we hope to reassure all of our citizens that in these troubled times the Council protects all of our citizen equally."

 ORE_the_future_is_ahead: "The Future is Ahead"
 ORE_the_future_is_ahead_desc: "It has been done. Chairman Malenkov has managed against all odd to break the endless stagnation of Orenburg's workers' democracy. Misguided resistance by the remaining skeptical communes has been soothed, and deadweight on the Workers' Council has been pruned. The long dormant potential of the region and its inhabitants can now be tapped, and under the wise guidance of our Chairman we can begin building the bright future that everyone from Orenburg deserves."

 ORE_the_necessity_of_communal_industrialization: "The Necessity of Communal Industrialization"
 ORE_the_necessity_of_communal_industrialization_desc: ""We are fifty or a hundred years behind the advanced countries. We must make good this distance in ten years. Either we do it, or they will crush us."\n\nSo begins the upcoming speech of Chairman Malenkov. An ambitious industrialization program is to be announced in Orenburg city. Every commune will be encouraged to reach its true industrial potential through a centrally planned economic plan. While some in Orenburg such as the failed reformer Aleksander Burba caution the Council that the timeline is too aggressive and the current agricultural economy too fragile to handle perturbations, Chairman Malenkov has brushed all concerns aside. Fire and steel shall transform our workers' lives!"

 ORE_heavy_industrial_commissariat: "Heavy Industrial Commissariat"
 ORE_heavy_industrial_commissariat_desc: "Mostly spared from the inane Luftwaffe bombing and having avoided warfare, it is a travesty that Orenburg has not yet become a hub of heavy industries. Chairman Malenkov plans to spin off the current industrial subcommittee into an independent government organ, the Commissariat of Heavy Industry, or Komtyazhprom. The idea of a structure outside of the Workers' Council being responsible for an entire sector of Chairman's Malenkov ambitious reforms is a new development in Orenburg's politics, but the Council has been reassured that the Chairman and his closest associate will constantly monitor the commissariat's activities and ensure that our community's health and prosperity remains the principal concern of every new project."

 ORE_plowshares_into_swords: "Plowshares Into Swords"
 ORE_plowshares_into_swords_desc: "Our extant industrial base is mostly concerned with the production of agricultural equipment, leaving our supplies of weapons and ammunitions dangerously low. One of Komtyazhprom's first proposals is to convert our civilian industry to military purpose. The council's reaction to this idea has not been warm, as many representatives from the villages stress that any degradation of our agricultural production is likely to cause famine across the region. The industrial commissariat's experts have replied with arguments of their own. They argue that the thing holding back our peasantry at the moment is not lack of tool, but rather poor knowledge of modern agricultural technique and inefficiency in getting food to regions with production deficits. Besides, once our new factories begin their work whatever temporary decline in agricultural equipment production will be insignificant compared to the output of our new tool factories!"

 ORE_mechanize_the_peasantry: "Mechanize the Peasantry"
 ORE_mechanize_the_peasantry_desc: "Developing an expertise in making tractors is one of the first objective of Chairman Malenkov's industrialization. Our peasants still labor using animals of burden to tend to their land. By giving every commune its own tractor, the peasant's task will be made a thousand times simpler! This will have the pleasant side effect of freeing up many peasants to join in our new industrial works as well as letting us obtain new horses for governmental use. Warnings that the population is ill trained to make use of mechanized equipment or that the supply of petrol to distant commune is limited are simply counter-revolutionary drivel attempting to create doubt about the capacity of the Orenburgian peasant to adapt to the future."

 ORE_into_the_factories: "Into the Factories"
 ORE_into_the_factories_desc: "Already the manpower coming from Orenburg city's refugee population has dried up as our expanded Orenburg Guard and new industries have provided work for our citizens. To meet our projected manpower needs newly mechanized agrarian communes have sent us the peasants freed from farm work. The resettling of peasants away from their isolated communes and into our regional industrial centers and into Orenburg itself will help strengthen the bond between the citizen of our great nation and break the dogma of communal thinking. Of course, not all peasants are eager to abandon their villages to find new types of work, so our benevolent government must at time remind citizens of the incredible chance we have given them."

 ORE_a_workers_republic: "A Workers' Republic"
 ORE_a_workers_republic_desc: "Until now Orenburg has been a workers' state in common speech, yet only a fraction of our people were free from the shackles of grinding agrarian poverty. As our new factories rise and as their workers begin their new life using humanity's knowledge to multiply their strength, we can proclaim the beginning of a true Workers' Republic! Each day the industrial cornucopia grants us the weapons we need to defend our future and the tools we shall use it to reach it!"

 ORE_the_necessity_of_political_centralization: "The Reason for Political Centralization"
 ORE_the_necessity_of_political_centralization_desc: "The honorable Workers' Council has struggled all these years to help progress in Orenburg. Tragically, it could never make any of its project work, hamstrung as it was by its equalitarian structure and complete reliance on negotiated compromise. Even as the Workers' Council complained of the Workers' Congresses' endless arguments and ever circular discussions, the Council found itself replicating in miniature the congresses' dysfunction. Chairman Malenkov's imposition of a hierarchy at the start of his mandate has helped thing, but the great military emergency in the east allows no further delays. By reminding Malenkov loyalists on the Council the potential of helping him stabilize the political structure and by making use of those from Dirlewanger threatened areas on the Council, we can ascertain once and for all the power and legitimacy of the Chairman in his great crusade to save Orenburg from its enemies."

 ORE_lock_down_the_communes: "Lock Down the Communes"
 ORE_lock_down_the_communes_desc: "The power of the Workers' Council has always rested on the people, and the people have always had the right to leave the Council any time they desired.\n\nYet in this hour of need the requests for secession received by Chairman Malenkov have been felt by our leader as so many knives plunged in the back of a country determined to protect its children.\n\nConcerns about a burgeoning dictatorial regime? Misgivings about industrial policy? Honest desire to simply be left alone in this darkest hour? The secessionists can give all the reasons they want. Chairman Malenkov's love and forgiveness extends to all in Orenburg. Representative on missions to these communes, escorted by our military, will ascertain the true reason for these requests to leave our government. No doubt these were misunderstanding brought on by poor communication. The men of our Workers' Army will make sure of this."

 ORE_cut_down_the_council: "Cut Down the Council"
 ORE_cut_down_the_council_desc: "Every worker of Orenburg deserves the undivided attention of the Workers' Council and its benevolent Chairman. However, the current mass of members in the Workers' Council is simply too unwieldy, especially in these difficult times. Henceforth all commune shall be limited to a single representative on the Workers' Council. To maintain the Council's performances in this era of emergency, the first set of representatives will be chosen by Chairman Malenkov to ensure a team able to get along well with the people's Chairman. This emergency measure shall of course be repealed once the crisis is past."

 ORE_more_equal_than_others: "First Among Equals"
 ORE_more_equal_than_others_desc: "A new set of literature has been printed and distributed across every town and village explaining the new organization of the Workers' Council. Workers' democracy perfected in a new system where every commune has its representative, and where Chairman Malenkov is merely first amongst equals on the Council. Every month new committees are drafted to work on a variety of topic, their ideas and suggestions analysed by a cadre of men of the Council elected by their peers. We must be grateful that Chairman Malenkov's workaholic tendencies have led to his regular reelection to the supervision council, as his long nights of work have led to him being knowledgeable about the Council's every project."

 ORE_the_necessity_of_military_reorganization: "The Reason for Military Reorganization"
 ORE_the_necessity_of_military_reorganization_desc: "If we're to weather the coming storm, we must continue reorganizing our forces into a single centralized military. Our earlier work in reshaping the Orenburg Guard has provided us an efficient template to apply to follow. Through a process of negotiation with our allies on the eastern border, then with communes close to Orenburg, a bigger and bigger number of militias have entered a set of new "local strategic command" that unite several militias into an integrated command structure headed by the Workers' Council. As this reorganization spread west, more and more militia units are being integrated into our centralized army as local leaders fear being stuck outside of the security system."

 ORE_centralize_the_communal_guard: "Centralize the Communal Guard"
 ORE_centralize_the_communal_guard_desc: "We've begun breaking up the bigger militias and transitioning units from local strategic commands into battalions that are mixed with our expanded Orenburg Guard. With this we can finally start erasing irrelevant communal ties and replace them with a regional identity and a strong esprit de corps. Groups of soldier that have not yet truly internalized the greatness of the new Workers' Council will be placed closest to the frontier with Dirlewanger's Brigade to teach them valuable lessons about the protection of the weak and innocent. Units with a great level of political understanding shall in turn be stationed in the west to help the local's growth. And throughout Orenburg, a clear chain of command now exists, leading to the Workers' Council and its Chairman."

 ORE_standardize_their_weaponry: "Standardize Their Weaponry"
 ORE_standardize_their_weaponry_desc: "The centralization of the communal guards has rewarded us with a treasure trove of weapons as men simply brought into the new army their old weapons. Unfortunately this new arsenal is ill suited to anything other than the establishment of a military history museum. Modern shooters from Zlatoust, Soviet gear stamped with the Western Russian Revolutionary Front's numbers, battered Arisaka rifle from the Co-Prosperity Sphere, handmade stuff from the Kazakh plains... The diversity of equipment makes it difficult to furnish our men with ammunition, and poor weapon reliability significantly degrades the fighting potential of our new army.\n\nStandardizing everyone to Soviet gear and equipping all of our soldiers with the same type of weapons is a top priority of our fledling industry. Everything that cannot be manufactured simply will have to be imported for the time being as we begin to build caches of equipment for our various regiments."

 ORE_commissar_units: "Commissar Units"
 ORE_commissar_units_desc: "We have not forgotten the collapse of the Red Army during the Great Patriotic War, when generals and officers preferred playing political games instead of saving Mother Russia. Our system of representative to the regions is slowly being turned into a permanent part of our army: the commissar units. Soldiers and officers with a great understanding of the Workers' Council's mission will be deployed across our army and serve as the foundation upon which our men shall fight. The military emergency allows the Council to transfer extraordinary powers of military justice and prosecution to our political commissars, allowing them to try for treason units accused of dereliction of duty."

 ORE_ensure_officers_loyalty: "Ensure Officers' Loyalty"
 ORE_ensure_officers_loyalty_desc: "Our commissars are hard working, but they cannot be everywhere. From the beginning our new army has been structured so that higher rungs of the officer ladder are staffed by those that are loyal to the Chairman and his Council. This efforts continues across every level of officer. For almost every man a price can be found in return loyalty: ambition; greed; desire to see their family safe; patriotism. The few officers judged impossible to leverage have simply been relieved from their duties."

 ORE_the_peoples_guards: "The People's Guards"
 ORE_the_peoples_guards_desc: "It is tragic that so many workers simply do not know the importance of service in our new army, nor the many potential benefits. Flyers, radio transmissions, pamphlets, speeches by priests and village chiefs, children's lullabies... As long as the message gets across the Chairman is satisfied. This also employs artistic types that might otherwise sit around in teahouses and drum up complaints against our glorious government.\n\n"Workers! Join the People's Guards to keep Orenburg safe! Ask your local recruitment officers to know more!""

 ORE_alone_and_strong: "Alone, and Stronger for It"
 ORE_alone_and_strong_desc: ""What is the League? The dregs of Mother Russia. Bandits, thieves and reactionaries from the Gulags. Some had hoped that such men could be reformed, but it seems that they were naive. Now these dregs have coalesced into a primitive feudal system, where a caste of brutes opress the workers.\n\nWhat does the League offer? Restoration of the old order, of cold laws ran by colder men. Is their offer not as bad as the German's offer? One group offers a few days of pain and barbarism, followed by death for our thousands of citizens. The other presents a millennia of slavery and the death of untold millions to tyranny. No, comrades, Orenburg must reject the League's proposal. With them we may live long enough to become slaves; without them we have a chance at true safety and freedom!""

 ORE_developing_the_power: "Developing the Power"
 ORE_developing_the_power_desc: "The speed of our progress has been astounding. With everyone working around the clock to reform our army and industry, few have had time recently to ponder how the workers' paradise came to be. Malenkov had been proposed as chairman, but by whom?\n\nThe memories of earlier reformers are slowly fading away. In time, no one will remember the countless members of the old Workers' Council that had worked tirelessly to bring about reform. A thousand night of sleep lost to negotiations; gallons of ink used in writing proposals and counter-proposals; countless ambitious men eaten and spat out by the perpetual stagnation of the Workers' Congress. All their sacrifices have not been in vain, absorbed as they were in the single figure of Chairman Malenkov. His ascension has brought industrial reform and social progress. Our successes can be attributed to his tireless efforts, while Orenburg's failure come from men incapable of correctly following the Chairman's audacious vision. As the stature of the Chairman grows, so does his power and influence allowing us to move ever closer to the promised bright future."

 ORE_dizzy_with_success: "Dizzy with Success"
 ORE_dizzy_with_success_desc: "Lulled to sleep by the hum of industrial furnaces, workers occasionally fall to the floor. A twisted cynic would look at the emaciated faces, eaten by famine and ravaged by fatigue and doubt the workers' paradise that Chairman Malenkov wishes to create. But a realist like our dear Chairman would simply see that the childrens of Orenburg, dizzy from success, are simply overwhelmed by the changes that the Workers' Republic have brought. On waxen wings they flew too close to the sun, and their hard work to build the promised land has simply taxed their bodies too much.\n\nChairman Malenkov understands. In his love for his children, he has already relaxed the production targets. The workers' paradise shall be built for his children, and for his children's childrens."
 
 #Burba
 ORE_balancing_the_council: "Balancing the Council"
 ORE_balancing_the_council_desc: "The first move of Chairman Burba following his election are no mystery to the Workers' Council. In his days as a regular member of the reform faction Aleksander Burba always stressed the inability of the Workers' Council to enact the reforms needed to save Orenburg. Even with a hypothetical universal approval issued by the communes, the Workers' Council is too large to allow for internal consensus on what to do with their power.\n\nThe new chairman's demands for provisions that allow him to re-organize the economy free from the Council's approvals have been met with grinding teeth. Many of those that have backed his candidacy had expected Burba to walk back from his outrageous demands and reward his coalition members accordingly, but on this point the Chairman has remained stubborn. The council's opinion on the economy will be taken into account, but the final decision power will be granted to its chief executive."

 ORE_an_orenburgian_renaissance: "An Orenburgian Renaissance"
 ORE_an_orenburgian_renaissance_desc: "Chairman Burba is a man with a plan. Befitting his background as a scientist and industrial engineer, he has slowly crafted a project for industrial reforms over the year with the help of Orenburg's traders, artisans and politicians. With the breathing space given to him by the communes and the Council, he has the chance of a lifetime to implement his proposal. Several of Orenburg's workshops have been targeted for expansion and mechanization, making use of the city's base of skilled workers to begin high quality industries. Particularly important are the sectors of the city's economy that produce the most desirable exports. By tapping into this lucrative vein, the Chairman hopes to strengthen the region's traders and generate capital to finance other projects that have yet to turn in a revenue.\n\nAll these projects require raw natural resources, and that is the are where the Chairman is most enthusiast to test his ideas. A metallurgist by formation, Chairman Burba desires to integrate new ideas in smelting plants to increase output and lower production costs for metal."

 ORE_reorganizing_the_militias: "Re-organizing the Militias"
 ORE_reorganizing_the_militias_desc: "Every citizen has the right to take up arms to defend his commune. Chairman Burba only wishes to see this right exercised in a more efficient manner. Several communes wish to strengthen their militias, yet lack the weapons to equip their men. Getting every willing soldier a weapon is the simplest problem to fix.\n\nMore difficult to tackle is the lack of structural standards across the region's militias. Some villages operate on a rotating draft basis, where every man must serve at least once a year. Others have a semi-permanent category of men dedicated to militia duty, supplied and nourished by the entire commune. Spreading an uniform militia structure will be difficult even amongst the communes that supported Chairman Burba's election enthusiastically.\n\nHelping us in this matter is a new committee of veteran militia officers from across Orenburg. Their advice will help us find the most pressing things to change, and the commune militias will hopefully find it easier to accept their new instructions from military men of the same village."

 ORE_the_urals_training_program: "The Urals' Training Program"
 ORE_the_urals_training_program_desc: "Structural reforms to the militias is one thing, but without quality training our men are likely to walk to their death in orderly fashion and not much else. Training must go beyond "shooting my rifle a few times a month at the range with the lads", as one of our militiamen put it.\n\nThere is no shame in stealing from the best, and the Ural League have become experts in turning soft village militias into proper military groups. Peasants generally have little free time to use on militia training, so the League's intense exercises aim to teach small unit tactics, fortification work and the importance of maintaining morale and the chain of command. Communal militias with a higher number of full time men such as the Orenburg Guard have been given a simplified version of the Ural League's full program to help correct any deficiency in their current training."

 ORE_standardized_armaments: "Standardized Armaments"
 ORE_standardized_armaments_desc: "The new veteran's committee has brought to our attention the potential problem caused by the lack of weapon standardization in the militias. Old Soviet guns, black market Arisaka rifle coming from the Far East, hand made pistols from the Kazakh plains, some ancestral black powder hunting guns...\n\nPlanned military exercises and deployment of militias on the frontier would require us to establish supply lines for a variety of types of ammunition and guns.\n\nOnce units lacking equipment have received their new guns, we can begin to focus on outfitting every militia with standardized weapons. This shall greatly simplify future operations."

 ORE_adapting_their_strategies: "Adapting Their Strategies"
 ORE_adapting_their_strategies_desc: "The Ural League's help in establishing our new training programs has been invaluable. This does not mean that we cannot improve on their initial suggestions, however.\n\nReports coming in from newly appointed militia officers detail a variety of issues with the Ural League's programs. Communes located deep in the Orenburg interior often lack the military expertise found in bandit exposed Ural villages, and so training is progressing more slowly in these areas. On the frontier, the battle-hardened local militias have performed better at the new training methods than their brothers in the interior. However, they have expressed a degree of concern that many of the Ural League's tactics are better suited to the hills and mountains of the Urals than to the plains of our periphery.\n\nOur Veterans' Committee has been reading feedback from these various militias and is currently adapting the League's suggestions to our situation."

 ORE_securing_the_frontier: "Securing the Frontier"
 ORE_securing_the_frontier_desc: "The increase in complexity of our militia deployments on the frontier has required improved logistics and investments in the eastern roads. All this shall be for naught, however, if bandits infiltrate the porous frontiers and roam in the interior, ambushing supply convoys and playing havoc with our communications. for the time being these roaming packs of thugs appear to be the usual lowlifes infesting the Russian Anarchy, but many of our officers fear that Dirlewanger's men will be able to send scouts behind our lines through the same pathways.\n\nThe reorganized militias in the eastern sector are being rotated in and out of the frontier for field exercises and our few groups of permanent soldiers have begun patrolling the roads and helping villagers hunt down any bandit group. Increasing our control of the frontier will also reassure local communes and allow us to tap into the area's resources."

 ORE_deregionalization: "Deregionalization"
 ORE_deregionalization_desc: "As our ties with various militias deepen previously unthinkable integration is becoming a distinct possibility. Today Chairman Burba proposes that the advisory Veterans' Committee be used to form the high command of a new "Army of Orenburg and Associated Communes". A simple unified command structure will make deployment of militias outside of their commune much simpler than the current negotiated system. The deregionalization process will take time to implement in full. To start with, the Orenburg Guard and the militias with whom we've built the deepest trust will join in. Adhesion to a modern military capable of supplying and defending all of its member commune will be very enticing, and in time will let us convince all of our communes to join."

 ORE_establish_the_planning_commission: "Establish the Planning Commission"
 ORE_establish_the_planning_commission_desc: "The lands of the Worker State of Orenburg nominally consists of a hundred of kilometers of the Russian plains, and of hundreds of towns and villages. In practice however the Workers' Council has never been able to make use of this vast expanse. Any attempt to develop the resources of a particular area was vetoed by communes that wouldn't gain anything in return. Most communes have jealously guarded any knowledge of their land's wealth and potential to prevent encroachment by neighboring commune or by Orenburg city itself.\n\nChairman Burba has announced the establishment of a planning commission for the economy, and declared that its first task shall be a great audit of every resources Orenburg possesses. Minerals, oil, arable land, abandoned industrial sites, trade routes... This detailed economic information is crucial to unlocking Orenburg's potential. By pairing up members of the planning commission with representative of the communes being audited the Chairman seeks to spread the message that granting the Workers' Council information about an area will result in investment and development of the commune's fortune."

 ORE_mitigate_the_councils_influence: "Mitigate the Council's Influence"
 ORE_mitigate_the_councils_influence_desc: "The Council is many things, but good at managing the economy is not one of them. Hence Chairman Burba's decision to grant the independent Planning Commission full control of the economy.\n\nThis has been greatly unpopular on the Council as many accuse Chairman Burba of betraying the workers' democracy by putting in place unaccountable elites.\n\nInstead of trying to crush opposition, the Chairman has begun soothing the Council's ego and winning over to the idea. The Planning Commission's power is entirely derived from the Chairman, himself chosen by the Council. The point is that the members of the Planning Commission do not wield political power. This lets them use their expertise in economical matter without any of the political worries a Councilman might face. The commissioners will also be free from the baggage and bad blood that often ends up killing great ideas in the Workers' Council."

 ORE_members_from_every_commune: "Members from Every Commune"
 ORE_members_from_every_commune_desc: "Some of Chairman Burba's more radicals technocratic advisers ask, why not scrap the idea of a government of communes entirely? But this misses the good that workers' representation brings to our government. Without eyes on the ground and honest feedback by the people directly involved in our reform projects we risk becoming cruel, complacent and worst of all, inefficient. The communal representatives bring us a wealth of differing experiences and priorities. This human capital must be nurtured and our strong democratic traditions can be used to find talented men and women to help our industrialization. By incorporating the best of the best communal representatives into the Planning Commission we can improve it and extends its legitimacy in the various areas being developed as local children return home with new projects in mind."

 ORE_a_scientific_approach: "A Scientific Approach"
 ORE_a_scientific_approach_desc: ""More factories" and "more output" are useless metrics to gauge our progress. Are the new factories performing well? How do the workers feel about their workload? What about bottlenecks in the supply chain?\n\nAs it turns out, a scientific approach to planning industrial expansion can nip many problems in the bud. We can lower employee turnover by ensuring that there are enough men recruited. Supply problems can be solved by building new factories only when a surplus of input material exists to be transformed. Predicted production can be compared to actual data, letting us track down where our plans have broken down. Through scientific planning, every step we take is taken in the right direction."

 ORE_the_soviet_land_surveys: "The Soviet Land Surveys"
 ORE_the_soviet_land_surveys_desc: "Feeding our burgeoning industry has become more difficult as we reach the limits of our current mines and oil extraction operations. Thankfully, a young member of our new government has had an idea to develop our natural resources.\n\nIn its final years the Bukharin government began conducting surveys of the land surrounding Orenburg, looking for new places for mines and refineries. By combing through Orenburg city's archives and by looking for the surviving surveyors across the region, this bright young man has amassed a great quantity of information on our underground wealth. It will take some time to parse through the pile of data and preliminary reports from his team, but his early work has already proven indispensable to our efforts."

 ORE_override_the_communes_zoning: "Override the Communes' Zoning"
 ORE_override_the_communes_zoning_desc: "The communes have been cautiously optimist so far toward Orenburg's new economy. But now that the easy to claim land is running out, we've begun evaluating land use across every commune. To be blunt, it's a mess.\n\nZhdanovka commune's best land is currently unused by the villagers since they've been unable to figure out who owns it. Determined peasants in Kulagino commune are trying to stop us from building a factory close to the village to preserve the view from their farm. One of our largest potential oil field rests under a cow pasture outside Poltavka that local animals don't even particularly like.\n\nChairman Burba is a patient man, and scores of peasants have ended up in his office to protest some land appropriation or another. But once his mind is set to something, Chairman Burba rarely wavers. The communes' terrible zoning proposals must be overridden."

 ORE_no_more_closed_factories: "No More Closed Factories"
 ORE_no_more_closed_factories_desc: "The economy's rising tide is lifting all boats as the exploding demand for material, tools and spare parts has seen old Soviet era workshops opening back up. Previously shuttered as Orenburg's post war economy had no use for such massive factories, the Soviet industrial works of Orenburg city remained dormant as small artisanal workshops sprang in their shadows. Now the aggregate demand for industrial good is once again reaching the point where these steel behemoths are needed. Old workers of the plants have begun converging to their old haunts to help train a new generation to use the machinery."

 ORE_reordering_politics: "Reordering Politics"
 ORE_reordering_politics_desc: "Orenburg's communal democracy is not condemned to forever being sluggish and disorderly. By improving the Workers' Council's organisation and by scheduling meetings and congress well in advance we can funnel the Commune's democratic energy into well planned sessions. The introduction of moderators to the debates will help squash unproductive squabbling and put an end to the endless rehashing of controversial topics and communal feuds. The Chairman hopes to change the current atmosphere of distrust amongst the representatives by making the Council and Congresses flow more productively."

 ORE_a_more_professional_council: "A More Professional Council"
 ORE_a_more_professional_council_desc: "There are currently no qualifications for councilorship beyond being elected by a commune. This popularity-based approach is certainly democratic, but it has ironically almost brought our workers' democracy to an early demise: Men with no diplomatic ability and with few worthwhile ideas for their constituents' future populate the Council at present, hindering any attempt to improve standards of life across the Commune. Meanwhile, capable men and women languish in farms and menial city jobs, their potential wasted simply because they lack the charisma to succeed in an election.\n\nChairman Burba has caught attention by reviewing every councilor's performance up until his accession - their policies, their achievements, their expenditures. Rumours from the capital whisper of him drafting "resignation letters" for those he deems useless and unworthy. It seems the Chairman has no patience for those who would see Orenburg's dismal conditions maintained forever."

 ORE_scientific_organization: "Scientific Organization"
 ORE_scientific_organization_desc: "Chairman Burba and his associates have carefully laid out their industrial plans according to scientific principles: targeting possible problems and challenges, figuring out appropriate strategies, testing implementation, using new data to test our hypothesis, course correcting as we progress...\n\nThese ideas are equally core to the transformation that the Workers' Council is undergoing. What is the political process if not a method to transform inputs into outputs as efficiently as possible? In this case, the people's will and ideas are simply refined into good changes for our society.\n\nWith the right approach, old problems can become new opportunities as we churn through ideas to expand our reform of the political sphere. Already the Workers' Council's yield of good policy idea increases!"

 ORE_expanding_relations_with_the_league: "Expanding Relations with the League"
 ORE_expanding_relations_with_the_league_desc: "In many ways the Ural League mirrors the society that Chairman Burba and his faction wish to see rise in Orenburg: an efficient and orderly society where the weak are protected by the strong and the efforts of every citizens are guided by wise leaders.\n\nIn the short term, the League is an indispensable ally in the struggle against Dirlewanger's Brigade. in the long term the treacherous geopolitics of the Russian Anarchy might make an honorable, reliable ally an invaluable treasure.\n\nAs events unfold, we now have a great need for permanent embassies and strong communication lines to replace the current informal system of advisers. Increased business ties with the civilian population of the Ural League will improve our relation with the League's population beyond its leaders."

 ORE_invite_guard_trainers: "Invite Guard Trainers"
 ORE_invite_guard_trainers_desc: "Even as our own military expertise develops, the Ural Guard remains the strongest force in the region from a training and experience point of view. We have begun sending requests for veterans from the Ural Guards to come train our militias. Increasing the quality of our troop's preparation will be crucial if we're to survive the coming struggle. Demonstrating to our friends in the Guard that true military and political reforms are happening throughout Orenburg will also reassure them about the strength and viability of our government."

 ORE_discuss_further_cooperation: "Discuss Further Cooperation"
 ORE_discuss_further_cooperation_desc: "Being sent as special attaché to the Orenburg Commune is no longer a depressing assignments for Ural League officials. Our ambassadors in the Ural League tell us that reports arriving in Ust Katav speak glowingly of our new government's reform. This increased credibility with the Ural League's commanders is slowly changing the nature of our relationship, from a weak recipient of charity to something of an equal partner. Joint military exercise on our common frontier and integration of our best militias into the Ural League's strategy will be proposed to further cooperation between our two nations."

 ORE_a_growing_jewel: "A Growing Jewel"
 ORE_a_growing_jewel_desc: "Nation building cannot be a mad sprint to the finish. It is an ongoing process that sees each generation take tools from the previous generations and improve them for the following ones. Much is now being accomplished in Orenburg, and much more is proposed for the future by the Planning Committee. Without being rigid in our thinking, we can take into account long term goals to guide our current travels. Electrification; health care; good infrastructure; quality education; a strong mechanized army; all things that other nations no better or worse than us have built. Our newest wave of industrial proposals will plant a few seed that might not bear fruits for decades, but they'll help us leave Orenburg to our children as a growing jewel."

 ORE_ready_to_fight: "Ready to Fight"
 ORE_ready_to_fight_desc: "Observers in Orenburg and beyond said it could not be done. A hundred untrained militias belonging to feuding communities, crewed by men distrustful of anyone born more than 20 kilometers away; forged into a single army read to fight and die far from their home village to protect the population of a renewed Orenburg?\n\nIt was a long and difficult task. Veterans of each militias befriended one another on our Veterans' Committee, and spread this newfound trust and respect to their home. The sons of distant villages learned how to fight together. Forgetting years of turmoil and arguments took as much time for the sons of Orenburg as it did for their elders in the Council. But now across all ages our people begin to find pride in Orenburg. They've finally come together not to hurt others, but to protect those that cannot fight yet.\n\nOur new military stands on the frontier. A few men still chuckle at their officer's unfamiliar accent, and some grumble about being unable to use their family's heirloom rifle. But all are ready to fight for their commune and for their homeland."

 ORE_propose_a_formal_alliance: "Propose a Formal Alliance"
 ORE_propose_a_formal_alliance_desc: "Things are changing across the former Soviet Union. Germany's decay and new international developments are shaking up the uncomfortable status quo amongst the Russian warlords. While Dirlewanger and Magnitogorsk stand as immediate threats, we must keep an eye out for dangers on the horizon. By uniting our two nations into a regional coalition we can face the future together. The men and women of Russia have suffered the whims of fortune for too long. Just as the disparate communes of Orenburg have overcome their distrust and isolation, perhaps one day the entirety of Russia could be reunited..."

 ORE_orenburg_redefined: "Orenburg, Redefined"
 ORE_orenburg_redefined_desc: "Stability without stagnation. Progress at a steady pace. Well trained elites that lead the people with their knowledge and expertise. A new Orenburg rises!\n\nSome feel melancholic about what we have left behind. For a time the men and women of Orenburg possessed the roaring flame of true freedom. But as Orenburg matures under Chairman Burba's reforms, its citizens now realize that unchecked fire can neither keep them comfortable nor light their way. Instead the blaze nearly turned Orenburg's future to ashes.\n\nPeasant tend to their reorganized fields using tools and modern agricultural methods. New factories buzz with activity as workers leave their barren lands to join burgeoning cities. Children that once roamed the streets and fields of Orenburg sit neatly in school to prepare their futures. Efficient social programs turns broken refugees into workers and citizens. And on the border our soldiers maintain orderly fortifications as they prepare to defend a country they once refused to believe in.\n\nYes, a new Orenburg rises. Chairman Burba has done the impossible and tamed Orenburg's anarchic inferno into countless lanterns to light our path forward. The metallurgist turned politician has forged a better future for Orenburg."

 ORE_uralian_industrial_aid: "Uralian Industrial Aid"
 ORE_uralian_industrial_aid_desc: "Our industrial program has been meticulously planned, and most of the problems encountered along the way have been successfully treated. The speed at which we can progress is now limited by factors outside of our control such as shortages of machine tools and technical expertise.\n\nA solution to this latter set of issues has come from a surprising place as the Ural League advisers have offered to send us the tools and specialized manpower we currently lack. The League's men have explained the Workers' Council that by increasing the number of factories in the area will in turn generate new industrial tools and workers that the League could tap into if needed. This solution suits us very well as the extra material can be sent along the regular convoys going to and from Orenburg."
 
 ### Events ###
 ORE.1.t: "Strike on Orenburg"
 ORE.1.d: "Each time this happens, we tell ourselves we should have known it was coming. Yet when it is over, we go back to telling ourselves it will surely not happen again. One of our scouts has come before the Workers' Council to report that Dirlewanger's raiders have been spotted advancing rapidly upon one of the communes just within our borders, clearly planning to attack. The raiders are well equipped, experienced and are likely more than a match for the communes militia. So now we face the choice we always hate making. If we hurry and appeal to other frustrated communes in the area, we should be able to muster a force capable of beating back the raiders, making clear to those savages we will not simply stand by and let them abuse our people now or ever. Yet if we do, we risk provoking Dirlewanger into a greater conflict. Is it worth risking all of the communes just to protect one?"
 ORE.1.a: "We make a stand!"
 ORE.1.b: "It is too great a risk!"
 
 ORE.2.t: "Deep in the West"
 ORE.2.d: "Seemingly out of nowhere, a large band of Dirlewanger's raiders have appeared within our territory. Whilst clashes with Dirlewanger are by no means new, the tactics employed here are unusual and erratic. Instead of one single brutal attack, his forces have spread far and wide within the area, small groups inflicting terrible strikes against the populace and then vanishing before we can muster any kind of force in response.\n\nInitially our commanders theorized that Dirlewanger must finally have died due to the apparent lack of any unified orders on the raiders part, with these groups being the splintered remains of the Brigade.\n\nBut our sources have confirmed that Dirlewanger is sadly still very much alive, leaving us reeling from the destruction and misery this chaotic yet somehow coordinated attack has caused."
 ORE.2.a: "Will this ever end?"

 ORE.3.t: "The Pincer"
 ORE.3.d: "Seemingly out of nowhere, a band of Dirlewanger's raiders have appeared within our territory. Whilst clashes with Dirlewanger are by no means new, the tactics employed here are unusual and erratic. Instead of one single brutal attack, his forces have spread far and wide within the area, small groups inflicting terrible strikes against the populace and then vanishing before we can muster any kind of force in response.\n\nInitially our commanders theorized that Dirlewanger must finally have died due to the apparent lack of any unified orders on the raiders part, with these small groups being the splintered remains of the Brigade.\n\nBut our sources have confirmed that Dirlewanger is sadly still very much alive, leaving us reeling from the destruction and misery this chaotic yet somehow coordinated attack has caused."
 ORE.3.a: "Will this ever end?"

 ORE.4.t: "The Minutes of the Fifty-Seventh Congress"
 ORE.4.d: "The incessant mumbling and lack of cohesion in the Council of the anarchic communes was a perfect microcosm of the issues that plagued the communities of Orenburg. A well-spoken representative from Orenburg itself rose to give his argument for increased political centralization, a common issue to be raised and debated. He began with his observations on the problems created by the Council not supporting at least some standardization in trade policies and on military training. The ringing insults rained down harshly from all sides, yet the gifted orator continued unabashed, passionately stating how these necessary measures could greatly improve the lives and security of the communes. The slight loss of freedom would far be overcompensated by the proposal's economic and military benefits. The subsequent vote was inconclusive, as expected.\n\nNext, a proud yet simple farmer stood to make his case for increased private ownership; his personal farm was providing only enough for him and his family. Why should they suffer in order to feed people they would never even meet? The subsequent vote was inconclusive, as expected.\n\nA meek, nervous woman rose next, her voice almost inaudible over the din of conversations. She called briefly for unity and security before falling silent. A few representatives finished their murmurs when they saw the hollow stare that she was observing them with. What followed was a story of horror and tragedy, one that drew gasps and pained, averted gazes from many of those present. A raid, this one particularly brutal with disturbing significance. A band of rugged men in black uniforms speaking the language of the accursed invaders. Her voice gave out halfway through the story but enough had been heard for her cause to be debated.\n\nThe subsequent vote was inconclusive, as expected."
 ORE.4.a: "Perhaps another vote is in order."

 ORE.5.t: "The Refugee Question"
 ORE.5.d: "The constant shifting of populations in the aftermath of the fall of Russia has been a problem for Orenburg in the past, but with the shadow of the Brigade and the Black Mountain rising in the east, more and more desperate people have been pouring across the mountains seeking refuge in the collective. While at first the extra hands for labor were welcomed, the Workers' Council is becoming gradually more concerned as Orenburg city and the surrounding villages near their capacity.\n\nA number of propositions have been made for dealing with the problem. The more isolationist amongst the Council suggest that the refugees should simply be turned away, at the muzzle of militiamen's rifles if necessary. Some compassionate voices have insisted that the commune should instead open its doors and let them in, and work to accommodate the growing population with whatever developments the disorganized 'government' can make. A third faction suggests a compromise, where those refugees who can demonstrate useful skills should be allowed to stay while others are pointed onwards to other territories.\n\nUltimately, a decision must be made, and quickly."
 ORE.5.a: "We must secure our borders."
 ORE.5.b: "We will open our doors to them."
 ORE.5.c: "We will take only the best."

 ORE.6.t: "Agricultural Policy"
 ORE.6.d: "In recent weeks, the Orenburg Workers' Council has been engaged in fearsome internal debate over Comrade Malenkov's recent controversial economic proposals. It's no secret that our economic situation is, well, less than satisfactory! However, the desired continuation of the anarchic status-quo of government policy has resulted in even minor proposals being met with significant pushback by the deeply conservative peasantry.\n\nComrade Malenkov's proposal itself is indeed quite intriguing, as it's been speculated as to how he hopes to achieve such extravagant ideas. Malenkov's proposal is one of large industrialization, seemingly regardless of the wishes of the individual communes, which has already resulted in significant pushback from a large segment of the communal delegations. Comrade Malenkov argues that, by pursuing a policy of industrialization, agricultural yields will drastically increase, thereby providing sustainable nourishment for the growing population.\n\nYet, Malenkov's proposal has further inflamed the already present tensions within our 'nation', and as debates reach a new level of aggressiveness and passion, some have begun to wonder whether Orenburg will survive..."
 ORE.6.a: "We're willing to change for the better."
 ORE.6.b: "We're fine as we are now."

 ORE.7.t: "Communal Autonomy?"
 ORE.7.d: "Orenburg's political foundation had been built upon the principles of pseudo-anarchic egalitarianism, communal farming and anti-authoritarianism. Despite the implementation of such progressive utopian concepts, our revolutionary political experiment has backfired immensely, as our "nation" is seemingly an impoverished dystopian hellscape. Furthermore, the failure of the independent farming communes to resolve the significant issues brought about by the ongoing refugee crisis have further cast doubt upon Orenburg's governmental structure, resulting in an increased loathe for the status-quo of anarchism.\n\nIn recent weeks, the Workers' Council of Orenburg have been in deliberation over proposed measures of centralization, which has undoubtedly inflamed tensions between the various political factions of the "state". Chief among the proponents of centralization is Comrade Malenkov, who has successfully captivated a significant portion of the concerned Orenburg citizenry, arguing that Anarchism must be abandoned and that a programme of forced industrialization must be enacted to ensure Orenburg's continued survival. Whilst Malenkov's opponents, led by local industrial magnate Aleksander Burba, has put forth a convincing argument in supposed favor of increased democratization of the farming communes, and the establishment of a quasi-technocratic system of "governance" dominated fellow industrialists, scientists and engineers which would ultimately result in the betterment of the "nation".\n\nRegardless of the alarming and somewhat worrisome nature of the debates, the Orenburg Workers' Council has once again proven itself to be an ineffective and incompetent "governing body". As of recent, the debate rages on within the Workers' Council, becoming bogged down in an everlasting stream of bickering and bureaucracy. However, many representatives within the Council have become tired of Malenkov and Burba's seemingly meaningless squabbling, therefore the Council authority has voted in favour of holding a vote on the matter of centralization, all in an attempt to calm the situation and reach a consensus on the issue at hand..."
 ORE.7.a: "We will find unity bound together."
 ORE.7.b: "We will maintain the status quo."
 ORE.7.c: "Perhaps we're in need for a change."

 ORE.8.t: "Trade Security"
 ORE.8.d: "Amongst the few actually interesting issues that the Council discussed this particular day, was the matter of trading with neighboring states. So far, the relative wealth of the Orenburg communes have stayed within their borders, the fear of outside threats enough to deter them from risking much trade. Ironically, this paranoia has only hampered attempts to normalize relations with Orenburg's neighbors, although they had not ever made much of an effort so far anyway. Since this has been nothing but a strain for us, the idea of perhaps opening the communes up to trade with the surrounding area has become increasingly popular, popular enough to merit substantial debate in the Council. After intense discussion, the Council members formed into two "camps" of sorts. The first were in favour of opening Orenburg up to trade with carefully selected territories and states. This also would help to establish a reputation for Orenburg, they argued. The other group, was utterly opposed to this idea and wished to continue the isolationist approach and pointed out that with bandits on every road, there would be no point in trading. After an interruption involving a dispute between a pig-farmer and a horse-breeder, which was followed by a break for a particularly late supper, the vote was finally held at a disagreeably late hour..."
 ORE.8.a: "We shall keep ourselves secret and safe."
 ORE.8.b: "There is no need for this."

 ORE.9.t: "A Debate on Infrastructure"
 ORE.9.d: "The leader of the meeting looked down at the agenda with dread. Every single proposal so far had been challenged and debated for at least an hour, even minor ones that were completely agreeable. He took a deep breath. Maybe, just maybe, this one would be quick. "Next on the agenda is a proposal to fund road building projects using recently acquired taxes."\n\nIn mere seconds, six people from different parts of the room stood up at once, and the man presiding over the meeting died inside. The first to stand up called out, "We of the communes object to this proposal!" In a voice that showed more tiredness than an elder of a thousand years, the meeting leader said "Very well, you have the floor." The villager launched into a seemingly endless rant about overreach and fascism and tyranny. These roads were a means to steal from the worker, they were Orenburg robbing the village communes to improve the city, so on and so forth for hours. If these roads were all they were made out to be, they would amount to nothing less than a fascist government being elected to Orenburg. This ended any progress that was being made for the day, and the road project was trapped in debate hell."
 ORE.9.a: "We can have our say every once in a while."
 ORE.9.b: "Can we have one thing that everyone agrees on?"

 ORE.10.t: "Burba Inaugurated as Chairman!"
 ORE.10.d: "All across our proud 'nation', the workers of Orenburg have erupted into tremendous and passionate celebration of the forthcoming revitalization of the dreary communal paradise. Today, reformist politician Aleksander Burba was officially inaugurated as the Chairman of the Workers' Council of Orenburg.\n\nA former local industrial magnate, Chairman Burba has received wide support from a variety of different factions within Orenburg. Following his arrival in the region, he first came to prominence after his successful reconstruction efforts on Orenburg itself, resulting in the city being christened as the 'Venice of West Russia'. In his inaugural address to the Council, Chairman Burba announced he will invest increasingly large sums of capital into infrastructure projects, in order to improve the disastrous medieval living conditions in the countryside. Furthermore, Chairman Burba's announced an ambitious set of reforms to ensure consistent democratic and legal principles across the various farming communes. It remains to be seen, however, if his attempt at standardization and reform will succeed...\n\nRegardless of how Chairman Burba is viewed, be it in positive or negative regard, near all of the citizenry and local authorities have concluded that under Chairman Burba, some ounce of reform will be surely achieved by his clique."
 ORE.10.a: "Let us pray Chairman Burba brings Orenburg peace and prosperity."

 ORE.11.t: "The Guests' Proposals"
 ORE.11.d: "In recent weeks, a sect of dissatisfied communal representatives have been ferociously protesting against the Workers' Council, demanding further allocation of speaking time for guest speakers from the communes. Although it was initially believed the protests of the various delegations would cease in a short period of time, the increasingly passionate displays of resistance against the Workers' Council have in recent days intensified. As a result of this, the Council 'elite' have been summoned to discuss a possible solution, in an attempt to rectify the situation."
 ORE.11.a: "We must uphold unity."
 ORE.11.b: "No, we shan't be bullied into submission!"

 ORE.12.t: "Status of the Militias"
 ORE.12.d: "A recurring controversy amongst the Orenburg City Council is the level of preparation of the region's security forces. The current patchwork of militias barely maintains the safety of individual commune. An increase in banditry across the region and heightened pressure on the eastern and southern communes by German and Kazakh bandits have led the Workers' Council to try to standardize and improve the quality of communal militias.\n\nThis activity has not gone unnoticed by the communes, with frequent grumbling about nosy Orenburg city officials observing militia training and attempting to convince militia officers to improve their men's training. Now, frustration as reached a boiling point as a formal complaint written by several village chiefs has made its way to the Workers' Council. A new set of shouting matches between representatives and the Workers' Council has resulted, as the village representatives accuse us of being reactionary pigs trying to strong-arm the militias into serving the city's whims.\n\nIn the meantime, the goal of improving the militias' preparedness has not seen any progress. Outside of the frontier, communal militias consist of a handful of village men shooting their guns once a month. "Why bother to prepare any more?" they ask. "We have no quarrel with the outside world. We defend our farms, as we've always done.""
 ORE.12.a: "We must make sure tyranny stops at the end of the barrel."
 ORE.12.b: "The wolves outside Orenburg draw ever closer..."

 ORE.13.t: "Trade Protection"
 ORE.13.d: "Another day, another set of angry representatives from the communes. The issue of the day is the proliferation of traders from the Urals. Orenburg's relative peace and prosperity has always been a magnet for traders of the outside world. Orenburg city's craftsmen, mostly free from Luftwaffe interference have been free to crank out a variety of valuable products. The stream of resources from and to the Urals has been particularly lucrative to city residents.\n\nThis entrepreneurial spirit has not spread much beyond the city's limit. The peasants of the commune are a wary lot, and they already distrust those from those outside their village, let alone those from beyond the commune's frontier. This has not stopped more daring trader convoys to seek trade outside the confines of Orenburg city. Some look for former Soviet industrial sites that might still be operating, while others try to barter with the workers of the few remaining resource extraction facilities, or look for the rare cash crop plantation.\n\nThe villagers have not been sold on the value of free trade; they complain about the increased traffic on regional roads; they accuse traders of being scouts for brigands; one village elder accuses "those bastards from the Urals" of having knocked up his daughter. The petition brought to us demands that traders be limited to the roads in and out of Orenburg city.\n\nThankfully for once, the endless bureaucracy and negotiations inherent to the Workers' Council let us simply bury the matter until the villagers tire of asking for reform."
 ORE.13.a: "Haven't they heard of comparative advantage?"
 ORE.13.b: "For the good of those within the commune."

 ORE.14.t: "Secessionism?"
 ORE.14.d: "The Workers' Council's power ultimately rests in the people, and without the people's consent the Council is nothing.\n\nDistressingly often, a representative from a commune requests secession from the Council. For some, the fear of creeping authoritarianism in Orenburg is enough to retire their adhesion to the Workers' Council. For others, the Council is merely a failed experiment, unable to make any progress on security issues or agricultural crises. As the dream of a common democratic organization agonizes in Orenburg, too many villages turn inward and give up on the outside world.\n\nAt times we can scrape up enough compromises and bribes to keep bigger villages and towns in the Orenburg Commune. Most of the time however, keeping the commune in question is not worth the effort. The task of leaving the Workers' Council is as usual made difficult by bureaucracy, debates and the circular action of the workers' democracy."
 ORE.14.a: "That's preposterous."
 ORE.14.b: "Our powers ultimately come from the people..."

 ORE.15.t: "The Education Question"
 ORE.15.d: "Communes request an end to Orenburg meddling in education. One of the scant successes of Bukharin's Soviet Union was its effort to eradicate illiteracy across Russia. The state's school system managed to reach even the depth of the countryside.\n\nAs with all good things the education system was annihilated by the accursed German invasion. Some in Orenburg city dreamed of using the Workers' Council to restore some combination of primary, secondary and even tertiary education to make use of the decaying Soviet infrastructure, but as usual the communes' unwillingness to cooperate has ground the plan to a halt.\n\nSome villages think teaching children anything beyond the use of a plow to work the field and rifles to keep bandits away is a self-evident waste of time and resources. Other communes have been convinced by local priests to let men of God teach the next generation.\n\nToday representatives from a set of communes have reached Orenburg to ask for an end to council meddling in their education. Perhaps the villagers were convinced to refuse further help after hearing a rumor that Orenburg city instructors were Trojan horses for the city's centralization attempts.\n\nThis unhappy new has launched new debates about the futility of teaching isolated villages and communes. "There is a sufficient mass of learned people in Orenburg city. Why try to help the peasants?" Others point out that a learned population is able to read reports from the city, organize their commune better, and make use of what scant industrial plants are outside of Orenburg city."
 ORE.15.a: "We're thinking beyond tomorrow."
 ORE.15.b: "At least we'll have a few more textbooks for the other kids..."

 ORE.16.t: "A Successful Congress"
 ORE.16.d: "Success! The reformist faction of the Workers' Council has succeeded to unite a strong majority of communes on several topics. The communes have agreed to help repair several crucial roads towards the Urals, in exchange for a new toll duty on traders. A few toll exemptions were handed out to important communes to keep them in our coalition. Some of the bigger regional militias have reluctantly accepted our proposal for a joint military exercise in return for new guns from Zlatoust. This brought on a new round of haggling from other villages worried about being left behind in an arms race, as the heavier weapons would be kept in Orenburg city and deployed only if the majority of the communes agreed. Finally, a joint effort to send doctors and refugees from Orenburg city to western communes depopulated by an epidemic was met with only token opposition, when the communes agreed that the refugees would be barred from voting for an Orenburg city proposal for at least ten years.\n\nOur negotiators were finally able to catch a full night's sleep today after a marathon of backroom negotiations. While the kind of consensus required for deep structural reforms still eludes our grasp, we've managed to gain approval of enough people to work on stopgap solutions for the problems that plague Orenburg. These type of success give us hope that more reforms could perhaps be started in the future. Already members of the Workers' Council reformist faction are conducting a post-mortem of the Workers' Congress to assess the loyalty and opposition of various communes to Orenburg, and the best places to apply seduction efforts in preparation of the next Workers' Congress."
 ORE.16.a: "A great day for workers!"

 ORE.160.t: "A Failed Congress"
 ORE.160.d: "Another Workers' Congress, another set of wasted opportunities. Several of the projects we thought were secure were defeated in the final rounds of negotiations. Disdain of Orenburg city's centralization effort, distrust of distant commune's goodwill, fear of encroachment of the outside world... Many of the causes of Orenburg's problems are also the causes for its failure to implement solutions. Some of the most carefully crafted policy proposal were vetoed without any explanation by representatives of villages with less than a hundred souls.\n\nOn the final day of negotiation an important proposal for doctors and refugees to help repopulate and restore a set of western communes was shot down by several commune representatives. A fist fight followed as desperate Orenburg city refugees in the room arguing that they had every right to leave the crowded refugee camp and seek land amongst the depopulated communes were shouted down by representatives accusing them of being plants of the Orenburg City Council. Order was finally restored when city guards began throwing out troublemakers of both factions.\n\nOur allies in Orenburg city and amongst the few commune that backed us are disappointed, but not surprised. A few have reassured us of their continued support. Others slunk out of the congress without a word. Many of our faction on the City Council despair of ever seeing any change. Once more, the deep structural problems of the Workers' Council have defeated any chance of unity and progress."
 ORE.160.a: "There's always the next congress..."

 ORE.17.t: "Raiders on the Frontier?"
 ORE.17.d: "Infrequent reports from the scattered militias that make up what passes for the Communal defender force are all the Committee has for an intelligence network. That being said, however, recent reports have been increasing in urgency (and shrillness) to an alarming degree; most of these reports were triggered by activity near our border with Dirlewanger's Brigade. Increased movements of hostile forces, coupled with observations of convoys moving along the local road network, lead us to conclude that Dirlewanger himself, along with his inner retinue, has been active along our own border.\n\nBesides the usual increased exercises our military staff propose, some amongst the Council's top ranks caution us to develop a long-term strategy in response. What the Bandit King wants is unknown at this time, but everyone is certain that in his old age he will only become more unstable, more unpredictable, and his Brigade grows ever more greedy for plunder and bloodshed. While Dirlewanger himself is still alive, he might be a stabilizing influence on his men, but when his will is no longer there to punish disobedience - no one dares to imagine what will happen.\n\nLet this be a warning to us, and to the League: the beast is aged, but when he is roused his jaws will be as savage as they ever were. We must prepare ourselves for the fight that surely lies ahead."
 ORE.17.a: "We need to be able to do something about this!"
 ORE.17.b: "Worrying indicators."

 ORE.18.t: "Reviving the Communal Levy?"
 ORE.18.d: "The council member stood up to the podium. He shook a little. Knowing that what he was about to say would be highly unpopular among the assembled councilors, he read from a script. He wouldn't risk forgetting a memorized script as he sweated so profusely.\n\n"Gentlemen and gentleladies. Today, I speak to you on a matter of importance on the survival of the communes. As many of you know, threats face us down from every angle. Oskar Dirlewanger's fascist bandits, Lysenko's pseudo-science, and even the Ural League's unchecked militancy all endanger our utopian state. Therefore, I propose a measure many of you see as drastic, but I see as necessary. I believe that the Workers' Council should begin levying soldiers from the various communes to Orenburg."\n\nThe councilors, in almost total unison, began to boo off the young, nervous councilman at the podium.\n\nThe councillor frowned. This was not a good introduction to politics. He shook his head sadly and walked off the podium."
 ORE.18.a: "He should know how this works by now."
 ORE.18.b: "You know, there's always another way..."

 ORE.180.t: "The Secret Army"
 ORE.180.d: "The eastern communes. Always our most reasonable allies, especially those on the fringes, who know damn well what the implications of Dirlewanger attacking are.\n\nThat doesn't stop them, however, from hamstrung by uncooperative representatives. Can a representative even be said to truly represent their people, in fact, if they are unwilling to provide for their security? If a man is willing to join a central army, after all, they have no right to stop them.\n\nAnd so, we shall begin a play in secret. Recruiting officers shall be sent to the leaders of Eastern militias friendly to our cause, in order to lead cooperative militia members and form a more formal defense force.\n\nOf course, while the Council doesn't exactly approve of this measure, they can hardly act against it if the local governments just so happen to voluntarily loan us soldiers, under the promise of some... implied help.\n\nDesperate times call for desperate measures, after all."
 ORE.180.a: "What they don't know won't hurt them."

 ORE.181.t: "Extract from Representative Pavlov's Notes"
 ORE.181.d: "Councilors of the Orenburg Communes, I have shocking news to deliver to you today. In all my years in service to the brotherhood of the workers and the indivisible union of Socialism, I have never had the displeasure of reporting on active subversive activities prepared by members of our own Council, even its highest members. [Dramatic pause for effect.] But that has changed.\n\nIn the last 72 hours, ladies and gentlemen, I have come into a wealth of information, all of it disturbing. Let me sum it up for those uninclined to read the documents I have delivered to all present in the audience; we are now certain that members of the Reformist Faction [avoid pointing fingers and gasping theatrically: Precedent declares this to be a Bad Move.] have assembled equipment, men and arms for the training and eventual development of a militia. This, of course, so blatantly contravenes the Laws that define our Commune that it beggars belief. Furthermore, it displays a lack of trust in the Council to guide the strategic direction of the Communes that borders on schism! [Note: Aim eye contact at senior Advisors at this point for maximum effect.]\n\nWhat the Council chooses to do with this information is entirely up to them, but I have no doubt that justice will be done to the Spirit of Equality that Burba and his friends have violated. Thank you. [Don't trip while walking down the stairs like last speech.]"
 ORE.181.a: "This never happened."
 a_orenburg_tt: "The speech is discovered and destroyed."
 ORE.181.b: "Everyone needs to hear!"
 b_orenburg_tt: "§RThe speech is given on the Council floor.§!"

 ORE.182.t: "From Councillor Burba's Notes:"
 ORE.182.d: "The destruction of the speech was probably the quickest part of the whole damned ordeal. I honestly can't believe the man came with notes prepared for the whole Council, but only one copy of the speech. It just goes to show the quality of some of the men gathered in our so called "Best and Brightest". If this is the future of our planning efficiency, we might be better off with Lysenko! At least when the man plans to assassinate someone, he'll probably succeed.\n\nOn to the cover-up proper; there isn't much to be said about the implanted counter-evidence. After all, the Council is a band of rats; all we really needed to do was tie Pavlov to an appetizing piece of cheese, and they fell upon him like the horde they were. Socialist unity for you, I suppose. I hear they're replacing him with the son of an ambitious farmer. Maybe some time off will do him good, especially given the nature of the accusations we pinned on him. (I don't think anyone can do things of that nature with such a diverse variety of farm animals without passing out from exhaustion, but hey, I've never been one to underestimate Orenburgian ingenuity.)\n\nI'll be honest; for a brief moment I thought we were going to fall apart, especially when we first found the leaks, but in the long run this can only do us good. We've even improved our internal security and military egress methods thanks to this. I owe Pavlov a drink. If he hasn't killed himself by then."
 ORE.182.a: "The show goes on."

 ORE.183.t: "The End of the Secret Army"
 ORE.183.d: "The Orenburg Council is an unassuming building at first glance. When the time came to produce funds to build the complex housing the legislative apparatus of the Workers, many communes turned up empty-handed; whether because of poverty or corruption no one could say. Many mock its appearance, but by far the majority of the laughter falls on its hapless representatives. (No one even noticed Pavlov scrambling into the building with a thick suitcase and a determined expression.)\n\nNo one is laughing today. The Council is out for blood.\n\nScreams, howling and the noise of fisticuffs (the latter are fairly infrequent given the... advanced age and physique of the delegates) are heard from the building for almost 36 hours straight. The Council records, or at least the terrified scribe locked in his booth by enraged councilors records, a breakdown of law and order for almost 2 days straight. Gunshots are heard. 5 are injured. 3 die because no medical aid is available, and none mourn their absence; after all, there are bigger fish to fry.\n\nWhen the dust settles on what will be referred to as the Orenburg Massacre, 2 things are clear. The delegates formerly belonging to the Burba clique are arrested on a list of charges so long that for once the Council authorizes a truncated version to be used in the courts. Many of them contain assorted obscenity. All of them will sentence the involved to many, many years in incarceration.\n\nAnd the power of the ideals they once held - that of moderate Industrialization and a dynamic leadership, of an Orenburg with a captain at the helm - is forever broken. What is not broken, however, is the army itself - and some are already suggesting it be turned to our own purposes..."
 ORE.183.a: "Lock them up and let the matter end."
 ORE.183.b: "We could use that manpower, actually."

 ORE.19.t: "Inspecting the Communal Militias"
 ORE.19.d: "The Alekseevka Communal Militia drilled in the hot sun outside a farmer's field, old rifles, Great Patriotic War-era carbines, and blackpowder shotguns in hand. As the local farmer watched in interest, he noticed the flaws almost right away. The drill sergeants, supposed to be teaching, were instead casually talking with militiamen as they clumsily cleaned and field-stripped their varied armaments. Even further afield, yet more militiamen practiced at the range, their single allowed box of bullets sitting on a flat bench between the firing stations. With dismay, the farmer noticed that no two militiamen were using the correct posture, nor doing a particularly good job of basic marksmanship.\n\nHe scrawled that down in his weathered leather journal, and looked about to take more notes on readiness and general discipline.\n\nOf course, the farmer was not a farmer at all, but rather a disguised Orenburg city staff officer, out in the badlands to inspect the outer communal militias, who were notoriously prideful and unwilling to accept the guidance of actually qualified individuals. After several scathing remarks in flowing blue ink, he shut the book in disgust.\n\nThis was just more evidence. They were almost suicidal, in a way - viewing the duty of protecting their homeland from the most horrific groups in Russia the same way a sportsman would view going hunting intoxicated with his friends. He wouldn't doubt if some of the sorry lot had showed up to this training intoxicated - it was certainly ill-regimented enough for that to be a possibility, after all.\n\nHe gazed once more at the chaos on the field, spun on his heel, and walked inside. No, this was not good. Not at all. But it was up to the Council to decide their fate. And who was anyone to predict their course of action?"
 ORE.19.a: "This is a disgrace! Order them to accept trainers!"
 ORE.19.b: "What can we possibly do?"

 ORE.20.t: "Malenkov Inaugurated as Chairman!"
 ORE.20.d: "It is not uncommon for the news from Orenburg to reach even the nearest villages with a delay, as communes usually have a little regard about the internal politics of the main city, but this time, the news about the most recent change in leadership became widespread across every village with a speed of thunder in the clear sky. Georgy Malenkov, an ambitious and hardline politician, was elected as the Chairman of the Workers' Council of Orenburg.\n\nOnce a rising star of the now-defunct All-Union Communist Party whose governmental career abruptly ended after the German invasion, Georgy Maksimillianovich quickly adapted to the politics of his birth city and rallied around himself all the city strata who were deeply dissatisfied with the neverending political mess of Orenburg and the inability of the Council to adequately respond to the most pressing issues. Appealing to the old Soviet principles of democratic centralism and political consolidation, Malenkov declared the imminent end to the dysfunctional pseudo-anarchist system that plagued Orenburg with indecisiveness and stagnation. In his inauguration speech, Comrade Malenkov gave his word to elevate Orenburg to the level of advanced countries in the shortest possible terms and embark upon a rapid industrialization program, while sparing the exact details of how his promised prosperity will be achieved.\n\nTo say that the election of Malenkov turned out to be very controversial would be a dire understatement. Many people expressed their support of the newly-elected Chairman in hopes that a communist strongman will put an end to pervasive anarchy and endless feuds, but even more people, especially the peasantry, reasonably fear that the reign of Malenkov will mark the decline of their autonomy and will make their well-being dependent on the whims of the main city. Whatever one thinks of the new Chairman, there is no doubt that Orenburg under the helmsmanship of Malenkov will face a grand transformation, for better or worse."
 ORE.20.a: "My fellow Orenburg citizens, nobody will ever dare to hurt you again!"

 ORE.21.t: "The Bandit and the Scientist"
 ORE.21.d: "It sadly seems like we were not the only ones searching for allies. Our scouts have come back to report to us that both the mysterious Lysenko and dastardly Dirlewanger have been meeting regularly. We currently do not know what these meetings have entailed, but it would be entirely reasonable to assume that if it involves them, it cannot possibly be good news for us. We should begin developing a series of plans for anything and everything those two could be planning; I don't know about you, but I'd rather die than be a test subject for Lysenko or a bag of meat for the Germans."
 ORE.21.a: "These mountains are cursed, I tell you."

 ORE.22.t: "Reassuring the Communes"
 ORE.22.d: "Another wave of hysteria seems to have swept the outlying communes, this time over the latest proposal to increase recruitment for the Orenburg militia. Many within Orenburg have become exasperated at the outright hostility coming from the peripheries; attempt to exert even the slightest hint of central coordinations for the good of the communes as a whole, and they all swear that you're the second coming of the Tsar and want to piss on Marx's grave. And it seems that this time has resulted in an even larger wave of angry letters and fuming ambassadors than usual. It's always amusing to see just how many synonyms for "fascist" they can fit in a single sentence.\n\nNevertheless, the effect that this can have on commune-wide morale cannot be understated, and this fearmongering cannot be allowed to propagate with impunity.\n\nBurba and Malenkov have taken it upon themselves to try and rein in the damage as much as possible by meeting with as many communal ambassadors as possible, pouring out endless praise for the freedom of their institutions and swearing that they would never try and unjustly infringe upon the fundamental rights of the proletariat. They had no intent to step on anybody's toes, but they perfectly understand why the proposal would seem like that, and they will do their utmost in the future to try and make sure that such counter-revolutionary thought never besmirches the people's meeting halls ever again.\n\nThankfully, it seems that their effort has paid off; the number of protests has dropped sharply in recent days, and Burba has gone a full week without being compared to Hitler. Progress if there ever was any."
 ORE.22.a: "A true testament to the power of brown-nosing."

 ORE.23.t: "Identifying Our Fundamental Problems"
 ORE.23.d: "A simple, communal lifestyle suits many of the peasants and workers who had been happy to first throw off the chains of autocratic tsarist life, then later those placed on them by the corrupt socialists. "Live by the fruits of one's own labour, worry only about the food and drink on your family's table" was their maxim to live by. Yet this newfound freedom has spawned its own set of catastrophic problems. Absolutely free citizens cannot be coerced in any way; they cannot be forced to put aside differences and sacrifice something which may not directly impact their lives.\n\nThe most glaring example of how this attitude became an issue was the communal levy fiasco, a simple tax to patch over some of the communes' worst issues such as the inability to rally an effective defence against outside raids. Both the major factions vying for their leader to assume centralized control of the political infrastructure of Orenburg have vowed to end the paralysing effects of keeping decision making power at an extreme localised level. Their supporters have begun fervent campaigns not just to promote their own cause over each other, but also to smear the autonomist argument against both them. The distaste so clearly present in the street violence and public debates between the men of Burba and Malenkov could not match the intense fear and hatred of the autonomists. Would the currently marginal, yet still profoundly influential, anti-centralization factions gain power then the communes may not survive much longer. All it would take is one of their aggressive neighbours to divide and conquer the various cities and settlements that without top down control would not be able to effectively defend their own lands. There are nefarious and powerful forces outside of this small paradise carved out in the Southern Urals.\n\nThey would not even think twice as their boots squash the anarchist legacy of Orenburg."
 ORE.23.a: "Just let us organize, damnit!"

 ORE.24.t: "Burba's Plan"
 ORE.24.d: "With the quite frankly disgraceful revelations brought up in a recent meeting of the Workers' Council regarding the dire situation with the outlying settlements, a new meeting was scheduled to try to at least consider some strategies in how to deal with this rather unpleasant issue. Some began to speak about socialist centralization, saying that as long as management was in place for the workers and farmers to be assigned correctly to their duty. Then in this case, freedom would not have to be comprised. The men and women of the communes could still live using the fruits of their labour. Sniggering, eye-rolling and general disagreement was palpable in the room. No vote was even seemingly necessary. Next stood Burba, the man who had transformed Orenburg into a hub of commerce and industrialization. His plans for helping to democratically organize the communes into administrative groups seems far more plausible. The Council however will have to decide."
 ORE.24.a: "We need a solution."

 ORE.25.t: "The Agenda of the Fifty-Eighth Congress"
 ORE.25.d: "Talk by talk, deal by deal, compromise by bitter compromise, the 58th Workers' Council Congress is at last coming together. It is difficult to get two Orenburgians to agree on the price of bread, as a saying in the city goes, so none on the Council are surprised that bickering at the highest levels of government has stalled discussion on important areas in need of reform. Factionalism and fundamental disagreements within the Council still threaten to neuter the latest in a long line of failed Congresses, fomenting doubt on its ability to address high priority issues such as economic development and defense. Regardless, plans are being drawn up by councilors hunched over their desks at night, praying that theirs, unlike the others, will become enacted legislation - and that the Commune might hence still be salvageable.\n\nWhat is surprising, however, is the unanimous conviction that a Chairman must be appointed as soon as possible. The Congress acknowledges that the Council's inability to act in concord is perhaps the greatest of its problems, although this means selecting a Chairman among the Council's ranks - no small task to overcome, given Orenburg's gridlocked politics - will be at the forefront of its agendas. Should the Council decisively settle on one, however, Orenburg and the Communes might soon have strong, effective leadership for the first time since the tyrannical Union fell... and it might just save them from their greatest enemy: themselves.\n\nDelegates bicker and brawl, convoys load themselves full, reporters conduct opposition research from rumors and hearsay, and councilors take one last night of full sleep. There will not be many more rested nights in the future. The Congress draws near."
 ORE.25.a: "To the success of the Council!"

 ORE.26.t: "The Congress Begins"
 ORE.26.d: "With polite applause, proceedings open for the Congress. Delegates flip open notebooks, gathering in clusters and pairs, separated into there factions. Speeches begin, long and onerous, and the seasoned delegates begin to slip away to secluded areas to gossip. And plot.\n\nThis year's top issues are those which will define the Commune's viability as a political entity; for the country is unlikely to develop unless it succeeds in centralization and governance, and these issues have been agreed on as the main topics of debate and eventual voting. Much talk is expended on picking candidates "worthy of the mantle of socialism" and "of ideological purity", but everyone knows who the real candidates are: Burba, the reformer and industrialist who plans to save the Communes the same way he saved Orenburg from collapse. Malenkov, the hardliner who believes deviation was the ruin of the old Union and wants an iron grip to ensure the preservation of this one. And some councilors believe that they, and only they, can manage the Communes, not some upstart Chairman with all the blood in his head and no ground beneath his feet.\n\nCentralization is similarly divisive, as Orenburg's superiority has long been an uncomfortable guest at the wedding table, and centralization will sharpen the grievances long held by the rural communes against the cityfolk. No one can agree on how far the centralization plan ought to go, and it appears that Burba and Malenkov both disagree on this issue as well. And this means that debate stalls and grinds as definitions change with each passing speech, and alliances or feuds shift with every speaker. As the Council simmers in debate, one thing is clear; the road to decisive leadership is longer than expected."
 ORE.26.a: "Oh dear."

 ORE.27.t: "The Chairman's Controversy"
 ORE.27.d: ""Like every good socialist of the Orenburg Commune, I have despised hierarchy in all its forms; the latter is dangerous not because of its power, but because of the invisible fears it creates. I hereby warn the Council and all gathered here today in particular that the election of a Chairman, our greatest exercise in liberty as a Councillor, might also prove to be our last."\n\n"We know, friends, that the abusive and terrible Union was a false prophet, preaching Marx while tossing his word aside whenever it was convenient for the regime. We founded the Communes in the hopes that we could erase that history, and start again without the wounds inflicted by those who claimed to be socialists in name, but are predators by nature. But the imperatives which power a Chairman, the need for agreement and order, will lead us onto the dark and bitter road of totalitarianism - all with the best of intentions."\n\n"So I beseech this Council, look outside at the freedom we have before we vote! Is the poverty of the soul really worth the material advancement? Can you trade liberty for gold, friends? And would you want to even if you could?""
 ORE.27.a: "Impassioned, but unrealistic."

 ORE.28.t: "Compromising on Powers"
 ORE.28.d: ""We have reached a point in debate, ladies and gentlemen, where it is clear where the Council's loyalties lie in the debate of the Council's future Chairman. A few dedicate themselves to the extreme of individual freedom, where no hierarchy or despotism can be allowed to threaten the autonomy that the Communes prize so dearly. A few others dedicate themselves to the extremes of communal security, where many give themselves over to the service and protection of all. The rest of us away in the reeds, liking both but embracing neither, as a farmer looks between two prize pigs. (Laughter)"\n\n"I therefore propose that we craft a proposal that navigates these two extremes, working not for ideology or out of cynical self-aggrandizing, but out of a love of the common good and a desire to protect the home we love. The Chairman will be equipped with necessary powers to break stalemates on domestic issues, and emergency powers to ensure the common good is guided by a steady and wrathful hand. The Council will ensure that the Chairman does not step out of line, while also allowing itself to be led when the circumstances demand it."\n\n"This is what the way forward looks like, friends. This is the solution that works. Wisdom to the Council, power to the Chairman... and most importantly of all, freedom to the Urals!""
 ORE.28.a: "Perfectly balanced, as all things should be..."

 ORE.29.t: "Рада голосує"
 ORE.29.d: "Поки Рада продовжує боротьбу в ході засідання, нарешті постає питання дня. Кліки збираються навколо кандидатів і борються за владу на дебатах. Наближається час, коли Рада має вирішити свою долю. Бурба, реформатор і промисловець, або Маленков, соціаліст-прихильник жорсткої лінії, часом піддаються глузуванням, але вони є двома найсильнішими незалежними кандидатами на даний момент, і їхні напрямки призведуть комуни до єдності та сили. Багато хто також зазначає, що Маленков має звичку відмежовуватися від колишніх союзників і є запеклим догматиком-прихильником жорсткої лінії. Інші вказують на протилежне, що Бурба є надто гнучким і готовий укладати угоди з будь-ким, навіть з колишніми ворогами. Але якщо є щось, що оренбуржці люблять більше за суперечки, то це відстоювання своєї думки, і Маленков відстоює свою думку настільки наполегливо, що її доводиться віддирати від його сідниць. Принаймні, так звучить жарт. Звичайно, багато хто вважає, що нинішній статус-кво нікому не зашкодив і що Орєнбурґ заслуговує на мир і стабільність, а не на велику невідомість, яку несе будь-який потенційний голова. Комуни, звичайно, вже є роздробленим безладом, але вони працюють так, як і передбачалося, і кожен, хто говорить інакше, є ворогом революції! Для таких людей була сформована фракція, яка вимагає повної автономії Ради, і їхні розмови виявилися напрочуд привабливими. \n\nБюлетені відкрито, і голосування розпочалося. Орєнбурґ і комуни чекають, затамувавши подих, поки майбутнє наближається до них."
 ORE.29.a: "Тепер нам залишається тільки чекати"

 ORE.30.t: "Контрпропозиція"
 ORE.30.d: "На цей момент необхідність голови вже узгоджена, але питання про те, хто буде головою, виявилося неможливим вирішити остаточно. Кожен кандидат мав своїх прихильників і не бажав поступатися своїм суперникам. Рішення було знайдено в пропозиції запровадити ротацію голови, щоб усі кандидати мали шанс діяти. Хоча ніхто не повністю задоволений цим компромісом, він, здається, закріпився, і посада голови більше не буде стабільним місцем"
 ORE.30.a: "Хороший компроміс..."

 ORE.31.t: "Забезпечення безпеки зовнішніх комун"
 ORE.31.d: "Радник стоїть на трибуні, не тримаючи в руках жодної сторінки. Ситуація не вимагає завчених слів. Він вдихнув, розуміючи, що це може коштувати йому місця. Але це буде того варте. Сподіваємось. \n\n«Люди цієї ради. Я звертаюсь до вас із ситуацією. Здається, зовнішні комуни Орєнбурґа оголосили про відокремлення. З огляду на це, я сподіваюсь, що ви об'єднаєтесь і погодитесь зі мною, що ми мусимо діяти! Я пропоную відправити солдатів у райони, які оголосили про відокремлення. Ми допоможемо їм заспокоїтися, допоможемо їм усвідомити, що разом ми всі сильніші. Що, незважаючи на їхній гнів на Раду, вони не повинні просто вирішити втекти і ризикувати бути знищеними тиранами з Бригади, викраденими тим чоловіком з Гори, або, можливо, навіть захопленими мілітаристами з Уральської Ліги». n\n«Будь ласка, благаю вас. Це прекрасне суспільство, ця жива, дихаюча річ, яку ми створили, ми не можемо дозволити їй загинути! Ми повинні відправити цих солдатів, цих солдатів, які вірні нашим принципам. Я запевняю вас, всіх вас, членів цієї Ради, ми переможемо!"
 ORE.31.a: "Можливо, нам слід..."
 
 ORE.32.t: "Майбутнє Орєнбурґа"
 ORE.32.d: "У міру того як Маленков зміцнює свою владу в Оренбурзі, він вживає необхідних заходів, щоб пом'якшити критику. Сьогодні перед будівлею Оренбурзької ради Маленков оголосив свої плани щодо «Нового Орєнбурґа». \n\nУ своїй промові він звернувся до натовпу:\n\n«Сьогодні новий день, ми відмовилися від того, у що вірили вчора, і почали робити кроки назустріч завтрашньому дню».\n\nМаленков продовжив, заявивши, що, хоча Орєнбурґ перебуває в скрутному становищі, завдяки його геніальним планам не буде причин для занепокоєння. У своїй промові Маленков торкнувся багатьох питань, повторивши свої відомі плани щодо централізації промисловості, збройних сил і самого Орєнбурґа.\n\nЦя промова була явно добре сприйнята, оскільки натовп навколо гучно вимагав ще від свого улюбленого лідера, коли той пішов до Ради на ще один день важкої роботи"
 ORE.32.a: "Він говорив з упевненістю, тож чого ж турбуватися?"
 
 ORE.33.t: "Створення комісаріату важкої промисловості"
 ORE.33.d: "Зі збільшенням попиту має збільшуватися і пропозиція. Це основа всіх економічних теорій. Наші комуни розробили плани будівництва нових, більших виробничих підприємств, які вироблятимуть все, від бляшанок і посуду до велосипедів і лопат. Ці славні нові підприємства принесуть процвітання і новий ріст нашим комунам, не кажучи вже про поліпшення постачання для наших збройних сил завдяки виробництву нової зброї на місці, з надійними новими боєприпасами і запасними частинами"
 ORE.33.a: "Повертайся, колесо прогресу"

 ORE.34.t: "Трактори для фермерів"
 ORE.34.d: "Заводи неодноразово доводили свою цінність, і те саме можна сказати про заводських робітників. Так само, як їхні батьки, матері, бабусі та дідусі, вони є опорою нашого суспільства. Як наслідок, їм слід надавати перевагу перед селянами, чия праця, хоч і важлива, але не настільки значуща для нашого майбутнього. Таким чином, селяни та фермери будуть масово переходити на фабрики в пошуках кращого життя з новими зручностями. З припливом нових робітників фабрики самі по собі будуть зростати в продуктивності, розмірах та ефективності"
 ORE.34.a: "Шестерня не обертається сама по собі"

 ORE.35.t: "Республіка робітників"
 ORE.35.d: "Фабрики неодноразово доводили свою цінність, і те саме можна сказати про фабричних робітників. Так само, як їхні батьки, матері, бабусі та дідусі, вони є опорою нашого суспільства. Як наслідок, їм слід надавати перевагу перед селянами, чия праця, хоч і важлива, але не настільки значуща для нашого майбутнього. Таким чином, селяни та фермери будуть масово переходити на фабрики в пошуках кращого життя з новими зручностями. З припливом нових робітників фабрики самі по собі будуть зростати в продуктивності, розмірах та ефективності"
 ORE.35.a: "Шестерня не обертається сама по собі"

 ORE.36.t: "Розгортання комісарських підрозділів"
 ORE.36.d: "Нова комісарська система викликала цікаві реакції у солдатів. Можливо, це просто страх або недовіра, але те, що хтось стежить за тим, що виходить з твоїх вуст, ймовірно, є неприємним для солдатів, які раніше могли говорити все, що думають. Такі недисципліновані звички не можуть тривати, і саме тому існують комісари. Лояльність до комун є надзвичайно важливою, а незгода, серед іншого, лише шкодить життю нашого народу. Незгода призводить до розбрату, а розбрат — до смерті. Ми пережили це двадцять з гаком років тому. У будь-якому разі, вони просто мусять звикнути до цього або ж зазнати покарання"
 ORE.36.a: "Як скажете"

 ORE.37.t: "Лояльний офіцерський корпус"
 ORE.37.d: "Армія, як і все в Оренбурзі, процвітала і зростала під керівництвом Маленкова. Однак це двосічний меч, оскільки ті самі люди, які зараз борються за захист народу, одного дня можуть обернутися проти нього. Хіба старий Радянський Союз не був знищений зрадницькими генералами, які зрадили його в момент слабкості? Навіть самі озброєні чоловіки не всі підкорилися новій владі. Чи були довіра, лояльність і братерство його генералів справжніми, чи це були кинджали в їхніх руках? Ми ніколи не можемо бути впевнені"
 ORE.37.a: "Мертвий чи живий, мертвий чи живий"

 ORE.38.t: "Охоронці народу"
 ORE.38.d: "Народ волав про когось, про будь-кого, хто врятує їх від тиранів і фашистів. У найчорніші дні, коли бомби вбивали їх, а бандити ґвалтували, народ волав. \n\nІ Герої народу відповіли на їхній заклик! Перед обличчям великої небезпеки ці хоробрі чоловіки та жінки кинулися на захист своїх співгромадян і безжально зупинили удари ворога. Змігши протистояти холоду, свинцю і сталі, саме завдяки цим героям ви зараз живете вільно і щасливо!"
 ORE.38.a: "Ти! Ти записався до добровольців?"

 ORE.39.t: "Зростаюча сила"
 ORE.39.d: "Малинков подивився на Орєнбурґ, який так довго був розбитий і примітивний. Він згадав, яким він його знайшов: слабким, бідним, боягузливим і розділеним, економічний потенціал великого міста був розтрачений німецькими бомбами і інституційною анархією в рівній мірі. На робітничий клас були накладені нові квоти і стандарти, і Маленков був упевнений, що поза межами чутності комісарів чимало хто скаржився на довгу і небезпечну роботу, яку їм доручали. Але вони будували Орєнбурґ завтрашнього дня з блискавичною швидкістю, і в цьому ніхто не міг дозволити собі вийти з виробничої лінії."
 ORE.39.a: "Ми всі повинні пожертвувати сьогоднішнім днем заради завтрашнього"

 ORE.40.t: "Судові вказівки для комун"
 ORE.40.d: "Судова система Орєнбурґа протягом багатьох років практично не існувала. Якщо обвинуваченого навіть приводять до будівлі, щоб він постав перед судом, він може вважати себе щасливцем. Там навіть найменші чутки можуть і будуть використані проти нього, так само як і сільські плітки та минулі правопорушення, що не мають відношення до справи. Без будь-якого захисту чи процедури суд може швидко перетворитися на конкурс популярності, оскільки і обвинувачений, і обвинувач обмінюються образами. Це не може тривати, і в комунах має бути відновлено справжнє, впорядковане правосуддя, щоб справжня свобода знову могла дихати"
 ORE.40.a: "Люди заслуговують не менше"
 ORE.40.b: "Ми змінимо лише дещо"
 ORE.40.c: "Не потрібно витрачати час на такі дрібниці"

 ORE.41.t: "Справедливий народний трибунал"
 ORE.41.d: "Створений для того, щоб вершити революційне, народне правосуддя над злочинцями та деспотами, анархічний судовий система сама стала найбільшим деспотом в Оренбурзі, тероризуючи народ своєю неточністю та непостійністю. У світлі цієї жалюгідної ситуації Маленков видав нові накази про реорганізацію Народних трибуналів. Держава призначить фахівців, які забезпечать дисципліну і порядок у трибуналах, щоб правосуддя стало стандартизованим і гідним. Перш ніж трибунал ухвалить будь-яке рішення, він повинен відтепер консультуватися з тими, кого призначено стежити за ним"
 ORE.41.a: "Правосуддя більше не буде ухилятися"
 ORE.41.b: "Нам уже бракує людей, шкода"

 ORE.42.t: "Несправедливий тягар Орєнбурґа"
 ORE.42.d: "Комуна Орєнбурґа наразі несе відповідальність за абсурдно велику суму внесків до комун, і її представники нарешті змогли привернути до цього увагу. Дехто скаже, що це ціна того, що вона є головною комуною регіону, до якої стікаються політичні та культурні таланти. Однак бути першою серед рівних не допомагає вирішити основну проблему: жителі Орєнбурґа раз у раз бачать, як їхні важко зароблені статки надходять до загального фонду, і рідко коли отримують за це будь-яку вигоду. Цілком природно, що люди не люблять податки навіть у найкращі часи, і ніхто не помічає нерівномірність вигод від фонду."
 ORE.42.a: "Це рано чи пізно мало статися"
 ORE.42.b: "Ми будемо посміхатися і терпіти"

 ORE.43.t: "Спільний інвестиційний фонд"
 ORE.43.d: "Найбільш базовим і очевидним доказом співпраці між комунами є створення спільного фонду, до якого всі будуть вносити внески і який буде використовуватися для розвитку та підтримки комун в цілому. Всі беруть участь, і всі отримують вигоду, оскільки навколо Орєнбурґа будується спільнота. Замість того, щоб бути параноїдальними і самотніми селами, які бояться за своє виживання, ми збираємо врожай як єдине ціле..."
 ORE.43.a: "Всі за одного і один за всіх!"
 ORE.43.b: "Можливо, трохи"
 ORE.43.c: "Зараз у нас посуха, ми не можемо більше нічого відправляти"

 ORE.44.t: "Рівне представництво комун"
 ORE.44.d: "Хоча комуни в принципі погодилися з ідеєю співпраці, глибоко вкорінений страх перед деспотизмом залишається сильним. Кожна комуна та всі її мешканці готові захищати свою автономію, якщо відчують, що їхній голос не чують у державі. З огляду на це, ми почали розробляти прийнятне рішення щодо представництва комун, яке гарантуватиме, що навіть найбільші та найпотужніші муситимуть прислухатися до малих і слабких, а також забезпечить, що вперта опозиція не зруйнує нас усіх. Кожна комуна має право на рівне представництво в Оренбурзі і зобов'язана відповідально користуватися наданою їй владою"
 ORE.44.a: "Ми будемо чути кожен голос, хай навіть найменший"
 ORE.44.b: "Ми будемо чути тільки найгучніші скарги"
 ORE.44.c: "Ми будемо робити те, що вважаємо за потрібне"

 ORE.45.t: "Пропозиція щодо послідовного планування"
 ORE.45.d: "Під час останнього Конгресу було кілька випадків, коли представники запізнювалися, а деякі потребували заміни в останній момент. Очевидно, що причиною цих проблем була відсутність довгострокового планування цих заходів. Ми змінимо спосіб підготовки цих заходів, приділяючи особливу увагу датам. Ми повинні встановити конкретні дати для них заздалегідь, щоб представники могли переконатися, що їхнє особисте та громадське життя та графіки не заважають їхньому приїзду на Конгрес. Ми створимо невелику команду, завданням якої буде знайти дату, яка буде постійно використовуватися для Конгресу. Таким чином ми зможемо запобігти подальшим незручним ситуаціям"
 ORE.45.a: "Пунктуальність і співпраця — запорука прогресу"
 ORE.45.b: "Можливо, пізніше"

 ORE.46.t: "Кодифіковані повноваження Ради"
 ORE.46.d: "Влада: хто її має і як вона використовується. Обходити питання навколо не принесе нікому користі, і без сумніву Рада повинна мати певну владу в своїх руках, щоб не перетворитися на черговий дискусійний клуб. Але питання про те, якими саме мають бути ці повноваження, не є простим. Об'єднана армія під цивільним командуванням? Право будувати дороги та планувати оборону? Право скасовувати рішення місцевих рад або друкувати власну газету? Це центральне питання, і саме тут комуни нарешті мусять зіткнутися з тим, чого так довго сподівалися уникнути, — зіткненням прагматизму та ідеалізму. Адже свободу легко втратити, а повернути її дуже важко."
 ORE.46.a: "Невелике розширення нікому не зашкодить"
 ORE.46.b: "Ми добре справляємося з тим, що є зараз"
 ORE.46.c: "Ми відмовимося від частини своїх повноважень"

 ORE.47.t: "Конституція для робітників"
 ORE.47.d: "Хоча Орєнбурґ зберігає свій статус нечітко визначеного соціалістичного протодержави, Маленков намагається будь-що просунути значущі реформи, які дійсно вплинуть на стан країни. Після обговорення можливих популярних ідей, які Рада, ймовірно, підтримає. Одним із піднятих питань буде можливість створення конституції. Хоча конституція мало що змінить у країні, вона символічно об'єднає численні комуни та села в рамках одного документа та одного набору ідеалів. Крім того, конституція гарантуватиме права та захист робітників як в Оренбурзі, так і в поселеннях за його межами. Вперше народ Орєнбурґа об'єднається під одним документом та однією долею"
 ORE.47.a: "Затверджено!"
 ORE.47.b: "Ми адаптуємо деякі аспекти"
 ORE.47.c: "Відхилено"

 ORE.48.t: "Розвиток сільських регіонів"
 ORE.48.d: "Селянські комуни Орєнбурґа перебувають у відчайдушному стані. Щодня тисячі бідних фермерів прокидаються рано вранці, щоб працювати, і тільки пізно вночі можуть відпочити. Потім вони мусять транспортувати мізерні запаси їжі, які вони зібрали, на десятки кілометрів до найближчого осередку цивілізації, де її можна переробити та продати. Що гірше, здається, що ця злиденна ситуація не зміниться найближчим часом; з огляду на відносну політичну безвихідь у місті та відсутність будь-яких змін у самих поселеннях, селяни продовжуватимуть марнувати години свого життя на важкій праці та стражданнях. Дух середньовіччя, який охоплює ці стародавні землі, ніколи не зникне. За це ми прокляті. Тому, щоб вижити в ці часи, ніхто не повинен сидіти склавши руки. Ніхто не буде байдикувати, поки наші чоловіки і жінки вмирають на полях. Ми всі зробимо все від нас залежне для виживання комун. Тільки тоді ми зможемо скинути ланцюги і прокляття, що сковують нас. Тільки тоді робітники зможуть тріумфувати!"
 ORE.48.a: "Більше ніяких ланцюгів!"
 ORE.48.b: "Потрібна певна обробка"
 ORE.48.c: "Наразі це занадто радикально"

 ORE.49.t: "Встановлення справжньої справедливості"
 ORE.49.d: "Старі звичаї вражають Орєнбурґ з жорстокістю, якої не бачиш більше ніде.\n\nЦі старі традиції проявляються у багатьох аспектах. Вони проявляються у селянстві, яке досі приречене на тисячолітню долю; у вільнодумцях, спалених на вогнищі за те, що наважилися висловити свою думку; у упередженому ставленні до будь-яких чужинців; та в олігархії багатих і могутніх.\n\nАле найкричущішою плямою жорстокого середньовіччя Орєнбурґа є лінчування. Принаймні раз на тиждень хтось гине від рук натовпу. Причини бувають різні: можливо, біженця звинуватили в нападі на місцеву жінку або хтось зізнався у своїй ненависті до соціалізму. Однак смерть завжди однакова. Їх катують, а потім вішають за гріх, який вони нібито скоїли. Деякі села навіть особливо відомі своєю ментальністю натовпу, яку вони заохочують. Адже якщо можна контролювати натовп, як худобу, то можна контролювати все суспільство. Орєнбурґ — це не князівство князів і королів. Це земля свободи та індивідуалізму. Самосуд ніколи не був справедливістю; це було вбивство найогиднішого виду. Це було не просто вбивство людини, а вбивство цілого набору ідеалів. Уряд не дозволить, щоб лінчування тривало далі. Занадто багато невинних людей загинуло від рук зашморгу, тоді як справжні злочинці залишаються на свободі без удару молотка. Правило справедливості має знову запанувати на цій землі."
 ORE.49.a: "Що таке справедливість перед обличчям натовпу?"
 ORE.49.b: "Це навіть не така вже й велика проблема"
 ORE.49.c: "Якщо ми трохи послабимо правила, нам не доведеться турбуватися"

 ORE.50.t: "П'ятдесят дев'ятий конгрес — мета і завдання"
 ORE.50.d: "Настав час вирішити майбутнє Орєнбурґа. Навіть якщо Рада залишається при владі, прогрес повинен продовжуватися, як і час. Наближається 59-й Конгрес робітничих комун Орєнбурґа.\n\nНагальним питанням є проблема централізації. Більшість членів Ради, хоча й рішуче виступають проти цієї ідеї, усвідомлюють необхідність централізації. Жоден з них не може сидіти склавши руки, коли уряд Орєнбурґа руйнується на своїх неефективних і гнилих основах. Соціальні та судові реформи також будуть у центрі уваги Конгресу; деякі поселення вважають за доцільне скасувати громадянські свободи, які підтримує решта Ради. Цим селам більше не буде дозволено зневажати наші спільні цінності. Крім того, необхідно покласти край нещодавнім хвилям лінчувань, які охопили комуни. Будуть залучені неупереджені судді, щоб запровадити верховенство права над ментальністю натовпу"
 ORE.50.a: "Ми стабілізуємо нашу нинішню систему"
 ORE.50.b: "Все буде як і раніше"
 ORE.50.c: "Ми захищатимемо свободу особистості"

 ORE.51.t: "П'ятдесят дев'ятий конгрес — добровільне об'єднання"
 ORE.51.d: "Оренбурзькі комуни не можуть і не будуть утримуватися в союзі за допомогою страху. Наша сила — у великій свободі та впевненості в собі комун. Ми не є мілітаристами чи фашистами, які отруюють наш світ. Натомість ми наважилися бути іншими, утворивши союз не силою, а за спільною згодою та співпрацею. Ми не боїмося один одного більше, ніж можна боятися власного брата, адже ми як одна родина. Кожен може вирішити піти, щоб самотужки протистояти світу, але натомість кожен без примусу вирішив об'єднатися заради більшого добра та свободи для всіх. Давайте продовжуватимемо з любов'ю співпрацювати, цінуючи один одного як рівних, а завдяки цьому — ще більше."
 ORE.51.a: "Поверніться до теми, будь ласка"
 ORE.51.b: "Я чув гірші промови, мабуть"

 ORE.52.t: "П'ятдесят дев'ятий з'їзд — промова Маленкова"
 ORE.52.d: "Радники комун. Я звертаюся до вас з питання, яке мені дуже дороге. Це питання виживання нашої колективної ідентичності. Орєнбурґ — це нація знедолених і пригноблених. Нація тих, хто пережив незліченні жахи. Російську зиму. Спеку літнього сонця. Фашистське вторгнення. Але, незважаючи на все це, ми вистояли. Проте ми все ще стоїмо на межі краху. Не через зовнішні загрози, а через нас самих. Егоїзм і жадібність призвели до того, що кожна комуна накопичує ресурси, які слід розділити між нами для загального блага. Це результат децентралізації, яка нас мучить. Децентралізація не веде до індивідуального блага чи комуністичного успіху. Вона веде лише до розчарування і страждань. n\nТільки через централізацію держави під єдиним, сильним, соціалістичним урядом ми можемо принести мир, свободу і стабільність комунам. Централізація не бреше, як це робить егоїстична децентралізація. Вона породжує працьовитих людей. Вона винагороджує слуг народної держави. Це найвірніший шлях до свободи і найвірніший шлях, яким може піти Орєнбурґ. Тому я благаю вас, колеги-депутати, приєднатися до мене на цьому шляху вперед. Шлях до централізації"
 ORE.52.a: "Ми могли б отримати від цього користь"
 ORE.52.b: "Дякую за пропозицію"

 ORE.53.t: "П'ятдесят дев'ятий конгрес — моменти"
 ORE.53.d: "Конгрес засідав протягом декількох днів, і за цей час було обговорено багато важливих питань. На обговорення було винесено все: від внутрішніх і зовнішніх загроз, що стоять перед комунами, до впливу гвардії на Орєнбурґ, до особистості самого Маленкова. Практично кожен аспект оренбурзького суспільства був порушений, якщо не підданий критиці, і результат не забарився. Зараз залишається тільки чекати голосування за запропоновані Маленковим заходи з централізації. Яким би не був результат, ніхто не може не бути враженим тим, що незабаром Орєнбурґ опиниться на роздоріжжі, з якого не буде повернення, і тяжкість такого моменту важко тисне на присутніх у залі."
 ORE.53.a: "Ніч, яку варто запам'ятати"

 ORE.54.t: "П'ятдесят дев'ятий конгрес — вердикт"
 ORE.54.d: "Сьогодні — знаменний день у короткій історії Орєнбурґа. Сильно децентралізована економічна система наших комун була наріжним каменем нашого суспільства з моменту його заснування і залишається джерелом великої гордості. Однак певні події, що не залежать від нас, можуть змусити нас піти на компроміс щодо цієї дорогоцінної цінності. Зі зростанням зовнішніх загроз не можна більше ігнорувати очевидні переваги централізованої економіки в плані продуктивності. Як проголосують комуни?"
 ORE.54.a: "Скоро ми це дізнаємося"

 ORE.55.t: "П'ятдесят дев'ятий конгрес — тріумф!"
 ORE.55.d: "Голоси підраховано, і комуни погодилися централізувати нашу економіку. Зміни у виробництві почнуться негайно"
 ORE.55.a: "Зазначено"

 ORE.56.t: "П'ятдесят дев'ятий конгрес — комуни чинять опір!"
 ORE.56.d: "Голоси підраховано, і комуни відхилили будь-які спроби централізації економіки. Методи виробництва та планування залишаться незмінними"
 ORE.56.a: "Шкода"

 ORE.57.t: "Орєнбурґ просить тренерів"
 ORE.57.d: "Схоже, наші сусіди визнали нашу значну військову перевагу і тепер просять нашої допомоги у створенні своїх збройних сил як потужних і грізних оборонних структур. n\nРано вранці Міністерство закордонних справ отримало телеграму від нашого південно-західного сусіда Орєнбурґа, тема якої, судячи з усього, була проханням про «допомогу». Схоже, уряд Орєнбурґа попросив «інструкторів» з наших Збройних сил в обмін на велику суму грошей. Мабуть, селяни цього регіону забули, як користуватися зброєю! Трохи навчання допоможе в цьому, і наші військові запевняють нас, що впораються з цим завданням. Однак чи справді в наших інтересах допомагати Орєнбурґу? Допомагаючи в розвитку їхніх збройних сил, ми потенційно можемо зміцнити їхню «націю», що в кінцевому підсумку може обернутися проти нас і послабити нас. Зрештою, комуни ніколи не вважали нас союзниками, хоч би як вони посміхалися нам, користуючись нашими послугами. Однак вони пропонують нам значну суму грошей в обмін на наші послуги, а гроші говорять там, де слова мовчать. Уряд стоїть перед вибором. Надавати допомогу чи ні? Комуни з затамованим подихом чекають на відповідь."
 ORE.57.a: "Так, відправте інструкторів"
 ORE.57.b: "Ні, ми не повинні нікого відправляти"

 ORE.58.t: "Ліга схвалює наш запит"
 ORE.58.d: "За щасливим збігом обставин, Уральська Ліга з радістю погодилася прийняти наш запит про надання військової допомоги нашим ополченським силам. Вибрана група бойових тренерів, які загартувалися в постійних боях на заході та півдні Росії або навіть самі пройшли радянське навчання, найближчим часом прибуде до Орєнбурґа і організує навчальні курси для наших загонів міліції, допомагаючи їм подолати брак підготовки та підготуватися до майбутніх боїв проти сил Дірлеванґера та Лисенка. n\nЩедрі зусилля Уральської ліги щодо надання допомоги нашій землі високо оцінюються робітниками та селянами Орєнбурґа. Кроки, зроблені Лігою, не тільки свідчать про поліпшення наших відносин з ними."
 ORE.58.a: "Ми використаємо їхні таланти з користю"

 ORE.59.t: "Ліга відхиляє нашу прохання"
 ORE.59.d: "Зі Сходу надійшли невтішні новини. Наші посланці до Уральської ліги, яким було доручено попросити її керівництво про військову допомогу та посилення співпраці між нашими країнами, повернулися з порожніми руками. Посилаючись на очевидну нестачу вільних ресурсів для наших військ, Уральська Ліга відхилила наше прохання надіслати їхніх військових фахівців для проведення бойової підготовки наших недостатньо навчених ополченців. Хоча відмова Ліги ускладнить наші зусилля з реорганізації збройних сил, деякі з найбільш зневірених представників ради намагаються заперечити необхідність серйозних змін у нашій армії і втішаються романтизацією селянських партизанських воєн минулого. Зрештою, саме непідготовлені, миролюбні селяни сміливо чинили опір вторгненням поляків і Наполеона і вигнали їх з нашої Батьківщини століття тому, в той час як професійні солдати лише залишали міста на розсуд наших ворогів. Якщо народна війна стільки разів рятувала Росію, чому ми не можемо довірити їй розгромити монстрів Дірлеванґера і Лисенка?"
 ORE.59.a: "Ми підемо своїм шляхом, не зважаючи на Лігу"

 ORE.60.t: "Анархія в Оренбурзі!"
 ORE.60.d: "Колись Орєнбурґом правила тонка структура порядку. Зараз залишилася лише анархія. Селянські комуни — це лише острівці серед відсутності цивілізації. Рівень бандитизму зріс до безпрецедентного рівня, а витончена економіка, яку ми підтримували раніше, тепер перетворилася на середньовічну бартерну економіку. Хоча Рада робітників зберігає певний контроль над Орєнбурґом, очевидно, що наші найкращі дні, якщо їх можна так назвати, минули. n\nРеформи, які просувала влада, не привели до централізації та державності; вони призвели до дезорганізації та кризи, оскільки місцеві сільські старійшини виступили проти переходу до централізованої економіки. Ми більше не можемо проєктувати силу чи навіть захищати власні кордони. Анархія — це не благословення, яке нам обіцяли, а те, що нас спіткало"
 ORE.60.a: "Здається, жадібність зруйнувала єдність"

 ORE.70.t: "Бурба стоїть на своєму"
 ORE.70.d: "Штаб-квартира Ради Орєнбурґа палає, але не буквальним вогнем, а чутками, інтригами та думками, що ховаються в тіні. Зараз мало хто з делегатів виглядає щасливим, повертаючись із комплексу до своїх сіл чи містечок, і їх важко в цьому звинувачувати. Рішення голови продовжити реорганізацію економіки, незважаючи на Раду, важко прийняти селищам, які вже розлючені надмірною централізацією. Ймовірно, що наступні провінційні вибори принесуть ще більше хаосу, але до того часу...\n\nВидається меморандум і оголошується промова голови. Спостерігачі пізніше опишуть це як «зустріч з Ісусом», а лють, з якою зазвичай доброзичливий Бурба накидається на своїх опонентів, є майже пророчою за своєю інтенсивністю. Він чітко дає зрозуміти, що головна мета Ради — досягти того, чого не може досягти окрема людина; в цьому сенсі обрання Бурби було, мабуть, єдиним правильним рішенням, яке Рада коли-небудь приймала. Далі він жорстко критикує своїх опонентів, називаючи їх бандитами, реакціонерами, дурнями та ідіотами, і на завершення наголошує, що реформи триватимуть, незважаючи ні на що. Кілька членів Ради непритомніють від шоку. Решта бурчать і скиглять, але вони залякані. Рада поступається, і незгода вщухає. Орєнбурґ тремтить, але продовжує свій важкий шлях до майбутнього, прихованого в смозі, але яскравого в серці Голови."
 ORE.70.a: "Хороші члени Ради виконують накази"

 ORE.71.t: "Нове відродження"
 ORE.71.d: "Орєнбурґ — це нове місто. Колись воно було просто ще одним містом у Росії, а потім у Радянському Союзі, а тепер стало перлиною всієї Євразії. На відміну від більшості міст світу, Орєнбурґ — це комфортне, процвітаюче і, що найважливіше, безпечне місто. Ми — сяюче місто на пагорбі, маяк стабільності серед розбитої пустки колишнього Радянського Союзу. На момент здобуття незалежності ми створили не тільки унікальну систему управління, а й унікальну культуру. На наших вулицях їздять автомобілі місцевого виробництва. У кожному будинку є чиста вода, електрика та телефонний зв'язок. Художники з гордістю презентують свої роботи в галереях, а інтелектуали обговорюють філософію в вуличних кафе. Як повідомляється, було створено кіностудію, яка вже цього року почне писати сценарії та знімати фільми. Все це завдяки змінам, які провів товариш Бурба та його віддана команда кваліфікованих експертів. Без нього та його мудрого керівництва ми навряд чи досягли б такого рівня культурного та економічного успіху. Ми вдячні за їхні відважні зусилля та процвітання, яке вони нам забезпечили. n\nОрєнбурґ переживає Ренесанс, і для нас все ніколи не було краще"
 ORE.71.a: "Ми стоїмо на своїх двох ногах"

 ORE.72.t: "Військові реформи голови Бурби"
 ORE.72.d: "Лідер будь-якої нації повинен мати армію, щоб звільнити свій народ від зовнішніх загроз. Ця мудра порада витримала випробування часом з моменту зародження історії, і, як і будь-який реформатор, гідний згадки, голова Бурба знає, що не варто ігнорувати тисячолітні уроки. Розумна порада є розумною порадою, особливо після розпаду Союзу. Більше того, самі міліціонери не мають більшої лояльності та відповідальності, окрім захисту свого села, хутора чи міста. Який опір зможуть чинити озброєні сільськогосподарським знаряддям селяни проти гігантських машин, які мають намір захопити весь Орєнбурґ, а не лише їхні власні домівки? Щось має змінитися, перш ніж вони опиняться в скрутному становищі; для голови зміни починаються з кування нових мечів зі старих, пошкоджених ланцюгів. n\nЗ ретроспективи, перший крок був настільки простим, що тільки паралізований уряд не зміг би його реалізувати в найкоротші терміни. В Оренбурзі не бракує ветеранів Великої Вітчизняної війни, досвідчених у війні, але безцільних у мирний час. Зібрати цих калік, п'яниць-ветеранів, розкиданих по комунах, в одному покинутому будинку в місті Орєнбурґ, знадобилося деякий час і зусилля. Невпевненість і розгубленість швидко поступилися місцем неписаному братерству, яке об'єднувало всіх солдатів, і сміх, історії та непристойні жарти лилися з будівлі, як потоки розлитої горілки. Коли їхній настрій вщух, вони почали обмінюватися скаргами та ідеями. Похмурий стан «війська» Орєнбурґа. Зброя, не краща за мушкети часів царів. Міжкомунальні навчальні заходи. Прохання до голови про надання гвинтівок, офіцерів, уніформи, прапорів і підрозділів. Деталь за деталлю, тепер уже названий «Комітет ветеранів», спираючись на десятиліття гордої служби Революції, почав планувати армію, гідну називатися власною армією Орєнбурґа: дисципліновану, організовану і, що найважливіше, готову боротися як єдине ціле заради Комуни.\n\nТак сталося, що ветерани пізніше покинули місто з новою зброєю і новою метою, обіцяючи повернутися після того, як приведуть своїх хлопців у належну форму. Нація не може створити професійну армію за одну ніч... але завдяки проникливості своїх щасливих ветеранів і допомозі Уральської гвардії, Орєнбурґ може створити армію оренбуржців у належний час."
 ORE.72.a: "Голова ніколи не здавався нам військовим командиром, але його ідеї мають свої переваги"

 ORE.73.t: "Нова програма підготовки"
 ORE.73.d: "Підготовка наших ополченців була досить недооцінена, що призвело до її неправильного управління та низької ефективності. Солдати часто не знали основних тактичних прийомів, ближнього бою, медичних технік і навіть того, як правильно стріляти. Однак завдяки навчальній програмі Уралу все це зміниться. Ополченці будуть навчені та перенавчені технікам сучасного бою, щоб бандити Дірлеванґера більше ніколи не загрожували нам, і жодна інша сила не змогла протистояти нашій могутності. Солдати більше не будуть йти в бій, не маючи знань про те, як вижити або воювати. Фашисти більше не будуть зневажати «нижчих» слов'янських ополченців Уралу. Натомість вони будуть боятися нашої сталі і плакати, коли побачать, як наші гармати пробивають їхні формування. Орєнбурґ більше ніколи не буде боятися, адже його кордони захищають славні солдати!"
 ORE.73.a: "Ми виживемо, що б не сталося!"

 ORE.74.t: "Програма стандартизації Бурби"
 ORE.74.d: "Однією з багатьох проблем децентралізованої системи міліції є відсутність стандартизованої зброї. Міліція використовує все, що може знайти, що цілком зрозуміло, але це призводить до нестачі запасних частин і боєприпасів, і тому ми часто недостатньо оснащені і поступаємося в озброєнні. Бурба усвідомив це, і за його правління тепер будуть масово вироблятися та використовуватися стандартні зразки зброї. Стандартні гвинтівки, стандартні кулемети, все стандартне. Кожен солдат повинен мати якісну вогнепальну зброю та спорядження, щоб бути впевненим у своїй спроможності протистояти ордам, які загрожують нам"
 ORE.74.a: "Наші солдати більше не будуть страждати від неякісних рушниць!"

 ORE.75.t: "Реформи міліції тривають"
 ORE.75.d: "Ми вічно вдячні Уральській лізі за допомогу в наших постійних зусиллях з об'єднання наших міліцій. До програми навчання тепер додано заняття з тактики загону, що нам дуже потрібно. Тепер солдатів навчатимуть прикриттю вогнем, використанню гранат, маршируванню в строю, вогню з мінометів та артилерії, а також загальним стратегіям адаптації до різних видів зброї та тактики, які фашистські бандити використовуватимуть, щоб нас вбити. Тепер наші хоробрі товариші будуть битися з мужністю та розумом. Побачимо, як Дірлеванґер нас тепер полюбить!"
 ORE.75.a: "Ніщо нас не зупинить. Ми зараз сильніші, ніж будь-коли раніше"

 ORE.76.t: "Мистецтво оборони"
 ORE.76.d: "Бандити зазвичай значно гальмують процвітання і щастя, маючи нещасну звичку перерозподіляти ресурси найнеефективнішим чином. На даний момент відносне процвітання Орєнбурґа привабило до регіону бригаду Дірлеванґера, спраглу крові. За ними послідували менші групи бандитів, які, без сумніву, сподіваються скористатися нашою непідготовленістю, щоб забрати все, що можуть, перш ніж Чорний Бандит покінчить з нами.\n\nНа якомусь етапі численних реформ і реорганізацій голови Бурби наш лідер санкціонував створення пересувної військової академії. Ця група чоловіків з Комітету ветеранів, за допомогою кількох наших перших професійних солдатів, об'їжджає комуни на нашому східному кордоні, щоб проводити заняття з укріплення та оборонних позицій. Допомагаючи міліціям, які ще не були інтегровані в нашу професійну армію, готувати добре продумані окопи, спостережні пости та зони ураження, ми збільшуємо здатність місцевих жителів відбивати групи бандитів, що бродять, і нейтралізувати їх силою, якщо це необхідно. Особливо важливі комуни, розташовані вздовж наших ліній постачання, навчають будувати кілька рівнів укріплень і окопів, щоб виграти час і завдати додаткових втрат будь-якому загарбнику, і, сподіваємося, відбити будь-які атаки. n\nНаші новопризначені командири вважають, що такі заходи підготовки завадять багатьом бандитам дістатися до внутрішніх районів Орєнбурґа з метою простих набігів. Коли настане час протистояти справжній армії загарбників, захоплення кожної громади затримає будь-яку армію загарбників і дасть час нашим резервам дістатися до ослаблених ділянок фронту."
 ORE.76.a: "Якщо найкращим другом солдата є його гвинтівка, то лопата займає друге місце"

 ORE.77.t: "Міліція для Орєнбурґа"
 ORE.77.d: "Занадто довго міліція Орєнбурґа представляла лише місцеві комуни. Децентралізований характер нашої адміністрації зробив ситуацію жахливою, будь то наше «уряд» чи військо. Однак за правління Бурби це зміниться. Міліція повинна представляти і захищати весь Орєнбурґ, а не тільки свої місцевості. Вона повинна бути об'єднана під центральним командуванням з добре навченими офіцерами і солдатами, готовими боротися за народ. Без цього ми впадемо під натиском бандитських сил. Тільки завдяки єдності ми виживемо"
 ORE.77.a: "За Орєнбурґ!"

 ORE.78.t: "Комісія з планування"
 ORE.78.d: "Сьогодні вранці Бурба оголосив Раді робітників Орєнбурґа, що він створить офіційну Комісію з економічного планування, щоб доповнити свою роль голови. Незважаючи на протести більш ліберальних і популістських членів Ради, Бурба був готовий, маючи під рукою відповідні статті, які дозволяли голові робити такі речі. Зневірені таким маневром, Рада відступила і дозволила Бурбі зробити свій крок, і він його зробив. \n\nГолова заявив, що Комісія ще більше прискорить його програми розвитку, які вже демонструють значний прогрес у вибраних ним галузях. Згідно з його великим баченням, Комісія організує індустріалізацію його суспільства у вигляді великого балету реквізицій, прямих наказів та економічних стимулів. Оскільки Металургійна рада замовляє сплави для кування, Логістична рада повинна транспортувати їх до місця призначення, а Рада з зонування повинна забезпечити, щоб вони використовувалися саме там, де вони потрібні. n\nЗі списком заступників директора, який безпосередньо відображає реєстр найкращих і найталановитіших людей Орєнбурґа, здається, що Комісія буде працювати відповідно до будь-яких мрій Бурби — ефективно, чисто і поза впливом тих, хто може завадити прогресу."
 ORE.78.a: "Це нам добре послужить"

 ORE.79.t: "Про стан економіки"
 ORE.79.d: "Обраний на посаду голови Ради з обіцянкою економічних реформ, Олександр Бурба та його ліга технократичних радників винесли на розгляд великої ради пропозицію: передати всі питання, пов'язані з централізованим економічним плануванням, голові Ради. Спочатку багато членів ради ставилися до цього з обережністю; пропозиція надати пряму, незаперечну владу кліці технократів не здавалася сумісною з децентралізованим стилем управління, який був таким поширеним до приходу Бурби до влади. У своєму зверненні до Ради Бурба описав економіку Орєнбурґа як «пасма волосся, що плавають від підлоги до стелі, такі тендітні і без будь-якої реальної сили. Але коли їх покласти поруч і сплести разом, навіть густі пасма волосся можуть підняти людину на вершину гори». У залі запанувала тиша, а члени ради замовкли. З одного боку, щоб викликати такі радикальні зміни за такий короткий час, потрібна сильна рука. Але хто може знати, чи ця рука дбає про інтереси кожної громади? Незабаром прихильники автономії та прихильники Бурби знову вступили в серйозну дискусію в залі Ради, перш ніж почалися справжні суперечки. Незабаром сам Бурба був змушений перервати агресивні лайки та політичні виступи в Раді і оголосив голосування з цього питання. n\nКоли роздають білі папірці, тягар ситуації лягає на присутніх: зрадити цінності комунальної автономії заради сильнішої економіки чи зіткнутися з мінливим світом із застійною промисловою базою? Перед тим, як зібрати і підрахувати голоси, між учасниками обмінюються гнівними поглядами."
 ORE.79.a: "Технократи дбають про найкраще для нації"

 ORE.80.t: "Голос для кожної людини"
 ORE.80.d: "Незважаючи на свої недоліки, яких чимало, Оренбурзька комуна в своїй суті є державою народу. Рада робітників є не менш ніж живим свідченням її безкомпромісної відданості ідеалам демократичного врядування, і громадяни під її егідою не виявляють жодного бажання змінювати цей стан речей, незважаючи на потрясіння і новомодні реформи голови Бурби. Сам її новий голова має власний досвід її найбільшого недоліку, про що свідчать суперечки та внутрішні конфлікти, які тривають навіть після 58-го з'їзду. Надлишок радників, кожен з яких має свою унікальну та палку позицію, заважає досягненню консенсусу в уряді Орєнбурґа, за винятком окремих випадків. Для органу, який вважає консенсус священним? Параліч на всіх рівнях управління. Економічний прогрес не повинен і не може бути пов'язаний зі станом паралізованого органу, але чи не означатиме це, як кажуть деякі, ігнорування думки народу щодо власної економіки? Голова Бурба дав свою відповідь у вигляді повідомлення до кожного села, хутора та міста в Комуні. Цей короткий лист, написаний простою мовою, яку може зрозуміти навіть найнеписьменніший дідусь, доставили найкращі кур'єри, яких міг зібрати Рада. На старих аркушах пергаменту було написано:\n\n«Приведіть своїх найрозумніших чоловіків і жінок до Орєнбурґа за сім днів. Народ потребує їхніх навичок»"
 ORE.80.a: "Кожен має право голосу. Користуйтеся ним"

 ORE.81.t: "Економіка — це наука"
 ORE.81.d: "Голова Олександр Бурба болісно усвідомлює один факт: економіка — це наука, яка повинна бути високодосконалою, щоб уникнути руйнування тисяч людських життів. Щоб досягти великого економічного відродження, до якого прагне Бурба, він повинен розглядати економіку як наукову проблему, яку потрібно вирішити, а людей і гроші — як ще одну змінну в цьому рівнянні. Разом зі своєю групою економістів його кліка планує кожен аспект майбутньої економіки; навіть одна помилка або прорахунок у рівнянні змусить весь картковий будинок впасти на коліна Бурби. Однак Бурба не дозволить цьому експерименту провалитися, як жахливий експеримент Лисенка. Він буде процвітати і справді перетворить Орєнбурґ на рубін Уралу. Орєнбурґ переможе проти всіх перешкод, проти всіх ворогів!"
 ORE.81.a: "Рубін Уралу не підведе нас"

 ORE.82.t: "Старі карти, нові потреби"
 ORE.82.d: "Чоловіки дивилися на горизонт з блиском в очах. З їхньої вигідної позиції вони бачили кілометри порожньої, незайманої землі, яка тільки чекала, щоб її експлуатували для власних капіталістичних потреб. Під усією цією землею мала бути нафта, в цьому не було сумнівів. Старі геологорозвідники практично відчували її запах, запах багатства. Крім того, священик сказав, що вона ховається під пилом, а церква не бреше. Єдина проблема полягала в тому, що ніхто, ні чоловіки, ні старателі, ні церква, не знали, де насправді лежить це блискуче, гладеньке, чорне золото. Коли вони сиділи у своїх офісах, розчаровані і збентежені тим, що нафта має бути, але вони не мають можливості її знайти, у двері постукали. За дверима стояв невисокий бібліотекар в окулярах. Мабуть, найгірша людина, до якої можна звернутися, шукаючи нафту. У руках він тримав згорнуті папери і представився архіваріусом з національного архіву Орєнбурґа. Очікуючи чергового бродяги, який намагається виманити у нього гроші, капіталіст поставився до нього скептично. Його скептицизм швидко зник, коли архіваріус розгорнув папери, показавши дуже детальні радянські дослідження території, яку вони розглядали. Як це їм раніше не спало на думку? Радянські дослідження були широко відомі своєю ретельною точністю, і ті, що були представлені йому, показували нафтові родовища. За кілька тижнів місячний ландшафт був усіяний нафтовими свердловинами, що гуркотіли. Прогрес в Оренбурзі прийшов і пішов швидко. Майбутнє для нас виглядає світлим."
 ORE.82.a: "Якщо радянські зробили щось правильно, то це були їхні карти!"

 ORE.83.t: "Питання землі"
 ORE.83.d: "Нинішнє управління землею в комунах є абсолютно жахливим. Величезні ділянки землі відведені під вирощування продуктів, на які є низький попит і які майже не використовуються, ефективні методи землеробства невідомі жодному чоловікові в деяких комунах, а управління землею доручено людям, які не мають ні краплі досвіду в цій галузі. Про належне зрошення ферм ніхто й не чув, а водопровід є рідкістю, доступною лише для обраних, а коли він є, то використовується в неправильних місцях, в неправильний час і для неправильних людей. Для виживання нашої аграрної економіки надзвичайно важливо реорганізувати управління землею та право власності на неї, щоб люди, які керують більшістю нашої економіки, хоча б трохи розбиралися в цьому. Вже зараз наглядачі, призначені Олександром Бурбою, беруть на себе роль цих людей. Якщо ми ефективно реорганізуємо управління землею під компетентним керівництвом, економічні показники Орєнбурґа значно покращаться, і держава буде набагато краще підготовлена до більших реформ. Якщо ми не реорганізуємо управління землею, наша економіка може повністю занепасти"
 ORE.83.a: "Ось чому Рада робітників не працювала"

 ORE.84.t: "Більше промислового обладнання"
 ORE.84.d: "Уральська Ліга колись була для нас обережним знайомим. Зараз ми найближчі союзники. Недавні програми «ленд-лізу» для нас і наших товаришів з Уральської Ліги призвели до того, що велика кількість обладнання, як цивільного, так і промислового, була відправлена за кордон, а велика кількість надійшла. Завдяки нашим тісним партнерським стосункам із друзями на сході, вони щедро запропонували допомогти нам у наших зусиллях з індустріалізації, надіславши нам машини, автомобілі та креслення, вироблені ними. Ми вже надіслали їм подарунок із власної доброї волі у вигляді дуже великої суми готівки та підписаного листа від Бурби. У час, коли нам так бракує необхідного обладнання для процвітання та зростання нашої економіки, це буде безцінною допомогою та великою підтримкою. Очевидно, що вони не просто надсилають нам подарунки з доброти своїх сердець; ми будемо великим надбанням у їхній боротьбі проти Дірлеванґера та Лисенка. Проте ми дуже вдячні за це"
 ORE.84.a: "Ура нашим товаришам на Уралі!"

 ORE.85.t: "Більше ніяких порожніх заводів"
 ORE.85.d: "У міру того, як ми продовжуємо отримувати щедрі пільги від голови Бурби, виникає все більше питань.\n\nПорожня оболонка Радянського Союзу надала нашим громадянам безліч заводів, на яких вони можуть працювати, то чому б не скористатися ними?\n\nСьогодні вранці Бурба відповів на це питання, заявивши, що більше не буде порожніх заводів. Моральність цього рішення ставиться під сумнів, оскільки більшість громадян Орєнбурґа не знайомі з промисловістю, не кажучи вже про важку техніку. Прихильники цієї політики стверджують, що необхідність цієї програми переважає можливі недоліки. \n\nУ міру того, як все більше фермерів кидають плуги і йдуть на фабрики, обмінюючи лопати на гайкові ключі, економіка Орєнбурґа зростає. Чи принесуть ці реформи користь Орєнбурґу в довгостроковій перспективі, невідомо, але пересічний громадянин знає лише те, що настав час братися до роботи."
 ORE.85.a: "Будь-який прогрес — це хороший прогрес"

 ORE.86.t: "Організована політика"
 ORE.86.d: "Політика — це брудна гра. Важливо бути обережним, граючи в цю гру, і максимально використовувати свої ходи. Рада перебуває в хаосі, засідання призначаються, але ніколи не проводяться, терміни часто ігноруються до останньої секунди, а всередині мало життєвої енергії. Відтепер засідання будуть призначатися за кілька днів наперед, а правила будуть пом'якшені. Життя увійде до Ради, коли її члени будуть боротися за те, у що вірять, під дахом дебатів, як і було задумано Конгресом. Завдяки змінам, запровадженим Бурбою, Рада тепер має привід приходити на роботу, щоб вести дебати. Реформована на краще, Рада знову вступає в новий день"
 ORE.86.a: "Спільнота, пов'язана неприязню"

 ORE.87.t: "Професіонали на місці подій"
 ORE.87.d: "Сьогодні вранці десятки членів Ради прокинулися, мабуть, найгрубішим чином. На їхніх столах лежали листи, ідентичні за текстом, розміром і чорнилом, в яких їх благали якнайшвидше подати у відставку. Новий план Бурби щодо Ради, можливо, не враховує посади всіх членів Ради, але він точно виконав свою роботу. Члени ради більше не будуть обіймати посади або виконувати роботу, до якої вони не готові і для якої не мають компетенції. Якщо все піде за планом, результатом цієї політики стане поліпшення відносин між членами ради та тими, хто виконує допоміжну роль у раді. На жаль, єдине, чого досягла ця політика, — це те, що звільнені працівники замислюються над тим, що робити далі. Не всі великі, радикальні реформи Олександра Бурби працюють так, як було заплановано."
 ORE.87.a: "Принаймні зачиніть двері, коли виходите"

 ORE.88.t: "Знову потрясіння"
 ORE.88.d: "На основі останніх даних, які надійшли зі статистичного відділу Ради, шановний голова Бурба оголосив про свій наступний план реформування Ради робітників для досягнення ще більших висот. На жаль для деяких, ці реформи повністю змінять спосіб функціонування Ради. Бурба планує реформувати Раду в ефективну політичну машину, яка буде виконувати свою роботу правильно, а в разі невдачі легко виправлятиме свої помилки і продовжуватиме рухатися вперед. Однак ці реформи є дорогими і трудомісткими. Багато хто залишиться позаду. Врешті-решт, все це буде варте великої реформи нашої старіючої Ради. n\nПісля завершення цих змін люди все ще матимуть своє традиційне право голосу, а Орєнбурґ все ще буде великою державою, якою він завжди мав потенціал бути. Єдина істотна відмінність полягатиме в тому, що Рада, яка реагуватиме на їхні пропозиції, буде набагато ефективнішою і значно швидшою"
 ORE.88.a: "Цей чоловік просто не зупиниться"

 ORE.89.t: "Друзі в Лізі"
 ORE.89.d: "Лідери Уральської Ліги — дивна компанія. Звичайно, найдивніші з них — ті, хто заявляє, що представляє щось на зразок спецпідрозділу з кількома будинками. Різноманітні сиві солдати. Старі радянські чоловіки, які воювали в тій чи іншій війні або охороняли гулаги до останніх днів Союзу. Трохи дивнішими є ті, кому ледь виповнилося двадцять-тридцять років, тих, кого Гвардія зібрала пізніше під час цієї занедбаної Богом подорожі, але які незабаром довели, що здатні очолити один-два батальйони. Незважаючи на свій молодий вік, ці чоловіки виглядають майже так само старими, як і їхні товариші, адже роки походів Уралом від битви до жахливої битви змусили їх старіти швидше, ніж будь-який інший чоловік мав право. Будь-яка подібність до веселої жвавості молоді повністю і остаточно зникла. Це зморщені старі, політичні активісти, священики та всі інші, хто колись давно заслужив гнів Бухаріна або його наступників. Вони постійно сперечаються між собою про релігію та її відсутність, про переваги та недоліки комунальної системи Орєнбурґа, про те, як сильно їм не подобається грубість солдатів та неосвіченість цивільних. \n\nОднак найдивніше не якась конкретна особа, а сама група. Незважаючи на ці розбіжності, ці суперечки, чоловіки працюють у майже ідеальному тандемі. Хоча можна було б подумати, що комуністичні солдати, католицькі священики та політичні ізгої, закинуті в тюремну камеру, стануть причиною швидкої і фатальної кровопролитної сутички, очевидно, що ці чоловіки не можуть жити без товариства своїх побратимів. Вони говорять один за одного, ніби читаючи їхні думки, і хоча вони сваряться і б'ються, вони запекло захищають своїх товаришів, коли хтось із сторонніх наважується поставити під сумнів цю групу. Найголовніше, що ми збираємося повернути їх назад. Кожна зустріч є захоплюючою, кожна думка узгоджується, здається, найкращими розумами і силами, які може запропонувати холодна, проклята в'язниця. Не всі їхні пропозиції є сміливими, але всі заслуговують принаймні на обговорення. Нам є про що поговорити з цими людьми: про те, як поліпшити наші країни і як ще більше розширити наші відносини. Незабаром у нас відбудеться найбільша зустріч. Ми можемо тільки побоюватися божевілля, яке принесе ця група, і проникливості, яку може дати тільки вона."
 ORE.89.a: "Божевілля і геніальність — дві сторони однієї медалі"

 ORE.90.t: "Випробування"
 ORE.90.d: "Біжи, ти, клятий пес!» — кричить один з інструкторів. \n\n«Ти, маленький виродку! Якщо ти подивишся мені в очі, я зламаю тебе на коліні! Ти знаєш, що я бачив!? Де я був!?» — кричить інший в обличчя юнака, не старшого за шістнадцять років, який намагається стримати сльози, поки троє інших уральських гвардійців накидаються на нього. В одному кінці тренувального майданчика жінці надають допомогу через травми, отримані під час падіння з перешкодної смуги, яку побудували гвардійці, в іншому — чоловік отримує нові травми, коли уральський гвардієць кілька разів б'є його по голові кліпбордом за те, що він не встиг вчасно прибути на майданчик. Вони сміються і жартують або сидять тихо і дивляться вдалину, згадуючи давні битви. Вони рятують життя і переїжджають з міста в місто, надаючи будь-яку допомогу, яку можуть. Але ця сторона гвардії є новою для всіх. Хоча багато хто з них добровільно приєднався до них або погодився на це навчання, сподіваючись перетворитися на зразки найкращих російських солдатів за одну ніч, вони швидко усвідомлюють, що для цього потрібно набагато більше крові і поту, ніж вони могли очікувати. Але коли новобранці роти «Анна», перші, хто розпочав цю нову пекельну програму навчання Гвардії, починають десяте коло свого десятикілометрового бігу, результати стають очевидними. Вже зараз чоловіки і, на превеликий жаль багатьох, жінки цієї роти біжать з новою впевненістю. Вони дихають легше, рідше спотикаються, а на їхніх обличчях видно очі тих, хто готовий вбивати за свою країну."
 ORE.90.a: "Важка підготовка для важкої битви!"

 ORE.91.t: "Повільний союз"
 ORE.91.d: "Вони називають це «Чудом на Уралі»: гірка напруга у відносинах між Лігою та Комунами офіційно розтанула. Обрання Бурби головою передувало остаточному розриву в політиці щодо Ліги, і повільно, але впевнено кордони вздовж старих гірських доріг до Белорецька стали добре протоптаними як з нашого боку, так і з їхнього. Спільні військові патрулі, торгові конвої та дипломатичні місії зробили нашу дружбу з Уральською Лігою відкритою таємницею, і зараз навіть ходять розмови про створення постійного альянсу, що закріпить наші особливі відносини. Не варто згадувати, що багато сільських комун висловили своє невдоволення, хоча б у місцях, які не можуть відстежити агенти внутрішньої безпеки, тим, що значна частина цих нових дипломатичних відносин зосереджена на самому Оренбурзі. Проте заохочення таких думок через натяки та коментарі може ще більше поліпшити нашу позицію в Лізі та зміцнити нас проти внутрішньої опозиції. Ліга є сильною підтримкою і вірним другом, а найкращі друзі знають, що їх не потрібно згадувати по імені, щоб вони були присутніми."
 ORE.91.a: "Можливо, чудеса все-таки існують"

 ORE.92.t: "Прихований потенціал Орєнбурґа"
 ORE.92.d: "Коли німці вирішили розбити російську націю, вони методично руйнували її міста. Все цінне на схід від лінії АА було розбомблено бомбардувальниками Люфтваффе, перетворено на руїни, зроблено непридатним. Великі міста, промислові центри, військові бази — майже все, що могло допомогти російському народу вийти з тисячолітньої безодні, було зруйновано Люфтваффе. Звичайно, навіть ресурси цілої індустріальної країни не могли виготовити достатньо бомб, щоб зрівняти з землею всю Росію. Декілька районів вижили після апокаліпсису, якщо не без ушкоджень, то в не надто поганому стані, щоб продовжувати функціонувати. Олександр Бурба опинився в Оренбурзі на початку Великої Вітчизняної війни. Щось у цьому регіоні допомогло йому врятуватися від апатії, яка охопила так багато тих, хто вижив у колишньому Радянському Союзі. Навколо нього була регіональна столиця, яка пережила кінець світу і початок нового. Її мешканці пристосувалися, позбавлені промислового постачання від Радянського Союзу. Місто було достатньо великим, щоб підтримувати середню і навіть вищу освіту, але не більше того. \n\nІ так Олександр Бурба почав мріяти. Частина його підозрювала, що це може бути просто механізм адаптації. Але мрія допомагала йому пройти через важкі часи 40-х і 50-х років. Він допомагав чоловікам регіону підтримувати якомога більше заводів. Допомагав фінансувати експедиції інших амбітних чоловіків до сусідніх регіонів. Заохочував молодь Орєнбурґа ставати торговцями, інженерами, політиками та вченими, щоб допомогти йому зберегти мрію про багатство та прогрес. Бурба добре розумів, що його бачення процвітаючого Орєнбурґа може здійснитися лише в майбутньому. Занадто багато установ потребували відбудови. Потрібні були примітивні інструменти, щоб побудувати трохи кращі інструменти, і так далі, доки промислова база Орєнбурґа знову не зможе створити сучасність. Його мрія була поступовою, на відміну від катастрофічної ідеї Георгія Маленкова про великий стрибок вперед. Вчений знав, що порядок і прогрес можна відновити з часом. Йому потрібні були лише терпіння і трохи удачі."
 ORE.92.a: "Нехай німці руйнують. Ми, росіяни, побудуємо майбутнє зі скла та сталі"

 ORE.93.t: "Підкріплені силою"
 ORE.93.d: "Після кількох тижнів тренувань новостворена Оренбурзька оборонна сила взяла на себе перше справжнє завдання — захист торгових шляхів, якими проходять наші конвої, щоб доставити товари до численних комун, до яких веде дорога. З часів війни ці дороги стали небезпечними, оскільки бандити без страху бути спійманими грабували товари у всіх купців і мандрівників, адже міліція, яка раніше охороняла Орєнбурґ, була нічим іншим, як бандою нікчемних підлітків і старих, які хотіли згадати свої славні дні. З поганим людським матеріалом і неефективною структурою командування, міліція втікала в страху при першому ж звуці пострілів. Але цього разу на бандитів чекав сюрприз, адже вони напали не на стару і неефективну міліцію, а на реформовані і ефективні Оренбурзькі оборонні сили, навчені за зразком потужної Уральської гвардії і здатні впоратися з будь-якою загрозою, з якою вони стикаються, і легко її відбити. n\nГрупа бандитів нишпорила поблизу Орєнбурґа, і, побачивши торговий караван, що зупинився на узбіччі дороги для відпочинку, бандити були впевнені, що незабаром отримають легку здобич. Вони й гадки не мали, що це була пастка, влаштована компанією «Анна». Все закінчилося менш ніж за п'ять хвилин після початку засідки: після жорстокої перестрілки всі бандити загинули, а жоден міліціонер не отримав навіть подряпини. Наступна група нападників двічі подумає, перш ніж атакувати Орєнбурґ."
 ORE.93.a: "Орєнбурґ більше не беззахисний"

 ORE.94.t: "Об'єднані разом"
 ORE.94.d: "Передвісники похмурі, і божевільні орди Дірлеванґера та Лисенка збираються на горизонті, готові до бенкету. Принаймні, таке враження складається після вивчення підготовки Уральської ліги та ополченців Орєнбурґа. Гвардійці та ополченці бездоганно координують свої дії під час навчань і нарешті починають працювати разом як єдина сила проти сил темряви на сході. Однак ця домовленість потребує формалізації, щоб зв'язки між двома суспільствами були закріплені не тільки кров'ю і сталлю, а й чорнилом. Південно-Уральська об'єднана оборонна ліга — це офіційний пакт, який закріпить нашу відданість взаємній обороні в незмінних зв'язках бюрократії. Нарешті, так як наші солдати об'єдналися, так само об'єднаються і наші політики та дипломати. Нехай вони приходять, нехай собаки війни розбиваються об наші укріплення, як хвилі в океані! Вони знайдуть нас незламними, стоячи рука в руку проти крижаної бездушності Магнітогорська і теплої, кривавої жорстокості Дірлеванґера."
 ORE.94.a: "Потрібно тільки дочекатися рішення Ради"
 ORE.94.b: "На жаль, ми мусимо відмовити"

 ORE.95.t: "Корона з коштовністю"
 ORE.95.d: "Хоча місто Орєнбурґ стало блискучою коштовністю Уралу і хоча всі вже знають про великі досягнення міста, менш відома, але не менш значна зміна сталася в селянських громадах, що оточують його. Велике відродження міста вимагало багато чого від навколишніх земель. Було побудовано десятки нових ферм, а ще більше було повністю перебудовано та модернізовано. Тепер ландшафт заповнюють комплекси заводів і шахт. Звичайно, все це вимагає необхідної інфраструктури для доступу та виїзду. І всі дороги ведуть до Орєнбурґа. Дорога марна, якщо бандити можуть просто напасти на тих, хто по ній подорожує, тому тепер ландшафт усіяний заставами, щоб ті, хто подорожує по них, могли це робити без постійного страху нападу. Для функціонування цих застав потрібні гроші, тому бідні люди тепер знаходять роботу поряд із солдатами, збираючи мито для держави з тих, хто проїжджає повз. Звичайно, цим робітникам і солдатам потрібні місця для проживання, тому навколо них виросли менші села і поселення. А завдяки цій безпеці та великій кількості таких пунктів по всій місцевості з'явилися численні поштові станції, кур'єрські служби та хостели для мандрівників. \n\nДля відкриття цих підприємств потрібні люди, які можуть на них працювати. Держава не тільки розвиває землю, але й різні підприємства почали спонсорувати школи для дорослих і дітей, завдяки чому рівень грамотності наблизився до довоєнного рівня. У міру розширення класу письменників їм також потрібні кафе для зустрічей, газети для перегляду та книги для невеликих бібліотек. Але що, якщо писати недостатньо? Ця одна думка привела до будівництва радіостанції в Сол-Ілецьку, однієї з менш ніж десятка, побудованих в Росії за останні двадцять років. Вже говорять про пошук способу торгівлі із зовнішнім світом. Щоб отримати телевізори! Телевізори!\n\nМісто Орєнбурґ може бути блискучою перлиною, але чи може хтось сказати, що область не стає гідною короною? Дякуємо товаришу Бурбі, адже майбутнє вже настало!"
 ORE.95.a: "...а звіт про стан фондового ринку?"

 ORE.96.t: "Прийняття пропозиції Ліги"
 ORE.96.d: "Уральська Ліга запропонувала нашим скромним громадам укласти союз. Ми, звичайно, готові прийняти її! Після декількох годин дебатів було досягнуто майже одностайного висновку, що союз з Лігою явно відповідає нашим інтересам. Уральська Ліга зарекомендувала себе як ефективний захисник слабких і беззахисних у регіоні, і вона стане чудовим союзником у боротьбі як з божевільними в Магнітогорську, так і з бандою розбійників Дірлеванґера. З якої причини ми маємо відмовлятися?\n\nВже зараз міліція Орєнбурґа та найкращі бійці Уральської ліги зустрічаються, щоб обговорити стратегії та плани на випадок неминучих вторгнень з боку Магнітогорська та людей Дірлеванґера."
 ORE.96.a: "Разом ми їдемо!"

 ORE.97.t: "Орєнбурґ стоїть самостійно!"
 ORE.97.d: "Пропозиція Ліги була зважена, рада комуни зібралася, голоси підраховані, і рішення прийнято. Це зайняло багато годин запеклих і напружених дебатів, але відповідь Лізі була надана: «Ні».\n\nОрєнбурґ повинен стояти окремо від Уральської Ліги. Краще, щоб Орєнбурґ жив або гинув самостійно, спираючись на силу наших комун, їхню демократію та мораль, ніж бути поглинутим масою Уральської ліги і втратити свою крихку незалежність. Це важке рішення, оскільки воно означає відмову від негласних оборонних пактів Ліги проти Магнітогорська і Дірлеванґера, Чорної гори і Чорної банди. Хай там як, Орєнбурґ стоїть сам. З якої причини ми б погодилися, ми можемо стояти самі! Нам потрібно буде зібрати міліцію і планувати майбутнє без підтримки Ліги. Багато лідерів комун сподіваються, що наші відносини не будуть надмірно порушені припиненням доброзичливої пропозиції Ліги."
 ORE.97.a: "Ми самі творимо свою долю"

 ORE.98.t: "Тріумф Маленкова!"
 ORE.98.d: "Після років анархії та деградації, здається, що зараз, завдяки мудрим і доброзичливим реформам нашого улюбленого Голови, Орєнбурґ нарешті прокладає собі шлях до прогресу з небаченою раніше швидкістю. Однак цей темп супроводжується небезпеками — нестабільністю, голодом і смертю через наш швидкий прогрес. \n\nТому Голова наказав послабити програми, знизити квоти та оголосив народне свято для всього Орєнбурґа. Вшануймо померлих, адже їхня жертва привела нас до райдужно-червоного світанку! Нехай про їхніх дітей піклуються і нехай вони знають, що їхні батьки віддали все заради вищого блага! Адже якщо не заради вищого блага, то заради чого ми, як суспільство, маємо боротися? Реакціонери на Уралі можуть звинувачувати нас у пролитті невинної крові в ім'я прогресу, але ми маємо відповісти їм простою і зрозумілою правдою — Орєнбурґ піднявся, і втрати є прийнятними. Вони назавжди будуть вшановані як герої і назавжди будуть марширувати разом зі своїми товаришами в дусі. Нехай червоне сяйво прогресу охопить націю, нехай хмари сажі над нами служать нагадуванням про нашу славу! Нехай голова стоїть перед своїми численними масами, в захваті від слави, яку він приніс Орєнбурґу! Адже ми всі його діти, до яких слід ставитися з добротою і справедливістю, звільнені від чорної утроби анархізму. Під його доброзичливим керівництвом ми можемо летіти занадто близько до Сонця і добровільно пожертвувати собою заради більшого блага комуни, але в кінцевому підсумку це, безсумнівно, буде того варте"
 ORE.98.a: "Слава комуні! Слава голові!"

 ORE.101.t: "Комунальний конфлікт переростає у насильство"
 ORE.101.d: "Рада робітників міста Орєнбурґ виникла з давньої традиції пошуку посередництва у міжкомунальних конфліктах. Однак ця традиція посередництва та подальшого арбітражу не змогла повністю придушити іншу традицію відкритого насильства між ворогуючими громадами, які відмовляються шукати мирний компроміс. n\nСьогодні вранці сили, що належать до міліції однієї громади, відкрили вогонь по міліціонерах сусідньої громади. Перші повідомлення про насильницьке протистояння свідчать про конфлікт щодо доступу до спірних пасовищ. З огляду на пролиту кров однієї з фракцій, майже напевно, що друзі та родичі загиблих готують відповідні заходи відплати.\ n\nБагато членів Ради стверджують, що в ці кризові часи не можна допустити продовження відкритої війни між номінально союзними громадами. Вони наполягають на спробі домогтися якогось перемир'я, поки Рада працює над мирним вирішенням спору. Інші, більш радикально налаштовані члени Ради, пропонують попросити сусідню Уральську лігу надіслати миротворців, щоб розділити дві північні громади.\n\nЖоден з цих двох варіантів не є безкоштовним з точки зору ресурсів або політичного капіталу. Допомога від ліги, ймовірно, посилить чутки про неминуче захоплення влади нашими північними сусідами. Інша, не менш голосна фракція Ради просто закликає нас не втручатися в проблему і дозволити жорстоким ідіотам битися між собою. Жителі Орєнбурґа не можуть бути більш розчаровані бездіяльністю Ради на даний момент..."
 ORE.101.a: "Перенести частину нашого порядку денного на іншу дату і скликати спеціальне засідання Ради для переговорів про перемир'я"
 ORE.101.b: "Попросити Лігу розмістити частину своїх прикордонних військ на спірній території"
 ORE.101.c: "Нехай вони б'ються. Це хоча б трохи потренує наші війська..."

 ORE.102.t: "Новий тип сепаратистів"
 ORE.102.d: "Рада звикла до того, що комуни оголошують про свій вихід із Ради робітників. Ці сецесії є неминучим результатом рішення селян, які вважають за краще спробувати самостійно прожити, а не залишатися прикутими до вмираючого трупа нашої робітничої демократії. Зазвичай причиною їхнього виходу є занепокоєння щодо економіки, безпеки або демократичного представництва. Сьогодні представник північної комуни розпочав звичну промову, в якій критикував Раду за некомпетентність і корупцію. До цього додалася загальна тема неспроможності забезпечити безпеку від бандитів і сторонніх осіб. Наші люди в Раді терпляче чекали, коли представник оголосить про вихід його комуни з Ради робітників, і тут пролунала сенсаційна новина: комуна залишить Орєнбурґ і подасть заявку на захист Уральської ліги! Ігноруючи бурхливі протести, представник завершив свою промову зауваженням, що без ефективної армії комуни Орєнбурґа приречені на знищення. Чому б замість цього не приєднатися до розсудливого уряду і не відмовитися від демократичної анархії на користь безпеки? Хоча багато хто з нашої фракції погоджується з аргументами представника, цей вихід викликав бурю протестів. Багато хто в Раді стверджує, що ми повинні переконати цю комуну змінити свої плани, щоб Рада робітників не втратила ще більше авторитету. Голуби пропонують збільшити інвестиції в комуну, що відокремлюється, а яструби натякають, що безпека сепаратистів може бути під загрозою через їхню зраду Орєнбурґа."
 ORE.102.a: "Наші руки зв'язані"
 ORE.102.b: "Ці кляті зрадники!"

 ORE.103.t: "Бійка реформаторських фракцій на ринковій площі"
 ORE.103.d: "Хоча домінуючою політичною коаліцією в місті Оренбурзі є союз фракцій, які прагнуть реформ та індустріалізації, це не означає, що місто вільне від нескінченних внутрішніх суперечок, які впливають на кожну політичну групу в Раді робітників. n\nВчора на жвавій ринковій площі стався насильницький інцидент між прихильниками соціалістичного централізму товариша Маленкова та торговцями й інженерами, які дотримуються технократичних, але демократично орієнтованих ідей товариша Бурби. Ніхто не може дійти згоди щодо того, хто запалив фітіль цього вибухового бочки; прихильники Маленкова стверджують, що вони лише протестували проти антисоціалістичних ідей Бурби, тоді як прихильники Бурби звинувачують маленковців у тому, що ті надіслали бандитів, щоб залякати їх. Хоча ми, звичайно, хотіли б, щоб наша політика була вище таких вульгарних речей, як «хто має більше кремезних чоловіків на вулиці», важко заперечувати, що трохи насильства не підвищує авторитет фракції на вулиці. Оскільки обидві сторони сьогодні відновлюються і лікують зламані кістки, виявляється, що переможцями бійки стали..."
 ORE.103.a: "Люди Бурби. Хто б міг подумати, що ці товстуни вміють битися?"
 ORE.103.b: "Група Маленкова. Вони, безсумнівно, дуже добре спланували свою засідку на ринку"

 ORE.104.t: "Уральські квіти"
 ORE.104.d: "Ти сказав: „Тисяча років“, і наші серця розтанули. Я дивлюся на руки, які колись тримали мої, і моє серце все ще болить». — Леді Хегурі\n\nВона прекрасна, стоячи там серед колихаючихся сосен. Я знаю, що цей момент зникне, якщо я скажу хоч одне слово, тому я мовчу, і він минає. Щодня, на мить, я виймаю його зі свого серця, обтрушую від пилу і на одну блискучу секунду знову знаходжу її.\n\n«Я ненавиджу і я кохаю». Ми завжди сварилися, завжди були в суперечці; син землевласника, дочка профспілкового діяча. Класова боротьба в дії, як дехто це називав. Як же вони здивувалися, побачивши, як ми обмінюємо удари на поцілунки, лють на пристрасть. Зброю на троянди. Нам стало ясно, що наше кохання, народжене у вогні, швидко згасне у полум'ї, якщо ми залишимося. В обох родинах панувала взаємна ненависть, яка руйнує будь-який здоровий глузд, і ми не витримали її. Плачучи, вона втекла до нашого таємного місця, захованого за містом. І разом ми спланували втечу. «За межами понять добра і зла є поле. Я зустріну тебе там». — Румі Настав день. Ми викрадаємося у величезних кошиках, як Мойсей, схований у очереті, у конвої, що прямує до далекого Казахстану, де, кажуть, поляки пустили коріння. Лотоси квітнуть у багнюці, і, можливо, ми теж зможемо. Тепер вона позує для фотографії, посміхаючись, сміючись, її волосся — золоте прапорце у дикому повітрі.\n\nМоя кохана сказала мені: «Встань, моя любов, моя прекрасна, і йди. І я так і зробив»"
 ORE.104.a: "Любов сяє яскраво в темряві"

 ORE.105.t: "Суд над відомим злочинцем"
 ORE.105.d: "Хоча Чорна бригада Дірлеванґера старанно підтримувала свою репутацію найжорстокішої банди бандитів у Росії протягом останніх кількох років, конкуренція була жорсткою. Цього разу відомий злочинець із казахських степів був спійманий після того, як його люди спробували відступити після грабежу комуни на кордоні Орєнбурґа і Казахстану. Звичайних злочинців розстріляли, а ватажка бандитів схопили і відвезли до Орєнбурґа для суду. \n\nНаселення не було в захваті від ідеї публічного суду, адже гора доказів злочинів бандита змусила б почервоніти будь-якого адвоката. «Віддайте його народу, щоб він отримав справжню справедливість!» — скандує натовп за межами суду. Це не надто вплинуло на присяжних, які продовжують обговорювати його долю. Багато хто пропонує принизити бандита, перш ніж залишити його помирати голим у казахських степах. Публічне гниття цього чоловіка продемонструє силу правової системи Орєнбурґа і заспокоїть натовп щодо загибелі бандита. Інші висунули більш радикальну ідею: чому б не використати арешт цього знаменитого бандита для запровадження нової кримінальної системи? До цього першого в'язня можуть приєднатися всі майбутні бандити, яких ми захопимо, щоб вони провели решту свого життя, працюючи в кримінальній колонії за межами міста Орєнбурґ. Ця силова гра зміцнить уявлення про уряд Орєнбурґа як джерело справедливості та порядку і допоможе нам ще більше централізувати регіон, оскільки наш уряд накопичує більше влади та легітимності. Критики плану засуджують ідею залишити чоловіка живим, коли він не проявив жодного милосердя до своїх жертв. Винесення йому довічного ув'язнення, ймовірно, викличе заворушення на вулицях. З іншого боку, багато хто з присяжних погоджується, що якщо просто дозволити натовпу робити те, що він хоче, це зробить нас популярними в короткостроковій перспективі, але зашкодить нашим довгостроковим зусиллям щодо централізації правосуддя в наших судах."
 ORE.105.a: "В Оренбурзі править народ, і будь-хто, хто сумнівається в цьому правилі, може зіткнутися з гнівом народу"
 ORE.105.b: "Приниження покладе край його бандитській кар'єрі. Степи зроблять те саме з його життям"
 ORE.105.c: "Він спокутує свої злочини, проживаючи нудне життя і важко працюючи в нашій новій пенітенціарній системі"

 ORE.106.t: "Криза в комунах"
 ORE.106.d: "У всіх комунах зібрався розлючений натовп, який вимагав справедливості щодо надзвичайно суперечливого члена ради. Натовп заявив, що цей член ради активно намагався підірвати їхні права і повинен постати перед швидким і негайним судом. Хоча гнів проти члена ради є цілком реальним, ми не знаємо напевно, чи є він виправданим. З моменту свого вступу на посаду він був адекватним членом комуни. Однак, навіть за відсутності доказів, його методи добре відомі. Всякий раз, коли йому потрібно було просунути щось у Раді, він відвідував інших законодавців, щоб чинити на них тиск і переконатися, що вони підтримають його рішення. Він призначав деяких своїх близьких друзів на посади в комуні, незалежно від того, чи заслуговували вони на це. Ходять чутки, що в приватному колі він висловлював деякі реакційні думки, хоча ми не впевнені, чи це правда. У будь-якому разі, ми повинні вжити заходів. Деякі члени комітету вважають, що ми повинні дати йому легке покарання і відпустити. Інші вважають, що слід провести належний процес і відповідне розслідування. Деякі навіть виступають за самосуд. Але в кінцевому підсумку загальний консенсус такий..."
 ORE.106.a: "Йому слід дати другий шанс"
 ORE.106.b: "Комітет вирішить твою долю"
 ORE.106.c: "Нехай його покарають!"

 ORE.107.t: "Солдати без кордонів"
 ORE.107.d: "Невеликий загін увійшов до Орєнбурґа, махаючи білими прапорами, але все ще маючи при собі невеликий арсенал гвинтівок, кулеметів і гранат, реліквій старого Радянського Союзу. Оренбурзькі солдати, які супроводжували їх до міста, спочатку були здивовані, побачивши, що багато з них розмовляють російською з дивним, сильним акцентом, а деякі майже не розмовляють нею взагалі. Однак ці чоловіки були явно ветеранами, і коли стало зрозуміло, що вони не несуть ніякої загрози, з'ясувалося, що вони насправді були 1-м чехословацьким армійським батальйоном, або принаймні тим, що від нього залишилося. Ці солдати походили з однієї з країн, на яку нацисти першими накинулися, — Чехословаччини. Коли їхня країна була приречена на падіння, вони вирішили продовжити боротьбу з території Радянського Союзу, відступивши до Росії. Вкотре доля не була до них прихильною, адже вони знову були змушені розбігтися і відступити, коли Союз розпався під ударами Вермахту. \n\nОднак 1-й чехословацький батальйон відмовився здаватися — вони з гордістю носили свої кольори, коли в Росії запанувала анархія, і зрештою відступили в Урал, ставши блукаючою бандою найманців. Тепер, після років мандрів і боїв, вони нарешті дісталися Орєнбурґа, де просять лише притулку і постійного житла. В обмін на це вони запропонують свою військову експертизу для захисту міста від будь-кого, хто загрожуватиме йому. Багато хто висловив бажання прийняти їх з відкритими обіймами, як товаришів у боротьбі проти бандитів та інших загроз. Однак деякі вважають, що ці додаткові роти, які потрібно годувати, можуть бути занадто великим тягарем для і без того скрутної економіки Орєнбурґа, і що Уральська ліга в будь-якому випадку буде для них більш підходящим місцем. Нарешті, з'явилися кілька голосів незгоди, які натякають, що Орєнбурґ просто не може довіряти цим людям, які можуть виявитися нічим іншим, як бандитами під маскою."
 ORE.107.a: "Вони можуть приєднатися до наших лав!"
 ORE.107.b: "Нехай краще приєднаються до Ліги"
 ORE.107.c: "Цим людям не можна довіряти"

 ORE.108.t: "Слуга Чорної гори?"
 ORE.108.d: "Нещодавно навколо командира міліції міста Орєнбурґ Олександра Родімцева почали ходити тривожні чутки. З нізвідки на громадян Орєнбурґа навалилася параноя, і вони стверджують, що мають незаперечні докази того, що командир Родімцев працює під прикриттям Чорної гори, під жорстоким поглядом Магнітогорська. Коли запитують про докази цих тверджень, завжди відсилають до іншої людини, яка попереджала про зраду Родімцева. Хоча пасивне розслідування робить ці твердження абсолютно безглуздими, деяких все ж турбує, як такі чутки взагалі могли з'явитися. Можливо, хтось щось бачив, і, можливо, командир дійсно є подвійним агентом. Не було б зовсім абсурдним розпочати невелике, тихе розслідування, щоб перевірити діяльність командира Родімцева, але це може виявитися просто плітками поганого смаку."
 ORE.108.a: "Це смішно! Не звертайте уваги"
 ORE.108.b: "Можливо, нам слід провести розслідування"
 ORE.109.t: "Таємничі мандрівники"
 ORE.109.d: "Сонце сходило над полями Уралу, і Орєнбурґ тільки-но починав своє багате і жваве життя, коли велика група людей, оточена казахськими степовими конями, що тягли величезні вантажі іноземних багатств, прибула до воріт міста. Хоча вони були однієї національності, вони не були схожі один на одного. Деякі з них були одягнені, як німці чи балтійці, інші, незважаючи на слов'янську зовнішність, носили тюрбани та кафтани, а деякі навіть поєднували в своєму вбранні елементи західного та східного одягу. Вони розмовляли знайомою, але все ж незрозумілою мовою, і лише декілька з них говорили дуже простим російським з сильним шиплячим акцентом. Коли стало зрозуміло, що ці люди не хочуть заподіяти ніякої шкоди, їм дозволили увійти до Орєнбурґа. Екзотичні подарунки були роздані місцевим жителям за лічені години, але це не було тим, що цікавило мешканців Орєнбурґа в гостях. Вони хотіли дізнатися, хто ці люди і з якої країни вони приїхали. Як з'ясувалося, мандрівники прибули до Орєнбурґа з земель Західного Казахстану, але самі були польського походження. Як і Росія, Польща була розграбована німецькими загарбниками багато років тому, і багато польських синів і дочок були відправлені на смерть у замерзлі пустки Сибіру та пустельні степи Казахстану. Але Польща вижила. Гордий польський народ не піддався своїй долі і оселився поза межами досяжності Німеччини, будуючи нову надію для своїх родичів. \n\nПробувши деякий час у місті, польський караван залишив його після другої ночі і вирушив у невідомому напрямку. Незалежно від того, куди вони поїхали, іноземні мандрівники залишили найкраще враження на місцевих жителів, які співчували їхній сумній долі втратити домівку через іноземного кровожерного окупанта."
 ORE.109.a: "Удачі вам, мандрівники..."

 ORE.110.t: "Свято врожаю"
 ORE.110.d: "Минув ще один рік, і настав час святкувати. Велике свято врожаю наближається до Орєнбурґа! Щоосені, після завершення щорічного збору врожаю, мешканці міста та комун об'єднуються в радісному святкуванні, насолоджуючись плодами своєї праці. Це, здається, єдиний день, коли наша «нація» повністю об'єднується, єдиний день, коли ми забуваємо про свої проблеми та ненависть. У сьогоденні є своя краса, і сьогодні ми відкриваємо її заново. Цього року Свято врожаю обіцяє бути особливо пишним завдяки гарному врожаю. Крім того, міська рада Орєнбурґа погодилася надати фінансування та допомогу в організації. В результаті, майбутнє Свято врожаю буде найбільшим за всю історію, як за кількістю відвідувачів, так і за кількістю запропонованих страв. Очевидно, що люди дуже раді, багато хто з них за кілька місяців до свята залишають села і їдуть до міста Орєнбурґ, щоб підготуватися до святкування. Коли сонце заходить, лунають урочисті сурми; після короткої оптимістичної промови члена міської ради Орєнбурґа відкриваються ворота до свята. Минає лише кілька секунд, і натовп голодних селян рине до місця проведення свята, а радісні вигуки лунають на багато кілометрів навколо. Люди добре їдять, багато хто танцює до пізньої ночі, а багато хто спотикається після вживання алкоголю, який для них занадто міцний. Проте колектив в цілому дуже вражений подією, розглядаючи її як продуманий крок міської ради Орєнбурґа, і вже почав пожинати плоди цього успіху, оскільки його популярність серед населення зростає. Нація об'єдналася, хоч і лише на один день і ніч."
 ORE.110.a: "Не можу дочекатися наступного року!"

 ORE.111.t: "Маленков вимагає дій після відокремлення сіл"
 ORE.111.d: "Маленков був у великому шоці, коли села відокремилися від Орєнбурґа. Для нього це було найбільшою зрадою, коли він побачив відокремлення цих сіл. Всі ці роки він працював над побудовою комуни разом зі своїми товаришами, з якими іноді не погоджувався. Всі ці роки він докладав зусиль, щоб реформувати її разом із союзниками, які до нього зверталися. І всі ці роки він мріяв, що зможе повернути комунізм на батьківщину під сильнішим центральним правителем. Ця зрада розлютила його, і в гніві він пішов до залів Орєнбурґа і сказав решті своїх товаришів, що настав час централізації, щоб протистояти більшій нацистській загрозі"
 ORE.111.a: "Орєнбурґ потребує центрального керівництва, і він потребує його зараз"

 ORE.112.t: "Спровокований розкол"
 ORE.112.d: "На думку Олександра Бурби, сама ідея відокремлення сіл від Орєнбурґа і приєднання до Уральської ліги є лише симптомом провалу нинішньої моделі розвитку Орєнбурґа. Бурба вважає, що єдиний спосіб переконати ці села-сепаратисти залишитися в складі Орєнбурґа і навіть запобігти повторенню подібних випадків у майбутньому — це проведення агресивної кампанії реформ. Орєнбурґ не може існувати вічно в своєму нинішньому стані, і єдиний спосіб забезпечити майбутнє для всіх — це промисловий прогрес і належна організація держави. Орєнбурґ більше не може існувати як сукупність децентралізованих комун, які не можуть захистити себе як держава, а тим більше як група окремих комун. Переконання Бурби є причиною того, що він є однією з головних фігур серед реформаторів Орєнбурґа, і саме його ідеї можуть привести Орєнбурґ до майбутнього, яке витримає випробування і негаразди, з якими стикається вся розбита російська країна. Шкода втрачати ці села зараз, але втрата всієї нації буде справжньою трагедією."
 ORE.112.a: "Бурба, веди нас у майбутнє!"

 ORE.113.t: "Розкол партії"
 ORE.113.d: "Старий жарт говорить, що якщо зібрати двох оренбуржців, то можна знайти три доктрини; зібрати трьох — і можна знайти чотирьох зрадників справи; зібрати чотирьох — і партія розколеться. Виявляється, цей анекдот краще було залишити в тавернах і пабах Орєнбурґа, бо тепер він вибухово підтвердився в його Раді. Ліві сили в місті розпалися, коли дві угруповання, сформовані Бурбою і Маленковим, відмовилися від будь-яких зв'язків між собою, називаючи одне одного відступниками і руйнівниками єдності партії та марксистської ортопраксії. n\nСумною іронією є те, що партійна фракція, навколо якої вони спочатку об'єдналися, прагнула лише реформ; але в міру того, як обидві сторони все більше розчаровувалися одна в одній, визначення цих реформ розходилися до такої міри, що стали несумісними. Ринковий соціалізм Бурби і плани вільного промислового розвитку стали нестерпними для авторитарного марксиста-прихильника жорсткої лінії Маленкова, і навпаки. n\nЗараз вони відкрито змагаються за місце голови, а комуни спостерігають за цим з поєднанням жаху і зачарування. А в тиші угруповання розмовляють з сірими еміненціями і впливовими особами та готуються. Остаточна боротьба за чистоту революції розпочалася, і кожен з них рішуче налаштований на перемогу. Для іншого залишиться лише смітник історії."
 ORE.113.a: "Давайте намагатимемося уникати очікуваних жартів, товариші"

 ORE.114.t: "Пропозиція Маленкова"
 ORE.114.d: "Останнім часом Маленков подорожує по периферії сфери впливу Орєнбурґа, розмовляючи з місцевими лідерами та виступаючи перед комунальними радами. Ця невеличка поїздка по комунам має дуже чітку мету: об'єднати периферійні громади під керівництвом Маленкова, щоб він міг здобути більше влади. Він майже не приховує своїх амбіцій, але це не заважає багатьом серйозно розглядати його пропозиції. Маленков говорить про те, що союз покликаний сприяти співпраці між комунами. За його визначенням, співпраця — це взаємодопомога двох суб'єктів, а не експлуатація одного іншим. Отже, якщо ці села підтримають Маленкова, він так само швидко підтримає їх. Вони більше не будуть експлуатуватися Орєнбурґом, ні, Орєнбурґ буде служити їм! Ресурси та адміністрація «Перлини Уралу» будуть належати їм, і все це тому, що вони просто підтримали найкращого кандидата. Непогано, еге ж?\n\nХоча багатьох це спокусило, залишається побачити, наскільки ефективними виявляться зусилля Маленкова."
 ORE.114.a: "Схоже, він справжній чарівник"
 ORE.114.b: "Ми цінуємо його допомогу, але вона нам не потрібна"

 ORE.115.t: "Підтримка токенів"
 ORE.115.d: "Наступна стратегія Бурби для отримання підтримки в Оренбурзі полягає в тому, щоб вийти за межі самого Орєнбурґа і спробувати налагодити зв'язки з тими, хто живе в прикордонних районах Орєнбурґа. Бурба вірить, що якщо йому вдасться заручитися підтримкою прикордонних регіонів, його перемога буде незаперечною для таких людей, як Маленков. Однак Маленков починає діяти, коли Бурба залишає Орєнбурґ, щоб розпочати переговори з мешканцями околиць країни. Знову намагаючись підірвати будь-які дії Бурби, Маленков намагається заручитися підтримкою своїх прихильників у новій кампанії з дискредитації новоспеченого лицеміра Бурби. Маленков стверджує, що Бурба насправді зовсім не дбає про прикордонні громади, а також про людей, які проживають за межами міст. Він продовжує, кажучи, що Бурба представляє лише міста, обіцяючи полегшити їхнє життя та забезпечити їх усім необхідним, а сам їде в прикордонні регіони, щоб обіцяти їм солодкі обіцянки в обмін на допомогу в захопленні влади. Він радить прикордонним регіонам ігнорувати будь-які спроби Бурби заманити їх на свою сторону, а натомість обіцяє околицям, що саме він забезпечить їм безпеку та захист перед жорстокістю Росії. Значна частина підтримки обох кандидатів знаходиться за межами міст, і тільки час покаже, чи повірять вони словам того чи іншого."
 ORE.115.a: "Бурба підкуповує секретаря Маленкова"
 ORE.115.b: "Бурба задобрює прикордонні регіони"
 ORE.115.c: "Бурба мовчить"

 ORE.116.t: "Хабар"
 ORE.116.d: "Під стіл потрапила не надто велика сума, принаймні з точки зору уряду. Можливо, лише кілька десятків тисяч. Достатньо, щоб виконати роботу. Достатньо, щоб задовольнити старого секретаря. І це, безсумнівно, було того варте. Ніхто не міг цього терпіти. Ніхто не міг терпіти ще одного Бухаріна чи Ягоди. Проте Маленков це зробив. Навіть якщо розмова була приватною і стосувалася лише ідеї, він вимовив ці жахливі слова. Слова, які змушували всіх, хто старший за 30 років, тремтіти від страху перед минулими часами. Регрес на десятиліття назад не був великим кроком уперед у майбутнє. У комунізмі не було прогресу. Тільки занедбані будівлі та брехня. Фасад соціалізму для народу, створений Маленковим, був зруйнований, і все, що залишилося, — це зруйнований і гнилий фундамент. Старий комуніст назавжди пішов у минуле."
 ORE.116.a: "Хабарі показали народу правду, і нічого більше"

 ORE.117.t: "Чорт"
 ORE.117.d: "Наша благородна, невдячна робота з навчання народу про гріхи того диявола, Маленкова, була викрита. Секретар, якому ми, можливо, дали невелику суму, публічно оголосив про нашу таємну угоду. Народ не міг бути більш розлюченим. Лідер уряду, якому вони довірили владу, зрадив цю довіру і лише показав народу ще більше того, що вони зневажають. Навіть попри заперечення (і вибачення) Бурби щодо хабарів, протестувальники розбурхують місто та столицю Орєнбурґа. Вони вимагають демократії та заходів проти корупції. Ми покажемо їм демократію, як тільки вони спалять Маленкова. Що ще гірше, насправді важливі новини про одержимість Маленкова радикальною колективізацією були проігноровані і навіть відсвятковані!"
 ORE.117.a: "Це ж навіть не так багато грошей!"

 ORE.118.t: "Промахи Бурби"
 ORE.118.d: "Останнім часом Бурба наполегливо працював над тим, щоб перетягнути на свій бік прикордонні комуни, сподіваючись здобути ще одну базу підтримки та уникнути напруженості у відносинах із витривалими селянами. Він відправив послів до багатьох комун і навіть спробував відвідати декілька з них особисто. На жаль для нього, здається, що бажання співпрацювати з будь-якої причини не є взаємним, оскільки його відхиляють міста, які він намагається завоювати на кожному кроці. Незалежно від того, як сильно він намагається і що пропонує, здається, що вони налаштовані проти нього. Вони ніколи не будуть з ним співпрацювати, і, схоже, йому доведеться шукати прихильників і союзників в інших частинах союзу."
 ORE.118.a: "Більше щастя наступного разу, Бурба"

 ORE.119.t: "Третій варіант"
 ORE.119.d: "Нескінченна серія ударів і контратак з боку Олександра Бурби та Георгія Маленкова змусила чимало реформаторів відкинути обох і спробувати знайти власний шлях до модернізації Орєнбурґа, щоб він став таким, яким мав бути. Вважаючи, що ідея єдиного голови вже показала свої недоліки через жорстку конкуренцію між двома реформаторами, нова група реформаторів вже почала формувати значну підтримку в селах навколо Орєнбурґа. Ця віра з'явилася нізвідки, не маючи досі жодних прецедентів чи підтримки серед реформаторів, і викликає занепокоєння як у Бурби, так і в Маленкова. Для обох було б великим соромом програти фракції, сформованій їхніми власними конкурентами, а тепер у них з'явилася третя, зростаюча фракція, яка дихає їм у потилицю. n\nЦя ситуація стає ще більш критичною через те, що Бурба використовує свій економічний вплив, щоб ввести торгове ембарго на села — без рішучих дій багато хто побоюється, що вони почнуть голодувати."
 ORE.119.a: "Посилити ембарго"
 ORE.119.b: "Змінити межі сепаратистів"
 
 ORE.120.t: "Міста відрізані"
 ORE.120.d: "Ті бунтівні міста, які вирішили не виконувати накази Орєнбурґа, отримали фінансування від комуністичного диявола Маленкова. Однак його спроби завоювати прихильність міст повністю провалилися. Агент Маленкова був виявлений, коли він таємно виїжджав з Орєнбурґа і прямував до одного з міст з сумкою, повної готівки, в руках. Після того, як його затримала проїжджаюча лояльна міліція, чоловік проковтнув таблетку ціаніду і знепритомнів. Але сумка з грошима і лист, які він мав при собі, не зникли разом з ним, і вчора вранці їх оприлюднили. У них детально описувалися спроби Маленкова завоювати прихильність сепаратистських комун, вони були сповнені натяків на корупцію з боку провідних радників, навіть натякаючи на причетність самого Бурби до скандалу. Мішок з грошима, звичайно, теж не допоміг його справі. Зараз громадськість бурхливо реагує на Маленкова. Принаймні, з усього цього дипломатичного фіаско ми отримали одну хорошу річ."
 ORE.120.a: "Де, чорт забирай, він взяв ціанід!?"

 ORE.121.t: "Полегшення від Маленкова"
 ORE.121.d: "Як і побоювався Бурба, хитрий Георгій Маленков зумів підірвати його блокаду супротивних міст. Сподіваючись використати це проти Бурби і представити себе як кращий вибір, Маленков вважав за доцільне особисто перенаправити кошти в ці міста. Зробивши це підступним чином, щоб не бути спійманим, Маленков приніс допомогу містам, які були паралізовані облогою Бурби. Хоча їхня ідеологія, що протистоїть як Маленкову, так і Бурбі, і привела їх до цієї ситуації, ті, хто в містах спочатку підтримував Маленкова, почали використовувати це як можливість вплинути на третю фракцію, яка взяла під контроль міста. n\nУ цьому відношенні Маленков досяг успіху в підриві авторитету Бурби, і його надії залучити підтримку до свого блоку після цього можуть виявитися успішними. Незважаючи на будь-яку ідеологію, Маленков значно допоміг жителям глибинки Орєнбурґа, і задум Бурби може обернутися проти нього. Маленков задоволений своїм успіхом, залучивши третю групу за допомогою, а не інтриг."
 ORE.121.a: "Комуністичне фінансування, так?"

 ORE.122.t: "Успішна облога"
 ORE.122.d: "Задум Бурби змусити села підтримати його був успішним. Його торгове ембарго щодо сіл навколо Орєнбурґа змусило тих, хто не хотів ані Бурби, ані Маленкова, або дотримуватися своїх ідеалів... або обійтися без предметів першої необхідності. Коли почалася облога, їхні ідеї були підкріплені тим фактом, що і Бурба, і Маленков намагалися змовитися проти них, а не примиритися з ними, але з плином часу і вичерпанням запасів ідеологія, здавалося, втратила своє значення. Ті, хто в селах підтримував Бурбу, почали все голосніше і голосніше благати сільських голів припинити торгове ембарго, прийнявши Бурбу. \n\nВрешті-решт, ці села здалися. Повна ізоляція Бурбою цих віддалених сіл стала нестерпною для більшості їхніх мешканців. Бурба був задоволений, що його задум спрацював, не давши Маленкову часу знайти спосіб обернути ситуацію на свою користь. Тепер, в обмін на лояльність і підтримку його імені, Бурба знову дозволить цим селам торгувати з Орєнбурґом. Схоже, що прихильники реформ не готові йти на компроміси."
 ORE.122.a: "Вимоги Бурби стають все більш жорсткими"

 ORE.123.t: "Без їжі, без поставок"
 ORE.123.d: "Повне ембарго Бурби на Орєнбурґ та навколишні села з кожним днем стає все гіршим, але останній план Маленкова, спрямований на те, щоб перетягнути їх на свій бік, погіршив їхні проблеми настільки, що вони здалися йому. Маленков, у відповідь на тривале ембарго і ослаблення сіл, вважав за розумне раптово перекроїти кордони комун. Звичайно, коли комуни були перекроєні, села раптово втратили всі свої сільськогосподарські угіддя. Будь-що, що міг зробити Бурба, крім вбивства, раптом здавалося мізерним порівняно з тим, що Маленков відібрав у них все, заради чого вони жили. Напруга в селах швидко зростала, і ті, хто не підтримував нікого, не висловлювали голосно свою правоту, а тихо планували свої дії. Ті, хто підтримував Маленкова, раптом почали з новою люттю благати сільських лідерів підтримати Маленкова і покласти край самокатуванню. n\nІ так сталося, що сільські лідери пообіцяли підтримку Маленкову, який раптом побачив деякі серйозні помилки у своїх перекроєних кордонах. В обмін на підтримку своїх вимог Маленков мав пройти через важкі зусилля, щоб повернути їм їхні сільськогосподарські угіддя. Бурба міг тільки проклинати себе, коли вся низка сіл почала обіцяти підтримку Маленкову."
 ORE.123.a: "Маленков наближається до Орєнбурґа"

 ORE.124.t: "Промова Бурби"
 ORE.124.d: "Товариші! Громадяни! Сьогодні я звертаюся до вас, щоб обговорити численні біди, які принесли нам останні часи, оскільки наша нерішучість і невизначеність спричинили багато конфліктів і розбрату серед нашого народу. Я не знаю імен кожного з вас, я не знаю про вашу повсякденну роботу, про ваші сім'ї та ваше життя. Але одне я знаю напевно — жителі Орєнбурґа та комун заслуговують на краще! Їхні труднощі не повинні марнуватися через погано функціонуючий уряд, який ледь здатний забезпечити народ! У ці важкі часи може бути спокусливо прислухатися до обіцянок демагогів, які, викликаючи привидів старих ідеологій, не роблять нічого, крім як підбурюють до ще більшого насильства. Я кажу, що ми не повинні будувати нашу державу на ідеологіях, порожніх обіцянках і розмитих ідеалах — ми повинні будувати для народу, завдяки праці народу! Він вдихає і продовжує свою промову. Наше велике місто є домівкою для багатьох людей, які можуть привести народ до процвітання і миру. Ми є домівкою для інженерів, техніків, промисловців і вчених, які все своє життя працювали, маючи на меті лише благо Орєнбурґа і його громадян. Якщо так, то чому ми повинні дозволяти, щоб нашим урядом керували кліки політиків або нескінченні засідання, на яких нічого не досягається? Щоб створити стабільне, процвітаюче майбутнє, ми повинні покласти свою віру в найкращих і найрозумніших серед нас, які поведуть нас у нову еру. Світло нашого міста буде сяяти ще яскравіше, і незабаром ми станемо предметом заздрості всієї Росії!"
 ORE.124.a: "Він поведе нас до слави, давайте зробимо державний переворот!"
 ORE.124.b: "Він дійсно виглядає переконливим"

 ORE.125.t: "Бурба заарештований!"
 ORE.125.d: "Трагічна новина! Остання промова Бурби спричинила заворушення та сутички в місті, які зрештою переросли у повномасштабні заворушення. Коли прихильники Бурби зіткнулися з комуністами Маленкова, а також з натовпом цивільних осіб, які виступали проти обох політиків, ситуація переросла в масові сутички між трьома сторонами, які вирували на вулицях Орєнбурґа. Скориставшись хаосом, Олександр Бурба, здається, спробував взяти під свій повний контроль уряд, наказавши своїм найнадійнішим прихильникам штурмувати палац, де засідає Рада робітників. \n\nУ результаті сутички місцеві комунальні міліції та міська варта змогли захопити Бурбу та його людей зненацька і загнати їх у провулок, де їх масово заарештували. Хоча багатьох з них наступного дня було звільнено через переповненість єдиної в'язниці Орєнбурґа, репутація Бурби зруйнована, і, здається, його кар'єра політика закінчилася. Тим часом, зліва від нього, Маленков проголошує перемогу своєї сторони, стверджуючи, що він заздалегідь знав про переворот Бурби і діяв в інтересах жителів Орєнбурґа, щоб покласти край його «реакційному, фашистському божевіллю». n\nХоча деякі не довіряють радикальному марксисту, багато членів Ради, здається, вважають, що це точний опис подій, що відбулися, і навіть сільське населення висловило підтримку Маленкову за те, що він зупинив спробу правого крила захопити владу."
 ORE.125.a: "Хто міг це передбачити?"

 ORE.126.t: "Опозиція за ціну"
 ORE.126.d: "Георгій Маленков вирішив протидіяти зростаючому впливу Бурби, щедро винагородивши кількох ключових осіб, щоб вони розпалили бурхливі заворушення в самому центрі Орєнбурґа. Маленков вибрав одного чоловіка, палкого оратора і запального підбурювача, щоб той зібрав усіх, хто виступає проти поглядів Бурби. Маленков доручив їм оприлюднити свої скарги і запевнив, що вони можуть робити все, що забажають, аби тільки зменшити підтримку ненависного Олександра Бурби. Лідер страйку виконав те, за що йому заплатили, і зібрав велику юрбу, яка з криками і лайкою прорвалася до центру Орєнбурґа. Вони вже кидають цеглу і з ненавистю викрикують ім'я Бурби. Якщо ці заворушення продовжаться, вони стануть великим соромом для промислового магната. Коли вона закінчиться, Маленков, безсумнівно, зможе натякнути, що жодних заворушень від його імені не було. З цим він чекає новин про заворушення в Оренбурзі, сподіваючись, що вони добре підійдуть для його твердження."
 ORE.126.a: "Надішліть міліцію!"
 ORE.126.b: "Почекайте!"

 ORE.127.t: "Розгін бунтівників"
 ORE.127.d: "Марна спроба Маленкова протистояти зростаючому впливу Олександра Бурби була придушена. Бурба скористався своїм зростаючим впливом в Оренбурзі і наказав місцевим керівникам міліції покласти край бунту. Керівники міліції підкорилися, і міліцейські підрозділи швидко почали розгортатися, щоб зупинити бунт. Нещасливий протест не зміг протистояти раптовій військовій присутності і швидко почав розходитися. У хаосі той, кого Маленков підкупив, щоб розпалити напругу і розпочати заворушення, був переслідуваний і затриманий міліціонерами. Він може або помилувати лідера заворушень, що може бути сприйнято як жест солідарності та співпраці між людьми. З іншого боку, лідер заворушень може продовжити підігрівати напругу. Або ж Бурба може заборонити лідеру заворушень та його команді брати участь у політичній діяльності, усунувши таким чином небезпечного провокатора зі свого списку загроз і підвищивши власну популярність. Звичайно, така дія може бути сприйнята як тиранічна і непопулярна. Бурба залишається роздумувати над цією проблемою і врешті-решт вирішує..."
 ORE.127.a: "Помилувати лідера бунту"
 ORE.127.b: "Заборонити цьому бандиту займатися політикою"

 ORE.128.t: "Добрий до друзів, ще добріший до ворогів"
 ORE.128.d: "Розглянувши ситуацію з розгромленим бунтом і його лідером, Бурба вирішив, що найкраще буде продемонструвати добру волю і помилувати лідера бунту, звичайно, на очах у всіх. Бурба обов'язково звернувся до всіх присутніх, сказавши, що не буде переслідувати тих, хто вважає за потрібне протестувати, і що його опоненти не мають чого боятися, якщо — ні, коли — він прийде до влади. Лідер бунту, який був більше апатичним, ніж будь-чим іншим, щиро подякував Бурбі за те, що той не ув'язнив його за те, що для нього було просто високооплачуваною роботою. Найбільший страх Бурби щодо помилування цього чоловіка виявився абсолютно безпідставним, оскільки лідер бунту був мотивований грошима, а не справжніми політичними цінностями. Підтримка Бурби помітно зросла, оскільки багато хто усвідомив, що під його керівництвом їм нічого боятися, а також повірив у його обіцянки централізації та модернізації Орєнбурґа. Жителі Орєнбурґа навчаться співпрацювати та працювати разом під керівництвом Олександра Бурби, справжнього об'єднувача народу, який керує м'якою, але твердою рукою."
 ORE.128.a: "Справедливе керівництво"

 ORE.129.t: "Загасити підпалювача"
 ORE.129.d: "Бурба вирішив, що доля лідера заворушень в Оренбурзі має бути твердою і рішучою. Бурба з'явився в Оренбурзі перед затриманим лідером заворушень, щоб покарати його за істерику, і наказав привести затриманого на відкрите місце для винесення вироку. Бурба оголосив перед усім Орєнбурґом, що той, хто очолює страйк, та ті, хто пов'язаний зі страйком, будуть назавжди усунені з політичної арени. Вони більше не матимуть права голосу або впливу на рішення щодо майбутнього нації і відтепер будуть повністю виключені з засідань ради. Лідер страйку був просто щасливий, що його не покарали ще більше, і все ще тримався за свою виплату від Маленкова. Він прийняв вирок без суперечок, а Бурба був задоволений, що позбувся потенційного інструменту в руках тих, хто міг би протистояти йому на виборах. Оскільки так багато людей, які раптово виступили проти нього, були усунені з політичного життя, підтримка політики централізації та індустріалізації Бурби почала зростати. Важко було сказати, чи це було просто через зменшення опозиції, чи через те, що сила Бурби почала перемагати народ Орєнбурґа. У будь-якому разі, це була перемога для Бурби."
 ORE.129.a: "Істерику слід карати"

 ORE.130.t: "Рада горить"
 ORE.130.d: "Оплачений Маленковим бунт прийняв драматичний поворот! Хоча заворушення виникли з бажання зганьбити Бурбу, ганьба стала загальнонаціональною, оскільки бунтівники спалили будівлю Ради! Маленков, шокований жахливою новиною, схопився за голову, а Бурба проклинає свою нездатність зупинити заворушення, коли вони почалися. Лідери заворушень, мабуть, надто добре виконали свою роботу, зібравши натовп, який був надто буйним, щоб навіть спробувати його контролювати. Коли вони марширували вулицею, протестуючи проти промислових ідей Бурби та його переконань у централізації, один з учасників натовпу почав натякати, що саме Рада є найвищим символом централізації. Ті, хто виступав проти централізації, почали кричати на підтримку цього чоловіка, і все закінчилося бурхливим пожежею, яка знищила будівлю. Після підпалу будівлі заворушення швидко почали розходитися, щоб уникнути жорстокого переслідування за знищення важливої урядової будівлі. Громадяни не мають уявлення, кого звинувачувати в таких подіях, враховуючи, що протест був спрямований проти Бурби... але саме вплив Маленкова привів їх до цього. Шок і жах Орєнбурґа ось-ось обернуться проти одного з двох кандидатів, що змагаються між собою."
 ORE.130.a: "Ідеї Бурби спричинили це!"
 ORE.130.b: "Малинков наказав це!"

 ORE.131.t: "Малинков на марші!"
 ORE.131.d: "На світанку багато комун по всьому Орєнбурґу відокремилися і почали переговори з представниками Ліги. У відповідь на це Маленков вирішив вжити заходів. Він заявив, що нинішня адміністрація Орєнбурґа не здатна впоратися з цією кризою, і через це він вирішив взяти під свій прямий контроль міліцію. Маленков уже почав збирати міліцію, яка все ще лояльна до Ради робітників. Рада не змогла нічого вдіяти, крім як нарікати на зростаючий вплив Маленкова. Багато хто в комунах засудив ці дії, порівнюючи похід Маленкова з безглуздим руйнуванням Наполеона. Однак є й ті, хто погоджується з Маленковим, вважаючи, що це необхідно для захисту Орєнбурґа від зовнішнього впливу. Яку б позицію не займали, Орєнбурґ знаходиться на роздоріжжі."
 ORE.131.a: "Знищимо цих зрадників!"

 ORE.132.t: "Миттєве захоплення влади"
 ORE.132.d: "Малинков знав, що для об'єднання Орєнбурґа йому потрібно зробити міста більш залежними від нього, більш покладаються на нього і більш готовими прийняти необхідність об'єднання під керівництвом центрального лідера. Тому він взяв усі міста на свою зарплату, а незабаром оголосив про свої плани стати головою. Міста, які отримували від нього підтримку, всі здали йому своє автономне керівництво. Капітуляція цих міст в результаті продемонструвала Маленкова як явного фаворита на посаду голови в... і лідера комуни в нове майбутнє"
 ORE.132.a: "Це точно страшно"

 ORE.151.t: "Втеча"
 ORE.151.d: "Все почалося весняного дня. Давно, можливо, в уяві молодої жінки. Коли над нею пролітали бомбардувальники, вона сховалася в старому протиповітряному укритті, скорчившись у кутку, поки з неба падали дощ і вибухівка. n\nСаме там вона зустріла свою Світлану, яка ховалася від гніву Люфтваффе. Вона пам'ятала тепло, яке вони розділили в тому старому льоху, спочатку як екстрений захід. Тихі, слізні розмови, які вони намагалися продовжувати, коли пекло опустилося на поверхню над ними.\n\nЗ плином тижнів і розмиванням часу, коли бомбардування торкнулися сільськогосподарських угідь, вона зробила це своєю звичкою. Ховатися разом зі своєю новою подругою, подалі від світу. Обіймати її, поки земля була охоплена вогнем і забруднена вибуховими боєприпасами. \n\nЗрештою, вона зрозуміла, що це стало чимось більшим. Замість останнього засобу, той старий льох і жінка, яку вона вважала своєю подругою, стали чимось, чого вона прагнула. Ті ночі вони лежали на траві степу, її голова на грудях Світлани, дивлячись на незабруднені зірки над ними. Перший поцілунок, який вони обмінялися під м'яким місячним світлом, вона запам'ятає назавжди. Щось, що змусило її почуватися повноцінною, коли вона дивилася на зірки, що блищали в очах жінки, яка тепер була її коханкою. А потім це сталося. Крики, вигляд її власного батька, який тягнувся до хреста, закликаючи гнів Божий на неї. Коли вона бігла, тримаючись за руку зі Світланою, її очі ніколи не озиралися назад."
 ORE.151.a: "Орєнбурґ попереду. Позаду... Спогад"
 ORE.152.t: "Нелегальні біженці"
 ORE.152.d: "Найцікавіший випадок з проханням про надання притулку стався в місті Орєнбурґ рано вранці, коли дві молоді жінки в'їхали в місто, маючи при собі лише невелику сумку з речами. Згідно з процедурою, їх затримали як біженців для інтеграції та поселення. Однак за дві години за ними прибули троє міліціонерів, які вимагали заарештувати цю пару. Двох жінок мають заарештувати і притягнути до відповідальності за злочини проти природи, тобто за романтичні стосунки між собою. Ця ситуація поставила Раду перед цікавою дилемою, оскільки ідеали свободи, які ми заявляємо, що підтримуємо, суперечать традиційній моралі селянства. Це питання вже було винесено на розгляд Ради, і, здається, думки розділилися. Сільські громади піднімають великий галас з приводу цього «порушення природного порядку», тоді як реформаторська фракція, здається, розглядає це питання як справу особистої свободи. Коли дві втікачки сидять на лаві свідків, тримаючись за руки, щоб не втратити сили, здається, що їхня доля залежатиме від рішення Ради робітників."
 ORE.152.a: "Відтепер ми змінимо стару традицію..."
 ORE.152.b: "Віддайте їх. Це марна трата часу"

 ORE.153.t: "Життя і кохання"
 ORE.153.d: "І так вона пішла на свободу, далеко від гніву селянства.\n\nМісто було незнайомим місцем, суперечливим поєднанням сучасних квартир і старовинних магазинів та будинків із похилими дахами. Вони були обережними і не трималися за руки, коли йшли до свого житла на околиці бурхливо розвиваючогося міста — хоча слухання закінчилося на їхню користь, ставлення міських жителів до них було все ще невідомим.\ n\nЛише переступивши поріг, коли двері зачинилися, вона змогла обернутися і поглянути в очі своєї Світлани, ті прекрасні блакитні очі, які разом з нею витримали вирок Ради, не здригнувшись. Блиск тріумфу, здавалося, осяяв її кохану, і вона була впевнена, що Світлана бачить ту саму ауру навколо неї.\ n\nВони впали на єдиний диван у запиленій вітальні, і вона відчула, як рука Світлани пробігає по її волоссі, заспокоюючи її нерви краще, ніж будь-які ліки в місті.\n\nКвартира, надана комунальною службою, була маленькою і тісною, з єдиною спальнею і вітальнею, забитою до країв пошарпаним диваном і порожньою книжковою полицею. Пилюка засипала стіл. Але поки вона була тут, разом зі своєю коханою, це було все, що їй було потрібно.\n\nНарешті вони були вільні і разом.\n\nІ в глибині душі вона знала, що це було все, що мало значення."
 ORE.153.a: "І так, життя почнеться"

 ORE.154.t: "Разом до кінця"
 ORE.154.d: "Вони тулилися один до одного в кутку сінника в покинутій фермерській хаті. Зовні вони чули крики чоловіків, яких село послало за нею та її коханим, міліціонерів, які кликали ім'я Бога проти її «диявольства».\n\nНа більш примітивному рівні вони шукали притулку, щоб знайти розраду в думці, що, можливо, якщо вони не бачитимуть міліціонерів, то не зможуть їх вистежити після того, як вона втече з їхніх рук.\ Але на раціональному рівні вона знала, що це не так. Так чи інакше, її кохання буде відібрано у неї, чи то через смерть, чи то через насильницьке розлучення. І тому вона просто лежала там, підперши підборіддям голову Світлани, а її кохана плакала на її грудях. Вони наближалися. Їхні кроки були вже на ганку, і вона знала, що часу залишилося небагато, але не могла змусити себе рухатися. Коли двері почали відчинятися, вона притиснула до себе кохану жінку і заплющила очі. Перед очима промайнули спогади про життя, яке в них відібрали — їхня перша таємна зустріч, перший поцілунок, хвилювання від втечі до міста в надії знайти свободу. Це нагадало їй про першу ніч... бомби і бурю. Те життя тепер минуло... як сльози під дощем. Постріл пролунав по всьому будинку. А потім не залишилося нічого."
 ORE.154.a: "Дай йому відпочити"

 ORE.155.t: "Новий Орєнбурґ"
 ORE.155.d: "На стіл Ради робітників надійшов цікавий звіт. Згідно з нашими попередніми підрахунками, спостерігається зростання імміграції, але не з Уралу, а з сільських комун. Розслідування цього питання виявило його причину — судячи з усього, новина про результат конфлікту між Світланою Орловою, Анушкою Соколовою та кількома членами сільської громадської міліції поширилася завдяки чуткам, які завжди виникають, коли селяни заповнюють простір. n\nЗ того часу, як новина про це рішення поширилася, ті, хто не бажаний у традиційних сільських громадах, почали тяжіти до міста Орєнбурґ.\n\nЗвісно, як це зазвичай буває, це не сприяло нашій репутації серед селянських сіл, деякі з яких тепер називають нас «ямою буржуазної моралі», «декадентським вуликом» та іншими милими епітетами. До Ради вже було направлено кілька делегацій, щоб переконати її змінити свою думку з цього питання. Деякі з них вже з'явилися перед нами, звинувачуючи Раду в тому, що вона «тягне всю комуну вниз» своїми «дегенеративними цінностями». Хоча це ще не є справжньою проблемою, оскільки це більш-менш стандартна процедура, ми повинні стежити за гнівом селян, щоб він не поширився на інші теми."
 ORE.155.a: "Маяк у пустелі. Поки що"

 ORE.156.t: "Конфронтація"
 ORE.156.d: "Нарешті це сталося. Неминуча конфронтація між містом і комунами з питання про місто Орєнбурґ як притулок для тих, кого вважають небажаними в сільській місцевості. n\nЦе питання було піднято сьогодні вранці майже одностайним голосуванням західних комун, які заявили, що Орєнбурґ є тягарем для ідилічної аграрної моралі Комуни і повинен бути змушений скасувати рішення, прийняте майже півроку тому, у спорі Світлани Орлової та Анушки Соколової проти комунальної міліції Амбрамовки.\ n\nВідразу ж розгорілася палка дискусія, оскільки законодавці сперечалися про ймовірність відкритих лінчувань, втручання в кордони інших комун, надмірне розширення міста, «буржуазну мораль» та цілий перелік скарг. Однак загальний сенс був зрозумілий. Селянські комуни не були готові терпіти, щоб місто Орєнбурґ надавало притулок тим, кого вони вважали дегенератами та злочинцями. Реформістська фракція підняла галас з цього приводу, заявивши, що Орєнбурґ має таке саме право робити все, що забажає, у межах своїх кордонів, як і будь-який селянин, але поки що майбутнє виглядає невизначеним. Проти нас зібралася велика група, і ціна політичного капіталу, необхідного для захисту прав нової захищеної меншини міста Орєнбурґ, може виявитися вищою, ніж ми можемо собі дозволити..."
 ORE.156.a: "Ніколи! Те, що відбувається в наших кордонах, — це виключно наша справа!"
 ORE.156.b: "Ми мусимо зректися престолу"

 ORE.1561.t: "Вічна любов"
 ORE.1561.d: "Коли з далека надійшла новина про рішення Ради через газети та громадське радіо, вона зітхнула з полегшенням і витерла сльозу з ока.\n\nСвітлана лежала поруч, притуливши голову до підборіддя. Вона відчувала, як сльози текли з очей коханої і збиралися на її шкірі, сльози полегшення і радості. Їхня спроба знову зазнала поразки, і Орєнбурґ виправдав надії, які вони спочатку прагнули реалізувати.\n\nВона сподівалася, що тепер, коли спроба селян повернути її до їхнього застійного села знову зазнала поразки, їм більше не доведеться боятися. Їй не доведеться боятися арештів на вулиці з боку міліціонерів без розпізнавальних знаків або турбуватися, що її Світлана зникне, коли вона повернеться додому. Ні, вона нарешті могла вільно дихати. Вона так і зробила, видихнувши, коли напруга, що розривала її тіло, почала розсіюватися. Можливо, тепер їхні обійми знову стануть виразом близькості та інтимності, а не захисним обіймом. Нарешті безпека. Відчуваючи тепло коханої, що пронизувало її, вона прошепотіла щось, що могла почути тільки вона. «Дякую»"
 ORE.1561.a: "І це буде жити вічно"
 ORE.1562.t: "Сірий горизонт"
 ORE.1562.d: "Коли вона згадувала про це, лежачи в порожньому ліжку, вона майже точно знала, в яку секунду місто зрадило її. Вона клялася, що бачила це щоразу, коли виходила на вулицю, обертаючи голову, як розшукуваний злочинець, що шукає поліцію. Адже саме такою вона тепер і була. У будь-який момент вони могли прийти за нею, щоб заарештувати за злочин, який вона скоїла у своєму рідному місті Амбрамовка. Будь-який з перехожих, одягнених у вовняний одяг, міг бути торговцем або міліціонером з того проклятого місця, який прийшов, щоб відвезти її назад і поставити перед їхнім проклятим «народним трибуналом».\n\nЦей всеосяжний страх охопив і Світлану — вона ледве могла витримати, коли її коханий зникав з поля зору, знаючи, що єдине, що її захищало, зникло. Чи таке було її майбутнє? Стати відлюдницею, ховатися від людей, які мали б її захищати, зрадженою тими, хто давав їй стільки надії в минулому?\n\nВона не знала. З такою невизначеністю і страхом, що оточували її, все, що залишалося, — це любити свого коханого і сподіватися.\n\nБо надія була єдиним, що в неї залишилося."
 ORE.1562.a: "Знову в облозі"

 ORE.1563.t: "Зникаючи"
 ORE.1563.d: "У той момент, коли Світлана повернулася до квартири, яку вона ділила зі своїм коханим, вона зрозуміла, що сталося щось жахливе. Брудні чоботи, які Анушка ніколи б не взула, залишили сліди на зношеному килимі, який вона купила, щоб прикрасити маленьку вітальню.\n\nЖах осягнув її лише через мить, коли вона відчайдушно кликала ім'я свого партнера, розгублено озираючись навколо.\n\nНі. Це не могло бути правдою.\n\nВони забрали її, чоловіки з села. Іншого пояснення не було. Вони витягли жінку, яку вона кохала, до свого гнилого села, щоб судити її за злочин, що вона наважилася кохати її. Анушка... зникла. Вона ніколи не отримає розради, не зможе попрощатися чи поцілувати її на прощання. Лише дірка в стіні свідчила про її неминучу смерть. Минали дні, а вона механічно йшла на роботу в магазини, поверталася, щоб поїсти, і спала сама в ліжку, яке ніколи не було призначене для однієї людини. Тоді вона зрозуміла. Настала чергова стадія горя, наступний крок у жаху, в якому вона опинилася. Тут для неї нічого не залишилося, але, можливо, вона могла залишити слід деінде. n\nВона стиснула маленький пістолет, який купила для самооборони. Це буде для Анушки."
 ORE.1563.a: "Пекло не знає гніву..."
 ORE.1563.b: "Знайди краще місце"

 ORE.1564.t: "Вбивство в Амбрамовці!"
 ORE.1564.d: "До міста Орєнбурґ надійшла звістка про вбивство члена комунальної міліції в маленькому містечку Амбрамовка, комуні, розташованій неподалік від Орєнбурґа. Що саме сталося, невідомо, але за поточними повідомленнями, міліціонер Сергій Іванов потрапив у засідку озброєного бандита, коли повертався з міліцейського арсеналу до свого будинку в центрі міста. n\nБуло зроблено два постріли з цивільного пістолета малого калібру, один у груди, інший у плече. Не зумівши подолати нападника, він помер через кілька хвилин від кровотечі. Його родина закликала до справедливого покарання «божевільного бандита», який його застрелив, і в селі триває розшук. n\nСвідчення очевидців суперечливі — деякі описують нападника як жінку в селянському одязі, а інші клянуться, що це був хтось із бандитів бригади Дірлеванґера або позаслужбовий уральський гвардієць. Як завжди, здається, чутки значно затьмарять правду"
 ORE.1564.a: "Нещасний"

 ORE.1565.t: "На північ"
 ORE.1565.d: "І так, вона втекла з місця події, маючи при собі лише одяг, невелику сумку та пістолет.\n\nДорога була важкою, а повітря навколо неї холодним, коли вона втікала з міста, яке колись вважала своїм притулком. Однак вона змусила себе бути сильною, бо знала, що земля, яку вона шукала, буде ще суворішою.\n\nГодини перетворювалися на дні, вона пройшла через незліченні селянські села і нескінченні поля зернових. Пасовища простягалися вдалину, коли вона знову проходила через сільськогосподарські пустки, звідки втекла так давно.\n\nАнушка, це ім'я лунало в її голові, спонукаючи її рухатися на суворий північ. Вона зникла, і кожна клітинка її тіла прагнула повернутися на захід і помститися вбивцям, які забрали її коханого. Але вона знала, що це не її шлях. Її шлях був більшим, він лежав за межами Орєнбурґа. У цій рівнинній, брудній пустелі, вкритій зеленню і ненавистю, не залишилося нічого. Ні, її майбутнє лежало деінде. n\nПісля більш ніж тижневої подорожі, коли рівнини змінилися пагорбами, а дорога перетворилася на стежку вздовж скелі, вона знайшла його. Стіни гулагу тягнулися в небо перед нею, прожектори світили, як сонце на небі. Схопивши зброю, яку вона принесла з собою, вона підійшла до чоловіка в уніформі, який охороняв ворота.\n\n«Товаришу охоронець, я прийшла, щоб приєднатися до вас"
 ORE.1565.a: "Ліга чекає"

 ORE.1566.t: "Паранойя"
 ORE.1566.d: "Минули тижні, і обоє почали відчувати тягар поглядів людей, спрямованих на них. Вона навчилася повертатися додому з роботи в магазинах коротким шляхом, а не мальовничим, щоб уникнути ризику бути затриманою на вулиці. Світлана почала вішати кольорову тканину на одне вікно, якщо все було спокійно. Орєнбурґ, колись притулок, став майже сюрреалістичним кошмаром, повторенням таємничості, до якої вони були змушені повернутися в Амбрамовці. Вони більше не могли почуватися в безпеці, ходячи вулицями як розшукувані злочинці, — більше не могли вірити, що сусіди не зрадять їх за рубль чи буханець хліба. Страх і стрес починали виснажувати їх обох — Світлана все пізніше і пізніше лягала спати, а затишок, який вона знаходила в обіймах коханої, ставав дедалі більш швидкоплинним. Вона більше не могла ховатися з нею — вона боялася, що жінка, яку вона так любила, стає символом долі, яка чекає на неї, якщо вона зробить хоч один неправильний крок. Вони говорили про це одного разу, під тьмяним світлом свічки у вітальні. Слова були гіркими, і кімната здавалася все холоднішою, поки вони розмовляли увесь вечір. Холодний страх огортав зв'язки, що тримали їх разом, і вона вже не могла бути впевнена, що вони не розірвуться."
 ORE.1566.a: "Кінець наближається?"

 ORE.157.t: "Гіркий потік"
 ORE.157.d: "З південної комуни, де група товариша Бурби нещодавно допомогла запустити новий завод, надходять тривожні повідомлення. Жителі комуни заробляють на життя, вирощуючи худобу на скелястій землі, і вони звинувачують новий завод у скиданні токсичних відходів у річку. Не маючи іншого місця для напування худоби, село побоюється поширення все більшої кількості хвороб серед тварин.\n\nНа даному етапі про масштаби проблеми відомо мало. Це поганий знак для зусиль наших союзників-промисловців з фракції централізації. Якщо їхні зусилля з запуску нових промислових виробничих центрів за межами міста Орєнбурґ почнуть натрапляти на опір місцевих селян, наслідки можуть бути катастрофічними.\ n\nГотується екстрене засідання Ради, яке відбудеться, як тільки селяни та промисловці зможуть надіслати своїх представників. Кілька екологічних техніків з міста Орєнбурґ були відправлені для оцінки масштабів збитків. Ми нічого не можемо зробити, поки не отримаємо всю інформацію для спеціального засідання."
 ORE.157.a: "Як ми могли забути перевірити комуни, розташовані нижче за течією?"

 ORE.158.t: "Новий завод ставить під загрозу існування комуни"
 ORE.158.d: "Дані надійшли, і ситуація виглядає жахливою. Якщо новий завод не буде закрито, невелика комуна фермерів, ймовірно, втратить усе своє поголів'я тварин. n\nПредставник комуни, молодий чоловік в елегантному одязі, прийшов до Ради робітників і виголосив палку промову про збереження свого села. «Як Рада робітників може стверджувати, що вона представляє громадян Орєнбурґа, якщо вона дозволяє промисловцям отруювати цілі громади?» — запитав молодий чоловік у своїй палкій промові.\n\nНаступним виступив товариш Бурба. Холодна і виважена промова інженера була не менш красномовною у захисті промислового заводу. Кілька збіднілих селян і біженців з міста Орєнбурґ отримали можливість працювати і годувати свою громаду, працюючи на заводі. Сільськогосподарська продукція, вироблена промисловим підприємством, може поширюватися по всьому Орєнбурґу, щоб допомогти дрібним фермерам утримувати свої землі. Так, становище села є нещасним, і його громадянам слід допомогти в ці важкі часи. Але хід прогресу не можна зупинити. У промові Бурби не було сказано про політичні наслідки поступки маленькій громаді в наших зусиллях централізувати Орєнбурґ. Агенти фракції централізації поширили інформацію серед симпатизуючих радників, сподіваючись допомогти їм прийняти «правильне» рішення."
 ORE.158.a: "Завод повинен продовжувати працювати"
 ORE.158.b: "Орєнбурґ не може бути побудований на трупах своїх сіл!"

 ORE.159.t: "Кладбище"
 ORE.159.d: "Хлопчик провів день, повертаючись до старого села, щоб пошукати забуті дрібнички. Звуки вітру і води були його єдиними супутниками в дорозі, але юнак не звертав на них уваги. Холодний вітер кусав його оголену шкіру, а отруйна вода річки дратувала його під час довгої подорожі.\n\nСело стояло тихо, всі його мешканці переселилися вище за течією, ближче до проклятої фабрики товариша Бурби. Промисловець не дав селянам померти з голоду; чоловікам запропонували хорошу роботу в бурхливо розвиваючомуся промисловому місті, а жінки обробляли нові ділянки землі, щоб прогодувати свої сім'ї. Тепер молодь мала доступ до школи, де вони вивчали найрізноманітніші предмети. Але для самотнього хлопця нічого з цього не мало значення. Він сумував за старими часами, коли вітер складав йому компанію на рівнинах з його тваринами, а річка втамовувала спрагу звірів. Будинки села були покинуті. Залишки зниклої громади. А на рівнинах лежали кістки тварин, отруєних новим майбутнім Орєнбурґа."
 ORE.159.a: "Прогрес, але якою ціною?"

 ORE.1600.t: "Угода з фермерами"
 ORE.1600.d: "Олександр Бурба, незважаючи на всі свої недоліки, є прагматичною людиною. Побачивши, що Рада робітників відмовляється дозволити його фабриці знищити комуну, реформатор вступив у дію. Незабаром представнику фермерів і Раді було запропоновано нову, більш прийнятну угоду. Зменшивши виробництво фабрики навесні та влітку, коли худобу виганяють на пасовища, рівень забруднення річки можна знизити до безпечного рівня. Експерти промисловця зараз наполегливо працюють над аналізом потреб комуни у воді та пошуком місць, де можна пробурити нові свердловини в водоносному шарі. \n\nЦе допомогло закріпити репутацію Бурби як людини, здатної до компромісу та емпатії, але не надто вплинуло на ідею, що майбутні плани індустріалізації повинні враховувати потреби кожної комуни. Багато промислових проектів, очолюваних централізаторськими фракціями, зараз призупинені до завершення досліджень впливу на навколишнє середовище. На рівнині худоба комуни почала відновлювати своє здоров'я. Селяни можуть тільки сподіватися, що нові джерела води будуть побудовані швидко."
 ORE.1600.a: "Політика — це мистецтво можливого"

 ORE.161.t: "Світле майбутнє завдяки електричному освітленню?"
 ORE.161.d: "Старі чоловіки та недосвідчені молоді технічні фахівці, які обслуговують занедбану електричну систему міста Орєнбурґ, ретельно доглядають за електростанціями, лініями електропередач та перетворювальними станціями. Без заводів мало що можна виготовити з нових компонентів. Як результат, утримувач системи може лише спостерігати за постійним зниженням рівня виробництва електроенергії. \n\nОднак сьогодні сталося несподіване: у всій системі відбувся стрибок напруги! Здивовані інженери швидко перенаправили надлишкову енергію, щоб зберегти крихку інфраструктуру, а техніка відправили повідомити про це промислових експертів міста. Інформація швидко поширилася по ланцюжку до Бурби, Маленкова та інших членів фракції централізації та індустріалізації Ради. Коли було підтверджено, що енергії дійсно більше, ніж зазвичай, кілька вершників було відправлено в сільську місцевість для розслідування. Доки джерело цієї нової енергії не буде відоме, технічні експерти міста можуть лише чекати і спекулювати. Можливо, стару електростанцію ГРЕС відновили амбітні селяни? Або ж вищі, ніж зазвичай, опади спричинили збільшення потужності західної гідроелектростанції? Можливо, десь було пошкоджено лінію електропередачі, через що до міста Орєнбурґ надходило більше електроенергії? Тільки час покаже. Принаймні, на даний момент наші громадяни можуть насолоджуватися новинкою — читанням у вечірній час за допомогою електричного освітлення."
 ORE.161.a: "Нехай інженери припинять робити ставки на це і повертаються до роботи"

 ORE.162.t: "Нове життя для старої електростанції?"
 ORE.162.d: "Повідомлення надійшли! Невелика теплова електростанція на північному заході міста Орєнбурґ була частково відремонтована групою підприємливих селян з сусідньої комуни. Все почалося, коли місцевий хлопчик, досліджуючи занедбану споруду, впав у калюжу стоячої води. Побивши свого сина за те, що той заблукав у таке небезпечне місце, батько хлопчика сам оглянув будівлю. Чоловік пригадав якесь нечітке пояснення свого кузена про роботу електростанції, коли вона була побудована перед війною. Наш герой дійшов висновку, що найбільшою проблемою електростанції було те, що вся вода мала бути в трубах, а не на підлозі. Після ремонту водопровідних труб він і його односельці знову увімкнули піч і закинули в неї біомасу. Електрики зі столиці були одночасно розважені цією історією і жахнуті тим, що група селян залишилася керувати важливою частиною довоєнної технології. Однак люди, яких ми відправили для розслідування, категорично стверджують, що горді селяни наполягають на тому, що вони можуть чудово керувати електростанцією. Вони також вказали нашим співробітникам, що ми не приділяли жодної уваги цій маленькій електростанції, поки її не відремонтували. Наші запевнення, що ми просто забули про її існування, залишилися непочутими. Деякі більш запальні члени Оренбурзької міської ради запропонували просто відсунути селян убік і залучити до управління станцією дорослих. Але це не буде популярним рішенням у Раді робітників. Це, безумовно, не допоможе репутації міста Орєнбурґа як міста жадібних негідників."
 ORE.162.a: "Захопити завод"
 ORE.162.b: "Нехай розважаються"

 ORE.410.t: "Дефіцит продовольства в містах!"
 ORE.410.d: "Цього тижня черги за пайками довгі. Не те щоб черги не були щорічною проблемою в суспільстві, керованому соціалістичними диктатами та нечутливими виробничими ланцюгами, але черги за їжею є надзвичайно довгими для цієї пори року; декілька торговців та робітників помічають цю аномалію і швидко відкидають її, вважаючи, що це просто збій у роботі Гільдії фермерів або проблема з транспортом. Мало хто з радників помічає це, а ще менше хтось переймається тим, що не входить до їхньої безпосередньої компетенції і не приносить грошей у їхні кишені. Висуваються половинчасті заходи, які ввічливо вислуховують і відкладають на потім. Спочатку в одній черзі, потім в іншій, час очікування надзвичайно подовжується: півгодини, потім дві години, шість годин, день, два дні. Натовп стає неспокійним, вимагає відповідей від спітнілих бюрократів, які не мають що відповісти. Зрештою, одна черга повністю розпадається і кидається на непідготовлених міліціонерів, які охороняють місцевий продовольчий склад, перемагаючи їх, і там вони знаходять правду. \n\nТочніше кажучи, вони нічого не знаходять. Абсолютно нічого. Склад порожній, не залишилося навіть сніп ячменю. До кінця тижня ця сцена повториться кілька разів у місті, яке починає помічати шрами на своєму обличчі, травми, які воно пережило. А в сільських комунах годинники тикають, спостерігаючи, як руйнується джерело існування фермерів, їхні сім'ї та комуна в цілому. Смерть готує свою косу. Скоро настане час жнив."
 ORE.410.a: "Ми маємо щось зробити — будь-що!"
 
 ORE.420.t: "Голод набирає обертів!"
 ORE.420.d: "Як затягуюча мотузка, нестача їжі стискає горло комун. Ходять чутки про заворушення, грабежі, захоплення всього, що можна захопити, перш ніж слабкість унеможливить будь-які рухи. Члени Ради збирають свої сім'ї і готуються до імпровізованого виходу в сільські комуни. Можливо, серед полів буде безпечніше; адже Орєнбурґ, позолочена лілія Уралу, починає в'янути, і комахи ось-ось накинуться на нього. Можливо, за межами міста життя буде безпечнішим. За відсутності аграрних реформ, крах зародився в сільських господарствах і селах. Тепер гнів у очах селян вибухає насильством, коли система, побудована на їхніх плечах, ковзає і розсипається в бруді. Заворушення, контрзаходи, повстання. Комуни відриваються від вмираючого вулика міста, але тепер виявляються так само безсилими перед катастрофою, яка їх чекає. Деякі готують екстрений переїзд до міст; там мало їжі, але, можливо, люди будуть захищати одне одного, адже хлібні кошики комуни вже не є кошиками, а гострими пастками. Можливо, за межами буде краще. \n\nІ з кожним днем комуни слабшають ще трохи, борються ще менше, а мотузка затягується ще трохи. І жахливий театр Оренбурзьких комун триває."
 ORE.420.a: "Боже, допоможи нам. Хто-небудь, допоможіть нам..."

 ORE.430.t: "Голод у сільській місцевості!"
 ORE.430.d: "Результати плану індустріалізації, здається, збирають новий урожай серед населення, цього разу також і в сільській місцевості. Голод, який почався як порівняно незначний дефіцит продовольства в містах, переріс в епідемію голоду серед сільських фермерів.\n\nВже зараз «реформована» Рада робітників Маленкова намагається вжити заходів проти цього голоду, повертаючи землю і збільшуючи квоти в колгоспах. Дехто вважає, що під пильним наглядом Оренбурзької гвардії над фермерами криза скоро закінчиться"
 ORE.430.a: "Я не можу згадати, хто живий, а хто ні!"
 
 ORE.440.t: "Збільшення продовольчого забезпечення"
 ORE.440.d: "Кількість голодних шлунків помітно зменшилася. Щодня селяни, працюючи понаднормово, привозять до міста тонни основних культур для переробки та розподілу. Батьки, які колись мусили жертвувати власною їжею заради своїх дітей, тепер щовечора з радістю діляться ситним обідом зі своїми хлопчиками та дівчатками. Хоча деякі бідні чоловіки та жінки все ще можуть турбуватися про безпеку ситуації, здається, що ми скоро вийдемо з голоду і досягнемо нових висот! Що ще важливіше, вище командування нашої скромної держави більше не намагається будь-що-будь пом'якшити кризу. Швидка реакція на боротьбу може бути тим поштовхом, який нам був потрібен в очах громадськості; місцеві газети проголошують ефективність Ради робітників та спрощеної фундації соціального забезпечення, створеної в результаті голоду. Навіть зараз триває розширення соціального забезпечення для більшої кількості селян і фермерів. Те, що колись було винаходом міста, розправляє крила. Наші товариші за межами міських агломерацій отримають полегшення в результаті одного з найбільших оновлень, які Орєнбурґ коли-небудь бачив!"
 ORE.440.a: "Вперед!"

 ORE.450.t: "Голод спадає"
 ORE.450.d: "Коли сонце сходить над засніженими Уральськими горами і настає ранок у метушливому центрі Орєнбурґа, тисячі людей вишиковуються в чергу за мізерною їжею. Сиві ветерани, які жебракують на вулицях, порівнюють державні пайки з їжею, яку їм давали під час голоду в Сталінграді: старий хліб і холодний суп. На жаль, хліб не може черствіти. Його склад із шматочків пшениці та тирси означає, що він залишається сухим і несмачним. На щастя, у міру того як наша країна виходить із вогких надр голоду, купи деревної золи та інших неїстівних відходів, які зазвичай псують нашу їжу, замінюються борошном і дріжджами. Черги до супових кухонь і державних пунктів допомоги при стихійних лихах, що тягнуться через квартали, стають помітно коротшими. Зусилля уряду здешевити продукти харчування, заповнивши ринки запасами, підготовленими на випадок такої ситуації, а також знизивши тарифи з Уральською лігою, означають, що і селяни, і містяни не так переймаються, коли змушені шукати їжу, щоб нагодувати сім'ю. Бездомні жебраки, які заполонили вулиці Орєнбурґа і які найбільше постраждали від голоду, отримали значну допомогу від розширених урядових програм соціального забезпечення, а профспілки боролися за підвищення заробітної плати в умовах голоду. Нестача їжі, яка охопила наші шлунки, гаманці та промисловість, нарешті припиняється"
 ORE.450.a: "Життя триває"

 ORE.460.t: "Кінець голоду"
 ORE.460.d: "У кожній газеті, по радіо, через систему гучномовців та на плакатах Рада робітників голосно проголошувала свою найбільшу на той час перемогу: голод закінчився. Звичайно, офіційно. Майже ніхто не бореться за те, щоб знайти пристойну їжу, а деяке м'ясо навіть повертається в раціон тих, хто не настільки щасливий, як найбагатші. Попит досяг найвищого рівня за всю історію, сільське господарство процвітає, а підприємства харчової промисловості наймають все більше працівників. Голова Георгій Маленков подбав про те, щоб і Рада робітників, і він сам отримали достатню заслугу за подолання кризи. Той факт, що криза була частково спричинена неправильним управлінням ресурсами Радою, був прихований під килимом. Так само, як сонце яскраво світить на полях Орєнбурґа, так само яскраве і майбутнє."
 ORE.460.a: "Наші шлунки повні!"

 ORE.100.t: "Оренбурзька робітнича держава в 1962 році"
 ORE.100.d: "Регіон навколо міста Орєнбурґ, на щастя, уникнув анархії, спричиненої агонією Радянського Союзу. Не маючи великих промислових центрів чи природних ресурсів, села регіону могли вільно повернутися до первісного способу життя, зосередженого навколо землі, сім'ї, церкви та села. З часом місто Орєнбурґ почало ставати нейтральною територією, де селяни та робітники регіону могли мирно вирішувати свої питання. Саме місто, яке в основному уникло терористичних бомбардувань Люфтваффе, змогло вільно розвивати міцну доіндустріальну економіку ремісників і торговців. Селяни, які приїжджали до міста для переговорів із сусідніми селами, почали обмінювати надлишки врожаю на інструменти та товари, зміцнюючи відносини між Орєнбурґом та сусідніми містами і селами. Незабаром почали поширюватися чутки про оазу на південь від Уралу, вільну від хаосу російських держав. Однак у молодій робітничій державі не все гаразд. Комуни регіону ніколи не прагнули до більш тісних зв'язків з міською радою Орєнбурґа, проте їхні посилені економічні та дипломатичні зв'язки призвели до створення регіональної ради робітників, де регіональні питання могли обговорюватися відповідно до демократичних принципів. Цей вибір організації «знизу вгору» знищив будь-яку надію на появу сильного об'єднаного регіонального уряду, оскільки будь-який проект або пропозиція повинні отримати майже загальну згоду від незалежних сільських комун. Зараз діяльність за межами кордонів Орєнбурґа піддає крихку політичну систему випробуванню на міцність. Постійно зростаючий потік біженців з Уралу та казахських рівнин тягне місто Орєнбурґ на межу голоду. А причини цього хаосу незабаром досягнуть самого робітничого держави, оскільки за кордонами чатують армії зовнішнього світу... Не маючи можливості навіть організувати регіональну армію з сукупності міліцій та комун, Рада робітників побоюється, що один з останніх безпечних і процвітаючих регіонів Росії знаходиться на межі прірви"
 ORE.100.a: "За комуни! І за Орєнбурґ!"
 
 ## CORRUPTION CHAIN ##
 
 ORE.900.t: "Чутки про корупцію в раді"
 ORE.900.d: "Чутки є невід'ємною частиною політики Орєнбурґа. Майже кожен новий закон нагадує айсберг; більша частина фактичної політичної ваги будь-якого нового законопроекту прихована в кулуарних переговорах різних партій, а комуни залучаються до законопроекту шляхом компромісів і особистих дружніх стосунків або суперництва між різними представниками. Витоки інформації про такі угоди часто використовуються для того, щоб звільнити представника від непопулярного рішення або просунути інтереси іншого члена ради. Цього тижня в Оренбурзі та сусідніх комунах поширювалася особливо шкідлива чутка про корупцію під час відбору членів нового комітету з питань сільськогосподарської політики. Посада в такій важливій раді може значно сприяти кар'єрному зростанню людини. Без сумніву, ця неприємна новина, яка просочилася від когось, хто був розлючений тим, що не зміг купити собі місце, викликала натовп розлючених протестувальників, які вчора увірвалися до Ради робітників. Хаос, що виник, зірвав засідання і затримав роботу сільськогосподарського комітету. Ще більше часу було втрачено, коли пропозиція перевірити всі рахунки зустріла звинувачення в марнуванні часу на безглузді чутки замість сільськогосподарських субсидій. Це, в свою чергу, викликало зустрічні звинувачення в тому, що вони є частиною тих, хто купив свої посади. Члени нашої політичної фракції обговорювали чутки про корупцію після закінчення сесії. Дослідивши лабіринт взаємовідносин та інтересів у Раді робітників та комунах, було зроблено досить переконливі висновки щодо осіб, відповідальних за весь цей безлад. Хоча знання винуватців є корисним кроком, зараз у нашій партії точиться запекла дискусія щодо того, як найкраще реагувати на цю корупційну суперечку, яка шкодить нашому уряду."
 ORE.900.a: "Це недобре"
 ORE.900.b: "Абсолютно неприйнятно!"
 ORE.900.c: "Контрпродуктивно"
 
 #Мал#
 ORE.901.t: "Відстрочка виконання вироку?"
 ORE.901.d: "Голова Маленков — щедрий чоловік, і він відомий тим, що час від часу закриває очі на невелику корупцію серед своїх підлеглих, якщо вона проходить через відповідні канали і не надто погіршує ефективність Ради робітників у реалізації його реформаторських проектів. Однак політична нестабільність, спричинена чутками про корупцію, призвела до неприємних затримок у реалізації його проектів. Зараз голова планує кілька прикрих нещасних випадків для підозрюваних членів ради. Один із учасників приватної зустрічі ризикнув викликати гнів свого боса, запропонувавши проявити милосердя до членів ради. Корумповані місцеві представники відіграють важливу роль в екосистемі Ради, оскільки вони забезпечують легко куплені голоси з різних питань. Залишивши підозрюваних живими і натякнувши, що їхнє подальше здоров'я залежить від того, чи будуть вони і надалі слідувати вказівкам голови, ми зможемо зміцнити наш контроль над Радою. Звичайно, якщо бос дійсно хоче їх усунути, ми можемо задіяти для цього звичайних головорізів, наполягає інший радник. Повідомлення решті членів Ради, що корупція є смертним вироком, налякає їх і дасть зрозуміти населенню, що голова піклується про них. Іншим членам Ради, звичайно, нагадають, що доки вони сплачують внески товаришу Маленкову, їхні додаткові доходи можуть залишатися незмінними."
 ORE.901.a: "Корупція (в основному) не може бути терпимою. Вбийте їх"
 ORE.901.b: "Трохи милосердя нікому не зашкодить. Ми їх пощадимо"

 #Purge
 ORE.902.t: "Зникнення корупції"
 ORE.902.d: "Життя в сучасній Росії небезпечне. Чоловіків і жінок часто вбивають з найпростіших причин: за тижневу зарплату, хорошу пару взуття, буханець хліба... До цієї нещасної злочинності слід додати прості нещасні випадки, оскільки населення живе і працює в напівзруйнованих радянських будівлях, які майже не ремонтувалися з часів падіння Москви. Навіть такий спокійний регіон, як Орєнбурґ, не уникнув цих важких часів. Нещодавно надійшла новина про те, що бандити влаштували засідку на депутата, коли той повертався до своєї комуни. Смерть популярного політика від рук бандитів так далеко вглиб Орєнбурґа викликала нові дебати про необхідність військових і безпекових реформ. Смерть цього слуги народу поповнила список нещасних випадків. Кілька найвідоміших членів Ради загинули жахливою смертю протягом останніх тижнів. Один загинув у дивній аварії, пов'язаній з чайником і пляшкою промислового мастила. Інший мирно помер уві сні. n\nЗвичайно, не всі чоловіки закінчують свої дні в центрі уваги громадськості. Багато хто з членів Ради робітників просто повертається до своїх віддалених комун і більше про них ніхто не чує. Навіть у найкращі часи спілкування є складним, а зараз, з огляду на загрозу з боку зовнішнього світу, багато сіл просто не відправляють нових представників до міста Орєнбурґ.\n\nЦі вакансії в Раді були заповнені в результаті нового раунду регіональних виборів. Старі кандидати з часом зникли з поля зору громадськості. Це були просто чергові імена на обертових дверях Ради. Чи були вони коли-небудь членами Ради? Архівісти Ради іноді бувають дуже недбалими. На щастя, це поклало край корупційному скандалу, оскільки нові кандидати були обрані на свої посади чесно і справедливо. Таким чином, доля перетворила джерело розбрату в Раді на ще одну добре організовану ланку нового уряду голови Маленкова."
 ORE.902.a: "Кого знову звинуватили в корупції? Я не стежу за політикою"
 
 ORE.905.t: "Пробудження від поганого сну"
 ORE.905.d: "Погані спогади про корупційний скандал поступово зникають. Здається, ніби Орєнбурґ і його жителі прокидаються від поганого сну, в якому підступний чоловік перетворив робітничу демократію на інструмент для особистого збагачення.\n\nСильна база підтримки голови Маленкова в Раді нещодавно поповнилася багатьма новими членами. Друзі та соратники колишніх членів сільськогосподарської комісії, які пішли з посад, стали особливо активними членами коаліції голови. Дійсно вражає лояльність, яку викликає мудрий батько Орєнбурґа, коли його нові прихильники підбадьорюють його в Раді робітників. Але так само, як зникли жахливі чутки про корупцію, почали поширюватися нові чутки про страх і залякування в Раді. Почали з'являтися розповіді про кількох колишніх членів Ради, яких розчинили в кислоті або забили до смерті на очах у їхніх родин бандити. Але і ця чутка зникла. Робітнича демократія, що гниє зсередини від погроз і насильства? Все це влаштував голова Маленков? Жоден розсудливий громадянин не повірить у таку історію, не кажучи вже про те, щоб розповсюджувати її серед інших. Ні, так само як ранкове світло проганяє погані сни, так і головування Маленкова принесло в Орєнбурґ новий тип політики. Маючи так мало приводів для суперечок, члени Робітничої ради більше не вдаються до сумнівних закулісних політичних ігор, щоб ухвалити закони. Вони просто подають свої ідеї голові Маленкову на затвердження. Таким чином, немає шансів, що просочаться нові чутки про корупцію."
 ORE.905.a: "Новий тип політики"

 #Scare
 ORE.903.t: "Етична політика голови Маленкова"
 ORE.903.d: "Голова Маленков сьогодні поклав край дебатам про корупцію, проявивши свою звичну точність і політичну проникливість. Членам Ради було зачитано нову етичну політику. Громадяни в аудиторії кивали головами на знак схвалення, коли голова Маленков закликав членів Ради зберігати пильність щодо корупції в політиці Орєнбурґа. Нова команда реформованого комітету з питань суспільної моралі отримає повноваження виявляти корупцію та викорінювати тіньові угоди серед представників. \n\nЧлени Ради сиділи без заперечень, коли їм було нав'язано новий набір правил. Вперше ніхто не спробував підвестися і заперечити явне втручання голови в права своїх колег-членів Ради. Зміст промови вже був пояснений їм через неофіційні канали. Наслідки провалу в розслідуванні корупції також були пояснені. Мудрий голова знає, що робітнича демократія Орєнбурґа ніколи не повинна бути заплямована корупцією. Громадяни також не повинні знати про брудні трюки, які використовуються для збереження чистоти політики. Один із підозрюваних у корупційній справі був помітно відсутній у залі, оскільки напередодні впав зі сходів. Голова Маленков, звичайно, знайшов час, щоб відвідати чоловіка в лікарні і побажати йому швидкого одужання. Коли промова нашого лідера перед Радою нарешті закінчилася, чимало членів ради підвелися, щоб аплодувати йому. Оплески тривали трохи занадто довго, особливо серед друзів нещасного травмованого члена ради."
 ORE.903.a: "Голова Ради — ворог корупції!"
 
 ORE.904.t: "Сльози на прощання"
 ORE.904.d: "З важким серцем голова Маленков зачитав жителям Орєнбурґа та членам Ради листи тих, хто вийшов із складу Ради робітників через свої минулі провини. n\nЗміст листів різнився від людини до людини, але всі вони детально описували сором і горе, які вони відчували за те, що взяли брудні гроші. Як вони могли брати участь у підлому оскверненні великої робітничої держави Орєнбурґа? Кілька чоловіків висловили надію на прощення, але заслуговували лише на презирство за те, що встромили ніж у спину кожному громадянину Орєнбурґа. n\nПід потужним голосом голови ради прокотилися шепоти, а гнів і занепокоєння натовпу зростали і розбивалися великими хвилями. Обличчя кількох членів ради зблідли від жаху, коли їх назвали змовниками. Час від часу охоронці витягали підозрюваних під оплески натовпу. Декільком винним членам ради дали можливість захиститися на трибуні між листами. Більшість скористалася цією нагодою, щоб зі сльозами на очах зізнатися у своїх злочинах. \n\nНаприкінці дня, коли все було сказано і зроблено, після того, як Рада завершила засідання, чоловіки і жінки міста Орєнбурґа висипали на вулиці. У великих і малих будинках обговорювали цей слізний день, а мешканці міста висловлювали своє обурення корупцією друзям і родичам. Але разом із гнівом відчувалася і якась емоційна катарсис. Задоволення, викликане видом жалюгідних шахраїв, які благали голову Маленкова про прощення. Ні, великий апостол робітничої демократії ще раз довів свою цінність!"
 ORE.904.a: "І подумати тільки, що вони б уникнули покарання, якби не голова Маленков!"
 
#Bur#
 ORE.906.t: "Технічні труднощі"
 ORE.906.d: "План Бурби щодо переведення комун у сучасність був прийнятий Конгресом. Справжньою проблемою є отримання згоди Ради, і саме тут він зіткнувся з першою серйозною опозицією, особливо після нашого суперечливого оголошення про усунення всіх членів Ради, які були замішані в нещодавніх корупційних скандалах. Але деякі називають його програму та бажання реформувати Раду до чогось, що нагадує законодавчу стабільність, нападом на самі комуни, і багато хто натякає, що талант і законодавчий досвід, які ми втратимо, прибираючи павутину з шафи, просто не варті таких витрат. І вони наводять переконливі, навіть хороші аргументи. Ця програма, якщо її буде реалізовано, буде великим ризиком, а люди, яких ми маємо намір усунути з Ради за корупцію, також відіграють важливу роль у наших місцевих системах. Чи можемо ми втратити таланти такого масштабу і вижити? Тільки час покаже. Водночас буде важко переглянути звинувачення, раптово відхилити їх і очікувати, що наші люди будуть задоволені нашою роботою. \n\nУ нас є два варіанти: тихо усунути справи, які ми будуємо проти корупціонерів у наших владних колах, і відступити заради людей, або продовжити реформи. Зрештою, голова, за визначенням, знає, що найкраще для жителів комун, навіть якщо останні не знають, що їм потрібно. А знання дають силу"
 ORE.906.a: "Ми повинні захищати наше майбутнє, навіть якщо це коштуватиме нам дорого"
 ORE.906.b: "Зніміть звинувачення. Це заради блага народу"

 #New Team
 ORE.907.t: "Проблеми з новими виборами"
 ORE.907.d: "Цей корупційний скандал багато хто в нашій фракції, включаючи голову Бурбу, розглядав як хорошу нагоду продемонструвати нашу зростаючу політичну силу та позбутися політиків, підозрюваних у хабарництві. Ці старі дідугани поступаються своїми місцями молодим політикам, які будуть більш прихильними до наших проектів. n\nОднак цього разу добре продуманий план голови Бурби щодо виборів не дав бажаних результатів. Наші дані про популярність наших кандидатів виявилися ненадійними в багатьох громадах, і, на жаль, багато кандидатів, які все-таки перемогли, є представниками старої маленковської фракції. Ще гірше те, що багато представників опозиції, які прагнуть повернути Орєнбурґ до анархії Робітничого конгресу, знову повернулися до влади. \n\nГолова Бурба розчарований таким результатом, але він і його команда політичних аналітиків вже вивчають причини, через які їхні прогнози виявилися помилковими, і створюють нові статистичні моделі підтримки в регіоні. Тим часом наші люди в Раді встановлюють правила як для новачків, так і для тих, хто повернувся, і дають чітко зрозуміти, що повернення до статусу-кво, що існував до Бурби, не відбудеться. Загалом, політична ситуація майже не змінилася, оскільки під час часткових виборів нечесних представників замінили ненадійні представники. Для нас це не є серйозним поворотом, але й не кроком вперед."
 ORE.907.a: "Ми не можемо виграти все. Принаймні люди побачать, що корумповані люди більше не є членами Ради"
 
 ORE.908.t: "Кінець справи сільськогосподарського комітету"
 ORE.908.d: "Зрештою люди втомилися обговорювати чутки про корупцію при відборі членів сільськогосподарського комітету. Багато хто перейшов до обговорення сильних і слабких сторін нової політики алфавітизації голови Бурби. Інші просто відмовилися від політики, набридши безпідставними історіями та маргінальними теоріями змови протягом року. Зрештою, оскільки політика належить до тієї ж вічної категорії, що й податки та смерть, ігнорування її протягом кількох місяців нікому не зашкодить, чи не так?\n\nУ самій Раді продовжувалося утвердження нового порядку голови Бурби. Щотижня кілька повноважень відбирали у непотрібних політиків і передавали комітету, до складу якого входили експерти. Голова продовжував просувати в Раді тих, хто вмів правильно тримати олівець, і водночас продовжував забивати ідіотів у маловідомі підкомітети. Регіональні лідери сперечалися про пріоритетне фінансування, а аналітики з фракції голови порівнювали прогнозовану віддачу від інвестицій у різні проекти. Так, у новій Раді робітників все йшло як завжди. \n\nЗаміна осіб, причетних до чуток про корупційний скандал, задовольнила населення, яке вважало, що до звинувачень у злочинах поставилися серйозно. Голова Бурба направив деякі ресурси до громад, які були незадоволені втратою свого старого представника (якщо інвестиції того варті), а інших проігнорував. Зрештою, перевагою управління конфедерацією громад, яка ще розвивалася, було те, що погана інфраструктура та лінії зв'язку утримували незадоволених громадян на відстані щонайменше кількох днів подорожі."
 ORE.908.a: "Все добре, що добре закінчується?"

#Нова робота
 ORE.909.t: "Радники, яких налякали"
 ORE.909.d: "Зрештою, голова Бурба вирішив прислухатися до тих своїх радників, які рекомендували обережність. Багато потенційно корумпованих членів Ради залишаються популярними у своїх округах, і занадто швидке їх усунення може порушити делікатний баланс, на який покладається наш уряд для проведення реформ. Є також прикра обставина, що ми маємо не більше ніж непрямі докази щодо поточного корупційного скандалу та його підозрюваних. Багато підозрюваних членів Ради були налякані головою Бурбою. Після того, як вони голосно оголосили про свою невинність і поклялися продемонструвати свою політичну надійність реформаторським фракціям, їх відпустили без інцидентів. З іншого боку, нерозкаяних шахраїв, таких як радник Захаєв, привели до столу переговорів за допомогою поєднання меду і оцту. Старий негідник не вижив би так довго в бурхливій Раді, якби не мав дуже хорошого чуття на те, куди дме політичний вітер, і він справедливо підозрює, що піднесення голови Бурби не можна зупинити. Для нього і йому подібних краще скоротити корупцію, якщо це може підвищити їхні шанси зберегти реальну політичну владу, замість того, щоб бути відправленими до культурного комітету. n\nТепер, коли всі підозрювані в корупційному скандалі поводяться якнайкраще, кілька продуктивних засідань Ради пройшли без інцидентів. Вигляд старого Захаєва, який підтримує пропозиції голови Бурби, звичайно, викликав подив, але хаотична природа політики Орєнбурґа бачила й дивніші союзи."
 ORE.909.a: "Нам вдалося переконати членів Ради почекати ще один день..."
 
 ORE.910.t: "Рівень схвалення наших дій щодо боротьби з корупцією зростає!"
 ORE.910.d: "Певний час чутки про корупцію під час відбору членів сільськогосподарського комітету були на вустах усього міста. Спекуляції про те, хто був до цього причетний, були однією з улюблених тем Орєнбурґа. Дехто намагався звалити провину на проторговельну фракцію, яка намагалася викачувати гроші з сільськогосподарського комітету після того, як її представники були обрані. Інші припускали, що залишки фракції Маленкова намагалися повернути собі частину влади, щоб торгуватися з фракціями голови Бурби. n\nНаші переговори з підступними членами ради дозволили запобігти повторному виникненню чуток про корупцію в раді. Деяких членів сільськогосподарського комітету перевели в інші підрозділи ради, а на їх місце прийшли кілька людей, відомих своєю непідкупністю. Це дало привід для підозр у нечесній грі, але більшість населення сприйняла зміни у складі комітету як достатній доказ того, що чутки про корупцію були сприйняті серйозно. n\nЦя вся подія насправді обернулася на нашу користь, оскільки населення було вражене тим, як голова Бурба впорався з проблемою. Замість того, щоб виходити на арену і звинувачувати супротивників у нечесності, голова та його соратники переорієнтували Раду на важливіші питання і вирішили ситуацію за лаштунками. Члени Ради, які побоювалися кінця своєї політичної кар'єри в умовах істерії, вдячні нам і підтримують уряд більше, ніж будь-коли."
 ORE.910.a: "Примхи громадськості нас не дуже турбують, але схвалення приємно, поки воно триває"
 
 #Cou#
 ORE.911.t: "Рішення Ради"
 ORE.911.d: "За таку радикальну пародію на справедливість Рада вирішила вчинити рівноцінний акт радикальної справедливості; ми очистимо всіх, хто стояв на заваді ефективному управлінню, і вийдемо з вогню сильнішими та кращими. Всі, хто того вартий, будуть переобрані, а корумповані та аморальні члени, які зрадили справедливість заради прибутку, будуть засуджені та забуті.\n\nПринаймні, такий план сформулювала Рада, і більшість делегатів дотримуються його на папері. Допитливих журналістів, які вказують на те, що зв'язки корумпованих осіб із впливовими політиками Орєнбурґа означають, що вони неминуче будуть переобрані, ігнорують, поки їх ще можна ігнорувати. Так само і делегати, які кажуть, що це зовсім не рішення, а просто засіб заявити про свою невинність, блокуючи тим самим тих, хто знає правду, від подальших звинувачень. \n\nВсе вирішено, і справедливість відновлено. Рада не терпітиме жодних сумнівів з цього приводу, за винятком внутрішніх; і Рада, безсумнівно, має більші проблеми всередині, ніж сумніви. Або ж ні?"
 ORE.911.a: "Ми всіх їх очистимо. Без зайвих питань"
 ORE.911.b: "Це здається трохи... надмірним. Навіть надмірним"
 #Вибори
 ORE.912.t: "Нове оголошення"
 ORE.912.d: "Хоча оголошення про нові вибори, щоб очистити Оренбурзьку Раду від будь-яких слідів корупції, було зустрінуте з деяким схваленням, мало хто сподівався на щось краще. Хоча з'явилося кілька нових обнадійливих кандидатів, які заявляли, що хочуть «кинути виклик статусу-кво», вони були лише невеликою частиною серед звичайних кандидатів. Нова група була молодшою і, можливо, більш популістською у своїх програмах, але навряд чи достатньо радикальною, щоб насправді щось змінити. Жителі Орєнбурґа були втомлені, і хоча нові вибори дали їм деяку слабку надію, багато хто вважав, що вони мали б більший вплив, якби просто залишилися вдома. Складалося враження, що голосування стало традицією, а не шансом на зміни. Учасники іноді змінювалися, але правила залишалися незмінними, а процес управління Орєнбурґом з роками затвердів, як цемент. Навіть ті, хто охоче підтримував нових, молодих і сповнених надії кандидатів, сумнівалися, що вони зможуть довго протистояти статусу-кво. Вони сподівалися лише на невеликий прогрес, і навіть тоді вони були нервові. Повільно голоси почали накопичуватися. Швидко стало очевидно, що багато хто дійсно вирішив залишитися вдома, явка була мізерною. Однак результати були підраховані, і..."
 ORE.912.a: "Висловіть свою думку!"
 
 ORE.913.t: "Стара і знайома Рада"
 ORE.913.d: "Очікуване дійсно сталося. Більшість членів старої Ради були переобрані. Хоча вони були раді поверненню до влади, вони перемогли без особливої підтримки. Було очевидно, що Орєнбурґ втомився. Проте це не турбувало членів Ради, які прагнули повернутися до роботи над своїми звичними політичними проектами. Деякі з них зробили символічні зусилля, щоб хоча б удавати, що вони прагнуть змін на краще. Якщо зміни полягали в короткій промові та рукостисканнях з деякими фермерами, то, можливо, їм це вдалося. Однак насправді мало що змінилося. Було проведено деякі реформи для запобігання хабарництву та загальній корупції, але з точки зору загального населення комун вони, здавалося, не мали жодного ефекту. Бізнес продовжував працювати як зазвичай, а Рада розглядала нескінченну кількість питань і дебатів зі швидкістю і ентузіазмом висохлої слимаки. Дехто замислювався над тим, що могло б статися, якби було обрано нову раду. «Можливо, щось стало б краще», — думали вони. Дехто намагався реформувати систему. Група робітників з міста склала список кількох ключових реформ, спрямованих на поліпшення життя всіх жителів Орєнбурґа. Їхня спроба прогресу загубилася серед численних інших пропозицій і скарг, що надходили. Кожного разу, коли вони запитували про це, їм відповідали, що це питання буде піднято з часом. Звичайно, воно так і не було підняте..."
 ORE.913.a: "Життя в Оренбурзі повільне"

 #Зберегти
 ORE.914.t: "Нічого показати, нічого приховувати"
 ORE.914.d: "Рада була зацікавлена в збереженні статусу-кво. Ті самі чиновники, що й раніше, залишалися на своїх посадах. Офіційним приводом було те, що «в Раді немає корупції» і що, якби корупція була, її б уже викрили. Звісно, для тих, хто твердо вірив, що корупція все ще існує, заява Ради лише посилила їхні побоювання і змусила їх з нетерпінням чекати на наступний крок Ради. У відповідь на свою нібито бездіяльність Рада тепер мала справу з досить чималою групою протестувальників, які зібралися біля її приміщення в центрі Орєнбурґа. Серед очікуваних банерів із гаслами «Рада має піти!» та очікуваної кількості барвистої лексики, було досить провокаційне зображення врожаю фермера, який збирають і крадуть, а член Ради дивиться в інший бік, тримаючи в руках багатства, подаровані йому крадієм врожаю. Хоча протестувальники були численними і гучними, спочатку вони мали незначний вплив на Раду, яка впевнено оголосила, що робота буде продовжуватися як звичайно. \n\nПротести тривали щодня, поки Рада засідала, а потім розходилися, коли члени Ради йшли додому. Не збентежені цим, протестувальники почали пробувати інші способи домогтися свого. Деякі збиралися біля будинків певних чиновників і голосно викрикували свої вимоги, щоб не дати їм і їхнім сусідам спати вночі. Інші вдавалися до різних форм вандалізму та інших дрібних злочинів, від написання слова «брехуни» на будівлі ради до кидання мертвого півня в одного з членів ради, який йшов на роботу. Після цього інциденту рада погодилася зустрітися з деякими протестувальниками і спробувати знайти рішення. Це виявилося безглуздим для обох сторін, оскільки протестувальники наполягали на відставці Ради, а Рада наполягала, що нічого не можна вдіяти з корупцією. Наступного дня навколо будівлі Ради знову з'явилися банери, і ще один день почався і закінчився як завжди..."
 ORE.914.a: "Сподіваємося, що більше ніхто не буде кидати мертвих тварин"
 
 ORE.915.t: "Буря в склянці води"
 ORE.915.d: "Тепер, коли хаос вщух, дехто з політичної еліти Орєнбурґа може вільно розмірковувати над тим, звідки могли взятися чутки про корупцію. Оскільки кожна політична фракція має неформальну мережу інформаторів і шпигунів, всі таємно сподівалися, що з'являться докази щодо справжніх винуватців. Як тільки корумповані політики спробують обміняти свої фішки на гроші, з'являться докази їхньої провини, і буде викрита вся мережа людей, які намагаються купити собі місце в Аграрному комітеті. Сьогодні вранці, коли ми готувалися до робочого дня, до офісу нашої фракції забігла молода секретарка, задихаючись, і вимагала поговорити з найавторитетнішим політиком. Наші здивовані члени вислухали її розповідь. Як з'ясувалося, її керівництво у фінансовому комітеті Ради загубило документи, що затверджували звичайний переказ грошей для оплати праці персоналу. Це створило дірку в рахунках, яку деякі бюрократи намагалися приховати, перекладаючи гроші з одного місця в інше. Незабаром це спричинило ланцюгову реакцію, в результаті якої гроші надходили і виходили через дивні регіональні рахунки, що дало підстави вважати, що регіональні асоціації комун перераховують великі суми грошей до Орєнбурґа. Звідти почала поширюватися чутка, що з рахунками сільськогосподарського комітету щось не так і що його члени якимось чином купують свої посади! Коли начальник секретарки знайшов загублені документи, зниклі гроші «повернулися» в систему, і всі рахунки збіглися. Чоловік не надавав значення своїй помилці і лише нещодавно згадав про неї своїй секретарці. Молода жінка відразу побачила наслідки цієї канцелярської помилки і побігла повідомити про це нам. Як виявилося, навколо сільськогосподарського комітету ніколи не було корупції."
 ORE.915.a: "Розумна дівчина. Якби тільки вона дізналася про це раніше..."
 
 
##Flavor##
 #B
 ORE.500.t: "Питання управління"
 ORE.500.d: "Деніска Сопов був новачком на посаді командира одного з багатьох елітних підрозділів Уральської ліги. Він дуже серйозно ставився до своїх обов'язків і з радістю скористався нагодою очолити оборонний патруль поблизу Орєнбурґа, вважаючи, що це буде просте, але ефективне завдання, яке дозволить продемонструвати його здібності. n\nОднак за лічені години він і його люди безнадійно заблукали далеко від запланованого маршруту патрулювання. Побачивши поблизу сільську комуну і групу селян, які працювали на полях за її межами, Сопов підійшов до них і попросив селян вказати йому дорогу до їхнього старости, щоб він міг знайти шлях. На його подив, селяни, які мали мало досвіду в цьому регіоні, відверто сказали йому, що у них немає старости. Здивований, Сопов попросив їх пояснити, як працює їхнє село. Вони розповіли йому, як громадяни їхньої анархо-синдикалістської комуни по черзі виконують функції виконавчого офіцера протягом певного часу, причому всі рішення цього офіцера вимагають затвердження принаймні половиною комуни для внутрішніх справ і двома третинами більшості для зовнішніх справ. Сопов вважав їхню систему досить дивною і розповів їм, як Ліга організовувала свою діяльність за суворою та ефективною ієрархією командирів і міліцейських підрозділів. Селяни не були вражені і сказали йому, що група чоловіків, які сидять у фортецях і роздають вигадливі титули, не є основою для системи управління. Стаючи все більш нетерплячим, він вимагав, щоб вони просто вказали йому, хто тут головний. Його агресивний тон викликав гнів селян, які заявили, що це «типова поведінка» гвардії. Врешті-решт, втомившись і виглядаючи все більш безглуздо перед своїми людьми, Сопов пішов шукати когось, хто міг би надати йому потрібну інформацію, залишивши селян скаржитися на його втручання."
 ORE.500.a: "Приходьте і подивіться на насильство, притаманне системі!"
 
 ORE.501.t: "Кохання в пустелі"
 ORE.501.d: "Її родина зреклася її. Її село відвернулося від неї. Люди називали її повією і зрадницею. Але Варі це було байдуже. Адже сьогодні вона виходила заміж за свого лицаря в блискучих обладунках. Руслан був молодим чоловіком з Орська, який, втікши з міста після прибуття страшної Бригади, зрештою взяв до рук зброю і вступив до лав Гвардії. Піднявшись по службових сходах, він очолював численні експедиції до Орєнбурґа, щоб допомогти людям, незважаючи на їхню загальну ворожість. Він покохав Варю з першого дня їхнього знайомства. Він приносив їй квіти з гір, відвідував її під час кожного патрулювання і давав їй відчуття безпеки у світі жахів. Коли настав час повертатися до гвардії, щоб готуватися до майбутньої боротьби, вона благала його взяти її з собою, і вони домовилися одружитися. Ті, кого вона любила, обернулися проти неї. Для них це був чоловік, який хотів знищити їхній спосіб життя. Чоловік, який, ймовірно, загине за тиждень, а його череп використають як кухоль, а нутрощі з'їдять жахливі бандити. Чоловік, який забирає її з її законного місця. Але коли єдиний співчутливий священик провів їхні обітниці в тихій улоговині під горами, єдине, що мало значення в світі, — це вони один для одного. За день молодята вирушили до Белорецька. Варя щиро сподівалася, що вона знову побачить свою родину, коли світ буде вільний від бандитів, божевільних вчених і всіх жахів 20 століття. Вона також сподівалася, що Руслан виживе і повернеться до неї, і що з часом її народ прийме його як великого чоловіка, яким він був. Але поки що вона була задоволена тим, що могла спокійно йти поруч зі своїм чоловіком."
 ORE.501.a: "Кохання — дивна річ"
 
 ORE.502.t: "Втручання"
 ORE.502.d: "Іван Олександрович був відданим солдатом Уральської гвардії. Він брав участь у багатьох битвах проти бандитів і щоразу виходив з них героєм. Саме з цієї причини він був одним з тих, кого призначили охороняти маленьке безіменне село на околиці Оренбурзьких комун.\n\nВін і його товариші по службі прибули, сповнені бажання допомогти цим бідним, безпорадним людям. Але це почуття було зовсім не взаємним. Після їхнього прибуття місцеві жителі відмовилися надати їм житло або притулок, і гвардія була змушена розбити свій табір на околиці села. Селяни в цілому були вороже налаштовані до Івана та його друзів і ніколи не продавали їм їжу чи товари. \n\nОднак одного дня нарешті настав той день, заради якого Іван та гвардія були там. Невеликий загін бандитів їхав з півдня. Гвардія зібрала зброю і зайняла позиції, готова до служби... і була освистана та висміяна селянськими військами. Імпровізовані солдати, озброєні гіршою зброєю і без будь-якої підготовки, заявили, що самі впораються. Це було останньою краплею для Івана. Він захищатиме цих людей, хоч їм це подобається, хоч ні. До того часу, як бандити прибули, Івана скрутили і відтягли за напад на селянина. Решта селян неохоче билися з охоронцями, але Іван був зв'язаний і розлючений. Того дня він нікому не служив."
 ORE.502.a: "Яка катастрофа"
 
 ORE.503.t: "Клас 1963 року"
 ORE.503.d: "... звичайно, це не означає, що все буде легко. Наш світ за останні кілька десятиліть неодноразово перевертався з ніг на голову. Але попри все це наше місто вистояло. Саме ви, молоді та з блиском в очах, маєте інструменти та таланти, щоб зберегти наш спосіб життя у світі завтрашнього дня. \n\nМи наближаємося до часу, коли більшість населення вже не пам'ятатиме часів, коли наша велика батьківщина була об'єднана під одним прапором. Це стосується і більшості з вас, хто тут присутній. Я повністю вірю і впевнений, що молодші покоління, а також майбутні покоління, не тільки побачать кращий світ, але й створять його. Звільнившись від кайданів минулого, я з оптимізмом дивлюся в майбутнє Орєнбурґа. Ваш час тут, як студентів, закінчився. Тепер ви повинні вийти в життя, у світ за межами цього кампусу, і зробити великі справи. Для мене було честю бути вашим деканом. Випускники 63-го року, прошу вас приєднатися до мене в гімні Оренбурзького державного університету..."
 ORE.503.a: "Надихаючі слова"
 
 ORE.504.t: "Продовжуємо рух"
 ORE.504.d: "KO-1 не є гарним. Він не блищить і не є витонченим. Його краї похилі, ковпаки коліс є простими дисками, фарба завжди матово-зелена, а фари мають невиразну круглу форму. Сидіння не теплі і не затишні, салон нефарбований, і в цілому в ньому мало приємних дрібниць.\n\nІ все ж це найпрекрасніша річ, яку багато хто бачив.\n\nЦе перший автомобіль, розроблений в Оренбурзі, символ свободи і особистої автономії, якого ще ніколи не бачили в російських воєначальницьких державах. Він дешевий у виробництві, простий в обслуговуванні і має пробіг, який може конкурувати навіть з американськими автомобілями. У найближчі роки, коли автомобіль стане більш поширеним в Оренбурзі і навіть почне обмежений експорт в інші країни, KO-1 стане символом національної гордості. Через десятиліття, довго після того, як заводи припинять виробництво автомобіля, робочі моделі все ще буде відносно легко знайти."
 ORE.504.a: "Де я можу його купити?"
 
 ORE.505.t: "Перебіжчики"
 ORE.505.d: "Вони прибули рано вранці. Це була змучена група чоловіків і жінок, деякі в лабораторних халатах, інші просто в цивільному одязі, але всі вони були найкращими і найталановитішими у своїх галузях. Вони прибули з Чорної гори, прокрадаючись і ухиляючись від патрулів Магнітогорська, і їм знадобилося ще два дні пішки, щоб дістатися до Орєнбурґа, але вони нарешті досягли мети. \n\nЛише коли їх прийняла патрульна міліція на околиці, надала їжу та воду і запевнила, що вони будуть у безпеці, вони почали розповідати про жахи, які бачили всередині Чорної гори. Вони тихими голосами і крізь сльози розповідали про експерименти, які проводили, бо не мали іншого вибору або спочатку вірили в «вище благо». Вони шепотіли про викрадення, примусове розмноження, вівисекції. Деякі взагалі відмовлялися говорити. Люди Бурби пообіцяли їм притулок. Вченим нададуть місце для проживання, але тільки за умови, що вони будуть працювати на Орєнбурґ і його дослідницькі підрозділи. Це питання вимагало певних переконань і демонстрації реального етичного кодексу, але зрештою всі вчені приєдналися до зусиль міста."
 ORE.505.a: "Ця гора мене турбує..."
 
 ORE.506.t: "Рука, що годує"
 ORE.506.d: "Хаос захопив проспект Перемоги. Кров дітей Орєнбурґа тепер стікає по боках нововироблених автомобілів. Вона стікає в щойно викопані каналізаційні колектори. Вона збирається навколо чобіт щойно навчених офіцерів спецназу. Модернізація потрясла Орєнбурґ до глибини душі в багатьох відношеннях, і в багатьох відношеннях це було добре! Люди працюють. Люди їдять. Люди насолоджуються процвітанням, яке було немислимим ще кілька років тому. Орєнбурґ став сяючим маяком у темряві Росії. Але це не ідеальний перехід, бо люди знають, що щось втрачено. Вони відчувають її помітну відсутність, коли сплять, вони відчувають страх без неї під пильним оком зростаючої армії поліцейських Бурби, і вони відчувають, як вона повільно вислизає з їхніх тіл і зникає, коли вони безперервно працюють на заводах без права голосу і часто без оплати. \n\nЖителі Орєнбурґа втратили свою свободу. \n\nПротести були очікуваними. Принаймні так здається, адже поліція була більш ніж готова, коли вони почалися. Сміливі та горді студенти марширували по проспекту Перемоги, коли десятки офіцерів з новими щитами та ременями зі свіжоприготованим сльозогінним газом накинулися на них. n\nБули застосовані кийки та вогнепальна зброя, і до кінця дня майже десяток найкращих і найталановитіших жителів Орєнбурґа лежали на вулиці, задихаючись, а понад сотня інших спотикалися і лікували рани, від звичайних до тих, що загрожували життю.\n\nЧи це ціна прогресу?"
 ORE.506.a: "Що ще ми повинні пожертвувати заради цього майбутнього?"
 
 ORE.508.t: "Дім для знедолених"
 ORE.508.d: "Ті, кому пощастило мати місце, де можна жити і відпочивати щоночі в цій розірваній війною країні, рідко співчувають тим, хто потрапив у скрутне становище. Тому більшість вважала, що будівництво нового бетонного будинку — це просто ще одна квартира для розбещених і багатих. Але коли двері нарешті відчинилися, багато мешканців були шоковані, виявивши, що вони відкриті для всіх, хто потребує теплого притулку від холоду або їжі, коли особисті запаси вичерпалися. Колишні селяни, які роками безцільно блукали, шукаючи підсобну роботу або місце для проживання, тепер нарешті можуть відпочити. Реформа Олександра Бурби в Оренбурзі супроводжувалася не тільки обіцянками демократизації, але й метою створення соціального забезпечення для знедолених мас Уралу. З відкриттям перших притулків для бездомних у Росії в центральному місті, реалізація цієї високої мети, як тепер видно, вже йде повним ходом. У промові, виголошеній на відкритті закладу, Бурба говорив про те, що в певному сенсі всі росіяни є бездомними через свою роз'єднаність і постійну невизначеність, і назвав відкриття притулку першим кроком не тільки до боротьби з бездомністю, а й до відновлення цілісності батьківщини. Ми можемо тільки сподіватися на краще для блукаючих мандрівників у цьому великому вигнанні."
 ORE.508.a: "Суспільство оцінюють за тим, як воно ставиться до найбідніших"
 #M
 ORE.509.t: "Повернення з роботи"
 ORE.509.d: "Олександр бігав надворі, уявляючи себе героїчним російським асом, який збиває підступні німецькі винищувачі. Сонце вже зайшло, але він хотів побачити своїх батьків. Зазвичай він лягав спати до того, як вони закінчували свою зміну, але цієї ночі він буде там. Нарешті, вони обоє прийшли додому, втомлені й виснажені. Побачивши Олександра, на їхніх обличчях з'явилися виснажені посмішки. \n\nЙого мати присіла і обійняла його. «Ми принесли тобі сьогодні щось з роботи». Вона дістала щось зі своїх штанів і подала Олександру. Це була маленька іграшкова машинка з обертовими колесами та всім іншим. Він радісно скрикнув; він не отримував нової іграшки вже роками. «Дякую, мамо!» Він побіг гратися з машинкою, а його батьки посміхалися. Наступного дня Олександр знову був удома сам, його батьки були зайняті на роботі. Граючись зі своєю іграшкою, він помітив, що фарба трохи потріскалася. У цей момент відвалилося одне з коліс. Він присів і спробував прикріпити його назад, але марно. Він сів, розчарований і нещасний. Він поклав колесо в кишеню; може, батьки зможуть його полагодити. Чи тому вони працювали цілий день? Щоб приносити йому дешеві, зламані іграшки і ніколи не бачити його? Олександр дивився на маленьку машинку в руці і відчував лише самотність."
 ORE.509.a: "О, сонечко, мама спробує купити тобі іншу..."
 
 ORE.510.t: "Кінець комунальної мрії"
 ORE.510.d: "Даша зачинила двері своєї маленької хатинки і вийшла на порожні вулиці. Вона була останньою, хто жив у цій частині села, всі інші поїхали до Орєнбурґа, щоб працювати на нових заводах товариша Маленкова. Її сусід Артур клявся, що ніколи не поїде, але вона вже багато днів не бачила, щоб він виходив з дому. Можливо, він нарешті напився до смерті. Кілька випадкових душ все ще затримувалися, не бажаючи ні зникати, ні рухатися далі. Коли вона нарешті дійшла до ринкової площі, відкритою залишалася лише одна лавка — старий добрий Василь все ще продавав свої свіжі продукти. Вона дістала стару мітлу з громадського сараю і взялася за прибирання площі. Це було марне заняття, вітер постійно наганяв пил, і в будь-якому разі мало хто міг оцінити її працю, але це була одна з небагатьох робіт, що залишилися в селі. \n\nЗрештою, Василій втомився від хронічного браку клієнтів і підійшов до неї. Вони обмінялися кількома сумними зауваженнями про стан села і згадали минулі часи. Василь сором'язливо зізнався, що він теж нарешті вирішив влаштуватися на роботу в Оренбурзі і що наступного ранку він поїде. Даша була сумна, він завжди був для неї привітним обличчям, якого вона чекала, і вона буде дуже сумувати за ним. Він приніс мішок овочів зі свого прилавка і вручив її, сказавши, щоб вона насолодилася ситною трапезою за його рахунок. Не маючи більше що сказати, він попрощався з нею, спакував свій кіоск і пішов додому. Залишившись одна на площі, Даша похмуро розмірковувала, чи не час і їй їхати. А поки що вона мовчки підмітала вулиці, сподіваючись зробити вмираюче село хоч трохи пристойнішим."
 ORE.510.a: "Підмітай ці вулиці, які колись належали нам"
 
 ORE.511.t: "Стріляючи в посланця"
 ORE.511.d: "Маленков сидів за своїм столом, уважно переглядаючи документи перед тим, як їх підписати. У нього була стоса паперів, вища за його власне крісло. Хтось тихо постукав у двері. Маленков сказав «Заходьте», навіть не піднімаючи очей. Він ніс меншу стопку паперів. «Пане, надійшли звіти про виробництво заводу». Це змусило Маленкова підняти очі, в яких промайнула цікавість. Він вихопив звіт з рук помічника і почав читати резюме. Його очі швидко перейшли від цікавості до здивування, а потім до гніву. «Ці цифри жахливі. Вони набагато нижчі за встановлені розумні норми. Вони, мабуть, неправильні. Принесіть мені правильний звіт». Помічник тепер явно тремтів від страху. «П-пане, це правильні цифри». Маленков ударив кулаком по столу. «Те, що вони фактично точні, не робить їх правильними! Я встановив правильні цифри, а вони не були досягнуті!» Його обличчя тепер було сповнене люті. «Охорона! Заарештуйте цього чоловіка!»\n\nНайгірші побоювання помічника справдилися. Його витягли з кімнати, переможеного, і кинули до тюремної камери. Він пробуде там досить довго."
 ORE.511.a: "Якби він приніс хороші новини, йому не було б чого боятися"
 
 ORE.512.t: "Асоціація на честь святкування робітничої демократії"
 ORE.512.d: "З одного дня на інший різні комюніке та твори революційного мистецтва, що виходили з друкарень міста Орєнбурґа, почали маркувати як такі, що походять від «Оренбурзької асоціації на честь святкування робітничої демократії». Заявленою метою нової організації є поширення хороших новин про прогрес нашої робітничої революції. Вплив славних рішень нашого керівництва на життя і працю простих людей повинен бути визнаний, хоча б для того, щоб подякувати нашому хороброму Робітничому раді за їхню постійну добру роботу. \n\nСпостережлива людина може помітити неминучу присутність голови Маленкова в літературних і художніх творах асоціації. На одному плакаті голова розпаковує ящики з ліками у віддаленій комуні. На іншому товариш Маленков перерізає стрічку на відкритті нового заводу. Військові пропагандистські плакати неминуче закликають чоловіків Орєнбурґа стояти на сторожі, щоб врятувати новий Орєнбурґ голови. І щотижня надходять звіти про розширення поставок промислових товарів або про наших хоробрих чоловіків, оснащених новою зброєю завдяки реформі голови. Спостережлива людина могла також помітити заміну депутата Кузнєцова з посади голови міністерства культури та комунікацій Орєнбурґа. Цинічна і спостережлива людина могла б зацікавитися пониженням товариша Кузнєцова. Чистий цинік міг би навіть повірити чуткам, що Кузнєцов був звільнений за відмову повністю присвятити себе розвитку культу особистості голови Маленкова. Але, на щастя, хороші працівники з Орєнбурґа ніколи не бувають цинічними. Ця жахлива риса характеру, така поширена в відчужених капіталістичних суспільствах світу, не має місця в Оренбурзі, особливо в серцях тих, чия доля була змінена завдяки наполегливій праці голови Маленкова."
 ORE.512.a: "Газети повідомляють, що голова Маленков знову підвищив норми видачі шоколаду!"
 
 ORE.513.t: "Сумніви турбують голову"
 ORE.513.d: "Маленков ніколи не спав добре. Були винятки, наприклад, ніч, коли він став головою. Сьогоднішня ніч не була такою. Замість того, щоб спати, його думки змушували його крутитися в ліжку. Його турбували сумніви. Він намагався нагадати собі, що досяг успіху, що він є головою Орєнбурґа. Але цього було недостатньо. Орєнбурґ розширювався і розвивався так, як Маленков і планував, але все одно було так багато проблем, які не давали йому спокою. Лише два дні тому він бачив, як стару жінку штовхнули на землю і пограбували, а злодій втік у провулок, перш ніж поліція встигла прибути на місце події. Маленков був жахнутий, побачивши, що одну з його громадян жорстоко побили і пограбували серед білого дня. Перед тим, як лягти спати, він поцікавився про цю справу і отримав відповідь, що поліція все ще розслідує її. Він знав, що це означає: злодія ніколи не спіймають. Голова дійсно допоміг розширити заходи безпеки в місті, але здавалося, що цього ніколи не буде достатньо. В Оренбурзі все ще було багато бідних, і вони часто не мали іншого вибору, як вдаватися до дрібних злочинів. Більше поліції, подумав він, це вирішить проблему. \n\nВін все ще не міг заснути, його турбували інші турботи. Можливо, це було пов'язано з візитом на ферми. Хоча на папері квоти були виконані, кількість продукції, яку він побачив під час свого офіційного візиту, здавалася скоріше половиною від очікуваної. Чи фермери брехали йому? «Чому вони це робили?» — думав він. Чи була це помилка? Чи хтось крав з ферм? Тоді Маленкова охопила думка, яка його засмутила. Чи фермери боялися його? Що він може покарати їх за невиконання квот вчасно? Він усвідомив, що, ймовірно, так і було. Раніше він суворо поводився з тими, хто не виконав завдання. Маленков був упевнений, що може зробити краще, що може покласти край страху перед злочинністю і перед ним самим. Орєнбурґ буде процвітати і жити в мирі під його контролем. Він подбає про це. Він намагався підбадьорити себе, але навіть тоді сумніви поверталися через кілька хвилин."
 ORE.513.a: "Ще одна безсонна ніч"
 
 ORE.514.t: "Останній радник"
 ORE.514.d: "Була пів на дванадцяту в кабінеті Маленкова. Кімната не була такою розкішною, як він очікував від авангарду революції, але маленький кабінет, вбудований у будівлю Конгресу, мав поки що задовольняти його потреби. Він перевіряв звіти про поточний план індустріалізації, коли помітив на своєму столі знайому фотографію. Фотографія була зроблена в простіші часи, в останні дні 57-го Конгресу. Маленков посміхнувся, згадуючи, як Астанков завжди жартував над деякими найбезглуздішими аспектами комунальної політики. Шкода, що пізніше з'ясувалося, що він також висміював Маленкова. Ось Гаврилов. Він був оптимістом, але щиро піклувався про добробут Орєнбурґа. Він безперервно говорив про стрибок до комунізму і про те, як все обов'язково стане краще. Навіть коли Маленкова звинуватили у фашизмі, Гаврилов продовжував вірити в його реформи. Все це тривало до голоду. Його руки були зв'язані, коли він дізнався про опозицію Гаврилова; незгода призвела б до розколу в партії. Але навіть тоді Маленков не міг стримати сліз. А в центрі — Коровін. Він був товстим старим циніком, відомим своїми запальними звинуваченнями у фашизмі, але без нього комуни вже давно б занурилися в анархію. На щастя, він помер до 59-го року. Ймовірно, він перевертається в могилі, дивлячись на те, що Маленков зробив з Орєнбурґом. Маленков не міг стримати сліз, коли усвідомив, що він був останнім на цій фотографії, хто пережив чистки. «Чому вони не могли просто послухати?» — сказав він собі. «Індустріалізація була необхідною, бригада стояла на порозі, чекаючи, щоб поживитися на наших слабких!» Незалежно від того, які виправдання вигадував Маленков, він не міг позбутися величезного почуття провини, яке тяжіло на ньому. \n\nЧерез тиждень в архівах Орєнбурґа з'явилося нове зображення. Маленков посміхався на 57-му з'їзді."
 ORE.514.a: "Поруч з ним нікого не було"
 
 ORE.515.t: "Асоціація на честь святкування робітничої демократії"
 ORE.515.d: "З одного дня на інший різні комюніке та твори революційного мистецтва, що виходили з друкарень міста Орєнбурґа, почали маркуватися як такі, що походять від «Оренбурзької асоціації на честь святкування робітничої демократії». Заявленою метою нової організації є поширення хороших новин про прогрес нашої робітничої революції. Вплив славних рішень нашого керівництва на життя і працю простих людей повинен бути визнаний, хоча б для того, щоб подякувати нашому хороброму Робітничому раді за їхню постійну добру роботу. \n\nСпостережлива людина може помітити неминучу присутність голови Маленкова в літературних і художніх творах асоціації. На одному плакаті голова розпаковує ящики з ліками у віддаленій комуні. На іншому товариш Маленков перерізає стрічку на відкритті нового заводу. Військові пропагандистські плакати неминуче закликають чоловіків Орєнбурґа стояти на сторожі, щоб врятувати новий Орєнбурґ голови. І щотижня надходять звіти про розширення поставок промислових товарів або про наших хоробрих чоловіків, оснащених новою зброєю завдяки реформі голови. Спостережлива людина могла також помітити заміну депутата Кузнєцова з посади голови міністерства культури та комунікацій Орєнбурґа. Цинічна і спостережлива людина могла б зацікавитися пониженням товариша Кузнєцова. Чистий цинік міг би навіть повірити чуткам, що Кузнєцов був звільнений за відмову повністю присвятити себе розвитку культу особистості голови Маленкова. Але, на щастя, хороші працівники з Орєнбурґа ніколи не бувають цинічними. Ця жахлива риса характеру, така поширена в відчужених капіталістичних суспільствах світу, не має місця в Оренбурзі, особливо в серцях тих, чия доля була змінена завдяки наполегливій праці голови Маленкова."
