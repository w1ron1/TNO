 orenburg_reformist_malenkov: "§YҐєорґій Малєнков§!"
 orenburg_reformist_undecided: "§Yне визначено§!"

 ore_push_reformist_party_to_burba: "Схилити реформістів до Бурби"
 ore_push_reformist_party_to_malenkov: "Схилити реформістів до Малєнкова"
 
 ORE_category_centralization_gamble: "Скористатися ситуацією з централізацією"
 ORE_category_centralization_gamble_desc: "Анархістську природу Орєнбурґа поступово підточували як у громадських дискусіях, так і в колись страхітливо неефективній Раді. Усе це робилося заради політичних переваг централізації для комун. Однак потрібні реформи - розширення призову, зміна економічної політики й набір додаткових ополчень - досі вимагають часу та політичних зусиль для погодження. Деякі рішучіші реформісти бачать у нинішній популярності централізації нагоду швидко протягнути непопулярні, але необхідні реформи. У довгостроковій перспективі це може зашкодити спільному ухваленню рішень, зате краще підготує Орєнбурґ до теперішніх викликів."
