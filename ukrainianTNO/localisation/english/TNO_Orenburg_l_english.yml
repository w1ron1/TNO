 ORE.515.a: "Газети кажуть, що голова Малєнков знову збільшив шоколадні пайки!"
 #Leage Call in events
 ORE.1000.t: "Заклик про допомогу"
 ORE.1000.d: "Світанок. У ранні години Орєнбурґ завжди здається найжвавішим: він пульсує військовою діяльністю, транспорт перевозить війська на фронт і з фронту, дипломатичні посланці й урядовці квапляться доправити звіти, що давно мали надійти. Але навіть його керівники не можуть заперечувати, що останнім часом цей рух став млявим. Тіні довкола їхніх очей оповідають історію не поразки, але, безперечно, чогось іншого, ніж перемога.\n\nПро те саме свідчать ветерани без руки чи ноги, відірваної в боротьбі з Чорною бригадою; господарства, що спорожніли без братів, батьків і синів. Орєнбурґ продовжує боротися, але в його голосі чути легке тремтіння, а на безкраїх просторах суспільної свідомости панує не надія, а сумнів. І Бригада невпинно стежить та вчиться, і хто знає, коли вона силою здолає Революцію?\n\nРада гризе сама себе, наче спійманий у пастку нічний гризун, і поринає в нескінченні дебати. Однак удосвіта стається диво. Рада доходить одностайної згоди в цьому питанні й пропонує рішення: покликати Уральську гвардію, своїх таємничих благодійників. Ніхто в Раді не довіряє їм цілковито, але груба арифметика плоті й крови очевидна та приваблива. Нехай краще загинуть їхні сини, батьки й брати, ніж наші.\n\nА за цією думкою ховається ще тривожніша втома: Комуни вже не можуть виграти цю війну самотужки, і для збереження соціялізм мусить спертися на інших."
 ORE.1000.a: "Покликати Лігу на допомогу!"
 ORE.1000.b: "Революція мусить перемогти самотужки!"
 
 ORE.1001.t: "Відчай"
 ORE.1001.d: "Завжди той самий танець, завжди ті самі виконавці. Дипломатичні зносини між Орєнбурґом і Лігою змінюються день у день, але звична рутина залишається заспокійливою константою, принаймні для дипломата з Ліги. Та останнім часом це змінилося.\n\nНадійшло офіційне прохання від Комун, загорнуте у звичну пасивно-агресивну риторику: «Не те щоб Революції була потрібна ваша допомога в боротьбі, д-дурні!» Моральне позерство й припущення про власну вищість лишилися незмінними. Зникла певність: від колишньої віри в Перемогу Соціялізму над Бандитським Капіталом не лишилося й сліду, тільки вразливість і дедалі відвертіше визнання «неочікуваного розвитку подій». А за лакованими словами дипломат Ліги відчуває біль. Бездонний біль.\n\nПишучи звіт, він чомусь згадує дядька, який утратив усіх синів у нещасному випадку на полюванні десь на сході. Біль у його очах раптом здається знайомим - і дипломат усвідомлює, що кожна його зустріч із Радою Орєнбурґа була процесією сповнених болю очей і прихованої скорботи. Навіть вини.\n\nВін здригається й завершує звіт. Остаточне рішення лишається за Мєнвіком і його клікою, але дипломат знає, що мусить порадити. Ліга не може стояти осторонь, поки душі невинних пливуть у темряву; адже саме це і є мучеництво, а їхня пролита кров волатиме про справедливість."
 ORE.1001.a: "Орєнбурґ кличе на допомогу, і ми відповімо."
 ORE.1001.b: "Ми не можемо дозволити собі допомогти Орєнбурґу."
 
 #NKVD chain
 ORE.1050.t: "Пропозиція НКВД"
 ORE.1050.d: "Сьогодні НКВД Маґнітоґорска надіслав Робітничій раді пропозицію. Стверджуючи, що тепер вони є провідною силою російського Уралу, вони вирішили, що наше становище в їхній сфері мусить змінитися, і у своїй «доброзичливій мудрості» постановили запропонувати нам автономію у складі їхньої держави. Комуни збережуть незалежність, а Робітнича рада й далі існуватиме. Однак ми опинимося під владою НКВД і будемо змушені надсилати їм податки й солдатів для їхніх армій, фінансуючи військову машину НКВД. НКВД зможе присилати комісарів і своїх урядовців, щоб «захищати державу від контрреволюційних загроз». Утім, очевидно, що це лише погано замасковане використання таємної поліції для придушення нашого народу. Дуже ймовірно, що НКВД не поставиться прихильно до відмови від їхньої пропозиції. Вони щойно завершили війну з бандитами й залюбки пошлють війська на захід, якщо ми відмовимо. Перед нами вибір: автономія під владою НКВД і втрата частини свобод або збереження незалежности й можлива лють військової машини НКВД. У Робітничій раді оголошено голосування."
 ORE.1050.a: "Комуни голосують схилити коліно."
 ORE.1050.b: "Комуни голосують зберегти незалежність."
 
 ORE.1051.t: "Вимога НКВД"
 ORE.1051.d: "Виявивши разючу нахабність, войовничість і схильність до залякування, НКВД надіслав Робітничій раді вимогу приєднати комуни Орєнбурґа до своєї нової диктаторської держави. Вони посилаються на те, що в цьому небезпечному світі росіяни мусять триматися разом, а тепер, коли Дірлеванґер і його посіпаки мертві, Робітничій раді нема чого боятися на Уралі. Вони заявляють, що НКВД захистить комуни й що селянам буде краще під їхньою турботливою та спрямовувальною рукою, а не під рукою Робітничої ради. Якщо комуни приймуть цю пропозицію, усі права й свободи, за які вони боролися, опиняться в руках НКВД, що не славиться добрим ставленням до інакодумців. Оголошено голосування, і кожній комуні наказано прибути, бо в цьому питанні мають прозвучати голоси всіх комун. Що вони оберуть: анексію під чоботом НКВД чи боротьбу за свою свободу?"
 ORE.1051.a: "Ви можете забрати наші життя, але ніколи не заберете нашої свободи!"
 ORE.1051.b: "Підкорення краще за смерть."
 
 ORE.1052.t: "Пропозиція дружби"
 ORE.1052.d: "Посланець НКВД зі звичною нахабною гордістю й самовпевненістю розвідувальних служб, яку багато хто пам'ятав іще із совєцьких часів, сів перед Робітничою радою й почав обґрунтовувати поліпшення відносин між двома нашими племенами на цьому пекельному терені. Разом ми здолали безумство Дірлеванґера, довівши, що російська солідарність здатна перемогти німецький антагонізм. Та наша перемога не була легкою й коштувала комунам великої крови. Чи можемо ми в такому становищі сподіватися, що колишні гнобителі дотримають слова й справді не зазіхатимуть на нашу автономію? Зі звичною вправністю в читанні людських почуттів маґнітоґорський делеґат почав перелічувати інші проблеми краю, загрози, здатні знищити обидві сторони, якщо вони не об'єднаються як співвітчизники-соціялісти. Але соціялізм НКВД дещо відрізнявся від соціялізму, якому віддавали перевагу багато мешканців комун. Як і раніше у випадку з гвардійцями, постало питання: як централізований режим зможе ефективно співпрацювати з нашою демократичною системою? Та Рада все одно провела голосування."
 ORE.1052.a: "Посланцеві доведеться повернутися додому з порожніми руками."
 ORE.1052.b: "У такі часи нам потрібні друзі."
 
 ORE.2500.t: "Гвардія тримається"
 ORE.2500.desc: "Сталося найгірше. Наших союзників на Уралі розгромили есесівські головорізи, і, схоже, настав наш час.\n\nОднак ми не самі. Дехто пережив погром Уральської Ліги й тепер іде нам на допомогу. Це добре нагадування, що ми не самотні в боротьбі проти мерзенної бригади Дірлеванґера, і, схоже, вцілілі негайно стануть нам у пригоді. Загартовані суворим життям і хрещені вогнем, ці чоловіки стоятимуть пліч-о-пліч із народом Орєнбурґа, готуючись віддати життя за захист нашої батьківщини. Їхня незламна воля до боротьби має стати взірцем і для наших солдатів. Вояки Уральської Ліги належать до найхоробріших з-поміж усіх, хто будь-коли служив, тож навіть у ці тяжкі часи ми маємо бути вдячні, що вони вирішили продовжити боротьбу. Їхні командири влилися в нашу структуру, і вони, безперечно, готові на найвищу жертву, якщо вона принесе Росії свободу й волю. Ми не можемо дозволити їм загинути марно!\n\nТа становище критичне, а загроза нашого падіння велика як ніколи. Зі сходу безперервно надходять звіти про злочини Бригади, а нечисленні біженці, що залишилися, оповідають моторошні історії про її зґвалтування та грабунки. Очевидно, що Дірлеванґер - не іграшка, з якою можна забавлятися, а наша поразка означатиме хаос і страждання для всього Орєнбурґа, не кажучи вже про Росію! Кожен чоловік і кожна жінка мусять за всяку ціну боротися з цією карою Божою, якщо завдяки цьому наші діти житимуть у вільному краї!"
 ORE.2500.a: "На фронт!"
 ORE.2500_tt: "Ми сформуємо нову дивізію з уцілілих бійців §YУральської Ліги§!."
 
 # other deal
 
 ORE.163.t: "Відмова"
 ORE.163.d: "Уральська Ліга... відхилила прохання Ради про союз.\n\nНе так давно вони вперше з'явилися біля наших найдальших колгоспів. Селяни повідомляли про невеликі групи чоловіків і жінок у бойовій формі та зі змученими обличчями, із смертоносними гвинтівками за плечима. Озираючись назад, ми розуміємо, що то були лише розвідники, які вперше зустріли цивілізацію після того, як, за переказами, вони залишили цивілізацію.\n\nТа ми, звісно, побачили все інакше. З усіх боків нас оточували бандити, вбивці й німці; ми були слабкі й беззахисні навіть перед лютим зимовим снігом... і побачили рятівників - братів по зброї в боротьбі проти жадібних, ненаситних і кровожерливих - усіх, хто з непогамовною хіттю зазіхає на багатства Орєнбурґа. Нам здалося, що майбутнє Орєнбурґа вперше стало хоч трохи світлішим.\n\nТепер Рада приголомшено завмерла. Та перш ніж поновляться звичні крики й звинувачення; перш ніж уряд Орєнбурґа залишить народ беззахисним перед прийдешньою різаниною; і перш ніж останній світлий промінь надії Комун згасне, усі члени Ради подумали як один:"
 ORE.163.a: "«Що ж нам тепер робити?..»"
 
 #Culture events
 ORE.140.t: "Встановлення істини"
 ORE.140.d: "Колись історію Орєнбурґа спотворювали брехливі оповіді й твердження про його засновників і провідників. За товариша Малєнкова це почало змінюватися. Тепер усюди висять зображення керівників комун та їхніх злочинів, які показують народові, як ті намагалися втримати нас у слабкості. Бурбу з його божевільними мареннями стерто з книжок; його пляни тепер або забудуть, або пам'ятатимуть як творіння їхнього справжнього автора - товариша Малєнкова! Історію пишуть переможці, й оскільки перемогли ми, тепер маємо нагоду встановити істину, щоб майбутні покоління не були скеровані на хибний, контрреволюційний шлях."
 ORE.140.a: "Ще один крок до кращого Орєнбурґа!"

 ORE.141.t: "Нова молодь для нового дня!"
 ORE.141.d: "Молодь Орєнбурґа, як і решта краю, була неорганізованою й не вихованою в чеснотах, потрібних для виживання. Однак за товариша Малєнкова це починає змінюватися. Створення Комсомолу, або Всесоюзної ленінської комуністичної спілки молоді, стало частиною нової ініціятиви, покликаної відвернути дітей від релігійних догм і натомість прищеплювати атеїстичний світогляд. Під проводом старших членів партії комсомольці працюватимуть над закриттям церков та інших буржуазних установ і натомість пропагуватимуть належні соціялістичні цінності.\n\nУтім, ми зіткнулися з певним опором. По-перше, молодим людям не подобається відчуття, ніби їм наказують, що робити, тож виникли хуліганські банди й угруповання. Ще більшу тривогу викликають їхні батьки: чимало з них звинувачують нас у тому, що ми «чужинці» й руйнуємо родинний уклад. На ці звинувачення ми відповідаємо просто: так, саме це ми й робимо. Діти мають розвиватися, щоб служити спільному благу Орєнбурґа й Росії, а не дозволяти батькам тягнути їх назад. Зрештою, хіба Христос, якого вони так люблять, не казав, що слід покинути родину, якщо це потрібно, аби піти праведним шляхом? Із контрреволюційними догмами в родині треба боротися за будь-яку ціну."
 ORE.141.a: "Кажуть, це погана ідея, але що вони тямлять?"

 ORE.142.t: "Навернення"
 ORE.142.d: "На столі старого Маркова знайшли листа. У ньому було написано:\n\n«Я вірив у свободу, справді вірив. Коли комуна попросила моєї довіри та їжі, я не пошкодував нічого. Коли мене попросили прихистити уральських солдатів, я віддав їм власну кімнату. Я любив свою свободу й був готовий віддати себе служінню їй.\n\nМені надали привілейоване становище в комуні, і я вірив, що моїх власних учинків цілком вистачить для підтвердження моєї благонадійности. І я ніколи не зловживав цим становищем. Я любив комуну й досі люблю своє село. Служіння задля захисту нашої свободи для мене не тягар.\n\nАле коли Свєтлана, світло мого життя, злягла від тремтіння й гарячки, мені відмовили, відмовили, відмовили. Це потрібно голові та його родині, сказали мені. Це потрібно шановним гостям. Члени Ради, про яких я ніколи не чув, були для комуни ціннішими за мою доньку, яка задихалася у своєму ліжку, а життя згасало в ній із кожним подихом.\n\nА коли настав час похорону, коли Марія не могла стояти від горя, комуна не зробила нічого. Ось яка була нагорода за моє добровільне служіння - ніщо.\n\nМалєнков безжальний і жорстокий, я це знаю. Але він буде кращим за порожні обличчя людей, які дивилися, як моя донька згасає, розводили руками й ледь усміхалися. Принаймні його кара буде справедливою й суворою.\n\nСвобода не варта геть нічого без справедливости. А Малєнков - це справедливість».\n\nНаступного лютого старого Маркова вбили під час поліційної операції з придушення малєнковських заворушень."
 ORE.142.a: "Урал просолений нашими сльозами."

 ORE.143.t: "Нарікання селянина"
 ORE.143.d: "Маленьке віддалене господарство занепадало, хоч стояло на краю великого лісу. Та що міг самотужки вдіяти старий селянин, якому лишилися тільки останні клапті землі, ще не відібрані природою? Він чув неймовірні історії про Орєнбурґ і несподіваний розквіт, якого той зазнав, ставши сяйливим маяком надії серед вируючого моря темряви й смерти. Спокійно споглядаючи мерехтливе призахідне сонце й даючи своїм виснаженим м'язам короткий, але вкрай потрібний перепочинок, він замислився, як то було б жити в місті - у місці, де реформи й індустріялізація створили такий рівень життя, якого мешканці зовнішніх комун не могли навіть уявити. Він уже майже впіймав себе на бажанні прожити інше життя, та відігнав таку егоїстичну думку. Глибоко зітхнувши, він прошепотів ім'я коханої, яку так безцеремонно й раптово відібрали в нього, і замислився, чи пишалася б вона їхніми дітьми так само, як пишався він. Вони жили в тому великому місті, будували власне майбутнє й несли далі надію, що народилася разом із ними. Коли він думав про них, його зморшкуватою, обпаленою сонцем щокою скотилася самотня сльоза. Але треба було повертатися до роботи."
 ORE.143.a: "Чим ми жертвуємо заради тих, кого любимо."

 ORE.144.t: "Явлене лицемірство"
 ORE.144.d: "У великій залі Робітничої ради панував цілковитий безлад - явище не рідкісне, але цього разу сум'яття мало особливо обурений і скандальний відтінок. Здавалося, усе почалося через самотнього представника зовнішньої комуни, який і далі стояв прямо й гідно, попри шалені образи, що лунали на його адресу з усіх куточків зали. Його промова була не чим іншим, як повномасштабною критикою чинної економічної системи, яку мусили терпіти поселення за межами Орєнбурґа, та її жахливих наслідків для рівня життя. Вочевидь, будь-яка критика анархістської форми соціялізму, якої дотримувалися комуни, навіть цілком обґрунтована, як у цьому випадку, викликала в Раді глибоку тривогу й майже екзистенційний жах. Неначе удари під дих чи ляпаси по обличчю, зусібіч летіли слова «зрадник» і «фашистська наволоч». А він лише запропонував спрямувати частину прибутків Орєнбурґа на інвестиції в сільські поселення, якими місто мало б бодай трохи опікуватися, адже саме вони постачали йому більшу частину харчів. Тут зі свого місця, важко сопучи, підвівся доволі огрядний чоловік і грюкнув по столу перед собою, трохи стишивши гамір у залі. Замість початкової пропозиції він зажадав поставити на голосування обмеження свободи слова на засіданнях Ради, коли йшлося про засадничі традиції комун. Відчуваючи цілковите роздратування й огиду до очевидно вдоволеного блазня, який щойно підвівся, та до численних прихильників його пропозиції, перший представник у глибокому розчаруванні сів на місце. Знову нічого не зміниться."
 ORE.144.a: "Судилище божевілля."

 ORE.145.t: "До Орєнбурґа прибувають науковці"
 ORE.145.d: "Вони прибули рано-вранці. Виснажена група чоловіків і жінок: дехто в лабораторному халаті, інші просто в цивільному одязі, але всі вони були серед найкращих умів у своїх галузях. Вони прийшли з Чорної Гори, потайки оминаючи патрулі Маґнітоґорска, а тоді ще два дні йшли пішки до Орєнбурґа, та зрештою дісталися.\n\nЛише коли їх підібрало патрульне ополчення на околицях, нагодувало, напоїло й запевнило, що тут вони будуть у безпеці, вони почали говорити про жахіття, побачені в Чорній Горі. Напівпошепки й крізь ридання вони розповідали про досліди, які проводили, бо не мали вибору або спочатку вірили у «вище благо». Вони бурмотіли про викрадення, примусове розмноження та вівісекції.\n\nДехто взагалі відмовився говорити.\n\nЛюди Бурби пообіцяли їм притулок. Науковцям дадуть місце для проживання, але лише за умови, що вони працюватимуть на Орєнбурґ та його дослідницькі відділи. Їх довелося трохи переконувати й довести, що тут справді діє етичний кодекс, але зрештою всі науковці долучилися до міських починань."
 ORE.145.a: "Ця гора мене непокоїть..."

 ORE.146.t: "Рука, що годує"
 ORE.146.d: "Хаос охопив проспект Побєди.\n\nКров дітей Орєнбурґа тепер стікає бортами щойно виготовлених автомобілів. Вона тече до нововикопаних стоків. Збирається калюжами довкола чобіт нещодавно вишколених поліціянтів для придушення заворушень.\n\nМодернізація багато в чому потрясла Орєнбурґ до самих основ, і багато в чому це пішло на користь! Люди працюють. Люди їдять. Люди насолоджуються добробутом, про який і мріяти не могли ще якихось кілька років тому. Орєнбурґ став осяйним маяком у пітьмі Росії.\n\nАле цей перехід не бездоганний, бо люди знають, що втратили щось важливе. Вони відчувають цю болісну відсутність, коли засинають; без цього їм страшно під пильними поглядами дедалі численнішої армії поліціянтів Бурби; вони відчувають, як воно поволі вислизає з них і зникає, поки вони без упину гарують на фабриках без права голосу, а часто й без платні.\n\nЛюди Орєнбурґа втратили свободу.\n\nПротести були цілком очікуваними. Принаймні так здається, адже поліція була більш ніж готова, коли вони почалися. Відважні й горді студенти йшли проспектом Побєди, коли на них налетіли десятки поліціянтів із новенькими щитами для придушення заворушень і поясами, обвішаними новими сльозогінними гранатами.\n\nУ хід пішли кийки, пролунали постріли, і до кінця дня майже десяток найкращих молодих умів Орєнбурґа лежали на вулиці, хапаючи останні подихи, а понад сотня інших, хитаючись, розходилася геть із ранами від незначних до смертельно небезпечних.\n\nНевже це ціна прогресу?"
 ORE.146.a: "Чим іще ми мусимо пожертвувати заради цього майбутнього?"

 ORE.147.t: "Дім для знедолених?"
 ORE.147.d: "Ті, кому в цій понівеченій війною країні пощастило мати оселю й місце для нічного відпочинку, рідко співчувають тим, хто потрапив у скруту. Тож більшість гадала, що нова бетонна будівля - лише черговий будинок для декадентів і багатіїв. Але коли двері нарешті відчинилися, чимало мешканців із подивом побачили, що вони відкриті для кожного, кому потрібен теплий прихисток від холоду чи їжа, коли власні запаси вичерпалися. Колишні селяни, які роками безцільно блукали в пошуках чорної роботи або місця для ночівлі, тепер нарешті можуть відпочити.\n\nРеформа Орєнбурґа Алєксандра Бурби принесла не лише обіцянки демократизації, а й мету створити систему соціяльної опіки для знедолених мас Уралу. Тепер, із відкриттям у самому Орєнбурзі перших у Росії притулків для бездомних, стало очевидно, що втілення цієї високої мети вже розпочалося. У промові на відкритті закладу Бурба сказав, що в певному сенсі через роз'єднаність і постійну непевність усі росіяни бездомні, та представив відкриття притулку як перший крок не лише до подолання бездомности, а й до того, щоб знову зробити Батьківщину єдиним цілим. Нам лишається тільки сподіватися, що цих безпритульних волоцюг у великому вигнанні чекатиме краще майбутнє."
 ORE.147.a: "Про суспільство судять за тим, як воно ставиться до своїх найбідніших."

 ORE.148.t: "Угода Бурби"
 ORE.148.d: "Працюйте! Працюйте заради своїх родин! Працюйте заради товаришів! Працюйте заради промисловости, Орєнбурґа й товариша Бурби!\n\nУ межах найновішого пакета Бурбиних реформ, лише одного з кількох десятків, запроваджених за останній місяць, робітники шикуються в черги за роботою на численних нових фабриках і фермах Орєнбурґа, де їм пропонують платню, якої Росія не бачила десятиліттями. Сотні вже знайшли роботу на цих нових промислових підприємствах, і тепер уздовж вулиць стоять не зневірені й голодні, а завзяті робітники в чергах за щоденною платнею чи пайком. Тепер кожен, безперечно, може йти вулицею й пишатися своїм містом; і хоч у задушливому від сажі повітрі стало трохи важче дихати, це невисока ціна за те, що громадяни Орєнбурґа тепер легко знаходять роботу й пожинають плоди власної праці. Там, де колись через брак світла темніли вікна, а через погану каналізацію на вулиці викидали відходи, тепер панує розкіш!\n\nПоряд із дедалі численнішою верствою робітників зростає й верства діловодів, керівників середньої ланки та бюрократів, які її обслуговують. Середній клас уже відокремився в багатьох новозбудованих кварталах, де його представники можуть дозволити собі розкішніші помешкання, ніж ті, що доступні робітникам. І це ще не кажучи про тих, хто стоїть над ними! Коли фабрики з гуркотом оживають, обертаються й колеса промисловости, а найбільше з руху цих коліс виграють багаті й заможні. Ті, кому вистачило вправности, хитрости й безжальности, щоб стати провідниками нашого прекрасного міста.\n\nТак, небо може бути чорним. Так, лікарні можуть бути переповнені робітниками, які втратили пальці й руки в нещасних випадках на фабриках. Так, цінний простір у місті тепер можуть займати величезні маєтки й інші оселі верхівки. Але народ Орєнбурґа охоче заплатить цю ціну, адже тепер він живе в майбутньому! Або принаймні в сучасності."
 ORE.148.a: "Ми сягнули дна й тепер ідемо вгору."

 ORE.149.t: "Спроба перевороту"
 ORE.149.d: "Засідання було звичайним: довгим і нудним, але все одно необхідним. Члени Ради монотонно говорили й обговорювали все в порядку денному - від найважливішого до найдрібнішого. Дехто позіхав, але всі виконували важливу роботу. Бурба сидів на чолі столу й видавався надзвичайно зацікавленим у доповіді про п'ятивідсоткове зростання врожайности в маленькому селі на східній околиці.\n\nПоки промовець і далі виголошував монолог на цю тему світового значення, через двері з обох боків зали один за одним почали заходити солдати. Вони вишикувалися колом і оточили стіл, за яким засідала Рада. Усі присутні мали або переляканий, або похмурий вигляд, окрім Бурби: той і далі наче був захоплений прісною промовою члена Ради, який нічого не помічав і без упину розводився про розподіл нового зерна й те, як повторити цей успіх в інших селах. Зрештою промовець помітив солдатів довкола себе, раптово замовк і нервово ковтнув.\n\nПохмурі члени Ради підвелися, й їхній провідник зловісним голосом заявив Бурбі, що той мусить піти із цими солдатами. Його керування обернулося катастрофою і мало скінчитися. Бурба злегка кивнув, а тоді сказав: «О, у цьому не буде потреби». Члени Ради розгубилися, а тоді їхні обличчя разом спотворив жах, коли вони зрозуміли, що солдати ціляться в них, а не в Бурбу. Їх вивели, а Бурба закликав поновити засідання. «Я заздалегідь коротко поговорив із охороною. Скажімо, інтуїція підказала. Повернімося до справ»."
 ORE.149.a: "Хитрий, як лис."

 ORE.150.t: "Нова демократія?"
 ORE.150.d: "Однією з небагатьох незмінних рис устрою різних комун Орєнбурґа є те, що вибори завжди відбуваються протягом довгої зими, коли поля порожні, а населення села тулиться по хатах. Довгими вечорами люди обговорюють події року й оцінюють роботу свого представника в місті Орєнбурзі. Перш ніж весна повернеться до полів і селян, обирають нових керівників, які очолюватимуть комуну протягом року й представлятимуть її в Робітничій раді та на конґресах.\n\nІдея партійної політики поширювалася Орєнбурґом повільно, адже кожна комуна сама порядкувала власними справами, а місцеві громадяни голосували за особисто знайомих чоловіків. Але заплутані механізми Робітничої ради почали творити гурти друзів і ворогів, об'єднаних чи розділених спільними поглядами на майбутнє Орєнбурґа. Виходячи з інтересів міста Орєнбурґа й необхідности об'єднання задля розв'язання регіональних проблем, наші попередники з реформістської фракції почали формувати коаліцію представників, які виступали за централізацію. У відповідь сформувався великий блок автономістів, покликаний захищати права комун. Зміни в робітничій демократії то руйнували союзи, то зводили нових людей, а різноманітні інші неформальні партії виникали й зникали.\n\nПроте, за словами наших агентів, цього року все змінилося. Наші зусилля обрати голову Бурбу й надати йому мандат на докорінні зміни в Орєнбурзі глибоко вплинули на прийдешні вибори. Чимало фракцій увійшло до нашої нової Партії прогресу й розвитку, тоді як колись усемогутня Автономістська партія розпадається.\n\nЗавдяки стратегічному підкупу й перетягуванню на свій бік найкращих умів із комун, які могли б нам протистояти, ми зуміли звузити список кандидатів у всьому регіоні до членів нашої партії та кількох незалежних. В Орєнбурзі постає новий різновид партійної політики: честолюбні чоловіки усвідомлюють, що здобути місце за політичним столом можна лише ставши на наш бік. Доба, коли обструкціоністи були впливовою силою в політиці Ради, нарешті минула."
 ORE.150.a: "Менше політики в Орєнбурзі, більше управління."
 
 ORE.600.t: "Чорну бригаду нарешті розгромлено!"
 ORE.600.desc: "Сьогодні на світанку останню групу бандитів із Чорної бригади привели на поля страти. Німців, росіян і казахів витягли з місця, де їх тримали прикутими, й повели на пагорб до їхнього останнього спочинку. Якби хтось із переможених бандитів мав бодай якийсь хист до філософії, то, можливо, побачив би похмурий жарт у тому, що гвинтівки, які невдовзі обірвуть їхні життя, викували в робітничих комунах, котрі вони колись вважали легкою здобиччю.\n\nЗагроза вторгнення бригади Дірлеванґера назавжди змінила Орєнбурґ. Дехто, можливо, довіку проклинатиме нову владу, яку породила бандитська криза; інші ж були вдячні, що в найтемнішу годину їхні співвітчизники згуртувалися й відвернули апокаліпсис.\n\nБандитам не дали ані суду, ані жодної нагоди захистити себе та свої вчинки. Відколи в п'ятдесятих роках Дірлеванґер уникнув смерти від рук Ганса Шпайделя, він та його люди прокладали собі шлях Росією грабунками й масовими вбивствами. Примножуючи таким чином страждання російського народу, король бандитів створив власну чорну легенду. Тепер кожен, кого викриють у будь-яких зв'язках із ним, справедливо приречений на смерть.\n\nВ останній битві війни війська Орєнбурґа прорвали оборону ослабленої Бригади й атакували її останній опорний пункт. Дірлеванґер намагався померти так само, як жив, - б'ючись і вбиваючи разом зі своїми людьми. Та в останньому акті кармічної справедливости один із його ж людей оглушив ватажка, сподіваючись обміняти короля бандитів на помилування. Старого німця притягли до Орєнбурґа, де натовпи несамовито щасливих громадян зібралися подивитися на його страту.\n\nЦього останнього дня бандит-зрадник приєднався до свого товариша на полях страти. Трупи злочинців удобрять землю Матері-Росії. Доречний епілог для тих, хто все життя палив землі невинних чоловіків і жінок."
 ORE.600.a: "Справедливість перемогла!"

 ORE.601.t: "Безумство Чорної Гори розвіяно!"
 ORE.601.desc: "Сьогодні вранці бійці Орєнбурґа розпочали останній наступ на Чорну Гору. Виснажені й деморалізовані солдати НКВД Маґнітоґорска втрачали одну оборонну позицію за іншою. Це були вже не ті налякані й ізольовані селяни, яких головний науковець колись наказував їм викрадати; полум'я війни загартувало чоловіків Орєнбурґа. Крок за кроком армія комун прорубувалася крізь оборону Маґнітоґорска. На фронт привели шахтарів, щоб вони проклали нові шляхи вглиб гори, обвалюючи величезні ділянки тунелів на голови нещасних бійців НКВД. Як могли залишки Червоної Армії відряджати загони проти шахтарів? Людські ресурси й боєприпаси вже вичерпувалися до критичного рівня.\n\nОстаннього удару завдали не підрозділи важкого озброєння Орєнбурґа, що безупинно гатили по головних тунелях. Не прийшов він і згори, коли відважні рейдери спустилися шахтними стволами до самого серця Чорної Гори. Ні, останній удар прийшов ізсередини лабораторій. Нажахані офіцери НКВД почули по радіо про повстання виснажених в'язнів, яких хтось якимось чином випустив із камер. Позиції, укріплені проти зовнішнього світу, швидко захопили жертви Чорної Гори.\n\nДо раннього пополудня кілька дивізій НКВД підняли білий прапор, відчайдушно намагаючись урятуватися від хвилі жертв експериментів, які вирвалися на волю. Офіцери Орєнбурґа відмовили в будь-якій пощаді співучасникам експериментів Чорної Гори. Невдовзі останні осередки опору НКВД оточили й знищили.\n\nБійці Орєнбурґа слухали безумні просторікування звільнених в'язнів про кошмар зі сталі та скла, схований у глибинах гори. Невелика оперативна група досвідчених солдатів вирушила до лабораторної зони. Один за одним бійці поверталися з білими від жаху обличчями. Нарешті з глибин повернувся їхній офіцер із останнім експериментальним щоденником Лисенка. Пізніше того дня він читав журнал, сторінки якого освітлювало полум'я, що очищало надра Чорної Гори, -\n\n"Запис у щоденнику 1428-F - Непередбачена технічна складність, спричинена групою 'Орєнбурґ' - Див. документ про місцеві фракції 13 гамма - Зразки проєкту -ВИЛУЧЕНО- мають пройти раннє польове випробування. Наказ інтернові Анатолію принести мені ключі від камер утримання"."
 ORE.601.a: "Нарешті ми можемо покласти край цьому безумству."

 ORE.602.t: "Капітуляція НКВД"
 ORE.602.desc: "Сьогодні вцілілі командири НКВД підняли білий прапор над своїми останніми укріпленнями. Бійці Орєнбурґа дякували долі, що їм не довелося воювати проти безумного Лисенка. Божевільний науковець, найімовірніше, тримався б до гіркого кінця.\n\nОфіцери НКВД вийшли вперед і передали зброю своїм колегам із сил безпеки Орєнбурґа. Залишки Червоної Армії похмуро переживали поразку. Вони мріяли відновити Совєцький Союз і навести порядок на беззаконних просторах російської анархії. Деякі амбітніші офіцери плекали мрію знову побачити червоні стяги комунізму над усією планетою. Це мало довести, що мрія про робітничу революцію не була провальним експериментом, розчавленим німецьким чоботом.\n\nТа, можливо, вони просто не були людьми, здатними впоратися з цим завданням. Вони боягузливо ховалися в тіні Чорної Гори, марнуючи час і добрих людей на збочені завдання Лисенка. Решта Росії рушила далі без них. Можливо, справжнім прапороносцем волі робітників стане Орєнбурґ, перекований у горнилі конфлікту.\n\nЗвісно, такого висновку дійшли не всі офіцери НКВД. Дехто звинувачував своїх людей, інших офіцерів або випадкові обставини, на які не міг вплинути. Іноді порядок просто не здатен перемогти хаос. На думку цих людей, разом із загибеллю НКВД згасла й остання надія на впорядковану та сучасну Росію. Краще здатися тому набродові й запитися до смерти, поки російська анархія триває."
 ORE.602.a: "Безглузду примарну мрію поховано."
 
 ORE.517.t: "Орєнбурґ починає озброюватися"
 ORE.517.d: "У рухах жителів Орєнбурґа, які поспішали людними міськими вулицями, відчувалася майже осяжна напруга. Комуна, зазвичай оповита невпинною нерішучістю через численні комітети й політичні чвари, нарешті згуртувалася навколо чіткої мети. Брязкіт металу та інші звуки праці змішувалися з напругою, що зависла над містом. Цей гамір був голосом єдиного організму, що готувався зустріти зовнішні сили, які загрожували самому його існуванню.\n\nКожна майстерня, кожен дім, де були інструменти, працював над виготовленням стрілецької зброї та боєприпасів для себе й ополчень, які треба було зібрати для організованої оборони. Попри брак централізованої організації та контролю, продуктивність була й лишалася винятковою, тож навіть якщо якість підводила, кількість із легкістю це надолужувала."
 ORE.517.a: "Що більше зброї, то краще."

 ORE.518.t: "Алєксєєвка починає озброюватися"
 ORE.518.d: "Новини про стрімке озброєння Орєнбурґа дійшли до міської ради Алєксєєвки лише за кілька годин після того, як імпровізовані майстерні розпочали виробництво в гамірній регіональній столиці. Розуміючи, що Орєнбурґу, ймовірно, знадобляться всі ополчення, які він здатен озброїти, керівники Алєксєєвки мусили організувати оборону міста, щоб захистити річкову комуну.\n\nТут не було й близько стільки промислових потужностей чи ресурсів, щоб переобладнати майстерні та заводи на виробництво стрілецької зброї. Не було й такої кількости охочих добровольців вступити до імпровізованих ополчень, адже значна частина жителів Алєксєєвки вже переселилася до Орєнбурґа. Та це не знеохотило тих відданих справі людей, які залишилися, і вже за пів дня схожий гамір праці було чути до пізньої ночі. Хоч би скільки рушниць змогло виготовити місто, кожна з них бодай трохи посилить оборону анархістського проєкту Південного Уралу."
 ORE.518.a: "Ми мусимо бути напоготові щомиті."

 ORE.519.t: "Стєрлітамак починає озброюватися"
 ORE.519.d: "Друге за величиною місто серед комун Південного Уралу вже давно поставило собі за мету не лишатися вічно в тіні Орєнбурґа за політичною та економічною вагою. Досягти цього, найімовірніше, було неможливо, але сама мета добре налаштовувала робітників і керівників на продуктивну працю. І ось настав найкращий час довести це, адже новини про озброєння Орєнбурґа у відповідь на зовнішні загрози щойно дійшли до міської ради. Листівки, плакати й радіоповідомлення швидко розійшлися Стєрлітамаком, а посланці залишили місто, щоб донести звістку до навколишніх сіл і допомогти їм організувати власні зусилля.\n\nНевдовзі весь регіон кинувся переоснащувати наявну легку й важку промисловість, а для пошуку старої зброї та сировини, потрібної для її виробництва, створили комітет ефективного збору ресурсів. Незабаром зброї стало так багато, що порожні доти склади знову почали наповнюватися. Стєрлітамак буде готовий."
 ORE.519.a: "Озброєне населення зробить нас силою, з якою доведеться рахуватися."
