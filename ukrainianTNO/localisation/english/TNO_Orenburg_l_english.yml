 ORE_soviet_land_survey_legacy_desc: "Після проведеної розвідки Рада Орєнбурґа краще розуміє, як справді забезпечити рівномірніший розподіл землі між людьми. Селяни, рівніші за інших, більше нас не гнобитимуть!"
 ORE_independent_industrial_program: "Незалежна промислова програма"
 ORE_independent_industrial_program_desc: "Наша промисловість, як і наш народ, вільна! Незалежна промисловість неодмінно принесе Орєнбурґу лише користь. Наш народ вільний, наша промисловість вільна, і Орєнбурґ вільний! Наші здобутки й промислова могутність вільної країни неодмінно змусять увесь Урал обертати голови й захоплюватися нашою працею. Побачать вони її здалеку чи просто по сусідству - краса безперечно приголомшить їх."
 ORE_the_new_industrial_council: "Нова промислова рада"
 ORE_the_new_industrial_council_desc: "Завдяки реформам ми створили Раду промислових фахівців. Опора на їхній досвід зміцнить наші промислові можливості. Зрештою, справи промисловости не можна доручати аматорам!"
 ORE_uralian_training_program: "Уральська програма підготовки"
 ORE_uralian_training_program_desc: "Орєнбурґ і Уральська Ліга мусять процвітати разом. Задля цього ми почали співпрацювати з нею у військових питаннях, щоб краще гарантувати безпеку народу. Наші відносини міцніші, наші збройні сили міцніші й наш народ міцніший! Разом із Лігою Орєнбурґ і вільний народ Уралу принесуть просвітлення людям довкола нас!"
 ORE_anarchic_commune_military_2: "Анархічні комуни - військо"
 ORE_anarchic_commune_military_2_desc: "В Орєнбурзі військо переважно складається з народних ополчень, а не з єдиної армії. Підтримка таких ополчень висока, та це не віщує нічого доброго, якщо ми прагнемо створити якісну бойову силу. Через часто хаотичні бойові вигуки ополченців ті нечисленні вищі військові організатори, що в нас є, регулярно зазнають нервових зривів."
 ORE_anarchic_commune_industry_2: "Анархічні комуни - промисловість"
 ORE_anarchic_commune_industry_2_desc: "Орєнбуржці з підозрою ставляться до всього, що бодай трохи нагадує централізацію, і промисловість не виняток. Через це переважна більшість справжніх промислових потужностей існує лише в самому місті Орєнбурзі. За його межами більшість людей може знайти роботу хіба що в сільськогосподарських колективах і примітивних майстернях, що різко обмежує потенційне виробництво комун."
 ORE_anarchic_commune_politics_2: "Анархічні комуни - політика"
 ORE_anarchic_commune_politics_2_desc: "Орєнбурґ - не тиранічний загальнодержавний уряд, а сукупність комун, які добровільно долучаються до політики Ради. Це робить наш уряд украй неефективним, але якщо ми не вислухаємо кожну людину на нашій території, то як зможемо чесно називати себе вільними від тиранії?"
 ORE_anarchic_commune_military_3: "Анархічні комуни - військо"
 ORE_anarchic_commune_military_3_desc: "В Орєнбурзі військо переважно складається з народних ополчень, а не з єдиної армії. Підтримка таких ополчень висока, та це не віщує нічого доброго, якщо ми прагнемо створити якісну бойову силу. Через часто хаотичні бойові вигуки ополченців ті нечисленні вищі військові організатори, що в нас є, регулярно зазнають нервових зривів."
