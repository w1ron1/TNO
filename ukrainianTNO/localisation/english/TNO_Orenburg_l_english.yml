 ORE_anarchic_commune_military: "Anarchic Communes - Military"
 ORE_anarchic_commune_military_desc: "In Orenburg, the army is mostly made up of popular militias instead of a unified military. While the support for such militias is high, this does not bode well if we wish for a quality fighting force. Due to the militias' often chaotic rallying cries, the few higher military organizers that exist routinely suffer from psychological breakdowns."
 ORE_anarchic_commune_industry: "Anarchic Communes - Industry"
 ORE_anarchic_commune_industry_desc: "The people of Orenburg are wary of anything remotely centralized, and this extends to the industry. As a result, the vast majority of actual industrial capacity exists only within the city of Orenburg itself. Beyond the city the only work most may find is in agrarian farming collectives and primitive workshops, severely limiting the potential output of the communes."
 ORE_anarchic_commune_politics: "Anarchic Communes - Politics"
 ORE_anarchic_commune_politics_desc: "Orenburg is not a tyrannical national government, it is a collection of communes who freely choose to enter into the politics of the Council. This makes our government greatly inefficient, as if we do not hear the words of every single person within our territory, how can we truly call ourselves free from tyranny?"
 ORE_forlorn_hope: "Forlorn Hope"
 ORE_forlorn_hope_desc: "The Council may have failed us. They may have not done as they promised. But we are Orenburg. We do not falter due to missteps, no. As we did when our living, breathing idea was birthed, we must persevere. We must survive, for the good of the people!"
 ORE_uralian_industrial_aid_idea: "Uralian Industrial Aid"
 ORE_uralian_industrial_aid_idea_desc: "We have decided to accept the Ural League's offer for industrial aid. The Council has agreed that this offer will bring nothing less than the best for the workers of Orenburg! A toast, to our Ural friends!"
 ORE_uralian_industrial_aid_idea_1: "Uralian Industrial Aid"
 ORE_uralian_industrial_aid_idea_1_desc: "We have decided to accept the Ural League's offer for industrial aid. The Council has agreed that this offer will bring nothing less than the best for the workers of Orenburg! A toast, to our Ural friends!"
