 ita_general_improvement: "Поліпшити Орєнбурґ"
 ita_general_improvement_desc: "Людям подобаються електричне освітлення й опалення в оселях. Людям подобається не викидати нечистоти біля джерела питної води. Людям подобаються доглянуті дороги, якими можна їздити. І людям подобається, коли щотижня хтось безплатно забирає їхнє сміття. Отже, якщо ми скажемо, що для всього цього потрібен певний рівень централізації, людям сподобається й централізація. Звісно, не заради цього ми провадимо громадські роботи. Насправді нам самим теж подобаються всі ці речі."
