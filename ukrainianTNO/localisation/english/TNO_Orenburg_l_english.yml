 ORE_hheavy_industrial_commissariat: "Heavy Industrial Commissariat"
 ORE_hheavy_industrial_commissariat_desc: "Centralized industry is the way to the future! Our people have decided that agricultural or light industry is not the way to go. We must instead become a beacon. A beacon for the workers, a beacon for progress, and a beacon for the people!"
