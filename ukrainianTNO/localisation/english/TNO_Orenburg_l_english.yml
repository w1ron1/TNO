 ORE.500.t: "Справи врядування"
 ORE.500.d: "Дєніска Сопов був новачком на посаді командира одного з численних елітних підрозділів Уральської Ліги. Він дуже серйозно ставився до своєї ролі й радо скористався нагодою очолити оборонне патрулювання довколишнього Орєнбурґа, вважаючи це неодмінно простим, але дієвим завданням, щоб показати свої здібності.\n\nТа вже за кілька годин він зі своїми людьми безнадійно заблукав далеко від запланованого маршруту патрулювання. Помітивши неподалік сільську комуну та гурт селян, що працювали на полях за її межами, Сопов підійшов і попросив показати йому їхнього мера, щоб з'ясувати дорогу. На його подив - адже він майже не знав цього краю - селяни прямо сказали, що мера в них немає. Зацікавлений Сопов попросив пояснити, як тоді керують їхнім селом.\n\nВони розповіли, що громадяни їхньої анархо-синдикалістської комуни по черзі на певний час перебирають обов'язки виконавчого урядника, а всі його рішення щодо внутрішніх справ мають затвердити щонайменше половина комуни, щодо зовнішніх - дві третини. Сопов визнав їхню систему доволі старосвітською й розповів, як Ліга організована за суворою та ефективною ієрархією командирів і підрозділів ополчення. Селяни не вразилися й відповіли, що зграя чоловіків, які сидять у фортецях і роздають пишні титули, - аж ніяка не основа для державного устрою.\n\nПоки вони нескінченно торочили своє, Сопов намагався вставити слово, але так і не зміг їх перебити. Дедалі більше втрачаючи терпіння, він зажадав, щоб йому просто показали того, хто тут головний. Його агресивний тон розлютив селян, які заявили, що це «типова поведінка» гвардійців. Урешті ситий цим по горло й дедалі більше виставляючи себе дурнем перед власними людьми, Сопов гнівно пішов шукати когось, хто міг би дати потрібні відомості, а селяни лишилися нарікати на його втручання."
 ORE.500.a: "Прийдіть і погляньте на насильство, закладене в самій системі!"
 
 ORE.501.t: "Кохання в пустці"
 ORE.501.d: "Родина від неї відреклася. Село її відкинуло. Люди називали її повією та зрадницею. Та Варі було байдуже. Адже сьогодні вона виходила заміж за свого лицаря в сяйливих обладунках.\n\nРуслан був молодим чоловіком з Орска, який після втечі з міста, коли туди прибула страшна Бригада, зрештою взяв до рук зброю в лавах гвардії. Піднявшись по службі, він очолював численні експедиції до Орєнбурґа, щоб допомагати людям, попри їхню загальну ворожість. Він покохав Варю від першого дня їхнього знайомства. Приносив їй квіти з гір, відвідував під час кожного патрулювання й дарував відчуття безпеки у світі жахіть. Коли настав час повертатися до гвардії та готуватися до прийдешньої боротьби, вона благала взяти її із собою, і вони вирішили побратися.\n\nТі, кого вона любила, обернулися проти неї. Для них він був чоловіком, який хотів знищити їхній спосіб життя. Чоловіком, який, імовірно, за тиждень буде мертвим, а з його черепа зроблять кухоль і його нутрощі пожеруть кошмарні бандити. Чоловіком, який забирає її з належного їй місця. Та коли єдиний співчутливий священник провадив їх крізь шлюбні обітниці в тихій улоговині під горами, в усьому світі значення мали лише вони одне для одного.\n\nЗа день молодята вирушили до Бєлорєцка. Варя щиро сподівалася знову побачити родину, коли світ звільниться від бандитів, божевільних науковців і всіх жахіть XX століття. Сподівалася й на те, що Руслан доживе до повернення разом із нею, а її народ із часом прийме його як велику людину, якою він був. Та поки вона була щаслива мирно йти поруч із чоловіком."
 ORE.501.a: "Дивна річ - кохання."
 
 ORE.502.t: "Втручання"
 ORE.502.d: "Іван Алєксандровіч був вірним солдатом Уральської гвардії до самих кісток. Він бився з бандитами в багатьох боях і щоразу виходив із них героєм. Саме тому його призначили охороняти крихітне безіменне село на околиці Комун Орєнбурґа.\n\nВін із товаришами прибув туди, сповнений завзяття й готовности допомогти цим бідним беззахисним людям. Взаємністю їм геть не відповіли. Після прибуття ніхто з місцевих не погодився надати їм житло чи прихисток, тому гвардійцям довелося розбити власний табір на краю містечка. Селяни загалом вороже ставилися до Івана та його друзів і ніколи не продавали й не вимінювали їм їжі чи припасів.\n\nТа одного дня нарешті настала мить, заради якої Іван і гвардійці тут перебували. З півдня наближався невеликий загін бандитів. Гвардійці схопили рушниці й зайняли позиції, готові виконати обов'язок... аж тут сільські вояки почали кричати на них і глузувати. Ці імпровізовані солдати з гіршою зброєю та без жодного вишколу заявили, що впораються самі. Для Івана це стало останньою краплею. Він захистить цих людей, хочуть вони того чи ні. Коли бандити прибули, Івана вже скрутили й відтягли геть за напад на селянина. Решта селян неохоче билася пліч-о-пліч із гвардією, а Іван лежав зв'язаний і кипів від люті. Того дня він не послужив нікому."
 ORE.502.a: "Яка катастрофа."
 
 ORE.503.t: "Випуск 1963 року"
 ORE.503.d: """...звісно, це не означає, що все буде легко. За останні кілька десятиліть наш світ не раз перевертався догори дриґом. Але крізь усе це наше місто вистояло. Саме ви, молоді люди із ясним поглядом, тепер маєте знаряддя й таланти, щоб зберегти наш спосіб життя у світі завтрашнього дня.\n\nМи наближаємося до часу, коли більшість населення вже не пам'ятатиме доби, у яку наша велика Батьківщина була об'єднана під одним прапором. До цієї більшости належить і чимало з вас. Я цілковито вірю, що молодші покоління та майбутні покоління після них не лише побачать кращий світ, а й самі його створять. Вільний від кайданів минулого, я з оптимізмом дивлюся в майбутнє Орєнбурґа.\n\nВаш час студентства завершився. Тепер ви мусите вийти в життя, у світ поза цим університетом, і здійснити великі справи. Для мене було честю бути вашим деканом. Випуску 1963 року, прошу приєднатися до мене у виконанні гімну Орєнбурзького державного університету..."""
 ORE.503.a: "Надихаючі слова."
 
 ORE.504.t: "Рушаємо далі"
 ORE.504.d: "КО-1 негарний. Він не блищить і не має витончених обрисів. Його грані скошені, ковпаки на колесах - прості диски, фарба завжди тьмяно-зелена, а фари нудно-круглі. Сидіння не теплі й не затишні, салон безбарвний, та й узагалі в машині майже немає жодних витребеньок.\n\nА проте для багатьох це найпрекрасніша річ, яку вони бачили в житті.\n\nЦе перший автомобіль власної орєнбурзької розробки, символ свободи й особистої автономії, якому ще не було рівних у державах російських воєвод. Він дешевий у виробництві, простий в обслуговуванні, а за економністю може позмагатися навіть з американськими автівками. У прийдешні роки, коли автомобіль набуде поширення в Орєнбурзі й навіть почне обмежено постачатися до інших країн, КО-1 стане символом національної гордости. Через десятиліття, задовго після того, як заводи припинять його виробництво, справні машини все ще буде відносно легко знайти."
 ORE.504.a: "Де можна такий придбати?"
 
 ORE.505.t: "Перебіжчики"
 ORE.505.d: "Вони прибули рано-вранці. Виснажена група чоловіків і жінок: дехто в лабораторних халатах, інші просто в цивільному одязі, але всі належали до найкращих і найталановитіших фахівців у своїх галузях. Вони прийшли з Чорної Гори, крадькома оминаючи патрулі Маґнітоґорска, а потім ще два дні добиралися до Орєнбурґа пішки, та зрештою дісталися сюди.\n\nЛише коли на околиці їх підібрав патруль ополчення, нагодував, напоїв і запевнив, що вони в безпеці, прибулі почали говорити. Про жахіття, які бачили всередині Чорної Гори. Схлипуючи, вони стиха розповідали про експерименти, які проводили, бо не мали вибору або спершу вірили у «вище благо». Бурмотіли про викрадення, примусове розмноження, вівісекції.\n\nДехто взагалі відмовився говорити.\n\nЛюди Бурби пообіцяли їм притулок. Науковцям дадуть місце для проживання, але лише за умови, що вони працюватимуть на Орєнбурґ і його дослідницькі підрозділи. Їх довелося трохи повмовляти й продемонструвати справжній етичний кодекс, та зрештою всі науковці долучилися до міських починань."
 ORE.505.a: "Ця гора мене непокоїть..."
 
 ORE.506.t: "Рука, що годує"
 ORE.506.d: "Проспект Побєди охопив хаос.\n\nКров дітей Орєнбурґа тепер стікає боками щойно виготовлених автомобілів. Цюрчить у недавно прокладені стоки. Збирається калюжами довкола чобіт свіжовишколених поліціянтів.\n\nМодернізація багато в чому струсонула Орєнбурґ до самого коріння, і багато в чому це було добре! Народ працює. Народ їсть. Народ тішиться добробутом, про який ще кілька коротких років тому неможливо було й мріяти. Орєнбурґ став сяйним маяком у темряві Росії.\n\nТа цей перехід недосконалий, бо люди знають: щось утрачено. Засинаючи, вони відчувають виразну відсутність цього, без цього їм страшно під пильними поглядами дедалі більшої армії Бурбових поліціянтів, і вони відчувають, як воно поволі вислизає з їхніх тіл і зникає, поки вони без кінця гарують на фабриках, не маючи права голосу, а часто й платні.\n\nНарод Орєнбурґа втратив свободу.\n\nПротестів слід було чекати. Принаймні так здається, бо поліція була до них більш ніж готова. Відважні й горді студенти крокували проспектом Побєди, коли на них накинулися десятки офіцерів зі щойно виготовленими протиударними щитами та балонами свіжоприготованого сльозогінного газу на поясах.\n\nЗамахалися кийки, пролунали постріли, і до кінця дня майже дванадцятеро найкращих і найталановитіших дітей Орєнбурґа лежали на вулиці, хапаючи останній подих, а понад сотня інших, затискаючи рани - від легких до небезпечних для життя, - шкутильгала геть.\n\nНевже це ціна прогресу?"
 ORE.506.a: "Чим іще ми мусимо пожертвувати заради цього майбутнього?"
 
 ORE.508.t: "Дім для нужденних"
 ORE.508.d: "Ті, кому в цій пошматованій війною країні пощастило мати оселю, де можна щовечора відпочивати, рідко співчувають тим, хто переживає тяжкі часи. Тож більшість гадала, що нова бетонна будівля - це лише черговий багатоквартирний будинок для розбещених і заможних. Але коли двері нарешті відчинилися, багато мешканців були приголомшені, побачивши, що сюди може зайти кожен, кому потрібен теплий прихисток від холоду чи страва, коли власні запаси вичерпалися. Колишні селяни, які роками безцільно блукали в пошуках бодай якоїсь роботи чи місця для ночівлі, тепер нарешті можуть відпочити.\n\nРеформа Орєнбурґа Алєксандра Бурби принесла не лише обіцянки демократизації, а й мету забезпечити добробут знедоленим масам Уралу. Відкриття в центральному місті перших у Росії притулків для безхатніх доводить, що втілення цієї високої мети вже почалося. У промові на відкритті закладу Бурба сказав, що в певному розумінні всі росіяни бездомні через свою роз'єднаність і постійну непевність, і представив відкриття притулку як перший крок не лише до подолання бездомности, а й до відновлення Батьківщини як єдиного цілого. Нам лишається тільки сподіватися, що на заблукалих волоцюг у цьому великому вигнанні чекає краще майбутнє."
 ORE.508.a: "Про суспільство судять за тим, як воно ставиться до найбідніших."
 #M
 ORE.509.t: "З роботи додому"
 ORE.509.d: "Алєксандр бігав надворі, удаючи героїчного російського аса, який збиває підступні німецькі винищувачі. Сонце вже сіло, але він хотів побачити батьків. Зазвичай хлопчик лягав спати ще до того, як вони завершували зміну, та цієї ночі він їх дочекається. Нарешті обоє повернулися додому - стомлені й виснажені. Побачивши Алєксандра, їхні обличчя осяяли втомлені усмішки.\n\nМати стала навколішки й обійняла його. «Сьогодні ми принесли тобі дещо з роботи». Вона витягла щось зі штанів і подала Алєксандрові. Це була маленька іграшкова машинка - навіть коліщатка крутилися, усе як слід. Він радісно заверещав: нової іграшки в нього не було вже багато років. «Дякую, мамо!» Він побіг гратися машинкою, а обоє батьків усміхалися.\n\nНаступного дня Алєксандр знову був удома сам, бо батьки працювали. Граючись іграшкою, він помітив, що фарба трохи тріскається. А тоді ще й відпало одне коліщатко. Він опустився навколішки й спробував причепити його назад, та марно. Хлопчик сів, пригнічений і нещасний. Він поклав коліщатко до кишені - може, батьки зможуть його полагодити. Невже заради цього вони працювали цілими днями? Щоб приносити йому дешеві поламані іграшки й ніколи його не бачити? Алєксандр дивився на маленьку машинку в руці й відчував лише самотність."
 ORE.509.a: "Ой, любий, мама спробує дістати тобі іншу..."
 
 ORE.510.t: "Кінець комунної мрії"
 ORE.510.d: "Даша зачинила двері своєї маленької хатини й почовгала порожніми вулицями. На своєму краю села вона залишилася сама: решта виїхали до Орєнбурґа працювати на нових фабриках товариша Малєнкова. Її найближчий сусід Артур присягався, що ніколи не поїде, але вже багато днів вона не бачила, щоб він виходив із дому. Може, він нарешті допився до смерти.\n\nВона пішла далі стежками, які поволі заростали, повз занедбану стару партійну штаб-квартиру. Досі лишалися кілька неприкаяних душ, які не хотіли ані згасати тут, ані рушати далі. Коли вона нарешті дійшла до базарної площі, там працював лише один прилавок - старий добрий Васілій і далі продавав свіжі овочі. Вона дістала стару мітлу з комунної повітки й почала замітати площу. Це була марна праця: вітер постійно наносив новий пил, та й людей, здатних оцінити її старання, майже не лишилося. Але це була одна з небагатьох робіт, які ще залишалися в селі.\n\nЗрештою Васілієві набридла хронічна відсутність покупців, і він підійшов до неї. Вони сумно перекинулися кількома словами про стан села й згадали минулі часи. Зніяковіло Васілій визнав, що він теж нарешті вирішив піти працювати до Орєнбурґа й виїде наступного ранку. Даші стало сумно: він завжди був тим привітним обличчям, яке вона шукала поглядом, і їй страшенно його бракуватиме. Він приніс із прилавка мішок овочів і віддав їй, сказавши, щоб вона влаштувала собі ситну вечерю за його рахунок. Більше їм не було чого сказати, тож він попрощався, склав прилавок і пішов додому.\n\nЛишившись на площі сама, Даша похмуро замислилася, чи не настав час і їй поїхати. Але поки що вона мовчки замітала вулиці, сподіваючись надати вмирущому селу бодай трохи пристойнішого вигляду."
 ORE.510.a: "Замітай ці вулиці, які колись належали нам."
 
 ORE.511.t: "Убити гінця"
 ORE.511.d: "Малєнков сидів за столом, уважно перечитуючи документи перед підписанням. Йому треба було впоратися зі стосом, вищим за власне крісло. Хтось тихо постукав у двері. «Заходьте», - сказав Малєнков, навіть не підвівши очей.\n\nОсобистий помічник нервово ввійшов, намагаючись не зустрічатися з ним поглядом. У руках він ніс менший стос паперів. «Пане, надійшли звіти про обсяги виробництва фабрики». Це змусило Малєнкова підвести голову, в його очах спалахнуло нетерпіння. Він вихопив звіт із рук помічника й почав читати підсумок. Нетерпіння в його очах швидко змінилося розгубленістю, а тоді гнівом. «Ці показники жахливі. Вони набагато, набагато нижчі за встановлені розумні квоти. Тут мусить бути помилка. Принесіть мені правильний звіт». Помічник уже помітно тремтів від страху. «П-пане, це правильні показники». Малєнков грюкнув кулаком по столу. «Те, що вони фактично точні, ще не робить їх правильними! Я встановив правильні показники, а їх не досягнуто!» Тепер його обличчя палало люттю. «Охорона! Кинути цього чоловіка до в'язниці!»\n\nНайгірші побоювання помічника справдилися. Його виволокли з кімнати, зломленого, і кинули до тюремної камери. Він пробуде там доволі довго."
 ORE.511.a: "Якби він приніс добрі новини, йому не було б чого боятися."
 
 ORE.512.t: "Товариство прославлення робітничої демократії"
 ORE.512.d: "Від одного дня до іншого на різноманітних комюніке й творах революційного мистецтва, які виходили з друкарень міста Орєнбурґа, почали ставити позначку, що вони походять від «Орєнбурзького товариства прославлення робітничої демократії». Заявлена мета нової організації - поширювати добрі новини про поступ нашої робітничої революції. Вплив славетних рішень нашого керівництва на життя й працю простої людини має бути визнано - хоча б задля того, щоб подякувати нашій доблесній Робітничій раді за її невпинну добру працю.\n\nСпостережлива людина могла б зауважити неминучу присутність голови Малєнкова в літературній та мистецькій продукції товариства. На одному плакаті голова розпаковує ящики з ліками у віддаленій комуні. На іншому товариш Малєнков перерізає стрічку перед новою фабрикою. Плакати військової пропаганди неодмінно закликають чоловіків Орєнбурґа стати на варту, щоб урятувати новий Орєнбурґ голови. А щотижня надходять звіти про збільшення постачання промислових товарів або про наших відважних чоловіків, озброєних новою зброєю завдяки реформі голови. Спостережлива людина могла б також помітити, що члена Ради Кузнєцова усунули з посади голови орєнбурзького міністерства культури та зв'язку. Цинічна й спостережлива людина могла б поцікавитися, чому товариша Кузнєцова понизили. А бездоганний цинік міг би навіть повірити чуткам, що Кузнєцова звільнили за відмову цілковито присвятити себе розвиткові культу особи голови Малєнкова.\n\nТа, на щастя, добрі робітники Орєнбурґа ніколи не бувають циніками. Цій жахливій рисі характеру, так поширеній у відчужених капіталістичних суспільствах світу, немає місця в Орєнбурзі - а надто в серцях тих, чию долю перетворила наполеглива праця голови Малєнкова."
 ORE.512.a: "Газети кажуть, що голова Малєнков знову збільшив шоколадні пайки!"
 
 ORE.513.t: "Сумніви обсідають голову"
 ORE.513.d: "Малєнков завжди спав погано. Траплялися винятки: ніч, коли він став головою, була одним із них. Сьогодні була не така ніч. Замість сну власні думки змушували його крутитися й перевертатися в ліжку. Його обсіли сумніви. Він намагався нагадати собі, що досяг успіху, що він голова Орєнбурґа. Та цього було замало. Орєнбурґ розширювався й розвивався так, як планував Малєнков, але думки й далі ятрили незліченні проблеми. Лише два дні тому він бачив, як стару жінку штовхнули на землю й пограбували, а злодій шаснув у бічний провулок ще до прибуття поліції. Малєнкова жахнуло, що одну з його громадянок побили й пограбували серед білого дня. Перед тим як лягти спати, він поцікавився справою й дістав відповідь, що поліція досі веде розслідування. Він знав, що це означає: злодія ніколи не спіймають. Голова справді допоміг посилити заходи безпеки в місті, але здавалося, що цього ніколи не буде досить. В Орєнбурзі й досі було багато бідняків, і вони часто не мали іншого вибору, крім дрібних злочинів. Більше поліції, подумав він, це все вирішить.\n\nТа він усе одно не міг заснути, його непокоїли нові турботи. Може, річ у відвідинах господарств. Хоч на папері квоти виконали, під час офіційного візиту він бачив, як привозять урожай, обсяг якого був радше вдвічі менший за очікуваний. Невже селяни йому брехали? «Навіщо їм це робити?» - подумав він. Сталася помилка? Хтось крав із господарств? Тоді Малєнковові спала на думку тривожна річ. Невже селяни його боялися? Боялися, що він покарає їх за те, що вони не виконали квоти вчасно? Він усвідомив, що так, найімовірніше, і було. Раніше він суворо поводився з тими, хто не впорався. Малєнков був певен, що здатен діяти краще, здатен покласти край страхові перед злочинністю і перед ним самим. Під його владою Орєнбурґ буде заможним і мирним. Він про це подбає. Малєнков таки намагався підбадьоритися, але навіть тоді сумніви поверталися вже за кілька митей."
 ORE.513.a: "Ще одна безсонна ніч."
 
 ORE.514.t: "Останній член Ради"
 ORE.514.d: "У кабінеті Малєнкова було пів на дванадцяту. Кімната виявилася не такою розкішною, як він сподівався для авангарду революції, але поки що доводилося задовольнятися невеликим кабінетом у будівлі конґресу. Переглядаючи звіти про поточний план індустріялізації, він помітив на столі знайому світлину. Вона нагадувала про простіші часи й була зроблена в останні дні П'ятдесят сьомого конґресу.\n\nМалєнков усміхнувся, пригадавши, як Астанков завжди кепкував із деяких найсміховинніших рис політики комун. Шкода, що згодом з'ясувалося: він кепкував і з Малєнкова.\n\nОсь Ґаврілов. Він був оптимістом, але щиро дбав про добробут Орєнбурґа. Без кінця говорив про стрибок до комунізму й про те, що все неодмінно стане краще. Навіть коли Малєнкова звинуватили у фашизмі, Ґаврілов і далі вірив у його реформи. І так тривало до голоду. Дізнавшись про спротив Ґаврілова, Малєнков не мав вибору: інакодумство призвело б до фракційности в партії. Та навіть попри це Малєнков не міг стримати кількох сліз.\n\nА ось у центрі Коровін. Товстий старий цинік, відомий своїми підбурливими звинуваченнями у фашизмі, але без нього комуни ще багато років тому скотилися б в анархію. На щастя, він помер до п'ятдесят дев'ятого. Побачивши, що Малєнков зробив з Орєнбурґом, він, певно, перевертається в могилі. Малєнков не міг стримати ридань, усвідомивши, що останнім із людей на цій світлині пережив чистки. «Чому вони не могли просто послухати? - сказав він сам до себе. - Індустріялізація була необхідна, бригада стояла біля нашого порога, чекаючи нагоди скористатися нашою слабкістю!» Хоч які виправдання вигадував Малєнков, він не міг розвіяти нестерпного почуття провини, що тиснуло на нього.\n\nЗа тиждень в орєнбурзьких архівах з'явилося нове зображення. На ньому Малєнков усміхався на П'ятдесят сьомому конґресі."
 ORE.514.a: "Поруч із ним не стояв більше ніхто."
 
 ORE.515.t: "Товариство прославлення робітничої демократії"
