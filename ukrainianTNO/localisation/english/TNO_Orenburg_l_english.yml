 ORE_hheavy_industrial_commissariat_desc: "Централізована промисловість - шлях у майбутнє! Наш народ вирішив, що сільське господарство чи легка промисловість - не той напрямок. Натомість ми мусимо стати маяком. Маяком для робітників, маяком прогресу й маяком для народу!"
