 ### Focuses ###
 ORE_the_fifty_seventh_congress: "П'ятдесят сьомий конґрес"
 ORE_the_fifty_seventh_congress_desc: "Настав час знову скликати представників комун на великий конґрес. Це довге й галасливе демократичне дійство, де кожен чоловік має нагоду обговорити стан Орєнбурзької комуни. Внутрішні та зовнішні проблеми вимагають нагальної уваги п'ятдесят сьомого конґресу. Однак домогтися від зборів одностайної згоди щодо просування різних проєктів - сізіфова праця..."

 ORE_the_matter_of_the_urals: "Питання Уралу"
 ORE_the_matter_of_the_urals_desc: "Найнагальнішим пунктом порядку денного Ради є дедалі тяжча криза біженців. Струмок чоловіків і жінок, які шукали оази посеред російської анархії, перетворився на повінь нещасних утікачів від розпусти Чорної Гори чи нацистських бандитів. Наплив нових людей виснажує економіку різних комун регіону й остаточно паралізував нашу неповоротку політичну систему.\n\nНа півночі Уральська Ліга зіткнулася з подібною кризою біженців і запропонувала об'єднати сили для її подолання, а можливо, навіть ударити по двох східних лихах. Багато членів Ради вважають це єдиним справжнім виходом, однак проти пропозиції несподівано згуртувалася значна опозиція. Військова ієрархія Уральської Ліги суперечить усім політичним принципам Орєнбурзької комуни, зокрема децентралізації та низовому керівництву. Вихід із глухого кута в цьому питанні вирішальний для нашої майбутньої оборонної та зовнішньої політики."

 ORE_the_matter_of_communal_agriculture: "Питання комунного землеробства"
 ORE_the_matter_of_communal_agriculture_desc: "Серед комун лише місто Орєнбурґ має щось віддалено схоже на доіндустріяльну ремісничу економіку. Решта комун - вільні об'єднання місцевих селян, що обробляють поля допотопними методами. Через це навіть за доброго врожаю збирають небагато. Своєчасне постачання харчів місту Орєнбурґу навіть у найкращі часи породжує значну напругу між іншими комунами й міською радою. Тепер криза біженців доводить продовольчі запаси до межі.\n\nТовариш Малєнков і Бурба з міста Орєнбурґа нарешті знайшли питання, у якому згодні: індустріялізацію й організацію сільського господарства різних комун треба поліпшити. Їхня пропозиція поміркованих реформ задля спільної аграрної політики спричинила обурення в Раді. Однак інші зацікавилися допомогою селянам через поширення знарядь і знань. Ми маємо нагоду створити коаліцію довкола цього питання або дозволити ідеї реформи згаснути."

 ORE_the_matter_of_communal_autonomy: "Питання автономії комун"
 ORE_the_matter_of_communal_autonomy_desc: "Труднощі в обговоренні відносин Орєнбурґа з Уральською Лігою та можливих аграрних реформ Комун мають одне джерело: суперечку про централізацію. Більшість селян Орєнбурґа не відчуває особливої прив'язаности до будь-якої регіональної ідентичности; вони обробляють землю із сусідами, а коли виникає складна проблема, кілька місцевих представників вирушають до Орєнбурґа скаржитися й просити посередництва.\n\nЦя крайня децентралізація мусила трохи поступитися, чим і пояснюється створення Робітничої ради. Але мало хто погоджується, чим саме вона має бути. Багато людей, особливо мешканців міста Орєнбурґа, хочуть, щоб Рада стала трампліном для централізованішого уряду, здатного заради добра всіх орєнбуржців прорватися крізь нескінченні переговори й чвари між комунами. Та багато інших твердять, що Рада не має жодних повноважень, окрім посередництва, а справжня влада завжди належала комунам.\n\nСуперечка про централізацію триває без кінця, старі аргументи знову й знову повертаються. Тим часом вовки за межами Орєнбурґа спостерігають, як наша роз'єднаність загрожує нашим землям. П'ятдесят сьомий Робітничий конґрес дає нагоду схилити дискусію в той чи інший бік."

 ORE_the_matter_of_trade_security: "Питання торгівлі"
 ORE_the_matter_of_trade_security_desc: "Наші землі милосердно уникнули більшої частини руйнувань, заподіяних німцями. Залишки совєцької промисловости й досі чинні підприємства з видобутку природних ресурсів дають комунам ті незначні несільськогосподарські багатства, які вони мають. З часом деякі віддалені комуни навіть почали торгувати із зовнішнім світом, завозячи рідкісні знаряддя, припаси й дещицю промислових та аграрних знань. Саме місто Орєнбурґ кілька разів на рік відвідують іноземні каравани.\n\nОднак напрямок торговельної політики Орєнбурґа спричиняє запеклі суперечки. Багато хто засуджує вплив торгівців на безпеку регіону. Колись безпечні дороги тепер стали здобиччю бандитів. Ополчення комун несуть більшість витрат на охорону торговельних шляхів, і навіть комуни, майже не зацікавлені в експорті, виявляються втягнутими в дрібні сутички з бандитами. Під час дискусії про Уральську Лігу молодий священник з Абрамовки припустив, що кризу біженців посилює чутка про Орєнбурґ як незайману оазу посеред хаосу Росії та Казахстану. Його слова влучили в болюче місце, і невдовзі робочий комітет ізоляціоністських комун почав готувати пропозиції щодо регулювання торгівлі із зовнішнім світом."

 ORE_the_communes_input: "Слово комун"
 ORE_the_communes_input_desc: "Робітнича рада то наповнюється, то рідшає з плином днів. Уже обговорені теми повертаються знову й знову. Саша, селянин із комуни Чорний Отроґ, хоче переказати думку свого села про тих виродків з Уральської Ліги, які колись купили в нього корову за п'яту частину справжньої ціни. Інша комуна люб'язно уклала нову версію аграрної політики Малєнкова й Бурби та наполягає, що з нею погодяться всі.\n\nКомуна за комуною, село за селом, родина за родиною - увесь Орєнбурґ має право виступити в Робітничій раді. Селяни переорюють старі теми, відкриваючи нові розбіжності. Представники комун оцінюють пропозиції дня. Часом у двері ввалюються представники віддалених районів, а інші члени докладно пояснюють їм пропущені дискусії.\n\nПраця робітничої демократії триває до пізньої ночи й зупиняється лише тоді, коли в самоварі закінчується вода для чаю."

 ORE_the_end_of_the_congress: "Кінець конґресу"
 ORE_the_end_of_the_congress_desc: "Конґрес нарешті вичерпав терпіння кожного учасника. Представники розійшлися по кількох комітетах, щоб написати завершальні промови для заключного засідання.\n\nВиснажені члени міської ради Орєнбурґа насилу складають свою заяву. Фракція централізації знову витратила скарби риторики, енергії та закулісних угод майже без користи.\n\nЗа межами Орєнбурґа вовки підходять дедалі ближче..."

 ORE_word_from_the_fringes: "Вісті з окраїн"
 ORE_word_from_the_fringes_desc: "Невдовзі після завершення п'ятдесят сьомого Робітничого конґресу до нас дійшли звістки про почастішання набігів на ізольовані прикордонні комуни. Через суперечливі розповіді біженців і решток прикордонних ополчень важко оцінити масштаб небезпеки. Орєнбурґом шириться чутка, що проклята бригада Дірлеванґера почала вторгнення проти Уральської Ліги й Орєнбурзької комуни.\n\nПеревірка відомостей і відправлення вершників до прикордонних комун заберуть час, але дадуть нам змогу дізнатися, що насправді відбувається."

 ORE_revive_the_levy_question: "Повернутися до комунного набору?"
 ORE_revive_the_levy_question_desc: "Наші найгірші побоювання щодо військового становища на кордоні справдилися. Бандитська армія Дірлеванґера й залишки НКВД Лисенка готують вторгнення до Комуни. Робітнича рада нині фактично не має армії й не здатна наказати різним ополченням комун об'єднатися на кордоні. Суперечлива стара ідея повернулася до життя: провести набір у різних комунах і сформувати армію, здатну захистити регіон. У кращі часи ця думка так і не вийшла за межі обговорення; сподіваймося, під час кризи комуни погодяться співпрацювати..."

 ORE_investigate_the_communal_militias: "Оцінити ополчення комун"
 ORE_investigate_the_communal_militias_desc: "Кожне село захищають його чоловіки й жінки, об'єднані в нерегулярні ополчення комун. Оскільки кожна комуна вільна самостійно дбати про безпеку, стандарти різняться від села до села. Принаймні оцінка цілої мозаїки ополчень дозволить зрозуміти, скільки чоловіків і жінок можна зібрати в разі потреби. Знання про теперішній розподіл військового спорядження також допоможе спрямувати наші мізерні запаси набоїв і зброї туди, де вони потрібні найбільше."

 ORE_raising_the_issue_once_more: "Знову порушити питання"
 ORE_raising_the_issue_once_more_desc: "Тепер, краще розуміючи становище на кордонах і рівень військової готовности в усьому Орєнбурзі, Робітнича рада підготувала нову пропозицію військової політики. Повернення до ідеї комунного набору спричинило в порівняно спокійній Робітничій раді не одну сварку між прихильниками й противниками централізації; тепер мусимо готуватися до хвилі обурення, коли цю ідею винесуть на розгляд кожної комуни."

 ORE_reassure_the_communes: "Заспокоїти комуни"
 ORE_reassure_the_communes_desc: "Через жахливий стан орєнбурзьких доріг лавина розгніваних реакцій наростала повільно. Та сьогодні вранці на околицях міста Орєнбурґа здійнявся великий гармидер: розлючені представники комун рушили до міста. Їхні крики «зрадники селян», спрямовані на гвардійців, викликали зустрічну ходу біженців, які вимагали від представників іти сперечатися з нападниками замість того, щоб ховатися тут, в Орєнбурзі. Хаос ширився, коли сусідні села почали надсилати ополченців для відновлення порядку й перевірки, чи не захопили владу реакціонери.\n\nТепер найважливіше - надіслати вершників до якомога більшої кількости комун, щоб зупинити потік розгніваних представників і водночас заспокоїти місто. Угамування комун дозволить уникнути дальшої шкоди легітимності Робітничої ради."

 ORE_the_fundamental_problems: "Засадничі проблеми"
 ORE_the_fundamental_problems_desc: "Наслідки провалу комунного набору втягнули багато фракцій Робітничої ради в запеклі суперечки. Переконлива більшість Ради тепер не має сумнівів, що недієздатна структура Орєнбурґа його вбиває, а колись маргінальні ідеї почали входити до політичного мейнстриму. Настав час схилити невизначених членів на бік реформ і втримати антицентралізаційні фракції на узбіччі дискусії."

 ORE_we_need_a_plan: "Нам потрібен план"
 ORE_we_need_a_plan_desc: "Наша праця над створенням коаліції дала плоди. Робітнича рада тепер гуде, поки колишні суперники спільно виробляють новий план до майбутнього п'ятдесят восьмого Робітничого конґресу. Закулісні угоди, шантаж, хабарі, щирі аргументи - збирається величезний політичний капітал, щоб проштовхнути амбітні пропозиції. Лідерами оновленого реформістського руху стали двоє: Ґєорґій Малєнков і Алєксандр Бурба. Обидва згодні, що для виживання Орєнбурґа треба завершити економічні й політичні реформи, але вони та їхні прибічники без кінця сперечаються про потрібний розмах змін. Радикальні пропозиції Бурби вважають надто складними для втілення, а план Малєнкова звинувачують у плутанині половинчастих заходів. Часу обмаль, тож реформістська фракція мусить вирішити, яким шляхом рухатися."

 ORE_arrange_the_program: "Укласти програму"
 ORE_arrange_the_program_desc: "Настав час знову скликати представників комун на великий конґрес. Це довге й галасливе демократичне дійство, де кожен чоловік має нагоду обговорити стан Орєнбурзької комуни. Але цього разу все буде інакше.\n\nМ'яку й позбавлену керівництва Робітничу раду загартувала військова криза й оживило нове відчуття нагальности. За підтримки дедалі відчайдушніших прикордонних комун ми завершуємо підготовку до Робітничого конґресу. Боротьба буде важкою, але заради добра Орєнбурзької комуни ми мусимо перемогти."

 ORE_the_fifty_eighth_congress: "П'ятдесят восьмий конґрес"
 ORE_the_fifty_eighth_congress_desc: "Настав час п'ятдесят восьмого конґресу - зустрічі, яка, сподіваємося, приведе до справжніх розв'язань проблем Орєнбурґа. У Робітничій раді витрачено чимало політичного капіталу, обговорено плани й утворено коаліції.\n\nПитань багато: децентралізовані ополчення, відсутність керівництва в Раді й цілковита нездатність Орєнбурґа до будь-яких рішучих дій. Сподіваємося, що до завершення конґресу нарешті зможемо почати розв'язувати ці проблеми."

 ORE_fight_the_controversy: "Подолати суперечності"
 ORE_fight_the_controversy_desc: "Однією з найбільших суперечок, що мучать Орєнбурґ, стало питання про голову Робітничої ради. Для багатьох мешканців комун це нагадує часи, коли Лєнін придушив регіональні совєти й лівих есерів, - небезпечний і реакційний крок, здатний привести Орєнбурґ до тиранії.\n\nОднак ми мусимо подолати цю суперечність і рухатися далі. У цей тяжкий час Раді потрібен голова, а будь-які надмірні повноваження неодмінно матимуть демократичні механізми стримування."

 ORE_make_compromises: "Піти на компроміс"
 ORE_make_compromises_desc: "Нині Робітничу раду можна поділити надвоє: на тих, хто хоче зосередити владу в уряді заради ефективности, і тих, хто з принципу прагне розподілити її між Комунами. Ніде їхні розбіжності не спалахнули так люто, як у суперечці про повноваження нового голови. Зрозуміло, що палкі оборонці буквального дотримання прямої демократії Орєнбурґа підозріло ставляться до будь-якої спроби дати голові більше, ніж представницькі функції, тоді як реформісти прагнуть постаті, здатної зрушити уряд із місця попри хиткий і непевний консенсус.\n\nВ ідеальному світі кожна сторона досягла б усіх своїх цілей - голова був би настільки слабким чи сильним, як їй заманеться. Але серед роздертих війною уламків Росії, де вовки збираються довкола вкритих інеєм овець? Доведеться вдовольнитися компромісом."

 ORE_propose_a_chairperson: "Запропонувати голову Ради"
 ORE_propose_a_chairperson_desc: "Настав час запропонувати голову Ради. Це радикальний захід, але навіть у разі невдачі маємо альтернативи. Разом із пропозицією голови один із наших союзників висунув проєкт посиленої Ради з ротаційним головуванням, за яке голосуватимуть на кожному засіданні. Висунувши спершу найрадикальнішу пропозицію, ми навіть після її провалу зможемо переконати Раду прийняти поміркованіший варіянт. Нерішучість і безглуздя закінчуються сьогодні!"

 ORE_the_counter_proposal: "Контрпропозиція"
 ORE_the_counter_proposal_desc: "Рада відхилила нашу пропозицію, але прийняла скромніший запасний варіянт. Вона матиме ротаційного голову з правом завершити обговорення теми, якщо це рішення не скасує голосування п'ятдесяти відсотків членів Ради. Крім того, нова посада дозволить визначати пріоритетність заходів. Сподіваємося, це відкриє нагоду виносити пропозиції, які інакше поховали б менш важливі питання, загубилися б або вимагали б непрактично великого політичного капіталу, щоб узагалі потрапити на розгляд."

 ORE_malenkovs_speech: "Сходження Малєнкова"
 ORE_malenkovs_speech_desc: "Рада схвалила нашу пропозицію й обрала Ґєорґія Малєнкова новим головою на чотирирічний термін. Малєнков пообіцяв понад усе стабільність і порядок - звісно, в межах традиційного орєнбурзького устрою. Його фракція вже готує численні надзвичайні заходи для подолання теперішньої кризи.\n\nДехто називає Малєнкова майбутнім тираном, але він ужив численних заходів, намагаючись довести Раді, що не має великих намірів захопити владу чи якось іще зрадити Орєнбурґ. Адже, каже він, такі дії були б контрреволюційними й могли б виправдатися лише в годину найбільшої потреби..."

 ORE_burbas_speech: "Промова Бурби"
 ORE_burbas_speech_desc: "Рада схвалила нашу пропозицію й обрала Алєксандра Бурбу новим головою. Раніше Бурбу звинувачували в радикалізмі, але красномовство й ретельно впорядковані плани привернули на його бік багатьох членів Ради. Він обіцяє передусім реорганізацію економіки, індустріялізацію та науковіший і впорядкованіший спосіб організації життя в Орєнбурзі.\n\nБурба вже довів свою цінність для Орєнбурґа, заснувавши раніше кілька промислових комітетів і шкіл, і багато членів Ради з радістю та захопленням очікують утілення його мети - перетворити Орєнбурґ на справжню сяйну коштовність Росії."
 
 #Anarchy/LibSoc
 
 ORE_calling_the_council_to_order: "Навести лад у Раді"
 ORE_calling_the_council_to_order_desc: "Після завершення п'ятдесят восьмого Робітничого конґресу у фракції централізації Робітничої ради спалахнули гнів і внутрішні чвари. Багатьох розчарувала нездатність провести справді сильну центральну виконавчу владу.\n\nНа щастя, новому голові вдалося придушити незгоду. У запальній промові членам Ради нагадали про безпрецедентну нагоду реформувати, зміцнити й упорядкувати Орєнбурґ. Тепер ми можемо розподілити людей між комітетами й розпочати проєкти."

 ORE_institute_common_judicial_guidelines: "Запровадити спільні судові засади"
 ORE_institute_common_judicial_guidelines_desc: "«Кожна комуна вільна чинити власне правосуддя» - так тут діяли завжди. На практиці нечисленні провінційні юристи, які лишилися в Орєнбурзі після війни, не змогли зупинити поширення самосудів і показових процесів у безлічі комун. Навіть у місті Орєнбурзі натовпи здатні впливати на перебіг суду.\n\nСтарий порядок, коли закони нав'язувала центральна купка юристів, в Орєнбурзі більше ніколи не приймуть. Але можна створити нове правосуддя, зведене знизу на правах кожного громадянина. Коли працівники комуни укладуть закони за допомогою міських правничих радників, вони відчують обов'язок дозволити правосуддю йти своїм шляхом."

 ORE_reform_the_peoples_tribunals: "Реформувати народні трибунали"
 ORE_reform_the_peoples_tribunals_desc: "Одна річ - мати справедливі писані закони щодо різних правопорушень і злочинів, інша - мати справедливу систему покарань. У суворій російській анархії карою за будь-який злочин надто часто стає шибениця або розстріл на світанку.\n\nЩоб покласти край повсюдному застосуванню смертної кари, у різних народних трибуналах запроваджено грошове відшкодування, примусову працю для комуни або річну службу в ополченні міста Орєнбурґа. Посередництво у ворожнечі між місцевими родинами допоможе запобігти неприязні серед присяжних, як і збирання натовпу, що перекричить будь-кого, хто виступить проти реформи."

 ORE_discuss_the_unequal_investments: "Обговорити нерівномірні інвестиції"
 ORE_discuss_the_unequal_investments_desc: "Однією з причин проблем Орєнбурзької комуни з централізацією є величезна вага міста Орєнбурґа в регіональних справах. Більшість комун живе за первісної аграрної економіки, тоді як у місті Орєнбурзі сяк-так працює грошова економіка з виробництвом і торгівлею товарами.\n\nНерівність ресурсів породила нерівність інвестицій. Місто Орєнбурґ сплачує більшу частину регіональних вкладень, що викликало глибоку недовіру між містянами й сільськими комунами. Будь-яку спробу вкластися в землі комуни сприймають як перший крок до захоплення району Орєнбурґом. Водночас скупі орєнбурзькі купці регулярно відхиляють прохання комун про надзвичайні інвестиції, не бажаючи допомагати непоступливим комунам.\n\nПереконати комуни стати рівноправними партнерами в інвестиціях - перший крок до подолання дисбалансу. Хоч якими бідними вони були, комуни мусять робити внесок у спільну справу. Натомість вони отримають доступ до значно більшого фонду можливих інвестицій. Від кожного за здібностями, кожному за потребами."

 ORE_common_investment_contributions: "Спільні інвестиційні внески"
 ORE_common_investment_contributions_desc: "Комуни неминуче поставилися скептично до ідеї об'єднати гроші у спільному фонді. Багато менших комун можуть запропонувати нам ресурсів лише на кілька рублів і не розуміють, як такі мізерні кошти допоможуть спільному благу. Кілька пілотних проєктів розвитку, цілком профінансованих місцевими зусиллями, мають показати скептикам, що гуртом і важке легко підіймати.\n\nПопри будь-який опір, усі мусять зрозуміти: доба дармоїдства скінчилася."

 ORE_organize_communal_representation: "Упорядкувати представництво комун"
 ORE_organize_communal_representation_desc: "Кожен громадянин має право на представництво в Робітничому конґресі й завжди його матиме. Однак практика змінного представництва комун значною мірою спричинилася до хаосу на конґресах. Одні комуни надсилають замало людей порівняно з населенням, інші - забагато. Узимку, коли поля не обробляють, представники комун юрбами прибувають до міста Орєнбурґа, тоді як улітку багато делегацій відсутні.\n\nВідтепер кожна комуна матиме фіксовану кількість делегатів відповідно до чисельности населення. Перед їхнім від'їздом кожен громадянин комуни муситиме викласти їм свої проблеми, а не приєднуватися до великих неофіційних гуртів, що сунуть до Орєнбурґа."

 ORE_scheduled_congress_meetings: "Заплановані засідання конґресу"
 ORE_scheduled_congress_meetings_desc: "Правда, дороги й ґрунтові стежки Орєнбурґа лишають бажати кращого, а сезони сівби та жнив забирають більшість вільного часу чоловіків і жінок комун. Однак запізнення на Робітничий конґрес породжує нескінченне повторення вже обговорених тем і має дратівливу властивість знову витягати на перший план старі суперечки.\n\nВідтепер кожен конґрес призначатимуть задовго наперед, а делегати, які запізняться, втратять право участи. Віддаленим представникам надаватимуть грошову допомогу, щоб вони могли прибути вчасно."

 ORE_codify_central_powers: "Закріпити повноваження Ради"
 ORE_codify_central_powers_desc: "Зустрічна пропозиція комун про Раду з найвищою владою ухвалювати рішення містила застереження: ці повноваження обмежуються конкретними сферами. Чітке визначення сфер верховенства Ради допоможе вгамувати страх перед повзучим авторитаризмом міста Орєнбурґа й, сподіваємося, переконає комуни підтримати її владу.\n\nНайважливішою серед наших обмежених сфер впливу є загальний нагляд за ополченнями Орєнбурґа. Низка чітких пропозицій щодо діяльности війська допоможе нам підготуватися до прийдешньої бурі."

 ORE_draft_the_workers_constitution: "Розробити Робітничу конституцію"
 ORE_draft_the_workers_constitution_desc: "Маючи обмежений мандат і чітко описаний порядок роботи, нова Робітнича рада готова розробити конституцію для робітників Орєнбурґа. Більше жодних чуток, непорозумінь і плутанини. Новий Орєнбурґ дотримуватиметься докладно викладених демократичних принципів, закріплених у Робітничій конституції."

 ORE_develop_the_outer_regions: "Розвивати віддалені райони"
 ORE_develop_the_outer_regions_desc: "Віддалені райони опинилися в сумному підвішеному стані через недієздатність Робітничої ради. Прикордонні комуни, які найбільше постраждали від кризи біженців і почастішання набігів, були серед найвідданіших союзників реформістської фракції Ради, та досі не отримали жодної допомоги. Інвестиції в ці райони зміцнять владу комун над землями, запевнять місцевих керівників у захисті Орєнбурґа й допоможуть укріпити наші кордони."

 ORE_the_peoples_justice: "Народне правосуддя"
 ORE_the_peoples_justice_desc: "У більшості комун система правосуддя є імпровізованою організацією сільських старійшин, священників і місцевих впливових людей. Заохочення кожної комуни обирати суддів зміцнить наші правові реформи й із часом створить прошарок місцевих громадян із правничими знаннями та чуттям до юриспруденції."

 ORE_the_fifty_ninth_congress: "П'ятдесят дев'ятий конґрес"
 ORE_the_fifty_ninth_congress_desc: "Настав час знову скликати представників комун на великий конґрес. Це довге й галасливе демократичне дійство, де кожен чоловік має нагоду обговорити стан Орєнбурзької комуни.\n\nПідготовлено амбітний пакет реформ: зміни судової системи, спільна інвестиційна політика, нова Робітнича конституція. Уперше ми здатні визначити порядок денний конґресу й використати повноваження голови, щоб усі зосередилися. Повідомлення з усього Орєнбурґа дають суперечливу картину підтримки нашої пропозиції, тож лишається чекати: дозволять комуни рішуче рушити до світлішого майбутнього чи Орєнбурґ приречений на анархію..."

 ORE_the_beginning: "Початок"
 ORE_the_beginning_desc: "Реформаторську пропозицію ухвалено! Попередній проєкт Конституції зустріли громовими оплесками. Тепер Орєнбурґ має уряд, хай і слабкий. Багато скептичних комун привітали нас із тим, що ми використали повноваження для створення міцного консенсусу. Шлях попереду буде важким, але ми більше не йдемо ним самі."

 ORE_proclaim_internal_peace: "Проголосити внутрішній мир"
 ORE_proclaim_internal_peace_desc: "«Тисяча ополчень для захисту слабких! Тисяча рук, щоб допомогти тим, хто насилу ходить! Тисяча ланок у великому ланцюзі робітників!»\n\nВеликим і малим комунам повідомлено, що Робітнича рада відновить мир і порядок. Сільські священники читають Робітничу конституцію неписьменним. А на змученому кордоні вперше за багато місяців комуни наважуються мріяти про щасливе майбутнє Орєнбурґа."

 ORE_common_responsibilities: "Спільні обов'язки"
 ORE_common_responsibilities_desc: "Комуни прийняли принцип загальних внесків до централізованої армії та інвестиційного фонду. Однак іще треба визначити обсяг відповідальности окремих комун. Кількість солдатів, рівень інвестицій, обсяг ресурсів - внесок кожного села й міста належить оцінити та узгодити. Там, де закінчуються правові повноваження Робітничої ради, треба створити нові комітети й організації, щоб забезпечити успіх робітничого уряду."

 ORE_common_finance: "Спільні фінанси"
 ORE_common_finance_desc: "Хвалена спільна інвестиційна політика фігурує майже в кожному реформаторському проєкті. Але диявол криється в деталях, і багато попередніх ідей Ради щодо цієї політики довелося відкинути й замінити у співпраці з комунами. Та крок за кроком проєкт рухається вперед. На наших землях не бракує великих і малих інвестиційних можливостей, а звіти про перші проєкти вселяють надію."

 ORE_revoke_the_privilegia: "Скасувати привілеї"
 ORE_revoke_the_privilegia_desc: "Хоч Робітнича конституція й зберігає переконливу більшість, багато комун нагадали нам про привілеї, узгоджені в такому-то договорі чи на такому-то Робітничому конґресі. Нацьковуючи комуни одна на одну й нагадуючи всім підписантам Робітничої конституції, що вони погодилися з її законами, ми можемо поволі усунути хаос винятків, таємних положень і особливих привілеїв, які загрожують зірвати наші реформи."

 ORE_create_the_higher_command: "Створити Вище командування"
 ORE_create_the_higher_command_desc: "Централізована армія Орєнбурґа - одна з небагатьох сфер, де Робітнича рада має справжню владу. Комуни дозволили нам ухвалювати власні рішення, тож ми здебільшого вільні створювати структуру армії на свій розсуд. Найважливіше питання - знайти людей, які її очолять. Залучивши ветеранів великої війни проти німців і кількох недавніх прибульців з Уральської Ліги та ЗРРФ, ми розробили структуру для об'єднання ополчень комун під чітким порядком командування. Нечисленні досвідчені ветерани створять Вище командування, верховна влада якого належатиме Робітничій раді."

 ORE_the_leagues_training: "Вишкіл Ліги"
 ORE_the_leagues_training_desc: "Кожна поважна комуна створила власне ополчення для захисту землі й родин. Однак гурт селян із кількома годинами стрільби з рушниці - ще не армія. Завдяки повноваженням Робітничої ради ми нарешті можемо запросити офіцерів Уральської Ліги поліпшити підготовку наших людей. Ліга запропонувала організувати кілька регіональних військових таборів, до яких сусідні комуни легко дістануться за день-два. Там офіцери Ліги зможуть спільно готувати ополчення й прищепити їм відчуття належности до чогось більшого."

 ORE_accept_their_aid: "Прийняти їхню допомогу"
 ORE_accept_their_aid_desc: "Ретельні звіти Уральської Ліги про стан підготовки наших ополчень виявили досі не враховану нестачу зброї та припасів. Ліга люб'язно запропонувала спорядити наших людей зі своїх складів, якщо ми допоможемо організувати й провести її каравани нашими землями."

 ORE_grant_full_access: "Надати повний доступ"
 ORE_grant_full_access_desc: "Крок за кроком комуни почали довіряти Лізі. Навіть найізольованіші села потеплішали до неї, коли уральські офіцери допомогли підготувати їхніх чоловіків і жінок. Кілька разів члени Ліги рятували села від бандитських набігів. Люди Ліги вже фактично мають доступ до більшої частини кордону, а внутрішні комуни запропонували поширити цей доступ на весь Орєнбурґ, щоб полегшити підготовку й оборону."

 ORE_revive_orenburgs_shops: "Відродити цехи Орєнбурґа"
 ORE_revive_orenburgs_shops_desc: "Зі створенням нової Робітничої армії відкривається величезний ринок зброї та боєприпасів. Перші кроки спільної інвестиційної політики спрямовують гроші й ресурси на відродження старих фабрик і майстерень для виробництва зброї. Багато регіональних об'єднань ополчень склали ресурси, щоб фінансувати власні збройові виробництва в столиці, і тепер з орєнбурзьких цехів до фронту пливуть каравани зброї та набоїв. Невеликий поштовх прискорить цей збройовий бум і допоможе озброїти наших людей."

 ORE_a_professional_militia: "Професійне ополчення"
 ORE_a_professional_militia_desc: "Щедра допомога Ліги не може охопити всі наші міста й села. Залучивши власних ветеранів, ми створили мандрівні військові школи, які проводять заняття для ополчень комун. Давши місцевим чоловікам і жінкам відчути впорядковане військове життя, ми сподіваємося перетворити частину ополченців із неповною службою на професійних солдатів і створити ядро нового війська."

 ORE_the_best_officer_candidates: "Найкращі кандидати в офіцери"
 ORE_the_best_officer_candidates_desc: "Багато ополчень у заможніших районах і прикордонних землях зацікавилися перетворенням на постійні військові роти з місцевими виборними офіцерами, які зв'язуватимуть Вище командування з місцевими військами. Ми мусимо й далі поважати принцип низової робітничої організації, та чимало місцевих офіцерів обирають за популярністю, а не заслугами. Залучивши ветеранів і радників Ліги до перевірки кандидатів, ми навчимо нових солдатів, що вибір поганих офіцерів - найкращий спосіб змарнувати військові зусилля комуни."

 ORE_renovatio_orenburgii: "Відродження Орєнбурґа"
 ORE_renovatio_orenburgii_desc: "Кожна комуна гуде від діяльности. Старі видобувні підприємства знову відкриваються, їхні матеріали течуть на фабрики й до майстерень. Солдати з високим бойовим духом і пристойним професіоналізмом патрулюють дороги, а добре керовані ради комун упроваджують власні реформи, наслідуючи розсудливі демократії світу.\n\nДля Орєнбурґа настає нова доба, у якій ми нарешті можемо існувати як єдине суспільство й сяйна коштовність у темній російській пустці."

 ORE_dust_in_the_wind: "Пил за вітром"
 ORE_dust_in_the_wind_desc: "Пропозиція провалилася! Поки Робітничий конґрес розпадається в розгніваних суперечках і взаємних докорах, представники прикордонних комун один по одному виходять, їхні обличчя попелясті від страху. Усі надії реформувати комуни до початку війни втрачено..."

 ORE_salvage_what_we_have: "Врятувати те, що маємо"
 ORE_salvage_what_we_have_desc: "П'ятдесят дев'ятий Робітничий конґрес досі триває. Більшість реформістської фракції вже здалася й проводить дні за чаркою, поки майбутнє Орєнбурґа палає. Дехто на чолі з товаришем Бурбою ще намагається витягти з комун якомога більше ресурсів, щоб пом'якшити катастрофу."

 ORE_pray_for_a_miracle: "Молитися про диво"
 ORE_pray_for_a_miracle_desc: "Щойно надійшла звістка про провал пропозиції, представник Уральської Ліги попросив зустрічі з керівниками реформістської фракції. Нам лишається повідомити йому, що Ліга тепер сама по собі, а нам залишається тільки молитися про диво..."

 ORE_the_storm_on_the_horizon: "Буря на обрії"
 ORE_the_storm_on_the_horizon_desc: "Пробні набіги на наші кордони стають дедалі інтенсивнішими. Нечисленні розвідники, яким удалося повернутися, одностайні: армія Дірлеванґера наближається. Прикордонні комуни евакуюють, що спричиняє сутички з ополченнями далі вглиб країни.\n\nНа кордоні кілька ополченців чекають на постах із рушницями в руках. До них приєдналися члени міської ради Орєнбурґа, які покинули спроби домогтися дальшої підготовки. Їм лишається тільки чекати прийдешньої бурі."

 #Malenkov
 ORE_to_ensure_security: "Заради безпеки..."
 ORE_to_ensure_security_desc: "Голова Малєнков планує виголосити пристрасну промову про необхідність розширити його повноваження в цю годину потреби. Орєнбурґ зіткнувся з найгіршими з найгірших німецьких злочинців, загартованими роками боїв по всій Росії. Якщо чутки, що бригада Дірлеванґера отримала найсучаснішу зброю від божевільних науковців Маґнітоґорска, правдиві, весь Орєнбурґ у страшній небезпеці. Надмірна залежність від допомоги Уральської Ліги - певний шлях до втрати незалежної робітничої демократії, на яку має право кожен громадянин Орєнбурґа. Під сильним керівництвом Малєнкова посилена Робітнича рада могла б викувати з комун міцнішу Робітничу державу, здатну захистити наші землі..."

 ORE_and_continuing_stability: "...і подальшої стабільности..."
 ORE_and_continuing_stability_desc: "...Та, звісно, сильніша держава буде потрібна лише доти, доки триває війна. Товаришеві Малєнкову глибоко боляче послаблювати робітничу демократію, яка бачить силу й гідність кожної людини Орєнбурґа. Робітнича рада та її голова не прагнуть замінити цю почесну традицію, а лише захистити її в час кризи й нестабільности. У новій промові, поширеній у кожній комуні, голова пропонує тимчасовий надзвичайний стан, який триватиме лише до поразки німецької загрози. Багато комун, імовірно, виступлять проти цього безпрецедентного наступу на права робітників, однак фракція товариша Малєнкова дуже популярна серед біженців міста Орєнбурґа й у комунах східного кордону. Спираючись на цю базу прихильників, ми переконаємо Орєнбурґ у необхідності надзвичайного стану."

 ORE_reorganize_the_workers_council: "Реорганізувати Робітничу раду"
 ORE_reorganize_the_workers_council_desc: "Теперішня організація Робітничої ради, створена для мирної робітничої демократії, погано відповідає безпрецедентному обсягу влади, дорученому Раді та її голові. Реорганізувавши Раду довкола центральної виконавчої влади й установивши чіткий ланцюг командування, ми перетворимо всю організацію на точно налаштовану політичну машину, здатну вчасно ухвалювати складні рішення. Дехто непокоїться через перетворення Робітничої ради на ієрархічну структуру, але голова Малєнков наполягає, що це найкраща підготовка до майбутнього шляху."

 ORE_reorganize_orenburgs_guard: "Реорганізувати Орєнбурзьку гвардію"
 ORE_reorganize_orenburgs_guard_desc: "Орєнбурзька гвардія завжди була одним з ополчень. Великим, як і належить захисникам найбільшої комуни регіону, але все ж ополченням. Перебудувавши її структуру за зразком традиційнішого війська, ми підвищимо бойову ефективність нашого найбільшого збройного контингенту й полегшимо його розгортання на фронті, коли настане час. Крім того, запровадження офіцерів у традиційно егалітарних формуваннях допоможе Раді та її голові контролювати солдатів і не дозволить нікому привласнити здатність Гвардії захищати робітничу демократію."

 ORE_secure_the_outer_communes: "Підпорядкувати віддалені комуни"
 ORE_secure_the_outer_communes_desc: "Теоретично Робітнича рада має владу над великим регіоном, але на практиці що далі від міста Орєнбурґа, то меншу прив'язаність відчувають місцеві комуни. Осередком опору новим реформам голови Малєнкова стали комуни заходу й півночі. Захищені Уральською Лігою від бандитів, місцеві керівники не відчувають нагальної потреби об'єднуватися проти німецьких варварів на сході.\n\nНадіславши Орєнбурзьку гвардію до цих заблудлих районів на спільні навчання ополчень, ми сподіваємося запевнити всіх громадян, що в ці тяжкі часи Рада однаково захищає кожного."

 ORE_the_future_is_ahead: "Майбутнє попереду"
 ORE_the_future_is_ahead_desc: "Зроблено. Усупереч усьому голова Малєнков зламав нескінченний застій робітничої демократії Орєнбурґа. Опір решти скептичних комун заспокоєно, а мертвий вантаж у Робітничій раді відсічено. Тепер можна використати давно приспаний потенціял регіону та його мешканців і під мудрим керівництвом голови почати будувати світле майбутнє, на яке заслуговує кожен орєнбуржець."

 ORE_the_necessity_of_communal_industrialization: "Необхідність індустріялізації комун"
 ORE_the_necessity_of_communal_industrialization_desc: "«Ми відстали від передових країн на п'ятдесят або сто років. Ми мусимо подолати цю відстань за десять років. Або зробимо це, або нас зімнуть».\n\nТак починатиметься майбутня промова голови Малєнкова. У місті Орєнбурзі оголосять амбітну програму індустріялізації. Кожну комуну заохочуватимуть розкрити справжній промисловий потенціял за допомогою централізованого економічного плану. Деякі орєнбуржці, зокрема невдалий реформатор Алєксандр Бурба, застерігають Раду, що строки надто стислі, а теперішня аграрна економіка надто крихка для потрясінь, але голова Малєнков відкинув усі побоювання. Вогонь і сталь змінять життя наших робітників!"

 ORE_heavy_industrial_commissariat: "Комісаріят важкої промисловости"
 ORE_heavy_industrial_commissariat_desc: "Орєнбурґ майже не постраждав від безглуздих бомбардувань Люфтваффе й уникнув війни, тож його неспроможність стати осередком важкої промисловости - справжня ганьба. Голова Малєнков планує виокремити теперішній промисловий підкомітет у незалежний державний орган - Комісаріят важкої промисловости, або Комтяжпром. Поява поза Робітничою радою структури, відповідальної за цілий напрямок амбітних реформ Малєнкова, є новиною для орєнбурзької політики, але Раду запевнили, що голова та його найближчі соратники постійно стежитимуть за діяльністю комісаріяту й дбатимуть, щоб здоров'я та добробут громади лишалися головною турботою кожного нового проєкту."

 ORE_plowshares_into_swords: "Перекувати рала на мечі"
 ORE_plowshares_into_swords_desc: "Наша наявна промислова база переважно виробляє сільськогосподарське обладнання, тож запаси зброї та боєприпасів небезпечно малі. Однією з перших пропозицій Комтяжпрому є переведення цивільної промисловости на військові потреби. Рада зустріла ідею прохолодно: багато сільських представників наголошують, що будь-яке падіння виробництва аграрного обладнання, імовірно, спричинить голод у регіоні. Експерти промислового комісаріяту мають власні аргументи. Нині селянство стримує не нестача знарядь, а слабке знання сучасних аграрних методів і неефективне постачання харчів до районів із дефіцитом. До того ж, коли нові фабрики запрацюють, тимчасове скорочення виробництва аграрного обладнання буде мізерним проти майбутнього випуску нових інструментальних заводів!"

 ORE_mechanize_the_peasantry: "Механізувати селянство"
 ORE_mechanize_the_peasantry_desc: "Однією з перших цілей індустріялізації голови Малєнкова є опанування виробництва тракторів. Наші селяни досі обробляють землю тягловими тваринами. Якщо дати кожній комуні власний трактор, селянська праця стане в тисячу разів простішою! Приємним побічним наслідком буде вивільнення багатьох селян для роботи на нових промислових підприємствах, а також поява нових коней для державних потреб. Застереження про те, що населення не вміє користуватися механізованим обладнанням або що постачання пального до віддалених комун обмежене, - лише контрреволюційне базікання, покликане посіяти сумнів у здатності орєнбурзького селянина пристосуватися до майбутнього."

 ORE_into_the_factories: "На заводи"
 ORE_into_the_factories_desc: "Приплив робочої сили з біженців міста Орєнбурґа вже вичерпався, адже розширена Орєнбурзька гвардія й нова промисловість дали громадянам роботу. Щоб задовольнити прогнозовану потребу в робочих руках, механізовані аграрні комуни надсилають нам селян, звільнених від польової праці. Переселення селян з ізольованих комун до регіональних промислових центрів і самого Орєнбурґа зміцнить зв'язки між громадянами нашої великої країни й зламає догму комунного мислення. Звісно, не всі селяни прагнуть покинути села заради нової роботи, тож наш доброзичливий уряд часом мусить нагадувати громадянам про неймовірну нагоду, яку їм подарував."

 ORE_a_workers_republic: "Робітнича республіка"
 ORE_a_workers_republic_desc: "Досі Орєнбурґ у повсякденній мові називали Робітничою державою, хоча лише частина населення була вільна від кайданів виснажливої аграрної бідности. Тепер, коли постають нові фабрики, а їхні робітники починають нове життя, використовуючи знання людства для примноження власної сили, ми можемо проголосити початок справжньої Робітничої республіки! Щодня промисловий ріг достатку дарує нам зброю для захисту майбутнього й знаряддя, якими ми його досягнемо!"

 ORE_the_necessity_of_political_centralization: "Підстава для політичної централізації"
 ORE_the_necessity_of_political_centralization_desc: "Почесна Робітнича рада всі ці роки намагалася сприяти поступу Орєнбурґа. На жаль, їй не вдалося втілити жодного проєкту: заважали егалітарна структура й цілковита залежність від узгодженого компромісу. Навіть нарікаючи на нескінченні суперечки й рух по колу на Робітничих конґресах, Рада сама відтворювала їхню недієздатність у меншому масштабі. Ієрархія, запроваджена головою Малєнковим на початку мандата, дещо допомогла, але велика воєнна загроза зі сходу не дозволяє дальших затримок. Нагадуючи відданим Малєнкову членам Ради про можливість допомогти йому стабілізувати політичну структуру й залучаючи представників районів під загрозою Дірлеванґера, ми раз і назавжди утвердимо владу та легітимність голови в його великому поході за порятунок Орєнбурґа від ворогів."

 ORE_lock_down_the_communes: "Взяти комуни під контроль"
 ORE_lock_down_the_communes_desc: "Влада Робітничої ради завжди спиралася на народ, а народ завжди мав право покинути Раду, коли забажає.\n\nТа в цю годину потреби прохання про вихід, які отримує голова Малєнков, наш керівник сприймає як ножі в спину країни, що прагне захистити своїх дітей.\n\nПобоювання щодо диктатури, яка зароджується? Сумніви в промисловій політиці? Щире бажання, щоб у цю найтемнішу годину їх просто лишили в спокої? Сепаратисти можуть називати будь-які причини. Любов і прощення голови Малєнкова поширюються на всіх мешканців Орєнбурґа. Представники, яких супроводжуватиме наше військо, вирушать до цих комун і з'ясують справжню причину прохань залишити уряд. Безперечно, це лише непорозуміння через поганий зв'язок. Люди нашої Робітничої армії в цьому переконаються."

 ORE_cut_down_the_council: "Скоротити Раду"
 ORE_cut_down_the_council_desc: "Кожен робітник Орєнбурґа заслуговує на неподільну увагу Робітничої ради та її доброзичливого голови. Однак теперішня маса членів Ради просто надто неповоротка, особливо в ці тяжкі часи. Віднині кожна комуна матиме в Раді лише одного представника. Щоб зберегти ефективність Ради в надзвичайну добу, перших представників обере голова Малєнков, забезпечивши команду, здатну добре ладнати з народним головою. Звісно, цей надзвичайний захід скасують після завершення кризи."

 ORE_more_equal_than_others: "Перший серед рівних"
 ORE_more_equal_than_others_desc: "У кожному місті й селі розповсюджено нову літературу, що пояснює нову організацію Робітничої ради. Робітничу демократію вдосконалено в системі, де кожна комуна має свого представника, а голова Малєнков є лише першим серед рівних. Щомісяця створюються нові комітети для роботи над різними темами, а їхні ідеї та пропозиції аналізує група членів Ради, обраних колегами. Маємо бути вдячні, що працеголізм голови Малєнкова забезпечує його регулярне переобрання до наглядової ради: завдяки довгим ночам праці він знає про кожен проєкт Ради."

 ORE_the_necessity_of_military_reorganization: "Підстава для військової реорганізації"
 ORE_the_necessity_of_military_reorganization_desc: "Щоб витримати прийдешню бурю, мусимо й далі об'єднувати сили в єдине централізоване військо. Попередня перебудова Орєнбурзької гвардії дала ефективний зразок. Через переговори спершу із союзниками на східному кордоні, а потім із комунами поблизу Орєнбурґа дедалі більше ополчень увійшло до нових «місцевих стратегічних командувань», які об'єднують кілька ополчень у цілісну структуру під проводом Робітничої ради. Поки реорганізація поширюється на захід, дедалі більше підрозділів вливається до централізованої армії, адже місцеві керівники бояться лишитися поза системою безпеки."

 ORE_centralize_the_communal_guard: "Централізувати Комунну гвардію"
 ORE_centralize_the_communal_guard_desc: "Ми почали розформовувати великі ополчення й переводити підрозділи місцевих стратегічних командувань до батальйонів, змішаних із розширеною Орєнбурзькою гвардією. Так ми нарешті стиратимемо неважливі зв'язки з окремими комунами, замінюючи їх регіональною ідентичністю та сильним бойовим духом. Групи солдатів, які ще не усвідомили величи нової Робітничої ради, розмістять найближче до кордону з бригадою Дірлеванґера, щоб вони засвоїли цінні уроки захисту слабких і невинних. Підрозділи з високим політичним розумінням натомість стоятимуть на заході й допомагатимуть місцевому розвиткові. А в усьому Орєнбурзі тепер існує чіткий ланцюг командування, що веде до Робітничої ради та її голови."

 ORE_standardize_their_weaponry: "Стандартизувати їхнє озброєння"
 ORE_standardize_their_weaponry_desc: "Централізація ополчень принесла нам справжню скарбницю зброї: люди просто принесли до нової армії старе озброєння. На жаль, цей арсенал годиться хіба для військово-історичного музею. Сучасна зброя зі Златоуста, совєцьке спорядження з номерами Західноросійського революційного фронту, пошарпані гвинтівки Арісака зі Сфери співпроцвітання, саморобки з казахських рівнин... Різноманіття ускладнює постачання набоїв, а ненадійність зброї значно знижує бойовий потенціял нової армії.\n\nПерехід усіх на совєцьке спорядження й однакові види зброї - головний пріоритет молодої промисловости. Те, чого поки не можемо виробити, доведеться імпортувати, формуючи запаси для різних полків."

 ORE_commissar_units: "Комісарські підрозділи"
 ORE_commissar_units_desc: "Ми не забули розвал Червоної Армії під час Великої Вітчизняної війни, коли генерали й офіцери воліли грати в політичні ігри замість порятунку Матері-Росії. Наша система представників у регіонах поступово стає постійною частиною армії - комісарськими підрозділами. Солдатів та офіцерів із глибоким розумінням місії Робітничої ради розподілять по війську; вони стануть основою, на якій битимуться наші люди. Воєнна загроза дозволяє Раді передати політичним комісарам надзвичайні повноваження військового правосуддя й обвинувачення, щоб вони судили за зраду підрозділи, звинувачені в невиконанні обов'язку."

 ORE_ensure_officers_loyalty: "Домогтися вірности офіцерів"
 ORE_ensure_officers_loyalty_desc: "Наші комісари працюють завзято, але не можуть бути всюди. Від початку нову армію будували так, щоб вищі щаблі офіцерської драбини посідали віддані голові та його Раді. Ця праця триває на кожному рівні. Майже для кожного чоловіка можна знайти ціну за відданість: амбіції, жадібність, прагнення безпеки для родини, патріотизм. Небагатьох офіцерів, яких неможливо використати, просто усунули від обов'язків."

 ORE_the_peoples_guards: "Народна гвардія"
 ORE_the_peoples_guards_desc: "Трагічно, що стільки робітників не розуміють важливости служби в новій армії та її численних переваг. Листівки, радіопередачі, брошури, промови священників і сільських старост, дитячі колискові... Голову задовольнить будь-що, аби послання дійшло. Це також дасть роботу митцям, які інакше сиділи б у чайних і вигадували скарги на наш славетний уряд.\n\n«Робітники! Вступайте до Народної гвардії, щоб убезпечити Орєнбурґ! Дізнайтеся більше у місцевих вербувальників!»"

 ORE_alone_and_strong: "Самі - і від того сильніші"
 ORE_alone_and_strong_desc: "«Що таке Ліга? Покидьки Матері-Росії. Бандити, злодії та реакціонери з ГУЛАГів. Дехто сподівався, що таких людей можна виправити, але це було наївно. Тепер покидьки згуртувалися в примітивну феодальну систему, де каста головорізів гнобить робітників.\n\nЩо пропонує Ліга? Відновлення старого порядку, холодних законів у руках іще холодніших людей. Хіба її пропозиція краща за німецьку? Одні обіцяють кілька днів болю й варварства, а потім смерть тисячам наших громадян. Інші - тисячоліття рабства й загибель незліченних мільйонів від тиранії. Ні, товариші, Орєнбурґ мусить відкинути пропозицію Ліги. З нею ми проживемо достатньо, щоб стати рабами; без неї маємо шанс на справжню безпеку й свободу!»"

 ORE_developing_the_power: "Зміцнення влади"
 ORE_developing_the_power_desc: "Швидкість нашого поступу вражає. Поки всі цілодобово реформують армію та промисловість, останнім часом мало хто замислювався, як виник робітничий рай. Малєнкова запропонували на голову, але хто саме?\n\nПам'ять про перших реформаторів поволі згасає. З часом ніхто не пам'ятатиме незліченних членів старої Робітничої ради, які невтомно працювали заради реформ. Тисяча ночей без сну, відданих переговорам; літри чорнила на пропозиції та контрпропозиції; незліченні честолюбці, яких пережувала й виплюнула вічна стагнація Робітничого конґресу. Їхні жертви не були марними, адже ввібралися в єдину постать голови Малєнкова. Його сходження принесло промислові реформи й суспільний поступ. Успіхи можна приписати його невтомній праці, а невдачі Орєнбурґа - людям, нездатним правильно втілити сміливе бачення голови. Разом із авторитетом голови зростають його влада та вплив, дозволяючи нам дедалі ближче підходити до обіцяного світлого майбутнього."

 ORE_dizzy_with_success: "Запаморочення від успіхів"
 ORE_dizzy_with_success_desc: "Заколисані гудінням промислових печей, робітники часом падають на підлогу. Збочений цинік поглянув би на виснажені обличчя, з'їдені голодом і спустошені втомою, та засумнівався б у робітничому раї голови Малєнкова. Але реаліст на кшталт нашого дорогого голови просто побачив би, що діти Орєнбурґа, запаморочені успіхами, лише приголомшені змінами Робітничої республіки. На воскових крилах вони підлетіли надто близько до сонця, і тяжка праця над обіцяною землею просто занадто виснажила їхні тіла.\n\nГолова Малєнков розуміє. З любови до дітей він уже пом'якшив виробничі цілі. Робітничий рай буде збудовано для його дітей і дітей його дітей."
 
 #Burba
 ORE_balancing_the_council: "Урівноважити Раду"
 ORE_balancing_the_council_desc: "Перші кроки голови Бурби після обрання не є таємницею для Робітничої ради. Ще звичайним членом реформістської фракції Алєксандр Бурба завжди наголошував на нездатності Ради провести реформи, потрібні для порятунку Орєнбурґа. Навіть якби комуни надали одностайну згоду, Рада надто велика, щоб досягти внутрішньої згоди про використання влади.\n\nВимоги нового голови про положення, які дозволять йому реорганізовувати економіку без схвалення Ради, зустріли зі скреготом зубів. Багато прихильників його кандидатури чекали, що Бурба відмовиться від обурливих вимог і належно винагородить членів коаліції, але тут він лишився непохитним. Думку Ради щодо економіки враховуватимуть, та остаточне рішення належатиме її головному виконавцеві."

 ORE_an_orenburgian_renaissance: "Орєнбурзьке відродження"
 ORE_an_orenburgian_renaissance_desc: "Голова Бурба має план. Як і личить науковцеві та промисловому інженерові, він протягом року поволі створював проєкт промислових реформ за допомогою орєнбурзьких торгівців, ремісників і політиків. Маючи свободу дій від комун і Ради, він отримав нагоду життя втілити пропозицію. Кілька майстерень Орєнбурґа обрано для розширення й механізації, щоб, спираючись на кваліфікованих працівників міста, започаткувати якісну промисловість. Особливо важливі галузі міської економіки, які виробляють найбажаніші експортні товари. Використавши цю прибуткову жилу, голова сподівається зміцнити регіональну торгівлю й накопичити капітал для фінансування інших, іще неприбуткових проєктів.\n\nУсі вони потребують природних ресурсів, і саме тут голова найбільше прагне випробувати свої ідеї. Металург за освітою, Бурба хоче впровадити нові методи на плавильних заводах, збільшивши виробництво й знизивши собівартість металу."

 ORE_reorganizing_the_militias: "Реорганізувати ополчення"
 ORE_reorganizing_the_militias_desc: "Кожен громадянин має право взяти зброю для захисту своєї комуни. Голова Бурба лише бажає, щоб цим правом користувалися ефективніше. Кілька комун прагнуть зміцнити ополчення, але не мають зброї для своїх людей. Дати зброю кожному охочому солдатові - найпростіша проблема.\n\nСкладніше подолати відсутність спільних структурних стандартів у регіональних ополченнях. Одні села мають ротаційний призов, за яким кожен чоловік мусить служити принаймні раз на рік. Інші утримують напівпостійний прошарок ополченців, яких забезпечує й годує вся комуна. Поширити єдину структуру буде важко навіть серед комун, що палко підтримали обрання Бурби.\n\nДопомагає новий Комітет ветеранів з офіцерів ополчень усього Орєнбурґа. Їхні поради визначать найнагальніші зміни, а ополчення комун, сподіваємося, легше приймуть нові настанови від військових зі свого села."

 ORE_the_urals_training_program: "Уральська програма підготовки"
 ORE_the_urals_training_program_desc: "Структурні реформи ополчень - це одне, але без якісної підготовки наші люди хіба що впорядковано підуть на смерть. Навчання має бути серйознішим за «кілька пострілів із рушниці на стрільбищі з хлопцями раз на місяць», як висловився один ополченець.\n\nНе соромно переймати досвід найкращих, а Уральська Ліга стала майстром перетворення м'яких сільських ополчень на справжні військові формування. Селяни зазвичай мають мало вільного часу, тому інтенсивні навчання Ліги спрямовані на тактику малих підрозділів, фортифікаційні роботи, підтримання бойового духу й ланцюга командування. Ополченням із більшою часткою постійних бійців, як Орєнбурзька гвардія, надали спрощену версію повної програми Ліги, щоб виправити недоліки теперішньої підготовки."

 ORE_standardized_armaments: "Стандартизоване озброєння"
 ORE_standardized_armaments_desc: "Новий Комітет ветеранів звернув нашу увагу на можливі проблеми через відсутність стандартизації зброї в ополченнях. Старі совєцькі рушниці, контрабандні гвинтівки Арісака з Далекого Сходу, саморобні пістолети з казахських рівнин, старовинні мисливські рушниці на чорному поросі...\n\nЗаплановані навчання й розгортання ополчень на кордоні вимагатимуть постачання безлічі видів набоїв і зброї.\n\nКоли підрозділи з нестачею спорядження отримають нові рушниці, ми зможемо перейти до оснащення кожного ополчення стандартизованою зброєю. Це значно спростить майбутні операції."

 ORE_adapting_their_strategies: "Адаптувати їхню стратегію"
 ORE_adapting_their_strategies_desc: "Допомога Уральської Ліги у створенні нових програм підготовки була неоціненною. Однак це не означає, що ми не можемо поліпшити її початкові пропозиції.\n\nЗвіти новопризначених офіцерів ополчення докладно описують різні проблеми програм Ліги. Комунам у глибині Орєнбурґа часто бракує військового досвіду, притаманного уральським селам, відкритим для бандитських нападів, тож навчання там просувається повільніше. На кордоні загартовані в боях місцеві ополчення краще опановують нові методи, ніж їхні брати в тилу. Однак вони побоюються, що багато тактик Ліги більше пристосовані до уральських пагорбів і гір, ніж до рівнин нашої периферії.\n\nКомітет ветеранів вивчає відгуки різних ополчень і пристосовує пропозиції Ліги до нашого становища."

 ORE_securing_the_frontier: "Убезпечити кордон"
 ORE_securing_the_frontier_desc: "Складніше розгортання ополчень на кордоні вимагало поліпшеної логістики й інвестицій у східні дороги. Та все це буде марним, якщо бандити просочаться крізь дірявий кордон, блукатимуть у тилу, нападатимуть на каравани постачання й руйнуватимуть зв'язок. Поки ці зграї виглядають як звичайні покидьки російської анархії, але багато офіцерів бояться, що люди Дірлеванґера тими самими шляхами надсилатимуть розвідників за наші лінії.\n\nРеорганізовані ополчення східного сектора по черзі проходять польові навчання на кордоні, а наші нечисленні постійні солдати патрулюють дороги й допомагають селянам полювати на бандитські зграї. Посилення контролю над кордоном також заспокоїть місцеві комуни й дозволить використати ресурси району."

 ORE_deregionalization: "Дерегіоналізація"
 ORE_deregionalization_desc: "Поглиблення зв'язків із різними ополченнями робить колись немислиму інтеграцію цілком реальною. Сьогодні голова Бурба запропонував перетворити дорадчий Комітет ветеранів на Вище командування нової «Армії Орєнбурґа та союзних комун». Проста єдина структура значно спростить розгортання ополчень за межами власної комуни порівняно з теперішньою системою переговорів. Для повної дерегіоналізації потрібен час. Спершу приєднаються Орєнбурзька гвардія та ополчення, з якими ми встановили найглибшу довіру. Вступ до сучасного війська, здатного забезпечувати й захищати всі комуни-члени, буде надзвичайно привабливим і з часом допоможе переконати решту."

 ORE_establish_the_planning_commission: "Створити Планову комісію"
 ORE_establish_the_planning_commission_desc: "Землі Робітничої держави Орєнбурґа формально охоплюють сотні кілометрів російських рівнин і сотні міст та сіл. На практиці Робітнича рада ніколи не могла використати ці простори. Будь-яку спробу розвивати ресурси окремого району блокували комуни, які нічого не отримували натомість. Більшість ревно приховувала відомості про багатства й потенціял землі, щоб запобігти зазіханням сусідів чи самого міста Орєнбурґа.\n\nГолова Бурба оголосив про створення Комісії економічного планування, першим завданням якої стане великий облік усіх ресурсів Орєнбурґа: корисних копалин, нафти, орної землі, покинутих промислових майданчиків, торговельних шляхів... Ця докладна економічна інформація вирішальна для розкриття потенціялу Орєнбурґа. Об'єднуючи членів Планової комісії з представниками перевірюваних комун, голова прагне показати, що надання Раді інформації про район принесе інвестиції та розвиток багатств комуни."

 ORE_mitigate_the_councils_influence: "Послабити вплив Ради"
 ORE_mitigate_the_councils_influence_desc: "Рада має багато якостей, але керування економікою - не одна з них. Тому голова Бурба вирішив передати незалежній Плановій комісії повний контроль над економікою.\n\nЦе вкрай непопулярно в Раді: багато хто звинувачує Бурбу в зраді робітничої демократії через запровадження непідзвітних еліт.\n\nЗамість придушення опозиції голова почав тішити самолюбство Ради й схиляти її до ідеї. Влада Планової комісії цілком походить від голови, якого обрала сама Рада. Головне, що члени Комісії не мають політичної влади. Це дозволяє застосовувати економічні знання без політичних турбот члена Ради. Комісари також будуть вільні від тягаря й давньої неприязні, які так часто вбивають великі ідеї в Робітничій раді."

 ORE_members_from_every_commune: "Члени з кожної комуни"
 ORE_members_from_every_commune_desc: "Деякі радикальні технократичні радники голови Бурби питають: чому б узагалі не відкинути ідею уряду комун? Але це ігнорує користь робітничого представництва. Без очей на місцях і чесних відгуків людей, безпосередньо залучених до реформ, ми ризикуємо стати жорстокими, самовдоволеними й, що найгірше, неефективними. Представники комун дають безліч різних досвідів і пріоритетів. Цей людський капітал треба плекати, а сильні демократичні традиції допоможуть знайти талановитих чоловіків і жінок для індустріялізації. Залучивши найкращих представників до Планової комісії, ми поліпшимо її та поширимо легітимність у районах розвитку, коли місцеві діти повернуться додому з новими проєктами."

 ORE_a_scientific_approach: "Науковий підхід"
 ORE_a_scientific_approach_desc: "«Більше фабрик» і «більше продукції» - марні показники нашого поступу. Чи добре працюють нові фабрики? Що робітники думають про навантаження? А як щодо вузьких місць у постачанні?\n\nВиявляється, науковий підхід до планування промислового розширення здатен душити багато проблем у зародку. Плинність кадрів зменшиться, якщо набирати достатньо людей. Проблеми постачання можна розв'язати, будуючи фабрики лише за надлишку вхідних матеріалів. Прогнозоване виробництво можна порівнювати з фактичними даними, знаходячи місця провалу планів. Завдяки науковому плануванню кожен наш крок веде у правильному напрямку."

 ORE_the_soviet_land_surveys: "Совєцькі геологічні розвідки"
 ORE_the_soviet_land_surveys_desc: "Живити промисловість, що стрімко зростає, дедалі важче, бо теперішні копальні й нафтовидобувні підприємства сягають межі. На щастя, молодий член нового уряду запропонував розвивати природні ресурси.\n\nВ останні роки уряд Бухаріна розпочав дослідження земель довкола Орєнбурґа в пошуках нових місць для копалень і переробних заводів. Переглянувши міські архіви й розшукавши вцілілих геодезистів по всьому регіону, цей здібний юнак зібрав величезний обсяг відомостей про підземні багатства. На опрацювання купи даних і попередніх звітів його команди потрібен час, але перші результати вже стали незамінними."

 ORE_override_the_communes_zoning: "Змінити зонування комун"
 ORE_override_the_communes_zoning_desc: "Досі комуни з обережним оптимізмом ставилися до нової економіки Орєнбурґа. Та тепер легкодоступні землі закінчуються, і ми почали оцінювати землекористування в кожній комуні. Відверто кажучи, там безлад.\n\nНайкращі землі комуни Ждановка не використовують, бо селяни не можуть визначити власника. Уперті селяни комуни Кулаґіно заважають будувати фабрику біля села, щоб не псувати краєвид із ферми. Одне з найбільших можливих нафтових родовищ лежить під коров'ячим пасовищем за Полтавкою, яке навіть місцеві тварини не надто люблять.\n\nГолова Бурба терплячий, і десятки селян приходили до його кабінету протестувати проти того чи іншого вилучення землі. Та коли він щось вирішує, то рідко відступає. Жахливі пропозиції комун щодо зонування треба скасувати."

 ORE_no_more_closed_factories: "Жодних закритих заводів"
 ORE_no_more_closed_factories_desc: "Приплив економіки здіймає всі човни: вибухове зростання попиту на матеріали, інструменти й запчастини знову відкриває старі майстерні совєцької доби. Совєцькі промислові підприємства міста Орєнбурґа, колись закриті через непотрібність величезних фабрик повоєнній економіці, стояли бездіяльними, поки в їхній тіні виникали дрібні ремісничі майстерні. Тепер сукупний попит на промислові товари знову дійшов до межі, коли ці сталеві велетні потрібні. Старі заводські робітники сходяться до колишніх місць праці, щоб навчити нове покоління користуватися машинами."

 ORE_reordering_politics: "Упорядкувати політику"
 ORE_reordering_politics_desc: "Комунна демократія Орєнбурґа не приречена вічно бути повільною й невпорядкованою. Поліпшивши організацію Робітничої ради й завчасно призначаючи засідання та конґреси, ми скеруємо демократичну енергію Комун у добре сплановані сесії. Модератори дискусій придушуватимуть непродуктивні сварки й покладуть край нескінченному повторенню суперечливих тем і ворожнечі між комунами. Голова сподівається змінити атмосферу недовіри між представниками, зробивши роботу Ради та конґресів продуктивнішою."

 ORE_a_more_professional_council: "Професійніша Рада"
 ORE_a_more_professional_council_desc: "Нині для членства в Раді не потрібно нічого, крім обрання комуною. Такий підхід на основі популярности безперечно демократичний, але за іронією ледь не привів робітничу демократію до передчасної смерти: Раду наповнюють чоловіки без дипломатичних здібностей і вартісних ідей щодо майбутнього виборців, заважаючи будь-якій спробі поліпшити рівень життя. Тим часом здібні чоловіки й жінки гибіють на фермах і простих міських роботах, марнуючи потенціял лише через брак харизми для виборів.\n\nГолова Бурба привернув увагу, переглянувши роботу кожного члена Ради до свого приходу: політику, здобутки, витрати. Столицею ходять чутки, що він готує «заяви про відставку» для тих, кого вважає нікчемними й негідними. Схоже, голова не терпітиме людей, які прагнуть назавжди зберегти жалюгідні умови Орєнбурґа."

 ORE_scientific_organization: "Наукова організація"
 ORE_scientific_organization_desc: "Голова Бурба та його соратники ретельно уклали промислові плани за науковими принципами: визначення можливих проблем і викликів, пошук належних стратегій, випробування втілення, перевірка гіпотез новими даними, корекція курсу в процесі...\n\nЦі ідеї так само лежать в основі перетворення Робітничої ради. Що таке політичний процес, як не спосіб якомога ефективніше перетворити вхідні дані на результат? Тут волю й ідеї народу просто очищують до добрих змін у суспільстві.\n\nЗа правильного підходу старі проблеми стають новими можливостями, поки ми перебираємо ідеї й розширюємо реформу політичної сфери. Робітнича рада вже виробляє більше доброї політики!"

 ORE_expanding_relations_with_the_league: "Розширити відносини з Лігою"
 ORE_expanding_relations_with_the_league_desc: "У багатьох аспектах Уральська Ліга віддзеркалює суспільство, яке голова Бурба та його фракція хочуть збудувати в Орєнбурзі: ефективне й упорядковане, де сильні захищають слабких, а зусилля кожного громадянина спрямовують мудрі керівники.\n\nУ короткій перспективі Ліга - незамінний союзник у боротьбі проти бригади Дірлеванґера. У довгій зрадлива геополітика російської анархії може зробити чесного й надійного союзника неоціненним скарбом.\n\nРозвиток подій вимагає постійних посольств і надійних ліній зв'язку замість неофіційної системи радників. Розширення ділових контактів із цивільними Ліги поліпшить відносини не лише з її керівниками, а й з населенням."

 ORE_invite_guard_trainers: "Запросити інструкторів Гвардії"
 ORE_invite_guard_trainers_desc: "Хоч наш військовий досвід розвивається, Уральська гвардія досі є найсильнішою силою регіону за підготовкою та досвідом. Ми почали просити ветеранів Гвардії навчати наші ополчення. Підвищення якости підготовки військ буде вирішальним для виживання в прийдешній боротьбі. Свідчення, що в усьому Орєнбурзі відбуваються справжні військові й політичні реформи, також переконають друзів у Гвардії в силі та життєздатності нашого уряду."

 ORE_discuss_further_cooperation: "Обговорити подальшу співпрацю"
 ORE_discuss_further_cooperation_desc: "Призначення спеціальним аташе до Орєнбурзької комуни більше не є сумною долею для урядовців Уральської Ліги. Наші посли в Лізі повідомляють, що звіти до Усть-Катава захоплено описують реформи нового уряду. Зростання довіри серед командирів Ліги поступово змінює відносини: від слабкого отримувача благодійности до майже рівноправного партнера. Для дальшого розвитку співпраці між двома країнами запропонуємо спільні навчання на кордоні й інтеграцію найкращих ополчень у стратегію Уральської Ліги."

 ORE_a_growing_jewel: "Коштовність у розквіті"
 ORE_a_growing_jewel_desc: "Будівництво нації не може бути божевільним ривком до фінішу. Це безперервний процес, у якому кожне покоління бере знаряддя попередників і вдосконалює їх для наступників. В Орєнбурзі вже зроблено багато, а Планова комісія пропонує на майбутнє ще більше. Не впадаючи в закостенілість, ми можемо врахувати довгострокові цілі, що скеровуватимуть нинішній шлях: електрифікацію, охорону здоров'я, добру інфраструктуру, якісну освіту, сильну механізовану армію - усе те, що збудували інші нації, не кращі й не гірші за нас. Нова хвиля промислових пропозицій засіє насіння, яке може не дати плодів десятиліттями, але допоможе залишити дітям Орєнбурґ коштовністю в розквіті."

 ORE_ready_to_fight: "Готові до бою"
 ORE_ready_to_fight_desc: "Спостерігачі в Орєнбурзі й за його межами казали, що це неможливо. Сотня ненавчених ополчень ворогуючих громад, укомплектованих людьми, які не довіряють нікому, народженому далі ніж за двадцять кілометрів, - і все це викувати в єдину армію, готову битися й помирати далеко від рідного села за населення оновленого Орєнбурґа?\n\nЦе була довга й тяжка праця. Ветерани кожного ополчення подружилися в Комітеті ветеранів і принесли нову довіру та повагу додому. Сини віддалених сіл навчилися битися разом. Синам Орєнбурґа знадобилося не менше часу, щоб забути роки чвар і суперечок, ніж їхнім старшим у Раді. Але тепер люди будь-якого віку починають пишатися Орєнбурґом. Вони нарешті об'єдналися не заради шкоди іншим, а щоб захистити тих, хто ще не може битися.\n\nНове військо стоїть на кордоні. Дехто ще посміюється з незнайомого акценту офіцера, інші бурчать, що їм не дозволяють користуватися родинною рушницею. Але всі готові битися за комуну й Батьківщину."

 ORE_propose_a_formal_alliance: "Запропонувати офіційний союз"
 ORE_propose_a_formal_alliance_desc: "На просторах колишнього Совєцького Союзу все змінюється. Занепад Німеччини й нові міжнародні події розхитують незручний статус-кво між російськими воєводами. Дірлеванґер і Маґнітоґорск є безпосередніми загрозами, та мусимо стежити й за небезпеками на обрії. Об'єднавши дві країни в регіональну коаліцію, ми разом зустрінемо майбутнє. Чоловіки й жінки Росії надто довго потерпали від примх долі. Як розрізнені комуни Орєнбурґа подолали недовіру та ізоляцію, так, можливо, колись возз'єднається вся Росія..."

 ORE_orenburg_redefined: "Орєнбурґ наново"
 ORE_orenburg_redefined_desc: "Стабільність без застою. Поступ у сталому темпі. Добре підготовлена еліта, що веде народ знаннями й досвідом. Постає новий Орєнбурґ!\n\nДехто сумує за тим, що лишилося позаду. Якийсь час чоловіки й жінки Орєнбурґа володіли ревучим полум'ям справжньої свободи. Та поки Орєнбурґ дорослішає під реформами голови Бурби, громадяни розуміють: неконтрольований вогонь не здатен ані зігріти їх, ані освітити шлях. Натомість полум'я ледь не перетворило майбутнє на попіл.\n\nСеляни обробляють реорганізовані поля знаряддями й сучасними методами. Нові фабрики гудуть, коли робітники полишають неродючі землі заради міст, що зростають. Діти, які колись блукали вулицями й полями, рівно сидять у школах і готуються до майбутнього. Ефективні соціальні програми перетворюють зламаних біженців на робітників і громадян. А на кордоні солдати утримують упорядковані укріплення, готуючись захищати країну, в яку колись відмовлялися вірити.\n\nТак, постає новий Орєнбурґ. Голова Бурба зробив неможливе й приборкав анархічне пекло, перетворивши його на незліченні ліхтарі, що освітлюють шлях. Металург, який став політиком, викував краще майбутнє Орєнбурґа."

 ORE_uralian_industrial_aid: "Уральська промислова допомога"
 ORE_uralian_industrial_aid_desc: "Нашу промислову програму ретельно сплановано, а більшість проблем на шляху успішно подолано. Тепер швидкість поступу обмежують незалежні від нас чинники, як нестача верстатів і технічних знань.\n\nРозв'язання цих проблем прийшло з несподіваного боку: радники Уральської Ліги запропонували надіслати знаряддя й спеціялізовану робочу силу, яких нам бракує. Представники Ліги пояснили Робітничій раді, що збільшення кількости фабрик у регіоні своєю чергою породить нові промислові знаряддя й працівників, до яких за потреби зможе звернутися Ліга. Це чудово нам підходить, адже додаткові матеріали можна надсилати звичайними караванами до Орєнбурґа й назад."
 
 ### Events ###
 ORE.1.t: "Набіг на Орєнбурґ"
 ORE.1.d: "Щоразу, коли це стається, ми кажемо собі, що мали передбачити. Та щойно все завершується, знову переконуємо себе, що таке більше не повториться. Один із розвідників доповів Робітничій раді: рейдерів Дірлеванґера помітили за швидким просуванням до комуни відразу за нашим кордоном, і вони явно готують напад. Рейдери добре споряджені, досвідчені й, імовірно, більш ніж здатні перемогти ополчення комуни. Тож перед нами знову ненависний вибір. Якщо поквапитися й звернутися до інших роздратованих комун району, ми зберемо силу, здатну відбити напад і показати дикунам, що не стоятимемо осторонь, поки вони знущаються з наших людей - ні тепер, ні будь-коли. Та цим ми ризикуємо спровокувати Дірлеванґера на більший конфлікт. Чи варто наражати всі комуни на небезпеку заради захисту однієї?"
 ORE.1.a: "Ми дамо відсіч!"
 ORE.1.b: "Ризик надто великий!"
 
 ORE.2.t: "Глибоко на заході"
 ORE.2.d: "Наче з нізвідки на нашій території з'явилася велика зграя рейдерів Дірлеванґера. Сутички з ним не новина, але застосована тут тактика незвична й непослідовна. Замість одного жорстокого удару його сили широко розсіялися районом: малі групи завдають населенню страшних ударів і зникають раніше, ніж ми встигаємо зібрати будь-яку відсіч.\n\nСпершу командири припустили, що Дірлеванґер нарешті помер, бо в діях рейдерів не було помітно єдиних наказів, а ці групи здавалися розколотими рештками Бригади.\n\nОднак наші джерела підтвердили: на жаль, Дірлеванґер досі живий, а ми лишилися приголомшеними руйнуваннями й стражданнями, яких завдав цей хаотичний, але якимось чином скоординований напад."
 ORE.2.a: "Це колись скінчиться?"

 ORE.3.t: "Кліщі"
 ORE.3.d: "Наче з нізвідки на нашій території з'явилася зграя рейдерів Дірлеванґера. Сутички з ним не новина, але застосована тут тактика незвична й непослідовна. Замість одного жорстокого удару його сили широко розсіялися районом: малі групи завдають населенню страшних ударів і зникають раніше, ніж ми встигаємо зібрати будь-яку відсіч.\n\nСпершу командири припустили, що Дірлеванґер нарешті помер, бо в діях рейдерів не було помітно єдиних наказів, а ці невеликі групи здавалися розколотими рештками Бригади.\n\nОднак наші джерела підтвердили: на жаль, Дірлеванґер досі живий, а ми лишилися приголомшеними руйнуваннями й стражданнями, яких завдав цей хаотичний, але якимось чином скоординований напад."
 ORE.3.a: "Це колись скінчиться?"

 ORE.4.t: "Протокол п'ятдесят сьомого конґресу"
 ORE.4.d: "Нескінченне бурмотіння й брак злагоди в Раді анархічних комун були досконалою мікромоделлю проблем, що мучили громади Орєнбурґа. Красномовний представник самого Орєнбурґа підвівся, щоб обґрунтувати посилення політичної централізації - звичну тему дискусій. Він почав зі спостережень про проблеми через відмову Ради підтримати бодай якусь стандартизацію торговельної політики та військової підготовки. З усіх боків сипалися дзвінкі образи, та обдарований промовець незворушно продовжував, пристрасно пояснюючи, як ці потрібні заходи значно поліпшать життя й безпеку комун. Невелику втрату свободи з надлишком компенсують економічні та військові переваги пропозиції. Подальше голосування, як і очікувалося, не дало результату.\n\nПотім підвівся гордий, але простий фермер і виступив за ширшу приватну власність: його господарство давало достатньо лише для нього та родини. Чому вони мають страждати, щоб годувати людей, яких ніколи не зустрінуть? Подальше голосування, як і очікувалося, не дало результату.\n\nНаступною встала тиха й нервова жінка, чий голос ледве пробивався крізь гомін розмов. Вона коротко закликала до єдности й безпеки, а тоді замовкла. Дехто з представників урвав шепіт, побачивши її порожній погляд. Далі пролунала історія жаху й трагедії, що викликала зойки та змусила багатьох присутніх із болем відвести очі. Набіг - особливо жорстокий і моторошно значущий. Зграя грубих чоловіків у чорній формі, що говорили мовою проклятих загарбників. На середині розповіді голос жінки зірвався, але почутого вистачило, щоб її питання винесли на обговорення.\n\nПодальше голосування, як і очікувалося, не дало результату."
 ORE.4.a: "Можливо, варто проголосувати ще раз."

 ORE.5.t: "Питання біженців"
 ORE.5.d: "Постійне переміщення населення після падіння Росії й раніше було проблемою для Орєнбурґа, але тепер, коли на сході підносяться тіні Бригади й Чорної Гори, через гори до колективу суне дедалі більше відчайдушних шукачів притулку. Спершу додаткові робочі руки вітали, та Робітнича рада непокоїться дедалі сильніше, бо місто Орєнбурґ і довколишні села наближаються до межі місткости.\n\nЗапропоновано кілька способів розв'язати проблему. Ізоляціоністи в Раді радять просто не пускати біженців, за потреби - під дулами рушниць ополченців. Співчутливі голоси наполягають, що комуна має відчинити двері й прийняти їх, а далі влаштовувати зростаюче населення настільки, наскільки здатен неорганізований «уряд». Третя фракція пропонує компроміс: дозволити лишитися біженцям із корисними навичками, а решту спрямувати далі до інших територій.\n\nЗрештою, рішення треба ухвалити - і швидко."
 ORE.5.a: "Мусимо убезпечити кордони."
 ORE.5.b: "Ми відчинимо їм двері."
 ORE.5.c: "Приймемо лише найкращих."

 ORE.6.t: "Аграрна політика"
 ORE.6.d: "Останніми тижнями Робітничу раду Орєнбурґа охопила люта внутрішня суперечка через нещодавні неоднозначні економічні пропозиції товариша Малєнкова. Не секрет, що наше економічне становище, м'яко кажучи, незадовільне! Однак прагнення зберегти анархічний статус-кво в урядовій політиці призвело до того, що глибоко консервативне селянство чинить значний опір навіть дрібним пропозиціям.\n\nСама пропозиція товариша Малєнкова справді цікава, і багато хто міркує, як він сподівається втілити такі грандіозні ідеї. Малєнков пропонує масштабну індустріялізацію, вочевидь незалежно від бажань окремих комун, що вже викликало сильний спротив значної частини делегацій. Товариш Малєнков стверджує, що політика індустріялізації різко збільшить урожайність і забезпечить стабільне харчування зростаючого населення.\n\nТа його пропозиція ще більше розпалила наявну напругу в нашій «нації», і поки суперечки стають агресивнішими й пристраснішими, дехто починає сумніватися, чи виживе Орєнбурґ..."
 ORE.6.a: "Ми готові змінюватися на краще."
 ORE.6.b: "Нас усе влаштовує."

 ORE.7.t: "Автономія комун?"
 ORE.7.d: "Політичний фундамент Орєнбурґа було зведено на принципах псевдоанархічного егалітаризму, комунного землеробства й антиавторитаризму. Попри впровадження таких прогресивних утопічних концепцій наш революційний політичний експеримент цілковито обернувся проти нас, а «нація» стала схожою на злиденне антиутопічне пекло. Крім того, нездатність незалежних аграрних комун розв'язати серйозні проблеми безперервної кризи біженців посилила сумніви щодо державного устрою Орєнбурґа й ненависть до анархічного статус-кво.\n\nОстанніми тижнями Робітнича рада Орєнбурґа обговорювала запропоновані заходи централізації, що безперечно розпалило напругу між політичними фракціями «держави». Головним прихильником централізації є товариш Малєнков, який захопив значну частину занепокоєних орєнбуржців аргументом, що анархізм треба відкинути й запровадити програму примусової індустріялізації для виживання Орєнбурґа. Натомість противники Малєнкова на чолі з місцевим промисловим магнатом Алєксандром Бурбою висунули переконливий аргумент нібито на користь ширшої демократизації аграрних комун і встановлення квазітехнократичної системи «врядування», де пануватимуть такі самі промисловці, науковці та інженери, що врешті має поліпшити становище «нації».\n\nПопри тривожний і дещо загрозливий характер дискусій, Робітнича рада Орєнбурґа знову довела, що є неефективним і некомпетентним «органом влади». Суперечка лютує в Раді, загрузнувши у вічному потоці чвар і бюрократії. Однак багатьом представникам набридла начебто беззмістовна гризня Малєнкова й Бурби, тож Рада проголосувала за голосування щодо централізації, сподіваючись угамувати ситуацію й досягти згоди..."
 ORE.7.a: "В єдності знайдемо згоду."
 ORE.7.b: "Збережемо статус-кво."
 ORE.7.c: "Можливо, нам потрібні зміни."

 ORE.8.t: "Безпека торгівлі"
 ORE.8.d: "Серед небагатьох справді цікавих питань, які Рада обговорювала цього дня, була торгівля із сусідніми державами. Досі відносне багатство орєнбурзьких комун лишалося в їхніх межах: страх зовнішніх загроз відбивав охоту ризикувати торгівлею. За іронією, ця параноя лише заважала нормалізації відносин із сусідами Орєнбурґа, хоча вони й раніше не надто старалися. Оскільки це тільки обтяжувало нас, ідея відкрити комуни для торгівлі з довколишніми землями ставала дедалі популярнішою й зрештою заслужила ґрунтовного обговорення в Раді. Після запеклої дискусії її члени поділилися на два умовні «табори». Перший підтримував відкриття Орєнбурґа для торгівлі з ретельно обраними територіями й державами, що також допомогло б створити йому репутацію. Інший цілковито заперечував ідею, прагнув продовжити ізоляціонізм і наголошував, що з бандитами на кожній дорозі торгівля не має сенсу. Після перерви через сварку свинаря з конярем, а потім особливо пізньої вечері, голосування нарешті відбулося в обурливо пізню годину..."
 ORE.8.a: "Збережемо таємницю й безпеку."
 ORE.8.b: "У цьому немає потреби."

 ORE.9.t: "Дискусія про інфраструктуру"
 ORE.9.d: "Голова засідання з острахом поглянув на порядок денний. Досі кожну пропозицію заперечували й обговорювали щонайменше годину, навіть дрібні та цілком прийнятні. Він глибоко вдихнув. Може, лише може, цього разу все мине швидко. "Наступний пункт порядку денного - пропозиція фінансувати будівництво доріг із нещодавно зібраних податків".\n\nЗа лічені секунди шестеро людей у різних кінцях зали одночасно підвелися, а головуючий внутрішньо помер. Той, хто встав першим, вигукнув: "Ми, представники комун, заперечуємо проти цієї пропозиції!" Голосом, у якому було більше втоми, ніж у тисячолітнього старця, голова відповів: "Гаразд, вам слово". Селянин пустився в начебто нескінченну тираду про перевищення повноважень, фашизм і тиранію. Ці дороги були засобом обкрадати робітника, Орєнбурґ грабував сільські комуни заради поліпшення міста, і так далі годинами. Якщо ці дороги справді були тим, за що їх видавали, то це означало б не що інше, як обрання фашистського уряду в Орєнбурзі. На цьому будь-який поступ того дня скінчився, а дорожній проєкт загруз у пеклі дискусій."
 ORE.9.a: "Час від часу й ми можемо висловитися."
 ORE.9.b: "Невже не знайдеться бодай однієї речі, з якою погодяться всі?"

 ORE.10.t: "Бурба вступив на посаду голови!"
 ORE.10.d: "По всій нашій гордій «нації» робітники Орєнбурґа вибухнули бурхливими й палкими святкуваннями майбутнього відродження похмурого комунного раю. Сьогодні політик-реформіст Алєксандр Бурба офіційно вступив на посаду голови Робітничої ради Орєнбурґа.\n\nКолишній місцевий промисловий магнат, голова Бурба здобув широку підтримку найрізноманітніших фракцій Орєнбурґа. Після прибуття до регіону він уперше зажив слави завдяки успішній відбудові самого Орєнбурґа, за що місто охрестили «Венецією Західної Росії». У вступній промові перед Радою голова Бурба оголосив, що вкладатиме дедалі більші суми капіталу в інфраструктурні проєкти, аби поліпшити катастрофічні середньовічні умови життя в сільській місцевості. Крім того, голова Бурба оголосив амбітний комплекс реформ, покликаних забезпечити послідовні демократичні й правові засади в різних селянських комунах. Та чи вдасться його спроба стандартизації та реформ, ще належить побачити...\n\nХай там як ставляться до голови Бурби - прихильно чи вороже, - майже всі громадяни й місцева влада дійшли висновку, що за нього його кліка напевно здійснить бодай якусь реформу."
 ORE.10.a: "Молімося, щоб голова Бурба приніс Орєнбурґу мир і процвітання."

 ORE.11.t: "Пропозиції гостей"
 ORE.11.d: "Останніми тижнями група невдоволених представників комун люто протестувала проти Робітничої ради, вимагаючи виділити більше часу для виступів запрошених промовців від комун. Спочатку вважалося, що протести різних делегацій невдовзі вщухнуть, але останніми днями дедалі завзятіший опір Робітничій раді лише посилився. Унаслідок цього «еліту» Ради скликали для обговорення можливого розв'язання проблеми й виправлення становища."
 ORE.11.a: "Мусимо зберегти єдність."
 ORE.11.b: "Ні, нас не залякати й не примусити скоритися!"

 ORE.12.t: "Стан ополчень"
 ORE.12.d: "Постійною суперечкою в міській раді Орєнбурґа є рівень готовности сил безпеки регіону. Нинішня строката мішанина ополчень ледве підтримує безпеку окремих комун. Зростання бандитизму в регіоні та посилення тиску німецьких і казахських бандитів на східні й південні комуни змусили Робітничу раду спробувати стандартизувати й поліпшити якість ополчень комун.\n\nЦя діяльність не лишилася непоміченою в комунах, де часто нарікали на допитливих міських чиновників Орєнбурґа, які спостерігали за вишколом ополчення й намагалися переконати офіцерів краще готувати своїх людей. Тепер роздратування сягнуло точки кипіння: до Робітничої ради надійшла офіційна скарга, написана кількома сільськими старостами. Між представниками й Радою почалася нова низка сварок: сільські представники звинувачують нас у тому, що ми реакційні свині, які силоміць змушують ополчення служити примхам міста.\n\nТим часом у поліпшенні готовности ополчень поступу немає. За межами прикордоння ополчення комун - це жменька сільських чоловіків, які раз на місяць стріляють із рушниць. "Навіщо готуватися більше? - питають вони. - Ми не сваримося із зовнішнім світом. Ми захищаємо свої господарства, як робили завжди"."
 ORE.12.a: "Мусимо подбати, щоб тиранія спинилася на кінці дула."
 ORE.12.b: "Вовки за межами Орєнбурґа підходять дедалі ближче..."

 ORE.13.t: "Захист торгівлі"
 ORE.13.d: "Новий день - нова група розлючених представників комун. Сьогоднішнє питання - поширення торговців з Уралу. Відносний мир і добробут Орєнбурґа завжди приваблювали торговців із зовнішнього світу. Ремісники міста Орєнбурґа, здебільшого не турбовані Люфтваффе, могли безперешкодно виробляти різноманітні цінні товари. Потік ресурсів з Уралу й на Урал був особливо прибутковим для містян.\n\nЦей підприємницький дух майже не поширився за межі міста. Селяни комун - люди сторожкі: вони й так не довіряють чужинцям зі свого села, не кажучи вже про прибульців з-за кордонів комуни. Та це не завадило сміливішим торговим караванам шукати обміну за межами міста Орєнбурґа. Одні розшукують колишні совєцькі промислові об'єкти, які ще можуть працювати, інші намагаються вимінювати товари в робітників небагатьох уцілілих видобувних підприємств або шукають рідкісні плантації товарних культур.\n\nСеляни не переконані в користі вільної торгівлі: вони скаржаться на пожвавлений рух регіональними дорогами; звинувачують торговців у розвідці для розбійників; один сільський староста заявляє, що «ті виродки з Уралу» запліднили його доньку. Подана нам петиція вимагає обмежити торговців дорогами, що ведуть до міста Орєнбурґа й з нього.\n\nНа щастя, цього разу нескінченна бюрократія та переговори, притаманні Робітничій раді, дають змогу просто поховати справу, доки селянам не набридне вимагати змін."
 ORE.13.a: "Вони що, не чули про порівняльну перевагу?"
 ORE.13.b: "Заради добра тих, хто живе в комуні."

 ORE.14.t: "Сепаратизм?"
 ORE.14.d: "Влада Робітничої ради зрештою походить від народу, і без його згоди Рада - ніщо.\n\nГнітюче часто представник якоїсь комуни просить дозволу вийти з Ради. Для одних страх повзучого авторитаризму в Орєнбурзі достатній, щоб відкликати приєднання до Робітничої ради. Для інших Рада - лише невдалий експеримент, нездатний досягти поступу ані в питаннях безпеки, ані в подоланні аграрних криз. Поки мрія про спільну демократичну організацію в Орєнбурзі мучиться в агонії, надто багато сіл замикаються в собі й відмовляються від зовнішнього світу.\n\nЧасом нам удається нашкребти достатньо компромісів і хабарів, щоб утримати більші села й містечка в Орєнбурзькій комуні. Та здебільшого збереження відповідної комуни не варте зусиль. Вихід із Робітничої ради, як завжди, ускладнюють бюрократія, дискусії та ходіння по колу робітничої демократії."
 ORE.14.a: "Це нісенітниця."
 ORE.14.b: "Зрештою, наші повноваження походять від народу..."

 ORE.15.t: "Освітнє питання"
 ORE.15.d: "Комуни вимагають припинити втручання Орєнбурґа в освіту. Одним із небагатьох успіхів Совєцького Союзу Бухаріна були зусилля з викорінення неписьменности по всій Росії. Державна шкільна система сягнула навіть найглибшої провінції.\n\nЯк і все добре, систему освіти знищило прокляте німецьке вторгнення. Дехто в місті Орєнбурзі мріяв використати Робітничу раду, щоб відновити початкову, середню й навіть вищу освіту та скористатися занепалою совєцькою інфраструктурою, але, як завжди, небажання комун співпрацювати загальмувало план.\n\nДеякі села вважають самоочевидною марнотою часу й ресурсів навчати дітей чогось, крім користування плугом для роботи в полі та рушницею для відлякування бандитів. Інші комуни місцеві священники переконали доручити навчання наступного покоління людям Божим.\n\nСьогодні до Орєнбурґа прибули представники кількох комун, щоб вимагати припинення втручання Ради в їхню освіту. Можливо, селяни відмовилися від подальшої допомоги, почувши чутку, що міські інструктори Орєнбурґа - троянські коні в спробах міста провести централізацію.\n\nЦя невтішна новина започаткувала нові дискусії про марність навчання ізольованих сіл і комун. "У місті Орєнбурзі достатньо освічених людей. Навіщо намагатися допомагати селянам?" Інші зауважують, що освічене населення здатне читати звіти з міста, краще організувати свою комуну й використовувати ті нечисленні промислові підприємства, що лежать за межами міста Орєнбурґа."
 ORE.15.a: "Ми думаємо не лише про завтрашній день."
 ORE.15.b: "Принаймні іншим дітям дістанеться трохи більше підручників..."

 ORE.16.t: "Успішний конґрес"
 ORE.16.d: "Успіх! Реформістській фракції Робітничої ради вдалося об'єднати міцну більшість комун із кількох питань. Комуни погодилися допомогти відремонтувати кілька ключових доріг у напрямку Уралу в обмін на нове мито для торговців. Кільком важливим комунам надали звільнення від мита, щоб утримати їх у нашій коаліції. Деякі з більших регіональних ополчень неохоче прийняли нашу пропозицію спільних військових навчань в обмін на нову зброю зі Златоуста. Це спричинило новий раунд торгів з іншими селами, які боялися відстати в гонці озброєнь, адже важче озброєння зберігатиметься в місті Орєнбурзі й застосовуватиметься лише за згодою більшости комун. Нарешті, спільна ініціятива з відправлення лікарів і біженців із міста Орєнбурґа до західних комун, знелюднених епідемією, зустріла лише символічний спротив, коли комуни погодилися, що біженцям щонайменше десять років заборонятимуть голосувати за пропозиції міста Орєнбурґа.\n\nСьогодні наші перемовники нарешті змогли проспати цілу ніч після марафону кулуарних переговорів. Хоча потрібний для глибоких структурних реформ консенсус досі недосяжний, ми заручилися схваленням достатньої кількости людей, щоб працювати над тимчасовими розв'язаннями проблем, які мучать Орєнбурґ. Такі успіхи дають надію, що в майбутньому, можливо, вдасться розпочати нові реформи. Члени реформістської фракції Робітничої ради вже проводять розбір результатів Робітничого конґресу, щоб оцінити відданість і опір різних комун Орєнбурґу та визначити, де найкраще застосувати зусилля для їх зваблення перед наступним Робітничим конґресом."
 ORE.16.a: "Великий день для робітників!"

 ORE.160.t: "Провальний конґрес"
 ORE.160.d: "Ще один Робітничий конґрес - ще одна низка змарнованих можливостей. Кілька проєктів, які ми вважали гарантованими, провалилися на завершальних етапах переговорів. Зневага до централізаційних зусиль міста Орєнбурґа, недовіра до доброї волі далеких комун, страх перед зазіханнями зовнішнього світу... Чимало причин проблем Орєнбурґа водночас заважають йому втілювати будь-які рішення. Деякі з найретельніше опрацьованих політичних пропозицій без жодного пояснення ветували представники сіл, де жило менше ста душ.\n\nВ останній день переговорів кілька представників комун провалили важливу пропозицію відправити лікарів і біженців для відновлення й заселення групи західних комун. Почалася бійка: зневірені біженці з міста Орєнбурґа, які були в залі й доводили своє право покинути переповнений табір та шукати землю серед знелюднених комун, зійшлися в крику з представниками, що звинувачували їх у роботі на міську раду Орєнбурґа. Порядок відновили лише тоді, коли міська варта почала викидати призвідників з обох фракцій.\n\nНаші союзники в місті Орєнбурзі й серед небагатьох комун, які нас підтримали, розчаровані, але не здивовані. Дехто запевнив нас у подальшій підтримці. Інші мовчки вислизнули з конґресу. Багато членів нашої фракції в міській раді вже не сподіваються побачити хоч якісь зміни. Глибокі структурні проблеми Робітничої ради знову знищили будь-який шанс на єдність і поступ."
 ORE.160.a: "Завжди буде наступний конґрес..."

 ORE.17.t: "Рейдери на кордоні?"
 ORE.17.d: "Нерегулярні звіти розпорошених ополчень, що правлять за Комунні сили оборони, - це вся розвідувальна мережа, яку має Комітет. Утім, останнім часом ці повідомлення набувають тривожної нагальности (і пронизливости); більшість із них спричинена активністю біля нашого кордону з Бригадою Дірлеванґера. Посилені переміщення ворожих сил разом зі спостереженнями за караванами на місцевій дорожній мережі дають підстави вважати, що сам Дірлеванґер зі своїм найближчим почтом діє вздовж нашого кордону.\n\nОкрім звичного посилення навчань, запропонованого нашим військовим штабом, дехто у верхівці Ради застерігає, що нам потрібна довгострокова стратегія реагування. Чого хоче Король бандитів, поки невідомо, але всі певні: з віком він ставатиме лише нестабільнішим і непередбачуванішим, а його Бригада дедалі жадібнішою до грабунку й кровопролиття. Поки Дірлеванґер живий, він ще може стримувати своїх людей, та коли його волі вже не стане, щоб карати непослух, - ніхто не насмілюється уявити, що трапиться.\n\nНехай це буде попередженням нам і Лізі: звір постарів, але коли його розбудять, щелепи будуть такими ж лютими, як завжди. Мусимо готуватися до битви, що неодмінно чекає попереду."
 ORE.17.a: "Ми мусимо щось із цим зробити!"
 ORE.17.b: "Тривожні ознаки."

 ORE.18.t: "Відродити комунний набір?"
 ORE.18.d: "Член Ради піднявся до трибуни. Він трохи тремтів. Знаючи, що сказане буде вкрай непопулярним серед присутніх радників, він читав із аркуша. Рясно пітніючи, він не хотів ризикувати й забути завчений текст.\n\n"Панове й пані. Сьогодні я говоритиму про питання, важливе для виживання комун. Як багатьом із вас відомо, загрози насуваються з усіх боків. Фашистські бандити Оскара Дірлеванґера, псевдонаука Лисенка й навіть нестримний мілітаризм Уральської Ліги загрожують нашій утопічній державі. Тому я пропоную захід, який багато хто з вас вважає радикальним, а я - необхідним. На мою думку, Робітнича рада має розпочати набір солдатів із різних комун до Орєнбурґа".\n\nМайже всі радники в один голос заходилися освистувати молодого, знервованого промовця за трибуною.\n\nРадник насупився. Це був не найкращий вступ у політику. Він сумно похитав головою й зійшов із трибуни."
 ORE.18.a: "Мав би вже знати, як тут усе працює."
 ORE.18.b: "Знаєте, завжди є інший шлях..."

 ORE.180.t: "Таємна армія"
 ORE.180.d: "Східні комуни. Завжди наші найрозумніші союзники, особливо ті на околицях, які до біса добре знають, що означатиме напад Дірлеванґера.\n\nУтім, це не заважає їм бути скутими непоступливими представниками. Та чи можна взагалі сказати, що представник справді представляє свій народ, якщо не бажає подбати про його безпеку? Якщо людина готова вступити до центральної армії, зрештою, вони не мають права її зупиняти.\n\nТож ми потай розпочнемо гру. Вербувальників відправлять до прихильних нашій справі керівників східних ополчень, щоб вони очолили охочих ополченців і створили формальніші сили оборони.\n\nЗвісно, Рада не надто схвалює цей захід, але навряд чи зможе діяти проти нього, якщо місцеві уряди так уже випадково добровільно позичать нам солдатів в обмін на обіцянку певної... неявної допомоги.\n\nЗрештою, відчайдушні часи вимагають відчайдушних заходів."
 ORE.180.a: "Чого вони не знають, те їм не зашкодить."

 ORE.181.t: "Уривок із нотаток представника Павлова"
 ORE.181.d: "Радники Комун Орєнбурґа, сьогодні я маю повідомити вам приголомшливі новини. За всі роки служіння братерству робітників і неподільному союзу соціялізму мені ще не доводилося доповідати про активну підривну діяльність, підготовану членами нашої ж Ради, навіть її найвищими членами. (Ефектна драматична павза.) Але віднині це змінилося.\n\nЗа останні 72 години, пані та панове, я отримав безліч відомостей, і всі вони тривожні. Дозвольте підсумувати для тих, хто не схильний читати документи, які я роздав усім присутнім у залі: тепер ми напевне знаємо, що члени реформістської фракції (не показувати пальцем і не охати театрально: прецедент визнає це поганим кроком) зібрали спорядження, людей і зброю для підготовки й подальшого створення ополчення. Це, звісно, настільки відверто суперечить законам, що визначають нашу Комуну, що важко повірити. Ба більше, це демонструє брак довіри до спроможности Ради визначати стратегічний напрям Комун, який межує з розколом! (Примітка: тут задля найбільшого ефекту дивитися в очі старшим радникам.)\n\nТе, що Рада вирішить робити з цими відомостями, цілковито залежить від неї, але я не сумніваюся, що Дух Рівности, який порушили Бурба та його друзі, отримає справедливе відшкодування. Дякую. (Не перечепитися на сходах, як під час минулої промови.)"
 ORE.181.a: "Цього ніколи не було."
 a_orenburg_tt: "Промову знаходять і знищують."
 ORE.181.b: "Усі мають це почути!"
 b_orenburg_tt: "§RПромову виголошують на засіданні Ради.§!"

 ORE.182.t: "Із нотаток радника Бурби:"
 ORE.182.d: "Знищення промови було, мабуть, найшвидшою частиною всієї цієї клятої мороки. Щиро не можу повірити, що той чоловік прийшов із нотатками, підготованими для всієї Ради, але лише з одним примірником промови. Це чудово свідчить про якість декого з тих, кого зібрали серед наших так званих «найкращих і найрозумніших». Якщо така майбутня ефективність нашого планування, то з Лисенком нам, може, було б краще! Принаймні коли він задумує когось убити, то, напевно, досягне успіху.\n\nТепер до самого приховування: про підкинуті контрдокази багато не скажеш. Зрештою, Рада - зграя щурів; нам лише треба було прив'язати Павлова до апетитного шматка сиру, і вони накинулися на нього всією ордою. Отака вам соціялістична єдність. Кажуть, його замінять сином амбітного фермера. Може, відпочинок піде йому на користь, особливо з огляду на характер звинувачень, які ми на нього повісили. (Не думаю, що хтось здатен виробляти таке з настільки різноманітними свійськими тваринами й не знепритомніти від виснаження, але я ніколи не недооцінював орєнбурзької винахідливости.)\n\nБуду відвертим: на коротку мить я подумав, що ми розвалимося, особливо коли вперше виявили витік, але зрештою це може піти нам лише на користь. Завдяки цьому ми навіть поліпшили внутрішню безпеку й способи військового виходу. Я винен Павлову випивку. Якщо до того часу він не накладе на себе руки."
 ORE.182.a: "Вистава триває."

 ORE.183.t: "Кінець таємної армії"
 ORE.183.d: "Будівля Орєнбурзької ради на перший погляд нічим не примітна. Коли настав час зібрати кошти на спорудження комплексу для законодавчого апарату робітників, чимало комун прийшли з порожніми руками; чи то через бідність, чи то через корупцію - ніхто не міг сказати. Багато хто глузує з її вигляду, але переважна більшість насмішок дістається її безпорадним представникам. (Ніхто навіть не помітив, як Павлов із товстою валізою й рішучим виразом обличчя забіг до будівлі.)\n\nСьогодні ніхто не сміється. Рада жадає крови.\n\nКрики, виття й звуки кулачної бійки (останні доволі рідкісні з огляду на... поважний вік і статуру делегатів) лунають із будівлі майже 36 годин поспіль. Протокол Ради - чи принаймні нажаханий писар, якого розлючені радники замкнули в його кабінці, - фіксує повний розпад законности й порядку майже протягом двох діб. Чути постріли. П'ятеро поранені. Троє помирають, бо медичної допомоги немає, і ніхто за ними не сумує: зрештою, є важливіші справи.\n\nКоли осідає пил після того, що назвуть Орєнбурзькою різаниною, стають зрозумілими дві речі. Делегатів, які раніше належали до кліки Бурби, заарештовано за таким довгим переліком звинувачень, що Рада вперше дозволяє використовувати в судах скорочену версію. Чимало звинувачень містять усілякі непристойності. За кожним причетних засудять до багатьох, багатьох років ув'язнення.\n\nА сила ідеалів, яких вони колись дотримувалися, - поміркованої індустріялізації та діяльного керівництва, Орєнбурґа з капітаном біля стерна - зламана назавжди. Та не зламана сама армія, і дехто вже пропонує повернути її на службу нашим власним цілям..."
 ORE.183.a: "Замкнути їх і покласти цьому край."
 ORE.183.b: "Власне, ці люди могли б нам знадобитися."

 ORE.19.t: "Перевірка ополчень комун"
 ORE.19.d: "Алєксєєвське ополчення комуни муштрувалося під гарячим сонцем край селянського поля зі старими рушницями, карабінами часів Великої Вітчизняної війни й димнопороховими дробовиками в руках. Місцевий селянин зацікавлено спостерігав і майже відразу помітив вади. Сержанти-інструктори, які мали навчати, натомість невимушено розмовляли з ополченцями, поки ті незграбно чистили й розбирали в польових умовах своє строкате озброєння. Ще далі інші ополченці вправлялися на стрільбищі, а єдина дозволена коробка набоїв лежала на пласкій лаві між вогневими позиціями. Селянин із розпачем зауважив: жодні двоє ополченців не стояли правильно й ніхто не показував особливого хисту навіть до початкової стрілецької підготовки.\n\nВін занотував це в пошарпаному шкіряному записнику й озирнувся, щоб зробити ще кілька нотаток про готовність і загальну дисципліну.\n\nЗвісно, селянин був зовсім не селянином, а переодягненим штабним офіцером із міста Орєнбурґа, який вирушив у пустища перевірити окраїнні ополчення комун, відомі гордістю й небажанням дослухатися до настанов справді кваліфікованих людей. Зробивши текучим синім чорнилом кілька нищівних зауважень, він із огидою закрив записник.\n\nЦе був лише ще один доказ. У певному сенсі вони були майже самогубцями: до обов'язку захищати батьківщину від найжахливіших угруповань Росії ставилися так, як спортсмен ставився б до п'яного полювання з друзями. Він не здивувався б, якби дехто з цієї жалюгідної компанії прийшов на вишкіл напідпитку - організація тут була досить кепська, щоб це здавалося цілком можливим.\n\nВін іще раз поглянув на хаос у полі, обернувся на підборах і пішов усередину. Ні, це було недобре. Зовсім недобре. Та їхню долю мала вирішити Рада. І хто міг передбачити, як вона вчинить?"
 ORE.19.a: "Це ганьба! Накажіть їм прийняти інструкторів!"
 ORE.19.b: "І що ми взагалі можемо зробити?"

 ORE.20.t: "Малєнков вступив на посаду голови!"
 ORE.20.d: "Новини з Орєнбурґа нерідко доходять навіть до найближчих сіл із запізненням, бо комуни зазвичай мало цікавляться внутрішньою політикою головного міста. Та цього разу звістка про останню зміну керівництва блискавично поширилася кожним селом, наче грім серед ясного неба. Амбітного й безкомпромісного політика Ґєорґія Малєнкова обрано головою Робітничої ради Орєнбурґа.\n\nКолишня висхідна зірка нині розпущеної Всесоюзної комуністичної партії, чия урядова кар'єра раптово обірвалася після німецького вторгнення, Ґєорґій Максіміліяновіч швидко пристосувався до політики рідного міста й згуртував навколо себе всі міські верстви, глибоко невдоволені нескінченним політичним безладом Орєнбурґа та неспроможністю Ради належно реагувати на найнагальніші проблеми. Апелюючи до старих совєцьких принципів демократичного централізму й політичної консолідації, Малєнков оголосив близький кінець недієздатної псевдоанархічної системи, яка прирекла Орєнбурґ на нерішучість і застій. У вступній промові товариш Малєнков пообіцяв якнайшвидше піднести Орєнбурґ до рівня розвинених країн і розпочати програму стрімкої індустріялізації, не вдаючись у подробиці того, як саме буде досягнуто обіцяного процвітання.\n\nСказати, що обрання Малєнкова виявилося вкрай суперечливим, було б величезним применшенням. Багато людей підтримали новообраного голову, сподіваючись, що комуністичний сильний лідер покладе край усепроникній анархії та нескінченним чварам, але ще більше людей, особливо селян, небезпідставно бояться, що правління Малєнкова означатиме занепад їхньої автономії й поставить їхній добробут у залежність від примх головного міста. Хай що думають про нового голову, немає сумніву: Орєнбурґ під керівництвом Малєнкова чекає велике перетворення - на краще чи на гірше."
 ORE.20.a: "Співгромадяни Орєнбурґа, більше ніхто ніколи не посміє вас скривдити!"

 ORE.21.t: "Бандит і науковець"
 ORE.21.d: "На жаль, схоже, не лише ми шукали союзників. Наші розвідники повернулися й доповіли, що таємничий Лисенко та підлий Дірлеванґер регулярно зустрічаються. Наразі ми не знаємо, про що йшлося на цих зустрічах, але цілком слушно припустити: якщо до справи причетні вони, це ніяк не може бути доброю новиною для нас. Треба почати готувати низку планів на будь-який задум цієї двійці; не знаю, як ви, а я радше помру, ніж стану піддослідним Лисенка чи мішком м'яса для німців."
 ORE.21.a: "Кажу вам, ці гори прокляті."

 ORE.22.t: "Заспокоєння комун"
 ORE.22.d: "Окраїнні комуни, схоже, охопила чергова хвиля істерії - цього разу через останню пропозицію збільшити набір до Орєнбурзького ополчення. Багатьох в Орєнбурзі вже довела до відчаю відверта ворожість околиць: спробуй виявити бодай натяк на центральну координацію задля спільного добра комун - і всі заприсягнуться, що ти друге пришестя царя й хочеш насцяти на Марксову могилу. І цього разу, здається, результатом стала ще більша, ніж звичайно, хвиля розлючених листів і скажених послів. Завжди кумедно дивитися, скільки синонімів до слова «фашист» вони здатні втиснути в одне речення.\n\nУтім, вплив цього на моральний дух усіх комун не можна недооцінювати, а такому залякуванню не можна дозволяти безкарно ширитися.\n\nБурба й Малєнков узяли на себе завдання якнайбільше стримати шкоду: вони зустрічаються з якомога більшою кількістю послів комун, без кінця вихваляють свободу їхніх установ і присягаються, що ніколи не зазіхатимуть несправедливо на основоположні права пролєтаріяту. Вони не мали наміру нікому наступати на мозолі, але чудово розуміють, чому пропозиція могла так здатися, і в майбутньому докладуть усіх зусиль, щоб така контрреволюційна думка більше ніколи не ганьбила народні зали засідань.\n\nНа щастя, їхні зусилля, схоже, дали результат: останніми днями кількість протестів різко впала, а Бурбу вже цілий тиждень не порівнювали з Гітлером. Оце так поступ."
 ORE.22.a: "Правдиве свідчення сили підлабузництва."

 ORE.23.t: "Визначення наших засадничих проблем"
 ORE.23.d: "Простий комунний спосіб життя пасує багатьом селянам і робітникам, які радо скинули спершу кайдани самодержавного царського життя, а згодом і ті, що наклали на них корумповані соціялісти. Їхнім життєвим гаслом було: "Живи плодами власної праці, турбуйся лише про їжу й питво на столі своєї родини". Та ця новоздобута свобода породила власну низку катастрофічних проблем. Абсолютно вільних громадян неможливо ні до чого примусити; їх не змусиш відкласти розбіжності й пожертвувати чимось, що може безпосередньо не впливати на їхнє життя.\n\nНайяскравішим прикладом того, як це ставлення перетворилося на проблему, стало фіяско з комунним збором - простим податком для латання найгірших проблем комун, зокрема нездатности зібрати дієву оборону проти зовнішніх набігів. Обидві великі фракції, що змагаються за передання своєму лідерові централізованого контролю над політичною інфраструктурою Орєнбурґа, пообіцяли покласти край паралічу, спричиненому збереженням ухвалення рішень на вкрай місцевому рівні. Їхні прихильники розпочали завзяті кампанії не лише на користь власної справи проти суперника, а й для очорнення автономістських аргументів проти обох. Відраза, так виразно помітна у вуличному насильстві й публічних дебатах між людьми Бурби та Малєнкова, не зрівнялася б із гострим страхом і ненавистю до автономістів. Якби нині маргінальні, але досі надзвичайно впливові антицентралізаційні фракції здобули владу, комуни могли б довго не прожити. Одному з їхніх агресивних сусідів достатньо буде розділити й підкорити різні міста та поселення, які без керівництва згори не зможуть ефективно оборонити свої землі. За межами цього маленького раю, вирізаного в Південному Уралі, діють лихі й могутні сили.\n\nВони й оком не моргнуть, розчавлюючи чобітьми анархістську спадщину Орєнбурґа."
 ORE.23.a: "Просто дайте нам організуватися, чорт забирай!"

 ORE.24.t: "План Бурби"
 ORE.24.d: "Після відверто ганебних одкровень про скрутне становище віддалених поселень, що пролунали на недавньому засіданні Робітничої ради, призначили нове засідання, щоб бодай розглянути стратегії подолання цієї доволі неприємної проблеми. Дехто заговорив про соціялістичну централізацію, мовляв, якщо існуватиме управління, яке правильно розподілятиме робітників і селян на їхні місця, свобода не постраждає. Чоловіки й жінки комун і далі зможуть жити плодами своєї праці. У залі виразно відчувалися хихотіння, закочування очей і загальна незгода. Здавалося, голосування навіть не потрібне. Далі підвівся Бурба - чоловік, який перетворив Орєнбурґ на осередок торгівлі й індустріялізації. Його плани допомогти демократично організувати комуни в адміністративні групи здаються значно правдоподібнішими. Та вирішувати доведеться Раді."
 ORE.24.a: "Нам потрібне розв'язання."

 ORE.25.t: "Порядок денний п'ятдесят восьмого конґресу"
 ORE.25.d: "Промова за промовою, угода за угодою, гіркий компроміс за гірким компромісом - 58-й конґрес Робітничої ради нарешті набуває форми. Як кажуть у місті, важко змусити двох орєнбуржців погодитися щодо ціни хліба, тож у Раді нікого не дивує, що чвари на найвищому рівні влади загальмували обговорення важливих сфер, які потребують реформ. Фракційність і засадничі розбіжності в Раді досі загрожують знешкодити черговий у довгій низці провальних конґресів і породжують сумніви в його здатності розв'язувати першочергові питання, як-от економічний розвиток і оборона. Попри це, радники ночами схиляються над столами й укладають плани, молячись, щоб саме їхній, на відміну від решти, став законом - і щоб Комуну ще можна було врятувати.\n\nДивує, однак, одностайне переконання, що голову треба призначити якнайшвидше. Конґрес визнає: нездатність Ради діяти злагоджено - чи не найбільша з її проблем, а отже, обрання голови з-поміж її членів - нелегке завдання за умов політичного паралічу Орєнбурґа - стане головним пунктом порядку денного. Та якщо Рада рішуче зупиниться на комусь одному, Орєнбурґ і Комуни невдовзі вперше після падіння тиранічного Союзу можуть отримати сильне й ефективне керівництво... і воно, можливо, врятує їх від найбільшого ворога - самих себе.\n\nДелегати сперечаються й б'ються, каравани завантажуються вщерть, журналісти збирають компромат на опозицію з чуток і переказів, а радники востаннє як слід висипаються. Спокійних ночей попереду буде небагато. Конґрес наближається."
 ORE.25.a: "За успіх Ради!"

 ORE.26.t: "Конґрес починається"
 ORE.26.d: "Під ввічливі оплески конґрес відкриває роботу. Делегати розгортають записники, збираються групами й парами, розділені на три фракції. Починаються довгі й обтяжливі промови, а досвідчені делегати потроху вислизають у затишні місця попліткувати. І позмовлятися.\n\nНайважливіші питання цього року визначать життєздатність Комуни як політичного утворення: країна навряд чи розвиватиметься без успішної централізації та врядування, тож їх погоджено зробити головними темами дискусій і майбутнього голосування. Багато говорять про вибір кандидатів, «гідних мантії соціялізму» й «ідеологічно чистих», але всі знають справжніх претендентів. Бурба - реформатор і промисловець, який збирається врятувати Комуни так само, як урятував Орєнбурґ від краху. Малєнков - безкомпромісний догматик, який вважає, що старий Союз загинув через відступництво, й прагне залізної хватки задля збереження цього. А деякі радники переконані, що лише вони здатні керувати Комунами, а не якийсь вискочень-голова, в якого вся кров ударила в голову, а під ногами немає ґрунту.\n\nЦентралізація так само роз'єднує: вищість Орєнбурґа давно була небажаним гостем за весільним столом, а централізація загострить давні образи сільських комун на містян. Ніхто не може погодитися, як далеко має зайти план централізації, і, схоже, Бурба та Малєнков також розходяться в цьому питанні. Через це дискусія гальмує й грузне: визначення змінюються з кожною промовою, а союзи й ворожнеча - з кожним промовцем. Поки Рада кипить у суперечках, ясно одне: шлях до рішучого керівництва довший, ніж очікувалося."
 ORE.26.a: "Ой лишенько."

 ORE.27.t: "Суперечка про голову"
 ORE.27.d: ""Як кожен добрий соціяліст Орєнбурзької комуни, я зневажав ієрархію в усіх її формах; вона небезпечна не своєю владою, а невидимими страхами, які породжує. Я попереджаю Раду й особливо всіх, хто сьогодні тут зібрався: обрання голови, найвище здійснення нашої свободи як радників, може також стати останнім.\n\nМи знаємо, друзі, що жорстокий і страшний Союз був лжепророком: він проповідував Маркса, але відкидав його слово щоразу, коли режимові було зручно. Ми заснували Комуни з надією стерти цю історію й почати спочатку без ран, завданих тими, хто називав себе соціялістами, але за природою був хижаком. Та рушійні потреби голови, необхідність згоди й порядку, виведуть нас на темну й гірку дорогу тоталітаризму - і все це з найкращими намірами.\n\nТож я благаю цю Раду: перш ніж голосувати, погляньте назовні на свободу, яку маємо! Невже злиденність душі справді варта матеріяльного поступу? Чи можна обміняти свободу на золото, друзі? І чи захотіли б ви цього, навіть якби могли?""
 ORE.27.a: "Палко, але нереалістично."

 ORE.28.t: "Компроміс щодо повноважень"
 ORE.28.d: ""Пані та панове, ми дійшли до тієї миті в дискусії, коли зрозуміло, кому віддана Рада в питанні її майбутнього голови. Дехто присвячує себе крайнощам особистої свободи, де жодній ієрархії чи деспотизмові не можна дозволити загрожувати автономії, яку так цінують Комуни. Інші присвячують себе крайнощам безпеки комун, де багато хто віддає себе служінню та захисту всіх. Решта з нас сидить в очереті: подобається і те, й інше, але не приймаємо нічого - наче селянин, що вибирає між двома призовими свинями. (Сміх.)\n\nТому я пропоную створити проєкт, який прокладе шлях між цими крайнощами, працюючи не заради ідеології чи цинічного самозвеличення, а з любови до спільного добра й бажання захистити дім, який ми любимо. Голова отримає потрібні повноваження для подолання тупиків у внутрішніх справах і надзвичайні повноваження, щоб спільне добро спрямовувала тверда й грізна рука. Рада стежитиме, щоб голова не виходив за межі, але водночас дозволятиме йому вести себе, коли того вимагають обставини.\n\nОсь так виглядає шлях уперед, друзі. Ось розв'язання, яке працює. Мудрість - Раді, влада - голові... а найголовніше - свобода Уралові!""
 ORE.28.a: "Досконала рівновага, як і має бути..."

 ORE.29.t: "Рада голосує"
 ORE.29.d: "Поки Рада насилу просуває засідання, нарешті постає головне питання дня. Кліки гуртуються навколо кандидатів і штовхаються за владу в залі дебатів. Наближається час, коли Рада вирішить свою долю.\n\nБурбу, реформатора й промисловця, та Малєнкова, соціяліста-догматика, часом висміювали, але нині це два найсильніші незалежні кандидати, і обидва їхні шляхи поведуть Комуни до єдности та сили. Багато хто також зауважує, що Малєнков має звичку поривати з колишніми союзниками й є озлобленим безкомпромісним догматиком. Інші кажуть протилежне: Бурба надто гнучкий і готовий домовлятися з будь-ким, навіть із колишніми ворогами. Та якщо орєнбуржець любить щось більше за суперечки, то це стояти на своєму, а Малєнков так міцно стоїть на своєму, що рушниці доводиться віддирати від його сідниць. Принаймні так звучить жарт.\n\nЗвісно, багато хто вважає, що нинішній статус-кво нікому не зашкодив і що Орєнбурґ заслуговує на мир та стабільність, а не на велику невідомість будь-якого можливого голови. Комуни, безперечно, вже є розсвареним безладом, але все працює як задумано, а кожен, хто каже інакше, - ворог Революції! Для таких людей сформувалася фракція, що вимагає повної автономії Ради, й її слова виявилися напрочуд привабливими.\n\nСкриньки відкрито, голосування починається. Орєнбурґ і Комуни затамували подих, чекаючи, поки майбутнє вмоститься над їхніми головами."
 ORE.29.a: "Тепер нам лишається тільки чекати."

 ORE.30.t: "Контрпропозиція"
 ORE.30.d: "Потреба в голові до цього часу вже не викликає сумнівів, але рішуче відповісти, хто ним стане, виявилося неможливо. Кожен кандидат мав прибічників, і ніхто не хотів поступатися суперникам. Розв'язання знайшли в пропозиції запровадити ротацію голови, щоб усі кандидати дістали нагоду діяти. Хоча цей компроміс нікого цілковито не задовольняє, він, схоже, прижився, і посада голови більше не буде надійним місцем."
 ORE.30.a: "Добрий компроміс..."

 ORE.31.t: "Убезпечення окраїнних комун"
 ORE.31.d: "Радник стоїть за трибуною без жодного аркуша в руках. Обставини не потребують завчених слів. Він вдихнув, знаючи, що це може коштувати йому місця. Але воно того варте. Хочеться вірити.\n\n"Люди цієї Ради. Я прийшов до вас із проблемою. Схоже, окраїнні комуни Орєнбурґа оголосили про вихід. Тож я сподіваюся, що ви згуртуєтеся й погодитеся зі мною: ми мусимо діяти! Я пропоную відправити солдатів до районів, які оголосили про відокремлення. Ми допоможемо їм заспокоїтися, допоможемо зрозуміти, що разом ми сильніші. Що, попри гнів на Раду, вони не можуть просто втекти й ризикувати, що їх переб'ють тирани з Бригади, викраде той чоловік із Гори або, можливо, заберуть мілітаристи з Уральської Ліги.\n\nБудь ласка, я благаю вас. Це прекрасне суспільство, цю живу істоту, яку ми створили, не можна пустити намарно! Ми мусимо відправити цих солдатів, солдатів, відданих нашому ладові. Я запевняю вас, усіх вас, людей цієї Ради: ми переможемо!""
 ORE.31.a: "Можливо, нам варто..."

 ORE.32.t: "Майбутнє Орєнбурґа"
 ORE.32.d: "Поки влада Малєнкова над Орєнбурґом міцнішає, він робить потрібні кроки, щоб пом'якшити критику. Сьогодні перед будівлею Орєнбурзької ради Малєнков проголосив плани «Нового Орєнбурґа».\n\nУ зверненні до натовпу він сказав:\n\n"Сьогодні новий день. Ми відкинули те, у що вірили вчора, й почали робити кроки назустріч завтра".\n\nДалі Малєнков заявив: хоч Орєнбурґ у скрутному становищі, з його майстерними планами нема чого боятися. У промові він торкнувся багатьох питань, повторивши свої уславлені плани централізації промисловости, війська й самого Орєнбурґа.\n\nПромову, безперечно, прийняли чудово: натовп навколо ревів, вимагаючи ще слів улюбленого лідера, поки той ішов до Ради на черговий день тяжкої праці."
 ORE.32.a: "Він говорив упевнено, тож чого боятися?"
 
 ORE.33.t: "Створення Комісаріяту важкої промисловости"
 ORE.33.d: "Разом із попитом мусить зростати й пропозиція. Це основа всіх економічних теорій. Наші комуни розробили плани нових великих виробничих підприємств, які випускатимуть усе - від бляшанок і начиння до велосипедів і лопат. Ці славетні нові заводи принесуть нашим комунам добробут і нове зростання, не кажучи вже про краще постачання війська завдяки доступній новій зброї місцевого виробництва, надійним новим боєприпасам і запасним частинам."
 ORE.33.a: "Оберта́йтеся, колеса поступу."

 ORE.34.t: "Трактори для селян"
 ORE.34.d: "Заводи раз у раз доводили свою цінність, а разом із ними - і заводські робітники. Як їхні батьки, матері, бабусі й дідусі, вони доводять, що є хребтом нашого суспільства. Тому їм треба надати перевагу перед селянами, чия праця, хоч і важлива, не настільки визначальна для нашого майбутнього. Завдяки цьому селяни й фермери потягнуться на заводи в пошуках кращого життя з новими вигодами. З припливом нових робітників самі заводи зростуть у продуктивності, розмірах та ефективності."
 ORE.34.a: "Шестерня сама не обертається."

 ORE.35.t: "Республіка робітників"
 ORE.35.d: "Заводи раз у раз доводили свою цінність, а разом із ними - і заводські робітники. Як їхні батьки, матері, бабусі й дідусі, вони доводять, що є хребтом нашого суспільства. Тому їм треба надати перевагу перед селянами, чия праця, хоч і важлива, не настільки визначальна для нашого майбутнього. Завдяки цьому селяни й фермери потягнуться на заводи в пошуках кращого життя з новими вигодами. З припливом нових робітників самі заводи зростуть у продуктивності, розмірах та ефективності."
 ORE.35.a: "Шестерня сама не обертається."

 ORE.36.t: "Розгортання комісарських підрозділів"
 ORE.36.d: "Нова система комісарів викликає серед солдатів цікаві реакції. Можливо, це лише страх або брак довіри, але коли хтось стежить за кожним твоїм словом, це напевно незручно для солдатів, які раніше могли казати все, що думали. Ці недисципліновані звички не можуть тривати, саме тому й існують комісари. Вірність комунам украй важлива, а інакодумство, серед іншого, лише шкодить життю наших людей. Інакодумство веде до роз'єднання, а роз'єднання - до смерти. Ми вже пережили це двадцять із гаком років тому. Хай там як, їм просто доведеться звикнути або зазнати покарання."
 ORE.36.a: "Як скажете."

 ORE.37.t: "Вірний офіцерський корпус"
 ORE.37.d: "Армія, як і все в Орєнбурзі, процвітала й зростала під проводом Малєнкова. Та це палиця на два кінці: ті самі люди, що нині б'ються за захист народу, одного дня можуть обернутися проти нього. Хіба старий Совєцький Союз не знищили зрадливі генерали, які покинули його в мить слабкости? Навіть не всі самі озброєні люди скорилися новій владі. Довіра, вірність і братерство - чи справді його генерали вірні, а чи тримають у руках кинджали? Певности не буде ніколи."
 ORE.37.a: "Смерть або брехня, мертвим чи живим."

 ORE.38.t: "Оборонці народу"
 ORE.38.d: "Народ волав, щоб хтось, будь-хто, урятував його від тиранів і фашистів. У найтемнішу годину, коли бомби вбивали, а бандити ґвалтували, народ кликав.\n\nІ Герої Народу відповіли на його заклик! Перед лицем великої небезпеки ці хоробрі чоловіки й жінки кинулися на захист співгромадян і власними тілами прийняли удари ворога. Вони витримали холод, свинець і сталь, і саме завдяки цим героям ви тепер живете вільно й щасливо!"
 ORE.38.a: "Ти! Уже записався добровольцем?"

 ORE.39.t: "Сила, що зростає"
 ORE.39.d: "Малєнков дивився на Орєнбурґ, який так довго був укритий вирвами й лишався примітивним. Він пам'ятав, яким його застав: слабким, бідним, боягузливим і розділеним; економічний потенціял великого міста однаково розтринькали німецькі бомби й інституційна анархія.\n\nСьогодні це змінилося. Перед його очима й за його наказами над містом виростали фабричні димарі, а мешканців зганяли в тісні й задушливі робітні, щоб вони виробляли в рази більше, ніж будь-коли. Робітничій клясі нав'язали нові норми й стандарти, і Малєнков був певен, що поза слухом комісарів не один скаржився на довгу й небезпечну працю, яку на нього звали. Та вони з приголомшливою швидкістю будували Орєнбурґ завтрашнього дня, і задля цього ніхто не міг дозволити собі вийти з виробничої лінії."
 ORE.39.a: "Сьогодні всі ми мусимо пожертвувати заради завтра."

 ORE.40.t: "Судові настанови для комун"
 ORE.40.d: "Судова система Орєнбурґа роками майже не існувала. Якщо обвинуваченого взагалі приводять до будівлі, де має вершитися правосуддя, він уже може вважати себе щасливцем. А там проти нього можуть використати й неодмінно використають навіть найпустішу чутку, сільські плітки та давні провини, не пов'язані зі справою. Без захисту й процедури суд швидко перетворюється на змагання в популярності, де обвинувачений і обвинувач сиплють образами один на одного. Так не може тривати: комунам треба повернути справжнє, впорядковане правосуддя, щоб правдива свобода знову могла дихати."
 ORE.40.a: "Народ заслуговує не меншого."
 ORE.40.b: "Ми змінимо лише дещо."
 ORE.40.c: "Не варто марнувати час на таку дрібницю."

 ORE.41.t: "Справедливий народний трибунал"
 ORE.41.d: "Анархічна судова система, покликана вершити революційне народне правосуддя над злочинцями й деспотами, сама стала найбільшим деспотом Орєнбурґа й тероризує людей неточністю та непослідовністю. З огляду на це прикре становище Малєнков віддав нові накази про реорганізацію народних трибуналів. Призначені державою фахівці забезпечуватимуть дисципліну й належний порядок у трибуналах, щоб правосуддя стало стандартизованим і гідним. Відтепер перед ухваленням будь-якого рішення трибунал мусить радитися з тими, кого надіслали за ним наглядати."
 ORE.41.a: "Від правосуддя більше не втекти."
 ORE.41.b: "Нам і так бракує людей, шкода."

 ORE.42.t: "Несправедливий тягар Орєнбурґа"
 ORE.42.d: "Нині Орєнбурзька комуна відповідає за сміховинно велику частку внесків до спільноти комун, і її представникам нарешті вдалося привернути до цього увагу. Дехто скаже, що це ціна статусу головної комуни регіону, до якої стікаються політичні й культурні таланти. Та становище першого серед рівних мало допомагає розв'язати засадничу проблему: жителі Орєнбурґа раз у раз бачать, як тяжко зароблені статки пливуть до спільного фонду, й майже ніколи не отримують нічого натомість. Навіть у найкращі часи люди природно не люблять податків, а нерівність вигоди від фонду очевидна всім."
 ORE.42.a: "Рано чи пізно це мало статися."
 ORE.42.b: "Усміхнемося й витримаємо."

 ORE.43.t: "Спільний інвестиційний фонд"
 ORE.43.d: "Найпростішим і найочевиднішим доказом співпраці між комунами є заснування спільного фонду, до якого робитимуть внески всі й який використовуватиметься для розвитку та підтримки комун як єдиного цілого. Вкладаються всі, й користь мають усі, поки навколо Орєнбурґа постає спільнота. Замість параноїдальних і самотніх хуторів, наляканих боротьбою за власне виживання, ми збираємо врожай як одне ціле."
 ORE.43.a: "Один за всіх і всі за одного!"
 ORE.43.b: "Може, лише трохи."
 ORE.43.c: "Зараз у нас порожньо, більше надіслати не можемо."

 ORE.44.t: "Рівне представництво комун"
 ORE.44.d: "Хоча комуни в принципі погодилися з ідеєю співпраці, глибоко вкорінений страх деспотизму досі сильний. Кожна комуна й усі її люди готові боронити автономію, якщо відчують, що держава не чує їхнього голосу. Зважаючи на це, ми почали створювати прийнятне розв'язання для представництва комун: воно змусить навіть найбільших і наймогутніших дослухатися до малих і слабких, але водночас не дозволить тупому обструкціонізмові потягнути на дно всіх нас. Кожна комуна дістає право на рівне представництво в Орєнбурзі й обов'язок відповідально користуватися наданою владою."
 ORE.44.a: "Ми почуємо кожен голос, хоч би який тихий."
 ORE.44.b: "Ми почуємо лише найгучніші скарги."
 ORE.44.c: "Ми чинитимемо так, як потрібно."

 ORE.45.t: "Пропозиція сталого розкладу"
 ORE.45.d: "Під час минулого конґресу представники кілька разів запізнювалися, а декому довелося в останню мить шукати заміну. Очевидно, причиною цих проблем був брак довгострокового планування таких заходів. Ми змінимо їхню підготовку, приділяючи особливу увагу датам. Треба визначати конкретні дати далеко наперед, щоб представники могли подбати, аби особисте й комунне життя та розклади не завадили їхньому прибуттю на конґрес. Ми створимо невелику групу, яка знайде постійну дату проведення конґресу. Так ми зможемо уникнути нових ганебних непорозумінь."
 ORE.45.a: "Пунктуальність і співпраця - ключі до поступу."
 ORE.45.b: "Може, пізніше."

 ORE.46.t: "Кодифіковані повноваження Ради"
 ORE.46.d: "Влада: хто її має і як використовує. Ходіння околяса нікому не допоможе, й Рада безперечно мусить мати в руках певну владу, щоб не стати черговим дискусійним товариством. Та відповісти, якими саме мають бути ці повноваження, нелегко. Єдина армія під цивільним командуванням? Право будувати дороги й планувати оборону? Право скасовувати рішення місцевих рад або друкувати власну газету? Це центральне питання, і саме тепер комуни мусять зіткнутися з тим, чого так довго сподівалися уникнути: двобоєм прагматизму й ідеалізму. Адже свободу легко втратити й дуже важко повернути."
 ORE.46.a: "Невелике розширення ще нікому не шкодило."
 ORE.46.b: "Нас цілком улаштовує нинішній стан."
 ORE.46.c: "Ми поступимося частиною влади."

 ORE.47.t: "Конституція для робітника"
 ORE.47.d: "Поки Орєнбурґ зберігає статус нечітко окресленої соціялістичної протодержави, Малєнков усіляко намагається протиснути змістовні реформи, які справді вплинуть на стан країни. Під час обговорення можливих популярних ідей, які Рада, ймовірно, підтримає, порушили питання про створення конституції. Хоча вона мало що справді змінить у країні, конституція символічно об'єднає численні комуни й села одним документом і спільним набором ідеалів. Крім того, вона гарантуватиме права й захист робітників як в Орєнбурзі, так і в зовнішніх поселеннях. Уперше народ Орєнбурґа об'єднається під одним документом і однією долею."
 ORE.47.a: "Схвалено!"
 ORE.47.b: "Ми приймемо окремі положення."
 ORE.47.c: "Відхилено."

 ORE.48.t: "Розвиток сільських районів"
 ORE.48.d: "Селянські комуни Орєнбурґа перебувають у відчайдушному становищі. Щодня тисячі бідних селян прокидаються вдосвіта й працюють, а відпочивають лише глибокої ночі. Потім їм треба везти мізерні харчі за десятки миль до найближчої ознаки цивілізації, де їх можна переробити й продати. Гірше того, схоже, це нужденне становище нескоро скінчиться: через відносний політичний параліч у місті та брак будь-яких змін у самих поселеннях селяни й далі змарновуватимуть години життя в тяжкій праці та стражданні. Дух середньовіччя, що мучить ці стародавні землі, нікуди не зникне. Це наше прокляття.\n\nТому, щоб вижити в ці часи, ніхто не має права сидіти без діла. Ніхто не байдикуватиме, поки наші чоловіки й жінки гинуть у полях. Усі ми зробимо свій внесок у виживання комун. Тоді й лише тоді ми скинемо кайдани та прокляття, що нас зв'язує. Тоді й лише тоді робітники переможуть!"
 ORE.48.a: "Геть кайдани!"
 ORE.48.b: "Потрібне певне спрямування."
 ORE.48.c: "Поки це надто радикально."

 ORE.49.t: "Справжнє правосуддя"
 ORE.49.d: "Старі звичаї жалять Орєнбурґ із небаченою деінде люттю.\n\nЦі старі традиції проявляються по-різному. У селянстві, досі приреченому на свою тисячолітню долю; у вільнодумцях, яких палять на вогнищах за сміливість казати, що думають; у забобонах проти всіх чужинців; в олігархії багатих і могутніх.\n\nТа найогидніша пляма жорстокого середньовіччя Орєнбурґа - самосуд. Щонайменше раз на тиждень натовп убиває людину. Причини різняться: може, біженця звинуватили в нападі на місцеву жінку або хтось зізнався в ненависті до соціялізму. Та смерть завжди однакова. Їх катують, а тоді вішають за гріх, який вони нібито вчинили. Деякі села навіть особливо сумнозвісні за плекання психології натовпу. Зрештою, хто здатен керувати натовпом наче худобою, той керує всім суспільством.\n\nОрєнбурґ - не князівство князів і королів. Це земля свободи й індивідуалізму. Суд натовпу ніколи не був правосуддям - це вбивство найогиднішого ґатунку. Вбивство не лише людини, а цілого набору ідеалів.\n\nУряд більше не дозволить самосудам тривати. Надто багато невинних загинуло від зашморгу, поки справжні злочинці лишалися на волі, не відчувши удару молотка. Верховенство права мусить знову охопити край."
 ORE.49.a: "Що таке правосуддя перед лицем натовпу?"
 ORE.49.b: "Це навіть не така вже велика проблема."
 ORE.49.c: "Якщо трохи послабимо правила, турбуватися не доведеться."

 ORE.50.t: "П'ятдесят дев'ятий конґрес - мета й завдання"
 ORE.50.d: "Настав час вирішити майбутнє Орєнбурґа. Хоча Рада лишається при владі, хода поступу мусить тривати разом із плином часу. Наближається 59-й конґрес Робітничих комун Орєнбурґа.\n\nНайнагальніше питання - централізація. Більшість Ради, хоч і затято опирається цій ідеї, усвідомлює її необхідність. Ніхто не може байдуже дивитися, як сам уряд Орєнбурґа руйнується на недієздатному й гнилому фундаменті.\n\nКонґрес також зосередиться на суспільних і судових реформах: деякі поселення вирішили скасувати громадянські свободи, які підтримує решта Ради. Цим селам більше не дозволять топтати наші спільні цінності. Крім того, треба приборкати недавню хвилю самосудів, що охопила комуни. Неупереджені судді запровадять верховенство права замість психології натовпу."
 ORE.50.a: "Ми стабілізуємо нинішню систему."
 ORE.50.b: "Усе залишиться по-старому."
 ORE.50.c: "Ми захистимо свободу особи."

 ORE.51.t: "П'ятдесят дев'ятий конґрес - добровільне об'єднання"
 ORE.51.d: "Комуни Орєнбурґа не можна й не будуть утримувати в союзі страхом. Наша сила - у великій свободі та впевненості комун у собі. Ми не мілітаристи й не фашисти, що мучать наш світ. Ми насмілилися бути іншими й утворили союз не силою, а спільною згодою та співпрацею. Ми боїмося одне одного не більше, ніж людина боїться рідного брата, бо ми - родина. Кожен може вирішити піти й самотужки кинути виклик світові, але натомість усі без примусу обрали об'єднання заради спільного добра й свободи кожного. Продовжуймо співпрацювати з любов'ю, однаково цінуючи одне одного - і саме тому цінуючи ще більше."
 ORE.51.a: "Будь ласка, повернімося до теми."
 ORE.51.b: "Гадаю, я чув і гірші промови."

 ORE.52.t: "П'ятдесят дев'ятий конґрес - промова Малєнкова"
 ORE.52.d: "Радники комун. Я говоритиму про справу, дорогу моєму серцю. Про виживання нашої колективної ідентичности. Орєнбурґ - нація знедолених. Нація тих, хто пережив незліченні жахи. Російську зиму. Спеку літнього сонця. Фашистське вторгнення. Та попри все це ми вистояли. І все ж стоїмо на межі краху. Не через зовнішні загрози, а через самих себе. Егоїзм і жадібність змушують кожну комуну приховувати ресурси, якими задля спільного добра слід ділитися з усіма. Це наслідок децентралізації, що нас мучить. Децентралізація не веде ані до особистого добра, ані до успіху комунізму. Вона веде лише до розчарування та страждання.\n\nЛише централізувавши державу під владою єдиного сильного соціялістичного уряду, ми принесемо комунам мир, свободу й стабільність. Централізація не бреше, як егоїстична децентралізація. Вона виховує працьовиту людину. Нагороджує слуг народної держави. Це найправдивіший шлях свободи й найправдивіший шлях для Орєнбурґа. Тож я закликаю вас, товариші радники, приєднатися до мене на цьому шляху вперед. Шляху до централізації."
 ORE.52.a: "Це могло б піти нам на користь."
 ORE.52.b: "Дякуємо за пропозицію."

 ORE.53.t: "П'ятдесят дев'ятий конґрес - мить вирішення"
 ORE.53.d: "Конґрес засідає вже кілька днів, і за цей час обговорив чимало істотних питань. На стіл виклали все: від внутрішніх і зовнішніх загроз комунам та впливу Гвардії на Орєнбурґ до самої особистости Малєнкова. Торкнулися, якщо не розкритикували, практично кожного боку орєнбурзького суспільства, і розв'язка швидко наближається. Тепер лишилося тільки дочекатися голосування за запропоновані Малєнковим заходи централізації. Хай яким буде результат, усіх вражає те, що невдовзі Орєнбурґ дістанеться роздоріжжя, з якого не буде вороття, і тягар цієї миті важко висить над залою."
 ORE.53.a: "Ніч, яку не забудуть."

 ORE.54.t: "П'ятдесят дев'ятий конґрес - вердикт"
 ORE.54.d: "Сьогодні визначний день у короткій історії Орєнбурґа. Глибоко децентралізована економічна система наших комун була наріжним каменем суспільства від самого початку й досі є джерелом великої гордости. Та непідконтрольні нам події можуть змусити поступитися цією дорогоцінною цінністю. Зовнішні загрози невпинно зростають, і чисту перевагу централізованої економіки в продуктивності більше не можна ігнорувати. Як проголосують комуни?"
 ORE.54.a: "Незабаром дізнаємося."

 ORE.55.t: "П'ятдесят дев'ятий конґрес - тріюмф!"
 ORE.55.d: "Голоси підраховано, і комуни погодилися централізувати нашу економіку. Зміни у виробництві почнуться негайно."
 ORE.55.a: "Прийнято до відома."

 ORE.56.t: "П'ятдесят дев'ятий конґрес - комуни чинять опір!"
 ORE.56.d: "Голоси підраховано, і комуни відкинули всі спроби централізувати економіку. Методи виробництва й планування лишаться незмінними."
 ORE.56.a: "Прикро."

 ORE.57.t: "Орєнбурґ просить інструкторів"
 ORE.57.d: "Схоже, наші сусіди визнали нашу незрівнянно вищу військову майстерність і тепер благають допомогти перетворити їхні збройні сили на могутній і грізний засіб оборони.\n\nУдосвіта Міністерство закордонних справ отримало телеграму від нашого південно-західного сусіда Орєнбурґа, темою якої, схоже, було прохання про «допомогу». Уряд Орєнбурґа просить «інструкторів» із наших збройних сил в обмін на велику суму грошей. Певно, селяни регіону забули, як користуватися рушницями! Трохи вишколу це виправить, і військо запевняє, що виконає завдання.\n\nТа чи справді допомога Орєнбурґу відповідає нашим інтересам? Сприяючи розвитку його збройних сил, ми можемо зміцнити цю «націю», а це зрештою обернеться проти нас і послабить нас самих. Комуни ніколи не вважали нас союзниками, хоч би як усміхалися, користуючись нашими послугами. Утім, вони пропонують значну суму, а гроші кричать там, де слова шепочуть.\n\nУряд має зробити вибір. Допомагати чи ні? Комуни затамували подих в очікуванні відповіді."
 ORE.57.a: "Так, надішліть інструкторів."
 ORE.57.b: "Ні, нікого посилати не слід."

 ORE.58.t: "Ліга схвалює наше прохання"
 ORE.58.d: "За щасливим збігом обставин Уральська Ліга охоче погодилася надати військову допомогу нашим ополченням. Добірна група бойових інструкторів, загартованих у безперервних битвах Західної та Південної Росії або навіть навчених у совєцьких школах, найближчим часом прибуде до Орєнбурґа й організує навчальні курси для наших загонів ополчення. Вони допоможуть подолати брак підготовки й приготуватися до майбутніх битв із силами Дірлеванґера та Лисенка.\n\nЩедрі зусилля Уральської Ліги, спрямовані на допомогу нашому краю, високо цінують робітники й селяни Орєнбурґа. Кроки Ліги свідчать не лише про поліпшення наших відносин із нею."
 ORE.58.a: "Ми добре використаємо їхні таланти."

 ORE.59.t: "Ліга відхиляє наше прохання"
 ORE.59.d: "Із сходу надійшли прикрі новини. Наші посланці до Уральської Ліги, яким доручили попросити її керівників про військову допомогу й посилення співпраці між нашими державами, повернулися з порожніми руками. Посилаючись на брак людей, яких можна було б виділити нашим силам, Уральська Ліга відхилила прохання надіслати військових фахівців для бойової підготовки нашого недовишколеного ополчення.\n\nЦя обурлива відмова налаштувала багатьох представників Ради проти Ліги. Чимало з них ставлять під сумнів лицемірство тих, хто обмежує наші свободи заради «безпеки», але й далі ставиться до нас як до дітей і навіть не намагається допомогти нам захистити себе. Хоча відмова Ліги ускладнить реорганізацію наших збройних сил, найвідчайдушніші представники Ради взагалі заперечують потребу великих військових змін і знаходять розраду в романтизації селянських партизанських воєн минулого. Зрештою, саме невишколені миролюбні селяни хоробро протистояли навалам поляків і Наполеона та вигнали їх із нашої Батьківщини багато століть тому, поки професійні солдати лише віддавали міста ворогові. Якщо дубина народної війни стільки разів рятувала Росію, чому ми не можемо довірити їй розтрощити потвор Дірлеванґера та Лисенка?"
 ORE.59.a: "Ми підемо своїм шляхом, не озираючись на Лігу."

 ORE.60.t: "Анархія в Орєнбурзі!"
 ORE.60.d: "Колись Орєнбурґом правила тонка подоба порядку. Тепер лишилася сама анархія. Селянські комуни - лише острови посеред безцивілізаційного простору. Рівень бандитизму зріс до небачених висот, а витончена економіка, яку ми підтримували раніше, перетворилася на середньовічний натуральний обмін. Хоча Робітнича рада ще трохи контролює Орєнбурґ, очевидно: наші найкращі дні, якщо їх узагалі можна так назвати, позаду.\n\nПросувані урядом реформи не привели до централізації та державности; вони спричинили дезорганізацію й кризу, бо місцеві сільські старости виступили проти переходу до централізованої економіки. Ми більше не можемо ані проєктувати силу, ані навіть захищати власні кордони. Анархія виявилася не обіцяним благословенням, але саме вона зійшла над нами."
 ORE.60.a: "Схоже, жадібність знищила єдність."

 ORE.70.t: "Бурба не відступає"
 ORE.70.d: "Штаб-квартира Орєнбурзької ради палає - не справжнім вогнем, а чутками, підступами й думками, що ховаються в тіні. Нині мало хто з делегатів повертається з комплексу до свого села чи міста щасливим, і їх важко винуватити. Рішення голови продовжити реорганізацію економіки, хай йому до біса та Рада, нелегко продати селам, уже розлюченим надмірною централізацією. Наступна хвиля провінційних виборів, імовірно, принесе ще більше хаосу, але до того часу...\n\nВидають записку й оголошують промову голови. Згодом спостерігачі назвуть її зустріччю «приходу до Ісуса», а лють, із якою зазвичай добродушний Бурба накидається на опонентів, своєю силою здається майже пророчою. Він недвозначно пояснює: головна мета Ради - здійснити те, чого не може окрема людина; у цьому сенсі обрання Бурби було, можливо, єдиним добрим рішенням Ради за всю її історію. Далі він громить супротивників, називає їх бандитами, реакціонерами, дурнями й ідіотами, а завершує наголосом: реформи триватимуть, хоч би що сталося. Кілька радників непритомніють від шоку. Решта гарчить і скиглить, але їх приборкано. Рада поступається, і незгода стихає.\n\nОрєнбурґ тремтить, але й далі неквапом простує до майбутнього, прихованого смогом, та осяйного в серці голови."
 ORE.70.a: "Добрі члени Ради виконують накази."

 ORE.71.t: "Нове Відродження"
 ORE.71.d: "Орєнбурґ - нове місто. Колись він був лише ще одним містом у російській, а згодом совєцькій державі, а тепер став перлиною всієї Євразії. На відміну від більшої частини світу, Орєнбурґ зручний, заможний і, найголовніше, безпечний. Ми - сяйне місто на пагорбі, маяк стабільности в розбитих пустках старого Совєцького Союзу. За час незалежности ми створили не лише унікальну систему врядування, а й унікальну культуру.\n\nНашими вулицями їздять автомобілі місцевого виробництва. Кожен будинок має чисту воду, електрику й телефонний зв'язок. Митці з гордістю виставляють роботи в галереях, а інтелектуали обговорюють філософію у вуличних кав'ярнях. Повідомляють навіть про заснування кіностудії, яка вже цього року почне писати сценарії та знімати фільми.\n\nУсе це завдяки змінам, які провів товариш Бурба, та його відданій команді вмілих фахівців. Без нього і його мудрого керівництва ми навряд чи коли-небудь досягли б такого культурного й економічного успіху. Ми дякуємо їм за доблесні зусилля й цінуємо подарований нам добробут.\n\nОрєнбурґ переживає Відродження, і ще ніколи нам не жилося краще."
 ORE.71.a: "Ми міцно стоїмо на власних ногах."

 ORE.72.t: "Військові реформи голови Бурби"
 ORE.72.d: "Керівник будь-якої держави мусить мати армію, щоб захищати свій народ від зовнішніх загроз. Ця мудра порада витримала випробування часом від самого народження писаної історії, і, як кожен реформатор, вартий згадки, голова Бурба добре знає, що не слід нехтувати її тисячолітніми уроками. Добра порада лишається доброю порадою, особливо після краху Союзу.\n\nНе секрет, що численні ополчення Орєнбурґа кепсько навчені й жахливо споряджені. Ба більше, самі ополченці не знають вищої вірности чи відповідальности за захист власного села, хутора або міста. Який опір селяни з реманентом у руках чинитимуть велетенській силі, що прагне захопити весь Орєнбурґ, а не лише їхні домівки? Щось треба змінити, перш ніж вони виявляться безпорадними; для голови зміни починаються з перековування старих, іржавих кайданів на нові мечі.\n\nОзираючись назад, перший крок здавався настільки простим, що лише зв'язаний по руках уряд не здійснив би його за першої нагоди. В Орєнбурзі не бракує ветеранів Великої Вітчизняної війни, досвідчених у війні, але позбавлених мети в мирний час. Щоб зібрати цих скалічених, п'яних ветеранів, розсіяних по Комунах, в одній покинутій будівлі міста Орєнбурґа, знадобилися час і зусилля. Вагання й розгубленість невдовзі поступилися неписаному братерству всіх солдатів, і з будівлі полилися сміх, оповідки та сороміцькі жарти, наче потоки розлитої горілки.\n\nКоли веселощі вщухли, вони почали обмінюватися скаргами й ідеями. Жалюгідний стан орєнбурзького «війська». Зброя не краща за мушкети царської доби. Спільні навчання між комунами. Прохання до голови про рушниці, офіцерів, однострої, знамена й дивізії. Крок за кроком новоохрещений «Комітет ветеранів», спираючись на десятиліття гордої служби Революції, почав планувати армію, яку можна буде назвати власною армією Орєнбурґа: дисципліновану, організовану й, найголовніше, готову битися як одне ціле заради комун.\n\nТак ветерани згодом покинули місто з новою зброєю й новішою метою, пообіцявши повернутися, коли як слід вимуштрують своїх хлопців. Держава не створить професійну армію за одну ніч... але завдяки хисту її веселих ветеранів і допомозі Уральської гвардії Орєнбурґ із часом іще може створити армію орєнбуржців."
 ORE.72.a: "Голова ніколи не здавався нам військовим командиром, але в його ідеях є сенс."

 ORE.73.t: "Нова програма вишколу"
 ORE.73.d: "Вишколом наших ополчень надто довго нехтували, тому ним кепсько керували, а результати були слабкими. Солдати часто не знали основ тактики, ближнього бою, першої допомоги й навіть не вміли влучно стріляти. Та завдяки Уральській програмі вишколу все зміниться. Ополченців навчатимуть і перенавчатимуть сучасного бою, щоб бандити Дірлеванґера більше ніколи нам не загрожували й жодна інша сила не могла встояти проти нашої могутности. Солдати більше не йтимуть у бій, не знаючи, як виживати й воювати. Фашисти більше не глузуватимуть із «нижчого» слов'янського ополченця з Уралу. Натомість вони боятимуться нашої сталі й плакатимуть, коли наша зброя пробиватиме їхні шикування. Орєнбурґ більше ніколи не боятиметься, доки його кордони захищають славетні солдати!"
 ORE.73.a: "Ми виживемо, хоч би що сталося!"

 ORE.74.t: "Програма стандартизації Бурби"
 ORE.74.d: "Одна з багатьох проблем децентралізованої системи ополчень - відсутність стандартизованої зброї. Зрозуміло, ополчення використовують усе, що знаходять, але через це нам бракує запасних частин і набоїв, а самі ми часто погано споряджені й поступаємося ворогові у вогневій силі. Бурба це усвідомив, і за його адміністрації стандартну зброю тепер вироблятимуть і застосовуватимуть масово. Стандартні рушниці, стандартні кулемети - стандартизація в усьому. Кожен солдат має отримати якісну вогнепальну зброю та спорядження, щоб твердо стояти проти орд, які нам загрожують."
 ORE.74.a: "Наші солдати більше не страждатимуть із нікчемними самопалами!"

 ORE.75.t: "Реформи ополчення тривають"
 ORE.75.d: "Ми вічно вдячні Уральській Лізі за допомогу в безперервних зусиллях об'єднати наші ополчення. До програми вишколу додано вкрай потрібні заняття з тактики малих підрозділів. Тепер солдатів навчатимуть прикривального вогню, використання гранат, похідних шикувань, мінометного й артилерійського вогню та загальних способів пристосування до різної зброї й тактики, які фашистські бандити застосовуватимуть проти нас. Тепер наші хоробрі товариші битимуться відважно й розумно. Побачимо, як це сподобається Дірлеванґеру!"
 ORE.75.a: "Нас ніщо не зупинить. Ми сильніші, ніж будь-коли."

 ORE.76.t: "Мистецтво оборони"
 ORE.76.d: "Бандити зазвичай неабияк псують добробут і щастя своєю прикрою звичкою перерозподіляти ресурси в найбільш неефективний спосіб. Нині відносний достаток Орєнбурґа привабив до регіону спраглу крови Бригаду Дірлеванґера. Слідом прийшли менші банди, які, без сумніву, сподіваються скористатися нашою неготовністю й забрати все, що встигнуть, перш ніж Чорний бандит нас прикінчить.\n\nДесь серед незліченних реформ і реорганізацій голови Бурби наш керівник дозволив створити мандрівну військову академію. Ця група чоловіків із Комітету ветеранів за допомоги кількох наших перших професійних солдатів подорожує комунами східного прикордоння й навчає фортифікації та облаштування оборонних позицій. Допомагаючи ополченням, ще не включеним до професійної армії, будувати продумані шанці, спостережні пости й зони ураження, ми посилюємо здатність місцевих відбивати напади мандрівних банд і, за потреби, знешкоджувати їх силою. Особливо важливі комуни вздовж наших шляхів постачання вчать споруджувати кілька смуг укріплень і шанців, щоб затримати будь-якого загарбника й завдати йому додаткових втрат, а в ідеалі - відбити будь-який напад.\n\nНаші новопризначені командири вважають, що така підготовка не дозволить багатьом бандитам під час звичайних грабіжницьких набігів сягнути внутрішніх районів Орєнбурґа. Коли настане час зустріти справжню армію вторгнення, захоплення кожної комуни в'язатиме ворога й дасть резервам час дістатися ослаблених ділянок фронту."
 ORE.76.a: "Якщо рушниця - найкращий друг солдата, то лопата - другий після неї."

 ORE.77.t: "Ополчення для Орєнбурґа"
 ORE.77.d: "Надто довго ополчення Орєнбурґа представляли лише місцеві комуни. Децентралізована природа нашого управління перетворила все на кошмар - і наш «уряд», і військо. Та за Бурби це зміниться. Ополчення мусять представляти й захищати весь Орєнбурґ, а не лише власні комуни. Їх треба об'єднати під центральним командуванням із добре вишколеними офіцерами й солдатами, готовими битися за народ. Без цього нас розгромлять бандитські сили. Ми виживемо лише в єдності."
 ORE.77.a: "За Орєнбурґ!"

 ORE.78.t: "Планова комісія"
 ORE.78.d: "Сьогодні вранці Бурба оголосив Робітничій раді Орєнбурґа, що заснує офіційну Комісію економічного планування на додачу до своїх обов'язків голови. Попри протести лібертарніших і популістських членів Ради, Бурба прийшов підготованим і мав напоготові відповідні статті, які дозволяли голові такі дії. Збентежена цим маневром Рада відступила й дозволила Бурбі зробити свій хід - і він його зробив.\n\nГолова заявив, що Комісія ще більше прискорить його програми розвитку, які вже демонструють значний поступ в обраних галузях. У його величному баченні Комісія організує індустріялізацію суспільства як грандіозний балет реквізицій, прямих наказів та економічних стимулів. Поки Металургійна рада наказуватиме виплавляти сплави, Логістична рада доправлятиме їх до місця призначення, а Рада зонування стежитиме, щоб їх застосували саме там, де потрібно.\n\nПерелік заступників керівника прямо повторює реєстр справжніх найкращих і найрозумніших людей Орєнбурґа, тож, схоже, Комісія працюватиме як у будь-якій мрії Бурби: ефективно, чисто й поза впливом тих, хто міг би завадити поступу."
 ORE.78.a: "Це добре нам послужить."

 ORE.79.t: "Про стан економіки"
 ORE.79.d: "Обраний очолити Ради завдяки обіцянці економічної реформи, Алєксандр Бурба разом зі своїм гуртом технократичних радників подав великій раді пропозицію: передати всі питання централізованого економічного планування голові Ради. Спочатку багато радників поставилися обережно: надання прямої, незаперечної влади кліці технократів не узгоджувалося з децентралізованим урядуванням, звичним до приходу Бурби. У зверненні до Ради Бурба описав економіку Орєнбурґа як «пасма волосся, що ширяють від підлоги до стелі, такі крихкі й позбавлені справжньої міцности. Та якщо покласти їх поруч і сплести разом, навіть товстий канат із волосся підніме людину на вершини гір». Радники замовкли, і залу охопило збентеження. З одного боку, для таких разючих змін за такий короткий час справді потрібна сильна рука. Та хто знає, чи ця рука дбає про інтереси кожної комуни? Невдовзі прихильники автономії та бурбівці знову почали серйозну дискусію на засіданні Ради, аж поки не розпочалися справжні чвари. Зрештою самому Бурбі довелося припинити агресивні образи й політичне позерство в Раді та поставити питання на голосування.\n\nКоли роздають білі бюлетені, присутні відчувають усю вагу становища: зрадити цінності автономії комун заради сильнішої економіки чи зустріти мінливий світ із застійною й розрізненою промисловою базою? Над столами перехрещуються сердиті погляди, перш ніж бюлетені збирають і рахують."
 ORE.79.a: "Технократи дбають про благо держави."

 ORE.80.t: "Голос кожній людині"
 ORE.80.d: "Попри всі свої численні вади, Орєнбурзька комуна в самій основі є державою народу. Робітнича рада - живе свідчення її непохитної відданости ідеалам демократичного врядування, і навіть після потрясінь та новомодних реформ голови Бурби громадяни під її опікою не виявляли жодного бажання змінити цей стан справ.\n\nТа це не означає, що пряма демократія Комуни бездоганна. Її новий голова на власному досвіді знає її найбільшу ваду, про що свідчать чвари й міжусобиці, які не вщухли навіть після 58-го конґресу. Надмір радників, кожен зі своєю унікальною й палкою позицією, не дозволяє досягти консенсусу в уряді Орєнбурґа, крім виняткових випадків. А для органу, який вважає консенсус священним? Це параліч на кожному рівні врядування.\n\nЕкономічний поступ не мусить і не повинен залежати від стану паралізованого органу, але дехто запитає: хіба це не означає знехтувати правом народу вирішувати долю власної економіки? Голова Бурба відповів посланням до кожного села, хутора й міста Комуни. Найкращі гінці, яких спромоглася знайти Рада, рознесли коротке повідомлення, написане простою мовою, зрозумілою навіть найнеписьменнішому дідові. На старих аркушах пергаменту було написано:\n\n"За сім днів приведіть до Орєнбурґа найрозумніших чоловіків і жінок. Народ потребує їхніх умінь"."
 ORE.80.a: "Кожен має голос. Скористайтеся ним."

 ORE.81.t: "Економіка - це наука"
 ORE.81.d: "Голова Алєксандр Бурба до болю усвідомлює один факт: економіка - це наука, що вимагає надзвичайної точности, щоб не зруйнувати життя тисяч людей. Для великого економічного відродження, якого прагне Бурба, він мусить дивитися на економіку як на наукову проблему, яку слід розв'язати, а на людей і гроші - лише як на чергову змінну в рівнянні. Разом зі своїм гуртом економістів його кліка планує кожен аспект майбутньої економіки; одна-єдина вада чи помилка в розрахунках - і весь картковий будинок розсиплеться в руках Бурби до ніг. Та Бурба не дозволить цьому експериментові провалитися, як жахлива держава Лисенка. Він процвітатиме й справді перетворить Орєнбурґ на рубін Уралу. Орєнбурґ переможе всупереч усьому й усім ворогам!"
 ORE.81.a: "Рубін Уралу нас не підведе."

 ORE.82.t: "Старі мапи, нові потреби"
 ORE.82.d: "Чоловіки з блиском в очах дивилися на обрій. Зі свого місця вони бачили милі й милі порожньої, незайманої землі, яка лише чекала, щоб її використали для своїх капіталістичних потреб. Під усією цією землею неодмінно мала бути нафта, сумнівів не було. Старі розвідники надр майже відчували її запах - запах багатства. До того ж священник сказав, що вона ховається під пилом, а церква не бреше. Єдина проблема полягала в тому, що ніхто - ані чоловіки, ані розвідники, ані церква - не знав, де саме лежить це блискуче, слизьке чорне золото. Вони сиділи в кабінетах, роздратовані й спантеличені тим, що нафта мусить бути, але знайти її неможливо, аж раптом у двері постукали. Зовні стояв низенький бібліотекар в окулярах - можливо, найгірша людина, до якої можна звернутися в пошуках нафти. У руках він тримав згортки паперу й відрекомендувався архівістом державного архіву Орєнбурґа. Капіталіст поставився скептично, чекаючи чергового волоцюгу, який хотів виманити гроші. Скепсис швидко зник, коли архівіст розгорнув папери й показав надзвичайно докладні матеріяли совєцьких геологічних розвідок цієї місцевости, на яку вони дивилися. Як це не спало їм на думку раніше? Совєцькі геологи славилися своєю ретельністю й точністю, а на принесених мапах були позначені нафтові родовища.\n\nЗа кілька тижнів місячний краєвид укрили нафтові свердловини, що невтомно працювали. Поступ швидко приходив до Орєнбурґа й так само швидко минав. Наше майбутнє сяє."
 ORE.82.a: "Якщо совєти щось і робили правильно, то це мапи!"

 ORE.83.t: "Земельне питання"
 ORE.83.d: "Нинішнє землевпорядкування в комунах цілковито жахливе. Величезні площі відведено під вирощування культур, на які майже немає попиту й які майже ніхто не споживає; у деяких комунах жодна людина не знає ефективних методів землеробства; а керування землею доручають людям без найменшого досвіду. Про належно зрошувані господарства ніхто й не чув, а водогін - рідкісна розкіш обраних; та коли він є, воду використовують не там, не тоді й не для тих. Для виживання аграрної економіки вкрай важливо реорганізувати управління землею та власність на неї, щоб люди, які керують більшою частиною нашої економіки, бодай трохи розумілися на справі. Наглядачі, призначені Алєксандром Бурбою, вже перебирають ролі цих людей. Якщо ми ефективно реорганізуємо землевпорядкування під компетентним керівництвом, економічні показники Орєнбурґа значно поліпшаться, а держава буде набагато краще підготована до більших реформ. Якщо ж ні, наша економіка може розвалитися цілковито."
 ORE.83.a: "Ось чому Робітнича рада не працювала."

 ORE.84.t: "Більше промислового обладнання"
 ORE.84.d: "Колись ми ставилися до Уральської Ліги з обережністю. Тепер ми найближчі союзники. Недавні програми «ленд-лізу» між нами й товаришами з Уральської Ліги привели до того, що багато цивільного та промислового обладнання вирушає за кордон, а багато надходить до нас. Завдяки тісному партнерству наші друзі на сході щедро запропонували допомогти індустріялізації, надіславши вироблені ними машини, автомобілі й креслення. Ми вже відправили їм як добровільний подарунок дуже велику суму грошей і підписаного Бурбою листа. Тепер, коли нам так бракує потрібного обладнання для процвітання та зростання економіки, ця допомога буде неоціненною. Звісно, вони не засипають нас подарунками лише з доброти сердець: ми станемо для них цінною підмогою в їхньому хрестовому поході проти Дірлеванґера та Лисенка. Та ми однаково дуже вдячні."
 ORE.84.a: "Слава нашим товаришам на Уралі!"

 ORE.85.t: "Більше жодних порожніх заводів"
 ORE.85.d: "Поки щедрі блага, даровані нам головою Бурбою, не перестають надходити, виникає дедалі більше питань.\n\nПорожня оболонка Совєцького Союзу лишила нашим громадянам безліч заводів - то чому б їх не використати?\n\nСьогодні вранці Бурба відповів на це питання, оголосивши, що порожніх заводів більше не буде. Моральний бік такого рішення викликав сумніви, адже більшість громадян Орєнбурґа не звикла навіть до самої промисловости, не кажучи вже про важке устаткування. Прихильники політики твердять, що потреба в програмі переважає можливі недоліки.\n\nЩо більше селян кидають плуг і йдуть на завод, міняючи лопату на гайковий ключ, то більше зростає орєнбурзька економіка. Чи принесуть ці реформи користь Орєнбурґу в довгій перспективі, невідомо; пересічний громадянин знає лише одне: час братися до роботи."
 ORE.85.a: "Будь-який поступ - добрий поступ."

 ORE.86.t: "Організована політика"
 ORE.86.d: "Політика - брудна гра. У ній важливо діяти обережно й використовувати кожен хід якнайкраще. Рада перебуває в безладі: засідання призначають, але не проводять, строки часто ігнорують до останньої секунди, а всередині майже немає життя.\n\nБурба бачить проблему й не раз виступав, домагаючись змін і привертаючи до неї увагу. Відтепер засідання призначатимуть за кілька днів, а правила послаблять. Рада знову оживе, коли її члени відстоюватимуть свої переконання у відкритих дебатах - саме так, як і було задумано для конґресу.\n\nЗавдяки змінам Бурби члени Ради знову мають причину приходити на роботу й дискутувати. Змінена на краще, Рада вступає в нову добу."
 ORE.86.a: "Спільнота, об'єднана неприязню."

 ORE.87.t: "Фахівці на місці"
 ORE.87.d: "Десятки радників сьогодні вранці пережили, мабуть, найнеприємніше пробудження у своєму житті. На їхніх столах лежали листи, однакові за текстом, розміром і чорнилом, із наполегливим проханням звільнитися якнайшвидше. Новий план Бурби щодо Ради, можливо, не збереже посади кожного радника й радниці, зате напевно виконає роботу.\n\nКожен, кого спеціальний комітет Бурби визнав непридатним, отримав такого листа в межах нового ідеалу справжньої технократичної Ради. Її члени більше не обійматимуть посад і не виконуватимуть роботи, до якої не підготовлені або для якої їм бракує компетентности.\n\nЯкщо все піде за планом, ця політика поліпшить відносини між членами Ради й тими, хто виконує допоміжні функції. На жаль, поки вона лише змусила звільнених замислитися, що робити далі. Не всі великі й масштабні реформи Алєксандра Бурби працюють так, як задумано."
 ORE.87.a: "Принаймні зачиніть за собою двері."

 ORE.88.t: "Знову все перетрушено"
 ORE.88.d: "Спираючись на свіжі дані, що ринули зі статистичного управління Ради, милостивий голова Бурба оголосив наступний план піднести Робітничу раду реформами до нових висот. На жах декого, ці реформи цілковито змінять її роботу. Бурба планує перетворити Раду на ефективну політичну машину, яка працюватиме як належить, а якщо й припуститься помилки - швидко її виправить і рушить далі. Утім, ці реформи дорогі й потребують часу. Багато хто не встигатиме за цими змінами. Та зрештою велике перетворення нашої старіючої Ради буде того варте.\n\nПісля завершення змін народ і далі матиме традиційний голос, а Орєнбурґ лишатиметься великою державою, якою завжди міг стати. Єдина істотна відмінність: Рада, яка відповідатиме людям, діятиме набагато ефективніше й швидше."
 ORE.88.a: "Цей чоловік просто не зупиняється."

 ORE.89.t: "Друзі в Лізі"
 ORE.89.d: "Керівники Уральської Ліги - дивна компанія. Найдивніші, безперечно, ті, хто буцімто представляє утворення, яке скидається лише на підрозділ спеціяльного призначення з кількома будинками.\n\nЄ серед них і ті, кого очікуєш побачити: різні загартовані солдати, старі совєцькі чоловіки, які воювали то в одній війні, то в іншій або охороняли ҐУЛАҐи до останніх днів Союзу. Трохи дивніші ті, кому ледве виповнилося двадцять-тридцять: Гвардія підібрала їх пізніше в цій забутій Богом мандрівці, але невдовзі вони показали себе більш ніж здатними командувати батальйоном або двома. Попри молодий вік ці чоловіки виглядають майже такими старими, як товариші: роки переходів Уралом від однієї битви до іншої жахливої битви зістарили їх швидше, ніж мала б старіти будь-яка людина. Від веселої жвавости молодости не лишилося цілковито нічого.\n\nТа ще дивніший їхній цивільний персонал. Це зморщені старі, політичні активісти, священники й усі інші, хто багато років тому якось викликав гнів Бухаріна або його наступників. Вони без кінця сперечаються між собою: про релігію та її відсутність, про переваги й недоліки комунної системи Орєнбурґа, про те, як сильно їм не подобається різкість солдатів і невігластво цивільних.\n\nПроте найдивніше - не якась конкретна людина, а вся група. Попри відмінності й суперечки чоловіки працюють майже в ідеальному тандемі. Можна подумати, що солдати-комуністи, католицькі священники й політичні ізгої, замкнені в одній тюремній камері, швидко влаштують смертельну криваву бійку, але очевидно: ці люди не могли б жити без товариства інших побратимів. Вони говорять одне за одного, наче читають думки, й хоча сваряться та б'ються, люто захищають товаришів, коли хтось сторонній наважується поставити групу під сумнів.\n\nА найважливіше - ми запросимо їх знову.\n\nКожна зустріч захоплює, кожен пункт погоджують, схоже, найкращі розуми й найміцніші м'язи, які тільки могла дати холодна проклята в'язниця. Не всі їхні пропозиції слушні, але кожна варта принаймні суперечки. Нам стільки всього треба обговорити з цими людьми: як поліпшити наші держави, як ще більше розширити відносини. Невдовзі відбудеться найбільша зустріч. Нам лишається боятися божевілля, яке принесе ця група, та прозріння, на яке здатна лише вона."
 ORE.89.a: "Божевілля й геніяльність - два боки однієї монети."

 ORE.90.t: "Гартівня"
 ORE.90.d: ""Біжи, клятий псе!" - кричить один інструктор.\n\n"Малий вилупку! Глянеш мені у вічі - переламаю тебе об своє кляте коліно! Ти знаєш, що я бачив!? Де я був!?" - репетує інший просто в обличчя хлопцеві не старшому за шістнадцять років, який ледве стримує сльози, поки троє інших уральських гвардійців гуртом насідають на нього. На одному краю тренувального поля жінці обробляють рани після падіння зі смуги перешкод, спорудженої гвардійцями; на іншому чоловік дістає свіжі рани, бо уральський гвардієць раз у раз б'є його по голові канцелярським планшетом за запізнення на поле.\n\nУральська гвардія завжди здавалася справді шляхетною. Вони сміються й жартують або тихо сидять і дивляться вдалину, згадуючи давно скінчені битви. Вони рятують життя й переходять із міста до міста, надаючи всю можливу допомогу. Та цей бік Гвардії новий для всіх. Багато хто добровільно вступив до них або погодився на вишкіл, сподіваючись за одну ніч стати відображенням найкращих воїнів Росії, але швидко розуміє: це потребує значно більше крови й поту, ніж вони очікували.\n\nТа коли новобранці роти «Анна», яка першою почала новий пекельний вишкіл Гвардії, виходять на десяте коло десятикілометрового забігу, результат очевидний. Чоловіки й, на прикрість багатьох, жінки роти біжать уже значно впевненіше. Вони легше дихають, рідше спотикаються, а в їхніх очах видно готовність убивати за свою країну."
 ORE.90.a: "Тяжкий вишкіл для тяжкої битви!"

 ORE.91.t: "Повільний союз"
 ORE.91.d: "Це називають Уральським дивом: холодна розрядка у відносинах Ліги та Комун нарешті змінилася справжнім потеплінням. Обрання Бурби головою передувало остаточному розриву з попередньою політикою щодо Ліги, і поволі, але впевнено кордони вздовж старими гірськими дорогами до Бєлорєцка дедалі частіше ходять і з нашого, і з їхнього боку кордону. Спільні військові патрулі, торгові каравани та дипломатичні місії зробили нашу дружбу з Уральською Лігою таємницею Полішинеля, а тепер уже говорять навіть про постійний союз, який закріпить особливі відносини.\n\nЗвісно, мало хто в Раді наважується навіть жартувати про таке: Комуни досі зв'язані соціялістичною доктриною, а її зрада загрожує крахом народної підтримки. Годі й казати, що багато сільських Комун висловили невдоволення тим, що стільки уваги в нових дипломатичних відносинах зосереджено на самому Орєнбурзі, хай і лише в місцях, які не можуть вистежити агенти внутрішньої безпеки.\n\nУтім, підтримка таких думок натяками й зауваженнями могла б ще більше поліпшити наше становище у відносинах із Лігою та зміцнити нас проти внутрішньої опозиції. Ліга - міцна опора й вірний друг, а найкращим друзям не треба називатися, щоб бути поруч."
 ORE.91.a: "Можливо, дива таки справжні."

 ORE.92.t: "Прихований потенціял Орєнбурґа"
 ORE.92.d: "Коли німці взялися зламати російську націю, вони методично нищили її міста. Усе цінне на схід від лінії А-А бомбардувальники Люфтваффе обертали на непридатні руїни. Великі міста, промислові центри, військові бази - Люфтваффе розтрощило майже все, що могло допомогти російському народові вибратися з тисячолітньої безодні.\n\nЗвісно, навіть ресурсів цілої промислової держави не вистачило б на стільки бомб, щоб зрівняти із землею всю Росію. Кілька районів пережили апокаліпсис - якщо й не неушкодженими, то в досить пристойному стані, щоб і далі працювати.\n\nАлєксандр Бурба опинився в Орєнбурзі на початку Великої Вітчизняної війни. Щось у цьому регіоні допомогло врятувати його від апатії, що вразила стількох уцілілих із колишнього Совєцького Союзу. Навколо лежала регіональна столиця, яка пережила кінець світу й початок нового. Її мешканці пристосувалися, відрізані від совєцького промислового ланцюга постачання. Місто було досить великим, щоб підтримувати середню й навіть вищу освіту, але не більше.\n\nТоді Алєксандр Бурба почав мріяти. Частина його підозрювала, що це лише спосіб упоратися з пережитим. Та мрія підтримувала його у важкі часи сорокових і п'ятдесятих. Він допомагав людям регіону зберігати якомога більше заводів. Допомагав фінансувати експедиції інших амбітних людей до сусідніх земель. Заохочував молодь Орєнбурґа ставати торговцями, інженерами, політиками й науковцями, щоб вона допомогла йому зберегти мрію про багатство й поступ.\n\nБурба надто добре знав, що його бачення заможного Орєнбурґа зможе здійснитися лише в майбутньому. Треба було відбудувати надто багато установ. За допомогою примітивних знарядь треба було створювати трохи кращі - і так крок за кроком, поки промислова база Орєнбурґа знову не зможе творити сучасність. На відміну від катастрофічної ідеї Ґєорґія Малєнкова про великий стрибок уперед, його мрія була поступовою. Науковець знав, що порядок і поступ можна відновити з часом. Йому потрібні були лише терпіння й трохи вдачі."
 ORE.92.a: "Нехай німець руйнує. Ми, росіяни, збудуємо майбутнє зі скла та сталі."

 ORE.93.t: "Підкріплені силою"
 ORE.93.d: "Після тижнів вишколу нещодавно реформовані Сили оборони Орєнбурґа взялися за перше справжнє завдання: захист торговельних шляхів, якими наші каравани возять товари численним комунам уздовж дороги. Від часів війни ці шляхи були небезпечними: бандити без страху покарання відбирали товари в кожного купця й мандрівника, бо ополчення, що раніше охороняли Орєнбурґ, були лише зграєю ні на що не здатних підлітків і старих, які прагнули знову пережити дні слави. Через кепський людський матеріял і неефективну структуру командування ополчення втікали від першого пострілу. Та цього разу на бандитів чекав сюрприз: вони напали не на старі й недієздатні ополчення, а на реформовані й ефективні Сили оборони Орєнбурґа, вишколені за взірцем могутньої Уральської гвардії, здатні впоратися з будь-якою загрозою й легко її нейтралізувати.\n\nБанда нишпорила поблизу Орєнбурґа й, побачивши торговий караван, що зупинився відпочити край дороги, вирішила, що тут на неї чекає легка пожива. Вони й не здогадувалися, що це пастка роти «Анна». Усе скінчилося менш ніж за п'ять хвилин від початку засідки: після жорстокої перестрілки всі бандити лежали мертві, а жоден ополченець не дістав навіть подряпини. Наступна зграя двічі подумає, перш ніж нападати на Орєнбурґ."
 ORE.93.a: "Орєнбурґ більше не беззахисний."

 ORE.94.t: "Об'єднані разом"
 ORE.94.d: "Ознаки похмурі: божевільні орди Дірлеванґера й Лисенка збираються на обрії, готові до бенкету. Принаймні таке враження справляє підготовка Уральської Ліги й ополчень Орєнбурґа. Гвардійці та ополченці бездоганно взаємодіють на навчаннях і нарешті починають працювати як єдина сила проти сил темряви на сході. Та цю співпрацю треба формалізувати, щоб зв'язки між двома суспільствами було закарбовано не лише кров'ю і сталлю, а й чорнилом.\n\nОб'єднана оборонна ліга Південного Уралу - офіційний пакт, що скріпить нашу відданість взаємній обороні непорушними путами бюрократії. Нарешті, як об'єдналися наші солдати, так об'єднаються й політики та дипломати. Нехай приходять, нехай пси війни розіб'ються об наші укріплення, наче хвилі об берег! Вони побачать нас незламними, пліч-о-пліч проти крижаної бездушности Маґнітоґорска й палаючої, кривавої жорстокости Дірлеванґера."
 ORE.94.a: "Лишається лише дочекатися слова Ради."
 ORE.94.b: "На жаль, мусимо відмовити."

 ORE.95.t: "Корона для коштовности"
 ORE.95.d: "Хоч місто Орєнбурґ стало сяйною коштовністю Уралу й усі вже знають про його великі здобутки, менш уславлена, але не менш велична зміна прийшла до навколишніх селянських комун. Велике відродження міста багато вимагало від довколишньої землі. Побудовано десятки нових господарств, а ще більше - цілковито перебудовано й модернізовано. Краєвид тепер заповнюють комплекси заводів і шахт. Усе це, звісно, потребує належної транспортної інфраструктури. А всі дороги ведуть до Орєнбурґа.\n\nРазом із дорогами приходить безпека. Дорога марна, якщо бандит може просто пограбувати кожного, хто нею їде, тому тепер місцевість усіяна заставами, які дають мандрівникам змогу рухатися без постійного страху нападу. Для роботи застав потрібні гроші, тож бідняки знаходять працю поряд із солдатами, збираючи для держави мито з перехожих. Звісно, цим працівникам і солдатам треба десь жити, тому навколо виросли малі села й поселення. А завдяки безпеці та численним заставам по всьому краю з'явилися поштові станції, кур'єрські служби й заїжджі двори для мандрівників.\n\nЩоб ці підприємства відкривалися, потрібні люди, здатні в них працювати. Тепер не лише держава розвиває землю: різні підприємства почали утримувати школи для дорослих і дітей, і рівень письменности наближається до довоєнного. Кляса письменників зростає, а їй теж потрібні кав'ярні для зустрічей, газети для читання й книжки для маленьких бібліотек.\n\nА якщо письма замало? Саме ця думка привела до будівництва радіостанції в Соль-Ілєцку - однієї з менш ніж дванадцяти, споруджених у Росії за останні двадцять років. Уже говорять про те, як налагодити торгівлю із зовнішнім світом. Дістати телевізори! Телевізори!\n\nМісто Орєнбурґ може бути сяйною коштовністю, та хто скаже, що область не стає гідною короною? Дякуйте товаришеві Бурбі, бо майбутнє вже тут!"
 ORE.95.a: "...а тепер біржове зведення?"

 ORE.96.t: "Прийняти пропозицію Ліги"
 ORE.96.d: "Уральська Ліга запропонувала союз нашим скромним комунам. Звісно, ми радо погоджуємося! Після кількох годин дискусій майже одностайно вирішено, що союз із Лігою безперечно відповідає нашим інтересам. Уральська Ліга довела, що ефективно захищає слабких і безборонних у регіоні, й стане чудовим союзником проти божевільних у Маґнітоґорску та зграї розбійників Дірлеванґера. Та й навіщо нам відмовлятися?\n\nОполчення Орєнбурґа й найкращі бійці Уральської Ліги вже зустрічаються, щоб обговорити стратегії та підготуватися до неминучих вторгнень Маґнітоґорска та людей Дірлеванґера."
 ORE.96.a: "Разом у похід!"

 ORE.97.t: "Орєнбурґ стоїть сам!"
 ORE.97.d: "Пропозицію Ліги зважено, думку ради комуни вислухано, голоси й жереб кинуто. Знадобилося багато годин лютих і напружених дебатів, але Лізі нарешті дали відповідь: "Ні".\n\nОрєнбурґ мусить стояти окремо від Уральської Ліги. Краще хай Орєнбурґ живе або загине на власних умовах, спираючись на силу наших комун, їхню демократію та мораль, ніж буде поглинутий Уральською Лігою й утратить крихку незалежність. Це важке рішення, бо воно означає відкинути неявні оборонні пакти Ліги проти Маґнітоґорска й Дірлеванґера, Чорної Гори й Чорної банди. На краще чи на гірше, Орєнбурґ стоїть сам. Та й навіщо було погоджуватися - ми здатні стояти самі! Треба згуртувати ополчення й спланувати майбутнє без підтримки Ліги. Багато керівників комун сподіваються, що відхилення люб'язної пропозиції Ліги не завдасть нашим відносинам надмірної шкоди."
 ORE.97.a: "Ми самі викуємо свою долю."

 ORE.98.t: "Тріюмф Малєнкова!"
 ORE.98.d: "Після років анархії та виродження здається, що мудрі й доброзичливі реформи нашого улюбленого голови нарешті проклали Орєнбурґу шлях до поступу з небаченою раніше швидкістю. та такий темп приніс із собою небезпеки - нестабільність, голод і смерть через наш стрімкий поступ.\n\nТому голова наказав послабити програми, знизити норми й оголосив Народне свято для всього Орєнбурґа. Вшануймо мертвих, адже їхня жертва привела нас до райдужного червоного світанку! Подбаймо про їхніх дітей і розкажімо їм, що батьки віддали все заради спільного добра! Бо заради чого має стояти наше суспільство, якщо не заради спільного добра? Реакціонери на Уралі можуть звинувачувати нас у пролитті невинної крови в ім'я поступу, але ми мусимо відповісти простою й ясною правдою: Орєнбурґ піднесено, а втрати прийнятні. Загиблих вічно шануватимуть як героїв, і духом вони навіки крокуватимуть разом із товаришами.\n\nНехай червоне сяйво поступу охопить націю, нехай хмари сажі над нами нагадують про нашу славу! Нехай голова постане перед велелюдними масами, сповнений захвату від слави, яку приніс Орєнбурґу! Бо всі ми його діти, до яких він має ставитися з добротою й справедливістю, визволених із чорного лона анархізму. Під його доброзичливим проводом ми можемо підлетіти надто близько до Сонця й добровільно пожертвувати собою заради спільного добра комуни, але зрештою все це напевно буде того варте."
 ORE.98.a: "Слава Комуні! Слава голові!"

 ORE.101.t: "Суперечка між комунами стає насильницькою"
 ORE.101.d: "Робітнича рада в місті Орєнбурзі постала з давньої традиції шукати посередництва в суперечках між комунами. Та ця традиція посередництва й подальшого арбітражу не змогла цілковито викорінити іншу традицію - відкрите насильство між ворогуючими комунами, які відмовляються шукати мирний компроміс.\n\nСьогодні вранці сили ополчення однієї комуни відкрили вогонь по ополченцях сусідньої. Перші звіти про сутичку свідчать, що конфлікт виник через доступ до спірних пасовищ. Оскільки одна сторона вже пролила кров, майже напевне друзі й родини загиблих готують відплату.\n\nБагато членів Ради твердять, що в ці кризові часи не можна дозволити відкритій війні між формально союзними комунами тривати. Вони наполягають на укладенні бодай якогось перемир'я, поки Рада працюватиме над мирним розв'язанням суперечки. Інші, радикальніші радники пропонують попросити сусідню Уральську Лігу надіслати миротворців, щоб розділити дві північні комуни.\n\nОбидва варіянти коштуватимуть ресурсів і політичного капіталу. Допомога Ліги, ймовірно, посилить чутки про близьке поглинення нашими північними сусідами. Не менш гучна фракція Ради пропонує просто нічого не робити й дозволити цим жорстоким ідіотам самим довести бійку до кінця. На цьому етапі народ Орєнбурґа вже навряд чи може бути ще більше розчарований бездіяльністю Ради..."
 ORE.101.a: "Перенести частину порядку денного й скликати надзвичайне засідання Ради для переговорів про перемир'я."
 ORE.101.b: "Попросити Лігу «випадково» розмістити прикордонні війська на спірній землі."
 ORE.101.c: "Нехай самі з'ясують усе бійкою. Це бодай трохи навчить наші війська..."

 ORE.102.t: "Новий тип сепаратиста"
 ORE.102.d: "Рада звикла, що комуни оголошують про вихід із Робітничої ради. Такі виходи зазвичай стаються, коли селяни вирішують радше спробувати вижити самостійно, ніж лишатися прикутими до тіла нашої робітничої демократії, що помирає. Причинами виходу зазвичай стають занепокоєння економікою, безпекою або демократичним представництвом.\n\nСьогодні представник північної комуни почав знайому промову, тавруючи Раду як нездатну й корумповану. До цього додалася звична тема неспроможности захистити від бандитів і чужинців. Наші люди в Раді терпляче чекали, коли представник оголосить про вихід його комуни з Робітничої ради, аж раптом вибухнула бомба: комуна покине Орєнбурґ і попросить захисту Уральської Ліги!\n\nНезважаючи на рев обурення, представник підсумував промову спостереженням, що без дієвого війська комуни Орєнбурґа приречені на знищення. Чому б натомість не приєднатися до розсудливого уряду й не проміняти демократичну анархію на безпеку?\n\nХоч багато членів нашої фракції погоджуються з аргументами представника, це відокремлення викликало бурю протестів. Чимало радників наполягають, що треба переконати комуну змінити плани, інакше Робітнича рада втратить іще більше довіри. «Голуби» пропонують збільшити інвестиції в комуну, що вирішила вийти, а «яструби» натякають, що зрада Орєнбурґа може загрожувати безпеці сепаратистів."
 ORE.102.a: "Наші руки зв'язані."
 ORE.102.b: "Кляті зрадники!"

 ORE.103.t: "Реформістські фракції б'ються на базарній площі"
 ORE.103.d: "Хоч панівна політична коаліція в місті Орєнбурзі є союзом фракцій, які прагнуть реформ та індустріялізації, це не означає, що місто вільне від нескінченної внутрішньої боротьби, яка вражає кожне політичне угруповання Робітничої ради.\n\nУчора на людній базарній площі сталася жорстока сутичка між прихильниками соціялістичного централізму товариша Малєнкова й торговцями та інженерами, які поділяють технократичні, хоч і технократичні ідеї товариша Бурби, на які відчутно вплинула демократична традиція. Ніхто не погоджується, хто підпалив ґніт цієї порохової бочки: люди Малєнкова кажуть, що лише протестували проти антисоціялістичних ідей Бурби, а люди Бурби звинувачують малєнковців у тому, що ті надіслали головорізів їх залякати.\n\nНам, звісно, хотілося б, щоб наша політика стояла вище за такі вульгарності, як «у кого на вулиці більше кремезних хлопців», але важко заперечити, що трохи насильства додає фракції авторитету на вулицях. Поки обидві сторони сьогодні відпочивають і зрощують поламані кістки, виявляється, що переможцями бійки стали..."
 ORE.103.a: "Люди Бурби. Хто знав, що ці товстосуми вміють битися?"
 ORE.103.b: "Група Малєнкова. Вони справді добре спланували засідку на базарі."

 ORE.104.t: "Уральські квіти"
 ORE.104.d: ""Ти сказав - тисячу років, і наші серця розтанули. Я дивлюся на руки, які колись тримали мої, і серце досі болить". - пані Хеґурі\n\nВона прекрасна, стоїть серед сосон, що колишуться. Я знаю: якщо вимовлю бодай слово, ця мить буде втрачена, тож мовчу, й вона минає. Щодня на мить я діставатиму її із серця, стиратиму пил і на одну сяйну секунду знову знаходитиму її.\n\n"Я ненавиджу й люблю". Ми завжди сперечалися, завжди були по різні боки: син землевласника й донька профспілкового діяча. Клясова боротьба в дії, як дехто казав. Як же вони дивувалися, побачивши, що ми обмінюємо удари на поцілунки, лють - на пристрасть. Зброю - на троянди.\n\nНам стало зрозуміло: якщо лишимося, наше кохання, народжене у вогні, швидко загине в полум'ї. В обох родинах панувала взаємна ненависть, що позбавляла всіх здорового глузду, і наші стосунки раз по раз ламалися об неї. Плачучи, вона втекла до нашого таємного місця за містом. Там ми разом спланували втечу.\n\n"Поза уявленнями про правильне й неправильне є поле. Я зустріну тебе там". - Румі\n\nДень настав. Ми потай вибираємося у величезних кошиках, наче Мойсей, схований в очереті, на каравані до далекого Казахстану, де, кажуть, пустили коріння поляки. Лотоси квітнуть у багні, і, можливо, зможемо й ми. Тепер вона позує для світлини, усміхається, сміється, а її волосся - золоте знамено в дикому повітрі.\n\nМоя кохана озвалася до мене: встань, люба моя, прекрасна моя, і ходімо. І я пішов."
 ORE.104.a: "Кохання яскраво сяє в темряві."

 ORE.105.t: "Суд над відомим злочинцем"
 ORE.105.d: "Хоч останні кілька років Чорна бригада Дірлеванґера старанно підтримувала славу найжорстокішої зграї бандитів у Росії, конкуренція була запеклою. Цього разу відомого злочинця з казахських степів схопили після того, як його люди намагалися відступити з пограбованої комуни на орєнбурзько-казахському кордоні. Рядових злочинців застрелили, а ватажка банди захопили й потягли до Орєнбурґа на суд.\n\nНаселення не в захваті від ідеї відкритого суду, коли гора доказів бандитських злочинів поставила б у глухий кут будь-якого захисника. "Віддайте його народові на справжній суд!" - скандує натовп перед будівлею. Присяжних це не надто похитнуло, і вони далі обговорюють його долю. Багато хто пропонує принизити бандита, а потім покинути голим помирати в казахському степу. Якщо залишити його публічно гнити, це покаже силу правової системи Орєнбурґа й переконає натовп у його загибелі. Інші висунули радикальнішу ідею: чому б не використати арешт знаменитого бандита для започаткування нової пенітенціярної системи? До першого в'язня приєднаються всі майбутні спіймані бандити й решту життя тяжко працюватимуть у виправній колонії за межами міста Орєнбурґа. Цей прояв сили зміцнить образ орєнбурзького уряду як джерела правосуддя й порядку та допоможе далі централізувати регіон, водночас зміцнюючи владу й легітимність уряду.\n\nКритики плану засуджують ідею лишити чоловіка живим, коли він не дарував жертвам милосердя. Довічний вирок, імовірно, спричинить вуличні заворушення. З іншого боку, багато присяжних погоджуються: якщо просто дозволити натовпові зробити своє, ми здобудемо короткочасну популярність, але зашкодимо довгостроковим зусиллям зосередити правосуддя в наших судах."
 ORE.105.a: "В Орєнбурзі править народ, а кожен, хто в цьому сумнівається, може зустріти народний гнів."
 ORE.105.b: "Приниження покладе край його бандитській кар'єрі. Степ так само покладе край життю."
 ORE.105.c: "За злочини він заплатить життям у нудьзі й тяжкій праці в нашій новій пенітенціярній системі."

 ORE.106.t: "Криза в комунах"
 ORE.106.d: "У комунах зібрався розлючений натовп, який вимагає суду над украй суперечливим радником. Натовп заявляє, що той активно намагався підірвати їхні права і мусить бути негайно покараний. Хоча гнів проти радника цілком справжній, ми не знаємо напевне, чи він обґрунтований. За час своєї служби він зарекомендував себе цілком пристойним представником комун.\n\nТа навіть за браком доказів його методи добре відомі. Щоразу, коли треба провести щось через Раду, він відвідує інших законодавців, тисне на них і домагається підтримки свого рішення. Він призначає на посади в комунах близьких друзів, заслуговують вони того чи ні. Ходять чутки, що приватно він висловлював реакційні погляди, хоча ми не знаємо, чи це правда. Хай там як, доведеться діяти.\n\nДехто в комітеті вважає, що слід легенько дати йому по руках і відпустити. Інші вимагають належної процедури та повного розслідування. Хтось навіть виступає за суд натовпу. Та зрештою загальний консенсус такий..."
 ORE.106.a: "Йому треба дати другий шанс."
 ORE.106.b: "Комітет вирішить твою долю."
 ORE.106.c: "Віддайте його їм!"

 ORE.107.t: "Солдати без кордонів"
 ORE.107.d: "Невелика колона ввійшла до Орєнбурґа, розмахуючи білими прапорами, але все ще несучи малий арсенал рушниць, кулеметів і гранат - реліквій старого Совєцького Союзу. Орєнбурзькі солдати, які супроводжували їх до міста, спершу здивувалися: багато прибульців говорили російською з дивним важким акцентом, а дехто ледве нею володів. Однак чоловіки явно були ветеранами, і коли стало зрозуміло, що вони не бажають зла, з'ясувалося: це насправді 1-й чехословацький армійський батальйон, точніше те, що від нього лишилося. Ці солдати походять з однієї з перших країн, у яку нацисти встромили ікла, - Чехословаччини. Коли їхня держава була приречена впасти, вони вирішили продовжити боротьбу з території Совєцького Союзу й відступили до Росії. Доля знову була немилосердна: коли Союз розпався під ударами Вермахту, їх знову розсіяли й змусили відступати.\n\nТа 1-й чехословацький батальйон відмовився здатися. Коли Росію охопила анархія, вони гордо несли свої знамена кольори, зрештою відступили на Урал і стали мандрівною ватагою найманців. Тепер, після років мандрів і боїв, вони нарешті дісталися Орєнбурґа й просять лише притулку та постійного житла. В обмін вони пропонують свій військовий досвід для захисту міста від кожного, хто йому загрожуватиме. Багато хто бажає прийняти їх із розпростертими обіймами як товаришів у боротьбі проти бандитів та інших загроз. Утім, дехто вважає, ще стільки голодних ротів можуть стати надмірним тягарем для й без того слабкої економіки Орєнбурґа, а Уральська Ліга в будь-якому разі буде їм відповіднішим місцем. Нарешті пролунали поодинокі незгодні голоси: Орєнбурґ нібито просто не може довіряти цим людям, які можуть бути лише переодягненими бандитами."
 ORE.107.a: "Ласкаво просимо до наших лав!"
 ORE.107.b: "Нехай натомість приєднаються до Ліги."
 ORE.107.c: "Цим людям не можна довіряти."

 ORE.108.t: "Слуга Чорної Гори?"
 ORE.108.d: "Останнім часом навколо командира міського ополчення Орєнбурґа Алєксандра Родімцева ширяться тривожні шепоти. Наче з нізвідки громадян Орєнбурґа охопила параноя: вони стверджують, що мають незаперечні докази того, що командир Родімцев служить Чорній Горі під жорстоким поглядом Маґнітоґорска. Коли просиш доказів, тебе неодмінно спрямовують до іншої людини, яка попередила попередню про зраду Родімцева. Поверхове розслідування показує цілковиту безглуздість заяв, але декого непокоїть уже те, як така чутка взагалі виникла. Можливо, хтось щось бачив, а командир справді подвійний агент. Розпочати невелике тихе розслідування справ Родімцева було б не зовсім безглуздо, хоча все це може виявитися лише несмачними плітками."
 ORE.108.a: "Це безглуздя! Не зважайте."
 ORE.108.b: "Можливо, варто розслідувати."

 ORE.109.t: "Таємничі мандрівники"
 ORE.109.d: "Сонце сходило над уральськими полями, й Орєнбурґ тільки починав своє жваве, багатолюдне життя, коли перед міською брамою з'явився великий гурт людей із казахськими степовими кіньми, нав'юченими величезними вантажами чужоземних багатств. Хоч усі вони були однієї національности, один на одного не скидалися. Дехто вдягався як німці чи балти, інші, попри слов'янську зовнішність, носили тюрбани й каптани, а хтось навіть поєднував в убранні західні та східні елементи. Вони говорили знайомою, але все ж незрозумілою мовою; лише кілька з них сяк-так говорили російською з виразним шиплячим акцентом. Коли стало зрозуміло, що прибульці не бажають зла, їм дозволили ввійти до Орєнбурґа.\n\nЕкзотичні подарунки розійшлися серед місцевих за лічені години, але мешканців Орєнбурґа в гостях цікавило не це. Вони хотіли знати, хто ці люди й із якої країни прибули. Як з'ясувалося, мандрівники дісталися Орєнбурґа із земель Західного Казахстану, але самі були польської крови. Як і Росію, Польщу давно розтерзали німецькі загарбники, а багатьох польських синів і дочок відправили на смерть у замерзлі пустки Сибіру й пустельні степи Казахстану. Та Польща вижила. Гордий польський народ не скорився долі й оселився поза досяжністю Німеччини, будуючи нову надію для своїх співвітчизників.\n\nПробувши певний час у місті, польський караван після другої ночі покинув його й рушив у невідомому напрямку. Куди б не подалися чужоземні мандрівники, вони лишили найкраще враження в місцевих, які співчували їхній сумній долі - втраті батьківщини через кровожерного чужоземного окупанта."
 ORE.109.a: "Щасти вам, мандрівники..."

 ORE.110.t: "Свято врожаю"
 ORE.110.d: "Минув іще один рік, і настав час святкувати, бо до Орєнбурґа прийшло велике Свято врожаю! Щоосени, коли річні жнива завершено, мешканці міста й комун сходяться на радісне святкування та ласують плодами своєї праці. Здається, це єдиний день, коли наша «нація» цілковито єдина, коли ми забуваємо проблеми й ненависть. Є краса в самій цій миті, і сьогодні ми відкриваємо її наново. Завдяки добрим жнивам цього року Свято врожаю обіцяє бути особливо величним. До того ж міська рада Орєнбурґа погодилася надати кошти й допомогти з організацією. Тож майбутнє Свято врожаю стане найбільшим в історії і за кількістю присутніх, і за обсягом частування. Люди явно чекали на нього з нетерпінням: багато хто почав готуватися до поїздки в Орєнбурґ ще за кілька місяців до початку гулянь. Коли сонце сідає, звучать церемоніяльні сурми; після короткої оптимістичної промови члена міської ради Орєнбурґа брама свята відчиняється. За лічені секунди на майданчик вривається цунамі голодних селян, і з початком гулянь радісні вигуки чути за милі. Люди добре їдять, багато хто танцює до пізньої ночі, а дехто, перебравши надто міцного трунку, вже ледве тримається на ногах. Та спільнота загалом надзвичайно вражена подією й бачить у ній турботливий жест міської ради Орєнбурґа, яка вже пожинає плоди успіху: її популярність серед народу зростає. Нація єдина, хай лише на день і ніч."
 ORE.110.a: "Не можу дочекатися наступного року!"

 ORE.111.t: "Малєнков вимагає дій після виходу сіл"
 ORE.111.d: "Рішення кількох сіл відокремитися від Орєнбурґа стало для Малєнкова справжнім потрясінням. Їхній вихід Він сприйняв це як найтяжчу зраду. Усі ті роки він будував комуну разом із товаришами, з якими часом не погоджувався. Усі ті роки намагався реформувати її разом із союзниками, які гуртувалися навколо нього. Усі ті роки мріяв повернути комунізм на батьківщину під владою сильнішого центрального правителя. Зрада розлютила його, і в гніві він прийшов до залів Орєнбурґа та заявив решті товаришів: настав час провести централізацію, щоб протистояти дедалі більшій нацистській загрозі."
 ORE.111.a: "Орєнбурґ потребує центрального керівництва, і потребує його зараз."

 ORE.112.t: "Спровоковане відокремлення"
 ORE.112.d: "На думку Алєксандра Бурби, сама ідея того, що села можуть порвати з Орєнбурґом і приєднатися до Уральської Ліги, - лише симптом провалу нинішньої орєнбурзької моделі. Бурба вважає, що переконати ці сепаратистські села залишитися з Орєнбурґом і назавжди запобігти повторенню такого можна тільки агресивною кампанією реформ. Сам Орєнбурґ не може існувати вічно, принаймні в нинішньому стані, а єдиний шлях до майбутнього для всіх - промисловий поступ і належна організація держави.\n\nОрєнбурґ більше не може існувати як сукупність децентралізованих комун, нездатних захистити себе ані як держава, ані тим паче як група окремих комун. Саме переконання Бурби зробили його однією з головних постатей серед реформістів Орєнбурґа, і саме його ідеї цілком можуть привести край до майбутнього, в якому він зможе витримати всі випробування й лиха, що випали на долю роздробленої Росії простору. Утратити ці села тепер - прикро; втратити всю націю буде трагедією."
 ORE.112.a: "Бурбо, веди нас у майбутнє!"

 ORE.113.t: "Партія розколюється"
 ORE.113.d: "Старий жарт каже: зберіть двох орєнбуржців - і знайдете три доктрини; зберіть трьох - і знайдете чотирьох зрадників справи; зберіть чотирьох - і партія розколеться. Виявилося, цей жарт краще було лишити в шинках і пивницях Орєнбурґа, бо тепер Рада довела його правдивість у найбурхливіший спосіб. Єдність лівих у місті розвалилася: дві кліки, сформовані Бурбою та Малєнковим, зреклися всіх зв'язків одна з одною й називають одне одного відступниками від партійної лінії та руйнівниками партійної єдности й марксистської ортопраксії.\n\nСумна іронія полягає в тому, що партійна фракція, навколо якої вони спершу згуртувалися, не бажала нічого, крім реформ. Та що більше вони розчаровувалися один в одному, то далі розходилися їхні визначення реформи, аж поки не стали непримиренними. Ринковий соціялізм Бурби й плани вільного промислового розвитку стали нестерпними для авторитарного марксиста-догматика Малєнкова, і навпаки.\n\nТепер двоє відкрито змагаються за посаду голови, а Комуни дивляться із сумішшю жаху й захоплення. У тиші обидві кліки радяться із сірими кардиналами та впливовими закулісними діячами й готуються. Настала остання боротьба за чистоту Революції, і кожен твердо вирішив перемогти. Суперникові лишиться тільки смітник історії."
 ORE.113.a: "Спробуймо обійтися без очікуваних жартів, товариші."

 ORE.114.t: "Пропозиція Малєнкова"
 ORE.114.d: "Останнім часом Малєнков мандрує окраїнами сфери впливу Орєнбурґа, розмовляє з місцевими керівниками й виступає перед радами комун. Мета цієї невеликої подорожі комунами цілком очевидна: об'єднати окраїнні громади навколо Малєнкова, щоб він здобув більше влади. Він майже не приховує амбіцій, але це не завадило багатьом серйозно розглянути його пропозиції.\n\nМалєнков каже, що союз створено для співпраці між комунами. За його визначенням, співпраця - це коли дві сторони допомагають одна одній, а не одна визискує другу. Отже, якщо села підтримають Малєнкова, він так само підтримає їх. Орєнбурґ більше не визискуватиме їх - ні, Орєнбурґ їм служитиме! Ресурси й адміністрація Коштовности Уралу належатимуть їм, і все лише тому, що вони підтримали найкращого кандидата. Непогано, еге ж?\n\nХоча багато хто спокусився, ще належить побачити, наскільки дієвими виявляться зусилля Малєнкова."
 ORE.114.a: "Схоже, він неабиякий чарівник."
 ORE.114.b: "Ми цінуємо пропозицію, але допомоги не потребуємо."

 ORE.115.t: "Символічна підтримка"
 ORE.115.d: "Наступна стратегія Бурби для розбудови підтримки в Орєнбурзі - вирушити за межі самого Орєнбурґа й спробувати налагодити зв'язки з мешканцями прикордонних районів. Бурба вважає: якщо заручиться підтримкою прикордоння, його перемога стане беззаперечною навіть для таких людей, як Малєнков, не зможуть заперечити його перемогу. Та щойно Бурба покидає Орєнбурґ і починає переговори на околицях держави, Малєнков одразу починає діяти. Знову намагаючись підірвати кожну дію Бурби, він згуртовує власну підтримку новою кампанією очорнення новоспеченого лицеміра Бурби.\n\nМалєнков стверджує, що Бурба насправді анітрохи не дбає про прикордонні комуни чи взагалі про людей поза містами. Далі він каже: Бурба представляє лише міста, обіцяє полегшити їхнє життя й дати їм більше, приходить до прикордоння з порожніми солодкими обіцянками в обмін на допомогу в захопленні влади. Він радить окраїнам ігнорувати всі спроби Бурби зачарувати їх своєю справою, а сам присягається, що саме він убезпечить і схилити їх на свій бік. Значна частина підтримки обох кандидатів лежить поза містами, і тільки час покаже, чи повірять там словам бодай одного."
 ORE.115.a: "Бурба підкуповує секретаря Малєнкова."
 ORE.115.b: "Бурба заговорює прикордоння."
 ORE.115.c: "Бурба мовчить."

 ORE.116.t: "Хабар"
 ORE.116.d: "Під столом передали не так уже й багато грошей, принаймні за урядовими мірками. Може, лише кілька десятків тисяч. Досить, щоб виконати справу. Досить, щоб задовольнити старого секретаря. І воно напевно буде того варте.\n\nНаступного дня про це писала кожна газета й говорив кожен чоловік. Колективізація. Централізація. Повернення до тиранії комунізму й пошести СССР. Ніхто цього не потерпить. Ніхто не терпітиме нового Бухаріна чи Яґоду. Та Малєнков це зробив. Хай розмова була приватною, хай ідею лише розглядали, він вимовив ці страшні слова. Слова, від яких кожен старший за тридцять здригався, згадуючи минулі часи. Відступ на десятиліття назад не був великим походом уперед у майбутнє. У комунізмі немає поступу. Лише занедбані будівлі та брехня. Фасад Малєнкового «соціялізму для народу» було зірвано, і лишився тільки розбитий та гнилий фундамент. Зі старим комуністом було покінчено назавжди."
 ORE.116.a: "Хабарі лише показали народові правду."

 ORE.117.t: "Лайно."
 ORE.117.d: "Нашу шляхетну й невдячну працю з роз'яснення народові вад цього диявола Малєнкова викрито. Секретар, якому ми, можливо, підсунули невелику суму, публічно оголосив про таємну угоду. Народ лютує як ніколи. Керівник уряду, якому він довірив владу, зрадив довіру й показав людям іще більше того, що вони зневажають. Навіть Попри заперечення Бурби щодо хабарів - і водночас його вибачення за них - протести стрясають Орєнбурґ. Вони вимагають демократії та антикорупційних заходів. Ми покажемо їм демократію - відразу після того, як вони спалять Малєнкова. Гірше того, справді важливі новини про одержимість Малєнкова радикальною колективізацією проігнорували й навіть зустріли схвально!"
 ORE.117.a: "Там навіть не було так багато грошей!"

 ORE.118.t: "Промахи Бурби"
 ORE.118.d: "Останнім часом Бурба тяжко працює, щоб прихилити прикордонні комуни, сподіваючись здобути нову опору й уникнути напруження з витривалими селянами. Він надіслав посланців до багатьох комун і навіть спробував особисто відвідати кілька. На його лихо, схоже, бажання співпрацювати не взаємне: кожне містечко, до якого він залицяється, відмовляє.\n\nБурбі відмовили в зустрічі від самого початку, коли керівники крихітного села просто відмовилися з ним зустрічатися. Це задало тон усім подальшим спробам: кожна прикордонна громада, з якою він хотів поговорити, відмовила в зустрічі. Хоч би як він старався й що пропонував, вони наче твердо вирішили працювати проти нього. Вони ніколи не матимуть із ним справи, і, схоже, прибічників та союзників доведеться шукати деінде в союзі."
 ORE.118.a: "Наступного разу пощастить більше, Бурбо."

 ORE.119.t: "Третій варіянт"
 ORE.119.d: "Нескінченна низка ударів і контрударів Алєксандра Бурби та Ґєорґія Малєнкова змусила чимало реформістів відкинути обох і шукати власний шлях модернізації Орєнбурґа й перетворення його на те, чим він мав би стати. Вважаючи, що ідея єдиного голови вже показала свої вади в безжальній конкуренції двох реформістів, нова група реформаторів здобула значну підтримку в селах навколо Орєнбурґа.\n\nВони звернулися до старої західної ідеї регулярної зміни голів і виборів нового керівника через певні проміжки часу. Це переконання виникло майже з нічого: досі воно не мало ані прецеденту, ані підтримки серед реформістів, і тепер неабияк непокоїть Бурбу й Малєнкова. Для обох буде величезною ганьбою програти фракції, створеній їхнім власним суперництвом, а тепер їм у потилицю дихає третя сила, що зростає.\n\nСтановище стає ще критичнішим, бо Бурба використав економічний вплив і наказав запровадити торговельне ембарґо проти сіл. Люди побоюються, що без рішучих дій багато хто невдовзі почне голодувати."
 ORE.119.a: "Посилити ембарґо."
 ORE.119.b: "Перекроїти кордони сепаратистів."
 
 ORE.120.t: "Містечка відрізано"
 ORE.120.d: "Ті бунтівні містечка, які вирішили не виконувати наказів Орєнбурґа, отримали кошти від комуністичного диявола Малєнкова. Утім, його спроби принадити їх цілковито провалилися. Аґента Малєнкова спіймали, коли він потай залишав Орєнбурґ, прямуючи до одного з містечок із повною торбою готівки. Коли його перехопило ополчення лоялістів, що випадково проходило повз, чоловік розкусив капсулу з ціянідом і впав. Та торба грошей і лист, який він ніс, не зникли разом із ним: учора вранці їх оприлюднили. Документи докладно описували загравання Малєнкова із сепаратистськими комунами, містили численні натяки на корупцію серед впливових радників і навіть вплутували в скандал самого Бурбу. Торба готівки теж не допомогла його справі. Тепер громадськість лютує через Малєнкова. Принаймні з усієї дипломатичної катастрофи ми отримали бодай щось добре."
 ORE.120.a: "Де він, бляха, дістав ціанід!?"

 ORE.121.t: "Допомога від Малєнкова"
 ORE.121.d: "Як і боявся Бурба, хитрий Ґєорґій Малєнков зумів обійти його блокаду опозиційних містечок. Сподіваючись використати це проти Бурби й показати себе кращим вибором, Малєнков вирішив особисто спрямувати туди кошти. Він діяв потай, щоб уникнути викриття, і приніс допомогу містечкам, які нищила Бурбова облога. Ідеологія, спрямована проти обох політиків, передусім і завела їх у таке становище, та люди, які від початку підтримували Малєнкова, почали використовувати нагоду, щоб перетягти на свій бік третю фракцію, яка захопила владу в містечках.\n\nУ цьому Малєнков успішно переграв Бурбу, і його надія після цього залучити підтримку до свого блоку може здійснитися. Якщо відкинути ідеологію, Малєнков дуже допоміг мешканцям орєнбурзької глибинки, а задум Бурби може обернутися проти нього. Малєнков задоволений успіхом: третю групу він приваблює допомогою, а не інтригами."
 ORE.121.a: "Комуністичне фінансування, кажете?"

 ORE.122.t: "Успішна облога"
 ORE.122.d: "Задум Бурби змусити села його підтримати вдався. Торговельне ембарґо проти сіл навколо Орєнбурґа поставило тих, хто не бажав ані Бурби, ані Малєнкова, перед вибором: триматися ідеалів... або лишитися без найнеобхіднішого. Коли облога почалася, їхні переконання зміцнило те, що Бурба й Малєнков воліли плести проти них інтриги, а не примиритися. Та час минав, запаси виснажувалися, й ідеологія здавалася дедалі менш важливою. Прихильники Бурби в селах говорили все гучніше й благали старост підтримати Бурбу й покласти край торговельному ембарґо.\n\nЗрештою села здалися. Повна ізоляція глибинки, влаштована Бурбою, стала нестерпною для більшости мешканців. Бурба тішився успіхом задуму, який не дав Малєнкову часу обернути події на свою користь. Тепер в обмін на вірність і підтримку його імени Бурба знову дозволить селам торгувати з Орєнбурґом. Схоже, заради справи реформ Бурба не готовий іти на жодні компроміси."
 ORE.122.a: "Претензії Бурби просуваються далі."

 ORE.123.t: "Без їжі, без припасів"
 ORE.123.d: "Повне ембарґо Бурби проти сіл навколо Орєнбурґа щодня погіршує їхнє становище, та остання схема Малєнкова з перетягування їх на свій бік загострила їхні проблеми настільки, що села зрештою скорилися Малєнкову. У відповідь на тривале ембарґо й послаблення сіл Малєнков вирішив раптово перекроїти кордони комун. Звісно, після нового поділу села несподівано втратили всі сільськогосподарські землі.\n\nХитрість Малєнкова була нищівною: позбавлення низки селянських сіл їхніх угідь цілковито підірвало їхнє господарство. Усе, що міг зробити Бурба, крім убивства, раптом здавалося дрібницею проти Малєнкового відбирання всього, чим вони жили. Напруження в селах стрімко зросло. Ті, хто не підтримував нікого, найгучніше заявляли про свою правоту, але найтихіше говорили про план дій. Прибічники Малєнкова раптом із новою силою почали благати сільських керівників підтримати його й припинити самим карати себе.\n\nТак сільські керівники присягнули на підтримку Малєнкову, а той несподівано помітив кілька прикрих помилок у перекроєних кордонах. В обмін на підтримку своїх претензій Малєнков докладе тяжких зусиль і поверне селянам угіддя. Бурбі лишалося тільки нишком лаятися, поки вся низка сіл присягала на підтримку Малєнкову."
 ORE.123.a: "Малєнков підкрадається ближче до Орєнбурґа."

 ORE.124.t: "Промова Бурби"
 ORE.124.d: ""Товариші! Громадяни! Сьогодні я звертаюся до вас, щоб поговорити про численні лиха останніх часів, адже наша невпевненість і нерішучість спричинили багато чвар та розколу серед народу. Я не знаю імени кожного з вас, не знаю вашої щоденної праці, ваших родин і життів. Та одне я знаю: народ Орєнбурґа й комун заслуговує на краще! Їхні труднощі не мають бути марними через недієздатний уряд, ледве спроможний забезпечувати людей! У ці тяжкі часи може кортіти повірити обіцянкам демагогів, які викликають привиди старих ідеологій і лише розпалюють нове насильство. Я кажу: не слід будувати державу на ідеологіях, порожніх обіцянках і туманних ідеалах - її треба будувати для народу, працею народу!"\n\nБурба ненадовго замовкає, приймаючи гучні оплески. Він вдихає й продовжує промову.\n\n"Наше велике місто є домом багатьох людей, здатних привести народ до добробуту й миру. Тут живуть інженери, техніки, промисловці й науковці, які все життя працювали, думаючи лише про добро Орєнбурґа та його громадян. То чому ми дозволяємо клікам політиків керувати урядом або марнуємо час у нескінченних засіданнях, де нічого не досягається? Щоб створити стабільне й заможне майбутнє, мусимо довіритися найкращим і найрозумнішим серед нас, які поведуть нас у нову добу. Світло нашого міста сяятиме дедалі яскравіше, й незабаром нам заздритиме вся Росія!""
 ORE.124.a: "Він приведе нас до слави - влаштуймо переворот!"
 ORE.124.b: "Він і справді звучить переконливо."

 ORE.125.t: "Бурбу заарештовано!"
 ORE.125.d: "Трагічні новини! Остання промова Бурби спричинила заворушення й сутички в місті, які зрештою переросли в повномасштабний бунт. Прихильники Бурби билися з комуністами Малєнкова та цілими натовпами цивільних, які виступали проти обох політиків, і все виродилося у величезну тристоронню бійку на вулицях усього Орєнбурґа. Схоже, Алєксандр Бурба спробував скористатися сум'яттям і перебрати повну владу над урядом, наказавши найнадійнішим прихильникам штурмувати палац, де засідає Робітнича рада.\n\nУ подальшій колотнечі місцеві ополчення комун і міська варта застали Бурбу та його людей зненацька, загнали в провулок і масово заарештували. Хоча багатьох наступного дня відпустили через переповнення єдиної орєнбурзької в'язниці, репутацію Бурби зруйновано, а його політична кар'єра, здається, скінчилася. Тим часом лівий табір Малєнкова проголошує перемогу: він стверджує, що заздалегідь знав про переворот Бурби й діяв в інтересах народу Орєнбурґа, щоб покласти край його «реакційному фашистському божевіллю».\n\nДехто не довіряє радикальному марксисту, але багато членів Ради, схоже, вважають цей опис подій точним. Навіть сільське селянство підтримало Малєнкова за те, що він негайно зупинив спробу правих захопити владу."
 ORE.125.a: "Хто міг це передбачити?"

 ORE.126.t: "Опозиція за плату"
 ORE.126.d: "Ґєорґій Малєнков вирішив протистояти зростанню впливу Бурби, щедро винагородивши кількох ключових людей за розпалювання лютого бунту просто в центрі Орєнбурґа. Малєнков обрав одного чоловіка, пристрасного промовця й палкого підбурювача, щоб той пройшов містом і зібрав усіх противників ідей Бурби. Йому наказали публічно заявити про їхнє невдоволення, а Малєнков подбав, щоб вони знали: можна робити що завгодно, якщо це зменшить підтримку ненависного Алєксандра Бурби.\n\nКерівник страйку відпрацював свої гроші й зібрав доволі великий натовп, який із криками та бійками пробився до центру Орєнбурґа. Вони вже жбурляють цеглу й зі злобою вигукують ім'я Бурби. Якщо заворушення триватиме, воно стане болісною ганьбою для промислового магната. А коли все скінчиться, Малєнков неодмінно зможе натякнути, що в його ім'я жодного бунту не спалахнуло. Тож він чекає новин із Орєнбурґа й сподівається, що вони зміцнять його позиції."
 ORE.126.a: "Надішліть ополчення!"
 ORE.126.b: "Перечекаймо!"

 ORE.127.t: "Непрохані гості на бунті"
 ORE.127.d: "Марну спробу Малєнкова протистояти зростанню впливу Алєксандра Бурби придушено. Бурба скористався дедалі більшим впливом в Орєнбурзі й наказав місцевим командирам ополчень покласти край бунтові. Командири послухалися, і підрозділи швидко вирушили припиняти заворушення. Нещасливий протест не витримав раптової появи війська й швидко розсіявся. У хаосі ополченці вистежили й схопили чоловіка, якому Малєнков заплатив за розпалення напруження та початок бунту.\n\nКоли ватажка привели до нього, перед Бурбою постало цікаве питання: що з ним робити? Він бачить два однаково розумні варіянти. Можна помилувати бунтівника, і це сприймуть як жест солідарности та співпраці серед народу. З іншого боку, ватажок може далі розпалювати напруження. Або ж Бурба може наказати заборонити йому та його людям політичну діяльність, усунувши підбурювача зі списку загроз і водночас зміцнивши власні позиції. Звісно, таке рішення можуть вважати тиранічним і непопулярним. Бурба розмірковує над проблемою й зрештою вирішує..."
 ORE.127.a: "Помилувати ватажка бунту."
 ORE.127.b: "Заборонити цьому головорізові політику."

 ORE.128.t: "Добрий до друзів, добріший до ворогів"
 ORE.128.d: "Обміркувавши становище розгромленого бунту та його ватажка, Бурба вирішив, що найкраще буде показати добру волю й помилувати чоловіка - звісно, перед очима всіх. Бурба неодмінно звернувся до присутніх і сказав, що не переслідуватиме тих, хто вважає за потрібне протестувати, а його опозиція не має чого боятися, якщо - ні, коли - він прийде до влади. Ватажок, радше байдужий до всього, гаряче дякував Бурбі, що той не ув'язнив його за те, що для самого чоловіка було лише добре оплачуваною роботою. Найбільше побоювання Бурби щодо цього помилування виявилося цілком безпідставним: бунтівника спонукали гроші, а не справжні політичні переконання.\n\nНатомість задум Бурби здійснюється точно за планом. Його підтримка помітно зросла: багато людей усвідомили, що під таким керівництвом їм нема чого боятися, й водночас повірили в обіцянки централізації та модернізації Орєнбурґа. Народ Орєнбурґа навчиться співпрацювати й працювати разом під проводом Алєксандра Бурби - справжнього об'єднувача народу, який править лагідною, але твердою рукою."
 ORE.128.a: "Справедливе керівництво."

 ORE.129.t: "Загасити підбурювача"
 ORE.129.d: "Бурба вирішив, що долю ватажка орєнбурзького бунту треба визначити твердо й рішуче. Він з'явився перед затриманим у Орєнбурзі, щоб покарати його за цей вибрик, й наказав вивести схопленого чоловіка на люди для оголошення вироку. Перед усім Орєнбурґом Бурба оголосив: керівникові страйку та всім причетним безстроково заборонено політичну діяльність. Вони більше не матимуть права голосу у визначенні майбутнього держави й відтепер не допускатимуться на засідання Ради.\n\nВатажок страйку був просто радий, що не зазнав суворішого покарання, й досі тримав гроші від Малєнкова. Він без заперечень прийняв вирок, а Бурба був задоволений, що усунув потенційне знаряддя з рук своїх передвиборних противників. Коли стількох людей, згуртованих проти нього, раптом усунули з політичного життя, підтримка Бурбових програм централізації та індустріялізації почала зростати. Важко було сказати, чи це лише наслідок зникнення частини опозиції, чи сила Бурби почала прихиляти народ Орєнбурґа. Хай там як, це була перемога Бурби."
 ORE.129.a: "За такі вибрики треба карати."

 ORE.130.t: "Рада палає"
 ORE.130.d: "Оплачений Малєнковим бунт набув катастрофічного обороту! Він мав зганьбити Бурбу, але ганьба стала національною, бо бунтівники спалили будівлю Ради! Вражений жахливою звісткою, Малєнков хапається за голову, а Бурба проклинає свою неспроможність зупинити заворушення на початку. Ватажки, очевидно, виконали роботу надто добре й зібрали натовп, настільки буйний, що його годі було й намагатися контролювати. Поки люди йшли вулицею, протестуючи проти промислових ідей Бурби та його прихильности до централізації, один учасник почав натякати, що саме Рада є найвищим символом централізації. Противники централізації підтримали його криками, й усе скінчилося ревучим полум'ям, яке поглинуло будівлю.\n\nТепер приголомшене місто Орєнбурґ дивиться з жахом і соромом. Після підпалу будівлі бунт швидко розсіявся: ніхто не хотів суворого переслідування за знищення ключової урядової споруди. Громадяни не знають, кого винуватити, адже протест був спрямований проти Бурби... але саме вплив Малєнкова привів людей сюди. Шок і жах Орєнбурґа ось-ось обернуться проти одного з двох кандидатів."
 ORE.130.a: "Це почалося через ідеї Бурби!"
 ORE.130.b: "Це влаштував Малєнков!"

 ORE.131.t: "Малєнков іде походом!"
 ORE.131.d: "На світанку багато комун Орєнбурґа відокремилися й почали переговори з представниками Ліги. У відповідь Малєнков вирішив діяти. Він оголосив, що нинішня адміністрація Орєнбурґа неспроможна впоратися з кризою, а тому сам перебирає безпосереднє командування ополченнями. Малєнков уже збирає сили, досі вірні Робітничій раді. Сама Рада не змогла зробити нічого, крім нарікань на зростання його впливу. Багато людей у комунах засудили цей крок, порівнюючи похід Малєнкова з руйнівним походом Наполеона. Проте дехто погоджується з ним і вважає, що це необхідно для захисту Орєнбурґа від зовнішнього впливу. Хай хто як до цього ставиться, Орєнбурґ стоїть на роздоріжжі."
 ORE.131.a: "Розчавімо цих зрадників!"

 ORE.132.t: "Миттєве захоплення"
 ORE.132.d: "Малєнков знав: щоб об'єднати Орєнбурґ, треба зробити містечка залежнішими від нього, змусити більше на нього покладатися й охочіше визнати потребу єдности під центральним керівником. Тому він узяв усі містечка на своє утримання, а невдовзі оголосив про намір стати головою. Усі містечка, що отримували від нього підтримку, передали йому своє автономне керівництво. Їхня покора зробила Малєнкова безперечним фаворитом у боротьбі за посаду голови й тим, хто поведе комуну в нове майбутнє."
 ORE.132.a: "Це безперечно лякає."

 ORE.151.t: "Втеча"
 ORE.151.d: "Усе почалося весняного дня. А може, значно раніше - у думках молодої жінки. Коли над головою летіли бомбардувальники, вона ховалася в старому погребі від бурі, тулилася в кутку, поки згори сипалися дощ і бомби.\n\nСаме там вона зустріла свою Свєтлану, яка переховувалася від люті Люфтваффе. Вона пам'ятала тепло, яким вони ділилися в тому старому погребі, спершу лише тому, що так було легше пережити небезпеку. Тихі, сповнені сліз розмови, які вони намагалися підтримувати, поки саме Пекло відвідувало поверхню над ними.\n\nМинали тижні, час розпливався, а бомбардування сягнули угідь; вона зробила це звичкою. Ховатися від світу разом із новою подругою. Обіймати її, поки вогонь обпікав землю, а уламки боєприпасів засівали її.\n\nЗрештою вона зрозуміла: це стало чимось більшим. Старий погріб і жінка, яку вона вважала подругою, були вже не останнім прихистком, а тим, чого вона сама шукала. У ті ночі вони лежали на степовій траві: вона клала голову на груди Свєтлани й дивилася на чисті зорі над ними.\n\nПерший поцілунок у м'якому місячному світлі вона пам'ятатиме вічно. Він дарував відчуття цілісности, коли зорі згори виблискували в очах жінки, яка тепер була її коханою.\n\nА тоді це сталося. Крики, власний батько, що хапається за хрест і закликає Божий гнів на її голову. Коли вона бігла, тримаючись за руку своєї Свєтлани, то жодного разу не озирнулася."
 ORE.151.a: "Попереду Орєнбурґ. Позаду... спогад."

 ORE.152.t: "Незвичні біженки"
 ORE.152.d: "Удосвіта в місті Орєнбурзі стався вкрай цікавий випадок пошуку притулку: до міста ввійшли дві молоді жінки, маючи лише невелику торбу речей. За встановленою процедурою їх тимчасово затримали як біженок, щоб згодом поселити й інтегрувати. Та через дві години слідом прийшли троє ополченців комуни й зажадали арешту пари.\n\nПісля напруженого протистояння, під час якого міські ополченці Орєнбурґа вимагали від селян обґрунтувати арешт, відкрилася правда. Двох жінок хотіли схопити й судити за злочин проти природи - себто за романтичні стосунки між собою.\n\nПеред Радою постала цікава дилема: ідеали свободи, які ми нібито обстоюємо, зіткнулися з традиційною мораллю селянства. Питання вже винесли на Раду, і вона, схоже, розкололася. Сільські комуни здіймають страшенний галас через це «порушення природного порядку», тоді як реформістська фракція бачить у цьому питання особистої свободи.\n\nДві втікачки сидять на місці свідків і тримаються за руки, щоб не втратити сили. Схоже, їхню долю вирішить слово Робітничої ради."
 ORE.152.a: "Віднині ми змінимо стару традицію..."
 ORE.152.b: "Віддайте їх. Це марнування часу."

 ORE.153.t: "Життя й кохання"
 ORE.153.d: "Так вона вийшла на волю, далеко від гніву селянства.\n\nМісто було незнайомим: дивна суміш сучасних багатоквартирних будинків і старих крамниць та осель із похилими дахами. Дорогою до власного житла на околиці міста, що стрімко росло, вони обережно не трималися за руки. Хоч слухання скінчилося на їхню користь, ставлення містян лишалося невідомим.\n\nЛише переступивши поріг і зачинивши двері, вона змогла обернутися й зазирнути в прекрасні блакитні очі своєї Свєтлани, яка разом із нею без вагань витримала суд Ради. Здавалося, навколо коханої сяяла переможна авра, і вона була певна, що Свєтлана бачить таке саме сяйво навколо неї.\n\nВони впали на єдиний диван у запорошеній вітальні, й вона відчула, як рука Свєтлани перебирає її волосся, заспокоюючи нерви краще за будь-які міські ліки.\n\nНадана комуною квартира була маленька й тісна: одна спальня та вітальня, вщерть забита потертим диваном і порожньою книжковою полицею. Стільницю вкривав густий шар пилу. Та поки вона була тут разом із коханою, це було все, що їй потрібно.\n\nНарешті вони були вільні й разом.\n\nІ в серці вона знала: лише це має значення."
 ORE.153.a: "І так почнеться життя."

 ORE.154.t: "Разом до кінця"
 ORE.154.d: "Вони тулилися одна до одної в кутку сінника покинутого селянського будинку. Ззовні долинали крики чоловіків, яких село послало за нею та коханою; ополченці закликали Бога покарати її за «диявольщину».\n\nНа первіснішому рівні вони шукали прихистку й утішали себе думкою: можливо, якщо вони не бачать ополченців, то й ті не зможуть вистежити їх після її втечі з їхніх рук.\n\nТа розумом вона знала, що це неправда. Так чи інакше кохану в неї заберуть - смертю або насильницькою розлукою. Тож вона лише лежала, поклавши підборіддя на голову Свєтлани, поки кохана плакала їй у груди.\n\nВони наближалися. Чоботи вже ступали ґанком, і вона знала, що часу майже немає, але не могла змусити себе рухатися. Коли двері почали відчинятися, вона міцніше обійняла кохану жінку й заплющила очі.\n\nПеред нею промайнули видіння життя, яке в них украли: перша таємна зустріч, перший спільний поцілунок, захват від утечі до міста в надії знайти свободу. Це нагадало їй першу ніч... бомби й бурю. Те життя зникло... як сльоза на дощі.\n\nПостріл відлунив селянським будинком.\n\nА потім не стало нічого."
 ORE.154.a: "Dona eis requiem."

 ORE.155.t: "Новіший Орєнбурґ"
 ORE.155.d: "На столи Робітничої ради надійшов цікавий звіт. За нашим примітивним переписом, зросла імміграція, але не з Уралу, а із сільських комун. Розслідування виявило причину: звістка про результат конфлікту між Свєтланою Орловою, Аннушкою Соколовою та кількома членами ополчення їхнього села поширилася назовні через звичну мережу сільських чуток, що оживає всюди, де збираються селяни заповнюють якийсь простір.\n\nВідтоді як новина про рішення розійшлася, люди, яким не раді в традиціоналістських сільських комунах, тяжіють до міста Орєнбурґа.\n\nЗвісно, як завжди в таких випадках, це не допомогло нашій репутації серед селянських сіл. Деякі тепер називають нас «ямою буржуазної моралі», «гніздом декадансу» та іншими чарівними епітетами. До Ради вже надіслали кілька делегацій, щоб переконати її змінити рішення. Деякі вже виступили перед нами й засудили Раду за те, що наші «вироджені цінності» «тягнуть усю Комуну на дно». Поки що це не становить справжньої загрози, адже все більш-менш відповідає стандартній процедурі, але за гнівом селян треба стежити, щоб він не перекинувся на інші питання."
 ORE.155.a: "Маяк у пустках. Поки що."

 ORE.156.t: "Протистояння"
 ORE.156.d: "Нарешті це сталося. Неминуче протистояння між Містом і Комунами через те, що місто Орєнбурґ стало безпечним прихистком для людей, яких у сільській місцевості вважають небажаними.\n\nПитання порушили сьогодні вранці майже одностайним голосуванням західних комун. Вони оголосили, що Орєнбурґ став тягарем для ідилічної аграрної моралі Комуни, і вимагають скасувати захід, ухвалений майже пів року тому в суперечці Свєтлани Орлової та Аннушки Соколової проти ополчення комуни Абрамовка.\n\nВідразу почалася гаряча дискусія: законодавці сперечалися про ймовірність відвертих самосудів, втручання в межі інших комун, перевищення містом повноважень, «буржуазну мораль» і довжелезний перелік скарг. Та загальний зміст був ясний. Селянські комуни не бажали терпіти, що місто Орєнбурґ дає безпечний прихисток тим, кого вони вважають виродженцями й злочинцями.\n\nРеформістська фракція здійняла галас і заявила, що Орєнбурґ має не менше права самостійно вирішувати, що відбувається в його межах, ніж будь-яка селянська комуна. Але майбутнє поки непевне. Проти нас зібралася велика група, і політичний капітал, потрібний для захисту права людей, яких місто Орєнбурґ віднедавна взяло під захист, може коштувати більше, ніж ми здатні заплатити..."
 ORE.156.a: "Ніколи! Те, що відбувається в наших межах, стосується тільки нас!"
 ORE.156.b: "Мусимо поступитися."

 ORE.1561.t: "Кохання триває"
 ORE.1561.d: "Коли здалеку, через газету й громадське радіо, надійшла звістка про рішення Ради, вона полегшено зітхнула й витерла сльозу з ока.\n\nПоряд лежала Свєтлана, сховавши голову під її підборіддям. Вона відчувала, як сльози коханої течуть і збираються на її шкірі - сльози полегшення й радости. Чергову спробу селянства повернути їх назад було відбито, а Орєнбурґ виправдав надії, з якими вони сюди вирушали.\n\nВона сподівалася, що більше не доведеться боятися, тепер, коли чергова спроба селянства повернути її до застійного села провалилася. Не доведеться боятися, що її схоплять на вулиці ополченці без розпізнавальних знаків, чи повертатися додому зі страхом, що Свєтлани там уже не буде. Ні, нарешті можна дихати вільно.\n\nВона так і зробила: зітхнула, поки напруга, яка терзала тіло, почала розсіюватися. Можливо, тепер їхні обійми знову стануть проявом близькости й ніжности, а не захисною хваткою.\n\nНарешті безпека. Відчуваючи тепло коханої поруч, вона прошепотіла те, що могла почути лише Свєтлана.\n\n"Дякую"."
 ORE.1561.a: "І воно житиме вічно."

 ORE.1562.t: "Сірий обрій"
 ORE.1562.d: "Озираючись назад із порожнього ліжка, вона майже знала точну секунду, коли місто її зрадило.\n\nСтавлення людей змінилося наче в одну мить: блаженне невігластво й байдужі порожні погляди поступилися підозрі й страху. Вона присягалася, що відчуває це щоразу, виходячи на люди й озираючись, наче розшукувана злочинниця, яка щомиті чекає побачити поліцію.\n\nЗрештою, тепер вона саме нею й була. Будь-якої миті за нею могли прийти й заарештувати за злочин, скоєний у рідній Абрамовці. Кожен перехожий у вовняному одязі міг бути торговцем чи ополченцем із того проклятого місця, який прийшов забрати її назад і поставити перед їхнім клятим «народним трибуналом».\n\nЦей всепроникний страх охопив і все, що стосувалося Свєтлани. Вона ледве витримувала, коли кохана бодай ненадовго зникала з поля зору, знаючи, що єдиного захисту більше немає. Чи таким буде її майбутнє? Стати відлюдницею, ховатися від людей, які мали б її захищати, зрадженою тими, хто колись дав стільки надії?\n\nВона не знала. Серед такої непевности й страху лишалося тільки берегти кохану й сподіватися.\n\nБо надія була єдиним, що в неї ще лишилося."
 ORE.1562.a: "Знову в облозі."

 ORE.1563.t: "Згасання"
 ORE.1563.d: "Щойно Свєтлана повернулася до квартири, яку ділила з коханою, то зрозуміла: сталося щось страшне.\n\nШафи були відчинені, аркуш паперу збито на підлогу, а в стіні лишилася вм'ятина від удару ліктя чи коліна. Брудні чоботи, яких Аннушка ніколи б не взула, пошрамували потертий килимок, куплений для прикрашання маленької вітальні.\n\nЇй знадобилася мить, щоб усвідомити весь жах, поки вона несамовито кликала кохану на ім'я й дико озиралася.\n\nНі. Цього не може бути.\n\nЇї забрали, ті чоловіки із села. Іншого пояснення не було. Вони потягли кохану жінку до свого гнилого села, щоб судити за злочин - сміливість її кохати. Аннушка... зникла. Свєтлана так і не зможе попрощатися як слід: не буде ані останніх слів, ані останнього поцілунку. Лише дірка в стіні позначала її певну загибель.\n\nМинали дні. Вона механічно йшла працювати до крамниць, поверталася поїсти й спала сама в ліжку, яке ніколи не призначалося для однієї.\n\nА тоді її вразило. Наступна стадія горя, новий крок у жахові, який її поглинув. Тут для неї нічого не лишилося, але, можливо, вона могла лишити слід деінде.\n\nВона стиснула маленький пістолет, придбаний для самозахисту. Це буде за Аннушку."
 ORE.1563.a: "Немає люті страшнішої..."
 ORE.1563.b: "Знайти краще місце."

 ORE.1564.t: "Убивство в Абрамовці!"
 ORE.1564.d: "До міста Орєнбурґа надійшла звістка про вбивство члена ополчення комуни в містечку Абрамовка неподалік від Орєнбурґа. Точно невідомо, що сталося, але нинішні звіти кажуть: ополченець Сєрґєй Іванов потрапив у засідку озброєного бандита дорогою від арсеналу ополчення до свого будинку в центрі містечка.\n\nІз малокаліберного цивільного пістолета зробили два постріли: один у груди, другий у плече. Не зумівши приборкати нападника, він за кілька хвилин помер від утрати крови. Родина вимагає правосуддя над «божевільним бандитом», який у нього стріляв, а в селі триває полювання.\n\nСвідчення суперечливі: дехто описує нападника як жінку в селянському одязі, інші присягаються, що це міг бути хто завгодно - від бандита Бригади Дірлеванґера до вільного від служби уральського гвардійця. Як завжди, чутки, схоже, значно затьмарять правду."
 ORE.1564.a: "Прикро."

 ORE.1565.t: "На північ"
 ORE.1565.d: "Так вона втекла з місця подій, не маючи нічого, крім одягу на собі, маленької торби й пістолета.\n\nДорога була тяжкою, повітря довкола холодним, поки вона втікала з міста, яке колись вважала притулком. Та вона зміцнила дух, знаючи, що земля, якої шукає, буде ще суворішою.\n\nГодини ставали днями, вона проходила незліченні селянські села й нескінченні хлібні поля. Пасовища тягнулися до обрію, поки вона знову долала аграрну пустку, з якої так давно втекла.\n\nАннушка. Ім'я відлунювало в думках і гнало її на сувору північ. Коханої не стало, й кожною кісткою вона прагнула повернутися на захід і помститися вбивцям-виродкам, які її забрали. Та знала: це не її шлях. Її шлях був чимось більшим, цілковито поза Орєнбурґом. У цій пласкій, убогій глушині, обмазаній зеленню й ненавистю, нічого не лишилося. Ні, її майбутнє було деінде.\n\nПісля понад тижня дороги, коли рівнини стали пагорбами, а шлях - стежкою над урвищем, вона знайшла його. Попереду стіни ҐУЛАҐу здіймалися до неба, а прожектори сяяли, наче Сонце. Стискаючи принесений пістолет, вона підійшла до чоловіка в однострої, який охороняв браму.\n\n«Товаришу гвардійцю, я прийшла до вас приєднатися»."
 ORE.1565.a: "Ліга чекає."

 ORE.1566.t: "Параноя"
 ORE.1566.d: "Минули тижні, й обидві почали відчувати тягар народних поглядів. Вона навчилася повертатися з роботи в крамницях короткою дорогою, а не мальовничою, щоб зменшити ризик викрадення з вулиці. Свєтлана почала виставляти у єдиному вікні кольорову тканину, коли шлях був чистий.\n\nОрєнбурґ, колись притулок, став майже сюрреалістичним кошмаром, повторенням таємности, до якої їх примушували в Абрамовці. Вони більше не почувалися безпечно на вулиці як розшукувані злочинниці; більше не могли вірити, що сусіди не продадуть їх за рубель чи буханець хліба.\n\nСтрах і напруження почали виснажувати обох. Свєтлана приходила до її ліжка дедалі пізніше, а втіха в обіймах коханої ставала дедалі коротшою. Вона вже не могла ховатися разом із нею: боялася, що жінка, яку так сильно кохає, стає символом долі, яка чекає за один неправильний крок.\n\nОдного разу вони говорили про це при згасаючій свічці у вітальні. Слова були гіркими, а з кожною фразою протягом вечора кімната наче холоднішала. Холодний страх обвивав зв'язок, який тримав їх разом, і вона вже не була певна, що він не розіб'ється."
 ORE.1566.a: "Невже кінець близько?"

 ORE.157.t: "Гіркий потік"
 ORE.157.d: "Надходять тривожні звістки з південної комуни, де група товариша Бурби нещодавно допомогла запустити нову фабрику. Мешканці комуни заробляють на життя, випасаючи череди худоби на кам'янистому ґрунті, і звинувачують нову фабрику в тому, що вона скидає токсичний шлам у річку вище за течією. Іншого доброго водопою для худоби немає, тож село боїться дедалі ширшого поширення хвороб серед тварин.\n\nНаразі про масштаб проблеми відомо мало. Це поганий знак для наших союзників-промисловців із централізаторської фракції. Якщо їхні спроби запустити нові осередки промислового виробництва поза містом Орєнбурґом наштовхнуться на опір місцевих селян, наслідки можуть бути катастрофічними.\n\nЩойно селяни й промисловці зможуть надіслати своїх представників, буде скликано надзвичайне засідання Ради. Кількох екологічних фахівців з міста Орєнбурґа відряджено оцінити масштаб збитків. Поки до спеціального засідання не надійде вся інформація, ми нічого не можемо зробити."
 ORE.157.a: "Як ми взагалі забули перевірити комуни нижче за течією?"

 ORE.158.t: "Нова фабрика загрожує існуванню комуни"
 ORE.158.d: "Дані надійшли, і становище видається жахливим. Якщо не закрити нову фабрику, невелика комуна скотарів, імовірно, втратить усе поголів'я.\n\nПредставник комуни, елегантно вбраний молодий чоловік, прибув до Робітничої ради й виголосив палку промову про порятунок свого села. «Як Робітнича рада може стверджувати, що представляє громадян Орєнбурґа, якщо дозволяє потребам промисловців труїти цілі громади?» - запитав він слухачів у своєму пристрасному виступі.\n\nНаступним виступив товариш Бурба. Спокійна й зважена промова інженера на захист промислового підприємства була не менш красномовною. Кілька збіднілих селян і біженців з міста Орєнбурґа дістали змогу працювати на фабриці й годувати свою громаду. Виготовлені там сільськогосподарські матеріали можна розподіляти по всьому Орєнбурґу, допомагаючи дрібним селянам дбати про землю. Так, біда села прикра, і його мешканцям треба допомогти в ці тяжкі часи. Та поступу не спинити.\n\nУ промові Бурби не прозвучали політичні наслідки поступки маленькій комуні для наших зусиль із централізації Орєнбурґа. Агенти централізаторської фракції донесли цю думку прихильним радникам, сподіваючись допомогти їм ухвалити «правильне» рішення."
 ORE.158.a: "Фабрика мусить працювати далі."
 ORE.158.b: "Орєнбурґ не можна будувати на трупах його сіл!"

 ORE.159.t: "Кістниця"
 ORE.159.d: "Хлопець цілий день ішов назад до старого села, шукаючи забуті дрібнички. У дорозі його супроводжували лише шум вітру й води, та від жодного з них юнакові не було користи. Холодний вітер кусав оголену шкіру, а отруєна річкова вода ніби знущалася з нього всю дорогу.\n\nСело стояло безмовне: всіх мешканців переселили вище за течією, ближче до проклятої фабрики товариша Бурби. Промисловець не дав селянам голодувати: чоловікам запропонували добру роботу в промисловому містечку, що швидко зростало, а жінки обробляли нові ділянки землі, щоб годувати родини. Молодь тепер могла ходити до школи й вивчати найрізноманітніші предмети. Але для самотнього хлопця ніщо з цього не було того варте. Він тужив за минулими днями, коли вітер складав йому компанію на рівнинах серед тварин, а річка тамувала спрагу худоби.\n\nУсі сільські хати стояли покинуті. Рештки зниклої громади. А на рівнині лежали кістки тварин, отруєних новим майбутнім Орєнбурґа."
 ORE.159.a: "Прогрес, але якою ціною?"

 ORE.1600.t: "Угода зі скотарями"
 ORE.1600.d: "Алєксандр Бурба, попри всі свої вади, людина прагматична. Побачивши, що Робітнича рада не дозволить його фабриці знищити комуну, реформатор негайно взявся до справи. Невдовзі представникові скотарів і Раді запропонували нову, прийнятнішу угоду. Якщо навесні й улітку, коли худобу виганяють на пасовища, знизити виробництво фабрики, забруднення річки можна втримати нижче небезпечного рівня. Фахівці промисловця вже старанно вивчають потреби постраждалої комуни у воді й шукають місця, де можна пробурити нові свердловини до водоносного горизонту.\n\nЦе зміцнило репутацію Бурби як людини, здатної на компроміс і співчуття, але майже не похитнуло думки, що майбутні плани індустріялізації мають ураховувати потреби кожної комуни. Численні промислові проєкти централізаторських фракцій тепер призупинено до завершення оцінювання впливу на довкілля.\n\nНа рівнині худоба комуни почала одужувати. Селянам залишається лише сподіватися, що нові джерела води спорудять швидко."
 ORE.1600.a: "Політика - мистецтво можливого."

 ORE.161.t: "Світліше майбутнє завдяки електричному освітленню?"
 ORE.161.d: "Старі майстри й недосвідчені молоді техніки, що обслуговують ветху електромережу міста Орєнбурґа, дбайливо підтримує в роботі сукупність електростанцій, ліній електропередачі й перетворювальних станцій. Без фабрик майже немає де виготовляти нові складники. Тому доглядачам системи лишається тільки давати раду неухильному спаду виробництва електроенергії.\n\nОднак сьогодні сталося несподіване: у всій системі раптом стався стрибок напруги! Приголомшені інженери швидко перенаправили надлишкову енергію, щоб уберегти крихку інфраструктуру, а одного техніка послали повідомити міських промислових фахівців. Звістка швидко пішла нагору до Бурби, Малєнкова та інших членів фракції централізації й індустріялізації в Раді. Коли підтвердилося, що енергії справді стало більше, ніж звичайно, кількох вершників відрядили дослідити околиці.\n\nПоки джерело нової енергії невідоме, міським технічним фахівцям залишається чекати й гадати. Може, стару електростанцію ДРЕС повернули до життя заповзятливі селяни? Чи незвично рясні опади збільшили виробіток західної гідроелектростанції? А може, десь обірвалася лінія, і більше струму потекло до міста Орєнбурґа? Відповідь дасть лише час. А поки що наші громадяни можуть насолодитися дивовижною розкішшю - читати ввечері при електричному світлі."
 ORE.161.a: "Нехай інженери припинять робити ставки й повертаються до роботи."

 ORE.162.t: "Нове життя старої електростанції?"
 ORE.162.d: "Звіти надійшли! Невелику теплоелектростанцію на північний захід від міста Орєнбурґа частково полагодила купка підприємливих селян із сусідньої комуни. Усе почалося з того, що місцевий хлопчина, досліджуючи занедбану споруду, впав у калюжу застояної води. Побивши нащадка за те, що той поліз у таке небезпечне місце, батько хлопця сам оглянув будівлю. Чоловік пригадав невиразні пояснення двоюрідного брата про роботу станції, коли її щойно звели перед війною. Найбільша проблема, як здогадався наш герой, полягала в тому, що вся ця вода мала лишатися в трубах, а не на підлозі. Полатавши водогін, він із односельцями знову розпалив піч і підкинув туди біомаси.\n\nСтоличних інженерів-електриків ця історія водночас розважила й нажахала перспективою залишити купку селян керувати важливим зразком довоєнної техніки. Та послані нами люди категорично заявляють: горді селяни наполягають, що чудово впораються зі станцією самотужки. Вони також нагадали нашим людям, що ми не звертали на крихітну електростанцію жодної уваги, доки її не полагодили. Наші пояснення, що ми просто забули про саме її існування, пропустили повз вуха.\n\nДеякі більш... гарячі голови в міській раді Орєнбурґа запропонували просто відсунути селян і доручити справу дорослим. Але в Робітничій раді такий крок не здобуде популярности. І точно не поліпшить репутації міста Орєнбурґа як збіговиська жадібних придурків."
 ORE.162.a: "Перебрати станцію під свій контроль."
 ORE.162.b: "Нехай тішаться."

 ORE.410.t: "Нестача харчів у містах!"
 ORE.410.d: "Цього тижня черги за пайками довгі. Не те щоб черги не були щорічною проблемою суспільства, яким керують соціялістичні приписи й неповороткі виробничі ланцюги, але для цієї пори року черги по їжу ненормально великі. Кілька торговців і робітників помічають дивину, але швидко відмахуються від неї, гадаючи, що це лише збій у Селянській ґільдії чи транспортна проблема. Мало хто з радників це помічає, а ще менше переймаються тим, що не належить до їхньої прямої юрисдикції й не наповнює їхні кишені. Мляві заходи пропонують, чемно вислуховують і відкладають.\n\nСпершу в одній черзі, потім в іншій час очікування розтягується до безумства: пів години, дві години, шість годин, день, два дні. Натовп непокоїться й вимагає відповідей від спітнілих бюрократів, але тим нічого сказати. Зрештою одна черга цілковито розвалюється й кидається на непідготовлених ополченців, які охороняють місцевий продовольчий склад. Зім'явши їх, люди знаходять правду.\n\nТочніше, не знаходять нічого. Геть нічого. Склад вичищено, не лишилося ані снопа ячменю.\n\nДо кінця тижня ця сцена повториться ще кілька разів у місті, що починає помічати на своєму обличчі шрами пережитих травм. А в сільських комунах годинник цокає для селян, які дивляться, як руйнується їхній добробут, їхні родини й уся Комуна.\n\nСмерть готує косу. Скоро жнива."
 ORE.410.a: "Ми мусимо щось зробити - байдуже що!"
 
 ORE.420.t: "Голод посилюється!"
 ORE.420.d: "Немов зашморг, нестача харчів стискає горло Комун.\n\nЗа відсутности дієвої політики голод гнив у темних калюжах і тихих вулицях Орєнбурґа. Тепер він уже не гниє потай, а сидить у шинках, будинках і залах аж до самої Ради. Голод, нестатки, біль, страх. Подейкують про бунти, грабунки, про те, щоб хапати все доступне, доки слабкість не позбавила змоги рухатися. Радники збирають родини й готуються до раптової втечі в сільські комуни. Може, серед полів буде безпечніше: Орєнбурґ, позолочена лілія Уралу, починає в'янути, і ось-ось налетять комахи. Може, назовні життя буде безпечнішим.\n\nЗа відсутности аграрних реформ крах визрівав у сільських господарствах і селах. Тепер гнів у селянських очах вибухає насильством, коли збудована на їхніх спинах система зісковзує й розсипається в багнюці. Бунти, протидія, повстання. Комуни відриваються від помираючого міського вулика, але й самі виявляються безсилими перед прийдешньою катастрофою. Дехто готується терміново перебратися до міст: їжі там мало, та, може, люди захищатимуть одне одного, адже житниці Комуни вже не кошики, а пастки з гострими краями. Може, назовні знайдеться щось краще.\n\nІ день у день Комуни трохи слабшають, трохи менше пручаються, а зашморг затягується ще тугіше. Театр жахів Орєнбурзьких Комун триває."
 ORE.420.a: "О Боже, допоможи нам. Хоч хто-небудь, допоможіть -"

 ORE.430.t: "Голод у сільській місцевості!"
 ORE.430.d: "Схоже, наслідки плану індустріялізації збирають нову данину з населення, цього разу й у сільській місцевості. Голод, що почався як порівняно незначна нестача харчів у містах, переріс у пошесть серед селян.\n\n«Реформована» Робітнича рада Малєнкова вже намагається боротися з голодом, повертаючи землю й підвищуючи квоти в колективних господарствах. Дехто каже, що під пильним наглядом Орєнбурзької гвардії над селянами криза невдовзі скінчиться."
 ORE.430.a: "Я вже не пам'ятаю, хто живий, а хто ні!"
 
 ORE.440.t: "Збільшення продовольчого постачання"
 ORE.440.d: "Бурчання порожніх шлунків помітно поменшало. Щодня селяни працюють понаднормово й привозять до міста тонни основних культур для перероблення та розподілу. Батьки, які колись віддавали власну їжу дітям, тепер щовечора радісно ділять ситну вечерю із синами й доньками. Хоч деякі бідні чоловіки й жінки досі непокояться про надійність становища, схоже, невдовзі ми вийдемо з голоду й сягнемо нових висот! Що важливіше, верховне командування нашої скромної держави вже не метушиться в пошуках способу полегшити кризу. Швидка відповідь на лихо може стати тим поштовхом, якого нам бракувало в очах громадськости: місцеві газети вихваляють дієвість Робітничої ради та впорядковану систему базового соціального забезпечення, створену внаслідок голоду. Уже зараз допомогу розширюють на більшу кількість земляків і селян. Те, що колись було винаходом міста, розправляє крила. На наших товаришів за межами міської забудови чекає полегшення під час одного з найбільших відроджень, які досі бачив Орєнбурґ!"
 ORE.440.a: "Уперед!"

 ORE.450.t: "Голод відступає"
 ORE.450.d: "Коли сонце сходить над засніженими Уральськими горами й настає день у заклопотаному, квапливому центрі Орєнбурґа, тисячі людей шикуються за мізерною їжею. Загартовані ветерани, які жебракують на вулицях, порівнюють державні пайки з їжею, яку отримували під час голоду в Сталінґраді: хліб старий, суп холодний. На жаль, хліб не може зачерствіти. Він складається з крихт пшениці й тирси, тож відразу сухий і несмачний.\n\nНа щастя, поки наша країна вибирається з вогкого нутра голоду, купи деревного попелу та іншого неїстівного сміття, що зазвичай псує їжу, замінюють борошном і дріжджами. Черги до безплатних їдалень і державних пунктів допомоги, які тягнуться на квартали, помітно коротшають. Намагання влади здешевити харчі, наповнюючи ринки запасами, заготовленими саме на такий випадок, а також зниження тарифів із Уральською Лігою означають, що і селяни, і містяни вже не так нервуються, коли мусять шукати їжу до вечері. Безхатні жебраки, які заполонили вулиці самого Орєнбурґа й найдужче потерпіли від голоду, багато виграли від розширених державних програм допомоги, а профспілки домоглися кращої платні в умовах голоду. Нестачу їжі, що стиснула наші шлунки, гаманці й промисловість, нарешті приборкують."
 ORE.450.a: "Життя триває."

 ORE.460.t: "Кінець голоду"
 ORE.460.d: "У кожній газеті, по радіо, через системи громадського оповіщення й на плакатах Робітнича рада сурмила про свою найбільшу досі перемогу: голод скінчився. Офіційно, звісно. Майже ніхто вже не насилу знаходить пристойну їжу, а до раціону тих, кому пощастило менше за найбагатших, навіть повертають трохи м'яса. Попит найвищий за весь час, тож сільське господарство процвітає, а харчові підприємства наймають більше робітників. Голова Ґєорґій Малєнков подбав, щоб і Робітнича рада, і він сам дістали належну частку слави за подолання кризи. Те, що кризу почасти спричинило невміле розпорядження ресурсами самої Ради, замели під килим. Як сонце яскраво сяє над полями Орєнбурґа, так само сяє й майбутнє."
 ORE.460.a: "Наші шлунки повні!"

 ORE.100.t: "Орєнбурзька робітнича держава 1962 року"
 ORE.100.d: "Регіон довкола міста Орєнбурґа, на щастя, оминула анархія, яку принесли передсмертні судоми Совєцького Союзу. Не маючи великих промислових центрів чи природних ресурсів, села краю могли вільно повернутися до первісного способу життя, зосередженого довкола землі, родини, церкви й села.\n\nЗ часом місто Орєнбурґ почало ставати нейтральним місцем, де селяни й робітники краю могли мирно владнувати суперечки. Саме місто майже не постраждало від терористичних бомбардувань Люфтваффе й могло розвинути міцну доіндустріяльну економіку ремісників і торговців. Селяни, які прибували до міста на переговори із сусідніми селами, почали обмінювати надлишок врожаю на інструменти й припаси, зміцнюючи зв'язок між Орєнбурґом і навколишніми містечками та селами. Невдовзі розійшлися чутки про оазу на південь від Уралу, вільну від хаосу російських держав.\n\nОднак у молодій робітничій державі не все гаразд. Комуни краю ніколи не прагнули тісніших зв'язків із міською радою Орєнбурґа, та посилення економічних і дипломатичних контактів привело до створення регіональної Робітничої ради, де крайові питання можна було обговорювати за демократичними принципами. Така організація знизу вгору знищила всі надії на появу сильної єдиної регіональної влади, адже кожен проєкт чи пропозиція мусять здобути майже одностайну згоду люто незалежних сільських комун.\n\nТепер діяльність за межами Орєнбурґа напружує крихку політичну систему до краю. Невпинно більший потік біженців з Уралу й казахських степів підштовхує місто Орєнбурґ до голоду. А причини цього хаосу невдовзі дістануться й самої робітничої держави, бо за кордонами чатують армії зовнішнього світу... Не здатна навіть організувати регіональне військо із сузір'я ополчень і комун, Робітнича рада боїться, що один з останніх безпечних і заможних регіонів Росії стоїть на краю прірви."
 ORE.100.a: "За Комуни! І за Орєнбурґ!"
 
 ## CORRUPTION CHAIN ##
 
 ORE.900.t: "Чутки про корупцію в Раді"
 ORE.900.d: "Чутки - невіддільна частина політики Орєнбурґа. Майже кожен новий закон нагадує айсберг: більшість справжньої політичної маси кожного нового законопроєкту приховано в кулуарних переговорах між різними партіями, а комуни схиляють підтримати законопроєкт завдяки компромісам і особистій дружбі або суперництву між різними представниками. Витоки відомостей про такі оборудки часто використовують, щоб зняти з представника відповідальність за непопулярне рішення або просунути інтереси іншого члена Ради.\n\nЦього тижня Орєнбурґом і сусідніми комунами шириться особливо згубна чутка про корупцію під час добору членів нового комітету з питань сільськогосподарської політики. Посада в такій важливій раді може значно посприяти кар'єрі людини. Без сумніву, цю огидну новину злив хтось, розгніваний тим, що йому не вдалося купити собі місце, і вона збурила натовп розлючених протестувальників, який учора вдерся до Робітничої ради. Подальший хаос зірвав засідання того дня й затримав роботу сільськогосподарського комітету.\n\nСьогоднішнє засідання перетворилося на шквал звинувачень і взаємних звинувачень: різні політичні партії в Робітничій раді перекладали одна на одну провину за корупцію. Ще більше часу було змарновано, коли пропозицію перевірити кожен звіт зустріли закидами, що замість сільськогосподарських субсидій час витрачають на безглузді чутки. Це своєю чергою викликало зустрічні звинувачення в причетності до тих, хто купив собі посади.\n\nПісля завершення засідання члени нашої політичної фракції обговорили чутку про корупцію. Дослідивши лабіринт зв'язків та інтересів усередині Робітничої ради й комун, вони зібрали доволі переконливі докази щодо того, хто відповідальний за весь цей безлад. Знати винуватців - корисний перший крок, але тепер у нашій партії точаться запеклі дебати про те, як найкраще відреагувати на цю корупційну суперечку, що шкодить нашому урядові."
 ORE.900.a: "Це недобре."
 ORE.900.b: "Цілковито неприйнятно!"
 ORE.900.c: "Контрпродуктивно."
 
 #Mal#
 ORE.901.t: "Відстрочка страти?"
 ORE.901.d: "Голова Малєнков - великодушна людина, і, як відомо, час від часу він готовий не помітити дрібної корупції серед своїх підлеглих, якщо вона проходить належними каналами й не надто шкодить ефективності Робітничої ради у втіленні його реформаторських проєктів. Однак політична нестабільність, спричинена чуткою про корупцію, призвела до прикрих затримок у його проєктах.\n\nСьогодні на закритій зустрічі зі своїми радниками він лютував через час, змарнований на вислуховування нечесних членів Ради, які намагалися перекласти провину один на одного, хоча його команда вже з'ясувала, хто з представників найімовірніше є справжніми винуватцями. Тепер Голова планує для підозрюваних членів Ради кілька прикрих нещасних випадків.\n\nОдин з учасників закритої зустрічі ризикнув накликати на себе гнів керівника, запропонувавши помилувати членів Ради. Корумповані місцеві представники відіграють важливу роль в екосистемі Ради, адже їхні голоси з різноманітних питань легко купити. Якщо залишити підозрюваних живими й натякнути, що їхнє подальше добре здоров'я залежить від того, чи йтимуть вони надалі за Головою, ми зможемо зміцнити свою владу над Радою.\n\nЗвісно, якщо керівник справді бажає їх позбутися, ми можемо викликати для цієї роботи звичних громил, наполягає інший радник. Якщо дати решті Ради зрозуміти, що корупція карається смертю, це змусить їх схаменутися, а населення побачить, що Голова дбає про нього. Іншим членам Ради, звісно, нагадають: доки вони сплачують належне товаришеві Малєнкову, їхні побічні заробітки можуть тривати як завжди."
 ORE.901.a: "Корупції (переважно) не можна терпіти. Убийте їх."
 ORE.901.b: "Трохи милосердя ще нікому не шкодило. Помилуємо їх."

 #Purge
 ORE.902.t: "Зникнення корупції"
 ORE.902.d: "У сучасній Росії жити небезпечно. Чоловіків і жінок часто вбивають з найбанальніших причин: за тижневу платню, добру пару черевиків, буханець хліба... До цієї прикрої злочинности додаються звичайні нещасні випадки, адже населення живе й працює в абияк зведених совєцьких будівлях, які майже не бачили ремонту від падіння Москви. У ці важкі часи не вберігся навіть такий мирний край, як Орєнбурґ.\n\nНещодавно надійшла звістка про члена Ради, який потрапив у засідку бандитів дорогою назад до своєї комуни. Загибель популярного політика від рук бандитів так глибоко в орєнбурзьких землях спричинила нові дебати про потребу військових і безпекових реформ.\n\nСмерть цього слуги народу поповнила перелік прикрих кончин. За останні кілька тижнів кілька найвідоміших діячів Ради загинули жахливою смертю. Один помер унаслідок химерного нещасного випадку за участю чайника й пляшки промислового мастила. Інший мирно відійшов уві сні.\n\nЗвісно, не всі завершують свої дні на очах у громадськости. Чимало членів Робітничої ради просто повертаються до своїх далеких комун, і відтоді про них ніхто не чує. Зв'язок складний навіть у найкращі часи, а тепер, з огляду на загрозу зовнішнього світу, багато сіл просто не надсилають нових представників до міста Орєнбурґа.\n\nМісця тих, хто залишив Раду, заповнили під час нового раунду регіональних виборів. Старі кандидати з часом зникли з поля зору громадськости. Лише чергова низка імен у нескінченній ротації Ради. Чи справді вони взагалі колись були в Раді? Архіваріюси Ради часом бувають напрочуд недбалими.\n\nОсобливо високою плинність була серед членів нового сільськогосподарського комітету. Багатьом новообраним членам Ради довелося заповнити вакансії, що з'явилися в колись суперечливому Комітеті. На щастя, це поклало край корупційному скандалу, адже нових кандидатів обрали на їхні посади чесно й справедливо. Так доля перетворила джерело розбрату в Раді на ще один добре організований гвинтик нового уряду голови Малєнкова."
 ORE.902.a: "Кого там знову звинувачували в корупції? Я за політикою не стежу."
 
 ORE.905.t: "Пробудження від лихого сну"
 ORE.905.d: "Погані спогади про корупційний скандал згасають. Наче Орєнбурґ і його мешканці пробуджуються від лихого сну, в якому облудні люди перетворили робітничу демократію на знаряддя особистого збагачення.\n\nСильна опора голови Малєнкова в Раді останнім часом поповнилася багатьма новими членами. Зокрема, друзі й соратники колишніх членів першої сільськогосподарської комісії стали палкими прихильниками коаліції Голови. Воістину вражає відданість, яку вселяє мудрий батько Орєнбурґа, коли його нові прибічники вітають його в Робітничій раді.\n\nТа щойно жахлива чутка про корупцію згасла, Радою почала ширитися нова - про страх і залякування. На поверхню випливли оповіді про кількох колишніх членів Ради, яких розчинили в кислоті або до смерти забили громили на очах у їхніх родин. Але й ця чутка зникла. Робітнича демократія, що гниє зсередини від погроз і насильства? І все це влаштував голова Малєнков? Жоден розсудливий громадянин не повірив би в таку байку, не кажучи вже про те, щоб переказувати її іншим.\n\nНі, як ранкове світло проганяє лихі сни, так головування Малєнкова породило в Орєнбурґу новий різновид політики. Оскільки причин гризтися майже не лишилося, члени Робітничої ради більше не вдаються до сумнівних кулуарних оборудок, щоб ухвалити закони. Вони просто несуть свої ідеї на схвалення голові Малєнкову. Так нові чутки про корупцію точно не просочаться назовні."
 ORE.905.a: "Новий різновид політики."

 #Scare
 ORE.903.t: "Етична політика голови Малєнкова"
 ORE.903.d: "Сьогодні голова Малєнков поклав край дебатам про корупцію зі звичними для нього точністю та політичним чуттям. Членам Ради зачитали нову етичну політику. Присутні в залі громадяни схвально кивали, коли голова Малєнков закликав членів Ради не втрачати пильности в боротьбі з корупцією в політиці Орєнбурґа. Нова команда реформованого комітету громадської доброчесности дістане повноваження полювати на корупцію та викорінювати сумнівні оборудки серед представників.\n\nЧлени Ради сиділи без заперечень, поки на них накладали нові правила. Цього разу ніхто не спробував підвестися й виступити проти очевидного зазіхання голови на права інших членів Ради. Зміст промови їм уже пояснили неофіційними каналами. Так само як і наслідки того, що вони не пройдуть перевірку на корупцію.\n\nМудрий голова знає, що робітничу демократію Орєнбурґа ніколи не можна плямувати корупцією. І громадяни не повинні знати про брудні трюки, якими політику зберігають чистою. Одного з підозрюваних у справі про корупцію явно не було в залі: напередодні він упав зі сходів. Голова Малєнков, звісно ж, знайшов час відвідати чоловіка в лікарні й побажати йому швидкого одужання. Коли промова нашого лідера перед Радою нарешті скінчилася, чимало її членів підвелися йому аплодувати. Оплески тривали трохи задовго, особливо серед друзів нещасного травмованого члена Ради."
 ORE.903.a: "Голова - ворог корупціонерів!"
 
 ORE.904.t: "Сльозливі відставки"
 ORE.904.d: "Із важким серцем голова Малєнков зачитав народові Орєнбурґа й Раді листи тих, хто подав у відставку з Робітничої ради через давні проступки.\n\nЗміст листів різнився від людини до людини, але в кожному докладно описували сором і жаль через прийняття брудних грошей. Як вони могли брати участь у такому ницому оскверненні великої Робітничої держави Орєнбурґа? Кілька чоловіків писали, що сподіваються на прощення, однак заслуговують лише на зневагу за те, що встромили ножа в спину кожному громадянинові Орєнбурґа.\n\nПід могутнім голосом голови котився шепіт, а гнів і тривога натовпу здіймалися й накочувалися величезними хвилями. Кілька членів Ради зблідли від жаху, коли їх назвали змовниками. Час від часу вартові тягли підозрюваних геть під схвальні вигуки натовпу. Декому з винних членів Ради між читанням листів дали змогу захистити себе з трибуни. Більшість скористалася нагодою, щоб зі сльозами зізнатися у своїх злочинах.\n\nКоли наприкінці дня все було сказано й зроблено, а Рада завершила засідання, чоловіки й жінки міста Орєнбурґа поволі розійшлися вулицями. Цей сльозливий день обговорювали у великих і малих домівках, де містяни висловлювали друзям і родинам своє обурення корупцією. Та до гніву домішувався своєрідний емоційний катарсис. Задоволення від видовища жалюгідних шахраїв, які благали голову Малєнкова про прощення. Ні, великий апостол робітничої демократії знову довів, чого він вартий!"
 ORE.904.a: "А вони ж уникли б кари, якби не голова Малєнков!"
 
 #Bur#
 ORE.906.t: "Технічні труднощі"
 ORE.906.d: "Конґрес ухвалив план Бурби, покликаний затягнути Комуни в сучасність. Справжня проблема - домогтися згоди Ради; і саме тут він уперше наразився на серйозний опір, особливо після нашої суперечливої заяви про усунення всіх членів Ради, причетних до нещодавніх звинувачень у корупції.\n\nПопри чутки про нього, Бурба відданий добробутові народу. Та дехто називає його програму й прагнення реформувати Раду до стану, що бодай нагадує законодавчу стабільність, нападом на самі Комуни, а багато хто натякає, що талант і законодавчий досвід, які ми втратимо, вимітаючи павутиння із шафи, просто не варті такої ціни. І вони наводять переконливі, навіть слушні аргументи. Якщо взятися за цю програму, ризик буде великий, а люди, яких ми збираємося усунути з Ради за корупцію, також виконують малопомітні ролі в наших місцевих системах. Чи зможемо ми втратити талант такого рівня й вижити? Лише час покаже. Водночас буде складно розглянути звинувачення, раптом звільнити цих людей і сподіватися, що народ буде задоволений нашою роботою.\n\nМаємо два варіянти: тихо згорнути справи, які ми готуємо проти корупціонерів у наших владних залах, і відступити заради народу або продовжити реформи. Зрештою, голова за самим визначенням знає, що найкраще для народу Комун, навіть коли сам народ не знає, чого потребує. А знання дає владу."
 ORE.906.a: "Ми мусимо захистити своє майбутнє, хоч би якою дорогою була ціна."
 ORE.906.b: "Зніміть звинувачення. Це заради народу."

 #New Team
 ORE.907.t: "Проблеми на нових виборах"
 ORE.907.d: "Чимало людей у нашій фракції, зокрема голова Бурба, вбачали в цьому корупційному скандалі добру нагоду продемонструвати нашу дедалі більшу політичну силу й позбутися політиків, підозрюваних у хабарництві. Ці старі діди поступаються місцями перспективним політикам, прихильнішим до наших проєктів.\n\nОднак цього разу ретельно продуманий головою Бурбою виборчий план мало що дав. Наші дані про популярність кандидатів виявилися ненадійними в багатьох комунах, і, на превелике розчарування, чимало переможців належать до старої малєнковської фракції. Ще гірше, до Ради повернулося багато представників-обструкціоністів, які понад усе прагнуть повернути Орєнбурґ до анархії часів Робітничого конґресу.\n\nГолова Бурба розчарований таким результатом, але він і його команда політичних аналітиків уже з'ясовують, чому їхні прогнози виявилися хибними, та будують нові статистичні моделі підтримки по всьому краю. Тим часом наші люди в Раді суворо пояснюють правила і новачкам, і членам Ради, що повернулися, та недвозначно дають зрозуміти: повернення до добурбівського стану речей не буде. Загалом політична ситуація майже не змінилася, адже на часткових виборах сумнівних представників замінили ненадійними. Для нас це не серйозна поразка, але й не крок уперед."
 ORE.907.a: "Не можна виграти все. Принаймні народ побачить, що корупціонерів у Раді більше немає."
 
 ORE.908.t: "Кінець справи Сільськогосподарського комітету"
 ORE.908.d: "Зрештою людям набридло обговорювати чутки про корупцію під час добору членів Сільськогосподарського комітету. Багато хто перейшов до обговорення переваг і недоліків нової політики голови Бурби з поширення грамотности. Інші просто облишили політику, досхочу наситившись на цей рік бездоказовими історіями й марґінальними теоріями змови. Зрештою, політика належить до тієї самої категорії вічних речей, що податки й смерть, тож якщо кілька місяців її ігнорувати, нікому це не зашкодить, правда?\n\nУ самій Раді тим часом тривало сходження нового порядку голови Бурби. Щотижня ще кілька повноважень забирали в нікчемних політиків і передавали якомусь комітетові, укомплектованому фахівцями. Голова й далі просував членів Ради, які вміли правильно тримати олівець, і так само далі запихав ідіотів до маловідомих підпідкомітетів. Крайові лідери гризлися за першочергове фінансування, поки аналітики з фракції голови порівнювали прогнозовану віддачу від інвестицій у різні проєкти. Так, у новій Робітничій раді все йшло як завжди.\n\nЗаміна причетних до гаданого корупційного скандалу переконала населення, що до заявлених проступків поставилися серйозно. Голова Бурба спрямував трохи ресурсів комунам, розлюченим утратою старого представника, якщо інвестиції були того варті, а решту проігнорував. Перевагою керування конфедерацією комун, яка все ще розвивається, було, зрештою, те, що через погану інфраструктуру й лінії зв'язку розгнівані громадяни залишалися щонайменше за кілька днів дороги."
 ORE.908.a: "Хоч раз усе добре, що добре закінчується?"

 #New Work
 ORE.909.t: "Радників добряче налякали"
 ORE.909.d: "Зрештою голова Бурба вирішив дослухатися до тих радників, які рекомендували виявити розважливість. Чимало ймовірно нечесних членів Ради залишаються популярними вдома, і надто швидке їх усунення може порушити крихку рівновагу, на яку наш уряд спирається у проведенні реформ. До того ж є прикра обставина: у нинішньому корупційному скандалі та проти його підозрюваних ми маємо лише непрямі докази.\n\nОднак загроза масового вигнання з Ради вже принесла певні позитивні наслідки. Голова Бурба вселив у багатьох підозрюваних членів Ради страх Божий. Їм дозволили гучно проголосити свою невинуватість і присягнути, що вони доведуть свою політичну надійність реформістським фракціям, а тоді відпустили без пригод. Тим часом нерозкаяних шахраїв на кшталт члена Ради Захаева вдалося привести за стіл переговорів поєднанням меду й оцту. Старий покидьок не протримався б так довго в бурхливій Раді без чудового чуття на те, куди дмуть політичні вітри, і він слушно підозрює, що сходження голови Бурби вже не спинити. Йому та його братії краще трохи вгамувати свою корупцію, якщо це підвищить їхні шанси зберегти справжню політичну владу замість того, щоб опинитися засланими до комітету культури.\n\nТепер, коли всі підозрювані в корупційному скандалі поводяться якнайкраще, кілька продуктивних засідань Ради минули без пригод. Вигляд старого Захаева, який підтримує пропозиції голови Бурби, безперечно, змусив декого здивовано підняти брови, але хаотична природа орєнбурзької політики бачила й дивніші спілки."
 ORE.909.a: "Нам удалося ще на один день упоратися з членами Ради..."
 
 ORE.910.t: "Схвалення нашої боротьби з корупцією зростає!"
 ORE.910.d: "Певний час чутки про корупцію під час добору складу Сільськогосподарського комітету були головною темою розмов у місті. Міркувати про причетних стало одним з улюблених занять Орєнбурґа. Дехто намагався покласти провину на проторговельну фракцію, яка нібито прагнула викачувати гроші із Сільськогосподарського комітету, щойно до нього оберуть її людей. Інші припускали, що залишки фракції Малєнкова намагаються повернути собі частку влади, аби торгуватися з фракціями голови Бурби.\n\nЗавдяки нашим переговорам із непевними членами Ради чутки про корупцію більше не порушували в самій Раді. Декого зі складу Сільськогосподарського комітету перевели до інших підрозділів Ради, а на їхні місця прийшли кілька людей, відомих своєю непідкупністю. Це дало поживу натовпам, які підозрювали нечесну гру, проте більшість населення сприйняла зміну складу комітету як достатній доказ того, що до чуток про корупцію поставилися серйозно.\n\nУся ця халепа насправді обернулася на нашу користь, адже населення вразило те, як голова Бурба дав раду проблемі. Замість того щоб кидатися на арену й звинувачувати суперницькі фракції в нечесності, голова та його соратники повернули увагу Ради до належних питань, а ситуацію владнали за лаштунками. Члени Ради, які боялися, що в цій істерії їхня політична кар'єра скінчиться, вдячні нам і підтримують уряд дужче, ніж будь-коли."
 ORE.910.a: "Примхи громадськости не надто нас турбують, але її схвалення приємне, доки триває."
 
 #Cou#
 ORE.911.t: "Рішення Ради"
 ORE.911.d: "На таке радикальне глумління над правосуддям Рада вирішила відповісти не менш радикальним актом правосуддя: ми проведемо чистку всіх, хто ставав на заваді ефективному врядуванню, і вийдемо з полум'я сильнішими й кращими. Усіх гідних переоберуть, а корумпованих і аморальних членів, які зреклися справедливости заради зиску, буде засуджено й забуто.\n\nПринаймні такий план склала Рада, і саме цієї версії більшість делегатів дотримується на папері. Допитливих журналістів, які вказують, що зв'язки корупціонерів із можновладцями орєнбурзької політики неминуче забезпечать їм переобрання, ігнорують, доки це ще можливо. Так само ігнорують делегатів, які кажуть, що це взагалі не розв'язання проблеми, а лише спосіб проголосити власну невинуватість і водночас не дати тим, хто знає правду, висунути нові звинувачення.\n\nУсе вирішено, і Правосуддя звершилося. Рада не терпітиме жодних сумнівів щодо цього, окрім тих, що панують усередині неї; а всередині Рада, безперечно, має значно більші проблеми, ніж сумніви. Чи ні?"
 ORE.911.a: "Ми вичистимо їх усіх. Жодних запитань."
 ORE.911.b: "Це видається трохи... надмірним. Навіть занадто."
 #Elect
 ORE.912.t: "Нове оголошення"
 ORE.912.d: "Хоч оголошення про нові вибори, покликані очистити Орєнбурзьку раду від будь-яких слідів корупції, і зустріли з певним схваленням, мало хто сподівався, що далі стане краще. Кілька нових, сповнених надій кандидатів таки висунулися, заявивши про бажання «кинути виклик статус-кво», проте серед звичної публіки вони становили крихітну меншість. Нова група була молодшою й, можливо, мала популістськішу програму, але навряд чи була настільки радикальною, щоб справді щось змінити. Народ Орєнбурґа втомився: хоч нові вибори, мабуть, і подарували людям слабку надію, багато хто вважав, що більше вплинув би на результат, просто залишившись удома. Здавалося, голосування перетворилося на традицію, а не нагоду для змін. Учасники часом мінялися, але правила залишалися тими самими, бо спосіб управління Орєнбурґом із роками затвердів, наче цемент. Навіть ті, хто палко підтримував нових, молодих і сповнених надій кандидатів, сумнівалися, що вони довго витримають проти статус-кво. Невеликий поступ - це все, на що вони сподівалися, та навіть через нього нервувалися. Голоси поволі почали накопичуватися. Швидко стало очевидно, що багато людей справді вирішили залишитися вдома: явка була жалюгідною. Утім, зрештою результати підрахували, і..."
 ORE.912.a: "Нехай ваш голос почують!"
 
 ORE.913.t: "Стара знайома Рада"
 ORE.913.d: "Сталося саме те, чого й очікували. Більшість старого складу Ради переобрали. Вони тішилися поверненням до влади, хоч перемогли без значної підтримки. Було зрозуміло, що Орєнбурґ утомився. Та членів Ради це не турбувало: вони квапилися повернутися до праці над своїми звичними політичними проєктами. Дехто навіть доклав символічних зусиль, щоб бодай удавати прагнення змін на краще. Якби для змін було досить короткої промови й рукостискань із кількома селянами, їм, можливо, це вдалося б. Насправді ж змінилося небагато. Для запобігання хабарництву й корупції загалом провели кілька реформ, але з погляду звичайних мешканців Комун вони, здавалося, не мали жодного ефекту. Справи йшли своїм звичаєм: Рада пережовувала нескінченну кількість питань і суперечок зі швидкістю та завзяттям висохлого слимака. Дехто замислювався, що сталося б, якби обрали нову Раду. «Можливо, щось змінилося б на краще», - думали вони.\n\nДехто таки намагався реформувати систему. Група міських робітників уклала перелік кількох ключових реформ, покликаних поліпшити життя всіх мешканців Орєнбурґа. Їхня спроба домогтися поступу загубилася серед численних інших пропозицій і скарг, які надсилали до Ради. Щоразу, коли робітники питали про свій перелік, їм відповідали, що його неодмінно розглянуть. Звісно ж, його так ніколи й не знайшли..."
 ORE.913.a: "Життя в Орєнбурзі плине повільно."

 #Retain
 ORE.914.t: "Нічого показувати, нічого приховувати"
 ORE.914.d: "Рада прагнула зберегти статус-кво. Усі колишні посадовці мали залишитися на місцях. Офіційним виправданням було: «У Раді немає корупції», а якби якась корупція й була, її вже давно викрили б. Звісно, тим, хто палко вірив, що корупція нікуди не зникла, заява Ради лише посилила страхи й змусила гризти нігті в очікуванні наступного кроку Ради. У відповідь на гадану бездіяльність Ради перед її палатою в самому серці Орєнбурґа зібралася доволі численна група протестувальників. Серед очікуваних транспарантів із написами «Рада мусить піти!» та звичної кількости барвистої лайки особливо провокативним було зображення: у селянина збирають і крадуть урожай, а член Ради дивиться в інший бік, тримаючи в руках багатства, якими його обдарував злодій. Попри численність і галасливість, спершу протестувальники майже не впливали на Раду, яка впевнено оголосила, що справи триватимуть як завжди.\n\nЩодня протести тривали, доки Рада засідала, а тоді розходилися, коли її члени прямували додому. Але протестувальники не збиралися цим перейматися й почали випробовувати інші способи домогтися свого. Дехто збирався біля осель окремих посадовців і вигукував вимоги так гучно, що вночі не давав спати ані їм, ані їхнім сусідам. Інші вдалися до різних форм вандалізму та інших дрібних злочинів: від написаного фарбою слова «брехуни» на будівлі Ради до мертвого півня, кинутого в одного з членів Ради дорогою на роботу. Після цього випадку Рада погодилася зустрітися з кількома протестувальниками й з'ясувати, чи можна знайти розв'язання. Для обох сторін зустріч виявилася марною: протестувальники наполягали на відставці Ради, а Рада - на тому, що з корупцією нічого не можна вдіяти. Наступного дня довкола будівлі Ради знову з'явилися транспаранти, і ще один день розпочався й завершився звичним перебігом справ..."
 ORE.914.a: "Сподіваймося, мертвими тваринами більше не кидатимуться."
 
 ORE.915.t: "Буря в склянці води"
 ORE.915.d: "Тепер, коли хаос ущух, дехто з політичного класу Орєнбурґа дістав змогу поміркувати, звідки взялися чутки про корупцію. Оскільки кожна політична фракція утримувала неформальну мережу інформаторів і шпигунів, усі потай очікували появи доказів щодо справжніх винуватців. Щойно корумповані політики спробували б забрати свій виграш, за цим мали з'явитися докази їхньої вини, а всю мережу людей, які намагалися купити місце в Сільськогосподарському комітеті, було б викрито.\n\nЧас минав, а зниклі гроші так і не з'являлися, тож тема загрожувала знову виплисти на поверхню. Сьогодні вранці, коли ми готувалися до робочого дня, до канцелярії нашої фракції, задихаючись, увірвалася молода секретарка й зажадала розмови з найвпливовішим доступним політиком.\n\nНаші спантеличені члени вислухали її розповідь. Як виявилося, її начальники з фінансового комітету Ради десь загубили документи, що схвалювали звичайний переказ грошей на оплату праці персоналу. Через це в рахунках утворилася діра, яку кілька бюрократів спробували приховати, перекидаючи гроші з місця на місце. Невдовзі ланцюгова реакція призвела до того, що гроші почали входити й виходити через дивні регіональні рахунки, породивши думку, ніби регіональні об'єднання комун переказують Орєнбурґу великі суми. Відтак поповзли чутки, що з рахунками Сільськогосподарського комітету щось негаразд, а його члени якимось чином купують собі посади!\n\nКоли начальник секретарки знайшов загублені папери, зниклі гроші «повернулися» до системи, і всі рахунки зійшлися. Чоловік не надав своїй помилці жодного значення й лише нещодавно згадав про неї секретарці. Молода жінка негайно збагнула наслідки цієї канцелярської помилки й прибігла доповісти нам. Як з'ясувалося, довкола Сільськогосподарського комітету ніколи не було жодної корупції."
 ORE.915.a: "Кмітлива дівчина. Якби ж вона дізналася про це раніше..."
 
 
