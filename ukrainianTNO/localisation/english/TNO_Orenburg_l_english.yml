 ORE_anarchic_commune_industry_3_desc: "Орєнбуржці з підозрою ставляться до всього, що бодай трохи нагадує централізацію, і промисловість не виняток. Через це переважна більшість справжніх промислових потужностей існує лише в самому місті Орєнбурзі. За його межами більшість людей може знайти роботу хіба що в сільськогосподарських колективах і примітивних майстернях, що різко обмежує потенційне виробництво комун."
