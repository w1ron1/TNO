 ORE_anarchic_commune_politics_3_desc: "Орєнбурґ - не тиранічний загальнодержавний уряд, а сукупність комун, які добровільно долучаються до політики Ради. Це робить наш уряд украй неефективним, але якщо ми не вислухаємо кожну людину на нашій території, то як зможемо чесно називати себе вільними від тиранії?"
