 ORE_category_political_situation_desc: "The Council is terribly inefficient, and must change. Though some argue it should be reformed, it really should be removed entirely and replaced with a centralized organization. On that, both Burba and Malenkov can agree. By passing through a series of reforms, we can put power behind a unified body instead of the Council, allowing us to finally make impactful decisions and act on behalf of the people. But if we push too hard, we will only empower those that seek to maintain the Council. Currently Orenburg is [This.GetOrenburgCentralisation](§R[?ROOT.ORECentralizedPower]§!).\n\nThe head of the reformist party is [This.GetOrenburgReformist]."
