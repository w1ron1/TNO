 ORE_anarchic_commune_military: "Анархічні комуни - військо"
 ORE_anarchic_commune_military_desc: "В Орєнбурзі військо переважно складається з народних ополчень, а не з єдиної армії. Підтримка таких ополчень висока, та це не віщує нічого доброго, якщо ми прагнемо створити якісну бойову силу. Через часто хаотичні бойові вигуки ополченців ті нечисленні вищі військові організатори, що в нас є, регулярно зазнають нервових зривів."
 ORE_anarchic_commune_industry: "Анархічні комуни - промисловість"
 ORE_anarchic_commune_industry_desc: "Орєнбуржці з підозрою ставляться до всього, що бодай трохи нагадує централізацію, і промисловість не виняток. Через це переважна більшість справжніх промислових потужностей існує лише в самому місті Орєнбурзі. За його межами більшість людей може знайти роботу хіба що в сільськогосподарських колективах і примітивних майстернях, що різко обмежує потенційне виробництво комун."
 ORE_anarchic_commune_politics: "Анархічні комуни - політика"
 ORE_anarchic_commune_politics_desc: "Орєнбурґ - не тиранічний загальнодержавний уряд, а сукупність комун, які добровільно долучаються до політики Ради. Це робить наш уряд украй неефективним, але якщо ми не вислухаємо кожну людину на нашій території, то як зможемо чесно називати себе вільними від тиранії?"
 ORE_forlorn_hope: "Покинута надія"
 ORE_forlorn_hope_desc: "Можливо, Рада нас підвела. Можливо, вона не виконала обіцяного. Але ми - Орєнбурґ. Ми не хитаємося через помилки, ні. Як і тоді, коли народилася наша жива, дихаюча ідея, ми мусимо вистояти. Мусимо вижити заради народу!"
 ORE_uralian_industrial_aid_idea: "Уральська промислова допомога"
 ORE_uralian_industrial_aid_idea_desc: "Ми вирішили прийняти пропозицію Уральської Ліги щодо промислової допомоги. Рада погодилася, що ця пропозиція принесе робітникам Орєнбурґа лише найкраще! Вип'ємо ж за наших уральських друзів!"
