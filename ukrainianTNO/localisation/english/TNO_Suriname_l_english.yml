  #Опис лідерів
  AAT_VAN_RHIJN_POLITICS_DESC:0 "Доктор Арі Адріан «Аат» ван Рейн, державний службовець і політик, народився в Ґронінґені в 1892 році; він навчався в університетах Утрехта та Ґронінґена й обіймав різні посади у асоціаціях компаній, профспілок, у п'яти чи шести різних міністерствах і так далі — до свого призначення міністром сільського господарства та рибальства за кілька днів до німецького вторгнення.\n\nВтікаючи до Лондона, а потім до Оттави та Парамарибо, ван Рейн спостерігав, як Королівство Нідерландів падало до низького рівня, з якого воно тільки трохи відновилося з тих пір, коли нацистське ярмо полонило Нідерланди, а японські «антиколоніалісти» «визволили» Голландську Ост-Індію. Ван Рейн зміг пережити останні двадцять років більш-менш розумним, але інші, такі як прем'єр-міністри Дірк Ян де Ґеєр і Пітер Сйорс Ґербранді, не мали такого ж успіху; ван Рейн мусив сумувати, спостерігаючи, як багато людей, яких він знав і поважав, занепадали від бід, хвороб і старості.\n\nҐербранді, виснажений до межі, пішов у відставку в середині 1950-х років, обравши ван Рейна своїм наступником; віддалені люди Суринаму вважають його хорошим кандидатом на цю посаду. Компетентний державний діяч, адміністратор, поміркований протестантський консерватор з великою повагою до непротестантів і трудового руху, Аат ван Рейн прагне утримати курс, проводячи реформи лише за загальною згодою, побоюючись порушити модус вівенді, створений у цій країні вигнанців, іммігрантів і колоністів."