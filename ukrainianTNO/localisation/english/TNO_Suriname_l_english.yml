  SUR_forpol.6.t: "Нідерланди в ОВН"
  SUR_forpol.6.desc: "ОБМЕЖЕНО/[GetDateText]\n\nВІД АГЕНТА CLOVES\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ВІДОМОСТІ ПРО КОРОЛІВСТВО НІДЕРЛАНДІВ\n\n1. Прем'єр-міністра Королівства Нідерландів Самкалдена сприймають як "реформатора" через його політику на користь корінного населення. Ця шалена хвиля реформ посилилася через об'єднання посад прем'єр-міністрів Суринаму та Нідерландів, що забезпечило плавний процес соціальних реформ, які сколихнули основи нідерландських володінь і спричинили юридичні ускладнення після його перемоги на виборах 1963 року.\n\n2. Генеральні штати Суринаму, законодавчий орган Суринаму, значно посилили свою базу влади внаслідок цих реформ, кинувши виклик колись панівному нідерландському парламенту та розлютивши консерваторів серед вигнанців.\n\n3. Поступове скасування житлових обмежень, покращення транспортних мереж і розширення схвалення іпотечних кредитів дозволили суринамцям із внутрішніх районів оселитися в Парамарибо. Це мало непропорційний вплив на нідерландське населення. Хоча новий уряд продемонстрував певний успіх в інтеграції обох блоків "складного" суспільства, натомість натовпи нідерландців мігрували до Нідерландських Антильських островів.\n\n4. Уряд Самкалдена прагне отримати позику на гідроелектростанцію та розширення порту, сподіваючись привабити інвестиції до своєї зростаючої виробничої бази. Самкалден залишив Суринам із абсолютно новим суспільним іміджем, який може послабити деякі заклики до незалежності, але це може коштувати певної неохоти режиму Самкалдена брати участь у спільних експедиціях з ОВН."
  SUR_forpol.6.a: "Схвалити позику." 
  SUR_forpol.6.b: "Відхилити позику." 

  SUR_forpol.7.t: "Реформа в Суринамі"
  SUR_forpol.7.desc: "ОБМЕЖЕНО/[?global.date.GetDateStringNoHourLong]\n\nВІД ЧАРЛІ ПЕЙСА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: Результати нідерландських виборів\n\n1. На нещодавніх виборах у нідерландському уряді у вигнанні, що базується в Парамарибо, чинний уряд зазнав поразки, і його змінив Йоган Адольф Пенґел із NPS-VHP. Ці вибори пройшли майже без галасу чи суперечок, але на всіх рівнях зростає невдоволення нинішнім станом нідерландської політики, зокрема й у королівських колах.\n\n2. Обурення расовою дискримінацією, наслідками справи Гофманс і загальною байдужістю до підтримання зв'язків із Нідерландами створили простір для піднесення Пенґела. Хоча він навряд чи розірве з нами міжнародні зв'язки, його уряд означає значний зсув у політиці й сприймається суринамськими реформаторами як мандат.\n\n3. Однак наш агент у королівських колах зазначає, що консерватори дивляться на Пенґела з великим скептицизмом. Багато хто побоюється, що його термін означатиме рух у бік суринамського націоналізму, із занепокоєнням щодо можливого референдуму про незалежність, який повністю ліквідує Нідерланди. Було б помилкою антагонізувати королеву Юліану, але найрозумніше було б забезпечити, щоб управління й надалі функціонувало безперебійно"
  SUR_forpol.7.a: "І ПІЗНАЄТЕ ІСТИНУ, І ІСТИНА ЗРОБИТЬ ВАС ВІЛЬНИМИ"

  SUR_forpol.8A.t: "Справа Бернгарда"
  SUR_forpol.8A.desc: "Будівля Генеральних штатів у Парамарибо часто була сонним місцем. Довгі роки вигнання перетворилися на безцільне животіння, яке лише зрідка переривалося кризами, як-от та, що розгорталася зараз. Прем'єр-міністр Нідерландів Мейнен витер піт із чола під пильним поглядом журналістів на галереї. На жаль, саме йому довелося відповідати на їхні запитання — головний винуватець не спромігся прийти.\n\nПісля короткої промови про прихильність його уряду до прозорості та верховенства права, ледве чутної за гомоном натовпу й спалахами камер, Мейнен відкрив засідання для запитань, що призвело до милосердної миті тиші, перш ніж безликий голос поставив перше запитання.\n\n"Джо Гобсон, Los Angeles Times. Що ви можете сказати про нещодавні викриття щодо ділових операцій принца Бернгарда? Якою буде реакція вашого уряду?"\n\nЗвісно, американці одразу спробували б розбурхати ситуацію. "Наше розслідування триває повним ходом. Однак ми не поставимо честь королівської родини під загрозу, доки не матимемо остаточних доказів у той чи інший бік."\n\n"Олівія Баккер, De Volkskrant. Яка ваша реакція на нещодавнє викриття жахливих умов праці на державних шахтах та зв'язків їхніх власників із королівською родиною?"\n\nМейнен знав, що це запитання прозвучить, і підготувався відповідно. Він завжди був людиною корони, але якщо корона мала намір саботувати його роботу, йому довелося б обірвати нитки. "Ситуація, про яку ми дізналися протягом останніх тижнів, справді нестерпна, і вона кидає тінь на цей уряд. Як демократичний уряд, ми залежимо від довіри народу, і цю довіру необхідно поновити. Заради цього ми вирішили призначити дострокові вибори.""
  SUR_forpol.8Aa: "Це заради блага самої Корони."

  SUR_forpol.8B.t: "Справа Бернгарда"
  SUR_forpol.8B.desc: "Піт і Йо вийшли на перекур, сидячи в тіні невеликого сараю, що захищав їх від пекучого сонця, а також від цікавих вух. Солдатам не належало відкрито обговорювати політичні питання, але, перебуваючи в самому Парамарибо, серці Королівства Нідерландів у вигнанні, вони чули більше за більшість інших солдатів.\n\nПіт пробурмотів між затяжками цигарки. "...А тепер кажуть, що сам принц Бернгард загруз по шию в усій цій справі. Пам'ятаєш Адріана, того хлопця з інженерного корпусу? Ми зустрілися днями. Тепер він охоронець у штаб-квартирі Shell, і каже, що в деякі дні здається, ніби весь королівський двір мігрує до зали засідань Shell. Він просто не міг про це не знати."\n\nЙо загасив власну цигарку об землю, перш ніж запалити нову. "Так, він влип по-серйозному. Чув, як хлопці на причалах казали, що поліція почала розслідувати справи деяких королівських підприємств, щось про незаконні угоди з американськими фірмами. Єдина хороша новина — схоже, уряд справді сприймає цю справу серйозно."\n\nПіт витер чоло. "Ну, вони справді не можуть просто дозволити цьому зійти з рук. Щодня спливає щось нове. Минулого тижня це було хабарництво, потім — таємне лобіювання американців, а тепер зловживання на шахтах. Ти бачив фотографії? Цих бідних дітей там просто вижимають до останньої краплі."\n\n"Сподіваюся, ти маєш рацію", — Йо відкинувся назад. "Але ти знаєш, які політики: вони зроблять що завгодно, щоб урятувати власну шкуру. Кажуть, що віддані реформам і всьому такому, але я думаю, королева не може бути задоволена цим. Якщо вони хочуть зберегти свої місця..."" 
  SUR_forpol.8Bb: "...їм не варто занадто гнівити королеву.""

  #SUR_forpol.9 is available for usage

  SUR_forpol.10.t: "Повстання на Кюрасао 1969 року"
  SUR_forpol.10.desc: "-КОНФІДЕНЦІЙНО-\n\nВІД СУРИНАМСЬКОГО БЮРО ФБР\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: НАСЛІДКИ ПОВСТАННЯ НА КЮРАСАО\n\nВід самого створення нідерландського уряду у вигнанні в Суринамі (надалі UKN) тертя між Парамарибо та Нідерландськими Антильськими островами були постійною темою, особливо в часи криз. Місцеві жителі, незадоволені застійним і непредставницьким правлінням UKN та його небажанням допомагати островам у подоланні економічного занепаду, давно стали головною мішенню радикалів.\n\nЦі кризи тепер досягли точки кипіння. Народний гнів і розчарування призвели до створення неформальної коаліції різних груп — профспілкові бойовики (стор. 3), чорні націоналісти (стор. 4-5) і навіть ліберальні реформатори (стор. 5-6) об'єдналися, щоб захопити контроль над ключовими районами Віллемстада та Кюрасао загалом, що призвело до широкомасштабного хаосу й мародерства, оскільки сили UKN виявилися нездатними контролювати більшу частину острова.\n\nСитуація стає дедалі небезпечнішою. Є побоювання, що радикальні діячі серед кюрасаоських бунтівників (див. список відомих агітаторів у додатку А) прагнуть відокремитися від UKN за підтримки регіональних соціялістичних держав (див. докази зв'язків між обома сторонами на стор. 6). Після певного тиску уряд UKN висловив бажання відновити контроль, але як його заяви, так і оцінки ФБР свідчать, що йому бракує матеріально-технічних можливостей для відновлення порядку без завдання неприйнятного рівня збитків і втрат. Щоб гарантувати, що операція не призведе до подальшої ескалації, рекомендується американська допомога."
  SUR_forpol.10.a: "Ми не можемо дозволити Антильським островам вислизнути з наших рук."

  SUR_forpol.11.t: "Кінець повстання на Кюрасао 1969 року"
  SUR_forpol.11.desc: "Піт зійшов з американського корабля на причал Віллемстада, оточений десятками інших солдатів. Їхній шлях уже був окреслений поліцейськими бар'єрами, встановленими до їхнього прибуття, і мовчазними натовпами, які прийшли подивитися на відновлення присутності UKN на острові. Він не очікував захопленої зустрічі після всього, що сталося на Кюрасао, але тиша все одно нервувала його, а осудливі погляди глибоко в нього впивалися.\n\nПіт міцніше стиснув американську гвинтівку й зібрався з духом. Вони повертали порядок на острів, охоплений анархією. Протести — це одне, але спалення поліцейських дільниць і пограбування крамниць не могла прийняти жодна влада, а країна в такому постійно хиткому становищі, як Королівство Нідерландів у вигнанні, могла прийняти це ще менше за інших. Будь-яка тріщина могла дозволити їм проникнути всередину й зруйнувати останню крихту вільної Європи, яку вони тут, у Карибському басейні, створили. Цього не можна було допустити.\n\nКоли військовий джип, також наданий американцями, гуркотів вулицями, Піт зумів переконати себе, що все зрештою склалося здебільшого задовільно. Американська допомога була вирішальною, але зрештою блокада переконала тих бунтівників, які ще трималися, здатися. Деякі ватажки вирушили у вигнання, а решту перевели до місць утримання на материку, доки вони не постануть перед судом. Повітряна розвідка дозволила блокадним силам перекрити більшість спроб переправити всередину або назовні припаси чи людей, залишивши Кюрасао ізольованим від опортуністичних сил у Карибському басейні та за його межами.\n\nАле коли тієї ночі Піт ліг на ліжко, надане американцями, у нашвидкуруч спорудженій казармі, побудованій для розміщення збільшеного гарнізону, і намагався заснути, його не полишала думка:"
  SUR_forpol.11.a: "Хто насправді був сувереном на Кюрасао — або, якщо вже на те пішло, у Парамарибо?"

  SUR_forpol.12.t: "Кінець повстання на Кюрасао 1969 року"
  SUR_forpol.12.desc: "Піт був виснажений, але сон не приходив, коли він упав на надане американцями ліжко, тулячись разом із товаришами в колишній шкільній будівлі, тепер нашвидкуруч переобладнаній під казарму. Кошмари, які він бачив удень, миготіли за повіками, і він знав: якщо засне, вони підуть за ним і туди.\n\nЦе ніколи не мало закінчитися так. Американці надали їм зброю, блокували Кюрасао й навчали сили UKN. Перед тим як вони вирушили з Парамарибо відновлювати порядок, Піту та його товаришам сказали, що повстання на острові придушене і їхнє завдання полягає лише в тому, щоб забезпечити можливість Королівству Нідерландів знову належним чином керувати своїми володіннями. А потім вони висадилися, і все навколо них завалилося.\n\nПіт раптом підвівся, вийшов із кімнати й затупотів надвір покурити. Спершись на вікно покинутого класу, він не міг забути очі людей, які, як вважалося, прийшли зустрічати їх у порту Віллемстада. Вони не були вдячними й навіть не були наляканими. Вони були розлючені. Обурені. Непокірні. І коли перша пляшка Жданова полетіла в їхній конвой, що гуркотів вузькими вулицями, ця хвиля непокори накрила війська.\n\nЦе була самооборона, казав собі Піт. Він та його друзі були в справжній небезпеці. Але коли недопалок обпалив йому пальці, він відчув запах диму на вулицях, почув постріли з гвинтівок, побачив яскраво-червону кров закривавлених бунтівників, що падали на землю, і зрозумів, що навіть якщо це була самооборона, цього ніколи не мало статися. Їх послали вбивати своїх співгромадян, а самовдоволені, брехливі генерали повели їх у небезпеку. І коли Піт спотикаючись повернувся до казарми, міцно тримаючи американську гвинтівку, він чудово бачив, що вина лежала не лише на руках уряду в Парамарибо."
  SUR_forpol.12.a: "Карибський басейн став би американським озером, навіть якби воно почервоніло від крові його народу."

  SUR_forpol.13.t: "Повстання на Кюрасао 1969 року"
  SUR_forpol.13.desc: "-КОНФІДЕНЦІЙНО-\n\nВІД СУРИНАМСЬКОГО БЮРО ФБР\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: НАСЛІДКИ ПОВСТАННЯ НА КЮРАСАО\n\nВід самого створення нідерландського уряду у вигнанні в Суринамі (надалі UKN) тертя між Парамарибо та Нідерландськими Антильськими островами були постійною темою, особливо в часи криз. Місцеві жителі, незадоволені застійним і непредставницьким правлінням UKN та його небажанням допомагати островам у подоланні економічного занепаду, давно стали головною мішенню радикалів.\n\nЦі кризи тепер досягли точки кипіння. Народний гнів і розчарування призвели до створення неформальної коаліції різних груп — профспілкові бойовики (стор. 3), чорні націоналісти (стор. 4-5) і навіть ліберальні реформатори (стор. 5-6) об'єдналися, щоб захопити контроль над ключовими районами Віллемстада та Кюрасао загалом, що призвело до широкомасштабного хаосу й мародерства, оскільки сили UKN виявилися нездатними контролювати більшу частину острова.\n\nСитуація стає дедалі небезпечнішою. Є побоювання, що радикальні діячі серед кюрасаоських бунтівників (див. список відомих агітаторів у додатку А) прагнуть відокремитися від UKN за підтримки регіональних соціялістичних держав (див. докази зв'язків між обома сторонами на стор. 6). У відповідь на кризу реформістський уряд UKN вирішив розпочати процес реформ, який, імовірно, задовольнить багато вимог бунтівників, можливо навіть реформувавши UKN у федеративне королівство з повним представництвом Антильських островів. Цей процес буде вкрай небезпечним для американських інтересів, оскільки надасть антиамериканським силам потужну базу для проведення невигідного законодавства через Генеральні штати."
  SUR_forpol.13.a: "Ми не можемо дозволити Антильським островам вислизнути з наших рук."

  SUR_forpol.14.t: "Кінець повстання на Кюрасао 1969 року"
  SUR_forpol.14.desc: "Піт сидів разом зі своїми товаришами по загону в їхній казармі в Парамарибо, уважно слухаючи, як тріскуче радіо оживало. Відтоді як повстання на Кюрасао перевернуло політичне життя в усіх нідерландських володіннях, він і його товариші жили в постійній напрузі. Уряд заявляв, що відкритий до переговорів і хоче реформувати володіння, щоб відповісти на заклики протестувальників, але Піт знав, що будь-який неправильний рух будь-якої зі сторін призведе до їхнього відправлення у Віллемстад. Сама думка про придушення своїх співгромадян, які лише протестували за краще ставлення, скручувала йому живіт.\n\nАле тепер очікування закінчиться. Прем'єр-міністр мав оголосити результати переговорів, і Піт мав хороше передчуття. Зрештою, якби переговори провалилися, він, мабуть, уже не сидів би тут, у Парамарибо. Але їм усе одно потрібне було офіційне підтвердження. Коли з маленького апарата залунав нідерландський гімн, солдати стихли, затамувавши подих.\n\n"Громадяни Нідерландів", — голос прем'єр-міністра затріщав у кімнаті. "Із великим задоволенням і гордістю я можу повідомити вам сьогодні, що переговори з представниками кюрасаоських протестувальників дозволили досягти угоди, яку обидві сторони визнали прийнятною. Генеральні штати Антильських островів буде перебудовано для забезпечення справедливішого й рівноправнішого представництва громадян островів, а кожен острів матиме власного безпосереднього представника при канцелярії прем'єр-міністра. У відповідь протестувальники погодилися мирно повернути острів під контроль UKN-"\n\nРешту промови заглушили вигуки радості, поплескування по спинах і відкривання пляшок пива та дешевого шампанського. Піт опустився назад на ліжко, відчуваючи хвилю полегшення. Нідерландським солдатам не доведеться топтати чоботом нідерландських громадян. Він думав, що угода звучить як бюрократичний кошмар, але це вже не його проблема."
  SUR_forpol.14.a: "Принаймні не сьогодні."

  SUR_forpol.15.t: "Кінець повстання на Кюрасао 1969 року"
  SUR_forpol.15.desc: "Ніч опускалася на Карибський басейн, залишаючи дедалі вужчу смугу неба в темніючому відтінку кривавої червоно-коричневої барви, що відбивала настрій взводу, поки зловісна, похмура тиша тяжіла над кораблем, який перевозив Піта та його товаришів. Зібравшись разом на палубі чи під нею, курячи цигарки або граючи в карти, усі думали про одне: усе не мало закінчитися так.\n\nКоли протести на Кюрасао кілька тижнів тому переросли в насильство та відкрите повстання, стало зрозуміло, що уряд Нідерландів зіткнувся зі своїм найбільшим випробуванням. Для уряду, який заявляв про свою відданість реформам, криза була найбільшою можливістю довести, що він здатен належним чином відповісти на дедалі більші вимоги свого народу щодо змін, водночас зберігаючи єдність володінь, і вийти з цього сильнішим та більш об'єднаним.\n\nПринаймні, такою була надія. Поки голос прем'єр-міністра щовечора лунав у старому, потрісканому радіоприймачі в казармі Піта в Парамарибо, розповідаючи про законні претензії народу Антильських островів і про необхідність країни відповідати виклику, почали кружляти дивні чутки, а невдовзі за ними послідували дивні події. Солдати, що охороняли королівський палац, поширювали чутки про спроби корони зірвати переговори з Кюрасао, а потім вулиці Парамарибо почали заповнювати протести з вимогами до уряду придушити повстання й не дозволити радикалам "знищити володіння зсередини".\n\nІ це спрацювало. Сьогодні рано-вранці взвод Піта розбудили, наказали допомогти у повторному захопленні Віллемстада й посадили на американський корабель, що чекав у гавані. Вони були хорошими солдатами; вони виконають накази. Але дорогою туди вони могли вільно бурчати. Не здавалося, що вони служать свободі, наступаючи чоботом на своїх співгромадян-нідерландців. Піт навіть не відчував, що служить Нідерландам, посилюючи тиск на те, що ставало схожим на бомбу уповільненої дії."
  SUR_forpol.15.a: "Кому вони насправді служили?"

  SUR_forpol.16.t: "Антикорупційні заворушення в Суринамі"
  SUR_forpol.16.desc: "-КОНФІДЕНЦІЙНО-\n\nВІД СУРИНАМСЬКОГО БЮРО ФБР\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ЗАВОРУШЕННЯ В ПАРАМАРИБО\n\nМинулого року стали відомі викриття незаконних оборудок нідерландського принца Бернгарда з американськими інтересами та відчайдушних умов праці шахтарів у шахтах у внутрішніх районах, укладених за американськими контрактами, що значно заплямувало репутацію королівської родини серед суринамської громадськості. Уряд Йо Мейненa (див. додаток А), що складався з лоялістів корони та проамериканських сил, відповів призначенням нових виборів, які через обмежувальні правила голосування з комфортною більшістю знову привели Мейненa до влади.\n\nОднак ця спроба повернути довіру громадськості до нідерландського істеблішменту у вигнанні розвалюється. Проти принца Бернгарда чи будь-якого іншого провідного представника нідерландської еліти не висунуто жодних звинувачень (див. додаток Б), а новий кабінет Мейненa також виявився причетним до пов'язаних із цим корупційних скандалів. Ці кризи, а також загальне відчуття серед суринамської громадськості та ЗМІ, що нідерландці керували країною з цілковитою безкарністю, призвели до паралізуючих страйків і заворушень, що скували Парамарибо й поширилися також на інші міста.\n\nОскільки уряд Мейненa, схоже, не здатен запропонувати змістовну відповідь на вимоги протестувальників, здається, його дні полічені. Однак вкрай бажано, щоб будь-яка передача влади була переважно мирною й зберегла якомога більшу частину нинішньої структури, особливо з огляду на те, що склад і лідери заворушень стають дедалі радикальнішими у своїй анти-нідерландській риториці та вимогах, а дехто навіть закликає до повної незалежності й фактичного припинення існування нідерландського уряду у вигнанні."
  SUR_forpol.16.a: "Давайте просто всі заспокоїмося."

  SUR_forpol.17.t: "Бюджетна криза"
  SUR_forpol.17.desc: "Пекуче сонце й вологе тепло обрушувалися на Піта, коли він стояв на варті біля воріт своєї казарми в Парамарибо, але це були дрібні незручності перед величезним натовпом, що хвилювався перед його очима. Натовп мерехтів перед очима, теплові хвилі зливалися з масою прапорів — нідерландських, суринамських, деяких червоних, наскільки сягало око. Вони були мирними, але Піт не міг позбутися відчуття мурахи, що стоїть перед припливною хвилею.\n\nЯка жахлива справа, думав Піт. Безлад, яким був нідерландський уряд, означав, що прем'єр-міністр Нідерландів у вигнанні водночас був прем'єр-міністром усього королівства, включно із Суринамом та Нідерландськими Антильськими островами. А це, своєю чергою, означало, що криза, яка зачіпала уряд у вигнанні, цілком могла зачепити Суринам, як це відбувалося перед його очима. Те, що почалося як чергова суперечка між Короною та урядом щодо бюджетних асигнувань та інвестиційних програм, призвело до відставки колишнього прем'єр-міністра Нідерландів і завершилося тим, що королева пішла ще далі й звільнила його також із посади прем'єра всього Королівства.\n\nНового прем'єр-міністра, Юста Ренса, поспішно призначили без виборів, але Суринам тепер міг вважатися таким, що взагалі залишився без уряду. Партії попереднього уряду, осідлавши хвилю самовдоволення і, вперше за довгий час, маючи громадськість на своєму боці, оголосили про єдину відповідь на кризу, що завершилася загальним страйком, який паралізував Парамарибо й розростався перед очима Піта.\n\nАле Піт продовжував стояти на варті, киплячи від спеки й власних думок. Він був солдатом вільних Нідерландів, підтримував вогонь свободи принаймні в одному куточку своєї батьківщини, землі, якої він ніколи не бачив, але про яку його батьки розповідали йому щовечора, коли він був малим. На цій історії він виріс, саме вона спонукала його вступити до армії. Але коли натовп дедалі зростав, йому ставало дедалі важче відкинути нав'язливе питання:"
  SUR_forpol.17.a: "На чиєму він боці?"

