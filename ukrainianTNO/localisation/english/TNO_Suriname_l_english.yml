  #Leaders descs
  AAT_VAN_RHIJN_POLITICS_DESC:0 "Доктор Арі Адріан "Аат" ван Рейн, державний службовець і політик, народився в Ґронінґені 1892 року; він навчався в університетах Утрехта та Ґронінґена й працював на різних посадах — у підприємницьких об’єднаннях, об’єднаннях працівників, п’яти чи шести різних міністерствах тощо — аж до призначення міністром сільського господарства та рибальства всього за кілька днів до німецького вторгнення.\n\nВтікши до Лондона, а звідти до Оттави й Парамарибо, ван Рейн спостерігав, як Нідерландське королівство опустилося на дно, від якого з того часу лише трохи оговталося, коли нацистський чобіт розтоптав Нідерланди, а яматівські 'антиколоніялісти' 'звільнили' Нідерландську Ост-Індію. Ван Рейну вдалося пережити останні двадцять років більш-менш розсудливим, але іншим — таким як прем’єр-міністри Дірк Ян де Ґеер і Пітер Сйордс Ґербранді, не кажучи вже про королеву Вільгельміну, — пощастило менше; ван Рейну довелося зі смутком спостерігати, як так багато знайомих і шанованих ним людей занурювалися в злидні, хвороби та неміч.\n\nҐербранді, виснажений до краю, пішов у відставку в середині 1950-х, обравши ван Рейна своїм наступником; далеко розкидані люди Суринаму вважають його придатним для цієї роботи. Компетентний державник і адміністратор, який діє як поміркований протестантський консерватор із великою повагою до непротестантів і робітничого руху, Аат ван Рейн прагне дотримуватися взятого курсу, проводячи реформи лише за спільною згодою, побоюючись порушити modus vivendi, створений у цій країні вигнанців, іммігрантів і колоністів."
  POLITICS_SUR_GERARD_HELDERS_DESC: "Ґерардус Філіппус Хелдерс — один із відкинутих пережитків нідерландського імперіялізму, яких прибило до берегів Суринаму. Він став адвокатом після обіцянки роботи від свого дядька, але його первісний інтерес до економіки ніколи не згасав, і ці подвійні інтереси привели його до призначення фінансовим інспектором у Нідерландській Ост-Індії. Хелдерс провів десятиліття, керуючи справами в Батавії та Бандунзі, аж до японського вторгнення в колонії, де його нетривале командування завершилося полоном. Його звільнення наприкінці війни не було тріумфом, адже в Роттердамі чи Батавії не залишилося дому, куди можна було повернутися, але королівство насправді не впало, і в Америці він знову знайшов притулок, служачи короні у вигнанні.\n\nСходження Хелдерса на посаду прем’єр-міністра не віщуватиме великих змін для занепалого королівства. Влада нідерландського парламенту у вигнанні буде використана сповна, щоб забезпечити його виживання. Місцеві станові збори мають залишатися підлеглими й слухняними, не більше ніж радниками в управлінні країною та далеко від цивілізованих районів Парамарибо.\n\nПрем’єр-міністр, що бенкетує у своєму замку, ніколи не прийматиме суринамців, над якими панує, а лише посилатиме сурогатів із пихатими наказами, щоб нагадувати їм схилити коліно й поцілувати перстень. Хелдерс вважає збереження монархії своєю найвидатнішою справою, і за його волею вони правитимуть вічно."
  POLITICS_SUR_IVO_SAMKALDEN_DESC: "Іво Самкалден — один із пережитків нідерландського імперіялізму, яких прибило до берегів Суринаму. Він розпочав університетські студії з економіки та індології, перш ніж здобути докторський ступінь із права. Ці студії привели Самкалдена до колоніяльної адміністрації, де він працював економічним і юридичним радником у Сурабаї. Його служба в Нідерландській Ост-Індії тривала лише кілька років, оскільки стрімкий японський наступ призвів до його інтернування до кінця року. Після звільнення Самкалден залишився напризволяще; не маючи можливості безпечно повернутися до Нідерландів, він не мав іншого вибору, окрім як приєднатися до вигнання своєї королеви в Америці.\n\nСходження Самкалдена на посаду прем’єр-міністра принесло стрімкі зміни, які викликають оптимізм у суринамців і засудження його радикалізму з боку противників. Його першим кроком було повністю усунути нідерландський парламент і передати його повноваження становим зборам. Цей сміливий крок зробив Самкалдена одночасно прем’єр-міністром Суринаму та Нідерландів — посада, яка посилила владу місцевих політиків, давно зневажених короною.\n\nОднак ця грандіозна реформа є експериментом, побудованим на поступці, яка дозволяє королеві в будь-який момент відкликати повноваження станових зборів і сформувати власний уряд. Тепер Самкалден опинився в небезпечних водах, проштовхуючи життєво важливі реформи в королівстві, водночас балансуючи інтереси монархістів, чиї сповнені образи погляди прагнуть обмежити його уряд. Він не дозволить ні собі, ні королівству залишитися пережитками; воно мусить адаптуватися, щоб вижити."
  POLITICS_SUR_FRANS_VAN_VEEN_DESC:0 "Франс ван дер Вен був людиною, яку поважали всі в Нідерландському королівстві. Служачи лейтенантом під час Другої світової війни, ван дер Вен утік до Австралії після падіння нідерландських володінь у Європі та Азії. Там він залишався до кінця війни. Після повернення до останніх нідерландських земель в Америці його зустріли як героя, і він швидко просувався службовими сходами.\n\nПісля повернення він служив ОВН у низці операцій — від пусток Сибіру до пустель Африки. Тепер він постає рятівником Нідерландів, принаймні у власних очах, виконуючи брудну роботу для своєї країни, щоб одного дня вона повернулася до Амстердама. Якщо вигнанці повернуться, він стане героєм, нарівні з Оранськими, які першими звільнили націю. Якщо вони зазнають невдачі, він залишиться сумним і відчайдушним чоловіком, відчайдушно чіпляючись за давно минулий статус-кво.\n\n"
  POLITICS_SUR_HERMAN_VAN_ROIJEN_DESC:0 "Народившись у родині престижного дипломата, Герман ван Ройєн був приречений на успішну кар’єру на дипломатичній службі. Він мав перевагу над сотнями, якщо не тисячами інших, які мріяли про крісло міністра закордонних справ. Коли значна частина Європи впала під владу Німеччини, багато конкурентів Германа зникли, забрані німцями, — ще один крок угору. Після років роботи він тепер перевершив свої мрії, ставши новим прем’єр-міністром своєї країни.\n\nЯкби ж усе було так добре. Ван Ройєн є провідником королеви та її радників і залишатиметься ним ще довгі роки. Він виконуватиме їхню брудну роботу, пригнічуватиме народ і компетентно робитиме свою справу. Для суринамців він залишиться в пам’яті як посіпака, який пригнічував їх заради значно більшого зла. Для нідерландців він не залишиться в пам’яті взагалі.\n\n"
  POLITICS_SUR_ISAAC_AREND_DIEPENHORST_DESC:0 "Колись освічена людина, із дипломами з теології та права і перспективний член Антиреволюційної партії, Ісаак Аренд Діпенгорст далеко віддалився від своїх мрій. Тепер він керує новим домом колись розкішного Нідерландського королівства — Антильськими островами. Островами, якими правлять нідерландські еліти й олігархи, далеко від їхньої старої батьківщини. Робота Діпенгорста — підтримувати життя на островах, доки одного дня королева та її вигнанці не зможуть повернутися до давно втраченої батьківщини.\n\n"
  
  POLITICS_SUR_ADOLF_PENGEL_DESC:0 "Скільки б часу нідерландці не правили Суринамом, вони завжди правили як меншість, адже колонію побудували не білі поселенці, а раби та мігранти з усієї Нідерландської імперії. Нідерландська еліта очікувала, що певні реформи й представництво задовольнять місцевих жителів, яких так довго позбавляли демократичної свободи, тож для них, мабуть, стало неабияким потрясінням те, що їхнє виборче панування було повалене на перших вільних виборах.\n\nПерший корінний прем’єр-міністр Суринаму походить із простої родини. Йоган Адольф Пенґел був четвертою дитиною вчителя з округу Пара. Попри те, що він кинув юридичний факультет, Пенґел усе ж отримав роботу в судовій системі Суринаму й активно працював у своїй громаді. У відповідь на різке підвищення орендної плати місцевим землевласником він організував протест району проти землевласника, а потім зібрав кошти, щоб викупити землю для своєї громади. 1949 року Пенґела обрали до станових зборів, і він заснував Федерацію трудящих Суринаму для організації суринамців проти колоніяльної еліти. Кидаючи виклик нідерландській короні, він ще більше просував свою кар’єру і, за допомогою реформ Самкалдена, увійшов до уряду як прем’єр-міністр.\n\nТепер Пенґел править із народним мандатом, але перебуває під пильним наглядом нідерландської корони. Об’єднавши свою Національну партію Суринаму з Об’єднаною індостанською партією Лахмона, він має повну підтримку своїх суринамських побратимів. Нідерландські вигнанці, однак, глузують із того, що їхнім правителем став колоніальний підданий, особливо той, хто не є білим. Консерватори в нідерландському істеблішменті хочуть усунення Пенґела, тож він мусить захищати своє тяжкою боротьбою здобуте місце від роялістських акул, що кружляють у водах, аби не стати останнім і єдиним корінним прем’єр-міністром Суринаму. Однак виклик не відлякує Пенґела, адже винагороди рівності, свободи й, можливо, навіть незалежності цілком варті ризику."
  POLITICS_SUR_JUST_RENS_DESC:0 "Одним із результатів багаторічного колоніяльного панування над Суринамом стало багатокультурне суспільство, що розквітло під нідерландським чоботом. Індонезійські та індійські контрактні працівники живуть поруч з афросуринамцями, нащадками рабів, насильно переправлених через Атлантику. Є іронія в тому, що корона вирішила розв’язати свою кризу правління меншості, оминувши представників величезної більшості своїх підданих і знайшовши свого героя натомість у місцевому нідерландському населенні.\n\nЮст Ренс народився 1916 року в білій меншості колонії, звідки він згодом піднявся до визначного становища в діловій спільноті Суринаму. Вісім років він працював в уряді в Суринамському поштовому ощадному банку, перш ніж перейти до приватного сектору. Ренс заснував успішну пральну компанію, а завдяки успішному американському діловому партнерству привіз до Суринаму завод із розливу 7Up. Його успіхи в розвитку місцевого виробництва відкрили йому шлях у політику як члену станових зборів. Однак вигнання нідерландського уряду радикально змінило траєкторію його кар’єри, поставивши його перед критичним переломним моментом.\n\nОбрання Ренса короною на посаду прем’єр-міністра Суринаму після хаосу заворушень 1969 року надало йому безпрецедентну владу. Стани й рух за незалежність згуртувалися навколо нього, мов припливна хвиля народної волі, спрямована на нідерландський парламент. Вигнанці мусять поступитися вимогам Ренса, інакше ризикують втратити ще більше своєї влади над колонією, але помірковані політичні погляди Ренса роблять його принаймні прийнятним. Суринам вступає на невідому територію, і ще належить побачити, чи є Ренс тією людиною, яка зможе вести корабель."
  POLITICS_SUR_GAIUS_GAAY_FORTMAN_DESC:0 "Навіть коли вулиці Парамарибо палали люттю за незалежність після справи Мейєна, нідерландці знали, що терпіння зіграє їм на користь. Поки поліція безперервно відбивала розлючені натовпи, успіх був гарантований. Суринамці, налякані за добробут своїх районів, прийдуть домовлятися, обираючи безпеку замість незалежності. Вундеркіндом, обраним очолити альянс, народжений відчаєм, став Ґайюс де Ґай Фортман.\n\nФортман, народжений у родині нідерландських патриціїв, здобув докторський ступінь із права, перш ніж переходити між різними державними посадами. Працюючи в міністерствах сільського господарства, соціальних справ та економіки, Фортман став надзвичайно універсальним юристом серед найвидатніших правознавців Нідерландів. Фортман продовжив свою роботу, допомагаючи нідерландським вигнанцям відновлювати освіту та соціальні послуги в Суринамі й на Антильських островах. 1947 року він став професором права в Каліфорнійському університеті в Берклі, а 1956 року — завідувачем кафедри права новоствореного Університету Нідерландських Карибів. Роялісти, поставлені під загрозу заворушеннями, потребували юридичного генія Фортмана, щоб зберегти свою владу та інвестиції, тож Фортман прийняв нову роль прем’єр-міністра Нідерландів.\n\nФортман і його коаліція християнсько-демократичних партій пообіцяли помірковані реформи та заручилися співпрацею Об’єднаної індостанської партії Джагерната Лахмона. Страх Лахмона перед тим, як швидка незалежність може зашкодити його народу, полегшив його відхід від революціонерів Пенґела. Справа Мейєна виявила глибоку, нестійку інституційну гнилизну всередині нідерландської мікроімперії. Фортман мав очистити її всю та перебудувати нідерландську систему управління для забезпечення демократичної співпраці. Можливо, це стане його magnum opus — колоніяльним урядом, який назавжди збереже нідерландське панування, водночас ставлячись до людей на кшталт Лахмона з певною мірою рівноправності. Навіть у вигнанні Нідерланди та Її Величність житимуть далі."
  POLITICS_SUR_JAGERNATH_LACHMON_DESC:0 "Коли хвилі змін обрушилися на тропічні береги, перед Суринамом постав вибір: повністю прийняти приплив або зміцнити дамби проти повеней. Зрештою на виборах після успішних загальних страйків перемогли обережні голоси, а нездатність сформувати повну корінну коаліцію призвела до подальшого компромісу з нідерландською СДРП. Очолює цю нестійку коаліцію на шляху до референдуму про незалежність привітний чоловік на ім’я Джагернат Лахмон.\n\nСам Лахмон народився наймолодшою дитиною в родині контрактних працівників і фермерів. Його вчителі радили йому вивчати право, а через колоніяльні обмеження це можна було зробити лише через наставника. Лахмон знайшов своє спасіння в Юліусі Цезарі де Міранді, креольському адвокаті зі значним політичним впливом у колонії. Вражений тим, що Міранда навчав людину попри расові відмінності, Лахмон вирішив поставити етнічну гармонію та примирення численних народів Суринаму на перше місце. Навіть після того, як нідерландські вигнанці втекли до Суринаму й Карибського басейну, Лахмон заснував Об’єднану індостанську партію, найбільшу індуїстську партію Суринаму, та об’єднався з Національною партією Суринаму Пенґела заради більших прав і привілеїв від роялістського режиму.\n\nТепер, як капітан корабля Суринаму, Лахмон прагне привести колонію до безпечніших гаваней. Він побоюється, що незалежність стане не сяйливим днем над блакитним морем, а відбійною течією, яка потопить колонію в расовому конфлікті, як їхніх сусідів-ґаянців. На думку Лахмона, у країні ще надто багато чого потрібно побудувати, щоб він охоче відкинув своїх сюзеренів, особливо коли його виборці благають нідерландців диверсифікувати свої інвестиції, щоб допомогти знедоленому індійському середньому класу. У найпотаємніших думках його не полишає тривожне питання: чи стане незалежний Суринам сильнішим?"
  POLITICS_SUR_JO_MEYEN_DESC:0 "Йоганнес Мейєн можна охарактеризувати як завдяки його діловій проникливості, так і непохитній відданості нідерландській короні. Народжений у родині проповідника, Мейєн пройшов підготовку як офіцер резерву нідерландської армії, перш ніж стати заступником секретаря торгової палати Арнема. Звідти він стрімко зростав у статусі, ставши керівником відділу продажів європейського представництва Hercules Powder Company — посада, яка започаткувала його зв’язки з американськими промисловими магнатами. Він неушкодженим пережив німецьку окупацію, керуючи фабриками ламп, але вигнання його уряду та королеви змусило його залишити батьківщину. Невдовзі після прибуття він був призначений міністром війни і завдяки американським зв’язкам швидко відновив його як боєздатну структуру, щоб посилити позиції Нідерландів у новоствореному ОВН. Після виходу з уряду він скористався старими зв’язками з Hercules, продавши колоніяльні активи хімічному гіганту DuPont і отримавши натомість керівництво їхньою новою суринамською філією.\n\nТепер, після сходження Хелдерса до Державної ради, Йо Мейєн був обраний прем’єр-міністром ще більш укріпленої еліти у вигнанні. Очоливши контракти Royal Dutch Shell з американськими нафтовими компаніями, він прагне більших інвестицій від Дядька Сема для експлуатації невикористаних надр Суринаму. Козир Мейєна — дружба з принцом Бернгардом і його Більдерберзькою зустріччю — надала йому безпрецедентний вплив в уряді. Зв’язок із королівською родиною виставляється напоказ у кожних торговельних переговорах, кожній інвестиційній угоді та кожній закулісній домовленості для фінансування розкішного способу життя корони, і дехто шепоче, що корупція сягає далі, ніж фінансування королеви. Попри це, корона цінує престиж, гроші та владу, які Мейєн приносить за стіл переговорів, і надала йому чистий чек разом із його дедалі численнішими американськими благодійниками, щоб якнайповніше експлуатувати суринамців — місцеві можуть іти до біса."
  
