  # Ідеї  
  SUR_1947_Constitution:0 "Конституція Нідерландів 1947 року"  
  SUR_1947_Constitution_desc:0 "Розмови про реформу конституції вже були звичним явищем під час вигнання уряду в Лондоні; однак, коли уряд був змушений до подальшого вигнання у Карибський басейн, вибору не залишилося — конституція була реформована.\n\nНова Конституція 1947 року мало відрізняється від попередньої за своєю суттю: вона підтримує основоположні цінності свободи та демократії в умовах конституційної монархії. Однак вона відрізняється одним головним аспектом: вона забезпечує значну автономію різним залишковим карибським колоніям, які стали складовими демократіями в складі вигнаного Королівства Нідерландів."  
  SUR_Poster_Boy_OFN:0 "Постерна країна ОВН"  
  SUR_Poster_Boy_OFN_desc:0 "Будучи однією з останніх уцілілих учасниць старих союзницьких сил, вигнанський уряд Королівства Нідерландів у Суринамі є членом Організації вільних націй. Однак через очевидні труднощі, які викликає перебування уряду у вигнанні в залишковій частині його колишньої колоніальної імперії, він сильно залежить від великих кредитів та іншої допомоги для свого виживання.\n\nЯк результат потоку допомоги в Суринам, країна стала відома як постерна країна ОВН, демократія, яка виживає та процвітає завдяки великій підтримці своїх вільних демократичних союзників. Хоча це призвело до сильної економічної ситуації, ця сила насправді крихка, оскільки країна дуже сильно залежить від допомоги ОВН."  

  SUR_queen_wilhelmina:0 "Королева Вільгельміна"  
  SUR_queen_wilhelmina_desc:0 "Єдина дитина короля Віллема III Нідерландського та Емми Вальдек-Пірмонтської, Вільгельміна Нідерландська стала королевою у віці 10 років. Взявши кермо уряду після регентства, Вільгельміна здобула популярність за підтримку нейтралітету Нідерландів під час Першої світової війни та вирішення багатьох промислових проблем своєї країни. Її бізнес-підприємства зробили її першою жінкою-мільярдером у світі; вона забезпечила, щоб її сім'я залишалася однією з небагатьох європейських королівських династій, які зберегли свій статус. Але все це зруйнувалося, коли прийшли нацисти.\n\nПісля німецького вторгнення в Нідерланди в 1940 році Вільгельміна втекла до Великої Британії, очоливши нідерландський уряд у вигнанні. Падіння Сполученого Королівства під натиском німців стало для неї таким же серйозним ударом, як і втрата батьківщини, тому їй довелося втекти до Карибського басейну. Незабаром після прибуття в Суринам Вільгельміна намагалася зректися престолу; однак уряд відмовився це дозволити, оскільки уряд у вигнанні не витримав би такого удару. Пізніше було погоджено, що її донька, кронпринцеса Юліана, замінить її на церемоніях та подіях, у той час як Вільгельміна залишатиметься королевою.\n\nУ 40-х роках Дірк Ян де Гір залишив свій пост, і його замінив Петер Сьордс Гербранді. Пізніше Гербранді також пішов у відставку, вичерпаний напруженням управління; його замінив лагідний Аат ван Рейн. Але це нічого не змінило: Вільгельміна, як завжди, залишається у напрузі з урядом."  

  SUR_queen_juliana:0 "Королева Юліана"  
  SUR_queen_juliana_desc:0 "Королева Юліана Нідерландська — єдина дитина королеви Вільгельміни та Генріха Мекленбург-Шверинського. Вона отримала приватну освіту та вивчала міжнародне право в Ляйденському університеті. У 1937 році вона вийшла заміж за принца Бернхарда Ліппе-Бістерфельдського; у шлюбі народилися чотири доньки: Беатрікс, Ірена, Маргарита і Марія Христина. Під час німецького вторгнення у Другій світовій війні королівська сім'я була евакуйована до Великої Британії; згодом Юліана та її діти вирушили до Канади, тоді як Бернхард і Вільгельміна залишалися на місці; коли Сполучене Королівство було захоплене, решта сім'ї приєдналася до Юліани в Канаді, а потім вирушила до Суринаму, де нідерландський уряд у вигнанні нарешті осів.\n\nЗ моменту занепаду її матері наприкінці 40-х років Юліана фактично стала королевою у вигнанні Нідерландів, замінюючи матір на церемоніях та заходах. Незважаючи на очевидну міць гітлерівської тиранії в Королівстві Нідерландів, вона залишається оптимістичною щодо того, що Амстердам буде звільнений одного дня. Навіть якщо цього не станеться, вона не падає духом; у такому випадку вона з радістю долучиться до свого уряду у вигнанні для укладання формальних угод із карибськими колоніями, створюючи справжню країну, яка вийде за межі цього тимчасового стану."  

  SUR_surinamese_independence: "Незалежність Суринаму"  
  SUR_surinamese_independence_desc: "У дні перед тим, як Суринам став незалежним — або, можливо, «незалежним» — теперішні економічні злидні вважалися гідними похвали, ознакою доброзичливості Організації Вільних Націй до країни. Для Республіки Суринам у наші дні це, однак, є нічим іншим, ніж тягарем.\n\nНідерланди номінально «пішли», але приватні нідерландські фонди досі володіють усією економікою Суринаму. Тим часом Нідерланди у вигнанні та Сполучені Штати, не зумівши утримати суринамських громадян під прямим контролем, задовольняються тим, що роблять їх залежними від обмеженої та недостатньої іноземної допомоги."  

  CUR_Exiles_in_the_Antilles: "Вигнанці на Антильських островах"  
  CUR_Exiles_in_the_Antilles_desc: "Хотілося б вірити, що це вигнання лише тимчасове, що добро переможе зло, і настане день, коли вигнанці залишать цей чужий берег. Можна майже уявити той день, у далекому майбутньому, коли чоловіки й жінки стоять на палубі величезного корабля, витираючи сльози з очей, повертаючись додому. Вони дивляться на пляжі, дамби, дюни. Вони прибувають у непорочний Амстердам, відновлений до своєї давньої слави, і отримують квіти та лаври як привітання з поверненням до відродженої країни.\n\nАле ця мрія — брехня. Це ілюзія. Не буде відновлення Нідерландів. Не буде повернення з вигнання. Не буде усміхнених облич, братніх обіймів чи щасливих сліз. На посушливих пляжах Аруби є лише загнивання й занепад для королівства, яке колись правило хвилями й контролювало світову торгівлю.\n\nТож королева та її двір продовжать тіснитися в яскраво пофарбованому палаці, чіпляючись за свої егоїстичні фантазії, поки світ іде далі. Вони видаватимуть укази, які ніхто не почує, поки врятовані Рембрандти тріскатимуться в рамах, а тканини Вілско блідішатимуть під нещадним сонцем. І вони ігноруватимуть зростаючий гнів і розчарування тих, кого вони витіснили на Арубі. Вони будуть ігнорувати тих, хто проклинає їхні імена та претензії на шляхетну жертву, поки не стане надто пізно, і мрія, якою було Королівство Нідерландів, остаточно не зникне назавжди."  

  SUR_1971_Constitution: "Конституція 1971"  
  SUR_1971_Constitution_desc: "Амстердам було втрачено, і безкраї рівнини Голландії більше ніколи не милуватимуть очей вигнанців. Але вони свого часу могли втішати себе тим, що вони, принаймні, залишаються вільними і демократичними, як їхні батьки після поразки іспанського панування.\n\nТепер це не так. Нова військова влада, встановлена переворотом, стверджує, що вона «зберігає надію та силу для нідерландського народу», створивши конституцію, яка фактично зруйнувала п'ятсот років демократичної традиції. Колись демократичні інституції були обмежені настільки, що це може змусити сумніватися навіть таких, як Сомоса чи Морініґо. Автономія колоній і права громадян колоній були знищені.\n\nВійськові, можливо, переконують себе, точніше, марно намагаються переконати себе, що, вдаючись до того, що справедливо називають святотатством, вони врятували залишки Королівства Нідерландів. Але насправді ці диктаторські закони створили лиш порожнечу та конфлікт серед останніх вільних голландців, рану, яка не загоїться, навіть якщо Нідерланди якось звільнять, і Королівський штандарт знову замайорить на Палеїс Амстердам."

  # Events  

  SUR.skeleton.6.t: "Марш Суринаму" # Для США про майбутній референдум  

  SUR.skeleton.6.desc: "Після третього обльоту королівського комплексу на голландській Арубі пілот вертольота без позначок, що належав Джирарду Доусону дійшов висновку, що у палаці немає місця для посадки такого великого транспортного засобу. Доусон, керівник відділу ФБР у Парамарибо, запитав, яка альтернатива, якщо посадка неможлива. «Можемо повернутися до Ораньєстаду», - запропонував пілот і додав: «або ви можете скупатися». Не вагаючись, Доусон почав одягати рятувальний жилет і вказав пілоту на місце стоянки яхт.\n\nЩойно гвинтокрил спустився досить низько, Доусон стрибнув у воду, розбурхану роторами, і поплив до берега, незважаючи на течії. Коли він вийшов на тверду землю, мокрий агент ФБР побачив, як йому назустріч біжать його контакти: принц Бернхард і група генералів Королівської армії. Після короткої поїздки машиною та гарячого душу Доусон уже сидів з групою, попиваючи портвейн на веранді поблизу, аж раптом генерал Франс ван дер Веен порушив неприємне питання. «Як вам відомо, Естат Суринаму нещодавно проголосував за проведення референдуму щодо незалежності Суринаму», - сказав генерал, тримаючи цигарку між губами, - «і ми хочемо це зупинити». Повітря наповнилося сміхом і дзвоном келихів.\n\nЦі старі стовпи голландської реакції зневажали автономію Суринаму і шукали американської підтримки для «захисту» майбутнього Королівства. Естат Суринаму був де-факто законним парламентом Нідерландів, і таким чином участь Америки у поваленні уряду країни-члена ОВН суперечила б хартії ОВН. З іншого боку, незалежний Суринам, безсумнівно, існував би поза межами ОВН. Доусон розмірковував над цим проханням і його наслідками."

  SUR.skeleton.6.a: "«Я передам ваше прохання далі»."
  
  SUR.news.1.t:0 "[Get_newspaper_header]Смерть королеви Вільгельміни"
  SUR.news.1.desc:0 "Королева Нідерландів Вільгельміна, яка перебувала в екзилі в Суринамі, померла від серцевого нападу у своєму тимчасовому житлі в Парамарибо, де вона перебувала з моменту евакуації уряду в екзилі до Карибів. Смерть не стала несподіванкою: Вільгельміна вже довгий час була хвора, і це змушувало її доньку, тепер королеву Юліану, брати на себе все більше її обов'язків.\n\nГолландські Кариби — іноді охоплені суперечками — об'єдналися, щоб оплакати її смерть; навіть у окупованих нацистами Нідерландах були повідомлення про траур. За проханням покійної королеви, похорон був проведений в білих одежах, а не чорних, як відображення її християнської віри, що смерть є лише початком вічного життя. У зв'язку з обставинами в Парамарибо було побудовано спеціальне кладовище для її останків; однак джерела в уряді вказують, що якщо Амстердам коли-небудь буде звільнений, вона приєднається до своїх предків у Королівській крипті там."
  SUR.news.1.a:0 "Наші співчуття."

  SUR.news.2.t:0 "[Get_newspaper_header]Реформа голландських основних законів"
  SUR.news.2.desc:0 "Нещодавні дії голландського уряду проти автономії Суринаму викликали протести в столиці Парамарибо після перегляду колоніальних Основних законів. Переважно порожній голландський парламент прийняв законодавство, яке зменшило роль уряду в екзилі до церемоніальної позиції та надало право голосу вигнанцям у Суринамі. Радники королеви Юліани порадили їй звільнити прем'єр-міністра Суринаму та призначити голландського прем'єр-міністра, таким чином ще більше об'єднавши голландське королівство.\n\nЦей крок викликав обурення серед населення Суринаму, яке вважає цей крок порушенням попередніх угод про автономію з голландською короною. Хоча нинішній Національний парламент Суринаму продовжить свою роботу до наступних виборів, нові Основні закони призвели до розколу між вигнанцями та населенням Суринаму."
  SUR.news.2.a:0 "І це ви кличете вільною державою?"

  SUR.news.3.t:0 "[Get_newspaper_header]Реорганізація Голландського королівства"
  SUR.news.3.desc:0 "З Парамарибо уряд Нідерландів в екзилі досяг угоди з Естатами Суринаму щодо політичного майбутнього королівства. У обмін на збільшення контролю корони над урядом Суринаму, уряд Нідерландів у екзилі вирішив саморозпуститися і надати Суринаму статус головної складової країни Королівства Нідерландів. Ця угода стала результатом місяців переговорів і інтегрує стару голландську політичну систему в уряд Суринаму.\n\nХоча угода отримала схвалення Об'єднаної індустанської партії Суринаму та меншості Національної партії, націоналісти в Естатах засудили закони як узурпацію суверенітету Суринаму. Крім того, включення голландських виборців у майбутні вибори Суринаму вказує на подвійні стандарти в новому уряді, що створює незручність для автономістів."
  SUR.news.3.a:0 "Компроміс - ось що ключове."

  SUR.news.4.t:0 "[Get_newspaper_header]Антиурядові протести в Суринамі"
  SUR.news.4.desc:0 "Протести в столиці Суринаму, Парамарибо, паралізували місто, оскільки обурення через корупцію в уряді прем'єр-міністра Йо Мейне продовжує змушувати людей виходити на вулиці. Демонстрації залишались ненасильницькими, але студенти та робітники фабрик проводили політичні демонстрації з вимогою відставки Мейне, і ці демонстрації лише зростають у чисельності. У відповідь на протести королева Юліана звільнила Мейне до проведення нових виборів у червні.\n\nХоча малоймовірно, що ця ситуація призведе до розслідування, відставка прем'єр-міністра була сприйнята Національною партією як перемога для демократії Суринаму. Наступні вибори вже сигналізують про свою важкість: різні сили своїми передвиборчими кампаніями дебатують про незалежність, а королівські привілеї поляризують виборців."
  SUR.news.4.a:0 "Проблеми в королівстві вигнанців."

  SUR.news.5.t:0 "[Get_newspaper_header]Конституційна криза в Суринамі"
  SUR.news.5.desc:0 "Політичне протистояння між королевою Юліаною та урядом прем'єр-міністра Суринаму Йохана Краага призвело до відставки Краага до нових виборів. Спір виник через бюджет 1969 року, запропонований Краагом і його Національною партією, який значно збільшив соціальні виплати та державні інвестиції при великому дефіциті. Хоча Крааг стверджував, що зростання та допомога ОВН компенсують накопичений борг, консерватори все ж забезпечили його відставку.\n\nВідставка Краага спричинила хвилю обурення в Естатах Суринаму, і члени Національної партії все більше ведуть кампанії на незалежницьких позиціях. Хоча прихильники незалежності не мають більшості в Естатах, питання королівських привілеїв поляризуватимуть вибори й надалі."
  SUR.news.5.a:0 "Вони що, не можуть дотримуватись обіцянок?"

  SUR.news.6.t:0 "[Get_newspaper_header]Голландська армія окуповує Парамарибо"
  SUR.news.6.desc:0 "Протести проти урядової корупції та голландського непотизму терзали Суринам впродовж кількох тижнів після нових викриттів зловживань уряду Йо Мейне. Демонстрації залишались ненасильницькими, але поширились за межі Парамарибо на периферійні міста та Нідерландські Антильські острови. Боючись, що ці заворушення можуть призвести до революції, офіцери Королівської армії Нідерландів захопили демонстрантів і почали швидке придушення антиурядових діячів та організацій. Прем'єр-міністр Мейне пішов у відставку, ймовірно, без бажання, і генерал-лейтенант Франс ван дер Веєн замінив його, очоливши хунту.\n\nВійськовий уряд регулярно повторює, що «Королівство Нідерландів» повернеться до демократії, хоча хунта поки що не надала жодних термінів. Наразі автономія та демократія в Суринамі були придушені силою."
  SUR.news.6.a:0 "Повернення до імперіалізму."
  
  SUR.news.7.t:0 "[Get_newspaper_header]Суринам голосує за незалежність"
  SUR.news.7.desc:0 "Через кілька годин після закриття виборчих дільниць по всьому Суринаму результати голосування підтвердили, що більшість суринамців проголосували за незалежність. Голландські експерти з опитувань та міжнародні спостерігачі довго вважали, що Суринам залишиться частиною голландської корони. Проте нещодавні антиурядові демонстрації та зростання підтримки націоналістичних партій сприяли тому, що виборці обрали незалежність.\n\nПро-незалежницькі фракції Національної партії похвалили результати як вираз демократії, у той час як голландський Християнсько-демократичний заклик почав евакуювати свої органи на Арубу. Незалежність Суринаму зменшила голландську корону до Нідерландських Антильських островів, які тепер є єдиною країною в королівстві, що колись охоплювало весь світ."
  SUR.news.7.a:0 "Кінець Нідерландів?"

  SUR.news.8.t:0 "[Get_newspaper_header]Суринам лишається частиною Голландії"
  SUR.news.8.desc:0 "Через кілька годин після закриття виборчих дільниць по всьому Суринаму результати голосування підтвердили, що більшість суринамців проголосували проти незалежності. Це не було сюрпризом для голландського уряду, який давно очікував, що голосування зазнає поразки, проте королева Юліана все ж звернулася з посланням, у якому прохала про примирення, для табору прихильників незалежності. У Парамарибо відчувалась суміш полегшення, розчарування і розпорошених сплесків гніву, але життя продовжилось.\n\nХоча націоналістичні партії Суринаму пообіцяли продовжувати лобіювати незалежність, представники Об'єднаної індустанської партії підтримали результати як основу для подальшої національної автономії. Ворожнеча через минулі образи все ще залишилася в свіжій пам'яті у багатьох суринамців, підживлюючи рух за незалежність. Однак наразі країна вирішила залишитися в складі королівства."
  SUR.news.8.a:0 "Можливо, примирення все ж можливе."

