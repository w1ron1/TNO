  # America Coup enabling
  USA_CIA_SUR_Coup_Mission_tt:0 "§mФБР§! §gотримає можливість допомогти§! §Oнідерландським вигнанцям§! §gу проведенні§! §Yреферендуму про незалежність Суринаму§!§g.§!"
  USA_CIA_prevent_suriname_independence:0 "§YОперація§! §QКОМПАС§!"
  USA_suriname_coup_tt:0 "Ми фінансуватимемо Нідерландську королівську гвардію, щоб гарантувати, що Суринам не випаде з нашої сфери впливу."
  USA_CIA_curacao_uprising_ARP: "§YОперація§! §sОБСИДІАН§!"
  USA_CIA_curacao_uprising_ARP_tt: "Ми підтримаємо нідерландські служби безпеки в їхніх зусиллях стримати повстання, водночас стежачи, щоб їхні репресії не вийшли з-під контролю."
  USA_CIA_curacao_uprising_SDAP: "§YОперація§! §sКЛЮЧОВИЙ КАМІНЬ§!"
  USA_CIA_curacao_uprising_SDAP_tt: "Ми спробуємо саботувати переговори в Суринамі та зберегти сильну UKN."
  USA_CIA_suriname_pro_independence_riots: "§YОперація§! §BСТІЛВАТЕР§!"
  USA_CIA_suriname_pro_independence_riots_tt: "Ми підтримаємо Королівську нідерландську поліцію в її зусиллях придушити заворушення в Суринамі."
  USA_CIA_suriname_general_strike: "§YОперація§! §eЯКІР§!"
  USA_CIA_suriname_general_strike_tt: "Ми підтримуватимемо переговори в Суринамі та спробуємо відколоти від основного робітничого руху рух, прихильний до уряду."



  # Ideas
  SUR_1947_Constitution:0 "Нідерландська конституція 1947 року"
  SUR_1947_Constitution_desc:0 "Конституція Королівства Нідерландів 1947 року, встановлена тоді, коли перспектива визволення батьківщини від Райху перетворилася на саму лише оманливу мрію, визначила різні частини Королівства у вигнанні. Через склад уряду ця конституція зрештою виявилася сильно схильною на користь екстериторіального нідерландського уряду у вигнанні. Завдяки цій конституції нідерландські вигнанці панують над рештою своїх володінь. Хоча це шалено дратує будь-якого такого вигнанця, який про це чує, цю систему найкраще порівняти з так званою "демократією панівної нації", практикованою в сучасній, закоханій у Німеччину державі Південної Африки."

  SUR_Runt_OFN:0 "Недоросток ОВН"
  SUR_Runt_OFN_desc:0 "Королівство Нідерландів широко висміюють як державу лише за назвою. Для пересічного спостерігача, навіть усередині Організації Вільних Націй, цей уряд у вигнанні є "недоростком ОВН", "жартівливою країною". Його повсюдно висміюють, особливо в столицях Європи та Азії, як "бляшану державу", нелегітимний колоніальний уряд у вигнанні та найжалюгіднішого з американських маріонеток.\n\nНідерландські вигнанці, з яких складається уряд Королівства, принаймні можуть неабияк наживатися на цих постійних ударах по їхньому самолюбству. Сполучені Штати використовують Організацію Вільних Націй, щоб винагороджувати їхню залежність."

  SUR_Countries_Within_a_Country:0 "Країни всередині країни"
  SUR_Countries_Within_a_Country_desc:0 "У нинішньому вигляді нідерландські володіння у вигнанні сформовані на користь білих нідерландських громадян, які складають практично весь їхній уряд і соціополітичну еліту. Ця прихильність приносить користь нідерландській меншості за рахунок суринамських та антильських підданих, хоча ці дві групи кожна окремо чисельно переважають нідерландців і разом складають більшість населення.\n\nЗайве казати, що такий нерівномірний розподіл влади призвів до значної й дедалі більшої внутрішньої напруженості. Це ще одна проблема, з якою Сполученим Штатам доводиться стикатися в обмін на їхню контрольну частку в останніх землях, що залишилися від старих Нідерландів."

  SUR_Fleeting_Dutch_Economic_Hegemony:0 "Минуще нідерландське економічне панування"
  SUR_Fleeting_Dutch_Economic_Hegemony_desc:0 "Стара нідерландська економіка мертва вже два десятиліття, а Райх, окупувавши батьківщину, безжально обірвав усі зв'язки, які вигнанці мали зі своєю втраченою країною. Ті небагаті жарини колись гегемонної нідерландської економіки, що ще жевріють, працюють зі зниженою потужністю та цілком зосереджені на дрібному виробництві й видобутку.\n\nЗі смертю старого світу постає новий світ, який має посісти його місце. Великі американські компанії користуються слабкістю своїх старіших нідерландських конкурентів і поширюють свій економічний вплив по всьому Суринаму, дедалі далі в міру плину днів."

  SUR_Countries_Within_a_Country_Reformed:0 "Країни всередині країни"
  SUR_Countries_Within_a_Country_Reformed_desc:0 "Історично нідерландські володіння у вигнанні були створені на користь білих нідерландських громадян, які домінували в їхніх інституціях. Проте цей стан речей поступово руйнувався на користь реформ, покликаних піднести суринамських та антильських тубільців. Урядові реформи, що передають владу обом островам на місцевому рівні, а невдовзі після цього нова адміністрація виступає за федералізацію. Хоча між нідерландцями та корінним населенням усе ще існує розрив, ці зусилля поступово його скорочують. У міру накопичення реформ на місцях поволі постає нова реальність."

  SUR_1972_Dutch_Constitution:0 "Нідерландська конституція 1972 року"
  SUR_1972_Dutch_Constitution_desc:0 "Конституція Королівства Нідерландів 1972 року, встановлена після того, як успішний референдум про незалежність Суринаму був анульований втручанням Нідерландської королівської армії, скасувала багато реформ 25-річного документа, що передував їй. Ці реформи були замінені встановленням високоцентралізованого диктаторського уряду.\n\nЗа цією новою конституцією нідерландські вигнанці панують над рештою своїх володінь ще більше, ніж до 1972 року. У цьому новому Королівстві у вигнанні привид європейського колоніального правління XIX століття в Латинській Америці з ревом повернувся до життя."

  SUR_1972_Surinamese_Constitution:0 "Суринамська конституція 1972 року"
  SUR_1972_Surinamese_Constitution_desc:0 "Нова Суринамська конституція 1972 року, встановлена після успішного референдуму про незалежність, перетворила острів на нову республіку. Хоча нідерландський політичний контроль зник, народ зберіг нідерландську парламентську модель. Під впливом найвидатніших вільних держав регіону парламентська модель була увінчана виконавчим президентством за американським і мексиканським зразками.\n\nЗавдяки цій конституції суринамський народ нарешті став господарем у власному домі. Новий світанок осяює Парамарибо своїм світлом, а суринамський народ святкує свій перший за дуже довгий час смак свободи."

  SUR_One_Paramaribo:0 "Один Парамарибо, багато народів"
  SUR_One_Paramaribo_desc:0 "Суринамці мають єдину національну ідентичність, але ця національна ідентичність містить у собі безліч складових: індостанців, афросуринамців, яванців, корінні народи й навіть кількох нідерландців, що залишилися. Ці народи пов'язані спільними мовами; нідерландська домінує у публічній сфері, а сранан-тонго звучить на вулицях (хоча уряд, усе ще перебуваючи під впливом колоніальних поглядів, соромиться визнавати саме існування цієї мови).\n\nНапруженість між окремими групами то спадає, то зростає, але відсутність чіткої етнічної більшості будь-якого виду змушує людей співпрацювати, навіть неохоче. Вони знаходять добре представництво в керівних партіях суринамської нації."

  SUR_Consolidated_Dutch_Economic_Hegemony:0 "Консолідоване нідерландське економічне панування"
  SUR_Consolidated_Dutch_Economic_Hegemony_desc:0 "Стара нідерландська економіка мертва вже два десятиліття, а Райх, окупувавши батьківщину, безжально обірвав усі зв'язки, які вигнанці мали зі своєю втраченою країною. Однак рештки цього колишнього гіганта нещодавно були розпалені до подоби їхнього колишнього стану.\n\nХоча старий світ мертвий, нідерландське економічне панування зберігається в новому світі, що постає на його місці. Значна частина старої економіки перетворилася на всеохопну корпоратократію, що володіє значною частиною економіки Суринаму та Антильських островів. Олігархічний капіталізм на нідерландський лад укорінюється, оскільки американські фірми змушені або координуватися з місцевими компаніями, або залишатися за бортом."

  SUR_Decolonizing_Economy:0 "Деколонізація економіки"
  SUR_Decolonizing_Economy_desc:0 "За занепадом старого порядку приходить піднесення нового способу ведення справ. Нідерландська політична система зникла, а разом із нею зникла й нідерландська економічна модель. Економіка Парамарибо колись була побудована на видобутку ресурсів для підтримання рівня життя вигнанців на Антильських островах. Проте з новим урядом у Парамарибо цей колоніальний канал відтоку замінила строката суміш іноземних компаній, державних підприємств і місцевих підприємців, які прагнуть забезпечити свої статки в цій новій незалежній країні. У цьому хаосі на тих, хто достатньо сміливий, щоб скористатися можливістю, чекає нагода."

  #SUR_Runt_OFN_desc:0 "Будучи одним із останніх чинних членів колишніх Союзних держав, уряд Королівства Нідерландів у вигнанні в Суринамі є членом Організації Вільних Націй. Однак через очевидні труднощі, пов'язані з існуванням уряду у вигнанні в уламку колишньої колоніальної імперії, він значною мірою залежить від масштабних позик та іншої допомоги, щоб утримуватися на плаву.\n\nУнаслідок потоку допомоги до Суринаму країна стала відомою як взірець ОВН, демократія, яку підтримали й змусили процвітати завдяки масштабній допомозі її вільних, демократичних союзників. Хоча це призвело до міцного економічного становища, ця міцність насправді крихка, оскільки країна дуже сильно залежить від допомоги ОВН."

  SUR_surinamese_independence: "Незалежність Суринаму"
  SUR_surinamese_independence_desc: "У часи до того, як Суринам став незалежним — або, можливо, це слід писати як "незалежним", — нинішні економічні нестатки вважалися похвальними та ознакою доброзичливості Організації Вільних Націй до країни. Для Республіки Суринам сьогодні вони є не чим іншим, як тягарем.\n\nНідерландці номінально 'пішли', але приватні нідерландські кошти й досі контролюють значну частину молодої економіки Суринаму. Інвестиційні плани регіональних держав Латинської Америки обіцяють з часом кинути виклик статус-кво, але факт залишається фактом: шлях до справжньої незалежності лише розпочався."

  CUR_Exiles_in_the_Antilles: "Вигнанці на Антильських островах"
  CUR_Exiles_in_the_Antilles_desc: "Було б добре вірити, що це вигнання лише тимчасове, що добро переможе зло і настане день, коли вигнанці покинуть цей чужий берег. Можна майже уявити той день у якомусь далекому майбутньому, коли чоловіки й жінки стоятимуть скупчені на палубі якогось великого корабля, витираючи сльози з очей, коли повертатимуться додому. Вони дивляться на пляжі, дамби, дюни. Вони прибувають до незайманого Амстердама, відновленого до його давньої слави, і отримують квіти та лаври на знак вітання з поверненням до відродженої нації.\n\nАле ця мрія — брехня. Це омана. Нідерланди не буде відновлено. Повернення з вигнання не буде. Не буде усміхнених облич, братніх обіймів чи щасливих сліз. На посушливих пляжах Аруби на королівство, яке колись панувало над хвилями та контролювало світову торгівлю, чекають лише гниття й спустошення.\n\nТож королева та її двір і далі тулятимуться у своєму яскраво розфарбованому палаці, чіпляючись за свої егоїстичні фантазії, поки світ проходить повз них. Вони видаватимуть укази, яких ніхто не почує, поки врятовані Рембрандти тріскатимуться у своїх рамах, а тканини Vilsco вицвітатимуть під жорстоким сонцем. І вони відгородяться від зростаючого гніву та розчарування тих, кого вони витіснили з Аруби. Вони ігноруватимуть тих, хто проклинає їхні імена та їхні претензії на шляхетну жертовність, аж доки не стане надто пізно і мрія, якою було Королівство Нідерландів, нарешті не зникне назавжди."

  CUR_Dependent_Economy:0 "Залежна економіка"
  CUR_Dependent_Economy_desc:0 "Королівство Нідерландів існує лише за назвою. Його повсюдно висміюють, особливо в столицях Європи та Азії, як "паперову державу", найжалюгіднішого з американських маріонеток. Відокремлення Суринаму підтвердило це враження, і тепер воно відображається в його економіці.\n\nТепер, коли Парамарибо йде власним шляхом, острівні рештки нідерландських володінь повністю залежать від американської підтримки. Ті небагаті галузі, що існували на карибських островах, які складають так зване Королівство, підтримуються американськими субсидіями. На американців також покладаються в забезпеченні вільного доступу до розкошів Старого Світу, яких досі прагнуть нідерландські вигнанці, яким у ці дні більше нема за що чіплятися."

  SUR_1971_Constitution: "Конституція 1971 року"
  SUR_1971_Constitution_desc: "Амстердам було втрачено, і зелені поля Голландії більше ніколи не постали б перед очима вигнанців. Але вони все ще могли втішатися тим, що принаймні залишалися вільними й демократичними, як їхні батьки після поразки іспанського правління.\n\nБільше ні. Новий військовий уряд, встановлений переворотом і такий, що заявляв про "збереження надії та сили для нідерландського народу", написав конституцію, яка фактично придушила п'ятсот років демократичної традиції. Колишні демократичні інституції були обмежені в спосіб, який міг би змусити навіть Сомосу чи Морініґо замислитися. Колоніальна автономія та права громадян колоній були знищені.\n\nВійськовики можуть переконувати себе — або, точніше, намагатися й не спромогтися це зробити, — що, вдаючись до того, що цілком обґрунтовано називають святотатством, вони врятували те, що залишилося від Королівства Нідерландів. Але насправді ці чоботи створили порожнечу й конфлікт серед останніх вільних голландців, рану, яка не загоїться, навіть якщо якимось чином Нідерланди буде звільнено, а Королівський штандарт знову замайорить над Палаїс Амстердам."

  # Events

  SUR.skeleton.6.t: "Марш Суринаму" # For america about the upcoming referendum
  SUR.skeleton.6.desc: "Після третього прольоту над королівським комплексом у нідерландській Арубі пілот гелікоптера без розпізнавальних знаків Жирара Доусона дійшов висновку, що біля палацу немає місця, придатного для посадки такого великого літального апарата. Доусон, керівник бюро ФБР у Парамарибо, запитав, якою буде альтернатива, якщо вони не зможуть приземлитися. "Ми повертаємося до Ораньєстада", — запропонував пілот, — "або ви поплаваєте". Не вагаючись, Доусон почав застібати на собі рятувальний жилет і вказав пілотові на яхту, що стояла біля причалу.\n\nКоли гелікоптер опустився достатньо низько, Доусон стрибнув у воду, збиту гвинтом, і почав плисти до берега крізь потоки бризок. Вибравшись на тверду землю, мокрий агент ФБР побачив своїх контактів, принца Бернгарда та гурт генералів Королівської армії, які бігли йому назустріч. Після поїздки автомобілем і теплого душу Доусон уже сидів із групою на сусідній веранді, попиваючи портвейн, коли генерал Франс ван дер Вен озвучив неприємне прохання. "Як вам відомо, Генеральні штати Суринаму нещодавно проголосували за проведення референдуму про незалежність Суринаму", — сказав генерал крізь стиснуті цигаркою губи, — "і ми хочемо його зупинити". Повітря наповнили хихотіння та дзенькіт келихів.\n\nЦі старі ватажки нідерландської реакції з презирством ставилися до автономії Суринаму й прагнули американської підтримки в "забезпеченні" майбутнього Королівства. Генеральні штати Суринаму де-факто були законним парламентом Нідерландів, а отже, американське втручання з метою повалення уряду члена ОВН порушило б статут ОВН. Водночас незалежний Суринам неодмінно опинився б поза ОВН. Доусон обмірковував прохання та його наслідки."
  SUR.skeleton.6.a: ""Я передам ваше прохання далі.""

  SUR_skeleton.9.t: "Референдум про незалежність"
  SUR_skeleton.9.desc: "-КОНФІДЕНЦІЙНО-\n\nВІД СУРИНАМСЬКОГО БЮРО ФБР\n\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: РЕФЕРЕНДУМ ПРО НЕЗАЛЕЖНІСТЬ У СУРИНАМІ\n\nКоролівство Нідерландів у вигнанні (UKN) вже давно існує в конституційній невизначеності. Хоча UKN було реорганізовано у вигнанні, парадокс "Вільних Нідерландів", які підтримують примарне існування через свої колонії, призвів до значних тертя.\n\nГенеральні штати Суринаму, зокрема, давно конфліктують з урядом UKN. Співпраця Парамарибо є критично важливою для подальшого функціонування нідерландських володінь, однак нідерландська монархія давно не любить необхідності так тісно працювати з Парамарибо, оскільки цілі вигнанців часто відрізняються від цілей місцевих жителів.\n\nНещодавно ці напруження загострилися через скандали, пов'язані з елітою у вигнанні, які сягнули навіть принца Бернгарда, чоловіка королеви Юліани (деталі на стор. 3). Ці скандали, а також дедалі активніша участь корони в законодавстві та управлінні змусили Генеральні штати обрати радикальний курс дій.\n\nТиждень тому Парамарибо оголосив, що проведе референдум про незалежність Суринаму. Опитування (див. додаток А) свідчать, що цей референдум, імовірно, буде успішним, фактично знищивши UKN. Хоча королева Юліана офіційно дала своє благословення, TULIP повідомляє, що приватно вона вкрай занепокоєна і її, можливо, можна переконати перешкодити цьому процесу. Успіх цього референдуму буде вкрай шкідливим для американських інтересів у регіоні, тому для забезпечення його провалу рекомендується заручитися співпрацею королеви, а також застосувати більш прямі методи впливу."
  SUR_skeleton.9.a: "Підтримувати вогонь свободи, по одній кампанії за раз."

  SUR_forpol.0.t: "Нідерландські вибори 1963 року"
  SUR_forpol.0.desc: "МЕМОРАНДУМ ДЕРЖДЕПАРТАМЕНТУ \nВід: Джона С. Райса До: Президента [GetPresidentLastName]\nТема: Американська позиція щодо нідерландських виборів\n\nВибори нового нідерландського парламенту мають відбутися без перешкод. Зусилля Держдепартаменту з підтримки самовизначення дали неоднозначні результати. Нідерландський істеблішмент навколо королеви Юліани прагне відновити певну демократичну функціональність і свободи, але також хоче забезпечити більший контроль над політикою місцевих Генеральних штатів Суринаму. Розбіжності щодо того, як досягти цієї мети, призвели до появи двох окремих, протилежних сил.\n\nКонсервативні роялісти на чолі з Жераром Гелдерсом прагнуть зберегти статус-кво й керувати Суринамом так само, як вони робили до вигнання, як колоніальним підданим. Їм протистоїть коаліція реформаторів на чолі з Іво Самкалденом, яка прагне забезпечити лояльність Суринаму через політичну інтеграцію. Обидва лідери домагаються схвалення королеви, щоб вплинути на вибори.\n\nРезультати виборів, імовірно, вплинуть на наше становище в Карибському басейні. Агенти посилили тиск на королеву, щоб вона підтримала інтеграцію своїх колоніальних підданих, оскільки продовження королівського правління підірве та делегітимізує наші зусилля з розвитку демократії в регіоні. Дипломатичні зусилля буде подвоєно, щоб забезпечити стабільну передачу влади. "
  SUR_forpol.0.a: "Нідерландське втручання в тропіках? Нічого нового." 
 
  SUR_forpol.1.t: "Потрясіння в Парамарибо"
  SUR_forpol.1.desc: "Сьогодні народ Суринаму прокинувся від антиурядових протестів у Парамарибо. Демонстрації були спричинені скороченням бюджетних витрат на внутрішні служби колонії для покриття зростання монархічних видатків. Найбільш кричущими витратами королеви Юліани були витрати на цілительку Ґріт Гофманс, яка таємно здобула величезний вплив при її дворі та спричинила серйозний розкол у королівській родині. Нідерландський уряд відповів протестувальникам переважаючою силою поліції, негайно розігнавши суринамців з вулиць. Надмірна жорстокість Королівської нідерландської поліції викликала ще більше обурення, що призвело до формування нових груп, прихильних до незалежності.\n\nФБР повідомляє, що рух за незалежність усе ще перебуває на зародковій стадії: його чисельність невелика, а підтримка слабка, але попереджає, що з часом ситуація, ймовірно, загострюватиметься. Без суттєвої зміни нідерландської політики подальша експлуатація суринамців породжуватиме дедалі більше обурення нідерландським правлінням. Майбутні королівські скандали можуть спричинити нестабільність з боку зміцнілого руху за незалежність, що загрожуватиме нашій репутації за кордоном, а також діловим інтересам у регіоні. Агенти ФБР наразі допомагають придушувати лідерів активістів для підтримання порядку та продовжуватимуть стежити за розвитком подій."
  SUR_forpol.1.a: "Королева радилася з шарлатаном?!"

