  SUR_forpol.3.t: "Нідерланди в ОВН"
  SUR_forpol.3.desc: "ОБМЕЖЕНО/[GetDateText]\n\nВІД АГЕНТА CLOVES\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ВІДОМОСТІ ПРО КОРОЛІВСТВО НІДЕРЛАНДІВ\n\n1. Прем'єр-міністр Королівства Нідерландів Гелдерс посилив політику "демократії панівної нації" щодо нідерландських володінь після виборів 1963 року, що й надалі залишається постійним предметом суперечок між вигнанцями та корінним населенням Суринаму й призвело до поширення руху за незалежність.\n\n2. Гелдерс у нещодавніх інтерв'ю заявив про намір зберегти нідерландський парламент як законодавчий орган для всіх володінь; Генеральні штати Суринаму зберегли б свою дорадчу роль без законодавчих повноважень, зменшуючи вплив активістів незалежності законними засобами.\n\n3. Внутрішня ситуація в Суринамі з точки зору умов життя стала одним із чинників зростання розколу. Нідерландські вигнанці переважно проживають у закритому житловому комплексі в центральній частині Парамарибо, тоді як корінне населення майже не перетинається з вигнанцями. Закритість і відмова двох невеликих спільнот співпрацювати призвели до стагнації економіки Суринаму.\n\n4. Суринам має значні запаси нафти на своїй території, однак йому бракує сучасної інфраструктури для розвитку нафтопереробки та отримання прибутку. Royal Dutch Shell, компанія-відгалуження колишньої англо-нідерландської групи підприємств, має намір співпрацювати з американськими нафтовими компаніями для будівництва острівних нафтопереробних заводів. Міжкорпоративний контракт може дати економіці Суринаму шанс на порятунок, але водночас легітимізувати їхню політику сегрегації."
  SUR_forpol.3.a: "Дозволити угоду."
  SUR_forpol.3.b: "Сказати нашим людям не укладати жодних угод."

