  SUR_forpol.19.t: "Суринамські заворушення придушено"
  SUR_forpol.19.desc: "Коли люті протести охопили Парамарибо навколо бази Піта, йому та його взводу наказали залишатися в казармах до подальшого повідомлення. Він не знав, що думати про протести. Він був сином нідерландських вигнанців, і все його життя було присвячене збереженню того, що залишилося від вільного Королівства Нідерландів. Але служба в армії породила багато запитань, на деякі з яких йому не хотілося відповідати, а скандовані гасла проникали крізь стіни бази прямо в його думки. Тож він проводив час із товаришами в казармі, граючи в карти й сподіваючись, що їх не покличуть придушувати протести.\n\nІ це спрацювало. Сьогодні вранці Піту сказали, що ситуація достатньо заспокоїлася, щоб дозволити йому триденну відпустку. Тоді він відчув полегшення, але, вперше за надто довгий час вийшовши з бази, відчув, як живіт скрутило у вузол. Вулиці, зазвичай гомінливі й метушливі, були не просто тихими: вони були безлюдними. На деяких центральних магістралях єдиними супутниками Піта були обгорілі шини та розтоптані плакати протестувальників. На інших уздовж дороги все ще стояли поліцейські барикади й машини, кидаючи на нього суворі погляди, коли він проходив повз.\n\nКоли він нарешті прийшов додому, Піт помітив сьогоднішню газету, що лежала на дивані його батька. Він підняв її, намагаючись зрозуміти, що сталося за час його відсутності. У газеті повідомлялося, що протестний рух розпався через внутрішні чвари: одні закликали до розширення автономії, тоді як інші засуджували їх і вимагали повної незалежності. Це, у поєднанні з "ефективною та цілеспрямованою реакцією поліції на безлад", змогло повернути порядок у Суринам. Звіт завершувався обіцянкою прем'єр-міністра розв'язати корінні причини заворушень.\n\nПіт відкинувся назад і заплющив очі. Знову це. Уряд розпочав свій термін із грандіозних обіцянок модернізувати Нідерланди, і щоразу робив рівно стільки, щоб відвернути катастрофу."
  SUR_forpol.19.a: "Що станеться, коли цього буде недостатньо?"

  SUR_forpol.20.t: "Суринамські заворушення приносять поступки"
  SUR_forpol.20.desc: "Піт повернувся додому після шести виснажливих тижнів на базі, де тренувався й працював, очікуючи, що їх покличуть придушити стрімко наростаючі заворушення за межами бази. Зловісне передчуття того, що його зрештою покличуть бити або навіть стріляти у своїх співгромадян, уже кілька днів нависало над Пітом, скільки б разів він не казав собі, що це небезпечні радикали, які розривають володіння на частини.\n\nА потім, ось так просто, протести розійшлися. Піт знав уривки — поліція була неефективною, а за чутками на базі Америка утримувала допомогу, доки не буде надано поступки. Тепер він нарешті мав час прочитати газету, яку придбав у найближчому кіоску, час усе осмислити. Час подумати.\n\n"Генеральні штати дозволяють голосування за незалежність." Він уже бачив ці слова, коли купував газету, але тоді їхнє значення ще не дійшло до нього повною мірою. Тепер же в животі Піта росло важке відчуття, страх такого роду, якого він ніколи раніше не відчував, але раптом зрозумів, що його батьки знали його дуже добре. Він народився в Суринамі в родині нідерландських вигнанців, які залишили батьківщину, коли над нею навис нацистський терор. Це був єдиний дім, який він знав, але для його батьків це був лише притулок, колода, за яку вони хапалися під час бурі, що обрушилася на їхнє життя. Тепер Піт відчував, що буря насувається і на нього.\n\nПіт похитав головою. Це було інше. Це були не нацисти, які прийшли пограбувати його народ і забрати його землю — це були люди, які жили тут задовго до його народження, задовго до того, як сюди взагалі прийшов хоч один нідерландець. Вони лише хотіли, щоб до них ставилися з гідністю, щоб знати, що уряд підзвітний їм, а не далекій еліті, здатній діяти з абсолютною безкарністю, що справа Бернгарда продемонструвала надто виразно. А тепер незграбні спроби уряду Мейненa перекласти провину руйнувалися навколо них. Це було природно, логічним кінцем глибокої гнилизни, яку Піт знав надто добре."
  SUR_forpol.20.a: "Але важке відчуття залишилося."

