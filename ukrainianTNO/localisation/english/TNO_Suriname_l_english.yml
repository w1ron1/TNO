  SUR_forpol.22.t: "Нідерландці припиняють загальний страйк"
  SUR_forpol.22.desc: "Піт знову стояв біля воріт казарми в Парамарибо, але похмуре небо нависало над порожньою вулицею. Там, де колись безліч нідерландських та суринамських чоловіків і жінок заповнювали вулицю, мов стрімкий приплив, що загрожував прорвати береги й утопити його своєю масою, тепер звук автомобіля поліції, що проїжджав повз, здавався оглушливим.\n\nПевною мірою Піт, безперечно, відчував полегшення. Тепер він був досвідченим солдатом, але бути єдиною перешкодою між масами протестувальників і військовою базою ніколи не було приємним досвідом, навіть якщо можна було розраховувати, що він не втратить самовладання. Те, що столиця звільнилася від паралічу, теж було добре, вирішив він. Багато чесних людей могли бути розлючені урядом, але вони також хотіли заробляти собі на хліб, і тепер могли це робити, не будучи таврованими штрейкбрехерами чи зрадниками.\n\nАле відчуття, яке Піт пережив того пекучого дня, коли натовп протестував перед ним, не полишало його. Це було відчуття праведного гніву скривдженого народу, солідарності між групами, що об'єдналися заради кращого майбутнього. Це було відчуття сили. Воно лякало — але навіть по той бік барикади в ньому було щось захопливе.\n\nА тепер, коли все закінчилося, Піт не міг не відчувати певного смутку й навіть сорому. Ці люди боролися за краще майбутнє, і навіть якщо деякі з них були оманливими радикалами, він вважав, що більшість із них просто хотіла найкращого для Суринаму, та й для нього також. Він міг зрозуміти їхню сторону — він надто добре стикався з численними провалами нідерландського уряду. А те, як уряд поводився зі страйком — безперервне переслідування лідерів і закулісні угоди з фіктивними робітничими організаціями та роботодавцями — ну, це спрацювало, але здавалося глибоко неправильним."
  SUR_forpol.22.a: "Він не був певен, хто має рацію, але відчував, що сам перебуває не на тому боці."

  SUR_forpol.23.t: "Загальний страйк скидає уряд Суринаму"
  SUR_forpol.23.desc: "Піт і Йо сиділи в їдальні своєї казарми, мляво колупаючись у їжі та обговорюючи останні події в Парамарибо. Вони були не єдиними — це була головна тема розмов серед солдатів навколо них у просторій залі, де відлунював вир думок та емоцій.\n\n"Я думаю, це добре, знаєш?" — сказав Йо, граючись виделкою замість того, щоб дивитися Піту в очі. "Королеві треба було показати, що вона не може просто ігнорувати народ. Страйки були хаотичними, так. Але тепер знову є законний уряд. А щодо незалежності... ну, ось що отримуєш, коли відчужуєш людей, які тут живуть."\n\nПіт встромив виделку у свою яловичину. "То ти хочеш, щоб це пройшло?"\n\nЙо всміхнувся. "Ні, Піте. Але я не думаю, що це станеться, розумієш? Це просто дозволить людям випустити пару, перш ніж вони повернуться до нормального життя."\n\n"А що, як пройде, Йо? Що станеться з Нідерландами? Що станеться з нами?"\n\n"Життя триватиме, Піте. Усе буде добре. Ніхто нас не вижене."\n\nПіт кинув столові прибори на стіл. "Ти не розумієш. Що станеться, якщо остання вільна частина Нідерландів просто... здасться? Що подумають люди в Амстердамі? Що подумають мої батьки та твоя мама? Як ми можемо просто дозволити нашій країні зникнути ось так?"\n\nЙо скривився. "Я знову ж таки не думаю, що це станеться. А якщо станеться... можливо, це означатиме, що Нідерланди вже зникли..."" 
  SUR_forpol.23.a: ""Ми просто ще не усвідомили цього."" 

  SUR_forpol.24.t: "ОВН призупиняє членство Королівства Нідерландів"
  SUR_forpol.24.desc: "ВРАХОВУЮЧИ занепокоєння щодо процесу незалежності потенційної Республіки Суринам та ширші обставини управління й унікальне географічне становище Нідерландів,\nВІДЗНАЧАЮЧИ, що Королівство Нідерландів усе ще переважно окуповане Великоґерманським Райхом, і закликаючи Германію відновити його повну незалежність відповідно до Резолюції 04/1947,\nВИЗНАЮЧИ ризик, який економічна та географічна нестабільність становить для населення Нідерландів і для населення Суринаму,\nНАГОЛОШУЮЧИ на важливості статті 4, відповідно до якої ідеали народного суверенітету та демократії є центральними засадами цієї спілки,\nПІДКРЕСЛЮЮЧИ ширші проблеми дискримінації та нерівності в Нідерландах на расовому ґрунті,\n\nОрганізація Вільних Націй цим;\n1. Безстроково призупиняє членство Нідерландів, доки їхня військова хунта не буде розпущена, разом із усією військовою співпрацею;\n2. Закликає поважати референдум про незалежність Суринаму та помилувати націоналістів, які нині перебувають у в'язниці;\n3. Підтримує скасування законів, що перешкоджають людям певних рас повною мірою брати участь в усіх аспектах нідерландського суспільства;\n4. Закликає всіх членів усередині організації вжити швидких заходів, щоб забезпечити повне виконання всіх цих засад."
  SUR_forpol.24.a: "Підписано [?global.date.GetDateStringNoHourLong]"

  SUR_forpol.25.t: "Розгортання нідерландських вигнанців на Гаїті"
  SUR_forpol.25.desc: "Сполучені Штати далеко не єдина держава в Карибському басейні, яка прагне стримувати інтереси, пов'язані з країнами Осі, у регіоні, що видно з численних військових місій, які прибувають до Порт-о-Пренса після початку війни з Домініканською Республікою. Не бажаючи залишатися осторонь навіть після падіння Нідерландів у Другій світовій війні, уряд Нідерландів у вигнанні в Суринамі взявся за зброю на Гаїті, хапаючись за шанс уперше з 1940 року зустрітися з елементами старого ворога.\n\nНавчені американським військовим аташе боротьбі з повстанцями, сили дорадчого контингенту на Гаїті переважно складаються з нідерландських, арубанських та суринамських військовослужбовців, серед інших вигнанців. Усі вони чудово навчені COIN, усі більш ніж готові й здатні зустрітися з домініканцями, де б ті не перебували.\n\nСупроводжуючи американські та гаїтянські сили вглиб гір внутрішнього Гаїті, нідерландські солдати у вигнанні, попри хитке становище нідерландського режиму в Суринамі, все ж зберігають високий бойовий дух і бойову майстерність, не поступаючись практично будь-яким коаліційним силам в ОВН. До зламу залізної хватки Райху над європейськими низовинами та повернення до Роттердама ще дуже далеко, але нідерландський експедиційний корпус на Гаїті нагадує силам, прихильним до Осі, на випадок, якщо Германія забула, що їхні колишні сусіди з Голландії про них не забули."
  SUR_forpol.25.a: "Вже не такі нейтральні."

  SUR_forpol.26.t: "Посередині"
  SUR_forpol.26.desc: "Бурський солдат утретє повторив те, що знав про свою структуру командування, його нідерландська була вільною, але з сильним акцентом. Фінн побіжно знав цей акцент, достатньо, щоб передати слова солдата похмурому американцеві, що стояв ніс до носа з молодим буром. Офіцер Бланшет на мить наче став ще суворішим, перш ніж повернутися до двох перекладачів. "Це не має більше сенсу, ніж минулого разу, коли ти мені це розповідав."\n\nСправді, більше сенсу не було. Солдат вставив у своє пояснення кілька каламбурів, зрозумілих лише нідерландською. Через це переклад вийшов... безладним. Американець ставав дедалі стриманішим (чи розгубленішим — важко було сказати), оскільки з кожним поясненням каламбури ставали витонченішими. Навіть Фінну було важко зрозуміти деякі з них, а він мав диплом із цієї мови. Альфред лише трохи сміявся; старшому перекладачеві подобалося обмінюватися мовними шпильками з харизматичним буром.\n\nБланшет подивився на старшого чоловіка. "Що тут смішного, що він сказав?"\n\nАльфред у свою чергу подивився на полоненого солдата й сказав: "Він питає, що тут смішного, синку. Що мені відповісти?" Бур зосереджено глянув на нього, раптом усміхнувся й відкрив рота, але його перервав крик американця: "Не братайтеся з полоненим солдатом! Що ви взагалі собі думаєте!"\n\nФінн зблід, але Альфред залишився незворушним. "Я думаю, це чудова нагода поговорити з майстром моєї прекрасної мови так далеко від дому. Я надто довго служив у KNIL, намагаючись розмовляти з індонезійцями, які не говорять нідерландською ані слова." Він запалив цигарку й продовжив: "Я насолоджуюся, офіцере. Спробуйте якось."\n\nБланшет подивився на старого перекладача, потім на Фінна."
  SUR_forpol.26.a: ""Можемо ми просто продовжити?""

  SUR_forpol.27.t: "Нідерландські вигнанці допоможуть де Голлю в Африці"
  SUR_forpol.27.desc: "Після американського втручання в Західній Африці інші держави ОВН наслідували Вашинґтон, підтримавши Шарля де Ґолля в його протистоянні паннаціоналістам у Камеруні та їхнім покровителям у Токіо. Замкнені в подібній боротьбі за легітимність зі своїми аналогами — колабораціоністами країн Осі в Західній Європі, — нідерландські вигнанці в Суринамі на запрошення де Ґолля погодилися відправити власні війська на допомогу Вільній Франції проти Панафриканського блоку.\n\nНеважко побачити, як пріоритети нідерландських вигнанців перегукуються з пріоритетами Вільної Франції, навіть попри те, що нідерландському уряду у вигнанні порівняно легше було утверджувати легітимність проти Райхскомісаріату в Роттердамі, ніж уряду де Ґолля проти режиму Віші. І нідерландські вигнанці, і Вільні французи мають спільну історію трагедії та опору, тому цілком правильно посилити місію де Ґолля заради французької свободи, так само як вони сподіваються, що Вільна Франція зробить те саме для окупованих народів Нідерландів.\n\nОднак це дуже пишномовний спосіб представити уряди у вигнанні Франції та Нідерландів, оскільки колоніальні основи обох адміністрацій важко ігнорувати, особливо у Сполучених Штатах. Уряд де Ґолля в Західній Африці, як і роль Сполучених Штатів у підтримці його адміністрації, давно піддається осуду на організованих протестах, прихильних до африканських тубільців на Березі Слонової Кістки, а деякі навіть віддають перевагу зусиллям панафриканістів у Камеруні.\n\nПодібні голоси, що виступають за незалежність Суринаму від нідерландського колоніального правління, поволі збирають прихильників, і ця підтримка лише посилилася після втручання нідерландських вигнанців у Західній Африці, оскільки поглиблення співпраці зміцнює публічний образ нідерландських вигнанців разом із де Ґоллем, включно зі зростанням опозиції до участі США разом із нідерландцями в Суринамі."
  SUR_forpol.27.a: "США, де Ґолль, нідерландські вигнанці — усі вони будуть виправдані, коли солдати ОВН пройдуть парадом через Роттердам, просто дайте цьому час!"

  SUR_forpol.28.t: "Вигідні відносини"
  SUR_forpol.28.desc: "США та Нідерланди уклали новий союз, ширший за те, що пропонує ОВН, формалізувавши відносини, раніше побудовані на послугах і політичних маневрах. Головна мета Договору про оборону — забезпечити зобов'язання США щодо оборони нідерландських територій в Америці та Новому Світі загалом. Вони також відправлятимуть офіцерів для допомоги в навчанні та забезпечуватимуть регулярні поставки нового, найсучаснішого військового обладнання.\n\nУгода стала можливою лише завдяки тиску іноземного втручання в Америку та нещодавньому повстанню на Кюрасао 1969 року. Договір про оборону ледь не загинув у комітеті, але послуги союзників президента в Сенаті забезпечили його проходження без перешкод і з напрочуд малим висвітленням у ЗМІ.\n\nПрезидент і нідерландський прем'єр-міністр мають зустрітися за зачиненими дверима, щоб обговорити деталі другої половини угоди: військові бази в Нідерландах. Нові спеціальні права на розміщення баз, які мають перевагу над попереднім нідерландським законодавством у сфері зовнішніх відносин, запроваджуються, щоб дати Америці опору біля самого серця Європи. Вони докладають значних зусиль, щоб тримати цю частину угоди здебільшого в таємниці, а місця розташування баз переважно є засекреченою інформацією.\n\nДодатковий пункт, прихований у договорі, також передбачає розміщення значної частини американського ядерного арсеналу в Нідерландах."
  SUR_forpol.28.a: "Тінь свободи простягається через Атлантику."

  SUR_forpol.29.t: "Це складно"
  SUR_forpol.29.desc: "Генерал Олівер нахилився вперед у кріслі, зосередившись на обрізанні сигар для себе та суринамських чиновників. "Як я вже казав, я вважаю вашу пропозицію надзвичайно щедрою. Я лише хвилююся, як ваша присутність тут вплине на наші відносини з Хаттою. Я не хочу, щоб він відчував, ніби не веде власну війну."\n\nЛідер нідерландського контингенту кивнув, запалюючи сигару й роблячи задоволену затяжку. "Саме тому я пропоную лише допоміжний персонал. У нас є чиновники, знайомі з цією землею та її народом: перекладачі, навігатори, картографи, кілька бюрократів, які допоможуть Хатті організувати його уряд. Жодного пострілу, лише міцний нідерландський каркас. Достатньо, аби наша присутність і наша підтримка тут були добре відомі, а ви допомогли припинити деякі неприємні розмови."\n\nГенерал примружив очі, коли один із чоловіків передав йому аркуш із деталями 'розмови', яку нідерландці сподівалися придушити. Переважно це була пропаганда щодо деяких їхніх не надто сприятливих дій під час колоніальної епохи в регіоні. Це було неприємно, Хатті це не сподобалося б, але вони справді могли скористатися підтримкою Суринаму. Він кивнув і сказав: "Думаю, це можна організувати. Гадаю, ви також хочете, щоб ваші репортери мали повний доступ? Щоб вони могли документувати вашу 'помсту' Японії."\n\nНідерландський лідер злегка насупився через наголос, який генерал поставив на цьому слові, але все одно кивнув, посунувши через стіл повну угоду, доповнення до якої якимось чином уже було на місці. "Так, ми захочемо отримати стільки, скільки ви можете дати. Ваша підтримка в обмін на нашу."\n\nОлівер потер обличчя й довго затягнувся сигарою. Хатті це не сподобається."
  SUR_forpol.29.a: "Він усе одно поставив свій підпис."

  SUR_forpol.30.t: "У джунглі"
  SUR_forpol.30.desc: "Американський посол приготувався до жорсткої посадки на крихітній злітній смузі посеред південноамериканських джунглів. Маленький гвинтовий літак був єдиним, що міг дістатися до цих дещо віддалених, але надзвичайно важливих баз у Суринамі. Останні кілька днів він провів, спостерігаючи за спільними військовими навчаннями ОВН, які проводили морські підрозділи та ескадрильї авіації перехоплення. Тепер він мав оглянути умови, у яких перебували сухопутні війська.\n\nВийшовши з літака, він був вражений тим, скільки прапорів майоріло по всьому табору, і на мить відчув гордість. Саме зовнішньополітична діяльність, у якій він сам відіграв певну, хоч і невелику, роль, призвела до такого скупчення. Він швидко повернув собі професійну поставу й попрямував до американського прапора, тримаючи в руці планшет.\n\nСмердючий запах інфекції доносився з американської частини табору, змусивши посла негайно насупитися. Невже тут розміщували всіх хворих табору? Відповідь була негайною. Ні. Просто так багато американців захворіло, що вони вже вийшли за межі медичних наметів. Посол, забувши про планшет, кинувся вимагати повного звіту.\n\nЗаглиблюючись в американський табір, він виявив його в повному занепаді. Критично важливе обладнання було складене в багнюці просто неба, явно зламане. Форма була продірявлена колючками, а підошви чобіт стерті до плаского стану. Посол зробив фотографії своєю маленькою камерою для звіту, а також одну особисту для себе. Американський, нідерландський та австралійський солдати сиділи разом і грали в карти.\n\nВін швидко зібрав потрібні звіти й з'ясував, коли наступний літак вирушає на Арубу."
  SUR_forpol.30.a: "Час забиратися з джунглів якомога швидше."

  SUR_forpol.31.t: "Незалежність Суринаму зазнала поразки"
  SUR_forpol.31.desc: "ТАЄМНО/[?global.date.GetDateStringNoHourLong]\n\nВІД ЧАРЛІ ПЕЙСА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: Результати суринамського референдуму\n\n1. Наші зусилля не дозволили Суринаму відокремитися від Нідерландів. Хоча націоналістична кампанія за останні кілька років досягла реальних успіхів, цього було недостатньо, щоб подолати пророялістський тиск. Це, ймовірно, посилить претензії Юліани та [SUR.GetLeader] на легітимність, але не знищило націоналізм остаточно.\n\n2. Націоналістичні сили були сильними, але не мали тієї інституційної підтримки, яку мав укорінений уніонізм. Сама Юліана не співпрацювала, і ці настрої були широко поширені всередині країни. Наші агенти повідомляють, що численні антироялістські опорні пункти зазнали значного залякування з метою змусити їх підтримати уніонізм, тоді як деякі репортери наголошують на невеликих, але вирішальних порушеннях.\n\n3. Більшість націоналістів наразі надто пригнічені, щоб продовжувати боротьбу за незалежність, але розчарування залишається високим, і малоймовірно, що [SUR.GetLeader] проводитиме подальші реформи. Монархія непопулярна, що може підживлювати антиамериканізм, але наразі жодного зв'язку не існує, і ця думка набуває нової популярності. Якщо Суринам не зміг виникнути з цього, можливо, ще може виникнути Нідерландська Республіка."
  SUR_forpol.31.a: "Чим більше змінюється Парамарибо, тим більше все залишається незмінним."

  ### News Events
  SUR_news.1.t:0 "[Get_newspaper_header]Смерть королеви Вільгельміни"
  SUR_news.1.desc:0 "Королева Нідерландів Вільгельміна, вигнана до Суринаму, померла від зупинки серця у своїй тимчасовій резиденції в Парамарибо, де вона перебувала відтоді, як уряд у вигнанні перебрався до Карибського басейну. Її смерть не стала несподіванкою: Вільгельміна давно хворіла, змусивши свою доньку, нині королеву Юліану, перебрати на себе дедалі більше її обов'язків.\n\nНідерландські Кариби — часом охоплені суперечностями — об'єдналися, щоб оплакати її смерть; про жалобу повідомляли навіть в окупованих нацистами Нідерландах. На прохання покійної королеви похорон провели в білих убраннях, а не в чорних, на знак її християнської віри в те, що смерть була лише початком вічного життя. Через обставини в Парамарибо було побудовано спеціальне кладовище для її останків; однак урядові джерела повідомляють, що якщо Амстердам колись буде звільнено, вона приєднається до своїх предків у Королівській крипті там.\n"
  SUR_news.1.a:0 "Наші співчуття."

  SUR_news.2.t:0 "[Get_newspaper_header]Реформа основних законів Нідерландів"
  SUR_news.2.desc:0 "Нещодавні дії нідерландського уряду проти автономії Суринаму спричинили протести в столиці Парамарибо після перегляду колоніальних Основних законів. Переважно порожній нідерландський законодавчий орган ухвалив закон, який звів уряд у вигнанні до церемоніальної ролі та встановив виборчі привілеї для вигнанців у Суринамі. Радники королеви Юліани після цього порадили їй звільнити прем'єр-міністра Суринаму й призначити нідерландського прем'єр-міністра, ще більше об'єднавши нідерландські володіння.\n\nЦей крок викликав обурення серед суринамського населення, яке вважає його порушенням попередніх угод про автономію з нідерландською короною. Хоча нинішні Національні збори Суринаму продовжать існувати до наступних виборів, нові Основні закони спричинили розкол між вигнанцями та суринамським населенням.\n"
  SUR_news.2.a:0 "Хіба це вільна нація?"

  SUR_news.3.t:0 "[Get_newspaper_header]Реорганізація нідерландських володінь"
  SUR_news.3.desc:0 "З Парамарибо повідомляють, що нідерландський уряд у вигнанні досяг угоди з Генеральними штатами Суринаму щодо політичного майбутнього Королівства. В обмін на посилення контролю корони над урядом Суринаму нідерландський уряд у вигнанні вирішив розпустити себе й надати Суринаму статус головної складової країни Королівства Нідерландів. Ця угода стала результатом місяців переговорів та інтегрує стару нідерландську політичну систему в уряд Суринаму.\n\nХоча угоду схвалили Об'єднана індостанська партія Суринаму та меншість його Національної партії, націоналісти в Генеральних штатах засудили закони як узурпацію суверенітету Суринаму. Крім того, включення нідерландських виборчих округів до майбутніх виборів у Суринамі вказує на подвійні стандарти нового уряду, що викликає занепокоєння автономістів.\n"
  SUR_news.3.a:0 "Компроміс — ключ до всього."

  SUR_news.4.t:0 "[Get_newspaper_header]Суринамські антиурядові протести"
  SUR_news.4.desc:0 "Протести в суринамській столиці Парамарибо паралізували місто, оскільки обурення корупцією в уряді прем'єр-міністра Йо Мейненa продовжує вихлюпуватися на вулиці. Демонстрації залишалися ненасильницькими, але студенти й фабричні робітники дедалі масовіше проводили політичні демонстрації з вимогою відставки Мейненa. У відповідь на протести королева Юліана звільнила Мейненa до проведення нових виборів у червні.\n\nХоча ця справа навряд чи призведе до розслідування, звільнення прем'єр-міністра Національна партія привітала як перемогу суринамської демократії. Майбутні вибори вже точаться запекло, а передвиборчі дебати щодо незалежності та королівських прерогатив поляризують виборців.\n"
  SUR_news.4.a:0 "Проблеми в королівстві у вигнанні."

  SUR_news.5.t:0 "[Get_newspaper_header]Конституційна криза Суринаму"
  SUR_news.5.desc:0 "Політичне протистояння між королевою Юліаною та урядом прем'єр-міністра Суринаму Йогана Крааґа призвело до звільнення Крааґа до проведення нових виборів. Суперечка виникла через бюджет 1969 року, запропонований Крааґом і його Національною партією, який передбачав різке збільшення соціальних виплат і державних інвестицій із великим дефіцитом. Хоча Крааґ стверджував, що зростання та допомога ОВН компенсують накопичений борг, консерватори все ж домоглися його звільнення.\n\nВідставка Крааґа відтоді спричинила обурення в Генеральних штатах Суринаму, а члени Національної партії дедалі активніше проводять кампанію на користь незалежності. Хоча прихильники незалежності не мають більшості в Генеральних штатах, питання королівських прерогатив поляризували майбутні вибори.\n"
  SUR_news.5.a:0 "Невже вони не можуть дотриматися обіцянки?"

  SUR_news.6.t:0 "[Get_newspaper_header]Нідерландська армія окупує Парамарибо"
  SUR_news.6.desc:0 "Нідерландська армія швидко окупувала Парамарибо, столицю Суринаму, та оголосила про плани анулювати референдум про незалежність і розпустити Генеральні штати Суринаму. Це сталося після того, як дедалі бунтівніші настрої в Суринамі посилилися напередодні референдуму, який нідерландська армія відтоді назвала "небезпечним". Офіцери Королівської нідерландської армії розпочали швидке придушення прихильників і організацій незалежності, змусивши уряд Парамарибо піти у відставку та поступитися місцем новій військовій хунті.\n\nВійськовий уряд повторив, що "Королівство Нідерландів" повернеться до демократії, хоча хунта досі не надала жодних строків. Наразі автономія та демократія в Суринамі придушені силою, а мрії про незалежність згниють у найпалкіших ідеалістів Суринаму.\n"
  SUR_news.6.a:0 "Повернення до імперіалізму."

  SUR_news.7.t:0 "[Get_newspaper_header]Суринам голосує за незалежність"
  SUR_news.7.desc:0 "Через кілька годин після закриття виборчих дільниць по всьому Суринаму результати голосування підтвердили, що більшість суринамців проголосувала за незалежність. Нідерландські експерти з опитувань та міжнародні спостерігачі давно прогнозували, що Суринам залишиться в нідерландських володіннях. Проте нещодавні антиурядові демонстрації та підтримка націоналістичних партій, що зростала, підштовхнули виборців до незалежності.\n\nВидатні представники корінного населення привітали результати як прояв демократії, тоді як нідерландський уряд у вигнанні розпочав від'їзд на Арубу. Незалежність Суринаму скоротила коронні володіння Нідерландів до Нідерландських Антильських островів, тепер єдиної території, що залишилася від колись всесвітнього Королівства.\n"
  SUR_news.7.a:0 "Кінець Нідерландів?"

  SUR_news.8.t:0 "[Get_newspaper_header]Суринам залишається нідерландським"
  SUR_news.8.desc:0 "Через кілька годин після закриття виборчих дільниць по всьому Суринаму результати голосування підтвердили, що більшість суринамців проголосувала проти незалежності. Для нідерландського уряду це не стало несподіванкою, оскільки він давно очікував провалу голосування, але королева Юліана все ж оприлюднила заяву про примирення з табором незалежності. У Парамарибо панувала атмосфера полегшення, розчарування та окремих спалахів гніву, але життя тривало.\n\nХоча суринамські націоналістичні партії пообіцяли й надалі домагатися незалежності, представники Об'єднаної індостанської партії підтримали результати як основу для подальшої національної автономії. Ворожнеча через минулі кривди залишається свіжою в пам'яті багатьох суринамців, підживлюючи подальший рух за незалежність. Наразі, однак, нація вирішила залишитися в складі Королівства.\n"
  SUR_news.8.a:0 "Можливо, примирення можливе."

  SUR_news.9.t: "[Get_newspaper_header]Повстання на Кюрасао 1969 року"
  SUR_news.9.desc: "Оскільки нідерландський уряд у вигнанні зіткнувся із заворушеннями в Суринамі, до них приєднався острів Кюрасао. Через занепад економіки острова та відчуття корінного населення, що воно не має належного представництва, місцеві жителі почали грабувати острів. Чорні націоналісти, соціялісти та реформатори очолили боротьбу проти уряду, усі сподіваючись на втілення власного вирішення конфлікту.\n\nПовідомляється, що уряд Сполучених Штатів тисне на нідерландців, вимагаючи швидших дій проти заворушень, поки країна не розпалася. Окрім залучення США, регіональні соціялісти надали допомогу місцевим повстанцям.\n\n"
  SUR_news.9.a: "І скільки часу в них була Індонезія?"

