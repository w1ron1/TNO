 POLITICS_HERMANN_GORING_DESC:0 "Колись Ґьорінґ публічно заявив, що якщо бодай один союзницький бомбардувальник дістанеться Райху, то відтоді він назавжди буде відомий як Герман Майєр. Успіх націонал-соціялізму у Світовій війні довів, що цей блеф був вдалим, і невдовзі Ґьорінґ упевнився, що варто відрізати й собі шмацик від великого пирога, у який переможці жадібно вчепилися після знищення Союзників.\n\nПоєднуючи відносно придатний до політики розум із надмірним застосуванням грубої сили - насамперед через використання бандитів, міліцій та «патріотів» для залякування й усунення будь-яких загроз своїй владі - Ґьорінґ утвердив себе як єдиного політика в Райху, який нібито справді дослухається до благань вояцтва. Не бачачи іншого шляху до влади, він оточив себе уніформованими підлабузниками, які переконали старіючого Фюрера, що єдиний шлях Райху до процвітання лежить через цілковите знищення його ворогів.\n\nТепер Ґьорінґ крокує гусачим кроком, пліч-о-пліч із ними, дорогою, яку багато хто вважає прямим шляхом до загибелі Райху. Звісно, якщо його не зупинять найближчим часом, адже важко уявити, що станеться, коли Ґьорінґ зверне свій погляд за океан…"
 POLITICS_ALBERT_BORMANN_DESC:0 "У режимі, настільки схильному до непотизму й корупції, як Райх, можна було б очікувати, що брат одного з провідних партійних функціонерів підніметься високо незалежно від власної компетентності. Альберт Борман із цим не погодився б. Попри те, що він є братом очільника партійної канцелярії та одного з наймогутніших людей у Райху, холодні стосунки зі старшим братом гарантували йому відсутність подальшого просування у вищі щаблі влади. Втім, працьовитий колишній аташе Фюрера не був цілком позбавлений власних союзників. Природно, чоловік, якому він колись служив посередником між Хеєром і Адольфом Гітлером, завжди мав до нього прихильність, і лише завдяки заступництву покійного Фюрера Альберт уникнув заслання гнити в одному з віддалених райхскомісаріятів за примхою свого відчуженого брата.\n\nСмерть Фюрера загрожувала зруйнувати все це. Так би й сталося, якби переможцем не виявився інший головний покровитель у коридорах влади Райху - Герман Ґьорінґ, улюбленець мілітаристів. Саме цей мілітаризм і привабив чиновника до Райхсмарашала, разом із особистою харизмою останнього - рисою, якої Мартінові завжди бракувало. Тепер же Ґьорінґ знайшов у братові одного зі своїх найбільших ворогів компетентного адміністратора, готового виконувати накази без вагань і жалю."
 GENERAL_FERDINAND_SCHORNER_DESC:0 "§LНародився: 1892\nВік: 70\nРід військ: Хеєр\nЗвання: Ґенералфельдмаршал\nЙого називають «М’ясник», «Кривавий Фердинанд», «Пес війни» та багатьма іншими жорстокими прізвиськами. Сам він цілком задоволений титулом ґенералфельдмаршала. Він вправний у проведенні великомасштабних операцій за участю сотень тисяч людей і зовсім не зважає на їхні окремі життя. Фердінанд Шьорнер - людина, яку не любить ніхто і бояться всі. Під час Західноросійської війни, як казали, шанси бути повішеним як дезертир були вищими, ніж загинути в бою. Його вплив у війську був більш ніж доведений, коли після короткої спроби перевороту наприкінці тієї війни Шьорнер виявив, що його перспективи здобуття влади лише зросли.\n\nВетеран Першої світової війни, Фердінанд зрештою став одним з улюблених командувачів Фюрера у Другій. У новіші часи він також вибудував взаємовигідне партнерство з Райхсмарашалом Ґьорінґом: старий ас надавав свій політичний капітал для виконання запитів Шьорнера в обмін на лояльність мілітаристської фракції.\n\nУтім, старий диявол Східного фронту має власні задуми на майбутнє - такі, що можуть як потребувати, так і не потребувати жодного політика над собою. Його суперництво з іншою зіркою Вермахту, Гансом Шпайделем, є однією з найбільших перешкод, з якими він досі стикався. Лише час покаже, чи він нарешті зустрів рівного собі, чи ж, як побоюються деякі, перебуває лише за крок від здійснення власних амбіцій.§!"
 GENERAL_JOHANNES_STEINHOFF_DESC:0 "§LСеред героїв Люфтваффе є один пілот, який височіє над майже всіма іншими - Йоганнес Штайнгофф. Один із найдосвідченіших асів усіх часів, Штайнгофф був одним із небагатьох пілотів по обидва боки Другої світової війни, хто пройшов її від початку й до кінця, постійно виконуючи бойові вильоти. Навіть після того, як він зазнав жахливих опіків унаслідок катастрофічної аварії під час випробувального польоту реактивного прототипу Me 262, Штайнгофф повернувся в небо щойно лікарі дали дозвіл. Не бажаючи втратити такий цінний актив, Герман Ґьорінґ призначив Штайнгоффа до льотної академії Люфтваффе, де той кілька років служив головним інструктором.\n\nШтайнгофф знову літав під час Західноросійської війни, а після завершення й цього конфлікту сподівався провести решту життя мирно, як викладач. Проте цьому не судилося статися коли Бюрґеркріґ охопив Райх, ас опинився перед важким вибором. Зрештою він вирішив піти за Германом Ґьорінґом, призначеним наступником покійного Фюрера. Цього разу Райхсмарашал мав на думці для Штайнгоффа значно більше, ніж просто посаду інструктора, і незабаром після перемоги Ґьорінґа старий ветеран опинився на посаді нового обербефельсгабера Люфтваффе.§!"

 GER_Otto_Ernst_Remer_army_chief:0 "§YЯкщо Шьорнер - м’ясник, то Отто Ернст Ремер є його кривавим ножем. Ще молодим офіцером, що сформувався безпосередньо перед піднесенням нацистів, Ремер віддав себе тілом і душею справі націонал-соціялізму. Він відзначився під час кампаній проти Польщі, на Балканах та в ході Операції «Барбаросса», зрештою піднявшись до командування батальйоном у дивізії «Ґросдойчланд». Вершиною кар’єри Ремера стало особисте нагородження його Дубовим листям до Лицарського хреста - і не ким іншим, як самим Фюрером, Адольфом Гітлером.\n\nПідрозділ Ремера брав участь у найзапекліших боях війни - від глибокого серця Росії, де Союз було остаточно зламано, до пагорбів Північної Англії, де війна зрештою дійшла до свого завершення.\n\nЗа довгі роки відтоді вплив Ремера у Вермахті неухильно зростав, і він стрімко став правою рукою фельдмаршала Фердінанда Шьорнера, а отже - другою за силою постаттю мілітаристської фракції офіцерського корпусу. Хоч Ремер і має значну повагу до свого войовничого товариша та безпосереднього начальника, його справжня лояльність належить лише тому, кого він вважає здатним просувати справу остаточної світової перемоги націонал-соціялізму, і хто, на його думку, може найкраще підтримати цю мету дією.§!"
 GER_Artur_Axmann_for_desc:0 "§YРайхс’юґендфюрер\nНаціонал-соціялізм§!\n--------------\n§LАртур Аксман вважається одним із перших політиків, що цілковито належали до нацистського покоління. Ще навчаючись у середній школі, Артур вступив до НСДАП, ставши взірцевим членом Гітлер’юґенду. Після завершення свого шляху в молодіжних лавах організації він обійняв посаду райхс’юґендфюрера і повністю взяв на себе відповідальність за виховання німецької молоді в дусі величі націонал-соціялізму та Райху. Зокрема, саме він відповідав за призов членів Гітлер’юґенду до німецької армії.\n\nЗавжди залишаючись патріотом, Аксман також служив своїй державі під час Другої світової війни. Він воював у складі Вермахту на Східному фронті, однак був змушений залишити службу після втрати руки в бою. Артур не знав іншого життя, окрім життя вірного нациста з самого дитинства, і тому залишається цілковито та беззастережно відданим справі, у якій його виховали. Через це він є яскравим символом розуму й відданості німецьких дітей.§!"
 GER_Ferdinand_Schorner_sec_desc:0 "§YНачальник Верховного командування Вермахту\nСтратократичний націонал-соціялізм§!\n--------------\n§LЙого називають «М’ясник», «Кривавий Фердінанд», «Пес війни» та багатьма іншими жорстокими прізвиськами. Сам він цілком задоволений титулом ґенералфельдмаршала. Він вправний у проведенні великомасштабних операцій за участю сотень тисяч людей і зовсім не зважає на їхні окремі життя. Фердінанд Шьорнер - людина, яку не любить ніхто і бояться всі. Під час Західноросійської війни, як казали, шанси бути повішеним як дезертира були вищими, ніж загинути в бою. Його вплив у війську був більш ніж доведений, коли після короткої спроби перевороту наприкінці тієї війни Шьорнер виявив, що його перспективи здобуття влади лише зросли.\n\nВетеран Першої світової війни, Фердінанд зрештою став одним з улюблених командувачів Фюрера у Другій. У новіші часи він також вибудував взаємовигідне партнерство з Райхсмарашалом Ґьорінґом: старий ас надавав свій політичний капітал для виконання запитів Шьорнера в обмін на лояльність мілітаристської фракції.\n\nУтім, старий диявол Східного фронту має власні задуми на майбутнє - такі, що можуть як потребувати, так і не потребувати жодного політика над собою. Його суперництво з іншою зіркою Вермахту, Гансом Шпайделем, є однією з найбільших перешкод, з якими він досі стикався. Лише час покаже, чи він нарешті зустрів рівного собі, чи ж, як побоюються деякі, перебуває лише за крок від здійснення власних амбіцій.§!"
 GER_Wilhelm_Stuckart_hog_desc:0 "§YРайхсляйтер\nНаціонал-соціялізм§!\n--------------\n§LВільгельм Штуккарт був суддею ще до піднесення НСДАП, і саме це привело його під крило Германа Ґьорінґа, який на той час обіймав посаду міністерпрезидента Пруссії. Завдяки власній правничій компетенції, а також зростаючій дружбі з Ґьорінґом, Штуккарт швидко став його другою людиною, частково відповідаючи за значну частину прусської адміністрації того періоду, а також беручи участь у привласненні численних культурних артефактів для потреб управління.\n\nПісля приходу НСДАП до влади Штуккарт перейшов до Міністерства внутрішніх справ, зрештою ставши одним зі співавторів Нюрнберзьких законів. Окрім цього, саме він відповідав за підписання декрету, який зобов’язував повідомляти про всіх новонароджених із фізичними вадами. Пізніше, за цим самим декретом, однорічного сина Штуккарта було піддано евтаназії через народження з трисомією 21-ї хромосоми.\n\nХоч Штуккарт і декларує відданість партії та мілітаристській справі, насправді його лояльність належить передусім власному кар’єрному зростанню та старому другові Ґьорінґу. Значна частина його впливу є наслідком відвертого фаворитизму, однак на займаних посадах він довів себе як один із провідних правників Райху. Найголовніше ж - це людина, якій Ґьорінґ може довіряти.§!"
 GER_Rudolf_Diels_sec_desc:0 "§YChef der Geheime Staatspolizei\nНаціонал-соціялізм§!\n--------------\n§LЩе до «ката Гайдріха», ще до Ґестапо Мюллера, був Рудольф Дільс. Дільс - ще один давній соратник Ґьорінґа, чия доля різко пішла вгору завдяки сходженню свого патрона до фюрерства. Уперше Дільс і Ґьорінґ зустрілися в 1933 році, коли останній отримав посаду міністерпрезидента Пруссії, а Дільс очолював Прусську таємну поліцію - таємну поліцію держави. Завдяки своїй роботі Дільс володів майже енциклопедичними знаннями про впливових політичних діячів, зокрема членів нацистської партії, та про їхні найтемніші таємниці. Усвідомлюючи користь від такого ресурсу, Ґьорінґ створив структуру, що невдовзі стала відомою як Ґестапо, і поставив Дільса на її чолі.\n\nУтім, перебування Дільса на посаді керівника Ґестапо тривало лише рік, адже Генріх Гіммлер і Райнгард Гайдріх поступово усунули його з позицій впливу в уряді. Їхні інтриги дали результат, і в 1934 році Дільс був усунутий, а його місце зайняв Райнгард Гайдріх.\n\nПротягом останніх двох десятиліть Дільс переважно тримався осторонь, хоча його зв’язок із Райхсмарашалом лише поглибився - він навіть одружений з Ільзою Ґьорінґ, кузиною Фюрера. Тепер же, коли проклятого Гайдріха більше немає, Дільс може повернути контроль над організацією, яка завжди по праву належала йому, і нова епоха домінування Ґестапо в Райху ось-ось розпочнеться.§!"
 GGR_Artur_Axmann_for_desc:0 "§YРайхс’юґендфюрер\nНаціонал-соціялізм§!\n--------------\n§LАртур Аксман вважається одним із перших політиків, що цілковито належали до нацистського покоління. Ще під час навчання в середній школі Артур вступив до НСДАП, ставши взірцевим членом Гітлер’юґенду. Після завершення свого шляху в молодіжних лавах організації він обійняв посаду райхс’юґендфюрера і повністю взяв на себе відповідальність за виховання німецької молоді в дусі величі націонал-соціялізму та Райху. Зокрема, саме він відповідав за призов членів Гітлер’юґенду до німецької армії.\n\nЗавжди залишаючись патріотом, Аксман також служив своїй державі під час Другої світової війни. Він воював у складі Вермахту на Східному фронті, однак був змушений залишити службу після втрати руки в бою. Артур не знав іншого життя, окрім життя вірного нациста з самого дитинства, і тому залишається цілковито та беззастережно відданим справі, у якій його виховали. Через це він є яскравим символом розуму й відданості німецьких дітей.§!"
 GER_Ferdinand_Schorner_high_command_desc:0 "§YChef des Oberkommandos der Wehrmacht\nСтратократичний націонал-соціялізм§!\n--------------\n§LЙого називають «М’ясник», «Кривавий Фердінанд», «Пес війни» та багатьма іншими жорстокими прізвиськами. Сам він цілком задоволений титулом ґенералфельдмаршала. Він вправний у проведенні великомасштабних операцій за участю сотень тисяч людей і зовсім не зважає на їхні окремі життя. Фердінанд Шьорнер - людина, яку не любить ніхто і бояться всі. Під час Західноросійської війни, як казали, шанси бути повішеним як дезертира були вищими, ніж загинути в бою. Його вплив у війську був більш ніж доведений, коли після короткої спроби перевороту наприкінці тієї війни Шьорнер виявив, що його перспективи здобуття влади лише зросли.\n\nВетеран Першої світової війни, Фердінанд зрештою став одним з улюблених командувачів Фюрера у Другій. У новіші часи він також вибудував взаємовигідне партнерство з Райхсмарашалом Ґьорінґом: старий ас надавав свій політичний капітал для виконання запитів Шьорнера в обмін на лояльність мілітаристської фракції.\n\nУтім, старий диявол Східного фронту має власні задуми на майбутнє - такі, що можуть як потребувати, так і не потребувати жодного політика над собою. Його суперництво з іншою зіркою Вермахту, Гансом Шпайделем, є однією з найбільших перешкод, з якими він досі стикався. Лише час покаже, чи він нарешті зустрів рівного собі, чи ж, як побоюються деякі, перебуває лише за крок від здійснення власних амбіцій.§!"
 GGR_Wilhelm_Stuckart_hog_desc:0 "§YРайхсляйтер\nНаціонал-соціялізм§!\n--------------\n§LВільгельм Штуккарт був суддею ще до піднесення НСДАП, і саме це привело його під крило Германа Ґьорінґа, який на той час обіймав посаду міністерпрезидента Пруссії. Завдяки власній правничій компетенції, а також зростаючій дружбі з Ґьорінґом, Штуккарт швидко став його другою людиною, частково відповідаючи за значну частину прусської адміністрації того періоду, а також беручи участь у привласненні численних культурних артефактів для потреб управління.\n\nПісля приходу НСДАП до влади Штуккарт перейшов до Міністерства внутрішніх справ, зрештою ставши одним зі співавторів Нюрнберзьких законів. Окрім цього, саме він відповідав за підписання декрету, який зобов’язував повідомляти про всіх новонароджених із фізичними вадами. Пізніше, за цим самим декретом, однорічного сина Штуккарта було піддано евтаназії через народження з трисомією 21-ї хромосоми.\n\nХоч Штуккарт і декларує відданість партії та мілітаристській справі, насправді його лояльність належить передусім власному кар’єрному зростанню та старому другові Ґьорінґу. Значна частина його впливу є наслідком відвертого фаворитизму, однак на займаних посадах він довів себе як один із провідних правників Райху. Найголовніше ж - це людина, якій Ґьорінґ може довіряти.§!"
