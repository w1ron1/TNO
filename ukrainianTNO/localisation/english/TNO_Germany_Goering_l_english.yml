 GER_Paul_Korner_eco_desc:0 "§YРайхсвіртшафтсміністер\nНаціонал-соціялізм§!\n--------------\n§LПауль Кьорнер, служачи артилерійським офіцером у Першій світовій війні, зав’язав довгу й міцну дружбу з Германом Ґьорінґом. Згодом він вступив до НСДАП та СС, доволі швидко піднімаючись як ранній член обох організацій. Примітно, що Кьорнер перебував поруч із Ґьорінґом і Гітлером під час переговорів щодо коаліції НСДАП з Гінденбурґом - угоди, яка привела Гітлера на посаду канцлера та проклала шлях до його подальшого сходження до влади над Райхом.\n\nПісля повного захоплення влади НСДАП Кьорнер був призначений секретарем Ґьорінґа з питань Чотирирічного плану, водночас отримавши мандат НСДАП у Райхстазі. У певний період Кьорнер також обіймав посаду голови ради директорів Райхсверке - компанії, заснованої його старим другом. Хоч Кьорнер і є хитрим та здібним сам по собі, його кар’єра безсумнівно була значною мірою сформована й підтримана дружбою з «дядьком Райху», і схоже, що це навряд чи зміниться.§!"

 GENERAL_EDUARD_WAGNER_DESC:0 "§LГенерал-квартирмейстер Хеєру, Едуард Ваґнер, здобув сумну славу за свою жорстокість щодо цивільного населення. Відданий нацист, Ваґнер розробив регламенти для співпраці Вермахту та СС у вбивствах євреїв і слов'ян на Східному фронті Другої світової війни. Під час цієї війни він успішно впорався із завданням забезпечення Вермахту зимовим одягом і паливом, здобувши повагу багатьох інших генералів за свої зусилля. Під час Західноросійської війни він перерозподілив постачання від Гіммлера до головного фронту, допомігши втримати лінію, залишивши СС напризволяще, коли вони зробили свій хід. Відтоді Ваґнер зблизився з мілітаристами, ставши близьким союзником Фердинанда Шьорнера.§!"
 ADMIRAL_KARL_JESKO_VON_PUTTKAMER_DESC:0 "§LКарл-Єско фон Путткамер - людина непохитної відданості та волі. Завжди на швидкому шляху до величі завдяки своїй шляхетній крові, фон Путткамер був відданий лише Райху. Морський ад'ютант Гітлера під час війни та після неї, фон Путткамер був дуже близький до покійного Фюрера. Гітлер якось відвідав фон Путткамера в лікарні після того, як той був поранений під час невдалого перевороту Гіммлера, і нагородив фон Путткамера Знаком за поранення. Наразі фон Путткамер визнає відданість лише Фюреру та Райху, хоча публічно підтримує Ґьорінґа та мілітаристів.§!"

