## Leader Descs ##
POLITICS_DAVID_LANSANA_DESC: "Коли світ тремтів під німецькими танками та японськими лінкорами, старі сюзерени падали, а на їхньому місці поставали нові сповнені надії нації, вільні від кайданів, що колись їх сковували. Однією з таких націй є Республіка Сьєрра-Леоне, колись лише одна з багатьох африканських колоній Британської імперії, а тепер молода демократія — та, якій не судилося проіснувати довго. Лише через чотири дні після проголошення республіки та формування демократично обраного уряду збройні сили силоміць захопили столицю на чолі з не ким іншим, як бригадиром Девідом Ласаною.\n\nНароджений 1922 року в впливовій родині менде, Ласана був одним із небагатьох у Сьєрра-Леоне, кого відібрали для проходження військової підготовки як офіцера у Сполученому Королівстві. Повернувшись на батьківщину, він одружився з донькою верховного вождя менде, ще більше розширивши свою й без того розгалужену мережу політичних зв'язків. Коли британці поспішно відступили з Африки, Ласана став очільником Збройних сил Сьєрра-Леоне. Попри заявлену відданість демократії Сьєрра-Леоне, Ласана не мав жодних докорів сумління щодо повалення уряду, коли на перших виборах у країні перемогла партія, що виступала проти його кліки — і тепер він стоїть на чолі нової Республіки Сьєрра-Леоне.\n\nВід самого початку режим Ласани був нестабільним, позначеним сильними міжетнічними конфліктами (які лише посилилися новою хвилею мендського націоналізму та супремасизму), а також зростанням влади генералів і місцевих воєначальників, формально союзних із Ласаною, таких як генерал Ендрю Джуксон-Сміт. У міру того як влада Ласани ставала дедалі хиткішою, а економіка Сьєрра-Леоне намагалася набрати обертів, схоже, єдина причина, чому генерала досі не усунули від влади, а його нікчемний режим не ліквідували, полягає в тому, що опозиція його правлінню не об'єднана спільним фронтом — принаймні поки що."

