### Ideas ###
SIE_idea_disloyal_army: "Нелояльна армія"
SIE_idea_disloyal_army_desc: "Армія — відлуння складної політичної ситуації Сьєрра-Леоне: хаотична, розколота та загалом роз'єднана. Переворот Девіда Ласани відбувся завдяки їй, підкріплений підтримкою найважливіших і найвпливовіших генералів країни; однак у її лавах досі панує інакомислення, що найпомітніше проявляється в кліці, яка формується навколо Ендрю Джуксон-Сміта.\n\nАрмія не лише нелояльна, але й роз'єднана. Генерали та війська менде загалом підтримують Ласану, свого одноплемінника, але інші культури, як-от кріо та темне, вважають Джуксон-Сміта значно прихильнішим лідером. Цього вже достатньо, але чутки про контрперевороти поширюються лісовою пожежею, а Ласана не має жодного бажання так скоро відмовлятися від щойно здобутої влади. Одне можна сказати напевно: боротьба Сьєрра-Леоне з армією ще не закінчилася."
SIE_idea_disorganized_political_spheres: "Неорганізовані політичні сфери"
SIE_idea_disorganized_political_spheres_desc: "Перевороти серед руїн Західної Африки відомі кількома речами. Вони швидкі, поширені та дуже хаотичні. Останній переворот у Сьєрра-Леоне, очолений Девідом Ласаною, схоже, відповідає всім трьом цим критеріям. Прихильники найрізноманітніших рухів демонстративно відстоюють свої політики в столиці, поки молода влада Ласани намагається стати на ноги в регіоні, яким у найкращому разі важко керувати.\n\nДо хаосу додаються численні лідери численних опозицій до нового режиму Ласани. З одного боку, прихильники поваленого колишнього прем'єр-міністра Мілтона Марґая залишаються впливовими в місцевій політиці Сьєрра-Леоне. З іншого — народ вітає й аплодує висхідній зірці Сіаці Стівенсу. У війську генерали пошепки говорять між собою про необхідність більш об'єднавчого лідера — такого, якого, на їхню думку, вони знайшли в Ендрю Джуксон-Сміті. Усе, здається, вказує на наближення кульмінації в Сьєрра-Леоне — і доки хаос триває, ця кульмінація дедалі ближче до вибуху."
