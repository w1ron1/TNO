ELS_forpol.29.t: "Кавова олігархія"
ELS_forpol.29.desc: "У міру того як представники американських ділових інтересів розширюють свою присутність і діяльність у Сальвадорі, вони стикаються зі значною проблемою. І вони просять про допомогу.\n\nПо суті, незалежно від того, що говорить уряд або Конституція країни, Сальвадором фактично керує кава. Точніше, невелика група сальвадорських бізнесменів, які володіють величезними кавовими плантаціями та підприємствами з переробки кави. Ці олігархи мають величезний вплив на уряд, ігнорувати їх не можна. Так само їх не можна усунути, якщо тільки ми не хочемо виступати за вторгнення.\n\nТож нам потрібно буде подумати, як найкраще з ними співпрацювати.\n\nНа щастя, як і будь-які бізнесмени, вони поважають гроші — а в Америки їх справді багато. Наші експерти в регіоні запевнили нас, що якщо ми запропонуємо поступки щодо торгівлі та імпорту — звісно, на користь олігархів, — вони, найімовірніше, дуже прихильно поставляться до наших запитів і до дозволу на загальне розширення американського бізнесу. Вартість у національному масштабі відносно мінімальна, а закріплення позицій і впливу в Сальвадорі має, крім того, політичні та розвідувальні переваги.\n\nЯк нам діяти?"
ELS_forpol.29.a: "Гаразд. Киньте їм кістку."
ELS_forpol.29.b: "Ні. Жодного цента на данину."

ELS_forpol.30.t: "Далеке-далеке світло на сході"
ELS_forpol.30.desc: "Світова історія майже була приміткою в сальвадорських підручниках історії, але її було достатньо, щоб молоді націоналісти чули про Реставрацію Мейдзі. Зухвала, унікальна подія, під час якої країна на межі колонізації змінила хід історії й за одне покоління завдяки винятковій рішучості сама стала великою державою. Сама думка про це змушувала їх душитися від гордості за шлях, яким могла б піти їхня змучена нація.\n\nЗвісно, реальність була іншою. Молоді націоналісти ставали старшими націоналістами й вступали до армії, де їм і було місце. Їх підвищували все вище й вище, а потім вони впиралися у скляну стелю корупції. Знову в них прокидалися мрії про повалення декадентського режиму та відродження країни, але цього разу вони вже мали владні посади, з яких могли щось зробити. І телефонні лінії.\n\nПроте Японія, з якою вони виявилися на зв’язку, була не тією самою, про яку вони читали в підручниках історії. Самураїв замінили бізнесмени в костюмах і солдати в хакі, зовсім не зацікавлені в романтиці визволення підкореної нації — особливо такої незначної, як Сальвадор. Навіть коли деякі невеликі підприємства, очолювані їхніми співвітчизниками, намагалися закріпитися в столиці, вони байдуже спостерігали, як банди та ФБР систематично їх знищували. Де була та нація, яка обрала смерть замість безчестя? Нарешті одного дня відповідь прийшла."
ELS_forpol.30.a: "Ми завжди були тут, брати — лише чекали слушного часу."
ELS_forpol.30.b: "Самураї всі мертві — і це ми їх убили. Прокиньтеся."
ELS_Support_Coup_Late_tt: "§YМи закладемо основу для майбутнього перевороту проти про-ОВНівського істеблішменту в §BСальвадорі§!.§!"

ELS_forpol.31.t: "Лунка в один удар"
ELS_forpol.31.desc: "Дерева вздовж поля шелестіли листям, коли крізь них проходив лагідний вітер, а далекі пташині співи пливли невидимими хвилями. Це було мальовниче поле, завжди таким було, і кращого місця для зустрічі не існувало. Геть одноманітну кімнату для нарад, незграбні костюми та загальне відчуття, що стіни слухають; хто б не проміняв довгу гру в «Дев’ять куль» на будівлю Міністерства юстиції?\n\n"Що ви думаєте про того Санчеса в Сальвадорі, він надійний?" Запитання прозвучало невимушено, ніби йшлося про обід, але в голові виникали уривки меморандумів і звітів, повідомлень та брифінгів. Що ж про нього думати?\n\n"Та все те саме, насправді. Це ремонт старого будинку: всередині не дуже багато що змінилося, але виглядає він набагато краще." Такі метафори викликали усмішки, якщо тільки вони були позитивними. Було б брехнею сказати, що половина Бюро не намагалася перевершити одна одну в них.\n\n"Он як? Ну, у моїх звітах сказано, що демократія там нарешті почала себе показувати. Спалах на сковороді?" Запитання супроводжувалося усмішкою та сміхом, але чи справді воно було таким легковажним? Коли сумніваєшся, звертайся до фактів — зрештою, вони всі були професійними гравцями, але поле було нейтральною територією.\n\n"Санчес отримує підтримку завдяки перебуванню PCN при владі. Спадщина диктатури посадила його в це крісло, а нещодавні вибори закріпили його там, зрештою, вони були достатньо чесними. Це не "Містер Сміт вирушає до Вашинґтона", але ми цілком можемо з цим працювати." Схвальний кивок став відповіддю на пояснення, і гравець приготувався вдарити.\n\nМ’який глухий звук пролунав, коли м’яч нарешті полетів. Він летів дедалі далі, біла цятка велично приземлилася біля прапорця вдалині."
ELS_forpol.31.a: "Лунка в один удар від Бюро."

ELS_forpol.32.t: "Меморандум про реформи в Сальвадорі"
ELS_forpol.32.desc: "МЕМОРАНДУМ ДЛЯ: офісу BD, Маямі\nТЕМИ:\n1. Реформи Санчеса\n2. Ставлення до США\n3. Майбутнє\nЗусилля з просування реформаторського порядку денного в Сальвадорі дали плоди, але було б нерозумно вважати режим фундаментально зміненим. Кандидати PCN залишаються фаворитами в політичних колах завдяки різноманітним заходам м’якого примусу, однак найгірші прояви були усунені, і держава більше не має монополії на політику. Опозиція присутня та ефективна. Наразі вона не становить загрози для більшості чинних посадовців, але ситуація розвивається\nВідносячи Сальвадор до категорії частково вільної демократії, слід зазначити, що риторику щодо країни необхідно ретельно обмірковувати. Опозиція загалом не схиляється до антиамериканських настроїв, однак це узагальнене твердження. Є й ті, хто це робить, і багато інших, хто ходить по межі. Проте загалом більшість тих, хто серйозно розглядається на політичні посади, щонайменше приймають американську присутність у країні.\nПідтримку демократії слід заохочувати, щоб ідеологічно наблизити країну до США та захистити її від будь-яких сторонніх сил. За політичними рухами необхідно стежити, щоб жодні антиамериканські настрої не стали надто поширеними, однак загалом реформи були успішними в легітимізації американської присутності в країні.\nПідпис: HG, офіс у Сан-Сальвадорі"
ELS_forpol.32.a: "Вірність, відвага, чесність"

ELS_forpol.33.t: "Чоботи знову рухаються вгору й униз"
ELS_forpol.33.desc: "ОБМЕЖЕНИЙ ДОСТУП\n\nВІД МАЙКЛА НАЗА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: ІНАВГУРАЦІЯ ПРЕЗИДЕНТА ФІДЕЛЯ ТОРРЕСА\n\nО 0900 Фідель Торрес був офіційно інавгурований як президент Сальвадору після нищівної перемоги на "вільних і чесних" виборах. За цим відбувся військовий парад, під час якого броньовані колони рухалися Пасео-Ґенераль-Ескалоном, а молоді офіцери синхронно карбували крок. Гучномовці ревли фальшивими вигуками схвалення, але глядачі стояли мовчки.\n\nТоррес стояв на колишній площі Сальвадор, переобладнаній на величну білу сцену, віддаючи салюти та спостерігаючи за парадом. Промови не було.\n\nО 1200 було видано Виконавчий указ № 1:\n\nУсі амністії для ув’язнених скасовано. Судові процеси для обвинувачених призупинено. Страти відбуватимуться без цивільного нагляду.\n\nО 1800 новина про указ поширилася. Невеликі протести в Санта-Ані були швидко придушені. Повідомляється про двох загиблих. Торрес назвав це "необхідним очищенням національного духу".\n\nМи зробимо все можливе, щоб стежити за ситуацією. Скільки часу можна буде зберігати контроль — незрозуміло."
ELS_forpol.33.a: "Вірність, відвага, чесність"

ELS_forpol.34.t: "Важке партнерство"
ELS_forpol.34.desc: "Офіційно партнерство між сальвадорськими державними поліцейськими силами та ФБР, узгоджене в принципі обома урядами й нав’язане обом сторонам згори, було успішним. Іноземні та кримінальні операції були значно скорочені, а безпека покращувалася.\n\nЦе проявлялося в численних формах.\n\nЦе проявилося в імовірних японських шпигунах, які безслідно зникли після того, як сальвадорський офіцер, призначений допомагати ФБР, узяв незаплановану відпустку, не повідомивши своїх командирів. Це проявилося, коли злочинці, заарештовані після тривалої операції ФБР під прикриттям, вийшли на свободу після того, як передали конверт службовцю, відповідальному за докази. Це проявилося, коли політики, відомі своїми зв’язками з німцями, ймовірно, були попереджені лейтенантом поліції про стеження ФБР.\n\nЗвісно, були й деякі перемоги, але загалом невдач було значно більше, ніж можна було очікувати чи бажати. Однак, залежно від того, хто подавав звіти, картина була зовсім іншою. Так, партнерство йшло дуже добре — принаймні якщо не брати до уваги гору звітів польових агентів про незліченні проблеми, з якими вони стикалися.\n\nІ загалом їх саме так і ігнорували."
ELS_forpol.34.a: "Прикро."

