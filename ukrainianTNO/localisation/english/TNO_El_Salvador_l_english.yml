ELS_forpol.44.t: "Їхня криза, наш шанс"
ELS_forpol.44.desc: "Нові сальвадорські родини висипалися з іржавих автобусів, яких гнали та тримали під прицілом гондураські охоронці. Дехто блукав табором, намагаючись знайти будь-які намети, куди можна було б втиснутися разом з іншими незнайомцями. Інші повзли до черги за їжею, де працівники гуманітарних організацій роздавали пайки рису та бобів.\n\nХосе та Франсіско час від часу визирали крізь клапани намету. Іноді вони бачили бійки в чергах за їжею. В інші моменти чули дитячі крики з намету медичного сортування. Більшість родин щось втратила. Свої домівки, свої кінцівки, свою гідність.\n\n"Це клятий цвинтар", — пробурмотів Хосе, повертаючись у темряву намету. "Ми не можемо тут залишатися."\n\n"Це не назавжди", — прошепотів Франсіско. Старший із двох братів, Франсіско навчився знаходити надію в будь-якій ситуації, чи то в Гондурасі, чи тут, у таборах Сальвадору.\n\n"Ти хоч знаєш, що робить наш уряд?" — виплюнув Хосе. "Люди голодують, а вони зосереджені на відбудові своєї армії! Тієї самої армії, яка спалила наші домівки. Так звані визволителі..."\n\nХосе знову визирнув назовні, дивлячись на далекі гори на горизонті. Чутки про партизанів поширювалися швидше, ніж поодинокі вантажівки з їжею, що їздили таборами. Учителі, фермери, колишні солдати — усі вступали до них.\n\n"Вони щось будують", — сказав Хосе. "Щось, заради чого варто боротися."\n\nФрансіско мовчки подивився на брата. Хосе був надто молодий, щоб воювати, не кажучи вже про те, щоб пережити війну. Але перш ніж він встиг це усвідомити, Хосе зник у натовпі, прямуючи до гірських схованок."
ELS_forpol.44.a: "Нехай Сальвадор стікає кров’ю. Це розчистить шлях до реформ."
ELS_forpol.44.b: "Негайно направте туди гуманітарні кошти — ми не можемо допустити розпаду Сальвадору."

ELS_forpol.45.t: "Новий режим, старі звички"
ELS_forpol.45.desc: "Це був звичайний вечір у Сан-Сальвадорі, коли Карлос ішов вулицею свого району. Він щойно отримав зарплату, і, як і багато разів раніше, мусив бігати у справах, щоб забезпечити прожиток своїй родині. Усі гроші, які він мав, могли дозволити собі лише трохи їжі та крихту ліків для батьків, і, як і раніше, кожна зарплата приносила йому менше хліба, ніж попередня. Їм знову доведеться якось перебиватися.\n'nДорогою назад він проходив повз безліч маленьких американських прапорців. Великі магазини з кондиціонерами, що продавали недоступні товари, свіжопофарбовані штаб-квартири компаній, їхні фасади білі, мов мармур, — усі вони мали невелику, але помітну сталеву табличку з назвою компанії та її іноземним покровителем.\n\nВін не наважувався сподіватися, що покровителі нового уряду принесуть процвітання, і, як завжди, його побоювання виявилися більш ніж виправданими. Справи лише погіршувалися. Американський долар не був його; він не був доларом Сальвадору й аж ніяк не приходив на допомогу простому люду. Він належав Моліні, уряду та багатіям навколо них.\n\nКарлос відвів погляд від гігантських будівель і подивився вперед, де вдалині виднівся крихітний силует його району. Це була самотня дорога додому."
ELS_forpol.45.a: "Ціна свободи."

ELS_forpol.46.t: ""
ELS_forpol.46.desc: "" 
ELS_forpol.46.a: ""

ELS_forpol.47.t: "ВИБОРИ В САЛЬВАДОРІ — ПРІОРИТЕТ"
ELS_forpol.47.desc: "ПОВІДОМЛЕННЯ ДЛЯ: офісу BD, Маямі\nРезультати виборів свідчать про висхідну коаліцію демократів. Хосе Наполеон Дуарте та його Християнсько-демократична партія готові очолити коаліційний уряд, відданий демократичним ідеалам.\nАрмію розгорнуто. Незгоду з результатами придушують силою. Репресії вважаються ймовірними для забезпечення переходу влади.\nРекомендовано налагодити контакти з новим урядом.\nПідпис: HG, офіс у Сан-Сальвадорі"
ELS_forpol.47.a: "Вірність, відвага, чесність"

ELS_forpol.48.t: "МЕМОРАНДУМ ПРО ВІДНОСИНИ З САЛЬВАДОРОМ"
ELS_forpol.48.desc: "МЕМОРАНДУМ ДЛЯ: офісу BD, Маямі\nТЕМИ:\n1. Оцінка попереднього десятиліття\n2. Інтереси США\n3. Майбутнє\nУ відповідь на нещодавні запити агента DR було проведено оцінку позиції США в Сальвадорі в контексті попереднього десятиліття, взявши за початкову точку невдалий переворот 1963 року. Детальніший розбір можна знайти в Додатках 1–5; коротко кажучи, відносини з адміністрацією залишаються стабільними та позитивними, а вплив США залишається сильним як у політиці, так і в економіці.\nСальвадор, попри складний початок 1960-х років, зберіг достатню стабільність у країні, і мало що вказує на значне погіршення становища. Офіс залишається пильним, але поточна ситуація дозволяє нашим операціям тривати без значних перешкод. Нинішні адміністрації дружні до поточних регіональних цілей.\nПрисутність США в Сальвадорі забезпечує надійний бар’єр проти розширення ворожих держав у Центральну Америку. Країна користується значними економічними інвестиціями та політичною допомогою американської промисловості, а також нашими операціями, де це необхідно, що має тривати в осяжному майбутньому.\nПідпис: RB, офіс у Сан-Сальвадорі"
ELS_forpol.48.a: "Вірність, відвага, чесність"

ELS_forpol.49.t: "Короткі дзвінки"
ELS_forpol.49.desc: "В офісі панував хаос, звуки якого ледве стримували матові шибки офісних вікон. Його мешканця це тоді цілком влаштовувало, адже атмосфера відволікала від слухавки в його руці. Телефон дзвонив лише кілька секунд, перш ніж його підняли, і хрипкий голос різко заговорив крізь спотворення міжміського зв’язку. Це був голос, який усі в офісі намагалися не чути, і голос, який ніколи не приносив добрих новин. Іншого вибору тепер не було; йому треба було повідомити.\n\n"Усе скінчено. Ми... все скінчено. Фасад будинку змінився на сальвадорській стороні. Повна зачистка, і вони не люблять конкурентів унизу вулиці. Схоже, їм допомогли якісь підрядники. Один із наших хлопців розгледів декого з них, можливо, якихось іммігрантів з Андалусії та Кансая. Що нам із цим робити?"\n\nДихання, спотворене низьким буркотінням поганого зв’язку до демонічного звучання, здавалося оглушливим, і співрозмовник відчував, як кожна частина інформації фізично рухається дротом. Він заплющив очі й потер лоба. Який безлад.\n\n"Яка загроза нашим активам?" — пролунала відповідь, у якій майже не було ні злоби, ні цікавості.\n\nСпіврозмовник зітхнув. "Ми не впевнені. Нічого доброго, кажуть, нові хлопці дуже люблять своїх іммігрантських друзів, а нас вони не люблять. Тут багато справ-"\n\n"Кинь ці шпигунські розмови, синку, склади план і зроби це, щоб спробувати виправити той довбаний безлад, який створив ваш офіс. Ми зв’яжемося."\n\nСпіврозмовник майже відчув по лінії відлуння того, як слухавку жбурнули. Він повільно й обережно поклав свою. Жоден план не спадав на думку, лише хаос за дверима, що, здавалося, ставав дедалі гучнішим."
ELS_forpol.49.a: "Усі ресурси ФБР, а він усе одно не почувався могутнішим за прибиральника вулиць."

ELS_forpol.50.t: "Вранішнє сонце через Тихий океан"
ELS_forpol.50.desc: "Сотні людей зібралися в Акахутлі — найбільшому порту Сан-Сальвадору — щоб спостерігати, як заходять перші японські кораблі, на яких на повну силу майоріли прапори Вранішнього сонця. Багато хто сподівався, що приплив іноземних грошей із цієї нової далекої імперії допоможе перетворити багнисті стежки, якими вони ходили до плантацій, на справжні дороги, а їхні халупи з дерева та гофрованого металу — на справжні будинки. Однак для одного старого, який важко спирався на свою покручену тростину, ці кораблі та їхні прапори мало що означали. Він прожив достатньо, щоб знати: справжні зміни рідко приходять із чужим символом.\n\nУ підсобному приміщенні Міністерства закордонних справ у Токіо зібрали невеликий комітет, щоб обговорити долю цього потенційного нового члена Сфери. Хоча їхні імена були недостатньо важливими, щоб з’явитися деінде, крім схем ЦРУ, чоловіки, інтереси яких вони представляли, безумовно, були важливими.\n\n"Ми вже відправили кілька сотень техніків, інженерів і консультантів, щоб сальвадорські військові краще організувалися. За кілька місяців ми очікуємо, що вони підпишуть кілька контрактів на озброєння та боєприпаси, серед іншого. У довгостроковій перспективі — "\n\n"За всієї поваги, спершу нам потрібна чітка заява від них. Сальвадор — маленька країна, але він розташований просто на задньому дворі американців — і є чудовим місцем для подальших пропозицій решті Центральної Америки. Нам потрібен вступ до Сфери та негайні двосторонні оголошення, перш ніж ми відправимо туди щось військове."\n\n"Згоден. Ще краще, однак, щоб вони були явно залежними від нас, перш ніж ми зробимо цей крок, назад із якого вже не буде дороги. Я пропоную наступне — протягом наступних кількох місяців відправляйте туди цивільних інженерів. Мій департамент виділив бюджет на державотворення — буквально й переносно. Нехай перше враження сальвадорців від японців буде пов’язане з інженерами та будівельниками, а не з бізнесменами чи солдатами. Потім ми запросимо їх до себе. Звучить добре?""
ELS_forpol.50.a: "Вони вклонилися й пішли, а через Тихий океан одна нація чекала."

ELS_forpol.51.t: "Повне приєднання"
ELS_forpol.51.desc: ""І з цією угодою нехай процвітання — тобто спільне процвітання — Сальвадору та Японії буде гарантоване навіки!"\n\nСпалахували камери, коли фашистський диктатор Сальвадору, [ELS.GetLeader], потиснув руку прем’єр-міністру Японії. Його нація тепер офіційно стала членом Сфери спільного процвітання — плюнувши просто в обличчя Вашинґтону, який люто дивився з півночі. За кілька вулиць звідти, в одному з найпрестижніших районів Сан-Сальвадору, представники великих японських конгломератів куштували такі страви, як кава та пупуси, жадібно вивчаючи виробничі звіти та показники продажів. Ближче до розпечених джунглів, на військових базах, офіцери з кам’яними обличчями оглядали околиці та викликали своїх старих бойових товаришів із кампаній у Малаї та Бірмі, готові навчати сальвадорських військових битися й перемагати — і з честю помирати, коли програвали.\n\nВже міжнародні кореспонденти відкрито цікавилися, як відреагує Америка. Карти японського впливу — раніше на них були лише лінії, схожі на щупальця восьминога, що розходилися з Токіо по всій Азії, — тепер включали тонкі звивисті відростки, що простягалися через Тихий океан до невеликої центральноамериканської держави. Повне членство у Сфері означало, що незалежність і безпека Сальвадору тепер гарантовані — постійна військово-морська, повітряна та військова присутність забезпечувала б це. Але чи буде це союз, подібний до індійського — справжня незалежність, — індонезійського — сильний вплив і права на ресурси — чи найбільш страшний варіант, китайський, пов’язаний із підкоренням і рабством?\n\nОдне було напевно — "східноазійська" частина назви японського блоку стала застарілою. Холодна війна тепер справді велася між трьома полюсами на кожному континенті та в кожному регіоні світу."
ELS_forpol.51.a: "Тост за наших нових союзників!"

ELS_forpol.52.t: "Коли Хуаніто повертається додому"
ELS_forpol.52.desc: ""Знову!"\n\nСлово пролунало голосніше за гвинтівки. Норт виплюнув недопалок у сухий ґрунт, спостерігаючи, як холості набої марно врізаються в сальвадорський схил. Пляшки з алкоголем, акуратно вишикувані рядами, дивилися у відповідь на стрільців.\n\n"Принаймні в Пуерто-Платі", — гаркнув Норт на втомлених новобранців, — "вони могли влучити в щось, крім клятої землі."\n\nНовобранці мовчали. Вони не знали Пуерто-Плати. Вони нічого не знали. Діти у завеликих чоботях, старі з тремтячими руками, божевільноокі вигнанці, які ніколи не бачили нічого за межами затишку власних офісів. Усіх їх тримали разом лише американські долари та ненависть до комунізму.\n\nКоли червоні головорізи Карпіо прийшли до влади, більшість справжніх солдатів швидко зникла. Їх розстріляли, заслали або вони просто зникли. Норту пощастило, і він буквально ухилився від кулі, коли вони вирішили пощадити проамериканські елементи у війську.\n\n"Знову!"\n\nЩе один залп. Цього разу — чистий хлопок. Пляшка вибухнула. На полі стрільби запала тиша. Кілька голів повернулися, хтось прошепотів похвалу стрільцю. Норт усміхнувся, запалюючи ще одну сигарету. Він повторив той самий наказ, який вигукував увесь ранок. І продовжуватиме робити це наступні місяці."
ELS_forpol.52.a: "Наступного разу подбаймо, щоб Сан-Сальвадор це почув."

ELS_forpol.53.t: "Окраїни минулого"
ELS_forpol.53.desc: "У самому серці Сан-Сальвадору стояв Ангел Свободи, центральна частина пам’ятника національним героям. Вона височіла над головами перехожих, тримаючи високо два лаврові вінки. Перед ангелом стояв іспанець. Дорогий костюм, напружена постава та впевнений погляд, що оглядав околиці; на вигляд він був військовим офіцером у відставці. Чоловік тримав у руці портфель і незабаром пішов.\n\nНа північ від Пласа-Лібертад був більярдний клуб, який відвідували люди з гідністю та статусом. Ґуставо Руїс увійшов до клубу, і багато пар очей ліниво впали на нього, а потім відвелися, щойно його впізнали. Працівник клубу записав його ім’я. "Вітаю, Доне Руїсе", — сказав слуга, забираючи його пальто. "На вас чекають." Ґуставо ледь помітно кивнув.\n\nНа другому поверсі клубу стояли більярдні столи; йому кортіло зіграти партію, але, на жаль, графік не дозволяв. Кімната була майже безлюдною, лише кілька старших чоловіків зібралися навколо одного столу, одягнені у химерні чорні костюми. Коли Ґуставо підійшов, вони припинили гру й привітали його. Найстарший із них запропонував йому склянку віскі. "Ви граєте?" — запитав інший член гурту.\n\nКожен із них мав ту особливу військову суворість. "Кажуть, збираються чорні хмари", — сказав лідер. "Скоро варто чекати на бурю." Він покрутив напій у склянці. "Синоптика слід звільнити, він прогнозує не ту погоду." Він випив вміст склянки. "Він надто часто бере відпустку до Мехіко." Він поставив склянку й сів поруч із Ґуставо. "Ми обидва знаємо, що Мадрид у цю пору року виглядає значно краще. Шкода лише, що в нас немає зайвих грошей на подорож. Я б залюбки потиснув руку старим друзям прямо зараз."
ELS_forpol.53.a: ""Ми можемо запропонувати вам позику, послуга за послугу.""
ELS_forpol.53.b: ""Авжеж, шкода, але доведеться відкласти це на потім.""

## ELS Proxy Events
ELS_forpol.54.t: "У країні вулканів"
ELS_forpol.54.desc: "ТАЄМНО/[GetDateText]\n\nВІД МАЙКЛА НАЗА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\nТЕМА: НЕСТАБІЛЬНІСТЬ У САЛЬВАДОРІ\n\n1. Проамериканська адміністрація президента Хуліо Адальберто Рівери, поміркованого військового діяча, стикається з ескалацією студентських протестів і заворушень серед позбавлених землі сільських робітників. Поглиблення кризи розколює опорні бази уряду, військових і кавову олігархію, які дедалі більше радикалізуються в бік «кастризького» лівого націоналізму або жорсткої реакції. Без рішучих дій одна або обидві групи можуть здійснити переворот проти полковника Рівери, завдавши шкоди нашим інтересам у Центральній Америці.\n\n2. Міністр внутрішніх справ Санчес Ернандес надав документально підтверджені зізнання кількох молодших офіцерів про те, що вони приєдналися до кастристської змови під проводом колишнього президента Осоріо. Керівник резидентури Скотт у Мехіко підтвердив, що вигнаний Осоріо та його протеже майор Росалес повернулися до Сальвадору за сприяння мексиканської розвідки.\n\n3. Санчес Ернандес представив непрямі докази опортуністичних японських та іберійських операцій впливу, зосереджених на аномально високому обміні єн і стенограмі розмови в казармах Санта-Ани, де неодноразово згадувався Мадрид. Імовірність того, що ці держави підтримують реакційні сили для здобуття плацдарму в Центральній Америці, є помірно високою.\n\n4. З огляду на значні оперативні зобов’язання в інших місцях, запитується тимчасове переведення від двох до чотирьох додаткових спеціалізованих співробітників для підтримки контррозвідувальних операцій у Сальвадорі. Ця «Операція Граніт» виявлятиме та ліквідовуватиме анти-ріверистські осередки в сальвадорських збройних силах у співпраці з місцевими партнерами."
ELS_forpol.54.a: "Вірність, відвага, чесність."
ELS_forpol.54.tt: "ЦРУ тепер може проводити Операцію Граніт у Центральній Америці до чотирьох разів, щоб зменшити ризик ворожого перевороту в Сальвадорі."

ELS_forpol.55.t: "Супротивник із опущеною вартою"
ELS_forpol.55.desc: "Стільці перед Лопесом Матеосом були порожні, але він усе ще відчував присутність чоловіків, які щойно на них сиділи — колишнього президента Сальвадору Оскара Осоріо та його молодого протеже Рубена Алонсо Росалеса. Тягар їхніх слів загрожував викликати мігрень.\n\nУряд Сальвадору, лише фіговий листок для кавових олігархів та їхніх американських союзників, перебував в облозі селян і студентів, натхненних Кастро та Карибським легіоном. Тепер ці двоє вигнанців попросили про зустріч із Матеосом. За підтримки реформістів у військових та кавовій олігархії вони обіцяли спрямувати протести в русло стійкої революції. Вони були близькі до захоплення влади, як вони стверджували, але потребували підтримки мексиканської розвідки, щоб закріпити угоду.\n\n«Усього лише казка». — пробурмотів Матеос, схилившись над столом і тримаючи голову в руках. Почувши звук паперу, покладеного перед ним, він підвів голову й побачив Мануеля Тельйо Бауррауда.\n\n«Ситуація в Сальвадорі нестабільна, але згідно з нашими звітами, вони мають необхідну для перевороту підтримку».\n\n«Навіть так, — заперечив Матеос, — якщо вони повалять чинний уряд за підтримки Мексики, Янкі знімуть із мене голову».\n\n«Не обов’язково. Ми можемо сказати, що нашою метою було підтримати поміркованих, які стримають крайнощі студентів. І, чесно кажучи, з їхньою безсоромною підтримкою сильних правителів американці самі напросилися».\n\nУ пам’яті Матеоса промайнув спогад: під час своїх боксерських днів його викликав на бій значно більший і вправніший чоловік, але Матеос відмовився відступати. Хоча він програв матч, Матеос залишив суперникові добрячу гематому й здобув його повагу. Після всього, що Янкі зробили з ним на Алеутських островах, настав час завдати їм удару."
ELS_forpol.55.a: "«Дамо Дядькові Сему підбите око»."

ELS_forpol.56.t: "Розпечений котел"
ELS_forpol.56.desc: "До цього листа додається оригінал і перекладена копія листа від генералів Соси та Медрано із Сальвадору.\n\n«До уряду Його Імператорської Величності,\n\nМи визнаємо, що через відстань ви можете бути незнайомі із ситуацією в Сальвадорі. Проте ми вважаємо, що Сальвадор являє собою стратегічну та комерційну можливість для Японії. Наша земля є найбільш процвітаючою в усій Центральній Америці, значно індустріалізувавшись за останнє десятиліття. Це зростання відбувалося на тлі хронічної політичної нестабільності, включно з двома переворотами лише за це десятиліття.\n\nНаш нинішній президент, полковник Рівера, рабськи виконує накази своїх господарів у Вашинґтоні, ображаючи захисників нашої нації та відчужуючи її кавових виробників, основу нашої економіки й суспільства. Він виявився нездатним придушити комуністичних селян і студентів, які тепер шаленіють. Щоб не допустити їх та їхніх кастристських однодумців до нашої нації, необхідна тверда рука.\n\nІнституції, які ми представляємо, Національна гвардія, Повітряні сили та ORDEN, прагнуть встановити стабільність. Стабільність, неможлива під ярмом янкі. Сальвадорські патріоти прагнуть узятися за зброю проти хаосу та імперіалізму Вашинґтона. За умови вашої допомоги наш успіх гарантований.\n\nМаючи спільного ворога, якому можна пустити кров, і взаємне процвітання на горизонті, ми з нетерпінням чекаємо на вашу відповідь,\n\nГенерали Медрано та Соса.»"
ELS_forpol.56.a: "«Скажіть агенту Морі розібратися з цим. Потенційний плацдарм в Америці...»"
ELS_forpol.56.tt: "\nЗнекровлені Ясудою та під наглядом §mСША§!, ми маємо розглянути непомітні кроки для забезпечення успіху перевороту, дозволивши §KМексиці§! та §OIбе§!§nрії§! взяти на себе основну частину зусиль."

ELS_forpol.57.t: "Конкістадор XX століття"
ELS_forpol.57.desc: "Чоловік спортивної статури в костюмі відхилив ром, усміхнувшись і похитавши головою. Стюардеса авіакомпанії Іберії спробувала знову, з кокетством у голосі: «Ви важко працюєте, Доне Руїсе, невже не можете трохи розслабитися перед прибуттям до Сан-Сальвадору?»\n\nРуїс нахилився вперед, затуляючи те, що лежало перед ним. «А, мої роботодавці цього не схвалили б, сеньйорито». Швидкі очі стюардеси помітили те, що він намагався приховати — фотографію президента Сальвадору, полковника Рівери; кілька фотографій студентів і селян, що протестували; вирізки про висадки в Пуерто-Платі... Помітивши її погляд, Руїс усміхнувся: «Вони володіють сальвадорськими кавовими плантаціями. Краще не прибувати п’яним».\n\nВона поставила ром назад на візок і пильніше поглянула на Руїса. Військова виправка була очевидною при другому погляді, коротко підстрижене волосся — «А що ви робите для цих кавових плантаторів, Доне Руїсе? Має бути щось... особливе, якщо вони посилають вас через Атлантику та Центральну Америку».\n\nУ його голосі з’явилася жорсткість: «Революціонери шаленіють у Сальвадорі, а уряд не зміг їх придушити. Дехто навіть проник у військові сили. Сальвадорські патріоти прагнуть скористатися методами Патрії, щоб розв’язати цю ситуацію. А я дещо знаю про методи Патрії»."
ELS_forpol.57.a: "Слова були новими, але багатовіковий блиск завоювання світився в його очах."

ELS_forpol.58.t: "Літні плани"
ELS_forpol.58.desc: "«Яка різниця між вами та людьми, яких сьогодні тут немає?» Ернесто непомітно поглянув на решту груп, де голоси з такою ж переконаністю повторювали ту саму риторику. Жменьці кубинських і домініканських ветеранів Карибського легіону доручили навчати трохи більше сотні сальвадорців, а розділення їх на менші групи вважалося найефективнішим способом це зробити.\n\n«Що змусило вас відважитися перетнути прикордонників і опинитися сьогодні тут, у цьому вологому, спекотному й задушливому куточку джунглів Юкатану?» Ернесто перевів увагу на молодих чоловіків, щойно закінчивших школу, ледь старших за його власного сина, перш ніж продовжити. «Вас довели до межі ваших можливостей».\n\n«Здатність народу витримувати труднощі неперевершена, але якимось чином корумповані, елітарні фашистські свині у вашому уряді змусили вас діяти. Вони змусили вас повстати. Як надихнути маси на цю мужність, коли вони вважають, що можуть витерпіти ще трохи? Це просто питання того, щоб показати їм, скільки вони можуть здобути й як мало вони можуть втратити. Листівки, графіті й, що найважливіше, товариші, передача з уст в уста». Ернесто на мить замовк, щоб слова осіли.\n\n«У відповідь, безсумнівно, фашисти спробують вас заарештувати або вбити. Ці репресії також ще більше схилятимуть народ на ваш бік. Це не означає, що ви повинні дозволити їм зробити з вас мучеників без боротьби. Тож стежте, щоб залишатися активними й рухливими, дійте швидко й під покровом ночі. Ніколи не зраджуйте своїх товаришів під тиском, так само як і вони ніколи не зрадять вас. І, звісно, якщо вам доведеться тікати, тікайте за кордон. Ви повернетеся після нашої перемоги». На його останніх словах один молодий сальвадорець скочив на ноги, вигукуючи про майбутнє визволення Сальвадору. Ернесто усміхнувся. Якщо це молодь Латинської Америки, то перемога була лише питанням часу, а не можливості."
ELS_forpol.58.a: "Майбутнє народу — у студентах."

ELS_forpol.59.t: "Кінець мотузки"
ELS_forpol.59.desc: "Водій мексиканського посла напружено намагався уникати зіткнень із молодими демонстрантами, коли вони пробиралися вузькими вулицями Сан-Сальвадору. Анхель Кано дель Кастільйо чув повідомлення про протести в Університеті Сальвадору того ранку, коли попросив водія відвезти його до ресторану в центрі міста на зустріч із японськими бізнесменами. Проте сцени перед ним нагадували громадянську війну: поліцейські машини горіли, студенти кричали, коли їх били кийками, кашляли від диму гранат або нерухомо лежали на тротуарі.\n\nВін зітхнув із полегшенням, коли машина звернула на тихішу бічну вулицю, сподіваючись, що хаос скоро вщухне і він зможе повернутися до посольства, щоб утекти від безладу. Але його полегшення зникло, коли хвиля протестувальників побігла прямо на них. Десятки молодих людей перестрибували через капот машини або ховалися за нею. Анхель сидів безмовно, його горло стискалося.\n\nКоли поширилася паніка, поліція відкрила вогонь димовими гранатами, а невдовзі пролунали постріли. Він і його водій інстинктивно пригнулися, намагаючись не стати випадковими жертвами. Через десять чи п’ятнадцять напружених хвилин він підповз до заднього вікна. Студенти тікали, деякі трималися за обличчя або закривавлені кінцівки. Попереду поліцейські методично били невелику групу молодих чоловіків, а потім затягували їх напівпритомними до фургона. Не промовивши ні слова, водій знову завів машину й повернув додому.\n\nПовернувшись до свого кабінету, Анхель почав складати звіт для Секретаріату зовнішніх зносин. Заповнивши очікувані формальності, він зупинився, щоб ковтнути кави перед тим, як поставити печатку, і поглянув у вікно. Зазвичай тиха вулиця біля посольства перетворилася на море розлючених студентів із піднятими в знак непокори уряду кулаками. Він повернувся до столу. Якщо навіть вулиця посольства стала місцем заворушень, то пом’якшення правди було б ведмежою послугою його нації. Мексика повинна зрозуміти, що Сан-Сальвадор стоїть на межі..."
ELS_forpol.59.a: "«І хоча ніхто не може бачити майбутнього, ймовірно, ситуація вийде з-під контролю протягом кількох днів»."

ELS_forpol.60.t: "Стиснуте горло"
ELS_forpol.60.desc: "Блакитний салон завжди був сповнений активності, і о 15:00 президент Хуліо Адальберто Рівера зустрівся з американським послом і двома агентами розвідки. Їхні костюми були бездоганними, з тропічної вовни, обличчя не виражали жодних емоцій, і вони здавалися радше автоматами, ніж людьми, рідко розмовляючи й завжди чітко, без люб’язностей. Рівера наказав дворецькому принести чоловікам каву та емпанадас як люб’язний жест, сподіваючись зменшити їхню напругу.\n\n«Як бачите, президенте Ріверо, — сказав перший безликий агент ФБР, — наші інформатори цілком однозначні. У військових зростають такі настрої, а після Кубинської революції та Пуерто-Плати університетами й військами поширюються хвилі впливу. Це більше, ніж прості заворушення, усе значно організованіше».\n\nРівера склав руки. «Я не хочу бути ще одним Трухільйо. Я можу очолювати військовий уряд, але метою завжди було зменшити бідність і покращити рівень життя. Щойно ми вирішимо основні проблеми вартості життя, тоді зможемо зосередитися на викоріненні корупції та покращенні верховенства права. Але важко досягати всього цього за обмежених ресурсів і такої кількості вимог».\n\nПосол допив свою каву. «Не хвилюйтеся. Наші агенти розвідки готові допомогти вам розгромити цю змову й убезпечити країну. Ми організуємо зустріч із вашим очільником розвідки та окреслимо кілька варіантів дій, які ми можемо здійснити». Посол і його супровід із ФБР підвелися, щоб піти, потиснувши руку президенту.\n\nПісля їхнього відходу дворецький повернувся, щоб забрати таці. «Погляньте-но, пане. Чашки порожні, але до їжі вони навіть не доторкнулися»."
ELS_forpol.60.a: "«Можливо, вони втратили апетит або заїдали свої тривоги». Президент Рівера проковтнув своє роздратування."

ELS_forpol.61.t: "Пропорційна сила"
ELS_forpol.61.desc: "Увесь персонал Президентського палацу був зайнятий. Натовп чоловіків слухав новини, що лунали з радіо, передаючи стоси паперів з одного кінця палацу до іншого. Президент Сальвадору Хуліо Рівера сидів у своєму кабінеті посеред усієї цієї метушні, а перед ним сидів американський посол Мурат Вільямс, обговорюючи деталі майбутнього путчу.\n\n«Обурливо! Як таке проникнення, що торкнулося кожної частини суспільства, могло так довго залишатися непоміченим? Чверть армії скомпрометована!» — президент сердито провів пальцем по карті на столі, дряпаючи нігтем червоні позначки, що представляли повсталі муніципалітети. Він був настільки поглинутий своїм гнівом, що не зважав на чоловіків навколо. «Погляньте, скільки нашої країни вони вкрали! Неприпустимо».\n\n«Пане президенте. Я розумію ваше розчарування. Але, будь ласка, спробуйте зберігати спокій. Ще не все втрачено», — Мурат поклав палець на карту, показуючи йому зосередження лоялістських сил навколо столиці. «Ми можемо поступатися чисельністю, це правда, але погляньте навколо. Ваш уряд добре підготовлений і укомплектований найвидатнішими командирами. Наші вороги — дезертири низького рангу та студенти, які щойно вийшли з дитинства». Американець усміхнувся. «Наші сили зосереджені вздовж блокпостів на вигідних позиціях. Будь-який напад на нас буде самогубством. Крім того, я сумніваюся, що до цього дійде. Найімовірніше, вони розсіються, коли зрозуміють, що ми не зламаємося і що мій уряд прикриває вас».\n\nПрезидент Рівера приборкав свій гнів. Слова посла справді втішали. Саме тоді він почув, як диктор радіо оголошує про новий поліцейський кордон навколо протесту в Університеті Сальвадору. Його лють зникла, змінившись гнітючим відчуттям безпорадності в животі. Він неспокійно поворухнувся, усвідомивши, що його доля, найімовірніше, опиниться в руках Всемогутнього Бога."
ELS_forpol.61.a: "Готовність і янкійські покровителі нічого не можуть вдіяти проти Божественного втручання."
ELS_forpol.61.tt: "Наше вікно для підтримки уряду Сальвадору через Операцію Граніт ФБР добігає кінця."
 

ELS_forpol.62.t: "Леопарди"
ELS_forpol.62.desc: "Троє найбагатших чоловіків Сальвадору вийшли з Кабаньї, попідруки з групою іберійських офіцерів, сміючись і згадуючи свої шкільні витівки. На березі їхні діти гралися у хвилях, а плітки їхніх дружин долинали до них майже як солодка мелодія. Та того дня сонце пекло, Кабанья кликала, і вони швидко перейшли до справи.\n\n«Ніхто більше не поважає каву. Ми практично збудували Сальвадор із нуля, а все, що роблять політики-комуністи, ці підставні особи, — це ниють про наші «зловживання». Червоні відчули запах крові, кажу вам. Я навіть не можу більше виходити в міста! Профспілки постійно марширують. Вони мають повну безкарність. Вони навіть наважуються заходити до моїх робітників. Продуктивність падає на кожній фабриці й у кожному полі. Я бачив неймовірні жахіття, мої наглядачі були повішені, поліцейських у містах застрелено, а на їхніх язиках залишено монети, я міг би продовжувати годинами!»\n\nІберійці уважно слухали, обмінюючись схвильованими поглядами й жестами просячи мовця продовжувати. Нарешті найстарший за рангом серед них підвівся. Вся кімната повільно стихла.«Панове, цьому жахливому безладу пора покласти край. Спочатку Батіста, потім Колумбія, потім Трухільйо, а тепер це. Янкі, схоже, мають намір встромити кіл у саме серце порядку. І якщо для цього їм доведеться використовувати комуністів, то так тому й бути. Нам потрібен оплот, замок, з якого ми зможемо перегрупуватися».\n\nВін на мить замовк, коли один із сальвадорців схопився на ноги.«Ми вже переманили половину військових! Нам потрібні лише гроші, певні гарантії від... більш впливових сил...»\n\n«Це ви отримаєте. Я хочу адреси та імена і обіцяю: усі ваші проблеми будуть висмоктані разом із кров’ю!»"
ELS_forpol.62.a: "Піднімаючи надії з мертвих."

ELS_forpol.63.t: "До вічної співпраці"
ELS_forpol.63.desc: "Сміх лунав усією плантацією. На балконі родина кавових магнатів намагалася втримати увагу свого гостя, японського бізнесмена, який представляв місцеву кавову фірму, тепер переходячи до світської розмови. Дві компанії роками мали спільний контракт і сподівалися розширити виробництво найближчими місяцями.\n\n«Сан-Сальвадор не зовсім та сільська ідилія, яку мені обіцяли». Родина знову тихо засміялася, але обличчя Сейкі Саваї залишалося безпристрасним. «Протестувальники полюбляють перекривати мені шлях щоразу, коли мені потрібно дістатися до плантації».\n\nНаймолодший чоловік кивнув. «Будь-хто інший придушив би їх давним-давно, але Рівера просто не може дійти до цього. Думаю, він уже не здатен».\n\nСтарший чоловік, його дід, похитав головою. «Послухайте, це не ті самі більшовики, що штурмували Москву, але вони, безперечно, комуністи. Якщо вони коли-небудь прийдуть до влади, нам пощастить, якщо ми виберемося звідси живими». Уся родина відвернулася, але ніхто не міг ігнорувати серйозність ситуації.\n\n«Я впевнений, що противників Національного примирення більше, ніж лише ці люди», — запитав Сейкі, його обличчя виражало занепокоєння. «Я впевнений, що не лише вони закликають до націоналізму і що ця точка зору не належить винятково комуністам».\n\nТретій чоловік, на кілька років старший за свого молодшого брата, кивнув. «Вони точно існують. Я служив у війську рік у 52-му. Далі не пішов, але в мене є друзі, які продовжили службу, і вони настільки націоналістичні, наскільки це взагалі можливо».\n\nСейкі усміхнувся, а потім дістав із портфеля солідний чек. «Якщо ви можете гарантувати, що їхній націоналізм буде поміркованим, коли йдеться про японський експорт, думаю, ми домовилися»."
ELS_forpol.63.a: "Абсолютна влада, сформована прагненням до грошей."

ELS_forpol.64.t: "Роздмухуючи полум’я"
ELS_forpol.64.desc: "Підполковника Орасіо Лобоса Мендеса від паперової роботи відволік один із його найбільш довірених підлеглих. Молодий сальвадорський солдат віддав честь, клацнув підборами й поклав на стіл запечатаний конверт. Коротким кивком Орасіо відпустив його й почекав, доки той вийде, перш ніж відкрити конверт. Зрештою, деякі речі краще було залишати невидимими й невисловленими.\n\nВсередині був короткий лист від товариша-офіцера та ключ, саме те, чого він очікував. Забравши обидва, він вийшов із кабінету й попрямував до старого складу всередині казарм. Він нервово озирнувся, потім вставив ключ у замок і відчинив двері. У тьмяному приміщенні лежали складені штабелі гвинтівок, ящики з гранатами й ряди мотоциклів. Біноклі, боєприпаси, уніформи.\n\nОрасіо усміхнувся й провів рукою по одному з ящиків із гранатами. Надруковані інструкції містили великі японські ієрогліфи іноземного виробника. Його усмішка стала ширшою. Піднявши складений папір із сусіднього столу, він замкнув за собою двері й перетнув подвір’я до квартири полковника.\n\nВін мовчки увійшов до кабінету й поклав папір на стіл полковника. Той оглянув його, потім дістав складену карту з шафи, а Орасіо повернув вентилятор на повну потужність і замкнув двері. «То ми отримали поставку?» — прошепотів полковник.\n\nОрасіо кивнув, його усмішка стала ще ширшою. Пальцем він простежив на карті, куди рушать їхні сили, де встановити блокпости й які цілі захопити. Він говорив про захоплення Національного палацу, хоробрість солдатів, порятунок Сальвадору від іноземного впливу: жадібних янкійських болонок і дурних кастристських підлабузників. Зрадники тремтітимуть, коли вони прийдуть до влади, — справді націоналістичний уряд, який поверне честь Сальвадору. Орасіо знав, що він не один. По містах, містечках і казармах безстрашні, почесні чоловіки були готові повстати й померти за порятунок Сальвадору..."
ELS_forpol.64.a: "...І його ім’я буде записане поруч з іменами героїв в історії."

ELS_forpol.104.t: "Втеча покаянців"
ELS_forpol.104.desc: "Ґуставо Руїс, людина Іберії в Сальвадорі, на мить завагався, перш ніж піднести бритву до волосся. Він залишив пасма у раковині готелю; він більше ніколи сюди не повернеться.\n\nГенерал Хосе Альберто Медрано, до вчорашнього дня очільник Національної гвардії, чекав на нього біля дверей, його власна голова була поголена, а волосяниця сиділа на його мускулистій фігурі так само незручно, як одяг Руїса. Жорсткий радикал хихикнув, побачивши свого «чернечого брата», а потім жестом показав йому на задні сходи. «Там унизу чекають осли, спереду солдати президента Рівери».\n\nДон Руїс скривився: «Осли, аж до кордону з Гондурасом?»\n\n«Лише якщо нас спочатку не посадять до тюремної камери», — сказав Медрано, оголивши зуби в якомусь збоченому захваті. «Наш Небесний Отець може пробачати гріхи, але полковник не пробачає спроб перевороту». Він із силою військового відчинив двері, а потім вийшов на сонячне світло зі спокійним виразом обличчя служителя церкви. Руїс незграбно пішов за ним, помітно менш зібраний.\n\nОсли були прив’язані до стовпа на вулиці, як і було обіцяно. Але насторожені солдати стояли надто близько: один із їхніх товаришів зупинився, щоб погладити тварин.\n\n«Нам не виявили б такої ж милості», — прошепотів Медрано, перш ніж скинути сандалі в провулку й почати довгий шлях на північ пішки."
ELS_forpol.104.a: "Руїс зітхнув, дорога до Іберії буде довгою."
ELS_forpol.104.tt: "Американські [USA.GetFlag]§mамериканські§! лещата над [ELS.GetFlag]§WСальвадором§! залишаються... [IBR.GetFlag]наш §,реконкіста§! завершилася невдачею."

ELS_forpol.105.t: "Відбитий удар"
ELS_forpol.105.desc: "Матеос дивився на холодну чашку кави, що стояла перед ним. Із Чіапаса. Відтепер усі вони будуть із Чіапаса — Сальвадор зачиняв двері після того, як позбувся змовників, яких Мексика таємно повернула до країни. Тепер маленький лакей побіг до гринґо, щоб донести.\n\nВін знову звернув увагу на секретарів Ордаса та Бауррауда — тепер вони сперечалися на повний голос. Ордас був гучнішим: «Уряду полковника Рівери є два агенти DFS у Санта-Ані. Навіть якщо вони не говоритимуть під тортурами, ці кастристи заговорять. Я не буду палити свій зв’язок зі Скоттом, розповідаючи йому, що ми не були причетні — він відчує лайно на моєму язиці ще до того, як я відкрию рота».\n\nОчі Бауррауда благали, навіть якщо його тон залишався твердим. Він втягнув Мексику в цю халепу — познайомив Матеоса з тими сальвадорськими вигнанцями з мрією. «Секретарю Ордасе, я розумію ваше занепокоєння. Однак це питання надзвичайної національної важливості, слово довіри від ФБР значно пом’якшить...»\n\nМатеос підвівся, кава трохи захлюпнулася від руху. Пара повернулася до свого президента: «Я завдав удару, і я прийму удар у відповідь. Зателефонуйте Вінстону, я поясню, що наші польові агенти забігли вперед, і запропоную кілька голів у DFS. Він не купить це. Це вдарить по моїй довірі, але жест у будь-якому разі буде оцінений».\n\nПрезидент знову поглянув на каву, сиве волосся відбивалося в чорній калюжі."
ELS_forpol.105.a: "«Я вже надто старий, щоб займатися боксом»."
ELS_forpol.105.tt: "Уряд [ELS.GetFlag]§WСальвадору§! переміг §&патріотів§!, які мали його визволити. [USA.GetFlag]§mЯнкі§!йське панування над Центральною Америкою сильніше, ніж будь-коли."

ELS_forpol.106.t: "До кісток"
ELS_forpol.106.desc: "Вітер легко ворушив волосся на голові полковника Хуліо Адальберто Рівери, який їхав вулицями Сан-Сальвадору на своєму мотоциклі Harley-Davidson. Це була не шалена їзда поліцейських машин і військових автомобілів, що гуркотіли дорогою й ледь не перекидалися на поворотах, намагаючись розігнати студентські протести, а спокійна, навмисно помірна поїздка країною, яка нарешті дочекалася миру.\n\nПісля місяців нестабільності новозабезпечений президент Сальвадору міг спокійно дихати разом з рештою своєї країни. По всьому Сан-Сальвадору, коли його мотоцикл гуркотів уперед, він ненадовго проїжджав повз військові блокпости, які демонтували, деякі швидше за звичайне, щоб дозволити президенту проїхати майже без перешкод.\n\nПроїжджаючи повз мексиканське посольство, він ненадовго зупинився, щоб прислухатися до звуків вантажівки з гучномовцями, яка гучно транслювала пропаганду Партії національного примирення. Погляд Рівери зупинився на групі солдатів на вулиці, і він схвально кивнув, коли вони вибивали двері сховку, наповненого кастристськими зрадниками, перш ніж знову рушити.\n\nМісцем призначення було американське посольство, де полковник зустрівся з янкійським послом на рівні вулиці. Обидва були зайнятими чоловіками, на яких чекала ще купа роботи, але Рівера затримався ненадовго. Перед відходом, після однієї-двох відрепетируваних люб’язностей, він потиснув руку послу, дозволивши собі лише один невибачливий жест чесності — і перед послом, і перед його колегами у Вашинґтоні."
ELS_forpol.106.a: "«Ґрасіас...» — наголосив він, перш ніж сісти на мотоцикл і рушити до Національного палацу."
ELS_forpol.106.tt: "Уряд Рівери, реформістська, [USA.GetFlag]про-§mамериканська§! модель для Центральної Америки, пережив загрози [MEX.GetFlag]§&революції§![CUB.GetFlag] та [IBR.GetFlag]§,реакції§![JAP.GetFlag]. [ELS.GetFlag]§WСальвадор§! дотримуватиметься відповідального курсу — наразі."

ELS_forpol.107.t: "Зворотний рейс"
ELS_forpol.107.desc: "Для Кенджі Морі рейс із Мехіко був принаймні тихим, таким, що дав йому вдосталь відпочинку, який пізніше знадобився б йому під час стояння в черзі. Потік прибулих у Сан-Сальвадор був майже моторошним, малим за чисельністю, так, але значно більшим за приплив, якого можна було б очікувати для такої маленької країни. Звісно, причина його прибуття була нетиповішою за більшість. «Кавове агентство» могло звучати зручно нешкідливо для необізнаного обивателя, але японський розвідувальний апарат був так само змушений стежити за справами в Сальвадорі, як і будь-яка інша нація, що стежила за подіями в так званому американському «задньому дворі».\n\nМорі гортав японсько-іспанський розмовник, граючи роль ще одного відстороненого, доброзичливого туриста, коли з моря інакше темнішої шкіри з’явився білий чоловік. Офіцер прикордонної варти супроводжував його, жестом вивів Морі з черги й передав йому складений пергамент. Він не одразу розібрав іспанську, але жирний червоний штамп на його туристичній візі говорив усе. Йому відмовили у візі.\n\nПрикордонник пояснив, що нові заходи безпеки адміністрації Рівери були введені в дію як реакція на нещодавно придушену спробу державного перевороту. Напівприголомшений Морі спостерігав, як майже кожного іншого прибулого пропускали через ворота, поки прикордонник пояснював ситуацію. Йому сказали, що він муситиме чекати наступного чартерного літака назад до Мехіко.\n\nМорі подякував прикордоннику за витрачений час, відчуваючи на собі допитливі погляди інших. Він забрав свою візу та речі й попрямував до далекої лавки чекати на свій рейс. Той білий чоловік, якого Морі тепер вважав, імовірно, агентом ФБР, спостерігав здалеку."
ELS_forpol.107.a: "Янкі широко вишкірився, і Морі довелося стриматися, щоб не закотити очі."
ELS_forpol.107.tt: "[ELS.GetFlag]§WСтатус-кво Сальвадору§! як [USA.GetFlag]про-§mамериканської§! держави зберігся. Втрачено можливість встановити [JAP.GetFlag]§xнаш§! вплив у Центральній Америці."

ELS_forpol.108.t: "Зміна стійки"
ELS_forpol.108.desc: "Окуляри. Президент Матеос на мить задумався над ними. Потурання віку, визнання слабкості. Визнання, якого він не зробив би перед секретарем зовнішніх зносин Баурраудом.\n\nНатомість він знову перевернув фотографію щойно оголошеної сальвадорської хунти й сказав, "Я впізнаю майора Росалеса, полковника Осоріо та доктора Касереса, ми зустрічалися, коли вся ця справа лише починалася. Але хто ці солдати позаду?"\n\nБауррауд кивнув і зморщеним пальцем указав, "А, ось Медрано — голова Національної гвардії. Ще той персонаж, також очолює ORDEN, сальвадорське сільське воєнізоване розвідувальне агентство. За нашими звітами, він п’яний кат. Генерал Соса тут-" швидкий рух пальця, "трохи більш респектабельний. Розважливий, розсудливий, голова Повітряних сил. Хоча в 40-х він виявляв деякі тривожні симпатії до країн Осі. А ось тут -"\n\nМатеос перебив, "Я радий, що переворот відбувся, секретарю, але сальвадорці саджають на цю хунту справжню наволоч. Чи можемо ми якось натиснути на Росалеса, щоб, ммм, трохи почистити її?"\n\nБауррауд на мить прикусив губу, "Я подивлюся, що зможу зробити, Ваша Високосте. Правду кажучи, позиція кастристів хитка. Переворот вдався лише завдяки переходу на їхній бік Національної гвардії та Повітряних сил, а тепер праві на кшталт Медрано й Соси перебувають у привілейованому становищі. На тлі безперервних заворушень на вулицях кавова олігархія також гуртується навколо таких жорстких людей."\n\nЗ окулярами чи без, Матеос бачив, що насувається. "Я хотів завдати удару Дядькові Сему, Бауррауде. Але мене непокоїть наш лівобічний підхід до Сальвадору,""
ELS_forpol.108.a: ""перетворився на чортів правий хук.""
ELS_forpol.108.tt: "Хоча ми похитнули [USA.GetFlag]§mянкійське§! панування над Центральною Америкою, те, що буде далі з [ELS.GetFlag]§WСальвадором§!, може бути значно §,гіршим§!..."

ELS_forpol.109.t: "Кесальтепеке"
ELS_forpol.109.desc: "Гуп-гуп-гуп. Рівера ледве міг ясно мислити, поки натовп оточував Національний палац і гатив у ворота. Ряди поліції для придушення заворушень відтісняли чергову хвилю, та не могли зупинити згинання сталі. Архітектурне диво в самому серці Сан-Сальвадору, перетворене на гарячкове поле бою. Серце Рівери ледве витримувало все це.\n\n"Відкривайте вогонь по тих агітаторах надворі, Санчесе, і припиніть зволікати!" Охоронці сховали зброю в кобури біля вікон Жовтої кімнати, вдаючи, що не звертають уваги на Ріверу, який несамовито віддавав накази в слухавку. Потім він набрав інший номер після того, як обірвав розмову із Санчесом.\n\n"Мені негайно потрібна пряма лінія до Білого дому без-"\n\nДюжина нових солдатів увірвалася до його кабінету й легко здолала жменьку охоронців Рівери. Один із солдатів виступив уперед і прикладом M16 ударив Ріверу в ніс, збивши його з ніг. Рівера був захоплений зненацька двома речами: нашивкою Карибського легіону на заколотниках і появою Рубена Алонсо Росалеса, який постав перед ним як командир заколотників.\n\nПостріли швидко заглушили гасла й гамір надворі, заставши зненацька і Ріверу, і Росалеса. Незграбний вираз обличчя Росалеса натякав, що вони не цілком контролювали всю революцію.\n\n"Ти був не таким кмітливим, як думав, мій друже, коли вирішив, що вся нація може схилитися перед тобою, коли ти вдерся до мого кабінету. Лише питання часу, коли твої власні люди направлять ті самі стволи на тебе, Росалесе!" Тирада Рівери легко пробила стриманість Росалеса, а внутрішня паніка була написана на його обличчі. Росалес тихо наказав кубинцю поруч із ним перерізати телефонний дріт."
ELS_forpol.109.a: "Секретар Білого дому на іншому кінці лінії залишився базікати в порожній телефон."
ELS_forpol.109.tt: "Нашого [ELS.GetFlag]§Wсальвадорського§! партнера повалено. §,Реакціонери§! та їхні [IBR.GetFlag]§Oіноземні§! §nпокровителі§![JAP.GetFlag] набирають сили в тіні."

ELS_forpol.110.t: "На висоті"
ELS_forpol.110.desc: "Коли Кенджі Морі привернув увагу прикордонної варти, він не зовсім знав, що думати. Він щойно зійшов із літака з Мехіко в Сан-Сальвадор, гортаючи японсько-іспанський розмовник. Можна було б припустити, що він просто ще один турист із рідних островів. Припущення було не неправильним, хоча все було дещо складніше.\n\n«Кавове агентство» не було саме на вершині списку пріоритетів японських розвідувальних ініціатив, але тримати вухо гостро в Центральній Америці, лише за крок від континентальних США, було вартою інвестицією для панів у Токіо. Саме тому очікування в непримітній низці сірих кімнат за службовою частиною аеропорту було таким зловісним, навіть коли Морі подумки намагався зберігати спокій.\n\nВиявилося, що він недарма це робив, адже зрештою двері відчинилися, і крізь них пройшла невелика група охоронців. Стоячи осторонь, вони пропустили не кого іншого, як генерала Хосе Альберто Медрано, голову сальвадорської Національної гвардії та сальвадорської розвідки, який увійшов із високо піднятим підборіддям і випнутими грудьми.\n\nПерш ніж Морі встиг навіть відреагувати, Медрано міцно схопив його за руку, потиснув її з сяйливою усмішкою. Він безмежно подякував йому та Імперії за підтримку нового режиму в Сан-Сальвадорі, повідомивши, що операції з придушення контрперевороту вже розпочалися. Піднос із келихами для вина та найкращим чилійським червоним. Генерал особисто налив вина й офіційно запросив Морі насолодитися своєю ідилічною країною."
ELS_forpol.110.a: "Вони приватно цокнулися келихами, виголосивши тост за нову дружбу між націями."
ELS_forpol.110.tt: "Перемога - §xми§! зламали хватку [USA.GetFlag]§mВашинґтона§! над [ELS.GetFlag]§WСальвадором§!. Незабаром [JAP.GetFlag]§xми§! пожнемо комерційні та розвідувальні вигоди."

ELS_forpol.111.t: "Мексиканський хук"
ELS_forpol.111.desc: ""Ви коли-небудь ходили на ринг, секретарю?" — запитав президент Матеос, перериваючи резюме Бауррауда щодо складу нової хунти Сальвадору.\n\n"Зізнаюся, нечасто, Ваша Високосте," — сказав Бауррауд, відкладаючи свою папку. Не було сенсу переривати Адольфо подробицями успішного сальвадорського перевороту, коли в його очах з’явився такий вираз.\n\n"Мій улюблений удар, наш національний удар, — це хук прямо в печінку супротивника. Бам!" Матеос відкинув голову назад від захвату, а потім опанував себе, "І найкраще те, що сила удару повертає тебе у захисну стійку."\n\nБауррауд усміхнувся разом із ним, коли президент продовжив, "Звідти можна робити що завгодно — відступити, грати в обороні, якщо хочеш. Дати цій хунті влаштуватися, заспокоїти селян, поставити президента — Росалес, якщо мене питаєш, схоже, саме той, молодий, діяльний. Надіслати кілька звітів LITEMPO до Вашинґтона, заявляючи, що ми так само розгублені через усе це, як і вони."\n\n"Або," — підняв брову президент, "піти впритул, гатити заради нокауту. Ми сідаємо на літак до Сан-Сальвадору — вип’ємо кави з доктором Касересом, дамо полковнику Осоріо якусь медаль Веракруса й проїдемо парадом у найкращому автомобілі поруч із найвродливішими ґуанаками, яких вони мають.""
ELS_forpol.111.a: ""Ти знаєш мій стиль, секретарю. Починай пакувати валізу.""
ELS_forpol.111.tt: "[ELS.GetFlag]§WСальвадор§! залишається нестабільним — але [MEX.GetFlag]§Kнаша§! перемога знаменує початок нової, §&революційної§! ери в Центральній Америці."

ELS_forpol.112.t: "Ілопанґо"
ELS_forpol.112.desc: "Гуп-гуп-гуп. Рівера ледве міг ясно мислити, поки натовп оточував Національний палац і гатив у ворота. Ряди поліції для придушення заворушень відтісняли чергову хвилю, та не могли зупинити згинання сталі. Архітектурне диво в самому серці Сан-Сальвадору, перетворене на гарячкове поле бою. Серце Рівери ледве витримувало все це.\n\n"Відкривайте вогонь по тих агітаторах надворі, Санчесе, і припиніть зволікати!" Охоронці сховали зброю в кобури біля вікон Жовтої кімнати, вдаючи, що не звертають уваги на Ріверу, який несамовито віддавав накази в слухавку. Потім він набрав інший номер після того, як обірвав розмову із Санчесом.\n\n"Мені негайно потрібна пряма лінія до Білого дому без-"\n\nДюжина нових солдатів увірвалася до його кабінету й легко здолала жменьку охоронців Рівери. Один із солдатів виступив уперед і прикладом M16 ударив Ріверу в ніс, збивши його з ніг. Рівера був захоплений зненацька двома речами: нашивкою Карибського легіону на заколотниках і появою Рубена Алонсо Росалеса, який постав перед ним як командир заколотників. Надворі ворота палацу зі скрипом відчинилися, без криків і пострілів, які б позначили переломний момент. Назовні вийшли гвардійці, здані на милість заколотників, поки натовп витріщався на це видовище, що ознаменувало кінець правління консервативного істеблішменту й приглушено привітало нове керівництво.\n\nВдивляючись у повернення генерала, якого він вигнав на північ, Рівера, зціпивши зуби, ховав їх за похмурою гримасою, досі тримаючись за закривавлений ніс. "Верхівка, що змінює контроль, — це все одно як вода з гуся спини," — подумав Рівера, добровільно передаючи контроль над слухавкою Росалесу, коли підвівся. Диспетчер на іншому кінці говорив лише незрозумілою англійською, і Росалес невиховано ледь кивнув головою на тираду диспетчера."
ELS_forpol.112.a: "Розмова тривала недовго."
ELS_forpol.112.tt: "§&Націоналісти§! повалили нашого [ELS.GetFlag]§Wсальвадорського§! партнера. Удар по стабільності Центральної Америки та §mнашій§! репутації."

ELS_forpol.113.t: "Танґо турбулентності"
ELS_forpol.113.desc: "Усмішка сеньйора Вальдеса була такою ж широкою, як і його плечі, багатий коричневий костюм пасував до його кучерявого чорного волосся, а глибокий чоловічий голос — до його великої статури. Кенджі Морі склав про нього певне враження, хоча в літаку вони майже не розмовляли. Вальдес теж читав, переглядаючи заголовок газети про нещодавню перемогу хунти та щойно запроваджені реформи, які вона прагнула здійснити.\n\nПоліт із Мехіко до Сан-Сальвадору був, зрозуміло, швидким для обох чоловіків, але справа Морі там була далеко не звичайною поїздкою. Мало що з «Кавовим агентством» було звичайним, навіть якщо роль японського розвідувального спостереження в Сальвадорі мала б бути досить буденною, за винятком стеження за розвідкою Янкі в регіоні.\n\nКоли Морі та Вальдес прибули до Сан-Сальвадору, вони вийшли з літака одним трапом, вийшли через ті самі ворота, взяли таксі з того самого місця й розійшлися. Але, що дивно, хоча, можливо, й не дивно, Морі підвів очі від японсько-іспанського розмовника, який читав, і побачив, що їх висадили в тому самому місці в той самий час, і вони заселилися в той самий готель.\n\nВони піднялися тим самим ліфтом на той самий поверх, де були їхні номери. Коли цього разу вони вже по-справжньому розходилися, Вальдес повернувся до Морі й указав на нього, сказавши напрочуд вільною японською: "Не вплутуйся в неприємності, під час революції все може стати заплутаним." Морі не був особливо здивований; він розпізнав у Вальдесі мексиканського агента DFS ще в літаку, понад годину тому."
ELS_forpol.113.a: "Gracias." Морі відповів. У житті береш будь-які люб’язності, які можеш знайти."
ELS_forpol.113.tt: "§&Революціонери§! повалили [USA.GetFlag]§mВашинґтонську§! маріонетку в [ELS.GetFlag]§WСальвадорі§!. Гідний результат, навіть якщо вони не є §xнашим§! першим вибором."

ELS_forpol.114.t: "В очікуванні Вербної неділі"
ELS_forpol.114.desc: ""Огидно," — генерал Хосе Альберто Медрано зробив ще один ковток рому. "Бридко!" — раптово гаркнув він генералу Сосі, перш ніж вибухнути гучним сміхом. Сальвадорець, хитаючись, опустився вниз, регочучи й чіпляючись за край столу, щоб не впасти на підлогу. "До яких глибин має опуститися ця країна, перш ніж вона підніметься, підніметься до небес!"\n\nГенерал Хуліо Фаустіно Соса відвів погляд від неоготичних шпилів собору на північному горизонті, щоб подивитися на свого нечіткого, земного співвітчизника. "Справді," — відповів він, перш ніж знову продовжити спостереження за Санта-Аною. І все ж, якщо його колега збирався віддатися цьому, зараз був саме той момент.\n\nЇхній маневр, підтриманий Японією та Іберією, блискуче вдався — полковника Ріверу усунуто, а хунта кастристів, що його замінила, досі безпорадно борсалася перед студентськими протестами та селянським повстанням. Ходили навіть чутки, що Медрано та його самого запросять приєднатися — щоб гарантувати підтримку Національної гвардії та Повітряних сил новому уряду.\n\nМедрано знову насилу підвівся, "Боже, благослови... Японію за всю її єну." Він осушив келих, перш ніж продовжити, "Боже, благослови Іберію за Франко, справжнього Каудильйо! Спасителя Іспанії, а тепер і Сальвадору. Боже, благослови Сальвадор, бо... бо слабкість його демонів стане його спасінням!" Він почав наливати ще рому, розливаючи трохи на стіл. "Перш ніж ці комуністи збудують своє пекло," — гикнув він, "коли безлад досягне піку..."\n\n"Ми завдамо удару," — сказав Соса. Він спостерігав, як його літаки ревіли над Санта-Аною. Готові до наказу. Готові до відновлення порядку."
ELS_forpol.114.a: "1944 рік був лише за кілька місяців."
ELS_forpol.114.tt: "\nМи виставили §,іспаністів§! на чолі з [ELS.GetFlag]§WСальвадором§!, §,справжніх патріотів§!, прихильних до [IBR.GetFlag]§OІбе§!§nрії§!.\nВтім, їхня віддаленість означає, що для забезпечення §Oнашого вп§!§nливу§! знадобляться подальші перемоги."

ELS_forpol.115.t: "Очікування"
ELS_forpol.115.desc: ""Кляті комуністичні виродки!" — завив генерал Хосе Альберто Медрано, розмахуючи плоскогубцями перед своїм іберійським контактом Густаво Руїсом. "Вони викинули полковника Ріверу та тих слабких-" слина забризкала обличчя Руїса, "колінопреклонних, що смокчуть у грінґо виродків із PCN, а потім почали приборкувати ORDEN і Національну гвардію, поки селяни шаленіють у полях, а студенти — на вулицях."\n\nРуїс витер обличчя шовковою хустинкою, перш ніж відповісти, "Боюся, кастристи не комуністи. Інакше їм не вдалося б заручитися підтримкою такої кількості власників плантацій. І хоча за звичайних обставин було б нерозумно відкидати ваші інституції, ви планували використати їх у контрперевороті. Тож попри всю ганебність політики Росалеса-"\n\nЩе один помах плоскогубців, ще ближче до обличчя Руїса. "Ми. Ми планували використати їх у контрперевороті. Не думай, що зможеш викрутитися. Твій Каудильйо відступив після того, як його відкинули біля Каса-дель-Кампо? Ні! Я очікував від його слуги більшого."\n\nРуїс від цього насторожився, "Я тут як приватна особа. І я можу піти як приватна осо-"\n\n"Та ні хріна ти не приватна особа. І підеш ти теж як хрін. Це ще не кінець," — прошипів Медрано, завдавши останнього уколу плоскогубцями."
ELS_forpol.115.a: ""Поки вони не витягнуть останнього беззубого комуніста з моїх камер.""
ELS_forpol.115.tt: "\n[IBR.GetFlag]§OІбе§!§nрія§! досягла успіху, вигнавши [USA.GetFlag]§mамериканських§! інтервентів із [ELS.GetFlag]§WСальвадору§!, але ворожі §&революціонери§!, а не §,справжні патріоти§!, заповнюють вакуум."

ELS_news.1.t: "[Get_newspaper_header]Путч у Сальвадорі"
ELS_news.1.desc: "Радикали в Сальвадорі успішно здійснили власний путч проти усталеного режиму, наслідуючи приклад революційної риторики Фіделя Кастро.\n\nХоча спостерігачі в міжнародних колах панікують через можливу появу ще однієї Куби в Центральній Америці, кавові барони Сальвадору негайно вивели свої активи шляхом примусу та підкупу, змусивши створити новий уряд.\n\nХоча старий порядок було успішно повалено, для занепокоєних спостерігачів, схоже, кастристів вдалося стримати, принаймні поки що.\n"
ELS_news.1.a: "Темна кава, темні передвістя." #USA
ELS_news.1.b: "Новий, революційний порядок постає." #MEX
ELS_news.1.c: "Шкідники риють нове лігво." #IBR
ELS_news.1.d: "Націоналістичне виверження в Землі вулканів." #JAP
ELS_news.1.e: "Нехай собаки їдять собак." #Other

ELS_news.2.t: "[Get_newspaper_header]Контрпереворот Національної гвардії в Сальвадорі!"
ELS_news.2.desc: "Після успішного формування коаліції між різними революційними елементами чинну урядову хунту країни знову повалено, цього разу Національною гвардією. Запекло націоналістичні, лідери нової хунти змогли схилити сумнозвісних кавових олігархів Сальвадору на підтримку свого нового режиму, і повідомляється, що багатьох колишніх прогресивних губернаторів заарештовано.\n\nХосе Альберто Медрано шукає нових союзників у Японії та Іберії, які вже публічно схвалили «відновлення законності й порядку» в країні, що потерпає від Каудильйо. В імпровізованій промові Медрано заявив про свою відданість відновленню стабільності та захисту нації від «криптокомуністів», які прагнуть її підкорити.\n"
ELS_news.2.a: "Привиди Вербної неділі блукають Сан-Сальвадором." #USA
ELS_news.2.b: "Як і Мадеро, цього не мало статися." #MEX
ELS_news.2.c: "La Legión збирається." #IBR
ELS_news.2.d: "Єна й кава поєднали Тихий океан." #JAP
ELS_news.2.e: "Нескінченний цикл." #Other

ELS_news.3.t: "[Get_newspaper_header]Переворот у Сальвадорі зірвано"
ELS_news.3.desc: "Після кількох тижнів розслідування «антитерористичної» діяльності у співпраці з іноземними розвідувальними агентствами уряд Сальвадору розкрив змову в певних підрозділах Збройних сил із метою повалення чинного режиму. Підозрюваних у співпраці з угрупованням радикальних націоналістів, включно з кастристськими групами, можливих винуватців усунуто з посад, і вони очікують суду за державну зраду.\n\nНавіть попри те, що державі Сальвадор вдалося уникнути повалення, політичний шок, що настав за цим, усе ж відлякав інвесторів і послабив внутрішнє споживання; ймовірно, знадобиться час, перш ніж пошкоджена національна цілісність держави зможе повністю відновитися.\n"
ELS_news.3.a: "Національна безпека передує Національному примиренню." #USA
ELS_news.3.b: "Справжні зрадники — ті, хто продав Сальвадор Янкі." #MEX
ELS_news.3.c: "Hoy somos y mañana no." #IBR
ELS_news.3.d: "Кабальґадори їдуть у захід сонця — не до Сонця, що сходить." #JAP
ELS_news.3.e: "Що б не сталося, зрадники отримали те, на що заслужили." #Other

ELS_news.4.t: "[Get_newspaper_header]Комуністи захопили Сальвадор, президент зник"
ELS_news.4.desc: "Сільські комуністичні ополчення під проводом Каєтано Карпіо проголосили створення нової амазоністської держави, коли його сили захоплюють міста по всьому Сальвадору. Загрузлий у нестабільності після поразки у Футбольній війні, уряд загруз у жорстокій боротьбі з повстанцями, переживаючи кризу легітимності, коли різке погіршення умов життя сільської бідноти та масове повернення сальвадорців, депортованих Гондурасом, вибухнули соціальним та економічним хаосом. Жорсткі репресії провалилися, коли підтримка обвалилася.\n\nБуло оприлюднено кадри судів і страт урядовців та економічних лідерів разом із оголошеннями про масштабні націоналізації. Проводяться національні чистки, а повідомлення про насильство натовпу надходять майже з кожного великого міста. Президент досі зниклий безвісти, а Сан-Сальвадор заперечує припущення, що йому вдалося втекти."
ELS_news.4.a: "Жорстокі, ворожі комуністи в нашому задньому дворі..." #USA
ELS_news.4.b: "Майбутнє, що чекає на нас, якщо переможуть такі, як Кабаñas." #MEX
ELS_news.4.c: "Жахи, яких уникнула Іспанія, спускаються на її нащадка." #IBR
ELS_news.4.d: "Вимиємо руки від цієї далекої катастрофи." #JAP
ELS_news.4.e: "Смак крові та кави." #Other

ELS_news.5.t: "[Get_newspaper_header]Сальвадорські Ґайтаністи виганяють PCN"
ELS_news.5.desc: "Фабіо Кастільйо Фіґероа проголошено президентом Сальвадору на тлі народного повстання. Давня правляча партія Сальвадору, PCN, загрузла в недавній нестабільності: страйки, суспільне невдоволення та протести ставали дедалі серйознішими, попри спроби репресій. Нестабільність зрештою спричинила крах, коли уряд масово подав у відставку, а громадський безлад досяг критичної точки.\n\nПрезидент Фіґероа, ректор Університету Сальвадору, був пов’язаний з успішним переворотом 1960 року та спробою кастристського перевороту 1963 року. Обличчя коаліції студентів, міських робітників, військових радикалів і сільських ополчень, він засудив PCN як «гнобителів, яких утримують американські гроші та сальвадорська кров». Він також подякував Мексиці за підтримку революції, натякнувши на тісніші зв’язки між Сальвадором і Пактом Веракруса."
ELS_news.5.a: "Ми будували замки на піщаних фундаментах..." #USA
ELS_news.5.b: "Студенти з належним революційним духом! Приклад для всіх нас." #MEX
ELS_news.5.c: "Тривале правління військових над Сальвадором безславно добігає кінця." #Other

ELS_news.6.t: "[Get_newspaper_header]Амазоністів повалено в Сальвадорі"
ELS_news.6.desc: "Комуністичне захоплення Сальвадору завершилося так само жорстоко, як і почалося, коли військові залишки та найманці взяли під контроль столицю, а амазоністський контроль по всій країні розпадається. Схоже, що нова влада Сальвадору сформована як з антикомуністичних добровольців, так і з найманців, фінансованих вигнаними олігархами Сальвадору. Місцезнаходження Каєтано Карпіо невідоме, а помста захопленим амазоністам була швидкою, жорстокою та публічною.\n\nПрофесора права Університету Антоніо Родріґеса Порта проголошено президентом новою урядовою радою з мандатом нагляду за масштабною програмою реприватизації — проголошенням, яке Сполучені Штати швидко прийняли. Припущення щодо американської підтримки захоплення влади не зникають, але за їхньої підтримки та за підтримки олігархів Сальвадору амбіціям Порта щодо створення утопії вільного ринку не бракуватиме ресурсів.\n"
ELS_news.6.a: "Адвокат, рушниці та гроші — вічні ключі до успіху в Центральній Америці." #USA
ELS_news.6.b: "Тріумф робітників, такий же короткий, як і прекрасний." #Communist
ELS_news.6.c: "Один експеримент завершується так само швидко, як почався. Починається новий." #Other

ELS_news.7.t: "[Get_newspaper_header]Конституційне правління утверджено в Сальвадорі"
ELS_news.7.desc: "Полковника Хуліо Адальберто Ріверу затверджено президентом Сальвадору після його безальтернативного висунення Партією національного примирення. Харизматичний оратор, він уже виступив із загальнонаціональною трансляцією, оголосивши про повернення до стабільності після потрясінь останніх двох років і засудивши радикалів, які прагнуть використати труднощі нації для власних цілей.\n\nВідповідно до своєї риторики, він уже пообіцяв соціальні та економічні реформи, проголосивши добробут сільського населення головною метою свого президентства. Він також наголосив на важливості продовження тісної співпраці бізнесу й уряду, а також близьких відносин із Вашинґтоном для підтримки своїх планів розвитку. Як засновник PCN, його вступ на посаду надає уряду вкрай необхідної легітимності та зміцнює конституційне, хоча й не демократичне, правління.\n"
ELS_news.7.a: "Багатообіцяюча нова сторінка в історії їхньої нації." #USA
ELS_news.7.b: "Імена змінюються, кайдани залишаються." #MEX
ELS_news.7.c: "Сальвадор не зможе реалізувати свій потенціал, доки не відвикне від Вашинґтона." #IBR
ELS_news.7.d: "Як пухлину, американських маріонеток важко видалити." #JAP
ELS_news.7.e: "То коли ж наступний переворот?" #Other

ELS_news.8.t: "[Get_newspaper_header]Сальвадорська PCN перемагає на виборах 1967 року"
ELS_news.8.desc: "Президент Сальвадору Хуліо Адальберто Рівера забезпечив собі спадщину, як завершивши повний виборчий термін у сумнозвісній схильній до переворотів країні Центральної Америки, так і забезпечивши перемогу обраного ним наступника, міністра внутрішніх справ Санчеса Ернандеса. Переможна Партія національного примирення (PCN), альянс кавових баронів і військових, міцно тримає в руках усі важелі влади, включно з президентством.\n\nНовий президент Ернандес оголосив про продовження дрібномасштабної земельної реформи Рівери, водночас розширюючи інвестиції в освіту. Ернандес також пообіцяв придушити та ліквідувати будь-які джерела радикалізму всередині Сальвадору, пообіцявши усунення всіх, кого буде визнано загрозою національній стабільності Сальвадору.\n"
ELS_news.8.a: "Безперервна демократія та стабільність держави — що тут не любити!." #USA
ELS_news.8.b: "Якби він не був американським лакеєм, він був би нашим хлопцем." #MEX
ELS_news.8.c: "Сальвадор не збивається з курсу." #Other

ELS_news.9.t: "[Get_newspaper_header]Сальвадорська PCN мілітаризується"
ELS_news.9.desc: "Відкинувши обмежені спроби реформ президента Сальвадору Хуліо Адальберто Рівери, більш консервативні та мілітаристські крила його Партії національного примирення ініціювали самопереворот у партії, висунувши генерала Фіделя Торреса наступником Рівери на посаді президента замість обраного Ріверою міністра внутрішніх справ Санчеса Ернандеса. Генералу Торресу, однак, бракує популістської чарівності президента Рівери, і тепер він править партією, яка стала дедалі дисциплінованішою та авторитарнішою.\n\nГенерал Торрес, посилаючись на нещодавню напруженість із сусіднім Гондурасом і дедалі жорстокіші прикордонні суперечки, заявив, що Сальвадору необхідно продовжувати посилювати мілітаризацію. Торрес назвав сальвадорську міграцію до Гондурасу питанням безпеки та працюватиме над забезпеченням національного майбутнього своєї країни.\n"
ELS_news.9.a: "Не ідеально, але принаймні стабільно." #USA
ELS_news.9.b: "Вашинґтон знімає маску." #MEX
ELS_news.9.c: "Жодного бачення, лише насильство." #Other

ELS_news.10.t: "[Get_newspaper_header]PCN продовжує політичне панування в Сальвадорі"
ELS_news.10.desc: "Герой Футбольної війни Артуро Армандо Моліна здобув чергову перемогу для Партії національного примирення над її християнсько-демократичною опозицією на чолі з Хосе Наполеоном Дуарте, популярним мером Сан-Сальвадору. Хоча Армандо поспішив оголосити про перемогу, спостерігачі вже поставили під сумнів достовірність тріумфу PCN, на тлі дедалі численніших звинувачень у фальсифікаціях, залякуванні та відвертому насильстві на виборчих дільницях.\n\nЦі звинувачення є наступними в довгій низці доказів згасання підтримки партії та останніми в переліку численних звинувачень у корупції. Альянс військових офіцерів і кавових плантаторів, що стоїть за PCN, давно придушує будь-які змістовні спроби реформ, зосереджуючись, за його словами, на підтриманні стабільності уряду. Енергійний Моліна, однак, схоже, не зважає на цю ситуацію й назвав реформу освіти головним завданням свого уряду — і, можливо, його останнім шансом уникнути повного застою.\n"
ELS_news.10.a: "Приблизно цього й варто очікувати від Сальвадору." #USA
ELS_news.10.b: "Сальвадор вступає у свій пізній порфіріанський період." #MEX
ELS_news.10.c: "Система, що вичерпує свої сили." #Other

ELS_news.11.t: "[Get_newspaper_header]Християнські демократи перемагають у Сальвадорі"
ELS_news.11.desc: "У приголомшливій несподіванці вибори в Сальвадорі завершилися перемогою християнських демократів на чолі з Наполеоном Дуарте, популярним мером Сан-Сальвадору. Після довгих років панування Партії національного примирення та військових лідерів і кавових інтересів, які вона представляла, Дуарте зумів перетворити свої сердечні відносини з фракціями по всьому політичному спектру на сейсмічний зсув у політиці країни.\n\nЦя широка коаліція своєю вагою змогла поховати навіть випробувану часом машину фальсифікацій PCN, скориставшись поступовим зміцненням сальвадорських інституцій під американським патронажем. Тепер Дуарте мусить перетворити громіздкий політичний альянс, який привів його до влади, на силу змін — складне завдання саме по собі.\n"
ELS_news.11.a: "Бачите? Зрештою ми принесли демократію в Латинську Америку!" #USA
ELS_news.11.b: "Як це могло статися під наглядом американців?" #MEX
ELS_news.11.c: "Справжня демократія в Сальвадорі?" #Other

ELS_news.12.t: "[Get_newspaper_header]Фашисти захоплюють Сан-Сальвадор"
ELS_news.12.desc: "Після шквалу хаосу в ефірі тепер стало ясно, що націоналістичні офіцери на чолі з генералом Повітряних сил Хуліо Фаустіно Сосою повалили чинний уряд Сальвадору. Одразу за цим послідувала, схоже, добре скоординована низка заяв інших ультраправих режимів регіону, що свідчить про те, що цей путч був спланований заздалегідь за допомогою їхніх розвідувальних служб.\n\nХоча Фаустіно Соса оголосив про амбітну корпоратистську програму, яка відкрито закликає до \"підпорядкування кавової олігархії вимогам сальвадорського народу\", у своїй першій промові він висловився більш гнучко, сигналізуючи про подальшу відкритість до американських інвестицій, імовірно, щоб уникнути прямого вторгнення ОВН, але водночас відкрито домагаючись японської допомоги."
ELS_news.12.a: "Принаймні він не надто недружній..." #USA
ELS_news.12.b: "Ісоте розквітає пізно, але прекрасно." #JAP
ELS_news.12.c: "З цим доведеться розібратися, і швидко." #MEX
ELS_news.12.d: "Тінь генерала Мартінеса живе далі." #Other

ELS_news.13.t: "[Get_newspaper_header]Сальвадорська революція підносить цивільного"
ELS_news.13.desc: "Роки після Сальвадорської революції перетворили PAR із різношерстої групи незадоволених військових офіцерів на широку «революційну» партію, змодельовану за мексиканською PRI. Ця поступова консолідація, що включала кооптацію значної частини старої кавової олігархії до нової системи, тепер дозволила відомому економісту Рікардо Фальї Касересу здобути президентство.\n\nПерший цивільний лідер Сальвадору після довгої низки військових офіцерів, Касерес був обраний не завдяки своїй популярності серед населення, а завдяки кропіткій роботі із забезпечення стрімкого економічного зростання під час президентства Росалеса. Його досягнення дозволили йому згуртувати партію навколо себе та сформувати технократичний кабінет. У своїй інавгураційній промові Касерес пообіцяв ще більший розвиток, а також нову конституцію, щоб закріпити здобутки Революції на десятиліття вперед."
ELS_news.13.a: "Можливо, Сальвадор таки може стати надійною інвестицією." #USA
ELS_news.13.b: "Ще одна сестра ступає на шлях революції." #MEX
ELS_news.13.c: "Чи виявиться перо сильнішим за меч?" #Other