#Leader
ELS_Rodolfo_Cordon_Cea: "Родольфо Кордон Сеа"
POLITICS_ELS_Rodolfo_Cordon_Cea_DESC: "Що можна сказати про чоловіка, який прийшов до влади в Сальвадорі після перевороту 1961 року?\n\nНа жаль, небагато.\n\nБільше запам’ятавшись своїм місцем на чолі Установчих зборів, які створили нову сальвадорську Конституцію, ніж своїм наступним коротким роком на посаді тимчасового президента республіки, доктор Еусебіо Родольфо Кордон Сеа трагічно залишається пішаком у грі, значно більшій за нього.\n\nТихий, безконфліктний представник консервативного істеблішменту, він не має ані амбіцій бути чимось більшим за компромісне посередництво між гравцями політичного театру Салону Асуль, ані харизми, щоб становити загрозу будь-кому з них.\n\nПерехідний етап між десятиліттями авторитарного правління та очікуваною надією відродити демократичні мрії 1948 року.\n\nПровісник змін, які його погіршення здоров’я може не дозволити йому навіть побачити, залишаючи його безсилим зробити щось, окрім як докласти всіх зусиль, щоб вони принаймні відбулися.\n\nА годинник повільно спливає."
ELS_Julio_Adalberto_Rivera: "Хуліо Адальберто Рівера"
POLITICS_ELS_Julio_Adalberto_Rivera_DESC: "Уперше за понад тридцять років влада в Сальвадорі перебуває в руках демократично обраного лідера.\n\nАле підполковнику Хуліо Адальберто Рівері Карбальйо ще належить переконати студентів-протестувальників і сільських жителів, що він їхній президент. Адже Рівера був єдиною людиною в бюлетені.\n\nРозважливий військовий, який однаково зневажає і фашистів, і марксистську опозицію, засновник Партії національного примирення стверджує, що найкращий захист від обох цих зол — боротися з бідністю та несправедливістю в їхньому корені, наслідуючи американську модель.\n\nБажаючи втілити нову єдність між сальвадорськими військовими та укоріненою в країні «кавовою олігархією», Рівера очолює коаліцію консерваторів і поміркованих дирижистів, яка, за його словами, має на меті відновити стабільність і нарешті зайнятися шрамами республіки, що залишаються вже десятиліття.\n\nАле його авантюрні плани реформ незабаром можуть зіткнутися з проблемою роздратування самої еліти, на якій тримається його підтримка, водночас виявившись далеко недостатніми, щоб вгамувати зростаючий гнів зраджених мас, які вже починають називати його черговим у вічній каруселі автократів Сальвадору."
ELS_Collective_Leadership: "Колективне керівництво"
POLITICS_ELS_Collective_Leadership_DESC: "Попелясті нотатки Партії національного примирення догорали в каміні Національного палацу. Пальто й мотоцикл полковника Хуліо Адальберто Рівери залишаються недоторканими в Каса Президенсіаль.\n\nНіхто й усі водночас посіли їхні місця. Кастристи й праворадикальні військові, перебіжчики з числа кавових олігархів та промисловців, соціялістичні академіки й студентські лідери гарячково намагаються посісти місце за дедалі хиткішим столом. Чоловіки, що заповнюють Блакитну кімнату, — сальвадорські патріоти, які всі засуджують рабську покірність колишньої адміністрації Вашинґтону. Але це їхня єдина спільна риса, тоді як какофонія всередині палацу стає такою ж гучною, як вуличні протести надворі.\n\nКолишній президент Осоріо та майор Рубен Алонсо Росалес, можливо, натхненні своїм мексиканським вигнанням, прагнуть інституціоналізувати цю хаотичну революцію в межах єдиної партії — Партії оновленої дії. Але в міру того, як PAR зростає рукостискання за рукостисканням, реакційні офіцери збираються у просторих вестибюлях консервативних плантаторів, вимагаючи жорсткішої лінії. Генерал Медрано висуває Національну гвардію вперед, аж надто готовий виконати їхню волю.\n\nТак чи інакше, зміни приходять до Сальвадору. І дуже скоро."
ELS_Ruben_Alonso_Rosales: "Рубен Алонсо Росалес"
POLITICS_ELS_Ruben_Alonso_Rosales_DESC: "Народжений у скромному селі на півдні Ла-Паса, третій із семи дітей, Рубен завдяки наполяганню матері на здобутті належної освіти уникнув довічної виснажливої праці на сімейній фермі. Проте ранній інтерес до військової справи привів юного Рубена Алонсо Росалеса до військової академії, куди він вступив лише у 15 років. Там його шлях зрештою переплівся з майбутнім президентом Оскаром Осоріо Ернандесом — людиною, яка стала, мабуть, найвпливовішою постаттю в його житті та чиєму приходу до влади він допоміг, використавши свій елітний артилерійський полк для повалення Хосе Марії Лемуса.\n\nПішовши за своїм наставником у вигнання до Мексики після контрперевороту 1961 року, здійсненого Маки, плани Рубена Алонсо Росалеса почати нове життя зі своєю родиною у Сполучених Штатах були зірвані, коли іскра, запалена в Пуерто-Платі, змусила його знову перетнутися зі своїм наставником, щоб скористатися тим, що обоє вважали шансом, який випадає раз у житті.\n\nТепер, успішно усунувши кліку офіцерів, яка стояла на чолі Сальвадору, Росалес виявляється підштовхнутим прийняти спадщину свого старіючого вчителя. Можливо, йому бракує магнетизму останнього, але він компенсує це достатньою дисципліною та амбіціями, щоб потенційно увійти в історію як один із найвидатніших сальвадорських президентів недавнього часу.\n\nЙому лише потрібно правильно розіграти свої карти."
ELS_Ricardo_Falla_Caceres: "Рікардо Фалья Касерес"
POLITICS_ELS_Ricardo_Falla_Caceres_DESC: "Доктор Рікардо Фалья Касерес — перший за десятиліття президент Сальвадору, який ніколи не тримав у руках гвинтівки. Його зброя — натомість відполірований чорний портфель, наповнений папками з документами.\n\nСкільки часу він був поруч із Касересом? Чи був він наповнений нотатками з його юридичних студій, які провели його через Університет Сальвадору до докторського ступеня? Чи носив його із собою здібний молодий чоловік, коли реорганізовував сальвадорський кавовий сектор, створюючи величезне зростання продуктивності та експортно орієнтоване зростання Золотої епохи? Чи лежав він під столом, коли академік з юним обличчям та економічний експерт збирався з іншими членами хунти 1961 року? Чи ніс доктор Касерес його із собою у вигнання до Мексики, коли суворі чоловіки зі зброєю усунули ту хунту, щоб поставити свою?\n\nПортфель майже не залишав рук Касереса відтоді, як мексиканська DFS переправила його назад на батьківщину в 1963 році. З нього він діставав політичні документи, які переконали окремих кавових олігархів підтримати кастристський переворот. Він використовував його, щоб долучити університетських лідерів і професіоналів до офіцерської основи PAR. У ньому лежали проєкти реформ, які прискорили б індустріалізацію та механізацію Сальвадору за президентства Росалеса, зробивши його зіркою партії. Нотатки для виступів, які він містив, були сухими, але достатніми, щоб піднести технократа до Жовтої кімнати. А тепер, міцно затиснутий у руках, він містить найбільший скарб з усіх — ескізи Конституції, яка гарантуватиме, що Сальвадором назавжди правитимуть люди з портфелями, а не зі зброєю."
ELS_Jose_Alberto_Medrano: "Хосе Альберто Медрано"
POLITICS_ELS_Jose_Alberto_Medrano_DESC: "Для багатьох сальвадорців 1948 рік досі постає як рік, що подарував коротке народження мрії про краще майбутнє. Значно менше людей зберігають у серці те, на попелі чого вона народилася.\n\nНепередбачуваний. Імпульсивний. Мінливий. Алкоголік. Народжений у 1917 році, багата військова кар’єра генерала Хосе Альберто Медрано така ж хаотична, як і характер самого чоловіка.\n\nЙого найпершим визначним досягненням, мабуть, була роль у Вербній неділі 1944 року — перевороті проти адміністрації Максиміліано Мартінеса. Проте його сумнозвісність по-справжньому проявилася лише під час перебування на чолі ORDEN, сальвадорської парамілітарної розвідувальної мережі, яка дозволяла йому потурати своїм жорстоким примхам під час брутального придушення опозиції режиму Рівери.\n\nМаневруючи між прихильністю до Японії та Іберії, «Ель Челе» не соромиться своїх фашистських схильностей і не цурається сипати образами на політиків чи колег-офіцерів, які викликають його гнів. Тепер, прагнучи відродити дух епохи Маррокіна разом з іншими діячами Вербної неділі, такими як генерал Хуліо Фаустіно Соса, завзяття Медрано в забезпеченні того, щоб він більше ніколи не помер, мабуть, єдина постійна риса в його свідомості.\n\nІ тим доречніше, якщо цього разу він теж постане з попелу іншого."
ELS_Fidel_Sanchez_Hernandez: "Фідель Санчес Ернандес"
POLITICS_ELS_Fidel_Sanchez_Hernandez_DESC: "Генерал Фідель Санчес Ернандес ледь усміхається, надягаючи президентську стрічку поверх своєї бездоганної форми. Він випромінює легке тепло, розмовляючи з цивільними членами свого кабінету про свої плани щодо інвестицій в освіту та обмеженої земельної реформи. А потім, розвернувши відполірований чобіт, він забезпечує ту холодну дисципліну, якої потребують солдати, що його оточують. Спокійно генерал Санчес Ернандес переглядає плани арештів дисидентів та охорони кордону з Гондурасом.\n\nІз юності в сільській східній частині Сальвадору Фідель Санчес Ернандес зберігав цей баланс привітності та твердості. Ця тактовність справила враження на професорів і товаришів-курсантів у військовій академії, і він закінчив її з їхньою пошаною та схваленням. Він поступово, шанобливо піднімався військовими щаблями, доки не отримав престижне призначення військовим аташе Сальвадору у Вашинґтоні. Тому не дивно, що президент Рівера призначив його міністром внутрішніх справ.\n\nТам генерал відіграв ключову роль у придушенні широких селянських заворушень та розгромі змовників військового перевороту. Повага, яку він здобув завдяки цьому в Партії національного примирення та у Вашинґтоні, зробила його природним наступником. Населення виявилося менш прихильним — на президентських виборах він отримав лише відносну більшість голосів. Тож він знову прагне знайти цей баланс — між реформою і порядком, між олігархом і селянином, між бюлетенем і казармою. Це єдиний шлях, який знає генерал Санчес Ернандес."
ELS_Fidel_Torres: "Фідель Торрес"
POLITICS_ELS_Fidel_Torres_DESC: "Колись нове десятиліття лунало надією на здійснення давніх мрій про демократію для Сальвадору.\n\nАле якщо тріщини у пишномовних обіцянках Рівери давно стали очевидними навіть для найнеуважніших спостерігачів, його наступник нарешті відкинув убік зруйновану конструкцію. Рівера відбив кастристів і студентів, але перед військовими та кавовими баронами реформи Рівери зів’яли.\n\nРідкісні залишки вільної преси, що висміюють генерала Фіделя Торреса, прирівнюють його владу до тієї, що нагадує часи Мартінеса, хоча, можливо, з дещо більшою хитрістю. Далеко не обтяжуючи себе думками про реформи свого попередника, він, схоже, має лише одну мету — забезпечити готовність країни до неминучого конфлікту з Гондурасом. Фермери постійно розширюють свої господарства через проникний, давно спірний кордон. Війна прийде, і генерал Торрес мусить перемогти. Якою б не була ціна.\n\nТоррес — не генерал Медрано, він не буде лютувати й кричати в Жовтій кімнаті Національного палацу. Але кожен спокійно відданий наказ змушує замислитися: чи заспокоює думка, що чоловік, готовий відправити покоління сальвадорців на смерть, такий організований і стриманий? Чи це, навпаки, найбільше тривожить?"

ELS_Julio_Faustino_Sosa: "Хуліо Фаустіно Соса"
POLITICS_ELS_Julio_Faustino_Sosa_DESC: "Відігравши ключову роль у перевороті Вербної неділі 1944 року, Хуліо Фаустіно Соса все ж залишався доволі непомітною фігурою в недовговічній адміністрації Маррокіна, уникнувши найгірших репресій, що настали після її падіння, і навіть отримавши підвищення до генерала в 1950-х. За фахом пілот, він тихо піднявся до провідної постаті у ВПС Сальвадору та одного з неформальних керівників військового прорайхівського блоку, ховаючись у тіні Хосе Альберто Медрано, доки безладне управління останнього та жорстокі репресії не перейшли межу, змусивши його задумати усунення свого колишнього союзника.\n\nВважаючись значно стабільнішим за свого попередника, розважливий офіцер різко контрастує з ним своєю вдумливістю та ввічливою красномовністю. І хоча він не менш однозначний у своїх симпатіях до Пакту, його захоплення влади в хунті супроводжується несподіваною прихильністю до американських інвестицій. Спокій приносить власні винагороди та знаходить чимало прихильних партнерів.\n\nТа якщо його манери безперечно м’якші за манери його суперника, за ними ховається та сама залізна рука, адже він прагне інституціоналізувати фашизм у кожному прошарку сальвадорського суспільства.\n\nАле, можливо, цього разу вона також буде вкрита оксамитовою рукавичкою."
ELS_Arturo_Armando_Molina: "Артуро Армандо Моліна"
POLITICS_ELS_Arturo_Armando_Molina_DESC: "Ще один у довгій низці військових, які здобули президентське визнання, полковник Артуро Армандо Моліна користується повагою за свою гідну службу під час останнього конфлікту з Гондурасом, який ознаменував його несподіване піднесення від доволі невідомої постаті серед генерального штабу Сальвадору до нинішнього звання.\n\nТепер, коли країна заліковує рани після руйнівної війни, хиткий мандат «Ель Мостачона» ґрунтується на відродженні популістських обіцянок початку 60-х, несучи запал, майже схожий на ранні часи Рівери, — із ризиком знову зіткнутися з тими самими перешкодами.\n\nПідсилюючи мізерну підтримку сільського населення країни сміливими новими планами земельної реформи та регулярними візитами до місцевих сільськогосподарських працівників, Моліна ще не зміг перевершити пляму дедалі меншої легітимності своєї партії своїми дедалі грандіознішими обіцянками, навіть коли вони доходять до обіцянки будувати нову школу щодня.\n\nНове обличчя з тієї самої форми, що й його попередники, він залишається предметом питання: чи вдихне його президентство нарешті життя в понівечену республіку, чи історія приречена повторитися.\n\nІ залишається лише гадати, чи вдруге це виявиться фарсом... чи трагедією."
ELS_Jose_Napoleon_Duarte: "Хосе Наполеон Дуарте"
POLITICS_ELS_Jose_Napoleon_Duarte_DESC: "Народжений у 1925 році, Хосе Наполеон Дуарте розпочав політичну кар’єру як один із незліченних студентських активістів, які в 1940-х висловлювали свою опозицію режиму Максиміліано Ернандеса Мартінеса. Втікши до Сполучених Штатів, щоб здобути інженерну освіту подалі від фашистської діархії Маррокіна та Кальво, він повернувся саме вчасно, щоб побачити, як мрія про вільний, демократичний Сальвадор майже набуває форми під час їхнього падіння, лише щоб згаснути в хаосі наступних десятиліть. Але те, що він побачив тоді, ніколи його не полишило.\n\nПриєднавшись до Християнсько-демократичної партії невдовзі після її заснування під час хаосу, що настав після перевороту Осоріо, Дуарте незабаром був обраний генеральним секретарем партії. Але справжнє визнання він здобув завдяки неодноразовому перебуванню на посаді мера Сан-Сальвадора, за якого столиця досягла значного розвитку в освіті та інфраструктурі. Розташований у самому серці країни, він став її провідною публічною опозиційною постаттю, навіть коли більшість консервативного крила його власної партії втекла, щоб створити PCN. Роки зробили його відомим завдяки харизмі, холоднокровності та відданості захисту прав людини — усе це стало основою для його шансу на президентство.\n\nТепер, вирвавши країну з десятилітнього лещата PCN, Хосе Наполеон Дуарте все ще має одну думку, що не дає йому спокою. Як він ніколи більше не дозволить демократії зникнути."
ELS_Antonio_Rodriguez_Porth: "Антоніо Родріґес Порт"
POLITICS_ELS_Antonio_Rodriguez_Porth_DESC: "Народжений спадкоємцем родини середнього класу, що володіла невеликою аптекою в Сан-Сальвадорі, Хосе Антоніо Родріґес Порт завдяки успішній юридичній кар’єрі став деканом юридичного факультету Університету Сальвадору.\n\nЗатятий консерватор, «Дон Тоньо» залишається дивною постаттю в сальвадорській політиці, вирізняючись не лише світлим волоссям, що видає його німецьке походження, а й гучною підтримкою суворого економічного лібертаріанства, особливо своєю відкритою прихильністю до праць американського економіста Мілтона Фрідмана.\n\nХоча більшість його опонентів засуджує його як не більше ніж безсердечного технократа, йому все ж вдалося здобути достатній вплив у правих академічних колах та діловому секторі, щоб зберігати значущість. Не приховуючи своєї зневаги до комунізму чи всього, що він вважає спорідненим із ним, він здобув репутацію завдяки різкій критиці нещодавніх програм земельної реформи, порівнюючи їх із провалами режиму Бухаріна. Але по-справжньому його політична кар’єра розпочалася лише після створення ним Сальвадорської народної партії в 1966 році.\n\nТепер, опинившись на чолі нації завдяки внутрішнім антикомуністам і найманцям Вашинґтона, Дон Тоньо вільний сформувати цей сміливий новий експеримент відповідно до своїх корпоратократичних мрій: найбільш індустріалізована нація Центральної Америки, що рухається до статусу власного Ґуандуну ОВН."

ELS_Salvador_Cayetano_Carpio: "Сальвадор Каєтано Карпіо"
POLITICS_ELS_Salvador_Cayetano_Carpio_DESC: "Народжений у 1919 році сином скромного шевця, ранній вихід зі школи привів Сальвадора Каєтано Карпіо до черги різноманітних низькооплачуваних робіт, яку він ледь не завершив, ставши пекарем, якби ще в підлітковому віці не був палко втягнутий у профспілкову діяльність. Ставши свідком із першого ряду жорстокого придушення робітничих рухів, що настало після приходу до влади Оскара Осоріо, неодноразові ув’язнення завершилися вимушеним вигнанням до Мексики у 1950-х. Уже відомий як талановитий організатор, лише через рік після повернення загартований революціонер був призначений генеральним секретарем Partido Comunista, використовуючи свою нову посаду, щоб перетворити колишніх товаришів на добре навчених партизанів за зразком Жуана Амазонаса, невдовзі здобувши репутацію завдяки періодичним сутичкам із реакціонерами при владі.\n\nПопри сувору, майже владну ауру, чоловік із прізвиськом «Команданте Марсіаль» зберігає дивовижну м’якість до свого найближчого оточення та відкидає будь-який персоналізм, що мучить деяких запальних діячів руху. Добре обізнаний із марксистською теорією після років вигнання, він зберігає ідеологічну відданість, пом’якшену прагматизмом, який дозволяє йому зближуватися з прихильними зовнішніми силами, особливо після того, як його безжальне поводження з колишньою сальвадорською олігархією призвело до майже повної міжнародної ізоляції.\n\nЧи, можливо, це відчай?"
ELS_Fabio_Castillo_Figueroa: "Фабіо Кастільйо Фіґероа"
POLITICS_ELS_Fabio_Castillo_Figueroa_DESC: "Короткочасний член недовговічної лівої хунти, яку зрештою скинув Переворот Маки 1961 року, Фабіо Кастільйо Фіґероа все ж має значний авторитет у сальвадорській політиці завдяки своєму дідові, двічі президенту — у 1885 та 1907 роках.\n\nТак і не зумівши зробити свою маленьку Партію оновленої дії впливовою, Фіґероа, можливо, врятувало від забуття призначення ректором Університету Сальвадору. Рішучий прихильник Кубинської революції та Колумбійського революційного союзу, Фіґероа відтоді здобув репутацію бойового ідеаліста, прагматичного політичного гравця та затятого захисника прав людини.\n\nЩедро використовуючи свої нові зв’язки, щоб налагоджувати відносини з однодумцями на кшталт Артуро Ромеро, Рубена Алонсо Росалеса і навіть колишнього президента Осоріо, схоже, майже десятиліття закулісних маневрів нарешті принесло свої плоди, дозволивши йому скористатися імпульсом нафтової кризи, щоб за мексиканської допомоги повалити десятилітнє правління PCN. Тепер він опинився на чолі строкатого зібрання студентських і прогресивних ополчень, що тримається разом лише надією нарешті зламати вісь майже неперерваного колеса автократичного правління в Сальвадорі.\n\nМожливо, цього разу — навіть назавжди."

ELS_Feliciano_Avelar: "Фелісіано Авелар"

