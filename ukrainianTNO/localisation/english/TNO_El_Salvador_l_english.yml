ELS_forpol.37.t: ""ЖАХ У САЛЬВАДОРІ""
ELS_forpol.37.desc: ""Сьогодні вранці надійшла звістка про переворот у центральноамериканській державі Сальвадор, здійснений радикальними соціялістичними повстанцями. Держава, яка десятиліттями потерпала від потрясінь — від імперіалістів у регіоні, таких як Сполучені Штати, до власних олігархів, що наживалися на корупції, — минулої ночі організовані загони ополчення, пов’язані з 'Partido Revolucionario de Abril y Mayo (PRAM)', за допомогою співучасників увійшли до урядових комплексів та військових казарм і розпочали раптове, жорстоке обезголовлення держави."\n\n"Народні заворушення панували в перші години, а вже за кілька годин було проголошено новий уряд, чия перша публічна заява проголосила націоналізацію всіх підприємств, що належали іноземцям, у стані надзвичайної ситуації. Повідомляється про спонтанні акти насильства проти іноземців та їхнього майна, причому влада майже не перешкоджає цьому насильству, за винятком найбільших промислових активів. Наразі невідомо, що сталося з багатьма японськими громадянами."\n\n"Міністерство закордонних справ засудило насильство революції та захоплення японських підприємств як 'реакцію на імперіалізм через соціальну тиранію, а не антиколоніальну співпрацю'. Громадянам наказано уникати поїздок до країни, оскільки нова держава, яку вже тепло зустріли інші країни регіону, такі як Куба, схоже, позиціонувала себе як ворожу до Японії. Міністерство також зажадало гарантій безпеки японських громадян, однак жодної відповіді, що пролила б світло на ситуацію, ще не надійшло."\n\nРюїчі перервав читання, відкинувшись на сидінні метро, поки навколо нього лунали звуки маневрового руху. Сьогоднішня газета читалася гірко, з кожним словом осідаючи пластівцями гніву. Він згадав свою службу у воєнні роки — здавалося, це було так давно — коли він та інші представники молоді Імперії брали участь у великому антиімперіалістичному поході й виганяли британців із Малайї. Якщо це було бажанням Сальвадору — вигнати імперіалістів, — то навіщо віддавати свою душу варварам у джунглях?"
ELS_forpol.37.a: "Якщо вони хотіли антиімперіалізму, навіщо ж вони вигнали Імперію?"

ELS_forpol.38.t: "Роздуми"
ELS_forpol.38.desc: "В офісі на стіні була намальована карта Центральної Америки, що простягалася через кімнату на багато метрів. Держави були чітко позначені, чорні лінії ясно й однозначно окреслювали національні кордони, а самі країни були пофарбовані у відповідний до їхньої приналежності колір. Коли Ґуставо Руїс уперше прийшов до цього офісу, значна його частина була пофарбована в синій колір — як через хибні припущення, так і через силу американців у регіоні. Як багато може змінитися за десятиліття. Він стояв перед картою, проводячи пальцями вздовж держав.\n\nСальвадор не виходив у нього з голови, пофарбований кілька років тому в темно-коричневий після того, як Медрано врятував країну від соціялістів, яких американці виявилися надто некомпетентними, щоб зупинити. Він вистояв перед внутрішньою підривною діяльністю та вторгненням Гондурасу, маяком іспанізму в регіоні. Руїс зробив кар’єру, підтримуючи його, забезпечуючи спрямування всіх можливих ресурсів на створення вільної сальвадорської держави.\n\nАле була проблема — ресурси. Його очі знову повернулися до звіту в руці. Розвідувальні звіти про ресурси, які вливалися в країну їхнім ситуативним партнером, японцями. Роками тому здавалося таким розумним використовувати їх для зміцнення іберійського впливу. Він отримав за це нагороди, а Франко особисто привітав його за кмітливість. Тепер, бачачи, наскільки їхня допомога перевершує все, що він міг би надати, Руїса охопило передчуття лиха. Він запросив силу Сфери спільного процвітання до Сальвадору, і здавалося неможливим уявити, що вони ще довго вважатимуть Іберію своїм благодійником.\n\nРуїс підійшов до столу й набрав номер директора, цей звіт потрібно було негайно обговорити. Підготувати запасні плани й, що найважливіше, визначити цапів-відбувайлів. Коли телефон задзвонив, його очі не відривалися від Сальвадору та його коричневого, іберійського відтінку.\n\nРуїс дивився на нього, доки телефон не перестав дзвонити, а потім повільно поклав слухавку."
ELS_forpol.38.a: "Скільки часу мине, перш ніж його пофарбують у бордовий колір Сфери?"
ELS_forpol_38_tt: "\n§YПопри всі наші зусилля, ми не можемо сподіватися зрівнятися з впливом [JAP.GetFlag]§eЯпонії§! у [ELS.GetFlag]§BСальвадорі.§!\nНаш контроль повільно згасає...§!"
ELS_forpol.38.b: "Мадрид не може відступити без боротьби."
ELS_forpol_38_tt2: "\n§YЗавдяки нашій сильній присутності в Латинській Америці та Карибському басейні§! ми можемо боротися проти §eнеминучого...§!\nпевний час."

