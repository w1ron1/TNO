#Starting
ELS_King_Coffee: "Король Кави"
ELS_King_Coffee_desc: "Із приходом кінця XIX століття в сальвадорській економіці відбулася революція, коли експорт індиго був замінений значно прибутковішою кавою. Лише за кілька років ці землевласники-кавоводи стали абсолютними правителями країни, і хоча їхній вплив зменшився після 1931 року, ці еліти й досі планують повернення ще однієї епохи Мелендеса—Кіньйонеса."

ELS_Memories_Epoca_Oro: "Спогади про Золоту епоху"
ELS_Memories_Epoca_Oro_desc: "Для більшості країн Америк падіння Колумбії у громадянську війну є трагедією, яка підірвала їхню національну політику, але для Сальвадору це шанс один на мільйон. У 1950-х президентство Оскара Осоріо збільшило експорт кави, оскільки він обіцяв підвищити рівень життя та диверсифікувати економіку.\n\nХоча всі знають, що «диво» не триватиме вічно, принаймні їхні правителі можуть хвалитися тривалим національним процвітанням."

ELS_House_Divided: "Розділений дім"
ELS_House_Divided_desc: "Відтоді як незалежність напруженість і війна між двома чи більше політичними фракціями були щоденним явищем, і ця традиція тривала роками після Революції 1948 року, коли консервативні, реформістські та фашистські угруповання військових безперервно змовлялися одне проти одного. Лише новий сильний правитель може покласти край цьому конфлікту."

ELS_48_Forevermore: "'48 і назавжди"
ELS_48_Forevermore_desc: "Президент Рівера уособлює ідеали Революції 1948 року. Він стоїть на чолі сальвадорського антифашистського хрестового походу; однак цей капітан не терпить відхилень. З ним немає м’яких і затишних соціялістичних ідей, адже це не є захистом від фашизму.\n\nЛише наполеглива праця, відданість і справедливість можуть привести народ до свободи. Хоча він може бути диктатором, це не заважає йому намагатися здобути підтримку свого народу. Рівера придушує несправедливість і намагається знищити примару бідності та корупції, щоб захистити свою країну від так званих екстремістів.\n\nЛише час покаже, чи зможе він провести ці реформи, не роздратувавши кавових олігархів, які тримають його країну за горло."

ELS_Salvadoran_Spillover: "Сальвадорський наплив"
ELS_Salvadoran_Spillover_desc: "Через хронічну нестачу землі та перенаселення велика кількість сальвадорських кампесіно перетнула слабко контрольований кордон із Гондурасом у пошуках засобів до існування. Цей наплив не лише шкодить країні, оскільки робоча сила та люди шукають легшого життя за межами власних кордонів, а й розлютив гондурасців, які вважають, що сальвадорські мігранти крадуть ту незначну кількість землі, якою вони вже володіють.\n\nПрикордонні суперечки, а тепер і етнічна напруженість створюють ворожі відносини між двома країнами, і боронь Боже, щоб іскра не перетворила цей басейн бензину на пекло."

#Proxy
ELS_Westward_Wind: "Західні вітри"
ELS_Westward_Wind_desc: "Сальвадор завжди стикався з внутрішніми та політичними кризами, постійно балансуючи на межі перевороту чи громадянського конфлікту. Однак із революцією Фіделя Кастро та її експортом до берегів Пуерто-Плати студенти й військові Сальвадору бачать новий приклад для наслідування на шляху до процвітання. У міру того як революційний запал Гавани поширюється регіоном, вони зустрічають тимчасового, малоймовірного союзника. Іспанізм, натхненний ідеями фаланґізму та франкістської Іспанії до утворення Іберійського Союзу, знайшов своїх прихильників у лавах військових.\n\nЦі ультраконсервативні, шалено націоналістичні офіцери скористалися б будь-якою можливістю повалити те, що вони вважають роздутою, негідною та корумпованою владою, яка мучить країну, яку вони так люблять. Коли чутки про змови та перевороти гуляють вулицями Сан-Сальвадора разом із вітром, уряд мусить підготуватися до свого новітнього внутрішнього ворога."

ELS_Whirlwind: "Вихор"
ELS_Whirlwind_desc: "Сальвадор опинився в стані хаосу. Тепер, коли старий порядок повалено, кастристські військові офіцери швидко намагаються переграти підступних іспаністських ворогів, змагаючись за владу в гонці до вершини. Тим часом лівих студентів репресують, щоб влада не потрапила до рук радикалів, а старий порядок не отримав шансу повернутися.\n\nУночі чути вибухи автомобілів, арешти поліції здаються цілеспрямованими, а стривожені цивільні визирають із вікон, спостерігаючи за вуличними бійками. У коридорах влади може бути чимало офіцерів, але по всій країні панує хаос."
#Castrist Takeover
ELS_Con_Su_Sange_Escribo: "Con Su Sangre Escribió..."
ELS_Con_Su_Sange_Escribo_desc: "Натхненний антиімперіалістичною боротьбою Кубинської революції за позбавлення країни американського впливу та розпалюванням Кастро революційного запалу, Сальвадор став наступною кісточкою доміно в Латинській Америці. Студенти по всій країні об’єдналися з військовими офіцерами, натхненними кастризмом, поваливши підтримувану Америкою військову диктатуру. Тепер Росалес опинився на чолі країни, перевернутої догори дриґом, і використає це на повну.\n\nКолишній військовий, Росалес планує суворо контролювати нову революцію країни, спрямовуючи її шляхом прогресу за зразком PRI та завершуючи нову керовану революцію Сальвадору. Адже кров студентів і військових, пролита в їхній боротьбі, не буде марною, якщо Росалес цього доможеться. Саме їхньою кров’ю вони принесуть свободу Сальвадору."

ELS_Hand_in_Hand: "Рука об руку"
ELS_Hand_in_Hand_desc: "Сальвадор є твердим союзником Пакту Веракруса в Центральній Америці. Вони — старанні учні, які повністю приєдналися до блоку та шукають керівництва як Мексики, так і Куби у формуванні свого нового уряду, довгострокової політики та стратегій утримання влади.\n\nПоки Сальвадор прагне наслідувати Кубу у витісненні американського впливу з країни, і мексиканський, і кубинський капітал нетерпляче чекають, щоб заповнити вакуум. Мексика та Куба отримують унікальну можливість створити державу з нуля за власним бажаним образом. Доки Росалес і PAR стоять на чолі Сальвадору, країна йтиме рука об руку в лавах Пакту Веракруса."

ELS_Wringing_the_Towel: "Викручуючи рушник"
ELS_Wringing_the_Towel_desc: "Сальвадор завжди був на межі, але тепер PAR прагне відтягнути його назад. Іспаністські офіцери в жаху кричать, коли комуністичні студенти вільно ходять країною, політика якої є найбільш лівою за всю її історію, навіть якщо це лише копія PRI. Члени старого порядку змовляються з деякими прихильними олігархами, щоб повалити їх.\n\nАле це не бентежить PAR, оскільки вони сповнені рішучості започаткувати нову еру політичної стабільності в Сальвадорі, навіть якщо ця ера включатиме лише їх."

ELS_King_Coffee_New_Court: "Новий двір Короля Кави"
ELS_King_Coffee_New_Court_desc: "Намагаючись збільшити виробництво та позбавити олігархів їхнього впливу на суспільство, Росалес призначив Касереса реформувати життєво важливу кавову промисловість країни. Більше ці товсті, багаті олігархи не сидітимуть на своїх маєтках і не спостерігатимуть за стражданнями свого народу, привласнюючи прибутки собі.\n\nЩоб принести другу золоту епоху економіці Сальвадору, держава мусить взяти під контроль величезні площі плантацій, адже лише їй можна довірити захист інтересів людей, які там працюють. Завдяки технократичним заходам, покращенню їхніх умов життя та заробітної плати виробництво, своєю чергою, зростатиме, що дозволить подальшу індустріалізацію країни та, зрештою, дасть їй шанс увійти до сучасного світу."

#Nationalist Takeover
ELS_Honor_Nuestra_Divisa: "El Honor es Nuestra Divisa"
ELS_Honor_Nuestra_Divisa_desc: "Нарешті Сальвадор перебуває в руках справжніх патріотів. Країна більше не страждатиме від м’яких, безхребетних політиків 1948 року, яким бракує принципів і рішучості, щоб прокласти справжній шлях для нації. Так само Батьківщина більше не буде під загрозою з боку безбожних, наївних лівих ідіотів, які прагнуть перетворити Сальвадор на осередок бідності та страждань.\n\nТепер Сальвадором правлять люди, які люблять лише Бога більше, ніж свою країну, і вони подбають про те, щоб ця любов знищила кожен підривний елемент у кожній політичній сфері цієї країни. Сальвадор процвітатиме, розквітне і стане славним, бо люди, які наглядають за цією землею, не знають іншого девізу, крім честі."

ELS_Cara_Al_Sol: "Cara Al Sol"
ELS_Cara_Al_Sol_desc: "Хоча ми не фаланґісти, на вулицях можна почути гімн Франко. Чоловіки з Національної гвардії, прихильники Медрано, прийняли та почали просувати Національну революцію. Цей новий Сальвадор бере за модель хунту, яка врятувала Іспанію від більшовизму та привела її до патріотичної золотої епохи.\n\nРуки Старого Світу простягаються до нас, і ми повертаємося обличчям до сонця, радо приймаючи їхню допомогу — військову та політичну. Не кажучи вже про те, що по той бік Тихого океану японське сонце, що сходить, робить свої пропозиції новому потенційному партнеру. Майбутнє виглядає світлим... для тих, хто гідний бути його частиною."

ELS_Mano_Dura: "Mano Dura"
ELS_Mano_Dura_desc: "Як батько, що дисциплінує сина, ми не можемо дозволити цій країні поводитися негідно. Щоб Сальвадор зростав і дорослішав, ми мусимо позбавити його шкідливих звичок: комуністів, товстих, корумпованих олігархів і прихильників старого порядку.\n\nБільше того, ми мусимо позбавити його поганих впливів: жалюгідних гондурасців, які позують на кордоні, тероризують наш народ і прагнуть знову перетворити нас на руїну. Не може бути жодних поблажок, і Медрано має саме рішення. Озброїти його прихильників, сформувати з них воєнізовані загони та поширити його батьківську дисципліну по всій нації."

#Government Victory
ELS_Fading_Memory_Grey_Future: "Згасаюча пам’ять, сіре майбутнє"
ELS_Fading_Memory_Grey_Future_desc: "Попри свої «найкращі» зусилля, Сальвадор стагнує. Військові чинять надмірний тиск, постійно тиснучи на свій маріонетковий уряд. Економіка починає занепадати, а в народі зріє невдоволення. Попри це, Сальвадор кульгатиме далі, завзято святкуючи свої маленькі перемоги. Та промови стають дедалі порожнішими.\n\nУ міру того як зростання сповільнюється, ціни зростають, а політики ніколи не змінюються, Сальвадор залишається скороваркою, і зміни прийдуть. Питання лише в тому: наскільки насправді все зміниться?"

ELS_Downing_the_Hatches: "Зачиняючи люки"
ELS_Downing_the_Hatches_desc: "Хоча Сальвадор відтермінував неминуче, зробив він це лише тимчасово. Націоналісти підтримують зв’язок зі своїми японськими благодійниками після того, як ті, хто перебуває в Іберії, були відрізані. Студенти все ще протестують, навіть після того, як їхніх кастристських військових союзників було змушено замовкнути.\n\nЮридично PDC продовжує залишатися маргінальною опозиційною партією, нездатною прийти до влади, але її голоси стають дедалі гучнішими. Істеблішмент знає, що їх не можна змусити замовкнути, але гвинтівки все ще говорять голосніше за плакати. Наразі військові відбили бурю, але моря залишаються неспокійними, і вони мусять убезпечити свій корабель перед приходом наступної бурі."

#1967-68 Election
ELS_48_More_More: "'48 і ще, і ще"
ELS_48_More_More_desc: "Коли Рівера йде у відставку, дозволяючи новому президенту країни посісти його місце, ідеали революції 1948 року, здається, розчиняються в історії. Фальшиві вибори повернули Сальвадор прямо до його традиції: слабкий цивільний уряд, який має потужну підтримку військових. Ці поетапні реформи лише додаються до довгого списку методів, що дозволяють обходити питання відкриття країни.\n\nНа щастя для сальвадорського народу, його новий президент наслідує Ріверу. Миролюбна людина, яка справді намагається певною мірою покращити країну. Сальвадорці можуть очікувати певної невеликої земельної реформи та великих інвестицій в освіту. Попри всі його зусилля, схоже, ці невеликі зміни лише додадуть ще більше до невтішних результатів революції 1948 року."

ELS_Drawing_Back_the_Curtains: "Відсуваючи завіси"
ELS_Drawing_Back_the_Curtains_desc: "Рівера зазнав невдачі, і коли він іде у відставку, вистава закінчується. Без жодного тиску з боку Сполучених Штатів щодо проведення демократичних реформ Сальвадор знову опиняється на вихідній точці. Держава більше не проводитиме безглуздих законів, які не змінюють навіть відсотка нинішнього стану речей. Тепер військові, опора влади протягом усієї нашої історії, покажуть, ким вони є насправді: господарями Сальвадору.\n\nЄдине, що займає президента Фіделя Торреса, — підготовка. Країну необхідно стабілізувати, селян заспокоїти, а солдатів підготувати. Незабаром Фідель Торрес стане людиною, яка зустріне гондураського ворога, і нехай Бог йому допоможе, він та його країна переможуть. Чого б це не коштувало."

#Football War Win
ELS_A_Righteous_Victory: "Праведна перемога"
ELS_A_Righteous_Victory_desc: "Сальвадор виходить переможцем, але хіба вони коли-небудь сумнівалися? Жодна зовнішня змова чи ненависть до такого стійкого народу не могла зламати його дух. Хоча роками ми страждали під ярмом корупції та слабкості, новий уряд привів націю до перемоги, до звільнення від гондураського ярма. Навіть його недоброзичливці, вендепатріоти, які чинять опір йому, святкують на вулицях разом із найзатятішими націоналістами свою перемогу. Це гучне демонстрування непокори та незалежності надихнуло націю зміцнити зв’язки за кордоном. Сальвадор — власна країна, і жоден прислужник велетня не зможе її повалити!""

#Castrist Win
ELS_PAR_for_the_Course: "PAR for the Course"
ELS_PAR_for_the_Course_desc: "На виборах 1970 року переможець був відомий ще до того, як були видані бюлетені. Однак після перемоги над Гондурасом вигуки сальвадорців заглушують протести.\n\nТе, що Рікардо Фалья Касерес стає президентом, є ознакою численних змін, яких зазнав Сальвадор. Цивільний економічний експерт, він знаменує кінець військового правління та популізму.\n\nНатомість він закликає найсвітліші уми та найвидатніші таланти нації вийти вперед і продовжити їхню революцію. Технократія, стверджує він, — єдиний шлях у майбутнє.\n\nВін закликає до свободи, демократії та цивілізованості в країні, хоча очевидно, що це демократія для еліт, для обраних, а не для всіх. Попри це, нація підтримує його як людину, яка продовжує революцію Сальвадору."

ELS_Hand_in_Hand_2: "Рука об руку"
ELS_Hand_in_Hand_2_desc: "Сальвадор є твердим союзником Пакту Веракруса в Центральній Америці. Вони більше не учні, а рівні. Конституція 1970 року, прийнята після їхньої перемоги у Футбольній війні, була тісно змодельована за конституцією PRI, і революція тут не менш інституціоналізована.\n\nОскільки PAR залишається єдиною справжньою політичною силою Сальвадору, вони дивляться в майбутнє, маючи союзників поруч. Сальвадор — яскравий приклад Пакту Веракруса, його золотий хлопчик, і залишатиметься ним ще багато років."

ELS_Sitting_on_the_Sidelines: "Сидячи на узбіччі"
ELS_Sitting_on_the_Sidelines_desc: "Де опозиція? Де комуністи й фашисти? Де старий порядок? З Конституцією та приходом Касереса до президентства їх ледве можна було побачити в бюлетені; але вони там були.\n\nКонституція принесла рішення нестабільності та розколу Сальвадору: просто позбутися опозиції. Не кулями, арештами, вбивствами й страхом, а законними засобами. Обмеження кандидатів, певне підтасовування чисел і відмова в доступі до медіа. Нехай вони говорять скільки завгодно, адже ніхто їх не почує.\n\nОпозиція може залишатися там, але на поле вона ніколи не вийде. Революція змусила її сидіти на узбіччі, спостерігаючи за політичною грою PAR."

#Nationalist Win
ELS_Segunda_Epoca_de_Oro: "Друга Епока де Оро"
ELS_Segunda_Epoca_de_Oro_desc: "Хосе Медрано повів націю до її найбільшого конфлікту, і вийшов із нього переможцем. Шестерні фабрик обертаються, а врожаї рясні. Якщо не зважати на репресивний уряд Сальвадору, можна було б сказати, що країна повернулася до своєї золотої епохи, і, святкуючи свою перемогу, здається, люди також заплющили очі на уряд. Промови про незалежність, про перемогу попри всі труднощі та про їхнє блискуче майбутнє заповнюють радіоефір країни.\n\nЕкономіка міцна, їхній народ єдиний у перемозі. Поки це може тривати, народ Сальвадору пережив свою другу золоту епоху."

ELS_Cara_Al_Sol_2: "Обличчям до сонця"
ELS_Cara_Al_Sol_2_desc: "Готуючись до війни, Сальвадор звернувся до своїх найближчих союзників, Іберії та Японії. Саме їхні товари, зброя та боєприпаси принесли їм перемогу над слизькими гондурасцями. Однак після перемоги їхні закупівлі та замовлення не припинилися.\n\nУ дипломатичному плані вони вже давно перебувають на боці обох, але тепер нації змагаються за те, до чиїх рук потрапить сальвадорський плацдарм. Коли кораблі заходять до сальвадорських портів, здається, що переважна економічна машина Країни сонця, що сходить, просто перевершує Іберію за виробництвом і охопленням, і з кожним днем режим наближається до Сфери."

ELS_Escuadros_de_la_Muerte: "Ескадрони смерті"
ELS_Escuadros_de_la_Muerte_desc: "Моторошний привид переслідує тих, хто наважується протистояти режиму в Сальвадорі. Дехто каже, що деяким селянам було видано зброю для придушення їхніх побратимів-кампесіно, які живуть у злиднях, дехто каже, що саме армійським підрозділам наказано здійснювати вбивства. Хто вони, достеменно невідомо, але про їхнє існування добре відомо за моторошними записками, які вони залишають на понівечених тілах своїх жертв.\n\n""Ескадрони смерті"", як їх називають у країні, блукають глибинкою та містами, слідкуючи за чутками про комуністичних партизанів і противників режиму, проникаючи на їхні робочі місця та в домівки й холоднокровно вбиваючи їх.\n\nЯкий би опір не існував, він змовк або пішов глибоко в гори, побоюючись тепер сумнозвісних озброєних банд, які ґвалтують, грабують і вбивають власних співвітчизників."

#Government Win
ELS_Saving_Grace: "Рятівна благодать"
ELS_Saving_Grace_desc: "Слава Богу, всім ангелам і святим та будь-якій істоті, що перебуває над нами. Саме те, що нам було потрібно для порятунку нашого уряду, порядку, який завжди балансував на межі, було дано нам цією перемогою. Сальвадор бачить себе стабілізованим, оскільки загальне невдоволення розчиняється в патріотизмі після того, що могло стати нищівною поразкою.\n\nЗ післявоєнним бумом стабільності та легітимізованим режимом, здається, його непопулярність зникла. У найближчому майбутньому народ може бути незадоволений своїм урядом, але він задоволений своєю країною."

#1971 Election
ELS_48_More_More_2: " '48 і ще, і ще, і ще..."
ELS_48_More_More_2_desc: "Ледь зібравши достатню підтримку, Артуро Моліна стає наступним президентом країни, продовжуючи довгу низку президентів PCN і зберігаючи баланс у спільній цивільно-військовій диктатурі. Як і його корумповані попередники, Моліна продовжить поступові популістські реформи, щоб заспокоювати населення рівно настільки, аби стримати повстання.\n\nАле країна, здається, втомилася від удаваних реформ — не лише опозиція, а й олігархи та військові. Лише час покаже, чи відповідатиме Революція 1948 року своїм спотвореним і зневаженим ідеалам, чи цикл масових убивств і насильства повернеться до Сальвадору."

ELS_Party_of_Hope: "Партія надії"
ELS_Party_of_Hope_desc: "Поєднання тиску щодо демократичних реформ і нагляду з боку PCN призвело до дедалі вільніших виборів у країні. Однак у 1971 році сальвадорська ілюзія демократії була розбита, коли PCN програла. Наполеон Дуарте, багаторічний очільник скаліченої опозиції, тепер гордо стоїть на чолі нації, нації, яка вперше відчула смак демократії.\n\nКрасномовний, харизматичний чоловік, який очолює ""партію надії"", зробив саме це для нації: приніс надію. Надію на мирне майбутнє. На стабільне майбутнє. На демократичне майбутнє.\n\nСонце яскраво сяє над Сальвадором, адже чоловік, на честь якого названа країна, вперше за те, що здається століттями, благословив її."

#Football War Defeat
ELS_The_Impossible_Defeat: "Неможлива поразка"
ELS_The_Impossible_Defeat_desc: "Попри всю їхню риторику, всю їхню підготовку, все їхнє пихате існування, поразка у Футбольній війні здається неможливою. А для уряду вона й не можлива. Війна розкрила дихотомію країни: уряд Сальвадору говорить про процвітання, незліченні перемоги та силу свого народу. А їхня реальність? Цілковита бідність, нищівна поразка та перенаселений народ, якому уряд, що не визнає реальності, не може надати достатньої підтримки.\n\nКоли ті небагато сміливців і дурнів, які ставлять під сумнів партійну лінію, зникають, вони стають жертвами ескадронів смерті, що роз'їжджають країною.\n\nСальвадор уже зазнав однієї поразки, але уряд, здається, твердо вирішив не зазнати іншої, якщо він узагалі зазнавав якихось, адже попри те, що саме він першим перейшов у наступ, уряд уже охрестив свою провалену операцію ""Війною законної оборони""."

ELS_Enemy_Within: "Ворог усередині"
ELS_Enemy_Within_desc: "Після поразки та міграційної кризи чутки поширилися від найбагатших вулиць Сан-Сальвадору до халуп у найбідніших селах Чилтіупана.\n\nЧутки про те, що комуністи взялися за зброю пліч-о-пліч зі своїми корінними сусідами, вбрані в такий самий одяг, породжуючи серед населення повсюдний страх і параною. Кажуть, що ці невідмінні один від одного партизани вербують людей з усіх верств суспільства, спрямовуючи їхнє невдоволення роками некомпетентних правителів, нищівною бідністю та національною поразкою в нову партизанську кампанію. Ці комуністи розпочали свою кампанію, нападаючи на військові патрулі та цивільні об'єкти.\n\nКоли до Сальвадору приходить ще одна війна, постає питання: чи зможе уряд вижити?"

#Castrist Defeat
ELS_Guided_Revolution: "Керована революція"
ELS_Guided_Revolution_desc: "Сальвадорська революція дискредитована, переможена та принижена. Зазнавши поразки від гондурасців, ми не чуємо жодних фанфар від нашого народу. Коли було оголошено нову конституцію і обрано Касереса, не було жодних оплесків, лише апатичне прийняття.\n\nPAR тепер стоїть як PRI, як єдина партія, що править Сальвадором, інституціоналізуючи революцію як єдиний державний лад. Це крок, очевидний для народу, щоб не допустити появи будь-якого іншого руху, здатного його повалити."

ELS_Hand_in_Hand_3: "Рука об руку"
ELS_Hand_in_Hand_3_desc: "На щастя, завдяки новій конституції та нашим тісним зв'язкам із Мексикою ця поразка не така руйнівна, якою могла б бути.\n\nМексиканська допомога вливається в країну й доходить до населення, допомагаючи запобігти цілковитій катастрофі.\n\nПеренаселення та крайня бідність, що мучать країну, поволі долаються завдяки цій допомозі, і без неї ми, ймовірно, вже були б повалені, як довгий список короткочасних урядів цієї країни. Уся ця допомога ще більше зблизила нас із Мексикою, оскільки ми залежимо від неї, щоб вийти з цієї кризи."

#Nationalist Defeat
ELS_Se_Acoba_La_Fiesta: "Свято скінчилося"
ELS_Se_Acoba_La_Fiesta_desc: "Барабани війни били. Селяни та міські жителі разом рушили до Гондурасу, випнувши груди й сподіваючись принести своїй країні перемогу. Вони вірили, що їхні нові, віддані лідери підготували їх до цієї війни, якщо вже до чогось. Вони повернулися додому зігнутими, осоромленими та переможеними.\n\nТепер їхнє свято закінчилося. У країні немає гордості, немає надії. Тепер існує демографічна криза епічних масштабів, а за межами кількох убогих районів столиці країною править бідність. Немає гордості, немає сили, є лише гнітюча, нищівна поразка країни, і тепер уряд мусить знову змусити музику грати."

ELS_Cara_Al_Sol_3: "Обличчям до сонця"
ELS_Cara_Al_Sol_3_desc: "З конфіскованим обладнанням і запасами, що вичерпуються, країна конче потребує допомоги якомога швидше. Замовлення розміщуються у фірмах Іберії та Японії, але коли прибувають кораблі, саме японці бачать, як їхня продукція розходиться. Значно перевершуючи іберійців за виробництвом, режим дедалі більше потрапляє до рук японців, чия життєво важлива військова та економічна допомога допоможе Медрано зламати хребет опору, що піднімається по всій країні.\n\nЗворотний бік полягає в тому, що тепер режим прив'язаний до Сфери, щоб утримувати свою ненаситну військову машину, ескадрони смерті та економіку, що розпадається. Чим довше триває повстання, тим більше Сальвадор бачить себе в руках Країни сонця, що сходить."

#Sosa
ELS_Como_Al_Hizo_Maximiliano: "Як це зробив Максиміліано"
ELS_Como_Al_Hizo_Maximiliano_desc: "Максиміліано значною мірою впав через спроби провести земельні реформи, що зачіпали інтереси наших олігархів, яких цікавить лише збереження своїх розкошів, а не принесення процвітання Сальвадору та його народу, однак Соса засвоїв уроки своїх помилок 1944 року і знає, що має можливість завершити свою справу.\n\nПісля перемоги у війні та консолідації влади Патрія може почати очищати себе від комуністичних партизанів, які намагаються знищити нашу націю, і від тих олігархів, які, здається, більш віддані капіталізму, ніж нашій країні. Насправді ми можемо піти навіть далі, ніж Маррокін: знову запросити європейських офіцерів очолювати наші військові академії, повністю прийняти корпоратистську економіку та інституціоналізувати ідею фашизму за межами військових — або, ще краще, у кожному аспекті суспільства!"

ELS_Pragmatic_Duce: "Прагматичний Дуче"
ELS_Pragmatic_Duce_desc: "Хоча ОВН та решта Центральної Америки мають поважати авторитет нашого ""Дуче"", ми вважаємо, що такі люди, як Трухільйо, Морініґо чи навіть Маррокін, припустилися фатальної помилки, ворогуючи та ізолюючись від наших сусідів і США.\n\nПопереду багато роботи, перш ніж Сальвадор більше не залежатиме від торгівлі первинними ресурсами, і хоча ми безумовно рухаємося у правильному напрямку, у ці вирішальні роки ми могли б дозволити бізнесменам ОВН працювати в нашій країні, якщо вони зацікавлені в цьому. Звичайно, за умови, що вони поважатимуть наш союз і не намагатимуться стати олігархами. Так ми зможемо зберегти стабільну економіку, водночас зберігаючи наш проєкт і уникаючи будь-якої спроби іноземного перевороту."

ELS_Saving_La_Patria: "Порятунок Патрії"
ELS_Saving_La_Patria_desc: "Корумпована, застояна ""демократія"", що мучила країну, більше не може нею правити. Минали роки, а Патрія ледве тягнула своє існування, долаючи десятиліття на дерев'яних милицях. Але більше ні. Після того як уряд не зміг навести лад у своїх базових справах після Футбольної війни, доля, що спіткала інші країни регіону, спіткала й цих нікчемних олігархів. За допомогою Трухільйо Фаустіно Соса здійснив блискавичний переворот, щоб привести свою країну до процвітання. Після падіння старого режиму Соса вступає у владу, перебудовує країну та створює фашистський режим, щоб нарешті принести Сальвадору його давно заслужену золоту епоху."

#Commies
ELS_Legacy_La_Matanza: "Спадщина Ла Матанси"
ELS_Legacy_La_Matanza_desc: "У 1932 році після перевороту Максиміліано Ернандеса спалахнуло корінне комуністичне повстання. Подальші репресії проти повстання вбили майже 5% населення країни. Комуністи не збиралися вдруге припускатися тієї самої помилки. Їхня революція була стрімкою, їхнє повстання лютим, їхній терор просякнутий вогнем і кров'ю, а тепер їхня влада абсолютна.\n\nТепер настав час консолідувати революцію. Забрати багатство олігархів і повернути його голодним, збіднілим масам, знайти гнобителів та їхніх співучасників на всіх рівнях суспільства й розправитися з ними належним чином. Настав час помститися за Ла Матансу та за зґвалтування нашого народу, що сталося після неї."

ELS_Redistribution_of_Little_Wealth: "Перерозподіл мізерного багатства"
ELS_Redistribution_of_Little_Wealth_desc: "Без належної міжнародної допомоги ми звелися до найбільш автаркічних засобів відбудови та виправлення становища країни й нашої демографічної кризи після репатріації сальвадорців через кордон. Революціонери викрадають найбагатших людей країни, захоплюють їхні активи або утримують їх заради викупу та намагаються створювати програми соціального забезпечення й допомоги населенню, щоб полегшити тягар життя, яким є нинішній стан країни. Однак ми не багата країна, і гроші швидко виводяться з нашої території, оскільки ми вичерпуємо олігархів і лідерів, у яких можна провести націоналізацію. Ми намагаємося перерозподілити багатство по всьому Сальвадору, але, здається, людей просто надто багато, а багатства недостатньо."

ELS_Lonely_Liberation: "Самотнє визволення"
ELS_Lonely_Liberation_desc: "За очевидної відсутності справжнього Амазоністського блоку ми унікально самотні як найбільш віддана комуністична сила в регіоні. У нас немає покровителів, немає справжніх союзників. Як країна, ми самі по собі. Відсутність союзників означає відсутність допомоги, відсутність зовнішньої допомоги для доповнення нестачі всього, що є в нашій країні.\n\nМи перемогли фашистів і реакціонерів, але якою ціною ми це зробили? Які б комуністичні союзники не існували у світі, їхньої допомоги недостатньо. Невже ми прирекли наш народ страждати як новий парія Центральної Америки?"

#Anti-Commie
ELS_Back_To_Square_One: "Назад до вихідної точки"
ELS_Back_To_Square_One_desc: "Коли Амазоністи прийшли до влади, країна готувалася до змін. І зміни відбулися, але не в методах викорінення ворогів режиму. Насильство було лютим, а країна приготувалася до того, що її суспільний лад буде перевернуто з ніг на голову. Але одного дня їх усунули, і тепер Антоніо Порт повернув Сальвадор до вихідної точки. Маючи повну підтримку традиційної консервативної олігархії, він очолює кампанію повернення до традицій, повернення до американського табору. Можливо, його кампанія передбачає зміну, поворот на 180 градусів назад у минуле, але народ не протестує. Вони хочуть миру, і якщо уряд нічого для них не робить, їх це влаштовує, адже останнє, чого вони хочуть, — чути про будь-який уряд."

ELS_Crawling_Back_Home: "Повзком додому"
ELS_Crawling_Back_Home_desc: "Уникнувши найгіршого з чисток під час короткого періоду Амазонізму в Сальвадорі, тихі, проамериканські угруповання країни з жахом спостерігали, як політична система змінювалася, але їхні методи — ні. Звернувшись до американців, група найманців приєдналася до антикомуністів, що залишилися в країні, профінансована традиційною олігархією та ЦРУ для повалення комуністів і відновлення традиційного уряду Сальвадору.\n\nПісля довгого, виснажливого десятиліття для країни Сальвадор повертається до своїх коренів. Ті самі олігархи зустрічаються з тими самими американськими агентами та дипломатами, як колись, і їх знову радо приймають до табору. Сальвадор повернувся туди, де був завжди."

ELS_Fires_Must_Burn: "Вогні мають горіти"
ELS_Fires_Must_Burn_desc: "Антоніо Порт є захисником олігархів і традиційних правителів Сальвадору. Чому? Він щиро вірить в економічну теорію Мілтона Фрідмана, згідно з якою компанії мають дбати лише про отримання прибутку, відкидаючи концепції соціальних цілей та благодійності. Це означає, що Сальвадор не матиме проблем із відбудовою та індустріалізацією. Вони зроблять це швидкими темпами й досягнуть величезного успіху.\n\nАмериканський Ґуандун, як його називають. Але, як і Ґуандун, вони не враховуватимуть негативних наслідків у вигляді бідності, перевтомлених мас, самогубств і рівня життя селянства. Для них це не має значення. Це ознака прогресу, адже щоб приготувати омлет, треба розбити яйця."

ELS_Worn_Out_Tired: "Виснажені й втомлені"
ELS_Worn_Out_Tired_desc: "Коли новий уряд прийшов до влади, він виявив втомлений народ. Очікуючи запеклого опору лівих, революціонерів чи націоналістів, вони не знайшли нічого. Не було відсічі, протестів, організованої опозиції. Вони побачили народ, готовий прийняти все, що йому дадуть, сподіваючись і молячись за привілей жити нормальним життям.\n\nПоки уряд створює нову домінантну політичну систему, опозиція залишається, але вона настільки непопулярна й неорганізована, що це нічого не означає. PPS отримує унікальний привілей легко керувати нацією, навіть якщо це відбувається з найгірших причин"


#Government Defeat
ELS_Traditional_Tragedy: "Традиційна трагедія"
ELS_Traditional_Tragedy_desc: "Наче Сальвадор був грецькою трагедією, до списку додалася ще одна нищівна поразка. Повсюдна бідність і перенаселення, які уряд так і не зміг виправити, лише погіршилися. Поки олігархія та авторитарний PCN готують свою відповідь на кризу, у них залишається лише один трюк у рукаві, щоб утримати владу: відкрити вибори, зробити голосування трохи вільнішим, дати опозиції трохи більше свободи на політичному канаті.\n\nЯкщо уряд зможе отримати достатньо допомоги й достатньо відновитися, він, можливо, ледве-ледве переживе свої тепер значно реальніші вибори. Але якщо ні, його може повалити власна гра."

ELS_On_the_Brink: "На межі"
ELS_On_the_Brink_desc: "Після поразки у Футбольній війні подальші кризи продовольчої безпеки, перенаселення та бідності підживили лівих партизанів. Тепер ми зіткнулися з реальністю, що громадянська війна може бути вже на порозі, і країну необхідно убезпечити. Але це не звичайна війна; тут повстанці сидять поруч із фабричним робітником в автобусі та вирощують каву поруч із селянином.\n\nПридушення буде жорстоким у війні без ліній фронту, а тіла й обгорілі кістяки автобусів лежать уздовж доріг, що ведуть до столиці. Те, що прийде, буде жорстоким, навіть якщо ми докладемо всіх зусиль, щоб це обмежити."

#Rev Gait
ELS_Rector_of_the_Republic: "Ректор Республіки"
ELS_Rector_of_the_Republic_desc: "Фабіо Кастільйо Фіґероа провів більшу частину свого життя в лівих університетах Сальвадору. Він був палким прихильником Революції 1948 року та PAR, а також захоплювався M26 на Кубі та їхньою революцією. Ідеаліст, що дивився на світ крізь зоряні окуляри, у 1963 році він став ректором Університету Сальвадору та спрямовував лівих студентів нації до активізму. Переживши репресії режиму й ставши свідком його провалів, він повів студентів на повалення уряду після Нафтової кризи та подальшої нестабільності.\n\nТепер Фіґероа має намір керувати Сальвадором так, як він керував університетом, наслідуючи революційну модель Латинської Америки та нарешті намагаючись перетворити Сальвадор на вільну націю."

ELS_Welcome_Addition: "Бажане доповнення"
ELS_Welcome_Addition_desc: "Завдяки мексиканській допомозі студенти змогли озброїтися й швидко повалити хворий уряд. Тепер, коли новий революційний уряд стабілізувався, Фіґероа відчуває потребу дипломатично приєднатися до своїх ідеологічних однодумців.\n\nБез жодного примусу нова республіка звернулася до мексиканців і Пакту Веракруса, до якого її радо прийняли.\n\nВплив Пакту Веракруса в регіоні зростає, а позитивна увага медіа оточує те, що можна вважати значно вільнішою системою в країні, яка довго потерпала від корумпованих диктатур."

ELS_Sigh_of_Relief: "Зітхання полегшення"
ELS_Sigh_of_Relief_desc: "Хоча старий порядок і радикальніші постаті в країні були вигнані натовпами, опозиція країни все ще залишається без політичних прав, але її не переслідують до смерті.\n\nВони можуть організовуватися, можуть протестувати, і навіть якщо стикаються з поліцією, вперше їх не зустрічає смерть. У таких людей, як Наполеон, починає жевріти надія, що одного дня вони зможуть принести справжню демократію на свою землю."

## Events
# Not *exactly* sure if these should be here. If anything, possible to move. // Anna 

ELS_forpol.1.t: "Зламаний великий палець"
ELS_forpol.1.desc: "У 1948 році, після того як у Сальвадорі замовкли гармати, а фашистський режим генерала Маррокіна був повалений ЦРУ та Карибським легіоном, президент США Томас Дьюї сказав: ""Промінь світла свободи зійшов на маленький палець Америк"".\n\nЧотирнадцять років потому небо над Сан-Сальвадором затягнуте хмарами. За межами кампусу національного університету вантажівка вигукує ті самі старі гасла на підтримку кандидатури Хуліо Рівери на майбутніх виборах. Вона несе свої знамена, що обвисають від вологості, безлюдними вулицями й наполягає, благає народ вийти та підтвердити неминуче обрання ще одного військового, ще одного з кавових магнатів.\n\nЗахоплення демократією вичерпалося багато років тому. Навіть коли кавова економіка Сальвадору процвітала протягом минулого десятиліття, його хитка демократія в'янула в переворотах і контрпереворотах офіцерів та еліт, надто боязких для земельної реформи, які пленталися позаду, коли народ рвався вперед.\n\nІз хмар на місто обрушується злива, і передвиборчі плакати змиває в стічні канави. В університеті світло не гасне. Молодь, що подорослішала після генерала Маррокіна, тепер сперечається в аудиторіях, прикрашених кубинським прапором. Вони дискутують про революцію Кастро, подвиги Карибського легіону та PRI.\n\nДехто з них несе здобуті знання назад до військових казарм. Інші виходять під дощ і здирають зі стін те, що залишилося від Рівери. Усі вони сидять біля радіо, чекаючи наступного 1948-го, наступної революції. Своєї черги."
ELS_forpol.1.a: "Плентаєтеся. Народ усе одно знаходить майбутнє."
ELS_forpol.1.tt: "[ELS.GetFlag]Уряд Сальвадору, друг США, незабаром зіткнеться зі своєю часткою §&радикалів§! і §,реакціонерів§!."

ELS_forpol.2.t: "Передсмертний хрип американського впливу"
ELS_forpol.2.desc: "Дуже тривожні новини із Сальвадору.\n\nПісля низки пропущених звітних періодів від наших різноманітних джерел у цій країні було проведено розслідування, яке тепер завершено. І не зовсім так, як хотілося б.\n\nАмерика під атакою. Або, принаймні, наш вплив.\n\nСкоординовані зусилля, здійснювані поки що невідомими сторонами, спрямовані проти наших різноманітних мереж у Сальвадорі. Організація ФБР там втратила численних агентів, а ті, хто не був втрачений, не відповідають на дзвінки, попри підтвердження їх отримання. Американські фірми там усувають від угод, а прибутковість тих, що все ще тривають, різко впала через надмірне зростання цін на матеріали. На вулицях спостерігається антиамериканська пропаганда — через листівки, графіті, а останнім часом і через основні засоби масової інформації.\n\nХоча винуватці невідомі, вважається, що вони орієнтуються на кастристів, оскільки їхня поточна ""революція"" проти сальвадорської держави швидко поширилася в сільських регіонах і по всій провінції. Ми повинні це визнати й подвоїти зусилля для збереження нашої позиції в країні.\n\nА коли буде знайдено справжніх ініціаторів цієї кампанії? Нам потрібно буде забезпечити відплату."
ELS_forpol.2.a: "Знайдіть їх. Негайно."

ELS_forpol.3.t: "Антирадикальна активність"
ELS_forpol.3.desc: "У самому центрі Сан-Сальвадору стояв Ангел Свободи, центральна частина пам'ятника національним героям. Вона височіла над головами перехожих, тримаючи високо два лаврові вінки. Перед ангелом стояв японець. Випадкові спостерігачі дивилися на його згорблену поставу та дешевий костюм; він здавався туристом, що не має жодного значення. Він підхопив свій портфель і пішов від Ангела.\n\nНа північ від Пласа Лібертад був більярдний клуб, який відвідували люди з гідністю та статусом. Кенджі Морі увійшов до клубу; погляди мляво впали на нього, а потім різко відвелися, коли його впізнали. Працівник клубу записав його ім'я. ""Вітаю, Морі-сан"", — сказав слуга, забираючи його пальто. ""На вас чекають."" Морі кивнув, подумки перебираючи іспанські фрази з розмовника, який читав годину тому, щоб подякувати йому.\n\nНа другому поверсі клубу стояли більярдні столи; Морі подумав, що у звичайні вечори тут, мабуть, вирує життя. Лише кілька чоловіків зібралися навколо одного столу, одягнені в цивільні костюми, що погано сиділи. Коли Морі підійшов, вони припинили гру й привітали його. Один із молодших офіцерів запропонував йому чашку кави та представився перекладачем. ""Ви граєте?"" — запитав один із генералів.\n\nВони вважали себе націоналістами з розумом, революціонерами зі здоровим глуздом. ""Ми хочемо зберегти гідність і безпеку нашої революції"", — сказав лідер, ""а це означає захистити її від радикалів."" Він похлюпав напій у своїй склянці. ""Це означає, що Росалес має піти."" Він осушив склянку. ""Якщо він залишиться, ми станемо новітніми пішаками Мексики."" Він поставив склянку й сів поруч із Морі. ""Японія вже була союзником розумних революцій у минулому, з Колумбією. Якщо Імперія зможе надати нам таку саму підтримку, ми подбаємо, щоб Сальвадор не забув про своє покровительство.""\n\nУ вікні Морі побачив Ангела Свободи, що тримав високо лаврові вінки — нагороди переможцям."
ELS_forpol.3.a: ""Що там американці називали, теорією доміно?""
ELS_forpol.3.b: ""Наша підтримка Америк має бути виваженою. Думаю, ви це розумієте, генерале.""
ELS_Support_Coup_tt: "§YМи запропонуємо підтримку анти-ОВН військовому перевороту в Сальвадорі.§!"

ELS_forpol.4.t: "Приборкання кастристів"
ELS_forpol.4.desc: "Стискаючи останні звіти із Сальвадору, секретар зовнішніх відносин Тельйо Бауррауд переступив поріг. Замість усмішки Лопеса Матеоса його зустріли похмурий Ордас і різке: ""Його Високість недоступний. Я головуватиму на цій зустрічі.""\n\nБауррауд сів і розклав перед собою звіти, подумки перебираючи різні значення слова ""недоступний"". ""Дуже добре. Сьогодні ми мали визначити рівень і тип підтримки, яку плануємо запропонувати сальвадорцям після їхньої недавньої революції. Їхня військова хунта гостро розколота на фракції —"" фотографії та біографії посунули через стіл до Ордаса, який залишив їх лежати там, ""між кастристами, нашими союзниками та правими елементами.""\n\nОрдас відповів: ""Якщо ви були надто зайняті складанням профілів сальвадорських полковників і майорів, щоб помітити, ми маємо справу з найбільшим економічним відступом від часів адміністрації Карденаса та загальнонаціональними заворушеннями.""\n\nБауррауд затинаючись промовив: ""Т-тут є наслідки для національної безпеки. Праві звертаються до Японії та Іберії по підтримку. Майор Рубен Алонсо Росалес, навпаки, прагне зберегти незалежність Сальвадору разом із Пактом Веракруса.""\n\nОчі Ордаса звузилися, і він промовив,"
ELS_forpol.4.a: ""Надішліть японські докази Росалесу. Коли настане час, він звинуватить своїх ворогів у державній зраді.""
ELS_forpol.4.a.tt: "Успіх цього варіанту залежить від того, чи зможе Росалес завдати першого удару."
ELS_forpol.4.b: ""Скажіть капітану Ґутьєрресу, щоб він заручився підтримкою Кастро та його сальвадорського фан-клубу на користь Росалеса.""
ELS_forpol.4.b.tt: "DFS наразі перевантажена, це може зашкодити нашій стабільності."
ELS_forpol.4.c: ""Ми чекаємо на думки Його Високості — скільки б це не тривало.""
ELS_forpol.4.c.tt: "У революції час має вирішальне значення."

ELS_forpol.5.t: "Деамериканізація" #Use of Caceres is intentional, as he'd be handling the econ side of things post-coup even if Rosales is more important politically.
ELS_forpol.5.desc: "Секретарі Тельйо Бауррауд і Салінас стояли обабіч Антоніо Мени, коли телефон задзвонив раз, удруге, а потім-\n\n""Докторе Касерес, радий з вами поговорити. Це міністр фінансів Мексики Антоніо Мена. Я вже деякий час стежу за вашими пропозиціями щодо інвестицій у кавовий сектор Сальвадору, досить вражаюче.""\n\n""О, ви надто люб'язні, докторе. Нещодавнє зростання Мексики значною мірою стало результатом спільних зусиль."" Салінас закотив очі, коли Антоніо продовжив. ""На жаль, сьогодні я маю повідомити сумні новини. Фінансовий контакт у Нью-Йорку повідомив мені, що Сполучені Штати запровадять новий раунд санкцій проти Сальвадору.""\n\n""Так, тиск, який це чинить на вас і хунту, величезний. Я не чув про точну причину санкцій, ні — але північноамериканські бізнесмени, пов'язані з урядом, який ви повалили, безсумнівно, звертаються до своїх друзів у Вашинґтоні.""\n\n""Що Мексика може зробити для Сальвадору в ці кризові часи?"" Рука Мени тремтіла, смикаючи телефонну слухавку туди-сюди. Салінас і Бауррауд одразу взялися до справи: економіст намагався прошепотіти щось Мені на вухо, тоді як дипломат енергійно жестикулював до списку пунктів, складеного перед ним.\n\nМена заплющив очі й промовив у телефон так спокійно, як тільки міг,"
ELS_forpol.5.a: ""Як торговельний партнер і Сальвадору, і США, ми могли б знайти альтернативні маршрути для вашого експорту.""
ELS_forpol.5.a.tt: "Допомога Сальвадору в обході санкцій не додасть нам прихильності США."
ELS_forpol.5.b: ""Ми використаємо наші контакти у США, можливо, зможемо переконати їх послабити санкції.""
ELS_forpol.5.b.tt: "Чи заради цієї справи ми хочемо скористатися цими послугами?"

ELS_forpol.6.t: "На зміну старому — нове"
ELS_forpol.6.desc: "Коли літаки вилітали на північ із Сальвадору, літаки із заходу приземлялися на його злітних смугах. Коли військовим офіцерам, симпатизувальникам Сполучених Штатів, пропонували пенсії або ув'язнення, військові офіцери, симпатизувальники Японської імперії, отримували вищі посади. Коли долари тікали з банків і підприємств, їхні власники виявляли, що мають повні кишені єн.\n\nТакою була геополітична тенденція в Сальвадорі після кастристської перемоги 1963 року. Перемога належала передусім Мексиці та Кубі, двом охоронцям незалежності Центральної Америки, які захищали націоналістичну революцію. Але хоч би наскільки важливими вони були для перевороту, вони не були наддержавою, а світ навколо них усе ще визначався втручанням і покровительством цих титанів. Відхід Сполучених Штатів із Сальвадору привернув увагу Японської імперії, яка побачила в перемозі кастристів шанс створити ще один плацдарм на задньому дворі Америки.\n\nТож коли новий режим утверджувався, уважні спостерігачі могли відчути, як рука Японії прослизає вздовж плечей країни. Молоді офіцери говорили про свою відданість модернізації, повторюючи риторику, почуту через треті руки від Азад Хінд. Контейнеровози з Акаджутли прямували на захід частіше, ніж на північ. Революція транслювала себе через радіоприймачі Sony.\n\nА через Тихий океан у Міністерстві закордонних справ, відповідальному за зв'язки з Латинською Америкою, вирувала діяльність. Бюрократи й планувальники в цих відомствах усі знали, що це кампанія, народжена опортунізмом. Революцію здійснили кастристи, і вони вважали Японію таким самим чужинцем, як і Сполучені Штати. Вони були їм потрібні, але кастристи лише вважали їх корисними; їх уже зарезервували за собою, і Японії доведеться мудро використовувати свої можливості, щоб замінити один набір іноземних інтересів власними."
ELS_forpol.6.a: "У будь-яку мить рука Мексики може відкинути їх."

#Apparently 7-8 don't exist

ELS_forpol.9.t: "Сальвадор у Пакті Веракруса" 
ELS_forpol.9.desc: "Назвати нинішні обставини Ґуставо Руїса невдалим початком дня було б применшенням. Усе почалося з шепоту, як це часто буває. Зміна балансу, нагляд за іспаністськими офіцерами, нові обличчя в кожній казармі. Лише коли шепіт припинився зовсім, він зрозумів, що все скінчено.\n\nДо того часу, коли він зміг відправити телеграму до Мадрида, чорнило на угоді між Мексикою та Сальвадором було ще свіже, а тіла його нових ""друзів"" у сальвадорських збройних силах — свіжі в землі. До того часу, коли його портфель був зібраний, а кімната, у якій він провів останні місяці, спорожніла, новина про цю справу вже транслювалася по всій країні.\n\nЗавжди було певним ризиком повернути Іберію в центр картини, яка змінювалася протягом століть. І все ж це були його накази, як і накази інших спеціальних представників, яких Союз направив до регіону. Дон Руїс виконав їх, наскільки міг...\n\nСрібної підкладки не було. Мексика була майже настільки ж огидною для Іберії, наскільки це взагалі можливо. Зв'язки зі світом сальвадорського бізнесу тепер розірвані. Руїс був упевнений, що в Мадриді паніка, але це більше не його турбота. Принаймні поки що.\n\nНі, спускаючись численними сходами непоказної квартири в Сан-Сальвадорі, він думав лише про одне: на нього чекав літак."
ELS_forpol.9.a: "Справді, Мадрид виглядав краще в цю пору року."

ELS_forpol.10.t: "Сальвадор у Пакті Веракруса" 
ELS_forpol.10.desc: "Дюжина панічних телеграм із посольства в Сальвадорі змусила Міністерство закордонних справ зануритися в схвильоване розслідування. Усе почалося з шепоту — кастристи усувають наших людей з армії — а завершилося запізнілими похмурими попередженнями — Росалес вилітає до Мексики, стривайте, чорт, він уже перетнув кордон. До того часу, коли Міністерство закордонних справ змогло відповісти, чорнило на угоді між Мексикою та Сальвадором було ще свіже. До того часу, коли почалася наступна хвиля армійських чисток, Міністерство закордонних справ уже обговорювало, як спрямувати це контрольоване падіння.\n\nПаніка лише на коротку мить перетворилася на розчарування, а потім настала покора. Файли перекладали до архівів, плани відкладали, активи тихо відсікали. Завжди було певним ризиком проникнути в уже наявну революцію та спрямувати її погляд із півночі на захід. Невдачу було легше проковтнути: можна було визнати, що це завжди мало бути неможливим, і отримати привід не картати себе надто сильно через це. У кімнатах відпочинку Міністерства закордонних справ чай був таким же гірким, як кава, яку вони втратили.\n\nІ все ж були певні світлі сторони. Мексика була достатньо дружньою до Японії — настільки, що вони все ще мали шлях до сальвадорських ринків. Бізнес можна було заспокоїти, хоча яструби в Міністерстві були менш задоволені втратою доступу до військових. Вони вже прокладали собі шлях туди, насаджуючи прояпонські настрої в умах молодших офіцерів, які дивилися на Азад Хінд і Таїланд у пошуках натхнення щодо того, як спрямовувати та захищати свою революцію. Тепер усе це зникло; Кастро став взірцем дня, а не Босе."
ELS_forpol.10.a: "Міністерство закордонних справ прийняло це розчаровуюче легко."

ELS_forpol.11.t: "Пройти весь шлях" 
ELS_forpol.11.desc: "Матеос дивився на злітну смугу, розмірковуючи про недавні події. Зовнішня політика, зрозумів він, зовсім не схожа на бокс. Бокс — спорт джентльменів, у боксі є правила. Глобальна політика більше схожа на вуличну бійку, де витягнуті ножі й пістолети. І все ж іноді, як і в боксі, аутсайдер може здобути несподівану перемогу.\n\nКоли літак зупинився і Рубен Алонсо Росалес з'явився у дверях, Матеос широко усміхнувся. ""Ласкаво просимо назад до Мехіко!"" — вигукнув він.\n\n""Для мене честь повернутися, Ваша Високосте"", — відповів сальвадорець.\n\n""Ну, ну"", — докорив Матеос, ""я цього не приймаю. Тепер ви глава держави, який перебуває з візитом, просто ""Адольфо"" підійде, Рубене.""\n\nРосалес усміхнувся. ""Партнер, який ставиться до нас як до рівних... мій народ сприйме це як приємну зміну.""\n\n""Це лише початок, Рубене. Щойно ви приєднаєтеся до Пакту Веракруса, ми інвестуємо в розвиток Сальвадору, щоб ваш народ міг розділити процвітання, яке ми тут побудували.""\n\n""Тоді не гаймо часу. На церемонію підписання.""\n\nКоли пара вийшла з аеропорту в море спалахів камер, Матеос вирішив подарувати пресі пам'ятний момент. Схопивши Рубена за ліву руку, він підняв її в повітря на знак тріумфу."
ELS_forpol.11.a: "Сальвадор стоїть разом із Мексикою."

ELS_forpol.12.t: "Ознайомча екскурсія"
ELS_forpol.12.desc: "Пляшка луснула на знак святкування, обливаючи шампанським сальвадорців та їхнє барвисте судно. Люди PAR, суворі військові типи, нарешті послабили краватки й тупотіли ногами в ритм маріачі на підлозі трахінери. Альфонсо Корона дель Росаль, їхній господар і президент партії PRI, усміхався — гондоли та канали Федерального округу давно зачаровували офіційних відвідувачів.\n\nГенерал дель Росаль розтулив губи, і половина сальвадорської делегації рефлекторно струнко стала. Він пробурмотів: ""Ці кастристи..."" А потім голосніше: ""Я радий чути, що PAR зростає — повільно, але впевнено. Я хотів показати вам невелику частину того, що охоплює революційна партія Мексики.""\n\nТрахінера причалила до жвавого ринку; свинячі шкварки та попкорн пропонувалися відвідувачам PAR — за певну ціну. Дель Росаль дочекався, поки його сальвадорські гості закінчать, перш ніж продовжити: ""Кожен із цих власників малого бізнесу є частиною PRI через CNOP. Ваша партія могла б заохочувати продавців на державних ринках приєднуватися. Їхні амбіції та щорічні ліцензії роблять їх цінним і швидким доповненням.""\n\nГенерал повернувся до чергової червоної трахінери, набитої молодими чоловіками в робочих комбінезонах, які співали й пили. ""Ці юнаки є членами CTM, конфедерації профспілок, пов'язаної з нашою партією. Вони отримують зарплату для вечірнього відпочинку, Мексика отримує грошову та соціальну стабільність.""\n\nЧовен зупинився перед квітучим плавучим садом. Дель Росаль дозволив сальвадорцям хвилину дивуватися, перш ніж сказати: ""Тепер я не можу показати вам селян у самому центрі Мехіко. Але у своїй масі вони належать до CNC, нашої угоди з ними про забезпечення ""Землі та свободи"".\n\n""Але коли наша екскурсія добігає кінця, ліценсіадос, куди ваша партія рушить найперше?"""
ELS_forpol.12.a: "Діловий клас Сальвадору забезпечить потік талановитих рекрутів."
ELS_forpol.12.a.tt: "§F\n§CPAR§! стане більш §bдинамічним.§!§!"
ELS_forpol.12.b: "Вирощувачі кави — серце сальвадорської революції, і вони мають бути серцем нашої партії."
ELS_forpol.12.b.tt: "§F\n§CPAR§! стане більш §dолігархічним.§!§!"

ELS_forpol.14.t: "Перша увертюра"
ELS_forpol.14.desc: "Пізня ніч у Міністерстві закордонних справ: втомлені чиновники навколо дубового столу для нарад; зім'ята купа сигарет, що тліє в попільничці; карта Центральної Америки з десятком шпильок, встромлених у перешийок, зосереджених навколо Сальвадору. Порядок денний: визначити, як відповісти на ранкову новину про успішний переворот проти кастристського уряду.\n\n""Ну хіба не цього ми хотіли?"" — запитав чиновник, запалюючи другу сигарету за годину. ""Ми відправили туди Морі, і він допоміг схилити армію на наш бік.""\n\n""Навряд чи на наш бік"", — сказав інший, підходячи до карти й дістаючи невелику телеграму від наших агентів у Сальвадорі. ""Вони ненавиділи кастристів, кастристів більше немає. Чого жоден із наших агентів на місці досі не помічав, так це того, скільки цих офіцерів повертаються на схід."" Його рука ковзнула через Атлантику; палець зупинився в Мадриді.\n\n""Вони можуть скільки завгодно гратися в іспанізм"", — сказав третій чиновник, ""але зрештою їм потрібен лише захист від Америки. Іберія не може захистити їх так, як ми.""\n\n""Усе це починається"", — сказав ще один чиновник, ""з обіцянок і подарунків. Поки що ми не зробили нічого, крім відправлення одного шпигуна та вітального кошика новому режиму.""\n\n""І?"" Перший чиновник підняв брову. ""Ми не можемо зайти надто далеко. Ми маємо дозувати нашу підтримку, інакше Америка здійме галас. Нам зараз не потрібен такий головний біль.""\n\nДругий чиновник, його палець усе ще лежав на краю Іберії, перевів погляд назад до перешийка, де Сальвадор був оточений шпильками."
ELS_forpol.14.a: ""Військова допомога може бути варта розгляду. Їм потрібні гвинтівки, чи не так?""
ELS_forpol.14.b: ""Ми можемо надіслати радників. Можливо, вони допоможуть їм поглянути на речі так, як ми.""
ELS_forpol.14.c: ""Вони втратили багато іноземних інвестицій, коли Америка пішла. Заповнімо цю прогалину.""

ELS_forpol.15.t: "Коридор до Сан-Сальвадору"
ELS_forpol.15.desc: "Колумбійців у Боготі слід похвалити за те, що вони згуртували націю навколо справи національного суверенітету під час Громадянської війни, так само як і метрополія в Іберії палко пишається тим, що силою зброї та іноземною допомогою захистила міжнародних спадкоємців справжньої Нової Гранади. Оскільки Іберія відновлює сферу впливу серед своїх колишніх колоній, інші іспаномовні країни Карибського басейну та Центральної Америки неминуче мали побачити подібні переваги від переорієнтації на Мадрид.\n\nНевелика держава Сальвадор є яскравим прикладом цього. Затиснуті між жорсткою націоналістичною агітацією зсередини та втручанням янкі ззовні, вони були змушені балансувати в згубній рівновазі, визначеній доктриною Монро, разом із багатьма своїми безпосередніми сусідами. Попри показну антиколоніальну позицію Нортіамериканос, Вашинґтон уже звик виконувати власні імперські танцювальні па, навіть якщо ніколи в цьому не зізнається.\n\nСаме це зробило сальвадорське звернення таким мало дивним для керівництва в Мадриді. Оскільки Колумбія все ще відбудовувалася після Громадянської війни, уряд Сальвадору разом із приватним сектором незабаром оголосив про намір запропонувати свої послуги відбудовчим зусиллям у північних Андах.\n\nНаслідки цього неважко побачити, якщо останні події в регіоні є хоч якимось орієнтиром. Відтоді як Америка зазнала поразки у Другій світовій війні, її вплив уздовж південних периферій перебуває в затяжному занепаді. Між недавнім відродженням Домініканської Республіки та тріумфом Боготи Сальвадор явно бачить сенс у тому, щоб шукати аудієнції зі своїми пращурами в Європі."
ELS_forpol.15.a: "А спадкоємці Іспанської імперії більш ніж раді допомогти..."

ELS_forpol.16.t: "Старий господар у Мадриді"
ELS_forpol.16.desc: "Наші колишні союзники по Осі на Іберійському півострові давно були дивним партнером у глобальній геополітиці, навіть після кожного з наших гірких розривів із союзом із Німеччиною. Відтоді як Іспанія та Португалія об'єдналися, Іберійський Союз був зручною скалкою в боці Німеччини. Доктрина щодо Латинської Америки має певні поверхневі подібності до нашого власного блоку у Східній Азії, прагнучи перетворити природну історичну спорідненість із колишніми колоніями на більший союз проти іноземного стримування.\n\nМи у Великій Східноазійській сфері спільного процвітання не уникнули гніву цієї ледь прихованої реконструкції старого європейського імперіалізму, як це видно з недавнього втручання в Громадянську війну в Колумбії та подальшої реакції країн Карибського басейну й Центральної Америки. Президент Фаустіно, лідер Сальвадору, сподіваючись пристати до іберійської сфери після недавньої перемоги Боготи, офіційно оголосив про свій намір встановити подальші відносини з Іберійським Союзом.\n\nНе є незвичним, коли колишня підлегла держава шукає союзу з метрополією, і колишній союз Америки з Великою Британією є добре відомим прикладом. Водночас це прямо суперечить власним зусиллям Токіо зблизитися із Сан-Сальвадором, засипаючи сіллю рани недавнього краху Нової Гранади.\n\nІнтереси Японії далеко не вичерпані лише через іберійське піднесення, і навіть воно може стати корисним інструментом для проникнення крізь американську хватку над Карибським басейном. І все ж прикро, що сальвадорці, здається, так охоче продають свою землю назад тій самій імперії, від якої прагнули звільнитися, що явно є ще одним показником того, що за іберійським впливом в Америці слід стежити протягом усього цього періоду."
ELS_forpol.16.a: "Іберія ніколи не була слабаком, нам слід бути обережними й не недооцінювати її."

ELS_forpol.17.t: "Реконкіста"
ELS_forpol.17.desc: "Сьогодні в Сан-Сальвадорі відбулася грандіозна подія: представники іберійської сфери зустрілися в Національному палаці, щоб підтвердити зобов'язання Сальвадору щодо солідарності з Латинською Америкою. Президент Медрано був там, щоб представляти свою країну, Трухільйо були там, як і посланці з Боготи, Мадрида та Лісабона. Серед численних питань, що обговорювалися делегаціями, було питання зобов'язання Сальвадору щодо взаємної оборони в регіоні.\n\nЗвісно, проста географія означала, що внесок Сальвадору в оборонний союз з Іберією буде мінімальним. Усі сторони це визнавали, і ніхто не мав через це особливої неприязні. Водночас військову присутність Сальвадору в іберійській сфері навряд чи можна вважати другорядною. Хоча сальвадорські військові й невеликі, вони можуть триматися не гірше за будь-яких легіонерів Кастро чи інтервенційних сил ОВН.\n\nПроблема полягає в постачанні, яке має відповідати попиту, оскільки географічні розміри Сальвадору та його економіка, що розвивається, не дозволяють багато в чому розгорнути власні військово-промислові можливості. Це означає, що будь-який військовий розвиток має надходити з-за кордону, а саме від їхніх європейських благодійників. Керівництво Іберії знало про запит Сальвадору ще до його висунення і мало безліч варіантів, які можна було запропонувати Сан-Сальвадору для розбудови його збройних сил. Від військової експертизи до технічних досягнень і надлишків озброєння."
ELS_forpol.17.a: "Наші найкращі офіцери доведуть тактичне ноу-хау Сальвадору до належного рівня."
ELS_forpol.17.b: "Військові дослідження Іберії посилять ефективність Сальвадору на полі бою."
ELS_forpol.17.c: "Навряд чи бракує речей, які потрібно розстрілювати в джунглях..."

