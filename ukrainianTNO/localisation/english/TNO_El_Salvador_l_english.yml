ELS_forpol.19.t: "Єднання Америк"
ELS_forpol.19.desc: "Нещодавня перемога Нової Гранади у Громадянській війні в Колумбії була перемогою японських інтересів не в одному сенсі, оскільки зв'язки між колумбійським націоналістичним режимом та Японською імперією починають привертати увагу вздовж екватора, і не лише американців та їхніх союзників. Зростаючий націоналістичний блок для протидії втручанню ОВН має певну привабливість, і нещодавні ініціативи іншої латиноамериканської нації, здається, це підтверджують.\n\nСальвадор, ще одна країна Центральної Америки, що розвивається, публічно заявив про свій інтерес до зближення з Японською імперією. Подібно до зв'язків Японії з сусідніми Мексикою та Ґватемалою, уряд Сан-Сальвадору бачить, куди дме вітер, і прагне налагодити відносини з Далеким Сходом у надії на взаємовигідну домовленість. Очевидно, будь-які застереження, які могли мати їхні лідери, були розвіяні після перемоги Нової Гранади.\n\nПочаткові переговори із сальвадорцями були тихими, але виявилися плідними. Може минути трохи часу, перш ніж сильніша японська присутність відчується в Сальвадорі, але основу для неї принаймні вже закладено. Якщо побоювання спекулянтів щодо ініціатив Нової Гранади у відносинах з Італією виявляться правдою, а союз Токіо з Боготою буде напруженим, нове зближення Сальвадору з Японією доводить, що Імперія стає дедалі життєздатнішою альтернативою американському впливу в регіоні."
ELS_forpol.19.a: "Можливо, одного дня японські військові кораблі прикрасять ворота Панами, піднявши прапор солідарності зі своїми союзниками на заході!"

ELS_forpol.20.t: "Портові роботи"
ELS_forpol.20.desc: ""Полковнику, ви повинні зрозуміти. Спочатку американці, потім японці."\n\nГолос сальвадорського міністра закордонних справ заглушували гуркітливі хвилі. Він ішов причалами Акаджутли, його кроки відлунювали над потрісканим покриттям. Полковник поруч із ним ішов у ногу, а міністр потирав скроні, намагаючись позбутися стресу.\n\nЧутки про американський путч у Сальвадорі вже тиждень ширилися телефонними дротами, паралізуючи уряд. Щойно скинувши американське ярмо, деякі радикальні елементи адміністрації шукали союзників за кордоном.\n\n""Це лише невелика кількість послуг, міністре"", — сказав полковник, поклавши заспокійливу руку на свого дипломатичного колегу. ""Лише деякі запевнення.""\n\n""Завжди все починається з малого, полковнику"", — пробурмотів міністр закордонних справ, м'яко скидаючи його руку. Він озирнувся на безплідні порти навколо. Іржаві крани та рибальські траулери. Навіть місцеві чайки перестали пролітати повз. ""Сьогодні це будуть слова запевнення. Завтра це будуть японські кораблі в наших гаванях. Наш суверенітет під загрозою.""\n\nВін зупинився, щоб прямо поглянути на міністра. ""Японія також виступила проти Америки. Вони знають, як це — коли їхній суверенітет опиняється під загрозою — і як його повернути. Вони зрозуміють наше становище.""\n\nМіністр також зупинився, але не для того, щоб поглянути на полковника. Він дивився в безмежний Тихий океан, прямий шлях до Японії. Вони могли або дати Сальвадору нову надію, або нові кайдани.\n\n""За все треба платити, полковнику. Скільки часу мине, перш ніж японці стануть такими самими, як американці?"""
ELS_forpol.20.a: ""Запропонуйте дипломатичні гарантії. Ми не можемо ризикувати конфліктом.""
ELS_forpol.20.b: ""Пообіцяйте їм певні фінансові інвестиції.""
ELS_forpol.20.c: ""Надішліть невеликий військово-морський конвой. Покажіть Америці, як виглядає доброзичлива імперія.""

ELS_forpol.21.t: "Економіка Нового Світу"
ELS_forpol.21.desc: "Відтоді як Японія стала головним лідером економіки Азії, розширення на світові ринки було неминучим. Попри сильну опозицію Вашинґтона та Германії, ніщо не мало завадити торговельному домінуванню Токіо вийти за межі його берегів. Мексика, безумовно, була пристойною відправною точкою в Америках і чудовим плацдармом для подальшого розширення в Карибський басейн, у такі місця, як сусідня Ґватемала.\n\nЗагалом тихий тропічний край біля підніжжя Юкатану, післявоєнний мир дав молодим державам Центральної Америки шанс на економічне зростання, відкриваючи можливості для пошуку інвестицій поза американською сферою. Японські операції в Ґватемалі знайшли сприятливий ґрунт протягом міжцарів'я завдяки інвестиціям у кавові плантації та інші товарні культури регіону.\n\nМісцеве виробництво також становило значну частину японських інвестицій у Ґватемалі, причому багато імпортних товарів із Ґуандуну та Маньчжоу-Ґо проходили завершальну обробку й продавалися в інших частинах Америк. Разом із японською фінансовою присутністю в Мексиці, зростаюча японська присутність у центральноамериканській економіці лише дратуватиме Сполучені Штати, оскільки японська єна починає конкурувати з доларом янкі за пріоритет у витратах уздовж західного екватора."
ELS_forpol.21.a: "Хоча це може здаватися нешкідливим, Ґватемала є достатньо міцним фундаментом для чогось більшого."

ELS_forpol.22.t: "На краю казана"
ELS_forpol.22.desc: "На Кубі вторгнення в Пуерто-Плату було трагедією. У США — ганьбою. У Сальвадорі це було чимось захопливим. Це не було простим повстанням. Укорінена еліта Домініканської Республіки змогла відправити Дядька Сема додому та захистити свій суверенітет, зробивши це з мінімальною допомогою своїх друзів у Європі. Жодних поступок, жодної капітуляції. Рафаель Трухільйо, що б про нього не казали, був взірцем для автократів по всій Центральній Америці, якому вони могли наслідувати.\n\nПротягом кількох днів перемога на Еспаньйолі була головною темою для сальвадорських кавових магнатів і правих армійських офіцерів, які обговорювали новини у своїх заміських клубах, ложах і казармах або після церкви. Вони захоплювалися великодушністю Трухільйо, його силою, а деякі навіть захопленням від його фашистських переконань. Якби Сальвадору колись знадобився порятунок, потрібні люди могли б врятувати себе, якби знали як.\n\nЗвичайно, у цих розмовах завжди перемагали холодніші голови. Президент Адальберто був не Трухільйо, та йому й не потрібно було ним бути — відносини з американцями наразі були досить добрими, а янкі поки не надто тиснули. Щодня каву все ще збирали на плантаціях і без нарікань відправляли на північ. Так було десятиліттями, і, сподіваємося, так триватиме й надалі."
ELS_forpol.22.a: "Не треба хвилюватися."

ELS_forpol.23.t: "Політичні військові"
ELS_forpol.23.desc: "Збройні сили Сальвадору — це радше постійно присутня політична партія, яка домінує над кожним аспектом державного управління, ніж справжня військова сила — але для Білого дому вони можуть бути так само ""небезпечним елементом"", як і слухняним псом на повідку.\n\nУ частинах, спонсорованих американськими мережами, військові Сальвадору досі виявлялися відносно орієнтованими на інтереси північних корпорацій виключно через фінансові мотиви, а не через ідеологічну відданість демократичним ідеалам. Однак, оскільки останніми днями повідомлення про порушення прав людини та падіння рівня життя просочуються за межі контрольованих медіа країни, відкрита підтримка сальвадорського режиму може привернути небажану увагу до уряду США з боку недружніх критиків.\n\nАле політичний капітал походить із грошового капіталу — і внутрішній вплив Збройних сил Сальвадору можна стримувати доти, доки кошти з Вашинґтона продовжують надходити. Чи то встановлюючи умови для нашої допомоги, чи то розширюючи її як знак доброї волі, вони не можуть діяти надто сильно всупереч нам, і для будь-яких цілей, яких ми прагнемо досягти, це неодмінно буде цінним інструментом."
ELS_forpol.23.a: "Жебраки не можуть вибирати, поставмо умови нашій подальшій підтримці."
ELS_forpol.23.b: "Доброзичливі режими приходять і відходять, нам потрібно втримувати їх на плаву."
ELS_Pressure_to_Democratize_tt: "§YМи посилимо тиск на правлячу хунту §BСальвадору§!, щоб вона демократизувалася.§!" 

ELS_forpol.24.t: "Порушення питання Гондурасу"
ELS_forpol.24.desc: "Тривала сесія асамблеї ОАД добігала кінця, коли нарешті було порушено питання Гондурасу. Майже всі представники внутрішньо застогнали, знаючи, що має статися, але, будучи професійними дипломатами, вони вдягли маску ввічливої поваги.\n\nКоли сальвадорський представник піднявся на трибуну, він подякував головуючому й одразу перейшов до підготовленої промови. Вона була ретельно складена, добре досліджена, красномовна й зосереджена на своєму посланні. Вона чітко засуджувала Гондурас, картаючи його постійні прикордонні провокації, підвищення напруженості та відсутність взаємодії чи діалогу щодо спірних територій між двома країнами. Її зустріли такими ж ввічливими напівусмішками.\n\nВона також була цілковито неефективною, як і очікувалося. Спершу було висунуто пропозицію винести звинувачення на голосування — і її відхилили. Потім було висунуто пропозицію передати її до комітету — і її відхилили. Нарешті було поставлено на голосування пропозицію перейти до наступного питання — і її схвалили.\n\nСальвадорець сів на своє місце, очікуючи всього цього. Він виконав свою частину, і протокол це відобразить. Ще один крок, подумав він, у постійному дипломатичному танці, необхідному сучасній епосі."
ELS_forpol.24.a: "Видимість необхідно зберігати."

ELS_forpol.25.t: "Недемократія"
ELS_forpol.25.desc: "ОБМЕЖЕНИЙ ДОСТУП/[GetDateText]\n\nВІД АЛЛЕНА МАКФЕРСОНА\nМЕМОРАНДУМ ДЛЯ ПРЕЗИДЕНТА\n\n1. Після безальтернативної перемоги на виборах у Сальвадорі 1962 року проамериканський президент Хуліо Адальберто Рівера прагнув збалансувати громадську думку та інтереси еліти. Очолюючи PCN, партію, що складається з військових офіцерів і підтримується кавовими олігархами, Рівера у своїх спробах здобути схвалення народу часто суперечить своїй основній групі підтримки.\n\n2. Раніше Рівера проводив заходи з подолання бідності, прагнучи відрізати підтримку комунізму та фашизму від того, що він вважає її джерелом. Тепер, прагнучи ще більше стабілізувати Сальвадор, він працює з Фіделем Санчесом Ернандесом, своєю правою рукою та ймовірним наступником на посаді президента на виборах наступного року, намагаючись провести помірковані профспілкові та аграрні реформи.\n\n3. Попри енергійну поведінку Рівери, його реформи мають обмежений масштаб, і очікується, що більша частина землі залишиться в руках своїх первісних власників. Тим не менш, вони зустрічають сильний опір як з боку військових офіцерів, так і кавових плантаторів.\n\n4. Це останній рік Рівери в Національному палаці, і перед ним стоїть вибір: або проштовхнути реформу, або ще більше обмежити реформи, щоб зберегти основу Партії національного примирення."
ELS_forpol.25.a: "Невелика реформа дає великий результат."
ELS_forpol.25.b: "Стабільність — це те, чого ми найбільше потребуємо в Сальвадорі. Переконайте його послабити реформи."

ELS_forpol.26.t: "Хуліганський бізнес"
ELS_forpol.26.desc: "У наші дні в Сан-Сальвадорі не можна було навіть надрукувати брошуру з китайськими ієрогліфами, не кажучи вже про вивіску. Остання друкарня, що зберігала форми для кандзі, виявила, що її головне приміщення пограбували й підпалили, а на розбитих вікнах висів національний прапор. Коли він пішов оглянути збитки, обережно прикривши очі сонцезахисними окулярами, Кенджі Кікучі помітив, що дрібним шрифтом за прапорами було написано: "ЗРОБЛЕНО В США".\n\nЙого невеликий офіс неподалік центру міста був практично останнім оплотом японського бізнесу в цій жалюгідній, розпеченій країні. Він також залишався відносно непомітним, носячи назву "Cruz del Sol Comercio Internacional" — достатньо буденну, щоб більшість головорізів режиму не зрозуміли, про який саме «Соль» ідеться. Більшість його експорту прямувала до країн, близьких до Сфери, звідки її можна було переправити в павутину японської торгівлі, але це було дорого. Бізнес ледве залишався прибутковим завдяки величезному попиту на каву по всій Азії, дешевизні сальвадорської робочої сили та власній діловій хватці Кенджі. Але навіть цьому скоро мав настати кінець.\n\nВін знав, що хоча режим вдалося обдурити, ФБР — ні. Не треба було бути генієм, щоб простежити суднові маніфести до цієї компанії, майже повністю укомплектованої іноземцями та очолюваної блідошкірим чоловіком, який відмовлявся знімати окуляри навіть у приміщенні й, здавалося, неабияк полюбляв чай та рибу. Тепер це була гра в очікування — чи пришлють Японські острови підтримку й допоможуть утримати головорізів Вашинґтона на відстані, чи його залишать безславно зникнути в цій незначній державі?"
ELS_forpol.26.a: "Ми не можемо дозволити витіснити себе з Центральної Америки. Наш родич кличе на допомогу!"
ELS_forpol.26.b: "Миска найкорисніша, коли вона порожня. Ми чекатимемо кращої нагоди."

ELS_forpol.27.t: "Сальвадорська опозиція"
ELS_forpol.27.desc: "Для американців доктрина Монро щодо встановлення дружніх режимів, можливо, вже стала архаїчною десятиліття тому, але для Мексики є чимало вагомих причин не кидати негайно своїх південних друзів. Майбутні вибори в Сальвадорі дають можливість забезпечити політичну відданість цього неспокійного сусіда Сокало, і тут є чимало очевидних прогалин, які можна використати для досягнення цієї мети.\n\nПопри найпалкіші зусилля сальвадорців викорінити змістовну опозицію, ми все одно багатші, чисельніші та краще оснащені для затяжної війни на виснаження, ніж вони коли-небудь зможуть бути. Наразі будь-які наші дії майже напевно не зіткнуться зі значною відплатою. Тож відтепер, чи то санкціонуючи таємну підтримку від DFS охочим співучасникам, чи просто відправляючи дипломатичних представників, майбутнє Сальвадору можна визначити лише кількома телефонними дзвінками в Мехіко.\n\nПроте відкрите агресивне втручання глибоко обурить як внутрішніх активістів, так і міжнародних критиків, і жоден із них не сприятиме нашому й без того поганому зовнішньому іміджу. Тому питання полягає не стільки в тому, скільки ми можемо здобути, скільки в тому, скільки ми можемо дозволити собі втратити."
ELS_forpol.27.a: "Слова гостріші за кинджали, кількох посланців буде достатньо."

