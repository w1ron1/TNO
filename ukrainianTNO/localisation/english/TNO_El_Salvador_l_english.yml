ELS_forpol.39.t: "Жах у Сальвадорі"
ELS_forpol.39.desc: "Сьогодні вранці надійшла звістка про переворот у центральноамериканській державі Сальвадор, здійснений радикальними соціялістичними повстанцями. Держава, яка десятиліттями потерпала від потрясінь — від експлуатації банановими компаніями до власних олігархів, що наживалися на корупції, — минулої ночі організовані загони ополчення, пов’язані з 'Partido Comunista Salvadoreño (PCS)', за допомогою співучасників увійшли до урядових комплексів та військових казарм і розпочали раптове, жорстоке обезголовлення держави."\n\n"Народні заворушення панували в перші години, а вже за кілька годин було проголошено новий уряд, чия перша публічна заява проголосила націоналізацію всіх підприємств, що належали іноземцям, у стані надзвичайної ситуації. Повідомляється про спонтанні акти насильства проти іноземців та їхнього майна, причому влада майже не перешкоджає цьому насильству, за винятком найбільших промислових активів. Наразі невідомо, що сталося з багатьма громадянами [ROOT.GetAdjective]."\n\n"Міністерство закордонних справ засудило насильство революції та захоплення підприємств [ROOT.GetAdjective] як нібито реакцію на "економічне підкорення". Громадянам наказано уникати поїздок до країни, оскільки нова держава, схоже, позиціонує себе як ворожу до всіх сфер впливу, присутніх у регіоні. Міністерство також зажадало гарантій безпеки громадян [ROOT.GetAdjective], однак жодної відповіді, що пролила б світло на ситуацію, ще не надійшло."
ELS_forpol.39.a: "Чоловік похитав головою й перевів увагу на наступну сторінку газети."

ELS_forpol.40.t: "Правління завжди отримує своє"
ELS_forpol.40.desc: "За вікном Генка сяяв день, прекрасний ранок, якщо він коли-небудь такий бачив. Він підвівся з ліжка, намагаючись не розбудити дружину, яка все ще спала, і довго позіхнув. Промені тепла, здавалося, затримувалися на ньому, коли він вставав, і він насолоджувався їхнім відчуттям.\n\nВін спустився сходами, його ранковий халат недбало тримався на ньому, поки він сонно плентався до обіднього столу, а звуки смаженого сніданку зустріли його саме тоді, коли запах домашнього затишку досяг його. Він вдихнув його й усміхнувся. Він сів на своє звичне місце, усміхаючись, коли перед ним поставили сніданок, і майже інстинктивно потягнувся до своєї газети. Здавалося, вона сама опинилася в його руці. Її заголовок був величним, і він усміхнувся, читаючи його. "Перемога" — солодке слово, за яке він молився.\n\nЙого відвезли на роботу в діловий район, до офісів в одній із найдорожчих будівель. Він розповідав друзям про роботу з кавою в Латинській Америці, і їм спала на думку виснажлива праця на доісторичних плантаціях, але він відкинув ці уявлення. Він був представником компанії, "людиною Дядька Сема для місцевих", як він жартував. Він не працюватиме на якійсь кавовій плантації, його робота була значно кращою за це.\n\nВ офісі все вирувало, майже кожна розмова, яку він чув, стосувалася закінчення Війни. Він тримався осторонь, але все одно усміхався дорогою до свого кабінету. Якщо бути чесним із собою, йому теж хотілося кричати від радості. Він вивчав політику в Принстоні, але не треба було бути генієм, щоб здогадатися, що уряд отримає нову хвилю популярності. Стабільне правління, яке любило США, саме тоді, коли в нього був цілий набір пропозицій щодо розширення, які можна було запропонувати хлопцям у Г'юстоні.\nТак, його голова була забита державними контрактами на відбудову, довірливими інвесторами та місцевими бюрократами з дорогими смаками. Насувався бум, чорт забирай, економіка вже диверсифікувалася. Чому він мав обмежуватися лише експортом?"
ELS_forpol.40.a: "Правління, зрештою, завжди любить позитивний графік."

