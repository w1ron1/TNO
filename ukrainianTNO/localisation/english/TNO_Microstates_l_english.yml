#Leaders
POLITICS_John_XXIII_DESC:0 "Його Святість Іван ХХІІІ, похрещений Анджело Марія Ронкаллі, є діючим Папою Католицької церкви, вікарієм Христа на Землі й духовним лідером для мільйонів католиків усього світу. Народжений у селянській родині на півночі Італії, Анджело вступив до Ордену францисканців. Після висвячення людиною віри, молодий Анджело виявив свій талант адміністратора, стрімко піднімаючись священницькою ієрархією. У Велику війну служив капеланом у Королівській армії Італії. Пізніше Анджело став послом Святого Престолу: коли почалася Друга світова - вже єпископом перебував у Болгарії, таємно допомагаючи місцевим євреям уникнути переслідувань та втекти до Леванту.\n\nПісля війни Анджело відкликав до Риму й підніс до рангу кардинала Папа Пій XII. Коли Пій XII помер у 1958 році, Церква втратила людину, що провела її крізь буремні роки Другої світової. Конклав, розділений між протилежними політичними угрупованнями, вирішив обрати старого й нехаризматичного Папу, який майже нічого не зробив під час свого понтифікату; аби дозволити церковним клікам і надалі вести свої чвари, для цього вони вибрали скромного колишнього нунція Анджело Ронкаллі - більшої помилки й годі було уявити.\n\nПапа Іван XXIII проявив себе енергійним і харизматичним реформатором: незважаючи на свій доктринальний традиціоналізм, новий Папа став жорстким критиком фашистських урядів Європи, виступаючи на захист демократії й засуджуючи в Церкві тих, хто співпрацював із політикою репресій. Як символ надії, що надихає навіть не-католиків, він став загальновизнаним улюбленцем народу, а італійці навіть прозвали його "Добрим Папою", попри його незгоди з фашистським урядом. Хай там як, але Церква, що очолює Іван ХХІІІ, усе ще розділена, а з його віком і погіршенням здоров'я ніхто не знає, чи піде його паства шляхом, який вказав Добрий Папа - мабуть, лиш Бог у своїй безмежній мудрості знає це."

POLITICS_CHARLOTTE_DESC:0 "Принцеса Шарлотта Луїза Жюльєтта Ґрімальді - чинна правителька Князівства Монако, але в більшості днів їй би дуже хотілося нею не бути. Шлях її до влади повен чвар і конфліктів від самого народження, у 1898 році. Позашлюбна дитина принца Луї II, що не мала ні братів, ні сестер, ні законних нащадків, оголошена спадкоємицею (дарма, що це суперечило монеґаським законам) лише для того, аби запобігти успадкуванню князівства дійсним наступником - німецьким принцом, і тим уникнути міжнародної кризи між Францією та Німецькою імперією.\n\nЮна принцеса оженилася з французьким графом: та оскільки він був гомосексуалістом, її шлюб був нещасним, і перш ніж нарешті розлучитися, у неї був досить відомий роман. Під час Другої світової, коли Монако окуповувалося військами Муссоліні, Шарлотта прохала принца Луї II дозволити їй відмовитися від прав на престол, щоб її син - Реньє, став спадкоємцем. Луї відмовився від цієї пропозиції, бо Реньє знаний прихильником справи Союзників. Коли Ось тріумфувала усім світом, принц побоювався, що спадкоємець прирече малесеньку державу на загибель.\n\nНезважаючи на вирішальну перемогу Осі, згуба не настала: Монако прогнулось перед новими володарями Європи, і коли Луї помер у 1949 році, Шарлотта стала княгинею. Тим не менш, її роль в політиці дуже обмежувалася, а більшість влади осіла в руках кліки міністрів і адміністраторів, що крутилися навколо її дедалі діяльнішого Реньє. Покіль Монако все багатішає й гламурнішає, а іноземні зірки та бізнесмени приїздять прогулювати свої статки на його пляжах і в казино - княгиня сидить в своєму палаці, поглядаючи на розкішні готелі й рів'єри. Для когось, Монако є плямою на мапі Європи, упущенням історії; для іншого - дивокрай лихви й вишуканого споживацтва; але для княгині, воно завжди буде кліткою, хоч би якою позолоченою не була."

POLITICS_Leonida_Suzzi_Valli_DESC:0 "Його Превелебність Леоніда Суцці Валлі є новообраним капітаном-реґентом Найяснішої республіки Сан-Марино - крихітної республіки, розташованої на горі Монте-Титано в Апеннінах. Учитель математики й фізики середньої школи за фахом, Валлі згодом доєднався до політичного життя республіки, влаштувавши дипломатичну кар'єру й ставши посланником Сан-Марино в Італії та Німеччині під час Другої світової. Валлі був змушений приєднатися до Санмаринської фашистської партії, щоб продовжити свою політичну кар'єру, незважаючи на обурення фашизмом і його поганими наслідками для колись вільного, демократичного життя його маленької країни.\n\nПісля Другої світової, політична діяльність Валлі тривала, незважаючи на панування фашистів і владної родини Ґозі, що неодноразово назначала своїх посадовців на місце капітана-реґента. Із роками, Валлі став найвідомішим опозиціонером проти Ґозі, і урешті-решт спромігся осісти капітаном-реґентом, із метою перевернути недемократичну та неліберальну політику минулого, а також відновити облуду свободи для давньої республіки.\n\nСан-Марино значно розвинулося за останні кілька десятиліть, незважаючи на стародавні традиції демократії, знеславлені більмом фашизму; старій республіці дошкуляють нові проблеми. Економіка країни дедалі більше залежить від Італії, рівномірно прискоренню індустріалізації й урбанізації, підриваючи омріяну незалежність Сан-Марино, а робітники з пролетарями все більше обурюються інституціями республіки. Тепер Валлі та його спільникам доводиться долати ці тенета проблем, у які потрапила Монте-Титано, намагаючись не привабити небажаної уваги від італійських сусідів."

